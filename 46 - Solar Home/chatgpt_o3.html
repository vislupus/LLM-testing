<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Solar-Home Simulator – Sofia</title>
<style>
body{font-family:system-ui;margin:0;background:#fafafa;display:flex;flex-direction:column;height:100vh}
header{background:#1565C0;color:#fff;padding:6px 10px}
#dash{flex:1;display:grid;grid-template-columns:220px 1fr}
#months button{width:100%;padding:4px;margin:2px;border:1px solid #90CAF9;background:#E3F2FD}
#months .sel{background:#1976D2;color:#fff}
svg{width:100%;height:100%}
</style></head><body>
<header><h2>Solar-Home Simulator • Sofia</h2></header>
<div id="dash">
<div id="months"></div>
<div id="plot">
  <svg viewBox="0 0 800 400" id="svg">
    <rect width="800" height="400" fill="#fff"/>
    <g id="bars"></g>
    <text x="10" y="20" id="info"></text>
  </svg>
</div>
</div>
<script>
const DATA=[
['Jan', -2,2,-6,172,'9h25m',95.03,342.1,109.02],
['Feb',  2,7,-3,237,'10h32m',105.04,378.1,121.78],
['Mar',  5,10,0,284,'11h57m',131.18,472.2,158.19],
['Apr',  9,15,3,342,'13h24m',136.27,490.6,169.87],
['May',14,20,8,392,'14h38m',136.49,491.4,174.87],
['Jun',18,23,12,393,'15h15m',134.44,484.0,175.00],
['Jul',20,26,14,423,'14h56m',145.61,524.2,192.55],
['Aug',20,27,14,400,'13h50m',146.42,527.1,193.44],
['Sep',16,23,10,341,'12h26m',124.9,449.6,160.34],
['Oct',10,17,5,287,'11h00m',112.76,405.9,139.98],
['Nov',6,11,2,233,'9h43m',90.33,325.2,107.48],
['Dec',1,5,-2,210,'9h04m',82.11,295.6,95.54],
];
const MONTHS=document.getElementById('months');
DATA.forEach(([m],i)=>{const b=document.createElement('button');b.textContent=m;
b.onclick=()=>select(i);MONTHS.appendChild(b)});
let sel=0;select(0);
function select(i){
  sel=i; [...MONTHS.children].forEach((b,ix)=>b.classList.toggle('sel',ix===i));
  calc(i); draw();
}
const STATE={battery:10,cap:10,pBattery:0,cost:0,import:0,export:0,appl:[]};
const APPLIANCES=[['Fridge',0.08*24],['Oven',1.8],['Boiler',2.4],['Heat-pump',1.2*6],['Washer',0.7]];
function calc(i){
  const row=DATA[i], sun=row[4], pv=row[6]*8/1000; // kWh per month for 8×450W
  const use=APPLIANCES.reduce((s,[,k])=>s+k,0); // daily kWh
  const monthDays=30, load=use*monthDays;
  let net=pv-load;
  STATE.import=net<0?-net:0; STATE.export=net>0?net:0;
  STATE.cost=(STATE.import*0.25-STATE.export*0.10).toFixed(2);
}
function draw(){
  const bars=document.getElementById('bars'); bars.innerHTML='';
  const w=50, gap=20, y0=350, scale=2;
  [['PV kWh',DATA[sel][6]*8/1000,'#43A047'],
   ['Load kWh',APPLIANCES.reduce((s,[,k])=>s+k,0)*30,'#E53935'],
   ['Import',STATE.import,'#FB8C00'],
   ['Export',STATE.export,'#1E88E5']].forEach(([label,val,col],i)=>{
    const h=val*scale; const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    const x=60+i*(w+gap);
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',x);r.setAttribute('y',y0-h);r.setAttribute('width',w);r.setAttribute('height',h);
    r.setAttribute('fill',col);g.appendChild(r);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',y0-h-6);t.textContent=val.toFixed(1);
    g.appendChild(t);
    bars.appendChild(g);
  });
  document.getElementById('info').textContent=
  `${DATA[sel][0]} • Grid Δ: ${STATE.import.toFixed(1)} in / ${STATE.export.toFixed(1)} out  → ${STATE.cost} BGN`;
}
</script>
</body></html>
