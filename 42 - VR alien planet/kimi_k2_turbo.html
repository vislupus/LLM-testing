<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XENOS - Alien Planet VR Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #vr-button {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }
        
        #vr-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.7);
        }
        
        #title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
        }
        
        #title h1 {
            font-size: 48px;
            letter-spacing: 10px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.8);
            margin-bottom: 10px;
        }
        
        #title p {
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 2px;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 1s;
        }
        
        #loading-text {
            color: #00d4ff;
            font-size: 24px;
            letter-spacing: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        #controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            line-height: 1.6;
        }
        
        #discovery {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff88;
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        }
        
        #discovery.show {
            opacity: 1;
        }
        
        #stats {
            position: absolute;
            top: 30px;
            right: 30px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            text-align: right;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <div id="title">
            <h1>XENOS</h1>
            <p>ALIEN PLANET EXPLORER</p>
        </div>
        
        <div id="controls">
            WASD / Left Stick: Move<br>
            Mouse / Right Stick: Look<br>
            Click / Trigger: Interact<br>
            Space / A: Jump<br>
            Shift / Grip: Sprint
        </div>
        
        <div id="stats">
            Biome: <span id="biome">Unknown</span><br>
            Artifacts: <span id="artifacts">0</span>/12<br>
            Distance: <span id="distance">0</span>m
        </div>
        
        <div id="discovery"></div>
        
        <button id="vr-button">ENTER VR</button>
    </div>
    
    <div id="loading">
        <div id="loading-text">GENERATING ALIEN WORLD...</div>
    </div>

    <script>
        // ==========================================
        // XENOS - WebXR Alien Planet Explorer
        // Complete self-contained implementation
        // ==========================================

        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
        
        if (!gl) {
            alert('WebGL not supported');
        }

        // Global state
        const state = {
            time: 0,
            deltaTime: 0,
            lastTime: performance.now(),
            inVR: false,
            xrSession: null,
            xrReferenceSpace: null,
            collectedArtifacts: 0,
            totalArtifacts: 12,
            currentBiome: 'Crystal Valley',
            playerPos: [0, 2, 0],
            playerVel: [0, 0, 0],
            playerRot: [0, 0],
            onGround: false,
            sprinting: false,
            discovered: new Set(),
            weather: {
                intensity: 0.5,
                wind: [1, 0, 0.5],
                particles: []
            }
        };

        // Input state
        const input = {
            keys: {},
            mouse: { x: 0, y: 0, locked: false },
            gamepad: null,
            vrControllers: []
        };

        // Shader programs
        const shaders = {};

        // Geometry buffers
        const buffers = {};

        // Textures
        const textures = {};

        // Scene objects
        const objects = [];
        const particles = [];
        const wildlife = [];
        const artifacts = [];
        const vegetation = [];
        const ruins = [];

        // Biome definitions
        const biomes = {
            crystalValley: {
                name: 'Crystal Valley',
                groundColor: [0.1, 0.15, 0.25],
                skyColor: [0.05, 0.1, 0.2],
                fogColor: [0.1, 0.15, 0.3],
                fogDensity: 0.02,
                crystalColor: [0, 0.8, 1],
                vegetationColor: [0, 0.6, 0.8],
                hasCrystals: true,
                hasGlowPlants: true
            },
            fungalForest: {
                name: 'Fungal Forest',
                groundColor: [0.15, 0.1, 0.2],
                skyColor: [0.1, 0.05, 0.15],
                fogColor: [0.2, 0.1, 0.25],
                fogDensity: 0.03,
                vegetationColor: [0.8, 0.3, 0.6],
                hasMushrooms: true,
                hasSpores: true
            },
            acidMarsh: {
                name: 'Acid Marsh',
                groundColor: [0.2, 0.25, 0.1],
                skyColor: [0.15, 0.2, 0.05],
                fogColor: [0.3, 0.4, 0.1],
                fogDensity: 0.025,
                waterColor: [0.6, 0.8, 0.2],
                hasBubbles: true,
                hasToxicPlants: true
            },
            obsidianWastes: {
                name: 'Obsidian Wastes',
                groundColor: [0.05, 0.05, 0.05],
                skyColor: [0.02, 0.02, 0.03],
                fogColor: [0.1, 0.1, 0.12],
                fogDensity: 0.015,
                hasLava: true,
                hasHeatShimmer: true
            }
        };

        let currentBiome = biomes.crystalValley;

        // ==========================================
        // SHADER UTILITIES
        // ==========================================

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            
            return shader;
        }

        function createProgram(vsSource, fsSource) {
            const vs = compileShader(gl.VERTEX_SHADER, vsSource);
            const fs = compileShader(gl.FRAGMENT_SHADER, fsSource);
            
            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
                return null;
            }
            
            return program;
        }

        // ==========================================
        // SHADER SOURCES
        // ==========================================

        const terrainVS = `#version 300 es
            precision highp float;
            
            in vec3 a_position;
            in vec3 a_normal;
            in vec2 a_texCoord;
            
            uniform mat4 u_modelMatrix;
            uniform mat4 u_viewMatrix;
            uniform mat4 u_projectionMatrix;
            uniform mat3 u_normalMatrix;
            
            out vec3 v_worldPos;
            out vec3 v_normal;
            out vec2 v_texCoord;
            out float v_height;
            
            void main() {
                vec4 worldPos = u_modelMatrix * vec4(a_position, 1.0);
                v_worldPos = worldPos.xyz;
                v_normal = normalize(u_normalMatrix * a_normal);
                v_texCoord = a_texCoord;
                v_height = a_position.y;
                
                gl_Position = u_projectionMatrix * u_viewMatrix * worldPos;
            }
        `;

        const terrainFS = `#version 300 es
            precision highp float;
            
            in vec3 v_worldPos;
            in vec3 v_normal;
            in vec2 v_texCoord;
            in float v_height;
            
            uniform vec3 u_cameraPos;
            uniform vec3 u_lightDir;
            uniform vec3 u_fogColor;
            uniform float u_fogDensity;
            uniform float u_time;
            uniform vec3 u_groundColor;
            
            out vec4 fragColor;
            
            // Noise functions
            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
            }
            
            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float a = hash(i);
                float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0));
                float d = hash(i + vec2(1.0, 1.0));
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }
            
            float fbm(vec2 p) {
                float value = 0.0;
                float amplitude = 0.5;
                for(int i = 0; i < 5; i++) {
                    value += amplitude * noise(p);
                    p *= 2.0;
                    amplitude *= 0.5;
                }
                return value;
            }
            
            void main() {
                // Base terrain color with detail
                vec2 uv = v_texCoord * 50.0;
                float detail = fbm(uv);
                
                vec3 color = u_groundColor;
                color = mix(color, color * 0.7, detail);
                
                // Height-based coloring
                color = mix(color, color * 1.3, smoothstep(-5.0, 10.0, v_height));
                
                // Add crystal-like patterns
                float crystal = sin(v_worldPos.x * 0.5) * sin(v_worldPos.z * 0.5);
                crystal = pow(abs(crystal), 4.0);
                color += vec3(0.0, 0.3, 0.5) * crystal * 0.3;
                
                // Lighting
                float diff = max(dot(v_normal, -u_lightDir), 0.0);
                vec3 ambient = color * 0.3;
                vec3 lit = color * diff;
                
                // Fog
                float dist = length(v_worldPos - u_cameraPos);
                float fogFactor = exp(-u_fogDensity * dist);
                
                vec3 finalColor = mix(u_fogColor, ambient + lit, fogFactor);
                
                // Glow effect near crystals
                float glow = crystal * exp(-dist * 0.1) * 0.5;
                finalColor += vec3(0.0, 0.8, 1.0) * glow;
                
                fragColor = vec4(finalColor, 1.0);
            }
        `;

        const crystalVS = `#version 300 es
            precision highp float;
            
            in vec3 a_position;
            in vec3 a_normal;
            
            uniform mat4 u_modelMatrix;
            uniform mat4 u_viewMatrix;
            uniform mat4 u_projectionMatrix;
            uniform mat3 u_normalMatrix;
            uniform float u_time;
            uniform vec3 u_crystalColor;
            
            out vec3 v_worldPos;
            out vec3 v_normal;
            out vec3 v_color;
            out float v_glow;
            
            void main() {
                vec3 pos = a_position;
                
                // Pulsing glow effect
                float pulse = sin(u_time * 2.0 + pos.y * 0.5) * 0.1 + 1.0;
                v_glow = pulse;
                
                vec4 worldPos = u_modelMatrix * vec4(pos, 1.0);
                v_worldPos = worldPos.xyz;
                v_normal = normalize(u_normalMatrix * a_normal);
                v_color = u_crystalColor * pulse;
                
                gl_Position = u_projectionMatrix * u_viewMatrix * worldPos;
            }
        `;

        const crystalFS = `#version 300 es
            precision highp float;
            
            in vec3 v_worldPos;
            in vec3 v_normal;
            in vec3 v_color;
            in float v_glow;
            
            uniform vec3 u_cameraPos;
            uniform vec3 u_lightDir;
            uniform vec3 u_fogColor;
            uniform float u_fogDensity;
            uniform float u_time;
            
            out vec4 fragColor;
            
            void main() {
                // Crystal transparency and refraction effect
                float fresnel = pow(1.0 - abs(dot(normalize(u_cameraPos - v_worldPos), v_normal)), 2.0);
                
                // Internal glow
                vec3 glowColor = v_color * (1.0 + v_glow * 2.0);
                
                // Specular highlight
                vec3 viewDir = normalize(u_cameraPos - v_worldPos);
                vec3 halfDir = normalize(-u_lightDir + viewDir);
                float spec = pow(max(dot(v_normal, halfDir), 0.0), 128.0);
                
                vec3 color = glowColor * 0.5 + vec3(spec) * 0.8;
                color += v_color * fresnel * 2.0;
                
                // Fog
                float dist = length(v_worldPos - u_cameraPos);
                float fogFactor = exp(-u_fogDensity * dist);
                
                vec3 finalColor = mix(u_fogColor, color, fogFactor);
                
                // Add bloom-like glow
                finalColor += v_color * v_glow * 0.5 * exp(-dist * 0.05);
                
                fragColor = vec4(finalColor, 0.9);
            }
        `;

        const vegetationVS = `#version 300 es
            precision highp float;
            
            in vec3 a_position;
            in vec3 a_normal;
            in vec2 a_texCoord;
            
            uniform mat4 u_modelMatrix;
            uniform mat4 u_viewMatrix;
            uniform mat4 u_projectionMatrix;
            uniform mat3 u_normalMatrix;
            uniform float u_time;
            uniform vec3 u_windDir;
            
            out vec3 v_worldPos;
            out vec3 v_normal;
            out vec2 v_texCoord;
            out float v_glow;
            
            void main() {
                vec3 pos = a_position;
                
                // Wind animation
                float windStrength = pos.y * 0.1;
                vec3 windOffset = u_windDir * sin(u_time * 2.0 + pos.x * 0.5) * windStrength;
                pos += windOffset;
                
                vec4 worldPos = u_modelMatrix * vec4(pos, 1.0);
                v_worldPos = worldPos.xyz;
                v_normal = normalize(u_normalMatrix * a_normal);
                v_texCoord = a_texCoord;
                v_glow = sin(u_time * 3.0 + pos.x) * 0.5 + 0.5;
                
                gl_Position = u_projectionMatrix * u_viewMatrix * worldPos;
            }
        `;

        const vegetationFS = `#version 300 es
            precision highp float;
            
            in vec3 v_worldPos;
            in vec3 v_normal;
            in vec2 v_texCoord;
            in float v_glow;
            
            uniform vec3 u_cameraPos;
            uniform vec3 u_lightDir;
            uniform vec3 u_fogColor;
            uniform float u_fogDensity;
            uniform vec3 u_vegetationColor;
            uniform float u_time;
            
            out vec4 fragColor;
            
            void main() {
                // Bioluminescent pattern
                float pattern = sin(v_texCoord.x * 20.0) * sin(v_texCoord.y * 20.0 + u_time);
                pattern = smoothstep(0.3, 0.7, pattern);
                
                vec3 color = u_vegetationColor;
                color += vec3(0.5, 0.8, 1.0) * pattern * v_glow;
                
                // Lighting
                float diff = max(dot(v_normal, -u_lightDir), 0.0);
                vec3 ambient = color * 0.4;
                vec3 lit = color * diff;
                
                // Fog
                float dist = length(v_worldPos - u_cameraPos);
                float fogFactor = exp(-u_fogDensity * dist);
                
                vec3 finalColor = mix(u_fogColor, ambient + lit, fogFactor);
                
                // Glow in darkness
                finalColor += vec3(0.0, 0.5, 0.8) * v_glow * 0.3 * exp(-dist * 0.1);
                
                fragColor = vec4(finalColor, 1.0);
            }
        `;

        const particleVS = `#version 300 es
            precision highp float;
            
            in vec3 a_position;
            in float a_size;
            in vec3 a_color;
            in float a_alpha;
            
            uniform mat4 u_viewMatrix;
            uniform mat4 u_projectionMatrix;
            
            out vec3 v_color;
            out float v_alpha;
            
            void main() {
                v_color = a_color;
                v_alpha = a_alpha;
                
                vec4 viewPos = u_viewMatrix * vec4(a_position, 1.0);
                gl_Position = u_projectionMatrix * viewPos;
                gl_PointSize = a_size * (100.0 / -viewPos.z);
            }
        `;

        const particleFS = `#version 300 es
            precision highp float;
            
            in vec3 v_color;
            in float v_alpha;
            
            out vec4 fragColor;
            
            void main() {
                // Circular particle
                vec2 coord = gl_PointCoord - vec2(0.5);
                float dist = length(coord);
                if(dist > 0.5) discard;
                
                float glow = 1.0 - dist * 2.0;
                glow = pow(glow, 2.0);
                
                fragColor = vec4(v_color, v_alpha * glow);
            }
        `;

        const skyVS = `#version 300 es
            precision highp float;
            
            in vec3 a_position;
            
            uniform mat4 u_viewMatrix;
            uniform mat4 u_projectionMatrix;
            
            out vec3 v_dir;
            
            void main() {
                v_dir = a_position;
                gl_Position = u_projectionMatrix * u_viewMatrix * vec4(a_position * 1000.0, 1.0);
            }
        `;

        const skyFS = `#version 300 es
            precision highp float;
            
            in vec3 v_dir;
            
            uniform vec3 u_skyColor;
            uniform vec3 u_horizonColor;
            uniform float u_time;
            
            out vec4 fragColor;
            
            float hash(vec3 p) {
                return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
            }
            
            float noise(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                float n = hash(i);
                return n;
            }
            
            void main() {
                vec3 dir = normalize(v_dir);
                float y = dir.y;
                
                // Gradient sky
                vec3 color = mix(u_horizonColor, u_skyColor, smoothstep(-0.2, 0.8, y));
                
                // Stars
                float stars = noise(dir * 500.0);
                stars = pow(stars, 20.0) * smoothstep(0.0, 0.5, y);
                color += vec3(stars);
                
                // Nebula clouds
                float nebula = noise(dir * 10.0 + u_time * 0.01);
                nebula += noise(dir * 20.0 - u_time * 0.02) * 0.5;
                nebula = pow(nebula, 3.0) * 0.3;
                color += vec3(0.2, 0.0, 0.4) * nebula * smoothstep(0.0, 0.8, y);
                
                // Alien suns
                float sun1 = 1.0 - length(dir - vec3(0.3, 0.4, 0.5));
                sun1 = pow(max(sun1, 0.0), 20.0);
                color += vec3(1.0, 0.8, 0.4) * sun1;
                
                float sun2 = 1.0 - length(dir - vec3(-0.5, 0.2, -0.3));
                sun2 = pow(max(sun2, 0.0), 15.0);
                color += vec3(0.4, 0.8, 1.0) * sun2 * 0.5;
                
                fragColor = vec4(color, 1.0);
            }
        `;

        const artifactVS = `#version 300 es
            precision highp float;
            
            in vec3 a_position;
            in vec3 a_normal;
            
            uniform mat4 u_modelMatrix;
            uniform mat4 u_viewMatrix;
            uniform mat4 u_projectionMatrix;
            uniform mat3 u_normalMatrix;
            uniform float u_time;
            uniform float u_collected;
            
            out vec3 v_worldPos;
            out vec3 v_normal;
            out float v_glow;
            
            void main() {
                vec3 pos = a_position;
                
                // Floating animation
                pos.y += sin(u_time * 2.0) * 0.2;
                
                // Rotation
                float c = cos(u_time);
                float s = sin(u_time);
                mat2 rot = mat2(c, -s, s, c);
                pos.xz = rot * pos.xz;
                
                // Collected shrink effect
                pos *= (1.0 - u_collected);
                
                vec4 worldPos = u_modelMatrix * vec4(pos, 1.0);
                v_worldPos = worldPos.xyz;
                v_normal = normalize(u_normalMatrix * a_normal);
                v_glow = 1.0 + sin(u_time * 5.0) * 0.5;
                
                gl_Position = u_projectionMatrix * u_viewMatrix * worldPos;
            }
        `;

        const artifactFS = `#version 300 es
            precision highp float;
            
            in vec3 v_worldPos;
            in vec3 v_normal;
            in float v_glow;
            
            uniform vec3 u_cameraPos;
            uniform vec3 u_fogColor;
            uniform float u_fogDensity;
            uniform float u_time;
            
            out vec4 fragColor;
            
            void main() {
                // Metallic gold look
                vec3 color = vec3(0.8, 0.6, 0.2);
                
                // Energy patterns
                float energy = sin(v_worldPos.x * 10.0 + u_time * 3.0) * 
                              sin(v_worldPos.y * 10.0 + u_time * 2.0) *
                              sin(v_worldPos.z * 10.0 + u_time * 4.0);
                energy = smoothstep(0.5, 1.0, energy);
                
                color += vec3(0.0, 0.8, 1.0) * energy * v_glow;
                
                // Specular
                vec3 viewDir = normalize(u_cameraPos - v_worldPos);
                float fresnel = pow(1.0 - abs(dot(viewDir, v_normal)), 3.0);
                color += vec3(1.0) * fresnel * 0.5;
                
                // Fog
                float dist = length(v_worldPos - u_cameraPos);
                float fogFactor = exp(-u_fogDensity * dist);
                
                vec3 finalColor = mix(u_fogColor, color, fogFactor);
                
                // Glow
                finalColor += vec3(0.0, 0.8, 1.0) * v_glow * 0.3 * exp(-dist * 0.1);
                
                fragColor = vec4(finalColor, 1.0);
            }
        `;

        const wildlifeVS = `#version 300 es
            precision highp float;
            
            in vec3 a_position;
            in vec3 a_normal;
            
            uniform mat4 u_modelMatrix;
            uniform mat4 u_viewMatrix;
            uniform mat4 u_projectionMatrix;
            uniform mat3 u_normalMatrix;
            uniform float u_time;
            
            out vec3 v_worldPos;
            out vec3 v_normal;
            out float v_pulse;
            
            void main() {
                vec3 pos = a_position;
                
                // Organic pulsing
                float pulse = sin(u_time * 4.0 + length(pos) * 2.0) * 0.1 + 1.0;
                pos *= pulse;
                v_pulse = pulse;
                
                vec4 worldPos = u_modelMatrix * vec4(pos, 1.0);
                v_worldPos = worldPos.xyz;
                v_normal = normalize(u_normalMatrix * a_normal);
                
                gl_Position = u_projectionMatrix * u_viewMatrix * worldPos;
            }
        `;

        const wildlifeFS = `#version 300 es
            precision highp float;
            
            in vec3 v_worldPos;
            in vec3 v_normal;
            in float v_pulse;
            
            uniform vec3 u_cameraPos;
            uniform vec3 u_lightDir;
            uniform vec3 u_fogColor;
            uniform float u_fogDensity;
            uniform vec3 u_color;
            
            out vec4 fragColor;
            
            void main() {
                vec3 color = u_color * v_pulse;
                
                // Bioluminescent spots
                float spots = sin(v_worldPos.x * 20.0) * sin(v_worldPos.y * 20.0) * sin(v_worldPos.z * 20.0);
                spots = smoothstep(0.7, 1.0, spots);
                color += vec3(0.0, 1.0, 0.5) * spots * 2.0;
                
                // Lighting

        function createPlane(size, segments) {
            const positions = [];
            const normals = [];
            const texCoords = [];
            const indices = [];
            
            const step = size / segments;
            const offset = size / 2;
            
            for (let i = 0; i <= segments; i++) {
                for (let j = 0; j <= segments; j++) {
                    const x = j * step - offset;
                    const z = i * step - offset;
                    
                    positions.push(x, 0, z);
                    normals.push(0, 1, 0);
                    texCoords.push(j / segments, i / segments);
                }
            }
            
            for (let i = 0; i < segments; i++) {
                for (let j = 0; j < segments; j++) {
                    const a = i * (segments + 1) + j;
                    const b = a + 1;
                    const c = (i + 1) * (segments + 1) + j;
                    const d = c + 1;
                    
                    indices.push(a, c, b);
                    indices.push(b, c, d);
                }
            }
            
            return { positions, normals, texCoords, indices };
        }

        function createTerrain(size, segments, heightScale) {
            const positions = [];
            const normals = [];
            const texCoords = [];
            const indices = [];
            
            const step = size / segments;
            const offset = size / 2;
            
            // Simple noise function for terrain
            function noise(x, z) {
                return Math.sin(x * 0.1) * Math.cos(z * 0.1) * 2 +
                       Math.sin(x * 0.3 + 1) * Math.cos(z * 0.3) * 1 +
                       Math.sin(x * 0.05) * Math.sin(z * 0.05) * 5;
            }
            
            for (let i = 0; i <= segments; i++) {
                for (let j = 0; j <= segments; j++) {
                    const x = j * step - offset;
                    const z = i * step - offset;
                    const y = noise(x, z) * heightScale;
                    
                    positions.push(x, y, z);
                    texCoords.push(j / segments, i / segments);
                }
            }
            
            // Calculate normals
            for (let i = 0; i <= segments; i++) {
                for (let j = 0; j <= segments; j++) {
                    const idx = i * (segments + 1) + j;
                    const x = positions[idx * 3];
                    const y = positions[idx * 3 + 1];
                    const z = positions[idx * 3 + 2];
                    
                    // Sample neighbors for normal calculation
                    const left = j > 0 ? positions[(idx - 1) * 3 + 1] : y;
                    const right = j < segments ? positions[(idx + 1) * 3 + 1] : y;
                    const up = i > 0 ? positions[(idx - segments - 1) * 3 + 1] : y;
                    const down = i < segments ? positions[(idx + segments + 1) * 3 + 1] : y;
                    
                    const nx = left - right;
                    const nz = up - down;
                    const len = Math.sqrt(nx * nx + 4 + nz * nz);
                    
                    normals.push(nx / len, 2 / len, nz / len);
                }
            }
            
            for (let i = 0; i < segments; i++) {
                for (let j = 0; j < segments; j++) {
                    const a = i * (segments + 1) + j;
                    const b = a + 1;
                    const c = (i + 1) * (segments + 1) + j;
                    const d = c + 1;
                    
                    indices.push(a, c, b);
                    indices.push(b, c, d);
                }
            }
            
            return { positions, normals, texCoords, indices };
        }

        function createCrystal() {
            const positions = [];
            const normals = [];
            const indices = [];
            
            // Crystal is a pyramid-like shape
            const height = 3 + Math.random() * 2;
            const base = 0.5 + Math.random() * 0.5;
            const sides = 6;
            
            // Top point
            positions.push(0, height, 0);
            normals.push(0, 1, 0);
            
            // Base vertices
            for (let i = 0; i < sides; i++) {
                const angle = (i / sides) * Math.PI * 2;
                const x = Math.cos(angle) * base;
                const z = Math.sin(angle) * base;
                positions.push(x, 0, z);
                
                // Normal for each face
                const nx = Math.cos(angle + Math.PI / sides);
                const nz = Math.sin(angle + Math.PI / sides);
                normals.push(nx, 0.5, nz);
            }
            
            // Indices for faces
            for (let i = 0; i < sides; i++) {
                const next = (i + 1) % sides;
                indices.push(0, i + 1, next + 1);
            }
            
            // Base
            const centerIdx = positions.length / 3;
            positions.push(0, 0, 0);
            normals.push(0, -1, 0);
            
            for (let i = 0; i < sides; i++) {
                const next = (i + 1) % sides;
                indices.push(centerIdx, next + 1, i + 1);
            }
            
            return { positions, normals, texCoords: [], indices };
        }

        function createVegetation(type) {
