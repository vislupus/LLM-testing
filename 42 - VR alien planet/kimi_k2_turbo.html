                        const c = (i + 1) * (slices + 1) + j;
                        const d = c + 1;
                        
                        indices.push(a, c, b);
                        indices.push(b, c, d);
                    }
                }
            }
            
            return { positions, normals, texCoords, indices };
        }

        function createArtifact() {
            const positions = [];
            const normals = [];
            const indices = [];
            
            // Complex geometric shape
            const t = (1 + Math.sqrt(5)) / 2;
            const vertices = [
                [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
                [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
                [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]
            ];
            
            // Scale down
            const scale = 0.3;
            vertices.forEach(v => {
                positions.push(v[0] * scale, v[1] * scale, v[2] * scale);
                
                // Calculate normal
                const len = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
                normals.push(v[0] / len, v[1] / len, v[2] / len);
            });
            
            // Icosahedron faces
            const faces = [
                [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
                [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
                [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
                [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
            ];
            
            faces.forEach(f => {
                indices.push(f[0], f[1], f[2]);
            });
            
            return { positions, normals, texCoords: [], indices };
        }

        function createWildlife(type) {
            const positions = [];
            const normals = [];
            const indices = [];
            
            if (type === 'floater') {
                // Floating jellyfish-like creature
                const segments = 16;
                const rings = 8;
                
                for (let i = 0; i <= rings; i++) {
                    const v = i / rings;
                    const y = Math.cos(v * Math.PI) * 0.5;
                    const r = Math.sin(v * Math.PI) * 0.5;
                    
                    for (let j = 0; j <= segments; j++) {
                        const u = j / segments;
                        const angle = u * Math.PI * 2;
                        
                        const x = Math.cos(angle) * r;
                        const z = Math.sin(angle) * r;
                        
                        positions.push(x, y, z);
                        
                        const nx = Math.cos(angle);
                        const nz = Math.sin(angle);
                        const ny = y;
                        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                        normals.push(nx / len, ny / len, nz / len);
                    }
                }
                
                for (let i = 0; i < rings; i++) {
                    for (let j = 0; j < segments; j++) {
                        const a = i * (segments + 1) + j;
                        const b = a + 1;
                        const c = (i + 1) * (segments + 1) + j;
                        const d = c + 1;
                        
                        indices.push(a, c, b);
                        indices.push(b, c, d);
                    }
                }
            } else if (type === 'crawler') {
                // Multi-segment crawling creature
                const segments = 6;
                const rings = 4;
                
                for (let s = 0; s < segments; s++) {
                    const segmentOffset = s * 0.8;
                    const radius = 0.2 - s * 0.02;
                    
                    for (let i = 0; i <= rings; i++) {
                        const y = (i / rings) * 2 * radius - radius;
                        const r = Math.sqrt(radius * radius - y * y);
                        
                        for (let j = 0; j <= 8; j++) {
                            const angle = (j / 8) * Math.PI * 2;
                            const x = Math.cos(angle) * r + segmentOffset;
                            const z = Math.sin(angle) * r;
                            
                            positions.push(x, y, z);
                            normals.push(Math.cos(angle), 0, Math.sin(angle));
                        }
                    }
                }
                
                // Create indices for each segment
                for (let s = 0; s < segments; s++) {
                    const base = s * (rings + 1) * 9;
                    for (let i = 0; i < rings; i++) {
                        for (let j = 0; j < 8; j++) {
                            const a = base + i * 9 + j;
                            const b = a + 1;
                            const c = base + (i + 1) * 9 + j;
                            const d = c + 1;
                            
                            indices.push(a, c, b);
                            indices.push(b, c, d);
                        }
                    }
                }
            }
            
            return { positions, normals, texCoords: [], indices };
        }

        function createRuin() {
            const positions = [];
            const normals = [];
            const texCoords = [];
            const indices = [];
            
            // Broken arch structure
            const segments = 12;
            const radius = 3;
            const thickness = 0.5;
            
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                
                // Broken parts
                if (i > 3 && i < 9) continue;
                
                for (let j = 0; j <= 4; j++) {
                    const t = j / 4;
                    const r = thickness * (1 - t * 0.3);
                    
                    const px = x + Math.cos(angle + Math.PI / 2) * r;
                    const py = y;
                    const pz = Math.sin(angle + Math.PI / 2) * r;
                    
                    positions.push(px, py, pz);
                    normals.push(Math.cos(angle), Math.sin(angle), 0);
                    texCoords.push(t, i / segments);
                }
            }
            
            // Create faces
            let idx = 0;
            for (let i = 0; i < segments; i++) {
                if (i >= 3 && i < 9) continue;
                
                for (let j = 0; j < 4; j++) {
                    const a = idx;
                    const b = idx + 1;
                    const c = idx + 5;
                    const d = idx + 4;
                    
                    indices.push(a, c, b);
                    indices.push(a, d, c);
                    
                    idx++;
                }
                idx++;
            }
            
            return { positions, normals, texCoords, indices };
        }

        function createSkybox() {
            const positions = [];
            
            // Simple cube
            const size = 1;
            const verts = [
                // Front
                [-size, -size, size], [size, -size, size], [size, size, size], [-size, size, size],
                // Back
                [size, -size, -size], [-size, -size, -size], [-size, size, -size], [size, size, -size],
                // Top
                [-size, size, size], [size, size, size], [size, size, -size], [-size, size, -size],
                // Bottom
                [-size, -size, -size], [size, -size, -size], [size, -size, size], [-size, -size, size],
                // Right
                [size, -size, size], [size, -size, -size], [size, size, -size], [size, size, size],
                // Left
                [-size, -size, -size], [-size, -size, size], [-size, size, size], [-size, size, -size]
            ];
            
            verts.forEach(v => positions.push(...v));
            
            return { positions };
        }

        // ==========================================
        // BUFFER CREATION
        // ==========================================

        function createBuffer(data, type = gl.ARRAY_BUFFER) {
            const buffer = gl.createBuffer();
            gl.bindBuffer(type, buffer);
            
            if (type === gl.ARRAY_BUFFER) {
                gl.bufferData(type, new Float32Array(data), gl.STATIC_DRAW);
            } else {
                gl.bufferData(type, new Uint16Array(data), gl.STATIC_DRAW);
            }
            
            return buffer;
        }

        function createVAO(program, attributes) {
            const vao = gl.createVertexArray();
            gl.bindVertexArray(vao);
            
            for (const name in attributes) {
                const attr = attributes[name];
                const location = gl.getAttribLocation(program, name);
                
                if (location >= 0) {
                    gl.bindBuffer(gl.ARRAY_BUFFER, attr.buffer);
                    gl.enableVertexArrayAttrib(vao, location);
                    gl.vertexAttribPointer(location, attr.size, gl.FLOAT, false, 0, 0);
                }
            }
            
            gl.bindVertexArray(null);
            return vao;
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================

        function initShaders() {
            shaders.terrain = createProgram(terrainVS, terrainFS);
            shaders.crystal = createProgram(crystalVS, crystalFS);
            shaders.vegetation = createProgram(vegetationVS, vegetationFS);
            shaders.particle = createProgram(particleVS, particleFS);
            shaders.sky = createProgram(skyVS, skyFS);
            shaders.artifact = createProgram(artifactVS, artifactFS);
            shaders.wildlife = createProgram(wildlifeVS, wildlifeFS);
        }

        function initBuffers() {
            // Terrain
            const terrainGeo = createTerrain(200, 100, 3);
            buffers.terrain = {
                position: createBuffer(terrainGeo.positions),
                normal: createBuffer(terrainGeo.normals),
                texCoord: createBuffer(terrainGeo.texCoords),
                index: createBuffer(terrainGeo.indices, gl.ELEMENT_ARRAY_BUFFER),
                count: terrainGeo.indices.length
            };
            
            // Crystals
            const crystalGeo = createCrystal();
            buffers.crystal = {
                position: createBuffer(crystalGeo.positions),
                normal: createBuffer(crystalGeo.normals),
                index: createBuffer(crystalGeo.indices, gl.ELEMENT_ARRAY_BUFFER),
                count: crystalGeo.indices.length
            };
            
            // Vegetation
            const vegGeo = createVegetation('tall');
            buffers.vegetation = {
                position: createBuffer(vegGeo.positions),
                normal: createBuffer(vegGeo.normals),
                texCoord: createBuffer(vegGeo.texCoords),
                index: createBuffer(vegGeo.indices, gl.ELEMENT_ARRAY_BUFFER),
                count: vegGeo.indices.length
            };
            
            // Bulb vegetation
            const bulbGeo = createVegetation('bulb');
            buffers.bulb = {
                position: createBuffer(bulbGeo.positions),
                normal: createBuffer(bulbGeo.normals),
                texCoord: createBuffer(bulbGeo.texCoords),
                index: createBuffer(bulbGeo.indices, gl.ELEMENT_ARRAY_BUFFER),
                count: bulbGeo.indices.length
            };
            
            // Artifacts
            const artifactGeo = createArtifact();
            buffers.artifact = {
                position: createBuffer(artifactGeo.positions),
                normal: createBuffer(artifactGeo.normals),
                index: createBuffer(artifactGeo.indices, gl.ELEMENT_ARRAY_BUFFER),
                count: artifactGeo.indices.length
            };
            
            // Wildlife
            const floaterGeo = createWildlife('floater');
            buffers.floater = {
                position: createBuffer(floaterGeo.positions),
                normal: createBuffer(floaterGeo.normals),
                index: createBuffer(floaterGeo.indices, gl.ELEMENT_ARRAY_BUFFER),
                count: floaterGeo.indices.length
            };
            
            // Ruins
            const ruinGeo = createRuin();
            buffers.ruin = {
                position: createBuffer(ruinGeo.positions),
                normal: createBuffer(ruinGeo.normals),
                texCoord: createBuffer(ruinGeo.texCoords),
                index: createBuffer(ruinGeo.indices, gl.ELEMENT_ARRAY_BUFFER),
                count: ruinGeo.indices.length
            };
            
            // Skybox
            const skyGeo = createSkybox();
            buffers.sky = {
                position: createBuffer(skyGeo.positions),
                count: 24
            };
            
            // Particle system
            const particleCount = 1000;
            const particlePositions = new Float32Array(particleCount * 3);
            const particleSizes = new Float32Array(particleCount);
            const particleColors = new Float32Array(particleCount * 3);
            const particleAlphas = new Float32Array(particleCount);
            
            for (let i = 0; i < particleCount; i++) {
                particlePositions[i * 3] = (Math.random() - 0.5) * 100;
                particlePositions[i * 3 + 1] = Math.random() * 30;
                particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 100;
                particleSizes[i] = Math.random() * 3 + 1;
                particleColors[i * 3] = Math.random();
                particleColors[i * 3 + 1] = Math.random();
                particleColors[i * 3 + 2] = Math.random();
                particleAlphas[i] = Math.random() * 0.5 + 0.3;
            }
            
            buffers.particles = {
                position: createBuffer(particlePositions),
                size: createBuffer(particleSizes),
                color: createBuffer(particleColors),
                alpha: createBuffer(particleAlphas),
                count: particleCount,
                data: {
                    positions: particlePositions,
                    velocities: new Float32Array(particleCount * 3)
                }
            };
            
            // Initialize particle velocities
            for (let i = 0; i < particleCount; i++) {
                buffers.particles.data.velocities[i * 3] = (Math.random() - 0.5) * 0.1;
                buffers.particles.data.velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.05;
                buffers.particles.data.velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
            }
        }

        function initVAOs() {
            // Terrain VAO
            buffers.terrain.vao = createVAO(shaders.terrain, {
                a_position: { buffer: buffers.terrain.position, size: 3 },
                a_normal: { buffer: buffers.terrain.normal, size: 3 },
                a_texCoord: { buffer: buffers.terrain.texCoord, size: 2 }
            });
            
            // Crystal VAO
            buffers.crystal.vao = createVAO(shaders.crystal, {
                a_position: { buffer: buffers.crystal.position, size: 3 },
                a_normal: { buffer: buffers.crystal.normal, size: 3 }
            });
            
            // Vegetation VAOs
            buffers.vegetation.vao = createVAO(shaders.vegetation, {
                a_position: { buffer: buffers.vegetation.position, size: 3 },
                a_normal: { buffer: buffers.vegetation.normal, size: 3 },
                a_texCoord: { buffer: buffers.vegetation.texCoord, size: 2 }
            });
            
            buffers.bulb.vao = createVAO(shaders.vegetation, {
                a_position: { buffer: buffers.bulb.position, size: 3 },
                a_normal: { buffer: buffers.bulb.normal, size: 3 },
                a_texCoord: { buffer: buffers.bulb.texCoord, size: 2 }
            });
            
            // Artifact VAO
            buffers.artifact.vao = createVAO(shaders.artifact, {
                a_position: { buffer: buffers.artifact.position, size: 3 },
                a_normal: { buffer: buffers.artifact.normal, size: 3 }
            });
            
            // Wildlife VAO
            buffers.floater.vao = createVAO(shaders.wildlife, {
                a_position: { buffer: buffers.floater.position, size: 3 },
                a_normal: { buffer: buffers.floater.normal, size: 3 }
            });
            
            // Ruin VAO
            buffers.ruin.vao = createVAO(shaders.terrain, {
                a_position: { buffer: buffers.ruin.position, size: 3 },
                a_normal: { buffer: buffers.ruin.normal, size: 3 },
                a_texCoord: { buffer: buffers.ruin.texCoord, size: 2 }
            });
            
            // Sky VAO
            buffers.sky.vao = createVAO(shaders.sky, {
                a_position: { buffer: buffers.sky.position, size: 3 }
            });
            
            // Particle VAO
            const particleProgram = shaders.particle;
            buffers.particles.vao = gl.createVertexArray();
            gl.bindVertexArray(buffers.particles.vao);
            
            const posLoc = gl.getAttribLocation(particleProgram, 'a_position');
            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.particles.position);
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
            
            const sizeLoc = gl.getAttribLocation(particleProgram, 'a_size');
            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.particles.size);
            gl.enableVertexAttribArray(sizeLoc);
            gl.vertexAttribPointer(sizeLoc, 1, gl.FLOAT, false, 0, 0);
            
            const colorLoc = gl.getAttribLocation(particleProgram, 'a_color');
            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.particles.color);
            gl.enableVertexAttribArray(colorLoc);
            gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);
            
            const alphaLoc = gl.getAttribLocation(particleProgram, 'a_alpha');
            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.particles.alpha);
            gl.enableVertexAttribArray(alphaLoc);
            gl.vertexAttribPointer(alphaLoc, 1, gl.FLOAT, false, 0, 0);
            
            gl.bindVertexArray(null);
        }

        function generateWorld() {
            // Generate crystals
            for (let i = 0; i < 50; i++) {
                const x = (Math.random() - 0.5) * 180;
                const z = (Math.random() - 0.5) * 180;
                const y = getTerrainHeight(x, z) + Math.random() * 2;
                
                crystals.push({
                    position: [x, y, z],
                    rotation: Math.random() * Math.PI * 2,
                    scale: 0.5 + Math.random() * 1.5,
                    color: [0, 0.5 + Math.random() * 0.5, 0.8 + Math.random() * 0.2]
                });
            }
            
            // Generate vegetation
            for (let i = 0; i < 200; i++) {
                const x = (Math.random() - 0.5) * 190;
                const z = (Math.random() - 0.5) * 190;
                const y = getTerrainHeight(x, z);
                
                vegetation.push({
                    position: [x, y, z],
                    type: Math.random() > 0.5 ? 'tall' : 'bulb',
                    rotation: Math.random() * Math.PI * 2,
                    scale: 0.5 + Math.random() * 1
                });
            }
            
            // Generate artifacts
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const radius = 30 + Math.random() * 50;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = getTerrainHeight(x, z) + 1;
                
                artifacts.push({
                    position: [x, y, z],
                    collected: false,
                    id: i
                });
            }
            
            // Generate wildlife
            for (let i = 0; i < 20; i++) {
                wildlife.push({
                    position: [
                        (Math.random() - 0.5) * 100,
                        5 + Math.random() * 10,
                        (Math.random() - 0.5) * 100
                    ],
                    velocity: [
                        (Math.random() - 0.5) * 0.5,
                        (Math.random() - 0.5) * 0.2,
                        (Math.random() - 0.5) * 0.5
                    ],
                    type: 'floater',
                    phase: Math.random() * Math.PI * 2
                });
            }
            
            // Generate ruins
            for (let i = 0; i < 5; i++) {
                const x = (Math.random() - 0.5) * 150;
                const z = (Math.random() - 0.5) * 150;
                const y = getTerrainHeight(x, z);
                
                ruins.push({
                    position: [x, y, z],
                    rotation: Math.random() * Math.PI * 2,
                    scale: 2 + Math.random() * 2
                });
            }
        }

        function getTerrainHeight(x, z) {
            // Match the terrain generation in createTerrain
            return (Math.sin(x * 0.1) * Math.cos(z * 0.1) * 2 +
                    Math.sin(x * 0.3 + 1) * Math.cos(z * 0.3) * 1 +
                    Math.sin(x * 0.05) * Math.sin(z * 0.05) * 5) * 3;
        }

        // ==========================================
        // RENDERING
        // ==========================================

        const viewMatrix = mat4.create();
        const projectionMatrix = mat4.create();
        const modelMatrix = mat4.create();
        const normalMatrix = mat3.create();
        const tempMatrix = mat4.create();

        function render() {
            // Update time
            const now = performance.now();
            state.deltaTime = (now - state.lastTime) / 1000;
            state.lastTime = now;
            state.time += state.deltaTime;
            
            // Update game logic
            update();
            
            // Clear
            gl.clearColor(currentBiome.skyColor[0], currentBiome.skyColor[1], currentBiome.skyColor[2], 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.CULL_FACE);
            
            // Set up matrices
            if (state.inVR && state.xrSession) {
                // VR rendering handled by XR frame loop
                return;
            } else {
                // Desktop rendering
                const aspect = canvas.width / canvas.height;
                mat4.perspective(projectionMatrix, Math.PI / 4, aspect, 0.1, 1000);
                
                const eye = state.playerPos;
                const center = [
                    eye[0] + Math.sin(state.playerRot[0]) * Math.cos(state.playerRot[1]),
                    eye[1] + Math.sin(state.playerRot[1]),
                    eye[2] + Math.cos(state.playerRot[0]) * Math.cos(state.playerRot[1])
                ];
                const up = [0, 1, 0];
                
                mat4.lookAt(viewMatrix, eye, center, up);
                
                renderScene(viewMatrix, projectionMatrix);
            }
        }

        function renderScene(view, projection) {
            // Render sky
            renderSky(view, projection);
            
            // Render terrain
            renderTerrain(view, projection);
            
            // Render crystals
            renderCrystals(view, projection);
            
            // Render vegetation
            renderVegetation(view, projection);
            
            // Render ruins
            renderRuins(view, projection);
            
            // Render artifacts
            renderArtifacts(view, projection);
            
            // Render wildlife
            renderWildlife(view, projection);
            
            // Render particles
            renderParticles(view, projection);
        }

        function renderSky(view, projection) {
            gl.useProgram(shaders.sky);
            gl.bindVertexArray(buffers.sky.vao);
            gl.disable(gl.DEPTH_TEST);
            gl.disable(gl.CULL_FACE);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(shaders.sky, 'u_viewMatrix'), false, view);
            gl.uniformMatrix4fv(gl.getUniformLocation(shaders.sky, 'u_projectionMatrix'), false, projection);
            gl.uniform3fv(gl.getUniformLocation(shaders.sky, 'u_skyColor'), currentBiome.skyColor);
            gl.uniform3fv(gl.getUniformLocation(shaders.sky, 'u_horizonColor'), currentBiome.fogColor);
            gl.uniform1f(gl.getUniformLocation(shaders.sky, 'u_time'), state.time);
            
            gl.drawArrays(gl.TRIANGLES, 0, buffers.sky.count);
            
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.CULL_FACE);
        }

        function renderTerrain(view, projection) {
            gl.useProgram(shaders.terrain);
            gl.bindVertexArray(buffers.terrain.vao);
            
            mat4.identity(modelMatrix);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain, 'u_modelMatrix'), false, modelMatrix);
            gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain, 'u_viewMatrix'), false, view);
            gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain, 'u_projectionMatrix'), false, projection);
            
            mat4.normalFromMat4(normalMatrix, modelMatrix);
            gl.uniformMatrix3fv(gl.getUniformLocation(shaders.terrain, 'u_normalMatrix'), false, normalMatrix);
            
            gl.uniform3fv(gl.getUniformLocation(shaders.terrain, 'u_cameraPos'), state.playerPos);
            gl.uniform3fv(gl.getUniformLocation(shaders.terrain, 'u_lightDir'), [0.3, -0.8, 0.5]);
            gl.uniform3fv(gl.getUniformLocation(shaders.terrain, 'u_fogColor'), currentBiome.fogColor);
            gl.uniform1f(gl.getUniformLocation(shaders.terrain, 'u_fogDensity'), currentBiome.fogDensity);
            gl.uniform3fv(gl.getUniformLocation(shaders.terrain, 'u_groundColor'), currentBiome.groundColor);
            gl.uniform1f(gl.getUniformLocation(shaders.terrain, 'u_time'), state.time);
            
            gl.drawElements(gl.TRIANGLES, buffers.terrain.count, gl.UNSIGNED_SHORT, 0);
        }

        function renderCrystals(view, projection) {
            gl.useProgram(shaders.crystal);
            gl.bindVertexArray(buffers.crystal.vao);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            
            crystals.forEach(crystal => {
                mat4.identity(modelMatrix);
                mat4.translate(modelMatrix, modelMatrix, crystal.position);
                mat4.rotateY(modelMatrix, modelMatrix, crystal.rotation);
                mat4.scale(modelMatrix, modelMatrix, [crystal.scale, crystal.scale, crystal.scale]);
                
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.crystal, 'u_modelMatrix'), false, modelMatrix);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.crystal, 'u_viewMatrix'), false, view);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.crystal, 'u_projectionMatrix'), false, projection);
                
                mat4.normalFromMat4(normalMatrix, modelMatrix);
                gl.uniformMatrix3fv(gl.getUniformLocation(shaders.crystal, 'u_normalMatrix'), false, normalMatrix);
                
                gl.uniform3fv(gl.getUniformLocation(shaders.crystal, 'u_cameraPos'), state.playerPos);
                gl.uniform3fv(gl.getUniformLocation(shaders.crystal, 'u_lightDir'), [0.3, -0.8, 0.5]);
                gl.uniform3fv(gl.getUniformLocation(shaders.crystal, 'u_fogColor'), currentBiome.fogColor);
                gl.uniform1f(gl.getUniformLocation(shaders.crystal, 'u_fogDensity'), currentBiome.fogDensity);
                gl.uniform1f(gl.getUniformLocation(shaders.crystal, 'u_time'), state.time);
                gl.uniform3fv(gl.getUniformLocation(shaders.crystal, 'u_crystalColor'), crystal.color);
                
                gl.drawElements(gl.TRIANGLES, buffers.crystal.count, gl.UNSIGNED_SHORT, 0);
            });
            
            gl.disable(gl.BLEND);
        }

        function renderVegetation(view, projection) {
            gl.useProgram(shaders.vegetation);
            
            vegetation.forEach(veg => {
                const buffer = veg.type === 'tall' ? buffers.vegetation : buffers.bulb;
                gl.bindVertexArray(buffer.vao);
                
                mat4.identity(modelMatrix);
                mat4.translate(modelMatrix, modelMatrix, veg.position);
                mat4.rotateY(modelMatrix, modelMatrix, veg.rotation);
                mat4.scale(modelMatrix, modelMatrix, [veg.scale, veg.scale, veg.scale]);
                
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.vegetation, 'u_modelMatrix'), false, modelMatrix);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.vegetation, 'u_viewMatrix'), false, view);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.vegetation, 'u_projectionMatrix'), false, projection);
                
                mat4.normalFromMat4(normalMatrix, modelMatrix);
                gl.uniformMatrix3fv(gl.getUniformLocation(shaders.vegetation, 'u_normalMatrix'), false, normalMatrix);
                
                gl.uniform3fv(gl.getUniformLocation(shaders.vegetation, 'u_cameraPos'), state.playerPos);
                gl.uniform3fv(gl.getUniformLocation(shaders.vegetation, 'u_lightDir'), [0.3, -0.8, 0.5]);
                gl.uniform3fv(gl.getUniformLocation(shaders.vegetation, 'u_fogColor'), currentBiome.fogColor);
                gl.uniform1f(gl.getUniformLocation(shaders.vegetation, 'u_fogDensity'), currentBiome.fogDensity);
                gl.uniform3fv(gl.getUniformLocation(shaders.vegetation, 'u_vegetationColor'), currentBiome.vegetationColor);
                gl.uniform1f(gl.getUniformLocation(shaders.vegetation, 'u_time'), state.time);
                gl.uniform3fv(gl.getUniformLocation(shaders.vegetation, 'u_windDir'), state.weather.wind);
                
                gl.drawElements(gl.TRIANGLES, buffer.count, gl.UNSIGNED_SHORT, 0);
            });
        }

        function renderRuins(view, projection) {
            gl.useProgram(shaders.terrain);
            gl.bindVertexArray(buffers.ruin.vao);
            
            ruins.forEach(ruin => {
                mat4.identity(modelMatrix);
                mat4.translate(modelMatrix, modelMatrix, ruin.position);
                mat4.rotateY(modelMatrix, modelMatrix, ruin.rotation);
                mat4.scale(modelMatrix, modelMatrix, [ruin.scale, ruin.scale, ruin.scale]);
                
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain, 'u_modelMatrix'), false, modelMatrix);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain, 'u_viewMatrix'), false, view);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain, 'u_projectionMatrix'), false, projection);
                
                mat4.normalFromMat4(normalMatrix, modelMatrix);
                gl.uniformMatrix3fv(gl.getUniformLocation(shaders.terrain, 'u_normalMatrix'), false, normalMatrix);
                
                gl.uniform3fv(gl.getUniformLocation(shaders.terrain, 'u_cameraPos'), state.playerPos);
                gl.uniform3fv(gl.getUniformLocation(shaders.terrain, 'u_groundColor'), [0.3, 0.3, 0.35]);
                
                gl.drawElements(gl.TRIANGLES, buffers.ruin.count, gl.UNSIGNED_SHORT, 0);
            });
        }

        function renderArtifacts(view, projection) {
            gl.useProgram(shaders.artifact);
            gl.bindVertexArray(buffers.artifact.vao);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            
            artifacts.forEach(artifact => {
                if (artifact.collected) return;
                
                mat4.identity(modelMatrix);
                mat4.translate(modelMatrix, modelMatrix, artifact.position);
                
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.artifact, 'u_modelMatrix'), false, modelMatrix);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.artifact, 'u_viewMatrix'), false, view);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.artifact, 'u_projectionMatrix'), false, projection);
                
                mat4.normalFromMat4(normalMatrix, modelMatrix);
                gl.uniformMatrix3fv(gl.getUniformLocation(shaders.artifact, 'u_normalMatrix'), false, normalMatrix);
                
                gl.uniform3fv(gl.getUniformLocation(shaders.artifact, 'u_cameraPos'), state.playerPos);
                gl.uniform3fv(gl.getUniformLocation(shaders.artifact, 'u_fogColor'), currentBiome.fogColor);
                gl.uniform1f(gl.getUniformLocation(shaders.artifact, 'u_fogDensity'), currentBiome.fogDensity);
                gl.uniform1f(gl.getUniformLocation(shaders.artifact, 'u_time'), state.time);
                gl.uniform1f(gl.getUniformLocation(shaders.artifact, 'u_collected'), 0);
                
                gl.drawElements(gl.TRIANGLES, buffers.artifact.count, gl.UNSIGNED_SHORT, 0);
            });
            
            gl.disable(gl.BLEND);
        }

        function renderWildlife(view, projection) {
            gl.useProgram(shaders.wildlife);
            gl.bindVertexArray(buffers.floater.vao);
            
            wildlife.forEach(creature => {
                mat4.identity(modelMatrix);
                mat4.translate(modelMatrix, modelMatrix, creature.position);
                const scale = 0.5 + Math.sin(state.time + creature.phase) * 0.1;
                mat4.scale(modelMatrix, modelMatrix, [scale, scale, scale]);
                
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.wildlife, 'u_modelMatrix'), false, modelMatrix);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.wildlife, 'u_viewMatrix'), false, view);
                gl.uniformMatrix4fv(gl.getUniformLocation(shaders.wildlife, 'u_projectionMatrix'), false, projection);
                
                mat4.normalFromMat4(normalMatrix, modelMatrix);
                gl.uniformMatrix3fv(gl.getUniformLocation(shaders.wildlife, 'u_normalMatrix'), false, normalMatrix);
                
                gl.uniform3fv(gl.getUniformLocation(shaders.wildlife, 'u_cameraPos'), state.playerPos);
                gl.uniform3fv(gl.getUniformLocation(shaders.wildlife, 'u_lightDir'), [0.3, -0.8, 0.5]);
                gl.uniform3fv(gl.getUniformLocation(shaders.wildlife, 'u_fogColor'), currentBiome.fogColor);
                gl.uniform1f(gl.getUniformLocation(shaders.wildlife, 'u_fogDensity'), currentBiome.fogDensity);
                gl.uniform3fv(gl.getUniformLocation(shaders.wildlife, 'u_color'), [0.6, 0.3, 0.8]);
                gl.uniform1f(gl.getUniformLocation(shaders.wildlife, 'u_time'), state.time);
                
                gl.drawElements(gl.TRIANGLES, buffers.floater.count, gl.UNSIGNED_SHORT, 0);
            });
        }

        function renderParticles(view, projection) {
            gl.useProgram(shaders.particle);
            gl.bindVertexArray(buffers.particles.vao);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
            gl.depthMask(false);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(shaders.particle, 'u_viewMatrix'), false, view);
            gl.uniformMatrix4fv(gl.getUniformLocation(shaders.particle, 'u_projectionMatrix'), false, projection);
            
            gl.drawArrays(gl.POINTS, 0, buffers.particles.count);
            
            gl.depthMask(true);
            gl.disable(gl.BLEND);
        }

        // ==========================================
        // GAME LOGIC
        // ==========================================

        function update() {
            // Update player movement
            updatePlayer();
            
            // Update wildlife
            updateWildlife();
            
            // Update particles
            updateParticles();
            
            // Check biome
            checkBiome();
            
            // Check artifact collection
            checkArtifacts();
            
            // Update UI
            updateUI();
        }

        function updatePlayer() {
            const speed = state.sprinting ? 15 : 8;
            const moveSpeed = speed * state.deltaTime;
            
            const forward = [
                Math.sin(state.playerRot[0]),
                0,
                Math.cos(state.playerRot[0])
            ];
            
            const right = [
                Math.cos(state.playerRot[0]),
                0,
                -Math.sin(state.playerRot[0])
            ];
            
            let moveX = 0;
            let moveZ = 0;
            
            if (input.keys['w'] || input.keys['arrowup']) {
                moveX += forward[0] * moveSpeed;
                moveZ += forward[2] * moveSpeed;
            }
            if (input.keys['s'] || input.keys['arrowdown']) {
                moveX -= forward[0] * moveSpeed;
                moveZ -= forward[2] * moveSpeed;
            }
            if (input.keys['a'] || input.keys['arrowleft']) {
                moveX -= right[0] * moveSpeed;
                moveZ -= right[2] * moveSpeed;
            }
            if (input.keys['d'] || input.keys['arrowright']) {
                moveX += right[0] * moveSpeed;
                moveZ += right[2] * moveSpeed;
            }
            
            // Apply movement with collision
            const newX = state.playerPos[0] + moveX;
            const newZ = state.playerPos[2] + moveZ;
            
            state.playerPos[0] = newX;
            state.playerPos[2] = newZ;
            
            // Gravity
            state.playerVel[1] -= 25 * state.deltaTime;
            state.playerPos[1] += state.playerVel[1] * state.deltaTime;
            
            // Ground collision
            const groundHeight = getTerrainHeight(state.playerPos[0], state.playerPos[2]) + 2;
            if (state.playerPos[1] < groundHeight) {
                state.playerPos[1] = groundHeight;
                state.playerVel[1] = 0;
                state.onGround = true;
            } else {
                state.onGround = false;
            }
            
            // Jump
            if (input.keys[' '] && state.onGround) {
                state.playerVel[1] = 10;
                state.onGround = false;
            }
            
            // Sprint
            state.sprinting = input.keys['shift'];
        }

        function updateWildlife() {
            wildlife.forEach(creature => {
                // Simple movement
                creature.position[0] += creature.velocity[0] * state.deltaTime;
                creature.position[1] += creature.velocity[1] * state.deltaTime + Math.sin(state.time + creature.phase) * 0.01;
                creature.position[2] += creature.velocity[2] * state.deltaTime;
                
                // Wrap around world
                if (Math.abs(creature.position[0]) > 100) creature.velocity[0] *= -1;
                if (creature.position[1] < 2 || creature.position[1] > 30) creature.velocity[1] *= -1;
                if (Math.abs(creature.position[2]) > 100) creature.velocity[2] *= -1;
                
                // Avoid player
                const dist = vec3.distance(creature.position, state.playerPos);
                if (dist < 10) {
                    const away = [
                        creature.position[0] - state.playerPos[0],
                        creature.position[1] - state.playerPos[1],
                        creature.position[2] - state.playerPos[2]
                    ];
                    vec3.normalize(away, away);
                    creature.velocity[0] += away[0] * 0.1;
                    creature.velocity[1] += away[1] * 0.1;
                    creature.velocity[2] += away[2] * 0.1;
                }
                
                // Limit speed
                const speed = vec3.length(creature.velocity);
                if (speed > 2) {
                    vec3.scale(creature.velocity, creature.velocity, 2 / speed);
                }
            });
        }

        function updateParticles() {
            const data = buffers.particles.data;
            
            for (let i = 0; i < buffers.particles.count; i++) {
                // Update position
                data.positions[i * 3] += data.velocities[i * 3] + state.weather.wind[0] * 0.1;
                data.positions[i * 3 + 1] += data.velocities[i * 3 + 1];
                data.positions[i * 3 + 2] += data.velocities[i * 3 + 2] + state.weather.wind[2] * 0.1;
                
                // Wrap around
                if (data.positions[i * 3 + 1] < 0) {
                    data.positions[i * 3 + 1] = 30;
                }
                if (Math.abs(data.positions[i * 3]) > 100) {
                    data.positions[i * 3] = -data.positions[i * 3];
                }
                if (Math.abs(data.positions[i * 3 + 2]) > 100) {
                    data.positions[i * 3 + 2] = -data.positions[i * 3 + 2];
                }
            }
            
            // Update buffer
            gl.bindBuffer(gl.ARRAY_BUFFER, buffers.particles.position);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.positions);
        }

        function checkBiome() {
            const dist = Math.sqrt(state.playerPos[0] ** 2 + state.playerPos[2] ** 2);
            
            if (dist < 40) {
                currentBiome = biomes.crystalValley;
            } else if (dist < 80) {
                currentBiome = biomes.fungalForest;
            } else if (dist < 120) {
                currentBiome = biomes.acidMarsh;
            } else {
                currentBiome = biomes.obsidianWastes;
            }
            
            state.currentBiome = currentBiome.name;
        }

        function checkArtifacts() {
            artifacts.forEach(artifact => {
                if (artifact.collected) return;
                
                const dist = vec3.distance(state.playerPos, artifact.position);
                if (dist < 3) {
                    artifact.collected = true;
                    state.collectedArtifacts++;
                    showDiscovery(`Artifact ${artifact.id + 1} Collected!`);
                }
            });
        }

        function showDiscovery(text) {
            const el = document.getElementById('discovery');
            el.textContent = text;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function updateUI() {
            document.getElementById('biome').textContent = state.currentBiome;
            document.getElementById('artifacts').textContent = state.collectedArtifacts;
            const dist = Math.floor(Math.sqrt(state.playerPos[0] ** 2 + state.playerPos[2] ** 2));
            document.getElementById('distance').textContent = dist;
        }

        // ==========================================
        // INPUT HANDLING
        // ==========================================

        function initInput() {
            // Keyboard
            window.addEventListener('keydown', e => {
                input.keys[e.key.toLowerCase()] = true;
            });
            
            window.addEventListener('keyup', e => {
                input.keys[e.key.toLowerCase()] = false;
            });
            
            // Mouse
            canvas.addEventListener('click', () => {
                if (!state.inVR) {
                    canvas.requestPointerLock();
                }
            });
            
            document.addEventListener('pointerlockchange', () => {
                input.mouse.locked = document.pointerLockElement === canvas;
            });
            
            document.addEventListener('mousemove', e => {
                if (input.mouse.locked) {
                    state.playerRot[0] += e.movementX * 0.002;
                    state.playerRot[1] -= e.movementY * 0.002;
                    state.playerRot[1] = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, state.playerRot[1]));
                }
            });
            
            // VR Button
            document.getElementById('vr-button').addEventListener('click', enterVR);
            
            // Resize
            window.addEventListener('resize', resize);
            resize();
        }

        function resize() {
            if (!state.inVR) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
        }

        // ==========================================
        // WEBXR
        // ==========================================

        async function enterVR() {
            if (!navigator.xr) {
                alert('WebXR not supported');
                return;
            }
            
            const supported = await navigator.xr.isSessionSupported('immersive-vr');
            if (!supported) {
                alert('VR not supported');
                return;
            }
            
            const session = await navigator.xr.requestSession('immersive-vr', {
                requiredFeatures: ['local-floor']
            });
            
            state.xrSession = session;
            state.inVR = true;
            
            const baseLayer = new XRWebGLLayer(session, gl);
            session.updateRenderState({ baseLayer });
            
            const refSpace = await session.requestReferenceSpace('local-floor');
            state.xrReferenceSpace = refSpace;
            
            session.addEventListener('end', () => {
                state.inVR = false;
                state.xrSession = null;
                state.xrReferenceSpace = null;
            });
            
            session.requestAnimationFrame(onXRFrame);
        }

        function onXRFrame(time, frame) {
            if (!state.xrSession) return;
            
            state.xrSession.requestAnimationFrame(onXRFrame);
            
            const pose = frame.getViewerPose(state.xrReferenceSpace);
            if (!pose) return;
            
            const glLayer = state.xrSession.renderState.baseLayer;
            gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
            
            // Update time
            const now = performance.now();
            state.deltaTime = (now - state.lastTime) / 1000;
            state.lastTime = now;
            state.time += state.deltaTime;
            
            update();
            
            // Clear
            gl.clearColor(currentBiome.skyColor[0], currentBiome.skyColor[1], currentBiome.skyColor[2], 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.CULL_FACE);
            
            // Render for each view
            for (const view of pose.views) {
                const viewport = glLayer.getViewport(view);
                gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
                
                const viewMatrix = view.transform.inverse.matrix;
                const projectionMatrix = view.projectionMatrix;
                
                renderScene(viewMatrix, projectionMatrix);
            }
        }

        // ==========================================
        // MAIN
        // ==========================================

        function init() {
            initShaders();
            initBuffers();
            initVAOs();
            generateWorld();
            initInput();
            
            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 1000);
            }, 1000);
            
            // Start loop
            requestAnimationFrame(loop);
        }

        function loop() {
            render();
            requestAnimationFrame(loop);
        }

        // Start
        init();
    </script>
</body>
