<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Alien Planet VR Experience</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #scene {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <a-scene id="scene" embedded vr-mode-ui="enabled: false">
        <a-sky color="#000"></a-sky>
        
        <a-entity position="0 0 -10">
            <a-camera></a-camera>
        </a-entity>
        
        <a-sphere position="0 0 -5" radius="1" color="#ff3300"></a-sphere>
        
        <a-plane rotation="-90 0 0" width="100" height="100" color="#00cc00"></a-plane>
        
        <a-entity position="3 1 -2" rotation="0 -45 0">
            <a-box width="2" height="2" depth="2" color="#ff00cc"></a-box>
        </a-entity>
    </a-scene>
    
    <script>
        // Add interactivity and animations here
    </script>
    
    <!-- Include A-Frame library -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</body>
</html>
