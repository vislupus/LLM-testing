<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Xenoscape — Alien Planet VR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05000a; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 32px; height: 32px; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background: rgba(0,255,200,0.7); }
  #crosshair::before { width:2px; height:100%; left:50%; transform:translateX(-50%); box-shadow:0 0 6px rgba(0,255,200,0.5); }
  #crosshair::after { width:100%; height:2px; top:50%; transform:translateY(-50%); box-shadow:0 0 6px rgba(0,255,200,0.5); }
  #crosshair-ring { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:24px; height:24px; border:1.5px solid rgba(0,255,200,0.4); border-radius:50%; box-shadow:0 0 8px rgba(0,255,200,0.2); }
  #hud { position:absolute; bottom:40px; left:40px; right:40px; display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; }
  #hud-left, #hud-right { display:flex; flex-direction:column; gap:8px; }
  #hud-right { align-items:flex-end; }
  .hud-panel { background:rgba(5,0,20,0.7); border:1px solid rgba(0,255,200,0.2); border-radius:8px; padding:12px 16px; backdrop-filter:blur(8px); box-shadow:0 0 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,255,200,0.03); }
  .hud-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(0,255,200,0.5); margin-bottom:4px; }
  .hud-value { font-size:18px; color:#00ffc8; font-weight:300; letter-spacing:1px; text-shadow:0 0 12px rgba(0,255,200,0.3); }
  #discovery-log { max-height:120px; overflow:hidden; }
  .discovery-entry { font-size:12px; color:rgba(255,255,255,0.6); padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.05); animation:fadeIn 0.5s ease; }
  .discovery-entry .hl { color:#00ffc8; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  #compass { width:60px; height:60px; position:relative; background:rgba(5,0,20,0.7); border:1px solid rgba(0,255,200,0.2); border-radius:50%; backdrop-filter:blur(8px); }
  #compass-needle { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:2px; height:22px; background:#00ffc8; box-shadow:0 0 8px rgba(0,255,200,0.5); transform-origin:bottom center; }
  #compass-dot { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:4px; height:4px; background:#ff44cc; border-radius:50%; box-shadow:0 0 8px rgba(255,68,204,0.5); }
  #enter-vr { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:auto; cursor:pointer; background:rgba(0,255,200,0.1); border:1.5px solid rgba(0,255,200,0.5); color:#00ffc8; padding:18px 40px; border-radius:30px; font-size:16px; letter-spacing:3px; text-transform:uppercase; backdrop-filter:blur(10px); transition:all 0.3s; box-shadow:0 0 30px rgba(0,255,200,0.15); }
  #enter-vr:hover { background:rgba(0,255,200,0.2); box-shadow:0 0 40px rgba(0,255,200,0.3); transform:translate(-50%,-50%) scale(1.03); }
  #enter-vr.hidden { opacity:0; pointer-events:none; }
  #message { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#00ffc8; font-size:22px; letter-spacing:2px; text-align:center; text-shadow:0 0 20px rgba(0,255,200,0.4); opacity:0; transition:opacity 0.5s; pointer-events:none; max-width:600px; line-height:1.5; }
  #message.show { opacity:1; }
  #message .sub { font-size:14px; color:rgba(255,255,255,0.4); margin-top:8px; letter-spacing:1px; }
  #loading { position:fixed; top:0; left:0; width:100%; height:100%; background:#05000a; display:flex; align-items:center; justify-content:center; z-index:100; color:#00ffc8; font-size:14px; letter-spacing:3px; text-transform:uppercase; transition:opacity 0.8s; flex-direction:column; gap:20px; }
  #loading.hidden { opacity:0; pointer-events:none; }
  #loading-bar { width:200px; height:2px; background:rgba(0,255,200,0.1); border-radius:2px; overflow:hidden; }
  #loading-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#00ffc8,#ff44cc); transition:width 0.3s; }
  #ingame-hint { position:absolute; bottom:100px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.3); font-size:12px; letter-spacing:2px; text-align:center; opacity:0; transition:opacity 1s; }
  #ingame-hint.show { opacity:1; }
  #artifact-flash { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; opacity:0; z-index:20; }
  #artifact-flash.show { animation:flashBurst 0.8s ease-out; }
  @keyframes flashBurst { 0%{opacity:1;transform:translate(-50%,-50%) scale(0.5)} 100%{opacity:0;transform:translate(-50%,-50%) scale(3)} }
  #biome-label { position:absolute; top:120px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.5); font-size:13px; letter-spacing:2px; text-transform:uppercase; opacity:0; transition:opacity 1s; pointer-events:none; text-shadow:0 0 12px rgba(0,0,0,0.8); }
  #biome-label.show { opacity:1; }
  #vignette { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; background:radial-gradient(ellipse at center, transparent 50%, rgba(5,0,10,0.4) 100%); }
</style>
</head>
<body>
<canvas id="webgl-canvas"></canvas>
<div id="vignette"></div>
<div id="ui">
  <div id="crosshair"></div>
  <div id="crosshair-ring"></div>
  <div id="hud">
    <div id="hud-left">
      <div class="hud-panel"><div class="hud-label">Artifacts Recovered</div><div class="hud-value"><span id="artifact-count">0</span> / <span id="artifact-total">12</span></div></div>
      <div class="hud-panel"><div class="hud-label">Discoveries</div><div id="discovery-log"></div></div>
    </div>
    <div id="hud-right">
      <div id="compass"><div id="compass-needle"></div><div id="compass-dot"></div></div>
      <div class="hud-panel"><div class="hud-label">Biome</div><div class="hud-value" id="biome-name">—</div></div>
    </div>
  </div>
  <div id="biome-label"></div>
  <div id="ingame-hint">Explore the world · Focus on glowing artifacts to recover them</div>
  <div id="message"></div>
  <button id="enter-vr">Enter VR Experience</button>
  <div id="loading"><div>Loading Xenoscape</div><div id="loading-bar"><div id="loading-bar-fill"></div></div></div>
  <svg id="artifact-flash" width="200" height="200" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#00ffc8" stroke-width="2" opacity="0.8"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#ff44cc" stroke-width="1.5" opacity="0.6"/>
    <polygon points="100,30 115,90 175,100 115,110 100,170 85,110 25,100 85,90" fill="none" stroke="#00ffc8" stroke-width="2" opacity="0.7"/>
  </svg>
</div>
<script>
'use strict';

// ═══════════════════════════════ CONFIGURATION ════════════════════════════════
const CFG = {
  terrainSize: 240,
  terrainSeg: 140,
  artifactCount: 12,
  treeCount: 90,
  ruinCount: 7,
  caveCount: 4,
  creatureCount: 9,
  particleCount: 650,
  weatherCount: 250,
  playerHeight: 1.6,
  walkSpeed: 1.8,
  gazeDuration: 1.2,
  fogDensity: 0.012,
  colors: {
    sky: [0.02,0.01,0.06],
    fog: [0.03,0.02,0.08],
    terrainLow: [0.12,0.06,0.15],
    terrainMid: [0.10,0.18,0.16],
    terrainHigh: [0.18,0.10,0.14],
    glowCyan:    [0.0,1.0,0.7],
    glowMagenta: [1.0,0.2,0.7],
    glowGold:    [1.0,0.75,0.2],
    ruinColor:   [0.25,0.20,0.28],
  }
};

// ═══════════════════════════════ DOM REFS ════════════════════════════════════
const canvas   = document.getElementById('webgl-canvas');
const enterVR  = document.getElementById('enter-vr');
const loading  = document.getElementById('loading');
const loadFill = document.getElementById('loading-bar-fill');
const msgEl    = document.getElementById('message');
const artCountEl = document.getElementById('artifact-count');
const artTotalEl = document.getElementById('artifact-total');
const discLog  = document.getElementById('discovery-log');
const biomeEl  = document.getElementById('biome-name');
const bioLbl   = document.getElementById('biome-label');
const hintEl   = document.getElementById('ingame-hint');
const cmpNeedle = document.getElementById('compass-needle');
const artFlash = document.getElementById('artifact-flash');
artTotalEl.textContent = CFG.artifactCount;

// ═══════════════════════════════ MATRIX MATH ═════════════════════════════════
const mat4 = {
  identity(o){o[0]=1;o[1]=0;o[2]=0;o[3]=0;o[4]=0;o[5]=1;o[6]=0;o[7]=0;o[8]=0;o[9]=0;o[10]=1;o[11]=0;o[12]=0;o[13]=0;o[14]=0;o[15]=1;return o;},
  perspective(fov,asp,near,far,o){
    const f=1/Math.tan(fov/2), nf=1/(near-far);
    o[0]=f/asp;o[1]=0;o[2]=0;o[3]=0;
    o[4]=0;o[5]=f;o[6]=0;o[7]=0;
    o[8]=0;o[9]=0;o[10]=(far+near)*nf;o[11]=-1;
    o[12]=0;o[13]=0;o[14]=2*far*near*nf;o[15]=0;
    return o;
  },
  multiply(a,b,o){
    for(let i=0;i<4;i++)for(let j=0;j<4;j++)
      o[j*4+i]=a[i]*b[j*4]+a[4+i]*b[j*4+1]+a[8+i]*b[j*4+2]+a[12+i]*b[j*4+3];
    return o;
  },
  translate(x,y,z,o){o[0]=1;o[1]=0;o[2]=0;o[3]=0;o[4]=0;o[5]=1;o[6]=0;o[7]=0;o[8]=0;o[9]=0;o[10]=1;o[11]=0;o[12]=x;o[13]=y;o[14]=z;o[15]=1;return o;},
  scale(x,y,z,o){o[0]=x;o[1]=0;o[2]=0;o[3]=0;o[4]=0;o[5]=y;o[6]=0;o[7]=0;o[8]=0;o[9]=0;o[10]=z;o[11]=0;o[12]=0;o[13]=0;o[14]=0;o[15]=1;return o;},
  rotateY(a,o){
    const c=Math.cos(a),s=Math.sin(a);
    o[0]=c;o[1]=0;o[2]=-s;o[3]=0;o[4]=0;o[5]=1;o[6]=0;o[7]=0;
    o[8]=s;o[9]=0;o[10]=c;o[11]=0;o[12]=0;o[13]=0;o[14]=0;o[15]=1;
    return o;
  }
};

// ═══════════════════════════════ NOISE ═══════════════════════════════════════
function hash2D(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function smoothNoise(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const n00=hash2D(ix,iy),n10=hash2D(ix+1,iy);
  const n01=hash2D(ix,iy+1),n11=hash2D(ix+1,iy+1);
  return n00+(n10-n00)*sx + ((n01+(n11-n01)*sx)-(n00+(n10-n00)*sx))*sy;
}
function fbm(x,y,oct){
  let v=0,amp=1,freq=1,maxV=0;
  for(let i=0;i<oct;i++){v+=amp*smoothNoise(x*freq,y*freq);maxV+=amp;amp*=0.5;freq*=2.1;}
  return v/maxV;
}
function ridgeNoise(x,y,oct){
  let v=0,amp=1,freq=1,maxV=0;
  for(let i=0;i<oct;i++){let n=1-Math.abs(smoothNoise(x*freq,y*freq)*2-1);n=n*n;v+=amp*n;maxV+=amp;amp*=0.5;freq*=2.0;}
  return v/maxV;
}

// ═══════════════════════════════ BIOMES ══════════════════════════════════════
const BIOMES = [
  {name:'Luminous Canopy', minH:-0.3, maxH:1.2, baseCol:[0.08,0.14,0.12], accent:[0.0,1.0,0.6], treeDensity:1.0, artDensity:1.0},
  {name:'Crystal Wastes',   minH:1.2, maxH:3.0, baseCol:[0.15,0.10,0.12], accent:[0.5,0.2,1.0], treeDensity:0.3, artDensity:1.2},
  {name:'Abyssal Hollows',  minH:-1.8,maxH:-0.3,baseCol:[0.06,0.03,0.10], accent:[0.0,0.6,1.0], treeDensity:0.5, artDensity:0.8},
  {name:'Singing Dunes',    minH:-0.8,maxH:0.6, baseCol:[0.14,0.10,0.08], accent:[1.0,0.6,0.1], treeDensity:0.2, artDensity:0.6},
  {name:'Verdant Fissures', minH:0.5, maxH:1.8, baseCol:[0.06,0.16,0.08], accent:[0.0,0.9,0.4], treeDensity:0.8, artDensity:1.0},
];
function getBiome(x,z,h){
  if(h<-0.3) return BIOMES[2];
  if(h>2.0)  return BIOMES[1];
  const bx=Math.sin(x*0.015)*0.5+0.5, bz=Math.cos(z*0.018)*0.5+0.5;
  const blend=(bx+bz)*0.5;
  const bn=fbm(x*0.008,z*0.008,3);
  if(blend>0.6 && bn>0.4) return BIOMES[0];
  if(blend<0.4 && bn<0.3) return BIOMES[3];
  return BIOMES[4];
}
function terrainColor(h,x,z,biome){
  const ht=Math.max(0,Math.min(1,(h+1.5)/3.5));
  let c;
  if(ht<0.3) c=biome.baseCol;
  else if(ht<0.6) c=lerpCol(biome.baseCol,biome.accent,(ht-0.3)/0.3*0.3);
  else c=lerpCol(biome.accent,CFG.colors.terrainHigh,(ht-0.6)/0.4*0.5);
  const n=fbm(x*0.05,z*0.05,2)*0.15;
  return [Math.max(0,Math.min(1,c[0]+n)),Math.max(0,Math.min(1,c[1]+n*0.5)),Math.max(0,Math.min(1,c[2]+n))];
}
function lerpCol(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

// ═══════════════════════════════ WEBGL SETUP ═════════════════════════════════
let gl, xrSession, xrRefSpace, xrGL, xrBind;
let shaders = {};
let gameTime = 0;
let playerPos = [0, CFG.playerHeight, 9];
let playerYaw = 0;
let artifactsFound = 0;
let discoveries = [];
let currentBiome = null;
let lastBioChange = 0;
let gazeStart = 0;
let gazedArt = null;
let isInVR = false;
let lastFrameTime = 0;
let terrainCache = null;

const _m1 = new Float32Array(16);
const _m2 = new Float32Array(16);
const _m3 = new Float32Array(16);
const _id  = new Float32Array(16);
mat4.identity(_id);

// ── GL init ──
function initGL(){
  gl = canvas.getContext('webgl2',{antialias:true,alpha:false,xrCompatible:true});
  if(!gl) return false;
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.clearColor(CFG.colors.sky[0],CFG.colors.sky[1],CFG.colors.sky[2],1);
  gl.depthFunc(gl.LEQUAL);
  return true;
}

function compileShader(src,type){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error('Shader fail:',gl.getShaderInfoLog(s));return null;}
  return s;
}
function makeProgram(vs,fs){
  const v=compileShader(vs,gl.VERTEX_SHADER);
  const f=compileShader(fs,gl.FRAGMENT_SHADER);
  if(!v||!f) return null;
  const p=gl.createProgram();
  gl.attachShader(p,v); gl.attachShader(p,f);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error('Link fail:',gl.getProgramInfoLog(p));return null;}
  gl.deleteShader(v); gl.deleteShader(f);
  return p;
}

// ═══════════════════════════════ SHADERS ══════════════════════════════════════
// Terrain — full lighting with fog
const SH_TERRAIN_V = `#version 300 es
  in vec3 aPos; in vec3 aNorm; in vec3 aCol;
  uniform mat4 uModel,uView,uProj;
  uniform vec3 uCamPos;
  out vec3 vNorm,vCol,vWP;
  void main(){
    vec4 wp=uModel*vec4(aPos,1.0);
    vWP=wp.xyz;
    vNorm=mat3(uModel)*aNorm;
    vCol=aCol;
    gl_Position=uProj*uView*wp;
  }
`;
const SH_TERRAIN_F = `#version 300 es
  precision highp float;
  in vec3 vNorm,vCol,vWP;
  uniform vec3 uLightDir,uCamPos,uFogColor;
  uniform float uFogDensity;
  out vec4 frag;
  void main(){
    vec3 n=normalize(vNorm);
    vec3 l=normalize(uLightDir);
    float diff=max(dot(n,l),0.0);
    float amb=0.25;
    vec3 col=vCol*(amb+diff*0.75);
    // rim
    vec3 vd=normalize(uCamPos-vWP);
    float rim=1.0-max(dot(n,vd),0.0);
    col+=vec3(0.0,0.3,0.2)*pow(rim,3.0)*0.15;
    // fog
    float d=length(vWP-uCamPos);
    float fog=1.0-exp(-uFogDensity*d*d);
    col=mix(col,uFogColor,clamp(fog,0.0,1.0));
    frag=vec4(col,1.0);
  }
`;

// Vegetation — glowing tinted trees/plants
const SH_VEGGIE_V = `#version 300 es
  in vec3 aPos;
  uniform mat4 uModel,uView,uProj;
  uniform float uTime;
  uniform vec3 uBasePos,uColor;
  out vec3 vWP;
  out float vGlow,vAlpha;
  out vec3 vCol;
  void main(){
    float bob=sin(uTime*0.6+uBasePos.x*0.7+uBasePos.z*1.1)*0.06;
    float sway=sin(uTime*0.4+uBasePos.x*0.3)*0.03;
    vec3 p=aPos+vec3(sway,bob,0.0);
    vec4 wp=uModel*vec4(p,1.0);
    vWP=wp.xyz;
    vGlow=0.5+0.5*sin(uTime*0.7+uBasePos.x*0.5+uBasePos.z*0.5);
    vAlpha=0.75+0.25*vGlow;
    vCol=uColor;
    gl_Position=uProj*uView*wp;
  }
`;
const SH_VEGGIE_F = `#version 300 es
  precision highp float;
  in vec3 vWP,vCol;
  in float vGlow,vAlpha;
  uniform vec3 uCamPos;
  out vec4 frag;
  void main(){
    vec3 vd=normalize(uCamPos-vWP);
    vec3 n=normalize(cross(dFdx(vWP),dFdy(vWP)));
    float rim=1.0-max(dot(n,vd),0.0);
    float glow=vGlow*(0.4+0.6*rim);
    vec3 col=vCol*glow*1.2+vCol*0.2;
    frag=vec4(col,clamp(vAlpha*(0.8+0.2*rim),0.0,1.0));
  }
`;

// Artifact — rotating crystal, pulsing glow
const SH_ART_V = `#version 300 es
  in vec3 aPos;
  uniform mat4 uModel,uView,uProj;
  uniform float uTime;
  uniform vec3 uBasePos,uColor;
  out vec3 vWP,vCol;
  out float vPulse;
  void main(){
    float rot=uTime*0.5+uBasePos.x*0.2;
    mat3 rm=mat3(cos(rot),0,sin(rot),0,1,0,-sin(rot),0,cos(rot));
    vec3 p=rm*aPos;
    p.y+=sin(uTime*0.8+uBasePos.x*0.5)*0.08;
    vec4 wp=uModel*vec4(p,1.0);
    vWP=wp.xyz;
    float pulse=0.7+0.3*sin(uTime*1.5+uBasePos.x*0.3+uBasePos.z*0.3);
    vPulse=pulse;
    vCol=uColor*pulse;
    gl_Position=uProj*uView*wp;
  }
`;
const SH_ART_F = `#version 300 es
  precision highp float;
  in vec3 vWP,vCol;
  in float vPulse;
  uniform vec3 uCamPos;
  out vec4 frag;
  void main(){
    vec3 vd=normalize(uCamPos-vWP);
    vec3 n=normalize(cross(dFdx(vWP),dFdy(vWP)));
    float rim=1.0-max(dot(n,vd),0.0);
    float glow=vPulse*(0.5+0.5*rim);
    vec3 col=vCol*glow*1.5+vCol*0.15;
    col+=uColor*pow(rim,2.0)*vPulse*0.3;
    frag=vec4(col,clamp(0.85+0.15*glow,0.0,1.0));
  }
`;

// Creature — floating jellyfish / glowbugs
const SH_CREAT_V = `#version 300 es
  in vec3 aPos;
  uniform mat4 uModel,uView,uProj;
  uniform float uTime;
  uniform vec3 uBasePos,uColor;
  out vec3 vWP,vCol;
  out float vAlpha;
  void main(){
    float ph=uTime*0.3+uBasePos.x*0.1+uBasePos.z*0.1;
    vec3 off=vec3(sin(ph*0.7)*0.3, sin(ph*1.1+1.0)*0.2, cos(ph*0.5)*0.3);
    vec3 p=aPos+off;
    float rot=sin(ph*0.5)*0.1;
    mat3 rm=mat3(cos(rot),0,-sin(rot),0,1,0,sin(rot),0,cos(rot));
    p=rm*p;
    vec4 wp=uModel*vec4(p,1.0);
    vWP=wp.xyz;
    float pulse=0.7+0.3*sin(uTime*0.8+uBasePos.x);
    vCol=uColor*pulse;
    vAlpha=0.7+0.3*pulse;
    gl_Position=uProj*uView*wp;
  }
`;
const SH_CREAT_F = `#version 300 es
  precision highp float;
  in vec3 vWP,vCol;
  in float vAlpha;
  uniform vec3 uCamPos;
  out vec4 frag;
  void main(){
    vec3 vd=normalize(uCamPos-vWP);
    vec3 n=normalize(cross(dFdx(vWP),dFdy(vWP)));
    float rim=1.0-max(dot(n,vd),0.0);
    float glow=vAlpha*(0.4+0.6*rim);
    vec3 col=vCol*glow*1.3+uColor*0.15*glow;
    frag=vec4(col,clamp(vAlpha+rim*0.3,0.0,1.0)*0.85);
  }
`;

// Cave — rocky tunnel with crystal glow
const SH_CAVE_V = `#version 300 es
  in vec3 aPos;
  uniform mat4 uModel,uView,uProj;
  uniform vec3 uCamPos,uGlowColor;
  uniform float uTime;
  out vec3 vWP;
  out float vGlow;
  void main(){
    vec4 wp=uModel*vec4(aPos,1.0);
    vWP=wp.xyz;
    vGlow=0.3+0.2*sin(uTime*0.3+aPos.x*0.5+aPos.z*0.5);
    gl_Position=uProj*uView*wp;
  }
`;
const SH_CAVE_F = `#version 300 es
  precision highp float;
  in vec3 vWP;
  in float vGlow;
  uniform vec3 uCamPos,uFogColor,uGlowColor;
  uniform float uFogDensity;
  out vec4 frag;
  void main(){
    vec3 vd=normalize(uCamPos-vWP);
    vec3 n=normalize(cross(dFdx(vWP),dFdy(vWP)));
    float diff=max(dot(n,normalize(vec3(0.1,0.2,0.3))),0.0);
    vec3 col=vec3(0.06,0.04,0.08)*(0.15+diff*0.3);
    col+=uGlowColor*vGlow*0.4;
    float inner=0.5+0.5*dot(n,vd);
    col+=uGlowColor*inner*0.1*vGlow;
    float d=length(vWP-uCamPos);
    float fog=1.0-exp(-uFogDensity*d*d);
    col=mix(col,uFogColor,clamp(fog,0.0,1.0));
    frag=vec4(col,1.0);
  }
`;

// Particles — floating luminescent spores
const SH_PART_V = `#version 300 es
  in vec3 aPos;
  uniform mat4 uModel,uView,uProj;
  uniform float uTime;
  out vec3 vWP;
  out vec3 vCol;
  out float vAlpha;
  void main(){
    vec3 p=aPos;
    p.y+=sin(uTime*0.5+p.x*0.3)*0.3;
    if(p.y<-5.0) p.y=5.0;
    vec4 wp=uModel*vec4(p,1.0);
    vWP=wp.xyz;
    vCol=mix(vec3(0.0,0.8,0.6),vec3(0.6,0.2,1.0),0.3+0.7*(0.5+0.5*sin(p.x*0.1+p.z*0.1)));
    vAlpha=0.3+0.5*(0.5+0.5*sin(uTime*0.4+p.x*0.2));
    gl_PointSize=3.0+vAlpha*5.0;
    gl_Position=uProj*uView*wp;
  }
`;
const SH_PART_F = `#version 300 es
  precision highp float;
  in vec3 vCol;
  in float vAlpha;
  out vec4 frag;
  void main(){
    vec2 uv=gl_PointCoord-0.5;
    float d=length(uv);
    if(d>0.5) discard;
    vec3 col=mix(vec3(0.0,0.8,0.6),vec3(0.6,0.2,1.0),vCol.x);
    col+=vec3(0.0,0.3,0.2)*(1.0-d*2.0);
    frag=vec4(col,smoothstep(0.5,0.0,d)*vAlpha*0.6);
  }
`;

// Weather — drifting mist/snow
const SH_WTHR_V = `#version 300 es
  in vec3 aPos;
  uniform mat4 uModel,uView,uProj;
  uniform float uTime;
  out vec3 vWP;
  out float vAlpha;
  void main(){
    vec3 p=aPos;
    p.y-=uTime*1.2;
    if(p.y<-2.0){p.y=8.0;p.x=(fract(aPos.x*0.07)-0.5)*200.0;p.z=(fract(aPos.z*0.07)-0.5)*200.0;}
    vec4 wp=uModel*vec4(p,1.0);
    vWP=wp.xyz;
    vAlpha=0.2+0.15*sin(aPos.x*0.5+aPos.z*0.3);
    gl_PointSize=1.5;
    gl_Position=uProj*uView*wp;
  }
`;
const SH_WTHR_F = `#version 300 es
  precision highp float;
  in vec3 vWP;
  in float vAlpha;
  out vec4 frag;
  void main(){
    vec2 uv=gl_PointCoord-0.5;
    float d=length(uv);
    if(d>0.5) discard;
    frag=vec4(0.5,0.6,0.8,smoothstep(0.5,0.0,d)*vAlpha*0.4);

`;

function buildAllShaders(){
  shaders.terrain  = makeProgram(SH_TERRAIN_V, SH_TERRAIN_F);
  shaders.veggie  = makeProgram(SH_VEGGIE_V,  SH_VEGGIE_F);
  shaders.artifact= makeProgram(SH_ART_V,     SH_ART_F);
  shaders.creature= makeProgram(SH_CREAT_V,   SH_CREAT_F);
  shaders.cave    = makeProgram(SH_CAVE_V,    SH_CAVE_F);
  shaders.particle= makeProgram(SH_PART_V,    SH_PART_F);
  shaders.weather = makeProgram(SH_WTHR_V,    SH_WTHR_F);
  return Object.values(shaders).every(s=>s!==null);
}

// ═══════════════════════════════ BUFFER HELPERS ═══════════════════════════════
function buf(data){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);return b;}
function ibuf(data){const b=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,data,gl.STATIC_DRAW);return b;}

// Simple mesh with per-vertex colors
function makeMesh(positions,normals,colors,indices,shader){
  const posBuf  = buf(new Float32Array(positions));
  const normBuf = buf(new Float32Array(normals));
  const colBuf  = buf(new Float32Array(colors));
  const idxBuf  = ibuf(new Uint16Array(indices));
  const count   = indices.length;
  return {posBuf,normBuf,colBuf,idxBuf,count,shader,draw:function(model,view,proj,camPos,extraUniforms){
    const prog=shader;
    gl.useProgram(prog);
    gl.uniformMatrix4fv(gl.getUniformLocation(prog,'uModel'),false,model);
    gl.uniformMatrix4fv(gl.getUniformLocation(prog,'uView'),false,view);
    gl.uniformMatrix4fv(gl.getUniformLocation(prog,'uProj'),false,proj);
    gl.uniform3fv(gl.getUniformLocation(prog,'uCamPos'),camPos);
    for(const [k,v] of Object.entries(extraUniforms||{})){
      const loc=gl.getUniformLocation(prog,k);
      if(loc){
        if(typeof v==='number') gl.uniform1f(loc,v);
        else if(Array.isArray(v)) gl.uniform3fv(loc,v);
      }
    }
    gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);
    gl.enableVertexAttribArray(gl.getAttribLocation(prog,'aPos'));
    gl.vertexAttribPointer(gl.getAttribLocation(prog,'aPos'),3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,normBuf);
    gl.enableVertexAttribArray(gl.getAttribLocation(prog,'aNorm'));
    gl.vertexAttribPointer(gl.getAttribLocation(prog,'aNorm'),3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,colBuf);
    gl.enableVertexAttribArray(gl.getAttribLocation(prog,'aCol'));
    gl.vertexAttribPointer(gl.getAttribLocation(prog,'aCol'),3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idxBuf);
    gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_SHORT,0);
  }};
}

// ═══════════════════════════════ GEOMETRY BUILDERS ════════════════════════════

function buildTerrain(){
  const size=CFG.terrainSize, seg=CFG.terrainSeg, step=size/seg, half=size/2;
  const pos=[], norm=[], col=[], idx=[], uvs=[];
  const heights=[];

  // compute heights
  for(let iz=0;iz<=seg;iz++){
    heights[iz]=[];
    for(let ix=0;ix<=seg;ix++){
      const x=-half+ix*step, z=-half+iz*step;
      let h=fbm(x*0.018,z*0.018,6)*3.5-0.5;
      h+=ridgeNoise(x*0.012,z*0.012,4)*1.2;
      // carve caves
      for(let c=0;c<CFG.caveCount;c++){
        const cx=(hash2D(c*7.3,c*3.1)-0.5)*size*0.7;
        const cz=(hash2D(c*11.7,c*5.3)-0.5)*size*0.7;
        const d=Math.sqrt((x-cx)**2+(z-cz)**2);
        if(d<8) h-=(1-d/8)*1.5;
      }
      heights[iz][ix]=h;
    }
  }
  terrainCache = heights;

  // build vertices
  for(let iz=0;iz<=seg;iz++){
    for(let ix=0;ix<=seg;ix++){
      const x=-half+ix*step, z=-half+iz*step, y=heights[iz][ix];
      pos.push(x,y,z);
      uvs.push(ix/seg,iz/seg);
      // normal
      const hL=ix>0?heights[iz][ix-1]:heights[iz][ix];
      const hR=ix<seg?heights[iz][ix+1]:heights[iz][ix];
      const hD=iz>0?heights[iz-1][ix]:heights[iz][ix];
      const hU=iz<seg?heights[iz+1][ix]:heights[iz][ix];
      const nx=-(hR-hL)/(2*step), nz=-(hU-hD)/(2*step);
      const ny=step, len=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
      norm.push(nx/len,ny/len,nz/len);
      const biome=getBiome(x,z,y);
      const c=terrainColor(y,x,z,biome);
      col.push(c[0],c[1],c[2]);
    }
  }
  for(let iz=0;iz<seg;iz++){
    for(let ix=0;ix<seg;ix++){
      const a=iz*(seg+1)+ix, b=a+1, c=(iz+1)*(seg+1)+ix, d=c+1;
      idx.push(a,b,c); idx.push(b,d,c);
    }
  }
  return {positions:pos,normals:norm,colors:col,uvs:uvs,indices:idx};
}

const TREE_GEO = (() => {
  // trunk — tapered cylinder
  const tP=[],tN=[],tC=[],tI=[];
  const H=1.2, R=0.08, S=8;
  for(let i=0;i<=S;i++){
    const t=i/S, y=-H/2+t*H, r=R*(1-t*0.5);
    for(let j=0;j<=S;j++){
      const a=(j/S)*Math.PI*2;
      tP.push(Math.cos(a)*r, y, Math.sin(a)*r);
      tN.push(Math.cos(a), 0, Math.sin(a));
      tC.push(0.15,0.10,0.12);
    }
  }
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){
    const a=j*(S+1)+i;
    tI.push(a,a+1,a+(S+1),a+1,a+(S+1)+1,a+(S+1));
  }
  // canopy — glowing sphere
  const cP=[],cN=[],cC=[],cI=[];
  const CR=0.5, CS=6;
  for(let i=0;i<=CS;i++){
    const t=i/CS, y=-CR+t*2*CR;
    for(let j=0;j<=CS;j++){
      const a=(j/CS)*Math.PI*2;
      const r=Math.sqrt(1-(t-0.5)**2)*CR*2;
      cP.push(Math.cos(a)*r, y+H/2, Math.sin(a)*r);
      const L=Math.sqrt(Math.cos(a)*Math.cos(a)*r*r+(y+H/2)**2+Math.sin(a)*Math.sin(a)*r*r)||1;
      cN.push(Math.cos(a)*r/L, (y+H/2)/L, Math.sin(a)*r/L);
      cC.push(1,1,1); // tinted per-instance via color uniform
    }
  }
  for(let j=0;j<CS;j++)for(let i=0;i<CS;i++){
    const a=j*(CS+1)+i;
    cI.push(a,a+1,a+(CS+1),a+1,a+(CS+1)+1,a+(CS+1));
  }
  return {trunk:{pos:tP,norm:tN,col:tC,idx:tI},canopy:{pos:cP,norm:cN,col:cC,idx:cI}};
})();

const ART_ARTIFACT = (() => {
  // octahedron / pyramid crystal
  const s=0.3;
  const verts=[[0,s,0],[s,0,s],[-s,0,s],[-s,0,-s],[s,0,-s],[0,-s*0.5,0]];
  const faces=[[0,1,2],[0,2,3],[0,3,4],[0,4,1],[5,2,1],[5,3,2],[5,4,3],[5,1,4]];
  const pos=[],norm=[],col=[],idx=[];
  for(const f of faces){
    for(const vi of f){
      const v=verts[vi];
      pos.push(v[0],v[1],v[2]);
      const L=Math.sqrt(v[0]**2+v[1]**2+v[2]**2)||1;
      norm.push(v[0]/L,v[1]/L,v[2]/L);
      col.push(1,1,1);
    }
    const base=faces.indexOf(f)*3;
    idx.push(base,base+1,base+2);
  }
  return {pos,norm,col,idx};
})();

function buildRuinParts(){
  const rng=mulberry32(Math.random()*100);
  const parts=[];
  const count=3+Math.floor(rng()*4);
  for(let i=0;i<count;i++){
    const w=0.5+rng()*2.5, h=0.3+rng()*2.0, d=0.5+rng()*2.5;
    const x=(rng()-0.5)*4, z=(rng()-0.5)*4, y=0;
    const hw=w/2, hh=h/2, hd=d/2;
    const corners=[[-hw,-hh,-hd],[hw,-hh,-hd],[hw,hh,-hd],[-hw,hh,-hd],
                   [-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]];
    const faces=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[0,3,7,4],[1,2,6,5]];
    const fns=[[0,0,-1],[0,0,1],[0,-1,0],[0,1,0],[-1,0,0],[1,0,0]];
    const p=[],n=[],c=[],ind=[];
    for(let f=0;f<6;f++){
      const verts=faces[f];
      for(let v=0;v<4;v++){
        const c=corners[verts[v]];
        p.push(c[0]+x,c[1]+y,c[2]+z);
        n.push(fns[f][0],fns[f][1],fns[f][2]);
        c.push(CFG.colors.ruinColor[0],CFG.colors.ruinColor[1],CFG.colors.ruinColor[2]);
      }
      const base=f*4;
      ind.push(base,base+1,base+2, base+1,base+3,base+2);
    }
    parts.push({pos:p,norm:n,col:c,idx:ind,x,y,z,rot:rng()*Math.PI*2});
  }
  return parts;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ═══════════════════════════════ SCENE BUILDING ═══════════════════════════════
let terrainMesh=null;
let trees=[];
let ruins=[];
let caves=[];
let artifacts=[];
let creatures=[];
let particles=null;
let weatherSys=null;

function sampleH(x,z){
  if(!terrainCache) return 0;
  const size=CFG.terrainSize, seg=CFG.terrainSeg, step=size/seg, half=size/2;
  const ix=(x+half)/step, iz=(z+half)/step;
  const ix0=Math.floor(ix), iz0=Math.floor(iz);
  const ix1=Math.min(ix0+1,seg), iz1=Math.min(iz0+1,seg);
  const fx=ix-ix0, fz=iz-iz0;
  if(ix0<0||ix0>seg||iz0<0||iz0>seg) return -99;
  const h00=terrainCache[iz0][ix0], h10=terrainCache[iz0][ix1];
  const h01=terrainCache[iz1][ix0], h11=terrainCache[iz1][ix1];
  const h0=h00+(h10-h00)*fx, h1=h01+(h11-h01)*fx;
  return h0+(h1-h0)*fz;
}

function buildScene(){
  let prog=0;
  const upd=(p)=>{prog=Math.max(prog,p);loadFill.style.width=(prog*100)+'%';};

  // 1. Terrain
  const td=buildTerrain();
  terrainMesh=makeMesh(td.positions,td.normals,td.colors,td.indices,shaders.terrain);
  upd(0.3);

  // 2. Place trees
  const halfSize=CFG.terrainSize/2-5;
  for(let i=0;i<CFG.treeCount;i++){
    const x=(Math.random()-0.5)*halfSize*2;
    const z=(Math.random()-0.5)*halfSize*2;
    const biome=getBiome(x,z,0);
    if(Math.random()>biome.treeDensity*0.8) continue;
    const h=sampleH(x,z);
    if(h<-0.8||h>3.0) continue;
    const col=biome.accent;
    const trunk={
      posBuf:buf(new Float32Array(TREE_GEO.trunk.pos)),
      normBuf:buf(new Float32Array(TREE_GEO.trunk.norm)),
      colBuf:buf(new Float32Array(TREE_GEO.trunk.col)),
      idxBuf:ibuf(new Uint16Array(TREE_GEO.trunk.idx)),
      count:TREE_GEO.trunk.idx.length
    };
    const canopy={
      posBuf:buf(new Float32Array(TREE_GEO.canopy.pos)),
      normBuf:buf(new Float32Array(TREE_GEO.canopy.norm)),
      colBuf:buf(new Float32Array(TREE_GEO.canopy.col)),
      idxBuf:ibuf(new Uint16Array(TREE_GEO.canopy.idx)),
      count:TREE_GEO.canopy.idx.length
    };
    trees.push({trunk,canopy,x,z,y:h,color:col,scale:0.6+Math.random()*0.8});
  }
  upd(0.55);

  // 3. Place ruins
  const ruinHSize=CFG.terrainSize/2-10;
  for(let i=0;i<CFG.ruinCount;i++){
    let x,z,ok=false;
    for(let a=0;a<20;a++){
      x=(Math.random()-0.5)*ruinHSize*1.6;
      z=(Math.random()-0.5)*ruinHSize*1.6;
      const h=sampleH(x,z);
      if(h>-0.2 && h<1.5){ok=true;break;}
    }
    if(!ok) continue;
    const parts=buildRuinParts();
    ruins.push({x,z,y:sampleH(x,z),parts});
  }
  upd(0.7);

  // 4. Place caves
  for(let i=0;i<CFG.caveCount;i++){
    const x=(Math.random()-0.5)*halfSize*1.4;
    const z=(Math.random()-0.5)*halfSize*1.4;
    const h=sampleH(x,z);
    if(h>0.5) continue;
    const cg=CAVE_GEO;
    const mesh={
      posBuf:buf(new Float32Array(cg.pos)),
      normBuf:buf(new Float32Array(cg.norm)),
      colBuf:buf(new Float32Array(cg.col)),
      idxBuf:ibuf(new Uint16Array(cg.idx)),
      count:cg.idx.length
    };
    const ang=Math.random()*Math.PI*2;
    caves.push({
      mesh, x:x+Math.cos(ang)*1.5, y:h-0.5, z:z+Math.sin(ang)*1.5,
      rot:ang, glowColor:[0.0,0.8+Math.random()*0.2,0.6+Math.random()*0.4]
    });
  }
  upd(0.8);

  // 5. Place artifacts
  const artHSize=CFG.terrainSize/2-8;
  const artColors=[CFG.colors.glowCyan,CFG.colors.glowMagenta,CFG.colors.glowGold];
  const names=['Resonance Crystal','Echo Prism','Void Shard','Astral Gem','Quantum Seed',
               'Time Fragment','Soul Lens','Star Anvil','Dream Catcher','Void Compass','Ether Relic','Genesis Stone'];
  for(let i=0;i<CFG.artifactCount;i++){
    let x,z,ok=false;
    for(let a=0;a<30;a++){
      x=(Math.random()-0.5)*artHSize*1.8;
      z=(Math.random()-0.5)*artHSize*1.8;
      const h=sampleH(x,z);
      if(h>-0.5 && h<2.5){ok=true;break;}
    }
    if(!ok) continue;
    const ag=ART_ARTIFACT;
    const mesh={
      posBuf:buf(new Float32Array(ag.pos)),
      normBuf:buf(new Float32Array(ag.norm)),
      colBuf:buf(new Float32Array(ag.col)),
      idxBuf:ibuf(new Uint16Array(ag.idx)),
      count:ag.idx.length
    };
    artifacts.push({
      mesh,x,y:sampleH(x,z)+0.2,z,
      color:artColors[i%3], found:false, id:i,
      name:names[i%names.length]
    });
  }
  upd(0.88);

  // 6. Place creatures
  const typeList=['jellyfish','glowbug','orb'];
  const cColors=[[0.0,0.8,1.0],[1.0,0.3,0.8],[0.3,1.0,0.5],[1.0,0.6,0.1],[0.6,0.2,1.0]];
  for(let i=0;i<CFG.creatureCount;i++){
    const type=typeList[i%3];
    const geo=CREATURE_GEOS[type];
    const mesh={
      posBuf:buf(new Float32Array(geo.pos)),
      normBuf:buf(new Float32Array(geo.norm)),
      colBuf:buf(new Float32Array(geo.col)),
      idxBuf:ibuf(new Uint16Array(geo.idx)),
      count:geo.idx.length
    };
    creatures.push({
      mesh,
      x:(Math.random()-0.5)*halfSize*1.6,
      y:1.0+Math.random()*2.0,
      z:(Math.random()-0.5)*halfSize*1.6,
      color:cColors[i%5],
      type, phase:Math.random()*Math.PI*2,
      speed:0.2+Math.random()*0.3
    });
  }
  upd(0.94);

  // 7. Particles
  const pPos=new Float32Array(CFG.particleCount*3);
  for(let i=0;i<CFG.particleCount;i++){
    pPos[i*3]=(Math.random()-0.5)*CFG.terrainSize*0.9;
    pPos[i*3+1]=Math.random()*6-1;
    pPos[i*3+2]=(Math.random()-0.5)*CFG.terrainSize*0.9;
  }
  particles={posBuf:buf(pPos),count:CFG.particleCount};

  // 8. Weather
  const wPos=new Float32Array(CFG.weatherCount*3);
  for(let i=0;i<CFG.weatherCount;i++){
    wPos[i*3]=(Math.random()-0.5)*CFG.terrainSize*0.95;
    wPos[i*3+1]=Math.random()*10;
    wPos[i*3+2]=(Math.random()-0.5)*CFG.terrainSize*0.95;
  }
  weatherSys={posBuf:buf(wPos),count:CFG.weatherCount};
  upd(1.0);

  loading.classList.add('hidden');
}

function renderRuins(view,proj,camPos){
  // We'll render each ruin part using temporary buffers

  for(const ru of ruins){

      mat4.identity(_m1);
      mat4.translate(_m1,ru.x+pt.x,ru.y,ru.z+pt.z,_m1);
      mat4.rotateY(_m1,pt.rot,_m1);
      gl.useProgram(shaders.terrain);
      gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain,'uModel'),false,_m1);
      gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain,'uView'),false,view);
      gl.uniformMatrix4fv(gl.getUniformLocation(shaders.terrain,'uProj'),false,proj);
      gl.uniform3fv(gl.getUniformLocation(shaders.terrain,'uCamPos'),camPos);
      gl.uniform3fv(gl.getUniformLocation(shaders.terrain,'uLightDir'),[0.3,0.6,0.4]);

      gl.uniform1f(gl.getUniformLocation(shaders.terrain,'uFogDensity'),CFG.fogDensity);
      // Use a draw-call approach with pre-uploaded buffer data
      // Re-use a single set of buffers, re-upload each frame
      if(!pt._bufPos) pt._bufPos=buf(new Float32Array(pt.pos));
      if(!pt._bufNorm) pt._bufNorm=buf(new Float32Array(pt.norm));
      if(!pt._bufCol)  pt._bufCol=buf(new Float32Array(pt.col));
      if(!pt._bufIdx)  pt._bufIdx=ibuf(new Uint16Array(pt.idx));
      gl.bindBuffer(gl.ARRAY_BUFFER,pt._bufPos);
      gl.enableVertexAttribArray(gl.getAttribLocation(shaders.terrain,'aPos'));
      gl.vertexAttribPointer(gl.getAttribLocation(shaders.terrain,'aPos'),3,gl.FLOAT,false,0,0);
      gl.bindBuffer(gl.ARRAY_BUFFER,pt._bufNorm);
      gl.enableVertexAttribArray(gl.getAttribLocation(shaders.terrain,'aNorm'));
      gl.vertexAttribPointer(gl.getAttribLocation(shaders.terrain,'aNorm'),3,gl.FLOAT,false,0,0);
      gl.bindBuffer(gl.ARRAY_BUFFER,pt._bufCol);
      gl.enableVertexAttribArray(gl.getAttribLocation(shaders.terrain,'aCol'));
      gl.vertexAttribPointer(gl.getAttribLocation(shaders.terrain,'aCol'),3,gl.FLOAT,false,0,0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,pt._bufIdx);
      gl.drawElements(gl.TRIANGLES,pt.idx.length,gl.UNSIGNED_SHORT,0);
    }
  }
}

// ═══════════════════════════════ NON-VR ORBITAL CAMERA ════════════════════════
let nvYaw=0, nvPitch=0, nvDist=18;
let nvAnimId=null;
function startNonVR(){
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    nvYaw=(e.clientX-r.left)/r.width*Math.PI*2 - Math.PI/2;
  });
  canvas.addEventListener('touchmove',e=>{
    if(e.touches.length===0) return;
    const t=e.touches[0];
    const r=canvas.getBoundingClientRect();
    nvYaw=(t.clientX-r.left)/r.width*Math.PI*2 - Math.PI/2;
    nvPitch=Math.max(-Math.PI*0.3,Math.min(Math.PI*0.2,(t.clientY-r.top)/r.height*Math.PI - Math.PI*0.5));
  },{passive:true});
  canvas.addEventListener('wheel',e=>{
    nvDist=Math.max(5,Math.min(60,nvDist+e.deltaY*0.03));
  });
  nvAnimId=requestAnimationFrame(nonVRLoop);
}
function nonVRLoop(){
  if(!gl) return;
  const cx=playerPos[0]+Math.sin(nvYaw)*nvDist;
  const cz=playerPos[2]+Math.cos(nvYaw)*nvDist;
  const cy=playerPos[1]+nvPitch*nvDist*0.2;
  const fwd=normalize3([playerPos[0]-cx,playerPos[1]-cy,playerPos[2]-cz]);
  const right=normalize3(cross3([0,1,0],fwd));
  const up=cross3(fwd,right);
  const v=new Float32Array(16);
  v[0]=right[0];v[1]=right[1];v[2]=right[2];v[3]=0;
  v[4]=up[0];v[5]=up[1];v[6]=up[2];v[7]=0;
  v[8]=fwd[0];v[9]=fwd[1];v[10]=fwd[2];v[11]=0;
  v[12]=-dot3(right,playerPos);v[13]=-dot3(up,playerPos);v[14]=-dot3(fwd,playerPos);v[15]=1;
  const asp=canvas.width/canvas.height;
  const p=new Float32Array(16);
  mat4.perspective(Math.PI*0.5,asp,0.1,200,p);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  renderScene(p,v,playerPos);
  nvAnimId=requestAnimationFrame(nonVRLoop);
}

// ═══════════════════════════════ COMPLEMENTARY MATH ═══════════════════════════
function normalize3(v){const L=Math.sqrt(v[0]**2+v[1]**2+v[2]**2)||1;return [v[0]/L,v[1]/L,v[2]/L];}
function cross3(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot3(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}

async function setupWebXR(){
  if(!navigator.xr){showMsg('WebXR not available.<br><span class="sub">Please use a VR-capable browser (Chrome on Quest, Firefox Reality, etc.)</span>');return;}
  try{
    const sup=await navigator.xr.isSessionSupported('immersive-vr');
    if(!sup){showMsg('VR not supported on this device.<br><span class="sub">Try using a VR headset with a compatible browser.</span>');return;}
  }catch(e){showMsg('WebXR check failed: '+e.message);return;}
  enterVR.classList.remove('hidden');
}

enterVR.addEventListener('click',async()=>{
  if(xrSession) return;
  try{
    xrSession=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
    isInVR=true;
    enterVR.classList.add('hidden');
    msgEl.classList.remove('show');
    xrRefSpace=await xrSession.requestReferenceSpace('local-floor');
    xrBind=new XRWebGLBinding(xrSession,gl);
    xrSession.addEventListener('end',()=>{
      xrSession=null; xrBind=null; xrRefSpace=null; isInVR=false;
      enterVR.classList.remove('hidden');
    });
    xrSession.requestAnimationFrame(xrFrame);
  }catch(e){console.error(e);showMsg('VR start failed: '+e.message+'<br><span class="sub">Use HTTPS or localhost</span>');}
});

function xrFrame(t,frame){
  if(!xrSession) return;
  xrSession.requestAnimationFrame(xrFrame);
  const pose=frame.getViewerPose(xrRefSpace);
  if(!pose) return;
  const dt=lastFrameTime?Math.min((t-lastFrameTime)/1000,0.05):0.016;
  lastFrameTime=t;
  gameTime+=dt;

  // Update player pos from head orientation
  const view=pose.views[0];
  const m=view.transform.matrix;
  const fwdX=-m[2], fwdZ=-m[10];
  const len=Math.sqrt(fwdX*fwdX+fwdZ*fwdZ)||1;
  const speed=CFG.walkSpeed*(0.3+0.7*Math.max(0,m[5]*0.5+0.5));
  playerPos[0]+=(fwdX/len)*speed*dt;
  playerPos[2]+=(fwdZ/len)*speed*dt;
  const half=CFG.terrainSize/2-2;
  playerPos[0]=Math.max(-half,Math.min(half,playerPos[0]));
  playerPos[2]=Math.max(-half,Math.min(half,playerPos[2]));
  const th=sampleH(playerPos[0],playerPos[2]);
  if(th>-0.5) playerPos[1]=th+CFG.playerHeight;
  playerYaw=Math.atan2(fwdX,fwdZ);

  // Gaze interaction
  checkGaze(pose);

  // Biome
  updateBiome();

  // Compass
  updateCompass();

   // Clear using the shared GL context
   gl.clearColor(CFG.colors.sky[0],CFG.colors.sky[1],CFG.colors.sky[2],1);
   gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
   
   for(const v of pose.views){
     const vp=xrBind.getViewport(v);
     gl.viewport(vp.x,vp.y,vp.width,vp.height);
    const vm=new Float32Array(v.transform.matrix);
    const pm=new Float32Array(v.projectionMatrix);
    const camX=-(vm[0]*vm[12]+vm[1]*vm[13]+vm[2]*vm[14]);
    const camY=-(vm[4]*vm[12]+vm[5]*vm[13]+vm[6]*vm[14]);
    const camZ=-(vm[8]*vm[12]+vm[9]*vm[13]+vm[10]*vm[14]);
    renderScene(pm,vm,[camX,camY,camZ]);
  }
}

function checkGaze(pose){
  if(!pose||!pose.views.length) return;
  const v=pose.views[0];
  const m=v.transform.matrix;
  const fwdX=-m[2], fwdY=-m[6], fwdZ=-m[10];
  const L=Math.sqrt(fwdX*fwdX+fwdY*fwdY+fwdZ*fwdZ)||1;
  const fwd=[fwdX/L,fwdY/L,fwdZ/L];
  const camX=-(m[0]*m[12]+m[1]*m[13]+m[2]*m[14]);
  const camY=-(m[4]*m[12]+m[5]*m[13]+m[6]*m[14]);
  const camZ=-(m[8]*m[12]+m[9]*m[13]+m[10]*m[14]);
  const cam=[camX,camY,camZ];
  let best=null, bestD=Infinity;
  const thresh=0.15, maxD=25;
  for(const a of artifacts){
    if(a.found) continue;
    const dx=a.x-cam[0], dy=a.y-cam[1], dz=a.z-cam[2];
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(d>maxD) continue;
    const adx=dx/d, ady=dy/d, adz=dz/d;
    const dot=fwd[0]*adx+fwd[1]*ady+fwd[2]*adz;
    const ang=Math.acos(Math.max(-1,Math.min(1,dot)));
    if(ang<thresh && d<bestD){bestD=d;best=a;}
  }
  if(best){
    if(gazedArt!==best){gazedArt=best;gazeStart=gameTime;}
    if(gameTime-gazeStart>CFG.gazeDuration){
      collectArtifact(best);
      gazedArt=null;
    }
  } else {
    gazedArt=null;
  }
}

function collectArtifact(a){
  a.found=true; artifactsFound++;
  artCountEl.textContent=artifactsFound;
  artFlash.classList.remove('show');
  void artFlash.offsetWidth;
  artFlash.classList.add('show');
  artFlash.style.borderColor=`rgb(${a.color[0]*255|0},${a.color[1]*255|0},${a.color[2]*255|0})`;
  addDiscovery('Recovered <span class="hl">'+a.name+'</span>');
  showMsg('✦ '+a.name+' recovered',2);
  if(artifactsFound>=CFG.artifactCount){
    setTimeout(()=>showMsg('✦ All artifacts recovered — the planet\'s secrets are yours ✦<br><span class="sub">You have unlocked the full mystery of Xenoscape</span>',8),500);
  }
}

function addDiscovery(html){
  discoveries.push(html);
  if(discoveries.length>8) discoveries.shift();
  discLog.innerHTML=discoveries.map(d=>'<div class="discovery-entry">'+d+'</div>').join('');
}

function showMsg(html,dur){
  msgEl.innerHTML=html;
  msgEl.classList.add('show');
  if(dur){clearTimeout(msgEl._t);msgEl._t=setTimeout(()=>msgEl.classList.remove('show'),dur*1000);}
}

function updateCompass(){
  let best=null,bestD=Infinity;
  for(const a of artifacts){
    if(a.found) continue;
    const d=Math.sqrt((a.x-playerPos[0])**2+(a.z-playerPos[2])**2);
    if(d<bestD){bestD=d;best=a;}
  }
  if(best){
    const ang=Math.atan2(best.x-playerPos[0],best.z-playerPos[2]);
    let na=Math.atan2(Math.sin(ang-playerYaw),Math.cos(ang-playerYaw));
    cmpNeedle.style.transform=`translate(-50%,-50%) rotate(${na*180/Math.PI}deg)`;
  } else {
    cmpNeedle.style.transform='translate(-50%,-50%) rotate(0deg)';
  }
}

function updateBiome(){
  const bio=getBiome(playerPos[0],playerPos[2],sampleH(playerPos[0],playerPos[2]));
  if(bio!==currentBiome){
    currentBiome=bio;
    const now=Date.now();
    if(now-lastBioChange>3000){
      biomeEl.textContent=bio.name;
      bioLbl.textContent='Entering '+bio.name;
      bioLbl.classList.add('show');
      clearTimeout(bioLbl._t);
      bioLbl._t=setTimeout(()=>bioLbl.classList.remove('show'),3000);
      lastBioChange=now;
      addDiscovery('Entered the <span class="hl">'+bio.name+'</span>');
    }
  }
  biomeEl.textContent=bio?bio.name:'—';
}

// ═══════════════════════════════ RESIZE ═══════════════════════════════════════
function onResize(){
  const w=window.innerWidth, h=window.innerHeight;
  canvas.width=Math.floor(w*devicePixelRatio);
  canvas.height=Math.floor(h*devicePixelRatio);
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  if(gl) gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize',onResize);

// ═══════════════════════════════ INIT ═════════════════════════════════════════
async function init(){
  loadFill.style.width='0%';
  if(!initGL()){showMsg('WebGL 2.0 not available.<br><span class="sub">Please use a modern browser with WebGL 2.0 support.</span>');return;}
  if(!buildAllShaders()) return;
  buildScene();
  onResize();
  startNonVR();
  await setupWebXR();
  setTimeout(()=>hintEl.classList.add('show'),3000);
  updateBiome();
  console.log('Xenoscape ready. '+CFG.artifactCount+' artifacts to find.');
}
init().catch(e=>{console.error(e);showMsg('Error: '+e.message);});
</script>
