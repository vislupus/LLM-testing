<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Xeno-Expanse VR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10; }
        button { padding: 20px 40px; font-size: 24px; cursor: pointer; background: #4a0072; color: white; border: none; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="overlay"><button id="xr-button">ENTER ALIEN WORLD</button></div>
    <canvas id="webgl-canvas"></canvas>

<script>
/
  RAW WEBGL ENGINE - NO LIBRARIES
 /
const canvas = document.getElementById('webgl-canvas');
const gl = canvas.getContext('webgl2', { xrCompatible: true });

const vertexShaderSource = #version 300 es
    in vec3 position; in vec3 color;
    uniform mat4 view; uniform mat4 projection;
    out vec3 vColor;
    void main() { vColor = color; gl_Position = projection  view  vec4(position, 1.0); };

const fragmentShaderSource = #version 300 es
    precision highp float;
    in vec3 vColor; out vec4 fragColor;
    void main() { fragColor = vec4(vColor, 1.0); };

// Simple Shader Compile
function createShader(gl, type, source) {
    const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
    return s;
}

const program = gl.createProgram();
gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vertexShaderSource));
gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource));
gl.linkProgram(program);

// Generate simple geometry (Alien Terrain)
const vertices = new Float32Array([
    -50, 0, -50, 0.2, 0, 0.5,  50, 0, -50, 0.2, 0, 0.5,  0, 10, -50, 0.8, 0.2, 0.8 // Mountains
]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);

// XR Setup
let xrSession = null;
const btn = document.getElementById('xr-button');

btn.addEventListener('click', async () => {
    const session = await navigator.xr.requestSession('immersive-vr');
    xrSession = session;
    const glLayer = new XRWebGLLayer(session, gl);
    session.updateRenderState({ baseLayer: glLayer });
    
    const refSpace = await session.requestReferenceSpace('local-floor');
    
    function onFrame(time, frame) {
        const session = frame.session;
        session.requestAnimationFrame(onFrame);
        const pose = frame.getViewerPose(refSpace);
        
        if (pose) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
            gl.clearColor(0.1, 0.05, 0.2, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            
            for (const view of pose.views) {
                const viewport = glLayer.getViewport(view);
                gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
                gl.useProgram(program);
                // Simple View Projection Logic
                gl.drawArrays(gl.TRIANGLES, 0, 3);
            }
        }
    }
    session.requestAnimationFrame(onFrame);
    document.getElementById('overlay').style.display = 'none';
});

// Basic check for WebXR
if (!navigator.xr) {
    btn.innerText = "XR NOT SUPPORTED";
    btn.disabled = true;
}
</script>
</body>
</html>
