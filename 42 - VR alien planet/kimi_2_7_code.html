<body>
  <canvas id="gl"></canvas>
  <div id="overlay" class="flex flex-col items-center justify-center text-center p-6">
    <div class="hud bg-black/60 backdrop-blur-md border border-white/10 rounded-2xl p-8 max-w-xl shadow-2xl">

        <p><span class="text-cyan-300 font-semibold">Move</span> — left controller thumbstick</p>

      </div>
      <p id="status" class="mt-4 text-sm text-white/50"></p>

<script>
// ============== Math / noise ==============
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function hash2(x,y){
  let n = Math.sin(x*127.1 + y*311.7) * 43758.5453;
  return n - Math.floor(n);
}
function smooth(t){ return t*t*(3-2*t); }
function noise2(x,z){
  let ix = Math.floor(x), iz = Math.floor(z);
  let fx = x - ix, fz = z - iz;
  fx = smooth(fx); fz = smooth(fz);
  let a = hash2(ix,iz), b = hash2(ix+1,iz), c = hash2(ix,iz+1), d = hash2(ix+1,iz+1);
  return (a*(1-fx)+b*fx)*(1-fz) + (c*(1-fx)+d*fx)*fz;
}
function terrainHeight(x,z){
  let h = noise2(x*0.015, z*0.015)*8;
  h += noise2(x*0.06 + 13, z*0.06)*2.2;
  h += noise2(x*0.18, z*0.18 + 7)*0.6;
  return h;
}
function biomeAt(x,z){
  let a = Math.atan2(z,x); if(a<0)a+=Math.PI*2;
  let s = Math.floor(a/(Math.PI*2/4));
  return ['fungal','crystal','desert','ruins'][s];
}
function biomeColor(x,z,y){
  let b = biomeAt(x,z);
  let n = noise2(x*0.1,z*0.1);
  let c;
  if(b==='fungal') c = [0.32+n*0.1, 0.22+n*0.12, 0.42+n*0.1];
  else if(b==='crystal') c = [0.22+n*0.08, 0.35+n*0.12, 0.48+n*0.1];
  else if(b==='desert') c = [0.60+n*0.12, 0.40+n*0.1, 0.20+n*0.08];
  else c = [0.36+n*0.1, 0.36+n*0.1, 0.40+n*0.08];
  return c;
}

// ============== Matrix utilities ==============
function mat4(out){ return new Float32Array(out||16); }
function identity(m){ m[0]=1;m[1]=0;m[2]=0;m[3]=0; m[4]=0;m[5]=1;m[6]=0;m[7]=0; m[8]=0;m[9]=0;m[10]=1;m[11]=0; m[12]=0;m[13]=0;m[14]=0;m[15]=1; return m; }
function multiply(out,a,b){
  let a00=a[0],a01=a[1],a02=a[2],a03=a[3], a10=a[4],a11=a[5],a12=a[6],a13=a[7], a20=a[8],a21=a[9],a22=a[10],a23=a[11], a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  let b0=b[0],b1=b[1],b2=b[2],b3=b[3];
  out[0]=b0*a00+b1*a10+b2*a20+b3*a30; out[1]=b0*a01+b1*a11+b2*a21+b3*a31; out[2]=b0*a02+b1*a12+b2*a22+b3*a32; out[3]=b0*a03+b1*a13+b2*a23+b3*a33;
  b0=b[4];b1=b[5];b2=b[6];b3=b[7];
  out[4]=b0*a00+b1*a10+b2*a20+b3*a30; out[5]=b0*a01+b1*a11+b2*a21+b3*a31; out[6]=b0*a02+b1*a12+b2*a22+b3*a32; out[7]=b0*a03+b1*a13+b2*a23+b3*a33;
  b0=b[8];b1=b[9];b2=b[10];b3=b[11];
  out[8]=b0*a00+b1*a10+b2*a20+b3*a30; out[9]=b0*a01+b1*a11+b2*a21+b3*a31; out[10]=b0*a02+b1*a12+b2*a22+b3*a32; out[11]=b0*a03+b1*a13+b2*a23+b3*a33;
  b0=b[12];b1=b[13];b2=b[14];b3=b[15];
  out[12]=b0*a00+b1*a10+b2*a20+b3*a30; out[13]=b0*a01+b1*a11+b2*a21+b3*a31; out[14]=b0*a02+b1*a12+b2*a22+b3*a32; out[15]=b0*a03+b1*a13+b2*a23+b3*a33;
  return out;
}
function perspective(out, fovy, aspect, near, far){
  let f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  out[0]=f/aspect; out[1]=0; out[2]=0; out[3]=0;
  out[4]=0; out[5]=f; out[6]=0; out[7]=0;
  out[8]=0; out[9]=0; out[10]=(far+near)*nf; out[11]=-1;
  out[12]=0; out[13]=0; out[14]=2*far*near*nf; out[15]=0;
  return out;
}
function translate(m,v){ m[12]=v[0]; m[13]=v[1]; m[14]=v[2]; return m; }
function scale(m,v){ m[0]=v[0]; m[5]=v[1]; m[10]=v[2]; return m; }
function rotateY(m,a){ let c=Math.cos(a),s=Math.sin(a); m[0]=c;m[2]=s;m[8]=-s;m[10]=c; return m; }
function rotateZ(m,a){ let c=Math.cos(a),s=Math.sin(a); m[0]=c;m[1]=s;m[4]=-s;m[5]=c; return m; }
function rotateX(m,a){ let c=Math.cos(a),s=Math.sin(a); m[5]=c;m[6]=-s;m[9]=s;m[10]=c; return m; }
let trsT=mat4(), trsR=mat4(), trsS=mat4(), trsTmp=mat4();
function composeTRS(out, t, yaw, s){
  identity(trsT); translate(trsT,t);
  identity(trsR); rotateY(trsR,yaw);
  identity(trsS); scale(trsS,[s,s,s]);
  multiply(trsTmp, trsR, trsS);
  multiply(out, trsT, trsTmp);
  return out;
}
function copy(out,a){ for(let i=0;i<16;i++) out[i]=a[i]; return out; }

function quatRotateVector(q,v){
  let x=q[0],y=q[1],z=q[2],w=q[3];
  let vx=v[0],vy=v[1],vz=v[2];
  let tx = 2*(y*vz - z*vy);
  let ty = 2*(z*vx - x*vz);
  let tz = 2*(x*vy - y*vx);
  return [
    vx + w*tx + y*tz - z*ty,
    vy + w*ty + z*tx - x*tz,
    vz + w*tz + x*ty - y*tx
  ];
}
function quatYaw(q){
  let x=q[0],y=q[1],z=q[2],w=q[3];
  return Math.atan2(2*(w*y - z*x), 1 - 2*(y*y + x*x));
}

// ============== Shader helpers ==============
function compile(gl, type, src){
  let s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function program(gl, vs, fs){
  let p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}

const VS_MAIN = `
attribute vec3 aPosition;
attribute vec3 aNormal;
attribute vec3 aColor;
attribute float aGlow;
uniform mat4 uMVP;
uniform mat4 uModel;
uniform mat4 uNormalMat;
uniform vec3 uLightDir;
uniform vec3 uCameraPos;
uniform vec3 uFogColor;
uniform float uFogNear;
uniform float uFogFar;
varying vec3 vColor;
varying vec3 vNormal;
varying vec3 vWorldPos;
varying float vGlow;
void main(){
  vec4 world = uModel * vec4(aPosition, 1.0);
  gl_Position = uMVP * vec4(aPosition, 1.0);
  vWorldPos = world.xyz;
  vNormal = normalize((uNormalMat * vec4(aNormal, 0.0)).xyz);
  vColor = aColor;
  vGlow = aGlow;
}`;

const FS_MAIN = `
precision mediump float;
varying vec3 vColor;
varying vec3 vNormal;
varying vec3 vWorldPos;
varying float vGlow;
uniform vec3 uLightDir;
uniform vec3 uCameraPos;
uniform vec3 uFogColor;
uniform float uFogNear;
uniform float uFogFar;
uniform vec3 uTintColor;
void main(){
  vec3 n = normalize(vNormal);
  float diff = max(dot(n, normalize(-uLightDir)), 0.0);
  vec3 ambient = vec3(0.16,0.14,0.20);
  vec3 base = vColor * uTintColor;
  vec3 col = base * (ambient + diff * 0.85);
  col += base * vGlow * 1.1;
  float dist = length(vWorldPos - uCameraPos);
  float fog = clamp((dist - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0);
  gl_FragColor = vec4(mix(col, uFogColor, fog), 1.0);
}`;

const VS_PARTICLE = `
attribute vec3 aPosition;
attribute vec3 aColor;
attribute float aSize;
uniform mat4 uVP;
uniform float uPointScale;
varying vec3 vColor;
void main(){
  vec4 pos = uVP * vec4(aPosition, 1.0);
  gl_Position = pos;
  gl_PointSize = aSize * uPointScale / max(pos.w, 0.001);
  vColor = aColor;
}`;

const FS_PARTICLE = `
precision mediump float;
varying vec3 vColor;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  float d = length(c);
  if(d > 0.5) discard;
  float a = 1.0 - smoothstep(0.15, 0.5, d);
  gl_FragColor = vec4(vColor, a * 0.75);
}`;

// ============== Primitive generators ==============
function createCone(r,h,segs,color,glow){
  let v=[],n=[],c=[],g=[],i=[];
  let sideNormalScale = 1/Math.sqrt(r*r + h*h);
  for(let k=0;k<=segs;k++){
    let t = k/segs, a = t*Math.PI*2, cx=Math.cos(a), sz=Math.sin(a);
    v.push(cx*r,0,sz*r);
    n.push(cx*h*sideNormalScale, r*sideNormalScale, sz*h*sideNormalScale);
    c.push(color[0],color[1],color[2]); g.push(glow);
  }
  let tip = v.length/3;
  v.push(0,h,0); n.push(0,1,0); c.push(color[0],color[1],color[2]); g.push(glow);
  for(let k=0;k<segs;k++){ i.push(k, tip, k+1); }
  // base cap
  let center = v.length/3;
  v.push(0,0,0); n.push(0,-1,0); c.push(color[0],color[1],color[2]); g.push(glow);
  for(let k=0;k<segs;k++){ i.push(k+1, center, k); }
  return {v,n,c,g,i};
}
function createCylinder(r,h,segs,color,glow){
  let v=[],n=[],c=[],g=[],i=[];
  for(let k=0;k<=segs;k++){
    let a = k/segs*Math.PI*2, cx=Math.cos(a), sz=Math.sin(a);
    v.push(cx*r,0,sz*r); n.push(cx,0,sz); c.push(...color); g.push(glow);
    v.push(cx*r,h,sz*r); n.push(cx,0,sz); c.push(...color); g.push(glow);
  }
  let ring = segs+1;
  for(let k=0;k<segs;k++){
    let a=k*2, b=a+1, c2=a+2, d=a+3;
    i.push(a,c2,b, b,c2,d);
  }
  return {v,n,c,g,i};
}
function createBox(w,h,d,color,glow){
  let x=w/2,y=h/2,z=d/2;
  let v=[], n=[], c=[], g=[], idx=[];
  function face(p1,p2,p3,p4,norm){
    let off=v.length/3;
    [p1,p2,p3,p4].forEach(p=>{ v.push(p[0],p[1],p[2]); n.push(norm[0],norm[1],norm[2]); c.push(color[0],color[1],color[2]); g.push(glow); });
    idx.push(off,off+1,off+2, off,off+2,off+3);
  }
  face([-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[0,0,-1]);
  face([x,-y,-z],[x,-y,z],[x,y,z],[x,y,-z],[1,0,0]);
  face([x,-y,z],[-x,-y,z],[-x,y,z],[x,y,z],[0,0,1]);
  face([-x,-y,z],[-x,-y,-z],[-x,y,-z],[-x,y,z],[-1,0,0]);
  face([-x,y,-z],[x,y,-z],[x,y,z],[-x,y,z],[0,1,0]);
  face([-x,-y,z],[x,-y,z],[x,-y,-z],[-x,-y,-z],[0,-1,0]);
  return {v,n,c,g,i:idx};
}
function createSphere(r,segs,color,glow){
  let v=[],n=[],c=[],g=[],i=[];
  for(let lat=0;lat<=segs;lat++){
    let theta = lat*Math.PI/segs, st=Math.sin(theta), ct=Math.cos(theta);
    for(let lon=0;lon<=segs;lon++){
      let phi = lon*2*Math.PI/segs, sp=Math.sin(phi), cp=Math.cos(phi);
      let nx=sp*st, ny=ct, nz=cp*st;
      v.push(nx*r,ny*r,nz*r); n.push(nx,ny,nz); c.push(...color); g.push(glow);
    }
  }
  for(let lat=0;lat<segs;lat++){
    for(let lon=0;lon<segs;lon++){
      let a=lat*(segs+1)+lon, b=a+segs+1;
      i.push(a,b,a+1, b,b+1,a+1);
    }
  }
  return {v,n,c,g,i};
}
function createTorus(R,r,segsR,segsT,color,glow){
  let v=[],n=[],c=[],g=[],i=[];
  for(let u=0;u<=segsR;u++){
    let au = u*2*Math.PI/segsR, cu=Math.cos(au), su=Math.sin(au);
    for(let t=0;t<=segsT;t++){
      let at=t*2*Math.PI/segsT, cv=Math.cos(at), sv=Math.sin(at);
      let px=(R+r*cv)*cu, py=r*sv, pz=(R+r*cv)*su;
      v.push(px,py,pz);
      n.push(cu*cv, sv, su*cv);
      c.push(...color); g.push(glow);
    }
  }
  let stride=segsT+1;
  for(let u=0;u<segsR;u++){
    for(let t=0;t<segsT;t++){
      let a=u*stride+t, b=(u+1)*stride+t;
      i.push(a,b,a+1, b,b+1,a+1);
    }
  }
  return {v,n,c,g,i};
}

function appendPrim(target, prim, mat, colorOverride, glowScale){
  glowScale = glowScale==null?1:glowScale;
  let off = target.v.length/3;
  let useCol = colorOverride || prim.c;
  for(let k=0;k<prim.v.length/3;k++){
    let vx=prim.v[k*3], vy=prim.v[k*3+1], vz=prim.v[k*3+2];
    target.v.push(mat[0]*vx+mat[4]*vy+mat[8]*vz+mat[12],
                  mat[1]*vx+mat[5]*vy+mat[9]*vz+mat[13],
                  mat[2]*vx+mat[6]*vy+mat[10]*vz+mat[14]);
    let nx=prim.n[k*3], ny=prim.n[k*3+1], nz=prim.n[k*3+2];
    let nnx=mat[0]*nx+mat[4]*ny+mat[8]*nz;
    let nny=mat[1]*nx+mat[5]*ny+mat[9]*nz;
    let nnz=mat[2]*nx+mat[6]*ny+mat[10]*nz;
    let len=Math.hypot(nnx,nny,nnz); if(len){ nnx/=len; nny/=len; nnz/=len; }
    target.n.push(nnx,nny,nnz);
    target.c.push(useCol[k*3], useCol[k*3+1], useCol[k*3+2]);
    target.g.push(prim.g[k]*glowScale);
  }
  for(let idx of prim.i) target.i.push(idx+off);
}

function normalizeVec(v){ let len=Math.hypot(v[0],v[1],v[2]); if(len){ v[0]/=len; v[1]/=len; v[2]/=len; } return v; }

// ============== Mesh class ==============
class Mesh{
  constructor(gl, program, prim, dynamic, mode){
    this.gl=gl; this.program=program; this.dynamic=!!dynamic; this.mode=mode||gl.TRIANGLES; this.count=prim.i.length;
    this.attrs=[];
    let map=[{name:'aPosition', size:3, data:prim.v}, {name:'aNormal', size:3, data:prim.n}, {name:'aColor', size:3, data:prim.c}, {name:'aGlow', size:1, data:prim.g}];
    for(let a of map){
      if(!a.data) continue;
      let buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(a.data), dynamic?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);
      let loc = gl.getAttribLocation(program, a.name);
      this.attrs.push({buf, loc, size:a.size, name:a.name});
    }
    this.indexBuf = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(prim.i), gl.STATIC_DRAW);
    this.uMVP = gl.getUniformLocation(program,'uMVP');
    this.uModel = gl.getUniformLocation(program,'uModel');
    this.uNormalMat = gl.getUniformLocation(program,'uNormalMat');
    this.uCameraPos = gl.getUniformLocation(program,'uCameraPos');
    this.uLightDir = gl.getUniformLocation(program,'uLightDir');
    this.uFogColor = gl.getUniformLocation(program,'uFogColor');
    this.uFogNear = gl.getUniformLocation(program,'uFogNear');
    this.uFogFar = gl.getUniformLocation(program,'uFogFar');
    this.uTintColor = gl.getUniformLocation(program,'uTintColor');
  }
  draw(mvp, model, normalMat, camPos, lightDir, fog, tint){
    let gl=this.gl;
    gl.useProgram(this.program);
    gl.uniformMatrix4fv(this.uMVP,false,mvp);
    gl.uniformMatrix4fv(this.uModel,false,model);
    gl.uniformMatrix4fv(this.uNormalMat,false,normalMat||model);
    if(camPos) gl.uniform3f(this.uCameraPos,camPos[0],camPos[1],camPos[2]);
    if(lightDir) gl.uniform3f(this.uLightDir,lightDir[0],lightDir[1],lightDir[2]);
    if(fog){ gl.uniform3f(this.uFogColor,fog.r,fog.g,fog.b); gl.uniform1f(this.uFogNear,fog.near); gl.uniform1f(this.uFogFar,fog.far); }
    if(tint){ gl.uniform3f(this.uTintColor,tint[0],tint[1],tint[2]); } else { gl.uniform3f(this.uTintColor,1,1,1); }
    for(let a of this.attrs){
      if(a.loc<0) continue;
      gl.bindBuffer(gl.ARRAY_BUFFER, a.buf);
      gl.enableVertexAttribArray(a.loc);
      gl.vertexAttribPointer(a.loc, a.size, gl.FLOAT, false, 0, 0);
    }
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuf);
    gl.drawElements(this.mode, this.count, gl.UNSIGNED_SHORT, 0);
  }
  updatePositions(verts){
    if(!this.dynamic) return;
    let gl=this.gl;
    let a = this.attrs.find(x=>x.name==='aPosition');
    if(!a) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, a.buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(verts));
  }
}

// ============== Particle system ==============
class ParticleSystem{
  constructor(gl, program, count){
    this.gl=gl; this.program=program; this.count=count;
    this.pos = new Float32Array(count*3);
    this.vel = [];
    this.col = new Float32Array(count*3);
    this.size = new Float32Array(count);
    for(let i=0;i<count;i++){
      this.reset(i, true);
    }
    this.posBuf=gl.createBuffer();
    this.colBuf=gl.createBuffer();
    this.sizeBuf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,this.posBuf); gl.bufferData(gl.ARRAY_BUFFER,this.pos,gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.colBuf); gl.bufferData(gl.ARRAY_BUFFER,this.col,gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.sizeBuf); gl.bufferData(gl.ARRAY_BUFFER,this.size,gl.STATIC_DRAW);
    this.aPos=gl.getAttribLocation(program,'aPosition');
    this.aCol=gl.getAttribLocation(program,'aColor');
    this.aSize=gl.getAttribLocation(program,'aSize');
    this.uVP=gl.getUniformLocation(program,'uVP');
    this.uPointScale=gl.getUniformLocation(program,'uPointScale');
  }
  reset(i, initial){
    let a = Math.random()*Math.PI*2;
    let r = 10 + Math.random()*55;
    this.pos[i*3]=Math.cos(a)*r;
    this.pos[i*3+1]=initial?Math.random()*25:15+Math.random()*20;
    this.pos[i*3+2]=Math.sin(a)*r;
    let b = biomeAt(this.pos[i*3], this.pos[i*3+2]);
    if(b==='fungal'){ this.col[i*3]=0.7; this.col[i*3+1]=0.2; this.col[i*3+2]=0.9; }
    else if(b==='crystal'){ this.col[i*3]=0.2; this.col[i*3+1]=0.9; this.col[i*3+2]=1.0; }
    else if(b==='desert'){ this.col[i*3]=0.95; this.col[i*3+1]=0.6; this.col[i*3+2]=0.2; }
    else { this.col[i*3]=0.6; this.col[i*3+1]=0.65; this.col[i*3+2]=0.7; }
    this.size[i]=0.03+Math.random()*0.08;
    this.vel[i]={x:(Math.random()-0.5)*0.3, y:-(0.2+Math.random()*0.5), z:(Math.random()-0.5)*0.3};
  }
  update(dt){
    for(let i=0;i<this.count;i++){
      this.pos[i*3]+=this.vel[i].x*dt;
      this.pos[i*3+1]+=this.vel[i].y*dt;
      this.pos[i*3+2]+=this.vel[i].z*dt;
      if(this.pos[i*3+1]<terrainHeight(this.pos[i*3],this.pos[i*3+2])-1 || Math.hypot(this.pos[i*3],this.pos[i*3+2])>70){
        this.reset(i,false);
      }
    }
    this.gl.bindBuffer(this.gl.ARRAY_BUFFER,this.posBuf);
    this.gl.bufferSubData(this.gl.ARRAY_BUFFER,0,this.pos);
  }
  draw(vp, pointScale){
    let gl=this.gl;
    gl.useProgram(this.program);
    gl.uniformMatrix4fv(this.uVP,false,vp);
    gl.uniform1f(this.uPointScale, pointScale);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.posBuf); gl.enableVertexAttribArray(this.aPos); gl.vertexAttribPointer(this.aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.colBuf); gl.enableVertexAttribArray(this.aCol); gl.vertexAttribPointer(this.aCol,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.sizeBuf); gl.enableVertexAttribArray(this.aSize); gl.vertexAttribPointer(this.aSize,1,gl.FLOAT,false,0,0);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    gl.drawArrays(gl.POINTS,0,this.count);
    gl.depthMask(true); gl.disable(gl.BLEND);
  }
}

// ============== Globals ==============
let canvas, gl, xrSession=null, baseRefSpace=null, refSpace=null, playerOffset={x:0,y:0,z:0};
let progMain, progParticle;
let worldMesh, creatureMesh, artifactMesh, controllerSphereMesh;
let lineMeshes=[];
let artifacts=[], creatures=[];
let particles;
let lastTime=0;
let lightDir = normalizeVec([0.4,-0.9,0.3]);
let fogColor = [0.06,0.04,0.10];
let fogNear=3, fogFar=90;
let heldBySource = new Map(); // inputSource -> artifact

// ============== Generate world ==============
function generateWorldData(){
  let target={v:[],n:[],c:[],g:[],i:[]};
  let grid=80, spacing=2.0, half=grid/2;
  let positions = [];
  // terrain
  for(let i=0;i<=grid;i++){
    positions[i]=[];
    for(let j=0;j<=grid;j++){
      let x=(i-half)*spacing, z=(j-half)*spacing, y=terrainHeight(x,z);
      positions[i][j]=[x,y,z];
      target.v.push(x,y,z);
      let col = biomeColor(x,z,y);
      target.c.push(col[0],col[1],col[2]);
      target.g.push(0);
    }
  }
  // terrain normals
  function get(i,j){ return positions[clamp(i,0,grid)][clamp(j,0,grid)]; }
  for(let i=0;i<=grid;i++){
    for(let j=0;j<=grid;j++){
      let p=get(i,j);
      let l=get(i-1,j), r=get(i+1,j), d=get(i,j-1), u=get(i,j+1);
      let dx=[r[0]-l[0], r[1]-l[1], r[2]-l[2]];
      let dz=[u[0]-d[0], u[1]-d[1], u[2]-d[2]];
      let nx=dz[1]*dx[2]-dz[2]*dx[1], ny=dz[2]*dx[0]-dz[0]*dx[2], nz=dz[0]*dx[1]-dz[1]*dx[0];
      let len=Math.hypot(nx,ny,nz); if(len){nx/=len;ny/=len;nz/=len;}
      target.n.push(nx,ny,nz);
    }
  }
  // indices
  for(let i=0;i<grid;i++){
    for(let j=0;j<grid;j++){
      let a=i*(grid+1)+j, b=a+1, c=a+grid+1, d=c+1;
      target.i.push(a,c,b, b,c,d);
    }
  }

  let tmpM=mat4();
  // vegetation / rocks
  for(let i=0;i<grid;i++){
    for(let j=0;j<grid;j++){
      let cx=(i-half+0.5)*spacing, cz=(j-half+0.5)*spacing;
      let h=terrainHeight(cx,cz), b=biomeAt(cx,cz), r=Math.random();
      if(b==='fungal' && r<0.05){
        identity(tmpM); translate(tmpM,[cx,h,cz]); scale(tmpM,[1,1,1]);
        appendPrim(target, createCylinder(0.05,0.25,6,[0.38,0.30,0.22],0), tmpM, null, 1);
        identity(tmpM); translate(tmpM,[cx,h+0.22,cz]); scale(tmpM,[0.18,0.18,0.18]);
        appendPrim(target, createSphere(1,8,[0.75,0.15,0.85],0.8), tmpM, null, 1);
      } else if(b==='crystal' && r<0.04){
        identity(tmpM); translate(tmpM,[cx,h,cz]); rotateX(tmpM,(Math.random()-0.5)*0.4); rotateZ(tmpM,(Math.random()-0.5)*0.4); scale(tmpM,[0.6+Math.random()*0.6,1.2+Math.random()*1.2,0.6+Math.random()*0.6]);
        appendPrim(target, createCone(0.12,1,5,[0.15,0.85,0.95],1.2), tmpM, null, 1);
      } else if(b==='desert' && r<0.03){
        let levels = 1+Math.floor(Math.random()*3);
        for(let l=0;l<levels;l++){
          identity(tmpM); translate(tmpM,[cx,h+l*0.18,cz]); scale(tmpM,[0.12,0.12,0.12]);
          appendPrim(target, createSphere(1,6,[0.35,0.55,0.18],0), tmpM, null, 1);
        }
      } else if(b==='ruins' && r<0.025){
        let height=1+Math.random()*2.5;
        identity(tmpM); translate(tmpM,[cx,h+height/2,cz]); scale(tmpM,[0.25,height,0.25]);
        appendPrim(target, createCylinder(1,1,8,[0.5,0.5,0.52],0), tmpM, null, 1);
      }
    }
  }

  // caves
  for(let s=0;s<4;s++){
    let a = s*Math.PI/2 + Math.PI/4, r=28;
    let cx=Math.cos(a)*r, cz=Math.sin(a)*r, h=terrainHeight(cx,cz);
    // arch
    for(let k=0;k<5;k++){
      let aa = -Math.PI/2 + k*Math.PI/4;
      let ax=Math.cos(aa)*1.8, ay=Math.sin(aa)*1.8;
      identity(tmpM); translate(tmpM,[cx+ax,h+ay+1.5,cz]); rotateY(tmpM,a+Math.PI/2); scale(tmpM,[0.35,0.35,0.6]);
      appendPrim(target, createBox(1,1,1,[0.22,0.18,0.16],0), tmpM, null, 1);
    }
    // side pillars
    identity(tmpM); translate(tmpM,[cx-1.8,h+1.0,cz]); rotateY(tmpM,a); scale(tmpM,[0.5,2,0.5]);
    appendPrim(target, createBox(1,1,1,[0.22,0.18,0.16],0), tmpM, null, 1);
    identity(tmpM); translate(tmpM,[cx+1.8,h+1.0,cz]); rotateY(tmpM,a); scale(tmpM,[0.5,2,0.5]);
    appendPrim(target, createBox(1,1,1,[0.22,0.18,0.16],0), tmpM, null, 1);
    // inner crystals
    for(let k=0;k<4;k++){
      identity(tmpM); translate(tmpM,[cx+(Math.random()-0.5)*2,h+0.5+Math.random()*0.8,cz+(Math.random()-0.5)*1.5]); scale(tmpM,[0.4,0.8,0.4]);
      appendPrim(target, createCone(0.12,1,5,[0.1,0.9,1.0],1.5), tmpM, null, 1);
    }
  }

  // central ruin structure
  {
    let a=3*Math.PI/2+Math.PI/4, r=22, cx=Math.cos(a)*r, cz=Math.sin(a)*r, h=terrainHeight(cx,cz);
    identity(tmpM); translate(tmpM,[cx,h+3,cz]); scale(tmpM,[0.8,6,0.8]);
    appendPrim(target, createBox(1,1,1,[0.45,0.45,0.48],0), tmpM, null, 1);
    for(let k=0;k<4;k++){
      let aa=k*Math.PI/2, dx=Math.cos(aa)*3, dz=Math.sin(aa)*3;
      identity(tmpM); translate(tmpM,[cx+dx,h+1,cz+dz]); rotateY(tmpM,aa); scale(tmpM,[0.4,2,0.4]);
      appendPrim(target, createBox(1,1,1,[0.4,0.4,0.42],0), tmpM, null, 1);
    }
    // fallen wall
    identity(tmpM); translate(tmpM,[cx-2.5,h+0.3,cz+2.5]); rotateY(tmpM,0.4); rotateZ(tmpM,0.15); scale(tmpM,[2.5,0.4,0.3]);
    appendPrim(target, createBox(1,1,1,[0.38,0.38,0.4],0), tmpM, null, 1);
  }

  return target;
}

// ============== Wildlife / artifacts ==============
function initCreatures(){
  let list=[];
  for(let i=0;i<45;i++){
    let a=Math.random()*Math.PI*2, r=5+Math.random()*45;
    let x=Math.cos(a)*r, z=Math.sin(a)*r, y=terrainHeight(x,z)+1.5+Math.random()*4;
    let b=biomeAt(x,z);
    let col;
    if(b==='fungal') col=[0.9,0.3,0.7]; else if(b==='crystal') col=[0.3,0.9,0.95]; else if(b==='desert') col=[0.95,0.7,0.25]; else col=[0.7,0.7,0.75];
    list.push({x,y,z,vx:0,vz:0,phase:Math.random()*10,col,speed:0.8+Math.random()*1.5, angle:a});
  }
  return list;
}
function initArtifacts(){
  let list=[];
  let positions=[];
  for(let s=0;s<4;s++){
    let a=s*Math.PI/2+Math.PI/4, r=27;
    positions.push([Math.cos(a)*r, terrainHeight(Math.cos(a)*r,Math.sin(a)*r)+1.2, Math.sin(a)*r]);
  }
  positions.push([0, terrainHeight(0,0)+1.5, 0]);
  for(let i=0;i<positions.length;i++){
    list.push({x:positions[i][0], y:positions[i][1], z:positions[i][2], baseY:positions[i][1], heldBy:null, phase:Math.random()*10, radius:0.35});
  }
  return list;
}

// ============== Interaction ==============
function raySphere(o,d,center,radius){
  let oc=[o[0]-center[0], o[1]-center[1], o[2]-center[2]];
  let a=d[0]*d[0]+d[1]*d[1]+d[2]*d[2];
  let b=2*(oc[0]*d[0]+oc[1]*d[1]+oc[2]*d[2]);
  let c=oc[0]*oc[0]+oc[1]*oc[1]+oc[2]*oc[2]-radius*radius;
  let disc=b*b-4*a*c;
  if(disc<0) return -1;
  let t=(-b-Math.sqrt(disc))/(2*a);
  return t>0?t:-1;
}

function getRay(pose){
  let o=[pose.transform.position.x, pose.transform.position.y, pose.transform.position.z];
  let q=[pose.transform.orientation.x, pose.transform.orientation.y, pose.transform.orientation.z, pose.transform.orientation.w];
  let d=quatRotateVector(q,[0,0,-1]);
  return {o,d};
}

// ============== WebGL init ==============
function initGL(){
  canvas = document.getElementById('gl');
  gl = canvas.getContext('webgl', { xrCompatible:true, antialias:false, alpha:false });
  if(!gl){ document.getElementById('status').textContent='WebGL not supported.'; return false; }
  gl.enable(gl.DEPTH_TEST);
  // Keep everything visible from both sides for exploration
  gl.disable(gl.CULL_FACE);
  progMain = program(gl, VS_MAIN, FS_MAIN);
  progParticle = program(gl, VS_PARTICLE, FS_PARTICLE);
  return true;
}

function buildMeshes(){
  worldMesh = new Mesh(gl, progMain, generateWorldData(), false);
  creatureMesh = new Mesh(gl, progMain, createCone(0.12,0.45,5,[1,1,1],0), false);
  artifactMesh = new Mesh(gl, progMain, createTorus(0.28,0.08,16,10,[1.0,0.75,0.15],1.5), false);
  controllerSphereMesh = new Mesh(gl, progMain, createSphere(1,8,[0.8,0.85,0.9],0.2), false);
  // two dynamic lines
  for(let k=0;k<2;k++) lineMeshes.push(new Mesh(gl, progMain, {v:[0,0,0,0,0,0], n:[0,1,0,0,1,0], c:[0.5,0.9,1,0.5,0.9,1], g:[1,1], i:[0,1]}, true, gl.LINES));
  particles = new ParticleSystem(gl, progParticle, 900);
  creatures = initCreatures();
  artifacts = initArtifacts();
}

// ============== WebXR ==============
const statusEl = document.getElementById('status');
const btn = document.getElementById('enterVR');

if(!('xr' in navigator)){
  statusEl.textContent='WebXR not available in this browser.';
  btn.disabled=true;
} else {
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
    if(!ok){ statusEl.textContent='VR session not supported on this device.'; btn.disabled=true; }
  });
}

btn.addEventListener('click', ()=>{
  if(!gl && !initGL()) return;
  navigator.xr.requestSession('immersive-vr', { requiredFeatures:['local-floor'] }).then(session=>{
    xrSession = session;
    session.addEventListener('end', ()=>{
      for(let art of artifacts) art.heldBy=null;
      heldBySource.clear();
      xrSession=null; refSpace=null; baseRefSpace=null;
      document.querySelector('#overlay .hud').style.display='';
    });
    session.addEventListener('selectstart', onSelectStart);
    session.addEventListener('selectend', onSelectEnd);
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
    session.requestReferenceSpace('local-floor').then(ref=>{
      baseRefSpace = ref;
      refSpace = ref;
      playerOffset={x:0,y:0,z:0};
      lastTime=0;
      if(!worldMesh) buildMeshes();
      session.requestAnimationFrame(onXRFrame);
      document.querySelector('#overlay .hud').style.display='none';
    });
  }).catch(e=>{ statusEl.textContent='Could not start VR: '+e.message; });
});

function onSelectStart(e){
  let src = e.inputSource;
  let frame = e.frame;
  if(!frame || !refSpace) return;
  let pose = frame.getPose(src.targetRaySpace, refSpace);
  if(!pose) return;
  let ray=getRay(pose);
  let bestT=Infinity, best=null;
  for(let art of artifacts){
    if(art.heldBy) continue;
    let t=raySphere(ray.o, ray.d, [art.x,art.y,art.z], art.radius);
    if(t>=0 && t<bestT){ bestT=t; best=art; }
  }
  if(best){ best.heldBy=src; heldBySource.set(src,best); }
}
function onSelectEnd(e){
  let src=e.inputSource;
  let art=heldBySource.get(src);
  if(art){ art.heldBy=null; heldBySource.delete(src); }
}

function updateReferenceSpace(){
  if(!baseRefSpace) return;
  refSpace = baseRefSpace.getOffsetReferenceSpace(new XRRigidTransform({x:-playerOffset.x,y:-playerOffset.y,z:-playerOffset.z}, {x:0,y:0,z:0,w:1}));
}

function processInput(frame, dt){
  if(!xrSession || !refSpace) return;
  dt = Math.min(0.05, dt || 0);
  let move=[0,0,0];
  let vertical=0;
  for(let src of xrSession.inputSources){
    if(!src.gamepad) continue;
    let axes = src.gamepad.axes;
    if(src.handedness==='left' && axes.length>=2){
      move[0]+=axes[0]; move[2]+=axes[1];
    }
    if(src.handedness==='right' && axes.length>=2){
      vertical-=axes[1];
    }
  }
  // head-relative movement
  let viewerPose = frame.getViewerPose(refSpace);
  if(viewerPose){
    let q=[viewerPose.transform.orientation.x, viewerPose.transform.orientation.y, viewerPose.transform.orientation.z, viewerPose.transform.orientation.w];
    let forward=quatRotateVector(q,[0,0,-1]); forward[1]=0; normalizeVec(forward);
    let right=quatRotateVector(q,[1,0,0]); right[1]=0; normalizeVec(right);
    let speed=4.0 * dt;
    let vFly=vertical*2.0*dt;
    playerOffset.x += (forward[0]*move[2] + right[0]*move[0]) * speed;
    playerOffset.z += (forward[2]*move[2] + right[2]*move[0]) * speed;
    playerOffset.y += vFly;
    playerOffset.y = clamp(playerOffset.y, -8, 25);
    updateReferenceSpace();
  }
}

function updateDynamic(dt, time){
  // artifacts hover
  for(let a of artifacts){
    if(!a.heldBy){
      a.y = a.baseY + Math.sin(time*1.5 + a.phase)*0.25;
    }
  }
  // creatures
  for(let c of creatures){
    c.angle += (Math.random()-0.5)*0.5*dt;
    c.vx = Math.cos(c.angle)*c.speed;
    c.vz = Math.sin(c.angle)*c.speed;
    c.x += c.vx*dt; c.z += c.vz*dt;
    let r=Math.hypot(c.x,c.z);
    if(r>55){ c.angle += Math.PI; c.x=clamp(c.x,-55,55); c.z=clamp(c.z,-55,55); }
    c.y = terrainHeight(c.x,c.z)+1.8+Math.sin(time*3+c.phase)*0.5;
  }
  particles.update(dt);
}

let lastFrame = null;
function onXRFrame(time, frame){
  lastFrame = frame;
  let session = frame.session;
  let now = time * 0.001;
  let dt = lastTime ? Math.min(now - lastTime, 0.1) : 0;
  lastTime = now;

  processInput(frame, dt);
  updateDynamic(dt, now);

  // resolve held artifact positions using current frame poses
  for(let [src, art] of heldBySource){
    let pose = frame.getPose(src.targetRaySpace, refSpace);
    if(pose){
      let ray=getRay(pose);
      art.x = ray.o[0] + ray.d[0]*1.6;
      art.y = ray.o[1] + ray.d[1]*1.6;
      art.z = ray.o[2] + ray.d[2]*1.6;
    }
  }

  let viewerPose = frame.getViewerPose(refSpace);
  if(!viewerPose){
    session.requestAnimationFrame(onXRFrame); return;
  }

  let layer = session.renderState.baseLayer;
  gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
  gl.clearColor(fogColor[0], fogColor[1], fogColor[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  for(let view of viewerPose.views){
    let vp = layer.getViewport(view);
    gl.viewport(vp.x, vp.y, vp.width, vp.height);
    renderView(view);
  }

  session.requestAnimationFrame(onXRFrame);
}

function renderView(view){
  let viewMat = view.transform.inverse.matrix;
  let proj = view.projectionMatrix;
  let camPos = [view.transform.position.x, view.transform.position.y, view.transform.position.z];
  let fog = {r:fogColor[0],g:fogColor[1],b:fogColor[2], near:fogNear, far:fogFar};
  let identityM=mat4(); identity(identityM);
  let tmp=mat4(), vp=mat4(), mvp=mat4();
  multiply(vp, proj, viewMat);

  // world
  worldMesh.draw(vp, identityM, identityM, camPos, lightDir, fog);

  // artifacts
  let artModel=mat4();
  for(let a of artifacts){
    composeTRS(artModel, [a.x,a.y,a.z], lastTime*0.8 + a.phase, 1.0);
    multiply(mvp, vp, artModel);
    artifactMesh.draw(mvp, artModel, artModel, camPos, lightDir, fog);
  }

  // creatures
  let creatureModel=mat4();
  for(let c of creatures){
    composeTRS(creatureModel, [c.x,c.y,c.z], c.angle + Math.PI/2, 0.5);
    multiply(mvp, vp, creatureModel);
    creatureMesh.draw(mvp, creatureModel, creatureModel, camPos, lightDir, fog, c.col);
  }

  // controllers
  if(xrSession){
    let idx=0;
    for(let src of xrSession.inputSources){
      if(idx>=2) break;
      let pose = lastFrame.getPose(src.targetRaySpace, refSpace);
      if(pose){
        let ray=getRay(pose);
        let end=[ray.o[0]+ray.d[0]*8, ray.o[1]+ray.d[1]*8, ray.o[2]+ray.d[2]*8];
        lineMeshes[idx].updatePositions([ray.o[0],ray.o[1],ray.o[2], end[0],end[1],end[2]]);
        lineMeshes[idx].draw(vp, identityM, identityM, camPos, lightDir, fog);
        let sph=mat4();
        composeTRS(sph, ray.o, 0, 0.04);
        multiply(mvp, vp, sph);
        controllerSphereMesh.draw(mvp, sph, sph, camPos, lightDir, fog);
      }
      idx++;
    }
  }

  // particles
  particles.draw(vp, 200);
}

// Initialize GL early so button can work
initGL();
</script>
</body>
</html>
