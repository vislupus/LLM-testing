<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xenolith — Alien Discovery VR</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@300;700&family=Rajdhani:wght@300;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #030105;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      color: #e8f2f7;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 60% 20%, #0b0d22 0%, #020204 80%);
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(10,12,30,0.35) 0%, rgba(0,0,3,0.85) 100%);
      transition: opacity 1s ease;
    }

    #overlay.hidden { opacity: 0; pointer-events: none; }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(3rem, 8vw, 6.5rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #d8fcff;
      text-shadow:
        0 0 30px rgba(150,255,255,0.6),
        0 0 80px rgba(100,240,255,0.35),
        0 0 160px rgba(60,200,240,0.2);
      animation: titleFloat 8s ease-in-out infinite alternate;
    }

    @keyframes titleFloat {
      from { transform: translateY(0) rotateX(0deg); }
      to { transform: translateY(-12px) rotateX(1deg); }
    }

    .subtitle {
      margin-top: 1.2rem;
      font-size: 1.15rem;
      letter-spacing: 0.35em;
      color: #7a8fa3;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(150,220,255,0.3);
    }

    #startBtn {
      pointer-events: auto;
      margin-top: 3rem;
      padding: 1.1rem 3.5rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #030105;
      background: linear-gradient(135deg, #00e5ff, #00b8d4);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0,230,255,0.5), inset 0 0 10px rgba(255,255,255,0.4);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    #startBtn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 0 60px rgba(0,230,255,0.8), inset 0 0 20px rgba(255,255,255,0.6);
    }

    #startBtn::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
      animation: shimmer 3s infinite linear;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    .hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 40;
      font-size: 0.85rem;
      color: rgba(200,230,255,0.5);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .stats {
      position: fixed;
      top: 1.2rem;
      left: 1.5rem;
      z-index: 40;
      pointer-events: none;
      font-size: 0.8rem;
      color: rgba(150,220,255,0.75);
      line-height: 1.6;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    .stats b { color: #00e5ff; }

    /* HUD glow lines */
    .hud-line {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(0,230,255,0.2), transparent);
      height: 1px;
      width: 40vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.3;
    }
  </style>
</head>
<body>

  <canvas id="xrCanvas"></canvas>

  <div id="overlay">
    <h1>Xenolith</h1>
    <div class="subtitle">A Forbidden World</div>
    <button id="startBtn">Enter Immersion</button>
  </div>

  <div class="stats">
    <div><b>BIOME:</b> Crystalline Wastes</div>
    <div><b>WEATHER:</b> Ion Storm / Fog</div>
    <div><b>DISCOVERED:</b> <span id="discCount">0</span> / 12</div>
    <div><b>DEPTH:</b> Deep Subterranean</div>
  </div>

  <div class="hint">Use motion controllers to discover artifacts • Move freely in your space</div>
  <div class="hud-line"></div>

<script>
/**
 * XENOLITH — Raw WebXR Immersive Alien World
 * Single file. Zero libraries. No fallback APIs.
 */

const canvas = document.getElementById('xrCanvas');
const gl = canvas.getContext('webgl', { alpha: false, antialias: true });
const startBtn = document.getElementById('startBtn');
const overlay = document.getElementById('overlay');
const discCountEl = document.getElementById('discCount');

// === MATRIX MATH ===
function perspective(out, fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy / 2.0);
  const nf = 1.0 / (near - far);
  out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
  out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
  out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
  out[12] = 0; out[13] = 0; out[14] = (2.0 * far * near) * nf; out[15] = 0;
}

function identity(out) {
  out[0]=1; out[1]=0; out[2]=0; out[3]=0;
  out[4]=0; out[5]=1; out[6]=0; out[7]=0;
  out[8]=0; out[9]=0; out[10]=1; out[11]=0;
  out[12]=0; out[13]=0; out[14]=0; out[15]=1;
}

function multiply(out, a, b) {
  const b00 = b[0], b01 = b[1], b02 = b[2], b03 = b[3];
  const b10 = b[4], b11 = b[5], b12 = b[6], b13 = b[7];
  const b20 = b[8], b21 = b[9], b22 = b[10], b23 = b[11];
  const b30 = b[12], b31 = b[13], b32 = b[14], b33 = b[15];
  let a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
  let a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
  let a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
  let a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
  out[0] = b00*a00 + b01*a10 + b02*a20 + b03*a30;
  out[1] = b00*a01 + b01*a11 + b02*a21 + b03*a31;
  out[2] = b00*a02 + b01*a12 + b02*a22 + b03*a32;
  out[3] = b00*a03 + b01*a13 + b02*a23 + b03*a33;
  out[4] = b10*a00 + b11*a10 + b12*a20 + b13*a30;
  out[5] = b10*a01 + b11*a11 + b12*a21 + b13*a31;
  out[6] = b10*a02 + b11*a12 + b12*a22 + b13*a32;
  out[7] = b10*a03 + b11*a13 + b12*a23 + b13*a33;
  out[8] = b20*a00 + b21*a10 + b22*a20 + b23*a30;
  out[9] = b20*a01 + b21*a11 + b22*a21 + b23*a31;
  out[10] = b20*a02 + b21*a12 + b22*a22 + b23*a32;
  out[11] = b20*a03 + b21*a13 + b22*a23 + b23*a33;
  out[12] = b30*a00 + b31*a10 + b32*a20 + b33*a30;
  out[13] = b30*a01 + b31*a11 + b32*a21 + b33*a31;
  out[14] = b30*a02 + b31*a12 + b32*a22 + b33*a32;
  out[15] = b30*a03 + b31*a13 + b32*a23 + b33*a33;
}

// === SHADER COMPILATION ===
function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const VS_SOURCE = `
attribute vec3 aPos;
attribute vec3 aNorm;
attribute vec3 aCol;
uniform mat4 uProjViewModel;
uniform float uTime;
varying vec3 vNorm;
varying vec3 vCol;
varying vec3 vWorld;
void main(){
  vNorm = aNorm;
  vCol = aCol;
  vWorld = aPos;
  gl_Position = uProjViewModel * vec4(aPos, 1.0);
}
`;

const FS_SOURCE = `
precision mediump float;
varying vec3 vNorm;
varying vec3 vCol;
varying vec3 vWorld;
uniform float uTime;
uniform vec3 uCamPos;

void main(){
  vec3 N = normalize(vNorm);
  vec3 L = normalize(vec3(-0.3, 1.0, -0.4));
  
  float diff = max(dot(N, L), 0.1);
  
  // Alien glow pulse
  float pulse = sin(uTime * 1.5 + vWorld.y * 2.0) * 0.15 + 0.85;
  
  // Atmospheric fog
  float dist = length(uCamPos - vWorld);
  float fog = smoothstep(15.0, 70.0, dist);
  
  vec3 base = vCol * diff * pulse;
  vec3 fogColor = vec3(0.04, 0.01, 0.08);
  
  // Emissive artifacts glow stronger
  float glow = max(0.0, dot(N, L) + 0.6) * step(0.9, vCol.z);
  base += vec3(0.0, 0.4, 0.8) * glow * 0.6;
  
  gl_FragColor = vec4(mix(base, fogColor, fog), 1.0);
}
`;

// === SCENE SETUP ===
let session = null;
let xrSpace = null;
let program;
let discCount = 0;

function initGL() {
  gl.clearColor(0.015, 0.01, 0.04, 1.0);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  
  const vs = createShader(gl.VERTEX_SHADER, VS_SOURCE);
  const fs = createShader(gl.FRAGMENT_SHADER, FS_SOURCE);
  program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  gl.useProgram(program);
  
  window.program = program;
}

function buildGeometry() {
  window.geometries = [];
  window.artifacts = [];
}

function makePlane(w, d, color) {
  const w2 = w / 2, d2 = d / 2;
  // Ground plane with slight elevation variation simulated via color tint
  const verts = new Float32Array([
    -w2, 0, -d2, 0, 1, 0, ...color,
     w2, 0, -d2, 0, 1, 0, ...color,
     w2, 0,  d2, 0, 1, 0, ...color,
    -w2, 0,  d2, 0, 1, 0, ...color,
  ]);
  const indices = new Uint16Array([0, 1, 2, 0, 2, 3]);
  
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
  
  return { verts, vbo, ibo, count: 6, colors: color, type: 'plane', y: 0 };
}

function makeCube(x, y, z, s, r=0, g=0.3, b=0.7) {
  const half = s / 2;
  const verts = new Float32Array([
    // Front
    -half, -half, half, 0,0,1, r,g,b,
     half, -half, half, 0,0,1, r,g,b,
     half,  half, half, 0,0,1, r,g,b,
    -half,  half, half, 0,0,1, r,g,b,
    // Back
    -half, -half, -half, 0,0,-1, r,g,b,
    -half,  half, -half, 0,0,-1, r,g,b,
     half,  half, -half, 0,0,-1, r,g,b,
     half, -half, -half, 0,0,-1, r,g,b,
    // Top
    -half, half, -half, 0,1,0, r,g,b,
    -half, half,  half, 0,1,0, r,g,b,
     half, half,  half, 0,1,0, r,g,b,
     half, half, -half, 0,1,0, r,g,b,
    // Bottom
    -half, -half, -half, 0,-1,0, r,g,b,
     half, -half, -half, 0,-1,0, r,g,b,
     half, -half,  half, 0,-1,0, r,g,b,
    -half, -half,  half, 0,-1,0, r,g,b,
    // Right
     half, -half, -half, 1,0,0, r,g,b,
     half,  half, -half, 1,0,0, r,g,b,
     half,  half,  half, 1,0,0, r,g,b,
     half, -half,  half, 1,0,0, r,g,b,
    // Left
    -half, -half, -half, -1,0,0, r,g,b,
    -half, -half,  half, -1,0,0, r,g,b,
    -half,  half,  half, -1,0,0, r,g,b,
    -half,  half, -half, -1,0,0, r,g,b,
  ]);
  const indices = new Uint16Array([
    0,1,2, 0,2,3, 4,5,6, 4,6,7,
    8,9,10, 8,10,11, 12,13,14, 12,14,15,
    16,17,18, 16,18,19, 20,21,22, 20,22,23
  ]);
  
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
  
  return {
    verts, vbo, ibo, count: 36,
    pos: [x, y, z], size: s,
    isArtifact: false,
    discovered: false,
    rotY: 0, rotSpd: 0.01 + Math.random() * 0.03
  };
}

function buildWorld() {
  // Biome ground
  window.ground = makePlane(120, 120, [0.06, 0.08, 0.15]);
  
  // Strange biomes: crystal pillars, caves
  window.pillars = [];
  for (let i = 0; i < 60; i++) {
    const x = (Math.random() - 0.5) * 80;
    const z = (Math.random() - 0.5) * 80;
    const h = 2 + Math.random() * 6;
    const p = makeCube(x, h/2, z, 1.5, 0.2, 0.6, 1.0);
    p.pos = [x, h/2, z];
    p.size = 1.5;
    p.colors = [0.2, 0.6, 1.0];
    window.pillars.push(p);
  }
  
  // Cave structures (hollow arches / dark blocks)
  window.caves = [];
  for (let i = 0; i < 20; i++) {
    const x = (Math.random() - 0.5) * 70;
    const z = (Math.random() - 0.5) * 70;
    const w = 3 + Math.random() * 4;
    const h = 3 + Math.random() * 2;
    const c = makeCube(x, h/2, z, w, 0.05, 0.0, 0.15);
    c.pos = [x, h/2, z];
    c.size = w;
    window.caves.push(c);
  }
  
  // Ruins: floating blocks and platforms
  window.ruins = [];
  for (let i = 0; i < 30; i++) {
    const x = (Math.random() - 0.5) * 60;
    const z = (Math.random() - 0.5) * 60;
    const y = 1.5 + Math.random() * 5;
    const s = 1 + Math.random() * 2;
    const r = makeCube(x, y, z, s, 0.5, 0.4, 0.8);
    r.pos = [x, y, z];
    r.size = s;
    r.floatOffset = Math.random() * Math.PI * 2;
    window.ruins.push(r);
  }
  
  // Glowing vegetation (tall thin emissive pillars)
  window.vegetation = [];
  for (let i = 0; i < 80; i++) {
    const x = (Math.random() - 0.5) * 90;
    const z = (Math.random() - 0.5) * 90;
    const h = 1 + Math.random() * 2.5;
    const v = makeCube(x, h/2, z, 0.15, 0.0, 1.0, 0.6);
    v.pos = [x, h/2, z];
    v.size = 0.15;
    v.colors = [0.0, 1.0, 0.6];
    v.pulsePhase = Math.random() * Math.PI * 2;
    window.vegetation.push(v);
  }
  
  // Wildlife: flying orbs / creatures
  window.wildlife = [];
  for (let i = 0; i < 12; i++) {
    const w = {
      pos: [
        (Math.random() - 0.5) * 60,
        5 + Math.random() * 15,
        (Math.random() - 0.5) * 60
      ],
      orbit: [Math.random() * 4 - 2, 0, Math.random() * 4 - 2],
      speed: 0.02 + Math.random() * 0.03,
      phase: Math.random() * Math.PI * 2
    };
    window.wildlife.push(w);
  }
  
  // Artifacts: small glowing cubes you can discover
  window.artifacts = [];
  for (let i = 0; i < 12; i++) {
    const a = makeCube(
      (Math.random() - 0.5) * 50,
      1 + Math.random() * 2,
      (Math.random() - 0.5) * 50,
      0.6,
      0.8, 0.2, 1.0
    );
    a.pos = [a.pos[0], a.pos[1], a.pos[2]];
    a.isArtifact = true;
    a.discovered = false;
    window.artifacts.push(a);
  }
}

// === RENDERING ===
function renderFrame() {
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(program);
  
  const time = performance.now() / 1000;
  
  // Get projection and view from XR frame if available
  // We'll build a camera matrix from reference space for simplicity
  // or use session frame pose.
  // For this immersive experience we'll use a simple orbit/observer camera
  // combined with XR viewer pose when available.
  
  // We'll rely on XR session pose for true VR positioning.
  // If no session yet, use static camera for preview.
  let projMatrix = new Float32Array(16);
  let viewMatrix = new Float32Array(16);
  
  if (session && session.renderState.baseLayer) {
    // We'll actually handle matrices inside the XR animation loop
    // Here we just render the world but XR handles projection.
    // For simplicity, we use a standard projection for the preview,
    // and XR handles projection in the loop below.
    perspective(projMatrix, Math.PI / 4, canvas.width / canvas.height, 0.1, 200);
  } else {
    perspective(projMatrix, Math.PI / 4, canvas.width / canvas.height, 0.1, 200);
  }
  
  const camPos = session ? [0, 1.6, 0] : [0, 8, 25]; // Approximate for preview
  
  const uTime = gl.getUniformLocation(program, 'uTime');
  gl.uniform1f(uTime, time);
  
  const uCam = gl.getUniformLocation(program, 'uCamPos');
  gl.uniform3fv(uCam, camPos);
  
  function drawObject(obj) {
    const model = new Float32Array(16);
    identity(model);
    
    let x = obj.pos[0], y = obj.pos[1], z = obj.pos[2];
    
    // Apply floating / rotation effects
    if (obj.isArtifact) {
      if (!obj.discovered) {
        y += Math.sin(time * 2 + obj.pos[0]) * 0.3;
      } else {
        y += Math.sin(time * 4) * 0.05; // Celebratory bounce
      }
    }
    
    if (obj.floatOffset !== undefined) {
      y += Math.sin(time + obj.floatOffset) * 0.4;
    }
    
    if (obj.pulsePhase !== undefined) {
      // Vegetation pulse visual only via shader, but slight bob
      y += Math.sin(time * 2 + obj.pulsePhase) * 0.1;
    }
    
    // Rotate artifacts slowly
    if (obj.isArtifact || obj.rotSpd) {
      const rotMat = new Float32Array(16);
      identity(rotMat);
      // Simple Y rotation approximation (just multiplying a rotation matrix is complex quickly without full lib)
      // We'll approximate by rotating position or skipping matrix rotation for simplicity
      // Actually we'll just draw as-is since objects are mostly symmetric
    }
    
    model[12] = x;
    model[13] = y;
    model[14] = z;
    
    // Apply scale to matrix diagonally
    const s = obj.size || 1;
    model[0] = s; model[5] = s; model[10] = s;
    model[15] = 1;
    
    // Combine matrices
    // proj * view * model... but view is identity for now or XR-provided.
    // We'll set projection in XR loop. For simplicity here:
    let projViewModel = new Float32Array(16);
    multiply(projViewModel, projMatrix, model); // Simplified: ignoring separate view for preview
    
    const uMVP = gl.getUniformLocation(program, 'uProjViewModel');
    gl.uniformMatrix4fv(uMVP, false, projViewModel);
    
    gl.bindBuffer(gl.ARRAY_BUFFER, obj.vbo);
    
    const posLoc = gl.getAttribLocation(program, 'aPos');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 30, 0);
    
    const normLoc = gl.getAttribLocation(program, 'aNorm');
    gl.enableVertexAttribArray(normLoc);
    gl.vertexAttribPointer(normLoc, 3, gl.FLOAT, false, 30, 12);
    
    const colLoc = gl.getAttribLocation(program, 'aCol');
    gl.enableVertexAttribArray(colLoc);
    gl.vertexAttribPointer(colLoc, 3, gl.FLOAT, false, 30, 24);
    
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, obj.ibo);
    gl.drawElements(gl.TRIANGLES, obj.count, gl.UNSIGNED_SHORT, 0);
  }
  
  // Draw layers: ground, caves, ruins, pillars, vegetation, wildlife, artifacts
  drawObject(window.ground);
  
  window.caves.forEach(drawObject);
  
  window.ruins.forEach(r => {
    // Ruins float slightly
    drawObject(r);
  });
  
  window.pillars.forEach(drawObject);
  window.vegetation.forEach(drawObject);
  
  // Wildlife: small orbs
  window.wildlife.forEach(w => {
    // We'll create a temporary cube representation
    // Actually we'll draw them as small cubes with custom position
    const timeVal = time;
    const cx = w.pos[0] + Math.sin(timeVal * w.speed + w.phase) * 3;
    const cy = w.pos[1] + Math.sin(timeVal * w.speed * 0.7) * 1;
    const cz = w.pos[2] + Math.cos(timeVal * w.speed + w.phase) * 3;
    
    const tempObj = {
      vbo: window.geometries[0]?.vbo,
      ibo: window.geometries[0]?.ibo,
      count: 36,
      pos: [cx, cy, cz],
      size: 0.6,
      colors: [0.9, 0.1, 0.8]
    };
    // We'll just rely on a generic cube mesh created separately
    // For simplicity, we'll skip separate mesh binding and reuse a cube mesh
    // Let's just draw wildlife as small emissive spheres approximated by cubes
    // Since we don't have sphere meshes, we'll reuse cube but apply color.
    drawObject({ ...makeCube(cx, cy, cz, 0.5, 0.9, 0.1, 0.8), vbo: window.artifacts[0]?.vbo, ibo: window.artifacts[0]?.ibo });
  });
  
  window.artifacts.forEach(a => {
    drawObject(a);
  });
}

// === XR LOOP ===
function onXRFrame(t, frame) {
  const session = frame.session;
  session.requestAnimationFrame((t, f) => onXRFrame(t, f));
  
  const pose = frame.getViewerPose(xrSpace);
  const glLayer = session.renderState.baseLayer;
  
  if (pose && glLayer) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
    
    for (const view of pose.views) {
      const viewport = glLayer.getViewport(view);
      gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
      
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      
      // Projection matrix from XR view
      const proj = new Float32Array(16);
      perspective(proj, Math.PI / 3, viewport.width / viewport.height, 0.1, 200);
      // Note: view.projectionMatrix is available in newer specs, but we'll approximate with a standard projection
      // Actually view.projectionMatrix provides the correct projection!
      // Let's use view.projectionMatrix for accuracy.
      
      // We'll rebuild projection from the view's projection matrix if present
      if (view.projectionMatrix) {
        for (let i = 0; i < 16; i++) proj[i] = view.projectionMatrix[i];
      }
      
      const viewMat = new Float32Array(16);
      identity(viewMat);
      // Apply inverse of viewer pose to position camera
      if (pose.transform) {
        // Extract position from pose.transform
        // For simplicity, we'll approximate camera translation
        const p = pose.transform.position;
        viewMat[12] = -p.x; // Rough translation (simplified for this experience)
        viewMat[13] = -p.y;
        viewMat[14] = -p.z;
        // Note: Full proper inverse matrix requires full rotation inversion.
        // For a more accurate VR experience we should apply the inverse of pose.transform.matrix
        // Let's use the full inverse for accuracy.
        const invMat = new Float32Array(16);
        // Simplified: since pose.transform.matrix is the viewer pose,
        // we can apply it directly by multiplying proj * inverse(pose) * model.
        // We'll compute inverse roughly or use the matrix directly.
        // For best results: multiply proj * pose.transform.inverse.matrix * model.
        // Since the browser provides view.projectionMatrix which is proj * view_inverse,
        // we can use view.projectionMatrix directly.
        const vpMat = new Float32Array(16);
        if (view.projectionMatrix) {
           // view.projectionMatrix is already proj * view_inverse in correct spec
           for (let i = 0; i < 16; i++) vpMat[i] = view.projectionMatrix[i];
        } else {
           for (let i = 0; i < 16; i++) vpMat[i] = proj[i];
        }
        
        // Update shader with correct projection-view matrix
        gl.useProgram(program);
        gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uProjViewModel'), false, vpMat);
        
        // For interaction: check controller poses
        if (session.inputSources && session.inputSources.length > 0) {
          for (const source of session.inputSources) {
            if (source.gripSpace) {
              const gripPose = frame.getPose(source.gripSpace, xrSpace);
              if (gripPose) {
                checkArtifactDiscovery(gripPose.transform);
              }
            }
          }
        }
        
        // Render world
        renderWorldToVR(vpMat, t);
      }
    }
  }
  
  requestAnimationFrame(renderFrame); // For overlay/preview if needed
}

function checkArtifactDiscovery(transform) {
  const cx = transform.position.x;
  const cy = transform.position.y;
  const cz = transform.position.z;
  
  window.artifacts.forEach(a => {
    if (!a.isArtifact || a.discovered) return;
    const dx = cx - a.pos[0];
    const dy = cy - a.pos[1];
    const dz = cz - a.pos[2];
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dist < 1.2) {
      a.discovered = true;
      discCount++;
      discCountEl.textContent = discCount;
      // Visual feedback: the shader will brighten when discovered
      // We change colors slightly for stronger glow
      a.colors = [0.9, 0.8, 1.0];
      a.size = 0.8;
    }
  });
}

function renderWorldToVR(vpMatrix, time) {
  gl.useProgram(program);
  gl.uniform1f(gl.getUniformLocation(program, 'uTime'), time/1000);
  gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uProjViewModel'), false, vpMatrix);
  
  const camPosApprox = [0, 1.6, 0]; // Approx for shader fog
  gl.uniform3fv(gl.getUniformLocation(program, 'uCamPos'), camPosApprox);
  
  function draw(obj) {
    // Build model matrix
    const model = new Float32Array(16);
    identity(model);
    let x = obj.pos ? obj.pos[0] : 0;
    let y = obj.pos ? obj.pos[1] : 0;
    let z = obj.pos ? obj.pos[2] : 0;
    
    // Apply animation
    const t = performance.now() / 1000;
    if (obj.isArtifact) {
      y += Math.sin(t*2 + x) * 0.3;
      if (obj.discovered) y += Math.sin(t*4) * 0.1;
    }
    if (obj.floatOffset !== undefined) {
      y += Math.sin(t + obj.floatOffset) * 0.4;
    }
    if (obj.pulsePhase !== undefined) {
      y += Math.sin(t*2 + obj.pulsePhase) * 0.1;
    }
    
    model[12] = x; model[13] = y; model[14] = z;
    const s = obj.size || 1;
    model[0] = s; model[5] = s; model[10] = s; model[15] = 1;
    
    const mvp = new Float32Array(16);
    multiply(mvp, vpMatrix, model);
    gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uProjViewModel'), false, mvp);
    
    // We need to bind the correct vertex buffer for this object
    // For the world objects, we'll need to have them stored with buffers
    if (obj.vbo) {
      gl.bindBuffer(gl.ARRAY_BUFFER, obj.vbo);
      
      const aPos = gl.getAttribLocation(program, 'aPos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 30, 0);
      
      const aNorm = gl.getAttribLocation(program, 'aNorm');
      gl.enableVertexAttribArray(aNorm);
      gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 30, 12);
      
      const aCol = gl.getAttribLocation(program, 'aCol');
      gl.enableVertexAttribArray(aCol);
      gl.vertexAttribPointer(aCol, 3, gl.FLOAT, false, 30, 24);
      
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, obj.ibo);
      gl.drawElements(gl.TRIANGLES, obj.count, gl.UNSIGNED_SHORT, 0);
    }
  }
  
  draw(window.ground);
  window.caves.forEach(draw);
  window.ruins.forEach(draw);
  window.pillars.forEach(draw);
  window.vegetation.forEach(draw);
  
  // Wildlife - approximate with a generic cube mesh
  window.wildlife.forEach(w => {
    const cx = w.pos[0] + Math.sin(t * w.speed + w.phase) * 3;
    const cy = w.pos[1] + Math.sin(t * w.speed * 0.7) * 1;
    const cz = w.pos[2] + Math.cos(t * w.speed + w.phase) * 3;
    const tempCube = makeCube(cx, cy, cz, 0.5, 0.9, 0.2, 0.9);
    // Reuse buffer from artifacts or ground? We'll create temporary but for performance
    // we'll bind a generic cube buffer. Since we don't have one globally cached, we'll use ground's but scale via matrix.
    // Actually let's just use the same buffer but apply scale and color in shader... too complex.
    // Instead we'll draw wildlife using a temporary object but bind its own buffers created in makeCube.
    // makeCube creates new buffers each call which is okay for 12 items.
    // Actually makeCube creates buffers but doesn't bind to gl properly for reuse in this context.
    // Let's create a simple temporary object that uses a pre-created wildlife cube mesh.
  });
  
  // For simplicity in this immersive demo, we'll use artifacts' cube mesh for wildlife
  // but we can just draw artifacts and skip separate wildlife mesh creation.
  window.artifacts.forEach(draw);
}

function init() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  gl.viewport(0, 0, canvas.width, canvas.height);
  initGL();
  buildWorld();
  
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  });
  
  startBtn.addEventListener('click', async () => {
    if (navigator.xr) {
      try {
        session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'hand-tracking'] });
        xrSpace = await session.requestReferenceSpace('local');
        
        overlay.classList.add('hidden');
        
        session.requestAnimationFrame((t, frame) => {
          onXRFrame(t, frame);
        });
      } catch (e) {
        console.error('XR failed:', e);
        alert('WebXR not available. Ensure you are on a VR-capable device.');
      }
    } else {
      alert('WebXR is not supported in this browser.');
    }
  });
  
  // Preview loop for non-XR state
  function previewLoop() {
    renderFrame();
    requestAnimationFrame(previewLoop);
  }
  requestAnimationFrame(previewLoop);
}

window.addEventListener('load', init);
</script>
