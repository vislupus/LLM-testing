<html> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Alien Planet Explorer</title> <style> body, html { margin: 0; padding: 0; width: 100%; height: 100%; } #webxr-button { position: absolute; bottom: 20px; left: 50%; transform: translate(-50%, 0); border: 0; padding: 12px 24px; border-radius: 4px; background: #fff; font-size: 20px; cursor: pointer; z-index: 99999; } </style> </head> <body> <button id="webxr-button">Enter VR</button> <script> const planetRadius = 1000; // VR button and presentation const xrButton = document.querySelector('#webxr-button'); let xrSession = null; let xrReferenceSpace = null; xrButton.addEventListener('click', onButtonClicked); async function onButtonClicked() { if (!xrSession) { navigator.xr.requestSession('immersive-vr', {optionalFeatures: ['local-floor']}).then(onSessionStarted, onRequestSessionError); } else { await xrSession.end(); } } function onSessionStarted(session) { xrSession = session; xrButton.innerHTML = 'Exit VR'; session.addEventListener('end', onSessionEnded); let canvas = document.createElement('canvas'); canvas.width = window.innerWidth; canvas.height = window.innerHeight; let gl = canvas.getContext('webgl', { xrCompatible: true }); let renderer = new WebGLRenderer(gl); session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) }); renderer.xr.setSession(session); renderer.xr.setReferenceSpaceType('local-floor'); renderer.autoClear = false; renderer.setAnimationLoop(render); document.body.appendChild(renderer.domElement); } function onRequestSessionError(ex) { console.error(ex.message); } function onSessionEnded() { xrButton.innerHTML = 'Enter VR'; xrSession = null; } // Rendering loop function render(timestamp, xrFrame) { if (xrFrame) { let pose = xrFrame.getViewerPose(xrReferenceSpace); xrSession.renderState.baseLayer.getViewport(pose.views[0]); scene.startFrame(); for (let view of pose.views) { let viewport = session.renderState.baseLayer.getViewport(view); renderer.setViewport(viewport.x, viewport.y, viewport.width, viewport.height); renderer.xr.setFoveation(0); // No foveated rendering let vr = renderer.xr.enabled; let camera = vr ? xrCamera : camera; camera.matrix.fromArray(view.transform.matrix); camera.updateMatrixWorld(true); camera.projectionMatrix.fromArray(view.projectionMatrix); scene.render(renderer, camera); } } } // Alien planet generation let materialLib = {}; function initMaterials() { materialLib.purple = new THREE.MeshPhongMaterial({ color: 0x9370DB }); materialLib.white = new THREE.MeshPhongMaterial({ color: 0xffffff }); materialLib.red = new THREE.MeshPhongMaterial({ color: 0xff0000 }); materialLib.green = new THREE.MeshPhongMaterial({ color: 0x00ff00 }); materialLib.silver = new THREE.MeshPhongMaterial({ color: 0xdddddd }); materialLib.gold = new THREE.MeshPhongMaterial({ color: 0xffcc00 }); materialLib.foliage = new THREE.MeshPhongMaterial({ color: 0x229922 }); } function createPlanet() { let geometry = new THREE.SphereGeometry(planetRadius, 64, 64); let material = new THREE.MeshPhongMaterial({ color: 0x603060 }); let mesh = new THREE.Mesh(geometry, material); mesh.position.set(0, 0, 0); scene.add(mesh); addCraters(mesh); addSurface(mesh); addVegetation(mesh); addAtmosphere(mesh); } function addCraters(planet) { for (let i = 0; i < 200; i++) { let pos = randomSpherePoint(planetRadius); let radius = Math.random() * 20 + 10; let geometry = new THREE.SphereGeometry(radius, 12, 12); let material = new THREE.MeshPhongMaterial({color: 0x303030}); let mesh = new THREE.Mesh(geometry, material); mesh.position.copy(pos); planet.add(mesh); } } function addSurface(planet) { let numRegions = Math.floor(Math.random() * 10) + 4; for (let i = 0; i < numRegions; i++) { let pos = randomSpherePoint(planetRadius); let radius = Math.random() * planetRadius/4 + planetRadius/16; let geometry = new THREE.ConeGeometry(radius, Math.random()*200 + 100, 4); let material = materialLib[randomProperty(materialLib)]; let mesh = new THREE.Mesh(geometry, material); mesh.lookAt(pos); mesh.position.copy(pos); planet.add(mesh); } } function addVegetation(planet) { for (let i = 0; i < 4000; i++) { let pos = randomSpherePoint(planetRadius); let height = Math.random() * 20 + 5; let geometry = new THREE.ConeGeometry(2, height, 8); let material = materialLib.foliage; let mesh = new THREE.Mesh(geometry, material); mesh.lookAt(pos); mesh.position.copy(pos); planet.add(mesh); } } function addAtmosphere(planet) { let geometry = new THREE.SphereGeometry(planetRadius * 1.01, 64, 64); let material = new THREE.MeshPhongMaterial({ color: 0x9999ff, opacity: 0.8, transparent: true }); let mesh = new THREE.Mesh(geometry, material); mesh.position.set(0, 0, 0); scene.add(mesh); } // Helper functions function randomSpherePoint(radius) { let u = Math.random(); let v = Math.random(); let theta = 2 * Math.PI * u; let phi = Math.acos(2 * v - 1); let x = radius * Math.sin(phi) * Math.cos(theta); let y = radius * Math.sin(phi) * Math.sin(theta); let z = radius * Math.cos(phi); return new THREE.Vector3(x, y, z); } function randomProperty(obj) { let keys = Object.keys(obj); return obj[keys[ keys.length * Math.random() << 0]]; }; // Setup scene initMaterials(); createPlanet(); </script> </body> </html>
