<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xenoterra — Alien Planet Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#0fa}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at 50% 80%,#0a2a1a,#000 70%);transition:opacity 1s}
#ov.hid{opacity:0;pointer-events:none}
#ttl{font-size:clamp(2rem,6vw,5rem);letter-spacing:.3em;color:#0fa;text-shadow:0 0 30px rgba(0,255,170,.5),0 0 60px rgba(0,255,170,.25);margin-bottom:.5rem;font-weight:100}
#sub{font-size:clamp(.7rem,1.8vw,1.1rem);color:#5a8a6a;letter-spacing:.5em;margin-bottom:3rem;text-transform:uppercase}
#btn{padding:1rem 3rem;background:0 0;border:1px solid #0fa;color:#0fa;font-size:1.1rem;letter-spacing:.2em;cursor:pointer;transition:all .3s;font-family:inherit}
#btn:hover{background:rgba(0,255,170,.13);box-shadow:0 0 30px rgba(0,255,170,.25)}
#sts{margin-top:1.5rem;color:#4a6a5a;font-size:.8rem;letter-spacing:.1em}
#hud{position:fixed;bottom:1.5rem;left:1.5rem;z-index:5;pointer-events:none;opacity:0;transition:opacity .8s}
#hud.vis{opacity:1}
#dtxt{font-size:.85rem;text-shadow:0 0 10px rgba(0,255,170,.4);max-width:28rem;line-height:1.5;transition:opacity .5s}
#alst{position:fixed;bottom:1.5rem;right:1.5rem;z-index:5;pointer-events:none;opacity:0;transition:opacity .8s;text-align:right;font-size:.75rem;color:#fa4;text-shadow:0 0 8px rgba(255,170,68,.4);line-height:1.6;white-space:pre}
#alst.vis{opacity:1}
</style>
</head>
<body>
<div id="ov">
  <div id="ttl">XENOTERRA</div>
  <div id="sub">Alien Planet Explorer</div>
  <button id="btn">Enter VR</button>
  <div id="sts">Initializing WebXR...</div>
</div>
<div id="hud"><div id="dtxt"></div></div>
<div id="alst"></div>
<canvas id="c"></canvas>

<script>
"use strict";

/* ═══════ MATH ═══════ */
var PI=Math.PI,TAU=PI*2;
function mix(a,b,t){return a+t*(b-a)}
function clamp(x,lo,hi){return min(hi,max(lo,x))}
function sstep(e0,e1,x){var t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t)}

// vec3
function v3(x,y,z){return[x||0,y||0,z||0]}
function v3add(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function v3sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function v3mul(a,s){return[a[0]*s,a[1]*s,a[2]*s]}
function v3dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function v3len(a){return sqrt(v3dot(a,a))}
function v3norm(a){var l=v3len(a);return l>1e-8?v3mul(a,1/l):v3()}
function v3cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}

// mat4 column-major
function m4(){return new Float32Array(16)}
function m4id(){var m=m4();m[0]=m[5]=m[10]=m[15]=1;return m}
function m4mul(a,b){
  var o=m4(),i,j,k,s;
  for(i=0;i<4;i++)for(j=0;j<4;j++){s=0;for(k=0;k<4;k++)s+=a[k*4+i]*b[j*4+k];o[j*4+i]=s;}
  return o;
}
function m4trans(x,y,z){var m=m4id();m[12]=x;m[13]=y;m[14]=z;return m}
function m4scal(x,y,z){var m=m4id();m[0]=x;m[5]=y;m[10]=z;return m}
function m4rotY(a){var m=m4id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m}
function m4rotX(a){var m=m4id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m}
function m4rotZ(a){var m=m4id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m}
function m4inv(m){
  var o=m4(),i;
  o[0]=m[5]*m[10]*m[15]-m[5]*m[11]*m[14]-m[9]*m[6]*m[15]+m[9]*m[7]*m[14]+m[13]*m[6]*m[11]-m[13]*m[7]*m[10];
  o[1]=-m[1]*m[10]*m[15]+m[1]*m[11]*m[14]+m[9]*m[2]*m[15]-m[9]*m[3]*m[14]-m[13]*m[2]*m[11]+m[13]*m[3]*m[10];
  o[2]=m[1]*m[6]*m[15]-m[1]*m[7]*m[14]-m[5]*m[2]*m[15]+m[5]*m[3]*m[14]+m[13]*m[2]*m[7]-m[13]*m[3]*m[6];
  o[3]=-m[1]*m[6]*m[11]+m[1]*m[7]*m[10]+m[5]*m[2]*m[11]-m[5]*m[3]*m[10]-m[9]*m[2]*m[7]+m[9]*m[3]*m[6];
  o[4]=-m[4]*m[10]*m[15]+m[4]*m[11]*m[14]+m[8]*m[6]*m[15]-m[8]*m[7]*m[14]-m[12]*m[6]*m[11]+m[12]*m[7]*m[10];
  o[5]=m[0]*m[10]*m[15]-m[0]*m[11]*m[14]-m[8]*m[2]*m[15]+m[8]*m[3]*m[14]+m[12]*m[2]*m[11]-m[12]*m[3]*m[10];
  o[6]=-m[0]*m[6]*m[15]+m[0]*m[7]*m[14]+m[4]*m[2]*m[15]-m[4]*m[3]*m[14]-m[12]*m[2]*m[7]+m[12]*m[3]*m[6];
  o[7]=m[0]*m[6]*m[11]-m[0]*m[7]*m[10]-m[4]*m[2]*m[11]+m[4]*m[3]*m[10]+m[8]*m[2]*m[7]-m[8]*m[3]*m[6];
  o[8]=m[4]*m[9]*m[15]-m[4]*m[11]*m[13]-m[8]*m[5]*m[15]+m[8]*m[7]*m[13]+m[12]*m[5]*m[11]-m[12]*m[7]*m[9];
  o[9]=-m[0]*m[9]*m[15]+m[0]*m[11]*m[13]+m[8]*m[1]*m[15]-m[8]*m[3]*m[13]-m[12]*m[1]*m[11]+m[12]*m[3]*m[9];
  o[10]=m[0]*m[5]*m[15]-m[0]*m[7]*m[13]-m[4]*m[1]*m[15]+m[4]*m[3]*m[13]+m[12]*m[1]*m[7]-m[12]*m[3]*m[5];
  o[11]=-m[0]*m[5]*m[11]+m[0]*m[7]*m[9]+m[4]*m[1]*m[11]-m[4]*m[3]*m[9]-m[8]*m[1]*m[7]+m[8]*m[3]*m[5];
  o[12]=-m[4]*m[9]*m[14]+m[4]*m[10]*m[13]+m[8]*m[5]*m[14]-m[8]*m[6]*m[13]-m[12]*m[5]*m[10]+m[12]*m[6]*m[9];
  o[13]=m[0]*m[9]*m[14]-m[0]*m[10]*m[13]-m[8]*m[1]*m[14]+m[8]*m[2]*m[13]+m[12]*m[1]*m[10]-m[12]*m[2]*m[9];
  o[14]=-m[0]*m[5]*m[14]+m[0]*m[6]*m[13]+m[4]*m[1]*m[14]-m[4]*m[2]*m[13]-m[12]*m[1]*m[6]+m[12]*m[2]*m[5];
  o[15]=m[0]*m[5]*m[10]-m[0]*m[6]*m[9]-m[4]*m[1]*m[10]+m[4]*m[2]*m[9]+m[8]*m[1]*m[6]-m[8]*m[2]*m[5];
  var det=m[0]*o[0]+m[1]*o[4]+m[2]*o[8]+m[3]*o[12];
  if(abs(det)<1e-10)return m4id();
  for(i=0;i<16;i++)o[i]/=det;
  return o;
}

/* ═══════ NOISE ═══════ */
var _P=new Uint8Array(512);
(function(){
  var s=7919,i,j;
  function sr(){s=(s*16807)%2147483647;return(s-1)/2147483646;}
  for(i=0;i<256;i++)_P[i]=i;
  for(i=255;i>0;i--){j=floor(sr()*(i+1));var t=_P[i];_P[i]=_P[j];_P[j]=t;}
  for(i=0;i<256;i++)_P[256+i]=_P[i];
})();
function _fade(t){return t*t*t*(t*(t*6-15)+10)}
function _grad2(h,x,y){var v=h&3;return((v&1)?-x:x)+((v&2)?-y:y)}
function noise2D(x,y){
  var X=floor(x)&255,Y=floor(y)&255,xf=x-floor(x),yf=y-floor(y);
  var u=_fade(xf),v=_fade(yf),a=_P[X]+Y,b=_P[X+1]+Y;
  return mix(mix(_grad2(_P[a],xf,yf),_grad2(_P[b],xf-1,yf),u),
             mix(_grad2(_P[a+1],xf,yf-1),_grad2(_P[b+1],xf-1,yf-1),u),v);
}
function fbm(x,y,oct,lac,gain){
  oct=oct||6;lac=lac||2;gain=gain||0.5;
  var v=0,a=1,f=1,mx=0,i;
  for(i=0;i<oct;i++){v+=noise2D(x*f,y*f)*a;mx+=a;a*=gain;f*=lac;}
  return v/mx;
}
function ridged(x,y,oct){
  oct=oct||4;var v=0,a=1,f=1,mx=0,i,n;
  for(i=0;i<oct;i++){n=1-abs(noise2D(x*f,y*f)*2);n*=n;v+=n*a;mx+=a;a*=0.5;f*=2;}
  return v/mx;
}

/* ═══════ WORLD ═══════ */
var CSIZ=32, CRES=20, CRAD=5;
var B_CRYST=0, B_FUNG=1, B_WASTE=2, B_SWAMP=3;
var bNames=['Crystal Fields','Fungal Forest','Barren Wastes','Glowing Swamp'];
var bCols=[
  {g:[0.04,0.12,0.12],a:[0.0,0.9,0.7]},
  {g:[0.06,0.14,0.06],a:[0.2,1.0,0.3]},
  {g:[0.18,0.08,0.03],a:[0.9,0.4,0.1]},
  {g:[0.08,0.04,0.12],a:[0.8,0.1,0.9]}
];
function getBiome(wx,wz){
  var n=noise2D(wx*0.008+50,wz*0.008+50);
  if(n<-0.2)return B_CRYST;if(n<0.1)return B_FUNG;if(n<0.35)return B_WASTE;return B_SWAMP;
}
function getHeight(wx,wz){
  var base=fbm(wx*0.015,wz*0.015,5)*12;
  var det=fbm(wx*0.06,wz*0.06,3)*1.5;
  var rdg=ridged(wx*0.02,wz*0.02,3)*4;
  var bio=getBiome(wx,wz);
  var h=base+det+rdg-4;
  if(bio===B_SWAMP)h=min(h,fbm(wx*0.015,wz*0.015,3)*3-1);
  if(bio===B_CRYST)h+=ridged(wx*0.04+100,wz*0.04+100,2)*2;
  return h;
}
function getNormal(wx,wz){
  var e=0.5;
  return v3norm([(getHeight(wx-e,wz)-getHeight(wx+e,wz))/(2*e),1,
                  (getHeight(wx,wz-e)-getHeight(wx,wz+e))/(2*e)]);
}
function posHash(x,z){var n=sin(x*12.9898+z*78.233)*43758.5453;return n-floor(n);}

/* ═══════ WEBGL ═══════ */
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl2',{xrCompatible:true,antialias:true});
if(!gl){document.getElementById('sts').textContent='WebGL2 required';throw new Error('no gl');}
gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.cullFace(gl.BACK);

function mkSh(src,type){
  var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error('Shader:',gl.getShaderInfoLog(s));return null;}
  return s;
}
function mkPr(vs,fs){
  var p=gl.createProgram();
  gl.attachShader(p,mkSh(vs,gl.VERTEX_SHADER));
  gl.attachShader(p,mkSh(fs,gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error('Link:',gl.getProgramInfoLog(p));return null;}
  return p;
}
function getU(prog,names){var u={},i;for(i=0;i<names.length;i++)u[names[i]]=gl.getUniformLocation(prog,names[i]);return u;}

/* ═══════ SHADERS ═══════ */

// Main terrain/object shader
var mainProg=mkPr(
  '#version 300 es\nprecision highp float;\n'+
  'in vec3 aP;in vec3 aN;in vec3 aC;in float aE;\n'+
  'uniform mat4 uProj,uView,uModel;uniform vec3 uCam;uniform float uTime;\n'+
  'out vec3 vWP,vN,vC;out float vE;\n'+
  'void main(){vec4 wp=uModel*vec4(aP,1.0);vWP=wp.xyz;gl_Position=uProj*uView*wp;vN=mat3(uModel)*aN;vC=aC;vE=aE;}',

  '#version 300 es\nprecision highp float;\n'+
  'in vec3 vWP,vN,vC;in float vE;uniform vec3 uCam;uniform float uTime;out vec4 oC;\n'+
  'void main(){\n'+
  '  vec3 n=normalize(vN);\n'+
  '  vec3 l1=normalize(vec3(0.4,0.7,0.5));vec3 l2=normalize(vec3(-0.6,0.3,-0.4));\n'+
  '  vec3 lc1=vec3(1.0,0.85,0.6);vec3 lc2=vec3(0.3,0.8,0.7);\n'+
  '  float d1=max(dot(n,l1),0.0);float d2=max(dot(n,l2),0.0);\n'+
  '  vec3 diff=vC*(0.1+lc1*d1*0.55+lc2*d2*0.3);\n'+
  '  float pulse=0.7+0.3*sin(uTime*1.5+vWP.x*0.5+vWP.z*0.3);\n'+
  '  vec3 emit=vC*vE*pulse*2.8;vec3 col=diff+emit;\n'+
  '  float dist=length(vWP-uCam);vec3 fc=vec3(0.02,0.05,0.04);\n'+
  '  float fog=1.0-exp(-dist*0.02);col=mix(col,fc,fog);\n'+
  '  col=col/(col+1.0);oC=vec4(col,1.0);}'
);
var mainU=getU(mainProg,['uProj','uView','uModel','uCam','uTime']);

// Sky shader
var skyProg=mkPr(
  '#version 300 es\nprecision highp float;\n'+
  'in vec2 aP;out vec3 vD;uniform mat4 uInv;\n'+
  'void main(){gl_Position=vec4(aP,0.999,1.0);vec4 d=uInv*vec4(aP,0.999,1.0);vD=d.xyz/d.w;}',

  '#version 300 es\nprecision highp float;\n'+
  'in vec3 vD;uniform float uTime;out vec4 oC;\n'+
  'float h3(vec3 p){p=fract(p*vec3(443.897,441.423,437.195));p+=dot(p,p.yzx+19.19);return fract((p.x+p.y)*p.z);}\n'+
  'float ns(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}\n'+
  'void main(){\n'+
  '  vec3 d=normalize(vD);float y=d.y;\n'+
  '  vec3 zen=vec3(0.005,0.01,0.025);vec3 hor=vec3(0.04,0.1,0.07);\n'+
  '  vec3 sky=mix(hor,zen,max(y,0.0));\n'+
  '  if(y<0.0)sky=mix(hor,vec3(0.005,0.01,0.005),min(-y*4.0,1.0));\n'+
  '  float n1=ns(d*3.0+uTime*0.02);float n2=ns(d*6.0-uTime*0.015);\n'+
  '  sky+=vec3(0.03,0.0,0.06)*n1*smoothstep(0.0,0.6,y);\n'+
  '  sky+=vec3(0.0,0.04,0.02)*n2*smoothstep(-0.1,0.3,y);\n'+
  '  float au=exp(-pow(d.x*2.5+sin(uTime*0.15+d.z),2.0))*exp(-pow(y-0.35,2.0)*8.0);\n'+
  '  sky+=vec3(0.0,0.12,0.04)*au*(0.6+0.4*sin(uTime*0.3));\n'+
  '  float a2=exp(-pow(d.x*1.8-0.5+cos(uTime*0.1),2.0))*exp(-pow(y-0.5,2.0)*12.0);\n'+
  '  sky+=vec3(0.04,0.0,0.08)*a2;\n'+
  '  float sv=h3(floor(d*400.0));float st=step(0.9975,sv);\n'+
  '  float tw=0.5+0.5*sin(uTime*2.5+sv*200.0);\n'+
  '  sky+=vec3(0.9,0.85,0.7)*st*tw*step(0.05,y)*0.8;\n'+
  '  vec3 m1d=normalize(vec3(0.5,0.6,-0.3));\n'+
  '  float m1=smoothstep(0.055,0.04,length(d-m1d));float m1g=smoothstep(0.12,0.04,length(d-m1d))*0.15;\n'+
  '  sky+=vec3(0.85,0.4,0.15)*m1+vec3(0.3,0.15,0.05)*m1g;\n'+
  '  vec3 m2d=normalize(vec3(-0.7,0.3,0.5));float m2=smoothstep(0.035,0.025,length(d-m2d));\n'+
  '  sky+=vec3(0.2,0.4,0.7)*m2;\n'+
  '  oC=vec4(sky,1.0);}'
);
var skyU=getU(skyProg,['uInv','uTime']);

// Sky VAO
var skyVAO=gl.createVertexArray(),skyBuf=gl.createBuffer();
gl.bindVertexArray(skyVAO);
gl.bindBuffer(gl.ARRAY_BUFFER,skyBuf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var skyAP=gl.getAttribLocation(skyProg,'aP');
gl.enableVertexAttribArray(skyAP);
gl.vertexAttribPointer(skyAP,2,gl.FLOAT,false,0,0);
gl.bindVertexArray(null);

// Particle shader
var partProg=mkPr(
  '#version 300 es\nprecision highp float;\n'+
  'in vec3 aP;in vec4 aD;uniform mat4 uPV;uniform float uTime;out vec4 vC;\n'+
  'void main(){\n'+
  '  vec3 p;p.x=aP.x+sin(uTime*aD.z+aD.w)*0.4;p.y=aP.y+abs(sin(uTime*aD.z*0.7+aD.w*2.0))*0.6;p.z=aP.z+cos(uTime*aD.z+aD.w*1.5)*0.4;\n'+
  '  gl_Position=uPV*vec4(p,1.0);gl_PointSize=max(1.5,6.0/gl_Position.w);vC=aD;}',

  '#version 300 es\nprecision highp float;\n'+
  'in vec4 vC;out vec4 oC;\n'+
  'void main(){float a=1.0-smoothstep(0.3,0.5,length(gl_PointCoord-0.5));oC=vec4(vC.rgb,vC.a*a);}'
);
var partU=getU(partProg,['uPV','uTime']);

// Beam shader (controller rays)
var beamProg=mkPr(
  '#version 300 es\nprecision highp float;\n'+
  'in vec3 aP;uniform mat4 uPV;void main(){gl_Position=uPV*vec4(aP,1.0);}',
  '#version 300 es\nprecision highp float;\n'+
  'uniform vec4 uBC;out vec4 oC;void main(){oC=uBC;}'
);
var beamU=getU(beamProg,['uPV','uBC']);

/* ═══════ GEOMETRY ═══════ */
function mkMeshVAO(vdata,idata){
  var vao=gl.createVertexArray();gl.bindVertexArray(vao);
  var vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  gl.bufferData(gl.ARRAY_BUFFER,vdata,gl.STATIC_DRAW);
  var stride=40;
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,stride,0);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,stride,12);
  gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,3,gl.FLOAT,false,stride,24);
  gl.enableVertexAttribArray(3);gl.vertexAttribPointer(3,1,gl.FLOAT,false,stride,36);
  var ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idata,gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return{vao:vao,count:idata.length};
}

// Terrain chunk
function buildChunk(cx,cz){
  var verts=[],inds=[],n=CRES+1,ox=cx*CSIZ,oz=cz*CSIZ,ix,iz,wx,wz,h,nm,bio,bc,t,r,g,b,hv,em;
  for(iz=0;iz<n;iz++){
    for(ix=0;ix<n;ix++){
      wx=ox+ix/CRES*CSIZ; wz=oz+iz/CRES*CSIZ;
      h=getHeight(wx,wz); nm=getNormal(wx,wz);
      bio=getBiome(wx,wz); bc=bCols[bio];
      t=clamp((h+4)/16,0,1);
      r=bc.g[0]*(1-t*0.3)+bc.a[0]*t*0.15;
      g=bc.g[1]*(1-t*0.3)+bc.a[1]*t*0.15;
      b=bc.g[2]*(1-t*0.3)+bc.a[2]*t*0.15;
      hv=noise2D(wx*0.1,wz*0.1)*0.03;
      em=0;
      if(bio===B_CRYST)em=0.1+ridged(wx*0.05+200,wz*0.05+200,2)*0.3;
      if(bio===B_SWAMP)em=0.15*max(0,noise2D(wx*0.03,wz*0.03));
      verts.push(wx,h,wz, nm[0],nm[1],nm[2], r+hv,g+hv,b+hv, em);
    }
  }
  for(iz=0;iz<CRES;iz++){
    for(ix=0;ix<CRES;ix++){
      var a=iz*n+ix,b2=a+1,c=a+n,d=c+1;
      inds.push(a,b2,c, b2,d,c);
    }
  }
  return{v:new Float32Array(verts),i:new Uint16Array(inds)};
}

// Crystal mesh
function buildCrystalMesh(ht,rad,seg){
  var verts=[],inds=[],i,a,ca,sa;
  seg=seg||6;
  for(i=0;i<=seg;i++){
    a=TAU*i/seg;ca=Math.cos(a);sa=Math.sin(a);
    verts.push(rad*ca,0,rad*sa, ca,0.3,sa, 0.0,0.9,0.7, 0.9);
    verts.push(rad*0.3*ca,ht,rad*0.3*sa, ca,1,sa, 0.0,1.0,0.8, 1.0);
  }
  verts.push(0,ht*1.2,0, 0,1,0, 0.0,1.0,0.9, 1.0);
  var tip=verts.length/10-1;
  for(i=0;i<seg;i++){
    var b=i*2,c2=b+2,d=b+3;
    inds.push(b,c2,d, c2,tip,d);
  }
  return mkMeshVAO(new Float32Array(verts),new Uint16Array(inds));
}

// Mushroom mesh
function buildMushMesh(ht,capR,seg){
  var verts=[],inds=[],i,a,ca,sa,n1,tip,base=0;
  seg=seg||8;
  var stemR=capR*0.2;
  for(i=0;i<=seg;i++){
    a=TAU*i/seg;ca=Math.cos(a);sa=Math.sin(a);
    verts.push(stemR*ca,0,stemR*sa, ca,0,sa, 0.15,0.4,0.1, 0.2);
    verts.push(stemR*ca,ht*0.7,stemR*sa, ca,0,sa, 0.2,0.5,0.15, 0.3);
  }
  n1=seg+1;
  for(i=0;i<seg;i++){var b=i*2,c2=b+2,d=b+3;inds.push(b,c2,d, d,c2, b+2*n1, d, b+3, b+2*n1+2);}
  for(i=0;i<=seg;i++){
    a=TAU*i/seg;ca=Math.cos(a);sa=Math.sin(a);
    verts.push(capR*ca,ht*0.7,capR*sa, ca,0.2,sa, 0.1,0.9,0.2, 0.8);
    verts.push(capR*0.7*ca,ht*0.7+capR*0.3,capR*0.7*sa, ca,1,sa, 0.3,1.0,0.4, 1.0);
  }
  verts.push(0,ht*0.7+capR*0.35,0, 0,1,0, 0.4,1.0,0.5, 1.0);
  tip=verts.length/10-1;
  var off=2*(seg+1);
  for(i=0;i<seg;i++){
    var b=off+i*2,c2=b+2,d=b+3;
    inds.push(b,c2,d, c2,tip,d);
  }
  return mkMeshVAO(new Float32Array(verts),new Uint16Array(inds));
}

// Pillar mesh (ruins)
function buildPillarMesh(w,ht,d){
  var v=[],idx=[],hw=w/2,hd=d/2;
  var faces=[
    [[-hw,0,hd],[hw,0,hd],[hw,ht,hd],[-hw,ht,hd],[0,0,1]],
    [[hw,0,-hd],[-hw,0,-hd],[-hw,ht,-hd],[hw,ht,-hd],[0,0,-1]],
    [[-hw,0,-hd],[-hw,0,hd],[-hw,ht,hd],[-hw,ht,-hd],[-1,0,0]],
    [[hw,0,hd],[hw,0,-hd],[hw,ht,-hd],[hw,ht,hd],[1,0,0]],
    [[-hw,ht,hd],[hw,ht,hd],[wx=hw,ht,-hd],[-hw,ht,-hd],[0,1,0]],
    [[-hw,0,-hd],[hw,0,-hd],[hw,0,hd],[-hw,0,hd],[0,-1,0]]
  ];
  // Fix: inline the faces properly
  v=[];idx=[];
  var fdata=[
    -hw,0,hd, hw,0,hd, hw,ht,hd, -hw,ht,hd, 0,0,1,
    hw,0,-hd, -hw,0,-hd, -hw,ht,-hd, hw,ht,-hd, 0,0,-1,
    -hw,0,-hd, -hw,0,hd, -hw,ht,hd, -hw,ht,-hd, -1,0,0,
    hw,0,hd, hw,0,-hd, hw,ht,-hd, hw,ht,hd, 1,0,0,
    -hw,ht,hd, hw,ht,hd, hw,ht,-hd, -hw,ht,-hd, 0,1,0,
    -hw,0,-hd, hw,0,-hd, hw,0,hd, -hw,0,hd, 0,-1,0
  ];
  var b2=0;
  for(var fi=0;fi<6;fi++){
    var nx=fdata[fi*15+12],ny=fdata[fi*15+13],nz=fdata[fi*15+14];
    for(var vi=0;vi<4;vi++){
      var px=fdata[fi*15+vi*3],py=fdata[fi*15+vi*3+1],pz=fdata[fi*15+vi*3+2];
      v.push(px,py,pz, nx,ny,nz, 0.15,0.12,0.1, 0.05);
    }
    idx.push(b2,b2+1,b2+2, b2,b2+2,b2+3);
    b2+=4;
  }
  return mkMeshVAO(new Float32Array(v),new Uint16Array(idx));
}

// Artifact mesh (tetrahedron)
function buildArtifactMesh(){
  var s=0.15;
  var pts=[[s,s,s],[-s,-s,s],[-s,s,-s],[s,-s,-s]];
  var faces=[[0,1,2],[1,3,2],[0,2,3],[0,3,1]];
  var v=[],idx=[];
  for(var fi=0;fi<faces.length;fi++){
    var f=faces[fi],a=pts[f[0]],b=pts[f[1]],c=pts[f[2]];
    var nm=v3norm(v3cross(v3sub(b,a),v3sub(c,a)));
    v.push(a[0],a[1],a[2],nm[0],nm[1],nm[2],1.0,0.7,0.2,1.0);
    v.push(b[0],b[1],b[2],nm[0],nm[1],nm[2],1.0,0.7,0.2,1.0);
    v.push(c[0],c[1],c[2],nm[0],nm[1],nm[2],1.0,0.7,0.2,1.0);
    idx.push(fi*3,fi*3+1,fi*3+2);
  }
  return mkMeshVAO(new Float32Array(v),new Uint16Array(idx));
}

// Creature mesh (sphere)
function buildCreatureMesh(){
  var v=[],idx=[],seg=8,r=0.3,lat,lon,phi,th,sp,cp,x,y,z,nx,ny,nz;
  for(lat=0;lat<=4;lat++){
    phi=PI*lat/4;
    for(lon=0;lon<=seg;lon++){
      th=TAU*lon/seg;sp=sin(phi);cp=cos(phi);
      x=r*sp*cos(th);y=r*cp;z=r*sp*sin(th);
      nx=sp*cos(th);ny=cp;nz=sp*sin(th);
      v.push(x,y,z,nx,ny,nz,0.6,0.3,0.7,0.4);
    }
  }
  var n=seg+1;
  for(lat=0;lat<4;lat++){
    for(lon=0;lon<seg;lon++){
      var a=lat*n+lon,b=a+1,c=a+n,d=c+1;
      idx.push(a,b,c, b,d,c);
    }
  }
  return mkMeshVAO(new Float32Array(v),new Uint16Array(idx));
}

  var bio=getBiome(ox+CSIZ/2,oz+CSIZ/2);

    }
  }
  if(bio===B_FUNG){

      lx=posHash(i+ox*0.371,5+oz*0.571)*CSIZ;
      lz=posHash(i+ox*0.371,6+oz*0.571)*CSIZ;

        pos:[wx,wh,wz],scale:0.4+posHash(i+ox,7+oz)*1.2,rot:posHash(i+ox,8+oz)*TAU});
    }
  }
  if(bio===B_WASTE&&posHash(ox,9+oz)>0.5){
    var cx2=ox+CSIZ*0.5+posHash(1+ox,9+oz)*4;
    var cz2=oz+CSIZ*0.5+posHash(2+ox,9+oz)*4;
    wh=getHeight(cx2,cz2);

      var ang=TAU*i/4+posHash(i+ox,10+oz)*0.3;
      objs.push({mesh:i%2?pillarM1:pillarM2,
        pos:[cx2+cos(ang)*2,wh,cz2+sin(ang)*2],
        scale:0.6+posHash(i+ox,11+oz)*0.8,rot:ang});
    }
  }
  if(bio===B_SWAMP){
    for(i=0;i<6;i++){
      lx=posHash(i+ox*0.371,12+oz*0.571)*CSIZ;
      lz=posHash(i+ox*0.371,13+oz*0.571)*CSIZ;

        pos:[wx,wh,wz],scale:0.3+posHash(i+ox,14+oz)*0.6,rot:posHash(i+ox,15+oz)*TAU});
    }
  }
  objCache.set(k,objs);
  return objs;
}

var audioCtx=null,masterGain=null;
function initAudio(){
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();masterGain.gain.value=0.25;
    masterGain.connect(audioCtx.destination);
    // Drone
    var dr=audioCtx.createOscillator();dr.type='sawtooth';dr.frequency.value=55;
    var dg=audioCtx.createGain();dg.gain.value=0.06;
    var df=audioCtx.createBiquadFilter();df.type='lowpass';df.frequency.value=120;
    dr.connect(df);df.connect(dg);dg.connect(masterGain);dr.start();
    // Second drone
    var dr2=audioCtx.createOscillator();dr2.type='sine';dr2.frequency.value=82.5;
    var dg2=audioCtx.createGain();dg2.gain.value=0.04;
    dr2.connect(dg2);dg2.connect(masterGain);dr2.start();
    // Wind
    var bsz=audioCtx.sampleRate*2,nb=audioCtx.createBuffer(1,bsz,audioCtx.sampleRate);
    var nd=nb.getChannelData(0);for(var j=0;j<bsz;j++)nd[j]=Math.random()*2-1;
    var ns=audioCtx.createBufferSource();ns.buffer=nb;ns.loop=true;
    var nf=audioCtx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=400;nf.Q.value=0.5;
    var ng=audioCtx.createGain();ng.gain.value=0.04;
    ns.connect(nf);nf.connect(ng);ng.connect(masterGain);ns.start();
    // Shimmer
    var sh=audioCtx.createOscillator();sh.type='sine';sh.frequency.value=880;
    var sg=audioCtx.createGain();sg.gain.value=0.008;
    var sl=audioCtx.createOscillator();sl.frequency.value=0.3;
    var slg=audioCtx.createGain();slg.gain.value=0.008;
    sl.connect(slg);slg.connect(sg.gain);
    sh.connect(sg);sg.connect(masterGain);sh.start();sl.start();
  }catch(e){console.error('Audio init failed:',e);}
}
function playChime(freq){
  if(!audioCtx)return;
  try{
    var o=audioCtx.createOscillator();o.type='sine';o.frequency.value=freq;
    var g=audioCtx.createGain();g.gain.setValueAtTime(0.12,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.5);
    o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+1.5);
  }catch(e){}
}
function playDiscover(){
  if(!audioCtx)return;
  var freqs=[523,659,784];
  for(var j=0;j<freqs.length;j++){
    (function(f,delay){
      setTimeout(function(){
        try{
          var o=audioCtx.createOscillator();o.type='triangle';o.frequency.value=f;
          var g=audioCtx.createGain();g.gain.setValueAtTime(0.1,audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.8);
          o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+0.8);
        }catch(e){}
      },delay);
    })(freqs[j],j*120);
  }
}

/* ═══════ INTERACTION ═══════ */
function raycast(origin,dir,maxDist){
  var step=0.5,t,p,h;
  for(t=0;t<maxDist;t+=step){
    p=v3add(origin,v3mul(dir,t));
    h=getHeight(p[0],p[2]);
    if(p[1]<=h)return{pos:v3(p[0],h,p[2]),dist:t};
  }
  return null;
}
function raycastArts(origin,dir,maxDist){
  var best=null,bestD=maxDist;
  for(var j=0;j<artifacts.length;j++){
    var a=artifacts[j];if(a.found)continue;
    var oc=v3sub(a.pos,origin);
    var t=v3dot(oc,dir);
    if(t<0||t>bestD)continue;
    var p=v3add(origin,v3mul(dir,t));
    var d=v3len(v3sub(p,a.pos));
    if(d<1.0){best=a;bestD=t;}
  }
  return best;
}

var xrSession=null,glLayer=null,refSpace=null;
var camPos=v3(0,5,0);
var ctrls=[null,null];
var prevTime=0,elapsed=0,frameCnt=0;
var turnCooldown=0;

var overlay=document.getElementById('ov');
var startBtn=document.getElementById('btn');
var stsEl=document.getElementById('sts');
var hudEl=document.getElementById('hud');
var alstEl=document.getElementById('alst');

function onSessionEnd(){
  xrSession=null;overlay.classList.remove('hid');
  stsEl.textContent='Session ended';
  if(audioCtx)try{audioCtx.close();}catch(e){}
}

function onFrame(time,xrFrame){
  if(!xrSession)return;
  xrSession.requestAnimationFrame(onFrame);
  var dt=min((time-prevTime)/1000,0.05);prevTime=time;
  elapsed=time/1000;frameCnt++;
  turnCooldown=max(0,turnCooldown-dt);

  var pose=xrFrame.getViewerPose(refSpace);
  if(!pose)return;

  // Camera from pose
  var vm=pose.transform.matrix;
  camPos[0]=vm[12];camPos[1]=vm[13];camPos[2]=vm[14];

  // Controllers
  var inputArr=xrSession.inputSources;
  for(var si=0;si<inputArr.length;si++){
    var src=inputArr[si];
    var idx=src.handedness==='left'?0:1;
    if(src.gripSpace){
      var gp=xrFrame.getPose(src.gripSpace,refSpace);
      if(gp){
        var gm=gp.transform.matrix;
        ctrls[idx]={pos:[gm[12],gm[13],gm[14]],mat:gm,
          rayDir:[-gm[8],-gm[9],-gm[10]]};
        // Locomotion
        if(src.gamepad){
          var axes=src.gamepad.axes;
          var trig=src.gamepad.buttons[0];
          // Move (left stick)
          if(idx===0){
            var mx=axes[2]||0, mz=axes[3]||0;
            if(abs(mx)+abs(mz)<0.15){mx=axes[0];mz=axes[1];}
            if(abs(mx)+abs(mz)>0.15){
              var fwd=[vm[8],0,vm[10]];
              var fL=sqrt(fwd[0]*fwd[0]+fwd[2]*fwd[2]);
              if(fL>0.01){fwd[0]/=fL;fwd[2]/=fL;}
              var right=[fwd[2],0,-fwd[0]];
              var move=v3add(v3mul(fwd,-mz),v3mul(right,mx));
              var mL=v3len(move);
              if(mL>0.01){
                move=v3mul(move,min(mL,1)*3.0*dt);
                var np=v3add(camPos,move);
                var nh=getHeight(np[0],np[2])+1.6;
                np[1]=nh-camPos[1];np[0]=move[0];np[2]=move[2];
                try{
                  var offset=new XRRigidTransform({x:np[0],y:np[1],z:np[2]},{x:0,y:0,z:0,w:1});
                  refSpace=refSpace.getOffsetReferenceSpace(offset);
                }catch(e){}
              }
            }
          }
          // Snap turn (right stick)
          if(idx===1&&turnCooldown<=0&&abs(axes[2])>0.7){
            var ang=axes[2]>0?PI/4:-PI/4;
            try{
              var q={x:0,y:sin(ang/2),z:0,w:cos(ang/2)};
              var off2=new XRRigidTransform({x:0,y:0,z:0},q);
              refSpace=refSpace.getOffsetReferenceSpace(off2);
              turnCooldown=0.3;
            }catch>catch(e){}
          }
          // Interact
          if(trig&&trig.pressed&&ctrls[idx]){
            var hit=raycastArts(ctrls[idx].pos,ctrls[idx].rayDir,10);
            if(hit){addArtifact(hit);playChime(440+hit.id*50);}
            else{
              var tH=raycast(ctrls[idx].pos,ctrls[idx].rayDir,20);
              if(tH){
                var b2=getBiome(tH.pos[0],tH.pos[2]);
                showDisc('Scanned: '+bNames[b2]+' terrain');
                playChime(220+b2*110);
              }
            }
          }
        }
      }
    }
  }

  // Update creatures
  for(var ci=0;ci<creatures.length;ci++){
    var c=creatures[ci];
    c.phase+=dt*c.speed;
    c.pos[0]=c.baseX+sin(c.phase*0.3)*3;
    c.pos[2]=c.baseZ+cos(c.phase*0.2)*3;
    c.pos[1]=getHeight(c.pos[0],c.pos[2])+c.height+sin(c.phase)*0.5;
  }

  // Check biome
  var curBio=getBiome(camPos[0],camPos[2]);
  if(curBio!==lastBiome){
    if(lastBiome>=0)showDisc('Entering: '+bNames[curBio]);
    else showDisc('Arrived on Xenoterra. Explore the '+bNames[curBio]+'.');
    lastBiome=curBio;
  }

  // Particles
  if(frameCnt%8===0)initParticles(camPos,elapsed);

  // ═══ RENDER ═══
  gl.bindFramebuffer(gl.FRAMEBUFFER,glLayer.framebuffer);
  gl.clearColor(0.01,0.03,0.02,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  for(var vi=0;vi<pose.views.length;vi++){
    var view=pose.views[vi];
    var vp=glLayer.getViewport(view);
    gl.viewport(vp.x,vp.y,vp.width,vp.height);

    var proj=new Float32Array(view.projectionMatrix);
    var viewM=new Float32Array(view.transform.inverse.matrix);
    var camP=camPos;

    // Sky
    gl.disable(gl.DEPTH_TEST);gl.depthMask(false);
    gl.useProgram(skyProg);
    var pv=m4mul(proj,viewM);
    var invPV=m4inv(pv);
    gl.uniformMatrix4fv(skyU.uInv,false,invPV);
    gl.uniform1f(skyU.uTime,elapsed);
    gl.bindVertexArray(skyVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.depthMask(true);gl.enable(gl.DEPTH_TEST);

    // Terrain + objects
    gl.useProgram(mainProg);
    gl.uniformMatrix4fv(mainU.uProj,false,proj);
    gl.uniformMatrix4fv(mainU.uView,false,viewM);
    gl.uniform3fv(mainU.uCam,camP);
    gl.uniform1f(mainU.uTime,elapsed);

    var cCX=floor(camP[0]/CSIZ),cCZ=floor(camP[2]/CSIZ);
    var idMat=m4id();
    gl.uniformMatrix4fv(mainU.uModel,false,idMat);

    // Terrain chunks
    var chunksThisFrame=0;
    for(var dx=-CRAD;dx<=CRAD;dx++){
      for(var dz=-CRAD;dz<=CRAD;dz++){
        var ch=getChunk(cCX+dx,cCZ+dz);
        if(!ch){
          if(chunksThisFrame<2){ch=genChunk(cCX+dx,cCZ+dz);chunksThisFrame++;}
          else continue;
        }
        gl.bindVertexArray(ch.vao);
        gl.drawElements(gl.TRIANGLES,ch.count,gl.UNSIGNED_SHORT,0);
      }
    }

    // Objects per chunk
    for(dx=-CRAD;dx<=CRAD;dx++){
      for(dz=-CRAD;dz<=CRAD;dz++){
        var ck=(cCX+dx)+','+(cCZ+dz);
        if(!chunks.has(ck))continue;
        var objs=getChunkObjs(cCX+dx,cCZ+dz);
        for(var oi=0;oi<objs.length;oi++){
          var o=objs[oi];
          var m=m4mul(m4trans(o.pos[0],o.pos[1],o.pos[2]),m4mul(m4rotY(o.rot),m4scal(o.scale,o.scale,o.scale)));
          gl.uniformMatrix4fv(mainU.uModel,false,m);
          gl.bindVertexArray(o.mesh.vao);
          gl.drawElements(gl.TRIANGLES,o.mesh.count,gl.UNSIGNED_SHORT,0);
        }
      }
    }

    // Artifacts
    for(var ai=0;ai<artifacts.length;ai++){
      var art=artifacts[ai];
      var ad=v3len(v3sub(art.pos,camP));
      if(ad>CSIZ*CRAD||ad<0.1)continue;
      var am=m4mul(m4trans(art.pos[0],art.pos[1],art.pos[2]),
        m4mul(m4rotY(elapsed*0.5+art.id),m4scal(art.scale,art.scale,art.scale)));
      gl.uniformMatrix4fv(mainU.uModel,false,am);
      gl.bindVertexArray(artMesh.vao);
      gl.drawElements(gl.TRIANGLES,artMesh.count,gl.UNSIGNED_SHORT,0);
    }

    // Creatures
    for(ci=0;ci<creatures.length;ci++){
      c=creatures[ci];
      var cd=v3len(v3sub(c.pos,camP));
      if(cd>CSIZ*CRAD)continue;
      var cm=m4mul(m4trans(c.pos[0],c.pos[1],c.pos[2]),
        m4mul(m4rotY(c.phase),m4scal(c.radius,c.radius,c.radius)));
      gl.uniformMatrix4fv(mainU.uModel,false,cm);
      gl.bindVertexArray(creatMesh.vao);
      gl.drawElements(gl.TRIANGLES,creatMesh.count,gl.UNSIGNED_SHORT,0);
    }

    // Particles
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    gl.depthMask(false);
    gl.useProgram(partProg);
    gl.uniformMatrix4fv(partU.uPV,false,pv);
    gl.uniform1f(partU.uTime,elapsed);
    gl.bindVertexArray(partVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER,partBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,partData.subarray(0,partCount*7));
    gl.drawArrays(gl.POINTS,0,partCount);
    gl.depthMask(true);gl.disable(gl.BLEND);

    // Controller beams
    gl.useProgram(beamProg);
    gl.uniformMatrix4fv(beamU.uPV,false,pv);
    for(var bi=0;bi<2;bi++){
      var ct=ctrls[bi];
      if(!ct)continue;
      var end=v3add(ct.pos,v3mul(ct.rayDir,5));
      gl.bindVertexArray(beamVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER,beamBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER,0,new Float32Array([
        ct.pos[0],ct.pos[1],ct.pos[2],end[0],end[1],end[2]
      ]));
      gl.uniform4f(beamU.uBC,0.0,1.0,0.67,0.5);
      gl.drawArrays(gl.LINES,0,2);
    }
  }

  // Chunk cleanup
  if(chunks.size>100){
    var toDel=[];
    chunks.forEach(function(val,k){
      var parts=k.split(',');
      var ccx=parseInt(parts[0]),ccz=parseInt(parts[1]);
      if(abs(ccx-cCX)>CRAD+3||abs(ccz-cCZ)>CRAD+3)toDel.push(k);
    });
    for(var di=0;di<toDel.length;di++)chunks.delete(toDel[di]);
  }
}

/* ═══════ INIT ═══════ */
async function initXR(){
  if(!navigator.xr){stsEl.textContent='WebXR not available';return;}
  var supported=false;
  try{supported=await navigator.xr.isSessionSupported('immersive-vr');}catch(e){}
  if(!supported){stsEl.textContent='VR headset not detected';return;}
  stsEl.textContent='VR ready — click to enter';
  startBtn.onclick=async function(){
    try{
      xrSession=await navigator.xr.requestSession('immersive-vr',{
        requiredFeatures:['local-floor'],
        optionalFeatures:['bounded-floor','hand-tracking']
      });
      xrSession.addEventListener('end',onSessionEnd);
      await gl.makeXRCompatible();
      glLayer=new XRWebGLLayer(xrSession,gl,{antialias:true});
      xrSession.updateRenderState({baseLayer:glLayer});
      refSpace=await xrSession.requestReferenceSpace('local-floor');
      overlay.classList.add('hid');
      hudEl.classList.add('vis');
      alstEl.classList.add('vis');
      initAudio();
      prevTime=performance.now();
      // Pre-generate nearby chunks
      for(var dx=-3;dx<=3;dx++){
        for(var dz=-3;dz<=3;dz++)genChunk(dx,dz);
      }
      initParticles(v3(0,5,0),0);
      xrSession.requestAnimationFrame(onFrame);
    }catch(e){stsEl.textContent='Failed: '+e.message;}
  };
}
initXR();
</script>
