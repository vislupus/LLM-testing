<style>

  pointer-events:none;letter-spacing:.1em;text-align:center}

<body>
<div id="overlay">
  <h1>XYTHARA-7</h1>
  <div class="sub">UNCHARTED WORLD // SECTOR 7G</div>
  <p>Bioluminescent life pulses beneath twin moons. Crystal spires pierce the mist. Ancient ruins whisper of a dead civilization. Eight artifacts await discovery.</p>
  <button id="startBtn" disabled>SCANNING FOR VR...</button>
</div>
<div id="info"></div>
<canvas id="c"></canvas>
<script>
/* ============================================================
   XYTHARA-7 — Immersive WebXR Alien Planet
   No libraries. Pure WebGL2 + WebXR API.
   ============================================================ */

// ─── MATH ────────────────────────────────────────────────────
const M4={
  create:()=>new Float32Array(16),
  id:o=>{o.fill(0);o[0]=o[5]=o[10]=o[15]=1;return o},
  persp:(o,fov,a,n,f)=>{const t=1/Math.tan(fov*.5),nf=1/(n-f);o.fill(0);
    o[0]=t/a;o[5]=t;o[10]=(f+n)*nf;o[11]=-1;o[14]=2*f*n*nf;return o},
  mul:(o,a,b)=>{const t=new Float32Array(16);
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+i]*b[j*4+k];t[j*4+i]=s}
    o.set(t);return o},
  trans:(o,v)=>{const t=M4.create();M4.id(t);t[12]=v[0];t[13]=v[1];t[14]=v[2];return M4.mul(o,o,t)},
  scale:(o,v)=>{const t=M4.create();M4.id(t);t[0]=v[0];t[5]=v[1];t[10]=v[2];return M4.mul(o,o,t)},
  rotX:(o,r)=>{const t=M4.create();M4.id(t);const c=Math.cos(r),s=Math.sin(r);
    t[5]=c;t[6]=s;t[9]=-s;t[10]=c;return M4.mul(o,o,t)},
  rotY:(o,r)=>{const t=M4.create();M4.id(t);const c=Math.cos(r),s=Math.sin(r);
    t[0]=c;t[2]=-s;t[8]=s;t[10]=c;return M4.mul(o,o,t)},
  inv:(o,a)=>{const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],
    a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15],
    b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,
    b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,
    b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
    let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return o;d=1/d;
    o[0]=(a11*b11-a12*b10+a13*b09)*d;o[1]=(a02*b10-a01*b11-a03*b09)*d;
    o[2]=(a31*b05-a32*b04+a33*b03)*d;o[3]=(a22*b04-a21*b05-a23*b03)*d;
    o[4]=(a12*b08-a10*b11-a13*b07)*d;o[5]=(a00*b11-a02*b08+a03*b07)*d;
    o[6]=(a32*b02-a30*b05-a33*b01)*d;o[7]=(a20*b05-a22*b02+a23*b01)*d;
    o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;
    o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
    o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;
    o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;return o},
  pos:m=>[m[12],m[13],m[14]],
  fwd:m=>{const l=Math.sqrt(m[8]*m[8]+m[10]*m[10])||1;return[m[8]/l,0,m[10]/l]},
  right:m=>{const f=M4.fwd(m);return[f[2],0,-f[0]]}
};
const v3sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const v3dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const v3len=a=>Math.sqrt(v3dot(a,a));
const v3norm=a=>{const l=v3len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const v3dist=(a,b)=>v3len(v3sub(a,b));
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

// ─── NOISE ───────────────────────────────────────────────────
function hash2(ix,iy){let n=ix*374761393+iy*668265263;n=(n^(n>>13))*1274126177;return((n^(n>>16))&0x7fffffff)/0x7fffffff}
function noise2(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),sx),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),sx),sy)}
function fbm(x,y,oct){let v=0,a=.5,f=1;for(let i=0;i<oct;i++){v+=a*noise2(x*f,y*f);a*=.5;f*=2}return v}

// ─── TERRAIN ─────────────────────────────────────────────────
const TSIZE=200, TCELL=2, TVERTS=TSIZE+1;
function getHeight(x,z){
  let h=fbm(x*.012,z*.012,6)*35-12;
  h+=Math.abs(fbm(x*.025+50,z*.025+50,4))*10;
  const d=Math.sqrt(x*x+z*z),flat=clamp(d/35,0,1);
  return h*flat*flat;
}
function getNormal(x,z){
  const e=.5,hL=getHeight(x-e,z),hR=getHeight(x+e,z),hD=getHeight(x,z-e),hU=getHeight(x,z+e);
  return v3norm([hL-hR,2*e,hD-hU]);
}
function biomeCol(x,z,h){
  const t=fbm(x*.004+100,z*.004+100,3),m=fbm(x*.004+200,z*.004+200,3);
  let r,g,b;
  if(t<.3){r=.07;g=.09;b=.22}       // crystal
  else if(m>.55){r=.05;g=.16;b=.07}  // fungal
  else if(t>.65&&m<.4){r=.12;g=.04;b=.14} // obsidian
  else{r=.04;g=.13;b=.1}             // moss
  return[r+h*.002,g+h*.003,b+h*.004];
}

// ─── SHADER SOURCES ──────────────────────────────────────────
const TERR_VS=`#version 300 es
in vec3 aP,aN,aC;
uniform mat4 uProj,uView,uModel;
out vec3 vN,vC,vW;
void main(){
  vec4 w=uModel*vec4(aP,1);vW=w.xyz;vN=mat3(uModel)*aN;vC=aC;
  gl_Position=uProj*uView*w;}`;
const TERR_FS=`#version 300 es
precision highp float;
in vec3 vN,vC,vW;
uniform vec3 uLD,uFog;uniform float uFD,uUC;
out vec4 o;
void main(){
  vec3 n=normalize(vN);float d=max(dot(n,uLD),0.)*.55+.45;
  vec3 c=vC*d*(uUC>.5?1.:uUC);
  float f=1.-exp(-dot(vW,vW)/(uFD*uFD));
  c=mix(c,uFog,clamp(f,0.,1.));o=vec4(c,1);}`;

const GLOW_VS=`#version 300 es
in vec3 aP,aN;
uniform mat4 uProj,uView,uModel;uniform float uTime;
out vec3 vN,vW;out float vP;
void main(){
  vec4 w=uModel*vec4(aP,1);vW=w.xyz;vN=mat3(uModel)*aN;
  vP=.65+.35*sin(uTime*2.5+w.x*.4+w.z*.4);
  gl_Position=uProj*uView*w;}`;
const GLOW_FS=`#version 300 es
precision highp float;
in vec3 vN,vW;in float vP;
uniform vec3 uGC;uniform float uA;
out vec4 o;
void main(){
  vec3 n=normalize(vN);float rim=1.-max(dot(n,vec3(0,1,0)),0.);rim=pow(rim,1.8);
  vec3 c=uGC*(.4+rim*.6)*vP;o=vec4(c,uA*vP);}`;

const SKY_VS=`#version 300 es
in vec3 aP;
uniform mat4 uProj,uView;
out vec3 vD;
void main(){vD=aP;gl_Position=uProj*uView*vec4(aP*600.,1);}`;
const SKY_FS=`#version 300 es
precision highp float;
in vec3 vD;uniform float uTime;out vec4 o;
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
float fb(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*ns(p);p*=2.;a*=.5;}return v;}
void main(){
  vec3 d=normalize(vD);float y=d.y;
  vec3 hz=vec3(.04,.1,.08),zn=vec3(.008,.015,.05);
  vec3 s=mix(hz,zn,max(y,0.));
  if(y<0.)s=mix(hz*.4,vec3(.005,.01,.01),-y);
  vec2 su=d.xz/(abs(y)+.1)*80.;float st=h2(floor(su));
  st=step(.985,st)*(.5+.5*sin(uTime*2.+st*200.));
  s+=vec3(.7,.85,1.)*st*max(y,0.);
  vec3 m1=normalize(vec3(.3,.35,-.8));float a1=pow(max(dot(d,m1),0.),800.);s+=vec3(.25,.35,.45)*a1;
  vec3 m2=normalize(vec3(-.5,.2,.6));float a2=pow(max(dot(d,m2),0.),400.);s+=vec3(.5,.18,.25)*a2;
  float nb=fb(d.xz*1.5+uTime*.008);s+=vec3(.04,.015,.07)*nb*max(y,0.);
  o=vec4(s,1);}`;

// Point cloud for rain
const RAIN_VS=`#version 300 es
in vec3 aP;
uniform mat4 uProj,uView;uniform float uTime,uSize;
out float vA;
void main(){
  vec4 vp=uView*vec4(aP,1);vA=clamp(1.-(-vp.z/80.),.1,.7);
  gl_Position=uProj*vp;gl_PointSize=uSize/max(-vp.z,.1);}`;
const RAIN_FS=`#version 300 es
precision highp float;in float vA;out vec4 o;
void main(){
  float d=length(gl_PointCoord-.5);if(d>.5)discard;
  o=vec4(.3,.6,.5,vA*(1.-d*2.));}`;

// ─── WEBGL HELPERS ───────────────────────────────────────────
let gl;
function mkShader(src,type){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
function mkProg(vs,fs){
  const p=gl.createProgram();gl.attachShader(p,mkShader(vs,gl.VERTEX_SHADER));
  gl.attachShader(p,mkShader(fs,gl.FRAGMENT_SHADER));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
  const u={},a={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const info=gl.getActiveUniform(p,i);u[info.name]=gl.getUniformLocation(p,info.name)}
  const na=gl.getProgramParameter(p,gl.ACTIVE_ATTRIBUTES);
  for(let i=0;i<na;i++){const info=gl.getActiveAttrib(p,i);a[info.name]=gl.getAttribLocation(p,info.name)}
  return{prog:p,u,a}}
function mkMesh(verts,norms,cols,idx){
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
  const nb=norms?gl.createBuffer():null;
  if(nb){gl.bindBuffer(gl.ARRAY_BUFFER,nb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(norms),gl.STATIC_DRAW)}
  const cb=cols?gl.createBuffer():null;
  if(cb){gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(cols),gl.STATIC_DRAW)}
  const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
  gl.bindVertexArray(null);return{vao,pb,nb,cb,ib,cnt:idx.length}}
function mkDynMesh(verts,norms,cnt){
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,pb);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.DYNAMIC_DRAW);
  const nb=norms?gl.createBuffer():null;
  if(nb){gl.bindBuffer(gl.ARRAY_BUFFER,nb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(norms),gl.DYNAMIC_DRAW)}
  gl.bindVertexArray(null);return{vao,pb,nb,cnt}}

function drawMesh(mesh,prog,uniforms){
  gl.useProgram(prog.prog);
  for(const[k,v]of Object.entries(uniforms)){
    const loc=prog.u[k];if(loc==null)continue;
    if(typeof v==='number')gl.uniform1f(loc,v);
    else if(v.length===3)gl.uniform3fv(loc,v);
    else if(v.length===4)gl.uniform4fv(loc,v);
    else if(v.length===16)gl.uniformMatrix4fv(loc,false,v);
  }
  gl.bindVertexArray(mesh.vao);
  const pl=prog.a.aP;gl.bindBuffer(gl.ARRAY_BUFFER,mesh.pb);gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,3,gl.FLOAT,false,0,0);
  if(mesh.nb&&prog.a.aN!=null){gl.bindBuffer(gl.ARRAY_BUFFER,mesh.nb);gl.enableVertexAttribArray(prog.a.aN);gl.vertexAttribPointer(prog.a.aN,3,gl.FLOAT,false,0,0)}
  if(mesh.cb&&prog.a.aC!=null){gl.bindBuffer(gl.ARRAY_BUFFER,mesh.cb);gl.enableVertexAttribArray(prog.a.aC);gl.vertexAttribPointer(prog.a.aC,3,gl.FLOAT,false,0,0)}
  if(mesh.ib){gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.ib);gl.drawElements(gl.TRIANGLES,mesh.cnt,gl.UNSIGNED_SHORT,0)}
  else gl.drawArrays(gl.POINTS,0,mesh.cnt);
  gl.bindVertexArray(null);
}

// ─── WORLD GENERATION ────────────────────────────────────────
let terrainMesh,crystalMesh,veggieMesh,ruinMesh,caveMeshes=[],skyMesh,rainMesh,artifactMesh,creatureMesh;
let artifacts=[],creatures=[],cavePositions=[],altarPos=[55,0,55];
let altarSlotPositions=[],collectedCount=0,allCollected=false;

function generateWorld(){
  // ── TERRAIN ──
  const tv=[],tn=[],tc=[],ti=[];
  for(let iz=0;iz<TVERTS;iz++)for(let ix=0;ix<TVERTS;ix++){
    const wx=(ix-TSIZE/2)*TCELL,wz=(iz-TSIZE/2)*TCELL;
    const h=getHeight(wx,wz),n=getNormal(wx,wz),c=biomeCol(wx,wz,h);
    tv.push(wx,h,wz);tn.push(n[0],n[1],n[2]);tc.push(c[0],c[1],c[2]);
  }
  for(let iz=0;iz<TSIZE;iz++)for(let ix=0;ix<TSIZE;ix++){
    const a=iz*TVERTS+ix,b=a+1,c=a+TVERTS,d=c+1;
    ti.push(a,c,b,b,c,d);
  }
  terrainMesh=mkMesh(tv,tn,tc,ti);

  // ── CRYSTALS (glow batch) ──
  const cv=[],cn=[],ci=[];
  const rng=(s)=>{s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)};
  for(let i=0;i<300;i++){
    const cx=(rng(i*7.1)-.5)*180,cz=(rng(i*13.3)-.5)*180;
    const ch=getHeight(cx,cz);
    const t=fbm(cx*.004+100,cz*.004+100,3);
    if(t>.25)continue; // only in crystal biome
    const h=1.5+rng(i*3.7)*5, r=.15+rng(i*5.3)*.4, rot=rng(i*9.1)*Math.PI*2, sides=5+Math.floor(rng(i*11.7)*3);
    const base=cv.length/3;
    // bottom point
    cv.push(cx,ch,cz);cn.push(0,-1,0);
    // bottom ring
    for(let s=0;s<sides;s++){const a=rot+s/sides*Math.PI*2;cv.push(cx+Math.cos(a)*r,ch,cz+Math.sin(a)*r);cn.push(Math.cos(a),0,Math.sin(a))}
    // top ring
    for(let s=0;s<sides;s++){const a=rot+s/sides*Math.PI*2;const r2=r*.25;cv.push(cx+Math.cos(a)*r2,ch+h,cz+Math.sin(a)*r2);cn.push(Math.cos(a),.3,Math.sin(a))}
    // top point
    cv.push(cx,ch+h*1.15,cz);cn.push(0,1,0);
    for(let s=0;s<sides;s++){const b=s+1,nr=(s+1)%sides+1;ci.push(base,base+b,base+nr)}
    for(let s=0;s<sides;s++){const bl=base+1+s,br=base+1+(s+1)%sides,tl=base+1+sides+s,tr=base+1+sides+(s+1)%sides;ci.push(bl,tl,br,br,tl,tr)}
    const tp=base+1+2*sides;
    for(let s=0;s<sides;s++){const bl=base+1+sides+s,br=base+1+sides+(s+1)%sides;ci.push(bl,tp,br)}
  }
  crystalMesh=cv.length?mkMesh(cv,cn,null,ci):null;

  // ── GLOWING VEGETATION (mushrooms) ──
  const vv=[],vn=[],vi=[];
  for(let i=0;i<500;i++){
    const vx=(rng(i*17.1)-.5)*160,vz=(rng(i*23.3)-.5)*160;
    const vh=getHeight(vx,vz);
    const m=fbm(vx*.004+200,vz*.004+200,3);
    if(m<.45)continue; // only in fungal biome
    const sh=.3+rng(i*29.7)*.7, cr=.15+rng(i*31.3)*.35, base=vv.length/3;
    // stem
    vv.push(vx,vh,vz);vn.push(0,0,0);
    vv.push(vx,vh+sh,vz);vn.push(0,0,0);
    vi.push(base,base+1);
    // cap dome
    const segs=6,rings=4;
    for(let ry=0;ry<=rings;ry++){const phi=ry/rings*Math.PI*.5;
      for(let sx=0;sx<segs;sx++){const th=sx/segs*Math.PI*2;
        vv.push(vx+Math.cos(phi)*Math.cos(th)*cr,vh+sh+Math.sin(phi)*cr*.6,vz+Math.cos(phi)*Math.sin(th)*cr);
        vn.push(Math.cos(th),Math.sin(phi),Math.sin(th))}}
    for(let ry=0;ry<rings;ry++)for(let sx=0;sx<segs;sx++){
      const a=base+2+ry*segs+sx,b=a+1,c=a+segs,d=c+1;
      if(sx===segs-1){const a2=base+2+ry*segs,c2=base+2+(ry+1)*segs;vi.push(a,c,a2,c,a2,c2)}
      else vi.push(a,c,b,b,c,d)}
  }
  veggieMesh=vv.length?mkMesh(vv,vn,null,vi):null;

  // ── RUINS ──
  const rv=[],rn=[],rc=[],ri=[];
  const ax=altarPos[0],az=altarPos[2],ah=getHeight(ax,az);
  // columns in a circle
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2,rad=9;
    const cx=ax+Math.cos(a)*rad,cz=az+Math.sin(a)*rad,ch=getHeight(cx,cz);
    const colH=3+rng(i*41)*3,colR=.35,seg=8;
    const b=rv.length/3;
    for(let s=0;s<=seg;s++){const th=s/seg*Math.PI*2;rv.push(cx+Math.cos(th)*colR,ch,cz+Math.sin(th)*colR);rn.push(Math.cos(th),0,Math.sin(th));rc.push(.18,.15,.12)}
    for(let s=0;s<=seg;s++){const th=s/seg*Math.PI*2;rv.push(cx+Math.cos(th)*colR*.85,ch+colH,cz+Math.sin(th)*colR*.85);rn.push(Math.cos(th),0,Math.sin(th));rc.push(.15,.12,.1)}
    for(let s=0;s<seg;s++){const bl=b+s,br=b+s+1,tl=b+seg+1+s,tr=b+seg+1+s+1;ri.push(bl,tl,br,br,tl,tr)}
    // broken top - jagged
    for(let s=0;s<seg;s+=2){const th=s/seg*Math.PI*2;const bh=.2+rng(i*50+s)*.6;
      rv.push(cx+Math.cos(th)*colR*.7,ch+colH+bh,cz+Math.sin(th)*colR*.7);rn.push(Math.cos(th),.5,Math.sin(th));rc.push(.12,.1,.08)}
  }
  // walls between some columns
  for(let i=0;i<5;i++){
    const a1=i/10*Math.PI*2,a2=(i+2)/10*Math.PI*2,rad=9;
    const x1=ax+Math.cos(a1)*rad,z1=az+Math.sin(a1)*rad,x2=ax+Math.cos(a2)*rad,z2=az+Math.sin(a2)*rad;
    const h1=getHeight(x1,z1)+1.5+rng(i*60)*2,h2=getHeight(x2,z2)+1.5+rng(i*61)*2;
    const w=.4,b=rv.length/3;
    const dx=x2-x1,dz=z2-z1,dl=Math.sqrt(dx*dx+dz*dz)||1;
    const nx=-dz/dl,nz=dx/dl;
    rv.push(x1+nx*w,h1,z1+nz*w);rn.push(nx,0,nz);rc.push(.16,.13,.11);
    rv.push(x1-nx*w,h1,z1-nz*w);rn.push(-nx,0,-nz);rc.push(.16,.13,.11);
    rv.push(x2+nx*w,h2,z2+nz*w);rn.push(nx,0,nz);rc.push(.16,.13,.11);
    rv.push(x2-nx*w,h2,z2-nz*w);rn.push(-nx,0,-nz);rc.push(.16,.13,.11);
    rv.push(x1+nx*w,h1+1.5,z1+nz*w);rn.push(nx,0,nz);rc.push(.14,.11,.09);
    rv.push(x1-nx*w,h1+1.5,z1-nz*w);rn.push(-nx,0,-nz);rc.push(.14,.11,.09);
    rv.push(x2+nx*w,h2+1.5,z2+nz*w);rn.push(nx,0,nz);rc.push(.14,.11,.09);
    rv.push(x2-nx*w,h2+1.5,z2-nz*w);rn.push(-nx,0,-nz);rc.push(.14,.11,.09);
    ri.push(b,b+2,b+1,b+1,b+2,b+3,b+4,b+6,b+5,b+5,b+6,b+7,b+1,b+3,b+5,b+5,b+3,b+7,b,b+4,b+1,b+1,b+4,b+5);
  }
  // altar - stepped pyramid
  for(let tier=0;tier<3;tier++){
    const s=3-tier*.8,h=.6+tier*.3,y=ah+tier*.6;
    const b=rv.length/3;
    rv.push(ax-s,y,az-s);rn.push(0,1,0);rc.push(.2,.15,.18);
    rv.push(ax+s,y,az-s);rn.push(0,1,0);rc.push(.2,.15,.18);
    rv.push(ax+s,y,az+s);rn.push(0,1,0);rc.push(.2,.15,.18);
    rv.push(ax-s,y,az+s);rn.push(0,1,0);rc.push(.2,.15,.18);
    rv.push(ax-s,y+h,az-s);rn.push(0,1,0);rc.push(.22,.17,.2);
    rv.push(ax+s,y+h,az-s);rn.push(0,1,0);rc.push(.22,.17,.2);
    rv.push(ax+s,y+h,az+s);rn.push(0,1,0);rc.push(.22,.17,.2);
    rv.push(ax-s,y+h,az+s);rn.push(0,1,0);rc.push(.22,.17,.2);
    ri.push(b,b+1,b+4,b+1,b+5,b+4,b+1,b+2,b+5,b+2,b+6,b+5,b+2,b+3,b+6,b+3,b+7,b+6,
      b,b+3,b+4,b+3,b+7,b+4,b+4,b+5,b+7,b+5,b+6,b+7);
  }
  // altar slot positions
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2,r=1.8;
    altarSlotPositions.push([ax+Math.cos(a)*r, ah+2.2, az+Math.sin(a)*r]);
  }
  ruinMesh=mkMesh(rv,rn,rc,ri);

  // ── CAVES ──
  const caveDefs=[
    {x:30,z:-25,w:7,h:5,d:14,rot:0},
    {x:-45,z:35,w:8,h:6,d:16,rot:.4},
    {x:65,z:40,w:6,h:4.5,d:12,rot:-.3}
  ];
  caveDefs.forEach(cd=>{
    cavePositions.push([cd.x,getHeight(cd.x,cd.z),cd.z]);
    const cv2=[],cn2=[],ci2=[],seg=10,dep=5;
    const cos=Math.cos(cd.rot),sin=Math.sin(cd.rot);
    for(let i=0;i<=seg;i++){const phi=Math.PI*i/seg;
      for(let j=0;j<=dep;j++){const t=j/dep;
        let lx=Math.cos(phi)*cd.w/2,ly=Math.sin(phi)*cd.h,lz=-cd.d/2+t*cd.d;
        let rx=lx*cos-lz*sin,rz=lx*sin+lz*cos;
        cv2.push(cd.x+rx,cd.z?getHeight(cd.x+rx,cd.z+rz)+ly:ly,cd.z+rz);
        cn2.push(-Math.cos(phi)*cos,-Math.sin(phi),-Math.cos(phi)*sin);
      }}
    for(let i=0;i<seg;i++)for(let j=0;j<dep;j++){
      const a=i*(dep+1)+j,b=a+1,c=a+dep+1,d=c+1;ci2.push(a,c,b,b,c,d)}
    caveMeshes.push(mkMesh(cv2,cn2,null,ci2));
    // cave fungi
    for(let f=0;f<15;f++){
      const ft=rng(f*77+cd.x)*Math.PI,fr=rng(f*88+cd.z)*cd.w*.35;
      let lx=Math.cos(ft)*fr,lz=rng(f*99+cd.x)*cd.d*.4-cd.d*.2;
      let rx=lx*cos-lz*sin,rz=lx*sin+lz*cos;
      const fx=cd.x+rx,fz=cd.z+rz,fy=getHeight(fx,fz)+cd.h*.7+rng(f*55)*cd.h*.2;
      const base=vv.length/3,fs=.12+rng(f*66)*.15;
      vv.push(fx,fy,fz);vn.push(0,-1,0);vv.push(fx,fy-.2,fz);vn.push(0,0,0);
      vi.push(base,base+1);
      for(let sy=0;sy<=3;sy++){const sp=sy/3*Math.PI*.5;
        for(let sx=0;sx<5;sx++){const th=sx/5*Math.PI*2;
          vv.push(fx+Math.cos(sp)*Math.cos(th)*fs,fy+Math.sin(sp)*fs*.5,fz+Math.cos(sp)*Math.sin(th)*fs);
          vn.push(Math.cos(th),Math.sin(sp),Math.sin(th))}}
      for(let sy=0;sy<3;sy++)for(let sx=0;sx<5;sx++){
        const a=base+2+sy*5+sx;if(sx===4){const a2=base+2+sy*5;vi.push(a,base+2+(sy+1)*5,a2,a2,base+2+(sy+1)*5,base+2+(sy+1)*5)}
        else vi.push(a,base+2+(sy+1)*5,a+1,a+1,base+2+(sy+1)*5,base+2+(sy+1)*5+1)}
    }
  });
  // rebuild veggie with cave fungi added
  if(vv.length)veggieMesh=mkMesh(vv,vn,null,vi);

  // ── ARTIFACTS ──
  const artifactDefs=[
    {x:30,z:-25,y:0},{x:-45,z:35,y:0},{x:65,z:40,y:0}, // in caves
    {x:-20,z:-40,y:0},{x:40,z:-50,y:0},{x:-60,z:-20,y:0}, // crystal field
    {x:-30,z:50,y:0},{x:20,z:60,y:0} // fungal area
  ];
  const av=[],an=[],ai=[];
  artifactDefs.forEach((ad,i)=>{
    const ay=getHeight(ad.x,ad.z)+1.5+rng(i*111)*.5;
    artifacts.push({pos:[ad.x,ay,ad.z],base:[ad.x,ay,ad.z],grabbed:false,placed:false,idx:i,
      rot:rng(i*123)*Math.PI*2,speed:.3+rng(i*133)*.5});
    // octahedron artifact
    const s=.2,b=av.length/3;
    av.push(0,s,0);an.push(0,1,0);av.push(0,-s,0);an.push(0,-1,0);
    av.push(s,0,0);an.push(1,0,0);av.push(-s,0,0);an.push(-1,0,0);
    av.push(0,0,s);an.push(0,0,1);av.push(0,0,-s);an.push(0,0,-1);
    ai.push(0,2,4,0,4,3,0,3,5,0,5,2,0,6,2,0,2,7,0,7,3,0,3,6,
      1,4,2,1,3,4,1,5,3,1,6,5,1,2,6,1,7,6,1,3,7);
  });
  artifactMesh=mkMesh(av,an,null,ai);

  // ── CREATURES (jellyfish) ──
  for(let i=0;i<12;i++){
    const cx=(rng(i*200)-.5)*120,cz=(rng(i*210)-.5)*120;
    const cy=getHeight(cx,cz)+3+rng(i*220)*4;
    creatures.push({pos:[cx,cy,cz],base:[cx,cy,cz],phase:rng(i*230)*Math.PI*2,
      driftR:2+rng(i*240)*4,driftS:.1+rng(i*250)*.2,bobS:.5+rng(i*260)*.5,
      hue:[.1+rng(i*270)*.3,.3+rng(i*271)*.4,.5+rng(i*272)*.3]});
  }
  // jellyfish mesh (shared)
  const jv=[],jn=[],ji=[],jseg=8,jring=5;
  for(let r=0;r<=jring;r++){const phi=r/jring*Math.PI*.45;
    for(let s=0;s<=jseg;s++){const th=s/jseg*Math.PI*2;
      jv.push(Math.cos(phi)*Math.cos(th)*.4,Math.sin(phi)*.4,Math.cos(phi)*Math.sin(th)*.4);
      jn.push(Math.cos(th)*Math.cos(phi),Math.sin(phi),Math.sin(th)*Math.cos(phi))}}
  for(let r=0;r<jring;r++)for(let s=0;s<jseg;s++){
    const a=r*(jseg+1)+s,b=a+1,c=a+jseg+1,d=c+1;
    if(s===jseg){const a2=r*(jseg+1),c2=(r+1)*(jseg+1);ji.push(a,c,a2,a2,c,c2)}
    else ji.push(a,c,b,b,c,d)}
  // tentacles (lines)
  for(let t=0;t<6;t++){const th=t/6*Math.PI*2;
    const bx=Math.cos(th)*.3,by=-.05,bz=Math.sin(th)*.3;
    const b=jv.length/3;
    jv.push(bx,by,bz);jn.push(0,-1,0);
    for(let seg=1;seg<=4;seg++){
      const wobble=Math.sin(seg*1.5)*.15;
      jv.push(bx+wobble,by-seg*.25,bz+wobble*.5);jn.push(0,-1,0);
      ji.push(b+seg-1,b+seg)}
  }
  creatureMesh=mkMesh(jv,jn,null,ji);

  // ── SKY SPHERE ──
  const sv=[],si=[],sseg=24,sring=16;
  for(let r=0;r<=sring;r++){const phi=r/sring*Math.PI;
    for(let s=0;s<=sseg;s++){const th=s/sseg*Math.PI*2;
      sv.push(Math.sin(phi)*Math.cos(th),Math.cos(phi),Math.sin(phi)*Math.sin(th))}}
  for(let r=0;r<sring;r++)for(let s=0;s<sseg;s++){
    const a=r*(sseg+1)+s,b=a+1,c=a+sseg+1,d=c+1;
    si.push(a,c,b,b,c,d)}
  skyMesh=mkMesh(sv,null,null,si);

  // ── RAIN PARTICLES ──
  const rp=[];
  for(let i=0;i<3000;i++){
    rp.push((rng(i*300)-.5)*120, rng(i*301)*60, (rng(i*302)-.5)*120);
  }
  rainMesh=mkDynMesh(rp,null,rp.length/3);
}

// ─── RENDER ──────────────────────────────────────────────────
let tProg,gProg,sProg,rProg;
const fogCol=[.02,.06,.05], fogDist=90;
const lightDir=v3norm([.3,.8,.2]);
const identityMat=M4.id(M4.create());

function renderScene(proj,view,time){
  const pvMat=M4.mul(M4.create(),proj,view);
  const camPos=M4.pos(M4.inv(M4.create(),view));

  gl.clearColor(fogCol[0],fogCol[1],fogCol[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);

  // Sky
  gl.depthMask(false);
  drawMesh(skyMesh,sProg,{uProj:proj,uView:view,uTime:time});
  gl.depthMask(true);

  // Terrain
  drawMesh(terrainMesh,tProg,{uProj:proj,uView:view,uModel:identityMat,uLD:lightDir,uFog:fogCol,uFD:fogDist,uUC:1});

  // Ruins
  drawMesh(ruinMesh,tProg,{uProj:proj,uView:view,uModel:identityMat,uLD:lightDir,uFog:fogCol,uFD:fogDist,uUC:1});

  // Caves
  caveMeshes.forEach(cm=>drawMesh(cm,tProg,{uProj:proj,uView:view,uModel:identityMat,uLD:lightDir,uFog:fogCol,uFD:fogDist,uUC:1}));

  // Creatures
  creatures.forEach((cr,ci)=>{
    const t=time*cr.driftS+cr.phase;
    cr.pos[0]=cr.base[0]+Math.cos(t)*cr.driftR;
    cr.pos[2]=cr.base[2]+Math.sin(t)*cr.driftR;
    cr.pos[1]=cr.base[1]+Math.sin(time*cr.bobS+cr.phase)*.8;
    const m=M4.create();M4.id(m);
    M4.trans(m,cr.pos);
    M4.scale(m,[1.5+Math.sin(time+cr.phase)*.2, 1.2+Math.sin(time*1.3+cr.phase)*.15, 1.5+Math.cos(time+cr.phase)*.2]);
    M4.rotY(m,time*.3+cr.phase);
    drawMesh(creatureMesh,gProg,{uProj:proj,uView:view,uModel:m,uTime:time,uGC:cr.hue,uA:.6});
  });

  // Glowing objects (additive)
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  gl.depthMask(false);

  if(crystalMesh)drawMesh(crystalMesh,gProg,{uProj:proj,uView:view,uModel:identityMat,uTime:time,uGC:[.15,.3,.7],uA:.5});
  if(veggieMesh)drawMesh(veggieMesh,gProg,{uProj:proj,uView:view,uModel:identityMat,uTime:time,uGC:[.1,.6,.3],uA:.45});

  // Artifacts
  artifacts.forEach((ar,i)=>{
    if(ar.placed)return;
    let m=M4.create();M4.id(m);
    if(ar.grabbed){
      M4.trans(m,ar.pos);
    }else{
      ar.pos[1]=ar.base[1]+Math.sin(time*ar.speed+i)*.3;
      M4.trans(m,ar.pos);
    }
    M4.rotY(m,time*ar.speed+ar.rot);
    M4.rotX(m,time*ar.speed*.7+ar.rot);
    const intensity=allCollected?.9:(.6+Math.sin(time*3+i)*.2);
    drawMesh(artifactMesh,gProg,{uProj:proj,uView:view,uModel:m,uTime:time,uGC:[.9,.6,.2],uA:intensity});
  });

  // Placed artifacts on altar glow
  if(collectedCount>0){
    const m=M4.create();M4.id(m);
    const ay=getHeight(altarPos[0],altarPos[2])+2.2;
    M4.trans(m,[altarPos[0],ay,altarPos[2]]);
    const s=1+collectedCount*.15+Math.sin(time*2)*.1*(allCollected?2:1);
    M4.scale(m,[s,s,s]);
    const gc=allCollected?[1,.8,.3]:[.4,.6,.2];
    drawMesh(artifactMesh,gProg,{uProj:proj,uView:view,uModel:m,uTime:time,uGC:gc,uA:allCollected?.8:.3});
  }

  // Rain
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  const rp=new Float32Array(rainMesh.cnt*3);
  for(let i=0;i<rainMesh.cnt;i++){
    let x=rainMesh.pb._data[i*3],y=rainMesh.pb._data[i*3+1],z=rainMesh.pb._data[i*3+2];
    y-=25*(1/60);if(y<-2){y=50;x=(Math.random()-.5)*120;z=(Math.random()-.5)*120}
    rainMesh.pb._data[i*3]=x;rainMesh.pb._data[i*3+1]=y;rainMesh.pb._data[i*3+2]=z;
    rp[i*3]=x;rp[i*3+1]=y;rp[i*3+2]=z;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,rainMesh.pb);gl.bufferSubData(gl.ARRAY_BUFFER,0,rp);
  drawMesh(rainMesh,rProg,{uProj:proj,uView:view,uTime:time,uSize:3});

  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

// Store initial rain positions for animation
function initRainData(){
  const data=new Float32Array(rainMesh.cnt*3);
  gl.bindBuffer(gl.ARRAY_BUFFER,rainMesh.pb);gl.getBufferSubData(gl.ARRAY_BUFFER,0,data);
  rainMesh.pb._data=data;
}

// ─── CONTROLLER RENDERING ────────────────────────────────────
let ctrlMesh;
function generateControllerMesh(){
  // Simple controller shape: box + trigger
  const v=[],n=[],idx=[];
  // box .04 x .06 x .16
  const hw=.02,hh=.03,hd=.08;
  const corners=[[-hw,-hh,-hd],[hw,-hh,-hd],[hw,hh,-hd],[-hw,hh,-hd],
    [-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]];
  const faces=[[0,1,2,3,0,0,-1],[5,4,7,6,0,0,1],[4,0,3,7,-1,0,0],[1,5,6,2,1,0,0],[3,2,6,7,0,1,0],[4,5,1,0,0,-1,0]];
  faces.forEach(f=>{
    const b=v.length/3;f.slice(0,4).forEach(ci=>{v.push(...corners[ci]);n.push(f[4],f[5],f[6])});
    idx.push(b,b+1,b+2,b,b+2,b+3)});
  ctrlMesh=mkMesh(v,n,null,idx);
}

function renderControllers(proj,view,time,controllerPoses){
  if(!ctrlMesh)return;
  controllerPoses.forEach(pose=>{
    if(!pose)return;
    const m=new Float32Array(pose.matrix);
    drawMesh(ctrlMesh,tProg,{uProj:proj,uView:view,uModel:m,uLD:lightDir,uFog:fogCol,uFD:fogDist,uUC:.3});
  });
}

// ─── RAY CASTING ─────────────────────────────────────────────
function raySphere(ori,dir,cen,rad){
  const oc=v3sub(ori,cen);
  const b=2*v3dot(dir,oc),c=v3dot(oc,oc)-rad*rad;
  const disc=b*b-4*c;if(disc<0)return-1;
  const t=(-b-Math.sqrt(disc))/2;return t>0?t:-1;
}

// ─── WEBXR SESSION ───────────────────────────────────────────
let session,refSpace,glLayer;
let playerPos=[0,0,0],lastTime=0;
let grabbedArtifact=null,highlightedArtifact=null;
const sessionBtn=document.getElementById('startBtn');
const overlay=document.getElementById('overlay');
const infoEl=document.getElementById('info');

async function initXR(){
  if(!navigator.xr){sessionBtn.textContent='VR NOT AVAILABLE';return}
  const ok=await navigator.xr.isSessionSupported('immersive-vr');
  if(!ok){sessionBtn.textContent='VR NOT SUPPORTED';return}
  sessionBtn.textContent='ENTER VR';
  sessionBtn.disabled=false;
  sessionBtn.onclick=startSession;
}

async function startSession(){
  overlay.classList.add('gone');
  const canvas=document.getElementById('c');
  gl=canvas.getContext('webgl2',{xrCompatible:true,alpha:false,antialias:true});
  if(!gl){console.error('WebGL2 failed');return}

  // Compile shaders & generate world
  tProg=mkProg(TERR_VS,TERR_FS);
  gProg=mkProg(GLOW_VS,GLOW_FS);
  sProg=mkProg(SKY_VS,SKY_FS);
  rProg=mkProg(RAIN_VS,RAIN_FS);
  generateWorld();
  generateControllerMesh();
  initRainData();

  session=await navigator.xr.requestSession('immersive-vr',{
    requiredFeatures:['local-floor'],optionalFeatures:['bounded-floor']});

  glLayer=new XRWebGLLayer(session,gl,{antialias:true,alpha:false});
  session.updateRenderState({baseLayer:glLayer});

  refSpace=await session.requestReferenceSpace('local-floor');

  session.addEventListener('end',()=>{
    overlay.classList.remove('gone');
    session=null;
  });

  let prevTime=0;
  session.requestAnimationFrame(function onFrame(time,frame){
    if(!session)return;
    const dt=Math.min((time-prevTime)/1000,.1);prevTime=time;
    const t=time/1000;

    const pose=frame.getViewerPose(refSpace);
    if(!pose){session.requestAnimationFrame(onFrame);return}

    // ── INPUT ──
    let moveX=0,moveZ=0;
    let gripPressed=false,triggerPressed=false;
    const ctrlPoses=[];

    for(const src of session.inputSources){
      const gp=src.gamepad;
      // Movement from first controller's thumbstick
      if(gp&&gp.axes.length>=2&&!moveX&&!moveZ){
        const ax=gp.axes[0],ay=gp.axes[1];
        if(Math.abs(ax)>.15)moveX=ax;
        if(Math.abs(ay)>.15)moveZ=-ay;
      }
      if(gp){
        if(gp.buttons.length>1&&gp.buttons[1].pressed)gripPressed=true;
        if(gp.buttons.length>0&&gp.buttons[0].pressed)triggerPressed=true;
        if(gp.buttons.length>1&&gp.buttons[1].value>.1&&grabbedArtifact){
          // Haptic while grabbing
          if(src.hapticActuators&&src.hapticActuators[0])src.hapticActuators[0].pulse(.15,50);
        }
      }
      // Controller pose for rendering
      if(src.gripSpace){
        const gripPose=frame.getPose(src.gripSpace,refSpace);
        if(gripPose)ctrlPoses.push(gripPose.transform);
      }
      // Ray for interaction
      if(src.targetRaySpace){
        const rayPose=frame.getPose(src.targetRaySpace,refSpace);
        if(rayPose){
          const rm=rayPose.transform.matrix;
          const rayOri=M4.pos(rm);
          const rayDir=v3norm([rm[8],rm[9],rm[10]]);
          highlightedArtifact=null;
          let closest=3;
          artifacts.forEach(ar=>{
            if(ar.placed||ar.grabbed)return;
            const hit=raySphere(rayOri,rayDir,ar.pos,.5);
            if(hit>0&&hit<closest){closest=hit;highlightedArtifact=ar}
          });
        }
      }
    }

    // ── MOVEMENT ──
    if(pose.views.length>0){
      const hm=pose.views[0].transform.matrix;
      const hf=M4.fwd(hm),hr=M4.right(hm);
      const spd=5*dt;
      playerPos[0]+=(hr[0]*moveX+hf[0]*moveZ)*spd;
      playerPos[2]+=(hr[2]*moveX+hf[2]*moveZ)*spd;
    }

    // ── GRAB LOGIC ──
    if(gripPressed){
      if(!grabbedArtifact&&highlightedArtifact){
        grabbedArtifact=highlightedArtifact;
        grabbedArtifact.grabbed=true;
        // Haptic feedback
        for(const src of session.inputSources){
          if(src.hapticActuators&&src.hapticActuators[0])src.hapticActuators[0].pulse(.8,150);
        }
      }
      if(grabbedArtifact){
        // Move artifact to controller
        for(const src of session.inputSources){
          if(src.targetRaySpace){
            const rp=frame.getPose(src.targetRaySpace,refSpace);
            if(rp){
              const rm=rp.transform.matrix;
              grabbedArtifact.pos[0]=rm[12]+rm[8]*.5;
              grabbedArtifact.pos[1]=rm[13]+rm[9]*.5;
              grabbedArtifact.pos[2]=rm[14]+rm[10]*.5;
            }
          }
        }
      }
    }else if(grabbedArtifact){
      // Release
      grabbedArtifact.grabbed=false;
      // Check if near altar
      const altarCenter=[altarPos[0],getHeight(altarPos[0],altarPos[2])+2.2,altarPos[2]];
      if(v3dist(grabbedArtifact.pos,altarCenter)<4){
        // Place on altar
        const slot=altarSlotPositions[grabbedArtifact.idx];
        grabbedArtifact.pos=[...slot];
        grabbedArtifact.placed=true;
        grabbedArtifact.base=[...slot];
        collectedCount++;
        if(collectedCount>=8)allCollected=true;
        // Haptic celebration
        for(const src of session.inputSources){
          if(src.hapticActuators&&src.hapticActuators[0]){
            src.hapticActuators[0].pulse(1,200);
            setTimeout(()=>src.hapticActuators[0].pulse(.5,150),250);
            setTimeout(()=>src.hapticActuators[0].pulse(.8,200),500);
          }
        }
      }else{
        grabbedArtifact.base=[...grabbedArtifact.pos];
      }
      grabbedArtifact=null;
    }

    // ── RENDER ──
    const layer=session.renderState.baseLayer;
    gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
    gl.viewport(0,0,layer.framebuffer.width,layer.framebuffer.height);

    for(const view of pose.views){
      const vp=layer.getViewport(view);
      gl.viewport(vp.x,vp.y,vp.width,vp.height);
      const proj=view.projectionMatrix;
      const viewMat=new Float32Array(view.transform.inverse.matrix);
      // Apply player offset
      const offset=M4.create();M4.id(offset);
      offset[12]=-playerPos[0];offset[13]=-playerPos[1];offset[14]=-playerPos[2];
      const adjView=M4.mul(M4.create(),viewMat,offset);
      renderScene(proj,adjView,t);
      renderControllers(proj,adjView,t,ctrlPoses);
    }

    // HUD info
    infoEl.textContent=`ARTIFACTS: ${collectedCount}/8${allCollected?' // ALTAR ACTIVATED':''}`;

    session.requestAnimationFrame(onFrame);
  });
}

// ─── INIT ────────────────────────────────────────────────────
initXR();
</script>
