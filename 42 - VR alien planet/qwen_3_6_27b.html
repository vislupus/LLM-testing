<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alien Planet VR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
    background: radial-gradient(ellipse at center, #0a0a2e 0%, #000005 100%);
    transition: opacity 1s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  h1 {
    color: #a0f0ff; font-size: 42px; font-weight: 300; letter-spacing: 8px;
    text-transform: uppercase; margin-bottom: 8px;
    text-shadow: 0 0 30px #40a0ff, 0 0 60px #2060a0;
  }
  .subtitle { color: #60a0c0; font-size: 16px; letter-spacing: 4px; margin-bottom: 40px; }
  #enterBtn {
    background: none; border: 1px solid #40a0ff; color: #a0f0ff;
    padding: 16px 48px; font-size: 18px; letter-spacing: 4px;
    cursor: pointer; border-radius: 4px; transition: all 0.3s;
    text-transform: uppercase;
  }
  #enterBtn:hover { background: rgba(64,160,255,0.15); box-shadow: 0 0 30px rgba(64,160,255,0.3); }
  #enterBtn:disabled { opacity: 0.3; cursor: not-allowed; }
  #status { color: #406080; font-size: 13px; margin-top: 20px; letter-spacing: 2px; }
  #hud {
    position: fixed; top: 20px; left: 20px; z-index: 5;
    color: #80d0ff; font-size: 14px; pointer-events: none;
    text-shadow: 0 0 10px rgba(64,160,255,0.5);
  }
  #artifactCount {
    position: fixed; bottom: 20px; right: 20px; z-index: 5;
    color: #ffcc44; font-size: 16px; pointer-events: none;
    text-shadow: 0 0 15px rgba(255,200,50,0.5);
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>Xythera Prime</h1>
  <div class="subtitle">An Alien World Awaits</div>
  <button id="enterBtn" disabled>Enter VR</button>
  <div id="status">Checking WebXR support...</div>
</div>
<div id="hud"></div>
<div id="artifactCount"></div>
<canvas id="c"></canvas>

<script>
// ==================== WEBGL & WEBXR SETUP ====================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, xrCompatible: true });
if (!gl) throw new Error('WebGL2 required');

const enterBtn = document.getElementById('enterBtn');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const hudEl = document.getElementById('hud');
const artifactEl = document.getElementById('artifactCount');

let xrSession = null;
let xrRefSpace = null;
let glLayer = null;
let artifactsCollected = 0;
const totalArtifacts = 12;

// Check WebXR
(async () => {
  if (!navigator.xr) {
    statusEl.textContent = 'WebXR not supported in this browser';
    return;
  }
  const supported = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
  if (supported) {
    enterBtn.disabled = false;
    statusEl.textContent = 'VR Ready — Put on your headset';
    enterBtn.onclick = enterVR;
  } else {
    statusEl.textContent = 'Immersive VR not available';
  }
})();

async function enterVR() {
  const session = await navigator.xr.requestSession('immersive-vr', {
    optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
  });
  xrSession = session;
  overlay.classList.add('hidden');

  glLayer = new XRWebGLLayer(session, gl);
  session.updateRenderState({ baseLayer: glLayer });
  xrRefSpace = await session.requestReferenceSpace('local-floor').catch(() =>
    session.requestReferenceSpace('local')
  );

  session.addEventListener('end', () => {
    xrSession = null;
    overlay.classList.remove('hidden');
  });

  const controllers = [];
  session.addEventListener('controllerconnected', e => {
    controllers.push({ inputSource: e.inputSource, joints: {} });
  });

  session.requestAnimationFrame(onXRFrame);
}

// ==================== SHADER SOURCES ====================
const VS_MAIN = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec3 aColor;
layout(location=3) in float aType;

uniform mat4 uProj, uView, uModel;
uniform mat4 uViewProj;
uniform float uTime;
uniform vec3 uCamPos;

out vec3 vNormal, vWorldPos, vColor;
out float vType, vFog, vGlow;
out vec2 vUV;

void main() {
  vec4 worldPos = uModel * vec4(aPos, 1.0);
  vWorldPos = worldPos.xyz;
  vNormal = mat3(uModel) * aNormal;
  vColor = aColor;
  vType = aType;
  vUV = aPos.xy;

  vec4 viewPos = uView * worldPos;
  gl_Position = uProj * viewPos;

  float dist = length(viewPos.xyz);
  vFog = 1.0 - exp(-dist * 0.006);
  vGlow = 0.0;
}
`;

const FS_MAIN = `#version 300 es
precision highp float;
in vec3 vNormal, vWorldPos, vColor;
in float vType, vFog, vGlow;
in vec2 vUV;
out vec4 fragColor;

uniform float uTime;
uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uAmbient;
uniform vec3 uFogColor;
uniform float uEmissiveBoost;

float hash(vec3 p) {
  return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453);
}

vec3 getLighting(vec3 pos, vec3 norm, vec3 col, float type) {
  vec3 N = normalize(norm);
  vec3 L = normalize(uSunDir);
  float diff = max(dot(N, L), 0.0);
  vec3 V = normalize(uCamPos - pos);
  vec3 H = normalize(L + V);
  float spec = pow(max(dot(N, H), 0.0), 32.0);

  vec3 base = col * (uAmbient + uSunColor * diff) + vec3(1.0) * spec * 0.3;

  // Emissive bioluminescence
  if (type > 10.0) {
    float pulse = sin(uTime * 2.0 + pos.x * 0.5 + pos.z * 0.3) * 0.5 + 0.5;
    float glow = pulse * 1.5 + 0.5;
    base += col * glow * uEmissiveBoost;
  }

  // Artifact sparkle
  if (type > 20.0) {
    float sparkle = pow(sin(uTime * 5.0 + hash(pos) * 6.28), 2.0);
    base += vec3(1.0, 0.9, 0.5) * sparkle * 2.0;
  }

  // Water shimmer
  if (type > 30.0 && type < 40.0) {
    float wave = sin(pos.x * 2.0 + uTime * 1.5) * 0.15 + cos(pos.z * 1.8 + uTime) * 0.15;
    base = mix(base, base + vec3(0.1, 0.2, 0.3) * wave, 0.5);
    spec *= 2.0;
  }

  // Fog
  base = mix(base, uFogColor, clamp(vFog, 0.0, 0.95));

  // Atmospheric height fog
  float heightFog = clamp((pos.y - 15.0) / 20.0, 0.0, 0.4);
  base = mix(base, uFogColor, heightFog);

  return base;
}

void main() {
  vec3 lit = getLighting(vWorldPos, vNormal, vColor, vType);
  fragColor = vec4(lit, 1.0);
}
`;

const VS_PARTICLE = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in float aSize;
layout(location=2) in vec3 aColor;
layout(location=3) in float aType;

uniform mat4 uProj, uView;
uniform float uTime;

out vec3 vColor;
out float vAlpha, vType;

void main() {
  vColor = aColor;
  vType = aType;
  vec4 viewPos = uView * vec4(aPos, 1.0);
  gl_Position = uProj * viewPos;
  gl_PointSize = aSize * (300.0 / -viewPos.z);
  vAlpha = clamp(300.0 / -viewPos.z, 0.2, 1.0);
}
`;

const FS_PARTICLE = `#version 300 es
precision highp float;
in vec3 vColor;
in float vAlpha, vType;
out vec4 fragColor;

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float d = length(uv);
  if (d > 1.0) discard;
  float a = smoothstep(1.0, 0.2, d) * vAlpha;
  if (vType > 1.0) {
    a *= 0.6; // Soft glow for spores
  }
  fragColor = vec4(vColor * (1.0 + 0.5 * smoothstep(0.3, 0.0, d)), a);
}
`;

const VS_SKY = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
uniform mat4 uProj, uView;
out vec3 vDir;
void main() {
  vDir = aPos;
  mat4 p = uProj;
  p[1][1] *= -1;
  gl_Position = p * uView * vec4(aPos * 500.0, 1.0);
  gl_Position = gl_Position.xyww;
}
`;

const FS_SKY = `#version 300 es
precision highp float;
in vec3 vDir;
out vec4 fragColor;
uniform float uTime;
uniform vec3 uSunDir;

vec3 hash(vec3 p) {
  p = fract(p * vec3(443.897,441.423,437.195));
  p += dot(p, p.yzx + 19.19);
  return fract((p.xxy+p.yxx)*p.zyx);
}

float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                 mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                 mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}

float fbm(vec3 p) {
  float v=0.0, a=0.5;
  for(int i=0;i<5;i++) { v+=a*noise(p); p*=2.0; a*=0.5; }
  return v;
}

void main() {
  vec3 dir = normalize(vDir);
  float y = dir.y * 0.5 + 0.5;

  // Alien sky gradient
  vec3 top = vec3(0.05, 0.02, 0.15);
  vec3 mid = vec3(0.15, 0.05, 0.25);
  vec3 horz = vec3(0.3, 0.15, 0.2);
  vec3 sky = mix(horz, mid, smoothstep(0.0, 0.3, y));
  sky = mix(sky, top, smoothstep(0.3, 0.8, y));

  // Alien sun/moon
  vec3 sunDir = normalize(uSunDir);
  float sunDot = max(dot(dir, sunDir), 0.0);
  float sun = pow(sunDot, 200.0) * 3.0;
  float sunGlow = pow(sunDot, 8.0) * 0.5;
  sky += vec3(1.0, 0.8, 0.6) * sun;
  sky += vec3(0.8, 0.4, 0.6) * sunGlow;

  // Second sun
  vec3 sun2 = normalize(vec3(-0.3, 0.4, 0.8));
  float s2 = pow(max(dot(dir, sun2), 0.0), 300.0) * 1.5;
  float s2g = pow(max(dot(dir, sun2), 0.0), 15.0) * 0.2;
  sky += vec3(0.4, 0.6, 1.0) * s2;
  sky += vec3(0.3, 0.4, 0.8) * s2g;

  // Nebula clouds
  float nebula = fbm(dir * 3.0 + uTime * 0.01);
  sky += vec3(0.2, 0.05, 0.3) * nebula * smoothstep(0.2, 0.7, y) * 0.5;

  // Stars
  float stars = smoothstep(0.997, 1.0, hash(dir * 500.0));
  sky += vec3(0.8, 0.9, 1.0) * stars * smoothstep(0.1, 0.5, y) * 0.8;

  fragColor = vec4(sky, 1.0);
}
`;

// ==================== SHADER COMPILATION ====================
function createShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, createShader(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, createShader(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}

const mainProg = createProgram(VS_MAIN, FS_MAIN);
const particleProg = createProgram(VS_PARTICLE, FS_PARTICLE);
const skyProg = createProgram(VS_SKY, FS_SKY);

// Uniform locations
function getUniforms(prog, names) {
  const u = {};
  names.forEach(n => u[n] = gl.getUniformLocation(prog, n));
  return u;
}

const mainU = getUniforms(mainProg, ['uProj','uView','uModel','uTime','uCamPos','uSunDir','uSunColor','uAmbient','uFogColor','uEmissiveBoost']);
const partU = getUniforms(particleProg, ['uProj','uView','uTime']);
const skyU = getUniforms(skyProg, ['uProj','uView','uTime','uSunDir']);

// ==================== MATRIX MATH ====================
const mat4 = {
  create() { const m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; },
  perspective(fov, asp, near, far) {
    const m = new Float32Array(16);
    const f = 1/Math.tan(fov/2), nf = 1/(near-far);
    m[0]=f/asp; m[5]=f; m[10]=(far+near)*nf; m[11]=-1; m[14]=2*far*near*nf;
    return m;
  },
  lookAt(eye, center, up) {
    const m = new Float32Array(16);
    const zx=eye[0]-center[0], zy=eye[1]-center[1], zz=eye[2]-center[2];
    let len=1/Math.sqrt(zx*zx+zy*zy+zz*zz);
    const fz=[zx*len,zy*len,zz*len];
    const sx=up[1]*fz[2]-up[2]*fz[1], sy=up[2]*fz[0]-up[0]*fz[2], sz=up[0]*fz[1]-up[1]*fz[0];
    len=1/Math.sqrt(sx*sx+sy*sy+sz*sz);
    const fs=[sx*len,sy*len,sz*len];
    const ux=fz[1]*fs[2]-fz[2]*fs[1], uy=fz[2]*fs[0]-fz[0]*fs[2], uz=fz[0]*fs[1]-fz[1]*fs[0];
    m[0]=fs[0];m[1]=ux;m[2]=fz[0];m[4]=fs[1];m[5]=uy;m[6]=fz[1];m[8]=fs[2];m[9]=uz;m[10]=fz[2];
    m[12]=-(fs[0]*eye[0]+fs[1]*eye[1]+fs[2]*eye[2]);
    m[13]=-(ux*eye[0]+uy*eye[1]+uz*eye[2]);
    m[14]=-(fz[0]*eye[0]+fz[1]*eye[1]+fz[2]*eye[2]);
    m[3]=0;m[7]=0;m[11]=0;m[15]=1;
    return m;
  },
  translate(m, v) {
    const o = mat4.create();
    o.set(m); o[12]+=v[0]; o[13]+=v[1]; o[14]+=v[2]; return o;
  },
  scale(m, v) {
    const o = mat4.create();
    o[0]=m[0]*v[0];o[5]=m[5]*v[1];o[10]=m[10]*v[2];
    o[1]=m[1]*v[0];o[9]=m[9]*v[1];o[2]=m[2]*v[0];o[6]=m[6]*v[1];o[14]=m[14]*v[2];
    o[3]=m[3];o[4]=m[4]*v[0];o[8]=m[8]*v[1];o[11]=m[11]*v[2];
    o[12]=m[12];o[13]=m[13];o[15]=m[15];
    return o;
  },
  rotateY(m, a) {
    const c=Math.cos(a),s=Math.sin(a),o=new Float32Array(16);
    o[0]=m[0]*c+m[8]*s;o[1]=m[1]*c+m[9]*s;o[2]=m[2]*c+m[10]*s;o[3]=m[3];
    o[4]=m[4]*c+m[12]*s;o[5]=m[5]*c+m[13]*s;o[6]=m[6]*c+m[14]*s;o[7]=m[7];
    o[8]=m[8]*c-m[0]*s;o[9]=m[9]*c-m[1]*s;o[10]=m[10]*c-m[2]*s;o[11]=m[11];
    o[12]=m[12]*c-m[4]*s;o[13]=m[13]*c-m[5]*s;o[14]=m[14]*c-m[6]*s;o[15]=m[15];
    return o;
  },
  multiply(a, b) {
    const o = new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++) {
      o[i*4+j]=a[j]*b[i*4]+a[4+j]*b[i*4+1]+a[8+j]*b[i*4+2]+a[12+j]*b[i*4+3];
    }
    return o;
  }
};

// ==================== NOISE ====================
function noise2D(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const sx = fx*fx*(3-2*fx), sz = fz*fz*(3-2*fz);
  function h(a, b) {
    let n = a * 127.1 + b * 311.7;
    n = Math.sin(n) * 43758.5453;
    return n - Math.floor(n);
  }
  return (h(ix,iz)*(1-sx)+h(ix+1,iz)*sx)*(1-sz) + (h(ix,iz+1)*(1-sx)+h(ix+1,iz+1)*sx)*sz;
}

function fbm(x, z, oct) {
  let v=0,a=0.5,f=1;
  for(let i=0;i<oct;i++){v+=a*noise2D(x*f,z*f);a*=0.5;f*=2;}
  return v;
}

function terrainHeight(x, z) {
  let h = fbm(x*0.02, z*0.02, 6) * 30 - 15;
  // Create basins and mountains
  const d = Math.sqrt(x*x + z*z);
  const basin = Math.exp(-d*d/8000) * 10;
  h -= basin;
  // River channel
  const riverZ = Math.sin(x*0.03)*40 + Math.sin(x*0.01)*20;
  const riverDist = Math.abs(z - riverZ);
  if (riverDist < 15) h -= (15 - riverDist) * 0.8;
  return h;
}

// ==================== GEOMETRY BUILDERS ====================
function buildMesh(positions, normals, colors, types) {
  const vao = {};
  const vData = new Float32Array(positions.length + normals.length + colors.length);
  const tData = new Float32Array(types.length);
  let vi = 0;
  for (let i = 0; i < positions.length; i += 3) {
    vData[vi++] = positions[i]; vData[vi++] = positions[i+1]; vData[vi++] = positions[i+2];
    vi++; vi++; vi++; vi++; vi++; vi++; vi++; vi++; vi++;
  }
  // Interleaved: pos(3) + normal(3) + color(3) + type(1) = 10 floats per vertex
  const stride = 10;
  const totalVerts = positions.length / 3;
  const interleaved = new Float32Array(totalVerts * stride);
  for (let i = 0; i < totalVerts; i++) {
    interleaved[i*stride]     = positions[i*3];
    interleaved[i*stride+1]   = positions[i*3+1];
    interleaved[i*stride+2]   = positions[i*3+2];
    interleaved[i*stride+3]   = normals[i*3];
    interleaved[i*stride+4]   = normals[i*3+1];
    interleaved[i*stride+5]   = normals[i*3+2];
    interleaved[i*stride+6]   = colors[i*3];
    interleaved[i*stride+7]   = colors[i*3+1];
    interleaved[i*stride+8]   = colors[i*3+2];
    interleaved[i*stride+9]   = types[i];
  }

  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, interleaved, gl.STATIC_DRAW);

  return { vbo, count: totalVerts, stride };
}

function addFace(pos, positions, normals, colors, types, p0,p1,p2,p3, n, c, t) {
  const verts = [[p0,p1,p2],[p0,p2,p3]];
  for (const tri of verts) {
    for (const v of tri) {
      positions.push(v[0],v[1],v[2]);
      normals.push(n[0],n[1],n[2]);
      colors.push(c[0],c[1],c[2]);
      types.push(t);
    }
  }
}

function buildBox(x,y,z,w,h,d,c,t) {
  const positions=[],normals=[],colors=[],types=[];
  const hw=w/2,hh=h/2,hd=d/2;
  // +Y
  addFace(0,positions,normals,colors,types,
    [x-hw,y+hh,z-hd],[x+hw,y+hh,z-hd],[x+hw,y+hh,z+hd],[x-hw,y+hh,z+hd],
    [0,1,0],c,t);
  // -Y
  addFace(0,positions,normals,colors,types,
    [x-hw,y-hh,z+hd],[x+hw,y-hh,z+hd],[x+hw,y-hh,z-hd],[x-hw,y-hh,z-hd],
    [0,-1,0],c,t);
  // +X
  addFace(0,positions,normals,colors,types,
    [x+hw,y-hh,z-hd],[x+hw,y+hh,z-hd],[x+hw,y+hh,z+hd],[x+hw,y-hh,z+hd],
    [1,0,0],c,t);
  // -X
  addFace(0,positions,normals,colors,types,
    [x-hw,y-hh,z+hd],[x-hw,y+hh,z+hd],[x-hw,y+hh,z-hd],[x-hw,y-hh,z-hd],
    [-1,0,0],c,t);
  // +Z
  addFace(0,positions,normals,colors,types,
    [x-hw,y-hh,z+hd],[x-hw,y+hh,z+hd],[x+hw,y+hh,z+hd],[x+hw,y-hh,z+hd],
    [0,0,1],c,t);
  // -Z
  addFace(0,positions,normals,colors,types,
    [x+hw,y-hh,z-hd],[x+hw,y+hh,z-hd],[x+hw,y+hh,z+hd],[x+hw,y-hh,z+hd],
    [0,0,-1],c,t);
  return {positions,normals,colors,types};
}

function buildSphere(cx,cy,cz,r,segs,rings,c,t) {
  const positions=[],normals=[],colors=[],types=[];
  for(let r=0;r<rings;r++) {
    for(let s=0;s<segs;s++) {
      const theta0 = r*Math.PI/rings, theta1=(r+1)*Math.PI/rings;
      const phi0 = s*2*Math.PI/segs, phi1=(s+1)*2*Math.PI/segs;
      const p00=[cx+r*Math.sin(theta0)*Math.cos(phi0),cy+r*Math.cos(theta0),cz+r*Math.sin(theta0)*Math.sin(phi0)];
      const p01=[cx+r*Math.sin(theta0)*Math.cos(phi1),cy+r*Math.cos(theta0),cz+r*Math.sin(theta0)*Math.sin(phi1)];
      const p10=[cx+r*Math.sin(theta1)*Math.cos(phi0),cy+r*Math.cos(theta1),cz+r*Math.sin(theta1)*Math.sin(phi0)];
      const p11=[cx+r*Math.sin(theta1)*Math.cos(phi1),cy+r*Math.cos(theta1),cz+r*Math.sin(theta1)*Math.sin(phi1)];
      const n00=[p00[0]-cx,p00[1]-cy,p00[2]-cz], l=Math.sqrt(n00[0]**2+n00[1]**2+n00[2]**2)||1;
      n00[0]/=l;n00[1]/=l;n00[2]/=l;
      addFace(0,positions,normals,colors,types,[p00,p01,p10,p11],n00,c,t);
    }
  }
  return {positions,normals,colors,types};
}

function buildCylinder(cx,cy,cz,r,h,segs,c,t) {
  const positions=[],normals=[],colors=[],types=[];
  for(let i=0;i<segs;i++) {
    const a0=i*2*Math.PI/segs, a1=(i+1)*2*Math.PI/segs;
    const x0=Math.cos(a0),z0=Math.sin(a0),x1=Math.cos(a1),z1=Math.sin(a1);
    // Side
    addFace(0,positions,normals,colors,types,
      [cx+x0*r,cy-h/2,cz+z0*r],[cx+x1*r,cy-h/2,cz+z1*r],[cx+x1*r,cy+h/2,cz+z1*r],[cx+x0*r,cy+h/2,cz+z0*r],
      [x0,0,z0],c,t);
  }
  // Top
  for(let i=0;i<segs;i++) {
    const a0=i*2*Math.PI/segs,a1=(i+1)*2*Math.PI/segs;
    addFace(0,positions,normals,colors,types,
      [cx,cy+h/2,cz],[cx+Math.cos(a0)*r,cy+h/2,cz+Math.sin(a0)*r],[cx+Math.cos(a1)*r,cy+h/2,cz+Math.sin(a1)*r],
      [cx,cy+h/2,cz],[0,1,0],c,t);
  }
  // Bottom
  for(let i=0;i<segs;i++) {
    const a0=i*2*Math.PI/segs,a1=(i+1)*2*Math.PI/segs;
    addFace(0,positions,normals,colors,types,
      [cx,cy-h/2,cz],[cx+Math.cos(a1)*r,cy-h/2,cz+Math.sin(a1)*r],[cx+Math.cos(a0)*r,cy-h/2,cz+Math.sin(a0)*r],
      [cx,cy-h/2,cz],[0,-1,0],c,t);
  }
  return {positions,normals,colors,types};
}

function mergeMeshes(meshes) {
  const positions=[],normals=[],colors=[],types=[];
  meshes.forEach(m => {
    positions.push(...m.positions);
    normals.push(...m.normals);
    colors.push(...m.colors);
    types.push(...m.types);
  });
  return buildMesh(positions, normals, colors, types);
}

// ==================== WORLD GENERATION ====================
const CHUNK_SIZE = 40;
const chunks = {};
const interactables = [];

function getChunkKey(cx, cz) { return cx + ',' + cz; }

function generateChunk(cx, cz) {
  const key = getChunkKey(cx, cz);
  if (chunks[key]) return;

  const positions=[],normals=[],colors=[],types=[];
  const ox = cx * CHUNK_SIZE, oz = cz * CHUNK_SIZE;

  // Terrain
  const res = 2;
  for (let x = ox; x < ox + CHUNK_SIZE; x += res) {
    for (let z = oz; z < oz + CHUNK_SIZE; z += res) {
      const h = terrainHeight(x, z);
      const hR = terrainHeight(x+res, z);
      const hL = terrainHeight(x-res, z);
      const hF = terrainHeight(x, z+res);
      const hB = terrainHeight(x, z-res);
      const nx = (hR-hL), ny = res*2, nz=(hB-hF);
      const nl = Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
      const n = [nx/nl,ny/nl,nz/nl];

      // Water level
      const waterLevel = -2;
      let blockH = h;
      let color, blockType;

      if (h < waterLevel) {
        // Underwater - dark sand/mud
        color = [0.15, 0.2, 0.25];
        blockType = 35;
        blockH = waterLevel;
      } else if (h < waterLevel + 1) {
        color = [0.6, 0.55, 0.4];
        blockType = 35;
      } else {
        // Biome colors
        const biomeVal = fbm(x*0.01, z*0.01, 4);
        if (h > 20) {
          // Snowy peaks
          color = [0.85, 0.88, 0.95];
          blockType = 0;
        } else if (biomeVal > 0.6) {
          // Crimson flora zone
          color = [0.4 + Math.random()*0.1, 0.15, 0.25];
          blockType = 0;
        } else if (biomeVal < 0.3) {
          // Bioluminescent zone
          color = [0.1, 0.35, 0.3];
          blockType = 0;
        } else {
          // Normal alien green
          color = [0.15 + Math.random()*0.1, 0.35 + Math.random()*0.15, 0.1];
          blockType = 0;
        }
      }

      // Ground surface
      const y = blockH;
      addFace(0,positions,normals,colors,types,
        [x,y,z],[x+res,y,z],[x+res,y,z+res],[x,y,z+res], n, color, blockType);
    }
  }

  // Water plane
  const waterH = -2;
  for (let x = ox; x < ox + CHUNK_SIZE; x += res) {
    for (let z = oz; z < oz + CHUNK_SIZE; z += res) {
      const h = terrainHeight(x, z);
      if (h < waterH) {
        addFace(0,positions,normals,colors,types,
          [x,waterH,z],[x+res,waterH,z],[x+res,waterH,z+res],[x,waterH,z+res],
          [0,1,0], [0.1, 0.3, 0.5], 35);
      }
    }
  }

  // Glowing vegetation
  for (let i = 0; i < 20; i++) {
    const vx = ox + Math.random() * CHUNK_SIZE;
    const vz = oz + Math.random() * CHUNK_SIZE;
    const vy = terrainHeight(vx, vz);
    if (vy > waterH + 0.5 && vy < 18) {
      // Glowing mushroom/tower plant
      const mh = 1 + Math.random() * 3;
      const mr = 0.3 + Math.random() * 0.5;
      const glowColor = [0.2+Math.random()*0.3, 0.8+Math.random()*0.2, 0.3+Math.random()*0.3];
      const m = buildCylinder(vx, vy + mh/2, vz, mr*0.4, mh, 6, glowColor, 11);
      positions.push(...m.positions); normals.push(...m.normals);
      colors.push(...m.colors); types.push(...m.types);
      // Cap
      const cap = buildSphere(vx, vy+mh, mr, 6, 4, glowColor, 11);
      positions.push(...cap.positions); normals.push(...cap.normals);
      colors.push(...cap.colors); types.push(...cap.types);
    }
  }

  // Trees (alien)
  for (let i = 0; i < 12; i++) {
    const tx = ox + Math.random() * CHUNK_SIZE;
    const tz = oz + Math.random() * CHUNK_SIZE;
    const ty = terrainHeight(tx, tz);
    if (ty > waterH + 1 && ty < 16) {
      const th = 4 + Math.random() * 6;
      // Trunk
      const trunk = buildCylinder(tx, ty+th/2, tz, 0.4, th, 8, [0.3,0.2,0.15], 0);
      positions.push(...trunk.positions); normals.push(...trunk.normals);
      colors.push(...trunk.colors); types.push(...trunk.types);
      // Canopy - multiple spheres
      const canopyColor = [0.1+Math.random()*0.2, 0.4+Math.random()*0.3, 0.05];
      for (let j = 0; j < 3; j++) {
        const sx = tx + (Math.random()-0.5)*2;
        const sy = ty + th + Math.random()*2;
        const sz = tz + (Math.random()-0.5)*2;
        const cr = 1.5 + Math.random()*2;
        const canopy = buildSphere(sx, sy, sz, cr, 8, 6, canopyColor, 0);
        positions.push(...canopy.positions); normals.push(...canopy.normals);
        colors.push(...canopy.colors); types.push(...canopy.types);
      }
    }
  }

  // Rocks
  for (let i = 0; i < 8; i++) {
    const rx = ox + Math.random() * CHUNK_SIZE;
    const rz = oz + Math.random() * CHUNK_SIZE;
    const ry = terrainHeight(rx, rz);
    if (ry > waterH + 0.5) {
      const rs = 0.5 + Math.random() * 2;
      const rock = buildSphere(rx, ry + rs*0.5, rz, rs, 6, 4, [0.3+Math.random()*0.2, 0.28+Math.random()*0.15, 0.25], 0);
      positions.push(...rock.positions); normals.push(...rock.normals);
      colors.push(...rock.colors); types.push(...rock.types);
    }
  }

  // Cave entrances in steep terrain
  for (let i = 0; i < 3; i++) {
    const cx2 = ox + Math.random() * CHUNK_SIZE;
    const cz2 = oz + Math.random() * CHUNK_SIZE;
    const ch = terrainHeight(cx2, cz2);
    if (ch > 8 && ch < 22) {
      // Cave arch
      for (let a = 0; a < 8; a++) {
        const ang = a * Math.PI / 8;
        const px = cx2 + Math.cos(ang) * 3;
        const pz = cz2 + Math.sin(ang) * 3;
        const py = ch + Math.sin(ang * 2) * 1.5 + 1;
        const rock = buildSphere(px, py, pz, 1.2, 5, 4, [0.2, 0.18, 0.15], 0);
        positions.push(...rock.positions); normals.push(...rock.normals);
        colors.push(...rock.colors); types.push(...rock.types);
      }
      // Glowing crystals inside
      for (let c2 = 0; c2 < 3; c2++) {
        const cx3 = cx2 + (Math.random()-0.5)*3;
        const cz3 = cz2 + (Math.random()-0.5)*3;
        const cy3 = ch + Math.random()*2;
        const crystal = buildCylinder(cx3, cy3+1, cz3, 0.2, 2+Math.random(), 5, [0.5,0.9,1.0], 11);
        positions.push(...crystal.positions); normals.push(...crystal.normals);
        colors.push(...crystal.colors); types.push(...crystal.types);
      }
    }
  }

  chunks[key] = buildMesh(positions, normals, colors, types);
}

  allColors.push(...mill.colors); allTypes.push(...mill.types);

  const wheel = buildCylinder(mx+5, my+3, mz, 3, 0.5, 12, [0.4,0.3,0.15], 0);
  allPositions.push(...wheel.positions); allNormals.push(...wheel.normals);
  allColors.push(...wheel.colors); allTypes.push(...wheel.types);

  // --- WATCHTOWERS ---
  [[-80,-60],[80,-80],[-80,80],[100,60]].forEach(([wx,wz], i) => {
    const wy = terrainHeight(wx, wz);
    const tower = buildCylinder(wx, wy+8, wz, 2, 16, 8, [0.3,0.28,0.25], 0);
    allPositions.push(...tower.positions); allNormals.push(...tower.normals);
    allColors.push(...tower.colors); allTypes.push(...tower.types);
    // Platform
    const plat = buildBox(wx, wy+16, wz, 5, 0.5, 5, [0.35,0.33,0.3], 0);
    allPositions.push(...plat.positions); allNormals.push(...plat.normals);
    allColors.push(...plat.colors); allTypes.push(...plat.types);
    // Torch
    const torch = buildCylinder(wx, wy+17.5, wz, 0.2, 2, 4, [1,0.6,0.2], 12);

    [120, 0, 30], [-120, 0, -50], [60, 0, -90], [-30, 0, 100]

  allPositions.push(...lava.positions); allNormals.push(...lava.normals);
  allColors.push(...lava.colors); allTypes.push(...lava.types);

  structures.mesh = buildMesh(allPositions, allNormals, allColors, allTypes);
}

// ==================== PARTICLE SYSTEMS ====================
const particleData = [];
const MAX_PARTICLES = 5000;

function spawnParticle(x,y,z,vx,vy,vz,size,color,life,type) {
  if (particleData.length >= MAX_PARTICLES) return;
  particleData.push({x,y,z,vx,vy,vz,size,color,life,maxLife:life,type});
}

function spawnWeatherParticles() {
  // Spores
  for (let i = 0; i < 2; i++) {
    spawnParticle(
      Math.random()*300-150, 20+Math.random()*40, Math.random()*300-150,
      (Math.random()-0.5)*0.5, -0.3-Math.random()*0.5, (Math.random()-0.5)*0.5,
      0.5+Math.random()*1.5,
      [0.3+Math.random()*0.3, 0.8+Math.random()*0.2, 0.2+Math.random()*0.3],
      5+Math.random()*10, 2
    );
  }
  // Rain-like drizzle in some areas
  for (let i = 0; i < 1; i++) {
    const px = Math.random()*300-150;
    const pz = Math.random()*300-150;
    spawnParticle(px, 50+Math.random()*10, pz, 0, -3-Math.random()*2, 0, 0.3, [0.4,0.6,0.8], 3, 1);
  }
}

function updateParticles(dt) {
  for (let i = particleData.length-1; i >= 0; i--) {
    const p = particleData[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.life -= dt;
    if (p.type === 2) {
      p.vx += Math.sin(p.y*0.1)*dt;
      p.vz += Math.cos(p.y*0.1)*dt;
    }
    if (p.life <= 0 || p.y < -5) {
      particleData.splice(i, 1);
    }
  }
}

function buildParticleBuffer() {
  if (particleData.length === 0) return null;
  const positions=[],sizes=[],colors=[],typesArr=[];
  for (const p of particleData) {
    positions.push(p.x,p.y,p.z);
    sizes.push(p.size);
    colors.push(...p.color);
    typesArr.push(p.type);
  }
  const stride = 8;
  const total = particleData.length;
  const data = new Float32Array(total * stride);
  for (let i = 0; i < total; i++) {
    data[i*stride] = positions[i*3];
    data[i*stride+1] = positions[i*3+1];
    data[i*stride+2] = positions[i*3+2];
    data[i*stride+3] = sizes[i];
    data[i*stride+4] = colors[i*3];
    data[i*stride+5] = colors[i*3+1];
    data[i*stride+6] = colors[i*3+2];
    data[i*stride+7] = typesArr[i];
  }
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  return { vbo, count: total };
}

// ==================== WILDLIFE ====================
const creatures = [];

function spawnCreatures() {
  // Floating jellyfish-like creatures
  for (let i = 0; i < 8; i++) {
    creatures.push({
      x: Math.random()*200-100, y: 15+Math.random()*20, z: Math.random()*200-100,
      baseY: 15+Math.random()*20, phase: Math.random()*6.28,
      speed: 0.3+Math.random()*0.5, radius: 1+Math.random()*2,
      color: [0.4+Math.random()*0.3, 0.7+Math.random()*0.3, 0.9+Math.random()*0.1],
      type: 'jellyfish'
    });
  }
  // Ground creatures (hexapod-like)
  for (let i = 0; i < 6; i++) {
    creatures.push({
      x: Math.random()*200-100, z: Math.random()*200-100,
      phase: Math.random()*6.28, speed: 0.5+Math.random()*1,
      radius: 0.5+Math.random()*0.5,
      color: [0.6,0.3,0.2],
      type: 'ground'
    });
  }
}

function updateCreatures(time) {
  creatures.forEach(c => {
    if (c.type === 'jellyfish') {
      c.x += Math.sin(time*0.3 + c.phase) * c.speed * 0.02;
      c.z += Math.cos(time*0.2 + c.phase) * c.speed * 0.02;
      c.y = c.baseY + Math.sin(time*0.5 + c.phase) * 3;
    } else {
      c.x += Math.sin(time*0.1 + c.phase) * c.speed * 0.03;
      c.z += Math.cos(time*0.15 + c.phase) * c.speed * 0.03;
    }
  });
}

function buildCreatureMesh(c, time) {
  const positions=[],normals=[],colors=[],types=[];
  if (c.type === 'jellyfish') {
    // Dome
    const dome = buildSphere(c.x, c.y, c.z, c.radius, 8, 4, c.color, 11);
    positions.push(...dome.positions); normals.push(...dome.normals);
    colors.push(...dome.colors); types.push(...dome.types);
    // Tentacles
    for (let t = 0; t < 6; t++) {
      const ang = t * Math.PI * 2 / 6;
      for (let s = 0; s < 4; s++) {
        const tx = c.x + Math.cos(ang)*c.radius*0.8 + Math.sin(time*2+s)*0.2;
        const ty = c.y - c.radius - s*0.8 + Math.sin(time*3+s+c.phase)*0.2;
        const tz = c.z + Math.sin(ang)*c.radius*0.8 + Math.cos(time*2+s)*0.2;
        const seg = buildSphere(tx, ty, tz, 0.15, 4, 3, c.color, 11);
        positions.push(...seg.positions); normals.push(...seg.normals);
        colors.push(...seg.colors); types.push(...seg.types);
      }
    }
  } else {
    // Body
    const body = buildSphere(c.x, terrainHeight(c.x,c.z)+0.5, c.z, c.radius, 6, 4, c.color, 0);
    positions.push(...body.positions); normals.push(...body.normals);
    colors.push(...body.colors); types.push(...body.types);
    // Eyes
    for (let e = 0; e < 2; e++) {
      const eye = buildSphere(c.x+Math.cos(c.phase+e)*c.radius, terrainHeight(c.x,c.z)+0.8, c.z+Math.sin(c.phase+e)*c.radius, 0.2, 4, 3, [1,0.8,0.2], 11);
      positions.push(...eye.positions); normals.push(...eye.normals);
      colors.push(...eye.colors); types.push(...eye.types);
    }
  }
  return buildMesh(positions, normals, colors, types);
}

// ==================== SKY DOME ====================
const skyPositions = [];
const skySegs = 24;
for (let r = 0; r < skySegs; r++) {
  for (let s = 0; s < skySegs; s++) {
    const theta0 = r*Math.PI/skySegs, theta1=(r+1)*Math.PI/skySegs;
    const phi0 = s*2*Math.PI/skySegs, phi1=(s+1)*2*Math.PI/skySegs;
    const p00=[Math.sin(theta0)*Math.cos(phi0),Math.cos(theta0),Math.sin(theta0)*Math.sin(phi0)];
    const p01=[Math.sin(theta0)*Math.cos(phi1),Math.cos(theta0),Math.sin(theta0)*Math.sin(phi1)];
    const p10=[Math.sin(theta1)*Math.cos(phi0),Math.cos(theta1),Math.sin(theta1)*Math.sin(phi0)];
    const p11=[Math.sin(theta1)*Math.cos(phi1),Math.cos(theta1),Math.sin(theta1)*Math.sin(phi1)];
    skyPositions.push(...p00,...p01,...p10,...p00,...p11,...p10);
  }
}
const skyVBO = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, skyVBO);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(skyPositions), gl.STATIC_DRAW);
const skyVertCount = skyPositions.length / 3;

// ==================== VR CONTROLLER SUPPORT ====================
const controllerModels = [];

function getControllerMatrix(inputSource, frame) {
  const gripSpace = inputSource.gripSpace;
  if (!gripSpace || !xrRefSpace) return null;
  const pose = frame.getPose(gripSpace, xrRefSpace);
  if (!pose) return null;
  const m = new Float32Array(16);
  const t = pose.transform.matrix;
  if (t) m.set(t);
  else {
    const q = pose.transform.orientation;
    const p = pose.transform.position;
    // Convert quaternion to matrix
    const x=q[0],y=q[1],z=q[2],w=q[3];
    m[0]=1-2*y*y-2*z*z;m[1]=2*x*y+2*w*z;m[2]=2*x*z-2*w*y;m[3]=0;
    m[4]=2*x*y-2*w*z;m[5]=1-2*x*x-2*z*z;m[6]=2*y*z+2*w*x;m[7]=0;
    m[8]=2*x*z+2*w*y;m[9]=2*y*z-2*w*x;m[10]=1-2*x*x-2*y*y;m[11]=0;
    m[12]=p[0];m[13]=p[1];m[14]=p[2];m[15]=1;
  }
  return m;
}

// ==================== RENDERING ====================
function setAttribs(prog, mesh, useType) {
  gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vbo);
  const stride = mesh.stride * 4;
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 3, gl.FLOAT, false, stride, 24);
  if (useType) {
    gl.enableVertexAttribArray(3);
    gl.vertexAttribPointer(3, 1, gl.FLOAT, false, stride, 36);
  }
}

function setAttribsParticle(vbo) {
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  const stride = 8 * 4;
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 1, gl.FLOAT, false, stride, 12);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 3, gl.FLOAT, false, stride, 16);
  gl.enableVertexAttribArray(3);
  gl.vertexAttribPointer(3, 1, gl.FLOAT, false, stride, 28);
}

let frameTime = 0;
let lastTime = 0;

function onXRFrame(time, frame) {
  if (!xrSession) return;
  xrSession.requestAnimationFrame(onXRFrame);

  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  frameTime += dt;

  // Update
  updateParticles(dt);
  spawnWeatherParticles();
  updateCreatures(frameTime);

  const pose = frame.getViewerPose(xrRefSpace);
  if (!pose) return;

  gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
  gl.viewport(0, 0, glLayer.framebufferWidth, glLayer.framebufferHeight);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  for (const view of pose.views) {
    const viewport = glLayer.getViewport(view);
    gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);

    const viewMatrix = new Float32Array(16);
    const projMatrix = new Float32Array(16);
    if (view.transform.matrix) {
      viewMatrix.set(view.transform.matrix);
    } else {
      const q = view.transform.orientation;
      const p = view.transform.position;
      const x=q[0],y=q[1],z=q[2],w=q[3];
      viewMatrix[0]=1-2*y*y-2*z*z;viewMatrix[1]=2*x*y+2*w*z;viewMatrix[2]=2*x*z-2*w*y;viewMatrix[3]=0;
      viewMatrix[4]=2*x*y-2*w*z;viewMatrix[5]=1-2*x*x-2*z*z;viewMatrix[6]=2*y*z+2*w*x;viewMatrix[7]=0;
      viewMatrix[8]=2*x*z+2*w*y;viewMatrix[9]=2*y*z-2*w*x;viewMatrix[10]=1-2*x*x-2*y*y;viewMatrix[11]=0;
      viewMatrix[12]=p[0];viewMatrix[13]=p[1];viewMatrix[14]=p[2];viewMatrix[15]=1;
    }
    projMatrix.set(view.projectionMatrix);

    // Generate chunks around camera
    const camX = view.transform.position[0];
    const camZ = view.transform.position[2];
    const ccx = Math.floor(camX / CHUNK_SIZE);
    const ccz = Math.floor(camZ / CHUNK_SIZE);
    for (let dx = -3; dx <= 3; dx++) {
      for (let dz = -3; dz <= 3; dz++) {
        generateChunk(ccx+dx, ccz+dz);
      }
    }

    // Sun direction (animated)
    const sunAngle = frameTime * 0.02;
    const sunDir = [Math.cos(sunAngle)*0.5, 0.6+Math.sin(sunAngle*0.3)*0.2, Math.sin(sunAngle)*0.3];

    // --- RENDER SKY ---
    gl.depthMask(false);
    gl.useProgram(skyProg);
    gl.uniformMatrix4fv(skyU.uProj, false, projMatrix);
    gl.uniformMatrix4fv(skyU.uView, false, viewMatrix);
    gl.uniform1f(skyU.uTime, frameTime);
    gl.uniform3fv(skyU.uSunDir, sunDir);
    gl.bindBuffer(gl.ARRAY_BUFFER, skyVBO);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, skyVertCount);
    gl.depthMask(true);

    // --- RENDER WORLD ---
    gl.useProgram(mainProg);
    gl.uniformMatrix4fv(mainU.uProj, false, projMatrix);
    gl.uniformMatrix4fv(mainU.uView, false, viewMatrix);
    gl.uniformMatrix4fv(mainU.uModel, false, mat4.create());
    gl.uniform1f(mainU.uTime, frameTime);
    gl.uniform3fv(mainU.uCamPos, view.transform.position);
    gl.uniform3fv(mainU.uSunDir, sunDir);
    gl.uniform3fv(mainU.uSunColor, [1.0, 0.9, 0.8]);
    gl.uniform3fv(mainU.uAmbient, [0.2, 0.25, 0.35]);
    gl.uniform3fv(mainU.uFogColor, [0.15, 0.1, 0.25]);
    gl.uniform1f(mainU.uEmissiveBoost, 1.5);

    // Render chunks
    for (let dx = -3; dx <= 3; dx++) {
      for (let dz = -3; dz <= 3; dz++) {
        const key = getChunkKey(ccx+dx, ccz+dz);
        const chunk = chunks[key];
        if (chunk) {
          setAttribs(mainProg, chunk, true);
          gl.drawArrays(gl.TRIANGLES, 0, chunk.count);
        }
      }
    }

    // Render structures
    if (structures.mesh) {
      setAttribs(mainProg, structures.mesh, true);
      gl.drawArrays(gl.TRIANGLES, 0, structures.mesh.count);
    }

    // --- RENDER CREATURES ---
    creatures.forEach(c => {
      const cmesh = buildCreatureMesh(c, frameTime);
      setAttribs(mainProg, cmesh, true);
      gl.drawArrays(gl.TRIANGLES, 0, cmesh.count);
      gl.deleteBuffer(cmesh.vbo);
    });

    // --- RENDER PARTICLES ---
    gl.useProgram(particleProg);
    gl.uniformMatrix4fv(partU.uProj, false, projMatrix);
    gl.uniformMatrix4fv(partU.uView, false, viewMatrix);
    gl.uniform1f(partU.uTime, frameTime);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.depthMask(false);

    const pbuf = buildParticleBuffer();
    if (pbuf) {
      setAttribsParticle(pbuf.vbo);
      gl.drawArrays(gl.POINTS, 0, pbuf.count);
      gl.deleteBuffer(pbuf.vbo);
    }

    gl.depthMask(true);
    gl.disable(gl.BLEND);

    // --- RENDER CONTROLLER VISUALS ---
    const controllers = frame.session.inputSources || [];
    controllers.forEach(is => {
      const cmat = getControllerMatrix(is, frame);
      if (!cmat) return;
      // Simple controller stick visual
      const stickPositions = [], stickNormals = [], stickColors = [], stickTypes = [];
      const sx = cmat[12], sy = cmat[13], sz = cmat[14];
      const sc = buildCylinder(sx, sy + 0.2, sz, 0.02, 0.4, 8, [0.5,0.8,1.0], 11);
      stickPositions.push(...sc.positions); stickNormals.push(...sc.normals);
      stickColors.push(...sc.colors); stickTypes.push(...sc.types);
      const cMesh = buildMesh(stickPositions, stickNormals, stickColors, stickTypes);
      gl.useProgram(mainProg);
      gl.disable(gl.BLEND);
      gl.depthMask(true);
      gl.uniformMatrix4fv(mainU.uProj, false, projMatrix);
      gl.uniformMatrix4fv(mainU.uView, false, viewMatrix);
      gl.uniformMatrix4fv(mainU.uModel, false, mat4.create());
      setAttribs(mainProg, cMesh, true);
      gl.drawArrays(gl.TRIANGLES, 0, cMesh.count);
      gl.deleteBuffer(cMesh.vbo);
    });

    // --- ARTIFACT COLLECTION CHECK ---
    const cp = view.transform.position;
    structures.forEach(s => {
      if (s.type === 'artifact' && !s.collected) {
        const dx = cp[0] - s.pos[0], dy = cp[1] - s.pos[1], dz = cp[2] - s.pos[2];
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist < s.radius) {
          s.collected = true;
          artifactsCollected++;
        }
      }
    });
  }

  // Update HUD
  hudEl.innerHTML = `Position: ${Math.round(view.transform.position[0])}, ${Math.round(view.transform.position[1])}, ${Math.round(view.transform.position[2])}`;
  artifactEl.textContent = `Artifacts: ${artifactsCollected} / ${totalArtifacts}`;
  if (artifactsCollected >= totalArtifacts) {
    artifactEl.textContent += ' — ALL COLLECTED!';
    artifactEl.style.color = '#44ff44';
  }
}

// ==================== NON-VR FALLBACK (Desktop) ====================
let desktopMode = false;
let yaw = 0, pitch = 0;
let keysDown = {};
let desktopCam = { x: 0, y: 15, z: 40 };
let mouseX = 0, mouseY = 0;
let isPointerLocked = false;

// Check if WebXR is actually available
setTimeout(() => {
  if (!xrSession && enterBtn.disabled === false) {
    // Wait for user to enter VR
  } else if (enterBtn.disabled) {
    // Fall back to desktop mode
    enterBtn.textContent = 'Play (Desktop)';
    enterBtn.disabled = false;
    enterBtn.onclick = () => {
      overlay.classList.add('hidden');
      desktopMode = true;
      initDesktop();
    };
    statusEl.textContent = 'VR not available — Desktop mode';
  }
}, 2000);

function initDesktop() {
  canvas.addEventListener('click', () => canvas.requestPointerLock());
  document.addEventListener('pointerlockchange', () => {
    isPointerLocked = document.pointerLockElement === canvas;
  });
  document.addEventListener('mousemove', e => {
    if (isPointerLocked) {
      yaw -= e.movementX * 0.003;
      pitch -= e.movementY * 0.003;
      pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
    }
  });
  document.addEventListener('keydown', e => keysDown[e.key.toLowerCase()] = true);
  document.addEventListener('keyup', e => keysDown[e.key.toLowerCase()] = false);

  // Generate initial world
  generateStructures();
  spawnCreatures();
  for (let dx = -3; dx <= 3; dx++) for (let dz = -3; dz <= 3; dz++) generateChunk(dx, dz);

  requestAnimationFrame(desktopFrame);
}

function desktopFrame(time) {
  if (!desktopMode) return;
  requestAnimationFrame(desktopFrame);

  const dt = Math.min((time - (desktopFrame.last || time)) / 1000, 0.05);
  desktopFrame.last = time;
  frameTime += dt;

  // Camera movement
  const speed = 20 * dt;
  const fwd = [Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch)];
  const right = [Math.cos(yaw), 0, Math.sin(yaw)];

  if (keysDown['w'] || keysDown['arrowup']) desktopCam.x += fwd[0]*speed, desktopCam.z += fwd[2]*speed;
  if (keysDown['s'] || keysDown['arrowdown']) desktopCam.x -= fwd[0]*speed, desktopCam.z -= fwd[2]*speed;
  if (keysDown['a'] || keysDown['arrowleft']) desktopCam.x -= right[0]*speed, desktopCam.z -= right[2]*speed;
  if (keysDown['d'] || keysDown['arrowright']) desktopCam.x += right[0]*speed, desktopCam.z += right[2]*speed;
  if (keysDown[' ']) desktopCam.y += speed;
  if (keysDown['shift']) desktopCam.y -= speed;

  // Clamp to terrain
  const terrainY = terrainHeight(desktopCam.x, desktopCam.z);
  if (desktopCam.y < terrainY + 2) desktopCam.y = terrainY + 2;

  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  const camPos = [desktopCam.x, desktopCam.y, desktopCam.z];
  const lookX = desktopCam.x + Math.sin(yaw)*Math.cos(pitch);
  const lookY = desktopCam.y + Math.sin(pitch);
  const lookZ = desktopCam.z - Math.cos(yaw)*Math.cos(pitch);
  const viewMatrix = mat4.lookAt(camPos, [lookX, lookY, lookZ], [0, 1, 0]);
  const projMatrix = mat4.perspective(Math.PI / 2.5, canvas.width / canvas.height, 0.1, 600);

  // Generate chunks
  const ccx = Math.floor(desktopCam.x / CHUNK_SIZE);
  const ccz = Math.floor(desktopCam.z / CHUNK_SIZE);
  for (let dx = -3; dx <= 3; dx++) for (let dz = -3; dz <= 3; dz++) generateChunk(ccx+dx, ccz+dz);

  // Ensure structures exist
  if (!structures.mesh) {
    generateStructures();
    spawnCreatures();
  }

  updateParticles(dt);
  spawnWeatherParticles();
  updateCreatures(frameTime);

  const sunAngle = frameTime * 0.02;
  const sunDir = [Math.cos(sunAngle)*0.5, 0.6+Math.sin(sunAngle*0.3)*0.2, Math.sin(sunAngle)*0.3];

  // SKY
  gl.depthMask(false);
  gl.useProgram(skyProg);
  gl.uniformMatrix4fv(skyU.uProj, false, projMatrix);
  gl.uniformMatrix4fv(skyU.uView, false, viewMatrix);
  gl.uniform1f(skyU.uTime, frameTime);
  gl.uniform3fv(skyU.uSunDir, sunDir);
  gl.bindBuffer(gl.ARRAY_BUFFER, skyVBO);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, skyVertCount);
  gl.depthMask(true);

  // WORLD
  gl.useProgram(mainProg);
  gl.uniformMatrix4fv(mainU.uProj, false, projMatrix);
  gl.uniformMatrix4fv(mainU.uView, false, viewMatrix);
  gl.uniformMatrix4fv(mainU.uModel, false, mat4.create());
  gl.uniform1f(mainU.uTime, frameTime);
  gl.uniform3fv(mainU.uCamPos, camPos);
  gl.uniform3fv(mainU.uSunDir, sunDir);
  gl.uniform3fv(mainU.uSunColor, [1.0, 0.9, 0.8]);
  gl.uniform3fv(mainU.uAmbient, [0.2, 0.25, 0.35]);
  gl.uniform3fv(mainU.uFogColor, [0.15, 0.1, 0.25]);
  gl.uniform1f(mainU.uEmissiveBoost, 1.5);

  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = -3; dz <= 3; dz++) {
      const key = getChunkKey(ccx+dx, ccz+dz);
      const chunk = chunks[key];
      if (chunk) {
        setAttribs(mainProg, chunk, true);
        gl.drawArrays(gl.TRIANGLES, 0, chunk.count);
      }
    }
  }

  // Structures
  if (structures.mesh) {
    setAttribs(mainProg, structures.mesh, true);
    gl.drawArrays(gl.TRIANGLES, 0, structures.mesh.count);
  }

  // Creatures
  creatures.forEach(c => {
    const cmesh = buildCreatureMesh(c, frameTime);
    setAttribs(mainProg, cmesh, true);
    gl.drawArrays(gl.TRIANGLES, 0, cmesh.count);
    gl.deleteBuffer(cmesh.vbo);
  });

  // Particles
  gl.useProgram(particleProg);
  gl.uniformMatrix4fv(partU.uProj, false, projMatrix);
  gl.uniformMatrix4fv(partU.uView, false, viewMatrix);
  gl.uniform1f(partU.uTime, frameTime);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.depthMask(false);

  const pbuf = buildParticleBuffer();
  if (pbuf) {
    setAttribsParticle(pbuf.vbo);
    gl.drawArrays(gl.POINTS, 0, pbuf.count);
    gl.deleteBuffer(pbuf.vbo);
  }

  gl.depthMask(true);
  gl.disable(gl.BLEND);

  // Artifact collection
  structures.forEach(s => {
    if (s.type === 'artifact' && !s.collected) {
      const dx = desktopCam.x - s.pos[0], dy = desktopCam.y - s.pos[1], dz = desktopCam.z - s.pos[2];
      if (Math.sqrt(dx*dx + dy*dy + dz*dz) < s.radius) {
        s.collected = true;
        artifactsCollected++;
      }
    }
  });

  hudEl.innerHTML = `
    <div>WASD Move | Space/Shift Up/Down</div>
    <div>Click to lock mouse | Look around</div>
    <div style="margin-top:8px">Position: ${Math.round(desktopCam.x)}, ${Math.round(desktopCam.y)}, ${Math.round(desktopCam.z)}</div>
  `;
  artifactEl.textContent = `✦ Artifacts: ${artifactsCollected} / ${totalArtifacts}`;
  if (artifactsCollected >= totalArtifacts) {
    artifactEl.textContent += ' — ALL COLLECTED!';
    artifactEl.style.color = '#44ff44';
  }
}

// ==================== AUTO-INIT FOR DESKTOP ====================
setTimeout(() => {
  if (!xrSession && desktopMode) return;
  if (!enterBtn.disabled) return; // Wait for VR init
  // If still not in VR after 3s, enable desktop fallback
  enterBtn.textContent = 'Play (Desktop)';
  enterBtn.disabled = false;
  enterBtn.onclick = () => {
    overlay.classList.add('hidden');
    desktopMode = true;
    initDesktop();
  };
  statusEl.textContent = 'WebXR not detected — Desktop mode available';
}, 3000);
</script>
