<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equal Earth Interactive Map</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #1a1a2e; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map-container { width: 100vw; height: 100vh; cursor: grab; }
        #map-container:active { cursor: grabbing; }
        
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            user-select: none;
            max-width: 300px;
        }
        .overlay h2 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .coord-display {
            font-family: monospace;
            font-size: 13px;
            color: #e94560;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
        .instructions { font-size: 12px; color: #666; line-height: 1.4; }
        .controls { margin-top: 10px; display: flex; gap: 5px; }
        input { width: 60px; font-size: 12px; }
        button { cursor: pointer; font-size: 12px; padding: 2px 8px; }
    </style>
</head>
<body>

    <div class="overlay">
        <h2>Equal Earth Projection</h2>
        <span class="coord-display" id="coords">Click map for coordinates</span>
        <div class="instructions">
            • <b>Drag</b> to pan<br>
            • <b>Scroll</b> to zoom<br>
            • <b>Click</b> to get Lat/Lon (Inverse)
        </div>
        <div class="controls">
            <input type="number" id="latIn" value="40.7" step="0.1">
            <input type="number" id="lonIn" value="-74.0" step="0.1">
            <button onclick="handleAddMarker()">Add Marker</button>
        </div>
    </div>

    <div id="map-container"></div>

    <!-- Load SVG.js and TopoJSON client -->
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

    <script>
        /**
         * EQUAL EARTH PROJECTION MATH
         * Based on the official definition.
         * Equal Earth is a pseudocylindrical equal-area projection.
         */
        const EE = {
            // Constants for the projection
            a: 1.340264,
            b: 0.081106,
            c: 0.000715,
            d: -0.009270,
            rad: Math.PI / 180,
            deg: 180 / Math.PI,

            // Forward Projection: (lon, lat) -> (x, y)
            forward: function(lon, lat) {
                const lambda = lon * this.rad;
                const phi = lat * this.rad;
                
                // Solve for theta (the auxiliary angle)
                // theta = arcsin((2*phi + sin(2*phi))/3)
                const theta = Math.asin((2 * phi + Math.sin(2 * phi)) / 3);
                
                const x = this.a * lambda * Math.cos(theta);
                const y = this.d * theta + Math.sin(theta) * (this.b + this.c * Math.cos(theta) * Math.cos(theta));
                
                return { x, y };
            },

            // Inverse Projection: (x, y) -> (lon, lat)
            inverse: function(x, y) {
                // 1. Solve for theta using Newton-Raphson since y = f(theta) is transcendental
                let theta = y; // Initial guess
                for (let i = 0; i < 10; i++) {
                    const cosT = Math.cos(theta);
                    const sinT = Math.sin(theta);
                    const f = this.d * theta + sinT * (this.b + this.c * cosT * cosT) - y;
                    const df = this.d + Math.cos(theta) * (this.b + this.c * cosT * cosT) + sinT * (-2 * this.c * cosT * sinT);
                    theta = theta - f / df;
                }

                // 2. Convert theta back to latitude phi
                // theta = arcsin((2*phi + sin(2*phi))/3) -> we solve for phi
                // Approximation for phi:
                let phi = theta;
                for (let i = 0; i < 10; i++) {
                    const f = (2 * phi + Math.sin(2 * phi)) / 3 - Math.sin(theta);
                    const df = (2 + 2 * Math.cos(2 * phi)) / 3;
                    phi = phi - f / df;
                }

                // 3. Solve for longitude lambda
                const lambda = x / (this.a * Math.cos(theta));

                return {
                    lat: phi * this.deg,
                    lon: lambda * this.deg
                };
            }
        };

        // APP STATE
        const state = {
            scale: 150,
            tx: window.innerWidth / 2,
            ty: window.innerHeight / 2,
            isDragging: false,
            lastMouse: { x: 0, y: 0 }
        };

        // INITIALIZE SVG.js
        const draw = SVG().addTo('#map-container').size('100%', '100%');
        const worldGroup = draw.group(); // Group for the map and markers
        
        async function initMap() {
            try {
                // Load TopoJSON data (Natural Earth 110m)
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
                const topoData = await response.json();
                const geojson = topojson.feature(topoData, topoData.objects.countries);

                // Render Countries
                geojson.features.forEach(feature => {
                    const paths = [];
                    
                    const processCoords = (coords) => {
                        if (typeof coords[0] === 'number') {
                            // Linear Ring
                            let pathStr = "";
                            coords.forEach((coord, i) => {
                                const proj = EE.forward(coord[0], coord[1]);
                                const sx = proj.x * state.scale + state.tx;
                                const sy = proj.y * state.scale + state.ty;
                                pathStr += (i === 0 ? 'M' : 'L') + `${proj.x},${proj.y}`;
                            });
                            return pathStr + "Z";
                        } else {
                            // Polygon or MultiPolygon
                            return coords.map(processCoords).join(" ");
                        }
                    };

                    if (feature.geometry.type === 'Polygon') {
                        const d = processCoords(feature.geometry.coordinates);
                        worldGroup.path(d).fill('#3d5a80').stroke({ width: 0.1, color: '#fff' });
                    } else if (feature.geometry.type === 'MultiPolygon') {
                        const d = feature.geometry.coordinates.map(poly => processCoords(poly)).join(" ");
                        worldGroup.path(d).fill('#3d5a80').stroke({ width: 0.1, color: '#fff' });
                    }
                });

                updateTransform();
            } catch (e) {
                console.error("Error loading map data:", e);
            }
        }

        function updateTransform() {
            worldGroup.transform({
                scale: state.scale,
                translateX: state.tx,
                translateY: state.ty
            });
        }

        // MARKER LOGIC
        function addMarker(lat, lon) {
            const proj = EE.forward(lon, lat);
            // We draw in projection space, so we don't need to multiply by scale/tx manually,
            // SVG.js group transform handles it.
            worldGroup.circle(4).fill('#e94560').stroke({width: 0.2, color: '#fff'}).center(proj.x, proj.y);
        }

        window.handleAddMarker = function() {
            const lat = parseFloat(document.getElementById('latIn').value);
            const lon = parseFloat(document.getElementById('lonIn').value);
            if (!isNaN(lat) && !isNaN(lon)) {
                addMarker(lat, lon);
            }
        };

        // INTERACTION HANDLERS
        window.addEventListener('mousedown', e => {
            state.isDragging = true;
            state.lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', e => {
            if (!state.isDragging) return;
            
            const dx = e.clientX - state.lastMouse.x;
            const dy = e.clientY - state.lastMouse.y;
            
            state.tx += dx;
            state.ty += dy;
            
            state.lastMouse = { x: e.clientX, y: e.clientY };
            updateTransform();
        });

        window.addEventListener('mouseup', () => state.isDragging = false);

        window.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomSpeed = 1.1;
            const direction = e.deltaY < 0 ? zoomSpeed : 1 / zoomSpeed;
            
            // Zoom towards mouse cursor
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const worldX = (mouseX - state.tx) / state.scale;
            const worldY = (mouseY - state.ty) / state.scale;
            
            state.scale *= direction;
            
            state.tx = mouseX - worldX * state.scale;
            state.ty = mouseY - worldY * state.scale;
            
            updateTransform();
        }, { passive: false });

        // INVERSE PROJECTION ON CLICK
        window.addEventListener('click', e => {
            // 1. Convert screen pixels to projected map coordinates
            const projectedX = (e.clientX - state.tx) / state.scale;
            const projectedY = (e.clientY - state.ty) / state.scale;
            
            // 2. Inverse Projection: Map Coords -> Geographic Coords
            const coords = EE.inverse(projectedX, projectedY);
            
            // Update UI
            document.getElementById('coords').innerText = 
                `Lat: ${coords.lat.toFixed(4)}°, Lon: ${coords.lon.toFixed(4)}°`;
        });

        // Bootstrap
        initMap();
        // Add some default markers
        addMarker(40.7128, -74.0060); // NYC
        addMarker(51.5074, -0.1278);  // London
        addMarker(-33.8688, 151.2093); // Sydney

    </script>
</body>
</html>
