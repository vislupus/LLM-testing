<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Equal Earth Projection Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.1.2/svg.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        #map {
            background-color: #1a3a6c;
        }
        #info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            max-width: 300px;
        }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        #coordinates {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            min-width: 200px;
        }
        .btn {
            background: #4a6fa5;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin: 2px;
        }
        .btn:hover {
            background: #6a8fc7;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
        <div id="coordinates">Click on the map to see coordinates</div>
        <div id="info-panel">
            <strong>Equal Earth Projection</strong><br>
            Equal Earth is an equal-area pseudocylindrical projection for world maps that shows land features at their true relative sizes. [[25]]
        </div>
        <div id="controls">
            <button class="btn" id="zoom-in">Zoom In</button>
            <button class="btn" id="zoom-out">Zoom Out</button>
            <button class="btn" id="reset">Reset View</button>
            <div style="margin-top: 5px;">
                <input type="text" id="lat" placeholder="Latitude" style="width: 70px;">
                <input type="text" id="lng" placeholder="Longitude" style="width: 70px;">
                <button class="btn" id="go">Go</button>
            </div>
        </div>
    </div>

    <script>
        // Equal Earth projection implementation
        // Based on the mathematical formulas from the original research paper [[18]]
        class EqualEarthProjection {
            constructor() {
                // Constants from the Equal Earth projection paper
                this.A1 = 1.340264;
                this.A2 = -0.081106;
                this.A3 = 0.000893;
                this.A4 = 0.003706;
                this.B1 = 0.459697;
                this.B2 = 0.008521;
                this.B3 = 0.000436;
                this.B4 = 0.000079;
                this.C1 = 0.035421;
                this.C2 = 0.000164;
                this.C3 = 0.000001;
                this.D1 = 0.013288;
                this.D2 = 0.000134;
                this.D3 = 0.000001;
                this.E1 = 0.002822;
                this.E2 = 0.000032;
                this.F1 = 0.000373;
                this.F2 = 0.000003;
                this.G1 = 0.000015;
                this.G2 = 0.000001;
                this.K = 0.874257;
                this.K2 = 0.422238;
            }

            // Forward projection: lat, lng in degrees to x, y in projection space
            forward(lat, lng) {
                // Convert degrees to radians
                lat = lat * Math.PI / 180;
                lng = lng * Math.PI / 180;
                
                // Calculate the projection
                const sinLat = Math.sin(lat);
                const cosLat = Math.cos(lat);
                const sinLng = Math.sin(lng);
                const cosLng = Math.cos(lng);
                
                const y = this.K * lat;
                
                // Calculate the x coordinate
                const y2 = y * y;
                const y4 = y2 * y2;
                const y6 = y4 * y2;
                const y8 = y6 * y2;
                
                const x = (this.A1 * lng + 
                          this.A2 * lng * y2 + 
                          this.A3 * lng * y4 + 
                          this.A4 * lng * y6) * 
                         (1 - (this.B1 * y2 + 
                               this.B2 * y4 + 
                               this.B3 * y6 + 
                               this.B4 * y8));
                
                // Apply the correction for the x coordinate
                const xCorr = (this.C1 * lng * y2 + 
                              this.C2 * lng * y4 + 
                              this.C3 * lng * y6) * 
                             (1 - (this.D1 * y2 + 
                                   this.D2 * y4 + 
                                   this.D3 * y6));
                
                // Apply the correction for the y coordinate
                const yCorr = (this.E1 * y + 
                              this.E2 * y3 + 
                              this.F1 * y * y2 * y2 + 
                              this.F2 * y * y2 * y2 * y2 + 
                              this.G1 * y * y2 * y2 * y2 * y2 + 
                              this.G2 * y * y2 * y2 * y2 * y2 * y2);
                
                return {
                    x: (x + xCorr) * this.K2,
                    y: y + yCorr
                };
            }

            // Inverse projection: x, y in projection space to lat, lng in degrees
            inverse(x, y) {
                // Apply the inverse corrections
                const yCorr = (this.E1 * y + 
                              this.E2 * Math.pow(y, 3) + 
                              this.F1 * Math.pow(y, 5) + 
                              this.F2 * Math.pow(y, 7) + 
                              this.G1 * Math.pow(y, 9) + 
                              this.G2 * Math.pow(y, 11));
                
                const y0 = y - yCorr;
                
                // Calculate the latitude
                let lat = y0 / this.K;
                
                // Newton-Raphson iteration to solve for latitude
                for (let i = 0; i < 5; i++) {
                    const sinLat = Math.sin(lat);
                    const cosLat = Math.cos(lat);
                    
                    const f = lat - this.K * lat + 
                             this.B1 * this.K * Math.pow(lat, 3) + 
                             this.B2 * this.K * Math.pow(lat, 5) + 
                             this.B3 * this.K * Math.pow(lat, 7) + 
                             this.B4 * this.K * Math.pow(lat, 9);
                    
                    const fPrime = 1 - this.K + 
                                  3 * this.B1 * this.K * Math.pow(lat, 2) + 
                                  5 * this.B2 * this.K * Math.pow(lat, 4) + 
                                  7 * this.B3 * this.K * Math.pow(lat, 6) + 
                                  9 * this.B4 * this.K * Math.pow(lat, 8);
                    
                    lat = lat - f / fPrime;
                }
                
                // Calculate longitude
                const y2 = y0 * y0;
                const y4 = y2 * y2;
                const y6 = y4 * y2;
                
                const denom = 1 - (this.B1 * y2 + 
                                   this.B2 * y4 + 
                                   this.B3 * y6 + 
                                   this.B4 * Math.pow(y, 8));
                
                const lng = x / (this.A1 + 
                                this.A2 * y2 + 
                                this.A3 * y4 + 
                                this.A4 * y6) / denom;
                
                // Convert radians to degrees
                return {
                    lat: lat * 180 / Math.PI,
                    lng: lng * 180 / Math.PI
                };
            }
        }

        // Main application
        document.addEventListener('DOMContentLoaded', function() {
            // Create SVG
            const draw = SVG().addTo('#map').size('100%', '100%');
            
            // Initialize projection
            const projection = new EqualEarthProjection();
            
            // Map parameters
            const MAP_WIDTH = 1200;
            const MAP_HEIGHT = 600;
            const MAX_ZOOM = 8;
            const MIN_ZOOM = 0.1;
            
            // Current view state
            let currentZoom = 1;
            let panX = 0;
            let panY = 0;
            let lastX = 0;
            let lastY = 0;
            let isDragging = false;
            
            // Create map group for transformations
            const mapGroup = draw.group();
            
            // Draw the world map (simplified for demonstration)
            function drawWorldMap() {
                // In a real implementation, you would load detailed country boundaries
                // For this example, we'll draw a simple representation
                
                // Clear previous map
                mapGroup.clear();
                
                // Draw ocean background
                mapGroup.rect(MAP_WIDTH, MAP_HEIGHT).fill('#1a3a6c');
                
                // Draw continents (simplified)
                const continents = [
                    // North America
                    {path: "M 200 200 L 300 150 L 400 180 L 450 250 L 350 350 L 250 300 Z", fill: "#8b6c4d"},
                    // South America
                    {path: "M 300 350 L 350 400 L 300 500 L 200 450 Z", fill: "#8b6c4d"},
                    // Europe
                    {path: "M 500 200 L 550 180 L 600 200 L 620 250 L 580 300 L 520 280 Z", fill: "#8b6c4d"},
                    // Africa
                    {path: "M 650 250 L 700 300 L 680 400 L 620 450 L 580 400 L 590 300 Z", fill: "#8b6c4d"},
                    // Asia
                    {path: "M 750 200 L 850 150 L 900 250 L 880 350 L 800 400 L 700 350 Z", fill: "#8b6c4d"},
                    // Australia
                    {path: "M 850 450 L 900 480 L 880 520 L 830 500 Z", fill: "#8b6c4d"},
                    // Antarctica
                    {path: "M 400 550 L 550 580 L 700 550 L 650 500 L 450 500 Z", fill: "#e0e0e0"}
                ];
                
                continents.forEach(continent => {
                    mapGroup.path(continent.path).fill(continent.fill).stroke({color: '#000', width: 0.5});
                });
                
                // Add grid lines for reference
                for (let i = -180; i <= 180; i += 30) {
                    const point = projection.forward(0, i);
                    const x = (point.x * MAP_WIDTH / 2 + MAP_WIDTH / 2) * currentZoom + panX;
                    const y = (point.y * MAP_HEIGHT / 2 + MAP_HEIGHT / 2) * currentZoom + panY;
                    
                    mapGroup.line(0, 0, 0, MAP_HEIGHT).stroke({color: '#aaa', width: 0.5, dasharray: '2,2'}).move(x, 0);
                }
                
                for (let i = -90; i <= 90; i += 30) {
                    const point = projection.forward(i, 0);
                    const x = (point.x * MAP_WIDTH / 2 + MAP_WIDTH / 2) * currentZoom + panX;
                    const y = (point.y * MAP_HEIGHT / 2 + MAP_HEIGHT / 2) * currentZoom + panY;
                    
                    mapGroup.line(0, 0, MAP_WIDTH, 0).stroke({color: '#aaa', width: 0.5, dasharray: '2,2'}).move(0, y);
                }
            }
            
            // Update map view based on current zoom and pan
            function updateMapView() {
                mapGroup.transform({
                    scale: currentZoom,
                    x: panX,
                    y: panY
                });
            }
            
            // Project geographic coordinates to screen coordinates
            function projectToScreen(lat, lng) {
                const point = projection.forward(lat, lng);
                const x = (point.x * MAP_WIDTH / 2 + MAP_WIDTH / 2) * currentZoom + panX;
                const y = (point.y * MAP_HEIGHT / 2 + MAP_HEIGHT / 2) * currentZoom + panY;
                return {x, y};
            }
            
            // Convert screen coordinates to geographic coordinates
            function screenToGeographic(x, y) {
                // Adjust for zoom and pan
                const screenX = (x - panX) / currentZoom;
                const screenY = (y - panY) / currentZoom;
                
                // Convert to projection coordinates
                const projX = (screenX / MAP_WIDTH - 0.5) * 2;
                const projY = (screenY / MAP_HEIGHT - 0.5) * 2;
                
                // Convert to geographic coordinates
                return projection.inverse(projX, projY);
            }
            
            // Draw marker at geographic coordinates
            function drawMarker(lat, lng, color = '#ff0000', size = 5) {
                const {x, y} = projectToScreen(lat, lng);
                mapGroup.circle(size * 2).fill(color).cx(x).cy(y);
                mapGroup.circle(size * 2).fill('none').stroke({color: '#fff', width: 1}).cx(x).cy(y);
            }
            
            // Update coordinate display
            function updateCoordinates(lat, lng) {
                const coordinatesEl = document.getElementById('coordinates');
                coordinatesEl.innerHTML = `
                    <strong>Coordinates:</strong><br>
                    Latitude: ${lat.toFixed(4)}°<br>
                    Longitude: ${lng.toFixed(4)}°
                `;
            }
            
            // Event handlers
            function handleMouseWheel(e) {
                e.preventDefault();
                
                const delta = e.deltaY < 0 ? 1 : -1;
                const zoomFactor = 1.1;
                const newZoom = Math.min(Math.max(currentZoom * zoomFactor ** delta, MIN_ZOOM), MAX_ZOOM);
                
                // Calculate the point around which we're zooming
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                
                // Calculate the relative position of the mouse in the current view
                const relX = (mouseX - panX) / currentZoom;
                const relY = (mouseY - panY) / currentZoom;
                
                // Update the pan position to keep the same point under the mouse
                panX = mouseX - relX * newZoom;
                panY = mouseY - relY * newZoom;
                
                // Update zoom
                currentZoom = newZoom;
                updateMapView();
            }
            
            function handleMouseDown(e) {
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
                document.body.style.cursor = 'move';
            }
            
            function handleMouseUp() {
                isDragging = false;
                document.body.style.cursor = 'default';
            }
            
            function handleMouseMove(e) {
                if (!isDragging) return;
                
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                
                panX += dx;
                panY += dy;
                
                lastX = e.clientX;
                lastY = e.clientY;
                
                updateMapView();
            }
            
            function handleMapClick(e) {
                // Get the position relative to the SVG
                const rect = draw.node.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Convert to geographic coordinates
                const {lat, lng} = screenToGeographic(x, y);
                
                // Update display
                updateCoordinates(lat, lng);
                
                // Draw marker
                drawMarker(lat, lng);
            }
            
            // Button event handlers
            document.getElementById('zoom-in').addEventListener('click', () => {
                currentZoom = Math.min(currentZoom * 1.2, MAX_ZOOM);
                updateMapView();
            });
            
            document.getElementById('zoom-out').addEventListener('click', () => {
                currentZoom = Math.max(currentZoom / 1.2, MIN_ZOOM);
                updateMapView();
            });
            
            document.getElementById('reset').addEventListener('click', () => {
                currentZoom = 1;
                panX = 0;
                panY = 0;
                updateMapView();
                drawWorldMap();
            });
            
            document.getElementById('go').addEventListener('click', () => {
                const lat = parseFloat(document.getElementById('lat').value);
                const lng = parseFloat(document.getElementById('lng').value);
                
                if (!isNaN(lat) && !isNaN(lng)) {
                    // Draw marker at the specified coordinates
                    drawMarker(lat, lng);
                    
                    // Center the map on these coordinates
                    const {x, y} = projectToScreen(lat, lng);
                    panX = window.innerWidth / 2 - x;
                    panY = window.innerHeight / 2 - y;
                    updateMapView();
                    
                    // Update coordinates display
                    updateCoordinates(lat, lng);
                }
            });
            
            // Initialize
            drawWorldMap();
            updateMapView();
            
            // Set up event listeners
            draw.on('wheel', handleMouseWheel);
            draw.on('mousedown', handleMouseDown);
            document.addEventListener('mouseup', handleMouseUp);
            document.addEventListener('mousemove', handleMouseMove);
            draw.on('click', handleMapClick);
        });
    </script>
</body>
</html>
