<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equal Earth Interactive World Map</title>
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#080e18;color:#b0bcd0;font:13px/1.5 'Segoe UI',system-ui,-apple-system,sans-serif}
#app{display:flex;flex-direction:column;height:100vh}
#bar{background:rgba(8,14,24,.96);border-bottom:1px solid #162038;padding:7px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;z-index:20}
.title{font-size:13px;font-weight:700;color:#e0ecf8;letter-spacing:.3px;margin-right:4px}
.sdot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:3px;vertical-align:middle}
.sdot.on{background:#2ea043;box-shadow:0 0 6px #2ea04380}.sdot.off{background:#484f58}
.sp{color:#484f58;margin:0 3px}
.stat{color:#58a6ff}.stat2{color:#7ee787}.stat3{color:#ffa657}
#svg-wrap{flex:1;position:relative;overflow:hidden}
#msvg{width:100%;height:100%;display:block;cursor:crosshair}
#tip{position:absolute;background:rgba(8,14,24,.94);border:1px solid #22304a;border-radius:6px;padding:7px 11px;font:11px/1.6 'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;color:#a0b8d0;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30;white-space:nowrap;backdrop-filter:blur(6px)}
#tip .ll{color:#58a6ff;font-weight:600}
#tip .zz{color:#484f58;font-size:10px;margin-top:2px}
#pov{position:absolute;bottom:12px;left:12px;background:rgba(8,14,24,.94);border:1px solid #162038;border-radius:8px;padding:11px 15px;z-index:15;min-width:235px;backdrop-filter:blur(6px)}
#pov h3{font-size:10px;font-weight:700;color:#3e4756;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.ir{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.ir label{font-size:11px;color:#3e4756;width:24px;text-align:right}
.ir input[type=text]{width:82px;padding:3px 7px;background:#0e1420;border:1px solid #162038;border-radius:4px;color:#b0bcd0;font:11px/1.3 'SF Mono',Consolas,monospace;outline:none;transition:border-color .15s}
.ir input[type=text]:focus{border-color:#58a6ff}
.ir .err{border-color:#f85149}
#pov button{padding:3px 11px;background:#161d2a;border:1px solid #1e2d42;border-radius:4px;color:#7d8590;font-size:11px;cursor:pointer;margin-top:2px;transition:all .12s}
#pov button:hover{background:#1e2d42;color:#b0bcd0}
.mlbl{position:absolute;transform:translate(-50%,-160%);background:rgba(8,14,24,.92);border:1px solid #22304a;border-radius:4px;padding:2px 7px;font:10px/1.4 'SF Mono',Consolas,monospace;color:#ffa657;white-space:nowrap;pointer-events:none;z-index:10}
.leg{position:absolute;top:12px;right:12px;background:rgba(8,14,24,.94);border:1px solid #162038;border-radius:8px;padding:9px 13px;z-index:15;font-size:10px;backdrop-filter:blur(6px)}
.leg h4{color:#3e4756;font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;font-size:9px}
.lr{display:flex;align-items:center;margin-bottom:3px}
.lr .sw{width:18px;height:3px;margin-right:7px;border-radius:1px.5}
.lr span{color:#3e4756}
.marker-dot{pointer-events:none}
.marker-ring{pointer-events:none}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.08;transform:scale(2.2)}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="title">🌍 Equal Earth</span>
    <span class="sp">|</span>
    <span class="sdot on" id="ldot"></span>
    <span id="sLoad">Loading…</span>
    <span class="sp">|</span>
    <span>Zm <span class="stat" id="sZ">1.0</span>×</span>
    <span class="sp">|</span>
    <span><span class="stat2" id="sC">0</span> markers</span>
    <span class="sp">|</span>
    <span>Scroll zoom · Drag pan · Click mark</span>
  </div>
  <div id="svg-wrap">
    <div id="msvg"></div>
    <div id="tip"></div>
    <div id="pov">
      <h3>📍 Place Marker (Forward Projection)</h3>
      <div class="ir"><label>Lat</label><input type="text" id="iLat" placeholder="48.8566">
        <label style="width:28px">Lon</label><input type="text" id="iLon" placeholder="2.3522">
        <button onclick="uiPlace()">Go</button></div>
      <div style="font-size:10px;color:#2e3746;margin-top:4px">↑ type coords → <span class="stat2">forward projection</span> plots marker on map</div>
    </div>
    <div class="leg">
      <h4>Legend</h4>
      <div class="lr"><div class="sw" style="background:#1e2a3e"></div><span>Land</span></div>
      <div class="lr"><div class="sw" style="background:#0d1520"></div><span>Ocean</span></div>
      <div class="lr"><div class="sw" style="background:#162038"></div><span>Graticule</span></div>
      <div class="lr"><div class="sw" style="background:#ffa657"></div><span>Marker</span></div>
      <div style="margin-top:5px;border-top:1px solid #162038;padding-top:5px">
        <div class="lr"><span class="stat" style="font-size:10px;width:auto;margin-right:4px">x̄</span><span>Click → inverse proj → lat/lon</span></div>
        <div class="lr"><span class="stat2" style="font-size:10px;width:auto;margin-right:4px">→</span><span>Coords → forward proj → marker</span></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Equal Earth Interactive World Map
   Forward & Inverse Projection  ·  SVG.js  ·  GeoJSON
   ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* ── Equal Earth constants ──────────────────────────────────── */
const A1=1.340264, A2=-0.081106, A3=0.000893, A4=0.003796;
const SM=180/Math.PI, IM=Math.PI/180, R=6371007.2;
const THLIM=Math.PI/2-1e-5;

/* ── SVG.js ─────────────────────────────────────────────────── */
const VW=1200, VH=650;
const svg=SVG().addTo('#msvg').size('100%','100%')
  .viewbox(0,0,VW,VH).attr({preserveAspectRatio:'xMidYMid meet'});

const oceanG=svg.group(), gratG=svg.group(), landG=svg.group(), markG=svg.group();

/* ── State ──────────────────────────────────────────────────── */
let zoom=1, panX=0, panY=0, baseS=1;
let svgW=VW, svgH=VH, svgCX=VW/2, svgCY=VH/2;
let markers=[], geoD=null;

/* ═══════════════════════════════════════════════════════════════
   FORWARD PROJECTION  (lat, lon) → (x, y)  metres on globe
   ═══════════════════════════════════════════════════════════════ */
function fwdProj(lat,lon){
  const t=lat*IM;
  const s=Math.sin(t), c=Math.cos(t);
  const th=Math.asin(clamp(s*0.86602540378,-1,1));
  const st=Math.sin(th), ct=Math.cos(th);
  const ct3=ct*ct*ct;
  const den=A1+A2*3*st*st+A3*st*st*st*st*(7+ct*ct*ct3);
  return{
    x:R*lon*IM*ct*3/den,
    y:R*st*(A1+A2*st*st+A3*st*st*st*st)/den
  };
}

/* ═══════════════════════════════════════════════════════════════
   INVERSE PROJECTION  (x, y) → (lat, lon)  degrees
   ═══════════════════════════════════════════════════════════════ */
function invProj(x,y){
  const yR=y/R, xR=x/R;
  let th=Math.asin(clamp(yR/A1,-1,1));
  for(let i=0;i<15;i++){
    const st=Math.sin(th), ct=Math.cos(th);
    const st2=st*st, st4=st2*st2;
    const fp=A1+A2*9*st2+A3*st4*(25+14*ct*ct);
    const f=yR-st*(A1+A2*st2+A3*st4)-A4*st2*st4;
    th+=f/fp;
    if(Math.abs(f)<1e-12)break;
  }
  th=clamp(th,-THLIM,THLIM);
  const st=Math.sin(th), ct=Math.cos(th);
  const ct3=ct*ct*ct;
  const den=A1+A2*3*st*st+A3*st*st*st*st*(7+ct*ct*ct3);
  return{
    lat:clamp(th*SM,-90,90),
    lon:clamp(xR*den/(3*ct)*SM,-180,180)
  };
}

/* ═══════════════════════════════════════════════════════════════
   PROJECTED WORLD BOUNDS
   ═══════════════════════════════════════════════════════════════ */
const bounds=(function(){
  const e=fwdProj(0,180), p=fwdProj(85,0);
  return{w:e.x*2,h:p.y*2,cx:0,cy:0};
})();

/* ═══════════════════════════════════════════════════════════════
   COORDINATE TRANSFORMS
   ═══════════════════════════════════════════════════════════════ */
function calcBase(){baseS=Math.min(svgW/bounds.w,svgH/bounds.h)*.92}
function p2s(px,py){return{x:px*baseS*zoom+svgCX+panX,y:svgCY+panY-py*baseS*zoom}}
function s2p(sx,sy){return{x:(sx-svgCX-panX)/(baseS*zoom),y:(svgCY+panY-sy)/(baseS*zoom)}}
function geo2scr(lat,lon){const p=fwdProj(lat,lon);return p2s(p.x,p.y)}
function scr2geo(sx,sy){const p=s2p(sx,sy);return invProj(p.x,p.y)}
function clamp(v,a,b){return v<a?a:v>b?b:v}

/* ═══════════════════════════════════════════════════════════════
   ZOOM  (mouse-wheel keeps cursor point fixed)
   ═══════════════════════════════════════════════════════════════ */
function doZoom(sx,sy,factor){
  const px=(sx-svgCX-panX)/(baseS*zoom);
  const py=(svgCY+panY-sy)/(baseS*zoom);
  zoom=clamp(zoom*factor,.3,80);
  panX=sx-svgCX-px*baseS*zoom;
  panY=svgCY+panY-sy-py*baseS*zoom;
  svgCX=svgW/2; svgCY=svgH/2;
}

/* ═══════════════════════════════════════════════════════════════
   GRATICULE
   ═══════════════════════════════════════════════════════════════ */
function drawGrat(){
  gratG.clear();
  const inc=5, thresh=svgW*.28;

  // longitude lines
  for(let lon=-180;lon<=180;lon+=30){
    let d='';
    let prev=null;
    for(let lat=-90;lat<=90;lat+=inc){
      const s=geo2scr(lat,lon);
      if(!prev||Math.hypot(s.x-prev.x,s.y-prev.y)>thresh){d+='M'+rf(s.x)+','+rf(s.y);prev=s}
      else{d+='L'+rf(s.x)+','+rf(s.y);prev=s}
    }
    gratG.path(d).fill('none').stroke({color:'#162038',width:lon===0?1.2:.5,opacity:lon===0?.7:.5});
  }

  // latitude lines
  for(let lat=-60;lat<=60;lat+=30){
    let d='';
    let prev=null;
    for(let lon=-180;lon<=180;lon+=inc){
      const s=geo2scr(lat,lon);
      if(!prev||Math.hypot(s.x-prev.x,s.y-prev.y)>thresh){d+='M'+rf(s.x)+','+rf(s.y);prev=s}
      else{d+='L'+rf(s.x)+','+rf(s.y);prev=s}
    }
    const dashed=lat===0?{color:'#1e3050',width:1,opacity:.6}:{color:'#162038',width:.5,opacity:.45};
    const p=gratG.path(d).fill('none').stroke(dashed);
    if(lat===0)p.stroke({dasharray:'6 3'});
  }

  // pole labels
  [85,-85].forEach(la=>{
    const s=geo2scr(la,0);
    const cl=la>0?'#1e3050':'#1e3050';
    gratG.text(la>0?'85°N':'85°S').font({size:8,fill:cl,anchor:'middle',family:'system-ui'}).move(s.x,s.y+(la>0?8:-14)).opacity(.4);
  });

  // equator label
  const eq=geo2scr(0,175);
  gratG.text('0° Equator').font({size:8,fill:'#1e3050',anchor:'end',family:'system-ui'}).move(eq.x-4,eq.y-10).opacity(.4);
}

/* ═══════════════════════════════════════════════════════════════
   GEOJSON → SVG PATH
   ═══════════════════════════════════════════════════════════════ */
function g2d(coords){
  const thresh=svgW*.35;
  let d='',prev=null;
  for(let i=0;i<coords.length;i++){
    const s=geo2scr(coords[i][1],coords[i][0]);
    if(s.x<-500||s.x>VW+500||s.y<-500||s.y>VH+500){
      if(prev&&Math.hypot(s.x-prev.x,s.y-prev.y)>thresh){d+='M'+rf(s.x)+','+rf(s.y)}
      else{d+=(i?'L':'M')+rf(s.x)+','+rf(s.y)}
      prev=s;continue;
    }
    if(!prev||Math.hypot(s.x-prev.x,s.y-prev.y)>thresh){d+='M'+rf(s.x)+','+rf(s.y)}
    else{d+='L'+rf(s.x)+','+rf(s.y)}
    prev=s;
  }
  return d+'Z';
}

function gPaths(g){
  if(!g)return'';
  switch(g.type){
    case'Polygon':return g.coordinates.map(r=>g2d(r)).join('');
    case'MultiPolygon':return g.coordinates.map(p=>p.map(r=>g2d(r)).join('')).join('');
    case'GeometryCollection':return(g.geometries||[]).map(gPaths).join('');
  }
  return'';
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
function renderMap(){
  landG.clear(); gratG.clear();
  if(!geoD)return;
  const feats=geoD.type==='FeatureCollection'?geoD.features:[geoD];
  feats.forEach(f=>{
    const d=gPaths(f.geometry||f);
    if(d)landG.path(d).fill('#1e2a3e').stroke({color:'#3a506b',width:.6});
  });
  drawGrat();
  renderMarkers();
  updStatus();
}

/* ── Markers ────────────────────────────────────────────────── */
function placeMarker(lat,lon,label){
  markers.push({lat,lon,label:label||mkLabel(lat,lon)});
  renderMarkers(); updStatus();
}
function renderMarkers(){
  markG.clear();
  document.querySelectorAll('.mlbl').forEach(e=>e.remove());
  markers.forEach((m,i)=>{
    const s=geo2scr(m.lat,m.lon);
    const r=Math.max(3.5,5*zoom**.25);
    markG.circle(r*3.5).center(s.x,s.y).fill({color:'#ffa657',opacity:.1}).addClass('marker-ring');
    markG.circle(r).center(s.x,s.y).fill('#ffa657').stroke({color:'#fff',width:.7,opacity:.55}).addClass('marker-dot');
    const wrap=document.getElementById('svg-wrap');
    const lbl=document.createElement('div');
    lbl.className='mlbl'; lbl.textContent=m.label; lbl.id='ml'+i;
    lbl.style.left=s.x+'px'; lbl.style.top=s.y+'px';
    wrap.appendChild(lbl);
  });
}
function clearMarkers(){markers=[];renderMarkers();updStatus()}
function rmNearest(sx,sy){
  if(!markers.length)return;
  let best=-1,bd=Infinity;
  markers.forEach((m,i)=>{const s=geo2scr(m.lat,m.lon);const d=Math.hypot(s.x-sx,s.y-sy);if(d<bd){bd=d;best=i}});
  if(best>=0&&bd<25){markers.splice(best,1);renderMarkers();updStatus()}
}
function mkLabel(lat,lon){return(lat>=0?lat.toFixed(1)+'°N':(-lat).toFixed(1)+'°S')+' '+(lon>=0?lon.toFixed(1)+'°E':(-lon).toFixed(1)+'°W')}

/* ── Status bar ─────────────────────────────────────────────── */
function updStatus(){
  document.getElementById('sZ').textContent=zoom.toFixed(1);
  document.getElementById('sC').textContent=markers.length;
}

/* ── HUD ────────────────────────────────────────────────────── */
function showTip(sx,sy,lat,lon){
  const tip=document.getElementById('tip');
  const wrap=document.getElementById('svg-wrap');
  const wr=wrap.getBoundingClientRect();
  tip.innerHTML='<div class="ll">'+mkLabel(lat,lon)+'</div><div>'+lat.toFixed(4)+', '+lon.toFixed(4)+'</div><div class="zz">zoom '+zoom.toFixed(1)+'×</div>';
  tip.style.opacity='1';
  tip.style.left=Math.min(sx+14,wr.width-200)+'px';
  tip.style.top=Math.max(sy-62,4)+'px';
}
function hideTip(){document.getElementById('tip').style.opacity='0'}

/* ═══════════════════════════════════════════════════════════════
   INTERACTION
   ═══════════════════════════════════════════════════════════════ */
let dragging=false, dsx=0, dsy=0, dpx=0, dpy=0, didDrag=false;

function scrXY(e){
  const r=document.getElementById('msvg').getBoundingClientRect();
  return{x:(e.clientX-r.left)*(VW/r.width),y:(e.clientY-r.top)*(VH/r.height)};
}

// wheel zoom
let wTimer=0;
document.getElementById('msvg').addEventListener('wheel',function(e){
  e.preventDefault();
  const now=Date.now(); if(now-wTimer<16)return; wTimer=now;
  const s=scrXY(e);
  doZoom(s.x,s.y,e.deltaY<0?1.12:.89);
  renderMap();
  const ll=scr2geo(s.x,s.y);
  showTip(s.x,s.y,ll.lat,ll.lon);
},{passive:false});

// drag pan + click marker
document.getElementById('msvg').addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  dragging=true; didDrag=false;
  const s=scrXY(e); dsx=s.x; dsy=s.y; dpx=panX; dpy=panY;
  hideTip();
});
document.addEventListener('mousemove',function(e){
  const s=scrXY(e);
  if(dragging){
    const dx=s.x-dsx, dy=s.y-dsy;
    if(Math.abs(dx)+Math.abs(dy)>2)didDrag=true;
    panX=dpx+dx; panY=dpy+dy;
    renderMap();
  }
  if(!dragging||!didDrag){
    const ll=scr2geo(s.x,s.y);
    if(Math.abs(ll.lat)<=90&&Math.abs(ll.lon)<=180)showTip(s.x,s.y,ll.lat,ll.lon);
    else hideTip();
  }
});
document.addEventListener('mouseup',function(e){
  if(!dragging)return;
  if(!didDrag){
    const s=scrXY(e);
    if(e.shiftKey){rmNearest(s.x,s.y)}
    else{const ll=scr2geo(s.x,s.y);if(Math.abs(ll.lat)<=90)placeMarker(ll.lat,ll.lon)}
  }
  dragging=false; didDrag=false;
});

// touch
let lastTD=0;
document.getElementById('msvg').addEventListener('touchstart',function(e){
  if(e.touches.length===1){
    dragging=true;didDrag=false;
    const t=e.touches[0],s=scrXY(t);dsx=s.x;dsy=s.y;dpx=panX;dpy=panY;
  }
  if(e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    lastTD=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  }
},{passive:true});
document.getElementById('msvg').addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===1&&dragging){
    const t=e.touches[0],s=scrXY(t);
    const dx=s.x-dsx,dy=s.y-dsy;
    if(Math.abs(dx)+Math.abs(dy)>3)didDrag=true;
    panX=dpx+dx;panY=dpy+dy;renderMap();
  }
  if(e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(lastTD>0){
      const r=document.getElementById('msvg').getBoundingClientRect();
      const cx=((a.clientX+b.clientX)/2-r.left)*(VW/r.width);
      const cy=((a.clientY+b.clientY)/2-r.top)*(VH/r.height);
      doZoom(cx,cy,d/lastTD);renderMap();
    }
    lastTD=d;
  }
},{passive:false});
document.getElementById('msvg').addEventListener('touchend',function(e){
  if(!didDrag&&e.changedTouches.length===1){
    const t=e.changedTouches[0],s=scrXY(t);
    const ll=scr2geo(s.x,s.y);
    if(Math.abs(ll.lat)<=90)placeMarker(ll.lat,ll.lon);
  }
  dragging=false;didDrag=false;lastTD=0;
});

// keyboard
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  const st=12;
  switch(e.key){
    case'+':case'=':doZoom(svgW/2,svgH/2,1.25);renderMap();break;
    case'-':case'_':doZoom(svgW/2,svgH/2,.8);renderMap();break;
    case'ArrowLeft':panX+=st;renderMap();break;
    case'ArrowRight':panX-=st;renderMap();break;
    case'ArrowUp':panY+=st;renderMap();break;
    case'ArrowDown':panY-=st;renderMap();break;
    case'r':case'R':zoom=1;panX=0;panY=0;renderMap();break;
    case'c':case'C':clearMarkers();break;
  }
});

/* ═══════════════════════════════════════════════════════════════
   RESIZE
   ═══════════════════════════════════════════════════════════════ */
function onResize(){
  const r=document.getElementById('msvg').getBoundingClientRect();
  svgW=r.width||VW; svgH=r.height||VH;
  svgCX=svgW/2; svgCY=svgH/2;
  calcBase();
}
window.addEventListener('resize',()=>{onResize();if(geoD)renderMap()});

/* ═══════════════════════════════════════════════════════════════
   UI HELPERS
   ═══════════════════════════════════════════════════════════════ */
window.uiPlace=function(){
  const li=document.getElementById('iLat'), lo=document.getElementById('iLon');
  const lat=parseFloat(li.value), lon=parseFloat(lo.value);
  li.classList.remove('err'); lo.classList.remove('err');
  if(isNaN(lat)||lat<-90||lat>90){li.classList.add('err');return}
  if(isNaN(lon)||lon<-180||lon>180){lo.classList.add('err');return}
  placeMarker(lat,lon);
  // brief highlight
  const s=geo2scr(lat,lon);
  const flash=markG.circle(30).center(s.x,s.y).fill('none').stroke({color:'#ffa657',width:2,opacity:.8});
  flash.animate(400).attr({r:60,opacity:0}).after(()=>flash.remove());
};

/* ═══════════════════════════════════════════════════════════════
   LOAD GEOJSON & INIT
   ═══════════════════════════════════════════════════════════════ */
function rf(n){return Math.round(n*100)/100}

(async function(){
  // ocean
  oceanG.rect(VW*2,VH*2).move(-VW/2,-VH/2).fill('#0d1520');
  // loading text
  const lt=svg.text('Loading world map…').font({size:16,fill:'#3e4756',anchor:'middle',family:'system-ui'}).move(VW/2,VH/2);

  calcBase(); onResize();

  const urls=[
    'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
    'https://unpkg.com/world-atlas@2/countries-110m.json',
    'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson'
  ];

  let data=null;
  for(const url of urls){
    try{
      const r=await fetch(url);
      if(!r.ok)continue;
      data=await r.json();
      break;
    }catch(e){continue}
  }

  lt.remove();

  if(data){
    // world-atlas uses TopoJSON → convert if needed
    if(data.type==='Topology'){
      // minimal TopoJSON → GeoJSON
      const key=Object.keys(data.objects)[0];
      const obj=data.objects[key];
      // We need topojson-client; let's try a simpler approach
      // Load from the other source if this was TopoJSON
      try{
        const r2=await fetch(urls[2]);
        if(r2.ok) data=await r2.json();
      }catch(e){}
    }
    geoD=data;
    document.getElementById('sLoad').textContent=data.type==='FeatureCollection'
      ?(data.features?data.features.length+' countries':'Map loaded')
      :'Map loaded';
    document.getElementById('ldot').className='sdot on';
    renderMap();

    // Default markers — notable locations
    placeMarker(48.8566,2.3522,'Paris');
    placeMarker(40.7128,-74.0060,'New York');
    placeMarker(-33.8688,151.2093,'Sydney');
    placeMarker(35.6762,139.6503,'Tokyo');
  }else{
    document.getElementById('sLoad').textContent='Map load failed';
    document.getElementById('ldot').className='sdot off';
    // Fallback: draw a simple sphere outline
    const outline=svg.ellipse().attr({cx:VW/2,cy:VH/2}).fill('none').stroke({color:'#1e2a3e',width:1});
    // Size it to the projected bounds
    const sw=bounds.w*baseS, sh=bounds.h*baseS;
    outline.attr({rx:sw/2,ry:sh/2});
    const msg=svg.text('Could not load GeoJSON.\nPlace markers manually via the input panel.')
      .font({size:13,fill:'#3e4756',anchor:'middle',family:'system-ui'}).move(VW/2,VH/2+40);
    drawGrat();
  }
})();

})();
</script>
</body>
</html>
