<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Equal Earth Interactive Map</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.1.2/svg.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }
    #map-container {
      width: 100vw;
      height: 50vw;
      background: #e6f3ff;
    }
    #coords {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: monospace;
      pointer-events: none;
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="map-container"></div>
  <div id="coords">Click on the map to see coordinates</div>
  <div id="controls">
    <strong>Controls:</strong><br>
    Scroll: Zoom in/out<br>
    Drag: Pan<br>
    Click: Show coordinates
  </div>

  <script>
    // ==================== PROJECTION FUNCTIONS ====================
    function project(lat, lon, zoom, panU, panV, width, height) {
      // Convert to radians
      const latRad = lat * Math.PI / 180;
      const lonRad = lon * Math.PI / 180;

      // Compute y_proj (transformed latitude)
      const yProj = Math.asin((Math.sqrt(3)/2) * Math.sin(latRad));

      // Compute distortion factor k
      const sinLat = Math.sin(latRad);
      const sinLatSq = sinLat * sinLat;
      const k = Math.cos(latRad) / Math.sqrt(1 - (3/4) * sinLatSq);

      // Projected coordinates
      const xProj = lonRad * k;
      const yScaled = yProj * 1.5; // Scale y by 3/2 for 2:1 aspect ratio

      // Normalize to [-1,1] range
      let u = xProj / Math.PI;
      let v = (yScaled + Math.PI/2) / Math.PI;

      // Apply zoom and pan
      u = (u / zoom) + panU;
      v = (v / zoom) + panV;

      // Convert to screen coordinates (SVG y increases downward)
      const x = (u + 1) * (width / 2);
      const y = (1 - v) * height;

      return { x, y };
    }

    function unproject(x, y, zoom, panU, panV, width, height) {
      // Convert screen to normalized coordinates before zoom/pan
      let u = (x / (width / 2)) - 1;
      let v = 1 - (y / height);

      // Apply inverse zoom and pan
      u = (u - panU) * zoom;
      v = (v - panV) * zoom;

      // Convert to projected coordinates
      const xProj = u * Math.PI;
      const yScaled = (v - 0.5) * Math.PI;
      const yProj = yScaled / 1.5;

      // Compute latitude
      let latRad;
      if (Math.abs(yProj) > Math.PI/3) {
        // Handle edge cases (shouldn't happen with valid input)
        latRad = yProj > 0 ? Math.PI/2 : -Math.PI/2;
      } else {
        latRad = Math.asin((2 / Math.sqrt(3)) * Math.sin(yProj));
      }

      // Compute longitude
      const sinLat = Math.sin(latRad);
      const sinLatSq = sinLat * sinLat;
      const k = Math.cos(latRad) / Math.sqrt(1 - (3/4) * sinLatSq);
      const lonRad = k !== 0 ? xProj / k : 0;

      // Convert to degrees
      const lat = latRad * 180 / Math.PI;
      const lon = lonRad * 180 / Math.PI;

      return { lat, lon };
    }

    // ==================== WORLD MAP DATA ====================
    // Simplified world outline in geographic coordinates (lat, lon in degrees)
    const worldPoints = [
      // North Pole
      { lat: 90, lon: 0 },

      // North America
      { lat: 80, lon: -180 },
      { lat: 60, lon: -180 },
      { lat: 60, lon: -140 },
      { lat: 40, lon: -140 },
      { lat: 40, lon: -100 },
      { lat: 20, lon: -100 },
      { lat: 20, lon: -60 },

      // South America
      { lat: 20, lon: -60 },
      { lat: -20, lon: -60 },
      { lat: -20, lon: -20 },
      { lat: -60, lon: -20 },

      // Africa
      { lat: -60, lon: -20 },
      { lat: -60, lon: 20 },
      { lat: -20, lon: 20 },
      { lat: -20, lon: 60 },
      { lat: 20, lon: 60 },
      { lat: 20, lon: 100 },

      // Asia
      { lat: 20, lon: 100 },
      { lat: 40, lon: 100 },
      { lat: 40, lon: 140 },
      { lat: 60, lon: 140 },
      { lat: 60, lon: 180 },

      // Australia
      { lat: 60, lon: 180 },
      { lat: -20, lon: 180 },
      { lat: -20, lon: 140 },
      { lat: -60, lon: 140 },
      { lat: -60, lon: 100 },
      { lat: -20, lon: 100 },

      // Back to North Pole via Europe
      { lat: -20, lon: 100 },
      { lat: 20, lon: 100 },
      { lat: 40, lon: 60 },
      { lat: 60, lon: 20 },
      { lat: 80, lon: -20 },
      { lat: 80, lon: -180 },
      { lat: 90, lon: 0 }
    ];

    // More detailed coastline points (simplified)
    const coastlinePoints = [
      // Atlantic coastline
      { lat: 60, lon: -70 },
      { lat: 50, lon: -50 },
      { lat: 40, lon: -30 },
      { lat: 30, lon: -10 },
      { lat: 20, lon: 0 },
      { lat: 10, lon: 10 },
      { lat: 0, lon: 20 },

      // Indian Ocean
      { lat: 0, lon: 60 },
      { lat: -10, lon: 80 },
      { lat: -20, lon: 100 },
      { lat: -30, lon: 120 },

      // Pacific
      { lat: -30, lon: 140 },
      { lat: -20, lon: 160 },
      { lat: 0, lon: 180 },
      { lat: 10, lon: -160 },
      { lat: 20, lon: -140 },
      { lat: 30, lon: -120 },
      { lat: 40, lon: -100 },
      { lat: 50, lon: -80 },
      { lat: 60, lon: -70 }
    ];

    // ==================== MAIN APPLICATION ====================
    document.addEventListener('DOMContentLoaded', function() {
      // SVG container setup
      const container = document.getElementById('map-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      // Create SVG
      const draw = SVG().addTo('#map-container').size(width, height);

      // State variables
      let currentZoom = 1.0;
      let currentPan = { u: 0, v: 0 };
      let isDragging = false;
      let lastX, lastY;
      let markers = [];

      // DOM elements
      const coordsDisplay = document.getElementById('coords');

      // ==================== DRAWING FUNCTIONS ====================
      function clearMarkers() {
        markers.forEach(marker => marker.remove());
        markers = [];
      }

      function drawWorld() {
        // Clear previous elements
        draw.clear();
        clearMarkers();

        // Draw world outline
        const worldPath = draw.path('');
        worldPoints.forEach((point, i) => {
          const { x, y } = project(point.lat, point.lon, currentZoom, currentPan.u, currentPan.v, width, height);
          if (i === 0) {
            worldPath.M(x, y);
          } else {
            worldPath.L(x, y);
          }
        });
        worldPath.Z().fill('#d4e6f1').stroke({ width: 1, color: '#000' });

        // Draw coastline
        const coastPath = draw.path('');
        coastlinePoints.forEach((point, i) => {
          const { x, y } = project(point.lat, point.lon, currentZoom, currentPan.u, currentPan.v, width, height);
          if (i === 0) {
            coastPath.M(x, y);
          } else {
            coastPath.L(x, y);
          }
        });
        coastPath.stroke({ width: 1, color: '#000', opacity: 0.5 });

        // Draw equator
        const equatorPath = draw.path('');
        for (let lon = -180; lon <= 180; lon += 10) {
          const { x, y } = project(0, lon, currentZoom, currentPan.u, currentPan.v, width, height);
          if (lon === -180) {
            equatorPath.M(x, y);
          } else {
            equatorPath.L(x, y);
          }
        }
        equatorPath.stroke({ width: 1, color: '#ff0000', dasharray: '5,5' });

        // Draw prime meridian
        const primePath = draw.path('');
        for (let lat = -90; lat <= 90; lat += 10) {
          const { x, y } = project(lat, 0, currentZoom, currentPan.u, currentPan.v, width, height);
          if (lat === -90) {
            primePath.M(x, y);
          } else {
            primePath.L(x, y);
          }
        }
        primePath.stroke({ width: 1, color: '#0000ff', dasharray: '5,5' });

        // Draw a marker at (0,0)
        const zeroPoint = project(0, 0, currentZoom, currentPan.u, currentPan.v, width, height);
        const marker = draw.circle(8).move(zeroPoint.x - 4, zeroPoint.y - 4)
          .fill('#ff0000').stroke({ width: 1, color: '#fff' });
        markers.push(marker);
      }

      function addMarker(lat, lon, color = '#ff0000') {
        const { x, y } = project(lat, lon, currentZoom, currentPan.u, currentPan.v, width, height);
        const marker = draw.circle(6).move(x - 3, y - 3)
          .fill(color).stroke({ width: 1, color: '#fff' });
        markers.push(marker);
        return marker;
      }

      // ==================== EVENT HANDLERS ====================
      function handleWheel(e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1; // Zoom out or in
        const newZoom = Math.max(0.1, Math.min(10, currentZoom * delta));

        // Get mouse position in screen coordinates
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Convert to normalized coordinates before zoom
        const u = (x / (width / 2)) - 1;
        const v = 1 - (y / height);

        // Calculate relative position to pan
        const uRel = u - currentPan.u;
        const vRel = v - currentPan.v;

        // Apply zoom to relative position
        const uRelNew = uRel * (newZoom / currentZoom);
        const vRelNew = vRel * (newZoom / currentZoom);

        // Update pan to keep the point under the mouse
        currentPan.u = u - uRelNew;
        currentPan.v = v - vRelNew;

        currentZoom = newZoom;
        drawWorld();
      }

      function handleMouseDown(e) {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        container.style.cursor = 'grabbing';
      }

      function handleMouseMove(e) {
        if (!isDragging) return;
        e.preventDefault();

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;

        // Convert to normalized coordinates
        const du = dx / (width / 2);
        const dv = -dy / height; // Invert y because screen y increases downward

        // Update pan (in normalized coordinates)
        currentPan.u -= du / currentZoom;
        currentPan.v -= dv / currentZoom;

        lastX = e.clientX;
        lastY = e.clientY;
        drawWorld();
      }

      function handleMouseUp() {
        isDragging = false;
        container.style.cursor = 'grab';
      }

      function handleClick(e) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const { lat, lon } = unproject(x, y, currentZoom, currentPan.u, currentPan.v, width, height);
        coordsDisplay.textContent = `Lat: ${lat.toFixed(4)}°, Lon: ${lon.toFixed(4)}°`;

        // Add a temporary marker
        addMarker(lat, lon, '#00ff00');
      }

      function handleResize() {
        const newWidth = container.clientWidth;
        const newHeight = container.clientHeight;

        if (newWidth !== width || newHeight !== height) {
          width = newWidth;
          height = newHeight;
          draw.size(width, height);
          drawWorld();
        }
      }

      // ==================== INITIALIZATION ====================
      // Initial draw
      drawWorld();

      // Add a few example markers
      addMarker(40.7128, -74.0060, '#00ff00'); // New York
      addMarker(51.5074, -0.1278, '#00ff00');   // London
      addMarker(35.6762, 139.6503, '#00ff00'); // Tokyo

      // Event listeners
      container.addEventListener('wheel', handleWheel, { passive: false });
      container.addEventListener('mousedown', handleMouseDown);
      container.addEventListener('mousemove', handleMouseMove);
      container.addEventListener('mouseup', handleMouseUp);
      container.addEventListener('mouseleave', handleMouseUp);
      container.addEventListener('click', handleClick);
      container.style.cursor = 'grab';

      // Handle window resize
      window.addEventListener('resize', handleResize);
    });
  </script>
</body>
</html>
