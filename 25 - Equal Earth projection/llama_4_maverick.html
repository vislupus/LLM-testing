<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Equal Earth Projection Map</title>
  <style>
    body {
      margin: 0;
      background-color: #f0f0f0;
    }
    #map {
      width: 800px;
      height: 600px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0.13/dist/svg.min.js"></script>
  <script>
    // Set up the SVG canvas
    const map = SVG().addTo('#map').size('100%', '100%');

    // Define the Equal Earth projection
    function equalEarthProjection(lon, lat) {
      const deg2rad = Math.PI / 180;
      lon *= deg2rad;
      lat *= deg2rad;
      const A1 = 1.340264;
      const A2 = -0.081106;
      const A3 = 0.000893;
      const A4 = 0.003796;
      const sqrt3 = Math.sqrt(3);
      const theta = Math.asin(Math.sqrt(3) / 2 * Math.sin(lat));
      const x = 2 * sqrt3 * (lon - Math.PI / 2) * Math.cos(theta) / (sqrt3 + 2 * Math.cos(2 * theta));
      const y = sqrt3 * Math.sin(theta) * (A1 + A2 * Math.pow(theta, 2) + A3 * Math.pow(theta, 6) + A4 * Math.pow(theta, 8));
      return [x, y];
    }

    // Inverse Equal Earth projection
    function inverseEqualEarthProjection(x, y) {
      const sqrt3 = Math.sqrt(3);
      const A1 = 1.340264;
      const A2 = -0.081106;
      const A3 = 0.000893;
      const A4 = 0.003796;
      let theta = y / sqrt3 / A1;
      for (let i = 0; i < 10; i++) {
        const f = sqrt3 * Math.sin(theta) * (A1 + A2 * Math.pow(theta, 2) + A3 * Math.pow(theta, 6) + A4 * Math.pow(theta, 8)) - y;
        const df = sqrt3 * Math.cos(theta) * (A1 + 3 * A2 * Math.pow(theta, 2) + 7 * A3 * Math.pow(theta, 6) + 15 * A4 * Math.pow(theta, 8));
        theta -= f / df;
      }
      const lat = Math.asin(Math.sin(theta) / (sqrt3 / 2));
      const lon = x / (2 * sqrt3 * Math.cos(theta) / (sqrt3 + 2 * Math.cos(2 * theta))) + Math.PI / 2;
      return [lon * 180 / Math.PI, lat * 180 / Math.PI];
    }

    // Draw the world map
    const worldMap = map.group();
    worldMap.path('M-180,90 L180,90 L180,-90 L-180,-90 Z').fill('#add8e6'); // ocean
    // Simplified world map for demonstration
    worldMap.path('M-120,0 L-100,0 L-100,-20 L-120,-20 Z').fill('#228B22'); // simplified landmass
    worldMap.path('M100,0 L120,0 L120,-20 L100,-20 Z').fill('#228B22'); // simplified landmass

    // Zoom and pan handling
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    map.on('wheel', (e) => {
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      zoom += delta;
      if (zoom < 0.1) zoom = 0.1;
      worldMap.transform({ scale: zoom, translateX: panX, translateY: panY });
    });
    map.on('mousedown', (e) => {
      const startX = e.clientX;
      const startY = e.clientY;
      const startPanX = panX;
      const startPanY = panY;
      const handleDrag = (e) => {
        panX = startPanX + (e.clientX - startX);
        panY = startPanY + (e.clientY - startY);
        worldMap.transform({ scale: zoom, translateX: panX, translateY: panY });
      };
      const handleUp = () => {
        document.removeEventListener('mousemove', handleDrag);
        document.removeEventListener('mouseup', handleUp);
      };
      document.addEventListener('mousemove', handleDrag);
      document.addEventListener('mouseup', handleUp);
    });

    // Forward projection: plot a marker
    function plotMarker(lon, lat) {
      const [x, y] = equalEarthProjection(lon, lat);
      const marker = map.circle(5).fill('#ff0000').center(x * zoom + panX, -y * zoom + panY);
      worldMap.add(marker);
    }
    plotMarker(0, 0); // Example marker at (0, 0)

    // Inverse projection: display coordinates on click
    map.on('click', (e) => {
      const rect = map.node.getBoundingClientRect();
      const x = (e.clientX - rect.left - panX) / zoom;
      const y = -(e.clientY - rect.top - panY) / zoom;
      const [lon, lat] = inverseEqualEarthProjection(x, y);
      console.log(`Latitude: ${lat.toFixed(2)}, Longitude: ${lon.toFixed(2)}`);
      // You can display the coordinates in an overlay instead of logging to console
    });
  </script>
</body>
</html>
