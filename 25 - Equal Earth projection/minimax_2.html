<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equal Earth Projection - Interactive World Map</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>
    <style>
        #map-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
        }
        #map-container:active {
            cursor: grabbing;
        }
        .coordinate-overlay {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }
        .graticule-line {
            stroke: rgba(148, 163, 184, 0.3);
            stroke-width: 0.5;
            fill: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden">
    <div id="map-container"></div>
    
    <!-- Control Panel -->
    <div class="fixed top-4 left-4 coordinate-overlay rounded-lg p-4 shadow-xl max-w-xs">
        <h2 class="text-lg font-bold text-blue-400 mb-2">Equal Earth Projection</h2>
        <p class="text-xs text-gray-400 mb-3">Zoom: Scroll | Pan: Drag</p>
        
        <!-- Forward Projection Input -->
        <div class="mb-4">
            <h3 class="text-sm font-semibold text-green-400 mb-2">Forward: Lat/Lon → Map</h3>
            <div class="flex gap-2 mb-2">
                <div class="flex-1">
                    <label class="text-xs text-gray-400">Latitude</label>
                    <input type="number" id="input-lat" value="40" step="0.1" 
                        class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm text-white">
                </div>
                <div class="flex-1">
                    <label class="text-xs text-gray-400">Longitude</label>
                    <input type="number" id="input-lon" value="-74" step="0.1"
                        class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm text-white">
                </div>
            </div>
            <button id="btn-project" class="w-full bg-green-600 hover:bg-green-700 text-white text-sm py-1.5 rounded transition">
                Plot Coordinates
            </button>
        </div>
        
        <!-- Click Result -->
        <div class="mb-4">
            <h3 class="text-sm font-semibold text-yellow-400 mb-2">Inverse: Click Result</h3>
            <div class="bg-gray-800 rounded p-2 text-xs font-mono">
                <div class="flex justify-between mb-1">
                    <span class="text-gray-400">Lat:</span>
                    <span id="click-lat" class="text-yellow-300">—</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Lon:</span>
                    <span id="click-lon" class="text-yellow-300">—</span>
                </div>
            </div>
        </div>
        
        <!-- Info -->
        <div class="text-xs text-gray-500">
            <div class="flex justify-between">
                <span>Zoom:</span>
                <span id="zoom-level">1.00x</span>
            </div>
            <div class="flex justify-between">
                <span>Markers:</span>
                <span id="marker-count">0</span>
            </div>
        </div>
    </div>

    <!-- Instructions overlay that disappears -->
    <div id="instructions" class="fixed bottom-4 right-4 coordinate-overlay rounded-lg p-3 text-sm max-w-xs">
        <p class="text-blue-300">Click anywhere on the map to see coordinates (Inverse projection)</p>
        <p class="text-green-300 mt-1">Use the panel to plot coordinates (Forward projection)</p>
    </div>

    <script>
        // =====================================================
        // EQUAL EARTH PROJECTION IMPLEMENTATION
        // Based on: https://proj.org/en/9.3/operations/projections/eqearth.html
        // Using spherical approximation for simplicity and accuracy
        // =====================================================
        
        // Earth radius (meters) - using mean radius
        const R = 6371000;
        
        // Polynomial coefficients for Equal Earth projection (on sphere)
        const A1 = 1.340264;
        const A2 = -0.081106;
        const A3 = 0.000893;
        const A4 = 0.003796;
        
        // Scale factor to fit map in viewport
        let SCALE = 150; // pixels per radian at zoom 1
        let mapWidth, mapHeight;
        
        // =====================================================
        // FORWARD PROJECTION: Lat/Lon → x,y (Equal Earth)
        // Using polynomial approximation on a sphere
        // =====================================================
        function forwardProjection(latDeg, lonDeg) {
            // Convert to radians
            const latRad = latDeg * Math.PI / 180;
            const lonRad = lonDeg * Math.PI / 180;
            
            // For Equal Earth on a sphere:
            // β (beta) = arcsin(sin(φ)) = φ (for sphere, authalic latitude = geodetic latitude)
            const beta = latRad;
            
            // Solve for θ using iterative method
            // θ = β + β³*A2 + β⁷*A3 + β⁹*A4
            let theta = beta;
            const maxIter = 20;
            for (let i = 0; i < maxIter; i++) {
                const theta2 = theta * theta;
                const theta3 = theta2 * theta;
                const theta7 = Math.pow(theta, 7);
                const theta9 = Math.pow(theta, 9);
                
                // Next iteration
                const thetaNew = beta + theta3 * A2 + theta7 * A3 + theta9 * A4;
                
                if (Math.abs(thetaNew - theta) < 1e-12) {
                    theta = thetaNew;
                    break;
                }
                theta = thetaNew;
            }
            
            // Final theta calculation
            const theta2 = theta * theta;
            const theta3 = theta2 * theta;
            const theta7 = Math.pow(theta, 7);
            const theta9 = Math.pow(theta, 9);
            theta = beta + theta3 * A2 + theta7 * A3 + theta9 * A4;
            
            // Calculate x, y coordinates
            // x = R * λ * cos(θ) / C (where C ≈ 1.5)
            // y = R * θ
            const C = Math.sqrt(3) / 2; // 0.866025...
            
            const x = R * lonRad * Math.cos(theta) / C;
            const y = R * theta;
            
            // Scale down to reasonable screen coordinates
            const screenScale = 0.00005;
            return { x: x * screenScale, y: -y * screenScale };
        }
        
        // =====================================================
        // INVERSE PROJECTION: x,y → Lat/Lon (Equal Earth)
        // =====================================================
        function inverseProjection(x, y) {
            const screenScale = 0.00005;
            const C = Math.sqrt(3) / 2;
            
            // Reverse the screen scaling
            const mapX = x / screenScale;
            const mapY = -y / screenScale;
            
            // First solve for θ using Newton-Raphson
            // y/R = θ = β + A2*θ³ + A3*θ⁷ + A4*θ⁹
            // where β = y/R
            const yNorm = mapY / R;
            
            let theta = yNorm; // Initial guess
            for (let iter = 0; iter < 20; iter++) {
                const theta2 = theta * theta;
                const theta3 = theta2 * theta;
                const theta6 = Math.pow(theta, 6);
                const theta7 = theta6 * theta;
                const theta8 = theta6 * theta2;
                const theta9 = theta8 * theta;
                
                // f(θ) = θ - A2*θ³ - A3*θ⁷ - A4*θ⁹ - yNorm = 0
                const f = theta - A2 * theta3 - A3 * theta7 - A4 * theta9 - yNorm;
                // f'(θ) = 1 - 3*A2*θ² - 7*A3*θ⁶ - 9*A4*θ⁸
                const fPrime = 1 - 3 * A2 * theta2 - 7 * A3 * theta6 - 9 * A4 * theta8;
                
                const delta = f / fPrime;
                theta = theta - delta;
                
                if (Math.abs(delta) < 1e-12) break;
            }
            
            // Now calculate β (authalic latitude) from θ
            const theta2 = theta * theta;
            const theta3 = theta2 * theta;
            const theta7 = Math.pow(theta, 7);
            const theta9 = Math.pow(theta, 9);
            const beta = theta - theta3 * A2 - theta7 * A3 - theta9 * A4;
            
            // For sphere, latitude = beta
            const latRad = beta;
            
            // Calculate longitude
            // x = R * λ * cos(θ) / C
            // λ = x * C / (R * cos(θ))
            let lambda = (mapX * C) / (R * Math.cos(theta));
            
            // Convert to degrees
            const latDeg = latRad * 180 / Math.PI;
            const lonDeg = lambda * 180 / Math.PI;
            
            return { lat: latDeg, lon: lonDeg };
        }

        // SVG.js MAP SETUP
        // =====================================================
        
        // Zoom and pan state
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        // Markers array
        let markers = [];
        
        // Initialize SVG
        const container = document.getElementById('map-container');
        const draw = SVG().addTo('#map-container').size('100%', '100%');
        
        // Get dimensions

            mapWidth = container.clientWidth;

        // Create main group for transformations
        const mapGroup = draw.group();
        
        // Create groups for layers

        // =====================================================

            for (let lon = -180; lon <= 180; lon += 30) {
                const pathData = [];
                for (let lat = -90; lat <= 90; lat += 2) {
                    const pos = forwardProjection(lat, lon);
                    if (pathData.length === 0) {
                        pathData.push(`M ${pos.x} ${pos.y}`);
                    } else {
                        pathData.push(`L ${pos.x} ${pos.y}`);
                    }
                }
                const path = graticuleGroup.path(pathData.join(' '));
                path.addClass('graticule-line');
            }
            
            // Latitude lines (every 30°)
            for (let lat = -60; lat <= 60; lat += 30) {
                const pathData = [];
                for (let lon = -180; lon <= 180; lon += 2) {

                    if (pathData.length === 0) {
                        pathData.push(`M ${pos.x} ${pos.y}`);
                    } else {
                        pathData.push(`L ${pos.x} ${pos.y}`);
                    }
                }
                const path = graticuleGroup.path(pathData.join(' '));
                path.addClass('graticule-line');
            }
        }

        // =====================================================
        // DRAW WORLD MAP
        // =====================================================
        function drawWorldMap() {
            worldCountries.forEach((country, index) => {
                const pathData = country.map((coord, i) => {
                    const pos = forwardProjection(coord[1], coord[0]);
                    return (i === 0 ? 'M ' : 'L ') + pos.x + ' ' + pos.y;
                }).join(' ') + ' Z';
                
                const path = landGroup.path(pathData);
                path.fill(index % 2 === 0 ? '#1e3a5f' : '#1e4a6f')
                    .stroke({ color: '#3b82f6', width: 1, opacity: 0.5 });
            });
            
            // Draw world boundary (rectangle showing projection bounds)
            const bounds = [
                forwardProjection(90, -180),
                forwardProjection(90, 180),
                forwardProjection(-90, 180),
                forwardProjection(-90, -180)
            ];
            const boundsPath = `M ${bounds[0].x} ${bounds[0].y} L ${bounds[1].x} ${bounds[1].y} L ${bounds[2].x} ${bounds[2].y} L ${bounds[3].x} ${bounds[3].y} Z`;
            graticuleGroup.path(boundsPath)
                .fill('none')
                .stroke({ color: '#ef4444', width: 2, dasharray: '5,5' });
        }
        
        // =====================================================
        // MARKER PLOTTING
        // =====================================================
        function addMarker(lat, lon, color = '#22c55e') {
            const pos = forwardProjection(lat, lon);
            const circle = markerGroup.circle(10)
                .fill(color)
                .stroke({ color: '#fff', width: 2 })
                .center(pos.x, pos.y);
            
            // Add pulse animation
            const pulse = markerGroup.circle(20)
                .fill('none')
                .stroke({ color: color, width: 2, opacity: 0.5 })
                .center(pos.x, pos.y);
            
            pulse.animate(1500, 0, 'now').ease('<>')
                .scale(2)
                .attr({ opacity: 0 })
                .loop();
            
            markers.push({ circle, pulse, lat, lon });
            updateMarkerCount();
        }
        
        function clearMarkers() {
            markers.forEach(m => {
                m.circle.remove();
                m.pulse.remove();
            });
            markers = [];
            updateMarkerCount();
        }
        
        function updateMarkerCount() {
            document.getElementById('marker-count').textContent = markers.length;
        }
        
        // =====================================================
        // ZOOM AND PAN
        // =====================================================
        function updateTransform() {
            mapGroup.transform({
                translateX: mapWidth / 2 + panX,
                translateY: mapHeight / 2 + panY,
                scale: zoom
            });
            document.getElementById('zoom-level').textContent = zoom.toFixed(2) + 'x';
        }
        
        // Mouse wheel zoom
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            zoom = Math.max(0.1, Math.min(10, zoom * delta));
            updateTransform();
        });
        
        // Pan (drag)
        container.addEventListener('mousedown', (e) => {
            if (e.target === container || e.target.tagName === 'svg') {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                panX += deltaX;
                panY += deltaY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                updateTransform();
            }
        });
        
        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        // =====================================================
        // INVERSE PROJECTION - CLICK TO GET COORDINATES
        // =====================================================
        container.addEventListener('click', (e) => {
            // Don't process if this was a drag
            if (isDragging) return;
            
            // Get click position relative to SVG center (accounting for zoom/pan)
            const rect = container.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            // Convert screen coordinates to map coordinates
            const mapX = (clickX - mapWidth / 2 - panX) / zoom;
            const mapY = (clickY - mapHeight / 2 - panY) / zoom;
            
            // Inverse project
            const coords = inverseProjection(mapX, mapY);
            
            // Normalize longitude to -180 to 180
            let lon = coords.lon;
            while (lon > 180) lon -= 360;
            while (lon < -180) lon += 360;
            
            // Display coordinates
            document.getElementById('click-lat').textContent = coords.lat.toFixed(4) + '°';
            document.getElementById('click-lon').textContent = lon.toFixed(4) + '°';
            
            // Hide instructions after first click
            document.getElementById('instructions').style.display = 'none';
        });
        
        // =====================================================
        // FORWARD PROJECTION - PLOT COORDINATES
        // =====================================================
        document.getElementById('btn-project').addEventListener('click', () => {
            const lat = parseFloat(document.getElementById('input-lat').value);
            const lon = parseFloat(document.getElementById('input-lon').value);
            
            if (isNaN(lat) || isNaN(lon)) {
                alert('Please enter valid latitude and longitude');
                return;
            }
            
            if (lat < -90 || lat > 90) {
                alert('Latitude must be between -90 and 90');
                return;
            }
            
            if (lon < -180 || lon > 180) {
                alert('Longitude must be between -180 and 180');
                return;
            }
            
            addMarker(lat, lon, '#22c55e');
        });
        
        // =====================================================
        // KEYBOARD CONTROLS
        // =====================================================
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'c':
                case 'C':
                    clearMarkers();
                    break;
                case '0':
                    // Reset view
                    zoom = 1;
                    panX = 0;
                    panY = 0;
                    updateTransform();
                    break;
            }
        });
        
        // =====================================================
        // INITIALIZATION
        // =====================================================
        function init() {
            drawGraticule();
            drawWorldMap();
            
            // Calculate map bounds for centering
            const topLeft = forwardProjection(90, -180);
            const bottomRight = forwardProjection(-90, 180);
            const centerX = (topLeft.x + bottomRight.x) / 2;
            const centerY = (topLeft.y + bottomRight.y) / 2;
            
            // Calculate scale to fit map in viewport
            const mapWidth = bottomRight.x - topLeft.x;
            const mapHeight = bottomRight.y - topLeft.y;
            const scaleX = (container.clientWidth * 0.9) / mapWidth;
            const scaleY = (container.clientHeight * 0.9) / mapHeight;
            zoom = Math.min(scaleX, scaleY);
            
            updateTransform();
            
            // Add some example markers
            addMarker(40.7128, -74.0060, '#22c55e');  // New York
            addMarker(51.5074, -0.1278, '#f59e0b');   // London
            addMarker(35.6762, 139.6503, '#ef4444'); // Tokyo
            addMarker(-33.8688, 151.2093, '#8b5cf6'); // Sydney
            addMarker(48.8566, 2.3522, '#06b6d4');    // Paris
            addMarker(-22.9068, -43.1729, '#ec4899'); // Rio de Janeiro
            addMarker(55.7558, 37.6173, '#f97316');   // Moscow
            addMarker(39.9042, 116.4074, '#eab308');  // Beijing
            
            // Add coordinate labels (as small circles with tooltips)
            const labelCoords = [
                { lat: 40.7128, lon: -74.0060, name: 'NYC' },
                { lat: 51.5074, lon: -0.1278, name: 'London' },
                { lat: 35.6762, lon: 139.6503, name: 'Tokyo' },
                { lat: -33.8688, lon: 151.2093, name: 'Sydney' },
                { lat: 48.8566, lon: 2.3522, name: 'Paris' },
                { lat: -22.9068, lon: -43.1729, name: 'Rio' },
                { lat: 55.7558, lon: 37.6173, name: 'Moscow' },
                { lat: 39.9042, lon: 116.4074, name: 'Beijing' }
            ];
            
            labelCoords.forEach(coord => {
                const pos = forwardProjection(coord.lat, coord.lon);
                const group = markerGroup.group();
                
                // Create text label
                const text = group.text(coord.name)
                    .font({ size: 12, family: 'sans-serif', fill: '#fff' })
                    .move(pos.x + 8, pos.y - 6);
            });
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            updateDimensions();
            updateTransform();
        });
        
        // Start
        init();
        
        // Test forward/inverse projection accuracy
        console.log('Testing Equal Earth projection:');
        const testLat = 34.0549;
        const testLon = -118.2441;
        const projected = forwardProjection(testLat, testLon);
        console.log(`Forward: (${testLat}, ${testLon}) -> (${projected.x.toFixed(2)}, ${projected.y.toFixed(2)})`);
        const inverted = inverseProjection(projected.x, projected.y);
        console.log(`Inverse: (${projected.x.toFixed(2)}, ${projected.y.toFixed(2)}) -> (${inverted.lat.toFixed(4)}, ${inverted.lon.toFixed(4)})`);
    </script>
</body>
</html>
