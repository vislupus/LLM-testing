  .coord-row .label { color: #6a7080; }
  .coord-row .value { color: #7ea8f8; font-weight: 600; font-family: 'Consolas', monospace; }

// ===== EQUAL EARTH PROJECTION =====
const A1 = 1.340264;
const A2 = -0.081106;
const A3 = 0.000893;
const A4 = 0.003796;
const M = Math.sqrt(3) / 2;
const DEG2RAD = Math.PI / 180;
const RAD2DEG = 180 / Math.PI;

// Forward: lat, lon (degrees) → projected x, y
function equalEarthForward(lat, lon) {
  const phi = lat * DEG2RAD;
  const lam = lon * DEG2RAD;
  const l = Math.asin(M * Math.sin(phi));
  const l2 = l * l;
  const l6 = l2 * l2 * l2;
  const D = M * (A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2));
  const x = lam * Math.cos(l) / D;
  const y = l * (A1 + A2 * l2 + l6 * (A3 + A4 * l2));
  return [x, y];
}

// Inverse: projected x, y → lat, lon (degrees)
function equalEarthInverse(x, y) {
  let l = y;
  let l2 = l * l;
  let l6 = l2 * l2 * l2;
  for (let i = 0; i < 25; i++) {
    const fy = l * (A1 + A2 * l2 + l6 * (A3 + A4 * l2)) - y;
    const fpy = A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2);
    const delta = fy / fpy;
    l -= delta;
    l2 = l * l;
    l6 = l2 * l2 * l2;
    if (Math.abs(delta) < 1e-12) break;
  }
  const D = M * (A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2));
  const lam = M * x * (A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2)) / Math.cos(l);
  const phi = Math.asin(Math.sin(l) / M);
  return [phi * RAD2DEG, lam * RAD2DEG];
}

// ===== SVG.JS SETUP =====
let draw, mapGroup, landGroup, graticuleGroup, markerGroup, oceanRect;
let currentZoom = 1, panX = 0, panY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
let markers = [];
let showGraticule = false;
let mapScale = 200; // pixels per projected unit
let mapOffsetX = 0, mapOffsetY = 0;

function init() {
  draw = SVG().addTo('#map-container').size('100%', '100%');
  draw.node.style.background = '#0a0e1a';

  // Ocean background
  oceanRect = draw.rect('100%', '100%').fill('#0d1525');

  // Groups
  mapGroup = draw.group();
  graticuleGroup = draw.group();
  landGroup = mapGroup.group();
  markerGroup = mapGroup.group();

  // Compute projection bounds for centering
  computeMapCenter();
  renderMap();
  renderGraticule();
  setupInteraction();

  // Plot some default markers
  plotMarker(48.86, 2.35, 'Paris');
  plotMarker(40.71, -74.01, 'New York');
  plotMarker(35.68, 139.69, 'Tokyo');
  plotMarker(-33.87, 151.21, 'Sydney');
  plotMarker(-1.29, 36.82, 'Nairobi');
}

function computeMapCenter() {
  // Project a few extreme points to find the bounding box
  const corners = [
    equalEarthForward(0, -180),
    equalEarthForward(0, 180),
    equalEarthForward(90, 0),
    equalEarthForward(-90, 0),
  ];
  const minX = Math.min(...corners.map(c => c[0]));
  const maxX = Math.max(...corners.map(c => c[0]));
  const minY = Math.min(...corners.map(c => c[1]));
  const maxY = Math.max(...corners.map(c => c[1]));

  const projW = maxX - minX;
  const projH = maxY - minY;

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  mapScale = Math.min(vw / projW, vh / projH) * 0.85;
  mapOffsetX = vw / 2;
  mapOffsetY = vh / 2;
}

function projToScreen(px, py) {
  return [
    px * mapScale * currentZoom + mapOffsetX + panX,
    -py * mapScale * currentZoom + mapOffsetY + panY
  ];
}

function screenToProj(sx, sy) {
  return [
    (sx - mapOffsetX - panX) / (mapScale * currentZoom),
    -(sy - mapOffsetY - panY) / (mapScale * currentZoom)
  ];
}

function latLonToScreen(lat, lon) {
  const [px, py] = equalEarthForward(lat, lon);
  return projToScreen(px, py);
}

function screenToLatLon(sx, sy) {
  const [px, py] = screenToProj(sx, sy);
  return equalEarthInverse(px, py);
}

// ===== RENDER MAP =====
function renderMap() {
  landGroup.clear();

  // Draw ocean fill (projected bounds)
  const [ox1, oy1] = projToScreen(...equalEarthForward(0, -180).map((v, i) => i === 0 ? v : 0));
  // Actually let's draw a proper ocean shape
  drawOcean();

  // Draw land polygons
  worldLand.forEach((polygon, idx) => {
    const points = polygon.map(([lon, lat]) => {
      const [px, py] = equalEarthForward(lat, lon);
      return projToScreen(px, py);
    });

    const pathData = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ') + 'Z';

    landGroup.path(pathData)
      .fill('#1a3a2a')
      .stroke('#2a6a4a')
      .strokeWidth(0.5 / currentZoom);
  });

  // Draw country borders (simplified - just re-stroke the land with a lighter color)
  worldLand.forEach(polygon => {
    const points = polygon.map(([lon, lat]) => {
      const [px, py] = equalEarthForward(lat, lon);
      return projToScreen(px, py);
    });
    const pathData = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ') + 'Z';
    landGroup.path(pathData)
      .fill('none')
      .stroke('#3a8a5a')
      .strokeWidth(0.8 / currentZoom)
      .opacity(0.6);
  });
}

function drawOcean() {
  // Draw the ocean as a projected ellipse-ish shape
  const oceanPoints = [];
  for (let lon = -180; lon <= 180; lon += 2) {
    const [px, py] = equalEarthForward(0, lon);
    oceanPoints.push(projToScreen(px, py));
  }
  // This gives us the equator line. For a proper ocean, let's draw the projection boundary.
  // The Equal Earth projection boundary is defined by the meridians at ±180°
  const boundary = [];
  for (let lat = -90; lat <= 90; lat += 2) {
    const [px, py] = equalEarthForward(lat, 180);
    boundary.push(projToScreen(px, py));
  }
  for (let lat = 90; lat >= -90; lat -= 2) {
    const [px, py] = equalEarthForward(lat, -180);
    boundary.push(projToScreen(px, py));
  }

  const pathData = boundary.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ') + 'Z';

  // Remove old ocean
  if (draw.findOne('.ocean-bg')) draw.findOne('.ocean-bg').remove();

  draw.path(pathData)
    .addClass('ocean-bg')
    .fill('#0f1d30')
    .stroke('#1a3050')
    .strokeWidth(1)
    .back();
}

// ===== GRATICULE =====
function renderGraticule() {
  graticuleGroup.clear();
  if (!showGraticule) return;

  // Meridians (every 30°)
  for (let lon = -180; lon <= 180; lon += 30) {
    const points = [];
    for (let lat = -90; lat <= 90; lat += 2) {
      const [px, py] = equalEarthForward(lat, lon);
      points.push(projToScreen(px, py));
    }
    const d = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');
    graticuleGroup.path(d)
      .fill('none')
      .stroke(lon === 0 ? '#3a5a8a' : '#1a2a4a')
      .strokeWidth(lon === 0 ? 1.2 / currentZoom : 0.5 / currentZoom)
      .strokeDasharray(lon === 0 ? 'none' : `${4/currentZoom},${4/currentZoom}`);
  }

  // Parallels (every 30°)
  for (let lat = -90; lat <= 90; lat += 30) {
    const points = [];
    for (let lon = -180; lon <= 180; lon += 2) {
      const [px, py] = equalEarthForward(lat, lon);
      points.push(projToScreen(px, py));
    }
    const d = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');
    graticuleGroup.path(d)
      .fill('none')
      .stroke(lat === 0 ? '#3a5a8a' : '#1a2a4a')
      .strokeWidth(lat === 0 ? 1.2 / currentZoom : 0.5 / currentZoom)
      .strokeDasharray(lat === 0 ? 'none' : `${4/currentZoom},${4/currentZoom}`);
  }

  // Labels
  for (let lon = -180; lon <= 180; lon += 30) {
    if (lon === 0) continue;
    const [sx, sy] = latLonToScreen(0, lon);
    graticuleGroup.text(`${lon}°`)
      .font({ size: 9 / currentZoom, fill: '#3a5a7a', family: 'Segoe UI' })
      .move(sx + 3/currentZoom, sy - 10/currentZoom);
  }
  for (let lat = -60; lat <= 60; lat += 30) {
    if (lat === 0) continue;
    const [sx, sy] = latLonToScreen(lat, 0);
    graticuleGroup.text(`${lat}°`)
      .font({ size: 9 / currentZoom, fill: '#3a5a7a', family: 'Segoe UI' })
      .move(sx + 4/currentZoom, sy - 4/currentZoom);
  }
}

function toggleGraticule() {
  showGraticule = !showGraticule;
  document.getElementById('btn-graticule').classList.toggle('active', showGraticule);
  renderGraticule();
}

// ===== INTERACTION =====
function setupInteraction() {
  const container = document.getElementById('map-container');

  // Mouse drag for panning
  container.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
  });

  document.addEventListener('mousemove', (e) => {
    // Update cursor coordinates
    const [lat, lon] = screenToLatLon(e.clientX, e.clientY);
    document.getElementById('cursor-lat').textContent = lat.toFixed(4) + '°';
    document.getElementById('cursor-lon').textContent = lon.toFixed(4) + '°';

    if (!isDragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    updateTransform();
  });

  document.addEventListener('mouseup', (e) => {
    if (isDragging && Math.abs(e.clientX - dragStartX) < 5 && Math.abs(e.clientY - dragStartY) < 5) {
      // It's a click, not a drag
      handleClick(e.clientX, e.clientY);
    }
    isDragging = false;
  });

  // Mouse wheel zoom
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
    const newZoom = Math.max(0.2, Math.min(20, currentZoom * zoomFactor));

    // Zoom toward cursor
    const mx = e.clientX, my = e.clientY;
    const [px, py] = screenToProj(mx, my);

    currentZoom = newZoom;

    // Adjust pan so the point under cursor stays fixed
    const [newSx, newSy] = projToScreen(px, py);
    panX += mx - newSx;
    panY += my - newSy;

    updateTransform();
    document.getElementById('zoom-level').textContent = `Zoom: ${currentZoom.toFixed(2)}x`;
  }, { passive: false });

  // Touch support
  let lastTouchDist = 0;
  container.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      panStartX = panX;
      panStartY = panY;
    } else if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastTouchDist = Math.sqrt(dx*dx + dy*dy);
    }
  });

  container.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      panX = panStartX + (e.touches[0].clientX - dragStartX);
      panY = panStartY + (e.touches[0].clientY - dragStartY);
      updateTransform();
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (lastTouchDist > 0) {
        const zoomFactor = dist / lastTouchDist;
        currentZoom = Math.max(0.2, Math.min(20, currentZoom * zoomFactor));
        updateTransform();
      }
      lastTouchDist = dist;
    }
  }, { passive: false });

  container.addEventListener('touchend', () => { isDragging = false; lastTouchDist = 0; });
}

function updateTransform() {
  // Re-render everything with new transform
  renderMap();
  renderGraticule();
  renderAllMarkers();
}

function handleClick(sx, sy) {
  const [lat, lon] = screenToLatLon(sx, sy);

  // Check if click is within valid projection bounds
  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return;
  if (isNaN(lat) || isNaN(lon)) return;

  document.getElementById('click-lat').textContent = lat.toFixed(4) + '°';
  document.getElementById('click-lon').textContent = lon.toFixed(4) + '°';

  const [px, py] = equalEarthForward(lat, lon);
  document.getElementById('click-px').textContent = px.toFixed(4);
  document.getElementById('click-py').textContent = py.toFixed(4);

  plotMarker(lat, lon);
}

// ===== MARKERS =====
function plotMarker(lat, lon, name) {
  const [px, py] = equalEarthForward(lat, lon);
  const [sx, sy] = projToScreen(px, py);

  const color = `hsl(${Math.random() * 360}, 70%, 60%)`;
  const id = 'marker-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);

  const marker = { id, lat, lon, name: name || `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`, color, px, py };
  markers.push(marker);

  renderMarker(marker);
  updateMarkersList();
}

function renderMarker(m) {
  const [sx, sy] = projToScreen(m.px, m.py);
  const r = 5 / currentZoom;

  // Outer glow
  markerGroup.circle(r * 3)
    .move(sx - r * 1.5, sy - r * 1.5)
    .fill(m.color)
    .opacity(0.15)
    .addClass(m.id);

  // Inner dot
  markerGroup.circle(r * 2)
    .move(sx - r, sy - r)
    .fill(m.color)
    .opacity(0.9)
    .addClass(m.id);

  // White center
  markerGroup.circle(r * 0.8)
    .move(sx - r * 0.4, sy - r * 0.4)
    .fill('#fff')
    .opacity(0.8)
    .addClass(m.id);

  // Label
  markerGroup.text(m.name)
    .font({ size: 11 / currentZoom, fill: '#e0e0e0', family: 'Segoe UI', weight: '600' })
    .move(sx + r * 2, sy - r * 2)
    .addClass(m.id)
    .stroke({ color: '#000', width: 3 / currentZoom, opacity: 0.5 });
}

function renderAllMarkers() {
  // Clear and re-render all markers
  markers.forEach(m => {
    // Remove old SVG elements
    draw.find('.' + m.id).forEach(el => el.remove());
  });
  markers.forEach(m => renderMarker(m));
}

function removeMarker(id) {
  draw.find('.' + id).forEach(el => el.remove());
  markers = markers.filter(m => m.id !== id);
  updateMarkersList();
}

function clearMarkers() {
  markers.forEach(m => {
    draw.find('.' + m.id).forEach(el => el.remove());
  });
  markers = [];
  updateMarkersList();
}

function updateMarkersList() {
  const list = document.getElementById('markers-list');
  if (markers.length === 0) {
    list.innerHTML = '<span style="color:#555;font-size:11px">Click map or use controls to add markers</span>';
    return;
  }
  list.innerHTML = markers.map(m => `
    <div class="marker-item">
      <div class="marker-dot" style="background:${m.color}"></div>
      <div class="marker-info">${m.name}<br><span style="color:#666">${m.lat.toFixed(4)}°, ${m.lon.toFixed(4)}°</span></div>
      <span class="marker-del" onclick="removeMarker('${m.id}')">✕</span>
    </div>
  `).join('');
}

function plotFromInput() {
  const lat = parseFloat(document.getElementById('input-lat').value);
  const lon = parseFloat(document.getElementById('input-lon').value);
  if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
    alert('Invalid coordinates. Lat: -90 to 90, Lon: -180 to 180');
    return;
  }
  plotMarker(lat, lon);

  // Pan to the marker
  const [sx, sy] = latLonToScreen(lat, lon);
  panX += window.innerWidth / 2 - sx;
  panY += window.innerHeight / 2 - sy;
  updateTransform();
}

function resetView() {
  currentZoom = 1;
  panX = 0;
  panY = 0;
  computeMapCenter();
  updateTransform();
  document.getElementById('zoom-level').textContent = 'Zoom: 1.00x';
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
</script>
