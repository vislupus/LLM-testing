<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equal Earth Projection – Interactive World Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: 'Inter', sans-serif; color: #e2e8f0; }
  #mapContainer { position: absolute; inset: 0; }
  #mapContainer svg { display: block; width: 100%; height: 100%; cursor: grab; }
  #mapContainer svg:active { cursor: grabbing; }

  .overlay {
    position: absolute;
    background: rgba(11, 15, 25, 0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    pointer-events: none;
    user-select: none;
  }
  .overlay > * { pointer-events: auto; }

  #infoPanel {
    bottom: 20px; left: 20px;
    padding: 16px 20px;
    min-width: 260px; max-width: 320px;
    font-size: 13px;
  }
  #infoPanel .label { color: #64748b; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }
  #infoPanel .value { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #e2e8f0; }
  #infoPanel .value.lat { color: #60a5fa; }
  #infoPanel .value.lon { color: #fbbf24; }
  #infoPanel .value.proj { color: #a78bfa; font-size: 11px; }
  .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 10px 0; }

  #markerPanel {
    top: 80px; right: 20px;
    width: 240px;
    padding: 14px 16px;
    max-height: calc(100vh - 160px);
    overflow-y: auto;
    font-size: 12px;
  }
  #markerPanel .marker-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; margin-bottom: 4px;
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.05);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    animation: fadeIn 0.2s ease;
  }
  .marker-item .mk-color { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-right: 8px; }
  .marker-item .mk-coords { flex: 1; color: #cbd5e1; }
  .marker-item .mk-del {
    background: none; border: none; color: #ef4444; cursor: pointer;
    font-size: 14px; padding: 2px 4px; border-radius: 4px;
    opacity: 0.6; transition: opacity 0.15s;
  }
  .marker-item .mk-del:hover { opacity: 1; background: rgba(239,68,68,0.1); }

  #markerBtn {
    position: absolute; top: 80px; right: 20px;
    width: 36px; height: 36px;
    background: rgba(11,15,25,0.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    color: #e2e8f0; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 10;
  }
  #markerBtn:hover { background: rgba(30,41,59,0.95); border-color: rgba(255,255,255,0.15); }
  #markerBtn.active { background: #3b82f6; border-color: #60a5fa; color: #fff; }

  #zoomControls {
    top: 20px; right: 20px;
    padding: 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: rgba(11,15,25,0.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    color: #e2e8f0; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    font-family: 'Inter', sans-serif; font-weight: 600;
  }
  .zoom-btn:hover { background: rgba(30,41,59,0.95); border-color: rgba(255,255,255,0.15); }
  .zoom-label {
    text-align: center; font-size: 10px; color: #64748b;
    font-family: 'JetBrains Mono', monospace; padding: 2px 0;
  }

  #titleBar {
    top: 20px; left: 50%; transform: translateX(-50%);
    padding: 8px 20px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    text-align: center; pointer-events: none;
    background: rgba(11,15,25,0.7); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
  }
  #titleBar span.sub { font-weight: 400; color: #64748b; font-size: 11px; display: block; margin-top: 2px; }

  #helpTip {
    bottom: 20px; right: 20px;
    padding: 10px 14px; font-size: 11px; color: #64748b;
    text-align: right; line-height: 1.6;
  }
  #helpTip kbd {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px; padding: 1px 5px; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: #94a3b8;
  }

  #toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(11,15,25,0.95); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 12px 20px; font-size: 13px; color: #e2e8f0;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
    box-shadow: 0 12px 48px rgba(0,0,0,0.6);
  }
  #toast.show { opacity: 1; }

  .graticule-toggle {
    position: absolute; bottom: 90px; left: 20px;
    background: rgba(11,15,25,0.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.07); border-radius: 20px;
    padding: 5px 12px; font-size: 11px; color: #94a3b8; cursor: pointer;
    transition: all 0.2s; pointer-events: auto; z-index: 5;
  }
  .graticule-toggle:hover { color: #e2e8f0; border-color: rgba(255,255,255,0.15); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

  #inputModal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(15, 23, 42, 0.97); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    padding: 24px 28px; width: 320px; pointer-events: auto; z-index: 100;
    box-shadow: 0 16px 64px rgba(0,0,0,0.7);
    display: none;
  }
  #inputModal.open { display: block; }
  #inputModal h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #f1f5f9; }
  #inputModal label { display: block; font-size: 11px; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  #inputModal input {
    width: 100%; padding: 8px 12px; margin-bottom: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 13px;
    outline: none; transition: border-color 0.2s;
  }
  #inputModal input:focus { border-color: #3b82f6; }
  #inputModal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  #inputModal button {
    padding: 7px 16px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all 0.2s; font-family: 'Inter', sans-serif;
  }
  #inputModal .btn-cancel { background: rgba(255,255,255,0.06); color: #94a3b8; }
  #inputModal .btn-cancel:hover { background: rgba(255,255,255,0.1); }
  #inputModal .btn-add { background: #3b82f6; color: #fff; }
  #inputModal .btn-add:hover { background: #2563eb; }
  #inputModal .close-x {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer;
  }
  #inputModal .close-x:hover { color: #e2e8f0; }
</style>
</head>
<body>

<div id="mapContainer"></div>

<!-- Title -->
<div id="titleBar" class="overlay">
  Equal Earth Projection
  <span class="sub">Interactive World Map · SVG.js · Click to plot markers · Scroll to zoom · Drag to pan</span>
</div>

<!-- Zoom Controls -->
<div id="zoomControls" class="overlay">
  <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
  <button class="zoom-btn" id="zoomReset" title="Reset view" style="font-size:12px;">⟲</button>
</div>

<!-- Info Panel -->
<div id="infoPanel" class="overlay">
  <div class="label">Cursor Position</div>
  <div class="value lat" id="cursorLat">—</div>
  <div class="value lon" id="cursorLon">—</div>
  <div class="value proj" id="cursorProj"></div>
  <div class="divider"></div>
  <div class="label">Last Click</div>
  <div class="value lat" id="clickLat">—</div>
  <div class="value lon" id="clickLon">—</div>
  <div class="value proj" id="clickProj"></div>
  <div class="divider"></div>
  <div class="label">Markers</div>
  <div class="value" id="markerCount" style="font-size:12px; color:#94a3b8;">0 placed</div>
</div>

<!-- Marker Add Button -->
<button id="markerBtn" title="Add marker by coordinates">+</button>

<!-- Marker List -->
<div id="markerPanel" class="overlay" style="display:none;">
  <div style="font-size:11px; color:#64748b; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.05em;">Markers</div>
  <div id="markerList"></div>
</div>

<!-- Graticule Toggle -->
<button class="graticule-toggle" id="graticuleToggle">Show Graticule</button>

<!-- Help -->
<div id="helpTip" class="overlay">
  <kbd>Scroll</kbd> zoom · <kbd>Drag</kbd> pan · <kbd>Click</kbd> plot marker<br>
  <kbd>+</kbd>/<kbd>−</kbd> buttons · <kbd>+</kbd> button adds lat/lon marker
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Input Modal -->
<div id="inputModal">
  <button class="close-x" id="modalClose">×</button>
  <h3>Add Marker</h3>
  <label>Latitude (°N positive, °S negative)</label>
  <input type="number" id="inputLat" placeholder="e.g. 48.8566" step="any">
  <label>Longitude (°E positive, °W negative)</label>
  <input type="number" id="inputLon" placeholder="e.g. 2.3522" step="any">
  <div class="modal-actions">
    <button class="btn-cancel" id="modalCancel">Cancel</button>
    <button class="btn-add" id="modalAdd">Add Marker</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/svg.js@3.2.0/dist/svg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────
//  EQUAL EARTH PROJECTION  (spherical form, R = 6371007.081 m)
// ─────────────────────────────────────────────────────────────

const R_EARTH = 6371007.081;   // authalic radius for Equal Earth
const SQRT3   = Math.sqrt(3);
const C1      = 1.340264;
const C2      = 0.243318;
const C3      = 0.006251;
const C4      = 0.034164;
const D1      = 0.081106;
const D2      = 0.000893;
const D3      = 0.003796;
const COEFF_X = SQRT3 / 2;      // √3 / 2  for θ computation

// Forward: geographic (rad) → projected (metres)
function forwardEqEarth(latRad, lonRad) {
  const sinLat = Math.sin(latRad);
  const theta  = Math.asin(COEFF_X * sinLat);   // θ ∈ [-π/2, π/2]

  const t2 = theta * theta;
  const t6 = t2 * t2 * t2;
  const denomX = C1 - C2 * t2 + t6 * (C3 + C4 * t2);
  const coeffY = C1 - D1 * t2 + t6 * (D2 + D3 * t2);

  const x = R_EARTH * 2 * lonRad * Math.cos(theta) / (SQRT3 * denomX);
  const y = R_EARTH * theta * coeffY;
  return { x, y, theta };
}

// Inverse: projected (metres) → geographic (rad)
function inverseEqEarth(x, y) {
  let theta = y / R_EARTH;   // initial guess
  for (let i = 0; i < 20; i++) {
    const t2  = theta * theta;
    const t6  = t2 * t2 * t2;
    const num = theta * (C1 - D1 * t2 + t6 * (D2 + D3 * t2)) - y / R_EARTH;
    const den = C1 - C2 * t2 + t6 * (C3 + C4 * t2);
    const dTheta = num / den;
    theta -= dTheta;
    if (Math.abs(dTheta) < 1e-12) break;
  }
  const beta = Math.asin(Math.min(1, Math.max(-1, (2 / SQRT3) * Math.sin(theta))));
  const lat = beta;   // spherical: ß = φ
  const lon = (x * SQRT3 * (C1 - C2 * theta * theta + Math.pow(theta, 6) * (C3 + C4 * theta * theta))) /
              (2 * R_EARTH * Math.cos(theta));
  return { lat, lon, theta, beta };
}

// ─────────────────────────────────────────────────────────────
//  SCENE SETUP
// ─────────────────────────────────────────────────────────────
const container = document.getElementById('mapContainer');
const W = container.clientWidth  || 1200;
const H = container.clientHeight || 700;

const svg = SVG().addTo(container).size(W, H);
svg.attr({ viewBox: `0 0 ${W} ${H}` });

// Layer order: graticule (bottom) → world → markers → hover indicator
const layerGrid  = svg.group().attr({ class: 'layer-grid' });
const layerWorld = svg.group().attr({ class: 'layer-world' });
const layerMarkers = svg.group().attr({ class: 'layer-markers' });
const layerHover  = svg.group().attr({ class: 'layer-hover' });

// Graticule toggle state
let showGraticule = false;

// View transform state
let viewScale  = 1.0;
let viewTx     = 0;   // screen px translation X
let viewTy     = 0;   // screen px translation Y

// Map bounding box in projected metres (computed from projection extents)
let mapBBox = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };

// Marker storage
const markers = [];   // { id, lat, lon, color, el }
let markerCounter = 0;
const MARKER_COLORS = ['#60a5fa','#fbbf24','#a78bfa','#34d399','#f472b6','#fb923c','#22d3ee','#a855f7'];

// ─────────────────────────────────────────────────────────────
//  COORDINATE ↔ SCREEN CONVERSION  (accounts for zoom & pan)
// ─────────────────────────────────────────────────────────────

// Precompute the natural width/height of the Equal Earth map
// (lon ∈ [-180, 180], lat ∈ [-90, 90]) so we can compute scale.
(function computeMapExtents() {
  const steps = 360;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i <= steps; i++) {
    const lon = -Math.PI + (2 * Math.PI * i) / steps;
    for (let j = 0; j <= steps; j++) {
      const lat = -Math.PI / 2 + (Math.PI * j) / steps;
      const p = forwardEqEarth(lat, lon);
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
  }
  mapBBox = { minX, maxX, minY, maxY };
})();

const mapProjW = mapBBox.maxX - mapBBox.minX;
const mapProjH = mapBBox.maxY - mapBBox.minY;

// Reference: when viewScale=1 and viewTx=viewTy=0, the map fills
// exactly `mapRefScale` pixels wide, centred in the viewport.
const mapRefScale = Math.min(W / mapProjW, H / mapProjH) * 0.92;

// Geo → screen  (already takes zoom & pan into account)
function geoToScreen(latDeg, lonDeg) {
  const lat = latDeg * Math.PI / 180;
  const lon = lonDeg * Math.PI / 180;
  const p   = forwardEqEarth(lat, lon);
  const sx  = W / 2 + viewTx + (p.x - mapBBox.minX - mapProjW / 2) * mapRefScale * viewScale;
  const sy  = H / 2 + viewTy + (p.y - mapBBox.minY - mapProjH / 2) * mapRefScale * viewScale;
  return { x: sx, y: sy, projX: p.x, projY: p.y, theta: p.theta };
}

// Screen → geo  (undoes zoom & pan, then inverse projects)
function screenToGeo(sx, sy) {
  const px = (sx - W / 2 - viewTx) / (mapRefScale * viewScale) + mapBBox.minX + mapProjW / 2;
  const py = (sy - H / 2 - viewTy) / (mapRefScale * viewScale) + mapBBox.minY + mapProjH / 2;
  const g  = inverseEqEarth(px, py);
  return { lat: g.lat * 180 / Math.PI, lon: g.lon * 180 / Math.PI, projX: px, projY: py };
}

// Screen → projected metres  (undo zoom/pan, no inverse projection)
function screenToProj(sx, sy) {
  const px = (sx - W / 2 - viewTx) / (mapRefScale * viewScale) + mapBBox.minX + mapProjW / 2;
  const py = (sy - H / 2 - viewTy) / (mapRefScale * viewScale) + mapBBox.minY + mapProjH / 2;
  return { x: px, y: py };
}

// ─────────────────────────────────────────────────────────────
//  APPLY VIEW TRANSFORM TO SVG GROUP
// ─────────────────────────────────────────────────────────────
function applyView() {
  // SVG.js translate then scale (order: scale origin is 0,0;
  // we want to scale around the centre of the viewport)
  layerWorld.attr('transform', `translate(${viewTx},${viewTy}) scale(${viewScale})`);
  layerMarkers.attr('transform', `translate(${viewTx},${viewTy}) scale(${viewScale})`);
  layerGrid.attr('transform',   `translate(${viewTx},${viewTy}) scale(${viewScale})`);
  layerHover.attr('transform',  `translate(${viewTx},${viewTy}) scale(${viewScale})`);
  document.getElementById('zoomLabel').textContent =
    Math.round(viewScale * 100) + '%';
}

// ─────────────────────────────────────────────────────────────
//  DRAW WORLD MAP  (TopoJSON → SVG paths)
// ─────────────────────────────────────────────────────────────
async function loadWorld() {
  const URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
  let world;
  try {
    const resp = await fetch(URL);
    world = await resp.json();
  } catch (e) {
    showToast('Failed to load world map data. Check your internet connection.');
    console.error(e);
    return;
  }
  renderTopoJSON(world);
  drawGraticule();
  applyView();
}

function renderTopoJSON(world) {
  const countries = topojson.feature(world, world.objects.countries);
  const land      = topojson.feature(world, world.objects.land);

  // Render land mass first (background), then country borders on top
  renderGeoJSON(land,    '#1e293b', 1.0);
  renderGeoJSON(countries, '#334155', 0.8);

  // Also render country outlines (stroke only)
  for (const feat of countries.features) {
    const pathData = geoJSONtoSVGPath(feat);
    if (!pathData) continue;
    const path = SVG().path(pathData);
    path.fill('none').stroke('#475569', 0.6).stroke({ width: 0.5 / viewScale });
    layerWorld.add(path);
  }
}

function renderGeoJSON(geojson, fill, opacity) {
  for (const feat of geojson.features) {
    const d = geoJSONtoSVGPath(feat);
    if (!d) continue;
    const path = SVG().path(d);
    path.fill(fill).opacity(opacity).stroke('none');
    layerWorld.add(path);
  }
}

// Convert a GeoJSON feature to an SVG path 'd' string using Equal Earth
function geoJSONtoSVGPath(feat) {
  const geom = feat.geometry;
  if (!geom) return null;
  const type = geom.type;

  if (type === 'Point') {
    const [lon, lat] = geom.coordinates;
    const p = forwardEqEarth(lat * Math.PI / 180, lon * Math.PI / 180);
    return `M${p.x},${p.y}`;
  }
  if (type === 'MultiPoint') {
    let d = '';
    for (const c of geom.coordinates) {
      const p = forwardEqEarth(c[1] * Math.PI / 180, c[0] * Math.PI / 180);
      d += `M${p.x},${p.y}L${p.x},${p.y} `;
    }
    return d.trim();
  }
  if (type === 'LineString') {
    return coordsToPath(geom.coordinates);
  }
  if (type === 'MultiLineString') {
    let d = '';
    for (const ring of geom.coordinates) d += coordsToPath(ring) + ' ';
    return d.trim();
  }
  if (type === 'Polygon') {
    let d = '';
    // First ring = outer boundary
    d += coordsToPath(geom.coordinates[0]);
    // Inner rings (holes) – SVG uses the even-odd fill rule, so we draw
    // them in the same path with a direction-reversed approach.
    // For correct holes with fill-rule="evenodd", we just draw them as
    // additional sub-paths (M…Z).
    for (let i = 1; i < geom.coordinates.length; i++) {
      d += ' ' + coordsToPath(geom.coordinates[i]);
    }
    return d;
  }
  if (type === 'MultiPolygon') {
    let d = '';
    for (const poly of geom.coordinates) {
      d += coordsToPath(poly[0]);   // outer ring
      for (let i = 1; i < poly.length; i++) {
        d += ' ' + coordsToPath(poly[i]);
      }
      d += ' ';
    }
    return d.trim();
  }
  return null;
}

function coordsToPath(coords) {
  if (!coords || coords.length === 0) return '';
  let d = '';
  for (let i = 0; i < coords.length; i++) {
    const [lon, lat] = coords[i];
    const p = forwardEqEarth(lat * Math.PI / 180, lon * Math.PI / 180);
    d += (i === 0 ? 'M' : 'L') + p.x.toFixed(4) + ',' + p.y.toFixed(4);
  }
  d += 'Z';
  return d;
}

// ─────────────────────────────────────────────────────────────
//  DRAW GRATICULE
// ─────────────────────────────────────────────────────────────
function drawGraticule() {
  layerGrid.clear();
  if (!showGraticule) return;

  const lonStep = 30;
  const latStep = 15;

  // Meridians (vertical-ish lines)
  for (let lon = -180; lon <= 180; lon += lonStep) {
    if (lon === -180 || lon === 180) continue; // handled by the 180 line below
    let d = '';
    for (let lat = -90; lat <= 90; lat += 2) {
      const p = forwardEqEarth(lat * Math.PI / 180, lon * Math.PI / 180);
      d += (lat === -90 ? 'M' : 'L') + p.x.toFixed(4) + ',' + p.y.toFixed(4);
    }
    const path = SVG().path(d).fill('none').stroke('#334155', 0.35).stroke({ width: 0.5 });
    layerGrid.add(path);
  }
  // 180° meridian (special case – same as -180)
  let d180 = '';
  for (let lat = -90; lat <= 90; lat += 2) {
    const p = forwardEqEarth(lat * Math.PI / 180, Math.PI);
    d180 += (lat === -90 ? 'M' : 'L') + p.x.toFixed(4) + ',' + p.y.toFixed(4);
  }
  const p180 = SVG().path(d180).fill('none').stroke('#334155', 0.35).stroke({ width: 0.5 });
  layerGrid.add(p180);

  // Parallels (horizontal-ish lines)
  for (let lat = -90; lat <= 90; lat += latStep) {
    if (lat === -90 || lat === 90) continue;
    let d = '';
    for (let lon = -180; lon <= 180; lon += 2) {
      const p = forwardEqEarth(lat * Math.PI / 180, lon * Math.PI / 180);
      d += (lon === -180 ? 'M' : 'L') + p.x.toFixed(4) + ',' + p.y.toFixed(4);
    }
    const path = SVG().path(d).fill('none').stroke('#334155', 0.35).stroke({ width: 0.5 });
    layerGrid.add(path);
  }
  // Equator (highlighted)
  let dEq = '';
  for (let lon = -180; lon <= 180; lon += 2) {
    const p = forwardEqEarth(0, lon * Math.PI / 180);
    dEq += (lon === -180 ? 'M' : 'L') + p.x.toFixed(4) + ',' + p.y.toFixed(4);
  }
  const pEq = SVG().path(dEq).fill('none').stroke('#475569', 0.6).stroke({ width: 0.7 });
  layerGrid.add(pEq);

  // Pole arcs (just points really, but draw small markers)
  // North pole
  const np = forwardEqEarth(Math.PI / 2, 0);
  const sp = forwardEqEarth(-Math.PI / 2, 0);
  const nDot = SVG().circle(np.x, np.y).radius(2 / viewScale).fill('#475569').opacity(0.5);
  const sDot = SVG().circle(sp.x, sp.y).radius(2 / viewScale).fill('#475569').opacity(0.5);
  layerGrid.add(nDot);
  layerGrid.add(sDot);
}

// ─────────────────────────────────────────────────────────────
//  MARKERS
// ─────────────────────────────────────────────────────────────
function addMarker(latDeg, lonDeg, color) {
  const id = ++markerCounter;
  const col = color || MARKER_COLORS[(id - 1) % MARKER_COLORS.length];
  const pos = geoToScreen(latDeg, lonDeg);
  const r = 5 / viewScale;

  const group = SVG().group();
  const circle = SVG().circle(pos.x, pos.y).radius(r).fill(col).stroke('#0b0f19', 2).stroke({ width: 1.5 });
  const ring  = SVG().circle(pos.x, pos.y).radius(r * 2.2).fill('none').stroke(col, 0.5).stroke({ width: 1 });

  // Animate appearance
  circle.attr({ r: 0 }).animate(200, '>').attr({ r: r });
  ring.attr({ r: 0, opacity: 1 }).animate(300, '>').attr({ r: r * 2.2, opacity: 0 });

  group.add(circle, ring);
  layerMarkers.add(group);

  const marker = { id, lat: latDeg, lon: lonDeg, color: col, el: group, circle, ring };
  markers.push(marker);
  updateMarkerUI();
  return marker;
}

function removeMarker(id) {
  const idx = markers.findIndex(m => m.id === id);
  if (idx === -1) return;
  markers[idx].el.remove();
  markers.splice(idx, 1);
  updateMarkerUI();
}

function updateMarkerUI() {
  const panel = document.getElementById('markerPanel');
  const list  = document.getElementById('markerList');
  const count = document.getElementById('markerCount');
  count.textContent = markers.length + ' placed';

  if (markers.length === 0) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  list.innerHTML = '';
  // Show newest first
  const sorted = [...markers].reverse();
  for (const m of sorted) {
    const div = document.createElement('div');
    div.className = 'marker-item';
    div.innerHTML = `
      <div style="display:flex;align-items:center;">
        <div class="mk-color" style="background:${m.color}"></div>
        <span class="mk-coords">${m.lat.toFixed(4)}°N, ${m.lon.toFixed(4)}°E</span>
      </div>
      <button class="mk-del" data-id="${m.id}" title="Remove">×</button>
    `;
    div.querySelector('.mk-del').addEventListener('click', () => removeMarker(m.id));
    list.appendChild(div);
  }
}

// ─────────────────────────────────────────────────────────────
//  HOVER INDICATOR  (crosshair at cursor)
// ─────────────────────────────────────────────────────────────
const hoverGroup = layerHover.group();
const hoverX = SVG().line(0, 0, 0, 0).stroke('#60a5fa', 0.3).stroke({ width: 0.5, dasharray: '3,3' });
const hoverY = SVG().line(0, 0, 0, 0).stroke('#60a5fa', 0.3).stroke({ width: 0.5, dasharray: '3,3' });
const hoverDot = SVG().circle(0, 0).radius(0).fill('#60a5fa').opacity(0);
hoverGroup.add(hoverX, hoverY, hoverDot);
hoverGroup.attr('transform', 'translate(0,0) scale(1)');
hoverDot.attr('transform', 'translate(0,0)');

let mouseScreenX = -999, mouseScreenY = -999;
let isMouseOnMap = false;

function updateHover(sx, sy) {
  mouseScreenX = sx;
  mouseScreenY = sy;
  if (!isMouseOnMap) {
    hoverX.attr({ x1: 0, y1: 0, x2: 0, y2: 0 });
    hoverY.attr({ x1: 0, y1: 0, x2: 0, y2: 0 });
    hoverDot.attr({ cx: 0, cy: 0, r: 0 });
    return;
  }
  const halfLen = 12;
  hoverX.attr({ x1: sx - halfLen, y1: sy, x2: sx + halfLen, y2: sy });
  hoverY.attr({ x1: sx, y1: sy - halfLen, x2: sx, y2: sy + halfLen });
  hoverDot.attr({ cx: sx, cy: sy, r: 2.5 / viewScale });

  // Update cursor readout
  const g = screenToGeo(sx, sy);
  document.getElementById('cursorLat').textContent = g.lat.toFixed(4) + '°' + (g.lat >= 0 ? 'N' : 'S');
  document.getElementById('cursorLon').textContent = g.lon.toFixed(4) + '°' + (g.lon >= 0 ? 'E' : 'W');
  document.getElementById('cursorProj').textContent =
    `proj: (${g.projX.toFixed(1)}m, ${g.projY.toFixed(1)}m)`;
}

// ─────────────────────────────────────────────────────────────
//  ZOOM & PAN
// ─────────────────────────────────────────────────────────────

// Mouse wheel zoom – centred on cursor
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = container.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  // Geographic point under cursor before zoom
  const gBefore = screenToGeo(sx, sy);

  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  viewScale = Math.max(0.1, Math.min(50, viewScale * factor));

  // After zoom, adjust translation so the same geographic point stays under cursor
  const sxNew = W / 2 + viewTx + (geoToScreen(gBefore.lat, gBefore.lon).x - W / 2 - viewTx);
  // Simpler: recompute viewTx, viewTy so that screenToGeo(sx,sy) == gBefore
  // screenToGeo(sx,sy) = …
  // We want: geoToScreen(gBefore) == {x:sx, y:sy} after transform
  // geoToScreen uses viewTx, viewTy. Solve for new viewTx, viewTy:
  const targetSx = sx, targetSy = sy;
  // geoToScreen(lat,lon) = W/2 + viewTx + (p.x - minX - Wproj/2) * refScale * scale
  // We have p from gBefore (forward project)
  const p = forwardEqEarth(gBefore.lat * Math.PI / 180, gBefore.lon * Math.PI / 180);
  viewTx = targetSx - W / 2 - (p.x - mapBBox.minX - mapProjW / 2) * mapRefScale * viewScale;
  viewTy = targetSy - H / 2 - (p.y - mapBBox.minY - mapProjH / 2) * mapRefScale * viewScale;

  applyView();
  updateHover(mouseScreenX, mouseScreenY);
}, { passive: false });

// Drag-to-pan
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragOriginTx = 0, dragOriginTy = 0;

container.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragOriginTx = viewTx;
  dragOriginTy = viewTy;
  container.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) {
    // Update hover even when not dragging
    const rect = container.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) {
      isMouseOnMap = true;
      updateHover(sx, sy);
    } else {
      isMouseOnMap = false;
      updateHover(sx, sy);
    }
    return;
  }
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  viewTx = dragOriginTx + dx;
  viewTy = dragOriginTy + dy;
  applyView();
  updateHover(mouseScreenX, mouseScreenY);
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  container.style.cursor = isMouseOnMap ? 'grab' : 'default';
});

// Touch support (basic)
let lastTouchDist = 0;
let touchStartTx = 0, touchStartTy = 0;
let touchStartX = 0, touchStartY = 0;

container.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTx = viewTx;
    touchStartTy = viewTy;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx * dx + dy * dy);
  }
  e.preventDefault();
}, { passive: false });

container.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    viewTx = touchStartTx + dx;
    viewTy = touchStartTy + dy;
    applyView();
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (lastTouchDist > 0) {
      const factor = dist / lastTouchDist;
      viewScale = Math.max(0.1, Math.min(50, viewScale * factor));
      applyView();
    }
    lastTouchDist = dist;
  }
}, { passive: false });

container.addEventListener('touchend', () => {
  lastTouchDist = 0;
});

// ─────────────────────────────────────────────────────────────
//  CLICK → PLOT MARKER + SHOW COORDINATES
// ─────────────────────────────────────────────────────────────
container.addEventListener('click', (e) => {
  if (isDragging) return;  // ignore clicks during drag
  const rect = container.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  if (sx < 0 || sx > W || sy < 0 || sy > H) return;

  const g = screenToGeo(sx, sy);
  addMarker(g.lat, g.lon);

  document.getElementById('clickLat').textContent = g.lat.toFixed(4) + '°' + (g.lat >= 0 ? 'N' : 'S');
  document.getElementById('clickLon').textContent = g.lon.toFixed(4) + '°' + (g.lon >= 0 ? 'E' : 'W');
  document.getElementById('clickProj').textContent =
    `proj: (${g.projX.toFixed(1)}m, ${g.projY.toFixed(1)}m)`;

  showToast(`📍 ${g.lat.toFixed(4)}°, ${g.lon.toFixed(4)}°`);
});

// ─────────────────────────────────────────────────────────────
//  ZOOM BUTTONS
// ─────────────────────────────────────────────────────────────
document.getElementById('zoomIn').addEventListener('click', () => {
  const factor = 1.4;
  viewScale = Math.min(50, viewScale * factor);
  applyView();
});
document.getElementById('zoomOut').addEventListener('click', () => {
  const factor = 1 / 1.4;
  viewScale = Math.max(0.1, viewScale * factor);
  applyView();
});
document.getElementById('zoomReset').addEventListener('click', () => {
  viewScale = 1.0;
  viewTx = 0; viewTy = 0;
  applyView();
  // clear click display
  document.getElementById('clickLat').textContent = '—';
  document.getElementById('clickLon').textContent = '—';
  document.getElementById('clickProj').textContent = '';
});

// ─────────────────────────────────────────────────────────────
//  MARKER ADD BUTTON + MODAL
// ─────────────────────────────────────────────────────────────
const markerBtn = document.getElementById('markerBtn');
const inputModal = document.getElementById('inputModal');

function openModal() {
  inputModal.classList.add('open');
  document.getElementById('inputLat').value = '';
  document.getElementById('inputLon').value = '';
  setTimeout(() => document.getElementById('inputLat').focus(), 50);
  markerBtn.classList.add('active');
}
function closeModal() {
  inputModal.classList.remove('open');
  markerBtn.classList.remove('active');
}

markerBtn.addEventListener('click', () => {
  if (inputModal.classList.contains('open')) closeModal();
  else openModal();
});

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);

document.getElementById('modalAdd').addEventListener('click', () => {
  const lat = parseFloat(document.getElementById('inputLat').value);
  const lon = parseFloat(document.getElementById('inputLon').value);
  if (isNaN(lat) || isNaN(lon)) {
    showToast('Please enter valid numeric coordinates.');
    return;
  }
  if (lat < -90 || lat > 90) {
    showToast('Latitude must be between -90 and 90.');
    return;
  }
  if (lon < -180 || lon > 180) {
    showToast('Longitude must be between -180 and 180.');
    return;
  }
  addMarker(lat, lon);
  closeModal();
  showToast(`📍 Added: ${lat.toFixed(4)}°, ${lon.toFixed(4)}°`);
});

document.getElementById('inputLat').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('inputLon').focus();
});
document.getElementById('inputLon').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('modalAdd').click();
});

// ─────────────────────────────────────────────────────────────
//  GRATICULE TOGGLE
// ─────────────────────────────────────────────────────────────
let graticuleBtn = document.getElementById('graticuleToggle');
graticuleBtn.addEventListener('click', () => {
  showGraticule = !showGraticule;
  graticuleBtn.textContent = showGraticule ? 'Hide Graticule' : 'Show Graticule';
  drawGraticule();
  applyView();
});

// ─────────────────────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ─────────────────────────────────────────────────────────────
//  KEYBOARD SHORTCUTS
// ─────────────────────────────────────────────────────────────
window.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') { e.preventDefault(); document.getElementById('zoomIn').click(); }
  if (e.key === '-') { e.preventDefault(); document.getElementById('zoomOut').click(); }
  if (e.key === 'r' || e.key === 'R') { document.getElementById('zoomReset').click(); }
  if (e.key === 'g' || e.key === 'G') { graticuleBtn.click(); }
  if (e.key === 'm' || e.key === 'M') { markerBtn.click(); }
  if (e.key === 'Escape') { if (inputModal.classList.contains('open')) closeModal(); }
});

// ─────────────────────────────────────────────────────────────
//  WINDOW RESIZE
// ─────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const newW = container.clientWidth || 1200;
  const newH = container.clientHeight || 700;
  svg.size(newW, newH);
  svg.attr({ viewBox: `0 0 ${newW} ${newH}` });
  // Recompute refScale and re-apply
  mapRefScale = Math.min(newW / mapProjW, newH / mapProjH) * 0.92;
  applyView();
});

// ─────────────────────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────────────────────
applyView();
loadWorld();

// Add a few demo markers so the page isn't empty on load
setTimeout(() => {
  addMarker(48.8566, 2.3522);    // Paris
  addMarker(35.6762, 139.6503);  // Tokyo
  addMarker(-33.8688, 151.2093); // Sydney
  addMarker(19.0760, 72.8777);   // Mumbai
  addMarker(51.5074, -0.1278);   // London
  addMarker(-23.5505, -46.6333); // São Paulo
  addMarker(41.9028, 12.4964);   // Rome
  addMarker(30.0444, 31.2357);   // Cairo
}, 600);

console.log('=== Equal Earth Interactive Map ===');
console.log(`Viewport: ${W}×${H}px`);
console.log(`Map extent (proj metres):`);
console.log(`  X: [${mapBBox.minX.toFixed(1)}, ${mapBBox.maxX.toFixed(1)}]`);
console.log(`  Y: [${mapBBox.minY.toFixed(1)}, ${mapBBox.maxY.toFixed(1)}]`);
console.log(`Reference scale: ${mapRefScale.toFixed(4)} px/m`);
console.log('\nAPI available globally:');
console.log('  geoToScreen(latDeg, lonDeg)  → {x, y, projX, projY, theta}');
console.log('  screenToGeo(sx, sy)          → {lat, lon, projX, projY}');
console.log('  addMarker(lat, lon, color)   → marker object');
console.log('  viewScale, viewTx, viewTy    — current transform');
</script>
