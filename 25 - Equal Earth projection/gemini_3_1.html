<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Equal Earth Map (SVG.js)</title>
    <!-- SVG.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.0/svg.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* UI Panel */
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            color: #e6edf3;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #8b949e;
        }

        input[type="number"] {
            width: 90px;
            padding: 6px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #e6edf3;
            font-family: inherit;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #58a6ff, #1f6feb);
            color: #0d1117;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        .info-text {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 8px;
        }

        .marker-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .marker-item:last-child {
            border-bottom: none;
        }

        .remove-btn {
            background: #da3633;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="info-panel">
        <h2>Equal Earth Projection</h2>

        <div class="control-group">
            <div class="control-header">
                <span>Add Marker (Lat/Lon)</span>
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="number" id="lat-input" placeholder="Latitude (°)" step="0.1" value="40.7">
                <input type="number" id="lon-input" placeholder="Longitude (°)" step="0.1" value="-74.0">
            </div>
            <button onclick="addMarkerFromInput()">Add New York Marker</button>
            <div class="info-text">Enter coordinates and click to plot.</div>
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Click Map to Get Coordinates</span>
            </div>
            <div id="click-coords" style="font-family: monospace; color: #58a6ff; margin: 8px 0;">Click anywhere on the map</div>
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Active Markers (<span id="marker-count">0</span>)</span>
            </div>
            <div id="marker-list" style="max-height: 200px; overflow-y: auto;"></div>
        </div>

        <div class="control-group">
            <button onclick="clearAllMarkers()">Clear All Markers</button>
            <button onclick="resetView()">Reset View</button>
        </div>
    </div>

    <script>
        // --- Equal Earth Projection Mathematics ---

        const sqrt3 = Math.sqrt(3);

        function equalEarthForward(lat, lon) {
            const latRad = lat * Math.PI / 180;
            const lonRad = lon * Math.PI / 180;
            
            const lat2 = latRad * latRad;
            const lat4 = lat2 * lat2;
            const lat6 = lat4 * lat2;
            const lat8 = lat4 * lat4;
            
            const denominator = Math.sqrt(9 + 45 * lat2 + 101 * lat4 + 161 * lat6 + 84 * lat8);
            
            const x = (2 * sqrt3 * lonRad * Math.cos(latRad)) / (3 * denominator);
            const y = latRad * (3 + 9 * lat2 + 20 * lat4 + 45 * lat6 + 60 * lat8) / 
                     (3 + 9 * lat2 + 20 * lat4 + 45 * lat6 + 60 * lat8);
            
            return { x, y };
        }

        function equalEarthInverse(x, y) {
            // Newton-Raphson iteration for latitude
            let lat = y * Math.PI / 2; // Initial guess
            
            for (let i = 0; i < 8; i++) {
                const lat2 = lat * lat;
                const lat4 = lat2 * lat2;
                const lat6 = lat4 * lat2;
                const lat8 = lat4 * lat4;
                
                // f(lat) = y(lat) - y
                const numerator = lat * (3 + 9 * lat2 + 20 * lat4 + 45 * lat6 + 60 * lat8);
                const denominator = 3 + 9 * lat2 + 20 * lat4 + 45 * lat6 + 60 * lat8;
                const f = numerator / denominator - y;
                
                // Derivative df/dlat
                const df = (3 + 27 * lat2 + 100 * lat4 + 315 * lat6 + 480 * lat8) / denominator;
                
                lat = lat - f / df;
            }
            
            // Calculate longitude
            const lat2 = lat * lat;
            const lat4 = lat2 * lat2;
            const lat6 = lat4 * lat2;
            const lat8 = lat4 * lat4;
            const denominator = Math.sqrt(9 + 45 * lat2 + 101 * lat4 + 161 * lat6 + 84 * lat8);
            
            // Handle division by zero at poles
            if (Math.abs(Math.cos(lat)) < 1e-10) {
                return { lat: lat * 180 / Math.PI, lon: 0 };
            }
            
            const lon = (3 * denominator * x) / (2 * sqrt3 * Math.cos(lat));
            
            return {
                lat: lat * 180 / Math.PI,
                lon: Math.max(-180, Math.min(180, lon * 180 / Math.PI))
            };
        }

        // --- SVG Setup ---
        const container = document.getElementById('canvas-container');
        const draw = SVG().addTo(container).size('100%', '100%');
        const rootGroup = draw.group(); // Root group for transformations

        // Map configuration
        const mapWidth = 1000;
        const mapHeight = 500;
        const scale = 160; // Projection scale factor
        const centerX = mapWidth / 2;
        const centerY = mapHeight / 2;

        // Transform state for zoom/pan
        let transform = { x: 0, y: 0, scale: 1 };

        // Marker storage
        let markers = [];
        let markerIdCounter = 0;

        // --- Coordinate Conversion Functions ---

        function geoToScreen(lat, lon) {
            const proj = equalEarthForward(lat, lon);
            const x = centerX + proj.x * scale;
            const y = centerY - proj.y * scale;
            
            // Apply current transform (zoom & pan)
            return {
                x: (x - centerX) * transform.scale + centerX + transform.x,
                y: (y - centerY) * transform.scale + centerY + transform.y
            };
        }

        function screenToGeo(screenX, screenY) {
            // Reverse transform
            const x = (screenX - transform.x - centerX) / transform.scale + centerX;
            const y = (screenY - transform.y - centerY) / transform.scale + centerY;
            
            // Convert to projection coordinates
            const projX = (x - centerX) / scale;
            const projY = (centerY - y) / scale;
            
            return equalEarthInverse(projX, projY);
        }

        // --- Map Rendering ---

        // Simplified GeoJSON-like world data (continents)
        const worldData = [
            {
                name: "North America",
                points: [[-168, 72], [-50, 72], [-50, 15], [-130, 15], [-130, 30], [-168, 30]]
            },
            {
                name: "South America",
                points: [[-85, 15], [-35, 15], [-35, -55], [-85, -55]]
            },
            {
                name: "Europe",
                points: [[-10, 70], [40, 70], [40, 35], [-10, 35]]
            },
            {
                name: "Africa",
                points: [[-20, 35], [50, 35], [50, -35], [-20, -35]]
            },
            {
                name: "Asia",
                points: [[40, 70], [140, 70], [140, 10], [100, 10], [100, -10], [40, -10]]
            },
            {
                name: "Australia",
                points: [[110, -10], [150, -10], [150, -45], [110, -45]]
            }
        ];

        function drawMap() {
            worldData.forEach(continent => {
                const projected = continent.points.map(([lon, lat]) => {
                    const p = geoToScreen(lat, lon);
                    return `${p.x},${p.y}`;
                }).join(' ');

                const polygon = rootGroup.polygon(projected)
                    .fill('#2d5a3d')
                    .stroke('#1e3a2a')
                    .width(1.5)
                    .opacity(0.7);
            });
        }

        // --- Marker Management ---

        function addMarker(lat, lon, label = null) {
            const screenPos = geoToScreen(lat, lon);
            const markerId = markerIdCounter++;

            const markerGroup = rootGroup.group();
            markerGroup.circle(8).center(screenPos.x, screenPos.y).fill('#ff4444').stroke('#ffffff').width(2);
            markerGroup.circle(3).center(screenPos.x, screenPos.y).fill('#ffffff');
            
            const text = markerGroup.text(label || `${lat.toFixed(1)}°, ${lon.toFixed(1)}°`)
                .font({ size: 12, family: 'monospace' })
                .fill('#ffffff')
                .center(screenPos.x, screenPos.y - 20);

            const marker = {
                id: markerId,
                lat, lon,
                screenPos,
                svg: markerGroup
            };

            markers.push(marker);
            updateMarkerList();
            return marker;
        }

        function addMarkerFromInput() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lon = parseFloat(document.getElementById('lon-input').value);
            
            if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
                addMarker(lat, lon);
            } else {
                alert('Please enter valid coordinates: Lat [-90, 90], Lon [-180, 180]');
            }
        }

        function removeMarker(id) {
            const index = markers.findIndex(m => m.id === id);
            if (index !== -1) {
                markers[index].svg.remove();
                markers.splice(index, 1);
                updateMarkerList();
            }
        }

        function clearAllMarkers() {
            markers.forEach(m => m.svg.remove());
            markers = [];
            updateMarkerList();
        }

        function updateMarkerList() {
            document.getElementById('marker-count').innerText = markers.length;
            const list = document.getElementById('marker-list');
            list.innerHTML = '';
            
            markers.slice(-10).reverse().forEach(m => {
                const item = document.createElement('div');
                item.className = 'marker-item';
                item.innerHTML = `
                    <span>${m.lat.toFixed(2)}°, ${m.lon.toFixed(2)}°</span>
                    <button class="remove-btn" onclick="removeMarker(${m.id})">×</button>
                `;
                list.appendChild(item);
            });
            
            if (markers.length > 10) {
                const more = document.createElement('div');
                more.className = 'marker-item';
                more.innerHTML = `<span style="color: #777;">... and ${markers.length - 10} more</span>`;
                list.appendChild(more);
            }
        }

        function resetView() {
            transform = { x: 0, y: 0, scale: 1 };
            updateTransform();
        }

        // --- Event Handlers ---

        // Click to get coordinates
        draw.on('click', function(event) {
            const rect = container.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            const coords = screenToGeo(x, y);
            document.getElementById('click-coords').innerText = 
                `Lat: ${coords.lat.toFixed(2)}°, Lon: ${coords.lon.toFixed(2)}°`;
        });

        // Zoom with mouse wheel
        draw.on('wheel', function(event) {
            event.preventDefault();
            const delta = event.deltaY > 0 ? 0.9 : 1.1;
            const newScale = transform.scale * delta;
            transform.scale = Math.max(0.5, Math.min(5, newScale));
            updateTransform();
        });

        // Pan with mouse drag
        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };

        draw.on('mousedown', function(event) {
            isDragging = true;
            lastMousePos = { x: event.clientX, y: event.clientY };
        });

        draw.on('mousemove', function(event) {
            if (isDragging) {
                const dx = event.clientX - lastMousePos.x;
                const dy = event.clientY - lastMousePos.y;
                transform.x += dx;
                transform.y += dy;
                lastMousePos = { x: event.clientX, y: event.clientY };
                updateTransform();
            }
        });

        draw.on('mouseup', function() {
            isDragging = false;
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ') {
                e.preventDefault();
                // Space bar toggles between New York and London for demo
                const coords = [{lat: 40.7, lon: -74.0}, {lat: 51.5, lon: -0.1}];
                const random = coords[Math.floor(Math.random() * coords.length)];
                document.getElementById('lat-input').value = random.lat;
                document.getElementById('lon-input').value = random.lon;
                addMarkerFromInput();
            }
        });

        function updateTransform() {
            rootGroup.transform({
                translateX: transform.x,
                translateY: transform.y,
                scale: transform.scale
            });
            
            // Re-position markers after transform
            markers.forEach(m => {
                const newPos = geoToScreen(m.lat, m.lon);
                m.svg.move(newPos.x, newPos.y);
            });
        }

        // --- Initialization ---
        drawMap();
        addMarker(40.7128, -74.0060, "New York");
        addMarker(51.5074, -0.1278, "London");
        addMarker(35.6762, 139.6503, "Tokyo");
        updateMarkerList();

        // Expose functions to global scope for HTML onclick
        window.addMarkerFromInput = addMarkerFromInput;
        window.removeMarker = removeMarker;
        window.clearAllMarkers = clearAllMarkers;
        window.resetView = resetView;
    </script>
</body>
</html>
