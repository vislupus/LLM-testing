<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equal Earth Projection · Interactive World Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    padding: 14px 20px;
    background: rgba(15, 23, 42, 0.95);
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    z-index: 10;
  }
  .topbar h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .topbar .sub {
    font-size: 12px;
    color: #64748b;
    margin-left: 10px;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #334155; border-color: #475569; }

  /* Map container */
  .map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #0f1b2f 0%, #050810 100%);
  }
  #map {
    width: 100%;
    height: 100%;
    cursor: grab;
    display: block;
  }
  #map.dragging { cursor: grabbing; }

  /* Readout overlay */
  .readout {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 14px 18px;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    font-size: 13px;
    min-width: 240px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .readout .row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    gap: 16px;
  }
  .readout .label { color: #64748b; }
  .readout .val { color: #38bdf8; font-weight: 600; }
  .readout .val.lat { color: #fbbf24; }
  .readout .val.lon { color: #a78bfa; }
  .readout h3 {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-family: -apple-system, sans-serif;
    font-weight: 700;
  }
  .readout .divider {
    height: 1px;
    background: #1e293b;
    margin: 8px 0;
  }

  /* Markers list */
  .markers-panel {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12px;
    max-width: 260px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .markers-panel h3 {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .markers-panel .count {
    background: #38bdf8;
    color: #0b1220;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
  }
  .marker-item {
    padding: 8px 10px;
    background: #1e293b;
    border-radius: 8px;
    margin-bottom: 6px;
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .marker-item .coords { color: #e2e8f0; }
  .marker-item .del {
    background: transparent;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 14px;
    padding: 0 4px;
  }
  .marker-item .del:hover { color: #fca5a5; }

  /* Help hint */
  .hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 12px;
    color: #94a3b8;
    display: flex;
    gap: 16px;
  }
  .hint kbd {
    background: #1e293b;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: inherit;
    color: #38bdf8;
    border: 1px solid #334155;
    font-size: 11px;
  }

  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 14px;
    background: rgba(11, 18, 32, 0.9);
  }
  .loading.hidden { display: none; }

  @media (max-width: 640px) {
    .markers-panel { max-width: 180px; font-size: 11px; }
    .readout { font-size: 12px; min-width: 200px; }
    .hint { font-size: 11px; padding: 6px 12px; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>🌍 Equal Earth Projection</h1>
    <span class="sub">Interactive World Map · SVG.js</span>
  </div>
  <div class="controls">
    <button class="btn" id="resetBtn">Reset View</button>
    <button class="btn" id="clearBtn">Clear Markers</button>
  </div>
</div>

<div class="map-wrap">
  <svg id="map"></svg>

  <div class="readout">
    <h3>Cursor Position</h3>
    <div class="row"><span class="label">Latitude</span><span class="val lat" id="curLat">—</span></div>
    <div class="row"><span class="label">Longitude</span><span class="val lon" id="curLon">—</span></div>
    <div class="divider"></div>
    <h3>Projected (Equal Earth)</h3>
    <div class="row"><span class="label">x</span><span class="val" id="curX">—</span></div>
    <div class="row"><span class="label">y</span><span class="val" id="curY">—</span></div>
    <div class="divider"></div>
    <div class="row"><span class="label">Zoom</span><span class="val" id="curZoom">1.00×</span></div>
  </div>

  <div class="markers-panel">
    <h3>Markers <span class="count" id="markerCount">0</span></h3>
    <div id="markersList" style="color:#64748b;font-size:11px;">Click on the map to drop a marker.</div>
  </div>

  <div class="hint">
    <span><kbd>click</kbd> drop marker</span>
    <span><kbd>drag</kbd> pan</span>
    <span><kbd>wheel</kbd> zoom</span>
  </div>

  <div class="loading" id="loading">Loading world map…</div>
</div>

<!-- SVG.js library -->
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>

<script>
/* ==========================================================
   EQUAL EARTH PROJECTION
   Šavrič, Patterson & Jenny 2018
   Forward: lat,lon → x,y
   Inverse: x,y → lat,lon (iterative Newton's method)
   ========================================================== */
const EE = (function() {
  // Polynomial coefficients for the Equal Earth projection
  const A1 =  1.340264;
  const A2 = -0.081106;
  const A3 =  0.000893;
  const A4 =  0.003796;
  const M  = Math.sqrt(3) / 2; // ≈ 0.866025

  /**
   * Forward projection: geographic coords → projected plane coords.
   * Input:  lat, lon in DEGREES
   * Output: {x, y} in projection units (unitless; roughly bounded x∈[-2.7, 2.7], y∈[-1.3, 1.3])
   */
  function forward(lat, lon) {
    const phi    = lat * Math.PI / 180;
    const lambda = lon * Math.PI / 180;
    // Parametric latitude θ: sin(θ) = (√3/2) · sin(phi)
    const theta = Math.asin(M * Math.sin(phi));
    const t2 = theta * theta;
    const t6 = t2 * t2 * t2;       // θ^6
    const t8 = t6 * t2;            // θ^8
    // Denominator is derivative of y w.r.t. theta: A1 + 3·A2·θ² + t6·(7·A3 + 9·A4·θ²)
    const denom = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
    const x = lambda * Math.cos(theta) / denom;
    const y = theta * (A1 + A2 * t2 + t6 * (A3 + A4 * t2));
    return { x, y };
  }

  /**
   * Inverse projection: projected x,y → geographic lat,lon in DEGREES.
   * Uses Newton–Raphson iteration to solve for parametric latitude θ from y.
   */
  function inverse(x, y) {
    // Initial guess: θ ≈ y / A1 (small-angle approximation)
    let theta = y;
    // Clamp initial guess into a reasonable band
    if (theta >  1.3) theta =  1.3;
    if (theta < -1.3) theta = -1.3;

    for (let i = 0; i < 20; i++) {
      const t2 = theta * theta;
      const t6 = t2 * t2 * t2;
      const f  = theta * (A1 + A2 * t2 + t6 * (A3 + A4 * t2)) - y;
      const fp = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
      const delta = f / fp;
      theta -= delta;
      if (Math.abs(delta) < 1e-9) break;
    }

    // Recover phi from θ: sin(phi) = sin(θ) / (√3/2)
    const sinPhi = Math.sin(theta) / M;
    // Clamp for safety (outside range means user clicked outside map hull)
    const phi = Math.asin(Math.max(-1, Math.min(1, sinPhi)));

    // Recover longitude from x
    const t2 = theta * theta;
    const t6 = t2 * t2 * t2;
    const denom = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
    const lambda = x * denom / Math.cos(theta);

    return {
      lat: phi    * 180 / Math.PI,
      lon: lambda * 180 / Math.PI
    };
  }

  // Compute the outline of the world in Equal Earth: the "football" hull.
  // Walks the ±180° meridians and ±90° parallels.
  function hull(steps = 120) {
    const pts = [];
    // Right edge: lon = 180, lat from -90 to 90
    for (let i = 0; i <= steps; i++) {
      const lat = -90 + (180 * i / steps);
      pts.push(forward(lat, 180));
    }
    // Left edge: lon = -180, lat from 90 to -90
    for (let i = 0; i <= steps; i++) {
      const lat = 90 - (180 * i / steps);
      pts.push(forward(lat, -180));
    }
    return pts;
  }

  return { forward, inverse, hull };
})();

/* ==========================================================
   WORLD GEOMETRY
   Uses Natural Earth 110m as GeoJSON via CDN.
   If offline, falls back to a minimal embedded outline.
   ========================================================== */
const WORLD_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json';
// world-atlas ships TopoJSON; we'll also try a direct geojson source.
const GEOJSON_URL = 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson';

/* ==========================================================
   APP STATE & RENDERING
   ========================================================== */
const SVG_W = 1000;
const SVG_H = 500;
// Scale factor: project units to SVG units. Equal Earth x extent ≈ ±2.7 → use ~170 to fit.
const SCALE = 170;
const CX = SVG_W / 2;  // SVG center x (lon=0 maps here)
const CY = SVG_H / 2;  // SVG center y (lat=0 maps here)

/**
 * Convert projected Equal Earth (x,y) → SVG coordinates.
 * SVG y-axis is flipped (down = positive) vs projection (up = positive).
 */
function projToSvg(p) {
  return { x: CX + p.x * SCALE, y: CY - p.y * SCALE };
}

/** Convert SVG coordinates → projected Equal Earth (x,y). */
function svgToProj(sx, sy) {
  return { x: (sx - CX) / SCALE, y: (CY - sy) / SCALE };
}

// Initialise SVG.js drawing
const draw = SVG('#map')
  .viewbox(0, 0, SVG_W, SVG_H)
  .attr('preserveAspectRatio', 'xMidYMid meet');

// Layer ordering: ocean background → graticule → land → hull outline → markers
const oceanLayer     = draw.group();
const graticuleLayer = draw.group();
const landLayer      = draw.group();
const hullLayer      = draw.group();
const markerLayer    = draw.group();

/* ---- Ocean: fill the hull with ocean color ---- */
function drawOcean() {
  const hullPts = EE.hull(180).map(projToSvg);
  const d = 'M' + hullPts.map(p => p.x.toFixed(2) + ',' + p.y.toFixed(2)).join(' L') + ' Z';
  oceanLayer.path(d)
    .fill('#122035')
    .stroke({ color: '#1e3a5f', width: 0.8 });
}

/* ---- Hull outline: crisp edge on top ---- */
function drawHullOutline() {
  const hullPts = EE.hull(180).map(projToSvg);
  const d = 'M' + hullPts.map(p => p.x.toFixed(2) + ',' + p.y.toFixed(2)).join(' L') + ' Z';
  hullLayer.path(d)
    .fill('none')
    .stroke({ color: '#334155', width: 1.0, opacity: 0.8 });
}

/* ---- Graticule: lat/lon grid ---- */
function drawGraticule() {
  const latStep = 15;
  const lonStep = 15;
  const subdiv = 180; // points per line for smoothness

  // Parallels (constant lat)
  for (let lat = -75; lat <= 75; lat += latStep) {
    const pts = [];
    for (let i = 0; i <= subdiv; i++) {
      const lon = -180 + (360 * i / subdiv);
      pts.push(projToSvg(EE.forward(lat, lon)));
    }
    const d = 'M' + pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' L');
    graticuleLayer.path(d)
      .fill('none')
      .stroke({
        color: lat === 0 ? '#475569' : '#1e3a5f',
        width: lat === 0 ? 0.6 : 0.4,
        opacity: lat === 0 ? 0.9 : 0.6
      });
  }

  // Meridians (constant lon)
  for (let lon = -165; lon <= 180; lon += lonStep) {
    const pts = [];
    for (let i = 0; i <= subdiv; i++) {
      const lat = -90 + (180 * i / subdiv);
      pts.push(projToSvg(EE.forward(lat, lon)));
    }
    const d = 'M' + pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' L');
    graticuleLayer.path(d)
      .fill('none')
      .stroke({
        color: lon === 0 ? '#475569' : '#1e3a5f',
        width: lon === 0 ? 0.6 : 0.4,
        opacity: lon === 0 ? 0.9 : 0.6
      });
  }
}

/* ---- Land: project GeoJSON features ---- */
function drawLand(geojson) {
  // geojson is a FeatureCollection with MultiPolygon / Polygon features
  const features = geojson.features || geojson;
  features.forEach(feature => {
    const geom = feature.geometry || feature;
    if (!geom) return;
    const polys = geom.type === 'MultiPolygon' ? geom.coordinates
               : geom.type === 'Polygon'      ? [geom.coordinates]
               : [];
    polys.forEach(poly => {
      // poly = array of rings; ring[0] = outer, rest = holes
      const pathParts = [];
      poly.forEach(ring => {
        const pts = ring.map(([lon, lat]) => projToSvg(EE.forward(lat, lon)));
        if (pts.length < 2) return;
        pathParts.push('M' + pts.map(p => p.x.toFixed(2) + ',' + p.y.toFixed(2)).join(' L') + ' Z');
      });
      if (pathParts.length) {
        landLayer.path(pathParts.join(' '))
          .fill('#2d4a6e')
          .stroke({ color: '#4a6b8f', width: 0.4 })
          .attr('fill-rule', 'evenodd');
      }
    });
  });
}

/* ==========================================================
   LOAD GEOMETRY (with fallback chain)
   ========================================================== */
async function loadWorldData() {
  // Try direct GeoJSON first (no topojson dependency)
  try {
    const r = await fetch(GEOJSON_URL);
    if (r.ok) return await r.json();
  } catch (e) { /* fall through */ }

  // Fallback: world-atlas TopoJSON (needs topojson-client, but we can decode a tiny bit manually)
  // If everything fails we render just the hull + graticule (still fully functional).
  return null;
}

/* ==========================================================
   ZOOM & PAN via viewBox manipulation.
   We track the viewBox {x, y, w, h}. SVG.js viewbox() wraps it.
   Because we pan/zoom the viewBox only, the projection math stays
   exact: all screen→SVG→projection transforms are affine.
   ========================================================== */
const initialVB = { x: 0, y: 0, w: SVG_W, h: SVG_H };
let vb = { ...initialVB };

function applyViewBox() {
  draw.viewbox(vb.x, vb.y, vb.w, vb.h);
  const zoom = SVG_W / vb.w;
  document.getElementById('curZoom').textContent = zoom.toFixed(2) + '×';
  // Keep marker/graticule stroke widths feeling consistent — optional
}

function resetView() {
  vb = { ...initialVB };
  applyViewBox();
}

/* --- Mouse wheel zoom, anchored at cursor --- */
const mapEl = document.getElementById('map');
mapEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  // Convert mouse → current SVG coords
  const sx = vb.x + (mx / rect.width)  * vb.w;
  const sy = vb.y + (my / rect.height) * vb.h;
  // Zoom factor
  const factor = e.deltaY < 0 ? 0.85 : 1.18;
  const newW = vb.w * factor;
  const newH = vb.h * factor;
  // Clamp zoom: min 0.25× of initial (don't zoom way out), max 50× in
  if (newW < SVG_W / 50 || newW > SVG_W * 4) return;
  // Keep the point under cursor fixed: shift origin so (sx,sy) stays at same screen fraction
  vb.x = sx - (mx / rect.width)  * newW;
  vb.y = sy - (my / rect.height) * newH;
  vb.w = newW;
  vb.h = newH;
  applyViewBox();
}, { passive: false });

/* --- Drag to pan --- */
let dragging = false;
let dragMoved = false;
let dragStart = null;

mapEl.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  dragMoved = false;
  dragStart = { x: e.clientX, y: e.clientY, vbx: vb.x, vby: vb.y };
  mapEl.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
  const rect = mapEl.getBoundingClientRect();
  vb.x = dragStart.vbx - dx * (vb.w / rect.width);
  vb.y = dragStart.vby - dy * (vb.h / rect.height);
  applyViewBox();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  mapEl.classList.remove('dragging');
});

/* --- Touch support (basic: pan with one finger, pinch-zoom with two) --- */
let touchStart = null;
mapEl.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchStart = { mode: 'pan', x: t.clientX, y: t.clientY, vbx: vb.x, vby: vb.y };
  } else if (e.touches.length === 2) {
    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const cx = (a.clientX + b.clientX) / 2;
    const cy = (a.clientY + b.clientY) / 2;
    touchStart = { mode: 'pinch', dist, cx, cy, vb: { ...vb } };
  }
}, { passive: true });
mapEl.addEventListener('touchmove', (e) => {
  if (!touchStart) return;
  e.preventDefault();
  const rect = mapEl.getBoundingClientRect();
  if (touchStart.mode === 'pan' && e.touches.length === 1) {
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    vb.x = touchStart.vbx - dx * (vb.w / rect.width);
    vb.y = touchStart.vby - dy * (vb.h / rect.height);
    applyViewBox();
  } else if (touchStart.mode === 'pinch' && e.touches.length === 2) {
    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const scale = touchStart.dist / dist;
    const newW = touchStart.vb.w * scale;
    const newH = touchStart.vb.h * scale;
    if (newW < SVG_W / 50 || newW > SVG_W * 4) return;
    const mx = touchStart.cx - rect.left;
    const my = touchStart.cy - rect.top;
    const sx = touchStart.vb.x + (mx / rect.width)  * touchStart.vb.w;
    const sy = touchStart.vb.y + (my / rect.height) * touchStart.vb.h;
    vb.x = sx - (mx / rect.width)  * newW;
    vb.y = sy - (my / rect.height) * newH;
    vb.w = newW;
    vb.h = newH;
    applyViewBox();
  }
}, { passive: false });
mapEl.addEventListener('touchend', () => { touchStart = null; });

/* ==========================================================
   MOUSE → SVG COORD CONVERSION (via getScreenCTM)
   This is the rock-solid way to convert a client point into
   SVG user-space coordinates regardless of CSS scaling,
   viewBox, or browser zoom.
   ========================================================== */
function clientToSvg(clientX, clientY) {
  const pt = mapEl.createSVGPoint();
  pt.x = clientX;
  pt.y = clientY;
  const ctm = mapEl.getScreenCTM();
  if (!ctm) return { x: 0, y: 0 };
  const svgPt = pt.matrixTransform(ctm.inverse());
  return { x: svgPt.x, y: svgPt.y };
}

/* ==========================================================
   INTERACTION: hover readout + click to drop marker
   ========================================================== */
const curLat = document.getElementById('curLat');
const curLon = document.getElementById('curLon');
const curX   = document.getElementById('curX');
const curY   = document.getElementById('curY');

function formatLat(lat) {
  const h = lat >= 0 ? 'N' : 'S';
  return Math.abs(lat).toFixed(3) + '° ' + h;
}
function formatLon(lon) {
  // Wrap to [-180, 180]
  while (lon >  180) lon -= 360;
  while (lon < -180) lon += 360;
  const h = lon >= 0 ? 'E' : 'W';
  return Math.abs(lon).toFixed(3) + '° ' + h;
}

function coordsFromEvent(e) {
  const svgPt = clientToSvg(e.clientX, e.clientY);
  const proj  = svgToProj(svgPt.x, svgPt.y);
  const geo   = EE.inverse(proj.x, proj.y);
  // Check if the click is inside the world hull: forward-project the inverse and compare
  const fwd = EE.forward(geo.lat, geo.lon);
  const dx = fwd.x - proj.x;
  const dy = fwd.y - proj.y;
  const inside = Math.hypot(dx, dy) < 0.02; // small tolerance
  return { svgPt, proj, geo, inside };
}

mapEl.addEventListener('mousemove', (e) => {
  if (dragging) return;
  const r = coordsFromEvent(e);
  if (r.inside) {
    curLat.textContent = formatLat(r.geo.lat);
    curLon.textContent = formatLon(r.geo.lon);
    curX.textContent   = r.proj.x.toFixed(4);
    curY.textContent   = r.proj.y.toFixed(4);
  } else {
    curLat.textContent = '—';
    curLon.textContent = '—';
    curX.textContent   = r.proj.x.toFixed(4);
    curY.textContent   = r.proj.y.toFixed(4);
  }
});

/* ==========================================================
   MARKERS
   Each marker stores {lat, lon} and is redrawn on view changes
   by adding them into the markerLayer which lives in SVG space,
   so they zoom/pan with the map automatically.
   ========================================================== */
const markers = [];

function addMarker(lat, lon) {
  const p = EE.forward(lat, lon);
  const s = projToSvg(p);
  const id = Date.now() + Math.random();
  const g = markerLayer.group();
  // Pulse halo
  g.circle(14)
    .center(s.x, s.y)
    .fill('#f59e0b')
    .opacity(0.25);
  // Core dot
  g.circle(7)
    .center(s.x, s.y)
    .fill('#f59e0b')
    .stroke({ color: '#fff', width: 1.2 });

  markers.push({ id, lat, lon, svgGroup: g });
  renderMarkerList();
}

function removeMarker(id) {
  const idx = markers.findIndex(m => m.id === id);
  if (idx === -1) return;
  markers[idx].svgGroup.remove();
  markers.splice(idx, 1);
  renderMarkerList();
}

function clearMarkers() {
  markers.forEach(m => m.svgGroup.remove());
  markers.length = 0;
  renderMarkerList();
}

function renderMarkerList() {
  document.getElementById('markerCount').textContent = markers.length;
  const list = document.getElementById('markersList');
  if (markers.length === 0) {
    list.innerHTML = '<div style="color:#64748b;font-size:11px;">Click on the map to drop a marker.</div>';
    return;
  }
  list.innerHTML = markers.map(m => `
    <div class="marker-item">
      <div class="coords">${formatLat(m.lat)}<br>${formatLon(m.lon)}</div>
      <button class="del" data-id="${m.id}" title="Remove">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('.del').forEach(btn => {
    btn.onclick = () => removeMarker(parseFloat(btn.dataset.id));
  });
}

mapEl.addEventListener('click', (e) => {
  if (dragMoved) { dragMoved = false; return; }
  const r = coordsFromEvent(e);
  if (!r.inside) return;
  addMarker(r.geo.lat, r.geo.lon);
});

/* ==========================================================
   A FEW SAMPLE MARKERS (major world cities)
   ========================================================== */
function seedCities() {
  const cities = [
    { lat:  40.7128, lon: -74.0060 }, // New York
    { lat:  51.5074, lon:   -0.1278 }, // London
    { lat:  35.6762, lon:  139.6503 }, // Tokyo
    { lat: -33.8688, lon:  151.2093 }, // Sydney
    { lat: -22.9068, lon:  -43.1729 }, // Rio
    { lat:  55.7558, lon:   37.6173 }, // Moscow
    { lat: -33.9249, lon:   18.4241 }, // Cape Town
  ];
  cities.forEach(c => addMarker(c.lat, c.lon));
}

/* ==========================================================
   BOOT
   ========================================================== */
async function init() {
  drawOcean();
  drawGraticule();
  const worldData = await loadWorldData();
  if (worldData) drawLand(worldData);
  drawHullOutline();
  seedCities();
  document.getElementById('loading').classList.add('hidden');
}

document.getElementById('resetBtn').onclick = resetView;
document.getElementById('clearBtn').onclick = clearMarkers;

init();
</script>
