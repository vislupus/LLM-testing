        </div>
        <div class="input-group">
            <label>Longitude (-180 to 180)</label>
            <input type="number" id="marker-lon" placeholder="e.g., -74.0060" min="-180" max="180" step="0.0001">
        </div>
        <div class="input-group">
            <label>Label (optional)</label>
            <input type="text" id="marker-label" placeholder="e.g., New York">
        </div>
        <button class="btn btn-primary" onclick="addMarker()">Add Marker</button>
        <button class="btn btn-secondary" onclick="clearAllMarkers()">Clear All</button>

        <strong>Controls:</strong><br>
        • Scroll to zoom<br>
        • Drag to pan<br>
        • Click to get coordinates<br>

    <script>
        // ============================================
        // EQUAL EARTH PROJECTION IMPLEMENTATION
        // ============================================

        const EqualEarth = {
            // Projection parameters
            A1: Math.sqrt(3) / 2,

            // Convert degrees to radians
            degToRad: function(deg) {
                return deg * Math.PI / 180;
            },

            // Convert radians to degrees
            radToDeg: function(rad) {
                return rad * 180 / Math.PI;
            },

            /**
             * Forward projection: Geographic coordinates (lat, lon) -> Projected (x, y)
             * @param {number} lat - Latitude in degrees (-90 to 90)
             * @param {number} lon - Longitude in degrees (-180 to 180)
             * @param {number} scale - Map scale factor
             * @param {object} offset - {x, y} offset for centering
             * @returns {object} {x, y} projected coordinates
             */
            forward: function(lat, lon, scale = 1, offset = {x: 0, y: 0}) {
                const phi = this.degToRad(lat);
                const lambda = this.degToRad(lon);

                // Equal Earth projection formula
                const A2 = 2 * this.A1;
                const sinPhi = Math.sin(phi);
                const theta = Math.asin(this.A1 * sinPhi);
                const cosTheta = Math.cos(theta);
                const sinTheta = Math.sin(theta);

                // x = R * λ * cos(θ) / (1 + √3/2 * sin²θ)
                // y = R * sin(θ) / (1 + √3/2 * sin²θ)
                const denominator = 1 + (Math.sqrt(3) / 2) * sinTheta * sinTheta;

                const x = scale * (A2 * lambda * cosTheta / denominator);
                const y = scale * (sinTheta / denominator);

                return {
                    x: x + offset.x,
                    y: -y + offset.y  // Flip Y to make North up
                };
            },

            /**
             * Inverse projection: Projected (x, y) -> Geographic coordinates (lat, lon)
             * @param {number} px - Projected x coordinate
             * @param {number} py - Projected y coordinate
             * @param {number} scale - Map scale factor
             * @param {object} offset - {x, y} offset for centering
             * @returns {object} {lat, lon} geographic coordinates in degrees
             */
            inverse: function(px, py, scale = 1, offset = {x: 0, y: 0}) {
                // Remove offset and scale
                const x = (px - offset.x) / scale;
                const y = -(py - offset.y) / scale;  // Unflip Y

                // Approximate solution using Newton's method
                // The Equal Earth inverse is iterative
                let theta = y;  // Initial guess

                for (let i = 0; i < 10; i++) {
                    const sinTheta = Math.sin(theta);
                    const cosTheta = Math.cos(theta);
                    const denominator = 1 + (Math.sqrt(3) / 2) * sinTheta * sinTheta;

                    // Error function
                    const error = y - sinTheta / denominator;

                    // Derivative
                    const derivative = -(cosTheta * cosTheta * (2 + Math.sqrt(3) * sinTheta * sinTheta)) /
                                       (denominator * denominator);

                    if (Math.abs(derivative) < 1e-10) break;

                    theta = theta - error / derivative;

                    if (Math.abs(error) < 1e-10) break;
                }

                // Calculate latitude
                const lat = this.radToDeg(Math.asin(Math.sin(theta) / this.A1));

                // Calculate longitude
                const A2 = 2 * this.A1;
                const sinTheta = Math.sin(theta);
                const cosTheta = Math.cos(theta);
                const denominator = 1 + (Math.sqrt(3) / 2) * sinTheta * sinTheta;

                const lon = this.radToDeg((x * denominator) / (A2 * cosTheta));

                return {
                    lat: Math.max(-90, Math.min(90, lat)),
                    lon: ((lon + 540) % 360) - 180  // Normalize to -180 to 180
                };
            }
        };

        let draw, mapGroup, graticuleGroup, countriesGroup, markersGroup;

        let containerWidth, containerHeight;

        function initMap() {
            const container = document.getElementById('world-map');
            containerWidth = container.clientWidth;
            containerHeight = container.clientHeight;

            // Calculate map dimensions (Equal Earth projection width is about 2:1)
            mapWidth = containerWidth * 0.9;
            mapHeight = mapWidth / 2;
            mapScale = mapHeight / Math.PI;  // R = π for full height
            mapOffset = {
                x: containerWidth / 2,
                y: containerHeight / 2
            };

            // Create SVG canvas
            draw = SVG().addTo('#world-map').size(containerWidth, containerHeight);
            draw.node.setAttribute('id', 'svg-canvas');

            // Enable pan and zoom

      var _enabled = event.data.enabled !== undefined ? event.data.enabled : !highlightEnabled;
      console.log("Toggle iframe highlight to:", _enabled);
      if (_enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "update-selected-element") {
      var selector = event.data.selector;
      console.log("Update selected element with selector:", selector);
      if (selector) {
        try {
          var element = document.querySelector(selector);
          console.log("Found element by selector:", element);
          updateSelectedHighlight(element);
        } catch (error) {
          console.warn("Failed to select element:", error);
          updateSelectedHighlight(null);
        }
      } else {
        updateSelectedHighlight(null);
      }
    } else if (event.data.type === "clear-selected-element") {
      console.log("Clear selected element");
      updateSelectedHighlight(null);
    }
  }

  // 启用高亮功能
  function enableHighlight() {
    console.log("Enabling highlight");
    document.addEventListener("mouseover", handleMouseOver, true);
    document.addEventListener("mouseout", handleMouseOut, true);
    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
