<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Equal Earth – SVG.js Interactive World Map</title>
<style>
  html, body{margin:0; height:100%; overflow:hidden;}
  #map{width:100%; height:100%; background:#eef;}
  #info{position:absolute; top:10px; right:10px; background:rgba(255,255,255,.9);
        padding:.4em .8em; border:1px solid #ccc; font-family:sans-serif;}
</style>
<!-- 1. Load the required libraries ---------------------------------------- -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.5.1/svg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>

<body>
<svg id="map"></svg>
<div id="info">Click to place a marker – Lat/Lon will be shown here</div>

<script>
(function(){
  /*=====================  CONFIGURATION =====================*/
  const WIDTH = 1200;          // width & height of the internal canvas
  const HEIGHT = 800;
  const BASE_SCALE = 250;      // base zoom level that will cover the whole map

  /*=====================  INITIAL SETUP =====================*/
  const svg = SVG('#map')
    .size('100%', '100%')
    .viewbox(0,0,WIDTH,HEIGHT);

  const mapGroup = svg.group();           // group that will be transformed (pan/zoom)
  const markersGroup = svg.group();       // markers will be added here

  const info = document.getElementById('info');

  /*=====================  PROJECTION =====================*/
  const proj = d3.geoEqualEarth().scale(BASE_SCALE).translate([WIDTH/2, HEIGHT/2]);

  /* Simple helper objects for screen ↔ world units */
  let currentScale = 1, currentTx = 0, currentTy = 0;
  function applyTransform(){
    mapGroup.attr('transform', `translate(${currentTx},${currentTy}) scale(${currentScale})`);
    markersGroup.attr('transform', `translate(${currentTx},${currentTy}) scale(${currentScale})`);
  }

  /* Convert from screen (pixel) to world (proj units) */
  function screenToWorld(x, y){
    const wx = (x - currentTx) / currentScale;
    const wy = (y - currentTy) / currentScale;
    return [wx, wy];
  }
  /* Convert from world (proj units) to screen (pixel) */
  function worldToScreen(x, y){
    return [x * currentScale + currentTx, y * currentScale + currentTy];
  }
  /* Screen pixel -> LatLon */
  function screenToLatLon(x, y){
    const [wx, wy] = screenToWorld(x, y);
    const ll = proj.invert([wx, wy]);     // [lon, lat] array in degrees
    return ll;
  }

  /*=====================  MAP DRAWING =====================*/
  // Load a low‑resolution world map (TopoJSON – 110m).  Works offline after the file is cached.
  d3.json('https://unpkg.com/world-atlas@2.0.2/countries-110m.json').then(obj => {
      const geoData = topojson.feature(obj, obj.objects.countries);

      // Build an SVG path string for all countries
      const path = d3.geoPath().projection(proj);
      const mapPath = mapGroup.path(path(geoData)).fill('#c2e6ff')
                                              .stroke({color:'#99ccff', width:.7, opacity:.7});
      applyTransform();
  });

  /*=====================  PAN & ZOOM HANDLING =====================*/
  let isDragging = false, dragStart = {};

  svg.node().addEventListener('pointerdown', e=> {
    if (e.button !== 0) return;   // only left mouse button
    isDragging = true;
    dragStart = {x:e.clientX, y:e.clientY, tx:currentTx, ty:currentTy};
  });

  svg.node().addEventListener('pointermove', e=> {
    if (!isDragging) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    currentTx = dragStart.tx + dx;
    currentTy = dragStart.ty + dy;
    applyTransform();
  });

  svg.node().addEventListener('pointerup',  ()=>{ isDragging = false; });
  svg.node().addEventListener('pointerleave', ()=>{ isDragging = false; });

  svg.node().addEventListener('wheel', e=> {
    e.preventDefault();
    const { offsetX, offsetY, deltaY } = e;

    // point under cursor in world coords *before* zoom
    const [wx0, wy0] = screenToWorld(offsetX, offsetY);

    const zoomFactor = deltaY < 0 ? 1.1 : 0.9;
    currentScale *= zoomFactor;

    // compute new translation so that (wx0, wy0) stays at same pixel
    currentTx = offsetX - wx0 * currentScale;
    currentTy = offsetY - wy0 * currentScale;

    applyTransform();
  }, {passive:false});

  /*=====================  CLICK – PLACE MARKER =====================*/
  svg.node().addEventListener('click', e=>{
    const { offsetX, offsetY } = e;
    const [lon, lat] = screenToLatLon(offsetX, offsetY);

    // Marker
    const size = 8;
    const marker = markersGroup.circle(size).fill('#ff5722').stroke({color:'#fff', width:1});
    const [sx, sy] = worldToScreen(...proj([lon, lat]));
    marker.center(sx, sy);

    // Update information
    info.textContent = `Lat / Lon: ${lat.toFixed(4)}° / ${lon.toFixed(4)}°`;
  });

})();
</script>
</body>
</html>
