        :root {
            --bg: #1a1a2e;
            --panel-bg: #16213e;
            --text: #e0e0e0;
            --accent: #e94560;
            --gold: #f0a500;
            --ocean: #1a3a5c;
            --land: #2d5a3d;
            --border: #3a5a3a;
            --radius: 8px;
            --font: 'Segoe UI', system-ui, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }
        #mapContainer {
            flex: 1;
            position: relative;
            cursor: grab;
            background: var(--ocean);
            overflow: hidden;
            min-height: 400px;
        }
        #mapContainer:active {
            cursor: grabbing;
        }
        #mapContainer.panning {
            cursor: grabbing;
        }
        #mapContainer svg {
            display: block;
        }
        .overlay-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(22, 33, 62, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 10px 14px;
            color: var(--text);
            font-size: 12px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 200px;
        }
        .overlay-panel h3 {
            font-size: 0.85rem;
            color: var(--gold);
            margin: 0 0 2px 0;
            letter-spacing: 0.3px;
        }
        .coord-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .coord-row label {
            color: #aaa;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            width: 24px;
            flex-shrink: 0;
        }
        .coord-row span {
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .coord-row input {
            width: 80px;
            padding: 4px 6px;
            border-radius: 3px;
            border: 1px solid #3a3a5a;
            background: #0a0a20;
            color: #fff;
            font-size: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            text-align: center;
        }
        .mini-btn {
            padding: 4px 10px;
            border-radius: 3px;
            border: 1px solid #3a3a5a;
            background: #0f3460;
            color: #ddd;
            cursor: pointer;
            font-size: 11px;
            font-family: var(--font);
            transition: 0.15s;
            white-space: nowrap;
        }
        .mini-btn:hover {
            background: #1a4a7a;
            border-color: #5a7aaa;
        }
        .mini-btn.accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .mini-btn.accent:hover {
            background: #ff5a75;
        }

            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ccc;
            font-size: 10px;
            padding: 5px 14px;
            border-radius: 12px;
            z-index: 10;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
        .marker-list {
            position: absolute;
            right: 10px;
            top: 10px;
            background: rgba(22, 33, 62, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 8px 10px;
            z-index: 10;
            font-size: 10px;
            color: #ccc;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);

            font-size: 0.7rem;
            color: var(--gold);
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 0.4px;

            display: flex;

            align-items: center;
            gap: 6px;
            padding: 2px 0;
            cursor: pointer;
            color: #bbb;

            color: #e94560;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
            font-size: 12px;

                left: 4px;

                right: 2px;
                top: 2px;
                font-size: 9px;
                max-height: 200px;
                min-width: 100px;
            }
        }

        (function() {
            // ==================== SVG.js SETUP ====================
            const container = document.getElementById('mapContainer');

            const draw = svg.group(); // main group for zoom/pan transforms
            const overlayGroup = svg.group(); // overlay (markers, highlights) also transformed

            // ==================== EQUAL EARTH PROJECTION ====================
            const R = 6371008.7714; // authalic radius (meters)
            const A1 = 1.340264;
            const A2 = -0.081106;
            const A3 = 0.000893;
            const A4 = 0.003796;
            const SQRT3 = Math.sqrt(3);
            const TWO_SQRT3_OVER_3 = (2 * SQRT3) / 3;
            const THREE_SQRT3_OVER_8 = (3 * SQRT3) / 8;

            function D(theta) {
                const t2 = theta * theta;
                const t4 = t2 * t2;
                const t6 = t4 * t2;
                const t8 = t4 * t4;
                return 1 + 3 * A1 * t2 + 5 * A2 * t4 + 7 * A3 * t6 + 9 * A4 * t8;
            }

            function dD_dtheta(theta) {
                const t = theta;
                const t3 = t * t * t;
                const t5 = t3 * t * t;
                const t7 = t5 * t * t;
                return 6 * A1 * t + 20 * A2 * t3 + 42 * A3 * t5 + 72 * A4 * t7;
            }

            // Forward: (lon, lat) in radians → (x, y) in meters
            function equalEarthForward(lon, lat) {
                const phi = lat;
                const lambda = lon;
                // Solve for theta using Newton's method
                let theta = phi; // initial guess
                if (Math.abs(phi) > 1.55) theta = Math.sign(phi) * 1.55;
                for (let i = 0; i < 15; i++) {
                    const Dval = D(theta);
                    const lhs = Math.sin(phi);
                    const rhs = THREE_SQRT3_OVER_8 * Dval * Math.sin(theta);
                    const f = rhs - lhs;
                    if (Math.abs(f) < 1e-12) break;
                    const df = THREE_SQRT3_OVER_8 * (dD_dtheta(theta) * Math.sin(theta) + Dval * Math.cos(theta));
                    if (Math.abs(df) < 1e-15) break;
                    theta -= f / df;
                }
                const Dval = D(theta);
                const x = R * TWO_SQRT3_OVER_3 * lambda * Math.cos(theta) / Dval;
                const y = R * TWO_SQRT3_OVER_3 * Math.sin(theta) / Dval;
                return { x, y };
            }

            // Inverse: (x, y) in meters → (lon, lat) in radians
            function equalEarthInverse(x, y) {
                const yNorm = y / (R * TWO_SQRT3_OVER_3);
                // Solve for theta from y using Newton's method
                let theta = Math.asin(Math.max(-1, Math.min(1, yNorm)));
                for (let i = 0; i < 20; i++) {
                    const Dval = D(theta);
                    const lhs = Math.sin(theta) / Dval;
                    const f = lhs - yNorm;
                    if (Math.abs(f) < 1e-14) break;
                    const df = (Math.cos(theta) * Dval - Math.sin(theta) * dD_dtheta(theta)) / (Dval * Dval);
                    if (Math.abs(df) < 1e-16) break;
                    theta -= f / df;
                }
                const Dval = D(theta);
                const cosTheta = Math.cos(theta);
                if (Math.abs(cosTheta) < 1e-10) {
                    const lambda = 0;
                    const phi = Math.asin(THREE_SQRT3_OVER_8 * Dval * Math.sin(theta));
                    return { lon: lambda, lat: phi };
                }
                const lambda = (x * Dval) / (R * TWO_SQRT3_OVER_3 * cosTheta);
                const phi = Math.asin(Math.max(-1, Math.min(1, THREE_SQRT3_OVER_8 * Dval * Math.sin(theta))));
                return { lon: Math.max(-Math.PI, Math.min(Math.PI, lambda)), lat: phi };
            }

            // ==================== SCREEN ↔ PROJECTION COORDINATES ====================
            let viewScale = 1;
            let viewOffsetX = 0;
            let viewOffsetY = 0;
            let mapWidth = 800;
            let mapHeight = 400;
            let projectionScale = 1; // meters to screen pixels at base

            function updateMapDimensions() {
                const rect = container.getBoundingClientRect();
                mapWidth = rect.width;
                mapHeight = rect.height;
                // Scale so the world (-180 to 180, roughly ±2.5e7 meters) fits nicely
                const worldWidth = 2 * Math.PI * R * TWO_SQRT3_OVER_3 / D(0);
                const worldHeight = 2 * R * TWO_SQRT3_OVER_3 / D(Math.PI / 3);
                projectionScale = Math.min(mapWidth / worldWidth, mapHeight / worldHeight) * 0.88;
            }

            function projectionToScreen(px, py) {
                const sx = px * projectionScale * viewScale + mapWidth / 2 + viewOffsetX;
                const sy = -py * projectionScale * viewScale + mapHeight / 2 + viewOffsetY;
                return { x: sx, y: sy };
            }

            function screenToProjection(sx, sy) {
                const px = (sx - mapWidth / 2 - viewOffsetX) / (projectionScale * viewScale);
                const py = -(sy - mapHeight / 2 - viewOffsetY) / (projectionScale * viewScale);
                return { x: px, y: py };
            }

            function latLonToScreen(lat, lon) {
                const proj = equalEarthForward(lon * Math.PI / 180, lat * Math.PI / 180);
                return projectionToScreen(proj.x, proj.y);
            }

            function screenToLatLon(sx, sy) {
                const proj = screenToProjection(sx, sy);
                const geo = equalEarthInverse(proj.x, proj.y);
                return {
                    lat: geo.lat * 180 / Math.PI,
                    lon: geo.lon * 180 / Math.PI
                };

            // ==================== DRAWING ====================
            let countryPaths = [];
            let markerCircles = [];
            let markerData = []; // {lat, lon, name, circle}

            function drawCountries() {
                // Clear existing paths
                countryPaths.forEach(p => p.remove());
                countryPaths = [];

                const landFill = '#3d7a4a';
                const landStroke = '#4a9060';
                const landStrokeWidth = 0.5;

                countries.forEach(country => {
                    country.polys.forEach(poly => {
                        if (poly.length < 3) return;
                        let pathStr = '';
                        poly.forEach((coord, i) => {
                            const screen = latLonToScreen(coord[1], coord[0]);
                            if (i === 0) pathStr += `M${screen.x},${screen.y}`;
                            else pathStr += ` L${screen.x},${screen.y}`;
                        });
                        pathStr += ' Z';
                        const path = draw.path(pathStr);
                        path.fill(landFill);
                        path.stroke({ color: landStroke, width: landStrokeWidth });
                        path.opacity(0.9);
                        countryPaths.push(path);
                    });
                });
            }

            function drawAllMarkers() {
                // Remove existing marker circles
                markerCircles.forEach(c => c.remove());
                markerCircles = [];

                markerData.forEach(m => {
                    const screen = latLonToScreen(m.lat, m.lon);
                    const circle = draw.circle(8);
                    circle.center(screen.x, screen.y);
                    circle.fill('#e94560');
                    circle.stroke({ color: '#fff', width: 1.5 });
                    circle.opacity(0.9);
                    circle.addClass('marker-circle');
                    markerCircles.push(circle);
                    m.circle = circle;

                    // Label
                    const label = draw.text(m.name || '');
                    label.font({ size: 9, family: 'Segoe UI, sans-serif', weight: 'bold' });
                    label.fill('#ffffff');
                    label.x(screen.x + 6);
                    label.y(screen.y - 14);
                    label.opacity(0.85);
                    markerCircles.push(label);
                    m.label = label;
                });
            }

            function redrawAll() {
                drawCountries();
                drawAllMarkers();
            }

            // ==================== ZOOM & PAN ====================
            let isPanning = false;
            let panStartX = 0;
            let panStartY = 0;
            let panStartOffsetX = 0;
            let panStartOffsetY = 0;

            container.addEventListener('mousedown', (e) => {
                if (e.button === 0 && !e.target.closest('.overlay-panel') && !e.target.closest('.marker-list') &&
                    !e.target.closest('input') && !e.target.closest('button')) {
                    isPanning = true;
                    panStartX = e.clientX;
                    panStartY = e.clientY;
                    panStartOffsetX = viewOffsetX;
                    panStartOffsetY = viewOffsetY;
                    container.classList.add('panning');
                    e.preventDefault();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    const dx = e.clientX - panStartX;
                    const dy = e.clientY - panStartY;
                    viewOffsetX = panStartOffsetX + dx;
                    viewOffsetY = panStartOffsetY + dy;
                    updateTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isPanning) {
                    isPanning = false;
                    container.classList.remove('panning');
                }
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const oldScale = viewScale;
                const zoomFactor = 1.1;
                if (e.deltaY < 0) {
                    viewScale = Math.min(30, viewScale * zoomFactor);
                } else {
                    viewScale = Math.max(0.3, viewScale / zoomFactor);
                }
                const scaleChange = viewScale / oldScale;
                viewOffsetX = mouseX - scaleChange * (mouseX - viewOffsetX - mapWidth / 2) - mapWidth / 2;
                viewOffsetY = mouseY - scaleChange * (mouseY - viewOffsetY - mapHeight / 2) - mapHeight / 2;

                updateTransform();
                updateInfoBar();
            }, { passive: false });

            // Click for coordinates
            container.addEventListener('click', (e) => {
                if (isPanning) return;
                if (e.target.closest('.overlay-panel') || e.target.closest('.marker-list') ||
                    e.target.closest('input') || e.target.closest('button')) return;

                const rect = container.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const geo = screenToLatLon(sx, sy);

                document.getElementById('clickedLat').textContent = geo.lat.toFixed(6) + '°';
                document.getElementById('clickedLon').textContent = geo.lon.toFixed(6) + '°';
            });

            // Double-click to add marker
            container.addEventListener('dblclick', (e) => {
                if (e.target.closest('.overlay-panel') || e.target.closest('.marker-list') ||
                    e.target.closest('input') || e.target.closest('button')) return;
                const rect = container.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const geo = screenToLatLon(sx, sy);
                addMarker(geo.lat, geo.lon, `Pt ${markerData.length + 1}`);
            });

            function updateTransform() {
                const transformStr = `translate(${viewOffsetX + mapWidth/2},${viewOffsetY + mapHeight/2}) scale(${viewScale}) translate(${-mapWidth/2},${-mapHeight/2})`;
                draw.attr('transform', transformStr);
                overlayGroup.attr('transform', transformStr);
            }

            function updateInfoBar() {
                document.getElementById('infoBar').textContent =
                    `Zoom: ${viewScale.toFixed(2)}× · Scroll to zoom · Drag to pan · Click for coordinates · DblClick to add marker`;
            }

            // ==================== MARKER MANAGEMENT ====================
            function addMarker(lat, lon, name) {
                if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                    showToast('Coordinates out of range');
                    return;
                }
                markerData.push({ lat, lon, name, circle: null, label: null });
                drawAllMarkers();
                updateMarkerList();
                showToast(`Marker added: ${name} (${lat.toFixed(2)}°, ${lon.toFixed(2)}°)`);
            }

            function removeMarker(index) {
                if (index >= 0 && index < markerData.length) {
                    const m = markerData[index];
                    if (m.circle) m.circle.remove();
                    if (m.label) m.label.remove();
                    markerData.splice(index, 1);
                    drawAllMarkers();
                    updateMarkerList();
                }
            }

            function clearMarkers() {
                markerData.forEach(m => {
                    if (m.circle) m.circle.remove();
                    if (m.label) m.label.remove();
                });
                markerData = [];
                markerCircles = [];
                updateMarkerList();
            }

            function updateMarkerList() {
                const container = document.getElementById('markerItems');
                if (markerData.length === 0) {
                    container.innerHTML = '<span style="color:#666;">Click map or use panel to add</span>';
                } else {
                    container.innerHTML = markerData.map((m, i) => `
                        <div class="marker-item">
                            <span>📍 ${m.name} (${m.lat.toFixed(2)}°, ${m.lon.toFixed(2)}°)</span>
                            <span class="remove-marker" data-index="${i}" title="Remove">×</span>
                        </div>
                    `).join('');
                    // Attach remove handlers
                    container.querySelectorAll('.remove-marker').forEach(el => {
                        el.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const idx = parseInt(el.dataset.index);
                            removeMarker(idx);
                        });
                    });
                }
            }

            // ==================== UI BUTTONS ====================
            document.getElementById('btnAddMarker').addEventListener('click', () => {
                const lat = parseFloat(document.getElementById('inputLat').value);
                const lon = parseFloat(document.getElementById('inputLon').value);
                if (isNaN(lat) || isNaN(lon)) {
                    showToast('Enter valid latitude and longitude');
                    return;
                }
                addMarker(lat, lon, `Pt ${markerData.length + 1}`);
                document.getElementById('inputLat').value = '';
                document.getElementById('inputLon').value = '';
            });

            document.getElementById('btnAddCities').addEventListener('click', () => {
                const cities = [
                    { name: 'New York', lat: 40.71, lon: -74.01 },
                    { name: 'London', lat: 51.51, lon: -0.13 },
                    { name: 'Tokyo', lat: 35.68, lon: 139.76 },
                    { name: 'Sydney', lat: -33.87, lon: 151.21 },
                    { name: 'Cairo', lat: 30.04, lon: 31.24 },
                    { name: 'Cape Town', lat: -33.92, lon: 18.42 },
                    { name: 'Moscow', lat: 55.76, lon: 37.62 },
                    { name: 'Beijing', lat: 39.90, lon: 116.40 },
                    { name: 'Rio de Janeiro', lat: -22.91, lon: -43.20 },
                    { name: 'Paris', lat: 48.86, lon: 2.35 },
                    { name: 'Delhi', lat: 28.61, lon: 77.23 },
                    { name: 'Singapore', lat: 1.35, lon: 103.82 },
                ];
                cities.forEach(c => addMarker(c.lat, c.lon, c.name));
            });

            document.getElementById('btnClearMarkers').addEventListener('click', clearMarkers);

            document.getElementById('btnResetView').addEventListener('click', () => {
                viewScale = 1;
                viewOffsetX = 0;
                viewOffsetY = 0;
                updateTransform();
                updateInfoBar();
                showToast('View reset');
            });

            // ==================== TOAST ====================
            function showToast(msg) {
                let toast = document.getElementById('toast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'toast';
                    toast.style.cssText = `
                        position:fixed;bottom:50px;left:50%;transform:translateX(-50%);
                        background:#333;color:#fff;padding:8px 18px;border-radius:20px;
                        font-size:12px;z-index:999;pointer-events:none;opacity:0;
                        transition:opacity 0.3s;font-family:'Segoe UI',sans-serif;
                    `;
                    document.body.appendChild(toast);
                }
                toast.textContent = msg;
                toast.style.opacity = '1';
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => { toast.style.opacity = '0'; }, 1800);
            }

            // ==================== INITIALIZATION ====================
            function init() {
                updateMapDimensions();
                updateTransform();
                redrawAll();
                updateMarkerList();
                updateInfoBar();

                // Set initial clicked coords
                const centerGeo = screenToLatLon(mapWidth / 2, mapHeight / 2);
                document.getElementById('clickedLat').textContent = centerGeo.lat.toFixed(6) + '°';
                document.getElementById('clickedLon').textContent = centerGeo.lon.toFixed(6) + '°';
            }

            // Handle resize
            window.addEventListener('resize', () => {
                updateMapDimensions();
                redrawAll();
                updateTransform();
            });

            // Keyboard shortcuts
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                switch (e.key.toLowerCase()) {
                    case 'r':
                        viewScale = 1;
                        viewOffsetX = 0;
                        viewOffsetY = 0;
                        updateTransform();
                        updateInfoBar();
                        showToast('View reset (R)');
                        break;
                    case '+':
                    case '=':
                        viewScale = Math.min(30, viewScale * 1.2);
                        updateTransform();
                        updateInfoBar();
                        break;
                    case '-':
                        viewScale = Math.max(0.3, viewScale / 1.2);
                        updateTransform();
                        updateInfoBar();
                        break;
                    case 'c':
                        clearMarkers();
                        showToast('Markers cleared (C)');
                        break;
                }
            });

            init();
            console.log('🌍 Equal Earth Projection Map Ready');
            console.log('  • Forward projection: lat/lon → screen x,y');
            console.log('  • Inverse projection: screen click → lat/lon');
            console.log('  • Zoom: scroll wheel | Pan: drag');
            console.log('  • Add markers via panel or double-click');
            console.log('  • Sample cities button for demo');
            console.log('  • Keyboard: R=reset, +/-=zoom, C=clear markers');
            console.log('  • Projection: Equal Earth (Šavrič et al., 2018)');
        })();
    </script>
</body>
</html>
