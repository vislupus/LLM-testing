<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Equal Earth SVG.js Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
  <style>
    html, body {
      height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: #f6f7f9;
    }
    body { width: 100vw; height: 100vh; }

    #container {
      width: 100vw; height: 100vh; position: relative;
      background: #cde5ef;
    }
    .overlay {
      position: absolute;
      min-width: 160px;
      min-height: 30px;
      background: rgba(34,46,62,0.96);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      left: 20px; bottom: 20px;
      z-index: 12;
      font: 16px/1.2 'Segoe UI',sans-serif;
      box-shadow: 0 2px 10px #0002;
      pointer-events: none;
      transition: opacity .2s;
    }
    .marker {
      stroke: #234;
      stroke-width: 2;
      fill: orange;
      opacity: 0.94;
      pointer-events: none;
    }
    .coastline {
      stroke: #2981a2;
      stroke-width: 0.55;
      fill: #e6e7d1;
      fill-rule: evenodd;
      vector-effect: non-scaling-stroke;
    }
    .graticule {
      stroke: #5ba4c9;
      stroke-width: .44;
      fill: none;
      stroke-dasharray: 2 3;
      opacity: .43;
      vector-effect: non-scaling-stroke;
    }
    .svgjs-cursor-grab {
      cursor: grab !important;
    }
    .svgjs-cursor-grabbing {
      cursor: grabbing !important;
    }
  </style>
</head>
<body>
<div id="container"></div>
<div class="overlay" id="readout" style="opacity: .95;"></div>
<script>
// ====== Constants and Map Settings =====
const WIDTH = window.innerWidth;
const HEIGHT = window.innerHeight;

// Equal Earth projection constants
const R = 480; // Projection half-width (pixels) for a world map about 960px wide
const MAP_CX = WIDTH/2;
const MAP_CY = HEIGHT/2;
const MAP_WIDTH = 2 * R;
const MAP_HEIGHT = 1.08 * R * 2;

// Forward Equal Earth projection: (λ, φ) [radians] to (x, y)
function equalEarthProject(lon, lat) {
    // Inputs: lon (λ), lat (φ) in radians
    // Outputs: [x, y] in Equal Earth (normalized in -1..1 for full world longitude/latitude range)
    // Constants (per Böhm et al. 2018)
    const A1 =  1.340264;
    const A2 = -0.081106;
    const A3 =  0.000893;
    const A4 =  0.003796;
    const M = Math.sqrt(3) / 2;
    const L = 180; // For normalization (max λ in degrees)
    const λ = lon;
    const φ = lat;
    const θ = Math.asin(M * Math.sin(φ));

    const x = R * (3 * λ / Math.PI) * (A1 + 2*A2*Math.pow(θ,2) + 3*A3*Math.pow(θ,4) + 4*A4*Math.pow(θ,6));
    const y = R * (A1*θ + A2*Math.pow(θ,3) + A3*Math.pow(θ,5) + A4*Math.pow(θ,7));
    return [x, y];
}

// Inverse Equal Earth projection: (x, y) to (λ, φ) [radians]
function equalEarthInvert(x, y) {
    // All calculations in radians
    // Newton-Raphson iteration on θ
    const A1 =  1.340264;
    const A2 = -0.081106;
    const A3 =  0.000893;
    const A4 =  0.003796;
    const M = Math.sqrt(3) / 2;

    // Recover θ numerically from y
    let θ = y / (R * A1); // Initial guess
    for (let i=0; i<10; ++i) {
        const θ2 = θ*θ, θ3 = θ2*θ, θ5 = θ3*θ2, θ7 = θ5*θ2;
        const fy = R * (A1*θ + A2*θ3 + A3*θ5 + A4*θ7) - y;
        const fyp = R * (A1 + 3*A2*θ2 + 5*A3*θ4 + 7*A4*θ6);
        θ -= fy / fyp;
    }
    const sinφ = Math.sin(θ) / M;
    let φ = Math.asin(Math.max(-1, Math.min(1, sinφ)));

    // Now recover λ
    const θ2 = θ*θ, θ4 = θ2*θ2, θ6 = θ4*θ2;
    const λ = (x / R) / (A1 + 2*A2*θ2 + 3*A3*θ4 + 4*A4*θ6) * (Math.PI/3);

    return [λ, φ];
}

// Convert degrees <-> radians
function deg2rad(deg) { return deg * Math.PI / 180; }
function rad2deg(rad) { return rad * 180 / Math.PI; }

// Project geographic [lon, lat] (in degrees) to screen [x, y]
function geo2screen(lon, lat, mapState) {
    const [projX, projY] = equalEarthProject(deg2rad(lon), deg2rad(lat));
    // Apply current zoom/pan
    const x = mapState.offsetX + projX * mapState.zoom;
    const y = mapState.offsetY + projY * mapState.zoom;
    return [x, y];
}

// Inverse: screen [x, y] to geographic [lon, lat] (degrees)
function screen2geo(x, y, mapState) {
    // Undo zoom/pan
    const px = (x - mapState.offsetX) / mapState.zoom;
    const py = (y - mapState.offsetY) / mapState.zoom;
    const [lonRad, latRad] = equalEarthInvert(px, py);
    return [rad2deg(lonRad), rad2deg(latRad)];
}

// ====== Embedded World Land GeoJSON Polygons (a compact version) ======
const WORLD_POLYGONS = [
    // This is a sample compact world coastline outline (resolution ≈110m, only for demonstration)
    // Source: https://github.com/datasets/geo-boundaries-world-110m + some simplifications
    // Only major landmasses, islands omitted for brevity; for higher detail substitute with real data.
    // Each polygon: [ [ [lon,lat], ... ] ]
    // Polygon 0: Afro-Eurasia + North America
    [[
        [-167.2764, 65.1042],[-162.9305, 63.7837],[-157.9225, 60.9782],[-150.3145, 60.3616],
        [-144.6293, 59.2432],[-139.3950, 59.6649],[-132.7100, 58.9012],[-127.4850, 54.3222],
        [-123.0898, 49.0156],[-122.7577, 45.1145],[-122.3745, 37.6185],[-118.1524, 34.1494],
        [-112.5121, 29.5830],[-104.2285, 28.0214],[-99.0856, 25.0145],[-94.2942, 21.2326],
        [-90.2671, 19.1039],[-86.5697, 18.7688],[-81.2946, 19.8341],[-78.2045, 22.8571],
        [-74.3984, 24.3761],[-70.1393, 25.5086],[-66.7223, 25.8187],[-62.4301, 26.1425],
        [-56.7968, 26.5882],[-48.5440, 24.5271],[-42.0831, 20.7308],[-32.3379, 17.3336],
        [-21.8275, 14.8582],[-5.5472, 12.0667],[1.7502, 10.1483],[9.1689, 8.5581],[15.2775, 7.8255],[23.5090, 6.1776],
        [30.7542, 4.4326],[34.3123, 3.5220],[40.3130, 2.1936],[45.5677, 3.6062],[51.5222, 4.6605],
        [60.1574, 5.4470],[75.0756, 8.2515],[87.0212, 13.0937],[98.2318, 17.0482],[110.3532, 19.8242],
        [123.8658, 22.8230],[135.0617, 23.3491],[147.1322, 23.8754],[154.0037, 21.0227],[161.8371, 17.3656],
        [168.6068, 12.9329],[170.9274, 7.9524],[169.2097, 5.2826],[163.4903, 3.0426],[155.2677, 0.5787],
        [141.7293, -2.7262],[130.6360, -3.7602],[123.1140, -6.8578],[116.5938, -13.3535],
        [113.3389, -18.0112],[106.6924, -22.1428],[99.5608, -27.1638],[89.8608, -30.9144], [80.6448, -38.5895],
        [73.3287, -41.5629],[64.4214, -43.9994],[52.6062, -51.9100],[40.8452, -55.6680],
        [28.5084, -55.9834],[13.7650, -54.5819],[0.7636, -46.7532],[-12.5908, -37.5303],[-26.1158, -32.1756],
        [-32.7633, -28.3534],[-41.8604, -23.3025],[-46.3734, -20.7150],[-57.5003, -16.8307],[-63.4730, -12.8757],
        [-67.1989, -8.6022],[-70.9130, -7.2015],[-74.9666, -6.2348],[-81.4136, -7.6316],[-86.7257, -10.6226],
        [-92.3411, -12.2860],[-100.1073, -13.5274],[-104.4268, -15.1064],[-109.3847, -17.7681],
        [-119.3294, -19.9080],[-129.7087, -22.1343],[-140.9337, -25.2474],[-150.8237, -29.2252],[-160.0049, -33.2673],[-167.2764, 65.1042]
    ]],
    // Polygon 1: South America
    [[
        [-81.5006, 8.5455],[-76.3749, 5.2730],[-74.2974, 1.8501],[-72.3497, -3.2811],[-67.9232, -5.8168],[-65.4013, -9.7655],
        [-62.1208, -13.3931],[-58.3940, -17.4647],[-52.2332, -21.4204],[-46.9357, -24.6395],[-41.3594, -28.6154],
        [-38.8537, -32.0897],[-33.7527, -34.4450],[-29.6031, -36.4460],[-24.2698, -34.0453],[-21.5566, -31.6677],
        [-18.5342, -24.9567],[-20.8335, -18.6131],[-25.7255, -7.5452],[-31.8832, -1.8806],[-36.4275, 2.1145],[-48.9444, 4.4692],
        [-59.0554, 8.3559],[-67.4144, 8.5719],[-81.5006, 8.5455]
    ]],
    // Polygon 2: Australia
    [[
        [113.5731, -10.9759],[114.9847, -13.6064],[119.8657, -18.2300],[124.1090, -27.6472],
        [128.8084, -33.3649],[133.4928, -37.2318],[137.3644, -37.8164],[142.6194, -32.1098],
        [146.7675, -25.3714],[147.7300, -20.3702],[139.5150, -11.2382],[130.4815, -11.0602],
        [122.1316, -15.4609],[113.5731, -10.9759]
    ]]
];

// ===== Setup SVG.js & Viewport State =====
const mapState = {
    zoom: 1.0,
    minZoom: 0.24, maxZoom: 6.0,
    offsetX: MAP_CX,
    offsetY: MAP_CY,
    dragging: false,
    dragOrigin: null,
    dragViewOrigin: null
};

const draw = SVG().addTo('#container').size(WIDTH, HEIGHT).attr({style: 'touch-action:none; user-select:none; background:#cde5ef;'});
draw.node.style.width = '100vw';
draw.node.style.height = '100vh';
draw.viewbox(0, 0, WIDTH, HEIGHT);

// ===== Utilities for Paths =====
function projectPolygon(poly, mapState) {
    // poly: [ [lon, lat], ... ]
    return poly.map(([lon, lat]) => geo2screen(lon, lat, mapState));
}
function polygonToPath(poly, mapState) {
    // SVG path-string from projected polygon
    return projectPolygon(poly, mapState).map((pt,i) => (i==0 ? "M" : "L") + pt[0].toFixed(2) + "," + pt[1].toFixed(2)).join(" ") + " Z";
}

// ===== Draw Graticule lines (grid) =====
function drawGraticule(group, mapState) {
    group.clear();
    // Lines of longitude every 30°, lines of latitude every 20°
    for (let lon = -150; lon <= 180; lon += 30) {
        let path = [];
        for (let lat = -90; lat <= 90; lat += 2) {
            path.push(geo2screen(lon, lat, mapState));
        }
        group.polyline(path).addClass('graticule');
    }
    for (let lat = -80; lat <= 80; lat += 20) {
        let path = [];
        for (let lon = -180; lon <= 180; lon += 2) {
            path.push(geo2screen(lon, lat, mapState));
        }
        group.polyline(path).addClass('graticule');
    }
}

// ===== Draw World Map Polygons =====
function drawMap(group, mapState) {
    group.clear();
    for (const polygonSet of WORLD_POLYGONS) {
        for (const poly of polygonSet) {
            const pathStr = polygonToPath(poly, mapState);
            group.path(pathStr).addClass('coastline');
        }
    }
}

// ===== Redraw all map layers on view change ====
const mapLayer = draw.group();
const graticuleLayer = draw.group();
const markerLayer = draw.group();

function redrawAll() {
    drawMap(mapLayer, mapState);
    drawGraticule(graticuleLayer, mapState);
    redrawMarkers();
}

// ===== Marker handling (for demo, one marker) ====
let currentMarker = null;
function setMarkerAt(lon, lat) {
    markerLayer.clear();
    const [x, y] = geo2screen(lon, lat, mapState);
    currentMarker = markerLayer.circle(18).center(x, y).addClass('marker');
}
function redrawMarkers() {
    if (currentMarker && currentMarker.data('lonlat')) {
        let [lon, lat] = currentMarker.data('lonlat');
        const [x, y] = geo2screen(lon, lat, mapState);
        currentMarker.center(x, y);
    }
}

// ===== Overlay for readout ====
const readout = document.getElementById('readout');
function showCoords(lon, lat, x, y) {
    readout.style.opacity = '1.0';
    readout.style.left = `${Math.max(12, Math.min(WIDTH-185, x+10))}px`;
    readout.style.top = `${Math.max(12, Math.min(HEIGHT-70, y-22))}px`;
    readout.innerHTML =
        `<b>Lon:</b> ${lon.toFixed(4)}°<br><b>Lat:</b> ${lat.toFixed(4)}°`;
}

// ===== Zoom & Pan Controls (mouse/touch) =====
let isTouch = false;

// mouse drag to pan
draw.on('mousedown', evt => {
    if (evt.button === 0) {
        evt.preventDefault();
        mapState.dragging = true;
        mapState.dragOrigin = [evt.clientX, evt.clientY];
        mapState.dragViewOrigin = [mapState.offsetX, mapState.offsetY];
        draw.node.classList.add('svgjs-cursor-grabbing');
    }
});
window.addEventListener('mousemove', evt => {
    if (mapState.dragging) {
        const dx = evt.clientX - mapState.dragOrigin[0];
        const dy = evt.clientY - mapState.dragOrigin[1];
        mapState.offsetX = mapState.dragViewOrigin[0] + dx;
        mapState.offsetY = mapState.dragViewOrigin[1] + dy;
        redrawAll();
    }
});
window.addEventListener('mouseup', evt => {
    mapState.dragging = false;
    draw.node.classList.remove('svgjs-cursor-grabbing');
});
// Handle wheel for zoom (centered on pointer)
draw.on('wheel', evt => {
    evt.preventDefault();
    const oldZoom = mapState.zoom;
    let zoomDelta = evt.deltaY < 0 ? 1.17 : 1/1.17;
    let newZoom = Math.max(mapState.minZoom, Math.min(mapState.maxZoom, oldZoom * zoomDelta));
    if (newZoom == oldZoom) return;
    // zoom toward mouse
    const mx = evt.clientX, my = evt.clientY;
    const wx = (mx - mapState.offsetX) / oldZoom;
    const wy = (my - mapState.offsetY) / oldZoom;
    mapState.zoom = newZoom;
    mapState.offsetX = mx - wx * newZoom;
    mapState.offsetY = my - wy * newZoom;
    redrawAll();
});

// ===== Map click for inverse projection and marker plotting ====
draw.on('click', function(evt) {
    // If moving, don't register as click
    if (mapState.dragging) return;
    const mx = evt.clientX, my = evt.clientY;
    const [lon, lat] = screen2geo(mx, my, mapState);
    showCoords(lon, lat, mx, my);
    setMarkerAt(lon, lat);
    if (currentMarker) currentMarker.data('lonlat', [lon, lat]);
});

// ===== Responsive resize
window.addEventListener('resize', function() {
    draw.size(window.innerWidth, window.innerHeight);
    redrawAll();
});

// ===== Initial Map Render =====
(function init() {
    // Center map on projection
    mapState.offsetX = WIDTH / 2;
    mapState.offsetY = HEIGHT / 2;
    mapState.zoom = Math.min(WIDTH/1100, HEIGHT/520, 1.0);

    // Initial marker at Null Island (0, 0)
    setMarkerAt(0, 0);
    if (currentMarker) currentMarker.data('lonlat', [0,0]);
    redrawAll();

    // Overlay starting message
    showCoords(0, 0, WIDTH/2 + 95, HEIGHT/2 - 40);
})();

</script>
</body>
</html>
