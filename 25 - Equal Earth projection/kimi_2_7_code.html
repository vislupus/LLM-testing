<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equal Earth Interactive World Map</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --ocean: #0b1020;
      --land: #1f3a52;
      --land-hover: #2d4f6d;
      --coast: #4a7a9e;
      --accent: #38bdf8;
      --marker: #f43f5e;
      --panel: rgba(11, 16, 32, 0.92);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ocean);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map-container {
      position: absolute;
      inset: 0;
      cursor: grab;
      touch-action: none;
    }
    #map-container:active {
      cursor: grabbing;
    }
    .glass {
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .coord-readout {
      font-variant-numeric: tabular-nums;
    }
    .marker-pulse {
      animation: pulse 1.8s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
      -webkit-transform-origin: center;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      70% { transform: scale(3.5); opacity: 0; }
      100% { transform: scale(3.5); opacity: 0; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="text-slate-100">

  <!-- Header -->
  <div class="absolute top-0 left-0 right-0 z-20 pointer-events-none p-4">
    <div class="glass rounded-2xl px-5 py-4 max-w-3xl mx-auto pointer-events-auto">
      <h1 class="text-xl font-semibold text-sky-300">Equal Earth Interactive World Map</h1>
      <p class="text-sm text-slate-300 mt-1 leading-relaxed">
        A self-contained SVG.js renderer using the Equal Earth projection.
        <span class="text-slate-400">Wheel to zoom, drag to pan, click to inverse-project, or enter coordinates to plot a marker.</span>
      </p>
    </div>
  </div>

  <!-- Map -->
  <div id="map-container"></div>

  <!-- Loading indicator -->
  <div id="loader" class="absolute inset-0 z-30 flex items-center justify-center bg-[#0b1020]">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-sky-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
      <p class="mt-4 text-slate-300">Loading world map…</p>
    </div>
  </div>

  <!-- Coordinate readout (bottom-left) -->
  <div id="readout" class="absolute bottom-4 left-4 z-20 glass rounded-xl px-4 py-3 min-w-[260px]">
    <div class="text-xs uppercase tracking-wider text-slate-400 mb-1">Last click / marker</div>
    <div class="coord-readout text-sm space-y-1">
      <div class="flex justify-between"><span class="text-slate-400">Latitude:</span> <span id="out-lat" class="text-sky-300">—</span></div>
      <div class="flex justify-between"><span class="text-slate-400">Longitude:</span> <span id="out-lon" class="text-sky-300">—</span></div>
      <div class="flex justify-between"><span class="text-slate-400">Proj X:</span> <span id="out-x" class="text-emerald-300">—</span></div>
      <div class="flex justify-between"><span class="text-slate-400">Proj Y:</span> <span id="out-y" class="text-emerald-300">—</span></div>
    </div>
  </div>

  <!-- Controls (right side) -->
  <div class="absolute top-24 right-4 z-20 glass rounded-xl p-4 w-64 space-y-4">
    <div>
      <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Plot coordinates</label>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <input id="in-lat" type="number" step="any" placeholder="Lat" class="w-full bg-slate-800/60 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-400" />
        <input id="in-lon" type="number" step="any" placeholder="Lon" class="w-full bg-slate-800/60 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-400" />
      </div>
      <button id="btn-plot" class="w-full bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium rounded-lg px-3 py-2 transition-colors">
        Plot marker
      </button>
    </div>

    <div class="flex gap-2">
      <button id="btn-reset" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium rounded-lg px-3 py-2 transition-colors">
        Reset view
      </button>
      <button id="btn-clear" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium rounded-lg px-3 py-2 transition-colors">
        Clear markers
      </button>
    </div>

    <div class="flex gap-2">
      <button id="btn-zoom-in" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white text-lg font-medium rounded-lg py-1 transition-colors" title="Zoom in">+</button>
      <button id="btn-zoom-out" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white text-lg font-medium rounded-lg py-1 transition-colors" title="Zoom out">−</button>
    </div>

    <div class="text-xs text-slate-500 pt-1">
      Zoom: <span id="zoom-level">100%</span>
    </div>
  </div>

  <script>
    // ============================================================
    // Equal Earth Projection
    // ============================================================
    const A1 =  1.340264;
    const A2 = -0.081106;
    const A3 =  0.000893;
    const A4 =  0.003796;
    const SQRT3_2 = Math.sqrt(3) / 2;
    const TWO_OVER_SQRT3 = 2 / Math.sqrt(3);

    /**
     * Forward Equal Earth projection.
     * @param {number} lon - longitude in degrees
     * @param {number} lat - latitude in degrees
     * @returns {{x:number, y:number}} projected coordinates (radians on unit sphere)
     */
    function equalEarthForward(lon, lat) {
      const lambda = lon * Math.PI / 180;
      const phi    = lat * Math.PI / 180;
      const theta  = Math.asin(clamp(SQRT3_2 * Math.sin(phi), -1, 1));
      const theta2 = theta * theta;
      const theta6 = theta2 * theta2 * theta2;
      const theta8 = theta6 * theta2;
      const A = A1 + A2 * theta2 + A3 * theta6 + A4 * theta8;
      return {
        x: lambda * Math.cos(theta) * A,
        y: theta * A
      };
    }

    /**
     * Inverse Equal Earth projection.
     * @param {number} x - projected x
     * @param {number} y - projected y
     * @returns {{lon:number, lat:number}|null} geographic coordinates in degrees, or null if outside domain
     */
    function equalEarthInverse(x, y) {
      // The y equation is y = theta * A(theta).  Solve for theta with Newton-Raphson.
      let theta = y; // initial guess
      for (let i = 0; i < 25; i++) {
        const t2 = theta * theta;
        const t4 = t2 * t2;
        const t6 = t4 * t2;
        const t8 = t6 * t2;
        const A  = A1 + A2 * t2 + A3 * t6 + A4 * t8;
        const dA = 2 * A2 * theta + 6 * A3 * t4 * theta + 8 * A4 * t6 * theta;
        const f  = theta * A - y;
        const df = A + theta * dA;
        const delta = f / df;
        theta -= delta;
        if (Math.abs(delta) < 1e-12) break;
      }

      if (Math.abs(theta) > Math.PI / 2 + 1e-6) return null;

      const t2 = theta * theta;
      const t4 = t2 * t2;
      const t6 = t4 * t2;
      const t8 = t6 * t2;
      const A = A1 + A2 * t2 + A3 * t6 + A4 * t8;

      const cosTheta = Math.cos(theta);
      if (Math.abs(cosTheta) < 1e-12) return null;

      const lambda = x / (cosTheta * A);
      if (Math.abs(lambda) > Math.PI + 1e-6) return null;

      const sinPhi = clamp(TWO_OVER_SQRT3 * Math.sin(theta), -1, 1);
      const phi = Math.asin(sinPhi);

      return {
        lon: lambda * 180 / Math.PI,
        lat: phi * 180 / Math.PI
      };
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    // ============================================================
    // Map State
    // ============================================================
    const container = document.getElementById('map-container');
    let width = container.clientWidth;
    let height = container.clientHeight;

    // SVG setup
    const draw = SVG().addTo(container).size('100%', '100%').viewbox(0, 0, width, height);
    const mapGroup = draw.group().attr({ id: 'map-group' });
    const graticuleGroup = draw.group().attr({ id: 'graticule-group' });
    const markerGroup = draw.group().attr({ id: 'marker-group' });
    const overlayGroup = draw.group().attr({ id: 'overlay-group' });

    // Base scale chosen so the full width of the projection (2*pi*A1) fits with padding.
    const FULL_WIDTH_RAD = 2 * Math.PI * A1;
    let baseScale = Math.min(width, height) / (FULL_WIDTH_RAD * 0.85);
    let scale = baseScale;
    let panX = 0;
    let panY = 0;

    // View transform: screen = proj * scale + center + pan, with y flipped.
    function projToScreen(p) {
      return {
        x: p.x * scale + width / 2 + panX,
        y: -p.y * scale + height / 2 + panY
      };
    }

    function screenToProj(sx, sy) {
      return {
        x: (sx - width / 2 - panX) / scale,
        y: -(sy - height / 2 - panY) / scale
      };
    }

    function geoToScreen(lon, lat) {
      return projToScreen(equalEarthForward(lon, lat));
    }

    function screenToGeo(sx, sy) {
      const p = screenToProj(sx, sy);
      return equalEarthInverse(p.x, p.y);
    }

    function applyTransform() {
      mapGroup.transform({ translateX: width / 2 + panX, translateY: height / 2 + panY, scale: scale, scaleY: -scale });
      graticuleGroup.transform({ translateX: width / 2 + panX, translateY: height / 2 + panY, scale: scale, scaleY: -scale });
      markerGroup.transform({ translateX: width / 2 + panX, translateY: height / 2 + panY, scale: scale, scaleY: -scale });
      document.getElementById('zoom-level').textContent = Math.round((scale / baseScale) * 100) + '%';
    }

    // ============================================================
    // Path generation from GeoJSON
    // ============================================================
    function projectPolygon(rings) {
      let d = '';
      for (const ring of rings) {
        if (!ring.length) continue;
        const first = equalEarthForward(ring[0][0], ring[0][1]);
        d += `M${fmt(first.x)} ${fmt(first.y)}`;
        for (let i = 1; i < ring.length; i++) {
          const pt = equalEarthForward(ring[i][0], ring[i][1]);
          d += `L${fmt(pt.x)} ${fmt(pt.y)}`;
        }
        d += 'Z';
      }
      return d;
    }

    function projectFeature(feature) {
      const geom = feature.geometry;
      if (!geom) return '';
      switch (geom.type) {
        case 'Polygon':
          return projectPolygon(geom.coordinates);
        case 'MultiPolygon':
          return geom.coordinates.map(p => projectPolygon(p)).join('');
        default:
          return '';
      }
    }

    function fmt(n) {
      return n.toFixed(5);
    }

    function renderGeoJSON(geojson) {
      mapGroup.clear();
      for (const feature of geojson.features) {
        const d = projectFeature(feature);
        if (!d) continue;
        mapGroup.path(d)
          .fill('var(--land)')
          .stroke({ color: 'var(--coast)', width: 0.3 / baseScale })
          .attr({ 'vector-effect': 'non-scaling-stroke' })
          .on('mouseenter', function() { this.fill('var(--land-hover)'); })
          .on('mouseleave', function() { this.fill('var(--land)'); });
      }
    }

    // ============================================================
    // Graticule
    // ============================================================
    function drawGraticule() {
      graticuleGroup.clear();
      const meridians = [-180, -150, -120, -90, -60, -30, 0, 30, 60, 90, 120, 150, 180];
      const parallels = [-75, -60, -45, -30, -15, 0, 15, 30, 45, 60, 75];

      let d = '';
      // Meridians
      for (const lon of meridians) {
        const p0 = equalEarthForward(lon, -85);
        const p1 = equalEarthForward(lon, 85);
        d += `M${fmt(p0.x)} ${fmt(p0.y)}L${fmt(p1.x)} ${fmt(p1.y)}`;
      }
      // Parallels
      for (const lat of parallels) {
        const pts = [];
        for (let lon = -180; lon <= 180; lon += 6) {
          pts.push(equalEarthForward(lon, lat));
        }
        d += `M${fmt(pts[0].x)} ${fmt(pts[0].y)}`;
        for (let i = 1; i < pts.length; i++) d += `L${fmt(pts[i].x)} ${fmt(pts[i].y)}`;
      }

      graticuleGroup.path(d)
        .fill('none')
        .stroke({ color: 'rgba(148, 163, 184, 0.18)', width: 0.2 / baseScale })
        .attr({ 'vector-effect': 'non-scaling-stroke' });
    }

    // ============================================================
    // Fallback world data (simplified continents, geographic coords)
    // ============================================================
    const FALLBACK_GEOJSON = {
      type: 'FeatureCollection',
      features: [
        { type: 'Feature', properties: { name: 'North America' }, geometry: { type: 'Polygon', coordinates: [[[-168,66],[-141,70],[-131,56],[-123,49],[-124,40],[-117,32],[-105,29],[-98,22],[-96,18],[-87,16],[-83,15],[-79,8],[-83,8],[-91,16],[-85,30],[-75,36],[-70,44],[-60,48],[-55,52],[-58,60],[-68,66],[-80,72],[-95,76],[-120,74],[-140,70],[-168,66]]] } },
        { type: 'Feature', properties: { name: 'South America' }, geometry: { type: 'Polygon', coordinates: [[[-82,11],[-77,9],[-72,12],[-60,11],[-52,5],[-39,-6],[-35,-20],[-40,-30],[-48,-40],[-55,-52],[-71,-55],[-76,-45],[-79,-35],[-81,-20],[-82,-5],[-82,11]]] } },
        { type: 'Feature', properties: { name: 'Eurasia' }, geometry: { type: 'Polygon', coordinates: [[[-10,36],[0,37],[12,37],[25,35],[35,32],[45,28],[55,27],[65,25],[75,22],[85,20],[95,18],[105,12],[115,8],[120,20],[130,40],[140,52],[155,60],[170,66],[180,72],[170,77],[140,77],[105,73],[80,67],[60,72],[45,75],[25,72],[5,70],[-10,62],[-25,60],[-15,50],[-10,36]]] } },
        { type: 'Feature', properties: { name: 'Africa' }, geometry: { type: 'Polygon', coordinates: [[[-17,28],[-5,28],[10,31],[25,32],[35,31],[42,25],[45,12],[51,10],[44,0],[38,-10],[33,-22],[28,-33],[20,-35],[10,-32],[0,-22],[-10,-17],[-17,5],[-17,28]]] } },
        { type: 'Feature', properties: { name: 'Australia' }, geometry: { type: 'Polygon', coordinates: [[[113,-11],[129,-11],[141,-12],[150,-22],[154,-32],[150,-39],[140,-39],[130,-36],[120,-31],[115,-25],[113,-11]]] } },
        { type: 'Feature', properties: { name: 'Antarctica' }, geometry: { type: 'Polygon', coordinates: [[[-180,-65],[-130,-71],[-60,-77],[0,-85],[60,-77],[130,-71],[180,-65],[180,-90],[-180,-90],[-180,-65]]] } }
      ]
    };

    // ============================================================
    // Data loading
    // ============================================================
    async function loadMapData() {
      try {
        const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json');
        if (!res.ok) throw new Error('Network response was not ok');
        const topology = await res.json();
        const geojson = topojson.feature(topology, topology.objects.land);
        return geojson;
      } catch (err) {
        console.warn('Failed to load detailed map, using simplified fallback.', err);
        return FALLBACK_GEOJSON;
      }
    }

    async function initMap() {
      const data = await loadMapData();
      renderGeoJSON(data);
      drawGraticule();
      applyTransform();
      document.getElementById('loader').classList.add('hidden');
    }

    initMap();

    // ============================================================
    // Zoom / Pan interaction
    // ============================================================
    let dragging = false;
    let dragMoved = false;
    const DRAG_THRESHOLD = 4;
    let dragStart = { x: 0, y: 0 };
    let panStart = { x: 0, y: 0 };

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 0.87;
      zoomAt(e.clientX, e.clientY, factor);
    }, { passive: false });

    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      dragging = true;
      dragMoved = false;
      dragStart = { x: e.clientX, y: e.clientY };
      panStart = { x: panX, y: panY };
      container.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) > DRAG_THRESHOLD) {
        dragMoved = true;
      }
      panX = panStart.x + (e.clientX - dragStart.x);
      panY = panStart.y + (e.clientY - dragStart.y);
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      dragging = false;
      container.style.cursor = 'grab';
    });

    // Touch support
    let lastTouchDist = null;
    let lastTouchCenter = null;

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        dragging = true;
        dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        panStart = { x: panX, y: panY };
      } else if (e.touches.length === 2) {
        dragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTouchDist = Math.hypot(dx, dy);
        lastTouchCenter = {
          x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
      }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && dragging) {
        panX = panStart.x + (e.touches[0].clientX - dragStart.x);
        panY = panStart.y + (e.touches[0].clientY - dragStart.y);
        applyTransform();
      } else if (e.touches.length === 2 && lastTouchDist && lastTouchCenter) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const center = {
          x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
        const factor = dist / lastTouchDist;
        zoomAt(lastTouchCenter.x, lastTouchCenter.y, factor);
        panX += center.x - lastTouchCenter.x;
        panY += center.y - lastTouchCenter.y;
        applyTransform();
        lastTouchDist = dist;
        lastTouchCenter = center;
      }
    }, { passive: false });

    container.addEventListener('touchend', () => {
      dragging = false;
      lastTouchDist = null;
      lastTouchCenter = null;
    });

    function zoomAt(cx, cy, factor) {
      const oldScale = scale;
      const newScale = clamp(oldScale * factor, baseScale * 0.5, baseScale * 50);
      if (newScale === oldScale) return;

      const p = screenToProj(cx, cy);
      panX = cx - width / 2 - p.x * newScale;
      panY = cy - height / 2 + p.y * newScale;
      scale = newScale;
      applyTransform();
    }

    function resetView() {
      scale = baseScale;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    // ============================================================
    // Click -> inverse projection
    // ============================================================
    container.addEventListener('click', (e) => {
      if (dragging || dragMoved) return;
      const rect = container.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const geo = screenToGeo(sx, sy);
      const proj = screenToProj(sx, sy);
      updateReadout(geo, proj);
      if (geo) {
        flashCrosshair(sx, sy);
      }
    });

    function updateReadout(geo, proj) {
      document.getElementById('out-lat').textContent = geo ? geo.lat.toFixed(5) + '°' : '—';
      document.getElementById('out-lon').textContent = geo ? normalizeLon(geo.lon).toFixed(5) + '°' : '—';
      document.getElementById('out-x').textContent = proj ? proj.x.toFixed(5) : '—';
      document.getElementById('out-y').textContent = proj ? proj.y.toFixed(5) : '—';
    }

    function normalizeLon(lon) {
      while (lon <= -180) lon += 360;
      while (lon > 180) lon -= 360;
      return lon;
    }

    function flashCrosshair(sx, sy) {
      const lineH = overlayGroup.line(sx - 10, sy, sx + 10, sy).stroke({ color: 'var(--accent)', width: 2 }).attr({ 'pointer-events': 'none' });
      const lineV = overlayGroup.line(sx, sy - 10, sx, sy + 10).stroke({ color: 'var(--accent)', width: 2 }).attr({ 'pointer-events': 'none' });
      setTimeout(() => { lineH.remove(); lineV.remove(); }, 800);
    }

    // ============================================================
    // Marker plotting
    // ============================================================
    function plotMarker(lat, lon) {
      lat = clamp(lat, -90, 90);
      lon = normalizeLon(lon);
      const p = equalEarthForward(lon, lat);

      // Group for marker in projection space so it pans/zooms with map
      const g = markerGroup.group();
      g.circle(8 / baseScale)
        .center(p.x, p.y)
        .fill('var(--marker)')
        .stroke({ color: '#fff', width: 1.5 / baseScale });
      g.circle(8 / baseScale)
        .center(p.x, p.y)
        .fill('none')
        .stroke({ color: 'var(--marker)', width: 1 / baseScale })
        .addClass('marker-pulse');

      updateReadout({ lat, lon }, p);
    }

    function clearMarkers() {
      markerGroup.clear();
    }

    // ============================================================
    // UI wiring
    // ============================================================
    document.getElementById('btn-plot').addEventListener('click', () => {
      const lat = parseFloat(document.getElementById('in-lat').value);
      const lon = parseFloat(document.getElementById('in-lon').value);
      if (!isNaN(lat) && !isNaN(lon)) {
        plotMarker(lat, lon);
      }
    });

    document.getElementById('btn-reset').addEventListener('click', resetView);
    document.getElementById('btn-clear').addEventListener('click', clearMarkers);
    document.getElementById('btn-zoom-in').addEventListener('click', () => zoomAt(width / 2, height / 2, 1.4));
    document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAt(width / 2, height / 2, 0.72));

    // Resize handling
    window.addEventListener('resize', () => {
      width = container.clientWidth;
      height = container.clientHeight;
      draw.viewbox(0, 0, width, height);
      const oldBase = baseScale;
      baseScale = Math.min(width, height) / (FULL_WIDTH_RAD * 0.85);
      // Keep apparent zoom and center stable
      scale = scale * (baseScale / oldBase);
      panX = panX * (baseScale / oldBase);
      panY = panY * (baseScale / oldBase);
      applyTransform();
    });
  </script>
</body>
</html>
