<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equal Earth Interactive World Map</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    #land path { fill-rule: evenodd; }
    .map-btn {
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 600;
      background: #1e293b;
      color: #67e8f9;
      border: 1px solid #0e7490;
      transition: all 0.15s ease;
    }
    .map-btn:hover { background: #164e63; color: #fff; }
    .coord-input {
      width: 5rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      background: #1e293b;
      color: #ecfeff;
      border: 1px solid #475569;
      font-size: 0.75rem;
    }
    .coord-input:focus { outline: none; border-color: #06b6d4; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-950 text-cyan-50 flex flex-col">
  <header class="flex-none px-4 py-3 border-b border-slate-800 bg-slate-900/80 backdrop-blur flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold tracking-wide text-cyan-400">Equal Earth Interactive Map</h1>
      <p class="text-[11px] text-slate-400">Wheel to zoom · drag to pan · click for inverse coordinates</p>
    </div>
    <div class="text-[11px] text-slate-500">SVG.js + Equal Earth projection</div>
  </header>

  <main class="flex-1 relative">
    <!-- Map container -->
    <div id="map" class="absolute inset-0 cursor-crosshair bg-slate-950"></div>

    <!-- Controls -->
    <div class="absolute top-4 left-4 flex flex-col gap-3 p-3 rounded-lg bg-slate-900/90 border border-slate-700 shadow-xl backdrop-blur">
      <div class="flex items-center gap-2">
        <label class="text-[10px] uppercase text-slate-400 w-6">Lat</label>
        <input id="lat" type="number" step="any" placeholder="0" class="coord-input" />
        <label class="text-[10px] uppercase text-slate-400 w-6">Lon</label>
        <input id="lon" type="number" step="any" placeholder="0" class="coord-input" />
      </div>
      <div class="flex gap-2">
        <button id="addMarker" class="map-btn">Add marker</button>
        <button id="resetView" class="map-btn">Reset view</button>
      </div>
      <div class="flex gap-2">
        <button data-lat="35.6762" data-lon="139.6503" class="preset map-btn">Tokyo</button>
        <button data-lat="51.5074" data-lon="-0.1278" class="preset map-btn">London</button>
        <button data-lat="40.7128" data-lon="-74.0060" class="preset map-btn">NYC</button>
      </div>
    </div>

    <!-- Coordinate readout -->
    <div id="readout" class="absolute hidden pointer-events-none px-3 py-2 rounded bg-slate-900/95 border border-cyan-500/50 text-cyan-300 text-xs shadow-2xl z-10">
      Lat: <span id="rLat">--</span>°, Lon: <span id="rLon">--</span>°
    </div>

    <!-- Loading indicator -->
    <div id="loading" class="absolute bottom-4 right-4 px-3 py-2 rounded bg-slate-900/90 border border-slate-700 text-xs text-cyan-300">
      Loading world topology…
    </div>
  </main>

  <script>
    // ---------- Equal Earth projection constants ----------
    const A1 =  1.340264;
    const A2 = -0.081106;
    const A3 =  0.000893;
    const A4 =  0.003796;
    const D2R = Math.PI / 180;
    const R2D = 180 / Math.PI;
    const SQRT3 = Math.sqrt(3);

    function equalEarthForward(lon, lat, lambda0 = 0) {
      const phi = lat * D2R;
      const lambda = (lon - lambda0) * D2R;
      const sinTheta = (SQRT3 / 2) * Math.sin(phi);
      const theta = Math.asin(Math.max(-1, Math.min(1, sinTheta)));
      const t2 = theta * theta;
      const t6 = t2 * t2 * t2;
      const t8 = t6 * t2;
      const denom = 3 * (9 * A4 * t8 + 7 * A3 * t6 + 3 * A2 * t2 + A1);
      const x = (2 * SQRT3 * lambda * Math.cos(theta)) / denom;
      const y = A4 * theta * t8 + A3 * theta * t6 + A2 * theta * t2 + A1 * theta;
      return [x, y];
    }

    function equalEarthInverse(x, y, lambda0 = 0) {
      // Vertical extent of the projection
      const yMax = equalEarthForward(0, 90)[1];
      const yClamped = Math.max(-yMax, Math.min(yMax, y));

      // Newton–Raphson: solve y = p(theta)
      let theta = yClamped / A1;
      theta = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, theta));
      for (let i = 0; i < 16; i++) {
        const t2 = theta * theta;
        const t6 = t2 * t2 * t2;
        const t8 = t6 * t2;
        const p  = A4 * theta * t8 + A3 * theta * t6 + A2 * theta * t2 + A1 * theta;
        const dp = 9 * A4 * t8 + 7 * A3 * t6 + 3 * A2 * t2 + A1;
        const delta = (p - yClamped) / dp;
        theta -= delta;
        if (Math.abs(delta) < 1e-12) break;
      }

      const t2 = theta * theta;
      const t6 = t2 * t2 * t2;
      const t8 = t6 * t2;
      const denom = 3 * (9 * A4 * t8 + 7 * A3 * t6 + 3 * A2 * t2 + A1);
      const cosTheta = Math.cos(theta);

      let lambda = 0;
      if (Math.abs(cosTheta) > 1e-12) {
        lambda = (x * denom) / (2 * SQRT3 * cosTheta);
      }

      const sinPhi = (2 / SQRT3) * Math.sin(theta);
      const phi = Math.asin(Math.max(-1, Math.min(1, sinPhi)));

      let lon = lambda * R2D + lambda0;
      lon = ((lon + 540) % 360) - 180;
      return [lon, phi * R2D];
    }

    function projectPoint(lon, lat) {
      return equalEarthForward(lon, lat);
    }

    function fmt(n) { return (+n).toFixed(4); }

    // ---------- SVG setup ----------
    const width = 960;
    const height = 500;
    const svg = SVG().addTo('#map').size('100%', '100%').viewbox(0, 0, width, height);

    // Groups are nested inside the transform group so pan/zoom applies to everything
    const worldGroup = svg.group().attr('id', 'world-group');
    const graticuleGroup = worldGroup.group().attr('id', 'graticule');
    const landGroup = worldGroup.group().attr('id', 'land');
    const markersGroup = worldGroup.group().attr('id', 'markers');

    // Approximate projected extents for the unit-sphere Equal Earth projection
    const sample = projectPoint(180, 0);
    const xMax = Math.abs(sample[0]);
    const yMax = Math.abs(equalEarthForward(0, 90)[1]);
    const baseScale = Math.min(width / (xMax * 2.2), height / (yMax * 2.2));

    let s = baseScale;
    let tx = width / 2;
    let ty = height / 2;

    function applyTransform() {
      // scale(s, -s) keeps north pointing up in SVG coordinates
      worldGroup.attr('transform', `translate(${tx}, ${ty}) scale(${s}, ${-s})`);
    }
    applyTransform();

    // ---------- Graticule ----------
    function buildGraticule() {
      const step = 5;
      // Parallels
      for (let lat = -90; lat <= 90; lat += 30) {
        let d = '';
        for (let lon = -180; lon <= 180; lon += step) {
          const [x, y] = projectPoint(lon, lat);
          d += (lon === -180 ? 'M' : 'L') + fmt(x) + ',' + fmt(y);
        }
        graticuleGroup.path(d).stroke({ color: '#334155', width: 0.008 }).fill('none');
      }
      // Meridians
      for (let lon = -180; lon <= 180; lon += 30) {
        let d = '';
        for (let lat = -90; lat <= 90; lat += step) {
          const [x, y] = projectPoint(lon, lat);
          d += (lat === -90 ? 'M' : 'L') + fmt(x) + ',' + fmt(y);
        }
        graticuleGroup.path(d).stroke({ color: '#334155', width: 0.008 }).fill('none');
      }
    }
    buildGraticule();

    // ---------- World land ----------
    function ringToPath(ring) {
      if (!ring || ring.length === 0) return '';
      let d = '';
      ring.forEach(([lon, lat], i) => {
        const [x, y] = projectPoint(lon, lat);
        d += (i === 0 ? 'M' : 'L') + fmt(x) + ',' + fmt(y);
      });
      d += 'Z';
      return d;
    }

    function geometryToPath(geom) {
      if (geom.type === 'Polygon') {
        return geom.coordinates.map(ringToPath).join(' ');
      }
      if (geom.type === 'MultiPolygon') {
        return geom.coordinates
          .map(polygon => polygon.map(ringToPath).join(' '))
          .join(' ');
      }
      return '';
    }

    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r => r.json())
      .then(topology => {
        const fc = topojson.feature(topology, topology.objects.countries);
        fc.features.forEach(f => {
          const d = geometryToPath(f.geometry);
          if (d) {
            landGroup.path(d)
              .fill('#0ea5e9')
              .stroke({ color: '#082f49', width: 0.01 })
              .opacity(0.75);
          }
        });
        document.getElementById('loading').classList.add('hidden');
      })
      .catch(err => {
        console.error('Map load failed:', err);
        document.getElementById('loading').textContent = 'Map data unavailable; graticule only.';
        document.getElementById('loading').classList.remove('text-cyan-300');
        document.getElementById('loading').classList.add('text-rose-400');
      });

    // ---------- Markers ----------
    function addMarker(lon, lat, label = null) {
      const [x, y] = projectPoint(lon, lat);
      const g = markersGroup.group();
      g.circle(0.05).center(x, y).fill('#f43f5e').stroke({ color: '#fff', width: 0.015 });
      // subtle ring
      g.circle(0.12).center(x, y).fill('none').stroke({ color: '#f43f5e', width: 0.01 }).opacity(0.5);
      if (label) {
        g.text(label).font({ size: 0.12, family: 'monospace' }).fill('#e2e8f0').move(x + 0.1, y - 0.18);
      }
      // Log for verification
      console.log('Marker added:', { lon, lat, projected: { x, y } });
    }

    // ---------- Interaction: zoom / pan / click ----------
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let lastX = 0, lastY = 0;
    let hasDragged = false;

    function screenToLocal(svgX, svgY) {
      // transform = translate(tx,ty) scale(s,-s)
      return {
        x: (svgX - tx) / s,
        y: -(svgY - ty) / s
      };
    }

    function getSVGPoint(clientX, clientY) {
      const pt = svg.node.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      return pt.matrixTransform(svg.node.getScreenCTM().inverse());
    }

    function showReadout(clientX, clientY, lat, lon) {
      const el = document.getElementById('readout');
      document.getElementById('rLat').textContent = lat.toFixed(4);
      document.getElementById('rLon').textContent = lon.toFixed(4);
      el.style.left = (clientX + 14) + 'px';
      el.style.top = (clientY + 14) + 'px';
      el.classList.remove('hidden');
      clearTimeout(window._readoutTimer);
      window._readoutTimer = setTimeout(() => el.classList.add('hidden'), 3500);
      console.log('Inverse clicked:', { lat, lon });
    }

    svg.node.addEventListener('wheel', e => {
      e.preventDefault();
      const pt = getSVGPoint(e.clientX, e.clientY);
      const local = screenToLocal(pt.x, pt.y);
      const factor = e.deltaY < 0 ? 1.15 : 0.87;
      const newS = Math.max(baseScale * 0.25, Math.min(baseScale * 20, s * factor));
      tx = pt.x - local.x * newS;
      ty = pt.y + local.y * newS;
      s = newS;
      applyTransform();
    }, { passive: false });

    svg.node.addEventListener('mousedown', e => {
      isDragging = true;
      hasDragged = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      tx += dx;
      ty += dy;
      lastX = e.clientX;
      lastY = e.clientY;
      if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 3) hasDragged = true;
      applyTransform();
    });

    window.addEventListener('mouseup', e => {
      if (!isDragging) return;
      isDragging = false;
      if (!hasDragged) {
        const pt = getSVGPoint(e.clientX, e.clientY);
        const local = screenToLocal(pt.x, pt.y);
        const [lon, lat] = equalEarthInverse(local.x, local.y);
        showReadout(e.clientX, e.clientY, lat, lon);
      }
    });

    // ---------- UI wiring ----------
    document.getElementById('addMarker').addEventListener('click', () => {
      const lat = parseFloat(document.getElementById('lat').value);
      const lon = parseFloat(document.getElementById('lon').value);
      if (Number.isNaN(lat) || Number.isNaN(lon)) return;
      addMarker(lon, lat);
      document.getElementById('lat').value = '';
      document.getElementById('lon').value = '';
    });

    document.querySelectorAll('.preset').forEach(btn => {
      btn.addEventListener('click', () => {
        const lat = parseFloat(btn.dataset.lat);
        const lon = parseFloat(btn.dataset.lon);
        addMarker(lon, lat, btn.textContent);
      });
    });

    document.getElementById('resetView').addEventListener('click', () => {
      s = baseScale;
      tx = width / 2;
      ty = height / 2;
      applyTransform();
    });

    // Add a few demo markers
    addMarker(139.6503, 35.6762, 'Tokyo');
    addMarker(-0.1278, 51.5074, 'London');
    addMarker(-74.0060, 40.7128, 'NYC');
  </script>
</body>
</html>
