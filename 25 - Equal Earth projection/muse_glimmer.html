<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Equal Earth – SVG.js Interactive Map</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eef}
  #map{width:100%;height:100%}
  #info{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);
        padding:.5em .8em;border:1px solid #ccc;font-family:system-ui,sans-serif;
        border-radius:6px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2/dist/svg.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<svg id="map"></svg>
<div id="info">Click on the map</div>
<script>
(() => {
const WIDTH=1200, HEIGHT=800;
const svg = SVG('#map').size('100%','100%').viewbox(0,0,WIDTH,HEIGHT);
const world = svg.group();
const info = document.getElementById('info');

const sqrt3 = Math.sqrt(3);
const k0 = 1.340264;

function fFac(phi){
  const t = phi/Math.PI;
  const t2 = t*t, t4=t2*t2, t6=t4*t2;
  return 1 - 1.5*t2 + 1.875*t4 - 2.1875*t6;
}
function forwardEqualEarth(lambda,phi){
  const f = fFac(phi);
  return [ lambda*sqrt3*f , phi*f*k0 ];
}
function inverseEqualEarth(x,y){
  let lo=-Math.PI/2, hi=Math.PI/2;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    const f=fFac(mid);
    const ymid=mid*f*k0;
    if(ymid<y) lo=mid; else hi=mid;
  }
  const phi=(lo+hi)/2;
  const f=fFac(phi);
  const lambda = Math.abs(f)<1e-12?0:x/(sqrt3*f);
  return [lambda,phi];
}

const projection = d3.geoProjection(forwardEqualEarth).invert(inverseEqualEarth)
  .scale(1).translate([0,0]);
const geoPath = d3.geoPath(projection);

let scale = 110, tx = WIDTH/2, ty = HEIGHT/2;
function applyTransform(){
  world.attr('transform', `translate(${tx},${ty}) scale(${scale})`);
}
applyTransform();

function worldToScreen(wx,wy){ return [wx*scale+tx, wy*scale+ty]; }
function screenToWorld(sx,sy){ return [(sx-tx)/scale, (sy-ty)/scale]; }

fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
.then(r=>r.json())
.then(data=>{
  data.features.forEach(f=>{
    const p = geoPath(f);
    if(!p) return;
    world.path(p).fill('#cce').stroke({color:'#669',width:.6});
  });
});

let dragging=false, dragStart={x:0,y:0,tx:0,ty:0}, clickStart={x:0,y:0};
const node = svg.node();
node.addEventListener('pointerdown',e=>{
  dragging=true;
  dragStart={x:e.clientX,y:e.clientY,tx,ty};
  clickStart={x:e.clientX,y:e.clientY};
});
window.addEventListener('pointermove',e=>{
  if(!dragging) return;
  tx = dragStart.tx + e.clientX - dragStart.x;
  ty = dragStart.ty + e.clientY - dragStart.y;
  applyTransform();
});
window.addEventListener('pointerup',e=>{
  if(!dragging) return;
  dragging=false;
  const dx=e.clientX-clickStart.x, dy=e.clientY-clickStart.y;
  if(Math.hypot(dx,dy)<5){
    const rect=node.getBoundingClientRect();
    const sx=e.clientX-rect.left, sy=e.clientY-rect.top;
    const [wx,wy]=screenToWorld(sx,sy);
    const [lam,phi]=inverseEqualEarth(wx,wy);
    const lon=lam*180/Math.PI, lat=phi*180/Math.PI;
    info.textContent=`Lat ${lat.toFixed(4)}°  Lon ${lon.toFixed(4)}°`;
    // place marker in world coords
    const m = world.circle(0.08).fill('#e33').stroke({color:'#fff',width:0.01});
    m.center(wx,wy);
  }
});

node.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=node.getBoundingClientRect();
  const sx=e.clientX-rect.left, sy=e.clientY-rect.top;
  const [wx,wy]=screenToWorld(sx,sy);
  const factor=e.deltaY<0?1.1:0.9;
  scale*=factor;
  tx=sx-wx*scale;
  ty=sy-wy*scale;
  applyTransform();
},{passive:false});
})();
</script>
</body>
</html>
