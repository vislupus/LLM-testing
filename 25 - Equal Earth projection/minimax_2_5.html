<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Equal Earth Projection Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.0/svg.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #a5bfdd;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #map-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #map-container:active {
            cursor: grabbing;
        }

        #info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            min-width: 280px;
        }

        #info-panel h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a2e;
        }

        #info-panel .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 16px;
        }

        .coord-display {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .coord-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .coord-row:last-child {
            margin-bottom: 0;
        }

        .coord-label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .coord-value {
            font-size: 14px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: #1a1a2e;
        }

        .instructions {
            font-size: 11px;
            color: #888;
            line-height: 1.6;
        }

        .instructions strong {
            color: #333;
        }

        #marker-list {
            margin-top: 16px;
            max-height: 150px;
            overflow-y: auto;
        }

        .marker-item {
            font-size: 10px;
            color: #666;
            padding: 4px 8px;
            background: #f9f9f9;
            border-radius: 4px;
            margin-bottom: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .legend-color.land {
            background: #d7c7ad;
        }

        .legend-color.ocean {
            background: #a5bfdd;
        }

        .legend-text {
            font-size: 11px;
            color: #666;
        }
    </style>
</head>

    <div id="info-panel">

        <div class="subtitle">Interactive World Map</div>

                <span class="coord-value" id="lat-display">--</span>
            </div>
            <div class="coord-row">
                <span class="coord-label">Longitude</span>
                <span class="coord-value" id="lon-display">--</span>
            </div>
        </div>

        <div class="instructions">
            <strong>Scroll</strong> to zoom<br>
            <strong>Drag</strong> to pan<br>
            <strong>Click</strong> to add marker
        </div>

        // ============================================
        // EQUAL EARTH PROJECTION MATH
        // ============================================

        const EqualEarth = {
            // Equal Earth projection constants
            A1: 1.340264,
            A2: -0.081106,
            A3: 0.000893,
            A4: 0.003796,

            // Forward projection: Lat/Lon -> x, y
            // lat, lon in degrees
            forward: function(lat, lon, scale = 1) {
                const latRad = lat * Math.PI / 180;
                const lonRad = lon * Math.PI / 180;

                // Equal Earth projection formula
                const sinLat = Math.sin(latRad);
                const sin2Lat = sinLat * sinLat;
                const sin4Lat = sin2Lat * sin2Lat;
                const sin6Lat = sin4Lat * sin2Lat;

                const A = this.A1;
                const B = this.A2;
                const C = this.A3;
                const D = this.A4;

                // y coordinate
                const y = (A * latRad + B * sin2Lat + C * sin4Lat + D * sin6Lat) * scale;

                // x coordinate
                const x = (lonRad * Math.cos(latRad)) * scale / (A + 2 * B * sin2Lat + 4 * C * sin4Lat + 6 * D * sin6Lat);

                return { x: x, y: -y }; // Flip y for SVG coordinate system
            },

            // Inverse projection: x, y -> Lat/Lon
            inverse: function(x, y, scale = 1) {
                y = -y; // Flip back

                // First, estimate latitude using Newton-Raphson
                let lat = y / scale; // Initial guess
                let tolerance = 1e-10;
                let maxIter = 100;

                for (let i = 0; i < maxIter; i++) {
                    const sinLat = Math.sin(lat);
                    const sin2Lat = sinLat * sinLat;
                    const sin4Lat = sin2Lat * sin2Lat;
                    const sin6Lat = sin4Lat * sin2Lat;

                    const A = this.A1;
                    const B = this.A2;
                    const C = this.A3;
                    const D = this.A4;

                    // Function whose root we want to find
                    const f = A * lat + B * sin2Lat + C * sin4Lat + D * sin6Lat - y / scale;

                    // Derivative
                    const fPrime = A + 2 * B * Math.cos(2 * lat) + 4 * C * Math.cos(4 * lat) + 6 * D * Math.cos(6 * lat);

                    const newLat = lat - f / fPrime;

                    if (Math.abs(newLat - lat) < tolerance) {
                        lat = newLat;
                        break;
                    }
                    lat = newLat;
                }

                const latDeg = lat * 180 / Math.PI;

                // Calculate longitude
                const sinLat = Math.sin(lat);
                const sin2Lat = sinLat * sinLat;
                const sin4Lat = sin2Lat * sin2Lat;
                const sin6Lat = sin4Lat * sin2Lat;

                const A = this.A1;
                const B = this.A2;
                const C = this.A3;
                const D = this.A4;

                const denominator = A + 2 * B * sin2Lat + 4 * C * sin4Lat + 6 * D * sin6Lat;
                const lonRad = (x / scale) * denominator / Math.cos(lat);
                let lonDeg = lonRad * 180 / Math.PI;

                // Normalize longitude to [-180, 180]
                while (lonDeg > 180) lonDeg -= 360;
                while (lonDeg < -180) lonDeg += 360;

                return { lat: latDeg, lon: lonDeg };
            }
        };

        // ============================================
        // MAP APPLICATION
        // ============================================

        class EqualEarthMap {
            constructor() {
                this.container = document.getElementById('map-container');
                this.width = window.innerWidth;
                this.height = window.innerHeight;

                // Create SVG
                this.draw = SVG().addTo(this.container).size('100%', '100%');

                // Map scale and offset
                this.baseScale = Math.min(this.width, this.height) / 5;
                this.offsetX = this.width / 2;
                this.offsetY = this.height / 2;

                // Zoom and pan state
                this.scale = 1;
                this.translateX = 0;
                this.translateY = 0;

                // Interaction state
                this.isDragging = false;
                this.lastX = 0;
                this.lastY = 0;

                // Markers
                this.markers = [];
                this.markerCount = 0;

                // Initialize
                this.render();
                this.setupEvents();
            }

            // Convert lat/lon to screen coordinates
            latLonToScreen(lat, lon) {
                const projected = EqualEarth.forward(lat, lon, this.baseScale);
                const x = (projected.x * this.scale) + this.offsetX + this.translateX;
                const y = (projected.y * this.scale) + this.offsetY + this.translateY;
                return { x, y };
            }

            // Convert screen coordinates to lat/lon
            screenToLatLon(screenX, screenY) {
                const mapX = (screenX - this.offsetX - this.translateX) / this.scale;
                const mapY = (screenY - this.offsetY - this.translateY) / this.scale;
                return EqualEarth.inverse(mapX, mapY, this.baseScale);
            }

            // Draw continent polygon
            drawContinent(name, coords) {
                if (coords.length < 3) return;

                // Build path string
                let pathData = '';
                const first = this.latLonToScreen(coords[0][1], coords[0][0]);
                pathData = `M ${first.x} ${first.y}`;

                for (let i = 1; i < coords.length; i++) {
                    const point = this.latLonToScreen(coords[i][1], coords[i][0]);
                    pathData += ` L ${point.x} ${point.y}`;
                }
                pathData += ' Z';

                // Draw the path
                this.draw.path(pathData)
                    .fill('#d7c7ad')
                    .stroke({ color: '#ffffff', width: 0.5 });
            }

            render() {
                // Draw background ocean
                this.draw.rect('100%', '100%').fill('#a5bfdd');

                // Draw continents
                for (const [name, coords] of Object.entries(continentData)) {
                    this.drawContinent(name, coords);
                }

                // Create marker group
                this.markerGroup = this.draw.group();
            }

            addMarker(lat, lon) {
                const pos = this.latLonToScreen(lat, lon);

                // Create marker circle
                const circle = this.markerGroup.circle(10)
                    .fill('#ef4444')
                    .stroke({ color: '#ffffff', width: 2 })
                    .center(pos.x, pos.y);

                // Create label
                const label = this.markerGroup.text(`${this.markerCount + 1}`)
                    .font({ size: 8, family: 'JetBrains Mono', anchor: 'middle' })
                    .fill('#ffffff')
                    .center(pos.x, pos.y);

                // Store marker data
                this.markers.push({
                    lat,
                    lon,
                    element: circle,
                    label: label
                });

                this.markerCount++;

                // Add to list
                const list = document.getElementById('marker-list');
                const item = document.createElement('div');
                item.className = 'marker-item';
                item.textContent = `${this.markerCount}. ${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;
                list.appendChild(item);

                return { lat, lon };
            }

            updateDisplay(lat, lon) {
                document.getElementById('lat-display').textContent = lat.toFixed(4) + '°';
                document.getElementById('lon-display').textContent = lon.toFixed(4) + '°';
            }

            setupEvents() {
                // Mouse wheel for zoom
                this.container.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                    const newScale = this.scale * zoomFactor;

                    // Limit zoom
                    if (newScale > 0.1 && newScale < 50) {
                        // Zoom toward mouse position
                        const rect = this.container.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left;
                        const mouseY = e.clientY - rect.top;

                        // Adjust translation to zoom toward mouse
                        this.translateX = mouseX - (mouseX - this.translateX) * zoomFactor;
                        this.translateY = mouseY - (mouseY - this.translateY) * zoomFactor;

                        this.scale = newScale;
                        this.rerender();
                    }
                });

                // Mouse drag for pan
                this.container.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.lastX = e.clientX;
                    this.lastY = e.clientY;
                });

                window.addEventListener('mousemove', (e) => {
                    if (this.isDragging) {
                        const dx = e.clientX - this.lastX;
                        const dy = e.clientY - this.lastY;

                        this.translateX += dx;
                        this.translateY += dy;

                        this.lastX = e.clientX;
                        this.lastY = e.clientY;

                        this.rerender();
                    }
                });

                window.addEventListener('mouseup', () => {
                    this.isDragging = false;
                });

                // Click to add marker
                this.container.addEventListener('click', (e) => {
                    if (this.isDragging) return;

                    const rect = this.container.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const coords = this.screenToLatLon(x, y);

                    // Update display
                    this.updateDisplay(coords.lat, coords.lon);

                    // Add marker
                    this.addMarker(coords.lat, coords.lon);
                });

                // Resize handler
                window.addEventListener('resize', () => {
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.offsetX = this.width / 2;
                    this.offsetY = this.height / 2;
                    this.rerender();
                });
            }

            rerender() {
                // Clear and redraw
                this.draw.clear();

                // Draw background
                this.draw.rect('100%', '100%').fill('#a5bfdd');

                // Draw continents
                for (const [name, coords] of Object.entries(continentData)) {
                    this.drawContinent(name, coords);
                }

                // Recreate marker group
                this.markerGroup = this.draw.group();

                // Redraw markers
                for (const marker of this.markers) {
                    const pos = this.latLonToScreen(marker.lat, marker.lon);

                    marker.element = this.markerGroup.circle(10)
                        .fill('#ef4444')
                        .stroke({ color: '#ffffff', width: 2 })
                        .center(pos.x, pos.y);

                    marker.label = this.markerGroup.text(`${this.markers.indexOf(marker) + 1}`)
                        .font({ size: 8, family: 'JetBrains Mono', anchor: 'middle' })
                        .fill('#ffffff')
                        .center(pos.x, pos.y);
                }
            }
        }

        // Initialize on load
        let map;
        window.addEventListener('load', () => {
            map = new EqualEarthMap();
        });
