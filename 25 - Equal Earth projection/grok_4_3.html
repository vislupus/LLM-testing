<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Equal Earth Interactive Map</title>
<style>
  body { margin:0; background:#0a1628; color:#ddd; font-family: system-ui, sans-serif; }
  #container { display:flex; flex-direction:column; height:100vh; }
  #map-container { flex:1; position:relative; overflow:hidden; }
  svg { width:100%; height:100%; background:#0a1628; }
  #overlay {
    position:absolute; top:12px; right:12px; background:rgba(10,22,40,0.9);
    padding:10px 14px; border-radius:6px; font-size:13px; border:1px solid #334466;
    min-width:220px;
  }
  #controls {
    position:absolute; bottom:12px; left:12px; background:rgba(10,22,40,0.9);
    padding:8px 12px; border-radius:6px; border:1px solid #334466; font-size:13px;
  }
  button { background:#1a3a5c; color:#fff; border:1px solid #446688; padding:4px 10px; margin:2px; border-radius:4px; cursor:pointer; }
  button:hover { background:#2a5a8c; }
  .coord { font-family:monospace; }
</style>
</head>
<body>
<div id="container">
  <div id="map-container">
    <svg id="map" width="100%" height="100%" viewBox="-2.8 -1.7 5.6 3.4"></svg>
  </div>
  
  <div id="overlay">
    <div><strong>Equal Earth Projection</strong></div>
    <div id="mouse-coords">Click map to get coordinates</div>
    <div id="marker-info" style="margin-top:8px; font-size:12px;"></div>
  </div>
  
  <div id="controls">
    <button onclick="addMarkerPrompt()">Add Marker (lat,lon)</button>
    <button onclick="resetView()">Reset View</button>
    <button onclick="addExampleMarkers()">Add Examples</button>
  </div>
</div>

<script>
// ==================== EQUAL EARTH PROJECTION ====================
const A1 = 1.340264;
const A2 = -0.081106;
const A3 = 0.000893;
const A4 = 0.003796;
const M = Math.sqrt(3) / 2;

function equalEarthForward(lat, lon) {
  const φ = lat * Math.PI / 180;
  const λ = lon * Math.PI / 180;
  const sinφ = Math.sin(φ);
  const θ = Math.asin(M * sinφ);
  const x = (2 * Math.sqrt(3 * Math.PI) / 3) * λ * Math.cos(θ);
  const y = 2 * Math.sqrt(Math.PI / 3) * 
            (θ + A2 * Math.sin(2 * θ) + A3 * Math.sin(4 * θ) + A4 * Math.sin(6 * θ));
  return { x, y };
}

function equalEarthInverse(x, y) {
  // Iterative solution for θ from y
  let θ = y / (2 * Math.sqrt(Math.PI / 3));
  for (let i = 0; i < 15; i++) {
    const sinθ = Math.sin(θ);
    const cosθ = Math.cos(θ);
    const f = 2 * Math.sqrt(Math.PI / 3) * 
              (θ + A2 * Math.sin(2 * θ) + A3 * Math.sin(4 * θ) + A4 * Math.sin(6 * θ)) - y;
    const df = 2 * Math.sqrt(Math.PI / 3) * 
               (1 + 2 * A2 * cosθ * cosθ + 4 * A3 * cosθ * cosθ * cosθ * cosθ + 
                6 * A4 * cosθ * cosθ * cosθ * cosθ * cosθ * cosθ);
    if (Math.abs(df) < 1e-12) break;
    θ -= f / df;
  }
  
  const φ = Math.asin(Math.sin(θ) / M);
  const λ = (x * 3) / (2 * Math.sqrt(3 * Math.PI) * Math.cos(θ));
  
  return {
    lat: φ * 180 / Math.PI,
    lon: λ * 180 / Math.PI
  };
}

// ==================== SVG SETUP ====================
const svg = document.getElementById('map');
const NS = "http://www.w3.org/2000/svg";

// Create main group for zoom/pan
const mapGroup = document.createElementNS(NS, "g");
svg.appendChild(mapGroup);

// ==================== DRAW GRATICULE ====================
function drawGraticule() {
  // Meridians
  for (let lon = -180; lon <= 180; lon += 30) {
    const path = document.createElementNS(NS, "path");
    let d = "";
    for (let lat = -90; lat <= 90; lat += 5) {
      const p = equalEarthForward(lat, lon);
      d += (lat === -90 ? "M" : "L") + p.x + "," + p.y + " ";
    }
    path.setAttribute("d", d);
    path.setAttribute("stroke", "#334466");
    path.setAttribute("stroke-width", "0.008");
    path.setAttribute("fill", "none");
    mapGroup.appendChild(path);
  }
  
  // Parallels
  for (let lat = -60; lat <= 60; lat += 30) {
    const path = document.createElementNS(NS, "path");
    let d = "";
    for (let lon = -180; lon <= 180; lon += 5) {
      const p = equalEarthForward(lat, lon);
      d += (lon === -180 ? "M" : "L") + p.x + "," + p.y + " ";
    }
    path.setAttribute("d", d);
    path.setAttribute("stroke", "#334466");
    path.setAttribute("stroke-width", "0.008");
    path.setAttribute("fill", "none");
    mapGroup.appendChild(path);
  }
}

// ==================== SIMPLIFIED WORLD MAP ====================
// Approximate continent outlines in Equal Earth coordinates
function drawContinents() {
  const continents = [
    // North America (simplified)
    "M -1.35,0.85 L -1.45,0.55 L -1.25,0.35 L -1.05,0.45 L -0.95,0.75 L -1.1,1.05 L -1.35,0.85",
    // South America
    "M -0.85,0.25 L -0.75,-0.15 L -0.55,-0.45 L -0.45,-0.25 L -0.55,0.15 L -0.75,0.35 L -0.85,0.25",
    // Europe/Africa
    "M 0.15,0.75 L 0.35,0.55 L 0.45,0.35 L 0.35,0.15 L 0.15,0.25 L 0.05,0.55 L 0.15,0.75",
    "M 0.25,-0.15 L 0.45,-0.55 L 0.55,-0.85 L 0.35,-0.95 L 0.15,-0.65 L 0.25,-0.15",
    // Asia
    "M 0.65,0.85 L 1.05,0.65 L 1.35,0.55 L 1.55,0.75 L 1.45,1.05 L 1.05,1.15 L 0.65,0.85",
    // Australia
    "M 1.15,-0.65 L 1.35,-0.75 L 1.45,-0.55 L 1.35,-0.35 L 1.15,-0.65"
  ];
  
  continents.forEach(d => {
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "#1a3a5c");
    path.setAttribute("stroke", "#446688");
    path.setAttribute("stroke-width", "0.015");
    mapGroup.appendChild(path);
  });
}

// ==================== ZOOM & PAN ====================
let scale = 1;
let tx = 0;
let ty = 0;
let isDragging = false;
let lastX = 0, lastY = 0;

function updateTransform() {
  mapGroup.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
}

function resetView() {
  scale = 1;
  tx = 0;
  ty = 0;
  updateTransform();
}

// Mouse wheel zoom
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  
  const zoomFactor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
  const newScale = Math.max(0.5, Math.min(12, scale * zoomFactor));
  
  // Zoom toward mouse position
  const worldX = (mouseX - tx) / scale;
  const worldY = (mouseY - ty) / scale;
  
  tx = mouseX - worldX * newScale;
  ty = mouseY - worldY * newScale;
  scale = newScale;
  
  updateTransform();
});

// Drag to pan
svg.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mouseup', () => isDragging = false);

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  tx += e.clientX - lastX;
  ty += e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  updateTransform();
});

// ==================== CLICK → INVERSE PROJECTION ====================
svg.addEventListener('click', (e) => {
  const rect = svg.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;
  
  // Convert screen to world coordinates
  const worldX = (clickX - tx) / scale;
  const worldY = (clickY - ty) / scale;
  
  const coords = equalEarthInverse(worldX, worldY);
  
  // Clamp to valid range
  coords.lat = Math.max(-89.9, Math.min(89.9, coords.lat));
  coords.lon = ((coords.lon + 180) % 360) - 180;
  
  document.getElementById('mouse-coords').innerHTML = 
    `Lat: <span class="coord">${coords.lat.toFixed(4)}°</span><br>` +
    `Lon: <span class="coord">${coords.lon.toFixed(4)}°</span>`;
});

// ==================== FORWARD PROJECTION + MARKERS ====================
const markers = [];

function addMarker(lat, lon, label = "") {
  const p = equalEarthForward(lat, lon);
  
  const g = document.createElementNS(NS, "g");
  
  // Marker circle
  const circle = document.createElementNS(NS, "circle");
  circle.setAttribute("cx", p.x);
  circle.setAttribute("cy", p.y);
  circle.setAttribute("r", "0.035");
  circle.setAttribute("fill", "#ffcc00");
  circle.setAttribute("stroke", "#000");
  circle.setAttribute("stroke-width", "0.008");
  
  // Label
  if (label) {
    const text = document.createElementNS(NS, "text");
    text.setAttribute("x", p.x);
    text.setAttribute("y", p.y - 0.06);
    text.setAttribute("fill", "#ffcc00");
    text.setAttribute("font-size", "0.04");
    text.setAttribute("text-anchor", "middle");
    text.textContent = label;
    g.appendChild(text);
  }
  
  g.appendChild(circle);
  mapGroup.appendChild(g);
  
  markers.push({ lat, lon, element: g });
  
  return g;
}

function addMarkerPrompt() {
  const input = prompt("Enter latitude,longitude (e.g. 40.7,-74.0):");
  if (!input) return;
  const parts = input.split(',').map(Number);
  if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) {
    alert("Invalid format");
    return;
  }
  const [lat, lon] = parts;
  const label = prompt("Label (optional):", `${lat.toFixed(1)},${lon.toFixed(1)}`);
  addMarker(lat, lon, label || "");
}

function addExampleMarkers() {
  // Clear existing example markers
  markers.forEach(m => m.element.remove());
  markers.length = 0;
  
  addMarker(40.7128, -74.0060, "New York");
  addMarker(51.5074, -0.1278, "London");
  addMarker(35.6762, 139.6503, "Tokyo");
  addMarker(-33.8688, 151.2093, "Sydney");
  addMarker(0, 0, "Null Island");
}

// ==================== INITIALIZATION ====================
function init() {
  drawGraticule();
  drawContinents();
  
  // Add some initial markers
  addMarker(40.7128, -74.0060, "NYC");
  addMarker(51.5074, -0.1278, "London");
  
  updateTransform();
  
  // Initial message
  document.getElementById('mouse-coords').innerHTML = 
    "Click anywhere on the map<br>to get latitude/longitude";
}

// Start
init();
</script>
</body>
</html>
