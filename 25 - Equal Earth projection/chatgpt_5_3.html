<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equal Earth Interactive World Map</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2/dist/svg.min.js"></script>
  <style>
    :root {
      --bg: #07121f;
      --panel: rgba(8, 24, 39, 0.85);
      --line: #8ad0ff;
      --line-dim: #2e648a;
      --land: #0f3552;
      --text: #ddf3ff;
      --accent: #45ffc4;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      cursor: grab;
      background: radial-gradient(circle at 20% 20%, #102942, #07121f 65%);
    }

    #map.dragging {
      cursor: grabbing;
    }

    .overlay {
      position: absolute;
      z-index: 20;
      background: var(--panel);
      border: 1px solid #2f597a;
      border-radius: 8px;
      backdrop-filter: blur(6px);
    }

    .control {
      top: 16px;
      left: 16px;
      padding: 12px;
      width: 280px;
    }

    .readout {
      bottom: 16px;
      left: 16px;
      padding: 10px 12px;
      min-width: 340px;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    input {
      width: 100%;
      background: rgba(2, 14, 24, 0.9);
      color: var(--text);
      border: 1px solid #3a6f97;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 14px;
    }

    button {
      background: #123956;
      color: var(--text);
      border: 1px solid #4f86ad;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #174a70;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div class="overlay control">
      <div class="text-sm font-semibold tracking-wide text-cyan-200">Equal Earth Projection</div>
      <div class="mt-2 text-xs text-cyan-100/90">Enter geographic coordinates (degrees) and place a marker using forward projection.</div>

      <div class="mt-3 grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs">Latitude</label>
          <input id="latInput" type="number" step="any" value="0" min="-90" max="90" />
        </div>
        <div>
          <label class="text-xs">Longitude</label>
          <input id="lonInput" type="number" step="any" value="0" min="-180" max="180" />
        </div>
      </div>

      <div class="mt-3 flex gap-2">
        <button id="addMarkerBtn">Add Marker</button>
        <button id="resetViewBtn">Reset View</button>
        <button id="clearBtn">Clear Markers</button>
      </div>

      <div class="mt-3 text-xs text-cyan-100/90">Drag to pan. Mouse wheel to zoom at cursor. Click map for inverse projection.</div>
    </div>

    <div id="readout" class="overlay readout">Click map to compute latitude/longitude.</div>
  </div>

  <script>
    const A1 = 1.340264;
    const A2 = -0.081106;
    const A3 = 0.000893;
    const A4 = 0.003796;
    const M = Math.sqrt(3) / 2;
    const EPSILON = 1e-12;

    const toRad = (deg) => deg * Math.PI / 180;
    const toDeg = (rad) => rad * 180 / Math.PI;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    function equalEarthForward(latDeg, lonDeg) {
      const phi = toRad(clamp(latDeg, -90, 90));
      const lambda = toRad((((lonDeg + 180) % 360) + 360) % 360 - 180);
      const l = Math.asin(M * Math.sin(phi));
      const l2 = l * l;
      const l6 = l2 * l2 * l2;
      const denom = M * (A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2));
      const x = lambda * Math.cos(l) / denom;
      const y = l * (A1 + A2 * l2 + l6 * (A3 + A4 * l2));
      return { x, y };
    }

    function equalEarthInverse(x, y) {
      let l = y;
      let delta = Infinity;
      let l2 = 0;
      let l6 = 0;

      for (let i = 0; i < 12 && Math.abs(delta) > EPSILON; i += 1) {
        l2 = l * l;
        l6 = l2 * l2 * l2;
        const fy = l * (A1 + A2 * l2 + l6 * (A3 + A4 * l2)) - y;
        const fpy = A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2);
        delta = fy / fpy;
        l -= delta;
      }

      l2 = l * l;
      l6 = l2 * l2 * l2;
      const lambda = M * x * (A1 + 3 * A2 * l2 + l6 * (7 * A3 + 9 * A4 * l2)) / Math.cos(l);
      const phi = Math.asin(clamp(Math.sin(l) / M, -1, 1));
      return { lat: toDeg(phi), lon: toDeg(lambda) };
    }

    const landPolygons = [
      [[-168, 72], [-145, 70], [-125, 55], [-118, 48], [-98, 50], [-88, 47], [-82, 28], [-97, 18], [-108, 24], [-117, 31], [-124, 40], [-137, 55], [-160, 62], [-168, 72]],
      [[-82, 12], [-73, 8], [-68, -2], [-63, -13], [-58, -23], [-57, -34], [-63, -50], [-71, -55], [-76, -45], [-79, -28], [-81, -10], [-82, 12]],
      [[-10, 72], [15, 72], [45, 70], [75, 63], [103, 57], [128, 54], [150, 59], [166, 66], [170, 54], [158, 46], [145, 40], [120, 30], [98, 24], [75, 30], [58, 33], [38, 30], [20, 36], [7, 44], [-5, 52], [-10, 72]],
      [[-17, 37], [2, 36], [22, 33], [33, 27], [43, 12], [49, -7], [41, -20], [31, -31], [19, -35], [5, -34], [-4, -20], [-13, 1], [-17, 20], [-17, 37]],
      [[112, -11], [128, -12], [142, -18], [151, -28], [146, -39], [133, -42], [118, -34], [112, -25], [112, -11]],
      [[-53, 60], [-44, 64], [-36, 73], [-42, 81], [-56, 79], [-65, 72], [-60, 64], [-53, 60]],
      [[-180, -64], [-140, -65], [-95, -67], [-55, -69], [-10, -70], [35, -69], [82, -67], [128, -66], [170, -65], [180, -64], [180, -80], [-180, -80], [-180, -64]]
    ];

    const draw = SVG().addTo('#map').size('100%', '100%');
    const scene = draw.group();
    const water = scene.group();
    const graticule = scene.group();
    const land = scene.group();
    const markers = scene.group();

    let viewportWidth = 0;
    let viewportHeight = 0;
    let fitScale = 1;
    let baseOffsetX = 0;
    let baseOffsetY = 0;
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let didDrag = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let startPanX = 0;
    let startPanY = 0;

    function projectLonLatToMapPoint(lon, lat) {
      const p = equalEarthForward(lat, lon);
      return { x: p.x, y: -p.y };
    }

    function mapPointToBaseScreen(pt) {
      return {
        x: pt.x * fitScale + baseOffsetX,
        y: pt.y * fitScale + baseOffsetY
      };
    }

    function mapPointToScreen(pt) {
      const base = mapPointToBaseScreen(pt);
      return {
        x: base.x * zoom + panX,
        y: base.y * zoom + panY
      };
    }

    function screenToMapPoint(screenX, screenY) {
      const baseX = (screenX - panX) / zoom;
      const baseY = (screenY - panY) / zoom;
      return {
        x: (baseX - baseOffsetX) / fitScale,
        y: (baseY - baseOffsetY) / fitScale
      };
    }

    function screenToGeo(screenX, screenY) {
      const mapPoint = screenToMapPoint(screenX, screenY);
      const inv = equalEarthInverse(mapPoint.x, -mapPoint.y);
      let lon = inv.lon;
      if (lon > 180) lon -= 360;
      if (lon < -180) lon += 360;
      return { lat: inv.lat, lon };
    }

    function computeBounds() {
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;

      for (let lat = -90; lat <= 90; lat += 1) {
        for (let lon = -180; lon <= 180; lon += 2) {
          const pt = projectLonLatToMapPoint(lon, lat);
          minX = Math.min(minX, pt.x);
          maxX = Math.max(maxX, pt.x);
          minY = Math.min(minY, pt.y);
          maxY = Math.max(maxY, pt.y);
        }
      }

      return { minX, maxX, minY, maxY };
    }

    function buildPath(points) {
      let d = '';
      points.forEach((ll, i) => {
        const pt = mapPointToBaseScreen(projectLonLatToMapPoint(ll[0], ll[1]));
        d += `${i === 0 ? 'M' : 'L'} ${pt.x.toFixed(3)} ${pt.y.toFixed(3)} `;
      });
      return `${d}Z`;
    }

    function drawGraticule() {
      graticule.clear();

      for (let lon = -180; lon <= 180; lon += 30) {
        let d = '';
        for (let lat = -89; lat <= 89; lat += 2) {
          const pt = mapPointToBaseScreen(projectLonLatToMapPoint(lon, lat));
          d += `${lat === -89 ? 'M' : 'L'} ${pt.x.toFixed(3)} ${pt.y.toFixed(3)} `;
        }
        graticule.path(d).fill('none').stroke({ color: '#27577a', width: 1 });
      }

      for (let lat = -75; lat <= 75; lat += 15) {
        let d = '';
        for (let lon = -180; lon <= 180; lon += 2) {
          const pt = mapPointToBaseScreen(projectLonLatToMapPoint(lon, lat));
          d += `${lon === -180 ? 'M' : 'L'} ${pt.x.toFixed(3)} ${pt.y.toFixed(3)} `;
        }
        graticule.path(d).fill('none').stroke({ color: '#2f6388', width: lat % 30 === 0 ? 1.2 : 0.9 });
      }
    }

    function drawLand() {
      land.clear();
      landPolygons.forEach((poly) => {
        land.path(buildPath(poly))
          .fill('#0f3552')
          .stroke({ color: '#8ad0ff', width: 1.1, opacity: 0.8 });
      });
    }

    function drawFrame() {
      water.clear();
      const boundary = [];
      for (let lon = -180; lon <= 180; lon += 2) boundary.push([lon, 89.999]);
      for (let lon = 180; lon >= -180; lon -= 2) boundary.push([lon, -89.999]);
      water.path(buildPath(boundary))
        .fill('none')
        .stroke({ color: '#9fd8ff', width: 1.5, opacity: 0.9 });
    }

    function applyViewTransform() {
      scene.transform({ translateX: panX, translateY: panY, scale: zoom, origin: [0, 0] });
    }

    function resetView() {
      zoom = 1;
      panX = 0;
      panY = 0;
      applyViewTransform();
    }

    function resizeAndRedraw() {
      const mapEl = document.getElementById('map');
      viewportWidth = mapEl.clientWidth;
      viewportHeight = mapEl.clientHeight;

      const margin = 40;
      const bounds = computeBounds();
      const mapW = bounds.maxX - bounds.minX;
      const mapH = bounds.maxY - bounds.minY;
      fitScale = Math.min((viewportWidth - margin * 2) / mapW, (viewportHeight - margin * 2) / mapH);
      baseOffsetX = (viewportWidth - mapW * fitScale) / 2 - bounds.minX * fitScale;
      baseOffsetY = (viewportHeight - mapH * fitScale) / 2 - bounds.minY * fitScale;

      drawFrame();
      drawGraticule();
      drawLand();

      markers.each(function () {
        const lon = Number(this.attr('data-lon'));
        const lat = Number(this.attr('data-lat'));
        const basePt = mapPointToBaseScreen(projectLonLatToMapPoint(lon, lat));
        this.center(basePt.x, basePt.y);
      });

      applyViewTransform();
    }

    function addMarker(lat, lon) {
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        return;
      }
      const basePt = mapPointToBaseScreen(projectLonLatToMapPoint(lon, lat));
      const marker = markers.circle(8).center(basePt.x, basePt.y).fill('#45ffc4').stroke({ color: '#b5ffe8', width: 1.2 });
      marker.attr('data-lat', lat);
      marker.attr('data-lon', lon);
    }

    function eventToLocalPoint(evt) {
      const rect = draw.node.getBoundingClientRect();
      return {
        x: evt.clientX - rect.left,
        y: evt.clientY - rect.top
      };
    }

    const mapNode = document.getElementById('map');
    const readoutNode = document.getElementById('readout');

    mapNode.addEventListener('wheel', (evt) => {
      evt.preventDefault();
      const pt = eventToLocalPoint(evt);
      const oldZoom = zoom;
      const factor = evt.deltaY < 0 ? 1.12 : 0.89;
      zoom = clamp(zoom * factor, 0.6, 20);
      const ratio = zoom / oldZoom;

      panX = pt.x - (pt.x - panX) * ratio;
      panY = pt.y - (pt.y - panY) * ratio;
      applyViewTransform();
    }, { passive: false });

    mapNode.addEventListener('mousedown', (evt) => {
      isDragging = true;
      didDrag = false;
      dragStartX = evt.clientX;
      dragStartY = evt.clientY;
      startPanX = panX;
      startPanY = panY;
      mapNode.classList.add('dragging');
    });

    window.addEventListener('mousemove', (evt) => {
      if (!isDragging) return;
      const dx = evt.clientX - dragStartX;
      const dy = evt.clientY - dragStartY;
      if (Math.abs(dx) + Math.abs(dy) > 3) {
        didDrag = true;
      }
      panX = startPanX + dx;
      panY = startPanY + dy;
      applyViewTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      mapNode.classList.remove('dragging');
    });

    mapNode.addEventListener('click', (evt) => {
      if (didDrag) return;
      const pt = eventToLocalPoint(evt);
      const geo = screenToGeo(pt.x, pt.y);
      const markerMapPt = screenToMapPoint(pt.x, pt.y);
      const markerScreenPt = mapPointToScreen(markerMapPt);
      console.log('Inverse projection click:', geo);
      readoutNode.textContent = `Clicked screen: (${markerScreenPt.x.toFixed(1)}, ${markerScreenPt.y.toFixed(1)}) | Latitude: ${geo.lat.toFixed(6)} deg | Longitude: ${geo.lon.toFixed(6)} deg`;
    });

    document.getElementById('addMarkerBtn').addEventListener('click', () => {
      const lat = Number(document.getElementById('latInput').value);
      const lon = Number(document.getElementById('lonInput').value);
      addMarker(lat, lon);
      const p = projectLonLatToMapPoint(lon, lat);
      readoutNode.textContent = `Forward projection -> lat ${lat.toFixed(4)} deg, lon ${lon.toFixed(4)} deg maps to projected (x=${p.x.toFixed(6)}, y=${(-p.y).toFixed(6)})`; 
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      markers.clear();
    });

    document.getElementById('resetViewBtn').addEventListener('click', () => {
      resetView();
    });

    window.addEventListener('resize', resizeAndRedraw);

    resizeAndRedraw();
    addMarker(0, 0);
  </script>
</body>
</html>
