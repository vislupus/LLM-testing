<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Equal Earth World Map</title>
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0.16/dist/svg.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            overflow: hidden;
        }
        
        #map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #0c4a6e 0%, #1e40af 100%);
        }
        
        #svg-map {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        
        #svg-map:active {
            cursor: grabbing;
        }
        
        .country-path {
            fill: #1e40af;
            stroke: #3b82f6;
            stroke-width: 0.3;
            vector-effect: non-scaling-stroke;
        }
        
        .country-path:hover {
            fill: #3b82f6;
        }
        
        #coordinates-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.95);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            z-index: 1000;
        }
        
        #coordinates-display.hidden {
            display: none;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            font-size: 14px;
            color: #cbd5e1;
            max-width: 300px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            z-index: 1000;
        }
        
        #instructions h3 {
            margin: 0 0 12px 0;
            font-size: 18px;
            color: #93c5fd;
            font-weight: 700;
        }
        
        #instructions ul {
            margin: 0;
            padding-left: 24px;
        }
        
        #instructions li {
            margin-bottom: 6px;
            line-height: 1.4;
        }
        
        #instructions strong {
            color: #bfdbfe;
        }
        
        .marker {
            fill: #ef4444;
            stroke: #ffffff;
            stroke-width: 1.5;
            vector-effect: non-scaling-stroke;
        }
        
        .marker-label {
            font-size: 11px;
            font-weight: 600;
            fill: #f1f5f9;
            text-anchor: middle;
            dominant-baseline: hanging;
            stroke: #0f172a;
            stroke-width: 0.5;
        }
        
        .reference-marker {
            fill: #f59e0b;
            stroke: #ffffff;
            stroke-width: 1;
            vector-effect: non-scaling-stroke;
        }
        
        .reference-label {
            font-size: 9px;
            font-weight: 600;
            fill: #f8fafc;
            text-anchor: middle;
            stroke: #0f172a;
            stroke-width: 0.3;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="svg-map"></div>
        <div id="coordinates-display" class="hidden">Lat: <span id="lat-value">0.000</span>°, Lng: <span id="lng-value">0.000</span>°</div>
        <div id="instructions">
            <h3>Equal Earth Interactive Map</h3>
            <ul>
                <li><strong>Drag</strong> to pan the map</li>
                <li><strong>Scroll</strong> to zoom in/out</li>
                <li><strong>Click</strong> anywhere to show coordinates</li>
                <li><strong>Double-click</strong> to add a marker</li>
            </ul>
        </div>
    </div>

    <script>
        // Equal Earth Projection Constants
        const A1 = 1.340264;
        const A2 = -0.081106;
        const A3 = 0.000893;
        const A4 = 0.003796;
        const M = Math.sqrt(3) / 2.0;
        const MAX_Y = 1.3173627591574; // Maximum y value for 90° latitude
        const EPS = 1e-11;
        const MAX_ITER = 12;
        
        // Global variables for SVG and transformation
        let svg, draw, currentTransform;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;
        let markers = [];
        
        // Initialize the map
        function initMap() {
            // Create SVG canvas
            const container = document.getElementById('svg-map');
            svg = SVG().addTo(container).size('100%', '100%');
            draw = svg.group();
            
            // Set initial transform
            currentTransform = {
                x: 0,
                y: 0,
                scale: 1,
                width: container.clientWidth,
                height: container.clientHeight
            };
            
            // Draw the world map
            drawWorldMap();
            
            // Apply initial transform
            updateTransform();
            
            // Set up event listeners
            setupEventListeners();
        }
        
        // Equal Earth Forward Projection (lat, lng in degrees -> x, y)
        function project(lat, lng) {
            // Convert to radians
            const phi = lat * Math.PI / 180;
            const lambda = lng * Math.PI / 180;
            
            // For spherical case (simplified), beta = phi
            const beta = phi;
            
            // Calculate theta
            const sinBeta = Math.sin(beta);
            const sinTheta = M * sinBeta;
            
            // Clamp to avoid domain errors
            const clampedSinTheta = Math.max(-1, Math.min(1, sinTheta));
            const theta = Math.asin(clampedSinTheta);
            
            // Calculate polynomial terms
            const theta2 = theta * theta;
            const theta6 = theta2 * theta2 * theta2;
            
            // Y coordinate
            const y = theta * (A1 + A2 * theta2 + theta6 * (A3 + A4 * theta2));
            
            // X coordinate denominator (derivative of y polynomial)
            const denom = M * (A1 + 3 * A2 * theta2 + theta6 * (7 * A3 + 9 * A4 * theta2));
            
            // Avoid division by zero
            const x = denom !== 0 ? lambda * Math.cos(theta) / denom : 0;
            
            return { x: x, y: y };
        }
        
        // Equal Earth Inverse Projection (x, y -> lat, lng in degrees)
        function inverseProject(x, y) {
            // Clamp y to valid range
            const clampedY = Math.max(-MAX_Y, Math.min(MAX_Y, y));
            
            // Newton-Raphson iteration to solve for theta
            let theta = clampedY; // Initial guess
            let converged = false;
            
            for (let i = 0; i < MAX_ITER; i++) {
                const theta2 = theta * theta;
                const theta6 = theta2 * theta2 * theta2;
                
                // Function value: f(theta) = theta * poly(theta) - y
                const f = theta * (A1 + A2 * theta2 + theta6 * (A3 + A4 * theta2)) - clampedY;
                
                // Derivative: f'(theta) = A1 + 3*A2*theta^2 + theta^6*(7*A3 + 9*A4*theta^2)
                const fder = A1 + 3 * A2 * theta2 + theta6 * (7 * A3 + 9 * A4 * theta2);
                
                if (Math.abs(fder) < EPS) {
                    // If derivative is too small, break to avoid division by zero
                    break;
                }
                
                const delta = f / fder;
                theta -= delta;
                
                if (Math.abs(delta) < EPS) {
                    converged = true;
                    break;
                }
            }
            
            // Ensure theta is within valid range [-π/3, π/3] since sin(theta) = M * sin(beta)
            const maxTheta = Math.asin(M); // This should be approximately π/3
            theta = Math.max(-maxTheta, Math.min(maxTheta, theta));
            
            // Calculate latitude
            const sinTheta = Math.sin(theta);
            const sinBeta = sinTheta / M;
            // Clamp sinBeta to [-1, 1] to avoid domain errors in asin
            const clampedSinBeta = Math.max(-1, Math.min(1, sinBeta));
            const beta = Math.asin(clampedSinBeta);
            const lat = beta * 180 / Math.PI;
            
            // Calculate longitude
            const cosTheta = Math.cos(theta);
            let lng = 0;
            
            if (Math.abs(cosTheta) > EPS) {
                const theta2 = theta * theta;
                const theta6 = theta2 * theta2 * theta2;
                const numerator = x * M * (A1 + 3 * A2 * theta2 + theta6 * (7 * A3 + 9 * A4 * theta2));
                lng = (numerator / cosTheta) * 180 / Math.PI;
            } else {
                // At poles, longitude is undefined, so we keep it as 0 or input x-based
                lng = x * 180 / Math.PI;
            }
            
            // Normalize longitude to [-180, 180]
            let normalizedLng = ((lng + 180) % 360 + 360) % 360 - 180;
            
            // Handle edge case where longitude might be exactly 180 or -180
            if (Math.abs(normalizedLng) === 180) {
                normalizedLng = 180;
            }
            
            return { lat: lat, lng: normalizedLng };
        }
        
        // Convert projected coordinates to screen coordinates
        function projectToScreen(projX, projY) {
            const scale = currentTransform.scale;
            const offsetX = currentTransform.x;
            const offsetY = currentTransform.y;
            const centerX = currentTransform.width / 2;
            const centerY = currentTransform.height / 2;
            
            const screenX = centerX + (projX * scale) + offsetX;
            const screenY = centerY - (projY * scale) + offsetY;
            
            return { x: screenX, y: screenY };
        }
        
        // Convert screen coordinates to projected coordinates
        function screenToProject(screenX, screenY) {
            const scale = currentTransform.scale;
            const offsetX = currentTransform.x;
            const offsetY = currentTransform.y;
            const centerX = currentTransform.width / 2;
            const centerY = currentTransform.height / 2;
            
            const projX = (screenX - centerX - offsetX) / scale;
            const projY = -(screenY - centerY - offsetY) / scale;
            
            return { x: projX, y: projY };
        }
        
        // Screen to geographic coordinates
        function screenToGeo(screenX, screenY) {
            const proj = screenToProject(screenX, screenY);
            return inverseProject(proj.x, proj.y);
        }
        
        // Geographic to screen coordinates
        function geoToScreen(lat, lng) {
            const proj = project(lat, lng);
            return projectToScreen(proj.x, proj.y);
        }
        
        // Draw simplified world map (coastlines as polygons)
        function drawWorldMap() {
            // Generate coastlines by creating a grid of points and connecting them
            // This is a simplified approach - in practice, you'd use real GeoJSON data
            
            // Create meridians (lines of longitude)
            for (let lng = -180; lng <= 180; lng += 30) {
                const pathData = [];
                for (let lat = -90; lat <= 90; lat += 5) {
                    const screen = geoToScreen(lat, lng);
                    if (lat === -90) {
                        pathData.push(`M ${screen.x} ${screen.y}`);
                    } else {
                        pathData.push(`L ${screen.x} ${screen.y}`);
                    }
                }
                draw.path(pathData.join(' '))
                    .stroke({ color: '#4a7ca5', width: 0.3, opacity: 0.3 })
                    .fill('none')
                    .attr('vector-effect', 'non-scaling-stroke');
            }
            
            // Create parallels (lines of latitude)
            for (let lat = -90; lat <= 90; lat += 15) {
                const pathData = [];
                for (let lng = -180; lng <= 180; lng += 5) {
                    const screen = geoToScreen(lat, lng);
                    if (lng === -180) {
                        pathData.push(`M ${screen.x} ${screen.y}`);
                    } else {
                        pathData.push(`L ${screen.x} ${screen.y}`);
                    }
                }
                draw.path(pathData.join(' '))
                    .stroke({ color: '#4a7ca5', width: 0.3, opacity: 0.3 })
                    .fill('none')
                    .attr('vector-effect', 'non-scaling-stroke');
            }
            
            // Draw equator more prominently
            const equatorPath = [];
            for (let lng = -180; lng <= 180; lng += 2) {
                const screen = geoToScreen(0, lng);
                if (lng === -180) {
                    equatorPath.push(`M ${screen.x} ${screen.y}`);
                } else {
                    equatorPath.push(`L ${screen.x} ${screen.y}`);
                }
            }
            draw.path(equatorPath.join(' '))
                .stroke({ color: '#6b9ac4', width: 0.8, opacity: 0.6 })
                .fill('none')
                .attr('vector-effect', 'non-scaling-stroke');
            
            // Draw prime meridian more prominently
            const primeMeridianPath = [];
            for (let lat = -90; lat <= 90; lat += 2) {
                const screen = geoToScreen(lat, 0);
                if (lat === -90) {
                    primeMeridianPath.push(`M ${screen.x} ${screen.y}`);
                } else {
                    primeMeridianPath.push(`L ${screen.x} ${screen.y}`);
                }
            }
            draw.path(primeMeridianPath.join(' '))
                .stroke({ color: '#6b9ac4', width: 0.8, opacity: 0.6 })
                .fill('none')
                .attr('vector-effect', 'non-scaling-stroke');
            
            // Add some reference markers for testing
            addReferenceMarkers();
        }
        
        // Add reference markers at key locations
        function addReferenceMarkers() {
            const referencePoints = [
                { name: "North Pole", lat: 90, lng: 0 },
                { name: "South Pole", lat: -90, lng: 0 },
                { name: "Equator Prime", lat: 0, lng: 0 },
                { name: "Equator Int'l Date", lat: 0, lng: 180 },
                { name: "Tokyo", lat: 35.6762, lng: 139.6503 },
                { name: "New York", lat: 40.7128, lng: -74.0060 },
                { name: "London", lat: 51.5074, lng: -0.1278 },
                { name: "Sydney", lat: -33.8688, lng: 151.2093 }
            ];
            
            referencePoints.forEach(point => {
                const screen = geoToScreen(point.lat, point.lng);
                const marker = draw.circle(3)
                    .center(screen.x, screen.y)
                    .addClass('reference-marker');
                
                const label = draw.text(point.name)
                    .move(screen.x, screen.y + 5)
                    .font({ size: 8, family: 'Segoe UI, Arial, sans-serif', weight: '600' })
                    .addClass('reference-label');
            });
        }
        
        // Update the transform on the SVG group
        function updateTransform() {
            draw.transform({
                x: currentTransform.x,
                y: currentTransform.y,
                scale: currentTransform.scale
            });
        }
        
        // Handle mouse wheel for zooming
        function handleWheel(event) {
            event.preventDefault();
            
            const rect = event.currentTarget.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            
            // Get current projected coordinates at mouse position
            const projBefore = screenToProject(mouseX, mouseY);
            
            // Calculate zoom factor (use smaller steps for smoother zooming)
            const zoomSensitivity = 0.1;
            const zoomFactor = event.deltaY > 0 ? 1 - zoomSensitivity : 1 + zoomSensitivity;
            const newScale = Math.max(0.05, Math.min(20, currentTransform.scale * zoomFactor));
            
            // Update scale
            currentTransform.scale = newScale;
            
            // Get projected coordinates at same screen position after zoom
            const projAfter = screenToProject(mouseX, mouseY);
            
            // Adjust translation to keep mouse position fixed
            const deltaProjX = projAfter.x - projBefore.x;
            const deltaProjY = projAfter.y - projBefore.y;
            
            currentTransform.x -= deltaProjX * newScale;
            currentTransform.y -= deltaProjY * newScale;
            
            updateTransform();
        }
        
        // Handle mouse down for panning
        function handleMouseDown(event) {
            if (event.button !== 0) return; // Only left mouse button
            
            isDragging = true;
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
            event.currentTarget.style.cursor = 'grabbing';
        }
        
        // Handle mouse move for panning
        function handleMouseMove(event) {
            if (!isDragging) return;
            
            const deltaX = event.clientX - lastMouseX;
            const deltaY = event.clientY - lastMouseY;
            
            currentTransform.x += deltaX;
            currentTransform.y += deltaY;
            
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
            
            updateTransform();
        }
        
        // Handle mouse up to stop panning
        function handleMouseUp() {
            isDragging = false;
            document.getElementById('svg-map').style.cursor = 'grab';
        }
        
        // Handle click to show coordinates
        function handleClick(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const screenX = event.clientX - rect.left;
            const screenY = event.clientY - rect.top;
            
            const geo = screenToGeo(screenX, screenY);
            
            // Format coordinates with N/S and E/W
            const latDir = geo.lat >= 0 ? 'N' : 'S';
            const lngDir = geo.lng >= 0 ? 'E' : 'W';
            const formattedLat = Math.abs(geo.lat).toFixed(3) + '°' + latDir;
            const formattedLng = Math.abs(geo.lng).toFixed(3) + '°' + lngDir;
            
            // Display coordinates
            document.getElementById('lat-value').textContent = formattedLat;
            document.getElementById('lng-value').textContent = formattedLng;
            document.getElementById('coordinates-display').classList.remove('hidden');
            
            // Hide coordinates after 3 seconds
            setTimeout(() => {
                document.getElementById('coordinates-display').classList.add('hidden');
            }, 3000);
        }
        
        // Handle double click to add marker
        function handleDoubleClick(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const screenX = event.clientX - rect.left;
            const screenY = event.clientY - rect.top;
            
            const geo = screenToGeo(screenX, screenY);
            const markerScreen = geoToScreen(geo.lat, geo.lng);
            
            // Create marker
            const marker = draw.circle(8)
                .center(markerScreen.x, markerScreen.y)
                .addClass('marker');
            
            // Create label
            const label = draw.text(`${geo.lat.toFixed(1)}°, ${geo.lng.toFixed(1)}°`)
                .move(markerScreen.x, markerScreen.y + 8)
                .addClass('marker-label');
            
            markers.push({ marker, label, lat: geo.lat, lng: geo.lng });
            
            // Prevent coordinate display from double click
            event.stopPropagation();
        }
        
        // Update markers position on transform change
        function updateMarkers() {
            markers.forEach(markerObj => {
                const screenPos = geoToScreen(markerObj.lat, markerObj.lng);
                markerObj.marker.center(screenPos.x, screenPos.y);
                markerObj.label.move(screenPos.x, screenPos.y + 8);
            });
        }
        
        // Override updateTransform to also update markers
        const originalUpdateTransform = updateTransform;
        updateTransform = function() {
            originalUpdateTransform();
            updateMarkers();
        };
        
        // Set up event listeners
        function setupEventListeners() {
            const svgElement = document.querySelector('#svg-map svg');
            
            svgElement.addEventListener('wheel', handleWheel, { passive: false });
            svgElement.addEventListener('mousedown', handleMouseDown);
            svgElement.addEventListener('click', handleClick);
            svgElement.addEventListener('dblclick', handleDoubleClick);
            
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
            
            // Handle window resize
            window.addEventListener('resize', () => {
                currentTransform.width = document.getElementById('svg-map').clientWidth;
                currentTransform.height = document.getElementById('svg-map').clientHeight;
                updateTransform();
            });
        }
        
        // Test projection accuracy
        function testProjection() {
            const testPoints = [
                { lat: 0, lng: 0 },
                { lat: 45, lng: -120 },
                { lat: -30, lng: 150 },
                { lat: 89, lng: 179 },
                { lat: -89, lng: -179 }
            ];
            
            console.log("Projection Accuracy Test:");
            testPoints.forEach(point => {
                const proj = project(point.lat, point.lng);
                const inv = inverseProject(proj.x, proj.y);
                const latError = Math.abs(inv.lat - point.lat);
                const lngError = Math.abs(inv.lng - point.lng);
                console.log(`Original: (${point.lat}, ${point.lng}) -> Inverse: (${inv.lat.toFixed(6)}, ${inv.lng.toFixed(6)}) | Errors: lat=${latError.toExponential(2)}, lng=${lngError.toExponential(2)}`);
            });
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            // Uncomment the next line to see projection accuracy in console
            // testProjection();
        });
    </script>
</body>
</html>
