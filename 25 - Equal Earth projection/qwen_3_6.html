<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equal Earth Projection World Map</title>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0c14; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #e0e8f0; }
    #map-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #080a10; }
    canvas { display: none; }
    #svg-map { cursor: grab; }
    #svg-map:active { cursor: grabbing; }
    
    #overlay {
      position: fixed; top: 15px; right: 15px;
      background: rgba(15, 18, 28, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 160, 255, 0.15);
      border-radius: 10px; padding: 14px; width: 240px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      pointer-events: none;
    }
    #overlay h3 { font-size: 13px; color: #7dd3fc; margin-bottom: 8px; letter-spacing: 0.5px; }
    .coord { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; color: #8899bb; }
    .coord span { color: #ccd6f6; font-weight: 500; font-family: monospace; }
    .info { font-size: 11px; color: #556688; margin-top: 8px; line-height: 1.4; }
    
    #marker-info {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 18, 28, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 160, 255, 0.2);
      border-radius: 8px; padding: 10px 16px;
      display: none; align-items: center; gap: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #marker-info .label { color: #7dd3fc; font-size: 12px; font-weight: 600; }
    #marker-info .value { color: #e0e8f0; font-size: 13px; font-family: monospace; }
  </style>
</head>
<body>
  <div id="map-container"></div>
  
  <div id="overlay">
    <h3>🌍 Equal Earth Projection</h3>
    <div class="coord">Lat: <span id="lat-disp">--</span></div>
    <div class="coord">Lon: <span id="lon-disp">--</span></div>
    <div class="coord">Scale: <span id="zoom-disp">100%</span></div>
    <div class="info">🖱️ Scroll to zoom • Drag to pan<br>📍 Click to place marker & read coords</div>
  </div>

  <div id="marker-info">
    <span class="label">📍 Marker:</span>
    <span class="value" id="marker-coords">--</span>
  </div>

  <script>
    // ===== EQUAL EARTH PROJECTION =====
    // Reference: Šavrič, Patterson, Jenny (2018)
    // Forward: (lat, lon) -> (x, y)
    // Inverse: (x, y) -> (lat, lon)

    const EE = {
      sqrt3_2: Math.sqrt(3) / 2,
      
      forward: function(lat, lon, lon0 = 0) {
        const phi = lat * Math.PI / 180;
        const lam = (lon - lon0) * Math.PI / 180;
        
        const sinPhi = Math.sin(phi);
        const theta = Math.asin(this.sqrt3_2 * sinPhi);
        const cosTheta = Math.cos(theta);
        const cos2Theta = Math.cos(2 * theta);
        const n = this.sqrt3_2 * (2 * cos2Theta - 1);
        
        return {
          x: lam * cosTheta / n,
          y: sinPhi / n
        };
      },

      inverse: function(x, y, lon0 = 0) {
        // Solve for theta numerically from y
        // y = sin(theta) / (sqrt(3)/2 * (2*cos(2*theta) - 1))
        const targetY = y;
        let theta = 0;
        
        // Newton-Raphson iteration
        for (let i = 0; i < 20; i++) {
          const cosTheta = Math.cos(theta);
          const cos2Theta = Math.cos(2 * theta);
          const n = this.sqrt3_2 * (2 * cos2Theta - 1);
          
          const f = Math.sin(theta) / n - targetY;
          if (Math.abs(f) < 1e-10) break;
          
          // Derivative
          const sin2Theta = Math.sin(2 * theta);
          const df = (cosTheta * n - Math.sin(theta) * this.sqrt3_2 * (-4 * sin2Theta)) / (n * n);
          
          if (Math.abs(df) < 1e-10) break;
          theta -= f / df;
          theta = Math.max(-Math.PI/2, Math.min(Math.PI/2, theta));
        }
        
        // Get latitude from theta
        const sinPhi = Math.sin(theta) / this.sqrt3_2;
        const phi = Math.asin(Math.max(-1, Math.min(1, sinPhi)));
        
        // Get longitude from x
        const cosTheta = Math.cos(theta);
        const cos2Theta = Math.cos(2 * theta);
        const n = this.sqrt3_2 * (2 * cos2Theta - 1);
        const lam = x * n / cosTheta;
        
        return {
          lat: phi * 180 / Math.PI,
          lon: lam * 180 / Math.PI + lon0
        };
      }
    };

    // ===== SIMPLIFIED WORLD COASTLINES =====
    // Format: [lon, lat] pairs for each continent
    const coastlines = {
      // North America (simplified)
      "North America": [
        [-130,50], [-125,55], [-120,60], [-115,68], [-100,72], [-85,75], [-70,72], [-60,65],
        [-55,50], [-60,45], [-65,43], [-70,41], [-75,35], [-80,30], [-85,28], [-90,28], [-95,25],
        [-100,20], [-105,20], [-110,25], [-115,30], [-120,35], [-125,40], [-130,50]
      ],
      // South America (simplified)
      "South America": [
        [-80,10], [-75,12], [-70,12], [-60,8], [-50,3], [-45,0], [-40,-5], [-38,-10], [-40,-15],
        [-42,-22], [-48,-28], [-50,-30], [-55,-33], [-60,-35], [-65,-40], [-70,-50], [-75,-48],
        [-72,-40], [-70,-35], [-70,-25], [-72,-18], [-75,-10], [-78,-2], [-80,5], [-80,10]
      ],
      // Europe (simplified)
      "Europe": [
        [-10,36], [-8,40], [-5,44], [0,48], [5,50], [10,54], [12,58], [15,62], [20,65], [25,68],
        [30,70], [35,68], [40,65], [35,60], [30,55], [28,50], [25,45], [20,40], [15,38], [10,35],
        [5,38], [0,40], [-5,38], [-10,36]
      ],
      // Africa (simplified)
      "Africa": [
        [-15,12], [-10,20], [-5,30], [0,35], [10,37], [15,32], [20,33], [25,30], [30,30], [35,28],
        [40,12], [45,5], [50,0], [48,-10], [45,-15], [40,-22], [35,-28], [30,-33], [25,-34], [20,-33],
        [18,-28], [15,-20], [12,-10], [10,-2], [8,5], [5,5], [0,5], [-5,5], [-10,8], [-15,12]
      ],
      // Asia (simplified)
      "Asia": [
        [30,40], [35,42], [40,45], [50,50], [60,55], [70,60], [80,65], [90,70], [100,72], [110,70],
        [120,68], [130,65], [135,60], [140,55], [142,50], [140,45], [135,40], [130,35], [125,30],
        [120,25], [115,20], [110,15], [105,10], [100,5], [95,0], [90,5], [85,10], [80,15], [75,20],
        [70,25], [65,30], [60,35], [55,38], [50,40], [45,42], [40,40], [35,38], [30,40]
      ],
      // Australia (simplified)
      "Australia": [
        [115,-15], [120,-18], [125,-20], [130,-15], [135,-12], [140,-15], [145,-18], [150,-25],
        [153,-28], [150,-33], [148,-35], [145,-38], [140,-38], [135,-35], [130,-32], [125,-28],
        [120,-25], [115,-22], [113,-20], [115,-15]
      ],
      // Greenland
      "Greenland": [
        [-55,60], [-50,62], [-45,65], [-40,70], [-35,75], [-30,78], [-25,80], [-20,78],
        [-25,72], [-35,68], [-45,65], [-55,60]
      ],
      // Antarctica (simplified ring)
      "Antarctica": [
        [-180,-70], [-120,-72], [-60,-75], [0,-78], [60,-75], [120,-72], [180,-70], [180,-90], [-180,-90]
      ]
    };

    // ===== SETUP =====
    const container = document.getElementById('map-container');
    const draw = SVG().addTo('#map-container').size(window.innerWidth, window.innerHeight);
    
    // Background
    const bg = draw.rect(window.innerWidth, window.innerHeight).fill('#080a10');
    
    // Main map group
    const mapGroup = draw.group();
    
    // Ocean fill
    const ocean = mapGroup.rect(360, 180).fill('#0a1020').stroke({color: '#152035', width: 1});
    
    // Grid lines group
    const gridGroup = mapGroup.group();
    
    // Coastlines group
    const landGroup = mapGroup.group();
    
    // Markers group
    const markersGroup = mapGroup.group();

    // Transform state
    let state = {
      scale: 1,
      offsetX: window.innerWidth / 2,
      offsetY: window.innerHeight / 2,
      dragging: false,
      lastX: 0,
      lastY: 0,
      zoomMin: 0.5,
      zoomMax: 10
    };

    // Map scale in projected units
    const MAP_SCALE = 150; // pixels per projected unit

    function drawMap() {
      // Clear existing
      gridGroup.clear();
      landGroup.clear();
      
      // Draw graticules
      // Latitude lines every 15 degrees
      for (let lat = -75; lat <= 75; lat += 15) {
        const points = [];
        for (let lon = -180; lon <= 180; lon += 2) {
          const p = EE.forward(lat, lon);
          points.push(`${p.x * MAP_SCALE},${-p.y * MAP_SCALE}`);
        }
        gridGroup.polyline(points.join(' '))
          .fill('none')
          .stroke({ color: lat === 0 ? '#2a3a50' : '#152030', width: lat === 0 ? 1.2 : 0.6 });
      }
      
      // Longitude lines every 30 degrees
      for (let lon = -180; lon <= 180; lon += 30) {
        const points = [];
        for (let lat = -90; lat <= 90; lat += 2) {
          const p = EE.forward(lat, lon);
          points.push(`${p.x * MAP_SCALE},${-p.y * MAP_SCALE}`);
        }
        gridGroup.polyline(points.join(' '))
          .fill('none')
          .stroke({ color: lon === 0 ? '#2a3a50' : '#152030', width: lon === 0 ? 1.2 : 0.6 });
      }
      
      // Draw continents
      for (const [name, coords] of Object.entries(coastlines)) {
        const points = coords.map(([lon, lat]) => {
          const p = EE.forward(lat, lon);
          return `${p.x * MAP_SCALE},${-p.y * MAP_SCALE}`;
        });
        
        landGroup.polygon(points.join(' '))
          .fill('#1a2a3a')
          .stroke({ color: '#3a5a7a', width: 1.5 })
          .attr('data-name', name);
      }
      
      updateTransform();
    }

    function updateTransform() {
      mapGroup.transform({ 
        translateX: state.offsetX, 
        translateY: state.offsetY, 
        scale: state.scale,
        origin: [0, 0]
      });
      
      document.getElementById('zoom-disp').textContent = Math.round(state.scale * 100) + '%';
    }

    // ===== COORDINATE CONVERSION =====
    function screenToProjected(sx, sy) {
      // Convert screen coords to projected coords
      const px = (sx - state.offsetX) / state.scale;
      const py = (sy - state.offsetY) / state.scale;
      return {
        x: px / MAP_SCALE,
        y: -py / MAP_SCALE
      };
    }

    function projectedToScreen(px, py) {
      const sx = px * MAP_SCALE * state.scale + state.offsetX;
      const sy = -py * MAP_SCALE * state.scale + state.offsetY;
      return { x: sx, y: sy };
    }

    function screenToGeo(sx, sy) {
      const proj = screenToProjected(sx, sy);
      return EE.inverse(proj.x, proj.y);
    }

    function geoToScreen(lat, lon) {
      const proj = EE.forward(lat, lon);
      return projectedToScreen(proj.x, proj.y);
    }

    // ===== MARKERS =====
    let markers = [];

    function addMarker(lat, lon) {
      const screen = geoToScreen(lat, lon);
      const relX = (screen.x - state.offsetX) / state.scale;
      const relY = (screen.y - state.offsetY) / state.scale;
      
      const g = markersGroup.group();
      g.circle(10).cx(relX).cy(relY)
        .fill('none')
        .stroke({ color: '#7dd3fc', width: 2 });
      g.circle(4).cx(relX).cy(relY)
        .fill('#7dd3fc');
      
      markers.push({ g, lat, lon });
      updateMarkerInfo(lat, lon);
    }

    function updateMarkerInfo(lat, lon) {
      const el = document.getElementById('marker-info');
      el.style.display = 'flex';
      document.getElementById('marker-coords').textContent = 
        `${lat.toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${lon.toFixed(4)}° ${lon >= 0 ? 'E' : 'W'}`;
    }

    // ===== EVENT HANDLERS =====
    const svgEl = document.getElementById('svg-map') || document.querySelector('svg');

    // Mouse wheel zoom
    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      const newScale = Math.max(state.zoomMin, Math.min(state.zoomMax, state.scale * delta));
      const ratio = newScale / state.scale;
      
      state.offsetX = e.clientX - ratio * (e.clientX - state.offsetX);
      state.offsetY = e.clientY - ratio * (e.clientY - state.offsetY);
      state.scale = newScale;
      
      updateTransform();
    }, { passive: false });

    // Pan
    document.addEventListener('mousedown', (e) => {
      state.dragging = true;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      // Update coordinate display
      const geo = screenToGeo(e.clientX, e.clientY);
      document.getElementById('lat-disp').textContent = `${geo.lat.toFixed(2)}°`;
      document.getElementById('lon-disp').textContent = `${geo.lon.toFixed(2)}°`;
      
      if (state.dragging) {
        const dx = e.clientX - state.lastX;
        const dy = e.clientY - state.lastY;
        state.offsetX += dx;
        state.offsetY += dy;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        updateTransform();
      }
    });

    document.addEventListener('mouseup', () => { state.dragging = false; });

    // Click to add marker
    document.addEventListener('click', (e) => {
      // Don't add marker if it was a drag
      if (Math.abs(e.clientX - state.lastX) > 3 || Math.abs(e.clientY - state.lastY) > 3) return;
      
      const geo = screenToGeo(e.clientX, e.clientY);
      if (geo.lat < -90 || geo.lat > 90 || geo.lon < -180 || geo.lon > 180) return;
      
      addMarker(geo.lat, geo.lon);
    });

    // ===== INIT =====
    function init() {
      drawMap();
      
      // Add some example markers
      addMarker(40.7128, -74.0060); // New York
      addMarker(51.5074, -0.1278);  // London
      addMarker(-33.8688, 151.2093); // Sydney
    }

    // Start
    window.addEventListener('load', init);
    window.addEventListener('resize', () => {
      draw.size(window.innerWidth, window.innerHeight);
      bg.size(window.innerWidth, window.innerHeight);
      state.offsetX = window.innerWidth / 2;
      state.offsetY = window.innerHeight / 2;
      updateTransform();
    });
  </script>
</body>
</html>
