        // ============================================================================
        // EQUAL EARTH PROJECTION IMPLEMENTATION
        // Based on the Equal Earth projection formulas
        // ============================================================================
        
        const EqualEarth = {
            // Projection constants
            A1: 1.340264,
            A2: -0.081106,
            A3: 0.000893,
            A4: 0.003796,
            M: Math.sqrt(3) / 2,
            iterations: 12,
            epsilon: 1e-12,
            
            // Earth radius for scaling
            radius: 177.158,
            
            // Convert degrees to radians
            toRad: (deg) => deg * Math.PI / 180,
            
            // Convert radians to degrees
            toDeg: (rad) => rad * 180 / Math.PI,
            
            // Forward projection: lat/lng → x/y
            forward: function(lng, lat) {
                const lambda = EqualEarth.toRad(lng);
                const phi = EqualEarth.toRad(lat);
                
                // Calculate parametric latitude
                const l = Math.asin(EqualEarth.M * Math.sin(phi));
                const l2 = l * l;
                const l6 = l2 * l2 * l2;
                
                // Calculate x and y
                const denom = EqualEarth.M * (EqualEarth.A1 + 3 * EqualEarth.A2 * l2 + l6 * (7 * EqualEarth.A3 + 9 * EqualEarth.A4 * l2));
                const x = lambda * Math.cos(l) / denom;
                const y = l * (EqualEarth.A1 + EqualEarth.A2 * l2 + l6 * (EqualEarth.A3 + EqualEarth.A4 * l2));
                
                return { x, y };
            },
            
            // Inverse projection: x/y → lat/lng
            invert: function(x, y) {
                let l = y;
                
                // Newton-Raphson iteration to find l
                for (let i = 0; i < EqualEarth.iterations; i++) {
                    const l2 = l * l;
                    const l6 = l2 * l2 * l2;
                    const fy = l * (EqualEarth.A1 + EqualEarth.A2 * l2 + l6 * (EqualEarth.A3 + EqualEarth.A4 * l2)) - y;
                    const fpy = EqualEarth.A1 + 3 * EqualEarth.A2 * l2 + l6 * (7 * EqualEarth.A3 + 9 * EqualEarth.A4 * l2);
                    const delta = fy / fpy;
                    l -= delta;
                    if (Math.abs(delta) < EqualEarth.epsilon) break;
                }
                
                const l2 = l * l;
                const l6 = l2 * l2 * l2;
                
                // Calculate longitude and latitude
                const denom = EqualEarth.M * (EqualEarth.A1 + 3 * EqualEarth.A2 * l2 + l6 * (7 * EqualEarth.A3 + 9 * EqualEarth.A4 * l2));
                const lambda = EqualEarth.M * x * (EqualEarth.A1 + 3 * EqualEarth.A2 * l2 + l6 * (7 * EqualEarth.A3 + 9 * EqualEarth.A4 * l2)) / Math.cos(l);
                const phi = Math.asin(Math.sin(l) / EqualEarth.M);
                
                return {
                    lng: EqualEarth.toDeg(lambda),
                    lat: EqualEarth.toDeg(phi)
                };
            },
            
            // Project geographic coordinates to screen coordinates
            project: function(lng, lat, width, height) {
                const proj = EqualEarth.forward(lng, lat);
                return {
                    x: proj.x * EqualEarth.radius * (width / 360),
                    y: proj.y * EqualEarth.radius * (height / 180)
                };
            },
            
            // Unproject screen coordinates to geographic coordinates
            unproject: function(x, y, width, height) {
                const projX = x / (EqualEarth.radius * (width / 360));
                const projY = y / (EqualEarth.radius * (height / 180));
                return EqualEarth.invert(projX, projY);
            }
        };

        // ============================================================================
        // MAP APPLICATION
        // ============================================================================
        
        const container = document.getElementById('map-container');
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        // Create SVG canvas
        const SVG = window.SVG;
        const svg = SVG().addTo(container).size(width, height);
        
        // Map groups
        const mapGroup = svg.group().attr('id', 'map-group');
        const markerGroup = svg.group().attr('id', 'marker-group');
        const gridGroup = svg.group().attr('id', 'grid-group');
        
        // Draw grid lines (graticule)
        function drawGrid() {
            gridGroup.clear();
            
            // Latitude lines
            for (let lat = -80; lat <= 80; lat += 10) {
                const proj = EqualEarth.forward(0, lat);
                const y = proj.y * EqualEarth.radius;
                const path = `M-180,${y} H180`;
                gridGroup.path(path).attr({
                    stroke: 'rgba(255,255,255,0.1)',
                    'stroke-width': 0.5,
                    'stroke-dasharray': '5,5'
                });
            }
            
            // Longitude lines
            for (let lng = -180; lng <= 180; lng += 30) {
                const proj = EqualEarth.forward(lng, 0);
                const x = proj.x * EqualEarth.radius;
                const path = `M${x},-90 V90`;
                gridGroup.path(path).attr({
                    stroke: 'rgba(255,255,255,0.1)',
                    'stroke-width': 0.5,
                    'stroke-dasharray': '5,5'
                });
            }
        }
        
        // Draw world map countries
        function drawCountries() {
            mapGroup.clear();
            
            // Draw ocean background
            mapGroup.rect(width, height).attr({
                fill: '#1a365d',
                stroke: '#2a4a6d'
            });
            
            // Draw countries
            worldCountries.forEach(country => {
                const path = mapGroup.path(country.path).attr({
                    fill: '#2d5a27',
                    stroke: '#1a365d',
                    'stroke-width': 0.5
                });
                
                // Add hover effect
                path.on('mouseenter', function() {
                    this.animate(200).attr({ fill: '#3d7a37' });
                }).on('mouseleave', function() {
                    this.animate(200).attr({ fill: '#2d5a27' });
                });
            });
        }
        
        // ============================================================================
        // PROJECTION AND TRANSFORM
        // ============================================================================
        
        let transform = {
            scale: 1,
            translateX: 0,
            translateY: 0,
            centerX: 0,
            centerY: 0
        };
        
        // Apply transform to a point
        function applyTransform(x, y) {
            return {
                x: x * transform.scale + transform.translateX,
                y: y * transform.scale + transform.translateY
            };
        }
        
        // Inverse transform (screen to projected)
        function inverseTransform(x, y) {
            return {
                x: (x - transform.translateX) / transform.scale,
                y: (y - transform.translateY) / transform.scale
            };
        }
        
        // Forward projection with transform
        function projectToScreen(lng, lat) {
            const proj = EqualEarth.forward(lng, lat);
            const x = proj.x * EqualEarth.radius;
            const y = proj.y * EqualEarth.radius;
            return applyTransform(x, y);
        }
        
        // Inverse projection from screen
        function unprojectFromScreen(screenX, screenY) {
            const proj = inverseTransform(screenX, screenY);
            const projX = proj.x / EqualEarth.radius;
            const projY = proj.y / EqualEarth.radius;
            return EqualEarth.invert(projX, projY);
        }
        
        // ============================================================================
        // MARKER MANAGEMENT
        // ============================================================================
        
        let markers = [];
        
        function addMarker(lng, lat) {
            const pos = projectToScreen(lng, lat);
            
            const circle = markerGroup.circle(8).attr({
                fill: '#4fd1c5',
                stroke: '#fff',
                'stroke-width': 2,
                'cursor': 'pointer'
            });
            
            const label = markerGroup.text(`${lat.toFixed(2)}°, ${lng.toFixed(2)}°`).attr({
                fill: '#fff',
                'font-size': '10px',
                'font-family': 'Arial, sans-serif',
                'text-anchor': 'middle',
                'alignment-baseline': 'bottom'
            });
            
            const labelPos = applyTransform(lng * EqualEarth.radius * (width / 360), lat * EqualEarth.radius * (height / 180));
            label.attr({
                x: labelPos.x,
                y: labelPos.y - 10
            });
            
            const marker = {
                lng,
                lat,
                circle,
                label
            };
            
            markers.push(marker);
        }
        
        function clearMarkers() {
            markers.forEach(m => {
                m.circle.remove();
                m.label.remove();
            });
            markers = [];
        }
        
        // ============================================================================
        // INTERACTION
        // ============================================================================
        
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let lastMouse = { x: 0, y: 0 };
        let lastClickTime = 0;
        let lastClickPos = { x: 0, y: 0 };
        
        // Update coordinate display
        function updateCoordinateDisplay(lng, lat, screenX, screenY) {
            const latDisplay = lat >= 0 ? `${lat.toFixed(4)}° N` : `${Math.abs(lat).toFixed(4)}° S`;
            const lngDisplay = lng >= 0 ? `${lng.toFixed(4)}° E` : `${Math.abs(lng).toFixed(4)}° W`;
            
            document.getElementById('displayLat').textContent = latDisplay;
            document.getElementById('displayLng').textContent = lngDisplay;
            document.getElementById('displayX').textContent = Math.round(screenX);
            document.getElementById('displayY').textContent = Math.round(screenY);
            document.getElementById('zoomLevel').textContent = transform.scale.toFixed(2) + 'x';
            document.getElementById('centerCoord').textContent = `${transform.centerY.toFixed(2)}°, ${transform.centerX.toFixed(2)}°`;
        }
        
        // Handle mouse down
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStart = { x: e.clientX, y: e.clientY };
            lastMouse = { x: e.clientX, y: e.clientY };
            lastClickTime = Date.now();
            lastClickPos = { x: e.clientX, y: e.clientY };
        });
        
        // Handle mouse move
        container.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                
                transform.translateX += dx;
                transform.translateY += dy;
                transform.centerX += dx / transform.scale;
                transform.centerY += dy / transform.scale;
                
                dragStart = { x: e.clientX, y: e.clientY };
                
                // Update map position
                mapGroup.transform({
                    translateX: transform.translateX,
                    translateY: transform.translateY,
                    scale: transform.scale
                });
                
                markerGroup.transform({
                    translateX: transform.translateX,
                    translateY: transform.translateY,
                    scale: transform.scale
                });
                
                gridGroup.transform({
                    translateX: transform.translateX,
                    translateY: transform.translateY,
                    scale: transform.scale
                });
            }
            
            // Update coordinate display on move
            const screenX = e.clientX;
            const screenY = e.clientY;
            const coords = unprojectFromScreen(screenX, screenY);
            updateCoordinateDisplay(coords.lng, coords.lat, screenX, screenY);
            
            lastMouse = { x: e.clientX, y: e.clientY };
        });
        
        // Handle mouse up
        container.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                
                const clickTime = Date.now() - lastClickTime;
                const clickDist = Math.sqrt(
                    Math.pow(e.clientX - lastClickPos.x, 2) +
                    Math.pow(e.clientY - lastClickPos.y, 2)
                );
                
                // If it was a click (not a drag), show coordinates
                if (clickTime < 200 && clickDist < 5) {
                    const screenX = e.clientX;
                    const screenY = e.clientY;
                    const coords = unprojectFromScreen(screenX, screenY);
                    updateCoordinateDisplay(coords.lng, coords.lat, screenX, screenY);
                }
            }
        });
        
        // Handle mouse wheel (zoom)
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const zoomFactor = Math.exp(wheel * zoomIntensity);
            
            // Get mouse position before zoom
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            // Inverse transform mouse to projected coordinates
            const mouseProj = inverseTransform(mouseX, mouseY);
            
            // Apply zoom
            const newScale = Math.max(0.1, Math.min(5, transform.scale * zoomFactor));
            
            // Calculate new translation to keep mouse position stable
            const newTranslateX = mouseX - mouseProj.x * newScale;
            const newTranslateY = mouseY - mouseProj.y * newScale;
            
            transform.scale = newScale;
            transform.translateX = newTranslateX;
            transform.translateY = newTranslateY;
            
            // Update map position
            mapGroup.transform({
                translateX: transform.translateX,
                translateY: transform.translateY,
                scale: transform.scale
            });
            
            markerGroup.transform({
                translateX: transform.translateX,
                translateY: transform.translateY,
                scale: transform.scale
            });
            
            gridGroup.transform({
                translateX: transform.translateX,
                translateY: transform.translateY,
                scale: transform.scale
            });
            
            // Update display
            const coords = unprojectFromScreen(mouseX, mouseY);
            updateCoordinateDisplay(coords.lng, coords.lat, mouseX, mouseY);
        }, { passive: false });
        
        // Handle click for coordinate display
        container.addEventListener('click', (e) => {
            const screenX = e.clientX;
            const screenY = e.clientY;
            const coords = unprojectFromScreen(screenX, screenY);
            updateCoordinateDisplay(coords.lng, coords.lat, screenX, screenY);
        });
        
        // ============================================================================
        // UI CONTROLS
        // ============================================================================
        
        document.getElementById('placeMarkerBtn').addEventListener('click', () => {
            const lat = parseFloat(document.getElementById('latInput').value);
            const lng = parseFloat(document.getElementById('lngInput').value);
            
            if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                addMarker(lng, lat);
            } else {
                alert('Invalid coordinates! Latitude must be between -90 and 90, longitude between -180 and 180.');
            }
        });
        
        document.getElementById('clearMarkersBtn').addEventListener('click', clearMarkers);
        
        // Allow Enter key to place marker
        document.getElementById('latInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('placeMarkerBtn').click();
        });
        document.getElementById('lngInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('placeMarkerBtn').click();
        });
        
        // ============================================================================
        // RESIZE HANDLER
        // ============================================================================
        
        window.addEventListener('resize', () => {
            const newWidth = window.innerWidth;
            const newHeight = window.innerHeight;
            
            svg.size(newWidth, newHeight);
            
            // Redraw grid
            drawGrid();
        });
        
        // ============================================================================
        // INITIALIZE
        // ============================================================================
        
        // Initial draw
        drawGrid();
        drawCountries();
        
        // Center the map initially
        transform.centerX = 0;
        transform.centerY = 0;
        transform.scale = 1;
        transform.translateX = width / 2;
        transform.translateY = height / 2;
        
        // Apply initial transform
        mapGroup.transform({
            translateX: transform.translateX,
            translateY: transform.translateY,
            scale: transform.scale
        });
        
        markerGroup.transform({
            translateX: transform.translateX,
            translateY: transform.translateY,
            scale: transform.scale
        });
        
        gridGroup.transform({
            translateX: transform.translateX,
            translateY: transform.translateY,
            scale: transform.scale
        });
        
        // Set initial coordinate display
        updateCoordinateDisplay(0, 0, width / 2, height / 2);
        
        // Add some demo markers
        addMarker(0, 0);  // Prime meridian & equator
        addMarker(-74, 40.7128);  // New York
        addMarker(2.3522, 48.8566);  // Paris
        addMarker(139.6917, 35.6895);  // Tokyo
        addMarker(-157.8583, 21.3069);  // Hawaii
        addMarker(18.4241, -33.9249);  // Cape Town
        addMarker(77.2090, 28.6139);  // New Delhi
        addMarker(-46.6333, -23.5505);  // Sao Paulo
        
        console.log('Equal Earth Projection Map initialized!');
        console.log('Use the controls to place markers or click on the map to get coordinates.');
    </script>
