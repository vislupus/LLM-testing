<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equal Earth — projection bench</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.0/svg.min.js"></script>
<style>
  :root{
    --plate:      #0A1D2E;
    --plate-deep: #061320;
    --ocean:      #10304B;
    --bone:       #E4E9E4;
    --grat:       #4E86A8;
    --brass:      #E0A93B;
    --brass-dim:  #8A6B2B;
    --ink:        #DDE7EE;
    --ink-2:      #8FA9BC;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--plate-deep);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #stage{ position:fixed; inset:0; }
  #map{ position:absolute; inset:0; background:var(--plate); cursor:crosshair; touch-action:none; }
  #map:focus-visible{ outline:2px solid var(--brass); outline-offset:-2px; }
  #map.dragging{ cursor:grabbing; }
  svg{ display:block; }
  #map text{ font-family:var(--mono); letter-spacing:.04em; }

  /* ---- panels ---- */
  .panel{
    position:absolute;
    background:rgba(6,19,32,.82);
    border:1px solid rgba(78,134,168,.34);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    padding:12px 14px;
    max-width:min(320px, calc(100vw - 32px));
  }
  .eyebrow{
    font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-2); margin:0 0 8px;
  }
  .rule{ height:1px; background:rgba(78,134,168,.28); margin:10px -14px; }

  #masthead{ top:16px; left:16px; padding:13px 16px 14px; }
  #masthead h1{
    margin:0; font-size:19px; font-weight:600;
    letter-spacing:.30em; text-transform:uppercase;
  }
  #masthead h1 span{ color:var(--brass); }
  #masthead p{
    margin:7px 0 0; font-family:var(--sans); font-size:11.5px;
    line-height:1.5; color:var(--ink-2); max-width:27ch;
  }

  /* ---- sighting readout ---- */
  #sighting{ left:16px; bottom:16px; width:296px; }
  .row{ display:flex; align-items:baseline; gap:10px; margin:5px 0; font-size:13px; }
  .row .tag{ width:30px; flex:none; font-size:9.5px; letter-spacing:.16em; color:var(--ink-2); }
  .row .dms{ flex:1; font-variant-numeric:tabular-nums; }
  .row .dec{ font-variant-numeric:tabular-nums; color:var(--ink-2); font-size:11.5px; }
  .live .dms{ color:var(--brass); }
  .sub{ display:flex; justify-content:space-between; gap:8px; font-size:10.5px; color:var(--ink-2); }
  .sub b{ color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }
  #fixline{ font-size:11px; color:var(--ink-2); }
  #fixline b{ color:var(--bone); font-weight:500; font-variant-numeric:tabular-nums; }

  /* ---- plot panel ---- */
  #plot{ right:16px; top:16px; width:264px; }
  .fields{ display:flex; gap:8px; }
  .field{ flex:1; }
  .field label{
    display:block; font-size:9.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-2); margin-bottom:4px;
  }
  .field input{
    width:100%; background:rgba(16,48,75,.55); color:var(--ink);
    border:1px solid rgba(78,134,168,.4); padding:7px 8px;
    font-family:var(--mono); font-size:13px; border-radius:0;
  }
  .field input:focus{ outline:none; border-color:var(--brass); }
  button{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--plate-deep); background:var(--brass);
    border:0; padding:8px 12px; cursor:pointer; border-radius:0;
  }
  button:hover{ background:#F0BC55; }
  button:focus-visible{ outline:2px solid var(--bone); outline-offset:2px; }
  button.ghost{
    background:transparent; color:var(--ink-2);
    border:1px solid rgba(78,134,168,.4);
  }
  button.ghost:hover{ color:var(--brass); border-color:var(--brass); }
  #plotbtn{ width:100%; margin-top:10px; }
  #err{ margin-top:8px; font-family:var(--sans); font-size:11px; color:var(--brass); min-height:0; }

  #list{ list-style:none; margin:0; padding:0; max-height:31vh; overflow:auto; }
  #list li{
    display:flex; align-items:center; gap:8px; padding:4px 0;
    font-size:11px; border-bottom:1px solid rgba(78,134,168,.14);
  }
  #list li:last-child{ border-bottom:0; }
  #list .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  #list .nm:hover{ color:var(--brass); }
  #list .co{ color:var(--ink-2); font-variant-numeric:tabular-nums; font-size:10px; }
  #list .rm{
    background:none; border:0; color:var(--ink-2); cursor:pointer;
    font-size:13px; padding:0 2px; letter-spacing:0;
  }
  #list .rm:hover{ color:var(--brass); }
  #empty{ font-family:var(--sans); font-size:11px; color:var(--ink-2); margin:0; }

  /* ---- controls ---- */
  #controls{ right:16px; bottom:16px; padding:10px 12px; text-align:right; }
  .btns{ display:flex; gap:6px; justify-content:flex-end; }
  .btns button{ min-width:34px; padding:7px 9px; }
  #hint{
    margin:9px 0 0; font-family:var(--sans); font-size:10.5px;
    color:var(--ink-2); line-height:1.5;
  }
  #zoomval{ color:var(--brass); }

  @media (max-width: 900px){
    .panel{ padding:9px 11px; }
    #masthead{ top:10px; left:10px; }
    #masthead h1{ font-size:14px; letter-spacing:.2em; }
    #masthead p{ display:none; }
    #controls{ right:10px; bottom:auto; top:10px; padding:8px 9px; }
    #hint{ display:none; }
    #plot{ top:auto; right:10px; bottom:146px; width:200px; }
    #plot .rule, #plot #list, #plot #empty, #plot .eyebrow:last-of-type{ display:none; }
    #plot .field input{ font-size:12px; padding:6px; }
    #sighting{ left:10px; right:10px; bottom:10px; width:auto; }
    .row{ font-size:12px; margin:3px 0; }
    .row .dec{ font-size:10.5px; }
    .rule{ margin:7px -11px; }
  }
  @media (max-height: 560px){
    #plot{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div id="stage">
  <div id="map" tabindex="0" role="application"
       aria-label="Equal Earth world map. Arrow keys pan, plus and minus zoom."></div>

  <div class="panel" id="masthead">
    <h1>Equal<span>·</span>Earth</h1>
    <p>Equal-area pseudocylindrical projection. Šavrič, Patterson &amp; Jenny, 2018.</p>
  </div>

  <div class="panel" id="plot">
    <p class="eyebrow">Plot a point</p>
    <div class="fields">
      <div class="field">
        <label for="in-lat">Latitude</label>
        <input id="in-lat" type="number" step="any" value="35.68" inputmode="decimal">
      </div>
      <div class="field">
        <label for="in-lon">Longitude</label>
        <input id="in-lon" type="number" step="any" value="139.69" inputmode="decimal">
      </div>
    </div>
    <button id="plotbtn">Plot point</button>
    <p id="err"></p>
    <div class="rule"></div>
    <p class="eyebrow">Plotted <span id="count"></span></p>
    <p id="empty">No points yet. Click the map to take a fix.</p>
    <ul id="list"></ul>
  </div>

  <div class="panel" id="sighting">
    <p class="eyebrow">Sighting</p>
    <div class="row live"><span class="tag">Lat</span><span class="dms" id="lat-dms">—</span><span class="dec" id="lat-dec"></span></div>
    <div class="row live"><span class="tag">Lon</span><span class="dms" id="lon-dms">—</span><span class="dec" id="lon-dec"></span></div>
    <div class="rule"></div>
    <div class="sub">
      <span>x <b id="px">—</b></span>
      <span>y <b id="py">—</b></span>
      <span>area <b id="pa">—</b></span>
      <span>ω <b id="pw">—</b></span>
    </div>
    <div class="rule"></div>
    <p id="fixline" style="margin:0">Last fix <b>—</b></p>
  </div>

  <div class="panel" id="controls">
    <div class="btns">
      <button class="ghost" id="zout" aria-label="Zoom out">−</button>
      <button class="ghost" id="zin" aria-label="Zoom in">+</button>
      <button class="ghost" id="reset">Fit</button>
    </div>
    <p id="hint">Scroll to zoom · drag to pan · click to take a fix<br>Zoom <span id="zoomval">×1.00</span></p>
  </div>
</div>

<script>
/* ===================================================================
   1.  EQUAL EARTH PROJECTION
   Šavrič, B., Patterson, T. & Jenny, B. (2018)
   Sphere of unit radius; x, y in projection units (radians-scaled).
   =================================================================== */
const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796;
const M  = Math.sqrt(3) / 2;
const DEG = Math.PI / 180, RAD = 180 / Math.PI;

/** Forward: geographic degrees -> projected x, y. */
function forward(latDeg, lonDeg) {
  const phi = latDeg * DEG, lam = lonDeg * DEG;
  const th  = Math.asin(M * Math.sin(phi));
  const t2 = th * th, t6 = t2 * t2 * t2;
  return {
    x: lam * Math.cos(th) / (M * (A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2))),
    y: th * (A1 + A2 * t2 + t6 * (A3 + A4 * t2))
  };
}

/** Inverse: projected x, y -> geographic degrees. Newton–Raphson on θ.
 *  Returns null when the point lies outside the projection boundary. */
function inverse(x, y) {
  let th = y, t2, t6, dth = 0;
  for (let i = 0; i < 20; i++) {
    t2 = th * th; t6 = t2 * t2 * t2;
    const fy  = th * (A1 + A2 * t2 + t6 * (A3 + A4 * t2)) - y;
    const fpy = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
    dth = fy / fpy;
    th -= dth;
    if (Math.abs(dth) < 1e-13) break;
  }
  t2 = th * th; t6 = t2 * t2 * t2;
  const sinPhi = Math.sin(th) / M;
  if (Math.abs(sinPhi) > 1) return null;                 // beyond the pole lines
  const lam = M * x * (A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2)) / Math.cos(th);
  if (Math.abs(lam) > Math.PI + 1e-9) return null;        // beyond ±180° meridians
  return { lat: Math.asin(sinPhi) * RAD, lon: lam * RAD };
}

const XMAX = forward(0, 180).x;    // 2.7066
const YMAX = forward(90, 0).y;     // 1.3173

/** Tissot indicatrix by central differences: areal scale + max angular
 *  deformation ω. Equal Earth is equal-area, so areal scale reads 1.000. */
function distortion(lat, lon) {
  const phi = lat * DEG, h = 1e-6;
  if (Math.abs(lat) > 89.4) return null;
  const d = (dphi, dlam) => forward((phi + dphi) * RAD, lon + dlam * RAD);
  const px = d(h, 0), mx = d(-h, 0), pl = d(0, h), ml = d(0, -h);
  const xphi = (px.x - mx.x) / (2 * h), yphi = (px.y - mx.y) / (2 * h);
  const xlam = (pl.x - ml.x) / (2 * h), ylam = (pl.y - ml.y) / (2 * h);
  const cosp = Math.cos(phi);
  const hh = Math.hypot(xphi, yphi);
  const kk = Math.hypot(xlam, ylam) / cosp;
  const sinT = Math.abs(xlam * yphi - xphi * ylam) / (hh * kk * cosp);
  const ap = Math.sqrt(Math.max(0, hh * hh + kk * kk + 2 * hh * kk * sinT));
  const bp = Math.sqrt(Math.max(0, hh * hh + kk * kk - 2 * hh * kk * sinT));
  const a = (ap + bp) / 2, b = (ap - bp) / 2;
  return { area: a * b, omega: 2 * Math.asin(Math.min(1, (a - b) / (a + b))) * RAD };
}

/* ===================================================================
   2.  VIEW TRANSFORM   projection <-> screen
   screen = [ k*X + tx , -k*Y + ty ]      k = pixels per projection unit
   Geometry is drawn in "base units" (X*UNIT, -Y*UNIT) inside a group
   carrying matrix(s,0,0,s,tx,ty) with s = k/UNIT, so pan and zoom are a
   pure affine on already-projected coordinates — the projection stays
   exact at every scale.
   =================================================================== */
const UNIT = 1000;
let k = 1, tx = 0, ty = 0, W = 0, H = 0, kFit = 1;

const projToScreen = (X, Y) => [X * k + tx, -Y * k + ty];
const screenToProj = (sx, sy) => [(sx - tx) / k, -(sy - ty) / k];
const lonlatToScreen = (lat, lon) => { const p = forward(lat, lon); return projToScreen(p.x, p.y); };
const screenToLonlat = (sx, sy) => { const p = screenToProj(sx, sy); return inverse(p[0], p[1]); };

function decodeRing(s) {
  const out = []; let i = 0, prev = 0;
  while (i < s.length) {
    let shift = 0, res = 0, b;
    do { b = s.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    prev += (res & 1) ? ~(res >> 1) : (res >> 1);
    out.push(prev / 100);
  }
  return out;
}

/* Densify in latitude before projecting: meridians are curves in Equal
   Earth, so a long north–south edge must be sampled, while east–west
   edges stay exactly straight and need no extra vertices. */
const MAXSTEP = 1.0;
function ringToPath(flat) {
  let d = '', px = 0, py = 0;
  const emit = (lat, lon, first) => {
    const p = forward(lat, lon);
    const X = (p.x * UNIT).toFixed(1), Y = (-p.y * UNIT).toFixed(1);
    d += (first ? 'M' : 'L') + X + ' ' + Y;
  };
  for (let i = 0; i < flat.length; i += 2) {
    const lon = flat[i], lat = flat[i + 1];
    if (i === 0) { emit(lat, lon, true); }
    else {
      const n = Math.ceil(Math.abs(lat - py) / MAXSTEP);
      for (let j = 1; j <= n; j++) emit(py + (lat - py) * j / n, px + (lon - px) * j / n, false);
    }
    px = lon; py = lat;
  }
  return d + 'Z';
}

function buildLandPath() {
  const rings = WORLD_DATA.split('\n');
  let d = '';
  for (const r of rings) d += ringToPath(decodeRing(r));
  return d;
}

/* graticule + boundary, sampled in geographic space */
function meridianPath(lon, from = -90, to = 90, step = 1.5) {
  const n = Math.max(1, Math.ceil(Math.abs(to - from) / step));
  let d = '';
  for (let i = 0; i <= n; i++) {
    const p = forward(from + (to - from) * i / n, lon);
    d += (i ? 'L' : 'M') + (p.x * UNIT).toFixed(1) + ' ' + (-p.y * UNIT).toFixed(1);
  }
  return d;
}
function parallelPath(lat) {                    // parallels are straight lines
  const a = forward(lat, -180), b = forward(lat, 180);
  return 'M' + (a.x * UNIT).toFixed(1) + ' ' + (-a.y * UNIT).toFixed(1) +
         'L' + (b.x * UNIT).toFixed(1) + ' ' + (-b.y * UNIT).toFixed(1);
}
function spherePath() {
  return meridianPath(180, -90, 90) + meridianPath(-180, 90, -90).replace('M', 'L') + 'Z';
}

/* ===================================================================
   4.  SVG.js SCENE
   =================================================================== */
const mapEl = document.getElementById('map');
if (typeof SVG !== 'function') {
  mapEl.innerHTML = '<p style="padding:2rem;font-family:var(--sans)">SVG.js failed to load. ' +
                    'This page needs the library from cdnjs.cloudflare.com.</p>';
  throw new Error('SVG.js unavailable');
}

const draw  = SVG().addTo(mapEl).size('100%', '100%');
const world = draw.group();                     // carries pan/zoom matrix
const overlay = draw.group();                   // screen space: markers, labels

const NS = { 'vector-effect': 'non-scaling-stroke' };
const C = { plate:'#0A1D2E', ocean:'#10304B', bone:'#E4E9E4', grat:'#4E86A8',
            brass:'#E0A93B', coast:'#7E93A3' };

const sphere = world.path(spherePath())
  .fill(C.ocean).stroke({ color: C.grat, width: 1.1, opacity: .75 }).attr(NS);

const landD = buildLandPath();
world.path(landD).fill(C.bone).attr({ 'fill-rule': 'evenodd' }).stroke('none');
world.path(landD).fill('none')
     .stroke({ color: C.coast, width: .6, opacity: .85 }).attr(NS);

const gratG = world.group().attr(NS);
for (let lon = -165; lon <= 165; lon += 15)
  gratG.path(meridianPath(lon)).fill('none')
       .stroke({ color: C.grat, width: lon === 0 ? .9 : .55, opacity: lon === 0 ? .55 : .3 })
       .attr(NS);
for (let lat = -75; lat <= 75; lat += 15)
  gratG.path(parallelPath(lat)).fill('none')
       .stroke({ color: C.grat, width: lat === 0 ? .9 : .55, opacity: lat === 0 ? .55 : .3 })
       .attr(NS);

/* the reticle: the parallel and the meridian running through the cursor */
const retG = world.group().attr(NS).opacity(0);
const retPar = retG.path('').fill('none').stroke({ color: C.brass, width: .9, dasharray: '4 3' }).attr(NS);
const retMer = retG.path('').fill('none').stroke({ color: C.brass, width: .9, dasharray: '4 3' }).attr(NS);
const retDot = overlay.circle(1).fill('none').stroke({ color: C.brass, width: 1.2 }).opacity(0);
const retTick = overlay.path('').fill('none').stroke({ color: C.brass, width: 1 }).opacity(0);

const markerG = overlay.group();

/* raw <text> node: avoids SVG.js tspan rebuilding, which we don't need here */
function mkText(parent, str) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  node.textContent = str;
  parent.node.appendChild(node);
  return SVG(node);
}

/* ===================================================================
   5.  MARKERS — forward projection in action
   =================================================================== */
const CITIES = [
  ['Null Island',   0,      0     ],
  ['Longyearbyen',  78.22,  15.63 ],
  ['Reykjavík',     64.15, -21.94 ],
  ['Anchorage',     61.22, -149.90],
  ['Tokyo',         35.68,  139.69],
  ['Quito',        -0.18,  -78.47 ],
  ['Nairobi',      -1.29,   36.82 ],
  ['Singapore',     1.35,   103.82],
  ['Cape Town',    -33.92,  18.42 ],
  ['Wellington',   -41.29,  174.78],
  ['Ushuaia',      -54.80, -68.30 ],
  ['McMurdo',      -77.85,  166.67]
];

const markers = [];
let fixCount = 0;

function addMarker(name, lat, lon, isFix) {
  const g = markerG.group();
  const ring = g.circle(9).fill('none')
    .stroke({ color: isFix ? C.brass : C.bone, width: 1.4 });
  const dot = g.circle(2.6).fill(isFix ? C.brass : C.bone);
  const label = mkText(g, name);
  label.attr({
    'font-size': 10.5, 'text-anchor': 'start', 'dominant-baseline': 'middle',
    fill: isFix ? C.brass : C.bone, 'paint-order': 'stroke',
    stroke: C.plate, 'stroke-width': 3.2, 'stroke-linejoin': 'round'
  });
  const m = { name, lat, lon, isFix, g, ring, dot, label };
  markers.push(m);
  place(m);
  renderList();
  return m;
}

function place(m) {
  const [sx, sy] = lonlatToScreen(m.lat, m.lon);
  m.ring.center(sx, sy);
  m.dot.center(sx, sy);
  m.label.attr({ x: sx + 10, y: sy });
  const on = sx > -60 && sx < W + 60 && sy > -40 && sy < H + 40;
  m.g.opacity(on ? 1 : 0);
}

function removeMarker(m) {
  m.g.remove();
  markers.splice(markers.indexOf(m), 1);
  renderList();
}

const listEl  = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');

function renderList() {
  countEl.textContent = markers.length ? '(' + markers.length + ')' : '';
  emptyEl.style.display = markers.length ? 'none' : 'block';
  listEl.innerHTML = '';
  markers.forEach(m => {
    const li = document.createElement('li');
    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = m.name; nm.title = 'Centre the view here';
    nm.onclick = () => flyTo(m.lat, m.lon);
    const co = document.createElement('span');
    co.className = 'co';
    co.textContent = m.lat.toFixed(2) + ', ' + m.lon.toFixed(2);
    const rm = document.createElement('button');
    rm.className = 'rm'; rm.textContent = '×'; rm.setAttribute('aria-label', 'Remove ' + m.name);
    rm.onclick = () => removeMarker(m);
    li.append(nm, co, rm);
    listEl.appendChild(li);
  });
}

/* ===================================================================
   6.  RENDER / VIEW CONTROL
   =================================================================== */
function clampView() {
  const kMin = kFit * 0.55, kMax = kFit * 140;
  k = Math.min(kMax, Math.max(kMin, k));
  const margin = 80;
  tx = Math.min(W - margin + XMAX * k, Math.max(margin - XMAX * k, tx));
  ty = Math.min(H - margin + YMAX * k, Math.max(margin - YMAX * k, ty));
}

function render() {
  clampView();
  const s = k / UNIT;
  world.attr('transform', 'matrix(' + s + ',0,0,' + s + ',' + tx + ',' + ty + ')');
  markers.forEach(place);
  document.getElementById('zoomval').textContent = '×' + (k / kFit).toFixed(2);
  if (cursor) drawReticle(cursor.lat, cursor.lon);
}

/** Measure the viewport and refit. `keep` preserves the current zoom level
 *  and the geographic point at the centre of the view (used on resize). */
function fit(keep) {
  const prev = { k, tx, ty, W, H, kFit };
  const r = mapEl.getBoundingClientRect();
  W = r.width; H = r.height;
  draw.size(W, H);
  const pad = W < 700 ? 8 : 40;
  const chrome = W < 900 ? 96 : 40;
  kFit = Math.min((W - pad * 2) / (2 * XMAX), (H - pad * 2 - chrome) / (2 * YMAX));
  if (keep && prev.W) {
    k = kFit * (prev.k / prev.kFit);
    const [cx, cy] = [(prev.W / 2 - prev.tx) / prev.k, -(prev.H / 2 - prev.ty) / prev.k];
    tx = W / 2 - cx * k;
    ty = H / 2 + cy * k;
  } else {
    k = kFit; tx = W / 2; ty = H / 2 + (W < 900 ? -18 : 0);
  }
  render();
}

function zoomAt(px, py, factor) {
  const before = k;
  k *= factor;
  clampView();
  const f = k / before;
  tx = px - (px - tx) * f;
  ty = py - (py - ty) * f;
  render();
}

function flyTo(lat, lon) {
  const p = forward(lat, lon);
  k = Math.max(k, kFit * 4);
  tx = W / 2 - p.x * k;
  ty = H / 2 + p.y * k;
  render();
}

/* ===================================================================
   7.  INTERACTION
   =================================================================== */
let cursor = null;

mapEl.addEventListener('wheel', e => {
  e.preventDefault();
  const r = mapEl.getBoundingClientRect();
  const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0022));
  zoomAt(e.clientX - r.left, e.clientY - r.top, f);
}, { passive: false });

const pointers = new Map();
let dragStart = null, pinch = null, moved = 0;

mapEl.addEventListener('pointerdown', e => {
  mapEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0;
  if (pointers.size === 1) {
    dragStart = { x: e.clientX, y: e.clientY, tx, ty, t: Date.now() };
    mapEl.classList.add('dragging');
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) };
    dragStart = null;
  }
});

mapEl.addEventListener('pointermove', e => {
  const r = mapEl.getBoundingClientRect();
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch.d > 0) zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch.d);
    pinch.d = d;
    return;
  }
  if (dragStart) {
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    moved = Math.max(moved, Math.hypot(dx, dy));
    tx = dragStart.tx + dx; ty = dragStart.ty + dy;
    render();
  }
  readOut(e.clientX - r.left, e.clientY - r.top);
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) {
    mapEl.classList.remove('dragging');
    if (dragStart && moved < 5 && Date.now() - dragStart.t < 600) {
      const r = mapEl.getBoundingClientRect();
      takeFix(e.clientX - r.left, e.clientY - r.top);
    }
    dragStart = null;
  }
}
mapEl.addEventListener('pointerup', endPointer);
mapEl.addEventListener('pointercancel', endPointer);
mapEl.addEventListener('pointerleave', () => { cursor = null; clearReadout(); });

mapEl.addEventListener('keydown', e => {
  const step = 60;
  const keys = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
  if (keys[e.key]) { tx += keys[e.key][0]; ty += keys[e.key][1]; render(); e.preventDefault(); }
  else if (e.key === '+' || e.key === '=') { zoomAt(W / 2, H / 2, 1.3); e.preventDefault(); }
  else if (e.key === '-') { zoomAt(W / 2, H / 2, 1 / 1.3); e.preventDefault(); }
  else if (e.key === '0') { fit(false); e.preventDefault(); }
});

/* ---- inverse projection readout ---- */
const el = id => document.getElementById(id);

function dms(v, pos, neg) {
  const h = v < 0 ? neg : pos, a = Math.abs(v);
  const d = Math.floor(a), m = Math.floor((a - d) * 60), s = ((a - d) * 60 - m) * 60;
  return d + '° ' + String(m).padStart(2, '0') + '′ ' + s.toFixed(1).padStart(4, '0') + '″ ' + h;
}

function readOut(sx, sy) {
  const c = screenToLonlat(sx, sy);
  if (!c) { cursor = null; clearReadout(); return; }
  cursor = c;
  const p = forward(c.lat, c.lon), dz = distortion(c.lat, c.lon);
  el('lat-dms').textContent = dms(c.lat, 'N', 'S');
  el('lon-dms').textContent = dms(c.lon, 'E', 'W');
  el('lat-dec').textContent = c.lat.toFixed(4) + '°';
  el('lon-dec').textContent = c.lon.toFixed(4) + '°';
  el('px').textContent = p.x.toFixed(4);
  el('py').textContent = p.y.toFixed(4);
  el('pa').textContent = dz ? dz.area.toFixed(3) + '×' : '—';
  el('pw').textContent = dz ? dz.omega.toFixed(1) + '°' : '—';
  drawReticle(c.lat, c.lon);
}

function clearReadout() {
  ['lat-dms', 'lon-dms'].forEach(i => el(i).textContent = '—');
  ['lat-dec', 'lon-dec'].forEach(i => el(i).textContent = '');
  ['px', 'py', 'pa', 'pw'].forEach(i => el(i).textContent = '—');
  retG.opacity(0); retDot.opacity(0); retTick.opacity(0);
}

function drawReticle(lat, lon) {
  retPar.plot(parallelPath(lat));
  retMer.plot(meridianPath(lon));
  retG.opacity(.85);
  const [sx, sy] = lonlatToScreen(lat, lon);
  retDot.radius(7).center(sx, sy).opacity(.9);
  retTick.plot('M' + (sx - 14) + ' ' + sy + 'h7M' + (sx + 7) + ' ' + sy + 'h7' +
               'M' + sx + ' ' + (sy - 14) + 'v7M' + sx + ' ' + (sy + 7) + 'v7').opacity(.9);
}

function takeFix(sx, sy) {
  const c = screenToLonlat(sx, sy);
  if (!c) {
    el('fixline').innerHTML = 'Last fix <b>off the map — that point is outside the projection</b>';
    return;
  }
  fixCount++;
  addMarker('Fix ' + fixCount, c.lat, c.lon, true);
  el('fixline').innerHTML = 'Last fix <b>' + dms(c.lat, 'N', 'S') + ' · ' + dms(c.lon, 'E', 'W') + '</b>';
  console.log('[fix ' + fixCount + ']', {
    latitude: +c.lat.toFixed(6), longitude: +c.lon.toFixed(6),
    projected: forward(c.lat, c.lon), screen: { x: Math.round(sx), y: Math.round(sy) }
  });
}

/* ---- forward projection from the form ---- */
el('plotbtn').addEventListener('click', () => {
  const lat = parseFloat(el('in-lat').value), lon = parseFloat(el('in-lon').value);
  const err = el('err');
  if (!isFinite(lat) || !isFinite(lon)) { err.textContent = 'Enter two numbers, in degrees.'; return; }
  if (Math.abs(lat) > 90)  { err.textContent = 'Latitude runs −90 to 90.';   return; }
  if (Math.abs(lon) > 180) { err.textContent = 'Longitude runs −180 to 180.'; return; }
  err.textContent = '';
  addMarker(lat.toFixed(2) + ', ' + lon.toFixed(2), lat, lon, false);
  const p = forward(lat, lon);
  console.log('[plot]', { latitude: lat, longitude: lon, projected: p });
});
['in-lat', 'in-lon'].forEach(id =>
  el(id).addEventListener('keydown', e => { if (e.key === 'Enter') el('plotbtn').click(); }));

el('zin').onclick   = () => zoomAt(W / 2, H / 2, 1.4);
el('zout').onclick  = () => zoomAt(W / 2, H / 2, 1 / 1.4);
el('reset').onclick = () => fit(false);

/* ===================================================================
   8.  GO
   =================================================================== */
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => fit(true), 120); });
fit();
CITIES.forEach(c => addMarker(c[0], c[1], c[2], false));
render();

console.log(
  '%cEqual Earth projection bench',
  'color:#E0A93B;font:600 13px ui-monospace,monospace',
  '\nforward(lat, lon) -> {x, y}   inverse(x, y) -> {lat, lon}' +
  '\nscreenToLonlat(px, py), lonlatToScreen(lat, lon) include the current pan/zoom.' +
  '\nx range ±' + XMAX.toFixed(4) + '   y range ±' + YMAX.toFixed(4)
);
</script>
</body>
</html>
