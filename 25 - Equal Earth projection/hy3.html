<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equal Earth Interactive Map (SVG.js)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b1021;
    font-family: Consolas, "Courier New", monospace;
    color: #e6e6e6;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  #map {
    width: 100%;
    height: 100%;
    background: #0e1633;
    cursor: grab;
  }
  #map:active {
    cursor: grabbing;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(10, 16, 40, 0.85);
    border: 1px solid #2e3c66;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
    border-radius: 6px;
    pointer-events: none;
    min-width: 220px;
  }
  #hud b { color: #8fd0ff; }
  #hud .row { margin-bottom: 2px; }
  .marker-label {
    font-size: 10px;
    fill: #ffd166;
    pointer-events: none;
  }
  .graticule {
    stroke: #1f2c52;
    stroke-width: 0.5;
    fill: none;
  }
  .land {
    fill: #24407a;
    stroke: #4f74c0;
    stroke-width: 0.4;
  }
  .ocean {
    fill: #0e1633;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="hud">
    <div class="row"><b>Equal Earth Projection</b></div>
    <div class="row">Zoom: <span id="zoomVal">1.00</span>x</div>
    <div class="row">Pan: <span id="panVal">0, 0</span></div>
    <div class="row">Click map →</div>
    <div class="row">Lat: <span id="latVal">--</span></div>
    <div class="row">Lon: <span id="lonVal">--</span></div>
    <div class="row" style="margin-top:6px;color:#88a;">SVG.js + Inverse Proj</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
<script>
/* =========================================================
   Equal Earth Projection (Snyder & Šavrič 2018)
   Forward: lon/lat (deg) -> x,y (radians, unit = earth radius)
   Inverse: x,y -> lon/lat (deg)
   ========================================================= */
const EE = (function () {
  const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796;
  const M = Math.PI / 180;

  function forward(lonDeg, latDeg) {
    const l = lonDeg * M;
    const t = Math.sin(latDeg * M);
    const x = (A1 + A2 * t * t + A3 * t * t * t * t + A4 * t * t * t * t * t * t) * l * Math.cos(latDeg * M);
    const y = latDeg * M * (A1 + (A2 / 3) * t * t + (A3 / 5) * t * t * t * t + (A4 / 7) * t * t * t * t * t * t);
    return [x, y];
  }

  function inverse(x, y) {
    const yd = y; // already in radian-like unit
    let t = yd / A1;
    for (let i = 0; i < 12; i++) {
      const t2 = t * t, t4 = t2 * t2, t6 = t4 * t2;
      const f = A1 * t + (A2 / 3) * t * t2 + (A3 / 5) * t * t4 + (A4 / 7) * t * t6 - yd;
      const df = A1 + A2 * t2 + A3 * t4 + A4 * t6;
      const dt = -f / df;
      t += dt;
      if (Math.abs(dt) < 1e-12) break;
    }
    const lat = Math.asin(t) / M;
    const t2 = t * t, t4 = t2 * t2, t6 = t4 * t2;
    const cx = A1 + A2 * t2 + A3 * t4 + A4 * t6;
    const lon = Math.atan2(x, cx) / M;
    return [lon, lat];
  }

  return { forward, inverse };
})();

/* =========================================================
   SVG.js Setup
   ========================================================= */
const draw = SVG().addTo('#map').size('100%', '100%');
const root = draw.group().id('viewport');

// Base scale: Earth radius = 320 px at zoom 1
const R = 320;
let zoom = 1, panX = 0, panY = 0;

function applyTransform() {
  root.transform({ scale: zoom, translateX: panX, translateY: panY });
  document.getElementById('zoomVal').textContent = zoom.toFixed(2);
  document.getElementById('panVal').textContent = Math.round(panX) + ', ' + Math.round(panY);
}

// Convert geo -> screen (without zoom/pan)
function geoToBase(lon, lat) {
  const [x, y] = EE.forward(lon, lat);
  return [x * R, -y * R]; // y flip for screen
}
// Screen (with zoom/pan) -> geo
function screenToGeo(sx, sy) {
  const xb = (sx - panX) / zoom;
  const yb = (sy - panY) / zoom;
  const xr = xb / R;
  const yr = -yb / R;
  const [lon, lat] = EE.inverse(xr, yr);
  return [lon, lat];
}

/* =========================================================
   Draw Ocean + Graticule + Coastline (simplified)
   ========================================================= */
const W = 1600, H = 900;
draw.rect(W, H).fill('#0e1633').id('bg');

// Graticule every 30°
for (let lon = -180; lon <= 180; lon += 30) {
  const p1 = geoToBase(lon, -90), p2 = geoToBase(lon, 90);
  root.line(p1[0], p1[1], p2[0], p2[1]).addClass('graticule');
}
for (let lat = -60; lat <= 60; lat += 30) {
  let d = '';
  for (let lon = -180; lon <= 180; lon += 5) {
    const p = geoToBase(lon, lat);
    d += (lon === -180 ? 'M' : 'L') + p[0] + ',' + p[1] + ' ';
  }
  root.path(d).addClass('graticule');
}

// Simplified continent outlines (lon,lat pairs)
const continents = [
  // North America
  [[-168,65],[-150,70],[-120,72],[-95,70],[-80,62],[-60,47],[-75,35],[-80,25],[-95,18],[-105,22],[-115,30],[-125,40],[-130,55],[-168,65]],
  // South America
  [[-80,10],[-60,8],[-50,0],[-35,-8],[-40,-23],[-55,-35],[-70,-50],[-75,-40],[-80,-20],[-82,-5],[-80,10]],
  // Africa
  [[-17,15],[-5,35],[10,37],[32,32],[45,12],[50,-2],[40,-15],[25,-34],[18,-30],[12,-5],[8,5],[-17,15]],
  // Eurasia (very rough)
  [[-10,36],[0,50],[20,55],[40,60],[60,68],[100,72],[140,70],[170,65],[140,50],[120,35],[100,20],[80,8],[70,25],[55,25],[40,12],[30,30],[10,34],[-10,36]],
  // Australia
  [[115,-20],[130,-12],[145,-15],[153,-28],[140,-38],[125,-34],[115,-20]]
];

continents.forEach(poly => {
  let d = '';
  poly.forEach((pt, i) => {
    const p = geoToBase(pt[0], pt[1]);
    d += (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1] + ' ';
  });
  d += 'Z';
  root.path(d).addClass('land');
});

// Center initial view
panX = W / 2;
panY = H / 2;
applyTransform();

/* =========================================================
   Zoom & Pan
   ========================================================= */
const svgEl = document.querySelector('#map svg');
svgEl.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svgEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const nz = Math.min(20, Math.max(0.3, zoom * factor));
  // zoom toward cursor
  panX = mx - (mx - panX) * (nz / zoom);
  panY = my - (my - panY) * (nz / zoom);
  zoom = nz;
  applyTransform();
}, { passive: false });

let dragging = false, sx = 0, sy = 0, p0x = 0, p0y = 0;
svgEl.addEventListener('mousedown', e => {
  dragging = true; sx = e.clientX; sy = e.clientY; p0x = panX; p0y = panY;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = p0x + (e.clientX - sx);
  panY = p0y + (e.clientY - sy);
  applyTransform();
});
window.addEventListener('mouseup', () => dragging = false);

/* =========================================================
   Click → Inverse Projection + Marker
   ========================================================= */
svgEl.addEventListener('click', e => {
  if (Math.abs(e.movementX) > 3 || Math.abs(e.movementY) > 3) return; // ignore drag
  const rect = svgEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const [lon, lat] = screenToGeo(mx, my);
  if (lon < -180 || lon > 180 || lat < -90 || lat > 90) return;

  document.getElementById('latVal').textContent = lat.toFixed(3) + '°';
  document.getElementById('lonVal').textContent = lon.toFixed(3) + '°';

  // Plot marker in base coords (so it transforms correctly)
  const [bx, by] = geoToBase(lon, lat);
  const m = root.circle(6).center(bx, by).fill('#ffd166').stroke({ color: '#000', width: 1 });
  root.text(' ' + lat.toFixed(1) + ',' + lon.toFixed(1))
      .move(bx + 8, by - 4)
      .addClass('marker-label');
});

/* Example fixed markers */
[[0,0],[51.5, -0.1],[35.7,139.7],[-33.9,151.2],[40.7,-74.0]].forEach(([la, lo]) => {
  const [bx, by] = geoToBase(lo, la);
  root.circle(5).center(bx, by).fill('#ff5d5d').stroke({ color: '#fff', width: 1 });
});
</script>
</body>
</html>
