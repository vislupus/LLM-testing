<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Equal Earth Projection Map</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.1.2/svg.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e17;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    svg:active { cursor: grabbing; }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(100, 116, 139, 0.3);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      z-index: 10;
      max-width: 320px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #60a5fa;
      font-weight: 600;
    }
    .control-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(100, 116, 139, 0.3);
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: monospace;
      margin-bottom: 8px;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #60a5fa;
    }
    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
    #coords-display {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(100, 116, 139, 0.3);
      font-family: monospace;
      font-size: 13px;
      color: #60a5fa;
      z-index: 10;
    }
    #coords-display .label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      color: #64748b;
      z-index: 10;
    }
    .marker {
      fill: #f59e0b;
      stroke: #fff;
      stroke-width: 2;
      cursor: pointer;
    }
    .marker:hover {
      fill: #fbbf24;
    }
    .graticule {
      fill: none;
      stroke: rgba(100, 116, 139, 0.15);
      stroke-width: 0.5;
    }
    .continent {
      fill: rgba(59, 130, 246, 0.15);
      stroke: #3b82f6;
      stroke-width: 1;
    }
    .ocean {
      fill: #0f172a;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <div id="controls">
      <h1>🌍 Equal Earth Projection</h1>
      <div class="control-group">
        <label>Forward Projection</label>
        <input type="number" id="lat-input" placeholder="Latitude (-90 to 90)" step="0.1">
        <input type="number" id="lon-input" placeholder="Longitude (-180 to 180)" step="0.1">
        <button onclick="addMarkerFromCoords()">Plot Marker</button>
      </div>
      <div class="control-group">
        <label>Reset View</label>
        <button onclick="resetView()">Center Map</button>
      </div>
    </div>
    <div id="coords-display">
      <div class="label">Click Coordinates</div>
      <div id="coords-text">Click anywhere on the map</div>
    </div>
    <div id="info">Scroll to zoom • Drag to pan • Click to read coordinates</div>
  </div>

  <script>
    // ============================================
    // EQUAL EARTH PROJECTION IMPLEMENTATION
    // ============================================
    
    const SQRT_12_7 = Math.sqrt(12 / 7);
    const SQRT_3_2 = Math.sqrt(3 / 2);
    const PI_2 = Math.PI / 2;
    
    // Auxiliary latitude φ'
    function phi_prime(lat_rad) {
      return Math.asin((2 / Math.PI) * Math.atan(SQRT_3_2 * Math.tan(lat_rad)));
    }
    
    // Forward projection: lon, lat (radians) → x, y (normalized)
    function forward(lon, lat) {
      // Clamp inputs
      lon = Math.max(-Math.PI, Math.min(Math.PI, lon));
      lat = Math.max(-PI_2, Math.min(PI_2, lat));
      
      const lp = phi_prime(lat);
      const x = SQRT_12_7 * lon * Math.cos(lp);
      const y = (1 + SQRT_12_7 * (1 - lp * lp / 9)) * Math.sin(lp);
      return [x, y];
    }
    
    // Inverse projection: x, y (normalized) → lon, lat (radians)
    function inverse(x, y) {
      // Solve for lp from y using Newton-Raphson
      // y = (1 + SQRT_12_7 * (1 - lp²/9)) * sin(lp)
      let lp = Math.asin(Math.max(-1, Math.min(1, y / (1 + SQRT_12_7))));
      
      for (let i = 0; i < 15; i++) {
        const f = (1 + SQRT_12_7 * (1 - lp * lp / 9)) * Math.sin(lp) - y;
        const df = (1 + SQRT_12_7 * (1 - lp * lp / 9)) * Math.cos(lp) 
                  - (2 * SQRT_12_7 * lp / 9) * Math.sin(lp);
        if (Math.abs(df) < 1e-12) break;
        const delta = f / df;
        lp -= delta;
        if (Math.abs(delta) < 1e-10) break;
      }
      
      // Recover latitude from lp
      const lat = Math.atan(Math.sqrt(2 / 3) * Math.tan(PI_2 * Math.sin(lp)));
      
      // Recover longitude from x
      const cos_lp = Math.cos(lp);
      const lon = (Math.abs(cos_lp) < 1e-12) ? 0 : x / (SQRT_12_7 * cos_lp);
      
      return [lon, lat];
    }
    
    // Helper: degrees to radians
    function toRad(deg) { return deg * Math.PI / 180; }
    // Helper: radians to degrees
    function toDeg(rad) { return rad * 180 / Math.PI; }
    
    // ============================================
    // SIMPLIFIED WORLD MAP DATA
    // ============================================
    
    // Simplified continent outlines [lon, lat] pairs
    const continents = {
      "North America": [
        [-130,50],[-125,55],[-120,60],[-110,65],[-100,70],[-90,72],[-80,70],[-70,65],[-60,55],[-55,50],
        [-60,45],[-65,40],[-70,35],[-80,30],[-85,25],[-90,20],[-95,15],[-100,20],[-105,25],[-110,30],
        [-115,35],[-120,40],[-125,45],[-130,50]
      ],
      "South America": [
        [-80,10],[-75,5],[-70,0],[-65,-5],[-60,-10],[-55,-15],[-50,-20],[-45,-25],[-40,-30],[-35,-35],
        [-40,-40],[-45,-45],[-50,-50],[-55,-55],[-65,-55],[-70,-50],[-75,-45],[-75,-40],[-70,-35],
        [-70,-30],[-75,-25],[-75,-20],[-70,-15],[-70,-10],[-75,-5],[-80,0],[-80,5],[-80,10]
      ],
      "Europe": [
        [-10,35],[-5,38],[0,43],[5,48],[10,55],[15,60],[20,65],[25,70],[30,70],[35,65],[40,60],[45,55],
        [50,50],[55,45],[60,40],[55,35],[50,30],[45,30],[40,35],[35,35],[30,40],[25,40],[20,40],
        [15,38],[10,38],[5,36],[0,35],[-5,35],[-10,35]
      ],
      "Africa": [
        [-15,15],[-10,20],[-5,25],[0,30],[5,35],[10,37],[15,37],[20,35],[25,32],[30,30],[35,30],[40,25],
        [45,20],[50,15],[50,10],[45,5],[45,0],[40,-5],[35,-10],[30,-15],[25,-20],[20,-25],[15,-30],
        [10,-35],[15,-35],[20,-30],[25,-25],[30,-20],[35,-15],[40,-10],[40,-5],[35,0],[35,5],[30,10],
        [25,15],[20,15],[15,15],[10,10],[5,5],[0,5],[-5,5],[-10,10],[-15,15]
      ],
      "Asia": [
        [60,40],[65,35],[70,30],[75,25],[80,20],[85,22],[90,25],[95,20],[100,15],[105,10],[110,15],[115,20],
        [120,25],[125,30],[130,35],[135,40],[140,45],[145,50],[150,55],[155,60],[160,65],[170,70],[180,70],
        [180,65],[175,60],[170,55],[165,50],[160,45],[155,40],[150,35],[145,30],[140,25],[135,20],[130,15],
        [125,10],[120,5],[115,0],[110,-5],[105,-5],[100,-5],[95,0],[90,5],[85,10],[80,15],[75,20],[70,25],
        [65,30],[60,35],[60,40]
      ],
      "Australia": [
        [115,-15],[120,-15],[125,-15],[130,-12],[135,-12],[140,-15],[145,-15],[150,-20],[155,-25],[150,-30],
        [145,-35],[140,-38],[135,-35],[130,-32],[125,-30],[120,-25],[115,-20],[115,-15]
      ],
      "Antarctica": [
        [-180,-65],[-150,-70],[-120,-75],[-90,-80],[-60,-75],[-30,-70],[0,-65],[30,-70],[60,-75],[90,-80],
        [120,-75],[150,-70],[180,-65],[180,-90],[-180,-90],[-180,-65]
      ]
    };
    
    // Graticule (grid lines)
    const graticule = [];
    for (let lon = -180; lon <= 180; lon += 30) {
      graticule.push({ type: 'meridian', value: lon });
    }
    for (let lat = -60; lat <= 60; lat += 30) {
      graticule.push({ type: 'parallel', value: lat });
    }
    
    // ============================================
    // SVG.JS SETUP AND MAP RENDERING
    // ============================================
    
    const container = document.getElementById('map-container');
    const draw = SVG().addTo('#map-container').size('100%', '100%');
    
    // State
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let markers = [];
    
    // Calculate map bounds in projected space
    const projMin = forward(-Math.PI, -Math.PI/2);
    const projMax = forward(Math.PI, Math.PI/2);
    const projWidth = projMax[0] - projMin[0];
    const projHeight = projMax[1] - projMin[1];
    
    // Center of projected map
    const projCenterX = (projMin[0] + projMax[0]) / 2;
    const projCenterY = (projMin[1] + projMax[1]) / 2;
    
    // Create groups
    const oceanGroup = draw.group();
    const graticuleGroup = draw.group();
    const continentGroup = draw.group();
    const markerGroup = draw.group();
    
    // Draw ocean background
    oceanGroup.rect('100%', '100%').addClass('ocean');
    
    // Draw graticule
    function drawGraticule() {
      graticuleGroup.clear();
      graticule.forEach(g => {
        const points = [];
        if (g.type === 'meridian') {
          for (let lat = -90; lat <= 90; lat += 2) {
            const [x, y] = forward(toRad(g.value), toRad(lat));
            points.push([x, y]);
          }
        } else {
          for (let lon = -180; lon <= 180; lon += 2) {
            const [x, y] = forward(toRad(lon), toRad(g.value));
            points.push([x, y]);
          }
        }
        if (points.length > 0) {
          const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]} ${p[1]}`).join(' ');
          graticuleGroup.path(path).addClass('graticule');
        }
      });
    }
    
    // Draw continents
    function drawContinents() {
      continentGroup.clear();
      Object.values(continents).forEach(coords => {
        const points = coords.map(([lon, lat]) => {
          const [x, y] = forward(toRad(lon), toRad(lat));
          return [x, y];
        });
        if (points.length > 0) {
          const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]} ${p[1]}`).join(' ') + ' Z';
          continentGroup.path(path).addClass('continent');
        }
      });
    }
    
    // ============================================
    // COORDINATE TRANSFORMS
    // ============================================
    
    function getSVGSize() {
      return { width: container.clientWidth, height: container.clientHeight };
    }
    
    // Projected → Screen
    function projectToScreen(px, py) {
      const { width, height } = getSVGSize();
      const sx = (px - projCenterX) * scale + width / 2 + offsetX;
      const sy = (py - projCenterY) * scale + height / 2 + offsetY;
      return [sx, sy];
    }
    
    // Screen → Projected
    function screenToProjected(sx, sy) {
      const { width, height } = getSVGSize();
      const px = (sx - width / 2 - offsetX) / scale + projCenterX;
      const py = (sy - height / 2 - offsetY) / scale + projCenterY;
      return [px, py];
    }
    
    // Lat/Lon → Screen
    function geoToScreen(lat, lon) {
      const [px, py] = forward(toRad(lon), toRad(lat));
      return projectToScreen(px, py);
    }
    
    // Screen → Lat/Lon
    function screenToGeo(sx, sy) {
      const [px, py] = screenToProjected(sx, sy);
      const [lon, lat] = inverse(px, py);
      return [toDeg(lat), toDeg(lon)];
    }
    
    // Apply transformation to all groups
    function applyTransform() {
      const { width, height } = getSVGSize();
      const tx = width / 2 + offsetX;
      const ty = height / 2 + offsetY;
      
      [oceanGroup, graticuleGroup, continentGroup, markerGroup].forEach(g => {
        g.transform({
          translation: [tx, ty],
          scale: scale,
          origin: [0, 0]
        });
      });
      
      // Also update marker positions (they use absolute positioning in projected space)
      updateMarkers();
    }
    
    // ============================================
    // MARKERS
    // ============================================
    
    function updateMarkers() {
      markers.forEach(m => {
        const [sx, sy] = geoToScreen(m.lat, m.lon);
        m.circle.node.setAttribute('cx', sx);
        m.circle.node.setAttribute('cy', sy);
        
        // Update tooltip if exists
        if (m.tooltip) {
          const tooltipSvgX = sx + 15;
          const tooltipSvgY = sy - 15;
          m.tooltip.move(tooltipSvgX, tooltipSvgY);
        }
      });
    }
    
    function addMarker(lat, lon) {
      const [sx, sy] = geoToScreen(lat, lon);
      const circle = markerGroup.circle(8)
        .addClass('marker')
        .plot(sx, sy);
      
      const marker = { lat, lon, circle };
      markers.push(marker);
      
      // Add label
      const label = markerGroup.text(`${lat.toFixed(1)}°, ${lon.toFixed(1)}°`)
        .font({ size: 10, family: 'monospace' })
        .move(sx + 12, sy - 12)
        .fill('#94a3b8');
      marker.label = label;
      
      updateMarkers();
    }
    
    function addMarkerFromCoords() {
      const latInput = document.getElementById('lat-input');
      const lonInput = document.getElementById('lon-input');
      const lat = parseFloat(latInput.value);
      const lon = parseFloat(lonInput.value);
      
      if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        alert('Please enter valid coordinates:\nLatitude: -90 to 90\nLongitude: -180 to 180');
        return;
      }
      
      addMarker(lat, lon);
    }
    
    // ============================================
    // ZOOM AND PAN
    // ============================================
    
    // Mouse wheel zoom
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
      const newScale = Math.max(0.5, Math.min(50, scale * zoomFactor));
      
      // Zoom toward mouse position
      const rect = container.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      
      // Calculate world coordinates under mouse before zoom
      const wx = (mx - container.clientWidth / 2 - offsetX) / scale;
      const wy = (my - container.clientHeight / 2 - offsetY) / scale;
      
      scale = newScale;
      
      // Adjust offset to keep world coordinates under mouse
      offsetX = mx - container.clientWidth / 2 - wx * scale;
      offsetY = my - container.clientHeight / 2 - wy * scale;
      
      applyTransform();
    }, { passive: false });
    
    // Mouse drag pan
    container.addEventListener('mousedown', (e) => {
      if (e.target === container || e.target.tagName === 'svg' || e.target.classList.contains('ocean') || 
          e.target.classList.contains('continent') || e.target.classList.contains('graticule')) {
        isDragging = true;
        dragStart = { x: e.clientX - offsetX, y: e.clientY - offsetY };
      }
    });
    
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        offsetX = e.clientX - dragStart.x;
        offsetY = e.clientY - dragStart.y;
        applyTransform();
      }
    });
    
    window.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    // Click for inverse projection
    container.addEventListener('click', (e) => {
      if (Math.abs(e.movementX) > 2 || Math.abs(e.movementY) > 2) return; // Ignore if dragging
      
      const rect = container.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      
      const [lat, lon] = screenToGeo(sx, sy);
      
      document.getElementById('coords-text').innerHTML = 
        `Lat: <span style="color:#f59e0b">${lat.toFixed(4)}°</span><br>` +
        `Lon: <span style="color:#f59e0b">${lon.toFixed(4)}°</span>`;
    });
    
    // ============================================
    // RESET VIEW
    // ============================================
    
    function resetView() {
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      applyTransform();
    }
    
    // ============================================
    // INITIALIZATION
    // ============================================
    
    function init() {
      drawGraticule();
      drawContinents();
      applyTransform();
      
      // Add some initial example markers
      addMarker(40.7128, -74.0060);  // New York
      addMarker(51.5074, -0.1278);   // London
      addMarker(35.6762, 139.6503);  // Tokyo
      addMarker(-33.8688, 151.2093); // Sydney
      addMarker(48.8566, 2.3522);    // Paris
      addMarker(55.7558, 37.6173);   // Moscow
      addMarker(37.7749, -122.4194); // San Francisco
      addMarker(-23.5505, -46.6333); // São Paulo
      addMarker(1.3521, 103.8198);   // Singapore
      addMarker(27.1751, 78.0421);   // New Delhi
      
      // Handle resize
      window.addEventListener('resize', () => {
        applyTransform();
      });
    }
    
    // Start
    init();
  </script>
</body>
</html>
