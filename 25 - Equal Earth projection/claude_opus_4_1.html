<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Equal Earth Projection Map</title>
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        
        #map-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        
        #map-container:active {
            cursor: grabbing;
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            min-width: 250px;
        }
        
        #info-panel h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 16px;
        }
        
        .info-row {
            margin: 8px 0;
            font-size: 13px;
            color: #666;
        }
        
        .info-row strong {
            color: #333;
            display: inline-block;
            width: 80px;
        }
        
        .coordinates {
            font-family: 'Courier New', monospace;
            color: #0066cc;
            font-weight: bold;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }
        
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        #zoom-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .marker-label {
            font-size: 10px;
            fill: white;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="map-container"></div>
    
    <div id="info-panel">
        <h3>🌍 Equal Earth Projection</h3>
        <div class="info-row">
            <strong>Click Pos:</strong>
            <span id="click-coords" class="coordinates">—</span>
        </div>
        <div class="info-row">
            <strong>Mouse Pos:</strong>
            <span id="mouse-coords" class="coordinates">—</span>
        </div>
        <div class="info-row">
            <strong>Zoom:</strong>
            <span id="zoom-level">1.00x</span>
        </div>
    </div>
    
    <div id="controls">
        <button onclick="resetView()">Reset View</button>
        <button onclick="addRandomMarker()">Add Random Marker</button>
        <button onclick="clearMarkers()">Clear Markers</button>
        <button onclick="showMajorCities()">Major Cities</button>
    </div>

    <script>
        // Equal Earth Projection Implementation
        class EqualEarthProjection {
            constructor(scale = 200) {
                this.scale = scale;
                this.center = [0, 0]; // [longitude, latitude]
                
                // Equal Earth projection constants
                this.A1 = 1.340264;
                this.A2 = -0.081106;
                this.A3 = 0.000893;
                this.A4 = 0.003796;
                this.M = Math.sqrt(3) / 2;
            }
            
            // Forward projection: (lon, lat) in degrees -> (x, y) in projection space
            forward(lon, lat) {
                const lambda = (lon - this.center[0]) * Math.PI / 180;
                const phi = lat * Math.PI / 180;
                
                const sinPhi = Math.sin(phi);
                const sinPhi2 = sinPhi * sinPhi;
                const sinPhi4 = sinPhi2 * sinPhi2;
                const sinPhi6 = sinPhi4 * sinPhi2;
                
                const theta = Math.asin(this.M * sinPhi);
                const sinTheta = Math.sin(theta);
                const sinTheta2 = sinTheta * sinTheta;
                const sinTheta4 = sinTheta2 * sinTheta2;
                const sinTheta6 = sinTheta4 * sinTheta2;
                
                const x = lambda * Math.cos(theta) / (this.M * (
                    this.A1 + 3 * this.A2 * sinTheta2 + sinTheta4 * (7 * this.A3 + 9 * this.A4 * sinTheta2)
                ));
                
                const y = theta * (this.A1 + this.A2 * sinTheta2 + sinTheta4 * (this.A3 + this.A4 * sinTheta2));
                
                return [x * this.scale, -y * this.scale];
            }
            
            // Inverse projection: (x, y) in projection space -> (lon, lat) in degrees
            inverse(x, y) {
                x = x / this.scale;
                y = -y / this.scale;
                
                // Newton-Raphson iteration to find theta
                let theta = y;
                const tolerance = 1e-9;
                const maxIter = 12;
                
                for (let i = 0; i < maxIter; i++) {
                    const sinTheta = Math.sin(theta);
                    const sinTheta2 = sinTheta * sinTheta;
                    const sinTheta4 = sinTheta2 * sinTheta2;
                    const sinTheta6 = sinTheta4 * sinTheta2;
                    
                    const f = theta * (this.A1 + this.A2 * sinTheta2 + sinTheta4 * (this.A3 + this.A4 * sinTheta2)) - y;
                    
                    const cosTheta = Math.cos(theta);
                    const cosTheta2 = cosTheta * cosTheta;
                    
                    const fp = this.A1 + sinTheta2 * (3 * this.A2 + sinTheta2 * (
                        7 * this.A3 + 9 * this.A4 * sinTheta2
                    ));
                    
                    theta -= f / fp;
                    
                    if (Math.abs(f) < tolerance) break;
                }
                
                const sinTheta = Math.sin(theta);
                const cosTheta = Math.cos(theta);
                const sinTheta2 = sinTheta * sinTheta;
                const sinTheta4 = sinTheta2 * sinTheta2;
                
                const denominator = cosTheta / (this.M * (
                    this.A1 + 3 * this.A2 * sinTheta2 + sinTheta4 * (7 * this.A3 + 9 * this.A4 * sinTheta2)
                ));
                
                const lambda = x / denominator;
                const phi = Math.asin(sinTheta / this.M);
                
                const lon = lambda * 180 / Math.PI + this.center[0];
                const lat = phi * 180 / Math.PI;
                
                return [lon, lat];
            }
        }
        
        // Simplified world map data (continents outline)
        const worldMapPaths = [
            // North America
            "M -170,70 L -170,50 -160,45 -150,40 -140,35 -130,30 -120,32 -110,35 -100,38 -90,40 -80,42 -70,45 -60,48 -50,50 -60,55 -70,60 -80,65 -90,68 -100,70 -110,72 -120,73 -130,72 -140,71 -150,70 -160,69 Z",
            // South America
            "M -80,-5 L -75,-10 -70,-15 -65,-20 -60,-25 -55,-30 -50,-35 -45,-40 -40,-45 -35,-50 -35,-55 -40,-53 -45,-50 -50,-45 -55,-40 -60,-35 -65,-30 -70,-25 -75,-20 -78,-15 -80,-10 Z",
            // Europe
            "M -10,50 L 0,52 10,54 20,55 30,56 40,55 45,53 40,50 35,48 30,45 25,43 20,42 15,40 10,38 5,36 0,38 -5,40 -10,45 Z",
            // Africa
            "M -10,35 L 0,30 10,25 20,20 30,15 35,10 35,5 35,0 35,-5 35,-10 35,-15 35,-20 35,-25 35,-30 30,-32 25,-34 20,-35 15,-35 10,-34 5,-32 0,-30 -5,-25 -10,-20 -10,-15 -10,-10 -10,-5 -10,0 -10,5 -10,10 -10,15 -10,20 -10,25 -10,30 Z",
            // Asia
            "M 40,70 L 50,68 60,65 70,62 80,60 90,58 100,55 110,52 120,50 130,48 140,45 150,42 160,40 170,38 170,35 165,32 160,30 155,28 150,25 145,22 140,20 135,18 130,15 125,12 120,10 115,8 110,5 105,3 100,0 95,-2 90,-5 85,-3 80,0 75,5 70,10 65,15 60,20 55,25 50,30 45,35 40,40 40,45 40,50 40,55 40,60 40,65 Z",
            // Australia
            "M 110,-20 L 120,-22 130,-25 140,-28 150,-30 155,-32 150,-35 145,-35 140,-34 135,-32 130,-30 125,-28 120,-26 115,-24 110,-22 Z"
        ];
        
        // Major cities data
        const majorCities = [
            {name: "New York", lat: 40.7128, lon: -74.0060},
            {name: "London", lat: 51.5074, lon: -0.1278},
            {name: "Tokyo", lat: 35.6762, lon: 139.6503},
            {name: "Paris", lat: 48.8566, lon: 2.3522},
            {name: "Sydney", lat: -33.8688, lon: 151.2093},
            {name: "Moscow", lat: 55.7558, lon: 37.6173},
            {name: "Beijing", lat: 39.9042, lon: 116.4074},
            {name: "Rio", lat: -22.9068, lon: -43.1729},
            {name: "Cairo", lat: 30.0444, lon: 31.2357},
            {name: "Mumbai", lat: 19.0760, lon: 72.8777}
        ];
        
        // Initialize SVG and projection
        const draw = SVG().addTo('#map-container').size('100%', '100%');
        const projection = new EqualEarthProjection(200);
        
        // Create map group for transformations
        const mapGroup = draw.group();
        let currentZoom = 1;
        let isPanning = false;
        let panStart = {x: 0, y: 0};
        let panOffset = {x: window.innerWidth/2, y: window.innerHeight/2};
        
        // Draw world map
        function drawWorldMap() {
            const worldGroup = mapGroup.group().addClass('world-map');
            
            // Ocean background
            const oceanBg = worldGroup.rect(projection.scale * 4, projection.scale * 2)
                .center(0, 0)
                .fill('#4a90e2')
                .opacity(0.3);
            
            // Draw continents
            worldMapPaths.forEach(pathData => {
                const path = worldGroup.path(pathData)
                    .fill('#2ecc71')
                    .stroke({color: '#27ae60', width: 1})
                    .opacity(0.8);
            });
            
            // Draw graticules (grid lines)
            const graticuleGroup = worldGroup.group().opacity(0.3);
            
            // Longitude lines
            for (let lon = -180; lon <= 180; lon += 30) {
                const points = [];
                for (let lat = -90; lat <= 90; lat += 5) {
                    const [x, y] = projection.forward(lon, lat);
                    points.push([x, y]);
                }
                graticuleGroup.polyline(points).fill('none').stroke({color: '#666', width: 0.5});
            }
            
            // Latitude lines
            for (let lat = -90; lat <= 90; lat += 30) {
                const points = [];
                for (let lon = -180; lon <= 180; lon += 5) {
                    const [x, y] = projection.forward(lon, lat);
                    points.push([x, y]);
                }
                graticuleGroup.polyline(points).fill('none').stroke({color: '#666', width: 0.5});
            }
            
            // Center the map
            mapGroup.transform({
                translateX: panOffset.x,
                translateY: panOffset.y
            });
        }
        
        // Marker management
        const markersGroup = mapGroup.group().addClass('markers');
        
        function addMarker(lat, lon, label = '') {
            const [x, y] = projection.forward(lon, lat);
            
            const markerGroup = markersGroup.group();
            
            // Outer circle
            markerGroup.circle(16)
                .center(x, y)
                .fill('#e74c3c')
                .opacity(0.3);
            
            // Inner circle
            markerGroup.circle(8)
                .center(x, y)
                .fill('#c0392b');
            
            // Label
            if (label) {
                markerGroup.rect(label.length * 8 + 10, 20)
                    .center(x, y - 20)
                    .fill('#333')
                    .radius(3)
                    .opacity(0.8);
                
                markerGroup.text(label)
                    .center(x, y - 20)
                    .addClass('marker-label');
            }
            
            return markerGroup;
        }
        
        // Convert screen coordinates to map coordinates
        function screenToMap(screenX, screenY) {
            const transform = mapGroup.transform();
            const mapX = (screenX - transform.translateX) / transform.scaleX;
            const mapY = (screenY - transform.translateY) / transform.scaleY;
            return [mapX, mapY];
        }
        
        // Mouse event handlers
        let mouseDownPos = null;
        
        draw.on('mousedown', (e) => {
            isPanning = true;
            mouseDownPos = {x: e.clientX, y: e.clientY};
            panStart = {
                x: mapGroup.transform().translateX,
                y: mapGroup.transform().translateY
            };
            document.getElementById('map-container').style.cursor = 'grabbing';
        });
        
        draw.on('mousemove', (e) => {
            // Update mouse coordinates
            const [mapX, mapY] = screenToMap(e.clientX, e.clientY);
            const [lon, lat] = projection.inverse(mapX, mapY);
            
            if (!isNaN(lon) && !isNaN(lat) && Math.abs(lon) <= 180 && Math.abs(lat) <= 90) {
                document.getElementById('mouse-coords').textContent = 
                    `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
            } else {
                document.getElementById('mouse-coords').textContent = '—';
            }
            
            // Handle panning
            if (isPanning && mouseDownPos) {
                const dx = e.clientX - mouseDownPos.x;
                const dy = e.clientY - mouseDownPos.y;
                
                mapGroup.transform({
                    translateX: panStart.x + dx,
                    translateY: panStart.y + dy,
                    scale: currentZoom
                });
            }
        });
        
        draw.on('mouseup', (e) => {
            if (isPanning && mouseDownPos) {
                const dx = e.clientX - mouseDownPos.x;
                const dy = e.clientY - mouseDownPos.y;
                
                // If it was a click (not a drag)
                if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
                    const [mapX, mapY] = screenToMap(e.clientX, e.clientY);
                    const [lon, lat] = projection.inverse(mapX, mapY);
                    
                    if (!isNaN(lon) && !isNaN(lat) && Math.abs(lon) <= 180 && Math.abs(lat) <= 90) {
                        document.getElementById('click-coords').textContent = 
                            `${lat.toFixed(3)}°, ${lon.toFixed(3)}°`;
                        
                        // Add a temporary marker at click position
                        const tempMarker = markersGroup.circle(6)
                            .center(mapX, mapY)
                            .fill('#3498db')
                            .opacity(0.8);
                        
                        // Remove after 2 seconds
                        setTimeout(() => tempMarker.remove(), 2000);
                    }
                }
            }
            
            isPanning = false;
            mouseDownPos = null;
            document.getElementById('map-container').style.cursor = 'grab';
        });
        
        // Zoom handling
        document.getElementById('map-container').addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newZoom = Math.max(0.5, Math.min(10, currentZoom * delta));
            
            // Get mouse position relative to map
            const [mapX, mapY] = screenToMap(e.clientX, e.clientY);
            
            // Calculate new pan to keep mouse position fixed
            const transform = mapGroup.transform();
            const newPanX = e.clientX - mapX * newZoom;
            const newPanY = e.clientY - mapY * newZoom;
            
            mapGroup.transform({
                translateX: newPanX,
                translateY: newPanY,
                scale: newZoom
            });
            
            currentZoom = newZoom;
            document.getElementById('zoom-level').textContent = `${currentZoom.toFixed(2)}x`;
        });
        
        // Control functions
        function resetView() {
            currentZoom = 1;
            panOffset = {x: window.innerWidth/2, y: window.innerHeight/2};
            mapGroup.transform({
                translateX: panOffset.x,
                translateY: panOffset.y,
                scale: 1
            });
            document.getElementById('zoom-level').textContent = '1.00x';
        }
        
        function addRandomMarker() {
            const lat = Math.random() * 180 - 90;
            const lon = Math.random() * 360 - 180;
            addMarker(lat, lon, `${lat.toFixed(1)}°, ${lon.toFixed(1)}°`);
        }
        
        function clearMarkers() {
            markersGroup.clear();
        }
        
        function showMajorCities() {
            clearMarkers();
            majorCities.forEach(city => {
                addMarker(city.lat, city.lon, city.name);
            });
        }
        
        // Initialize map
        drawWorldMap();
        
        // Add some initial markers
        addMarker(0, 0, "Origin");
        addMarker(51.5074, -0.1278, "London");
        addMarker(-33.8688, 151.2093, "Sydney");
        
        // Handle window resize
        window.addEventListener('resize', () => {
            draw.size(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
