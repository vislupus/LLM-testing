// ============================================================
//  EQUAL EARTH PROJECTION - Complete Implementation
// ============================================================

// Equal Earth projection parameters (Šavrič, Patterson & Jenny, 2019)
const A1 = 1.340264;
const A2 = -0.081106;
const A3 = 0.000893;
const A4 = 0.003796;
const M = Math.sqrt(3) / 2;

const DEG2RAD = Math.PI / 180;
const RAD2DEG = 180 / Math.PI;

// Forward projection: (lat, lon) in degrees → (x, y) in projection units
function equalEarthForward(lat, lon) {
  const phi = lat * DEG2RAD;
  const lam = lon * DEG2RAD;

  const sinTheta = M * Math.sin(phi);
  let theta = Math.asin(sinTheta);

  // Newton-Raphson to solve parametric latitude
  for (let i = 0; i < 12; i++) {
    const t = theta;
    const st = Math.sin(t);
    const ct = Math.cos(t);
    const num = t + st * ct - Math.PI * M * Math.sin(phi);
    const den = 1 + ct * ct - Math.PI * M * Math.cos(phi) * 0; // simplified
    // Actually: theta + sin(theta)*cos(theta) - (1+cos²(theta)) ... wait, let me use proper parametric
    break;
  }

  // Proper Equal Earth uses parametric theta where sin(theta) = sqrt(3)/2 * sin(phi)
  // Then directly computes x, y from theta
  const th = theta;
  const th2 = th * th;
  const th6 = th2 * th2 * th2;

  const x = (2 * lam * Math.cos(th)) / (M * (A1 + 3 * A2 * th2 + th6 * (7 * A3 + 9 * A4 * th2)));
  const y = th * (A1 + A2 * th2 + th6 * (A3 + A4 * th2));

  return { x, y };
}

// Inverse projection: (x, y) in projection units → (lat, lon) in degrees
function equalEarthInverse(x, y) {
  // Solve for theta from y using Newton-Raphson
  let theta = y; // initial guess

  for (let i = 0; i < 30; i++) {
    const th = theta;
    const th2 = th * th;
    const th6 = th2 * th2 * th2;

    const fy = th * (A1 + A2 * th2 + th6 * (A3 + A4 * th2)) - y;
    const dfy = A1 + 3 * A2 * th2 + th6 * (7 * A3 + 9 * A4 * th2);

    const delta = fy / dfy;
    theta -= delta;

    if (Math.abs(delta) < 1e-12) break;
  }

  const th = theta;
  const th2 = th * th;
  const th6 = th2 * th2 * th2;

  const cosTheta = Math.cos(th);
  const denom = M * (A1 + 3 * A2 * th2 + th6 * (7 * A3 + 9 * A4 * th2));

  const lam = (x * denom) / (2 * cosTheta);
  const sinPhi = Math.sin(th) / M;

  // Clamp to valid range
  const clampedSinPhi = Math.max(-1, Math.min(1, sinPhi));
  const phi = Math.asin(clampedSinPhi);

  const lat = phi * RAD2DEG;
  const lon = lam * RAD2DEG;

  return { lat, lon };
}

// ============================================================
//  WORLD GEOMETRY DATA (simplified natural earth boundaries)
// ============================================================

// Graticule generation
function generateGraticule() {
  const lines = [];

  // Meridians every 30°
  for (let lon = -180; lon <= 180; lon += 30) {
    const points = [];
    for (let lat = -90; lat <= 90; lat += 2) {
      points.push(equalEarthForward(lat, lon));
    }
    lines.push(points);
  }

  // Parallels every 30°
  for (let lat = -90; lat <= 90; lat += 30) {
    const points = [];
    for (let lon = -180; lon <= 180; lon += 2) {
      points.push(equalEarthForward(lat, lon));
    }
    lines.push(points);
  }

  return lines;
}

// Outline of map boundary
function generateOutline() {
  const points = [];
  // Top edge
  for (let lon = -180; lon <= 180; lon += 1) {
    points.push(equalEarthForward(90, lon));
  }
  // Right edge down
  for (let lat = 90; lat >= -90; lat -= 1) {
    points.push(equalEarthForward(lat, 180));
  }
  // Bottom edge
  for (let lon = 180; lon >= -180; lon -= 1) {
    points.push(equalEarthForward(-90, lon));
  }
  // Left edge up
  for (let lat = -90; lat <= 90; lat += 1) {
    points.push(equalEarthForward(lat, -180));
  }
  return points;
}

// ============================================================
//  SVG.JS MAP RENDERING
// ============================================================

const container = document.getElementById('map-container');
const draw = SVG().addTo('#map-container').size('100%', '100%');

// Projection scale and offset
const SCALE = 180;
let viewState = {
  zoom: 1,
  panX: 0,
  panY: 0,
  baseScale: SCALE
};

// Main group for all map elements (handles zoom/pan transforms)
const mapGroup = draw.group().attr('id', 'map-group');

// Convert projection coords to SVG coords
function projToSVG(px, py) {
  const cx = container.clientWidth / 2;
  const cy = container.clientHeight / 2;
  return {
    x: cx + px * viewState.baseScale,
    y: cy - py * viewState.baseScale // flip Y
  };
}

// Convert SVG coords back to projection coords
function svgToProj(sx, sy) {
  const cx = container.clientWidth / 2;
  const cy = container.clientHeight / 2;
  return {
    x: (sx - cx) / viewState.baseScale,
    y: -(sy - cy) / viewState.baseScale
  };
}

// Convert screen coords to geo coords (accounting for zoom/pan)
function screenToGeo(screenX, screenY) {
  // Get the current transform of mapGroup
  const transform = mapGroup.transform();
  // Invert the transform to get SVG coordinates
  const svgX = (screenX - transform.translateX) / transform.scaleX;
  const svgY = (screenY - transform.translateY) / transform.scaleY;

  // Now convert SVG to projection coords
  const proj = svgToProj(svgX, svgY);

  // Inverse projection to get lat/lon
  return equalEarthInverse(proj.x, proj.y);
}

// Convert geo coords to SVG coords
function geoToSVG(lat, lon) {
  const proj = equalEarthForward(lat, lon);
  return projToSVG(proj.x, proj.y);
}

// ============================================================
//  DRAW THE MAP
// ============================================================

function drawMap() {
  mapGroup.clear();

  // Background ocean
  const outline = generateOutline();
  const outlinePath = outline.map((p, i) => {
    const sv = projToSVG(p.x, p.y);
    return (i === 0 ? 'M' : 'L') + sv.x.toFixed(2) + ',' + sv.y.toFixed(2);
  }).join(' ') + ' Z';

  mapGroup.path(outlinePath).fill('#1a2540').stroke({ color: '#304080', width: 1.5 });

  // Graticule
  const graticule = generateGraticule();
  const gratGroup = mapGroup.group().attr('class', 'graticule');
  for (const line of graticule) {
    const d = line.map((p, i) => {
      const sv = projToSVG(p.x, p.y);
      return (i === 0 ? 'M' : 'L') + sv.x.toFixed(2) + ',' + sv.y.toFixed(2);
    }).join(' ');
    gratGroup.path(d).fill('none').stroke({ color: 'rgba(60, 90, 140, 0.25)', width: 0.5 });
  }

  // Extra graticules every 10° (finer)
  const fineGrat = mapGroup.group();
  for (let lon = -180; lon <= 180; lon += 10) {
    if (lon % 30 === 0) continue;
    const points = [];
    for (let lat = -90; lat <= 90; lat += 4) {
      points.push(equalEarthForward(lat, lon));
    }
    const d = points.map((p, i) => {
      const sv = projToSVG(p.x, p.y);
      return (i === 0 ? 'M' : 'L') + sv.x.toFixed(2) + ',' + sv.y.toFixed(2);
    }).join(' ');
    fineGrat.path(d).fill('none').stroke({ color: 'rgba(40, 60, 100, 0.12)', width: 0.3 });
  }
  for (let lat = -80; lat <= 80; lat += 10) {
    if (lat % 30 === 0) continue;
    const points = [];
    for (let lon = -180; lon <= 180; lon += 4) {
      points.push(equalEarthForward(lat, lon));
    }
    const d = points.map((p, i) => {
      const sv = projToSVG(p.x, p.y);
      return (i === 0 ? 'M' : 'L') + sv.x.toFixed(2) + ',' + sv.y.toFixed(2);
    }).join(' ');
    fineGrat.path(d).fill('none').stroke({ color: 'rgba(40, 60, 100, 0.12)', width: 0.3 });
  }

  // Equator, prime meridian, tropics
  const specialLines = [
    { lat: null, lon: 0, color: 'rgba(100, 140, 200, 0.35)', width: 0.8 },    // Prime meridian
    { lat: 0, lon: null, color: 'rgba(100, 140, 200, 0.35)', width: 0.8 },    // Equator
    { lat: 23.436, lon: null, color: 'rgba(200, 160, 80, 0.2)', width: 0.5 }, // Tropic of Cancer
    { lat: -23.436, lon: null, color: 'rgba(200, 160, 80, 0.2)', width: 0.5 }, // Tropic of Capricorn
    { lat: 66.564, lon: null, color: 'rgba(120, 160, 220, 0.2)', width: 0.5 },  // Arctic Circle
    { lat: -66.564, lon: null, color: 'rgba(120, 160, 220, 0.2)', width: 0.5 }, // Antarctic Circle
  ];
  for (const sl of specialLines) {
    const points = [];
    if (sl.lon !== null) {
      for (let lat = -90; lat <= 90; lat += 1) {
        points.push(equalEarthForward(lat, sl.lon));
      }
    } else {
      for (let lon = -180; lon <= 180; lon += 1) {
        points.push(equalEarthForward(sl.lat, lon));
      }
    }
    const d = points.map((p, i) => {
      const sv = projToSVG(p.x, p.y);
      return (i === 0 ? 'M' : 'L') + sv.x.toFixed(2) + ',' + sv.y.toFixed(2);
    }).join(' ');
    mapGroup.path(d).fill('none').stroke({ color: sl.color, width: sl.width, dasharray: '4,3' });
  }

  // Draw continents
  const coastlines = getWorldCoastlines();
  const landGroup = mapGroup.group().attr('class', 'land');

  for (const [name, coords] of Object.entries(coastlines)) {
    const projectedPoints = coords.map(([lon, lat]) => {
      const proj = equalEarthForward(lat, lon);
      return projToSVG(proj.x, proj.y);
    });

    const d = projectedPoints.map((p, i) =>
      (i === 0 ? 'M' : 'L') + p.x.toFixed(2) + ',' + p.y.toFixed(2)
    ).join(' ') + ' Z';

    // Color based on continent
    let fillColor = '#2a3a28';
    let strokeColor = '#4a7a48';
    if (name.includes('antarctica')) {
      fillColor = '#3a3a4a';
      strokeColor = '#5a5a6a';
    } else if (name.includes('greenland') || name.includes('iceland')) {
      fillColor = '#2d382d';
      strokeColor = '#4a7048';
    }

    const gradient = draw.gradient('linear', function(add) {
      add.stop(0, '#2a4a30');
      add.stop(1, '#1e3524');
    }).from(0, 0).to(0, 1);

    landGroup.path(d)
      .fill(fillColor)
      .stroke({ color: strokeColor, width: 0.8, linejoin: 'round' })
      .attr('data-name', name)
      .css({ transition: 'fill 0.2s' });
  }

  // Graticule labels
  const labelGroup = mapGroup.group().attr('class', 'labels');
  for (let lon = -150; lon <= 150; lon += 30) {
    const sv = geoToSVG(0, lon);
    labelGroup.text(lon + '°').move(sv.x - 10, sv.y + 4)
      .font({ size: 8, family: 'monospace' })
      .fill('rgba(80, 110, 160, 0.5)');
  }
  for (let lat = -60; lat <= 60; lat += 30) {
    if (lat === 0) continue;
    const sv = geoToSVG(lat, 0);
    labelGroup.text(lat + '°').move(sv.x + 4, sv.y - 4)
      .font({ size: 8, family: 'monospace' })
      .fill('rgba(80, 110, 160, 0.5)');
  }

  // Marker layer (on top)
  mapGroup.group().attr('id', 'markers-layer');
}

// ============================================================
//  MARKERS
// ============================================================

let markers = [];
let markerIdCounter = 0;

function addMarker(lat, lon, label, isCity = false) {
  const sv = geoToSVG(lat, lon);
  const markersLayer = mapGroup.findOne('#markers-layer') || mapGroup.group().attr('id', 'markers-layer');

  const id = markerIdCounter++;
  const g = markersLayer.group().attr('class', 'marker').attr('data-id', id);

  if (isCity) {
    // City marker - smaller, different color
    g.circle(6).center(sv.x, sv.y)
      .fill('#ff6b6b')
      .stroke({ color: '#fff', width: 0.8 })
      .css({ filter: 'drop-shadow(0 0 3px rgba(255,100,100,0.5))' });

    // Pulsing ring
    g.circle(12).center(sv.x, sv.y)
      .fill('none')
      .stroke({ color: 'rgba(255,100,100,0.4)', width: 0.5 });

    // Label
    if (label) {
      const bg = g.rect(label.length * 5.5 + 8, 14).radius(3)
        .move(sv.x + 8, sv.y - 7)
        .fill('rgba(10,10,30,0.85)')
        .stroke({ color: 'rgba(255,100,100,0.3)', width: 0.5 });
      g.text(label)
        .move(sv.x + 12, sv.y - 6)
        .font({ size: 9, family: "'Segoe UI', sans-serif", weight: '500' })
        .fill('#ff9999');
    }
  } else {
    // User marker - blue/cyan theme
    // Outer glow
    g.circle(18).center(sv.x, sv.y)
      .fill('none')
      .stroke({ color: 'rgba(80,160,255,0.2)', width: 1 });

    // Pin dot
    g.circle(8).center(sv.x, sv.y)
      .fill('rgba(80,160,255,0.9)')
      .stroke({ color: '#fff', width: 1.2 })
      .css({ filter: 'drop-shadow(0 0 4px rgba(80,160,255,0.6))' });

    // Crosshair
    g.line(sv.x - 12, sv.y, sv.x - 5, sv.y).stroke({ color: 'rgba(80,160,255,0.4)', width: 0.5 });
    g.line(sv.x + 5, sv.y, sv.x + 12, sv.y).stroke({ color: 'rgba(80,160,255,0.4)', width: 0.5 });
    g.line(sv.x, sv.y - 12, sv.x, sv.y - 5).stroke({ color: 'rgba(80,160,255,0.4)', width: 0.5 });
    g.line(sv.x, sv.y + 5, sv.x, sv.y + 12).stroke({ color: 'rgba(80,160,255,0.4)', width: 0.5 });

    // Coordinate label
    const coordStr = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lon).toFixed(2)}°${lon >= 0 ? 'E' : 'W'}`;
    const bg = g.rect(coordStr.length * 5.8 + 10, 16).radius(4)
      .move(sv.x + 10, sv.y - 8)
      .fill('rgba(10,10,30,0.9)')
      .stroke({ color: 'rgba(80,160,255,0.25)', width: 0.5 });
    g.text(coordStr)
      .move(sv.x + 15, sv.y - 7)
      .font({ size: 9, family: "'SF Mono', 'Fira Code', monospace" })
      .fill('#8ac4ff');

    if (label) {
      g.text(label)
        .move(sv.x + 15, sv.y + 10)
        .font({ size: 9, family: "'Segoe UI', sans-serif" })
        .fill('#aaa');
    }
  }

  markers.push({ id, lat, lon, label, element: g, isCity });

  // Animate in
  g.opacity(0).animate(300).opacity(1);

  return id;
}

function clearMarkers(citiesOnly = false) {
  markers = markers.filter(m => {
    if (citiesOnly && !m.isCity) return true;
    if (!citiesOnly && m.isCity) return true;
    m.element.remove();
    return false;
  });
}

function clearAllMarkers() {
  markers.forEach(m => m.element.remove());
  markers = [];
}

let citiesShown = false;
function toggleCities() {
  if (citiesShown) {
    clearMarkers(true);
    citiesShown = false;
  } else {
    for (const [name, lat, lon] of majorCities) {
      addMarker(lat, lon, name, true);
    }
    citiesShown = true;
  }
}

// ============================================================
//  ZOOM & PAN
// ============================================================

let currentZoom = 1;
let currentPanX = 0;
let currentPanY = 0;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragStartPanX = 0, dragStartPanY = 0;

function applyTransform() {
  const cx = container.clientWidth / 2;
  const cy = container.clientHeight / 2;

  mapGroup.transform({
    translateX: currentPanX + cx * (1 - currentZoom),
    translateY: currentPanY + cy * (1 - currentZoom),
    scaleX: currentZoom,
    scaleY: currentZoom,
    originX: 0,
    originY: 0
  });

  document.getElementById('zoom-level').textContent = currentZoom.toFixed(2) + '×';
}

function zoomAt(screenX, screenY, factor) {
  const oldZoom = currentZoom;
  currentZoom = Math.max(0.5, Math.min(50, currentZoom * factor));
  const actualFactor = currentZoom / oldZoom;

  // Zoom toward mouse position
  currentPanX = screenX - actualFactor * (screenX - currentPanX);
  currentPanY = screenY - actualFactor * (screenY - currentPanY);

  applyTransform();
}

function resetView() {
  currentZoom = 1;
  currentPanX = 0;
  currentPanY = 0;
  applyTransform();
}

// Mouse wheel zoom
container.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

// Pan
container.addEventListener('mousedown', e => {
  if (e.button === 0) {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartPanX = currentPanX;
    dragStartPanY = currentPanY;
  }
});

window.addEventListener('mousemove', e => {
  // Update coordinate display
  updateCoords(e.clientX, e.clientY);

  if (isDragging) {
    currentPanX = dragStartPanX + (e.clientX - dragStartX);
    currentPanY = dragStartPanY + (e.clientY - dragStartY);
    applyTransform();
  }
});

window.addEventListener('mouseup', e => {
  if (isDragging) {
    const dx = Math.abs(e.clientX - dragStartX);
    const dy = Math.abs(e.clientY - dragStartY);

    // If it was a click (minimal drag), place marker
    if (dx < 3 && dy < 3) {
      placeMarkerAtScreen(e.clientX, e.clientY);
    }
    isDragging = false;
  }
});

// Touch support
let touchStartDist = 0;
let touchStartZoom = 1;
container.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    dragStartPanX = currentPanX;
    dragStartPanY = currentPanY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.sqrt(dx*dx + dy*dy);
    touchStartZoom = currentZoom;
  }
}, { passive: true });

container.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    currentPanX = dragStartPanX + (e.touches[0].clientX - dragStartX);
    currentPanY = dragStartPanY + (e.touches[0].clientY - dragStartY);
    applyTransform();
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    currentZoom = Math.max(0.5, Math.min(50, touchStartZoom * (dist / touchStartDist)));
    applyTransform();
  }
}, { passive: false });

container.addEventListener('touchend', e => {
  isDragging = false;
});

// ============================================================
//  COORDINATE DISPLAY
// ============================================================

function updateCoords(screenX, screenY) {
  try {
    const geo = screenToGeo(screenX, screenY);

    if (isNaN(geo.lat) || isNaN(geo.lon) || Math.abs(geo.lat) > 90 || Math.abs(geo.lon) > 180) {
      document.getElementById('coord-lat').innerHTML = 'Lat: <span class="num">—</span>';
      document.getElementById('coord-lon').innerHTML = 'Lon: <span class="num">—</span>';
      return;
    }

    const latDir = geo.lat >= 0 ? 'N' : 'S';
    const lonDir = geo.lon >= 0 ? 'E' : 'W';

    document.getElementById('coord-lat').innerHTML =
      `Lat: <span class="num">${Math.abs(geo.lat).toFixed(4)}° ${latDir}</span>`;
    document.getElementById('coord-lon').innerHTML =
      `Lon: <span class="num">${Math.abs(geo.lon).toFixed(4)}° ${lonDir}</span>`;
  } catch(e) {
    // Outside map bounds
  }
}

function placeMarkerAtScreen(screenX, screenY) {
  try {
    const geo = screenToGeo(screenX, screenY);

    if (isNaN(geo.lat) || isNaN(geo.lon) || Math.abs(geo.lat) > 90 || Math.abs(geo.lon) > 180) {
      return;
    }

    addMarker(geo.lat, geo.lon);

    const latDir = geo.lat >= 0 ? 'N' : 'S';
    const lonDir = geo.lon >= 0 ? 'E' : 'W';

    document.getElementById('coord-click').innerHTML =
      `Click: <span style="color:#8ac4ff">${Math.abs(geo.lat).toFixed(4)}° ${latDir}, ${Math.abs(geo.lon).toFixed(4)}° ${lonDir}</span>`;

    // Flash marker info
    const info = document.getElementById('marker-info');
    info.textContent = `📍 Marker placed at ${Math.abs(geo.lat).toFixed(2)}°${latDir}, ${Math.abs(geo.lon).toFixed(2)}°${lonDir}`;
    info.style.display = 'block';
    setTimeout(() => { info.style.display = 'none'; }, 2000);

    console.log(`Marker: lat=${geo.lat.toFixed(6)}, lon=${geo.lon.toFixed(6)}`);
  } catch(e) {
    console.error('Error placing marker:', e);
  }
}

// ============================================================
//  BUTTON HANDLERS
// ============================================================

document.getElementById('btn-zoom-in').addEventListener('click', () => {
  zoomAt(container.clientWidth / 2, container.clientHeight / 2, 1.5);
});

document.getElementById('btn-zoom-out').addEventListener('click', () => {
  zoomAt(container.clientWidth / 2, container.clientHeight / 2, 1 / 1.5);
});

document.getElementById('btn-reset').addEventListener('click', resetView);

document.getElementById('btn-clear').addEventListener('click', clearAllMarkers);

document.getElementById('btn-cities').addEventListener('click', toggleCities);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') {
    zoomAt(container.clientWidth / 2, container.clientHeight / 2, 1.3);
  } else if (e.key === '-') {
    zoomAt(container.clientWidth / 2, container.clientHeight / 2, 1 / 1.3);
  } else if (e.key === '0') {
    resetView();
  } else if (e.key === 'c' || e.key === 'C') {
    toggleCities();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    clearAllMarkers();
  }
});

// ============================================================
//  WINDOW RESIZE
// ============================================================

window.addEventListener('resize', () => {
  draw.size('100%', '100%');
  drawMap();
  applyTransform();

  // Re-add markers at correct positions
  const oldMarkers = [...markers];
  markers.forEach(m => m.element.remove());
  markers = [];
  for (const m of oldMarkers) {
    addMarker(m.lat, m.lon, m.label, m.isCity);
  }
});

// ============================================================
//  PROJECTION ACCURACY VERIFICATION
// ============================================================

function verifyProjection() {
  const testPoints = [
    [0, 0], [45, 90], [-45, -90], [60, 120], [-30, -60], [89, 179], [-89, -179]
  ];

  console.log('=== Equal Earth Projection Verification ===');
  for (const [lat, lon] of testPoints) {
    const fwd = equalEarthForward(lat, lon);
    const inv = equalEarthInverse(fwd.x, fwd.y);
    const errLat = Math.abs(inv.lat - lat);
    const errLon = Math.abs(inv.lon - lon);
    console.log(
      `(${lat}°, ${lon}°) → (${fwd.x.toFixed(6)}, ${fwd.y.toFixed(6)}) → ` +
      `(${inv.lat.toFixed(6)}°, ${inv.lon.toFixed(6)}°) | ` +
      `Error: Δlat=${errLat.toFixed(8)}° Δlon=${errLon.toFixed(8)}°`
    );
  }
}

// ============================================================
//  INITIALIZE
// ============================================================

drawMap();
applyTransform();
verifyProjection();

// Place a few demo markers
setTimeout(() => {
  // Show that forward + inverse projection work correctly
  const demoPoints = [
    [0, 0, "Origin (Gulf of Guinea)"],
  ];
  for (const [lat, lon, label] of demoPoints) {
    addMarker(lat, lon, label);
  }
}, 500);

console.log('%c🌍 Equal Earth Map Ready', 'font-size: 16px; color: #8aa0ee;');
console.log('Click anywhere on the map to place markers.');
console.log('Use +/- keys or scroll to zoom, drag to pan.');
console.log('Press C to toggle major cities.');
</script>
