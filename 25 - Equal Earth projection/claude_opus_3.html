<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; }
    #coords { position: absolute; left: 10px; top: 10px; color: red; user-select: none; }
  </style>
</head>
<body>
<div id="coords"></div>
<script>
const width  = window.innerWidth;
const height = window.innerHeight;
const globe = { cx:0, cy:0, scale:1, w:width, h:height };

// Equal Earth projection constants
const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796; 
const M = Math.sqrt(3) / 2.0;

function forward(lambda, phi) {
  lambda = lambda * Math.PI / 180; // longitude in radians
  phi = phi * Math.PI / 180; // latitude in radians
  
  const theta = Math.asin(M * Math.sin(phi));  
  const theta2 = theta * theta;
  const theta6 = theta2 * theta2 * theta2;
  
  const x = lambda * Math.cos(theta) / (M * (A1 + 3*A2*theta2 + theta6*(7*A3 + 9*A4*theta2)));
  const y = theta * (A1 + A2*theta2 + theta6*(A3 + A4*theta2));

  return [x, y];  
}

function inverse(x, y) {
  let theta = y;
  let theta_new = y;
  
  // Iteratively solve for theta using Newton-Raphson
  do {
    theta = theta_new;
    const theta2 = theta * theta;
    const theta6 = theta2 * theta2 * theta2;
    const f = theta * (A1 + A2*theta2 + theta6*(A3 + A4*theta2)) - y;
    const df = A1 + 3*A2*theta2 + theta6*(7*A3 + 9*A4*theta2);
    theta_new = theta - f/df;
  } while (Math.abs(theta - theta_new) > 1e-9);
   
  const phi = Math.asin(Math.sin(theta) / M);
  
  const theta2 = theta * theta;
  const theta6 = theta2 * theta2 * theta2;
  const lambda = M * x * (A1 + 3*A2*theta2 + theta6*(7*A3 + 9*A4*theta2)) / Math.cos(theta);
  
  return [lambda * 180 / Math.PI, phi * 180 / Math.PI];
}

function geo2screen(coords) {
  const [x, y] = forward(coords[0], coords[1]);
  return [
    (x - globe.cx) * globe.scale + globe.w/2, 
    (y - globe.cy) * globe.scale + globe.h/2
  ];  
}

function screen2geo(x, y) {
  return inverse(
    ((x - globe.w/2) / globe.scale) + globe.cx,
    ((y - globe.h/2) / globe.scale) + globe.cy 
  );
}

const draw = SVG().addTo('body').size(width, height);
const world = draw.group();

// Draw the world map
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json")
  .then(r => r.json()) 
  .then(world_data => {
    
    world_data.features.forEach(feature => {
      feature.geometry.coordinates.forEach(polygon => {
        
        world.polygon(polygon.map(c => geo2screen(c)))
          .fill('lightgreen').stroke({ width: 0.5, color: 'black' });
                
      });
    });

    world.circle(5).center(width/2, height/2).fill('red');    
    document.querySelector('#coords').innerText = '0°N, 0°E';
  });
  
// Handle zoom & pan
function zoom(amount) {
  const nscale = globe.scale * amount;
  if (nscale < 0.1 || nscale > 10) return;

  const scx = globe.w/2;
  const scy = globe.h/2; 
  
  globe.cx += (scx/globe.scale - scx/nscale);
  globe.cy += (scy/globe.scale - scy/nscale);
  globe.scale = nscale;
  
  world.transform({ 
    translateX: -globe.cx * globe.scale + scx,
    translateY: -globe.cy * globe.scale + scy, 
    scale: globe.scale
  });  
}

draw.on('wheel', function(e) {
  e.preventDefault();  
  const amount = (e.deltaY || e.originalEvent.wheelDelta) < 0 ? 1.1 : 1/1.1;
  zoom(amount);
});

let dragging = false;
let drag_start;

draw.on('mousedown', function(e) {
  dragging = true;
  drag_start = { x: e.screenX, y: e.screenY }; 
});

draw.on('mousemove', function(e) {
  if (dragging) {
    const dx = e.screenX - drag_start.x;
    const dy = e.screenY - drag_start.y;
    globe.cx -= dx / globe.scale;
    globe.cy -= dy / globe.scale;
    
    world.transform({
      translateX: -globe.cx * globe.scale + globe.w/2, 
      translateY: -globe.cy * globe.scale + globe.h/2,
    });
    
    drag_start = { x: e.screenX, y: e.screenY };
  }    
});

draw.on('mouseup', function() {
  dragging = false;  
});

// Handle marker & coordinates display  
draw.on('click', function(e) {
  const coords = screen2geo(e.x, e.y);
  world.circle(5).center(e.x, e.y).fill('red');
  const lat = Math.abs(coords[1]).toFixed(4) + "°" + (coords[1] >= 0 ? "N" : "S");   
  const lng = Math.abs(coords[0]).toFixed(4) + "°" + (coords[0] >= 0 ? "E" : "W");
  document.querySelector('#coords').innerText = lat + ", " + lng;
});

</script>
</body>
</html>
