<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equal Earth — Interactive Map Projection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#060912;
    --ocean:#0e1a2a;
    --land:#d4b483;
    --graticule:rgba(255,255,255,0.07);
    --prime:rgba(255,180,100,0.32);
    --border:rgba(20,14,8,0.55);
    --marker:#ff8c42;
    --marker-bright:#ffa563;
    --marker-stroke:#fff5e6;
    --text:#ebe5dc;
    --text-muted:#7a8294;
    --text-dim:#525a6b;
    --line:rgba(255,255,255,0.07);
    --panel-bg:rgba(14,22,35,0.78);
    --panel-border:rgba(255,255,255,0.08);
  }
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    font-family:'Space Grotesk',system-ui,sans-serif;
    background:radial-gradient(ellipse at 30% 20%,#131c2a 0%,#060912 70%);
    color:var(--text);
    position:relative;
  }
  body::before{
    content:'';
    position:fixed;inset:0;
    background-image:
      radial-gradient(circle at 20% 80%,rgba(255,140,66,0.05) 0%,transparent 50%),
      radial-gradient(circle at 80% 20%,rgba(80,130,200,0.04) 0%,transparent 50%);
    pointer-events:none;z-index:1;
  }
  #app{position:relative;width:100%;height:100%;z-index:2}
  #map{width:100%;height:100%;cursor:grab;display:block}
  #map:active{cursor:grabbing}
  .overlay{position:absolute;pointer-events:auto;z-index:10;user-select:none}
  .glass{
    background:var(--panel-bg);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:18px 22px;
    box-shadow:0 10px 40px rgba(0,0,0,0.45),0 0 0 1px rgba(255,255,255,0.02) inset,0 1px 0 0 rgba(255,255,255,0.05) inset;
  }
  #overlay-tl{top:24px;left:24px;max-width:340px}
  .title-block{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .title-block h1{
    font-size:28px;font-weight:700;letter-spacing:-0.025em;margin-bottom:4px;
    background:linear-gradient(135deg,#f0c896 0%,#ff8c42 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;
  }
  .title-block .subtitle{font-size:11px;color:var(--text-muted);line-height:1.4}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
  .info-grid>div{display:flex;flex-direction:column;gap:2px}
  .info-grid .label{color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;font-size:9px;font-weight:600}
  .info-grid .value{color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
  #overlay-tr{top:24px;right:24px;display:flex;gap:6px;padding:8px}
  .btn-icon{
    width:38px;height:38px;border-radius:10px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all 0.18s ease;
  }
  .btn-icon:hover{
    background:rgba(255,140,66,0.14);
    border-color:rgba(255,140,66,0.35);
    color:var(--marker-bright);
    transform:translateY(-1px);
  }
  .btn-icon:active{transform:scale(0.96)}
  #overlay-bl{bottom:24px;left:24px}
  .instructions{display:flex;gap:14px;font-size:12px;color:var(--text-muted);align-items:center}
  .instructions .key{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:5px;padding:3px 8px;
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--text);margin-right:6px;font-weight:500;
  }
  #overlay-br{bottom:24px;right:24px;min-width:280px;padding:16px 20px}
  .coord-section{margin-bottom:12px}
  .coord-section:last-child{margin-bottom:0}
  .coord-header{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .header-label{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--text);font-weight:600}
  .header-hint{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em}
  .coord-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
  .coord-label{color:var(--text-muted);font-size:11px;font-family:'JetBrains Mono',monospace;width:30px;font-weight:500}
  .coord-value{
    color:var(--text);font-family:'JetBrains Mono',monospace;
    font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;
    text-align:right;flex:1;
  }
  #loading{
    top:50%;left:50%;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:12px;
    padding:14px 22px;font-size:12px;color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
    transition:opacity 0.3s;
  }
  .loader{
    width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);
    border-top-color:var(--marker);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading.hidden{opacity:0;pointer-events:none}
  @keyframes markerPulse{
    0%{transform:scale(0.5);opacity:0.7}
    100%{transform:scale(3.5);opacity:0}
  }
  .pulse-ring{
    transform-origin:center;
    transform-box:fill-box;
    animation:markerPulse 2.5s ease-out infinite;
  }
  svg{display:block}
  @media (max-width:900px){
    #overlay-tl{max-width:280px;padding:14px 16px}
    .title-block h1{font-size:22px}
    #overlay-bl{display:none}
    #overlay-br{min-width:220px;padding:12px 14px;bottom:12px;right:12px}
    .coord-value{font-size:12px}
    #overlay-tr{top:12px;right:12px}
    .btn-icon{width:32px;height:32px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="overlay-tl" class="overlay glass">
    <div class="title-block">
      <h1>Equal Earth</h1>
      <p class="subtitle">An equal-area pseudocylindrical projection<br>Šavrič, Patterson &amp; Jenny, 2018</p>
    </div>
    <div class="info-grid">
      <div><span class="label">Type</span><span class="value">Equal-area</span></div>
      <div><span class="label">Aspect</span><span class="value">≈ 2.05 : 1</span></div>
      <div><span class="label">Parallels</span><span class="value">Straight</span></div>
      <div><span class="label">Meridians</span><span class="value">Curved</span></div>
    </div>
  </div>

  <div id="overlay-tr" class="overlay glass">
    <button id="zoom-in" class="btn-icon" title="Zoom in" aria-label="Zoom in">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button id="zoom-out" class="btn-icon" title="Zoom out" aria-label="Zoom out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button id="reset" class="btn-icon" title="Reset view" aria-label="Reset view">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button id="clear" class="btn-icon" title="Clear markers" aria-label="Clear markers">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M5 6l1 14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-14"/></svg>
    </button>
  </div>

  <div id="overlay-bl" class="overlay glass">
    <div class="instructions">
      <span><span class="key">Drag</span>pan</span>
      <span><span class="key">Scroll</span>zoom</span>
      <span><span class="key">Click</span>mark</span>
    </div>
  </div>

  <div id="overlay-br" class="overlay glass">
    <div class="coord-section">
      <div class="coord-header">
        <span class="header-label">Cursor</span>
        <span class="header-hint">Live readout</span>
      </div>
      <div class="coord-row"><span class="coord-label">Lat</span><span class="coord-value" id="cursor-lat">—</span></div>
      <div class="coord-row"><span class="coord-label">Lon</span><span class="coord-value" id="cursor-lon">—</span></div>
    </div>
    <div class="coord-section">
      <div class="coord-header">
        <span class="header-label">Marker</span>
        <span class="header-hint">Last placed</span>
      </div>
      <div class="coord-row"><span class="coord-label">Lat</span><span class="coord-value" id="marker-lat">—</span></div>
      <div class="coord-row"><span class="coord-label">Lon</span><span class="coord-value" id="marker-lon">—</span></div>
    </div>
  </div>

  <div id="loading" class="overlay glass">
    <div class="loader"></div>
    <span>Loading world data…</span>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ============================================================
  // Equal Earth Projection
  // Reference: Šavrič, Patterson & Jenny (2018)
  // ============================================================

  // Polynomial coefficients
  const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796;
  const SQRT3 = Math.sqrt(3);
  const PI = Math.PI;

  /**
   * Forward projection.
   * @param {number} lon Longitude in degrees.
   * @param {number} lat Latitude in degrees.
   * @returns {[number, number]} Projected [x, y]. y increases downward (SVG convention).
   */
  function equalEarthForward(lon, lat){
    const lambda = lon * PI / 180;
    const phi   = lat * PI / 180;
    const sin_phi = Math.sin(phi);
    // Equal Earth substitution θ = arcsin(2·sin φ / 3)
    const sp = Math.max(-1, Math.min(1, 2 * sin_phi / 3));
    const theta = Math.asin(sp);
    const cos_theta = Math.cos(theta);

    // Polynomial A(φ) = A1 + A2·sin²φ + A3·sin⁴φ + A4·sin⁶φ
    const s2 = sin_phi * sin_phi;
    const s4 = s2 * s2;
    const s6 = s4 * s2;
    const A = A1 + A2 * s2 + A3 * s4 + A4 * s6;
    const sqrtA = Math.sqrt(A);

    // Projected coordinates. The x coefficient (1/(2√3)) is chosen so the
    // natural aspect ratio is ≈ 2.05:1 (matching the published Equal Earth).
    const x = lambda * cos_theta / (2 * SQRT3 * sqrtA);
    const y = (theta * (1 + cos_theta)) / SQRT3 - sqrtA * sin_phi;
    return [x, y];
  }

  /**
   * Inverse projection.
   * @param {number} x Projected x.
   * @param {number} y Projected y.
   * @returns {[number, number]} [lon, lat] in degrees, or [NaN, NaN] if outside the map.
   */
  function equalEarthInverse(x, y){
    // y as a function of φ is monotonically decreasing
    // (north pole φ=+π/2 → y≈-0.389, south pole φ=-π/2 → y≈+0.389).
    function getY(phi){
      const sin_phi = Math.sin(phi);
      const sp = Math.max(-1, Math.min(1, 2 * sin_phi / 3));
      const theta = Math.asin(sp);
      const cos_theta = Math.cos(theta);
      const s2 = sin_phi * sin_phi;
      const s4 = s2 * s2;
      const s6 = s4 * s2;
      const A = A1 + A2 * s2 + A3 * s4 + A4 * s6;
      const sqrtA = Math.sqrt(A);
      return (theta * (1 + cos_theta)) / SQRT3 - sqrtA * sin_phi;
    }

    const yMax = getY(-PI / 2); // south pole y (+0.389)
    const yMin = getY( PI / 2); // north pole y (-0.389)

    if (y > yMax + 1e-9 || y < yMin - 1e-9){
      return [NaN, NaN]; // outside map (above north pole or below south pole)
    }

    // Bisection on φ (50 iterations → precision ~1e-15)
    let lo = -PI / 2, hi = PI / 2;
    for (let i = 0; i < 50; i++){
      const mid = (lo + hi) / 2;
      if (getY(mid) > y) lo = mid; // y decreasing → if y(mid) > target, increase φ
      else hi = mid;
    }
    const phi = (lo + hi) / 2;

    // Closed-form for λ
    const sin_phi = Math.sin(phi);
    const sp = Math.max(-1, Math.min(1, 2 * sin_phi / 3));
    const theta = Math.asin(sp);
    const cos_theta = Math.cos(theta);
    const s2 = sin_phi * sin_phi;
    const s4 = s2 * s2;
    const s6 = s4 * s2;
    const A = A1 + A2 * s2 + A3 * s4 + A4 * s6;
    const sqrtA = Math.sqrt(A);

    let lambda;
    if (Math.abs(cos_theta) < 1e-12){
      lambda = 0; // poles — longitude undefined
    } else {
      lambda = x * 2 * SQRT3 * sqrtA / cos_theta;
    }

    // Reject clicks outside [-π, π] longitude range
    if (Math.abs(lambda) > PI + 0.001){
      return [NaN, NaN];
    }
    // Normalize to [-π, π]
    while (lambda >  PI) lambda -= 2 * PI;
    while (lambda < -PI) lambda += 2 * PI;

    return [lambda * 180 / PI, phi * 180 / PI];
  }

  // ============================================================
  // SVG.js setup
  // ============================================================

  const mapDiv = document.getElementById('map');
  const draw = SVG().addTo(mapDiv).size(window.innerWidth, window.innerHeight);
  draw.viewbox(0, 0, window.innerWidth, window.innerHeight);

  const COLORS = {
    ocean: '#0e1a2a',
    land: '#d4b483',
    graticule: 'rgba(255,255,255,0.07)',
    prime: 'rgba(255,180,100,0.32)',
    countryBorder: 'rgba(20,14,8,0.55)',
    marker: '#ff8c42',
    markerStroke: '#fff5e6',
    edgeGlow: 'rgba(255,140,66,0.18)'
  };

  // worldGroup carries the pan/zoom transform; overlayGroup holds markers
  // (kept outside the world transform so markers stay fixed pixel size).
  const worldGroup = draw.group();
  const oceanGroup = worldGroup.group();
  const graticuleGroup = worldGroup.group();
  const landGroup = worldGroup.group();
  const overlayGroup = draw.group();

  // ============================================================
  // State
  // ============================================================

  let viewportWidth = window.innerWidth;
  let viewportHeight = window.innerHeight;

  // Projected bounds (computed from formula)
  const PROJ_X_MAX = 0.784;  // ≈ x at (lon=±180, lat=0)
  const PROJ_Y_MAX = 0.389;  // ≈ |y| at (lat=±90)

  let scale, tx, ty, minScale, maxScale;

  function fitToViewport(){
    const projWidth = 2 * PROJ_X_MAX;
    const projHeight = 2 * PROJ_Y_MAX;
    const scaleX = viewportWidth / projWidth;
    const scaleY = viewportHeight / projHeight;
    scale = Math.min(scaleX, scaleY) * 0.92;
    tx = viewportWidth / 2;
    ty = viewportHeight / 2;
    minScale = scale * 0.35;
    maxScale = scale * 250;
  }
  fitToViewport();

  // Apply transform: screen = scale·proj + translate
  function updateTransform(){
    worldGroup.matrix(scale, 0, 0, scale, tx, ty);
  }

  // ============================================================
  // Draw ocean (fills the projected map outline)
  // ============================================================
  function drawOcean(){
    let path = '';
    const step = 2;

    // Bottom edge: lon 180 → -180, at lat=-90 (south pole line)
    for (let lon = 180; lon >= -180; lon -= step){
      const [x, y] = equalEarthForward(lon, -90);
      path += (lon >= 180 - step ? 'M' : 'L') + x.toFixed(6) + ',' + y.toFixed(6) + ' ';
    }
    // Left edge: lat -90 → 90, at lon=-180
    for (let lat = -90; lat <= 90; lat += step){
      const [x, y] = equalEarthForward(-180, lat);
      path += 'L' + x.toFixed(6) + ',' + y.toFixed(6) + ' ';
    }
    // Top edge: lon -180 → 180, at lat=90 (north pole line)
    for (let lon = -180; lon <= 180; lon += step){
      const [x, y] = equalEarthForward(lon, 90);
      path += 'L' + x.toFixed(6) + ',' + y.toFixed(6) + ' ';
    }
    // Right edge: lat 90 → -90, at lon=180
    for (let lat = 90; lat >= -90; lat -= step){
      const [x, y] = equalEarthForward(180, lat);
      path += 'L' + x.toFixed(6) + ',' + y.toFixed(6) + ' ';
    }
    path += 'Z';

    oceanGroup.path(path)
      .fill(COLORS.ocean)
      .stroke({color: COLORS.edgeGlow, width: 1.5})
      .attr('vector-effect', 'non-scaling-stroke');
  }

  // ============================================================
  // Draw graticule
  // ============================================================
  function drawGraticule(){
    const latStep = 15;
    const lonStep = 15;
    const sampleStep = 1; // degree resolution along each line

    // Parallels (straight horizontal lines in Equal Earth)
    for (let lat = -75; lat <= 75; lat += latStep){
      if (lat === 0) continue; // equator drawn separately
      let p = '';
      for (let lon = -180; lon <= 180; lon += sampleStep){
        const [x, y] = equalEarthForward(lon, lat);
        p += (lon === -180 ? 'M' : 'L') + x.toFixed(6) + ',' + y.toFixed(6) + ' ';
      }
      graticuleGroup.path(p).fill('none')
        .stroke({color: COLORS.graticule, width: 1})
        .attr('vector-effect', 'non-scaling-stroke');
    }

    // Equator (highlighted)
    let eq = '';
    for (let lon = -180; lon <= 180; lon += sampleStep){
      const [x, y] = equalEarthForward(lon, 0);
      eq += (lon === -180 ? 'M' : 'L') + x.toFixed(6) + ',' + y.toFixed(6) + ' ';
    }
    graticuleGroup.path(eq).fill('none')
      .stroke({color: COLORS.prime, width: 1})
      .attr('vector-effect', 'non-scaling-stroke');

    // Polar lines (lat=±90 — straight horizontals since poles are lines, not points)
    for (const lat of [-90, 90]){
      let p = '';
      for (let lon = -180; lon <= 180; lon += sampleStep){
        const [x, y] = equalEarthForward(lon, lat);
        p += (lon === -180 ? 'M' : 'L') + x.toFixed(6) + ',' + y.toFixed(6) + ' ';
      }
      graticuleGroup.path(p).fill('none')
        .stroke({color: COLORS.graticule, width: 1})
        .attr('vector-effect', 'non-scaling-stroke');
    }

    // Meridians (curved lines, fan out from poles)
    for (let lon = -180; lon <= 180; lon += lonStep){
      let p = '';
      for (let lat = -90; lat <= 90; lat += sampleStep){
        const [x, y] = equalEarthForward(lon, lat);
        p += (lat === -90 ? 'M' : 'L') + x.toFixed(6) + ',' + y.toFixed(6) + ' ';
      }
      const isPrime = lon === 0;
      graticuleGroup.path(p).fill('none')
        .stroke({color: isPrime ? COLORS.prime : COLORS.graticule, width: 1})
        .attr('vector-effect', 'non-scaling-stroke');
    }
  }

  // ============================================================
  // Load world data (TopoJSON from CDN → GeoJSON → SVG paths)
  // ============================================================
  async function loadWorld(){
    const loadingEl = document.getElementById('loading');
    try {
      if (typeof topojson === 'undefined'){
        throw new Error('TopoJSON library not loaded');
      }
      const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const topology = await response.json();
      const geojson = topojson.feature(topology, topology.objects.countries);
      renderWorld(geojson);
    } catch (e){
      console.warn('Could not load world data:', e);
      loadingEl.innerHTML = '<span style="color:#ff8c42">⚠</span><span>World data unavailable — graticule only</span>';
      loadingEl.classList.remove('hidden');
      setTimeout(() => loadingEl.classList.add('hidden'), 2800);
      return;
    }
    loadingEl.classList.add('hidden');
  }

  function renderWorld(geojson){
    for (const feature of geojson.features){
      const d = featureToPath(feature);
      if (d){
        landGroup.path(d)
          .fill(COLORS.land)
          .stroke({color: COLORS.countryBorder, width: 0.8})
          .attr('vector-effect', 'non-scaling-stroke');
      }
    }
  }

  function featureToPath(feature){
    const geom = feature.geometry;
    if (!geom) return null;
    let d = '';
    if (geom.type === 'Polygon'){
      d = polygonToPath(geom.coordinates);
    } else if (geom.type === 'MultiPolygon'){
      for (const polygon of geom.coordinates){
        d += polygonToPath(polygon);
      }
    }
    return d || null;
  }

  function polygonToPath(polygon){
    let d = '';
    for (const ring of polygon){
      for (let i = 0; i < ring.length; i++){
        const [lon, lat] = ring[i];
        const [x, y] = equalEarthForward(lon, lat);
        if (i === 0) d += 'M' + x.toFixed(6) + ',' + y.toFixed(6);
        else        d += 'L' + x.toFixed(6) + ',' + y.toFixed(6);
      }
      d += 'Z';
    }
    return d;
  }

  // ============================================================
  // Markers (live in overlayGroup, kept out of world transform)
  // ============================================================
  const markers = [];

  function addMarker(lon, lat, options){
    options = options || {};
    const isDemo = !!options.isDemo;
    const label = options.label || null;

    const element = overlayGroup.group().addClass('marker');

    if (!isDemo){
      // User-clicked marker: pulsing halo + bright core
      element.circle(14).center(0, 0)
        .fill({color: COLORS.marker, opacity: 0.5})
        .addClass('pulse-ring');
      element.circle(28).center(0, 0).fill({color: COLORS.marker, opacity: 0.06});
      element.circle(18).center(0, 0).fill({color: COLORS.marker, opacity: 0.12});
      element.circle(12).center(0, 0).fill(COLORS.marker)
        .stroke({color: COLORS.markerStroke, width: 2});
      element.circle(4).center(0, 0).fill(COLORS.markerStroke);
    } else {
      // Demo marker (city): smaller, with label
      element.circle(14).center(0, 0).fill({color: COLORS.marker, opacity: 0.14});
      element.circle(8).center(0, 0).fill(COLORS.marker)
        .stroke({color: COLORS.markerStroke, width: 1.5});
      element.circle(2).center(0, 0).fill(COLORS.markerStroke);

      if (label){
        element.text(label).font({size: 11, family: 'JetBrains Mono', weight: 500})
          .fill(COLORS.markerStroke)
          .attr({
            x: 11, y: 0,
            'dominant-baseline': 'central',
            'paint-order': 'stroke'
          })
          .stroke({color: 'rgba(0,0,0,0.75)', width: 3, linecap: 'round', linejoin: 'round'});
      }
    }

    markers.push({lon, lat, element, isDemo});
    updateMarker(markers[markers.length - 1]);
  }

  function updateMarker(m){
    // Forward-project the marker's lat/lon, then apply current world transform
    // to get its screen position. Marker stays fixed pixel size.
    const [x, y] = equalEarthForward(m.lon, m.lat);
    const screenX = scale * x + tx;
    const screenY = scale * y + ty;
    m.element.matrix(1, 0, 0, 1, screenX, screenY);
  }

  function updateMarkers(){
    for (const m of markers) updateMarker(m);
  }

  function clearUserMarkers(){
    for (let i = markers.length - 1; i >= 0; i--){
      if (!markers[i].isDemo){
        markers[i].element.remove();
        markers.splice(i, 1);
      }
    }
    document.getElementById('marker-lat').textContent = '—';
    document.getElementById('marker-lon').textContent = '—';
  }

  // ============================================================
  // Coordinate formatting
  // ============================================================
  function formatCoord(deg, type){
    if (!isFinite(deg)) return '—';
    const abs = Math.abs(deg);
    const dir = type === 'lat' ? (deg >= 0 ? 'N' : 'S') : (deg >= 0 ? 'E' : 'W');
    return abs.toFixed(3) + '° ' + dir;
  }

  // ============================================================
  // Event handling: pan, zoom, click, touch
  // ============================================================
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let mouseDownX = 0, mouseDownY = 0;
  let dragStartTime = 0;
  let dragMoved = false;

  mapDiv.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    dragMoved = false;
    lastX = mouseDownX = e.clientX;
    lastY = mouseDownY = e.clientY;
    dragStartTime = Date.now();
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    const rect = mapDiv.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (mx >= 0 && mx <= viewportWidth && my >= 0 && my <= viewportHeight){
      updateCursorCoords(mx, my);
    }

    if (isDragging){
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      const totalDx = e.clientX - mouseDownX;
      const totalDy = e.clientY - mouseDownY;
      if (Math.abs(totalDx) > 3 || Math.abs(totalDy) > 3) dragMoved = true;
      tx += dx;
      ty += dy;
      lastX = e.clientX;
      lastY = e.clientY;
      updateTransform();
      updateMarkers();
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    if (!dragMoved && Date.now() - dragStartTime < 500 && e.button === 0){
      const rect = mapDiv.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      if (mx >= 0 && mx <= viewportWidth && my >= 0 && my <= viewportHeight){
        handleClick(mx, my);
      }
    }
  });

  mapDiv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = mapDiv.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const zoomFactor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    const newScale = Math.max(minScale, Math.min(maxScale, scale * zoomFactor));
    if (Math.abs(newScale - scale) < 0.001) return;

    // Zoom around mouse: keep the projected point under the cursor fixed
    const k = newScale / scale;
    tx = mx - k * (mx - tx);
    ty = my - k * (my - ty);
    scale = newScale;

    updateTransform();
    updateMarkers();
  }, {passive: false});

  // Basic touch support
  let touchStartDist = 0, touchStartScale = 0;
  mapDiv.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1){
      isDragging = true;
      dragMoved = false;
      lastX = mouseDownX = e.touches[0].clientX;
      lastY = mouseDownY = e.touches[0].clientY;
      dragStartTime = Date.now();
    } else if (e.touches.length === 2){
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      touchStartDist = Math.sqrt(dx * dx + dy * dy);
      touchStartScale = scale;
    }
    e.preventDefault();
  }, {passive: false});

  mapDiv.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging){
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      if (Math.abs(e.touches[0].clientX - mouseDownX) > 3 ||
          Math.abs(e.touches[0].clientY - mouseDownY) > 3){
        dragMoved = true;
      }
      tx += dx;
      ty += dy;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      updateTransform();
      updateMarkers();
    } else if (e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const rect = mapDiv.getBoundingClientRect();
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      const newScale = Math.max(minScale, Math.min(maxScale, touchStartScale * dist / Math.max(1, touchStartDist)));
      const k = newScale / scale;
      tx = cx - k * (cx - tx);
      ty = cy - k * (cy - ty);
      scale = newScale;
      updateTransform();
      updateMarkers();
    }
    e.preventDefault();
  }, {passive: false});

  mapDiv.addEventListener('touchend', (e) => {
    if (e.touches.length === 0 && isDragging){
      isDragging = false;
      if (!dragMoved && Date.now() - dragStartTime < 500){
        const rect = mapDiv.getBoundingClientRect();
        const cx = mouseDownX - rect.left;
        const cy = mouseDownY - rect.top;
        handleClick(cx, cy);
      }
    }
  });

  function handleClick(mx, my){
    // Inverse the world transform to get projected coords,
    // then inverse-project to get lat/lon.
    const projX = (mx - tx) / scale;
    const projY = (my - ty) / scale;
    const [lon, lat] = equalEarthInverse(projX, projY);

    if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90.01 && Math.abs(lon) <= 180.01){
      addMarker(lon, lat);
      document.getElementById('marker-lat').textContent = formatCoord(lat, 'lat');
      document.getElementById('marker-lon').textContent = formatCoord(lon, 'lon');
    }
  }

  function updateCursorCoords(mx, my){
    const projX = (mx - tx) / scale;
    const projY = (my - ty) / scale;
    const [lon, lat] = equalEarthInverse(projX, projY);

    if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90.01 && Math.abs(lon) <= 180.01){
      document.getElementById('cursor-lat').textContent = formatCoord(lat, 'lat');
      document.getElementById('cursor-lon').textContent = formatCoord(lon, 'lon');
    } else {
      document.getElementById('cursor-lat').textContent = '—';
      document.getElementById('cursor-lon').textContent = '—';
    }
  }

  // ============================================================
  // Controls
  // ============================================================
  function zoomAt(mx, my, factor){
    const newScale = Math.max(minScale, Math.min(maxScale, scale * factor));
    if (Math.abs(newScale - scale) < 0.001) return;
    const k = newScale / scale;
    tx = mx - k * (mx - tx);
    ty = my - k * (my - ty);
    scale = newScale;
    updateTransform();
    updateMarkers();
  }

  document.getElementById('zoom-in').addEventListener('click', () => {
    zoomAt(viewportWidth / 2, viewportHeight / 2, 1.4);
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    zoomAt(viewportWidth / 2, viewportHeight / 2, 1 / 1.4);
  });
  document.getElementById('reset').addEventListener('click', () => {
    fitToViewport();
    updateTransform();
    updateMarkers();
  });
  document.getElementById('clear').addEventListener('click', () => {
    clearUserMarkers();
  });

  // ============================================================
  // Resize
  // ============================================================
  let resizeTimer;
  window.addEventListener('resize', () => {
    viewportWidth = window.innerWidth;
    viewportHeight = window.innerHeight;
    draw.size(viewportWidth, viewportHeight);
    draw.viewbox(0, 0, viewportWidth, viewportHeight);
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      updateTransform();
      updateMarkers();
    }, 80);
  });

  // ============================================================
  // Initialize
  // ============================================================
  drawOcean();
  drawGraticule();
  updateTransform();

  // Pre-placed demo markers — demonstrate forward projection
  // (lat/lon → projected x,y → SVG marker at correct location)
  const demoCities = [
    {name: 'New York',       lon:  -74.0060, lat:  40.7128},
    {name: 'London',         lon:   -0.1276, lat:  51.5074},
    {name: 'Tokyo',          lon:  139.6917, lat:  35.6895},
    {name: 'Sydney',         lon:  151.2093, lat: -33.8688},
    {name: 'Cairo',          lon:   31.2357, lat:  30.0444},
    {name: 'Rio de Janeiro', lon:  -43.1729, lat: -22.9068},
    {name: 'Mumbai',         lon:   72.8777, lat:  19.0760},
    {name: 'Cape Town',      lon:   18.4241, lat: -33.9249}
  ];
  demoCities.forEach(c => addMarker(c.lon, c.lat, {isDemo: true, label: c.name}));

  // Load country outlines
  loadWorld();
})();
</script>
</body>
</html>
