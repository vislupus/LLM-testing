<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equal Earth Interactive World Map</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.4/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --ocean: #0b1f33;
      --ocean-deep: #071522;
      --land: #1a3a4a;
      --land-stroke: #2d6a7a;
      --land-hover: #245566;
      --accent: #3dd6c6;
      --accent-dim: #2a9d8f;
      --marker: #ff6b6b;
      --text: #e8f1f5;
      --muted: #8ba3b5;
      --panel: rgba(8, 22, 36, 0.92);
      --border: rgba(61, 214, 198, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--ocean-deep);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
    }

    #map {
      width: 100%;
      height: 100%;
      cursor: grab;
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%, #0e2740 0%, var(--ocean-deep) 70%);
    }

    #map.dragging { cursor: grabbing; }

    #map svg { display: block; width: 100%; height: 100%; }

    .country {
      fill: var(--land);
      stroke: var(--land-stroke);
      stroke-width: 0.4;
      stroke-linejoin: round;
      transition: fill 0.15s ease;
      vector-effect: non-scaling-stroke;
    }

    .country:hover { fill: var(--land-hover); }

    .graticule {
      fill: none;
      stroke: rgba(61, 214, 198, 0.12);
      stroke-width: 0.35;
      vector-effect: non-scaling-stroke;
    }

    .outline {
      fill: rgba(14, 45, 70, 0.55);
      stroke: rgba(61, 214, 198, 0.35);
      stroke-width: 0.8;
      vector-effect: non-scaling-stroke;
    }

    .marker-pulse {
      animation: pulse 1.6s ease-out infinite;
    }

    @keyframes pulse {
      0%   { r: 4; opacity: 0.7; }
      100% { r: 18; opacity: 0; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    input[type="number"] {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(61, 214, 198, 0.2);
      border-radius: 8px;
      color: var(--text);
      padding: 0.45rem 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="number"]::-webkit-inner-spin-button {
      opacity: 0.5;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-dim), #1f7a6e);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }

    .btn:hover { filter: brightness(1.12); }
    .btn:active { transform: scale(0.97); }

    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(61, 214, 198, 0.3);
      color: var(--accent);
    }

    .btn-ghost:hover {
      background: rgba(61, 214, 198, 0.1);
      filter: none;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      color: var(--accent);
    }

    .hint {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ocean-deep);
      z-index: 50;
      transition: opacity 0.4s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(61, 214, 198, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .coord-flash {
      animation: flash 0.35s ease;
    }

    @keyframes flash {
      0% { background: rgba(61, 214, 198, 0.25); }
      100% { background: transparent; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(61,214,198,0.25); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">
    <div class="flex flex-col items-center gap-4">
      <div class="spinner"></div>
      <p class="text-sm text-[var(--muted)]">Loading Equal Earth map…</p>
    </div>
  </div>

  <div id="map"></div>

  <!-- Top bar -->
  <header class="fixed top-0 left-0 right-0 z-20 pointer-events-none p-4 flex justify-between items-start gap-4">
    <div class="panel pointer-events-auto px-4 py-3 max-w-sm">
      <div class="flex items-center gap-2 mb-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 3.5 6 3.5 9s-1 6-3.5 9c-2.5-3-3.5-6-3.5-9s1-6 3.5-9z"/>
        </svg>
        <h1 class="text-base font-semibold tracking-tight">Equal Earth Map</h1>
      </div>
      <p class="hint">Equal-area pseudocylindrical projection · Šavrič et al. 2018. Scroll to zoom, drag to pan. Click the map for inverse projection.</p>
    </div>

    <div class="panel pointer-events-auto px-4 py-3 min-w-[200px]" id="readout">
      <div class="stat-label mb-1">Click coordinates</div>
      <div class="grid grid-cols-2 gap-x-4 gap-y-1" id="clickCoords">
        <div>
          <div class="stat-label">Latitude</div>
          <div class="stat-value" id="clickLat">—</div>
        </div>
        <div>
          <div class="stat-label">Longitude</div>
          <div class="stat-value" id="clickLon">—</div>
        </div>
        <div>
          <div class="stat-label">Proj X</div>
          <div class="stat-value text-xs" id="clickX">—</div>
        </div>
        <div>
          <div class="stat-label">Proj Y</div>
          <div class="stat-value text-xs" id="clickY">—</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Bottom controls -->
  <footer class="fixed bottom-0 left-0 right-0 z-20 p-4 flex flex-wrap items-end justify-between gap-3 pointer-events-none">
    <div class="panel pointer-events-auto px-4 py-3 w-full max-w-md">
      <div class="stat-label mb-2">Forward projection — plot marker</div>
      <div class="flex flex-wrap gap-2 items-end">
        <label class="flex-1 min-w-[90px]">
          <span class="stat-label block mb-1">Lat (°)</span>
          <input type="number" id="inputLat" value="40.7128" step="0.0001" min="-90" max="90" />
        </label>
        <label class="flex-1 min-w-[90px]">
          <span class="stat-label block mb-1">Lon (°)</span>
          <input type="number" id="inputLon" value="-74.0060" step="0.0001" min="-180" max="180" />
        </label>
        <button class="btn" id="btnPlot" type="button">Plot</button>
        <button class="btn btn-ghost" id="btnClear" type="button">Clear</button>
      </div>
      <div class="mt-2 hint mono" id="forwardResult">Projected: —</div>
    </div>

    <div class="panel pointer-events-auto px-3 py-2 flex items-center gap-2">
      <button class="btn btn-ghost text-xs px-2 py-1" id="btnZoomIn" type="button" title="Zoom in">+</button>
      <button class="btn btn-ghost text-xs px-2 py-1" id="btnZoomOut" type="button" title="Zoom out">−</button>
      <button class="btn btn-ghost text-xs px-2 py-1" id="btnReset" type="button" title="Reset view">Reset</button>
      <span class="mono text-xs text-[var(--muted)] ml-1" id="zoomLabel">100%</span>
    </div>
  </footer>

  <script>
    // ─────────────────────────────────────────────────────────────
    // Equal Earth Projection (spherical form)
    // Šavrič, Patterson & Jenny, 2018
    // ─────────────────────────────────────────────────────────────
    const EqualEarth = (() => {
      const A1 = 1.340264;
      const A2 = -0.081106;
      const A3 = 0.000893;
      const A4 = 0.003796;
      const SQRT3 = Math.sqrt(3);
      // R = 1 (unit sphere). Scale applied later for screen fit.
      const R = 1;

      function polyY(theta) {
        const t2 = theta * theta;
        const t6 = t2 * t2 * t2;
        return theta * (A1 + A2 * t2 + t6 * (A3 + A4 * t2));
      }

      function polyXDenom(theta) {
        const t2 = theta * theta;
        const t6 = t2 * t2 * t2;
        // A1 + 3*A2*θ² + θ⁶*(7*A3 + 9*A4*θ²)
        return A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
      }

      /** Forward: (lon°, lat°) → {x, y} in projection units */
      function project(lonDeg, latDeg) {
        const lambda = lonDeg * Math.PI / 180;
        const phi = latDeg * Math.PI / 180;
        const sinPhi = Math.sin(phi);
        // clamp for numerical safety at poles
        const arg = Math.max(-1, Math.min(1, sinPhi * SQRT3 / 2));
        const theta = Math.asin(arg);
        const denom = polyXDenom(theta);
        const x = R * 2 * lambda * Math.cos(theta) / (SQRT3 * denom);
        const y = R * polyY(theta);
        return { x, y };
      }

      /** Inverse: (x, y) → {lon, lat} in degrees, or null if outside */
      function invert(x, y) {
        // Newton-Raphson for θ from y = polyY(θ)
        let theta = y / R; // good first guess (polyY ≈ A1*θ near 0)
        for (let i = 0; i < 20; i++) {
          const t2 = theta * theta;
          const t6 = t2 * t2 * t2;
          const fy = theta * (A1 + A2 * t2 + t6 * (A3 + A4 * t2)) - y / R;
          // d/dθ polyY = A1 + 3*A2*θ² + θ⁶*(7*A3 + 9*A4*θ²)  == polyXDenom
          const dfy = polyXDenom(theta);
          if (Math.abs(dfy) < 1e-15) break;
          const d = fy / dfy;
          theta -= d;
          if (Math.abs(d) < 1e-12) break;
        }

        // Valid θ range: |θ| ≤ π/3  (because sinθ = sinφ * √3/2, |sinφ|≤1)
        const thetaMax = Math.PI / 3 + 1e-9;
        if (Math.abs(theta) > thetaMax) return null;

        const cosTheta = Math.cos(theta);
        if (Math.abs(cosTheta) < 1e-12) return null;

        const denom = polyXDenom(theta);
        const lambda = (x / R) * SQRT3 * denom / (2 * cosTheta);

        // longitude must be within ±π for a single world map
        if (Math.abs(lambda) > Math.PI + 1e-6) return null;

        const sinBeta = 2 * Math.sin(theta) / SQRT3;
        if (sinBeta < -1 - 1e-9 || sinBeta > 1 + 1e-9) return null;
        const phi = Math.asin(Math.max(-1, Math.min(1, sinBeta)));

        return {
          lon: lambda * 180 / Math.PI,
          lat: phi * 180 / Math.PI
        };
      }

      /** Projected bounds of the full sphere */
      function bounds() {
        const sw = project(-180, -90);
        const se = project(180, -90);
        const nw = project(-180, 90);
        const ne = project(180, 90);
        const eqW = project(-180, 0);
        const eqE = project(180, 0);
        const n = project(0, 90);
        const s = project(0, -90);
        return {
          minX: Math.min(sw.x, nw.x, eqW.x),
          maxX: Math.max(se.x, ne.x, eqE.x),
          minY: Math.min(sw.y, se.y, s.y),
          maxY: Math.max(nw.y, ne.y, n.y)
        };
      }

      return { project, invert, bounds, polyY, polyXDenom };
    })();

    // ─────────────────────────────────────────────────────────────
    // Map application
    // ─────────────────────────────────────────────────────────────
    const MapApp = (() => {
      const mapEl = document.getElementById('map');
      let draw, worldGroup, landGroup, graticuleGroup, markerGroup, outlinePath;
      let width = 0, height = 0;

      // Fit: projection units → SVG base coordinates
      let scale = 1, offsetX = 0, offsetY = 0;
      const projBounds = EqualEarth.bounds();

      // View transform (zoom / pan) applied to worldGroup
      let view = { k: 1, tx: 0, ty: 0 };

      // Interaction state
      let isDragging = false;
      let dragStart = null;
      let viewStart = null;
      let markers = [];

      function computeFit() {
        width = mapEl.clientWidth;
        height = mapEl.clientHeight;
        const pad = 28;
        const pw = projBounds.maxX - projBounds.minX;
        const ph = projBounds.maxY - projBounds.minY;
        scale = Math.min((width - pad * 2) / pw, (height - pad * 2) / ph);
        offsetX = width / 2 - scale * (projBounds.minX + projBounds.maxX) / 2;
        offsetY = height / 2 + scale * (projBounds.minY + projBounds.maxY) / 2; // flip Y
      }

      /** Projection units → base SVG coords (no zoom/pan) */
      function projToBase(x, y) {
        return {
          x: offsetX + scale * x,
          y: offsetY - scale * y
        };
      }

      /** Base SVG coords → projection units */
      function baseToProj(bx, by) {
        return {
          x: (bx - offsetX) / scale,
          y: (offsetY - by) / scale
        };
      }

      /** Apply current view transform to worldGroup */
      function applyView() {
        worldGroup.transform({
          a: view.k, b: 0, c: 0, d: view.k,
          e: view.tx, f: view.ty
        });
        document.getElementById('zoomLabel').textContent =
          Math.round(view.k * 100) + '%';
      }

      /** Screen (client) → base SVG coords accounting for zoom/pan */
      function screenToBase(clientX, clientY) {
        const rect = mapEl.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        // Inverse of: base' = k * base + t
        return {
          x: (sx - view.tx) / view.k,
          y: (sy - view.ty) / view.k
        };
      }

      /** Geographic → base SVG */
      function geoToBase(lon, lat) {
        const p = EqualEarth.project(lon, lat);
        return projToBase(p.x, p.y);
      }

      /** Screen click → geographic (inverse, with zoom/pan) */
      function screenToGeo(clientX, clientY) {
        const base = screenToBase(clientX, clientY);
        const proj = baseToProj(base.x, base.y);
        const geo = EqualEarth.invert(proj.x, proj.y);
        return geo ? { ...geo, projX: proj.x, projY: proj.y } : null;
      }

      function pathFromRing(ring) {
        if (!ring || ring.length < 2) return '';
        let d = '';
        for (let i = 0; i < ring.length; i++) {
          const [lon, lat] = ring[i];
          const b = geoToBase(lon, lat);
          d += (i === 0 ? 'M' : 'L') + b.x.toFixed(2) + ',' + b.y.toFixed(2);
        }
        d += 'Z';
        return d;
      }

      function pathFromPolygon(coords) {
        return coords.map(pathFromRing).join('');
      }

      function pathFromGeometry(geom) {
        if (!geom) return '';
        if (geom.type === 'Polygon') return pathFromPolygon(geom.coordinates);
        if (geom.type === 'MultiPolygon') {
          return geom.coordinates.map(pathFromPolygon).join('');
        }
        return '';
      }

      function buildGraticule() {
        const paths = [];
        // Meridians every 30°
        for (let lon = -180; lon <= 180; lon += 30) {
          const pts = [];
          for (let lat = -90; lat <= 90; lat += 2) {
            const b = geoToBase(lon, lat);
            pts.push(b.x.toFixed(2) + ',' + b.y.toFixed(2));
          }
          paths.push('M' + pts.join('L'));
        }
        // Parallels every 30°
        for (let lat = -60; lat <= 60; lat += 30) {
          const pts = [];
          for (let lon = -180; lon <= 180; lon += 2) {
            const b = geoToBase(lon, lat);
            pts.push(b.x.toFixed(2) + ',' + b.y.toFixed(2));
          }
          paths.push('M' + pts.join('L'));
        }
        // Equator emphasized slightly by drawing equator twice conceptually — separate style optional
        const eq = [];
        for (let lon = -180; lon <= 180; lon += 2) {
          const b = geoToBase(lon, 0);
          eq.push(b.x.toFixed(2) + ',' + b.y.toFixed(2));
        }
        paths.push('M' + eq.join('L'));
        return paths;
      }

      function buildOutline() {
        // Outline of the Equal Earth projection limb (full sphere boundary)
        const pts = [];
        // Right edge: lon=180, lat from -90 to 90
        for (let lat = -90; lat <= 90; lat += 1) {
          const b = geoToBase(180, lat);
          pts.push([b.x, b.y]);
        }
        // Left edge: lon=-180, lat from 90 to -90
        for (let lat = 90; lat >= -90; lat -= 1) {
          const b = geoToBase(-180, lat);
          pts.push([b.x, b.y]);
        }
        let d = 'M' + pts[0][0].toFixed(2) + ',' + pts[0][1].toFixed(2);
        for (let i = 1; i < pts.length; i++) {
          d += 'L' + pts[i][0].toFixed(2) + ',' + pts[i][1].toFixed(2);
        }
        d += 'Z';
        return d;
      }

      async function loadWorld() {
        const url = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
        const res = await fetch(url);
        if (!res.ok) throw new Error('Failed to load world data');
        const topology = await res.json();
        const countries = topojson.feature(topology, topology.objects.countries);
        return countries;
      }

      function drawWorld(geojson) {
        landGroup.clear();
        for (const feature of geojson.features) {
          const d = pathFromGeometry(feature.geometry);
          if (!d) continue;
          landGroup.path(d).addClass('country');
        }
      }

      function drawGraticule() {
        graticuleGroup.clear();
        for (const d of buildGraticule()) {
          graticuleGroup.path(d).addClass('graticule');
        }
      }

      function drawOutline() {
        if (outlinePath) outlinePath.remove();
        outlinePath = worldGroup.path(buildOutline()).addClass('outline').back();
      }

      function addMarker(lon, lat, label) {
        const b = geoToBase(lon, lat);
        const g = markerGroup.group();
        g.circle(0).center(b.x, b.y)
          .fill('none')
          .stroke({ color: '#ff6b6b', width: 1.5 })
          .attr({ class: 'marker-pulse', r: 4 });
        g.circle(8).center(b.x, b.y)
          .fill('#ff6b6b')
          .stroke({ color: '#fff', width: 1.5 });
        g.circle(3).center(b.x, b.y).fill('#fff');
        if (label) {
          g.text(label)
            .font({ family: 'DM Sans', size: 11, anchor: 'middle' })
            .fill('#e8f1f5')
            .center(b.x, b.y - 16);
        }
        markers.push(g);
        return g;
      }

      function clearMarkers() {
        markers.forEach(m => m.remove());
        markers = [];
        markerGroup.clear();
      }

      function zoomAt(clientX, clientY, factor) {
        const rect = mapEl.getBoundingClientRect();
        const sx = clientX - rect.left;
        const sy = clientY - rect.top;
        const newK = Math.max(0.4, Math.min(40, view.k * factor));
        // Keep the point under the cursor fixed
        view.tx = sx - (sx - view.tx) * (newK / view.k);
        view.ty = sy - (sy - view.ty) * (newK / view.k);
        view.k = newK;
        applyView();
      }

      function resetView() {
        view = { k: 1, tx: 0, ty: 0 };
        applyView();
      }

      function onResize() {
        const oldW = width, oldH = height;
        computeFit();
        // Rebuild geometry at new fit (countries etc.)
        // Keep relative center of view if possible
        if (oldW && oldH) {
          const cx = oldW / 2, cy = oldH / 2;
          const worldX = (cx - view.tx) / view.k;
          const worldY = (cy - view.ty) / view.k;
          // After recompute, world coords of same geo points change because scale/offset changed.
          // Simpler: just reset view on resize for correctness.
          view = { k: 1, tx: 0, ty: 0 };
        }
        // Redraw everything projected
        draw.size(width, height);
        drawOutline();
        drawGraticule();
        // Countries need redraw — store last geojson
        if (MapApp._geojson) drawWorld(MapApp._geojson);
        // Rebuild markers from stored geo positions
        const saved = MapApp._markerData ? [...MapApp._markerData] : [];
        clearMarkers();
        MapApp._markerData = [];
        saved.forEach(m => {
          addMarker(m.lon, m.lat, m.label);
          MapApp._markerData.push(m);
        });
        applyView();
      }

      function bindEvents() {
        // Wheel zoom
        mapEl.addEventListener('wheel', (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
          zoomAt(e.clientX, e.clientY, factor);
        }, { passive: false });

        // Pan
        mapEl.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          isDragging = true;
          mapEl.classList.add('dragging');
          dragStart = { x: e.clientX, y: e.clientY };
          viewStart = { tx: view.tx, ty: view.ty };
          mapEl.setPointerCapture(e.pointerId);
        });

        mapEl.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          view.tx = viewStart.tx + (e.clientX - dragStart.x);
          view.ty = viewStart.ty + (e.clientY - dragStart.y);
          applyView();
        });

        mapEl.addEventListener('pointerup', (e) => {
          if (!isDragging) return;
          const dx = e.clientX - dragStart.x;
          const dy = e.clientY - dragStart.y;
          isDragging = false;
          mapEl.classList.remove('dragging');
          // Treat as click if movement is tiny
          if (Math.hypot(dx, dy) < 4) {
            handleClick(e.clientX, e.clientY);
          }
        });

        mapEl.addEventListener('pointercancel', () => {
          isDragging = false;
          mapEl.classList.remove('dragging');
        });

        window.addEventListener('resize', () => {
          clearTimeout(MapApp._resizeTimer);
          MapApp._resizeTimer = setTimeout(onResize, 120);
        });

        document.getElementById('btnPlot').addEventListener('click', plotFromInputs);
        document.getElementById('btnClear').addEventListener('click', () => {
          clearMarkers();
          MapApp._markerData = [];
          document.getElementById('forwardResult').textContent = 'Projected: —';
        });
        document.getElementById('btnZoomIn').addEventListener('click', () => {
          zoomAt(width / 2 + mapEl.getBoundingClientRect().left,
                 height / 2 + mapEl.getBoundingClientRect().top, 1.3);
        });
        document.getElementById('btnZoomOut').addEventListener('click', () => {
          zoomAt(width / 2 + mapEl.getBoundingClientRect().left,
                 height / 2 + mapEl.getBoundingClientRect().top, 1 / 1.3);
        });
        document.getElementById('btnReset').addEventListener('click', resetView);

        // Enter key on inputs
        ['inputLat', 'inputLon'].forEach(id => {
          document.getElementById(id).addEventListener('keydown', (e) => {
            if (e.key === 'Enter') plotFromInputs();
          });
        });
      }

      function formatDeg(v, pos, neg) {
        const a = Math.abs(v);
        const hemi = v >= 0 ? pos : neg;
        return a.toFixed(4) + '°' + hemi;
      }

      function handleClick(clientX, clientY) {
        const result = screenToGeo(clientX, clientY);
        const latEl = document.getElementById('clickLat');
        const lonEl = document.getElementById('clickLon');
        const xEl = document.getElementById('clickX');
        const yEl = document.getElementById('clickY');
        const box = document.getElementById('clickCoords');
        box.classList.remove('coord-flash');
        void box.offsetWidth;
        box.classList.add('coord-flash');

        if (!result) {
          latEl.textContent = 'outside';
          lonEl.textContent = 'outside';
          xEl.textContent = '—';
          yEl.textContent = '—';
          return;
        }

        latEl.textContent = formatDeg(result.lat, 'N', 'S');
        lonEl.textContent = formatDeg(result.lon, 'E', 'W');
        xEl.textContent = result.projX.toFixed(5);
        yEl.textContent = result.projY.toFixed(5);

        // Temporary click marker
        addMarker(result.lon, result.lat);
        MapApp._markerData.push({ lon: result.lon, lat: result.lat, label: null });

        // Sync inputs
        document.getElementById('inputLat').value = result.lat.toFixed(4);
        document.getElementById('inputLon').value = result.lon.toFixed(4);

        console.log(
          `[Equal Earth] lat=${result.lat.toFixed(6)} lon=${result.lon.toFixed(6)} ` +
          `x=${result.projX.toFixed(6)} y=${result.projY.toFixed(6)}`
        );
      }

      function plotFromInputs() {
        let lat = parseFloat(document.getElementById('inputLat').value);
        let lon = parseFloat(document.getElementById('inputLon').value);
        if (Number.isNaN(lat) || Number.isNaN(lon)) {
          document.getElementById('forwardResult').textContent = 'Invalid coordinates';
          return;
        }
        lat = Math.max(-90, Math.min(90, lat));
        lon = ((lon + 180) % 360 + 360) % 360 - 180;

        const p = EqualEarth.project(lon, lat);
        const base = projToBase(p.x, p.y);

        document.getElementById('forwardResult').textContent =
          `Projected: x=${p.x.toFixed(5)}, y=${p.y.toFixed(5)}  ·  screen base (${base.x.toFixed(1)}, ${base.y.toFixed(1)})`;

        const label = `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
        addMarker(lon, lat, label);
        MapApp._markerData.push({ lon, lat, label });

        // Pan view toward marker (smooth-ish snap)
        const targetScreenX = base.x * view.k + view.tx;
        const targetScreenY = base.y * view.k + view.ty;
        const cx = width / 2, cy = height / 2;
        view.tx += cx - targetScreenX;
        view.ty += cy - targetScreenY;
        applyView();

        // Verify round-trip
        const inv = EqualEarth.invert(p.x, p.y);
        if (inv) {
          console.log(
            `[Forward] (${lat}, ${lon}) → (${p.x.toFixed(6)}, ${p.y.toFixed(6)}) ` +
            `→ inverse (${inv.lat.toFixed(6)}, ${inv.lon.toFixed(6)})`
          );
        }
      }

      async function init() {
        computeFit();
        draw = SVG().addTo('#map').size(width, height);
        worldGroup = draw.group().attr({ id: 'world' });
        // Order: outline, graticule, land, markers
        outlinePath = worldGroup.path('').addClass('outline');
        graticuleGroup = worldGroup.group();
        landGroup = worldGroup.group();
        markerGroup = worldGroup.group();
        MapApp._markerData = [];

        drawOutline();
        drawGraticule();
        applyView();
        bindEvents();

        try {
          const geojson = await loadWorld();
          MapApp._geojson = geojson;
          drawWorld(geojson);
        } catch (err) {
          console.error(err);
          document.querySelector('#loading p').textContent =
            'Could not load world data. Outline & projection still work.';
        }

        // Seed with a few famous cities to demo forward projection
        const demos = [
          { lat: 40.7128, lon: -74.0060, label: 'New York' },
          { lat: 51.5074, lon: -0.1278, label: 'London' },
          { lat: 35.6762, lon: 139.6503, label: 'Tokyo' },
          { lat: -33.8688, lon: 151.2093, label: 'Sydney' }
        ];
        demos.forEach(d => {
          addMarker(d.lon, d.lat, d.label);
          MapApp._markerData.push(d);
        });

        document.getElementById('loading').classList.add('hidden');

        // Self-test: round-trip accuracy
        const tests = [
          [0, 0], [90, 0], [-90, 0], [0, 45], [0, -45],
          [180, 0], [-180, 0], [117.19676, 34.05755], [-74.006, 40.7128]
        ];
        let maxErr = 0;
        tests.forEach(([lon, lat]) => {
          const p = EqualEarth.project(lon, lat);
          const inv = EqualEarth.invert(p.x, p.y);
          if (inv) {
            const err = Math.hypot(inv.lon - lon, inv.lat - lat);
            maxErr = Math.max(maxErr, err);
          }
        });
        console.log(`[Equal Earth] Round-trip max error: ${maxErr.toExponential(3)}°`);
      }

      return { init, _geojson: null, _markerData: [], _resizeTimer: null };
    })();

    // Boot
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => MapApp.init());
    } else {
      MapApp.init();
    }
  </script>
</body>
</html>
