<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>世界文明演化沙盘 · Civilizations Sandbox</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #131822;
    --panel-2: #1c2230;
    --border: #2a3142;
    --text: #d4dae5;
    --muted: #7a8499;
    --amber: #e8a951;
    --teal: #4dd0c1;
    --red: #e85d75;
    --green: #6fbf73;
    --purple: #a98edc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 1fr 290px;
    grid-template-areas: "header header" "main sidebar";
  }
  header {
    grid-area: header;
    background: linear-gradient(180deg, #0d121b, #0a0e14);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex; align-items: center;
    gap: 12px; flex-wrap: wrap;
  }
  .title {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 17px; color: var(--amber);
    letter-spacing: 3px; white-space: nowrap;
    text-shadow: 0 0 20px rgba(232,169,81,0.3);
  }
  .title .sub {
    color: var(--muted); font-family: 'JetBrains Mono';
    font-size: 10px; margin-left: 8px; letter-spacing: 1px;
  }
  .ctrl-group {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; background: rgba(255,255,255,0.02);
    border: 1px solid var(--border); border-radius: 4px;
  }
  .ctrl-group label {
    font-size: 9px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); padding: 5px 10px;
    border-radius: 3px; cursor: pointer;
    font-family: inherit; font-size: 11px;
    transition: all 0.15s;
  }
  button:hover {
    background: #2a3344; border-color: var(--amber); color: var(--amber);
  }
  button.active {
    background: var(--amber); color: #0a0e14; border-color: var(--amber);
  }
  button.event-btn {
    width: 100%; text-align: left; padding: 6px 10px;
    margin-bottom: 3px; font-size: 11px;
    display: flex; align-items: center; gap: 8px;
  }
  button.event-btn .ico {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber); flex-shrink: 0;
    box-shadow: 0 0 6px var(--amber);
  }
  button.event-btn[data-event="epidemic"] .ico { background: var(--green); box-shadow: 0 0 6px var(--green); }
  button.event-btn[data-event="drought"] .ico { background: #d4a76a; box-shadow: 0 0 6px #d4a76a; }
  button.event-btn[data-event="flood"] .ico { background: #5db4e8; box-shadow: 0 0 6px #5db4e8; }
  button.event-btn[data-event="heat"] .ico { background: #e85d75; box-shadow: 0 0 6px #e85d75; }
  button.event-btn[data-event="cold"] .ico { background: #b8d4e0; box-shadow: 0 0 6px #b8d4e0; }
  button.event-btn[data-event="insects"] .ico { background: #8eb55a; box-shadow: 0 0 6px #8eb55a; }
  button.event-btn[data-event="boredom"] .ico { background: var(--purple); box-shadow: 0 0 6px var(--purple); }
  button.event-btn[data-event="migration"] .ico { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  button.event-btn[data-event="trade"] .ico { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  button.event-btn[data-event="war"] .ico { background: var(--red); box-shadow: 0 0 6px var(--red); }
  main {
    grid-area: main; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at center, #0e1420 0%, #050810 100%);
  }
  #canvas-container { width: 100%; height: 100%; cursor: grab; }
  #canvas-container:active { cursor: grabbing; }
  aside {
    grid-area: sidebar;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  .panel-title {
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--amber); letter-spacing: 2.5px;
    text-transform: uppercase; margin-bottom: 8px;
    padding-bottom: 4px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .panel-title::before {
    content: ''; width: 4px; height: 4px;
    background: var(--amber); border-radius: 50%;
    box-shadow: 0 0 8px var(--amber);
  }
  .stat-row {
    display: flex; justify-content: space-between;
    padding: 3px 0; font-size: 11px;
  }
  .stat-row .label { color: var(--muted); }
  .stat-row .value { color: var(--text); font-weight: 600; }
  .stat-row .value.amber { color: var(--amber); }
  .stat-row .value.teal { color: var(--teal); }
  .stat-row .value.red { color: var(--red); }
  .stat-row .value.green { color: var(--green); }
  .stat-row .value.purple { color: var(--purple); }
  .trait-bar { margin: 4px 0; }
  .trait-bar .trait-label {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); margin-bottom: 2px;
  }
  .trait-bar .bar {
    height: 3px; background: rgba(255,255,255,0.05);
    border-radius: 2px; overflow: hidden;
  }
  .trait-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--amber));
    transition: width 0.3s;
    box-shadow: 0 0 4px rgba(232,169,81,0.4);
  }
  .event-log {
    max-height: 180px; overflow-y: auto;
    font-size: 10px; line-height: 1.5; margin-top: 8px;
  }
  .event-log .entry {
    padding: 3px 6px; border-left: 2px solid var(--border);
    margin-bottom: 2px; color: var(--muted);
  }
  .event-log .entry .time { color: var(--amber); margin-right: 4px; }
  .event-log .entry.war { border-color: var(--red); color: #e0b5bd; }
  .event-log .entry.trade { border-color: var(--amber); color: #e0d4b5; }
  .event-log .entry.disease { border-color: var(--green); color: #b5d4ba; }
  .event-log .entry.tech { border-color: var(--teal); color: #b5d4d0; }
  .event-log .entry.fall { border-color: var(--red); color: #d4a0a8; }
  .event-log .entry.migration { border-color: var(--purple); color: #c8b5d4; }
  .speed-buttons { display: flex; gap: 2px; }
  .speed-buttons button { padding: 4px 7px; min-width: 28px; }
  .view-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
  .notif-container {
    position: absolute; top: 14px; left: 50%;
    transform: translateX(-50%); pointer-events: none;
    z-index: 100; display: flex; flex-direction: column;
    gap: 6px; align-items: center;
  }
  .notif {
    background: rgba(20, 26, 38, 0.95);
    border: 1px solid var(--amber); color: var(--text);
    padding: 7px 16px; border-radius: 4px; font-size: 11px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 20px rgba(232,169,81,0.2);
    animation: notif-in 0.3s ease-out;
    max-width: 460px; text-align: center;
  }
  .notif.war { border-color: var(--red); box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 20px rgba(232,93,117,0.3); }
  .notif.disease { border-color: var(--green); }
  .notif.tech { border-color: var(--teal); }
  .notif.migration { border-color: var(--purple); }
  .notif.fall { border-color: var(--red); }
  @keyframes notif-in {
    from { transform: translateY(-12px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .info-panel {
    position: absolute; bottom: 14px; left: 14px;
    background: rgba(20, 26, 38, 0.94);
    border: 1px solid var(--border);
    padding: 12px 14px; border-radius: 4px;
    font-size: 10.5px; backdrop-filter: blur(6px);
    max-width: 320px; z-index: 50; line-height: 1.6;
  }
  .info-panel .name {
    font-family: 'Cinzel', serif; font-size: 14px;
    color: var(--amber); margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .info-panel .section {
    margin-top: 6px; padding-top: 6px;
    border-top: 1px dashed var(--border);
  }
  .info-panel .k { color: var(--muted); }
  .info-panel .v { color: var(--text); font-weight: 600; }
  .help-hint {
    position: absolute; bottom: 14px; right: 14px;
    background: rgba(20, 26, 38, 0.92);
    border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 4px;
    font-size: 10px; color: var(--muted); z-index: 50;
  }
  .help-hint kbd {
    background: var(--panel-2); padding: 1px 4px;
    border-radius: 2px; border: 1px solid var(--border);
    color: var(--amber); font-family: inherit; font-size: 9px;
  }
  input[type="range"] { width: 90px; accent-color: var(--amber); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--amber); }
</style>
</head>
<body>

<header>
  <div class="title">CIVILIZATIONS<span class="sub">autonomous world sandbox</span></div>
  
  <div class="ctrl-group">
    <button id="btn-pause">Pause</button>
    <button id="btn-reset">Reset</button>
  </div>
  
  <div class="ctrl-group">
    <label>Speed</label>
    <div class="speed-buttons" id="speed-buttons">
      <button data-speed="1" class="active">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="5">5×</button>
      <button data-speed="10">10×</button>
      <button data-speed="20">20×</button>
    </div>
  </div>
  
  <div class="ctrl-group">
    <label>Max Pop</label>
    <input type="range" id="max-pop" min="5000" max="200000" step="5000" value="50000">
    <span id="max-pop-val" style="font-size:11px;width:48px;color:var(--amber);">50k</span>
  </div>
  
  <div class="ctrl-group">
    <label>View</label>
    <select id="view-select" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);padding:4px 6px;border-radius:3px;font-family:inherit;font-size:11px;">
      <option value="terrain">Terrain</option>
      <option value="climate">Climate</option>
      <option value="resources">Resources</option>
      <option value="political">Political</option>
      <option value="tech">Technology</option>
      <option value="disease">Disease</option>
      <option value="population">Density</option>
    </select>
  </div>
  
  <div class="ctrl-group">
    <button id="btn-labels">Labels: On</button>
    <button id="btn-foreign">+ Foreign Tribe</button>
  </div>
</header>

<main>
  <div id="canvas-container"></div>
  <div class="notif-container" id="notifs"></div>
  <div class="info-panel" id="info-panel" style="display:none;"></div>
  <div class="help-hint">
    <kbd>Scroll</kbd> zoom · <kbd>Drag</kbd> pan · <kbd>Click</kbd> inspect · <kbd>Space</kbd> pause
  </div>
</main>

<aside>
  <div class="panel-title">World Statistics</div>
  <div id="stats"></div>
  
  <div class="panel-title" style="margin-top:14px;">Average Traits</div>
  <div id="traits"></div>
  
  <div class="panel-title" style="margin-top:14px;">Technology</div>
  <div id="tech-stats"></div>
  
  <div class="panel-title" style="margin-top:14px;">Trigger Event</div>
  <button class="event-btn" data-event="epidemic"><span class="ico"></span>Epidemic</button>
  <button class="event-btn" data-event="drought"><span class="ico"></span>Drought</button>
  <button class="event-btn" data-event="flood"><span class="ico"></span>Flood</button>
  <button class="event-btn" data-event="heat"><span class="ico"></span>Extreme Heat</button>
  <button class="event-btn" data-event="cold"><span class="ico"></span>Extreme Cold</button>
  <button class="event-btn" data-event="insects"><span class="ico"></span>Insect Plague</button>
  <button class="event-btn" data-event="boredom"><span class="ico"></span>Mass Boredom</button>
  <button class="event-btn" data-event="migration"><span class="ico"></span>Great Migration</button>
  <button class="event-btn" data-event="trade"><span class="ico"></span>Trade Enthusiasm</button>
  <button class="event-btn" data-event="war"><span class="ico"></span>War Desire</button>
  
  <div class="panel-title" style="margin-top:14px;">Event Log</div>
  <div class="event-log" id="event-log"></div>
</aside>

<script>
// ===== 世界与模拟常量 =====
const WORLD_W = 220, WORLD_H = 140, CELL_SIZE = 5;
const T_DEEP=0, T_OCEAN=1, T_SHALLOW=2, T_BEACH=3, T_PLAINS=4, T_FOREST=5, T_HILLS=6, T_MOUNTAIN=7, T_DESERT=8, T_TUNDRA=9, T_JUNGLE=10, T_SWAMP=11, T_SNOW=12;

const TERRAIN_COLORS = {
  [T_DEEP]: [8, 24, 38], [T_OCEAN]: [14, 42, 65], [T_SHALLOW]: [26, 70, 95],
  [T_BEACH]: [201, 175, 130], [T_PLAINS]: [122, 140, 88], [T_FOREST]: [55, 88, 60],
  [T_HILLS]: [140, 122, 88], [T_MOUNTAIN]: [120, 115, 110], [T_DESERT]: [212, 175, 110],
  [T_TUNDRA]: [175, 188, 180], [T_JUNGLE]: [42, 78, 50], [T_SWAMP]: [70, 88, 60],
  [T_SNOW]: [225, 232, 240]
};

// ===== 全局状态 =====
let world, worldGfx;
let settlements = [], tradeRoutes = [], wars = [], particles = [];
let events = [], notifications = [];
let viewMode = 'terrain', paused = false, simSpeed = 1;
let maxPop = 50000, showLabels = true;
let tick = 0;
let camera = {x: 0, y: 0, zoom: 1};
let dragStart = null, cameraStart = null, mouseDownPos = null;
let selectedSettlement = null;
let spatialHash = {}, HASH_CELL = 12;
let nextSettlementId = 0, nextDiseaseId = 0;
let cultureColors = [];
let frameRenderSkip = 0;

// ===== 名称生成 =====
const NAME_STARTS = ['Ak','Vesh','Tor','Khel','Bra','Mio','Sun','Pel','Thar','Yu','Zok','Av','Kesh','Drak','Nim','Syl','Que','Vael','On','Try','Uru','Vel','Khor','Mis','Sar','Hyk','Bel','Cyn','Or','Val','Xan','Fer','Kar','Lyr','Nyr','Bor','Thal','Eos','Iya','Mor','Kor','Sun','Vel','Ark','Dru','Fel','Gal','Hex','Ivo','Jor'];
const NAME_ENDS = ['ar','is','or','ia','um','ad','on','eth','ax','os','ius','aria','esh','une','or','en','ar','ia'];

function generateName() {
  return random(NAME_STARTS) + random(NAME_ENDS);
}

// ===== 世界生成 =====
function generateWorld() {
  world = [];
  noiseSeed(floor(random(1000000)));
  const cx = WORLD_W / 2, cy = WORLD_H / 2;
  
  for (let y = 0; y < WORLD_H; y++) {
    world[y] = [];
    for (let x = 0; x < WORLD_W; x++) {
      const dx = (x - cx) / cx, dy = (y - cy) / cy;
      const dist = sqrt(dx*dx + dy*dy);
      const cont = 1 - constrain(dist * 0.85, 0, 1);
      
      // 多倍频噪声
      let e = 0, amp = 1, freq = 0.022;
      for (let o = 0; o < 5; o++) {
        e += noise(x * freq, y * freq) * amp;
        amp *= 0.5; freq *= 2;
      }
      e /= 1.9375;
      const elev = e * 0.55 + cont * 0.45;
      
      let m = 0; amp = 1; freq = 0.018;
      for (let o = 0; o < 4; o++) {
        m += noise(x * freq + 500, y * freq + 500) * amp;
        amp *= 0.5; freq *= 2;
      }
      m /= 1.875;
      
      const lat = y / WORLD_H;
      const baseTemp = 1 - abs(lat - 0.5) * 1.9;
      const altCooling = max(0, elev - 0.5) * 0.6;
      const temp = constrain(baseTemp - altCooling + (m - 0.5) * 0.08, 0, 1);
      
      let terrain;
      if (elev < 0.30) terrain = T_DEEP;
      else if (elev < 0.36) terrain = T_OCEAN;
      else if (elev < 0.40) terrain = T_SHALLOW;
      else if (elev < 0.43) terrain = T_BEACH;
      else {
        if (temp < 0.15) terrain = T_SNOW;
        else if (temp < 0.30) terrain = T_TUNDRA;
        else if (temp > 0.75 && m < 0.32) terrain = T_DESERT;
        else if (temp > 0.70 && m > 0.62) terrain = T_JUNGLE;
        else if (elev > 0.74) terrain = T_MOUNTAIN;
        else if (elev > 0.60) terrain = T_HILLS;
        else if (m > 0.72 && temp < 0.55) terrain = T_SWAMP;
        else if (m > 0.52) terrain = T_FOREST;
        else terrain = T_PLAINS;
      }
      
      const cell = {terrain, elev, moist: m, temp, fert:0, wood:0, stone:0, ore:0, gold:0, fish:0, game:0};
      
      if (terrain === T_PLAINS) cell.fert = 0.7 + m * 0.3;
      else if (terrain === T_FOREST) cell.fert = 0.5 + m * 0.2;
      else if (terrain === T_JUNGLE) cell.fert = 0.85;
      else if (terrain === T_SWAMP) cell.fert = 0.45;
      else if (terrain === T_BEACH) cell.fert = 0.2;
      else if (terrain === T_HILLS) cell.fert = 0.4;
      else if (terrain === T_TUNDRA) cell.fert = 0.18;
      else cell.fert = 0.05;
      
      if (terrain === T_FOREST) cell.wood = 0.85;
      else if (terrain === T_JUNGLE) cell.wood = 1.0;
      else if (terrain === T_HILLS) cell.wood = 0.35;
      else if (terrain === T_SWAMP) cell.wood = 0.4;
      else cell.wood = 0.08;
      
      if (terrain === T_MOUNTAIN) {
        cell.stone = 1.0;
        cell.ore = noise(x*0.1+100, y*0.1+100) > 0.55 ? 0.85 : 0.25;
        cell.gold = noise(x*0.15+200, y*0.15+200) > 0.68 ? 0.55 : 0;
      } else if (terrain === T_HILLS) {
        cell.stone = 0.55;
        cell.ore = noise(x*0.1+100, y*0.1+100) > 0.62 ? 0.45 : 0.08;
        cell.gold = noise(x*0.15+200, y*0.15+200) > 0.72 ? 0.2 : 0;
      }
      
      if (terrain === T_SHALLOW) cell.fish = 0.7 + noise(x*0.1, y*0.1) * 0.3;
      else if (terrain === T_OCEAN) cell.fish = 0.35;
      else if (terrain === T_BEACH) cell.fish = 0.2;
      
      if (terrain === T_FOREST) cell.game = 0.65;
      else if (terrain === T_PLAINS) cell.game = 0.45;
      else if (terrain === T_TUNDRA) cell.game = 0.3;
      else if (terrain === T_HILLS) cell.game = 0.3;
      else if (terrain === T_JUNGLE) cell.game = 0.4;
      
      world[y][x] = cell;
    }
  }
  
  buildWorldBuffer();
}

function isWater(t) { return t === T_DEEP || t === T_OCEAN || t === T_SHALLOW; }

function buildWorldBuffer() {
  if (!worldGfx) worldGfx = createGraphics(WORLD_W, WORLD_H);
  worldGfx.noSmooth();
  worldGfx.loadPixels();
  for (let y = 0; y < WORLD_H; y++) {
    for (let x = 0; x < WORLD_W; x++) {
      const cell = world[y][x];
      const col = getCellColor(cell, viewMode);
      const idx = (y * WORLD_W + x) * 4;
      worldGfx.pixels[idx] = col[0];
      worldGfx.pixels[idx+1] = col[1];
      worldGfx.pixels[idx+2] = col[2];
      worldGfx.pixels[idx+3] = 255;
    }
  }
  worldGfx.updatePixels();
}

function getCellColor(cell, mode) {
  if (mode === 'terrain') return TERRAIN_COLORS[cell.terrain];
  if (mode === 'climate') {
    const t = cell.temp;
    const r = floor(t * 220 + 25);
    const b = floor((1-t) * 200 + 30);
    return [r, 75, b];
  }
  if (mode === 'resources') {
    if (isWater(cell.terrain)) return [18, 45, 65];
    const gold = cell.gold * 220, ore = cell.ore * 110;
    const wood = cell.wood * 90, fert = cell.fert * 110, fish = cell.fish * 90;
    return [
      min(255, 35 + gold + ore * 0.5),
      min(255, 50 + fert * 0.8 + fish * 0.3),
      min(255, 35 + wood * 0.4)
    ];
  }
  // 动态模式：暗化地形作为底图
  const base = TERRAIN_COLORS[cell.terrain];
  return [base[0]*0.32, base[1]*0.32, base[2]*0.32];
}

// ===== 颜色生成 =====
function setupCultureColors() {
  cultureColors = [];
  colorMode(HSB, 360, 100, 100);
  for (let i = 0; i < 60; i++) {
    cultureColors.push(color((i * 67) % 360, 65 + (i % 3) * 10, 85 + (i % 2) * 10));
  }
  colorMode(RGB, 255);
}

// ===== Settlement 类 =====
class Settlement {
  constructor(x, y, genome, culture, parent = null) {
    this.id = nextSettlementId++;
    this.x = x; this.y = y;
    this.population = parent ? 25 : 50;
    this.genome = genome;
    this.culture = culture;
    this.tech = parent ? {...parent.tech} : {
      agriculture: 1, military: 1, medicine: 1, industry: 1, seafaring: 1
    };
    if (parent) for (const k in this.tech) this.tech[k] = max(1, this.tech[k] + random(-0.15, 0.15));
    this.resources = {food: 100, materials: 50, wealth: 30};
    this.diseases = [];
    this.mood = 0.6;
    this.memory = {
      allies: new Set(), enemies: new Set(),
      tradePartners: new Set()
    };
    this.flags = {};
    this.age = 0;
    this.name = parent ? generateName() + ' ' + random(['Colony','Outpost','Nova','Minor','Secunda','Lesser']) : generateName();
    this.color = culture.color;
    this.dead = false;
    this.glow = 0;
    this.shake = 0;
    this.lastBreakthroughTick = 0;
  }
  
  gatherRadius() { return 3 + this.tech.agriculture * 0.4; }
  popCap() { return 50 + this.tech.agriculture * 35 + this.tech.medicine * 25; }
  
  gatherResources() {
    const r = this.gatherRadius();
    const r2 = r * r;
    let food = 0, materials = 0, wealth = 0;
    const ix = floor(this.x), iy = floor(this.y);
    const range = ceil(r);
    for (let dy = -range; dy <= range; dy++) {
      for (let dx = -range; dx <= range; dx++) {
        if (dx*dx + dy*dy > r2) continue;
        const x = ix + dx, y = iy + dy;
        if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) continue;
        const c = world[y][x];
        const agBonus = 1 + this.tech.agriculture * 0.08;
        const indBonus = 1 + this.tech.industry * 0.1;
        const seaBonus = 1 + this.tech.seafaring * 0.12;
        food += c.fert * 0.5 * agBonus + c.fish * 0.45 * seaBonus + c.game * 0.35;
        materials += c.wood * 0.3 * indBonus + c.stone * 0.2;
        wealth += c.gold * 0.6 + c.ore * 0.25;
      }
    }
    const workforce = sqrt(max(1, this.population));
    return {
      food: food * workforce * 0.12,
      materials: materials * workforce * 0.06,
      wealth: wealth * workforce * 0.025
    };
  }
  
  update() {
    this.age++;
    const gathered = this.gatherResources();
    this.resources.food += gathered.food;
    this.resources.materials += gathered.materials;
    this.resources.wealth += gathered.wealth;
    
    const foodNeed = this.population * 0.5;
    this.resources.food -= foodNeed;
    
    let growthRate = 0;
    if (this.resources.food > 0) {
      const surplus = this.resources.food / max(1, this.population);
      growthRate = 0.006 * this.genome.fertility * (1 + this.tech.medicine * 0.04);
      if (surplus < 2) growthRate *= 0.35;
      if (this.mood < 0.35) growthRate *= 0.5;
    } else {
      growthRate = -0.012;
      this.resources.food = 0;
    }
    
    // 全局人口上限
    if (getTotalPop() > maxPop) growthRate = min(growthRate, -0.005);
    
    // 疾病
    let diseaseDeaths = 0;
    for (const d of this.diseases) {
      const resistance = (this.tech.medicine * 0.04) + this.genome.adaptability * 0.3;
      const lethality = d.lethality * (1 - resistance) * (1 - d.immunity);
      diseaseDeaths += this.population * lethality * 0.06;
      d.immunity = min(1, d.immunity + 0.018 * (0.3 + this.genome.adaptability));
      d.progress++;
    }
    this.population -= diseaseDeaths;
    this.diseases = this.diseases.filter(d => d.immunity < 0.92 && d.progress < 220);
    
    this.population *= (1 + growthRate);
    this.population = max(0.5, this.population);
    
    if (this.population < 1) {
      this.dead = true;
      addEvent('fall', `${this.name} faded into ruin.`);
      return;
    }
    
    // 科技成长
    if (this.age % 18 === 0) {
      const techGain = 0.025 * this.genome.curiosity * (1 + this.population / 200);
      const bias = {
        agriculture: this.genome.fertility * 0.7 + 0.3,
        military: this.genome.aggression * 0.8 + 0.2,
        medicine: this.genome.adaptability * 0.6 + 0.3,
        industry: this.genome.curiosity * 0.7 + 0.3,
        seafaring: this.genome.tradeAff * 0.7 + 0.2
      };
      for (const d in bias) this.tech[d] += techGain * bias[d];
      
      // 突破
      if (tick - this.lastBreakthroughTick > 200 && random() < 0.008 * this.genome.curiosity * (this.population / 80)) {
        const domains = ['agriculture', 'military', 'medicine', 'industry', 'seafaring'];
        const d = random(domains);
        this.tech[d] += 0.8 + random(0.5);
        this.glow = 35;
        this.lastBreakthroughTick = tick;
        const breakNames = {
          agriculture: ['Granary','Crop Rotation','Iron Plow','Terrace Farming',' selective Breeding'],
          military: ['Bronze Weapons','Siege Engines','Standing Army','Fortifications','Cavalry'],
          medicine: ['Herbalism','Surgery','Sanitation','Quarantine','Anatomy'],
          industry: ['Pottery Wheel','Metallurgy','Watermill','Printing','Steam Power'],
          seafaring: ['Sails','Compass','Cartography','Astronavigation','Galleons']
        };
        const breakthrough = random(breakNames[d]);
        addEvent('tech', `${this.name} discovered ${breakthrough} (${d}).`);
        spawnParticle(this.x, this.y, 'tech');
      }
    }
    
    // 心情
    let targetMood = 0.5;
    if (this.resources.food > 50) targetMood += 0.2;
    if (this.resources.wealth > 80) targetMood += 0.1;
    if (this.diseases.length > 0) targetMood -= 0.25;
    if (this.flags.boredom) targetMood -= 0.2;
    if (this.flags.warlike) targetMood += 0.1;
    if (this.memory.enemies.size > 1) targetMood -= 0.1;
    targetMood = constrain(targetMood, 0, 1);
    this.mood += (targetMood - this.mood) * 0.04;
    
    // 衰减状态标记
    for (const k in this.flags) {
      this.flags[k]--;
      if (this.flags[k] <= 0) delete this.flags[k];
    }
    if (this.glow > 0) this.glow--;
    if (this.shake > 0.05) this.shake *= 0.88; else this.shake = 0;
    
    // 文化漂变
    if (this.age % 250 === 0) {
      for (const k in this.genome) {
        this.genome[k] = constrain(this.genome[k] + random(-0.025, 0.025), 0, 1);
      }
    }
    
    // 资源腐烂
    this.resources.food = max(0, this.resources.food - this.population * 0.02);
  }
  
  decide() {
    if (this.dead) return;
    const nearby = getNearby(this.x, this.y, 22);
    const aggression = this.genome.aggression + (this.flags.boredom ? 0.25 : 0) + (this.flags.warlike ? 0.4 : 0);
    const restless = !!this.flags.restless || !!this.flags.boredom;
    
    // 贸易
    if (this.genome.tradeAff > 0.35 && random() < 0.06) {
      for (const other of nearby) {
        if (other === this || other.dead) continue;
        if (this.memory.enemies.has(other.id)) continue;
        const dx = this.x - other.x, dy = this.y - other.y;
        const dist = sqrt(dx*dx + dy*dy);
        if (dist > 14 + this.tech.seafaring * 1.5) continue;
        if (other.genome.tradeAff < 0.28) continue;
        if (!hasTradeRoute(this, other) && tradeRoutes.length < 90) {
          tradeRoutes.push({a: this, b: other, age: 0, strength: 0.3});
          this.memory.tradePartners.add(other.id);
          other.memory.tradePartners.add(other.id);
          if (random() < 0.4) {
            addEvent('trade', `Caravans connect ${this.name} and ${other.name}.`);
          }
          break;
        }
      }
    }
    
    // 战争
    if (aggression > 0.55 && this.population > 35 && random() < 0.025) {
      for (const other of nearby) {
        if (other === this || other.dead) continue;
        if (this.memory.allies.has(other.id)) continue;
        if (this.memory.enemies.has(other.id)) continue;
        if (other.culture.id === this.culture.id && random() < 0.7) continue;
        const dx = this.x - other.x, dy = this.y - other.y;
        const dist = sqrt(dx*dx + dy*dy);
        if (dist > 11) continue;
        const myStr = this.population * (1 + this.tech.military * 0.12);
        const theirStr = other.population * (1 + other.tech.military * 0.12);
        if (myStr > theirStr * 0.75 || this.flags.warlike) {
          declareWar(this, other);
          break;
        }
      }
    }
    
    // 迁移
    if ((this.population > this.popCap() * 0.85 || restless) && random() < 0.012) {
      this.migrate();
    }
    
    // 疾病传播
    for (const d of this.diseases) {
      if (random() < d.virulence * 0.08) {
        for (const other of nearby) {
          if (other === this || other.dead) continue;
          const dx = this.x - other.x, dy = this.y - other.y;
          const dist = sqrt(dx*dx + dy*dy);
          if (dist > 7) continue;
          if (!other.diseases.find(od => od.id === d.id)) {
            other.diseases.push({...d, immunity: 0, progress: 0});
            if (random() < 0.25) {
              addEvent('disease', `${d.name} spread to ${other.name}.`);
            }
          }
        }
      }
    }
    
    // 科技传播
    if (this.memory.tradePartners.size > 0 && random() < 0.06) {
      for (const other of nearby) {
        if (other === this || other.dead) continue;
        if (!this.memory.tradePartners.has(other.id)) continue;
        for (const d in this.tech) {
          if (other.tech[d] > this.tech[d]) {
            this.tech[d] += (other.tech[d] - this.tech[d]) * 0.012;
          }
        }
      }
    }
    
    // 联盟形成
    if (this.memory.tradePartners.size > 1 && random() < 0.006) {
      for (const other of nearby) {
        if (other === this || other.dead) continue;
        if (this.memory.allies.has(other.id)) continue;
        if (this.memory.enemies.has(other.id)) continue;
        if (!this.memory.tradePartners.has(other.id)) continue;
        if (this.hasCommonEnemy(other) || (this.culture.id === other.culture.id && random() < 0.4)) {
          this.memory.allies.add(other.id);
          other.memory.allies.add(this.id);
          addEvent('trade', `${this.name} and ${other.name} forged an alliance.`);
          break;
        }
      }
    }
    
    // 联盟/敌对衰减
    if (tick % 500 === 0) {
      // 缓慢遗忘
      if (this.memory.enemies.size > 5 && random() < 0.3) {
        const ids = Array.from(this.memory.enemies);
        this.memory.enemies.delete(random(ids));
      }
    }
  }
  
  hasCommonEnemy(other) {
    for (const id of this.memory.enemies) {
      if (other.memory.enemies.has(id)) return true;
    }
    return false;
  }
  
  migrate() {
    let bestX = -1, bestY = -1, bestScore = -Infinity;
    for (let attempt = 0; attempt < 25; attempt++) {
      const ang = random(TWO_PI);
      const dist = random(12, 32);
      const x = this.x + cos(ang) * dist;
      const y = this.y + sin(ang) * dist;
      const ix = floor(x), iy = floor(y);
      if (ix < 1 || ix >= WORLD_W-1 || iy < 1 || iy >= WORLD_H-1) continue;
      const c = world[iy][ix];
      if (isWater(c.terrain)) continue;
      if (c.terrain === T_MOUNTAIN || c.terrain === T_SNOW) continue;
      let crowded = false;
      for (const s of getNearby(x, y, 6)) {
        if (s === this) continue;
        const dx = x - s.x, dy = y - s.y;
        if (sqrt(dx*dx + dy*dy) < 4) { crowded = true; break; }
      }
      if (crowded) continue;
      const score = c.fert * 2 + c.game + c.wood * 0.5 - c.elev * 0.5;
      if (score > bestScore) {
        bestScore = score;
        bestX = x; bestY = y;
      }
    }
    if (bestX >= 0) {
      const newGenome = {};
      for (const k in this.genome) newGenome[k] = constrain(this.genome[k] + random(-0.06, 0.06), 0, 1);
      const sameCulture = random() < 0.65;
      const newCulture = sameCulture ? {
        id: this.culture.id,
        name: this.culture.name,
        color: this.culture.color,
        religion: this.culture.religion
      } : {
        id: nextSettlementId,
        name: generateName(),
        color: random(cultureColors),
        religion: floor(random(10))
      };
      const child = new Settlement(bestX, bestY, newGenome, newCulture, this);
      settlements.push(child);
      this.population *= 0.72;
      addEvent('migration', `${this.name} founded ${child.name}.`);
      spawnParticle(bestX, bestY, 'migration');
    }
  }
}

// ===== 工具函数 =====
function dist2(x1, y1, x2, y2) {
  const dx = x1 - x2, dy = y1 - y2;
  return sqrt(dx*dx + dy*dy);
}

function rebuildSpatialHash() {
  spatialHash = {};
  for (const s of settlements) {
    if (s.dead) continue;
    const key = floor(s.x / HASH_CELL) + ',' + floor(s.y / HASH_CELL);
    if (!spatialHash[key]) spatialHash[key] = [];
    spatialHash[key].push(s);
  }
}

function getNearby(x, y, radius) {
  const result = [];
  const r = ceil(radius / HASH_CELL);
  const cx = floor(x / HASH_CELL);
  const cy = floor(y / HASH_CELL);
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const key = (cx+dx) + ',' + (cy+dy);
      if (spatialHash[key]) {
        for (const s of spatialHash[key]) result.push(s);
      }
    }
  }
  return result;
}

function hasTradeRoute(a, b) {
  for (const r of tradeRoutes) {
    if ((r.a === a && r.b === b) || (r.a === b && r.b === a)) return true;
  }
  return false;
}

function declareWar(a, b) {
  for (const w of wars) {
    if ((w.a === a && w.b === b) || (w.a === b && w.b === a)) return;
  }
  wars.push({a, b, age: 0, intensity: 1, duration: floor(random(40, 120))});
  a.memory.enemies.add(b.id);
  b.memory.enemies.add(a.id);
  // 贸易路线中断
  tradeRoutes = tradeRoutes.filter(r => !((r.a === a && r.b === b) || (r.a === b && r.b === a)));
  a.memory.tradePartners.delete(b.id);
  b.memory.tradePartners.delete(a.id);
  addEvent('war', `${a.name} declared war on ${b.name}!`);
  a.shake = 12; b.shake = 12;
}

function spawnDisease(settlement, name) {
  const d = {
    id: nextDiseaseId++,
    name: name || random(['Black Cough','Red Fever','Gray Plague','White Shivers','Pale Death','Crimson Flux','Jade Sickness','Salt Blight']),
    virulence: random(0.3, 0.8),
    lethality: random(0.04, 0.28),
    immunity: 0,
    progress: 0
  };
  settlement.diseases.push(d);
  addEvent('disease', `${d.name} broke out in ${settlement.name}.`);
  spawnParticle(settlement.x, settlement.y, 'disease');
}

function getTotalPop() {
  let t = 0;
  for (const s of settlements) if (!s.dead) t += s.population;
  return t;
}

function addEvent(type, text) {
  events.push({type, text, tick});
  if (events.length > 120) events.shift();
  if (['war', 'tech', 'disease', 'foreign', 'fall', 'migration'].includes(type)) {
    notifications.push({text, type, life: 200});
    if (notifications.length > 4) notifications.shift();
  }
}

function spawnParticle(x, y, type) {
  const count = type === 'tech' ? 12 : (type === 'war' ? 6 : 8);
  for (let i = 0; i < count; i++) {
    const ang = random(TWO_PI);
    const spd = random(0.3, 1.5);
    particles.push({
      x: x * CELL_SIZE, y: y * CELL_SIZE,
      vx: cos(ang) * spd, vy: sin(ang) * spd - (type === 'tech' ? 0.5 : 0),
      life: random(30, 70), maxLife: 70,
      type, size: random(2, 4.5),
      color: type === 'tech' ? [77, 208, 193] :
             type === 'war' ? [232, 93, 117] :
             type === 'migration' ? [169, 142, 220] :
             type === 'disease' ? [111, 191, 115] :
             type === 'flood' ? [93, 180, 232] :
             [232, 169, 81]
    });
  }
}

// ===== 初始定居点 =====
function spawnInitialSettlements(count) {
  let attempts = 0, spawned = 0;
  while (spawned < count && attempts < 2000) {
    attempts++;
    const x = random(5, WORLD_W - 5);
    const y = random(5, WORLD_H - 5);
    const ix = floor(x), iy = floor(y);
    const c = world[iy][ix];
    if (isWater(c.terrain)) continue;
    if (c.fert < 0.35) continue;
    let tooClose = false;
    for (const s of settlements) {
      if (dist2(x, y, s.x, s.y) < 11) { tooClose = true; break; }
    }
    if (tooClose) continue;
    const genome = {
      aggression: random(0.2, 0.65),
      curiosity: random(0.3, 0.75),
      tradeAff: random(0.3, 0.75),
      fertility: random(0.4, 0.85),
      adaptability: random(0.35, 0.75),
      cohesion: random(0.4, 0.75)
    };
    const culture = {
      id: spawned,
      name: generateName(),
      color: cultureColors[spawned % cultureColors.length],
      religion: floor(random(10))
    };
    settlements.push(new Settlement(x, y, genome, culture));
    spawned++;
  }
}

// ===== 仿真主循环 =====
function tickSimulation() {
  tick++;
  rebuildSpatialHash();
  
  for (const s of settlements) s.update();
  
  if (tick % 3 === 0) {
    for (const s of settlements) s.decide();
  }
  
  // 更新贸易路线
  for (const r of tradeRoutes) {
    r.age++;
    r.strength = min(1, r.strength + 0.008);
    const exchange = min(r.a.resources.food, r.b.resources.food) * 0.008;
    r.a.resources.wealth += exchange * 0.4;
    r.b.resources.wealth += exchange * 0.4;
    r.a.resources.food -= exchange * 0.2;
    r.b.resources.food -= exchange * 0.2;
    r.a.mood = min(1, r.a.mood + 0.0008);
    r.b.mood = min(1, r.b.mood + 0.0008);
    if (r.age % 60 === 0) {
      for (const k in r.a.genome) {
        const avg = (r.a.genome[k] + r.b.genome[k]) / 2;
        r.a.genome[k] += (avg - r.a.genome[k]) * 0.008;
        r.b.genome[k] += (avg - r.b.genome[k]) * 0.008;
      }
    }
    if (random() < 0.005) {
      const ax = r.a.x * CELL_SIZE, ay = r.a.y * CELL_SIZE;
      const bx = r.b.x * CELL_SIZE, by = r.b.y * CELL_SIZE;
      const t = random();
      particles.push({
        x: lerp(ax, bx, t), y: lerp(ay, by, t),
        vx: 0, vy: 0, life: 30, maxLife: 30,
        type: 'trade', size: 2.5, color: [232, 169, 81]
      });
    }
  }
  tradeRoutes = tradeRoutes.filter(r => !r.a.dead && !r.b.dead && r.age < 1500);
  
  // 更新战争
  for (const w of wars) {
    w.age++;
    const aStr = w.a.population * (1 + w.a.tech.military * 0.12);
    const bStr = w.b.population * (1 + w.b.tech.military * 0.12);
    const totalStr = aStr + bStr + 0.01;
    const aLoss = (bStr / totalStr) * 0.6;
    const bLoss = (aStr / totalStr) * 0.6;
    w.a.population -= aLoss;
    w.b.population -= bLoss;
    w.a.shake = 6; w.b.shake = 6;
    w.a.resources.wealth = max(0, w.a.resources.wealth - 0.5);
    w.b.resources.wealth = max(0, w.b.resources.wealth - 0.5);
    if (random() < 0.08) {
      const mx = (w.a.x + w.b.x) / 2 * CELL_SIZE;
      const my = (w.a.y + w.b.y) / 2 * CELL_SIZE;
      particles.push({
        x: mx + random(-3, 3), y: my + random(-3, 3),
        vx: random(-0.5, 0.5), vy: random(-0.5, 0.5),
        life: 25, maxLife: 25, type: 'war', size: random(2, 4),
        color: [232, 93, 117]
      });
    }
    
    // 联盟介入
    if (random() < 0.01) {
      for (const s of settlements) {
        if (s.dead || s === w.a || s === w.b) continue;
        if (s.memory.allies.has(w.a.id) && !s.memory.enemies.has(w.b.id)) {
          if (random() < 0.5) declareWar(s, w.b);
          break;
        }
        if (s.memory.allies.has(w.b.id) && !s.memory.enemies.has(w.a.id)) {
          if (random() < 0.5) declareWar(s, w.a);
          break;
        }
      }
    }
    
    if (w.a.population < 5 || w.b.population < 5 || w.age > w.duration) {
      const winner = w.a.population > w.b.population ? w.a : w.b;
      const loser = winner === w.a ? w.b : w.a;
      if (loser.population < 5) {
        loser.dead = true;
        addEvent('war', `${winner.name} razed ${loser.name} to the ground.`);
        winner.resources.wealth += loser.resources.wealth * 0.6;
        winner.resources.materials += loser.resources.materials * 0.5;
        winner.tech.military += 0.3;
      } else {
        addEvent('war', `${winner.name} and ${loser.name} signed a peace treaty.`);
        w.a.memory.enemies.delete(w.b.id);
        w.b.memory.enemies.delete(w.a.id);
      }
    }
  }
  wars = wars.filter(w => !w.a.dead && !w.b.dead && w.age < w.duration + 30);
  
  // 移除死亡定居点
  settlements = settlements.filter(s => !s.dead);
  
  // 粒子更新
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.01;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  
  // 自然事件
  if (random() < 0.0006) {
    const r = random();
    if (r < 0.25) triggerEvent('epidemic', true);
    else if (r < 0.45) triggerEvent('drought', true);
    else if (r < 0.6) triggerEvent('flood', true);
    else if (r < 0.75) triggerEvent('heat', true);
    else if (r < 0.9) triggerEvent('cold', true);
    else triggerEvent('insects', true);
  }
  
  // 通知衰减
  notifications = notifications.filter(n => {
    n.life--;
    return n.life > 0;
  });
}

// ===== 事件触发 =====
function triggerEvent(type, silent = false) {
  const alive = settlements.filter(s => !s.dead);
  if (alive.length === 0 && !silent) return;
  
  switch (type) {
    case 'epidemic': {
      const s = random(alive);
      if (s) spawnDisease(s);
      break;
    }
    case 'drought': {
      const cx = random(WORLD_W), cy = random(WORLD_H);
      for (let y = 0; y < WORLD_H; y++) {
        for (let x = 0; x < WORLD_W; x++) {
          if (dist2(x, y, cx, cy) < 22) world[y][x].fert *= 0.35;
        }
      }
      if (!silent) addEvent('disease', 'A severe drought withered the crops.');
      break;
    }
    case 'flood': {
      for (const s of alive) {
        const c = world[floor(s.y)][floor(s.x)];
        if (c.terrain === T_BEACH || c.terrain === T_SWAMP || c.terrain === T_SHALLOW) {
          s.population *= 0.7;
          s.resources.food *= 0.5;
          spawnParticle(s.x, s.y, 'flood');
        }
      }
      if (!silent) addEvent('disease', 'Floods drowned the lowlands.');
      break;
    }
    case 'heat': {
      for (const s of alive) {
        const c = world[floor(s.y)][floor(s.x)];
        if (c.temp > 0.65) {
          s.population *= 0.82;
          s.resources.food *= 0.6;
        }
      }
      if (!silent) addEvent('disease', 'A blistering heatwave scorched the tropics.');
      break;
    }
    case 'cold': {
      for (const s of alive) {
        const c = world[floor(s.y)][floor(s.x)];
        if (c.temp < 0.35) {
          s.population *= 0.82;
          s.resources.food *= 0.6;
        }
      }
      if (!silent) addEvent('disease', 'A bitter frost gripped the north.');
      break;
    }
    case 'insects': {
      for (const s of alive) {
        s.resources.food *= 0.35;
        s.resources.materials *= 0.7;
      }
      if (!silent) addEvent('disease', 'Insect swarms devoured the harvest.');
      break;
    }
    case 'boredom': {
      for (const s of alive) {
        s.flags.boredom = 120;
        s.genome.aggression = min(1, s.genome.aggression + 0.15);
      }
      if (!silent) addEvent('migration', 'A wave of boredom swept the world. The people grow restless...');
      break;
    }
    case 'migration': {
      for (const s of alive) {
        s.flags.restless = 80;
      }
      if (!silent) addEvent('migration', 'Wanderlust stirs in every heart.');
      break;
    }
    case 'trade': {
      for (const s of alive) {
        s.genome.tradeAff = min(1, s.genome.tradeAff + 0.25);
        s.resources.wealth += 40;
      }
      if (!silent) addEvent('trade', 'Markets flourish! Trade enthusiasm spreads.');
      break;
    }
    case 'war': {
      for (const s of alive) {
        s.flags.warlike = 120;
        s.genome.aggression = min(1, s.genome.aggression + 0.25);
      }
      if (!silent) addEvent('war', 'War drums echo across the continents.');
      break;
    }
  }
}

function addForeignTribe() {
  for (let i = 0; i < 80; i++) {
    const x = random(5, WORLD_W - 5);
    const y = random(5, WORLD_H - 5);
    const ix = floor(x), iy = floor(y);
    if (isWater(world[iy][ix].terrain)) continue;
    if (world[iy][ix].fert < 0.2) continue;
    let tooClose = false;
    for (const s of settlements) {
      if (dist2(x, y, s.x, s.y) < 10) { tooClose = true; break; }
    }
    if (tooClose) continue;
    
    // 极端基因组
    const extremeHigh = () => random(0.75, 1);
    const extremeLow = () => random(0, 0.25);
    const genome = {
      aggression: random() > 0.5 ? extremeHigh() : extremeLow(),
      curiosity: random() > 0.5 ? extremeHigh() : extremeLow(),
      tradeAff: random() > 0.5 ? extremeHigh() : extremeLow(),
      fertility: random(0.2, 0.95),
      adaptability: random(0.2, 0.95),
      cohesion: random(0.2, 0.95)
    };
    const culture = {
      id: 9999 + settlements.length,
      name: 'Xen-' + generateName(),
      color: color(random(100, 255), random(100, 255), random(100, 255)),
      religion: 99 + floor(random(20))
    };
    const s = new Settlement(x, y, genome, culture);
    s.tech = {
      agriculture: random(1, 6),
      military: random(1, 6),
      medicine: random(1, 6),
      industry: random(1, 6),
      seafaring: random(1, 6)
    };
    s.population = random(80, 160);
    s.glow = 30;
    settlements.push(s);
    addEvent('migration', `Foreign tribe ${s.name} arrived from beyond the seas!`);
    spawnParticle(x, y, 'tech');
    return;
  }
}

// ===== 渲染 =====
function drawWorld() {
  noSmooth();
  image(worldGfx, 0, 0, WORLD_W * CELL_SIZE, WORLD_H * CELL_SIZE);
  smooth();
  
  // 地图边框
  noFill();
  stroke(40, 50, 70, 100);
  strokeWeight(1);
  rect(0, 0, WORLD_W * CELL_SIZE, WORLD_H * CELL_SIZE);
}

function drawOverlay() {
  push();
  if (viewMode === 'political') {
    blendMode(SCREEN);
    noStroke();
    for (const s of settlements) {
      if (s.dead) continue;
      const sx = s.x * CELL_SIZE, sy = s.y * CELL_SIZE;
      const r = sqrt(s.population) * 5;
      fill(red(s.color), green(s.color), blue(s.color), 35);
      circle(sx, sy, r * 2.5);
      fill(red(s.color), green(s.color), blue(s.color), 60);
      circle(sx, sy, r * 1.5);
    }
    blendMode(BLEND);
  } else if (viewMode === 'tech') {
    blendMode(ADD);
    noStroke();
    for (const s of settlements) {
      if (s.dead) continue;
      const tt = (s.tech.agriculture + s.tech.military + s.tech.medicine + s.tech.industry + s.tech.seafaring) / 5;
      const sx = s.x * CELL_SIZE, sy = s.y * CELL_SIZE;
      fill(77, 208, 193, 50);
      circle(sx, sy, tt * 12);
      fill(77, 208, 193, 120);
      circle(sx, sy, tt * 6);
    }
    blendMode(BLEND);
  } else if (viewMode === 'disease') {
    noStroke();
    for (const s of settlements) {
      if (s.dead || s.diseases.length === 0) continue;
      const sx = s.x * CELL_SIZE, sy = s.y * CELL_SIZE;
      for (const d of s.diseases) {
        fill(111, 191, 115, 45);
        const r = 18 + sin(tick * 0.12 + d.id) * 4;
        circle(sx, sy, r);
        fill(111, 191, 115, 25);
        circle(sx, sy, r * 1.6);
      }
    }
  } else if (viewMode === 'population') {
    blendMode(ADD);
    noStroke();
    for (const s of settlements) {
      if (s.dead) continue;
      const sx = s.x * CELL_SIZE, sy = s.y * CELL_SIZE;
      const r = sqrt(s.population) * 1.8;
      fill(232, 169, 81, 40);
      circle(sx, sy, r * 3);
      fill(232, 169, 81, 90);
      circle(sx, sy, r * 1.5);
    }
    blendMode(BLEND);
  }
  pop();
}

function drawTradeRoutes() {
  push();
  noFill();
  for (const r of tradeRoutes) {
    if (r.a.dead || r.b.dead) continue;
    const ax = r.a.x * CELL_SIZE, ay = r.a.y * CELL_SIZE;
    const bx = r.b.x * CELL_SIZE, by = r.b.y * CELL_SIZE;
    const dx = bx - ax, dy = by - ay;
    const dist = sqrt(dx*dx + dy*dy);
    if (dist < 0.1) continue;
    const nx = dx / dist, ny = dy / dist;
    const dashLen = 5, gapLen = 5, totalLen = dashLen + gapLen;
    const offset = (tick * 0.4) % totalLen;
    let pos = -offset;
    stroke(232, 169, 81, 110 * r.strength);
    strokeWeight(0.8);
    while (pos < dist) {
      const start = max(0, pos);
      const end = min(dist, pos + dashLen);
      if (end > start) line(ax + nx*start, ay + ny*start, ax + nx*end, ay + ny*end);
      pos += totalLen;
    }
  }
  pop();
}

function drawWars() {
  push();
  for (const w of wars) {
    if (w.a.dead || w.b.dead) continue;
    const ax = w.a.x * CELL_SIZE, ay = w.a.y * CELL_SIZE;
    const bx = w.b.x * CELL_SIZE, by = w.b.y * CELL_SIZE;
    const pulse = 0.5 + sin(tick * 0.35) * 0.5;
    stroke(232, 93, 117, 120 + pulse * 100);
    strokeWeight(1.5 + pulse * 0.8);
    line(ax, ay, bx, by);
    // 火花
    if (random() < 0.3) {
      const t = random();
      particles.push({
        x: lerp(ax, bx, t), y: lerp(ay, by, t),
        vx: random(-0.4, 0.4), vy: random(-0.4, 0.4),
        life: 20, maxLife: 20, type: 'war',
        size: random(1.5, 3), color: [232, 93, 117]
      });
    }
  }
  pop();
}

function drawSettlements() {
  push();
  for (const s of settlements) {
    if (s.dead) continue;
    const sx = s.x * CELL_SIZE + (s.shake > 0 ? random(-s.shake, s.shake) : 0);
    const sy = s.y * CELL_SIZE + (s.shake > 0 ? random(-s.shake, s.shake) : 0);
    const radius = max(2, sqrt(s.population) * 0.85);
    
    // 外光晕
    noStroke();
    fill(red(s.color), green(s.color), blue(s.color), 25);
    circle(sx, sy, radius * 3.5);
    fill(red(s.color), green(s.color), blue(s.color), 55);
    circle(sx, sy, radius * 2);
    
    // 主体
    if (s.glow > 0) {
      drawingContext.shadowBlur = s.glow * 0.8;
      drawingContext.shadowColor = s.color.toString();
    }
    fill(s.color);
    circle(sx, sy, radius * 1.4);
    drawingContext.shadowBlur = 0;
    
    // 高光
    fill(255, 255, 255, 100);
    circle(sx - radius * 0.25, sy - radius * 0.25, radius * 0.4);
    
    // 状态环
    if (s.diseases.length > 0) {
      noFill();
      stroke(111, 191, 115, 180);
      strokeWeight(1);
      circle(sx, sy, radius * 2.6);
    }
    if (s.memory.enemies.size > 0) {
      noFill();
      stroke(232, 93, 117, 200);
      strokeWeight(1);
      circle(sx, sy, radius * 3.1);
    }
    if (s.memory.allies.size > 0) {
      noFill();
      stroke(77, 208, 193, 130);
      strokeWeight(0.8);
      circle(sx, sy, radius * 3.6);
    }
    
    // 选中
    if (selectedSettlement === s) {
      noFill();
      stroke(232, 169, 81, 200);
      strokeWeight(1.5);
      circle(sx, sy, radius * 4 + sin(tick * 0.2) * 2);
    }
    
    // 标签
    if (showLabels && s.population > 60 && camera.zoom > 0.55) {
      noStroke();
      fill(0, 0, 0, 140);
      textAlign(CENTER, CENTER);
      textSize(8);
      const tw = textWidth(s.name);
      rect(sx - tw/2 - 3, sy - radius - 14, tw + 6, 11, 2);
      fill(232, 169, 81);
      text(s.name, sx, sy - radius - 8);
    }
  }
  pop();
}

function drawParticles() {
  push();
  blendMode(ADD);
  noStroke();
  for (const p of particles) {
    const a = (p.life / p.maxLife) * 200;
    fill(p.color[0], p.color[1], p.color[2], a);
    circle(p.x, p.y, p.size * (p.life / p.maxLife));
  }
  blendMode(BLEND);
  pop();
}

function drawVignette() {
  push();
  noFill();
  for (let i = 0; i < 60; i++) {
    stroke(0, 0, 0, i * 0.8);
    strokeWeight(1);
    rect(i, i, width - i*2, height - i*2);
  }
  pop();
}

// ===== UI 更新 =====
function updateUI() {
  let totalPop = 0, totalDiseases = 0;
  let avgTech = {agriculture:0, military:0, medicine:0, industry:0, seafaring:0};
  let avgTraits = {aggression:0, curiosity:0, tradeAff:0, fertility:0, adaptability:0, cohesion:0};
  let largestSettlement = null;
  let allyPairs = 0;
  
  for (const s of settlements) {
    if (s.dead) continue;
    totalPop += s.population;
    totalDiseases += s.diseases.length;
    for (const k in avgTech) avgTech[k] += s.tech[k];
    for (const k in avgTraits) avgTraits[k] += s.genome[k];
    allyPairs += s.memory.allies.size;
    if (!largestSettlement || s.population > largestSettlement.population) {
      largestSettlement = s;
    }
  }
  allyPairs = floor(allyPairs / 2);
  
  const n = max(1, settlements.length);
  for (const k in avgTech) avgTech[k] /= n;
  for (const k in avgTraits) avgTraits[k] /= n;
  
  document.getElementById('stats').innerHTML = `
    <div class="stat-row"><span class="label">Population</span><span class="value amber">${formatNum(totalPop)}</span></div>
    <div class="stat-row"><span class="label">Settlements</span><span class="value">${n}</span></div>
    <div class="stat-row"><span class="label">Trade Routes</span><span class="value teal">${tradeRoutes.length}</span></div>
    <div class="stat-row"><span class="label">Active Wars</span><span class="value red">${wars.length}</span></div>
    <div class="stat-row"><span class="label">Alliances</span><span class="value teal">${allyPairs}</span></div>
    <div class="stat-row"><span class="label">Diseases</span><span class="value green">${totalDiseases}</span></div>
    <div class="stat-row"><span class="label">Tick</span><span class="value">${tick}</span></div>
    <div class="stat-row"><span class="label">Largest City</span><span class="value amber" style="font-size:10px;">${largestSettlement ? largestSettlement.name : '—'}</span></div>
  `;
  
  const traitLabels = {aggression:'Aggression', curiosity:'Curiosity', tradeAff:'Trade Aff.', fertility:'Fertility', adaptability:'Adaptability', cohesion:'Cohesion'};
  let traitHTML = '';
  for (const k in avgTraits) {
    const v = avgTraits[k];
    traitHTML += `<div class="trait-bar"><div class="trait-label"><span>${traitLabels[k]}</span><span>${(v*100).toFixed(0)}%</span></div><div class="bar"><div class="fill" style="width:${v*100}%"></div></div></div>`;
  }
  document.getElementById('traits').innerHTML = traitHTML;
  
  let techHTML = '';
  for (const k in avgTech) {
    const v = avgTech[k];
    techHTML += `<div class="trait-bar"><div class="trait-label"><span>${k}</span><span>${v.toFixed(2)}</span></div><div class="bar"><div class="fill" style="width:${min(100, v*8)}%"></div></div></div>`;
  }
  document.getElementById('tech-stats').innerHTML = techHTML;
  
  const log = document.getElementById('event-log');
  log.innerHTML = events.slice(-25).reverse().map(e => 
    `<div class="entry ${e.type}"><span class="time">T${e.tick}</span>${e.text}</div>`
  ).join('');
  
  // 通知
  const container = document.getElementById('notifs');
  container.innerHTML = notifications.map(n => 
    `<div class="notif ${n.type}" style="opacity:${min(1, n.life/60)}">${n.text}</div>`
  ).join('');
  
  // 信息面板
  updateInfoPanel();
}

function updateInfoPanel() {
  const panel = document.getElementById('info-panel');
  if (!selectedSettlement || selectedSettlement.dead) {
    panel.style.display = 'none';
    return;
  }
  const s = selectedSettlement;
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="name">${s.name}</div>
    <div><span class="k">Population:</span> <span class="v">${floor(s.population)} / ${floor(s.popCap())}</span></div>
    <div><span class="k">Age:</span> <span class="v">${s.age} ticks</span></div>

    <div class="section">

    </div>
    <div class="section">
      <div><span class="k">Agri:</span> <span class="v">${s.tech.agriculture.toFixed(2)}</span> · <span class="k">Mil:</span> <span class="v">${s.tech.military.toFixed(2)}</span></div>
      <div><span class="k">Med:</span> <span class="v">${s.tech.medicine.toFixed(2)}</span> · <span class="k">Ind:</span> <span class="v">${s.tech.industry.toFixed(2)}</span> · <span class="k">Sea:</span> <span class="v">${s.tech.seafaring.toFixed(2)}</span></div>
    </div>
    <div class="section">
      <div><span class="k">Allies:</span> <span class="v">${s.memory.allies.size}</span> · <span class="k">Enemies:</span> <span class="v" style="color:var(--red)">${s.memory.enemies.size}</span> · <span class="k">Trade:</span> <span class="v">${s.memory.tradePartners.size}</span></div>
      ${s.diseases.length > 0 ? `<div style="color:var(--green);margin-top:3px;">Afflicted: ${s.diseases.map(d => d.name).join(', ')}</div>` : ''}
    </div>
    <div class="section" style="font-size:9.5px;">
      <div><span class="k">Aggr ${(s.genome.aggression*100).toFixed(0)}%</span> · <span class="k">Curio ${(s.genome.curiosity*100).toFixed(0)}%</span> · <span class="k">Trade ${(s.genome.tradeAff*100).toFixed(0)}%</span></div>
      <div><span class="k">Fert ${(s.genome.fertility*100).toFixed(0)}%</span> · <span class="k">Adapt ${(s.genome.adaptability*100).toFixed(0)}%</span> · <span class="k">Cohes ${(s.genome.cohesion*100).toFixed(0)}%</span></div>
    </div>
  `;
}

function formatNum(n) {
  if (n > 1000000) return (n/1000000).toFixed(2) + 'M';
  if (n > 1000) return (n/1000).toFixed(1) + 'k';
  return floor(n).toString();
}

// ===== p5.js 主流程 =====
function setup() {
  const container = document.getElementById('canvas-container');
  const cnv = createCanvas(container.clientWidth, container.clientHeight);
  cnv.parent('canvas-container');
  pixelDensity(1);
  setupCultureColors();
  resetSimulation();
}

function resetSimulation() {
  settlements = []; tradeRoutes = []; wars = [];
  particles = []; events = []; notifications = [];
  tick = 0;
  nextSettlementId = 0; nextDiseaseId = 0;
  selectedSettlement = null;
  generateWorld();
  spawnInitialSettlements(18);
  const fitZoom = min(width / (WORLD_W * CELL_SIZE), height / (WORLD_H * CELL_SIZE)) * 0.95;
  camera.zoom = fitZoom;
  camera.x = (width - WORLD_W * CELL_SIZE * camera.zoom) / 2;
  camera.y = (height - WORLD_H * CELL_SIZE * camera.zoom) / 2;
}

function draw() {
  // 仿真
  if (!paused) {
    for (let i = 0; i < simSpeed; i++) {
      tickSimulation();
    }
  }
  
  // 渲染
  background(8, 12, 20);
  
  // 背景星点装饰
  push();
  noStroke();
  for (let i = 0; i < 30; i++) {
    const x = (i * 137 + tick * 0.1) % width;
    const y = (i * 89) % height;
    fill(232, 169, 81, 20 + sin(tick * 0.02 + i) * 10);
    circle(x, y, 1);
  }
  pop();
  
  push();
  translate(camera.x, camera.y);
  scale(camera.zoom);
  
  drawWorld();
  drawOverlay();
  drawTradeRoutes();
  drawWars();
  drawSettlements();
  drawParticles();
  
  pop();
  
  // UI 更新（节流）
  if (frameCount % 6 === 0) updateUI();
}

function windowResized() {
  const container = document.getElementById('canvas-container');
  resizeCanvas(container.clientWidth, container.clientHeight);
}

// ===== 输入处理 =====
function mousePressed() {
  if (mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) return;
  mouseDownPos = {x: mouseX, y: mouseY};
  dragStart = null;
}

function mouseDragged() {
  if (!mouseDownPos) return;
  if (!dragStart) {
    const dx = mouseX - mouseDownPos.x, dy = mouseY - mouseDownPos.y;
    if (sqrt(dx*dx + dy*dy) > 3) {
      dragStart = {x: mouseDownPos.x, y: mouseDownPos.y};
      cameraStart = {x: camera.x, y: camera.y};
      selectedSettlement = null;
    }
  }
  if (dragStart) {
    camera.x = cameraStart.x + (mouseX - dragStart.x);
    camera.y = cameraStart.y + (mouseY - dragStart.y);
  }
}

function mouseReleased() {
  if (!dragStart && mouseDownPos) {
    // 点击 - 选择定居点
    const wx = (mouseX - camera.x) / camera.zoom;
    const wy = (mouseY - camera.y) / camera.zoom;
    let clicked = null;
    let minDist = Infinity;
    for (const s of settlements) {
      if (s.dead) continue;
      const sx = s.x * CELL_SIZE, sy = s.y * CELL_SIZE;
      const r = max(4, sqrt(s.population) * 0.85 + 3);
      const d = dist2(wx, wy, sx, sy);
      if (d < r && d < minDist) {
        minDist = d;
        clicked = s;
      }
    }
    selectedSettlement = clicked;
  }
  dragStart = null;
  mouseDownPos = null;
}

function mouseWheel(e) {
  const oldZoom = camera.zoom;
  const factor = e.delta > 0 ? 0.88 : 1.13;
  camera.zoom = constrain(camera.zoom * factor, 0.25, 6);
  const wx = (mouseX - camera.x) / oldZoom;
  const wy = (mouseY - camera.y) / oldZoom;
  camera.x = mouseX - wx * camera.zoom;
  camera.y = mouseY - wy * camera.zoom;
  return false;
}

function keyPressed() {
  if (key === ' ') {
    paused = !paused;
    document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
    document.getElementById('btn-pause').classList.toggle('active', paused);
    return false;
  } else if (key === 'r' || key === 'R') {
    resetSimulation();
  } else if (key === 'f' || key === 'F') {
    addForeignTribe();
  } else if (key === 'l' || key === 'L') {
    showLabels = !showLabels;
    document.getElementById('btn-labels').textContent = 'Labels: ' + (showLabels ? 'On' : 'Off');
  }
  const views = ['terrain', 'climate', 'resources', 'political', 'tech', 'disease', 'population'];
  const idx = parseInt(key) - 1;
  if (idx >= 0 && idx < views.length) {
    setViewMode(views[idx]);
  }
}

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('view-select').value = mode;
  buildWorldBuffer();
}

});

document.getElementById('view-select').addEventListener('change', (e) => {
  setViewMode(e.target.value);
});

document.getElementById('btn-labels').addEventListener('click', () => {
  showLabels = !showLabels;
  document.getElementById('btn-labels').textContent = 'Labels: ' + (showLabels ? 'On' : 'Off');
});

document.getElementById('btn-foreign').addEventListener('click', () => {
  addForeignTribe();
});

document.querySelectorAll('.event-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    triggerEvent(btn.dataset.event);
  });
});
</script>
</body>
</html>
