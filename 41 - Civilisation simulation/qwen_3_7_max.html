<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civilisation Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;color:#ddd;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;display:flex;height:100vh;width:100vw;}
#panel{width:320px;min-width:320px;background:#1a1a2e;border-right:2px solid #333;overflow-y:auto;padding:10px;font-size:11px;z-index:10;display:flex;flex-direction:column;gap:5px;}
#panel::-webkit-scrollbar{width:6px;}
#panel::-webkit-scrollbar-thumb{background:#555;border-radius:3px;}
#canvasWrap{flex:1;position:relative;overflow:hidden;}
canvas{display:block;}
h3{color:#7fdbca;margin:5px 0 3px;font-size:13px;border-bottom:1px solid #333;padding-bottom:3px;font-weight:600;}
.row{display:flex;align-items:center;gap:5px;margin:3px 0;}
.row label{flex:1;min-width:85px;font-size:11px;}
.row input[type=range]{flex:2;accent-color:#7fdbca;height:16px;}
.row span{min-width:35px;text-align:right;color:#aaa;font-size:10px;}
button{background:#2a2a4a;color:#ccc;border:1px solid #444;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;transition:all .15s;font-weight:500;}
button:hover{background:#3a3a6a;color:#fff;border-color:#7fdbca;}
button.active{background:#7fdbca;color:#111;border-color:#7fdbca;font-weight:600;}
.btn-row{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0;}
.disaster-btn{background:#4a1a1a;border-color:#833;font-size:10px;}
.disaster-btn:hover{background:#733;border-color:#f55;}
.positive-btn{background:#1a3a1a;border-color:#383;font-size:10px;}
.positive-btn:hover{background:#2a5a2a;border-color:#5f5;}
#stats{font-size:11px;line-height:1.6;color:#aaa;background:#111;padding:5px;border-radius:3px;border:1px solid #333;}
#stats b{color:#ddd;font-weight:600;}
#events{max-height:90px;overflow-y:auto;font-size:9px;color:#888;border:1px solid #333;padding:4px;border-radius:3px;background:#111;}
#events div{padding:2px 0;border-bottom:1px solid #222;}
#events::-webkit-scrollbar{width:4px;}
#events::-webkit-scrollbar-thumb{background:#444;border-radius:2px;}
.overlay-btn{font-size:10px;padding:3px 6px;}
#chartCanvas{width:100%;height:100px;border:1px solid #333;border-radius:4px;background:#111;}
.tooltip{position:relative;}
.tooltip::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:3px 8px;border-radius:4px;font-size:9px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.5);}
.tooltip:hover::after{opacity:1;}
#techTree{font-size:10px;max-height:70px;overflow-y:auto;border:1px solid #333;padding:4px;border-radius:3px;background:#111;line-height:1.5;}
.tech-unlocked{color:#7fdbca;font-weight:600;}
.tech-locked{color:#555;}
#tribeList{font-size:9px;max-height:80px;overflow-y:auto;border:1px solid #333;padding:4px;border-radius:3px;background:#111;}
.tribe-entry{padding:2px 0;border-bottom:1px solid #222;}
</style>
</head>
<body>
<div id="panel">
<h3>⚙ Controls</h3>
<div class="btn-row">
<button id="btnPause" onclick="togglePause()">⏸ Pause</button>
<button onclick="resetSim()">🔄 Reset</button>
<button onclick="stepOnce()">⏭ Step</button>
</div>
<div class="row tooltip" data-tip="Simulation speed multiplier (1× to 20×)">
<label>Speed</label><input type="range" id="speedSlider" min="1" max="20" value="1" oninput="simSpeed=+this.value;document.getElementById('speedVal').textContent=this.value+'×'"><span id="speedVal">1×</span>
</div>
<div class="row tooltip" data-tip="Maximum world population cap">
<label>Max Pop</label><input type="range" id="popSlider" min="100" max="2000" value="800" step="50" oninput="maxPop=+this.value;document.getElementById('popVal').textContent=this.value"><span id="popVal">800</span>
</div>
<h3>👥 Add Foreigners</h3>
<div class="row">
<label>Count</label><input type="range" id="foreignCount" min="10" max="100" value="25" oninput="document.getElementById('fcVal').textContent=this.value"><span id="fcVal">25</span>
</div>
<button onclick="addForeigners()">🚢 Add Foreign Group</button>
<h3>🌍 Map Overlays</h3>
<div class="btn-row">
<button class="overlay-btn" id="ovTerrain" onclick="toggleOverlay('terrain')">Terrain</button>
<button class="overlay-btn" id="ovClimate" onclick="toggleOverlay('climate')">Climate</button>
<button class="overlay-btn" id="ovResource" onclick="toggleOverlay('resource')">Resources</button>
<button class="overlay-btn" id="ovPop" onclick="toggleOverlay('pop')">Pop Density</button>
<button class="overlay-btn" id="ovBorders" onclick="toggleOverlay('borders')">Borders</button>
<button class="overlay-btn" id="ovTrade" onclick="toggleOverlay('trade')">Trade</button>
<button class="overlay-btn" id="ovWar" onclick="toggleOverlay('war')">Wars</button>
<button class="overlay-btn" id="ovDisease" onclick="toggleOverlay('disease')">Disease</button>
</div>
<h3>💥 Disasters & Events</h3>
<div class="btn-row">
<button class="disaster-btn" onclick="triggerDisaster('epidemic')">🦠 Epidemic</button>
<button class="disaster-btn" onclick="triggerDisaster('drought')">🏜 Drought</button>
<button class="disaster-btn" onclick="triggerDisaster('flood')">🌊 Flood</button>
<button class="disaster-btn" onclick="triggerDisaster('cold')">❄ Cold</button>
<button class="disaster-btn" onclick="triggerDisaster('heat')">🔥 Heat</button>
<button class="disaster-btn" onclick="triggerDisaster('insects')">🦗 Insects</button>
</div>
<h3>✨ Interventions</h3>
<div class="btn-row">
<button class="positive-btn" onclick="triggerDisaster('boredom')">🎭 Boredom</button>
<button class="disaster-btn" onclick="triggerDisaster('warmot')">⚔ War Desire</button>
<button class="positive-btn" onclick="triggerDisaster('trademot')">🤝 Trade Boost</button>
<button class="positive-btn" onclick="triggerDisaster('migrate')">🚶 Migration</button>
</div>
<h3>📊 Live Statistics</h3>
<div id="stats"></div>
<canvas id="chartCanvas" width="295" height="100"></canvas>
<h3>🔬 Technology Tree</h3>
<div id="techTree"></div>
<h3>👥 Active Tribes</h3>
<div id="tribeList"></div>
<h3>📜 Event Log</h3>
<div id="events"></div>
</div>
<div id="canvasWrap"></div>
<script>
// ===== GLOBALS =====
let W=180,H=140,TILE=4;
let world=[],agents=[],tribes=[],cities=[],wars=[],tradeRoutes=[];
let simSpeed=1,maxPop=800,paused=false,tick=0;
let camX=0,camY=0,zoom=2;
let overlay='terrain';
let activeDisasters=[];
let eventLog=[];
let statsHistory={pop:[],gdp:[],births:[],deaths:[],wars:[],trade:[],tech:[]};
let spatialGrid={};
const SPATIAL_CELL=12;
const TECHS=['Agriculture','Mining','Metallurgy','Construction','Medicine','Navigation','Military','Trade','Governance','Science','Engineering','Philosophy'];
let globalTech={};
TECHS.forEach(t=>globalTech[t]=0);
let foreignHue=0;
let totalBirths=0,totalDeaths=0,totalMigrations=0,totalTrades=0;

// ===== NOISE HELPERS =====
function fbm(x,y,oct,lac,gain){let v=0,a=1,f=1,mx=0;for(let i=0;i<oct;i++){v+=a*noise(x*f,y*f);mx+=a;a*=gain;f*=lac;}return v/mx;}

// ===== WORLD GENERATION =====
function generateWorld(){
  noiseSeed(floor(random(99999)));
  world=[];
  let nOff=random(1000);
  for(let y=0;y<H;y++){
    world[y]=[];
    for(let x=0;x<W;x++){
      let e=fbm(x*0.02+nOff,y*0.02+nOff,6,2.1,0.48);
      let m=fbm(x*0.015+nOff+500,y*0.015+nOff+500,4,2,0.5);
      let lat=abs(y-H/2)/(H/2);
      let temp=1-lat*0.8+fbm(x*0.01+nOff+999,y*0.01+nOff+999,3,2,0.5)*0.3-0.15;
      let terrain,climate;
      if(e<0.35){terrain='ocean';climate='oceanic';}
      else if(e<0.38){terrain='beach';climate=temp>0.6?'tropical':'temperate';}
      else if(e<0.55){
        if(temp>0.7)terrain=m>0.5?'jungle':'savanna';
        else if(temp>0.4)terrain=m>0.5?'forest':'grassland';
        else terrain=m>0.5?'taiga':'tundra';
        climate=temp>0.7?'tropical':temp>0.4?'temperate':'arctic';
      }else if(e<0.7){
        terrain=temp>0.5?'highland':'mountain';
        climate=temp>0.5?'temperate':'alpine';
      }else{terrain='mountain';climate='alpine';}
      let river=false,lake=false;
      let food=0,wood=0,ore=0,water=0;
      if(terrain==='ocean'){water=8;food=2;}
      else if(terrain==='jungle'){food=6;wood=8;water=4;}
      else if(terrain==='forest'){food=4;wood=7;water=3;}
      else if(terrain==='grassland'){food=7;wood=2;water=3;}
      else if(terrain==='savanna'){food=4;wood=1;water=2;}
      else if(terrain==='taiga'){food=2;wood=5;water=3;}
      else if(terrain==='tundra'){food=1;wood=1;water=2;}
      else if(terrain==='highland'){food=2;wood=2;ore=5;water=2;}
      else if(terrain==='mountain'){food=0;wood=0;ore=8;water=1;}
      else if(terrain==='beach'){food=3;wood=0;water=5;}
      world[y][x]={e,m,temp,terrain,climate,river,lake,food,wood,ore,water,
        maxFood:food,maxWood:wood,maxOre:ore,maxWater:water,
        popDensity:0,diseaseLevel:0,owner:-1};
    }
  }
  // Rivers
  for(let i=0;i<25;i++){
    let rx=floor(random(20,W-20)),ry=floor(random(10,H-10));
    if(world[ry][rx].e<0.5)continue;
    for(let s=0;s<80;s++){
      if(rx<0||rx>=W||ry<0||ry>=H)break;
      let t=world[ry][rx];
      if(t.terrain==='ocean'){t.river=true;break;}
      t.river=true;t.water=min(10,t.water+4);
      let bestE=t.e,bx=rx,by=ry;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        let nx=rx+dx,ny=ry+dy;
        if(nx>=0&&nx<W&&ny>=0&&ny<H&&world[ny][nx].e<bestE){bestE=world[ny][nx].e;bx=nx;by=ny;}
      }
      if(bx===rx&&by===ry)break;
      rx=bx;ry=by;
    }
  }
  // Lakes
  for(let i=0;i<8;i++){
    let lx=floor(random(15,W-15)),ly=floor(random(15,H-15));
    if(world[ly][lx].terrain==='ocean')continue;
    let r=floor(random(2,5));
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      let nx=lx+dx,ny=ly+dy;
      if(nx>=0&&nx<W&&ny>=0&&ny<H&&dx*dx+dy*dy<=r*r){
        world[ny][nx].lake=true;world[ny][nx].water=9;world[ny][nx].terrain='lake';
      }
    }
  }
}

// ===== SPATIAL HASH =====
function spatialKey(x,y){return floor(x/SPATIAL_CELL)+','+floor(y/SPATIAL_CELL);}
function rebuildSpatial(){
  spatialGrid={};
  for(let a of agents){
    if(a.dead)continue;
    let k=spatialKey(a.x,a.y);
    if(!spatialGrid[k])spatialGrid[k]=[];
    spatialGrid[k].push(a);
  }
}
function getNearby(x,y,r){
  let res=[];
  let cr=ceil(r/SPATIAL_CELL);
  let cx=floor(x/SPATIAL_CELL),cy=floor(y/SPATIAL_CELL);
  for(let dy=-cr;dy<=cr;dy++)for(let dx=-cr;dx<=cr;dx++){
    let k=(cx+dx)+','+(cy+dy);
    if(spatialGrid[k])for(let a of spatialGrid[k]){
      if(!a.dead&&dist(a.x,a.y,x,y)<=r)res.push(a);
    }
  }
  return res;
}

// ===== GENOME =====
function randomGenome(hue){
  return{
    intelligence:random(0.2,1),aggression:random(0.1,0.9),cooperation:random(0.1,1),
    mobility:random(0.2,1),charisma:random(0.1,1),diseaseRes:random(0.2,1),
    foodPref:random(0.3,1),woodPref:random(0.2,0.8),orePref:random(0.1,0.7),waterPref:random(0.3,1),
    hue:hue!==undefined?hue:random(360)
  };
}
function mutateGene(v,amt){return constrain(v+random(-amt,amt),0.05,1);}
function breedGenomes(a,b){
  let g={};
  for(let k in a)g[k]=mutateGene(random()<0.5?a[k]:b[k],0.08);
  g.hue=lerp(a.hue,b.hue,random(0.3,0.7));
  return g;
}

// ===== AGENT =====
function createAgent(x,y,genome,tribeId){
  return{
    x,y,vx:0,vy:0,genome:genome||randomGenome(),
    age:random(16,30),maxAge:random(55,85),
    hp:100,hunger:0,thirst:0,
    inv:{food:2,wood:0,ore:0,water:2},
    state:'idle',stateTimer:0,
    tribeId:tribeId!==undefined?tribeId:-1,
    cityId:-1,
    memory:[], // limited interaction memory
    diseased:false,diseaseTimer:0,
    dead:false,
    techPoints:0,
    targetX:-1,targetY:-1,
    role:'gatherer',
    animFrame:random(TWO_PI),
    kills:0,
    trades:0
  };
}

// ===== TRIBE =====
function createTribe(hue,name){
  let t={
    id:tribes.length,
    name:name||'Tribe '+String.fromCharCode(65+tribes.length%26)+(tribes.length>=26?floor(tribes.length/26):''),
    hue:hue!==undefined?hue:random(360),
    members:[],cities:[],
    tech:{},resources:{food:0,wood:0,ore:0,water:0},
    relations:{},// tribeId -> score
    leaderId:-1,
    culture:{aggression:0.5,cooperation:0.5,charisma:0.5},
    alive:true
  };
  TECHS.forEach(tk=>t.tech[tk]=0);
  return t;
}

// ===== CITY =====
function createCity(x,y,tribeId){
  return{
    id:cities.length,x,y,tribeId,
    name:'City '+String.fromCharCode(65+cities.length%26)+(cities.length>=26?floor(cities.length/26):''),
    pop:0,buildings:1,techLevel:0,
    storage:{food:20,wood:20,ore:10,water:20},
    hp:100
  };
}

// ===== INIT =====
function initSim(){
  generateWorld();
  agents=[];tribes=[];cities=[];wars=[];tradeRoutes=[];
  activeDisasters=[];eventLog=[];tick=0;
  totalBirths=0;totalDeaths=0;totalMigrations=0;totalTrades=0;
  statsHistory={pop:[],gdp:[],births:[],deaths:[],wars:[],trade:[],tech:[]};
  TECHS.forEach(t=>globalTech[t]=0);
  foreignHue=0;

  // Create initial tribes
  for(let i=0;i<5;i++){
    let t=createTribe(i*72);
    tribes.push(t);
  }

  // Place agents on land
  let placed=0;
  while(placed<100){
    let x=floor(random(10,W-10)),y=floor(random(10,H-10));
    let tile=world[y][x];
    if(tile.terrain!=='ocean'&&tile.terrain!=='mountain'&&tile.terrain!=='lake'){
      let tribeIdx=placed%5;
      let a=createAgent(x,y,null,tribeIdx);
      a.genome.hue=tribes[tribeIdx].hue+random(-15,15);
      agents.push(a);
      tribes[tribeIdx].members.push(a);
      placed++;
    }
  }
  // Set leaders
  for(let t of tribes){
    if(t.members.length>0){
      let best=t.members[0];
      for(let m of t.members)if(m.genome.charisma+m.genome.intelligence>best.genome.charisma+best.genome.intelligence)best=m;
      t.leaderId=agents.indexOf(best);
      updateTribeCulture(t);
    }
  }
  logEvent('🌍 Civilisation begins with 100 agents in 5 tribes.');
}

function updateTribeCulture(t){
  if(t.members.length===0)return;
  let ag=0,co=0,ch=0;
  for(let m of t.members){ag+=m.genome.aggression;co+=m.genome.cooperation;ch+=m.genome.charisma;}
  let n=t.members.length;
  t.culture.aggression=ag/n;t.culture.cooperation=co/n;t.culture.charisma=ch/n;
}

// ===== LOGGING =====
function logEvent(msg){
  eventLog.unshift({tick,msg});
  if(eventLog.length>60)eventLog.pop();
}

// ===== SIMULATION TICK =====
function simTick(){
  tick++;
  rebuildSpatial();

  // Reset pop density
  if(tick%10===1)for(let y=0;y<H;y++)for(let x=0;x<W;x++)world[y][x].popDensity=0;

  let births=0,deaths=0,migrations=0,tradeVol=0,warCount=0;

  // Update agents
  for(let a of agents){
    if(a.dead)continue;
    a.animFrame+=0.1;
    a.age+=0.01;
    a.hunger+=0.3-a.genome.mobility*0.1;
    a.thirst+=0.4;
    if(a.diseased){a.hp-=1.5*(1-a.genome.diseaseRes);a.diseaseTimer--;if(a.diseaseTimer<=0)a.diseased=false;}

    // Tile effects
    let tx=constrain(floor(a.x),0,W-1),ty=constrain(floor(a.y),0,H-1);
    let tile=world[ty][tx];
    if(tick%10===1)tile.popDensity++;

    // Disaster effects
    for(let d of activeDisasters){
      if(d.type==='drought'){tile.food=max(0,tile.food-0.05);tile.water=max(0,tile.water-0.05);}
      if(d.type==='flood'&&tile.e<0.45){a.hp-=0.5;}
      if(d.type==='cold'){a.hp-=0.3*(1-tile.temp);}
      if(d.type==='heat'){a.hp-=0.3*tile.temp;}
      if(d.type==='insects'){tile.food=max(0,tile.food-0.1);}
      if(d.type==='epidemic'&&!a.diseased&&random()<0.005*(1-a.genome.diseaseRes)){a.diseased=true;a.diseaseTimer=50;}
      if(d.type==='migrate')a.state='migrate';
    }

    // Death
    if(a.hp<=0||a.hunger>100||a.thirst>100||a.age>a.maxAge){
      a.dead=true;deaths++;totalDeaths++;
      if(a.tribeId>=0&&tribes[a.tribeId])tribes[a.tribeId].members=tribes[a.tribeId].members.filter(m=>m!==a);
      continue;
    }

    // State machine
    a.stateTimer--;
    if(a.stateTimer<=0){
      // Decide next action
      let r=random();
      if(a.hunger>60)a.state='gather_food';
      else if(a.thirst>60)a.state='gather_water';
      else if(r<0.3)a.state='gather';
      else if(r<0.45&&a.tribeId>=0)a.state='trade';
      else if(r<0.55)a.state='migrate';
      else if(r<0.65&&a.tribeId>=0)a.state='build';
      else if(r<0.75&&a.age>18&&a.age<50)a.state='reproduce';
      else if(r<0.85&&a.tribeId>=0&&tribes[a.tribeId]&&tribes[a.tribeId].culture.aggression>0.5)a.state='war';
      else a.state='idle';
      a.stateTimer=floor(random(10,40));
    }

    // Execute state
    let spd=a.genome.mobility*0.5;
    switch(a.state){
      case 'gather_food':
        if(tile.food>0.5){tile.food-=0.5;a.inv.food+=0.5;a.hunger-=5;}
        else{a.x+=random(-1,1)*spd;a.y+=random(-1,1)*spd;}
        break;
      case 'gather_water':
        if(tile.water>1){a.inv.water+=0.5;a.thirst-=8;}
        else{a.x+=random(-1,1)*spd;a.y+=random(-1,1)*spd;}
        break;
      case 'gather':
        if(tile.wood>0.5&&random()<a.genome.woodPref){tile.wood-=0.3;a.inv.wood+=0.3;}
        else if(tile.ore>0.5&&random()<a.genome.orePref){tile.ore-=0.2;a.inv.ore+=0.2;}
        else if(tile.food>0.5){tile.food-=0.3;a.inv.food+=0.3;}
        a.x+=random(-1,1)*spd*0.5;a.y+=random(-1,1)*spd*0.5;
        break;
      case 'trade':{
        let nearby=getNearby(a.x,a.y,5);
        let partner=nearby.find(n=>n!==a&&!n.dead&&n.tribeId!==a.tribeId);
        if(!partner)partner=nearby.find(n=>n!==a&&!n.dead);
        if(partner){
          // Trade logic
          let give=a.inv.food>2?'food':a.inv.wood>1?'wood':a.inv.ore>1?'ore':null;
          let need=partner.inv.food<1?'food':partner.inv.wood<1?'wood':null;
          if(give&&need){a.inv[give]-=0.5;partner.inv[need]+=0.5;tradeVol++;totalTrades++;a.trades++;
            if(a.memory.length<10)a.memory.push({id:agents.indexOf(partner),type:'trade',tick});
          }
        }
        a.x+=random(-1,1)*spd*0.3;a.y+=random(-1,1)*spd*0.3;
        break;}
      case 'migrate':{
        // Move toward better tiles
        let bestScore=-999,bx=a.x,by=a.y;
        for(let i=0;i<5;i++){
          let nx=a.x+random(-8,8),ny=a.y+random(-8,8);
          let ntx=constrain(floor(nx),0,W-1),nty=constrain(floor(ny),0,H-1);
          let nt=world[nty][ntx];
          if(nt.terrain==='ocean'||nt.terrain==='mountain')continue;
          let sc=nt.food*a.genome.foodPref+nt.wood*a.genome.woodPref+nt.ore*a.genome.orePref+nt.water*a.genome.waterPref;
          if(sc>bestScore){bestScore=sc;bx=nx;by=ny;}
        }
        a.x=lerp(a.x,bx,0.1*spd);a.y=lerp(a.y,by,0.1*spd);
        migrations++;totalMigrations++;
        break;}
      case 'build':
        if(a.tribeId>=0&&a.inv.wood>3&&a.inv.ore>1){
          let hasCity=cities.find(c=>c.tribeId===a.tribeId&&dist(c.x,c.y,a.x,a.y)<15);
          if(!hasCity&&tribes[a.tribeId].members.length>8&&random()<0.02){
            let c=createCity(floor(a.x),floor(a.y),a.tribeId);
            cities.push(c);
            tribes[a.tribeId].cities.push(c);
            a.inv.wood-=3;a.inv.ore-=1;
            logEvent('🏙 '+tribes[a.tribeId].name+' founded '+c.name+'!');
          }
        }
        a.x+=random(-0.5,0.5);a.y+=random(-0.5,0.5);
        break;
      case 'reproduce':
        if(a.hunger<40&&a.thirst<40&&agents.filter(aa=>!aa.dead).length<maxPop){
          let nearby=getNearby(a.x,a.y,4);
          let mate=nearby.find(n=>n!==a&&!n.dead&&n.age>16&&n.tribeId===a.tribeId);
          if(mate&&random()<0.05){
            let child=createAgent(a.x+random(-2,2),a.y+random(-2,2),breedGenomes(a.genome,mate.genome),a.tribeId);
            child.age=0;
            agents.push(child);
            if(a.tribeId>=0)tribes[a.tribeId].members.push(child);
            births++;totalBirths++;
          }
        }
        break;
      case 'war':
        if(a.tribeId>=0){
          let enemies=agents.filter(e=>!e.dead&&e.tribeId!==a.tribeId&&dist(e.x,e.y,a.x,a.y)<12);
          if(enemies.length>0){
            let e=enemies[0];
            let atk=a.genome.aggression*random(5,15);
            let def=e.genome.aggression*random(3,10);
            e.hp-=max(0,atk-def);
            a.hp-=max(0,def*0.3);
            if(e.hp<=0)a.kills++;
            if(a.memory.length<10)a.memory.push({id:agents.indexOf(e),type:'war',tick});
            // Track war
            let wKey=min(a.tribeId,e.tribeId)+'-'+max(a.tribeId,e.tribeId);
            if(!wars.find(w=>w.key===wKey)){
              wars.push({key:wKey,t1:a.tribeId,t2:e.tribeId,timer:100});
              warCount++;
              logEvent('⚔ War: '+tribes[a.tribeId]?.name+' vs '+tribes[e.tribeId]?.name);
            }
          }else{
            a.x+=random(-1,1)*spd;a.y+=random(-1,1)*spd;
          }
        }
        break;
      default:
        a.x+=random(-0.5,0.5)*spd;a.y+=random(-0.5,0.5)*spd;
    }

    // Consume food/water
    if(a.hunger>30&&a.inv.food>0){a.inv.food-=0.3;a.hunger-=10;}
    if(a.thirst>30&&a.inv.water>0){a.inv.water-=0.3;a.thirst-=10;}

    // Clamp position
    a.x=constrain(a.x,1,W-2);
    a.y=constrain(a.y,1,H-2);

    // Tech points
    a.techPoints+=a.genome.intelligence*0.01;
    if(a.tribeId>=0&&tribes[a.tribeId]){
      let coopBonus=tribes[a.tribeId].culture.cooperation;
      a.techPoints+=coopBonus*0.005;
    }

    // Tile ownership
    if(a.tribeId>=0)tile.owner=a.tribeId;
  }

  // Update tribes
  for(let t of tribes){
    if(!t.alive)continue;
    t.members=t.members.filter(m=>!m.dead);
    if(t.members.length===0){t.alive=false;logEvent('💀 '+t.name+' has perished.');continue;}

    // Elect leader
    if(tick%100===0){
      let best=t.members[0];
      for(let m of t.members)if(m.genome.charisma+m.genome.intelligence>best.genome.charisma+best.genome.intelligence)best=m;
      t.leaderId=agents.indexOf(best);
    }
    updateTribeCulture(t);

    // Tech progress
    let totalTech=0;
    for(let m of t.members)totalTech+=m.techPoints;
    let coopMult=1+t.culture.cooperation*0.5;
    for(let tk of TECHS){
      let cost=(t.tech[tk]+1)*50;
      if(totalTech>cost&&random()<0.01*coopMult){
        t.tech[tk]++;
        globalTech[tk]=max(globalTech[tk],t.tech[tk]);
        if(t.tech[tk]===1)logEvent('🔬 '+t.name+' discovered '+tk+'!');
      }
    }

    // Resource pooling
    t.resources={food:0,wood:0,ore:0,water:0};
    for(let m of t.members){
      t.resources.food+=m.inv.food;t.resources.wood+=m.inv.wood;
      t.resources.ore+=m.inv.ore;t.resources.water+=m.inv.water;
    }
  }

  // Update cities
  for(let c of cities){
    let t=tribes[c.tribeId];
    if(!t||!t.alive)continue;
    c.pop=t.members.filter(m=>dist(m.x,m.y,c.x,c.y)<15).length;
    if(c.pop>5)c.buildings=min(20,c.buildings+0.01);
    c.storage.food+=c.pop*0.1;c.storage.wood+=c.pop*0.05;
    c.techLevel=Object.values(t.tech).reduce((a,b)=>a+b,0);
  }

  // Update wars
  for(let i=wars.length-1;i>=0;i--){
    wars[i].timer--;
    if(wars[i].timer<=0)wars.splice(i,1);
  }

  // Trade routes
  tradeRoutes=[];
  for(let c1 of cities)for(let c2 of cities){
    if(c1.tribeId===c2.tribeId&&c1.id<c2.id&&dist(c1.x,c1.y,c2.x,c2.y)<60){
      tradeRoutes.push({x1:c1.x,y1:c1.y,x2:c2.x,y2:c2.y});
    }
  }
  // Inter-tribe trade routes
  for(let c1 of cities)for(let c2 of cities){
    if(c1.tribeId!==c2.tribeId&&c1.id<c2.id&&dist(c1.x,c1.y,c2.x,c2.y)<40){
      let t1=tribes[c1.tribeId],t2=tribes[c2.tribeId];
      if(t1&&t2&&t1.culture.cooperation>0.4&&t2.culture.cooperation>0.4){
        tradeRoutes.push({x1:c1.x,y1:c1.y,x2:c2.x,y2:c2.y,inter:true});
      }
    }
  }

  // Disaster timers
  for(let i=activeDisasters.length-1;i>=0;i--){
    activeDisasters[i].timer--;
    if(activeDisasters[i].timer<=0)activeDisasters.splice(i,1);
  }

  // Resource regeneration
  if(tick%20===0){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      let t=world[y][x];
      t.food=min(t.maxFood,t.food+0.1);
      t.wood=min(t.maxWood,t.wood+0.05);
      t.ore=min(t.maxOre,t.ore+0.02);
      t.water=min(t.maxWater,t.water+0.1);
      t.diseaseLevel=max(0,t.diseaseLevel-0.01);
    }
  }

  // Form new tribes from unaffiliated or large splits
  if(tick%200===0){
    for(let t of tribes){
      if(!t.alive||t.members.length<20)continue;
      if(random()<0.1*t.culture.aggression){
        let nt=createTribe(t.hue+random(-30,30));
        let splitCount=floor(t.members.length*0.3);
        for(let i=0;i<splitCount;i++){
          let m=t.members.pop();
          m.tribeId=nt.id;
          nt.members.push(m);
        }
        tribes.push(nt);
        logEvent('🔱 '+nt.name+' split from '+t.name+'!');
      }
    }
  }

  // Record stats
  let alive=agents.filter(a=>!a.dead);
  let gdp=alive.reduce((s,a)=>s+a.inv.food+a.inv.wood*2+a.inv.ore*3,0);
  let avgTech=Object.values(globalTech).reduce((a,b)=>a+b,0);
  statsHistory.pop.push(alive.length);
  statsHistory.gdp.push(gdp);
  statsHistory.births.push(births);
  statsHistory.deaths.push(deaths);
  statsHistory.wars.push(wars.length);
  statsHistory.trade.push(tradeVol);
  statsHistory.tech.push(avgTech);
  for(let k in statsHistory)if(statsHistory[k].length>200)statsHistory[k].shift();
}

// ===== DISASTERS =====
function triggerDisaster(type){
  let dur=type==='boredom'||type==='warmot'||type==='trademot'||type==='migrate'?150:200;
  activeDisasters.push({type,timer:dur});
  logEvent('⚠ '+type.toUpperCase()+' strikes the world!');
  if(type==='warmot')for(let a of agents)if(!a.dead)a.genome.aggression=min(1,a.genome.aggression+0.2);
  if(type==='trademot')for(let a of agents)if(!a.dead)a.genome.cooperation=min(1,a.genome.cooperation+0.2);
  if(type==='boredom')for(let a of agents)if(!a.dead)a.genome.mobility=min(1,a.genome.mobility+0.15);
  if(type==='migrate')for(let a of agents)if(!a.dead)a.state='migrate';
}

// ===== FOREIGNERS =====
function addForeigners(){
  let count=+document.getElementById('foreignCount').value;
  foreignHue=(foreignHue+137)%360;
  let t=createTribe(foreignHue,'Foreigners '+(tribes.length+1));
  tribes.push(t);
  // Find a coastal or edge location
  let sx=random()<0.5?random(5,15):random(W-15,W-5);
  let sy=random(10,H-10);
  for(let i=0;i<count;i++){
    let g=randomGenome(foreignHue+random(-10,10));
    g.intelligence=random(0.5,1);g.aggression=random(0.3,0.9);
    g.orePref=random(0.5,1);g.foodPref=random(0.3,0.7);
    let a=createAgent(sx+random(-5,5),sy+random(-5,5),g,t.id);
    a.inv.ore=3;a.inv.wood=2;
    agents.push(a);
    t.members.push(a);
  }
  t.leaderId=agents.indexOf(t.members[0]);
  updateTribeCulture(t);
  logEvent('🚢 '+count+' foreigners arrived with different culture!');
}

// ===== UI HELPERS =====
function togglePause(){paused=!paused;document.getElementById('btnPause').textContent=paused?'▶ Play':'⏸ Pause';}
function stepOnce(){if(paused)simTick();}
function resetSim(){initSim();}
function toggleOverlay(ov){
  overlay=overlay===ov?'terrain':ov;
  document.querySelectorAll('.overlay-btn').forEach(b=>b.classList.remove('active'));
  let btn=document.getElementById('ov'+ov.charAt(0).toUpperCase()+ov.slice(1));
  if(btn)btn.classList.add('active');
}

// ===== P5.JS =====
let dragging=false,dragX,dragY;

function setup(){
  let cw=document.getElementById('canvasWrap').clientWidth;
  let ch=document.getElementById('canvasWrap').clientHeight;
  let c=createCanvas(cw,ch);
  c.parent('canvasWrap');
  camX=W*TILE*zoom/2-cw/2;
  camY=H*TILE*zoom/2-ch/2;
  initSim();
  toggleOverlay('terrain');
  document.getElementById('ovTerrain').classList.add('active');
}

function windowResized(){
  let cw=document.getElementById('canvasWrap').clientWidth;
  let ch=document.getElementById('canvasWrap').clientHeight;
  resizeCanvas(cw,ch);
}

function draw(){
  background(20);
  if(!paused){
    for(let i=0;i<simSpeed;i++)simTick();
  }

  push();
  translate(-camX,-camY);
  scale(zoom);

  let ts=TILE;
  let sx=max(0,floor(camX/zoom/ts)-1);
  let sy=max(0,floor(camY/zoom/ts)-1);
  let ex=min(W,ceil((camX+width)/zoom/ts)+1);
  let ey=min(H,ceil((camY+height)/zoom/ts)+1);

  // Draw terrain
  noStroke();
  for(let y=sy;y<ey;y++){
    for(let x=sx;x<ex;x++){
      let t=world[y][x];
      let c;
      if(overlay==='terrain'){
        switch(t.terrain){
          case'ocean':c=color(30,80,160);break;
          case'beach':c=color(210,190,130);break;
          case'grassland':c=color(80,160,60);break;
          case'forest':c=color(30,110,30);break;
          case'jungle':c=color(20,130,50);break;
          case'savanna':c=color(180,170,80);break;
          case'taiga':c=color(50,90,60);break;
          case'tundra':c=color(180,190,200);break;
          case'highland':c=color(130,110,80);break;
          case'mountain':c=color(100,90,80);break;
          case'lake':c=color(40,100,180);break;
          default:c=color(60,60,60);
        }
      }else if(overlay==='climate'){
        let v=t.temp*255;
        c=color(v,100,255-v);
      }else if(overlay==='resource'){
        let r=t.food*25,g=t.wood*25,b=t.ore*30;
        c=color(r,g,b);
      }else if(overlay==='pop'){
        let v=min(255,t.popDensity*30);
        c=color(v,v*0.3,0);
      }else if(overlay==='disease'){
        let v=min(255,t.diseaseLevel*200);
        c=color(v,0,v*0.5);
      }else{
        switch(t.terrain){
          case'ocean':c=color(30,80,160);break;
          case'lake':c=color(40,100,180);break;
          default:c=color(60+t.e*80,80+t.m*60,40);
        }
      }
      fill(c);
      rect(x*ts,y*ts,ts,ts);

      // Rivers
      if(t.river&&overlay!=='resource'){fill(50,120,200,150);rect(x*ts,y*ts,ts,ts);}
    }
  }

  // Borders overlay
  if(overlay==='borders'){
    strokeWeight(0.5);
    for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){
      let t=world[y][x];
      if(t.owner>=0){
        let tr=tribes[t.owner];
        if(tr&&tr.alive){
          noFill();stroke(tr.hue%360,70,70,120);
          // Check neighbors
          if(x>0&&world[y][x-1].owner!==t.owner)line(x*ts,y*ts,x*ts,(y+1)*ts);
          if(y>0&&world[y-1][x].owner!==t.owner)line(x*ts,y*ts,(x+1)*ts,y*ts);
        }
      }
    }
    noStroke();
  }

  // Trade routes
  if(overlay==='trade'||overlay==='terrain'){
    for(let tr of tradeRoutes){
      stroke(tr.inter?color(255,200,50,80):color(150,200,150,60));
      strokeWeight(0.5);
      let dash=tick%20<10;
      if(dash)line(tr.x1*ts+ts/2,tr.y1*ts+ts/2,tr.x2*ts+ts/2,tr.y2*ts+ts/2);
    }
    noStroke();
  }

  // Wars overlay
  if(overlay==='war'){
    for(let w of wars){
      let t1=tribes[w.t1],t2=tribes[w.t2];
      if(t1&&t2&&t1.members.length>0&&t2.members.length>0){
        let m1=t1.members[0],m2=t2.members[0];
        stroke(255,50,50,150);strokeWeight(1);
        line(m1.x*ts,m1.y*ts,m2.x*ts,m2.y*ts);
      }
    }
    noStroke();
  }

  // Draw cities
  for(let c of cities){
    let t=tribes[c.tribeId];
    if(!t||!t.alive)continue;
    if(c.x<sx-5||c.x>ex+5||c.y<sy-5||c.y>ey+5)continue;
    fill(t.hue%360,60,80);
    stroke(255,200);strokeWeight(0.3);
    let sz=2+c.buildings*0.3;
    rect(c.x*ts-sz/2,c.y*ts-sz/2,sz,sz);
    if(zoom>1.5){
      noStroke();fill(255);textSize(2);textAlign(CENTER);
      text(c.name,c.x*ts,c.y*ts-sz/2-1);
    }
  }
  noStroke();

  // Draw agents (simplified for performance)
  let aliveAgents=agents.filter(a=>!a.dead);
  let drawAll=aliveAgents.length<500||zoom>2;
  for(let a of aliveAgents){
    if(a.x<sx-2||a.x>ex+2||a.y<sy-2||a.y>ey+2)continue;
    if(!drawAll&&random()>0.5)continue;
    let hue=a.genome.hue%360;
    let sat=a.diseased?90:60;
    let bri=a.hp>50?80:50;
    fill(hue,sat,bri);
    let sz=drawAll?0.8:0.5;
    let wobble=sin(a.animFrame)*0.2;
    ellipse(a.x*ts+wobble,a.y*ts,sz,sz);
  }

  pop();

  // Update UI every 15 frames
  if(frameCount%15===0)updateUI();
}

function mouseDragged(){
  if(mouseX>320){camX-=mouseX-pmouseX;camY-=mouseY-pmouseY;}
}
function mouseWheel(e){
  if(mouseX>320){
    let oldZoom=zoom;
    zoom*=e.delta>0?0.9:1.1;
    zoom=constrain(zoom,0.5,8);
    let mx=mouseX-320,my=mouseY;
    camX=mx+(camX+mx)*(zoom/oldZoom-1)+camX*(zoom/oldZoom-1);
    camY=my+(camY+my)*(zoom/oldZoom-1)+camY*(zoom/oldZoom-1);
    // Simplified zoom toward mouse
    camX+=(mouseX-320)*(1-zoom/oldZoom)*0.5;
    camY+=mouseY*(1-zoom/oldZoom)*0.5;
  }
}

// ===== UI UPDATE =====
function updateUI(){
  let alive=agents.filter(a=>!a.dead);
  let tribesAlive=tribes.filter(t=>t.alive);
  let avgTraits={int:0,agg:0,coop:0,mob:0,cha:0,dis:0};
  for(let a of alive){
    avgTraits.int+=a.genome.intelligence;avgTraits.agg+=a.genome.aggression;
    avgTraits.coop+=a.genome.cooperation;avgTraits.mob+=a.genome.mobility;
    avgTraits.cha+=a.genome.charisma;avgTraits.dis+=a.genome.diseaseRes;
  }
  let n=max(1,alive.length);
  for(let k in avgTraits)avgTraits[k]=(avgTraits[k]/n).toFixed(2);

  let gdp=alive.reduce((s,a)=>s+a.inv.food+a.inv.wood*2+a.inv.ore*3,0);
  let totalTech=Object.values(globalTech).reduce((a,b)=>a+b,0);

  document.getElementById('stats').innerHTML=
    `<b>Pop:</b> ${alive.length}/${maxPop} | <b>Tribes:</b> ${tribesAlive.length} | <b>Cities:</b> ${cities.length}<br>`+
    `<b>GDP:</b> ${floor(gdp)} | <b>Tech:</b> ${totalTech} | <b>Tick:</b> ${tick}<br>`+
    `<b>Births:</b> ${totalBirths} | <b>Deaths:</b> ${totalDeaths}<br>`+
    `<b>Migrations:</b> ${totalMigrations} | <b>Trades:</b> ${totalTrades}<br>`+
    `<b>Wars:</b> ${wars.length} | <b>Disasters:</b> ${activeDisasters.length}<br>`+
    `<b>INT:</b>${avgTraits.int} <b>AGG:</b>${avgTraits.agg} <b>COO:</b>${avgTraits.coop}<br>`+
    `<b>MOB:</b>${avgTraits.mob} <b>CHA:</b>${avgTraits.cha} <b>RES:</b>${avgTraits.dis}`;

  // Tribe list
  let tribeHtml='';
  for(let t of tribesAlive){
    let color=`hsl(${t.hue},60%,60%)`;
    let techs=Object.values(t.tech).reduce((a,b)=>a+b,0);
    tribeHtml+=`<div class="tribe-entry"><span style="color:${color}">■</span> <b>${t.name}</b> (${t.members.length}) Tech:${techs}</div>`;
  }
  document.getElementById('tribeList').innerHTML=tribeHtml;

  // Events
  let evHtml='';
  for(let i=0;i<min(20,eventLog.length);i++){
    evHtml+=`<div>[${eventLog[i].tick}] ${eventLog[i].msg}</div>`;
  }
  document.getElementById('events').innerHTML=evHtml;

  // Tech tree
  let techHtml='';
  for(let tk of TECHS){
    let v=globalTech[tk];
    techHtml+=`<span class="${v>0?'tech-unlocked':'tech-locked'}">${v>0?'✓':'○'}${tk}(${v}) </span>`;
  }
  document.getElementById('techTree').innerHTML=techHtml;

  // Chart
  drawChart();
}

function drawChart(){
  let cc=document.getElementById('chartCanvas');
  let ctx=cc.getContext('2d');
  let w=cc.width,h=cc.height;
  ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);

  let datasets=[
    {data:statsHistory.pop,color:'#4f4',label:'Pop'},
    {data:statsHistory.gdp,color:'#ff4',label:'GDP'},
    {data:statsHistory.tech,color:'#4ff',label:'Tech'}
  ];

  for(let ds of datasets){
    if(ds.data.length<2)continue;
    let mx=max(...ds.data,1);
    ctx.strokeStyle=ds.color;ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<ds.data.length;i++){
      let x=i/(ds.data.length-1)*w;
      let y=h-ds.data[i]/mx*(h-10)-5;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  ctx.fillStyle='#888';ctx.font='9px sans-serif';
  ctx.fillText('Pop',5,12);ctx.fillStyle='#ff4';ctx.fillText('GDP',40,12);
  ctx.fillStyle='#4ff';ctx.fillText('Tech',75,12);
}
