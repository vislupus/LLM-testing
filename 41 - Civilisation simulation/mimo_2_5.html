<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌍 Civilization Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0a1a;font-family:'Segoe UI',Tahoma,sans-serif;color:#ddd;font-size:12px;user-select:none}
#ctrl{position:fixed;top:8px;left:8px;width:195px;background:rgba(8,8,25,.92);border:1px solid rgba(80,80,180,.25);border-radius:8px;padding:10px;z-index:10;max-height:calc(100vh - 16px);overflow-y:auto;scrollbar-width:thin}
#ctrl::-webkit-scrollbar{width:4px}
#ctrl::-webkit-scrollbar-thumb{background:rgba(80,80,180,.3);border-radius:2px}
#stat{position:fixed;top:8px;right:8px;width:210px;background:rgba(8,8,25,.92);border:1px solid rgba(80,80,180,.25);border-radius:8px;padding:10px;z-index:10;max-height:calc(100vh - 16px);overflow-y:auto;scrollbar-width:thin}
#stat::-webkit-scrollbar{width:4px}
#stat::-webkit-scrollbar-thumb{background:rgba(80,80,180,.3);border-radius:2px}
#notifs{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.nf{background:rgba(15,15,40,.95);border:1px solid rgba(80,120,255,.35);border-radius:5px;padding:5px 12px;font-size:11px;max-width:420px;text-align:center;animation:fi .3s,fo .6s 3.8s forwards;white-space:nowrap}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fo{to{opacity:0}}
h3{color:#7878bb;margin:6px 0 3px;font-size:12px;border-bottom:1px solid rgba(80,80,180,.15);padding-bottom:2px}
.sec{margin-bottom:6px}
button{background:rgba(35,35,70,.8);color:#aaa;border:1px solid rgba(70,70,140,.35);border-radius:3px;padding:3px 7px;margin:1px;cursor:pointer;font-size:10px;transition:all .12s}
button:hover{background:rgba(55,55,110,.9);color:#fff;border-color:rgba(110,110,200,.5)}
button.on{background:rgba(70,55,160,.65);color:#fff;border-color:rgba(130,110,255,.5)}
button.dng{border-color:rgba(180,60,60,.35)}
button.dng:hover{background:rgba(110,25,25,.8);border-color:rgba(255,90,90,.5)}
.sr{display:flex;justify-content:space-between;padding:1px 0}
.sl{color:#777}.sv{color:#bbb;font-weight:600}
.bar{height:3px;background:rgba(35,35,70,.8);border-radius:2px;margin:1px 0;overflow:hidden}
.bf{height:100%;border-radius:2px;transition:width .3s}
select,input[type=range]{background:rgba(25,25,55,.9);color:#aaa;border:1px solid rgba(70,70,140,.35);border-radius:3px;padding:2px;font-size:10px;width:100%}
input[type=range]{-webkit-appearance:none;height:4px;border:none;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#6666aa;cursor:pointer}
.ov-row{display:flex;flex-wrap:wrap;gap:2px;margin:2px 0}
.ov-btn{font-size:9px;padding:2px 5px}
#det{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(8,8,25,.92);border:1px solid rgba(80,80,180,.25);border-radius:8px;padding:10px;z-index:10;min-width:350px;max-width:500px;display:none}
#det .close{position:absolute;top:4px;right:8px;cursor:pointer;color:#666;font-size:14px}
#det .close:hover{color:#fff}
#legend{position:fixed;bottom:8px;right:8px;background:rgba(8,8,25,.85);border:1px solid rgba(80,80,180,.2);border-radius:6px;padding:6px 10px;z-index:10;font-size:10px}
#legend span{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:middle}
</style>
</head>
<body>

<div id="ctrl"></div>
<div id="stat"></div>
<div id="notifs"></div>
<div id="det"><span class="close" onclick="this.parentElement.style.display='none'">✕</span><div id="det-body"></div></div>
<div id="legend"></div>

<script>
/* ================================================================
   CIVILIZATION SIMULATION — Single-file Web App
   ================================================================ */

// ────────────── CONFIGURATION ──────────────
const CFG = {
  WW: 380, WH: 260,
  TICK_RATE: 0.15,
  MAX_SETTLEMENTS: 90,
  START_SETTLEMENTS: 10,
  GROWTH_RATE: 0.008,
  MIGRATION_CHANCE: 0.0003,
  TRADE_RANGE: 30,
  WAR_RANGE: 18,
  DISEASE_SPREAD: 0.003,
  DISEASE_MORTALITY: 0.004,
  RESEARCH_RATE: 0.005,
  NEW_SETTLEMENT_POP: 120,
  TRAIT_DRIFT: 0.002,
  MAX_POP: 8000,
  EVENT_INTERVAL: 300,
};

// ────────────── TERRAIN ──────────────
const T = {DEEP:0,SHALLOW:1,BEACH:2,PLAINS:3,FOREST:4,HILLS:5,MOUNTAIN:6,SNOW:7,DESERT:8,TUNDRA:9,JUNGLE:10,SWAMP:11};
const TC = [
  [20,42,90],[32,62,120],[185,170,115],[112,148,65],[38,92,35],
  [120,110,82],[100,90,80],[220,220,232],[192,172,110],[172,182,172],[28,72,24],[52,72,42]
];

// ────────────── TECHNOLOGY TREE ──────────────
const TECH = {
  fire:       {n:"Fire",             c:12, r:[],                     f:{warm:1}},
  tools:      {n:"Stone Tools",      c:16, r:[],                     f:{gather:1.15}},
  pottery:    {n:"Pottery",          c:22, r:['fire'],               f:{store:1.2}},
  farming:    {n:"Agriculture",      c:42, r:['pottery'],            f:{food:1.4}},
  husbandry:  {n:"Animal Husbandry", c:36, r:['farming'],            f:{food:1.15}},
  weaving:    {n:"Weaving",          c:28, r:['farming'],            f:{trade:1.1}},
  metalwork:  {n:"Metallurgy",       c:58, r:['tools','fire'],       f:{mil:1.25,tools:1.15}},
  writing:    {n:"Writing",          c:52, r:['pottery'],            f:{res:1.3}},
  sailing:    {n:"Sailing",          c:48, r:['weaving'],            f:{trade:1.25}},
  currency:   {n:"Currency",         c:54, r:['writing','metalwork'],f:{trade:1.4}},
  math:       {n:"Mathematics",      c:58, r:['writing'],            f:{res:1.2}},
  engineering:{n:"Engineering",      c:68, r:['math','metalwork'],   f:{build:1.4}},
  medicine:   {n:"Medicine",         c:62, r:['writing'],            f:{health:1.4}},
  law:        {n:"Law",              c:48, r:['writing'],            f:{gov:1.25}},
  strategy:   {n:"Military Strategy",c:58, r:['law','metalwork'],    f:{mil:1.4}},
  philosophy: {n:"Philosophy",       c:52, r:['writing'],            f:{culture:1.4}},
  arch:       {n:"Architecture",     c:62, r:['engineering'],        f:{build:1.3}},
  gunpowder:  {n:"Gunpowder",        c:78, r:['metalwork','medicine'],f:{mil:1.8}},
  printing:   {n:"Printing Press",   c:68, r:['writing','engineering'],f:{res:1.4}},
  navigation: {n:"Navigation",       c:62, r:['sailing','math'],     f:{trade:1.4}},
};

// ────────────── TRIBE TEMPLATES ──────────────
const TRIBES_T = [
  {n:"Valorian",  c:[180,60,60],  t:{agg:.7,coop:.4,cur:.5,res:.6,cre:.4}},
  {n:"Merdani",   c:[60,140,200], t:{agg:.3,coop:.7,cur:.6,res:.5,cre:.7}},
  {n:"Thornwood", c:[60,150,60],  t:{agg:.4,coop:.5,cur:.3,res:.8,cre:.3}},
  {n:"Ashborne",  c:[200,160,50], t:{agg:.5,coop:.6,cur:.7,res:.4,cre:.6}},
  {n:"Drakmoor",  c:[150,60,180], t:{agg:.8,coop:.2,cur:.4,res:.5,cre:.3}},
  {n:"Silvhen",   c:[180,180,200],t:{agg:.2,coop:.8,cur:.5,res:.6,cre:.8}},
  {n:"Ironclad",  c:[140,120,90], t:{agg:.6,coop:.5,cur:.3,res:.7,cre:.2}},
  {n:"Sunspire",  c:[220,180,80], t:{agg:.4,coop:.6,cur:.8,res:.3,cre:.7}},
  {n:"Frostheim", c:[120,180,220],t:{agg:.5,coop:.5,cur:.4,res:.7,cre:.4}},
  {n:"Verdantis", c:[50,180,100], t:{agg:.3,coop:.7,cur:.6,res:.5,cre:.6}},
];

// ────────────── STATE ──────────────
let tiles, tBuf, settlements=[], tribes=[], wars=[], diseases=[], events=[], tradeRoutes=[];
let cam={x:CFG.WW/2,y:CFG.WH/2,zoom:1,tz:1};
let paused=false, speed=1, tick=0, overlay='terrain', maxPop=CFG.MAX_POP;
let selSett=null, drag=false, dragS={x:0,y:0}, camS={x:0,y:0};
let population=0, totalTech=0, totalTrade=0, totalWars=0, totalDisease=0;
let eventTimer=0, notifQueue=[];

// ────────────── UTILITIES ──────────────
function rng(s){seed=s||seed;return()=>{seed=(seed*16807+0)%2147483647;return(seed&0xffff)/0xffff}}
let seed=42;const R=rng(42);
function pick(a){return a[Math.floor(R()*a.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)}
function lerp(a,b,t){return a+(b-a)*t}
function hsl(h,s,l){return`hsl(${h},${s}%,${l}%)`}

function genName(){
  const pre=['Ash','Bar','Cal','Dal','Eld','Fal','Gar','Hal','Ith','Kal','Lor','Mal','Nor','Ost','Pal','Ral','Sil','Tor','Val','Zan'];
  const mid=['an','en','in','or','ar','al','el','il'];
  const suf=['burg','heim','dale','ford','stead','mark','wick','shire','den','thorpe','bury','ham','gate','ton','cross','wall'];
  return pick(pre)+(R()>.4?pick(mid):'')+pick(suf);
}

function notify(msg,col){
  const d=document.createElement('div');d.className='nf';d.textContent=msg;
  if(col)d.style.borderColor=col;
  document.getElementById('notifs').appendChild(d);
  setTimeout(()=>{if(d.parentElement)d.remove()},4500);
}

// ────────────── WORLD GENERATION ──────────────
function genWorld(){
  noiseSeed(42);tiles=[];
  for(let x=0;x<CFG.WW;x++){
    tiles[x]=[];
    for(let y=0;y<CFG.WH;y++){
      let e=noise(x*.012,y*.012)*.55+noise(x*.03,y*.03)*.3+noise(x*.07,y*.07)*.15;
      let cx=x/CFG.WW-.5,cy=y/CFG.WH-.5;
      e-=Math.sqrt(cx*cx+cy*cy)*.35;
      e+=noise(x*.02+99,y*.02+99)*.18;
      let m=noise(x*.014+50,y*.014+50)*.65+noise(x*.04+50,y*.04+50)*.35;
      let t=1-Math.abs(y/CFG.WH-.5)*1.6+noise(x*.02+200,y*.02+200)*.2;
      t=clamp(t,0,1);
      let tr;
      if(e<.28)tr=T.DEEP;
      else if(e<.33)tr=T.SHALLOW;
      else if(e<.35)tr=T.BEACH;
      else if(e<.52){
        if(m>.62)tr=T.FOREST;
        else if(t<.28)tr=T.TUNDRA;
        else if(m<.3&&t>.6)tr=T.DESERT;
        else tr=T.PLAINS;
      }else if(e<.65){
        if(t<.3)tr=T.TUNDRA;
        else if(m>.68)tr=T.JUNGLE;
        else if(m>.5&&e<.56)tr=T.SWAMP;
        else tr=T.HILLS;
      }else if(e<.78)tr=T.MOUNTAIN;
      else tr=T.SNOW;

      let fd=0,wd=0,st=0,mt=0;
      if(tr===T.PLAINS){fd=.45+m*.25;wd=.1}
      if(tr===T.FOREST){fd=.25;wd=.55+noise(x*.1,y*.1)*.2}
      if(tr===T.JUNGLE){fd=.35;wd=.6}
      if(tr===T.HILLS){st=.4+noise(x*.08+50,y*.08)*.25;mt=noise(x*.14+100,y*.14)*.25}
      if(tr===T.MOUNTAIN){st=.6;mt=noise(x*.11+100,y*.11)*.4}
      if(tr===T.SWAMP){fd=.3;wd=.35}
      if(tr===T.DESERT){fd=.05}
      if(tr===T.TUNDRA){fd=.1;wd=.1}
      tiles[x][y]={t:tr,e,m,t:tr,fd,wd,st,mt,temp:t,owner:null,river:false};
    }
  }
  // Add rivers
  for(let i=0;i<6;i++){
    let rx=Math.floor(R()*CFG.WW*.6+CFG.WW*.2),ry=R()<.5?0:CFG.WH-1;
    let dir=ry===0?1:-1;
    for(let s=0;s<CFG.WH*.8;s++){
      let nx=rx+Math.floor((R()-.5)*3),ny=ry+s*dir;
      if(nx<2||nx>=CFG.WW-2||ny<2||ny>=CFG.WH-2)break;
      rx=nx;
      for(let d=-1;d<=1;d++){
        let xx=rx+d;
        if(xx>=0&&xx<CFG.WW){
          tiles[xx][ny].t=T.SHALLOW;
          tiles[xx][ny].river=true;
          tiles[xx][ny].fd+=.15;
        }
      }
    }
  }
}

function terrainColor(x,y){
  let tl=tiles[x][y];let c=[...TC[tl.t]];
  let v=noise(x*.05+300,y*.05+300)*20-10;
  c[0]=clamp(c[0]+v,0,255);c[1]=clamp(c[1]+v,0,255);c[2]=clamp(c[2]+v,0,255);
  if(overlay==='climate'){
    let tmp=tiles[x][y].temp;
    c=[lerp(80,220,tmp),lerp(100,100,tmp*.5),lerp(220,60,tmp)];
  }
  if(overlay==='resources'){
    let r=tiles[x][y];
    let v2=(r.fd+r.wd+r.st+r.mt)*80;
    c=[clamp(40+v2,0,255),clamp(80+v2*.5,0,255),clamp(40,0,255)];
  }
  return c;
}

function renderTerrain(){
  tBuf=createGraphics(CFG.WW,CFG.WH);
  tBuf.loadPixels();
  for(let x=0;x<CFG.WW;x++)for(let y=0;y<CFG.WH;y++){
    let c=terrainColor(x,y);
    let i=(y*CFG.WW+x)*4;
    tBuf.pixels[i]=c[0];tBuf.pixels[i+1]=c[1];tBuf.pixels[i+2]=c[2];tBuf.pixels[i+3]=255;
  }
  tBuf.updatePixels();
}

// ────────────── TRIBE CLASS ──────────────
class Tribe{
  constructor(template,id){
    this.id=id;this.name=template.n;this.color=template.c;
    this.traits={...template.t};
    this.culture=R()*100;this.settlements=[];this.dead=false;
    this.diplomacy={};this.techs=new Set();this.researchProgress={};
    this.totalPop=0;this.power=0;
  }
  addTech(k){
    if(this.techs.has(k))return;
    let t=TECH[k];
    for(let r of t.r)if(!this.techs.has(r))return;
    this.techs.add(k);
    notify(`⚡ ${this.name} discovered ${t.n}!`,'rgba(100,150,255,.6)');
  }
  getMult(fx){
    let m=1;
    for(let tk of this.techs){let ef=TECH[tk].f;if(ef[fx])m*=ef[fx]}
    return m;
  }
}

// ────────────── SETTLEMENT CLASS ──────────────
class Settlement{
  constructor(x,y,tribe){
    this.x=x;this.y=y;this.tribe=tribe;this.id=settlements.length;
    this.name=genName();this.pop=CFG.NEW_SETTLEMENT_POP+R()*80;
    this.food=50;this.wealth=20;this.happiness=.5;
    this.buildings=1;this.founded=tick;
    this.researchPts=0;this.lastWarTick=-999;
    this.underDisease=false;this.diseaseTick=0;
    tribe.settlements.push(this);
  }
  get power(){return this.pop*this.tribe.getMult('mil')*(1+this.tribe.techs.size*.08)}
  get defense(){return this.pop*this.tribe.getMult('build')*1.2}
  gatherResources(){
    let r=6,fd=0,wd=0,st=0;
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      let nx=this.x+dx,ny=this.y+dy;
      if(nx<0||nx>=CFG.WW||ny<0||ny>=CFG.WH)continue;
      let d2=dx*dx+dy*dy;if(d2>r*r)continue;
      let w=1/(1+Math.sqrt(d2));
      let tl=tiles[nx][ny];
      fd+=tl.fd*w;wd+=tl.wd*w;st+=tl.st*w;
    }
    fd*=this.tribe.getMult('food')*this.tribe.getMult('gather');
    this.food+=fd*.15;
    this.wealth+=(fd+wd)*.02*this.tribe.getMult('trade');
  }
  update(){
    // Disease
    if(this.underDisease){
      let mort=CFG.DISEASE_MORTALITY*(1/this.tribe.getMult('health'));
      this.pop-=this.pop*mort;
      if(tick-this.diseaseTick>150+R()*100)this.underDisease=false;
    }
    // Consumption
    let consumption=this.pop*.006;
    this.food-=consumption;
    if(this.food<0){this.food=0;this.pop-=this.pop*.005;this.happiness-=.01}
    else if(this.food>consumption*3){this.happiness+=.005}
    // Growth
    this.happiness=clamp(this.happiness,0,1);
    if(this.food>consumption*2&&this.pop<maxPop){
      let grow=this.pop*CFG.GROWTH_RATE*this.happiness;
      this.pop+=grow;
    }
    this.pop=Math.max(5,Math.min(maxPop,this.pop));
    // Buildings
    this.buildings=Math.floor(Math.sqrt(this.pop/20))+1;
    // Research
    let resRate=CFG.RESEARCH_RATE*this.pop*.01*this.tribe.getMult('res');
    this.researchPts+=resRate;
    // Try to research
    for(let k in TECH){
      if(this.tribe.techs.has(k))continue;
      let t=TECH[k];
      let ok=true;
      for(let r of t.r)if(!this.tribe.techs.has(r)){ok=false;break}
      if(ok&&this.researchPts>=t.c){
        this.researchPts-=t.c;
        this.tribe.addTech(k);
        break;
      }
    }
    // Adjust traits based on situation
    if(this.happiness<.3)this.tribe.traits.agg+=CFG.TRAIT_DRIFT;
    if(this.food>consumption*5)this.tribe.traits.cre+=CFG.TRAIT_DRIFT*.5;
    // Clamp traits
    for(let k in this.tribe.traits)this.tribe.traits[k]=clamp(this.tribe.traits[k],0.05,.95);
  }
}

// ────────────── SIMULATION INIT ──────────────
function initSim(){
  settlements=[];tribes=[];wars=[];diseases=[];events=[];tradeRoutes=[];
  tick=0;population=0;

  // Create tribes
  for(let i=0;i<CFG.START_SETTLEMENTS;i++){
    let tpl=TRIBES_T[i%TRIBES_T.length];
    tribes.push(new Tribe(tpl,i));
  }

  // Place settlements
  let regions=[];
  let rx=Math.ceil(CFG.WW/6),ry=Math.ceil(CFG.WH/4);
  for(let x=0;x<6;x++)for(let y=0;y<4;y++)regions.push({x:x*rx,y:y*ry,w:rx,h:ry});

  for(let i=0;i<CFG.START_SETTLEMENTS&&i<regions.length;i++){
    let rg=regions[i];
    let best=null,bestS=0;
    for(let t=0;t<80;t++){
      let px=Math.floor(rg.x+R()*rg.w),py=Math.floor(rg.y+R()*rg.h);
      if(px<5||px>=CFG.WW-5||py<5||py>=CFG.WH-5)continue;
      let tl=tiles[px][py];
      if(tl.t===T.DEEP||tl.t===T.MOUNTAIN||tl.t===T.SNOW)continue;
      let s2=0;
      for(let dx=-5;dx<=5;dx++)for(let dy=-5;dy<=5;dy++){
        let nx=px+dx,ny=py+dy;
        if(nx<0||nx>=CFG.WW||ny<0||ny>=CFG.WH)continue;
        let d2=dx*dx+dy*dy;
        let w=1/(1+Math.sqrt(d2));
        let ntl=tiles[nx][ny];
        s2+=(ntl.fd+ntl.wd+ntl.st+ntl.mt*2)*w;
      }
      if(s2>bestS){bestS=s2;best={x:px,y:py}}
    }
    if(best){
      let s=new Settlement(best.x,best.y,tribes[i]);
      settlements.push(s);
    }
  }
  renderTerrain();
  buildLegend();
  notify('🌍 Civilization begins!','rgba(100,200,100,.5)');
}

// ────────────── SIMULATION UPDATE ──────────────
function simUpdate(dt){
  tick++;
  // Resource gathering & growth
  for(let s of settlements)s.gatherResources();
  for(let s of settlements)s.update();

  // Trade
  if(tick%3===0){
    totalTrade=0;
    for(let i=0;i<settlements.length;i++){
      for(let j=i+1;j<settlements.length;j++){
        let a=settlements[i],b=settlements[j];
        if(a.tribe===b.tribe||dist(a,b)>CFG.TRADE_RANGE)continue;
        let d=dist(a,b);
        let vol=Math.min(a.food,b.food)*.05*a.tribe.getMult('trade')*b.tribe.getMult('trade');
        if(vol>.5){
          a.food+=vol*.3;a.wealth+=vol*.1;
          b.food+=vol*.3;b.wealth+=vol*.1;
          totalTrade++;
          // Maintain route
          let existing=tradeRoutes.find(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a));
          if(existing){existing.vol=lerp(existing.vol,vol,.1);existing.ttl=50}
          else if(tradeRoutes.length<200){tradeRoutes.push({a,b,vol,ttl:50})}
          // Disease spread via trade
          if(a.underDisease&&!b.underDisease&&R()<CFG.DISEASE_SPREAD){
            b.underDisease=true;b.diseaseTick=tick;
            if(diseases.length<10)diseases.push({name:"Trade Plague",origin:a,setts:[b],tick});
          }
        }
      }
    }
    tradeRoutes=tradeRoutes.filter(r=>{r.ttl--;return r.ttl>0});
  }

  // Wars
  if(tick%5===0){
    totalWars=wars.filter(w=>w.active).length;
    for(let i=0;i<settlements.length;i++){
      for(let j=i+1;j<settlements.length;j++){
        let a=settlements[i],b=settlements[j];
        if(a.tribe===b.tribe||dist(a,b)>CFG.WAR_RANGE)continue;
        let alreadyWar=wars.find(w=>w.active&&((w.a.tribe===a.tribe&&w.b.tribe===b.tribe)||(w.a.tribe===b.tribe&&w.b.tribe===a.tribe)));
        if(alreadyWar)continue;
        let aggression=(a.tribe.traits.agg+b.tribe.traits.agg)/2;
        let scarcity=1-Math.min(a.food,b.food)/(a.pop*.5);
        let chance=(aggression*.005+scarcity*.003)*(1-a.tribe.traits.coop*.5);
        if(R()<chance){
          wars.push({a,b,active:true,tick,turns:0});
          notify(`⚔️ War: ${a.tribe.name} vs ${b.tribe.name}!`,'rgba(255,80,80,.6)');
          a.lastWarTick=tick;b.lastWarTick=tick;
        }
      }
    }
  }

  // Process wars
  for(let w of wars){
    if(!w.active)continue;
    w.turns++;
    let pa=w.a.power,pb=w.b.power;
    let total=pa+pb;
    let aLoss=w.b.pop*.003*(pb/total)*(.8+R()*.4);
    let bLoss=w.a.pop*.003*(pa/total)*(.8+R()*.4);
    w.a.pop=Math.max(10,w.a.pop-aLoss);
    w.b.pop=Math.max(10,w.b.pop-bLoss);
    w.a.happiness-=.02;w.b.happiness-=.02;
    if(w.turns>80+R()*60||w.a.pop<20||w.b.pop<20){
      w.active=false;
      let winner=pa>pb?w.a:w.b;
      let loser=pa>pb?w.b:w.a;
      if(loser.pop<20){
        winner.tribe.settlements.push(loser);loser.tribe=winner.tribe;
        winner.food+=loser.food*.5;winner.pop+=loser.pop*.3;
        notify(`🏴 ${winner.tribe.name} conquered ${loser.name}!`,'rgba(255,150,50,.6)');
      }else{
        notify(`🕊️ ${w.a.tribe.name} and ${w.b.tribe.name} make peace.`,'rgba(100,200,100,.5)');
        w.a.tribe.traits.coop+=.02;w.b.tribe.traits.coop+=.02;
      }
    }
  }
  wars=wars.filter(w=>w.active||tick-w.tick<200);

  // Disease spread to nearby
  if(tick%8===0){
    for(let d of diseases){
      let newInf=[];
      for(let s of d.setts){
        for(let o of settlements){
          if(o.underDisease||dist(s,o)>15)continue;
          if(R()<CFG.DISEASE_SPREAD*2){
            o.underDisease=true;o.diseaseTick=tick;
            newInf.push(o);
          }
        }
      }
      d.setts.push(...newInf);
    }
    totalDisease=diseases.reduce((a,d)=>a+d.setts.filter(s=>s.underDisease).length,0);
  }
  diseases=diseases.filter(d=>tick-d.tick<400);

  // Migration & new settlements
  if(tick%10===0){
    for(let s of settlements){
      if(s.pop>CFG.NEW_SETTLEMENT_POP*2.5&&settlements.length<CFG.MAX_SETTLEMENTS&&R()<CFG.MIGRATION_CHANCE*3){
        let ang=R()*Math.PI*2,dist2=15+R()*25;
        let nx=Math.round(s.x+Math.cos(ang)*dist2);
        let ny=Math.round(s.y+Math.sin(ang)*dist2);
        if(nx<5||nx>=CFG.WW-5||ny<5||ny>=CFG.WH-5)continue;
        let tl=tiles[nx][ny];
        if(tl.t===T.DEEP||tl.t===T.MOUNTAIN||tl.t===T.SNOW)continue;
        let ns=new Settlement(nx,ny,s.tribe);
        s.pop-=CFG.NEW_SETTLEMENT_POP;
        settlements.push(ns);
        notify(`🏘️ ${s.tribe.name} founds ${ns.name}!`,'rgba(150,200,100,.5)');
      }
    }
  }

  // Natural events
  eventTimer++;
  if(eventTimer>CFG.EVENT_INTERVAL){
    eventTimer=0;
    let r=R();
    if(r<.15){triggerDrought()}
    else if(r<.25){triggerFlood()}
    else if(r<.35){triggerPlague()}
    else if(r<.42){triggerHeat()}
    else if(r<.5){triggerCold()}
  }

  // Population count
  population=Math.floor(settlements.reduce((a,s)=>a+s.pop,0));
  totalTech=tribes.reduce((a,t)=>a+t.techs.size,0);
  tribes.forEach(t=>{t.totalPop=t.settlements.reduce((a,s)=>a+s.pop,0);t.power=t.settlements.reduce((a,s)=>a+s.power,0)});

  // Update tribe colors for political overlay
  for(let x=0;x<CFG.WW;x++)for(let y=0;y<CFG.WH;y++)tiles[x][y].owner=null;
  for(let s of settlements){
    let r=Math.floor(Math.sqrt(s.pop)*.4)+2;
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      let nx=s.x+dx,ny=s.y+dy;
      if(nx>=0&&nx<CFG.WW&&ny>=0&&ny<CFG.WH&&dx*dx+dy*dy<=r*r)
        tiles[nx][ny].owner=s.tribe;
    }
  }
}

// ────────────── EVENT TRIGGERS ──────────────
function triggerDrought(){
  let cx=R()*CFG.WW,cy=R()*CFG.WH,r=30+R()*30;
  for(let s of settlements){
    if(dist(s,{x:cx,y:cy})<r){s.food*=.3;s.happiness-=.15}
  }
  notify('☀️ Severe drought strikes!','rgba(220,180,50,.6)');
  events.push({type:'drought',x:cx,y:cy,r,tick,ttl:100});
}
function triggerFlood(){
  let cx=R()*CFG.WW,cy=R()*CFG.WH,r=20+R()*20;
  for(let s of settlements){
    if(dist(s,{x:cx,y:cy})<r){s.pop*=.85;s.food*=.5;s.happiness-=.2}
  }
  notify('🌊 Flooding devastates the region!','rgba(50,100,200,.6)');
  events.push({type:'flood',x:cx,y:cy,r,tick,ttl:100});
}
function triggerPlague(){
  if(settlements.length<3)return;
  let s=pick(settlements);
  s.underDisease=true;s.diseaseTick=tick;
  let d={name:"Great Plague",origin:s,setts:[s],tick};
  diseases.push(d);
  notify(`☠️ Plague erupts in ${s.name}!`,'rgba(150,50,150,.6)');
  events.push({type:'plague',x:s.x,y:s.y,r:10,tick,ttl:150});
}
function triggerHeat(){
  for(let s of settlements){
    if(s.tribe.traits.res<.5)s.pop*=.95;
    s.food*=.7;s.happiness-=.1;
  }
  notify('🔥 Extreme heatwave!','rgba(255,100,30,.6)');
  events.push({type:'heat',x:CFG.WW/2,y:CFG.WH/2,r:200,tick,ttl:80});
}
function triggerCold(){
  for(let s of settlements){
    if(!s.tribe.techs.has('fire')){s.pop*=.9;s.food*=.6}
    s.happiness-=.08;
  }
  notify('❄️ Harsh winter arrives!','rgba(100,150,255,.6)');
  events.push({type:'cold',x:CFG.WW/2,y:CFG.WH/2,r:200,tick,ttl:80});
}
function triggerInsects(){
  for(let s of settlements){s.food*=.5}
  notify('🦗 Locust swarm devours crops!','rgba(150,150,50,.6)');
}
function triggerMigration(){
  let s=pick(settlements);
  if(s){s.pop*=.6;let ang=R()*Math.PI*2,nx=s.x+Math.cos(ang)*40,ny=s.y+Math.sin(ang)*40;
    notify(`🚶 Mass migration from ${s.name}!`,'rgba(180,150,80,.6)')}
}
function triggerTradeBoom(){
  for(let s of settlements){s.wealth+=20;s.traits=(s.tribe.traits);s.tribe.traits.coop+=.03}
  notify('📈 Trade enthusiasm sweeps the world!','rgba(200,180,50,.5)');
}
function triggerWarDesire(){
  for(let t of tribes)t.traits.agg+=.1;
  notify('😤 War fervor rises everywhere!','rgba(255,80,80,.5)');
}
function triggerBoredom(){
  for(let t of tribes)t.traits.cre+=.05;
  notify('🎭 People seek new ideas and art!','rgba(150,100,200,.5)');
}
function addForeign(){
  let tpl={n:"Xel"+Math.floor(R()*999),c:[Math.floor(R()*200+55),Math.floor(R()*200+55),Math.floor(R()*200+55)],
    t:{agg:R(),coop:R(),cur:R(),res:R(),cre:R()}};
  let tr=new Tribe(tpl,tribes.length);
  // Give some random techs
  let techKeys=Object.keys(TECH);
  for(let i=0;i<Math.floor(R()*5);i++){
    let k=techKeys[Math.floor(R()*techKeys.length)];
    let ok=true;for(let r of TECH[k].r)if(!tr.techs.has(r)){ok=false;break}
    if(ok)tr.techs.add(k);
  }
  tribes.push(tr);
  let px=Math.floor(R()*CFG.WW*.8+CFG.WW*.1),py=Math.floor(R()*CFG.WH*.8+CFG.WH*.1);
  let ns=new Settlement(px,py,tr);settlements.push(ns);
  notify(`👽 Foreign tribe ${tr.name} arrives!`,'rgba(200,100,255,.6)');
}

// ────────────── RENDERING ──────────────
function render(){
  background(8,8,20);
  push();
  translate(width/2-cam.x*cam.zoom,height/2-cam.y*cam.zoom);
  scale(cam.zoom);

  // Terrain
  if(tBuf)image(tBuf,0,0);

  // Political overlay
  if(overlay==='political'){
    noStroke();
    for(let x=0;x<CFG.WW;x+=2)for(let y=0;y<CFG.WH;y+=2){
      let o=tiles[x][y].owner;
      if(o){fill(o.color[0],o.color[1],o.color[2],60);rect(x,y,2,2)}
    }
  }

  // Events
  for(let ev of events){
    let age=tick-ev.tick;
    if(age>ev.ttl)continue;
    let alpha=120*(1-age/ev.ttl);
    noFill();
    if(ev.type==='drought'){stroke(220,180,50,alpha);strokeWeight(1)}
    else if(ev.type==='flood'){stroke(50,100,200,alpha);strokeWeight(1.5)}
    else if(ev.type==='plague'){stroke(150,50,150,alpha);strokeWeight(1)}
    else if(ev.type==='heat'){stroke(255,100,30,alpha*.5);strokeWeight(.5)}
    else if(ev.type==='cold'){stroke(100,150,255,alpha*.5);strokeWeight(.5)}
    let r2=ev.r+age*.3;
    ellipse(ev.x,ev.y,r2*2,r2*2);
    // Ripple
    if(age%10<5){ellipse(ev.x,ev.y,r2*2+5,r2*2+5)}
  }

  // Trade routes
  stroke(200,180,80,40);strokeWeight(.5);noFill();
  for(let r of tradeRoutes){
    let v=Math.min(r.vol,5);
    stroke(200,180,80,20+v*15);strokeWeight(.3+v*.15);
    let mx=(r.a.x+r.b.x)/2+(R()-.5)*4;
    let my=(r.a.y+r.b.y)/2+(R()-.5)*4;
    bezier(r.a.x,r.a.y,mx,my-5,mx,my+5,r.b.x,r.b.y);
  }

  // Wars
  for(let w of wars){
    if(!w.active)continue;
    let pulse=Math.sin(tick*.2)*.3+.7;
    stroke(255,50,50,60*pulse);strokeWeight(.8);
    line(w.a.x,w.a.y,w.b.x,w.b.y);
    noStroke();fill(255,50,50,25*pulse);
    let mx=(w.a.x+w.b.x)/2,my=(w.a.y+w.b.y)/2;
    ellipse(mx,my,8,8);
  }

  // Diseases
  for(let d of diseases){
    for(let s of d.setts){
      if(!s.underDisease)continue;
      let pulse=Math.sin(tick*.15)*.3+.7;
      noFill();stroke(120,200,80,80*pulse);strokeWeight(.6);
      ellipse(s.x,s.y,6+pulse*3,6+pulse*3);
    }
  }

  // Settlements
  noStroke();
  for(let s of settlements){
    let sz=Math.sqrt(s.pop)*.12+1.5;
    let c=s.tribe.color;
    // Glow
    if(s===selSett){fill(255,255,255,30);ellipse(s.x,s.y,sz*3,sz*3)}
    fill(c[0],c[1],c[2]);
    ellipse(s.x,s.y,sz,sz);
    // Border for tech level
    if(cam.zoom>1.5){
      let tc=s.tribe.techs.size;
      if(tc>5){noFill();stroke(c[0]*.7+80,c[1]*.7+80,c[2]*.7+80,100);strokeWeight(.4+tc*.05);ellipse(s.x,s.y,sz+2,sz+2);noStroke()}
    }
    // Under disease marker
    if(s.underDisease){fill(120,200,80,150);ellipse(s.x,s.y-sz*.6,2,2)}
    // War marker
    if(tick-s.lastWarTick<20){fill(255,50,50,150);ellipse(s.x+sz*.5,s.y-sz*.5,1.5,1.5)}
    // Labels
    if(cam.zoom>2.5){
      fill(255,255,255,180);textSize(3.5/cam.zoom*cam.zoom);textAlign(CENTER);
      text(s.name,s.x,s.y-sz-1.5);
      fill(200,200,200,120);textSize(2.5);
      text(Math.floor(s.pop),s.x,s.y+sz+2);
    }
  }

  // Settler names when zoomed very close
  if(cam.zoom>4){
    for(let s of settlements){
      fill(255,255,255,100);textSize(2.5);textAlign(CENTER);
      text(s.tribe.name,s.x,s.y-sz-4);
    }
  }

  pop();
}

function renderTechTree(){
  if(tribes.length===0)return'';
  let best=tribes.reduce((a,b)=>b.techs.size>a.techs.size?b:a,tribes[0]);
  let html='';
  let keys=Object.keys(TECH);
  for(let k of keys){
    let t=TECH[k];
    let count=tribes.filter(tr=>tr.techs.has(k)).length;
    let pct=Math.round(count/Math.max(1,tribes.length)*100);
    let col=count>0?`rgb(${80+pct},${120+pct*.5},255)`:'#444';
    html+=`<div class="sr"><span class="sl" style="font-size:9px">${t.n}</span><span class="sv" style="color:${col};font-size:9px">${count}/${tribes.length}</span></div>`;
  }
  return html;
}

function renderTraits(){
  if(tribes.length===0)return'';
  let avg={};
  for(let k of ['agg','coop','cur','res','cre']){avg[k]=tribes.reduce((a,t)=>a+t.traits[k],0)/tribes.length}
  let names={agg:'Aggression',coop:'Cooperation',cur:'Curiosity',res:'Resilience',cre:'Creativity'};
  let cols={agg:'#e55',coop:'#5c5',cur:'#58f',res:'#a85',cre:'#c5f'};
  let html='';
  for(let k in names){
    html+=`<div class="sr"><span class="sl">${names[k]}</span><span class="sv" style="color:${cols[k]}">${avg[k].toFixed(2)}</span></div>`;
    html+=`<div class="bar"><div class="bf" style="width:${avg[k]*100}%;background:${cols[k]}"></div></div>`;
  }
  return html;
}

// ────────────── INPUT HANDLING ──────────────
function worldToScreen(wx,wy){
  return{x:(wx-cam.x)*cam.zoom+width/2,y:(wy-cam.y)*cam.zoom+height/2}
}
function screenToWorld(sx,sy){
  return{x:(sx-width/2)/cam.zoom+cam.x,y:(sy-height/2)/cam.zoom+cam.y}
}

function mousePressed(){
  if(mouseButton===LEFT){
    // Check if clicking a settlement
    let w=screenToWorld(mouseX,mouseY);
    let found=null;
    for(let s of settlements){
      let d=Math.sqrt((s.x-w.x)**2+(s.y-w.y)**2);
      if(d<4/cam.zoom+2){found=s;break}
    }
    if(found){showDetail(found);return}
    selSett=null;document.getElementById('det').style.display='none';
    drag=true;dragS={x:mouseX,y:mouseY};camS={x:cam.x,y:cam.y};
  }
}
function mouseDragged(){
  if(drag){
    cam.x=camS.x-(mouseX-dragS.x)/cam.zoom;
    cam.y=camS.y-(mouseY-dragS.y)/cam.zoom;
    cam.x=clamp(cam.x,0,CFG.WW);cam.y=clamp(cam.y,0,CFG.WH);
  }
}
function mouseReleased(){drag=false}
function mouseWheel(e){
  let f=e.delta>0?.85:1.18;
  let oldZ=cam.zoom;
  cam.tz=clamp(cam.tz*f,.3,12);
  // Zoom toward mouse
  let w=screenToWorld(mouseX,mouseY);
  cam.zoom=cam.tz;
  let w2=screenToWorld(mouseX,mouseY);
  cam.x+=w.x-w2.x;cam.y+=w.y-w2.y;
  return false;
}

// ────────────── P5.JS LIFECYCLE ──────────────
function setup(){
  let cnv=createCanvas(windowWidth,windowHeight);
  cnv.style('display','block');
  buildUI();
  initSim();
}

let lastUpdate=0,statTimer=0;
function draw(){
  // Smooth zoom
  cam.zoom=lerp(cam.zoom,cam.tz,.15);

  // Sim update
  if(!paused){
    let now=millis();
    let dt=(now-lastUpdate)/1000;
    let updates=Math.min(Math.floor(speed*CFG.TICK_RATE*60*dt),20);
    for(let i=0;i<updates;i++)simUpdate(dt/updates);
    lastUpdate=now;
  }else{lastUpdate=millis()}

  // Render
  render();

  // Stats update (every 30 frames)
  statTimer++;
  if(statTimer%30===0)updateStats();
}

function windowResized(){resizeCanvas(windowWidth,windowHeight)}
</script>
