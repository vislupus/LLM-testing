<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civilisation Agent Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
            color: #ddd;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #sim-container {
            position: relative;
            width: 1200px;
            height: 700px;
            background: #000;
            border: 1px solid #222;
            display: flex;
            flex-direction: row;
        }
        #canvas-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        #control-panel {
            width: 330px;
            background: #1a1a1a;
            border-left: 1px solid #333;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
        }
        #control-panel h2 {
            font-size: 16px;
            color: #ffd700;
            margin-bottom: 10px;
            text-align: center;
        }
        .ctrl-group {
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .ctrl-group label {
            display: block;
            margin: 5px 0 3px;
            color: #aaa;
        }
        button {
            background: #2a2a2a;
            border: 1px solid #555;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
            font-size: 12px;
            transition: all 0.15s;
        }
        button:hover {
            background: #444;
            border-color: #ffd700;
        }
        button.active {
            background: #584e00;
            border-color: #ffd700;
        }
        .event-buttons {
            display: flex;
            flex-wrap: wrap;
        }
        .event-buttons button {
            flex: 1 0 45%;
        }
        input[type="range"] {
            width: 100%;
        }
        #stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        #stats-table td,
        #stats-table th {
            padding: 4px 6px;
            border: 1px solid #333;
        }
        #stats-table td:last-child {
            text-align: right;
            color: #ffd700;
        }
        #notification-area {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .notify {
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 4px;
            margin: 2px;
            border-left: 3px solid #ffd700;
            font-size: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            animation: fadein 0.3s;
        }
        @keyframes fadein {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .map-overlay-toggle {
            margin: 3px;
        }
        #reset-btn {
            background: #b44;
            border-color: #a33;
        }
        #reset-btn:hover {
            background: #c55;
        }
    </style>
</head>
<body>
    <div id="sim-container">
        <div id="canvas-wrap">
            <div id="notification-area"></div>
        </div>
        <div id="control-panel">
            <h2>⚙️ Simulation Controls</h2>
            <div class="ctrl-group">
                <button id="pause-btn">⏸ Pause</button>
                <button id="reset-btn">↻ Reset</button>
                <button id="add-agent-btn">➕ Add Foreign Agent</button>
            </div>
            <div class="ctrl-group">
                <label>Speed: <span id="speed-value">1x</span></label>
                <input type="range" id="speed-slider" min="1" max="20" value="1" step="1">
            </div>
            <div class="ctrl-group">
                <label>Max Population: <span id="max-pop-value">200</span></label>
                <input type="range" id="max-pop-slider" min="50" max="1000" value="200" step="10">
            </div>
            <div class="ctrl-group">
                <span style="color:#ffd700">🌍 Events</span>
                <div class="event-buttons">
                    <button data-event="epidemic">🦠 Epidemic</button>
                    <button data-event="drought">🏜 Drought</button>
                    <button data-event="flood">🌊 Flood</button>
                    <button data-event="heat">🔥 Heat</button>
                    <button data-event="cold">❄ Cold</button>
                    <button data-event="insects">🐛 Insects</button>
                    <button data-event="boredom">😴 Boredom</button>
                    <button data-event="migration">🛤 Migration</button>
                    <button data-event="trade">💰 Trade Enthusiasm</button>
                    <button data-event="war">⚔️ War Desire</button>
                </div>
            </div>
            <div class="ctrl-group">
                <span style="color:#ffd700">🗺 Map Overlays</span><br>
                <label class="map-overlay-toggle"><input type="checkbox" id="ov-terrain" checked> Terrain</label>
                <label class="map-overlay-toggle"><input type="checkbox" id="ov-climate" checked> Climate</label>
                <label class="map-overlay-toggle"><input type="checkbox" id="ov-resources" checked> Resources</label>
                <label class="map-overlay-toggle"><input type="checkbox" id="ov-agents" checked> Agents</label>
                <label class="map-overlay-toggle"><input type="checkbox" id="ov-settlements" checked> Settlements</label>
                <label class="map-overlay-toggle"><input type="checkbox" id="ov-trade" checked> Trade</label>
                <label class="map-overlay-toggle"><input type="checkbox" id="ov-wars" checked> Wars</label>
                <label class="map-overlay-toggle"><input type="checkbox" id="ov-names" checked> Labels</label>
            </div>
            <div class="ctrl-group">
                <span style="color:#ffd700">📊 Stats</span>
                <table id="stats-table">
                    <tr><td>Population</td><td id="stat-pop">0</td></tr>
                    <tr><td>Settlements</td><td id="stat-sett">0</td></tr>
                    <tr><td>Economy</td><td id="stat-econ">0</td></tr>
                    <tr><td>Wars active</td><td id="stat-wars">0</td></tr>
                    <tr><td>Trade routes</td><td id="stat-trade">0</td></tr>
                    <tr><td>Avg. tech lvl</td><td id="stat-tech">0</td></tr>
                    <tr><td>Avg. traits</td><td id="stat-trait">0</td></tr>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script>
        // ============================================================
        //  CONFIGURATION & GLOBAL VARIABLES
        // ============================================================
        const WORLD_W = 240;   // tile columns
        const WORLD_H = 160;   // tile rows
        const TILE_SIZE = 10;  // world units per tile
        const WORLD_PIXEL_W = WORLD_W * TILE_SIZE;
        const WORLD_PIXEL_H = WORLD_H * TILE_SIZE;

        // Simulation state
        let simRunning = false;
        let paused = true;
        let simSpeed = 1;
        let maxPop = 200;
        let frameAccum = 0;

        // Camera
        let camX = 0;
        let camY = 0;
        let camZoom = 0.5; // default view shows entire map
        let dragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        // World grid
        let tiles = [];        // 2D array of Tile objects
        let agents = [];
        let settlements = [];
        let tradeRoutes = [];
        let wars = [];

        // Overlays
        let ovTerrain = true;
        let ovClimate = true;
        let ovResources = true;
        let ovAgents = true;
        let ovSettlements = true;
        let ovTrade = true;
        let ovWars = true;
        let ovNames = true;

        // Event triggers
        let eventQueue = [];

        // UI elements
        let canvasWrap;
        let notificationArea;

        // Colors per terrain & climate
        const TERRAIN_COLORS = {
            deep: '#1a4d7a',
            shallow: '#2d7aa5',
            sand: '#d4c27a',
            grass: '#7aa85a',
            forest: '#3f6f3a',
            mountain: '#8a8580',
            snow: '#ddeeff',
            desert: '#d9a066',
            lava: '#c33'
        };
        const CLIMATE_COLORS = {
            tropical: '#557744',
            temperate: '#88aa66',
            arid: '#cc9966',
            polar: '#aaccff',
            alpine: '#99bbcc'
        };

        // Tile class
        class Tile {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.terrain = 'grass';
                this.climate = 'temperate';
                this.resources = {
                    food: 10,
                    wood: 10,
                    stone: 10,
                    iron: 1,
                    gold: 0.5
                };
                this.tempMod = 0;
                this.river = false;
                this.fertility = 1;
            }
        }

        // Agent class
        class Agent {
            constructor(x, y, genome = null) {
                this.x = x;
                this.y = y;
                this.age = 0;
                this.health = 100;
                this.maxHealth = 100;
                this.energy = 100;
                this.culture = "tribe"; // tribe name
                this.homeSettlement = null;
                this.traits = genome || {
                    strength: Math.random(),
                    agility: Math.random(),
                    intelligence: Math.random() * 0.8 + 0.2,
                    fertility: Math.random() * 0.5 + 0.5,
                    aggression: Math.random() * 0.5,
                    diseaseResistance: Math.random()
                };
                this.memory = {
                    lastSettlementsSeen: [],
                    rations: {},
                    warMemory: 0,
                    tradeContacts: new Set()
                };
                this.alive = true;
                this.mutationRate = 0.1;
            }

            // Genotype reproduction
            reproduce(partner) {
                // Combine genes with mutation
                let childTraits = {};
                for (let key of Object.keys(this.traits)) {
                    let fromFather = Math.random() < 0.5;
                    let base = fromFather ? this.traits[key] : partner.traits[key];
                    let mutation = (Math.random() < this.mutationRate) ? (Math.random() - 0.5) * 0.3 : 0;
                    childTraits[key] = Math.max(0, Math.min(1, base + mutation));
                }
                return childTraits;
            }

            // Decision making: find a target tile to move to
            get targetTile() {
                // This will be called in update after the agent has its current tile
                let current = tiles[Math.floor(this.y / TILE_SIZE)][Math.floor(this.x / TILE_SIZE)];
                // Score nearby tiles based on resources & safety
                let bestScore = -Infinity;
                let bestTile = null;
                for (let dx = -3; dx <= 3; dx++) {
                    for (let dy = -3; dy <= 3; dy++) {
                        let nx = this.x + dx * TILE_SIZE;
                        let ny = this.y + dy * TILE_SIZE;
                        if (nx < 0 || ny < 0 || nx >= WORLD_PIXEL_W || ny >= WORLD_PIXEL_H) continue;
                        let tx = Math.floor(nx / TILE_SIZE);
                        let ty = Math.floor(ny / TILE_SIZE);
                        let tile = tiles[ty][tx];
                        let score = tile.resources.food * (0.8 + this.traits.strength * 0.4);
                        // avoid deep water
                        if (tile.terrain === 'deep' || tile.terrain === 'shallow') score -= 10;
                        else if (tile.terrain === 'mountain') score -= 2;
                        // food seeking
                        score += tile.resources.food * 0.7;
                        // avoid disease? no
                        // central tendency to stay near home if settlement exists
                        if (this.homeSettlement) {
                            let distToHome = Math.hypot(nx - this.homeSettlement.x, ny - this.homeSettlement.y);
                            score -= distToHome * 0.01;
                        }
                        if (score > bestScore) {
                            bestScore = score;
                            bestTile = { nx, ny };
                        }
                    }
                }
                return bestTile;
            }

            move() {
                if (this.energy <= 0) return;
                let target = this.targetTile;
                if (!target) return;
                let dx = Math.sign(target.nx - this.x);
                let dy = Math.sign(target.ny - this.y);
                this.x += dx * TILE_SIZE * 0.5;
                this.y += dy * TILE_SIZE * 0.5;
                // energy consumption
                this.energy -= 0.1 * (1 - this.traits.agility * 0.5);
            }

            eat() {
                let tx = Math.floor(this.x / TILE_SIZE);
                let ty = Math.floor(this.y / TILE_SIZE);
                if (tx < 0 || ty < 0 || tx >= WORLD_W || ty >= WORLD_H) return;
                let tile = tiles[ty][tx];
                // Eat food from tile if any
                if (tile.resources.food > 0) {
                    let amount = Math.min(5, tile.resources.food);
                    tile.resources.food -= amount;
                    this.energy += amount * 0.5;
                    this.health += amount * 0.2;
                } else {
                    this.energy -= 0.1;
                }
                // thirst? not implemented for simplicity
            }

            ageAndDie() {
                this.age += 0.01;
                let lifeSpan = 60 + this.traits.strength * 40;
                if (this.age > lifeSpan) {
                    this.die();
                }
                if (this.health <= 0) this.die();
            }

            die() {
                this.alive = false;
                // remove from settlement population?
                if (this.homeSettlement) {
                    this.homeSettlement.population--;
                }
            }

            // Find neighbors within radius
            findNeighbors(radius) {
                let result = [];
                for (let a of agents) {
                    if (!a.alive) continue;
                    if (a === this) continue;
                    let dist = Math.hypot(a.x - this.x, a.y - this.y);
                    if (dist < radius) result.push(a);
                }
                return result;
            }

            interact() {
                // find nearby agents
                let neighbors = this.findNeighbors(80);
                // Traders? settlement interactions happen via settlement
                // Reproduction
                let partner = neighbors.find(n => n.culture === this.culture && n.alive &&
                    n.age > 10 && n.homeSettlement === this.homeSettlement &&
                    n.homeSettlement !== null);
                if (partner && Math.random() < 0.02 * this.traits.fertility) {
                    let childGenome = this.reproduce(partner);
                    let childX = this.x + (Math.random() - 0.5) * 20;
                    let childY = this.y + (Math.random() - 0.5) * 20;
                    let child = new Agent(childX, childY, childGenome);
                    child.culture = this.culture;
                    child.homeSettlement = this.homeSettlement;
                    agents.push(child);
                    if (this.homeSettlement) this.homeSettlement.population++;
                    // Limit population
                    if (agents.length > maxPop) {
                        // remove oldest
                        agents.sort((a, b) => b.age - a.age);
                        agents.pop().die();
                    }
                }

                // Fighting if aggressive & different culture
                let enemy = neighbors.find(n => n.culture !== this.culture && n.alive && Math.random() < this.traits.aggression * 0.03);
                if (enemy) {
                    // Fight: strength + agility vs enemy
                    let myPower = this.traits.strength + this.traits.agility * 0.5;
                    let enemyPower = enemy.traits.strength + enemy.traits.agility * 0.5;
                    if (Math.random() * myPower > Math.random() * enemyPower) {
                        enemy.health -= 30;
                        this.memory.warMemory = 1;
                    } else {
                        this.health -= 30;
                    }
                }
            }

            update(dt) {
                if (!this.alive) return;
                this.energy -= 0.05 * dt * (1 - this.traits.industriousness * 0.3);
                this.health -= (0.01 * dt) * (1 - this.traits.diseaseResistance);
                if (this.energy < 15) {
                    this.eat();
                }

                this.move();
                this.interact();
                this.ageAndDie();
            }

            draw(scale, offsetX, offsetY) {
                if (!this.alive) return;
                // Agent color based on culture
                let col = colorHash(this.culture);
                fill(col);
                noStroke();
                let s = 5 * scale;
                ellipse(offsetX + this.x * scale, offsetY + this.y * scale, s, s);
            }
        }

        // Settlement class
        class Settlement {
            constructor(x, y, culture) {
                this.x = x;
                this.y = y;
                this.culture = culture;
                this.population = 0;
                this.techLevel = 0.1 + Math.random() * 0.3;
                this.economy = 0;
                this.resources = { food: 100, wood: 100, stone: 100, iron: 10, gold: 1 };
                this.tradeRoutes = [];
                this.wars = [];
                this.name = generateName(culture);
            }

            grow() {
                // Growth based on local resource availability
                let tx = Math.floor(this.x / TILE_SIZE);
                let ty = Math.floor(this.y / TILE_SIZE);
                if (tx < 0 || ty < 0 || tx >= WORLD_W || ty >= WORLD_H) return;
                let tile = tiles[ty][tx];
                // consume resources from surrounding tiles
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dy = -2; dy <= 2; dy++) {
                        let nx = this.x + dx * TILE_SIZE;
                        let ny = this.y + dy * TILE_SIZE;
                        if (nx < 0 || ny < 0 || nx >= WORLD_PIXEL_W || ny >= WORLD_PIXEL_H) continue;
                        let t = tiles[Math.floor(ny / TILE_SIZE)][Math.floor(nx / TILE_SIZE)];
                        // gather
                        let gather = Math.min(2, t.resources.food);
                        this.resources.food += gather * 0.1;
                        t.resources.food -= gather;
                        gather = Math.min(1, t.resources.wood);
                        this.resources.wood += gather * 0.1;
                        t.resources.wood -= gather;
                    }
                }

                // Population growth
                if (this.population >= 5 && this.resources.food > 50) {
                    let growth = Math.min(Math.floor(this.resources.food / 50), 2);
                    for (let i = 0; i < growth; i++) {
                        if (agents.length >= maxPop) break;
                        let child = new Agent(this.x + (Math.random() - 0.5) * 50,
                            this.y + (Math.random() - 0.5) * 50,
                            pickTraitFromCulture(this.culture));
                        child.culture = this.culture;
                        child.homeSettlement = this;
                        agents.push(child);
                        this.population++;
                    }
                    this.resources.food -= growth * 10;
                }

                // Technology progress
                let research = 0.01 * this.population * this.techLevel * (0.8 + Math.random() * 0.4);
                this.techLevel += research * 0.01;

                // Economy
                this.economy = this.population * 10 + this.resources.gold * 20 + this.resources.iron * 5;
            }

            draw(scale, offsetX, offsetY) {
                let x = offsetX + this.x * scale;
                let y = offsetY + this.y * scale;
                if (x < -20 || y < -20 || x > width + 20 || y > height + 20) return;
                noStroke();
                if (this.population > 20) fill(255, 180, 0);
                else if (this.population > 5) fill(255, 200, 50);
                else fill(220, 220, 100);
                ellipse(x, y, 12 * scale + 10, 12 * scale + 10);
                // Name label
                if (ovNames && scale > 0.3) {
                    fill(0);
                    textSize(8 + scale * 2);
                    textAlign(CENTER);
                    text(this.name, x, y - 15);
                }
            }
        }

        // Trade route class
        class TradeRoute {
            constructor(s1, s2) {
                this.s1 = s1;
                this.s2 = s2;
                this.active = true;
                this.amount = 1;
                this.color = [200, 200, 100];
            }

            draw(scale, offsetX, offsetY) {
                stroke(this.color);
                strokeWeight(1.5 * scale);
                line(offsetX + this.s1.x * scale, offsetY + this.s1.y * scale,
                    offsetX + this.s2.x * scale, offsetY + this.s2.y * scale);
            }
        }

        // War class
        class War {
            constructor(s1, s2) {
                this.s1 = s1;
                this.s2 = s2;
                this.intensity = 0.5;
                this.timer = 100;
                this.active = true;
                this.color = [255, 0, 0];
            }

            draw(scale, offsetX, offsetY) {
                if (!this.active) return;
                stroke(this.color);
                strokeWeight(2 * scale);
                line(offsetX + this.s1.x * scale, offsetY + this.s1.y * scale,
                    offsetX + this.s2.x * scale, offsetY + this.s2.y * scale);
            }
        }

        // ============================================================
        //  UTILITY FUNCTIONS
        // ============================================================
        function colorHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            let color = 'hsl(' + Math.abs(hash % 360) + ', 60%, 70%)';
            return color;
        }

        function generateName(culture) {
            let prefix = ['A', 'Ba', 'Ca', 'Da', 'E', 'Fa', 'Ga', 'Ha', 'Je', 'Ka', 'La', 'Ma', 'Na', 'Pa', 'Ra', 'Sa', 'Ta', 'Va', 'Ya', 'Za'];
            let suffix = ['nia', 'ria', 'land', 'ville', 'port', 'ton', 'ford', 'burg', 'reach', 'keth'];
            return (prefix[Math.floor(Math.random() * prefix.length)] +
                suffix[Math.floor(Math.random() * suffix.length)] + ' ' + culture);
        }

        function pickTraitFromCulture(culture) {
            // different cultures have different gene bases
            let base = Math.random();
            let traits = {
                strength: 0.3 + Math.random() * 0.7,
                agility: 0.3 + Math.random() * 0.7,
                intelligence: 0.3 + Math.random() * 0.7,
                fertility: 0.3 + Math.random() * 0.7,
                aggression: 0.3 + Math.random() * 0.7,
                diseaseResistance: 0.3 + Math.random() * 0.7
            };
            if (culture.includes('Norse')) {
                traits.strength += 0.3;
                traits.aggression += 0.2;
            } else if (culture.includes('Trade')) {
                traits.intelligence += 0.3;
                traits.aggression -= 0.2;
            }
            // clamp
            for (let k in traits) traits[k] = Math.max(0, Math.min(1, traits[k]));
            return traits;
        }

        // ============================================================
        //  WORLD GENERATION
        // ============================================================
        function generateWorld() {
            tiles = [];
            for (let y = 0; y < WORLD_H; y++) {
                let row = [];
                for (let x = 0; x < WORLD_W; x++) {
                    let t = new Tile(x, y);
                    // terrain via noise
                    let n = noise(x * 0.05, y * 0.05);
                    let n2 = noise(x * 0.1, y * 0.1 + 100);

                    if (n < 0.2) t.terrain = 'deep';
                    else if (n < 0.3) t.terrain = 'shallow';
                    else if (n < 0.42) t.terrain = 'sand';
                    else if (n < 0.55) t.terrain = 'grass';
                    else if (n < 0.65) t.terrain = 'forest';
                    else if (n < 0.8) t.terrain = 'mountain';
                    else if (n < 0.9) t.terrain = 'desert';
                    else t.terrain = 'snow';

                    // climate: based on lattitude + noise
                    let latFactor = 1 - Math.abs(y - WORLD_H / 2) / (WORLD_H / 2);
                    if (latFactor > 0.6) t.climate = 'tropical';
                    else if (latFactor > 0.3) t.climate = 'temperate';
                    else if (latFactor > -0.2) t.climate = 'arid';
                    else if (latFactor > -0.5) t.climate = 'alpine';
                    else t.climate = 'polar';

                    // resources
                    t.resources.food = 5 + noise(x * 0.1 + 200, y * 0.1) * 20;
                    t.resources.wood = (t.terrain === 'forest') ? 50 : 5 + noise(x * 0.2 + 500, y * 0.2) * 10;
                    t.resources.stone = (t.terrain === 'mountain') ? 50 : 2 + noise(x * 0.2 + 700, y * 0.2) * 8;
                    t.resources.iron = (t.terrain === 'mountain') ? 5 : noise(x * 0.3 + 900, y * 0.3) * 2;
                    t.resources.gold = noise(x * 0.5 + 1200, y * 0.5) * 0.5;

                    // fertility
                    if (t.terrain === 'grass' || t.terrain === 'forest') t.fertility = 1;
                    else if (t.terrain === 'sand' || t.terrain === 'desert') t.fertility = 0.2;
                    else t.fertility = 0.5;

                    row.push(t);
                }
                tiles.push(row);
            }

            // Create initial settlements at resource-rich areas
            let cultNames = ['Roma', 'Egy', 'Nord', 'Shan', 'Ata', 'Maya'];
            let cultures = cultNames.map(c => 'tribe_' + c);
            for (let i = 0; i < 8; i++) {
                // find a good spot: high food & wood, near water
                let bestScore = -Infinity;
                let bestX = 100, bestY = 80;
                for (let attempt = 0; attempt < 100; attempt++) {
                    let x = Math.floor(Math.random() * WORLD_W);
                    let y = Math.floor(Math.random() * WORLD_H);
                    let t = tiles[y][x];
                    let score = t.resources.food * 1.5 + t.resources.wood + t.fertility * 5;
                    if (t.terrain === 'deep' || t.terrain === 'shallow' || t.terrain === 'mountain') score -= 20;
                    if (score > bestScore) {
                        bestScore = score;
                        bestX = x * TILE_SIZE + TILE_SIZE / 2;
                        bestY = y * TILE_SIZE + TILE_SIZE / 2;
                    }
                }
                let culture = cultures[i % cultures.length];
                let settlement = new Settlement(bestX, bestY, culture);
                settlements.push(settlement);
                // spawn agents
                for (let j = 0; j < 20; j++) {
                    let agent = new Agent(bestX + (Math.random() - 0.5) * 100,
                        bestY + (Math.random() - 0.5) * 100,
                        pickTraitFromCulture(culture));
                    agent.culture = culture;
                    agent.homeSettlement = settlement;
                    agents.push(agent);
                    settlement.population++;
                }
            }

            // Generate trade routes (simple: connect near settlements)
            for (let i = 0; i < settlements.length; i++) {
                for (let j = i + 1; j < settlements.length; j++) {
                    let dist = Math.hypot(settlements[i].x - settlements[j].x,
                        settlements[i].y - settlements[j].y);
                    if (dist < 300 && Math.random() < 0.5) {
                        tradeRoutes.push(new TradeRoute(settlements[i], settlements[j]));
                    }
                }
            }
        }

        // ============================================================
        //  EVENT FUNCTIONS
        // ============================================================
        function triggerEvent(type) {
            let msg = "";
            switch (type) {
                case 'epidemic':
                    // kill 10% of random groups
                    let all = agents.filter(a => a.alive && Math.random() > a.traits.diseaseResistance);
                    all.forEach(a => a.health -= 40);
                    msg = "🦠 Epidemic strikes!";
                    break;
                case 'drought':
                    // reduce food resources globally
                    forEachTile(t => t.resources.food *= 0.5);
                    msg = "🏜 Drought reduces food!";
                    break;
                case 'flood':
                    forEachTile(t => {
                        if (Math.random() < 0.1) t.terrain = 'shallow';
                    });
                    msg = "🌊 Floods reshape terrain!";
                    break;
                case 'heat':
                    forEachTile(t => t.tempMod += 20);
                    msg = "🔥 Extreme heat!";
                    break;
                case 'cold':
                    forEachTile(t => t.tempMod -= 20);
                    msg = "❄ Extreme cold!";
                    break;
                case 'insects':
                    forEachTile(t => t.resources.food -= 1);
                    msg = "🐛 Insects destroy crops!";
                    break;
                case 'boredom':
                    // agents become less active
                    agents.forEach(a => a.traits.fertility *= 0.7);
                    msg = "😴 Boredom reduces births!";
                    break;
                case 'migration':
                    // agents randomly redistribute
                    agents.forEach(a => {
                        a.x += (Math.random() - 0.5) * 100;
                        a.y += (Math.random() - 0.5) * 100;
                    });
                    msg = "🛤 Mass migration!";
                    break;
                case 'trade':
                    // Enthusiastic trade: create extra routes
                    for (let i = 0; i < settlements.length; i++) {
                        for (let j = i + 1; j < settlements.length; j++) {
                            let dist = Math.hypot(settlements[i].x - settlements[j].x,
                                settlements[i].y - settlements[j].y);
                            if (dist < 500 && Math.random() < 0.3 && !tradeExists(settlements[i], settlements[j])) {
                                tradeRoutes.push(new TradeRoute(settlements[i], settlements[j]));
                            }
                        }
                    }
                    msg = "💰 Trade thrives!";
                    break;
                case 'war':
                    // Increase aggression and generate war between nearby settlements
                    agents.forEach(a => a.traits.aggression = Math.min(1, a.traits.aggression + 0.2));
                    for (let s of settlements) {
                        let neighbors = settlements.filter(t => t !== s &&
                            Math.hypot(t.x - s.x, t.y - s.y) < 400);
                        if (neighbors.length) {
                            let enemy = neighbors[Math.floor(Math.random() * neighbors.length)];
                            if (!warExists(s, enemy)) {
                                wars.push(new War(s, enemy));
                            }
                        }
                    }
                    msg = "⚔️ War desire rises!";
                    break;
            }
            if (msg) notify(msg);
        }

        function tradeExists(s1, s2) {
            return tradeRoutes.some(r => (r.s1 === s1 && r.s2 === s2) || (r.s1 === s2 && r.s2 === s1));
        }

        function warExists(s1, s2) {
            return wars.some(r => (r.s1 === s1 && r.s2 === s2) || (r.s1 === s2 && r.s2 === s1));
        }

        function forEachTile(fn) {
            for (let row of tiles) {
                for (let t of row) fn(t);
            }
        }

        // ============================================================
        //  SIMULATION UPDATE
        // ============================================================
        function updateSimulation(dt) {
            // Update agents (use substeps for stability)
            let steps = Math.min(5, Math.ceil(simSpeed * dt * 60));
            for (let s = 0; s < steps; s++) {
                // update each agent
                for (let a of agents) {
                    if (a.alive) a.update(dt / steps);
                }
                // Clean dead agents
                agents = agents.filter(a => a.alive);
            }

            // Update settlements
            for (let s of settlements) {
                s.grow();
            }

            // Update trade routes: transfer resources
            for (let r of tradeRoutes) {
                if (!r.active) continue;
                // Simulate trade: move resources between settlements
                let resourceTypes = ['food', 'wood', 'stone', 'iron', 'gold'];
                for (let res of resourceTypes) {
                    if (r.s1.resources[res] > 20 && r.s2.resources[res] < 10) {
                        r.s2.resources[res] += 2;
                        r.s1.resources[res] -= 2;
                    } else if (r.s2.resources[res] > 20 && r.s1.resources[res] < 10) {
                        r.s1.resources[res] += 2;
                        r.s2.resources[res] -= 2;
                    }
                }
            }

            // Update wars (cause damage)
            for (let w of wars) {
                if (!w.active) continue;
                w.timer -= dt;
                // reduce population of both settlements
                if (w.s1.population > 0) w.s1.population -= Math.random() * 0.2;
                if (w.s2.population > 0) w.s2.population -= Math.random() * 0.2;
                // kill some agents from both
                let killers = agents.filter(a => a.homeSettlement === w.s1 || a.homeSettlement === w.s2);
                for (let a of killers) {
                    if (Math.random() < dt * 0.2) a.health -= 30;
                }
                if (w.timer <= 0) w.active = false;
            }

            // Remove inactive wars
            wars = wars.filter(w => w.active);

            // Remove empty settlements
            settlements = settlements.filter(s => s.population > 0);
            // if population reaches zero, remove

            // Random alliance / new settlements
            if (settlements.length < 12 && Math.random() < dt * 0.001) {
                // split a settlement
                let s = settlements[Math.floor(Math.random() * settlements.length)];
                if (s.population > 20) {
                    let newS = new Settlement(s.x + (Math.random() - 0.5) * 200,
                        s.y + (Math.random() - 0.5) * 200,
                        s.culture);
                    settlements.push(newS);
                }
            }
        }

        // ============================================================
        //  RENDERING
        // ============================================================
        function drawWorld() {
            background(20);

            // Calculate world offset and scale
            let scale = camZoom;
            let offsetX = -camX * scale + width / 2;
            let offsetY = -camY * scale + height / 2;

            // Draw tiles (only visible area for performance)
            let startX = Math.max(0, Math.floor((((offsetX - 10) / scale)) / TILE_SIZE));
            let endX = Math.min(WORLD_W, Math.ceil((((width - offsetX + 10) / scale)) / TILE_SIZE));
            let startY = Math.max(0, Math.floor((((offsetY - 10) / scale)) / TILE_SIZE));
            let endY = Math.min(WORLD_H, Math.ceil((((height - offsetY + 10) / scale)) / TILE_SIZE));

            // draw terrain overlay
            if (ovTerrain) {
                for (let ty = startY; ty < endY; ty++) {
                    for (let tx = startX; tx < endX; tx++) {
                        let t = tiles[ty][tx];
                        let col = color(TERRAIN_COLORS[t.terrain]);
                        // adjust for climate
                        if (ovClimate) {
                            let cl = col;
                            // simple tint
                            // use blend
                        }
                        fill(col);
                        noStroke();
                        let x = offsetX + tx * TILE_SIZE * scale;
                        let y = offsetY + ty * TILE_SIZE * scale;
                        let w = Math.ceil(TILE_SIZE * scale) + 1;
                        rect(x, y, w, w);
                    }
                }
            }

            // Draw resources overlay (as heat dots)
            if (ovResources) {
                for (let ty = startY; ty < endY; ty++) {
                    for (let tx = startX; tx < endX; tx++) {
                        let t = tiles[ty][tx];
                        let x = offsetX + tx * TILE_SIZE * scale;
                        let y = offsetY + ty * TILE_SIZE * scale;
                        if (t.resources.food > 12) {
                            fill(200, 200, 50, 80);
                            noStroke();
                            let size = 4 * scale;
                            ellipse(x + TILE_SIZE * scale / 2, y + TILE_SIZE * scale / 2, size, size);
                        }
                        if (t.resources.iron > 3) {
                            fill(150, 150, 150, 100);
                            ellipse(x + TILE_SIZE * scale / 2, y + TILE_SIZE * scale / 2, 3 * scale, 3 * scale);
                        }
                        if (t.resources.gold > 0.5) {
                            fill(255, 215, 0, 100);
                            ellipse(x + TILE_SIZE * scale * 0.7, y + TILE_SIZE * scale * 0.7, 4 * scale, 4 * scale);
                        }
                    }
                }
            }

            // Draw trade routes
            if (ovTrade) {
                for (let r of tradeRoutes) {
                    r.draw(scale, offsetX, offsetY);
                }
            }

            // Draw wars
            if (ovWars) {
                for (let w of wars) {
                    w.draw(scale, offsetX, offsetY);
                }
            }

            // Draw settlements
            if (ovSettlements) {
                for (let s of settlements) {
                    s.draw(scale, offsetX, offsetY);
                }
            }

            // Draw agents (with culling)
            if (ovAgents) {
                fill(255, 0, 0);
                noStroke();
                let minX = -offsetX / scale;
                let maxX = (width - offsetX) / scale;
                let minY = -offsetY / scale;
                let maxY = (height - offsetY) / scale;
                for (let a of agents) {
                    if (!a.alive) continue;
                    if (a.x > minX - 10 && a.x < maxX + 10 && a.y > minY - 10 && a.y < maxY + 10) {
                        a.draw(scale, offsetX, offsetY);
                    }
                }
            }

            // Grid overlay if zoomed in
            if (scale > 1.5) {
                stroke(0, 20);
                strokeWeight(0.5 / scale);
                for (let x = startX; x <= endX; x++) {
                    let sx = offsetX + x * TILE_SIZE * scale;
                    line(sx, offsetY + startY * TILE_SIZE * scale, sx, offsetY + endY * TILE_SIZE * scale);
                }
                for (let y = startY; y <= endY; y++) {
                    let sy = offsetY + y * TILE_SIZE * scale;
                    line(offsetX + startX * TILE_SIZE * scale, sy, offsetX + endX * TILE_SIZE * scale, sy);
                }
            }
        }

        // ============================================================
        //  UI & STATS
        // ============================================================
        function updateStats() {
            document.getElementById('stat-pop').textContent = agents.length;
            document.getElementById('stat-sett').textContent = settlements.length;
            let totalEcon = settlements.reduce((sum, s) => sum + s.economy, 0);
            document.getElementById('stat-econ').textContent = Math.floor(totalEcon);
            document.getElementById('stat-wars').textContent = wars.length;
            document.getElementById('stat-trade').textContent = tradeRoutes.length;
            let tech = settlements.reduce((sum, s) => sum + s.techLevel, 0) / (settlements.length || 1);
            document.getElementById('stat-tech').textContent = tech.toFixed(2);
            // Average traits
            let agg = agents.reduce((sum, a) => sum + a.traits.strength + a.traits.intelligence + a.traits.aggression, 0);
            document.getElementById('stat-trait').textContent = (agg / (agents.length * 3 || 1)).toFixed(2);
        }

        function notify(msg) {
            let area = document.getElementById('notification-area');
            let div = document.createElement('div');
            div.className = 'notify';
            div.textContent = msg;
            area.appendChild(div);
            setTimeout(() => div.remove(), 4000);
            // keep only last 5
            while (area.children.length > 5) {
                area.removeChild(area.firstChild);
            }
        }

        // ============================================================
        //  P5 SETUP & MAIN LOOP
        // ============================================================
        function setup() {
            canvasWrap = document.getElementById('canvas-wrap');
            const canvas = createCanvas(870, 700);
            canvas.parent('canvas-wrap');
            pixelDensity(1);
            colorMode(RGB, 255);
            textFont('Arial');

            // seed noise
            noiseSeed(42);

            // generate world
            generateWorld();

            // UI bindings
            setupUI();

            // Start sim after a moment
            simRunning = true;
            paused = false;
        }

        function setupUI() {
            // Pause button
            document.getElementById('pause-btn').addEventListener('click', () => {
                paused = !paused;
                document.getElementById('pause-btn').textContent = paused ? '▶ Play' : '⏸ Pause';
            });

            // Reset
            document.getElementById('reset-btn').addEventListener('click', () => {
                resetSimulation();
            });

            // Speed slider
            const speedSlider = document.getElementById('speed-slider');
            speedSlider.addEventListener('input', () => {
                simSpeed = parseInt(speedSlider.value);
                document.getElementById('speed-value').textContent = simSpeed + 'x';
            });

            // Max pop slider
            const maxPopSlider = document.getElementById('max-pop-slider');
            maxPopSlider.addEventListener('input', () => {
                maxPop = parseInt(maxPopSlider.value);
                document.getElementById('max-pop-value').textContent = maxPop;
            });

            // Add agent
            document.getElementById('add-agent-btn').addEventListener('click', () => {
                let x = width / 2;
                let y = height / 2;
                let wx = (x - width / 2) / camZoom + camX;
                let wy = (y - height / 2) / camZoom + camY;
                let culture = 'Foreign_' + Math.floor(Math.random() * 1000);
                let a = new Agent(wx, wy, pickTraitFromCulture(culture));
                a.culture = culture;
                agents.push(a);
                notify('➕ Foreign agent added');
            });

            // Event buttons
            let eventBtns = document.querySelectorAll('.event-buttons button');
            eventBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    triggerEvent(btn.dataset.event);
                });
            });

            // Overlay checkboxes
            document.getElementById('ov-terrain').checked = ovTerrain;
            document.getElementById('ov-climate').checked = ovClimate;
            document.getElementById('ov-resources').checked = ovResources;
            document.getElementById('ov-agents').checked = ovAgents;
            document.getElementById('ov-settlements').checked = ovSettlements;
            document.getElementById('ov-trade').checked = ovTrade;
            document.getElementById('ov-wars').checked = ovWars;
            document.getElementById('ov-names').checked = ovNames;

            document.getElementById('ov-terrain').addEventListener('change', e => ovTerrain = e.target.checked);
            document.getElementById('ov-climate').addEventListener('change', e => ovClimate = e.target.checked);
            document.getElementById('ov-resources').addEventListener('change', e => ovResources = e.target.checked);
            document.getElementById('ov-agents').addEventListener('change', e => ovAgents = e.target.checked);
            document.getElementById('ov-settlements').addEventListener('change', e => ovSettlements = e.target.checked);
            document.getElementById('ov-trade').addEventListener('change', e => ovTrade = e.target.checked);
            document.getElementById('ov-wars').addEventListener('change', e => ovWars = e.target.checked);
            document.getElementById('ov-names').addEventListener('change', e => ovNames = e.target.checked);
        }

        function resetSimulation() {
            agents = [];
            settlements = [];
            tradeRoutes = [];
            wars = [];
            generateWorld();
            paused = false;
            document.getElementById('pause-btn').textContent = '⏸ Pause';
            notify('Simulation reset');
        }

        // ============================================================
        //  CAMERA / INTERACTION
        // ============================================================
        function mousePressed() {
            if (mouseX >= 0 && mouseX < width && mouseY >= 0 && mouseY < height) {
                if (mouseButton === CENTER) {
                    dragging = true;
                    lastMouseX = mouseX;
                    lastMouseY = mouseY;
                } else if (mouseButton === RIGHT) {
                    // maybe right-click to inspect agent
                }
            }
        }

        function mouseReleased() {
            dragging = false;
        }

        function mouseDragged() {
            if (dragging) {
                camX -= (mouseX - lastMouseX) / camZoom;
                camY -= (mouseY - lastMouseY) / camZoom;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
            }
        }

        function mouseWheel(event) {
            let zoomFactor = event.delta > 0 ? 0.9 : 1.1;
            camZoom = Math.max(0.2, Math.min(8, camZoom * zoomFactor));
            // zoom towards mouse
            let w = width;
            let h = height;
            let beforeX = (mouseX - w / 2) / camZoom + camX;
            let beforeY = (mouseY - h / 2) / camZoom + camY;
            camZoom = Math.max(0.2, Math.min(8, camZoom * zoomFactor));
            let afterX = (mouseX - w / 2) / camZoom + camX;
            let afterY = (mouseY - h / 2) / camZoom + camY;
            camX += beforeX - afterX;
            camY += beforeY - afterY;
            return false;
        }

        // ============================================================
        //  LOOP
        // ============================================================
        function draw() {
            if (!simRunning) return;

            // Control sim speed
            if (!paused) {
                let dt = deltaTime / 1000;
                updateSimulation(dt);
            }

            drawWorld();
            updateStats();

            // Show camera info
            fill(255,255,255,150);
            textSize(12);
            text(`cam (${camX.toFixed(0)}, ${camY.toFixed(0)}) zoom ${camZoom.toFixed(2)}`, 10, 10);
        }

        // Call setup once
        window.setup = setup;
        window.draw = draw;
        window.mousePressed = mousePressed;
        window.mouseReleased = mouseReleased;
        window.mouseDragged = mouseDragged;
        window.mouseWheel = mouseWheel;
    </script>
