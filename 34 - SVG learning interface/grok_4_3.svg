<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <!-- Gradients and styles -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F6F1"/>
      <stop offset="100%" stop-color="#F0EBE3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9F6F0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4A7C59"/>
      <stop offset="100%" stop-color="#3A6648"/>
    </linearGradient>
    <linearGradient id="flowerGreen" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5A8C6B"/>
      <stop offset="100%" stop-color="#3F664D"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8A4B8"/>
      <stop offset="100%" stop-color="#D88A9E"/>
    </linearGradient>
    
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5A8C6B"/>
    </marker>
    
    <style>
      .label-tile { fill: #FFFFFF; stroke: #C9B8A8; stroke-width: 1.5; }
      .label-tile:hover { fill: #F9F6F0; }
      .popup { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
      .popup:target { opacity: 1; pointer-events: all; }
      .nav-btn { cursor: pointer; }
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1800" height="1200" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid texture -->
  <g opacity="0.04">
    <path d="M0 0 L1800 0 L1800 1200 L0 1200 Z" fill="none" stroke="#3A6648" stroke-width="40"/>
  </g>
  
  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1800" height="92" fill="#3A6648"/>
  <text x="900" y="58" font-family="Georgia, serif" font-size="36" font-weight="600" fill="#FFFFFF" text-anchor="middle">Flower Anatomy Drag &amp; Drop</text>
  
  <!-- Main Content Card -->
  <rect x="40" y="115" width="1720" height="1060" rx="20" ry="20" fill="#FFFFFF" filter="url(#softShadow)"/>
  
  <!-- Central Flower Diagram -->
  <g id="diagram">
    <!-- Background circle for diagram area -->
    <rect x="80" y="145" width="920" height="780" rx="16" ry="16" fill="#FAF7F2"/>
    
    <!-- Title for diagram -->
    <text x="540" y="185" font-size="22" font-weight="600" fill="#2C2520" text-anchor="middle">Flower Cross-Section</text>
    
    <!-- Receptacle -->
    <ellipse cx="540" cy="620" rx="68" ry="32" fill="#8B7355"/>
    
    <!-- Sepals (green base leaves) -->
    <ellipse cx="450" cy="595" rx="42" ry="18" fill="#5A8C6B" transform="rotate(-35 450 595)"/>
    <ellipse cx="630" cy="595" rx="42" ry="18" fill="#5A8C6B" transform="rotate(35 630 595)"/>
    <ellipse cx="500" cy="610" rx="38" ry="16" fill="#4A7C59" transform="rotate(-20 500 610)"/>
    <ellipse cx="580" cy="610" rx="38" ry="16" fill="#4A7C59" transform="rotate(20 580 610)"/>
    
    <!-- Petals -->
    <ellipse cx="420" cy="480" rx="48" ry="95" fill="url(#petalGrad)" transform="rotate(-55 420 480)"/>
    <ellipse cx="660" cy="480" rx="48" ry="95" fill="url(#petalGrad)" transform="rotate(55 660 480)"/>
    <ellipse cx="380" cy="540" rx="45" ry="88" fill="#E8A4B8" transform="rotate(-75 380 540)"/>
    <ellipse cx="700" cy="540" rx="45" ry="88" fill="#E8A4B8" transform="rotate(75 700 540)"/>
    <ellipse cx="540" cy="420" rx="55" ry="95" fill="#D88A9E"/>
    <ellipse cx="460" cy="450" rx="42" ry="80" fill="#E8A4B8" transform="rotate(-25 460 450)"/>
    <ellipse cx="620" cy="450" rx="42" ry="80" fill="#E8A4B8" transform="rotate(25 620 450)"/>
    
    <!-- Pistil (central) -->
    <!-- Ovary -->
    <ellipse cx="540" cy="570" rx="26" ry="38" fill="#C9A86C"/>
    <!-- Style -->
    <rect x="532" y="420" width="16" height="155" fill="#8B7355" rx="3"/>
    <!-- Stigma -->
    <ellipse cx="540" cy="415" rx="22" ry="14" fill="#B8735C"/>
    
    <!-- Stamen (left) -->
    <!-- Filament left -->
    <rect x="470" y="465" width="9" height="105" fill="#6B8E6B" rx="2"/>
    <!-- Anther left -->
    <ellipse cx="474" cy="455" rx="18" ry="28" fill="#8B9E6B"/>
    
    <!-- Stamen (right) -->
    <!-- Filament right -->
    <rect x="602" y="465" width="9" height="105" fill="#6B8E6B" rx="2"/>
    <!-- Anther right -->
    <ellipse cx="606" cy="455" rx="18" ry="28" fill="#8B9E6B"/>
    
    <!-- Additional stamens -->
    <rect x="505" y="455" width="8" height="98" fill="#6B8E6B" rx="2"/>
    <ellipse cx="509" cy="445" rx="15" ry="22" fill="#8B9E6B"/>
    <rect x="568" y="455" width="8" height="98" fill="#6B8E6B" rx="2"/>
    <ellipse cx="572" cy="445" rx="15" ry="22" fill="#8B9E6B"/>
    
    <!-- Label Slots (empty) with dashed borders -->
    <!-- Petal slot -->
    <rect x="260" y="310" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Sepal slot -->
    <rect x="310" y="640" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Stamen slot -->
    <rect x="710" y="430" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Pistil slot -->
    <rect x="710" y="380" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Anther slot -->
    <rect x="260" y="430" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Filament slot -->
    <rect x="260" y="480" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Ovary slot -->
    <rect x="310" y="580" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Style slot -->
    <rect x="710" y="330" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Stigma slot -->
    <rect x="710" y="280" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    <!-- Receptacle slot -->
    <rect x="310" y="700" width="118" height="36" rx="8" ry="8" fill="none" stroke="#C9B8A8" stroke-width="2" stroke-dasharray="6 3"/>
    
    <!-- Connecting arrows -->
    <g stroke="#5A8C6B" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)">
      <!-- Petal arrow -->
      <line x1="378" y1="360" x2="310" y2="328"/>
      <!-- Sepal arrow -->
      <line x1="470" y1="605" x2="370" y2="658"/>
      <!-- Stamen arrow -->
      <line x1="625" y1="445" x2="710" y2="448"/>
      <!-- Pistil arrow -->
      <line x1="555" y1="415" x2="710" y2="398"/>
      <!-- Anther arrow -->
      <line x1="492" y1="455" x2="378" y2="448"/>
      <!-- Filament arrow -->
      <line x1="479" y1="515" x2="378" y2="498"/>
      <!-- Ovary arrow -->
      <line x1="566" y1="570" x2="428" y2="598"/>
      <!-- Style arrow -->
      <line x1="548" y1="500" x2="710" y2="348"/>
      <!-- Stigma arrow -->
      <line x1="540" y1="415" x2="710" y2="298"/>
      <!-- Receptacle arrow -->
      <line x1="540" y1="652" x2="428" y2="718"/>
    </g>
    
    <!-- Part labels on diagram (subtle) -->
    <text x="540" y="635" font-size="13" fill="#8B7355" text-anchor="middle" font-weight="500">receptacle</text>
  </g>
  
  <!-- Word Bank -->
  <g id="wordbank">
    <rect x="1040" y="145" width="680" height="300" rx="16" ry="16" fill="#FAF7F2"/>
    <text x="1380" y="180" font-size="18" font-weight="600" fill="#2C2520" text-anchor="middle">Word Bank</text>
    
    <!-- Label tiles -->
    <g>
      <!-- Row 1 -->
      <rect x="1070" y="205" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1139" y="233" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">petal</text>
      
      <rect x="1225" y="205" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1294" y="233" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">sepal</text>
      
      <rect x="1380" y="205" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1449" y="233" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">stamen</text>
      
      <rect x="1535" y="205" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1604" y="233" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">pistil</text>
      
      <!-- Row 2 -->
      <rect x="1070" y="260" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1139" y="288" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">anther</text>
      
      <rect x="1225" y="260" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1294" y="288" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">filament</text>
      
      <rect x="1380" y="260" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1449" y="288" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">ovary</text>
      
      <rect x="1535" y="260" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1604" y="288" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">style</text>
      
      <!-- Row 3 -->
      <rect x="1148" y="315" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1217" y="343" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">stigma</text>
      
      <rect x="1313" y="315" width="138" height="42" rx="21" ry="21" class="label-tile" filter="url(#softShadow)"/>
      <text x="1382" y="343" font-size="15" fill="#3A6648" text-anchor="middle" font-weight="600">receptacle</text>
    </g>
  </g>
  
  <!-- Right Instruction Panel -->
  <g>
    <rect x="1040" y="465" width="680" height="460" rx="16" ry="16" fill="#FAF7F2"/>
    <text x="1380" y="500" font-size="18" font-weight="600" fill="#2C2520" text-anchor="middle">Instructions</text>
    
    <text x="1070" y="545" font-size="14.5" fill="#4A4038">
      <tspan x="1070" dy="0">1. Drag labels from the word bank</tspan>
      <tspan x="1070" dy="26">   to the correct dashed slots.</tspan>
      <tspan x="1070" dy="32">2. Match each part to its location</tspan>
      <tspan x="1070" dy="26">   on the flower diagram.</tspan>
      <tspan x="1070" dy="32">3. Use the buttons below to check</tspan>
      <tspan x="1070" dy="26">   your answers or get hints.</tspan>
    </text>
    
    <text x="1070" y="680" font-size="13" fill="#7B6F63">Parts to identify:</text>
    <text x="1070" y="705" font-size="13" fill="#4A4038">petal • sepal • stamen • pistil</text>
    <text x="1070" y="725" font-size="13" fill="#4A4038">anther • filament • ovary • style</text>
    <text x="1070" y="745" font-size="13" fill="#4A4038">stigma • receptacle</text>
  </g>
  
  <!-- Control Buttons -->
  <g>
    <!-- Hint Button -->
    <a href="#hint">
      <rect x="1070" y="950" width="195" height="48" rx="24" ry="24" fill="#5A8C6B" class="nav-btn"/>
      <text x="1167" y="982" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Hint</text>
    </a>
    
    <!-- Check Answer Button -->
    <a href="#check">
      <rect x="1285" y="950" width="195" height="48" rx="24" ry="24" fill="#4A7C59" class="nav-btn"/>
      <text x="1382" y="982" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Check Answer</text>
    </a>
    
    <!-- Reset Button -->
    <a href="#reset">
      <rect x="1500" y="950" width="195" height="48" rx="24" ry="24" fill="#8B7355" class="nav-btn"/>
      <text x="1597" y="982" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">Reset</text>
    </a>
  </g>
  
  <!-- Inset Pollination Diagram -->
  <g>
    <rect x="80" y="945" width="920" height="200" rx="16" ry="16" fill="#FAF7F2"/>
    <text x="540" y="980" font-size="16" font-weight="600" fill="#2C2520" text-anchor="middle">Pollination Process</text>
    
    <!-- Simple bee and flower -->
    <ellipse cx="320" cy="1045" rx="38" ry="22" fill="#F4D35E"/>
    <circle cx="295" cy="1040" r="14" fill="#F4D35E"/>
    <!-- Wings -->
    <ellipse cx="305" cy="1030" rx="14" ry="7" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="335" cy="1030" rx="14" ry="7" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Arrow to flower -->
    <line x1="360" y1="1045" x2="440" y2="1045" stroke="#5A8C6B" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- Mini flower -->
    <ellipse cx="540" cy="1045" rx="22" ry="12" fill="#E8A4B8"/>
    <ellipse cx="540" cy="1030" rx="8" ry="18" fill="#E8A4B8"/>
    <ellipse cx="510" cy="1048" rx="8" ry="14" fill="#E8A4B8" transform="rotate(-35 510 1048)"/>
    <ellipse cx="570" cy="1048" rx="8" ry="14" fill="#E8A4B8" transform="rotate(35 570 1048)"/>
    <circle cx="540" cy="1045" r="6" fill="#C9A86C"/>
    
    <text x="700" y="1035" font-size="13" fill="#4A4038" text-anchor="middle">Pollen is transferred</text>
    <text x="700" y="1055" font-size="13" fill="#4A4038" text-anchor="middle">from anther to stigma</text>
    <text x="700" y="1080" font-size="12" fill="#7B6F63" text-anchor="middle">enabling fertilization</text>
  </g>
  
  <!-- ==================== POPUPS ==================== -->
  
  <!-- Hint Popup -->
  <g id="hint" class="popup">
    <rect x="450" y="280" width="900" height="620" rx="20" ry="20" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="450" y="280" width="900" height="620" rx="20" ry="20" fill="#FAF7F2"/>
    
    <text x="900" y="335" font-size="26" font-weight="600" fill="#2C2520" text-anchor="middle">Hint</text>
    
    <text x="490" y="390" font-size="16" fill="#4A4038">
      <tspan x="490" dy="0">• Petals are the colorful outer parts that attract pollinators.</tspan>
      <tspan x="490" dy="28">• Sepals are the green leaf-like structures at the base.</tspan>
      <tspan x="490" dy="28">• The stamen (male part) consists of the filament and anther.</tspan>
      <tspan x="490" dy="28">• The pistil (female part) includes the stigma, style, and ovary.</tspan>
      <tspan x="490" dy="28">• The receptacle is the thickened part of the stem that supports</tspan>
      <tspan x="490" dy="28">   the flower.</tspan>
    </text>
    
    <a href="#">
      <rect x="780" y="810" width="240" height="52" rx="26" ry="26" fill="#5A8C6B"/>
      <text x="900" y="843" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">Close</text>
    </a>
  </g>
  
  <!-- Check Answer Popup -->
  <g id="check" class="popup">
    <rect x="450" y="280" width="900" height="620" rx="20" ry="20" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="450" y="280" width="900" height="620" rx="20" ry="20" fill="#FAF7F2"/>
    
    <text x="900" y="335" font-size="26" font-weight="600" fill="#2C2520" text-anchor="middle">Answer Key</text>
    
    <g font-size="15.5" fill="#4A4038">
      <text x="510" y="390">Petal → Colorful outer structures</text>
      <text x="510" y="420">Sepal → Protective green base leaves</text>
      <text x="510" y="450">Stamen → Male reproductive organ</text>
      <text x="510" y="480">Pistil → Female reproductive organ</text>
      <text x="510" y="510">Anther → Pollen-producing tip of stamen</text>
      <text x="510" y="540">Filament → Stalk supporting the anther</text>
      <text x="510" y="570">Ovary → Contains ovules</text>
      <text x="510" y="600">Style → Connects stigma to ovary</text>
      <text x="510" y="630">Stigma → Receives pollen</text>
      <text x="510" y="660">Receptacle → Supports the flower</text>
    </g>
    
    <a href="#">
      <rect x="780" y="810" width="240" height="52" rx="26" ry="26" fill="#5A8C6B"/>
      <text x="900" y="843" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">Close</text>
    </a>
  </g>
  
  <!-- Reset Popup -->
  <g id="reset" class="popup">
    <rect x="550" y="380" width="700" height="420" rx="20" ry="20" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="550" y="380" width="700" height="420" rx="20" ry="20" fill="#FAF7F2"/>
    
    <text x="900" y="445" font-size="24" font-weight="600" fill="#2C2520" text-anchor="middle">Reset Complete</text>
    
    <text x="620" y="510" font-size="16" fill="#4A4038" text-anchor="middle">All labels have been returned to the word bank.</text>
    <text x="620" y="538" font-size="16" fill="#4A4038" text-anchor="middle">The diagram is ready for a new attempt.</text>
    
    <a href="#">
      <rect x="780" y="680" width="240" height="52" rx="26" ry="26" fill="#8B7355"/>
      <text x="900" y="713" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600">Close</text>
    </a>
  </g>
  
</svg>