<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f8fafc"/>
<stop offset="100%" stop-color="#e6eef7"/>
</linearGradient>
<linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
</filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
</marker>
<style>
<![CDATA[
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#1a2b3c}
.title{font-size:48px;font-weight:700;fill:#0f172a}
.subtitle{font-size:18px;fill:#475569}
.panelTitle{font-size:22px;font-weight:600;fill:#0f172a}
.body{font-size:16px;fill:#334155}
.small{font-size:14px;fill:#475569}
.buttonText{font-size:16px;font-weight:600;fill:#ffffff;text-anchor:middle;dominant-baseline:middle}
.bankLabel{font-size:16px;font-weight:500;text-anchor:middle;dominant-baseline:middle}
.slotLabel{font-size:13px;text-anchor:middle;dominant-baseline:middle}
.popup{visibility:hidden}
.popup:target{visibility:visible}
]]>
</style>
</defs>

<rect width="1800" height="1200" fill="url(#bgGrad)"/>
<rect x="40" y="40" width="1720" height="1120" rx="24" fill="url(#cardGrad)" stroke="#e2e8f0" filter="url(#softShadow)"/>

<text x="80" y="110" class="title">Flower Anatomy Drag &amp; Drop</text>
<text x="80" y="145" class="subtitle">A modern textbook interactive study sheet — SVG only, anchor-based popups</text>

<g id="controls" transform="translate(1240,80)">
<a href="#hint"><rect x="0" y="0" width="110" height="44" rx="22" fill="#0ea5e9"/><text x="55" y="26" class="buttonText">Hint</text></a>
<a href="#check"><rect x="130" y="0" width="150" height="44" rx="22" fill="#10b981"/><text x="205" y="26" class="buttonText">Check Answer</text></a>
<a href="#reset"><rect x="300" y="0" width="110" height="44" rx="22" fill="#f59e0b"/><text x="355" y="26" class="buttonText">Reset</text></a>
</g>

<!-- Instruction Panel -->
<g transform="translate(1180,220)">
<rect width="560" height="360" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
<text x="30" y="40" class="panelTitle">Instructions</text>
<text x="30" y="80" class="body">1. Study the central flower diagram.</text>
<text x="30" y="110" class="body">2. Drag labels from the Word Bank to the empty slots.</text>
<text x="30" y="140" class="body">3. Use Hint for guidance, Check Answer to review, Reset to clear.</text>
<rect x="30" y="180" width="500" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="50" y="210" class="small">Parts to identify:</text>
<text x="50" y="240" class="small">• Petal • Sepal • Stamen • Pistil • Anther</text>
<text x="50" y="265" class="small">• Filament • Ovary • Style • Stigma • Receptacle</text>
<text x="30" y="350" class="small">Tip: The flower is drawn with leader arrows for reference.</text>
</g>

<!-- Central Flower Diagram -->
<g transform="translate(900,600)">
<!-- stem -->
<rect x="-10" y="120" width="20" height="220" rx="10" fill="#6aa84f"/>
<!-- leaves -->
<ellipse cx="-40" cy="180" rx="35" ry="18" fill="#7bb85a" transform="rotate(-20 -40 180)"/>
<ellipse cx="40" cy="220" rx="35" ry="18" fill="#7bb85a" transform="rotate(20 40 220)"/>
<!-- receptacle -->
<ellipse cx="0" cy="0" rx="90" ry="70" fill="#fde68a" stroke="#fbbf24" stroke-width="2"/>
<!-- sepals -->
<g fill="#22c55e" stroke="#16a34a" stroke-width="1.5">
<ellipse cx="-60" cy="55" rx="18" ry="30"/>
<ellipse cx="0" cy="85" rx="18" ry="30"/>
<ellipse cx="60" cy="55" rx="18" ry="30"/>
</g>
<!-- petals -->
<g fill="#f472b6" stroke="#ec4899" stroke-width="1.5">
<ellipse cx="0" cy="-80" rx="55" ry="90"/>
<ellipse cx="75" cy="-30" rx="55" ry="90" transform="rotate(30 75 -30)"/>
<ellipse cx="45" cy="50" rx="55" ry="90" transform="rotate(60 45 50)"/>
<ellipse cx="-45" cy="50" rx="55" ry="90" transform="rotate(-60 -45 50)"/>
<ellipse cx="-75" cy="-30" rx="55" ry="90" transform="rotate(-30 -75 -30)"/>
</g>
<!-- pistil -->
<rect x="-6" y="-40" width="12" height="70" rx="6" fill="#facc15"/>
<ellipse cx="0" cy="-55" rx="18" ry="18" fill="#fde047"/>
<!-- stamen -->
<g stroke="#a16207" stroke-width="3" stroke-linecap="round">
<line x1="-30" y1="-10" x2="-30" y2="20"/>
<line x1="30" y1="-10" x2="30" y2="20"/>
<line x1="-15" y1="30" x2="-15" y2="60"/>
<line x1="15" y1="30" x2="15" y2="60"/>
</g>
<g fill="#facc15">
<circle cx="-30" cy="25" r="6"/>
<circle cx="30" cy="25" r="6"/>
<circle cx="-15" cy="65" r="6"/>
<circle cx="15" cy="65" r="6"/>
</g>
<!-- leader arrows and slots -->
<g stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)">
<line x1="110" y1="-90" x2="170" y2="-120"/>
<line x1="110" y1="-10" x2="170" y2="-60"/>
<line x1="110" y1="70" x2="170" y2="20"/>
<line x1="-110" y1="-10" x2="-170" y2="-60"/>
<line x1="-110" y1="70" x2="-170" y2="20"/>
<line x1="0" y1="120" x2="0" y2="170"/>
<line x1="110" y1="120" x2="170" y2="150"/>
<line x1="-110" y1="120" x2="-170" y2="150"/>
</g>
<g fill="none" stroke="#94a3b8" stroke-dasharray="4 4">
<circle cx="190" cy="-130" r="32"/>
<circle cx="190" cy="-70" r="32"/>
<circle cx="190" cy="10" r="32"/>
<circle cx="-190" cy="-70" r="32"/>
<circle cx="-190" cy="10" r="32"/>
<circle cx="0" cy="200" r="32"/>
<circle cx="190" cy="170" r="32"/>
<circle cx="-190" cy="170" r="32"/>
</g>
<text x="190" y="-130" class="slotLabel">Petal</text>
<text x="190" y="-70" class="slotLabel">Sepal</text>
<text x="190" y="10" class="slotLabel">Stamen</text>
<text x="-190" y="-70" class="slotLabel">Pistil</text>
<text x="-190" y="10" class="slotLabel">Anther</text>
<text x="0" y="200" class="slotLabel">Receptacle</text>
<text x="190" y="170" class="slotLabel">Filament</text>
<text x="-190" y="170" class="slotLabel">Ovary</text>
</g>

<!-- Additional labels for style/stigma -->
<g transform="translate(900,600)">
<line x1="0" y1="-40" x2="-150" y2="-120" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="-170" cy="-140" r="32" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
<text x="-170" y="-140" class="slotLabel">Style</text>
<line x1="0" y1="-55" x2="150" y2="-130" stroke="#64748b" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="170" cy="-150" r="32" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
<text x="170" y="-150" class="slotLabel">Stigma</text>
</g>

<!-- Word Bank -->
<g transform="translate(80,980)">
<text x="0" y="-20" class="panelTitle">Word Bank</text>
<g fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)">
<rect x="0" y="0" width="160" height="54" rx="18"/>
<rect x="180" y="0" width="160" height="54" rx="18"/>
<rect x="360" y="0" width="160" height="54" rx="18"/>
<rect x="540" y="0" width="160" height="54" rx="18"/>
<rect x="720" y="0" width="160" height="54" rx="18"/>
<rect x="0" y="74" width="160" height="54" rx="18"/>
<rect x="180" y="74" width="160" height="54" rx="18"/>
<rect x="360" y="74" width="160" height="54" rx="18"/>
<rect x="540" y="74" width="160" height="54" rx="18"/>
<rect x="720" y="74" width="160" height="54" rx="18"/>
</g>
<text x="80" y="34" class="bankLabel">petal</text>
<text x="260" y="34" class="bankLabel">sepal</text>
<text x="440" y="34" class="bankLabel">stamen</text>
<text x="620" y="34" class="bankLabel">pistil</text>
<text x="800" y="34" class="bankLabel">anther</text>
<text x="80" y="108" class="bankLabel">filament</text>
<text x="260" y="108" class="bankLabel">ovary</text>
<text x="440" y="108" class="bankLabel">style</text>
<text x="620" y="108" class="bankLabel">stigma</text>
<text x="800" y="108" class="bankLabel">receptacle</text>
</g>

<!-- Pollination inset -->
<g transform="translate(1180,620)">
<rect width="560" height="220" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
<text x="30" y="40" class="panelTitle">Pollination Overview</text>
<ellipse cx="150" cy="120" rx="70" ry="50" fill="#fde68a"/>
<ellipse cx="150" cy="120" rx="40" ry="30" fill="#f472b6"/>
<circle cx="130" cy="110" r="6" fill="#facc15"/>
<circle cx="170" cy="130" r="6" fill="#facc15"/>
<rect x="240" y="90" width="20" height="80" rx="10" fill="#6aa84f"/>
<ellipse cx="250" cy="80" rx="20" ry="10" fill="#7bb85a"/>
<path d="M260 100 C320 80,380 120,420 100" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
<circle cx="430" cy="95" r="12" fill="#111827"/>
<text x="30" y="190" class="small">Pollen moves from anther to stigma via wind, insects, or water.</text>
</g>

<!-- Popups -->
<g id="hint" class="popup">
<rect x="400" y="300" width="1000" height="600" rx="24" fill="rgba(15,23,42,0.85)"/>
<rect x="450" y="340" width="900" height="520" rx="20" fill="#ffffff"/>
<text x="500" y="400" class="panelTitle">Hint</text>
<text x="500" y="450" class="body">Petal: colorful outer part that attracts pollinators.</text>
<text x="500" y="490" class="body">Sepal: green protective leaf under petals.</text>
<text x="500" y="530" class="body">Stamen = filament + anther; produces pollen.</text>
<text x="500" y="570" class="body">Pistil = stigma + style + ovary; receives pollen.</text>
<a href="#"><rect x="1200" y="360" width="120" height="40" rx="20" fill="#ef4444"/><text x="1260" y="387" class="buttonText" fill="#fff">Close</text></a>
</g>

<g id="check" class="popup">
<rect x="400" y="300" width="1000" height="600" rx="24" fill="rgba(15,23,42,0.85)"/>
<rect x="450" y="340" width="900" height="520" rx="20" fill="#ffffff"/>
<text x="500" y="400" class="panelTitle">Check Answer</text>
<text x="500" y="450" class="body">In this static view, labels are shown in place with leader arrows.</text>
<text x="500" y="490" class="body">Petal → pink outer lobes</text>
<text x="500" y="520" class="body">Sepal → green basal lobes</text>
<text x="500" y="550" class="body">Stamen → filament with anther</text>
<text x="500" y="580" class="body">Pistil → central style, stigma, ovary</text>
<a href="#"><rect x="1200" y="360" width="120" height="40" rx="20" fill="#ef4444"/><text x="1260" y="387" class="buttonText" fill="#fff">Close</text></a>
</g>

<g id="reset" class="popup">
<rect x="400" y="300" width="1000" height="600" rx="24" fill="rgba(15,23,42,0.85)"/>
<rect x="450" y="340" width="900" height="520" rx="20" fill="#ffffff"/>
<text x="500" y="400" class="panelTitle">Reset</text>
<text x="500" y="470" class="body">Word bank refreshed. Return to the diagram and try matching again.</text>
<text x="500" y="510" class="small">In a true interactive version this would clear placements.</text>
<a href="#"><rect x="1200" y="360" width="120" height="40" rx="20" fill="#ef4444"/><text x="1260" y="387" class="buttonText" fill="#fff">Close</text></a>
</g>

</svg>
