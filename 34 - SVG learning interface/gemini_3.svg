<svg viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&amp;display=swap');
            text { font-family: 'Segoe UI', Tahoma, sans-serif; }
            
            /* Logic: CSS :target toggles visibility of groups */
            .overlay { visibility: hidden; opacity: 0; transition: opacity 0.3s; }
            #check-layer:target, #hint-layer:target, #pollination-panel:target { 
                visibility: visible; 
                opacity: 1; 
            }
            
            /* Button Hover States */
            .btn { cursor: pointer; transition: transform 0.2s; }
            .btn:hover { transform: translateY(-2px); }
            .tile { cursor: grab; }
            .target-box { fill: #f8f9fa; stroke: #dee2e6; stroke-dasharray: 4; }
            
            /* Hidden by default, shown on Check Answer */
            .correct-label { visibility: hidden; pointer-events: none; }
            #check-layer:target .correct-label { visibility: visible; }
            
            /* Hint Logic */
            .hint-text { visibility: hidden; fill: #6c757d; font-style: italic; }
            #hint-layer:target .hint-text { visibility: visible; }
            
            /* Close Buttons */
            .close-btn:hover { fill: #c0392b !important; }
        </style>

        <!-- Gradients and Shadows -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#f5f7fa" />
            <stop offset="100%" style="stop-color:#c3cfe2" />
        </linearGradient>

        <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff9a9e" />
            <stop offset="100%" style="stop-color:#fecfef" />
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
            <feOffset dx="2" dy="4" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Main Background -->
    <rect width="1800" height="1200" fill="url(#bgGrad)" />

    <!-- UI Header -->
    <rect width="1800" height="100" fill="#2c3e50" filter="url(#shadow)" />
    <text x="50" y="65" fill="white" font-size="32" font-weight="700">BIOLOGY INTERACTIVE: Flower Anatomy Drag &amp; Drop</text>
    <text x="1750" y="65" fill="#bdc3c7" font-size="18" text-anchor="end">Module 4.2: Plant Reproduction</text>

    <!-- Sidebar Instruction Panel -->
    <g transform="translate(1350, 150)">
        <rect width="400" height="400" rx="15" fill="white" filter="url(#shadow)" />
        <text x="30" y="50" fill="#2c3e50" font-size="24" font-weight="600">Instructions</text>
        <text x="30" y="90" fill="#7f8c8d" font-size="16">
            <tspan x="30" dy="1.4em">1. Identify the flower parts by</tspan>
            <tspan x="30" dy="1.4em">matching labels to the boxes.</tspan>
            <tspan x="30" dy="2.8em">2. Use the 'Hint' button if you</tspan>
            <tspan x="30" dy="1.4em">need help with the anther or style.</tspan>
            <tspan x="30" dy="2.8em">3. Click 'Check Answer' to verify</tspan>
            <tspan x="30" dy="1.4em">your placements.</tspan>
        </text>
        
        <!-- Action Buttons -->
        <a xlink:href="#hint-layer">
            <g class="btn" transform="translate(30, 320)">
                <rect width="100" height="45" rx="8" fill="#3498db" />
                <text x="50" y="28" fill="white" text-anchor="middle" font-weight="600">HINT</text>
            </g>
        </a>
        <a xlink:href="#check-layer">
            <g class="btn" transform="translate(140, 320)">
                <rect width="220" height="45" rx="8" fill="#27ae60" />
                <text x="110" y="28" fill="white" text-anchor="middle" font-weight="600">CHECK ANSWER</text>
            </g>
        </a>
    </g>

    <!-- WORD BANK (Bottom) -->
    <g transform="translate(100, 1000)">
        <rect width="1600" height="150" rx="15" fill="#ecf0f1" filter="url(#shadow)" />
        <text x="30" y="-15" fill="#34495e" font-size="20" font-weight="600">WORD BANK</text>
        
        <!-- Label Tiles -->
        <g transform="translate(30, 40)">
            <!-- Column 1 -->
            <g class="btn tile"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Petal</text></g>
            <g class="btn tile" transform="translate(160, 0)"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Sepal</text></g>
            <g class="btn tile" transform="translate(320, 0)"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Stamen</text></g>
            <g class="btn tile" transform="translate(480, 0)"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Pistil</text></g>
            <g class="btn tile" transform="translate(640, 0)"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Anther</text></g>
            
            <!-- Column 2 -->
            <g transform="translate(0, 55)">
                <g class="btn tile"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Filament</text></g>
                <g class="btn tile" transform="translate(160, 0)"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Ovary</text></g>
                <g class="btn tile" transform="translate(320, 0)"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Style</text></g>
                <g class="btn tile" transform="translate(480, 0)"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Stigma</text></g>
                <g class="btn tile" transform="translate(640, 0)"><rect width="140" height="40" rx="20" fill="white" stroke="#bdc3c7"/><text x="70" y="25" text-anchor="middle" fill="#2c3e50">Receptacle</text></g>
            </g>
        </g>
        
        <!-- Reset Button -->
        <a xlink:href="#">
            <g class="btn" transform="translate(1450, 50)">
                <rect width="120" height="50" rx="25" fill="#e74c3c" />
                <text x="60" y="32" fill="white" text-anchor="middle" font-weight="600">RESET</text>
            </g>
        </a>
    </g>

    <!-- CENTRAL DIAGRAM AREA -->
    <g transform="translate(100, 150)">
        <rect width="1200" height="800" rx="15" fill="white" filter="url(#shadow)" />
        
        <!-- FLOWER VECTOR DRAWING -->
        <g transform="translate(600, 700)">
            <!-- Stem and Receptacle -->
            <path d="M -20 100 Q 0 50 0 0 L 0 50 Q 20 100 20 100" fill="#4ea72e" />
            <path d="M -60 -20 Q 0 50 60 -20 L 40 -40 Q 0 -10 -40 -40 Z" fill="#2d5a27" /> <!-- Receptacle -->
            
            <!-- Sepals -->
            <path d="M -40 -20 Q -100 -50 -120 20 Q -60 30 -40 -20" fill="#4ea72e" />
            <path d="M 40 -20 Q 100 -50 120 20 Q 60 30 40 -20" fill="#4ea72e" />
            
            <!-- Petals -->
            <path d="M 0 -20 Q -150 -350 -300 -100 Q -150 50 0 -20" fill="url(#petalGrad)" opacity="0.9" />
            <path d="M 0 -20 Q 150 -350 300 -100 Q 150 50 0 -20" fill="url(#petalGrad)" opacity="0.9" />
            <path d="M 0 -20 Q -50 -450 0 -500 Q 50 -450 0 -20" fill="url(#petalGrad)" />
            
            <!-- Pistil (Female) -->
            <ellipse cx="0" cy="-60" rx="50" ry="70" fill="#d4efdf" stroke="#27ae60" stroke-width="3" /> <!-- Ovary -->
            <rect x="-10" y="-450" width="20" height="330" fill="#d4efdf" stroke="#27ae60" stroke-width="2" /> <!-- Style -->
            <rect x="-25" y="-470" width="50" height="30" rx="10" fill="#f1c40f" filter="url(#shadow)" /> <!-- Stigma -->
            
            <!-- Stamens (Male) -->
            <g>
                <path d="M -30 -60 Q -150 -150 -150 -300" fill="none" stroke="#95a5a6" stroke-width="4" />
                <rect x="-170" y="-330" width="40" height="20" rx="10" fill="#f39c12" /> <!-- Anther -->
                
                <path d="M 30 -60 Q 150 -150 150 -300" fill="none" stroke="#95a5a6" stroke-width="4" />
                <rect x="130" y="-330" width="40" height="20" rx="10" fill="#f39c12" />
            </g>
        </g>

        <!-- LABELS AND ARROWS -->
        <g id="ui-connectors">
            <!-- Labels Mapping: Left Side -->
            <g transform="translate(100, 100)">
                <line x1="140" y1="20" x2="350" y2="100" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Stigma</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Stigma</text>
            </g>

            <g transform="translate(100, 250)">
                <line x1="140" y1="20" x2="480" y2="100" stroke="#34495e" stroke-width="2" />
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Anther</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Anther</text>
            </g>

            <g transform="translate(100, 400)">
                <line x1="140" y1="20" x2="580" y2="150" stroke="#34495e" stroke-width="2" />
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Style</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Style</text>
            </g>

            <g transform="translate(100, 550)">
                <line x1="140" y1="20" x2="400" y2="500" stroke="#34495e" stroke-width="2" />
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Petal</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Petal</text>
            </g>

            <!-- Labels Mapping: Right Side -->
            <g transform="translate(950, 150)">
                <line x1="0" y1="20" x2="-200" y2="200" stroke="#34495e" stroke-width="2" />
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Filament</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Filament</text>
            </g>

            <g transform="translate(950, 300)">
                <line x1="0" y1="20" x2="-330" y2="350" stroke="#34495e" stroke-width="2" />
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Pistil</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Pistil</text>
            </g>

            <g transform="translate(950, 450)">
                <line x1="0" y1="20" x2="-350" y2="200" stroke="#34495e" stroke-width="2" />
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Stamen</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Stamen</text>
            </g>

            <g transform="translate(950, 600)">
                <line x1="0" y1="20" x2="-300" y2="50" stroke="#34495e" stroke-width="2" />
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Ovary</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Ovary</text>
            </g>

            <g transform="translate(950, 720)">
                <line x1="0" y1="20" x2="-400" y2="-50" stroke="#34495e" stroke-width="2" />
                <rect x="0" y="0" width="140" height="40" rx="5" class="target-box" />
                <text x="70" y="70" class="hint-text" text-anchor="middle">Sepal</text>
                <text x="70" y="28" class="correct-label" text-anchor="middle" fill="#2c3e50" font-weight="600">Sepal</text>
            </g>
        </g>
    </g>

    <!-- INSET DIAGRAM: Pollination -->
    <a xlink:href="#pollination-panel">
        <g transform="translate(1350, 580)" class="btn">
            <rect width="400" height="380" rx="15" fill="white" filter="url(#shadow)" />
            <text x="20" y="40" fill="#2c3e50" font-size="18" font-weight="600">Educational Inset: Pollination</text>
            
            <circle cx="200" cy="180" r="80" fill="#f8f9fa" stroke="#e0e0e0" />
            <path d="M 180 150 Q 200 100 220 150" fill="none" stroke="#f1c40f" stroke-width="3" />
            <circle cx="180" cy="150" r="5" fill="#f39c12" />
            <circle cx="220" cy="150" r="5" fill="#f39c12" />
            <text x="200" y="210" text-anchor="middle" font-size="12" fill="#7f8c8d">Click to Expand Process</text>
            
            <rect x="20" y="280" width="360" height="80" rx="10" fill="#f1f2f6" />
            <text x="40" y="315" font-size="14" fill="#2f3542">Pollination occurs when pollen</text>
            <text x="40" y="335" font-size="14" fill="#2f3542">is transferred to the stigma.</text>
        </g>
    </a>

    <!-- HIDDEN OVERLAY LAYERS -->
    
    <!-- Pollination Popup Panel -->
    <g id="pollination-panel" class="overlay">
        <rect width="1800" height="1200" fill="rgba(0,0,0,0.6)" />
        <g transform="translate(400, 200)">
            <rect width="1000" height="700" rx="20" fill="white" />
            <text x="50" y="60" font-size="32" font-weight="700" fill="#2c3e50">Pollination &amp; Fertilization</text>
            <a xlink:href="#">
                <circle cx="950" cy="50" r="20" fill="#e74c3c" class="close-btn" />
                <text x="950" y="58" text-anchor="middle" fill="white" font-weight="bold">X</text>
            </a>
            
            <g transform="translate(100, 150)">
                <rect width="250" height="400" rx="10" fill="#f9f9f9" stroke="#3498db" />
                <text x="125" y="40" text-anchor="middle" font-weight="bold">1. Transfer</text>
                <text x="20" y="80" font-size="14">Pollen grains move from</text>
                <text x="20" y="100" font-size="14">Anther to Stigma via</text>
                <text x="20" y="120" font-size="14">wind, water, or bees.</text>
            </g>
            <g transform="translate(375, 150)">
                <rect width="250" height="400" rx="10" fill="#f9f9f9" stroke="#3498db" />
                <text x="125" y="40" text-anchor="middle" font-weight="bold">2. Germination</text>
                <text x="20" y="80" font-size="14">Pollen tube grows down</text>
                <text x="20" y="100" font-size="14">the Style toward the</text>
                <text x="20" y="120" font-size="14">Ovary for fertilization.</text>
            </g>
            <g transform="translate(650, 150)">
                <rect width="250" height="400" rx="10" fill="#f9f9f9" stroke="#3498db" />
                <text x="125" y="40" text-anchor="middle" font-weight="bold">3. Seed Formation</text>
                <text x="20" y="80" font-size="14">Ovules are fertilized,</text>
                <text x="20" y="100" font-size="14">developing into seeds</text>
                <text x="20" y="120" font-size="14">while the ovary becomes</text>
                <text x="20" y="140" font-size="14">the fruit.</text>
            </g>
        </g>
    </g>

    <!-- Check Answer Feedback Layer (Transparent trigger) -->
    <g id="check-layer" class="overlay">
        <!-- This group simply activates the CSS .correct-label visibility -->
    </g>

    <!-- Hint Layer (Transparent trigger) -->
    <g id="hint-layer" class="overlay">
        <!-- This group simply activates the CSS .hint-text visibility -->
    </g>

</svg>