<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#D3E3F3"/>
    </linearGradient>
    <linearGradient id="btn-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74B9FF"/>
      <stop offset="100%" stop-color="#0984E3"/>      
    </linearGradient>
  </defs>
  <rect width="1800" height="1200" fill="url(#bg-gradient)"/>
<text x="900" y="100" font-size="40" text-anchor="middle">Flower Anatomy Drag and Drop</text>
  <g id="flower">
    <path d="M900 350 C950 350, 975 450, 900 500 C825 450, 850 350, 900 350 Z" fill="#FFC371" stroke="#FF7675"/>
    <path d="M900 500 C975 500, 1050 550, 1050 600 C1050 650, 1025 700, 1000 700 C975 700, 925 650, 900 600 C875 650, 825 700, 800 700 C775 700, 750 650, 750 600 C750 550, 825 500, 900 500 Z" fill="#E84393" stroke="#C2185B"/>
    <path d="M750 600 L900 825 L1050 600 Z" fill="#55E6C1" stroke="#218C74"/>
    <line x1="900" y1="825" x2="900" y2="1000" stroke="#AAAAAA" stroke-width="10"/>
    <circle cx="900" cy="1025" r="25" fill="#AAAAAA"/>
  </g>
  <g id="labels">
    <g id="label-petal">
      <rect x="775" y="400" width="80" height="40" rx="10" fill="url(#btn-gradient)" stroke="white" stroke-width="2"/>
      <text x="815" y="427" text-anchor="middle" font-size="20" fill="white">Petal</text> 
    </g>
    <g id="label-sepal">  
      <rect x="875" y="575" width="80" height="40" rx="10" fill="url(#btn-gradient)" stroke="white" stroke-width="2"/>
      <text x="915" y="602" text-anchor="middle" font-size="20" fill="white">Sepal</text>
    </g>
    <g id="label-receptacle">
      <rect x="800" y="975" width="120" height="40" rx="10" fill="url(#btn-gradient)" stroke="white" stroke-width="2"/> 
      <text x="860" y="1002" text-anchor="middle" font-size="20" fill="white">Receptacle</text>
    </g>
    <!-- Additional label groups for stamen, pistil, etc... -->
  </g>
  <g id="word-bank">
    <rect x="100" y="1000" width="800" height="100" rx="10" fill="white" stroke="#0984E3" stroke-width="2"/>
    <use xlink:href="#label-petal" x="0" y="700"/>
    <use xlink:href="#label-sepal" x="100" y="700"/>
    <use xlink:href="#label-receptacle" x="200" y="700"/> 
    <!-- Additional use elements to position labels in word bank -->
  </g>
  <g id="instructions">
    <rect x="1200" y="200" width="500" height="400" rx="10" fill="white" stroke="#0984E3" stroke-width="2"/>
    <text x="1250" y="250" font-size="24">Instructions:</text>
    <text x="1250" y="300" font-size="20">1. Drag each label from the word bank to the matching part of the flower diagram.</text>
    <text x="1250" y="350" font-size="20">2. Click "Check Answer" when done.</text>  
    <text x="1250" y="400" font-size="20">3. If needed, click "Hint" for help.</text>
    <text x="1250" y="450" font-size="20">4. To start over, click "Reset".</text>
  </g>
  <g id="buttons">  
    <a xlink:href="#hint">
      <rect id="hint-btn" x="1300" y="500" width="100" height="50" rx="10" fill="url(#btn-gradient)"/>
      <text x="1350" y="535" text-anchor="middle" font-size="24" fill="white">Hint</text>
    </a>
    <a xlink:href="#answer">
      <rect id="check-btn" x="1450" y="500" width="200" height="50" rx="10" fill="url(#btn-gradient)"/>  
      <text x="1550" y="535" text-anchor="middle" font-size="24" fill="white">Check Answer</text>
    </a>
    <a xlink:href="#">
      <rect id="reset-btn" x="1300" y="600" width="100" height="50" rx="10" fill="url(#btn-gradient)"/>
      <text x="1350" y="635" text-anchor="middle" font-size="24" fill="white">Reset</text>  
    </a>
  </g>
  <g id="hint">
    <rect x="500" y="300" width="800" height="600" rx="10" fill="white" stroke="#0984E3" stroke-width="2"/>
    <text x="550" y="400">
      <tspan x="550" dy="1.2em">- Petals are the colorful parts that attract pollinators</tspan>
      <tspan x="550" dy="1.2em">- Sepals protect the flower bud before it opens  </tspan>
      <tspan x="550" dy="1.2em">- Stamens are the male reproductive parts</tspan>
      <tspan x="550" dy="1.2em">- The pistil is the female reproductive part</tspan>
      <!-- Additional hint text -->
    </text>
    <a xlink:href="#">
      <rect x="1200" y="850" width="80" height="40" rx="10" fill="#FF7675"/>
      <text x="1240" y="877" text-anchor="middle" font-size="20" fill="white">Close</text>
    </a>
  </g>
  <g id="answer">
    <rect x="400" y="200" width="1000" height="800" rx="10" fill="white" stroke="#0984E3" stroke-width="2"/>  
    <use xlink:href="#flower"/>
    <!-- Positioned labels with arrows, e.g. -->
    <text x="700" y="400">Petal</text>
    <path d="M740 410 L780 450" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/> 
    <!-- Additional labels and arrows -->
    <a xlink:href="#">
      <rect x="1300" y="950" width="80" height="40" rx="10" fill="#FF7675"/>
      <text x="1340" y="977" text-anchor="middle" font-size="20" fill="white">Close</text>
    </a>
  </g>
  <g id="inset">
    <rect x="1400" y="950" width="300" height="200" rx="10" fill="white" stroke="#0984E3" stroke-width="2"/>
    <text x="1425" y="980" font-size="20">Pollination:</text>
    <!-- Simple pollination diagram -->
    <path d="M1500 1100 Q1550 1000 1600 1100" fill="none" stroke="#333333" stroke-width="2"/>
    <circle cx="1500" cy="1100" r="20" fill="#FFDA79" stroke="#F9A825" stroke-width="2"/>
    <circle cx="1600" cy="1100" r="20" fill="#FFDA79" stroke="#F9A825" stroke-width="2"/>
    <text x="1450" y="1060" font-size="14">Pollen</text>
    <path d="M1480 1072 L1500 1085" fill="none" stroke="#333333" stroke-width="1" marker-end="url(#arrowhead)"/>
  </g>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
  </marker>
</svg>