<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg">
  <style>
    / UI Structure /
    .screen { position: absolute; width: 100%; height: 100%; transition: 0.3s; }
    #main-view { display: block; }
    
    / Logic: Using :target to toggle popups /
    .popup { display: none; width: 1800; height: 1200; background: rgba(0,0,0,0.7); }
    #hint:target, #check:target { display: block; }
    
    / Styling /
    .bg { fill: #f8f9fa; }
    .card { fill: white; stroke: #dee2e6; rx: 15; }
    .label { font-family: sans-serif; font-size: 24px; font-weight: bold; cursor: pointer; }
    .btn { fill: #4a90e2; rx: 8; cursor: pointer; }
    text { pointer-events: none; }
  </style>

  <!-- Background -->
  <rect width="1800" height="1200" class="bg" />

  <!-- Layout Containers -->
  <rect x="50" y="100" width="1100" height="900" class="card" /> <!-- Diagram Area -->
  <rect x="1200" y="100" width="550" height="900" class="card" /> <!-- Instructions -->

  <!-- Title -->
  <text x="900" y="60" text-anchor="middle" font-size="48" font-family="sans-serif">Flower Anatomy Drag &amp; Drop</text>

  <!-- Flower Diagram (Simplified Vector) -->
  <g transform="translate(600, 500)">
    <circle r="60" fill="#ffcccb" /> <!-- Petal -->
    <path d="M0,0 L0,-150 M-20,-150 L20,-150" stroke="black" stroke-width="4" /> <!-- Stamen -->
    <circle r="30" cy="50" fill="#90ee90" /> <!-- Ovary -->
    <!-- Target Zones -->
    <rect x="-300" y="-300" width="600" height="600" fill-opacity="0" />
  </g>

  <!-- Word Bank -->
  <g transform="translate(50, 1050)">
    <rect x="0" y="0" width="1700" height="100" rx="10" fill="#e9ecef" />
    <text x="50" y="65" font-family="sans-serif" font-size="30">Bank: Petal | Sepal | Stamen | Pistil | Anther | Filament | Ovary | Style | Stigma | Receptacle</text>
  </g>

  <!-- UI Buttons -->
  <g transform="translate(1250, 800)">
    <a xlink:href="#hint"><rect width="150" height="50" class="btn" /><text x="75" y="35" fill="white" text-anchor="middle">Hint</text></a>
    <a xlink:href="#check" transform="translate(200, 0)"><rect width="150" height="50" class="btn" /><text x="75" y="35" fill="white" text-anchor="middle">Check</text></a>
  </g>

  <!-- Popups (Toggled via fragment identifiers) -->
  <g id="hint" class="popup">
    <rect width="1800" height="1200" fill="white" fill-opacity="0.9" />
    <text x="900" y="500" text-anchor="middle" font-size="60">Hint: The stamen is the male part!</text>
    <a xlink:href="#main"><rect x="800" y="600" width="200" height="60" fill="red" rx="10"/><text x="900" y="640" fill="white" text-anchor="middle">Close</text></a>
  </g>

  <g id="check" class="popup">
    <rect width="1800" height="1200" fill="white" fill-opacity="0.9" />
    <text x="900" y="500" text-anchor="middle" font-size="60">Check: Great effort! Keep practicing.</text>
    <a xlink:href="#main"><rect x="800" y="600" width="200" height="60" fill="green" rx="10"/><text x="900" y="640" fill="white" text-anchor="middle">Close</text></a>
  </g>

  <!-- Inset Diagram -->
  <g transform="translate(1250, 200)">
    <rect width="400" height="250" fill="#fdfdfd" stroke="#ccc" />
    <text x="200" y="40" text-anchor="middle" font-size="20">Pollination Process</text>
    <circle cx="200" cy="150" r="40" fill="yellow" />
  </g>

  <!-- Navigation Anchor -->
  <a id="main" xlink:href="#"></a>
</svg>