<svg width="1800" height="1200" viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <!-- Background Gradients -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fdfbfb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ebedee;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f2f5f7;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff8da1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff4d6d;stop-opacity:1" />
        </linearGradient>

        <!-- Filter for soft shadows -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
            <feOffset dx="2" dy="4" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Marker for Arrows -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
        </marker>
    </defs>

    <!-- MAIN CANVAS BACKGROUND -->
    <rect width="1800" height="1200" fill="url(#bgGrad)" />

    <!-- SECTION: MAIN INTERFACE (ID: main) -->
    <g id="main">
        <!-- Top Header -->
        <rect x="0" y="0" width="1800" height="100" fill="#2c3e50" />
        <text x="50" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">Flower Anatomy Drag &amp; Drop</text>
        <text x="1600" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#bdc3c7" text-anchor="end">Module 4: Botany Basics</text>

        <!-- Side Instruction Panel -->
        <rect x="1350" y="150" width="400" height="600" rx="20" fill="url(#panelGrad)" filter="url(#shadow)" stroke="#dee2e6" stroke-width="1" />
        <text x="1380" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" fill="#34495e">Instructions</text>
        <foreignObject x="1380" y="220" width="340" height="500">
            <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', Arial, sans-serif; color: #5d6d7e; line-height: 1.6; font-size: 18px;">
                <p>Welcome to the Flower Anatomy challenge!</p>
                <p><strong>The Goal:</strong> Identify the key reproductive and structural parts of the flower.</p>
                <p><strong>How to play:</strong> In a live version, you would drag the labels from the word bank into the empty slots. In this static prototype, study the lines and test your knowledge!</p>
                <p>Use the buttons below to get hints or check your understanding.</p>
            </div>
        </foreignObject>

        <!-- Central Flower Illustration -->
        <g transform="translate(400, 250)">
            <!-- Stem -->
            <path d="M200 500 Q210 600 200 700" stroke="#4a7c44" stroke-width="15" fill="none" stroke-linecap="round" />
            
            <!-- Receptacle -->
            <ellipse cx="200" cy="500" rx="30" ry="20" fill="#6b8e23" />
            
            <!-- Sepals -->
            <path d="M170 500 Q140 470 160 450 Q180 470 200 500" fill="#556b2f" />
            <path d="M230 500 Q260 470 240 450 Q220 470 200 500" fill="#556b2f" />
            
            <!-- Petals (Symmetrical Arrangement) -->
            <path d="M200 500 Q100 400 200 250 Q300 400 200 500" fill="url(#petalGrad)" filter="url(#shadow)" /> <!-- Center Petal -->
            <path d="M200 500 Q50 450 100 350 Q150 400 200 500" fill="url(#petalGrad)" filter="url(#shadow)" /> <!-- Left -->
            <path d="M200 500 Q350 450 300 350 Q250 400 200 500" fill="url(#petalGrad)" filter="url(#shadow)" /> <!-- Right -->
            <path d="M200 500 Q120 550 150 600 Q180 550 200 500" fill="url(#petalGrad)" filter="url(#shadow)" /> <!-- Bottom Left -->
            <path d="M200 500 Q280 550 250 600 Q220 550 200 500" fill="url(#petalGrad)" filter="url(#shadow)" /> <!-- Bottom Right -->

            <!-- Pistil (Center) -->
            <rect x="195" y="400" width="10" height="100" fill="#8db600" /> <!-- Style -->
            <ellipse cx="200" cy="390" rx="12" ry="8" fill="#6b8e23" /> <!-- Stigma -->
            <ellipse cx="200" cy="500" rx="15" ry="20" fill="#556b2f" /> <!-- Ovary -->

            <!-- Stamens -->
            <g>
                <!-- Stamen 1 -->
                <line x1="190" y1="480" x2="160" y2="420" stroke="#c0d684" stroke-width="3" />
                <ellipse cx="160" cy="420" rx="6" ry="3" fill="#ffd700" />
                <!-- Stamen 2 -->
                <line x1="210" y1="480" x2="240" y2="420" stroke="#c0d684" stroke-width="3" />
                <ellipse cx="240" cy="420" rx="6" ry="3" fill="#ffd700" />
                <!-- Stamen 3 -->
                <line x1="200" y1="470" x2="200" y2="410" stroke="#c0d684" stroke-width="3" />
                <ellipse cx="200" cy="410" rx="6" ry="3" fill="#ffd700" />
            </g>

            <!-- Pointer Lines and Slots -->
            <g stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
                <!-- Stigma -->
                <line x1="212" y1="390" x2="300" y2="350" />
                <!-- Style -->
                <line x1="205" y1="430" x2="300" y2="400" />
                <!-- Ovary -->
                <line x1="215" y1="500" x2="300" y2="470" />
                <!-- Receptacle -->
                <line x1="200" y1="520" x2="300" y2="530" />
                <!-- Sepal -->
                <line x1="160" y1="470" x2="100" y2="470" />
                <!-- Petal -->
                <line x1="120" y1="380" x2="50" y2="350" />
                <!-- Anther -->
                <line x1="160" y1="420" x2="100" y2="400" />
                <!-- Filament -->
                <line x1="170" y1="450" x2="100" y2="430" />
                <!-- Stamen (General) -->
                <line x1="240" y1="420" x2="300" y2="300" />
                <!-- Pistil (General) -->
                <line x1="200" y1="380" x2="300" y2="250" />
            </g>

            <!-- Label Slots (Empty Boxes) -->
            <g fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#shadow)">
                <rect x="300" y="340" width="120" height="30" rx="5" /> <!-- Stigma -->
                <rect x="300" y="390" width="120" height="30" rx="5" /> <!-- Style -->
                <rect x="300" y="460" width="120" height="30" rx="5" /> <!-- Ovary -->
                <rect x="300" y="520" width="120" height="30" rx="5" /> <!-- Receptacle -->
                <rect x="20" y="460" width="80" height="30" rx="5" /> <!-- Sepal -->
                <rect x="20" y="340" width="80" height="30" rx="5" /> <!-- Petal -->
                <rect x="20" y="390" width="80" height="30" rx="5" /> <!-- Anther -->
                <rect x="20" y="420" width="80" height="30" rx="5" /> <!-- Filament -->
                <rect x="300" y="290" width="120" height="30" rx="5" /> <!-- Stamen -->
                <rect x="300" y="240" width="120" height="30" rx="5" /> <!-- Pistil -->
            </g>
        </g>

        <!-- Word Bank -->
        <g transform="translate(300, 950)">
            <text x="0" y="-20" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#34495e">Word Bank</text>
            <rect x="0" y="0" width="1200" height="150" rx="20" fill="#f8f9fa" stroke="#dee2e6" />
            
            <g font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">
                <!-- Labels as rounded buttons -->
                <g transform="translate(50, 40)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Petal</text>
                </g>
                <g transform="translate(220, 40)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Sepal</text>
                </g>
                <g transform="translate(390, 40)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Stamen</text>
                </g>
                <g transform="translate(560, 40)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Pistil</text>
                </g>
                <g transform="translate(730, 40)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Anther</text>
                </g>
                <g transform="translate(900, 40)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Filament</text>
                </g>
                <g transform="translate(1070, 40)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Ovary</text>
                </g>
                <g transform="translate(50, 100)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Style</text>
                </g>
                <g transform="translate(220, 100)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Stigma</text>
                </g>
                <g transform="translate(390, 100)">
                    <rect width="150" height="45" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)" />
                    <text x="75" y="28">Receptacle</text>
                </g>
            </g>
        </g>

        <!-- Action Buttons -->
        <g transform="translate(1350, 800)">
            <a xlink:href="#hintPanel">
                <rect x="0" y="0" width="120" height="50" rx="10" fill="#f1c40f" filter="url(#shadow)" />
                <text x="60" y="32" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Hint</text>
            </a>
            <a xlink:href="#checkPanel">
                <rect x="140" y="0" width="120" height="50" rx="10" fill="#2ecc71" filter="url(#shadow)" />
                <text x="200" y="32" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Check</text>
            </a>
            <a xlink:href="#resetPanel">
                <rect x="280" y="0" width="120" height="50" rx="10" fill="#e74c3c" filter="url(#shadow)" />
                <text x="340" y="32" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Reset</text>
            </a>
        </g>

        <!-- Extra Inset Diagram: Pollination -->
        <g transform="translate(100, 800)">
            <rect width="300" height="200" rx="15" fill="#fff" stroke="#dee2e6" filter="url(#shadow)" />
            <text x="150" y="30" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#34495e" text-anchor="middle">Pollination Process</text>
            
            <!-- Simple Pollination Art -->
            <circle cx="80" cy="120" r="10" fill="#ffd700" /> <!-- Pollen -->
            <path d="M80 120 Q150 80 220 120" stroke="#f1c40f" stroke-width="3" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)" />
            <ellipse cx="230" cy="120" rx="15" ry="10" fill="#8db600" /> <!-- Target Stigma -->
            <text x="150" y="160" font-family="Segoe UI" font-size="14" fill="#7f8c8d" text-anchor="middle">Pollen transfers to the Stigma</text>
            <path d="M140 110 L160 110 L150 90 Z" fill="#f1c40f" /> <!-- Bee proxy -->
        </g>
    </g>

    <!-- SECTION: HINT PANEL (ID: hintPanel) -->
    <g id="hintPanel" transform="translate(0, 1300)">
        <rect width="1800" height="1200" fill="#2c3e50" fill-opacity="0.9" />
        <rect x="400" y="300" width="1000" height="600" rx="30" fill="url(#panelGrad)" filter="url(#shadow)" />
        <text x="900" y="380" font-family="Segoe UI" font-size="48" font-weight="bold" fill="#2c3e50" text-anchor="middle">Study Guide</text>
        <foreignObject x="500" y="420" width="800" height="400">
            <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', Arial, sans-serif; color: #5d6d7e; font-size: 22px; line-height: 1.8; text-align: center;">
                <p><strong>Stamen:</strong> The male part of the flower, consisting of the <em>Anther</em> (pollen producer) and the <em>Filament</em> (support stalk).</p>
                <p><strong>Pistil:</strong> The female part, consisting of the <em>Stigma</em> (sticky top), <em>Style</em> (tube), and <em>Ovary</em> (contains ovules).</p>
                <p><strong>Sepals:</strong> The leaf-like structures that protect the flower bud.</p>
                <p><strong>Receptacle:</strong> The thickened part of a stem from which the flower organs grow.</p>
            </div>
        </foreignObject>
        <a xlink:href="#main">
            <rect x="800" y="800" width="200" height="60" rx="10" fill="#3498db" filter="url(#shadow)" />
            <text x="900" y="838" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Back to Lesson</text>
        </a>
    </g>

    <!-- SECTION: CHECK ANSWER PANEL (ID: checkPanel) -->
    <g id="checkPanel" transform="translate(0, 2500)">
        <rect width="1800" height="1200" fill="#2c3e50" fill-opacity="0.9" />
        <rect x="400" y="300" width="1000" height="600" rx="30" fill="url(#panelGrad)" filter="url(#shadow)" />
        <text x="900" y="450" font-family="Segoe UI" font-size="60" font-weight="bold" fill="#2ecc71" text-anchor="middle">Knowledge Check!</text>
        <text x="900" y="530" font-family="Segoe UI" font-size="28" fill="#7f8c8d" text-anchor="middle">Since this is a static interface, we cannot track your drags.</text>
        <text x="900" y="570" font-family="Segoe UI" font-size="28" fill="#7f8c8d" text-anchor="middle">However, if you correctly identified the Anther, Ovary, and Stigma,</text>
        <text x="900" y="610" font-family="Segoe UI" font-size="28" fill="#7f8c8d" text-anchor="middle">you are on your way to becoming a botanist!</text>
        <a xlink:href="#main">
            <rect x="800" y="750" width="200" height="60" rx="10" fill="#3498db" filter="url(#shadow)" />
            <text x="900" y="788" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Continue</text>
        </a>
    </g>

    <!-- SECTION: RESET PANEL (ID: resetPanel) -->
    <g id="resetPanel" transform="translate(0, 3700)">
        <rect width="1800" height="1200" fill="#2c3e50" fill-opacity="0.9" />
        <rect x="400" y="300" width="1000" height="600" rx="30" fill="url(#panelGrad)" filter="url(#shadow)" />
        <text x="900" y="450" font-family="Segoe UI" font-size="60" font-weight="bold" fill="#e74c3c" text-anchor="middle">Reset Workspace?</text>
        <text x="900" y="530" font-family="Segoe UI" font-size="28" fill="#7f8c8d" text-anchor="middle">Are you sure you want to clear all placements?</text>
        <a xlink:href="#main">
            <rect x="600" y="600" width="250" height="60" rx="10" fill="#2ecc71" filter="url(#shadow)" />
            <text x="725" y="638" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Yes, Reset</text>
        </a>
        <a xlink:href="#main">
            <rect x="950" y="600" width="250" height="60" rx="10" fill="#bdc3c7" filter="url(#shadow)" />
            <text x="1075" y="638" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Cancel</text>
        </a>
    </g>
</svg>