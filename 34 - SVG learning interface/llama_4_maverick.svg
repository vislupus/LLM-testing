<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200">
  <!-- Background Gradient -->
  <rect x="0" y="0" width="1800" height="1200" fill="url(#backgroundGradient)"/>
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f7f7"/>
      <stop offset="100%" stop-color="#e7e7e7"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="900" y="50" font-size="36" text-anchor="middle" font-family="Arial">Flower Anatomy Drag & Drop</text>

  <!-- Central Diagram Area -->
  <g transform="translate(300, 150)">
    <!-- Flower Illustration -->
    <g>
      <!-- Simplified flower diagram -->
      <circle cx="150" cy="150" r="100" fill="#ffd7d7"/>
      <circle cx="150" cy="150" r="50" fill="#ffffff"/>
      <!-- Parts -->
      <g id="petal1" transform="translate(100, 100)"><ellipse cx="0" cy="0" rx="50" ry="30" fill="#ffcccc"/></g>
      <g id="sepal1" transform="translate(120, 220)"><ellipse cx="0" cy="0" rx="30" ry="20" fill="#ccffcc"/></g>
      <g id="stamen1" transform="translate(150, 80)"><line x1="0" y1="0" x2="0" y2="50" stroke="#777777"/><circle cx="0" cy="50" r="10" fill="#777777"/></g>
      <g id="pistil1" transform="translate(150, 170)"><line x1="0" y1="0" x2="0" y2="50" stroke="#777777"/><circle cx="0" cy="0" r="10" fill="#777777"/></g>
      <!-- Label Targets -->
      <g id="labelTargetPetal" transform="translate(100, 100)"><rect x="-20" y="-20" width="40" height="40" fill="none" stroke="none"/><a xlink:href="#popupPetal"><text x="0" y="0" font-size="14" text-anchor="middle">?</text></a></g>
      <g id="labelTargetSepal" transform="translate(120, 220)"><rect x="-20" y="-20" width="40" height="40" fill="none" stroke="none"/><a xlink:href="#popupSepal"><text x="0" y="0" font-size="14" text-anchor="middle">?</text></a></g>
      <g id="labelTargetStamen" transform="translate(150, 80)"><rect x="-20" y="-20" width="40" height="40" fill="none" stroke="none"/><a xlink:href="#popupStamen"><text x="0" y="0" font-size="14" text-anchor="middle">?</text></a></g>
      <g id="labelTargetPistil" transform="translate(150, 170)"><rect x="-20" y="-20" width="40" height="40" fill="none" stroke="none"/><a xlink:href="#popupPistil"><text x="0" y="0" font-size="14" text-anchor="middle">?</text></a></g>
    </g>

    <!-- Draggable Labels (Word Bank) -->
    <g transform="translate(400, 0)">
      <g id="wordBank">
        <g transform="translate(0, 0)"><a xlink:href="#labelPetal"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ffcccc"/><text x="50" y="15" font-size="14" text-anchor="middle">Petal</text></a></g>
        <g transform="translate(0, 40)"><a xlink:href="#labelSepal"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccffcc"/><text x="50" y="15" font-size="14" text-anchor="middle">Sepal</text></a></g>
        <g transform="translate(0, 80)"><a xlink:href="#labelStamen"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Stamen</text></a></g>
        <g transform="translate(0, 120)"><a xlink:href="#labelPistil"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Pistil</text></a></g>
        <g transform="translate(0, 160)"><a xlink:href="#labelAnther"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Anther</text></a></g>
        <g transform="translate(0, 200)"><a xlink:href="#labelFilament"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Filament</text></a></g>
        <g transform="translate(0, 240)"><a xlink:href="#labelOvary"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Ovary</text></a></g>
        <g transform="translate(0, 280)"><a xlink:href="#labelStyle"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Style</text></a></g>
        <g transform="translate(0, 320)"><a xlink:href="#labelStigma"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Stigma</text></a></g>
        <g transform="translate(0, 360)"><a xlink:href="#labelReceptacle"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Receptacle</text></a></g>
      </g>
    </g>
  </g>

  <!-- Instruction Panel -->
  <g transform="translate(1200, 150)">
    <text x="0" y="0" font-size="18">Drag and drop the labels to the correct parts of the flower.</text>
    <g transform="translate(0, 50)">
      <a xlink:href="#popupHint"><rect x="0" y="0" width="100" height="30" rx="10" fill="#ccccff"/><text x="50" y="15" font-size="14" text-anchor="middle">Hint</text></a>
      <a xlink:href="#popupCheck"><rect x="120" y="0" width="150" height="30" rx="10" fill="#ccffcc"/><text x="195" y="15" font-size="14" text-anchor="middle">Check Answer</text></a>
      <a xlink:href="#popupReset"><rect x="290" y="0" width="100" height="30" rx="10" fill="#ffcccc"/><text x="340" y="15" font-size="14" text-anchor="middle">Reset</text></a>
    </g>
  </g>

  <!-- Popups -->
  <g id="popupPetal" visibility="hidden">
    <rect x="600" y="300" width="200" height="100" fill="#ffffff" stroke="#777777"/>
    <text x="700" y="350" font-size="18" text-anchor="middle">Petal: Colored part of the flower.</text>
    <a xlink:href="#"><rect x="750" y="320" width="20" height="20" fill="#ffcccc"/><text x="760" y="335" font-size="14">X</text></a>
  </g>
  <g id="popupSepal" visibility="hidden">
    <rect x="600" y="300" width="200" height="100" fill="#ffffff" stroke="#777777"/>
    <text x="700" y="350" font-size="18" text-anchor="middle">Sepal: Green part that protects the flower bud.</text>
    <a xlink:href="#"><rect x="750" y="320" width="20" height="20" fill="#ffcccc"/><text x="760" y="335" font-size="14">X</text></a>
  </g>
  <g id="popupStamen" visibility="hidden">
    <rect x="600" y="300" width="200" height="100" fill="#ffffff" stroke="#777777"/>
    <text x="700" y="350" font-size="18" text-anchor="middle">Stamen: Male reproductive part.</text>
    <a xlink:href="#"><rect x="750" y="320" width="20" height="20" fill="#ffcccc"/><text x="760" y="335" font-size="14">X</text></a>
  </g>
  <g id="popupPistil" visibility="hidden">
    <rect x="600" y="300" width="200" height="100" fill="#ffffff" stroke="#777777"/>
    <text x="700" y="350" font-size="18" text-anchor="middle">Pistil: Female reproductive part.</text>
    <a xlink:href="#"><rect x="750" y="320" width="20" height="20" fill="#ffcccc"/><text x="760" y="335" font-size="14">X</text></a>
  </g>
  <g id="popupHint" visibility="hidden">
    <rect x="600" y="300" width="300" height="150" fill="#ffffff" stroke="#777777"/>
    <text x="750" y="350" font-size="18" text-anchor="middle">Hint: Start with the obvious parts like petal and sepal.</text>
    <a xlink:href="#"><rect x="850" y="320" width="20" height="20" fill="#ffcccc"/><text x="860" y="335" font-size="14">X</text></a>
  </g>
  <g id="popupCheck" visibility="hidden">
    <rect x="600" y="300" width="300" height="150" fill="#ffffff" stroke="#777777"/>
    <text x="750" y="350" font-size="18" text-anchor="middle">Check your answers.</text>
    <a xlink:href="#"><rect x="850" y="320" width="20" height="20" fill="#ffcccc"/><text x="860" y="335" font-size="14">X</text></a>
  </g>
  <g id="popupReset" visibility="hidden">
    <rect x="600" y="300" width="300" height="150" fill="#ffffff" stroke="#777777"/>
    <text x="750" y="350" font-size="18" text-anchor="middle">Reset the activity.</text>
    <a xlink:href="#"><rect x="850" y="320" width="20" height="20" fill="#ffcccc"/><text x="860" y="335" font-size="14">X</text></a>
  </g>

  <!-- Label Destinations -->
  <g id="labelPetal" visibility="hidden">
    <rect x="100" y="100" width="100" height="30" rx="10" fill="#ffcccc"/>
    <text x="150" y="115" font-size="14" text-anchor="middle">Petal</text>
    <line x1="150" y1="130" x2="120" y2="120" stroke="#777777"/>
  </g>
  <g id="labelSepal" visibility="hidden">
    <rect x="120" y="220" width="100" height="30" rx="10" fill="#ccffcc"/>
    <text x="170" y="235" font-size="14" text-anchor="middle">Sepal</text>
    <line x1="170" y1="250" x2="140" y2="230" stroke="#777777"/>
  </g>
  <g id="labelStamen" visibility="hidden">
    <rect x="150" y="80" width="100" height="30" rx="10" fill="#ccccff"/>
    <text x="200" y="95" font-size="14" text-anchor="middle">Stamen</text>
    <line x1="200" y1="110" x2="160" y2="90" stroke="#777777"/>
  </g>
  <g id="labelPistil" visibility="hidden">
    <rect x="150" y="170" width="100" height="30" rx="10" fill="#ccccff"/>
    <text x="200" y="185" font-size="14" text-anchor="middle">Pistil</text>
    <line x1="200" y1="200" x2="160" y2="180" stroke="#777777"/>
  </g>
  <g id="labelAnther" visibility="hidden">
    <rect x="180" y="130" width="100" height="30" rx="10" fill="#ccccff"/>
    <text x="230" y="145" font-size="14" text-anchor="middle">Anther</text>
    <line x1="230" y1="160" x2="170" y2="140" stroke="#777777"/>
  </g>
  <g id="labelFilament" visibility="hidden">
    <rect x="180" y="100" width="100" height="30" rx="10" fill="#ccccff"/>
    <text x="230" y="115" font-size="14" text-anchor="middle">Filament</text>
    <line x1="230" y1="130" x2="170" y2="110" stroke="#777777"/>
  </g>
  <g id="labelOvary" visibility="hidden">
    <rect x="180" y="200" width="100" height="30" rx="10" fill="#ccccff"/>
    <text x="230" y="215" font-size="14" text-anchor="middle">Ovary</text>
    <line x1="230" y1="230" x2="170" y2="210" stroke="#777777"/>
  </g>
  <g id="labelStyle" visibility="hidden">
    <rect x="180" y="170" width="100" height="30" rx="10" fill="#ccccff"/>
    <text x="230" y="185" font-size="14" text-anchor="middle">Style</text>
    <line x1="230" y1="200" x2="170" y2="180" stroke="#777777"/>
  </g>
  <g id="labelStigma" visibility="hidden">
    <rect x="180" y="140" width="100" height="30" rx="10" fill="#ccccff"/>
    <text x="230" y="155" font-size="14" text-anchor="middle">Stigma</text>
    <line x1="230" y1="170" x2="170" y2="150" stroke="#777777"/>
  </g>
  <g id="labelReceptacle" visibility="hidden">
    <rect x="150" y="250" width="100" height="30" rx="10" fill="#ccccff"/>
    <text x="200" y="265" font-size="14" text-anchor="middle">Receptacle</text>
    <line x1="200" y1="280" x2="160" y2="260" stroke="#777777"/>
  </g>

  <!-- Extra Educational Inset Diagram -->
  <g transform="translate(50, 900)">
    <text x="0" y="0" font-size="18">Pollination Process:</text>
    <g transform="translate(0, 30)">
      <!-- Simplified pollination diagram -->
      <circle cx="50" cy="50" r="20" fill="#ffd7d7"/>
      <line x1="50" y1="70" x2="50" y2="100" stroke="#777777"/>
      <circle cx="50" cy="100" r="10" fill="#777777"/>
      <text x="70" y="50" font-size="14">Pollen Transfer</text>
    </g>
  </g>
</svg>
