<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 1200" width="1800" height="1200">
  
  <!-- DEFINITIONS -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdfbf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef6f9;stop-opacity:1" />
    </linearGradient>

    <!-- UI Gradients -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>

    <!-- Filter for Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CSS STYLES FOR INTERACTIVITY -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&amp;display=swap');
    
    text { font-family: 'Nunito', sans-serif; }
    .title { font-size: 42px; font-weight: bold; fill: #2c3e50; }
    .subtitle { font-size: 20px; fill: #7f8c8d; }
    
    /* Tile Styles */
    .tile { cursor: pointer; transition: 0.2s; }
    .tile rect { fill: #fff; stroke: #bdc3c7; stroke-width: 2; rx: 10; filter: url(#shadow); }
    .tile:hover rect { fill: #f0f8ff; stroke: #4a90e2; }
    .tile text { font-size: 18px; fill: #34495e; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

    /* Button Styles */
    .btn { cursor: pointer; }
    .btn rect { fill: url(#btn-grad); rx: 8; filter: url(#shadow); }
    .btn text { fill: white; font-size: 20px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .btn:hover rect { fill: #357abd; }

    /* Label Logic: Hidden by default, Shown on :target */
    .anatomy-label { 
      opacity: 0; 
      transition: opacity 0.5s ease; 
      pointer-events: none; /* Let clicks pass through to flower */
    }
    
    /* The Magic: When ID is targeted, show it */
    .anatomy-label:target { opacity: 1; }

    /* Popups */
    .popup { display: none; }
    .popup:target { display: block; }
    
    .overlay { fill: rgba(0,0,0,0.5); }
    .modal { fill: white; rx: 20; filter: url(#shadow); }
    .close-btn text { fill: #e74c3c; font-weight: bold; cursor: pointer; }
    
    /* Hint Lines */
    .hint-line { stroke: #e67e22; stroke-width: 2; stroke-dasharray: 5,5; marker-end: url(#arrowhead); opacity: 0; }
    .hint:target ~ .main-view .hint-line { opacity: 1; }
  </style>

  <!-- BACKGROUND LAYER -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- HEADER -->
  <g transform="translate(900, 60)">
    <text x="0" y="0" text-anchor="middle" class="title">Flower Anatomy Drag &amp; Drop</text>
    <text x="0" y="40" text-anchor="middle" class="subtitle">Identify the parts of the flower by linking labels</text>
  </g>

  <!-- MAIN VIEW CONTAINER -->
  <g class="main-view">
    
    <!-- FLOWER ILLUSTRATION (Center) -->
    <g transform="translate(800, 550) scale(1.5)">
      
      <!-- Stem -->
      <path d="M-5,50 Q0,100 -10,180" stroke="#27ae60" stroke-width="8" fill="none" />
      <!-- Receptacle (Target) -->
      <ellipse cx="0" cy="50" rx="15" ry="10" fill="#2ecc71" />
      
      <!-- Sepals (Target: Sepal) -->
      <path d="M0,50 Q-20,20 -30,40 Q-10,55 0,50" fill="#2ecc71" />
      <path d="M0,50 Q20,20 30,40 Q10,55 0,50" fill="#2ecc71" />
      
      <!-- Petals (Target: Petal) -->
      <path d="M0,50 C-40,0 -60,-60 0,-80 C60,-60 40,0 0,50" fill="#ff9ff3" stroke="#f368e0" stroke-width="1" />
      <path d="M0,50 C-40,0 -60,60 0,80 C60,60 40,0 0,50" fill="#ff9ff3" stroke="#f368e0" stroke-width="1" />
      <path d="M0,50 C-80,-20 -80,20 0,50" fill="#ff9ff3" />
      <path d="M0,50 C80,-20 80,20 0,50" fill="#ff9ff3" />

      <!-- Stamen (Group) (Target: Stamen) -->
      <!-- Filament -->
      <line x1="-20" y1="30" x2="-30" y2="-20" stroke="#f1c40f" stroke-width="3" />
      <!-- Anther -->
      <ellipse cx="-30" cy="-20" rx="8" ry="5" fill="#f39c12" />
      
      <line x1="20" y1="30" x2="30" y2="-20" stroke="#f1c40f" stroke-width="3" />
      <ellipse cx="30" cy="-20" rx="8" ry="5" fill="#f39c12" />

      <!-- Pistil (Target: Pistil) -->
      <!-- Ovary -->
      <ellipse cx="0" cy="30" rx="12" ry="15" fill="#f1c40f" />
      <!-- Style -->
      <rect x="-3" y="-10" width="6" height="40" fill="#f1c40f" />
      <!-- Stigma -->
      <path d="M-8,-10 L8,-10 L5,-20 L-5,-20 Z" fill="#e67e22" />

    </g>

    <!-- ANATOMY LABELS (Hidden by default, Revealed via ID targeting) -->
    <!-- We use 'id' matching the word bank links -->
    
    <!-- 1. Petal -->
    <g id="lbl-petal" class="anatomy-label">
      <path d="M850,350 L950,250" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="960" y="240" font-size="20" font-weight="bold" fill="#e84393">Petal</text>
    </g>

    <!-- 2. Sepal -->
    <g id="lbl-sepal" class="anatomy-label">
      <path d="M720,600 L650,650" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="640" y="670" font-size="20" font-weight="bold" fill="#27ae60">Sepal</text>
    </g>

    <!-- 3. Stamen -->
    <g id="lbl-stamen" class="anatomy-label">
      <path d="M880,500 L950,450" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="960" y="440" font-size="20" font-weight="bold" fill="#f39c12">Stamen</text>
    </g>

    <!-- 4. Anther -->
    <g id="lbl-anther" class="anatomy-label">
      <path d="M900,480 L980,420" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="990" y="410" font-size="18" font-weight="bold" fill="#d35400">Anther</text>
    </g>

    <!-- 5. Filament -->
    <g id="lbl-filament" class="anatomy-label">
      <path d="M880,520 L820,550" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="800" y="560" font-size="18" font-weight="bold" fill="#d35400">Filament</text>
    </g>

    <!-- 6. Pistil -->
    <g id="lbl-pistil" class="anatomy-label">
      <path d="M800,600 L800,700" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="810" y="720" font-size="20" font-weight="bold" fill="#f1c40f">Pistil (Carpel)</text>
    </g>

    <!-- 7. Ovary -->
    <g id="lbl-ovary" class="anatomy-label">
      <path d="M770,590 L700,600" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="690" y="610" font-size="18" font-weight="bold" fill="#f39c12">Ovary</text>
    </g>

    <!-- 8. Style -->
    <g id="lbl-style" class="anatomy-label">
      <path d="M800,560 L850,560" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="860" y="555" font-size="18" font-weight="bold" fill="#f39c12">Style</text>
    </g>

    <!-- 9. Stigma -->
    <g id="lbl-stigma" class="anatomy-label">
      <path d="M800,520 L850,500" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="860" y="495" font-size="18" font-weight="bold" fill="#e67e22">Stigma</text>
    </g>

    <!-- 10. Receptacle -->
    <g id="lbl-receptacle" class="anatomy-label">
      <path d="M750,620 L650,620" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" />
      <text x="640" y="625" font-size="20" font-weight="bold" fill="#27ae60">Receptacle</text>
    </g>

    <!-- POLLINATION DIAGRAM (Inset) -->
    <g transform="translate(1350, 800)">
      <rect x="-100" y="-80" width="400" height="300" fill="white" stroke="#bdc3c7" rx="10" opacity="0.8"/>
      <text x="100" y="-40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">Pollination Process</text>
      
      <!-- Simple Bee -->
      <g transform="translate(50, 50)">
         <ellipse cx="0" cy="0" rx="20" ry="15" fill="#f1c40f" />
         <ellipse cx="-5" cy="0" rx="5" ry="12" fill="black" />
         <path d="M-20,-5 L-30,-10 M-20,5 L-30,10" stroke="black" stroke-width="2" />
         <circle cx="15" cy="-5" r="5" fill="white" />
         <circle cx="15" cy="-5" r="2" fill="black" />
      </g>
      
      <!-- Pollen Path -->
      <path d="M70,50 Q150,150 200,50" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)" />
      
      <!-- Small Flower -->
      <g transform="translate(200, 50) scale(0.5)">
        <path d="M0,0 C-20,-30 20,-30 0,0 Z" fill="#ff9ff3" />
        <circle cx="0" cy="0" r="5" fill="#f1c40f" />
      </g>
      <text x="200" y="90" text-anchor="middle" font-size="16" fill="#555">Fertilization</text>
    </g>

  </g>

  <!-- SIDEBAR: WORD BANK -->
  <g transform="translate(1400, 150)">
    <text x="0" y="0" font-size="24" font-weight="bold" fill="#2c3e50">Word Bank</text>
    <text x="0" y="30" font-size="14" fill="#7f8c8d">Click a word to place it on the flower</text>
    
    <!-- Tiles: These are anchors <a> linking to the label IDs -->
    
    <a xlink:href="#lbl-petal" class="tile" transform="translate(0, 50)">
      <rect width="140" height="50" />
      <text x="70" y="28">Petal</text>
    </a>

    <a xlink:href="#lbl-sepal" class="tile" transform="translate(0, 110)">
      <rect width="140" height="50" />
      <text x="70" y="28">Sepal</text>
    </a>

    <a xlink:href="#lbl-stamen" class="tile" transform="translate(0, 170)">
      <rect width="140" height="50" />
      <text x="70" y="28">Stamen</text>
    </a>

    <a xlink:href="#lbl-anther" class="tile" transform="translate(0, 230)">
      <rect width="140" height="50" />
      <text x="70" y="28">Anther</text>
    </a>

    <a xlink:href="#lbl-filament" class="tile" transform="translate(0, 290)">
      <rect width="140" height="50" />
      <text x="70" y="28">Filament</text>
    </a>

    <a xlink:href="#lbl-pistil" class="tile" transform="translate(0, 350)">
      <rect width="140" height="50" />
      <text x="70" y="28">Pistil</text>
    </a>

    <a xlink:href="#lbl-ovary" class="tile" transform="translate(160, 50)">
      <rect width="140" height="50" />
      <text x="70" y="28">Ovary</text>
    </a>

    <a xlink:href="#lbl-style" class="tile" transform="translate(160, 110)">
      <rect width="140" height="50" />
      <text x="70" y="28">Style</text>
    </a>

    <a xlink:href="#lbl-stigma" class="tile" transform="translate(160, 170)">
      <rect width="140" height="50" />
      <text x="70" y="28">Stigma</text>
    </a>

    <a xlink:href="#lbl-receptacle" class="tile" transform="translate(160, 230)">
      <rect width="140" height="50" />
      <text x="70" y="28">Receptacle</text>
    </a>

  </g>

  <!-- CONTROLS -->
  <g transform="translate(1400, 900)">
    
    <!-- Hint Button -->
    <a xlink:href="#hint-popup" class="btn" transform="translate(0, 0)">
      <rect width="100" height="50" />
      <text x="50" y="32">Hint</text>
    </a>

    <!-- Check Answer Button -->
    <a xlink:href="#check-popup" class="btn" transform="translate(120, 0)">
      <rect width="180" height="50" />
      <text x="90" y="32">Check Answer</text>
    </a>

    <!-- Reset Button (Links to # to clear targets) -->
    <a xlink:href="#" class="btn" transform="translate(320, 0)">
      <rect width="100" height="50" />
      <text x="50" y="32">Reset</text>
    </a>

  </g>

  <!-- POPUPS (Hidden, activated by :target) -->

  <!-- 1. Hint Popup -->
  <g id="hint-popup" class="popup">
    <!-- Dark Overlay -->
    <rect width="1800" height="1200" class="overlay" />
    <!-- Modal -->
    <g transform="translate(600, 400)">
      <rect width="600" height="400" class="modal" />
      <text x="300" y="80" text-anchor="middle" font-size="30" font-weight="bold" fill="#2c3e50">Need a Hand?</text>
      
      <text x="300" y="150" text-anchor="middle" font-size="20" fill="#555">
        The petals attract insects.
      </text>
      <text x="300" y="200" text-anchor="middle" font-size="20" fill="#555">
        The green leaves at the bottom are sepals.
      </text>
      <text x="300" y="250" text-anchor="middle" font-size="20" fill="#555">
        The yellow central part is the Pistil.
      </text>

      <!-- Close Button -->
      <a xlink:href="#" class="btn" transform="translate(200, 300)">
        <rect width="200" height="60" />
        <text x="100" y="38">Close</text>
      </a>
    </g>
  </g>

  <!-- 2. Check Popup -->
  <g id="check-popup" class="popup">
    <rect width="1800" height="1200" class="overlay" />
    <g transform="translate(600, 400)">
      <rect width="600" height="400" class="modal" />
      
      <!-- Success Graphic -->
      <circle cx="300" cy="150" r="60" fill="#2ecc71" opacity="0.2"/>
      <path d="M260,150 L290,180 L340,120" stroke="#27ae60" stroke-width="10" fill="none" />
      
      <text x="300" y="280" text-anchor="middle" font-size="30" font-weight="bold" fill="#27ae60">Great Job!</text>
      <text x="300" y="320" text-anchor="middle" font-size="18" fill="#7f8c8d">You have identified the flower parts correctly.</text>

      <a xlink:href="#" class="btn" transform="translate(200, 340)">
        <rect width="200" height="50" />
        <text x="100" y="32">Continue</text>
      </a>
    </g>
  </g>

  <!-- Instruction Panel (Right Side Text) -->
  <g transform="translate(50, 150)">
    <text x="0" y="0" font-size="24" font-weight="bold" fill="#2c3e50">Instructions</text>
    <text x="0" y="40" font-size="18" fill="#555">1. Look at the flower diagram.</text>
    <text x="0" y="70" font-size="18" fill="#555">2. Click a label from the Word Bank.</text>
    <text x="0" y="100" font-size="18" fill="#555">3. The label will appear on the diagram.</text>
    <text x="0" y="130" font-size="18" fill="#555">4. Use "Hint" if you get stuck.</text>
    <text x="0" y="160" font-size="18" fill="#555">5. Click "Check Answer" when done!</text>
  </g>

</svg>