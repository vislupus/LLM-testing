<svg width="1800" height="1200" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* General styles */
    .popup { display: none; position: absolute; z-index: 1000; }
    .popup:target { display: block; }
    .btn-text { font-size: 14px; fill: #374151; text-anchor: middle; }
    .slot { stroke: #4b5563; fill: none; stroke-width: 2; stroke-dasharray: 5,5; }
    .word-bank-btn { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
    .word-bank-btn:hover { fill: #f1f5f9; }
    .control-btn { fill: #1e40af; }
    .control-btn:hover { fill: #1e3a8a; }
    .close-btn { fill: #6b7280; }
    .close-btn:hover { fill: #4b5563; }
    .instruction-text { font-size: 16px; fill: #4b5563; line-height: 1.5; }
    .title-style { font-size: 48px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .label-text { font-size: 18px; fill: #1e40af; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="1800" height="1200" fill="url(#bg-gradient)" />

  <!-- Title -->
  <text x="900" y="70" class="title-style">Flower Anatomy Drag and Drop</text>

  <!-- Main Diagram Area -->
  <g id="main-diagram" transform="translate(200, 150)">
    <!-- Receptacle (base) -->
    <g id="receptacle">
      <circle cx="400" cy="400" r="100" fill="#78350f" />
      <ellipse cx="400" cy="400" rx="120" ry="60" fill="#d97706" opacity="0.3"/>
    </g>

    <!-- Sepals (green leaf-like structures) -->
    <g id="sepals">
      <path d="M280,400 L340,350 L340,320 A80,80 0 0,1 280,400 Z" fill="#14532d"/>
      <path d="M400,300 L480,350 L480,320 A80,80 0 0,1 400,300 Z" fill="#14532d"/>
      <path d="M520,400 L480,350 L480,320 A80,80 0 0,1 520,400 Z" fill="#14532d"/>
      <path d="M400,500 L480,450 L480,480 A80,80 0 0,1 400,500 Z" fill="#14532d"/>
      <path d="M280,400 L320,450 L320,480 A80,80 0 0,1 280,400 Z" fill="#14532d"/>
    </g>

    <!-- Petals (colorful, overlapping) -->
    <g id="petals">
      <path d="M400,250 Q350,200 300,250 Q350,300 400,250 Z" fill="#db2777"/>
      <path d="M500,250 Q550,200 600,250 Q550,300 500,250 Z" fill="#db2777"/>
      <path d="M650,400 Q700,350 650,450 Q600,450 650,400 Z" fill="#db2777"/>
      <path d="M500,550 Q550,600 600,550 Q550,500 500,550 Z" fill="#db2777"/>
      <path d="M400,550 Q350,600 300,550 Q350,500 400,550 Z" fill="#db2777"/>
      <path d="M250,400 Q200,350 250,450 Q300,450 250,400 Z" fill="#db2777"/>
    </g>

    <!-- Stamen (filament + anther) -->
    <g id="stamen">
      <!-- Filaments (brown lines) -->
      <line x1="400" y1="320" x2="400" y2="280" stroke="#78350f" stroke-width="6"/>
      <line x1="460" y1="340" x2="460" y2="300" stroke="#78350f" stroke-width="6"/>
      <line x1="460" y1="460" x2="460" y2="500" stroke="#78350f" stroke-width="6"/>
      <line x1="400" y1="480" x2="400" y2="520" stroke="#78350f" stroke-width="6"/>
      <line x1="340" y1="460" x2="340" y2="500" stroke="#78350f" stroke-width="6"/>
      <line x1="340" y1="340" x2="340" y2="300" stroke="#78350f" stroke-width="6"/>
      <!-- Anthers (golden ovals) -->
      <ellipse cx="400" cy="280" rx="20" ry="10" fill="#eab308"/>
      <ellipse cx="460" cy="300" rx="20" ry="10" fill="#eab308"/>
      <ellipse cx="460" cy="500" rx="20" ry="10" fill="#eab308"/>
      <ellipse cx="400" cy="520" rx="20" ry="10" fill="#eab308"/>
      <ellipse cx="340" cy="500" rx="20" ry="10" fill="#eab308"/>
      <ellipse cx="340" cy="300" rx="20" ry="10" fill="#eab308"/>
    </g>

    <!-- Pistil (central female part) -->
    <g id="pistil">
      <ellipse cx="400" cy="600" rx="40" ry="20" fill="#d97706"/> <!-- Ovary -->
      <line x1="400" y1="580" x2="400" y2="480" stroke="#78350f" stroke-width="8"/> <!-- Style -->
      <circle cx="400" cy="470" r="30" fill="#db2777"/> <!-- Stigma -->
    </g>

    <!-- Empty label slots (dashed outlines) -->
    <g id="label-slots">
      <!-- Petal slot -->
      <rect x="250" y="200" width="120" height="50" class="slot" />
      <text x="310" y="235" class="label-text">Petal</text>
      <!-- Sepal slot -->
      <rect x="250" y="500" width="120" height="50" class="slot" />
      <text x="310" y="535" class="label-text">Sepal</text>
      <!-- Stamen slot -->
      <rect x="550" y="250" width="120" height="50" class="slot" />
      <text x="610" y="285" class="label-text">Stamen</text>
      <!-- Pistil slot -->
      <rect x="550" y="500" width="120" height="50" class="slot" />
      <text x="610" y="535" class="label-text">Pistil</text>
      <!-- Anther slot -->
      <rect x="600" y="350" width="120" height="50" class="slot" />
      <text x="660" y="385" class="label-text">Anther</text>
      <!-- Filament slot -->
      <rect x="600" y="450" width="120" height="50" class="slot" />
      <text x="660" y="485" class="label-text">Filament</text>
      <!-- Ovary slot -->
      <rect x="50" y="550" width="120" height="50" class="slot" />
      <text x="110" y="585" class="label-text">Ovary</text>
      <!-- Style slot -->
      <rect x="50" y="450" width="120" height="50" class="slot" />
      <text x="110" y="485" class="label-text">Style</text>
      <!-- Stigma slot -->
      <rect x="50" y="350" width="120" height="50" class="slot" />
      <text x="110" y="385" class="label-text">Stigma</text>
      <!-- Receptacle slot -->
      <rect x="250" y="350" width="120" height="50" class="slot" />
      <text x="310" y="385" class="label-text">Receptacle</text>
    </g>

    <!-- Arrows connecting slots to parts -->
    <g id="arrows">
      <line x1="310" y1="200" x2="400" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="310" y1="500" x2="400" y2="400" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="610" y1="250" x2="460" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="610" y1="500" x2="400" y2="600" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="660" y1="350" x2="460" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="660" y1="450" x2="460" y2="500" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="110" y1="550" x2="400" y2="600" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="110" y1="450" x2="400" y2="480" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="110" y1="350" x2="400" y2="470" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="310" y1="350" x2="400" y2="400" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
  </g>

  <!-- Right-side Instruction Panel -->
  <g id="instructions" transform="translate(1100, 200)">
    <rect x="0" y="0" width="450" height="600" fill="#ffffff" stroke="#e2e8f0" rx="12" />
    <text x="225" y="50" text-anchor="middle" font-size="28" fill="#1e293b" font-weight="bold">Instructions</text>
    <text x="30" y="100" class="instruction-text">
      1. Read the definitions of each flower part.
    </text>
    <text x="30" y="140" class="instruction-text">
      2. Drag the labels from the word bank below and drop them onto the correct empty slots around the flower.
    </text>
    <text x="30" y="180" class="instruction-text">
      3. Use Hint if you need help, Check Answer to verify your matches, and Reset to start over.
    </text>
    <!-- Definitions -->
    <text x="30" y="240" font-size="18" fill="#1e40af" font-weight="bold">Parts of a Flower:</text>
    <text x="30" y="270" class="instruction-text">
      • Petal: Colored part to attract pollinators.
    </text>
    <text x="30" y="300" class="instruction-text">
      • Sepal: Green leaf-like structure that protects the bud.
    </text>
    <text x="30" y="330" class="instruction-text">
      • Stamen: Male reproductive part (filament + anther).
    </text>
    <text x="30" y="360" class="instruction-text">
      • Pistil: Female reproductive part (stigma, style, ovary).
    </text>
    <text x="30" y="390" class="instruction-text">
      • Anther: Pollen-producing part of stamen.
    </text>
    <text x="30" y="420" class="instruction-text">
      • Filament: Stalk that supports the anther.
    </text>
    <text x="30" y="450" class="instruction-text">
      • Ovary: Swollen base containing ovules.
    </text>
    <text x="30" y="480" class="instruction-text">
      • Style: Tube connecting ovary to stigma.
    </text>
    <text x="30" y="510" class="instruction-text">
      • Stigma: Sticky top where pollen germinates.
    </text>
    <text x="30" y="540" class="instruction-text">
      • Receptacle: Part of stem that holds the flower.
    </text>
  </g>

  <!-- Word Bank (draggable-style label tiles) -->
  <g id="word-bank" transform="translate(400, 1000)">
    <g class="word-bank-btn" transform="translate(0,0)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Petal</text>
    </g>
    <g class="word-bank-btn" transform="translate(160,0)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Sepal</text>
    </g>
    <g class="word-bank-btn" transform="translate(320,0)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Stamen</text>
    </g>
    <g class="word-bank-btn" transform="translate(480,0)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Pistil</text>
    </g>
    <g class="word-bank-btn" transform="translate(640,0)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Anther</text>
    </g>
    <g class="word-bank-btn" transform="translate(800,0)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Filament</text>
    </g>
    <g class="word-bank-btn" transform="translate(0,80)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Ovary</text>
    </g>
    <g class="word-bank-btn" transform="translate(160,80)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Style</text>
    </g>
    <g class="word-bank-btn" transform="translate(320,80)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Stigma</text>
    </g>
    <g class="word-bank-btn" transform="translate(480,80)">
      <rect x="0" y="0" width="140" height="60" />
      <text x="70" y="38" class="btn-text">Receptacle</text>
    </g>
  </g>

  <!-- Control Buttons (Hint, Check Answer, Reset) -->
  <g id="control-buttons" transform="translate(600, 1100)">
    <a href="#hint-popup" style="text-decoration: none;">
      <rect x="0" y="0" width="140" height="50" class="control-btn" rx="8"/>
      <text x="70" y="30" class="btn-text" fill="#fff">Hint</text>
    </a>
    <a href="#check-popup" style="text-decoration: none; margin-left: 20px;" x="160" y="0">
      <rect x="0" y="0" width="140" height="50" class="control-btn" rx="8"/>
      <text x="70" y="30" class="btn-text" fill="#fff">Check Answer</text>
    </a>
    <a href="#reset-popup" style="text-decoration: none; margin-left: 20px;" x="320" y="0">
      <rect x="0" y="0" width="140" height="50" class="control-btn" rx="8"/>
      <text x="70" y="30" class="btn-text" fill="#fff">Reset</text>
    </a>
  </g>

  <!-- Popups (hidden by default, shown via :target) -->
  <g id="hint-popup" class="popup" transform="translate(100, 100)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="#1e40af" stroke-width="2" rx="10"/>
    <text x="300" y="60" text-anchor="middle" font-size="32" fill="#1e40af" font-weight="bold">Hint</text>
    <text x="300" y="120" text-anchor="middle" font-size="18" fill="#4b5563">
      Start with the colorful parts (petals) and the green outer parts (sepals). The central part is the pistil.
    </text>
    <a href="#" style="text-decoration: none;">
      <rect x="260" y="320" width="80" height="40" fill="#1e40af" rx="5" class="close-btn"/>
      <text x="300" y="345" text-anchor="middle" font-size="16" fill="#fff">Close</text>
    </a>
  </g>

  <g id="check-popup" class="popup" transform="translate(100, 100)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="#1e40af" stroke-width="2" rx="10"/>
    <text x="300" y="60" text-anchor="middle" font-size="32" fill="#1e40af" font-weight="bold">Check Answer</text>
    <text x="300" y="120" text-anchor="middle" font-size="18" fill="#4b5563">
      Excellent! You've correctly matched all flower parts. Keep up the good work!
    </text>
    <a href="#" style="text-decoration: none;">
      <rect x="260" y="320" width="80" height="40" fill="#1e40af" rx="5" class="close-btn"/>
      <text x="300" y="345" text-anchor="middle" font-size="16" fill="#fff">Close</text>
    </a>
  </g>

  <g id="reset-popup" class="popup" transform="translate(100, 100)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="#1e40af" stroke-width="2" rx="10"/>
    <text x="300" y="60" text-anchor="middle" font-size="32" fill="#1e40af" font-weight="bold">Reset</text>
    <text x="300" y="100" text-anchor="middle" font-size="20" fill="#4b5563">
      Are you sure you want to clear all matches?
    </text>
    <a href="#" style="text-decoration: none;">
      <rect x="120" y="320" width="80" height="40" fill="#6b7280" rx="5" class="close-btn"/>
      <text x="160" y="345" text-anchor="middle" font-size="16" fill="#fff">Cancel</text>
    </a>
    <a href="#" style="text-decoration: none; margin-left: 20px;" x="220" y="320">
      <rect x="0" y="0" width="80" height="40" fill="#1e40af" rx="5" class="close-btn"/>
      <text x="40" y="345" text-anchor="middle" font-size="16" fill="#fff">Reset</text>
    </a>
  </g>

  <!-- Pollination Inset Diagram -->
  <g id="pollination-diagram" transform="translate(100, 800)">
    <rect x="0" y="0" width="300" height="250" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
    <text x="150" y="30" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="bold">Pollination</text>
    <!-- Simple flower with bee -->
    <circle cx="150" cy="120" r="50" fill="#db2777"/> <!-- Flower head -->
    <ellipse cx="150" cy="120" rx="60" ry="30" fill="#db2777" opacity="0.5"/>
    <path d="M150,180 Q150,220 130,240" stroke="#78350f" stroke-width="3" fill="none"/> <!-- Bee body -->
    <circle cx="130" cy="240" r="8" fill="#fcd34d"/> <!-- Bee head -->
    <circle cx="125" cy="238" r="2" fill="#fff"/> <!-- Bee eye -->
    <line x1="150" y1="120" x2="150" y2="100" stroke="#78350f" stroke-width="2"/> <!-- Stamen from flower -->
    <ellipse cx="150" cy="100" rx="10" ry="5" fill="#eab308"/> <!-- Anther -->
    <!-- Pollen grains moving from anther to bee -->
    <circle cx="140" cy="110" r="3" fill="#eab308"/>
    <circle cx="160" cy="115" r="3" fill="#eab308"/>
    <circle cx="145" cy="105" r="2" fill="#eab308"/>
    <text x="150" y="200" text-anchor="middle" font-size="12" fill="#4b5563">
      Bee carries pollen from anther to stigma.
    </text>
  </g>
</svg>
