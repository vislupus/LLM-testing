<svg width="1800" height="1200" viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#dfefff"/>
    </linearGradient>
  </defs>
  <rect width="1800" height="1200" fill="url(#bgGrad)"/>

  <!-- Title -->

  <text x="900" y="70" text-anchor="middle" font-size="42" font-family="Arial" fill="#2a3b5f">Flower Anatomy Drag and Drop</text>

  <!-- Instruction Panel -->

  <rect x="1350" y="120" width="380" height="500" rx="20" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="1370" y="170" font-size="24" font-family="Arial" fill="#2a3b5f">Instructions</text>
  <text x="1370" y="210" font-size="18" font-family="Arial" fill="#444">
    Drag labels from the word bank
  </text>
  <text x="1370" y="235" font-size="18" font-family="Arial" fill="#444">
    and match them to the correct
  </text>
  <text x="1370" y="260" font-size="18" font-family="Arial" fill="#444">
    parts of the flower diagram.
  </text>
  <text x="1370" y="300" font-size="18" font-family="Arial" fill="#444">
    Use Hint or Check Answer
  </text>
  <text x="1370" y="325" font-size="18" font-family="Arial" fill="#444">
    to test your knowledge.
  </text>

  <!-- Flower Diagram -->

  <g transform="translate(500,250)">
    <!-- Stem -->
    <rect x="180" y="250" width="40" height="300" fill="#4caf50"/>
    <!-- Petals -->
    <ellipse cx="200" cy="200" rx="120" ry="80" fill="#ff80ab"/>
    <ellipse cx="200" cy="200" rx="80" ry="120" fill="#ff4081"/>
    <!-- Center -->
    <circle cx="200" cy="200" r="40" fill="#ffd54f"/>
    <!-- Pistil -->
    <rect x="190" y="120" width="20" height="80" fill="#8d6e63"/>
    <circle cx="200" cy="110" r="15" fill="#8d6e63"/>
    <!-- Stamens -->
    <line x1="160" y1="160" x2="130" y2="120" stroke="#6d4c41" stroke-width="4"/>
    <circle cx="130" cy="120" r="8" fill="#6d4c41"/>
    <line x1="240" y1="160" x2="270" y2="120" stroke="#6d4c41" stroke-width="4"/>
    <circle cx="270" cy="120" r="8" fill="#6d4c41"/>
  </g>

  <!-- Label Targets -->

  <g font-size="16" font-family="Arial" fill="#2a3b5f">
    <line x1="700" y1="400" x2="850" y2="350" stroke="#555"/>
    <rect x="850" y="330" width="120" height="40" rx="10" fill="#fff" stroke="#aaa"/>
    <text x="910" y="355" text-anchor="middle">Petal</text>


<line x1="700" y1="500" x2="850" y2="480" stroke="#555"/>
<rect x="850" y="460" width="120" height="40" rx="10" fill="#fff" stroke="#aaa"/>
<text x="910" y="485" text-anchor="middle">Stamen</text>

<line x1="700" y1="300" x2="850" y2="250" stroke="#555"/>
<rect x="850" y="230" width="120" height="40" rx="10" fill="#fff" stroke="#aaa"/>
<text x="910" y="255" text-anchor="middle">Pistil</text>


  </g>

  <!-- Word Bank -->

  <g transform="translate(200,800)">
    <text x="0" y="-20" font-size="24" font-family="Arial" fill="#2a3b5f">Word Bank</text>


<g font-size="18" font-family="Arial">
  <rect x="0" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="75" y="25" text-anchor="middle">Petal</text>

  <rect x="170" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="245" y="25" text-anchor="middle">Sepal</text>

  <rect x="340" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="415" y="25" text-anchor="middle">Stamen</text>

  <rect x="510" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="585" y="25" text-anchor="middle">Pistil</text>

  <rect x="680" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="755" y="25" text-anchor="middle">Anther</text>

  <rect x="850" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="925" y="25" text-anchor="middle">Filament</text>

  <rect x="1020" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="1095" y="25" text-anchor="middle">Ovary</text>

  <rect x="1190" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="1265" y="25" text-anchor="middle">Style</text>

  <rect x="1360" y="0" width="150" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="1435" y="25" text-anchor="middle">Stigma</text>

  <rect x="1530" y="0" width="180" height="40" rx="12" fill="#ffffff" stroke="#999"/>
  <text x="1620" y="25" text-anchor="middle">Receptacle</text>
</g>


  </g>

  <!-- Buttons -->

  <g font-size="20" font-family="Arial">
    <a xlink:href="#hintPanel">
      <rect x="1350" y="650" width="120" height="50" rx="15" fill="#4fc3f7"/>
      <text x="1410" y="680" text-anchor="middle" fill="#fff">Hint</text>
    </a>


<a xlink:href="#checkPanel">
  <rect x="1490" y="650" width="160" height="50" rx="15" fill="#66bb6a"/>
  <text x="1570" y="680" text-anchor="middle" fill="#fff">Check</text>
</a>

<a xlink:href="#resetPanel">
  <rect x="1670" y="650" width="120" height="50" rx="15" fill="#ef5350"/>
  <text x="1730" y="680" text-anchor="middle" fill="#fff">Reset</text>
</a>


  </g>

  <!-- Hint Panel -->

  <g id="hintPanel">
    <rect x="400" y="300" width="1000" height="400" rx="20" fill="#ffffff" stroke="#333"/>
    <text x="900" y="350" text-anchor="middle" font-size="28">Hint</text>
    <text x="900" y="400" text-anchor="middle" font-size="20">
      Petals are colorful, stamens produce pollen, pistil is central.
    </text>
    <a xlink:href="#">
      <text x="900" y="650" text-anchor="middle" font-size="20" fill="blue">Close</text>
    </a>
  </g>

  <!-- Check Panel -->

  <g id="checkPanel">
    <rect x="400" y="300" width="1000" height="400" rx="20" fill="#ffffff" stroke="#333"/>
    <text x="900" y="350" text-anchor="middle" font-size="28">Check Answer</text>
    <text x="900" y="420" text-anchor="middle" font-size="20">
      Compare your placements with correct flower anatomy.
    </text>
    <a xlink:href="#">
      <text x="900" y="650" text-anchor="middle" font-size="20" fill="blue">Close</text>
    </a>
  </g>

  <!-- Reset Panel -->

  <g id="resetPanel">
    <rect x="400" y="300" width="1000" height="400" rx="20" fill="#ffffff" stroke="#333"/>
    <text x="900" y="350" text-anchor="middle" font-size="28">Reset</text>
    <text x="900" y="420" text-anchor="middle" font-size="20">
      Reset the activity and try again.
    </text>
    <a xlink:href="#">
      <text x="900" y="650" text-anchor="middle" font-size="20" fill="blue">Close</text>
    </a>
  </g>

  <!-- Pollination Inset -->

  <g transform="translate(1350,720)">
    <rect width="350" height="250" rx="20" fill="#ffffff" stroke="#ccc"/>
    <text x="175" y="40" text-anchor="middle" font-size="20">Pollination</text>
    <circle cx="120" cy="130" r="40" fill="#ff80ab"/>
    <circle cx="230" cy="130" r="40" fill="#ff80ab"/>
    <line x1="160" y1="130" x2="190" y2="130" stroke="#333" marker-end="url(#arrow)"/>
  </g>

</svg>
