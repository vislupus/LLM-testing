<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flower Anatomy Drag &amp; Drop — Static SVG Learning Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#0e1b22;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  svg{display:block;width:100vw;height:auto;max-height:100vh;}
</style>
</head>
<body>
<!-- ============================================================
     FLOWER ANATOMY DRAG & DROP  —  single valid static SVG document
     1800 x 1200 · no JavaScript · no images · no external assets
     Interaction = internal links (#fragments) + :target CSS + SMIL
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1800 1200" role="img" aria-labelledby="ttl dsc" preserveAspectRatio="xMidYMid meet">
  <title id="ttl">Flower Anatomy Drag and Drop — static SVG teaching board</title>
  <desc id="dsc">A textbook-style board: a vector flower with ten numbered drop zones connected by arrows to ten label tiles held in a word bank. Hint, Check Answer and Reset buttons open popup panels. Includes a pollination to seed inset.</desc>

  <style>
    text{font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;}
    .h1{font-size:47px;font-weight:800;letter-spacing:-1.1px;fill:#16262e}
    .h2{font-size:25px;font-weight:800;letter-spacing:-.4px;fill:#1c2c34}
    .h3{font-size:18px;font-weight:700;fill:#22343d}
    .b{font-size:16px;fill:#4d5f69}
    .sm{font-size:14px;fill:#61737d}
    .tn{font-size:12.5px;fill:#7d8d96}
    .mut{fill:#6d7f89}
    .lbl{font-size:13px;font-weight:700;letter-spacing:1.3px}
    /* ---- action buttons ---- */
    .btn .bg{transition:filter .18s ease}
    a.btn:hover .bg{filter:brightness(1.08)}
    a.btn:active{opacity:.92}
    /* ---- word-bank tiles (draggable style) ---- */
    .tin{transition:transform .18s ease,opacity .2s ease;transform-box:fill-box;transform-origin:center}
    a.tile:hover .tin{transform:translateY(-7px)}
    a.tile:hover .tbg{stroke-width:3.2}
    a.tile:active .tin{transform:translateY(-2px)}
    svg:has(#d1:target) #t1 .tin,svg:has(#d2:target) #t2 .tin,svg:has(#d3:target) #t3 .tin,
    svg:has(#d4:target) #t4 .tin,svg:has(#d5:target) #t5 .tin,svg:has(#d6:target) #t6 .tin,
    svg:has(#d7:target) #t7 .tin,svg:has(#d8:target) #t8 .tin,svg:has(#d9:target) #t9 .tin,
    svg:has(#d10:target) #t10 .tin{opacity:.26}
    /* ---- drag-and-drop simulation groups ---- */
    .drop{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease}
    .drop:target{opacity:1;visibility:visible}
    .ghost{filter:drop-shadow(0 5px 7px rgba(20,50,45,.14))}
    /* ---- popup panels ---- */
    .modal{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease}
    .modal:target{opacity:1;visibility:visible;pointer-events:auto}
    .sheet{transform:scale(.955);transition:transform .3s cubic-bezier(.2,.9,.3,1.3);transform-box:fill-box;transform-origin:center}
    .modal:target .sheet{transform:scale(1)}
    a.cls:hover .cbtn{fill:#e9f1ee}
    a.cls:hover .ctxt{fill:#1c2c34}
    /* ---- static leader lines ---- */
    .leadc{fill:none;stroke:#ffffff;stroke-opacity:.93;stroke-width:8;stroke-linecap:round}
    .flight{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:11 9}
    .zone{stroke-width:2;stroke-dasharray:7 6;opacity:.62}
    .zglow{fill:none;stroke-width:3.4;stroke-dasharray:10 8}
  </style>

  <defs>
    <linearGradient id="gPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f2"/><stop offset=".52" stop-color="#e9f1f8"/><stop offset="1" stop-color="#f4f0f8"/>
    </linearGradient>
    <radialGradient id="blobA" cx=".3" cy=".3" r=".8">
      <stop offset="0" stop-color="#bfe3cf" stop-opacity=".75"/><stop offset="1" stop-color="#bfe3cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx=".5" cy=".5" r=".8">
      <stop offset="0" stop-color="#c8d3f4" stop-opacity=".72"/><stop offset="1" stop-color="#c8d3f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx=".5" cy=".5" r=".8">
      <stop offset="0" stop-color="#f7cfe0" stop-opacity=".62"/><stop offset="1" stop-color="#f7cfe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gPetalA" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fbd0dd"/><stop offset=".55" stop-color="#f0a3bd"/><stop offset="1" stop-color="#dd7ba2"/>
    </linearGradient>
    <linearGradient id="gPetalB" x1=".1" y1="1" x2=".9" y2="0">
      <stop offset="0" stop-color="#f6c3d4"/><stop offset="1" stop-color="#e58bad"/>
    </linearGradient>
    <linearGradient id="gPetalBack" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e7a2bd"/><stop offset="1" stop-color="#f2bed2"/>
    </linearGradient>
    <linearGradient id="gSepal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dc38a"/><stop offset="1" stop-color="#5f9558"/>
    </linearGradient>
    <linearGradient id="gStem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d8f57"/><stop offset=".5" stop-color="#7cab6d"/><stop offset="1" stop-color="#4f7f4b"/>
    </linearGradient>
    <linearGradient id="gLeaf" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#a8cd93"/><stop offset="1" stop-color="#5d9457"/>
    </linearGradient>
    <linearGradient id="gAnther" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c874"/><stop offset="1" stop-color="#c98119"/>
    </linearGradient>
    <linearGradient id="gStigma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48fe0"/><stop offset="1" stop-color="#6a4fb2"/>
    </linearGradient>
    <linearGradient id="gStyle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f77cf"/><stop offset=".5" stop-color="#b3a1e6"/><stop offset="1" stop-color="#7760bd"/>
    </linearGradient>
    <linearGradient id="gOvary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3a8e2"/><stop offset="1" stop-color="#8f6fb8"/>
    </linearGradient>
    <linearGradient id="gRecep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cfb6"/><stop offset="1" stop-color="#6d9d86"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.5" fill="#93aaa4" opacity=".26"/>
    </pattern>
    <filter id="sh" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#14342c" flood-opacity=".11"/>
    </filter>
    <marker id="mRose" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#d9648a"/></marker>
    <marker id="mGreen" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#4f9663"/></marker>
    <marker id="mBronze" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#c07f1e"/></marker>
    <marker id="mDark" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#b0610f"/></marker>
    <marker id="mAmber" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#c89020"/></marker>
    <marker id="mV1" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#6f56b8"/></marker>
    <marker id="mV2" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#8d72d4"/></marker>
    <marker id="mV3" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#5b41a8"/></marker>
    <marker id="mV4" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#a06fc4"/></marker>
    <marker id="mTeal" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto"><path d="M0,0 L15,7.5 L0,15 Z" fill="#3f8f92"/></marker>
  </defs>

  <!-- ======================= PAGE BACKGROUND ======================= -->
  <rect width="1800" height="1200" fill="url(#gPage)"/>
  <circle cx="140" cy="1080" r="420" fill="url(#blobA)"/>
  <circle cx="1720" cy="180" r="380" fill="url(#blobB)"/>
  <circle cx="1500" cy="1150" r="300" fill="url(#blobC)"/>
  <circle cx="980" cy="120" r="260" fill="url(#blobA)"/>

  <!-- ======================= HEADER ======================= -->
  <g>
    <rect x="40" y="26" width="1720" height="96" rx="26" fill="#ffffff" opacity=".97" stroke="#e2ebe7" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="40" y="26" width="10" height="96" rx="5" fill="#4f9663"/>
    <text class="h1" x="78" y="80">Flower Anatomy Drag &amp; Drop</text>
    <text class="sm" x="80" y="106">Labelling practice board · 10 flower parts · 10 drop zones · word bank tiles · pure static SVG (no scripts, no images)</text>
    <!-- action buttons -->
    <a class="btn" href="#popup-hint" aria-label="Open the hint panel">
      <title>Hint — open the clue panel</title>
      <g>
        <rect x="990" y="49" width="175" height="54" rx="27" fill="#4f9663" class="bg"/>
        <circle cx="1020" cy="76" r="10" fill="#ffffff" opacity=".9"/>
        <text x="1032" y="70" font-size="11" fill="#e9f6ec">💡</text>
        <text x="1052" y="77" font-size="19" font-weight="700" fill="#ffffff">Hint</text>
      </g>
    </a>
    <a class="btn" href="#popup-check" aria-label="Open the check answer panel">
      <title>Check Answer — open the answer key and score card</title>
      <g>
        <rect x="1175" y="49" width="230" height="54" rx="27" fill="#2f6f9e" class="bg"/>
        <text x="1207" y="77" font-size="18" fill="#cfe6f6">✓</text>
        <text x="1230" y="77" font-size="19" font-weight="700" fill="#ffffff">Check Answer</text>
      </g>
    </a>
    <a class="btn" href="#popup-reset" aria-label="Open the reset panel">
      <title>Reset — open the confirmation panel</title>
      <g>
        <rect x="1415" y="49" width="150" height="54" rx="27" fill="#b8556f" class="bg"/>
        <text x="1447" y="78" font-size="19" fill="#ffe2ea">↺</text>
        <text x="1470" y="77" font-size="19" font-weight="700" fill="#ffffff">Reset</text>
      </g>
    </a>
    <g>
      <rect x="1580" y="62" width="150" height="30" rx="15" fill="#f1f6f4" stroke="#dde8e4"/>
      <text x="1655" y="82" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#5d7a6f">STATIC · NO JS</text>
    </g>
  </g>

  <!-- ======================= RIGHT INSTRUCTION PANEL ======================= -->
  <g>
    <rect x="1160" y="140" width="600" height="876" rx="26" fill="#ffffff" opacity=".97" stroke="#e2ebe7" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="1160" y="140" width="600" height="8" rx="4" fill="#2f6f9e"/>
    <text class="lbl" x="1188" y="192" fill="#8b9ca5">HOW TO USE THE BOARD</text>
    <text class="h2" x="1188" y="224">Your task, step by step</text>
    <g font-size="15" fill="#4d5f69">
      <circle cx="1204" cy="264" r="15" fill="#eaf3ee" stroke="#bfd9ca"/><text x="1204" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#3f7f5c">1</text>
      <text x="1232" y="258">Read the flower. Ten numbered badges sit on the</text>
      <text x="1232" y="278">illustrated parts and every badge has a dashed zone.</text>
      <circle cx="1204" cy="322" r="15" fill="#e9f0f7" stroke="#c2d5e5"/><text x="1204" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6f9e">2</text>
      <text x="1232" y="316">Label the zones: petal, sepal, stamen, pistil, anther,</text>
      <text x="1232" y="336">filament, ovary, style, stigma and receptacle.</text>
      <circle cx="1204" cy="380" r="15" fill="#f7edf1" stroke="#e5c4d0"/><text x="1204" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#b8556f">3</text>
      <text x="1232" y="374">Pick a label tile from the word bank below the board —</text>
      <text x="1232" y="394">click it and a demo drop travels along the dashed path.</text>
      <circle cx="1204" cy="438" r="15" fill="#f5f1fa" stroke="#d6c9ea"/><text x="1204" y="444" text-anchor="middle" font-size="14" font-weight="700" fill="#6f56b8">4</text>
      <text x="1232" y="432">Then press Hint for clues, Check Answer for the key, and</text>
      <text x="1232" y="452">Reset to clear the board and close every open panel.</text>
    </g>
    <line x1="1188" y1="486" x2="1732" y2="486" stroke="#e6eeeb" stroke-width="2"/>
    <text class="lbl" x="1188" y="518" fill="#8b9ca5">COLOUR FAMILIES (CLUE, NOT THE ANSWER)</text>
    <g font-size="14.5">
      <circle cx="1200" cy="548" r="8" fill="#d9648a"/><text x="1218" y="553" font-weight="700" fill="#233540">Petal family</text><text class="b" x="1330" y="553">rose · showy, colourful outer whorl</text>
      <circle cx="1200" cy="578" r="8" fill="#4f9663"/><text x="1218" y="583" font-weight="700" fill="#233540">Sepal family</text><text class="b" x="1330" y="583">green · protective whorl under the petals</text>
      <circle cx="1200" cy="608" r="8" fill="#c07f1e"/><text x="1218" y="613" font-weight="700" fill="#233540">Stamen family</text><text class="b" x="1330" y="613">amber · stamen = anther on top of filament</text>
      <circle cx="1200" cy="638" r="8" fill="#6f56b8"/><text x="1218" y="643" font-weight="700" fill="#233540">Pistil family</text><text class="b" x="1330" y="643">violet · pistil = stigma + style + ovary</text>
      <circle cx="1200" cy="668" r="8" fill="#3f8f92"/><text x="1218" y="673" font-weight="700" fill="#233540">Receptacle</text><text class="b" x="1330" y="673">teal · base the whole flower sits on</text>
    </g>
    <line x1="1188" y1="698" x2="1732" y2="698" stroke="#e6eeeb" stroke-width="2"/>

    <!-- ---------- POLLINATION / REPRODUCTION INSET ---------- -->
    <g>
      <rect x="1180" y="700" width="560" height="306" rx="20" fill="#f8fbf9" stroke="#e0eae5" stroke-width="1.5"/>
      <rect x="1180" y="700" width="560" height="8" rx="4" fill="#3f8f92"/>
      <text class="lbl" x="1204" y="736" fill="#8b9ca5">INSET · POLLINATION TO SEED</text>
      <text x="1204" y="760" font-size="15" font-weight="700" fill="#22343d">Plant reproduction in four frames</text>

      <!-- mini flower, side view -->
      <g>
        <path d="M 1268,946 L 1268,898" stroke="#5d8f57" stroke-width="6" stroke-linecap="round"/>
        <path d="M 1268,916 C 1296,904 1318,908 1330,922 C 1310,934 1286,932 1268,924 Z" fill="#8fbd7e"/>
        <path d="M 1246,886 C 1258,858 1286,848 1300,862 C 1302,884 1282,900 1258,902 Z" fill="#f0a3bd"/>
        <path d="M 1290,886 C 1296,858 1320,850 1334,864 C 1334,886 1312,902 1290,900 Z" fill="#e58bad"/>
        <path d="M 1240,904 C 1224,892 1204,890 1194,898 C 1204,914 1228,918 1244,912 Z" fill="#6f9e64"/>
        <!-- pistil leaning out over the petals -->
        <path d="M 1268,898 C 1262,868 1244,854 1226,846" stroke="url(#gStyle)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="1224" cy="844" r="8" fill="url(#gStigma)"/>
        <ellipse cx="1268" cy="912" rx="17" ry="13" fill="url(#gOvary)" stroke="#654f92"/>
        <circle cx="1264" cy="912" r="3.4" fill="#e6f2cf"/><circle cx="1273" cy="913" r="3.4" fill="#e6f2cf"/>
        <circle cx="1268" cy="918" r="3" fill="#e6f2cf"/>
      </g>
      <!-- bee + pollen -->
      <g>
        <path id="beePath" d="M 1204,794 C 1186,846 1230,864 1216,822 C 1236,796 1194,846 1204,794" fill="none" stroke="#e4b96a" stroke-width="2" stroke-dasharray="6 6" opacity=".85"/>
        <g>
          <ellipse cx="0" cy="0" rx="15" ry="11" fill="#e2b23c" stroke="#8a6b16" stroke-width="1.6"/>
          <path d="M -4,-6 L -4,6 M 3,-6 L 3,6" stroke="#5d4510" stroke-width="2.4"/>
          <ellipse cx="-2" cy="-13" rx="10" ry="7" fill="#ffffff" opacity=".85" stroke="#c9dbe4" stroke-width="1.2" transform="rotate(-18)"/>
          <circle cx="13" cy="-3" r="1.6" fill="#3c2e0b"/>
          <animateMotion dur="7s" repeatCount="indefinite" keyTimes="0;.5;1" keyPoints="0;1;0" calcMode="linear"><mpath xlink:href="#beePath"/></animateMotion>
        </g>
        <circle cx="1226" cy="864" r="3" fill="#e8a11f"><animate attributeName="cy" values="870;846;870" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="1236" cy="868" r="2.6" fill="#e8a11f"><animate attributeName="cy" values="874;850;874" dur="3.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/></circle>
        <text x="1196" y="784" font-size="12" font-weight="700" fill="#8a6b16">pollen</text>
      </g>
      <g>
        <circle cx="1352" cy="830" r="12" fill="#f5f1fa" stroke="#d6c9ea"/><text x="1352" y="835" text-anchor="middle" font-size="13" font-weight="700" fill="#6f56b8">1</text>
        <text x="1370" y="827" font-size="12.5" fill="#4d5f69">a bee carries pollen</text>
        <text x="1370" y="843" font-size="12.5" fill="#4d5f69">to the next flower</text>
        <circle cx="1352" cy="878" r="12" fill="#f5f1fa" stroke="#d6c9ea"/><text x="1352" y="883" text-anchor="middle" font-size="13" font-weight="700" fill="#6f56b8">2</text>
        <text x="1370" y="875" font-size="12.5" fill="#4d5f69">the pollen tube grows</text>
        <text x="1370" y="891" font-size="12.5" fill="#4d5f69">down the style to an ovule</text>
      </g>
      <!-- magnified pistil inset -->
      <g>
        <circle cx="1610" cy="872" r="62" fill="#ffffff" stroke="#c9bce6" stroke-width="2.5" stroke-dasharray="8 6"/>
        <path d="M 1610,832 L 1610,894" stroke="url(#gStyle)" stroke-width="9" stroke-linecap="round"/>
        <circle cx="1610" cy="828" r="13" fill="url(#gStigma)"/>
        <circle cx="1601" cy="818" r="2.6" fill="#e8a11f"/><circle cx="1612" cy="813" r="2.6" fill="#e8a11f"/><circle cx="1621" cy="821" r="2.6" fill="#e8a11f"/>
        <ellipse cx="1610" cy="902" rx="29" ry="21" fill="url(#gOvary)" stroke="#654f92" stroke-width="2"/>
        <path d="M 1610,836 C 1604,860 1604,870 1606,882" stroke="#c9a11f" stroke-width="3" stroke-dasharray="6 5" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.1s" repeatCount="indefinite"/></path>
        <circle cx="1606" cy="898" r="8" fill="#eef6d8" stroke="#7d8f45" stroke-width="2"/>
        <circle cx="1606" cy="898" r="2.6" fill="#b5651a"><animate attributeName="opacity" values="0;1;1" dur="3.4s" repeatCount="indefinite"/></circle>
        <text x="1610" y="956" text-anchor="middle" font-size="12" font-weight="700" fill="#7d8f45">ovule becomes a seed</text>
        <text x="1692" y="870" text-anchor="middle" font-size="11.5" fill="#8f6c14" transform="rotate(-90 1692 870)">pollen tube</text>
        <text x="1656" y="810" font-size="11.5" font-weight="700" fill="#6f56b8">stigma</text>
      </g>
      <text x="1204" y="974" font-size="12.5" fill="#4d5f69">Pollen lands on the sticky stigma, a pollen tube grows down the style,</text>
      <text x="1204" y="992" font-size="12.5" fill="#4d5f69">fertilises an ovule in the ovary → ovule = seed, ovary = fruit.</text>
    </g>
  </g>

  <!-- ======================= DIAGRAM BOARD ======================= -->
  <g>
    <rect x="40" y="140" width="1100" height="876" rx="26" fill="#ffffff" opacity=".97" stroke="#e2ebe7" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="40" y="140" width="1100" height="876" rx="26" fill="url(#dots)"/>
    <rect x="40" y="140" width="8" height="876" rx="4" fill="#4f9663"/>
  </g>

  <!-- ---------- FLOWER ILLUSTRATION ---------- -->
  <g id="flower">

    <g class="sheet">

      <text x="490" y="330" font-size="26" font-weight="800" fill="#ffffff">💡 Hint board</text>
      <text x="1246" y="330" text-anchor="end" font-size="14" fill="#e2f2e7">clues by category, never the full answer</text>
      <a class="cls" href="#x-close"><title>Close the hint panel</title><g><rect class="cbtn" x="1268" y="292" width="66" height="36" rx="18" fill="#ffffff" opacity=".92"/><text class="ctxt" x="1301" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#3f7f5c">✕ CLOSE</text></g></a>
      <!-- hint cards -->
      <g>
        <rect x="486" y="378" width="400" height="112" rx="16" fill="#fdf3f6" stroke="#f0cfdb"/>
        <text x="506" y="406" font-size="16" font-weight="700" fill="#a63d60">1 · Petal (rose)</text>
        <text x="506" y="432" font-size="13.5" fill="#5b6b74">The showy, coloured whorl that attracts pollinators.</text>
        <text x="506" y="452" font-size="13.5" fill="#5b6b74">Zone 1 sits on the wide left petal, level with the stem.</text>
        <text x="506" y="474" font-size="13" fill="#a63d60">Veins run from the centre out to the rounded tip.</text>
      </g>
      <g>
        <rect x="914" y="378" width="400" height="112" rx="16" fill="#eef7ef" stroke="#cfe3d3"/>
        <text x="934" y="406" font-size="16" font-weight="700" fill="#2f6b45">2 · Sepal (green)</text>
        <text x="934" y="432" font-size="13.5" fill="#5b6b74">Tough green flaps under the petals — the calyx that</text>
        <text x="934" y="452" font-size="13.5" fill="#5b6b74">protected the bud. Zone 2 points to the lower left.</text>
        <text x="934" y="474" font-size="13" fill="#2f6b45">Sepals curve outward and are never coloured like petals.</text>
      </g>
      <g>
        <rect x="486" y="504" width="400" height="112" rx="16" fill="#fbf2e2" stroke="#ecd8b3"/>
        <text x="506" y="532" font-size="16" font-weight="700" fill="#8a5a11">3 · Stamen (bronze)</text>
        <text x="506" y="558" font-size="13.5" fill="#5b6b74">One whole male unit = anther on top of filament.</text>
        <text x="506" y="578" font-size="13.5" fill="#5b6b74">Zone 3 circles the complete lower-right stamen.</text>
        <text x="506" y="600" font-size="13" fill="#8a5a11">Remember: a stamen always has two parts.</text>
      </g>
      <g>
        <rect x="914" y="504" width="400" height="112" rx="16" fill="#f3effc" stroke="#d9cfee"/>
        <text x="934" y="532" font-size="16" font-weight="700" fill="#4d3a86">4 · Pistil (deep violet)</text>
        <text x="934" y="558" font-size="13.5" fill="#5b6b74">The whole female unit: stigma + style + ovary.</text>
        <text x="934" y="578" font-size="13.5" fill="#5b6b74">Zone 4 brackets the violet centre of the flower.</text>
        <text x="934" y="600" font-size="13" fill="#4d3a86">Look for the three-lobed tip: that is the stigma.</text>
      </g>
      <g>
        <rect x="486" y="630" width="400" height="112" rx="16" fill="#faf0e0" stroke="#e8d3ae"/>
        <text x="506" y="658" font-size="16" font-weight="700" fill="#7d4a13">5 · Anther (dark amber)</text>
        <text x="506" y="684" font-size="13.5" fill="#5b6b74">The pollen-packed knob at the top of the stalk.</text>
        <text x="506" y="704" font-size="13.5" fill="#5b6b74">Zone 5 aims at the upper-right anther.</text>
        <text x="506" y="726" font-size="13" fill="#7d4a13">Pollen grains are the little dots around it.</text>
      </g>
      <g>
        <rect x="914" y="630" width="400" height="112" rx="16" fill="#fdf4e4" stroke="#ecd9ae"/>
        <text x="934" y="658" font-size="16" font-weight="700" fill="#8f6a12">6 · Filament (light amber)</text>
        <text x="934" y="684" font-size="13.5" fill="#5b6b74">The thin, thread-like stalk that lifts the anther.</text>
        <text x="934" y="704" font-size="13.5" fill="#5b6b74">Zone 6 follows the stalk of the same stamen.</text>
        <text x="934" y="726" font-size="13" fill="#8f6a12">Thin stalk = filament; thick violet tube = style.</text>
      </g>
      <g>
        <rect x="486" y="756" width="400" height="112" rx="16" fill="#f3effc" stroke="#d9cfee"/>
        <text x="506" y="784" font-size="16" font-weight="700" fill="#5f4a9e">7 + 8 · Style and Stigma (violet)</text>
        <text x="506" y="810" font-size="13.5" fill="#5b6b74">Stigma = sticky tip that catches pollen (zone 8, top).</text>
        <text x="506" y="830" font-size="13.5" fill="#5b6b74">Style = the tube carrying pollen down to the ovary</text>
        <text x="506" y="852" font-size="13.5" fill="#5b6b74">(zone 7, directly below the stigma).</text>
      </g>
      <g>
        <rect x="914" y="756" width="400" height="112" rx="16" fill="#f8eefb" stroke="#e2cdec"/>
        <text x="934" y="784" font-size="16" font-weight="700" fill="#734a91">9 + 10 · Ovary and Receptacle</text>
        <text x="934" y="810" font-size="13.5" fill="#5b6b74">Ovary (zone 9): swollen base of the pistil, packed</text>
        <text x="934" y="830" font-size="13.5" fill="#5b6b74">with ovules that become seeds.</text>
        <text x="934" y="852" font-size="13.5" fill="#3f8f92">Receptacle (zone 10, teal): the base everything joins.</text>
      </g>
      <text x="900" y="898" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4d5f69">Order of elimination: petals → sepals → stamens → pistil → receptacle. Work outside-in!</text>
    </g>
  </g>
