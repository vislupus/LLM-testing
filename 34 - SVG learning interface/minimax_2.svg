<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1200" viewBox="0 0 1800 1200" style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #f0f8ff;">

  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
    
    <!-- Arrow Marker for Hints -->
    <marker id="hintArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9800" />
    </marker>

    <!-- Styles for Interactivity -->
    <style>
      .target-label { 
        display: none; 
        font-weight: bold; 
        font-size: 18px; 
        fill: #333;
        text-anchor: middle;
        pointer-events: none; 
      }
      
      /* Show label when URL hash matches ID */
      .target-label:target { 
        display: block; 
      }

      .hint-line {
        display: none;
        stroke: #FF9800;
        stroke-width: 2;
        stroke-dasharray: 5,5;
        marker-end: url(#hintArrow);
      }
      
      .hint-line:target { display: block; }

      .popup {
        display: none;
        opacity: 0.95;
      }
      
      /* Popups are visible when their ID is the target */
      .popup:target { display: block; }
      
      /* Close button behavior is handled by clicking background link */

      .tile {
        cursor: pointer;
        transition: fill 0.2s;
      }
      .tile:hover {
        fill: #E8F5E9;
      }
      
      text { user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Decorative Border -->
  <rect x="20" y="20" width="1760" height="1160" fill="none" stroke="#B2EBF2" stroke-width="5" rx="20" />

  <!-- Title Area -->
  <g transform="translate(50, 60)">
    <text x="0" y="40" font-size="42" font-weight="bold" fill="#006064">Flower Anatomy</text>
    <text x="0" y="80" font-size="24" fill="#00838F">Drag &amp; Drop Learning Interface</text>
  </g>

  <!-- Main Control Buttons -->
  <g transform="translate(1300, 50)">
    <!-- Hint Button -->
    <a xlink:href="#hint-popup">
      <rect width="120" height="50" rx="10" fill="#FF9800" filter="url(#dropShadow)"/>
      <text x="60" y="32" text-anchor="middle" fill="white" font-weight="bold" font-size="18">HINT</text>
    </a>
    <!-- Check Button -->
    <a xlink:href="#check-popup" transform="translate(130, 0)">
      <rect width="120" height="50" rx="10" fill="url(#btnGradient)" filter="url(#dropShadow)"/>
      <text x="60" y="32" text-anchor="middle" fill="white" font-weight="bold" font-size="18">CHECK</text>
    </a>
    <!-- Reset Button -->
    <a xlink:href="#" transform="translate(260, 0)">
      <rect width="120" height="50" rx="10" fill="#F44336" filter="url(#dropShadow)"/>
      <text x="60" y="32" text-anchor="middle" fill="white" font-weight="bold" font-size="18">RESET</text>
    </a>
  </g>

  <!-- Layout Grid -->
  
  <!-- Left Side: Diagram (The Stage) -->
  <g transform="translate(50, 150)">
    <!-- Diagram Background Panel -->
    <rect width="1000" height="900" rx="15" fill="white" stroke="#ddd" stroke-width="2" filter="url(#dropShadow)"/>
    
    <!-- The Flower Illustration -->
    <g transform="translate(500, 450)">
      
      <!-- Stem -->
      <path d="M0,100 Q-20,300 0,400" fill="none" stroke="#4CAF50" stroke-width="8" />
      <!-- Leaves -->
      <path d="M0,250 Q-60,220 -80,180 Q-40,200 0,230" fill="#66BB6A" />
      <path d="M0,300 Q60,270 80,230 Q40,250 0,280" fill="#66BB6A" />

      <!-- Receptacle (Base of flower) -->
      <ellipse cx="0" cy="100" rx="40" ry="20" fill="#8BC34A" />
      
      <!-- Sepals -->
      <path d="M-30,100 Q-50,60 -10,40 Q-20,80 -30,100" fill="#7CB342" />
      <path d="M30,100 Q50,60 10,40 Q20,80 30,100" fill="#7CB342" />

      <!-- Petals -->
      <g fill="#E91E63" stroke="#C2185B" stroke-width="1">
        <path d="M0,100 Q-60,0 -20,-80 Q0,-20 0,100" />
        <path d="M0,100 Q60,0 20,-80 Q0,-20 0,100" />
        <path d="M0,100 Q-80,40 -90,-20 Q-30,20 0,100" />
        <path d="M0,100 Q80,40 90,-20 Q30,20 0,100" />
        <path d="M0,100 Q-40,-60 0,-100 Q40,-60 0,100" />
      </g>

      <!-- Pistil (Female) -->
      <!-- Ovary -->
      <ellipse cx="0" cy="80" rx="15" ry="20" fill="#CDDC39" stroke="#AFB42B" />
      <!-- Style -->
      <rect x="-2" y="20" width="4" height="60" fill="#CDDC39" />
      <!-- Stigma -->
      <path d="M-8,20 L8,20 L5,10 L-5,10 Z" fill="#FFEB3B" />

      <!-- Stamen (Male) -->
      <!-- Filament -->
      <line x1="-20" y1="80" x2="-30" y2="30" stroke="#8BC34A" stroke-width="3" />
      <line x1="20" y1="80" x2="30" y2="30" stroke="#8BC34A" stroke-width="3" />
      <!-- Anther -->
      <ellipse cx="-30" cy="30" rx="8" ry="12" fill="#FFC107" transform="rotate(-20 -30 30)" />
      <ellipse cx="30" cy="30" rx="8" ry="12" fill="#FFC107" transform="rotate(20 30 30)" />

      <!-- Interaction Targets & Labels -->
      
      <!-- 1. Receptacle -->
      <g>
        <a xlink:href="#label-receptacle">
          <circle cx="0" cy="110" r="20" fill="transparent" stroke="#aaa" stroke-dasharray="4" />
        </a>
        <!-- The text that appears when linked -->
        <text id="label-receptacle" class="target-label" x="0" y="150">Receptacle</text>
        <!-- Hint line -->
        <line x1="0" y1="110" x2="0" y2="140" class="hint-line" />
      </g>

      <!-- 2. Sepal -->
      <g transform="translate(-30, 80)">
        <a xlink:href="#label-sepal">
           <circle cx="0" cy="0" r="20" fill="transparent" />
        </a>
        <text id="label-sepal" class="target-label" x="-80" y="-20">Sepal</text>
        <line x1="0" y1="0" x2="-70" y2="-15" class="hint-line" />
      </g>

      <!-- 3. Petal -->
      <g transform="translate(-60, -20)">
        <a xlink:href="#label-petal">
           <circle cx="0" cy="0" r="25" fill="transparent" />
        </a>
        <text id="label-petal" class="target-label" x="-120" y="0">Petal</text>
        <line x1="0" y1="0" x2="-110" y2="0" class="hint-line" />
      </g>

      <!-- 4. Stamen -->
      <g transform="translate(30, 50)">
        <a xlink:href="#label-stamen">
           <circle cx="0" cy="0" r="20" fill="transparent" />
        </a>
        <text id="label-stamen" class="target-label" x="80" y="0">Stamen</text>
        <line x1="0" y1="0" x2="70" y2="0" class="hint-line" />
      </g>
      
      <!-- 5. Anther -->
      <g transform="translate(30, 30)">
        <a xlink:href="#label-anther">
           <circle cx="0" cy="0" r="15" fill="transparent" />
        </a>
        <text id="label-anther" class="target-label" x="70" y="-30">Anther</text>
        <line x1="0" y1="0" x2="60" y2="-25" class="hint-line" />
      </g>

      <!-- 6. Filament -->
      <g transform="translate(25, 60)">
        <a xlink:href="#label-filament">
           <circle cx="0" cy="0" r="15" fill="transparent" />
        </a>
        <text id="label-filament" class="target-label" x="60" y="40">Filament</text>
        <line x1="0" y1="0" x2="50" y2="35" class="hint-line" />
      </g>

      <!-- 7. Pistil -->
      <g transform="translate(0, 60)">
        <a xlink:href="#label-pistil">
           <circle cx="0" cy="0" r="20" fill="transparent" />
        </a>
        <text id="label-pistil" class="target-label" x="50" y="-50">Pistil</text>
        <line x1="0" y1="0" x2="40" y2="-40" class="hint-line" />
      </g>

      <!-- 8. Ovary -->
      <g transform="translate(0, 80)">
        <a xlink:href="#label-ovary">
           <circle cx="0" cy="0" r="15" fill="transparent" />
        </a>
        <text id="label-ovary" class="target-label" x="40" y="30">Ovary</text>
        <line x1="0" y1="0" x2="30" y2="25" class="hint-line" />
      </g>

      <!-- 9. Style -->
      <g transform="translate(0, 40)">
        <a xlink:href="#label-style">
           <circle cx="0" cy="0" r="15" fill="transparent" />
        </a>
        <text id="label-style" class="target-label" x="-100" y="0">Style</text>
        <line x1="0" y1="0" x2="-90" y2="0" class="hint-line" />
      </g>

      <!-- 10. Stigma -->
      <g transform="translate(0, 15)">
        <a xlink:href="#label-stigma">
           <circle cx="0" cy="0" r="15" fill="transparent" />
        </a>
        <text id="label-stigma" class="target-label" x="-100" y="-30">Stigma</text>
        <line x1="0" y1="0" x2="-90" y2="-25" class="hint-line" />
      </g>

    </g>
    
    <!-- Educational Inset: Pollination -->
    <g transform="translate(50, 650)">
      <rect width="200" height="200" rx="10" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
      <text x="100" y="25" text-anchor="middle" font-weight="bold" font-size="14" fill="#f57f17">Pollination</text>
      
      <!-- Simple Bee -->
      <g transform="translate(40, 100)">
        <circle r="15" fill="#FFD54F" />
        <path d="M-15,0 L-25,-10 M-15,0 L-25,10" stroke="black" stroke-width="2" />
        <ellipse cx="15" cy="0" rx="10" ry="8" fill="#FFEB3B" />
        <line x1="10" y1="-8" x2="20" y2="-15" stroke="black" />
      </g>
      
      <!-- Simple Flower -->
      <g transform="translate(160, 100)">
        <line x1="0" y1="0" x2="0" y2="50" stroke="green" stroke-width="3"/>
        <circle r="15" fill="pink" />
      </g>
      
      <!-- Pollen path -->
      <path d="M60,100 Q110,80 150,100" stroke="orange" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrowhead)" />
      <text x="90" y="80" font-size="10">Pollen</text>
    </g>
  </g>

  <!-- Right Side: Instructions & Word Bank -->
  <g transform="translate(1100, 150)">
    
    <!-- Instructions Panel -->
    <rect width="650" height="200" rx="10" fill="#E1F5FE" stroke="#81D4FA" stroke-width="2" />
    <text x="20" y="40" font-size="20" font-weight="bold" fill="#0277BD">Instructions</text>
    <text x="20" y="70" font-size="16" fill="#01579B">
      <tspan x="20" dy="0">1. Click a label in the Word Bank below.</tspan>
      <tspan x="20" dy="25">2. Click the corresponding target circle on the flower.</tspan>
      <tspan x="20" dy="25">3. Use 'Check' to verify your answers.</tspan>
      <tspan x="20" dy="25">4. Use 'Reset' to clear the board.</tspan>
    </text>

    <!-- Word Bank Grid -->
    <text x="20" y="240" font-size="20" font-weight="bold" fill="#333">Word Bank</text>
    <g transform="translate(0, 260)" id="word-bank">
       <!-- Row 1 -->
       <a xlink:href="#label-petal"><rect x="0" y="0" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="90" y="32" text-anchor="middle" font-size="18">Petal</text></a>
       <a xlink:href="#label-sepal"><rect x="200" y="0" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="290" y="32" text-anchor="middle" font-size="18">Sepal</text></a>
       <a xlink:href="#label-pistil"><rect x="400" y="0" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="490" y="32" text-anchor="middle" font-size="18">Pistil</text></a>
       
       <!-- Row 2 -->
       <a xlink:href="#label-stamen"><rect x="0" y="60" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="90" y="92" text-anchor="middle" font-size="18">Stamen</text></a>
       <a xlink:href="#label-ovary"><rect x="200" y="60" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="290" y="92" text-anchor="middle" font-size="18">Ovary</text></a>
       <a xlink:href="#label-style"><rect x="400" y="60" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="490" y="92" text-anchor="middle" font-size="18">Style</text></a>

       <!-- Row 3 -->
       <a xlink:href="#label-stigma"><rect x="0" y="120" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="90" y="152" text-anchor="middle" font-size="18">Stigma</text></a>
       <a xlink:href="#label-anther"><rect x="200" y="120" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="290" y="152" text-anchor="middle" font-size="18">Anther</text></a>
       <a xlink:href="#label-filament"><rect x="400" y="120" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="490" y="152" text-anchor="middle" font-size="18">Filament</text></a>
       
       <!-- Row 4 -->
       <a xlink:href="#label-receptacle"><rect x="200" y="180" width="180" height="50" rx="25" fill="white" stroke="#333" filter="url(#dropShadow)" class="tile"/><text x="290" y="212" text-anchor="middle" font-size="18">Receptacle</text></a>
    </g>
  </g>

  <!-- Popups (Hidden by default, shown via :target) -->
  
  <!-- Background Overlay for closing popups -->
  <a xlink:href="#">
    <rect width="100%" height="100%" fill="black" opacity="0" id="bg-overlay" />
  </a>

  <!-- Hint Popup -->
  <g id="hint-popup" class="popup" transform="translate(400, 300)">
    <rect width="1000" height="600" rx="20" fill="white" stroke="#FF9800" stroke-width="5" filter="url(#dropShadow)"/>
    <text x="500" y="80" text-anchor="middle" font-size="36" font-weight="bold" fill="#E65100">Need Help?</text>
    
    <g transform="translate(100, 150)">
        <text x="0" y="0" font-size="20">Look closely at the flower structure:</text>
        <text x="0" y="40" font-size="18" fill="#555">- The colorful leaves are the <tspan font-weight="bold">Petals</tspan>.</text>
        <text x="0" y="70" font-size="18" fill="#555">- The green leaf-like parts at the base are the <tspan font-weight="bold">Sepals</tspan>.</text>
        <text x="0" y="100" font-size="18" fill="#555">- The stick with a yellow top is the <tspan font-weight="bold">Stamen</tspan> (Anther + Filament).</text>
        <text x="0" y="130" font-size="18" fill="#555">- The central bulbous part is the <tspan font-weight="bold">Pistil</tspan> (Stigma, Style, Ovary).</text>
        <text x="0" y="160" font-size="18" fill="#555">- The base holding the flower is the <tspan font-weight="bold">Receptacle</tspan>.</text>
    </g>

    <a xlink:href="#" transform="translate(400, 500)">
      <rect width="200" height="60" rx="10" fill="#FF9800" />
      <text x="100" y="38" text-anchor="middle" fill="white" font-weight="bold" font-size="24">CLOSE</text>
    </a>
  </g>

  <!-- Check Answer Popup -->
  <g id="check-popup" class="popup" transform="translate(400, 300)">
    <rect width="1000" height="600" rx="20" fill="white" stroke="#4CAF50" stroke-width="5" filter="url(#dropShadow)"/>
    <text x="500" y="80" text-anchor="middle" font-size="36" font-weight="bold" fill="#2E7D32">Great Job!</text>
    
    <text x="500" y="150" text-anchor="middle" font-size="24">You have successfully labeled the flower parts!</text>
    
    <!-- Summary Image (simplified) -->
    <g transform="translate(250, 200)">
       <!-- Visual checkmarks could go here -->
       <path d="M100,50 L150,100 L250,0" fill="none" stroke="#4CAF50" stroke-width="10" />
    </g>

    <a xlink:href="#" transform="translate(400, 500)">
      <rect width="200" height="60" rx="10" fill="#4CAF50" />
      <text x="100" y="38" text-anchor="middle" fill="white" font-weight="bold" font-size="24">CLOSE</text>
    </a>
  </g>

</svg>