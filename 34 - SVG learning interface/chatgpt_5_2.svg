<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f7fb"/>
      <stop offset="100%" stop-color="#e4edf7"/>
    </linearGradient>

    <linearGradient id="petalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb3c7"/>
      <stop offset="100%" stop-color="#ff6f91"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#555"/>
    </marker>

    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 64px; font-weight: bold; fill:#2a3b4c;}
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 28px; fill:#3a4a5a;}
      .panelTitle { font-size:36px; font-weight:bold; fill:#2a3b4c;}
      .body { font-size:26px; fill:#334;}
      .labelTile { fill:#ffffff; stroke:#c7d3e0; stroke-width:2; rx:20; ry:20;}
      .button { fill:#4a90e2; rx:18; ry:18;}
      .buttonText { fill:#fff; font-size:26px; font-weight:bold;}
      .slot { fill:none; stroke:#94a3b8; stroke-dasharray:8,6; stroke-width:3; rx:14; ry:14;}
      .popup { fill:#ffffff; stroke:#4a90e2; stroke-width:4; rx:20; ry:20;}
      .closeBtn { fill:#e74c3c; rx:12; ry:12;}
      .small { font-size:22px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1800" height="1200" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="900" y="100" text-anchor="middle" class="title">Flower Anatomy Drag andamp; Drop</text>

  <!-- Instruction Panel -->
  <rect x="1350" y="180" width="380" height="700" fill="url(#panelGrad)" stroke="#c7d3e0" stroke-width="2" rx="20"/>
  <text x="1540" y="230" text-anchor="middle" class="panelTitle">Instructions</text>
  <text x="1380" y="280" class="body">
    <tspan x="1380" dy="0">1. Identify each part of the flower.</tspan>
    <tspan x="1380" dy="36">2. Drag label tiles to matching slots</tspan>
    <tspan x="1380" dy="36">(simulated).</tspan>
    <tspan x="1380" dy="36">3. Use Hint if needed.</tspan>
    <tspan x="1380" dy="36">4. Click Check Answer to review.</tspan>
    <tspan x="1380" dy="36">5. Use Reset to try again.</tspan>
  </text>

  <!-- Flower Diagram Area -->
  <g id="flower" transform="translate(500,250)">
    <!-- Stem -->
    <rect x="380" y="300" width="40" height="400" fill="url(#leafGrad)"/>

    <!-- Leaves -->
    <ellipse cx="330" cy="450" rx="120" ry="60" fill="url(#leafGrad)" transform="rotate(-30 330 450)"/>
    <ellipse cx="470" cy="520" rx="120" ry="60" fill="url(#leafGrad)" transform="rotate(30 470 520)"/>

    <!-- Sepals -->
    <ellipse cx="400" cy="300" rx="160" ry="60" fill="#3fa34d"/>
    <ellipse cx="400" cy="300" rx="60" ry="160" fill="#3fa34d"/>

    <!-- Petals -->
    <ellipse cx="400" cy="200" rx="180" ry="90" fill="url(#petalGrad)"/>
    <ellipse cx="400" cy="200" rx="90" ry="180" fill="url(#petalGrad)"/>
    <ellipse cx="400" cy="200" rx="180" ry="90" fill="url(#petalGrad)" transform="rotate(45 400 200)"/>
    <ellipse cx="400" cy="200" rx="180" ry="90" fill="url(#petalGrad)" transform="rotate(-45 400 200)"/>

    <!-- Pistil -->
    <rect x="390" y="130" width="20" height="170" fill="#9b59b6"/>
    <circle cx="400" cy="120" r="25" fill="#8e44ad"/>
    <ellipse cx="400" cy="310" rx="40" ry="30" fill="#8e44ad"/>

    <!-- Stamens -->
    <g stroke="#f4d03f" stroke-width="6">
      <line x1="350" y1="220" x2="300" y2="140"/>
      <line x1="450" y1="220" x2="500" y2="140"/>
      <line x1="320" y1="250" x2="250" y2="200"/>
      <line x1="480" y1="250" x2="550" y2="200"/>
    </g>
    <circle cx="300" cy="140" r="12" fill="#f39c12"/>
    <circle cx="500" cy="140" r="12" fill="#f39c12"/>
    <circle cx="250" cy="200" r="12" fill="#f39c12"/>
    <circle cx="550" cy="200" r="12" fill="#f39c12"/>
  </g>

  <!-- Label Slots + Arrows -->
  <g stroke="#555" stroke-width="3" marker-end="url(#arrow)">
    <line x1="300" y1="350" x2="500" y2="450"/>
    <line x1="300" y1="250" x2="500" y2="300"/>
    <line x1="300" y1="150" x2="650" y2="370"/>
    <line x1="1000" y1="200" x2="900" y2="330"/>
    <line x1="1000" y1="300" x2="900" y2="380"/>
    <line x1="1000" y1="400" x2="900" y2="430"/>
  </g>

  <rect x="120" y="320" width="180" height="50" class="slot"/>
  <rect x="120" y="220" width="180" height="50" class="slot"/>
  <rect x="120" y="120" width="180" height="50" class="slot"/>
  <rect x="1000" y="170" width="200" height="50" class="slot"/>
  <rect x="1000" y="270" width="200" height="50" class="slot"/>
  <rect x="1000" y="370" width="200" height="50" class="slot"/>

  <!-- Word Bank -->
  <rect x="150" y="900" width="1200" height="220" fill="url(#panelGrad)" stroke="#c7d3e0" stroke-width="2" rx="20"/>
  <text x="200" y="940" class="panelTitle">Word Bank</text>

  <!-- Label Tiles -->
  <g font-size="24" font-family="Arial" fill="#2a3b4c" text-anchor="middle">
    <g transform="translate(250,980)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Petal</text></g>
    <g transform="translate(430,980)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Sepal</text></g>
    <g transform="translate(610,980)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Stamen</text></g>
    <g transform="translate(790,980)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Pistil</text></g>
    <g transform="translate(970,980)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Anther</text></g>
    <g transform="translate(1150,980)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Filament</text></g>

    <g transform="translate(250,1045)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Ovary</text></g>
    <g transform="translate(430,1045)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Style</text></g>
    <g transform="translate(610,1045)"><rect width="160" height="50" class="labelTile"/><text x="80" y="32">Stigma</text></g>
    <g transform="translate(790,1045)"><rect width="200" height="50" class="labelTile"/><text x="100" y="32">Receptacle</text></g>
  </g>

  <!-- Buttons -->
  <a xlink:href="#hintPopup">
    <rect x="1450" y="920" width="250" height="60" class="button"/>
    <text x="1575" y="960" text-anchor="middle" class="buttonText">Hint</text>
  </a>

  <a xlink:href="#checkPopup">
    <rect x="1450" y="990" width="250" height="60" class="button"/>
    <text x="1575" y="1030" text-anchor="middle" class="buttonText">Check Answer</text>
  </a>

  <a xlink:href="#">
    <rect x="1450" y="1060" width="250" height="60" class="button"/>
    <text x="1575" y="1100" text-anchor="middle" class="buttonText">Reset</text>
  </a>

  <!-- Hint Popup -->
  <g id="hintPopup">
    <rect x="400" y="300" width="1000" height="500" class="popup"/>
    <text x="900" y="360" text-anchor="middle" class="panelTitle">Hint</text>
    <text x="500" y="420" class="body">
      <tspan x="500" dy="0">• Petals are colorful and attract pollinators.</tspan>
      <tspan x="500" dy="36">• Sepals protect the bud before blooming.</tspan>
      <tspan x="500" dy="36">• Stamen = anther + filament (male part).</tspan>
      <tspan x="500" dy="36">• Pistil = stigma + style + ovary (female part).</tspan>
      <tspan x="500" dy="36">• Ovary sits at the base of the pistil.</tspan>
    </text>
    <a xlink:href="#">
      <rect x="1300" y="320" width="60" height="40" class="closeBtn"/>
      <text x="1330" y="348" text-anchor="middle" fill="#fff" font-size="24">X</text>
    </a>
  </g>

  <!-- Check Answer Popup -->
  <g id="checkPopup">
    <rect x="350" y="250" width="1100" height="600" class="popup"/>
    <text x="900" y="320" text-anchor="middle" class="panelTitle">Answer Key</text>
    <text x="500" y="380" class="body">
      <tspan x="500" dy="0">Petal – colorful structures</tspan>
      <tspan x="500" dy="36">Sepal – green leaf-like base</tspan>
      <tspan x="500" dy="36">Stamen – male part</tspan>
      <tspan x="500" dy="36">Anther – produces pollen</tspan>
      <tspan x="500" dy="36">Filament – supports anther</tspan>
      <tspan x="500" dy="36">Pistil – female part</tspan>
      <tspan x="500" dy="36">Stigma – sticky pollen receptor</tspan>
      <tspan x="500" dy="36">Style – tube to ovary</tspan>
      <tspan x="500" dy="36">Ovary – contains ovules</tspan>
      <tspan x="500" dy="36">Receptacle – base attachment</tspan>
    </text>
    <a xlink:href="#">
      <rect x="1380" y="270" width="60" height="40" class="closeBtn"/>
      <text x="1410" y="298" text-anchor="middle" fill="#fff" font-size="24">X</text>
    </a>
  </g>

  <!-- Pollination Inset -->
  <g transform="translate(1400,150)">
    <rect width="320" height="200" fill="url(#panelGrad)" stroke="#c7d3e0" stroke-width="2" rx="20"/>
    <text x="160" y="40" text-anchor="middle" class="subtitle">Pollination</text>
    <circle cx="100" cy="120" r="30" fill="#f39c12"/>
    <line x1="130" y1="120" x2="200" y2="120" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="230" cy="120" r="40" fill="url(#petalGrad)"/>
    <text x="160" y="180" text-anchor="middle" class="small">Pollen travels to stigma</text>
  </g>

</svg>
