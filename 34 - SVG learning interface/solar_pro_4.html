<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flower Anatomy Drag & Drop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #121f12;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: auto;
  }
  .svg-wrapper {
    width: min(100vw, 1800px);
    height: min(100vh, 1200px);
    border-radius: 8px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="svg-wrapper">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf4e8"/>
      <stop offset="55%" stop-color="#d4ead4"/>
      <stop offset="100%" stop-color="#bfe0c8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5c2a"/>
      <stop offset="100%" stop-color="#2d7a3a"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2d7a3a"/>
      <stop offset="100%" stop-color="#5a9e4a"/>
    </linearGradient>
    <radialGradient id="receptGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c8824a"/>
      <stop offset="100%" stop-color="#8b5e3c"/>
    </radialGradient>
    <radialGradient id="petalGrad" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#ff6eb4"/>
      <stop offset="60%" stop-color="#e8427a"/>
      <stop offset="100%" stop-color="#b8154a"/>
    </radialGradient>
    <radialGradient id="petalGrad2" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#ff9ac8"/>
      <stop offset="60%" stop-color="#e85a8c"/>
      <stop offset="100%" stop-color="#b8154a"/>
    </radialGradient>
    <linearGradient id="sepalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8c2a"/>
      <stop offset="100%" stop-color="#2a5c14"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ee"/>
    </linearGradient>
    <linearGradient id="wbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4e0"/>
      <stop offset="100%" stop-color="#d0e8c8"/>
    </linearGradient>
    <linearGradient id="insBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d7a3a"/>
      <stop offset="100%" stop-color="#1a5c2a"/>
    </linearGradient>
    <linearGradient id="insBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fdfc"/>
      <stop offset="100%" stop-color="#eef5ea"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="115%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="125%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="3" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="insetShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="popupShadow" x="-8%" y="-8%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3a6a2a"/>
    </marker>
    <marker id="arrowHeadDim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <style>
    .slot-circle { fill: rgba(255,255,255,0.55); stroke: #2d6a2d; stroke-width: 2.5; stroke-dasharray: 7 5; }
    .slot-label { font-family: Georgia, serif; font-size: 13px; fill: #4a4a4a; font-style: italic; }
    .leader-line { stroke: #5a8a4a; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    .leader-dot { fill: #2d6a2d; }

    .word-tile rect { fill: #e8f4e0; stroke: #4a7a3a; stroke-width: 1.5; rx: 12; ry: 12; }
    .word-tile:hover rect { fill: #d0eccc; stroke: #2d5a2d; stroke-width: 2; }
    .word-tile text { font-family: Georgia, serif; font-size: 15px; fill: #1a3a1a; font-weight: bold; text-anchor: middle; dominant-baseline: central; }

    .btn-rect { fill: url(#insBtn); stroke: #0d3a15; stroke-width: 1.5; rx: 8; ry: 8; }
    .btn-rect:hover { fill: #3a9a4a; }
    .btn-text { font-family: Georgia, serif; font-size: 14.5px; fill: #fff; text-anchor: middle; dominant-baseline: central; font-weight: bold; }

    .ins-panel-text { font-family: Georgia, serif; font-size: 15.5px; fill: #1a3a1a; }
    .ins-panel-title { font-family: Georgia, serif; font-size: 18px; fill: #1a5c2a; font-weight: bold; }
    .ins-panel-sub { font-family: Georgia, serif; font-size: 13.5px; fill: #5a5a5a; font-style: italic; }
    .ins-bullet { font-family: Georgia, serif; font-size: 14px; fill: #2a4a2a; }
    .ins-small { font-family: Georgia, serif; font-size: 12.5px; fill: #6a6a6a; }

    /* Popup styling: hidden by default, shown when targeted */
    .popup-bg { fill: rgba(15,30,15,0.55); }
    .popup-panel { fill: #fafdfa; stroke: #2d5a2d; stroke-width: 2; rx: 16; ry: 16; filter: url(#popupShadow); }
    .popup-title { font-family: Georgia, serif; font-size: 20px; fill: #1a4a2a; font-weight: bold; text-anchor: middle; }
    .popup-body { font-family: Georgia, serif; font-size: 14.5px; fill: #2a2a2a; }
    .popup-body-sm { font-family: Georgia, serif; font-size: 13px; fill: #3a3a3a; }
    .popup-close-circle { fill: #ff5a5a; stroke: #c03030; stroke-width: 1.5; }
    .popup-close-text { font-family: Georgia, serif; font-size: 15px; fill: #fff; text-anchor: middle; dominant-baseline: central; font-weight: bold; }

    #hint-popup, #check-popup, #reset-popup {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    /* When a popup is the URL target, show it.
       When the target changes back to #scene (or clears), the default
       opacity:0 rule applies again, hiding the popup. */
    #hint-popup:target, #check-popup:target, #reset-popup:target {
      opacity: 1;
      pointer-events: auto;
    }

    .ins-bee { fill: #f0c040; stroke: #8a6000; stroke-width: 1.2; }
    .ins-wing { fill: rgba(180,200,255,0.55); stroke: #4a7ac0; stroke-width: 0.8; }
    .ins-pollen { fill: #f0a020; }
    .ins-flower2-petal { fill: #9ac0e8; stroke: #3a6a8a; stroke-width: 1; }
    .ins-flower2-center { fill: #e8a030; stroke: #8a5010; stroke-width: 1; }
    .ins-flower1-petal { fill: #e87090; stroke: #8a2040; stroke-width: 1; }
    .ins-flower1-center { fill: #e8a030; stroke: #8a5010; stroke-width: 1; }

    .ans-cell { fill: #e8f4e0; stroke: #4a7a3a; stroke-width: 1.5; rx: 10; ry: 10; }
    .hint-def-bg { fill: #fffbe8; stroke: #c8a840; stroke-width: 1.5; }
    .hint-slot-bg { fill: #f0f7ec; stroke: #a0c8a0; stroke-width: 1; }
  </style>

  <!-- ====== BACKGROUND ====== -->
  <rect width="1800" height="1200" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1800" height="80" fill="#1a4a2a" opacity="0.06"/>
  <rect x="0" y="980" width="1800" height="220" fill="#1a4a2a" opacity="0.05"/>

  <!-- ====== TITLE BAR ====== -->
  <rect x="0" y="0" width="1800" height="90" fill="url(#titleGrad)"/>
  <rect x="0" y="88" width="1800" height="3" fill="#a0d8a0" opacity="0.5"/>
  <text x="60" y="52" font-family="Georgia, serif" font-size="38" fill="#f0f8ee" font-weight="bold" letter-spacing="1.5">Flower Anatomy</text>
  <text x="60" y="76" font-family="Georgia, serif" font-size="19" fill="#c8e8c0" letter-spacing="0.5">Drag &amp; Drop — Identify the Parts of a Flower</text>
  <circle cx="1720" cy="45" r="22" fill="#f0c040" opacity="0.9"/>
  <circle cx="1720" cy="45" r="14" fill="#f8e070"/>
  <text x="1720" y="49" font-family="Georgia, serif" font-size="18" fill="#5a3a00" text-anchor="middle" dominant-baseline="central" font-weight="bold">&#9733;</text>

  <!-- ====== MAIN CONTENT AREA ====== -->
  <!-- Diagram panel -->
  <rect x="30" y="105" width="1220" height="855" rx="16" ry="16" fill="url(#panelBg)" stroke="#8ab88a" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="30" y="105" width="1220" height="32" rx="16" ry="16" fill="#1a4a2a" opacity="0.08"/>
  <rect x="30" y="120" width="1220" height="17" fill="#1a4a2a" opacity="0.08"/>
  <text x="50" y="126" font-family="Georgia, serif" font-size="15.5" fill="#1a5c2a" font-weight="bold" letter-spacing="0.5">&#128737;  Flower Diagram — Match each label to the correct part</text>

  <!-- Instruction panel -->
  <rect x="1280" y="105" width="490" height="645" rx="16" ry="16" fill="url(#insBg)" stroke="#a0c8a0" stroke-width="1.5" filter="url(#shadow1)"/>
  <rect x="1280" y="105" width="490" height="42" rx="16" ry="16" fill="#1a5c2a" opacity="0.1"/>
  <rect x="1280" y="130" width="490" height="17" fill="#1a5c2a" opacity="0.1"/>
  <text x="1300" y="127" font-family="Georgia, serif" font-size="16" fill="#1a5c2a" font-weight="bold">&#128218;  Instructions</text>

  <text x="1305" y="160" class="ins-panel-text">Study the diagram of the flower below.</text>
  <text x="1305" y="180" class="ins-panel-text">Each numbered part has an <tspan fill="#2d6a2d" font-style="italic">empty label slot</tspan>.</text>
  <text x="1305" y="200" class="ins-panel-text">Use the <tspan fill="#2d6a2d" font-weight="bold">Word Bank</tspan> at the bottom to identify</text>
  <text x="1305" y="218" class="ins-panel-text">each part by matching the label to its slot.</text>

  <rect x="1300" y="235" width="460" height="1.5" fill="#8ab88a" opacity="0.5"/>

  <text x="1305" y="260" class="ins-panel-title">&#128161;  How it works:</text>
  <text x="1315" y="285" class="ins-bullet">&#8226;  Hover over a word bank tile to preview it.</text>
  <text x="1315" y="305" class="ins-bullet">&#8226;  Click a <tspan fill="#2d6a2d" font-weight="bold">slot number</tspan> to highlight its word bank tile.</text>
  <text x="1315" y="325" class="ins-bullet">&#8226;  Read the definitions in the <tspan fill="#2d6a2d" font-weight="bold">Hint</tspan> panel.</text>
  <text x="1315" y="345" class="ins-bullet">&#8226;  Press <tspan fill="#2d6a2d" font-weight="bold">Check Answer</tspan> to review your work.</text>
  <text x="1315" y="365" class="ins-bullet">&#8226;  Use <tspan fill="#2d6a2d" font-weight="bold">Reset</tspan> to clear and try again.</text>

  <rect x="1300" y="382" width="460" height="1.5" fill="#8ab88a" opacity="0.5"/>

  <text x="1305" y="407" class="ins-panel-title">&#128214;  Quick Reference:</text>
  <text x="1315" y="432" class="ins-bullet">&#8226;  <tspan font-weight="bold" fill="#2d5a2d">Petal</tspan> — colorful, attracts pollinators</text>
  <text x="1315" y="452" class="ins-bullet">&#8226;  <tspan font-weight="bold" fill="#2d5a2d">Sepal</tspan> — green, protects the bud</text>
  <text x="1315" y="472" class="ins-bullet">&#8226;  <tspan font-weight="bold" fill="#2d5a2d">Stamen</tspan> — male; anther + filament</text>
  <text x="1315" y="492" class="ins-bullet">&#8226;  <tspan font-weight="bold" fill="#2d5a2d">Pistil</tspan> — female; stigma + style + ovary</text>
  <text x="1315" y="512" class="ins-bullet">&#8226;  <tspan font-weight="bold" fill="#2d5a2d">Receptacle</tspan> — base where parts attach</text>

  <rect x="1300" y="530" width="460" height="1.5" fill="#8ab88a" opacity="0.5"/>

  <text x="1305" y="555" class="ins-panel-title">&#127807;  Did You Know?</text>
  <text x="1315" y="580" class="ins-panel-sub">A flower's petals are collectively called</text>
  <text x="1315" y="598" class="ins-panel-sub">the <tspan font-style="italic">corolla</tspan>, and sepals form the</text>
  <text x="1315" y="616" class="ins-panel-sub"><tspan font-style="italic">calyx</tspan>. Together they make the</text>
  <text x="1315" y="634" class="ins-panel-sub"><tspan font-style="italic">perianth</tspan> — the non-reproductive envelope.</text>

  <rect x="1300" y="652" width="460" height="1.5" fill="#8ab88a" opacity="0.5"/>

  <text x="1305" y="677" class="ins-panel-title">&#128202;  Scoring:</text>
  <text x="1315" y="702" class="ins-bullet">&#9711;  Petal          &#9711;  Sepal          &#9711;  Stamen</text>
  <text x="1315" y="722" class="ins-bullet">&#9711;  Pistil         &#9711;  Anther        &#9711;  Filament</text>
  <text x="1315" y="742" class="ins-bullet">&#9711;  Ovary          &#9711;  Style          &#9711;  Stigma</text>
  <text x="1315" y="762" class="ins-bullet">&#9711;  Receptacle</text>
  <text x="1315" y="790" class="ins-bullet" font-style="italic" opacity="0.65">All 10 parts need to be matched correctly.</text>

  <!-- ====== POLLINATION INSET ====== -->
  <g id="pollination-inset">
    <rect x="40" y="400" width="250" height="180" rx="14" ry="14" fill="#fafdfc" stroke="#a0c8a0" stroke-width="1.5" filter="url(#insetShadow)"/>
    <rect x="40" y="400" width="250" height="26" rx="14" ry="14" fill="#1a5c2a" opacity="0.1"/>
    <rect x="40" y="414" width="250" height="12" fill="#1a5c2a" opacity="0.1"/>
    <text x="165" y="417" class="ins-title" font-family="Georgia, serif" font-size="13" fill="#1a5c2a" font-weight="bold" text-anchor="middle">&#128276;  Pollination</text>
    <text x="165" y="572" class="ins-text" font-family="Georgia, serif" font-size="11" fill="#3a5a3a" text-anchor="middle">Pollen moves from anther to stigma</text>

    <!-- Flower 1 (left, with pollen) -->
    <g transform="translate(90,490)">
      <line x1="0" y1="50" x2="0" y2="80" stroke="#5a9e4a" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-35" cy="55" rx="14" ry="8" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1" transform="rotate(-30,-35,55)"/>
      <ellipse cx="35" cy="55" rx="14" ry="8" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1" transform="rotate(30,35,55)"/>
      <circle cx="-30" cy="28" r="10" fill="url(#ins-flower1-petal)"/>
      <circle cx="30" cy="28" r="10" fill="url(#ins-flower1-petal)"/>
      <circle cx="-18" cy="45" r="10" fill="url(#ins-flower1-petal)"/>
      <circle cx="18" cy="45" r="10" fill="url(#ins-flower1-petal)"/>
      <circle cx="0" cy="18" r="10" fill="url(#ins-flower1-petal)"/>
      <circle cx="0" cy="0" r="11" fill="url(#ins-flower1-center)"/>
      <circle cx="-4" cy="-3" r="2" fill="#f0a020"/>
      <circle cx="3" cy="-4" r="2" fill="#f0a020"/>
      <circle cx="0" cy="3" r="2" fill="#f0a020"/>
      <circle cx="-4" cy="4" r="1.5" fill="#f0a020"/>
      <circle cx="5" cy="2" r="1.5" fill="#f0a020"/>
    </g>

    <!-- Flower 2 (right, receiving pollen) -->
    <g transform="translate(270,510)">
      <line x1="0" y1="40" x2="0" y2="75" stroke="#5a9e4a" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-30" cy="43" rx="12" ry="7" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1" transform="rotate(-25,-30,43)"/>
      <ellipse cx="30" cy="43" rx="12" ry="7" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1" transform="rotate(25,30,43)"/>
      <circle cx="-24" cy="25" r="9" fill="url(#ins-flower2-petal)"/>
      <circle cx="24" cy="25" r="9" fill="url(#ins-flower2-petal)"/>
      <circle cx="-14" cy="40" r="9" fill="url(#ins-flower2-petal)"/>
      <circle cx="14" cy="40" r="9" fill="url(#ins-flower2-petal)"/>
      <circle cx="0" cy="15" r="9" fill="url(#ins-flower2-petal)"/>
      <circle cx="0" cy="0" r="10" fill="url(#ins-flower2-center)"/>
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="#ffebcc" stroke="#c89020" stroke-width="0.8"/>
    </g>

    <!-- Bee -->
    <g transform="translate(170,485)">
      <ellipse cx="0" cy="0" rx="14" ry="9" class="ins-bee"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#5a3a00" stroke-width="1.2"/>
      <ellipse cx="-10" cy="-2" rx="6" ry="4" class="ins-wing" transform="rotate(-20,-10,-2)"/>
      <ellipse cx="10" cy="-2" rx="6" ry="4" class="ins-wing" transform="rotate(20,10,-2)"/>
      <circle cx="13" cy="-2" r="2" fill="#1a1a1a"/>
      <path d="M 14,-2 Q 18,-4 19,0 Q 18,2 14,1 Z" fill="#1a1a1a"/>
      <circle cx="-6" cy="2" r="1.8" class="ins-pollen"/>
      <circle cx="-8" cy="-1" r="1.5" class="ins-pollen"/>
      <circle cx="-4" cy="-2" r="1.3" class="ins-pollen"/>
    </g>

    <!-- Pollen trail arrow -->
    <path d="M 120,490 Q 150,475 185,485" stroke="#8a6a2a" stroke-width="1.3" fill="none" stroke-linecap="round" marker-end="url(#arrowHeadDim)"/>
    <text x="148" y="470" font-family="Georgia, serif" font-size="11" fill="#7a5a1a" text-anchor="middle" font-style="italic">pollen</text>

    <!-- Connection dashed line -->
    <path d="M 90,480 Q 180,455 270,505" stroke="#8a6a2a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowHeadDim)" opacity="0.6"/>
  </g>

  <!-- ====== FLOWER DIAGRAM ====== -->
  <g id="flower-diagram">
    <!-- Small leaf on stem -->
    <g transform="translate(645,830) rotate(20)">
      <path d="M 0,0 Q -28,-18 -40,-8 Q -25,5 0,0 Z" fill="#5a9e4a" stroke="#2a5a2a" stroke-width="1.2"/>
      <path d="M 0,0 Q -20,-8 -32,-5" stroke="#2a5a2a" stroke-width="0.8" fill="none" opacity="0.5"/>
    </g>

    <!-- Stem -->
    <path d="M 635 970 Q 640 850 638 730 Q 637 700 635 690" stroke="url(#stemGrad)" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M 635 970 Q 640 850 638 730 Q 637 700 635 690" stroke="#1a4a2a" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.5" stroke-dasharray="3 6"/>

    <!-- Receptacle -->
    <ellipse cx="635" cy="685" rx="88" ry="32" fill="url(#receptGrad)" stroke="#6a3e1a" stroke-width="2" filter="url(#shadow1)"/>
    <ellipse cx="635" cy="680" rx="70" ry="20" fill="none" stroke="#d8a060" stroke-width="1" opacity="0.4"/>
    <path d="M 555,685 Q 635,670 715,685" stroke="#6a3e1a" stroke-width="0.8" fill="none" opacity="0.35" stroke-dasharray="3 4"/>

    <!-- Sepals (behind petals) -->
    <path d="M 590,682 Q 555,650 548,632 Q 565,648 605,678 Z" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1.4"/>
    <path d="M 680,682 Q 715,650 722,632 Q 705,648 675,678 Z" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1.4"/>
    <path d="M 562,692 Q 520,678 502,655 Q 532,670 575,690 Z" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1.4" opacity="0.85"/>
    <path d="M 708,692 Q 750,678 768,655 Q 738,670 705,690 Z" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1.4" opacity="0.85"/>
    <path d="M 635,708 Q 635,675 630,650 Q 640,675 635,708 Z" fill="url(#sepalGrad)" stroke="#1a4a1a" stroke-width="1.4"/>
    <path d="M 600,688 Q 592,675 590,660 Q 602,674 610,687" stroke="#1a4a1a" stroke-width="0.6" fill="none" opacity="0.4"/>
    <path d="M 670,688 Q 678,675 680,660 Q 668,674 660,687" stroke="#1a4a1a" stroke-width="0.6" fill="none" opacity="0.4"/>

      <!-- Def 4 - Pistil -->
      <g id="hint-def-4">
        <rect x="40" y="357" width="760" height="60" class="hint-def-bg" rx="10" ry="10"/>
        <circle cx="56" cy="387" r="6" fill="#f0c040"/>
        <text x="72" y="383" font-family="Georgia, serif" font-size="13" fill="#8a6010" font-weight="bold">4. PISTIL (female part)</text>
        <text x="72" y="401" class="popup-body">The female reproductive part of a flower (also called the <tspan font-style="italic">carpel</tspan>). It consists of three parts: the <tspan font-style="italic">stigma</tspan>, <tspan font-style="italic">style</tspan>, and <tspan font-style="italic">ovary</tspan>. Collectively, all pistils form the <tspan font-style="italic">gynoecium</tspan>.</text>
      </g>

      <!-- Def 5 - Anther -->
      <g id="hint-def-5">
        <rect x="40" y="423" width="760" height="52" class="hint-def-bg" rx="10" ry="10"/>
        <circle cx="56" cy="449" r="6" fill="#f0c040"/>
        <text x="72" y="445" font-family="Georgia, serif" font-size="13" fill="#8a6010" font-weight="bold">5. ANTHER</text>
        <text x="72" y="463" class="popup-body">The sac-like top part of a stamen where <tspan font-style="italic">pollen grains</tspan> are produced and stored. When mature, the anther splits open to release pollen for pollination.</text>
      </g>

      <!-- Def 6 - Filament -->
      <g id="hint-def-6">
        <rect x="40" y="481" width="760" height="52" class="hint-def-bg" rx="10" ry="10"/>
        <circle cx="56" cy="507" r="6" fill="#f0c040"/>
        <text x="72" y="503" font-family="Georgia, serif" font-size="13" fill="#8a6010" font-weight="bold">6. FILAMENT</text>
        <text x="72" y="521" class="popup-body">The slender stalk of a stamen that supports and holds up the anther. It positions the anther so pollen can be easily transferred to pollinators or wind.</text>
      </g>

      <!-- Def 7 - Ovary -->
      <g id="hint-def-7">
        <rect x="40" y="539" width="760" height="52" class="hint-def-bg" rx="10" ry="10"/>
        <circle cx="56" cy="565" r="6" fill="#f0c040"/>
        <text x="72" y="561" font-family="Georgia, serif" font-size="13" fill="#8a6010" font-weight="bold">7. OVARY</text>
        <text x="72" y="579" class="popup-body">The enlarged basal part of the pistil that contains one or more <tspan font-style="italic">ovules</tspan>. After fertilization, the ovary develops into a <tspan font-style="italic">fruit</tspan>, and each ovule becomes a seed.</text>
      </g>

      <!-- Def 8 - Style -->
      <g id="hint-def-8">
        <rect x="40" y="597" width="760" height="52" class="hint-def-bg" rx="10" ry="10"/>
        <circle cx="56" cy="623" r="6" fill="#f0c040"/>
        <text x="72" y="619" font-family="Georgia, serif" font-size="13" fill="#8a6010" font-weight="bold">8. STYLE</text>
        <text x="72" y="637" class="popup-body">The long, slender tube that connects the <tspan font-style="italic">stigma</tspan> (top) to the <tspan font-style="italic">ovary</tspan> (bottom). Pollen tubes grow through the style to reach the ovules for fertilization.</text>
      </g>

      <!-- Def 9 - Stigma -->
      <g id="hint-def-9">
        <rect x="40" y="655" width="760" height="52" class="hint-def-bg" rx="10" ry="10"/>
        <circle cx="56" cy="681" r="6" fill="#f0c040"/>
        <text x="72" y="677" font-family="Georgia, serif" font-size="13" fill="#8a6010" font-weight="bold">9. STIGMA</text>
        <text x="72" y="695" class="popup-body">The sticky, receptive tip of the pistil. It catches and holds pollen grains brought by pollinators or wind. The stigma is the first point of contact in the pollination process.</text>
      </g>

      <!-- Def 10 - Receptacle -->
      <g id="hint-def-10">
        <rect x="40" y="713" width="760" height="52" class="hint-def-bg" rx="10" ry="10"/>
        <circle cx="56" cy="739" r="6" fill="#f0c040"/>
        <text x="72" y="735" font-family="Georgia, serif" font-size="13" fill="#8a6010" font-weight="bold">10. RECEPTACLE</text>
        <text x="72" y="753" class="popup-body">The thickened part of the flower stalk (peduncle) to which all the flower parts — petals, sepals, stamens, and pistil — are attached. It is the base that holds the entire flower together.</text>
      </g>

      <rect x="20" y="772" width="800" height="1.5" fill="#a0d8a0" opacity="0.4"/>

      <!-- Tip and legend -->
      <text x="420" y="798" class="popup-body" text-anchor="middle" opacity="0.65" font-style="italic">Tip: Start with the most distinctive parts — petals and sepals are easy to spot!</text>

      </a>
    </g>
  </g>
