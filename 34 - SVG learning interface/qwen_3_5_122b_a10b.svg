<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 1200" width="1800" height="1200" role="application" aria-label="Flower Anatomy Learning Interface">
  <title>Flower Anatomy Drag & Drop Interface</title>
  <desc>An educational interactive SVG interface for learning flower parts including petals, sepals, and reproductive organs.</desc>

  <defs>
    <!-- Color Palette -->
    <style type="text/css">
      @namespace svg url("http://www.w3.org/2000/svg");
      
      /* Typography */
      .font-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; letter-spacing: 1px; }
      .font-body { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 400; }
      .font-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.7em; }
      
      /* Layout & Visibility Logic (Simulating State with CSS Target) */
      .hidden { display: none; opacity: 0; pointer-events: none; }
      .visible-when-targeted:target { 
        display: block !important; 
        opacity: 1 !important; 
        pointer-events: auto !important; 
      }
      
      /* Buttons */
      .btn-ui { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; cursor: pointer; transition: all 0.3s ease; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1)); }
      .btn-ui:hover { fill: #f8fafc; stroke: #94a3b8; transform: translateY(-2px); }
      .btn-active { fill: #3b82f6; stroke: #2563eb; color: white; }
      
      /* Labels */
      .label-text { fill: #334155; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .zone-circle { fill: none; stroke: #94a3b8; stroke-dasharray: 6 4; stroke-width: 2px; fill-opacity: 0.1; }
      
      /* Arrows */
      .connector-line { stroke: #64748b; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); }
      
      /* Gradients */
      linearGradient[id="bgGrad"] { stop-color@offset-0="#f1f5f9"; stop-color@offset-100="#e2e8f0"; }
      linearGradient[id="petalGrad"] { stop-color@offset-0="#fca5a5"; stop-color@offset-100="#ef4444"; }
      linearGradient[id="leafGrad"] { stop-color@offset-0="#86efac"; stop-color@offset-100="#16a34a"; }
      radialGradient[id="glow"] { stop-color@offset-0="rgba(255,255,255,0.8)"; stop-color@offset-100="rgba(255,255,255,0)"; }
    </style>
    
    <!-- Markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>

    <!-- Filters -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0; stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- HEADER -->
  <g id="header">
    <path d="M0,0 L1800,0 L1800,100 L0,100 Z" fill="#ffffff" filter="url(#shadow)"/>
    <text x="40" y="60" class="font-title" font-size="32" fill="#1e293b">Biology Lab: Flower Anatomy</text>
    <text x="40" y="85" class="font-body" font-size="14" fill="#64748b">Interactive Learning Module • Drag & Drop Interface Simulation</text>
  </g>

  <!-- MAIN CONTENT AREA -->
  <g id="content" transform="translate(0, 110)">
    
    <!-- LEFT PANEL: INSTRUCTIONS -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="300" height="350" rx="15" fill="white" filter="url(#shadow)"/>
      <path d="M15,-15 L15,335" stroke="#eee" stroke-width="2"/>
      <line x1="15" y1="0" x2="15" y2="350" stroke="#eee" stroke-width="2"/>
      <text x="30" y="40" class="font-title" font-size="20" fill="#334155">Instructions</text>
      <foreignObject x="30" y="60" width="250" height="250">
        <div style="font-family:'Segoe UI', sans-serif; color:#475569; font-size:14px; line-height:1.6;">
          <p><strong>Task:</strong> Match the flower parts to their correct locations on the diagram.</p>
          <p><strong>Method:</strong> Click and drag the labels from the Word Bank to the dashed drop zones indicated by arrows.</p>
          <p><strong>Parts:</strong> Identify the male (stamen) and female (pistil) components.</p>
          <hr style="border:0; border-top:1px solid #ddd; margin:10px 0;"/>
          <p style="color:#ef4444;"><em>Note: This is a static visualization simulating an interactive app.</em></p>
        </div>
      </foreignObject>
    </g>

    <!-- CENTER PANEL: FLOWER DIAGRAM -->
    <g transform="translate(350, 20)" id="diagram-area">
      <!-- Card Backdrop -->
      <rect x="0" y="0" width="1000" height="800" rx="15" fill="white" filter="url(#shadow)"/>
      
      <!-- Subtle Background Pattern -->
      <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="2"/>
      </pattern>
      <rect width="1000" height="800" fill="url(#gridPattern)"/>

      <!-- FLOWER ILLUSTRATION -->
      <g transform="translate(500, 500)">
        
        <!-- Stem (Pedicel) -->
        <rect x="-8" y="200" width="16" height="300" fill="#4ade80" stroke="#166534" stroke-width="2"/>
        
        <!-- Leaf (Sepal support) -->
        <path d="M0,250 Q100,200 150,280 T300,300 Q150,350 0,280 Z" fill="#22c55e" stroke="#15803d" stroke-width="1"/>
        <path d="M0,250 Q-100,200 -150,280 T-300,300 Q-150,350 0,280 Z" fill="#22c55e" stroke="#15803d" stroke-width="1"/>

        <!-- Receptacle (Base of flower) -->
        <ellipse cx="0" cy="200" rx="40" ry="20" fill="#fb923c" stroke="#c2410c" stroke-width="1"/>

        <!-- Ovary (Inside Receptacle) -->
        <path d="M-30,200 Q0,240 30,200" fill="none" stroke="#94a3b8" stroke-dasharray="4"/> 
        <circle cx="0" cy="190" r="15" fill="#fb923c" opacity="0.5" />

        <!-- Sepals -->
        <path d="M-40,150 Q-80,100 -50,50 L-30,100 Z" transform="rotate(-45)" fill="#4ade80" stroke="#166534" stroke-width="1"/>
        <path d="M-40,150 Q-80,100 -50,50 L-30,100 Z" transform="rotate(0,0,150)" fill="#4ade80" stroke="#166534" stroke-width="1"/>
        <path d="M-40,150 Q-80,100 -50,50 L-30,100 Z" transform="rotate(45)" fill="#4ade80" stroke="#166534" stroke-width="1"/>
        <path d="M-40,150 Q-80,100 -50,50 L-30,100 Z" transform="rotate(90)" fill="#4ade80" stroke="#166534" stroke-width="1"/>
        <path d="M-40,150 Q-80,100 -50,50 L-30,100 Z" transform="rotate(135)" fill="#4ade80" stroke="#166534" stroke-width="1"/>

        <!-- Petals -->
        <g fill="url(#petalGradient)" stroke="#be123c" stroke-width="1">
           <path d="M0,-180 C-50,-250 -150,-250 -150,-150 C-150,-50 0,0 0,-50" transform="rotate(-30)"/>
           <path d="M0,-180 C-50,-250 -150,-250 -150,-150 C-150,-50 0,0 0,-50" transform="rotate(0)"/>
           <path d="M0,-180 C-50,-250 -150,-250 -150,-150 C-150,-50 0,0 0,-50" transform="rotate(30)"/>
           <path d="M0,-180 C-50,-250 -150,-250 -150,-150 C-150,-50 0,0 0,-50" transform="rotate(90)"/>
           <path d="M0,-180 C-50,-250 -150,-250 -150,-150 C-150,-50 0,0 0,-50" transform="rotate(150)"/>
        </g>

        <!-- Style (Female Tube) -->
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#fb923c" stroke-width="6" stroke-linecap="round"/>

        <!-- Stigma (Top Female) -->
        <ellipse cx="0" cy="-50" rx="12" ry="18" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
        
        <!-- Filaments (Male Stems) -->
        <g stroke="#93c5fd" stroke-width="4">
           <line x1="-80" y1="-50" x2="-80" y2="50"/>
           <line x1="80" y1="-50" x2="80" y2="50"/>
           <line x1="0" y1="-50" x2="0" y2="50" stroke="#fde047" /> <!-- Highlight center -->
        </g>

        <!-- Anthers (Male Tips) -->
        <g fill="#facc15" stroke="#a16207" stroke-width="1">
           <rect x="-86" y="-56" width="12" height="12" rx="3"/>
           <rect x="74" y="-56" width="12" height="12" rx="3"/>
           <rect x="-6" y="-56" width="12" height="12" rx="3"/>
        </g>

        <!-- DROP ZONES & ARROWS -->
        <g class="drop-zones">
          <!-- Zone 1: Petal -->
          <g transform="translate(-400, -50)">
             <circle cx="0" cy="0" r="25" class="zone-circle"/>
             <line x1="25" y1="0" x2="80" y2="0" class="connector-line"/>
             <circle cx="85" cy="0" r="3" fill="#ef4444"/>
          </g>
          <!-- Zone 2: Stigma -->
          <g transform="translate(0, -120)">
             <circle cx="0" cy="0" r="25" class="zone-circle"/>
             <line x1="0" y1="25" x2="0" y2="60" class="connector-line"/>
             <circle cx="0" cy="65" r="3" fill="#ef4444"/>
          </g>
          <!-- Zone 3: Anther -->
          <g transform="translate(150, 0)">
             <circle cx="0" cy="0" r="25" class="zone-circle"/>
             <line x1="-25" y1="0" x2="-60" y2="0" class="connector-line"/>
             <circle cx="-65" cy="0" r="3" fill="#ef4444"/>
          </g>
           <!-- Zone 4: Filament -->
           <g transform="translate(150, 100)">
            <circle cx="0" cy="0" r="25" class="zone-circle"/>
            <line x1="-25" y1="0" x2="-80" y2="0" class="connector-line"/>
            <circle cx="-85" cy="0" r="3" fill="#ef4444"/>
         </g>
          <!-- Zone 5: Sepal -->
          <g transform="translate(-200, 200)">
             <circle cx="0" cy="0" r="25" class="zone-circle"/>
             <line x1="25" y1="0" x2="50" y2="-50" class="connector-line"/>
             <circle cx="55" cy="-55" r="3" fill="#ef4444"/>
          </g>
           <!-- Zone 6: Receptacle/Ovary Area -->
           <g transform="translate(0, 250)">
            <circle cx="0" cy="0" r="25" class="zone-circle"/>
            <line x1="0" y1="-25" x2="0" y2="-60" class="connector-line"/>
            <circle cx="0" cy="-65" r="3" fill="#ef4444"/>
         </g>
        </g>

      </g>
      
      <!-- Title Over Diagram -->
      <text x="500" y="40" class="font-title" font-size="24" fill="#1e293b" text-anchor="middle">Floral Cross-Section</text>

      <!-- WORD BANK (Bottom of Diagram Card) -->
      <g transform="translate(0, 680)">
         <rect width="1000" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
         <text x="30" y="55" class="font-body" font-size="14" fill="#94a3b8">WORD BANK (Select to Drag)</text>
         
         <!-- Tokens -->
         <g transform="translate(100, 50)" class="word-token">
            <rect x="0" y="-15" width="100" height="30" rx="15" fill="white" stroke="#cbd5e1" class="btn-ui"/>
            <text x="50" y="0" class="label-text">Petal</text>
         </g>
         <g transform="translate(220, 50)" class="word-token">
            <rect x="0" y="-15" width="100" height="30" rx="15" fill="white" stroke="#cbd5e1" class="btn-ui"/>
            <text x="50" y="0" class="label-text">Sepal</text>
         </g>
         <g transform="translate(340, 50)" class="word-token">
            <rect x="0" y="-15" width="100" height="30" rx="15" fill="white" stroke="#cbd5e1" class="btn-ui"/>
            <text x="50" y="0" class="label-text">Stamen</text>
         </g>
         <g transform="translate(460, 50)" class="word-token">
            <rect x="0" y="-15" width="100" height="30" rx="15" fill="white" stroke="#cbd5e1" class="btn-ui"/>
            <text x="50" y="0" class="label-text">Pistil</text>
         </g>
         <g transform="translate(580, 50)" class="word-token">
            <rect x="0" y="-15" width="100" height="30" rx="15" fill="white" stroke="#cbd5e1" class="btn-ui"/>
            <text x="50" y="0" class="label-text">Anther</text>
         </g>
         <g transform="translate(700, 50)" class="word-token">
            <rect x="0" y="-15" width="100" height="30" rx="15" fill="white" stroke="#cbd5e1" class="btn-ui"/>
            <text x="50" y="0" class="label-text">Filament</text>
         </g>
         <g transform="translate(820, 50)" class="word-token">
            <rect x="0" y="-15" width="100" height="30" rx="15" fill="white" stroke="#cbd5e1" class="btn-ui"/>
            <text x="50" y="0" class="label-text">Ovary</text>
         </g>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: CONTROLS & EXTRAS -->
  <g transform="translate(1350, 20)">
     <rect x="0" y="0" width="430" height="350" rx="15" fill="white" filter="url(#shadow)"/>
     
     <!-- Control Buttons -->
     <g transform="translate(40, 40)">
        <text x="0" y="0" class="font-title" font-size="18" fill="#334155">Controls</text>
        
        <g transform="translate(0, 30)">
           <!-- Hint Button -->
           <a xlink:href="#hint-panel">
             <rect x="0" y="-15" width="140" height="40" rx="20" fill="#3b82f6" filter="url(#shadow)">
               <animate attributeName="fill" values="#3b82f6;#60a5fa;#3b82f6" dur="2s" repeatCount="indefinite" />
             </rect>
             <text x="70" y="0" class="font-body" fill="white" font-size="14">Get Hint</text>
           </a>
        </g>

        <g transform="translate(0, 90)">
           <!-- Check Answer -->
           <a xlink:href="#result-panel">
             <rect x="0" y="-15" width="140" height="40" rx="20" fill="#22c55e" filter="url(#shadow)">
                <animate attributeName="opacity" values="1;0.8;1" dur="1.5s" repeatCount="indefinite" />
             </rect>
             <text x="70" y="0" class="font-body" fill="white" font-size="14">Check Answer</text>
           </a>
        </g>

        <g transform="translate(0, 150)">
           <!-- Reset -->
           <a xlink:href="">
             <rect x="0" y="-15" width="140" height="40" rx="20" fill="#ef4444" filter="url(#shadow)">
             </rect>
             <text x="70" y="0" class="font-body" fill="white" font-size="14">Reset Quiz</text>
           </a>
        </g>
     </g>

     <!-- Extra Inset: Pollination -->
     <g transform="translate(40, 230)">
        <rect width="350" height="100" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
        <text x="175" y="25" class="font-body" font-size="14" fill="#92400e" text-anchor="middle">Did you know?</text>
        <foreignObject x="20" y="40" width="310" height="50">
          <div style="font-family:'Segoe UI'; font-size:12px; color:#78350f; line-height:1.4;">
            Pollen from the <strong>Anther</strong> transfers to the <strong>Stigma</strong>, fertilizing the <strong>Ovary</strong> to create seeds.
          </div>
        </foreignObject>
     </g>
  </g>

  <!-- OVERLAY POPUPS (Hidden until Targeted) -->
  
  <!-- HINT POPUP -->
  <g id="hint-panel" class="hidden visible-when-targeted" transform="translate(0,0)">
    <!-- Dimmer -->
    <rect width="100%" height="100%" fill="rgba(15,23,42,0.6)"/>
    <!-- Box -->
    <g transform="translate(650, 400)" filter="url(#shadow)">
       <rect width="500" height="300" rx="20" fill="white"/>
       <text x="250" y="40" class="font-title" font-size="20" text-anchor="middle" fill="#1e293b">Tip Section</text>
       
       <!-- Hint Lines Matching -->
       <g transform="translate(100, 80)">
         <text x="0" y="0" class="font-body" fill="#475569">Look closely at the diagram arrows:</text>
         <text x="0" y="30" class="font-body" fill="#475569">- The large outer colored parts are <span style="font-weight:bold; fill:#ef4444;">Petals</span>.</text>
         <text x="0" y="60" class="font-body" fill="#475569">- The green leaves underneath are <span style="font-weight:bold; fill:#16a34a;">Sepals</span>.</text>
         <text x="0" y="90" class="font-body" fill="#475569">- The central stalk is the <span style="font-weight:bold; fill:#fb923c;">Pistil</span>.</text>
         <text x="0" y="120" class="font-body" fill="#475569">- The surrounding stems with yellow tips are <span style="font-weight:bold; fill:#eab308;">Stamens</span>.</text>
       </g>

       <g transform="translate(100, 220)">
         <a xlink:href="">
            <rect x="150" y="-15" width="100" height="40" rx="20" fill="#1e293b">
              <animate attributeName="fill" values="#1e293b;#334155;#1e293b" dur="3s" repeatCount="indefinite" />
            </rect>
            <text x="200" y="0" class="font-body" fill="white" text-anchor="middle">Close Tip</text>
         </a>
       </g>
    </g>
  </g>

  <!-- RESULT CHECK POPUP -->
  <g id="result-panel" class="hidden visible-when-targeted" transform="translate(0,0)">
    <!-- Dimmer -->
    <rect width="100%" height="100%" fill="rgba(15,23,42,0.7)"/>
    <!-- Box -->
    <g transform="translate(650, 400)" filter="url(#shadow)">
       <rect width="500" height="400" rx="20" fill="white"/>
       <text x="250" y="50" class="font-title" font-size="24" text-anchor="middle" fill="#059669">Answer Key</text>
       
       <line x1="100" y1="80" x2="400" y2="80" stroke="#e2e8f0" stroke-width="2"/>

       <!-- Correct Matches -->
       <g transform="translate(100, 110)" class="font-body">
          <text x="0" y="0" fill="#334155">Zone 1 (Large Side):</text> <text x="150" y="0" fill="#059669" font-weight="bold">Petal</text>
          <text x="0" y="30" fill="#334155">Zone 2 (Top Middle):</text> <text x="150" y="30" fill="#059669" font-weight="bold">Stigma</text>
          <text x="0" y="60" fill="#334155">Zone 3 (Yellow Tip):</text> <text x="150" y="60" fill="#059669" font-weight="bold">Anther</text>
          <text x="0" y="90" fill="#334155">Zone 4 (Stem below tip):</text> <text x="150" y="90" fill="#059669" font-weight="bold">Filament</text>
          <text x="0" y="120" fill="#334155">Zone 5 (Green Bottom):</text> <text x="150" y="120" fill="#059669" font-weight="bold">Sepal</text>
          <text x="0" y="150" fill="#334155">Zone 6 (Base Center):</text> <text x="150" y="150" fill="#059669" font-weight="bold">Ovary</text>
       </g>

       <g transform="translate(100, 310)">
         <a xlink:href="">
            <rect x="150" y="-15" width="200" height="40" rx="20" fill="#ef4444">
            </rect>
            <text x="250" y="0" class="font-body" fill="white" text-anchor="middle">Close & Continue Studying</text>
         </a>
       </g>
    </g>
  </g>

</svg>