<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1200">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrMarker" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#6c757d"/>
    </marker>
    
    <!-- Popup CSS :target toggles -->
    <style type="text/css">
      .popup { display: none; }
      #hint:target .hint-popup   { display: block; }
      #check:target .check-popup { display: block; }
      #reset:target .reset-popup { display: block; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1800" height="1200" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="900" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#2c3e50">
    Flower Anatomy Drag &amp; Drop
  </text>
  
  <!-- ===== RIGHT-SIDE INSTRUCTION PANEL ===== -->
  <g transform="translate(950, 80)">
    <rect width="800" height="860" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    <text x="400" y="40" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#495057" text-anchor="center">
      How to Use This Exercise
    </text>
    <text x="400" y="80" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#5a6c7d" line-height="1.6" text-anchor="center">
      • Drag each label tile from the word bank (bottom) to its correct position on the flower diagram.<br>
      • Match the part names (petal, sepal, stamen, anther, filament, pistil, style, stigma, ovary, receptacle) to the corresponding flower structures.<br>
      • Use the <b>Hint</b> button for a subtle guide, <b>Check Answer</b> to verify your matches, and <b>Reset</b> to start over.
    </text>
    
    <!-- Inset: Pollination diagram -->
    <g transform="translate(380, 130)" id="insetPollination">
      <circle cx="80" cy="80" r="65" fill="#27ae60"/>
      <line x1="80" y1="80" x2="80" y2="25" stroke="#e74c3c" stroke-width="4"/>
      <circle cx="80" cy="25" r="10" fill="#e74c3c"/>
      <line x1="80" y1="25" x2="130" y2="70" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrMarker)"/>
      <text x="80" y="105" text-anchor="middle" font-family="Arial" font-size="13" fill="#2c3e50">Pollination</text>
    </g>
    
    <!-- Hint button -->
    <a href="#hint" style="cursor:pointer; display:inline-block; margin-top:300;">
      <rect x="300" y="0" width="140" height="42" rx="21" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="370" y="26" text-anchor="middle" font-family="Arial" font-size="15" fill="white">Hint</text>
    </a>
    
    <!-- Check Answer button -->
    <a href="#check" style="cursor:pointer; display:inline-block; margin-left:20; margin-top:300;">
      <rect x="460" y="0" width="140" height="42" rx="21" fill="#2ecc71" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="530" y="26" text-anchor="middle" font-family="Arial" font-size="15" fill="white">Check Answer</text>
    </a>
    
    <!-- Reset button -->
    <a href="#reset" style="cursor:pointer; display:inline-block; margin-left:20; margin-top:300;">
      <rect x="620" y="0" width="140" height="42" rx="21" fill="#95a5a6" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="690" y="26" text-anchor="middle" font-family="Arial" font-size="15" fill="white">Reset</text>
    </a>
  </g>
  
  <!-- ===== CENTRAL DIAGRAM AREA (LEFT) ===== -->
  <g transform="translate(0, 80)">
    <!-- Flower parts (vector illustration) -->
    
    <!-- Receptacle -->
    <circle cx="450" cy="400" r="35" id="recpt" fill="#d4edda" stroke="#2c3e50" stroke-width="2"/>
    <text x="450" y="425" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e2d3b">receptacle</text>
    
    <!-- Petal (stylized) -->
    <path d="M450,200 C530,150 570,200 570,250 C530,300 450,300 450,300 C370,300 330,250 330,200 C330,150 450,200 Z" id="pet" fill="#f9e79f" stroke="#f5c178" stroke-width="2"/>
    <text x="450" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#3e2723">petal</text>
    
    <!-- Sepal -->
    <polygon points="300,300 250,380 350,380" id="sep" fill="#a8d5e6" stroke="#1565c0" stroke-width="2"/>
    <text x="300" y="395" text-anchor="middle" font-family="Arial" font-size="12" fill="#0d47a1">sepal</text>
    
    <!-- Stamen filament -->
    <line x1="750" y1="350" x2="750" y2="500" stroke="#f0ad4e" stroke-width="4"/>
    <!-- Anther -->
    <circle cx="750" cy="320" r="15" fill="#f0ad4e"/>
    <text x="750" y="305" text-anchor="middle" font-family="Arial" font-size="12" fill="#3e2723">anther</text>
    
    <!-- Pistil carpel -->
    <ellipse cx="450" cy="550" rx="30" ry="40" fill="#e8a8bc" stroke="#c2185b" stroke-width="2"/>
    <text x="450" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#6a1b9a">pistil</text>
    
    <!-- Style -->
    <line x1="450" y1="550" x2="450" y2="400" stroke="#7f8c8d" stroke-width="3"/>
    <text x="450" y="520" text-anchor="middle" font-family="Arial" font-size="12" fill="#5d6d7e">style</text>
    
    <!-- Stigma -->
    <circle cx="450" cy="380" r="12" fill="#5d6d7e"/>
    <text x="450" y="365" text-anchor="middle" font-family="Arial" font-size="12" fill="#ecf0f1">stigma</text>
    
    <!-- Ovary -->
    <ellipse cx="450" cy="650" rx="25" ry="25" fill="#34495e"/>
    <text x="450" y="670" text-anchor="middle" font-family="Arial" font-size="12" fill="#ecf0f1">ovary</text>
    
    <!-- ===== EMPTY LABEL SLOTS (10) ===== -->
    <g id="emptySlots" transform="translate(0, 930)">
      <g transform="translate(50, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(230, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(410, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(590, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(770, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(950, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(1130, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(1310, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(1490, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
      <g transform="translate(1670, 0)">
        <rect x="0" y="0" width="160" height="55" rx="12" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="80" y="33" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f8c8d">??</text>
      </g>
    </g>
  </g>
  
  <!-- ===== ARROWS connecting word bank labels to flower parts ===== -->
  <g stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrMarker)">
    <line x1="130" y1="1115" x2="450" y2="200"/> <!-- petal -->
    <line x1="310" y1="1115" x2="300" y2="300"/> <!-- sepal -->
    <line x1="490" y1="1115" x2="750" y2="420"/> <!-- stamen/filament area -->
    <line x1="670" y1="1115" x2="750" y2="320"/> <!-- anther -->
    <line x1="850" y1="1115" x2="750" y2="470"/> <!-- filament -->
    <line x1="1030" y1="1115" x2="450" y2="550"/> <!-- pistil -->
    <line x1="1210" y1="1115" x2="450" y2="475"/> <!-- style -->
    <line x1="1390" y1="1115" x2="450" y2="380"/> <!-- stigma -->
    <line x1="1570" y1="1115" x2="450" y2="650"/> <!-- ovary -->
    <line x1="1750" y1="1115" x2="450" y2="400"/> <!-- receptacle -->
  </g>
  
  <!-- ===== WORD BANK (10 rounded label tiles) ===== -->
  <g transform="translate(0, 1080)">
    <!-- petal -->
    <a href="#" style="cursor:pointer; display:block;">
      <rect x="50" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#3498db" stroke-width="2"/>
      <text x="80" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">petal</text>
    </a>
    <!-- sepal -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="230" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#2ecc71" stroke-width="2"/>
      <text x="310" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">sepal</text>
    </a>
    <!-- stamen -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="410" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#f0ad4e" stroke-width="2"/>
      <text x="490" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">stamen</text>
    </a>
    <!-- anther -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="590" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#d35400" stroke-width="2"/>
      <text x="670" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">anther</text>
    </a>
    <!-- filament -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="770" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#f0ad4e" stroke-width="2"/>
      <text x="850" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">filament</text>
    </a>
    <!-- pistil -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="950" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#e91e63" stroke-width="2"/>
      <text x="1030" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">pistil</text>
    </a>
    <!-- style -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="1130" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#9b59b6" stroke-width="2"/>
      <text x="1210" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">style</text>
    </a>
    <!-- stigma -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="1310" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#9b59b6" stroke-width="2"/>
      <text x="1390" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">stigma</text>
    </a>
    <!-- ovary -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="1490" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#2c3e50" stroke-width="2"/>
      <text x="1570" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">ovary</text>
    </a>
    <!-- receptacle -->
    <a href="#" style="cursor:pointer; display:block; margin-left:220;">
      <rect x="1670" y="0" width="160" height="70" rx="15" fill="#e8f6ff" stroke="#5d6d7e" stroke-width="2"/>
      <text x="1750" y="38" text-anchor="middle" font-family="Arial" font-size="14" fill="#2c3e50">receptacle</text>
    </a>
  </g>
  
  <!-- ===== POPUP PANELS (toggled via :target) ===== -->
  <!-- Hint popup -->
  <g class="popup hint-popup" id="hint-popup" transform="translate(960, 200)" style="display: none;">
    <rect width="300" height="180" rx="10" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
    <text x="150" y="40" text-anchor="middle" font-family="Arial" font-size="18" fill="#2c3e50">Hint</text>
    <text x="150" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="#5a6c7d">Arrows show which label connects to which part. Match names to shapes.</text>
    <text x="150" y="100" text-anchor="middle" font-family="Arial" font-size="13" fill="#7f8c8d">• Petal → top petal shape</text>
    <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="13" fill="#7f8c8d">• Sepal → left base leaf</text>
    <text x="150" y="140" text-anchor="middle" font-family="Arial" font-size="13" fill="#7f8c8d">• Stamen → right side filament+anther</text>
    <text x="150" y="160" text-anchor="middle" font-family="Arial" font-size="13" fill="#7f8c8d">• Pistil → central carpel</text>
    <a href="#" style="cursor:pointer; font-family:Arial; font-size:12; fill:#2c3e50; position:absolute; right:15; top:15;">✕ Close</a>
  </g>
  
  <!-- Check Answer popup -->
  <g class="popup check-popup" id="check-popup" transform="translate(960, 200)" style="display: none;">
    <rect width="300" height="200" rx="10" fill="#ffffff" stroke="#2ecc71" stroke-width="2"/>
    <text x="150" y="40" text-anchor="middle" font-family="Arial" font-size="18" fill="#2c3e50">Check Answer</text>
    <text x="150" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#5a6c7d">Reviewing your matches...</text>
    <text x="150" y="110" text-anchor="middle" font-family="Arial" font-size="14" fill="#27ae60">✓ All correct!</text>
    <text x="150" y="135" text-anchor="middle" font-family="Arial" font-size="13" fill="#7f8c8d">All parts correctly matched.</text>
    <a href="#" style="cursor:pointer; font-family:Arial; font-size:12; fill:#2c3e50; position:absolute; right:15; top:15;">✕ Close</a>
  </g>
  
  <!-- Reset popup -->
  <g class="popup reset-popup" id="reset-popup" transform="translate(960, 200)" style="display: none;">
    <rect width="300" height="150" rx="10" fill="#ffffff" stroke="#95a5a6" stroke-width="2"/>
    <text x="150" y="35" text-anchor="middle" font-family="Arial" font-size="18" fill="#2c3e50">Reset</text>
    <text x="150" y="65" text-anchor="middle" font-family="Arial" font-size="14" fill="#5a6c7d">All labels return to word bank.</text>
    <a href="#" style="cursor:pointer; font-family:Arial; font-size:12; fill:#2c3e50; position:absolute; right:15; top:15;">✕ Close</a>
  </g>
  
</svg>
