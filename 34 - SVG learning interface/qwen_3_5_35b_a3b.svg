<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="100%" stop-color="#dbeaff"/>
    </linearGradient>
    
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6e9f0"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow">
        <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- Fonts -->
    <style>
      .title-main { font-size: 48px; fill: #2c3e50; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-size: 22px; fill: #34495e; font-weight: 600; }
      .instruction { font-size: 18px; line-height: 1.5; fill: #5d6d7e; }
      
      /* Interactivity Simulation */
      /* Base state for word bank items */
      .draggable-tile { transition: transform 0.2s ease, filter 0.2s ease; cursor: grab; }
      .draggable-tile:hover { 
        transform: translateY(-5px); 
        filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.1)); 
        stroke: #ff758c;
      }
      
      /* Popup Mechanism using Radio Inputs (CSS-only Logic) */
      input[type=radio] { display: none; }
      
      /* Default Hide Popup */
      .hidden-popup { pointer-events: none; opacity: 0; transform: scale(0.9); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      
      /* Show Popup when corresponding radio is checked */
      #hid-hint:checked ~ svg .hint-overlay { opacity: 1; transform: scale(1); pointer-events: auto; }
      #hid-check:checked ~ svg .check-overlay { opacity: 1; transform: scale(1); pointer-events: auto; }
      #hid-reset:checked ~ svg .reset-overlay { opacity: 1; transform: scale(1); pointer-events: auto; }
      
      /* Arrow Hints Animation */
      .path-dash { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 3s linear forwards; }
      
      @keyframes dash {
          to { stroke-dashoffset: 0; }
      }
    </style>

    <!-- Hidden Radio Buttons for Logic -->
    <input type="radio" id="hid-hint" name="panel-toggle">
    <input type="radio" id="hid-check" name="panel-toggle">
    <input type="radio" id="hid-reset" name="panel-toggle">
  </defs>

  <!-- Global Background -->
  <rect width="1800" height="1200" fill="url(#skyGrad)" rx="0"/>

  <!-- ========================================= -->
  <!-- TOP HEADER BAR -->
  <!-- ========================================= -->
  <rect x="0" y="0" width="1800" height="100" fill="#fff" stroke="#e1e1e1" stroke-width="2"/>
  <text x="100" y="65" class="title-main">Flower Anatomy Drag &amp; Drop</text>
  <text x="1500" y="65" text-anchor="end" font-size="16" fill="#7f8c8d">ID: FLR-ANAT-204</text>
  
  <line x1="0" y1="100" x2="1800" y2="100" stroke="#ecf0f1" stroke-width="1"/>

  <!-- ========================================= -->
  <!-- CENTER: FLOWER DIAGRAM -->
  <!-- ========================================= -->
  <g transform="translate(900, 600)">
    <!-- Receptacle (Base) -->
    <path d="M0,250 Q-30,250 -30,200 L30,200 Q60,250 0,250 Z" fill="#27ae60" stroke="#1e8449"/>
    <circle cx="0" cy="230" r="15" fill="#2ecc71"/>
    
    <!-- Pedicel/Stem -->
    <path d="M0,250 L0,1200" stroke="url(#stemGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Leaves -->
    <ellipse cx="-60" cy="900" rx="80" ry="30" transform="rotate(-20,-60,900)" fill="#2ecc71"/>
    <ellipse cx="80" cy="900" rx="80" ry="30" transform="rotate(20,80,900)" fill="#2ecc71"/>
    
    <!-- Sepals (Below Petals) -->
    <g id="sepals">
      <path d="M-40,120 L-20,150 L-50,140 Z" fill="#27ae60"/>
      <path d="M40,120 L20,150 L50,140 Z" fill="#27ae60"/>
      <path d="M-40,120 L-10,160 L-60,150 Z" fill="#27ae60"/>
      <path d="M40,120 L10,160 L60,150 Z" fill="#27ae60"/>
      <path d="M0,120 L0,170 L-30,155 Z" fill="#27ae60"/>
    </g>
    
    <!-- Petals -->
    <g id="petals">
      <ellipse cx="0" cy="80" rx="40" ry="110" fill="url(#petalGrad)" transform="rotate(0)"/>
      <ellipse cx="0" cy="80" rx="40" ry="110" fill="url(#petalGrad)" transform="rotate(72)"/>
      <ellipse cx="0" cy="80" rx="40" ry="110" fill="url(#petalGrad)" transform="rotate(144)"/>
      <ellipse cx="0" cy="80" rx="40" ry="110" fill="url(#petalGrad)" transform="rotate(216)"/>
      <ellipse cx="0" cy="80" rx="40" ry="110" fill="url(#petalGrad)" transform="rotate(288)"/>
    </g>

    <!-- Pistil (Center) -->
    <g id="pistil-group">
        <!-- Style -->
        <line x1="0" y1="80" x2="0" y2="-40" stroke="#e74c3c" stroke-width="4" />
        <!-- Ovary (Swollen Base) -->
        <ellipse cx="0" cy="90" rx="12" ry="20" fill="#e74c3c" fill-opacity="0.5"/>
        <!-- Stigma (Tip) -->
        <circle cx="0" cy="-40" r="15" fill="#c0392b"/>
    </g>

    <!-- Stamens (Male Parts) -->
    <g id="stamens">
        <g id="anthers-filaments" opacity="0.9">
             <!-- Filament 1 -->
             <line x1="-30" y1="120" x2="-25" y2="60" stroke="#f1c40f" stroke-width="4"/>
             <circle cx="-25" cy="60" r="8" fill="#d35400"/>
             
             <!-- Filament 2 -->
             <line x1="30" y1="120" x2="25" y2="60" stroke="#f1c40f" stroke-width="4"/>
             <circle cx="25" cy="60" r="8" fill="#d35400"/>
             
             <!-- Filament 3 -->
             <line x1="-5" y1="110" x2="-5" y2="50" stroke="#f1c40f" stroke-width="4"/>
             <circle cx="-5" cy="50" r="8" fill="#d35400"/>

             <!-- Filament 4 -->
             <line x1="10" y1="110" x2="10" y2="50" stroke="#f1c40f" stroke-width="4"/>
             <circle cx="10" cy="50" r="8" fill="#d35400"/>
             
             <!-- Filament 5 -->
             <line x1="20" y1="110" x2="20" y2="60" stroke="#f1c40f" stroke-width="4"/>
             <circle cx="20" cy="60" r="8" fill="#d35400"/>
        </g>
    </g>

    <!-- Invisible Interaction Areas / Labels Slots -->
    <circle cx="200" cy="300" r="20" fill="transparent" id="slot-petal"/>
    <circle cx="250" cy="500" r="20" fill="transparent" id="slot-sepal"/>
    <circle cx="-250" cy="300" r="20" fill="transparent" id="slot-stamen"/>
    <circle cx="0" cy="-150" r="20" fill="transparent" id="slot-pistil"/>
    
    <!-- Dashed Guide Lines for Dragging (Visual cues only) -->
    <path d="M0,-60 L0,-150" stroke="#aaa" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    
    <!-- Tiny Arrow Markers for inset diagrams -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </g>

  <!-- ========================================= -->
  <!-- RIGHT PANEL: INSTRUCTIONS & CONTROLS -->
  <!-- ========================================= -->
  <g transform="translate(1100, 100)">
    <!-- Instruction Card -->
    <rect x="0" y="0" width="650" height="200" rx="12" fill="#fff" stroke="#dce2ec" stroke-width="1" filter="url(#dropShadow)"/>
    
    <text x="20" y="35" class="subtitle">Learning Objective</text>
    <text x="20" y="60" class="instruction">
      Match the flower parts listed in the word bank below to their correct positions on the diagram. Click the Hint button for clues.
    </text>
    
    <text x="20" y="100" class="subtitle" style="font-size:18px;">Controls</text>
    
    <!-- Simulated Buttons -->
    <!-- Use Label hack to trigger Radio Input -->
    <g transform="translate(20, 130)">
       <label for="hid-hint" class="draggable-tile" style="background:#fef9e7; border:1px solid #f1c40f; padding:10px 20px; border-radius:30px; display:inline-flex; align-items:center; gap:10px; font-weight:bold; color:#d35400; cursor:pointer;">
           <circle cx="10" cy="10" r="8" fill="none" stroke="#f1c40f" stroke-width="2"/>
           <text fill="#d35400">Hint</text>
       </label>
       
       <label for="hid-check" class="draggable-tile" style="background:#e8f6fd; border:1px solid #3498db; padding:10px 20px; border-radius:30px; display:inline-flex; align-items:center; gap:10px; font-weight:bold; color:#2980b9; margin-left:20px; cursor:pointer;">
           <path d="M0,12 L5,17 L15,7" fill="none" stroke="#3498db" stroke-width="2"/>
           <text fill="#2980b9">Check Answer</text>
       </label>

       <label for="hid-reset" class="draggable-tile" style="background:#fdf2f2; border:1px solid #e74c3c; padding:10px 20px; border-radius:30px; display:inline-flex; align-items:center; gap:10px; font-weight:bold; color:#c0392b; margin-left:20px; cursor:pointer;">
           <circle cx="10" cy="10" r="8" fill="none" stroke="#e74c3c" stroke-width="2"/>
           <text fill="#c0392b">Reset</text>
       </label>
    </g>

    <!-- POPUP OVERLAYS (Hidden by default) -->
    
    <!-- Hint Popup -->
    <g class="hint-overlay hidden-popup" transform="translate(0, 300)">
      <rect x="0" y="-200" width="650" height="500" rx="12" fill="rgba(255, 255, 255, 0.95)" stroke="#f1c40f" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="30" y="-150" class="subtitle" style="color:#d35400">💡 Hint Box</text>
      <text x="30" y="-120" class="instruction" style="font-size:16px;">
        • <b>Pistil:</b> Female reproductive part in the center.<br>
        • <b>Petal:</b> Often colorful part to attract pollinators.<br>
        • <b>Sepal:</b> Leaf-like structure protecting the bud.<br>
        • <b>Stamen:</b> Male reproductive part consisting of Anther and Filament.
      </text>
      
      <!-- Close Trigger -->
      <circle cx="610" cy="-200" r="15" fill="#f1c40f" style="cursor:pointer"/>
      <text x="610" y="-195" text-anchor="middle" fill="#fff" font-weight="bold" style="cursor:pointer">✕</text>
    </g>

    <!-- Check Answer Popup -->
    <g class="check-overlay hidden-popup" transform="translate(0, 300)">
      <rect x="0" y="-200" width="650" height="500" rx="12" fill="rgba(255, 255, 255, 0.95)" stroke="#3498db" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="30" y="-150" class="subtitle" style="color:#2980b9">🔍 Analysis</text>
      <text x="30" y="-120" class="instruction" style="font-size:16px;">
        Are you sure all connections are made?
        <br/><br/>
        Remember:<br/>
        1. Anther sits ON Filament.<br/>
        2. Stigma caps the Style.<br/>
        3. Ovary connects to the Receptacle.
      </text>
      
      <!-- Close Trigger -->
      <circle cx="610" cy="-200" r="15" fill="#3498db" style="cursor:pointer"/>
      <text x="610" y="-195" text-anchor="middle" fill="#fff" font-weight="bold" style="cursor:pointer">✕</text>
    </g>

     <!-- Reset Popup -->
     <g class="reset-overlay hidden-popup" transform="translate(0, 300)">
      <rect x="0" y="-200" width="650" height="500" rx="12" fill="rgba(255, 255, 255, 0.95)" stroke="#e74c3c" stroke-width="2" filter="url(#dropShadow)"/>
      <text x="30" y="-150" class="subtitle" style="color:#c0392b">↺ Confirmation</text>
      <text x="30" y="-120" class="instruction" style="font-size:16px;">
        Clear all current selections?<br/>This cannot be undone.
      </text>
      
      <!-- Close Trigger -->
      <circle cx="610" cy="-200" r="15" fill="#e74c3c" style="cursor:pointer"/>
      <text x="610" y="-195" text-anchor="middle" fill="#fff" font-weight="bold" style="cursor:pointer">✕</text>
    </g>

    <!-- Extra Educational Inset (Pollination Cycle) -->
    <g transform="translate(0, 800)">
        <rect x="0" y="0" width="650" height="350" rx="12" fill="#fafafa" stroke="#eee"/>
        <text x="50" y="50" class="subtitle" style="font-size:20px;">Process: Pollination</text>
        
        <!-- Simplified Diagram -->
        <!-- Bee flying to flower -->
        <g transform="translate(100, 100) rotate(20)">
            <path d="M0,0 c20,-20 40,-10 50,10 c-20,10 -30,20 -40,10" fill="#f1c40f" stroke="#d35400" stroke-width="2"/>
            <circle cx="30" cy="15" r="5" fill="#000"/> <!-- Eye -->
            <line x1="0" y1="-5" x2="-30" y2="-15" stroke="#000" stroke-width="2"/> <!-- Antenna -->
        </g>
        
        <!-- Pollen Transfer Path -->
        <path d="M400,150 Q350,200 350,250 T300,350" fill="none" stroke="#3498db" stroke-width="3" marker-end="url(#arrowhead)"/>
        <circle cx="400" cy="150" r="10" fill="#e74c3c"/> <!-- Source Anther -->
        <text x="420" y="155" font-size="12" fill="#555">Pollen Source</text>
        
        <circle cx="300" cy="350" r="10" fill="#e74c3c"/> <!-- Destination -->
         <text x="320" y="355" font-size="12" fill="#555">Destination Stigma</text>

    </g>
  </g>

  <!-- ========================================= -->
  <!-- BOTTOM WORD BANK -->
  <!-- ========================================= -->
  <rect x="0" y="1050" width="1800" height="150" fill="#fff" stroke="#e1e1e1"/>
  
  <text x="50" y="1130" class="subtitle">Word Bank (Drag tiles to match)</text>

  <g transform="translate(50, 1150)" style="columns: 4;">
    <!-- Tile Group Functionality -->
    
    <!-- Petal -->
    <g class="draggable-tile" transform="translate(0, 0)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Petal</text>
    </g>

    <!-- Sepal -->
    <g class="draggable-tile" transform="translate(220, 0)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Sepal</text>
    </g>

    <!-- Stamen -->
    <g class="draggable-tile" transform="translate(440, 0)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Stamen</text>
    </g>

    <!-- Pistil -->
    <g class="draggable-tile" transform="translate(660, 0)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Pistil</text>
    </g>

    <!-- Row 2 -->
    
    <!-- Anther -->
    <g class="draggable-tile" transform="translate(0, 70)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Anther</text>
    </g>

    <!-- Filament -->
    <g class="draggable-tile" transform="translate(220, 70)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Filament</text>
    </g>

    <!-- Ovary -->
    <g class="draggable-tile" transform="translate(440, 70)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Ovary</text>
    </g>

    <!-- Style -->
    <g class="draggable-tile" transform="translate(660, 70)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Style</text>
    </g>

    <!-- Stigma -->
    <g class="draggable-tile" transform="translate(880, 70)">
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Stigma</text>
    </g>

    <!-- Receptacle -->
    <g class="draggable-tile" transform="translate(880, 0)"> <!-- Positioned last slot -->
      <rect width="200" height="60" rx="30" fill="url(#buttonGrad)" stroke="#ccc" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-weight="bold" fill="#333">Receptacle</text>
    </g>

  </g>

</svg>