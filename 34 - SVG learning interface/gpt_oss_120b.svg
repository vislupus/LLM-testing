<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flower‑Anatomy Drag & Drop – static SVG demo
  Size: 1800 × 1200 px
  No JavaScript, no external files, no raster images.
  Interactivity is simulated with CSS :target and internal‑link navigation.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1800" height="1200"
     viewBox="0 0 1800 1200"
     font-family="Helvetica,Arial,sans-serif">

  <!-- ==============================================================
       STYLE – :target visibility, colours, typography
       ============================================================== -->
  <style>
    /* ---- General colours ------------------------------------------------ */
    .bgGrad   { stop-color:#e8f5ff; }
    .bgGrad2  { stop-color:#cde9ff; }
    .card     { cursor:pointer; user-select:none; }
    .button   { fill:#4a90e2; stroke:#2c5aa0; stroke-width:1; }
    .button text { fill:#fff; font-weight:600; pointer-events:none; }
    .label    { fill:#fafafa; stroke:#bbb; stroke-width:1; }
    .label text { fill:#333; font-size:14px; pointer-events:none; }
    .slot     { display:none; }
    .slot:target { display:inline; }
    .popup    { display:none; }
    .popup:target { display:block; }
    .arrow    { stroke:#555; stroke-width:2; marker-end:url(#arrowhead); }
    .hintBox  { fill:#fff8dc; stroke:#b8860b; stroke-width:2; }
    .closeBtn { fill:#d9534f; stroke:#a94442; stroke-width:1; cursor:pointer; }
    .closeBtn text{ fill:#fff; font-weight:600; font-size:12px; pointer-events:none; }
    .insetBox{ fill:#fff; stroke:#aaa; stroke-width:1; }
  </style>

  <!-- ==============================================================
       DEFINITIONS – gradients, arrowhead, filters
       ============================================================== -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   class="bgGrad"/>
      <stop offset="100%" class="bgGrad2"/>
    </linearGradient>

    <!-- Arrowhead marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- ==============================================================
       BACKGROUND
       ============================================================== -->
  <rect width="1800" height="1200" fill="url(#bgGrad)"/>

  <!-- ==============================================================
       PAGE TITLE
       ============================================================== -->
  <text x="900" y="70" text-anchor="middle"
        font-size="42" font-weight="bold" fill="#003366">
    Flower Anatomy Drag &amp; Drop
  </text>

  <!-- ==============================================================
       INSTRUCTION PANEL (right side, top)
       ============================================================== -->
  <g transform="translate(1190,120)">
    <rect width="560" height="260" rx="12" ry="12"
          fill="#ffffffcc" stroke="#ddd" stroke-width="1"/>
    <foreignObject x="20" y="20" width="520" height="220">
      <div xmlns="http://www.w3.org/1999/xhtml"
           style="font-size:16px; line-height:1.5; color:#333;">
        <p><strong>How to play</strong></p>
        <ul>
          <li>Tap a label in the word bank.</li>
          <li>The label will appear next to the flower part it belongs to.</li>
          <li>You can move a label again by tapping it in the bank.</li>
          <li>When you think you are done, press <em>Check Answer</em>.</li>
          <li>If you get stuck, press <em>Hint</em>.</li>
          <li>Press <em>Reset</em> to start over.</li>
        </ul>
      </div>
    </foreignObject>

    <!-- Buttons -->
    <g transform="translate(20,190)">
      <!-- Hint -->
      <a xlink:href="#hintPopup"><g class="card button"><rect x="0" y="0" width="150" height="40" rx="8" ry="8"/>
          <text x="75" y="25" text-anchor="middle">Hint</text></g></a>
      <!-- Check Answer -->
      <a xlink:href="#answerPopup"><g class="card button" transform="translate(180,0)">
          <rect x="0" y="0" width="150" height="40" rx="8" ry="8"/>
          <text x="75" y="25" text-anchor="middle">Check Answer</text></g></a>
      <!-- Reset -->
      <a xlink:href="#reset"><g class="card button" transform="translate(360,0)">
          <rect x="0" y="0" width="150" height="40" rx="8" ry="8"/>
          <text x="75" y="25" text-anchor="middle">Reset</text></g></a>
    </g>
  </g>

  <!-- ==============================================================
       CENTRAL FLOWER DIAGRAM
       ============================================================== -->
  <g id="flower" transform="translate(600,620)">
    <!-- Sepals (four) -->
    <g id="sepal" fill="#a3d977" stroke="#6b8e23" stroke-width="1.5">
      <path d="M -120 -10 C -110 -70 -70 -80 -50 -30 Z"/>
      <path d="M 120 -10 C 110 -70 70 -80 50 -30 Z"/>
      <path d="M -110 30 C -100 100 -70 110 -40 60 Z"/>
      <path d="M 110 30 C 100 100 70 110 40 60 Z"/>
    </g>

    <!-- Petals (six) -->
    <g id="petal" fill="#ffb7c5" stroke="#d2691e" stroke-width="1.5">
      <path d="M -90 -120 C -70 -160 -30 -170 0 -120 C 30 -170 70 -160 90 -120 C 70 -70 30 -80 0 -50 C -30 -80 -70 -70 -90 -120 Z"/>
      <path d="M 0 -150 C 20 -190 60 -200 100 -150 C 80 -100 40 -110 0 -80 C -40 -110 -80 -100 -100 -150 C -60 -200 -20 -190 0 -150 Z"/>
      <path d="M 90 -120 C 110 -160 150 -170 180 -120 C 160 -70 120 -80 100 -50 C 80 -80 40 -70 20 -120 Z"/>
      <path d="M -90 -120 C -110 -160 -150 -170 -180 -120 C -160 -70 -120 -80 -100 -50 C -80 -80 -40 -70 -20 -120 Z"/>
      <path d="M -30 -150 C -10 -190 30 -200 70 -150 C 50 -100 10 -110 -30 -80 C -70 -110 -110 -100 -130 -150 Z"/>
      <path d="M 30 -150 C 50 -190 90 -200 130 -150 C 110 -100 70 -110 30 -80 C -10 -110 -50 -100 -70 -150 Z"/>
    </g>

    <!-- Pistil (center) -->
    <g id="pistil" fill="#fff5c2" stroke="#d4b74c" stroke-width="1">
      <circle cx="0" cy="-30" r="40"/>
      <!-- Stigma -->
      <ellipse cx="0" cy="-30" rx="30" ry="12" fill="#ffdb58"/>
      <!-- Style -->
      <rect x="-4" y="10" width="8" height="30" fill="#ffd700"/>
      <!-- Ovary -->
      <ellipse cx="0" cy="45" rx="20" ry="12" fill="#ffec8b"/>
    </g>

    <!-- Stamen (five) -->
    <g id="stamen" fill="#ffebcd" stroke="#cda434" stroke-width="1">
      <g transform="rotate(0 0 0)">
        <line x1="0" y1="-30" x2="0" y2="-80" stroke-width="4"/>
        <circle cx="0" cy="-90" r="8" fill="#ff8c00"/>
      </g>
      <g transform="rotate(72 0 0)">
        <line x1="0" y1="-30" x2="0" y2="-80" stroke-width="4"/>
        <circle cx="0" cy="-90" r="8" fill="#ff8c00"/>
      </g>
      <g transform="rotate(144 0 0)">
        <line x1="0" y1="-30" x2="0" y2="-80" stroke-width="4"/>
        <circle cx="0" cy="-90" r="8" fill="#ff8c00"/>
      </g>
      <g transform="rotate(216 0 0)">
        <line x1="0" y1="-30" x2="0" y2="-80" stroke-width="4"/>
        <circle cx="0" cy="-90" r="8" fill="#ff8c00"/>
      </g>
      <g transform="rotate(288 0 0)">
        <line x1="0" y1="-30" x2="0" y2="-80" stroke-width="4"/>
        <circle cx="0" cy="-90" r="8" fill="#ff8c00"/>
      </g>
    </g>

    <!-- Receptacle (base) -->
    <g id="receptacle" fill="#c2b280" stroke="#8b7d5b" stroke-width="1">
      <ellipse cx="0" cy="70" rx="120" ry="30"/>
    </g>

    <!-- --------------------------------------------------------------
         ARROWS + LABEL SLOTS (hidden until target)
         -------------------------------------------------------------- -->
    <!-- Petal -->
    <line class="arrow" x1="-200" y1="-120" x2="-130" y2="-80"/>
    <g id="slotPetal" class="slot">
      <rect class="label" x="-250" y="-130" width="120" height="30" rx="6" ry="6"/>
      <text x="-190" y="-108" text-anchor="middle">Petal</text>
    </g>

    <!-- Sepal -->
    <line class="arrow" x1="-200" y1="0" x2="-130" y2="30"/>
    <g id="slotSepal" class="slot">
      <rect class="label" x="-260" y="-10" width="120" height="30" rx="6" ry="6"/>
      <text x="-200" y="12" text-anchor="middle">Sepal</text>
    </g>

    <!-- Stamen -->
    <line class="arrow" x1="0" y1="-150" x2="0" y2="-110"/>
    <g id="slotStamen" class="slot">
      <rect class="label" x="-60" y="-170" width="120" height="30" rx="6" ry="6"/>
      <text x="0" y="-148" text-anchor="middle">Stamen</text>
    </g>

    <!-- Pistil -->
    <line class="arrow" x1="120" y1="-30" x2="80" y2="-30"/>
    <g id="slotPistil" class="slot">
      <rect class="label" x="130" y="-45" width="120" height="30" rx="6" ry="6"/>
      <text x="190" y="-23" text-anchor="middle">Pistil</text>
    </g>

    <!-- Anther (part of stamen) -->
    <line class="arrow" x1="-30" y1="-90" x2="-70" y2="-120"/>
    <g id="slotAnther" class="slot">
      <rect class="label" x="-150" y="-130" width="120" height="30" rx="6" ry="6"/>
      <text x="-90" y="-108" text-anchor="middle">Anther</text>
    </g>

    <!-- Filament (part of stamen) -->
    <line class="arrow" x1="30" y1="-90" x2="70" y2="-120"/>
    <g id="slotFilament" class="slot">
      <rect class="label" x="80" y="-130" width="120" height="30" rx="6" ry="6"/>
      <text x="140" y="-108" text-anchor="middle">Filament</text>
    </g>

    <!-- Ovary -->
    <line class="arrow" x1="-70" y1="60" x2="-120" y2="80"/>
    <g id="slotOvary" class="slot">
      <rect class="label" x="-170" y="40" width="120" height="30" rx="6" ry="6"/>
      <text x="-110" y="62" text-anchor="middle">Ovary</text>
    </g>

    <!-- Style -->
    <line class="arrow" x1="0" y1="10" x2="0" y2="30"/>
    <g id="slotStyle" class="slot">
      <rect class="label" x="-60" y="20" width="120" height="30" rx="6" ry="6"/>
      <text x="0" y="42" text-anchor="middle">Style</text>
    </g>

    <!-- Stigma -->
    <line class="arrow" x1="70" y1="-30" x2="110" y2="-30"/>
    <g id="slotStigma" class="slot">
      <rect class="label" x="120" y="-45" width="120" height="30" rx="6" ry="6"/>
      <text x="180" y="-23" text-anchor="middle">Stigma</text>
    </g>

    <!-- Receptacle -->
    <line class="arrow" x1="200" y1="70" x2="140" y2="70"/>
    <g id="slotReceptacle" class="slot">
      <rect class="label" x="150" y="55" width="140" height="30" rx="6" ry="6"/>
      <text x="220" y="77" text-anchor="middle">Receptacle</text>
    </g>
  </g>

  <!-- ==============================================================
       WORD BANK (right side, lower)
       ============================================================== -->
  <g id="wordBank" transform="translate(1190,460)">
    <rect width="560" height="620" rx="12" ry="12"
          fill="#ffffffcc" stroke="#ddd" stroke-width="1"/>
    <text x="280" y="40" text-anchor="middle"
          font-size="24" font-weight="600" fill="#003366">Word Bank</text>

    <!-- Create 10 label tiles – each links to its slot (simulated drop) -->
    <g class="card" font-size="14">
      <a xlink:href="#slotPetal">
        <g class="label"><rect x="30" y="80" width="120" height="30" rx="6" ry="6"/>
          <text x="90" y="102" text-anchor="middle">Petal</text>
        </g>
      </a>
      <a xlink:href="#slotSepal">
        <g class="label"><rect x="200" y="80" width="120" height="30" rx="6" ry="6"/>
          <text x="260" y="102" text-anchor="middle">Sepal</text>
        </g>
      </a>
      <a xlink:href="#slotStamen">
        <g class="label"><rect x="30" y="130" width="120" height="30" rx="6" ry="6"/>
          <text x="90" y="152" text-anchor="middle">Stamen</text>
        </g>
      </a>
      <a xlink:href="#slotPistil">
        <g class="label"><rect x="200" y="130" width="120" height="30" rx="6" ry="6"/>
          <text x="260" y="152" text-anchor="middle">Pistil</text>
        </g>
      </a>
      <a xlink:href="#slotAnther">
        <g class="label"><rect x="30" y="180" width="120" height="30" rx="6" ry="6"/>
          <text x="90" y="202" text-anchor="middle">Anther</text>
        </g>
      </a>
      <a xlink:href="#slotFilament">
        <g class="label"><rect x="200" y="180" width="120" height="30" rx="6" ry="6"/>
          <text x="260" y="202" text-anchor="middle">Filament</text>
        </g>
      </a>
      <a xlink:href="#slotOvary">
        <g class="label"><rect x="30" y="230" width="120" height="30" rx="6" ry="6"/>
          <text x="90" y="252" text-anchor="middle">Ovary</text>
        </g>
      </a>
      <a xlink:href="#slotStyle">
        <g class="label"><rect x="200" y="230" width="120" height="30" rx="6" ry="6"/>
          <text x="260" y="252" text-anchor="middle">Style</text>
        </g>
      </a>
      <a xlink:href="#slotStigma">
        <g class="label"><rect x="30" y="280" width="120" height="30" rx="6" ry="6"/>
          <text x="90" y="302" text-anchor="middle">Stigma</text>
        </g>
      </a>
      <a xlink:href="#slotReceptacle">
        <g class="label"><rect x="200" y="280" width="120" height="30" rx="6" ry="6"/>
          <text x="260" y="302" text-anchor="middle">Receptacle</text>
        </g>
      </a>
    </g>
  </g>

  <!-- ==============================================================
       POLLINATION INSET (bottom‑left)
       ============================================================== -->
  <g transform="translate(80,960)">
    <rect width="420" height="200" rx="12" ry="12"
          fill="#ffffffcc" stroke="#ddd" stroke-width="1"/>
    <text x="210" y="30" text-anchor="middle"
          font-size="20" font-weight="600" fill="#003366">Pollination</text>

    <!-- Simple inset: flower (small) + bee -->
    <g transform="translate(210,130)">
      <!-- Small flower (simplified) -->
      <g fill="#ffb7c5" stroke="#d2691e" stroke-width="0.8">
        <circle cx="0" cy="0" r="30"/>
      </g>
      <!-- Bee (stylised) -->
      <g fill="#ffcc33" stroke="#b8860b" stroke-width="0.8">
        <ellipse cx="-40" cy="-10" rx="12" ry="8"/>
        <line x1="-48" y1="-10" x2="-55" y2="-12" stroke="#555" stroke-width="1"/>
        <line x1="-48" y1="-10" x2="-55" y2="-8"  stroke="#555" stroke-width="1"/>
      </g>
      <text x="-30" y="25" font-size="14" fill="#333">Bee transfers pollen</text>
    </g>
  </g>

  <!-- ==============================================================
       HINT POPUP
       ============================================================== -->
  <g id="hintPopup" class="popup">
    <!-- semi‑transparent overlay -->
    <rect width="1800" height="1200" fill="rgba(0,0,0,0.4)"/>
    <!-- white dialog -->
    <rect x="340" y="300" width="1120" height="460" rx="12" ry="12"
          class="hintBox"/>
    <text x="900" y="360" text-anchor="middle"
          font-size="28" font-weight="600" fill="#8b6c12">Hint</text>
    <foreignObject x="380" y="380" width="1040" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml"
           style="font-size:16px; line-height:1.6; color:#5a3b00;">
        <p>Look at the diagram:</p>
        <ul>
          <li>The <strong>outermost green parts</strong> are <em>sepals</em>.</li>
          <li>The <strong>large colourful extensions</strong> are <em>petals</em>.</li>
          <li>Stamens are the <em>filament + anther</em> structures surrounding the centre.</li>
          <li>The central <em>yellow disc</em> is the <em>pistil</em> (stigma‑style‑ovary).</li>
          <li>The “base” that holds everything is the <em>receptacle</em>.</li>
        </ul>
      </div>
    </foreignObject>
    <!-- close button -->
    <a xlink:href="#"><g class="closeBtn" transform="translate(1160,320)">
        <circle r="14" cx="0" cy="0"/>
        <text x="0" y="5" text-anchor="middle">✕</text>
    </g></a>
  </g>

  <!-- ==============================================================
       ANSWER POPUP
       ============================================================== -->
  <g id="answerPopup" class="popup">
    <rect width="1800" height="1200" fill="rgba(0,0,0,0.4)"/>
    <rect x="340" y="300" width="1120" height="460" rx="12" ry="12"
          class="hintBox"/>
    <text x="900" y="360" text-anchor="middle"
          font-size="28" font-weight="600" fill="#8b6c12">Answer</text>
    <foreignObject x="380" y="380" width="1040" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml"
           style="font-size:16px; line-height:1.6; color:#5a3b00;">
        <p>Correct placement of each label:</p>
        <ul>
          <li><strong>Petal</strong> – outer colourful parts.</li>
          <li><strong>Sepal</strong> – green leaf‑like parts beneath the petals.</li>
          <li><strong>Stamen</strong> – filament + anther (the five yellow spikes).</li>
          <li><strong>Pistil</strong> – central structure (stigma‑style‑ovary).</li>
          <li><strong>Anther</strong> – the tip of each stamen.</li>
          <li><strong>Filament</strong> – the stalk holding each anther.</li>
          <li><strong>Ovary</strong> – lower bulb of the pistil.</li>
          <li><strong>Style</strong> – the neck connecting stigma and ovary.</li>
          <li><strong>Stigma</strong> – sticky top of pistil.</li>
          <li><strong>Receptacle</strong> – the base that holds all parts.</li>
        </ul>
      </div>
    </foreignObject>
    <a xlink:href="#"><g class="closeBtn" transform="translate(1160,320)">
        <circle r="14" cx="0" cy="0"/>
        <text x="0" y="5" text-anchor="middle">✕</text>
    </g></a>
  </g>

  <!-- ==============================================================
       RESET (simply clear the URL fragment)
       ============================================================== -->
  <a xlink:href="#" id="reset"/>

</svg>