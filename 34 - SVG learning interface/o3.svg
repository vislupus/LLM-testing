<?xml version="1.0" encoding="UTF-8"?>
<!-- 1800 × 1200 single-page static SVG “Flower Anatomy Drag & Drop” – no JS, no external assets -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1800" height="1200" viewBox="0 0 1800 1200" id="mainPanel">

  <!-- =========  STYLING & DEFINITIONS  ========= -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4FBFF"/>
      <stop offset="100%" stop-color="#D6E7FF"/>
    </linearGradient>

    <!-- Arrowhead -->
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="0" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 10,5 0,10" fill="#555"/>
    </marker>

    <!-- Shared styles -->
    <style><![CDATA[
      .title{font-family:Helvetica,Arial,sans-serif;font-size:48px;fill:#333;font-weight:bold;}
      .ui-text{font-family:Helvetica,Arial,sans-serif;font-size:24px;fill:#333;}
      .word-bank-text{font-size:24px;fill:#fff;font-weight:bold;pointer-events:none;}
      .label-tile{fill:#4A90E2;stroke:#3274BD;stroke-width:2;rx:12;ry:12;cursor:pointer;}
      .slot{fill:none;stroke:#666;stroke-dasharray:4 4;rx:8;ry:8;}
      .slot-text{font-size:20px;fill:#888;pointer-events:none;}
      .button{fill:#50E3C2;stroke:#38B89B;stroke-width:2;rx:10;ry:10;cursor:pointer;}
      .button-text{font-size:20px;fill:#fff;font-weight:bold;pointer-events:none;}
      .arrow{stroke:#555;stroke-width:3;fill:none;marker-end:url(#arrowHead);}
      .flower-part{stroke:#333;stroke-width:2;}
      /* Popup mechanics */
      .popup{display:none;}
      .popup:target{display:inline;}
      .popup-bg{fill:rgba(0,0,0,0.45);}
      .popup-panel{fill:#fff;stroke:#333;stroke-width:3;rx:20;ry:20;}
      .popup-text{font-size:28px;fill:#333;font-family:Helvetica,Arial,sans-serif;}
      .close-btn{fill:#D0021B;stroke:#A00116;stroke-width:2;rx:8;ry:8;cursor:pointer;}
      .close-text{font-size:20px;fill:#fff;font-family:Helvetica,Arial,sans-serif;pointer-events:none;}
    ]]></style>
  </defs>

  <!-- ========= BACKGROUND ========= -->
  <rect width="1800" height="1200" fill="url(#bgGrad)"/>

  <!-- ========= MAIN TITLE ========= -->
  <text x="50" y="70" class="title">Flower Anatomy Drag &amp; Drop</text>

  <!-- ========= ROOT GROUP (for :target close) ========= -->
  <g id="root">

    <!-- ======== DIAGRAM AREA ======== -->
    <g id="diagram">

      <!-- Flower illustration (stylised) -->
      <!-- Petals -->
      <ellipse cx="600" cy="500" rx="90" ry="220" fill="#FFC8DE" class="flower-part"/>
      <ellipse cx="600" cy="500" rx="90" ry="220" fill="#FFC8DE"
               class="flower-part" transform="rotate(72 600 500)"/>
      <ellipse cx="600" cy="500" rx="90" ry="220" fill="#FFC8DE"
               class="flower-part" transform="rotate(144 600 500)"/>
      <ellipse cx="600" cy="500" rx="90" ry="220" fill="#FFC8DE"
               class="flower-part" transform="rotate(216 600 500)"/>
      <ellipse cx="600" cy="500" rx="90" ry="220" fill="#FFC8DE"
               class="flower-part" transform="rotate(288 600 500)"/>

      <!-- Sepals -->
      <ellipse cx="600" cy="650" rx="70" ry="110" fill="#8FD18C" class="flower-part"/>
      <ellipse cx="600" cy="650" rx="70" ry="110" fill="#8FD18C"
               class="flower-part" transform="rotate(120 600 650)"/>
      <ellipse cx="600" cy="650" rx="70" ry="110" fill="#8FD18C"
               class="flower-part" transform="rotate(240 600 650)"/>

      <!-- Pistil (style, stigma, ovary) -->
      <line x1="600" y1="470" x2="600" y2="550" stroke="#6B4D30" stroke-width="8"/>
      <circle cx="600" cy="460" r="25" fill="#E5C07B" stroke="#6B4D30" stroke-width="4"/> <!-- Stigma -->
      <ellipse cx="600" cy="590" rx="45" ry="30" fill="#EFD9A0" stroke="#6B4D30" stroke-width="4"/> <!-- Ovary -->

      <!-- Stamens (filament + anther) -->
      <g id="stamens">
        <!-- 5 stamens -->
        <g transform="rotate(0 600 500)">
          <line x1="600" y1="500" x2="600" y2="420" stroke="#CA9B52" stroke-width="6"/> <!-- filament -->
          <circle cx="600" cy="410" r="18" fill="#FFD966" stroke="#906D34" stroke-width="3"/> <!-- anther -->
        </g>
        <g transform="rotate(72 600 500)">
          <line x1="600" y1="500" x2="600" y2="420" stroke="#CA9B52" stroke-width="6"/>
          <circle cx="600" cy="410" r="18" fill="#FFD966" stroke="#906D34" stroke-width="3"/>
        </g>
        <g transform="rotate(144 600 500)">
          <line x1="600" y1="500" x2="600" y2="420" stroke="#CA9B52" stroke-width="6"/>
          <circle cx="600" cy="410" r="18" fill="#FFD966" stroke="#906D34" stroke-width="3"/>
        </g>
        <g transform="rotate(216 600 500)">
          <line x1="600" y1="500" x2="600" y2="420" stroke="#CA9B52" stroke-width="6"/>
          <circle cx="600" cy="410" r="18" fill="#FFD966" stroke="#906D34" stroke-width="3"/>
        </g>
        <g transform="rotate(288 600 500)">
          <line x1="600" y1="500" x2="600" y2="420" stroke="#CA9B52" stroke-width="6"/>
          <circle cx="600" cy="410" r="18" fill="#FFD966" stroke="#906D34" stroke-width="3"/>
        </g>
      </g>

      <!-- Receptacle -->
      <ellipse cx="600" cy="650" rx="60" ry="40" fill="#A4794F" stroke="#6B4D30" stroke-width="4"/>

      <!-- ======== LABEL SLOTS & ARROWS ======== -->
      <!-- Slot template positions -->
      <g id="slots">
        <!-- 1 Petal -->
        <rect id="petalSlot" x="1000" y="280" width="180" height="40" class="slot"/>
        <line x1="640" y1="350" x2="1000" y2="300" class="arrow"/>
        <text x="1010" y="308" class="slot-text">Petal</text>

        <!-- 2 Sepal -->
        <rect id="sepalSlot" x="1000" y="330" width="180" height="40" class="slot"/>
        <line x1="640" y1="700" x2="1000" y2="350" class="arrow"/>
        <text x="1010" y="358" class="slot-text">Sepal</text>

        <!-- 3 Stamen -->
        <rect id="stamenSlot" x="1000" y="380" width="180" height="40" class="slot"/>
        <line x1="660" y1="450" x2="1000" y2="400" class="arrow"/>
        <text x="1010" y="408" class="slot-text">Stamen</text>

        <!-- 4 Pistil -->
        <rect id="pistilSlot" x="1000" y="430" width="180" height="40" class="slot"/>
        <line x1="640" y1="520" x2="1000" y2="450" class="arrow"/>
        <text x="1010" y="458" class="slot-text">Pistil</text>

        <!-- 5 Anther -->
        <rect id="antherSlot" x="1000" y="480" width="180" height="40" class="slot"/>
        <line x1="640" y1="410" x2="1000" y2="500" class="arrow"/>
        <text x="1010" y="508" class="slot-text">Anther</text>

        <!-- 6 Filament -->
        <rect id="filamentSlot" x="1000" y="530" width="180" height="40" class="slot"/>
        <line x1="640" y1="460" x2="1000" y2="550" class="arrow"/>
        <text x="1010" y="558" class="slot-text">Filament</text>

        <!-- 7 Ovary -->
        <rect id="ovarySlot" x="1000" y="580" width="180" height="40" class="slot"/>
        <line x1="640" y1="590" x2="1000" y2="600" class="arrow"/>
        <text x="1010" y="608" class="slot-text">Ovary</text>

        <!-- 8 Style -->
        <rect id="styleSlot" x="1000" y="630" width="180" height="40" class="slot"/>
        <line x1="640" y1="535" x2="1000" y2="650" class="arrow"/>
        <text x="1010" y="658" class="slot-text">Style</text>

        <!-- 9 Stigma -->
        <rect id="stigmaSlot" x="1000" y="680" width="180" height="40" class="slot"/>
        <line x1="640" y1="460" x2="1000" y2="700" class="arrow"/>
        <text x="1010" y="708" class="slot-text">Stigma</text>

        <!-- 10 Receptacle -->
        <rect id="receptacleSlot" x="1000" y="730" width="180" height="40" class="slot"/>
        <line x1="640" y1="650" x2="1000" y2="750" class="arrow"/>
        <text x="1010" y="758" class="slot-text">Receptacle</text>
      </g>
    </g>

    <!-- ======== WORD BANK ======== -->
    <g id="wordBank">
      <!-- Ten draggable-style label tiles -->
      <g transform="translate(200,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="15" y="32" class="word-bank-text">Petal</text></g>
      </g>
      <g transform="translate(360,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="23" y="32" class="word-bank-text">Sepal</text></g>
      </g>
      <g transform="translate(520,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="13" y="32" class="word-bank-text">Stamen</text></g>
      </g>
      <g transform="translate(680,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="28" y="32" class="word-bank-text">Pistil</text></g>
      </g>
      <g transform="translate(840,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="20" y="32" class="word-bank-text">Anther</text></g>
      </g>
      <g transform="translate(1000,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="15" y="32" class="word-bank-text">Filament</text></g>
      </g>
      <g transform="translate(1160,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="33" y="32" class="word-bank-text">Ovary</text></g>
      </g>
      <g transform="translate(1320,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="42" y="32" class="word-bank-text">Style</text></g>
      </g>
      <g transform="translate(1480,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="33" y="32" class="word-bank-text">Stigma</text></g>
      </g>
      <g transform="translate(1640,950)">
        <g><rect width="150" height="50" class="label-tile"/><text x="5" y="32" class="word-bank-text">Receptacle</text></g>
      </g>
    </g>

    <!-- ======== INSTRUCTION PANEL ======== -->
    <g id="instructionPanel">
      <rect x="1200" y="200" width="520" height="600" fill="#FFFFFF" stroke="#333" stroke-width="3" rx="20" ry="20"/>
      <text x="1225" y="245" class="ui-text" font-size="32" font-weight="bold">Instructions</text>
      <text x="1225" y="295" class="ui-text">1. Match each word</text>
      <text x="1225" y="330" class="ui-text">   with its part on</text>
      <text x="1225" y="365" class="ui-text">   the flower diagram.</text>
      <text x="1225" y="405" class="ui-text">2. Use the buttons</text>
      <text x="1225" y="440" class="ui-text">   for hints or to</text>
      <text x="1225" y="475" class="ui-text">   check/reset answers.</text>

      <!-- Buttons -->
      <a xlink:href="#hintPanel">
        <rect x="1225" y="500" width="140" height="45" class="button"/>
        <text x="1255" y="530" class="button-text">Hint</text>
      </a>
      <a xlink:href="#checkPanel">
        <rect x="1385" y="500" width="180" height="45" class="button"/>
        <text x="1415" y="530" class="button-text">Check Answer</text>
      </a>
      <a xlink:href="#resetPanel">
        <rect x="1585" y="500" width="110" height="45" class="button"/>
        <text x="1600" y="530" class="button-text">Reset</text>
      </a>

      <!-- Small inset diagram: pollination -->
      <g id="pollinationInset">
        <!-- Arrow showing pollen transfer -->
        <circle cx="1330" cy="620" r="20" fill="#FFD966" stroke="#906D34" stroke-width="3"/>
        <line x1="1345" y1="620" x2="1500" y2="620" stroke="#555" stroke-width="4" marker-end="url(#arrowHead)"/>
        <circle cx="1520" cy="620" r="25" fill="#E5C07B" stroke="#6B4D30" stroke-width="4"/>
        <text x="1300" y="655" class="ui-text" font-size="20">Pollen</text>
        <text x="1500" y="655" class="ui-text" font-size="20">Stigma</text>
        <text x="1225" y="595" class="ui-text" font-size="22" font-weight="bold">Pollination</text>
      </g>
    </g>
  </g> <!-- End root -->

  <!-- ========= POPUP PANELS ========= -->

  <!-- Hint Panel -->
  <g id="hintPanel" class="popup">
    <rect class="popup-bg" x="0" y="0" width="1800" height="1200"/>
    <rect class="popup-panel" x="500" y="300" width="800" height="400"/>
    <text x="540" y="360" class="popup-text" font-weight="bold">Hint</text>
    <text x="540" y="410" class="popup-text">Petals are usually colorful and</text>
    <text x="540" y="450" class="popup-text">surround the reproductive organs.</text>
    <text x="540" y="490" class="popup-text">Stamens have anthers on top of</text>
    <text x="540" y="530" class="popup-text">filaments, while the pistil is in</text>
    <text x="540" y="570" class="popup-text">the very center (stigma &gt; style &gt; ovary).</text>
    <!-- Close -->
    <a xlink:href="#root">
      <rect x="1220" y="320" width="60" height="40" class="close-btn"/>
      <text x="1237" y="347" class="close-text">✕</text>
    </a>
  </g>

  <!-- Check Answer Panel -->
  <g id="checkPanel" class="popup">
    <rect class="popup-bg" x="0" y="0" width="1800" height="1200"/>
    <rect class="popup-panel" x="500" y="300" width="800" height="400"/>
    <text x="540" y="360" class="popup-text" font-weight="bold">Answer Key</text>
    <text x="540" y="410" class="popup-text">All label slots are pre-filled</text>
    <text x="540" y="450" class="popup-text">with the correct names so you</text>
    <text x="540" y="490" class="popup-text">can cross-check your work.</text>
    <text x="540" y="540" class="popup-text" font-size="22">(In a live activity, slots would</text>
    <text x="540" y="575" class="popup-text" font-size="22">highlight correct/incorrect matches.)</text>
    <!-- Close -->
    <a xlink:href="#root">
      <rect x="1220" y="320" width="60" height="40" class="close-btn"/>
      <text x="1237" y="347" class="close-text">✕</text>
    </a>
  </g>

  <!-- Reset Panel -->
  <g id="resetPanel" class="popup">
    <rect class="popup-bg" x="0" y="0" width="1800" height="1200"/>
    <rect class="popup-panel" x="500" y="300" width="800" height="400"/>
    <text x="540" y="360" class="popup-text" font-weight="bold">Reset Activity</text>
    <text x="540" y="410" class="popup-text">All tiles have been returned</text>
    <text x="540" y="450" class="popup-text">to the word bank. Try again!</text>
    <!-- Close -->
    <a xlink:href="#root">
      <rect x="1220" y="320" width="60" height="40" class="close-btn"/>
      <text x="1237" y="347" class="close-text">✕</text>
    </a>
  </g>

</svg>