<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1800 1200" width="100%" height="100%"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f1e7"/>
      <stop offset="100%" stop-color="#e8dfcb"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb6c1"/>
      <stop offset="60%" stop-color="#f48aa3"/>
      <stop offset="100%" stop-color="#d96b87"/>
    </linearGradient>
    <linearGradient id="petalShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd6e0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd6e0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sepalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8dc26b"/>
      <stop offset="100%" stop-color="#5e913f"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fd37b"/>
      <stop offset="100%" stop-color="#4d7f32"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d7f32"/>
      <stop offset="50%" stop-color="#6fa749"/>
      <stop offset="100%" stop-color="#3d6627"/>
    </linearGradient>
    <radialGradient id="centerGrad" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="60%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#c88b22"/>
    </radialGradient>
    <linearGradient id="pistilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d46a3a"/>
      <stop offset="100%" stop-color="#8a3a1a"/>
    </linearGradient>
    <linearGradient id="filamentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d77a"/>
      <stop offset="100%" stop-color="#c99a3f"/>
    </linearGradient>
    <radialGradient id="antherGrad" cx="0.4" cy="0.3">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#b8761a"/>
    </radialGradient>
    <linearGradient id="stigmaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e89b5e"/>
      <stop offset="100%" stop-color="#a54f25"/>
    </linearGradient>
    <linearGradient id="ovaryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9d48a"/>
      <stop offset="100%" stop-color="#6a8a4a"/>
    </linearGradient>
    <linearGradient id="styleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0955f"/>
      <stop offset="100%" stop-color="#a85b2a"/>
    </linearGradient>
    <linearGradient id="receptacleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fa455"/>
      <stop offset="100%" stop-color="#4b6b2d"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef1ea"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b86c4"/>
      <stop offset="100%" stop-color="#3a5f94"/>
    </linearGradient>
    <linearGradient id="btnGradGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb372"/>
      <stop offset="100%" stop-color="#3e7c47"/>
    </linearGradient>
    <linearGradient id="btnGradAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a94b"/>
      <stop offset="100%" stop-color="#b87821"/>
    </linearGradient>
    <linearGradient id="btnGradRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d76b6b"/>
      <stop offset="100%" stop-color="#a13e3e"/>
    </linearGradient>
    <linearGradient id="popupGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2ecdd"/>
    </linearGradient>
    <linearGradient id="insetBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#d9e7f5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="medShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrowHint" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97c2b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e7c47"/>
    </marker>

    <!-- Drop slot symbol (dashed rounded rect) reusable -->
    <symbol id="slot" viewBox="0 0 120 36">
      <rect x="1" y="1" width="118" height="34" rx="10" ry="10"
            fill="#ffffff" fill-opacity="0.6" stroke="#5d6d7e"
            stroke-width="2" stroke-dasharray="6 4"/>
    </symbol>

    <!-- Label tile symbol -->
    <symbol id="tile" viewBox="0 0 140 44">
      <rect x="2" y="2" width="136" height="40" rx="12" ry="12" fill="url(#tileGrad)" stroke="#8a9aab" stroke-width="1.5"/>
      <rect x="2" y="2" width="136" height="18" rx="12" ry="12" fill="#ffffff" fill-opacity="0.6"/>
    </symbol>
  </defs>

  <!-- Page background -->
  <rect width="1800" height="1200" fill="url(#bgGrad)"/>
  <!-- Subtle paper texture via dots -->
  <g opacity="0.25">
    <circle cx="100" cy="200" r="1" fill="#9b8f74"/>
    <circle cx="300" cy="400" r="1" fill="#9b8f74"/>
    <circle cx="500" cy="150" r="1" fill="#9b8f74"/>
    <circle cx="800" cy="300" r="1" fill="#9b8f74"/>
    <circle cx="1200" cy="250" r="1" fill="#9b8f74"/>
    <circle cx="1500" cy="500" r="1" fill="#9b8f74"/>
    <circle cx="200" cy="800" r="1" fill="#9b8f74"/>
    <circle cx="900" cy="750" r="1" fill="#9b8f74"/>
  </g>

  <!-- ===== HEADER / TITLE ===== -->
  <g filter="url(#softShadow)">
    <rect x="0" y="0" width="1800" height="90" fill="#3c5e6e"/>
    <rect x="0" y="70" width="1800" height="20" fill="#2d4a57"/>
  </g>
  <text x="60" y="58" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="1">Flower Anatomy</text>
  <text x="480" y="58" font-size="26" font-weight="300" fill="#b8d3dd" letter-spacing="2">Drag &amp; Drop Explorer</text>
  <!-- Decorative flower icon in header -->
  <g transform="translate(1680,45) scale(0.5)" opacity="0.8">
    <circle cx="0" cy="0" r="14" fill="#f2c14e"/>
    <g fill="#ffb6c1">
      <ellipse cx="0" cy="-26" rx="10" ry="18"/>
      <ellipse cx="24" cy="-8" rx="10" ry="18" transform="rotate(72 24 -8)"/>
      <ellipse cx="15" cy="22" rx="10" ry="18" transform="rotate(144 15 22)"/>
      <ellipse cx="-15" cy="22" rx="10" ry="18" transform="rotate(-144 -15 22)"/>
      <ellipse cx="-24" cy="-8" rx="10" ry="18" transform="rotate(-72 -24 -8)"/>
    </g>
  </g>

  <!-- ===== MAIN DIAGRAM PANEL ===== -->
  <g filter="url(#medShadow)">
    <rect x="30" y="110" width="1250" height="870" rx="22" ry="22" fill="url(#panelGrad)" stroke="#c8bfa9" stroke-width="2"/>
  </g>
  <text x="60" y="155" font-size="22" font-weight="700" fill="#3c5e6e">Diagram: The Perfect Flower</text>
  <text x="60" y="180" font-size="14" fill="#6b7c85">Drag each label from the word bank onto the empty slot pointing to the matching part.</text>

  <!-- ===== FLOWER DIAGRAM (center ~660, 560) ===== -->
  <g id="flower-main" transform="translate(660 560)">
    <!-- Stem -->
    <path d="M -14,310 Q -10,180 0,140 Q 10,100 8,30 Q 6,0 0,0"
          stroke="url(#stemGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <!-- Leaf on stem -->
    <g transform="translate(-8 230) rotate(-25)">
      <path d="M0,0 C -60,-30 -120,-10 -160,0 C -120,20 -60,35 0,0 z" fill="url(#leafGrad)" stroke="#3d6627" stroke-width="1.5"/>
      <path d="M-150,0 Q -80,-6 -20,0" stroke="#2d4a1c" stroke-width="1.5" fill="none"/>
      <path d="M-120,-8 Q -80,-2 -60,-4" stroke="#2d4a1c" stroke-width="1" fill="none"/>
      <path d="M-120,10 Q -80,4 -60,6" stroke="#2d4a1c" stroke-width="1" fill="none"/>
    </g>

    <!-- Sepals (5 green leaves behind/under petals, at flower base) -->
    <g id="sepal-group">
      <g transform="rotate(0)"><path d="M0,-15 Q -25,-40 -40,-80 Q -10,-90 5,-50 Z" fill="url(#sepalGrad)" stroke="#3d6627" stroke-width="1.5"/></g>
      <g transform="rotate(72)"><path d="M0,-15 Q -25,-40 -40,-80 Q -10,-90 5,-50 Z" fill="url(#sepalGrad)" stroke="#3d6627" stroke-width="1.5"/></g>
      <g transform="rotate(144)"><path d="M0,-15 Q -25,-40 -40,-80 Q -10,-90 5,-50 Z" fill="url(#sepalGrad)" stroke="#3d6627" stroke-width="1.5"/></g>
      <g transform="rotate(216)"><path d="M0,-15 Q -25,-40 -40,-80 Q -10,-90 5,-50 Z" fill="url(#sepalGrad)" stroke="#3d6627" stroke-width="1.5"/></g>
      <g transform="rotate(288)"><path d="M0,-15 Q -25,-40 -40,-80 Q -10,-90 5,-50 Z" fill="url(#sepalGrad)" stroke="#3d6627" stroke-width="1.5"/></g>
    </g>

    <!-- Receptacle (the swollen base of the flower where parts attach) -->
    <path id="receptacle" d="M -28,-10 Q -30,18 -22,40 Q 0,55 22,40 Q 30,18 28,-10 Q 0,12 -28,-10 z"
          fill="url(#receptacleGrad)" stroke="#3d6627" stroke-width="1.5"/>

    <!-- Petals (8 petals arranged radially) -->
    <g id="petals">
      <!-- Use 8 petals, soft pink -->
      <g fill="url(#petalGrad)" stroke="#b95a74" stroke-width="1.2">
        <path d="M0,0 C -55,-60 -90,-180 0,-260 C 90,-180 55,-60 0,0 z"/>
        <path d="M0,0 C -55,-60 -90,-180 0,-260 C 90,-180 55,-60 0,0 z" transform="rotate(45)"/>
        <path d="M0,0 C -55,-60 -90,-180 0,-260 C 90,-180 55,-60 0,0 z" transform="rotate(90)"/>
        <path d="M0,0 C -55,-60 -90,-180 0,-260 C 90,-180 55,-60 0,0 z" transform="rotate(135)"/>
        <path d="M0,0 C -55,-60 -90,-180 0,-260 C 90,-180 55,-60 0,0 z" transform="rotate(180)"/>
        <path d="M0,0 C -55,-60 -90,-180 0,-260 C 90,-180 55,-60 0,0 z" transform="rotate(225)"/>
        <path d="M0,0 C -55,-60 -90,-180 0,-260 C 90,-180 55,-60 0,0 z" transform="rotate(270)"/>
        <path d="M0,0 C -55,-60 -90,-180 0,-260 C 90,-180 55,-60 0,0 z" transform="rotate(315)"/>
      </g>
      <!-- petal highlights -->
      <g fill="url(#petalShine)" opacity="0.7">
        <path d="M-8,-10 C -40,-80 -30,-180 -5,-230 C 10,-170 -5,-80 8,-10 z"/>
        <path d="M-8,-10 C -40,-80 -30,-180 -5,-230 C 10,-170 -5,-80 8,-10 z" transform="rotate(90)"/>
        <path d="M-8,-10 C -40,-80 -30,-180 -5,-230 C 10,-170 -5,-80 8,-10 z" transform="rotate(180)"/>
        <path d="M-8,-10 C -40,-80 -30,-180 -5,-230 C 10,-170 -5,-80 8,-10 z" transform="rotate(270)"/>
      </g>
    </g>

    <!-- Central disk base (receptacle top) -->
    <circle cx="0" cy="-10" r="42" fill="url(#centerGrad)" stroke="#a07218" stroke-width="1.5"/>

    <!-- OVARY (enlarged base of pistil, shown half visible inside) -->
    <g id="ovary-group">
      <ellipse cx="0" cy="10" rx="28" ry="28" fill="url(#ovaryGrad)" stroke="#4a6632" stroke-width="1.8"/>
      <!-- ovules -->
      <circle cx="-8" cy="12" r="4" fill="#f4ead0"/>
      <circle cx="8" cy="8" r="4" fill="#f4ead0"/>
      <circle cx="0" cy="22" r="3.5" fill="#f4ead0"/>
      <path d="M-28,10 Q 0,20 28,10" stroke="#4a6632" stroke-width="1" fill="none" opacity="0.6"/>
    </g>

    <!-- Stamens (filament + anther), around the pistil: 6 of them -->
    <g id="stamens">
      <!-- each stamen is a filament stalk with an anther tip -->
      <g class="stamen" transform="rotate(-40)">
        <path class="filament" d="M0,10 Q -4,-20 -2,-80" stroke="url(#filamentGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse class="anther" cx="-2" cy="-84" rx="12" ry="6" fill="url(#antherGrad)" stroke="#8a5614" stroke-width="1.2"/>
        <circle cx="-8" cy="-84" r="1.5" fill="#fff2a8"/>
        <circle cx="4" cy="-84" r="1.5" fill="#fff2a8"/>
      </g>
      <g class="stamen" transform="rotate(-15)">
        <path class="filament" d="M0,10 Q -2,-20 0,-95" stroke="url(#filamentGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse class="anther" cx="0" cy="-99" rx="12" ry="6" fill="url(#antherGrad)" stroke="#8a5614" stroke-width="1.2"/>
        <circle cx="-6" cy="-99" r="1.5" fill="#fff2a8"/>
        <circle cx="6" cy="-99" r="1.5" fill="#fff2a8"/>
      </g>
      <g class="stamen" transform="rotate(10)">
        <path class="filament" d="M0,10 Q 2,-20 6,-85" stroke="url(#filamentGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse class="anther" cx="6" cy="-89" rx="12" ry="6" fill="url(#antherGrad)" stroke="#8a5614" stroke-width="1.2"/>
        <circle cx="0" cy="-89" r="1.5" fill="#fff2a8"/>
        <circle cx="12" cy="-89" r="1.5" fill="#fff2a8"/>
      </g>
      <g class="stamen" transform="rotate(35)">
        <path class="filament" d="M0,10 Q 4,-20 10,-75" stroke="url(#filamentGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse class="anther" cx="10" cy="-79" rx="12" ry="6" fill="url(#antherGrad)" stroke="#8a5614" stroke-width="1.2"/>
        <circle cx="4" cy="-79" r="1.5" fill="#fff2a8"/>
        <circle cx="16" cy="-79" r="1.5" fill="#fff2a8"/>
      </g>
      <g class="stamen" transform="rotate(-60)">
        <path class="filament" d="M0,10 Q -6,-15 -14,-60" stroke="url(#filamentGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse class="anther" cx="-14" cy="-64" rx="11" ry="6" fill="url(#antherGrad)" stroke="#8a5614" stroke-width="1.2"/>
      </g>
      <g class="stamen" transform="rotate(60)">
        <path class="filament" d="M0,10 Q 6,-15 16,-62" stroke="url(#filamentGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse class="anther" cx="16" cy="-66" rx="11" ry="6" fill="url(#antherGrad)" stroke="#8a5614" stroke-width="1.2"/>
      </g>
    </g>

    <!-- PISTIL (central female structure: ovary already drawn; style going up, stigma on top) -->
    <g id="pistil">
      <!-- Style: long tube going up from ovary -->
      <path id="style" d="M0,2 Q 0,-40 0,-115" stroke="url(#styleGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M-3,-60 Q 0,-55 3,-60" stroke="#8a4718" stroke-width="1" fill="none" opacity="0.6"/>
      <!-- Stigma: lobed top -->
      <g id="stigma" transform="translate(0,-120)">
        <ellipse cx="0" cy="0" rx="20" ry="12" fill="url(#stigmaGrad)" stroke="#7a3a17" stroke-width="1.5"/>
        <circle cx="-8" cy="-3" r="5" fill="#c1773a"/>
        <circle cx="7" cy="-4" r="5" fill="#c1773a"/>
        <circle cx="0" cy="4" r="5" fill="#c1773a"/>
        <circle cx="-4" cy="-2" r="1.5" fill="#f3c48a"/>
        <circle cx="9" cy="-3" r="1.5" fill="#f3c48a"/>
        <circle cx="2" cy="5" r="1.5" fill="#f3c48a"/>
      </g>
    </g>

    <!-- Pollen dots on anthers -->
    <g fill="#ffe066" opacity="0.85">
      <circle cx="-50" cy="-70" r="1.6"/>
      <circle cx="-30" cy="-50" r="1.3"/>
      <circle cx="40" cy="-65" r="1.5"/>
      <circle cx="20" cy="-110" r="1.2"/>
      <circle cx="-60" cy="-40" r="1.4"/>
    </g>
  </g>

  <!-- ===== LABEL LEADER LINES + EMPTY SLOTS (in "quiz" state) ===== -->
  <g id="quiz-labels" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)" font-family="inherit">
    <!-- Petal: from a right-top petal tip to slot -->
    <line x1="830" y1="380" x2="1100" y2="260"/>
    <!-- Sepal: from base sepal -->
    <line x1="620" y1="670" x2="400" y2="830"/>
    <!-- Stamen (one anther) -->
    <line x1="660" y1="460" x2="900" y2="380"/>
    <!-- Pistil (center) -->
    <line x1="660" y1="440" x2="900" y2="480"/>
    <!-- Anther -->
    <line x1="670" y1="470" x2="1080" y2="430"/>
    <!-- Filament -->
    <line x1="648" y1="500" x2="480" y2="380"/>
    <!-- Ovary -->
    <line x1="660" y1="570" x2="900" y2="640"/>
    <!-- Style -->
    <line x1="660" y1="490" x2="1100" y2="570"/>
    <!-- Stigma -->
    <line x1="660" y1="440" x2="1100" y2="500"/>
    <!-- Receptacle -->
    <line x1="660" y1="600" x2="450" y2="700"/>
  </g>

  <!-- Empty drop slots (quiz state) -->
  <g id="slots">
    <use href="#slot" x="1080" y="240" width="170" height="36"/>
    <use href="#slot" x="280" y="815" width="170" height="36"/>
    <use href="#slot" x="880" y="360" width="170" height="36"/>
    <use href="#slot" x="880" y="465" width="170" height="36"/>
    <use href="#slot" x="1060" y="415" width="170" height="36"/>
    <use href="#slot" x="330" y="365" width="170" height="36"/>
    <use href="#slot" x="880" y="625" width="170" height="36"/>
    <use href="#slot" x="1080" y="555" width="170" height="36"/>
    <use href="#slot" x="1080" y="485" width="170" height="36"/>
    <use href="#slot" x="330" y="685" width="170" height="36"/>
  </g>

  <!-- ===== RIGHT INSTRUCTION PANEL ===== -->
  <g filter="url(#medShadow)">
    <rect x="1310" y="110" width="460" height="340" rx="22" ry="22" fill="url(#panelGrad)" stroke="#c8bfa9" stroke-width="2"/>
  </g>
  <rect x="1310" y="110" width="460" height="48" rx="22" ry="22" fill="#3c5e6e"/>
  <rect x="1310" y="135" width="460" height="24" fill="#2d4a57"/>
  <text x="1335" y="143" font-size="20" font-weight="700" fill="#ffffff">How to Play</text>

  <g font-size="15" fill="#2c3e50">
    <text x="1335" y="185" font-weight="700" fill="#3c5e6e">Goal</text>
    <text x="1335" y="208">Identify and place the 10 flower parts</text>
    <text x="1335" y="228">into the correct slots on the diagram.</text>

    <text x="1335" y="260" font-weight="700" fill="#3c5e6e">Steps</text>
    <text x="1335" y="282">1. Press <tspan font-weight="700" fill="#b87821">Hint</tspan> to reveal guide lines.</text>
    <text x="1335" y="304">2. Drag each label tile (or click to</text>
    <text x="1355" y="324">"pick up") onto its matching slot.</text>
    <text x="1335" y="346">3. Press <tspan font-weight="700" fill="#3e7c47">Check Answer</tspan> to see results.</text>
    <text x="1335" y="368">4. Press <tspan font-weight="700" fill="#a13e3e">Reset</tspan> to start over.</text>

    <text x="1335" y="408" font-weight="700" fill="#3c5e6e">Word Bank</text>
    <text x="1335" y="428" font-size="13" fill="#6b7c85">The 10 terms at the bottom are</text>
    <text x="1335" y="446" font-size="13" fill="#6b7c85">used exactly once each.</text>
  </g>

  <!-- Score / progress tracker (decorative) -->
  <g transform="translate(1335,460)">
    <rect x="0" y="0" width="410" height="44" rx="10" fill="#f4efe4" stroke="#c8bfa9"/>
    <text x="14" y="28" font-size="15" font-weight="700" fill="#3c5e6e">Parts identified:</text>
