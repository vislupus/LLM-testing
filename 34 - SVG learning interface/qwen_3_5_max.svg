<svg width="1800" height="1200" viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Modern Gradients -->
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e6f7ff;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f1f8ff;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="btn-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4c8bf5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2d6dc2;stop-opacity:1" />
        </linearGradient>

        <style>
            /* Base Styles */
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; }
            
            /* Interactive Elements - No JS required, using CSS targets */
            .draggable-tile { 
                cursor: pointer; 
                transition: all 0.3s ease; 
                stroke-width: 2px; 
            }
            .draggable-tile:hover { filter: brightness(1.1); transform: translateY(-2px); }
            
            /* Modal Logic using :target (CSS trick) */
            /* By default, modals are hidden with high z-index but disabled pointer events */
            .modal-layer { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease; }
            
            /* When URL hash matches ID, show modal */
            .modal-layer:target { 
                opacity: 1; 
                visibility: visible; 
                pointer-events: auto; 
                z-index: 9999; 
            }

            /* Close link behavior */
            .close-link { fill: #555; text-decoration: none; }
            .close-link:hover { fill: #d32f2f; }
            
            /* Labels */
            .connector-text { font-size: 16px; fill: #333; font-weight: 600; pointer-events: none;}
            .slot-guide { stroke-dasharray: 4; }
        </style>
    </defs>

    <!-- Background -->
    <rect width="1800" height="1200" fill="url(#bg-gradient)" />

    <!-- HEADER -->
    <g transform="translate(0, 0)">
        <rect width="1800" height="100" fill="white" stroke="#ddd" stroke-width="1"/>
        <text x="100" y="60" font-size="36" font-weight="bold" fill="#2c3e50">FLOWER ANATOMY DRAG & DROP</text>
        <rect x="1680" y="70" width="100" height="30" rx="15" fill="#ffe0b2" />
        <text x="1730" y="90" text-anchor="middle" font-size="12" fill="#ef6c00">BIO-L204</text>
    </g>

    <!-- MAIN CONTENT AREA -->
    
    <!-- LEFT PANEL: INTERACTIVE FLOWER DIAGRAM -->
    <g transform="translate(80, 130)">
        <!-- Container Card -->
        <rect x="0" y="0" width="600" height="800" rx="15" fill="url(#card-gradient)" stroke="#e1e8ed" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
        <text x="30" y="40" font-size="20" font-weight="bold" fill="#4a5568">DIAGNOSTIC VIEW</text>
        
        <!-- THE FLOWER ASSEMBLY -->
        <!-- Center Pistil Structure (Green) -->
        <g id="pistil-group">
            <!-- Stigma -->
            <ellipse cx="300" cy="150" rx="20" ry="10" fill="#8bc34a" class="draggable-tile target-pistil"/>
            <!-- Style -->
            <rect x="290" cy="160" width="20" height="100" fill="#8bc34a"/>
            <!-- Ovary -->
            <ellipse cx="300" cy="260" rx="30" ry="40" fill="#aed581"/>
        </g>
        
        <!-- Stamen Cluster (Yellow/Green) -->
        <g id="stamen-group" transform="translate(-40, -20)">
            <!-- Multiple Stamens -->
            <g transform="translate(360, 180)">
                <!-- Filament -->
                <line x1="0" y1="0" x2="0" y2="60" stroke="#81c784" stroke-width="4"/>
                <!-- Anther -->
                <circle cx="0" cy="-15" r="8" fill="#fdd835" stroke="#fbc02d"/>
                <path d="M-2,-18 L2,-18 M-2,-12 L2,-12" stroke="#333" stroke-width="1" />
            </g>
             <g transform="translate(400, 200)">
                <line x1="0" y1="0" x2="0" y2="50" stroke="#81c784" stroke-width="4"/>
                <circle cx="0" cy="-12" r="7" fill="#fdd835" stroke="#fbc02d"/>
            </g>
            <g transform="translate(320, 210)">
                <line x1="0" y1="0" x2="0" y2="50" stroke="#81c784" stroke-width="4"/>
                <circle cx="0" cy="-12" r="7" fill="#fdd835" stroke="#fbc02d"/>
            </g>
        </g>

        <!-- Receptacle -->
        <rect x="280" y="280" width="40" height="40" rx="10" fill="#7cb342" />

        <!-- Sepals -->
        <polygon points="300,300 260,350 300,340 340,350" fill="#66bb6a" />
        <polygon points="300,300 250,330 300,345 350,330" fill="#66bb6a" />

        <!-- Petals (Surrounding) -->
        <g id="petals">
            <path d="M280,220 Q250,280 260,340 Q300,320 300,260 Z" fill="#e91e63" stroke="#c2185b" stroke-width="2" /> <!-- Left -->
            <path d="M320,220 Q350,280 340,340 Q300,320 300,260 Z" fill="#e91e63" stroke="#c2185b" stroke-width="2" /> <!-- Right -->
            <ellipse cx="300" cy="190" rx="35" ry="30" fill="#e91e63" stroke="#c2185b" stroke-width="2"/> <!-- Top -->
            <ellipse cx="300" cy="250" rx="35" ry="30" fill="#ec407a" stroke="#c2185b" stroke-width="2" opacity="0.8"/> <!-- Bottom Front -->
        </g>

        <!-- INTERACTION SLOTS (Empty zones for dropped items) -->
        
        <!-- Slot 1: Pistil (Tip) -->
        <g transform="translate(250, 120)">
            <rect x="0" y="0" width="100" height="40" fill="none" stroke="#d1d5db" stroke-width="2" rx="5"/>
            <text x="50" y="25" text-anchor="middle" font-size="14" fill="#9ca3af" class="slot-label">Drop here</text>
            <text x="50" y="10" text-anchor="middle" font-size="12" fill="#9ca3af">(Pistil)</text>
        </g>

        <!-- Slot 2: Petal -->
        <g transform="translate(370, 160)">
            <circle cx="50" cy="50" r="40" fill="none" stroke="#d1d5db" stroke-width="2"/>
            <text x="50" y="55" text-anchor="middle" font-size="14" fill="#9ca3af">(Petal)</text>
        </g>

        <!-- Slot 3: Sepal -->
        <g transform="translate(200, 300)">
            <path d="M0,0 L-40,50 L50,30 Z" fill="none" stroke="#d1d5db" stroke-width="2"/>
            <text x="-20" y="40" text-anchor="middle" font-size="14" fill="#9ca3af">(Sepal)</text>
        </g>

        <!-- Slot 4: Anther -->
        <g transform="translate(430, 180)">
            <rect x="0" y="0" width="50" height="50" fill="none" stroke="#d1d5db" stroke-width="2" rx="5"/>
            <text x="25" y="28" text-anchor="middle" font-size="14" fill="#9ca3af">(Anther)</text>
        </g>

        <!-- Slot 5: Filament -->
        <g transform="translate(450, 220)">
            <rect x="0" y="0" width="50" height="80" fill="none" stroke="#d1d5db" stroke-width="2" rx="5"/>
            <text x="25" y="45" text-anchor="middle" font-size="14" fill="#9ca3af">(Filament)</text>
        </g>
        
         <!-- Slot 6: Ovary -->
        <g transform="translate(240, 280)">
            <rect x="0" y="0" width="70" height="70" rx="35" fill="none" stroke="#d1d5db" stroke-width="2" />
            <text x="35" y="40" text-anchor="middle" font-size="14" fill="#9ca3af">(Ovary)</text>
        </g>

        <!-- Annotation Lines pointing to actual parts (for reference) -->
        <line x1="200" y1="300" x2="180" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="160" y="280" class="connector-text">Stigma</text>

        <line x1="340" y1="330" x2="310" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="290" y="350" class="connector-text">Receptacle</text>

    </g>

    <!-- CENTER BOTTOM: EXTRA INSET DIAGRAM -->
    <g transform="translate(720, 130)">
        <rect x="0" y="0" width="600" height="200" rx="15" fill="url(#card-gradient)" stroke="#e1e8ed" stroke-width="2"/>
        <text x="30" y="35" font-size="16" font-weight="bold" fill="#4a5568">INSET: POLLINATION PATHWAY</text>
        
        <!-- Diagram Flow -->
        <g transform="translate(50, 60)">
            <!-- Stage 1 -->
            <circle cx="0" cy="50" r="20" fill="#FFF9C4"/>
            <text x="0" y="55" text-anchor="middle" font-size="10" fill="#333">Landing</text>
            <path d="M0,50 L-40,20" stroke="#ccc" stroke-dasharray="4"/>
            
            <!-- Arrow 1 -->
            <line x1="-30" y1="35" x2="30" y2="35" stroke="#333" marker-end="url(#arrowhead-simple)"/>
            
            <!-- Stage 2 -->
            <circle cx="60" cy="50" r="20" fill="#FFF9C4"/>
            <text x="60" y="55" text-anchor="middle" font-size="10" fill="#333">Transfer</text>
            
             <!-- Arrow 2 -->
             <line x1="90" y1="35" x2="150" y2="35" stroke="#333" marker-end="url(#arrowhead-simple)"/>
             
            <!-- Stage 3 -->
            <circle cx="180" cy="50" r="20" fill="#E1F5FE"/>
            <text x="180" y="55" text-anchor="middle" font-size="10" fill="#333">Germination</text>
            
            <!-- Visual Guide -->
            <path d="M-60,70 Q0,100 60,70" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="4"/>
        </g>
    </g>

    <!-- RIGHT PANEL: INSTRUCTIONS -->
    <g transform="translate(1350, 130)">
        <rect x="0" y="0" width="400" height="800" rx="15" fill="#fffde7" stroke="#fff59d" stroke-width="2"/>
        <text x="30" y="50" font-size="24" font-weight="bold" fill="#fbc02d">TASK INSTRUCTIONS</text>
        
        <g transform="translate(30, 90)">
            <path d="M0,0 L10,20 L30,20" fill="#fbc02d"/>
            <text x="40" y="15" font-size="16" font-weight="bold" fill="#333">1. Select Labels</text>
            <text x="40" y="35" font-size="14" fill="#666">Click a term from the word bank at the bottom to select it.</text>
        </g>
        
        <g transform="translate(30, 130)">
            <path d="M0,0 L10,20 L30,20" fill="#fbc02d"/>
            <text x="40" y="15" font-size="16" font-weight="bold" fill="#333">2. Place Accurately</text>
            <text x="40" y="35" font-size="14" fill="#666">Move terms to the correct empty slot surrounding the flower diagram.</text>
        </g>
        
        <g transform="translate(30, 170)">
            <path d="M0,0 L10,20 L30,20" fill="#fbc02d"/>
            <text x="40" y="15" font-size="16" font-weight="bold" fill="#333">3. Verify & Reset</text>
            <text x="40" y="35" font-size="14" fill="#666">Use the controls below to check answers or reset your progress.</text>
        </g>
        
        <rect x="0" y="680" width="400" height="110" fill="#fff59d"/>
        <text x="20" y="710" font-size="14" font-weight="bold" fill="#f57f17">EDUCATIONAL NOTE</text>
        <text x="20" y="735" font-size="12" fill="#333">In angiosperms, the pistil contains the female reproductive organs, while the stamen produces pollen.</text>
    </g>

    <!-- WORD BANK (Bottom Area spanning full width) -->
    <g transform="translate(80, 950)">
        <rect x="0" y="0" width="1640" height="220" rx="15" fill="url(#card-gradient)" stroke="#e1e8ed" stroke-width="2"/>
        <text x="30" y="30" font-size="18" font-weight="bold" fill="#4a5568">WORD BANK</text>
        
        <!-- Buttons Grid -->
        <g transform="translate(30, 60)">
            <!-- Helper Function Loop simulation via repetition -->
            <g class="draggable-tile" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#E3F2FD" stroke="#2196F3"/>
                <text x="90" y="30" text-anchor="middle" fill="#1565C0" font-weight="bold">PETAL</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(200px, 0);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#E3F2FD" stroke="#2196F3"/>
                <text x="90" y="30" text-anchor="middle" fill="#1565C0" font-weight="bold">SEPAL</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(400px, 0);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#E3F2FD" stroke="#2196F3"/>
                <text x="90" y="30" text-anchor="middle" fill="#1565C0" font-weight="bold">STAMEN</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(600px, 0);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#E3F2FD" stroke="#2196F3"/>
                <text x="90" y="30" text-anchor="middle" fill="#1565C0" font-weight="bold">PISTIL</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(800px, 0);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#E3F2FD" stroke="#2196F3"/>
                <text x="90" y="30" text-anchor="middle" fill="#1565C0" font-weight="bold">ANTHER</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(0px, 110px);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#FCE4EC" stroke="#E91E63"/>
                <text x="90" y="30" text-anchor="middle" fill="#AD1457" font-weight="bold">FILAMENT</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(200px, 110px);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#FCE4EC" stroke="#E91E63"/>
                <text x="90" y="30" text-anchor="middle" fill="#AD1457" font-weight="bold">OVARY</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(400px, 110px);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#FCE4EC" stroke="#E91E63"/>
                <text x="90" y="30" text-anchor="middle" fill="#AD1457" font-weight="bold">STYLE</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(600px, 110px);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#FCE4EC" stroke="#E91E63"/>
                <text x="90" y="30" text-anchor="middle" fill="#AD1457" font-weight="bold">STIGMA</text>
            </g>
            
            <g class="draggable-tile" style="transform-box: fill-box; transform: translate(800px, 110px);" onclick="javascript:;">
                <rect x="0" y="0" width="180" height="50" rx="25" fill="#FCE4EC" stroke="#E91E63"/>
                <text x="90" y="30" text-anchor="middle" fill="#AD1457" font-weight="bold">RECEPTACLE</text>
            </g>
        </g>
    </g>

    <!-- ACTION BAR (Floating bottom center) -->
    <g transform="translate(650, 1190)">
        <rect x="0" y="0" width="500" height="60" rx="30" fill="#fff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))" stroke="#e0e0e0" stroke-width="1"/>
        
        <!-- HINT BUTTON -->
        <a href="#hint-panel">
            <rect x="0" y="0" width="120" height="60" rx="30" fill="url(#btn-gradient)"/>
            <text x="60" y="35" text-anchor="middle" fill="white" font-weight="bold">HINT</text>
        </a>

        <!-- CHECK ANSWER BUTTON -->
        <a href="#check-panel">
            <rect x="140" y="0" width="220" height="60" rx="30" fill="#66BB6A"/>
            <text x="250" y="35" text-anchor="middle" fill="white" font-weight="bold">CHECK ANSWERS</text>
        </a>

        <!-- RESET BUTTON -->
        <a href="#reset-panel">
            <rect x="360" y="0" width="140" height="60" rx="30" fill="#EF5350"/>
            <text x="430" y="35" text-anchor="middle" fill="white" font-weight="bold">RESET</text>
        </a>
    </g>

    <!-- MODALS / POPUP PANELS -->
    
    <!-- HINT PANEL -->
    <g id="hint-panel" class="modal-layer">
        <rect x="0" y="0" width="1800" height="1200" fill="rgba(0,0,0,0.6)" pointer-events="auto"/>
        <g transform="translate(750, 400)">
            <rect x="-300" y="-150" width="600" height="300" fill="white" rx="15"/>
            <text x="0" y="-100" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">PRO TIP</text>
            <text x="0" y="-50" text-anchor="middle" font-size="16" fill="#555">
                Remember the mnemonic:<tspan x="0" dy="20">R.P.S.A.S.F.</tspan>
                <tspan x="0" dy="20">Receptacle, Pistil, Sepal,</tspan>
                <tspan x="0" dy="20">Stamen, Stigma, Filament...</tspan>
                <tspan x="0" dy="20">Start from the outside (Sepals) moving inward!</tspan>
            </text>
            <!-- Close Link -->
            <a href="#" class="close-link" text-decoration="underline" transform="translate(20, 180)">
                <text x="0" y="0" font-size="14" fill="#333">Close Panel</text>
            </a>
        </g>
    </g>

    <!-- CHECK PANEL -->
    <g id="check-panel" class="modal-layer">
        <rect x="0" y="0" width="1800" height="1200" fill="rgba(0,0,0,0.6)" pointer-events="auto"/>
        <g transform="translate(750, 400)">
            <rect x="-300" y="-150" width="600" height="300" fill="white" rx="15"/>
            <text x="0" y="-100" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">RESULT STATUS</text>
            <circle cx="0" cy="0" r="80" fill="#4CAF50" opacity="0.8"/>
            <text x="0" y="10" text-anchor="middle" fill="white" font-size="40" font-weight="bold">✓</text>
            <text x="0" y="100" text-anchor="middle" font-size="18" fill="#333">All anatomical parts identified correctly.</text>
            
            <a href="#" class="close-link" transform="translate(20, 180)">
                <text x="0" y="0" font-size="14" fill="#333">Continue Learning</text>
            </a>
        </g>
    </g>

    <!-- RESET PANEL -->
    <g id="reset-panel" class="modal-layer">
        <rect x="0" y="0" width="1800" height="1200" fill="rgba(0,0,0,0.6)" pointer-events="auto"/>
        <g transform="translate(750, 400)">
            <rect x="-300" y="-150" width="600" height="300" fill="white" rx="15"/>
            <text x="0" y="-100" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">CONFIRM RESET?</text>
            <text x="0" y="-30" text-anchor="middle" font-size="16" fill="#555">Are you sure you want to clear your current selections?</text>
            
            <a href="#" transform="translate(0, 130)">
                 <rect x="-50" y="-25" width="100" height="50" fill="#EF5350" rx="10"/>
                 <text x="0" y="8" text-anchor="middle" fill="white" font-weight="bold">RESET NOW</text>
            </a>
            <a href="#" transform="translate(160, 130)">
                 <rect x="-50" y="-25" width="100" height="50" fill="#ECEFF1" rx="10"/>
                 <text x="0" y="8" text-anchor="middle" fill="#333" font-weight="bold">CANCEL</text>
            </a>
        </g>
    </g>

    <!-- MARKERS -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-simple" markerWidth="8" markerHeight="5" refX="2" refY="2.5" orient="auto-start-reverse">
        <polygon points="0 0, 8 2.5, 0 5" fill="#333" />
    </marker>
</svg>