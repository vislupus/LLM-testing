<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ray Tracing Simulation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#080808;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(8,8,20,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:7px 22px;
  text-align:center;font-size:13px;font-weight:600;letter-spacing:.8px;
  color:#fff;text-shadow:0 0 8px rgba(255,255,255,.08)}
#panel{position:fixed;top:58px;right:14px;z-index:10;
  background:rgba(8,8,20,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;
  width:260px;max-height:calc(100vh - 80px);overflow-y:auto}
#panel::-webkit-scrollbar{width:4px}
#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
#panel h3{font-size:13px;font-weight:700;margin:0 0 10px;color:#9ab;text-align:center;letter-spacing:1px}
.g{margin-bottom:10px}
.g label{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:3px;color:rgba(255,255,255,.55)}
.g label b{color:#5ce;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
  background:rgba(255,255,255,.1);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;background:#5ce;cursor:pointer;
  box-shadow:0 0 5px rgba(92,238,238,.4)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#5ce;cursor:pointer;border:none}
input[type=color]{-webkit-appearance:none;appearance:none;width:28px;height:20px;border:1px solid #333;
  border-radius:4px;padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
input[type=color]::-webkit-color-swatch{border-radius:3px;border:none}
.btn{background:rgba(92,238,238,.12);color:#5ce;border:1px solid rgba(92,238,238,.25);
  border-radius:6px;padding:4px 10px;font-size:10.5px;cursor:pointer;transition:background .2s}
.btn:hover{background:rgba(92,238,238,.28)}
.btn.on{background:rgba(92,238,238,.35);border-color:#5ce}
.cr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cr label{flex:1;font-size:10.5px;margin-bottom:0}
.sep{border-top:1px solid rgba(255,255,255,.07);margin:10px 0}
#info{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.2);font-size:9.5px;pointer-events:none;z-index:10;text-align:center}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#080808;z-index:100;font-size:14px;color:rgba(255,255,255,.4);transition:opacity .5s}
</style>
</head>
<body>
<div id="loading">Initializing ray tracing engine…</div>
<canvas id="c"></canvas>
<div id="hud">🔍 Real-Time Ray Tracing</div>
<div id="panel">
  <h3>🔵 SPHERE 1</h3>
  <div class="g"><label><span>Metalness</span><b id="v1m">1.00</b></label>
    <input type="range" id="s1m" min="0" max="100" value="100"></div>
  <div class="g"><label><span>Roughness</span><b id="v1r">0.05</b></label>
    <input type="range" id="s1r" min="0" max="100" value="5"></div>
  <div class="cr"><label>Color</label><input type="color" id="c1" value="#dddddd">
    <button class="btn" id="reset1">Default</button></div>
  <div class="sep"></div>
  <h3>🔴 SPHERE 2</h3>
  <div class="g"><label><span>Metalness</span><b id="v2m">0.85</b></label>
    <input type="range" id="s2m" min="0" max="100" value="85"></div>
  <div class="g"><label><span>Roughness</span><b id="v2r">0.20</b></label>
    <input type="range" id="s2r" min="0" max="100" value="20"></div>
  <div class="cr"><label>Color</label><input type="color" id="c2" value="#d4a040">
    <button class="btn" id="reset2">Default</button></div>
  <div class="sep"></div>
  <h3>🌍 SCENE</h3>
  <div class="g"><label><span>Time of Day</span><b id="vt">0.70</b></label>
    <input type="range" id="st" min="0" max="100" value="70"></div>
  <div class="g"><label><span>Atmosphere</span><b id="vf">0.15</b></label>
    <input type="range" id="sf" min="0" max="100" value="15"></div>
  <div class="g"><label><span>Bounce Quality</span><b id="vb">2</b></label>
    <input type="range" id="sb" min="1" max="4" value="2" step="1"></div>
  <div class="sep"></div>
  <div class="cr"><label>Auto Orbit</label>
    <button class="btn on" id="bOrbit">ON</button></div>
</div>
<div id="info">Click & drag to orbit · Scroll to zoom · Shader runs per-fragment on screen-space spheres</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<!-- ═══════════════ SHADERS ═══════════════ -->
<script id="rtVS" type="x-shader/x-vertex">
precision highp float;
attribute vec3 position;
uniform mat4 world;
uniform mat4 worldViewProjection;
varying vec3 vWPos;
varying vec3 vWDir;
void main(){
  vWPos=(world*vec4(position,1.0)).xyz;
  vWDir=normalize(vWPos);
  gl_Position=worldViewProjection*vec4(position,1.0);
}
</script>

<script id="rtFS" type="x-shader/x-fragment">
precision highp float;

uniform float uTime;
uniform vec3 uCamPos;
uniform float uTOD;
uniform float uFog;
uniform float uMaxB;
uniform float uM1,uR1; uniform vec3 uCol1; uniform vec3 uSP1; uniform float uSR1;
uniform float uM2,uR2; uniform vec3 uCol2; uniform vec3 uSP2; uniform float uSR2;

varying vec3 vWPos;
varying vec3 vWDir;

#define PI 3.14159265359
#define MAXD 1000.0

float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453123);}

/* ═══ RAY-GEOMETRY ═══ */
float sphI(vec3 ro,vec3 rd,vec3 c,float r){
  vec3 oc=ro-c; float b=dot(oc,rd); float a=dot(rd,rd);
  float h=b*b-a*(dot(oc,oc)-r*r);
  if(h<0.0)return MAXD; h=sqrt(h);
  float t=(-b-h)/a; if(t>0.001)return t;
  t=(-b+h)/a; return t>0.001?t:MAXD;
}
float plnI(vec3 ro,vec3 rd,float y){float t=(y-ro.y)/rd.y;return t>0.001?t:MAXD;}

/* ═══ PBR HELPERS ═══ */
float dGGX(vec3 N,vec3 H,float r){float a=r*r;float a2=a*a;float d=max(dot(N,H),0.0);float d2=d*d;
  float denom=d2*(a2-1.0)+1.0;return a2/(PI*denom*denom);}
float gSch(vec3 N,vec3 V,vec3 L,float r){float k=(r+1.0)*(r+1.0)/8.0;
  float nv=max(dot(N,V),0.0);float nl=max(dot(N,L),0.0);
  return(nv/(nv*(1.0-k)+k))*(nl/(nl*(1.0-k)+k));}
vec3 fSch(float cosT,vec3 F0){return F0+(1.0-F0)*pow(clamp(1.0-cosT,0.0,1.0),5.0);}

vec3 shade(vec3 p,vec3 rd,vec3 n,float mt,float rn,vec3 alb,vec3 lp,vec3 vd){
  vec3 L=normalize(lp-p);
  vec3 H=normalize(vd+L);
  vec3 F0=mix(vec3(0.04),alb,mt);
  float D=dGGX(n,H,rn);
  float G=gSch(n,vd,L,rn);
  vec3 F=fSch(max(dot(H,vd),0.0),F0);
  vec3 spec=D*G*F/(4.0*max(dot(n,vd),0.0)*max(dot(n,L),0.0)+0.001);
  vec3 kD=(1.0-F)*(1.0-mt);
  float nl=max(dot(n,L),0.0);
  return(kD*alb/PI+spec)*nl*2.8;
}

/* ═══ SHADOW ═══ */
float shadow(vec3 sp,vec3 lp,vec3 sp1,float sr1,vec3 sp2,float sr2){
  vec3 ld=normalize(lp-sp); float d1=sphI(sp,ld,sp1,sr1);
  float d2=sphI(sp,ld,sp2,sr2);
  return(min(d1,d2)<MAXD)?0.12:1.0;
}

/* ═══ REFLECTION ═══ */
vec3 skyCol(vec3 d){
  float t=clamp(d.y*0.5+0.5,0.0,1.0);
  return mix(vec3(0.75,0.70,0.65),vec3(0.18,0.30,0.55),t);
}

vec3 reflGrad(vec3 ro,vec3 rd,float rn,vec3 alb,vec3 sp1,float sr1,vec3 sp2,float sr2,vec3 lp){
  vec3 tot=vec3(0.0); float wei=1.0;
  for(int b=0;b<4;b++){ if(float(b)>=uMaxB)break;
    float dt1=sphI(ro,rd,sp1,sr1); float dt2=sphI(ro,rd,sp2,sr2);
    float dt=plnI(ro,rd,0.0); float mt=MAXD; int hit=0;
    if(dt1<mt){mt=dt1;hit=1;} if(dt2<mt){mt=dt2;hit=2;} if(dt<mt){mt=dt;hit=3;}
    if(hit==0||mt>=MAXD){tot+=skyCol(rd)*wei; break;}
    vec3 hp=ro+rd*mt; vec3 vd=-rd; vec3 hn;
    if(hit==1)hn=normalize(hp-sp1); else if(hit==2)hn=normalize(hp-sp2);
    else{ hn=vec3(0,1,0); float bx=hash(floor(hp*6.0+100.0));
      if(abs(hp.x)>3.8&&abs(hp.x)<4.2)bx=0.3;
      tot+=alb*bx*shadow(hp,lp,sp1,sr1,sp2,sr2)*wei*0.4;
      tot+=skyCol(rd)*0.05*wei; break; }
    if(dot(hn,rd)>0.0)hn=-hn;
    vec3 H=normalize(vd+hn);
    vec3 F0=mix(vec3(0.04),alb,0.9);
    float fr=pow(1.0-max(dot(hn,vd),0.0),4.0);
    vec3 F=mix(F0,vec3(1.0),fr);
    tot+=shade(hp,rd,hn,0.95,rn*0.6,alb,lp,vd)*shadow(hp,lp,sp1,sr1,sp2,sr2)*wei*0.7;
    vec3 refl=normalize(reflect(-vd,hn)+(vec3(hash(rd*100.0+float(b)),hash(rd*200.0+float(b)),hash(rd*300.0+float(b)))-0.5)*rn*0.35);
    ro=hp+hn*0.02; rd=refl; wei*=F.x*0.75;
  }
  return tot;
}

/* ═══ MAIN ═══ */
void main(){
  vec3 o=uCamPos; vec3 dir=normalize(vWPos-o);
  float dt1=sphI(o,dir,uSP1,uSR1);
  float dt2=sphI(o,dir,uSP2,uSR2);
  float dt=plnI(o,dir,0.0);
  float mt=MAXD; int ht=0;
  if(dt1<mt){mt=dt1;ht=1;} if(dt2<mt){mt=dt2;ht=2;} if(dt<mt){mt=dt;ht=3;}

  if(ht==0){
    float t=clamp(dir.y*0.5+0.5,0.0,1.0);
    vec3 hz=mix(vec3(0.85,0.78,0.72),vec3(0.28,0.42,0.62),t);
    vec3 az=mix(vec3(0.10,0.14,0.25),vec3(0.04,0.07,0.16),t);
    vec3 c=mix(hz,az,t);
    vec3 sd=normalize(vec3(0.45,0.72,-0.55));
    float sun=pow(max(dot(dir,sd),0.0),400.0);
    c+=vec3(2.5,2.3,1.8)*sun;
    if(dir.y>0.0){float st=hash(floor(dir*400.0));
      if(st>0.997)c+=vec3(0.35)*(st-0.997)*400.0;}
    c=mix(c,vec3(0.03,0.03,0.08),uFog);
    gl_FragColor=vec4(c,1.0); return;
  }

  vec3 hp=o+dir*mt; vec3 vd=-dir;
  vec3 hn;
  if(ht==1)hn=normalize(hp-uSP1);
  else if(ht==2)hn=normalize(hp-uSP2);
  else hn=vec3(0,1,0);

  float mt2,rn2; vec3 col2;
  if(ht==1){mt2=uM1;rn2=uR1;col2=uCol1;}
  else if(ht==2){mt2=uM2;rn2=uR2;col2=uCol2;}
  else{mt2=0.0;rn2=0.65;col2=vec3(0.32);}

  vec3 lp=vec3(4.0*cos(uTOD*PI),4.0+5.0*sin(uTOD*PI),-5.0);
  vec3 col=shade(hp,dir,hn,mt2,rn2,col2,lp,vd);
  col*=shadow(hp,lp,uSP1,uSR1,uSP2,uSR2);

  if(ht<=2){vec3 ref=normalize(reflect(-vd,hn)+(vec3(hash(dir*50.0),hash(dir*70.0),hash(dir*90.0))-0.5)*rn2*0.02);
    col+=reflGrad(hp+hn*0.02,ref,rn2,col2,uSP1,uSR1,uSP2,uSR2,lp)*mt2*0.85;
    col+=skyCol(ref)*(1.0-mt2)*0.12;}

  if(ht==3){float bx=hash(floor(hp*6.0+100.0));
    if(abs(hp.x)>3.8&&abs(hp.x)<4.2)bx=0.3;
    col+=col2*bx*0.4;
    vec3 rf=normalize(reflect(-vd,hn)+(vec3(hash(dir*33.0),hash(dir*66.0),hash(dir*99.0))-0.5)*0.15);
    col+=reflGrad(hp+hn*0.02,rf,0.15,col2,uSP1,uSR1,uSP2,uSR2,lp)*0.22;}

  col=pow(max(col,vec3(0)),vec3(0.4545));
  col=col/(col+0.85)*1.35;
  float fog=exp(-mt*0.018);
  col=mix(vec3(0.025,0.03,0.06),col,fog*(1.0-uFog*0.5));

  gl_FragColor=vec4(col,1.0);
}
</script>

<script>
(function(){
'use strict';

/* ═══════════════ CONFIG ═══════════════ */
var CFG={
  s1:{mt:1,rn:.05,rgb:[.87,.87,.87],pos:[-2.8,2.9,0],rad:2.2},
  s2:{mt:.85,rn:.20,rgb:[.83,.63,.25],pos:[ 2.8,2.9,0],rad:2.0},
  tod:.7, fog:.15, bounces:2, orbit:true
};
var SC=hexRGB(CFG.s1.rgb), DC=hexRGB(CFG.s2.rgb);
function hexRGB(h){return{r:h[0],g:h[1],b:h[2]};}

/* ═══════════════ ENGINE ═══════════════ */
var canvas=document.getElementById('c');
var engine=new BABYLON.Engine(canvas,true,{stencil:true},true);
var scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.025,.025,.055,1);
scene.ambientColor=new BABYLON.Color3(.06,.06,.1);

/* camera */
var cam=new BABYLON.ArcRotateCamera("cam",-1.15,1.12,16,new BABYLON.Vector3(0,2.6,0),scene);
cam.attachControl(canvas,true);
cam.lowerRadiusLimit=5;cam.upperRadiusLimit=50;cam.wheelPrecision=14;
cam.lowerBetaLimit=.1;cam.upperBetaLimit=1.5;cam.maxZ=300;

/* lights */
var sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-.5,-1.2,-.8).normalize(),scene);
sun.intensity=1.4;sun.diffuse=new BABYLON.Color3(1,.96,.88);
var hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=.35;hemi.groundColor=new BABYLON.Color3(.04,.05,.1);
var fill=new BABYLON.PointLight("fill",new BABYLON.Vector3(-3,6,-2),scene);
fill.intensity=.3;fill.range=20;fill.diffuse=new BABYLON.Color3(.5,.6,1);

/* shadows */
var shg=new BABYLON.ShadowGenerator(1024,sun);
shg.useBlurExponentialShadowMap=true;shg.blurKernel=16;shg.setDarkness(.3);

/* ═══════════════ BUILD STREET ═══════════════ */
function buildStreet(){
  /* ground */
  var gnd=new BABYLON.StandardMaterial("gndM",scene);
  gnd.diffuseColor=new BABYLON.Color3(.28,.28,.28);
  gnd.specularColor=new BABYLON.Color3(.15,.15,.15);
  gnd.roughness=.7;
  var gr=BABYLON.MeshBuilder.CreateGround("gnd",{width:40,height:30},scene);
  gr.material=gnd;gr.receiveShadows=true;

  /* road */
  var rd=new BABYLON.StandardMaterial("rdM",scene);
  rd.diffuseColor=new BABYLON.Color3(.12,.12,.13);rd.specularColor=new BABYLON.Color3(.08,.08,.08);
  var road=BABYLON.MeshBuilder.CreateBox("road",{width:8,height:.04,depth:30},scene);
  road.position.y=.02;road.material=rd;road.receiveShadows=true;

  /* lane markings */
  for(var z=-13;z<=13;z+=2.2){
    var mk=BABYLON.MeshBuilder.CreateBox("mk",{width:.12,height:.05,depth:1},scene);
    mk.position.set(0,.03,z);mk.material=new BABYLON.StandardMaterial("mkM",scene);
    mk.material.diffuseColor=new BABYLON.Color3(.75,.7,.35);mk.material.emissiveColor=new BABYLON.Color3(.12,.1,.04);
  }

  /* sidewalks */
  [-5.2,5.2].forEach(function(x,i){
    var sw=new BABYLON.MeshBuilder.CreateBox("sw"+i,{width:2.2,height:.22,depth:30},scene);
    sw.position.set(x,.11,0);sw.receiveShadows=true;
    var swM=new BABYLON.StandardMaterial("swM"+i,scene);
    swM.diffuseColor=new BABYLON.Color3(.5,.49,.47);sw.material=swM;
  });

  /* buildings */
  [-1,1].forEach(function(side){
    for(var i=0;i<10;i++){
      var h=3.5+Math.random()*9, w=2.8+Math.random()*3.8, d=2.8+Math.random()*4.8;
      var bd=new BABYLON.MeshBuilder.CreateBox("bd",{width:w,height:h,depth:d},scene);
      bd.position.set(side*(8.5+Math.random()*5),h*.5,-13+i*3.3+Math.random()*1.2);
      bd.receiveShadows=true;shg.addShadowCaster(bd);

      /* window texture */
      var cv=document.createElement("canvas");cv.width=64;cv.height=128;
      var cx=cv.getContext("2d");
      var br=.35+Math.random()*.35;
      cx.fillStyle="rgb("+((125*br)|0)+","+((130*br)|0)+","+((140*br)|0)+")";
      cx.fillRect(0,0,64,128);
      for(var wy=5;wy<125;wy+=13)for(var wx=4;wx<60;wx+=11){
        var lit=Math.random()>.3;
        cx.fillStyle=lit?"rgb("+(200+Math.random()*55|0)+","+(185+Math.random()*45|0)+","+(125+Math.random()*75|0)+")":"rgb(22,24,32)";
        cx.fillRect(wx,wy,8,9);
      }
      var bwt=new BABYLON.DynamicTexture("bwT"+i+side,{width:64,height:128},scene,false);
      bwt.getContext().drawImage(cv,0,0);bwt.update();
      var bm=new BABYLON.StandardMaterial("bm"+i+side,scene);
      bm.diffuseTexture=bwt;bm.emissiveColor=new BABYLON.Color3(.06,.06,.08);
      bd.material=bm;
    }
  });

  /* street lamps */
  for(var li=-2;li<=2;li++){
    var lpX=6.2, lpZ=li*6;
    var pole=new BABYLON.MeshBuilder.CreateCylinder("pl",{height:5.5,diameterTop:.06,diameterBottom:.12,tessellation:6},scene);
    pole.position.set(lpX,2.75,lpZ);
    var poleM=new BABYLON.StandardMaterial("plM",scene);poleM.diffuseColor=new BABYLON.Color3(.35,.35,.38);pole.material=poleM;

    var arm=BABYLON.MeshBuilder.CreateBox("arm",{width:1.2,height:.06,depth:.06},scene);
    arm.position.set(lpX-.6,5.3,lpZ);arm.material=poleM;

    var bulb=new BABYLON.MeshBuilder.CreateSphere("blb",{diameter:.28,segments:6},scene);
    bulb.position.set(lpX-1.1,5.2,lpZ);
    var blbM=new BABYLON.StandardMaterial("blbM",scene);
    blbM.emissiveColor=new BABYLON.Color3(2.2,1.9,1.0);blbM.disableLighting=true;bulb.material=blbM;

    var plL=new BABYLON.PointLight("plL"+li,new BABYLON.Vector3(lpX-1.1,4.8,lpZ),scene);
    plL.intensity=.5;plL.range=13;plL.diffuse=new BABYLON.Color3(1,.9,.65);

    /* matching lamp on other side */
    var lpX2=-6.2;
    var pole2=pole.clone("pl2");pole2.position.x=lpX2;
    var arm2=arm.clone("arm2");arm2.position.x=lpX2+.6;
    var bulb2=bulb.clone("blb2");bulb2.position.x=lpX2+1.1;
    var plL2=new BABYLON.PointLight("plL2"+li,new BABYLON.Vector3(lpX2+1.1,4.8,lpZ),scene);
    plL2.intensity=.5;plL2.range=13;plL2.diffuse=new BABYLON.Color3(1,.9,.65);
  }

  /* trees */
  for(var ti=0;ti<12;ti++){
    var tx=ti<6?6.8+Math.random()*.5:-6.8-Math.random()*.5;
    var tz=-12+ti*2.2+Math.random();
    var trunk=new BABYLON.MeshBuilder.CreateCylinder("tk",{height:2.8,diameterTop:.1,diameterBottom:.22,tessellation:6},scene);
    trunk.position.set(tx,1.4,tz);
    var tkM=new BABYLON.StandardMaterial("tkM",scene);tkM.diffuseColor=new BABYLON.Color3(.28,.2,.1);trunk.material=tkM;shg.addShadowCaster(trunk);

    var foliage=new BABYLON.MeshBuilder.CreateSphere("fl",{diameter:2+Math.random(),segments:6},scene);
    foliage.position.set(tx,3.3+Math.random()*.3,tz);
    var flM=new BABYLON.StandardMaterial("flM",scene);flM.diffuseColor=new BABYLON.Color3(.1,.35,.08);foliage.material=flM;shg.addShadowCaster(foliage);
  }

  /* parked cars */
  function mkCar(x,z,col){
    var carM=new BABYLON.StandardMaterial("carM",scene);carM.diffuseColor=col;
    var body=BABYLON.MeshBuilder.CreateBox("carB",{width:1.6,height:.55,depth:3.2},scene);
    body.position.set(x,.4,z);body.material=carM;body.receiveShadows=true;shg.addShadowCaster(body);
    var cab=BABYLON.MeshBuilder.CreateBox("cab",{width:1.3,height:.42,depth:1.6},scene);
    cab.position.set(x,.84,z);cab.material=carM;shg.addShadowCaster(cab);
    var glassM=new BABYLON.StandardMaterial("gl",scene);glassM.diffuseColor=new BABYLON.Color3(.45,.6,.72);glassM.alpha=.6;
    var glass=BABYLON.MeshBuilder.CreateBox("gl",{width:1.25,height:.38,depth:.04},scene);
    glass.position.set(x,.84,z+.78);glass.material=glassM;

    /* headlights */
    [-.5,.5].forEach(function(ox){
      var hl=BABYLON.MeshBuilder.CreateSphere("hl",{diameter:.18,segments:4},scene);
      hl.position.set(x+ox,.3,z+1.55);
      var hlM=new BABYLON.StandardMaterial("hlM",scene);hlM.emissiveColor=new BABYLON.Color3(2,1.9,1.2);hlM.disableLighting=true;hl.material=hlM;
    });
  }
  mkCar(3.5,3,new BABYLON.Color3(.72,.12,.12));
  mkCar(-3.2,-1,new BABYLON.Color3(.18,.28,.68));
  mkCar(3.8,-6,new BABYLON.Color3(.22,.55,.25));
  mkCar(-3.5,7,new BABYLON.Color3(.88,.88,.88));

  /* distant backdrop buildings */
  for(var bi=0;bi<20;bi++){
    var bh=12+Math.random()*30, bw=4+Math.random()*8, bd2=4+Math.random()*8;
    var bb=BABYLON.MeshBuilder.CreateBox("bb"+bi,{width:bw,height:bh,depth:bd2},scene);
    var angle=Math.random()*Math.PI*2;var dist=28+Math.random()*15;
    bb.position.set(Math.cos(angle)*dist,bh*.5,Math.sin(angle)*dist);
    var bbM=new BABYLON.StandardMaterial("bbM"+bi,scene);
    bbM.diffuseColor=new BABYLON.Color3(.06,.06,.08);bbM.emissiveColor=new BABYLON.Color3(.02,.02,.04);
    bb.material=bbM;
  }
}

/* ═══════════════ SHADER MATERIAL ═══════════════ */
function mkRayMat(name,pos,rad,rgb,mt,rn){
  BABYLON.Effect.ShadersStore[name+"VertexShader"]=document.getElementById("rtVS").textContent;
  BABYLON.Effect.ShadersStore[name+"FragmentShader"]=document.getElementById("rtFS").textContent;

  var sm=new BABYLON.ShaderMaterial(name,scene,
    {vertex:name,fragment:name},
    {attributes:["position"],
     uniforms:["world","worldViewProjection","worldView","view","projection",
               "uTime","uCamPos","uTOD","uFog","uMaxB",
               "uSP1","uSR1","uM1","uR1","uCol1",
               "uSP2","uSR2","uM2","uR2","uCol2"]});

  sm.setFloat("uTime",0);
  sm.setVector3("uCamPos",cam.position.clone());
  sm.setFloat("uTOD",CFG.tod);
  sm.setFloat("uFog",CFG.fog);
  sm.setFloat("uMaxB",CFG.bounces);
  sm.setVector3("uSP1",new BABYLON.Vector3(CFG.s1.pos[0],CFG.s1.pos[1],CFG.s1.pos[2]));
  sm.setFloat("uSR1",CFG.s1.rad);
  sm.setFloat("uM1",CFG.s1.mt);
  sm.setFloat("uR1",CFG.s1.rn);
  sm.setColor3("uCol1",new BABYLON.Color3(SC.r,SC.g,SC.b));
  sm.setVector3("uSP2",new BABYLON.Vector3(CFG.s2.pos[0],CFG.s2.pos[1],CFG.s2.pos[2]));
  sm.setFloat("uSR2",CFG.s2.rad);
  sm.setFloat("uM2",CFG.s2.mt);
  sm.setFloat("uR2",CFG.s2.rn);
  sm.setColor3("uCol2",new BABYLON.Color3(DC.r,DC.g,DC.b));

  sm.backFaceCulling=false;
  sm.alphaMode=BABYLON.Engine.ALPHA_DISABLE;
  return sm;
}

/* ═══════════════ SPHERES ═══════════════ */
var sph1,sph2,mat1,mat2;

function createSpheres(){
  mat1=mkRayMat("rt1",CFG.s1.pos,CFG.s1.rad,SC,CFG.s1.mt,CFG.s1.rn);
  sph1=BABYLON.MeshBuilder.CreateSphere("s1",{diameter:CFG.s1.rad*2.04,segments:48},scene);
  sph1.position.set(CFG.s1.pos[0],CFG.s1.pos[1],CFG.s1.pos[2]);
  sph1.material=mat1;

  mat2=mkRayMat("rt2",CFG.s2.pos,CFG.s2.rad,DC,CFG.s2.mt,CFG.s2.rn);
  sph2=BABYLON.MeshBuilder.CreateSphere("s2",{diameter:CFG.s2.rad*2.04,segments:48},scene);
  sph2.position.set(CFG.s2.pos[0],CFG.s2.pos[1],CFG.s2.pos[2]);
  sph2.material=mat2;
}

/* ═══════════════ UI ═══════════════ */
function wireUI(){
  function bind(slider,valId,fmt,set){
    var el=document.getElementById(slider);
    el.oninput=function(){var v=parseFloat(el.value);document.getElementById(valId).textContent=fmt(v);set(v);};
  }
  bind("s1m","v1m",function(v){return(v/100).toFixed(2);},function(v){CFG.s1.mt=v/100;mat1.setFloat("uM1",CFG.s1.mt);});
  bind("s1r","v1r",function(v){return(v/100).toFixed(2);},function(v){CFG.s1.rn=v/100;mat1.setFloat("uR1",CFG.s1.rn);});
  bind("s2m","v2m",function(v){return(v/100).toFixed(2);},function(v){CFG.s2.mt=v/100;mat2.setFloat("uM2",CFG.s2.mt);});
  bind("s2r","v2r",function(v){return(v/100).toFixed(2);},function(v){CFG.s2.rn=v/100;mat2.setFloat("uR2",CFG.s2.rn);});
  bind("st","vt",function(v){return(v/100).toFixed(2);},function(v){
    CFG.tod=v/100;mat1.setFloat("uTOD",CFG.tod);mat2.setFloat("uTOD",CFG.tod);
    sun.position.set(4*Math.cos(CFG.tod*Math.PI),4+5*Math.sin(CFG.tod*Math.PI),-5);
    sun.intensity=.3+1.4*Math.sin(CFG.tod*Math.PI);
  });
  bind("sf","vf",function(v){return(v/100).toFixed(2);},function(v){CFG.fog=v/100;mat1.setFloat("uFog",CFG.fog);mat2.setFloat("uFog",CFG.fog);});
  bind("sb","vb",function(v){return Math.round(v).toString();},function(v){CFG.bounces=Math.round(v);mat1.setFloat("uMaxB",CFG.bounces);mat2.setFloat("uMaxB",CFG.bounces);});

  document.getElementById("c1").oninput=function(e){
    SC=hexFromStr(e.target.value);mat1.setColor3("uCol1",new BABYLON.Color3(SC.r,SC.g,SC.b));};
  document.getElementById("c2").oninput=function(e){
    DC=hexFromStr(e.target.value);mat2.setColor3("uCol2",new BABYLON.Color3(DC.r,DC.g,DC.b));};

  document.getElementById("reset1").onclick=function(){
    SC=hexRGB(CFG.s1.rgb);document.getElementById("c1").value=rgbStr(SC);
    mat1.setColor3("uCol1",new BABYLON.Color3(SC.r,SC.g,SC.b));
    CFG.s1.mt=1;CFG.s1.rn=.05;document.getElementById("s1m").value=100;document.getElementById("s1r").value=5;
    document.getElementById("v1m").textContent="1.00";document.getElementById("v1r").textContent="0.05";
    mat1.setFloat("uM1",1);mat1.setFloat("uR1",.05);};

  document.getElementById("reset2").onclick=function(){
    DC=hexRGB(CFG.s2.rgb);document.getElementById("c2").value=rgbStr(DC);
    mat2.setColor3("uCol2",new BABYLON.Color3(DC.r,DC.g,DC.b));
    CFG.s2.mt=.85;CFG.s2.rn=.2;document.getElementById("s2m").value=85;document.getElementById("s2r").value=20;
    document.getElementById("v2m").textContent="0.85";document.getElementById("v2r").textContent="0.20";
    mat2.setFloat("uM2",.85);mat2.setFloat("uR2",.2);};

  document.getElementById("bOrbit").onclick=function(){
    CFG.orbit=!CFG.orbit;this.textContent=CFG.orbit?"ON":"OFF";this.classList.toggle("on",CFG.orbit);};
}

function hexFromStr(s){return{r:parseInt(s.substr(1,2),16)/255,g:parseInt(s.substr(3,2),16)/255,b:parseInt(s.substr(5,2),16)/255};}
function rgbStr(c){return"#"+[c.r,c.g,c.b].map(function(v){return("0"+Math.round(v*255).toString(16)).slice(-2)}).join("");}

/* ═══════════════ INIT ═══════════════ */
buildStreet();
createSpheres();
wireUI();
sun.position.set(4*Math.cos(CFG.tod*Math.PI),4+5*Math.sin(CFG.tod*Math.PI),-5);

/* ═══════════════ RENDER ═══════════════ */
var time=0, startTime=performance.now();
var lastCursorInhibit=0;

engine.runRenderLoop(function(){
  time=(performance.now()-startTime)/1000;
  var dt=engine.getDeltaTime()/1000;

  /* update shader uniforms */
  [mat1,mat2].forEach(function(m){
    m.setFloat("uTime",time);
    m.setVector3("uCamPos",cam.position.clone());
  });

  /* auto orbit */
  if(CFG.orbit&&!scene.activeCamera._dragActive){
    cam.alpha+=.003;
  }

  /* gentle sphere bob */
  sph1.position.y=CFG.s1.pos[1]+Math.sin(time*.7)*.25;
  sph2.position.y=CFG.s2.pos[1]+Math.sin(time*.9+1.5)*.2;
  mat1.setVector3("uSP1",sph1.position.clone());
  mat2.setVector3("uSP2",sph2.position.clone());

  /* flicker lamps */
  scene.meshes.forEach(function(m){
    if(m.name&&m.name==="blbM"&&m.material){
      /* skip — these are material names not mesh names */
    }
  });

  scene.render();
});

window.addEventListener('resize',function(){engine.resize();});

/* hide loading */
setTimeout(function(){
  var ld=document.getElementById("loading");
  ld.style.opacity="0";
  setTimeout(function(){ld.style.display="none";},600);
},1200);

})();
</script>
