<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Ray Tracing Simulation - Metallic Spheres</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel-bg: rgba(15, 15, 25, 0.92);
            --text: #e0e0e0;
            --accent: #ff9e00;
            --slider-track: #2a2a4a;
            --border: rgba(255, 255, 255, 0.12);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #ui-panel {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 18px 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 260px;
            max-width: 90vw;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            color: var(--text);
        }
        #ui-panel h3 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-align: center;
            color: #fff;
            margin-bottom: -4px;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-group label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        .slider-group label .val {
            color: var(--accent);
            font-weight: 700;
        }
        .slider-group input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: var(--slider-track);
            outline: none;
            cursor: pointer;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 158, 0, 0.4);
            transition: all 0.15s;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 158, 0, 0.7);
        }
        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .btn {
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(40, 40, 60, 0.7);
            color: #ddd;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(60, 60, 90, 0.85);
            border-color: var(--accent);
            color: #fff;
        }
        #info-tip {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.55);
            font-size: 11px;
            letter-spacing: 0.03em;
            pointer-events: none;
            text-align: center;
        }
        @media (max-width: 700px) {
            #ui-panel {
                top: auto;
                bottom: 8px;
                right: 8px;
                width: 220px;
                padding: 12px 14px 10px;
                gap: 8px;
                border-radius: 12px;
            }
            #ui-panel h3 {
                font-size: 12px;
            }
            .slider-group label {
                font-size: 8px;
            }
            .slider-group input[type="range"] {
                height: 4px;
            }
            .slider-group input[type="range"]::-webkit-slider-thumb {
                width: 18px;
                height: 18px;
            }
            .btn {
                padding: 6px 10px;
                font-size: 9px;
            }
            #info-tip {
                font-size: 9px;
                bottom: 6px;
            }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui-panel">
        <h3>🔮 Sphere Properties</h3>
        <div class="slider-group">
            <label>Metallic <span class="val" id="metal-val">0.95</span></label>
            <input type="range" id="metal-slider" min="0" max="100" value="95" step="1">
        </div>
        <div class="slider-group">
            <label>Roughness <span class="val" id="rough-val">0.10</span></label>
            <input type="range" id="rough-slider" min="0" max="100" value="10" step="1">
        </div>
        <div class="slider-group">
            <label>Clear Coat <span class="val" id="coat-val">0.60</span></label>
            <input type="range" id="coat-slider" min="0" max="100" value="60" step="1">
        </div>
        <div class="slider-group">
            <label>Env. Intensity <span class="val" id="env-val">1.40</span></label>
            <input type="range" id="env-slider" min="0" max="200" value="140" step="1">
        </div>
        <div class="slider-group">
            <label>Anisotropy <span class="val" id="aniso-val">0.30</span></label>
            <input type="range" id="aniso-slider" min="0" max="100" value="30" step="1">
        </div>
        <div class="btn-row">
            <button class="btn" id="btn-chrome">✨ Chrome</button>
            <button class="btn" id="btn-gold">🥇 Gold</button>
            <button class="btn" id="btn-copper">🟤 Copper</button>
            <button class="btn" id="btn-mirror">🪞 Mirror</button>
        </div>
    </div>
    <div id="info-tip">🖱️ Drag to orbit &bull; Scroll to zoom &bull; Right-drag to pan &bull; R to reset</div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        (function() {
            // ────────────────────────────────────────
            // CANVAS & ENGINE
            // ────────────────────────────────────────
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: false,
                stencil: true,
                antialias: true,
            });
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.35, 0.45, 0.58, 1.0);
            scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
            scene.fogColor = new BABYLON.Color3(0.45, 0.52, 0.62);
            scene.fogStart = 35;
            scene.fogEnd = 100;

            // ────────────────────────────────────────
            // CAMERA
            // ────────────────────────────────────────
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 3.5, Math.PI / 3.2, 28,
                new BABYLON.Vector3(0, 5, -2), scene);
            camera.lowerRadiusLimit = 8;
            camera.upperRadiusLimit = 70;
            camera.lowerBetaLimit = 0.15;
            camera.upperBetaLimit = 1.4;
            camera.panningSensibility = 400;
            camera.wheelPrecision = 30;
            camera.attachControl(canvas, true);
            camera.target = new BABYLON.Vector3(0, 5.5, -2);

            // ────────────────────────────────────────
            // LIGHTING
            // ────────────────────────────────────────
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.3, 1.0, 0.4), scene);
            hemiLight.intensity = 0.45;
            hemiLight.diffuse = new BABYLON.Color3(1.0, 0.92, 0.78);
            hemiLight.groundColor = new BABYLON.Color3(0.25, 0.28, 0.35);

            const sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5, -0.75, -0.35), scene);
            sunLight.intensity = 1.2;
            sunLight.diffuse = new BABYLON.Color3(1.0, 0.93, 0.8);
            sunLight.shadowEnabled = true;
            sunLight.shadowMinZ = 0.5;
            sunLight.shadowMaxZ = 60;
            sunLight.shadowMapSize = 2048;
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, sunLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 16;
            shadowGenerator.bias = 0.0002;
            shadowGenerator.depthScale = 50;

            // ────────────────────────────────────────
            // SCENE ENVIRONMENT (reflection probe)
            // ────────────────────────────────────────
            const probe = new BABYLON.ReflectionProbe("probe", 256, scene);
            probe.position = new BABYLON.Vector3(0, 6, -2);
            probe.refreshRate = BABYLON.RenderTargetTexture.REFRESHRATE_RENDER_ONCE;
            scene.environmentTexture = probe.cubeTexture;
            scene.environmentIntensity = 1.4;

            // ────────────────────────────────────────
            // MATERIALS
            // ────────────────────────────────────────
            function createBuildingWindowTexture(rows, cols, litColor, darkColor, litRatio) {
                const res = 256;
                const c = document.createElement('canvas');
                c.width = res;
                c.height = res;
                const ctx = c.getContext('2d');
                ctx.fillStyle = darkColor;
                ctx.fillRect(0, 0, res, res);
                const cellW = res / cols;
                const cellH = res / rows;
                const gap = cellW * 0.12;
                for (let r = 0; r < rows; r++) {
                    for (let co = 0; co < cols; co++) {
                        const lit = Math.random() < litRatio;
                        ctx.fillStyle = lit ? litColor : '#1a1a22';
                        ctx.fillRect(co * cellW + gap, r * cellH + gap, cellW - gap * 2, cellH - gap * 2);
                    }
                }
                const tex = new BABYLON.Texture(c.toDataURL(), scene, false, false);
                tex.uScale = 1;
                tex.vScale = 1;
                return tex;
            }

            const roadTextureCanvas = document.createElement('canvas');
            roadTextureCanvas.width = 512;
            roadTextureCanvas.height = 512;
            const rctx = roadTextureCanvas.getContext('2d');
            rctx.fillStyle = '#2a2a2e';
            rctx.fillRect(0, 0, 512, 512);
            rctx.fillStyle = '#3a3a40';
            for (let i = 0; i < 512; i += 32) {
                rctx.fillRect(i, 0, 16, 512);
            }
            rctx.strokeStyle = '#f0e040';
            rctx.lineWidth = 3;
            rctx.setLineDash([40, 30]);
            rctx.beginPath();
            rctx.moveTo(0, 256);
            rctx.lineTo(512, 256);
            rctx.stroke();
            rctx.setLineDash([]);
            const roadTex = new BABYLON.Texture(roadTextureCanvas.toDataURL(), scene, false, false);
            roadTex.uScale = 8;
            roadTex.vScale = 8;

            const sidewalkTexCanvas = document.createElement('canvas');
            sidewalkTexCanvas.width = 256;
            sidewalkTexCanvas.height = 256;
            const sctx = sidewalkTexCanvas.getContext('2d');
            sctx.fillStyle = '#c8c4bc';
            sctx.fillRect(0, 0, 256, 256);
            for (let x = 0; x < 256; x += 64) {
                sctx.fillStyle = '#b5b0a8';
                sctx.fillRect(x, 0, 2, 256);
            }
            for (let y = 0; y < 256; y += 64) {
                sctx.fillStyle = '#b5b0a8';
                sctx.fillRect(0, y, 256, 2);
            }
            const sidewalkTex = new BABYLON.Texture(sidewalkTexCanvas.toDataURL(), scene, false, false);
            sidewalkTex.uScale = 4;
            sidewalkTex.vScale = 4;

            const roadMat = new BABYLON.StandardMaterial("roadMat", scene);
            roadMat.diffuseTexture = roadTex;
            roadMat.specularColor = new BABYLON.Color3(0.03, 0.03, 0.03);
            roadMat.roughness = 0.95;

            const sidewalkMat = new BABYLON.StandardMaterial("sidewalkMat", scene);
            sidewalkMat.diffuseTexture = sidewalkTex;
            sidewalkMat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);
            sidewalkMat.roughness = 0.9;

            const buildingBaseMat = new BABYLON.StandardMaterial("buildingBase", scene);
            buildingBaseMat.diffuseColor = new BABYLON.Color3(0.55, 0.52, 0.5);
            buildingBaseMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            buildingBaseMat.roughness = 0.85;

            const windowLitTex1 = createBuildingWindowTexture(10, 8, '#ffe8c0', '#3a3a44', 0.55);
            const windowLitTex2 = createBuildingWindowTexture(12, 6, '#c8e8ff', '#3a3a44', 0.5);
            const windowLitTex3 = createBuildingWindowTexture(8, 10, '#ffe0d0', '#3a3a44', 0.6);

            // ────────────────────────────────────────
            // GROUND: ROAD + SIDEWALKS
            // ────────────────────────────────────────
            const roadWidth = 14;
            const roadLength = 60;
            const road = BABYLON.MeshBuilder.CreateGround("road", {
                width: roadWidth,
                height: roadLength,
            }, scene);
            road.position.set(0, 0.01, -5);
            road.material = roadMat;
            road.receiveShadows = true;

            for (let s = -1; s <= 1; s += 2) {
                const sidewalk = BABYLON.MeshBuilder.CreateGround("sidewalk" + s, {
                    width: 4,
                    height: roadLength,
                }, scene);
                sidewalk.position.set(s * (roadWidth / 2 + 2), 0.02, -5);
                sidewalk.material = sidewalkMat;
                sidewalk.receiveShadows = true;
            }

            // ────────────────────────────────────────
            // BUILDINGS
            // ────────────────────────────────────────
            const buildingDefs = [
                { x: -15, z: -15, w: 5, h: 8, d: 5, tex: windowLitTex1 },
                { x: -9, z: -13, w: 4.5, h: 14, d: 4.5, tex: windowLitTex2 },
                { x: -3, z: -16, w: 5.5, h: 10, d: 5.5, tex: windowLitTex3 },
                { x: 4, z: -14, w: 4, h: 12, d: 4, tex: windowLitTex1 },
                { x: 10, z: -15, w: 5, h: 7, d: 5, tex: windowLitTex2 },
                { x: 16, z: -13, w: 4.5, h: 16, d: 4.5, tex: windowLitTex3 },
                { x: -16, z: 4, w: 5, h: 9, d: 5, tex: windowLitTex2 },
                { x: -10, z: 6, w: 4.5, h: 13, d: 4.5, tex: windowLitTex1 },
                { x: -4, z: 5, w: 5.5, h: 11, d: 5.5, tex: windowLitTex3 },
                { x: 3, z: 7, w: 4, h: 15, d: 4, tex: windowLitTex2 },
                { x: 9, z: 5, w: 5, h: 8, d: 5, tex: windowLitTex1 },
                { x: 15, z: 6, w: 4.5, h: 10, d: 4.5, tex: windowLitTex3 },
            ];

            const buildings = [];
            buildingDefs.forEach(def => {
                const bldg = BABYLON.MeshBuilder.CreateBox("building", {
                    width: def.w,
                    height: def.h,
                    depth: def.d,
                }, scene);
                bldg.position.set(def.x, def.h / 2, def.z);
                const mat = new BABYLON.StandardMaterial("bldgMat", scene);
                mat.diffuseTexture = def.tex;
                mat.diffuseColor = new BABYLON.Color3(0.7, 0.68, 0.65);
                mat.specularColor = new BABYLON.Color3(0.04, 0.04, 0.04);
                mat.roughness = 0.8;
                bldg.material = mat;
                bldg.receiveShadows = true;
                shadowGenerator.addShadowCaster(bldg);
                buildings.push(bldg);
            });

            // ────────────────────────────────────────
            // STREET LAMPS
            // ────────────────────────────────────────
            for (let i = -3; i <= 3; i++) {
                const lampPole = BABYLON.MeshBuilder.CreateCylinder("lampPole", {
                    diameterTop: 0.15,
                    diameterBottom: 0.2,
                    height: 5,
                    tessellation: 6,
                }, scene);
                lampPole.position.set(-roadWidth / 2 - 3, 2.5, i * 8 - 2);
                lampPole.material = new BABYLON.StandardMaterial("lampMat", scene);
                lampPole.material.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.32);
                lampPole.receiveShadows = true;
                shadowGenerator.addShadowCaster(lampPole);

                const lampHead = BABYLON.MeshBuilder.CreateSphere("lampHead", {
                    diameter: 0.6,
                    segments: 6,
                }, scene);
                lampHead.position.set(-roadWidth / 2 - 3, 5.1, i * 8 - 2);
                const lampGlowMat = new BABYLON.StandardMaterial("lampGlow", scene);
                lampGlowMat.emissiveColor = new BABYLON.Color3(0.9, 0.8, 0.5);
                lampGlowMat.diffuseColor = new BABYLON.Color3(0.9, 0.7, 0.3);
                lampGlowMat.specularColor = new BABYLON.Color3(0, 0, 0);
                lampHead.material = lampGlowMat;
                shadowGenerator.addShadowCaster(lampHead);
            }

            // ────────────────────────────────────────
            // PBR SPHERES
            // ────────────────────────────────────────
            const sphere1 = BABYLON.MeshBuilder.CreateSphere("sphere1", {
                diameter: 3,
                segments: 64,
            }, scene);
            sphere1.position.set(-3, 6.5, -2);
            const pbr1 = new BABYLON.PBRMaterial("pbr1", scene);
            pbr1.metallic = 0.95;
            pbr1.roughness = 0.1;
            pbr1.clearCoat = 0.6;
            pbr1.clearCoatRoughness = 0.15;
            pbr1.environmentIntensity = 1.4;
            pbr1.anisotropy = 0.3;
            pbr1.albedoColor = new BABYLON.Color3(0.85, 0.85, 0.88);
            pbr1.reflectivityColor = new BABYLON.Color3(1, 1, 1);
            pbr1.microSurface = 0.9;
            pbr1.indexOfRefraction = 0.66;
            sphere1.material = pbr1;
            sphere1.receiveShadows = true;
            shadowGenerator.addShadowCaster(sphere1);

            const sphere2 = BABYLON.MeshBuilder.CreateSphere("sphere2", {
                diameter: 2.2,
                segments: 64,
            }, scene);
            sphere2.position.set(4, 5.2, -1);
            const pbr2 = new BABYLON.PBRMaterial("pbr2", scene);
            pbr2.metallic = 0.95;
            pbr2.roughness = 0.1;
            pbr2.clearCoat = 0.6;
            pbr2.clearCoatRoughness = 0.15;
            pbr2.environmentIntensity = 1.4;
            pbr2.anisotropy = 0.3;
            pbr2.albedoColor = new BABYLON.Color3(0.9, 0.7, 0.45);
            pbr2.reflectivityColor = new BABYLON.Color3(1, 0.85, 0.6);
            pbr2.microSurface = 0.9;
            pbr2.indexOfRefraction = 0.66;
            sphere2.material = pbr2;
            sphere2.receiveShadows = true;
            shadowGenerator.addShadowCaster(sphere2);

            const pbrMaterials = [pbr1, pbr2];

            // ────────────────────────────────────────
            // SSR POST-PROCESS
            // ────────────────────────────────────────
            const ssr = new BABYLON.ScreenSpaceReflectionsPostProcess(
                "ssr",
                scene,
                1.0,
                camera,
                BABYLON.TextureFormat.RGBA,
                engine,
                true,
                0.5
            );
            ssr.strength = 0.55;
            ssr.reflectionSamples = 32;
            ssr.smoothness = 2.5;
            ssr.step = 0.12;
            ssr.threshold = 0.95;
            ssr.roughnessFactor = 0.6;
            ssr.reflectionSpecularFalloffExponent = 3.5;
            ssr.maxDistance = 30;

            // ────────────────────────────────────────
            // ANIMATION
            // ────────────────────────────────────────
            let time = 0;
            scene.registerBeforeRender(() => {
                const dt = Math.min(engine.getDeltaTime() / 1000, 0.15);
                time += dt;

                // Gentle bobbing
                sphere1.position.y = 6.5 + Math.sin(time * 0.7) * 0.6;
                sphere1.rotation.y += dt * 0.15;
                sphere2.position.y = 5.2 + Math.cos(time * 0.65) * 0.5;
                sphere2.rotation.y -= dt * 0.2;

                // Update reflection probe periodically
                if (Math.floor(time * 2) % 4 === 0 && probe.refreshRate === BABYLON.RenderTargetTexture
                    .REFRESHRATE_RENDER_ONCE) {
                    probe.refreshRate = BABYLON.RenderTargetTexture.REFRESHRATE_RENDER_ONEVERYFRAME;
                    setTimeout(() => {
                        probe.refreshRate = BABYLON.RenderTargetTexture.REFRESHRATE_RENDER_ONCE;
                    }, 50);
                }
            });

            // ────────────────────────────────────────
            // UI SLIDERS
            // ────────────────────────────────────────
            const metalSlider = document.getElementById('metal-slider');
            const roughSlider = document.getElementById('rough-slider');
            const coatSlider = document.getElementById('coat-slider');
            const envSlider = document.getElementById('env-slider');
            const anisoSlider = document.getElementById('aniso-slider');
            const metalVal = document.getElementById('metal-val');
            const roughVal = document.getElementById('rough-val');
            const coatVal = document.getElementById('coat-val');
            const envVal = document.getElementById('env-val');
            const anisoVal = document.getElementById('aniso-val');

            function updateAllMaterials() {
                const metallic = parseInt(metalSlider.value) / 100;
                const roughness = parseInt(roughSlider.value) / 100;
                const clearCoat = parseInt(coatSlider.value) / 100;
                const envIntensity = parseInt(envSlider.value) / 100;
                const anisotropy = parseInt(anisoSlider.value) / 100;

                metalVal.textContent = metallic.toFixed(2);
                roughVal.textContent = roughness.toFixed(2);
                coatVal.textContent = clearCoat.toFixed(2);
                envVal.textContent = envIntensity.toFixed(2);
                anisoVal.textContent = anisotropy.toFixed(2);

                pbrMaterials.forEach(mat => {
                    mat.metallic = metallic;
                    mat.roughness = roughness;
                    mat.clearCoat = clearCoat;
                    mat.clearCoatRoughness = roughness * 0.5;
                    mat.environmentIntensity = envIntensity;
                    mat.anisotropy = anisotropy;
                });
                scene.environmentIntensity = envIntensity;
            }

            metalSlider.addEventListener('input', updateAllMaterials);
            roughSlider.addEventListener('input', updateAllMaterials);
            coatSlider.addEventListener('input', updateAllMaterials);
            envSlider.addEventListener('input', updateAllMaterials);
            anisoSlider.addEventListener('input', updateAllMaterials);

            function setPreset(metallic, roughness, clearCoat, envIntensity, anisotropy, albedo1, albedo2, refl1,
            refl2) {
                metalSlider.value = Math.round(metallic * 100);
                roughSlider.value = Math.round(roughness * 100);
                coatSlider.value = Math.round(clearCoat * 100);
                envSlider.value = Math.round(envIntensity * 100);
                anisoSlider.value = Math.round(anisotropy * 100);
                pbr1.albedoColor = BABYLON.Color3.FromHexString(albedo1);
                pbr2.albedoColor = BABYLON.Color3.FromHexString(albedo2);
                pbr1.reflectivityColor = BABYLON.Color3.FromHexString(refl1);
                pbr2.reflectivityColor = BABYLON.Color3.FromHexString(refl2);
                updateAllMaterials();
            }

            document.getElementById('btn-chrome').addEventListener('click', () => {
                setPreset(0.98, 0.06, 0.65, 1.5, 0.35, '#e8e8f0', '#e0e0e8', '#ffffff', '#ffffff');
            });
            document.getElementById('btn-gold').addEventListener('click', () => {
                setPreset(0.97, 0.12, 0.55, 1.3, 0.25, '#f0d080', '#e8c860', '#ffe8c0', '#ffdca0');
            });
            document.getElementById('btn-copper').addEventListener('click', () => {
                setPreset(0.96, 0.15, 0.5, 1.2, 0.2, '#e89860', '#d87840', '#ffc8a0', '#ffb880');
            });
            document.getElementById('btn-mirror').addEventListener('click', () => {
                setPreset(1.0, 0.02, 0.75, 1.8, 0.0, '#f8f8f8', '#f8f8f8', '#ffffff', '#ffffff');
            });

            // ────────────────────────────────────────
            // KEYBOARD
            // ────────────────────────────────────────
            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    camera.alpha = -Math.PI / 3.5;
                    camera.beta = Math.PI / 3.2;
                    camera.radius = 28;
                    camera.target.set(0, 5.5, -2);
                }
            });

            // ────────────────────────────────────────
            // RESIZE
            // ────────────────────────────────────────
            window.addEventListener('resize', () => engine.resize());

            // ────────────────────────────────────────
            // INITIAL PROBE REFRESH
            // ────────────────────────────────────────
            setTimeout(() => {
                probe.refreshRate = BABYLON.RenderTargetTexture.REFRESHRATE_RENDER_ONEVERYFRAME;
                setTimeout(() => {
                    probe.refreshRate = BABYLON.RenderTargetTexture.REFRESHRATE_RENDER_ONCE;
                }, 100);
            }, 500);

            // ────────────────────────────────────────
            // RENDER LOOP
            // ────────────────────────────────────────
            engine.runRenderLoop(() => {
                scene.render();
            });

            console.log('🔮 Ray Tracing Simulation Ready!');
            console.log('   Two metallic spheres above a street scene');
            console.log('   🖱️ Drag to orbit | Scroll to zoom | R to reset');
            console.log('   🎚️ Adjust sliders to change material properties');
            console.log('   ✨ Preset buttons for Chrome, Gold, Copper, Mirror');
            console.log('   💡 SSR + Reflection Probe + PBR for ray-traced look');
        })();
    </script>
</body>
</html>
