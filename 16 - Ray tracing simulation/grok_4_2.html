<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REFLECT • Metallic Spheres</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { margin:0; overflow:hidden; background:#0a0a1a; font-family:'Inter', system-ui; }
        canvas { display:block; }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15,15,35,0.92);
            padding: 20px;
            border-radius: 16px;
            color: #fff;
            width: 280px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }
        h1 { margin:0 0 20px 0; font-size: 22px; text-align:center; color:#0ff; }
        .control {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #88ffdd;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #00ffff;
        }
        .val {
            float: right;
            font-family: monospace;
            color: #0ff;
        }
        #info {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 13px;
            color: #88ffdd;
            background: rgba(0,0,0,0.5);
            padding: 10px 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <h1>REFLECT</h1>
        
        <div class="control">
            <label>SPHERE 1 — METALLIC <span id="m1val" class="val">1.00</span></label>
            <input type="range" id="metallic1" min="0" max="100" value="100">
        </div>
        
        <div class="control">
            <label>SPHERE 1 — ROUGHNESS <span id="r1val" class="val">0.12</span></label>
            <input type="range" id="roughness1" min="0" max="100" value="12">
        </div>
        
        <div class="control">
            <label>SPHERE 2 — METALLIC <span id="m2val" class="val">0.95</span></label>
            <input type="range" id="metallic2" min="0" max="100" value="95">
        </div>
        
        <div class="control">
            <label>SPHERE 2 — ROUGHNESS <span id="r2val" class="val">0.35</span></label>
            <input type="range" id="roughness2" min="0" max="100" value="35">
        </div>
        
        <div class="control">
            <label>ENVIRONMENT STRENGTH <span id="envval" class="val">1.00</span></label>
            <input type="range" id="envSlider" min="0" max="200" value="100">
        </div>
    </div>
    
    <div id="info">
        DRAG to orbit • SCROLL to zoom<br>
        Real-time PBR reflections (metallic spheres)
    </div>

    <script>
        // ================================================
        // REFLECT — Real-time Metallic Spheres Demo
        // Babylon.js • Single standalone HTML file
        // Street scene with procedural road + buildings
        // Two floating metallic spheres with live sliders
        // ================================================

        const canvas = document.getElementById("canvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let scene, camera, sphere1, sphere2;
        let mat1, mat2;

        function createScene() {
            scene = new BABYLON.Scene(engine);
            
            // Camera
            camera = new BABYLON.ArcRotateCamera("cam", Math.PI * 1.6, Math.PI * 0.42, 240, new BABYLON.Vector3(0, 18, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 60;
            camera.upperRadiusLimit = 480;
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = 1.55;
            
            // Lights
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.6, 1, -0.4), scene);
            hemi.intensity = 0.75;
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.7, -0.8, -0.5), scene);
            sun.intensity = 1.4;
            
            // Environment (public Babylon studio HDR for beautiful reflections)
            scene.environmentTexture = new BABYLON.CubeTexture("https://assets.babylonjs.com/environments/studio.env", scene);
            scene.environmentIntensity = 1.0;
            
            // Ground - asphalt street
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 420, height: 280}, scene);
            const groundMat = new BABYLON.StandardMaterial("gMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.08, 0.08, 0.1);
            groundMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.35);
            groundMat.specularPower = 64;
            ground.material = groundMat;
            
            // Road markings
            createRoadMarkings();
            
            // Buildings on sides (simple procedural skyscrapers)
            createBuildings();
            
            // Two metallic spheres
            sphere1 = BABYLON.MeshBuilder.CreateSphere("sphere1", {diameter: 38, segments: 64}, scene);
            sphere1.position.set(-52, 42, 0);
            
            sphere2 = BABYLON.MeshBuilder.CreateSphere("sphere2", {diameter: 32, segments: 64}, scene);
            sphere2.position.set(52, 36, 18);
            
            // PBR Materials
            mat1 = new BABYLON.PBRMaterial("mat1", scene);
            mat1.metallic = 1.0;
            mat1.roughness = 0.12;
            mat1.environmentTexture = scene.environmentTexture;
            mat1.environmentIntensity = 1.0;
            sphere1.material = mat1;
            
            mat2 = new BABYLON.PBRMaterial("mat2", scene);
            mat2.metallic = 0.95;
            mat2.roughness = 0.35;
            mat2.environmentTexture = scene.environmentTexture;
            mat2.environmentIntensity = 1.0;
            sphere2.material = mat2;
            
            // Gentle animation
            let t = 0;
            scene.registerBeforeRender(() => {
                t += 0.008;
                sphere1.rotation.y = t * 0.4;
                sphere2.rotation.y = t * -0.35;
                sphere1.position.y = 42 + Math.sin(t * 1.6) * 1.8;
                sphere2.position.y = 36 + Math.sin(t * 1.4) * 2.2;
            });
            
            return scene;
        }

        function createRoadMarkings() {
            const lineMat = new BABYLON.StandardMaterial("line", scene);
            lineMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
            lineMat.emissiveColor = new BABYLON.Color3(0.6, 0.6, 0.6);
            
            // Center dashed line
            for (let i = -6; i <= 6; i++) {
                const dash = BABYLON.MeshBuilder.CreateBox("dash", {width: 4, height: 0.3, depth: 18}, scene);
                dash.position.set(0, 0.2, i * 42);
                dash.material = lineMat;
            }
            
            // Side lines
            const sideMat = lineMat.clone();
            for (let side of [-92, 92]) {
                const line = BABYLON.MeshBuilder.CreateBox("side", {width: 380, height: 0.3, depth: 3}, scene);
                line.position.set(0, 0.2, side);
                line.material = sideMat;
            }
        }

        function createBuildings() {
            const buildingMat = new BABYLON.StandardMaterial("bMat", scene);
            buildingMat.diffuseColor = new BABYLON.Color3(0.22, 0.25, 0.32);
            
            // Left side buildings
            for (let i = 0; i < 7; i++) {
                const w = 28 + Math.random() * 22;
                const h = 45 + Math.random() * 95;
                const b = BABYLON.MeshBuilder.CreateBox("b", {width: w, height: h, depth: 32}, scene);
                b.position.set(-110 - i*38, h/2, -80 + Math.random()*140);
                b.material = buildingMat;
                
                // Windows
                for (let wy = 8; wy < h-10; wy += 14) {
                    const win = BABYLON.MeshBuilder.CreateBox("win", {width: 8, height: 9, depth: 1}, scene);
                    win.position.set(b.position.x + (Math.random()-0.5)*w*0.6, wy, b.position.z + 16);
                    const wMat = new BABYLON.StandardMaterial("", scene);
                    wMat.emissiveColor = new BABYLON.Color3(0.9, 0.95, 1);
                    win.material = wMat;
                }
            }
            
            // Right side buildings
            for (let i = 0; i < 6; i++) {
                const w = 24 + Math.random() * 28;
                const h = 55 + Math.random() * 110;
                const b = BABYLON.MeshBuilder.CreateBox("b", {width: w, height: h, depth: 28}, scene);
                b.position.set(110 + i*42, h/2, -60 + Math.random()*130);
                b.material = buildingMat;
            }
        }

        // Setup UI controls
        function setupUI() {
            const m1 = document.getElementById("metallic1");
            const r1 = document.getElementById("roughness1");
            const m2 = document.getElementById("metallic2");
            const r2 = document.getElementById("roughness2");
            const env = document.getElementById("envSlider");
            
            m1.oninput = () => {
                mat1.metallic = m1.value / 100;
                document.getElementById("m1val").textContent = (m1.value / 100).toFixed(2);
            };
            r1.oninput = () => {
                mat1.roughness = r1.value / 100;
                document.getElementById("r1val").textContent = (r1.value / 100).toFixed(2);
            };
            m2.oninput = () => {
                mat2.metallic = m2.value / 100;
                document.getElementById("m2val").textContent = (m2.value / 100).toFixed(2);
            };
            r2.oninput = () => {
                mat2.roughness = r2.value / 100;
                document.getElementById("r2val").textContent = (r2.value / 100).toFixed(2);
            };
            env.oninput = () => {
                scene.environmentIntensity = env.value / 100;
                document.getElementById("envval").textContent = (env.value / 100).toFixed(2);
            };
        }

        window.onload = () => {
            const scene = createScene();
            setupUI();
            
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            window.addEventListener("resize", () => engine.resize());
        };
    </script>
</body>
</html>
