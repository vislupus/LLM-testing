<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babylon.js Ray Tracing — Metallic Spheres</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; }
  #renderCanvas { width: 100vw; height: 100vh; display: block; outline: none; }
  #gui-panel {
    position: absolute; top: 12px; right: 12px; width: 280px;
    background: rgba(20,20,25,0.92); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    padding: 18px; color: #e0e0e0; font-size: 13px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-height: 92vh; overflow-y: auto;
  }
  #gui-panel h2 { font-size: 15px; margin-bottom: 14px; color: #fff; font-weight: 600; letter-spacing: 0.3px; }
  .control-group { margin-bottom: 14px; }
  .control-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 12px; }
  .control-group input[type="range"] { width: 100%; accent-color: #4fc3f7; }
  .control-group .val { float: right; color: #4fc3f7; font-weight: 600; }
  .control-group select, .control-group input[type="color"] {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #333;
    background: #1a1a1f; color: #e0e0e0; font-size: 12px;
  }
  .control-group input[type="color"] { padding: 2px; height: 32px; cursor: pointer; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row button {
    flex: 1; padding: 8px; border: none; border-radius: 6px;
    background: #2a2a35; color: #ccc; font-size: 12px; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-row button:hover { background: #3a3a4a; }
  .btn-row button.active { background: #4fc3f7; color: #000; font-weight: 600; }
  .sep { height: 1px; background: rgba(255,255,255,0.06); margin: 14px 0; }
  .hint { font-size: 11px; color: #666; margin-top: 8px; line-height: 1.4; }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #4fc3f7; font-size: 16px; z-index: 100;
  }
</style>
</head>
<body>
<div id="loading">Loading Babylon.js scene…</div>
<canvas id="renderCanvas"></canvas>

<div id="gui-panel">
  <h2>🔮 Material Controls</h2>

  <div class="btn-row" id="sphere-selector">
    <button class="active" onclick="selectSphere(0)">Sphere 1 (Gold)</button>
    <button onclick="selectSphere(1)">Sphere 2 (Silver)</button>
  </div>

  <div class="sep"></div>

  <div class="control-group">
    <label>Metallic <span class="val" id="v-metallic">1.00</span></label>
    <input type="range" id="metallic" min="0" max="1" step="0.01" value="1" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Roughness <span class="val" id="v-roughness">0.15</span></label>
    <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.15" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Reflectivity (F0) <span class="val" id="v-reflectivity">1.00</span></label>
    <input type="range" id="reflectivity" min="0" max="1" step="0.01" value="1" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Albedo Color</label>
    <input type="color" id="albedo-color" value="#ffd700" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Environment Intensity <span class="val" id="v-env-intensity">1.00</span></label>
    <input type="range" id="env-intensity" min="0" max="3" step="0.05" value="1" oninput="updateEnv()">
  </div>

  <div class="control-group">
    <label>Clear Coat <span class="val" id="v-clearcoat">0.00</span></label>
    <input type="range" id="clearcoat" min="0" max="1" step="0.01" value="0" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Clear Coat Roughness <span class="val" id="v-cc-roughness">0.00</span></label>
    <input type="range" id="cc-roughness" min="0" max="1" step="0.01" value="0" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Anisotropy <span class="val" id="v-anisotropy">0.00</span></label>
    <input type="range" id="anisotropy" min="0" max="1" step="0.01" value="0" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Sheen <span class="val" id="v-sheen">0.00</span></label>
    <input type="range" id="sheen" min="0" max="1" step="0.01" value="0" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Sub-Surface Refraction <span class="val" id="v-refraction">0.00</span></label>
    <input type="range" id="refraction" min="0" max="1" step="0.01" value="0" oninput="updateMaterial()">
  </div>

  <div class="control-group">
    <label>Index of Refraction <span class="val" id="v-ior">1.50</span></label>
    <input type="range" id="ior" min="1" max="2.5" step="0.01" value="1.5" oninput="updateMaterial()">
  </div>

  <div class="sep"></div>

  <div class="control-group">
    <label>Light Intensity <span class="val" id="v-light">1.50</span></label>
    <input type="range" id="light-intensity" min="0" max="5" step="0.1" value="1.5" oninput="updateLights()">
  </div>

  <div class="control-group">
    <label>Light Color</label>
    <input type="color" id="light-color" value="#ffffff" oninput="updateLights()">
  </div>

  <div class="sep"></div>

  <div class="btn-row">
    <button onclick="preset('gold')">Gold</button>
    <button onclick="preset('silver')">Silver</button>
    <button onclick="preset('copper')">Copper</button>
  </div>
  <div class="btn-row" style="margin-top:6px;">
    <button onclick="preset('chrome')">Chrome</button>
    <button onclick="preset('rust')">Rusty</button>
    <button onclick="preset('glass')">Glass</button>
  </div>

  <div class="hint">
    🖱️ Left-drag to rotate camera<br>
    🖱️ Right-drag to pan<br>
    🖱️ Scroll to zoom<br>
    💡 The street scene is a procedural environment with real-time PBR reflections.
  </div>
</div>

<script>
/* ===================== SCENE SETUP ===================== */
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
let scene, camera, spheres = [], materials = [], lights = [];
let activeSphere = 0;
let envTexture;

// Environment texture URLs from Babylon.js asset library
// Using the parking.env for a street-like scene, with fallback to environment.env
const ENV_URLS = [
  "https://assets.babylonjs.com/environments/parking.env",
  "https://www.babylonjs-playground.com/textures/parking.env",
  "https://assets.babylonjs.com/environments/environment.env"
];

async function createScene() {
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color3(0.02, 0.02, 0.03);

  // Camera
  camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2.5, Math.PI / 2.8, 8,
    new BABYLON.Vector3(0, 1.2, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 3;
  camera.upperRadiusLimit = 20;
  camera.wheelPrecision = 50;

  // Load HDR environment (street scene)
  let envLoaded = false;
  for (const url of ENV_URLS) {
    try {
      envTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(url, scene);
      scene.environmentTexture = envTexture;
      envLoaded = true;
      console.log("Environment loaded:", url);
      break;
    } catch (e) {
      console.warn("Failed to load env:", url, e);
    }
  }

  // Fallback: create a procedural environment if HDR fails
  if (!envLoaded) {
    console.log("Using procedural fallback environment");
    const hdrTexture = new BABYLON.HDRCubeTexture("https://www.babylonjs-playground.com/textures/environment.hdr", scene, 512, false, true, false, true);
    scene.environmentTexture = hdrTexture;
  }

  scene.environmentIntensity = 1.0;

  // Skybox for visual street scene backdrop
  const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 1000.0 }, scene);
  const skyboxMaterial = new BABYLON.StandardMaterial("skyBox", scene);
  skyboxMaterial.backFaceCulling = false;
  skyboxMaterial.reflectionTexture = scene.environmentTexture.clone();
  skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
  skyboxMaterial.diffuseColor = new BABYLON.Color3(0, 0, 0);
  skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
  skybox.material = skyboxMaterial;
  skybox.infiniteDistance = true;

  // Ground — wet asphalt street
  const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 30, height: 30 }, scene);
  const groundMat = new BABYLON.PBRMaterial("groundMat", scene);
  groundMat.albedoColor = new BABYLON.Color3(0.08, 0.08, 0.09);
  groundMat.metallic = 0.0;
  groundMat.roughness = 0.35;
  groundMat.reflectionColor = new BABYLON.Color3(0.15, 0.15, 0.18);
  groundMat.environmentIntensity = 0.6;
  ground.material = groundMat;

  // Street markings (white lines)
  for (let i = -3; i <= 3; i++) {
    if (i === 0) continue;
    const line = BABYLON.MeshBuilder.CreateBox("line" + i, { width: 0.15, height: 0.01, depth: 30 }, scene);
    line.position.x = i * 2.5;
    line.position.y = 0.006;
    const lineMat = new BABYLON.PBRMaterial("lineMat" + i, scene);
    lineMat.albedoColor = new BABYLON.Color3(0.9, 0.9, 0.85);
    lineMat.metallic = 0;
    lineMat.roughness = 0.6;
    line.material = lineMat;
  }

  // Center dashed line
  for (let z = -14; z <= 14; z += 2.5) {
    const dash = BABYLON.MeshBuilder.CreateBox("dash" + z, { width: 0.12, height: 0.01, depth: 1.2 }, scene);
    dash.position.z = z;
    dash.position.y = 0.006;
    const dashMat = new BABYLON.PBRMaterial("dashMat" + z, scene);
    dashMat.albedoColor = new BABYLON.Color3(0.85, 0.8, 0.5);
    dashMat.metallic = 0;
    dashMat.roughness = 0.5;
    dash.material = dashMat;
  }

  // Sidewalk curbs
  for (const side of [-1, 1]) {
    const curb = BABYLON.MeshBuilder.CreateBox("curb" + side, { width: 0.4, height: 0.15, depth: 30 }, scene);
    curb.position.x = side * 9;
    curb.position.y = 0.075;
    const curbMat = new BABYLON.PBRMaterial("curbMat" + side, scene);
    curbMat.albedoColor = new BABYLON.Color3(0.5, 0.48, 0.45);
    curbMat.metallic = 0;
    curbMat.roughness = 0.7;
    curb.material = curbMat;
  }

  // Buildings / walls along the street
  for (const side of [-1, 1]) {
    const wall = BABYLON.MeshBuilder.CreateBox("wall" + side, { width: 0.5, height: 8, depth: 30 }, scene);
    wall.position.x = side * 12;
    wall.position.y = 4;
    const wallMat = new BABYLON.PBRMaterial("wallMat" + side, scene);
    wallMat.albedoColor = new BABYLON.Color3(0.35, 0.32, 0.3);
    wallMat.metallic = 0.0;
    wallMat.roughness = 0.85;
    wall.material = wallMat;
  }

  // Street lamps
  for (const side of [-1, 1]) {
    for (let z = -10; z <= 10; z += 10) {
      const pole = BABYLON.MeshBuilder.CreateCylinder("pole" + side + z, { height: 5, diameter: 0.12 }, scene);
      pole.position = new BABYLON.Vector3(side * 8, 2.5, z);
      const poleMat = new BABYLON.PBRMaterial("poleMat" + side + z, scene);
      poleMat.albedoColor = new BABYLON.Color3(0.15, 0.15, 0.15);
      poleMat.metallic = 0.9;
      poleMat.roughness = 0.2;
      pole.material = poleMat;

      const lamp = BABYLON.MeshBuilder.CreateSphere("lamp" + side + z, { diameter: 0.4 }, scene);
      lamp.position = new BABYLON.Vector3(side * 8, 5, z);
      const lampMat = new BABYLON.PBRMaterial("lampMat" + side + z, scene);
      lampMat.albedoColor = new BABYLON.Color3(1, 0.95, 0.8);
      lampMat.emissiveColor = new BABYLON.Color3(1, 0.9, 0.6);
      lampMat.metallic = 0;
      lampMat.roughness = 0.1;
      lamp.material = lampMat;

      // Point light from lamp
      const pl = new BABYLON.PointLight("pl" + side + z,
        new BABYLON.Vector3(side * 8, 4.8, z), scene);
      pl.intensity = 0.4;
      pl.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
      pl.range = 12;
      lights.push(pl);
    }
  }

  // Analytical lights
  const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
  dirLight.position = new BABYLON.Vector3(10, 15, 10);
  dirLight.intensity = 1.5;
  dirLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);
  lights.push(dirLight);

  const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
  hemiLight.intensity = 0.3;
  hemiLight.diffuse = new BABYLON.Color3(0.4, 0.45, 0.55);
  hemiLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.12);
  lights.push(hemiLight);

  // === SPHERES ===
  // Sphere 1 — Gold
  const sphere1 = BABYLON.MeshBuilder.CreateSphere("sphere1", { diameter: 1.6, segments: 128 }, scene);
  sphere1.position = new BABYLON.Vector3(-1.2, 1.4, 0);
  const mat1 = new BABYLON.PBRMaterial("mat1", scene);
  mat1.albedoColor = BABYLON.Color3.FromHexString("#ffd700");
  mat1.metallic = 1.0;
  mat1.roughness = 0.15;
  mat1.reflectivityColor = new BABYLON.Color3(1, 1, 1);
  mat1.environmentIntensity = 1.0;
  mat1.microSurface = 1.0;
  sphere1.material = mat1;
  spheres.push(sphere1);
  materials.push(mat1);

  // Sphere 2 — Silver
  const sphere2 = BABYLON.MeshBuilder.CreateSphere("sphere2", { diameter: 1.4, segments: 128 }, scene);
  sphere2.position = new BABYLON.Vector3(1.3, 1.2, 0.5);
  const mat2 = new BABYLON.PBRMaterial("mat2", scene);
  mat2.albedoColor = BABYLON.Color3.FromHexString("#c0c0c0");
  mat2.metallic = 1.0;
  mat2.roughness = 0.12;
  mat2.reflectivityColor = new BABYLON.Color3(1, 1, 1);
  mat2.environmentIntensity = 1.0;
  mat2.microSurface = 1.0;
  sphere2.material = mat2;
  spheres.push(sphere2);
  materials.push(mat2);

  // Suspension wires (thin cylinders)
  for (let i = 0; i < 2; i++) {
    const s = spheres[i];
    const wire = BABYLON.MeshBuilder.CreateCylinder("wire" + i, { height: 8, diameter: 0.015 }, scene);
    wire.position = new BABYLON.Vector3(s.position.x, s.position.y + 4, s.position.z);
    const wireMat = new BABYLON.PBRMaterial("wireMat" + i, scene);
    wireMat.albedoColor = new BABYLON.Color3(0.2, 0.2, 0.2);
    wireMat.metallic = 0.8;
    wireMat.roughness = 0.3;
    wire.material = wireMat;
  }

  // Shadow support
  const shadowGenerator = new BABYLON.ShadowGenerator(2048, dirLight);
  shadowGenerator.useBlurExponentialShadowMap = true;
  shadowGenerator.blurKernel = 32;
  spheres.forEach(s => shadowGenerator.addShadowCaster(s));
  ground.receiveShadows = true;

  // Post-processing for cinematic look
  const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
  pipeline.samples = 4;
  pipeline.fxaaEnabled = true;
  pipeline.bloomEnabled = true;
  pipeline.bloomThreshold = 0.7;
  pipeline.bloomWeight = 0.3;
  pipeline.bloomKernel = 64;
  pipeline.bloomScale = 0.5;
  pipeline.imageProcessing.toneMappingEnabled = true;
  pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
  pipeline.imageProcessing.exposure = 1.1;
  pipeline.imageProcessing.contrast = 1.15;
  pipeline.chromaticAberrationEnabled = true;
  pipeline.chromaticAberration.aberrationAmount = 4;
  pipeline.grainEnabled = true;
  pipeline.grain.intensity = 8;

  // Gentle idle animation
  let t = 0;
  scene.registerBeforeRender(() => {
    t += 0.008;
    spheres[0].position.y = 1.4 + Math.sin(t) * 0.08;
    spheres[1].position.y = 1.2 + Math.sin(t + 1.5) * 0.06;
  });

  // Hide loading
  document.getElementById("loading").style.display = "none";

  return scene;
}

/* ===================== GUI CONTROLS ===================== */
function selectSphere(idx) {
  activeSphere = idx;
  document.querySelectorAll("#sphere-selector button").forEach((b, i) => {
    b.classList.toggle("active", i === idx);
  });
  syncUI();
}

function syncUI() {
  const m = materials[activeSphere];
  if (!m) return;
  document.getElementById("metallic").value = m.metallic;
  document.getElementById("roughness").value = m.roughness;
  document.getElementById("reflectivity").value = m.reflectivityColor ? m.reflectivityColor.r : 1;
  document.getElementById("albedo-color").value = m.albedoColor.toHexString();
  document.getElementById("clearcoat").value = m.clearCoat ? (m.clearCoat.isEnabled ? m.clearCoat.intensity : 0) : 0;
  document.getElementById("cc-roughness").value = m.clearCoat ? (m.clearCoat.isEnabled ? m.clearCoat.roughness : 0) : 0;
  document.getElementById("anisotropy").value = m.anisotropy ? (m.anisotropy.isEnabled ? m.anisotropy.intensity : 0) : 0;
  document.getElementById("sheen").value = m.sheen ? (m.sheen.isEnabled ? m.sheen.intensity : 0) : 0;
  document.getElementById("refraction").value = m.subSurface ? (m.subSurface.isRefractionEnabled ? m.subSurface.refractionIntensity : 0) : 0;
  document.getElementById("ior").value = m.subSurface ? m.subSurface.indexOfRefraction : 1.5;
  updateLabels();
}

function updateMaterial() {
  const m = materials[activeSphere];
  if (!m) return;

  m.metallic = parseFloat(document.getElementById("metallic").value);
  m.roughness = parseFloat(document.getElementById("roughness").value);
  const refl = parseFloat(document.getElementById("reflectivity").value);
  m.reflectivityColor = new BABYLON.Color3(refl, refl, refl);
  m.albedoColor = BABYLON.Color3.FromHexString(document.getElementById("albedo-color").value);

  // Clear coat
  const cc = parseFloat(document.getElementById("clearcoat").value);
  if (cc > 0) {
    m.clearCoat.isEnabled = true;
    m.clearCoat.intensity = cc;
    m.clearCoat.roughness = parseFloat(document.getElementById("cc-roughness").value);
  } else {
    m.clearCoat.isEnabled = false;
  }

  // Anisotropy
  const aniso = parseFloat(document.getElementById("anisotropy").value);
  if (aniso > 0) {
    m.anisotropy.isEnabled = true;
    m.anisotropy.intensity = aniso;
  } else {
    m.anisotropy.isEnabled = false;
  }

  // Sheen
  const sheen = parseFloat(document.getElementById("sheen").value);
  if (sheen > 0) {
    m.sheen.isEnabled = true;
    m.sheen.intensity = sheen;
  } else {
    m.sheen.isEnabled = false;
  }

  // Refraction
  const refr = parseFloat(document.getElementById("refraction").value);
  if (refr > 0) {
    m.subSurface.isRefractionEnabled = true;
    m.subSurface.refractionIntensity = refr;
    m.subSurface.indexOfRefraction = parseFloat(document.getElementById("ior").value);
  } else {
    m.subSurface.isRefractionEnabled = false;
  }

  updateLabels();
}

function updateEnv() {
  const val = parseFloat(document.getElementById("env-intensity").value);
  scene.environmentIntensity = val;
  document.getElementById("v-env-intensity").textContent = val.toFixed(2);
}

function updateLights() {
  const intensity = parseFloat(document.getElementById("light-intensity").value);
  const color = BABYLON.Color3.FromHexString(document.getElementById("light-color").value);
  lights.forEach(l => {
    l.intensity = intensity;
    l.diffuse = color;
  });
  document.getElementById("v-light").textContent = intensity.toFixed(2);
}

function updateLabels() {
  document.getElementById("v-metallic").textContent = parseFloat(document.getElementById("metallic").value).toFixed(2);
  document.getElementById("v-roughness").textContent = parseFloat(document.getElementById("roughness").value).toFixed(2);
  document.getElementById("v-reflectivity").textContent = parseFloat(document.getElementById("reflectivity").value).toFixed(2);
  document.getElementById("v-clearcoat").textContent = parseFloat(document.getElementById("clearcoat").value).toFixed(2);
  document.getElementById("v-cc-roughness").textContent = parseFloat(document.getElementById("cc-roughness").value).toFixed(2);
  document.getElementById("v-anisotropy").textContent = parseFloat(document.getElementById("anisotropy").value).toFixed(2);
  document.getElementById("v-sheen").textContent = parseFloat(document.getElementById("sheen").value).toFixed(2);
  document.getElementById("v-refraction").textContent = parseFloat(document.getElementById("refraction").value).toFixed(2);
  document.getElementById("v-ior").textContent = parseFloat(document.getElementById("ior").value).toFixed(2);
}

function preset(name) {
  const presets = {
    gold:   { metallic: 1, roughness: 0.15, reflectivity: 1, color: "#ffd700", clearcoat: 0, ccRough: 0, aniso: 0, sheen: 0, refr: 0 },
    silver: { metallic: 1, roughness: 0.1,  reflectivity: 1, color: "#c0c0c0", clearcoat: 0, ccRough: 0, aniso: 0, sheen: 0, refr: 0 },
    copper: { metallic: 1, roughness: 0.25, reflectivity: 0.95, color: "#b87333", clearcoat: 0, ccRough: 0, aniso: 0, sheen: 0, refr: 0 },
    chrome: { metallic: 1, roughness: 0.02, reflectivity: 1, color: "#e8e8e8", clearcoat: 0.3, ccRough: 0.05, aniso: 0, sheen: 0, refr: 0 },
    rust:   { metallic: 0.7, roughness: 0.7, reflectivity: 0.5, color: "#8b4513", clearcoat: 0, ccRough: 0, aniso: 0, sheen: 0.3, refr: 0 },
    glass:  { metallic: 0, roughness: 0.05, reflectivity: 0.1, color: "#ffffff", clearcoat: 0, ccRough: 0, aniso: 0, sheen: 0, refr: 0.9 }
  };
  const p = presets[name];
  if (!p) return;
  document.getElementById("metallic").value = p.metallic;
  document.getElementById("roughness").value = p.roughness;
  document.getElementById("reflectivity").value = p.reflectivity;
  document.getElementById("albedo-color").value = p.color;
  document.getElementById("clearcoat").value = p.clearcoat;
  document.getElementById("cc-roughness").value = p.ccRough;
  document.getElementById("anisotropy").value = p.aniso;
  document.getElementById("sheen").value = p.sheen;
  document.getElementById("refraction").value = p.refr;
  updateMaterial();
}

/* ===================== INIT ===================== */
createScene().then(() => {
  syncUI();
  engine.runRenderLoop(() => scene.render());
});

window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
