<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Ray Tracing — Metallic Spheres on Street Scene</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,sans-serif}
  #renderCanvas{width:100vw;height:100vh;display:block}

  #controls{
    position:fixed;top:14px;left:14px;z-index:100;
    background:rgba(8,12,24,.9);backdrop-filter:blur(14px);
    border:1px solid rgba(100,160,255,.15);border-radius:14px;
    padding:18px 22px;color:#9ab;width:300px;
    box-shadow:0 8px 32px rgba(0,0,0,.6);
    max-height:calc(100vh - 28px);overflow-y:auto;
  }
  #controls::-webkit-scrollbar{width:4px}
  #controls::-webkit-scrollbar-thumb{background:rgba(100,160,255,.3);border-radius:2px}

  #controls h2{
    font-size:15px;color:#5a9fff;margin-bottom:4px;
    letter-spacing:.5px;display:flex;align-items:center;gap:6px;
  }
  #controls .subtitle{font-size:10px;color:#4a6a8a;margin-bottom:14px;letter-spacing:.5px}

  .section{
    border-top:1px solid rgba(100,160,255,.1);
    padding-top:12px;margin-top:12px;
  }
  .section-title{
    font-size:11px;color:#5a9fff;text-transform:uppercase;
    letter-spacing:1.5px;margin-bottom:10px;font-weight:700;
  }

  .slider-group{margin-bottom:10px}
  .slider-group label{
    display:flex;justify-content:space-between;
    font-size:11px;margin-bottom:4px;color:#7a8a9a;
  }
  .slider-group label span{color:#5a9fff;font-weight:600;font-size:12px}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:5px;
    border-radius:3px;background:rgba(100,160,255,.12);
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:#5a9fff;
    box-shadow:0 0 8px rgba(90,159,255,.5);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;
    border-radius:50%;background:#5a9fff;
    box-shadow:0 0 8px rgba(90,159,255,.5);cursor:pointer;
  }

  .color-row{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
  }
  .color-row label{font-size:11px;color:#7a8a9a;flex:1}
  input[type=color]{
    width:36px;height:24px;border:1px solid rgba(100,160,255,.2);
    border-radius:4px;background:transparent;cursor:pointer;padding:0;
  }

  .info-row{
    display:flex;justify-content:space-between;
    font-size:10px;color:#4a5a6a;padding:2px 0;
  }
  .info-row .val{color:#5a9fff}

  #fps{
    position:fixed;top:14px;right:14px;z-index:100;
    background:rgba(8,12,24,.85);backdrop-filter:blur(10px);
    border:1px solid rgba(100,160,255,.12);border-radius:8px;
    padding:6px 12px;color:#5a9fff;font-size:12px;font-weight:600;
  }

  #hint{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    z-index:100;color:#3a4a5a;font-size:10px;text-align:center;
    pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="fps">-- FPS</div>

<div id="controls">
  <h2>🔮 Ray Tracing Lab</h2>
  <div class="subtitle">Real-time PBR reflections on metallic spheres</div>

  <div class="section">
    <div class="section-title">Sphere 1 — Chrome</div>
    <div class="slider-group">
      <label>Metallic <span id="s1MetalVal">1.00</span></label>
      <input type="range" id="s1Metal" min="0" max="100" value="100">
    </div>
    <div class="slider-group">
      <label>Roughness <span id="s1RoughVal">0.05</span></label>
      <input type="range" id="s1Rough" min="0" max="100" value="5">
    </div>
    <div class="slider-group">
      <label>Reflectivity <span id="s1ReflectVal">1.00</span></label>
      <input type="range" id="s1Reflect" min="0" max="100" value="100">
    </div>
    <div class="slider-group">
      <label>Micro Surface <span id="s1MicroVal">1.00</span></label>
      <input type="range" id="s1Micro" min="10" max="100" value="100">
    </div>
    <div class="color-row">
      <label>Albedo Color</label>
      <input type="color" id="s1Color" value="#c0c8d8">
    </div>
    <div class="slider-group">
      <label>Height <span id="s1HeightVal">5.0</span></label>
      <input type="range" id="s1Height" min="20" max="120" value="50">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Sphere 2 — Gold</div>
    <div class="slider-group">
      <label>Metallic <span id="s2MetalVal">1.00</span></label>
      <input type="range" id="s2Metal" min="0" max="100" value="100">
    </div>
    <div class="slider-group">
      <label>Roughness <span id="s2RoughVal">0.15</span></label>
      <input type="range" id="s2Rough" min="0" max="100" value="15">
    </div>
    <div class="slider-group">
      <label>Reflectivity <span id="s2ReflectVal">1.00</span></label>
      <input type="range" id="s2Reflect" min="0" max="100" value="100">
    </div>
    <div class="slider-group">
      <label>Micro Surface <span id="s2MicroVal">1.00</span></label>
      <input type="range" id="s2Micro" min="10" max="100" value="100">
    </div>
    <div class="color-row">
      <label>Albedo Color</label>
      <input type="color" id="s2Color" value="#d4a030">
    </div>
    <div class="slider-group">
      <label>Height <span id="s2HeightVal">4.0</span></label>
      <input type="range" id="s2Height" min="20" max="120" value="40">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Environment</div>
    <div class="slider-group">
      <label>Time of Day <span id="todVal">Afternoon</span></label>
      <input type="range" id="tod" min="0" max="100" value="35">
    </div>
    <div class="slider-group">
      <label>Environment Intensity <span id="envIntVal">1.00</span></label>
      <input type="range" id="envInt" min="10" max="200" value="100">
    </div>
    <div class="slider-group">
      <label>Bloom Intensity <span id="bloomVal">0.40</span></label>
      <input type="range" id="bloom" min="0" max="100" value="40">
    </div>
    <div class="slider-group">
      <label>Exposure <span id="exposureVal">1.00</span></label>
      <input type="range" id="exposure" min="20" max="200" value="100">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Scene Info</div>
    <div class="info-row"><span>Reflection Resolution</span><span class="val">512px</span></div>
    <div class="info-row"><span>Reflection Refresh</span><span class="val">Every frame</span></div>
    <div class="info-row"><span>PBR Model</span><span class="val">GGX / Cook-Torrance</span></div>
    <div class="info-row"><span>Tone Mapping</span><span class="val">ACES</span></div>
  </div>
</div>

<div id="hint">Drag to orbit · Scroll to zoom · Right-click to pan</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════
   ENGINE & SCENE
   ═══════════════════════════════════════════ */
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, {
  stencil: true,
  adaptToDeviceRatio: true,
});

const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(.05,.08,.15,1);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = .003;
scene.fogColor = new BABYLON.Color3(.15,.2,.3);

/* ACES tone mapping for cinematic look */
scene.imageProcessingConfiguration.toneMappingEnabled = true;
scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
scene.imageProcessingConfiguration.exposure = 1.0;
scene.imageProcessingConfiguration.contrast = 1.1;
scene.imageProcessingConfiguration.vignetteEnabled = true;
scene.imageProcessingConfiguration.vignetteWeight = 1.5;
scene.imageProcessingConfiguration.vignetteColor = new BABYLON.Color4(0,0,0,0);
scene.imageProcessingConfiguration.vignetteCameraFov = 1.2;

/* ═══════════════════════════════════════════
   CAMERA
   ═══════════════════════════════════════════ */
const camera = new BABYLON.ArcRotateCamera('cam',
  -Math.PI/3, Math.PI/3.5, 45,
  new BABYLON.Vector3(0, 4, 0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 10;
camera.upperRadiusLimit = 150;
camera.wheelPrecision = 8;
camera.panningSensibility = 600;
camera.minZ = .5;
camera.maxZ = 500;

/* ═══════════════════════════════════════════
   LIGHTING
   ═══════════════════════════════════════════ */
const hemi = new BABYLON.HemisphericLight('hemi',
  new BABYLON.Vector3(0,1,0), scene);
hemi.intensity = .4;
hemi.diffuse = new BABYLON.Color3(.6,.7,.9);
hemi.groundColor = new BABYLON.Color3(.15,.18,.12);

const sun = new BABYLON.DirectionalLight('sun',
  new BABYLON.Vector3(-.5,-1,.3), scene);
sun.position = new BABYLON.Vector3(40,60,-20);
sun.intensity = 1.5;
sun.diffuse = new BABYLON.Color3(1,.95,.85);
sun.specular = new BABYLON.Color3(.3,.3,.35);

/* Shadows */
const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
shadowGen.useBlurExponentialShadowMap = true;
shadowGen.blurKernel = 12;
shadowGen.darkness = .35;
shadowGen.transparencyShadow = true;

/* ═══════════════════════════════════════════
   ENVIRONMENT TEXTURE (Procedural Cube Map)
   ═══════════════════════════════════════════ */
function createProceduralEnvTexture(){
  const size = 512;
  const envTexture = new BABYLON.CubeTexture.CreateFromBase64String(
    'envTexture',
    /* We'll use a dynamic texture approach instead — create a reflection probe */
    '', scene
  );
  return null; /* We'll use reflection probes instead */
}

/* ═══════════════════════════════════════════
   MATERIALS
   ═══════════════════════════════════════════ */
function pbrMat(name){
  return new BABYLON.PBRMaterial(name, scene);
}

/* Sphere 1 — Chrome PBR */
const sphere1Mat = pbrMat('sphere1Mat');
sphere1Mat.metallic = 1.0;
sphere1Mat.roughness = 0.05;
sphere1Mat.albedoColor = new BABYLON.Color3(.75,.78,.85);
sphere1Mat.reflectivityColor = new BABYLON.Color3(1,1,1);
sphere1Mat.microSurface = 1.0;
sphere1Mat.environmentIntensity = 1.0;

/* Sphere 2 — Gold PBR */
const sphere2Mat = pbrMat('sphere2Mat');
sphere2Mat.metallic = 1.0;
sphere2Mat.roughness = 0.15;
sphere2Mat.albedoColor = new BABYLON.Color3(.83,.63,.19);
sphere2Mat.reflectivityColor = new BABYLON.Color3(1,.85,.3);
sphere2Mat.microSurface = 1.0;
sphere2Mat.environmentIntensity = 1.0;

/* Street materials */
const roadMat = pbrMat('roadMat');
roadMat.albedoColor = new BABYLON.Color3(.18,.18,.2);
roadMat.metallic = 0;
roadMat.roughness = .85;

const sidewalkMat = pbrMat('sidewalkMat');
sidewalkMat.albedoColor = new BABYLON.Color3(.45,.42,.38);
sidewalkMat.metallic = 0;
sidewalkMat.roughness = .7;

const buildingMat1 = pbrMat('buildingMat1');
buildingMat1.albedoColor = new BABYLON.Color3(.55,.48,.4);
buildingMat1.metallic = 0;
buildingMat1.roughness = .65;

const buildingMat2 = pbrMat('buildingMat2');
buildingMat2.albedoColor = new BABYLON.Color3(.4,.45,.5);
buildingMat2.metallic = 0;
buildingMat2.roughness = .6;

const buildingMat3 = pbrMat('buildingMat3');
buildingMat3.albedoColor = new BABYLON.Color3(.6,.55,.48);
buildingMat3.metallic = 0;
buildingMat3.roughness = .7;

const windowMat = pbrMat('windowMat');
windowMat.albedoColor = new BABYLON.Color3(.15,.2,.3);
windowMat.metallic = .9;
windowMat.roughness = .1;
windowMat.reflectivityColor = new BABYLON.Color3(.3,.4,.6);

const windowLitMat = pbrMat('windowLitMat');
windowLitMat.albedoColor = new BABYLON.Color3(.9,.8,.4);
windowLitMat.emissiveColor = new BABYLON.Color3(.4,.35,.15);
windowLitMat.metallic = .3;
windowLitMat.roughness = .3;

const glassMat = pbrMat('glassMat');
glassMat.albedoColor = new BABYLON.Color3(.1,.15,.25);
glassMat.metallic = .95;
glassMat.roughness = .05;
glassMat.alpha = .3;
glassMat.reflectivityColor = new BABYLON.Color3(.5,.6,.8);

const lampMat = pbrMat('lampMat');
lampMat.albedoColor = new BABYLON.Color3(.2,.2,.22);
lampMat.metallic = .8;
lampMat.roughness = .3;

const lampLightMat = pbrMat('lampLightMat');
lampLightMat.emissiveColor = new BABYLON.Color3(1,.9,.5);
lampLightMat.albedoColor = new BABYLON.Color3(1,.9,.5);

const grassMat = pbrMat('grassMat');
grassMat.albedoColor = new BABYLON.Color3(.2,.4,.15);
grassMat.metallic = 0;
grassMat.roughness = .9;

const carBodyMat1 = pbrMat('carBodyMat1');
carBodyMat1.albedoColor = new BABYLON.Color3(.8,.15,.15);
carBodyMat1.metallic = .85;
carBodyMat1.roughness = .15;

const carBodyMat2 = pbrMat('carBodyMat2');
carBodyMat2.albedoColor = new BABYLON.Color3(.15,.2,.6);
carBodyMat2.metallic = .8;
carBodyMat2.roughness = .2;

const carBodyMat3 = pbrMat('carBodyMat3');
carBodyMat3.albedoColor = new BABYLON.Color3(.15,.15,.18);
carBodyMat3.metallic = .7;
carBodyMat3.roughness = .25;

const carGlassMat = pbrMat('carGlassMat');
carGlassMat.albedoColor = new BABYLON.Color3(.1,.15,.25);
carGlassMat.metallic = .9;
carGlassMat.roughness = .1;
carGlassMat.alpha = .4;

const treeTrunkMat = pbrMat('treeTrunkMat');
treeTrunkMat.albedoColor = new BABYLON.Color3(.3,.2,.1);
treeTrunkMat.metallic = 0;
treeTrunkMat.roughness = .9;

const treeLeafMat = pbrMat('treeLeafMat');
treeLeafMat.albedoColor = new BABYLON.Color3(.15,.35,.1);
treeLeafMat.metallic = 0;
treeLeafMat.roughness = .8;

const lineMat = pbrMat('lineMat');
lineMat.albedoColor = new BABYLON.Color3(.9,.85,.3);
lineMat.emissiveColor = new BABYLON.Color3(.15,.12,.03);
lineMat.metallic = 0;
lineMat.roughness = .5;

/* ═══════════════════════════════════════════
   STREET SCENE
   ═══════════════════════════════════════════ */

/* Ground plane */
const ground = BABYLON.MeshBuilder.CreateGround('ground',
  {width:200, height:200, subdivisions:4}, scene);
ground.material = grassMat;
ground.receiveShadows = true;
ground.position.y = -.01;

/* Road */
const road = BABYLON.MeshBuilder.CreateGround('road',
  {width:12, height:120}, scene);
road.material = roadMat;
road.receiveShadows = true;
road.position.y = .01;

/* Sidewalks */
for(let side=-1;side<=1;side+=2){
  const sw = BABYLON.MeshBuilder.CreateBox('sw'+side,
    {width:2.5, height:.2, depth:120}, scene);
  sw.material = sidewalkMat;
  sw.position.set(side*7.25, .1, 0);
  sw.receiveShadows = true;
  shadowGen.addShadowCaster(sw);
}

/* Road lane markings */
for(let z=-55;z<=55;z+=4){
  const line = BABYLON.MeshBuilder.CreateBox('line'+z,
    {width:.15, height:.02, depth:2}, scene);
  line.material = lineMat;
  line.position.set(0, .03, z);
}

/* Center double yellow line */
for(let z=-55;z<=55;z+=4){
  const l1 = BABYLON.MeshBuilder.CreateBox('cy1_'+z,
    {width:.1, height:.02, depth:2.5}, scene);
  l1.material = lineMat;
  l1.position.set(-.2, .03, z);
  const l2 = BABYLON.MeshBuilder.CreateBox('cy2_'+z,
    {width:.1, height:.02, depth:2.5}, scene);
  l2.material = lineMat;
  l2.position.set(.2, .03, z);
}

/* ═══════════════════════════════════════════
   BUILDINGS
   ═══════════════════════════════════════════ */
const buildingMats = [buildingMat1, buildingMat2, buildingMat3];

function createBuilding(x, z, w, d, h, matIdx){
  const bldg = BABYLON.MeshBuilder.CreateBox('bldg_'+x+'_'+z,
    {width:w, height:h, depth:d}, scene);
  bldg.position.set(x, h/2, z);
  bldg.material = buildingMats[matIdx % 3];
  bldg.receiveShadows = true;
  shadowGen.addShadowCaster(bldg);

  /* Windows */
  const windowRows = Math.floor(h / 3);
  const windowCols = Math.floor(w / 2.5);

  for(let row=0; row<windowRows; row++){
    for(let col=0; col<windowCols; col++){
      const isLit = Math.random() > .5;
      const win = BABYLON.MeshBuilder.CreateBox('win',
        {width:1.2, height:1.5, depth:.1}, scene);
      win.material = isLit ? windowLitMat : windowMat;

      /* Front face */
      win.position.set(
        x - w/2 + 1.5 + col * 2.5,
        2 + row * 3,
        z + d/2 + .06
      );

      /* Back face */
      const win2 = win.clone('win2');
      win2.position.z = z - d/2 - .06;
      win2.rotation.y = Math.PI;
    }
  }

  /* Glass facade for some buildings */
  if(matIdx === 1 && h > 15){
    const glass = BABYLON.MeshBuilder.CreateBox('glass_'+x+'_'+z,
      {width:w-.2, height:h*.6, depth:.05}, scene);
    glass.position.set(x, h*.5, z+d/2+.03);
    glass.material = glassMat;
  }

  return bldg;
}

/* Left side buildings */
const leftBuildings = [
  {z:-40, w:10, d:12, h:18},
  {z:-22, w:8, d:10, h:12},
  {z:-6, w:12, d:14, h:25},
  {z:12, w:9, d:11, h:15},
  {z:28, w:11, d:13, h:22},
  {z:46, w:8, d:10, h:10},
];
leftBuildings.forEach((b,i) => {
  createBuilding(-16, b.z, b.w, b.d, b.h, i);
});

/* Right side buildings */
const rightBuildings = [
  {z:-38, w:9, d:11, h:14},
  {z:-20, w:11, d:13, h:20},
  {z:-2, w:8, d:10, h:10},
  {z:14, w:12, d:14, h:28},
  {z:32, w:10, d:12, h:16},
  {z:48, w:9, d:11, h:13},
];
rightBuildings.forEach((b,i) => {
  createBuilding(16, b.z, b.w, b.d, b.h, (i+1)%3);
});

/* ═══════════════════════════════════════════
   STREET LAMPS
   ═══════════════════════════════════════════ */
function createStreetLamp(x, z){
  const group = new BABYLON.TransformNode('lamp_'+x+'_'+z, scene);

  /* Pole */
  const pole = BABYLON.MeshBuilder.CreateCylinder('pole',
    {height:6, diameter:.15, tessellation:8}, scene);
  pole.material = lampMat;
  pole.position.set(x, 3, z);
  pole.parent = group;
  shadowGen.addShadowCaster(pole);

  /* Arm */
  const arm = BABYLON.MeshBuilder.CreateBox('arm',
    {width:1.5, height:.08, depth:.08}, scene);
  arm.material = lampMat;
  arm.position.set(x + (x>0?-.75:.75), 6, z);
  arm.parent = group;

  /* Lamp head */
  const head = BABYLON.MeshBuilder.CreateSphere('head',
    {diameter:.5, segments:6}, scene);
  head.material = lampLightMat;
  head.position.set(x + (x>0?-1.5:1.5), 5.9, z);
  head.parent = group;

  /* Lamp light */
  const lampLight = new BABYLON.PointLight('lampLight_'+x+'_'+z,
    new BABYLON.Vector3(x + (x>0?-1.5:1.5), 5.7, z), scene);
  lampLight.diffuse = new BABYLON.Color3(1,.9,.5);
  lampLight.intensity = .6;
  lampLight.range = 15;
  lampLight.parent = group;

  return group;
}

for(let z=-45;z<=45;z+=15){
  createStreetLamp(-8.5, z);
  createStreetLamp(8.5, z);
}

/* ═══════════════════════════════════════════
   TREES
   ═══════════════════════════════════════════ */
function createTree(x, z){
  const group = new BABYLON.TransformNode('tree_'+x+'_'+z, scene);

  /* Trunk */
  const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk',
    {height:3, diameterTop:.2, diameterBottom:.4, tessellation:6}, scene);
  trunk.material = treeTrunkMat;
  trunk.position.set(x, 1.5, z);
  trunk.parent = group;
  shadowGen.addShadowCaster(trunk);

  /* Foliage layers */
  for(let i=0;i<3;i++){
    const foliage = BABYLON.MeshBuilder.CreateSphere('foliage',
      {diameter:2.5-i*.5, segments:6}, scene);
    foliage.material = treeLeafMat;
    foliage.position.set(x, 3.5+i*1.2, z);
    foliage.scaling.y = .7;
    foliage.parent = group;
    shadowGen.addShadowCaster(foliage);
  }

  return group;
}

for(let z=-40;z<=40;z+=12){
  createTree(-5.5, z + Math.random()*2);
  createTree(5.5, z + Math.random()*2);
}

/* ═══════════════════════════════════════════
   PARKED CARS
   ═══════════════════════════════════════════ */
function createCar(x, z, rotY, carMat){
  const group = new BABYLON.TransformNode('car_'+x+'_'+z, scene);

  /* Body */
  const body = BABYLON.MeshBuilder.CreateBox('carBody',
    {width:1.8, height:.8, depth:4}, scene);
  body.material = carMat;
  body.position.set(x, .6, z);
  body.parent = group;
  shadowGen.addShadowCaster(body);

  /* Cabin */
  const cabin = BABYLON.MeshBuilder.CreateBox('cabin',
    {width:1.6, height:.7, depth:2}, scene);
  cabin.material = carMat;
  cabin.position.set(x, 1.35, z-.2);
  cabin.parent = group;
  shadowGen.addShadowCaster(cabin);

  /* Windows */
  const winF = BABYLON.MeshBuilder.CreateBox('carWinF',
    {width:1.5, height:.6, depth:.05}, scene);
  winF.material = carGlassMat;
  winF.position.set(x, 1.35, z+.8);
  winF.rotation.x = .3;
  winF.parent = group;

  const winB = BABYLON.MeshBuilder.CreateBox('carWinB',
    {width:1.5, height:.6, depth:.05}, scene);
  winB.material = carGlassMat;
  winB.position.set(x, 1.35, z-1.2);
  winB.rotation.x = -.3;
  winB.parent = group;

  /* Wheels */
  const wheelPositions = [
    [x-.9, .25, z+1.2], [x+.9, .25, z+1.2],
    [x-.9, .25, z-1.2], [x+.9, .25, z-1.2]
  ];
  wheelPositions.forEach((wp,i) => {
    const wheel = BABYLON.MeshBuilder.CreateCylinder('wheel'+i,
      {height:.2, diameter:.5, tessellation:12}, scene);
    wheel.material = lampMat;
    wheel.position.set(wp[0], wp[1], wp[2]);
    wheel.rotation.z = Math.PI/2;
    wheel.parent = group;
  });

  /* Headlights */
  for(let side=-1;side<=1;side+=2){
    const hl = BABYLON.MeshBuilder.CreateSphere('hl',
      {diameter:.2, segments:4}, scene);
    hl.material = lampLightMat;
    hl.position.set(x+side*.7, .6, z+2);
    hl.parent = group;
  }

  group.rotation.y = rotY || 0;
  return group;
}

function createSky(){
  const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
  skyMat.backFaceCulling = false;
  skyMat.disableLighting = true;

  /* Procedural sky gradient using dynamic texture */
  const skyTex = new BABYLON.DynamicTexture('skyTex', {width:2, height:512}, scene, false);
  const ctx = skyTex.getContext();
  const grad = ctx.createLinearGradient(0,0,0,512);
  grad.addColorStop(0, '#0a1530');
  grad.addColorStop(.3, '#1a3060');
  grad.addColorStop(.5, '#3a6090');
  grad.addColorStop(.7, '#6a90b8');
  grad.addColorStop(.85, '#a0b8d0');
  grad.addColorStop(1, '#c8d8e8');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,2,512);
  skyTex.update();

  skyMat.emissiveTexture = skyTex;
  skyMat.emissiveColor = new BABYLON.Color3(.6,.7,.85);

  const sky = BABYLON.MeshBuilder.CreateBox('sky', {size:400}, scene);
  sky.material = skyMat;
  sky.infiniteDistance = true;

  return { sky, skyMat, skyTex };
}
const skyObj = createSky();

function hexToColor3(hex){
  const r = parseInt(hex.substr(1,2),16)/255;
  const g = parseInt(hex.substr(3,2),16)/255;
  const b = parseInt(hex.substr(5,2),16)/255;
  return new BABYLON.Color3(r,g,b);
}

/* Environment controls */
document.getElementById('tod').addEventListener('input', function(){
  const t = this.value/100;
  let label;
  if(t<.15) label='Dawn';
  else if(t<.4) label='Morning';
  else if(t<.55) label='Noon';
  else if(t<.7) label='Afternoon';
  else if(t<.85) label='Dusk';
  else label='Night';
  document.getElementById('todVal').textContent = label;

  /* Adjust sun */
  const sunAngle = t * Math.PI;
  sun.direction = new BABYLON.Vector3(
    -Math.cos(sunAngle),
    -Math.sin(sunAngle)*.8 - .2,
    .3
  );

  /* Adjust sun intensity and color */
  const dayFactor = Math.max(0, Math.sin(sunAngle));
  sun.intensity = .3 + dayFactor * 1.5;
  sun.diffuse = new BABYLON.Color3(
    .5 + dayFactor*.5,
    .4 + dayFactor*.55,
    .3 + dayFactor*.55
  );

  /* Adjust hemi */
  hemi.intensity = .15 + dayFactor * .35;

  /* Adjust sky */
  skyObj.skyMat.emissiveColor = new BABYLON.Color3(
    .15 + dayFactor*.5,
    .2 + dayFactor*.5,
    .3 + dayFactor*.55
  );

  /* Adjust scene clear color */
  scene.clearColor = new BABYLON.Color4(
    .02 + dayFactor*.05,
    .03 + dayFactor*.06,
    .08 + dayFactor*.1,
    1
  );

  /* Adjust fog */
  scene.fogColor = new BABYLON.Color3(
    .08 + dayFactor*.12,
    .12 + dayFactor*.15,
    .2 + dayFactor*.15
  );

  /* Adjust lamp intensity (brighter at night) */
  scene.lights.forEach(l => {
    if(l.name && l.name.includes('lampLight')){
      l.intensity = .2 + (1-dayFactor) * .8;
    }
  });

  /* Adjust window lit emissive */
  windowLitMat.emissiveColor = new BABYLON.Color3(
    .1 + (1-dayFactor)*.5,
    .08 + (1-dayFactor)*.45,
    .03 + (1-dayFactor)*.2
  );
});

/* ═══════════════════════════════════════════
   ANIMATION LOOP
   ═══════════════════════════════════════════ */
let frameCount = 0;
let fpsTime = performance.now();

scene.registerBeforeRender(() => {
  const t = performance.now() / 1000;

  /* Gentle sphere bobbing */
  sphere1.position.y = parseFloat(document.getElementById('s1Height').value)/10
    + Math.sin(t * .8) * .15;
  sphere2.position.y = parseFloat(document.getElementById('s2Height').value)/10
    + Math.sin(t * .8 + 1.5) * .12;

  /* Update glow light positions */
  s1Glow.position.x = sphere1.position.x;
  s1Glow.position.y = sphere1.position.y;
  s1Glow.position.z = sphere1.position.z;
  s2Glow.position.x = sphere2.position.x;
  s2Glow.position.y = sphere2.position.y;
  s2Glow.position.z = sphere2.position.z;

  /* Pulse glow lights */
  s1Glow.intensity = .25 + Math.sin(t*2)*.1;
  s2Glow.intensity = .25 + Math.sin(t*2+1)*.1;

  /* FPS counter */
  frameCount++;
  const now = performance.now();
  if(now - fpsTime >= 1000){
    document.getElementById('fps').textContent = frameCount + ' FPS';
    frameCount = 0;
    fpsTime = now;
  }
});

engine.runRenderLoop(() => scene.render());
