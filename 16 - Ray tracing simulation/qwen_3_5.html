<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js Real-Time Ray Tracing Simulation</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #4db8ff;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #ccc;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #4db8ff;
        }
        .value-display {
            float: right;
            color: #4db8ff;
            font-weight: bold;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5rem;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Babylon.js Loaders (for GLTF/Environment) -->
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- Babylon.js Serializers -->
    <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
    <!-- Babylon.js GUI (Optional but good for structure) -->
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>

    <div id="loading" class="loading">Loading Ray Tracing Engine...</div>

    <div id="ui-panel">
        <h2>Material Properties</h2>
        
        <div class="control-group">
            <label>Metallic <span id="val-metallic" class="value-display">1.0</span></label>
            <input type="range" id="inp-metallic" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="control-group">
            <label>Roughness <span id="val-roughness" class="value-display">0.1</span></label>
            <input type="range" id="inp-roughness" min="0" max="1" step="0.01" value="0.1">
        </div>

        <div class="control-group">
            <label>Reflectivity <span id="val-reflectivity" class="value-display">1.0</span></label>
            <input type="range" id="inp-reflectivity" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="control-group">
            <label>Albedo Color</label>
            <input type="color" id="inp-color" value="#ffffff" style="width:100%; height:30px; border:none;">
        </div>

        <div class="control-group">
            <label>Ray Tracing Samples <span id="val-samples" class="value-display">4</span></label>
            <input type="range" id="inp-samples" min="1" max="16" step="1" value="4">
            <div style="font-size:0.7rem; color:#888; margin-top:5px;">Higher samples = clearer reflections but slower FPS</div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // UI Elements
        const ui = {
            metallic: document.getElementById('inp-metallic'),
            roughness: document.getElementById('inp-roughness'),
            reflectivity: document.getElementById('inp-reflectivity'),
            color: document.getElementById('inp-color'),
            samples: document.getElementById('inp-samples'),
            vals: {
                metallic: document.getElementById('val-metallic'),
                roughness: document.getElementById('val-roughness'),
                reflectivity: document.getElementById('val-reflectivity'),
                samples: document.getElementById('val-samples'),
            }
        };

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            
            // Enable Ray Tracing
            // Note: This requires hardware support. If not available, Babylon falls back gracefully 
            // but the visual fidelity of reflections will be standard rasterization.
            const rt = new BABYLON.RayTracingScene(scene);
            rt.maxRecursion = 4;
            rt.samples = 4; // Default samples

            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 15, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 5;
            camera.upperRadiusLimit = 50;
            camera.wheelPrecision = 50;

            // Environment (Street Scene)
            // Using a high-quality HDRI from Poly Haven (CC0) representing a street/urban environment
            const envTexture = await BABYLON.CubeTexture.CreateFromPrefilteredDataAsync("https://assets.babylonjs.com/environments/environmentSpecular.env", scene);
            scene.environmentTexture = envTexture;
            scene.createDefaultSkybox(envTexture, true, 1000, 0.2);

            // Lighting (Subtle fill light to ensure shadows aren't pitch black if HDRI is dark in spots)
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.3;

            // Create Spheres
            const sphere1 = BABYLON.MeshBuilder.CreateSphere("sphere1", {diameter: 4, segments: 64}, scene);
            sphere1.position = new BABYLON.Vector3(-3, 2, 0);
            
            const sphere2 = BABYLON.MeshBuilder.CreateSphere("sphere2", {diameter: 3, segments: 64}, scene);
            sphere2.position = new BABYLON.Vector3(3, 3, 0);

            // Create PBR Material
            const pbr = new BABYLON.PBRMaterial("pbr", scene);
            pbr.reflectionColor = new BABYLON.Color3(1, 1, 1);
            pbr.metallic = 1.0;
            pbr.roughness = 0.1;
            pbr.reflectivityColor = new BABYLON.Color3(1, 1, 1);
            pbr.enableEnvironmentReflection = true;
            pbr.useRadianceOverAlpha = false;
            pbr.useSpecularOverAlpha = false;

            sphere1.material = pbr;
            sphere2.material = pbr.clone("pbr2");

            // Animation Loop for subtle floating motion
            scene.registerBeforeRender(() => {
                const time = Date.now() * 0.001;
                sphere1.position.y = 2 + Math.sin(time) * 0.5;
                sphere2.position.y = 3 + Math.cos(time * 0.8) * 0.5;
                
                // Slow rotation to show off reflections
                sphere1.rotation.y += 0.005;
                sphere2.rotation.y -= 0.005;
            });

            // UI Event Listeners
            ui.metallic.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                pbr.metallic = val;
                sphere2.material.metallic = val;
                ui.vals.metallic.innerText = val.toFixed(2);
            });

            ui.roughness.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                pbr.roughness = val;
                sphere2.material.roughness = val;
                ui.vals.roughness.innerText = val.toFixed(2);
            });

            ui.reflectivity.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                pbr.reflectivityColor = new BABYLON.Color3(val, val, val);
                sphere2.material.reflectivityColor = new BABYLON.Color3(val, val, val);
                ui.vals.reflectivity.innerText = val.toFixed(2);
            });

            ui.color.addEventListener('input', (e) => {
                const val = BABYLON.Color3.FromHexString(e.target.value);
                pbr.albedoColor = val;
                sphere2.material.albedoColor = val;
            });

            ui.samples.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                rt.samples = val;
                ui.vals.samples.innerText = val;
            });

            // Hide loading screen
            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => document.getElementById('loading').style.display = 'none', 500);

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(function () {
                scene.render();
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
