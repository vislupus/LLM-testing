<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Ray Tracing Simulation</title>
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }

        /* Floating UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            color: #ecf0f1;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        #ui-panel h2 {
            margin: 0 0 20px 0;
            font-size: 20px;
            font-weight: 600;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 16px;
            color: #f1c40f;
            margin: 20px 0 10px 0;
            font-weight: bold;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 13px;
            color: #bdc3c7;
        }

        .control-value {
            color: #fff;
            font-weight: bold;
        }

        input[type=range] {
            width: 100%;
            appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #00d2ff;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        input[type=color] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">Loading Ray Tracing Environment...</div>
    <canvas id="renderCanvas"></canvas>

    <div id="ui-panel">
        <h2>PBR Materials</h2>
        
        <!-- Sphere 1 Controls -->
        <div class="section-title">Sphere 1 (Left)</div>
        <div class="control-group">
            <div class="control-header">
                <span>Color</span>
            </div>
            <input type="color" id="s1-color" value="#ffffff">
        </div>
        <div class="control-group">
            <div class="control-header">
                <span>Roughness (Microfacets)</span>
                <span class="control-value" id="s1-rough-val">0.00</span>
            </div>
            <input type="range" id="s1-rough" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="control-group">
            <div class="control-header">
                <span>Metallic</span>
                <span class="control-value" id="s1-metal-val">1.00</span>
            </div>
            <input type="range" id="s1-metal" min="0" max="1" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <div class="control-header">
                <span>Clear Coat Intensity</span>
                <span class="control-value" id="s1-coat-val">0.00</span>
            </div>
            <input type="range" id="s1-coat" min="0" max="1" step="0.01" value="0.0">
        </div>

        <!-- Sphere 2 Controls -->
        <div class="section-title">Sphere 2 (Right)</div>
        <div class="control-group">
            <div class="control-header">
                <span>Color</span>
            </div>
            <input type="color" id="s2-color" value="#ffaa00">
        </div>
        <div class="control-group">
            <div class="control-header">
                <span>Roughness (Microfacets)</span>
                <span class="control-value" id="s2-rough-val">0.00</span>
            </div>
            <input type="range" id="s2-rough" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="control-group">
            <div class="control-header">
                <span>Metallic</span>
                <span class="control-value" id="s2-metal-val">1.00</span>
            </div>
            <input type="range" id="s2-metal" min="0" max="1" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <div class="control-header">
                <span>Clear Coat Intensity</span>
                <span class="control-value" id="s2-coat-val">0.00</span>
            </div>
            <input type="range" id="s2-coat" min="0" max="1" step="0.01" value="0.0">
        </div>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

            // --- CAMERA ---
            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2.5, Math.PI / 2.2, 12, new BABYLON.Vector3(0, 2, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 30;
            camera.minZ = 0.1;
            camera.lowerRadiusLimit = 5;
            camera.upperRadiusLimit = 30;

            // --- LIGHTING & ENVIRONMENT ---
            // Use a publicly available HDR street/country environment
            const envUrl = "https://playground.babylonjs.com/textures/country.env";
            
            // createDefaultEnvironment sets up the Skybox, Image Based Lighting (IBL), and a Ground
            const envHelper = scene.createDefaultEnvironment({
                environmentTexture: envUrl,
                createSkybox: true,
                skyboxSize: 1000,
                createGround: true,
                groundSize: 100,
                enableGroundShadow: true,
                enableGroundMirror: true, // Acts as a glossy wet street reflection
                groundMirrorSizeRatio: 0.5,
                groundColor: new BABYLON.Color3(0.1, 0.1, 0.1)
            });

            // Adjust ground mirror to look like asphalt
            if(envHelper.groundMaterial) {
                envHelper.groundMaterial.primaryColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                envHelper.groundMaterial.reflectionTexture.level = 0.6; // Reflection strength
            }

            // --- SPHERES ---
            const sphere1 = BABYLON.MeshBuilder.CreateSphere("sphere1", { diameter: 4, segments: 128 }, scene);
            sphere1.position = new BABYLON.Vector3(-2.5, 3, 0);

            const sphere2 = BABYLON.MeshBuilder.CreateSphere("sphere2", { diameter: 4, segments: 128 }, scene);
            sphere2.position = new BABYLON.Vector3(2.5, 3, 0);

            // --- PBR MATERIALS ---
            const pbr1 = new BABYLON.PBRMaterial("pbr1", scene);
            pbr1.albedoColor = BABYLON.Color3.FromHexString("#ffffff");
            pbr1.metallic = 1.0;
            pbr1.roughness = 0.0;
            pbr1.clearCoat.isEnabled = true;
            pbr1.clearCoat.intensity = 0.0;
            sphere1.material = pbr1;

            const pbr2 = new BABYLON.PBRMaterial("pbr2", scene);
            pbr2.albedoColor = BABYLON.Color3.FromHexString("#ffaa00");
            pbr2.metallic = 1.0;
            pbr2.roughness = 0.0;
            pbr2.clearCoat.isEnabled = true;
            pbr2.clearCoat.intensity = 0.0;
            sphere2.material = pbr2;

            // --- REAL-TIME MUTUAL RAY-TRACING REFLECTIONS ---
            // Create Reflection Probes so the spheres reflect each other and the dynamic world in real-time
            const probe1 = new BABYLON.ReflectionProbe("probe1", 512, scene);
            probe1.refreshRate = BABYLON.RenderTargetTexture.REFRESHRATE_RENDER_ONEVERYFRAME;
            probe1.position = sphere1.position;
            // Sphere 1 sees Sphere 2, the skybox, and the ground
            probe1.renderList.push(sphere2, envHelper.skybox, envHelper.ground);
            pbr1.reflectionTexture = probe1.cubeTexture;

            const probe2 = new BABYLON.ReflectionProbe("probe2", 512, scene);
            probe2.refreshRate = BABYLON.RenderTargetTexture.REFRESHRATE_RENDER_ONEVERYFRAME;
            probe2.position = sphere2.position;
            // Sphere 2 sees Sphere 1, the skybox, and the ground
            probe2.renderList.push(sphere1, envHelper.skybox, envHelper.ground);
            pbr2.reflectionTexture = probe2.cubeTexture;

            // --- POST-PROCESSING ---
            const pipeline = new BABYLON.DefaultRenderingPipeline("default", true, scene, [camera]);
            pipeline.samples = 4; // Anti-aliasing
            pipeline.fxaaEnabled = true;
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.8;
            pipeline.bloomWeight = 0.3;
            pipeline.imageProcessingEnabled = true;
            pipeline.imageProcessing.contrast = 1.1;
            pipeline.imageProcessing.exposure = 1.2;

            // --- ANIMATION ---
            // Bob the spheres up and down to show off real-time reflections updating
            let alpha = 0;
            scene.onBeforeRenderObservable.add(() => {
                alpha += 0.015;
                sphere1.position.y = 3 + Math.sin(alpha) * 0.8;
                sphere2.position.y = 3 + Math.cos(alpha) * 0.8;
                
                // Update probe positions to match spheres
                probe1.position = sphere1.position;
                probe2.position = sphere2.position;

                // Slowly rotate the skybox
                if(envHelper.skybox) {
                    envHelper.skybox.rotation.y += 0.001;
                }
            });

            return { scene, pbr1, pbr2 };
        };

        const { scene, pbr1, pbr2 } = createScene();

        // Hide loading text when environment is ready
        scene.executeWhenReady(() => {
            document.getElementById("loading").style.opacity = "0";
            setTimeout(() => document.getElementById("loading").style.display = "none", 500);
        });

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });

        // --- UI EVENT LISTENERS ---
        const bindInput = (id, mat, prop, isColor = false, isClearCoat = false) => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(`${id}-val`);
            
            el.addEventListener("input", (e) => {
                if (isColor) {
                    mat.albedoColor = BABYLON.Color3.FromHexString(e.target.value);
                } else {
                    const val = parseFloat(e.target.value);
                    if (isClearCoat) {
                        mat.clearCoat[prop] = val;
                    } else {
                        mat[prop] = val;
                    }
                    if(valEl) valEl.innerText = val.toFixed(2);
                }
            });
        };

        // Sphere 1
        bindInput("s1-color", pbr1, null, true);
        bindInput("s1-rough", pbr1, "roughness");
        bindInput("s1-metal", pbr1, "metallic");
        bindInput("s1-coat", pbr1, "intensity", false, true);

        // Sphere 2
        bindInput("s2-color", pbr2, null, true);
        bindInput("s2-rough", pbr2, "roughness");
        bindInput("s2-metal", pbr2, "metallic");
        bindInput("s2-coat", pbr2, "intensity", false, true);

    </script>
</body>
</html>
