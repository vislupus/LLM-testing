<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Ray Tracing Simulation</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
        #renderCanvas { width: 100vw; height: 100vh; outline: none; }
        
        #controls {
            position: absolute; top: 15px; right: 15px;
            background: rgba(10, 12, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 14px; padding: 18px; width: 320px;
            color: #e8f0ff; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            max-height: calc(100vh - 30px); overflow-y: auto;
        }
        #controls::-webkit-scrollbar { width: 6px; }
        #controls::-webkit-scrollbar-track { background: transparent; }
        #controls::-webkit-scrollbar-thumb { background: rgba(100,150,255,0.3); border-radius: 3px; }
        
        #controls h2 { font-size: 1.2rem; margin-bottom: 14px; color: #88ccff; letter-spacing: 0.5px; }
        .sphere-section { margin-bottom: 18px; padding: 14px; background: rgba(30, 40, 60, 0.4); border-radius: 10px; border: 1px solid rgba(100, 150, 255, 0.1); }
        .sphere-section h3 { font-size: 1rem; margin-bottom: 10px; color: #ffd966; }
        .control { margin-bottom: 12px; }
        .control label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px; color: #b0c8e0; }
        input[type="range"] { width: 100%; height: 5px; -webkit-appearance: none; appearance: none; background: rgba(100, 150, 255, 0.2); border-radius: 4px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #88ccff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(100, 200, 255, 0.5); }
        input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: #88ccff; border-radius: 50%; cursor: pointer; border: none; }
        input[type="color"] { width: 40px; height: 30px; border: 1px solid rgba(100,150,255,0.3); border-radius: 6px; cursor: pointer; background: transparent; }
        
        #info {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 12, 18, 0.7); color: #88a; padding: 8px 16px; border-radius: 20px;
            font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="controls">
        <h2>🔮 PBR Material Controls</h2>
        
        <div class="sphere-section">
            <h3>🥇 Sphere 1 (Gold)</h3>
            <div class="control">
                <label><span>Metallic</span><span id="val-s1-metallic">1.00</span></label>
                <input type="range" id="s1-metallic" min="0" max="1" step="0.01" value="1.0">
            </div>
            <div class="control">
                <label><span>Roughness</span><span id="val-s1-roughness">0.05</span></label>
                <input type="range" id="s1-roughness" min="0" max="1" step="0.01" value="0.05">
            </div>
            <div class="control">
                <label><span>Albedo Color</span></label>
                <input type="color" id="s1-color" value="#d4af37">
            </div>
            <div class="control">
                <label><span>Clearcoat</span><span id="val-s1-clearcoat">0.50</span></label>
                <input type="range" id="s1-clearcoat" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="control">
                <label><span>Clearcoat Roughness</span><span id="val-s1-clearcoatRough">0.10</span></label>
                <input type="range" id="s1-clearcoatRough" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="control">
                <label><span>Environment Intensity</span><span id="val-s1-env">1.00</span></label>
                <input type="range" id="s1-env" min="0" max="3" step="0.05" value="1.0">
            </div>
        </div>

        <div class="sphere-section">
            <h3>🥈 Sphere 2 (Silver)</h3>
            <div class="control">
                <label><span>Metallic</span><span id="val-s2-metallic">1.00</span></label>
                <input type="range" id="s2-metallic" min="0" max="1" step="0.01" value="1.0">
            </div>
            <div class="control">
                <label><span>Roughness</span><span id="val-s2-roughness">0.05</span></label>
                <input type="range" id="s2-roughness" min="0" max="1" step="0.01" value="0.05">
            </div>
            <div class="control">
                <label><span>Albedo Color</span></label>
                <input type="color" id="s2-color" value="#c0c0c0">
            </div>
            <div class="control">
                <label><span>Clearcoat</span><span id="val-s2-clearcoat">0.30</span></label>
                <input type="range" id="s2-clearcoat" min="0" max="1" step="0.01" value="0.3">
            </div>
            <div class="control">
                <label><span>Clearcoat Roughness</span><span id="val-s2-clearcoatRough">0.15</span></label>
                <input type="range" id="s2-clearcoatRough" min="0" max="1" step="0.01" value="0.15">
            </div>
            <div class="control">
                <label><span>Environment Intensity</span><span id="val-s2-env">1.00</span></label>
                <input type="range" id="s2-env" min="0" max="3" step="0.05" value="1.0">
            </div>
        </div>
    </div>
    
    <div id="info">🖱️ Left-click drag: Orbit | Scroll: Zoom | Right-click drag: Pan</div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.1, 1);
            scene.ambientColor = new BABYLON.Color3(0.2, 0.2, 0.25);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.002;
            scene.fogColor = new BABYLON.Color3(0.1, 0.12, 0.18);
            scene.environmentIntensity = 1.0;

            // Camera
            const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/4, Math.PI/2.5, 35, new BABYLON.Vector3(0, 4, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 8;
            camera.upperRadiusLimit = 80;
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = Math.PI/2.05;
            camera.wheelPrecision = 20;
            camera.panningSensibility = 250;

            // Environment (HDRI-like procedural environment)
            const envTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://playground.babylonjs.com/textures/environment.env", scene);
            scene.environmentTexture = envTexture;
            scene.environmentIntensity = 0.8;

            // Lights
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemi.intensity = 0.5;
            hemi.groundColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            hemi.diffuse = new BABYLON.Color3(0.9, 0.95, 1.0);

            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1.2, -2.5, -1.5), scene);
            sun.position = new BABYLON.Vector3(30, 60, 35);
            sun.intensity = 1.2;
            sun.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
            sun.specular = new BABYLON.Color3(0.3, 0.3, 0.3);

            // Shadow generator
            const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
            shadowGen.useBlurExponentialShadowMap = true;
            shadowGen.blurKernel = 16;
            shadowGen.darkness = 0.6;

            // Fill light
            const fill = new BABYLON.PointLight("fill", new BABYLON.Vector3(-15, 12, 10), scene);
            fill.intensity = 0.25;
            fill.diffuse = new BABYLON.Color3(0.6, 0.7, 0.9);

            const rim = new BABYLON.PointLight("rim", new BABYLON.Vector3(20, 8, -15), scene);
            rim.intensity = 0.18;
            rim.diffuse = new BABYLON.Color3(0.9, 0.7, 0.5);

            // ===== STREET SCENE =====
            const streetGroup = new BABYLON.TransformNode("street", scene);

            // Materials
            const roadMat = new BABYLON.PBRMaterial("roadMat", scene);
            roadMat.albedoColor = new BABYLON.Color3(0.15, 0.15, 0.18);
            roadMat.metallic = 0.0;
            roadMat.roughness = 0.6;

            const sidewalkMat = new BABYLON.PBRMaterial("sidewalkMat", scene);
            sidewalkMat.albedoColor = new BABYLON.Color3(0.55, 0.52, 0.48);
            sidewalkMat.metallic = 0.0;
            sidewalkMat.roughness = 0.75;

            const buildingMats = [];
            const buildingColors = [
                new BABYLON.Color3(0.7, 0.3, 0.25),
                new BABYLON.Color3(0.85, 0.75, 0.5),
                new BABYLON.Color3(0.6, 0.6, 0.65),
                new BABYLON.Color3(0.35, 0.45, 0.6),
                new BABYLON.Color3(0.75, 0.65, 0.55)
            ];
            buildingColors.forEach((c, i) => {
                const m = new BABYLON.PBRMaterial("bldgMat" + i, scene);
                m.albedoColor = c;
                m.metallic = 0.05;
                m.roughness = 0.55;
                buildingMats.push(m);
            });

            const windowMat = new BABYLON.PBRMaterial("winMat", scene);
            windowMat.albedoColor = new BABYLON.Color3(0.1, 0.15, 0.2);
            windowMat.metallic = 0.9;
            windowMat.roughness = 0.1;
            windowMat.emissiveColor = new BABYLON.Color3(0.05, 0.08, 0.1);

            const grassMat = new BABYLON.PBRMaterial("grassMat", scene);
            grassMat.albedoColor = new BABYLON.Color3(0.15, 0.35, 0.12);
            grassMat.metallic = 0.0;
            grassMat.roughness = 0.9;

            // Road
            const road = BABYLON.MeshBuilder.CreateGround("road", {width: 14, height: 120, subdivisions: 8}, scene);
            road.material = roadMat;
            road.receiveShadows = true;
            road.parent = streetGroup;

            // Road markings
            const lineMat = new BABYLON.StandardMaterial("lineMat", scene);
            lineMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.4);
            lineMat.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.1);
            
            for(let i = -55; i <= 55; i += 4) {
                const dash = BABYLON.MeshBuilder.CreateBox("dash", {width: 0.15, height: 0.02, depth: 2.5}, scene);
                dash.position.set(0, 0.01, i);
                dash.material = lineMat;
            }

            // Sidewalks
            [-8, 8].forEach(x => {
                const sw = BABYLON.MeshBuilder.CreateBox("sw", {width: 3, height: 0.3, depth: 120}, scene);
                sw.position.set(x, 0.15, 0);
                sw.material = sidewalkMat;
                sw.receiveShadows = true;
                sw.parent = streetGroup;
            });

            // Curb stones
            [-6.4, 6.4].forEach(x => {
                const curb = BABYLON.MeshBuilder.CreateBox("curb", {width: 0.4, height: 0.4, depth: 120}, scene);
                curb.position.set(x, 0.2, 0);
                curb.material = sidewalkMat;
                curb.parent = streetGroup;
            });

            // Buildings
            const buildingDefs = [
                // Left side
                {x: -10, z: -40, w: 8, d: 10, h: 18, matIdx: 0},
                {x: -10, z: -20, w: 9, d: 12, h: 14, matIdx: 1},
                {x: -10, z: 0, w: 7, d: 10, h: 22, matIdx: 2},
                {x: -10, z: 20, w: 10, d: 12, h: 16, matIdx: 3},
                {x: -10, z: 40, w: 8, d: 10, h: 12, matIdx: 4},
                // Right side
                {x: 10, z: -45, w: 9, d: 12, h: 20, matIdx: 1},
                {x: 10, z: -25, w: 7, d: 10, h: 15, matIdx: 0},
                {x: 10, z: -5, w: 10, d: 14, h: 24, matIdx: 3},
                {x: 10, z: 18, w: 8, d: 10, h: 17, matIdx: 2},
                {x: 10, z: 38, w: 9, d: 12, h: 13, matIdx: 4}
            ];

            buildingDefs.forEach(bd => {
                const bldg = BABYLON.MeshBuilder.CreateBox("bldg", {width: bd.w, height: bd.h, depth: bd.d}, scene);
                bldg.position.set(bd.x, bd.h/2, bd.z);
                bldg.material = buildingMats[bd.matIdx];
                bldg.receiveShadows = true;
                shadowGen.addShadowCaster(bldg);
                bldg.parent = streetGroup;

                // Windows
                const winRows = Math.floor(bd.h / 3.5);
                const winCols = Math.floor(bd.d / 3);
                
                for(let row = 1; row <= winRows; row++) {
                    for(let col = 0; col < winCols; col++) {
                        // Front face
                        if(Math.random() > 0.2) {
                            const win = BABYLON.MeshBuilder.CreateBox("win_f", {width: 1.2, height: 1.8, depth: 0.05}, scene);
                            win.position.set(bd.x - bd.w/2 - 0.05, 2 + (row-1)*3.5, -bd.d/2 + 2 + col*3);
                            win.material = windowMat;
                            if(Math.random() > 0.6) {
                                win.material.emissiveColor = new BABYLON.Color3(0.3, 0.35, 0.2);
                            }
                            win.parent = streetGroup;
                        }
                        // Back face
                        if(Math.random() > 0.2) {
                            const win = BABYLON.MeshBuilder.CreateBox("win_b", {width: 1.2, height: 1.8, depth: 0.05}, scene);
                            win.position.set(bd.x + bd.w/2 + 0.05, 2 + (row-1)*3.5, -bd.d/2 + 2 + col*3);
                            win.material = windowMat;
                            win.parent = streetGroup;
                        }
                    }
                }

                // Roof details
                if(Math.random() > 0.4) {
                    const roofBox = BABYLON.MeshBuilder.CreateBox("roofBox", {width: bd.w * 0.4, height: 2, depth: bd.d * 0.4}, scene);
                    roofBox.position.set(bd.x, bd.h + 1, bd.z);
                    roofBox.material = buildingMats[bd.matIdx];
                    shadowGen.addShadowCaster(roofBox);
                    roofBox.parent = streetGroup;
                }
            });

            // Street lights
            for(let i = -50; i <= 50; i += 12) {
                [-5, 5].forEach(x => {
                    // Pole
                    const pole = BABYLON.MeshBuilder.CreateCylinder("pole", {height: 6, diameter: 0.15, tessellation: 8}, scene);
                    pole.position.set(x, 3, i);
                    pole.material = new BABYLON.PBRMaterial("poleMat", scene);
                    pole.material.metallic = 0.9;
                    pole.material.roughness = 0.2;
                    pole.material.albedoColor = new BABYLON.Color3(0.4, 0.4, 0.4);
                    shadowGen.addShadowCaster(pole);
                    pole.parent = streetGroup;

                    // Arm
                    const arm = BABYLON.MeshBuilder.CreateBox("arm", {width: 1.5, height: 0.1, depth: 0.1}, scene);
                    arm.position.set(x + (x > 0 ? -0.8 : 0.8), 6, i);
                    arm.material = pole.material;
                    arm.parent = streetGroup;

                    // Light fixture
                    const fixture = BABYLON.MeshBuilder.CreateSphere("fixture", {diameter: 0.8, segments: 8}, scene);
                    fixture.position.set(x + (x > 0 ? -1.5 : 1.5), 5.9, i);
                    const fMat = new BABYLON.PBRMaterial("fMat", scene);
                    fMat.albedoColor = new BABYLON.Color3(0.9, 0.95, 1.0);
                    fMat.emissiveColor = new BABYLON.Color3(0.5, 0.5, 0.3);
                    fixture.material = fMat;
                    fixture.parent = streetGroup;

                    // Point light
                    const sl = new BABYLON.PointLight("sl", fixture.position.clone(), scene);
                    sl.intensity = 0.6;
                    sl.diffuse = new BABYLON.Color3(0.8, 0.85, 0.95);
                    sl.range = 12;
                });
            }

            // Trees
            for(let i = -45; i <= 45; i += 18) {
                [-4.5, 4.5].forEach(x => {
                    if(Math.random() > 0.3) {
                        const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height: 4, diameter: 0.3, tessellation: 6}, scene);
                        trunk.position.set(x, 2, i);
                        trunk.material = new BABYLON.PBRMaterial("trunk", scene);
                        trunk.material.albedoColor = new BABYLON.Color3(0.25, 0.15, 0.08);
                        trunk.material.metallic = 0;
                        trunk.material.roughness = 0.9;
                        shadowGen.addShadowCaster(trunk);
                        trunk.parent = streetGroup;

                        const foliage = BABYLON.MeshBuilder.CreateSphere("foliage", {diameter: 4, segments: 10}, scene);
                        foliage.position.set(x, 5.5 + Math.random(), i);
                        foliage.scaling.y = 0.8;
                        foliage.material = grassMat;
                        shadowGen.addShadowCaster(foliage);
                        foliage.parent = streetGroup;
                    }
                });
            }

            // Parked cars
            const carMat = new BABYLON.PBRMaterial("carMat", scene);
            carMat.albedoColor = new BABYLON.Color3(0.2, 0.2, 0.3);
            carMat.metallic = 0.8;
            carMat.roughness = 0.15;

            for(let i = -30; i <= 30; i += 15) {
                [-7.5, 7.5].forEach(x => {
                    if(Math.random() > 0.4) {
                        const car = BABYLON.MeshBuilder.CreateBox("car", {width: 2, height: 1, depth: 4.5}, scene);
                        car.position.set(x, 0.5, i);
                        car.material = new BABYLON.PBRMaterial("carM" + i, scene);
                        car.material.albedoColor = new BABYLON.Color3(Math.random()*0.3+0.1, Math.random()*0.3+0.1, Math.random()*0.3+0.2);
                        car.material.metallic = 0.9;
                        car.material.roughness = 0.1;
                        shadowGen.addShadowCaster(car);
                        car.parent = streetGroup;
                    }
                });
            }

            // Ground plane (extends beyond sidewalk)
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 80, height: 140, subdivisions: 8}, scene);
            ground.position.y = -0.05;
            ground.material = grassMat;
            ground.receiveShadows = true;
            ground.parent = streetGroup;

            // ===== METALLIC SPHERES =====
            const sphere1 = BABYLON.MeshBuilder.CreateSphere("sphere1", {diameter: 3, segments: 64}, scene);
            sphere1.position.set(-4, 7, 5);
            shadowGen.addShadowCaster(sphere1);

            const s1Mat = new BABYLON.PBRMaterial("s1Mat", scene);
            s1Mat.albedoColor = new BABYLON.Color3(0.83, 0.69, 0.22);
            s1Mat.metallic = 1.0;
            s1Mat.roughness = 0.05;
            s1Mat.clearCoat.isEnabled = true;
            s1Mat.clearCoat.intensity = 0.5;
            s1Mat.clearCoat.roughness = 0.1;
            s1Mat.environmentIntensity = 1.0;
            sphere1.material = s1Mat;

            const sphere2 = BABYLON.MeshBuilder.CreateSphere("sphere2", {diameter: 3, segments: 64}, scene);
            sphere2.position.set(4, 9, -3);
            shadowGen.addShadowCaster(sphere2);

            const s2Mat = new BABYLON.PBRMaterial("s2Mat", scene);
            s2Mat.albedoColor = new BABYLON.Color3(0.75, 0.75, 0.75);
            s2Mat.metallic = 1.0;
            s2Mat.roughness = 0.05;
            s2Mat.clearCoat.isEnabled = true;
            s2Mat.clearCoat.intensity = 0.3;
            s2Mat.clearCoat.roughness = 0.15;
            s2Mat.environmentIntensity = 1.0;
            sphere2.material = s2Mat;

            // Pedestal/stand for spheres
            [sphere1, sphere2].forEach(s => {
                const stand = BABYLON.MeshBuilder.CreateCylinder("stand", {height: s.position.y - 1.5, diameter: 0.3, tessellation: 8}, scene);
                stand.position.set(s.position.x, (s.position.y - 1.5)/2, s.position.z);
                stand.material = new BABYLON.PBRMaterial("stand", scene);
                stand.material.metallic = 0.9;
                stand.material.roughness = 0.1;
                stand.material.albedoColor = new BABYLON.Color3(0.3, 0.3, 0.35);
                shadowGen.addShadowCaster(stand);
                stand.parent = streetGroup;
            });

            // ===== SPHERE CONTROLS =====
            const bind = (id, prop, mat, scale=1) => {
                const el = document.getElementById(id);
                const valEl = document.getElementById('val-' + id);
                el.addEventListener('input', (e) => {
                    const v = parseFloat(e.target.value);
                    valEl.textContent = v.toFixed(2);
                    mat[prop] = v;
                });
            };

            bind('s1-metallic', 'metallic', s1Mat);
            bind('s1-roughness', 'roughness', s1Mat);
            bind('s1-clearcoat', 'clearCoat.intensity', s1Mat.clearCoat);
            bind('s1-clearcoatRough', 'clearCoat.roughness', s1Mat.clearCoat);
            bind('s1-env', 'environmentIntensity', s1Mat);
            
            bind('s2-metallic', 'metallic', s2Mat);
            bind('s2-roughness', 'roughness', s2Mat);
            bind('s2-clearcoat', 'clearCoat.intensity', s2Mat.clearCoat);
            bind('s2-clearcoatRough', 'clearCoat.roughness', s2Mat.clearCoat);
            bind('s2-env', 'environmentIntensity', s2Mat);

            // Color pickers
            document.getElementById('s1-color').addEventListener('input', (e) => {
                const c = new BABYLON.Color3.FromHexString(e.target.value);
                s1Mat.albedoColor = c;
            });
            document.getElementById('s2-color').addEventListener('input', (e) => {
                const c = new BABYLON.Color3.FromHexString(e.target.value);
                s2Mat.albedoColor = c;
            });

            // Subtle sphere animation (floating)
            scene.registerBeforeRender(() => {
                const t = performance.now() * 0.001;
                sphere1.position.y = 7 + Math.sin(t * 0.8) * 0.3;
                sphere2.position.y = 9 + Math.sin(t * 1.1 + 1) * 0.4;
                
                sphere1.rotation.y = t * 0.15;
                sphere2.rotation.y = -t * 0.2;
            });

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
