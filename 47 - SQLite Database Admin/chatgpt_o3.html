<!DOCTYPE html><html><head><meta charset="utf-8">
<title>One-File SQLite Admin</title>
<style>
body{font-family:sans-serif;margin:0;display:flex;height:100vh}
#sidebar{width:240px;background:#263238;color:#eee;overflow:auto}
#main{flex:1;display:flex;flex-direction:column}
#toolbar{background:#37474F;color:#fff;padding:6px 8px}
#grid{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #78909C;padding:4px}
textarea{width:100%;height:120px}
.selected{background:#455A64}
</style>
</head><body>
<div id="sidebar"><h3 style="margin:6px">Tables</h3><ul id="tables"></ul></div>
<div id="main">
 <div id="toolbar">
   <button onclick="runSQL()">Run (F5)</button>
   <button onclick="txBegin()">BEGIN</button>
   <button onclick="txCommit()">COMMIT</button>
   <button onclick="txRollback()">ROLLBACK</button>
   <span id="msg"></span>
 </div>
 <div id="grid"></div>
 <textarea id="sql"></textarea>
</div>

<script>
// ---------- init ----------
let db, tablesUl=document.getElementById('tables'), grid=document.getElementById('grid'),
    sqlEl=document.getElementById('sql'), msg=document.getElementById('msg');
init();
async function init(){
  const SQL=await initSqlJs({locateFile: f=>`sql-wasm.wasm`}); // wasm filename same dir
  db=new SQL.Database();
  seed();
  refreshTables();
}
// ---------- seed sample schema ----------
function seed(){
db.run(`
CREATE TABLE customers(id INTEGER PRIMARY KEY, name TEXT NOT NULL, city TEXT);
CREATE TABLE products(id INTEGER PRIMARY KEY, sku TEXT UNIQUE,tprice REAL);
CREATE TABLE orders(id INTEGER PRIMARY KEY, customer_id INT REFERENCES customers(id),
                    created TEXT DEFAULT CURRENT_TIMESTAMP);
CREATE TABLE items(order_id INT REFERENCES orders(id), product_id INT, qty INT CHECK(qty>0),
                   PRIMARY KEY(order_id,product_id));
INSERT INTO customers(name,city) VALUES
 ('Ivan Ivanov','Sofia'),('Maria Petrova','Plovdiv');
INSERT INTO products(sku,tprice)VALUES
 ('ABC-001',19.9),('XYZ-002',2.5);
INSERT INTO orders(customer_id)VALUES(1),(2);
INSERT INTO items VALUES (1,1,2),(1,2,3),(2,2,4);`);
}
// ---------- UI helpers ----------
function refreshTables(){
  tablesUl.innerHTML='';
  db.exec("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").forEach(r=>{
    r.values.forEach(([name])=>{
      const li=document.createElement('li'); li.textContent=name;
      li.onclick=()=>{document.querySelectorAll('#tables li').forEach(el=>el.classList.remove('selected'));
                      li.classList.add('selected'); browse(name)};
      tablesUl.appendChild(li);
    });
  });
}
function browse(tbl){
  const res=db.exec(`SELECT * FROM "${tbl}" LIMIT 200`);
  showResult(res);
}
function showResult(res){
  grid.innerHTML='';
  if(!res.length)return;
  const [cols]=res, head=cols.columns, rows=cols.values;
  const t=document.createElement('table'), thead=t.createTHead(), trHead=thead.insertRow();
  head.forEach(h=>{const th=document.createElement('th'); th.textContent=h; trHead.appendChild(th);});
  const tbody=t.createTBody();
  rows.forEach(r=>{const tr=tbody.insertRow(); r.forEach(c=>{tr.insertCell().textContent=c})});
  grid.appendChild(t);
}
// ---------- SQL console ----------
function runSQL(){
  const txt=sqlEl.value.trim();
  if(!txt)return;
  const t0=performance.now();
  try{
    const res=db.exec(txt);
    const dt=(performance.now()-t0).toFixed(1);
    if(res.length)showResult(res); else grid.innerHTML=`<em>OK (${dt} ms)</em>`;
    log(txt); msg.textContent=`OK ${dt} ms`;
  }catch(e){msg.textContent=e.message;}
}
function log(q){history.push(q);localStorage.setItem('sqlHist',JSON.stringify(history))}
let history=JSON.parse(localStorage.getItem('sqlHist')||'[]'); // simple history
// ---------- tx helpers ----------
function txBegin(){db.run("BEGIN");msg.textContent="BEGIN"}
function txCommit(){db.run("COMMIT");msg.textContent="COMMIT"}
function txRollback(){db.run("ROLLBACK");msg.textContent="ROLLBACK"}
document.addEventListener('keydown',e=>{if(e.key==='F5'){e.preventDefault();runSQL()}});
</script>
</body></html>
