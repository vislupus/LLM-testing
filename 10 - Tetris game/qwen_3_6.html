<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e0e0e0;
    overflow: hidden;
  }
  #game-wrapper {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  #left-panel {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: rgba(20, 20, 35, 0.9);
    border: 1px solid rgba(100, 100, 150, 0.3);
    border-radius: 12px;
    padding: 16px;
    backdrop-filter: blur(10px);
  }
  .panel h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #666;
    margin-bottom: 8px;
  }
  .panel .value {
    font-size: 28px;
    font-weight: 700;
    color: #00e5ff;
  }
  #game-container {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.1), 0 0 80px rgba(0, 229, 255, 0.05);
    border: 2px solid rgba(100, 100, 150, 0.3);
  }
  #game-canvas {
    display: block;
    background: #0d0d15;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 5, 15, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #overlay h1 {
    font-size: 42px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00e5ff, #aa88ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #overlay .subtitle {
    color: #888;
    margin-bottom: 24px;
    font-size: 14px;
  }
  #overlay .final-score {
    font-size: 52px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 32px;
  }
  .btn {
    background: linear-gradient(135deg, #00e5ff, #00b8d4);
    border: none;
    color: #0a0a12;
    padding: 14px 40px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 229, 255, 0.3);
  }
  .btn:active {
    transform: translateY(0);
  }
  #start-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 5, 15, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #start-screen h1 {
    font-size: 52px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00e5ff, #aa88ff, #ff66aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #start-screen p {
    color: #666;
    margin-bottom: 30px;
  }
  #next-canvas {
    display: block;
    margin: 0 auto;
  }
  .controls {
    color: #555;
    font-size: 11px;
    line-height: 1.6;
  }
  .controls div {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  kbd {
    background: rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
  }
  @media (max-width: 600px) {
    #game-wrapper { flex-direction: column; align-items: center; }
    #left-panel { width: 100%; flex-direction: row; }
    .panel { flex: 1; text-align: center; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="left-panel">
    <div class="panel">
      <h3>Score</h3>
      <div class="value" id="score-display">0</div>
    </div>
    <div class="panel">
      <h3>Level</h3>
      <div class="value" id="level-display">1</div>
    </div>
    <div class="panel">
      <h3>Lines</h3>
      <div class="value" id="lines-display">0</div>
    </div>
    <div class="panel">
      <h3>Next</h3>
      <canvas id="next-canvas" width="100" height="80"></canvas>
    </div>
    <div class="panel controls">
      <div><kbd>←</kbd> <kbd>→</kbd> Move</div>
      <div><kbd>↓</kbd> Soft Drop</div>
      <div><kbd>Space</kbd> Hard Drop</div>
      <div><kbd>↑</kbd> Rotate</div>
      <div><kbd>P</kbd> Pause</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="start-screen">
      <h1>TETRIS</h1>
      <p>Stack blocks. Clear lines. Beat your score.</p>
      <button class="btn" onclick="startGame()">PLAY</button>
    </div>
    
    <div id="overlay">
      <h1 id="overlay-title">GAME OVER</h1>
      <div class="subtitle">Final Score</div>
      <div class="final-score" id="final-score">0</div>
      <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
// ===== GAME CONFIGURATION =====
const COLS = 10;
const ROWS = 20;
const BLOCK_SIZE = 30;
const CANVAS_WIDTH = COLS * BLOCK_SIZE;
const CANVAS_HEIGHT = ROWS * BLOCK_SIZE;

const COLORS = {
  I: '#00e5ff',
  O: '#ffeb3b',
  T: '#aa88ff',
  S: '#4caf50',
  Z: '#f44336',
  J: '#2196f3',
  L: '#ff9800'
};

const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1],
      [1, 1]],
  T: [[0, 1, 0],
      [1, 1, 1]],
  S: [[0, 1, 1],
      [1, 1, 0]],
  Z: [[1, 1, 0],
      [0, 1, 1]],
  J: [[1, 0, 0],
      [1, 1, 1]],
  L: [[0, 0, 1],
      [1, 1, 1]]
};

const PIECE_NAMES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

// ===== GAME STATE =====
let grid = [];
let currentPiece = null;
let nextPiece = null;
let score = 0;
let lines = 0;
let level = 1;
let gameRunning = false;
let paused = false;
let dropInterval = 1000;
let lastDrop = 0;
let animationId = null;
let clearingLines = [];
let clearAnimation = 0;
const CLEAR_ANIM_DURATION = 300;
let bag = [];

// Canvas setup
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;

const nextCanvas = document.getElementById('next-canvas');
const nextCtx = nextCanvas.getContext('2d');

// ===== GRID MANAGEMENT =====
function initGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      grid[r][c] = null;
    }
  }
}

// ===== PIECE GENERATION (7-bag system) =====
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getNextPieceName() {
  if (bag.length === 0) {
    bag = shuffleArray([...PIECE_NAMES]);
  }
  return bag.pop();
}

function createPiece(name) {
  const shape = SHAPES[name].map(row => [...row]);
  return {
    name: name,
    shape: shape,
    color: COLORS[name],
    x: Math.floor((COLS - shape[0].length) / 2),
    y: 0
  };
}

// ===== ROTATION =====
function rotatePiece(piece) {
  const rows = piece.shape.length;
  const cols = piece.shape[0].length;
  const rotated = [];
  
  for (let c = 0; c < cols; c++) {
    rotated[c] = [];
    for (let r = rows - 1; r >= 0; r--) {
      rotated[c].push(piece.shape[r][c]);
    }
  }
  return rotated;
}

// ===== COLLISION DETECTION =====
function isValidPosition(piece, shape, offsetX = 0, offsetY = 0) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        const newX = piece.x + c + offsetX;
        const newY = piece.y + r + offsetY;
        
        if (newX < 0 || newX >= COLS || newY >= ROWS) {
          return false;
        }
        if (newY >= 0 && grid[newY][newX]) {
          return false;
        }
      }
    }
  }
  return true;
}

// ===== MOVEMENT & ROTATION =====
function movePiece(dx, dy) {
  if (!currentPiece) return false;
  if (isValidPosition(currentPiece, currentPiece.shape, dx, dy)) {
    currentPiece.x += dx;
    currentPiece.y += dy;
    return true;
  }
  return false;
}

function rotateCurrentPiece() {
  if (!currentPiece || currentPiece.name === 'O') return;
  
  const rotated = rotatePiece(currentPiece);
  const kicks = [0, -1, 1, -2, 2];
  
  for (const kick of kicks) {
    if (isValidPosition(currentPiece, rotated, kick, 0)) {
      currentPiece.shape = rotated;
      currentPiece.x += kick;
      return;
    }
  }
}

function hardDrop() {
  if (!currentPiece) return;
  let dropped = 0;
  while (movePiece(0, 1)) {
    dropped++;
  }
  score += dropped * 2;
  lockPiece();
}

function getGhostY() {
  if (!currentPiece) return 0;
  let ghostY = currentPiece.y;
  while (true) {
    let canMove = true;
    for (let r = 0; r < currentPiece.shape.length; r++) {
      for (let c = 0; c < currentPiece.shape[r].length; c++) {
        if (currentPiece.shape[r][c]) {
          const newX = currentPiece.x + c;
          const newY = ghostY + r + 1;
          if (newY >= ROWS || (newY >= 0 && grid[newY][newX])) {
            canMove = false;
          }
        }
      }
    }
    if (!canMove) break;
    ghostY++;
  }
  return ghostY;
}

// ===== LOCKING PIECES =====
function lockPiece() {
  for (let r = 0; r < currentPiece.shape.length; r++) {
    for (let c = 0; c < currentPiece.shape[r].length; c++) {
      if (currentPiece.shape[r][c]) {
        const y = currentPiece.y + r;
        const x = currentPiece.x + c;
        if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
          grid[y][x] = currentPiece.color;
        }
      }
    }
  }
  
  // Check for completed lines
  const completedLines = [];
  for (let r = 0; r < ROWS; r++) {
    if (grid[r].every(cell => cell !== null)) {
      completedLines.push(r);
    }
  }
  
  if (completedLines.length > 0) {
    clearingLines = completedLines;
    clearAnimation = CLEAR_ANIM_DURATION;
    
    // Scoring
    const linePoints = [0, 100, 300, 500, 800];
    score += linePoints[completedLines.length] * level;
    lines += completedLines.length;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 1000 - (level - 1) * 80);
    
    updateDisplay();
  }
  
  spawnNewPiece();
}

function clearCompletedLines() {
  // Remove completed lines and add empty ones at top
  for (const line of clearingLines.sort((a, b) => b - a)) {
    grid.splice(line, 1);
    grid.unshift(new Array(COLS).fill(null));
  }
  clearingLines = [];
}

// ===== SPAWNING =====
function spawnNewPiece() {
  currentPiece = nextPiece || createPiece(getNextPieceName());
  nextPiece = createPiece(getNextPieceName());
  
  // Check if spawn position is valid
  if (!isValidPosition(currentPiece, currentPiece.shape)) {
    gameOver();
  }
}

// ===== DRAWING =====
function drawBlock(context, x, y, color, size = BLOCK_SIZE, ghost = false) {
  if (ghost) {
    context.strokeStyle = color;
    context.globalAlpha = 0.3;
    context.lineWidth = 2;
    context.strokeRect(x * size + 2, y * size + 2, size - 4, size - 4);
    context.globalAlpha = 1;
    return;
  }
  
  // Main block
  context.fillStyle = color;
  context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
  
  // Highlight
  context.fillStyle = 'rgba(255, 255, 255, 0.3)';
  context.fillRect(x * size + 2, y * size + 2, size - 4, 4);
  context.fillRect(x * size + 2, y * size + 2, 4, size - 4);
  
  // Shadow
  context.fillStyle = 'rgba(0, 0, 0, 0.3)';
  context.fillRect(x * size + 2, y * size + size - 6, size - 4, 4);
  context.fillRect(x * size + size - 6, y * size + 2, 4, size - 4);
}

function drawGrid() {
  // Background grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK_SIZE);
    ctx.lineTo(COLS * BLOCK_SIZE, r * BLOCK_SIZE);
    ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK_SIZE, 0);
    ctx.lineTo(c * BLOCK_SIZE, ROWS * BLOCK_SIZE);
    ctx.stroke();
  }
  
  // Placed blocks
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c]) {
        const isClearing = clearingLines.includes(r);
        if (isClearing) {
          const progress = 1 - (clearAnimation / CLEAR_ANIM_DURATION);
          ctx.globalAlpha = 1 - progress;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
          ctx.globalAlpha = 1;
        } else {
          drawBlock(ctx, c, r, grid[r][c]);
        }
      }
    }
  }
}

function drawGhostPiece() {
  if (!currentPiece) return;
  const ghostY = getGhostY();
  if (ghostY === currentPiece.y) return;
  
  for (let r = 0; r < currentPiece.shape.length; r++) {
    for (let c = 0; c < currentPiece.shape[r].length; c++) {
      if (currentPiece.shape[r][c]) {
        drawBlock(ctx, currentPiece.x + c, ghostY + r, currentPiece.color, BLOCK_SIZE, true);
      }
    }
  }
}

function drawCurrentPiece() {
  if (!currentPiece) return;
  for (let r = 0; r < currentPiece.shape.length; r++) {
    for (let c = 0; c < currentPiece.shape[r].length; c++) {
      if (currentPiece.shape[r][c]) {
        drawBlock(ctx, currentPiece.x + c, currentPiece.y + r, currentPiece.color);
      }
    }
  }
}

function drawNextPiece() {
  nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;
  
  const shape = nextPiece.shape;
  const rows = shape.length;
  const cols = shape[0].length;
  const previewSize = 20;
  
  const offsetX = (nextCanvas.width - cols * previewSize) / 2 / previewSize;
  const offsetY = (nextCanvas.height - rows * previewSize) / 2 / previewSize;
  
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (shape[r][c]) {
        const x = offsetX + c;
        const y = offsetY + r;
        nextCtx.fillStyle = nextPiece.color;
        nextCtx.fillRect(x * previewSize + 1, y * previewSize + 1, previewSize - 2, previewSize - 2);
        nextCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        nextCtx.fillRect(x * previewSize + 2, y * previewSize + 2, previewSize - 4, 3);
      }
    }
  }
}

function updateDisplay() {
  document.getElementById('score-display').textContent = score.toLocaleString();
  document.getElementById('level-display').textContent = level;
  document.getElementById('lines-display').textContent = lines;
}

// ===== GAME LOOP =====
function gameLoop(timestamp) {
  if (!gameRunning || paused) {
    animationId = requestAnimationFrame(gameLoop);
    return;
  }
  
  // Handle line clearing animation
  if (clearingLines.length > 0) {
    clearAnimation -= 16;
    if (clearAnimation <= 0) {
      clearCompletedLines();
    }
  }
  
  // Drop piece
  if (timestamp - lastDrop > dropInterval) {
    if (!movePiece(0, 1)) {
      lockPiece();
    }
    lastDrop = timestamp;
  }
  
  // Draw everything
  ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  drawGrid();
  drawGhostPiece();
  drawCurrentPiece();
  drawNextPiece();
  
  animationId = requestAnimationFrame(gameLoop);
}

// ===== INPUT HANDLING =====
document.addEventListener('keydown', (e) => {
  if (!gameRunning || paused) return;
  if (clearingLines.length > 0) return;
  
  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      movePiece(-1, 0);
      break;
    case 'ArrowRight':
      e.preventDefault();
      movePiece(1, 0);
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (movePiece(0, 1)) {
        score += 1;
        updateDisplay();
      }
      lastDrop = performance.now();
      break;
    case 'ArrowUp':
      e.preventDefault();
      rotateCurrentPiece();
      break;
    case ' ':
      e.preventDefault();
      hardDrop();
      updateDisplay();
      lastDrop = performance.now();
      break;
    case 'p':
    case 'P':
      paused = !paused;
      break;
  }
});

// ===== GAME STATE MANAGEMENT =====
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('overlay').classList.remove('visible');
  
  initGrid();
  bag = [];
  score = 0;
  lines = 0;
  level = 1;
  dropInterval = 1000;
  clearingLines = [];
  clearAnimation = 0;
  paused = false;
  gameRunning = true;
  
  nextPiece = null;
  spawnNewPiece();
  updateDisplay();
  
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
}

function restartGame() {
  startGame();
}

function gameOver() {
  gameRunning = false;
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('overlay').classList.add('visible');
}

// Initial draw
initGrid();
ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
drawGrid();
</script>
</body>
</html>
