<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - Classic Block Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .game-board {
            position: relative;
        }

        canvas {
            border: 3px solid #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: #111;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: white;
            min-width: 200px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .info-box h3 {
            margin-bottom: 10px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .score-display {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 16px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-value {
            font-weight: bold;
        }

        .next-piece-canvas {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 10px;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }

        .controls h3 {
            margin-bottom: 15px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .key {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 10px;
            z-index: 100;
        }

        .game-over-overlay.active {
            display: flex;
        }

        .game-over-text {
            color: #ff3366;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 4px 8px rgba(255, 51, 102, 0.5);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .final-score {
            color: white;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .pause-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            display: none;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .pause-indicator.active {
            display: block;
        }

        .level-up-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
            display: none;
            animation: levelUpAnim 1s ease-out;
            text-shadow: 0 4px 8px rgba(255, 215, 0, 0.5);
            pointer-events: none;
        }

        @keyframes levelUpAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .combo-indicator {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b6b;
            font-size: 36px;
            font-weight: bold;
            display: none;
            animation: comboAnim 1s ease-out;
            text-shadow: 0 4px 8px rgba(255, 107, 107, 0.5);
            pointer-events: none;
        }

        @keyframes comboAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5) rotate(-10deg);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2) rotate(5deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-board">
            <canvas id="gameCanvas"></canvas>
            <div class="pause-indicator" id="pauseIndicator">PAUSED</div>
            <div class="level-up-notification" id="levelUpNotification">LEVEL UP!</div>
            <div class="combo-indicator" id="comboIndicator">TETRIS!</div>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-text">Game Over</div>
                <div class="final-score">Final Score: <span id="finalScore">0</span></div>
                <button class="restart-btn" onclick="restartGame()">Play Again</button>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="info-box">
                <h3>Score</h3>
                <div class="score-display" id="score">0</div>
                <div class="stat-item">
                    <span class="stat-label">Level:</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Lines:</span>
                    <span class="stat-value" id="lines">0</span>
                </div>
            </div>
            
            <div class="info-box">
                <h3>Next Piece</h3>
                <canvas id="nextPieceCanvas" class="next-piece-canvas"></canvas>
            </div>
            
            <div class="controls">
                <h3>Controls</h3>
                <div class="control-item">
                    <span>Move</span>
                    <span class="key">← →</span>
                </div>
                <div class="control-item">
                    <span>Soft Drop</span>
                    <span class="key">↓</span>
                </div>
                <div class="control-item">
                    <span>Hard Drop</span>
                    <span class="key">Space</span>
                </div>
                <div class="control-item">
                    <span>Rotate</span>
                    <span class="key">↑ / Z</span>
                </div>
                <div class="control-item">
                    <span>Pause</span>
                    <span class="key">P</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game constants
        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 20;
        const BLOCK_SIZE = 30;
        const MOVE_DELAY = 100;
        const LOCK_DELAY = 500;

        // Tetromino definitions
        const TETROMINOES = {
            I: {
                shape: [[1,1,1,1]],
                color: '#00f0f0'
            },
            O: {
                shape: [[1,1],[1,1]],
                color: '#f0f000'
            },
            T: {
                shape: [[0,1,0],[1,1,1]],
                color: '#a000f0'
            },
            S: {
                shape: [[0,1,1],[1,1,0]],
                color: '#00f000'
            },
            Z: {
                shape: [[1,1,0],[0,1,1]],
                color: '#f00000'
            },
            J: {
                shape: [[1,0,0],[1,1,1]],
                color: '#0000f0'
            },
            L: {
                shape: [[0,0,1],[1,1,1]],
                color: '#f0a000'
            }
        };

        // Game state
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let lines = 0;
        let level = 1;
        let dropTimer = 0;
        let moveTimer = 0;
        let lockTimer = 0;
        let isPaused = false;
        let isGameOver = false;
        let lastMoveTime = 0;
        let animatingLines = [];
        let particles = [];

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = BOARD_WIDTH * BLOCK_SIZE;
        canvas.height = BOARD_HEIGHT * BLOCK_SIZE;

        const nextPieceCanvas = document.getElementById('nextPieceCanvas');
        const nextCtx = nextPieceCanvas.getContext('2d');
        nextPieceCanvas.width = 5 * BLOCK_SIZE;
        nextPieceCanvas.height = 4 * BLOCK_SIZE;

        // Initialize board
        function initBoard() {
            board = Array(BOARD_HEIGHT).fill().map(() => Array(BOARD_WIDTH).fill(0));
        }

        // Piece class
        class Piece {
            constructor(type) {
                this.type = type;
                this.shape = TETROMINOES[type].shape;
                this.color = TETROMINOES[type].color;
                this.x = Math.floor(BOARD_WIDTH / 2) - Math.floor(this.shape[0].length / 2);
                this.y = 0;
                this.rotation = 0;
                this.ghostY = 0;
                this.updateGhostPosition();
            }

            rotate() {
                const newShape = this.shape[0].map((_, index) =>
                    this.shape.map(row => row[index]).reverse()
                );
                
                const originalShape = this.shape;
                this.shape = newShape;
                
                // Wall kick adjustments
                if (this.collides()) {
                    // Try moving left
                    this.x--;
                    if (this.collides()) {
                        // Try moving right
                        this.x += 2;
                        if (this.collides()) {
                            // Try moving up
                            this.x--;
                            this.y--;
                            if (this.collides()) {
                                // Revert rotation
                                this.shape = originalShape;
                                this.y++;
                            }
                        }
                    }
                }
                this.updateGhostPosition();
            }

            moveLeft() {
                this.x--;
                if (this.collides()) {
                    this.x++;
                    return false;
                }
                this.updateGhostPosition();
                return true;
            }

            moveRight() {
                this.x++;
                if (this.collides()) {
                    this.x--;
                    return false;
                }
                this.updateGhostPosition();
                return true;
            }

            moveDown() {
                this.y++;
                if (this.collides()) {
                    this.y--;
                    return false;
                }
                return true;
            }

            hardDrop() {
                let dropDistance = 0;
                while (!this.collides()) {
                    this.y++;
                    dropDistance++;
                }
                this.y--;
                dropDistance--;
                score += dropDistance * 2;
                updateScore();
                return dropDistance;
            }

            updateGhostPosition() {
                this.ghostY = this.y;
                while (!this.collidesAt(this.x, this.ghostY + 1)) {
                    this.ghostY++;
                }
            }

            collides() {
                return this.collidesAt(this.x, this.y);
            }

            collidesAt(x, y) {
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            const newX = x + col;
                            const newY = y + row;
                            
                            if (newX < 0 || newX >= BOARD_WIDTH || 
                                newY >= BOARD_HEIGHT || 
                                (newY >= 0 && board[newY][newX])) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            lock() {
                for (let row = 0; row < this.shape.length; row++) {
                    for (let col = 0; col < this.shape[row].length; col++) {
                        if (this.shape[row][col]) {
                            const x = this.x + col;
                            const y = this.y + row;
                            if (y >= 0) {
                                board[y][x] = this.color;
                            }
                        }
                    }
                }
                
                // Create lock particles
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: (this.x + this.shape[0].length / 2) * BLOCK_SIZE,
                        y: (this.y + this.shape.length / 2) * BLOCK_SIZE,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * -3 - 1,
                        life: 30,
                        color: this.color
                    });
                }
            }
        }

        // Particle effects
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life--;
                return p.life > 0;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 30;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
            });
            ctx.globalAlpha = 1;
        }

        // Game functions
        function spawnPiece() {
            currentPiece = nextPiece || new Piece(getRandomPiece());
            nextPiece = new Piece(getRandomPiece());
            
            if (currentPiece.collides()) {
                gameOver();
            }
            
            drawNextPiece();
        }

        function getRandomPiece() {
            const pieces = Object.keys(TETROMINOES);
            return pieces[Math.floor(Math.random() * pieces.length)];
        }

        function clearLines() {
            let linesCleared = 0;
            
            for (let y = BOARD_HEIGHT - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    animatingLines.push({ y, timer: 10 });
                    board.splice(y, 1);
                    board.unshift(Array(BOARD_WIDTH).fill(0));
                    linesCleared++;
                    y++;
                }
            }
            
            if (linesCleared > 0) {
                // Update score
                const points = [0, 100, 300, 500, 800];
                score += points[linesCleared] * level;
                lines += linesCleared;
                
                // Level up every 10 lines
                const newLevel = Math.floor(lines / 10) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    showLevelUp();
                }
                
                // Show combo indicator for Tetris
                if (linesCleared === 4) {
                    showCombo();
                }
                
                updateScore();
                
                // Create line clear particles
                for (let i = 0; i < linesCleared * 10; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: canvas.height - 50,
                        vx: (Math.random() - 0.5) * 8,
                        vy: Math.random() * -8 - 2,
                        life: 40,
                        color: `hsl(${Math.random() * 360}, 100%, 50%)`
                    });
                }
            }
        }

        function getDropSpeed() {
            return Math.max(100, 800 - (level - 1) * 50);
        }

        // Drawing functions
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= BOARD_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK_SIZE, 0);
                ctx.lineTo(x * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= BOARD_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK_SIZE);
                ctx.lineTo(canvas.width, y * BLOCK_SIZE);
                ctx.stroke();
            }
            
            // Draw board
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                for (let x = 0; x < BOARD_WIDTH; x++) {
                    if (board[y][x]) {
                        drawBlock(x, y, board[y][x]);
                    }
                }
            }
            
            // Draw animating lines
            animatingLines = animatingLines.filter(line => {
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (line.timer / 10) + ')';
                ctx.fillRect(0, line.y * BLOCK_SIZE, canvas.width, BLOCK_SIZE);
                line.timer--;
                return line.timer > 0;
            });
            
            // Draw ghost piece
            if (currentPiece && !isPaused) {
                for (let row = 0; row < currentPiece.shape.length; row++) {
                    for (let col = 0; col < currentPiece.shape[row].length; col++) {
                        if (currentPiece.shape[row][col]) {
                            const x = currentPiece.x + col;
                            const y = currentPiece.ghostY + row;
                            if (y >= 0) {
                                ctx.fillStyle = currentPiece.color + '30';
                                ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                                ctx.strokeStyle = currentPiece.color + '60';
                                ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                            }
                        }
                    }
                }
            }
            
            // Draw current piece
            if (currentPiece) {
                for (let row = 0; row < currentPiece.shape.length; row++) {
                    for (let col = 0; col < currentPiece.shape[row].length; col++) {
                        if (currentPiece.shape[row][col]) {
                            const x = currentPiece.x + col;
                            const y = currentPiece.y + row;
                            if (y >= 0) {
                                drawBlock(x, y, currentPiece.color);
                            }
                        }
                    }
                }
            }
            
            // Draw particles
            drawParticles();
        }

        function drawBlock(x, y, color) {
            const gradient = ctx.createLinearGradient(
                x * BLOCK_SIZE, y * BLOCK_SIZE,
                (x + 1) * BLOCK_SIZE, (y + 1) * BLOCK_SIZE
            );
            gradient.addColorStop(0, color);
            gradient.addColorStop(1, shadeColor(color, -30));
            
            ctx.fillStyle = gradient;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            
            // Inner highlight
            ctx.fillStyle = shadeColor(color, 30);
            ctx.fillRect(x * BLOCK_SIZE + 2, y * BLOCK_SIZE + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
            
            // Main block
            ctx.fillStyle = color;
            ctx.fillRect(x * BLOCK_SIZE + 3, y * BLOCK_SIZE + 3, BLOCK_SIZE - 6, BLOCK_SIZE - 6);
            
            // Border
            ctx.strokeStyle = shadeColor(color, -50);
            ctx.lineWidth = 1;
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }

        function drawNextPiece() {
            nextCtx.fillStyle = '#111';
            nextCtx.fillRect(0, 0, nextPieceCanvas.width, nextPieceCanvas.height);
            
            if (nextPiece) {
                const offsetX = (5 - nextPiece.shape[0].length) / 2;
                const offsetY = (4 - nextPiece.shape.length) / 2;
                
                for (let row = 0; row < nextPiece.shape.length; row++) {
                    for (let col = 0; col < nextPiece.shape[row].length; col++) {
                        if (nextPiece.shape[row][col]) {
                            const x = (col + offsetX) * BLOCK_SIZE;
                            const y = (row + offsetY) * BLOCK_SIZE;
                            
                            const gradient = nextCtx.createLinearGradient(x, y, x + BLOCK_SIZE, y + BLOCK_SIZE);
                            gradient.addColorStop(0, nextPiece.color);
                            gradient.addColorStop(1, shadeColor(nextPiece.color, -30));
                            
                            nextCtx.fillStyle = gradient;
                            nextCtx.fillRect(x, y, BLOCK_SIZE, BLOCK_SIZE);
                            
                            nextCtx.fillStyle = shadeColor(nextPiece.color, 30);
                            nextCtx.fillRect(x + 2, y + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
                            
                            nextCtx.fillStyle = nextPiece.color;
                            nextCtx.fillRect(x + 3, y + 3, BLOCK_SIZE - 6, BLOCK_SIZE - 6);
                            
                            nextCtx.strokeStyle = shadeColor(nextPiece.color, -50);
                            nextCtx.lineWidth = 1;
                            nextCtx.strokeRect(x, y, BLOCK_SIZE, BLOCK_SIZE);
                        }
                    }
                }
            }
        }

        function shadeColor(color, percent) {
            const num = parseInt(color.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255))
                .toString(16).slice(1);
        }

        // UI updates
        function updateScore() {
            document.getElementById('score').textContent = score.toLocaleString();
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }

        function showLevelUp() {
            const notification = document.getElementById('levelUpNotification');
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 1000);
        }

        function showCombo() {
            const indicator = document.getElementById('comboIndicator');
            indicator.style.display = 'block';
            setTimeout(() => {
                indicator.style.display = 'none';
            }, 1000);
        }

        // Input handling
        const keys = {};
        let keyTimers = {};

        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            const key = e.key.toLowerCase();
            
            // Prevent repeat for rotation and hard drop
            if ((key === 'arrowup' || key === 'z' || key === ' ') && keys[key]) {
                return;
            }
            
            keys[key] = true;
            
            if (key === 'p') {
                togglePause();
                return;
            }
            
            if (isPaused) return;
            
            if (!keyTimers[key]) {
                handleInput(key);
                if (key === 'arrowleft' || key === 'arrowright' || key === 'arrowdown') {
                    keyTimers[key] = setTimeout(() => {
                        keyTimers[key] = setInterval(() => handleInput(key), 50);
                    }, 200);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = false;
            
            if (keyTimers[key]) {
                clearInterval(keyTimers[key]);
                clearTimeout(keyTimers[key]);
                keyTimers[key] = null;
            }
        });

        function handleInput(key) {
            if (!currentPiece || isPaused || isGameOver) return;
            
            switch(key) {
                case 'arrowleft':
                    if (currentPiece.moveLeft()) {
                        lockTimer = 0;
                    }
                    break;
                case 'arrowright':
                    if (currentPiece.moveRight()) {
                        lockTimer = 0;
                    }
                    break;
                case 'arrowdown':
                    if (currentPiece.moveDown()) {
                        score++;
                        updateScore();
                        dropTimer = 0;
                    }
                    break;
                case 'arrowup':
                case 'z':
                    currentPiece.rotate();
                    lockTimer = 0;
                    break;
                case ' ':
                    const dropDistance = currentPiece.hardDrop();
                    lockPiece();
                    break;
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseIndicator').classList.toggle('active', isPaused);
        }

        // Game logic
        function lockPiece() {
            currentPiece.lock();
            clearLines();
            spawnPiece();
            lockTimer = 0;
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('finalScore').textContent = score.toLocaleString();
            document.getElementById('gameOverOverlay').classList.add('active');
        }

        function restartGame() {
            initBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropTimer = 0;
            lockTimer = 0;
            isPaused = false;
            isGameOver = false;
            currentPiece = null;
            nextPiece = null;
            animatingLines = [];
            particles = [];
            
            updateScore();
            spawnPiece();
            document.getElementById('gameOverOverlay').classList.remove('active');
        }

        // Game loop
        function gameLoop(currentTime) {
            if (!isPaused && !isGameOver) {
                const deltaTime = currentTime - lastMoveTime;
                
                // Handle gravity
                dropTimer += deltaTime;
                if (dropTimer > getDropSpeed()) {
                    if (currentPiece && !currentPiece.moveDown()) {
                        lockTimer += deltaTime;
                        if (lockTimer > LOCK_DELAY) {
                            lockPiece();
                        }
                    }
                    dropTimer = 0;
                }
                
                updateParticles();
            }
            
            draw();
            lastMoveTime = currentTime;
            requestAnimationFrame(gameLoop);
        }

        // Initialize game
        initBoard();
        spawnPiece();
        updateScore();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
