<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Tetris</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --grid-color: #333;
            --text-color: #f0f0f0;
            --accent-color: #00bcd4;
            --board-bg: #222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            color: var(--accent-color);
            text-shadow: 0 0 5px var(--accent-color);
        }

        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            border: 2px solid var(--grid-color);
            padding: 20px;
            background-color: #252525;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        canvas#game-board {
            border: 2px solid var(--grid-color);
            background-color: var(--board-bg);
        }

        .sidebar {
            width: 160px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .sidebar-box {
            background-color: var(--board-bg);
            border: 2px solid var(--grid-color);
            padding: 15px;
            border-radius: 5px;
        }
        
        .sidebar-box h2 {
            margin: 0 0 10px;
            font-size: 1.2em;
            color: var(--accent-color);
        }

        #score, #level, #lines {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        canvas#next-piece {
            background-color: var(--board-bg);
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            display: none; /* Initially hidden */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px; /* Match container rounding */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #game-over-screen.active {
            display: flex;
            opacity: 1;
        }

        #game-over-screen h2 {
            font-size: 3em;
            margin: 0;
            color: #ff4136;
            text-shadow: 0 0 10px #ff4136;
        }
        
        #final-score {
            font-size: 1.8em;
            margin: 20px 0;
        }

        #restart-button {
            padding: 15px 30px;
            font-size: 1.2em;
            color: var(--bg-color);
            background-color: var(--accent-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 0 #008a9a;
        }

        #restart-button:hover {
            background-color: #00e5ff;
        }

        #restart-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #008a9a;
        }

    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="game-board" width="300" height="600"></canvas>
        <div class="sidebar">
            <h1>TETRIS</h1>
            <div class="sidebar-box">
                <h2>SCORE</h2>
                <p id="score">0</p>
            </div>
            <div class="sidebar-box">
                <h2>LINES</h2>
                <p id="lines">0</p>
            </div>
            <div class="sidebar-box">
                <h2>LEVEL</h2>
                <p id="level">0</p>
            </div>
            <div class="sidebar-box">
                <h2>NEXT</h2>
                <canvas id="next-piece" width="120" height="120"></canvas>
            </div>
        </div>
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p id="final-score">Final Score: 0</p>
            <button id="restart-button">RESTART</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('game-board');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-piece');
        const nextContext = nextCanvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const linesElement = document.getElementById('lines');
        const levelElement = document.getElementById('level');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreElement = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');

        // Game Constants
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        const NEXT_PIECE_BOX_SIZE = 4;

        // Set canvas dimensions
        canvas.width = COLS * BLOCK_SIZE;
        canvas.height = ROWS * BLOCK_SIZE;
        nextCanvas.width = NEXT_PIECE_BOX_SIZE * BLOCK_SIZE;
        nextCanvas.height = NEXT_PIECE_BOX_SIZE * BLOCK_SIZE;

        // Tetromino Shapes and Colors
        const COLORS = [
            null,
            '#FF0D72', // T
            '#0DC2FF', // I
            '#0DFF72', // S
            '#F538FF', // Z
            '#FF8E0D', // L
            '#FFE138', // O
            '#3877FF', // J
        ];

        const SHAPES = [
            [], // Empty shape for index 0
            [[1, 1, 1], [0, 1, 0]], // T
            [[2, 2, 2, 2]], // I
            [[0, 3, 3], [3, 3, 0]], // S
            [[4, 4, 0], [0, 4, 4]], // Z
            [[5, 5, 5], [5, 0, 0]], // L
            [[6, 6], [6, 6]],     // O
            [[7, 7, 7], [0, 0, 7]], // J
        ];

        // Game State
        let board = createEmptyBoard();
        let currentPiece;
        let nextPiece;
        let score = 0;
        let lines = 0;
        let level = 0;
        let gameOver = false;
        let pieceBag = [];

        // Game Loop variables
        let lastTime = 0;
        let dropCounter = 0;
        let dropInterval = 1000; // Milliseconds

        // --- Game Logic ---

        function createEmptyBoard() {
            return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        }

        function spawnPiece() {
            // Use a 7-bag randomizer for piece generation
            if (pieceBag.length === 0) {
                pieceBag = [1, 2, 3, 4, 5, 6, 7]; // Indices for SHAPES/COLORS
                // Shuffle the bag
                for (let i = pieceBag.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pieceBag[i], pieceBag[j]] = [pieceBag[j], pieceBag[i]];
                }
            }
            
            const pieceIndex = pieceBag.pop();
            const shape = SHAPES[pieceIndex];

            return {
                x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
                y: 0,
                shape: shape,
                colorIndex: pieceIndex
            };
        }

        function isValidMove(piece, offsetX, offsetY, newShape) {
            const shape = newShape || piece.shape;
            const x = piece.x + offsetX;
            const y = piece.y + offsetY;
            
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col]) {
                        const newX = x + col;
                        const newY = y + row;

                        // Check wall collision
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return false;
                        }
                        // Check board collision
                        if (newY >= 0 && board[newY][newX] !== 0) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }
        
        function rotate(piece) {
            // Transpose and reverse rows for clockwise rotation
            const shape = piece.shape;
            const newShape = shape[0].map((_, colIndex) => shape.map(row => row[colIndex])).reverse();

            // Wall kick logic
            let kickOffset = 0;
            if (!isValidMove(piece, 0, 0, newShape)) {
                // Try moving right
                if (isValidMove(piece, 1, 0, newShape)) {
                    kickOffset = 1;
                } 
                // Try moving left
                else if (isValidMove(piece, -1, 0, newShape)) {
                    kickOffset = -1;
                }
                // Special case for I-piece, try moving further
                else if (piece.shape[0].length === 4) {
                    if (isValidMove(piece, 2, 0, newShape)) {
                        kickOffset = 2;
                    } else if (isValidMove(piece, -2, 0, newShape)) {
                        kickOffset = -2;
                    }
                }
                
                // If no kick works, rotation is invalid
                if (kickOffset === 0) {
                    return; 
                }
            }
            
            piece.x += kickOffset;
            piece.shape = newShape;
        }

        function lockPiece() {
            currentPiece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        board[currentPiece.y + y][currentPiece.x + x] = currentPiece.colorIndex;
                    }
                });
            });
        }
        
        function clearLines() {
            let linesCleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(value => value !== 0)) {
                    // Remove the line and add a new empty one at the top
                    const removedRow = board.splice(y, 1)[0];
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++; // Re-check the current row index as it's now a new row
                }
            }
            updateScore(linesCleared);
        }

        function updateScore(linesCleared) {
            if (linesCleared === 0) return;

            // Points based on Tetris guidelines
            const linePoints = [0, 40, 100, 300, 1200];
            score += linePoints[linesCleared] * (level + 1);
            lines += linesCleared;
            
            // Update level every 10 lines
            const newLevel = Math.floor(lines / 10);
            if (newLevel > level) {
                level = newLevel;
                // Increase speed: Cap at a reasonable minimum interval
                dropInterval = Math.max(100, 1000 - level * 75);
            }
        }
        
        function pieceDrop() {
            if (isValidMove(currentPiece, 0, 1)) {
                currentPiece.y++;
            } else {
                lockPiece();
                clearLines();
                currentPiece = nextPiece;
                nextPiece = spawnPiece();
                
                // Check for game over
                if (!isValidMove(currentPiece, 0, 0)) {
                    endGame();
                }
            }
            dropCounter = 0;
        }

        function hardDrop() {
            while (isValidMove(currentPiece, 0, 1)) {
                currentPiece.y++;
            }
            pieceDrop(); // Lock it immediately
        }
        
        function getGhostPieceY() {
            let ghostY = currentPiece.y;
            while (isValidMove(currentPiece, 0, ghostY - currentPiece.y + 1)) {
                ghostY++;
            }
            return ghostY;
        }

        // --- Drawing ---

        function draw() {
            // Clear canvases
            context.clearRect(0, 0, canvas.width, canvas.height);
            nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            // Draw background grid
            drawGrid(context, COLS, ROWS, BLOCK_SIZE, '#333');
            
            // Draw landed pieces on the board
            drawBoard();
            
            // Draw ghost piece
            if (!gameOver) {
                const ghostY = getGhostPieceY();
                drawPiece(currentPiece.shape, currentPiece.x, ghostY, currentPiece.colorIndex, 0.2); // Low opacity
            }
            
            // Draw current piece
            if (!gameOver) {
                drawPiece(currentPiece.shape, currentPiece.x, currentPiece.y, currentPiece.colorIndex, 1);
            }
            
            // Draw next piece
            drawNextPiece();
            
            // Update UI text
            updateUI();
        }
        
        function drawBlock(ctx, x, y, color, opacity = 1) {
            ctx.fillStyle = color;
            ctx.globalAlpha = opacity;
            // Create a small inner bevel effect for blocks
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            
            if (opacity === 1) { // Only draw borders on solid blocks
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            }
            ctx.globalAlpha = 1.0; // Reset alpha
        }
        
        function drawGrid(ctx, cols, rows, size, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            for (let i = 1; i < cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * size, 0);
                ctx.lineTo(i * size, rows * size);
                ctx.stroke();
            }
            for (let i = 1; i < rows; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * size);
                ctx.lineTo(cols * size, i * size);
                ctx.stroke();
            }
        }
        
        function drawBoard() {
            board.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value > 0) {
                        drawBlock(context, x, y, COLORS[value]);
                    }
                });
            });
        }
        
        function drawPiece(shape, x, y, colorIndex, opacity) {
            shape.forEach((row, rowIdx) => {
                row.forEach((value, colIdx) => {
                    if (value) {
                        drawBlock(context, x + colIdx, y + rowIdx, COLORS[colorIndex], opacity);
                    }
                });
            });
        }
        
        function drawNextPiece() {
            const shape = nextPiece.shape;
            const color = COLORS[nextPiece.colorIndex];
            const size = NEXT_PIECE_BOX_SIZE;
            const shapeWidth = shape[0].length;
            const shapeHeight = shape.length;
            
            // Center the piece in the next-piece box
            const startX = (size - shapeWidth) / 2;
            const startY = (size - shapeHeight) / 2;
            
            shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(nextContext, startX + x, startY + y, color);
                    }
                });
            });
        }
        
        function updateUI() {
            scoreElement.textContent = score;
            linesElement.textContent = lines;
            levelElement.textContent = level;
        }

        // --- Game Loop ---

        function gameLoop(time) {
            if (gameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                pieceDrop();
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // --- Controls ---
        
        document.addEventListener('keydown', event => {
            if (gameOver) return;
            
            switch (event.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    if (isValidMove(currentPiece, -1, 0)) currentPiece.x--;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    if (isValidMove(currentPiece, 1, 0)) currentPiece.x++;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    pieceDrop(); // Soft drop
                    break;
                case 'ArrowUp':
                case 'KeyW':
                    rotate(currentPiece);
                    break;
                case 'Space':
                    event.preventDefault(); // Prevent page scroll
                    hardDrop();
                    break;
            }
            draw(); // Redraw immediately on input for responsiveness
        });

        // --- Game State Management ---
        
        function startGame() {
            board = createEmptyBoard();
            pieceBag = [];
            nextPiece = spawnPiece();
            currentPiece = spawnPiece();
            score = 0;
            lines = 0;
            level = 0;
            dropInterval = 1000;
            gameOver = false;
            
            gameOverScreen.classList.remove('active');
            
            lastTime = 0;
            dropCounter = 0;
            
            gameLoop(0); // Start the loop
        }
        
        function endGame() {
            gameOver = true;
            finalScoreElement.textContent = `Final Score: ${score}`;
            gameOverScreen.classList.add('active');
        }

        restartButton.addEventListener('click', () => {
            gameOverScreen.classList.remove('active');
            startGame();
        });

        // --- Initial Start ---
        startGame();
    </script>
</body>
</html>
