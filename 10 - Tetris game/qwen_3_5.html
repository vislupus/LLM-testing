<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Tetris</title>
    <style>
        :root {
            --bg-color: #202028;
            --ui-bg: #333;
            --text-color: #fff;
            --accent: #4f4;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: #1a1a20;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        canvas {
            border: 2px solid #444;
            background-color: #000;
            display: block;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        #ui-sidebar {
            display: flex;
            flex-direction: column;
            min-width: 150px;
        }

        .stat-box {
            background: var(--ui-bg);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        #next-piece-canvas {
            background: #000;
            border: 1px solid #444;
            margin: 0 auto;
            display: block;
        }

        /* Overlay for Game Over / Start */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
        }

        #overlay h1 {
            font-size: 3rem;
            margin: 0 0 20px 0;
            color: #fff;
            text-shadow: 2px 2px 0 #f0f, -2px -2px 0 #0ff;
        }

        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #6f6;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        .controls-hint {
            margin-top: auto;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
            line-height: 1.6;
        }
        
        kbd {
            background: #444;
            padding: 2px 5px;
            border-radius: 3px;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Main Game Canvas -->
        <canvas id="tetris" width="240" height="400"></canvas>

        <!-- Sidebar UI -->
        <div id="ui-sidebar">
            <div class="stat-box">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Next</div>
                <canvas id="next" width="80" height="80"></canvas>
            </div>
            
            <div class="controls-hint">
                <p><kbd>←</kbd> <kbd>→</kbd> Move</p>
                <p><kbd>↑</kbd> Rotate</p>
                <p><kbd>↓</kbd> Soft Drop</p>
            </div>
        </div>

        <!-- Game Over / Start Overlay -->
        <div id="overlay">
            <h1 id="overlay-title">TETRIS</h1>
            <p id="overlay-msg">Press Start to Play</p>
            <button id="start-btn" onclick="startGame()">START GAME</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextContext = nextCanvas.getContext('2d');

        // Scale up everything by 20x for the main grid (12x20 blocks -> 240x400 pixels)
        context.scale(20, 20);
        nextContext.scale(20, 20);

        // Game State
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;
        let isGameOver = false;

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            level: 1,
            lines: 0,
            next: null
        };

        // Colors for the pieces (Standard Tetris Colors)
        const colors = [
            null,
            '#FF0D72', // T - Purple/Magenta
            '#0DC2FF', // I - Cyan
            '#0DFF72', // S - Green
            '#F538FF', // Z - Red (adjusted to magenta-ish for style) -> Actually standard is Red
            '#FF8E0D', // L - Orange
            '#FFE138', // O - Yellow
            '#3877FF', // J - Blue
        ];
        
        // Correcting standard colors slightly for better visibility
        const pieceColors = [
            null,
            '#9b59b6', // T
            '#3498db', // I
            '#2ecc71', // S
            '#e74c3c', // Z
            '#e67e22', // L
            '#f1c40f', // O
            '#2980b9', // J
        ];

        // Create the matrix for the board (12 wide, 20 high)
        const arena = createMatrix(12, 20);

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function drawMatrix(matrix, offset, ctx = context, isGhost = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // Base color
                        ctx.fillStyle = isGhost ? 'rgba(255, 255, 255, 0.2)' : pieceColors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Bevel effect (procedural graphics)
                        if (!isGhost) {
                            ctx.lineWidth = 0.05;
                            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                            
                            // Inner highlight
                            ctx.fillStyle = 'rgba(255,255,255,0.1)';
                            ctx.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.8, 0.8);
                        }
                    }
                });
            });
        }

        function draw() {
            // Clear Board
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});

            // Draw Ghost Piece
            const ghostPos = { ...player.pos };
            while (!collide(arena, { pos: ghostPos, matrix: player.matrix })) {
                ghostPos.y++;
            }
            ghostPos.y--; // Step back one
            drawMatrix(player.matrix, ghostPos, context, true);

            // Draw Active Piece
            drawMatrix(player.matrix, player.pos);
        }

        function drawNext() {
            nextContext.fillStyle = '#000';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            // Center the piece in the preview box
            const offsetX = (4 - player.next.length) / 2;
            const offsetY = (4 - player.next.length) / 2;
            drawMatrix(player.next, {x: offsetX, y: offsetY}, nextContext);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            // Transpose
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            // Reverse rows for clockwise
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            // Wall kick logic (basic)
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            if (player.next === null) {
                player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            }
            player.matrix = player.next;
            player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            drawNext();

            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                isGameOver = true;
                isPaused = true;
                document.getElementById('overlay-title').innerText = "GAME OVER";
                document.getElementById('overlay-msg').innerText = `Final Score: ${player.score}`;
                document.getElementById('start-btn').innerText = "TRY AGAIN";
                document.getElementById('overlay').classList.remove('hidden');
            }
        }

        function arenaSweep() {
            let rowCount = 0;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                rowCount++;
            }
            
            if (rowCount > 0) {
                // Scoring: 40, 100, 300, 1200 * level
                const lineScores = [0, 40, 100, 300, 1200];
                player.score += lineScores[rowCount] * player.level;
                player.lines += rowCount;
                
                // Level up every 10 lines
                player.level = Math.floor(player.lines / 10) + 1;
                
                // Speed up
                dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);

                updateScore();
            }
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function update(time = 0) {
            if (isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startGame() {
            // Reset Arena
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            player.lines = 0;
            player.next = null;
            dropInterval = 1000;
            updateScore();
            
            isGameOver = false;
            isPaused = false;
            document.getElementById('overlay').classList.add('hidden');
            
            playerReset();
            update();
        }

        document.addEventListener('keydown', event => {
            if (isPaused) return;

            if (event.keyCode === 37) { // Left
                playerMove(-1);
            } else if (event.keyCode === 39) { // Right
                playerMove(1);
            } else if (event.keyCode === 40) { // Down
                playerDrop();
            } else if (event.keyCode === 38) { // Up (Rotate)
                playerRotate(1);
            }
        });

        // Initial Draw
        context.fillStyle = '#000';
        context.fillRect(0, 0, canvas.width, canvas.height);
        
    </script>
</body>
</html>
