<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pirate Isle Defense — Babylon.js (single‑file)</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#0b1220;color:#e7eefc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #game{position:fixed;inset:0}
  .hud{position:fixed;left:12px;top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:10}
  .panel{background:rgba(10,18,40,.75);border:1px solid #21335d;border-radius:12px;padding:8px 10px;backdrop-filter:blur(3px)}
  .stat{display:flex;gap:6px;align-items:center}
  .val{font-weight:700;color:#a9c8ff}
  .btn{background:#183064;border:1px solid #3156a8;color:#e7eefc;border-radius:10px;padding:6px 10px;cursor:pointer;user-select:none}
  .btn:disabled{opacity:.5;cursor:default}
  .upg{display:flex;gap:8px;align-items:center}
  .upg .btn{padding:6px 8px}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:20}
  .card{background:#0e1830;border:1px solid #263a6a;border-radius:14px;padding:16px 18px;min-width:320px;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  h1{font-size:18px;margin:0 0 8px 0;color:#cfe0ff}
  .muted{color:#9fb3d9;font-size:12px}
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="panel stat">💰 Gold: <span id="gold" class="val">0</span></div>
    <div class="panel stat">🌊 Wave: <span id="wave" class="val">1</span></div>
    <div class="panel stat">🏝️ Island HP: <span id="hp" class="val">100</span></div>
    <div class="panel stat">🛳️ Selected: <span id="sel" class="val">Ship 1</span> <span class="muted">(keys 1–3)</span></div>
    <div class="panel upg">
      <button class="btn" id="btnNext">Start Next Wave</button>
      <button class="btn" id="upgDmg">+Damage (50)</button>
      <button class="btn" id="upgRate">+Fire Rate (50)</button>
      <button class="btn" id="upgSpd">+Speed (50)</button>
    </div>
  </div>

  <div id="gameover" class="overlay">
    <div class="card">
      <h1>🏴‍☠️ Game Over</h1>
      <p class="muted">Your island has fallen. Waves survived: <span id="finalWave">0</span></p>
      <button class="btn" id="restart">Restart</button>
    </div>
  </div>

  <!-- Babylon.js & Materials (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@6.39.0/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@6.39.0/babylonjs.loaders.min.js"></script>

<script>
(() => {
  // -----------------------------------------------------
  // Basic engine & scene setup
  // -----------------------------------------------------
  const canvas = document.getElementById('game');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, antialias:true });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.05,0.09,0.18,1);

  // Camera
  const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 120, new BABYLON.Vector3(0,0,0), scene);
  camera.lowerRadiusLimit = 50; camera.upperRadiusLimit = 220; camera.attachControl(canvas, true);
  camera.panningSensibility = 0;

  // Lights
  const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.6,-1,-0.4), scene);
  sun.position = new BABYLON.Vector3(60,100,40);
  sun.intensity = 1.0;
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.55;

  // -----------------------------------------------------
  // Stylized water (vertex‑animated plane, no external textures)
  // -----------------------------------------------------
  const water = BABYLON.MeshBuilder.CreateGround("water", {width:600, height:600, subdivisions:120, updatable:true}, scene);
  water.position.y = 0;
  const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
  waterMat.diffuseColor = new BABYLON.Color3(0.08,0.27,0.45);
  waterMat.specularPower = 96; waterMat.specularColor = new BABYLON.Color3(0.2,0.4,0.6);
  waterMat.emissiveColor = new BABYLON.Color3(0.02,0.06,0.12);
  water.material = waterMat;
  const waterPos = water.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  const basePos = waterPos.slice();

  // Gentle wave animation
  function animateWater(t){
    const k1=0.015, k2=0.022, amp=0.6;
    for(let i=0;i<waterPos.length;i+=3){
      const x = basePos[i], z = basePos[i+2];
      waterPos[i+1] = Math.sin((x+t*40)*k1)*amp + Math.cos((z+t*30)*k2)*amp*0.6;
    }
    water.updateVerticesData(BABYLON.VertexBuffer.PositionKind, waterPos);
    water.refreshBoundingInfo();
  }

  // -----------------------------------------------------
  // Island (green hill) + simple props (palms/rocks)
  // -----------------------------------------------------
  const island = BABYLON.MeshBuilder.CreateGround("island", {width:60, height:60, subdivisions:40, updatable:true}, scene);
  island.position.y = 0.2;
  const ipos = island.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  const ibase = island.getVerticesData(BABYLON.VertexBuffer.PositionKind).slice();
  const radius = 24;
  for(let i=0;i<ipos.length;i+=3){
    const x = ibase[i], z = ibase[i+2];
    const d = Math.sqrt(x*x+z*z);
    const h = d<radius? (1 - (d/radius))**2 * 8 : 0; // soft hill
    ipos[i+1] = h;
  }
  island.updateVerticesData(BABYLON.VertexBuffer.PositionKind, ipos);
  const islandMat = new BABYLON.StandardMaterial("islandMat", scene);
  islandMat.diffuseColor = new BABYLON.Color3(0.15,0.5,0.2);
  islandMat.specularColor = new BABYLON.Color3(0.1,0.2,0.15);
  island.material = islandMat;
  island.receiveShadows = true;

  // Props: palms (simple cylinders + cones) and rocks (squashed spheres)
  const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
  shadowGen.usePoissonSampling = true;

  function makePalm(x,z){
    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {diameterTop:0.4, diameterBottom:0.6, height:6, tessellation:8}, scene);
    trunk.position = groundPoint(x,z, island, 0.4);
    const tmat = new BABYLON.StandardMaterial("tmat", scene); tmat.diffuseColor = new BABYLON.Color3(0.35,0.23,0.12); trunk.material = tmat;
    const leaves = new BABYLON.TransformNode("leaves", scene); leaves.parent = trunk; leaves.position.y = 3;
    for(let i=0;i<6;i++){
      const leaf = BABYLON.MeshBuilder.CreateCylinder("leaf", {diameterTop:0, diameterBottom:1.2, height:5, tessellation:3}, scene);
      const lmat = new BABYLON.StandardMaterial("lmat", scene); lmat.diffuseColor = new BABYLON.Color3(0.1,0.6,0.25); leaf.material = lmat;
      leaf.parent = leaves; leaf.position.y = 1; leaf.rotation.z = Math.PI/2; leaf.rotation.y = (i/6)*Math.PI*2; leaf.scaling.x = 0.6;
      shadowGen.addShadowCaster(leaf);
    }
    shadowGen.addShadowCaster(trunk);
  }
  function makeRock(x,z,scale=1){
    const r = BABYLON.MeshBuilder.CreateSphere("rock", {diameter: 3*scale, segments: 2}, scene);
    r.scaling = new BABYLON.Vector3(1.4,0.8,1.2).scale(scale);
    const p = groundPoint(x,z, island, 0.2); r.position = p;
    const rmat = new BABYLON.StandardMaterial("rmat", scene); rmat.diffuseColor = new BABYLON.Color3(0.4,0.45,0.5); r.material = rmat;
    shadowGen.addShadowCaster(r);
  }
  function groundPoint(x,z, ground, lift){ // find island surface Y approx
    const y = islandHeightAt(x,z) + lift;
    return new BABYLON.Vector3(x, y, z);
  }
  function islandHeightAt(x,z){ // match hill formula
    const d = Math.sqrt(x*x+z*z); const h = d<radius? (1 - (d/radius))**2 * 8 : 0; return h + 0.2; }

  // Scatter a few props
  for(let i=0;i<5;i++) makePalm(Math.cos(i)*10 + (i%2?8:-8), Math.sin(i)*10);
  for(let i=0;i<7;i++) makeRock(Math.cos(i*1.7)*15, Math.sin(i*1.7)*12, 0.6 + (i%3)*0.4);

  // -----------------------------------------------------
  // Simple ship factory (friendly and enemy)
  // -----------------------------------------------------
  const ALL_FRIENDLIES = []; const ENEMIES = []; const BULLETS = [];
  let selectedIndex = 0;

  function shipMesh(color){
    const root = new BABYLON.TransformNode("ship");
    // hull
    const hull = BABYLON.MeshBuilder.CreateBox("hull", {width: 3, height: 1, depth: 8}, scene);
    hull.parent = root; hull.position.y = 0.6;
    const keel = BABYLON.MeshBuilder.CreateCylinder("keel", {diameterTop:0.6, diameterBottom:1.2, height:8, tessellation:6}, scene);
    keel.parent = root; keel.rotation.z = Math.PI/2; keel.position.y = 0.6; keel.scaling.x = 1.1;
    const mast = BABYLON.MeshBuilder.CreateCylinder("mast", {diameter:0.25, height:3.2}, scene); mast.parent=root; mast.position = new BABYLON.Vector3(0,2,0);
    const sail = BABYLON.MeshBuilder.CreatePlane("sail", {size:2.2}, scene); sail.parent = mast; sail.position = new BABYLON.Vector3(0.8,0.2,0);
    sail.rotation.y = Math.PI/2;

    const m = new BABYLON.StandardMaterial("smat", scene);
    m.diffuseColor = color; m.specularColor = new BABYLON.Color3(0.2,0.2,0.2);
    hull.material = m; keel.material = m; mast.material = m;
    const sm = new BABYLON.StandardMaterial("sailm", scene); sm.diffuseColor = new BABYLON.Color3(0.95,0.95,1); sm.emissiveColor = new BABYLON.Color3(0.05,0.05,0.1); sail.material = sm;

    // highlight ring
    const ring = BABYLON.MeshBuilder.CreateTorus("ring", {thickness:0.08, diameter:6, tessellation:48}, scene);
    ring.parent = root; ring.position.y = 0.1; ring.isPickable=false;
    const rmat = new BABYLON.StandardMaterial("rmat", scene); rmat.emissiveColor = new BABYLON.Color3(0.1,0.4,1); rmat.alpha = 0.0; ring.material = rmat;

    shadowGen.addShadowCaster(hull); shadowGen.addShadowCaster(keel); shadowGen.addShadowCaster(mast); shadowGen.addShadowCaster(sail);
    root.metadata = { ring };
    return root;
  }

  function createFriendly(angle){
    const node = shipMesh(new BABYLON.Color3(0.35,0.75,1));
    const dist = 36; node.position = new BABYLON.Vector3(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
    node.rotation.y = -angle + Math.PI/2;
    const data = { node, speed: 8, turnRate: 1.6, fireCooldown: 0, fireRate: 1.0, damage: 12, range: 60, hp: 100, levelDmg:0, levelRate:0, levelSpd:0 };
    ALL_FRIENDLIES.push(data);
    return data;
  }

  function createEnemy(){
    const ang = Math.random()*Math.PI*2; const radiusSpawn = 250;
    const pos = new BABYLON.Vector3(Math.cos(ang)*radiusSpawn, 0, Math.sin(ang)*radiusSpawn);
    const node = shipMesh(new BABYLON.Color3(1,0.35,0.35));
    node.position = pos; node.rotation.y = -ang + Math.PI/2;
    const data = { node, speed: 5 + Math.random()*2, turnRate: 0.8, target: new BABYLON.Vector3(0,0,0), hp: 40, radius: 3.2 };
    ENEMIES.push(data);
    return data;
  }

  // -----------------------------------------------------
  // Bullets & particles (simple spheres & tiny billboards)
  // -----------------------------------------------------
  const PS = [];
  function fireBullet(fromNode, dir, speed, dmg, friendly=true){
    const mesh = BABYLON.MeshBuilder.CreateSphere("ball", {diameter:0.8, segments: 6}, scene);
    const mat = new BABYLON.StandardMaterial("bmat", scene); mat.emissiveColor = friendly? new BABYLON.Color3(0.8,0.9,1): new BABYLON.Color3(1,0.6,0.6); mesh.material = mat;
    mesh.position = fromNode.position.add(new BABYLON.Vector3(0,1.1,0)).add(dir.scale(3.6));
    const vel = dir.scale(speed);
    BULLETS.push({mesh, vel, dmg, friendly, life: 4});
  }
  function hitEffect(pos){ // small sparkle
    for(let i=0;i<8;i++){
      const s = BABYLON.MeshBuilder.CreatePlane("spark", {size:0.5}, scene);
      const m = new BABYLON.StandardMaterial("pm", scene); m.emissiveColor = new BABYLON.Color3(1,0.9,0.4); m.disableLighting = true; s.material = m; s.billboardMode = BABYLON.TransformNode.BILLBOARDMODE_ALL;
      s.position = pos.add(new BABYLON.Vector3((Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6));
      const v = new BABYLON.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*2,(Math.random()-0.5)*2);
      PS.push({s, v, life:0.4});
    }
  }

  // -----------------------------------------------------
  // Game state & UI
  // -----------------------------------------------------
  const ui = {
    goldEl: document.getElementById('gold'),
    waveEl: document.getElementById('wave'),
    hpEl: document.getElementById('hp'),
    selEl: document.getElementById('sel'),
    nextBtn: document.getElementById('btnNext'),
    upgDmg: document.getElementById('upgDmg'),
    upgRate: document.getElementById('upgRate'),
    upgSpd: document.getElementById('upgSpd'),
    over: document.getElementById('gameover'),
    finalWave: document.getElementById('finalWave'),
    restart: document.getElementById('restart'),
  };

  const game = { gold: 100, wave: 0, islandHP: 100, spawning:false, between:true };
  function updateHUD(){ ui.goldEl.textContent = game.gold|0; ui.waveEl.textContent = game.wave; ui.hpEl.textContent = game.islandHP|0; ui.selEl.textContent = `Ship ${selectedIndex+1}`; }

  function setSelection(idx){ selectedIndex = Math.max(0, Math.min(2, idx)); ALL_FRIENDLIES.forEach((s,i)=> s.node.metadata.ring.material.alpha = (i===selectedIndex? 0.9: 0.0)); updateHUD(); }

  function upgrade(ship, kind){
    const costBase = 50; const lvl = kind==='dmg'? ship.levelDmg : kind==='rate'? ship.levelRate : ship.levelSpd;
    const cost = costBase + lvl*50;
    if(game.gold < cost || !game.between) return;
    game.gold -= cost;
    if(kind==='dmg'){ ship.damage += 6; ship.levelDmg++; }
    if(kind==='rate'){ ship.fireRate += 0.25; ship.levelRate++; }
    if(kind==='spd'){ ship.speed += 1.2; ship.levelSpd++; }
    ui.upgDmg.textContent = `+Damage (${costBase + ship.levelDmg*50})`;
    ui.upgRate.textContent = `+Fire Rate (${costBase + ship.levelRate*50})`;
    ui.upgSpd.textContent = `+Speed (${costBase + ship.levelSpd*50})`;
    updateHUD();
  }

  ui.upgDmg.onclick = ()=> upgrade(ALL_FRIENDLIES[selectedIndex], 'dmg');
  ui.upgRate.onclick = ()=> upgrade(ALL_FRIENDLIES[selectedIndex], 'rate');
  ui.upgSpd.onclick = ()=> upgrade(ALL_FRIENDLIES[selectedIndex], 'spd');

  ui.nextBtn.onclick = ()=>{ if(game.between){ startWave(); } };
  ui.restart.onclick = ()=>{ ui.over.style.display='none'; resetGame(); };

  function resetGame(){
    // remove all existing enemies/bullets/particles
    ENEMIES.splice(0).forEach(e=> e.node.dispose());
    BULLETS.splice(0).forEach(b=> b.mesh.dispose());
    PS.splice(0).forEach(p=> p.s.dispose());
    game.gold=100; game.wave=0; game.islandHP=100; game.between=true; updateHUD();
    ALL_FRIENDLIES.forEach(s=>{ s.speed=8; s.fireRate=1.0; s.damage=12; s.levelDmg=s.levelRate=s.levelSpd=0; });
    ui.upgDmg.textContent = `+Damage (50)`; ui.upgRate.textContent = `+Fire Rate (50)`; ui.upgSpd.textContent = `+Speed (50)`;
  }

  function startWave(){
    game.wave++; updateHUD(); game.between=false; ui.nextBtn.disabled=true;
    const total = 6 + game.wave*2; let spawned=0; game.spawning=true;
    const spawner = scene.onBeforeRenderObservable.add(()=>{
      if(spawned>=total){ scene.onBeforeRenderObservable.remove(spawner); game.spawning=false; return; }
      // spawn over time
      if(Math.random()<0.02 + Math.min(0.03, game.wave*0.003)) { createEnemy(); spawned++; }
    });
  }

  function checkWaveEnd(){ if(game.between || game.spawning) return; if(ENEMIES.length===0){ game.between=true; ui.nextBtn.disabled=false; game.gold += 50 + game.wave*10; updateHUD(); } }

  // -----------------------------------------------------
  // Initial friendlies around island
  // -----------------------------------------------------
  createFriendly(0);
  createFriendly(2.1);
  createFriendly(4.2);
  setSelection(0);
  updateHUD();

  // -----------------------------------------------------
  // Input: number keys select, WASD/Arrows steer selected, Space manual fire
  // -----------------------------------------------------
  const keys = {};
  window.addEventListener('keydown', e=>{
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    keys[e.code]=true;
    if(e.code==='Digit1') setSelection(0);
    if(e.code==='Digit2') setSelection(1);
    if(e.code==='Digit3') setSelection(2);
    if(e.code==='Space'){ manualFire(); }
  });
  window.addEventListener('keyup', e=>{ keys[e.code]=false; });

  function manualFire(){ const s = ALL_FRIENDLIES[selectedIndex]; const target = nearestEnemy(s.node.position, s.range); if(target){ const dir = target.node.position.subtract(s.node.position).normalize(); fireBullet(s.node, dir, 55, s.damage, true); s.fireCooldown = Math.max(s.fireCooldown, 0.3); } }

  function nearestEnemy(pos, maxDist){ let best=null, bd=1e9; for(const e of ENEMIES){ const d = BABYLON.Vector3.Distance(pos, e.node.position); if(d<bd && d<=maxDist) { bd=d; best=e; } } return best; }

  // -----------------------------------------------------
  // Update loop
  // -----------------------------------------------------
  const islandRadiusDamage = 18; // if enemy within this, damage island

  scene.onBeforeRenderObservable.add(()=>{
    const dt = engine.getDeltaTime()/1000;

    animateWater(performance.now()/1000);

    // Steering selected ship (W/S forward/back, A/D turn)
    const s = ALL_FRIENDLIES[selectedIndex];
    if(!game.between){
      const turn = (keys['KeyA']||keys['ArrowLeft']? -1:0) + (keys['KeyD']||keys['ArrowRight']? 1:0);
      const thrust = (keys['KeyW']||keys['ArrowUp']? 1:0) + (keys['KeyS']||keys['ArrowDown']? -0.6:0);
      s.node.rotation.y += turn * s.turnRate * dt;
      const forward = new BABYLON.Vector3(Math.sin(s.node.rotation.y), 0, Math.cos(s.node.rotation.y));
      s.node.position.addInPlace(forward.scale(thrust * s.speed * dt));
      // bound to water area ring
      const lim = 120; if(s.node.position.length() > lim){ s.node.position = s.node.position.normalize().scale(lim); }
    }

    // Auto fire for all ships
    ALL_FRIENDLIES.forEach(f=>{
      f.fireCooldown -= dt;
      const t = nearestEnemy(f.node.position, f.range);
      if(t && f.fireCooldown<=0){ const dir = t.node.position.subtract(f.node.position).normalize(); fireBullet(f.node, dir, 55, f.damage, true); f.fireCooldown = 1 / f.fireRate; }
    });

    // Enemies: steer toward island center
    for(let i=ENEMIES.length-1;i>=0;i--){ const e = ENEMIES[i];
      const dir = e.target.subtract(e.node.position); const dist = dir.length(); const nd = dir.normalize();
      e.node.rotation.y = Math.atan2(nd.x, nd.z);
      e.node.position.addInPlace(nd.scale(e.speed*dt));
      if(dist < islandRadiusDamage){ // reached island
        game.islandHP -= 4*dt; ui.hpEl.textContent = game.islandHP|0; if(game.islandHP<=0){ gameOver(); return; }
        // Let enemy circle a bit then despawn
        e.hp -= 60*dt; if(e.hp<=0){ e.node.dispose(); ENEMIES.splice(i,1); }
      }
    }

    // Bullets update and collisions
    for(let i=BULLETS.length-1;i>=0;i--){ const b=BULLETS[i]; b.mesh.position.addInPlace(b.vel.scale(dt)); b.life -= dt; if(b.life<=0){ b.mesh.dispose(); BULLETS.splice(i,1); continue; }
      if(b.friendly){
        // check against enemies
        for(let j=ENEMIES.length-1;j>=0;j--){ const e=ENEMIES[j]; if(BABYLON.Vector3.DistanceSquared(b.mesh.position, e.node.position) < (e.radius*e.radius)){ e.hp -= b.dmg; hitEffect(b.mesh.position); b.mesh.dispose(); BULLETS.splice(i,1); if(e.hp<=0){ e.node.dispose(); ENEMIES.splice(j,1); game.gold += 10; updateHUD(); checkWaveEnd(); } break; }
        }
      } else {
        // enemy bullets vs friendly / island (optional in this prototype — skipped)
      }
    }

    // particle sparks
    for(let i=PS.length-1;i>=0;i--){ const p=PS[i]; p.s.position.addInPlace(p.v.scale(dt)); p.life -= dt; p.s.scaling.scaleInPlace(0.98); if(p.life<=0){ p.s.dispose(); PS.splice(i,1);} }

    checkWaveEnd();
  });

  function gameOver(){ ui.finalWave.textContent = game.wave; ui.over.style.display='flex'; game.between=true; }

  // -----------------------------------------------------
  // Render
  // -----------------------------------------------------
  engine.runRenderLoop(()=> scene.render());
  window.addEventListener('resize', ()=> engine.resize());
})();
</script>
</body>
</html>
