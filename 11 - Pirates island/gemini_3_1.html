<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Island Defense (Babylon.js)</title>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        /* UI Overlay */
        #uiLayer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas by default */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Interactive UI elements must have pointer-events: auto */
        .interactive {
            pointer-events: auto;
        }

        /* Top HUD */
        #topHud {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }
        .stat-box span { color: #ffd700; }
        .hp-box span { color: #ff4444; }

        /* Bottom Section: Upgrades & Selection */
        #bottomHud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
        }

        /* Selection Indicator */
        #selectionHud {
            background: rgba(20, 15, 10, 0.85);
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            text-align: center;
            min-width: 200px;
        }
        #selectionHud h3 { margin: 0 0 10px 0; color: #b8860b; }
        #selectionHud p { margin: 5px 0; font-size: 14px; }
        .controls-hint { font-size: 12px; color: #aaa; margin-top: 10px; }

        /* Upgrades Panel */
        #upgradePanel {
            background: rgba(20, 15, 10, 0.85);
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 15px;
            color: white;
        }
        #upgradePanel h3 { margin: 0 0 15px 0; color: #ffd700; text-align: center; }
        
        .upgrade-btn {
            display: block;
            width: 100%;
            background: #8b4513;
            color: white;
            border: 1px solid #d2691e;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
        }
        .upgrade-btn:hover { background: #a0522d; }
        .upgrade-btn:active { background: #cd853f; }
        .upgrade-btn:disabled { background: #444; color: #888; border-color: #333; cursor: not-allowed; }

        /* Center Messages */
        #centerMessage {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border: 4px solid #b8860b;
            border-radius: 10px;
            color: white;
            display: none;
        }
        #centerMessage h1 { margin: 0 0 20px 0; color: #ffd700; font-size: 40px;}
        #startWaveBtn {
            background: #2e8b57;
            color: white;
            border: 2px solid #3cb371;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        #startWaveBtn:hover { background: #3cb371; }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="uiLayer">
        <!-- Top HUD -->
        <div id="topHud">
            <div class="hp-box">Island HP: <span id="ui-hp">100</span>/100</div>
            <div class="stat-box">Gold: <span id="ui-gold">0</span> <span style="font-size:16px;">🪙</span></div>
            <div class="stat-box">Wave: <span id="ui-wave">1</span></div>
            <div class="stat-box">Enemies Left: <span id="ui-enemies">0</span></div>
        </div>

        <!-- Center Wave Message -->
        <div id="centerMessage" class="interactive">
            <h1 id="msgTitle">Wave 1 Ready</h1>
            <button id="startWaveBtn">Start Next Wave</button>
        </div>

        <!-- Bottom HUD -->
        <div id="bottomHud">
            <!-- Selected Ship Info -->
            <div id="selectionHud" class="interactive">
                <h3 id="ui-selected-name">Ship 1</h3>
                <p>Damage: <span id="ui-stat-dmg">10</span></p>
                <p>Fire Rate: <span id="ui-stat-rate">1.0</span>/s</p>
                <p>Speed: <span id="ui-stat-speed">5.0</span></p>
                <div class="controls-hint">Select: Keys [1], [2], [3]<br>Move: Left Click Water</div>
            </div>

            <!-- Upgrades -->
            <div id="upgradePanel" class="interactive">
                <h3>Upgrades (Selected Ship)</h3>
                <button class="upgrade-btn" id="upg-dmg" onclick="buyUpgrade('dmg')">
                    + Damage (<span id="cost-dmg">10</span>g)
                </button>
                <button class="upgrade-btn" id="upg-rate" onclick="buyUpgrade('rate')">
                    + Fire Rate (<span id="cost-rate">15</span>g)
                </button>
                <button class="upgrade-btn" id="upg-speed" onclick="buyUpgrade('speed')">
                    + Speed (<span id="cost-speed">10</span>g)
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        const gameState = {
            islandHP: 100,
            gold: 15,
            wave: 0,
            state: "LOBBY", // LOBBY, PLAYING, GAME_OVER
            enemiesToSpawn: 0,
            spawnTimer: 0,
            selectedShipIndex: 0
        };

        const config = {
            baseEnemyHP: 20,
            baseEnemySpeed: 2.5,
            enemySpawnRate: 150, // frames between spawns
            projectileSpeed: 30
        };

        let friendlies = [];
        let enemies = [];
        let projectiles = [];

        // UI Elements
        const elHp = document.getElementById("ui-hp");
        const elGold = document.getElementById("ui-gold");
        const elWave = document.getElementById("ui-wave");
        const elEnemies = document.getElementById("ui-enemies");
        
        const elSelName = document.getElementById("ui-selected-name");
        const elStatDmg = document.getElementById("ui-stat-dmg");
        const elStatRate = document.getElementById("ui-stat-rate");
        const elStatSpeed = document.getElementById("ui-stat-speed");
        
        const btnUpgDmg = document.getElementById("upg-dmg");
        const btnUpgRate = document.getElementById("upg-rate");
        const btnUpgSpeed = document.getElementById("upg-speed");
        const costDmg = document.getElementById("cost-dmg");
        const costRate = document.getElementById("cost-rate");
        const costSpeed = document.getElementById("cost-speed");

        const centerMsg = document.getElementById("centerMessage");
        const msgTitle = document.getElementById("msgTitle");
        const startWaveBtn = document.getElementById("startWaveBtn");

        // --- BABYLON ENGINE SETUP ---
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // --- SCENE CREATION ---
        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.5, 0.8, 0.9); // Sky color

            // Camera: Orbiting above the island
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 50, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 90;
            camera.upperBetaLimit = Math.PI / 2.2; // Don't go below water

            // Lighting
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.7;
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.intensity = 0.5;

            // Materials
            const matWater = new BABYLON.StandardMaterial("matWater", scene);
            matWater.diffuseColor = new BABYLON.Color3(0.1, 0.4, 0.8);
            matWater.specularColor = new BABYLON.Color3(0.8, 0.8, 0.8);
            matWater.alpha = 0.9;

            const matIsland = new BABYLON.StandardMaterial("matIsland", scene);
            matIsland.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2);

            // Create Environment
            const water = BABYLON.MeshBuilder.CreateGround("water", {width: 200, height: 200}, scene);
            water.material = matWater;

            const island = BABYLON.MeshBuilder.CreateCylinder("island", {diameter: 12, height: 2, tessellation: 24}, scene);
            island.position.y = 0.5;
            island.material = matIsland;

            // Island Props (Simple Rocks/Trees)
            for(let i=0; i<3; i++) {
                let rock = BABYLON.MeshBuilder.CreateDodecahedron("rock", {size: 1.5}, scene);
                rock.position = new BABYLON.Vector3(Math.cos(i*2)*3, 1, Math.sin(i*2)*3);
                rock.scaling.y = 0.5;
                let rMat = new BABYLON.StandardMaterial("rMat", scene);
                rMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                rock.material = rMat;
            }

            // Selection Marker (A glowing ring under the selected ship)
            const selectionMarker = BABYLON.MeshBuilder.CreateTorus("selection", {diameter: 4, thickness: 0.2}, scene);
            const selMat = new BABYLON.StandardMaterial("selMat", scene);
            selMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0);
            selectionMarker.material = selMat;
            selectionMarker.position.y = 0.1;

            scene.selectionMarker = selectionMarker;

            return scene;
        };

        const scene = createScene();

        // --- ENTITY FACTORIES ---

        function createShipMesh(isEnemy, name) {
            const shipNode = new BABYLON.TransformNode(name);

            // Hull
            const hull = BABYLON.MeshBuilder.CreateBox("hull", {width: 1.5, height: 1, depth: 3}, scene);
            hull.position.y = 0.5;
            const matHull = new BABYLON.StandardMaterial("matHull", scene);
            matHull.diffuseColor = isEnemy ? new BABYLON.Color3(0.2, 0.1, 0.1) : new BABYLON.Color3(0.6, 0.4, 0.2);
            hull.material = matHull;
            hull.parent = shipNode;

            // Front taper
            const bow = BABYLON.MeshBuilder.CreateCylinder("bow", {diameter: 1.5, height: 1, tessellation: 3}, scene);
            bow.rotation.y = Math.PI / 2;
            bow.position.y = 0.5;
            bow.position.z = 1.5;
            bow.material = matHull;
            bow.parent = shipNode;

            // Mast
            const mast = BABYLON.MeshBuilder.CreateCylinder("mast", {diameter: 0.2, height: 3}, scene);
            mast.position.y = 2.0;
            mast.parent = shipNode;

            // Sail
            const sail = BABYLON.MeshBuilder.CreatePlane("sail", {width: 2.5, height: 2.5}, scene);
            sail.position.y = 2.2;
            sail.position.z = 0.2;
            const matSail = new BABYLON.StandardMaterial("matSail", scene);
            matSail.diffuseColor = isEnemy ? new BABYLON.Color3(0.8, 0.1, 0.1) : new BABYLON.Color3(0.9, 0.9, 0.9);
            matSail.backFaceCulling = false;
            sail.material = matSail;
            sail.parent = shipNode;

            return shipNode;
        }

        function spawnFriendly(index, startPos) {
            const mesh = createShipMesh(false, "Friendly_" + index);
            mesh.position = startPos.clone();
            
            const ship = {
                index: index,
                mesh: mesh,
                targetPos: startPos.clone(),
                
                // Stats
                damage: 10,
                fireRate: 1.0, // Shots per second
                speed: 6.0,
                range: 25.0,
                
                // Upgrade Costs
                costDmg: 10,
                costRate: 15,
                costSpeed: 10,
                
                lastFireTime: 0
            };
            friendlies.push(ship);
        }

        function spawnEnemy() {
            // Spawn in a circle far away
            const angle = Math.random() * Math.PI * 2;
            const radius = 70;
            const pos = new BABYLON.Vector3(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
            
            const mesh = createShipMesh(true, "Enemy");
            mesh.position = pos;
            
            // Point towards center
            mesh.lookAt(BABYLON.Vector3.Zero());

            const enemy = {
                mesh: mesh,
                hp: config.baseEnemyHP + (gameState.wave * 10), // Scales with wave
                speed: config.baseEnemySpeed + (gameState.wave * 0.2),
            };
            enemies.push(enemy);
        }

        function spawnProjectile(startPos, targetEnemy, damage) {
            const mesh = BABYLON.MeshBuilder.CreateSphere("proj", {diameter: 0.4}, scene);
            mesh.position = startPos.clone();
            mesh.position.y = 1; // shoot from deck height

            const mat = new BABYLON.StandardMaterial("pMat", scene);
            mat.emissiveColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            mat.diffuseColor = new BABYLON.Color3(0,0,0);
            mesh.material = mat;

            projectiles.push({
                mesh: mesh,
                target: targetEnemy,
                damage: damage
            });
        }

        // Quick particle explosion
        function createExplosion(pos) {
            const particleSystem = new BABYLON.ParticleSystem("particles", 50, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
            particleSystem.emitter = pos; 
            particleSystem.minEmitBox = new BABYLON.Vector3(-1, 0, -1);
            particleSystem.maxEmitBox = new BABYLON.Vector3(1, 0, 1);
            particleSystem.color1 = new BABYLON.Color4(1, 0.5, 0, 1);
            particleSystem.color2 = new BABYLON.Color4(1, 0.1, 0, 1);
            particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
            particleSystem.minSize = 0.5;
            particleSystem.maxSize = 1.5;
            particleSystem.minLifeTime = 0.2;
            particleSystem.maxLifeTime = 0.5;
            particleSystem.emitRate = 500;
            particleSystem.createSphereEmitter(1.5);
            particleSystem.targetStopDuration = 0.1; // Stop immediately
            particleSystem.disposeOnStop = true;
            particleSystem.start();
        }

        // --- INPUT & CONTROL ---
        
        // Select ships via 1, 2, 3
        window.addEventListener("keydown", (e) => {
            if(e.key === "1") selectShip(0);
            if(e.key === "2") selectShip(1);
            if(e.key === "3") selectShip(2);
        });

        // Click to move
        scene.onPointerObservable.add((pointerInfo) => {
            if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERDOWN) {
                if(pointerInfo.event.button === 0) { // Left click
                    const pick = pointerInfo.pickInfo;
                    if(pick.hit && (pick.pickedMesh.name === "water" || pick.pickedMesh.name === "island")) {
                        if(gameState.state === "PLAYING" || gameState.state === "LOBBY") {
                            const p = pick.pickedPoint;
                            friendlies[gameState.selectedShipIndex].targetPos = new BABYLON.Vector3(p.x, 0, p.z);
                        }
                    }
                }
            }
        });

        function selectShip(index) {
            if(index < 0 || index >= friendlies.length) return;
            gameState.selectedShipIndex = index;
            updateUI();
        }

        function buyUpgrade(type) {
            const ship = friendlies[gameState.selectedShipIndex];
            if(type === 'dmg' && gameState.gold >= ship.costDmg) {
                gameState.gold -= ship.costDmg;
                ship.damage += 5;
                ship.costDmg = Math.floor(ship.costDmg * 1.5);
            } else if(type === 'rate' && gameState.gold >= ship.costRate) {
                gameState.gold -= ship.costRate;
                ship.fireRate += 0.5;
                ship.costRate = Math.floor(ship.costRate * 1.5);
            } else if(type === 'speed' && gameState.gold >= ship.costSpeed) {
                gameState.gold -= ship.costSpeed;
                ship.speed += 1.5;
                ship.costSpeed = Math.floor(ship.costSpeed * 1.5);
            }
            updateUI();
        }

        // --- GAME LOGIC & LOOP ---

        // Setup Initial Friendlies
        spawnFriendly(0, new BABYLON.Vector3(10, 0, 0));
        spawnFriendly(1, new BABYLON.Vector3(-10, 0, 10));
        spawnFriendly(2, new BABYLON.Vector3(-10, 0, -10));
        
        centerMsg.style.display = "block";
        updateUI();

        startWaveBtn.addEventListener("click", () => {
            gameState.wave++;
            gameState.enemiesToSpawn = 4 + Math.floor(gameState.wave * 2.5);
            gameState.state = "PLAYING";
            centerMsg.style.display = "none";
            updateUI();
        });

        // Main Render Loop
        scene.onBeforeRenderObservable.add(() => {
            let dt = engine.getDeltaTime() / 1000; // seconds

            // 1. Move Friendlies & Manage Marker
            let selShip = friendlies[gameState.selectedShipIndex];
            if(selShip) {
                scene.selectionMarker.position.x = selShip.mesh.position.x;
                scene.selectionMarker.position.z = selShip.mesh.position.z;
                scene.selectionMarker.rotation.y += dt; // spin marker
            }

            friendlies.forEach(ship => {
                let dist = BABYLON.Vector3.Distance(ship.mesh.position, ship.targetPos);
                if(dist > 0.5) {
                    // Turn towards target
                    ship.mesh.lookAt(ship.targetPos);
                    // Move
                    let dir = ship.targetPos.subtract(ship.mesh.position).normalize();
                    ship.mesh.position.addInPlace(dir.scale(ship.speed * dt));
                }

                // Combat (Auto-fire)
                if (gameState.state === "PLAYING") {
                    let now = Date.now();
                    let msPerShot = 1000 / ship.fireRate;
                    if(now - ship.lastFireTime > msPerShot) {
                        // Find closest enemy
                        let closest = null;
                        let minDist = ship.range;
                        enemies.forEach(e => {
                            let d = BABYLON.Vector3.Distance(ship.mesh.position, e.mesh.position);
                            if(d < minDist) {
                                minDist = d;
                                closest = e;
                            }
                        });

                        if(closest) {
                            spawnProjectile(ship.mesh.position, closest, ship.damage);
                            ship.lastFireTime = now;
                        }
                    }
                }
            });

            if (gameState.state === "PLAYING") {
                // Spawning
                if (gameState.enemiesToSpawn > 0) {
                    gameState.spawnTimer++;
                    if(gameState.spawnTimer >= config.enemySpawnRate) {
                        spawnEnemy();
                        gameState.enemiesToSpawn--;
                        gameState.spawnTimer = 0;
                        updateUI();
                    }
                }

                // Move Enemies
                for(let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    let distToIsland = BABYLON.Vector3.Distance(e.mesh.position, BABYLON.Vector3.Zero());
                    
                    if (distToIsland <= 6) {
                        // Reached Island!
                        gameState.islandHP -= 10;
                        createExplosion(e.mesh.position);
                        e.mesh.dispose();
                        enemies.splice(i, 1);
                        updateUI();
                        checkGameOver();
                    } else {
                        // Move to center
                        let dir = BABYLON.Vector3.Zero().subtract(e.mesh.position).normalize();
                        e.mesh.position.addInPlace(dir.scale(e.speed * dt));
                        e.mesh.lookAt(BABYLON.Vector3.Zero());
                    }
                }

                // Projectiles
                for(let i = projectiles.length - 1; i >= 0; i--) {
                    let p = projectiles[i];
                    // If target died before hit, destroy proj
                    if(p.target.mesh.isDisposed()) {
                        p.mesh.dispose();
                        projectiles.splice(i, 1);
                        continue;
                    }

                    let dir = p.target.mesh.position.subtract(p.mesh.position).normalize();
                    p.mesh.position.addInPlace(dir.scale(config.projectileSpeed * dt));

                    if(BABYLON.Vector3.Distance(p.mesh.position, p.target.mesh.position) < 1.5) {
                        // Hit!
                        p.target.hp -= p.damage;
                        p.mesh.dispose();
                        projectiles.splice(i, 1);

                        if(p.target.hp <= 0) {
                            // Enemy Dies
                            createExplosion(p.target.mesh.position);
                            p.target.mesh.dispose();
                            let index = enemies.indexOf(p.target);
                            if(index > -1) enemies.splice(index, 1);
                            gameState.gold += 5; // Reward
                            updateUI();
                        }
                    }
                }

                // Check Wave Over
                if (gameState.enemiesToSpawn === 0 && enemies.length === 0 && gameState.islandHP > 0) {
                    gameState.state = "LOBBY";
                    msgTitle.innerText = `Wave ${gameState.wave} Cleared!`;
                    centerMsg.style.display = "block";
                    // Heal island a bit between waves
                    gameState.islandHP = Math.min(100, gameState.islandHP + 20);
                    updateUI();
                }
            }
        });

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });

        // --- UI UPDATER ---
        function updateUI() {
            elHp.innerText = gameState.islandHP;
            elGold.innerText = gameState.gold;
            elWave.innerText = gameState.wave;
            elEnemies.innerText = gameState.enemiesToSpawn + enemies.length;

            const ship = friendlies[gameState.selectedShipIndex];
            if(ship) {
                elSelName.innerText = `Pirate Ship ${gameState.selectedShipIndex + 1}`;
                elStatDmg.innerText = ship.damage;
                elStatRate.innerText = ship.fireRate.toFixed(1);
                elStatSpeed.innerText = ship.speed.toFixed(1);

                costDmg.innerText = ship.costDmg;
                costRate.innerText = ship.costRate;
                costSpeed.innerText = ship.costSpeed;

                btnUpgDmg.disabled = gameState.gold < ship.costDmg;
                btnUpgRate.disabled = gameState.gold < ship.costRate;
                btnUpgSpeed.disabled = gameState.gold < ship.costSpeed;
            }
        }

        function checkGameOver() {
            if(gameState.islandHP <= 0) {
                gameState.islandHP = 0;
                gameState.state = "GAME_OVER";
                msgTitle.innerText = "The Island Has Fallen!";
                msgTitle.style.color = "#ff4444";
                startWaveBtn.innerText = "Restart Game";
                startWaveBtn.onclick = () => location.reload();
                centerMsg.style.display = "block";
                updateUI();
            }
        }
    </script>
</body>
</html>
