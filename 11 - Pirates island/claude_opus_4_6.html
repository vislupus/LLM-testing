<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isle of Cannons — Pirate Defense</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.3.2/babylon.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs-materials/7.3.2/babylonjs.materials.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --parchment: #f4e8c1;
  --ink: #2c1810;
  --gold: #d4a528;
  --gold-bright: #f0c040;
  --red: #c0392b;
  --green: #27ae60;
  --blue: #2980b9;
  --wood: #5d3a1a;
  --wood-light: #8b5e3c;
  --panel: rgba(20,12,8,0.88);
  --panel-border: rgba(180,140,80,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'JetBrains Mono',monospace}
canvas#renderCanvas{width:100%;height:100%;display:block;outline:none}

/* ═══ HUD ═══ */
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;color:var(--parchment)}

/* Top bar */
#top-bar{position:absolute;top:0;left:0;right:0;padding:12px 20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.top-section{display:flex;gap:16px;align-items:center}
.stat-box{background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;padding:6px 14px;display:flex;align-items:center;gap:8px}
.stat-icon{font-size:16px}
.stat-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(244,232,193,0.45);font-family:'Cinzel',serif}
.stat-value{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--parchment)}
.stat-value.gold-val{color:var(--gold-bright)}
.stat-value.hp-val{color:#66dd88}

/* Island HP bar */
.hp-bar-wrap{width:140px;height:8px;background:rgba(0,0,0,0.5);border-radius:4px;overflow:hidden;margin-top:2px}
.hp-bar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--green));border-radius:4px;transition:width 0.4s}

/* Ship selection indicators */
#ship-select-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:all}
.ship-btn{background:var(--panel);border:2px solid rgba(180,140,80,0.2);border-radius:8px;padding:8px 16px;color:var(--parchment);font-family:'Cinzel',serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:90px}
.ship-btn:hover{border-color:var(--gold);background:rgba(40,25,15,0.95)}
.ship-btn.selected{border-color:var(--gold-bright);box-shadow:0 0 15px rgba(212,165,40,0.3);background:rgba(50,30,15,0.95)}
.ship-btn .ship-key{font-size:9px;color:rgba(244,232,193,0.4);letter-spacing:1px}
.ship-btn .ship-hp-bar{width:60px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin-top:3px}
.ship-btn .ship-hp-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.3s}

/* Wave announcement */
#wave-announce{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Cinzel',serif;font-size:36px;font-weight:900;color:var(--gold-bright);text-shadow:0 0 30px rgba(212,165,40,0.4),0 2px 4px rgba(0,0,0,0.8);opacity:0;transition:opacity 0.5s;pointer-events:none;letter-spacing:4px}
#wave-announce.show{opacity:1}

/* Upgrade panel (between waves) */
#upgrade-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--panel-border);border-radius:12px;padding:24px 28px;pointer-events:all;display:none;flex-direction:column;align-items:center;gap:16px;min-width:380px;backdrop-filter:blur(6px)}
#upgrade-panel.show{display:flex}
.up-title{font-family:'Cinzel',serif;font-size:20px;font-weight:800;color:var(--gold-bright);letter-spacing:3px}
.up-subtitle{font-size:10px;color:rgba(244,232,193,0.4);letter-spacing:2px}
.up-ships{display:flex;gap:12px;width:100%}
.up-ship-col{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center}
.up-ship-name{font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:var(--parchment);letter-spacing:1px}
.up-btn{width:100%;padding:6px 8px;background:rgba(80,50,20,0.5);border:1px solid rgba(180,140,80,0.2);border-radius:5px;color:var(--parchment);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;transition:all 0.15s;text-align:left;display:flex;justify-content:space-between;align-items:center}
.up-btn:hover{border-color:var(--gold);background:rgba(100,60,25,0.6)}
.up-btn:disabled{opacity:0.35;cursor:default}
.up-btn:disabled:hover{border-color:rgba(180,140,80,0.2);background:rgba(80,50,20,0.5)}
.up-cost{color:var(--gold);font-weight:600;font-size:10px}
.up-done-btn{margin-top:4px;padding:10px 32px;background:var(--green);border:none;border-radius:6px;color:#fff;font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all 0.15s}
.up-done-btn:hover{background:#2ecc71;transform:translateY(-1px)}

/* Controls hint */
#controls-hint{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(244,232,193,0.25);letter-spacing:1px;pointer-events:none;text-align:center}

/* Game Over overlay */
#gameover{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;pointer-events:all;z-index:100;backdrop-filter:blur(4px)}
#gameover.show{display:flex}
.go-title{font-family:'Cinzel',serif;font-size:40px;font-weight:900;color:var(--red);letter-spacing:4px}
.go-score{font-family:'Cinzel',serif;font-size:18px;color:var(--gold-bright)}
.go-btn{margin-top:10px;padding:12px 36px;background:transparent;border:2px solid var(--gold);border-radius:8px;color:var(--gold-bright);font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:all 0.2s}
.go-btn:hover{background:var(--gold);color:var(--ink)}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="hud">
  <div id="top-bar">
    <div class="top-section">
      <div class="stat-box">
        <span class="stat-icon">🏝️</span>
        <div>
          <div class="stat-label">Island HP</div>
          <div class="hp-bar-wrap"><div class="hp-bar-fill" id="hp-fill" style="width:100%"></div></div>
        </div>
        <div class="stat-value hp-val" id="hp-val">100</div>
      </div>
      <div class="stat-box">
        <span class="stat-icon">⚓</span>
        <div>
          <div class="stat-label">Wave</div>
          <div class="stat-value" id="wave-val">1</div>
        </div>
      </div>
    </div>
    <div class="top-section">
      <div class="stat-box">
        <span class="stat-icon">💰</span>
        <div>
          <div class="stat-label">Gold</div>
          <div class="stat-value gold-val" id="gold-val">0</div>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon">💀</span>
        <div>
          <div class="stat-label">Sunk</div>
          <div class="stat-value" id="kills-val">0</div>
        </div>
      </div>
    </div>
  </div>

  <div id="ship-select-bar">
    <div class="ship-btn selected" onclick="selectShip(0)" id="ship-btn-0">
      <span class="ship-key">[1]</span>Vanguard
      <div class="ship-hp-bar"><div class="ship-hp-fill" id="ship-hp-0" style="width:100%"></div></div>
    </div>
    <div class="ship-btn" onclick="selectShip(1)" id="ship-btn-1">
      <span class="ship-key">[2]</span>Corsair
      <div class="ship-hp-bar"><div class="ship-hp-fill" id="ship-hp-1" style="width:100%"></div></div>
    </div>
    <div class="ship-btn" onclick="selectShip(2)" id="ship-btn-2">
      <span class="ship-key">[3]</span>Tempest
      <div class="ship-hp-bar"><div class="ship-hp-fill" id="ship-hp-2" style="width:100%"></div></div>
    </div>
  </div>

  <div id="wave-announce"></div>
  <div id="controls-hint">1-3 Select Ship · WASD/Arrows Steer · Mouse Orbit · F Fire · Space Next Wave</div>

  <div id="upgrade-panel">
    <div class="up-title">UPGRADE FLEET</div>
    <div class="up-subtitle" id="up-gold-display">Gold: 0</div>
    <div class="up-ships" id="up-ships-container"></div>
    <button class="up-done-btn" onclick="closeUpgrades()">SET SAIL ⚓</button>
  </div>
</div>

<div id="gameover">
  <div class="go-title">DEFEAT</div>
  <div class="go-score" id="go-score">Survived 0 Waves</div>
  <button class="go-btn" onclick="location.reload()">SAIL AGAIN</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// ISLE OF CANNONS — 3D Pirate Tower Defense
// ═══════════════════════════════════════════════════════════════

// ┌─────────────────────────────────────┐
// │  ENGINE & SCENE SETUP               │
// └─────────────────────────────────────┘
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, { stencil: true });
const scene  = new BABYLON.Scene(engine);

scene.clearColor = new BABYLON.Color4(0.08, 0.15, 0.25, 1);
scene.ambientColor = new BABYLON.Color3(0.15, 0.18, 0.22);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogColor = new BABYLON.Color3(0.45, 0.60, 0.72);
scene.fogDensity = 0.003;

// ── Camera: Arc-rotate for orbit view ──
const camera = new BABYLON.ArcRotateCamera('cam', -Math.PI/4, Math.PI/3.5, 80, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 30;
camera.upperRadiusLimit = 180;
camera.lowerBetaLimit = 0.3;
camera.upperBetaLimit = Math.PI/2.2;
camera.wheelPrecision = 8;
camera.panningSensibility = 0; // Disable panning

// ── Lighting ──
const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, 0.3), scene);
sun.intensity = 1.3;
sun.diffuse = new BABYLON.Color3(1, 0.95, 0.82);

const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
hemi.intensity = 0.5;
hemi.diffuse = new BABYLON.Color3(0.6, 0.75, 0.9);
hemi.groundColor = new BABYLON.Color3(0.15, 0.2, 0.1);

// ── Shadows ──
const shadowGen = new BABYLON.ShadowGenerator(1024, sun);
shadowGen.useBlurExponentialShadowMap = true;
shadowGen.blurKernel = 16;

// ┌─────────────────────────────────────┐
// │  OCEAN / WATER PLANE                │
// └─────────────────────────────────────┘
const waterMesh = BABYLON.MeshBuilder.CreateGround('water', { width: 500, height: 500, subdivisions: 64 }, scene);
const waterMat = new BABYLON.StandardMaterial('waterMat', scene);
waterMat.diffuseColor = new BABYLON.Color3(0.05, 0.3, 0.5);
waterMat.specularColor = new BABYLON.Color3(0.6, 0.65, 0.7);
waterMat.specularPower = 64;
waterMat.alpha = 0.85;
waterMesh.material = waterMat;
waterMesh.position.y = -0.3;
waterMesh.receiveShadows = true;

// Animate water vertices for wave effect
const waterPositions = waterMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
const waterOrigY = new Float32Array(waterPositions.length / 3);
for (let i = 0; i < waterOrigY.length; i++) waterOrigY[i] = waterPositions[i * 3 + 1];

let waterTime = 0;
function animateWater(dt) {
  waterTime += dt;
  const positions = waterMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for (let i = 0; i < waterOrigY.length; i++) {
    const x = positions[i * 3];
    const z = positions[i * 3 + 2];
    positions[i * 3 + 1] = waterOrigY[i] +
      Math.sin(x * 0.04 + waterTime * 1.2) * 0.5 +
      Math.cos(z * 0.06 + waterTime * 0.8) * 0.3 +
      Math.sin((x + z) * 0.03 + waterTime * 0.5) * 0.4;
  }
  waterMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
}

// Second deeper water layer
const deepWater = BABYLON.MeshBuilder.CreateGround('deep', { width: 600, height: 600 }, scene);
const deepMat = new BABYLON.StandardMaterial('deepMat', scene);
deepMat.diffuseColor = new BABYLON.Color3(0.02, 0.12, 0.25);
deepMat.specularColor = BABYLON.Color3.Black();
deepWater.material = deepMat;
deepWater.position.y = -2;

// ┌─────────────────────────────────────┐
// │  ISLAND                             │
// └─────────────────────────────────────┘
// Main island body — a squashed sphere with noise for organic shape
const island = BABYLON.MeshBuilder.CreateSphere('island', { diameter: 24, segments: 24 }, scene);
island.scaling = new BABYLON.Vector3(1.4, 0.2, 1.2);
island.position.y = 0.5;
const islandMat = new BABYLON.StandardMaterial('islandMat', scene);
islandMat.diffuseColor = new BABYLON.Color3(0.35, 0.6, 0.2);
islandMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
island.material = islandMat;
island.receiveShadows = true;

// Sandy beach ring
const beach = BABYLON.MeshBuilder.CreateTorus('beach', { diameter: 24, thickness: 4, tessellation: 32 }, scene);
beach.scaling = new BABYLON.Vector3(1.3, 0.1, 1.1);
beach.position.y = 0.1;
const beachMat = new BABYLON.StandardMaterial('beachMat', scene);
beachMat.diffuseColor = new BABYLON.Color3(0.85, 0.78, 0.55);
beachMat.specularColor = BABYLON.Color3.Black();
beach.material = beachMat;

// ── Palm Trees (procedural) ──
function createPalm(x, z) {
  // Trunk — tapered cylinder
  const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', { diameterTop: 0.3, diameterBottom: 0.5, height: 6, tessellation: 8 }, scene);
  trunk.position = new BABYLON.Vector3(x, 3.5, z);
  // Slight lean
  trunk.rotation.x = Math.random() * 0.2 - 0.1;
  trunk.rotation.z = Math.random() * 0.2 - 0.1;
  const trunkMat = new BABYLON.StandardMaterial('trunkMat', scene);
  trunkMat.diffuseColor = new BABYLON.Color3(0.45, 0.3, 0.15);
  trunkMat.specularColor = BABYLON.Color3.Black();
  trunk.material = trunkMat;
  shadowGen.addShadowCaster(trunk);

  // Fronds — flattened spheres arranged as leaves
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const frond = BABYLON.MeshBuilder.CreateSphere('frond', { diameter: 3, segments: 6 }, scene);
    frond.scaling = new BABYLON.Vector3(0.4, 0.12, 1.2);
    frond.position = new BABYLON.Vector3(
      x + Math.cos(angle) * 1.5,
      6.2 + Math.random() * 0.3,
      z + Math.sin(angle) * 1.5
    );
    frond.rotation.y = angle;
    frond.rotation.x = 0.5;
    const frondMat = new BABYLON.StandardMaterial('frondMat', scene);
    frondMat.diffuseColor = new BABYLON.Color3(0.15 + Math.random()*0.1, 0.55 + Math.random()*0.15, 0.1);
    frondMat.specularColor = BABYLON.Color3.Black();
    frond.material = frondMat;
    shadowGen.addShadowCaster(frond);
  }

  // Coconuts
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * Math.PI * 2;
    const coco = BABYLON.MeshBuilder.CreateSphere('coco', { diameter: 0.4 }, scene);
    coco.position = new BABYLON.Vector3(x + Math.cos(a)*0.4, 5.8, z + Math.sin(a)*0.4);
    const cocoMat = new BABYLON.StandardMaterial('cocoMat', scene);
    cocoMat.diffuseColor = new BABYLON.Color3(0.35, 0.22, 0.08);
    coco.material = cocoMat;
  }
}

createPalm(2, -1);
createPalm(-3, 2);
createPalm(0, 4);

// ── Rocks ──
function createRock(x, z, scale) {
  const rock = BABYLON.MeshBuilder.CreateSphere('rock', { diameter: 2, segments: 6 }, scene);
  rock.scaling = new BABYLON.Vector3(scale * (0.8+Math.random()*0.4), scale * (0.4+Math.random()*0.3), scale * (0.8+Math.random()*0.4));
  rock.position = new BABYLON.Vector3(x, 0.5 * scale * 0.4, z);
  rock.rotation.y = Math.random() * Math.PI;
  const rockMat = new BABYLON.StandardMaterial('rockMat', scene);
  rockMat.diffuseColor = new BABYLON.Color3(0.4+Math.random()*0.1, 0.38+Math.random()*0.1, 0.35+Math.random()*0.1);
  rockMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
  rock.material = rockMat;
  rock.receiveShadows = true;
  shadowGen.addShadowCaster(rock);
}

createRock(8, 3, 1.5);
createRock(-7, -4, 1.2);
createRock(5, -6, 1.0);
createRock(-9, 1, 0.8);

// ┌─────────────────────────────────────┐
// │  SHIP BUILDER (Procedural)          │
// └─────────────────────────────────────┘
function buildShipMesh(name, hullColor, sailColor) {
  const parent = new BABYLON.TransformNode(name, scene);

  // Hull — stretched box with custom shape
  const hull = BABYLON.MeshBuilder.CreateBox('hull_' + name, { width: 2.2, height: 1.0, depth: 5.5 }, scene);
  hull.parent = parent;
  hull.position.y = 0.6;
  const hullMat = new BABYLON.StandardMaterial('hullMat_' + name, scene);
  hullMat.diffuseColor = hullColor;
  hullMat.specularColor = new BABYLON.Color3(0.1, 0.08, 0.05);
  hull.material = hullMat;
  shadowGen.addShadowCaster(hull);
  hull.receiveShadows = true;

  // Bow (front point)
  const bow = BABYLON.MeshBuilder.CreateCylinder('bow_' + name, {
    diameterTop: 0, diameterBottom: 2.2, height: 2, tessellation: 4
  }, scene);
  bow.parent = parent;
  bow.rotation.x = Math.PI / 2;
  bow.position.set(0, 0.6, 3.5);
  bow.material = hullMat;
  shadowGen.addShadowCaster(bow);

  // Deck
  const deck = BABYLON.MeshBuilder.CreateBox('deck_' + name, { width: 1.8, height: 0.1, depth: 5 }, scene);
  deck.parent = parent;
  deck.position.y = 1.15;
  const deckMat = new BABYLON.StandardMaterial('deckMat_' + name, scene);
  deckMat.diffuseColor = new BABYLON.Color3(0.55, 0.38, 0.2);
  deckMat.specularColor = BABYLON.Color3.Black();
  deck.material = deckMat;

  // Mast
  const mast = BABYLON.MeshBuilder.CreateCylinder('mast_' + name, { diameter: 0.15, height: 5.5 }, scene);
  mast.parent = parent;
  mast.position.y = 3.9;
  const mastMat = new BABYLON.StandardMaterial('mastMat_' + name, scene);
  mastMat.diffuseColor = new BABYLON.Color3(0.4, 0.28, 0.15);
  mast.material = mastMat;
  shadowGen.addShadowCaster(mast);

  // Sail — flattened box
  const sail = BABYLON.MeshBuilder.CreateBox('sail_' + name, { width: 0.08, height: 3.5, depth: 3 }, scene);
  sail.parent = parent;
  sail.position.set(0, 4.5, 0.2);
  const sailMat = new BABYLON.StandardMaterial('sailMat_' + name, scene);
  sailMat.diffuseColor = sailColor;
  sailMat.specularColor = BABYLON.Color3.Black();
  sailMat.backFaceCulling = false;
  sail.material = sailMat;
  shadowGen.addShadowCaster(sail);

  // Crow's nest
  const nest = BABYLON.MeshBuilder.CreateTorus('nest_' + name, { diameter: 0.6, thickness: 0.08, tessellation: 12 }, scene);
  nest.parent = parent;
  nest.position.y = 6.5;
  nest.material = mastMat;

  // Cannon indicators (small cylinders on each side)
  for (const side of [-1, 1]) {
    const cannon = BABYLON.MeshBuilder.CreateCylinder('cannon_' + name + side, {
      diameter: 0.2, height: 0.8, tessellation: 8
    }, scene);
    cannon.parent = parent;
    cannon.rotation.z = Math.PI / 2 * side;
    cannon.position.set(side * 1.3, 0.9, 0);
    const cannonMat = new BABYLON.StandardMaterial('cannonMat', scene);
    cannonMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);
    cannon.material = cannonMat;
  }

  return parent;
}

// ┌─────────────────────────────────────┐
// │  GAME STATE                         │
// └─────────────────────────────────────┘
const ISLAND_RADIUS = 15;
const SPAWN_RADIUS = 120;
const ISLAND_DAMAGE_RANGE = 12;

let islandHP = 100;
let maxIslandHP = 100;
let gold = 50;
let wave = 0;
let kills = 0;
let selectedShipIdx = 0;
let gameOver = false;
let waveActive = false;
let betweenWaves = true;
let enemiesRemaining = 0;
let waveEnemyCount = 0;
let spawnTimer = 0;
let spawnInterval = 3;
let totalKills = 0;

// ── Keys ──
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Digit1') selectShip(0);
  if (e.code === 'Digit2') selectShip(1);
  if (e.code === 'Digit3') selectShip(2);
  if (e.code === 'Space' && betweenWaves && !document.getElementById('upgrade-panel').classList.contains('show')) {
    e.preventDefault();
    startNextWave();
  }
  if (e.code === 'KeyF') manualFire();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ── Friendly Ships ──
const SHIP_NAMES = ['Vanguard', 'Corsair', 'Tempest'];
const SHIP_HULL_COLORS = [
  new BABYLON.Color3(0.5, 0.25, 0.1),
  new BABYLON.Color3(0.3, 0.15, 0.08),
  new BABYLON.Color3(0.4, 0.2, 0.15),
];
const SHIP_SAIL_COLORS = [
  new BABYLON.Color3(0.9, 0.85, 0.7),
  new BABYLON.Color3(0.8, 0.2, 0.15),
  new BABYLON.Color3(0.2, 0.3, 0.7),
];

const friendlyShips = [];

function createFriendlyShip(idx) {
  const angle = (idx / 3) * Math.PI * 2 - Math.PI / 2;
  const r = 22;
  const mesh = buildShipMesh('friendly_' + idx, SHIP_HULL_COLORS[idx], SHIP_SAIL_COLORS[idx]);
  mesh.position.x = Math.cos(angle) * r;
  mesh.position.z = Math.sin(angle) * r;
  mesh.position.y = 0.3;

  // Face tangent to circle (perpendicular to radius)
  mesh.rotation.y = angle + Math.PI / 2;

  return {
    mesh,
    hp: 80,
    maxHp: 80,
    speed: 8,
    damage: 20,
    fireRate: 2.0,   // seconds between shots
    fireTimer: 0,
    alive: true,
    // Upgrade levels
    damageLvl: 0,
    fireRateLvl: 0,
    speedLvl: 0,
    // Steering
    targetAngle: angle + Math.PI / 2,
  };
}

for (let i = 0; i < 3; i++) {
  friendlyShips.push(createFriendlyShip(i));
}

function selectShip(idx) {
  if (!friendlyShips[idx].alive) return;
  selectedShipIdx = idx;
  document.querySelectorAll('.ship-btn').forEach((b, i) => b.classList.toggle('selected', i === idx));
}

// ── Enemy Ships ──
const enemyShips = [];

function buildEnemyMesh(idx) {
  const parent = new BABYLON.TransformNode('enemy_' + idx, scene);

  const hull = BABYLON.MeshBuilder.CreateBox('ehull', { width: 1.8, height: 0.8, depth: 4.5 }, scene);
  hull.parent = parent;
  hull.position.y = 0.5;
  const hullMat = new BABYLON.StandardMaterial('ehullMat', scene);
  hullMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
  hull.material = hullMat;
  shadowGen.addShadowCaster(hull);

  const bow = BABYLON.MeshBuilder.CreateCylinder('ebow', { diameterTop: 0, diameterBottom: 1.8, height: 1.5, tessellation: 4 }, scene);
  bow.parent = parent;
  bow.rotation.x = Math.PI / 2;
  bow.position.set(0, 0.5, 2.8);
  bow.material = hullMat;

  const mast = BABYLON.MeshBuilder.CreateCylinder('emast', { diameter: 0.12, height: 4.5 }, scene);
  mast.parent = parent;
  mast.position.y = 3;
  const mastMat = new BABYLON.StandardMaterial('emastMat', scene);
  mastMat.diffuseColor = new BABYLON.Color3(0.25, 0.18, 0.1);
  mast.material = mastMat;

  const sail = BABYLON.MeshBuilder.CreateBox('esail', { width: 0.06, height: 2.8, depth: 2.5 }, scene);
  sail.parent = parent;
  sail.position.set(0, 3.8, 0);
  const sailMat = new BABYLON.StandardMaterial('esailMat', scene);
  sailMat.diffuseColor = new BABYLON.Color3(0.15, 0.12, 0.12);
  sailMat.backFaceCulling = false;
  sail.material = sailMat;

  // Skull flag (red sphere on top)
  const flag = BABYLON.MeshBuilder.CreateSphere('eflag', { diameter: 0.5 }, scene);
  flag.parent = parent;
  flag.position.y = 5.5;
  const flagMat = new BABYLON.StandardMaterial('eflagMat', scene);
  flagMat.diffuseColor = new BABYLON.Color3(0.8, 0.1, 0.1);
  flagMat.emissiveColor = new BABYLON.Color3(0.3, 0.02, 0.02);
  flag.material = flagMat;

  return parent;
}

let enemyMeshIdx = 0;
function spawnEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const mesh = buildEnemyMesh(enemyMeshIdx++);
  mesh.position.x = Math.cos(angle) * SPAWN_RADIUS;
  mesh.position.z = Math.sin(angle) * SPAWN_RADIUS;
  mesh.position.y = 0.3;

  // Face toward island
  mesh.rotation.y = Math.atan2(-mesh.position.x, -mesh.position.z);

  const hpScale = 1 + wave * 0.15;
  const speedScale = 1 + wave * 0.03;
  enemyShips.push({
    mesh,
    hp: 40 * hpScale,
    maxHp: 40 * hpScale,
    speed: (3 + Math.random() * 1.5) * speedScale,
    damage: 5 + wave,
    alive: true,
    attackTimer: 0,
    attackCooldown: 2.5,
  });
}

// ── Cannonballs ──
const cannonballs = [];

function fireCannonball(from, target, damage) {
  const ball = BABYLON.MeshBuilder.CreateSphere('ball', { diameter: 0.4, segments: 6 }, scene);
  ball.position = from.clone();
  ball.position.y = 1.5;
  const mat = new BABYLON.StandardMaterial('ballMat', scene);
  mat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);
  mat.emissiveColor = new BABYLON.Color3(0.1, 0.05, 0);
  ball.material = mat;

  // Trajectory: parabolic arc from source to target
  const dx = target.x - from.x;
  const dz = target.z - from.z;
  const dist = Math.sqrt(dx * dx + dz * dz);
  const flightTime = dist / 30;

  cannonballs.push({
    mesh: ball,
    startPos: from.clone(),
    endPos: target.clone(),
    time: 0,
    duration: Math.max(flightTime, 0.3),
    damage,
    arcHeight: Math.min(dist * 0.2, 8),
  });
}

function createSplash(pos) {
  // Simple splash particles using small spheres
  for (let i = 0; i < 6; i++) {
    const p = BABYLON.MeshBuilder.CreateSphere('splash', { diameter: 0.2, segments: 4 }, scene);
    p.position = pos.clone();
    p.position.y = 0.5;
    const mat = new BABYLON.StandardMaterial('splashMat', scene);
    mat.diffuseColor = new BABYLON.Color3(0.6, 0.75, 0.85);
    mat.emissiveColor = new BABYLON.Color3(0.2, 0.3, 0.35);
    mat.alpha = 0.7;
    p.material = mat;

    const angle = (i / 6) * Math.PI * 2;
    const speed = 3 + Math.random() * 3;
    const vx = Math.cos(angle) * speed;
    const vz = Math.sin(angle) * speed;
    const vy = 4 + Math.random() * 3;

    let t = 0;
    const startPos = p.position.clone();
    const obs = scene.onBeforeRenderObservable.add(() => {
      t += 0.016;
      p.position.x = startPos.x + vx * t;
      p.position.z = startPos.z + vz * t;
      p.position.y = startPos.y + vy * t - 9.8 * t * t;
      p.scaling.setAll(1 - t * 1.5);
      if (t > 0.6) {
        p.dispose();
        scene.onBeforeRenderObservable.remove(obs);
      }
    });
  }
}

function createExplosion(pos) {
  // Fire burst
  for (let i = 0; i < 12; i++) {
    const p = BABYLON.MeshBuilder.CreateSphere('exp', { diameter: 0.3 + Math.random()*0.3, segments: 4 }, scene);
    p.position = pos.clone();
    const mat = new BABYLON.StandardMaterial('expMat', scene);
    const t_c = Math.random();
    mat.emissiveColor = new BABYLON.Color3(1, 0.4 + t_c * 0.4, t_c * 0.2);
    mat.diffuseColor = BABYLON.Color3.Black();
    p.material = mat;

    const angle = Math.random() * Math.PI * 2;
    const elev = Math.random() * Math.PI - Math.PI/2;
    const speed = 4 + Math.random() * 6;
    const vx = Math.cos(angle) * Math.cos(elev) * speed;
    const vy = Math.sin(elev) * speed + 2;
    const vz = Math.sin(angle) * Math.cos(elev) * speed;

    let t = 0;
    const startP = p.position.clone();
    const obs = scene.onBeforeRenderObservable.add(() => {
      t += 0.016;
      p.position.x = startP.x + vx * t;
      p.position.y = startP.y + vy * t - 5 * t * t;
      p.position.z = startP.z + vz * t;
      const s = Math.max(0, 1 - t * 1.8);
      p.scaling.setAll(s);
      if (t > 0.7) {
        p.dispose();
        scene.onBeforeRenderObservable.remove(obs);
      }
    });
  }
}

// ┌─────────────────────────────────────┐
// │  GAME LOGIC UPDATE                  │
// └─────────────────────────────────────┘

function updateFriendlyShips(dt) {
  for (let i = 0; i < friendlyShips.length; i++) {
    const ship = friendlyShips[i];
    if (!ship.alive) continue;

    const mesh = ship.mesh;

    // ── Steering (only selected ship responds to input) ──
    if (i === selectedShipIdx) {
      let turnRate = 1.5;
      if (keys['ArrowLeft'] || keys['KeyA']) mesh.rotation.y += turnRate * dt;
      if (keys['ArrowRight'] || keys['KeyD']) mesh.rotation.y -= turnRate * dt;

      let moveDir = 0;
      if (keys['ArrowUp'] || keys['KeyW']) moveDir = 1;
      if (keys['ArrowDown'] || keys['KeyS']) moveDir = -1;

      if (moveDir !== 0) {
        const forward = new BABYLON.Vector3(
          Math.sin(mesh.rotation.y) * moveDir,
          0,
          Math.cos(mesh.rotation.y) * moveDir
        );
        mesh.position.addInPlace(forward.scale(ship.speed * dt));
      }
    }

    // Keep ships on water
    mesh.position.y = 0.3 + Math.sin(waterTime * 2 + i * 1.5) * 0.15;

    // Gentle rocking
    mesh.rotation.x = Math.sin(waterTime * 1.5 + i * 2) * 0.03;
    mesh.rotation.z = Math.cos(waterTime * 1.8 + i * 1.7) * 0.04;

    // ── Auto-fire at nearest enemy ──
    ship.fireTimer -= dt;
    if (ship.fireTimer <= 0 && enemyShips.length > 0) {
      let nearest = null;
      let nearestDist = Infinity;
      for (const e of enemyShips) {
        if (!e.alive) continue;
        const d = BABYLON.Vector3.Distance(mesh.position, e.mesh.position);
        if (d < nearestDist && d < 45) {
          nearestDist = d;
          nearest = e;
        }
      }
      if (nearest) {
        // Lead the target slightly
        const lead = new BABYLON.Vector3(
          Math.sin(nearest.mesh.rotation.y) * nearest.speed * 0.3,
          0,
          Math.cos(nearest.mesh.rotation.y) * nearest.speed * 0.3
        );
        const targetPos = nearest.mesh.position.add(lead);
        fireCannonball(mesh.position, targetPos, ship.damage);
        ship.fireTimer = ship.fireRate;
      }
    }

    // Update ship HP display
    const hpPct = Math.max(0, ship.hp / ship.maxHp) * 100;
    document.getElementById('ship-hp-' + i).style.width = hpPct + '%';
  }
}

function updateEnemyShips(dt) {
  for (let i = enemyShips.length - 1; i >= 0; i--) {
    const e = enemyShips[i];
    if (!e.alive) continue;

    const mesh = e.mesh;

    // Sail toward island (0,0,0)
    const dx = -mesh.position.x;
    const dz = -mesh.position.z;
    const distToIsland = Math.sqrt(dx * dx + dz * dz);
    const targetAngle = Math.atan2(dx, dz);

    // Smooth rotation toward island
    let angleDiff = targetAngle - mesh.rotation.y;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    mesh.rotation.y += angleDiff * 2 * dt;

    // Move forward
    if (distToIsland > ISLAND_DAMAGE_RANGE) {
      mesh.position.x += Math.sin(mesh.rotation.y) * e.speed * dt;
      mesh.position.z += Math.cos(mesh.rotation.y) * e.speed * dt;
    }

    // Water bob
    mesh.position.y = 0.3 + Math.sin(waterTime * 2 + i * 3 + 10) * 0.12;
    mesh.rotation.x = Math.sin(waterTime * 1.3 + i) * 0.03;

    // Attack island when close
    if (distToIsland <= ISLAND_DAMAGE_RANGE) {
      e.attackTimer -= dt;
      if (e.attackTimer <= 0) {
        islandHP -= e.damage;
        e.attackTimer = e.attackCooldown;

        // Visual feedback — flash island
        islandMat.emissiveColor = new BABYLON.Color3(0.5, 0.1, 0.05);
        setTimeout(() => { islandMat.emissiveColor = BABYLON.Color3.Black(); }, 150);
      }
    }

    // Fire at nearby friendly ships occasionally
    e.attackTimer -= dt * 0.5;  // Slow fire at ships
    if (e.attackTimer <= 0) {
      for (const f of friendlyShips) {
        if (!f.alive) continue;
        const d = BABYLON.Vector3.Distance(mesh.position, f.mesh.position);
        if (d < 30) {
          fireCannonball(mesh.position, f.mesh.position, 8 + wave * 2);
          e.attackTimer = e.attackCooldown;
          break;
        }
      }
    }
  }
}

function updateCannonballs(dt) {
  for (let i = cannonballs.length - 1; i >= 0; i--) {
    const cb = cannonballs[i];
    cb.time += dt;
    const t = cb.time / cb.duration;

    if (t >= 1) {
      // Hit!
      const hitPos = cb.endPos.clone();
      hitPos.y = 0.5;
      createSplash(hitPos);

      // Check if hit an enemy
      let hitSomething = false;
      for (const e of enemyShips) {
        if (!e.alive) continue;
        const d = BABYLON.Vector3.Distance(cb.endPos, e.mesh.position);
        if (d < 4) {
          e.hp -= cb.damage;
          hitSomething = true;
          if (e.hp <= 0) {
            destroyEnemy(e);
          }
          break;
        }
      }

      // Check if hit a friendly ship
      if (!hitSomething) {
        for (const f of friendlyShips) {
          if (!f.alive) continue;
          const d = BABYLON.Vector3.Distance(cb.endPos, f.mesh.position);
          if (d < 3) {
            f.hp -= cb.damage;
            if (f.hp <= 0) {
              f.alive = false;
              f.mesh.setEnabled(false);
              createExplosion(f.mesh.position);
              // Auto-select next alive ship
              for (let s = 0; s < 3; s++) {
                if (friendlyShips[s].alive) { selectShip(s); break; }
              }
            }
            break;
          }
        }
      }

      cb.mesh.dispose();
      cannonballs.splice(i, 1);
      continue;
    }

    // Parabolic interpolation
    const x = cb.startPos.x + (cb.endPos.x - cb.startPos.x) * t;
    const z = cb.startPos.z + (cb.endPos.z - cb.startPos.z) * t;
    const y = cb.startPos.y + (cb.endPos.y - cb.startPos.y) * t + cb.arcHeight * Math.sin(t * Math.PI);
    cb.mesh.position.set(x, y, z);
  }
}

function destroyEnemy(e) {
  e.alive = false;
  createExplosion(e.mesh.position);
  setTimeout(() => { e.mesh.dispose(); }, 100);

  // Remove from array
  const idx = enemyShips.indexOf(e);
  if (idx >= 0) enemyShips.splice(idx, 1);

  kills++;
  totalKills++;
  gold += 15 + wave * 3;
  enemiesRemaining--;

  if (enemiesRemaining <= 0 && waveActive) {
    endWave();
  }
}

function manualFire() {
  const ship = friendlyShips[selectedShipIdx];
  if (!ship.alive) return;
  if (ship.fireTimer > ship.fireRate * 0.3) return; // Respect partial cooldown

  // Fire forward from ship
  const forward = new BABYLON.Vector3(
    Math.sin(ship.mesh.rotation.y),
    0,
    Math.cos(ship.mesh.rotation.y)
  );
  const targetPos = ship.mesh.position.add(forward.scale(25));
  fireCannonball(ship.mesh.position, targetPos, ship.damage);
  ship.fireTimer = ship.fireRate;
}

// ┌─────────────────────────────────────┐
// │  WAVE SYSTEM                        │
// └─────────────────────────────────────┘

function startNextWave() {
  wave++;
  waveActive = true;
  betweenWaves = false;
  kills = 0;

  waveEnemyCount = 3 + wave * 2;
  enemiesRemaining = waveEnemyCount;
  spawnTimer = 0;
  spawnInterval = Math.max(1.0, 3.5 - wave * 0.15);

  // Announce wave
  const el = document.getElementById('wave-announce');
  el.textContent = `WAVE ${wave}`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);

  document.getElementById('wave-val').textContent = wave;
  document.getElementById('controls-hint').textContent = '1-3 Select Ship · WASD/Arrows Steer · F Fire · Mouse Orbit';
}

function endWave() {
  waveActive = false;
  betweenWaves = true;

  // Bonus gold
  gold += 20 + wave * 10;

  // Heal friendly ships slightly
  for (const s of friendlyShips) {
    if (s.alive) s.hp = Math.min(s.hp + 15, s.maxHp);
  }

  const el = document.getElementById('wave-announce');
  el.textContent = 'WAVE CLEARED!';
  el.classList.add('show');
  setTimeout(() => {
    el.classList.remove('show');
    showUpgradePanel();
  }, 1800);

  document.getElementById('controls-hint').textContent = 'Upgrade your fleet, then press Space or click SET SAIL';
}

// ┌─────────────────────────────────────┐
// │  UPGRADE SYSTEM                     │
// └─────────────────────────────────────┘
const UPGRADE_COSTS = {
  damage:   [40, 70, 110, 160, 220],
  fireRate: [40, 70, 110, 160, 220],
  speed:    [30, 55, 90, 130, 180],
};
const MAX_UPGRADE = 5;

function showUpgradePanel() {
  const container = document.getElementById('up-ships-container');
  container.innerHTML = '';
  document.getElementById('up-gold-display').textContent = `Gold: ${gold}`;

  for (let i = 0; i < 3; i++) {
    const ship = friendlyShips[i];
    const col = document.createElement('div');
    col.className = 'up-ship-col';

    const nameEl = document.createElement('div');
    nameEl.className = 'up-ship-name';
    nameEl.textContent = ship.alive ? SHIP_NAMES[i] : `${SHIP_NAMES[i]} (SUNK)`;
    nameEl.style.opacity = ship.alive ? 1 : 0.3;
    col.appendChild(nameEl);

    if (ship.alive) {
      // Damage upgrade
      col.appendChild(makeUpgradeBtn(i, 'damage', '⚔ Damage', ship.damageLvl));
      // Fire rate upgrade
      col.appendChild(makeUpgradeBtn(i, 'fireRate', '🔥 Fire Rate', ship.fireRateLvl));
      // Speed upgrade
      col.appendChild(makeUpgradeBtn(i, 'speed', '💨 Speed', ship.speedLvl));
      // Repair
      if (ship.hp < ship.maxHp) {
        const repairCost = 25;
        const btn = document.createElement('button');
        btn.className = 'up-btn';
        btn.innerHTML = `🔧 Repair <span class="up-cost">${repairCost}g</span>`;
        btn.disabled = gold < repairCost;
        btn.onclick = () => {
          if (gold >= repairCost) {
            gold -= repairCost;
            ship.hp = ship.maxHp;
            showUpgradePanel(); // Refresh
          }
        };
        col.appendChild(btn);
      }
    }

    container.appendChild(col);
  }

  document.getElementById('upgrade-panel').classList.add('show');
}

function makeUpgradeBtn(shipIdx, stat, label, currentLvl) {
  const btn = document.createElement('button');
  btn.className = 'up-btn';

  if (currentLvl >= MAX_UPGRADE) {
    btn.innerHTML = `${label} <span class="up-cost">MAX</span>`;
    btn.disabled = true;
  } else {
    const cost = UPGRADE_COSTS[stat][currentLvl];
    btn.innerHTML = `${label} Lv${currentLvl + 1} <span class="up-cost">${cost}g</span>`;
    btn.disabled = gold < cost;
    btn.onclick = () => {
      if (gold >= cost) {
        gold -= cost;
        applyUpgrade(shipIdx, stat);
        showUpgradePanel(); // Refresh
      }
    };
  }
  return btn;
}

function applyUpgrade(shipIdx, stat) {
  const ship = friendlyShips[shipIdx];
  switch (stat) {
    case 'damage':
      ship.damageLvl++;
      ship.damage = 20 + ship.damageLvl * 8;
      break;
    case 'fireRate':
      ship.fireRateLvl++;
      ship.fireRate = Math.max(0.4, 2.0 - ship.fireRateLvl * 0.3);
      break;
    case 'speed':
      ship.speedLvl++;
      ship.speed = 8 + ship.speedLvl * 2;
      break;
  }
}

function closeUpgrades() {
  document.getElementById('upgrade-panel').classList.remove('show');
  startNextWave();
}

// ┌─────────────────────────────────────┐
// │  HUD UPDATE                         │
// └─────────────────────────────────────┘
function updateHUD() {
  document.getElementById('hp-val').textContent = Math.max(0, Math.round(islandHP));
  document.getElementById('hp-fill').style.width = Math.max(0, islandHP / maxIslandHP * 100) + '%';
  document.getElementById('gold-val').textContent = gold;
  document.getElementById('kills-val').textContent = totalKills;
}

// ┌─────────────────────────────────────┐
// │  SELECTION INDICATOR                │
// └─────────────────────────────────────┘
const selectRing = BABYLON.MeshBuilder.CreateTorus('selectRing', { diameter: 7, thickness: 0.2, tessellation: 24 }, scene);
const selectRingMat = new BABYLON.StandardMaterial('selectRingMat', scene);
selectRingMat.emissiveColor = new BABYLON.Color3(1, 0.85, 0.3);
selectRingMat.diffuseColor = BABYLON.Color3.Black();
selectRingMat.alpha = 0.6;
selectRing.material = selectRingMat;

function updateSelectRing() {
  const ship = friendlyShips[selectedShipIdx];
  if (ship.alive) {
    selectRing.setEnabled(true);
    selectRing.position.x = ship.mesh.position.x;
    selectRing.position.z = ship.mesh.position.z;
    selectRing.position.y = 0.3 + Math.sin(waterTime * 3) * 0.1;
    selectRing.rotation.y += 0.01;
  } else {
    selectRing.setEnabled(false);
  }
}

// ┌─────────────────────────────────────┐
// │  GAME OVER CHECK                    │
// └─────────────────────────────────────┘
function checkGameOver() {
  if (islandHP <= 0 && !gameOver) {
    gameOver = true;
    document.getElementById('go-score').textContent = `Survived ${wave} Wave${wave !== 1 ? 's' : ''} · ${totalKills} Ships Sunk · ${gold} Gold`;
    document.getElementById('gameover').classList.add('show');
  }
}

// ┌─────────────────────────────────────┐
// │  MAIN GAME LOOP                     │
// └─────────────────────────────────────┘
let lastTime = performance.now();

scene.registerBeforeRender(() => {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (gameOver) return;

  animateWater(dt);

  // Spawn enemies during wave
  if (waveActive) {
    const spawned = waveEnemyCount - enemiesRemaining + enemyShips.filter(e => e.alive).length;
    const toSpawn = waveEnemyCount - spawned + (enemyShips.filter(e => !e.alive).length);
    if (enemyShips.filter(e => e.alive).length < enemiesRemaining) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = spawnInterval;
      }
    }
  }

  updateFriendlyShips(dt);
  updateEnemyShips(dt);
  updateCannonballs(dt);
  updateSelectRing();
  updateHUD();
  checkGameOver();
});

// ── Render loop ──
engine.runRenderLoop(() => scene.render());
window.addEventListener('resize', () => engine.resize());

// ── Start first wave sequence ──
betweenWaves = true;
const announceEl = document.getElementById('wave-announce');
announceEl.textContent = 'PRESS SPACE TO BEGIN';
announceEl.classList.add('show');
document.getElementById('controls-hint').textContent = 'Press Space to launch the first wave';

// Auto-start on space
function waitForStart(e) {
  if (e.code === 'Space') {
    announceEl.classList.remove('show');
    document.removeEventListener('keydown', waitForStart);
    setTimeout(() => startNextWave(), 500);
  }
}
document.addEventListener('keydown', waitForStart);

// Also allow clicking the controls hint area to start on mobile
canvas.addEventListener('click', function startClick() {
  if (wave === 0 && betweenWaves) {
    announceEl.classList.remove('show');
    canvas.removeEventListener('click', startClick);
    setTimeout(() => startNextWave(), 500);
  }
});
</script>
