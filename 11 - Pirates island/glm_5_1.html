<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Island Defense</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .top-bar {
            display: flex; justify-content: center; gap: 40px;
            padding: 20px; font-size: 1.2rem; font-weight: bold;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }

        .stat-value { color: #ffd700; }

        .controls-hint {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px;
            font-size: 0.9rem; max-width: 220px;
        }

        .upgrade-panel {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            pointer-events: auto;
        }

        .upgrade-btn {
            background: rgba(0, 0, 0, 0.7); border: 2px solid #ffd700;
            color: white; padding: 10px; border-radius: 5px; cursor: pointer;
            text-align: left; transition: all 0.2s;
        }
        .upgrade-btn:hover { background: rgba(255, 215, 0, 0.3); }
        .upgrade-btn:disabled { border-color: #555; color: #777; cursor: not-allowed; background: rgba(0,0,0,0.4); }
        .cost { color: #ffd700; float: right; }

        .selection-indicator {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            font-size: 1.5rem; font-weight: bold; color: #4deaff;
            opacity: 0; transition: opacity 0.3s;
        }
        .selection-indicator.active { opacity: 1; }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: #ff4d4d; display: none; text-align: center;
            background: rgba(0,0,0,0.8); padding: 40px; border-radius: 15px;
            border: 3px solid #ff4d4d;
        }
    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="ui-overlay">
    <div class="top-bar">
        <div>Gold: <span class="stat-value" id="gold-val">0</span></div>
        <div>Wave: <span class="stat-value" id="wave-val">1</span></div>
        <div>Island HP: <span class="stat-value" id="hp-val">100</span></div>
    </div>
    
    <div class="selection-indicator" id="selection-text">Ship 1 Selected</div>

    <div class="controls-hint">
        <strong>Controls:</strong><br>
        Keys 1, 2, 3: Select Ship<br>
        W/A/S/D: Steer Ship<br>
        Ships auto-fire at enemies!
    </div>

    <div class="upgrade-panel">
        <button class="upgrade-btn" id="btn-dmg" onclick="upgradeStat('damage')">
            Increase Damage <span class="cost" id="cost-dmg">50g</span>
        </button>
        <button class="upgrade-btn" id="btn-rate" onclick="upgradeStat('fireRate')">
            Faster Fire Rate <span class="cost" id="cost-rate">50g</span>
        </button>
        <button class="upgrade-btn" id="btn-spd" onclick="upgradeStat('speed')">
            Increase Speed <span class="cost" id="cost-spd">50g</span>
        </button>
    </div>

    <div id="game-over">
        THE ISLAND HAS FALLEN!<br>
        <span style="font-size: 1.5rem; color: white;">Refresh to try again</span>
    </div>
</div>

<script>
    // --- Game State ---
    let gold = 0;
    let wave = 1;
    let islandHP = 100;
    let maxIslandHP = 100;
    let selectedShipIndex = 0;
    let gameOver = false;

    let enemies = [];
    let cannonballs = [];
    let friendlyShips = [];

    const UPGRADE_BASE_COST = 40;
    let upgradeLevels = { damage: 0, fireRate: 0, speed: 0 };

    // --- Input Map ---
    const keys = {};
    window.addEventListener('keydown', evt => keys[evt.key] = true);
    window.addEventListener('keyup', evt => {
        keys[evt.key] = false;
        if (evt.key === "1") selectShip(0);
        if (evt.key === "2") selectShip(1);
        if (evt.key === "3") selectShip(2);
    });

    // --- Babylon Setup ---
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { stencil: true });
    const scene = new BABYLON.Scene(engine);

    scene.clearColor = new BABYLON.Color4(0.4, 0.6, 0.9, 1); // Sky blue
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.005;
    scene.fogColor = new BABYLON.Color3(0.4, 0.6, 0.9);

    // Camera
    const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 45, BABYLON.Vector3.Zero(), scene);
    camera.lowerRadiusLimit = 15;
    camera.upperRadiusLimit = 70;
    camera.lowerBetaLimit = 0.2;
    camera.upperBetaLimit = 1.4;
    camera.attachControl(canvas, true);

    // Lights
    const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.8;
    hemiLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.4);
    
    const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
    dirLight.intensity = 0.5;

    // --- Procedural Stylized Water (Shader) ---
    BABYLON.Effect.ShadersStore["waterVertexShader"] = `
        precision highp float;
        attribute vec3 position;
        uniform mat4 worldViewProjection;
        uniform float time;
        varying vec3 vPosition;
        void main() {
            vec3 p = position;
            p.y += sin(p.x * 1.5 + time) * 0.5 + cos(p.z * 1.5 + time * 0.7) * 0.5;
            gl_Position = worldViewProjection * vec4(p, 1.0);
            vPosition = p;
        }
    `;
    BABYLON.Effect.ShadersStore["waterFragmentShader"] = `
        precision highp float;
        varying vec3 vPosition;
        uniform float time;
        void main() {
            vec3 color1 = vec3(0.1, 0.4, 0.7);
            vec3 color2 = vec3(0.2, 0.6, 0.9);
            float mixVal = (sin(vPosition.x * 2.0 + time) + cos(vPosition.z * 2.0 + time * 0.8) + 2.0) / 4.0;
            gl_FragColor = vec4(mix(color1, color2, mixVal), 0.9);
        }
    `;

    const water = BABYLON.MeshBuilder.CreateGround("water", {width: 250, height: 250, subdivisions: 64}, scene);
    const waterMat = new BABYLON.ShaderMaterial("waterShader", scene, {
        vertex: "water",
        fragment: "water",
    }, {
        attributes: ["position"],
        uniforms: ["worldViewProjection", "time"]
    });
    waterMat.backFaceCulling = false;
    waterMat.alpha = 0.9;
    water.material = waterMat;

    // --- Island Creation ---
    const islandBase = BABYLON.MeshBuilder.CreateCylinder("islandBase", {diameter: 16, height: 3, tessellation: 24}, scene);
    islandBase.position.y = -1;
    const sandMat = new BABYLON.StandardMaterial("sandMat", scene);
    sandMat.diffuseColor = new BABYLON.Color3(0.96, 0.87, 0.7);
    islandBase.material = sandMat;

    const islandGrass = BABYLON.MeshBuilder.CreateCylinder("islandGrass", {diameterTop: 14, diameterBottom: 15.5, height: 1, tessellation: 24}, scene);
    islandGrass.position.y = 0.2;
    const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
    grassMat.diffuseColor = new BABYLON.Color3(0.2, 0.7, 0.1);
    islandGrass.material = grassMat;

    // Props (Rocks & Palms)
    function createPalm(name, x, z) {
        const trunk = BABYLON.MeshBuilder.CreateCylinder(name+"t", {height: 5, diameterTop: 0.3, diameterBottom: 0.6, tessellation: 8}, scene);
        trunk.position = new BABYLON.Vector3(x, 2.7, z);
        const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
        woodMat.diffuseColor = new BABYLON.Color3(0.55, 0.27, 0.07);
        trunk.material = woodMat;
        trunk.rotation = new BABYLON.Vector3(Math.random()*0.2 - 0.1, 0, Math.random()*0.2 - 0.1);

        for(let i=0; i<5; i++) {
            const leaf = BABYLON.MeshBuilder.CreateBox(name+"l"+i, {width: 4, height: 0.1, depth: 1}, scene);
            leaf.position = new BABYLON.Vector3(x, 5.2, z);
            leaf.rotation.y = (Math.PI * 2 / 5) * i;
            leaf.rotation.x = -0.4; // Droop
            leaf.parent = trunk; // Move with trunk if we ever move it, and apply local offset
            leaf.position = new BABYLON.Vector3(0, 2.5, 0); // Local position
            const leafMat = new BABYLON.StandardMaterial("leafMat", scene);
            leafMat.diffuseColor = new BABYLON.Color3(0.1, 0.8, 0.1);
            leaf.material = leafMat;
        }
    }

    function createRock(x, z, s) {
        const rock = BABYLON.MeshBuilder.CreateSphere("rock", {diameter: 1, segments: 6}, scene);
        rock.position = new BABYLON.Vector3(x, 0.7, z);
        rock.scaling = new BABYLON.Vector3(s, s*0.6, s);
        const rockMat = new BABYLON.StandardMaterial("rockMat", scene);
        rockMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
        rock.material = rockMat;
    }

    createPalm("p1", 2, 2);
    createPalm("p2", -3, -1);
    createRock(4, -3, 1.5);
    createRock(-5, 3, 1.2);
    createRock(0, 5, 0.8);

    // --- Ship Creation ---
    function createShipMesh(name, colorHex) {
        const root = new BABYLON.TransformNode(name, scene);
        
        // Hull
        const hull = BABYLON.MeshBuilder.CreateBox(name+"hull", {width: 1, height: 0.6, depth: 3}, scene);
        hull.position.y = 0.3;
        hull.parent = root;
        const hullMat = new BABYLON.StandardMaterial("hullMat"+name, scene);
        hullMat.diffuseColor = BABYLON.Color3.FromHexString(colorHex);
        hull.material = hullMat;

        // Deck
        const deck = BABYLON.MeshBuilder.CreateBox(name+"deck", {width: 0.8, height: 0.2, depth: 2.6}, scene);
        deck.position.y = 0.65;
        deck.parent = root;
        const deckMat = new BABYLON.StandardMaterial("deckMat"+name, scene);
        deckMat.diffuseColor = new BABYLON.Color3(0.6, 0.4, 0.2); // Wood color
        deck.material = deckMat;

        // Mast
        const mast = BABYLON.MeshBuilder.CreateCylinder(name+"mast", {height: 2, diameter: 0.15}, scene);
        mast.position.y = 1.7;
        mast.position.z = -0.2;
        mast.parent = root;
        mast.material = deckMat;

        // Sail
        const sail = BABYLON.MeshBuilder.CreateBox(name+"sail", {width: 0.05, height: 1.5, depth: 1.5}, scene);
        sail.position.y = 1.9;
        sail.position.z = -0.2;
        sail.parent = root;
        const sailMat = new BABYLON.StandardMaterial("sailMat"+name, scene);
        sailMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
        sail.material = sailMat;

        // Cannon (visual only, front facing)
        const cannon = BABYLON.MeshBuilder.CreateCylinder(name+"cann", {height: 0.7, diameter: 0.2}, scene);
        cannon.rotation.x = Math.PI / 2;
        cannon.position.y = 0.5;
        cannon.position.z = 1.5;
        cannon.parent = root;
        const cannMat = new BABYLON.StandardMaterial("cannMat"+name, scene);
        cannMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
        cannon.material = cannMat;

        return root;
    }

    // Initialize Friendly Ships
    const shipColors = ["#e74c3c", "#3498db", "#f1c40f"]; // Red, Blue, Yellow
    const startPositions = [
        new BABYLON.Vector3(0, 0.2, 12),
        new BABYLON.Vector3(10, 0.2, -6),
        new BABYLON.Vector3(-10, 0.2, -6)
    ];

    for(let i=0; i<3; i++) {
        const mesh = createShipMesh("ship"+i, shipColors[i]);
        mesh.position = startPositions[i];
        mesh.rotation.y = Math.atan2(-mesh.position.x, -mesh.position.z); // Face island initially

        friendlyShips.push({
            mesh: mesh,
            baseDamage: 20,
            baseFireRate: 1500, // ms
            baseSpeed: 10,
            lastFireTime: 0,
            isSteered: false
        });
    }

    selectShip(0); // Select first ship by default

    // --- Enemy Spawner ---
    let enemiesPerWave = 2;
    let enemySpeedBase = 2;
    let enemyHPBase = 40;
    let waveState = "active"; // active, waiting
    let waitTimer = 0;

    function spawnEnemy() {
        const angle = Math.random() * Math.PI * 2;
        const dist = 90;
        const pos = new BABYLON.Vector3(Math.cos(angle)*dist, 0.2, Math.sin(angle)*dist);
        
        const mesh = createShipMesh("enemy"+Date.now(), "#2c3e50"); // Dark enemy
        mesh.position = pos;
        mesh.rotation.y = Math.atan2(-pos.x, -pos.z); // Face island center

        const hp = enemyHPBase + (wave * 10);
        const speed = enemySpeedBase + (wave * 0.2);

        enemies.push({
            mesh: mesh,
            hp: hp,
            maxHp: hp,
            speed: speed
        });

        // HP Bar Background
        const hpBg = BABYLON.MeshBuilder.CreatePlane("hpBg", {width: 2, height: 0.2}, scene);
        hpBg.position.y = 2;
        hpBg.parent = mesh;
        hpBg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
        const bgMat = new BABYLON.StandardMaterial("bgMat", scene);
        bgMat.diffuseColor = new BABYLON.Color3(1, 0, 0);
        bgMat.emissiveColor = new BABYLON.Color3(1, 0, 0);
        hpBg.material = bgMat;

        // HP Bar Foreground
        const hpFg = BABYLON.MeshBuilder.CreatePlane("hpFg", {width: 2, height: 0.2}, scene);
        hpFg.position.y = 2;
        hpFg.position.z = -0.01;
        hpFg.parent = mesh;
        hpFg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
        const fgMat = new BABYLON.StandardMaterial("fgMat", scene);
        fgMat.diffuseColor = new BABYLON.Color3(0, 1, 0);
        fgMat.emissiveColor = new BABYLON.Color3(0, 1, 0);
        hpFg.material = fgMat;

        enemies[enemies.length-1].hpBar = hpFg;
    }

    // --- Cannonball Logic ---
    function fireCannonball(ship, target) {
        const ball = BABYLON.MeshBuilder.CreateSphere("ball", {diameter: 0.3, segments: 8}, scene);
        ball.position = ship.mesh.position.clone();
        ball.position.y = 0.5;
        
        const mat = new BABYLON.StandardMaterial("ballMat", scene);
        mat.diffuseColor = new BABYLON.Color3(1, 0.5, 0);
        mat.emissiveColor = new BABYLON.Color3(1, 0.5, 0);
        ball.material = mat;

        // Direction to target
        const dir = target.position.subtract(ball.position).normalize();
        
        const dmg = ship.baseDamage + (upgradeLevels.damage * 15);
        
        cannonballs.push({
            mesh: ball,
            direction: dir,
            speed: 40,
            damage: dmg,
            isEnemy: false,
            life: 3 // seconds
        });
    }

    // --- UI Functions ---
    function selectShip(index) {
        selectedShipIndex = index;
        const txt = document.getElementById("selection-text");
        txt.innerText = `Ship ${index + 1} Selected`;
        txt.classList.add("active");
        setTimeout(() => txt.classList.remove("active"), 1500);
        
        // Visual selection indicator
        friendlyShips.forEach((s, i) => {
            if(s.mesh.getChildMeshes()[0]) {
                s.mesh.getChildMeshes()[0].renderOutline = (i === index);
                s.mesh.getChildMeshes()[0].outlineColor = new BABYLON.Color3(1, 1, 1);
                s.mesh.getChildMeshes()[0].outlineWidth = 0.05;
            }
        });
    }

    function updateUI() {
        document.getElementById("gold-val").innerText = gold;
        document.getElementById("wave-val").innerText = wave;
        document.getElementById("hp-val").innerText = islandHP;

        const dmgCost = UPGRADE_BASE_COST + (upgradeLevels.damage * 20);
        const rateCost = UPGRADE_BASE_COST + (upgradeLevels.fireRate * 20);
        const spdCost = UPGRADE_BASE_COST + (upgradeLevels.speed * 20);

        document.getElementById("cost-dmg").innerText = dmgCost + "g";
        document.getElementById("cost-rate").innerText = rateCost + "g";
        document.getElementById("cost-spd").innerText = spdCost + "g";

        document.getElementById("btn-dmg").disabled = gold < dmgCost;
        document.getElementById("btn-rate").disabled = gold < rateCost;
        document.getElementById("btn-spd").disabled = gold < spdCost;
    }

    window.upgradeStat = function(stat) {
        const cost = UPGRADE_BASE_COST + (upgradeLevels[stat] * 20);
        if (gold >= cost) {
            gold -= cost;
            upgradeLevels[stat]++;
            updateUI();
        }
    }

    // --- Main Game Loop ---
    let time = 0;
    scene.registerBeforeRender(function() {
        if (gameOver) return;

        const delta = engine.getDeltaTime() / 1000.0;
        time += delta;

        // Update Water Shader Time
        waterMat.setTime(time);

        // --- Wave Management ---
        if (waveState === "waiting") {
            waitTimer -= delta;
            if (waitTimer <= 0) {
                wave++;
                enemiesPerWave = 2 + wave;
                waveState = "active";
                updateUI();
            }
        } else if (waveState === "active" && enemies.length === 0) {
            // Spawn wave
            for(let i=0; i<enemiesPerWave; i++) {
                spawnEnemy();
            }
            // If all dead, wait for next
            // (Handled in enemy loop below when array empties)
        }

        // --- Steer Friendly Ship ---
        const activeShip = friendlyShhips[selectedShipIndex];
        if (activeShip) {
            let moveSpeed = (activeShip.baseSpeed + (upgradeLevels.speed * 2)) * delta;
            let rotSpeed = 2.0 * delta;
            let moved = false;

            if (keys["w"] || keys["W"]) { activeShip.mesh.translate(BABYLON.Axis.Z, moveSpeed, BABYLON.Space.LOCAL); moved = true; }
            if (keys["s"] || keys["S"]) { activeShip.mesh.translate(BABYLON.Axis.Z, -moveSpeed, BABYLON.Space.LOCAL); moved = true; }
            if (keys["a"] || keys["A"]) { activeShip.mesh.addRotation(0, -rotSpeed, 0); }
            if (keys["d"] || keys["D"]) { activeShip.mesh.addRotation(0, rotSpeed, 0); }

            // Boundary constraints for active ship (keep in water, don't walk on island)
            if (moved) {
                const distToCenter = BABYLON.Vector3.Distance(activeShip.mesh.position, BABYLON.Vector3.Zero());
                const minDist = 9; // Island radius roughly
                const maxDist = 100;

                if (distToCenter < minDist) {
                    const dir = activeShip.mesh.position.subtract(BABYLON.Vector3.Zero()).normalize();
                    activeShip.mesh.position = dir.scale(minDist);
                }
                if (distToCenter > maxDist) {
                    const dir = activeShip.mesh.position.subtract(BABYLON.Vector3.Zero()).normalize();
                    activeShip.mesh.position = dir.scale(maxDist);
                }
            }
        }

        // --- Friendly AI Auto-Fire ---
        friendlyShips.forEach(ship => {
            const now = performance.now();
            const fireRate = ship.baseFireRate - (upgradeLevels.fireRate * 150);
            
            if (now - ship.lastFireTime > fireRate && enemies.length > 0) {
                // Find closest enemy
                let closestDist = Infinity;
                let closestEnemy = null;
                enemies.forEach(en => {
                    const d = BABYLON.Vector3.Distance(ship.mesh.position, en.mesh.position);
                    if (d < closestDist) { closestDist = d; closestEnemy = en; }
                });

                // If in range (30 units)
                if (closestEnemy && closestDist < 30) {
                    fireCannonball(ship, closestEnemy.mesh);
                    ship.lastFireTime = now;
                }
            }
        });

        // --- Enemy Movement & Collision ---
        for (let i = enemies.length - 1; i >= 0; i--) {
            const en = enemies[i];
            // Move toward island
            const dirToCenter = BABYLON.Vector3.Zero().subtract(en.mesh.position).normalize();
            en.mesh.position.addInPlace(dirToCenter.scale(en.speed * delta));
            
            // Rotate to face center
            // (Spawning already faces center, but if we add dodging later, this updates)

            // Check hit island
            const distToCenter = BABYLON.Vector3.Distance(en.mesh.position, BABYLON.Vector3.Zero());
            if (distToCenter < 8.5) { // Island radius
                islandHP -= 10;
                // Destroy enemy
                en.mesh.dispose();
                enemies.splice(i, 1);
                updateUI();
                if (islandHP <= 0) {
                    gameOver = true;
                    document.getElementById("game-over").style.display = "block";
                }
            }
        }

        // If all enemies destroyed, start wait timer for next wave
        if (waveState === "active" && enemies.length === 0 && enemiesPerWave > 0) {
            waveState = "waiting";
            waitTimer = 5; // 5 seconds between waves
        }

        // --- Cannonball Movement & Collision ---
        for (let i = cannonballs.length - 1; i >= 0; i--) {
            const cb = cannonballs[i];
            cb.mesh.position.addInPlace(cb.direction.scale(cb.speed * delta));
            cb.life -= delta;

            let hit = false;

            if (!cb.isEnemy) {
                // Hit enemy?
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const en = enemies[j];
                    if (cb.mesh.intersectsMesh(en.mesh.getChildMeshes()[0], false)) {
                        en.hp -= cb.damage;
                        hit = true;
                        
                        // Update HP bar
                        const hpPercent = Math.max(0, en.hp / en.maxHp);
                        en.hpBar.scaling.x = hpPercent;
                        en.hpBar.position.x = - (1 - hpPercent); // Shift to stay left-aligned
                        
                        if (en.hp <= 0) {
                            en.mesh.dispose();
                            enemies.splice(j, 1);
                            gold += 10 + (wave * 2); // Reward
                            updateUI();
                        }
                        break;
                    }
                }
            }

            // Remove if hit, expired, or out of bounds
            if (hit || cb.life <= 0 || cb.mesh.position.length() > 110) {
                cb.mesh.dispose();
                cannonballs.splice(i, 1);
            }
        }
    });

    // Render loop
    engine.runRenderLoop(function() {
        scene.render();
    });

    // Resize
    window.addEventListener("resize", function() {
        engine.resize();
    });

    // Init
    updateUI();
</script>
</body>
</html>
