<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Island Defense</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #stats-bar {
            display: flex;
            justify-content: space-around;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            text-shadow: 1px 1px 2px black;
        }

        #game-over, #upgrade-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(20, 40, 60, 0.9);
            border: 2px solid #a0a0c0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            pointer-events: all; /* Make this panel clickable */
            display: none; /* Hidden by default */
        }
        
        #upgrade-panel h2 {
            margin-top: 0;
        }
        
        #upgrade-panel button, #game-over button {
            background-color: #c0a060;
            border: 1px solid #e0c080;
            color: #201000;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        #upgrade-panel button:hover, #game-over button:hover {
            background-color: #d0b070;
        }
        
        #upgrade-panel button.next-wave {
            margin-top: 20px;
            background-color: #a04040;
            color: white;
        }
        #upgrade-panel button.next-wave:hover {
             background-color: #c05050;
        }

    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materials/babylon.waterMaterial.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <div id="ui-overlay">
        <div id="stats-bar">
            <div id="island-hp">Island HP: 100</div>
            <div id="gold">Gold: 100</div>
            <div id="wave">Wave: 1</div>
        </div>
    </div>
    
    <div id="upgrade-panel">
        <h2>Wave Cleared!</h2>
        <p>Select a ship (1, 2, 3) to upgrade.</p>
        <div id="upgrade-buttons">
            <button id="upgrade-damage">Damage (+1) - 50 Gold</button>
            <button id="upgrade-firerate">Fire Rate (+) - 75 Gold</button>
            <button id="upgrade-speed">Speed (+) - 40 Gold</button>
        </div>
        <button id="next-wave-btn" class="next-wave">Start Next Wave</button>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>The island has been destroyed!</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);

        // --- Game State ---
        let islandHealth = 100;
        let gold = 100;
        let wave = 1;
        let gameState = "PLAYING"; // "PLAYING", "WAVE_END", "GAME_OVER"
        
        const playerShips = [];
        let selectedShipIndex = -1;
        const enemyShips = [];
        const cannonballs = [];
        
        let selectionIndicator;

        // --- UI Elements ---
        const islandHpUI = document.getElementById('island-hp');
        const goldUI = document.getElementById('gold');
        const waveUI = document.getElementById('wave');
        const upgradePanel = document.getElementById('upgrade-panel');
        const gameOverPanel = document.getElementById('game-over');

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.1, 0.2, 0.4);

            // --- Camera ---
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 4, 100, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 200;

            // --- Lighting ---
            const light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.8;
            const light2 = new BABYLON.PointLight("pointLight", new BABYLON.Vector3(0, 50, 0), scene);
            light2.intensity = 0.5;

            // --- Environment ---
            // Water
            const waterMaterial = new BABYLON.WaterMaterial("waterMaterial", scene, new BABYLON.Vector2(1024, 1024));
            waterMaterial.backFaceCulling = true;
            waterMaterial.bumpTexture = new BABYLON.Texture("https://www.babylonjs.com/assets/waterbump.png", scene);
            waterMaterial.windForce = -5;
            waterMaterial.waveHeight = 0.3;
            waterMaterial.bumpHeight = 0.1;
            waterMaterial.waveLength = 0.2;
            waterMaterial.colorBlendFactor = 0;
            waterMaterial.addToRenderList(light);
            
            const water = BABYLON.MeshBuilder.CreateGround("water", {width: 1024, height: 1024}, scene);
            water.material = waterMaterial;

            // Island
            const island = BABYLON.MeshBuilder.CreateCylinder("island", {height: 5, diameter: 30}, scene);
            island.position.y = -2;
            const islandMat = new BABYLON.StandardMaterial("islandMat", scene);
            islandMat.diffuseColor = new BABYLON.Color3(0.4, 0.6, 0.2); // Green
            island.material = islandMat;
            waterMaterial.addToRenderList(island);

            // Island Props
            const createPalmTree = (position) => {
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height: 8, diameter: 0.5}, scene);
                trunk.position = position;
                const trunkMat = new BABYLON.StandardMaterial("trunkMat", scene);
                trunkMat.diffuseColor = new BABYLON.Color3.FromHexString("#8B4513");
                trunk.material = trunkMat;
                waterMaterial.addToRenderList(trunk);

                for(let i = 0; i < 6; i++) {
                    const leaf = BABYLON.MeshBuilder.CreatePlane("leaf", {width: 6, height: 1}, scene);
                    leaf.material = islandMat;
                    leaf.parent = trunk;
                    leaf.position.y = 4;
                    leaf.rotation.x = -Math.PI / 4;
                    leaf.rotation.y = i * (Math.PI / 3);
                    waterMaterial.addToRenderList(leaf);
                }
            };
            createPalmTree(new BABYLON.Vector3(5, 2.5, 5));
            createPalmTree(new BABYLON.Vector3(-7, 2.5, -3));

            // --- Player Ships ---
            function createShip(color) {
                const hull = BABYLON.MeshBuilder.CreateBox("hull", {width: 2, height: 1, depth: 5}, scene);
                const mast = BABYLON.MeshBuilder.CreateCylinder("mast", {height: 6, diameter: 0.2}, scene);
                mast.position.y = 3;
                
                const shipMesh = BABYLON.Mesh.MergeMeshes([hull, mast], true, false, null, false, true);
                
                const mat = new BABYLON.StandardMaterial("shipMat", scene);
                mat.diffuseColor = color;
                shipMesh.material = mat;
                
                return shipMesh;
            }

            const ship1 = createShip(new BABYLON.Color3(0.8, 0.8, 1)); // Light Blue
            ship1.position = new BABYLON.Vector3(20, 0, 0);
            const ship2 = createShip(new BABYLON.Color3(1, 1, 1)); // White
            ship2.position = new BABYLON.Vector3(-10, 0, 17.32);
            ship2.rotation.y = Math.PI * 2 / 3;
            const ship3 = createShip(new BABYLON.Color3(1, 0.5, 0.5)); // Red
            ship3.position = new BABYLON.Vector3(-10, 0, -17.32);
            ship3.rotation.y = -Math.PI * 2 / 3;
            
            const shipData = (mesh) => ({
                mesh: mesh,
                speed: 10,
                damage: 10,
                fireRate: 2, // seconds per shot
                range: 40,
                cooldown: 0,
                destination: null,
            });
            
            playerShips.push(shipData(ship1));
            playerShips.push(shipData(ship2));
            playerShips.push(shipData(ship3));

            // Selection indicator
            selectionIndicator = BABYLON.MeshBuilder.CreateTorus("indicator", {diameter: 7, thickness: 0.2}, scene);
            selectionIndicator.material = new BABYLON.StandardMaterial("indMat", scene);
            selectionIndicator.material.diffuseColor = BABYLON.Color3.White();
            selectionIndicator.material.emissiveColor = BABYLON.Color3.White();
            selectionIndicator.setEnabled(false);

            // --- Input ---
            scene.onPointerDown = (evt, pickResult) => {
                // Right click for movement
                if (evt.button === 2 && selectedShipIndex !== -1) {
                    if (pickResult.hit && pickResult.pickedMesh === water) {
                        playerShips[selectedShipIndex].destination = pickResult.pickedPoint;
                    }
                }
            };

            // Disable context menu on right-click
            canvas.addEventListener("contextmenu", (e) => e.preventDefault());

            window.addEventListener("keydown", (e) => {
                if(e.key >= '1' && e.key <= '3') {
                    const index = parseInt(e.key) - 1;
                    if(index < playerShips.length) {
                        selectedShipIndex = index;
                        selectionIndicator.parent = playerShips[selectedShipIndex].mesh;
                        selectionIndicator.position.y = -0.5;
                        selectionIndicator.setEnabled(true);
                        console.log(`Ship ${selectedShipIndex + 1} selected.`);
                    }
                }
            });

            return scene;
        };
        
        const scene = createScene();
        
        // --- Game Logic ---
        function updateUI() {
            islandHpUI.textContent = `Island HP: ${Math.max(0, Math.round(islandHealth))}`;
            goldUI.textContent = `Gold: ${gold}`;
            waveUI.textContent = `Wave: ${wave}`;
        }
        
        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 250;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            
            const hull = BABYLON.MeshBuilder.CreateBox("e_hull", {width: 2, height: 1, depth: 4.5}, scene);
            const mast = BABYLON.MeshBuilder.CreateCylinder("e_mast", {height: 5, diameter: 0.2}, scene);
            mast.position.y = 2.5;
            
            const enemyMesh = BABYLON.Mesh.MergeMeshes([hull, mast], true, false, null, false, true);
            
            const mat = new BABYLON.StandardMaterial("enemyMat", scene);
            mat.diffuseColor = new BABYLON.Color3(0.2, 0.1, 0.1); // Dark brown/black
            enemyMesh.material = mat;
            enemyMesh.position = new BABYLON.Vector3(x, 0, z);
            
            const enemy = {
                mesh: enemyMesh,
                hp: 30 + wave * 10,
                speed: 5 + wave * 0.5,
                damage: 10 + wave * 2,
                goldValue: 10 + wave * 2,
            };
            enemyShips.push(enemy);
        }

        function startWave() {
            gameState = "PLAYING";
            hideUpgradePanel();
            for (let i = 0; i < 3 + wave * 2; i++) {
                setTimeout(() => spawnEnemy(), i * 1500);
            }
        }
        
        function fireCannonball(ship) {
            ship.cooldown = ship.fireRate;
            
            const target = enemyShips.find(e => BABYLON.Vector3.Distance(ship.mesh.position, e.mesh.position) <= ship.range);
            if (!target) return;
            
            const cannonball = BABYLON.MeshBuilder.CreateSphere("cannonball", {diameter: 0.5}, scene);
            cannonball.position = ship.mesh.position.clone();
            const cannonMat = new BABYLON.StandardMaterial("cannonMat", scene);
            cannonMat.diffuseColor = BABYLON.Color3.Black();
            cannonball.material = cannonMat;

            const direction = target.mesh.position.subtract(ship.mesh.position).normalize();
            
            cannonballs.push({
                mesh: cannonball,
                direction: direction,
                speed: 80,
                damage: ship.damage,
                life: 5, // seconds
            });
        }
        
        function showUpgradePanel() {
            gameState = "WAVE_END";
            upgradePanel.style.display = 'block';
        }
        
        function hideUpgradePanel() {
            upgradePanel.style.display = 'none';
        }
        
        function showGameOver() {
            gameState = "GAME_OVER";
            gameOverPanel.style.display = 'block';
        }

        // --- Game Loop ---
        engine.runRenderLoop(function () {
            if (gameState === "GAME_OVER") return;

            const deltaTime = engine.getDeltaTime() / 1000;

            // Player ship logic
            playerShips.forEach(ship => {
                // Movement
                if (ship.destination) {
                    const direction = ship.destination.subtract(ship.mesh.position);
                    direction.y = 0; // Keep on water plane
                    if (direction.length() < 1) {
                        ship.destination = null;
                    } else {
                        const move = direction.normalize().scale(ship.speed * deltaTime);
                        ship.mesh.position.addInPlace(move);
                        // Rotation
                        const targetRotation = Math.atan2(direction.x, direction.z);
                        ship.mesh.rotation.y = BABYLON.Scalar.Lerp(ship.mesh.rotation.y, targetRotation, 0.1);
                    }
                }
                
                // Combat
                if (gameState === "PLAYING") {
                    ship.cooldown -= deltaTime;
                    if (ship.cooldown <= 0) {
                        fireCannonball(ship);
                    }
                }
            });
            
            // Enemy ship logic
            for (let i = enemyShips.length - 1; i >= 0; i--) {
                const enemy = enemyShips[i];
                const distanceToIsland = enemy.mesh.position.length();

                if (distanceToIsland < 16) { // Reached the island
                    islandHealth -= enemy.damage;
                    updateUI();
                    enemy.mesh.dispose();
                    enemyShips.splice(i, 1);
                    if (islandHealth <= 0) {
                        showGameOver();
                    }
                    continue;
                }

                // Movement towards island center (0,0,0)
                const direction = BABYLON.Vector3.Zero().subtract(enemy.mesh.position).normalize();
                enemy.mesh.position.addInPlace(direction.scale(enemy.speed * deltaTime));
                enemy.mesh.lookAt(BABYLON.Vector3.Zero());
            }

            // Cannonball logic
            for (let i = cannonballs.length - 1; i >= 0; i--) {
                const cb = cannonballs[i];
                cb.mesh.position.addInPlace(cb.direction.scale(cb.speed * deltaTime));
                cb.life -= deltaTime;
                
                let hit = false;
                for (let j = enemyShips.length - 1; j >= 0; j--) {
                    const enemy = enemyShips[j];
                    if (BABYLON.Vector3.Distance(cb.mesh.position, enemy.mesh.position) < 2) {
                        enemy.hp -= cb.damage;
                        if (enemy.hp <= 0) {
                            gold += enemy.goldValue;
                            updateUI();
                            enemy.mesh.dispose();
                            enemyShips.splice(j, 1);
                        }
                        hit = true;
                        break;
                    }
                }
                
                if (hit || cb.life <= 0) {
                    cb.mesh.dispose();
                    cannonballs.splice(i, 1);
                }
            }

            // Wave logic
            if (gameState === "PLAYING" && enemyShips.length === 0) {
                console.log("Wave cleared!");
                showUpgradePanel();
            }

            scene.render();
        });
        
        window.addEventListener('resize', function () {
            engine.resize();
        });

        // --- UI Event Listeners ---
        document.getElementById('next-wave-btn').addEventListener('click', () => {
            wave++;
            updateUI();
            startWave();
        });
        
        document.getElementById('upgrade-damage').addEventListener('click', () => {
            const cost = 50;
            if (selectedShipIndex !== -1 && gold >= cost) {
                gold -= cost;
                playerShips[selectedShipIndex].damage += 1;
                updateUI();
                console.log(`Ship ${selectedShipIndex + 1} damage upgraded to ${playerShips[selectedShipIndex].damage}`);
            }
        });
        
        document.getElementById('upgrade-firerate').addEventListener('click', () => {
            const cost = 75;
            if (selectedShipIndex !== -1 && gold >= cost) {
                gold -= cost;
                playerShips[selectedShipIndex].fireRate = Math.max(0.2, playerShips[selectedShipIndex].fireRate * 0.9);
                updateUI();
                console.log(`Ship ${selectedShipIndex + 1} fire rate upgraded to ${playerShips[selectedShipIndex].fireRate.toFixed(2)}s`);
            }
        });

        document.getElementById('upgrade-speed').addEventListener('click', () => {
            const cost = 40;
            if (selectedShipIndex !== -1 && gold >= cost) {
                gold -= cost;
                playerShips[selectedShipIndex].speed += 2;
                updateUI();
                console.log(`Ship ${selectedShipIndex + 1} speed upgraded to ${playerShips[selectedShipIndex].speed}`);
            }
        });

        // Initial setup
        updateUI();
        startWave();

    </script>
</body>
</html>
