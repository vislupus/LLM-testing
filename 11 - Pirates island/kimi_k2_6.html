<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Island Defender — Pirate Defense</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0f1a; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
  #renderCanvas { width:100%; height:100%; display:block; outline:none; }

  /* Top HUD */
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 20px;
    background:linear-gradient(180deg, rgba(6,10,20,0.92) 0%, rgba(6,10,20,0.4) 100%);
    pointer-events:none; user-select:none;
    border-bottom:1px solid rgba(100,180,255,0.08);
  }
  .hud-group { display:flex; gap:28px; align-items:center; }
  .hud-item { text-align:center; }
  .hud-label { font-size:10px; color:#7a8fa8; text-transform:uppercase; letter-spacing:1.2px; }
  .hud-value { font-size:22px; font-weight:800; color:#e8f0f8; font-family:'Courier New',monospace; }
  .hud-value.gold { color:#ffd54f; }
  .hud-value.wave { color:#4fc3f7; }
  .hud-value.hp { color:#ef5350; }
  .hud-value.hp.ok { color:#66bb6a; }

  /* Ship selector */
  #shipSelect {
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:12px; pointer-events:auto;
  }
  .ship-btn {
    width:64px; height:64px; border-radius:12px;
    border:2px solid rgba(255,255,255,0.12);
    background:rgba(12,18,32,0.85);
    color:#8a9aaa; font-size:11px; font-weight:700;
    cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
    transition:all 0.15s; backdrop-filter:blur(6px);
  }
  .ship-btn:hover { border-color:rgba(100,180,255,0.4); color:#c8d8e8; }
  .ship-btn.active {
    border-color:#4fc3f7; background:rgba(20,40,70,0.9);
    color:#4fc3f7; box-shadow:0 0 16px rgba(79,195,247,0.25);
  }
  .ship-btn .key { font-size:18px; font-weight:800; }
  .ship-btn .hp-bar {
    width:44px; height:3px; background:rgba(255,255,255,0.08);
    border-radius:2px; overflow:hidden;
  }
  .ship-btn .hp-fill {
    height:100%; background:#66bb6a; border-radius:2px;
    transition:width 0.2s, background 0.2s;
  }

  /* Upgrade panel */
  #upgradePanel {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(10,16,30,0.95); border:1px solid rgba(100,180,255,0.15);
    border-radius:16px; padding:28px 32px; min-width:340px;
    display:none; pointer-events:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    backdrop-filter:blur(12px);
  }
  #upgradePanel h2 {
    margin:0 0 6px 0; font-size:20px; color:#4fc3f7;
    text-align:center; text-transform:uppercase; letter-spacing:2px;
  }
  #upgradePanel .sub {
    text-align:center; color:#5a6a7a; font-size:12px; margin-bottom:20px;
  }
  .upg-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04);
  }
  .upg-row:last-child { border-bottom:none; }
  .upg-info { display:flex; flex-direction:column; gap:2px; }
  .upg-name { font-size:13px; color:#c8d4e0; font-weight:600; }
  .upg-desc { font-size:11px; color:#5a6a7a; }
  .upg-btn {
    padding:7px 16px; border-radius:8px; border:none;
    background:rgba(255,213,79,0.12); color:#ffd54f;
    border:1px solid rgba(255,213,79,0.3);
    font-size:12px; font-weight:700; cursor:pointer;
    transition:all 0.15s; white-space:nowrap;
  }
  .upg-btn:hover { background:rgba(255,213,79,0.22); }
  .upg-btn:disabled { opacity:0.35; cursor:not-allowed; }
  #startWaveBtn {
    width:100%; margin-top:16px; padding:12px;
    border-radius:10px; border:none;
    background:rgba(79,195,247,0.15); color:#4fc3f7;
    border:1px solid rgba(79,195,247,0.35);
    font-size:14px; font-weight:700; cursor:pointer;
    text-transform:uppercase; letter-spacing:1.5px;
    transition:all 0.15s;
  }
  #startWaveBtn:hover { background:rgba(79,195,247,0.25); }

  /* Game over */
  #gameOver {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(10,16,30,0.95); border:1px solid rgba(239,83,80,0.3);
    border-radius:16px; padding:36px 48px; text-align:center;
    display:none; pointer-events:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  #gameOver h2 { color:#ef5350; font-size:28px; margin-bottom:8px; }
  #gameOver p { color:#8a9aaa; font-size:14px; margin-bottom:20px; }
  #restartBtn {
    padding:12px 32px; border-radius:10px; border:none;
    background:rgba(79,195,247,0.15); color:#4fc3f7;
    border:1px solid rgba(79,195,247,0.35);
    font-size:14px; font-weight:700; cursor:pointer;
    text-transform:uppercase; letter-spacing:1.5px;
  }
  #restartBtn:hover { background:rgba(79,195,247,0.25); }

  /* Crosshair */
  #crosshair {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:20px; height:20px; pointer-events:none;
    border:2px solid rgba(255,255,255,0.3); border-radius:50%;
    display:none;
  }

  /* Tooltip */
  #tooltip {
    position:absolute; background:rgba(10,16,30,0.9);
    color:#c8d4e0; padding:6px 10px; border-radius:6px;
    font-size:11px; pointer-events:none; display:none;
    border:1px solid rgba(100,180,255,0.15);
  }
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="hud">
  <div class="hud-group">
    <div class="hud-item">
      <div class="hud-label">Gold</div>
      <div class="hud-value gold" id="goldVal">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">Wave</div>
      <div class="hud-value wave" id="waveVal">1</div>
    </div>
  </div>
  <div class="hud-group">
    <div class="hud-item">
      <div class="hud-label">Island HP</div>
      <div class="hud-value hp ok" id="hpVal">100</div>
    </div>
  </div>
</div>

<div id="shipSelect">
  <div class="ship-btn active" data-idx="0" id="btn0">
    <span class="key">1</span>
    <span>Ship A</span>
    <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
  </div>
  <div class="ship-btn" data-idx="1" id="btn1">
    <span class="key">2</span>
    <span>Ship B</span>
    <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
  </div>
  <div class="ship-btn" data-idx="2" id="btn2">
    <span class="key">3</span>
    <span>Ship C</span>
    <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
  </div>
</div>

<div id="upgradePanel">
  <h2>Upgrade Dock</h2>
  <div class="sub">Spend gold to prepare for the next wave</div>
  <div class="upg-row">
    <div class="upg-info">
      <span class="upg-name">Cannon Damage</span>
      <span class="upg-desc" id="dmgDesc">Level 1 — +5 damage</span>
    </div>
    <button class="upg-btn" id="dmgBtn">30g</button>
  </div>
  <div class="upg-row">
    <div class="upg-info">
      <span class="upg-name">Fire Rate</span>
      <span class="upg-desc" id="rateDesc">Level 1 — 10% faster</span>
    </div>
    <button class="upg-btn" id="rateBtn">40g</button>
  </div>
  <div class="upg-row">
    <div class="upg-info">
      <span class="upg-name">Sail Speed</span>
      <span class="upg-desc" id="spdDesc">Level 1 — +10% speed</span>
    </div>
    <button class="upg-btn" id="spdBtn">25g</button>
  </div>
  <button id="startWaveBtn">Start Next Wave</button>
</div>

<div id="gameOver">
  <h2>Island Fallen!</h2>
  <p>You survived <span id="finalWave">0</span> waves.</p>
  <button id="restartBtn">Play Again</button>
</div>

<div id="crosshair"></div>
<div id="tooltip"></div>

<script>
// ============================================================
//  ISLAND DEFENDER — Pirate Defense Game
// ============================================================
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });

// --- Game State ---------------------------------------------------
const GAME = {
  gold: 0,
  wave: 1,
  islandHP: 100,
  maxIslandHP: 100,
  selectedShip: 0,
  ships: [],
  enemies: [],
  cannonballs: [],
  particles: [],
  waveActive: false,
  waveTimer: 0,
  spawnTimer: 0,
  enemiesToSpawn: 0,
  spawnInterval: 2.5,
  gameOver: false,
  upgrades: { dmg:0, rate:0, spd:0 },
  upgradeCosts: { dmg:30, rate:40, spd:25 }
};

// --- Scene --------------------------------------------------------
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color3(0.35, 0.55, 0.72);
scene.ambientColor = new BABYLON.Color3(0.35, 0.4, 0.45);

const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2.2, Math.PI/3.2, 85, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 35;
camera.upperRadiusLimit = 140;
camera.wheelPrecision = 40;
camera.panningSensibility = 60;
camera.lowerBetaLimit = 0.3;
camera.upperBetaLimit = Math.PI/2.05;

const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0.2), scene);
hemi.intensity = 0.6;
hemi.groundColor = new BABYLON.Color3(0.2,0.25,0.15);

const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.8,-1.5,-0.6), scene);
sun.position = new BABYLON.Vector3(50,80,50);
sun.intensity = 1.0;

const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
shadowGen.useBlurExponentialShadowMap = true;
shadowGen.blurKernel = 20;
shadowGen.darkness = 0.45;

// --- Texture Helpers ----------------------------------------------
function makeWoodTex() {
  const c = document.createElement("canvas"); c.width=128; c.height=128;
  const ctx = c.getContext("2d");
  ctx.fillStyle="#6b4226"; ctx.fillRect(0,0,128,128);
  for(let y=0;y<128;y++){
    ctx.strokeStyle=Math.random()>0.5?"#4a2a16":"#8a5a36";
    ctx.globalAlpha=0.2+Math.random()*0.15;
    ctx.lineWidth=1+Math.random();
    ctx.beginPath(); ctx.moveTo(0,y);
    for(let x=0;x<128;x+=6) ctx.lineTo(x,y+Math.sin((y+x)*0.08)*1.5);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  return c.toDataURL();
}
function makeSailTex() {
  const c = document.createElement("canvas"); c.width=64; c.height=64;
  const ctx = c.getContext("2d");
  ctx.fillStyle="#e8dcc8"; ctx.fillRect(0,0,64,64);
  for(let i=0;i<300;i++){
    ctx.fillStyle=Math.random()>0.5?"#d4c4a8":"#f0e8d8";
    ctx.globalAlpha=0.15; ctx.fillRect(Math.random()*64,Math.random()*64,2,2);
  }
  ctx.globalAlpha=1;
  return c.toDataURL();
}
function makeParticleTex() {
  const c = document.createElement("canvas"); c.width=32; c.height=32;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,"rgba(255,255,255,1)");
  g.addColorStop(0.5,"rgba(255,255,255,0.4)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,32,32);
  return c.toDataURL();
}

// --- Materials ----------------------------------------------------
const waterMat = new BABYLON.StandardMaterial("water", scene);
waterMat.diffuseColor = new BABYLON.Color3(0.12,0.42,0.58);
waterMat.specularColor = new BABYLON.Color3(0.7,0.85,0.95);
waterMat.specularPower = 64;
waterMat.alpha = 0.82;
waterMat.backFaceCulling = false;

const sandMat = new BABYLON.StandardMaterial("sand", scene);
sandMat.diffuseColor = new BABYLON.Color3(0.82,0.76,0.58);
sandMat.specularColor = new BABYLON.Color3(0.05,0.05,0.05);

const grassMat = new BABYLON.StandardMaterial("grass", scene);
grassMat.diffuseColor = new BABYLON.Color3(0.28,0.62,0.22);
grassMat.specularColor = new BABYLON.Color3(0.02,0.05,0.02);
grassMat.ambientColor = new BABYLON.Color3(0.2,0.45,0.15);

const woodMat = new BABYLON.StandardMaterial("wood", scene);
woodMat.diffuseTexture = new BABYLON.Texture(makeWoodTex(), scene);
woodMat.diffuseTexture.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
woodMat.diffuseTexture.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
woodMat.specularColor = new BABYLON.Color3(0.08,0.06,0.04);

const sailMat = new BABYLON.StandardMaterial("sail", scene);
sailMat.diffuseTexture = new BABYLON.Texture(makeSailTex(), scene);
sailMat.backFaceCulling = false;
sailMat.specularColor = new BABYLON.Color3(0.1,0.1,0.08);

const enemySailMat = new BABYLON.StandardMaterial("esail", scene);
enemySailMat.diffuseColor = new BABYLON.Color3(0.72,0.15,0.12);
enemySailMat.backFaceCulling = false;
enemySailMat.specularColor = new BABYLON.Color3(0.1,0.05,0.05);

const rockMat = new BABYLON.StandardMaterial("rock", scene);
rockMat.diffuseColor = new BABYLON.Color3(0.42,0.40,0.38);
rockMat.specularColor = new BABYLON.Color3(0.05,0.05,0.05);

const cannonMat = new BABYLON.StandardMaterial("cannon", scene);
cannonMat.diffuseColor = new BABYLON.Color3(0.18,0.18,0.20);
cannonMat.specularColor = new BABYLON.Color3(0.3,0.3,0.35);

const ballMat = new BABYLON.StandardMaterial("ball", scene);
ballMat.diffuseColor = new BABYLON.Color3(0.12,0.12,0.12);
ballMat.specularColor = new BABYLON.Color3(0.4,0.4,0.4);

const selectMat = new BABYLON.StandardMaterial("sel", scene);
selectMat.emissiveColor = new BABYLON.Color3(0.2,0.7,1.0);
selectMat.alpha = 0.35;

// --- Water Plane --------------------------------------------------
const water = BABYLON.MeshBuilder.CreateGround("water", {width:300, height:300, subdivisions:80}, scene);
water.position.y = -0.5;
water.material = waterMat;
water.receiveShadows = true;
const waterPos = water.getVerticesData(BABYLON.VertexBuffer.PositionKind);
const waterOrig = waterPos.slice();

// --- Island -------------------------------------------------------
const island = BABYLON.MeshBuilder.CreateCylinder("island", {diameter:22, height:3.5, tessellation:48}, scene);
island.position.y = 1.0;
island.material = grassMat;
island.receiveShadows = true;
shadowGen.addShadowCaster(island);

const beach = BABYLON.MeshBuilder.CreateTorus("beach", {diameter:22, thickness:2.5, tessellation:48}, scene);
beach.position.y = -0.3;
beach.material = sandMat;
beach.receiveShadows = true;

// Island vertex sculpting
const ipos = island.getVerticesData(BABYLON.VertexBuffer.PositionKind);
for(let i=0;i<ipos.length;i+=3){
  const x=ipos[i], y=ipos[i+1], z=ipos[i+2];
  const d = Math.sqrt(x*x+z*z);
  let ny = y;
  if(y>0){
    ny *= 0.6;
    ny += Math.sin(x*0.4)*Math.cos(z*0.4)*0.6;
    ny += Math.sin(x*0.8+1)*0.3;
  }
  if(d>8) ny *= Math.max(0.3, 1-(d-8)/4);
  ipos[i+1] = ny;
}
island.updateVerticesData(BABYLON.VertexBuffer.PositionKind, ipos);
island.createNormals(true);

// Rocks
for(let i=0;i<8;i++){
  const r = BABYLON.MeshBuilder.CreatePolyhedron("rk"+i, {type:1, size:0.5+Math.random()*0.8}, scene);
  const a = Math.random()*Math.PI*2;
  const d = 5+Math.random()*5;
  r.position = new BABYLON.Vector3(Math.cos(a)*d, 1.2+Math.random()*0.5, Math.sin(a)*d);
  r.rotation = new BABYLON.Vector3(Math.random(),Math.random(),Math.random());
  r.material = rockMat;
  r.parent = island;
  shadowGen.addShadowCaster(r);
}

// Palms
function createPalm(px,pz,sc){
  const node = new BABYLON.TransformNode("palm", scene);
  node.position = new BABYLON.Vector3(px, 2.2, pz);
  node.scaling = new BABYLON.Vector3(sc,sc,sc);
  node.parent = island;
  const trunk = BABYLON.MeshBuilder.CreateCylinder("pt", {diameterTop:0.15, diameterBottom:0.3, height:4, tessellation:8}, scene);
  trunk.position.y = 2; trunk.parent = node;
  const tm = new BABYLON.StandardMaterial("ptm", scene);
  tm.diffuseColor = new BABYLON.Color3(0.42,0.28,0.12); trunk.material = tm;
  shadowGen.addShadowCaster(trunk);
  const fm = new BABYLON.StandardMaterial("pfm", scene);
  fm.diffuseColor = new BABYLON.Color3(0.18+Math.random()*0.08,0.55+Math.random()*0.1,0.12+Math.random()*0.06);
  fm.backFaceCulling = false;
  for(let i=0;i<6;i++){
    const leaf = BABYLON.MeshBuilder.CreatePlane("pl", {width:1.8, height:0.5}, scene);
    leaf.position.y = 4; leaf.rotation.y = (i/6)*Math.PI*2;
    leaf.rotation.x = 0.4; leaf.parent = node;
    leaf.material = fm;
  }
}
createPalm(4,3,1); createPalm(-5,2,0.9); createPalm(2,-5,1.1);
createPalm(-3,-4,0.85); createPalm(6,-2,0.95); createPalm(-6,5,1);

// --- Ship Builder -------------------------------------------------
function buildShip(name, pos, isEnemy){
  const root = new BABYLON.TransformNode(name, scene);
  root.position = pos.clone();

  // Hull
  const hull = BABYLON.MeshBuilder.CreateBox(name+"_hull", {width:1.8, height:0.7, depth:4.2}, scene);
  hull.position.y = 0.35; hull.parent = root; hull.material = woodMat;
  shadowGen.addShadowCaster(hull);

  // Bow
  const bow = BABYLON.MeshBuilder.CreateCylinder(name+"_bow", {diameterTop:0, diameterBottom:1.8, height:1.8, tessellation:3}, scene);
  bow.position = new BABYLON.Vector3(0, 0.35, 2.8); bow.rotation.x = Math.PI/2;
  bow.parent = root; bow.material = woodMat;
  shadowGen.addShadowCaster(bow);

  // Stern
  const stern = BABYLON.MeshBuilder.CreateBox(name+"_stern", {width:1.6, height:0.9, depth:0.8}, scene);
  stern.position = new BABYLON.Vector3(0, 0.6, -2.2); stern.parent = root;
  stern.material = woodMat; shadowGen.addShadowCaster(stern);

  // Mast
  const mast = BABYLON.MeshBuilder.CreateCylinder(name+"_mast", {diameter:0.12, height:5.5}, scene);
  mast.position = new BABYLON.Vector3(0, 3, 0.3); mast.parent = root;
  const mm = new BABYLON.StandardMaterial(name+"_mm", scene);
  mm.diffuseColor = new BABYLON.Color3(0.35,0.22,0.1); mast.material = mm;
  shadowGen.addShadowCaster(mast);

  // Sail
  const sail = BABYLON.MeshBuilder.CreatePlane(name+"_sail", {width:2.2, height:3.2}, scene);
  sail.position = new BABYLON.Vector3(0, 3.2, 0.3); sail.parent = root;
  sail.material = isEnemy ? enemySailMat : sailMat;

  // Crow's nest
  const nest = BABYLON.MeshBuilder.CreateCylinder(name+"_nest", {diameter:0.6, height:0.4, tessellation:8}, scene);
  nest.position = new BABYLON.Vector3(0, 5.6, 0.3); nest.parent = root;
  nest.material = woodMat;

  // Cannons (side)
  for(let side of [-1,1]){
    for(let z of [-1,0.5,2]){
      const can = BABYLON.MeshBuilder.CreateCylinder(name+"_c"+side+z, {diameter:0.18, height:0.7}, scene);
      can.rotation.z = Math.PI/2;
      can.position = new BABYLON.Vector3(side*1.0, 0.5, z);
      can.parent = root; can.material = cannonMat;
    }
  }

  // Health bar
  const barBg = BABYLON.MeshBuilder.CreatePlane(name+"_hbbg", {width:2.4, height:0.22}, scene);
  barBg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  barBg.position = new BABYLON.Vector3(0, 6.5, 0); barBg.parent = root;
  const bbgm = new BABYLON.StandardMaterial(name+"_bbgm", scene);
  bbgm.diffuseColor = new BABYLON.Color3(0.1,0.1,0.1); barBg.material = bbgm;

  const barFill = BABYLON.MeshBuilder.CreatePlane(name+"_hbfill", {width:2.2, height:0.14}, scene);
  barFill.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  barFill.position = new BABYLON.Vector3(0, 6.5, -0.01); barFill.parent = root;
  const bfm = new BABYLON.StandardMaterial(name+"_bfm", scene);
  bfm.diffuseColor = new BABYLON.Color3(0.2,0.8,0.3); barFill.material = bfm;

  // Selection ring
  const ring = BABYLON.MeshBuilder.CreateTorus(name+"_ring", {diameter:5, thickness:0.08, tessellation:32}, scene);
  ring.position.y = 0.1; ring.parent = root; ring.material = selectMat; ring.isVisible = false;

  return { root, hull, sail, barBg, barFill, ring };
}

// --- Create Player Ships ------------------------------------------
const shipStartPos = [
  new BABYLON.Vector3(18, 0, 0),
  new BABYLON.Vector3(-9, 0, 15.5),
  new BABYLON.Vector3(-9, 0, -15.5)
];

for(let i=0;i<3;i++){
  const visuals = buildShip("ship"+i, shipStartPos[i], false);
  const ship = {
    idx: i,
    visuals: visuals,
    pos: shipStartPos[i].clone(),
    target: shipStartPos[i].clone(),
    rot: 0,
    hp: 100, maxHP: 100,
    speed: 7,
    damage: 12,
    fireRate: 1.2,
    fireCooldown: 0,
    range: 28,
    alive: true,
    moving: false
  };
  GAME.ships.push(ship);
}

// --- Selection ----------------------------------------------------
function selectShip(idx){
  GAME.selectedShip = idx;
  for(let i=0;i<3;i++){
    const s = GAME.ships[i];
    s.visuals.ring.isVisible = (i===idx && s.alive);
    document.getElementById("btn"+i).classList.toggle("active", i===idx);
  }
}
selectShip(0);

// Input
window.addEventListener("keydown", (e)=>{
  if(GAME.gameOver) return;
  if(e.key==="1") selectShip(0);
  if(e.key==="2") selectShip(1);
  if(e.key==="3") selectShip(2);
});

// Click to move
scene.onPointerObservable.add((evt)=>{
  if(GAME.gameOver || !GAME.waveActive) return;
  if(evt.type === BABYLON.PointerEventTypes.POINTERDOWN && evt.event.button === 0){
    const pick = scene.pick(scene.pointerX, scene.pointerY);
    if(pick.hit){
      const s = GAME.ships[GAME.selectedShip];
      if(s && s.alive){
        s.target = pick.pickedPoint.clone();
        s.target.y = 0;
      }
    }
  }
});

// Ship buttons
document.querySelectorAll(".ship-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    if(GAME.gameOver) return;
    selectShip(parseInt(btn.dataset.idx));
  });
});

// --- Cannonball ---------------------------------------------------
function fireCannonball(from, to, damage, isPlayer){
  const ball = BABYLON.MeshBuilder.CreateSphere("cb", {diameter:0.5}, scene);
  ball.position = from.clone();
  ball.position.y = 1.5;
  ball.material = ballMat;
  shadowGen.addShadowCaster(ball);

  const dir = to.subtract(from);
  dir.y = 0;
  const dist = dir.length();
  dir.normalize();

  const speed = 28;
  const duration = dist / speed;
  let time = 0;

  GAME.cannonballs.push({
    mesh: ball,
    start: from.clone(),
    dir: dir,
    speed: speed,
    damage: damage,
    isPlayer: isPlayer,
    duration: duration,
    time: 0,
    arcHeight: Math.min(dist*0.12, 4)
  });

  // Muzzle flash
  const flash = BABYLON.MeshBuilder.CreateSphere("flash", {diameter:0.8}, scene);
  flash.position = from.clone(); flash.position.y = 1.5;
  const fm = new BABYLON.StandardMaterial("fm", scene);
  fm.emissiveColor = new BABYLON.Color3(1,0.6,0.1); fm.diffuseColor = new BABYLON.Color3(0,0,0);
  flash.material = fm;
  setTimeout(()=>flash.dispose(), 80);
}

// --- Enemy Spawning -----------------------------------------------
function spawnEnemy(){
  const angle = Math.random()*Math.PI*2;
  const dist = 75 + Math.random()*15;
  const pos = new BABYLON.Vector3(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
  const visuals = buildShip("enemy"+GAME.enemies.length, pos, true);

  const waveMult = 1 + (GAME.wave-1)*0.25;
  const enemy = {
    visuals: visuals,
    pos: pos,
    hp: 30 * waveMult,
    maxHP: 30 * waveMult,
    speed: 3.5 + Math.min(GAME.wave*0.3, 4),
    damage: 8 + GAME.wave*1.5,
    alive: true,
    fireCooldown: Math.random()*2
  };
  GAME.enemies.push(enemy);
}

// --- Explosion Particles ------------------------------------------
function spawnExplosion(pos, color){
  const ps = new BABYLON.ParticleSystem("exp", 60, scene);
  ps.particleTexture = new BABYLON.Texture(makeParticleTex(), scene);
  ps.emitter = pos;
  ps.minEmitBox = new BABYLON.Vector3(-0.3,0,-0.3);
  ps.maxEmitBox = new BABYLON.Vector3(0.3,0,0.3);
  ps.color1 = new BABYLON.Color4(color.r, color.g, color.b, 0.9);
  ps.color2 = new BABYLON.Color4(color.r*0.6, color.g*0.5, color.b*0.3, 0.5);
  ps.colorDead = new BABYLON.Color4(0.1,0.05,0.02,0);
  ps.minSize = 0.1; ps.maxSize = 0.6;
  ps.minLifeTime = 0.3; ps.maxLifeTime = 1.0;
  ps.emitRate = 300;
  ps.gravity = new BABYLON.Vector3(0, -5, 0);
  ps.direction1 = new BABYLON.Vector3(-1, 0.5, -1);
  ps.direction2 = new BABYLON.Vector3(1, 1.5, 1);
  ps.minEmitPower = 2; ps.maxEmitPower = 6;
  ps.updateSpeed = 0.01;
  ps.targetStopDuration = 0.15;
  ps.start();
  setTimeout(()=>ps.dispose(), 1500);
}

// --- Water Splash -------------------------------------------------
function spawnSplash(pos){
  const ps = new BABYLON.ParticleSystem("spl", 40, scene);
  ps.particleTexture = new BABYLON.Texture(makeParticleTex(), scene);
  ps.emitter = pos;
  ps.minEmitBox = new BABYLON.Vector3(-0.2,0,-0.2);
  ps.maxEmitBox = new BABYLON.Vector3(0.2,0,0.2);
  ps.color1 = new BABYLON.Color4(0.6,0.85,0.95,0.7);
  ps.color2 = new BABYLON.Color4(0.4,0.7,0.9,0.4);
  ps.colorDead = new BABYLON.Color4(0.2,0.4,0.6,0);
  ps.minSize = 0.05; ps.maxSize = 0.3;
  ps.minLifeTime = 0.2; ps.maxLifeTime = 0.6;
  ps.emitRate = 200;
  ps.gravity = new BABYLON.Vector3(0, -8, 0);
  ps.direction1 = new BABYLON.Vector3(-0.5, 1, -0.5);
  ps.direction2 = new BABYLON.Vector3(0.5, 2, 0.5);
  ps.minEmitPower = 1; ps.maxEmitPower = 4;
  ps.updateSpeed = 0.01;
  ps.targetStopDuration = 0.1;
  ps.start();
  setTimeout(()=>ps.dispose(), 1000);
}

// --- Wave Logic ---------------------------------------------------
function startWave(){
  GAME.waveActive = true;
  GAME.enemiesToSpawn = 4 + GAME.wave * 3;
  GAME.spawnTimer = 0;
  GAME.spawnInterval = Math.max(0.8, 3.0 - GAME.wave*0.15);
  document.getElementById("upgradePanel").style.display = "none";
}

function endWave(){
  GAME.waveActive = false;
  GAME.wave++;
  document.getElementById("waveVal").textContent = GAME.wave;
  updateUpgradeUI();
  document.getElementById("upgradePanel").style.display = "block";
}

// --- Upgrades -----------------------------------------------------
function applyUpgrade(type){
  const cost = GAME.upgradeCosts[type];
  if(GAME.gold < cost) return;
  GAME.gold -= cost;
  GAME.upgrades[type]++;
  GAME.upgradeCosts[type] = Math.floor(cost * 1.35);

  if(type==="dmg"){
    for(let s of GAME.ships){ s.damage += 5; }
  } else if(type==="rate"){
    for(let s of GAME.ships){ s.fireRate *= 0.9; }
  } else if(type==="spd"){
    for(let s of GAME.ships){ s.speed *= 1.1; }
  }
  updateUpgradeUI();
  updateHUD();
}

function updateUpgradeUI(){
  const u = GAME.upgrades;
  document.getElementById("dmgDesc").textContent = `Level ${u.dmg+1} — +${5+u.dmg*5} damage`;
  document.getElementById("rateDesc").textContent = `Level ${u.rate+1} — ${(Math.pow(0.9,u.rate+1)*100).toFixed(0)}% base rate`;
  document.getElementById("spdDesc").textContent = `Level ${u.spd+1} — +${(u.spd+1)*10}% speed`;

  const dBtn = document.getElementById("dmgBtn");
  dBtn.textContent = GAME.upgradeCosts.dmg + "g";
  dBtn.disabled = GAME.gold < GAME.upgradeCosts.dmg;

  const rBtn = document.getElementById("rateBtn");
  rBtn.textContent = GAME.upgradeCosts.rate + "g";
  rBtn.disabled = GAME.gold < GAME.upgradeCosts.rate;

  const sBtn = document.getElementById("spdBtn");
  sBtn.textContent = GAME.upgradeCosts.spd + "g";
  sBtn.disabled = GAME.gold < GAME.upgradeCosts.spd;
}

document.getElementById("dmgBtn").addEventListener("click", ()=>applyUpgrade("dmg"));
document.getElementById("rateBtn").addEventListener("click", ()=>applyUpgrade("rate"));
document.getElementById("spdBtn").addEventListener("click", ()=>applyUpgrade("spd"));
document.getElementById("startWaveBtn").addEventListener("click", startWave);

// --- HUD ----------------------------------------------------------
function updateHUD(){
  document.getElementById("goldVal").textContent = GAME.gold;
  const hpEl = document.getElementById("hpVal");
  hpEl.textContent = Math.max(0, Math.floor(GAME.islandHP));
  hpEl.classList.toggle("ok", GAME.islandHP > 40);
  hpEl.classList.toggle("hp", GAME.islandHP <= 40);

  for(let i=0;i<3;i++){
    const s = GAME.ships[i];
    const btn = document.getElementById("btn"+i);
    const fill = btn.querySelector(".hp-fill");
    if(!s.alive){
      fill.style.width = "0%"; fill.style.background = "#333";
      btn.style.opacity = "0.4";
    } else {
      const pct = (s.hp/s.maxHP)*100;
      fill.style.width = pct+"%";
      fill.style.background = pct>50?"#66bb6a":pct>25?"#ffa726":"#ef5350";
      btn.style.opacity = "1";
    }
  }
}

// --- Game Over ----------------------------------------------------
function triggerGameOver(){
  GAME.gameOver = true;
  GAME.waveActive = false;
  document.getElementById("finalWave").textContent = GAME.wave;
  document.getElementById("gameOver").style.display = "block";
  document.getElementById("upgradePanel").style.display = "none";
}

document.getElementById("restartBtn").addEventListener("click", ()=>{
  location.reload();
});

// --- Main Loop ----------------------------------------------------
let time = 0;
scene.registerBeforeRender(()=>{
  const dt = Math.min(engine.getDeltaTime()/1000, 0.05);
  time += dt;

  // Animate water
  for(let i=0;i<waterPos.length;i+=3){
    const x = waterOrig[i], z = waterOrig[i+2];
    waterPos[i+1] = Math.sin(x*0.15+time*1.2)*0.35 + Math.cos(z*0.12+time*0.9)*0.25 + Math.sin((x+z)*0.08+time*1.8)*0.15;
  }
  water.updateVerticesData(BABYLON.VertexBuffer.PositionKind, waterPos);

  if(GAME.gameOver) return;

  // Spawn enemies
  if(GAME.waveActive && GAME.enemiesToSpawn > 0){
    GAME.spawnTimer += dt;
    if(GAME.spawnTimer >= GAME.spawnInterval){
      GAME.spawnTimer = 0;
      spawnEnemy();
      GAME.enemiesToSpawn--;
    }
  }

  // Update player ships
  for(let s of GAME.ships){
    if(!s.alive) continue;

    // Movement
    const toTarget = s.target.subtract(s.pos);
    toTarget.y = 0;
    const dist = toTarget.length();
    if(dist > 0.5){
      toTarget.normalize();
      s.pos.addInPlace(toTarget.scale(s.speed * dt));
      s.moving = true;
      // Smooth rotation
      const targetRot = Math.atan2(toTarget.x, toTarget.z);
      let diff = targetRot - s.rot;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      s.rot += diff * Math.min(1, dt * 4);
    } else {
      s.moving = false;
    }

    // Bobbing
    const bob = Math.sin(time*2 + s.idx)*0.15;
    s.visuals.root.position = new BABYLON.Vector3(s.pos.x, bob, s.pos.z);
    s.visuals.root.rotation.y = s.rot;

    // Auto-fire
    s.fireCooldown -= dt;
    if(s.fireCooldown <= 0){
      let nearest = null, nearDist = s.range;
      for(let e of GAME.enemies){
        if(!e.alive) continue;
        const d = BABYLON.Vector3.Distance(s.pos, e.pos);
        if(d < nearDist){ nearDist = d; nearest = e; }
      }
      if(nearest){
        fireCannonball(s.pos, nearest.pos, s.damage, true);
        s.fireCooldown = s.fireRate;
      }
    }

    // Health bar
    const hpPct = s.hp / s.maxHP;
    s.visuals.barFill.scaling.x = Math.max(0.01, hpPct);
    s.visuals.barFill.position.x = (hpPct - 1) * 1.1;
  }

  // Update enemies
  for(let e of GAME.enemies){
    if(!e.alive) continue;

    const toIsland = new BABYLON.Vector3(0,0,0).subtract(e.pos);
    toIsland.y = 0;
    const distToIsland = toIsland.length();
    toIsland.normalize();

    e.pos.addInPlace(toIsland.scale(e.speed * dt));
    e.rot = Math.atan2(toIsland.x, toIsland.z);

    const bob = Math.sin(time*1.8 + e.pos.x)*0.12;
    e.visuals.root.position = new BABYLON.Vector3(e.pos.x, bob, e.pos.z);
    e.visuals.root.rotation.y = e.rot;

    // Health bar
    const hpPct = e.hp / e.maxHP;
    e.visuals.barFill.scaling.x = Math.max(0.01, hpPct);
    e.visuals.barFill.position.x = (hpPct - 1) * 1.1;

    // Damage island
    if(distToIsland < 5){
      GAME.islandHP -= e.damage;
      e.alive = false;
      e.visuals.root.dispose();
      spawnExplosion(e.pos, new BABYLON.Color3(0.9,0.3,0.1));
      if(GAME.islandHP <= 0) triggerGameOver();
    }

    // Enemy fire at nearest ship
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0){
      let nearest = null, nearDist = 20;
      for(let s of GAME.ships){
        if(!s.alive) continue;
        const d = BABYLON.Vector3.Distance(e.pos, s.pos);
        if(d < nearDist){ nearDist = d; nearest = s; }
      }
      if(nearest){
        fireCannonball(e.pos, nearest.pos, e.damage, false);
        e.fireCooldown = 2.5;
      }
    }
  }

  // Update cannonballs
  for(let i=GAME.cannonballs.length-1;i>=0;i--){
    const cb = GAME.cannonballs[i];
    cb.time += dt;
    const progress = cb.time / cb.duration;

    if(progress >= 1){
      // Splash
      spawnSplash(cb.mesh.position);
      cb.mesh.dispose();
      GAME.cannonballs.splice(i,1);
      continue;
    }

    const newPos = cb.start.add(cb.dir.scale(cb.speed * cb.time));
    newPos.y = 1.5 + Math.sin(progress * Math.PI) * cb.arcHeight;
    cb.mesh.position = newPos;

    // Collision
    if(cb.isPlayer){
      for(let e of GAME.enemies){
        if(!e.alive) continue;
        if(BABYLON.Vector3.Distance(newPos, e.pos) < 2.5){
          e.hp -= cb.damage;
          spawnExplosion(newPos, new BABYLON.Color3(1,0.5,0.1));
          cb.mesh.dispose();
          GAME.cannonballs.splice(i,1);
          if(e.hp <= 0){
            e.alive = false;
            e.visuals.root.dispose();
            GAME.gold += 10 + GAME.wave * 2;
            spawnExplosion(e.pos, new BABYLON.Color3(0.9,0.2,0.1));
          }
          break;
        }
      }
    } else {
      for(let s of GAME.ships){
        if(!s.alive) continue;
        if(BABYLON.Vector3.Distance(newPos, s.pos) < 2.5){
          s.hp -= cb.damage;
          spawnExplosion(newPos, new BABYLON.Color3(0.9,0.3,0.1));
          cb.mesh.dispose();
          GAME.cannonballs.splice(i,1);
          if(s.hp <= 0){
            s.alive = false;
            s.visuals.root.dispose();
            // Check if all dead
            if(GAME.ships.every(sh=>!sh.alive)) triggerGameOver();
          }
          break;
        }
      }
    }
  }

  // Clean dead enemies
  GAME.enemies = GAME.enemies.filter(e=>e.alive);

  // Wave completion check
  if(GAME.waveActive && GAME.enemiesToSpawn === 0 && GAME.enemies.length === 0){
    endWave();
  }

  updateHUD();
});

// Start first wave after brief intro
setTimeout(()=>{
  startWave();
}, 1500);

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize", ()=>engine.resize());
</script>
