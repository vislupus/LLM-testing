<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIRATE ISLAND DEFENSE</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin:0; overflow:hidden; background:#000; font-family:'Press Start 2P', sans-serif; color:#ff0; }
        canvas { display:block; }
        #ui {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
            padding: 20px; box-sizing: border-box; color: #ff0; text-shadow: 0 0 10px #000;
        }
        .top-bar { display: flex; justify-content: space-between; font-size: 18px; }
        .stat { background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px; }
        #upgradePanel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); padding: 15px 25px; border-radius: 12px; display: flex; gap: 15px; pointer-events: all;
        }
        button {
            background: #ff0; color: #000; border: none; padding: 12px 24px; font-family: inherit; font-size: 14px; cursor: pointer;
            border-radius: 6px; box-shadow: 0 0 15px #ff0;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #waveInfo { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 22px; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="ui">
        <div class="top-bar">
            <div class="stat">GOLD: <span id="gold">250</span></div>
            <div id="waveInfo">WAVE <span id="wave">1</span></div>
            <div class="stat">ISLAND HP: <span id="islandHP">100</span>%</div>
        </div>
        
        <div id="upgradePanel">
            <button onclick="upgrade('damage')">CANNON DMG<br><small>150 GOLD</small></button>
            <button onclick="upgrade('rate')">FIRE RATE<br><small>200 GOLD</small></button>
            <button onclick="upgrade('speed')">SHIP SPEED<br><small>120 GOLD</small></button>
        </div>
    </div>

    <script>
        // ================================================
        // PIRATE ISLAND DEFENSE - Single File Babylon.js Prototype
        // 3 controllable pirate ships • Waves of enemies • Upgrades
        // Fully self-contained - open and play
        // ================================================

        const canvas = document.getElementById("renderCanvas");
        let engine, scene, camera;
        let ships = [], enemies = [], cannonballs = [], particles = [];
        let selectedShipIndex = 0;
        let gold = 250;
        let wave = 1;
        let islandHP = 100;
        let gameOver = false;

        // Ship stats (all ships share upgrades for simplicity)
        let upgrades = { damage: 1, rate: 1, speed: 1 };

        function createScene() {
            engine = new BABYLON.Engine(canvas, true);
            scene = new BABYLON.Scene(engine);

            // Camera - free orbit above the island
            camera = new BABYLON.ArcRotateCamera("cam", Math.PI / 2, Math.PI / 3.2, 220, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerBetaLimit = 0.3;
            camera.upperBetaLimit = 1.4;
            camera.lowerRadiusLimit = 90;
            camera.upperRadiusLimit = 320;

            // Lights
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemi.intensity = 0.7;
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.8, -0.6, -1), scene);
            sun.intensity = 1.1;

            // Sky
            scene.clearColor = new BABYLON.Color3(0.05, 0.15, 0.4);

            // WATER
            const water = BABYLON.MeshBuilder.CreatePlane("water", {size: 600}, scene);
            water.rotation.x = Math.PI / 2;
            water.position.y = -0.5;
            const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
            waterMat.diffuseColor = new BABYLON.Color3(0.05, 0.35, 0.65);
            waterMat.specularColor = new BABYLON.Color3(1, 1, 1);
            waterMat.specularPower = 128;
            water.material = waterMat;

            // ISLAND
            const island = BABYLON.MeshBuilder.CreateCylinder("island", {height: 6, diameterTop: 68, diameterBottom: 92}, scene);
            island.position.y = 2.5;
            const islandMat = new BABYLON.StandardMaterial("islandMat", scene);
            islandMat.diffuseColor = new BABYLON.Color3(0.15, 0.55, 0.1);
            island.material = islandMat;

            // Palm trees (simple)
            function addPalm(x, z) {
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height: 12, diameter: 1.8}, scene);
                trunk.position.set(x, 8, z);
                const leaves = BABYLON.MeshBuilder.CreateSphere("leaves", {diameter: 14}, scene);
                leaves.position.set(x, 16, z);
                leaves.scaling.set(1, 0.6, 1);
                const palmMat = new BABYLON.StandardMaterial("", scene);
                palmMat.diffuseColor = new BABYLON.Color3(0.8, 0.6, 0.1);
                trunk.material = palmMat;
                leaves.material = new BABYLON.StandardMaterial("", scene);
                leaves.material.diffuseColor = new BABYLON.Color3(0.1, 0.7, 0.2);
            }
            addPalm(22, 18); addPalm(-25, 15); addPalm(12, -28);

            // Rocks
            const rock1 = BABYLON.MeshBuilder.CreateSphere("rock", {diameter: 12}, scene);
            rock1.position.set(-28, 3, -12);
            rock1.scaling.set(1.4, 0.6, 1.1);

            // Friendly PIRATE SHIPS
            ships = [];
            const shipPositions = [
                new BABYLON.Vector3(55, 2, 0),
                new BABYLON.Vector3(-35, 2, 45),
                new BABYLON.Vector3(-28, 2, -52)
            ];
            for (let i = 0; i < 3; i++) {
                const ship = createShip(shipPositions[i]);
                ship.userData = { index: i, health: 100, lastFire: 0, speed: 0.8, damage: 25, fireRate: 1200 };
                ships.push(ship);
            }

            // Start first wave
            spawnWave();

            return scene;
        }

        function createShip(pos) {
            const ship = new BABYLON.TransformNode("ship", scene);
            ship.position = pos.clone();

            // Hull
            const hull = BABYLON.MeshBuilder.CreateBox("hull", {width: 18, height: 6, depth: 42}, scene);
            hull.parent = ship;
            hull.position.y = 3;
            const hullMat = new BABYLON.StandardMaterial("", scene);
            hullMat.diffuseColor = new BABYLON.Color3(0.6, 0.3, 0.1);
            hull.material = hullMat;

            // Mast
            const mast = BABYLON.MeshBuilder.CreateCylinder("mast", {height: 28, diameter: 2}, scene);
            mast.parent = ship;
            mast.position.set(0, 18, -4);

            // Sail
            const sail = BABYLON.MeshBuilder.CreatePlane("sail", {width: 22, height: 26}, scene);
            sail.parent = ship;
            sail.position.set(0, 22, -6);
            sail.rotation.y = Math.PI / 2;
            const sailMat = new BABYLON.StandardMaterial("", scene);
            sailMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.95);
            sail.material = sailMat;

            // Cannon (simple box)
            const cannon = BABYLON.MeshBuilder.CreateBox("cannon", {width: 5, height: 5, depth: 12}, scene);
            cannon.parent = ship;
            cannon.position.set(0, 8, 14);
            cannon.rotation.x = Math.PI / 6;

            ship.cannon = cannon;
            return ship;
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 240 + Math.random() * 60;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;
            const enemy = createShip(new BABYLON.Vector3(x, 2, z));
            enemy.scaling.set(0.85, 0.85, 0.85);
            const mat = enemy.getChildren()[0].material;
            mat.diffuseColor = new BABYLON.Color3(0.4, 0.1, 0.1);
            enemy.userData = { isEnemy: true, speed: 0.45 + wave * 0.03 };
            enemies.push(enemy);
        }

        function spawnWave() {
            const count = 3 + wave * 2;
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    if (!gameOver) spawnEnemy();
                }, i * 800);
            }
        }

        function createCannonball(ship, target) {
            const ball = BABYLON.MeshBuilder.CreateSphere("ball", {diameter: 4}, scene);
            ball.position = ship.position.clone();
            ball.position.y += 12;
            const dir = target.position.subtract(ship.position);
            dir.normalize();
            ball.userData = { velocity: dir.scale(2.8), life: 180, owner: ship };
            cannonballs.push(ball);
            // Muzzle flash
            const flash = BABYLON.MeshBuilder.CreateSphere("flash", {diameter: 9}, scene);
            flash.position = ship.cannon.getAbsolutePosition();
            flash.material = new BABYLON.StandardMaterial("", scene);
            flash.material.diffuseColor = new BABYLON.Color3(1, 0.8, 0);
            setTimeout(() => flash.dispose(), 80);
        }

        function update() {
            if (gameOver) return;

            const now = Date.now();

            // Update friendly ships (only selected can be steered)
            const selectedShip = ships[selectedShipIndex];
            if (selectedShip) {
                const speed = 1.4 * upgrades.speed;
                if (keys["KeyW"] || keys["ArrowUp"]) selectedShip.position.z -= speed;
                if (keys["KeyS"] || keys["ArrowDown"]) selectedShip.position.z += speed;
                if (keys["KeyA"] || keys["ArrowLeft"]) selectedShip.position.x -= speed;
                if (keys["KeyD"] || keys["ArrowRight"]) selectedShip.position.x += speed;

                // Face movement direction (simple)
                if (keys["KeyW"] || keys["KeyS"] || keys["KeyA"] || keys["KeyD"]) {
                    const forward = new BABYLON.Vector3(0, 0, -1);
                    selectedShip.lookAt(selectedShip.position.add(forward));
                }
            }

            // Auto fire for all friendly ships
            ships.forEach(ship => {
                if (now - ship.userData.lastFire < 1400 / upgrades.rate) return;
                let closest = null;
                let minDist = Infinity;
                enemies.forEach(e => {
                    const d = BABYLON.Vector3.Distance(ship.position, e.position);
                    if (d < minDist && d < 140) {
                        minDist = d;
                        closest = e;
                    }
                });
                if (closest) {
                    createCannonball(ship, closest);
                    ship.userData.lastFire = now;
                }
            });

            // Update cannonballs
            for (let i = cannonballs.length - 1; i >= 0; i--) {
                const b = cannonballs[i];
                b.position.addInPlace(b.userData.velocity);
                b.userData.life--;
                if (b.userData.life <= 0) {
                    b.dispose();
                    cannonballs.splice(i, 1);
                    continue;
                }
                // Hit enemy?
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (BABYLON.Vector3.Distance(b.position, e.position) < 14) {
                        // Hit!
                        createExplosion(e.position);
                        e.dispose();
                        enemies.splice(j, 1);
                        b.dispose();
                        cannonballs.splice(i, 1);
                        gold += 40;
                        updateUI();
                        // Check wave complete
                        if (enemies.length === 0) {
                            wave++;
                            document.getElementById("wave").textContent = wave;
                            spawnWave();
                        }
                        break;
                    }
                }
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dir = new BABYLON.Vector3(0, 2, 0).subtract(e.position);
                dir.normalize();
                e.position.addInPlace(dir.scale(e.userData.speed));
                // Reached island?
                if (BABYLON.Vector3.Distance(e.position, BABYLON.Vector3.Zero()) < 48) {
                    islandHP -= 18;
                    updateUI();
                    createExplosion(e.position, true);
                    e.dispose();
                    enemies.splice(i, 1);
                    if (islandHP <= 0) {
                        gameOver = true;
                        document.getElementById("waveInfo").innerHTML = `<span style="color:#f33">ISLAND DESTROYED!</span>`;
                    }
                    if (enemies.length === 0) spawnWave();
                }
            }

            // Simple particle update (for explosions)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life--;
                p.position.addInPlace(p.velocity);
                p.scaling.scaleInPlace(0.94);
                if (p.life <= 0) {
                    p.dispose();
                    particles.splice(i, 1);
                }
            }
        }

        function createExplosion(pos, big = false) {
            const count = big ? 38 : 18;
            for (let i = 0; i < count; i++) {
                const p = BABYLON.MeshBuilder.CreateSphere("p", {diameter: big ? 7 : 4}, scene);
                p.position = pos.clone();
                p.material = new BABYLON.StandardMaterial("", scene);
                p.material.diffuseColor = new BABYLON.Color3(1, 0.6, 0.1);
                const vel = new BABYLON.Vector3(Math.random()-0.5, Math.random()*1.6 + 0.6, Math.random()-0.5);
                vel.normalize().scaleInPlace(Math.random() * 4 + 3);
                p.userData = { life: 32, velocity: vel };
                particles.push(p);
            }
        }

        function upgrade(type) {
            const costs = { damage: 150, rate: 200, speed: 120 };
            if (gold < costs[type]) return;
            gold -= costs[type];
            upgrades[type] += 0.35;
            updateUI();
        }

        function updateUI() {
            document.getElementById("gold").textContent = gold;
            document.getElementById("islandHP").textContent = Math.max(0, islandHP);
        }

        // Keyboard
        const keys = {};
        window.addEventListener("keydown", e => {
            keys[e.code] = true;
            if (e.code === "Digit1") selectedShipIndex = 0;
            if (e.code === "Digit2") selectedShipIndex = 1;
            if (e.code === "Digit3") selectedShipIndex = 2;
        });
        window.addEventListener("keyup", e => keys[e.code] = false);

        // Main loop
        function gameLoop() {
            update();
            engine.runRenderLoop(() => {
                update();
                scene.render();
            });
        }

        window.onload = () => {
            scene = createScene();
            gameLoop();
            // Initial UI
            updateUI();
            // Start first wave already called in createScene
        };

        // Simple ship creator already defined above
    </script>
</body>
</html>
