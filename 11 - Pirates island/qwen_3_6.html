<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Island Defense</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; outline: none; }
        
        /* HUD Overlay */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .stat-box {
            background: rgba(10, 15, 30, 0.85); border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 8px; padding: 10px 16px; color: #fff; font-size: 14px; font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .stat-box span { color: #ffd700; }
        .health-bar { width: 120px; height: 10px; background: #333; border-radius: 5px; margin-top: 4px; overflow: hidden; }
        .health-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa00); transition: width 0.3s; }
        
        #controls-hint {
            background: rgba(0,0,0,0.5); color: #aaa; padding: 8px 12px; border-radius: 6px;
            font-size: 12px; align-self: flex-start; margin-top: 10px;
        }
        kbd { background: rgba(255,255,255,0.15); padding: 2px 5px; border-radius: 3px; color: #ddd; }

        /* Upgrade Panel */
        #upgrade-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 20, 35, 0.95); border: 2px solid #ffd700; border-radius: 12px;
            padding: 30px; text-align: center; color: #fff; display: none; pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); min-width: 300px;
        }
        #upgrade-panel h2 { margin-bottom: 15px; color: #ffd700; }
        #upgrade-panel button {
            display: block; width: 100%; margin: 10px 0; padding: 12px;
            background: linear-gradient(135deg, #2a5298, #1e3c72); border: none; border-radius: 6px;
            color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        #upgrade-panel button:hover { background: linear-gradient(135deg, #3b6db8, #2a4c82); transform: translateY(-2px); }
        #upgrade-panel button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .next-btn { background: linear-gradient(135deg, #2ecc71, #27ae60) !important; margin-top: 20px; }
        
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; pointer-events: auto;
        }
        #game-over h1 { font-size: 48px; color: #ff4444; margin-bottom: 10px; }
        #game-over button { padding: 15px 40px; font-size: 18px; cursor: pointer; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="hud">
        <div class="top-bar">
            <div class="stat-box">
                🏝️ Island Health <span id="hp-val">100</span>
                <div class="health-bar"><div class="health-fill" id="hp-bar" style="width: 100%"></div></div>
            </div>
            <div class="stat-box">💰 Gold: <span id="gold-val">100</span></div>
            <div class="stat-box">🌊 Wave: <span id="wave-val">1</span></div>
            <div class="stat-box">🚢 Selected: <span id="sel-val">1</span></div>
        </div>
        <div id="controls-hint">
            <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Select Ship | <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Steer | <kbd>Space</kbd> Fire
        </div>
    </div>

    <div id="upgrade-panel">
        <h2>⚓ Fleet Upgrade</h2>
        <div id="upgrade-buttons">
            <button onclick="buyUpgrade('damage')">🔥 Cannon Damage (50g)</button>
            <button onclick="buyUpgrade('rate')">⚡ Fire Rate (60g)</button>
            <button onclick="buyUpgrade('speed')">🚤 Ship Speed (40g)</button>
        </div>
        <button class="next-btn" onclick="startNextWave()">▶ Start Next Wave</button>
    </div>

    <div id="game-over">
        <h1>ISLAND FALLEN</h1>
        <p>The pirates have claimed your treasure.</p>
        <p>Final Wave: <span id="final-wave">1</span></p>
        <button onclick="location.reload()" style="margin-top:20px; background:#e74c3c; color:#fff; border:none; border-radius:6px; padding:12px 24px; font-size:16px; cursor:pointer;">Try Again</button>
    </div>

    <script>
        // ===== INIT =====
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const keys = {};
        let scene, camera;
        let indicator; // Selection indicator
        
        const state = {
            gold: 100, wave: 1, islandHP: 100, maxIslandHP: 100,
            selectedShip: 0, paused: false, waveActive: false,
            upgradeTriggered: false, spawnTimer: 0,
            enemiesToSpawn: 0, enemiesSpawned: 0,
            friendlyShips: [], enemies: [], projectiles: [],
            keys: {}
        };

        // ===== SCENE SETUP =====
        const createScene = function () {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.65, 0.85, 1.0);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.004;
            scene.ambientColor = new BABYLON.Color3(0.2, 0.25, 0.35);

            // Camera
            camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 4, Math.PI / 3, 70, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 110;
            camera.lowerBetaLimit = 0.2;
            camera.upperBetaLimit = Math.PI / 2.1;
            camera.wheelPrecision = 40;

            // Lights
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemi.intensity = 0.6;
            const dir = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), scene);
            dir.position = new BABYLON.Vector3(20, 40, 20);
            dir.intensity = 0.8;

            createEnvironment();
            initGame();

            return scene;
        };

        // ===== ENVIRONMENT =====
        function createEnvironment() {
            // Water
            const water = BABYLON.MeshBuilder.CreateGround("water", {width: 400, height: 400, subdivisions: 20}, scene);
            const wMat = new BABYLON.StandardMaterial("wMat", scene);
            wMat.diffuseColor = new BABYLON.Color3(0.1, 0.35, 0.7);
            wMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            wMat.alpha = 0.85;
            wMat.disableLighting = true;
            water.material = wMat;
            water.position.y = -0.8;
            
            // Animate water vertices slightly
            scene.registerBeforeRender(() => {
                const t = performance.now() * 0.001;
                const positions = water.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                for(let i=0; i<positions.length; i+=3) {
                    if(Math.abs(positions[i]) < 190 && Math.abs(positions[i+2]) < 190) {
                        positions[i+1] = Math.sin(positions[i]*0.15 + t)*0.15 + Math.cos(positions[i+2]*0.1 + t*0.7)*0.15;
                    }
                }
                water.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
            });

            // Island
            const island = BABYLON.MeshBuilder.CreateCylinder("island", {height: 2.5, diameterTop: 14, diameterBottom: 18, tessellation: 24}, scene);
            const iMat = new BABYLON.StandardMaterial("iMat", scene);
            iMat.diffuseColor = new BABYLON.Color3(0.25, 0.65, 0.2);
            island.material = iMat;
            island.position.y = 0.5;
            island.receiveShadows = true;

            // Beach rim
            const beach = BABYLON.MeshBuilder.CreateTorus("beach", {diameter: 16, thickness: 3}, scene);
            const bMat = new BABYLON.StandardMaterial("bMat", scene);
            bMat.diffuseColor = new BABYLON.Color3(0.76, 0.7, 0.5);
            beach.material = bMat;
            beach.rotation.x = Math.PI / 2;
            beach.position.y = -0.5;

            // Props: Rocks & Palms
            for(let i=0; i<10; i++) {
                const rock = BABYLON.MeshBuilder.CreateSphere("rock"+i, {diameter: 0.8+Math.random()*1.2}, scene);
                rock.material = new BABYLON.StandardMaterial("rMat", scene);
                rock.material.diffuseColor = new BABYLON.Color3(0.45, 0.4, 0.35);
                const a = Math.random() * Math.PI * 2; const d = 2 + Math.random() * 4;
                rock.position = new BABYLON.Vector3(Math.cos(a)*d, -0.2, Math.sin(a)*d);
                rock.scaling.y = 0.6 + Math.random()*0.4;
            }

            function createPalm(x, z, h=6) {
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height: h, diameterTop: 0.25, diameterBottom: 0.4}, scene);
                const tMat = new BABYLON.StandardMaterial("wood", scene);
                tMat.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
                trunk.material = tMat;
                trunk.position = new BABYLON.Vector3(x, h/2 - 0.5, z);
                trunk.rotation.z = (Math.random()-0.5)*0.2;
                trunk.rotation.x = (Math.random()-0.5)*0.2;
                
                const leaves = BABYLON.MeshBuilder.CreateCone("leaves", {height: 1.2, diameterBottom: 3.5}, scene);
                const lMat = new BABYLON.StandardMaterial("leaf", scene);
                lMat.diffuseColor = new BABYLON.Color3(0.15, 0.55, 0.15);
                leaves.material = lMat;
                leaves.position = new BABYLON.Vector3(x, h - 0.5, z);
            }
            createPalm(-5, 3); createPalm(4, -4); createPalm(0, 6); createPalm(6, 1, 7);
        }

        // ===== SHIP CREATION =====
        function createShipMesh(name, isFriendly) {
            const group = new BABYLON.TransformNode(name, scene);
            
            // Hull
            const hull = BABYLON.MeshBuilder.CreateBox("hull", {width: 2.2, depth: 4.5, height: 1.2}, scene);
            hull.position.y = -0.2;
            const hullMat = new BABYLON.StandardMaterial(name+"_hull", scene);
            hullMat.diffuseColor = isFriendly ? new BABYLON.Color3(0.7, 0.2, 0.1) : new BABYLON.Color3(0.2, 0.25, 0.4);
            hull.material = hullMat;
            hull.parent = group;

            // Deck & Bow
            const bow = BABYLON.MeshBuilder.CreateBox("bow", {width: 1.8, depth: 1.5, height: 1}, scene);
            bow.position.z = -2.8; bow.position.y = 0.2;
            bow.rotation.x = 0.2;
            bow.material = hullMat.clone();
            bow.parent = group;

            // Mast
            const mast = BABYLON.MeshBuilder.CreateCylinder("mast", {height: 4, diameter: 0.15}, scene);
            mast.position.y = 1.8;
            mast.material = new BABYLON.StandardMaterial("wood", scene);
            mast.material.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
            mast.parent = group;

            // Sail
            const sail = BABYLON.MeshBuilder.CreatePlane("sail", {width: 3, height: 3.5}, scene);
            sail.position.z = -0.5; sail.position.y = 3.2;
            const sMat = new BABYLON.StandardMaterial(name+"_sail", scene);
            sMat.diffuseColor = isFriendly ? new BABYLON.Color3(0.95, 0.9, 0.8) : new BABYLON.Color3(0.3, 0.3, 0.35);
            sMat.diffuseTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/wood.jpg", scene);
            sail.material = sMat;
            sail.parent = group;

            // Cannons (visual)
            [-1, 1].forEach(side => {
                const canon = BABYLON.MeshBuilder.CreateBox("canon", {width: 0.3, depth: 1.2, height: 0.3}, scene);
                canon.position.set(side * 1.1, -0.1, 0.5);
                canon.rotation.y = side * Math.PI / 2;
                canon.material = new BABYLON.StandardMaterial("iron", scene);
                canon.material.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                canon.parent = group;
            });

            return group;
        }

        class Ship {
            constructor(name, pos, isFriendly) {
                this.name = name;
                this.isFriendly = isFriendly;
                this.mesh = createShipMesh(name, isFriendly);
                this.mesh.position = pos.clone();
                this.hp = isFriendly ? 100 : 40 + state.wave * 8;
                this.maxHp = this.hp;
                this.speed = isFriendly ? 6 : 3.5 + state.wave * 0.2;
                this.damage = 15;
                this.fireRate = 1.2;
                this.cooldown = 0;
                this.target = null;
                this.patrolAngle = Math.atan2(pos.z, pos.x);
            }

            update(dt) {
                if (!this.isFriendly) {
                    // Enemy AI: sail to island
                    const dir = BABYLON.Vector3.Zero().subtract(this.mesh.position).normalize();
                    const targetRot = Math.atan2(dir.x, dir.z);
                    let diff = targetRot - this.mesh.rotation.y;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    this.mesh.rotation.y += Math.sign(diff) * Math.min(Math.abs(diff), 2.5 * dt);
                    this.mesh.position.addInPlace(dir.scale(this.speed * dt));

                    // Hit island check
                    if (this.mesh.position.length() < 8.5) {
                        state.islandHP -= 12;
                        this.hp = 0;
                        createExplosion(this.mesh.position);
                    }
                }

                // Bobbing animation
                this.mesh.position.y = Math.sin(performance.now()*0.002 + this.mesh.position.x*0.1)*0.3;
                this.mesh.rotation.x = Math.sin(performance.now()*0.003)*0.02;
            }
        }

        // ===== GAME INIT =====
        function initGame() {
            // Indicator
            indicator = BABYLON.MeshBuilder.CreateTorus("ind", {diameter: 3.5, thickness: 0.15}, scene);
            indicator.material = new BABYLON.StandardMaterial("indMat", scene);
            indicator.material.diffuseColor = new BABYLON.Color3(0, 1, 0);
            indicator.material.emissiveColor = new BABYLON.Color3(0, 0.4, 0);
            
            // Friendly ships
            for(let i=0; i<3; i++) {
                const a = (i * Math.PI * 2) / 3 + Math.PI/4;
                const pos = new BABYLON.Vector3(Math.cos(a)*16, 1, Math.sin(a)*16);
                state.friendlyShips.push(new Ship(`friendly_${i}`, pos, true));
            }
            updateUI();
        }

        function startWave() {
            state.waveActive = true;
            state.paused = false;
            state.upgradeTriggered = false;
            state.enemiesToSpawn = 3 + state.wave * 2;
            state.enemiesSpawned = 0;
            state.spawnTimer = 0;
            updateUI();
        }

        function spawnEnemy() {
            const a = Math.random() * Math.PI * 2;
            const d = 85 + Math.random() * 25;
            const pos = new BABYLON.Vector3(Math.cos(a)*d, 1, Math.sin(a)*d);
            state.enemies.push(new Ship(`enemy_${Date.now()}_${state.enemies.length}`, pos, false));
        }

        // ===== COMBAT =====
        function fireProjectile(ship) {
            const ball = BABYLON.MeshBuilder.CreateSphere("proj", {diameter: 0.5}, scene);
            ball.material = new BABYLON.StandardMaterial("pMat", scene);
            ball.material.diffuseColor = new BABYLON.Color3(0.9, 0.7, 0.2);
            ball.material.emissiveColor = new BABYLON.Color3(0.4, 0.3, 0);
            ball.position = ship.mesh.position.clone();
            ball.position.y += 1.5;
            ball.position.addInPlace(new BABYLON.Vector3(Math.sin(ship.mesh.rotation.y)*1.5, 0, Math.cos(ship.mesh.rotation.y)*1.5));

            const targetPos = ship.target ? ship.target.mesh.position : new BABYLON.Vector3(0,0,0);
            const dir = targetPos.subtract(ball.position).normalize();
            // Add slight arc
            dir.y = 0.2;
            dir.normalize();

            state.projectiles.push({ mesh: ball, dir: dir, speed: 18, damage: ship.damage, life: 3.5 });
            ship.cooldown = ship.fireRate;
        }

        function createExplosion(pos, scale=1) {
            const ps = new BABYLON.ParticleSystem("exp", 40, scene);
            ps.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
            ps.createPointEmitter(new BABYLON.Vector3(-0.5, -0.5, -0.5), new BABYLON.Vector3(0.5, 0.5, 0.5));
            ps.color1 = new BABYLON.Color4(1, 0.6, 0.1, 1);
            ps.color2 = new BABYLON.Color4(1, 0.2, 0, 1);
            ps.colorDead = new BABYLON.Color4(0, 0, 0, 0);
            ps.minSize = 0.4*scale; ps.maxSize = 1.0*scale;
            ps.minLifeTime = 0.3; ps.maxLifeTime = 0.8;
            ps.emitRate = 200;
            ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            ps.gravity = new BABYLON.Vector3(0, -4, 0);
            ps.minEmitPower = 2*scale; ps.maxEmitPower = 5*scale;
            ps.updateSpeed = 0.01;
            ps.targetStopDuration = 0.15;
            ps.disposeOnStop = true;
            ps.emitter = pos.clone();
            ps.start();
        }

        // ===== UPDATE LOOP =====
        engine.runRenderLoop(() => {
            if (state.paused) { scene.render(); return; }

            const dt = engine.getDeltaTime() / 1000;

            // Input
            if (keys['1']) state.selectedShip = 0;
            if (keys['2']) state.selectedShip = 1;
            if (keys['3']) state.selectedShip = 2;
            
            const ship = state.friendlyShips[state.selectedShip];
            if (ship) {
                if (keys['a'] || keys['arrowleft']) ship.mesh.rotation.y += 2.5 * dt;
                if (keys['d'] || keys['arrowright']) ship.mesh.rotation.y -= 2.5 * dt;
                if (keys['w'] || keys['arrowup']) {
                    ship.mesh.position.x += Math.sin(ship.mesh.rotation.y) * ship.speed * dt;
                    ship.mesh.position.z += Math.cos(ship.mesh.rotation.y) * ship.speed * dt;
                }
                if (keys['s'] || keys['arrowdown']) {
                    ship.mesh.position.x -= Math.sin(ship.mesh.rotation.y) * ship.speed * 0.5 * dt;
                    ship.mesh.position.z -= Math.cos(ship.mesh.rotation.y) * ship.speed * 0.5 * dt;
                }
                if (keys[' ']) {
                    ship.cooldown = 0; // Force fire
                }
                ship.mesh.position.x = BABYLON.Scalar.Clamp(ship.mesh.position.x, -85, 85);
                ship.mesh.position.z = BABYLON.Scalar.Clamp(ship.mesh.position.z, -85, 85);
            }

            // Indicator follow
            if (ship) {
                indicator.position.copyFrom(ship.mesh.position);
                indicator.position.y += 3;
                indicator.rotation.y += 3 * dt;
            }

            // Enemy spawning
            if (state.waveActive && state.enemiesSpawned < state.enemiesToSpawn) {
                state.spawnTimer += dt;
                if (state.spawnTimer >= 1.5) {
                    spawnEnemy();
                    state.enemiesSpawned++;
                    state.spawnTimer = 0;
                }
            }

            // Update entities
            state.friendlyShips.forEach(s => s.update(dt));
            state.enemies.forEach(e => e.update(dt));
            state.enemies = state.enemies.filter(e => {
                if (e.hp <= 0) {
                    e.mesh.dispose();
                    state.gold += 15 + state.wave * 3;
                    createExplosion(e.mesh.position, 0.6);
                    return false;
                }
                return true;
            });

            // Combat
            state.friendlyShips.forEach(s => {
                s.cooldown -= dt;
                if (s.cooldown <= 0) {
                    let best = 28; let tgt = null;
                    state.enemies.forEach(e => {
                        const d = BABYLON.Vector3.Distance(s.mesh.position, e.mesh.position);
                        if (d < best) { best = d; tgt = e; }
                    });
                    if (tgt) { s.target = tgt; fireProjectile(s); }
                }
            });

            // Projectiles
            state.projectiles.forEach(p => {
                p.life -= dt;
                p.mesh.position.addInPlace(p.dir.scale(p.speed * dt));
                p.dir.y -= 2 * dt; // Gravity
                state.enemies.forEach(e => {
                    if (BABYLON.Vector3.Distance(p.mesh.position, e.mesh.position) < 2.5) {
                        e.hp -= p.damage;
                        p.life = 0;
                        createExplosion(p.mesh.position, 0.3);
                    }
                });
                if (p.life <= 0) p.mesh.dispose();
            });
            state.projectiles = state.projectiles.filter(p => p.life > 0);

            // Wave check
            if (state.waveActive && state.enemiesSpawned >= state.enemiesToSpawn && state.enemies.length === 0) {
                if (!state.upgradeTriggered) {
                    state.upgradeTriggered = true;
                    setTimeout(showUpgrades, 600);
                    state.waveActive = false;
                }
            }

            // Game Over
            if (state.islandHP <= 0) {
                state.islandHP = 0;
                document.getElementById('game-over').style.display = 'flex';
                document.getElementById('final-wave').textContent = state.wave;
                state.paused = true;
            }

            updateUI();
            scene.render();
        });

        // ===== UI & UPGRADES =====
        function updateUI() {
            document.getElementById('hp-val').textContent = Math.max(0, state.islandHP);
            document.getElementById('hp-bar').style.width = (state.islandHP / state.maxIslandHP * 100) + '%';
            document.getElementById('gold-val').textContent = state.gold;
            document.getElementById('wave-val').textContent = state.wave;
            document.getElementById('sel-val').textContent = state.selectedShip + 1;
        }

        function showUpgrades() {
            state.paused = true;
            document.getElementById('upgrade-panel').style.display = 'block';
            updateUpgradeButtons();
        }

        function updateUpgradeButtons() {
            const btns = document.querySelectorAll('#upgrade-panel button:not(.next-btn)');
            btns[0].disabled = state.gold < 50;
            btns[1].disabled = state.gold < 60;
            btns[2].disabled = state.gold < 40;
        }

        function buyUpgrade(type) {
            let cost = type==='damage'?50 : type==='rate'?60 : 40;
            if (state.gold >= cost) {
                state.gold -= cost;
                state.friendlyShips.forEach(s => {
                    if (type==='damage') s.damage += 6;
                    if (type==='rate') s.fireRate = Math.max(0.25, s.fireRate * 0.82);
                    if (type==='speed') s.speed += 0.6;
                });
                updateUI(); updateUpgradeButtons();
            }
        }

        function startNextWave() {
            document.getElementById('upgrade-panel').style.display = 'none';
            state.wave++;
            startWave();
        }

        // ===== INPUT =====
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('resize', () => engine.resize());

        // ===== START =====
        const sceneRef = createScene();
        startWave();
    </script>
</body>
</html>
