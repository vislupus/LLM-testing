<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Defender - Pirate Protocol</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(20,20,40,0.9), rgba(40,40,80,0.8));
            border: 2px solid rgba(255,200,100,0.4);
            border-radius: 12px;
            padding: 15px 25px;
            color: #fff;
            pointer-events: auto;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,200,100,0.5);
        }

        .gold-value { color: #ffd700; }
        .wave-value { color: #ff6b6b; }

        .health-container {
            flex: 1;
            max-width: 400px;
            margin: 0 30px;
        }

        .health-bar-bg {
            background: rgba(20,20,40,0.9);
            border: 2px solid rgba(100,255,100,0.4);
            border-radius: 12px;
            padding: 12px 20px;
        }

        .health-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4a4;
            margin-bottom: 8px;
            text-align: center;
        }

        .health-bar-outer {
            height: 24px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .health-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #22ff22, #88ff44);
            border-radius: 12px;
            transition: width 0.3s, background 0.3s;
            box-shadow: 0 0 15px rgba(50,255,50,0.5);
        }

        .health-bar-inner.danger {
            background: linear-gradient(90deg, #ff2222, #ff4444);
            box-shadow: 0 0 15px rgba(255,50,50,0.5);
        }

        .health-bar-inner.warning {
            background: linear-gradient(90deg, #ffaa22, #ffcc44);
            box-shadow: 0 0 15px rgba(255,150,0,0.5);
        }

        .ship-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .ship-card {
            background: linear-gradient(135deg, rgba(20,40,60,0.9), rgba(40,60,100,0.8));
            border: 2px solid rgba(100,150,255,0.3);
            border-radius: 12px;
            padding: 15px 20px;
            min-width: 160px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ship-card:hover {
            border-color: rgba(100,150,255,0.7);
            transform: translateY(-3px);
        }

        .ship-card.selected {
            border-color: #00ffaa;
            box-shadow: 0 0 20px rgba(0,255,170,0.4), inset 0 0 30px rgba(0,255,170,0.1);
        }

        .ship-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ship-number {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #668;
            margin-bottom: 5px;
        }

        .ship-stats {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
            margin-top: 8px;
        }

        .ship-stat {
            text-align: center;
        }

        .ship-stat-value {
            color: #fff;
            font-weight: bold;
        }

        .upgrade-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(30,30,50,0.95), rgba(50,50,80,0.9));
            border: 2px solid rgba(255,150,50,0.4);
            border-radius: 12px;
            padding: 15px;
            pointer-events: auto;
        }

        .upgrade-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffa500;
            margin-bottom: 12px;
            text-align: center;
        }

        .upgrade-btn {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #3a3a5a, #5a5a8a);
            border: 1px solid rgba(255,200,100,0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #4a4a7a, #7a7aaa);
            border-color: rgba(255,200,100,0.6);
            transform: translateX(3px);
        }

        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .upgrade-btn .cost {
            color: #ffd700;
            float: right;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        .game-over-overlay.show { display: flex; }

        .game-over-box {
            background: linear-gradient(135deg, #1a1a2e, #2a2a4e);
            border: 3px solid #ff4444;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            animation: popIn 0.5s;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .game-over-title {
            font-size: 48px;
            color: #ff4444;
            text-shadow: 0 0 30px rgba(255,68,68,0.5);
            margin-bottom: 20px;
        }

        .game-over-stats {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #22aa44, #44cc66);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(50,200,100,0.5);
        }

        .instructions {
            position: absolute;
            bottom: 100px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            line-height: 1.8;
        }

        .instructions kbd {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="ui-overlay">
        <div class="top-bar">
            <div class="stat-box">
                <div class="stat-label">Gold</div>
                <div class="stat-value gold-value" id="gold-display">0</div>
            </div>

            <div class="health-container">
                <div class="health-bar-bg">
                    <div class="health-label">🏝️ Island Health</div>
                    <div class="health-bar-outer">
                        <div class="health-bar-inner" id="health-bar" style="width: 100%"></div>
                    </div>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-label">Wave</div>
                <div class="stat-value wave-value" id="wave-display">1</div>
            </div>
        </div>

        <div class="ship-panel" id="ship-panel">
            <div class="ship-card selected" data-ship="0">
                <div class="ship-number">Ship 1</div>
                <div class="ship-stats">
                    <div class="ship-stat">
                        <div class="ship-stat-value" id="ship0-dmg">10</div>
                        <div>DMG</div>
                    </div>
                    <div class="ship-stat">
                        <div class="ship-stat-value" id="ship0-spd">1.0</div>
                        <div>SPD</div>
                    </div>
                    <div class="ship-stat">
                        <div class="ship-stat-value" id="ship0-rate">1.0</div>
                        <div>RATE</div>
                    </div>
                </div>
            </div>

            <div class="ship-card" data-ship="1">
                <div class="ship-number">Ship 2</div>
                <div class="ship-stats">
                    <div class="ship-stat">
                        <div class="ship-stat-value" id="ship1-dmg">10</div>
                        <div>DMG</div>
                    </div>
                    <div class="ship-stat">
                        <div class="ship-stat-value" id="ship1-spd">1.0</div>
                        <div>SPD</div>
                    </div>
                    <div class="ship-stat">
                        <div class="ship-stat-value"-rate">1.0</div>
                        <div>R id="ship1ATE</div>
                    </div>
                </div>
            </div>

            <div class="ship-card" data-ship="2">
                <div class="ship-number">Ship 3</div>
                <div class="ship-stats">
                    <div class="ship-stat">
                        <div class="ship-stat-value" id="ship2-dmg">10</div>
                        <div>DMG</div>
                    </div>
                    <div class="ship-stat">
                        <div class="ship-stat-value" id="ship2-spd">1.0</div>
                        <div>SPD</div>
                    </div>
                    <div class="ship-stat">
                        <div class="ship-stat-value" id="ship2-rate">1.0</div>
                        <div>RATE</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="upgrade-panel" id="upgrade-panel">
            <div class="upgrade-title">⬆ Upgrades (Ship <span id="upgrade-ship-num">1</span>)</div>
            <button class="upgrade-btn" id="btn-upgrade-dmg" onclick="upgradeDamage()">
                Damage +5 <span class="cost" id="cost-dmg">50g</span>
            </button>
            <button class="upgrade-btn" id="btn-upgrade-rate" onclick="upgradeFireRate()">
                Fire Rate +10% <span class="cost" id="cost-rate">40g</span>
            </button>
            <button class="upgrade-btn" id="btn-upgrade-spd" onclick="upgradeSpeed()">
                Speed +10% <span class="cost" id="cost-spd">30g</span>
            </button>
            <button class="upgrade-btn" id="btn-repair" onclick="repairIsland()">
                Repair Island +25HP <span class="cost">100g</span>
            </button>
        </div>

        <div class="instructions">
            <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Select Ship<br>
            <kbd>Right Click</kbd> Move Selected Ship<br>
            <kbd>Left Drag</kbd> Orbit Camera
        </div>

        <div class="game-over-overlay" id="game-over">
            <div class="game-over-box">
                <div class="game-over-title">GAME OVER</div>
                <div class="game-over-stats">
                    You survived <span id="final-wave">1</span> waves!<br>
                    Final Gold: <span id="final-gold">0</span>
                </div>
                <button class="restart-btn" onclick="restartGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // ISLAND DEFENDER - PIRATE PROTOCOL
        // 3D Browser Game with Babylon.js
        // ============================================

        // Game State
        const gameState = {
            gold: 200,
            wave: 1,
            islandHealth: 100,
            maxIslandHealth: 100,
            isGameOver: false,
            selectedShip: 0,
            enemiesKilled: 0
        };

        // Ship data
        const ships = [
            { damage: 10, fireRate: 1.0, speed: 1.0, lastFire: 0, mesh: null, target: null, moving: false, moveTarget: null },
            { damage: 10, fireRate: 1.0, speed: 1.0, lastFire: 0, mesh: null, target: null, moving: false, moveTarget: null },
            { damage: 10, fireRate: 1.0, speed: 1.0, lastFire: 0, mesh: null, target: null, moving: false, moveTarget: null }
        ];

        // Upgrade costs
        const upgradeCosts = {
            damage: 50,
            fireRate: 40,
            speed: 30
        };

        // Game arrays
        let enemies = [];
        let projectiles = [];
        let enemySpawnTimer = 0;
        let enemiesThisWave = 0;
        let enemiesSpawned = 0;

        // Babylon.js objects
        let canvas, engine, scene, camera;
        let waterMesh, islandMesh;
        let shipMeshes = [];
        let enemyMeshes = [];
        let projectileMeshes = [];

        // Initialize
        window.addEventListener('DOMContentLoaded', initGame);

        function initGame() {
            canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true);

            createScene();

            engine.runRenderLoop(() => {
                if (!gameState.isGameOver) {
                    updateGame();
                }
                scene.render();
            });

            window.addEventListener('resize', () => engine.resize());

            // Ship selection
            document.querySelectorAll('.ship-card').forEach(card => {
                card.addEventListener('click', () => {
                    const shipNum = parseInt(card.dataset.ship);
                    selectShip(shipNum);
                });
            });

            // Right-click to move
            canvas.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (gameState.isGameOver) return;

                const pickResult = scene.pick(scene.pointerX, scene.pointerY);
                if (pickResult.hit && pickResult.pickedMesh === waterMesh) {
                    moveSelectedShip(pickResult.pickedPoint);
                }
            });

            // Keyboard controls
            window.addEventListener('keydown', (e) => {
                if (e.key === '1') selectShip(0);
                if (e.key === '2') selectShip(1);
                if (e.key === '3') selectShip(2);
            });

            updateUI();
        }

        function createScene() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.5, 0.7, 1);

            // Camera
            camera = new BABYLON.ArcRotateCamera('camera', -Math.PI/2, Math.PI/3, 80, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 30;
            camera.upperRadiusLimit = 150;
            camera.upperBetaLimit = Math.PI / 2.2;
            camera.panningSensibility = 0;

            // Lights
            const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0.5, 1, 0.3), scene);
            light.intensity = 0.8;

            const dirLight = new BABYLON.DirectionalLight('dirLight', new BABYLON.Vector3(-0.5, -1, -0.5), scene);
            dirLight.intensity = 0.4;

            // Water
            createWater();

            // Island
            createIsland();

            // Friendly ships
            createShips();

            // Skybox
            const skybox = BABYLON.MeshBuilder.CreateBox('skybox', { size: 500 }, scene);
            const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
            skyMat.backFaceCulling = false;
            skyMat.disableLighting = true;
            skyMat.emissiveColor = new BABYLON.Color3(0.6, 0.75, 0.9);
            skybox.material = skyMat;

            // Fog
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.003;
            scene.fogColor = new BABYLON.Color3(0.6, 0.75, 0.9);
        }

        function createWater() {
            waterMesh = BABYLON.MeshBuilder.CreateGround('water', { width: 400, height: 400, subdivisions: 50 }, scene);

            const waterMat = new BABYLON.StandardMaterial('waterMat', scene);
            waterMat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.8);
            waterMat.specularColor = new BABYLON.Color3(0.3, 0.4, 0.5);
            waterMat.emissiveColor = new BABYLON.Color3(0.1, 0.3, 0.5);
            waterMat.alpha = 0.85;
            waterMesh.material = waterMat;

            // Animate water
            let time = 0;
            scene.registerBeforeRender(() => {
                time += 0.01;
                const positions = waterMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                if (positions) {
                    for (let i = 0; i < positions.length; i += 3) {
                        const x = positions[i];
                        const z = positions[i + 2];
                        positions[i + 1] = Math.sin(x * 0.1 + time) * 0.3 + Math.cos(z * 0.1 + time * 0.8) * 0.2;
                    }
                    waterMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
                }
            });
        }

        function createIsland() {
            // Main island
            islandMesh = BABYLON.MeshBuilder.CreateCylinder('island', {
                diameterTop: 20,
                diameterBottom: 25,
                height: 3,
                tessellation: 16
            }, scene);
            islandMesh.position.y = 1;

            const islandMat = new BABYLON.StandardMaterial('islandMat', scene);
            islandMat.diffuseColor = new BABYLON.Color3(0.3, 0.6, 0.2);
            islandMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            islandMesh.material = islandMat;

            // Sand ring
            const sand = BABYLON.MeshBuilder.CreateCylinder('sand', {
                diameterTop: 28,
                diameterBottom: 30,
                height: 1,
                tessellation: 24
            }, scene);
            sand.position.y = 0.3;

            const sandMat = new BABYLON.StandardMaterial('sandMat', scene);
            sandMat.diffuseColor = new BABYLON.Color3(0.9, 0.85, 0.6);
            islandMesh.sand = sand;

            // Palm trees
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const dist = 6 + Math.random() * 3;
                createPalmTree(Math.cos(angle) * dist, Math.sin(angle) * dist);
            }

            // Rocks
            for (let i = 0; i < 4; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 4 + Math.random() * 4;
                createRock(Math.cos(angle) * dist, Math.sin(angle) * dist);
            }
        }

        function createPalmTree(x, z) {
            const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', { diameter: 0.5, height: 6 }, scene);
            trunk.position = new BABYLON.Vector3(x, 4, z);

            const trunkMat = new BABYLON.StandardMaterial('trunkMat', scene);
            trunkMat.diffuseColor = new BABYLON.Color3(0.5, 0.3, 0.15);
            trunk.material = trunkMat;

            // Leaves
            for (let i = 0; i < 5; i++) {
                const leaf = BABYLON.MeshBuilder.CreateCylinder('leaf', {
                    diameterTop: 0,
                    diameterBottom: 2,
                    height: 4,
                    tessellation: 4
                }, scene);
                leaf.position = new BABYLON.Vector3(x, 7, z);
                leaf.rotation.x = Math.PI / 4;
                leaf.rotation.y = (i / 5) * Math.PI * 2;

                const leafMat = new BABYLON.StandardMaterial('leafMat', scene);
                leafMat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.1);
                leaf.material = leafMat;
            }
        }

        function createRock(x, z) {
            const rock = BABYLON.MeshBuilder.CreatePolyhedron('rock', { type: 1, size: 0.5 + Math.random() * 0.5 }, scene);
            rock.position = new BABYLON.Vector3(x, 0.5, z);
            rock.scaling = new BABYLON.Vector3(1 + Math.random() * 0.5, 0.5 + Math.random() * 0.5, 1 + Math.random() * 0.5);
            rock.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());

            const rockMat = new BABYLON.StandardMaterial('rockMat', scene);
            rockMat.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.4);
            rock.material = rockMat;
        }

        function createShips() {
            const positions = [
                new BABYLON.Vector3(18, 0.5, 0),
                new BABYLON.Vector3(-9, 0.5, 15),
                new BABYLON.Vector3(-9, 0.5, -15)
            ];

            for (let i = 0; i < 3; i++) {
                const ship = createShipMesh(false);
                ship.position = positions[i];
                ship.lookAt(BABYLON.Vector3.Zero());
                ships[i].mesh = ship;
                shipMeshes.push(ship);
            }
        }

        function createShipMesh(isEnemy = false) {
            const ship = new BABYLON.TransformNode('ship', scene);

            // Hull
            const hull = BABYLON.MeshBuilder.CreateBox('hull', { width: 2, height: 1, depth: 4 }, scene);
            hull.parent = ship;
            hull.position.y = 0.5;

            const hullMat = new BABYLON.StandardMaterial('hullMat', scene);
            hullMat.diffuseColor = isEnemy ? new BABYLON.Color3(0.3, 0.15, 0.1) : new BABYLON.Color3(0.4, 0.2, 0.1);
            hull.material = hullMat;

            // Deck
            const deck = BABYLON.MeshBuilder.CreateBox('deck', { width: 1.5, height: 0.5, depth: 3 }, scene);
            deck.parent = ship;
            deck.position.y = 1.2;
            deck.material = hullMat;

            // Mast
            const mast = BABYLON.MeshBuilder.CreateCylinder('mast', { diameter: 0.2, height: 4 }, scene);
            mast.parent = ship;
            mast.position.y = 2.5;
            mast.position.z = -0.5;

            const mastMat = new BABYLON.StandardMaterial('mastMat', scene);
            mastMat.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
            mast.material = mastMat;

            // Sail
            const sail = BABYLON.MeshBuilder.CreatePlane('sail', { width: 2.5, height: 3 }, scene);
            sail.parent = ship;
            sail.position.y = 3;
            sail.position.z = -0.5;
            sail.rotation.y = Math.PI / 2;

            const sailMat = new BABYLON.StandardMaterial('sailMat', scene);
            sailMat.diffuseColor = isEnemy ? new BABYLON.Color3(0.9, 0.2, 0.2) : new BABYLON.Color3(0.95, 0.95, 0.95);
            sailMat.backFaceCulling = false;
            sail.material = sailMat;

            // Cannon (front)
            const cannon = BABYLON.MeshBuilder.CreateCylinder('cannon', { diameter: 0.3, height: 1 }, scene);
            cannon.parent = ship;
            cannon.rotation.x = Math.PI / 2;
            cannon.position = new BABYLON.Vector3(0, 1, 2.2);

            const cannonMat = new BABYLON.StandardMaterial('cannonMat', scene);
            cannonMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            cannon.material = cannonMat;

            return ship;
        }

        function spawnEnemy() {
            if (enemiesSpawned >= enemiesThisWave) return;

            const angle = Math.random() * Math.PI * 2;
            const dist = 80;
            const spawnPos = new BABYLON.Vector3(
                Math.cos(angle) * dist,
                0.5,
                Math.sin(angle) * dist
            );

            const enemy = createShipMesh(true);
            enemy.position = spawnPos;
            enemy.lookAt(BABYLON.Vector3.Zero());

            const health = 20 + gameState.wave * 5;

            enemies.push({
                mesh: enemy,
                health: health,
                maxHealth: health,
                speed: 0.3 + gameState.wave * 0.02,
                damage: 10,
                goldValue: 15 + gameState.wave * 2
            });

            enemyMeshes.push(enemy);
            enemiesSpawned++;
        }

        function fireProjectile(fromShip, toTarget) {

    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
</html>
