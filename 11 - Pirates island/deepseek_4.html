<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Island Defense - Babylon.js</title>
    <style>
        :root {
            --bg: #0a0a14;
            --panel-bg: rgba(15, 12, 8, 0.92);
            --gold: #f0c040;
            --text: #e8dcc8;
            --danger: #e04040;
            --accent: #4aa3df;
            --btn-bg: rgba(40, 30, 20, 0.85);
            --btn-hover: rgba(60, 44, 28, 0.9);
            --border: rgba(200, 160, 80, 0.35);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', 'Trebuchet MS', 'Georgia', serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #top-bar {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            align-items: center;
            pointer-events: auto;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 28px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-group {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .hp-bar-outer {
            width: 110px;
            height: 10px;
            background: #3a2020;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #5a3030;
        }
        .hp-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #e04040, #f06040);
            transition: width 0.3s;
            border-radius: 4px;
        }
        .gold-text {
            color: var(--gold);
            font-weight: 700;
            font-size: 15px;
        }
        .wave-text {
            color: #ffaa60;
            font-weight: 700;
        }
        #bottom-panel {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            align-items: center;
            pointer-events: auto;
            background: var(--panel-bg);
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .ship-select-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: var(--btn-bg);
            color: #ccc;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            line-height: 1;
            letter-spacing: 0.05em;
        }
        .ship-select-btn.selected {
            border-color: var(--gold);
            box-shadow: 0 0 18px rgba(240, 192, 64, 0.5);
            color: var(--gold);
            background: rgba(50, 35, 15, 0.9);
            transform: scale(1.08);
        }
        .ship-select-btn:hover {
            border-color: #ccc;
            background: var(--btn-hover);
        }
        .ship-select-btn .ship-label {
            font-size: 9px;
            letter-spacing: 0.02em;
            opacity: 0.8;
            margin-top: -2px;
        }
        .upgrade-btn {
            padding: 7px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: var(--btn-bg);
            color: #ddd;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            white-space: nowrap;
            pointer-events: auto;
        }
        .upgrade-btn:hover {
            background: var(--btn-hover);
            border-color: var(--gold);
            color: #fff;
        }
        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .upgrade-btn .cost {
            color: var(--gold);
            font-weight: 700;
            margin-left: 3px;
        }
        #next-wave-btn {
            padding: 10px 22px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            background: rgba(240, 160, 30, 0.2);
            color: var(--gold);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: all 0.3s;
            animation: pulse 2s infinite;
            pointer-events: auto;
        }
        #next-wave-btn:hover {
            background: rgba(240, 160, 30, 0.4);
            box-shadow: 0 0 22px rgba(240, 160, 40, 0.5);
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(240, 160, 40, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(240, 160, 40, 0.7);
            }
        }
        #message-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-shadow: 0 0 16px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        #message-toast.show {
            transform: translate(-50%, -50%) scale(1);
        }
        @media (max-width: 700px) {
            #top-bar {
                padding: 8px 12px;
                gap: 8px;
                border-radius: 20px;
            }
            .stat-group {
                font-size: 11px;
            }
            .hp-bar-outer {
                width: 70px;
                height: 7px;
            }
            #bottom-panel {
                padding: 8px 10px;
                gap: 6px;
                border-radius: 16px;
            }
            .upgrade-btn {
                padding: 5px 8px;
                font-size: 9px;
            }
            .ship-select-btn {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui-layer">
        <div id="top-bar">
            <div class="stat-group">🏝️ Island
                <div class="hp-bar-outer"><div class="hp-bar-inner" id="island-hp-bar"></div></div>
                <span id="island-hp-text">100</span>
            </div>
            <div class="stat-group wave-text" id="wave-display">🌊 Wave 1</div>
            <div class="stat-group gold-text" id="gold-display">💰 50</div>
            <div class="stat-group" id="enemies-remaining" style="color:#ff8860;">⚔️ 0</div>
        </div>
        <div id="bottom-panel">
            <button class="ship-select-btn selected" data-ship="0" id="ship-btn-0">1<span class="ship-label">Ship</span></button>
            <button class="ship-select-btn" data-ship="1" id="ship-btn-1">2<span class="ship-label">Ship</span></button>
            <button class="ship-select-btn" data-ship="2" id="ship-btn-2">3<span class="ship-label">Ship</span></button>
            <span style="color:#aaa;margin:0 4px;font-size:11px;">|</span>
            <button class="upgrade-btn" id="upg-dmg" title="Cannon Damage">💥 Dmg <span id="dmg-lvl">1</span> <span class="cost" id="dmg-cost">50g</span></button>
            <button class="upgrade-btn" id="upg-rate" title="Fire Rate">⏱️ Rate <span id="rate-lvl">1</span> <span class="cost" id="rate-cost">50g</span></button>
            <button class="upgrade-btn" id="upg-spd" title="Move Speed">💨 Spd <span id="spd-lvl">1</span> <span class="cost" id="spd-cost">50g</span></button>
            <button id="next-wave-btn" style="display:none;">▶ Next Wave</button>
        </div>
        <div id="message-toast"></div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js">
    </script>
    <script>
        (function() {
            // ────────────────────────────────────
            // CANVAS & ENGINE
            // ────────────────────────────────────
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: false,
                stencil: true,
                antialias: true
            });
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.35, 0.55, 0.72, 1.0);
            scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
            scene.fogColor = new BABYLON.Color3(0.45, 0.6, 0.75);
            scene.fogStart = 55;
            scene.fogEnd = 140;

            // ────────────────────────────────────
            // CAMERA
            // ────────────────────────────────────
            const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 3, Math.PI / 3.3, 55, new BABYLON.Vector3(0,
                3, 0), scene);
            camera.lowerRadiusLimit = 22;
            camera.upperRadiusLimit = 130;
            camera.lowerBetaLimit = 0.2;
            camera.upperBetaLimit = 1.4;
            camera.panningSensibility = 500;
            camera.wheelPrecision = 35;
            camera.attachControl(canvas, true);
            camera.target = new BABYLON.Vector3(0, 2, 0);

            // ────────────────────────────────────
            // LIGHTING
            // ────────────────────────────────────
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.3, 1.0, 0.4), scene);
            hemiLight.intensity = 0.7;
            hemiLight.diffuse = new BABYLON.Color3(1.0, 0.94, 0.82);
            hemiLight.groundColor = new BABYLON.Color3(0.2, 0.25, 0.35);

            const sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5, -0.8, -0.3), scene);
            sunLight.intensity = 0.85;
            sunLight.diffuse = new BABYLON.Color3(1.0, 0.92, 0.78);

            // ────────────────────────────────────
            // MATERIALS
            // ────────────────────────────────────
            function createMat(name, hex, rough = 0.8, specHex = "#1a1a1a") {
                const m = new BABYLON.StandardMaterial(name, scene);
                m.diffuseColor = BABYLON.Color3.FromHexString(hex);
                m.specularColor = BABYLON.Color3.FromHexString(specHex);
                m.roughness = rough;
                return m;
            }
            const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
            waterMat.diffuseColor = new BABYLON.Color3(0.08, 0.35, 0.52);
            waterMat.specularColor = new BABYLON.Color3(0.5, 0.6, 0.65);
            waterMat.roughness = 0.15;
            waterMat.emissiveColor = new BABYLON.Color3(0.02, 0.08, 0.14);
            waterMat.alpha = 0.88;

            const woodMat = createMat("wood", "#8b6914", 0.75, "#2a1a08");
            const woodDarkMat = createMat("woodDark", "#5c3a1e", 0.85, "#1a0a04");
            const sailWhite = createMat("sailWhite", "#f5f0e8", 0.65, "#333");
            const sailCream = createMat("sailCream", "#faf5e8", 0.65, "#333");
            const sailLight = createMat("sailLight", "#e8e4dc", 0.65, "#333");
            const sailEnemy = createMat("sailEnemy", "#1a1512", 0.7, "#0a0a0a");
            const cannonMat = createMat("cannonMat", "#3a3028", 0.5, "#1a1a1a");
            const islandBodyMat = createMat("islandBody", "#c4a882", 0.9, "#1a1a1a");
            const islandTopMat = createMat("islandTop", "#5a8c3e", 0.92, "#0a1a04");
            const rockMat = createMat("rockMat", "#7a6b5b", 0.88, "#1a1a1a");
            const trunkMat = createMat("trunk", "#7a5c3e", 0.9, "#1a0a04");
            const foliageMat = createMat("foliage", "#3d6b1e", 0.9, "#0a1a04");
            const foliageMat2 = createMat("foliage2", "#2d5a14", 0.9, "#0a1a04");
            const markerMat = new BABYLON.StandardMaterial("marker", scene);
            markerMat.diffuseColor = new BABYLON.Color3(1, 0.85, 0.1);
            markerMat.emissiveColor = new BABYLON.Color3(0.5, 0.4, 0.05);
            markerMat.roughness = 0.4;

            // ────────────────────────────────────
            // WATER PLANE
            // ────────────────────────────────────
            const waterSize = 200;
            const water = BABYLON.MeshBuilder.CreateGround("water", {
                width: waterSize,
                height: waterSize,
                subdivisions: 32
            }, scene);
            water.position.y = 0;
            water.material = waterMat;
            water.receiveShadows = true;

            // ────────────────────────────────────
            // ISLAND
            // ────────────────────────────────────
            const islandRadius = 7.5;
            const islandGroup = new BABYLON.TransformNode("islandGroup", scene);
            const islandBody = BABYLON.MeshBuilder.CreateCylinder("islandBody", {
                diameterTop: islandRadius * 2,
                diameterBottom: islandRadius * 2 + 1.5,
                height: 2.8,
                tessellation: 36
            }, scene);
            islandBody.parent = islandGroup;
            islandBody.position.y = 1.4;
            islandBody.material = islandBodyMat;
            islandBody.receiveShadows = true;

            const islandTop = BABYLON.MeshBuilder.CreateCylinder("islandTop", {
                diameterTop: islandRadius * 2 - 0.3,
                diameterBottom: islandRadius * 2,
                height: 0.25,
                tessellation: 36
            }, scene);
            islandTop.parent = islandGroup;
            islandTop.position.y = 2.85;
            islandTop.material = islandTopMat;
            islandTop.receiveShadows = true;

            // Palm trees
            const palmPositions = [
                [2.5, 5],
                [-3.5, 4.5],
                [5, -2],
                [-5, -3],
                [0, 5.8],
                [-5.5, 1],
                [5.5, 3],
                [-2, -5.5],
                [3, -5],
                [-4, -4.5]
            ];
            const palmTrees = [];
            palmPositions.forEach(([px, pz]) => {
                const dist = Math.sqrt(px * px + pz * pz);
                if (dist < islandRadius - 0.6) {
                    const palm = new BABYLON.TransformNode("palm", scene);
                    palm.parent = islandGroup;
                    palm.position.set(px, 2.95, pz);
                    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
                        diameterTop: 0.18,
                        diameterBottom: 0.32,
                        height: 3.2 + Math.random() * 2.5,
                        tessellation: 8
                    }, scene);
                    trunk.parent = palm;
                    trunk.position.y = 1.8;
                    trunk.material = trunkMat;
                    trunk.rotation.z = (Math.random() - 0.5) * 0.25;
                    trunk.rotation.x = (Math.random() - 0.5) * 0.25;
                    const canopy = BABYLON.MeshBuilder.CreateSphere("canopy", {
                        diameter: 2.2 + Math.random() * 1.6,
                        segments: 8
                    }, scene);
                    canopy.parent = palm;
                    canopy.position.y = 3.5;
                    canopy.scaling.y = 0.45;
                    canopy.material = Math.random() < 0.5 ? foliageMat : foliageMat2;
                    canopy.receiveShadows = true;
                    palmTrees.push(palm);
                }
            });

            // Rocks
            for (let r = 0; r < 15; r++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = islandRadius - 0.3 + Math.random() * 2.5;
                const rx = Math.cos(angle) * dist;
                const rz = Math.sin(angle) * dist;
                const rock = BABYLON.MeshBuilder.CreateSphere("rock", {
                    diameter: 0.4 + Math.random() * 1.3,
                    segments: 6
                }, scene);
                rock.parent = islandGroup;
                rock.position.set(rx, 2.65 + Math.random() * 0.4, rz);
                rock.scaling.set(1, 0.4 + Math.random() * 0.5, 0.7 + Math.random() * 0.6);
                rock.rotation.set(Math.random() * 0.8, Math.random() * Math.PI, Math.random() * 0.8);
                rock.material = rockMat;
                rock.receiveShadows = true;
            }

            // ────────────────────────────────────
            // SHIP FACTORY
            // ────────────────────────────────────
            function createShipMesh(sailMat, hullMatOverride = null) {
                const root = new BABYLON.TransformNode("shipRoot", scene);
                const hullMat = hullMatOverride || woodMat;

                // Main hull
                const hull = BABYLON.MeshBuilder.CreateBox("hull", {
                    width: 2.2,
                    height: 1.0,
                    depth: 5.5,
                }, scene);
                hull.parent = root;
                hull.position.y = 0.55;
                hull.material = hullMat;
                hull.receiveShadows = true;

                // Bow
                const bow = BABYLON.MeshBuilder.CreateBox("bow", {
                    width: 1.8,
                    height: 0.7,
                    depth: 1.8,
                }, scene);
                bow.parent = root;
                bow.position.set(0, 0.7, 3.2);
                bow.material = hullMat;
                bow.receiveShadows = true;
                bow.scaling.x = 0.75;

                // Stern castle
                const stern = BABYLON.MeshBuilder.CreateBox("stern", {
                    width: 2.0,
                    height: 1.1,
                    depth: 1.4,
                }, scene);
                stern.parent = root;
                stern.position.set(0, 0.9, -2.3);
                stern.material = hullMat;
                stern.receiveShadows = true;

                // Masts
                const mastPositions = [
                    [0, 1.2, -0.6],
                    [0, 1.1, 1.8]
                ];
                const mastContainers = [];
                mastPositions.forEach(([mx, my, mz]) => {
                    const mast = BABYLON.MeshBuilder.CreateCylinder("mast", {
                        diameterTop: 0.1,
                        diameterBottom: 0.18,
                        height: 5.5,
                        tessellation: 8
                    }, scene);
                    mast.parent = root;
                    mast.position.set(mx, my + 2.75, mz);
                    mast.material = woodDarkMat;
                    mast.receiveShadows = true;

                    // Sails on this mast
                    for (let s = 0; s < 2; s++) {
                        const sail = BABYLON.MeshBuilder.CreateBox("sail", {
                            width: 2.6,
                            height: 1.8,
                            depth: 0.08,
                        }, scene);
                        sail.parent = root;
                        sail.position.set(mx, my + 1.8 + s * 2.2, mz);
                        sail.material = sailMat;
                        sail.receiveShadows = true;
                    }
                    // Flag
                    const flag = BABYLON.MeshBuilder.CreateBox("flag", {
                        width: 0.8,
                        height: 0.45,
                        depth: 0.04,
                    }, scene);
                    flag.parent = root;
                    flag.position.set(mx + 0.5, my + 5.5, mz);
                    flag.material = sailMat;
                    flag.rotation.y = 0.3;
                    mastContainers.push(mast);
                });

                // Cannons (small cylinders on sides)
                const cannonOffsets = [
                    [1.15, 0.55, -1.5],
                    [-1.15, 0.55, -1.5],
                    [1.15, 0.55, 0],
                    [-1.15, 0.55, 0],
                    [1.15, 0.55, 1.5],
                    [-1.15, 0.55, 1.5],
                    [1.15, 0.55, 2.5],
                    [-1.15, 0.55, 2.5],
                ];
                cannonOffsets.forEach(([cx, cy, cz]) => {
                    const cannon = BABYLON.MeshBuilder.CreateCylinder("cannon", {
                        diameterTop: 0.14,
                        diameterBottom: 0.2,
                        height: 0.7,
                        tessellation: 6
                    }, scene);
                    cannon.parent = root;
                    cannon.position.set(cx, cy, cz);
                    cannon.rotation.x = Math.PI / 2;
                    cannon.rotation.z = cx > 0 ? -0.15 : 0.15;
                    cannon.material = cannonMat;
                    cannon.receiveShadows = true;
                });

                return { root, hull, bow, stern };
            }

            // ────────────────────────────────────
            // GAME STATE
            // ────────────────────────────────────
            const friendlyShips = [];
            const enemyShips = [];
            const cannonballs = [];
            const particles = [];
            let selectedShipIndex = 0;
            let gold = 50;
            let wave = 1;
            let islandHP = 100;
            let maxIslandHP = 100;
            let waveActive = false;
            let enemiesRemaining = 0;
            let enemiesSpawnedThisWave = 0;
            let waveEnemyCount = 0;
            let waveSpawnTimer = 0;
            let waveSpawnInterval = 3.5;
            let betweenWaves = true;
            let gameOver = false;

            const shipUpgrades = [
                { damage: 1, fireRate: 1, speed: 1 },
                { damage: 1, fireRate: 1, speed: 1 },
                { damage: 1, fireRate: 1, speed: 1 }
            ];

            function getUpgradeCost(level) {
                return 50 * level * level;
            }

            // ────────────────────────────────────
            // CREATE FRIENDLY SHIPS
            // ────────────────────────────────────
            const friendlyStartPositions = [
                { x: 16, z: 0, angle: Math.PI / 2 },
                { x: -8, z: 14, angle: -Math.PI * 0.65 },
                { x: -8, z: -14, angle: Math.PI * 0.65 },
            ];
            const friendlySailMats = [sailWhite, sailCream, sailLight];

            friendlyStartPositions.forEach((pos, i) => {
                const shipData = createShipMesh(friendlySailMats[i]);
                shipData.root.position.set(pos.x, 0.15, pos.z);
                shipData.root.rotation.y = pos.angle;
                const marker = BABYLON.MeshBuilder.CreateTorus("marker", {
                    diameter: 2.8,
                    thickness: 0.2,
                    tessellation: 20
                }, scene);
                marker.parent = shipData.root;
                marker.position.y = 0.15;
                marker.material = markerMat;
                marker.isVisible = (i === 0);
                marker.rotation.x = Math.PI / 2;

                const shipObj = {
                    root: shipData.root,
                    hull: shipData.hull,
                    sailMat: friendlySailMats[i],
                    marker: marker,
                    speed: 0,
                    maxSpeed: 8,
                    rotationSpeed: 1.8,
                    health: 100,
                    maxHealth: 100,
                    damage: 15,
                    fireRate: 1.5,
                    fireCooldown: 0,
                    isEnemy: false,
                    alive: true,
                    index: i,
                    targetEnemy: null,
                };
                friendlyShips.push(shipObj);
            });

            // ────────────────────────────────────
            // HELPER: get forward direction
            // ────────────────────────────────────
            function getForward(ship) {
                const angle = ship.root.rotation.y;
                return new BABYLON.Vector3(Math.sin(angle), 0, Math.cos(angle));
            }

            function getRight(ship) {
                const angle = ship.root.rotation.y;
                return new BABYLON.Vector3(Math.cos(angle), 0, -Math.sin(angle));
            }

            // ────────────────────────────────────
            // CANNONBALL SYSTEM
            // ────────────────────────────────────
            function fireCannonball(ship, targetPos) {
                const forward = getForward(ship);
                const right = getRight(ship);
                const side = Math.random() < 0.5 ? 1 : -1;
                const spawnPos = ship.root.position.clone();
                spawnPos.y += 0.7;
                spawnPos.addInPlace(right.scale(side * 1.2));
                spawnPos.addInPlace(forward.scale(1.5));

                const dir = targetPos.subtract(spawnPos).normalize();
                if (dir.length() < 0.01) return;
                const speed = 22;
                const vel = dir.scale(speed);
                vel.y += 1.5;

                const ball = BABYLON.MeshBuilder.CreateSphere("cball", {
                    diameter: 0.35,
                    segments: 6
                }, scene);
                ball.position.copyFrom(spawnPos);
                const ballMat = new BABYLON.StandardMaterial("cballMat", scene);
                ballMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.22);
                ballMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                ballMat.roughness = 0.3;
                ball.material = ballMat;

                cannonballs.push({
                    mesh: ball,
                    velocity: vel,
                    damage: ship.damage,
                    isEnemy: ship.isEnemy,
                    source: ship,
                    lifetime: 4.0,
                    material: ballMat,
                });
            }

            function spawnExplosion(position, count = 8) {
                for (let i = 0; i < count; i++) {
                    const spark = BABYLON.MeshBuilder.CreateSphere("spark", {
                        diameter: 0.15 + Math.random() * 0.25,
                        segments: 4
                    }, scene);
                    spark.position.copyFrom(position);
                    const vel = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 10,
                        Math.random() * 8 + 3,
                        (Math.random() - 0.5) * 10
                    );
                    const sparkMat = new BABYLON.StandardMaterial("sparkMat", scene);
                    sparkMat.diffuseColor = new BABYLON.Color3(1, 0.6 + Math.random() * 0.3, 0.1 + Math.random() *
                        0.2);
                    sparkMat.emissiveColor = new BABYLON.Color3(0.8, 0.4, 0.05);
                    sparkMat.roughness = 0.3;
                    spark.material = sparkMat;
                    particles.push({
                        mesh: spark,
                        velocity: vel,
                        lifetime: 0.55 + Math.random() * 0.5,
                        material: sparkMat,
                    });
                }
            }

            // ────────────────────────────────────
            // SPAWN ENEMY SHIP
            // ────────────────────────────────────
            function spawnEnemyShip() {
                const angle = Math.random() * Math.PI * 2;
                const spawnDist = 65 + Math.random() * 20;
                const sx = Math.cos(angle) * spawnDist;
                const sz = Math.sin(angle) * spawnDist;
                const shipData = createShipMesh(sailEnemy, woodDarkMat);
                shipData.root.position.set(sx, 0.15, sz);
                const dirToIsland = new BABYLON.Vector3(-sx, 0, -sz).normalize();
                shipData.root.rotation.y = Math.atan2(dirToIsland.x, dirToIsland.z);

                const hp = 20 + wave * 18 + Math.floor(Math.random() * 15);
                const spd = 4.5 + wave * 0.6 + Math.random() * 2;
                const enemyObj = {
                    root: shipData.root,
                    hull: shipData.hull,
                    sailMat: sailEnemy,
                    marker: null,
                    speed: spd,
                    maxSpeed: spd,
                    rotationSpeed: 0.9,
                    health: hp,
                    maxHealth: hp,
                    damage: 10 + wave * 4,
                    fireRate: 2.8 - wave * 0.1,
                    fireCooldown: Math.random() * 2,
                    isEnemy: true,
                    alive: true,
                    index: -1,
                    targetEnemy: null,
                };
                enemyShips.push(enemyObj);
                enemiesSpawnedThisWave++;
                enemiesRemaining++;
                return enemyObj;
            }

            // ────────────────────────────────────
            // DAMAGE FUNCTIONS
            // ────────────────────────────────────
            function damageShip(ship, amount) {
                if (!ship.alive) return;
                ship.health -= amount;
                if (ship.health <= 0) {
                    ship.health = 0;
                    destroyShip(ship);
                }
            }

            function destroyShip(ship) {
                ship.alive = false;
                spawnExplosion(ship.root.position.clone(), 14);
                // Sink animation
                const sinkY = ship.root.position.y - 4;
                const sinkTimer = { t: 0, startY: ship.root.position.y, endY: sinkY, ship: ship };
                const observer = scene.onBeforeRenderObservable.add(() => {
                    sinkTimer.t += engine.getDeltaTime() / 1000;
                    const progress = Math.min(1, sinkTimer.t / 1.2);
                    if (ship.root && !ship.root.isDisposed()) {
                        ship.root.position.y = sinkTimer.startY + (sinkTimer.endY - sinkTimer.startY) *
                            progress;
                    }
                    if (progress >= 1) {
                        scene.onBeforeRenderObservable.remove(observer);
                        if (ship.root && !ship.root.isDisposed()) {
                            ship.root.dispose();
                        }
                    }
                });
                if (ship.isEnemy) {
                    enemiesRemaining--;
                    const reward = 25 + Math.floor(Math.random() * 35) + wave * 5;
                    gold += reward;
                    showToast("+ " + reward + " Gold!");
                    // Remove from enemy array
                    const idx = enemyShips.indexOf(ship);
                    if (idx >= 0) enemyShips.splice(idx, 1);
                } else {
                    // Remove from friendly array (will respawn between waves)
                    const idx = friendlyShips.indexOf(ship);
                    if (idx >= 0) {
                        friendlyShips.splice(idx, 1);
                        // Hide marker
                        if (ship.marker) ship.marker.isVisible = false;
                    }
                }
                updateUI();
            }

            function damageIsland(amount) {
                islandHP -= amount;
                if (islandHP <= 0) {
                    islandHP = 0;
                    gameOver = true;
                    waveActive = false;
                    betweenWaves = true;
                    showToast("💀 Island Destroyed! Game Over 💀");
                    document.getElementById('next-wave-btn').style.display = 'none';
                }
                updateUI();
                spawnExplosion(new BABYLON.Vector3(0, 3, 0), 10);
            }

            // ────────────────────────────────────
            // UI
            // ────────────────────────────────────
            function updateUI() {
                document.getElementById('island-hp-bar').style.width = Math.max(0, (islandHP / maxIslandHP) * 100) +
                    '%';
                document.getElementById('island-hp-text').textContent = Math.ceil(islandHP);
                document.getElementById('gold-display').textContent = '💰 ' + gold;
                document.getElementById('wave-display').textContent = '🌊 Wave ' + wave;
                document.getElementById('enemies-remaining').textContent = '⚔️ ' + Math.max(0, enemiesRemaining);

                // Ship buttons
                for (let i = 0; i < 3; i++) {
                    const btn = document.getElementById('ship-btn-' + i);
                    const ship = friendlyShips.find(s => s.index === i);
                    if (ship && ship.alive) {
                        btn.style.opacity = '1';
                        btn.style.borderColor = selectedShipIndex === i ? 'var(--gold)' : 'rgba(255,255,255,0.3)';
                        if (selectedShipIndex === i) btn.classList.add('selected');
                        else btn.classList.remove('selected');
                    } else {
                        btn.style.opacity = '0.4';
                        btn.classList.remove('selected');
                    }
                }

                // Upgrade buttons
                const selShip = friendlyShips.find(s => s.index === selectedShipIndex && s.alive);
                if (selShip) {
                    const ups = shipUpgrades[selectedShipIndex];
                    const dmgCost = getUpgradeCost(ups.damage);
                    const rateCost = getUpgradeCost(ups.fireRate);
                    const spdCost = getUpgradeCost(ups.speed);
                    document.getElementById('dmg-lvl').textContent = ups.damage;
                    document.getElementById('dmg-cost').textContent = dmgCost + 'g';
                    document.getElementById('rate-lvl').textContent = ups.fireRate;
                    document.getElementById('rate-cost').textContent = rateCost + 'g';
                    document.getElementById('spd-lvl').textContent = ups.speed;
                    document.getElementById('spd-cost').textContent = spdCost + 'g';
                    document.getElementById('upg-dmg').disabled = (gold < dmgCost || ups.damage >= 5);
                    document.getElementById('upg-rate').disabled = (gold < rateCost || ups.fireRate >= 5);
                    document.getElementById('upg-spd').disabled = (gold < spdCost || ups.speed >= 5);
                }
            }

            function showToast(msg) {
                const toast = document.getElementById('message-toast');
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            // ────────────────────────────────────
            // UPGRADE HANDLERS
            // ────────────────────────────────────
            document.getElementById('upg-dmg').addEventListener('click', () => {
                const ups = shipUpgrades[selectedShipIndex];
                const cost = getUpgradeCost(ups.damage);
                if (gold >= cost && ups.damage < 5) {
                    gold -= cost;
                    ups.damage++;
                    const ship = friendlyShips.find(s => s.index === selectedShipIndex && s.alive);
                    if (ship) ship.damage = 15 * Math.pow(1.5, ups.damage - 1);
                    updateUI();
                }
            });
            document.getElementById('upg-rate').addEventListener('click', () => {
                const ups = shipUpgrades[selectedShipIndex];
                const cost = getUpgradeCost(ups.fireRate);
                if (gold >= cost && ups.fireRate < 5) {
                    gold -= cost;
                    ups.fireRate++;
                    const ship = friendlyShips.find(s => s.index === selectedShipIndex && s.alive);
                    if (ship) ship.fireRate = 1.5 * Math.pow(0.78, ups.fireRate - 1);
                    updateUI();
                }
            });
            document.getElementById('upg-spd').addEventListener('click', () => {
                const ups = shipUpgrades[selectedShipIndex];
                const cost = getUpgradeCost(ups.speed);
                if (gold >= cost && ups.speed < 5) {
                    gold -= cost;
                    ups.speed++;
                    const ship = friendlyShips.find(s => s.index === selectedShipIndex && s.alive);
                    if (ship) ship.maxSpeed = 8 * Math.pow(1.3, ups.speed - 1);
                    updateUI();
                }
            });

            // Ship selection
            for (let i = 0; i < 3; i++) {
                document.getElementById('ship-btn-' + i).addEventListener('click', () => {
                    const ship = friendlyShips.find(s => s.index === i && s.alive);
                    if (ship) {
                        selectedShipIndex = i;
                        friendlyShips.forEach(s => {
                            if (s.marker) s.marker.isVisible = (s.index === i && s.alive);
                        });
                        updateUI();
                    }
                });
            }

            // Next wave button
            document.getElementById('next-wave-btn').addEventListener('click', () => {
                if (gameOver) {
                    restartGame();
                    return;
                }
                startNextWave();
            });

            function startNextWave() {
                if (gameOver) return;
                waveActive = true;
                betweenWaves = false;
                enemiesSpawnedThisWave = 0;
                waveEnemyCount = 2 + wave * 2;
                enemiesRemaining = waveEnemyCount;
                waveSpawnTimer = 1.5;
                waveSpawnInterval = Math.max(1.2, 3.5 - wave * 0.25);
                document.getElementById('next-wave-btn').style.display = 'none';
                // Respawn destroyed friendly ships
                for (let i = 0; i < 3; i++) {
                    const existing = friendlyShips.find(s => s.index === i);
                    if (!existing || !existing.alive) {
                        respawnFriendlyShip(i);
                    }
                }
                updateUI();
                showToast('⚔️ Wave ' + wave + ' Incoming! ⚔️');
            }

            function respawnFriendlyShip(index) {
                // Remove old dead one
                const oldIdx = friendlyShips.findIndex(s => s.index === index && !s.alive);
                if (oldIdx >= 0) {
                    const old = friendlyShips[oldIdx];
                    if (old.root && !old.root.isDisposed()) old.root.dispose();
                    friendlyShips.splice(oldIdx, 1);
                }
                const existing = friendlyShips.find(s => s.index === index);
                if (existing && existing.alive) return;

                const pos = friendlyStartPositions[index];
                const shipData = createShipMesh(friendlySailMats[index]);
                shipData.root.position.set(pos.x, 0.15, pos.z);
                shipData.root.rotation.y = pos.angle;
                const marker = BABYLON.MeshBuilder.CreateTorus("markerResp", {
                    diameter: 2.8,
                    thickness: 0.2,
                    tessellation: 20
                }, scene);
                marker.parent = shipData.root;
                marker.position.y = 0.15;
                marker.material = markerMat;
                marker.isVisible = (index === selectedShipIndex);
                marker.rotation.x = Math.PI / 2;

                const ups = shipUpgrades[index];
                const shipObj = {
                    root: shipData.root,
                    hull: shipData.hull,
                    sailMat: friendlySailMats[index],
                    marker: marker,
                    speed: 0,
                    maxSpeed: 8 * Math.pow(1.3, ups.speed - 1),
                    rotationSpeed: 1.8,
                    health: 100,
                    maxHealth: 100,
                    damage: 15 * Math.pow(1.5, ups.damage - 1),
                    fireRate: 1.5 * Math.pow(0.78, ups.fireRate - 1),
                    fireCooldown: 0,
                    isEnemy: false,
                    alive: true,
                    index: index,
                    targetEnemy: null,
                };
                friendlyShips.push(shipObj);
            }

            function restartGame() {
                // Clean up
                [...enemyShips].forEach(s => { if (s.root && !s.root.isDisposed()) s.root.dispose(); });
                enemyShips.length = 0;
                [...cannonballs].forEach(c => { if (c.mesh && !c.mesh.isDisposed()) c.mesh.dispose(); });
                cannonballs.length = 0;
                [...particles].forEach(p => { if (p.mesh && !p.mesh.isDisposed()) p.mesh.dispose(); });
                particles.length = 0;
                [...friendlyShips].forEach(s => { if (s.root && !s.root.isDisposed()) s.root.dispose(); });
                friendlyShips.length = 0;

                gold = 50;
                wave = 1;
                islandHP = 100;
                gameOver = false;
                waveActive = false;
                betweenWaves = true;
                enemiesRemaining = 0;
                shipUpgrades[0] = { damage: 1, fireRate: 1, speed: 1 };
                shipUpgrades[1] = { damage: 1, fireRate: 1, speed: 1 };
                shipUpgrades[2] = { damage: 1, fireRate: 1, speed: 1 };
                selectedShipIndex = 0;

                // Recreate friendly ships
                friendlyStartPositions.forEach((pos, i) => {
                    const shipData = createShipMesh(friendlySailMats[i]);
                    shipData.root.position.set(pos.x, 0.15, pos.z);
                    shipData.root.rotation.y = pos.angle;
                    const marker = BABYLON.MeshBuilder.CreateTorus("markerNew", {
                        diameter: 2.8,
                        thickness: 0.2,
                        tessellation: 20
                    }, scene);
                    marker.parent = shipData.root;
                    marker.position.y = 0.15;
                    marker.material = markerMat;
                    marker.isVisible = (i === 0);
                    marker.rotation.x = Math.PI / 2;
                    const shipObj = {
                        root: shipData.root,
                        hull: shipData.hull,
                        sailMat: friendlySailMats[i],
                        marker: marker,
                        speed: 0,
                        maxSpeed: 8,
                        rotationSpeed: 1.8,
                        health: 100,
                        maxHealth: 100,
                        damage: 15,
                        fireRate: 1.5,
                        fireCooldown: 0,
                        isEnemy: false,
                        alive: true,
                        index: i,
                        targetEnemy: null,
                    };
                    friendlyShips.push(shipObj);
                });

                document.getElementById('next-wave-btn').style.display = 'block';
                document.getElementById('next-wave-btn').textContent = '▶ Start Wave 1';
                updateUI();
                showToast('🔄 Game Restarted');
            }

            // ────────────────────────────────────
            // KEYBOARD INPUT
            // ────────────────────────────────────
            const keys = {};
            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === '1') selectShipByKey(0);
                if (e.key === '2') selectShipByKey(1);
                if (e.key === '3') selectShipByKey(2);
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    manualFire();
                }
            });
            window.addEventListener('keyup', e => {
                keys[e.key.toLowerCase()] = false;
            });

            function selectShipByKey(index) {
                const ship = friendlyShips.find(s => s.index === index && s.alive);
                if (ship) {
                    selectedShipIndex = index;
                    friendlyShips.forEach(s => {
                        if (s.marker) s.marker.isVisible = (s.index === index && s.alive);
                    });
                    updateUI();
                }
            }

            function manualFire() {
                const ship = friendlyShips.find(s => s.index === selectedShipIndex && s.alive);
                if (!ship || !waveActive) return;
                if (ship.fireCooldown > 0.15) return;
                const target = findNearestEnemy(ship);
                if (target) {
                    fireCannonball(ship, target.root.position.clone());
                    ship.fireCooldown = ship.fireRate;
                }
            }

            function findNearestEnemy(ship) {
                let nearest = null;
                let minDist = 35;
                for (const enemy of enemyShips) {
                    if (!enemy.alive) continue;
                    const dist = BABYLON.Vector3.Distance(ship.root.position, enemy.root.position);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = enemy;
                    }
                }
                return nearest;
            }

            // ────────────────────────────────────
            // GAME LOOP
            // ────────────────────────────────────
            scene.registerBeforeRender(() => {
                const dt = Math.min(engine.getDeltaTime() / 1000, 0.2);
                if (gameOver && waveActive) {
                    waveActive = false;
                    document.getElementById('next-wave-btn').style.display = 'block';
                    document.getElementById('next-wave-btn').textContent = '🔄 Restart';
                }

                // ── Wave spawning ────────────────
                if (waveActive && !gameOver) {
                    waveSpawnTimer -= dt;
                    if (waveSpawnTimer <= 0 && enemiesSpawnedThisWave < waveEnemyCount) {
                        spawnEnemyShip();
                        waveSpawnTimer = waveSpawnInterval;
                    }
                    // Check wave complete
                    if (enemiesSpawnedThisWave >= waveEnemyCount && enemyShips.length === 0 && enemiesRemaining <=
                        0) {
                        waveActive = false;
                        betweenWaves = true;
                        wave++;
                        document.getElementById('next-wave-btn').style.display = 'block';
                        document.getElementById('next-wave-btn').textContent = '▶ Next Wave (' + wave + ')';
                        showToast('🏆 Wave ' + (wave - 1) + ' Complete! Upgrade your ships!');
                        updateUI();
                    }
                }

                // ── Update selected ship (player control) ──
                const selShip = friendlyShips.find(s => s.index === selectedShipIndex && s.alive);
                if (selShip && waveActive && !gameOver) {
                    const ups = shipUpgrades[selectedShipIndex];
                    // Rotation
                    if (keys['a'] || keys['arrowleft']) selShip.root.rotation.y -= selShip.rotationSpeed * dt;
                    if (keys['d'] || keys['arrowright']) selShip.root.rotation.y += selShip.rotationSpeed * dt;
                    // Throttle
                    if (keys['w'] || keys['arrowup']) {
                        selShip.speed = Math.min(selShip.maxSpeed, selShip.speed + 4 * dt);
                    } else if (keys['s'] || keys['arrowdown']) {
                        selShip.speed = Math.max(-selShip.maxSpeed * 0.4, selShip.speed - 3 * dt);
                    } else {
                        selShip.speed *= (1 - 1.5 * dt);
                    }
                    // Move
                    const forward = getForward(selShip);
                    selShip.root.position.addInPlace(forward.scale(selShip.speed * dt));
                    // Keep above water
                    selShip.root.position.y = 0.15;
                    // Boundary: don't go too close to island
                    const distToIsland = Math.sqrt(selShip.root.position.x ** 2 + selShip.root.position.z ** 2);
                    if (distToIsland < 9.5 && distToIsland > 0.01) {
                        const pushDir = new BABYLON.Vector3(selShip.root.position.x, 0, selShip.root.position.z)
                            .normalize();
                        selShip.root.position.x += pushDir.x * (9.5 - distToIsland);
                        selShip.root.position.z += pushDir.z * (9.5 - distToIsland);
                        selShip.speed *= 0.5;
                    }
                    // Keep within world bounds
                    const worldDist = Math.sqrt(selShip.root.position.x ** 2 + selShip.root.position.z ** 2);
                    if (worldDist > 70) {
                        const pullDir = new BABYLON.Vector3(-selShip.root.position.x, 0, -selShip.root.position.z)
                            .normalize();
                        selShip.root.position.x += pullDir.x * (worldDist - 70);
                        selShip.root.position.z += pullDir.z * (worldDist - 70);
                    }
                }

                // ── Update all friendly ships ────
                for (const ship of friendlyShips) {
                    if (!ship.alive) continue;
                    // Auto-fire
                    ship.fireCooldown = Math.max(0, ship.fireCooldown - dt);
                    if (waveActive && ship.fireCooldown <= 0.01) {
                        const target = findNearestEnemy(ship);
                        if (target) {
                            const dist = BABYLON.Vector3.Distance(ship.root.position, target.root.position);
                            if (dist < 32) {
                                fireCannonball(ship, target.root.position.clone());
                                ship.fireCooldown = ship.fireRate;
                            }
                        }
                    }
                    // Non-selected ships: gentle patrol
                    if (ship.index !== selectedShipIndex && waveActive) {
                        const distToIsland = Math.sqrt(ship.root.position.x ** 2 + ship.root.position.z ** 2);
                        if (distToIsland > 22 || distToIsland < 10) {
                            const idealDist = 16;
                            const dir = new BABYLON.Vector3(ship.root.position.x, 0, ship.root.position.z)
                                .normalize();
                            if (distToIsland > idealDist) {
                                ship.root.position.x -= dir.x * 3 * dt;
                                ship.root.position.z -= dir.z * 3 * dt;
                            } else if (distToIsland < idealDist && distToIsland > 0.01) {
                                ship.root.position.x += dir.x * 3 * dt;
                                ship.root.position.z += dir.z * 3 * dt;
                            }
                            ship.root.position.y = 0.15;
                        }
                        // Slowly orbit
                        const orbitAngle = Math.atan2(ship.root.position.z, ship.root.position.x);
                        const orbitSpeed = 0.25;
                        const newAngle = orbitAngle + orbitSpeed * dt;
                        const orbitDist = Math.sqrt(ship.root.position.x ** 2 + ship.root.position.z ** 2);
                        const targetDist = 15 + ship.index * 3;
                        const lerpDist = orbitDist + (targetDist - orbitDist) * 0.3 * dt;
                        ship.root.position.x = Math.cos(newAngle) * lerpDist;
                        ship.root.position.z = Math.sin(newAngle) * lerpDist;
                        ship.root.position.y = 0.15;
                        // Face tangent
                        const tangent = new BABYLON.Vector3(-Math.sin(newAngle), 0, Math.cos(newAngle));
                        ship.root.rotation.y = Math.atan2(tangent.x, tangent.z);
                        ship.speed = 3;
                    }
                    // Update marker visibility
                    if (ship.marker) ship.marker.isVisible = (ship.index === selectedShipIndex && ship.alive);
                    // Keep above water
                    ship.root.position.y = 0.15;
                }

                // ── Update enemy ships ──────────
                for (const enemy of enemyShips) {
                    if (!enemy.alive) continue;
                    // Move toward island
                    const toIsland = new BABYLON.Vector3(-enemy.root.position.x, 0, -enemy.root.position.z);
                    const distToIsland = toIsland.length();
                    if (distToIsland > 0.5) {
                        toIsland.normalize();
                        enemy.root.position.addInPlace(toIsland.scale(enemy.speed * dt));
                        enemy.root.position.y = 0.15;
                        enemy.root.rotation.y = Math.atan2(toIsland.x, toIsland.z);
                    }
                    // Reached island?
                    if (distToIsland < 8.5) {
                        damageIsland(18 + wave * 5);
                        spawnExplosion(enemy.root.position.clone(), 8);
                        if (enemy.root && !enemy.root.isDisposed()) enemy.root.dispose();
                        enemy.alive = false;
                        enemiesRemaining--;
                        const idx = enemyShips.indexOf(enemy);
                        if (idx >= 0) enemyShips.splice(idx, 1);
                        updateUI();
                        continue;
                    }
                    // Enemy fires at nearby friendly ships
                    enemy.fireCooldown = Math.max(0, enemy.fireCooldown - dt);
                    if (enemy.fireCooldown <= 0.01 && waveActive) {
                        let nearestFriend = null;
                        let minFDist = 30;
                        for (const fs of friendlyShips) {
                            if (!fs.alive) continue;
                            const d = BABYLON.Vector3.Distance(enemy.root.position, fs.root.position);
                            if (d < minFDist) { minFDist = d;
                                nearestFriend = fs; }
                        }
                        if (nearestFriend && minFDist < 30) {
                            fireCannonball(enemy, nearestFriend.root.position.clone());
                            enemy.fireCooldown = enemy.fireRate;
                        }
                    }
                }

                // ── Update cannonballs ──────────
                for (let i = cannonballs.length - 1; i >= 0; i--) {
                    const cb = cannonballs[i];
                    cb.lifetime -= dt;
                    if (cb.lifetime <= 0 || !cb.mesh || cb.mesh.isDisposed()) {
                        if (cb.mesh && !cb.mesh.isDisposed()) cb.mesh.dispose();
                        if (cb.material && !cb.material.isDisposed()) cb.material.dispose();
                        cannonballs.splice(i, 1);
                        continue;
                    }
                    cb.mesh.position.addInPlace(cb.velocity.scale(dt));
                    cb.velocity.y -= 2 * dt;
                    // Check collision with ships
                    let hit = false;
                    const allShips = [...friendlyShips, ...enemyShips];
                    for (const ship of allShips) {
                        if (!ship.alive || ship === cb.source) continue;
                        if (cb.isEnemy && !ship.isEnemy || !cb.isEnemy && ship.isEnemy) {
                            const dist = BABYLON.Vector3.Distance(cb.mesh.position, ship.root.position);
                            if (dist < 2.8) {
                                damageShip(ship, cb.damage);
                                spawnExplosion(cb.mesh.position.clone(), 6);
                                cb.mesh.dispose();
                                cb.material.dispose();
                                cannonballs.splice(i, 1);
                                hit = true;
                                break;
                            }
                        }
                    }
                    if (hit) continue;
                    // Hit water
                    if (cb.mesh.position.y < 0.2) {
                        spawnExplosion(cb.mesh.position.clone(), 4);
                        cb.mesh.dispose();
                        cb.material.dispose();
                        cannonballs.splice(i, 1);
                    }
                }

                // ── Update particles ────────────
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.lifetime -= dt;
                    if (p.lifetime <= 0 || !p.mesh || p.mesh.isDisposed()) {
                        if (p.mesh && !p.mesh.isDisposed()) p.mesh.dispose();
                        if (p.material && !p.material.isDisposed()) p.material.dispose();
                        particles.splice(i, 1);
                        continue;
                    }
                    p.mesh.position.addInPlace(p.velocity.scale(dt));
                    p.velocity.y -= 8 * dt;
                    p.mesh.scaling.scaleInPlace(1 - 1.5 * dt);
                }

                // ── Water animation ─────────────
                const time = performance.now() * 0.001;
                water.position.y = Math.sin(time * 1.5) * 0.12;

                updateUI();
            });

            // ────────────────────────────────────
            // INITIAL SETUP
            // ────────────────────────────────────
            document.getElementById('next-wave-btn').style.display = 'block';
            document.getElementById('next-wave-btn').textContent = '▶ Start Wave 1';
            updateUI();
            showToast('🏴‍☠️ Pirate Island Defense! Select a ship & start the wave.');

            // ────────────────────────────────────
            // RENDER LOOP
            // ────────────────────────────────────
            engine.runRenderLoop(() => {
                scene.render();
            });

            // ────────────────────────────────────
            // RESIZE
            // ────────────────────────────────────
            window.addEventListener('resize', () => engine.resize());

            // ────────────────────────────────────
            // KEY R TO RESET CAMERA
            // ────────────────────────────────────
            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    camera.alpha = -Math.PI / 3;
                    camera.beta = Math.PI / 3.3;
                    camera.radius = 55;
                    camera.target.set(0, 2, 0);
                }
            });

            console.log('🏴‍☠️ Pirate Island Defense Ready!');
            console.log('   Keys 1-3: Select ship | WASD: Steer | Space: Fire');
            console.log('   🖱️ Drag to orbit | Scroll to zoom | R: Reset camera');
            console.log('   💰 Earn gold by destroying enemies | ⬆️ Upgrade between waves');
        })();
    </script>
</body>
</html>
