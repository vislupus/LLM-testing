<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚓ Pirate Island Defense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#c{width:100%;height:100%;display:block;outline:none}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;font-family:'Segoe UI',Tahoma,sans-serif;color:#fff}
#bars{position:absolute;top:12px;right:16px;display:flex;flex-direction:column;gap:7px}
.br{display:flex;align-items:center;gap:7px}
.bl{font-size:12px;font-weight:700;min-width:68px;text-shadow:1px 1px 3px #000}
.bb{width:170px;height:18px;background:rgba(0,0,0,.55);border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.bf{height:100%;border-radius:9px;transition:width .4s}
.bf.hp{background:linear-gradient(90deg,#b33,#e55)}
.bf.wv{background:linear-gradient(90deg,#38f,#5bf)}
.bv{font-size:11px;min-width:28px;text-align:right;text-shadow:1px 1px 2px #000}
#si{position:absolute;top:12px;left:16px;pointer-events:auto}
.sp{background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.15);border-radius:7px;padding:7px 11px;margin-bottom:5px;cursor:pointer;transition:.2s;min-width:175px}
.sp:hover{border-color:rgba(255,255,255,.35)}
.sp.sel{border-color:#fc0;background:rgba(255,200,0,.12)}
.st{font-weight:700;font-size:13px;margin-bottom:3px}
.ss{font-size:10px;opacity:.75;line-height:1.5}
#gd{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:700;color:#fc0;text-shadow:0 0 12px rgba(255,200,0,.4),2px 2px 4px #000;display:flex;align-items:center;gap:8px}
#bt{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:2px solid #fc0;border-radius:8px;padding:9px 22px;color:#fc0;font-size:15px;font-weight:700;cursor:pointer;pointer-events:auto;display:none;transition:.2s;text-transform:uppercase;letter-spacing:1px}
#bt:hover{background:rgba(255,200,0,.18);transform:translateX(-50%) scale(1.04)}
#ct{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.4;text-align:center}
#um{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,12,25,.93);border:2px solid #fc0;border-radius:13px;padding:22px 28px;display:none;pointer-events:auto;text-align:center;min-width:310px;backdrop-filter:blur(6px)}
#um h2{color:#fc0;margin-bottom:14px;font-size:21px}
.ub{display:block;width:100%;padding:9px 14px;margin-bottom:7px;background:rgba(255,200,0,.08);border:1px solid #fc0;border-radius:6px;color:#fff;font-size:13px;cursor:pointer;transition:.2s;text-align:left;font-family:inherit}
.ub:hover:not(:disabled){background:rgba(255,200,0,.22)}
.ub:disabled{opacity:.35;cursor:not-allowed}
.ub .co{float:right;color:#fc0;font-weight:700}
#go{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(8,0,0,.88);display:none;pointer-events:auto;flex-direction:column;align-items:center;justify-content:center}
#go h1{font-size:46px;color:#e33;margin-bottom:12px;text-shadow:0 0 20px rgba(255,0,0,.3)}
#go p{font-size:17px;margin-bottom:18px;opacity:.8}
#rb{padding:11px 30px;background:#c33;border:none;border-radius:7px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
#rb:hover{background:#e44;transform:scale(1.04)}
#df{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse,transparent 50%,rgba(255,0,0,.25));pointer-events:none;opacity:0;transition:opacity .25s}
#title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity 1.5s;z-index:10}
#title h1{font-size:42px;color:#fc0;text-shadow:0 0 30px rgba(255,200,0,.5),3px 3px 6px #000;margin-bottom:10px}
#title p{font-size:16px;opacity:.7;text-shadow:1px 1px 3px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
 <div id="bars">
  <div class="br"><span class="bl">🏝️ Island</span><div class="bb"><div class="bf hp" id="hpb" style="width:100%"></div></div><span class="bv" id="hpv">100</span></div>
  <div class="br"><span class="bl">🌊 Wave</span><div class="bb"><div class="bf wv" id="wpb" style="width:100%"></div></div><span class="bv" id="wpv">—</span></div>
 </div>
 <div id="si"></div>
 <div id="gd">💰 <span id="gv">0</span></div>
 <button id="bt" onclick="startWave()">⚔️ Start Wave 1</button>
 <div id="ct">WASD move · 1-3 select · Space fire · Scroll zoom</div>
 <div id="um"><h2>⚓ Between Waves</h2><div id="ul"></div><button id="ut" class="ub" onclick="startWave()" style="margin-top:6px;text-align:center">Next Wave →</button></div>
 <div id="go"><h1>☠️ Island Destroyed!</h1><p>You survived <span id="fw">0</span> waves with <span id="fg">0</span> gold</p><button id="rb" onclick="location.reload()">Play Again</button></div>
 <div id="df"></div>
 <div id="title"><h1>⚓ Pirate Island Defense ⚓</h1><p>Defend your island from enemy pirate ships!</p></div>
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
// ═══════════════════════════════════════
// PIRATE ISLAND DEFENSE — Single File Game
// ═══════════════════════════════════════

const C={
  islandHP:100,islandRadius:14,spawnR:190,despawnR:260,
  goldStart:150,goldKill:25,goldWave:50,
  hpMult:1.5,spdMult:1.1,
  cbSpeed:55,cbLife:2.2,
  uCost:[100,130,90],
  uAmt:[3,0.25,1.2]
};

let S={gold:C.goldStart,hp:C.islandHP,mhp:C.islandHP,wave:0,st:'ready',
  sel:0,time:0,enemies:[],cballs:[],ships:[],dmgFlash:0};
let scene,cam,waterU=0;

// ── Mesh helpers ──
function mt(n,c){const m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=c.clone?c.clone():new BABYLON.Color3(c[0],c[1],c[2]);return m}
function ap(p,n,s,pos,rot){
  let m;
  if(s.tp==='box')m=BABYLON.MeshBuilder.CreateBox(n,{width:s.w,height:s.h,depth:s.d},scene);
  else if(s.tp==='cyl')m=BABYLON.MeshBuilder.CreateCylinder(n,{diameterTop:s.dt||s.d,diameterBottom:s.db||s.d,height:s.h,tessellation:s.t||12},scene);
  else if(s.tp==='sph')m=BABYLON.MeshBuilder.CreateSphere(n,{diameter:s.d,segments:s.sg||10},scene);
  else m=BABYLON.MeshBuilder.CreateBox(n,{size:1},scene);
  m.position=pos.clone();
  if(rot)m.rotation=rot.clone();
  if(s.m){const mm=mt(n+'m',s.m);if(s.a!==undefined)mm.alpha=s.a;m.material=mm}
  m.parent=p;return m;
}

// ── Scene ──
function createScene(){
  scene=new BABYLON.Scene(engine);
  scene.clearColor=new BABYLON.Color3(.38,.62,.93);
  scene.collisionsEnabled=false;

  const hl=new BABYLON.HemisphericLight('hl',new BABYLON.Vector3(0,1,0),scene);
  hl.intensity=.75;hl.groundColor=new BABYLON.Color3(.25,.22,.18);
  const dl=new BABYLON.DirectionalLight('dl',new BABYLON.Vector3(-1,-3,-1),scene);
  dl.intensity=.55;dl.position=new BABYLON.Vector3(50,100,50);

  cam=new BABYLON.ArcRotateCamera('cam',-Math.PI/4,Math.PI/3.2,110,new BABYLON.Vector3(0,5,0),scene);
  cam.attachControl(document.getElementById('c'),true);
  cam.lowerRadiusLimit=40;cam.upperRadiusLimit=200;
  cam.lowerBetaLimit=.25;cam.upperBetaLimit=Math.PI/2.3;
  cam.wheelPrecision=12;cam.panningSensibility=0;

  mkWater();mkIsland();mkShips();mkUI();setupInput();
  return scene;
}

// ── Water ──
function mkWater(){
  BABYLON.Effect.ShadersStore.waterVS=`
    precision highp float;
    attribute vec3 position;attribute vec2 uv;
    uniform mat4 worldViewProjection;uniform float time;
    varying vec2 vUV;varying float vE;
    void main(){
      vUV=uv;
      float e=sin(position.x*.35+time*1.2)*sin(position.z*.35+time*.9)*1.1
             +sin(position.x*.12+position.z*.18+time*.6)*.7
             +sin(position.x*.65-time*1.6)*sin(position.z*.5+time*1.1)*.35;
      vec3 p=position;p.y+=e;vE=e;
      gl_Position=worldViewProjection*vec4(p,1.);
    }`;
  BABYLON.Effect.ShadersStore.waterFS=`
    precision highp float;
    varying vec2 vUV;varying float vE;uniform float time;
    void main(){
      vec3 d=vec3(0,.12,.32),m=vec3(0,.28,.5),f=vec3(.2,.5,.65);
      float t=clamp(vE*.3+.5,0.,1.);
      vec3 c=t<.5?mix(d,m,t*2.):mix(m,f,(t-.5)*2.);
      float sp=pow(max(0.,sin(vUV.x*18.+time*2.)*sin(vUV.y*18.+time*1.5)),10.)*.12;
      c+=sp+vec3(.015,.02,.01);
      gl_FragColor=vec4(c,1.);
    }`;
  const sm=new BABYLON.ShaderMaterial('wsm',scene,
    {vertexSource:BABYLON.Effect.ShadersStore.waterVS,fragmentSource:BABYLON.Effect.ShadersStore.waterFS},
    {attributes:['position','uv'],uniforms:['worldViewProjection','time']});
  sm.backFaceCulling=false;
  const w=BABYLON.MeshBuilder.CreateGround('water',{width:500,height:500,subdivisions:120},scene);
  w.position.y=-.4;w.material=sm;
  scene.registerBeforeRender(()=>{waterU+=engine.getDeltaTime()/1000;sm.setFloat('time',waterU)});
}

// ── Island ──
function mkIsland(){
  const g=new BABYLON.TransformNode('island',scene);
  const sa=mt('sand',[.91,.82,.57]),gr=mt('grass',[.2,.6,.15]),dk=mt('dkgr',[.14,.44,.1]),rc=mt('rock',[.4,.37,.33]);

  let m=BABYLON.MeshBuilder.CreateCylinder('isb',{diameterTop:C.islandRadius*2.1,diameterBottom:C.islandRadius*2.6,height:2.5,tessellation:36},scene);
  m.position.y=-.4;m.material=sa;m.parent=g;
  m=BABYLON.MeshBuilder.CreateCylinder('isg',{diameterTop:C.islandRadius*2,diameterBottom:C.islandRadius*2.1,height:1.6,tessellation:36},scene);
  m.position.y=.6;m.material=gr;m.parent=g;
  m=BABYLON.MeshBuilder.CreateCylinder('isc',{diameter:C.islandRadius*1.5,height:.3,tessellation:30},scene);
  m.position.y=1.5;m.material=dk;m.parent=g;

  for(let i=0;i<22;i++){
    const a=(i/22)*Math.PI*2+Math.random()*.28,d=C.islandRadius+.4+Math.random()*2;
    const r=BABYLON.MeshBuilder.CreateSphere('r'+i,{diameter:1+Math.random()*1.8,segments:5},scene);
    r.position=new BABYLON.Vector3(Math.cos(a)*d,.2+Math.random()*.4,Math.sin(a)*d);
    r.scaling.y=.4+Math.random()*.4;r.material=rc;r.parent=g;
  }

  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2+Math.random()*.6,d=2.5+Math.random()*(C.islandRadius-5);
    mkPalm(new BABYLON.Vector3(Math.cos(a)*d,1.7,Math.sin(a)*d),g);
  }

  const ch=new BABYLON.TransformNode('chest',scene);ch.parent=g;ch.position=new BABYLON.Vector3(4,2.2,-3);
  ap(ch,'cbb',{tp:'box',w:1.4,h:.7,d:.85,m:[.5,.3,.12]},new BABYLON.Vector3(0,0,0));
  ap(ch,'cbl',{tp:'box',w:1.4,h:.18,d:.85,m:[.85,.68,.15]},new BABYLON.Vector3(0,.44,0));
  ap(ch,'cbk',{tp:'box',w:.13,h:.22,d:.1,m:[.95,.85,.2]},new BABYLON.Vector3(0,.25,.43));
}

function mkPalm(pos,par){
  const p=new BABYLON.TransformNode('palm',scene);p.parent=par;
  const tk=mt('trk',[.45,.32,.16]),lv=mt('lf',[.12,.52,.08]);
  for(let i=0;i<7;i++){
    const s=.7+i*.018,o=Math.sin(i*.55)*1.3;
    const seg=BABYLON.MeshBuilder.CreateCylinder('ts'+i,{diameterTop:s*.82,diameterBottom:s,height:.95,tessellation:7},scene);
    seg.position=new BABYLON.Vector3(o,i*.95+.5,0);seg.rotation.z=-.18;seg.material=tk;seg.parent=p;
  }
  for(let i=0;i<7;i++){
    const a=(i/7)*Math.PI*2+Math.random()*.3;
    const l=BABYLON.MeshBuilder.CreateBox('lf'+i,{width:3.8,height:.12,distance:1.1},scene);
    l=BABYLON.MeshBuilder.CreateBox('lf'+i,{width:3.8,height:.12,depth:1.1},scene);
    l.position=new BABYLON.Vector3(Math.cos(a)*.9,7.2+Math.random()*.4,Math.sin(a)*.9);
    l.rotation=new BABYLON.Vector3(Math.random()*.4-.2,a,Math.PI/4+Math.random()*.25);
    l.material=lv;l.parent=p;
  }
  const cc=BABYLON.MeshBuilder.CreateSphere('cocos',{diameter:.55,segments:6},scene);
  cc.position.y=6.6;cc.material=mt('co',[.44,.28,.1]);cc.parent=p;
}

// ── Ship Config ──
const SC=[
  {n:'Royal Fortune',dmg:5,fr:1.5,spd:10,rng:65,cfr:0},
  {n:'Queen Anne',dmg:4,fr:1,spd:13,rng:55,cfr:0},
  {n:'Whydah',dmg:7,fr:2.2,spd:8,rng:75,cfr:0}
];

// ── Friendly Ships ──
function mkShips(){
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2-Math.PI/2,d=C.islandRadius+16;
    const p=new BABYLON.Vector3(Math.cos(a)*d,0,Math.sin(a)*d);
    const s=mkFShip(i,p);
    const rn=BABYLON.MeshBuilder.CreateTorus('sel'+i,{diameter:6.5,thickness:.22,tessellation:32},scene);
    rn.material=mt('srm'+i,[1,.84,0]);rn.material.emissiveColor=new BABYLON.Color3(.5,.42,0);rn.material.alpha=.45;
    rn.parent=s.mesh;rn.position.y=.15;s.ring=rn;rn.setEnabled(i===0);
    s.mesh.getChildMeshes().forEach(c=>{if(c.material)c.material.emissiveColor=new BABYLON.Color3(0,0,0)});
    S.ships.push(s);
  }
}

function mkFShip(idx,pos){
  const sc=SC[idx],h=new BABYLON.TransformNode('fs'+idx,scene);
  h.position=pos.clone();
  const w=mt('sw'+idx,[.38,.24,.1]),dc=mt('sd',[.55,.48,.32]),
    st=mt('ss',[.7,.2,.15]),sl=mt('sl',[.94,.9,.78]),
    mt2=mt('sm2',[.38,.28,.16]),cn=mt('sc',[.18,.18,.18]),fl=mt('sf',[.85,.1,.1]);

  ap(h,'hull',{tp:'box',w:3.2,h:1.8,d:7.5,m:[.38,.24,.1]},new BABYLON.Vector3(0,0,0));
  ap(h,'dk',{tp:'box',w:3,h:.22,d:7,m:[.55,.48,.32]},new BABYLON.Vector3(0,.98,0));
  ap(h,'cb',{tp:'box',w:2.2,h:1.3,d:2,m:[.33,.2,.08]},new BABYLON.Vector3(0,1.8,-2.3));
  ap(h,'rf',{tp:'box',w:1.6,h:.12,d:.9,m:[.75,.12,.1]},new BABYLON.Vector3(0,2.5,-2.3));
  for(let s=-1;s<=1;s+=2)
    ap(h,'str'+s,{tp:'box',w:.25,h:.75,d:7.5,m:[.7,.2,.15],a:.85},new BABYLON.Vector3(s*1.65,.35,0));
  ap(h,'mst',{tp:'cyl',d:.32,h:9.5,m:[.38,.28,.16]},new BABYLON.Vector3(0,5.5,.2));
  ap(h,'sl',{tp:'box',w:.08,h:6,d:3.8,m:[.94,.9,.78]},new BABYLON.Vector3(0,6.8,.2));
  ap(h,'fl',{tp:'box',w:1.2,h:.55,d:.04,m:[.85,.1,.1]},new BABYLON.Vector3(0,10.5,.2));
  ap(h,'bt',{tp:'sph',d:.85,sg:6,m:[.33,.2,.08]},new BABYLON.Vector3(0,.6,3.6));

  for(let si=-1;si<=1;si+=2)for(let ci=0;ci<3;ci++){
    ap(h,'cn'+si+ci,{tp:'cyl',d:.28,h:.75,dt:.2,db:.32,m:[.18,.18,.18],t:8},
      new BABYLON.Vector3(si*1.8,.45,-1.5+ci*2),new BABYLON.Vector3(0,0,Math.PI/2*si));
  }

  return{mesh:h,idx,sc,target:null,sel:true};
}

// ── Enemy Ships ──
function mkEnemy(hp,spd){
  const a=Math.random()*Math.PI*2,h=new BABYLON.TransformNode('en'+Date.now()+Math.random(),scene);
  h.position=new BABYLON.Vector3(Math.cos(a)*C.spawnR,0,Math.sin(a)*C.spawnR);
  const w=mt('ew'+Math.random(),[.25,.15,.06]),dk=mt('ed'+Math.random(),[.12,.12,.12]);

  ap(h,'eh',{tp:'box',w:2.8,h:1.5,d:6.5,m:[.25,.15,.06]},V3(0,0,0));
  ap(h,'es',{tp:'box',w:.22,h:.6,d:6.5,m:[.2,.06,.06],a:.85},V3(1.4,.25,0));
  ap(h,'es2',{tp:'box',w:.22,h:.6,d:6.5,m:[.2,.06,.06],a:.85},V3(-1.4,.25,0));
  ap(h,'ed',{tp:'box',w:2.6,h:.18,d:6,m:[.12,.12,.12]},V3(0,.82,0));
  ap(h,'em',{tp:'cyl',d:.25,h:7.5,m:[.22,.15,.08]},V3(0,4.3,0));
  ap(h,'ef',{tp:'box',w:.06,h:4.5,d:2.8,m:[.12,.06,.06]},V3(0,5.3,0));
  ap(h,'sk',{tp:'sph',d:.75,sg:6,m:[.9,.9,.9]},V3(0,7.8,0));
  ap(h,'eb',{tp:'sph',d:.75,sg:6,m:[.2,.12,.06]},V3(0,.45,3.2));

  h.scaling=new BABYLON.Vector3(.01,.01,.01);
  return{mesh:h,hp,mhp:hp,spd,alive:true,ft:0+Math.random()*2.5,age:0,tgt:null};
}

function V3(x,y,z){return new BABYLON.Vector3(x,y,z)}

// ── Targeting ──
function findTgt(ship){
  let best=null,bd=ship.sc.rng;
  for(const e of S.enemies){
    if(!e.alive)continue;
    const d=BABYLON.Vector3.Distance(ship.mesh.position,e.mesh.position);
    if(d<bd){bd=d;best=e}
  }
  return best;
}

// ── Cannonball ──
function fireAt(ship,tgt){
  const from=ship.mesh.position.clone();from.y=1.8;
  const to=tgt.mesh.position.clone();to.y=1;
  const dir=to.subtract(from).normalize();
  const b=BABYLON.MeshBuilder.CreateSphere('cb',{diameter:.45,segments:6},scene);
  b.position=from.clone();
  const m=mt('cbm'+Math.random(),[.08,.08,.08]);m.emissiveColor=new BABYLON.Color3(.35,.12,0);b.material=m;
  S.cballs.push({mesh:b,vel:dir.scale(C.cbSpeed),life:C.cbLife,dmg:ship.sc.dmg,src:'f'});
}

function fireEnemy(e){
  const from=e.mesh.position.clone();from.y=1.8;
  const dir=V3(0,0,0).subtract(from).normalize();
  const b=BABYLON.MeshBuilder.CreateSphere('ecb',{diameter:.4,segments:6},scene);
  b.position=from.clone();
  const m=mt('ecbm'+Math.random(),[.25,.08,.08]);m.emissiveColor=new BABYLON.Color3(.3,0,0);b.material=m;
  S.cballs.push({mesh:b,vel:dir.scale(30),life:3,dmg:2,src:'e'});
}

// ── Update Functions ──
function updFriendly(dt){
  const keys=scene._inputMap||{};
  for(const s of S.ships){
    const iv=V3(0,0,0);
    if(s.idx===S.sel){
      if(keys['KeyW']||keys['ArrowUp'])iv.z=1;
      if(keys['KeyS']||keys['ArrowDown'])iv.z=-1;
      if(keys['KeyA']||keys['ArrowLeft'])iv.x=-1;
      if(keys['KeyD']||keys['ArrowRight'])iv.x=1;
    }
    const spd=s.sc.spd,ml=iv.length();
    if(ml>.01){
      const nd=iv.normalize(),ta=Math.atan2(nd.x,nd.z);
      let df=ta-s.mesh.rotation.y;
      while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
      s.mesh.rotation.y+=df*Math.min(1,8*dt);
      s.mesh.position.x+=Math.sin(s.mesh.rotation.y)*spd*dt;
      s.mesh.position.z+=Math.cos(s.mesh.rotation.y)*spd*dt;
    }
    if(s.mesh.position.length()>C.spawnR*.7){
      s.mesh.position.normalize().scaleInPlace(C.spawnR*.7);
    }

    s.target=findTgt(s);
    s.ring.setEnabled(s.idx===S.sel);

    if(S.st==='playing'||S.st==='ready'){
      s.sc.cfr-=dt;
      if(s.target&&s.sc.cfr<=0){fireAt(s,s.target);s.sc.cfr=s.sc.fr}
    }
  }
}

function updEnemies(dt){
  for(const e of S.enemies){
    if(!e.alive)continue;
    e.age+=dt;
    if(e.age<1.2){const sc=Math.min(1,e.age/1);e.mesh.scaling.setAll(sc)}
    else e.mesh.scaling.setAll(1);

    let td=null,md=C.spawnR;
    for(const s of S.ships){const d=BABYLON.Vector3.Distance(e.mesh.position,s.mesh.position);if(d<md){md=d;td=s}}
    const tgt=td?td.mesh.position:V3(0,0,0);
    const dir=tgt.subtract(e.mesh.position);
    dir.y=0;const dist=dir.length();

    if(dist>1.5){
      const nd=dir.normalize(),ta=Math.atan2(nd.x,nd.z);
      let df=ta-e.mesh.rotation.y;
      while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
      e.mesh.rotation.y+=df*Math.min(1,3.5*dt);
      e.mesh.position.x+=Math.sin(e.mesh.rotation.y)*e.spd*dt;
      e.mesh.position.z+=Math.cos(e.mesh.rotation.y)*e.spd*dt;
    }

    const di=e.mesh.position.length();
    if(di<C.islandRadius+4){
      e.ft-=dt;
      if(e.ft<=0){S.hp=Math.max(0,S.hp-2);S.dmgFlash=.4;updHP();e.ft=2.5}
    }

    if(e.mesh.position.length()>C.despawnR)e.alive=false;
  }
  S.enemies=S.enemies.filter(e=>e.alive);
}

function updCballs(dt){
  for(const b of S.cballs){
    b.mesh.position.addInPlace(b.vel.scale(dt));
    b.life-=dt;
    if(b.src==='f'){
      for(const e of S.enemies){
        if(!e.alive)continue;
        if(BABYLON.Vector3.Distance(b.mesh.position,e.mesh.position)<2.8){
          e.hp-=b.dmg;b.life=0;
          if(e.hp<=0){e.alive=false;e.mesh.dispose();S.gold+=C.goldKill;updGold()}
          break;
        }
      }
    }
  }
  const dead=S.cballs.filter(b=>b.life<=0);
  dead.forEach(b=>b.mesh.dispose());
  S.cballs=S.cballs.filter(b=>b.life>0);
}

// ── Waves ──
function startWave(){
  if(S.st==='playing')return;
  S.wave++;S.st='playing';
  document.getElementById('um').style.display='none';
  document.getElementById('bt').style.display='none';

  const cnt=Math.max(2,Math.floor(3+S.wave*1.2));
  const hp=Math.floor(3+S.wave*C.hpMult);
  const spd=3+S.wave*C.spdMult*.3;
  const iv=Math.max(400,2200-S.wave*100);
  const wait=document.getElementById('bt');wait.textContent='⚔️ Wave '+S.wave;

  for(let i=0;i<cnt;i++){
    setTimeout(()=>{
      if(S.st==='playing')S.enemies.push(mkEnemy(hp,spd));
    },i*iv);
  }
  updUI();
}

function chkWave(){
  if(S.st!=='playing')return;
  if(S.enemies.length===0){
    S.st='upgrade';S.gold+=C.goldWave;updGold();showUpg();
  }
}

// ── UI ──
function mkUI(){
  const si=document.getElementById('si');si.innerHTML='';
  for(let i=0;i<3;i++){
    const d=document.createElement('div');
    d.className='sp'+(i===S.sel?' sel':'');d.id='sp'+i;
    d.onclick=()=>selShip(i);
    d.innerHTML=`<div class="st">${i+1}: ${SC[i].n}</div><div class="ss" id="ss${i}">DMG ${SC[i].dmg} · Rate ${SC[i].fr.toFixed(1)}s · SPD ${SC[i].spd}</div>`;
    si.appendChild(d);
  }
}

function selShip(i){S.sel=i;for(let j=0;j<3;j++)document.getElementById('sp'+j).className='sp'+(j===i?' sel':'')}
function updGold(){document.getElementById('gv').textContent=S.gold}
function updHP(){
  const p=Math.max(0,S.hp/S.mhp*100);
  document.getElementById('hpb').style.width=p+'%';
  document.getElementById('hpv').textContent=Math.ceil(S.hp);
  if(S.hp<=0)gameOver();
}
function updUI(){
  document.getElementById('wpv').textContent=S.wave||'—';
  for(let i=0;i<3;i++){
    document.getElementById('ss'+i).textContent=
      `DMG ${SC[i].dmg} · Rate ${SC[i].fr.toFixed(1)}s · SPD ${SC[i].spd.toFixed(0)}`;
  }
  updGold();
}

function showUpg(){
  const ul=document.getElementById('ul');
  const names=['💥 Cannon Damage','⏱️ Fire Rate','🚀 Move Speed'];
  const descs=['+3 damage per cannon','−0.25s reload time','+1.2 speed all ships'];
  ul.innerHTML='';
  for(let i=0;i<3;i++){
    const b=document.createElement('button');b.className='ub';
    b.disabled=S.gold<C.uCost[i];
    b.innerHTML=`${names[i]}<br><small>${descs[i]}</small><span class="co">💰${C.uCost[i]}</span>`;
    b.onclick=()=>buyUpg(i);ul.appendChild(b);
  }
  document.getElementById('ut').textContent='⚔️ Start Wave '+(S.wave+1);
  document.getElementById('um').style.display='block';
}

function buyUpg(i){
  if(S.gold<C.uCost[i])return;
  S.gold-=C.uCost[i];
  for(const s of S.ships){
    if(i===0)s.sc.dmg+=C.uAmt[0];
    else if(i===1)s.sc.fr=Math.max(.35,s.sc.fr-C.uAmt[1]);
    else s.sc.spd+=C.uAmt[2];
  }
  updGold();showUpg();updUI();
}

function gameOver(){
  S.st='over';
  document.getElementById('um').style.display='none';
  document.getElementById('go').style.display='flex';
  document.getElementById('fw').textContent=S.wave;
  document.getElementById('fg').textContent=S.gold;
}

// ── Input ──
function setupInput(){
  scene._inputMap={};
  scene.onKeyboardObservableProcessed=false;
  document.addEventListener('keydown',e=>{
    scene._inputMap[e.code]=true;
    if(e.key>='1'&&e.key<='3')selShip(parseInt(e.key)-1);
    if(e.code==='Space'&&S.st==='playing'){
      e.preventDefault();
      for(const s of S.ships){
        if(s.target){fireAt(s,s.target);s.sc.cfr=s.sc.fr*.5}
      }
    }
  });
  document.addEventListener('keyup',e=>{scene._inputMap[e.code]=false});

  scene.onPointerDown=()=>{
    const pk=scene.pick(scene.pointerX,scene.pointerY,m=>m.name.startsWith('fs')||m.parent?.name?.startsWith('fs'));
    if(pk.hit){
      const nm=pk.pickedMesh.name.startsWith('fs')?pk.pickedMesh.name:pk.pickedMesh.parent?.name;
      if(nm){const i=parseInt(nm.replace('fs',''));if(!isNaN(i))selShip(i)}
    }
  };
}

// ── Main ──
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true,{stencil:true,antialias:true});
scene=createScene();

scene.registerBeforeRender(()=>{
  const dt=Math.min(engine.getDeltaTime()/1000,.05);
  S.time+=dt;
  if(S.dmgFlash>0){
    S.dmgFlash-=dt;
    document.getElementById('df').style.opacity=Math.max(0,S.dmgFlash);
  }
  if(S.st!=='over'){updFriendly(dt);updEnemies(dt);updCballs(dt);chkWave()}
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());

setTimeout(()=>{const t=document.getElementById('title');t.style.opacity='0';setTimeout(()=>t.style.display='none',1600)},2500);
</script>
