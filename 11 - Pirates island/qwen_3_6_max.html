<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirate Island Defense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #renderCanvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }

  #topBar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px;
    background: linear-gradient(180deg, rgba(10,14,26,.92) 0%, rgba(10,14,26,.0) 100%);
    pointer-events: none;
  }
  #topBar > * { pointer-events: auto; }
  .stat {
    display: flex; align-items: center; gap: 6px;
    color: #c8daf0; font-size: 14px; font-weight: 600;
  }
  .stat .icon { font-size: 18px; }
  .stat .val { color: #ffd740; }
  .hp-bar-wrap {
    width: 200px; height: 14px; background: rgba(0,0,0,.5);
    border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,.15);
  }
  .hp-bar {
    height: 100%; background: linear-gradient(90deg, #e04040, #ff6060);
    border-radius: 7px; transition: width .3s;
  }

  #shipPanel {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; gap: 10px; align-items: flex-end;
  }
  .ship-card {
    background: rgba(10,14,26,.88); backdrop-filter: blur(10px);
    border: 2px solid rgba(100,160,255,.15); border-radius: 12px;
    padding: 12px 16px; color: #9ab; font-size: 11px;
    min-width: 140px; text-align: center; cursor: pointer;
    transition: border-color .2s, transform .15s;
  }
  .ship-card:hover { transform: translateY(-2px); }
  .ship-card.selected { border-color: #5a9fff; box-shadow: 0 0 16px rgba(90,159,255,.3); }
  .ship-card .ship-name { color: #7aafff; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .ship-card .ship-key {
    display: inline-block; background: rgba(90,159,255,.2); color: #5a9fff;
    border-radius: 4px; padding: 1px 6px; font-size: 10px; margin-bottom: 6px;
  }
  .ship-card .ship-hp-bar {
    width: 100%; height: 6px; background: rgba(255,255,255,.1);
    border-radius: 3px; overflow: hidden; margin-top: 4px;
  }
  .ship-card .ship-hp-fill {
    height: 100%; background: #4caf50; border-radius: 3px; transition: width .3s;
  }

  #upgradePanel {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
    z-index: 100; display: none; flex-direction: column; gap: 8px;
    background: rgba(10,14,26,.9); backdrop-filter: blur(12px);
    border: 1px solid rgba(100,160,255,.2); border-radius: 14px;
    padding: 16px; min-width: 200px;
  }
  #upgradePanel.visible { display: flex; }
  #upgradePanel h3 {
    color: #7aafff; font-size: 13px; text-align: center;
    border-bottom: 1px solid rgba(100,160,255,.15); padding-bottom: 8px;
    margin-bottom: 4px;
  }
  .upgrade-btn {
    background: rgba(90,159,255,.12); border: 1px solid rgba(90,159,255,.25);
    color: #c8daf0; border-radius: 8px; padding: 8px 12px;
    cursor: pointer; font-size: 11px; text-align: left;
    transition: background .2s;
  }
  .upgrade-btn:hover { background: rgba(90,159,255,.25); }
  .upgrade-btn:disabled { opacity: .4; cursor: not-allowed; }
  .upgrade-btn .cost { color: #ffd740; font-weight: 700; }
  .upgrade-btn .lvl { color: #7aafff; float: right; }

  #waveBanner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 200; color: #ffd740; font-size: 36px; font-weight: 800;
    text-shadow: 0 0 30px rgba(255,215,64,.5), 0 2px 8px rgba(0,0,0,.8);
    pointer-events: none; opacity: 0; transition: opacity .4s;
    letter-spacing: 2px;
  }
  #waveBanner.show { opacity: 1; }

  #gameOver {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.85); display: none;
    flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-size: 20px;
  }
  #gameOver.visible { display: flex; }
  #gameOver h1 { font-size: 48px; color: #e04040; margin-bottom: 12px; }
  #gameOver p { color: #9ab; margin-bottom: 24px; }
  #gameOver button {
    background: #5a9fff; border: none; color: #fff; padding: 12px 32px;
    border-radius: 8px; font-size: 16px; cursor: pointer;
  }

  #instructions {
    position: fixed; bottom: 100px; left: 16px; z-index: 100;
    background: rgba(10,14,26,.8); border-radius: 10px; padding: 12px 16px;
    color: #6a7a8a; font-size: 10px; line-height: 1.8; max-width: 200px;
  }
  #instructions kbd {
    background: rgba(90,159,255,.2); color: #5a9fff;
    border-radius: 3px; padding: 1px 5px; font-size: 10px;
  }

  #minimap {
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid rgba(100,160,255,.3);
    background: rgba(10,30,50,.7); overflow: hidden;
  }
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="topBar">
  <div class="stat"><span class="icon">💰</span> Gold: <span class="val" id="goldVal">0</span></div>
  <div class="stat">
    <span class="icon">🏝️</span> Island HP:
    <div class="hp-bar-wrap"><div class="hp-bar" id="islandHpBar" style="width:100%"></div></div>
    <span class="val" id="islandHpVal">100</span>
  </div>
  <div class="stat"><span class="icon">🌊</span> Wave: <span class="val" id="waveVal">1</span></div>
  <div class="stat"><span class="icon">💀</span> Kills: <span class="val" id="killsVal">0</span></div>
</div>

<div id="shipPanel"></div>

<div id="upgradePanel">
  <h3>⚓ Upgrades</h3>
  <button class="upgrade-btn" id="upgDamage" onclick="upgradeStat('damage')">
    🔥 Cannon Damage <span class="cost" id="costDamage">50g</span> <span class="lvl" id="lvlDamage">Lv1</span>
  </button>
  <button class="upgrade-btn" id="upgFireRate" onclick="upgradeStat('fireRate')">
    ⚡ Fire Rate <span class="cost" id="costFireRate">50g</span> <span class="lvl" id="lvlFireRate">Lv1</span>
  </button>
  <button class="upgrade-btn" id="upgSpeed" onclick="upgradeStat('speed')">
    🌊 Speed <span class="cost" id="costSpeed">50g</span> <span class="lvl" id="lvlSpeed">Lv1</span>
  </button>
  <button class="upgrade-btn" id="upgRange" onclick="upgradeStat('range')">
    🎯 Range <span class="cost" id="costRange">50g</span> <span class="lvl" id="lvlRange">Lv1</span>
  </button>
  <button class="upgrade-btn" id="upgRepair" onclick="upgradeStat('repair')">
    🔧 Repair Ship <span class="cost" id="costRepair">30g</span>
  </button>
</div>

<div id="waveBanner"></div>

<div id="gameOver">
  <h1>💀 Island Fallen!</h1>
  <p id="goStats">You survived 0 waves with 0 kills.</p>
  <button onclick="restartGame()">⚓ Try Again</button>
</div>

<div id="instructions">
  <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> Select ship<br>
  <kbd>Right Click</kbd> Move ship<br>
  <kbd>Space</kbd> Manual fire<br>
  <kbd>A</kbd> Auto-fire toggle<br>
  Ships auto-fire at nearest enemy in range.
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════ */
const ISLAND_RADIUS = 12;
const OCEAN_SIZE = 400;
const SPAWN_RADIUS = 120;
const SHIP_NAMES = ['Black Pearl','Revenge','Kraken'];
const SHIP_COLORS = [
  new BABYLON.Color3(.15,.1,.05),
  new BABYLON.Color3(.25,.12,.06),
  new BABYLON.Color3(.1,.08,.12)
];
const SAIL_COLORS = [
  new BABYLON.Color3(.9,.85,.7),
  new BABYLON.Color3(.85,.8,.65),
  new BABYLON.Color3(.7,.65,.8)
];
const ENEMY_COLOR = new BABYLON.Color3(.35,.08,.08);
const ENEMY_SAIL = new BABYLON.Color3(.5,.1,.1);

/* ═══════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════ */
let gold = 0, wave = 1, islandHP = 100, islandMaxHP = 100, kills = 0;
let gameOver = false, waveActive = false, waveTimer = 0;
let enemiesToSpawn = 0, spawnTimer = 0;
let selectedShip = 0;
let autoFire = true;

const friendlyShips = [];
const enemyShips = [];
const cannonballs = [];
const explosions = [];

/* ═══════════════════════════════════════════
   BABYLON SETUP
   ═══════════════════════════════════════════ */
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, { stencil: true });
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(.04,.08,.18,1);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = .003;
scene.fogColor = new BABYLON.Color3(.12,.2,.35);

const camera = new BABYLON.ArcRotateCamera('cam', -Math.PI/3, Math.PI/4, 80,
  new BABYLON.Vector3(0,0,0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 25;
camera.upperRadiusLimit = 200;
camera.upperBetaLimit = Math.PI/2.1;
camera.lowerBetaLimit = .2;
camera.wheelPrecision = 10;

const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0,1,0), scene);
hemi.intensity = .5;
hemi.diffuse = new BABYLON.Color3(.6,.7,.9);
hemi.groundColor = new BABYLON.Color3(.1,.15,.1);

const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-.5,-1,.3), scene);
sun.position = new BABYLON.Vector3(50,80,-30);
sun.intensity = 1.3;
sun.diffuse = new BABYLON.Color3(1,.95,.8);

const sg = new BABYLON.ShadowGenerator(1024, sun);
sg.useBlurExponentialShadowMap = true;
sg.blurKernel = 8;
sg.darkness = .3;

/* Sky */
const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
skyMat.backFaceCulling = false;
skyMat.disableLighting = true;
skyMat.emissiveColor = new BABYLON.Color3(.2,.35,.6);
const sky = BABYLON.MeshBuilder.CreateBox('sky', {size:600}, scene);
sky.material = skyMat;
sky.infiniteDistance = true;

/* Glow */
const glowLayer = new BABYLON.GlowLayer('glow', scene, {blurKernelSize:16, mainTextureFixedSize:256});
glowLayer.intensity = .2;

/* ═══════════════════════════════════════════
   MATERIALS
   ═══════════════════════════════════════════ */
function mat(name, diff, spec, emis, alp){
  const m = new BABYLON.StandardMaterial(name, scene);
  m.diffuseColor = diff || new BABYLON.Color3(.5,.5,.5);
  m.specularColor = spec || new BABYLON.Color3(.05,.05,.05);
  if(emis) m.emissiveColor = emis;
  if(alp !== undefined) m.alpha = alp;
  return m;
}

const M = {
  water: mat('water', new BABYLON.Color3(.08,.35,.45), new BABYLON.Color3(.3,.3,.35),
    new BABYLON.Color3(.03,.1,.12), .85),
  island: mat('island', new BABYLON.Color3(.35,.55,.15), new BABYLON.Color3(.02,.02,.02)),
  sand: mat('sand', new BABYLON.Color3(.75,.65,.45), new BABYLON.Color3(.03,.03,.03)),
  rock: mat('rock', new BABYLON.Color3(.35,.32,.28), new BABYLON.Color3(.03,.03,.03)),
  trunk: mat('trunk', new BABYLON.Color3(.35,.22,.1), new BABYLON.Color3(.02,.02,.02)),
  leaf: mat('leaf', new BABYLON.Color3(.15,.45,.1), new BABYLON.Color3(.02,.02,.02)),
  hull: mat('hull', new BABYLON.Color3(.15,.1,.05), new BABYLON.Color3(.03,.03,.03)),
  sail: mat('sail', new BABYLON.Color3(.9,.85,.7), new BABYLON.Color3(.02,.02,.02)),
  enemyHull: mat('enemyHull', new BABYLON.Color3(.35,.08,.08), new BABYLON.Color3(.03,.03,.03)),
  enemySail: mat('enemySail', new BABYLON.Color3(.5,.1,.1), new BABYLON.Color3(.02,.02,.02)),
  cannonball: mat('cannonball', new BABYLON.Color3(.2,.2,.2), new BABYLON.Color3(.1,.1,.1),
    new BABYLON.Color3(.1,.05,.02)),
  explosion: mat('explosion', new BABYLON.Color3(1,.5,.1), new BABYLON.Color3(.3,.3,.3),
    new BABYLON.Color3(.8,.3,.05), .8),
  flag: mat('flag', new BABYLON.Color3(.1,.1,.1), new BABYLON.Color3(.02,.02,.02),
    new BABYLON.Color3(.05,.05,.05)),
  enemyFlag: mat('enemyFlag', new BABYLON.Color3(.6,.05,.05), new BABYLON.Color3(.02,.02,.02),
    new BABYLON.Color3(.2,.02,.02)),
  selection: mat('selection', new BABYLON.Color3(.3,.6,1), new BABYLON.Color3(.2,.2,.2),
    new BABYLON.Color3(.3,.6,1), .4),
};

/* ═══════════════════════════════════════════
   OCEAN
   ═══════════════════════════════════════════ */
const water = BABYLON.MeshBuilder.CreateGround('water',
  {width: OCEAN_SIZE, height: OCEAN_SIZE, subdivisions: 64}, scene);
water.material = M.water;
water.position.y = -.2;
water.receiveShadows = true;

/* ═══════════════════════════════════════════
   ISLAND
   ═══════════════════════════════════════════ */
function createIsland(){
  // Main island body
  const island = BABYLON.MeshBuilder.CreateCylinder('island', {
    height: 4, diameterTop: ISLAND_RADIUS*1.6, diameterBottom: ISLAND_RADIUS*2,
    tessellation: 24
  }, scene);
  island.position.y = 1;
  island.material = M.island;
  island.receiveShadows = true;
  sg.addShadowCaster(island);

  // Sandy beach ring
  const beach = BABYLON.MeshBuilder.CreateCylinder('beach', {
    height: 1.5, diameterTop: ISLAND_RADIUS*2.1, diameterBottom: ISLAND_RADIUS*2.3,
    tessellation: 24
  }, scene);
  beach.position.y = -.25;
  beach.material = M.sand;
  beach.receiveShadows = true;

  // Island top (flat grass)
  const top = BABYLON.MeshBuilder.CreateCylinder('islandTop', {
    height: .3, diameterTop: ISLAND_RADIUS*1.55, diameterBottom: ISLAND_RADIUS*1.6,
    tessellation: 24
  }, scene);
  top.position.y = 3.1;
  top.material = M.island;
  top.receiveShadows = true;

  // Rocks
  const rockPositions = [
    [8,3.2,5],[-6,3.2,9],[10,3.2,-4],[-9,3.2,-7],[3,3.2,-10],
    [-3,3.2,11],[11,3.2,2],[-11,3.2,0]
  ];
  rockPositions.forEach((r,i) => {
    const rock = BABYLON.MeshBuilder.CreateSphere('rock'+i, {
      diameter: 1+Math.random()*1.5, segments: 6
    }, scene);
    rock.position.set(r[0], r[1], r[2]);
    rock.scaling.y = .6 + Math.random()*.3;
    rock.material = M.rock;
    sg.addShadowCaster(rock);
  });

  // Palm trees
  const palmPositions = [
    [4,3.2,3],[-5,3.2,4],[7,3.2,-2],[-3,3.2,-6],[0,3.2,8],
    [6,3.2,6],[-8,3.2,-3],[2,3.2,-8]
  ];
  palmPositions.forEach((p,i) => createPalm(p[0], p[1], p[2], i));

  // Treasure chest (decoration)
  const chest = BABYLON.MeshBuilder.CreateBox('chest', {width:1.2, height:.8, depth:.7}, scene);
  chest.position.set(0, 3.6, 0);
  chest.material = mat('chest', new BABYLON.Color3(.45,.28,.1), new BABYLON.Color3(.05,.05,.05));
  sg.addShadowCaster(chest);
  const chestLid = BABYLON.MeshBuilder.CreateBox('chestLid', {width:1.25, height:.3, depth:.75}, scene);
  chestLid.position.set(0, 4.15, 0);
  chestLid.material = chest.material;
  sg.addShadowCaster(chestLid);
  // Gold glow from chest
  const chestGlow = new BABYLON.PointLight('chestGlow', new BABYLON.Vector3(0,4,0), scene);
  chestGlow.diffuse = new BABYLON.Color3(1,.8,.3);
  chestGlow.intensity = .3;
  chestGlow.range = 8;
}

function createPalm(x, y, z, idx){
  const height = 5 + Math.random()*3;
  const lean = (Math.random()-.5)*.3;

  // Trunk
  const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk'+idx, {
    height: height, diameterTop: .2, diameterBottom: .4, tessellation: 6
  }, scene);
  trunk.position.set(x, y + height/2, z);
  trunk.rotation.z = lean;
  trunk.material = M.trunk;
  sg.addShadowCaster(trunk);

  // Leaves
  for(let i = 0; i < 5; i++){
    const angle = (i/5)*Math.PI*2 + Math.random()*.3;
    const leaf = BABYLON.MeshBuilder.CreatePlane('leaf'+idx+'_'+i, {width:3, height:1}, scene);
    leaf.position.set(
      x + Math.cos(angle)*1.5 + lean*height*.3,
      y + height - .5,
      z + Math.sin(angle)*1.5
    );
    leaf.rotation.y = angle;
    leaf.rotation.x = -.5 - Math.random()*.3;
    leaf.material = M.leaf;
    leaf.backFaceCulling = false;
  }
}

createIsland();

/* ═══════════════════════════════════════════
   SHIP CREATION
   ═══════════════════════════════════════════ */
function createShipMesh(name, hullColor, sailColor, flagColor, isEnemy){
  const root = new BABYLON.TransformNode(name, scene);

  // Hull
  const hull = BABYLON.MeshBuilder.CreateBox(name+'_hull', {
    width: 4, height: 1.2, depth: 1.5
  }, scene);
  hull.material = mat(name+'_hullMat', hullColor, new BABYLON.Color3(.03,.03,.03));
  hull.parent = root;
  hull.position.y = .6;
  sg.addShadowCaster(hull);

  // Hull bow (front taper)
  const bow = BABYLON.MeshBuilder.CreateCylinder(name+'_bow', {
    height: 1.5, diameterTop: 0, diameterBottom: 1.5, tessellation: 3
  }, scene);
  bow.rotation.z = Math.PI/2;
  bow.rotation.y = Math.PI/2;
  bow.position.set(2.5, .6, 0);
  bow.material = hull.material;
  bow.parent = root;
  sg.addShadowCaster(bow);

  // Deck
  const deck = BABYLON.MeshBuilder.CreateBox(name+'_deck', {
    width: 3.8, height: .15, depth: 1.4
  }, scene);
  deck.material = mat(name+'_deckMat', new BABYLON.Color3(.5,.35,.18), new BABYLON.Color3(.02,.02,.02));
  deck.parent = root;
  deck.position.y = 1.25;

  // Cabin
  const cabin = BABYLON.MeshBuilder.CreateBox(name+'_cabin', {
    width: 1.2, height: 1, depth: 1.2
  }, scene);
  cabin.material = hull.material;
  cabin.parent = root;
  cabin.position.set(-1.2, 1.8, 0);
  sg.addShadowCaster(cabin);

  // Mast
  const mast = BABYLON.MeshBuilder.CreateCylinder(name+'_mast', {
    height: 6, diameter: .15, tessellation: 6
  }, scene);
  mast.material = M.trunk;
  mast.parent = root;
  mast.position.set(.5, 4.2, 0);
  sg.addShadowCaster(mast);

  // Sail
  const sail = BABYLON.MeshBuilder.CreatePlane(name+'_sail', {width:2.5, height:3.5}, scene);
  sail.material = mat(name+'_sailMat', sailColor, new BABYLON.Color3(.02,.02,.02));
  sail.parent = root;
  sail.position.set(.5, 4.5, 0);
  sail.rotation.y = Math.PI/2;
  sail.backFaceCulling = false;

  // Flag
  const flag = BABYLON.MeshBuilder.CreatePlane(name+'_flag', {width:.8, height:.5}, scene);
  flag.material = mat(name+'_flagMat', flagColor, new BABYLON.Color3(.02,.02,.02));
  flag.parent = root;
  flag.position.set(.5, 7.3, 0);
  flag.rotation.y = Math.PI/2;
  flag.backFaceCulling = false;

  // Cannons (left and right)
  for(let side = -1; side <= 1; side += 2){
    for(let c = 0; c < 2; c++){
      const cannon = BABYLON.MeshBuilder.CreateCylinder(name+'_cannon'+side+c, {
        height: .6, diameter: .2, tessellation: 6
      }, scene);
      cannon.material = mat(name+'_cannonMat', new BABYLON.Color3(.25,.25,.25), new BABYLON.Color3(.15,.15,.15));
      cannon.parent = root;
      cannon.position.set(-.5 + c*1.2, .8, side*.85);
      cannon.rotation.x = Math.PI/2;
    }
  }

  // Selection ring
  const ring = BABYLON.MeshBuilder.CreateTorus(name+'_ring', {
    diameter: 5, thickness: .15, tessellation: 24
  }, scene);
  ring.material = M.selection;
  ring.parent = root;
  ring.position.y = .1;
  ring.isVisible = false;

  return { root, ring, hull };
}

/* ═══════════════════════════════════════════
   FRIENDLY SHIPS
   ═══════════════════════════════════════════ */
function initFriendlyShips(){
  const angles = [0, Math.PI*2/3, Math.PI*4/3];
  const dist = 25;

  for(let i = 0; i < 3; i++){
    const mesh = createShipMesh('friendly'+i, SHIP_COLORS[i], SAIL_COLORS[i],
      new BABYLON.Color3(.1,.3,.7), false);
    const x = Math.cos(angles[i]) * dist;
    const z = Math.sin(angles[i]) * dist;
    mesh.root.position.set(x, 0, z);
    mesh.root.rotation.y = -angles[i] + Math.PI/2;

    const ship = {
      index: i,
      name: SHIP_NAMES[i],
      mesh: mesh,
      x: x, z: z,
      rotation: -angles[i] + Math.PI/2,
      targetX: x, targetZ: z,
      speed: .08,
      maxHP: 100, hp: 100,
      damage: 15,
      fireRate: 2.0, // seconds between shots
      range: 35,
      lastFire: 0,
      autoFire: true,
      alive: true,
      // Upgrade levels
      lvlDamage: 1, lvlFireRate: 1, lvlSpeed: 1, lvlRange: 1
    };
    friendlyShips.push(ship);
  }
}

/* ═══════════════════════════════════════════
   ENEMY SHIPS
   ═══════════════════════════════════════════ */
function spawnEnemy(){
  const angle = Math.random() * Math.PI * 2;
  const x = Math.cos(angle) * SPAWN_RADIUS;
  const z = Math.sin(angle) * SPAWN_RADIUS;

  const mesh = createShipMesh('enemy'+enemyShips.length, ENEMY_COLOR, ENEMY_SAIL,
    new BABYLON.Color3(.6,.05,.05), true);
  mesh.root.position.set(x, 0, z);
  mesh.root.scaling.setScalar(.75);

  // Face island
  const dx = -x, dz = -z;
  mesh.root.rotation.y = Math.atan2(dx, dz);

  const enemy = {
    mesh: mesh,
    x: x, z: z,
    speed: .03 + wave * .005 + Math.random() * .015,
    hp: 30 + wave * 10,
    maxHP: 30 + wave * 10,
    damage: 5 + wave * 2,
    alive: true,
    lastAttack: 0
  };
  enemyShips.push(enemy);
}

/* ═══════════════════════════════════════════
   CANNONBALLS
   ═══════════════════════════════════════════ */
function fireCannonball(fromX, fromY, fromZ, targetX, targetZ, damage, isFriendly){
  const ball = BABYLON.MeshBuilder.CreateSphere('cb'+cannonballs.length, {
    diameter: .35, segments: 4
  }, scene);
  ball.position.set(fromX, fromY, fromZ);
  ball.material = M.cannonball;

  const dx = targetX - fromX;
  const dz = targetZ - fromZ;
  const dist = Math.sqrt(dx*dx + dz*dz);
  const speed = .8;
  const time = dist / speed;

  cannonballs.push({
    mesh: ball,
    vx: dx / time * speed * .016,
    vz: dz / time * speed * .016,
    startX: fromX, startZ: fromZ,
    targetX: targetX, targetZ: targetZ,
    damage: damage,
    isFriendly: isFriendly,
    distTotal: dist,
    distTraveled: 0,
    alive: true
  });
}

function createExplosion(x, y, z, scale){
  const exp = BABYLON.MeshBuilder.CreateSphere('exp'+explosions.length, {
    diameter: 2 * (scale||1), segments: 6
  }, scene);
  exp.position.set(x, y, z);
  exp.material = M.explosion;

  const light = new BABYLON.PointLight('expLight'+explosions.length,
    new BABYLON.Vector3(x, y+2, z), scene);
  light.diffuse = new BABYLON.Color3(1,.4,.1);
  light.intensity = 2;
  light.range = 10;

  explosions.push({
    mesh: exp, light: light,
    time: 0, maxTime: .6,
    alive: true
  });
}

/* ═══════════════════════════════════════════
   UI
   ═══════════════════════════════════════════ */
function buildShipPanel(){
  const panel = document.getElementById('shipPanel');
  panel.innerHTML = '';
  for(let i = 0; i < 3; i++){
    const s = friendlyShips[i];
    const card = document.createElement('div');
    card.className = 'ship-card' + (i === selectedShip ? ' selected' : '');
    card.id = 'shipCard'+i;
    card.onclick = () => selectShip(i);
    card.innerHTML = `
      <div class="ship-name">${s.name}</div>
      <span class="ship-key">${i+1}</span>
      <div style="color:#8a9ab0;font-size:10px;">
        DMG:${s.damage} SPD:${(s.speed*100).toFixed(0)} RNG:${s.range.toFixed(0)}
      </div>
      <div class="ship-hp-bar"><div class="ship-hp-fill" id="shipHp${i}"
        style="width:${(s.hp/s.maxHP*100)}%"></div></div>
    `;
    panel.appendChild(card);
  }
}

function selectShip(idx){
  selectedShip = idx;
  document.querySelectorAll('.ship-card').forEach((c,i) => {
    c.classList.toggle('selected', i === idx);
  });
  document.getElementById('upgradePanel').classList.add('visible');
  updateUpgradePanel();
}

function updateUpgradePanel(){
  const s = friendlyShips[selectedShip];
  if(!s) return;

  const costs = {
    damage: 30 + s.lvlDamage * 20,
    fireRate: 30 + s.lvlFireRate * 20,
    speed: 30 + s.lvlSpeed * 20,
    range: 30 + s.lvlRange * 20,
    repair: 30
  };

  document.getElementById('costDamage').textContent = costs.damage + 'g';
  document.getElementById('costFireRate').textContent = costs.fireRate + 'g';
  document.getElementById('costSpeed').textContent = costs.speed + 'g';
  document.getElementById('costRange').textContent = costs.range + 'g';
  document.getElementById('costRepair').textContent = costs.repair + 'g';

  document.getElementById('lvlDamage').textContent = 'Lv' + s.lvlDamage;
  document.getElementById('lvlFireRate').textContent = 'Lv' + s.lvlFireRate;
  document.getElementById('lvlSpeed').textContent = 'Lv' + s.lvlSpeed;
  document.getElementById('lvlRange').textContent = 'Lv' + s.lvlRange;

  document.getElementById('upgDamage').disabled = gold < costs.damage || s.lvlDamage >= 10;
  document.getElementById('upgFireRate').disabled = gold < costs.fireRate || s.lvlFireRate >= 10;
  document.getElementById('upgSpeed').disabled = gold < costs.speed || s.lvlSpeed >= 10;
  document.getElementById('upgRange').disabled = gold < costs.range || s.lvlRange >= 10;
  document.getElementById('upgRepair').disabled = gold < costs.repair || s.hp >= s.maxHP;
}

window.upgradeStat = function(stat){
  const s = friendlyShips[selectedShip];
  if(!s) return;

  const costs = {
    damage: 30 + s.lvlDamage * 20,
    fireRate: 30 + s.lvlFireRate * 20,
    speed: 30 + s.lvlSpeed * 20,
    range: 30 + s.lvlRange * 20,
    repair: 30
  };

  if(gold < costs[stat]) return;

  if(stat === 'damage' && s.lvlDamage < 10){
    gold -= costs.damage;
    s.damage += 8;
    s.lvlDamage++;
  } else if(stat === 'fireRate' && s.lvlFireRate < 10){
    gold -= costs.fireRate;
    s.fireRate = Math.max(.3, s.fireRate * .82);
    s.lvlFireRate++;
  } else if(stat === 'speed' && s.lvlSpeed < 10){
    gold -= costs.speed;
    s.speed += .015;
    s.lvlSpeed++;
  } else if(stat === 'range' && s.lvlRange < 10){
    gold -= costs.range;
    s.range += 5;
    s.lvlRange++;
  } else if(stat === 'repair'){
    gold -= costs.repair;
    s.hp = Math.min(s.maxHP, s.hp + 40);
  }

  updateUI();
  buildShipPanel();
  updateUpgradePanel();
};

function updateUI(){
  document.getElementById('goldVal').textContent = gold;
  document.getElementById('waveVal').textContent = wave;
  document.getElementById('killsVal').textContent = kills;
  document.getElementById('islandHpVal').textContent = Math.max(0, Math.round(islandHP));
  document.getElementById('islandHpBar').style.width = (islandHP/islandMaxHP*100) + '%';

  const hpBar = document.getElementById('islandHpBar');
  if(islandHP/islandMaxHP < .3) hpBar.style.background = 'linear-gradient(90deg,#e04040,#ff2020)';
  else if(islandHP/islandMaxHP < .6) hpBar.style.background = 'linear-gradient(90deg,#e08040,#ffa040)';
  else hpBar.style.background = 'linear-gradient(90deg,#4caf50,#66bb6a)';

  for(let i = 0; i < 3; i++){
    const fill = document.getElementById('shipHp'+i);
    if(fill){
      const s = friendlyShips[i];
      fill.style.width = (s.hp/s.maxHP*100) + '%';
      fill.style.background = s.hp/s.maxHP < .3 ? '#e04040' : s.hp/s.maxHP < .6 ? '#ffa040' : '#4caf50';
    }
  }
}

function showWaveBanner(text){
  const banner = document.getElementById('waveBanner');
  banner.textContent = text;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 2000);
}

/* ═══════════════════════════════════════════
   INPUT
   ═══════════════════════════════════════════ */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(e.key === '1') selectShip(0);
  if(e.key === '2') selectShip(1);
  if(e.key === '3') selectShip(2);
  if(e.key === ' '){
    e.preventDefault();
    manualFire();
  }
  if(e.key === 'a' || e.key === 'A'){
    const s = friendlyShips[selectedShip];
    if(s){ s.autoFire = !s.autoFire; }
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Right-click to move selected ship
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if(e.button === 2){
    // Right click - move ship
    const pickResult = scene.pick(e.clientX, e.clientY);
    if(pickResult.hit && pickResult.pickedPoint){
      const s = friendlyShips[selectedShip];
      if(s && s.alive){
        s.targetX = pickResult.pickedPoint.x;
        s.targetZ = pickResult.pickedPoint.z;

        // Show move indicator
        createMoveMarker(s.targetX, s.targetZ);
      }
    }
  }
});

function createMoveMarker(x, z){
  const marker = BABYLON.MeshBuilder.CreateTorus('moveMarker', {
    diameter: 2, thickness: .1, tessellation: 16
  }, scene);
  marker.position.set(x, .3, z);
  marker.material = M.selection;
  setTimeout(() => marker.dispose(), 1500);
}

function manualFire(){
  const s = friendlyShips[selectedShip];
  if(!s || !s.alive) return;

  // Find nearest enemy in range
  let nearest = null, nearDist = s.range;
  enemyShips.forEach(e => {
    if(!e.alive) return;
    const dx = e.x - s.x, dz = e.z - s.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    if(d < nearDist){ nearDist = d; nearest = e; }
  });

  if(nearest){
    fireCannonball(s.x, 1.5, s.z, nearest.x, nearest.z, s.damage, true);
    s.lastFire = performance.now() / 1000;
  }
}

/* ═══════════════════════════════════════════
   WAVE SYSTEM
   ═══════════════════════════════════════════ */
function startWave(){
  waveActive = true;
  enemiesToSpawn = 3 + wave * 2;
  spawnTimer = 0;
  showWaveBanner('🌊 Wave ' + wave);
}

function checkWaveComplete(){
  if(waveActive && enemiesToSpawn <= 0 && enemyShips.every(e => !e.alive)){
    waveActive = false;
    gold += 20 + wave * 10;
    showWaveBanner('✅ Wave Cleared! +' + (20 + wave * 10) + 'g');
    wave++;
    waveTimer = 0;
    updateUI();
  }
}

/* ═══════════════════════════════════════════
   GAME LOOP
   ═══════════════════════════════════════════ */
let lastTime = 0;

function gameLoop(){
  if(gameOver) return;

  const now = performance.now() / 1000;
  const dt = Math.min(now - (lastTime || now), .05);
  lastTime = now;

  // Wave management
  if(!waveActive){
    waveTimer += dt;
    if(waveTimer >= 5) startWave(); // 5 seconds between waves
  }

  // Spawn enemies
  if(waveActive && enemiesToSpawn > 0){
    spawnTimer += dt;
    if(spawnTimer >= 1.5){
      spawnTimer = 0;
      spawnEnemy();
      enemiesToSpawn--;
    }
  }

  // Update friendly ships
  friendlyShips.forEach(s => {
    if(!s.alive) return;

    // Move toward target
    const dx = s.targetX - s.x;
    const dz = s.targetZ - s.z;
    const dist = Math.sqrt(dx*dx + dz*dz);

    if(dist > 1){
      const moveSpeed = s.speed * dt * 60;
      s.x += (dx/dist) * Math.min(moveSpeed, dist);
      s.z += (dz/dist) * Math.min(moveSpeed, dist);

      // Rotate toward target
      const targetRot = Math.atan2(dx, dz);
      let rotDiff = targetRot - s.rotation;
      while(rotDiff > Math.PI) rotDiff -= Math.PI*2;
      while(rotDiff < -Math.PI) rotDiff += Math.PI*2;
      s.rotation += rotDiff * .05 * dt * 60;
    }

    // Keep ships above water
    s.mesh.root.position.set(s.x, 0, s.z);
    s.mesh.root.rotation.y = s.rotation;

    // Bobbing
    s.mesh.root.position.y = Math.sin(now * 1.5 + s.index * 2) * .15;
    s.mesh.root.rotation.z = Math.sin(now * 1.2 + s.index) * .03;
    s.mesh.root.rotation.x = Math.sin(now * .8 + s.index * 1.5) * .02;

    // Selection ring
    s.mesh.ring.isVisible = (friendlyShips.indexOf(s) === selectedShip);
    if(s.mesh.ring.isVisible){
      s.mesh.ring.rotation.y += dt * 2;
    }

    // Auto-fire
    if(s.autoFire){
      const timeSinceFire = now - s.lastFire;
      if(timeSinceFire >= s.fireRate){
        // Find nearest enemy in range
        let nearest = null, nearDist = s.range;
        enemyShips.forEach(e => {
          if(!e.alive) return;
          const edx = e.x - s.x, edz = e.z - s.z;
          const d = Math.sqrt(edx*edx + edz*edz);
          if(d < nearDist){ nearDist = d; nearest = e; }
        });

        if(nearest){
          fireCannonball(s.x, 1.5, s.z, nearest.x, nearest.z, s.damage, true);
          s.lastFire = now;
        }
      }
    }
  });

  // Update enemy ships
  enemyShips.forEach(e => {
    if(!e.alive) return;

    // Move toward island
    const dx = -e.x, dz = -e.z;
    const dist = Math.sqrt(dx*dx + dz*dz);

    if(dist > ISLAND_RADIUS + 2){
      const moveSpeed = e.speed * dt * 60;
      e.x += (dx/dist) * Math.min(moveSpeed, dist);
      e.z += (dz/dist) * Math.min(moveSpeed, dist);

      e.mesh.root.position.set(e.x, 0, e.z);
      e.mesh.root.rotation.y = Math.atan2(dx, dz);

      // Bobbing
      e.mesh.root.position.y = Math.sin(now * 1.3 + e.x * .1) * .12;
      e.mesh.root.rotation.z = Math.sin(now * 1.1 + e.z * .1) * .03;
    } else {
      // Enemy reached island - deal damage over time
      if(now - e.lastAttack > 1){
        e.lastAttack = now;
        islandHP -= e.damage;
        createExplosion(e.x + (Math.random()-.5)*3, 2, e.z + (Math.random()-.5)*3, .5);
        updateUI();

        if(islandHP <= 0){
          islandHP = 0;
          endGame();
        }
      }
    }
  });

  // Update cannonballs
  for(let i = cannonballs.length - 1; i >= 0; i--){
    const cb = cannonballs[i];
    if(!cb.alive) continue;

    cb.mesh.position.x += cb.vx;
    cb.mesh.position.z += cb.vz;

    // Arc trajectory
    const progress = cb.distTraveled / cb.distTotal;
    cb.mesh.position.y = 1.5 + Math.sin(progress * Math.PI) * 4;

    cb.distTraveled += Math.sqrt(cb.vx*cb.vx + cb.vz*cb.vz);

    // Check if reached target area
    if(cb.distTraveled >= cb.distTotal * .9){
      cb.alive = false;
      cb.mesh.dispose();

      // Check hit
      if(cb.isFriendly){
        // Hit nearest enemy to target
        let hitEnemy = null, hitDist = 5;
        enemyShips.forEach(e => {
          if(!e.alive) return;
          const edx = e.x - cb.targetX, edz = e.z - cb.targetZ;
          const d = Math.sqrt(edx*edx + edz*edz);
          if(d < hitDist){ hitDist = d; hitEnemy = e; }
        });

        if(hitEnemy){
          hitEnemy.hp -= cb.damage;
          createExplosion(hitEnemy.x, 1.5, hitEnemy.z, .8);

          if(hitEnemy.hp <= 0){
            hitEnemy.alive = false;
            hitEnemy.mesh.root.dispose();
            kills++;
            gold += 10 + wave * 3;
            updateUI();
          }
        } else {
          createExplosion(cb.targetX, .5, cb.targetZ, .4);
        }
      } else {
        // Enemy cannonball hit friendly ship
        let hitShip = null, hitDist = 5;
        friendlyShips.forEach(s => {
          if(!s.alive) return;
          const sdx = s.x - cb.targetX, sdz = s.z - cb.targetZ;
          const d = Math.sqrt(sdx*sdx + sdz*sdz);
          if(d < hitDist){ hitDist = d; hitShip = s; }
        });

        if(hitShip){
          hitShip.hp -= cb.damage;
          createExplosion(hitShip.x, 1.5, hitShip.z, .6);
          updateUI();

          if(hitShip.hp <= 0){
            hitShip.alive = false;
            hitShip.mesh.root.dispose();
          }
        }
      }
    }

    // Remove if too far
    if(cb.distTraveled > cb.distTotal * 1.5){
      cb.alive = false;
      cb.mesh.dispose();
    }
  }

  // Update explosions
  for(let i = explosions.length - 1; i >= 0; i--){
    const exp = explosions[i];
    if(!exp.alive) continue;

    exp.time += dt;
    const progress = exp.time / exp.maxTime;

    if(progress >= 1){
      exp.alive = false;
      exp.mesh.dispose();
      exp.light.dispose();
      explosions.splice(i, 1);
    } else {
      exp.mesh.scaling.setScalar(1 + progress * 2);
      exp.mesh.material.alpha = 1 - progress;
      exp.light.intensity = 2 * (1 - progress);
    }
  }

  // Clean up dead arrays periodically
  if(cannonballs.length > 100){
    for(let i = cannonballs.length - 1; i >= 0; i--){
      if(!cannonballs[i].alive) cannonballs.splice(i, 1);
    }
  }

  // Water animation
  M.water.diffuseColor.g = .35 + Math.sin(now * .5) * .03;
  M.water.diffuseColor.b = .45 + Math.sin(now * .7) * .03;

  // Check wave complete
  checkWaveComplete();
}

function endGame(){
  gameOver = true;
  document.getElementById('goStats').textContent =
    `You survived ${wave-1} waves with ${kills} kills and ${gold} gold.`;
  document.getElementById('gameOver').classList.add('visible');
}

window.restartGame = function(){
  // Dispose everything
  enemyShips.forEach(e => { if(e.mesh && e.mesh.root) e.mesh.root.dispose(); });
  friendlyShips.forEach(s => { if(s.mesh && s.mesh.root) s.mesh.root.dispose(); });
  cannonballs.forEach(cb => { if(cb.mesh) cb.mesh.dispose(); });
  explosions.forEach(exp => { if(exp.mesh) exp.mesh.dispose(); if(exp.light) exp.light.dispose(); });

  friendlyShips.length = 0;
  enemyShips.length = 0;
  cannonballs.length = 0;
  explosions.length = 0;

  gold = 0; wave = 1; islandHP = 100; kills = 0;
  gameOver = false; waveActive = false; waveTimer = 0;
  enemiesToSpawn = 0; spawnTimer = 0; selectedShip = 0;

  document.getElementById('gameOver').classList.remove('visible');

  initFriendlyShips();
  buildShipPanel();
  updateUI();
  selectShip(0);

  lastTime = 0;
};

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
initFriendlyShips();
buildShipPanel();
selectShip(0);
updateUI();
showWaveBanner('⚓ Prepare for Wave 1!');

engine.runRenderLoop(() => {
  gameLoop();
  scene.render();
});
window.addEventListener('resize', () => engine.resize());

})();
</script>
