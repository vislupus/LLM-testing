<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoClone Web Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .checkerboard {
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #333;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .layer-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none; /* Let the container handle mouse events */
        }

        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
        }

        .layer-item.active {
            background-color: #3f3f46;
            border-left: 3px solid #3b82f6;
        }
        
        input[type="range"] {
            accent-color: #3b82f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none">

    <!-- Top Menu Bar -->
    <header class="bg-neutral-900 border-b border-neutral-800 h-12 flex items-center px-4 justify-between z-20 shrink-0">
        <div class="flex items-center gap-4">
            <div class="font-bold text-lg flex items-center gap-2 text-blue-400">
                <i data-lucide="image"></i> PhotoClone
            </div>
            <div class="h-6 w-px bg-neutral-700"></div>
            <button id="btn-import" class="px-3 py-1 hover:bg-neutral-800 rounded text-sm flex items-center gap-2 transition-colors">
                <i data-lucide="upload" class="w-4 h-4"></i> Import
            </button>
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <button id="btn-export" class="px-3 py-1 hover:bg-neutral-800 rounded text-sm flex items-center gap-2 transition-colors">
                <i data-lucide="download" class="w-4 h-4"></i> Export
            </button>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-undo" class="p-1.5 hover:bg-neutral-800 rounded transition-colors disabled:opacity-30 disabled:hover:bg-transparent" title="Undo (Ctrl+Z)">
                <i data-lucide="undo" class="w-5 h-5"></i>
            </button>
            <button id="btn-redo" class="p-1.5 hover:bg-neutral-800 rounded transition-colors disabled:opacity-30 disabled:hover:bg-transparent" title="Redo (Ctrl+Y)">
                <i data-lucide="redo" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Left Toolbar -->
        <aside class="w-14 bg-neutral-900 border-r border-neutral-800 flex flex-col items-center py-2 gap-2 z-10 shrink-0">
            <button class="tool-btn active p-2 rounded-lg hover:bg-neutral-800 transition-colors" data-tool="brush" title="Brush Tool (B)">
                <i data-lucide="paintbrush" class="w-5 h-5"></i>
            </button>
            <button class="tool-btn p-2 rounded-lg hover:bg-neutral-800 transition-colors" data-tool="eraser" title="Eraser Tool (E)">
                <i data-lucide="eraser" class="w-5 h-5"></i>
            </button>
            <button class="tool-btn p-2 rounded-lg hover:bg-neutral-800 transition-colors" data-tool="picker" title="Color Picker (I)">
                <i data-lucide="pipette" class="w-5 h-5"></i>
            </button>
            <div class="w-8 h-px bg-neutral-700 my-1"></div>
            <div class="flex flex-col items-center gap-1">
                <input type="color" id="color-picker" value="#3b82f6" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0 p-0" title="Primary Color">
            </div>
            
            <div class="mt-auto mb-2 flex flex-col items-center gap-2 w-full px-1">
                <label class="text-[10px] text-neutral-400 font-bold uppercase tracking-wider">Size</label>
                <input type="range" id="brush-size" min="1" max="100" value="10" class="w-full h-1 bg-neutral-700 rounded-lg appearance-none cursor-pointer">
                <span id="brush-size-display" class="text-xs text-neutral-300">10px</span>
            </div>
        </aside>

        <!-- Center Canvas Area -->
        <main class="flex-1 bg-neutral-950 overflow-auto flex items-center justify-center relative" id="workspace">
            <div id="canvas-container" class="checkerboard" style="width: 800px; height: 600px;">
                <!-- Canvases will be injected here -->
            </div>
        </main>

        <!-- Right Sidebar (Layers & Properties) -->
        <aside class="w-64 bg-neutral-900 border-l border-neutral-800 flex flex-col z-10 shrink-0">
            
            <!-- Filters Panel -->
            <div class="h-1/3 border-b border-neutral-800 flex flex-col">
                <div class="px-4 py-2 bg-neutral-800/50 font-semibold text-xs uppercase tracking-wider text-neutral-400 border-b border-neutral-800">
                    Adjustments & Filters
                </div>
                <div class="p-4 flex-1 overflow-y-auto flex flex-col gap-3">
                    <button class="filter-btn w-full py-1.5 px-3 bg-neutral-800 hover:bg-neutral-700 rounded text-sm text-left transition-colors" data-filter="grayscale">Grayscale</button>
                    <button class="filter-btn w-full py-1.5 px-3 bg-neutral-800 hover:bg-neutral-700 rounded text-sm text-left transition-colors" data-filter="invert">Invert</button>
                    <button class="filter-btn w-full py-1.5 px-3 bg-neutral-800 hover:bg-neutral-700 rounded text-sm text-left transition-colors" data-filter="sepia">Sepia</button>
                    
                    <div class="mt-2">
                        <div class="flex justify-between text-xs mb-1">
                            <span>Brightness</span>
                        </div>
                        <input type="range" id="filter-brightness" min="-100" max="100" value="0" class="w-full h-1 bg-neutral-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Layers Panel -->
            <div class="flex-1 flex flex-col min-h-0">
                <div class="px-4 py-2 bg-neutral-800/50 font-semibold text-xs uppercase tracking-wider text-neutral-400 border-b border-neutral-800 flex justify-between items-center">
                    <span>Layers</span>
                    <div class="flex gap-1">
                        <button id="btn-add-layer" class="p-1 hover:bg-neutral-700 rounded text-neutral-300" title="New Layer">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                        <button id="btn-delete-layer" class="p-1 hover:bg-neutral-700 rounded text-red-400" title="Delete Layer">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Layer Settings -->
                <div class="p-3 border-b border-neutral-800 flex flex-col gap-2">
                    <div class="flex items-center gap-2">
                        <select id="layer-blend-mode" class="flex-1 bg-neutral-800 border border-neutral-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-blue-500">
                            <option value="normal">Normal</option>
                            <option value="multiply">Multiply</option>
                            <option value="screen">Screen</option>
                            <option value="overlay">Overlay</option>
                            <option value="darken">Darken</option>
                            <option value="lighten">Lighten</option>
                            <option value="color-dodge">Color Dodge</option>
                            <option value="color-burn">Color Burn</option>
                            <option value="difference">Difference</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-neutral-400 w-12">Opacity</span>
                        <input type="range" id="layer-opacity" min="0" max="100" value="100" class="flex-1 h-1 bg-neutral-700 rounded-lg appearance-none cursor-pointer">
                        <span id="layer-opacity-display" class="text-xs w-8 text-right">100%</span>
                    </div>
                </div>

                <!-- Layers List -->
                <div id="layers-list" class="flex-1 overflow-y-auto p-2 flex flex-col-reverse gap-1">
                    <!-- Layer items injected here -->
                </div>
                
                <!-- Layer Bottom Actions -->
                <div class="p-2 border-t border-neutral-800 flex justify-around">
                     <button id="btn-clear-layer" class="text-xs px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 rounded transition-colors text-neutral-300 w-full">
                        Clear Active Layer
                     </button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Constants & DOM Elements
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const container = document.getElementById('canvas-container');
        const layersListEl = document.getElementById('layers-list');
        
        // App State
        const state = {
            layers: [],
            activeLayerId: null,
            tool: 'brush', // brush, eraser, picker
            color: '#3b82f6',
            brushSize: 10,
            isDrawing: false,
            lastX: 0,
            lastY: 0,
            layerCounter: 0,
            
            // History State
            history: [],
            historyIndex: -1,
            maxHistory: 20
        };

        // ==========================================
        // HISTORY MANAGEMENT (Undo/Redo)
        // ==========================================
        function saveHistoryState() {
            // Remove future states if we are overwriting after an undo
            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }

            // Create a deep copy of layers (ImageData and properties)
            const snapshot = state.layers.map(layer => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = CANVAS_WIDTH;
                tempCanvas.height = CANVAS_HEIGHT;
                tempCanvas.getContext('2d').drawImage(layer.canvas, 0, 0);
                
                return {
                    id: layer.id,
                    name: layer.name,
                    visible: layer.visible,
                    opacity: layer.opacity,
                    blendMode: layer.blendMode,
                    imageDataCanvas: tempCanvas // Store as canvas for faster re-drawing than putImageData
                };
            });

            state.history.push({
                layers: snapshot,
                activeLayerId: state.activeLayerId
            });

            if (state.history.length > state.maxHistory) {
                state.history.shift();
            } else {
                state.historyIndex++;
            }
            updateHistoryButtons();
        }

        function restoreHistoryState(index) {
            if (index < 0 || index >= state.history.length) return;
            
            const snapshot = state.history[index];
            
            // Clear current layers
            container.innerHTML = '';
            state.layers = [];
            
            // Rebuild layers from snapshot
            snapshot.layers.forEach(layerSnap => {
                const canvas = document.createElement('canvas');
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                canvas.className = 'layer-canvas';
                canvas.id = `canvas-${layerSnap.id}`;
                canvas.style.opacity = layerSnap.opacity;
                canvas.style.mixBlendMode = layerSnap.blendMode;
                canvas.style.display = layerSnap.visible ? 'block' : 'none';
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(layerSnap.imageDataCanvas, 0, 0);
                
                container.appendChild(canvas);
                
                state.layers.push({
                    id: layerSnap.id,
                    name: layerSnap.name,
                    canvas: canvas,
                    ctx: ctx,
                    visible: layerSnap.visible,
                    opacity: layerSnap.opacity,
                    blendMode: layerSnap.blendMode
                });
                
                // Keep counter larger than any restored ID
                const idNum = parseInt(layerSnap.id.split('-')[1]);
                if (idNum >= state.layerCounter) state.layerCounter = idNum + 1;
            });

            state.activeLayerId = snapshot.activeLayerId;
            state.historyIndex = index;
            
            renderLayersList();
            updateHistoryButtons();
            updateLayerSettingsUI();
        }

        function updateHistoryButtons() {
            document.getElementById('btn-undo').disabled = state.historyIndex <= 0;
            document.getElementById('btn-redo').disabled = state.historyIndex >= state.history.length - 1;
        }

        document.getElementById('btn-undo').addEventListener('click', () => restoreHistoryState(state.historyIndex - 1));
        document.getElementById('btn-redo').addEventListener('click', () => restoreHistoryState(state.historyIndex + 1));

        // Keyboard shortcuts for Undo/Redo
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') {
                    e.preventDefault();
                    restoreHistoryState(state.historyIndex - 1);
                } else if (e.key === 'y') {
                    e.preventDefault();
                    restoreHistoryState(state.historyIndex + 1);
                }
            }
        });


        // ==========================================
        // LAYER MANAGEMENT
        // ==========================================
        function createLayer(name = null) {
            state.layerCounter++;
            const id = `layer-${state.layerCounter}`;
            
            const canvas = document.createElement('canvas');
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            canvas.className = 'layer-canvas';
            canvas.id = `canvas-${id}`;
            
            container.appendChild(canvas);

            const layerObj = {
                id: id,
                name: name || `Layer ${state.layerCounter}`,
                canvas: canvas,
                ctx: canvas.getContext('2d', { willReadFrequently: true }),
                visible: true,
                opacity: 1,
                blendMode: 'normal'
            };

            // If inserting, put above active layer. For simplicity, just push to top.
            state.layers.push(layerObj);
            state.activeLayerId = id;
            
            renderLayersList();
            updateLayerSettingsUI();
            saveHistoryState();
            return layerObj;
        }

        function deleteLayer() {
            if (state.layers.length <= 1) return; // Don't delete last layer
            
            const index = state.layers.findIndex(l => l.id === state.activeLayerId);
            if (index > -1) {
                const layer = state.layers[index];
                layer.canvas.remove();
                state.layers.splice(index, 1);
                
                // Select next available layer
                state.activeLayerId = state.layers[Math.max(0, index - 1)].id;
                renderLayersList();
                updateLayerSettingsUI();
                saveHistoryState();
            }
        }

        function getActiveLayer() {
            return state.layers.find(l => l.id === state.activeLayerId);
        }

        function renderLayersList() {
            layersListEl.innerHTML = '';
            
            state.layers.forEach((layer, index) => {
                const el = document.createElement('div');
                el.className = `layer-item flex items-center justify-between p-2 rounded cursor-pointer transition-colors ${layer.id === state.activeLayerId ? 'active' : 'hover:bg-neutral-800'}`;
                el.onclick = () => {
                    state.activeLayerId = layer.id;
                    renderLayersList();
                    updateLayerSettingsUI();
                };

                const leftGroup = document.createElement('div');
                leftGroup.className = 'flex items-center gap-2';
                
                const eyeBtn = document.createElement('button');
                eyeBtn.className = `text-neutral-400 hover:text-white transition-colors ${!layer.visible ? 'opacity-30' : ''}`;
                eyeBtn.innerHTML = `<i data-lucide="${layer.visible ? 'eye' : 'eye-off'}" class="w-4 h-4"></i>`;
                eyeBtn.onclick = (e) => {
                    e.stopPropagation();
                    layer.visible = !layer.visible;
                    layer.canvas.style.display = layer.visible ? 'block' : 'none';
                    renderLayersList();
                    saveHistoryState();
                };

                const nameSpan = document.createElement('span');
                nameSpan.className = 'text-sm text-neutral-200 truncate w-24';
                nameSpan.textContent = layer.name;
                nameSpan.ondblclick = (e) => {
                    e.stopPropagation();
                    const newName = prompt("Enter layer name:", layer.name);
                    if(newName) {
                        layer.name = newName;
                        renderLayersList();
                        saveHistoryState();
                    }
                }

                leftGroup.appendChild(eyeBtn);
                leftGroup.appendChild(nameSpan);

                const rightGroup = document.createElement('div');
                rightGroup.className = 'flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity';
                
                // Simple reorder arrows
                if(index < state.layers.length - 1) {
                    const upBtn = document.createElement('button');
                    upBtn.innerHTML = '<i data-lucide="chevron-up" class="w-4 h-4 text-neutral-400 hover:text-white"></i>';
                    upBtn.onclick = (e) => { e.stopPropagation(); reorderLayer(index, index + 1); };
                    rightGroup.appendChild(upBtn);
                }
                if(index > 0) {
                    const downBtn = document.createElement('button');
                    downBtn.innerHTML = '<i data-lucide="chevron-down" class="w-4 h-4 text-neutral-400 hover:text-white"></i>';
                    downBtn.onclick = (e) => { e.stopPropagation(); reorderLayer(index, index - 1); };
                    rightGroup.appendChild(downBtn);
                }

                el.classList.add('group');
                el.appendChild(leftGroup);
                el.appendChild(rightGroup);
                
                // Prepend because array is bottom-to-top, UI is top-to-bottom
                layersListEl.prepend(el);
            });
            lucide.createIcons();
        }

        function reorderLayer(oldIndex, newIndex) {
            const layer = state.layers.splice(oldIndex, 1)[0];
            state.layers.splice(newIndex, 0, layer);
            
            // Reorder DOM elements to match visual stacking
            state.layers.forEach(l => container.appendChild(l.canvas));
            
            renderLayersList();
            saveHistoryState();
        }

        function updateLayerSettingsUI() {
            const layer = getActiveLayer();
            if (!layer) return;
            
            document.getElementById('layer-opacity').value = layer.opacity * 100;
            document.getElementById('layer-opacity-display').textContent = `${Math.round(layer.opacity * 100)}%`;
            document.getElementById('layer-blend-mode').value = layer.blendMode;
        }

        // Layer event listeners
        document.getElementById('btn-add-layer').addEventListener('click', () => createLayer());
        document.getElementById('btn-delete-layer').addEventListener('click', deleteLayer);
        document.getElementById('btn-clear-layer').addEventListener('click', () => {
            const layer = getActiveLayer();
            if(layer) {
                layer.ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                saveHistoryState();
            }
        });

        document.getElementById('layer-opacity').addEventListener('input', (e) => {
            const layer = getActiveLayer();
            if (layer) {
                layer.opacity = e.target.value / 100;
                layer.canvas.style.opacity = layer.opacity;
                document.getElementById('layer-opacity-display').textContent = `${e.target.value}%`;
            }
        });
        document.getElementById('layer-opacity').addEventListener('change', saveHistoryState);

        document.getElementById('layer-blend-mode').addEventListener('change', (e) => {
            const layer = getActiveLayer();
            if (layer) {
                layer.blendMode = e.target.value;
                layer.canvas.style.mixBlendMode = layer.blendMode;
                saveHistoryState();
            }
        });


        // ==========================================
        // DRAWING LOGIC
        // ==========================================
        function getMousePos(evt) {
            const rect = container.getBoundingClientRect();
            // Assuming 1:1 scale for now, as container has fixed width/height
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
        }

        container.addEventListener('mousedown', (e) => {
            if (state.tool === 'picker') {
                pickColor(e);
                return;
            }

            const layer = getActiveLayer();
            if (!layer || !layer.visible) return;

            state.isDrawing = true;
            const pos = getMousePos(e);
            state.lastX = pos.x;
            state.lastY = pos.y;
            
            layer.ctx.lineJoin = 'round';
            layer.ctx.lineCap = 'round';
            layer.ctx.lineWidth = state.brushSize;
            
            if (state.tool === 'eraser') {
                layer.ctx.globalCompositeOperation = 'destination-out';
                layer.ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                layer.ctx.globalCompositeOperation = 'source-over';
                layer.ctx.strokeStyle = state.color;
            }

            // Draw a single dot if clicked
            layer.ctx.beginPath();
            layer.ctx.moveTo(state.lastX, state.lastY);
            layer.ctx.lineTo(state.lastX, state.lastY);
            layer.ctx.stroke();
        });

        container.addEventListener('mousemove', (e) => {
            if (!state.isDrawing) return;
            const layer = getActiveLayer();
            if (!layer) return;

            const pos = getMousePos(e);
            
            layer.ctx.beginPath();
            layer.ctx.moveTo(state.lastX, state.lastY);
            layer.ctx.lineTo(pos.x, pos.y);
            layer.ctx.stroke();
            
            state.lastX = pos.x;
            state.lastY = pos.y;
        });

        const stopDrawing = () => {
            if (state.isDrawing) {
                state.isDrawing = false;
                saveHistoryState();
            }
        };

        container.addEventListener('mouseup', stopDrawing);
        container.addEventListener('mouseleave', stopDrawing);

        function pickColor(e) {
            const pos = getMousePos(e);
            const x = Math.floor(pos.x);
            const y = Math.floor(pos.y);
            
            // To pick color from what user sees, we need to composite layers temporarily
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = CANVAS_WIDTH;
            tempCanvas.height = CANVAS_HEIGHT;
            const tCtx = tempCanvas.getContext('2d');
            
            // Fill white background first to avoid picking transparency as black
            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            state.layers.forEach(l => {
                if (l.visible) {
                    tCtx.globalAlpha = l.opacity;
                    tCtx.globalCompositeOperation = l.blendMode === 'normal' ? 'source-over' : l.blendMode;
                    tCtx.drawImage(l.canvas, 0, 0);
                }
            });
            
            const pixel = tCtx.getImageData(x, y, 1, 1).data;
            const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
            
            document.getElementById('color-picker').value = hex;
            state.color = hex;
            
            // Switch back to brush
            document.querySelector('[data-tool="brush"]').click();
        }

        // ==========================================
        // UI & TOOL BINDINGS
        // ==========================================
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');
                state.tool = target.dataset.tool;
            });
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            state.color = e.target.value;
        });

        document.getElementById('brush-size').addEventListener('input', (e) => {
            state.brushSize = parseInt(e.target.value);
            document.getElementById('brush-size-display').textContent = `${state.brushSize}px`;
        });

        // ==========================================
        // FILTERS
        // ==========================================
        function applyFilter(filterType, value = 0) {
            const layer = getActiveLayer();
            if (!layer) return;

            const imgData = layer.ctx.getImageData(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                // Skip fully transparent pixels
                if (data[i+3] === 0) continue;

                let r = data[i];
                let g = data[i+1];
                let b = data[i+2];

                if (filterType === 'grayscale') {
                    const avg = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    data[i] = data[i+1] = data[i+2] = avg;
                } 
                else if (filterType === 'invert') {
                    data[i] = 255 - r;
                    data[i+1] = 255 - g;
                    data[i+2] = 255 - b;
                }
                else if (filterType === 'sepia') {
                    data[i] = Math.min(255, (r * .393) + (g *.769) + (b * .189));
                    data[i+1] = Math.min(255, (r * .349) + (g *.686) + (b * .168));
                    data[i+2] = Math.min(255, (r * .272) + (g *.534) + (b * .131));
                }
                else if (filterType === 'brightness') {
                    data[i] = Math.min(255, Math.max(0, r + value));
                    data[i+1] = Math.min(255, Math.max(0, g + value));
                    data[i+2] = Math.min(255, Math.max(0, b + value));
                }
            }

            layer.ctx.putImageData(imgData, 0, 0);
            saveHistoryState();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                applyFilter(e.target.dataset.filter);
            });
        });

        let brightnessTimeout;
        document.getElementById('filter-brightness').addEventListener('change', (e) => {
            const val = parseInt(e.target.value);
            applyFilter('brightness', val);
            e.target.value = 0; // reset slider
        });

        // ==========================================
        // IMPORT / EXPORT
        // ==========================================
        document.getElementById('btn-import').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Create new layer for imported image
                    const layer = createLayer(file.name.split('.')[0]);
                    
                    // Draw image centered and scaled to fit
                    const scale = Math.min(CANVAS_WIDTH / img.width, CANVAS_HEIGHT / img.height);
                    const w = img.width * scale;
                    const h = img.height * scale;
                    const x = (CANVAS_WIDTH - w) / 2;
                    const y = (CANVAS_HEIGHT - h) / 2;
                    
                    layer.ctx.drawImage(img, x, y, w, h);
                    saveHistoryState();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // Reset input
        });

        document.getElementById('btn-export').addEventListener('click', () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = CANVAS_WIDTH;
            tempCanvas.height = CANVAS_HEIGHT;
            const tCtx = tempCanvas.getContext('2d');
            
            // Draw a white background first (optional, standard for jpegs, helpful for transparent pngs)
            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            state.layers.forEach(l => {
                if (l.visible) {
                    tCtx.globalAlpha = l.opacity;
                    tCtx.globalCompositeOperation = l.blendMode === 'normal' ? 'source-over' : l.blendMode;
                    tCtx.drawImage(l.canvas, 0, 0);
                }
            });

            const link = document.createElement('a');
            link.download = 'photoclone_export.png';
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        });

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            // Create initial Background layer
            const bgLayer = createLayer('Background');
            bgLayer.ctx.fillStyle = '#ffffff';
            bgLayer.ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Clear history and save first state
            state.history = [];
            state.historyIndex = -1;
            saveHistoryState();
        }

        // Start
        init();

    </script>
</body>
</html>
