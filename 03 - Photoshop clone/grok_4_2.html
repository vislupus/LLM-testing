<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoshop - Untitled.psd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600&display=swap');
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .tool-active { background-color: #3b82f6 !important; color: white; }
        .panel { background: #1f2937; }
        canvas { image-rendering: pixelated; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4); }
        .layer-item { transition: all 0.1s; }
        .layer-item.active { background: #3b82f6; }
        .history-item { cursor: pointer; }
        .history-item:hover { background: #374151; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 overflow-hidden h-screen flex flex-col">
    <!-- Top Menu Bar -->
    <div class="bg-zinc-900 border-b border-zinc-800 h-10 flex items-center px-4 text-sm">
        <div class="flex items-center gap-8 font-medium">
            <div class="flex items-center gap-2 text-blue-400">
                <i class="fa-solid fa-image text-2xl"></i>
                <span class="font-bold tracking-tighter">PHOTOSHOP</span>
            </div>
            <div onclick="showMenu(this)" class="cursor-pointer hover:text-white px-3 py-1">File</div>
            <div onclick="showMenu(this)" class="cursor-pointer hover:text-white px-3 py-1">Edit</div>
            <div onclick="showMenu(this)" class="cursor-pointer hover:text-white px-3 py-1">Image</div>
            <div onclick="showMenu(this)" class="cursor-pointer hover:text-white px-3 py-1">Layer</div>
            <div onclick="showMenu(this)" class="cursor-pointer hover:text-white px-3 py-1">Filter</div>
            <div onclick="showMenu(this)" class="cursor-pointer hover:text-white px-3 py-1">View</div>
        </div>
        <div class="flex-1"></div>
        <div class="text-xs text-zinc-400">Untitled.psd • 100% • RGB/8</div>
    </div>

    <!-- Toolbar + Options + Canvas -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Left Toolbar -->
        <div class="w-14 bg-zinc-900 border-r border-zinc-800 flex flex-col py-2 items-center gap-1 text-xl">
            <div onclick="selectTool(0)" id="tool0" class="tool w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded tool-active"><i class="fa-solid fa-arrow-pointer"></i></div>
            <div onclick="selectTool(1)" id="tool1" class="tool w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded"><i class="fa-solid fa-square"></i></div>
            <div onclick="selectTool(2)" id="tool2" class="tool w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded"><i class="fa-solid fa-paint-brush"></i></div>
            <div onclick="selectTool(3)" id="tool3" class="tool w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded"><i class="fa-solid fa-eraser"></i></div>
            <div onclick="selectTool(4)" id="tool4" class="tool w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded"><i class="fa-solid fa-fill-drip"></i></div>
            <div onclick="selectTool(5)" id="tool5" class="tool w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded"><i class="fa-solid fa-font"></i></div>
            <div onclick="selectTool(6)" id="tool6" class="tool w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded"><i class="fa-solid fa-eye-dropper"></i></div>
            <div class="h-px bg-zinc-700 my-2 w-8"></div>
            <div onclick="selectTool(7)" id="tool7" class="tool w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded"><i class="fa-solid fa-crop"></i></div>
            <div onclick="undo()" class="mt-auto w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded text-lg"><i class="fa-solid fa-rotate-left"></i></div>
            <div onclick="redo()" class="w-10 h-10 flex items-center justify-center hover:bg-zinc-800 rounded text-lg"><i class="fa-solid fa-rotate-right"></i></div>
        </div>

        <!-- Options Bar -->
        <div id="optionsBar" class="bg-zinc-900 border-r border-zinc-800 w-60 p-3 text-xs flex flex-col gap-4">
            <div class="flex items-center gap-3">
                <span class="text-zinc-400 w-12">Size</span>
                <input id="brushSize" type="range" min="1" max="200" value="25" class="flex-1" oninput="updateBrush()">
                <span id="sizeValue" class="tabular-nums w-8 text-right">25</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-zinc-400 w-12">Color</span>
                <input id="colorPicker" type="color" value="#ffffff" class="w-10 h-8 bg-transparent p-0 border-0 cursor-pointer" onchange="currentColor = this.value">
            </div>
            <div id="toolName" class="font-semibold text-blue-400">Brush Tool</div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-1 bg-[#0f172a] flex items-center justify-center overflow-auto p-12" id="canvasContainer">
            <div class="relative">
                <canvas id="displayCanvas" width="1024" height="768" class="bg-white"></canvas>
                <div id="canvasOverlay" class="absolute top-0 left-0 pointer-events-none"></div>
            </div>
        </div>

        <!-- Right Panels -->
        <div class="w-80 bg-zinc-900 border-l border-zinc-800 flex flex-col">
            <!-- Layers Panel -->
            <div class="flex-1 flex flex-col">
                <div class="bg-zinc-800 px-4 py-2 text-xs font-medium flex items-center justify-between">
                    <span>LAYERS</span>
                    <div class="flex gap-3">
                        <i onclick="addLayer()" class="fa-solid fa-plus cursor-pointer hover:text-white"></i>
                        <i onclick="deleteLayer()" class="fa-solid fa-trash cursor-pointer hover:text-white"></i>
                    </div>
                </div>
                <div id="layersList" class="flex-1 overflow-auto p-2 text-sm"></div>
                
                <!-- Layer Options -->
                <div class="bg-zinc-800 p-3 text-xs border-t border-zinc-700">
                    <select id="blendMode" onchange="changeBlendMode()" class="bg-zinc-900 w-full py-1 px-2 rounded text-white">
                        <option value="source-over">Normal</option>
                        <option value="multiply">Multiply</option>
                        <option value="screen">Screen</option>
                        <option value="overlay">Overlay</option>
                        <option value="darken">Darken</option>
                        <option value="lighten">Lighten</option>
                    </select>
                    <div class="flex items-center gap-2 mt-3">
                        <span class="text-zinc-400">Opacity</span>
                        <input id="layerOpacity" type="range" min="0" max="100" value="100" class="flex-1" oninput="changeOpacity()">
                        <span id="opacityValue" class="tabular-nums w-8 text-right">100%</span>
                    </div>
                </div>
            </div>

            <!-- History Panel -->
            <div class="h-72 border-t border-zinc-700 flex flex-col">
                <div class="bg-zinc-800 px-4 py-2 text-xs font-medium">HISTORY</div>
                <div id="historyList" class="flex-1 overflow-auto text-xs p-2"></div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="bg-zinc-900 border-t border-zinc-800 h-8 text-xs flex items-center px-4 text-zinc-400">
        <span id="status">Ready • 1024 × 768 px</span>
        <div class="flex-1"></div>
        <span onclick="savePNG()" class="cursor-pointer hover:text-white px-3">Save PNG</span>
        <span onclick="loadImage()" class="cursor-pointer hover:text-white px-3">Open Image</span>
    </div>

    <!-- Filter Modal -->
    <div id="filterModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center">
        <div class="bg-zinc-900 w-96 rounded-xl p-6">
            <h2 class="text-lg font-semibold mb-4">Filters</h2>
            <div class="space-y-6">
                <div>
                    <div class="flex justify-between text-xs mb-1"><span>Brightness</span><span id="brightVal">0</span></div>
                    <input type="range" id="brightSlider" min="-100" max="100" value="0" class="w-full" oninput="previewFilter()">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1"><span>Contrast</span><span id="contrastVal">0</span></div>
                    <input type="range" id="contrastSlider" min="-100" max="100" value="0" class="w-full" oninput="previewFilter()">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1"><span>Saturation</span><span id="satVal">0</span></div>
                    <input type="range" id="satSlider" min="-100" max="100" value="0" class="w-full" oninput="previewFilter()">
                </div>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="applyFilter();closeModal()" class="flex-1 bg-blue-600 py-3 rounded-lg hover:bg-blue-700">Apply</button>
                <button onclick="closeModal()" class="flex-1 bg-zinc-700 py-3 rounded-lg hover:bg-zinc-600">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Tailwind script already loaded

        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let layers = [];
        let activeLayerIndex = 0;
        let currentTool = 2; // 0=move, 1=marquee, 2=brush, 3=eraser, 4=bucket, 5=text, 6=eyedropper, 7=crop
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let currentColor = '#ffffff';
        let brushSize = 25;
        let history = [];
        let historyIndex = -1;
        let blendModes = ['source-over','multiply','screen','overlay','darken','lighten'];

        // Create initial layer
        function createLayer(name, isBg = false) {
            const offscreen = document.createElement('canvas');
            offscreen.width = canvas.width;
            offscreen.height = canvas.height;
            const offCtx = offscreen.getContext('2d');
            if (isBg) {
                offCtx.fillStyle = '#ffffff';
                offCtx.fillRect(0, 0, offscreen.width, offscreen.height);
            }
            return {
                name: name,
                canvas: offscreen,
                ctx: offCtx,
                visible: true,
                opacity: 1,
                blendMode: 'source-over'
            };
        }

        function initLayers() {
            layers = [];
            layers.push(createLayer('Background', true));
            layers.push(createLayer('Layer 1'));
            activeLayerIndex = 1;
            saveToHistory();
            renderLayers();
            renderComposite();
        }

        function renderComposite() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < layers.length; i++) {
                const layer = layers[i];
                if (!layer.visible) continue;
                ctx.globalAlpha = layer.opacity;
                ctx.globalCompositeOperation = layer.blendMode;
                ctx.drawImage(layer.canvas, 0, 0);
            }
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        }

        function renderLayers() {
            const container = document.getElementById('layersList');
            container.innerHTML = '';
            layers.forEach((layer, i) => {
                const div = document.createElement('div');
                div.className = `layer-item flex items-center gap-3 px-3 py-2 rounded-lg mb-1 text-sm ${i === activeLayerIndex ? 'active' : ''}`;
                div.innerHTML = `
                    <i onclick="toggleVisibility(${i});event.stopImmediatePropagation()" class="fa-solid ${layer.visible ? 'fa-eye' : 'fa-eye-slash'} w-5"></i>
                    <div class="flex-1 truncate">${layer.name}</div>
                    <div class="w-6 h-6 border border-zinc-700 bg-white" style="background-image:url('${layer.canvas.toDataURL()}');background-size:cover"></div>
                `;
                div.onclick = () => {
                    activeLayerIndex = i;
                    renderLayers();
                    document.getElementById('blendMode').value = layer.blendMode;
                    document.getElementById('layerOpacity').value = layer.opacity * 100;
                    document.getElementById('opacityValue').textContent = Math.round(layer.opacity * 100) + '%';
                };
                container.appendChild(div);
            });
        }

        function addLayer() {
            layers.push(createLayer(`Layer ${layers.length + 1}`));
            activeLayerIndex = layers.length - 1;
            renderLayers();
            renderComposite();
            saveToHistory();
        }

        function deleteLayer() {
            if (layers.length <= 1) return;
            layers.splice(activeLayerIndex, 1);
            if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
            renderLayers();
            renderComposite();
            saveToHistory();
        }

        function toggleVisibility(i) {
            layers[i].visible = !layers[i].visible;
            renderLayers();
            renderComposite();
        }

        function changeBlendMode() {
            const mode = document.getElementById('blendMode').value;
            layers[activeLayerIndex].blendMode = mode;
            renderComposite();
            saveToHistory();
        }

        function changeOpacity() {
            const val = parseInt(document.getElementById('layerOpacity').value) / 100;
            layers[activeLayerIndex].opacity = val;
            document.getElementById('opacityValue').textContent = Math.round(val * 100) + '%';
            renderComposite();
        }

        function updateBrush() {
            brushSize = parseInt(document.getElementById('brushSize').value);
            document.getElementById('sizeValue').textContent = brushSize;
        }

        // Tool selection
        function selectTool(n) {
            currentTool = n;
            document.querySelectorAll('.tool').forEach((el, i) => {
                el.classList.toggle('tool-active', i === n);
            });
            const names = ['Move Tool','Marquee Tool','Brush Tool','Eraser Tool','Paint Bucket','Type Tool','Eyedropper','Crop Tool'];
            document.getElementById('toolName').textContent = names[n];
        }

        // Drawing
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) * (canvas.width / rect.width)),
                y: Math.floor((e.clientY - rect.top) * (canvas.height / rect.height))
            };
        }

        canvas.addEventListener('mousedown', e => {
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;
            isDrawing = true;

            const activeLayer = layers[activeLayerIndex];
            const lctx = activeLayer.ctx;

            if (currentTool === 2) { // Brush
                lctx.strokeStyle = currentColor;
                lctx.lineWidth = brushSize;
                lctx.lineCap = 'round';
                lctx.lineJoin = 'round';
                lctx.shadowBlur = 0;
                lctx.beginPath();
                lctx.moveTo(lastX, lastY);
            } else if (currentTool === 3) { // Eraser
                lctx.globalCompositeOperation = 'destination-out';
                lctx.lineWidth = brushSize;
                lctx.beginPath();
                lctx.moveTo(lastX, lastY);
            } else if (currentTool === 4) { // Bucket
                floodFill(activeLayer.canvas, pos.x, pos.y, currentColor);
                renderComposite();
                saveToHistory();
            } else if (currentTool === 5) { // Text
                const text = prompt('Enter text:', 'Sample Text');
                if (text) {
                    lctx.font = 'bold 60px Arial';
                    lctx.fillStyle = currentColor;
                    lctx.fillText(text, pos.x, pos.y + 60);
                    renderComposite();
                    saveToHistory();
                }
            } else if (currentTool === 6) { // Eyedropper
                const data = ctx.getImageData(pos.x, pos.y, 1, 1).data;
                currentColor = '#' + ((1 << 24) + (data[0] << 16) + (data[1] << 8) + data[2]).toString(16).slice(1);
                document.getElementById('colorPicker').value = currentColor;
            }
        });

        canvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            const activeLayer = layers[activeLayerIndex];
            const lctx = activeLayer.ctx;

            if (currentTool === 2 || currentTool === 3) {
                lctx.lineTo(pos.x, pos.y);
                lctx.stroke();
                lastX = pos.x;
                lastY = pos.y;
                renderComposite();
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (isDrawing) {
                isDrawing = false;
                if (currentTool === 3) {
                    layers[activeLayerIndex].ctx.globalCompositeOperation = 'source-over';
                }
                saveToHistory();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (isDrawing) {
                isDrawing = false;
                saveToHistory();
            }
        });

        // Flood fill (simple)
        function floodFill(canvas, x, y, fillColor) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const targetColor = getColorAt(data, x, y, canvas.width);
            const fill = hexToRgb(fillColor);

            if (colorsMatch(targetColor, fill)) return;

            const stack = [[x, y]];
            while (stack.length) {
                const [cx, cy] = stack.pop();
                const idx = (cy * canvas.width + cx) * 4;
                if (colorsMatch([data[idx], data[idx+1], data[idx+2]], targetColor)) {
                    data[idx] = fill[0];
                    data[idx+1] = fill[1];
                    data[idx+2] = fill[2];
                    if (cx > 0) stack.push([cx-1, cy]);
                    if (cx < canvas.width-1) stack.push([cx+1, cy]);
                    if (cy > 0) stack.push([cx, cy-1]);
                    if (cy < canvas.height-1) stack.push([cx, cy+1]);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function getColorAt(data, x, y, width) {
            const idx = (y * width + x) * 4;
            return [data[idx], data[idx+1], data[idx+2]];
        }

        function colorsMatch(a, b) {
            return a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            return [r, g, b];
        }

        // History
        function saveToHistory() {
            // Save full composite
            const snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            history = history.slice(0, historyIndex + 1);
            history.push(snapshot);
            historyIndex++;
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';
            history.forEach((_, i) => {
                const div = document.createElement('div');
                div.className = `history-item px-4 py-2 border-l-2 ${i === historyIndex ? 'border-blue-500 bg-zinc-800' : 'border-transparent'}`;
                div.textContent = `Step ${i + 1}`;
                div.onclick = () => {
                    historyIndex = i;
                    ctx.putImageData(history[i], 0, 0);
                    renderHistory();
                };
                container.appendChild(div);
            });
        }

        function undo() {
            if (historyIndex <= 0) return;
            historyIndex--;
            ctx.putImageData(history[historyIndex], 0, 0);
            renderHistory();
        }

        function redo() {
            if (historyIndex >= history.length - 1) return;
            historyIndex++;
            ctx.putImageData(history[historyIndex], 0, 0);
            renderHistory();
        }

        // Filters
        function showFilterModal() {
            document.getElementById('filterModal').classList.remove('hidden');
            previewFilter();
        }

        function closeModal() {
            document.getElementById('filterModal').classList.add('hidden');
        }

        function previewFilter() {
            // Real preview would require temp canvas, but for demo we just show values
            document.getElementById('brightVal').textContent = document.getElementById('brightSlider').value;
            document.getElementById('contrastVal').textContent = document.getElementById('contrastSlider').value;
            document.getElementById('satVal').textContent = document.getElementById('satSlider').value;
        }

        function applyFilter() {
            const bright = parseInt(document.getElementById('brightSlider').value);
            const contrast = parseInt(document.getElementById('contrastSlider').value);
            const sat = parseInt(document.getElementById('satSlider').value);

            const activeLayer = layers[activeLayerIndex];
            const imageData = activeLayer.ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];

                // Brightness
                r = Math.min(255, Math.max(0, r + bright * 2.55));
                g = Math.min(255, Math.max(0, g + bright * 2.55));
                b = Math.min(255, Math.max(0, b + bright * 2.55));

                // Simple contrast
                r = ((r / 255 - 0.5) * (contrast / 50 + 1) + 0.5) * 255;
                g = ((g / 255 - 0.5) * (contrast / 50 + 1) + 0.5) * 255;
                b = ((b / 255 - 0.5) * (contrast / 50 + 1) + 0.5) * 255;

                // Saturation (simple)
                const avg = (r + g + b) / 3;
                r = avg + (r - avg) * (sat / 50 + 1);
                g = avg + (g - avg) * (sat / 50 + 1);
                b = avg + (b - avg) * (sat / 50 + 1);

                data[i] = Math.min(255, Math.max(0, r));
                data[i+1] = Math.min(255, Math.max(0, g));
                data[i+2] = Math.min(255, Math.max(0, b));
            }

            activeLayer.ctx.putImageData(imageData, 0, 0);
            renderComposite();
            saveToHistory();
        }

        // Menu actions
        function showMenu(el) {
            if (el.textContent === 'Filter') {
                showFilterModal();
            } else if (el.textContent === 'File') {
                alert('File menu:\n• New (Ctrl+N)\n• Open (Ctrl+O)\n• Save (Ctrl+S)');
            } else if (el.textContent === 'Edit') {
                alert('Edit menu ready (Undo, Redo already working)');
            }
        }

        function savePNG() {
            const link = document.createElement('a');
            link.download = 'photoshop-clone.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function loadImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        // Put on active layer
                        const lctx = layers[activeLayerIndex].ctx;
                        lctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        renderComposite();
                        saveToHistory();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 'z') undo();
            if (e.ctrlKey && e.key === 'y') redo();
            if (e.key === 'b') selectTool(2);
            if (e.key === 'e') selectTool(3);
            if (e.key === 'g') selectTool(4);
            if (e.key === 't') selectTool(5);
        });

        // Init
        function init() {
            // Set white background
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            initLayers();

            // Demo content on Layer 1
            const demoCtx = layers[1].ctx;
            demoCtx.font = '900 140px Arial';
            demoCtx.fillStyle = '#3b82f6';
            demoCtx.fillText('PS', 320, 380);
            demoCtx.font = '500 32px Arial';
            demoCtx.fillStyle = '#1e2937';
            demoCtx.fillText('HTML5 Clone', 380, 460);

            renderComposite();
            saveToHistory();

            // Welcome
            setTimeout(() => {
                alert("🎨 Full Photoshop Clone loaded!\n\n• Brush (B), Eraser (E), Bucket (G), Text (T)\n• Real layers with blending & opacity\n• Live history + undo/redo\n• Filters (Brightness, Contrast, Saturation)\n• Eyedropper, Save PNG, Open Image\n\nDrag on canvas to draw. Enjoy!");
            }, 800);
        }

        window.onload = init;
    </script>
</body>
</html>
