<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoWeb Lite - Image Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-toolbar: #2d2d2d;
            --bg-hover: #3e3e42;
            --accent: #007fd4;
            --text: #cccccc;
            --text-dim: #858585;
            --border: #3e3e42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            color: var(--text);
            background: var(--bg-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Menu Bar */
        .menu-bar {
            display: flex;
            align-items: center;
            height: 30px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 0 8px;
        }

        .menu-item {
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .menu-item:hover {
            background: var(--bg-hover);
        }

        /* Toolbar Options Bar */
        .tool-options {
            display: flex;
            align-items: center;
            height: 40px;
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border);
            padding: 0 12px;
            gap: 12px;
        }

        .tool-option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-option-label {
            color: var(--text-dim);
            font-size: 11px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-container input[type="range"] {
            width: 80px;
            accent-color: var(--accent);
        }

        .slider-container input[type="number"] {
            width: 50px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px;
            border-radius: 4px;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Toolbar */
        .left-toolbar {
            width: 46px;
            background: var(--bg-toolbar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 4px;
            gap: 2px;
        }

        .tool-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .tool-btn:hover {
            background: var(--bg-hover);
        }

        .tool-btn.active {
            background: var(--accent);
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
        }

        .tool-separator {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        .color-swatches {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
        }

        .color-swatch {
            width: 32px;
            height: 24px;
            border: 1px solid var(--border);
            border-radius: 2px;
            cursor: pointer;
        }

        .color-swatch.foreground {
            position: relative;
            z-index: 2;
        }

        .color-swatch.background {
            margin-top: -12px;
            margin-left: 8px;
        }

        /* Canvas Workspace */
        .workspace {
            flex: 1;
            background: #2b2b2b;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            position: relative;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #main-canvas {
            display: block;
            background: white;
        }

        /* Right Panels */
        .right-panels {
            width: 280px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .panel {
            border-bottom: 1px solid var(--border);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--bg-toolbar);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-content {
            padding: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        /* History Panel */
        .history-item {
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-item:hover {
            background: var(--bg-hover);
        }

        .history-item.active {
            background: var(--accent);
        }

        .history-item .icon {
            width: 16px;
            height: 16px;
        }

        /* Layers Panel */
        .layers-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .layers-panel .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            background: var(--bg-toolbar);
            border-radius: 4px;
            margin-bottom: 2px;
            cursor: pointer;
            gap: 8px;
        }

        .layer-item:hover {
            background: var(--bg-hover);
        }

        .layer-item.active {
            background: var(--accent);
        }

        .layer-visibility {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
        }

        .layer-name {
            flex: 1;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .layer-name input {
            background: var(--bg-panel);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 2px 4px;
            font-size: 12px;
            width: 100%;
        }

        .layer-actions {
            display: flex;
            gap: 4px;
        }

        .layer-action-btn {
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }

        .layer-action-btn:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .layer-opacity {
            width: 50px;
        }

        /* Blend Mode Select */
        .blend-mode-select {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px;
            border-radius: 4px;
            font-size: 11px;
            width: 100%;
        }

        /* Filters Panel */
        .filters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }

        .filter-btn {
            padding: 8px;
            background: var(--bg-toolbar);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .filter-btn:hover {
            background: var(--bg-hover);
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .filter-panel {
            display: none;
            padding: 12px;
            background: var(--bg-toolbar);
            border-top: 1px solid var(--border);
        }

        .filter-panel.show {
            display: block;
        }

        .filter-slider {
            margin-bottom: 12px;
        }

        .filter-slider label {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .filter-slider input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .filter-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .filter-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .filter-actions .apply-btn {
            background: var(--accent);
            color: white;
        }

        .filter-actions .reset-btn {
            background: var(--bg-panel);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 24px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 0 12px;
            font-size: 11px;
            color: var(--text-dim);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--bg-panel);
            border-radius: 8px;
            padding: 20px;
            min-width: 300px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .modal h3 {
            margin-bottom: 16px;
            font-size: 14px;
        }

        .modal-content {
            margin-bottom: 16px;
        }

        .modal-content label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .modal-content input {
            width: 100%;
            padding: 8px;
            background: var(--bg-toolbar);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .modal-actions .cancel-btn {
            background: var(--bg-toolbar);
            color: var(--text);
        }

        .modal-actions .confirm-btn {
            background: var(--accent);
            color: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border);
        }

        /* Text Tool Overlay */
        .text-tool-overlay {
            position: absolute;
            border: 1px dashed var(--accent);
            background: rgba(0, 127, 212, 0.1);
            min-width: 50px;
            min-height: 20px;
            display: none;
            cursor: text;
        }

        .text-tool-overlay.show {
            display: block;
        }

        .text-tool-overlay textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: Arial;
            font-size: 16px;
            resize: none;
            outline: none;
            padding: 4px;
        }

        /* Selection Overlay */
        .selection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Menu Bar -->
    <div class="menu-bar">
        <div class="menu-item" onclick="newImage()">File</div>
        <div class="menu-item" onclick="document.getElementById('open-file').click()">Open</div>
        <div class="menu-item" onclick="exportImage()">Export</div>
        <div class="menu-item" onclick="undo()">Undo</div>
        <div class="menu-item" onclick="redo()">Redo</div>
        <input type="file" id="open-file" accept="image/*" style="display:none" onchange="openImage(event)">
    </div>

    <!-- Tool Options Bar -->
    <div class="tool-options" id="tool-options">
        <div class="tool-option-group">
            <span class="tool-option-label">Size:</span>
            <input type="range" id="brush-size" min="1" max="200" value="10" oninput="updateBrushSize()">
            <input type="number" id="brush-size-num" min="1" max="200" value="10" oninput="updateBrushSizeFromNum()">
        </div>
        <div class="tool-option-group">
            <span class="tool-option-label">Opacity:</span>
            <input type="range" id="brush-opacity" min="1" max="100" value="100" oninput="updateBrushOpacity()">
            <input type="number" id="brush-opacity-num" min="1" max="100" value="100" oninput="updateBrushOpacityFromNum()">
        </div>
        <div class="tool-option-group">
            <span class="tool-option-label">Hardness:</span>
            <input type="range" id="brush-hardness" min="0" max="100" value="100" oninput="updateBrushHardness()">
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Toolbar -->
        <div class="left-toolbar">
            <button class="tool-btn active" data-tool="brush" onclick="selectTool('brush')" title="Brush (B)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 000-1.41z"/></svg>
            </button>
            <button class="tool-btn" data-tool="eraser" onclick="selectTool('eraser')" title="Eraser (E)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 01-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0zm-1.41 1.42L6.1 13.71l4.95 4.95 8.73-8.73-4.95-4.95z"/></svg>
            </button>
            <div class="tool-separator"></div>
            <button class="tool-btn" data-tool="move" onclick="selectTool('move')" title="Move (V)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>
            </button>
            <button class="tool-btn" data-tool="rectangle" onclick="selectTool('rectangle')" title="Rectangle (M)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5v14h18V5H3zm16 12H5V7h14v10z"/></svg>
            </button>
            <button class="tool-btn" data-tool="ellipse" onclick="selectTool('ellipse')" title="Ellipse (U)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
            </button>
            <button class="tool-btn" data-tool="line" onclick="selectTool('line')" title="Line (L)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13H5v-2h14v2z" transform="rotate(-45 12 12)"/></svg>
            </button>
            <div class="tool-separator"></div>
            <button class="tool-btn" data-tool="text" onclick="selectTool('text')" title="Text (T)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
            </button>
            <button class="tool-btn" data-tool="gradient" onclick="selectTool('gradient')" title="Gradient (G)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 9h2v2h-2zm-2 2h2v2H9zm2 2h2v2h-2zm2-2h2v2h-2zm-2 2h2v2H9zm6-4h2v2h-2zm-2 2h2v2h-2zm2 2h2v2h-2zm-2 2h2v2H9zm2-4h2v2h-2z"/></svg>
            </button>
            <button class="tool-btn" data-tool="eyedropper" onclick="selectTool('eyedropper')" title="Eyedropper (I)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.71 5.63l-2.34-2.34a.996.996 0 00-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12a.996.996 0 00.01-1.42zM6.92 19L5 17.08l8.06-8.06 1.92 1.92L6.92 19z"/></svg>
            </button>
            <button class="tool-btn" data-tool="select" onclick="selectTool('select')" title="Magic Select (W)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4L7 18z"/></svg>
            </button>
            <div class="tool-separator"></div>
            <button class="tool-btn" data-tool="hand" onclick="selectTool('hand')" title="Hand (H)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 9c0-.55.45-1 1-1V6c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2v2c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h10c.55 0 1-.45 1-1V10c0-.55-.45-1-1-1zm-5 6h-2V9h2v6zm2-8H7V6h10v1z"/></svg>
            </button>

            <div class="color-swatches">
                <div class="color-swatch foreground" id="fg-color" style="background:#000000" onclick="openColorPicker('foreground')"></div>
                <div class="color-swatch background" id="bg-color" style="background:#ffffff" onclick="openColorPicker('background')"></div>
                <input type="color" id="color-picker" style="display:none" onchange="setColor(this.value)">
            </div>
        </div>

        <!-- Workspace -->
        <div class="workspace" id="workspace">
            <div class="canvas-container" id="canvas-container">
                <canvas id="main-canvas" width="800" height="600"></canvas>
            </div>
        </div>

        <!-- Right Panels -->
        <div class="right-panels">
            <!-- History Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>History</span>
                    <button class="layer-action-btn" onclick="clearHistory()" title="Clear History">🗑</button>
                </div>
                <div class="panel-content" id="history-list">
                </div>
            </div>

            <!-- Layers Panel -->
            <div class="panel layers-panel">
                <div class="panel-header">
                    <span>Layers</span>
                    <div class="layer-actions">
                        <button class="layer-action-btn" onclick="addLayer()" title="Add Layer">+</button>
                        <button class="layer-action-btn" onclick="deleteLayer()" title="Delete Layer">-</button>
                    </div>
                </div>
                <div class="panel-content" id="layers-list">
                </div>
            </div>

            <!-- Filters Panel -->
            <div class="panel">
                <div class="panel-header" onclick="toggleFiltersPanel()">
                    <span>Filters</span>
                    <span>▼</span>
                </div>
                <div class="panel-content" id="filters-content">
                    <div class="filters-grid">
                        <button class="filter-btn" onclick="showFilterPanel('brightness')">Brightness</button>
                        <button class="filter-btn" onclick="showFilterPanel('contrast')">Contrast</button>
                        <button class="filter-btn" onclick="applyFilter('grayscale')">Grayscale</button>
                        <button class="filter-btn" onclick="applyFilter('invert')">Invert</button>
                        <button class="filter-btn" onclick="applyFilter('sepia')">Sepia</button>
                        <button class="filter-btn" onclick="applyFilter('blur')">Blur</button>
                        <button class="filter-btn" onclick="applyFilter('sharpen')">Sharpen</button>
                    </div>

                    <div class="filter-panel" id="brightness-panel">
                        <div class="filter-slider">
                            <label>Brightness: <span id="brightness-value">0</span></label>
                            <input type="range" id="brightness-slider" min="-100" max="100" value="0" oninput="updateFilterPreview('brightness')">
                        </div>
                        <div class="filter-slider">
                            <label>Contrast: <span id="contrast-value">0</span></label>
                            <input type="range" id="contrast-slider" min="-100" max="100" value="0" oninput="updateFilterPreview('contrast')">
                        </div>
                        <div class="filter-slider">
                            <label>Saturation: <span id="saturation-value">0</span></label>
                            <input type="range" id="saturation-slider" min="-100" max="100" value="0" oninput="updateFilterPreview('saturation')">
                        </div>
                        <div class="filter-actions">
                            <button class="reset-btn" onclick="resetFilters()">Reset</button>
                            <button class="apply-btn" onclick="applyColorFilter()">Apply</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span id="status-text">Ready</span>
        <span id="zoom-level">100%</span>
    </div>

    <script>
        // ==================== STATE ====================
        const state = {
            currentTool: 'brush',
            foregroundColor: '#000000',
            backgroundColor: '#ffffff',
            brushSize: 10,
            brushOpacity: 100,
            brushHardness: 100,
            layers: [],
            activeLayerIndex: 0,
            history: [],
            historyIndex: -1,
            maxHistory: 50,
            isDrawing: false,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            zoom: 1,
            canvas: null,
            ctx: null,
            tempCanvas: null,
            tempCtx: null
        };

        // ==================== INITIALIZATION ====================
        function init() {
            state.canvas = document.getElementById('main-canvas');
            state.ctx = state.canvas.getContext('2d');

            // Create temp canvas for filters
            state.tempCanvas = document.createElement('canvas');
            state.tempCanvas.width = state.canvas.width;
            state.tempCanvas.height = state.canvas.height;
            state.tempCtx = state.tempCanvas.getContext('2d');

            // Create background layer
            addLayer('Background', true);

            // Draw white background
            const ctx = getActiveLayerContext();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, state.canvas.width, state.canvas.height);

            // Setup event listeners
            setupEventListeners();

            // Initial render
            renderLayers();
            updateHistoryUI();
            updateLayersUI();
            updateStatus('Ready');
        }

        function setupEventListeners() {
            const canvas = state.canvas;

            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);

            // Keyboard shortcuts
            document.addEventListener('keydown', handleKeyDown);

            // Canvas zoom
            document.getElementById('workspace').addEventListener('wheel', handleZoom);
        }

        // ==================== TOOLS ====================
        function selectTool(tool) {
            state.currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === tool);
            });

            // Show/hide tool options
            const toolOptions = document.getElementById('tool-options');
            if (['brush', 'eraser'].includes(tool)) {
                toolOptions.style.display = 'flex';
            } else {
                toolOptions.style.display = 'none';
            }

            updateStatus(`Tool: ${tool.charAt(0).toUpperCase() + tool.slice(1)}`);
        }

        function handleMouseDown(e) {
            const rect = state.canvas.getBoundingClientRect();
            state.startX = (e.clientX - rect.left) / state.zoom;
            state.startY = (e.clientY - rect.top) / state.zoom;
            state.currentX = state.startX;
            state.currentY = state.startY;
            state.isDrawing = true;

            if (state.currentTool === 'brush') {
                startBrushStroke();
            } else if (state.currentTool === 'eraser') {
                startEraserStroke();
            } else if (state.currentTool === 'text') {
                startTextTool(e);
            } else if (state.currentTool === 'eyedropper') {
                pickColor();
            } else if (state.currentTool === 'select') {
                startSelection();
            }
        }

        function handleMouseMove(e) {
            const rect = state.canvas.getBoundingClientRect();
            state.currentX = (e.clientX - rect.left) / state.zoom;
            state.currentY = (e.clientY - rect.top) / state.zoom;

            if (state.isDrawing) {
                if (state.currentTool === 'brush') {
                    continueBrushStroke();
                } else if (state.currentTool === 'eraser') {
                    continueEraserStroke();
                } else if (['rectangle', 'ellipse', 'line'].includes(state.currentTool)) {
                    drawShapePreview();
                } else if (state.currentTool === 'gradient') {
                    drawGradientPreview();
                }
            }
        }

        function handleMouseUp(e) {
            if (!state.isDrawing) return;
            state.isDrawing = false;

            if (['rectangle', 'ellipse', 'line'].includes(state.currentTool)) {
                drawShape();
            } else if (state.currentTool === 'gradient') {
                drawGradient();
            } else if (state.currentTool === 'select') {
                finishSelection();
            }

            // Save state to history
            saveToHistory();
            renderLayers();
        }

        // ==================== BRUSH & ERASER ====================
        function startBrushStroke() {
            const ctx = getActiveLayerContext();
            ctx.beginPath();
            ctx.moveTo(state.startX, state.startY);
            ctx.strokeStyle = state.foregroundColor;
            ctx.lineWidth = state.brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = state.brushOpacity / 100;
        }

        function continueBrushStroke() {
            const ctx = getActiveLayerContext();
            ctx.lineTo(state.currentX, state.currentY);
            ctx.stroke();
        }

        function startEraserStroke() {
            const ctx = getActiveLayerContext();
            ctx.beginPath();
            ctx.moveTo(state.startX, state.startY);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = state.brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function continueEraserStroke() {
            const ctx = getActiveLayerContext();
            ctx.lineTo(state.currentX, state.currentY);
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
        }

        // ==================== SHAPE TOOLS ====================
        function drawShapePreview() {
            // Clear temp and redraw layers
            renderLayersToCanvas(state.tempCtx);

            const ctx = state.tempCtx;
            ctx.strokeStyle = state.foregroundColor;
            ctx.fillStyle = state.backgroundColor;
            ctx.lineWidth = state.brushSize;
            ctx.globalAlpha = state.brushOpacity / 100;

            drawShapePath(ctx);

            // Copy to main canvas
            const mainCtx = state.ctx;
            mainCtx.clearRect(0, 0, state.canvas.width, state.canvas.height);
            mainCtx.drawImage(state.tempCanvas, 0, 0);
        }

        function drawShape() {
            const ctx = getActiveLayerContext();
            ctx.strokeStyle = state.foregroundColor;
            ctx.fillStyle = state.backgroundColor;
            ctx.lineWidth = state.brushSize;
            ctx.globalAlpha = state.brushOpacity / 100;

            drawShapePath(ctx);
            ctx.globalAlpha = 1;
        }

        function drawShapePath(ctx) {
            const x = state.startX;
            const y = state.startY;
            const w = state.currentX - state.startX;
            const h = state.currentY - state.startY;

            ctx.beginPath();

            if (state.currentTool === 'rectangle') {
                if (w < 0) { ctx.rect(state.currentX, y, Math.abs(w), h); }
                else { ctx.rect(x, y, w, h); }
                ctx.stroke();
            } else if (state.currentTool === 'ellipse') {
                const cx = x + w/2;
                const cy = y + h/2;
                const rx = Math.abs(w/2);
                const ry = Math.abs(h/2);
                ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                ctx.stroke();
            } else if (state.currentTool === 'line') {
                ctx.moveTo(x, y);
                ctx.lineTo(state.currentX, state.currentY);
                ctx.stroke();
            }
        }

        // ==================== GRADIENT ====================
        function drawGradientPreview() {
            renderLayersToCanvas(state.tempCtx);

            const ctx = state.tempCtx;
            drawGradientTo(ctx);

            const mainCtx = state.ctx;
            mainCtx.clearRect(0, 0, state.canvas.width, state.canvas.height);
            mainCtx.drawImage(state.tempCanvas, 0, 0);
        }

        function drawGradient() {
            const ctx = getActiveLayerContext();
            drawGradientTo(ctx);
        }

        function drawGradientTo(ctx) {
            const x1 = state.startX;
            const y1 = state.startY;
            const x2 = state.currentX;
            const y2 = state.currentY;

            const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
            gradient.addColorStop(0, state.foregroundColor);
            gradient.addColorStop(1, state.backgroundColor);

            ctx.fillStyle = gradient;
            ctx.fillRect(
                Math.min(x1, x2),
                Math.min(y1, y2),
                Math.abs(x2 - x1),
                Math.abs(y2 - y1)
            );
        }

        // ==================== TEXT TOOL ====================
        function startTextTool(e) {
            const container = document.getElementById('canvas-container');
            const rect = state.canvas.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            let overlay = document.getElementById('text-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'text-overlay';
                overlay.className = 'text-tool-overlay';
                overlay.innerHTML = '<textarea></textarea>';
                container.appendChild(overlay);
            }

            const x = rect.left - containerRect.left;
            const y = rect.top - containerRect.top;

            overlay.style.left = x + 'px';
            overlay.style.top = y + 'px';
            overlay.style.width = '200px';
            overlay.style.height = '30px';
            overlay.classList.add('show');

            const textarea = overlay.querySelector('textarea');
            textarea.value = '';
            textarea.focus();

            textarea.onblur = function() {
                if (textarea.value.trim()) {
                    const ctx = getActiveLayerContext();
                    ctx.font = `${state.brushSize * 2}px Arial`;
                    ctx.fillStyle = state.foregroundColor;
                    ctx.fillText(textarea.value, state.startX, state.startY + state.brushSize * 2);
                    saveToHistory();
                    renderLayers();
                }
                overlay.classList.remove('show');
            };
        }

        // ==================== SELECTION TOOL ====================
        let selectionRect = null;

        function startSelection() {
            selectionRect = {
                x: state.startX,
                y: state.startY,
                width: 0,
                height: 0
            };
        }

        function finishSelection() {
            if (selectionRect) {
                // Simple selection - just highlight the area
                const ctx = state.ctx;
                ctx.strokeStyle = '#007fd4';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(
                    selectionRect.x,
                    selectionRect.y,
                    selectionRect.width,
                    selectionRect.height
                );
                ctx.setLineDash([]);
            }
            selectionRect = null;
        }

        // ==================== EYEDROPPER ====================
        function pickColor() {
            const ctx = state.canvas.getContext('2d');
            const pixel = ctx.getImageData(state.currentX, state.currentY, 1, 1).data;
            const hex = '#' +
                pixel[0].toString(16).padStart(2, '0') +
                pixel[1].toString(16).padStart(2, '0') +
                pixel[2].toString(16).padStart(2, '0');

            setForegroundColor(hex);
            updateStatus(`Picked color: ${hex}`);
        }

        // ==================== COLOR ====================
        function openColorPicker(type) {
            const picker = document.getElementById('color-picker');
            picker.dataset.colorType = type;
            picker.click();
        }

        function setColor(color) {
            const type = document.getElementById('color-picker').dataset.colorType;
            if (type === 'foreground') {
                setForegroundColor(color);
            } else {
                setBackgroundColor(color);
            }
        }

        function setForegroundColor(color) {
            state.foregroundColor = color;
            document.getElementById('fg-color').style.background = color;
        }

        function setBackgroundColor(color) {
            state.backgroundColor = color;
            document.getElementById('bg-color').style.background = color;
        }

        // ==================== LAYERS ====================
        function addLayer(name, isBackground = false) {
            const canvas = document.createElement('canvas');
            canvas.width = state.canvas.width;
            canvas.height = state.canvas.height;

            const layer = {
                id: Date.now().toString(),
                name: name || `Layer ${state.layers.length + 1}`,
                canvas: canvas,
                visible: true,
                locked: isBackground,
                opacity: 100,
                blendMode: 'normal'
            };

            state.layers.splice(state.activeLayerIndex + 1, 0, layer);
            state.activeLayerIndex = state.activeLayerIndex + 1;

            updateLayersUI();
            renderLayers();
        }

        function deleteLayer() {
            if (state.layers.length <= 1) {
                updateStatus('Cannot delete the last layer');
                return;
            }

            state.layers.splice(state.activeLayerIndex, 1);
            if (state.activeLayerIndex >= state.layers.length) {
                state.activeLayerIndex = state.layers.length - 1;
            }

            updateLayersUI();
            renderLayers();
            saveToHistory();
        }

        function getActiveLayerContext() {
            return state.layers[state.activeLayerIndex].canvas.getContext('2d');
        }

        function getActiveLayer() {
            return state.layers[state.activeLayerIndex];
        }

        function renderLayers() {
            // Clear main canvas
            state.ctx.clearRect(0, 0, state.canvas.width, state.canvas.height);

            // Draw each visible layer
            state.layers.forEach(layer => {
                if (layer.visible) {
                    state.ctx.globalAlpha = layer.opacity / 100;
                    state.ctx.globalCompositeOperation = layer.blendMode === 'normal' ? 'source-over' : layer.blendMode;
                    state.ctx.drawImage(layer.canvas, 0, 0);
                }
            });

            // Reset
            state.ctx.globalAlpha = 1;
            state.ctx.globalCompositeOperation = 'source-over';
        }

        function renderLayersToCanvas(targetCtx) {
            targetCtx.clearRect(0, 0, state.canvas.width, state.canvas.height);

            state.layers.forEach(layer => {
                if (layer.visible) {
                    targetCtx.globalAlpha = layer.opacity / 100;
                    targetCtx.globalCompositeOperation = layer.blendMode === 'normal' ? 'source-over' : layer.blendMode;
                    targetCtx.drawImage(layer.canvas, 0, 0);
                }
            });

            targetCtx.globalAlpha = 1;
            targetCtx.globalCompositeOperation = 'source-over';
        }

        function updateLayersUI() {
            const container = document.getElementById('layers-list');
            container.innerHTML = '';

            // Reverse order to show top layer first
            [...state.layers].reverse().forEach((layer, index) => {
                const actualIndex = state.layers.length - 1 - index;
                const item = document.createElement('div');
                item.className = 'layer-item' + (actualIndex === state.activeLayerIndex ? ' active' : '');
                item.onclick = () => selectLayerByIndex(actualIndex);

                item.innerHTML = `
                    <div class="layer-visibility" onclick="toggleLayerVisibility(event, ${actualIndex})">
                        ${layer.visible ? '👁' : '○'}
                    </div>
                    <div class="layer-name" ondblclick="renameLayer(${actualIndex})">${layer.name}</div>
                    <input type="range" class="layer-opacity" min="0" max="100" value="${layer.opacity}"
                        onclick="event.stopPropagation()" onchange="setLayerOpacity(${actualIndex}, this.value)">
                    <div class="layer-actions">
                        <button class="layer-action-btn" onclick="duplicateLayer(event, ${actualIndex})">⧉</button>
                        <button class="layer-action-btn" onclick="deleteLayerByIndex(event, ${actualIndex})">×</button>
                    </div>
                `;

                container.appendChild(item);
            });
        }

        function selectLayerByIndex(index) {
            state.activeLayerIndex = index;
            updateLayersUI();
        }

        function toggleLayerVisibility(event, index) {
            event.stopPropagation();
            state.layers[index].visible = !state.layers[index].visible;
            renderLayers();
            updateLayersUI();
        }

        function setLayerOpacity(index, opacity) {
            state.layers[index].opacity = parseInt(opacity);
            renderLayers();
        }

        function renameLayer(index) {
            const newName = prompt('Enter new layer name:', state.layers[index].name);
            if (newName) {
                state.layers[index].name = newName;
                updateLayersUI();
            }
        }

        function duplicateLayer(event, index) {
            event.stopPropagation();
            const original = state.layers[index];
            const canvas = document.createElement('canvas');
            canvas.width = original.canvas.width;
            canvas.height = original.canvas.height;
            canvas.getContext('2d').drawImage(original.canvas, 0, 0);

            const layer = {
                id: Date.now().toString(),
                name: original.name + ' copy',
                canvas: canvas,
                visible: original.visible,
                locked: false,
                opacity: original.opacity,
                blendMode: original.blendMode
            };

            state.layers.splice(index + 1, 0, layer);
            state.activeLayerIndex = index + 1;

            updateLayersUI();
            saveToHistory();
        }

        function deleteLayerByIndex(event, index) {
            event.stopPropagation();
            if (state.layers.length <= 1) return;

            state.layers.splice(index, 1);
            if (state.activeLayerIndex >= state.layers.length) {
                state.activeLayerIndex = state.layers.length - 1;
            }

            updateLayersUI();
            renderLayers();
            saveToHistory();
        }

        // ==================== HISTORY ====================
        function saveToHistory() {
            // Create a deep copy of layer canvases
            const snapshot = state.layers.map(layer => {
                const canvas = document.createElement('canvas');
                canvas.width = layer.canvas.width;
                canvas.height = layer.canvas.height;
                canvas.getContext('2d').drawImage(layer.canvas, 0, 0);
                return {
                    id: layer.id,
                    name: layer.name,
                    canvas: canvas,
                    visible: layer.visible,
                    locked: layer.locked,
                    opacity: layer.opacity,
                    blendMode: layer.blendMode
                };
            });

            // Remove any future history if we're not at the end
            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }

            state.history.push(snapshot);

            // Limit history size
            if (state.history.length > state.maxHistory) {
                state.history.shift();
            }

            state.historyIndex = state.history.length - 1;
            updateHistoryUI();
        }

        function undo() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                restoreFromHistory();
                updateHistoryUI();
                updateStatus('Undo');
            }
        }

        function redo() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                restoreFromHistory();
                updateHistoryUI();
                updateStatus('Redo');
            }
        }

        function restoreFromHistory() {
            const snapshot = state.history[state.historyIndex];
            state.layers = snapshot.map(layerData => {
                const canvas = document.createElement('canvas');
                canvas.width = layerData.canvas.width;
                canvas.height = layerData.canvas.height;
                canvas.getContext('2d').drawImage(layerData.canvas, 0, 0);
                return {
                    id: layerData.id,
                    name: layerData.name,
                    canvas: canvas,
                    visible: layerData.visible,
                    locked: layerData.locked,
                    opacity: layerData.opacity,
                    blendMode: layerData.blendMode
                };
            });

            // Recreate active layer reference
            if (state.activeLayerIndex >= state.layers.length) {
                state.activeLayerIndex = state.layers.length - 1;
            }

            renderLayers();
            updateLayersUI();
        }

        function updateHistoryUI() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';

            state.history.forEach((snapshot, index) => {
                const item = document.createElement('div');
                item.className = 'history-item' + (index === state.historyIndex ? ' active' : '');
                item.onclick = () => {
                    state.historyIndex = index;
                    restoreFromHistory();
                    updateHistoryUI();
                };
                item.innerHTML = `<span>${index === 0 ? 'Initial' : 'Action ' + index}</span>`;
                container.appendChild(item);
            });

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function clearHistory() {
            state.history = [];
            state.historyIndex = -1;
            saveToHistory();
            updateHistoryUI();
            updateStatus('History cleared');
        }

        // ==================== FILTERS ====================
        function showFilterPanel(filterName) {
            const panel = document.getElementById('brightness-panel');
            panel.classList.toggle('show', filterName === 'brightness');

            if (filterName === 'brightness') {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');
            }
        }

        function toggleFiltersPanel() {
            const content = document.getElementById('filters-content');
            content.classList.toggle('collapsed');
        }

        function updateFilterPreview(type) {
            if (type === 'brightness') {
                document.getElementById('brightness-value').textContent =
                    document.getElementById('brightness-slider').value;
            } else if (type === 'contrast') {
                document.getElementById('contrast-value').textContent =
                    document.getElementById('contrast-slider').value;
            } else if (type === 'saturation') {
                document.getElementById('saturation-value').textContent =
                    document.getElementById('saturation-slider').value;
            }
        }

        function applyColorFilter() {
            const brightness = parseInt(document.getElementById('brightness-slider').value);
            const contrast = parseInt(document.getElementById('contrast-slider').value);
            const saturation = parseInt(document.getElementById('saturation-slider').value);

            applyFilterToLayer('color', { brightness, contrast, saturation });
            resetFilterSliders();
            saveToHistory();
        }

        function applyFilter(filterName) {
            applyFilterToLayer(filterName, {});
            saveToHistory();
        }

        function applyFilterToLayer(filterName, options) {
            const layer = getActiveLayer();
            const ctx = layer.canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, layer.canvas.width, layer.canvas.height);
            const data = imageData.data;

            if (filterName === 'grayscale') {
                for (let i = 0; i < data.length; i += 4) {
                    const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    data[i] = avg;
                    data[i + 1] = avg;
                    data[i + 2] = avg;
                }
            } else if (filterName === 'invert') {
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = 255 - data[i];
                    data[i + 1] = 255 - data[i + 1];
                    data[i + 2] = 255 - data[i + 2];
                }
            } else if (filterName === 'sepia') {
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                    data[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                    data[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
                }
            } else if (filterName === 'blur') {
                // Simple box blur
                const kernelSize = 5;
                const tempData = new Uint8ClampedArray(data);
                const width = layer.canvas.width;
                const height = layer.canvas.height;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        let r = 0, g = 0, b = 0, count = 0;

                        for (let ky = -2; ky <= 2; ky++) {
                            for (let kx = -2; kx <= 2; kx++) {
                                const nx = x + kx;
                                const ny = y + ky;
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    const idx = (ny * width + nx) * 4;
                                    r += tempData[idx];
                                    g += tempData[idx + 1];
                                    b += tempData[idx + 2];
                                    count++;
                                }
                            }
                        }

                        const idx = (y * width + x) * 4;
                        data[idx] = r / count;
                        data[idx + 1] = g / count;
                        data[idx + 2] = b / count;
                    }
                }
            } else if (filterName === 'sharpen') {
                // Sharpening kernel
                const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];
                convolve(imageData, kernel);
            } else if (filterName === 'color') {
                const { brightness, contrast, saturation } = options;

                // Apply brightness
                if (brightness !== 0) {
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.max(0, Math.min(255, data[i] + brightness));
                        data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + brightness));
                        data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + brightness));
                    }
                }

                // Apply contrast
                if (contrast !== 0) {
                    const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.max(0, Math.min(255, factor * (data[i] - 128) + 128));
                        data[i + 1] = Math.max(0, Math.min(255, factor * (data[i + 1] - 128) + 128));
                        data[i + 2] = Math.max(0, Math.min(255, factor * (data[i + 2] - 128) + 128));
                    }
                }

                // Apply saturation
                if (saturation !== 0) {
                    const satFactor = 1 + saturation / 100;
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = 0.2989 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        data[i] = Math.max(0, Math.min(255, gray + satFactor * (data[i] - gray)));
                        data[i + 1] = Math.max(0, Math.min(255, gray + satFactor * (data[i + 1] - gray)));
                        data[i + 2] = Math.max(0, Math.min(255, gray + satFactor * (data[i + 2] - gray)));
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);
            renderLayers();
            updateStatus(`Applied: ${filterName}`);
        }

        function convolve(imageData, kernel) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const tempData = new Uint8ClampedArray(data);
            const kernelSize = Math.sqrt(kernel.length);
            const offset = Math.floor(kernelSize / 2);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0;

                    for (let ky = 0; ky < kernelSize; ky++) {
                        for (let kx = 0; kx < kernelSize; kx++) {
                            const nx = x + kx - offset;
                            const ny = y + ky - offset;

                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                const idx = (ny * width + nx) * 4;
                                const k = kernel[ky * kernelSize + kx];
                                r += tempData[idx] * k;
                                g += tempData[idx + 1] * k;
                                b += tempData[idx + 2] * k;
                            }
                        }
                    }

                    const idx = (y * width + x) * 4;
                    data[idx] = Math.max(0, Math.min(255, r));
                    data[idx + 1] = Math.max(0, Math.min(255, g));
                    data[idx + 2] = Math.max(0, Math.min(255, b));
                }
            }
        }

        function resetFilters() {
            resetFilterSliders();
        }

        function resetFilterSliders() {
            document.getElementById('brightness-slider').value = 0;
            document.getElementById('contrast-slider').value = 0;
            document.getElementById('saturation-slider').value = 0;
            document.getElementById('brightness-value').textContent = '0';
            document.getElementById('contrast-value').textContent = '0';
            document.getElementById('saturation-value').textContent = '0';
        }

        // ==================== FILE OPERATIONS ====================
        function newImage() {
            if (confirm('Create new image? Unsaved changes will be lost.')) {
                state.canvas.width = 800;
                state.canvas.height = 600;
                state.layers = [];
                addLayer('Background', true);

                const ctx = getActiveLayerContext();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, state.canvas.width, state.canvas.height);

                state.history = [];
                state.historyIndex = -1;
                saveToHistory();
                renderLayers();
                updateStatus('New image created');
            }
        }

        function openImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    state.canvas.width = img.width;
                    state.canvas.height = img.height;
                    state.tempCanvas.width = img.width;
                    state.tempCanvas.height = img.height;

                    state.layers = [];
                    addLayer('Image', true);

                    const ctx = getActiveLayerContext();
                    ctx.drawImage(img, 0, 0);

                    state.history = [];
                    state.historyIndex = -1;
                    saveToHistory();
                    renderLayers();
                    updateStatus('Image opened');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);

            // Reset input
            event.target.value = '';
        }

        function exportImage() {
            // Create a flattened canvas
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = state.canvas.width;
            exportCanvas.height = state.canvas.height;
            const exportCtx = exportCanvas.getContext('2d');

            // Draw all visible layers
            state.layers.forEach(layer => {
                if (layer.visible) {
                    exportCtx.globalAlpha = layer.opacity / 100;
                    exportCtx.drawImage(layer.canvas, 0, 0);
                }
            });

            // Download
            const link = document.createElement('a');
            link.download = 'image.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();

            updateStatus('Image exported');
        }

        // ==================== ZOOM ====================
        function handleZoom(e) {
            if (e.ctrlKey) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                state.zoom = Math.max(0.1, Math.min(5, state.zoom + delta));

                const canvas = document.getElementById('main-canvas');
                canvas.style.transform = `scale(${state.zoom})`;

                document.getElementById('zoom-level').textContent = Math.round(state.zoom * 100) + '%';
            }
        }

        // ==================== KEYBOARD ====================
        function handleKeyDown(e) {
            if (e.ctrlKey && e.key === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
            } else if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                exportImage();
            } else if (e.key === 'b') {
                selectTool('brush');
            } else if (e.key === 'e') {
                selectTool('eraser');
            } else if (e.key === 'v') {
                selectTool('move');
            } else if (e.key === 'm') {
                selectTool('rectangle');
            } else if (e.key === 'u') {
                selectTool('ellipse');
            } else if (e.key === 'l') {
                selectTool('line');
            } else if (e.key === 't') {
                selectTool('text');
            } else if (e.key === 'g') {
                selectTool('gradient');
            } else if (e.key === 'i') {
                selectTool('eyedropper');
            } else if (e.key === 'w') {
                selectTool('select');
            } else if (e.key === 'h') {
                selectTool('hand');
            }
        }

        // ==================== BRUSH SETTINGS ====================
        function updateBrushSize() {
            state.brushSize = parseInt(document.getElementById('brush-size').value);
            document.getElementById('brush-size-num').value = state.brushSize;
        }

        function updateBrushSizeFromNum() {
            state.brushSize = parseInt(document.getElementById('brush-size-num').value);
            document.getElementById('brush-size').value = state.brushSize;
        }

        function updateBrushOpacity() {
            state.brushOpacity = parseInt(document.getElementById('brush-opacity').value);
            document.getElementById('brush-opacity-num').value = state.brushOpacity;
        }

        function updateBrushOpacityFromNum() {
            state.brushOpacity = parseInt(document.getElementById('brush-opacity-num').value);
            document.getElementById('brush-opacity').value = state.brushOpacity;
        }

        function updateBrushHardness() {
            state.brushHardness = parseInt(document.getElementById('brush-hardness').value);
        }

        // ==================== STATUS ====================
        function updateStatus(text) {
            document.getElementById('status-text').textContent = text;
        }

        // Initialize
        init();
    </script>
</body>
</html>
