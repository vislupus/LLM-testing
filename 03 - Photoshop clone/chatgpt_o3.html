<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini-Photoshop – single-file demo</title>
<style>
:root{
  font-family: system-ui, sans-serif;
  --panel-bg:#333;--panel-fg:#eee;--btn:#444;--btn-hover:#666;
}
body{margin:0;display:flex;height:100vh;overflow:hidden;background:#1e1e1e;color:#fff;}
/* ─── left tool panel ──────────────────────────────── */
#tools{width:180px;background:var(--panel-bg);padding:8px 6px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
button,select,input[type="range"]{width:100%;background:var(--btn);color:var(--panel-fg);border:none;padding:6px;margin:2px 0;cursor:pointer;}
button:hover{background:var(--btn-hover);}
label{font-size:.85rem;display:block;margin-top:4px}
/* ─── right sidebar (layers + history) ─────────────── */
#sidebar{width:230px;background:var(--panel-bg);display:flex;flex-direction:column;}
.panel{flex:1;overflow:auto;border-top:1px solid #555;padding:6px 4px}
.panel h3{margin:4px 0 6px;font-size:.9rem;border-bottom:1px solid #555;padding-bottom:3px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:3px;border:1px solid #555;margin:2px 0;font-size:.8rem;cursor:pointer}
.list-item.active{background:#555}
.list-item button{flex:0 0 20px;padding:0;height:20px}
canvas#main{flex:1;background:#fff;cursor:crosshair}
input[type="color"]{padding:0;height:32px}
</style>
</head>
<body>

<!-- ─── TOOLS ───────────────────────────────────────── -->
<div id="tools">
  <h3>Tools</h3>
  <button id="brushBtn">Brush (B)</button>
  <button id="eraserBtn">Eraser (E)</button>

  <label>Size <input id="size" type="range" min="1" max="100" value="15"></label>
  <label>Color <input id="color" type="color" value="#000000"></label>

  <h3>Filters</h3>
  <select id="filterSelect">
    <option value="">— choose —</option>
    <option value="grayscale(100%)">Grayscale</option>
    <option value="invert(100%)">Invert</option>
    <option value="blur(3px)">Blur</option>
    <option value="brightness(150%)">Brighten</option>
    <option value="contrast(200%)">High contrast</option>
  </select>
  <button id="applyFilter">Apply to layer</button>

  <h3>History</h3>
  <button id="undoBtn">Undo (Ctrl/Cmd-Z)</button>
  <button id="redoBtn">Redo (Ctrl/Cmd-Y)</button>
</div>

<!-- ─── CANVAS WORKSPACE ────────────────────────────── -->
<canvas id="main" width="1920" height="1080"></canvas>

<!-- ─── SIDEBAR: LAYERS & HISTORY ───────────────────── -->
<div id="sidebar">
  <div id="layers" class="panel">
    <h3>Layers</h3>
    <button id="addLayerBtn">+ Add layer</button>
    <div id="layerList"></div>
    <label>Blend
      <select id="blendMode">
        <option>source-over</option><option>multiply</option>
        <option>screen</option><option>overlay</option>
        <option>darken</option><option>lighten</option>
        <option>color-dodge</option><option>color-burn</option>
        <option>hard-light</option><option>soft-light</option>
        <option>difference</option><option>exclusion</option>
      </select>
    </label>
  </div>
  <div id="history" class="panel">
    <h3>History (read-only list)</h3>
    <div id="historyList"></div>
  </div>
</div>

<script>
/* ===========================================================================
 * VERY SMALL “PHOTOSHOP” ENGINE – ES6, no libs
 * =========================================================================== */
const W = 1920, H = 1080;
const mainCanvas = document.getElementById('main');
const mainCtx    = mainCanvas.getContext('2d');
let   layers     = [];
let   current    = 0;           // index of active layer
let   tool       = 'brush';     // or 'eraser'
let   history    = [], historyPos = -1;

/* ─── helpers ─────────────────────────────────────── */
const $ = id=>document.getElementById(id);
function newLayer(name){
  const c=document.createElement('canvas');
  c.width=W;c.height=H;
  return {name,canvas:c,ctx:c.getContext('2d'),
    visible:true,blend:'source-over'};
}
function pushHistory(action){
  // truncate redo part
  history = history.slice(0,historyPos+1);
  history.push(action); historyPos++;
  renderHistory();
}
function applyFilter(filter){
  const l=layers[current]; if(!l) return;
  l.ctx.save();
  l.ctx.filter = filter;
  l.ctx.drawImage(l.canvas,0,0);
  l.ctx.restore();
  pushHistory('Filter: '+filter);
  redraw();
}

/* ─── UI rendering ─────────────────────────────────── */
function renderLayerList(){
  const list=$('layerList'); list.innerHTML='';
  layers.forEach((l,i)=>{
    const item=document.createElement('div');
    item.className='list-item'+(i===current?' active':'');
    item.innerHTML=`${l.visible?'👁':'🚫'} ${l.name}`;
    item.onclick=()=>{current=i;$('blendMode').value=l.blend;renderLayerList();}
    list.appendChild(item);
  });
}
function renderHistory(){
  const list=$('historyList'); list.innerHTML='';
  history.forEach((h,i)=>{
    const item=document.createElement('div');
    item.className='list-item'+(i===historyPos?' active':'');
    item.textContent=h; list.appendChild(item);
  });
}

/* ─── drawing & compositing ────────────────────────── */
function redraw(){
  mainCtx.clearRect(0,0,W,H);
  layers.forEach(l=>{
    if(!l.visible) return;
    mainCtx.save();
    mainCtx.globalCompositeOperation = l.blend;
    mainCtx.drawImage(l.canvas,0,0);
    mainCtx.restore();
  });
}
function beginStroke(x,y){
  const l=layers[current]; if(!l) return;
  l.ctx.lineWidth=$('size').value;
  l.ctx.lineCap=l.ctx.lineJoin='round';
  l.ctx.strokeStyle=tool==='eraser'?'rgba(0,0,0,1)':
                    $('color').value;
  l.ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';
  l.ctx.beginPath();
  l.ctx.moveTo(x,y);
}
function drawStroke(x,y){
  const l=layers[current]; if(!l) return;
  l.ctx.lineTo(x,y); l.ctx.stroke(); redraw();
}

/* ─── event wiring ─────────────────────────────────── */
let drawing=false;
mainCanvas.addEventListener('mousedown',e=>{
  drawing=true; beginStroke(e.offsetX,e.offsetY);
});
mainCanvas.addEventListener('mousemove',e=>{
  if(drawing) drawStroke(e.offsetX,e.offsetY);
});
['mouseup','mouseleave'].forEach(ev=>mainCanvas.addEventListener(ev,()=>{drawing=false; if(ev==='mouseup') pushHistory('Stroke')}));

$('brushBtn').onclick=()=>tool='brush';
$('eraserBtn').onclick=()=>tool='eraser';
$('addLayerBtn').onclick=()=>{layers.push(newLayer('Layer '+layers.length));current=layers.length-1;pushHistory('Add layer');renderLayerList();redraw()};
$('blendMode').onchange=e=>{layers[current].blend=e.target.value;renderLayerList();redraw()};
$('applyFilter').onclick=()=>{const f=$('filterSelect').value;if(f) applyFilter(f)};
$('undoBtn').onclick=undo; $('redoBtn').onclick=redo;
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();undo();}
  if((e.metaKey||e.ctrlKey)&&e.key==='y'){e.preventDefault();redo();}
});
function undo(){
  if(historyPos<0) return;
  historyPos--; restoreFromHistory();
}
function redo(){
  if(historyPos>=history.length-1) return;
  historyPos++; restoreFromHistory();
}
function restoreFromHistory(){
  // rudimentary: for demo we simply rebuild everything by replay
  layers=[newLayer('Background')]; current=0;
  for(let i=0;i<=historyPos;i++){
    const h=history[i];
    if(h==='Add layer'){layers.push(newLayer('Layer '+(layers.length)));current=layers.length-1}
    if(h.startsWith('Filter:')){applyFilter(h.split(':')[1].trim())}
    // strokes are not replayed (keeping demo simple)
  }
  renderLayerList(); renderHistory(); redraw();
}

/* ─── bootstrap ────────────────────────────────────── */
layers.push(newLayer('Background'));
renderLayerList(); pushHistory('Init'); redraw();
</script>
</body>
</html>
