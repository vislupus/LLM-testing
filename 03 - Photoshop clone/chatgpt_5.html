<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PixelStudio — Browser Photoshop‑style Editor (Standalone)</title>
<style>
  :root{
    --bg:#0b1220;--panel:#0f172a;--panel-2:#111a2e;--line:#22314f;--text:#e7eefc;--muted:#8aa0c6;--accent:#60a5fa;--accent-2:#2563eb;--danger:#ef4444;
    --tool:#1b2a4a; --tool-hover:#24395f;--chip:#1e2b49; --chip-active:#203a6a; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0a1224,#0b1220);color:var(--text);}
  .app{display:grid;grid-template-areas:"toolbar toolbar" "sidebar canvas" "bottom bottom";grid-template-columns:280px 1fr;grid-template-rows:auto 1fr auto;gap:0;height:100%}
  .toolbar{grid-area:toolbar;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .toolbar .group{display:flex;gap:6px;align-items:center;padding-right:10px;border-right:1px dashed var(--line)}
  .toolbar .group:last-child{border-right:none}
  .toolbar button,.toolbar select,.toolbar input[type=color],.toolbar input[type=range]{background:var(--tool);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px}
  .toolbar button:hover{background:var(--tool-hover);cursor:pointer}
  .toolbar .label{font-size:12px;color:var(--muted)}

  .sidebar{grid-area:sidebar;display:flex;flex-direction:column;height:100%;background:var(--panel);border-right:1px solid var(--line)}
  .side-header{padding:8px 10px;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;border-bottom:1px solid var(--line)}
  .section{padding:8px;border-bottom:1px solid var(--line)}
  .toolbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tbtn{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;user-select:none}
  .tbtn.active{background:var(--chip-active);border-color:#2f4d80}

  .layers{max-height:32vh;overflow:auto}
  .layer{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin-bottom:8px}
  .layer input[type="text"]{width:100%;background:transparent;border:none;color:var(--text);outline:none}
  .eye{cursor:pointer}
  .layer-controls{display:flex;gap:6px}
  .layer-controls button{background:var(--tool);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
  .blend-row{display:flex;gap:8px;align-items:center;margin-top:6px}
  .blend-row select,.blend-row input[type=range]{flex:1}

  .history{max-height:28vh;overflow:auto}
  .hitem{padding:6px;border:1px solid var(--line);border-radius:8px;background:#0e1a30;margin-bottom:6px;cursor:pointer;font-size:13px}
  .hitem.active{outline:2px solid var(--accent)}

  .canvas-area{grid-area:canvas;position:relative;overflow:auto;background:repeating-conic-gradient(#32435f 0% 25%, #2a3853 0% 50%) 0 / 24px 24px}
  .workspace{position:relative;display:inline-block;transform-origin:0 0; margin:30px;}
  .stage{position:absolute;left:0;top:0}
  canvas.layer-canvas{position:absolute;left:0;top:0;image-rendering:auto;background:transparent}
  .checker{position:absolute;inset:0;background:conic-gradient(#ccc 0 25%,#fff 0 50%) 0/16px 16px;opacity:.35}
  .frame{position:absolute;inset:0;border:1px solid #4b5f85;pointer-events:none}

  .bottom{grid-area:bottom;display:flex;align-items:center;gap:12px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
  .bottom input[type=range]{width:200px}

  .pill{padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--tool)}
  .warn{color:#fde68a}
  .ok{color:var(--ok)}
  .danger{color:var(--danger)}

  .hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar" id="toolbar">
    <div class="group">
      <button id="newBtn" title="New project">New</button>
      <label class="label">Size</label>
      <input id="wInput" type="number" min="16" value="1024" style="width:88px" /> ×
      <input id="hInput" type="number" min="16" value="768" style="width:88px" />
      <button id="resizeBtn" title="Resize canvas">Resize</button>
    </div>
    <div class="group">
      <input type="color" id="color" value="#3b82f6" title="Foreground color" />
      <label class="label">Brush</label>
      <input id="size" type="range" min="1" max="200" value="24" />
      <label class="label">Hard</label>
      <input id="hard" type="range" min="0" max="1" step="0.05" value="0.7" />
      <button id="pickerBtn" title="Eyedropper">🎯</button>
      <button id="clearBtn" title="Clear layer">Clear</button>
    </div>
    <div class="group">
      <select id="filterSelect" title="Filters">
        <option value="">Filters…</option>
        <option value="grayscale">Grayscale</option>
        <option value="invert">Invert</option>
        <option value="brightness">Brightness +20%</option>
        <option value="contrast">Contrast +20%</option>
        <option value="saturate">Saturate +30%</option>
        <option value="desaturate">Desaturate 30%</option>
        <option value="huerotate">Hue +45°</option>
        <option value="blur">Blur 3px</option>
        <option value="sharpen">Sharpen</option>
      </select>
      <button id="applyFilter">Apply</button>
    </div>
    <div class="group">
      <button id="undoBtn" title="Undo (Ctrl+Z)">⟲ Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Y)">⟳ Redo</button>
      <button id="exportBtn" title="Export PNG">Export</button>
      <label class="tbtn" style="padding:6px 10px;cursor:pointer">Import<input id="importInput" type="file" accept="image/*" class="hidden" /></label>
    </div>
    <div class="group">
      <span class="pill" id="tip">Tip: Hold Space to pan • Scroll to zoom</span>
    </div>
  </div>

  <div class="sidebar">
    <div class="side-header">Tools</div>
    <div class="section">
      <div class="toolbox" id="tools">
        <div class="tbtn active" data-tool="brush" title="Brush">🖌️</div>
        <div class="tbtn" data-tool="eraser" title="Eraser">🧽</div>
        <div class="tbtn" data-tool="line" title="Line">／</div>
        <div class="tbtn" data-tool="rect" title="Rectangle">▭</div>
        <div class="tbtn" data-tool="ellipse" title="Ellipse">◯</div>
        <div class="tbtn" data-tool="text" title="Text">T</div>
        <div class="tbtn" data-tool="move" title="Move Layer">🞂</div>
        <div class="tbtn" data-tool="fill" title="Fill Layer">▮</div>
      </div>
    </div>

    <div class="side-header">Layers</div>
    <div class="section">
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button id="addLayer">＋ Layer</button>
        <button id="dupLayer">⧉</button>
        <button id="delLayer" class="danger">✖</button>
        <button id="upLayer">⬆</button>
        <button id="downLayer">⬇</button>
      </div>
      <div class="blend-row">
        <label class="label">Blend</label>
        <select id="blend">
          <option>normal</option>
          <option>multiply</option>
          <option>screen</option>
          <option>overlay</option>
          <option>darken</option>
          <option>lighten</option>
          <option>color-dodge</option>
          <option>color-burn</option>
          <option>hard-light</option>
          <option>soft-light</option>
          <option>difference</option>
          <option>exclusion</option>
          <option>hue</option>
          <option>saturation</option>
          <option>color</option>
          <option>luminosity</option>
        </select>
      </div>
      <div class="blend-row">
        <label class="label">Opacity</label>
        <input id="opacity" type="range" min="0" max="1" step="0.01" value="1" />
      </div>
      <div class="layers" id="layerList"></div>
    </div>

    <div class="side-header">History</div>
    <div class="section">
      <div class="history" id="history"></div>
    </div>
  </div>

  <div class="canvas-area" id="canvasArea">
    <div class="workspace" id="workspace">
      <div class="checker"></div>
      <div class="frame" id="frame"></div>
      <!-- layer canvases inserted here -->
    </div>
  </div>

  <div class="bottom">
    <label class="label">Zoom</label>
    <input id="zoom" type="range" min="0.2" max="4" step="0.05" value="1" />
    <span id="zoomVal">100%</span>
    <span class="pill">Active: <strong id="activeInfo">Layer 1 • brush</strong></span>
    <span id="status" class="pill"></span>
  </div>
</div>

<script>
(() => {
  // ====== State ======
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

  const workspace = $('#workspace');
  const canvasArea = $('#canvasArea');
  const frame = $('#frame');
  const layerList = $('#layerList');
  const historyEl = $('#history');

  const colorInput = $('#color');
  const sizeInput = $('#size');
  const hardInput = $('#hard');
  const zoomInput = $('#zoom');
  const zoomVal = $('#zoomVal');
  const pickerBtn = $('#pickerBtn');

  const blendSel = $('#blend');
  const opacityRange = $('#opacity');

  const wInput = $('#wInput');
  const hInput = $('#hInput');

  const filterSel = $('#filterSelect');
  const status = $('#status');
  const activeInfo = $('#activeInfo');

  const tools = $('#tools');
  const toolButtons = $$('.tbtn', tools);

  const history = []; // array of snapshots
  let hIndex = -1;

  const project = {
    width: parseInt(wInput.value,10),
    height: parseInt(hInput.value,10),
    zoom: 1,
    pan: {x:0,y:0},
    layers: [], // {id,name,canvas,ctx,x,y,visible,opacity,blend}
    active: 0,
    tool: 'brush'
  };

  function mkId(){ return Math.random().toString(36).slice(2,9); }

  // ====== Canvas & Layers ======
  function createLayer(name){
    const c = document.createElement('canvas');
    c.width = project.width; c.height = project.height; c.className = 'layer-canvas';
    const ctx = c.getContext('2d'); ctx.lineCap='round'; ctx.lineJoin='round';
    const layer = { id: mkId(), name, canvas:c, ctx, x:0, y:0, visible:true, opacity:1, blend:'normal' };
    workspace.appendChild(c);
    updateLayerRender(layer);
    return layer;
  }

  function updateWorkspaceSize(){
    workspace.style.width = project.width + 'px';
    workspace.style.height = project.height + 'px';
    frame.style.width = '100%'; frame.style.height = '100%';
  }

  function updateLayerRender(layer){
    layer.canvas.style.left = layer.x + 'px';
    layer.canvas.style.top = layer.y + 'px';
    layer.canvas.style.opacity = layer.opacity;
    layer.canvas.style.mixBlendMode = layer.blend;
    layer.canvas.style.display = layer.visible ? 'block' : 'none';
    layer.canvas.width = layer.canvas.width; // keeps size but clears CSS transforms on resize ops if any
    layer.canvas.width = project.width; layer.canvas.height = project.height; // ensure proper size after project resize
  }

  function rebuildLayerOrder(){
    // maintain DOM order = stacking order (bottom to top)
    project.layers.forEach(l => workspace.appendChild(l.canvas));
    renderLayerList();
  }

  function renderLayerList(){
    layerList.innerHTML = '';
    // top-most first in UI
    [...project.layers].map((l,i)=>({l,i})).reverse().forEach(({l,i})=>{
      const row = document.createElement('div'); row.className = 'layer'; row.dataset.id = l.id;
      const eye = document.createElement('div'); eye.className='eye'; eye.textContent = l.visible? '👁' : '🚫';
      eye.onclick = ()=>{ l.visible = !l.visible; eye.textContent = l.visible? '👁' : '🚫'; l.canvas.style.display = l.visible? 'block':'none'; pushHistory('Toggle visibility'); };
      const name = document.createElement('input'); name.type='text'; name.value = l.name; name.onchange = ()=>{ l.name = name.value; renderLayerList(); pushHistory('Rename layer'); };
      const ctr = document.createElement('div'); ctr.className='layer-controls';
      const sel = document.createElement('button'); sel.textContent='Select'; sel.onclick=()=>{ project.active = i; updateSideBindings(); };
      ctr.appendChild(sel);
      row.appendChild(eye); row.appendChild(name); row.appendChild(ctr);
      if(i===project.active) row.style.outline = '2px solid var(--accent)';
      layerList.appendChild(row);
    });
  }

  function addLayer(name){ project.layers.push(createLayer(name||('Layer '+(project.layers.length+1)))); project.active = project.layers.length-1; rebuildLayerOrder(); updateSideBindings(); pushHistory('Add layer'); }

  function duplicateLayer(){ const l = project.layers[project.active]; const copy = createLayer(l.name + ' copy'); copy.ctx.drawImage(l.canvas,0,0); copy.opacity=l.opacity; copy.blend=l.blend; copy.visible=l.visible; project.layers.splice(project.active+1,0,copy); project.active++; rebuildLayerOrder(); updateSideBindings(); pushHistory('Duplicate layer'); }

  function deleteLayer(){ if(project.layers.length<=1) return alert('Need at least one layer'); project.layers.splice(project.active,1); project.active = Math.max(0, project.active-1); rebuildLayerOrder(); updateSideBindings(); pushHistory('Delete layer'); }
  function moveLayer(dir){ const i=project.active; const j=i+dir; if(j<0||j>=project.layers.length) return; const [l]=project.layers.splice(i,1); project.layers.splice(j,0,l); project.active=j; rebuildLayerOrder(); updateSideBindings(); pushHistory('Reorder layer'); }

  function updateSideBindings(){ const l = project.layers[project.active]; if(!l) return; blendSel.value = l.blend; opacityRange.value = l.opacity; activeInfo.textContent = `${l.name} • ${project.tool}`; renderLayerList(); }

  // ====== History ======
  function snapshot(){
    const data = {
      width: project.width, height: project.height,
      layers: project.layers.map(l=>({ name:l.name, x:l.x, y:l.y, opacity:l.opacity, blend:l.blend, visible:l.visible, data:l.canvas.toDataURL('image/png') })),
      active: project.active
    };
    return data;
  }
  function restore(snap){
    // clear
    project.width = snap.width; project.height = snap.height; updateWorkspaceSize();
    workspace.querySelectorAll('canvas.layer-canvas').forEach(n=>n.remove());
    project.layers = snap.layers.map(L=>{ const layer = createLayer(L.name); layer.x=L.x; layer.y=L.y; layer.opacity=L.opacity; layer.blend=L.blend; layer.visible=L.visible; updateLayerRender(layer); const img = new Image(); img.onload=()=>{ layer.ctx.clearRect(0,0,project.width,project.height); layer.ctx.drawImage(img,0,0); }; img.src = L.data; return layer; });
    project.active = snap.active; rebuildLayerOrder(); updateSideBindings();
  }
  function pushHistory(label){
    // cut redo branch
    history.splice(hIndex+1);
    history.push({ label, snap: snapshot() });
    hIndex = history.length-1; renderHistory();
  }
  function renderHistory(){
    historyEl.innerHTML='';
    history.forEach((h,idx)=>{
      const d = document.createElement('div'); d.className='hitem'+(idx===hIndex?' active':''); d.textContent = (idx+1)+'. '+h.label; d.onclick=()=>{ hIndex=idx; restore(history[hIndex].snap); renderHistory();}; historyEl.appendChild(d);
    });
  }
  function undo(){ if(hIndex>0){ hIndex--; restore(history[hIndex].snap); renderHistory(); }}
  function redo(){ if(hIndex<history.length-1){ hIndex++; restore(history[hIndex].snap); renderHistory(); }}

  // ====== Tools ======
  function setTool(t){ project.tool = t; toolButtons.forEach(b=>b.classList.toggle('active', b.dataset.tool===t)); activeInfo.textContent = `${project.layers[project.active].name} • ${t}`; }
  toolButtons.forEach(b=> b.onclick = ()=> setTool(b.dataset.tool));

  let isDrawing=false, last=null, tempCanvas=null, tempCtx=null;

  function workspaceToCanvasXY(evt){
    const rect = workspace.getBoundingClientRect();
    const zx = project.zoom; const zy = project.zoom;
    return { x: (evt.clientX - rect.left)/zx, y: (evt.clientY - rect.top)/zy };
  }

  function startTemp(){
    if(!tempCanvas){ tempCanvas = document.createElement('canvas'); tempCanvas.className='layer-canvas'; tempCanvas.width = project.width; tempCanvas.height = project.height; tempCtx = tempCanvas.getContext('2d'); tempCanvas.style.pointerEvents='none'; tempCanvas.style.mixBlendMode='normal'; tempCanvas.style.opacity='1'; workspace.appendChild(tempCanvas); }
    tempCtx.clearRect(0,0,project.width,project.height);
  }
  function clearTemp(){ if(tempCanvas){ tempCtx.clearRect(0,0,project.width,project.height); tempCanvas.remove(); tempCanvas=null; tempCtx=null; }
  }

  function stampBrush(ctx,x,y,color,size,hard){
    const r=size/2; const g = ctx.createRadialGradient(x,y, r*hard, x,y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  function drawLineBrush(ctx,x1,y1,x2,y2,color,size,hard,erase=false){
    const dist = Math.hypot(x2-x1, y2-y1); const steps = Math.max(1, Math.ceil(dist/(size*0.4)));
    ctx.save(); if(erase){ ctx.globalCompositeOperation='destination-out'; }
    for(let i=0;i<=steps;i++){ const t=i/steps; const x=x1+(x2-x1)*t, y=y1+(y2-y1)*t; stampBrush(ctx,x,y,color,size,hard); }
    ctx.restore();
  }

  function onPointerDown(e){
    if(e.button!==0) return;
    const l = project.layers[project.active]; if(!l) return;
    const p = workspaceToCanvasXY(e);
    isDrawing=true; last=p;

    if(project.tool==='brush' || project.tool==='eraser'){
      drawLineBrush(l.ctx,p.x,p.y,p.x,p.y,colorInput.value, +sizeInput.value, +hardInput.value, project.tool==='eraser');
    }
    else if(project.tool==='line' || project.tool==='rect' || project.tool==='ellipse'){
      startTemp();
    }
    else if(project.tool==='text'){
      const t = prompt('Enter text'); if(t){ l.ctx.save(); l.ctx.fillStyle=colorInput.value; l.ctx.font = `${Math.max(8, +sizeInput.value*2)}px system-ui, Arial`; l.ctx.fillText(t, p.x, p.y); l.ctx.restore(); pushHistory('Text'); }
    }
    else if(project.tool==='move'){
      l._start = { x:l.x, y:l.y, px:p.x, py:p.y };
    }
    else if(project.tool==='fill'){
      l.ctx.save(); l.ctx.globalCompositeOperation='source-over'; l.ctx.fillStyle = colorInput.value; l.ctx.fillRect(0,0,project.width,project.height); l.ctx.restore(); pushHistory('Fill layer');
    }
    else if(isPicking){
      pickColorAt(e);
    }
  }
  function onPointerMove(e){
    if(isPicking){ pickPreview(e); return; }
    const l = project.layers[project.active]; if(!l) return;
    const p = workspaceToCanvasXY(e);
    if(!isDrawing) return;

    if(project.tool==='brush' || project.tool==='eraser'){
      drawLineBrush(l.ctx,last.x,last.y,p.x,p.y,colorInput.value,+sizeInput.value,+hardInput.value, project.tool==='eraser');
      last = p;
    }
    else if(project.tool==='line'){
      tempCtx.clearRect(0,0,project.width,project.height); tempCtx.strokeStyle=colorInput.value; tempCtx.lineWidth=+sizeInput.value; tempCtx.beginPath(); tempCtx.moveTo(last.x,last.y); tempCtx.lineTo(p.x,p.y); tempCtx.stroke();
    }
    else if(project.tool==='rect' || project.tool==='ellipse'){
      tempCtx.clearRect(0,0,project.width,project.height); tempCtx.strokeStyle=colorInput.value; tempCtx.lineWidth=+sizeInput.value; const x=Math.min(last.x,p.x), y=Math.min(last.y,p.y), w=Math.abs(p.x-last.x), h=Math.abs(p.y-last.y);
      if(project.tool==='rect'){ tempCtx.strokeRect(x,y,w,h); }
      else { tempCtx.beginPath(); tempCtx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, Math.PI*2); tempCtx.stroke(); }
    }
    else if(project.tool==='move'){
      const dx = p.x - l._start.px, dy = p.y - l._start.py; l.x = l._start.x + dx; l.y = l._start.y + dy; l.canvas.style.left = l.x+'px'; l.canvas.style.top = l.y+'px';
    }
  }
  function onPointerUp(e){
    if(!isDrawing) return; isDrawing=false;
    const l = project.layers[project.active]; if(!l) return;
    const p = workspaceToCanvasXY(e);
    if(project.tool==='brush' || project.tool==='eraser'){
      drawLineBrush(l.ctx,last.x,last.y,p.x,p.y,colorInput.value,+sizeInput.value,+hardInput.value, project.tool==='eraser');
      pushHistory(project.tool==='eraser' ? 'Erase stroke' : 'Brush stroke');
    }
    else if(project.tool==='line' || project.tool==='rect' || project.tool==='ellipse'){
      if(tempCtx){ l.ctx.drawImage(tempCanvas,0,0); clearTemp(); pushHistory(project.tool.charAt(0).toUpperCase()+project.tool.slice(1)); }
    }
    else if(project.tool==='move'){
      pushHistory('Move layer');
    }
  }

  workspace.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  // Pan (Space + drag)
  let panning=false, panStart=null;
  canvasArea.addEventListener('mousedown', (e)=>{ if(e.button===0 && spaceDown){ panning=true; panStart={x:e.clientX, y:e.clientY, sl:canvasArea.scrollLeft, st:canvasArea.scrollTop}; e.preventDefault(); }});
  window.addEventListener('mousemove', (e)=>{ if(panning){ canvasArea.scrollLeft = panStart.sl - (e.clientX-panStart.x); canvasArea.scrollTop = panStart.st - (e.clientY-panStart.y);} });
  window.addEventListener('mouseup', ()=>{ panning=false; });

  // Zoom
  zoomInput.addEventListener('input', ()=> setZoom(+zoomInput.value));
  canvasArea.addEventListener('wheel', (e)=>{ if(e.ctrlKey){ e.preventDefault(); const z = clamp(project.zoom - e.deltaY*0.002, 0.2, 4); zoomInput.value = z; setZoom(z); }} , {passive:false});
  function setZoom(z){ project.zoom = z; workspace.style.transform = `scale(${z})`; zoomVal.textContent = Math.round(z*100)+'%'; }

  // ====== Filters ======
  function applyFilter(name){ const l = project.layers[project.active]; if(!l) return; const off = document.createElement('canvas'); off.width=project.width; off.height=project.height; const octx = off.getContext('2d');
    if(name==='grayscale'||name==='invert'||name==='brightness'||name==='contrast'||name==='saturate'||name==='desaturate'||name==='huerotate'||name==='blur'){
      let f='none'; if(name==='grayscale') f='grayscale(1)'; if(name==='invert') f='invert(1)'; if(name==='brightness') f='brightness(1.2)'; if(name==='contrast') f='contrast(1.2)'; if(name==='saturate') f='saturate(1.3)'; if(name==='desaturate') f='saturate(0.7)'; if(name==='huerotate') f='hue-rotate(45deg)'; if(name==='blur') f='blur(3px)';
      octx.filter = f; octx.drawImage(l.canvas,0,0); l.ctx.clearRect(0,0,project.width,project.height); l.ctx.drawImage(off,0,0);
    } else if(name==='sharpen'){
      const img = l.ctx.getImageData(0,0,project.width,project.height); const out = convolution(img, [0,-1,0,-1,5,-1,0,-1,0], 1, 0); l.ctx.putImageData(out,0,0);
    }
    pushHistory('Filter: '+name);
  }

  function convolution(imageData, kernel, divisor=1, bias=0){
    const w=imageData.width,h=imageData.height; const src=imageData.data; const out=new ImageData(w,h); const dst=out.data; const side=Math.sqrt(kernel.length)|0; const half=side>>1;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      let r=0,g=0,b=0,a=0; for(let ky=0;ky<side;ky++) for(let kx=0;kx<side;kx++){
        const px = clamp(x + kx - half, 0, w-1); const py = clamp(y + ky - half, 0, h-1); const idx = (py*w + px)*4; const wgt = kernel[ky*side + kx]; r+=src[idx]*wgt; g+=src[idx+1]*wgt; b+=src[idx+2]*wgt; a+=src[idx+3]*wgt; }
      const di = (y*w + x)*4; dst[di] = clamp(Math.round(r/divisor + bias),0,255); dst[di+1]=clamp(Math.round(g/divisor + bias),0,255); dst[di+2]=clamp(Math.round(b/divisor + bias),0,255); dst[di+3]=clamp(Math.round(a/divisor + bias),0,255);
    }
    return out;
  }

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  $('#applyFilter').addEventListener('click', ()=>{ const val = filterSel.value; if(!val){ alert('Choose a filter'); return;} applyFilter(val); filterSel.value=''; });

  // ====== Eyedropper ======
  let isPicking=false; pickerBtn.addEventListener('click', ()=>{ isPicking=!isPicking; status.textContent = isPicking? 'Eyedropper active' : ''; });
  function pickPreview(e){ const {r,g,b,a} = sampleAtEvent(e); status.textContent = `rgba(${r},${g},${b},${(a/255).toFixed(2)})`; }
  function pickColorAt(e){ const {r,g,b} = sampleAtEvent(e); const hex = '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); colorInput.value = hex; status.textContent = 'Picked '+hex; isPicking=false; }
  function sampleAtEvent(e){ const p = workspaceToCanvasXY(e); const off = document.createElement('canvas'); off.width=project.width; off.height=project.height; const ictx = off.getContext('2d');
    // Composite visible layers from bottom to top using canvas blend for accurate sampling
    ictx.clearRect(0,0,off.width,off.height);
    for(const l of project.layers){ if(!l.visible) continue; ictx.globalCompositeOperation = l.blend || 'source-over'; ictx.globalAlpha = l.opacity; ictx.drawImage(l.canvas,l.x,l.y); }
    const px = ictx.getImageData(Math.floor(p.x), Math.floor(p.y), 1, 1).data; return {r:px[0],g:px[1],b:px[2],a:px[3]}; }

  // ====== Export / Import ======
  $('#exportBtn').addEventListener('click', ()=>{
    const out = document.createElement('canvas'); out.width=project.width; out.height=project.height; const octx=out.getContext('2d');
    octx.clearRect(0,0,out.width,out.height);
    for(const l of project.layers){ if(!l.visible) continue; octx.globalCompositeOperation = l.blend || 'source-over'; octx.globalAlpha = l.opacity; octx.drawImage(l.canvas,l.x,l.y); }
    const url = out.toDataURL('image/png'); const a = document.createElement('a'); a.href=url; a.download='pixelstudio.png'; a.click();
  });

  $('#importInput').addEventListener('change', ()=>{ const f = $('#importInput').files[0]; if(!f) return; const img = new Image(); img.onload = ()=>{ const layer = createLayer(f.name||'Image'); layer.ctx.drawImage(img,0,0); project.layers.push(layer); project.active=project.layers.length-1; rebuildLayerOrder(); updateSideBindings(); pushHistory('Import image'); }; img.src = URL.createObjectURL(f); $('#importInput').value=''; });

  // ====== Project size / New ======
  function resizeProject(w,h){ project.width=w; project.height=h; updateWorkspaceSize(); project.layers.forEach(updateLayerRender); pushHistory('Resize project'); }
  $('#resizeBtn').addEventListener('click', ()=>{ const w=clamp(parseInt(wInput.value,10),16,4096); const h=clamp(parseInt(hInput.value,10),16,4096); resizeProject(w,h); });
  $('#newBtn').addEventListener('click', ()=>{ if(!confirm('Start new project? Unsaved work will be lost (unless exported).')) return; initProject(parseInt(wInput.value,10), parseInt(hInput.value,10)); });

  // ====== Layer controls ======
  $('#addLayer').addEventListener('click', ()=> addLayer());
  $('#dupLayer').addEventListener('click', duplicateLayer);
  $('#delLayer').addEventListener('click', deleteLayer);
  $('#upLayer').addEventListener('click', ()=> moveLayer(1));
  $('#downLayer').addEventListener('click', ()=> moveLayer(-1));
  blendSel.addEventListener('change', ()=>{ const l=project.layers[project.active]; l.blend = blendSel.value; l.canvas.style.mixBlendMode = l.blend; pushHistory('Blend: '+l.blend); });
  opacityRange.addEventListener('input', ()=>{ const l=project.layers[project.active]; l.opacity = +opacityRange.value; l.canvas.style.opacity = l.opacity; });
  opacityRange.addEventListener('change', ()=> pushHistory('Opacity change'));

  // ====== Keyboard ======
  let spaceDown=false;
  window.addEventListener('keydown', (e)=>{
    if(e.code==='Space'){ spaceDown=true; canvasArea.style.cursor='grab'; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
    if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
    if(e.key==='['){ sizeInput.value = Math.max(1, +sizeInput.value-1); }
    if(e.key===']'){ sizeInput.value = Math.min(200, +sizeInput.value+1); }
    if(e.key==='v' && (e.ctrlKey||e.metaKey)){ navigator.clipboard.read().then(items=>{ // try paste image
      for(const it of items){ for(const type of it.types){ if(type.startsWith('image/')){ it.getType(type).then(blob=>{ const img=new Image(); img.onload=()=>{ const layer=createLayer('Pasted'); layer.ctx.drawImage(img,0,0); project.layers.push(layer); project.active=project.layers.length-1; rebuildLayerOrder(); updateSideBindings(); pushHistory('Paste image'); }; img.src=URL.createObjectURL(blob); }); return; } } }
    }).catch(()=>{}); }
  });
  window.addEventListener('keyup', (e)=>{ if(e.code==='Space'){ spaceDown=false; canvasArea.style.cursor='default'; }});

  // ====== Init ======
  function initProject(w,h){
    project.width=w; project.height=h; project.layers=[]; workspace.querySelectorAll('canvas.layer-canvas').forEach(n=>n.remove()); updateWorkspaceSize();
    addLayer('Layer 1'); pushHistory('Init');
  }

  setZoom(1);
  initProject(project.width, project.height);

})();
</script>
</body>
</html>
