<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PixelForge Studio</title>
<style>
  :root{
    --bg:#17191d;--panel:#202329;--panel2:#272b32;--panel3:#30353e;--line:#3a3f49;
    --text:#e9edf2;--muted:#a9b0bb;--accent:#2d8cff;--danger:#ef5b68;--good:#55c58a;
    --shadow:0 12px 40px rgba(0,0,0,.38);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 Inter,Segoe UI,Arial,sans-serif;user-select:none}
  button,input,select{font:inherit;color:inherit}
  button{border:0;background:transparent;cursor:pointer}
  .app{height:100%;display:grid;grid-template-rows:36px 46px 1fr 25px}
  .menubar{display:flex;align-items:center;background:#111317;border-bottom:1px solid #090a0d;padding:0 10px;gap:2px}
  .brand{font-weight:800;letter-spacing:.2px;margin-right:15px;color:#fff}.brand b{color:#39a1ff}
  .menu{padding:8px 10px;border-radius:5px}.menu:hover{background:#2a2e35}
  .toolbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid #111317;min-width:0;overflow-x:auto}
  .tool-label{color:var(--muted);white-space:nowrap}.toolbar input[type=range]{width:105px}.toolbar input[type=number]{width:62px}
  .icon-btn,.chip,.tool-btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;color:var(--text)}
  .icon-btn{height:30px;min-width:30px;padding:0 9px}.icon-btn:hover,.chip:hover{background:var(--panel3)}
  .icon-btn.active{background:var(--accent);border-color:var(--accent)}
  .sep{height:25px;width:1px;background:var(--line);margin:0 3px}
  .workspace{min-height:0;display:grid;grid-template-columns:54px 1fr 292px}
  .tools{background:var(--panel);border-right:1px solid #101216;padding:7px 5px;display:grid;grid-template-columns:1fr;align-content:start;gap:5px;overflow-y:auto}
  .tool-btn{height:40px;display:grid;place-items:center;font-size:17px;position:relative}
  .tool-btn:hover{background:var(--panel3)}.tool-btn.active{background:var(--accent);border-color:#62abff}
  .tool-btn small{position:absolute;right:3px;bottom:1px;font-size:8px;color:#d8dde5}
  .stage{position:relative;min-width:0;min-height:0;background:#0e1013;overflow:hidden}
  .viewport{position:absolute;inset:0;overflow:hidden;cursor:crosshair;background:
    radial-gradient(circle at 50% 45%,rgba(71,76,87,.3),transparent 38%),#15181d}
  .canvas-wrap{position:absolute;left:50%;top:50%;transform-origin:0 0;box-shadow:0 0 0 1px #050608,var(--shadow);background-color:#fff;background-image:linear-gradient(45deg,#d9d9d9 25%,transparent 25%),linear-gradient(-45deg,#d9d9d9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d9d9d9 75%),linear-gradient(-45deg,transparent 75%,#d9d9d9 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  #displayCanvas,#overlayCanvas{display:block;position:absolute;left:0;top:0}.canvas-wrap{width:1000px;height:650px}.canvas-wrap canvas{width:1000px;height:650px}.overlay{pointer-events:none}
  .drop-hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(25,28,34,.86);border:1px solid #474d58;color:#cfd5de;opacity:0;transition:.2s;pointer-events:none}.drop-hint.show{opacity:1}
  .sidebar{background:var(--panel);border-left:1px solid #101216;display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
  .tabs{display:flex;background:#17191d;border-bottom:1px solid #111317}.tab{flex:1;padding:10px 6px;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:#fff;border-color:var(--accent);background:#202329}
  .panel{display:none;min-height:0;overflow:auto}.panel.active{display:block}
  .section{border-bottom:1px solid #111317;padding:12px}.section-title{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:10px}.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{color:var(--muted);min-width:70px}.row input[type=range]{flex:1;min-width:0}.row select,.row input[type=text],.row input[type=number]{background:#17191d;border:1px solid var(--line);border-radius:5px;padding:6px;min-width:0}.row select{flex:1}.row input[type=text]{flex:1}
  .color-swatch{width:34px;height:28px;border:2px solid #fff;border-radius:5px;overflow:hidden;position:relative}.color-swatch input{position:absolute;inset:-8px;width:50px;height:45px;border:0;padding:0}
  .layer-actions{display:flex;gap:5px;flex-wrap:wrap}.layer-list{padding:6px}.layer{display:grid;grid-template-columns:26px 46px 1fr 24px;align-items:center;gap:7px;padding:7px;border:1px solid transparent;border-radius:6px;margin-bottom:4px;background:#24282f}.layer:hover{background:#2b3038}.layer.active{border-color:var(--accent);background:#2a3543}.eye{font-size:15px;color:#dfe5ec}.thumb{width:44px;height:34px;border:1px solid #555b65;background:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}.layer-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drag{color:#69717e;font-size:18px}
  .history-list{padding:6px}.history-item{padding:8px 10px;border-radius:5px;color:#c8ced7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item.current{background:#2b3542;color:#fff}.history-item:hover{background:#292d34}
  .status{display:flex;align-items:center;gap:14px;background:#111317;border-top:1px solid #090a0d;padding:0 9px;color:#aeb5bf}.status .spacer{flex:1}.zoom-range{width:110px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:30}.modal-backdrop.show{display:grid}.modal{width:min(470px,calc(100vw - 28px));background:#242830;border:1px solid #454b56;border-radius:10px;box-shadow:var(--shadow);overflow:hidden}.modal-head{padding:13px 16px;font-weight:800;background:#1b1e23;border-bottom:1px solid #121419}.modal-body{padding:16px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;background:#1d2025;border-top:1px solid #14161a}.primary{background:var(--accent)!important;border-color:var(--accent)!important}.danger{background:#46232a!important;border-color:#7b333f!important}.check{display:flex;gap:8px;align-items:center;color:#d6dbe2}.notice{padding:9px 11px;border-radius:6px;background:#171a20;color:#b9c0ca;margin-top:10px}.menu-pop{position:fixed;z-index:50;min-width:210px;padding:6px;background:#252930;border:1px solid #444a55;border-radius:7px;box-shadow:var(--shadow);display:none}.menu-pop.show{display:block}.menu-pop button{display:flex;justify-content:space-between;width:100%;padding:8px 10px;border-radius:4px;text-align:left}.menu-pop button:hover{background:#343a43}.menu-pop hr{border:0;border-top:1px solid #3b404a;margin:5px}.kbd{color:#929ba8}
  .toast{position:fixed;left:50%;bottom:43px;transform:translate(-50%,20px);background:#15181d;border:1px solid #444a55;border-radius:7px;padding:9px 14px;opacity:0;transition:.2s;z-index:80;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:900px){.workspace{grid-template-columns:46px 1fr}.sidebar{position:absolute;right:0;top:82px;bottom:25px;width:min(292px,86vw);z-index:20;transform:translateX(100%);transition:.2s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.mobile-panels{display:inline-flex!important}.tools{padding-left:3px;padding-right:3px}.tool-btn{height:37px}.toolbar .optional{display:none}}
  @media(min-width:901px){.mobile-panels{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="menubar">
    <div class="brand"><b>Px</b> PixelForge</div>
    <button class="menu" data-menu="fileMenu">File</button>
    <button class="menu" data-menu="editMenu">Edit</button>
    <button class="menu" data-menu="imageMenu">Image</button>
    <button class="menu" data-menu="layerMenu">Layer</button>
    <button class="menu" data-menu="filterMenu">Filter</button>
    <button class="menu" data-menu="viewMenu">View</button>
  </header>

  <div class="toolbar">
    <button id="undoBtn" class="icon-btn" title="Undo (Ctrl+Z)">↶</button>
    <button id="redoBtn" class="icon-btn" title="Redo (Ctrl+Y)">↷</button>
    <div class="sep"></div>
    <span id="toolName" class="tool-label">Brush</span>
    <span class="tool-label">Size</span><input id="sizeInput" type="range" min="1" max="200" value="24"><input id="sizeNum" type="number" min="1" max="200" value="24">
    <span class="tool-label optional">Opacity</span><input id="opacityInput" class="optional" type="range" min="1" max="100" value="100">
    <span class="tool-label optional">Hardness</span><input id="hardnessInput" class="optional" type="range" min="0" max="100" value="85">
    <div class="sep"></div>
    <div class="color-swatch" title="Foreground color"><input id="fgColor" type="color" value="#1e88ff"></div>
    <button id="swapColors" class="icon-btn" title="Swap colors">⇄</button>
    <div class="color-swatch" title="Background color"><input id="bgColor" type="color" value="#ffffff"></div>
    <button id="applyCrop" class="icon-btn" style="display:none">Apply crop</button>
    <button id="togglePanels" class="icon-btn mobile-panels">Panels</button>
  </div>

  <main class="workspace">
    <aside class="tools" aria-label="Tools">
      <button class="tool-btn active" data-tool="brush" title="Brush (B)">🖌<small>B</small></button>
      <button class="tool-btn" data-tool="eraser" title="Eraser (E)">⌫<small>E</small></button>
      <button class="tool-btn" data-tool="move" title="Move layer (V)">✥<small>V</small></button>
      <button class="tool-btn" data-tool="marquee" title="Rectangular selection (M)">▧<small>M</small></button>
      <button class="tool-btn" data-tool="crop" title="Crop (C)">⌗<small>C</small></button>
      <button class="tool-btn" data-tool="fill" title="Fill (G)">◩<small>G</small></button>
      <button class="tool-btn" data-tool="gradient" title="Gradient (D)">◒<small>D</small></button>
      <button class="tool-btn" data-tool="eyedropper" title="Eyedropper (I)">⚗<small>I</small></button>
      <button class="tool-btn" data-tool="line" title="Line (L)">╱<small>L</small></button>
      <button class="tool-btn" data-tool="rect" title="Rectangle (U)">□<small>U</small></button>
      <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)">○<small>O</small></button>
      <button class="tool-btn" data-tool="text" title="Text (T)">T<small>T</small></button>
      <button class="tool-btn" data-tool="hand" title="Hand (H/Space)">✋<small>H</small></button>
      <button class="tool-btn" data-tool="zoom" title="Zoom (Z)">⌕<small>Z</small></button>
    </aside>

    <section class="stage">
      <div id="viewport" class="viewport">
        <div id="canvasWrap" class="canvas-wrap">
          <canvas id="displayCanvas" width="1000" height="650"></canvas>
          <canvas id="overlayCanvas" class="overlay" width="1000" height="650"></canvas>
        </div>
        <div id="dropHint" class="drop-hint">Drop an image to open it as a new layer</div>
      </div>
    </section>

    <aside id="sidebar" class="sidebar">
      <div class="tabs">
        <button class="tab active" data-panel="layersPanel">Layers</button>
        <button class="tab" data-panel="historyPanel">History</button>
        <button class="tab" data-panel="propertiesPanel">Properties</button>
      </div>
      <div id="layersPanel" class="panel active">
        <div class="section">
          <div class="section-title">Layer controls</div>
          <div class="row"><label>Blend</label><select id="blendMode">
            <option value="source-over">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="soft-light">Soft Light</option><option value="hard-light">Hard Light</option><option value="color-dodge">Color Dodge</option><option value="color-burn">Color Burn</option><option value="darken">Darken</option><option value="lighten">Lighten</option><option value="difference">Difference</option><option value="hue">Hue</option><option value="saturation">Saturation</option><option value="color">Color</option><option value="luminosity">Luminosity</option>
          </select></div>
          <div class="row"><label>Opacity</label><input id="layerOpacity" type="range" min="0" max="100" value="100"><span id="layerOpacityValue">100%</span></div>
          <div class="row"><label>Effects</label><label class="check"><input id="shadowFx" type="checkbox"> Shadow</label><label class="check"><input id="glowFx" type="checkbox"> Glow</label></div>
          <div class="layer-actions">
            <button id="addLayer" class="icon-btn">＋ Layer</button><button id="duplicateLayer" class="icon-btn">Duplicate</button><button id="mergeDown" class="icon-btn">Merge ↓</button><button id="deleteLayer" class="icon-btn danger">Delete</button>
          </div>
        </div>
        <div id="layerList" class="layer-list"></div>
      </div>
      <div id="historyPanel" class="panel"><div class="section"><div class="section-title">Edit history <button id="clearHistory" class="icon-btn">Clear</button></div></div><div id="historyList" class="history-list"></div></div>
      <div id="propertiesPanel" class="panel">
        <div class="section">
          <div class="section-title">Document</div>
          <div class="row"><label>Width</label><input id="docW" type="number" value="1000" min="1" max="6000"></div>
          <div class="row"><label>Height</label><input id="docH" type="number" value="650" min="1" max="6000"></div>
          <button id="resizeDoc" class="icon-btn">Resize canvas</button>
        </div>
        <div class="section">
          <div class="section-title">Text tool</div>
          <div class="row"><label>Text</label><input id="textValue" type="text" value="Hello world"></div>
          <div class="row"><label>Font</label><select id="fontFamily"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Courier New</option><option>Trebuchet MS</option></select></div>
          <div class="row"><label>Size</label><input id="fontSize" type="number" value="48" min="6" max="500"></div>
          <div class="row"><label>Style</label><label class="check"><input id="fontBold" type="checkbox"> Bold</label><label class="check"><input id="fontItalic" type="checkbox"> Italic</label></div>
        </div>
        <div class="section">
          <div class="section-title">Selection</div>
          <button id="selectAll" class="icon-btn">Select all</button> <button id="deselect" class="icon-btn">Deselect</button> <button id="clearSelection" class="icon-btn">Clear pixels</button>
          <div id="selectionInfo" class="notice">No active selection.</div>
        </div>
      </div>
    </aside>
  </main>

  <footer class="status"><span id="docInfo">1000 × 650 px</span><span id="cursorInfo">x: 0, y: 0</span><span id="memoryInfo">1 layer</span><span class="spacer"></span><span id="zoomValue">72%</span><input id="zoomRange" class="zoom-range" type="range" min="10" max="300" value="72"></footer>
</div>

<input id="imageInput" type="file" accept="image/*" hidden>
<input id="projectInput" type="file" accept="application/json,.pforge" hidden>

<div id="modalBackdrop" class="modal-backdrop"><div class="modal"><div id="modalTitle" class="modal-head">Dialog</div><div id="modalBody" class="modal-body"></div><div class="modal-foot"><button id="modalCancel" class="icon-btn">Cancel</button><button id="modalOk" class="icon-btn primary">Apply</button></div></div></div>
<div id="toast" class="toast"></div>

<div id="fileMenu" class="menu-pop">
  <button data-action="new">New… <span class="kbd">Ctrl+N</span></button><button data-action="open">Open image… <span class="kbd">Ctrl+O</span></button><button data-action="saveProject">Save project</button><button data-action="openProject">Open project…</button><hr><button data-action="exportPng">Export PNG <span class="kbd">Ctrl+S</span></button><button data-action="exportJpg">Export JPEG</button>
</div>
<div id="editMenu" class="menu-pop">
  <button data-action="undo">Undo <span class="kbd">Ctrl+Z</span></button><button data-action="redo">Redo <span class="kbd">Ctrl+Y</span></button><hr><button data-action="selectAll">Select all <span class="kbd">Ctrl+A</span></button><button data-action="deselect">Deselect <span class="kbd">Ctrl+D</span></button><button data-action="clear">Clear selected area <span class="kbd">Delete</span></button>
</div>
<div id="imageMenu" class="menu-pop">
  <button data-action="resize">Resize canvas…</button><button data-action="rotateLeft">Rotate 90° left</button><button data-action="rotateRight">Rotate 90° right</button><button data-action="flipH">Flip horizontal</button><button data-action="flipV">Flip vertical</button>
</div>
<div id="layerMenu" class="menu-pop">
  <button data-action="addLayer">New layer</button><button data-action="duplicateLayer">Duplicate layer</button><button data-action="renameLayer">Rename layer…</button><button data-action="mergeDown">Merge down</button><button data-action="flatten">Flatten image</button><hr><button data-action="deleteLayer">Delete layer</button>
</div>
<div id="filterMenu" class="menu-pop">
  <button data-filter="brightness">Brightness / Contrast…</button><button data-filter="saturate">Hue / Saturation…</button><button data-filter="blur">Gaussian blur…</button><button data-filter="sharpen">Sharpen</button><button data-filter="pixelate">Pixelate…</button><hr><button data-filter="grayscale">Grayscale</button><button data-filter="sepia">Sepia</button><button data-filter="invert">Invert</button>
</div>
<div id="viewMenu" class="menu-pop">
  <button data-action="zoomIn">Zoom in <span class="kbd">Ctrl++</span></button><button data-action="zoomOut">Zoom out <span class="kbd">Ctrl+-</span></button><button data-action="fit">Fit on screen <span class="kbd">Ctrl+0</span></button><button data-action="actual">100%</button><hr><button data-action="togglePanels">Toggle panels</button>
</div>

<script>
/*
  PixelForge Studio — standalone browser image editor.
  Architecture:
  - Every document layer owns an off-screen HTMLCanvasElement.
  - The visible canvas is rebuilt by compositing visible layers using Canvas 2D blend modes.
  - Undo history stores compact PNG snapshots of each layer plus document metadata.
  - Painting tools write only to the active layer; selections are used as clipping regions.
  - This is an educational editor, not a replacement for a production color-managed application.
*/
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const display = $('#displayCanvas'), dctx = display.getContext('2d', {willReadFrequently:true});
const overlay = $('#overlayCanvas'), octx = overlay.getContext('2d');
const wrap = $('#canvasWrap'), viewport = $('#viewport');
let W=1000,H=650, zoom=.72, panX=0, panY=0, tool='brush', activeId=0, layerCounter=1;
let layers=[], selection=null, cropRect=null, drawing=false, start={x:0,y:0}, last={x:0,y:0}, strokeBackup=null;
let history=[], historyIndex=-1, restoring=false, spaceHand=false, dragLayerId=null;
const settings={size:24, opacity:1, hardness:.85, fg:'#1e88ff', bg:'#ffffff'};

const makeCanvas=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const activeLayer=()=>layers.find(l=>l.id===activeId);
function createLayer(name='Layer '+layerCounter, insertTop=true){
  const c=makeCanvas(), ctx=c.getContext('2d',{willReadFrequently:true});
  const l={id:layerCounter++,name,canvas:c,ctx,visible:true,opacity:1,blend:'source-over',shadow:false,glow:false};
  if(insertTop) layers.push(l); else layers.unshift(l); activeId=l.id; renderLayersUI(); render(); return l;
}
function initDocument(w=1000,h=650){
  W=w;H=h;layers=[];layerCounter=1;activeId=0;selection=null;cropRect=null;history=[];historyIndex=-1;
  setCanvasSize(w,h); const base=createLayer('Background'); base.ctx.fillStyle='#ffffff';base.ctx.fillRect(0,0,W,H);
  const paint=createLayer('Layer 1'); activeId=paint.id; renderLayersUI(); render(); fitToScreen(); commitHistory('New document');
}
function setCanvasSize(w,h){
  W=Math.max(1,Math.min(6000,Math.round(w)));H=Math.max(1,Math.min(6000,Math.round(h)));
  display.width=overlay.width=W; display.height=overlay.height=H; wrap.style.width=W+'px';wrap.style.height=H+'px';
  $('#docW').value=W;$('#docH').value=H;$('#docInfo').textContent=`${W} × ${H} px`; updateTransform();
}
function render(){
  dctx.clearRect(0,0,W,H);
  for(const l of layers){ if(!l.visible) continue; dctx.save(); dctx.globalAlpha=l.opacity; dctx.globalCompositeOperation=l.blend;
    if(l.shadow){dctx.shadowColor='rgba(0,0,0,.55)';dctx.shadowBlur=18;dctx.shadowOffsetX=9;dctx.shadowOffsetY=11}
    if(l.glow){dctx.shadowColor=settings.fg;dctx.shadowBlur=22;dctx.shadowOffsetX=0;dctx.shadowOffsetY=0}
    dctx.drawImage(l.canvas,0,0); dctx.restore(); }
  drawOverlay(); updateStatus();
}
function drawOverlay(){
  octx.clearRect(0,0,W,H);octx.save();octx.lineWidth=Math.max(1,1/zoom);octx.setLineDash([7/zoom,5/zoom]);octx.strokeStyle='#fff';
  if(selection){octx.strokeRect(selection.x+.5,selection.y+.5,selection.w,selection.h);octx.strokeStyle='#111';octx.lineDashOffset=6/zoom;octx.strokeRect(selection.x+.5,selection.y+.5,selection.w,selection.h)}
  if(cropRect){octx.fillStyle='rgba(0,0,0,.42)';octx.fillRect(0,0,W,H);octx.clearRect(cropRect.x,cropRect.y,cropRect.w,cropRect.h);octx.strokeStyle='#fff';octx.strokeRect(cropRect.x,cropRect.y,cropRect.w,cropRect.h);drawThirds(cropRect)}
  octx.restore();
}
function drawThirds(r){octx.beginPath();for(let i=1;i<3;i++){octx.moveTo(r.x+r.w*i/3,r.y);octx.lineTo(r.x+r.w*i/3,r.y+r.h);octx.moveTo(r.x,r.y+r.h*i/3);octx.lineTo(r.x+r.w,r.y+r.h*i/3)}octx.stroke()}
function updateTransform(){wrap.style.transform=`translate(${panX}px,${panY}px) scale(${zoom}) translate(-50%,-50%)`;$('#zoomValue').textContent=Math.round(zoom*100)+'%';$('#zoomRange').value=Math.round(zoom*100)}
function fitToScreen(){const r=viewport.getBoundingClientRect();zoom=Math.min((r.width-80)/W,(r.height-80)/H,1.5);panX=panY=0;updateTransform()}
function screenToCanvas(e){const rect=wrap.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-rect.left)/zoom)),y:Math.max(0,Math.min(H,(e.clientY-rect.top)/zoom))}}
function normalizeRect(a,b){const x=Math.round(Math.min(a.x,b.x)),y=Math.round(Math.min(a.y,b.y));return{x,y,w:Math.max(1,Math.round(Math.abs(b.x-a.x))),h:Math.max(1,Math.round(Math.abs(b.y-a.y)))}}
function withSelection(ctx,fn){ctx.save();if(selection){ctx.beginPath();ctx.rect(selection.x,selection.y,selection.w,selection.h);ctx.clip()}fn();ctx.restore()}

function setTool(t){tool=t;$$('.tool-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('#toolName').textContent=t[0].toUpperCase()+t.slice(1);$('#applyCrop').style.display=t==='crop'&&cropRect?'inline-block':'none';viewport.style.cursor=t==='hand'?'grab':t==='move'?'move':t==='text'?'text':t==='zoom'?'zoom-in':'crosshair'}
$$('.tool-btn').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

function brushPoint(ctx,x,y,erase=false){
  const radius=settings.size/2;ctx.save();ctx.globalAlpha=settings.opacity;ctx.globalCompositeOperation=erase?'destination-out':'source-over';
  if(settings.hardness>=.98){ctx.fillStyle=settings.fg}else{const g=ctx.createRadialGradient(x,y,radius*settings.hardness,x,y,radius);const col=hexToRgb(settings.fg);g.addColorStop(0,`rgba(${col.r},${col.g},${col.b},1)`);g.addColorStop(Math.max(.01,settings.hardness),`rgba(${col.r},${col.g},${col.b},1)`);g.addColorStop(1,`rgba(${col.r},${col.g},${col.b},0)`);ctx.fillStyle=g}

}

function floodFill(x,y){const l=activeLayer();if(!l)return;const ix=Math.floor(x),iy=Math.floor(y);const img=l.ctx.getImageData(0,0,W,H),data=img.data,idx=(iy*W+ix)*4,target=[data[idx],data[idx+1],data[idx+2],data[idx+3]],fill=hexToRgb(settings.fg);const fa=Math.round(settings.opacity*255);if(target[0]===fill.r&&target[1]===fill.g&&target[2]===fill.b&&target[3]===fa)return;
  const inside=(px,py)=>!selection||(px>=selection.x&&px<selection.x+selection.w&&py>=selection.y&&py<selection.y+selection.h);const match=i=>Math.abs(data[i]-target[0])<3&&Math.abs(data[i+1]-target[1])<3&&Math.abs(data[i+2]-target[2])<3&&Math.abs(data[i+3]-target[3])<3;const stack=[[ix,iy]];let count=0;
  while(stack.length&&count<2500000){const [sx,sy]=stack.pop();if(sx<0||sy<0||sx>=W||sy>=H||!inside(sx,sy))continue;let i=(sy*W+sx)*4;if(!match(i))continue;data[i]=fill.r;data[i+1]=fill.g;data[i+2]=fill.b;data[i+3]=fa;count++;stack.push([sx+1,sy],[sx-1,sy],[sx,sy+1],[sx,sy-1])}
  l.ctx.putImageData(img,0,0);commitHistory('Fill');render();
}
function drawShape(type,a,b){const l=activeLayer();if(!l)return;l.ctx.clearRect(0,0,W,H);l.ctx.drawImage(strokeBackup,0,0);const r=normalizeRect(a,b);withSelection(l.ctx,()=>{l.ctx.save();l.ctx.globalAlpha=settings.opacity;l.ctx.strokeStyle=settings.fg;l.ctx.lineWidth=settings.size;l.ctx.lineCap='round';l.ctx.lineJoin='round';l.ctx.beginPath();if(type==='line'){l.ctx.moveTo(a.x,a.y);l.ctx.lineTo(b.x,b.y)}else if(type==='rect'){l.ctx.rect(r.x,r.y,r.w,r.h)}else{l.ctx.ellipse(r.x+r.w/2,r.y+r.h/2,r.w/2,r.h/2,0,0,Math.PI*2)}l.ctx.stroke();l.ctx.restore()});render()}

viewport.addEventListener('pointerdown',e=>{
  if(e.button===1||spaceHand){spaceHand=true;drawing=true;start={x:e.clientX,y:e.clientY};last={x:panX,y:panY};viewport.setPointerCapture(e.pointerId);return}
  const p=screenToCanvas(e);start=last=p;drawing=true;viewport.setPointerCapture(e.pointerId);const l=activeLayer();if(!l)return;
  if(['line','rect','ellipse','move','gradient'].includes(tool)){strokeBackup=makeCanvas();strokeBackup.getContext('2d').drawImage(l.canvas,0,0)}
  if(tool==='brush'){brushPoint(l.ctx,p.x,p.y,false);render()}else if(tool==='eraser'){brushPoint(l.ctx,p.x,p.y,true);render()}else if(tool==='fill'){drawing=false;floodFill(p.x,p.y)}else if(tool==='eyedropper'){const px=dctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;settings.fg=rgbToHex(px[0],px[1],px[2]);$('#fgColor').value=settings.fg;drawing=false;toast('Color sampled')}
  else if(tool==='text'){placeText(p);drawing=false}else if(tool==='zoom'){setZoom(zoom*(e.shiftKey?.8:1.25),e.clientX,e.clientY);drawing=false}
});
viewport.addEventListener('pointermove',e=>{
  if(spaceHand&&drawing){panX=last.x+(e.clientX-start.x);panY=last.y+(e.clientY-start.y);updateTransform();return}
  const p=screenToCanvas(e);$('#cursorInfo').textContent=`x: ${Math.round(p.x)}, y: ${Math.round(p.y)}`;if(!drawing)return;
  const l=activeLayer();if(!l)return;
  if(tool==='brush'){brushSegment(last,p,false);last=p;render()}else if(tool==='eraser'){brushSegment(last,p,true);last=p;render()}else if(['line','rect','ellipse'].includes(tool))drawShape(tool,start,p);
  else if(tool==='move'){l.ctx.clearRect(0,0,W,H);l.ctx.drawImage(strokeBackup,p.x-start.x,p.y-start.y);render()}
  else if(tool==='marquee'){selection=normalizeRect(start,p);updateSelectionInfo();drawOverlay()}
  else if(tool==='crop'){cropRect=normalizeRect(start,p);$('#applyCrop').style.display='inline-block';drawOverlay()}
  else if(tool==='gradient'){l.ctx.clearRect(0,0,W,H);l.ctx.drawImage(strokeBackup,0,0);withSelection(l.ctx,()=>{const g=l.ctx.createLinearGradient(start.x,start.y,p.x,p.y);g.addColorStop(0,settings.fg);g.addColorStop(1,settings.bg);l.ctx.globalAlpha=settings.opacity;l.ctx.fillStyle=g;l.ctx.fillRect(0,0,W,H);l.ctx.globalAlpha=1});render()}
});
viewport.addEventListener('pointerup',e=>{if(spaceHand){drawing=false;spaceHand=false;viewport.releasePointerCapture(e.pointerId);return}if(!drawing)return;drawing=false;viewport.releasePointerCapture(e.pointerId);if(['brush','eraser','line','rect','ellipse','move','gradient'].includes(tool))commitHistory(tool[0].toUpperCase()+tool.slice(1));render()});
viewport.addEventListener('wheel',e=>{e.preventDefault();const factor=e.deltaY<0?1.1:.9;setZoom(zoom*factor,e.clientX,e.clientY)},{passive:false});
viewport.addEventListener('dblclick',()=>{if(tool==='marquee'){selection=null;updateSelectionInfo();drawOverlay()}});

function placeText(p){const l=activeLayer(),txt=$('#textValue').value||'Text';withSelection(l.ctx,()=>{l.ctx.save();l.ctx.globalAlpha=settings.opacity;l.ctx.fillStyle=settings.fg;const style=`${$('#fontItalic').checked?'italic ':''}${$('#fontBold').checked?'bold ':''}${+$('#fontSize').value||48}px ${$('#fontFamily').value}`;l.ctx.font=style;l.ctx.textBaseline='top';l.ctx.fillText(txt,p.x,p.y);l.ctx.restore()});commitHistory('Text');render()}
function setZoom(z,cx,cy){const old=zoom;zoom=Math.max(.1,Math.min(3,z));if(cx!=null){const r=viewport.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);panX=dx-(dx-panX)*(zoom/old);panY=dy-(dy-panY)*(zoom/old)}updateTransform()}

function applyCrop(){if(!cropRect)return;const r=cropRect;for(const l of layers){const n=makeCanvas(r.w,r.h),nctx=n.getContext('2d',{willReadFrequently:true});nctx.drawImage(l.canvas,r.x,r.y,r.w,r.h,0,0,r.w,r.h);l.canvas=n;l.ctx=nctx}selection=null;cropRect=null;setCanvasSize(r.w,r.h);$('#applyCrop').style.display='none';commitHistory('Crop');fitToScreen();renderLayersUI();render()}
$('#applyCrop').onclick=applyCrop;

function clearSelected(){const l=activeLayer();if(!l)return;l.ctx.save();l.ctx.globalCompositeOperation='destination-out';if(selection)l.ctx.fillRect(selection.x,selection.y,selection.w,selection.h);else l.ctx.fillRect(0,0,W,H);l.ctx.restore();commitHistory('Clear');render()}
function selectAll(){selection={x:0,y:0,w:W,h:H};updateSelectionInfo();drawOverlay()}
function deselect(){selection=null;cropRect=null;$('#applyCrop').style.display='none';updateSelectionInfo();drawOverlay()}
function updateSelectionInfo(){$('#selectionInfo').textContent=selection?`${selection.w} × ${selection.h} px at ${selection.x}, ${selection.y}`:'No active selection.'}

function renderLayersUI(){const list=$('#layerList');list.innerHTML='';[...layers].reverse().forEach(l=>{const el=document.createElement('div');el.className='layer'+(l.id===activeId?' active':'');el.draggable=true;el.dataset.id=l.id;const thumb=makeCanvas(44,34),tctx=thumb.getContext('2d');tctx.clearRect(0,0,44,34);tctx.drawImage(l.canvas,0,0,W,H,0,0,44,34);thumb.className='thumb';el.innerHTML=`<button class="eye" title="Toggle visibility">${l.visible?'◉':'○'}</button>`;el.appendChild(thumb);const name=document.createElement('div');name.className='layer-name';name.textContent=l.name;name.title='Double-click to rename';el.appendChild(name);const drag=document.createElement('div');drag.className='drag';drag.textContent='≡';el.appendChild(drag);
    el.onclick=e=>{if(e.target.classList.contains('eye')){l.visible=!l.visible;renderLayersUI();render();return}activeId=l.id;syncLayerControls();renderLayersUI()};name.ondblclick=e=>{e.stopPropagation();renameLayer(l)};
    el.ondragstart=()=>dragLayerId=l.id;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const from=layers.findIndex(x=>x.id===dragLayerId),to=layers.findIndex(x=>x.id===l.id);if(from>=0&&to>=0){const [m]=layers.splice(from,1);layers.splice(to,0,m);commitHistory('Reorder layers');renderLayersUI();render()}};list.appendChild(el)});syncLayerControls()}
function syncLayerControls(){const l=activeLayer();if(!l)return;$('#blendMode').value=l.blend;$('#layerOpacity').value=Math.round(l.opacity*100);$('#layerOpacityValue').textContent=Math.round(l.opacity*100)+'%';$('#shadowFx').checked=l.shadow;$('#glowFx').checked=l.glow}
function addLayer(){createLayer();commitHistory('New layer')}
function deleteLayer(){if(layers.length<=1){toast('At least one layer is required');return}const i=layers.findIndex(l=>l.id===activeId);layers.splice(i,1);activeId=layers[Math.max(0,i-1)].id;commitHistory('Delete layer');renderLayersUI();render()}
function duplicateLayer(){const src=activeLayer();if(!src)return;const l=createLayer(src.name+' copy');l.ctx.drawImage(src.canvas,0,0);Object.assign(l,{opacity:src.opacity,blend:src.blend,shadow:src.shadow,glow:src.glow});commitHistory('Duplicate layer');renderLayersUI();render()}
function mergeDown(){const i=layers.findIndex(l=>l.id===activeId);if(i<=0){toast('No layer below');return}const top=layers[i],bottom=layers[i-1];bottom.ctx.save();bottom.ctx.globalAlpha=top.opacity;bottom.ctx.globalCompositeOperation=top.blend;bottom.ctx.drawImage(top.canvas,0,0);bottom.ctx.restore();layers.splice(i,1);activeId=bottom.id;commitHistory('Merge down');renderLayersUI();render()}
function flatten(){const c=makeCanvas(),ctx=c.getContext('2d',{willReadFrequently:true});for(const l of layers){if(!l.visible)continue;ctx.save();ctx.globalAlpha=l.opacity;ctx.globalCompositeOperation=l.blend;ctx.drawImage(l.canvas,0,0);ctx.restore()}layers=[];const l=createLayer('Flattened');l.canvas=c;l.ctx=ctx;activeId=l.id;commitHistory('Flatten image');renderLayersUI();render()}

$('#addLayer').onclick=addLayer;$('#deleteLayer').onclick=deleteLayer;$('#duplicateLayer').onclick=duplicateLayer;$('#mergeDown').onclick=mergeDown;
$('#blendMode').onchange=e=>{const l=activeLayer();if(l){l.blend=e.target.value;commitHistory('Blend mode');render()}};
$('#layerOpacity').oninput=e=>{const l=activeLayer();if(l){l.opacity=e.target.value/100;$('#layerOpacityValue').textContent=e.target.value+'%';render()}};$('#layerOpacity').onchange=()=>commitHistory('Layer opacity');
$('#shadowFx').onchange=e=>{const l=activeLayer();if(l){l.shadow=e.target.checked;commitHistory('Layer shadow');render()}};$('#glowFx').onchange=e=>{const l=activeLayer();if(l){l.glow=e.target.checked;commitHistory('Layer glow');render()}};

async function commitHistory(label){if(restoring)return;const state={label,w:W,h:H,activeId,layerCounter,selection:selection?{...selection}:null,layers:layers.map(l=>({id:l.id,name:l.name,visible:l.visible,opacity:l.opacity,blend:l.blend,shadow:l.shadow,glow:l.glow,data:l.canvas.toDataURL('image/png')}))};history=history.slice(0,historyIndex+1);history.push(state);if(history.length>24)history.shift();historyIndex=history.length-1;renderHistoryUI()}

async function undo(){if(historyIndex>0){historyIndex--;await restoreState(history[historyIndex]);renderHistoryUI()}}
async function redo(){if(historyIndex<history.length-1){historyIndex++;await restoreState(history[historyIndex]);renderHistoryUI()}}
function renderHistoryUI(){const el=$('#historyList');el.innerHTML='';history.forEach((h,i)=>{const row=document.createElement('div');row.className='history-item'+(i===historyIndex?' current':'');row.textContent=(i===0?'● ':'')+h.label;row.onclick=async()=>{historyIndex=i;await restoreState(h);renderHistoryUI()};el.appendChild(row)});$('#undoBtn').disabled=historyIndex<=0;$('#redoBtn').disabled=historyIndex>=history.length-1}
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#clearHistory').onclick=()=>{if(history[historyIndex]){history=[history[historyIndex]];historyIndex=0;renderHistoryUI();toast('History cleared')}};

function loadImage(src){return new Promise((res,rej)=>{const i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function openImageFile(file,asDocument=false){if(!file)return;const url=URL.createObjectURL(file);const img=await loadImage(url);URL.revokeObjectURL(url);if(asDocument){W=img.naturalWidth;H=img.naturalHeight;layers=[];layerCounter=1;setCanvasSize(W,H);const l=createLayer(file.name.replace(/\.[^.]+$/,''));l.ctx.drawImage(img,0,0);history=[];historyIndex=-1;commitHistory('Open image');fitToScreen()}else{const l=createLayer(file.name);const s=Math.min(W/img.width,H/img.height,1);l.ctx.drawImage(img,(W-img.width*s)/2,(H-img.height*s)/2,img.width*s,img.height*s);commitHistory('Place image')}renderLayersUI();render()}
$('#imageInput').onchange=e=>openImageFile(e.target.files[0],true);
viewport.addEventListener('dragover',e=>{e.preventDefault();$('#dropHint').classList.add('show')});viewport.addEventListener('dragleave',()=>$('#dropHint').classList.remove('show'));viewport.addEventListener('drop',e=>{e.preventDefault();$('#dropHint').classList.remove('show');const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(f)openImageFile(f,false)});

function exportImage(type='image/png'){const c=makeCanvas(),ctx=c.getContext('2d');if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}ctx.drawImage(display,0,0);const a=document.createElement('a');a.download=`pixelforge-${Date.now()}.${type==='image/png'?'png':'jpg'}`;a.href=c.toDataURL(type,.92);a.click();toast('Image exported')}
function saveProject(){const p={app:'PixelForge',version:1,w:W,h:H,activeId,layerCounter,layers:layers.map(l=>({id:l.id,name:l.name,visible:l.visible,opacity:l.opacity,blend:l.blend,shadow:l.shadow,glow:l.glow,data:l.canvas.toDataURL()}))};const blob=new Blob([JSON.stringify(p)],{type:'application/json'});const a=document.createElement('a');a.download='project.pforge';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#projectInput').onchange=async e=>{try{const p=JSON.parse(await e.target.files[0].text());setCanvasSize(p.w,p.h);W=p.w;H=p.h;layers=[];layerCounter=p.layerCounter||1;for(const s of p.layers){const c=makeCanvas(),ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(await loadImage(s.data),0,0);layers.push({...s,canvas:c,ctx})}activeId=p.activeId||layers.at(-1).id;history=[];historyIndex=-1;commitHistory('Open project');fitToScreen();renderLayersUI();render()}catch(err){toast('Could not open project')}};

function pixelate(size){const l=activeLayer();if(!l)return;const sw=Math.max(1,Math.round(W/size)),sh=Math.max(1,Math.round(H/size)),small=makeCanvas(sw,sh),sctx=small.getContext('2d');sctx.imageSmoothingEnabled=false;sctx.drawImage(l.canvas,0,0,sw,sh);l.ctx.clearRect(0,0,W,H);l.ctx.imageSmoothingEnabled=false;l.ctx.drawImage(small,0,0,W,H);l.ctx.imageSmoothingEnabled=true;commitHistory('Pixelate');render()}
function sharpen(){const l=activeLayer(),img=l.ctx.getImageData(0,0,W,H),src=new Uint8ClampedArray(img.data),d=img.data,k=[0,-1,0,-1,5,-1,0,-1,0];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){for(let c=0;c<3;c++){let v=0;for(let ky=-1;ky<=1;ky++)for(let kx=-1;kx<=1;kx++)v+=src[((y+ky)*W+x+kx)*4+c]*k[(ky+1)*3+kx+1];d[(y*W+x)*4+c]=Math.max(0,Math.min(255,v))}}l.ctx.putImageData(img,0,0);commitHistory('Sharpen');render()}

const modal={ok:null,cancel:null};function showModal(title,html,onOk,onCancel){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;modal.ok=onOk;modal.cancel=onCancel;$('#modalBackdrop').classList.add('show')}

$('#modalCancel').onclick=closeModal;$('#modalOk').onclick=()=>{modal.ok?.();$('#modalBackdrop').classList.remove('show');modal.ok=modal.cancel=null};
function adjustmentDialog(type){const l=activeLayer();if(!l)return;const backup=makeCanvas();backup.getContext('2d').drawImage(l.canvas,0,0);let html='',read;
  if(type==='brightness'){html=`<div class="row"><label>Brightness</label><input id="f1" type="range" min="0" max="200" value="100"><span id="fv1">100%</span></div><div class="row"><label>Contrast</label><input id="f2" type="range" min="0" max="200" value="100"><span id="fv2">100%</span></div>`;read=()=>`brightness(${$('#f1').value}%) contrast(${$('#f2').value}%)`}
  else if(type==='saturate'){html=`<div class="row"><label>Hue</label><input id="f1" type="range" min="-180" max="180" value="0"><span id="fv1">0°</span></div><div class="row"><label>Saturation</label><input id="f2" type="range" min="0" max="250" value="100"><span id="fv2">100%</span></div>`;read=()=>`hue-rotate(${$('#f1').value}deg) saturate(${$('#f2').value}%)`}
  else{html=`<div class="row"><label>Radius</label><input id="f1" type="range" min="0" max="40" value="5"><span id="fv1">5 px</span></div>`;read=()=>`blur(${$('#f1').value}px)`}
  showModal(type==='brightness'?'Brightness / Contrast':type==='saturate'?'Hue / Saturation':'Gaussian Blur',html,()=>{commitHistory(type==='blur'?'Gaussian blur':'Adjustment');renderLayersUI()},()=>{l.ctx.clearRect(0,0,W,H);l.ctx.drawImage(backup,0,0);render()});
  const preview=()=>{l.ctx.clearRect(0,0,W,H);l.ctx.filter=read();l.ctx.drawImage(backup,0,0);l.ctx.filter='none';if($('#f1'))$('#fv1').textContent=$('#f1').value+(type==='saturate'?'°':type==='blur'?' px':'%');if($('#f2'))$('#fv2').textContent=$('#f2').value+'%';render()};$('#f1').oninput=preview;if($('#f2'))$('#f2').oninput=preview;
}

function resizeDocument(nw,nh){nw=Math.max(1,Math.min(6000,Math.round(nw)));nh=Math.max(1,Math.min(6000,Math.round(nh)));for(const l of layers){const c=makeCanvas(nw,nh),ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(l.canvas,0,0);l.canvas=c;l.ctx=ctx}setCanvasSize(nw,nh);commitHistory('Resize canvas');fitToScreen();renderLayersUI();render()}

function menuAction(action){hideMenus();switch(action){
 case'new':showModal('New document',`<div class="row"><label>Width</label><input id="nw" type="number" value="1000" min="1" max="6000"></div><div class="row"><label>Height</label><input id="nh" type="number" value="650" min="1" max="6000"></div>`,()=>initDocument(+$(' #nw'.trim()).value,+$('#nh').value));break;
 case'open':$('#imageInput').click();break;case'saveProject':saveProject();break;case'openProject':$('#projectInput').click();break;case'exportPng':exportImage('image/png');break;case'exportJpg':exportImage('image/jpeg');break;case'undo':undo();break;case'redo':redo();break;case'selectAll':selectAll();break;case'deselect':deselect();break;case'clear':clearSelected();break;
 case'resize':showModal('Resize canvas',`<div class="row"><label>Width</label><input id="rw" type="number" value="${W}"></div><div class="row"><label>Height</label><input id="rh" type="number" value="${H}"></div><div class="notice">Existing pixels remain anchored to the top-left.</div>`,()=>resizeDocument(+$('#rw').value,+$('#rh').value));break;
 case'rotateLeft':rotateDocument(-1);break;case'rotateRight':rotateDocument(1);break;case'flipH':flipDocument(true);break;case'flipV':flipDocument(false);break;case'addLayer':addLayer();break;case'duplicateLayer':duplicateLayer();break;case'renameLayer':renameLayer();break;case'mergeDown':mergeDown();break;case'flatten':flatten();break;case'deleteLayer':deleteLayer();break;
 case'zoomIn':setZoom(zoom*1.25);break;case'zoomOut':setZoom(zoom*.8);break;case'fit':fitToScreen();break;case'actual':setZoom(1);break;case'togglePanels':$('#sidebar').classList.toggle('open');break;}}
$$('[data-action]').forEach(b=>b.onclick=()=>menuAction(b.dataset.action));
$$('[data-filter]').forEach(b=>b.onclick=()=>{hideMenus();const f=b.dataset.filter;if(['brightness','saturate','blur'].includes(f))adjustmentDialog(f);else if(f==='pixelate')showModal('Pixelate',`<div class="row"><label>Block size</label><input id="pix" type="range" min="2" max="80" value="12"><span>12 px</span></div>`,()=>pixelate(+$('#pix').value));else if(f==='sharpen')sharpen();else applySimpleFilter(f==='grayscale'?'grayscale(1)':f==='sepia'?'sepia(1)':'invert(1)',f[0].toUpperCase()+f.slice(1))});

function hideMenus(){$$('.menu-pop').forEach(m=>m.classList.remove('show'))}
$$('.menu[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=$('#'+b.dataset.menu),open=m.classList.contains('show');hideMenus();if(!open){const r=b.getBoundingClientRect();m.style.left=r.left+'px';m.style.top=r.bottom+'px';m.classList.add('show')}});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu-pop')&&!e.target.closest('.menu'))hideMenus()});

$('#sizeInput').oninput=e=>{settings.size=+e.target.value;$('#sizeNum').value=settings.size};$('#sizeNum').oninput=e=>{settings.size=Math.max(1,Math.min(200,+e.target.value));$('#sizeInput').value=settings.size};$('#opacityInput').oninput=e=>settings.opacity=e.target.value/100;$('#hardnessInput').oninput=e=>settings.hardness=e.target.value/100;$('#fgColor').oninput=e=>settings.fg=e.target.value;$('#bgColor').oninput=e=>settings.bg=e.target.value;$('#swapColors').onclick=()=>{[settings.fg,settings.bg]=[settings.bg,settings.fg];$('#fgColor').value=settings.fg;$('#bgColor').value=settings.bg};
$('#zoomRange').oninput=e=>setZoom(e.target.value/100);$('#togglePanels').onclick=()=>$('#sidebar').classList.toggle('open');
$('#resizeDoc').onclick=()=>resizeDocument(+$('#docW').value,+$('#docH').value);$('#selectAll').onclick=selectAll;$('#deselect').onclick=deselect;$('#clearSelection').onclick=clearSelected;
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('.panel').forEach(p=>p.classList.toggle('active',p.id===t.dataset.panel))});

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1600)}
function hexToRgb(hex){const n=parseInt(hex.slice(1),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
function updateStatus(){$('#memoryInfo').textContent=`${layers.length} layer${layers.length===1?'':'s'} · ${history.length} states`}

window.addEventListener('keydown',e=>{
  const tag=document.activeElement?.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag)&&!(e.ctrlKey||e.metaKey))return;
  const ctrl=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();if(ctrl&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(ctrl&&k==='y'){e.preventDefault();redo()}else if(ctrl&&k==='s'){e.preventDefault();exportImage()}else if(ctrl&&k==='o'){e.preventDefault();$('#imageInput').click()}else if(ctrl&&k==='n'){e.preventDefault();menuAction('new')}else if(ctrl&&k==='a'){e.preventDefault();selectAll()}else if(ctrl&&k==='d'){e.preventDefault();deselect()}else if(ctrl&&e.key==='0'){e.preventDefault();fitToScreen()}else if(ctrl&&(e.key==='+'||e.key==='=')){e.preventDefault();setZoom(zoom*1.25)}else if(ctrl&&e.key==='-'){e.preventDefault();setZoom(zoom*.8)}else if(e.key==='Delete'){clearSelected()}else if(e.key==='Enter'&&cropRect){applyCrop()}else if(e.key==='Escape'){deselect();closeModal()}
  else if(!ctrl){const map={b:'brush',e:'eraser',v:'move',m:'marquee',c:'crop',g:'fill',d:'gradient',i:'eyedropper',l:'line',u:'rect',o:'ellipse',t:'text',h:'hand',z:'zoom'};if(map[k])setTool(map[k]);if(e.code==='Space'){spaceHand=true;viewport.style.cursor='grab'}}
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){spaceHand=false;setTool(tool)}});window.addEventListener('resize',()=>{if(zoom<1.5)fitToScreen()});

initDocument();
})();
</script>
</body>
</html>
