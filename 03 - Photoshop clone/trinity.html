<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoEditor - Photoshop Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            height: 40px;
            background: #252526;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 10px;
            flex-shrink: 0;
        }

        .logo {
            font-weight: bold;
            font-size: 14px;
            color: #007ce0;
            margin-right: 20px;
        }

        .menu {
            display: flex;
            list-style: none;
        }

        .menu-item {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 3px;
        }

        .menu-item:hover {
            background: #333;
        }

        .options-bar {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .tool-button {
            background: #3c3c3c;
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .tool-button:hover {
            background: #4c4c4c;
        }

        .tool-button.active {
            background: #007ce0;
            border-color: #007ce0;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Toolbar */
        .toolbar {
            width: 50px;
            background: #252526;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            flex-shrink: 0;
        }

        .tool-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
            background: #3c3c3c;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #e0e0e0;
        }

        .tool-icon:hover {
            background: #4c4c4c;
        }

        .tool-icon.active {
            background: #007ce0;
            border-color: #007ce0;
        }

        /* Panels */
        .panels {
            display: flex;
            width: 250px;
            background: #252526;
            border-left: 1px solid #333;
            flex-shrink: 0;
        }

        .panel {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #333;
        }

        .layer-item {
            background: #3c3c3c;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .layer-item:hover {
            background: #4c4c4c;
        }

        .layer-item.active {
            background: #007ce0;
        }

        .layer-visibility {
            margin-right: 8px;
            cursor: pointer;
        }

        .history-item {
            background: #3c3c3c;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }

        .history-item:hover {
            background: #4c4c4c;
        }

        .history-item.active {
            background: #007ce0;
        }

        /* Workspace */
        .workspace {
            flex: 1;
            background: #1e1e1e;
            position: relative;
            overflow: auto;
            display: flex;
            justify-content: center;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            background: white;
            cursor: crosshair;
        }

        #drawingCanvas {
            display: block;
        }

        .layer-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Properties Panel */
        .property-item {
            margin-bottom: 10px;
        }

        .property-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 3px;
        }

        .color-picker {
            width: 100%;
            height: 30px;
            border: 1px solid #555;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 5px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .slider {
            flex: 1;
            height: 4px;
            background: #3c3c3c;
            border-radius: 2px;
            outline: none;
        }

        .slider-value {
            font-size: 12px;
            width: 30px;
        }

        .blend-mode-select {
            width: 100%;
            background: #3c3c3c;
            border: 1px solid #555;
            border-radius: 3px;
            color: #e0e0e0;
            padding: 5px;
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #252526;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 20px;
            width: 300px;
        }

        .modal-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .button {
            padding: 8px 15px;
            background: #3c3c3c;
            border: 1px solid #555;
            border-radius: 3px;
            cursor: pointer;
            color: #e0e0e0;
        }

        .button:hover {
            background: #4c4c4c;
        }

        .button-primary {
            background: #007ce0;
            border-color: #007ce0;
        }

        .button-primary:hover {
            background: #0062ac;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #007ce0;
            color: white;
            padding: 10px 20px;
            border-radius: 3px;
            font-size: 14px;
            z-index: 1001;
            display: none;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #333;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">PhotoEditor</div>
        <ul class="menu">
            <li class="menu-item">File</li>
            <li class="menu-item">Edit</li>
            <li class="menu-item">Image</li>
            <li class="menu-item">Layer</li>
            <li class="menu-item">Select</li>
            <li class="menu-item">Filter</li>
            <li class="menu-item">View</li>
            <li class="menu-item">Help</li>
        </ul>
        <div class="options-bar">
            <button class="tool-button" id="undoBtn">Undo</button>
            <button class="tool-button" id="redoBtn">Redo</button>
            <button class="tool-button" id="saveBtn">Save</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="tool-icon active" data-tool="brush" title="Brush">✒️</div>
            <div class="tool-icon" data-tool="eraser" title="Eraser">🧽</div>
            <div class="tool-icon" data-tool="pencil" title="Pencil">✏️</div>
            <div class="tool-icon" data-tool="line" title="Line">📏</div>
            <div class="tool-icon" data-tool="rectangle" title="Rectangle">⬜</div>
            <div class="tool-icon" data-tool="circle" title="Circle">⭕</div>
            <div class="tool-icon" data-tool="fill" title="Paint Bucket">🪣</div>
            <div class="tool-icon" data-tool="text" title="Text">🔤</div>
            <div class="tool-icon" data-tool="move" title="Move">↔️</div>
            <div class="tool-icon" data-tool="zoom" title="Zoom">🔍</div>
            <div class="tool-icon" data-tool="eyedropper" title="Eyedropper">🧪</div>
        </div>

        <!-- Panels -->
        <div class="panels">
            <!-- Layers Panel -->
            <div class="panel">
                <div class="panel-title">Layers</div>
                <div id="layersList"></div>
                <button class="button" id="addLayerBtn" style="width: 100%; margin-top: 10px;">New Layer</button>
            </div>

            <!-- History Panel -->
            <div class="panel">
                <div class="panel-title">History</div>
                <div id="historyList"></div>
            </div>

            <!-- Properties Panel -->
            <div class="panel">
                <div class="panel-title">Properties</div>
                <div class="property-item">
                    <div class="property-label">Brush Size</div>
                    <div class="slider-container">
                        <input type="range" class="slider" id="brushSize" min="1" max="100" value="10">
                        <span class="slider-value" id="brushSizeValue">10</span>
                    </div>
                </div>
                <div class="property-item">
                    <div class="property-label">Opacity</div>
                    <div class="slider-container">
                        <input type="range" class="slider" id="opacity" min="0" max="100" value="100">
                        <span class="slider-value" id="opacityValue">100</span>
                    </div>
                </div>
                <div class="property-item">
                    <div class="property-label">Color</div>
                    <input type="color" class="color-picker" id="colorPicker" value="#000000">
                </div>
                <div class="property-item">
                    <div class="property-label">Blend Mode</div>
                    <select class="blend-mode-select" id="blendMode">
                        <option value="normal">Normal</option>
                        <option value="multiply">Multiply</option>
                        <option value="screen">Screen</option>
                        <option value="overlay">Overlay</option>
                        <option value="darken">Darken</option>
                        <option value="lighten">Lighten</option>
                        <option value="color-dodge">Color Dodge</option>
                        <option value="color-burn">Color Burn</option>
                        <option value="hard-light">Hard Light</option>
                        <option value="soft-light">Soft Light</option>
                        <option value="difference">Difference</option>
                        <option value="exclusion">Exclusion</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Workspace -->
        <div class="workspace" id="workspace">
            <div class="canvas-container">
                <canvas id="drawingCanvas" width="800" height="600"></canvas>
            </div>
        </div>
    </div>

    <!-- Save Modal -->
    <div class="modal" id="saveModal">
        <div class="modal-content">
            <div class="modal-header">Save Image</div>
            <div>Enter filename:</div>
            <input type="text" id="filenameInput" value="my-drawing.png" style="width: 100%, margin: 10px 0; padding: 5px;">
            <div class="modal-buttons">
                <button class="button" id="cancelSaveBtn">Cancel</button>
                <button class="button button-primary" id="confirmSaveBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">Image saved successfully!</div>

    <script>
        // Main Application State
        const app = {
            currentTool: 'brush',
            isDrawing: false,
            startX: 0,
            startY: 0,
            brushSize: 10,
            opacity: 100,
            color: '#000000',
            blendMode: 'normal',
            history: [],
            historyIndex: -1,
            layers: [],
            currentLayerId: 1,
            selectedLayerId: 1,
            canvas: null,
            ctx: null,
            snapshot: null
        };

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            app.canvas = document.getElementById('drawingCanvas');
            app.ctx = app.canvas.getContext('2d');
            
            // Set initial canvas properties
            app.ctx.lineCap = 'round';
            app.ctx.lineJoin = 'round';
            app.ctx.globalAlpha = app.opacity / 100;
            app.ctx.globalCompositeOperation = app.blendMode;
            
            // Initialize with a white background layer
            app.layers = [{
                id: 1,
                name: 'Background',
                visible: true,
                locked: false,
                canvas: createLayerCanvas()
            }];
            
            // Draw initial white background
            const bgCtx = app.layers[0].canvas.getContext('2d');
            bgCtx.fillStyle = 'white';
            bgCtx.fillRect(0, 0, app.canvas.width, app.canvas.height);
            
            // Save to history
            saveToHistory();
            updateLayersList();
            updateHistoryList();
            
            // Setup event listeners
            setupEventListeners();
            
            // Initial render
            renderCanvas();
        });

        // Create a canvas for a layer
        function createLayerCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = app.canvas.width;
            canvas.height = app.canvas.height;
            return canvas;
        }

        // Setup all event listeners
        function setupEventListeners() {
            // Tool selection
            document.querySelectorAll('.tool-icon').forEach(icon => {
                icon.addEventListener('click', function() {
                    document.querySelectorAll('.tool-icon').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    app.currentTool = this.dataset.tool;
                    showToast(`Tool: ${app.currentTool.charAt(0).toUpperCase() + app.currentTool.slice(1)}`);
                });
            });

            // Canvas drawing events
            app.canvas.addEventListener('mousedown', startDrawing);
            app.canvas.addEventListener('mousemove', draw);
            app.canvas.addEventListener('mouseup', stopDrawing);
            app.canvas.addEventListener('mouseout', stopDrawing);

            // Properties
            document.getElementById('brushSize').addEventListener('input', function() {
                app.brushSize = parseInt(this.value);
                document.getElementById('brushSizeValue').textContent = app.brushSize;
            });

            document.getElementById('opacity').addEventListener('input', function() {
                app.opacity = parseInt(this.value);
                document.getElementById('opacityValue').textContent = app.opacity;
                app.ctx.globalAlpha = app.opacity / 100;
            });

            document.getElementById('colorPicker').addEventListener('input', function() {
                app.color = this.value;
            });

            document.getElementById('blendMode').addEventListener('change', function() {
                app.blendMode = this.value;
                app.ctx.globalCompositeOperation = app.blendMode;
                renderCanvas();
            });

            // Buttons
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);
            document.getElementById('saveBtn').addEventListener('click', openSaveModal);
            document.getElementById('addLayerBtn').addEventListener('click', addLayer);
            document.getElementById('confirmSaveBtn').addEventListener('click', saveImage);
            document.getElementById('cancelSaveBtn').addEventListener('click', closeSaveModal);

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveImage();
                }
            });
        }

        // Drawing functions
        function startDrawing(e) {
            app.isDrawing = true;
            const rect = app.canvas.getBoundingClientRect();
            app.startX = e.clientX - rect.left;
            app.startY = e.clientY - rect.top;
            
            const currentLayer = app.layers.find(l => l.id === app.selectedLayerId);
            if (!currentLayer || !currentLayer.visible) return;
            
            const layerCtx = currentLayer.canvas.getContext('2d');
            
            if (app.currentTool === 'brush' || app.currentTool === 'pencil' || app.currentTool === 'eraser') {
                layerCtx.beginPath();
                layerCtx.moveTo(app.startX, app.startY);
                layerCtx.lineCap = 'round';
                layerCtx.lineJoin = 'round';
                layerCtx.lineWidth = app.brushSize;
                layerCtx.globalAlpha = app.opacity / 100;
                layerCtx.globalCompositeOperation = app.blendMode;
                
                if (app.currentTool === 'eraser') {
                    layerCtx.globalCompositeOperation = 'destination-out';
                } else {
                    layerCtx.strokeStyle = app.color;
                }
            }
        }

        function draw(e) {
            if (!app.isDrawing) return;
            
            const rect = app.canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;
            
            const currentLayer = app.layers.find(l => l.id === app.selectedLayerId);
            if (!currentLayer || !currentLayer.visible) return;
            
            const layerCtx = currentLayer.canvas.getContext('2d');
            
            switch(app.currentTool) {
                case 'brush':
                case 'pencil':
                case 'eraser':
                    layerCtx.lineTo(currentX, currentY);
                    layerCtx.stroke();
                    break;
                case 'line':
                    // Clear the layer and redraw everything except current line
                    renderCanvas();
                    layerCtx.beginPath();
                    layerCtx.moveTo(app.startX, app.startY);
                    layerCtx.lineTo(currentX, currentY);
                    layerCtx.stroke();
                    break;
                case 'rectangle':
                    renderCanvas();
                    drawRectangle(layerCtx, app.startX, app.startY, currentX, currentY);
                    break;
                case 'circle':
                    renderCanvas();
                    drawCircle(layerCtx, app.startX, app.startY, currentX, currentY);
                    break;
                case 'fill':
                    // Bucket fill - use current layer
                    applyBucketFill(currentLayer.canvas, currentX, currentY, app.color);
                    renderCanvas();
                    saveToHistory();
                    app.isDrawing = false;
                    return;
                case 'text':
                    // Text tool - create a temporary overlay
                    renderCanvas();
                    drawText(layerCtx, app.startX, app.startY, currentX, currentY);
                    break;
                case 'move':
                    // Move tool - simple implementation
                    break;
            }
        }

        function stopDrawing() {
            if (!app.isDrawing) return;
            app.isDrawing = false;
            
            if (app.currentTool === 'brush' || app.currentTool === 'pencil' || app.currentTool === 'eraser' ||
                app.currentTool === 'line' || app.currentTool === 'rectangle' || app.currentTool === 'circle' ||
                app.currentTool === 'fill' || app.currentTool === 'text') {
                saveToHistory();
                renderCanvas();
            }
        }

        // Drawing helper functions
        function drawRectangle(ctx, x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.rect(x1, y1, x2 - x1, y2 - y1);
            ctx.strokeStyle = app.color;
            ctx.lineWidth = app.brushSize;
            ctx.globalAlpha = app.opacity / 100;
            ctx.stroke();
        }

        function drawCircle(ctx, x1, y1, x2, y2) {
            ctx.beginPath();
            const radius = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            ctx.arc(x1, y1, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = app.color;
            ctx.lineWidth = app.brushSize;
            ctx.globalAlpha = app.opacity / 100;
            ctx.stroke();
        }

        function drawText(ctx, x1, y1, x2, y2) {
            const text = prompt("Enter text:", "Text");
            if (text) {
                ctx.font = `${app.brushSize * 2}px Arial`;
                ctx.fillStyle = app.color;
                ctx.globalAlpha = app.opacity / 100;
                ctx.fillText(text, x1, y1);
            }
        }

        function applyBucketFill(canvas, x, y, color) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // Get target color at clicked pixel
            const pixelIndex = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
            const targetR = data[pixelIndex];
            const targetG = data[pixelIndex + 1];
            const targetB = data[pixelIndex + 2];
            const targetA = data[pixelIndex + 3];
            
            // Convert hex color to rgba
            const r = parseInt(color.substr(1, 2), 16);
            const g = parseInt(color.substr(3, 2), 16);
            const b = parseInt(color.substr(5, 2), 16);
            
            // Simple flood fill algorithm
            const stack = [[Math.floor(x), Math.floor(y)]];
            
            while (stack.length) {
                const [currentX, currentY] = stack.pop();
                const index = (currentY * canvas.width + currentX) * 4;
                
                if (currentX < 0 || currentX >= canvas.width || currentY < 0 || currentY >= canvas.height) continue;
                
                const matchesTarget = 
                    data[index] === targetR &&
                    data[index + 1] === targetG &&
                    data[index + 2] === targetB &&
                    data[index + 3] === targetA;
                
                if (!matchesTarget) continue;
                
                // Fill pixel
                data[index] = r;
                data[index + 1] = g;
                data[index + 2] = b;
                data[index + 3] = 255; // Fully opaque
                
                // Add neighbors to stack
                stack.push([currentX + 1, currentY]);
                stack.push([currentX - 1, currentY]);
                stack.push([currentX, currentY + 1]);
                stack.push([currentX, currentY - 1]);
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        // Render canvas from all layers
        function renderCanvas() {
            // Clear the main canvas
            app.ctx.clearRect(0, 0, app.canvas.width, app.canvas.height);
            
            // Draw each visible layer
            app.layers.forEach(layer => {
                if (layer.visible) {
                    app.ctx.drawImage(layer.canvas, 0, 0);
                }
            });
        }

        // History management
        function saveToHistory() {
            // Remove any redo states ahead of current index
            if (app.historyIndex < app.history.length - 1) {
                app.history = app.history.slice(0, app.historyIndex + 1);
            }
            
            // Save current state of all layers
            const state = app.layers.map(layer => ({
                id: layer.id,
                name: layer.name,
                visible: layer.visible,
                canvas: layer.canvas.toDataURL()
            }));
            
            app.history.push(state);
            app.historyIndex = app.history.length - 1;
            
            // Limit history to 20 steps
            if (app.history.length > 20) {
                app.history.shift();
                app.historyIndex--;
            }
            
            updateHistoryList();
        }

        function undo() {
            if (app.historyIndex > 0) {
                app.historyIndex--;
                restoreFromHistory(app.historyIndex);
                updateHistoryList();
                showToast('Undo');
            }
        }

        function redo() {
            if (app.historyIndex < app.history.length - 1) {
                app.historyIndex++;
                restoreFromHistory(app.historyIndex);
                updateHistoryList();
                showToast('Redo');
            }
        }

        function restoreFromHistory(index) {
            const state = app.history[index];
            
            // Restore layers
            state.forEach(layerState => {
                const layer = app.layers.find(l => l.id === layerState.id);
                if (layer) {
                    layer.name = layerState.name;
                    layer.visible = layerState.visible;
                    const img = new Image();
                    img.onload = function() {
                        layer.canvas.getContext('2d').clearRect(0, 0, layer.canvas.width, layer.canvas.height);
                        layer.canvas.getContext('2d').drawImage(img, 0, 0);
                        renderCanvas();
                    };
                    img.src = layerState.canvas;
                }
            });
        }

        // Layer management
        function addLayer() {
            const newId = app.layers.length > 0 ? Math.max(...app.layers.map(l => l.id)) + 1 : 2;
            app.layers.push({
                id: newId,
                name: `Layer ${newId}`,
                visible: true,
                locked: false,
                canvas: createLayerCanvas()
            });
            
            // Select new layer
            app.selectedLayerId = newId;
            
            // Save to history
            saveToHistory();
            updateLayersList();
            renderCanvas();
            showToast('New layer added');
        }

        function updateLayersList() {
            const layersList = document.getElementById('layersList');
            layersList.innerHTML = '';
            
            // Reverse order to show top layers first
            [...app.layers].reverse().forEach(layer => {
                const layerItem = document.createElement('div');
                layerItem.className = `layer-item ${layer.id === app.selectedLayerId ? 'active' : ''}`;
                layerItem.innerHTML = `
                    <div class="layer-visibility" onclick="toggleLayerVisibility(${layer.id})">
                        ${layer.visible ? '👁️' : '⛔'}
                    </div>
                    <div>${layer.name}</div>
                `;
                layerItem.onclick = function() {
                    app.selectedLayerId = layer.id;
                    updateLayersList();
                    renderCanvas();
                };
                layersList.appendChild(layerItem);
            });
        }

        function toggleLayerVisibility(layerId) {
            const layer = app.layers.find(l => l.id === layerId);
            if (layer) {
                layer.visible = !layer.visible;
                saveToHistory();
                updateLayersList();
                renderCanvas();
            }
        }

        function updateHistoryList() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            // Show last 10 history states
            const displayHistory = app.history.slice(Math.max(0, app.history.length - 10));
            
            displayHistory.forEach((state, index) => {
                const actualIndex = app.history.length - displayHistory.length + index;
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${actualIndex === app.historyIndex ? 'active' : ''}`;
                historyItem.textContent = `Step ${actualIndex + 1}`;
                historyItem.onclick = function() {
                    app.historyIndex = actualIndex;
                    restoreFromHistory(actualIndex);
                    updateHistoryList();
                    renderCanvas();
                };
                historyList.appendChild(historyItem);
            });
        }

        // Filters
        function applyFilter(filterType) {
            const currentLayer = app.layers.find(l => l.id === app.selectedLayerId);
            if (!currentLayer) return;
            
            const canvas = currentLayer.canvas;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // Apply filter to pixel data
            for (let i = 0; i < data.length; i += 4) {
                if (filterType === 'grayscale') {
                    const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    data[i] = avg;
                    data[i + 1] = avg;
                    data[i + 2] = avg;
                } else if (filterType === 'sepia') {
                    data[i] = data[i] * 0.393 + data[i + 1] * 0.769 + data[i + 2] * 0.189;
                    data[i + 1] = data[i] * 0.349 + data[i + 1] * 0.686 + data[i + 2] * 0.168;
                    data[i + 2] = data[i] * 0.272 + data[i + 1] * 0.534 + data[i + 2] * 0.131;
                } else if (filterType === 'invert') {
                    data[i] = 255 - data[i];
                    data[i + 1] = 255 - data[i + 1];
                    data[i + 2] = 255 - data[i + 2];
                } else if (filterType === 'brightness') {
                    data[i] = Math.min(255, data[i] + 30);
                    data[i + 1] = Math.min(255, data[i + 1] + 30);
                    data[i + 2] = Math.min(255, data[i + 2] + 30);
                } else if (filterType === 'contrast') {
                    const factor = (259 * (100 + 50)) / (255 * (100 - 50));
                    data[i] = factor * (data[i] - 128) + 128;
                    data[i + 1] = factor * (data[i + 1] - 128) + 128;
                    data[i + 2] = factor * (data[i + 2] - 128) + 128;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            saveToHistory();
            renderCanvas();
            
            // Show feedback
            const filterNames = {
                'grayscale': 'Grayscale',
                'sepia': 'Sepia',
                'invert': 'Invert',
                'brightness': 'Brightness',
                'contrast': 'Contrast'
            };
            showToast(`${filterNames[filterType]} filter applied`);
        }

        // Save functionality
        function openSaveModal() {
            document.getElementById('saveModal').style.display = 'flex';
        }

        function closeSaveModal() {
            document.getElementById('saveModal').style.display = 'none';
        }

        function saveImage() {
            const filename = document.getElementById('filenameInput').value || 'my-drawing.png';
            const link = document.createElement('a');
            link.download = filename;
            link.href = app.canvas.toDataURL();
            link.click();
            
            closeSaveModal();
            showToast('Image saved successfully!');
        }

        // Toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

            'invert': 'Invert',
            'brightness': 'Brightness',

        };

    </script>
