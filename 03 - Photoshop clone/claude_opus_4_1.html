<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoshop Clone - Advanced Image Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #1e1e1e;
            color: #ccc;
            overflow: hidden;
            user-select: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Menu Bar */
        .menu-bar {
            background: #2b2b2b;
            padding: 5px 10px;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #000;
            font-size: 13px;
        }

        .menu-item {
            cursor: pointer;
            padding: 3px 8px;
        }

        .menu-item:hover {
            background: #404040;
            border-radius: 3px;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Toolbar */
        .toolbar {
            width: 50px;
            background: #2b2b2b;
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
            padding: 5px;
        }

        .tool {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 2px;
            font-size: 18px;
            transition: all 0.2s;
        }

        .tool:hover {
            background: #404040;
        }

        .tool.active {
            background: #4a4a4a;
            border: 1px solid #666;
        }

        /* Workspace */
        .workspace {
            flex: 1;
            display: flex;
            background: #282828;
            position: relative;
            overflow: auto;
        }

        .canvas-container {
            position: relative;
            margin: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #mainCanvas {
            background: white;
            cursor: crosshair;
        }

        /* Right Panel */
        .right-panel {
            width: 250px;
            background: #2b2b2b;
            border-left: 1px solid #000;
            display: flex;
            flex-direction: column;
        }

        /* Panel Sections */
        .panel-section {
            border-bottom: 1px solid #404040;
            padding: 10px;
        }

        .panel-header {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #999;
        }

        /* Color Picker */
        .color-picker {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .color-box {
            width: 40px;
            height: 40px;
            border: 2px solid #666;
            border-radius: 4px;
            cursor: pointer;
        }

        .color-input {
            width: 40px;
            height: 40px;
            border: none;
            cursor: pointer;
        }

        /* Brush Settings */
        .slider-container {
            margin-bottom: 15px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .slider {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #404040;
            outline: none;
            border-radius: 2px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #0084ff;
            cursor: pointer;
            border-radius: 50%;
        }

        /* Layers Panel */
        .layers-container {
            max-height: 300px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #383838;
            margin-bottom: 2px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .layer-item:hover {
            background: #404040;
        }

        .layer-item.active {
            background: #4a4a4a;
            border: 1px solid #0084ff;
        }

        .layer-thumbnail {
            width: 30px;
            height: 30px;
            background: white;
            border: 1px solid #666;
            margin-right: 10px;
        }

        .layer-name {
            flex: 1;
        }

        .layer-visibility {
            margin-right: 10px;
            cursor: pointer;
        }

        .layer-controls {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        /* Blend Modes */
        .select-field {
            width: 100%;
            padding: 5px;
            background: #383838;
            border: 1px solid #555;
            color: #ccc;
            border-radius: 3px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        /* History Panel */
        .history-container {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
        }

        .history-item:hover {
            background: #404040;
        }

        .history-item.active {
            background: #4a4a4a;
        }

        /* Filters */
        .filter-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        /* Buttons */
        .btn {
            padding: 6px 12px;
            background: #404040;
            border: 1px solid #555;
            color: #ccc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #4a4a4a;
            border-color: #666;
        }

        .btn-primary {
            background: #0084ff;
            border-color: #0084ff;
            color: white;
        }

        .btn-primary:hover {
            background: #0066cc;
        }

        /* Properties Bar */
        .properties-bar {
            height: 35px;
            background: #2b2b2b;
            border-bottom: 1px solid #000;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 15px;
            font-size: 12px;
        }

        .property-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .property-input {
            width: 60px;
            padding: 3px 5px;
            background: #383838;
            border: 1px solid #555;
            color: #ccc;
            border-radius: 3px;
            font-size: 12px;
        }

        /* Tool Options */
        .tool-options {
            display: none;
            padding: 10px;
            background: #383838;
            border-radius: 4px;
            margin-top: 10px;
        }

        .tool-options.active {
            display: block;
        }

        /* Selection */
        .selection-box {
            position: absolute;
            border: 1px dashed #0084ff;
            background: rgba(0, 132, 255, 0.1);
            pointer-events: none;
            display: none;
        }

        /* Status Bar */
        .status-bar {
            height: 25px;
            background: #2b2b2b;
            border-top: 1px solid #000;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
        }

        .status-info {
            margin-right: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2b2b2b;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 20px;
            z-index: 1000;
            min-width: 300px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .modal-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #fff;
        }

        .modal-content {
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Text Tool */
        .text-input {
            position: absolute;
            border: 2px dashed #0084ff;
            background: transparent;
            color: black;
            padding: 5px;
            font-size: 16px;
            display: none;
            min-width: 100px;
            min-height: 30px;
        }

        /* Transform Handles */
        .transform-handles {
            position: absolute;
            border: 1px solid #0084ff;
            pointer-events: none;
            display: none;
        }

        .transform-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border: 1px solid #0084ff;
            pointer-events: auto;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2b2b2b;
            padding: 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Menu Bar -->
    <div class="menu-bar">
        <div class="menu-item" onclick="newDocument()">File</div>
        <div class="menu-item" onclick="showEditMenu()">Edit</div>
        <div class="menu-item" onclick="showImageMenu()">Image</div>
        <div class="menu-item" onclick="showFilterMenu()">Filter</div>
        <div class="menu-item" onclick="showViewMenu()">View</div>
        <div class="menu-item" onclick="showHelp()">Help</div>
    </div>

    <!-- Properties Bar -->
    <div class="properties-bar">
        <div class="property-group">
            <label>Width:</label>
            <input type="number" class="property-input" id="canvasWidth" value="800">
        </div>
        <div class="property-group">
            <label>Height:</label>
            <input type="number" class="property-input" id="canvasHeight" value="600">
        </div>
        <div class="property-group">
            <button class="btn btn-primary" onclick="resizeCanvas()">Resize</button>
        </div>
        <div class="property-group">
            <label>Zoom:</label>
            <select class="property-input" id="zoomLevel" onchange="setZoom(this.value)">
                <option value="0.5">50%</option>
                <option value="1" selected>100%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
            </select>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="tool active" data-tool="brush" title="Brush Tool (B)">🖌️</div>
            <div class="tool" data-tool="pencil" title="Pencil Tool (P)">✏️</div>
            <div class="tool" data-tool="eraser" title="Eraser Tool (E)">🧹</div>
            <div class="tool" data-tool="text" title="Text Tool (T)">T</div>
            <div class="tool" data-tool="select" title="Selection Tool (M)">⬚</div>
            <div class="tool" data-tool="move" title="Move Tool (V)">↔️</div>
            <div class="tool" data-tool="eyedropper" title="Eyedropper Tool (I)">💧</div>
            <div class="tool" data-tool="fill" title="Paint Bucket (G)">🪣</div>
            <div class="tool" data-tool="gradient" title="Gradient Tool">🌈</div>
            <div class="tool" data-tool="shape" title="Shape Tool">⭕</div>
            <div class="tool" data-tool="blur" title="Blur Tool">💨</div>
            <div class="tool" data-tool="clone" title="Clone Stamp (S)">🔄</div>
            <div class="tool" data-tool="crop" title="Crop Tool (C)">✂️</div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div class="canvas-container">
                <canvas id="mainCanvas" width="800" height="600"></canvas>
                <div class="selection-box" id="selectionBox"></div>
                <textarea class="text-input" id="textInput"></textarea>
                <div class="transform-handles" id="transformHandles">
                    <div class="transform-handle" style="top: -4px; left: -4px; cursor: nw-resize;"></div>
                    <div class="transform-handle" style="top: -4px; right: -4px; cursor: ne-resize;"></div>
                    <div class="transform-handle" style="bottom: -4px; left: -4px; cursor: sw-resize;"></div>
                    <div class="transform-handle" style="bottom: -4px; right: -4px; cursor: se-resize;"></div>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <!-- Color Picker -->
            <div class="panel-section">
                <div class="panel-header">Colors</div>
                <div class="color-picker">
                    <div class="color-box" id="foregroundColor" style="background: #000000;"></div>
                    <div class="color-box" id="backgroundColor" style="background: #FFFFFF;"></div>
                    <input type="color" class="color-input" id="colorPicker" value="#000000">
                </div>
                <div class="color-picker">
                    <button class="btn" onclick="swapColors()">Swap</button>
                    <button class="btn" onclick="resetColors()">Reset</button>
                </div>
            </div>

            <!-- Brush Settings -->
            <div class="panel-section">
                <div class="panel-header">Brush Settings</div>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Size</span>
                        <span id="brushSizeValue">10</span>
                    </div>
                    <input type="range" class="slider" id="brushSize" min="1" max="100" value="10">
                </div>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Opacity</span>
                        <span id="opacityValue">100%</span>
                    </div>
                    <input type="range" class="slider" id="opacity" min="0" max="100" value="100">
                </div>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Hardness</span>
                        <span id="hardnessValue">50%</span>
                    </div>
                    <input type="range" class="slider" id="hardness" min="0" max="100" value="50">
                </div>
            </div>

            <!-- Layers -->
            <div class="panel-section">
                <div class="panel-header">Layers</div>
                <select class="select-field" id="blendMode">
                    <option value="normal">Normal</option>
                    <option value="multiply">Multiply</option>
                    <option value="screen">Screen</option>
                    <option value="overlay">Overlay</option>
                    <option value="soft-light">Soft Light</option>
                    <option value="hard-light">Hard Light</option>
                    <option value="color-dodge">Color Dodge</option>
                    <option value="color-burn">Color Burn</option>
                    <option value="darken">Darken</option>
                    <option value="lighten">Lighten</option>
                    <option value="difference">Difference</option>
                    <option value="exclusion">Exclusion</option>
                </select>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Layer Opacity</span>
                        <span id="layerOpacityValue">100%</span>
                    </div>
                    <input type="range" class="slider" id="layerOpacity" min="0" max="100" value="100">
                </div>
                <div class="layers-container" id="layersContainer"></div>
                <div class="layer-controls">
                    <button class="btn" onclick="addLayer()">+ Layer</button>
                    <button class="btn" onclick="deleteLayer()">Delete</button>
                    <button class="btn" onclick="duplicateLayer()">Duplicate</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="panel-section">
                <div class="panel-header">Filters</div>
                <div class="filter-buttons">
                    <button class="btn" onclick="applyFilter('blur')">Blur</button>
                    <button class="btn" onclick="applyFilter('sharpen')">Sharpen</button>
                    <button class="btn" onclick="applyFilter('brightness')">Brightness</button>
                    <button class="btn" onclick="applyFilter('contrast')">Contrast</button>
                    <button class="btn" onclick="applyFilter('grayscale')">Grayscale</button>
                    <button class="btn" onclick="applyFilter('sepia')">Sepia</button>
                    <button class="btn" onclick="applyFilter('invert')">Invert</button>
                    <button class="btn" onclick="applyFilter('pixelate')">Pixelate</button>
                </div>
            </div>

            <!-- History -->
            <div class="panel-section">
                <div class="panel-header">History</div>
                <div class="history-container" id="historyContainer"></div>
                <div class="layer-controls">
                    <button class="btn" onclick="undo()">Undo</button>
                    <button class="btn" onclick="redo()">Redo</button>
                    <button class="btn" onclick="clearHistory()">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span class="status-info" id="mousePosition">X: 0, Y: 0</span>
        <span class="status-info" id="imageSize">800 x 600 px</span>
        <span class="status-info" id="currentTool">Brush Tool</span>
        <span class="status-info" id="memoryUsage">Memory: 0 MB</span>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="modal">
        <div class="modal-title" id="modalTitle">Title</div>
        <div class="modal-content" id="modalContent"></div>
        <div class="modal-buttons">
            <button class="btn" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" id="modalConfirm">OK</button>
        </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">Processing...</div>

    <script>
        // Main Application Class
        class PhotoshopClone {
            constructor() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.currentTool = 'brush';
                this.isDrawing = false;
                this.currentColor = '#000000';
                this.backgroundColor = '#FFFFFF';
                this.brushSize = 10;
                this.opacity = 1;
                this.hardness = 0.5;
                
                // Layers
                this.layers = [];
                this.currentLayer = 0;
                this.layerIdCounter = 0;
                
                // History
                this.history = [];
                this.historyStep = -1;
                this.maxHistory = 50;
                
                // Selection
                this.selection = null;
                this.selectionStart = null;
                this.isSelecting = false;
                
                // Text
                this.isTyping = false;
                
                // Clone stamp
                this.cloneSource = null;
                
                // Transform
                this.transforming = false;
                
                // Initialize
                this.init();
            }
            
            init() {
                // Create initial layer
                this.addLayer('Background');
                
                // Fill with white
                this.ctx.fillStyle = '#FFFFFF';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.saveLayerState();
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Update UI
                this.updateLayersPanel();
                this.addToHistory('New Document');
                
                // Load saved work if exists
                this.loadFromLocalStorage();
            }
            
            setupEventListeners() {
                // Canvas events
                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', () => this.stopDrawing());
                this.canvas.addEventListener('mouseleave', () => this.stopDrawing());
                
                // Tool selection
                document.querySelectorAll('.tool').forEach(tool => {
                    tool.addEventListener('click', (e) => {
                        this.selectTool(e.target.dataset.tool);
                    });
                });
                
                // Color picker
                document.getElementById('colorPicker').addEventListener('change', (e) => {
                    this.currentColor = e.target.value;
                    document.getElementById('foregroundColor').style.background = this.currentColor;
                });
                
                // Brush settings
                document.getElementById('brushSize').addEventListener('input', (e) => {
                    this.brushSize = parseInt(e.target.value);
                    document.getElementById('brushSizeValue').textContent = this.brushSize;
                });
                
                document.getElementById('opacity').addEventListener('input', (e) => {
                    this.opacity = parseInt(e.target.value) / 100;
                    document.getElementById('opacityValue').textContent = e.target.value + '%';
                });
                
                document.getElementById('hardness').addEventListener('input', (e) => {
                    this.hardness = parseInt(e.target.value) / 100;
                    document.getElementById('hardnessValue').textContent = e.target.value + '%';
                });
                
                // Blend mode
                document.getElementById('blendMode').addEventListener('change', (e) => {
                    if (this.layers[this.currentLayer]) {
                        this.layers[this.currentLayer].blendMode = e.target.value;
                        this.redrawCanvas();
                    }
                });
                
                // Layer opacity
                document.getElementById('layerOpacity').addEventListener('input', (e) => {
                    const opacity = parseInt(e.target.value) / 100;
                    document.getElementById('layerOpacityValue').textContent = e.target.value + '%';
                    if (this.layers[this.currentLayer]) {
                        this.layers[this.currentLayer].opacity = opacity;
                        this.redrawCanvas();
                    }
                });
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => this.handleKeyboard(e));
                
                // Text input
                document.getElementById('textInput').addEventListener('blur', () => {
                    this.applyText();
                });
                
                // Window resize
                window.addEventListener('resize', () => this.centerCanvas());
                
                // Auto-save
                setInterval(() => this.saveToLocalStorage(), 30000);
            }
            
            selectTool(tool) {
                this.currentTool = tool;
                
                // Update UI
                document.querySelectorAll('.tool').forEach(t => t.classList.remove('active'));
                document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
                document.getElementById('currentTool').textContent = this.getToolName(tool);
                
                // Update cursor
                this.updateCursor();
                
                // Hide text input if switching from text tool
                if (tool !== 'text') {
                    document.getElementById('textInput').style.display = 'none';
                }
            }
            
            getToolName(tool) {
                const toolNames = {
                    brush: 'Brush Tool',
                    pencil: 'Pencil Tool',
                    eraser: 'Eraser Tool',
                    text: 'Text Tool',
                    select: 'Selection Tool',
                    move: 'Move Tool',
                    eyedropper: 'Eyedropper Tool',
                    fill: 'Paint Bucket',
                    gradient: 'Gradient Tool',
                    shape: 'Shape Tool',
                    blur: 'Blur Tool',
                    clone: 'Clone Stamp',
                    crop: 'Crop Tool'
                };
                return toolNames[tool] || 'Unknown Tool';
            }
            
            updateCursor() {
                const cursors = {
                    brush: 'crosshair',
                    pencil: 'crosshair',
                    eraser: 'crosshair',
                    text: 'text',
                    select: 'crosshair',
                    move: 'move',
                    eyedropper: 'crosshair',
                    fill: 'crosshair',
                    gradient: 'crosshair',
                    shape: 'crosshair',
                    blur: 'crosshair',
                    clone: 'crosshair',
                    crop: 'crosshair'
                };
                this.canvas.style.cursor = cursors[this.currentTool] || 'default';
            }
            
            startDrawing(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                this.isDrawing = true;
                
                switch (this.currentTool) {
                    case 'brush':
                    case 'pencil':
                    case 'eraser':
                        this.ctx.beginPath();
                        this.ctx.moveTo(x, y);
                        break;
                        
                    case 'select':
                        this.startSelection(x, y);
                        break;
                        
                    case 'text':
                        this.placeTextInput(x, y);
                        break;
                        
                    case 'eyedropper':
                        this.pickColor(x, y);
                        break;
                        
                    case 'fill':
                        this.fillArea(x, y);
                        break;
                        
                    case 'gradient':
                        this.startGradient(x, y);
                        break;
                        
                    case 'shape':
                        this.startShape(x, y);
                        break;
                        
                    case 'clone':
                        if (e.altKey) {
                            this.setCloneSource(x, y);
                        } else if (this.cloneSource) {
                            this.startClone(x, y);
                        }
                        break;
                }
                
                // Update mouse position
                document.getElementById('mousePosition').textContent = `X: ${Math.round(x)}, Y: ${Math.round(y)}`;
            }
            
            draw(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Update mouse position
                document.getElementById('mousePosition').textContent = `X: ${Math.round(x)}, Y: ${Math.round(y)}`;
                
                if (!this.isDrawing) return;
                
                switch (this.currentTool) {
                    case 'brush':
                        this.drawBrush(x, y);
                        break;
                        
                    case 'pencil':
                        this.drawPencil(x, y);
                        break;
                        
                    case 'eraser':
                        this.erase(x, y);
                        break;
                        
                    case 'select':
                        this.updateSelection(x, y);
                        break;
                        
                    case 'gradient':
                        this.updateGradient(x, y);
                        break;
                        
                    case 'shape':
                        this.updateShape(x, y);
                        break;
                        
                    case 'clone':
                        if (this.cloneSource) {
                            this.drawClone(x, y);
                        }
                        break;
                        
                    case 'blur':
                        this.drawBlur(x, y);
                        break;
                }
            }
            
            stopDrawing() {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    
                    // Save state for history
                    if (['brush', 'pencil', 'eraser', 'fill'].includes(this.currentTool)) {
                        this.saveLayerState();
                        this.addToHistory(this.getToolName(this.currentTool));
                    }
                    
                    // Complete gradient or shape
                    if (this.currentTool === 'gradient' && this.gradientStart) {
                        this.applyGradient();
                    } else if (this.currentTool === 'shape' && this.shapeStart) {
                        this.applyShape();
                    }
                }
            }
            
            drawBrush(x, y) {
                this.ctx.globalAlpha = this.opacity;
                this.ctx.globalCompositeOperation = 'source-over';
                this.ctx.strokeStyle = this.currentColor;
                this.ctx.lineWidth = this.brushSize;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                
                this.ctx.lineTo(x, y);
                this.ctx.stroke();
                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
            }
            
            drawPencil(x, y) {
                this.ctx.globalAlpha = this.opacity;
                this.ctx.globalCompositeOperation = 'source-over';
                this.ctx.strokeStyle = this.currentColor;
                this.ctx.lineWidth = 1;
                this.ctx.lineCap = 'square';
                
                this.ctx.lineTo(x, y);
                this.ctx.stroke();
                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
            }
            
            erase(x, y) {
                this.ctx.globalCompositeOperation = 'destination-out';
                this.ctx.globalAlpha = this.opacity;
                this.ctx.strokeStyle = 'rgba(0,0,0,1)';
                this.ctx.lineWidth = this.brushSize;
                this.ctx.lineCap = 'round';
                
                this.ctx.lineTo(x, y);
                this.ctx.stroke();
                this.ctx.beginPath();
                this.ctx.moveTo(x, y);
                
                this.ctx.globalCompositeOperation = 'source-over';
            }
            
            pickColor(x, y) {
                const pixel = this.ctx.getImageData(x, y, 1, 1).data;
                const color = `#${((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1)}`;
                this.currentColor = color;
                document.getElementById('colorPicker').value = color;
                document.getElementById('foregroundColor').style.background = color;
            }
            
            fillArea(x, y) {
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const targetColor = this.getPixelColor(imageData, x, y);
                const fillColor = this.hexToRgb(this.currentColor);
                
                if (this.colorsMatch(targetColor, fillColor)) return;
                
                const pixels = imageData.data;
                const stack = [[x, y]];
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                while (stack.length) {
                    const [cx, cy] = stack.pop();
                    const index = (cy * width + cx) * 4;
                    
                    if (cx < 0 || cy < 0 || cx >= width || cy >= height) continue;
                    if (!this.colorsMatch({r: pixels[index], g: pixels[index + 1], b: pixels[index + 2]}, targetColor)) continue;
                    
                    pixels[index] = fillColor.r;
                    pixels[index + 1] = fillColor.g;
                    pixels[index + 2] = fillColor.b;
                    pixels[index + 3] = 255 * this.opacity;
                    
                    stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
                }
                
                this.ctx.putImageData(imageData, 0, 0);
                this.saveLayerState();
                this.addToHistory('Fill');
            }
            
            getPixelColor(imageData, x, y) {
                const index = (Math.floor(y) * imageData.width + Math.floor(x)) * 4;
                return {
                    r: imageData.data[index],
                    g: imageData.data[index + 1],
                    b: imageData.data[index + 2]
                };
            }
            
            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }
            
            colorsMatch(c1, c2, tolerance = 5) {
                return Math.abs(c1.r - c2.r) < tolerance &&
                       Math.abs(c1.g - c2.g) < tolerance &&
                       Math.abs(c1.b - c2.b) < tolerance;
            }
            
            startGradient(x, y) {
                this.gradientStart = { x, y };
            }
            
            updateGradient(x, y) {
                // Preview gradient
                this.redrawCanvas();
                
                const gradient = this.ctx.createLinearGradient(
                    this.gradientStart.x, this.gradientStart.y, x, y
                );
                gradient.addColorStop(0, this.currentColor);
                gradient.addColorStop(1, this.backgroundColor);
                
                this.ctx.fillStyle = gradient;
                this.ctx.globalAlpha = this.opacity;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }
            
            applyGradient() {
                this.gradientStart = null;
                this.saveLayerState();
                this.addToHistory('Gradient');
            }
            
            startShape(x, y) {
                this.shapeStart = { x, y };
            }
            
            updateShape(x, y) {
                // Preview shape
                this.redrawCanvas();
                
                this.ctx.strokeStyle = this.currentColor;
                this.ctx.lineWidth = this.brushSize;
                this.ctx.globalAlpha = this.opacity;
                
                const width = x - this.shapeStart.x;
                const height = y - this.shapeStart.y;
                
                this.ctx.strokeRect(this.shapeStart.x, this.shapeStart.y, width, height);
            }
            
            applyShape() {
                this.shapeStart = null;
                this.saveLayerState();
                this.addToHistory('Shape');
            }
            
            placeTextInput(x, y) {
                const textInput = document.getElementById('textInput');
                textInput.style.left = x + 'px';
                textInput.style.top = y + 'px';
                textInput.style.display = 'block';
                textInput.style.color = this.currentColor;
                textInput.style.fontSize = this.brushSize + 'px';
                textInput.value = '';
                textInput.focus();
                this.textPosition = { x, y };
            }
            
            applyText() {
                const textInput = document.getElementById('textInput');
                const text = textInput.value;
                
                if (text && this.textPosition) {
                    this.ctx.fillStyle = this.currentColor;
                    this.ctx.font = `${this.brushSize}px Arial`;
                    this.ctx.globalAlpha = this.opacity;
                    this.ctx.fillText(text, this.textPosition.x, this.textPosition.y);
                    
                    this.saveLayerState();
                    this.addToHistory('Text');
                }
                
                textInput.style.display = 'none';
            }
            
            setCloneSource(x, y) {
                this.cloneSource = { x, y };
                this.cloneOffset = { x: 0, y: 0 };
            }
            
            startClone(x, y) {
                this.cloneOffset = {
                    x: x - this.cloneSource.x,
                    y: y - this.cloneSource.y
                };
            }
            
            drawClone(x, y) {
                const sourceX = x - this.cloneOffset.x;
                const sourceY = y - this.cloneOffset.y;
                
                const imageData = this.ctx.getImageData(
                    sourceX - this.brushSize / 2,
                    sourceY - this.brushSize / 2,
                    this.brushSize,
                    this.brushSize
                );
                
                this.ctx.globalAlpha = this.opacity;
                this.ctx.putImageData(imageData, x - this.brushSize / 2, y - this.brushSize / 2);
            }
            
            drawBlur(x, y) {
                const radius = this.brushSize;
                const imageData = this.ctx.getImageData(
                    x - radius,
                    y - radius,
                    radius * 2,
                    radius * 2
                );
                
                const blurred = this.blurImageData(imageData, 5);
                this.ctx.putImageData(blurred, x - radius, y - radius);
            }
            
            blurImageData(imageData, radius) {
                const pixels = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                const output = new Uint8ClampedArray(pixels);
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        let r = 0, g = 0, b = 0, a = 0;
                        let count = 0;
                        
                        for (let dy = -radius; dy <= radius; dy++) {
                            for (let dx = -radius; dx <= radius; dx++) {
                                const ny = y + dy;
                                const nx = x + dx;
                                
                                if (ny >= 0 && ny < height && nx >= 0 && nx < width) {
                                    const idx = (ny * width + nx) * 4;
                                    r += pixels[idx];
                                    g += pixels[idx + 1];
                                    b += pixels[idx + 2];
                                    a += pixels[idx + 3];
                                    count++;
                                }
                            }
                        }
                        
                        const idx = (y * width + x) * 4;
                        output[idx] = r / count;
                        output[idx + 1] = g / count;
                        output[idx + 2] = b / count;
                        output[idx + 3] = a / count;
                    }
                }
                
                return new ImageData(output, width, height);
            }
            
            startSelection(x, y) {
                this.selectionStart = { x, y };
                this.isSelecting = true;
                document.getElementById('selectionBox').style.display = 'block';
            }
            
            updateSelection(x, y) {
                const box = document.getElementById('selectionBox');
                const left = Math.min(x, this.selectionStart.x);
                const top = Math.min(y, this.selectionStart.y);
                const width = Math.abs(x - this.selectionStart.x);
                const height = Math.abs(y - this.selectionStart.y);
                
                box.style.left = left + 'px';
                box.style.top = top + 'px';
                box.style.width = width + 'px';
                box.style.height = height + 'px';
                
                this.selection = { left, top, width, height };
            }
            
            clearSelection() {
                this.selection = null;
                this.isSelecting = false;
                document.getElementById('selectionBox').style.display = 'none';
            }
            
            // Layer Management
            addLayer(name = null) {
                const layerId = this.layerIdCounter++;
                const layer = {
                    id: layerId,
                    name: name || `Layer ${layerId}`,
                    canvas: document.createElement('canvas'),
                    visible: true,
                    opacity: 1,
                    blendMode: 'normal'
                };
                
                layer.canvas.width = this.canvas.width;
                layer.canvas.height = this.canvas.height;
                
                this.layers.push(layer);
                this.currentLayer = this.layers.length - 1;
                
                this.updateLayersPanel();
                this.addToHistory('New Layer');
                
                return layer;
            }
            
            deleteLayer() {
                if (this.layers.length <= 1) {
                    alert('Cannot delete the last layer');
                    return;
                }
                
                this.layers.splice(this.currentLayer, 1);
                this.currentLayer = Math.max(0, this.currentLayer - 1);
                
                this.updateLayersPanel();
                this.redrawCanvas();
                this.addToHistory('Delete Layer');
            }
            
            duplicateLayer() {
                const source = this.layers[this.currentLayer];
                const newLayer = this.addLayer(source.name + ' copy');
                
                const ctx = newLayer.canvas.getContext('2d');
                ctx.drawImage(source.canvas, 0, 0);
                
                this.updateLayersPanel();
                this.redrawCanvas();
            }
            
            mergeLayerDown() {
                if (this.currentLayer === 0) return;
                
                const upperLayer = this.layers[this.currentLayer];
                const lowerLayer = this.layers[this.currentLayer - 1];
                
                const ctx = lowerLayer.canvas.getContext('2d');
                ctx.globalAlpha = upperLayer.opacity;
                ctx.globalCompositeOperation = this.getBlendMode(upperLayer.blendMode);
                ctx.drawImage(upperLayer.canvas, 0, 0);
                
                this.layers.splice(this.currentLayer, 1);
                this.currentLayer--;
                
                this.updateLayersPanel();
                this.redrawCanvas();
                this.addToHistory('Merge Down');
            }
            
            updateLayersPanel() {
                const container = document.getElementById('layersContainer');
                container.innerHTML = '';
                
                for (let i = this.layers.length - 1; i >= 0; i--) {
                    const layer = this.layers[i];
                    const item = document.createElement('div');
                    item.className = 'layer-item';
                    if (i === this.currentLayer) {
                        item.classList.add('active');
                    }
                    
                    item.innerHTML = `
                        <span class="layer-visibility">${layer.visible ? '👁️' : '👁️‍🗨️'}</span>
                        <div class="layer-thumbnail"></div>
                        <span class="layer-name">${layer.name}</span>
                    `;
                    
                    item.addEventListener('click', () => {
                        this.currentLayer = i;
                        this.updateLayersPanel();
                        
                        // Update blend mode and opacity UI
                        document.getElementById('blendMode').value = layer.blendMode;
                        document.getElementById('layerOpacity').value = layer.opacity * 100;
                        document.getElementById('layerOpacityValue').textContent = Math.round(layer.opacity * 100) + '%';
                    });
                    
                    const visibilityToggle = item.querySelector('.layer-visibility');
                    visibilityToggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        layer.visible = !layer.visible;
                        this.updateLayersPanel();
                        this.redrawCanvas();
                    });
                    
                    container.appendChild(item);
                }
            }
            
            saveLayerState() {
                const layer = this.layers[this.currentLayer];
                const ctx = layer.canvas.getContext('2d');
                ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
                ctx.drawImage(this.canvas, 0, 0);
            }
            
            redrawCanvas() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw all visible layers
                for (const layer of this.layers) {
                    if (!layer.visible) continue;
                    
                    this.ctx.globalAlpha = layer.opacity;
                    this.ctx.globalCompositeOperation = this.getBlendMode(layer.blendMode);
                    this.ctx.drawImage(layer.canvas, 0, 0);
                }
                
                this.ctx.globalAlpha = 1;
                this.ctx.globalCompositeOperation = 'source-over';
            }
            
            getBlendMode(mode) {
                const blendModes = {
                    'normal': 'source-over',
                    'multiply': 'multiply',
                    'screen': 'screen',
                    'overlay': 'overlay',
                    'darken': 'darken',
                    'lighten': 'lighten',
                    'color-dodge': 'color-dodge',
                    'color-burn': 'color-burn',
                    'hard-light': 'hard-light',
                    'soft-light': 'soft-light',
                    'difference': 'difference',
                    'exclusion': 'exclusion'
                };
                return blendModes[mode] || 'source-over';
            }
            
            // History Management
            addToHistory(action) {
                // Remove any history after current step
                this.history = this.history.slice(0, this.historyStep + 1);
                
                // Add new history state
                const state = {
                    action: action,
                    timestamp: Date.now(),
                    layers: this.layers.map(layer => {
                        const canvas = document.createElement('canvas');
                        canvas.width = layer.canvas.width;
                        canvas.height = layer.canvas.height;
                        canvas.getContext('2d').drawImage(layer.canvas, 0, 0);
                        return {
                            ...layer,
                            canvas: canvas
                        };
                    }),
                    currentLayer: this.currentLayer
                };
                
                this.history.push(state);
                
                // Limit history size
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }
                
                this.historyStep = this.history.length - 1;
                this.updateHistoryPanel();
            }
            
            updateHistoryPanel() {
                const container = document.getElementById('historyContainer');
                container.innerHTML = '';
                
                this.history.forEach((item, index) => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    if (index === this.historyStep) {
                        historyItem.classList.add('active');
                    }
                    historyItem.textContent = item.action;
                    historyItem.addEventListener('click', () => {
                        this.goToHistoryStep(index);
                    });
                    container.appendChild(historyItem);
                });
            }
            
            goToHistoryStep(step) {
                if (step < 0 || step >= this.history.length) return;
                
                this.historyStep = step;
                const state = this.history[step];
                
                // Restore layers
                this.layers = state.layers.map(layer => {
                    const newLayer = {
                        ...layer,
                        canvas: document.createElement('canvas')
                    };
                    newLayer.canvas.width = layer.canvas.width;
                    newLayer.canvas.height = layer.canvas.height;
                    newLayer.canvas.getContext('2d').drawImage(layer.canvas, 0, 0);
                    return newLayer;
                });
                
                this.currentLayer = state.currentLayer;
                
                this.updateLayersPanel();
                this.redrawCanvas();
                this.updateHistoryPanel();
            }
            
            // Filters
            applyFilter(filterType) {
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                let filteredData;
                
                switch (filterType) {
                    case 'blur':
                        filteredData = this.filterBlur(imageData);
                        break;
                    case 'sharpen':
                        filteredData = this.filterSharpen(imageData);
                        break;
                    case 'brightness':
                        filteredData = this.filterBrightness(imageData, 20);
                        break;
                    case 'contrast':
                        filteredData = this.filterContrast(imageData, 20);
                        break;
                    case 'grayscale':
                        filteredData = this.filterGrayscale(imageData);
                        break;
                    case 'sepia':
                        filteredData = this.filterSepia(imageData);
                        break;
                    case 'invert':
                        filteredData = this.filterInvert(imageData);
                        break;
                    case 'pixelate':
                        filteredData = this.filterPixelate(imageData, 10);
                        break;
                    default:
                        filteredData = imageData;
                }
                
                this.ctx.putImageData(filteredData, 0, 0);
                this.saveLayerState();
                this.addToHistory(`Filter: ${filterType}`);
            }
            
            filterBlur(imageData) {
                return this.convolve(imageData, [
                    1/16, 2/16, 1/16,
                    2/16, 4/16, 2/16,
                    1/16, 2/16, 1/16
                ]);
            }
            
            filterSharpen(imageData) {
                return this.convolve(imageData, [
                    0, -1, 0,
                    -1, 5, -1,
                    0, -1, 0
                ]);
            }
            
            convolve(imageData, kernel) {
                const pixels = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                const output = new Uint8ClampedArray(pixels);
                
                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        const idx = (y * width + x) * 4;
                        
                        for (let c = 0; c < 3; c++) {
                            let sum = 0;
                            for (let ky = -1; ky <= 1; ky++) {
                                for (let kx = -1; kx <= 1; kx++) {
                                    const kidx = ((y + ky) * width + (x + kx)) * 4;
                                    const kpos = (ky + 1) * 3 + (kx + 1);
                                    sum += pixels[kidx + c] * kernel[kpos];
                                }
                            }
                            output[idx + c] = Math.min(255, Math.max(0, sum));
                        }
                    }
                }
                
                return new ImageData(output, width, height);
            }
            
            filterBrightness(imageData, amount) {
                const pixels = imageData.data;
                for (let i = 0; i < pixels.length; i += 4) {
                    pixels[i] = Math.min(255, pixels[i] + amount);
                    pixels[i + 1] = Math.min(255, pixels[i + 1] + amount);
                    pixels[i + 2] = Math.min(255, pixels[i + 2] + amount);
                }
                return imageData;
            }
            
            filterContrast(imageData, amount) {
                const pixels = imageData.data;
                const factor = (259 * (amount + 255)) / (255 * (259 - amount));
                
                for (let i = 0; i < pixels.length; i += 4) {
                    pixels[i] = Math.min(255, Math.max(0, factor * (pixels[i] - 128) + 128));
                    pixels[i + 1] = Math.min(255, Math.max(0, factor * (pixels[i + 1] - 128) + 128));
                    pixels[i + 2] = Math.min(255, Math.max(0, factor * (pixels[i + 2] - 128) + 128));
                }
                return imageData;
            }
            
            filterGrayscale(imageData) {
                const pixels = imageData.data;
                for (let i = 0; i < pixels.length; i += 4) {
                    const gray = pixels[i] * 0.299 + pixels[i + 1] * 0.587 + pixels[i + 2] * 0.114;
                    pixels[i] = gray;
                    pixels[i + 1] = gray;
                    pixels[i + 2] = gray;
                }
                return imageData;
            }
            
            filterSepia(imageData) {
                const pixels = imageData.data;
                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    
                    pixels[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    pixels[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    pixels[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                }
                return imageData;
            }
            
            filterInvert(imageData) {
                const pixels = imageData.data;
                for (let i = 0; i < pixels.length; i += 4) {
                    pixels[i] = 255 - pixels[i];
                    pixels[i + 1] = 255 - pixels[i + 1];
                    pixels[i + 2] = 255 - pixels[i + 2];
                }
                return imageData;
            }
            
            filterPixelate(imageData, pixelSize) {
                const pixels = imageData.data;
                const width = imageData.width;
                const height = imageData.height;
                
                for (let y = 0; y < height; y += pixelSize) {
                    for (let x = 0; x < width; x += pixelSize) {
                        // Get average color for this pixel block
                        let r = 0, g = 0, b = 0, count = 0;
                        
                        for (let py = y; py < Math.min(y + pixelSize, height); py++) {
                            for (let px = x; px < Math.min(x + pixelSize, width); px++) {
                                const idx = (py * width + px) * 4;
                                r += pixels[idx];
                                g += pixels[idx + 1];
                                b += pixels[idx + 2];
                                count++;
                            }
                        }
                        
                        r = Math.floor(r / count);
                        g = Math.floor(g / count);
                        b = Math.floor(b / count);
                        
                        // Set all pixels in block to average color
                        for (let py = y; py < Math.min(y + pixelSize, height); py++) {
                            for (let px = x; px < Math.min(x + pixelSize, width); px++) {
                                const idx = (py * width + px) * 4;
                                pixels[idx] = r;
                                pixels[idx + 1] = g;
                                pixels[idx + 2] = b;
                            }
                        }
                    }
                }
                
                return imageData;
            }
            
            // Keyboard Shortcuts
            handleKeyboard(e) {
                // Ctrl/Cmd shortcuts
                if (e.ctrlKey || e.metaKey) {
                    switch (e.key.toLowerCase()) {
                        case 'z':
                            e.preventDefault();
                            if (e.shiftKey) {
                                this.redo();
                            } else {
                                this.undo();
                            }
                            break;
                        case 's':
                            e.preventDefault();
                            this.save();
                            break;
                        case 'o':
                            e.preventDefault();
                            this.open();
                            break;
                        case 'n':
                            e.preventDefault();
                            this.newDocument();
                            break;
                    }
                } else {
                    // Tool shortcuts
                    switch (e.key.toLowerCase()) {
                        case 'b':
                            this.selectTool('brush');
                            break;
                        case 'e':
                            this.selectTool('eraser');
                            break;
                        case 't':
                            this.selectTool('text');
                            break;
                        case 'v':
                            this.selectTool('move');
                            break;
                        case 'm':
                            this.selectTool('select');
                            break;
                        case 'i':
                            this.selectTool('eyedropper');
                            break;
                        case 'g':
                            this.selectTool('fill');
                            break;
                        case 's':
                            this.selectTool('clone');
                            break;
                        case 'c':
                            this.selectTool('crop');
                            break;
                        case 'p':
                            this.selectTool('pencil');
                            break;
                    }
                }
            }
            
            // Undo/Redo
            undo() {
                if (this.historyStep > 0) {
                    this.goToHistoryStep(this.historyStep - 1);
                }
            }
            
            redo() {
                if (this.historyStep < this.history.length - 1) {
                    this.goToHistoryStep(this.historyStep + 1);
                }
            }
            
            clearHistory() {
                this.history = [];
                this.historyStep = -1;
                this.updateHistoryPanel();
                this.addToHistory('Clear History');
            }
            
            // File Operations
            save() {
                const link = document.createElement('a');
                link.download = 'image.png';
                link.href = this.canvas.toDataURL();
                link.click();
            }
            
            open() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            this.canvas.width = img.width;
                            this.canvas.height = img.height;
                            this.ctx.drawImage(img, 0, 0);
                            this.saveLayerState();
                            this.addToHistory('Open Image');
                            this.updateImageSize();
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            }
            
            newDocument() {
                if (confirm('Create a new document? Unsaved changes will be lost.')) {
                    this.canvas.width = 800;
                    this.canvas.height = 600;
                    this.ctx.fillStyle = '#FFFFFF';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    this.layers = [];
                    this.history = [];
                    this.historyStep = -1;
                    
                    this.addLayer('Background');
                    this.saveLayerState();
                    this.updateLayersPanel();
                    this.updateHistoryPanel();
                    this.updateImageSize();
                }
            }
            
            // Local Storage
            saveToLocalStorage() {
                try {
                    const data = {
                        width: this.canvas.width,
                        height: this.canvas.height,
                        layers: this.layers.map(layer => ({
                            ...layer,
                            imageData: layer.canvas.toDataURL()
                        })),
                        currentLayer: this.currentLayer
                    };
                    localStorage.setItem('photoshopClone', JSON.stringify(data));
                } catch (e) {
                    console.error('Failed to save to local storage:', e);
                }
            }
            
            loadFromLocalStorage() {
                try {
                    const data = JSON.parse(localStorage.getItem('photoshopClone'));
                    if (!data) return;
                    
                    this.canvas.width = data.width;
                    this.canvas.height = data.height;
                    
                    this.layers = [];
                    data.layers.forEach(layerData => {
                        const layer = {
                            ...layerData,
                            canvas: document.createElement('canvas')
                        };
                        layer.canvas.width = this.canvas.width;
                        layer.canvas.height = this.canvas.height;
                        
                        const img = new Image();
                        img.onload = () => {
                            layer.canvas.getContext('2d').drawImage(img, 0, 0);
                            this.redrawCanvas();
                        };
                        img.src = layerData.imageData;
                        
                        this.layers.push(layer);
                    });
                    
                    this.currentLayer = data.currentLayer;
                    this.updateLayersPanel();
                    this.updateImageSize();
                } catch (e) {
                    console.error('Failed to load from local storage:', e);
                }
            }
            
            // Utility Functions
            centerCanvas() {
                const workspace = document.querySelector('.workspace');
                const container = document.querySelector('.canvas-container');
                
                const workspaceRect = workspace.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                if (containerRect.width < workspaceRect.width) {
                    container.style.marginLeft = 'auto';
                    container.style.marginRight = 'auto';
                }
                
                if (containerRect.height < workspaceRect.height) {
                    container.style.marginTop = 'auto';
                    container.style.marginBottom = 'auto';
                }
            }
            
            updateImageSize() {
                document.getElementById('imageSize').textContent = 
                    `${this.canvas.width} x ${this.canvas.height} px`;
                document.getElementById('canvasWidth').value = this.canvas.width;
                document.getElementById('canvasHeight').value = this.canvas.height;
            }
        }
        
        // Global Functions
        let app;
        
        function init() {
            app = new PhotoshopClone();
        }
        
        function addLayer() {
            app.addLayer();
        }
        
        function deleteLayer() {
            app.deleteLayer();
        }
        
        function duplicateLayer() {
            app.duplicateLayer();
        }
        
        function undo() {
            app.undo();
        }
        
        function redo() {
            app.redo();
        }
        
        function clearHistory() {
            app.clearHistory();
        }
        
        function applyFilter(filterType) {
            app.applyFilter(filterType);
        }
        
        function swapColors() {
            const temp = app.currentColor;
            app.currentColor = app.backgroundColor;
            app.backgroundColor = temp;
            
            document.getElementById('foregroundColor').style.background = app.currentColor;
            document.getElementById('backgroundColor').style.background = app.backgroundColor;
            document.getElementById('colorPicker').value = app.currentColor;
        }
        
        function resetColors() {
            app.currentColor = '#000000';
            app.backgroundColor = '#FFFFFF';
            
            document.getElementById('foregroundColor').style.background = app.currentColor;
            document.getElementById('backgroundColor').style.background = app.backgroundColor;
            document.getElementById('colorPicker').value = app.currentColor;
        }
        
        function resizeCanvas() {
            const width = parseInt(document.getElementById('canvasWidth').value);
            const height = parseInt(document.getElementById('canvasHeight').value);
            
            if (width > 0 && height > 0) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = app.canvas.width;
                tempCanvas.height = app.canvas.height;
                tempCanvas.getContext('2d').drawImage(app.canvas, 0, 0);
                
                app.canvas.width = width;
                app.canvas.height = height;
                app.ctx.fillStyle = '#FFFFFF';
                app.ctx.fillRect(0, 0, width, height);
                app.ctx.drawImage(tempCanvas, 0, 0);
                
                // Resize all layers
                app.layers.forEach(layer => {
                    const temp = document.createElement('canvas');
                    temp.width = layer.canvas.width;
                    temp.height = layer.canvas.height;
                    temp.getContext('2d').drawImage(layer.canvas, 0, 0);
                    
                    layer.canvas.width = width;
                    layer.canvas.height = height;
                    layer.canvas.getContext('2d').drawImage(temp, 0, 0);
                });
                
                app.redrawCanvas();
                app.updateImageSize();
                app.addToHistory('Resize Canvas');
            }
        }
        
        function setZoom(zoom) {
            const scale = parseFloat(zoom);
            app.canvas.style.transform = `scale(${scale})`;
            app.canvas.style.transformOrigin = 'top left';
        }
        
        function newDocument() {
            app.newDocument();
        }
        
        function showEditMenu() {
            alert('Edit Menu: Cut, Copy, Paste, Transform, etc.');
        }
        
        function showImageMenu() {
            alert('Image Menu: Adjustments, Image Size, Canvas Size, etc.');
        }
        
        function showFilterMenu() {
            alert('Filter Menu: Additional filters and effects');
        }
        
        function showViewMenu() {
            alert('View Menu: Zoom, Guides, Grid, etc.');
        }
        
        function showHelp() {
            alert('Photoshop Clone v1.0\n\nKeyboard Shortcuts:\n' +
                  'B - Brush Tool\n' +
                  'E - Eraser Tool\n' +
                  'T - Text Tool\n' +
                  'V - Move Tool\n' +
                  'M - Selection Tool\n' +
                  'I - Eyedropper\n' +
                  'G - Paint Bucket\n' +
                  'S - Clone Stamp (Alt+Click to set source)\n' +
                  'P - Pencil Tool\n' +
                  'C - Crop Tool\n' +
                  'Ctrl+Z - Undo\n' +
                  'Ctrl+Shift+Z - Redo\n' +
                  'Ctrl+S - Save\n' +
                  'Ctrl+O - Open\n' +
                  'Ctrl+N - New Document');
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modalOverlay').style.display = 'none';
        }
        
        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
