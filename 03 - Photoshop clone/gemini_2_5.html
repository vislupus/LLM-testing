<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Photo Editor</title>
    <style>
        :root {
            --bg-color: #535353;
            --panel-bg: #323232;
            --widget-bg: #424242;
            --border-color: #2a2a2a;
            --text-color: #b0b0b0;
            --highlight-bg: #4a90e2;
            --highlight-text: #ffffff;
            --tool-size: 32px;
            --panel-width: 240px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 12px;
            color: var(--text-color);
            user-select: none;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- Toolbar (Left) --- */
        #toolbar {
            width: 50px;
            background-color: var(--panel-bg);
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .tool-button {
            width: var(--tool-size);
            height: var(--tool-size);
            margin-bottom: 10px;
            background-color: var(--widget-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-button:hover {
            background-color: #555;
        }

        .tool-button.active {
            background-color: var(--highlight-bg);
            border-color: var(--highlight-bg);
        }

        .tool-button svg {
            width: 20px;
            height: 20px;
            fill: var(--text-color);
        }
        .tool-button.active svg {
            fill: var(--highlight-text);
        }

        /* --- Main Content Area --- */
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* --- Options Bar (Top) --- */
        #options-bar {
            height: 40px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 20px;
        }
        
        .option-group { display: flex; align-items: center; gap: 8px; }
        .option-group label { font-size: 11px; }
        .option-group input[type="range"] { width: 100px; }
        .option-group input[type="color"] {
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            width: 28px; height: 28px; background-color: transparent;
            border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch { border-radius: 3px; border: none; }
        input[type="color"]::-moz-color-swatch { border-radius: 3px; border: none; }


        /* --- Canvas Area --- */
        #canvas-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            position: relative;
        }
        
        #p5-canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-image:
              linear-gradient(45deg, #ccc 25%, transparent 25%), 
              linear-gradient(135deg, #ccc 25%, transparent 25%),
              linear-gradient(45deg, transparent 75%, #ccc 75%),
              linear-gradient(135deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 0, 10px -10px, 0px 10px;
            background-color: #fff;
        }

        /* --- Right Panels --- */
        #right-panels {
            width: var(--panel-width);
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .panel {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header {
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-buttons button {
            background: none; border: none; color: var(--text-color); cursor: pointer; padding: 2px 4px;
        }
        .panel-buttons button:hover { color: var(--highlight-text); }


        /* --- Layers Panel --- */
        #layer-list {
            max-height: 250px;
            overflow-y: auto;
            background-color: var(--widget-bg);
        }
        
        .layer-item {
            display: flex;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        
        .layer-item.active {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
        }

        .layer-visibility { margin-right: 8px; }
        .layer-thumbnail { width: 40px; height: 30px; background-color: white; border: 1px solid #555; margin-right: 8px; }
        .layer-name { flex-grow: 1; font-size: 13px; }

        .layer-controls { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
        .layer-controls label { font-size: 11px; }
        .layer-controls input[type="range"] { flex-grow: 1; }
        .layer-controls select {
            background-color: var(--widget-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 2px;
        }

        /* --- History Panel --- */
        #history-list {
            max-height: 200px;
            overflow-y: auto;
            background-color: var(--widget-bg);
        }
        
        .history-item {
            padding: 5px 8px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .history-item.active {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
        }
        
        /* Hidden file input */
        #image-upload { display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- Left Toolbar -->
        <div id="toolbar">
            <button class="tool-button" data-tool="brush" title="Brush Tool (B)">
                <svg viewBox="0 0 24 24"><path d="M16.207 2.207a2.121 2.121 0 0 1 2.992 2.992L11 16.586V20h3.414l8.293-8.293-2.992-2.992L16.207 2.207zM2 22h18v-2H2v2z"/></svg>
            </button>
            <button class="tool-button" data-tool="eraser" title="Eraser Tool (E)">
                <svg viewBox="0 0 24 24"><path d="M18 20H8.502a3.498 3.498 0 0 1-2.476-.957L.97 13.987a1.5 1.5 0 0 1 0-2.122L6.026 6.81a3.5 3.5 0 0 1 4.95 0l2.828 2.828L23.06 19.05a1 1 0 0 1-.707 1.707H18zM8.502 8a1.5 1.5 0 0 0-1.06.44L2.387 13.496l5.051 5.051a1.5 1.5 0 0 0 1.06.44H17V9.757L8.502 8z"/></svg>
            </button>
            <button class="tool-button" data-tool="fill" title="Fill Bucket (G)">
                <svg viewBox="0 0 24 24"><path d="M13.414 2.043a2 2 0 0 0-2.828 0L3.044 9.586a2 2 0 0 0 0 2.828l7.071 7.071a1 1 0 0 0 1.414 0l7.52-7.521a1 1 0 0 0 0-1.414L13.414 2.043zM6.586 11L11 6.586 15.414 11H6.586z"/></svg>
            </button>
            <button class="tool-button" data-tool="eyedropper" title="Eyedropper Tool (I)">
                <svg viewBox="0 0 24 24"><path d="M19.334 10.155a1 1 0 0 0-1.414-1.414l-2.121 2.121a1 1 0 0 0 0 1.414l-1.414 1.414a1 1 0 0 0 0 1.414l-.707.707a3.535 3.535 0 0 1-4.95-4.95l.707-.707a1 1 0 0 0 1.414 0l1.414-1.414a1 1 0 0 0 1.414 0l2.121-2.121a1 1 0 0 0 0-1.414L14.73 4.666a3.5 3.5 0 0 0-4.95 0l-5.125 5.125a3.5 3.5 0 0 0 0 4.95l5.125 5.125a3.5 3.5 0 0 0 4.95 0l5.125-5.125-1.516-1.586z"/></svg>
            </button>
        </div>

        <!-- Main Area -->
        <div class="content-area">
            <!-- Top Options Bar -->
            <div id="options-bar">
                 <div class="option-group" id="file-options">
                    <button id="open-image-btn" title="Open Image">Open</button>
                    <button id="save-image-btn" title="Save as PNG">Save</button>
                 </div>
                 <div class="option-group" id="filter-options">
                    <label>Filters:</label>
                    <button id="filter-grayscale">Grayscale</button>
                    <button id="filter-invert">Invert</button>
                    <button id="filter-blur">Blur</button>
                 </div>
                <div class="option-group" id="brush-options">
                    <label for="brush-size">Size:</label>
                    <input type="range" id="brush-size" min="1" max="200" value="30">
                    <label for="brush-hardness">Hardness:</label>
                    <input type="range" id="brush-hardness" min="0.1" max="1" value="1" step="0.05">
                </div>
                 <div class="option-group" id="color-option">
                    <label for="color-picker">Color:</label>
                    <input type="color" id="color-picker" value="#000000">
                </div>
            </div>

            <!-- Canvas -->
            <div id="canvas-container">
                <div id="p5-canvas"></div>
            </div>
        </div>

        <!-- Right Panels -->
        <div id="right-panels">
            <div class="panel" id="layers-panel">
                <div class="panel-header">
                    <span>Layers</span>
                    <div class="panel-buttons">
                        <button id="add-layer-btn" title="New Layer">+</button>
                        <button id="delete-layer-btn" title="Delete Layer">🗑</button>
                    </div>
                </div>
                <div id="layer-list"></div>
                <div class="layer-controls">
                    <label for="layer-opacity">Opacity:</label>
                    <input type="range" id="layer-opacity" min="0" max="255" value="255">
                    <select id="blend-mode-select">
                        <option value="BLEND">Normal</option>
                        <option value="ADD">Add</option>
                        <option value="MULTIPLY">Multiply</option>
                    </select>
                </div>
            </div>
            <div class="panel" id="history-panel">
                <div class="panel-header"><span>History</span></div>
                <div id="history-list"></div>
            </div>
        </div>
    </div>
    <input type="file" id="image-upload" accept="image/*">

<script>
const p5_container = document.getElementById('p5-canvas');
let canvasWidth = 800;
let canvasHeight = 600;

// Main p5 sketch instance
const sketch = (p) => {

    // --- STATE MANAGEMENT ---
    let layers = [];
    let activeLayer = null;
    let history = [];
    let historyIndex = -1;

    let toolState = {
        currentTool: 'brush',
        brushSize: 30,
        brushHardness: 1,
        color: [0, 0, 0, 255],
    };
    
    let isDrawing = false;

    // --- P5.JS LIFECYCLE ---
    p.setup = () => {
        p.createCanvas(canvasWidth, canvasHeight).parent(p5_container);
        p.pixelDensity(1); // Important for get/set pixels
        addLayer('Background');
        // The background layer shouldn't be transparent
        activeLayer.p5Graphics.background(255);
        saveState("Initial State");
        updateUI();
    };

    p.draw = () => {
        p.background(255); // Clears the main canvas

        // Render all layers from bottom to top
        layers.forEach(layer => {
            if (layer.isVisible) {
                p.push();
                p.blendMode(layer.blendMode);
                p.tint(255, layer.opacity);
                p.image(layer.p5Graphics, 0, 0);
                p.pop();
            }
        });

        // Draw tool preview cursor
        if (p.mouseX > 0 && p.mouseX < p.width && p.mouseY > 0 && p.mouseY < p.height) {
            drawCursor();
        }
    };
    
    p.mousePressed = () => {
        if (p.mouseX < 0 || p.mouseX > p.width || p.mouseY < 0 || p.mouseY > p.height) return;
        isDrawing = true;
        
        switch(toolState.currentTool) {
            case 'brush':
            case 'eraser':
                drawOnLayer(p.mouseX, p.mouseY, p.mouseX, p.mouseY);
                break;
            case 'fill':
                activeLayer.p5Graphics.background(toolState.color);
                break;
            case 'eyedropper':
                const pickedColor = p.get(p.mouseX, p.mouseY);
                toolState.color = pickedColor;
                document.getElementById('color-picker').value = p.hex(pickedColor, 6);
                break;
        }
    };
    
    p.mouseDragged = () => {
        if (!isDrawing || p.mouseX < 0 || p.mouseX > p.width || p.mouseY < 0 || p.mouseY > p.height) return;
        
        if (toolState.currentTool === 'brush' || toolState.currentTool === 'eraser') {
            drawOnLayer(p.mouseX, p.mouseY, p.pmouseX, p.pmouseY);
        }
    };
    
    p.mouseReleased = () => {
        if(isDrawing) {
            if (toolState.currentTool === 'brush' || toolState.currentTool === 'eraser' || toolState.currentTool === 'fill') {
                saveState(`Used ${toolState.currentTool}`);
            }
            isDrawing = false;
        }
    };
    
    // --- TOOL LOGIC ---
    function drawOnLayer(x, y, px, py) {
        if (!activeLayer) return;

        let g = activeLayer.p5Graphics;
        g.push();
        
        if (toolState.currentTool === 'eraser') {
            g.erase(255, 255);
        } else {
            g.noErase();
            g.stroke(toolState.color);
        }
        
        const hardness = toolState.brushHardness;
        const size = toolState.brushSize;

        // Use a line for smooth drawing
        g.strokeWeight(size);
        if(hardness < 1) { // Soft brush logic
            g.noFill();
            for (let i = size; i > 0; i -= 2) {
                let alpha = (1 - (i / size)) * 255 * (1 - hardness);
                 if (toolState.currentTool === 'eraser') {
                    g.erase(alpha, 255);
                } else {
                    g.stroke(toolState.color[0], toolState.color[1], toolState.color[2], alpha);
                }
                g.strokeWeight(i);
                g.line(x, y, px, py);
            }
        } else { // Hard brush
             g.line(x, y, px, py);
        }
        
        g.pop();
        updateLayerThumbnail(activeLayer);
    }
    
    function drawCursor() {
        p.push();
        p.noFill();
        p.stroke(0, 150);
        p.ellipse(p.mouseX, p.mouseY, toolState.brushSize, toolState.brushSize);
        p.pop();
    }
    
    // --- LAYER MANAGEMENT ---
    function addLayer(name = `Layer ${layers.length + 1}`) {
        const newLayer = {
            id: Date.now(),
            name: name,
            p5Graphics: p.createGraphics(p.width, p.height),
            isVisible: true,
            opacity: 255,
            blendMode: p.BLEND,
        };
        layers.push(newLayer);
        setActiveLayer(newLayer.id);
    }

    function deleteActiveLayer() {
        if (layers.length <= 1) {
            alert("Cannot delete the last layer.");
            return;
        }
        const index = layers.findIndex(l => l.id === activeLayer.id);
        layers.splice(index, 1);
        const newActiveIndex = Math.max(0, index - 1);
        setActiveLayer(layers[newActiveIndex].id);
        saveState("Delete Layer");
    }

    function setActiveLayer(id) {
        const layer = layers.find(l => l.id === id);
        if (layer) {
            activeLayer = layer;
            updateUI();
        }
    }
    
    // --- HISTORY (UNDO/REDO) ---
    function saveState(actionName) {
        // Clear redo history if a new action is taken
        if (historyIndex < history.length - 1) {
            history.splice(historyIndex + 1);
        }
        
        const layerStates = layers.map(l => ({
            id: l.id,
            imageData: l.p5Graphics.get() // get() returns a p5.Image copy
        }));

        history.push({
            action: actionName,
            layerStates: layerStates,
            activeLayerId: activeLayer.id
        });
        historyIndex++;
        updateHistoryPanel();
    }
    
    function revertToHistoryState(index) {
        if (index < 0 || index >= history.length) return;
        
        historyIndex = index;
        const state = history[historyIndex];
        
        // This is a simple but potentially slow way to restore state.
        // A more complex system would only update changed layers.
        state.layerStates.forEach(savedLayer => {
            const targetLayer = layers.find(l => l.id === savedLayer.id);
            if(targetLayer) {
                targetLayer.p5Graphics.clear();
                targetLayer.p5Graphics.image(savedLayer.imageData, 0, 0);
                updateLayerThumbnail(targetLayer);
            }
        });
        
        setActiveLayer(state.activeLayerId);
        updateHistoryPanel();
    }
    
    // --- UI UPDATING & EVENT HANDLERS ---
    
    // DOM elements outside p5
    const layerList = document.getElementById('layer-list');
    const historyList = document.getElementById('history-list');
    const toolButtons = document.querySelectorAll('.tool-button');

    function updateUI() {
        updateLayersPanel();
        updateOptionsBar();
        updateActiveTool();
        updateLayerControls();
    }
    
    function updateLayersPanel() {
        layerList.innerHTML = '';
        [...layers].reverse().forEach(layer => {
            const item = document.createElement('div');
            item.className = 'layer-item';
            if (activeLayer && layer.id === activeLayer.id) {
                item.classList.add('active');
            }
            item.dataset.id = layer.id;
            
            // Draggable logic
            item.draggable = true;
            item.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', layer.id));
            item.addEventListener('dragover', e => e.preventDefault());
            item.addEventListener('drop', e => {
                e.preventDefault();
                const draggedId = parseInt(e.dataTransfer.getData('text/plain'));
                const targetId = layer.id;
                
                const draggedIndex = layers.findIndex(l => l.id === draggedId);
                const targetIndex = layers.findIndex(l => l.id === targetId);

                const [draggedLayer] = layers.splice(draggedIndex, 1);
                layers.splice(targetIndex, 0, draggedLayer);
                
                saveState("Reorder Layers");
                updateLayersPanel();
            });

            item.innerHTML = `
                <input type="checkbox" class="layer-visibility" ${layer.isVisible ? 'checked' : ''}>
                <canvas class="layer-thumbnail" width="40" height="30"></canvas>
                <span class="layer-name">${layer.name}</span>
            `;
            
            item.querySelector('.layer-name').ondblclick = (e) => {
                const newName = prompt("Enter new layer name:", layer.name);
                if(newName) {
                    layer.name = newName;
                    saveState("Rename Layer");
                    updateLayersPanel();
                }
            };
            
            item.querySelector('.layer-visibility').onchange = (e) => {
                layer.isVisible = e.target.checked;
            };

            item.onclick = (e) => {
                if(e.target.type !== 'checkbox') setActiveLayer(layer.id);
            };

            layerList.appendChild(item);
            updateLayerThumbnail(layer);
        });
    }

    function updateLayerThumbnail(layer) {
        const canvas = layerList.querySelector(`.layer-item[data-id='${layer.id}'] .layer-thumbnail`);
        if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 40, 30);
            ctx.drawImage(layer.p5Graphics.canvas, 0, 0, 40, 30);
        }
    }
    
    function updateHistoryPanel() {
        historyList.innerHTML = '';
        history.forEach((state, index) => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.textContent = state.action;
            if (index === historyIndex) {
                item.classList.add('active');
            }
            item.onclick = () => revertToHistoryState(index);
            historyList.appendChild(item);
        });
        historyList.scrollTop = historyList.scrollHeight; // Auto-scroll
    }
    
    function updateActiveTool() {
        toolButtons.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tool === toolState.currentTool);
        });
    }
    
    function updateOptionsBar() {
        document.getElementById('brush-options').style.display = 
            (toolState.currentTool === 'brush' || toolState.currentTool === 'eraser') ? 'flex' : 'none';
        
        document.getElementById('color-option').style.display =
            (toolState.currentTool === 'brush' || toolState.currentTool === 'fill') ? 'flex' : 'none';
    }
    
    function updateLayerControls() {
        if(activeLayer) {
            document.getElementById('layer-opacity').value = activeLayer.opacity;
            const blendModeString = Object.keys(p).find(key => p[key] === activeLayer.blendMode);
            document.getElementById('blend-mode-select').value = blendModeString;
        }
    }

    // Connect DOM to state
    toolButtons.forEach(btn => {
        btn.onclick = () => {
            toolState.currentTool = btn.dataset.tool;
            updateUI();
        };
    });
    
    // File/Filter options
    document.getElementById('open-image-btn').onclick = () => document.getElementById('image-upload').click();
    document.getElementById('save-image-btn').onclick = () => p.saveCanvas('my-artwork', 'png');
    document.getElementById('filter-grayscale').onclick = () => { activeLayer.p5Graphics.filter(p.GRAY); saveState("Grayscale Filter");};
    document.getElementById('filter-invert').onclick = () => { activeLayer.p5Graphics.filter(p.INVERT); saveState("Invert Filter");};
    document.getElementById('filter-blur').onclick = () => { activeLayer.p5Graphics.filter(p.BLUR, 3); saveState("Blur Filter");};


    document.getElementById('image-upload').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                p.loadImage(event.target.result, (img) => {
                    addLayer(file.name);
                    activeLayer.p5Graphics.image(img, 0, 0, p.width, p.height);
                    saveState(`Opened ${file.name}`);
                });
            };
            reader.readAsDataURL(file);
        }
    };
    
    // Tool option inputs
    document.getElementById('brush-size').oninput = e => toolState.brushSize = parseInt(e.target.value);
    document.getElementById('brush-hardness').oninput = e => toolState.brushHardness = parseFloat(e.target.value);
    document.getElementById('color-picker').oninput = e => toolState.color = p.color(e.target.value).levels;
    
    // Layer control inputs
    document.getElementById('add-layer-btn').onclick = () => { addLayer(); saveState("Add Layer"); };
    document.getElementById('delete-layer-btn').onclick = deleteActiveLayer;
    document.getElementById('layer-opacity').oninput = e => { if (activeLayer) activeLayer.opacity = parseInt(e.target.value); };
    document.getElementById('blend-mode-select').onchange = e => { if (activeLayer) activeLayer.blendMode = p[e.target.value]; };
    
    // Keyboard shortcuts
    p.keyPressed = () => {
        if (p.key.toLowerCase() === 'b') toolState.currentTool = 'brush';
        if (p.key.toLowerCase() === 'e') toolState.currentTool = 'eraser';
        if (p.key.toLowerCase() === 'g') toolState.currentTool = 'fill';
        if (p.key.toLowerCase() === 'i') toolState.currentTool = 'eyedropper';
        
        if(p.keyIsDown(p.CONTROL) && p.key.toLowerCase() === 'z') {
            revertToHistoryState(historyIndex - 1);
        }
        if(p.keyIsDown(p.CONTROL) && p.key.toLowerCase() === 'y') {
            revertToHistoryState(historyIndex + 1);
        }
        updateUI();
    };

}; // End of sketch function

// Start p5.js in instance mode
new p5(sketch);
</script>

</body>
</html>
