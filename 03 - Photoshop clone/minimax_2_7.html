<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoClone - Photoshop Alternative</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #1e1e1e;
            color: #ccc;
        }

        /* Main Layout */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Menu Bar */
        .menu-bar {
            height: 32px;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            padding: 0 8px;
            border-bottom: 1px solid #3d3d3d;
        }

        .menu-item {
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .menu-item:hover {
            background: #3d3d3d;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Panel - Tools */
        .tools-panel {
            width: 48px;
            background: #2d2d2d;
            border-right: 1px solid #3d3d3d;
            display: flex;
            flex-direction: column;
            padding: 8px 4px;
            gap: 4px;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .tool-btn:hover {
            background: #3d3d3d;
        }

        .tool-btn.active {
            background: #0078d4;
        }

        .tool-btn svg {
            width: 22px;
            height: 22px;
            fill: #ccc;
        }

        .tool-btn.active svg {
            fill: white;
        }

        .tool-divider {
            height: 1px;
            background: #3d3d3d;
            margin: 4px 0;
        }

        /* Tool Options Bar */
        .options-bar {
            height: 44px;
            background: #323232;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            border-bottom: 1px solid #3d3d3d;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-label {
            font-size: 12px;
            color: #999;
        }

        .option-input {
            width: 50px;
            padding: 4px 8px;
            background: #1e1e1e;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            color: white;
            font-size: 12px;
        }

        .color-preview {
            width: 32px;
            height: 32px;
            border: 2px solid #4d4d4d;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        .color-preview input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .color-preview .outline {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: white;
            transform: rotate(-45deg);
            pointer-events: none;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #323232;
        }

        .canvas-wrapper {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #404040;
            background-image:
                linear-gradient(45deg, #3a3a3a 25%, transparent 25%),
                linear-gradient(-45deg, #3a3a3a 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #3a3a3a 75%),
                linear-gradient(-45deg, transparent 75%, #3a3a3a 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        .preview-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Right Panels */
        .right-panels {
            width: 280px;
            background: #2d2d2d;
            border-left: 1px solid #3d3d3d;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel {
            border-bottom: 1px solid #3d3d3d;
        }

        .panel-header {
            padding: 8px 12px;
            background: #323232;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header:hover {
            background: #3d3d3d;
        }

        .panel-content {
            padding: 8px;
        }

        /* Layers Panel */
        .layer-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            gap: 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .layer-item:hover {
            background: #3d3d3d;
        }

        .layer-item.active {
            background: #0078d4;
        }

        .layer-preview {
            width: 40px;
            height: 32px;
            background: #404040;
            border: 1px solid #4d4d4d;
            border-radius: 2px;
        }

        .layer-name {
            flex: 1;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .layer-visibility {
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layer-visibility svg {
            width: 14px;
            height: 14px;
            fill: #ccc;
        }

        .layer-visibility.hidden svg {
            fill: #666;
        }

        .layer-actions {
            display: flex;
            gap: 4px;
            padding: 8px;
            border-top: 1px solid #3d3d3d;
        }

        .layer-action-btn {
            flex: 1;
            padding: 6px;
            background: #404040;
            border: none;
            border-radius: 4px;
            color: #ccc;
            cursor: pointer;
            font-size: 11px;
        }

        .layer-action-btn:hover {
            background: #4d4d4d;
        }

        /* History Panel */
        .history-item {
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 4px;
        }

        .history-item:hover {
            background: #3d3d3d;
        }

        .history-item.active {
            background: #0078d4;
        }

        .history-item.disabled {
            color: #666;
        }

        .history-icon {
            width: 16px;
            height: 16px;
        }

        /* Properties Panel */
        .property-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .property-label {
            width: 60px;
            font-size: 11px;
            color: #999;
        }

        .property-input {
            flex: 1;
            padding: 4px 8px;
            background: #1e1e1e;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            color: white;
            font-size: 11px;
        }

        /* Filters */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .filter-btn {
            padding: 8px;
            background: #404040;
            border: none;
            border-radius: 4px;
            color: #ccc;
            cursor: pointer;
            font-size: 11px;
        }

        .filter-btn:hover {
            background: #4d4d4d;
        }

        /* Blending */
        .blend-select {
            width: 100%;
            padding: 6px 8px;
            background: #1e1e1e;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            color: white;
            font-size: 12px;
        }

        /* Status Bar */
        .status-bar {
            height: 24px;
            background: #2d2d2d;
            border-top: 1px solid #3d3d3d;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 11px;
            gap: 20px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #2d2d2d;
            border-radius: 8px;
            min-width: 300px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 12px 16px;
            border-bottom: 1px solid #3d3d3d;
            font-weight: 600;
        }

        .modal-content {
            padding: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 8px 12px;
            background: #1e1e1e;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            color: white;
            margin-bottom: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .modal-btn.primary {
            background: #0078d4;
            color: white;
        }

        .modal-btn.secondary {
            background: #404040;
            color: #ccc;
        }

        /* Color Picker Modal */
        .color-picker-modal {
            width: 260px;
        }

        .color-sliders {
            margin-bottom: 12px;
        }

        .color-slider-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .color-slider-label {
            width: 20px;
            font-size: 11px;
        }

        .color-slider {
            flex: 1;
            height: 12px;
            -webkit-appearance: none;
            border-radius: 6px;
        }

        .color-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        #hueSlider { background: linear-gradient(to right, red, yellow, lime, cyan, blue, magenta, red); }
        #satSlider { background: linear-gradient(to right, gray, red); }
        #lightSlider { background: linear-gradient(to right, black, white); }

        .color-values {
            display: flex;
            gap: 8px;
        }

        .color-value-input {
            flex: 1;
            padding: 6px 8px;
            background: #1e1e1e;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            text-align: center;
        }

        /* Opacity Slider */
        .opacity-slider {
            width: 100%;
            margin: 8px 0;
        }

        .opacity-value {
            text-align: center;
            font-size: 11px;
            margin-top: 4px;
        }

        /* Brush cursor */
        .brush-cursor {
            position: fixed;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

        /* File input */
        .file-input {
            display: none;
        }

        /* Tooltip */
        .tool-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 48px;
            top: 50%;
            transform: translateY(-50%);
            background: #1e1e1e;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }

        .tool-btn:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Menu Bar -->
        <div class="menu-bar">
            <div class="menu-item" onclick="showFileMenu()">File</div>
            <div class="menu-item" onclick="showEditMenu()">Edit</div>
            <div class="menu-item" onclick="showImageMenu()">Image</div>
            <div class="menu-item" onclick="showLayerMenu()">Layer</div>
            <div class="menu-item" onclick="showFilterMenu()">Filter</div>
        </div>

        <!-- Tool Options Bar -->
        <div class="options-bar">
            <div class="option-group">
                <span class="option-label">Brush Size:</span>
                <input type="number" class="option-input" id="brushSize" value="10" min="1" max="200" onchange="updateBrushSize()">
            </div>
            <div class="option-group">
                <span class="option-label">Opacity:</span>
                <input type="number" class="option-input" id="brushOpacity" value="100" min="1" max="100" onchange="updateBrushOpacity()">
            </div>
            <div class="option-group">
                <span class="option-label">Hardness:</span>
                <input type="number" class="option-input" id="brushHardness" value="100" min="0" max="100" onchange="updateBrushHardness()">
            </div>
            <div class="option-group">
                <span class="option-label">Foreground:</span>
                <div class="color-preview" id="fgColor" onclick="openColorPicker('fg')">
                    <input type="color" id="fgColorInput" onchange="updateFGColor(this.value)">
                </div>
            </div>
            <div class="option-group">
                <span class="option-label">Background:</span>
                <div class="color-preview" id="bgColor">
                    <input type="color" id="bgColorInput" onchange="updateBGColor(this.value)">
                    <div class="outline"></div>
                </div>
            </div>
            <div class="option-group" style="margin-left: auto;">
                <button class="modal-btn secondary" onclick="openImage()">Open Image</button>
                <button class="modal-btn primary" onclick="saveImage()">Save PNG</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Tools Panel -->
            <div class="tools-panel">
                <button class="tool-btn active" data-tool="brush" data-tooltip="Brush Tool (B)" onclick="selectTool('brush')">
                    <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/></svg>
                </button>
                <button class="tool-btn" data-tool="eraser" data-tooltip="Eraser Tool (E)" onclick="selectTool('eraser')">
                    <svg viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.04 0 2.82l3.86 3.86c.78.78 2.04.78 2.82 0L20.41 10.27c.78-.78.78-2.04 0-2.82l-3.86-3.86c-.39-.39-.9-.59-1.41-.59zm-6.73 14.59l-3.86-3.86L13.32 4.95l3.86 3.86-8.77 8.78z"/></svg>
                </button>
                <button class="tool-btn" data-tool="move" data-tooltip="Move Tool (V)" onclick="selectTool('move')">
                    <svg viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>
                </button>
                <div class="tool-divider"></div>
                <button class="tool-btn" data-tool="selection" data-tooltip="Selection Tool (M)" onclick="selectTool('selection')">
                    <svg viewBox="0 0 24 24"><path d="M3 3h8v2H3V3zm0 4h8v2H3V7zm0 4h8v2H3v-2zm0 4h8v2H3v-2zm0 4h5v2H3v-2z"/></svg>
                </button>
                <button class="tool-btn" data-tool="lasso" data-tooltip="Lasso Tool (L)" onclick="selectTool('lasso')">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
                <div class="tool-divider"></div>
                <button class="tool-btn" data-tool="fill" data-tooltip="Fill Tool" onclick="selectTool('fill')">
                    <svg viewBox="0 0 24 24"><path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/></svg>
                </button>
                <button class="tool-btn" data-tool="gradient" data-tooltip="Gradient Tool" onclick="selectTool('gradient')">
                    <svg viewBox="0 0 24 24"><path d="M11 9H9v2h2V9zm0 2H9v2h2v-2zm4-4h-2v2h2V7zm4 2h-2v2h2V9zm0 2h-2v2h2v-2zm-4 4h-2v2h2v-2zm0 2h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 2h-2v2h2v-2zm0-6H7v6h2V9zm4 0h-2v6h2V9z"/></svg>
                </button>
                <div class="tool-divider"></div>
                <button class="tool-btn" data-tool="text" data-tooltip="Text Tool (T)" onclick="selectTool('text')">
                    <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
                </button>
                <button class="tool-btn" data-tool="shape" data-tooltip="Shape Tool (U)" onclick="selectTool('shape')">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
                </button>
                <button class="tool-btn" data-tool="pen" data-tooltip="Pen Tool (P)" onclick="selectTool('pen')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                </button>
                <div class="tool-divider"></div>
                <button class="tool-btn" data-tool="zoom" data-tooltip="Zoom Tool (Z)" onclick="selectTool('zoom')">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></svg>
                </button>
                <button class="tool-btn" data-tool="eyedropper" data-tooltip="Eyedropper (I)" onclick="selectTool('eyedropper')">
                    <svg viewBox="0 0 24 24"><path d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12c.4-.4.4-1.03.01-1.42zM6.92 19L5 17.08l8.06-8.06 1.92 1.92L6.92 19z"/></svg>
                </button>
            </div>

            <!-- Canvas Area -->
            <div class="canvas-area">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <div class="canvas-container" id="canvasContainer">
                        <canvas class="main-canvas" id="mainCanvas"></canvas>
                        <canvas class="preview-canvas" id="previewCanvas"></canvas>
                    </div>
                </div>
            </div>

            <!-- Right Panels -->
            <div class="right-panels">
                <!-- Layers Panel -->
                <div class="panel">
                    <div class="panel-header">
                        <span>Layers</span>
                    </div>
                    <div class="panel-content">
                        <div id="layersList"></div>
                        <div class="layer-actions">
                            <button class="layer-action-btn" onclick="addLayer()">+ Add</button>
                            <button class="layer-action-btn" onclick="duplicateLayer()">Duplicate</button>
                            <button class="layer-action-btn" onclick="deleteLayer()">Delete</button>
                        </div>
                        <div style="margin-top: 8px;">
                            <label class="option-label">Opacity:</label>
                            <input type="range" class="opacity-slider" id="layerOpacity" min="0" max="100" value="100" onchange="updateLayerOpacity(this.value)">
                            <div class="opacity-value" id="opacityValue">100%</div>
                        </div>
                        <div style="margin-top: 8px;">
                            <label class="option-label">Blend Mode:</label>
                            <select class="blend-select" id="blendMode" onchange="updateBlendMode(this.value)">
                                <option value="source-over">Normal</option>
                                <option value="multiply">Multiply</option>
                                <option value="screen">Screen</option>
                                <option value="overlay">Overlay</option>
                                <option value="darken">Darken</option>
                                <option value="lighten">Lighten</option>
                                <option value="color-dodge">Color Dodge</option>
                                <option value="color-burn">Color Burn</option>
                                <option value="soft-light">Soft Light</option>
                                <option value="hard-light">Hard Light</option>
                                <option value="difference">Difference</option>
                                <option value="exclusion">Exclusion</option>
                                <option value="hue">Hue</option>
                                <option value="saturation">Saturation</option>
                                <option value="color">Color</option>
                                <option value="luminosity">Luminosity</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- History Panel -->
                <div class="panel">
                    <div class="panel-header">
                        <span>History</span>
                    </div>
                    <div class="panel-content" style="max-height: 200px; overflow-y: auto;">
                        <div id="historyList"></div>
                    </div>
                </div>

                <!-- Filters Panel -->
                <div class="panel">
                    <div class="panel-header">
                        <span>Filters</span>
                    </div>
                    <div class="panel-content">
                        <div class="filter-grid">
                            <button class="filter-btn" onclick="applyFilter('blur')">Blur</button>
                            <button class="filter-btn" onclick="applyFilter('sharpen')">Sharpen</button>
                            <button class="filter-btn" onclick="applyFilter('brightness')">Brightness</button>
                            <button class="filter-btn" onclick="applyFilter('contrast')">Contrast</button>
                            <button class="filter-btn" onclick="applyFilter('grayscale')">Grayscale</button>
                            <button class="filter-btn" onclick="applyFilter('sepia')">Sepia</button>
                            <button class="filter-btn" onclick="applyFilter('invert')">Invert</button>
                            <button class="filter-btn" onclick="applyFilter('saturate')">Saturate</button>
                            <button class="filter-btn" onclick="applyFilter('hueRotate')">Hue Rotate</button>
                            <button class="filter-btn" onclick="applyFilter('blurMore')">Blur More</button>
                            <button class="filter-btn" onclick="applyFilter('noise')">Noise</button>
                            <button class="filter-btn" onclick="applyFilter('posterize')">Posterize</button>
                            <button class="filter-btn" onclick="applyFilter('vintage')">Vintage</button>
                            <button class="filter-btn" onclick="applyFilter('vignette')">Vignette</button>
                        </div>
                    </div>
                </div>

                <!-- Properties Panel -->
                <div class="panel">
                    <div class="panel-header">
                        <span>Properties</span>
                    </div>
                    <div class="panel-content">
                        <div class="property-row">
                            <span class="property-label">Canvas Size</span>
                            <input type="number" class="property-input" id="canvasWidth" value="800" onchange="resizeCanvas()">
                            <span style="margin: 0 4px;">×</span>
                            <input type="number" class="property-input" id="canvasHeight" value="600" onchange="resizeCanvas()">
                        </div>
                        <div class="property-row">
                            <span class="property-label">Position</span>
                            <input type="number" class="property-input" id="posX" value="0">
                            <span style="margin: 0 4px;">×</span>
                            <input type="number" class="property-input" id="posY" value="0">
                        </div>
                        <div class="property-row">
                            <span class="property-label">Cursor</span>
                            <span id="cursorPos" style="font-size: 11px;">X: 0, Y: 0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span>PhotoClone</span>
            <span id="zoomLevel">100%</span>
            <span id="canvasSize">800 × 600</span>
            <span id="layerInfo">Layer 1</span>
        </div>
    </div>

    <!-- Color Picker Modal -->
    <div class="modal-overlay" id="colorPickerModal">
        <div class="modal color-picker-modal">
            <div class="modal-header">Color Picker</div>
            <div class="modal-content">
                <div class="color-sliders">
                    <div class="color-slider-row">
                        <span class="color-slider-label">H</span>
                        <input type="range" class="color-slider" id="hueSlider" min="0" max="360" value="0">
                    </div>
                    <div class="color-slider-row">
                        <span class="color-slider-label">S</span>
                        <input type="range" class="color-slider" id="satSlider" min="0" max="100" value="100">
                    </div>
                    <div class="color-slider-row">
                        <span class="color-slider-label">L</span>
                        <input type="range" class="color-slider" id="lightSlider" min="0" max="100" value="50">
                    </div>
                </div>
                <div class="color-values">
                    <input type="text" class="color-value-input" id="hexValue" value="#FF0000" placeholder="#RRGGBB">
                </div>
                <div class="modal-buttons" style="margin-top: 12px;">
                    <button class="modal-btn secondary" onclick="closeColorPicker()">Cancel</button>
                    <button class="modal-btn primary" onclick="applyColorPicker()">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <!-- File Input -->
    <input type="file" class="file-input" id="fileInput" accept="image/*" onchange="loadImage(event)">

    <!-- Brush Cursor -->
    <div class="brush-cursor" id="brushCursor"></div>

    <script>
        // State
        const state = {
            currentTool: 'brush',
            brushSize: 10,
            brushOpacity: 100,
            brushHardness: 100,
            foregroundColor: '#000000',
            backgroundColor: '#ffffff',
            layers: [],
            activeLayerIndex: 0,
            history: [],
            historyIndex: -1,
            isDrawing: false,
            lastX: 0,
            lastY: 0,
            canvasWidth: 800,
            canvasHeight: 600,
            zoom: 1,
            colorPickerTarget: 'fg'
        };

        // Initialize
        function init() {
            setupCanvas();
            addLayer('Background');
            addLayer('Layer 1');
            setupEventListeners();
            setupKeyboardShortcuts();
            updateUI();
        }

        // Setup Canvas
        function setupCanvas() {
            const mainCanvas = document.getElementById('mainCanvas');
            const previewCanvas = document.getElementById('previewCanvas');
            const container = document.getElementById('canvasContainer');

            mainCanvas.width = state.canvasWidth;
            mainCanvas.height = state.canvasHeight;
            previewCanvas.width = state.canvasWidth;
            previewCanvas.height = state.canvasHeight;

            container.style.width = state.canvasWidth + 'px';
            container.style.height = state.canvasHeight + 'px';

            // Fill with white background for new layers
            const ctx = mainCanvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, state.canvasWidth, state.canvasHeight);
        }

        // Layer Management
        function addLayer(name = null) {
            const canvas = document.createElement('canvas');
            canvas.width = state.canvasWidth;
            canvas.height = state.canvasHeight;
            canvas.name = name || 'Layer ' + (state.layers.length + 1);

            state.layers.push({
                canvas: canvas,
                name: canvas.name,
                visible: true,
                opacity: 100,
                blendMode: 'source-over'
            });

            state.activeLayerIndex = state.layers.length - 1;
            updateLayersList();
            addHistory('Add Layer: ' + canvas.name);
            return state.layers.length - 1;
        }

        function duplicateLayer() {
            if (state.layers.length === 0) return;

            const activeLayer = state.layers[state.activeLayerIndex];
            const newCanvas = document.createElement('canvas');
            newCanvas.width = state.canvasWidth;
            newCanvas.height = state.canvasHeight;
            const ctx = newCanvas.getContext('2d');
            ctx.drawImage(activeLayer.canvas, 0, 0);

            newCanvas.name = activeLayer.name + ' Copy';

            state.layers.splice(state.activeLayerIndex + 1, 0, {
                canvas: newCanvas,
                name: newCanvas.name,
                visible: true,
                opacity: activeLayer.opacity,
                blendMode: activeLayer.blendMode
            });

            state.activeLayerIndex++;
            updateLayersList();
            renderAllLayers();
            addHistory('Duplicate Layer');
        }

        function deleteLayer() {
            if (state.layers.length <= 1) return;

            state.layers.splice(state.activeLayerIndex, 1);
            if (state.activeLayerIndex >= state.layers.length) {
                state.activeLayerIndex = state.layers.length - 1;
            }

            updateLayersList();
            renderAllLayers();
            addHistory('Delete Layer');
        }

        function selectLayer(index) {
            state.activeLayerIndex = index;
            updateLayersList();
            document.getElementById('layerOpacity').value = state.layers[index].opacity;
            document.getElementById('opacityValue').textContent = state.layers[index].opacity + '%';
            document.getElementById('blendMode').value = state.layers[index].blendMode;
            updateLayerInfo();
        }

        function toggleLayerVisibility(index) {
            state.layers[index].visible = !state.layers[index].visible;
            updateLayersList();
            renderAllLayers();
        }

        function updateLayersList() {
            const list = document.getElementById('layersList');
            list.innerHTML = '';

            for (let i = state.layers.length - 1; i >= 0; i--) {
                const layer = state.layers[i];
                const item = document.createElement('div');
                item.className = 'layer-item' + (i === state.activeLayerIndex ? ' active' : '');
                item.onclick = () => selectLayer(i);

                const preview = document.createElement('canvas');
                preview.className = 'layer-preview';
                preview.width = 40;
                preview.height = 32;
                const previewCtx = preview.getContext('2d');
                previewCtx.drawImage(layer.canvas, 0, 0, 40, 32);

                const name = document.createElement('span');
                name.className = 'layer-name';
                name.textContent = layer.name;

                const visibility = document.createElement('button');
                visibility.className = 'layer-visibility' + (layer.visible ? '' : ' hidden');
                visibility.innerHTML = layer.visible ?
                    '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>' :
                    '<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>';
                visibility.onclick = (e) => {
                    e.stopPropagation();
                    toggleLayerVisibility(i);
                };

                item.appendChild(preview);
                item.appendChild(name);
                item.appendChild(visibility);
                list.appendChild(item);
            }
        }

        // History Management
        function addHistory(action) {
            // Save current state
            const snapshot = saveSnapshot();
            state.history = state.history.slice(0, state.historyIndex + 1);
            state.history.push({ action, snapshot });
            state.historyIndex = state.history.length - 1;
            updateHistoryList();
        }

        function saveSnapshot() {
            const snapshot = [];
            for (const layer of state.layers) {
                snapshot.push({
                    imageData: layer.canvas.getContext('2d').getImageData(0, 0, state.canvasWidth, state.canvasHeight),
                    visible: layer.visible,
                    opacity: layer.opacity,
                    blendMode: layer.blendMode,
                    name: layer.name
                });
            }
            return snapshot;
        }

        function restoreSnapshot(snapshotIndex) {
            if (snapshotIndex < 0 || snapshotIndex >= state.history.length) return;

            const snapshot = state.history[snapshotIndex].snapshot;
            state.layers = [];

            for (const data of snapshot) {
                const canvas = document.createElement('canvas');
                canvas.width = state.canvasWidth;
                canvas.height = state.canvasHeight;
                const ctx = canvas.getContext('2d');
                ctx.putImageData(data.imageData, 0, 0);

                state.layers.push({
                    canvas: canvas,
                    name: data.name,
                    visible: data.visible,
                    opacity: data.opacity,
                    blendMode: data.blendMode
                });
            }

            state.historyIndex = snapshotIndex;
            updateLayersList();
            renderAllLayers();
            updateHistoryList();
        }

        function updateHistoryList() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            state.history.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item' +
                    (index === state.historyIndex ? ' active' : '') +
                    (index > state.historyIndex ? ' disabled' : '');
                historyItem.innerHTML = `
                    <svg class="history-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
                    </svg>
                    <span>${item.action}</span>
                `;
                historyItem.onclick = () => restoreSnapshot(index);
                list.appendChild(historyItem);
            });
        }

        // Tool Selection
        function selectTool(tool) {
            state.currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === tool);
            });

            const canvas = document.getElementById('mainCanvas');
            canvas.style.cursor = tool === 'move' ? 'move' : 'crosshair';

            updateBrushCursor();
        }

        // Drawing
        function getMousePos(e) {
            const canvas = document.getElementById('mainCanvas');
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) / state.zoom,
                y: (e.clientY - rect.top) / state.zoom
            };
        }

        function startDrawing(e) {
            state.isDrawing = true;
            const pos = getMousePos(e);
            state.lastX = pos.x;
            state.lastY = pos.y;

            if (state.currentTool === 'brush' || state.currentTool === 'eraser') {
                drawDot(pos.x, pos.y);
            } else if (state.currentTool === 'eyedropper') {
                pickColor(pos.x, pos.y);
            } else if (state.currentTool === 'fill') {
                floodFill(Math.floor(pos.x), Math.floor(pos.y));
            }
        }

        function draw(e) {
            if (!state.isDrawing) return;

            const pos = getMousePos(e);

            if (state.currentTool === 'brush' || state.currentTool === 'eraser') {
                drawLine(state.lastX, state.lastY, pos.x, pos.y);
                state.lastX = pos.x;
                state.lastY = pos.y;
            }

            updateCursorPosition(pos.x, pos.y);
        }

        function stopDrawing() {
            if (state.isDrawing && (state.currentTool === 'brush' || state.currentTool === 'eraser')) {
                addHistory('Draw');
            }
            state.isDrawing = false;
        }

        function drawDot(x, y) {
            const layer = state.layers[state.activeLayerIndex];
            if (!layer || !layer.visible) return;

            const ctx = layer.canvas.getContext('2d');
            ctx.globalAlpha = state.brushOpacity / 100;
            ctx.globalCompositeOperation = state.currentTool === 'eraser' ? 'destination-out' : 'source-over';

            const gradient = ctx.createRadialGradient(x, y, 0, x, y, state.brushSize / 2);
            gradient.addColorStop(0, state.foregroundColor);
            gradient.addColorStop(state.brushHardness / 100, state.foregroundColor);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = state.currentTool === 'eraser' ? 'rgba(0,0,0,1)' : gradient;
            ctx.beginPath();
            ctx.arc(x, y, state.brushSize / 2, 0, Math.PI * 2);
            ctx.fill();

            renderAllLayers();
        }

        function drawLine(x1, y1, x2, y2) {
            const layer = state.layers[state.activeLayerIndex];
            if (!layer || !layer.visible) return;

            const ctx = layer.canvas.getContext('2d');
            ctx.globalAlpha = state.brushOpacity / 100;
            ctx.globalCompositeOperation = state.currentTool === 'eraser' ? 'destination-out' : 'source-over';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = state.brushSize;
            ctx.strokeStyle = state.currentTool === 'eraser' ? 'rgba(0,0,0,1)' : state.foregroundColor;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            renderAllLayers();
        }

        function pickColor(x, y) {
            const layer = state.layers[state.activeLayerIndex];
            if (!layer) return;

            const ctx = layer.canvas.getContext('2d');
            const pixel = ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
            const color = '#' + [pixel[0], pixel[1], pixel[2]].map(x => x.toString(16).padStart(2, '0')).join('');

            state.foregroundColor = color;
            document.getElementById('fgColor').style.backgroundColor = color;
            document.getElementById('fgColorInput').value = color;

            addHistory('Eyedropper');
        }

        // Flood Fill
        function floodFill(startX, startY) {
            const layer = state.layers[state.activeLayerIndex];
            if (!layer) return;

            const ctx = layer.canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, state.canvasWidth, state.canvasHeight);
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;

            const startIdx = (startY * width + startX) * 4;
            const startR = data[startIdx];
            const startG = data[startIdx + 1];
            const startB = data[startIdx + 2];

            const fillColor = hexToRgb(state.foregroundColor);
            if (startR === fillColor.r && startG === fillColor.g && startB === fillColor.b) return;

            const stack = [[startX, startY]];
            const visited = new Set();

            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const key = `${x},${y}`;

                if (x < 0 || x >= width || y < 0 || y >= height || visited.has(key)) continue;

                const idx = (y * width + x) * 4;
                if (data[idx] !== startR || data[idx + 1] !== startG || data[idx + 2] !== startB) continue;

                visited.add(key);

                data[idx] = fillColor.r;
                data[idx + 1] = fillColor.g;
                data[idx + 2] = fillColor.b;
                data[idx + 3] = 255;

                stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
            }

            ctx.putImageData(imageData, 0, 0);
            renderAllLayers();
            addHistory('Fill');
        }

        // Render all layers
        function renderAllLayers() {
            const mainCanvas = document.getElementById('mainCanvas');
            const ctx = mainCanvas.getContext('2d');

            ctx.clearRect(0, 0, state.canvasWidth, state.canvasHeight);

            // Draw checkerboard background
            const patternSize = 10;
            for (let y = 0; y < state.canvasHeight; y += patternSize) {
                for (let x = 0; x < state.canvasWidth; x += patternSize) {
                    ctx.fillStyle = ((x + y) / patternSize) % 2 === 0 ? '#ffffff' : '#e0e0e0';
                    ctx.fillRect(x, y, patternSize, patternSize);
                }
            }

            for (const layer of state.layers) {
                if (!layer.visible) continue;

                ctx.globalAlpha = layer.opacity / 100;
                ctx.globalCompositeOperation = layer.blendMode;
                ctx.drawImage(layer.canvas, 0, 0);
            }

            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
        }

        // Filters
        function applyFilter(filterType) {
            const layer = state.layers[state.activeLayerIndex];
            if (!layer) return;

            const ctx = layer.canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, state.canvasWidth, state.canvasHeight);
            const data = imageData.data;

            switch (filterType) {
                case 'blur':
                    applyConvolution(data, state.canvasWidth, state.canvasHeight, [
                        1/9, 1/9, 1/9,
                        1/9, 1/9, 1/9,
                        1/9, 1/9, 1/9
                    ]);
                    break;
                case 'blurMore':
                    applyConvolution(data, state.canvasWidth, state.canvasHeight, [
                        1/16, 2/16, 1/16,
                        2/16, 4/16, 2/16,
                        1/16, 2/16, 1/16
                    ]);
                    break;
                case 'sharpen':
                    applyConvolution(data, state.canvasWidth, state.canvasHeight, [
                        0, -1, 0,
                        -1, 5, -1,
                        0, -1, 0
                    ]);
                    break;
                case 'brightness':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.min(255, data[i] * 1.3);
                        data[i + 1] = Math.min(255, data[i + 1] * 1.3);
                        data[i + 2] = Math.min(255, data[i + 2] * 1.3);
                    }
                    break;
                case 'contrast':
                    const contrast = 1.5;
                    const factor = (259 * (contrast * 255 + 255)) / (255 * (259 - contrast * 255));
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = factor * (data[i] - 128) + 128;
                        data[i + 1] = factor * (data[i + 1] - 128) + 128;
                        data[i + 2] = factor * (data[i + 2] - 128) + 128;
                    }
                    break;
                case 'grayscale':
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                        data[i] = data[i + 1] = data[i + 2] = gray;
                    }
                    break;
                case 'sepia':
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i + 1], b = data[i + 2];
                        data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                        data[i + 1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                        data[i + 2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
                    }
                    break;
                case 'invert':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = 255 - data[i];
                        data[i + 1] = 255 - data[i + 1];
                        data[i + 2] = 255 - data[i + 2];
                    }
                    break;
                case 'saturate':
                    const sat = 2;
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                        data[i] = Math.min(255, gray + (data[i] - gray) * sat);
                        data[i + 1] = Math.min(255, gray + (data[i + 1] - gray) * sat);
                        data[i + 2] = Math.min(255, gray + (data[i + 2] - gray) * sat);
                    }
                    break;
                case 'hueRotate':
                    // Simple hue rotation using CSS filter
                    layer.canvas.style.filter = 'hue-rotate(90deg)';
                    renderAllLayers();
                    addHistory('Filter: ' + filterType);
                    return;
                case 'noise':
                    for (let i = 0; i < data.length; i += 4) {
                        const noise = (Math.random() - 0.5) * 50;
                        data[i] = Math.min(255, Math.max(0, data[i] + noise));
                        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
                        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
                    }
                    break;
                case 'posterize':
                    const levels = 4;
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.round(data[i] / 255 * levels) * (255 / levels);
                        data[i + 1] = Math.round(data[i + 1] / 255 * levels) * (255 / levels);
                        data[i + 2] = Math.round(data[i + 2] / 255 * levels) * (255 / levels);
                    }
                    break;
                case 'vintage':
                    applyFilter('sepia');
                    applyConvolution(data, state.canvasWidth, state.canvasHeight, [
                        1/9, 1/9, 1/9,
                        1/9, 1/9, 1/9,
                        1/9, 1/9, 1/9
                    ]);
                    break;
                case 'vignette':
                    const centerX = state.canvasWidth / 2;
                    const centerY = state.canvasHeight / 2;
                    const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);
                    for (let y = 0; y < state.canvasHeight; y++) {
                        for (let x = 0; x < state.canvasWidth; x++) {
                            const idx = (y * state.canvasWidth + x) * 4;
                            const dist = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
                            const factor = 1 - Math.pow(dist / maxDist, 2) * 0.7;
                            data[idx] *= factor;
                            data[idx + 1] *= factor;
                            data[idx + 2] *= factor;
                        }
                    }
                    break;
            }

            ctx.putImageData(imageData, 0, 0);
            renderAllLayers();
            addHistory('Filter: ' + filterType);
        }

        function applyConvolution(data, width, height, kernel) {
            const copy = new Uint8ClampedArray(data);
            const kSize = Math.sqrt(kernel.length);
            const half = Math.floor(kSize / 2);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0;

                    for (let ky = 0; ky < kSize; ky++) {

  function handleParentMessage(event) {
    console.log("Received message from parent:", event.data);
    if (event.data.type === "iframe-highlight-toggle") {
      var enabled = event.data.enabled;
      console.log("Highlight toggle:", enabled);
      if (enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "enable-iframe-highlight") {
      console.log("Enable iframe highlight");
      enableHighlight();
    } else if (event.data.type === "disable-iframe-highlight") {
      console.log("Disable iframe highlight");
      disableHighlight();
    } else if (event.data.type === "toggle-iframe-highlight") {
      var _enabled = event.data.enabled !== undefined ? event.data.enabled : !highlightEnabled;
      console.log("Toggle iframe highlight to:", _enabled);
      if (_enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "update-selected-element") {
      var selector = event.data.selector;
      console.log("Update selected element with selector:", selector);
      if (selector) {
        try {
          var element = document.querySelector(selector);
          console.log("Found element by selector:", element);
          updateSelectedHighlight(element);
        } catch (error) {
          console.warn("Failed to select element:", error);
          updateSelectedHighlight(null);
        }
      } else {
        updateSelectedHighlight(null);
      }
    } else if (event.data.type === "clear-selected-element") {
      console.log("Clear selected element");
      updateSelectedHighlight(null);
    }
  }

  // 启用高亮功能
  function enableHighlight() {
    console.log("Enabling highlight");
    document.addEventListener("mouseover", handleMouseOver, true);
    document.addEventListener("mouseout", handleMouseOut, true);
    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
