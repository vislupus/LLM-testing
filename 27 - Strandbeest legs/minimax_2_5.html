<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Algorithm Walker Evolution</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a14;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 15, 25, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 150, 0.15);
            border-radius: 14px;
            padding: 20px;
            width: 260px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        #controls h1 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        #controls .subtitle {
            font-size: 10px;
            color: #556;
            margin-bottom: 16px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 10px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
        }

        .stat-value.generation { color: #ffd93d; }
        .stat-value.best { color: #4caf50; }
        .stat-value.average { color: #60a5fa; }
        .stat-value.alive { color: #f87171; }

        .stat-label {
            font-size: 8px;
            color: #667788;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .control-row {
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-row label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8899aa;
            margin-bottom: 6px;
        }

        .control-row label span.value {
            color: #64ffda;
            font-weight: 600;
            font-size: 10px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
        }

        .toggle-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid rgba(100, 200, 150, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            color: #8899aa;
            font-size: 9px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .toggle-btn:hover {
            background: rgba(100, 200, 150, 0.1);
        }

        .toggle-btn.active {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            color: #4caf50;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            color: #0a0a14;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #aabbcc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .instructions {
            font-size: 9px;
            color: #556;
            line-height: 1.6;
        }

        .instructions .key {
            display: inline-block;
            background: rgba(100, 200, 150, 0.15);
            border: 1px solid rgba(100, 200, 150, 0.25);
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 8px;
            color: #64ffda;
            margin: 0 2px;
        }

        .legend {
            display: flex;
            gap: 8px;
            font-size: 9px;
            margin-top: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .legend-dot.best { background: #4caf50; }
        .legend-dot.normal { background: #607d8b; }
        .legend-dot.failed { background: #f87171; }

        #status {
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
            font-size: 10px;
            text-align: center;
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        #status.paused {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
            border-color: rgba(255, 193, 7, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="controls">
        <h1>GENETIC WALKER</h1>
        <div class="subtitle">Strandbeest Evolution Simulator</div>

        <div class="panel">
            <div class="panel-title">Statistics</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value generation" id="generation">0</div>
                    <div class="stat-label">Generation</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value best" id="bestFitness">0</div>
                    <div class="stat-label">Best Distance</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value average" id="avgFitness">0</div>
                    <div class="stat-label">Avg Distance</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value alive" id="aliveCount">0</div>
                    <div class="stat-label">Alive</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Parameters</div>
            <div class="control-row">
                <label>Population Size <span class="value" id="popVal">30</span></label>
                <input type="range" id="population" min="10" max="60" value="30">
            </div>
            <div class="control-row">
                <label>Mutation Rate <span class="value" id="mutVal">5%</span></label>
                <input type="range" id="mutation" min="1" max="30" value="5">
            </div>
            <div class="control-row">
                <label>Generation Time <span class="value" id="timeVal">10s</span></label>
                <input type="range" id="genTime" min="3" max="20" value="10">
            </div>
            <div class="control-row">
                <label>Leg Segments <span class="value" id="segVal">3</span></label>
                <input type="range" id="segments" min="2" max="5" value="3">
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Controls</div>
            <div class="toggle-group">
                <button class="toggle-btn active" id="runBtn" onclick="toggleRun()">Run</button>
                <button class="toggle-btn" id="pauseBtn" onclick="toggleRun()">Pause</button>
            </div>
            <button class="btn btn-secondary" onclick="resetPopulation()">Reset Population</button>
            <button class="btn btn-primary" onclick="replayBest()">Replay Best</button>
        </div>

        <div class="panel">
            <div class="legend">
                <div class="legend-item"><div class="legend-dot best"></div> Best</div>
                <div class="legend-item"><div class="legend-dot normal"></div> Normal</div>
                <div class="legend-item"><div class="legend-dot failed"></div> Failed</div>
            </div>
        </div>

        <div class="instructions">
            <span class="key">Space</span> Pause/Resume<br>
            <span class="key">R</span> Reset<br>
            <span class="key">B</span> Replay best
        </div>

        <div id="status">Running - Generation 1</div>
    </div>

    <script>
        // ============================================
        // GENETIC ALGORITHM WALKER SIMULATION
        // ============================================

        // Genome class - encodes leg parameters
        class Genome {
            constructor(genes = null, numSegments = 3) {
                this.numSegments = numSegments;
                this.genesPerLeg = 2 * numSegments + 2; // segment lengths + angles + phase + speed
                this.numLegs = 4; // 4 legs

                if (genes) {
                    this.genes = genes;
                } else {
                    // Initialize with random genes
                    this.genes = [];
                    for (let i = 0; i < this.getTotalGenes(); i++) {
                        this.genes.push(Math.random());
                    }
                }
            }

            getTotalGenes() {
                return this.numLegs * this.genesPerLeg;
            }

            // Get parameters for a specific leg
            getLegParams(legIndex) {
                let start = legIndex * this.genesPerLeg;
                let params = {
                    segments: [],
                    phase: 0,
                    speed: 0.5
                };

                // Decode segment lengths
                for (let i = 0; i < this.numSegments; i++) {
                    params.segments.push(0.3 + this.genes[start + i] * 0.7); // 0.3 to 1.0
                }

                // Decode angles
                let angleOffset = this.numSegments;
                params.baseAngle = (this.genes[start + angleOffset] - 0.5) * Math.PI * 0.8;
                params.amplitude = 0.2 + this.genes[start + angleOffset + 1] * 0.6;

                // Phase offset for this leg
                params.phase = legIndex * 0.5 + this.genes[start + angleOffset + 2];

                // Speed
                params.speed = 0.3 + this.genes[start + angleOffset + 3] * 1.5;

                return params;
            }

            mutate(rate) {
                for (let i = 0; i < this.genes.length; i++) {
                    if (Math.random() < rate) {
                        this.genes[i] += (Math.random() - 0.5) * 0.2;
                        this.genes[i] = Math.max(0, Math.min(1, this.genes[i]));
                    }
                }
            }

            clone() {
                return new Genome([...this.genes], this.numSegments);
            }

            static crossover(parentA, parentB) {
                let childGenes = [];
                for (let i = 0; i < parentA.genes.length; i++) {
                    childGenes.push(Math.random() < 0.5 ? parentA.genes[i] : parentB.genes[i]);
                }
                return new Genome(childGenes, parentA.numSegments);
            }
        }

        // Walker class - the creature with legs
        class Walker {
            constructor(genome, scene, id) {
                this.genome = genome;
                this.scene = scene;
                this.id = id;
                this.alive = true;
                this.fitness = 0;
                this.startX = 0;
                this.bodyX = 0;
                this.bodyY = 1;
                this.failed = false;

                // Create meshes
                this.meshes = [];
                this.legs = [];

                this.createBody();
                this.createLegs();
            }

            createBody() {
                // Main body
                this.body = BABYLON.MeshBuilder.CreateBox("body" + this.id, {
                    width: 1.5,
                    height: 0.4,
                    depth: 0.8
                }, this.scene);
                this.body.position.y = 0.5;

                let bodyMat = new BABYLON.StandardMaterial("bodyMat" + this.id, this.scene);
                bodyMat.diffuseColor = new BABYLON.Color3(0.38, 0.49, 0.55);
                this.body.material = bodyMat;

                this.meshes.push(this.body);
            }

            createLegs() {
                let legPositions = [
                    { x: 0.6, z: 0.35 },
                    { x: 0.6, z: -0.35 },
                    { x: -0.6, z: 0.35 },
                    { x: -0.6, z: -0.35 }
                ];

                for (let i = 0; i < 4; i++) {
                    let params = this.genome.getLegParams(i);
                    let leg = {
                        meshes: [],
                        params: params,
                        position: legPositions[i]
                    };

                    // Create pivot point
                    let pivot = new BABYLON.TransformNode("pivot" + this.id + "_" + i, this.scene);
                    pivot.position = new BABYLON.Vector3(legPositions[i].x, 0.5, legPositions[i].z);
                    leg.pivot = pivot;

                    // Create segments
                    let currentParent = pivot;
                    let totalLength = 0;

                    for (let j = 0; j < params.segments.length; j++) {
                        let segLength = params.segments[j];
                        totalLength += segLength;

                        let segment = BABYLON.MeshBuilder.CreateBox("seg" + this.id + "_" + i + "_" + j, {
                            width: 0.08,
                            height: 0.08,
                            depth: segLength
                        }, this.scene);

                        segment.position.z = j === 0 ? segLength / 2 : params.segments[j - 1];
                        segment.parent = currentParent;

                        let segMat = new BABYLON.StandardMaterial("segMat" + this.id + "_" + i + "_" + j, this.scene);
                        segMat.diffuseColor = new BABYLON.Color3(0.38, 0.49, 0.55);
                        segment.material = segMat;

                        leg.meshes.push(segment);

                        // Create joint for next segment
                        if (j < params.segments.length - 1) {
                            let joint = new BABYLON.TransformNode("joint" + this.id + "_" + i + "_" + j, this.scene);
                            joint.position.z = segLength;
                            joint.parent = currentParent === pivot ? segment : currentParent;
                            currentParent = joint;
                        }
                    }

                    this.legs.push(leg);
                    this.meshes.push(pivot);
                }
            }

            update(time) {
                if (!this.alive) return;

                // Animate legs using forward kinematics
                for (let leg of this.legs) {
                    let params = leg.params;

                    // Oscillate the pivot
                    let angle = params.baseAngle + Math.sin(time * params.speed + params.phase) * params.amplitude;
                    leg.pivot.rotation.x = angle;

                    // Calculate foot position (simple FK approximation)
                    let footZ = 0;
                    for (let seg of params.segments) {
                        footZ += seg;
                    }

                    // Simple movement - if foot is behind body, push forward
                    let footWorldX = this.bodyX + leg.position.x + Math.sin(angle) * footZ;

                    if (footWorldX < this.bodyX - 0.5) {
                        // Foot behind - move forward
                        this.bodyX += 0.02 * params.speed;
                    }
                }

                // Update body position
                this.body.position.x = this.bodyX;
                this.fitness = this.bodyX - this.startX;

                // Check if fallen
                if (this.body.position.y < 0.3 || this.failed) {
                    this.alive = false;
                    this.failed = true;
                    this.setColor(new BABYLON.Color3(0.97, 0.44, 0.44));
                }
            }

            setColor(color) {
                for (let mesh of this.meshes) {
                    if (mesh.material) {
                        mesh.material.diffuseColor = color;
                    }
                }
            }

            dispose() {
                for (let mesh of this.meshes) {
                    mesh.dispose();
                }
            }
        }

        // ============================================
        // GENETIC ALGORITHM MANAGER
        // ============================================

        class EvolutionManager {
            constructor(scene) {
                this.scene = scene;
                this.population = [];
                this.generation = 1;
                this.isRunning = true;
                this.generationTime = 10; // seconds
                this.currentTime = 0;
                this.populationSize = 30;
                this.mutationRate = 0.05;
                this.numSegments = 3;
                this.bestGenome = null;
                this.bestFitness = 0;

                this.initPopulation();
            }

            initPopulation() {
                // Clear existing
                for (let walker of this.population) {
                    walker.dispose();
                }
                this.population = [];

                // Create new population
                for (let i = 0; i < this.populationSize; i++) {
                    let genome = new Genome(null, this.numSegments);
                    let walker = new Walker(genome, this.scene, i);
                    this.population.push(walker);
                }

                this.currentTime = 0;
            }

            update(deltaTime) {
                if (!this.isRunning) return;

                this.currentTime += deltaTime;

                // Update all walkers
                for (let walker of this.population) {
                    walker.update(this.currentTime);
                }

                // Check if generation is complete
                if (this.currentTime >= this.generationTime) {
                    this.evolve();
                }
            }

            evolve() {
                // Calculate fitness
                let fitnessData = [];
                for (let walker of this.population) {
                    fitnessData.push({ walker: walker, fitness: walker.fitness });
                }

                // Sort by fitness
                fitnessData.sort((a, b) => b.fitness - a.fitness);

                // Track best
                let best = fitnessData[0];
                if (best.fitness > this.bestFitness) {
                    this.bestFitness = best.fitness;
                    this.bestGenome = best.walker.genome.clone();
                }

                // Calculate average
                let avgFitness = fitnessData.reduce((sum, d) => sum + d.fitness, 0) / fitnessData.length;

                // Update UI
                document.getElementById('bestFitness').textContent = best.fitness.toFixed(2);
                document.getElementById('avgFitness').textContent = avgFitness.toFixed(2);
                document.getElementById('generation').textContent = this.generation;

                // Selection - keep top 50%
                let survivors = fitnessData.slice(0, Math.floor(this.populationSize * 0.5));
                let survivorsCount = survivors.length;

                // Create new generation
                let newWalkers = [];

                // Elitism - keep best unchanged
                let bestWalker = survivors[0].walker;
                bestWalker.setColor(new BABYLON.Color3(0.3, 0.69, 0.31)); // Green
                newWalkers.push(bestWalker);

                // Fill rest with offspring
                while (newWalkers.length < this.populationSize) {
                    // Tournament selection
                    let parentA = survivors[Math.floor(Math.random() * survivorsCount)].walker.genome;
                    let parentB = survivors[Math.floor(Math.random() * survivorsCount)].walker.genome;

                    // Crossover
                    let childGenome = Genome.crossover(parentA, parentB);

                    // Mutation
                    childGenome.mutate(this.mutationRate);

                    let child = new Walker(childGenome, this.scene, newWalkers.length);
                    newWalkers.push(child);
                }

                // Dispose old walkers
                for (let walker of this.population) {
                    if (walker !== bestWalker) {
                        walker.dispose();
                    }
                }

                this.population = newWalkers;
                this.generation++;
                this.currentTime = 0;

                // Update status
                let alive = this.population.filter(w => w.alive).length;
                document.getElementById('aliveCount').textContent = alive;
                document.getElementById('status').textContent = `Running - Generation ${this.generation}`;
            }

            setPopulationSize(size) {
                this.populationSize = size;
            }

            setMutationRate(rate) {
                this.mutationRate = rate;
            }

            setGenerationTime(time) {
                this.generationTime = time;
            }

            setSegments(segments) {
                this.numSegments = segments;
                this.reset();
            }

            reset() {
                this.generation = 1;
                this.bestFitness = 0;
                this.bestGenome = null;
                this.initPopulation();
            }

            replayBest() {
                if (!this.bestGenome) return;

                // Clear current
                for (let walker of this.population) {
                    walker.dispose();
                }
                this.population = [];

                // Create best walker
                let best = new Walker(this.bestGenome, this.scene, 0);
                best.setColor(new BABYLON.Color3(0.3, 0.69, 0.31));
                this.population.push(best);

                this.isRunning = false;
                document.getElementById('status').textContent = 'Replaying Best';
            }

            toggle() {
                this.isRunning = !this.isRunning;
            }
        }

        // ============================================
        // BABYLON.JS SETUP
        // ============================================

        let canvas = document.getElementById("renderCanvas");
        let engine = new BABYLON.Engine(canvas, true);
        let scene, camera, evolutionManager;

        function createScene() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.04, 0.04, 0.08, 1);

            // Camera
            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 25, new BABYLON.Vector3(5, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;

            // Lights
            let hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemi.intensity = 0.6;

            let dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
            dir.intensity = 0.4;

            // Ground
            let ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 200, height: 40 }, scene);

            let groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.2);
            groundMat.specularColor = new BABYLON.Color3(0, 0, 0);
            ground.material = groundMat;

            // Grid lines
            for (let i = -100; i <= 100; i += 2) {
                let line = BABYLON.MeshBuilder.CreateLines("line" + i, {
                    points: [new BABYLON.Vector3(i, 0.01, -20), new BABYLON.Vector3(i, 0.01, 20)]
                }, scene);
                line.color = new BABYLON.Color3(0.25, 0.25, 0.35);
            }

            for (let i = -20; i <= 20; i += 2) {
                let line = BABYLON.MeshBuilder.CreateLines("hline" + i, {
                    points: [new BABYLON.Vector3(-100, 0.01, i), new BABYLON.Vector3(100, 0.01, i)]
                }, scene);
                line.color = new BABYLON.Color3(0.25, 0.25, 0.35);
            }

            // Evolution Manager
            evolutionManager = new EvolutionManager(scene);

            return scene;
        }

        createScene();

        // Render loop
        engine.runRenderLoop(function() {
            let deltaTime = engine.getDeltaTime() / 1000;
            evolutionManager.update(deltaTime);

            // Update alive count periodically
            if (scene.getFrameId() % 30 === 0) {
                let alive = evolutionManager.population.filter(w => w.alive).length;
                document.getElementById('aliveCount').textContent = alive;
            }

            scene.render();
        });

        // Window resize
        window.addEventListener("resize", function() {
            engine.resize();
        });

        // ============================================
        // UI CONTROLS
        // ============================================

        document.getElementById('population').addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            document.getElementById('popVal').textContent = val;
            evolutionManager.setPopulationSize(val);
        });

        document.getElementById('mutation').addEventListener('input', (e) => {
            let val = parseInt(e.target.value) / 100;
            document.getElementById('mutVal').textContent = (val * 100).toFixed(0) + '%';
            evolutionManager.setMutationRate(val);
        });

        document.getElementById('genTime').addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            document.getElementById('timeVal').textContent = val + 's';
            evolutionManager.setGenerationTime(val);
        });

        document.getElementById('segments').addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            document.getElementById('segVal').textContent = val;
            evolutionManager.setSegments(val);
        });

        function toggleRun() {
            evolutionManager.toggle();
            let status = document.getElementById('status');
            status.classList.toggle('paused', !evolutionManager.isRunning);
            status.textContent = evolutionManager.isRunning ? `Running - Generation ${evolutionManager.generation}` : 'Paused';
            document.getElementById('runBtn').classList.toggle('active', evolutionManager.isRunning);
            document.getElementById('pauseBtn').classList.toggle('active', !evolutionManager.isRunning);
        }

        function resetPopulation() {
            evolutionManager.reset();
            document.getElementById('generation').textContent = '1';
            document.getElementById('bestFitness').textContent = '0';
            document.getElementById('status').textContent = 'Running - Generation 1';
        }

        function replayBest() {
            evolutionManager.replayBest();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleRun();
            } else if (e.code === 'KeyR') {
                resetPopulation();
            } else if (e.code === 'KeyB') {
                replayBest();
            }
        });
    </script>
</body>
</html>
