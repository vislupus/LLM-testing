<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strandbeest Evolution - Babylon.js GA Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;color:#e0e0e0}
#renderCanvas{width:100%;height:100%;position:absolute;top:0;left:0;touch-action:none}
#ui{position:absolute;top:10px;left:10px;width:300px;max-height:calc(100vh - 20px);overflow-y:auto;background:rgba(20,20,30,.9);border-radius:12px;padding:16px;border:1px solid rgba(100,140,255,.2);backdrop-filter:blur(10px)}
#ui h2{font-size:15px;color:#6ea8fe;margin-bottom:10px;display:flex;align-items:center;gap:6px}
#ui h2 span{font-size:18px}
.section{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.section:last-child{border:none;margin:0;padding:0}
.section h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.row label{font-size:12px;color:#aaa;flex:1}
.row .val{font-size:11px;color:#6ea8fe;min-width:36px;text-align:right}
input[type=range]{width:100px;accent-color:#6ea8fe}
input[type=number]{width:60px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#e0e0e0;border-radius:4px;padding:3px 6px;font-size:11px;text-align:center}
button{padding:6px 14px;border-radius:6px;border:1px solid rgba(100,140,255,.3);background:rgba(60,100,180,.2);color:#6ea8fe;font-size:12px;cursor:pointer;transition:all .2s}
button:hover{background:rgba(60,100,180,.4);border-color:#6ea8fe}
button.active{background:rgba(60,180,100,.3);border-color:#6ecfae;color:#6ecfae}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#stats{font-size:11px;line-height:1.6}
#stats .stat-row{display:flex;justify-content:space-between}
#stats .stat-val{color:#6ea8fe;font-weight:600}
#genome-display{font-size:10px;color:#666;margin-top:8px;font-family:monospace;word-break:break-all;max-height:60px;overflow-y:auto}
#fitness-graph{width:100%;height:80px;background:rgba(0,0,0,.3);border-radius:6px;margin-top:8px}
.legend{display:flex;gap:12px;font-size:10px;color:#888;margin-top:4px}
.legend span{display:flex;align-items:center;gap:3px}
.legend .dot{width:8px;height:8px;border-radius:50%}
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="ui">
  <h2><span>🦿</span> Strandbeest Evolution</h2>

  <div class="section">
    <h3>Controls</h3>
    <div class="btn-row">
      <button id="btn-start" onclick="toggleEvolution()">▶ Start</button>
      <button id="btn-step" onclick="stepGeneration()">⏭ Step</button>
      <button id="btn-replay" onclick="replayBest()">🔄 Replay Best</button>
      <button id="btn-reset" onclick="resetEvolution()">↺ Reset</button>
    </div>
    <div class="row">
      <label>Sim Speed</label>
      <input type="range" id="sim-speed" min="1" max="20" value="5" oninput="simSpeed=+this.value;this.nextElementSibling.textContent=this.value+'x'">
      <span class="val">5x</span>
    </div>
  </div>

  <div class="section">
    <h3>GA Parameters</h3>
    <div class="row">
      <label>Population</label>
      <input type="number" id="pop-size" value="40" min="10" max="100" onchange="gaParams.popSize=+this.value">
    </div>
    <div class="row">
      <label>Mutation Rate</label>
      <input type="range" id="mut-rate" min="0" max="100" value="15" oninput="gaParams.mutRate=this.value/100;this.nextElementSibling.textContent=this.value+'%'">
      <span class="val">15%</span>
    </div>
    <div class="row">
      <label>Mutation Strength</label>
      <input type="range" id="mut-strength" min="1" max="50" value="10" oninput="gaParams.mutStrength=this.value/100;this.nextElementSibling.textContent=(this.value/100).toFixed(2)">
      <span class="val">0.10</span>
    </div>
    <div class="row">
      <label>Elitism Count</label>
      <input type="number" id="elite-count" value="3" min="0" max="10" onchange="gaParams.eliteCount=+this.value">
    </div>
    <div class="row">
      <label>Tournament Size</label>
      <input type="number" id="tournament-size" value="5" min="2" max="20" onchange="gaParams.tournamentSize=+this.value">
    </div>
    <div class="row">
      <label>Evaluation Time (s)</label>
      <input type="number" id="eval-time" value="8" min="2" max="30" onchange="gaParams.evalTime=+this.value">
    </div>
  </div>

  <div class="section">
    <h3>Statistics</h3>
    <div id="stats">
      <div class="stat-row"><span>Generation:</span><span class="stat-val" id="stat-gen">0</span></div>
      <div class="stat-row"><span>Best Fitness:</span><span class="stat-val" id="stat-best">—</span></div>
      <div class="stat-row"><span>Avg Fitness:</span><span class="stat-val" id="stat-avg">—</span></div>
      <div class="stat-row"><span>Best Distance:</span><span class="stat-val" id="stat-dist">—</span></div>
      <div class="stat-row"><span>Evaluating:</span><span class="stat-val" id="stat-eval">—</span></div>
    </div>
    <canvas id="fitness-graph"></canvas>
    <div class="legend">
      <span><div class="dot" style="background:#6ea8fe"></div> Best</span>
      <span><div class="dot" style="background:#f0a050"></div> Average</span>
    </div>
  </div>

  <div class="section">
    <h3>Best Genome</h3>
    <div id="genome-display">No genome yet</div>
  </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
// ===== GLOBALS =====
let engine, scene, camera;
let ground, bestCreatureNode;
let simSpeed = 5;
let gaParams = { popSize:40, mutRate:0.15, mutStrength:0.10, eliteCount:3, tournamentSize:5, evalTime:8 };
let population = [];
let generation = 0;
let bestEver = null;
let bestFitnessHistory = [];
let avgFitnessHistory = [];
let isRunning = false;
let evalIndex = 0;
let evalTime = 0;
let currentEvalCreature = null;
let animTime = 0;
let fitnessGraphCtx;

// ===== GENOME =====
// Genome encodes a Strandbeest-style leg mechanism:
// [crankLen, crankOffsetX, crankOffsetY, link1..link8, phaseOffset, crankSpeed, bodyHeight, legCount, footLen]
const GENE_NAMES = [
  'crankLen','crankOX','crankOY',
  'link1','link2','link3','link4','link5','link6','link7','link8',
  'phaseOff','crankSpeed','bodyH','legCount','footLen'
];
const GENE_RANGES = [
  [0.3, 1.5],   // crankLen
  [-0.5, 0.5],  // crankOX
  [0.5, 2.0],   // crankOY
  [0.5, 3.0],   // link1
  [0.5, 3.0],   // link2
  [0.5, 3.0],   // link3
  [0.5, 3.0],   // link4
  [0.5, 3.0],   // link5
  [0.5, 3.0],   // link6
  [0.5, 3.0],   // link7
  [0.5, 3.0],   // link8
  [0.0, 6.28],  // phaseOff
  [0.5, 4.0],   // crankSpeed
  [1.0, 4.0],   // bodyH
  [2, 6],       // legCount (integer)
  [0.3, 1.5],   // footLen
];

function randomGenome() {
  return GENE_RANGES.map(([lo,hi]) => lo + Math.random()*(hi-lo));
}

function clampGene(g, i) {
  const [lo,hi] = GENE_RANGES[i];
  return Math.max(lo, Math.min(hi, g));
}

function decodeGenome(genome) {
  return {
    crankLen: genome[0],
    crankOX: genome[1],
    crankOY: genome[2],
    links: genome.slice(3, 11),
    phaseOffset: genome[11],
    crankSpeed: genome[12],
    bodyHeight: genome[13],
    legCount: Math.round(genome[14]),
    footLen: genome[15],
  };
}

// ===== LINKAGE SOLVER =====
// Solve for intersection of two circles (for finding joint positions)
function circleIntersection(c1x, c1y, r1, c2x, c2y, r2, preferY) {
  const dx = c2x - c1x, dy = c2y - c1y;
  const d = Math.sqrt(dx*dx + dy*dy);
  if (d > r1 + r2 + 0.001 || d < Math.abs(r1-r2) - 0.001 || d < 0.0001) {
    return null; // no intersection
  }
  const a = (r1*r1 - r2*r2 + d*d) / (2*d);
  const hSq = r1*r1 - a*a;
  const h = hSq > 0 ? Math.sqrt(hSq) : 0;
  const mx = c1x + a*dx/d, my = c1y + a*dy/d;
  const rx = -dy/d * h, ry = dx/d * h;
  const p1 = {x: mx+rx, y: my+ry};
  const p2 = {x: mx-rx, y: my-ry};
  // Choose based on preferred Y (lower for walking mechanism)
  if (preferY !== undefined) {
    return (p1.y > p2.y) === preferY ? p1 : p2;
  }
  return p1.y > p2.y ? p1 : p2; // prefer lower point
}

// Compute leg joint positions for a given crank angle
// Uses a simplified Jansen-style linkage topology
function solveLeg(params, crankAngle, hipX, hipY) {
  const {crankLen, crankOX, crankOY, links, footLen} = params;

  // Crank center offset from hip
  const crankCX = hipX + crankOX;
  const crankCY = hipY + crankOY;

  // Crank endpoint (rotating)
  const crankX = crankCX + crankLen * Math.cos(crankAngle);
  const crankY = crankCY + crankLen * Math.sin(crankAngle);

  // Linkage topology (simplified Jansen-style):
  // Hip (fixed) -> link1 -> jointA
  // Crank (rotating) -> link2 -> jointA (jointA is intersection)
  const jointA = circleIntersection(hipX, hipY, links[0], crankX, crankY, links[1], true);
  if (!jointA) return null;

  // jointA -> link3 -> jointB
  // Hip -> link4 -> jointB
  const jointB = circleIntersection(jointA.x, jointA.y, links[2], hipX, hipY, links[3], true);
  if (!jointB) return null;

  // jointB -> link5 -> jointC
  // jointA -> link6 -> jointC
  const jointC = circleIntersection(jointB.x, jointB.y, links[4], jointA.x, jointA.y, links[5], true);
  if (!jointC) return null;

  // jointC -> link7 -> foot
  // Hip -> link8 -> foot (constrained)
  const foot = circleIntersection(jointC.x, jointC.y, links[6], hipX, hipY, links[7], true);
  if (!foot) return null;

  // Extend foot by footLen downward
  const footAngle = Math.atan2(foot.y - jointC.y, foot.x - jointC.x);
  const footEndX = foot.x + footLen * Math.cos(footAngle + Math.PI/2);
  const footEndY = foot.y + footLen * Math.sin(footAngle + Math.PI/2);

  return {
    joints: [
      {x: hipX, y: hipY},
      {x: crankX, y: crankY},
      jointA, jointB, jointC, foot,
      {x: footEndX, y: footEndY}
    ],
    foot: {x: footEndX, y: footEndY},
    footBase: foot
  };
}

// ===== CREATURE SIMULATION =====
function simulateCreature(genome, duration, dt) {
  const params = decodeGenome(genome);
  const legCount = Math.max(2, Math.min(6, params.legCount));
  const crankSpeed = params.crankSpeed;
  const bodyHeight = params.bodyHeight;

  // Simulate walking
  let bodyX = 0, bodyY = bodyHeight;
  let bodyVX = 0;
  let prevFootContacts = [];
  let totalDistance = 0;
  let stabilityScore = 0;
  let timeSteps = 0;
  let fellOver = false;
  let minBodyY = bodyHeight;
  let maxBodyY = bodyHeight;
  let bodyYVariation = 0;

  // Initialize leg phases
  const legPhases = [];
  for (let i = 0; i < legCount; i++) {
    legPhases.push((i / legCount) * Math.PI * 2 + params.phaseOffset * (i % 2));
  }

  for (let t = 0; t < duration; t += dt) {
    const crankAngle = crankSpeed * t;

    // Solve each leg
    const footPositions = [];
    const footVelocities = [];
    let groundContactCount = 0;
    let groundY = Infinity;

    for (let i = 0; i < legCount; i++) {
      const angle = crankAngle + legPhases[i];
      const leg = solveLeg(params, angle, bodyX, bodyY);
      if (!leg) { fellOver = true; break; }

      footPositions.push(leg.foot);

      // Check ground contact (foot near y=0)
      if (leg.foot.y <= 0.3) {
        groundContactCount++;
        groundY = Math.min(groundY, leg.foot.y);
      }

      // Compute foot velocity (numerical)
      const prevAngle = crankSpeed * (t - dt) + legPhases[i];
      const prevLeg = solveLeg(params, prevAngle, bodyX, bodyY);
      if (prevLeg) {
        footVelocities.push({
          x: (leg.foot.x - prevLeg.foot.x) / dt,
          y: (leg.foot.y - prevLeg.foot.y) / dt
        });
      } else {
        footVelocities.push({x:0, y:0});
      }
    }

    if (fellOver) break;

    // Body propulsion: feet on ground pushing backward propel body forward
    let propulsion = 0;
    for (let i = 0; i < footPositions.length; i++) {
      if (footPositions[i].y <= 0.3 && footVelocities[i]) {
        // Foot on ground moving backward relative to body = propulsion
        propulsion -= footVelocities[i].x * 0.3;
      }
    }

    // Update body position
    bodyVX += propulsion * dt * 2;
    bodyVX *= 0.98; // damping
    bodyX += bodyVX * dt;

    // Body height follows lowest supporting foot + bodyHeight offset
    if (groundContactCount > 0) {
      const targetY = Math.max(0.5, groundY + bodyHeight);
      bodyY += (targetY - bodyY) * 0.1;
    }

    // Stability metrics
    minBodyY = Math.min(minBodyY, bodyY);
    maxBodyY = Math.max(maxBodyY, bodyY);
    bodyYVariation += Math.abs(bodyY - bodyHeight) * dt;

    // Check if fell over (body too low or too tilted)
    if (bodyY < 0.3) { fellOver = true; break; }

    timeSteps++;
  }

  // Fitness calculation
  const distance = bodyX;
  const stability = timeSteps > 0 ? 1 / (1 + bodyYVariation / timeSteps) : 0;
  const uprightBonus = fellOver ? 0 : 1;
  const contactBonus = timeSteps > 0 ? groundContactCount / legCount : 0;

  let fitness = distance * 10;
  fitness += stability * 5;
  fitness += uprightBonus * 3;
  if (fellOver) fitness *= 0.1;
  fitness = Math.max(0, fitness);

  return {
    fitness,
    distance: bodyX,
    stability,
    fellOver,
    finalX: bodyX,
    finalY: bodyY,
    bodyYVariation,
    timeSteps
  };
}

// ===== GENETIC ALGORITHM =====
function tournamentSelect(pop, k) {
  let best = null;
  for (let i = 0; i < k; i++) {
    const idx = Math.floor(Math.random() * pop.length);
    if (!best || pop[idx].fitness > best.fitness) best = pop[idx];
  }
  return best;
}

function crossover(g1, g2) {
  const child = [];
  for (let i = 0; i < g1.length; i++) {
    if (Math.random() < 0.5) child.push(g1[i]);
    else child.push(g2[i]);
    // Blend crossover
    child[i] = child[i] + (Math.random() - 0.5) * Math.abs(g1[i] - g2[i]) * 0.2;
    child[i] = clampGene(child[i], i);
  }
  return child;
}

function mutate(genome, rate, strength) {
  const mutated = [...genome];
  for (let i = 0; i < mutated.length; i++) {
    if (Math.random() < rate) {
      const range = GENE_RANGES[i][1] - GENE_RANGES[i][0];
      mutated[i] += (Math.random() - 0.5) * 2 * strength * range;
      mutated[i] = clampGene(mutated[i], i);
    }
  }
  return mutated;
}

function initPopulation() {
  population = [];
  for (let i = 0; i < gaParams.popSize; i++) {
    const genome = randomGenome();
    population.push({ genome, fitness: 0, evaluated: false, result: null });
  }
  generation = 0;
  bestEver = null;
  bestFitnessHistory = [];
  avgFitnessHistory = [];
  evalIndex = 0;
  updateStats();
  drawFitnessGraph();
}

function evaluateNext() {
  if (evalIndex >= population.length) {
    // Generation complete
    finishGeneration();
    return;
  }

  const ind = population[evalIndex];
  if (!ind.evaluated) {
    const dt = 0.02;
    ind.result = simulateCreature(ind.genome, gaParams.evalTime, dt);
    ind.fitness = ind.result.fitness;
    ind.evaluated = true;

    if (!bestEver || ind.fitness > bestEver.fitness) {
      bestEver = { genome: [...ind.genome], fitness: ind.fitness, result: {...ind.result} };
    }
  }
  evalIndex++;
  updateStats();
}

function finishGeneration() {
  // Sort by fitness
  population.sort((a,b) => b.fitness - a.fitness);

  const bestFit = population[0].fitness;
  const avgFit = population.reduce((s,p) => s + p.fitness, 0) / population.length;
  bestFitnessHistory.push(bestFit);
  avgFitnessHistory.push(avgFit);

  // Create next generation
  const nextGen = [];

  // Elitism
  for (let i = 0; i < gaParams.eliteCount && i < population.length; i++) {
    nextGen.push({ genome: [...population[i].genome], fitness: 0, evaluated: false, result: null });
  }

  // Fill rest with offspring
  while (nextGen.length < gaParams.popSize) {
    const p1 = tournamentSelect(population, gaParams.tournamentSize);
    const p2 = tournamentSelect(population, gaParams.tournamentSize);
    let child = crossover(p1.genome, p2.genome);
    child = mutate(child, gaParams.mutRate, gaParams.mutStrength);
    nextGen.push({ genome: child, fitness: 0, evaluated: false, result: null });
  }

  population = nextGen;
  generation++;
  evalIndex = 0;

  updateStats();
  drawFitnessGraph();

  // Show best creature
  if (bestEver) {
    showBestCreature(bestEver.genome);
    document.getElementById('genome-display').textContent =
      bestEver.genome.map((g,i) => GENE_NAMES[i]+':'+g.toFixed(2)).join(' ');
  }
}

function stepGeneration() {
  // Evaluate entire generation
  while (evalIndex < population.length) {
    evaluateNext();
  }
}

function toggleEvolution() {
  isRunning = !isRunning;
  const btn = document.getElementById('btn-start');
  btn.textContent = isRunning ? '⏸ Pause' : '▶ Start';
  btn.classList.toggle('active', isRunning);
}

function resetEvolution() {
  isRunning = false;
  document.getElementById('btn-start').textContent = '▶ Start';
  document.getElementById('btn-start').classList.remove('active');
  initPopulation();
  clearBestCreature();
}

function replayBest() {
  if (!bestEver) return;
  showBestCreature(bestEver.genome);
}

function updateStats() {
  document.getElementById('stat-gen').textContent = generation;
  document.getElementById('stat-eval').textContent = evalIndex + '/' + population.length;

  const evaluated = population.filter(p => p.evaluated);
  if (evaluated.length > 0) {
    const best = evaluated.reduce((a,b) => a.fitness > b.fitness ? a : b);
    const avg = evaluated.reduce((s,p) => s + p.fitness, 0) / evaluated.length;
    document.getElementById('stat-best').textContent = best.fitness.toFixed(2);
    document.getElementById('stat-avg').textContent = avg.toFixed(2);
    document.getElementById('stat-dist').textContent = (best.result ? best.result.distance.toFixed(2) : '—') + 'm';
  }

  if (bestEver) {
    document.getElementById('stat-best').textContent = bestEver.fitness.toFixed(2) + ' ★';
    document.getElementById('stat-dist').textContent = bestEver.result.distance.toFixed(2) + 'm';
  }
}

// ===== FITNESS GRAPH =====
function drawFitnessGraph() {
  const canvas = document.getElementById('fitness-graph');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  const w = canvas.offsetWidth, h = canvas.offsetHeight;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.fillRect(0, 0, w, h);

  if (bestFitnessHistory.length < 2) return;

  const maxFit = Math.max(...bestFitnessHistory, 1);
  const pad = {l:5, r:5, t:5, b:5};
  const gw = w - pad.l - pad.r;
  const gh = h - pad.t - pad.b;

  function drawLine(data, color) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    data.forEach((v, i) => {
      const x = pad.l + (i / (data.length - 1)) * gw;
      const y = pad.t + gh - (v / maxFit) * gh;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  drawLine(avgFitnessHistory, '#f0a050');
  drawLine(bestFitnessHistory, '#6ea8fe');
}

// ===== BABYLON.JS SETUP =====
function initBabylon() {
  const canvas = document.getElementById('renderCanvas');
  engine = new BABYLON.Engine(canvas, true, {stencil: true});

  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.1, 1);
  scene.ambientColor = new BABYLON.Color3(0.2, 0.2, 0.3);

  // Camera
  camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/3, Math.PI/4, 20, new BABYLON.Vector3(0, 2, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 5;
  camera.upperRadiusLimit = 60;
  camera.wheelPrecision = 20;

  // Lights
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.6;
  hemi.groundColor = new BABYLON.Color3(0.1, 0.1, 0.15);

  const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, 1), scene);
  dir.intensity = 0.8;
  dir.position = new BABYLON.Vector3(10, 20, -10);

  // Shadows
  const shadowGen = new BABYLON.ShadowGenerator(1024, dir);
  shadowGen.useBlurExponentialShadowMap = true;
  shadowGen.blurKernel = 16;

  // Ground
  ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 100, height: 40, subdivisions: 20}, scene);
  const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
  groundMat.diffuseColor = new BABYLON.Color3(0.15, 0.12, 0.1);
  groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
  ground.material = groundMat;
  ground.receiveShadows = true;

  // Grid lines on ground
  const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
  gridMat.diffuseColor = new BABYLON.Color3(0.25, 0.2, 0.15);
  gridMat.emissiveColor = new BABYLON.Color3(0.05, 0.04, 0.03);
  gridMat.alpha = 0.5;

  for (let x = -50; x <= 50; x += 2) {
    const line = BABYLON.MeshBuilder.CreateBox("gridX"+x, {width: 0.02, height: 0.01, depth: 40}, scene);
    line.position.x = x;
    line.position.y = 0.005;
    line.material = gridMat;
  }
  for (let z = -20; z <= 20; z += 2) {
    const line = BABYLON.MeshBuilder.CreateBox("gridZ"+z, {width: 100, height: 0.01, depth: 0.02}, scene);
    line.position.z = z;
    line.position.y = 0.005;
    line.material = gridMat;
  }

  // Distance markers
  const markerMat = new BABYLON.StandardMaterial("markerMat", scene);
  markerMat.diffuseColor = new BABYLON.Color3(0.4, 0.3, 0.2);
  markerMat.emissiveColor = new BABYLON.Color3(0.1, 0.08, 0.05);
  for (let x = 0; x <= 50; x += 5) {
    const marker = BABYLON.MeshBuilder.CreateBox("marker"+x, {width: 0.05, height: 0.3, depth: 0.5}, scene);
    marker.position.x = x;
    marker.position.y = 0.15;
    marker.material = markerMat;
  }

  engine.runRenderLoop(renderLoop);
  window.addEventListener('resize', () => engine.resize());

  initPopulation();
}

// ===== CREATURE VISUALIZATION =====
let creatureMeshes = [];
let creatureAnimData = null;

function clearBestCreature() {
  creatureMeshes.forEach(m => m.dispose());
  creatureMeshes = [];
  creatureAnimData = null;
}

function showBestCreature(genome) {
  clearBestCreature();

  const params = decodeGenome(genome);
  const legCount = Math.max(2, Math.min(6, params.legCount));

  // Materials
  const bodyMat = new BABYLON.StandardMaterial("bodyMat", scene);
  bodyMat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.8);
  bodyMat.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.15);
  bodyMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);

  const legMat = new BABYLON.StandardMaterial("legMat", scene);
  legMat.diffuseColor = new BABYLON.Color3(0.8, 0.5, 0.2);
  legMat.emissiveColor = new BABYLON.Color3(0.1, 0.05, 0.02);

  const jointMat = new BABYLON.StandardMaterial("jointMat", scene);
  jointMat.diffuseColor = new BABYLON.Color3(0.9, 0.3, 0.2);
  jointMat.emissiveColor = new BABYLON.Color3(0.15, 0.05, 0.02);

  const footMat = new BABYLON.StandardMaterial("footMat", scene);
  footMat.diffuseColor = new BABYLON.Color3(0.3, 0.8, 0.3);
  footMat.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.05);

  // Body
  const bodyLen = legCount * 1.2;
  const body = BABYLON.MeshBuilder.CreateBox("creatureBody", {width: bodyLen, height: 0.4, depth: 0.8}, scene);
  body.material = bodyMat;
  body.position.y = params.bodyHeight;
  creatureMeshes.push(body);

  // Create leg meshes (lines for links, spheres for joints)
  const legMeshes = [];
  for (let i = 0; i < legCount; i++) {
    const legGroup = { lines: [], joints: [], footMesh: null, hipX: 0, hipY: params.bodyHeight };
    legGroup.hipX = (i - (legCount-1)/2) * 1.2;

    // Create line meshes for each link
    for (let j = 0; j < 8; j++) {
      const line = BABYLON.MeshBuilder.CreateBox("leg"+i+"_link"+j, {width: 0.06, height: 0.06, depth: 0.06}, scene);
      line.material = legMat;
      legGroup.lines.push(line);
      creatureMeshes.push(line);
    }

    // Joint spheres
    for (let j = 0; j < 7; j++) {
      const sphere = BABYLON.MeshBuilder.CreateSphere("leg"+i+"_joint"+j, {diameter: 0.15}, scene);
      sphere.material = jointMat;
      legGroup.joints.push(sphere);
      creatureMeshes.push(sphere);
    }

    // Foot
    const footMesh = BABYLON.MeshBuilder.CreateBox("leg"+i+"_foot", {width: 0.2, height: 0.1, depth: 0.3}, scene);
    footMesh.material = footMat;
    legGroup.footMesh = footMesh;
    creatureMeshes.push(footMesh);

    legMeshes.push(legGroup);
  }

  creatureAnimData = {
    genome,
    params,
    legCount,
    legMeshes,
    body,
    bodyX: 0,
    bodyY: params.bodyHeight,
    bodyVX: 0,
    time: 0,
    legPhases: [],
    prevBodyX: 0
  };

  for (let i = 0; i < legCount; i++) {
    creatureAnimData.legPhases.push((i / legCount) * Math.PI * 2 + params.phaseOffset * (i % 2));
  }

  // Reset camera to follow creature
  camera.target = new BABYLON.Vector3(0, params.bodyHeight, 0);
  camera.radius = 15;
}

function updateCreatureAnimation(dt) {
  if (!creatureAnimData) return;

  const {params, legCount, legMeshes, body} = creatureAnimData;
  const crankSpeed = params.crankSpeed;
  const simDt = dt * simSpeed;
  creatureAnimData.time += simDt;

  const t = creatureAnimData.time;
  const crankAngle = crankSpeed * t;

  // Simulate body movement
  let propulsion = 0;
  let groundContactCount = 0;
  let groundY = Infinity;

  const footPositions = [];
  for (let i = 0; i < legCount; i++) {
    const angle = crankAngle + creatureAnimData.legPhases[i];
    const leg = solveLeg(params, angle, creatureAnimData.bodyX, creatureAnimData.bodyY);
    if (!leg) continue;

    footPositions.push(leg);

    if (leg.foot.y <= 0.3) {
      groundContactCount++;
      groundY = Math.min(groundY, leg.foot.y);
    }

    // Foot velocity for propulsion
    const prevAngle = crankSpeed * (t - 0.02) + creatureAnimData.legPhases[i];
    const prevLeg = solveLeg(params, prevAngle, creatureAnimData.bodyX, creatureAnimData.bodyY);
    if (prevLeg && leg.foot.y <= 0.3) {
      const footVX = (leg.foot.x - prevLeg.foot.x) / 0.02;
      propulsion -= footVX * 0.3;
    }
  }

  creatureAnimData.bodyVX += propulsion * simDt * 2;
  creatureAnimData.bodyVX *= 0.98;
  creatureAnimData.bodyX += creatureAnimData.bodyVX * simDt;

  if (groundContactCount > 0) {
    const targetY = Math.max(0.5, groundY + params.bodyHeight);
    creatureAnimData.bodyY += (targetY - creatureAnimData.bodyY) * 0.1;
  }

  // Update body mesh
  body.position.x = creatureAnimData.bodyX;
  body.position.y = creatureAnimData.bodyY;

  // Update leg meshes
  for (let i = 0; i < legCount; i++) {
    const angle = crankAngle + creatureAnimData.legPhases[i];
    const leg = solveLeg(params, angle, creatureAnimData.bodyX, creatureAnimData.bodyY);
    const lm = legMeshes[i];

    if (leg) {
      const joints = leg.joints;

      // Update joint positions
      for (let j = 0; j < Math.min(joints.length, lm.joints.length); j++) {
        lm.joints[j].position.x = joints[j].x;
        lm.joints[j].position.y = -joints[j].y; // Babylon Y is up, our Y is down-negative
        lm.joints[j].position.z = (i - (legCount-1)/2) * 1.2;
      }

      // Update link positions (midpoint between joints)
      for (let j = 0; j < lm.lines.length && j+1 < joints.length; j++) {
        const j1 = joints[j], j2 = joints[j+1];
        lm.lines[j].position.x = (j1.x + j2.x) / 2;
        lm.lines[j].position.y = -(j1.y + j2.y) / 2;
        lm.lines[j].position.z = (i - (legCount-1)/2) * 1.2;

        // Orient link along joint direction
        const dx = j2.x - j1.x, dy = -(j2.y - j1.y);
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len > 0.01) {
          lm.lines[j].scaling.x = len;
          lm.lines[j].rotation.z = Math.atan2(dy, dx);
        }
      }

      // Foot
      if (leg.foot) {
        lm.footMesh.position.x = leg.foot.x;
        lm.footMesh.position.y = -leg.foot.y;
        lm.footMesh.position.z = (i - (legCount-1)/2) * 1.2;
      }
    }
  }

  // Camera follow
  const targetPos = new BABYLON.Vector3(creatureAnimData.bodyX, creatureAnimData.bodyY, 0);
  camera.target = BABYLON.Vector3.Lerp(camera.target, targetPos, 0.02);
}

// ===== RENDER LOOP =====
let lastTime = 0;
let evalAccumulator = 0;

function renderLoop() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // GA evaluation
  if (isRunning) {
    evalAccumulator += dt * simSpeed;
    while (evalAccumulator >= 0.05) {
      evalAccumulator -= 0.05;
      evaluateNext();
    }
  }

  // Animate best creature
  updateCreatureAnimation(dt);

  scene.render();
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', initBabylon);
if (document.readyState !== 'loading') initBabylon();
</script>
