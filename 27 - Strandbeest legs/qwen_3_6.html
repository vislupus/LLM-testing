<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strandbeest GA - Evolving Walking Mechanisms</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050810; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #e0e8f0; }
    #renderCanvas { width: 100vw; height: 100vh; outline: none; }
    
    #ui {
      position: absolute; top: 15px; left: 15px;
      background: rgba(12, 16, 28, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 160, 255, 0.15);
      border-radius: 12px; padding: 16px; width: 300px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      max-height: calc(100vh - 30px); overflow-y: auto;
    }
    #ui::-webkit-scrollbar { width: 5px; }
    #ui::-webkit-scrollbar-track { background: transparent; }
    #ui::-webkit-scrollbar-thumb { background: rgba(100,150,255,0.3); border-radius: 3px; }
    
    h2 { font-size: 16px; color: #7dd3fc; margin-bottom: 10px; letter-spacing: 0.5px; }
    h3 { font-size: 12px; color: #8899bb; margin: 12px 0 6px 0; text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 6px; }
    
    .ctrl { margin-bottom: 8px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; color: #a0b0c5; }
    .ctrl input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: rgba(100,150,255,0.2); border-radius: 2px; outline: none; cursor: pointer; }
    .ctrl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #7dd3fc; border-radius: 50%; cursor: pointer; }
    .ctrl input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; background: #7dd3fc; border-radius: 50%; cursor: pointer; border: none; }
    
    .btn-row { display: flex; gap: 6px; margin: 8px 0; }
    button { flex: 1; padding: 7px 10px; background: rgba(30, 40, 60, 0.7); border: 1px solid rgba(100,150,255,0.2); border-radius: 6px; color: #c0d0f0; font-size: 12px; cursor: pointer; transition: all 0.15s; }
    button:hover { background: rgba(50, 65, 90, 0.9); border-color: #7dd3fc; color: #fff; }
    button.active { background: rgba(125, 211, 252, 0.25); border-color: #7dd3fc; color: #fff; }
    
    .stat-row { display: flex; justify-content: space-between; font-size: 11px; margin: 3px 0; color: #8899bb; }
    .stat-row span { color: #ccd6f6; font-weight: bold; }
    
    .legend { margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 6px; font-size: 10px; color: #667799; line-height: 1.4; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  
  <div id="ui">
    <h2>🦿 Strandbeest Evolution</h2>
    <div class="legend">Genetic Algorithm evolving walking mechanisms via forward kinematics & kinematic constraints</div>
    
    <div class="btn-row">
      <button id="btn-start" onclick="toggleEvol()">▶ Start Evolution</button>
      <button id="btn-best" onclick="showBest()">🏆 Show Best</button>
      <button onclick="resetGA()">🔄 Reset</button>
    </div>

    <div class="ctrl">
      <label><span>Population Size</span><span id="v-pop">20</span></label>
      <input type="range" id="s-pop" min="5" max="50" step="5" value="20">
    </div>
    <div class="ctrl">
      <label><span>Mutation Rate</span><span id="v-mut">0.15</span></label>
      <input type="range" id="s-mut" min="0.01" max="0.5" step="0.01" value="0.15">
    </div>
    <div class="ctrl">
      <label><span>Cycle Duration</span><span id="v-cycle">3.0</span>s</label>
      <input type="range" id="s-cycle" min="1" max="6" step="0.5" value="3.0">
    </div>
    <div class="ctrl">
      <label><span>Simulation Speed</span><span id="v-sim">2.0</span>x</label>
      <input type="range" id="s-sim" min="0.5" max="5" step="0.5" value="2.0">
    </div>
    <div class="ctrl">
      <label><span>Legs Count</span><span id="v-legs">2</span></label>
      <input type="range" id="s-legs" min="2" max="6" step="2" value="2">
    </div>

    <h3>Evolution Stats</h3>
    <div class="stat-row">Generation: <span id="st-gen">0</span></div>
    <div class="stat-row">Best Fitness: <span id="st-fit">0.0</span></div>
    <div class="stat-row">Distance: <span id="st-dist">0.0</span>m</div>
    <div class="stat-row">Stability: <span id="st-stab">0.0</span></div>
    <div class="stat-row">Sim Time: <span id="st-time">0.0</span>s</div>
  </div>

  <script>
    // ===== BABYLON.JS SETUP =====
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.05, 0.06, 0.12, 1);
    scene.ambientColor = new BABYLON.Color3(0.15, 0.18, 0.22);

    const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/3, Math.PI/2.8, 25, new BABYLON.Vector3(0, 2, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 5;
    camera.upperRadiusLimit = 60;
    camera.lowerBetaLimit = 0.2;
    camera.upperBetaLimit = Math.PI/2.1;

    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.6;
    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1.5), scene);
    sun.position = new BABYLON.Vector3(20, 40, 25);
    sun.intensity = 0.8;
    const shadowGen = new BABYLON.ShadowGenerator(1024, sun);
    shadowGen.useBlurExponentialShadowMap = true;

    // Ground
    const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 80, height: 80}, scene);
    const gMat = new BABYLON.StandardMaterial("gMat", scene);
    gMat.diffuseColor = new BABYLON.Color3(0.15, 0.18, 0.12);
    gMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
    ground.material = gMat;
    ground.receiveShadows = true;

    // Grid
    const gridMat = new BABYLON.StandardMaterial("grid", scene);
    gridMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
    gridMat.emissiveColor = new BABYLON.Color3(0.05, 0.05, 0.05);
    for (let i = -40; i <= 40; i += 2) {
      const line = BABYLON.MeshBuilder.CreateBox("l" + i, {width: 0.05, height: 0.01, depth: 80}, scene);
      line.position.set(i, 0.01, 0); line.material = gridMat;
    }

    // Materials
    const bodyMat = new BABYLON.StandardMaterial("body", scene);
    bodyMat.diffuseColor = new BABYLON.Color3(0.6, 0.4, 0.2);
    const legMat = new BABYLON.StandardMaterial("leg", scene);
    legMat.diffuseColor = new BABYLON.Color3(0.3, 0.5, 0.8);
    const jointMat = new BABYLON.StandardMaterial("joint", scene);
    jointMat.diffuseColor = new BABYLON.Color3(0.9, 0.8, 0.4);
    const bestMat = new BABYLON.StandardMaterial("best", scene);
    bestMat.diffuseColor = new BABYLON.Color3(1.0, 0.6, 0.2);
    bestMat.emissiveColor = new BABYLON.Color3(0.15, 0.08, 0);

    // ===== GENOME STRUCTURE =====
    // Each leg: {seg1, seg2, seg3, phase, footPhase, amplitude, yOffset}
    // Body: {width, height, yPos}
    function createRandomGenome(numLegs = 2) {
      return {
        legs: Array.from({length: numLegs}, () => ({
          seg1: 1.2 + Math.random() * 1.2,
          seg2: 1.5 + Math.random() * 1.0,
          seg3: 0.8 + Math.random() * 0.8,
          pivotX: (Math.random() - 0.5) * 1.5,
          pivotY: 2.5 + Math.random() * 1.0,
          phase: Math.random() * Math.PI * 2,
          amplitude: 0.4 + Math.random() * 0.4
        })),
        body: {
          width: 2.0 + Math.random() * 2.0,
          height: 0.6 + Math.random() * 0.4,
          yPos: 3.0 + Math.random() * 0.5
        },
        crankSpeed: 0.8 + Math.random() * 0.8
      };
    }

    function crossover(g1, g2, numLegs) {
      const child = { legs: [], body: {}, crankSpeed: 0 };
      for (let i = 0; i < numLegs; i++) {
        const p1 = i < g1.legs.length ? g1.legs[i] : g1.legs[0];
        const p2 = i < g2.legs.length ? g2.legs[i] : g2.legs[0];
        child.legs.push({
          seg1: Math.random() < 0.5 ? p1.seg1 : p2.seg1,
          seg2: Math.random() < 0.5 ? p1.seg2 : p2.seg2,
          seg3: Math.random() < 0.5 ? p1.seg3 : p2.seg3,
          pivotX: Math.random() < 0.5 ? p1.pivotX : p2.pivotX,
          pivotY: Math.random() < 0.5 ? p1.pivotY : p2.pivotY,
          phase: Math.random() < 0.5 ? p1.phase : p2.phase,
          amplitude: Math.random() < 0.5 ? p1.amplitude : p2.amplitude
        });
      }
      child.body = {
        width: Math.random() < 0.5 ? g1.body.width : g2.body.width,
        height: Math.random() < 0.5 ? g1.body.height : g2.body.height,
        yPos: Math.random() < 0.5 ? g1.body.yPos : g2.body.yPos
      };
      child.crankSpeed = Math.random() < 0.5 ? g1.crankSpeed : g2.crankSpeed;
      return child;
    }

    function mutate(genome, rate, numLegs) {
      const m = (v, range) => Math.random() < rate ? v + (Math.random() - 0.5) * range : v;
      genome.legs.forEach(leg => {
        leg.seg1 = m(leg.seg1, 0.5); leg.seg2 = m(leg.seg2, 0.5); leg.seg3 = m(leg.seg3, 0.3);
        leg.pivotX = m(leg.pivotX, 0.8); leg.pivotY = m(leg.pivotY, 0.6);
        leg.phase = m(leg.phase, 0.8); leg.amplitude = m(leg.amplitude, 0.2);
      });
      genome.body.width = m(genome.body.width, 0.8);
      genome.body.height = m(genome.body.height, 0.3);
      genome.body.yPos = m(genome.body.yPos, 0.5);
      genome.crankSpeed = m(genome.crankSpeed, 0.3);
      
      // Clamp values
      genome.legs.forEach(leg => {
        leg.seg1 = Math.max(0.5, Math.min(3.0, leg.seg1));
        leg.seg2 = Math.max(0.8, Math.min(3.0, leg.seg2));
        leg.seg3 = Math.max(0.3, Math.min(2.0, leg.seg3));
        leg.amplitude = Math.max(0.1, Math.min(1.0, leg.amplitude));
      });
      genome.body.width = Math.max(1.0, Math.min(5.0, genome.body.width));
      genome.body.yPos = Math.max(2.0, Math.min(5.0, genome.body.yPos));
      genome.crankSpeed = Math.max(0.3, Math.min(2.0, genome.crankSpeed));
      return genome;
    }

    // ===== FORWARD KINEMATICS =====
    function computeLegIK(leg, t, baseX, baseY) {
      // Simple crank-driven leg mechanism
      const theta = t * leg.crankSpeed + leg.phase;
      const crankX = baseX + leg.pivotX + Math.cos(theta) * leg.amplitude;
      const crankY = baseY + leg.pivotY + Math.sin(theta) * leg.amplitude;
      
      // Two-segment arm from crank to foot
      // Use law of cosines to find joint angle
      const footX = crankX; // Foot tries to stay vertical
      const footY = 0; // Ground level
      
      const dx = footX - crankX;
      const dy = footY - crankY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Check reachability
      const maxReach = leg.seg2 + leg.seg3;
      if (dist > maxReach) {
        // Extend fully
        const ang = Math.atan2(dy, dx);
        const kneeX = crankX + Math.cos(ang) * leg.seg2;
        const kneeY = crankY + Math.sin(ang) * leg.seg2;
        return { crankX, crankY, kneeX, kneeY, footX: crankX + Math.cos(ang) * maxReach, footY: crankY + Math.sin(ang) * maxReach, grounded: false };
      }
      
      // Two-bone IK
      const a = leg.seg2, b = leg.seg3, c = dist;
      const cosAngle = (a*a + c*c - b*b) / (2*a*c);
      const angle = Math.acos(Math.max(-1, Math.min(1, cosAngle)));
      const baseAngle = Math.atan2(dy, dx);
      
      const kneeX = crankX + Math.cos(baseAngle + angle) * a;
      const kneeY = crankY + Math.sin(baseAngle + angle) * a;
      
      // Foot should be at ground level or slightly above
      const footOnGround = Math.min(footY, 0);
      return { crankX, crankY, kneeX, kneeY, footX, footY: footOnGround, grounded: dist < maxReach * 0.95 };
    }

    function simulateGenome(genome, cycleTime, dt) {
      let x = 0, y = 0, vx = 0, vy = 0;
      let t = 0;
      let stability = 0;
      let bodyHeight = genome.body.yPos;
      let groundedLegs = 0;
      let totalSteps = 0;
      
      while (t < cycleTime) {
        let forcesX = 0, forcesY = 0;
        groundedLegs = 0;
        
        for (let leg of genome.legs) {
          const res = computeLegIK(leg, t, x, bodyHeight);
          
          if (res.footY >= -0.05 && res.grounded) {
            // Foot on ground - generate reaction force
            groundedLegs++;
            const footVelX = res.footX - (x + leg.pivotX);
            const pushX = -footVelX * 0.3;
            forcesX += pushX;
            forcesY += 0.15; // Support force
          }
        }
        
        // Apply forces
        const mass = 2.0;
        vx += (forcesX / mass) * dt;
        vy += (forcesY / mass - 9.8) * dt; // Gravity
        vx *= 0.98; // Friction
        
        x += vx * dt;
        bodyHeight += vy * dt;
        bodyHeight = Math.max(1.5, bodyHeight); // Floor constraint
        bodyHeight += (genome.body.yPos - bodyHeight) * 0.1 * dt; // Spring back to nominal height
        
        if (groundedLegs === 0) stability -= 10;
        else stability += groundedLegs * 2;
        
        totalSteps++;
        t += dt;
      }
      
      const avgStability = stability / (totalSteps || 1);
      const fitness = Math.max(0, x) * 10 + Math.min(20, avgStability) - Math.abs(vx) * 2;
      return { distance: x, stability: avgStability, fitness, vx, bodyHeight };
    }

    // ===== VISUALIZATION =====
    let activeMeshes = [];
    let bestGenome = null;
    let bestFitness = -Infinity;
    let generation = 0;
    let population = [];
    let isEvolving = false;
    let showingBest = false;
    let simTimer = 0;
    let currentEvalIdx = 0;
    let simResults = [];

    function clearScene() {
      activeMeshes.forEach(m => m.dispose());
      activeMeshes = [];
    }

    function drawCreature(genome, x, y, z, material, highlight = false) {
      clearScene();
      const group = new BABYLON.TransformNode("creature", scene);
      activeMeshes.push(group);
      
      // Body
      const bodyW = genome.body.width;
      const bodyH = genome.body.height;
      const bodyY = y + genome.body.yPos;
      
      const body = BABYLON.MeshBuilder.CreateBox("body", {width: bodyW, height: bodyH, depth: 1.2}, scene);
      body.position.set(x, bodyY, z);
      body.material = material;
      body.parent = group;
      shadowGen.addShadowCaster(body);
      activeMeshes.push(body);
      
      // Legs
      genome.legs.forEach((leg, i) => {
        const legZ = z + (i - (genome.legs.length-1)/2) * 0.6;
        const pivotX = x + leg.pivotX;
        const pivotY = y + leg.pivotY;
        
        // Draw leg at current time state (for visualization)
        const t = simTimer % 4;
        const ik = computeLegIK(leg, t, x, y + genome.body.yPos);
        
        // Upper segment (crank to knee)
        const seg1 = BABYLON.MeshBuilder.CreateCylinder("seg1", {height: 0.12, diameterBottom: 0.12, diameterTop: 0.12}, scene);
        seg1.position.set((pivotX + ik.kneeX)/2, (pivotY + ik.kneeY)/2, legZ);
        seg1.lookAt(new BABYLON.Vector3(ik.kneeX, ik.kneeY, legZ), 0);
        seg1.material = material;
        seg1.parent = group;
        activeMeshes.push(seg1);
        
        // Lower segment (knee to foot)
        const seg2 = BABYLON.MeshBuilder.CreateCylinder("seg2", {height: 0.09, diameterBottom: 0.09, diameterTop: 0.09}, scene);
        seg2.position.set((ik.kneeX + ik.footX)/2, (ik.kneeY + ik.footY)/2, legZ);
        seg2.lookAt(new BABYLON.Vector3(ik.footX, ik.footY, legZ), 0);
        seg2.material = material;
        seg2.parent = group;
        activeMeshes.push(seg2);
        
        // Joint spheres
        [ [pivotX, pivotY], [ik.kneeX, ik.kneeY], [ik.footX, ik.footY] ].forEach((pos, j) => {
          const joint = BABYLON.MeshBuilder.CreateSphere("j" + i + j, {diameter: 0.18}, scene);
          joint.position.set(pos[0], pos[1], legZ);
          joint.material = jointMat;
          joint.parent = group;
          activeMeshes.push(joint);
        });
      });
      
      // Crank visual
      const crank = BABYLON.MeshBuilder.CreateCylinder("crank", {height: bodyW + 0.5, diameter: 0.15}, scene);
      crank.position.set(x, y + genome.body.yPos - 0.3, z);
      crank.rotation.z = Math.PI/2;
      crank.material = material;
      crank.parent = group;
      activeMeshes.push(crank);
    }

    // ===== GENETIC ALGORITHM =====
    const cfg = { popSize: 20, mutRate: 0.15, cycleTime: 3.0, simSpeed: 2.0, numLegs: 2 };

    function initGA() {
      population = [];
      for (let i = 0; i < cfg.popSize; i++) {
        population.push(createRandomGenome(cfg.numLegs));
      }
      generation = 0;
      bestFitness = -Infinity;
      currentEvalIdx = 0;
      simResults = [];
      updateUI();
    }

    function evaluateNext() {
      if (currentEvalIdx >= population.length) {
        // Generation complete - select, breed, mutate
        population.sort((a, b) => b.fitness - a.fitness);
        
        // Keep elite
        const elite = population.slice(0, Math.max(2, Math.floor(cfg.popSize * 0.15)));
        
        // Create new generation
        const newPop = [...elite];
        while (newPop.length < cfg.popSize) {
          const p1 = elite[Math.floor(Math.random() * elite.length)];
          const p2 = elite[Math.floor(Math.random() * elite.length)];
          let child = crossover(p1, p2, cfg.numLegs);
          child = mutate(child, cfg.mutRate, cfg.numLegs);
          newPop.push(child);
        }
        
        population = newPop;
        generation++;
        currentEvalIdx = 0;
        simResults = [];
        
        if (population[0].fitness > bestFitness) {
          bestFitness = population[0].fitness;
          bestGenome = JSON.parse(JSON.stringify(population[0]));
        }
        updateUI();
      }
      
      // Evaluate current individual
      const genome = population[currentEvalIdx];
      const result = simulateGenome(genome, cfg.cycleTime, 0.05);
      genome.fitness = result.fitness;
      genome.distance = result.distance;
      genome.stability = result.stability;
      
      simResults.push(result);
      currentEvalIdx++;
      
      // Show current individual
      if (!showingBest) {
        drawCreature(genome, 0, 0, 0, legMat);
      }
    }

    function showBest() {
      showingBest = !showingBest;
      document.getElementById('btn-best').classList.toggle('active', showingBest);
      if (showingBest && bestGenome) {
        drawCreature(bestGenome, 0, 0, 0, bestMat, true);
      }
    }

    function updateUI() {
      document.getElementById('st-gen').textContent = generation;
      document.getElementById('st-fit').textContent = bestFitness > -Infinity ? bestFitness.toFixed(1) : "--";
      document.getElementById('st-time').textContent = simTimer.toFixed(1);
      
      if (simResults.length > 0 && currentEvalIdx > 0) {
        const last = simResults[simResults.length - 1];
        document.getElementById('st-dist').textContent = last.distance.toFixed(2);
        document.getElementById('st-stab').textContent = last.stability.toFixed(1);
      }
    }

    function toggleEvol() {
      isEvolving = !isEvolving;
      document.getElementById('btn-start').textContent = isEvolving ? "⏸ Pause" : "▶ Start Evolution";
      document.getElementById('btn-start').classList.toggle('active', isEvolving);
    }

    function resetGA() {
      isEvolving = false;
      showingBest = false;
      document.getElementById('btn-start').textContent = "▶ Start Evolution";
      document.getElementById('btn-start').classList.remove('active');
      document.getElementById('btn-best').classList.remove('active');
      initGA();
      drawCreature(population[0], 0, 0, 0, legMat);
    }

    // ===== UI BINDINGS =====
    function bindSlider(id, valId, onChange) {
      const el = document.getElementById(id);
      const vEl = document.getElementById(valId);
      el.addEventListener('input', () => {
        const v = parseFloat(el.value);
        vEl.textContent = v.toFixed(el.step.includes('.') ? el.step.split('.')[1].length : 0);
        onChange(v);
      });
    }
    bindSlider('s-pop', 'v-pop', v => { cfg.popSize = v; resetGA(); });
    bindSlider('s-mut', 'v-mut', v => cfg.mutRate = v);
    bindSlider('s-cycle', 'v-cycle', v => cfg.cycleTime = v);
    bindSlider('s-sim', 'v-sim', v => cfg.simSpeed = v);
    bindSlider('s-legs', 'v-legs', v => { cfg.numLegs = v; resetGA(); });

    // ===== MAIN LOOP =====
    initGA();
    drawCreature(population[0], 0, 0, 0, legMat);

    engine.runRenderLoop(() => {
      if (isEvolving) {
        const steps = Math.floor(cfg.simSpeed);
        for (let i = 0; i < steps; i++) {
          evaluateNext();
          simTimer += cfg.cycleTime * 0.05;
        }
      }
      scene.render();
    });

    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
