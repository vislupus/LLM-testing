<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js Genetic Algorithm - Walking Creatures</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #333;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 280px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-height: calc(100% - 40px);
            overflow-y: auto;
        }
        .ui-section {
            margin-bottom: 15px;
            border-bottom: 1px solid #555;
            padding-bottom: 15px;
        }
        .ui-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        h3, h4 {
            margin: 0 0 10px 0;
            color: #4caf50;
        }
        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="range"] {
            width: 50%;
        }
        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }
        button.pause { background-color: #f44336; }
        button:hover { opacity: 0.9; }
        .stats-item { font-size: 14px; }
        .stats-val { float: right; font-weight: bold; color: #ffeb3b; }
    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.loaders.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui-container">
        <h3>GA Walker Evolution</h3>
        <div class="ui-section">
            <button id="start-pause-btn">Start Evolution</button>
            <button id="reset-btn">Reset Simulation</button>
        </div>
        <div class="ui-section">
            <h4>Statistics</h4>
            <div class="stats-item">Generation: <span id="gen-stat" class="stats-val">0</span></div>
            <div class="stats-item">Best Fitness: <span id="fit-stat" class="stats-val">0</span></div>
            <div class="stats-item">Avg Fitness: <span id="avg-fit-stat" class="stats-val">0</span></div>
        </div>
        <div class="ui-section">
            <h4>GA Parameters</h4>
            <label>Population Size: <span id="pop-size-label">100</span><input type="range" id="pop-size-slider" min="20" max="200" value="100" step="10"></label>
            <label>Mutation Rate: <span id="mut-rate-label">0.05</span><input type="range" id="mut-rate-slider" min="0.01" max="0.2" value="0.05" step="0.005"></label>
            <label>Elitism: <span id="elitism-label">2</span><input type="range" id="elitism-slider" min="1" max="10" value="2" step="1"></label>
        </div>
        <div class="ui-section">
            <h4>Simulation</h4>
            <label>Cycle Duration (s): <span id="cycle-dur-label">2</span><input type="range" id="cycle-dur-slider" min="0.5" max="5" value="2" step="0.1"></label>
        </div>
    </div>

    <script>
    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);

        // --- Global State ---
        let scene, ga, currentCreature, cycleDuration;
        let isRunning = false;
        let animationTime = 0;

        // --- UI Elements ---
        const startPauseBtn = document.getElementById('start-pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const uiElements = {
            popSize: { slider: document.getElementById('pop-size-slider'), label: document.getElementById('pop-size-label') },
            mutRate: { slider: document.getElementById('mut-rate-slider'), label: document.getElementById('mut-rate-label') },
            elitism: { slider: document.getElementById('elitism-slider'), label: document.getElementById('elitism-label') },
            cycleDur: { slider: document.getElementById('cycle-dur-slider'), label: document.getElementById('cycle-dur-label') },
            genStat: document.getElementById('gen-stat'),
            fitStat: document.getElementById('fit-stat'),
            avgFitStat: document.getElementById('avg-fit-stat'),
        };

        // ==========================================================
        //  GENETIC ALGORITHM CLASS
        // ==========================================================
        class GeneticAlgorithm {
            constructor(options) {
                this.options = options; // { populationSize, mutationRate, elitism, genomeSize }
                this.population = [];
            }

            initializePopulation() {
                this.population = [];
                for (let i = 0; i < this.options.populationSize; i++) {
                    const genome = Array.from({ length: this.options.genomeSize }, () => Math.random());
                    this.population.push({ genome, fitness: 0 });
                }
            }

            evaluateFitness(simulationSteps) {
                this.population.forEach(individual => {
                    individual.fitness = Creature.calculateFitness(individual.genome, simulationSteps);
                });
                this.population.sort((a, b) => b.fitness - a.fitness); // Sort descending by fitness
            }

            selection() {
                // Tournament selection
                const tournamentSize = 5;
                const parents = [];
                for (let i = 0; i < this.options.populationSize; i++) {
                    let bestContestant = null;
                    for (let j = 0; j < tournamentSize; j++) {
                        const contestant = this.population[Math.floor(Math.random() * this.population.length)];
                        if (!bestContestant || contestant.fitness > bestContestant.fitness) {
                            bestContestant = contestant;
                        }
                    }
                    parents.push(bestContestant);
                }
                return parents;
            }

            crossover(parent1, parent2) {
                const crossoverPoint = Math.floor(Math.random() * this.options.genomeSize);
                const childGenome = parent1.genome.slice(0, crossoverPoint).concat(parent2.genome.slice(crossoverPoint));
                return { genome: childGenome, fitness: 0 };
            }

            mutate(individual) {
                for (let i = 0; i < this.options.genomeSize; i++) {
                    if (Math.random() < this.options.mutationRate) {
                        individual.genome[i] += (Math.random() - 0.5) * 0.2; // Add small noise
                        individual.genome[i] = Math.max(0, Math.min(1, individual.genome[i])); // Clamp between 0 and 1
                    }
                }
            }

            runGeneration(simulationSteps) {
                this.evaluateFitness(simulationSteps);
                
                const parents = this.selection();
                const nextPopulation = [];
                
                // Elitism: carry over the best individuals
                for (let i = 0; i < this.options.elitism; i++) {
                    nextPopulation.push(this.population[i]);
                }

                // Fill the rest of the population with children
                while (nextPopulation.length < this.options.populationSize) {
                    const parent1 = parents[Math.floor(Math.random() * parents.length)];
                    const parent2 = parents[Math.floor(Math.random() * parents.length)];
                    let child = this.crossover(parent1, parent2);
                    this.mutate(child);
                    nextPopulation.push(child);
                }

                this.population = nextPopulation;
            }

            getBestIndividual() {
                return this.population[0];
            }
            
            getAverageFitness() {
                return this.population.reduce((sum, ind) => sum + ind.fitness, 0) / this.population.length;
            }
        }


        // ==========================================================
        //  CREATURE CLASS
        // ==========================================================
        class Creature {
            constructor(genome, scene) {
                this.genome = genome;
                this.scene = scene;
                this.rig = this.createRig();
            }

            // --- Genome Structure (per leg, 6 genes) ---
            // 0: crankRadius (0-1 -> maps to 0.1-0.5)
            // 1: thighLength (0-1 -> maps to 0.5-2.0)
            // 2: shinLength  (0-1 -> maps to 0.5-2.0)
            // 3: crankSpeed  (0-1 -> maps to 0.5-2.0)
            // 4: bodyPivotX offset (-0.5-0.5)
            // 5: bodyPivotY offset (0-0.5)
            static get GENES_PER_LEG() { return 6; }
            static get NUM_LEGS() { return 4; }

            static decodeGene(geneValue, min, max) {
                return geneValue * (max - min) + min;
            }

            createRig() {
                const body = BABYLON.MeshBuilder.CreateBox("body", { width: 4, height: 0.5, depth: 1.5 }, this.scene);
                body.position.y = 3;
                
                const legColor = new BABYLON.Color3(0.8, 0.8, 0.85);
                const jointColor = new BABYLON.Color3(0.6, 0.3, 0.3);

                const legs = [];
                for (let i = 0; i < Creature.NUM_LEGS; i++) {
                    const offset = i * Creature.GENES_PER_LEG;
                    const side = (i % 2 === 0) ? 1 : -1; // alternate sides
                    const xPos = (i < 2) ? 1.5 : -1.5; // front/back pair
                    
                    const crankRadius = Creature.decodeGene(this.genome[offset + 0], 0.1, 0.5);
                    const thighLength = Creature.decodeGene(this.genome[offset + 1], 0.5, 2.0);
                    const shinLength  = Creature.decodeGene(this.genome[offset + 2], 0.5, 2.0);
                    
                    // Create parent transforms for pivot points
                    const hipPivot = new BABYLON.TransformNode(`hipPivot_${i}`, this.scene);
                    hipPivot.parent = body;
                    hipPivot.position = new BABYLON.Vector3(xPos, 0, side * 0.75);

                    const crankPivot = new BABYLON.TransformNode(`crankPivot_${i}`, this.scene);
                    crankPivot.parent = body;
                    crankPivot.position = new BABYLON.Vector3(xPos, 0, side * 0.75);
                    
                    const thigh = BABYLON.MeshBuilder.CreateCylinder(`thigh_${i}`, {height: thighLength, diameter: 0.2}, this.scene);
                    thigh.material = new BABYLON.StandardMaterial("", this.scene);
                    thigh.material.diffuseColor = legColor;
                    thigh.parent = hipPivot;
                    thigh.position.y = -thighLength / 2;

                    const kneeJoint = BABYLON.MeshBuilder.CreateSphere(`knee_${i}`, {diameter: 0.3}, this.scene);
                    kneeJoint.material = new BABYLON.StandardMaterial("", this.scene);
                    kneeJoint.material.diffuseColor = jointColor;
                    kneeJoint.parent = thigh;
                    kneeJoint.position.y = -thighLength / 2;

                    const shin = BABYLON.MeshBuilder.CreateCylinder(`shin_${i}`, {height: shinLength, diameter: 0.2}, this.scene);
                    shin.material = new BABYLON.StandardMaterial("", this.scene);
                    shin.material.diffuseColor = legColor;
                    shin.parent = kneeJoint;
                    shin.position.y = -shinLength / 2;

                    const foot = BABYLON.MeshBuilder.CreateSphere(`foot_${i}`, {diameter: 0.25}, this.scene);
                    foot.material = new BABYLON.StandardMaterial("", this.scene);
                    foot.material.diffuseColor = jointColor;
                    foot.parent = shin;
                    foot.position.y = -shinLength/2;
                    
                    legs.push({ hipPivot, crankPivot, thigh, kneeJoint, shin, foot, side });
                }
                return { body, legs };
            }

            update(cycleTime) {
                const body = this.rig.body;
                
                // Get foot positions from kinematics to adjust body height
                const footPositions = this.rig.legs.map((leg, i) => this.getKinematics(i, cycleTime).footPos);
                
                const lowestFoot = Math.min(...footPositions.map(p => p.y));
                body.position.y = 3.0 - lowestFoot; // Keep body above lowest foot

                // Apply kinematic rotations to rig
                this.rig.legs.forEach((leg, i) => {
                    const { thighAngle, shinAngle } = this.getKinematics(i, cycleTime);
                    leg.hipPivot.rotation.z = thighAngle;
                    leg.kneeJoint.rotation.z = shinAngle - thighAngle;
                });
            }

            // Pure kinematic calculation based on genome and time
            getKinematics(legIndex, cycleTime) {
                const offset = legIndex * Creature.GENES_PER_LEG;
                const side = (legIndex % 2 === 0) ? 1 : -1;
                
                // Decode genome
                const crankRadius = Creature.decodeGene(this.genome[offset + 0], 0.1, 0.5);
                const thighLength = Creature.decodeGene(this.genome[offset + 1], 0.5, 2.0);
                const shinLength  = Creature.decodeGene(this.genome[offset + 2], 0.5, 2.0);
                const crankSpeed  = Creature.decodeGene(this.genome[offset + 3], 0.5, 2.0);
                const bodyPivotX  = Creature.decodeGene(this.genome[offset + 4], -1.0, 1.0);
                const bodyPivotY  = Creature.decodeGene(this.genome[offset + 5], -0.5, 0.5);

                const phase = (legIndex < 2) ? 0 : Math.PI; // Simple front/back phase opposition
                
                // Crank motion
                const angle = cycleTime * 2 * Math.PI * crankSpeed + phase;
                const crankX = Math.cos(angle) * crankRadius + bodyPivotX;
                const crankY = Math.sin(angle) * crankRadius + bodyPivotY;

                // IK for the two-segment leg (thigh, shin) reaching for the crank point
                const dx = crankX;
                const dy = crankY;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Law of Cosines to find angles
                const a = thighLength;
                const b = shinLength;
                const c = dist;

                let thighAngle = Math.atan2(dy, dx);
                let shinAngle = 0;

                if (c < a + b && c > Math.abs(a - b)) { // check reachability
                    const alpha = Math.acos((a * a + c * c - b * b) / (2 * a * c));
                    thighAngle += alpha;

                    const beta = Math.acos((a * a + b * b - c * c) / (2 * a * b));
                    shinAngle = thighAngle - (Math.PI - beta);
                } else {
                    // Leg is over-extended, point it towards the target
                    shinAngle = thighAngle;
                }

                // Calculate global foot position
                const footX = Math.cos(thighAngle) * thighLength + Math.cos(shinAngle) * shinLength;
                const footY = Math.sin(thighAngle) * thighLength + Math.sin(shinAngle) * shinLength;
                const footPos = new BABYLON.Vector3(footX, footY, 0);

                return { thighAngle, shinAngle, footPos };
            }

            dispose() {
                this.rig.body.dispose(false, true); // Dispose of body and all children
            }
            
            // Static method for fast, non-visual fitness evaluation
            static calculateFitness(genome, simulationSteps) {
                let minX = 0, maxX = 0;
                let minY = Infinity, maxY = -Infinity;
                
                let bodyX = 0;
                let bodyYHistory = [];

                for (let i = 0; i < simulationSteps; i++) {
                    const t = i / simulationSteps;
                    
                    const footData = [];
                    for(let j=0; j < Creature.NUM_LEGS; j++) {
                        const { footPos } = this.prototype.getKinematics.call({genome}, j, t);
                        const legXPos = (j < 2) ? 1.5 : -1.5;
                        footData.push({ x: legXPos + footPos.x, y: footPos.y });
                    }
                    
                    const lowestFootY = Math.min(...footData.map(p => p.y));
                    const bodyY = 3.0 - lowestFootY;
                    bodyYHistory.push(bodyY);

                    // Find the rearmost foot on the "ground" to determine forward motion
                    const groundFeet = footData.filter(p => p.y < lowestFootY + 0.1);
                    if (groundFeet.length > 0) {
                        bodyX = -Math.min(...groundFeet.map(p => p.x));
                    }
                    
                    minX = Math.min(minX, bodyX);
                    maxX = Math.max(maxX, bodyX);
                }

                const distance = maxX - minX;
                
                // --- Penalties for instability ---
                const avgBodyY = bodyYHistory.reduce((a,b)=>a+b,0) / bodyYHistory.length;
                const heightVariation = bodyYHistory.reduce((sum, y) => sum + Math.abs(y - avgBodyY), 0);
                const heightPenalty = Math.pow(heightVariation, 2) * 0.5;
                
                const bodyTilt = Math.abs(avgBodyY - 3.0); // Penalty for not staying level
                const tiltPenalty = Math.pow(bodyTilt, 2) * 2.0;

                let fitness = distance - heightPenalty - tiltPenalty;
                return Math.max(0.001, fitness); // Fitness must be positive
            }
        }

        // ==========================================================
        //  SCENE AND APP LOGIC
        // ==========================================================
        function createScene() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3.FromHexString("#2c3e50");

            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 25, new BABYLON.Vector3(0, 2, 0), scene);
            camera.attachControl(canvas, true);

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.8;

            const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 100, height: 100 }, scene);
            ground.material = new BABYLON.StandardMaterial("groundMat", scene);
            ground.material.diffuseColor = new BABYLON.Color3.FromHexString("#34495e");
            ground.material.specularColor = BABYLON.Color3.Black();

            return scene;
        }

        function setupUI() {
            Object.values(uiElements).forEach(el => {
                if (el.slider) {
                    el.slider.addEventListener('input', () => {
                        el.label.textContent = el.slider.value;
                        if (!isRunning) updateGAParams();
                    });
                }
            });
            startPauseBtn.addEventListener('click', toggleEvolution);
            resetBtn.addEventListener('click', resetSimulation);
        }

        function updateGAParams() {
            ga.options.populationSize = parseInt(uiElements.popSize.slider.value);
            ga.options.mutationRate = parseFloat(uiElements.mutRate.slider.value);
            ga.options.elitism = parseInt(uiElements.elitism.slider.value);
            cycleDuration = parseFloat(uiElements.cycleDur.slider.value);
        }

        function toggleEvolution() {
            isRunning = !isRunning;
            if (isRunning) {
                startPauseBtn.textContent = 'Pause Evolution';
                startPauseBtn.classList.add('pause');
                updateGAParams(); // Lock in params on start
                runEvolutionStep();
            } else {
                startPauseBtn.textContent = 'Resume Evolution';
                startPauseBtn.classList.remove('pause');
            }
        }

        function resetSimulation() {
            if (isRunning) toggleEvolution(); // Pause first
            updateGAParams();
            ga.initializePopulation();
            
            if (currentCreature) {
                currentCreature.dispose();
                currentCreature = null;
            }
            
            startPauseBtn.textContent = 'Start Evolution';
            uiElements.genStat.textContent = '0';
            uiElements.fitStat.textContent = '0';
            uiElements.avgFitStat.textContent = '0';
        }
        
        let generation = 0;
        function runEvolutionStep() {
            if (!isRunning) return;

            ga.runGeneration(100); // Simulate 100 steps for fitness
            generation++;

            const best = ga.getBestIndividual();
            
            // Update UI
            uiElements.genStat.textContent = generation;
            uiElements.fitStat.textContent = best.fitness.toFixed(4);
            uiElements.avgFitStat.textContent = ga.getAverageFitness().toFixed(4);

            // Update visualization
            if (currentCreature) {
                currentCreature.dispose();
            }
            currentCreature = new Creature(best.genome, scene);

            // Loop
            setTimeout(runEvolutionStep, 20); // Fast evolution loop
        }

        function initialize() {
            scene = createScene();
            
            ga = new GeneticAlgorithm({
                genomeSize: Creature.NUM_LEGS * Creature.GENES_PER_LEG,
            });
            
            setupUI();
            resetSimulation();

            engine.runRenderLoop(() => {
                if (currentCreature) {
                    const deltaTime = engine.getDeltaTime() / 1000;
                    animationTime = (animationTime + deltaTime / cycleDuration) % 1;
                    currentCreature.update(animationTime);
                }
                scene.render();
            });

            window.addEventListener('resize', () => {
                engine.resize();
            });
        }

        initialize();
    });
    </script>
</body>
</html>
