<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolving Strandbeest Walker - Genetic Algorithm</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
        }
        
        #renderCanvas {
            width: 100%;
            height: 100vh;
            touch-action: none;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 10px;
            width: 320px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(100, 255, 100, 0.3);
            box-shadow: 0 0 20px rgba(100, 255, 100, 0.1);
            backdrop-filter: blur(10px);
        }
        
        #controls h3 {
            margin: 0 0 15px 0;
            color: #66ff66;
            text-shadow: 0 0 10px #66ff66;
            font-size: 16px;
        }
        
        .control-group {
            margin: 12px 0;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #88ff88;
            font-size: 12px;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
            accent-color: #66ff66;
        }
        
        input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #66ff66;
        }
        
        button {
            background: linear-gradient(135deg, #00aa44, #00ff66);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: linear-gradient(135deg, #00ff66, #66ffaa);
            box-shadow: 0 2px 15px rgba(100, 255, 100, 0.5);
            transform: scale(1.05);
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: scale(1);
        }
        
        .value-display {
            color: #00ffaa;
            float: right;
            font-weight: bold;
        }
        
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 10px;
            width: 250px;
            border: 1px solid rgba(255, 200, 100, 0.3);
            box-shadow: 0 0 20px rgba(255, 200, 100, 0.1);
        }
        
        #stats h3 {
            margin: 0 0 10px 0;
            color: #ffaa66;
            text-shadow: 0 0 10px #ffaa66;
            font-size: 14px;
        }
        
        .stat-item {
            margin: 8px 0;
            font-size: 12px;
        }
        
        .stat-value {
            color: #ffdd66;
            font-weight: bold;
            float: right;
        }
        
        #generationChart {
            margin-top: 10px;
            height: 100px;
            border: 1px solid #444;
            background: rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .best-indicator {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 215, 0, 0.9);
            color: black;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="controls">
        <h3>🦿 Evolving Strandbeest Walker</h3>
        
        <div class="control-group">
            <button id="startEvolution" onclick="toggleEvolution()">Start Evolution</button>
            <button onclick="resetEvolution()">Reset</button>
            <button onclick="showBest()">Show Best</button>
            <button onclick="nextGeneration()" id="stepBtn">Step Generation</button>
        </div>
        
        <div class="control-group">
            <label>Population Size:
                <span class="value-display" id="popSizeVal">20</span>
            </label>
            <input type="range" id="populationSize" min="10" max="50" value="20" step="5">
            
            <label>Mutation Rate:
                <span class="value-display" id="mutRateVal">0.05</span>
            </label>
            <input type="range" id="mutationRate" min="0.01" max="0.2" value="0.05" step="0.01">
            
            <label>Crossover Rate:
                <span class="value-display" id="crossRateVal">0.7</span>
            </label>
            <input type="range" id="crossoverRate" min="0.3" max="1.0" value="0.7" step="0.1">
        </div>
        
        <div class="control-group">
            <label>Simulation Time (seconds):
                <span class="value-display" id="simTimeVal">10</span>
            </label>
            <input type="range" id="simulationTime" min="5" max="30" value="10" step="1">
            
            <label>Simulation Speed:
                <span class="value-display" id="simSpeedVal">2.0</span>
            </label>
            <input type="range" id="simulationSpeed" min="0.5" max="5" value="2" step="0.5">
        </div>
        
        <div class="control-group">
            <label>Leg Segments:
                <span class="value-display" id="legSegmentsVal">3</span>
            </label>
            <input type="range" id="legSegments" min="2" max="5" value="3" step="1">
            
            <label>Number of Legs:
                <span class="value-display" id="numLegsVal">4</span>
            </label>
            <input type="range" id="numLegs" min="2" max="8" value="4" step="2">
        </div>
        
        <div class="control-group">
            <label><input type="checkbox" id="showAll" checked> Show All Creatures</label>
            <label><input type="checkbox" id="showTrails"> Show Movement Trails</label>
            <label><input type="checkbox" id="autoCamera" checked> Auto Camera</label>
        </div>
    </div>
    
    <div id="stats">
        <h3>📊 Evolution Statistics</h3>
        <div class="stat-item">
            Generation: <span class="stat-value" id="generation">0</span>
        </div>
        <div class="stat-item">
            Best Fitness: <span class="stat-value" id="bestFitness">0.00</span>
        </div>
        <div class="stat-item">
            Average Fitness: <span class="stat-value" id="avgFitness">0.00</span>
        </div>
        <div class="stat-item">
            Improvement: <span class="stat-value" id="improvement">0.0%</span>
        </div>
        <div class="stat-item">
            Best Speed: <span class="stat-value" id="bestSpeed">0.00</span> m/s
        </div>
        <div class="stat-item">
            Stability: <span class="stat-value" id="stability">0.0%</span>
        </div>
        <div id="generationChart"></div>
    </div>
    
    <div class="best-indicator" id="bestIndicator" style="display: none;">
        CURRENT BEST
    </div>

    <script>
        // Gene structure for Strandbeest leg
        class Genome {
            constructor(params = {}) {
                this.legSegments = params.legSegments || 3;
                this.numLegs = params.numLegs || 4;
                
                // Initialize genes
                this.genes = {
                    // Leg segment lengths (normalized 0-1)
                    segmentLengths: [],
                    // Joint angles for walking cycle
                    jointAngles: [],
                    // Phase offsets for each leg
                    phaseOffsets: [],
                    // Body dimensions
                    bodyWidth: Math.random() * 0.5 + 0.5,
                    bodyHeight: Math.random() * 0.3 + 0.2,
                    // Motor parameters
                    cycleSpeed: Math.random() * 2 + 1,
                    strideAmplitude: Math.random() * 0.5 + 0.5,
                    // Balance parameters
                    centerOfMass: Math.random() * 0.4 - 0.2
                };
                
                // Initialize arrays
                for (let i = 0; i < this.numLegs; i++) {
                    this.genes.segmentLengths.push([]);
                    this.genes.jointAngles.push([]);
                    for (let j = 0; j < this.legSegments; j++) {
                        this.genes.segmentLengths[i].push(Math.random() * 0.5 + 0.5);
                        this.genes.jointAngles[i].push(Math.random() * Math.PI - Math.PI/2);
                    }
                    this.genes.phaseOffsets.push(Math.random() * Math.PI * 2);
                }
            }
            
            copy() {
                let newGenome = new Genome({
                    legSegments: this.legSegments,
                    numLegs: this.numLegs
                });
                newGenome.genes = JSON.parse(JSON.stringify(this.genes));
                return newGenome;
            }
            
            crossover(other, rate) {
                if (Math.random() > rate) return this.copy();
                
                let child = new Genome({
                    legSegments: this.legSegments,
                    numLegs: this.numLegs
                });
                
                // Crossover each gene
                for (let key in this.genes) {
                    if (Array.isArray(this.genes[key])) {
                        child.genes[key] = [];
                        for (let i = 0; i < this.genes[key].length; i++) {
                            if (Array.isArray(this.genes[key][i])) {
                                child.genes[key][i] = [];
                                for (let j = 0; j < this.genes[key][i].length; j++) {
                                    child.genes[key][i][j] = Math.random() < 0.5 ? 
                                        this.genes[key][i][j] : other.genes[key][i][j];
                                }
                            } else {
                                child.genes[key][i] = Math.random() < 0.5 ? 
                                    this.genes[key][i] : other.genes[key][i];
                            }
                        }
                    } else {
                        child.genes[key] = Math.random() < 0.5 ? 
                            this.genes[key] : other.genes[key];
                    }
                }
                
                return child;
            }
            
            mutate(rate) {
                for (let key in this.genes) {
                    if (Array.isArray(this.genes[key])) {
                        for (let i = 0; i < this.genes[key].length; i++) {
                            if (Array.isArray(this.genes[key][i])) {
                                for (let j = 0; j < this.genes[key][i].length; j++) {
                                    if (Math.random() < rate) {
                                        this.genes[key][i][j] += (Math.random() - 0.5) * 0.5;
                                        this.genes[key][i][j] = Math.max(0.1, Math.min(2, this.genes[key][i][j]));
                                    }
                                }
                            } else {
                                if (Math.random() < rate) {
                                    this.genes[key][i] += (Math.random() - 0.5) * 0.5;
                                }
                            }
                        }
                    } else {
                        if (Math.random() < rate) {
                            this.genes[key] += (Math.random() - 0.5) * 0.5;
                            this.genes[key] = Math.max(0.1, Math.min(2, this.genes[key]));
                        }
                    }
                }
            }
        }
        
        // Creature class
        class Creature {
            constructor(scene, genome, position) {
                this.scene = scene;
                this.genome = genome;
                this.position = position;
                this.meshes = [];
                this.joints = [];
                this.startPosition = position.clone();
                this.fitness = 0;
                this.time = 0;
                this.fallen = false;
                
                this.build();
            }
            
            build() {
                const g = this.genome.genes;
                
                // Create body
                this.body = BABYLON.MeshBuilder.CreateBox("body", {
                    width: g.bodyWidth * 2,
                    height: g.bodyHeight,
                    depth: 1
                }, this.scene);
                this.body.position = this.position.clone();
                
                // Body material
                const bodyMat = new BABYLON.StandardMaterial("bodyMat", this.scene);
                bodyMat.diffuseColor = new BABYLON.Color3(0.3, 0.6, 0.9);
                bodyMat.specularColor = new BABYLON.Color3(0, 0, 0);
                this.body.material = bodyMat;
                this.meshes.push(this.body);
                
                // Create legs
                this.legs = [];
                for (let i = 0; i < this.genome.numLegs; i++) {
                    let leg = this.createLeg(i);
                    this.legs.push(leg);
                }
            }
            
            createLeg(legIndex) {
                const g = this.genome.genes;
                const leg = { segments: [], joints: [] };
                
                // Calculate leg attachment position
                const legSpacing = g.bodyWidth * 2 / (this.genome.numLegs / 2);
                const side = legIndex < this.genome.numLegs / 2 ? -1 : 1;
                const alongBody = (legIndex % (this.genome.numLegs / 2)) * legSpacing - g.bodyWidth + legSpacing/2;
                
                let currentPos = new BABYLON.Vector3(
                    this.position.x + alongBody,
                    this.position.y,
                    this.position.z + side * 0.6
                );
                
                let prevMesh = this.body;
                
                // Create leg segments
                for (let j = 0; j < this.genome.legSegments; j++) {
                    const segmentLength = g.segmentLengths[legIndex][j];
                    
                    // Create segment
                    const segment = BABYLON.MeshBuilder.CreateCylinder(`leg_${legIndex}_${j}`, {
                        height: segmentLength,
                        diameter: 0.1,
                        tessellation: 8
                    }, this.scene);
                    
                    segment.position = currentPos.clone();
                    segment.rotation.x = Math.PI / 2;
                    
                    // Segment material
                    const segMat = new BABYLON.StandardMaterial(`segMat_${legIndex}_${j}`, this.scene);
                    const colorIntensity = j / this.genome.legSegments;
                    segMat.diffuseColor = new BABYLON.Color3(
                        0.8 - colorIntensity * 0.3,
                        0.8 - colorIntensity * 0.2,
                        0.4 + colorIntensity * 0.3
                    );
                    segment.material = segMat;
                    
                    this.meshes.push(segment);
                    leg.segments.push(segment);
                    
                    // Create joint
                    const joint = {
                        mesh: segment,
                        angle: g.jointAngles[legIndex][j],
                        baseAngle: g.jointAngles[legIndex][j],
                        phase: g.phaseOffsets[legIndex]
                    };
                    leg.joints.push(joint);
                    
                    // Update position for next segment
                    currentPos.y -= segmentLength * 0.8;
                    currentPos.z += side * segmentLength * 0.2;
                    
                    prevMesh = segment;
                }
                
                return leg;
            }
            
            update(deltaTime) {
                this.time += deltaTime;
                const g = this.genome.genes;
                
                // Update leg positions using forward kinematics
                for (let i = 0; i < this.legs.length; i++) {
                    const leg = this.legs[i];
                    const phase = g.phaseOffsets[i];
                    const cyclePos = this.time * g.cycleSpeed + phase;
                    
                    // Walking gait pattern
                    const walkCycle = Math.sin(cyclePos) * g.strideAmplitude;
                    const liftCycle = Math.max(0, Math.sin(cyclePos * 2)) * 0.3;
                    
                    for (let j = 0; j < leg.joints.length; j++) {
                        const joint = leg.joints[j];
                        
                        // Apply walking motion
                        if (j === 0) {
                            // Hip joint - main walking motion
                            joint.mesh.rotation.z = joint.baseAngle + walkCycle;
                            joint.mesh.position.y = this.body.position.y - liftCycle;
                        } else if (j === 1) {
                            // Knee joint
                            joint.mesh.rotation.z = joint.baseAngle + walkCycle * 0.5;
                        } else {
                            // Ankle joint
                            joint.mesh.rotation.z = joint.baseAngle - walkCycle * 0.3;
                        }
                    }
                }
                
                // Apply forward motion based on leg movement
                const speed = g.cycleSpeed * g.strideAmplitude * 0.1;
                this.body.position.x += speed * deltaTime * Math.cos(this.time);
                
                // Simple balance adjustment
                const tilt = Math.sin(this.time * g.cycleSpeed) * 0.1;
                this.body.rotation.z = tilt * g.centerOfMass;
                
                // Update all leg positions relative to body
                for (let leg of this.legs) {
                    for (let segment of leg.segments) {
                        segment.position.x = this.body.position.x + (segment.position.x - this.body.position.x) * 0.9;
                    }
                }
                
                // Check if creature has fallen
                if (Math.abs(this.body.rotation.z) > Math.PI / 4) {
                    this.fallen = true;
                }
            }
            
            calculateFitness() {
                // Fitness based on distance traveled and stability
                const distance = Math.abs(this.body.position.x - this.startPosition.x);
                const stability = this.fallen ? 0 : 1;
                const efficiency = distance / (this.time + 1); // Speed
                
                this.fitness = distance * stability + efficiency * 10;
                return this.fitness;
            }
            
            dispose() {
                for (let mesh of this.meshes) {
                    mesh.dispose();
                }
            }
            
            setVisible(visible) {
                for (let mesh of this.meshes) {
                    mesh.isVisible = visible;
                }
            }
        }
        
        // Genetic Algorithm
        class GeneticAlgorithm {
            constructor(scene, params) {
                this.scene = scene;
                this.populationSize = params.populationSize || 20;
                this.mutationRate = params.mutationRate || 0.05;
                this.crossoverRate = params.crossoverRate || 0.7;
                this.legSegments = params.legSegments || 3;
                this.numLegs = params.numLegs || 4;
                
                this.generation = 0;
                this.population = [];
                this.creatures = [];
                this.bestGenome = null;
                this.bestFitness = 0;
                this.fitnessHistory = [];
                
                this.initializePopulation();
            }
            
            initializePopulation() {
                this.population = [];
                for (let i = 0; i < this.populationSize; i++) {
                    this.population.push(new Genome({
                        legSegments: this.legSegments,
                        numLegs: this.numLegs
                    }));
                }
            }
            
            createCreatures() {
                // Dispose old creatures
                for (let creature of this.creatures) {
                    creature.dispose();
                }
                this.creatures = [];
                
                // Create new creatures
                for (let i = 0; i < this.population.length; i++) {
                    const position = new BABYLON.Vector3(
                        (i - this.populationSize / 2) * 3,
                        2,
                        0
                    );
                    const creature = new Creature(this.scene, this.population[i], position);
                    this.creatures.push(creature);
                }
            }
            
            simulate(duration, onComplete) {
                const startTime = Date.now();
                const simSpeed = parseFloat(document.getElementById('simulationSpeed').value);
                
                const updateLoop = () => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    if (elapsed >= duration / simSpeed) {
                        this.evaluateFitness();
                        onComplete();
                        return;
                    }
                    
                    // Update all creatures
                    for (let creature of this.creatures) {
                        creature.update(0.016 * simSpeed); // 60 FPS * speed multiplier
                    }
                    
                    requestAnimationFrame(updateLoop);
                };
                
                updateLoop();
            }
            
            evaluateFitness() {
                let totalFitness = 0;
                let bestCreature = null;
                
                for (let i = 0; i < this.creatures.length; i++) {
                    const fitness = this.creatures[i].calculateFitness();
                    this.population[i].fitness = fitness;
                    totalFitness += fitness;
                    
                    if (!bestCreature || fitness > bestCreature.fitness) {
                        bestCreature = this.creatures[i];
                        this.bestGenome = this.population[i].copy();
                        this.bestFitness = fitness;
                    }
                }
                
                this.avgFitness = totalFitness / this.creatures.length;
                this.fitnessHistory.push({
                    generation: this.generation,
                    best: this.bestFitness,
                    average: this.avgFitness
                });
                
                // Update stats display
                this.updateStats(bestCreature);
            }
            
            selection() {
                // Tournament selection
                const selected = [];
                const tournamentSize = 3;
                
                for (let i = 0; i < this.populationSize; i++) {
                    let best = null;
                    for (let j = 0; j < tournamentSize; j++) {
                        const contestant = this.population[Math.floor(Math.random() * this.populationSize)];
                        if (!best || contestant.fitness > best.fitness) {
                            best = contestant;
                        }
                    }
                    selected.push(best);
                }
                
                return selected;
            }
            
            evolve() {
                const parents = this.selection();
                const newPopulation = [];
                
                // Elitism - keep best individual
                if (this.bestGenome) {
                    newPopulation.push(this.bestGenome.copy());
                }
                
                // Create new generation
                while (newPopulation.length < this.populationSize) {
                    const parent1 = parents[Math.floor(Math.random() * parents.length)];
                    const parent2 = parents[Math.floor(Math.random() * parents.length)];
                    
                    let child = parent1.crossover(parent2, this.crossoverRate);
                    child.mutate(this.mutationRate);
                    
                    newPopulation.push(child);
                }
                
                this.population = newPopulation;
                this.generation++;
            }
            
            updateStats(bestCreature) {
                document.getElementById('generation').textContent = this.generation;
                document.getElementById('bestFitness').textContent = this.bestFitness.toFixed(2);
                document.getElementById('avgFitness').textContent = this.avgFitness.toFixed(2);
                
                if (this.fitnessHistory.length > 1) {
                    const prevBest = this.fitnessHistory[this.fitnessHistory.length - 2].best;
                    const improvement = ((this.bestFitness - prevBest) / prevBest * 100).toFixed(1);
                    document.getElementById('improvement').textContent = improvement + '%';
                }
                
                if (bestCreature) {
                    const speed = Math.abs(bestCreature.body.position.x - bestCreature.startPosition.x) / bestCreature.time;
                    document.getElementById('bestSpeed').textContent = speed.toFixed(2);
                    document.getElementById('stability').textContent = (bestCreature.fallen ? 0 : 100) + '%';
                }
                
                this.drawChart();
            }
            
            drawChart() {
                const chart = document.getElementById('generationChart');
                chart.innerHTML = '';
                
                if (this.fitnessHistory.length < 2) return;
                
                const canvas = document.createElement('canvas');
                canvas.width = chart.clientWidth;
                canvas.height = chart.clientHeight;
                chart.appendChild(canvas);
                
                const ctx = canvas.getContext('2d');
                const padding = 10;
                const width = canvas.width - padding * 2;
                const height = canvas.height - padding * 2;
                
                // Find min/max values
                let maxFitness = Math.max(...this.fitnessHistory.map(h => h.best));
                let minFitness = 0;
                
                // Draw axes
                ctx.strokeStyle = '#666';
                ctx.beginPath();
                ctx.moveTo(padding, padding);
                ctx.lineTo(padding, height + padding);
                ctx.lineTo(width + padding, height + padding);
                ctx.stroke();
                
                // Draw best fitness line
                ctx.strokeStyle = '#66ff66';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < this.fitnessHistory.length; i++) {
                    const x = padding + (i / (this.fitnessHistory.length - 1)) * width;
                    const y = height + padding - ((this.fitnessHistory[i].best - minFitness) / (maxFitness - minFitness)) * height;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                
                // Draw average fitness line
                ctx.strokeStyle = '#ffaa66';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i < this.fitnessHistory.length; i++) {
                    const x = padding + (i / (this.fitnessHistory.length - 1)) * width;
                    const y = height + padding - ((this.fitnessHistory[i].average - minFitness) / (maxFitness - minFitness)) * height;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }
        
        // Main application
        let canvas, engine, scene, camera, light;
        let ga, isEvolving = false, showingBest = false;
        
        function initBabylon() {
            canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true);
            
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.05, 0.05, 0.1);
            
            // Camera
            camera = new BABYLON.ArcRotateCamera("camera", 
                -Math.PI / 2, Math.PI / 3, 30, 
                new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 10;
            camera.upperRadiusLimit = 100;
            
            // Lights
            const light1 = new BABYLON.HemisphericLight("light1", 
                new BABYLON.Vector3(0, 1, 0), scene);
            light1.intensity = 0.7;
            
            const light2 = new BABYLON.DirectionalLight("light2", 
                new BABYLON.Vector3(-1, -2, -1), scene);
            light2.intensity = 0.3;
            
            // Ground
            const ground = BABYLON.MeshBuilder.CreateGround("ground", 
                {width: 200, height: 20}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.2);
            groundMat.specularColor = new BABYLON.Color3(0, 0, 0);
            ground.material = groundMat;
            
            // Grid
            const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
            gridMat.wireframe = true;
            gridMat.wireframeLineWidth = 0.1;
            gridMat.emissiveColor = new BABYLON.Color3(0.1, 0.2, 0.1);
            const grid = BABYLON.MeshBuilder.CreateGround("grid", 
                {width: 200, height: 20, subdivisions: 40}, scene);
            grid.material = gridMat;
            grid.position.y = 0.01;
            
            // Initialize GA
            initGA();
            
            // Setup controls
            setupControls();
            
            // Render loop
            engine.runRenderLoop(() => {
                scene.render();
                
                // Auto camera follow
                if (document.getElementById('autoCamera').checked && ga.creatures.length > 0) {
                    let avgX = 0;
                    let visibleCount = 0;
                    for (let creature of ga.creatures) {
                        if (creature.meshes[0].isVisible) {
                            avgX += creature.body.position.x;
                            visibleCount++;
                        }
                    }
                    if (visibleCount > 0) {
                        camera.target.x = avgX / visibleCount;
                    }
                }
            });
            
            // Resize
            window.addEventListener("resize", () => {
                engine.resize();
            });
        }
        
        function initGA() {
            ga = new GeneticAlgorithm(scene, {
                populationSize: parseInt(document.getElementById('populationSize').value),
                mutationRate: parseFloat(document.getElementById('mutationRate').value),
                crossoverRate: parseFloat(document.getElementById('crossoverRate').value),
                legSegments: parseInt(document.getElementById('legSegments').value),
                numLegs: parseInt(document.getElementById('numLegs').value)
            });
            
            ga.createCreatures();
        }
        
        function setupControls() {
            // Population size
            document.getElementById('populationSize').addEventListener('input', function(e) {
                document.getElementById('popSizeVal').textContent = e.target.value;
                ga.populationSize = parseInt(e.target.value);
            });
            
            // Mutation rate
            document.getElementById('mutationRate').addEventListener('input', function(e) {
                document.getElementById('mutRateVal').textContent = e.target.value;
                ga.mutationRate = parseFloat(e.target.value);
            });
            
            // Crossover rate
            document.getElementById('crossoverRate').addEventListener('input', function(e) {
                document.getElementById('crossRateVal').textContent = e.target.value;
                ga.crossoverRate = parseFloat(e.target.value);
            });
            
            // Simulation time
            document.getElementById('simulationTime').addEventListener('input', function(e) {
                document.getElementById('simTimeVal').textContent = e.target.value;
            });
            
            // Simulation speed
            document.getElementById('simulationSpeed').addEventListener('input', function(e) {
                document.getElementById('simSpeedVal').textContent = e.target.value;
            });
            
            // Leg segments
            document.getElementById('legSegments').addEventListener('input', function(e) {
                document.getElementById('legSegmentsVal').textContent = e.target.value;
            });
            
            // Number of legs
            document.getElementById('numLegs').addEventListener('input', function(e) {
                document.getElementById('numLegsVal').textContent = e.target.value;
            });
            
            // Show all checkbox
            document.getElementById('showAll').addEventListener('change', function(e) {
                if (ga.creatures) {
                    for (let i = 0; i < ga.creatures.length; i++) {
                        ga.creatures[i].setVisible(e.target.checked || i === 0);
                    }
                }
            });
        }
        
        function toggleEvolution() {
            isEvolving = !isEvolving;
            document.getElementById('startEvolution').textContent = isEvolving ? 'Stop Evolution' : 'Start Evolution';
            document.getElementById('stepBtn').disabled = isEvolving;
            
            if (isEvolving) {
                evolutionLoop();
            }
        }
        
        function evolutionLoop() {
            if (!isEvolving) return;
            
            const simTime = parseInt(document.getElementById('simulationTime').value);
            
            ga.simulate(simTime, () => {
                ga.evolve();
                ga.createCreatures();
                
                // Show/hide creatures based on settings
                const showAll = document.getElementById('showAll').checked;
                for (let i = 0; i < ga.creatures.length; i++) {
                    ga.creatures[i].setVisible(showAll || i === 0);
                }
                
                if (isEvolving) {
                    setTimeout(evolutionLoop, 100);
                }
            });
        }
        
        function nextGeneration() {
            if (isEvolving) return;
            
            const simTime = parseInt(document.getElementById('simulationTime').value);
            
            ga.simulate(simTime, () => {
                ga.evolve();
                ga.createCreatures();
                
                const showAll = document.getElementById('showAll').checked;
                for (let i = 0; i < ga.creatures.length; i++) {
                    ga.creatures[i].setVisible(showAll || i === 0);
                }
            });
        }
        
        function resetEvolution() {
            isEvolving = false;
            document.getElementById('startEvolution').textContent = 'Start Evolution';
            document.getElementById('stepBtn').disabled = false;
            
            initGA();
            
            // Reset stats
            document.getElementById('generation').textContent = '0';
            document.getElementById('bestFitness').textContent = '0.00';
            document.getElementById('avgFitness').textContent = '0.00';
            document.getElementById('improvement').textContent = '0.0%';
            document.getElementById('bestSpeed').textContent = '0.00';
            document.getElementById('stability').textContent = '0.0%';
            document.getElementById('generationChart').innerHTML = '';
        }
        
        function showBest() {
            if (!ga.bestGenome) return;
            
            // Clear current creatures
            for (let creature of ga.creatures) {
                creature.dispose();
            }
            ga.creatures = [];
            
            // Create and show only the best creature
            const bestCreature = new Creature(scene, ga.bestGenome, new BABYLON.Vector3(0, 2, 0));
            ga.creatures = [bestCreature];
            
            // Show best indicator
            document.getElementById('bestIndicator').style.display = 'block';
            setTimeout(() => {
                document.getElementById('bestIndicator').style.display = 'none';
            }, 3000);
        }
        
        // Initialize on load
        window.addEventListener('DOMContentLoaded', initBabylon);
    </script>
</body>
</html>
