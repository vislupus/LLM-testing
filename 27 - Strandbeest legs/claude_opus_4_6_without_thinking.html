<body>
<canvas id="renderCanvas"></canvas>

<div id="panel">
  <h1>🦿 Strandbeest Evolution</h1>
  <div class="sub">Genetic Algorithm · Babylon.js · Walking Linkages</div>

  <div class="section">
    <div class="section-title">GA Parameters</div>
    <div class="row">
      <label>Population</label>
      <input type="range" id="sPop" min="8" max="80" value="30" step="2">

    <div class="row">
      <label>Mutation Str.</label>
      <input type="range" id="sMutStr" min="5" max="50" value="20">
      <span class="val" id="vMutStr">20%</span>
    </div>
    <div class="row">
      <label>Sim Duration</label>
      <input type="range" id="sDur" min="2" max="12" value="5" step="0.5">
      <span class="val" id="vDur">5.0s</span>
    </div>
    <div class="row">
      <label>Elitism</label>
      <input type="range" id="sElite" min="1" max="10" value="2">
      <span class="val" id="vElite">2</span>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btnStart" onclick="toggleEvolution()">▶ Start</button>
      <button class="btn" onclick="resetEvolution()">↺ Reset</button>
      <button class="btn" id="btnReplay" onclick="replayBest()">⏵ Replay Best</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Statistics</div>
    <div class="stat-grid">
      <div class="stat-box gen"><div class="sl">Generation</div><div class="sv" id="statGen">0</div></div>
      <div class="stat-box pop"><div class="sl">Evaluated</div><div class="sv" id="statEval">0</div></div>
      <div class="stat-box best"><div class="sl">Best Fitness</div><div class="sv" id="statBest">0.00</div></div>
      <div class="stat-box avg"><div class="sl">Avg Fitness</div><div class="sv" id="statAvg">0.00</div></div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
// ============================================================
//  STRANDBEEST EVOLUTION – GA + Babylon.js
// ============================================================

// ----- Genome Structure -----
// Each creature has a body and N leg pairs (left/right symmetric).
// Genome per leg pair:
//   hipOffset:   where on body the hip attaches (x-offset from center)
//   upperLen:    length of upper leg segment
//   lowerLen:    length of lower leg segment
//   crankLen:    crank arm length (drives the leg)
//   crankOffset: vertical offset of crank pivot
//   phaseOffset: phase offset for this leg pair
//   hipAngle:    rest angle of hip
//   angularSpeed: speed of crank rotation
//
// Body genes:
//   bodyWidth, bodyHeight, bodyMass (affect stability)
//   numLegPairs: 1-3 pairs
//   globalSpeed: overall crank speed multiplier

const GENES_PER_LEG = 8;
const BODY_GENES = 4;

function genomeLength(numLegPairs) {
  return BODY_GENES + numLegPairs * GENES_PER_LEG;
}

// Gene ranges
const GENE_RANGES = {
  bodyWidth:    [0.8, 3.0],
  bodyHeight:   [0.3, 1.0],
  numLegPairs:  [1, 3],      // integer
  globalSpeed:  [1.0, 8.0],
  // Per leg:
  hipOffset:    [0.1, 1.4],
  upperLen:     [0.4, 2.0],
  lowerLen:     [0.4, 2.0],
  crankLen:     [0.2, 1.2],
  crankOffset:  [-0.5, 0.5],
  phaseOffset:  [0, Math.PI * 2],
  hipAngle:     [-0.5, 0.5],
  angularSpeed: [0.5, 3.0]
};

function randomInRange(min, max) {
  return min + Math.random() * (max - min);
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function randomGenome() {
  const numPairs = Math.floor(randomInRange(1, 4)); // 1-3
  const genome = [];
  // Body genes
  genome.push(randomInRange(...GENE_RANGES.bodyWidth));
  genome.push(randomInRange(...GENE_RANGES.bodyHeight));
  genome.push(numPairs);
  genome.push(randomInRange(...GENE_RANGES.globalSpeed));

  for (let i = 0; i < numPairs; i++) {
    genome.push(randomInRange(...GENE_RANGES.hipOffset));
    genome.push(randomInRange(...GENE_RANGES.upperLen));
    genome.push(randomInRange(...GENE_RANGES.lowerLen));
    genome.push(randomInRange(...GENE_RANGES.crankLen));
    genome.push(randomInRange(...GENE_RANGES.crankOffset));
    genome.push(randomInRange(...GENE_RANGES.phaseOffset));
    genome.push(randomInRange(...GENE_RANGES.hipAngle));
    genome.push(randomInRange(...GENE_RANGES.angularSpeed));
  }
  return genome;
}

function decodeGenome(genome) {
  const body = {
    width: genome[0],
    height: genome[1],
    numLegPairs: Math.round(genome[2]),
    globalSpeed: genome[3]
  };
  const legs = [];
  for (let i = 0; i < body.numLegPairs; i++) {
    const base = BODY_GENES + i * GENES_PER_LEG;
    legs.push({
      hipOffset: genome[base],
      upperLen: genome[base + 1],
      lowerLen: genome[base + 2],
      crankLen: genome[base + 3],
      crankOffset: genome[base + 4],
      phaseOffset: genome[base + 5],
      hipAngle: genome[base + 6],
      angularSpeed: genome[base + 7]
    });
  }
  return { body, legs };
}

// ----- GA Operations -----
function crossover(g1, g2) {
  // Ensure same number of leg pairs for crossover
  const np1 = Math.round(g1[2]);
  const np2 = Math.round(g2[2]);

  // Use the number of leg pairs from one parent
  const numPairs = Math.random() < 0.5 ? np1 : np2;
  const child = [];

  // Body genes: uniform crossover
  for (let i = 0; i < BODY_GENES; i++) {
    child.push(Math.random() < 0.5 ? g1[i] : (i < g2.length ? g2[i] : g1[i]));
  }
  child[2] = numPairs; // enforce

  // Leg genes
  for (let p = 0; p < numPairs; p++) {
    const base1 = BODY_GENES + p * GENES_PER_LEG;
    const base2 = BODY_GENES + p * GENES_PER_LEG;
    for (let j = 0; j < GENES_PER_LEG; j++) {
      const v1 = base1 + j < g1.length ? g1[base1 + j] : randomGeneValue(j);
      const v2 = base2 + j < g2.length ? g2[base2 + j] : randomGeneValue(j);
      // Blend crossover
      const alpha = Math.random();
      child.push(v1 * alpha + v2 * (1 - alpha));
    }
  }

  return child;
}

function randomGeneValue(legGeneIdx) {
  const keys = ['hipOffset','upperLen','lowerLen','crankLen','crankOffset','phaseOffset','hipAngle','angularSpeed'];
  const range = GENE_RANGES[keys[legGeneIdx]];
  return randomInRange(range[0], range[1]);
}

function mutate(genome, rate, strength) {
  const result = [...genome];
  const geneRangeKeys = ['bodyWidth','bodyHeight','numLegPairs','globalSpeed',
    'hipOffset','upperLen','lowerLen','crankLen','crankOffset','phaseOffset','hipAngle','angularSpeed'];

  for (let i = 0; i < result.length; i++) {
    if (Math.random() < rate) {
      let keyIdx;
      if (i < BODY_GENES) {
        keyIdx = i;
      } else {
        keyIdx = BODY_GENES + ((i - BODY_GENES) % GENES_PER_LEG);
      }
      const key = geneRangeKeys[Math.min(keyIdx, geneRangeKeys.length - 1)];
      const range = GENE_RANGES[key] || [0, 5];
      const span = range[1] - range[0];
      const delta = (Math.random() * 2 - 1) * span * strength;
      result[i] = clamp(result[i] + delta, range[0], range[1]);

      // Keep numLegPairs integer
      if (i === 2) result[i] = Math.round(clamp(result[i], 1, 3));
    }
  }
  return result;
}

function tournamentSelect(population, fitnesses, k = 3) {
  let bestIdx = Math.floor(Math.random() * population.length);
  for (let i = 1; i < k; i++) {
    const idx = Math.floor(Math.random() * population.length);
    if (fitnesses[idx] > fitnesses[bestIdx]) bestIdx = idx;
  }
  return population[bestIdx];
}

// ============================================================
//  BABYLON.JS SCENE
// ============================================================

const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true });
const scene = new BABYLON.Scene(engine);

scene.clearColor = new BABYLON.Color4(0.06, 0.06, 0.12, 1);
scene.ambientColor = new BABYLON.Color3(0.15, 0.15, 0.2);

// Camera
const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 4, Math.PI / 3.5, 18, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 5;
camera.upperRadiusLimit = 50;
camera.wheelPrecision = 20;

// Lights
const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0.3), scene);
hemiLight.intensity = 0.7;
hemiLight.diffuse = new BABYLON.Color3(0.9, 0.9, 1);
hemiLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.15);

const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, 1), scene);
dirLight.intensity = 0.5;
dirLight.diffuse = new BABYLON.Color3(1, 0.95, 0.8);

// Ground
const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 200, height: 40 }, scene);
const groundMat = new BABYLON.StandardMaterial("gmat", scene);
groundMat.diffuseColor = new BABYLON.Color3(0.12, 0.14, 0.18);
groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.08);
ground.material = groundMat;
ground.position.y = -0.01;

// Grid lines on ground
const gridLines = [];
for (let x = -100; x <= 100; x += 5) {
  const line = BABYLON.MeshBuilder.CreateLines("gl", {
    points: [new BABYLON.Vector3(x, 0, -20), new BABYLON.Vector3(x, 0, 20)]
  }, scene);
  line.color = new BABYLON.Color3(0.15, 0.18, 0.25);
  gridLines.push(line);
}

// Materials
const bodyMat = new BABYLON.StandardMaterial("bodyMat", scene);
bodyMat.diffuseColor = new BABYLON.Color3(0.3, 0.5, 0.8);
bodyMat.specularColor = new BABYLON.Color3(0.2, 0.3, 0.5);

const legMat = new BABYLON.StandardMaterial("legMat", scene);
legMat.diffuseColor = new BABYLON.Color3(0.8, 0.6, 0.2);
legMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.2);

const jointMat = new BABYLON.StandardMaterial("jointMat", scene);
jointMat.diffuseColor = new BABYLON.Color3(0.9, 0.3, 0.3);

const bestMat = new BABYLON.StandardMaterial("bestMat", scene);
bestMat.diffuseColor = new BABYLON.Color3(0.2, 0.9, 0.4);
bestMat.specularColor = new BABYLON.Color3(0.3, 0.5, 0.3);
bestMat.emissiveColor = new BABYLON.Color3(0.05, 0.2, 0.05);

const bestLegMat = new BABYLON.StandardMaterial("bestLegMat", scene);
bestLegMat.diffuseColor = new BABYLON.Color3(0.3, 0.85, 0.5);

// ============================================================
//  CREATURE BUILDER & SIMULATOR
// ============================================================

class Creature {
  constructor(genome, isBest = false) {
    this.genome = genome;
    this.decoded = decodeGenome(genome);
    this.meshes = [];
    this.fitness = 0;
    this.bodyX = 0;
    this.bodyY = 0;
    this.startX = 0;
    this.isBest = isBest;
    this.simTime = 0;
    this.fallen = false;
    this.bodyVY = 0;
    this.bodyVX = 0;
    this.onGround = false;
    this.groundContacts = 0;
    this.totalContacts = 0;
    this.contactSamples = 0;
    this.maxHeight = 0;
    this.minHeight = Infinity;

    this.buildMeshes();
  }

  buildMeshes() {
    const d = this.decoded;
    const bw = d.body.width;
    const bh = d.body.height;

    // Body box
    const body = BABYLON.MeshBuilder.CreateBox("body", {
      width: bw, height: bh, depth: 0.5
    }, scene);
    body.material = this.isBest ? bestMat : bodyMat;
    this.bodyMesh = body;
    this.meshes.push(body);

    // Build legs
    this.legData = [];

    for (let pair = 0; pair < d.legs.length; pair++) {
      const leg = d.legs[pair];

      for (let side = -1; side <= 1; side += 2) {
        const zOff = side * 0.35;

        // Upper leg
        const upper = BABYLON.MeshBuilder.CreateCylinder("upper", {
          height: leg.upperLen, diameter: 0.12, tessellation: 8
        }, scene);
        upper.material = this.isBest ? bestLegMat : legMat;
        this.meshes.push(upper);

        // Lower leg
        const lower = BABYLON.MeshBuilder.CreateCylinder("lower", {
          height: leg.lowerLen, diameter: 0.1, tessellation: 8
        }, scene);
        lower.material = this.isBest ? bestLegMat : legMat;
        this.meshes.push(lower);

        // Knee joint
        const knee = BABYLON.MeshBuilder.CreateSphere("knee", { diameter: 0.18 }, scene);
        knee.material = jointMat;
        this.meshes.push(knee);

        // Foot
        const foot = BABYLON.MeshBuilder.CreateSphere("foot", { diameter: 0.15 }, scene);
        foot.material = jointMat;
        this.meshes.push(foot);

        // Crank arm (small cylinder showing the drive)
        const crank = BABYLON.MeshBuilder.CreateCylinder("crank", {
          height: leg.crankLen, diameter: 0.08, tessellation: 6
        }, scene);
        crank.material = jointMat;
        this.meshes.push(crank);

        this.legData.push({
          pair, side, leg, zOff,
          upper, lower, knee, foot, crank
        });
      }
    }
  }

  // Compute leg positions at time t using Strandbeest-inspired kinematics
  computeLegPose(legInfo, time) {
    const d = this.decoded;
    const leg = legInfo.leg;
    const bw = d.body.width;

    // Hip position relative to body center
    const hipX = this.bodyX + (legInfo.pair - (d.legs.length - 1) / 2) * (bw / Math.max(1, d.legs.length - 0.5)) * 0.8;
    const hipY = this.bodyY;

    // Crank rotation drives the leg
    const phase = leg.phaseOffset + (legInfo.side > 0 ? Math.PI : 0); // opposite legs are 180° out of phase
    const crankAngle = time * d.body.globalSpeed * leg.angularSpeed + phase;

    // Crank endpoint
    const crankX = hipX + leg.crankLen * Math.cos(crankAngle);
    const crankY = hipY + leg.crankOffset + leg.crankLen * Math.sin(crankAngle);

    // Use crank to drive upper leg angle
    // The hip angle is influenced by the crank
    const dx = crankX - hipX;
    const dy = crankY - hipY;
    const hipTocrankAngle = Math.atan2(dy, dx);

    // Upper leg hangs from hip, driven by crank
    const upperAngle = hipTocrankAngle + leg.hipAngle - Math.PI / 2;

    // Upper leg endpoint (knee)
    const kneeX = hipX + leg.upperLen * Math.cos(upperAngle + Math.PI / 2);
    const kneeY = hipY + leg.upperLen * Math.sin(upperAngle + Math.PI / 2);

    // Lower leg: simple pendulum-like, tries to reach ground
    // Use IK-like approach: foot wants to be on ground
    const targetFootY = 0; // ground level
    const dxKnee = 0;
    const dyKnee = kneeY - targetFootY;
    let lowerAngle;

    if (dyKnee >= leg.lowerLen) {
      // Knee is high enough, lower leg points straight down
      lowerAngle = -Math.PI / 2;
    } else if (dyKnee <= 0) {
      // Knee is below ground, leg points up
      lowerAngle = Math.PI / 2;
    } else {
      // Intermediate: angle to reach ground
      const cosA = clamp(dyKnee / leg.lowerLen, -1, 1);
      lowerAngle = -Math.acos(cosA) + (Math.sin(crankAngle * 0.5) * 0.3);
    }

    // Strandbeest-style: add linkage effect from crank
    lowerAngle += Math.sin(crankAngle + leg.phaseOffset) * 0.4;

    const footX = kneeX + leg.lowerLen * Math.cos(lowerAngle);
    const footY = kneeY + leg.lowerLen * Math.sin(lowerAngle);

    return {
      hipX, hipY,
      kneeX, kneeY,
      footX, footY,
      crankX, crankY,
      upperAngle, lowerAngle,
      crankAngle
    };
  }

  simulate(dt) {
    if (this.fallen) return;

    this.simTime += dt;
    const d = this.decoded;

    // Physics: simple body dynamics
    const gravity = -9.8;

    // Count ground contacts and compute forces
    let contactForceY = 0;
    let contactForceX = 0;
    let numContacts = 0;

    for (const ld of this.legData) {
      const pose = this.computeLegPose(ld, this.simTime);

      // Check if foot is on/below ground
      if (pose.footY <= 0.05) {
        numContacts++;
        // Ground reaction: push body up
        const penetration = Math.max(0, 0.05 - pose.footY);
        contactForceY += penetration * 200 + 5; // spring + support

        // Forward propulsion from foot movement
        // Compute foot velocity (approximate)
        const dt2 = 0.001;
        const pose2 = this.computeLegPose(ld, this.simTime + dt2);
        const footVX = (pose2.footX - pose.footX) / dt2;

        // Friction: if foot is on ground and moving backward, it pushes body forward
        if (footVX < 0) {
          contactForceX += -footVX * 0.5; // friction-based propulsion
        }
      }
    }

    // Update body velocity
    this.bodyVY += gravity * dt;
    this.bodyVY += contactForceY * dt / Math.max(1, d.body.width); // mass ~proportional to width
    this.bodyVX += contactForceX * dt;

    // Damping
    this.bodyVX *= 0.995;
    this.bodyVY *= 0.98;

    // Update position
    this.bodyX += this.bodyVX * dt;
    this.bodyY += this.bodyVY * dt;

    // Ground collision for body
    const minBodyY = d.body.height / 2 + 0.1;
    if (this.bodyY < minBodyY) {
      this.bodyY = minBodyY;
      this.bodyVY = Math.max(0, this.bodyVY);
    }

    // Stability tracking
    this.maxHeight = Math.max(this.maxHeight, this.bodyY);
    this.minHeight = Math.min(this.minHeight, this.bodyY);

    this.contactSamples++;
    this.totalContacts += numContacts;

    // Fall detection
    if (this.bodyY < d.body.height * 0.3 && this.simTime > 0.5) {
      this.fallen = true;
    }
    if (this.bodyY > 10) { // launched into space
      this.fallen = true;
    }

    // Update mesh positions
    this.updateMeshes();
  }

  updateMeshes() {
    const d = this.decoded;
    const z = 0;

    // Body
    this.bodyMesh.position.set(this.bodyX, this.bodyY, z);

    // Legs
    for (const ld of this.legData) {
      const pose = this.computeLegPose(ld, this.simTime);

      // Upper leg cylinder
      const umx = (pose.hipX + pose.kneeX) / 2;
      const umy = (pose.hipY + pose.kneeY) / 2;
      ld.upper.position.set(umx, umy, z + ld.zOff);
      ld.upper.rotation.z = pose.upperAngle;

      // Lower leg
      const lmx = (pose.kneeX + pose.footX) / 2;
      const lmy = (pose.kneeY + pose.footY) / 2;
      ld.lower.position.set(lmx, lmy, z + ld.zOff);
      ld.lower.rotation.z = pose.lowerAngle;

      // Knee joint
      ld.knee.position.set(pose.kneeX, pose.kneeY, z + ld.zOff);

      // Foot
      ld.foot.position.set(pose.footX, Math.max(0.05, pose.footY), z + ld.zOff);

      // Crank
      const cmx = (pose.hipX + pose.crankX) / 2;
      const cmy = (pose.hipY + ld.leg.crankOffset + pose.crankY) / 2;
      ld.crank.position.set(cmx, cmy, z + ld.zOff * 0.5);
      ld.crank.rotation.z = pose.crankAngle;
    }
  }

  evaluateFitness(duration) {
    const distance = this.bodyX - this.startX;
    const avgContacts = this.contactSamples > 0 ? this.totalContacts / this.contactSamples : 0;
    const heightStability = 1 / (1 + Math.abs(this.maxHeight - this.minHeight));

    // Fitness: primarily distance, with bonuses for stability
    let fitness = distance;

    // Bonus for staying upright
    if (!this.fallen) {
      fitness += 1.0;
    } else {
      fitness *= 0.3; // heavy penalty for falling
    }

    // Bonus for ground contact (walking, not flying)
    fitness += avgContacts * 0.5;

    // Bonus for stability
    fitness += heightStability * 0.5;

    // Penalty for going backward
    if (distance < 0) fitness = distance * 0.1;

    this.fitness = fitness;
    return fitness;
  }

  dispose() {
    for (const m of this.meshes) {
      m.dispose();
    }
    this.meshes = [];
    this.legData = [];
  }
}

// ============================================================
//  GA CONTROLLER
// ============================================================

let population = [];
let fitnesses = [];
let generation = 0;
let totalEvaluated = 0;
let evolving = false;
let currentCreature = null;
let currentCreatureIdx = 0;
let simTimer = 0;
let bestGenome = null;
let bestFitness = -Infinity;
let allTimeBestGenome = null;
let allTimeBestFitness = -Infinity;
let replayingBest = false;

const fitnessHistory = { best: [], avg: [] };

function getGA() {
  return {
    popSize: parseInt(document.getElementById('sPop').value),
    mutRate: parseInt(document.getElementById('sMut').value) / 100,
    mutStr: parseInt(document.getElementById('sMutStr').value) / 100,
    duration: parseFloat(document.getElementById('sDur').value),
    elitism: parseInt(document.getElementById('sElite').value)
  };
}

function initPopulation() {
  const ga = getGA();
  population = [];
  fitnesses = [];
  for (let i = 0; i < ga.popSize; i++) {
    population.push(randomGenome());
    fitnesses.push(0);
  }
  generation = 0;
  totalEvaluated = 0;
  bestFitness = -Infinity;
  bestGenome = null;
  fitnessHistory.best.length = 0;
  fitnessHistory.avg.length = 0;
}

function startEvaluatingIndividual(idx) {
  if (currentCreature) {
    currentCreature.dispose();
    currentCreature = null;
  }

  currentCreatureIdx = idx;
  const genome = population[idx];
  currentCreature = new Creature(genome);

  // Set initial position
  const d = currentCreature.decoded;
  currentCreature.bodyX = 0;
  currentCreature.bodyY = d.body.height / 2 + d.legs[0].upperLen * 0.5 + 1.0;
  currentCreature.startX = currentCreature.bodyX;

  simTimer = 0;

  // Set camera to follow
  camera.target = new BABYLON.Vector3(0, 2, 0);
}

function nextGeneration() {
  const ga = getGA();

  // Record stats
  let best = -Infinity, sum = 0;
  let bestIdx = 0;
  for (let i = 0; i < fitnesses.length; i++) {
    sum += fitnesses[i];
    if (fitnesses[i] > best) {
      best = fitnesses[i];
      bestIdx = i;
    }
  }
  const avg = sum / fitnesses.length;

  if (best > allTimeBestFitness) {
    allTimeBestFitness = best;
    allTimeBestGenome = [...population[bestIdx]];
  }
  bestFitness = best;
  bestGenome = [...population[bestIdx]];

  fitnessHistory.best.push(best);
  fitnessHistory.avg.push(avg);
  if (fitnessHistory.best.length > 100) {
    fitnessHistory.best.shift();
    fitnessHistory.avg.shift();
  }

  logMsg(`Gen ${generation}: Best=${best.toFixed(2)}, Avg=${avg.toFixed(2)}`);

  // Create next generation
  const newPop = [];

  // Elitism
  const sorted = population.map((g, i) => ({ g, f: fitnesses[i] }))
    .sort((a, b) => b.f - a.f);

  for (let i = 0; i < Math.min(ga.elitism, sorted.length); i++) {
    newPop.push([...sorted[i].g]);
  }

  // Fill rest with crossover + mutation
  while (newPop.length < ga.popSize) {
    const p1 = tournamentSelect(population, fitnesses);
    const p2 = tournamentSelect(population, fitnesses);
    let child = crossover(p1, p2);
    child = mutate(child, ga.mutRate, ga.mutStr);
    newPop.push(child);
  }

  population = newPop;
  fitnesses = new Array(population.length).fill(0);
  generation++;

  updateStats();
  drawFitnessChart();
}

function toggleEvolution() {
  evolving = !evolving;
  document.getElementById('btnStart').textContent = evolving ? '⏸ Pause' : '▶ Start';
  document.getElementById('btnStart').classList.toggle('primary', !evolving);

  if (evolving && population.length === 0) {
    initPopulation();
    currentCreatureIdx = 0;
    startEvaluatingIndividual(0);
  } else if (evolving && !currentCreature) {
    currentCreatureIdx = 0;
    startEvaluatingIndividual(0);
  }

  replayingBest = false;
}

function resetEvolution() {
  evolving = false;
  replayingBest = false;
  document.getElementById('btnStart').textContent = '▶ Start';
  document.getElementById('btnStart').classList.toggle('primary', true);

  if (currentCreature) {
    currentCreature.dispose();
    currentCreature = null;
  }

  initPopulation();
  allTimeBestFitness = -Infinity;
  allTimeBestGenome = null;
  fitnessHistory.best.length = 0;
  fitnessHistory.avg.length = 0;

  updateStats();
  drawFitnessChart();
  document.getElementById('log').innerHTML = '';
  logMsg('Reset. Click Start to begin evolution.');
}

function replayBest() {
  if (!allTimeBestGenome) {
    logMsg('No best genome yet. Run evolution first.');
    return;
  }

  evolving = false;
  replayingBest = true;
  document.getElementById('btnStart').textContent = '▶ Start';

  if (currentCreature) {
    currentCreature.dispose();
  }

  currentCreature = new Creature(allTimeBestGenome, true);
  const d = currentCreature.decoded;
  currentCreature.bodyX = 0;
  currentCreature.bodyY = d.body.height / 2 + d.legs[0].upperLen * 0.5 + 1.0;
  currentCreature.startX = 0;
  simTimer = 0;

  logMsg(`Replaying all-time best (fitness: ${allTimeBestFitness.toFixed(2)})`);
}

// ============================================================
//  UI HELPERS
// ============================================================

function updateStats() {
  document.getElementById('statGen').textContent = generation;
  document.getElementById('statEval').textContent = totalEvaluated;
  document.getElementById('statBest').textContent = allTimeBestFitness > -Infinity ? allTimeBestFitness.toFixed(2) : '—';

  const avg = fitnesses.length > 0 ? (fitnesses.reduce((a,b) => a+b, 0) / fitnesses.length) : 0;
  document.getElementById('statAvg').textContent = avg.toFixed(2);
}

function drawFitnessChart() {
  const canvas = document.getElementById('fitnessChart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;

  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, w, h);

  if (fitnessHistory.best.length < 2) return;

  let minV = Infinity, maxV = -Infinity;
  for (const v of fitnessHistory.best) { minV = Math.min(minV, v); maxV = Math.max(maxV, v); }
  for (const v of fitnessHistory.avg) { minV = Math.min(minV, v); maxV = Math.max(maxV, v); }
  const range = Math.max(maxV - minV, 1);
  minV -= range * 0.1;
  maxV += range * 0.1;

  const pad = 4;
  const pw = w - pad * 2;
  const ph = h - pad * 2;

  const drawLine = (data, color) => {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < data.length; i++) {
      const x = pad + (i / (data.length - 1)) * pw;
      const y = pad + ph - ((data[i] - minV) / (maxV - minV)) * ph;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  };

  drawLine(fitnessHistory.avg, '#58a6ff');
  drawLine(fitnessHistory.best, '#7ee787');
}

function logMsg(msg) {
  const log = document.getElementById('log');
  log.innerHTML += msg + '<br>';
  log.scrollTop = log.scrollHeight;
}

// Bind sliders
document.querySelectorAll('#panel input[type=range]').forEach(s => {
  const vid = 'v' + s.id.slice(1);
  const vEl = document.getElementById(vid);
  if (!vEl) return;
  const update = () => {
    const v = parseFloat(s.value);
    if (s.id === 'sMut') vEl.textContent = v + '%';
    else if (s.id === 'sMutStr') vEl.textContent = v + '%';
    else if (s.id === 'sDur') vEl.textContent = v.toFixed(1) + 's';
    else vEl.textContent = s.id === 'sPop' || s.id === 'sElite' ? Math.round(v) : v;
  };
  s.addEventListener('input', update);
  update();
});

// ============================================================
//  MAIN LOOP
// ============================================================

let lastTime = performance.now();

scene.registerBeforeRender(() => {
  const now = performance.now();
  const realDt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const ga = getGA();
  const simDt = 1 / 60;

  if (replayingBest && currentCreature) {
    // Replay mode: continuous simulation
    for (let i = 0; i < 3; i++) {
      currentCreature.simulate(simDt);
    }
    simTimer += realDt;

    // Camera follows
    camera.target.x = currentCreature.bodyX;
    camera.target.y = Math.max(2, currentCreature.bodyY);

    // Loop replay
    if (simTimer > ga.duration * 3 || currentCreature.fallen) {
      // Restart replay
      currentCreature.dispose();
      currentCreature = new Creature(allTimeBestGenome, true);
      const d = currentCreature.decoded;
      currentCreature.bodyX = 0;
      currentCreature.bodyY = d.body.height / 2 + d.legs[0].upperLen * 0.5 + 1.0;
      currentCreature.startX = 0;
      simTimer = 0;
    }
    return;
  }

  if (!evolving || !currentCreature) return;

  // Simulate current creature
  const stepsPerFrame = 4; // speed up evaluation
  for (let i = 0; i < stepsPerFrame; i++) {
    currentCreature.simulate(simDt);
  }
  simTimer += simDt * stepsPerFrame;

  // Camera follows
  camera.target.x = currentCreature.bodyX;
  camera.target.y = Math.max(2, currentCreature.bodyY);

  // Check if evaluation is done
  if (simTimer >= ga.duration || currentCreature.fallen) {
    // Record fitness
    const fitness = currentCreature.evaluateFitness(ga.duration);
    fitnesses[currentCreatureIdx] = fitness;
    totalEvaluated++;

    currentCreature.dispose();
    currentCreature = null;

    // Move to next individual or next generation
    currentCreatureIdx++;
    if (currentCreatureIdx >= population.length) {
      // Generation complete
      nextGeneration();
      currentCreatureIdx = 0;
    }

    // Start evaluating next
    startEvaluatingIndividual(currentCreatureIdx);
    updateStats();
  }
});

engine.runRenderLoop(() => scene.render());
window.addEventListener('resize', () => engine.resize());

// Initial state
initPopulation();
logMsg('Ready. Click "Start" to begin evolving walking creatures.');
logMsg('Each creature is simulated and scored on forward distance + stability.');
updateStats();
</script>
