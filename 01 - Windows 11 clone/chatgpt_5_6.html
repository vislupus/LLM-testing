<title>Windows 11 Desktop — Browser Edition</title>
<style>

button,input,select,textarea{font:inherit}
button{color:inherit}

  background-size:cover;background-position:center;user-select:none;overflow:hidden;
}
#desktop.night-light::after{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(255,165,72,.16);mix-blend-mode:multiply;z-index:9998}
.desktop-icons{position:absolute;left:10px;top:10px;bottom:62px;width:94px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px 8px;z-index:2}
.desktop-icon{width:84px;height:88px;padding:5px;border:1px solid transparent;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;color:white;text-shadow:0 1px 3px rgba(0,0,0,.8);font-size:12px;text-align:center;line-height:16px;cursor:default}
.desktop-icon:hover,.desktop-icon.selected{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.35)}
.desktop-icon .app-icon{width:48px;height:48px;margin:1px 0 4px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28))}
.app-icon svg{width:100%;height:100%;display:block}
#windowLayer{position:absolute;inset:0 0 var(--taskbar-h);z-index:10;pointer-events:none}
.window{position:absolute;min-width:340px;min-height:220px;width:780px;height:560px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.58);border-radius:9px;box-shadow:var(--shadow);overflow:hidden;resize:both;pointer-events:auto;display:flex;flex-direction:column;animation:windowIn .18s ease-out;backdrop-filter:blur(30px) saturate(1.25);-webkit-backdrop-filter:blur(30px) saturate(1.25)}
.window.hidden{display:none}.window.maximized{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none}
.window.active{border-color:rgba(255,255,255,.82)}
@keyframes windowIn{from{opacity:0;transform:scale(.96) translateY(9px)}to{opacity:1;transform:none}}
.titlebar{height:42px;flex:0 0 42px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.08));cursor:default}
.title-app-icon{width:20px;height:20px;margin:0 9px 0 13px}.title-text{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.window-controls{height:100%;display:flex}.window-control{width:46px;height:100%;border:0;background:transparent;display:grid;place-items:center;font-size:16px}.window-control:hover{background:rgba(0,0,0,.08)}.window-control.close:hover{background:#c42b1c;color:white}.window-control svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.3}
.window-content{position:relative;flex:1;min-height:0;overflow:hidden;background:#f7f8fa;color:#172033}.dark .window-content{background:#20242d;color:#f4f6fb}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:var(--taskbar-h);z-index:10000;background:rgba(244,248,253,.74);border-top:1px solid rgba(255,255,255,.7);backdrop-filter:blur(28px) saturate(1.35);-webkit-backdrop-filter:blur(28px) saturate(1.35);box-shadow:0 -1px 12px rgba(28,60,105,.08);display:flex;align-items:center;justify-content:center}
.dark .taskbar{background:rgba(25,29,38,.82);border-top-color:rgba(255,255,255,.08)}
.task-center{height:100%;display:flex;align-items:center;gap:3px}.task-button{position:relative;width:42px;height:42px;border:0;border-radius:5px;background:transparent;padding:8px;display:grid;place-items:center}.task-button:hover{background:rgba(255,255,255,.62)}.dark .task-button:hover{background:rgba(255,255,255,.10)}.task-button .app-icon{width:26px;height:26px}.task-button.open::after{content:"";position:absolute;bottom:2px;left:15px;right:15px;height:3px;border-radius:3px;background:#7b8795}.task-button.active::after{left:11px;right:11px;background:#1473e6}
.task-right{position:absolute;right:5px;height:100%;display:flex;align-items:center}.tray-button{height:40px;border:0;background:transparent;border-radius:5px;padding:0 8px;display:flex;align-items:center;gap:7px}.tray-button:hover{background:rgba(255,255,255,.58)}.dark .tray-button:hover{background:rgba(255,255,255,.1)}.tray-icons{display:flex;gap:5px;align-items:center}.tray-icons svg{width:15px;height:15px;fill:currentColor}.clock{font-size:11px;line-height:14px;text-align:right;min-width:68px}.show-desktop{width:8px;height:100%;border:0;border-left:1px solid rgba(90,105,125,.25);background:transparent;margin-left:3px}
.start-panel,.quick-panel,.calendar-panel{position:absolute;z-index:9999;background:var(--glass-strong);border:1px solid rgba(255,255,255,.62);box-shadow:var(--shadow);backdrop-filter:blur(35px) saturate(1.3);-webkit-backdrop-filter:blur(35px) saturate(1.3);color:var(--ink);animation:panelIn .18s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.start-panel{left:50%;bottom:58px;transform:translateX(-50%);width:min(640px,calc(100vw - 20px));height:min(680px,calc(100vh - 78px));border-radius:9px;padding:28px 34px 14px;display:none;flex-direction:column}.start-panel.show{display:flex}
.start-search{height:34px;border-radius:5px;border:0;border-bottom:2px solid #196ecf;background:rgba(255,255,255,.88);box-shadow:0 2px 7px rgba(0,0,0,.08);padding:0 14px 0 39px;width:100%;outline:none;color:#1d2635}.dark .start-search{background:#292f3a;color:white}.start-search-wrap{position:relative}.start-search-wrap svg{position:absolute;width:16px;left:13px;top:9px;stroke:#586579;fill:none;stroke-width:2}
.start-section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 4px 12px;font-size:13px;font-weight:650}.all-apps{font-size:11px;border:0;background:rgba(0,0,0,.06);padding:5px 9px;border-radius:4px}.start-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 5px}.start-app{border:0;background:transparent;border-radius:5px;padding:8px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;min-width:0}.start-app:hover{background:rgba(255,255,255,.65)}.dark .start-app:hover{background:rgba(255,255,255,.09)}.start-app .app-icon{width:32px;height:32px}.start-recommended{display:grid;grid-template-columns:1fr 1fr;gap:5px}.recommended{border:0;background:transparent;border-radius:5px;padding:9px;display:flex;align-items:center;gap:11px;text-align:left}.recommended:hover{background:rgba(255,255,255,.6)}.recommended .app-icon{width:30px;height:30px}.rec-name{font-size:12px}.rec-sub{font-size:10px;color:var(--muted);margin-top:2px}.start-footer{margin:22px -34px -14px;padding:10px 44px;background:rgba(255,255,255,.35);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;margin-top:auto}.user-chip{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#b8d9f7,#6d8daf);color:white;font-weight:700}.power{width:34px;height:34px;border:0;border-radius:5px;background:transparent}.power:hover{background:rgba(255,255,255,.55)}
.quick-panel{right:10px;bottom:58px;width:355px;border-radius:9px;padding:18px;display:none}.quick-panel.show{display:block}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick-tile{border:0;border-radius:6px;background:rgba(255,255,255,.55);padding:12px 7px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px}.dark .quick-tile{background:rgba(255,255,255,.08)}.quick-tile.active{background:#086cc9;color:white}.quick-tile svg{width:21px;height:21px;fill:currentColor}.slider-row{margin-top:18px;display:grid;grid-template-columns:22px 1fr;align-items:center;gap:10px}.slider-row input{width:100%;accent-color:#0878d1}
.calendar-panel{right:10px;bottom:58px;width:340px;border-radius:9px;padding:19px;display:none}.calendar-panel.show{display:block}.calendar-big-time{font-size:24px;font-weight:400}.calendar-date-label{font-size:12px;color:#0b65b8;margin-top:3px}.month-head{font-size:13px;font-weight:650;margin:22px 0 12px;display:flex;justify-content:space-between}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;text-align:center}.calendar-grid div{height:32px;display:grid;place-items:center;border-radius:50%}.calendar-grid .weekday{height:20px;color:var(--muted);font-size:10px}.calendar-grid .today{background:#0878d1;color:white}.calendar-grid .other{color:#a0a7b1}
.context-menu{position:absolute;z-index:10001;width:220px;padding:5px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.65);box-shadow:0 12px 35px rgba(0,0,0,.24);border-radius:7px;display:none;backdrop-filter:blur(26px)}.context-menu.show{display:block}.context-item{height:32px;border-radius:4px;padding:0 10px;display:flex;align-items:center;gap:10px;font-size:12px}.context-item:hover{background:rgba(255,255,255,.7)}.dark .context-item:hover{background:rgba(255,255,255,.1)}.context-item .ci{width:18px;text-align:center}.context-sep{height:1px;background:var(--line);margin:4px}
.toast-area{position:absolute;right:14px;bottom:62px;z-index:20000;display:flex;flex-direction:column;gap:8px;pointer-events:none}.toast{width:min(330px,calc(100vw - 28px));padding:12px 14px;border-radius:7px;background:rgba(27,35,50,.92);color:white;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:12px;animation:toastIn .22s ease-out}.toast b{display:block;margin-bottom:3px}@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.lightbox{position:absolute;inset:0;z-index:20002;background:rgba(7,12,22,.78);display:none;align-items:center;justify-content:center;padding:28px;backdrop-filter:blur(12px)}.lightbox.show{display:flex}.lightbox img{max-width:92%;max-height:88%;object-fit:contain;border-radius:8px;box-shadow:0 25px 80px rgba(0,0,0,.55)}.lightbox-close{position:absolute;right:25px;top:20px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:white;font-size:25px}
/* Shared app styling */

.notepad-app{height:100%;display:flex;flex-direction:column;background:white}.notepad-menu{height:32px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid #e0e3e7;gap:2px}.notepad-menu button{border:0;background:transparent;border-radius:4px;padding:5px 9px;font-size:12px}.notepad-menu button:hover{background:#edf0f4}.notepad-text{flex:1;width:100%;resize:none;border:0;outline:none;padding:13px;background:white;color:#111;font:15px/1.48 Consolas,"Courier New",monospace;user-select:text}.notepad-text.nowrap{white-space:pre;overflow:auto}.dark .notepad-app,.dark .notepad-text{background:#1e222a;color:#f4f5f7}.dark .notepad-menu{border-color:#3c424e}.dark .notepad-menu button:hover{background:#343a46}
/* Calculator */
.calc-app{height:100%;display:flex;flex-direction:column;background:#f3f5f7;padding:8px}.dark .calc-app{background:#20242d}.calc-type{font-size:19px;font-weight:600;padding:8px}.calc-history{height:22px;text-align:right;color:#6d7480;font-size:12px;padding:0 8px}.calc-display{height:68px;text-align:right;font-size:38px;font-weight:600;padding:4px 8px;overflow:hidden;white-space:nowrap}.calc-memory{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:3px}.calc-memory button{border:0;background:transparent;height:28px;font-size:11px}.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:3px}.calc-key{border:1px solid rgba(0,0,0,.04);border-radius:4px;background:#fcfcfd;font-size:17px}.calc-key:hover{background:#e6e9ed}.calc-key.op{background:#f4f5f7}.calc-key.eq{background:#086cc9;color:white}.dark .calc-key{background:#323844;border-color:#20242d}.dark .calc-key:hover{background:#3c4452}.dark .calc-key.op{background:#292f39}
/* Paint */
.paint-app{height:100%;display:flex;flex-direction:column;background:#e7e9ed}.paint-toolbar{min-height:74px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:white;border-bottom:1px solid #d6d9df;overflow-x:auto}.dark .paint-toolbar{background:#282d36;border-color:#3c424e}.paint-group{display:flex;align-items:center;gap:5px;padding-right:9px;border-right:1px solid #d8dce1}.paint-group:last-child{border:0}.paint-tool{width:39px;height:39px;border:1px solid transparent;background:transparent;border-radius:5px;font-size:18px}.paint-tool:hover,.paint-tool.active{background:#e6f1fd;border-color:#9fc8f2}.paint-color{width:29px;height:29px;border:2px solid white;outline:1px solid #b5bbc4;border-radius:4px;padding:0}.paint-size{width:95px}.paint-canvas-wrap{flex:1;overflow:auto;padding:22px;background:#cfd2d8}.paint-canvas{display:block;background:white;box-shadow:0 1px 5px rgba(0,0,0,.25);touch-action:none;cursor:crosshair;max-width:none}
/* Explorer */
.explorer-app{height:100%;display:flex;flex-direction:column;background:white}.dark .explorer-app{background:#20242d}.explorer-command{height:47px;display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid #e0e3e8}.explorer-command button{height:34px;border:0;border-radius:5px;background:transparent;padding:0 10px;display:flex;align-items:center;gap:6px}.explorer-command button:hover{background:#edf1f5}.dark .explorer-command button:hover{background:#343b47}.explorer-nav{height:42px;display:flex;align-items:center;gap:5px;padding:5px 10px;border-bottom:1px solid #e0e3e8}.nav-arrow{width:31px;height:31px;border:0;border-radius:5px;background:transparent}.nav-arrow:hover{background:#edf1f5}.explorer-address{flex:1;height:31px;border:1px solid #d2d7df;border-radius:5px;padding:0 10px;background:white;color:#1d2635}.dark .explorer-address{background:#292f39;color:white;border-color:#464e5c}.explorer-search{width:220px;height:31px;border:1px solid #d2d7df;border-radius:5px;padding:0 10px}.explorer-main{flex:1;display:flex;min-height:0}.explorer-side{width:185px;flex:0 0 185px;border-right:1px solid #e0e3e8;padding:8px;overflow:auto}.explorer-side button{width:100%;height:34px;border:0;border-radius:5px;background:transparent;text-align:left;padding:0 10px;display:flex;align-items:center;gap:9px}.explorer-side button:hover,.explorer-side button.active{background:#e8f2fc}.dark .explorer-side button:hover,.dark .explorer-side button.active{background:#303a48}.side-emoji{width:20px;text-align:center}.explorer-files{flex:1;overflow:auto;padding:14px}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;align-content:start}.file-item{height:103px;border:1px solid transparent;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:11px;text-align:center;padding:7px;overflow:hidden}.file-item:hover,.file-item.selected{background:#e9f3fc;border-color:#c8e2f7}.dark .file-item:hover,.dark .file-item.selected{background:#2f3b49;border-color:#44566b}.file-visual{width:47px;height:47px;display:grid;place-items:center;font-size:41px}.file-name{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.explorer-empty{padding:45px;text-align:center;color:#7b8593}
/* Browser */
.browser-app{height:100%;display:flex;flex-direction:column;background:#fff}.browser-tabs{height:36px;background:#e9edf3;display:flex;align-items:end;padding-left:8px}.browser-tab{width:230px;height:31px;background:white;border-radius:8px 8px 0 0;padding:7px 12px;font-size:11px;display:flex;justify-content:space-between}.browser-bar{height:48px;display:flex;align-items:center;gap:5px;padding:6px 9px;border-bottom:1px solid #dfe3e8;background:white}.browser-btn{width:34px;height:34px;border:0;border-radius:50%;background:transparent;font-size:16px}.browser-btn:hover{background:#eef1f5}.browser-address{flex:1;height:34px;border:0;border-radius:18px;background:#eef1f5;padding:0 17px;outline:none;font-size:12px}.browser-address:focus{box-shadow:0 0 0 2px #9cc8f2;background:white}.browser-frame{flex:1;border:0;background:white;width:100%}.browser-hint{height:25px;padding:5px 12px;font-size:10px;color:#687386;background:#f7f8fa;border-top:1px solid #e0e4e9;display:flex;justify-content:space-between}.dark .browser-tabs{background:#252a33}.dark .browser-bar{background:#2b303a;border-color:#414855}.dark .browser-address{background:#3b424e;color:white}.dark .browser-hint{background:#292e38;color:#bcc4d0;border-color:#414855}
@media(max-width:700px){
  .desktop-icons{width:92px}.task-right .tray-icons{display:none}.clock{min-width:58px}.window{min-width:280px;left:4px!important;top:4px!important;width:calc(100% - 8px)!important;height:calc(100% - 8px)!important;border-radius:7px;resize:none}.start-panel{padding:20px 18px 10px}.start-grid{grid-template-columns:repeat(3,1fr)}.start-footer{margin-left:-18px;margin-right:-18px;margin-bottom:-10px;padding-left:28px;padding-right:28px}.start-recommended{grid-template-columns:1fr}.explorer-side{display:none}.explorer-search{width:110px}.word-tools{overflow-x:auto}.word-page{padding:35px 28px;min-height:820px}.quick-panel,.calendar-panel{right:5px;width:calc(100vw - 10px)}

<body>
<div id="desktop" aria-label="Windows 11 style desktop">
  <div class="desktop-icons" id="desktopIcons">
    <div class="desktop-icon" data-app="word" tabindex="0"><div class="app-icon" data-icon="word"></div><span>Microsoft Word</span></div>
    <div class="desktop-icon" data-app="paint" tabindex="0"><div class="app-icon" data-icon="paint"></div><span>Paint</span></div>
    <div class="desktop-icon" data-app="calculator" tabindex="0"><div class="app-icon" data-icon="calculator"></div><span>Calculator</span></div>
    <div class="desktop-icon" data-app="notepad" tabindex="0"><div class="app-icon" data-icon="notepad"></div><span>Notepad</span></div>
    <div class="desktop-icon" data-app="explorer" tabindex="0"><div class="app-icon" data-icon="explorer"></div><span>File Explorer</span></div>
    <div class="desktop-icon" data-app="chrome" tabindex="0"><div class="app-icon" data-icon="chrome"></div><span>Google Chrome</span></div>
  </div>
  <div id="windowLayer"></div>
  <div class="toast-area" id="toastArea"></div>
  <div class="lightbox" id="lightbox"><button class="lightbox-close" aria-label="Close">×</button><img alt="Preview"></div>

  <section class="start-panel" id="startPanel" aria-label="Start menu">
    <div class="start-search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input class="start-search" id="startSearch" placeholder="Type here to search" autocomplete="off">
    </div>
    <div class="start-section-head"><span>Pinned</span><button class="all-apps">All apps  ›</button></div>

}

 '/':[{name:'Desktop',type:'folder'},{name:'Documents',type:'folder'},{name:'Downloads',type:'folder'},{name:'Pictures',type:'folder'}],
 '/Desktop':[{name:'Microsoft Word',type:'app',app:'word'},{name:'Paint',type:'app',app:'paint'},{name:'Calculator',type:'app',app:'calculator'},{name:'Notepad',type:'app',app:'notepad'},{name:'Google Chrome',type:'app',app:'chrome'}],
 '/Documents':[{name:'Welcome.txt',type:'text',content:'Welcome to the browser-based Windows 11 desktop.\n\nDouble-click files and folders to open them.'},{name:'Project Notes.txt',type:'text',content:'Project notes\n\n• Build something useful\n• Save often\n• Have fun'},{name:'Sample Document.doc',type:'doc',content:'Sample Document\n\nThis file opens inside the Word app.'}],
 '/Downloads':[],
 '/Pictures':[{name:'Windows 11 Bloom.jpg',type:'image',url:WALLPAPER_URL}]
};
function renderExplorer(){return `<div class="explorer-app"><div class="explorer-command"><button class="ex-new">＋ New folder</button><button class="ex-upload">⇧ Upload</button><button class="ex-refresh">↻ Refresh</button><input class="ex-file" type="file" multiple hidden></div><div class="explorer-nav"><button class="nav-arrow ex-back">←</button><button class="nav-arrow ex-up">↑</button><input class="explorer-address" value="/" aria-label="Address"><input class="explorer-search" placeholder="Search"></div><div class="explorer-main"><aside class="explorer-side"><button data-path="/"><span class="side-emoji">🏠</span>Home</button><button data-path="/Desktop"><span class="side-emoji">🖥️</span>Desktop</button><button data-path="/Documents"><span class="side-emoji">📄</span>Documents</button><button data-path="/Downloads"><span class="side-emoji">⬇️</span>Downloads</button><button data-path="/Pictures"><span class="side-emoji">🖼️</span>Pictures</button></aside><main class="explorer-files"><div class="file-grid"></div></main></div><div class="app-status"><span class="ex-status">0 items</span><span style="margin-left:auto">Virtual local storage</span></div></div>`}
function initExplorer(win,opts={}){
 const address=$('.explorer-address',win),grid=$('.file-grid',win),search=$('.explorer-search',win),status=$('.ex-status',win),fileInput=$('.ex-file',win);let path=opts.path||'/',history=['/'],hi=0;
 const iconFor=item=>item.type==='folder'?'📁':item.type==='text'?'📃':item.type==='doc'?'📘':item.type==='image'?'🖼️':item.type==='app'?`<span class="app-icon" data-icon="${item.app}" style="width:45px;height:45px"></span>`:'📦';
 const draw=()=>{address.value=path;const q=search.value.trim().toLowerCase();const items=(VFS[path]||[]).filter(x=>x.name.toLowerCase().includes(q));grid.innerHTML=items.length?items.map((item,i)=>`<div class="file-item" data-index="${i}" tabindex="0"><div class="file-visual">${iconFor(item)}</div><div class="file-name" title="${escapeHTML(item.name)}">${escapeHTML(item.name)}</div></div>`).join(''):`<div class="explorer-empty">This folder is empty.</div>`;applyIcons(grid);status.textContent=`${items.length} item${items.length===1?'':'s'}`;$$('.explorer-side button',win).forEach(b=>b.classList.toggle('active',b.dataset.path===path));$$('.file-item',grid).forEach((el,i)=>{const item=items[i];el.ondblclick=()=>openItem(item);el.onclick=()=>{$$('.file-item',grid).forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}})};
 const go=(p,push=true)=>{if(!VFS[p])return toast('File Explorer','Folder not found.');path=p;if(push){history=history.slice(0,hi+1);history.push(path);hi=history.length-1}draw()};
 const openItem=item=>{if(item.type==='folder')go(path==='/'?`/${item.name}`:`${path}/${item.name}`);else if(item.type==='app')openApp(item.app);else if(item.type==='text')openApp('notepad',{content:item.content});else if(item.type==='doc')openApp('word',{content:item.content});else if(item.type==='image')showImage(item.url,item.name)};
 $$('.explorer-side button',win).forEach(b=>b.onclick=()=>go(b.dataset.path));
 $('.ex-back',win).onclick=()=>{if(hi>0){hi--;path=history[hi];draw()}};$('.ex-up',win).onclick=()=>{if(path!=='/'){const p=path.split('/').slice(0,-1).join('/')||'/';go(p)}};
 address.addEventListener('keydown',e=>{if(e.key==='Enter')go(address.value.trim())});search.oninput=draw;$('.ex-refresh',win).onclick=draw;
 $('.ex-new',win).onclick=()=>{const name=prompt('Folder name','New folder');if(!name)return;const newPath=path==='/'?`/${name}`:`${path}/${name}`;if(VFS[newPath])return toast('File Explorer','A folder with that name already exists.');VFS[newPath]=[];VFS[path].push({name,type:'folder'});draw()};
 $('.ex-upload',win).onclick=()=>fileInput.click();fileInput.onchange=()=>{[...fileInput.files].forEach(file=>{const reader=new FileReader();reader.onload=()=>{let item;if(file.type.startsWith('image/'))item={name:file.name,type:'image',url:reader.result};else item={name:file.name,type:'text',content:String(reader.result)};VFS[path].push(item);draw()};if(file.type.startsWith('image/'))reader.readAsDataURL(file);else reader.readAsText(file)});fileInput.value=''};draw();
}
function renderChrome(){return `<div class="browser-app"><div class="browser-tabs"><div class="browser-tab"><span>New Tab</span><span>×</span></div></div><div class="browser-bar"><button class="browser-btn br-back">←</button><button class="browser-btn br-forward">→</button><button class="browser-btn br-reload">↻</button><button class="browser-btn br-home">⌂</button><input class="browser-address" value="chrome://newtab" spellcheck="false"><button class="browser-btn br-external" title="Open in a real browser tab">↗</button><button class="browser-btn">⋮</button></div><iframe class="browser-frame" title="Browser content"></iframe><div class="browser-hint"><span>Some websites block iframe display. Use ↗ to open the current address in a new browser tab.</span><span class="br-status">Ready</span></div></div>`}
function chromeHomeHTML(){return `<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#f9fbfd,#eaf3ff);color:#243247;min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{width:min(660px,90%);text-align:center}.logo{width:78px;height:78px;border-radius:50%;margin:auto;background:conic-gradient(#ea4335 0 33%,#fbbc05 0 66%,#34a853 0);display:grid;place-items:center;box-shadow:0 10px 30px #8da6c655}.logo:after{content:'';width:34px;height:34px;border-radius:50%;background:#4285f4;border:5px solid white}.title{font-size:30px;margin:22px 0}.search{width:100%;height:48px;border:1px solid #d6dee8;border-radius:24px;padding:0 22px;font-size:16px;box-shadow:0 3px 13px #6f849522;background:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}.card{display:block;padding:16px 7px;border-radius:12px;color:#324055;text-decoration:none;background:#ffffffaa}.card:hover{background:white;box-shadow:0 6px 22px #92a6ba35}.ico{font-size:28px;margin-bottom:7px}@media(max-width:500px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="logo"></div><div class="title">Welcome to Chrome</div><form action="https://www.google.com/search" method="get"><input type="hidden" name="igu" value="1"><input class="search" name="q" placeholder="Search Google or type a URL" autofocus></form><div class="cards"><a class="card" href="https://www.wikipedia.org"><div class="ico">W</div>Wikipedia</a><a class="card" href="https://www.bing.com"><div class="ico">🔎</div>Bing</a><a class="card" href="https://www.openstreetmap.org"><div class="ico">🗺️</div>Maps</a><a class="card" href="https://example.com"><div class="ico">🌐</div>Example</a></div></div></body></html>`}
function initChrome(win){
 const frame=$('.browser-frame',win),address=$('.browser-address',win),status=$('.br-status',win);let urls=['chrome://newtab'],idx=0,current='chrome://newtab';
 const load=(value,push=true)=>{let v=value.trim();if(!v||v==='chrome://newtab'){current='chrome://newtab';frame.removeAttribute('src');frame.srcdoc=chromeHomeHTML();address.value=current}else{if(!/^https?:\/\//i.test(v)){if(v.includes('.')&&!v.includes(' '))v='https://'+v;else v='https://www.google.com/search?igu=1&q='+encodeURIComponent(v)}current=v;frame.removeAttribute('srcdoc');frame.src=v;address.value=v}if(push){urls=urls.slice(0,idx+1);urls.push(current);idx=urls.length-1}status.textContent='Loading…'};
 frame.onload=()=>status.textContent='Done';load('chrome://newtab',false);
 address.addEventListener('keydown',e=>{if(e.key==='Enter')load(address.value)});$('.br-home',win).onclick=()=>load('chrome://newtab');$('.br-reload',win).onclick=()=>load(current,false);$('.br-back',win).onclick=()=>{if(idx>0){idx--;load(urls[idx],false)}};$('.br-forward',win).onclick=()=>{if(idx<urls.length-1){idx++;load(urls[idx],false)}};$('.br-external',win).onclick=()=>{if(current==='chrome://newtab')window.open('https://www.google.com','_blank','noopener');else window.open(current,'_blank','noopener')};
}

function openApp(id,opts={}){
 const app=APPS[id];if(!app)return;let win=windows.get(id);
 if(win){win.classList.remove('hidden');if(opts.content!==undefined){const content=$('.notepad-text',win)||$('.word-page',win);if(content){if(content.tagName==='TEXTAREA')content.value=opts.content;else content.innerHTML=`<p>${escapeHTML(opts.content).replace(/\n/g,'</p><p>')}</p>`;content.dispatchEvent(new Event('input'))}}focusWindow(win);return win}
 win=document.createElement('section');win.className='window';win.dataset.app=id;win.style.width=Math.min(app.w,innerWidth-20)+'px';win.style.height=Math.min(app.h,innerHeight-70)+'px';const left=Math.max(4,Math.min(100+cascade*28,innerWidth-app.w-20)),top=Math.max(4,Math.min(45+cascade*24,innerHeight-app.h-70));win.style.left=left+'px';win.style.top=top+'px';cascade=(cascade+1)%8;
 win.innerHTML=`<header class="titlebar"><div class="title-app-icon app-icon" data-icon="${app.icon}"></div><div class="title-text">${app.title}</div><div class="window-controls"><button class="window-control minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 8.5h8"/></svg></button><button class="window-control maximize" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.3" y="2.3" width="7.4" height="7.4"/></svg></button><button class="window-control close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="m2.5 2.5 7 7m0-7-7 7"/></svg></button></div></header><div class="window-content">${app.render()}</div>`;
 $('#windowLayer').append(win);applyIcons(win);windows.set(id,win);setupWindow(win);app.init(win,opts);focusWindow(win);updateTaskbar();return win;
}
function setupWindow(win){
 const bar=$('.titlebar',win);let dragging=false,sx=0,sy=0,sl=0,st=0;
 bar.addEventListener('pointerdown',e=>{if(e.target.closest('.window-controls'))return;focusWindow(win);if(win.classList.contains('maximized'))return;dragging=true;sx=e.clientX;sy=e.clientY;sl=win.offsetLeft;st=win.offsetTop;bar.setPointerCapture(e.pointerId)});
 bar.addEventListener('pointermove',e=>{if(!dragging)return;win.style.left=Math.max(0,Math.min(innerWidth-100,sl+e.clientX-sx))+'px';win.style.top=Math.max(0,Math.min(innerHeight-80,st+e.clientY-sy))+'px'});bar.addEventListener('pointerup',()=>dragging=false);bar.ondblclick=()=>toggleMax(win);
 win.addEventListener('pointerdown',()=>focusWindow(win));$('.minimize',win).onclick=()=>{win.classList.add('hidden');updateTaskbar()};$('.maximize',win).onclick=()=>toggleMax(win);$('.close',win).onclick=()=>{windows.delete(win.dataset.app);win.remove();updateTaskbar()};
}
function toggleMax(win){win.classList.toggle('maximized');focusWindow(win)}
function focusWindow(win){$$('.window').forEach(w=>w.classList.remove('active'));win.classList.add('active');win.style.zIndex=++zCounter;updateTaskbar()}
function updateTaskbar(){APP_ORDER.forEach(id=>{const b=$(`.task-button[data-app="${id}"]`);const w=windows.get(id);if(!b)return;b.classList.toggle('open',!!w);b.classList.toggle('active',!!w&&!w.classList.contains('hidden')&&w.classList.contains('active'))})}
function setupTaskbar(){const center=$('#taskCenter');APP_ORDER.forEach(id=>{const a=APPS[id],b=document.createElement('button');b.className='task-button';b.dataset.app=id;b.title=a.title;b.innerHTML=`<div class="app-icon" data-icon="${a.icon}"></div>`;b.onclick=()=>{const w=windows.get(id);if(w&&!w.classList.contains('hidden')&&w.classList.contains('active')){w.classList.add('hidden');updateTaskbar()}else openApp(id)};center.append(b)});applyIcons(center)}
setupTaskbar();

function downloadBlob(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toast(title,msg){const el=document.createElement('div');el.className='toast';el.innerHTML=`<b>${escapeHTML(title)}</b>${escapeHTML(msg)}`;$('#toastArea').append(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(20px)';el.style.transition='.25s';setTimeout(()=>el.remove(),260)},2800)}
function showImage(url,name='Image'){const lb=$('#lightbox');$('img',lb).src=url;$('img',lb).alt=name;lb.classList.add('show')}
$('.lightbox-close').onclick=()=>$('#lightbox').classList.remove('show');$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('show')});

function setupDesktop(){
 $$('.desktop-icon').forEach(icon=>{icon.addEventListener('click',e=>{$$('.desktop-icon').forEach(x=>x.classList.remove('selected'));icon.classList.add('selected');e.stopPropagation()});icon.addEventListener('dblclick',()=>openApp(icon.dataset.app));icon.addEventListener('keydown',e=>{if(e.key==='Enter')openApp(icon.dataset.app)})});
 $('#desktop').addEventListener('click',e=>{if(!e.target.closest('.desktop-icon,.window,.taskbar,.start-panel,.quick-panel,.calendar-panel,.context-menu'))$$('.desktop-icon').forEach(x=>x.classList.remove('selected'))});
 $('#desktop').addEventListener('contextmenu',e=>{if(e.target.closest('.window,.taskbar'))return;e.preventDefault();const m=$('#desktopMenu');m.style.left=Math.min(e.clientX,innerWidth-230)+'px';m.style.top=Math.min(e.clientY,innerHeight-260)+'px';m.classList.add('show')});
 $('#refreshDesktop').onclick=()=>{const icons=$('#desktopIcons');icons.style.opacity='.2';setTimeout(()=>icons.style.opacity='1',140);$('#desktopMenu').classList.remove('show')};
 $('#newTextDoc').onclick=()=>{openApp('notepad',{content:''});$('#desktopMenu').classList.remove('show')};$('#personalize').onclick=()=>{toast('Personalization','Use Quick settings to toggle dark mode and night light.');$('#desktopMenu').classList.remove('show')};
}
setupDesktop();

function setupStart(){
 const grid=$('#startGrid');grid.innerHTML=Object.entries(APPS).map(([id,a])=>`<button class="start-app" data-app="${id}"><div class="app-icon" data-icon="${a.icon}"></div><span>${a.title.replace('Microsoft ','')}</span></button>`).join('');applyIcons(grid);
 const toggle=()=>{closePanels('start');$('#startPanel').classList.toggle('show');if($('#startPanel').classList.contains('show'))setTimeout(()=>$('#startSearch').focus(),30)};
 $('#startButton').onclick=e=>{e.stopPropagation();toggle()};$$('.start-app,.recommended').forEach(b=>b.onclick=()=>{openApp(b.dataset.app);$('#startPanel').classList.remove('show')});
 $('#startSearch').oninput=e=>{const q=e.target.value.toLowerCase();$$('.start-app').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?'flex':'none')};$('#startSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const first=$('.start-app:not([style*="none"])');if(first){openApp(first.dataset.app);$('#startPanel').classList.remove('show')}}});
 $('#powerButton').onclick=()=>toast('Power','This browser desktop cannot shut down your computer.');
}
setupStart();
function closePanels(except=''){if(except!=='start')$('#startPanel').classList.remove('show');if(except!=='quick')$('#quickPanel').classList.remove('show');if(except!=='calendar')$('#calendarPanel').classList.remove('show');$('#desktopMenu').classList.remove('show')}
$('#trayButton').onclick=e=>{e.stopPropagation();closePanels('quick');$('#quickPanel').classList.toggle('show')};$('#clock').onclick=e=>{e.stopPropagation();closePanels('calendar');$('#calendarPanel').classList.toggle('show')};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.start-panel,#startButton,.quick-panel,#trayButton,.calendar-panel,#clock,.context-menu'))closePanels()});
$$('.quick-tile').forEach(b=>b.onclick=()=>b.classList.toggle('active'));$('#nightTile').onclick=e=>{e.currentTarget.classList.toggle('active');$('#desktop').classList.toggle('night-light')};$('#darkTile').onclick=e=>{e.currentTarget.classList.toggle('active');document.body.classList.toggle('dark')};$('#brightnessSlider').oninput=e=>$('#desktop').style.filter=`brightness(${e.target.value}%)`;$('#showDesktop').onclick=()=>{windows.forEach(w=>w.classList.add('hidden'));updateTaskbar()};

function updateClock(){const d=new Date();$('#clock').innerHTML=`${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<br>${d.toLocaleDateString([],{month:'numeric',day:'numeric',year:'numeric'})}`;$('#calendarTime').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});$('#calendarDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});renderCalendar(d)}
let lastMonth='';function renderCalendar(d){const key=d.getFullYear()+'-'+d.getMonth();if(key===lastMonth)return;lastMonth=key;$('#monthLabel').textContent=d.toLocaleDateString([],{month:'long',year:'numeric'});const first=new Date(d.getFullYear(),d.getMonth(),1),start=(first.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),prevDays=new Date(d.getFullYear(),d.getMonth(),0).getDate();let html=['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<42;i++){let n,cls='';if(i<start){n=prevDays-start+i+1;cls='other'}else if(i>=start+days){n=i-start-days+1;cls='other'}else{n=i-start+1;if(n===d.getDate())cls='today'}html+=`<div class="${cls}">${n}</div>`}$('#calendarGrid').innerHTML=html}
updateClock();setInterval(updateClock,1000);
window.addEventListener('resize',()=>{windows.forEach(w=>{if(!w.classList.contains('maximized')){w.style.left=Math.max(0,Math.min(w.offsetLeft,innerWidth-w.offsetWidth))+'px';w.style.top=Math.max(0,Math.min(w.offsetTop,innerHeight-w.offsetHeight-48))+'px'}})});
setTimeout(()=>toast('Windows 11 browser edition','Double-click a desktop icon to open an app.'),650);
})();
</script>
