<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','Noto Sans',sans-serif;overflow:hidden;width:100vw;height:100vh;user-select:none;cursor:default;}
#wallpaper{position:fixed;inset:0;z-index:0;}
#desktop{position:fixed;inset:0;bottom:48px;z-index:1;overflow:hidden;}
#desktop-icons{display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;height:100%;padding:16px 12px;gap:4px;}
.desktop-icon{display:flex;flex-direction:column;align-items:center;width:76px;padding:6px 4px;border-radius:4px;cursor:pointer;border:1px solid transparent;transition:background .1s;}
.desktop-icon:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.08);}
.desktop-icon.selected{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.15);}
.desktop-icon .icon-img{width:42px;height:42px;margin-bottom:4px;pointer-events:none;}
.desktop-icon span{color:#fff;font-size:11px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.3;max-width:72px;word-wrap:break-word;pointer-events:none;}

/* Taskbar */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:48px;background:rgba(28,28,28,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:center;z-index:9999;border-top:1px solid rgba(255,255,255,.06);}
#taskbar-center{display:flex;align-items:center;gap:2px;height:100%;}
.taskbar-btn{width:44px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;position:relative;transition:background .15s;}
.taskbar-btn:hover{background:rgba(255,255,255,.08);}
.taskbar-btn:active{background:rgba(255,255,255,.04);}
.taskbar-btn img,.taskbar-btn svg{width:22px;height:22px;pointer-events:none;}
.taskbar-btn .active-dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:#60cdff;opacity:0;transition:opacity .2s;}
.taskbar-btn.active .active-dot{opacity:1;}
.taskbar-btn.running .active-dot{opacity:.5;background:#fff;}
#taskbar-right{position:absolute;right:0;display:flex;align-items:center;height:100%;padding-right:12px;gap:4px;}
.tray-btn{padding:4px 8px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);font-size:11px;transition:background .15s;}
.tray-btn:hover{background:rgba(255,255,255,.06);}
.tray-icon{width:16px;height:16px;fill:rgba(255,255,255,.8);}
#clock{color:rgba(255,255,255,.85);font-size:11px;text-align:right;line-height:1.35;padding:4px 8px;border-radius:4px;cursor:pointer;transition:background .15s;}
#clock:hover{background:rgba(255,255,255,.06);}

/* Windows */
.window{position:absolute;min-width:320px;min-height:200px;border-radius:8px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;z-index:100;transition:box-shadow .15s;}
.window.focused{box-shadow:0 12px 48px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.1);}
.window.maximized{border-radius:0;box-shadow:none;}
.window-header{height:36px;background:#f3f3f3;display:flex;align-items:center;padding:0 4px 0 12px;flex-shrink:0;cursor:default;-webkit-app-region:drag;}
.window.dark-header .window-header{background:#202020;}
.window-header .win-icon{width:16px;height:16px;margin-right:8px;pointer-events:none;}
.window-header .win-title{flex:1;font-size:12px;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;}
.window.dark-header .win-title{color:#fff;}
.window-controls{display:flex;height:100%;-webkit-app-region:no-drag;}
.window-controls button{width:46px;height:100%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;}
.window-controls button:hover{background:rgba(0,0,0,.06);}
.window-controls .btn-close:hover{background:#c42b1c;}
.window-controls .btn-close:hover svg{fill:#fff;}
.window-controls button svg{width:10px;height:10px;fill:#1a1a1a;}
.window.dark-header .window-controls button svg{fill:#fff;}
.window.dark-header .window-controls button:hover{background:rgba(255,255,255,.08);}
.window.dark-header .window-controls .btn-close:hover{background:#c42b1c;}
.window-body{flex:1;overflow:hidden;background:#fff;display:flex;flex-direction:column;}

/* Start Menu */
#start-menu{position:fixed;bottom:56px;left:50%;transform:translateX(-50%) scale(.92);width:600px;height:580px;background:rgba(40,40,40,.92);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:8px;z-index:9998;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 16px 64px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);display:flex;flex-direction:column;overflow:hidden;}
#start-menu.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);}
#start-search{margin:24px 28px 16px;height:36px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;display:flex;align-items:center;padding:0 14px;gap:8px;cursor:text;}
#start-search svg{width:16px;height:16px;fill:rgba(255,255,255,.5);}
#start-search span{color:rgba(255,255,255,.4);font-size:13px;}
#start-pinned{padding:0 28px;}
#start-pinned h3{color:#fff;font-size:14px;font-weight:600;margin-bottom:12px;}
#pinned-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.pinned-app{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:4px;cursor:pointer;transition:background .1s;}
.pinned-app:hover{background:rgba(255,255,255,.06);}
.pinned-app img{width:32px;height:32px;margin-bottom:4px;}
.pinned-app span{color:rgba(255,255,255,.85);font-size:11px;text-align:center;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#start-recommended{flex:1;padding:16px 28px;overflow-y:auto;}
#start-recommended h3{color:#fff;font-size:14px;font-weight:600;margin-bottom:8px;}
.rec-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .1s;}
.rec-item:hover{background:rgba(255,255,255,.06);}
.rec-item img{width:28px;height:28px;}
.rec-item .rec-info span{color:rgba(255,255,255,.85);font-size:12px;display:block;}
.rec-item .rec-info small{color:rgba(255,255,255,.4);font-size:11px;}
#start-footer{height:48px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 28px;}
#start-footer .user{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:4px;cursor:pointer;transition:background .1s;}
#start-footer .user:hover{background:rgba(255,255,255,.06);}
#start-footer .user-avatar{width:24px;height:24px;border-radius:50%;background:#0078d4;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;}
#start-footer .user span{color:rgba(255,255,255,.85);font-size:12px;}
#start-footer .power{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s;}
#start-footer .power:hover{background:rgba(255,255,255,.06);}
#start-footer .power svg{width:16px;height:16px;fill:rgba(255,255,255,.7);}

/* Context Menu */
#context-menu{position:fixed;background:rgba(40,40,40,.92);backdrop-filter:blur(30px);border-radius:8px;min-width:200px;padding:4px;z-index:9999;opacity:0;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);transition:opacity .1s;}
#context-menu.visible{opacity:1;pointer-events:auto;}
.ctx-item{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:4px;cursor:pointer;color:rgba(255,255,255,.85);font-size:12px;transition:background .1s;}
.ctx-item:hover{background:rgba(255,255,255,.06);}
.ctx-item svg{width:16px;height:16px;fill:rgba(255,255,255,.6);}
.ctx-sep{height:1px;background:rgba(255,255,255,.06);margin:4px 0;}

/* App: Calculator */
.calc-display{background:#f3f3f3;padding:12px 16px;text-align:right;min-height:90px;display:flex;flex-direction:column;justify-content:flex-end;}
.calc-expr{font-size:13px;color:#666;min-height:20px;}
.calc-result{font-size:40px;font-weight:600;color:#1a1a1a;line-height:1.2;word-break:break-all;}
.calc-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;flex:1;background:#e8e8e8;}
.calc-btn{border:none;font-size:15px;cursor:pointer;font-family:inherit;border-radius:3px;transition:background .1s;display:flex;align-items:center;justify-content:center;}
.calc-btn.num{background:#fcfcfc;color:#1a1a1a;}
.calc-btn.num:hover{background:#f0f0f0;}
.calc-btn.op{background:#f5f5f5;color:#1a1a1a;}
.calc-btn.op:hover{background:#e8e8e8;}
.calc-btn.eq{background:#0078d4;color:#fff;}
.calc-btn.eq:hover{background:#106ebe;}
.calc-btn.fn{background:#f5f5f5;color:#555;}
.calc-btn.fn:hover{background:#e8e8e8;}

/* App: Notepad */
.notepad-menu{height:28px;background:#f9f9f9;display:flex;align-items:center;padding:0 4px;border-bottom:1px solid #e5e5e5;font-size:12px;color:#444;}
.notepad-menu span{padding:2px 8px;border-radius:3px;cursor:pointer;}
.notepad-menu span:hover{background:rgba(0,0,0,.05);}
.notepad-body{flex:1;display:flex;flex-direction:column;}
.notepad-body textarea{flex:1;border:none;outline:none;resize:none;padding:8px 12px;font-family:'Consolas','Courier New',monospace;font-size:14px;line-height:1.5;color:#1a1a1a;}
.notepad-status{height:24px;background:#f9f9f9;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 12px;font-size:11px;color:#666;gap:16px;}

/* App: Word */
.word-ribbon{background:#f3f3f3;border-bottom:1px solid #d8d8d8;padding:4px 8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:40px;}
.word-ribbon button{height:28px;padding:0 8px;border:none;background:transparent;border-radius:3px;cursor:pointer;font-size:12px;font-family:inherit;color:#333;display:flex;align-items:center;gap:4px;transition:background .1s;}
.word-ribbon button:hover{background:rgba(0,0,0,.06);}
.word-ribbon button.active{background:rgba(0,0,0,.1);}
.word-ribbon select{height:28px;border:1px solid #ccc;border-radius:3px;font-size:12px;padding:0 4px;background:#fff;cursor:pointer;}
.word-ribbon .sep{width:1px;height:22px;background:#d0d0d0;margin:0 4px;}
.word-editor{flex:1;padding:32px 64px;overflow-y:auto;font-family:'Calibri',sans-serif;font-size:14px;line-height:1.6;color:#1a1a1a;outline:none;cursor:text;background:#fff;}
.word-editor:focus{outline:none;}
.word-status{height:24px;background:#f3f3f3;border-top:1px solid #d8d8d8;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;color:#666;}

/* App: Paint */
.paint-toolbar{background:#f5f5f5;border-bottom:1px solid #d8d8d8;padding:6px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.paint-toolbar .tool{width:32px;height:32px;border:1px solid transparent;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;transition:background .1s,border-color .1s;}
.paint-toolbar .tool:hover{background:rgba(0,0,0,.05);border-color:#ccc;}
.paint-toolbar .tool.active{background:rgba(0,0,0,.08);border-color:#999;}
.paint-toolbar .tool svg{width:18px;height:18px;}
.paint-toolbar .sep{width:1px;height:26px;background:#d0d0d0;margin:0 4px;}
.paint-colors{display:flex;gap:3px;align-items:center;}
.paint-color{width:22px;height:22px;border-radius:2px;cursor:pointer;border:1px solid rgba(0,0,0,.15);transition:transform .1s;}
.paint-color:hover{transform:scale(1.15);}
.paint-color.active{border:2px solid #0078d4;transform:scale(1.1);}
.paint-canvas-wrap{flex:1;overflow:hidden;background:#808080;display:flex;align-items:center;justify-content:center;}
.paint-canvas{background:#fff;cursor:crosshair;image-rendering:pixelated;}
.paint-status{height:24px;background:#f5f5f5;border-top:1px solid #d8d8d8;display:flex;align-items:center;padding:0 12px;font-size:11px;color:#666;gap:16px;}

/* App: File Explorer */
.explorer-toolbar{height:36px;background:#f9f9f9;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 8px;gap:4px;}
.explorer-toolbar button{width:28px;height:28px;border:none;background:transparent;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;}
.explorer-toolbar button:hover{background:rgba(0,0,0,.05);}
.explorer-toolbar button:disabled{opacity:.3;cursor:default;}
.explorer-toolbar button svg{width:14px;height:14px;fill:#555;}
.explorer-address{flex:1;height:26px;border:1px solid #d0d0d0;border-radius:3px;padding:0 8px;font-size:12px;background:#fff;outline:none;font-family:inherit;}
.explorer-address:focus{border-color:#0078d4;}
.explorer-main{flex:1;display:flex;overflow:hidden;}
.explorer-sidebar{width:180px;background:#f9f9f9;border-right:1px solid #e5e5e5;padding:8px 4px;overflow-y:auto;flex-shrink:0;}
.sidebar-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:12px;color:#333;transition:background .1s;}
.sidebar-item:hover{background:rgba(0,0,0,.04);}
.sidebar-item.active{background:rgba(0,120,212,.08);color:#0078d4;}
.sidebar-item svg{width:16px;height:16px;flex-shrink:0;}
.explorer-content{flex:1;padding:8px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;}
.file-item{width:80px;padding:8px 4px;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .1s;}
.file-item:hover{background:rgba(0,120,212,.06);}
.file-item.selected{background:rgba(0,120,212,.12);}
.file-item img{width:36px;height:36px;}
.file-item span{font-size:11px;color:#1a1a1a;text-align:center;word-break:break-all;line-height:1.3;}
.explorer-status{height:24px;background:#f9f9f9;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 12px;font-size:11px;color:#666;}

/* App: Chrome */
.chrome-tabs{height:36px;background:#dee1e6;display:flex;align-items:flex-end;padding:0 8px;gap:0;}
.chrome-tab{height:30px;padding:0 12px;background:#e8eaed;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px;font-size:12px;color:#333;cursor:pointer;max-width:180px;min-width:60px;transition:background .1s;}
.chrome-tab.active{background:#fff;}
.chrome-tab .tab-close{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s;margin-left:auto;}
.chrome-tab .tab-close:hover{background:rgba(0,0,0,.1);}
.chrome-tab .tab-close svg{width:10px;height:10px;fill:#666;}
.chrome-new-tab{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:4px;transition:background .1s;}
.chrome-new-tab:hover{background:rgba(0,0,0,.06);}
.chrome-new-tab svg{width:14px;height:14px;fill:#666;}
.chrome-toolbar{height:40px;background:#fff;border-bottom:1px solid #d8d8d8;display:flex;align-items:center;padding:0 8px;gap:6px;}
.chrome-nav-btn{width:28px;height:28px;border:none;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;}
.chrome-nav-btn:hover{background:rgba(0,0,0,.06);}
.chrome-nav-btn svg{width:16px;height:16px;fill:#666;}
.chrome-url{flex:1;height:30px;border:1px solid #d8d8d8;border-radius:15px;padding:0 12px;font-size:13px;outline:none;font-family:inherit;}
.chrome-url:focus{border-color:#0078d4;box-shadow:0 0 0 2px rgba(0,120,212,.15);}
.chrome-content{flex:1;background:#fff;overflow:hidden;}
.chrome-content iframe{width:100%;height:100%;border:none;}
.chrome-newtab{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:linear-gradient(180deg,#f8f9fa 0%,#fff 100%);}
.chrome-newtab h1{font-size:64px;font-weight:400;margin-bottom:24px;background:linear-gradient(90deg,#4285f4,#ea4335,#fbbc05,#34a853);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.chrome-search{width:480px;max-width:90%;height:44px;border:1px solid #d8d8d8;border-radius:24px;padding:0 20px;font-size:15px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.08);font-family:inherit;}
.chrome-search:focus{border-color:#4285f4;box-shadow:0 2px 12px rgba(66,133,244,.2);}
.chrome-shortcuts{display:flex;gap:16px;margin-top:32px;flex-wrap:wrap;justify-content:center;}
.chrome-shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px;padding:8px;border-radius:8px;cursor:pointer;transition:background .15s;}
.chrome-shortcut:hover{background:rgba(0,0,0,.04);}
.chrome-shortcut .sc-icon{width:40px;height:40px;border-radius:50%;background:#f1f3f4;display:flex;align-items:center;justify-content:center;}
.chrome-shortcut .sc-icon svg{width:20px;height:20px;}
.chrome-shortcut span{font-size:11px;color:#555;text-align:center;}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25);}
</style>
</head>
<body>
<canvas id="wallpaper"></canvas>
<div id="desktop"><div id="desktop-icons"></div></div>
<div id="windows-container"></div>
<div id="start-menu"></div>
<div id="context-menu"></div>
<div id="taskbar">
  <div id="taskbar-center"></div>
  <div id="taskbar-right">
    <div class="tray-btn" id="tray-icons">
      <svg class="tray-icon" viewBox="0 0 16 16"><path d="M1 12h14v1H1zm7-9a5 5 0 0 1 4.5 2.8l-.9.5A4 4 0 0 0 8 4a4 4 0 0 0-3.6 2.3l-.9-.5A5 5 0 0 1 8 3z"/><path d="M8 6a3 3 0 0 1 2.6 1.5l-.9.5A2 2 0 0 0 8 7a2 2 0 0 0-1.7 1l-.9-.5A3 3 0 0 1 8 6z"/><circle cx="8" cy="9.5" r="1"/></svg>
      <svg class="tray-icon" viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2zm0 1a5 5 0 0 1 3.5 8.5L6.5 4.5A5 5 0 0 1 8 3z"/></svg>
      <svg class="tray-icon" viewBox="0 0 16 16"><rect x="2" y="4" width="12" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="4" y="6" width="5" height="6" rx=".5" fill="currentColor" opacity=".4"/></svg>
    </div>
    <div id="clock"></div>
  </div>
</div>

<script>
// ─── Icon SVGs ───
const ICONS = {
  word: `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2B579A"/><stop offset="100%" stop-color="#1E3F73"/></linearGradient></defs><rect width="48" height="48" rx="6" fill="url(#wg)"/><path d="M13 14h6l3 13 3-13h5l3 13 3-13h6l-6 20h-5l-3.5-12L24 34h-5L13 14z" fill="#fff"/></svg>`,
  paint: `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="6" fill="#7B2D8E"/><ellipse cx="18" cy="20" rx="10" ry="8" fill="#E74C3C" opacity=".8"/><ellipse cx="30" cy="20" rx="10" ry="8" fill="#F39C12" opacity=".8"/><ellipse cx="24" cy="28" rx="10" ry="8" fill="#3498DB" opacity=".8"/><circle cx="24" cy="22" r="4" fill="#fff"/></svg>`,
  calc: `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect width="48" height="48" rx="6" fill="#0078D4"/><rect x="10" y="8" width="28" height="12" rx="2" fill="#fff" opacity=".9"/><rect x="10" y="24" width="6" height="5" rx="1" fill="#fff" opacity=".6"/><rect x="21" y="24" width="6" height="5" rx="1" fill="#fff" opacity=".6"/><rect x="32" y="24" width="6" height="5" rx="1" fill="#fff" opacity=".6"/><rect x="10" y="33" width="6" height="5" rx="1" fill="#fff" opacity=".6"/><rect x="21" y="33" width="6" height="5" rx="1" fill="#fff" opacity=".6"/><rect x="32" y="33" width="6" height="5" rx="1" fill="#60CDFF"/></svg>`,

// ─── Wallpaper ───
function drawWallpaper(){
  const c=document.getElementById('wallpaper'),ctx=c.getContext('2d');
  c.width=window.innerWidth;c.height=window.innerHeight;
  // Dark gradient background
  const bg=ctx.createLinearGradient(0,0,c.width,c.height);
  bg.addColorStop(0,'#0a1628');bg.addColorStop(0.5,'#0d1f3c');bg.addColorStop(1,'#0a1628');
  ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);
  // Bloom petals
  const cx=c.width/2,cy=c.height/2;
  const petals=[
    {dx:-80,dy:-60,w:520,h:340,angle:-0.2,color:'rgba(28,80,180,0.65)'},
    {dx:60,dy:-40,w:440,h:300,angle:0.35,color:'rgba(0,150,200,0.55)'},
    {dx:-40,dy:50,w:380,h:320,angle:0.9,color:'rgba(110,55,175,0.45)'},
    {dx:90,dy:30,w:400,h:260,angle:-0.55,color:'rgba(50,130,215,0.50)'},
    {dx:-20,dy:-80,w:340,h:280,angle:1.3,color:'rgba(0,175,185,0.38)'},
    {dx:10,dy:70,w:300,h:240,angle:-0.9,color:'rgba(75,95,195,0.40)'},
    {dx:-60,dy:20,w:280,h:200,angle:0.6,color:'rgba(160,80,200,0.25)'},
    {dx:50,dy:-70,w:260,h:220,angle:-1.1,color:'rgba(0,200,180,0.22)'},
  ];
  ctx.filter='blur(90px)';
  petals.forEach(p=>{
    ctx.save();ctx.translate(cx+p.dx,cy+p.dy);ctx.rotate(p.angle);
    const g=ctx.createRadialGradient(0,0,0,0,0,Math.max(p.w,p.h)/2);
    g.addColorStop(0,p.color);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,p.w/2,p.h/2,0,0,Math.PI*2);ctx.fill();ctx.restore();
  });
  // Center glow
  ctx.filter='blur(60px)';
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,280);
  cg.addColorStop(0,'rgba(90,170,255,0.55)');cg.addColorStop(0.5,'rgba(50,110,200,0.25)');cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg;ctx.fillRect(0,0,c.width,c.height);
  // Extra inner glow
  ctx.filter='blur(40px)';
  const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,140);
  ig.addColorStop(0,'rgba(140,200,255,0.35)');ig.addColorStop(1,'transparent');
  ctx.fillStyle=ig;ctx.fillRect(0,0,c.width,c.height);
  ctx.filter='none';
}
drawWallpaper();
window.addEventListener('resize',drawWallpaper);

// ─── Window Manager ───
let zCounter=100,activeWinId=null,windows={},windowOffset=0;
const winContainer=document.getElementById('windows-container');

function createWindow(appId,title,iconSvg,contentHTML,opts={}){
  // If already open, bring to front
  if(windows[appId]){bringToFront(appId);if(windows[appId].minimized)restoreWindow(appId);return;}
  const w=opts.width||800,h=opts.height||500;
  const x=Math.max(40,(window.innerWidth-w)/2+windowOffset),y=Math.max(20,(window.innerHeight-48-h)/2+windowOffset);
  windowOffset=(windowOffset+30)%120;
  const win=document.createElement('div');
  win.className='window focused';win.id='win-'+appId;win.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++zCounter};`;
  if(opts.dark)win.classList.add('dark-header');
  win.innerHTML=`<div class="window-header">
    <img class="win-icon" src="${iconURL(iconSvg)}" alt="">
    <span class="win-title">${title}</span>
    <div class="window-controls">
      <button class="btn-min" title="Minimize"><svg viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1"/></svg></button>
      <button class="btn-max" title="Maximize"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
      <button class="btn-close" title="Close"><svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div><div class="window-body">${contentHTML}</div>`;
  winContainer.appendChild(win);
  windows[appId]={el:win,minimized:false,maximized:false,prevRect:null};
  // Events
  win.querySelector('.btn-min').onclick=()=>minimizeWindow(appId);
  win.querySelector('.btn-max').onclick=()=>toggleMaximize(appId);
  win.querySelector('.btn-close').onclick=()=>closeWindow(appId);
  win.addEventListener('mousedown',()=>bringToFront(appId));
  // Drag
  const header=win.querySelector('.window-header');
  header.addEventListener('mousedown',e=>{
    if(e.target.closest('.window-controls'))return;
    const rect=win.getBoundingClientRect();
    const ox=e.clientX-rect.left,oy=e.clientY-rect.top;
    function move(ev){
      if(windows[appId].maximized){
        // Un-maximize on drag
        toggleMaximize(appId);
        const nw=windows[appId].el.offsetWidth;
        windows[appId].el.style.left=(ev.clientX-nw/2)+'px';
        windows[appId].el.style.top=ev.clientY-18+'px';
        return;
      }
      win.style.left=Math.max(-win.offsetWidth+120,ev.clientX-ox)+'px';
      win.style.top=Math.max(0,Math.min(window.innerHeight-68,ev.clientY-oy))+'px';
    }
    function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  });
  // Resize handle
  const resizeHandle=document.createElement('div');
  resizeHandle.style.cssText='position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize;z-index:10;';
  win.appendChild(resizeHandle);
  resizeHandle.addEventListener('mousedown',e=>{
    e.stopPropagation();const sr={w:win.offsetWidth,h:win.offsetHeight,x:e.clientX,y:e.clientY};
    function rm(ev){
      win.style.width=Math.max(320,sr.w+ev.clientX-sr.x)+'px';
      win.style.height=Math.max(200,sr.h+ev.clientY-sr.y)+'px';
    }
    function ru(){document.removeEventListener('mousemove',rm);document.removeEventListener('mouseup',ru);}
    document.addEventListener('mousemove',rm);document.addEventListener('mouseup',ru);
  });
  bringToFront(appId);
  updateTaskbarButtons();
  if(opts.onInit)setTimeout(()=>opts.onInit(win),50);
}

function bringToFront(id){
  if(!windows[id])return;
  Object.values(windows).forEach(w=>w.el.classList.remove('focused'));
  windows[id].el.style.zIndex=++zCounter;
  windows[id].el.classList.add('focused');
  activeWinId=id;
  updateTaskbarButtons();
}

function minimizeWindow(id){
  if(!windows[id])return;
  windows[id].el.style.display='none';windows[id].minimized=true;activeWinId=null;
  updateTaskbarButtons();
}

function restoreWindow(id){
  if(!windows[id])return;
  windows[id].el.style.display='flex';windows[id].minimized=false;bringToFront(id);
}

function toggleMaximize(id){
  if(!windows[id])return;
  const w=windows[id],el=w.el;
  if(w.maximized){
    el.style.left=w.prevRect.left;el.style.top=w.prevRect.top;el.style.width=w.prevRect.width;el.style.height=w.prevRect.height;
    el.classList.remove('maximized');w.maximized=false;
  } else {
    w.prevRect={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
    el.style.left='0';el.style.top='0';el.style.width='100vw';el.style.height='calc(100vh - 48px)';
    el.classList.add('maximized');w.maximized=true;
  }
}

function closeWindow(id){
  if(!windows[id])return;
  windows[id].el.remove();delete windows[id];
  if(activeWinId===id)activeWinId=null;
  updateTaskbarButtons();
}

// ─── Taskbar Buttons ───
const taskbarCenter=document.getElementById('taskbar-center');
const pinnedApps=['start','search','explorer','chrome','word'];

function updateTaskbarButtons(){
  taskbarCenter.innerHTML='';
  pinnedApps.forEach(appId=>{
    const btn=document.createElement('div');btn.className='taskbar-btn';
    if(appId==='start'){
      btn.innerHTML=ICONS.start;
      btn.onclick=()=>toggleStartMenu();
    } else if(appId==='search'){
      btn.innerHTML=ICONS.search;
      btn.onclick=()=>toggleStartMenu();
    } else {
      const app=apps[appId];if(!app)return;
      btn.innerHTML=`<img src="${iconURL(app.icon)}" alt="${app.title}">`;
      const isOpen=!!windows[appId];
      if(isOpen){btn.classList.add(windows[appId].minimized?'running':'active');}
      btn.onclick=()=>{
        if(!isOpen){openApp(appId);}
        else if(windows[appId].minimized){restoreWindow(appId);}
        else if(activeWinId===appId){minimizeWindow(appId);}
        else{bringToFront(appId);}
      };
    }
    btn.querySelector('svg,img')?.style && (btn.querySelector('svg,img').style.pointerEvents='none');
    if(!btn.querySelector('.active-dot')){const d=document.createElement('div');d.className='active-dot';btn.appendChild(d);}
    taskbarCenter.appendChild(btn);
  });
  // Open but not pinned apps
  Object.keys(windows).forEach(appId=>{
    if(pinnedApps.includes(appId))return;
    const app=apps[appId];if(!app)return;
    const btn=document.createElement('div');btn.className='taskbar-btn active';
    btn.innerHTML=`<img src="${iconURL(app.icon)}" alt="${app.title}"><div class="active-dot"></div>`;
    btn.onclick=()=>{
      if(windows[appId].minimized)restoreWindow(appId);
      else if(activeWinId===appId)minimizeWindow(appId);
      else bringToFront(appId);
    };
    taskbarCenter.appendChild(btn);
  });
}

function updateClock(){

  const time=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const date=d.toLocaleDateString([],{month:'numeric',day:'numeric',year:'numeric'});
  document.getElementById('clock').innerHTML=`<div>${time}</div><div>${date}</div>`;
}

    }

function floodFill(ctx,sx,sy,fillColor,w,h){
  const imgData=ctx.getImageData(0,0,w,h);const data=imgData.data;
  const idx=(sy*w+sx)*4;const tr=data[idx],tg=data[idx+1],tb=data[idx+2],ta=data[idx+3];
  const fc=hexToRgb(fillColor);if(tr===fc.r&&tg===fc.g&&tb===fc.b)return;
  const stack=[[sx,sy]];const visited=new Set();
  while(stack.length){
    const[x,y]=stack.pop();if(x<0||x>=w||y<0||y>=h)continue;
    const k=y*w+x;if(visited.has(k))continue;visited.add(k);
    const i=k*4;if(Math.abs(data[i]-tr)>30||Math.abs(data[i+1]-tg)>30||Math.abs(data[i+2]-tb)>30)continue;
    data[i]=fc.r;data[i+1]=fc.g;data[i+2]=fc.b;data[i+3]=255;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData,0,0);
}
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return{r,g,b};}

// ─── CALCULATOR ───
function getCalcContent(){
  const btns=[
    ['%','fn'],['CE','fn'],['C','fn'],['⌫','fn'],
    ['⅟x','fn'],['x²','fn'],['√x','fn'],['÷','op'],
    ['7','num'],['8','num'],['9','num'],['×','op'],
    ['4','num'],['5', 'num'],['6','num'],['−','op'],
    ['1','num'],['2','num'],['3','num'],['+','op'],
    ['±','fn'],['0','num'],['.','num'],['=','eq'],
  ];
  const buttonsHTML = btns.map(([label, cls]) => {
    const displayLabel = label === '÷' ? '÷' : label === '×' ? '×' : label === '−' ? '−' : label;
    return `<div class="calc-btn ${cls}" data-val="${label}">${displayLabel}</div>`;
  }).join('');
  return `<div class="calc-display"><div class="calc-expr"></div><div class="calc-result">0</div></div><div class="calc-buttons">${buttonsHTML}</div>`;
}
function initCalc(win) {
  let current = '0', expression = '', operator = null, prev = null, waitingForOperand = false;
  const exprEl = win.querySelector('.calc-expr');
  const resultEl = win.querySelector('.calc-result');
  function display() { resultEl.textContent = current; exprEl.textContent = expression; }
  function calc(a, op, b) {
    a = parseFloat(a); b = parseFloat(b);
    if (op === '+') return a + b;
    if (op === '−' || op === '-') return a - b;
    if (op === '×' || op === '*') return a * b;
    if (op === '÷' || op === '/') return b === 0 ? 'Error' : a / b;
    return b;
  }
  win.querySelectorAll('.calc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.val;
      if ('0123456789'.includes(v)) {
        if (waitingForOperand) { current = v; waitingForOperand = false; }
        else { current = current === '0' ? v : current + v; }
      } else if (v === '.') {
        if (!current.includes('.')) current += '.';
      } else if (v === '±') {
        current = String(-parseFloat(current));
      } else if (v === '⌫') {
        current = current.length > 1 ? current.slice(0, -1) : '0';
      } else if (v === 'CE') {
        current = '0';
      } else if (v === 'C') {
        current = '0'; expression = ''; operator = null; prev = null;
      } else if (v === 'x²') {
        current = String(Math.pow(parseFloat(current), 2));
      } else if (v === '√x') {
        current = String(Math.sqrt(parseFloat(current)));
      } else if (v === '⅟x') {
        const n = parseFloat(current);
        current = n === 0 ? 'Error' : String(1 / n);
      } else if (v === '%') {
        current = String(parseFloat(current) / 100);
      } else if (['+', '−', '×', '÷'].includes(v)) {
        if (prev !== null && operator && !waitingForOperand) {
          const result = calc(prev, operator, current);
          expression = result + ' ' + v + ' ';
          prev = String(result);
        } else {
          expression = current + ' ' + v + ' ';
          prev = current;
        }
        operator = v; waitingForOperand = true;
      } else if (v === '=') {
        if (prev !== null && operator) {
          const result = calc(prev, operator, current);
          expression = prev + ' ' + operator + ' ' + current + ' =';
          current = String(result); prev = null; operator = null; waitingForOperand = true;
        }
      }
      // Format long decimals
      if (current.includes('.') && current.length > 12) {
        current = String(parseFloat(parseFloat(current).toFixed(8)));
      }
      display();
    });
  });
}

function initExplorer(win) {
  let currentPath = 'This PC';
  const history = ['This PC'];
  let histIdx = 0;
  const contentEl = win.querySelector('.explorer-content');
  const addressEl = win.querySelector('.explorer-address');
  const statusEl = win.querySelector('.exp-count');
  const backBtn = win.querySelector('.exp-back');
  const fwdBtn = win.querySelector('.exp-fwd');
  const upBtn = win.querySelector('.exp-up');
  const refreshBtn = win.querySelector('.exp-refresh');

  function navigate(path, addHistory = true) {
    currentPath = path;
    if (addHistory) { history.splice(histIdx + 1); history.push(path); histIdx = history.length - 1; }
    addressEl.value = path;
    backBtn.disabled = histIdx <= 0;
    fwdBtn.disabled = histIdx >= history.length - 1;
    upBtn.disabled = path === 'This PC';
    // Update sidebar active
    win.querySelectorAll('.sidebar-item').forEach(s => s.classList.toggle('active', s.dataset.path === path));
    renderContent();
  }
  function getContents(path) {
    const parts = path.split('/');
    let obj = fileSystem;
    for (const p of parts) { if (obj[p] !== undefined) obj = obj[p]; else return null; }
    return obj;
  }
  function renderContent() {
    const contents = getContents(currentPath);
    if (!contents) { contentEl.innerHTML = '<div style="padding:20px;color:#888;">This folder is empty</div>'; statusEl.textContent = '0 items'; return; }
    const entries = Object.entries(contents);
    contentEl.innerHTML = '';
    entries.forEach(([name, type]) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      let iconSvg;
      if (type === 'object') iconSvg = ICONS.folder;
      else if (type === 'txt') iconSvg = ICONS.txt;
      else if (type === 'img') iconSvg = ICONS.img;
      else iconSvg = ICONS.file;
      item.innerHTML = `<img src="${iconURL(iconSvg)}" alt="${name}"><span>${name}</span>`;
      item.addEventListener('click', e => {
        e.stopPropagation();
        contentEl.querySelectorAll('.file-item').forEach(f => f.classList.remove('selected'));
        item.classList.add('selected');
      });
      item.addEventListener('dblclick', () => {
        if (type === 'object') navigate(currentPath + '/' + name);
        else {
          // Open file in appropriate app
          if (name.endsWith('.docx') || name.endsWith('.doc')) openApp('word');
          else if (name.endsWith('.txt')) openApp('notepad');
          else if (name.endsWith('.jpg') || name.endsWith('.png')) openApp('paint');
        }
      });
      contentEl.appendChild(item);
    });
    statusEl.textContent = `${entries.length} items`;
  }
  // Sidebar clicks
  win.querySelectorAll('.sidebar-item').forEach(s => {
    s.addEventListener('click', () => navigate(s.dataset.path));
  });
  backBtn.onclick = () => { if (histIdx > 0) { histIdx--; navigate(history[histIdx], false); } };
  fwdBtn.onclick = () => { if (histIdx < history.length - 1) { histIdx++; navigate(history[histIdx], false); } };
  upBtn.onclick = () => {
    const parts = currentPath.split('/');
    if (parts.length > 1) { parts.pop(); navigate(parts.join('/')); }
  };
  refreshBtn.onclick = renderContent;
  navigate('This PC');
}

  ).join('');
  menu.innerHTML = `
    <div id="start-search"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="6.5" cy="6.5" r="5" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/><line x1="10" y1="10" x2="14" y2="14" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/></svg><span>Search for apps, settings, and documents</span></div>
    <div id="start-pinned"><h3>Pinned</h3><div id="pinned-grid">${pinnedHTML}</div></div>
    <div id="start-recommended"><h3>Recommended</h3>${recHTML}</div>
    <div id="start-footer">
      <div class="user"><div class="user-avatar">U</div><span>User</span></div>
      <div class="power" title="Power"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/><line x1="8" y1="1" x2="8" y2="5" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/></svg></div>
    </div>`;
  // Pinned app clicks
  menu.querySelectorAll('.pinned-app').forEach(app => {
    app.addEventListener('click', () => { openApp(app.dataset.app); hideStartMenu(); });
  });
}
function toggleStartMenu() {
  const m = document.getElementById('start-menu');
  m.classList.toggle('visible');
}
function hideStartMenu() {
  document.getElementById('start-menu').classList.remove('visible');
}
buildStartMenu();

// ─── CONTEXT MENU ───
function showContextMenu(x, y) {
  const menu = document.getElementById('context-menu');
  menu.innerHTML = `
    <div class="ctx-item" data-action="refresh"><svg viewBox="0 0 16 16"><path d="M13 8A5 5 0 1 1 8 3" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 0l2.5 3-2.5 2" fill="currentColor"/></svg>Refresh</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="sort"><svg viewBox="0 0 16 16"><path d="M3 5h10M3 8h7M3 11h4" stroke="currentColor" stroke-width="1" fill="none"/></svg>Sort by</div>
    <div class="ctx-item" data-action="view"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" fill="none"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" fill="none"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" fill="none"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" fill="none"/></svg>View</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="new"><svg viewBox="0 0 16 16"><line x1="8" y1="3" x2="8" y2="13" stroke="currentColor" stroke-width="1.2"/><line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.2"/></svg>New</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="display"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="9" rx="1" stroke="currentColor" fill="none"/><line x1="5" y1="13" x2="11" y2="13" stroke="currentColor"/></svg>Display settings</div>
    <div class="ctx-item" data-action="personalize"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>Personalize</div>
  `;
  menu.style.left = Math.min(x, window.innerWidth - 220) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 260) + 'px';
  menu.classList.add('visible');
  menu.querySelectorAll('.ctx-item').forEach(item => {
    item.addEventListener('click', () => {
      hideContextMenu();
      // Refresh action
      if (item.dataset.action === 'refresh') {
        // Simple visual refresh - redraw wallpaper
        drawWallpaper();
      }
    });
  });
}
function hideContextMenu() {
  document.getElementById('context-menu').classList.remove('visible');
}

// ─── Global Events ───
document.getElementById('desktop').addEventListener('contextmenu', e => {
  e.preventDefault();
  showContextMenu(e.clientX, e.clientY);
});
document.addEventListener('click', e => {
  hideContextMenu();
  if (!e.target.closest('#start-menu') && !e.target.closest('.taskbar-btn')) {
    hideStartMenu();
  }
});
// Double-click title bar to maximize
document.addEventListener('dblclick', e => {
  const header = e.target.closest('.window-header');
  if (header && !e.target.closest('.window-controls')) {
    const win = header.closest('.window');
    const appId = win.id.replace('win-', '');
    if (windows[appId]) toggleMaximize(appId);
  }
});
// Keyboard support - Escape to close start menu
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    hideStartMenu();
    hideContextMenu();
  }
});

// Initial taskbar render
updateTaskbarButtons();
</script>
</body>
</html>
