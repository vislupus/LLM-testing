<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Desktop Clone</title>
    <style>
        :root {
            --taskbar-height: 48px;
            --taskbar-bg: rgba(22, 22, 23, 0.94);
            --win-bg: #fafafa;
            --win-titlebar: #f0f0f0;
            --win-border: #e0e0e0;
            --accent: #0067c0;
            --accent-hover: #005aa8;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.18);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.25);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --transition-fast: 0.12s ease;
            --transition-normal: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Segoe UI Variable', 'Helvetica Neue', Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a1a;
            cursor: default;
        }

        /* ============ DESKTOP / WALLPAPER ============ */
        .desktop {
            position: absolute;
            inset: 0;
            bottom: var(--taskbar-height);
            background:
                /* Base deep blue */
                radial-gradient(ellipse at 30% 40%, #1a3a5c 0%, #0b1a30 50%, #060e1c 100%),
                /* Bloom petals - large organic shapes */
                radial-gradient(ellipse at 55% 35%, #2d6fa8 0%, transparent 55%),
                radial-gradient(ellipse at 42% 50%, #1e5590 0%, transparent 50%),
                radial-gradient(ellipse at 65% 42%, #3a7dc4 0%, transparent 45%),
                radial-gradient(ellipse at 35% 32%, #4a90d9 0%, transparent 40%),
                radial-gradient(ellipse at 50% 28%, #5b9ee0 0%, transparent 38%),
                radial-gradient(ellipse at 58% 38%, #2670b8 0%, transparent 48%),
                /* Teal/purple accents */
                radial-gradient(ellipse at 40% 45%, #1e6b8a 0%, transparent 35%),
                radial-gradient(ellipse at 62% 33%, #3a5fcd 0%, transparent 30%),
                /* Central glow */
                radial-gradient(circle at 48% 36%, rgba(180, 210, 255, 0.25) 0%, transparent 28%),
                /* Subtle fabric texture overlay */
                radial-gradient(ellipse at 44% 38%, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 52% 34%, rgba(200, 220, 255, 0.06) 0%, transparent 45%),
                /* Bottom fade */
                linear-gradient(to bottom, transparent 75%, rgba(6, 14, 28, 0.7) 100%);
            background-blend-mode: normal, screen, screen, screen, screen, screen, screen, screen, screen, screen, screen,
                screen, normal;
            z-index: 0;
        }

        /* Subtle animated light rays on desktop */
        .desktop::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 48% 36%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            animation: subtlePulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes subtlePulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* ============ DESKTOP ICONS GRID ============ */
        .desktop-icons {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            padding: 18px 14px;
            gap: 6px;
            column-gap: 0;
            max-height: 100%;
            width: 130px;
        }
        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 90px;
            padding: 10px 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background var(--transition-fast);
            position: relative;
            text-align: center;
            min-height: 88px;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .desktop-icon:active {
            background: rgba(255, 255, 255, 0.2);
        }
        .desktop-icon.selected {
            background: rgba(255, 255, 255, 0.18);
            outline: 1.5px solid rgba(255, 255, 255, 0.5);
            outline-offset: -1px;
        }
        .desktop-icon .icon-img {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 4px;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            transition: transform var(--transition-fast);
        }
        .desktop-icon:hover .icon-img {
            transform: scale(1.06);
        }
        .desktop-icon .icon-label {
            font-size: 11.5px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
            line-height: 1.2;
            word-wrap: break-word;
            max-width: 80px;
            pointer-events: none;
            letter-spacing: 0.01em;
        }

        /* ============ TASKBAR ============ */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--taskbar-height);
            background: var(--taskbar-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -1px 8px rgba(0, 0, 0, 0.3);
        }
        .taskbar-left {
            position: absolute;
            left: 0;
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 4px;
            gap: 2px;
            z-index: 2;
        }
        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
            z-index: 1;
        }
        .taskbar-right {
            position: absolute;
            right: 0;
            height: 100%;
            display: flex;
            align-items: center;
            padding-right: 8px;
            gap: 2px;
            z-index: 2;
        }
        .taskbar-btn {
            width: 40px;
            height: 36px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast);
            position: relative;
        }
        .taskbar-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .taskbar-btn:active {
            background: rgba(255, 255, 255, 0.18);
        }
        .taskbar-btn.active-app {
            background: rgba(255, 255, 255, 0.14);
        }
        .taskbar-btn.active-app::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: #60cdff;
            border-radius: 2px;
        }
        .taskbar-btn.minimized-app {
            opacity: 0.7;
        }
        .taskbar-btn.minimized-app::after {
            background: #a0a0a0;
            width: 10px;
        }
        .start-btn {
            font-size: 20px;
            width: 42px;
        }
        .search-btn {
            font-size: 16px;
            width: 38px;
        }
        .system-tray {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background var(--transition-fast);
            height: 34px;
            white-space: nowrap;
        }
        .system-tray:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .tray-icon {
            font-size: 15px;
        }
        .tray-clock {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-align: right;
            line-height: 1.3;
        }
        .tray-clock .time {
            font-size: 12.5px;
        }
        .tray-clock .date {
            font-size: 11px;
            opacity: 0.8;
        }

        /* ============ START MENU ============ */
        .start-menu {
            position: absolute;
            bottom: calc(var(--taskbar-height) + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 540px;
            max-width: 95vw;
            background: rgba(40, 40, 45, 0.92);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: var(--shadow-lg);
            z-index: 99;
            padding: 20px 24px 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            color: #fff;
        }
        .start-menu.open {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }
        .start-menu-search {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
            transition: border var(--transition-fast);
        }
        .start-menu-search:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.13);
        }
        .start-menu-search::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .start-pinned {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .start-pinned-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background var(--transition-fast);
            font-size: 11px;
            text-align: center;
        }
        .start-pinned-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .start-pinned-item .pinned-icon {
            font-size: 28px;
        }
        .start-menu-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }
        .start-menu-footer .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #5b9ee0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* ============ WINDOWS ============ */
        .window {
            position: absolute;
            min-width: 320px;
            min-height: 200px;
            background: var(--win-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--win-border);
            transition: box-shadow var(--transition-normal);
            animation: windowOpen 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .window.focused {
            z-index: 50;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: var(--taskbar-height) !important;
            width: auto !important;
            height: auto !important;
            border-radius: 0 !important;
            min-width: 0;
            min-height: 0;
        }
        .window.minimized {
            opacity: 0;
            pointer-events: none;
            transform: translateY(40px) scale(0.9);
            transition: all 0.25s ease;
        }
        .window.hidden-window {
            display: none;
        }
        .window-titlebar {
            display: flex;
            align-items: center;
            height: 34px;
            background: var(--win-titlebar);
            padding: 0 6px 0 14px;
            cursor: default;
            flex-shrink: 0;
            border-bottom: 1px solid #e8e8e8;
        }
        .window-titlebar .win-title {
            flex: 1;
            font-size: 12.5px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }
        .win-controls {
            display: flex;
            gap: 2px;
            margin-left: auto;
        }
        .win-ctrl-btn {
            width: 34px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            transition: background var(--transition-fast), color var(--transition-fast);
        }
        .win-ctrl-btn:hover {
            background: #e0e0e0;
        }
        .win-ctrl-btn.close-btn:hover {
            background: #e81123;
            color: #fff;
        }
        .window-content {
            flex: 1;
            overflow: auto;
            position: relative;
            background: #fff;
        }
        .window-resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 16px;
            height: 16px;
            cursor: nwse-resize;
            z-index: 5;
            background: transparent;
        }
        .window.maximized .window-resize-handle {
            display: none;
        }

        /* ============ APP: NOTEPAD ============ */
        .notepad-textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            padding: 12px 16px;
            background: #fff;
            color: #1a1a1a;
            line-height: 1.6;
            user-select: text;
        }

        /* ============ APP: CALCULATOR ============ */
        .calculator {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #f5f5f5;
            font-family: 'Segoe UI', sans-serif;
        }
        .calc-display {
            background: #fff;
            padding: 16px 20px;
            text-align: right;
            font-size: 32px;
            font-weight: 300;
            color: #1a1a1a;
            min-height: 70px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            border-bottom: 1px solid #e0e0e0;
            letter-spacing: 0.02em;
            word-break: break-all;
        }
        .calc-display .calc-expression {
            font-size: 14px;
            color: #888;
            margin-right: 6px;
            font-weight: 400;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            flex: 1;
            padding: 1px;
            background: #e0e0e0;
        }
        .calc-btn {
            border: none;
            font-size: 17px;
            cursor: pointer;
            background: #fff;
            transition: background var(--transition-fast);
            font-weight: 400;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            color: #1a1a1a;
        }
        .calc-btn:hover {
            background: #e8e8e8;
        }
        .calc-btn:active {
            background: #d0d0d0;
        }
        .calc-btn.op-btn {
            background: #f0f0f0;
            font-weight: 500;
        }
        .calc-btn.op-btn:hover {
            background: #e0e0e0;
        }
        .calc-btn.equals-btn {
            background: #0067c0;
            color: #fff;
            font-weight: 600;
        }
        .calc-btn.equals-btn:hover {
            background: #005aa8;
        }
        .calc-btn.equals-btn:active {
            background: #004a90;
        }

        /* ============ APP: PAINT ============ */
        .paint-app {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #e8e8e8;
        }
        .paint-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: #f0f0f0;
            border-bottom: 1px solid #d0d0d0;
            flex-wrap: wrap;
        }
        .paint-tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 5px;
            border: 1.5px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all var(--transition-fast);
            background: #fff;
        }
        .paint-tool-btn:hover {
            background: #e0e0e0;
        }
        .paint-tool-btn.active-tool {
            border-color: #0067c0;
            background: #e3f0ff;
        }
        .paint-color-input {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #ccc;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
        }
        .paint-size-slider {
            width: 70px;
            cursor: pointer;
        }
        .paint-canvas-wrap {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #c8c8c8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .paint-canvas-wrap canvas {
            background: #fff;
            box-shadow: var(--shadow-md);
            cursor: crosshair;
            image-rendering: auto;
        }
        .paint-size-label {
            font-size: 11px;
            color: #555;
            min-width: 20px;
            text-align: center;
        }

        /* ============ APP: MS WORD ============ */
        .word-app {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #fff;
        }
        .word-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            background: #f8f8f8;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }
        .word-toolbar button {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #d0d0d0;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all var(--transition-fast);
            font-weight: 500;
            color: #333;
        }
        .word-toolbar button:hover {
            background: #e8e8e8;
        }
        .word-toolbar button.active-format {
            background: #d0e0f0;
            border-color: #0067c0;
            color: #0067c0;
        }
        .word-toolbar select {
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid #d0d0d0;
            font-size: 13px;
            cursor: pointer;
            background: #fff;
        }
        .word-editor {
            flex: 1;
            padding: 20px 28px;
            outline: none;
            font-size: 15px;
            line-height: 1.7;
            color: #1a1a1a;
            overflow-y: auto;
            user-select: text;
            font-family: 'Calibri', 'Segoe UI', sans-serif;
        }
        .word-editor:empty::before {
            content: 'Start typing your document...';
            color: #aaa;
        }

        /* ============ APP: FILE EXPLORER ============ */
        .explorer-app {
            display: flex;
            height: 100%;
            background: #fff;
        }
        .explorer-sidebar {
            width: 200px;
            background: #f5f5f5;
            border-right: 1px solid #e0e0e0;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .explorer-sidebar-item {
            padding: 9px 16px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background var(--transition-fast);
            color: #333;
            border-left: 3px solid transparent;
        }
        .explorer-sidebar-item:hover {
            background: #e8e8e8;
        }
        .explorer-sidebar-item.active-folder {
            background: #e0e8f0;
            border-left-color: #0067c0;
            font-weight: 500;
        }
        .explorer-main {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start;
        }
        .explorer-file {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            padding: 10px 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background var(--transition-fast);
            text-align: center;
            font-size: 11px;
            color: #333;
        }
        .explorer-file:hover {
            background: #e8e8e8;
        }
        .explorer-file .file-icon {
            font-size: 38px;
            margin-bottom: 3px;
        }
        .explorer-breadcrumb {
            padding: 8px 12px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ============ APP: CHROME ============ */
        .chrome-app {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #fff;
        }
        .chrome-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: #f8f8f8;
            border-bottom: 1px solid #e0e0e0;
        }
        .chrome-nav-btn {
            width: 30px;
            height: 28px;
            border-radius: 14px;
            border: 1px solid #d0d0d0;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast);
        }
        .chrome-nav-btn:hover {
            background: #e0e0e0;
        }
        .chrome-address-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: #fff;
            border: 1.5px solid #d0d0d0;
            border-radius: 20px;
            padding: 6px 14px;
            gap: 6px;
            transition: border var(--transition-fast);
        }
        .chrome-address-bar:focus-within {
            border-color: #0067c0;
            box-shadow: 0 0 0 3px rgba(0, 103, 192, 0.1);
        }
        .chrome-address-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 13px;
            background: transparent;
            color: #1a1a1a;
        }
        .chrome-content {
            flex: 1;
            display: flex;
        }
        .chrome-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .chrome-content .iframe-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #888;
            font-size: 14px;
            flex-direction: column;
            gap: 10px;
        }

        /* ============ CONTEXT MENU ============ */
        .context-menu {
            position: fixed;
            background: rgba(245, 245, 245, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            z-index: 200;
            min-width: 180px;
            padding: 4px 0;
            display: none;
            border: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 13px;
        }
        .context-menu.visible {
            display: block;
            animation: fadeIn 0.1s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .context-menu-item {
            padding: 8px 18px;
            cursor: pointer;
            transition: background var(--transition-fast);
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .context-menu-item:hover {
            background: #e0e0e0;
        }
        .context-menu-divider {
            height: 1px;
            background: #d0d0d0;
            margin: 4px 8px;
        }

        /* ============ OVERLAY (for start menu backdrop) ============ */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 98;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }
    </style>
</head>
<body>

    <!-- ==================== DESKTOP ==================== -->
    <div class="desktop" id="desktop">
        <div class="desktop-icons" id="desktopIcons">
            <div class="desktop-icon" data-app="word" ondblclick="openApp('word')" onclick="selectIcon(this)">
                <div class="icon-img">📘</div>
                <div class="icon-label">Word</div>
            </div>
            <div class="desktop-icon" data-app="paint" ondblclick="openApp('paint')" onclick="selectIcon(this)">
                <div class="icon-img">🎨</div>
                <div class="icon-label">Paint</div>
            </div>
            <div class="desktop-icon" data-app="calculator" ondblclick="openApp('calculator')" onclick="selectIcon(this)">
                <div class="icon-img">🧮</div>
                <div class="icon-label">Calculator</div>
            </div>
            <div class="desktop-icon" data-app="notepad" ondblclick="openApp('notepad')" onclick="selectIcon(this)">
                <div class="icon-img">📝</div>
                <div class="icon-label">Notepad</div>
            </div>
            <div class="desktop-icon" data-app="explorer" ondblclick="openApp('explorer')" onclick="selectIcon(this)">
                <div class="icon-img">📁</div>
                <div class="icon-label">File Explorer</div>
            </div>
            <div class="desktop-icon" data-app="chrome" ondblclick="openApp('chrome')" onclick="selectIcon(this)">
                <div class="icon-img">🌐</div>
                <div class="icon-label">Chrome</div>
            </div>
        </div>
    </div>

    <!-- ==================== TASKBAR ==================== -->
    <div class="taskbar" id="taskbar">
        <div class="taskbar-left">
            <button class="taskbar-btn start-btn" id="startBtn" title="Start" onclick="toggleStartMenu()">⊞</button>
            <button class="taskbar-btn search-btn" title="Search">🔍</button>
        </div>
        <div class="taskbar-center" id="taskbarApps">
            <!-- Running apps appear here -->
        </div>
        <div class="taskbar-right">
            <div class="system-tray" id="systemTray">
                <span class="tray-icon">📶</span>
                <span class="tray-icon">🔊</span>
                <span class="tray-icon">🔋</span>
                <span class="tray-clock" id="trayClock">
                    <div class="time" id="trayTime">12:00</div>
                    <div class="date" id="trayDate">1/1/2025</div>
                </span>
            </div>
            <button class="taskbar-btn" style="font-size:14px;" title="Show desktop">▬</button>
        </div>
    </div>

    <!-- ==================== START MENU ==================== -->
    <div class="overlay" id="overlay" onclick="closeStartMenu()"></div>
    <div class="start-menu" id="startMenu">
        <input type="text" class="start-menu-search" placeholder="🔍  Type to search" readonly>
        <div class="start-pinned">
            <div class="start-pinned-item" onclick="openApp('word');closeStartMenu();">
                <span class="pinned-icon">📘</span><span>Word</span>
            </div>
            <div class="start-pinned-item" onclick="openApp('paint');closeStartMenu();">
                <span class="pinned-icon">🎨</span><span>Paint</span>
            </div>
            <div class="start-pinned-item" onclick="openApp('calculator');closeStartMenu();">
                <span class="pinned-icon">🧮</span><span>Calculator</span>
            </div>
            <div class="start-pinned-item" onclick="openApp('notepad');closeStartMenu();">
                <span class="pinned-icon">📝</span><span>Notepad</span>
            </div>
            <div class="start-pinned-item" onclick="openApp('explorer');closeStartMenu();">
                <span class="pinned-icon">📁</span><span>Explorer</span>
            </div>
            <div class="start-pinned-item" onclick="openApp('chrome');closeStartMenu();">
                <span class="pinned-icon">🌐</span><span>Chrome</span>
            </div>
        </div>
        <div class="start-menu-footer">
            <div class="user-avatar">👤</div>
            <span>User</span>
        </div>
    </div>

    <!-- ==================== CONTEXT MENU ==================== -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="refreshDesktop()">🔄 Refresh</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item">🖼️ View</div>
        <div class="context-menu-item">🔍 Sort by</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" onclick="openApp('notepad')">📝 New Text Document</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item">⚙️ Display settings</div>
        <div class="context-menu-item">🎨 Personalize</div>
    </div>

    <!-- ==================== WINDOWS ==================== -->
    <div id="windowsContainer"></div>

    <script>
        (function() {
            // ============ STATE ============
            const appConfigs = {
                word: {
                    name: 'Word',
                    icon: '📘',
                    width: 720,
                    height: 500,
                    x: 80,
                    y: 60,
                    taskbarIcon: '📘'
                },
                paint: {
                    name: 'Paint',
                    icon: '🎨',
                    width: 700,
                    height: 460,
                    x: 120,
                    y: 80,
                    taskbarIcon: '🎨'
                },
                calculator: {
                    name: 'Calculator',
                    icon: '🧮',
                    width: 340,
                    height: 440,
                    x: 160,
                    y: 100,
                    taskbarIcon: '🧮'
                },
                notepad: {
                    name: 'Notepad',
                    icon: '📝',
                    width: 500,
                    height: 380,
                    x: 200,
                    y: 120,
                    taskbarIcon: '📝'
                },
                explorer: {
                    name: 'File Explorer',
                    icon: '📁',
                    width: 650,
                    height: 420,
                    x: 140,
                    y: 90,
                    taskbarIcon: '📁'
                },
                chrome: {
                    name: 'Chrome',
                    icon: '🌐',
                    width: 750,
                    height: 500,
                    x: 100,
                    y: 70,
                    taskbarIcon: '🌐'
                }
            };

            const appStates = {};
            let windowZIndex = 10;
            let activeWindowId = null;
            let startMenuOpen = false;
            let selectedIcon = null;

            // Initialize app states
            Object.keys(appConfigs).forEach(key => {
                appStates[key] = {
                    isOpen: false,
                    isMinimized: false,
                    isMaximized: false,
                    x: appConfigs[key].x,
                    y: appConfigs[key].y,
                    width: appConfigs[key].width,
                    height: appConfigs[key].height,
                    windowEl: null,
                    taskbarBtn: null,
                };
            });

            // ============ DOM REFS ============
            const windowsContainer = document.getElementById('windowsContainer');
            const taskbarApps = document.getElementById('taskbarApps');
            const desktop = document.getElementById('desktop');
            const contextMenu = document.getElementById('contextMenu');
            const overlay = document.getElementById('overlay');
            const startMenu = document.getElementById('startMenu');
            const startBtn = document.getElementById('startBtn');
            const trayTime = document.getElementById('trayTime');
            const trayDate = document.getElementById('trayDate');

            // ============ CLOCK ============
            function updateClock() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const mins = now.getMinutes().toString().padStart(2, '0');
                trayTime.textContent = `${hours}:${mins}`;
                trayDate.textContent = now.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric',
                year: 'numeric' });
            }
            updateClock();
            setInterval(updateClock, 15000);

            // ============ START MENU ============
            function toggleStartMenu() {
                if (startMenuOpen) {
                    closeStartMenu();
                } else {
                    openStartMenu();
                }
            }

            function openStartMenu() {
                startMenuOpen = true;
                startMenu.classList.add('open');
                overlay.classList.add('visible');
                startBtn.classList.add('active-app');
            }

            function closeStartMenu() {
                startMenuOpen = false;
                startMenu.classList.remove('open');
                overlay.classList.remove('visible');
                startBtn.classList.remove('active-app');
            }

            // ============ CONTEXT MENU ============
            desktop.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                const x = e.clientX;
                const y = e.clientY;
                contextMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
                contextMenu.style.top = Math.min(y, window.innerHeight - 260) + 'px';
                contextMenu.classList.add('visible');
                closeStartMenu();
            });

            document.addEventListener('click', function(e) {
                if (!contextMenu.contains(e.target)) {
                    contextMenu.classList.remove('visible');
                }
            });

            function refreshDesktop() {
                contextMenu.classList.remove('visible');
                const icons = document.querySelectorAll('.desktop-icon');
                icons.forEach(i => i.classList.remove('selected'));
                selectedIcon = null;
                // Subtle flash effect
                desktop.style.filter = 'brightness(1.05)';
                setTimeout(() => { desktop.style.filter = ''; }, 150);
            }

            // ============ DESKTOP ICON SELECTION ============
            function selectIcon(el) {
                document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
                el.classList.add('selected');
                selectedIcon = el;
                closeStartMenu();
            }
            window.selectIcon = selectIcon;

            desktop.addEventListener('click', function(e) {
                if (e.target === desktop || e.target.classList.contains('desktop-icons')) {
                    document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove(
                        'selected'));
                    selectedIcon = null;
                    closeStartMenu();
                    contextMenu.classList.remove('visible');
                }
            });

            // ============ WINDOW MANAGEMENT ============
            function createWindowElement(appKey) {
                const config = appConfigs[appKey];
                const state = appStates[appKey];

                const win = document.createElement('div');
                win.className = 'window';
                win.dataset.app = appKey;
                win.style.left = state.x + 'px';
                win.style.top = state.y + 'px';
                win.style.width = state.width + 'px';
                win.style.height = state.height + 'px';
                win.style.zIndex = ++windowZIndex;
                win.id = 'window-' + appKey;

                // Title bar
                const titlebar = document.createElement('div');
                titlebar.className = 'window-titlebar';
                titlebar.innerHTML = `
                    <span class="win-title">${config.icon} ${config.name}</span>
                    <div class="win-controls">
                        <button class="win-ctrl-btn minimize-btn" title="Minimize">─</button>
                        <button class="win-ctrl-btn maximize-btn" title="Maximize">□</button>
                        <button class="win-ctrl-btn close-btn" title="Close">✕</button>
                    </div>
                `;

                // Content
                const content = document.createElement('div');
                content.className = 'window-content';
                content.id = 'content-' + appKey;
                content.innerHTML = getAppContent(appKey);

                // Resize handle
                const resizeHandle = document.createElement('div');
                resizeHandle.className = 'window-resize-handle';

                win.appendChild(titlebar);
                win.appendChild(content);
                win.appendChild(resizeHandle);
                windowsContainer.appendChild(win);

                state.windowEl = win;
                state.isOpen = true;
                state.isMinimized = false;
                state.isMaximized = false;

                // Event: Focus on click
                win.addEventListener('mousedown', function(e) {
                    if (e.target.closest('.win-ctrl-btn') || e.target.closest('.window-resize-handle'))
                        return;
                    focusWindow(appKey);
                });

                // Title bar double-click to maximize
                titlebar.addEventListener('dblclick', function(e) {
                    if (e.target.closest('.win-ctrl-btn')) return;
                    toggleMaximize(appKey);
                });

                // Control buttons
                const minimizeBtn = titlebar.querySelector('.minimize-btn');
                const maximizeBtn = titlebar.querySelector('.maximize-btn');
                const closeBtn = titlebar.querySelector('.close-btn');

                minimizeBtn.addEventListener('click', (e) => { e.stopPropagation();
                    minimizeWindow(appKey); });
                maximizeBtn.addEventListener('click', (e) => { e.stopPropagation();
                    toggleMaximize(appKey); });
                closeBtn.addEventListener('click', (e) => { e.stopPropagation();
                    closeWindow(appKey); });

                // Dragging
                let isDragging = false;
                let dragStartX, dragStartY, winStartX, winStartY;

                titlebar.addEventListener('mousedown', function(e) {
                    if (e.target.closest('.win-ctrl-btn')) return;
                    if (state.isMaximized) return;
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    winStartX = parseInt(win.style.left) || state.x;
                    winStartY = parseInt(win.style.top) || state.y;
                    win.style.transition = 'none';
                    document.body.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', function(e) {
                    if (!isDragging) return;
                    const dx = e.clientX - dragStartX;
                    const dy = e.clientY - dragStartY;
                    let newX = winStartX + dx;
                    let newY = winStartY + dy;
                    newX = Math.max(-100, Math.min(window.innerWidth - 100, newX));
                    newY = Math.max(0, Math.min(window.innerHeight - 60, newY));
                    win.style.left = newX + 'px';
                    win.style.top = newY + 'px';
                    state.x = newX;
                    state.y = newY;
                });

                document.addEventListener('mouseup', function() {
                    if (isDragging) {
                        isDragging = false;
                        win.style.transition = '';
                        document.body.style.cursor = '';
                    }
                });

                // Resize
                let isResizing = false;
                let resizeStartX, resizeStartY, resizeStartW, resizeStartH;

                resizeHandle.addEventListener('mousedown', function(e) {
                    if (state.isMaximized) return;
                    isResizing = true;
                    resizeStartX = e.clientX;
                    resizeStartY = e.clientY;
                    resizeStartW = parseInt(win.style.width) || state.width;
                    resizeStartH = parseInt(win.style.height) || state.height;
                    win.style.transition = 'none';
                    e.preventDefault();
                    e.stopPropagation();
                });

                document.addEventListener('mousemove', function(e) {
                    if (!isResizing) return;
                    const dx = e.clientX - resizeStartX;
                    const dy = e.clientY - resizeStartY;
                    let newW = Math.max(320, resizeStartW + dx);
                    let newH = Math.max(200, resizeStartH + dy);
                    win.style.width = newW + 'px';
                    win.style.height = newH + 'px';
                    state.width = newW;
                    state.height = newH;
                });

                document.addEventListener('mouseup', function() {
                    if (isResizing) {
                        isResizing = false;
                        win.style.transition = '';
                    }
                });

                // Initialize app-specific functionality
                initAppFunctionality(appKey, content);

                return win;
            }

            function focusWindow(appKey) {
                const state = appStates[appKey];
                if (!state.windowEl || !state.isOpen) return;
                if (state.isMinimized) {
                    restoreWindow(appKey);
                }
                state.windowEl.style.zIndex = ++windowZIndex;
                state.windowEl.classList.add('focused');
                activeWindowId = appKey;
                // Remove focused from others
                Object.keys(appStates).forEach(k => {
                    if (k !== appKey && appStates[k].windowEl) {
                        appStates[k].windowEl.classList.remove('focused');
                    }
                });
                // Update taskbar
                updateTaskbarButtons();
                closeStartMenu();
            }

            function minimizeWindow(appKey) {
                const state = appStates[appKey];
                if (!state.windowEl) return;
                state.isMinimized = true;
                state.windowEl.classList.add('minimized');
                state.windowEl.style.zIndex = --windowZIndex;
                if (activeWindowId === appKey) activeWindowId = null;
                updateTaskbarButtons();
            }

            function restoreWindow(appKey) {
                const state = appStates[appKey];
                if (!state.windowEl) return;
                state.isMinimized = false;
                state.windowEl.classList.remove('minimized');
                focusWindow(appKey);
                updateTaskbarButtons();
            }

            function toggleMaximize(appKey) {
                const state = appStates[appKey];
                if (!state.windowEl) return;
                if (state.isMinimized) restoreWindow(appKey);
                if (state.isMaximized) {
                    // Restore
                    state.isMaximized = false;
                    state.windowEl.classList.remove('maximized');
                    state.windowEl.style.left = state.x + 'px';
                    state.windowEl.style.top = state.y + 'px';
                    state.windowEl.style.width = state.width + 'px';
                    state.windowEl.style.height = state.height + 'px';
                    const resizeHandle = state.windowEl.querySelector('.window-resize-handle');
                    if (resizeHandle) resizeHandle.style.display = '';
                    const maxBtn = state.windowEl.querySelector('.maximize-btn');
                    if (maxBtn) maxBtn.textContent = '□';
                } else {
                    // Store current position/size before maximizing
                    state.x = parseInt(state.windowEl.style.left) || state.x;
                    state.y = parseInt(state.windowEl.style.top) || state.y;
                    state.width = parseInt(state.windowEl.style.width) || state.width;
                    state.height = parseInt(state.windowEl.style.height) || state.height;
                    state.isMaximized = true;
                    state.windowEl.classList.add('maximized');
                    state.windowEl.style.left = '0';
                    state.windowEl.style.top = '0';
                    state.windowEl.style.width = '100%';
                    state.windowEl.style.height = 'calc(100% - var(--taskbar-height))';
                    const resizeHandle = state.windowEl.querySelector('.window-resize-handle');
                    if (resizeHandle) resizeHandle.style.display = 'none';
                    const maxBtn = state.windowEl.querySelector('.maximize-btn');
                    if (maxBtn) maxBtn.textContent = '❐';
                }
                focusWindow(appKey);
                // Reinitialize paint canvas if needed
                if (appKey === 'paint') {
                    setTimeout(() => initPaintCanvas(appKey), 100);
                }
            }

            function closeWindow(appKey) {
                const state = appStates[appKey];
                if (!state.windowEl) return;
                state.windowEl.classList.add('hidden-window');
                state.isOpen = false;
                state.isMinimized = false;
                state.isMaximized = false;
                if (activeWindowId === appKey) activeWindowId = null;
                updateTaskbarButtons();
                // Remove after animation
                setTimeout(() => {
                    if (state.windowEl && state.windowEl.parentNode) {
                        state.windowEl.parentNode.removeChild(state.windowEl);
                    }
                    state.windowEl = null;
                }, 300);
            }

            function openApp(appKey) {
                const state = appStates[appKey];
                if (state.isOpen && state.windowEl && !state.isMinimized) {
                    // Already open and visible - just focus
                    focusWindow(appKey);
                    return;
                }
                if (state.isOpen && state.isMinimized) {
                    restoreWindow(appKey);
                    return;
                }
                // Create new window
                const win = createWindowElement(appKey);
                state.windowEl = win;
                state.isOpen = true;
                state.isMinimized = false;
                focusWindow(appKey);
                updateTaskbarButtons();
                closeStartMenu();
            }
            window.openApp = openApp;

            function updateTaskbarButtons() {
                taskbarApps.innerHTML = '';
                Object.keys(appStates).forEach(key => {
                    const state = appStates[key];
                    const config = appConfigs[key];
                    if (state.isOpen || state.windowEl) {
                        const btn = document.createElement('button');
                        btn.className = 'taskbar-btn';
                        btn.title = config.name;
                        btn.textContent = config.taskbarIcon;
                        btn.style.fontSize = '18px';
                        if (state.isMinimized) {
                            btn.classList.add('minimized-app');
                        }
                        if (key === activeWindowId && !state.isMinimized) {
                            btn.classList.add('active-app');
                        }
                        btn.addEventListener('click', () => {
                            if (state.isMinimized) {
                                restoreWindow(key);
                            } else if (key === activeWindowId) {
                                minimizeWindow(key);
                            } else {
                                focusWindow(key);
                            }
                        });
                        taskbarApps.appendChild(btn);
                        state.taskbarBtn = btn;
                    }
                });
            }

            // ============ APP CONTENT GENERATORS ============
            function getAppContent(appKey) {
                switch (appKey) {
                    case 'notepad':
                        return `<textarea class="notepad-textarea" id="notepadTextarea" placeholder="Type here...">Hello from Notepad!
        This is a simple text editor.
        You can type anything you want here.</textarea>`;
                    case 'calculator':
                        return `
                        <div class="calculator">
                            <div class="calc-display">
                                <span class="calc-expression" id="calcExpr"></span>
                                <span id="calcResult">0</span>
                            </div>
                            <div class="calc-buttons" id="calcButtons">
                                <button class="calc-btn" data-action="clear">C</button>
                                <button class="calc-btn" data-action="paren">( )</button>
                                <button class="calc-btn" data-action="percent">%</button>
                                <button class="calc-btn op-btn" data-action="divide">÷</button>
                                <button class="calc-btn" data-action="digit" data-value="7">7</button>
                                <button class="calc-btn" data-action="digit" data-value="8">8</button>
                                <button class="calc-btn" data-action="digit" data-value="9">9</button>
                                <button class="calc-btn op-btn" data-action="multiply">×</button>
                                <button class="calc-btn" data-action="digit" data-value="4">4</button>
                                <button class="calc-btn" data-action="digit" data-value="5">5</button>
                                <button class="calc-btn" data-action="digit" data-value="6">6</button>
                                <button class="calc-btn op-btn" data-action="subtract">−</button>
                                <button class="calc-btn" data-action="digit" data-value="1">1</button>
                                <button class="calc-btn" data-action="digit" data-value="2">2</button>
                                <button class="calc-btn" data-action="digit" data-value="3">3</button>
                                <button class="calc-btn op-btn" data-action="add">+</button>
                                <button class="calc-btn" data-action="digit" data-value="0" style="grid-column:span 2;">0</button>
                                <button class="calc-btn" data-action="decimal">.</button>
                                <button class="calc-btn equals-btn" data-action="equals">=</button>
                            </div>
                        </div>`;
                    case 'paint':
                        return `

                                <input type="color" class="paint-color-input" id="paintColor" value="#000000" title="Color">
                                <span class="paint-size-label">Size:</span>
                                <input type="range" class="paint-size-slider" id="paintSize" min="1" max="20" value="3" title="Brush size">
                                <span class="paint-size-label" id="paintSizeLabel">3px</span>

                    case 'word':
                        return `

                                <button id="wordItalic" title="Italic"><i>I</i></button>
                                <button id="wordUnderline" title="Underline"><u>U</u></button>

                            </div>
                            <div class="word-editor" id="wordEditor" contenteditable="true">
                                <p><b>Welcome to Word!</b></p>
                                <p>This is a simple rich text editor. You can <i>format</i> your <u>text</u> using the toolbar above.</p>
                                <p>Try selecting text and using the formatting buttons!</p>
                            </div>
                        </div>`;
                    case 'explorer':
                        return `
                        <div class="explorer-app">
                            <div class="explorer-sidebar">
                                <div class="explorer-sidebar-item active-folder" data-folder="home">🏠 Home</div>
                                <div class="explorer-sidebar-item" data-folder="documents">📄 Documents</div>
                                <div class="explorer-sidebar-item" data-folder="pictures">🖼️ Pictures</div>
                                <div class="explorer-sidebar-item" data-folder="music">🎵 Music</div>
                                <div class="explorer-sidebar-item" data-folder="downloads">⬇ Downloads</div>
                                <div class="explorer-sidebar-item" data-folder="desktop">🖥️ Desktop</div>

                            <div style="display:flex;flex-direction:column;flex:1;">

                                <div class="explorer-main" id="explorerMain">
                                    <div class="explorer-file"><span class="file-icon">📄</span>Report.docx</div>
                                    <div class="explorer-file"><span class="file-icon">📊</span>Data.xlsx</div>
                                    <div class="explorer-file"><span class="file-icon">🖼️</span>Photo.jpg</div>
                                    <div class="explorer-file"><span class="file-icon">📝</span>Notes.txt</div>
                                    <div class="explorer-file"><span class="file-icon">📁</span>Projects</div>
                                    <div class="explorer-file"><span class="file-icon">🎵</span>Song.mp3</div>
                                    <div class="explorer-file"><span class="file-icon">🎬</span>Video.mp4</div>
                                    <div class="explorer-file"><span class="file-icon">📘</span>Manual.pdf</div>

                    case 'chrome':
                        return `
                        <div class="chrome-app">
                            <div class="chrome-toolbar">
                                <button class="chrome-nav-btn" id="chromeBack" title="Back">←</button>
                                <button class="chrome-nav-btn" id="chromeForward" title="Forward">→</button>
                                <button class="chrome-nav-btn" id="chromeRefresh" title="Refresh">↻</button>
                                <div class="chrome-address-bar">
                                    <span>🔒</span>
                                    <input type="text" id="chromeUrl" value="https://en.wikipedia.org" placeholder="Search or enter URL">
                                    <span style="cursor:pointer;" id="chromeGo" title="Go">▶</span>

                            <div class="chrome-content" id="chromeContent">
                                <iframe id="chromeFrame" src="https://en.wikipedia.org" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"></iframe>

                    default:
                        return '<div style="padding:20px;">App content</div>';
