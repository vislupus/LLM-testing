            // ============ APP INITIALIZATION ============
            function initAppFunctionality(appKey, contentEl) {
                switch (appKey) {
                    case 'calculator':
                        initCalculator(contentEl);
                        break;
                    case 'paint':
                        setTimeout(() => initPaintCanvas(appKey), 150);
                        break;
                    case 'word':
                        initWordEditor(contentEl);
                        break;
                    case 'explorer':
                        initExplorer(contentEl);
                        break;
                    case 'chrome':
                        initChrome(contentEl);
                        break;
                }
            }

            // Calculator
            function initCalculator(contentEl) {
                const calcResult = contentEl.querySelector('#calcResult');
                const calcExpr = contentEl.querySelector('#calcExpr');
                let currentInput = '0';
                let expression = '';
                let shouldResetInput = false;
                let lastOperator = null;

                const buttons = contentEl.querySelectorAll('.calc-btn');
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const action = btn.dataset.action;
                        const value = btn.dataset.value;

                        if (action === 'digit') {
                            if (shouldResetInput || currentInput === '0') {
                                currentInput = value;
                                shouldResetInput = false;
                            } else {
                                currentInput += value;
                            }
                        } else if (action === 'decimal') {
                            if (shouldResetInput) { currentInput = '0';
                                shouldResetInput = false; }
                            if (!currentInput.includes('.')) currentInput += '.';
                        } else if (action === 'add' || action === 'subtract' || action === 'multiply' || action ===
                            'divide') {
                            const opMap = { add: '+', subtract: '−', multiply: '×', divide: '÷' };
                            const op = opMap[action];
                            if (expression && !shouldResetInput) {
                                expression += currentInput;
                            } else if (!expression) {
                                expression = currentInput;
                            }
                            expression += ' ' + op + ' ';
                            shouldResetInput = true;
                            lastOperator = op;
                        } else if (action === 'equals') {
                            if (expression || lastOperator) {
                                const fullExpr = expression + currentInput;
                                const cleanExpr = fullExpr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g,
                                    '-');
                                try {
                                    const result = Function('"use strict";return (' + cleanExpr + ')')();
                                    const formatted = Number.isInteger(result) ? result.toString() : parseFloat(
                                        result.toFixed(8)).toString();
                                    calcExpr.textContent = fullExpr + ' =';
                                    currentInput = formatted;
                                    expression = '';
                                    shouldResetInput = true;
                                    lastOperator = null;
                                } catch (e) {
                                    currentInput = 'Error';
                                    expression = '';
                                    shouldResetInput = true;
                                    lastOperator = null;
                                }
                            }
                        } else if (action === 'clear') {
                            currentInput = '0';
                            expression = '';
                            shouldResetInput = false;
                            lastOperator = null;
                            calcExpr.textContent = '';
                        } else if (action === 'percent') {
                            const num = parseFloat(currentInput);
                            if (!isNaN(num)) {
                                currentInput = (num / 100).toString();
                            }
                        }

                        calcResult.textContent = currentInput;
                        if (action === 'equals' || action === 'clear') {
                            if (action === 'clear') calcExpr.textContent = '';
                        }
                    });
                });
            }

            // Paint
            function initPaintCanvas(appKey) {
                const state = appStates[appKey];
                if (!state || !state.windowEl) return;
                const canvas = state.windowEl.querySelector('#paintCanvas');
                if (!canvas) return;
                const wrap = state.windowEl.querySelector('#paintCanvasWrap');
                if (!wrap || !canvas.isConnected) return;

                // Adjust canvas size to fit wrap
                const rect = wrap.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    canvas.width = Math.max(300, rect.width - 10);
                    canvas.height = Math.max(200, rect.height - 10);
                }

                const ctx = canvas.getContext('2d');
                // Draw white background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let isDrawing = false;
                let currentTool = 'pen';
                let currentColor = '#000000';
                let currentSize = 3;

                const colorInput = state.windowEl.querySelector('#paintColor');
                const sizeSlider = state.windowEl.querySelector('#paintSize');
                const sizeLabel = state.windowEl.querySelector('#paintSizeLabel');
                const clearBtn = state.windowEl.querySelector('#paintClear');
                const toolBtns = state.windowEl.querySelectorAll('.paint-tool-btn[data-tool]');

                if (colorInput) {
                    colorInput.addEventListener('input', () => { currentColor = colorInput.value; });
                    currentColor = colorInput.value;
                }
                if (sizeSlider && sizeLabel) {
                    sizeSlider.addEventListener('input', () => {
                        currentSize = parseInt(sizeSlider.value);
                        sizeLabel.textContent = currentSize + 'px';
                    });
                    currentSize = parseInt(sizeSlider.value);
                }
                if (clearBtn) {
                    clearBtn.addEventListener('click', () => {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    });
                }
                toolBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        toolBtns.forEach(b => b.classList.remove('active-tool'));
                        btn.classList.add('active-tool');
                        currentTool = btn.dataset.tool;
                    });
                });

                function getPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    return {
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    };
                }

                canvas.onmousedown = function(e) {
                    isDrawing = true;
                    const pos = getPos(e);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    if (currentTool === 'eraser') {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = currentSize * 3;
                    } else {
                        ctx.strokeStyle = currentColor;
                        ctx.lineWidth = currentSize;
                    }
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                };
                canvas.onmousemove = function(e) {
                    if (!isDrawing) return;
                    const pos = getPos(e);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                };
                canvas.onmouseup = function() { isDrawing = false;
                    ctx.beginPath(); };
                canvas.onmouseleave = function() { isDrawing = false;
                    ctx.beginPath(); };

                // Touch support
                canvas.ontouchstart = function(e) {
                    e.preventDefault();
                    isDrawing = true;
                    const pos = getPos(e.touches[0]);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    if (currentTool === 'eraser') {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = currentSize * 3;
                    } else {
                        ctx.strokeStyle = currentColor;
                        ctx.lineWidth = currentSize;
                    }
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                };
                canvas.ontouchmove = function(e) {
                    e.preventDefault();
                    if (!isDrawing) return;
                    const pos = getPos(e.touches[0]);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                };
                canvas.ontouchend = function() { isDrawing = false;
                    ctx.beginPath(); };
            }

            // Word Editor
            function initWordEditor(contentEl) {
                const editor = contentEl.querySelector('#wordEditor');
                const boldBtn = contentEl.querySelector('#wordBold');
                const italicBtn = contentEl.querySelector('#wordItalic');
                const underlineBtn = contentEl.querySelector('#wordUnderline');
                const fontSizeSelect = contentEl.querySelector('#wordFontSize');
                const fontFamilySelect = contentEl.querySelector('#wordFontFamily');
                const alignLeft = contentEl.querySelector('#wordAlignLeft');
                const alignCenter = contentEl.querySelector('#wordAlignCenter');
                const alignRight = contentEl.querySelector('#wordAlignRight');

                function execCmd(command, value = null) {
                    editor.focus();
                    document.execCommand(command, false, value);
                    updateFormatButtons();
                }

                function updateFormatButtons() {
                    if (boldBtn) boldBtn.classList.toggle('active-format', document.queryCommandState('bold'));
                    if (italicBtn) italicBtn.classList.toggle('active-format', document.queryCommandState('italic'));
                    if (underlineBtn) underlineBtn.classList.toggle('active-format', document.queryCommandState(
                        'underline'));
                }

                if (boldBtn) boldBtn.addEventListener('click', () => execCmd('bold'));
                if (italicBtn) italicBtn.addEventListener('click', () => execCmd('italic'));
                if (underlineBtn) underlineBtn.addEventListener('click', () => execCmd('underline'));
                if (fontSizeSelect) fontSizeSelect.addEventListener('change', () => execCmd('fontSize', fontSizeSelect
                    .value));
                if (fontFamilySelect) fontFamilySelect.addEventListener('change', () => execCmd('fontName',
                    fontFamilySelect.value));
                if (alignLeft) alignLeft.addEventListener('click', () => execCmd('justifyLeft'));
                if (alignCenter) alignCenter.addEventListener('click', () => execCmd('justifyCenter'));
                if (alignRight) alignRight.addEventListener('click', () => execCmd('justifyRight'));

                editor.addEventListener('keyup', updateFormatButtons);
                editor.addEventListener('mouseup', updateFormatButtons);
            }

            // Explorer
            function initExplorer(contentEl) {
                const sidebarItems = contentEl.querySelectorAll('.explorer-sidebar-item');
                const explorerMain = contentEl.querySelector('#explorerMain');
                const breadcrumb = contentEl.querySelector('.explorer-breadcrumb');

                const folderContents = {
                    home: [
                        { icon: '📄', name: 'Report.docx' }, { icon: '📊', name: 'Data.xlsx' },
                        { icon: '🖼️', name: 'Photo.jpg' }, { icon: '📝', name: 'Notes.txt' },
                        { icon: '📁', name: 'Projects' }, { icon: '🎵', name: 'Song.mp3' },
                    ],
                    documents: [
                        { icon: '📄', name: 'Resume.docx' }, { icon: '📄', name: 'CoverLetter.docx' },
                        { icon: '📘', name: 'Handbook.pdf' }, { icon: '📝', name: 'Todo.txt' },
                    ],
                    pictures: [
                        { icon: '🖼️', name: 'Vacation.jpg' }, { icon: '🖼️', name: 'Family.png' },
                        { icon: '🖼️', name: 'Screenshot.png' }, { icon: '🖼️', name: 'Wallpaper.jpg' },
                    ],
                    music: [
                        { icon: '🎵', name: 'Track01.mp3' }, { icon: '🎵', name: 'Podcast.mp3' },
                        { icon: '🎵', name: 'Playlist.m3u' },
                    ],
                    downloads: [
                        { icon: '📦', name: 'Setup.exe' }, { icon: '📄', name: 'Invoice.pdf' },
                        { icon: '🗜️', name: 'Archive.zip' },
                    ],
                    desktop: [
                        { icon: '📘', name: 'Word.lnk' }, { icon: '🎨', name: 'Paint.lnk' },
                        { icon: '🧮', name: 'Calculator.lnk' }, { icon: '📝', name: 'Notepad.lnk' },
                    ],
                };

                sidebarItems.forEach(item => {
                    item.addEventListener('click', () => {
                        sidebarItems.forEach(i => i.classList.remove('active-folder'));
                        item.classList.add('active-folder');
                        const folder = item.dataset.folder;
                        const label = item.textContent.trim();
                        if (breadcrumb) breadcrumb.textContent = '📁 ' + label;
                        if (explorerMain && folderContents[folder]) {
                            explorerMain.innerHTML = folderContents[folder].map(f =>
                                `<div class="explorer-file"><span class="file-icon">${f.icon}</span>${f.name}</div>`
                            ).join('');
                        }
                    });
                });
            }

            // Chrome
            function initChrome(contentEl) {
                const urlInput = contentEl.querySelector('#chromeUrl');
                const iframe = contentEl.querySelector('#chromeFrame');
                const goBtn = contentEl.querySelector('#chromeGo');
                const backBtn = contentEl.querySelector('#chromeBack');
                const forwardBtn = contentEl.querySelector('#chromeForward');
                const refreshBtn = contentEl.querySelector('#chromeRefresh');
                const chromeContent = contentEl.querySelector('#chromeContent');

                let historyStack = ['https://en.wikipedia.org'];
                let historyIndex = 0;

                function navigateTo(url) {
                    if (!url) return;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) {
                        if (url.includes('.') && !url.includes(' ')) {
                            url = 'https://' + url;
                        } else {
                            url = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(url.replace(/\s+/g, '_'));
                        }
                    }
                    urlInput.value = url;
                    if (iframe) {
                        iframe.src = url;
                    }
                    if (historyIndex < historyStack.length - 1) {
                        historyStack = historyStack.slice(0, historyIndex + 1);
                    }
                    historyStack.push(url);
                    historyIndex = historyStack.length - 1;
                }

                if (goBtn) goBtn.addEventListener('click', () => navigateTo(urlInput.value));
                if (urlInput) urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigateTo(urlInput
                        .value); });
                if (backBtn) backBtn.addEventListener('click', () => {
                    if (historyIndex > 0) { historyIndex--;
                        urlInput.value = historyStack[historyIndex]; if (iframe) iframe.src = historyStack[
                            historyIndex
                        ]; }
                });
                if (forwardBtn) forwardBtn.addEventListener('click', () => {
                    if (historyIndex < historyStack.length - 1) { historyIndex++;
                        urlInput.value = historyStack[historyIndex]; if (iframe) iframe.src = historyStack[
                            historyIndex
                        ]; }
                });
                if (refreshBtn) refreshBtn.addEventListener('click', () => {
                    if (iframe) iframe.src = iframe.src;
                });

                // Handle iframe load errors gracefully
                if (iframe) {
                    iframe.onerror = function() {
                        if (chromeContent) {
                            chromeContent.innerHTML =
                                `<div class="iframe-placeholder">🌐<br>This page cannot be displayed in the embedded browser.<br><small>Some sites block embedding for security reasons.</small><br><button onclick="document.getElementById('chromeFrame').src='https://en.wikipedia.org'" style="padding:8px 16px;cursor:pointer;border-radius:6px;border:1px solid #ccc;background:#fff;">Go to Wikipedia</button></div>`;
                        }
                    };
                }
            }

            // ============ KEYBOARD SHORTCUTS ============
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeStartMenu();
                    contextMenu.classList.remove('visible');
                }
                if (e.ctrlKey && e.key === 'f' && activeWindowId && appStates[activeWindowId].isOpen) {
                    // Could implement find
                }
            });

            // ============ INITIAL STATE ============
            // Open File Explorer by default for a nice starting experience
            setTimeout(() => {
                openApp('explorer');
            }, 300);

            // ============ EXPOSE TO WINDOW ============
            window.openApp = openApp;
            window.closeStartMenu = closeStartMenu;
            window.toggleStartMenu = toggleStartMenu;
            window.refreshDesktop = refreshDesktop;
            window.focusWindow = focusWindow;

            console.log('🪟 Windows 11 Desktop Clone Ready');
            console.log('  📘 Word | 🎨 Paint | 🧮 Calculator | 📝 Notepad | 📁 Explorer | 🌐 Chrome');
            console.log('  Double-click desktop icons to open apps');
            console.log('  Right-click desktop for context menu');
            console.log('  Drag windows by title bar • Resize from bottom-right corner');
            console.log('  Click ⊞ for Start Menu');

            // Handle window resize for paint canvas
            window.addEventListener('resize', () => {
                Object.keys(appStates).forEach(key => {
                    const state = appStates[key];
                    if (state.isOpen && state.isMaximized && key === 'paint') {
                        setTimeout(() => initPaintCanvas(key), 200);
                    }
                });
            });

        })();
    </script>
