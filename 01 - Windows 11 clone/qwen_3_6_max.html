<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap');
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow:hidden;height:100vh;width:100vw}

  /* WALLPAPER */
  #desktop{
    width:100%;height:100%;position:relative;
    background:
      radial-gradient(ellipse 80% 60% at 50% 100%, #1a3a5c 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 30% 80%, #1e4a7a 0%, transparent 50%),
      radial-gradient(ellipse 50% 40% at 70% 90%, #2a5a8a 0%, transparent 50%),
      radial-gradient(ellipse 90% 70% at 50% 100%, #0d2b4e 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 45% 75%, #3a7abd 0%, transparent 40%),
      radial-gradient(ellipse 30% 25% at 55% 80%, #4a8acd 0%, transparent 35%),
      radial-gradient(ellipse 50% 40% at 50% 85%, #1a4a7a 0%, transparent 55%),
      linear-gradient(180deg, #0a1628 0%, #0d1f3c 30%, #132d50 50%, #1a3a5c 70%, #0d2240 100%);
    background-color:#0a1628;
  }

  /* DESKTOP ICONS */
  #desktop-icons{
    position:absolute;top:10px;left:10px;
    display:flex;flex-direction:column;gap:4px;z-index:1;
  }
  .desktop-icon{
    width:80px;height:90px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;
    border-radius:6px;cursor:pointer;padding:8px 4px;
    transition:background .15s;
  }
  .desktop-icon:hover{background:rgba(255,255,255,.1)}
  .desktop-icon.selected{background:rgba(255,255,255,.15);outline:1px solid rgba(255,255,255,.3)}
  .desktop-icon img{width:48px;height:48px;image-rendering:auto}
  .desktop-icon span{
    color:#fff;font-size:11px;text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
    word-wrap:break-word;max-width:76px;line-height:1.2;
  }

  /* TASKBAR */
  #taskbar{
    position:fixed;bottom:0;left:0;right:0;height:48px;
    background:rgba(32,32,32,.85);backdrop-filter:blur(30px);
    display:flex;align-items:center;justify-content:center;z-index:9999;
    border-top:1px solid rgba(255,255,255,.08);
  }
  #taskbar-center{display:flex;align-items:center;gap:2px;height:100%}
  .taskbar-btn{
    width:44px;height:40px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;cursor:pointer;position:relative;transition:background .15s;
  }
  .taskbar-btn:hover{background:rgba(255,255,255,.1)}
  .taskbar-btn.active{background:rgba(255,255,255,.08)}
  .taskbar-btn.active::after{
    content:'';position:absolute;bottom:2px;width:16px;height:3px;
    background:#60cdff;border-radius:2px;
  }
  .taskbar-btn img{width:24px;height:24px}
  #taskbar-right{
    position:absolute;right:12px;display:flex;align-items:center;gap:8px;
    color:#fff;font-size:12px;height:100%;
  }
  #taskbar-right>div{padding:4px 8px;border-radius:6px;cursor:pointer}
  #taskbar-right>div:hover{background:rgba(255,255,255,.1)}
  #clock{text-align:right;line-height:1.3}
  #start-btn{margin-right:4px}

  /* START MENU */
  #start-menu{
    position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
    width:600px;height:680px;
    background:rgba(44,44,44,.92);backdrop-filter:blur(40px);
    border-radius:12px;border:1px solid rgba(255,255,255,.08);
    z-index:10000;display:none;flex-direction:column;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
    padding:36px 36px 24px;
  }
  #start-menu.show{display:flex}
  #start-search{
    width:100%;height:36px;border-radius:18px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);color:#fff;padding:0 16px;
    font-size:13px;outline:none;margin-bottom:24px;
  }
  #start-search::placeholder{color:rgba(255,255,255,.5)}
  #start-search:focus{border-color:#60cdff}
  #start-pinned{flex:1}
  #start-pinned h3{color:#fff;font-size:14px;font-weight:600;margin-bottom:16px}
  #start-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  .start-app{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 8px;border-radius:8px;cursor:pointer;
  }
  .start-app:hover{background:rgba(255,255,255,.08)}
  .start-app img{width:32px;height:32px}
  .start-app span{color:#fff;font-size:11px;text-align:center}
  #start-bottom{
    border-top:1px solid rgba(255,255,255,.08);padding-top:16px;
    display:flex;justify-content:space-between;align-items:center;
  }
  #start-user{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px}
  #start-user-avatar{
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,#60cdff,#0078d4);
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  #start-power{
    width:36px;height:36px;border-radius:6px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;
    color:#fff;font-size:18px;
  }
  #start-power:hover{background:rgba(255,255,255,.08)}

  /* WINDOWS */
  .window{
    position:absolute;min-width:400px;min-height:300px;
    background:rgba(44,44,44,.95);backdrop-filter:blur(20px);
    border-radius:8px;border:1px solid rgba(255,255,255,.08);
    box-shadow:0 8px 32px rgba(0,0,0,.35);
    display:flex;flex-direction:column;overflow:hidden;
    transition:box-shadow .2s;
  }
  .window.focused{box-shadow:0 8px 40px rgba(0,0,0,.5);z-index:100}
  .window.minimized{display:none!important}
  .window.maximized{
    top:0!important;left:0!important;
    width:100%!important;height:calc(100% - 48px)!important;
    border-radius:0;
  }
  .window-titlebar{
    height:32px;display:flex;align-items:center;
    padding:0 8px 0 12px;flex-shrink:0;
    background:rgba(32,32,32,.6);
  }
  .window-titlebar-icon{width:16px;height:16px;margin-right:8px}
  .window-title{flex:1;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .window-controls{display:flex;height:100%}
  .window-ctrl{
    width:46px;height:32px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#fff;font-size:10px;transition:background .1s;
  }
  .window-ctrl:hover{background:rgba(255,255,255,.1)}
  .window-ctrl.close:hover{background:#c42b1c}
  .window-body{flex:1;overflow:auto;position:relative}

  /* RESIZE HANDLE */
  .resize-handle{
    position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize;
  }

  /* CONTEXT MENU */
  #context-menu{
    position:fixed;min-width:200px;
    background:rgba(44,44,44,.95);backdrop-filter:blur(30px);
    border-radius:8px;border:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 16px rgba(0,0,0,.3);
    z-index:99999;display:none;padding:4px;
  }
  .ctx-item{
    padding:8px 12px;color:#fff;font-size:12px;border-radius:4px;
    cursor:pointer;display:flex;align-items:center;gap:10px;
  }
  .ctx-item:hover{background:rgba(255,255,255,.08)}
  .ctx-sep{height:1px;background:rgba(255,255,255,.08);margin:4px 8px}

  /* ===== APP STYLES ===== */

  /* NOTEPAD */
  .notepad-body{display:flex;flex-direction:column;height:100%}
  .notepad-menu{
    display:flex;gap:0;padding:2px 8px;
    background:rgba(32,32,32,.4);border-bottom:1px solid rgba(255,255,255,.06);
  }
  .notepad-menu-item{
    padding:4px 10px;color:rgba(255,255,255,.8);font-size:12px;
    cursor:pointer;border-radius:4px;
  }
  .notepad-menu-item:hover{background:rgba(255,255,255,.08)}
  .notepad-textarea{
    flex:1;background:rgba(30,30,30,.9);color:#fff;border:none;
    padding:8px 12px;font-family:Consolas,'Courier New',monospace;
    font-size:14px;resize:none;outline:none;line-height:1.5;
  }
  .notepad-status{
    padding:2px 12px;font-size:11px;color:rgba(255,255,255,.5);
    background:rgba(32,32,32,.4);border-top:1px solid rgba(255,255,255,.06);
    display:flex;justify-content:space-between;
  }

  /* CALCULATOR */
  .calc-body{padding:8px;display:flex;flex-direction:column;height:100%;background:#202020}
  .calc-display{
    text-align:right;padding:16px 8px 8px;min-height:80px;
    display:flex;flex-direction:column;justify-content:flex-end;
  }
  .calc-expr{color:rgba(255,255,255,.5);font-size:13px;min-height:20px}
  .calc-result{color:#fff;font-size:42px;font-weight:300}
  .calc-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1;padding-top:8px}
  .calc-btn{
    border:none;border-radius:6px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .1s;color:#fff;
    background:rgba(59,59,59,.8);
  }
  .calc-btn:hover{background:rgba(80,80,80,.8)}
  .calc-btn:active{background:rgba(100,100,100,.8)}
  .calc-btn.op{background:rgba(50,50,50,.8)}
  .calc-btn.op:hover{background:rgba(70,70,70,.8)}
  .calc-btn.eq{background:#60cdff;color:#000}
  .calc-btn.eq:hover{background:#7dd7ff}
  .calc-btn.top{background:rgba(45,45,45,.8);font-size:14px}
  .calc-btn.top:hover{background:rgba(65,65,65,.8)}

  /* PAINT */
  .paint-body{display:flex;flex-direction:column;height:100%;background:#1e1e1e}
  .paint-toolbar{
    display:flex;align-items:center;gap:6px;padding:6px 10px;
    background:rgba(40,40,40,.9);border-bottom:1px solid rgba(255,255,255,.06);
    flex-wrap:wrap;
  }
  .paint-tool{
    width:34px;height:34px;border-radius:6px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;
    font-size:16px;transition:background .1s;
    background:transparent;color:#fff;border:1px solid transparent;
  }
  .paint-tool:hover{background:rgba(255,255,255,.08)}
  .paint-tool.active{background:rgba(96,205,255,.2);border-color:#60cdff}
  .paint-colors{display:flex;gap:3px;margin-left:8px;align-items:center}
  .paint-color{
    width:22px;height:22px;border-radius:4px;cursor:pointer;
    border:2px solid transparent;transition:border-color .1s;
  }
  .paint-color:hover{border-color:rgba(255,255,255,.5)}
  .paint-color.active{border-color:#60cdff}
  .paint-size{
    margin-left:8px;color:#fff;font-size:11px;display:flex;
    align-items:center;gap:6px;
  }
  .paint-size input[type=range]{width:80px;accent-color:#60cdff}
  .paint-canvas-wrap{flex:1;overflow:hidden;position:relative;background:#fff}
  .paint-canvas-wrap canvas{display:block;cursor:crosshair}

  /* WORD */
  .word-body{display:flex;flex-direction:column;height:100%;background:#1e1e1e}
  .word-ribbon{
    background:rgba(40,40,40,.95);border-bottom:1px solid rgba(255,255,255,.06);
    padding:4px 8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  }
  .word-ribbon-btn{
    padding:6px 10px;border-radius:4px;cursor:pointer;
    color:rgba(255,255,255,.85);font-size:12px;border:none;
    background:transparent;transition:background .1s;
    display:flex;align-items:center;gap:4px;
  }
  .word-ribbon-btn:hover{background:rgba(255,255,255,.08)}
  .word-ribbon-btn.active{background:rgba(96,205,255,.2);color:#60cdff}
  .word-ribbon-sep{width:1px;height:24px;background:rgba(255,255,255,.1);margin:0 4px}
  .word-ribbon select{
    background:rgba(50,50,50,.8);color:#fff;border:1px solid rgba(255,255,255,.12);
    border-radius:4px;padding:4px 6px;font-size:12px;outline:none;cursor:pointer;
  }
  .word-ribbon select option{background:#333;color:#fff}
  .word-editor-wrap{flex:1;overflow:auto;padding:20px;display:flex;justify-content:center;background:#2a2a2a}
  .word-editor{
    width:100%;max-width:700px;min-height:500px;background:#fff;color:#000;
    padding:40px 50px;font-size:14px;line-height:1.6;outline:none;
    border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.3);
    user-select:text;
  }
  .word-status{
    padding:2px 12px;font-size:11px;color:rgba(255,255,255,.5);
    background:rgba(32,32,32,.6);border-top:1px solid rgba(255,255,255,.06);
  }

  /* FILE EXPLORER */
  .explorer-body{display:flex;flex-direction:column;height:100%;background:#1e1e1e}
  .explorer-toolbar{
    display:flex;align-items:center;gap:6px;padding:6px 10px;
    background:rgba(40,40,40,.9);border-bottom:1px solid rgba(255,255,255,.06);
  }
  .explorer-nav-btn{
    width:30px;height:30px;border-radius:6px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;
    color:rgba(255,255,255,.6);font-size:14px;background:transparent;
    border:none;
  }
  .explorer-nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
  .explorer-path{
    flex:1;height:30px;border-radius:6px;border:1px solid rgba(255,255,255,.1);
    background:rgba(30,30,30,.8);color:#fff;padding:0 10px;
    font-size:12px;outline:none;display:flex;align-items:center;
  }
  .explorer-content{display:flex;flex:1;overflow:hidden}
  .explorer-sidebar{
    width:200px;background:rgba(30,30,30,.5);border-right:1px solid rgba(255,255,255,.06);
    padding:8px;overflow:auto;flex-shrink:0;
  }
  .explorer-sidebar-item{
    padding:6px 10px;color:rgba(255,255,255,.8);font-size:12px;
    border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:8px;
  }
  .explorer-sidebar-item:hover{background:rgba(255,255,255,.06)}
  .explorer-sidebar-item.active{background:rgba(255,255,255,.08)}
  .explorer-files{flex:1;padding:8px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
  .explorer-file{
    width:90px;height:90px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;
    border-radius:6px;cursor:pointer;padding:8px;
  }
  .explorer-file:hover{background:rgba(255,255,255,.06)}
  .explorer-file span{color:#fff;font-size:11px;text-align:center;word-break:break-all}
  .explorer-file-icon{font-size:36px}

  /* CHROME */
  .chrome-body{display:flex;flex-direction:column;height:100%;background:#1e1e1e}
  .chrome-tabs{
    display:flex;align-items:center;padding:8px 8px 0;
    background:rgba(40,40,40,.95);gap:2px;
  }
  .chrome-tab{
    height:34px;padding:0 16px;border-radius:8px 8px 0 0;
    display:flex;align-items:center;gap:8px;cursor:pointer;
    color:rgba(255,255,255,.7);font-size:12px;
    background:rgba(50,50,50,.6);max-width:200px;
  }
  .chrome-tab.active{background:rgba(30,30,30,.9);color:#fff}
  .chrome-tab-close{font-size:10px;opacity:.5;cursor:pointer}
  .chrome-tab-close:hover{opacity:1}
  .chrome-url-bar{
    display:flex;align-items:center;gap:6px;padding:6px 10px;
    background:rgba(30,30,30,.9);border-bottom:1px solid rgba(255,255,255,.06);
  }
  .chrome-url-input{
    flex:1;height:32px;border-radius:16px;border:1px solid rgba(255,255,255,.1);
    background:rgba(50,50,50,.6);color:#fff;padding:0 14px;
    font-size:13px;outline:none;
  }
  .chrome-url-input:focus{border-color:#60cdff}
  .chrome-content{flex:1;background:#fff;overflow:auto}
  .chrome-content iframe{width:100%;height:100%;border:none}
  .chrome-home{
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;height:100%;background:#202124;color:#fff;
  }
  .chrome-home-logo{font-size:60px;margin-bottom:20px}
  .chrome-home-search{
    width:500px;max-width:90%;height:44px;border-radius:22px;
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
    color:#fff;padding:0 20px;font-size:15px;outline:none;
  }
  .chrome-home-search:focus{border-color:#60cdff;background:rgba(255,255,255,.1)}
  .chrome-shortcuts{display:flex;gap:16px;margin-top:30px;flex-wrap:wrap;justify-content:center}
  .chrome-shortcut{
    width:100px;height:90px;border-radius:12px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    gap:8px;cursor:pointer;background:rgba(255,255,255,.06);
  }
  .chrome-shortcut:hover{background:rgba(255,255,255,.1)}
  .chrome-shortcut span{font-size:11px;color:rgba(255,255,255,.7)}

  /* SCROLLBAR */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.25)}

  /* ANIMATIONS */
  @keyframes windowOpen{
    from{opacity:0;transform:scale(.95)}
    to{opacity:1;transform:scale(1)}
  }
  .window{animation:windowOpen .2s ease}
</style>
</head>
<body>

<div id="desktop">
  <div id="desktop-icons"></div>
</div>

<div id="taskbar">
  <div id="taskbar-center"></div>
  <div id="taskbar-right">
    <div id="tray-icons" style="font-size:13px;display:flex;gap:6px;align-items:center">
      <span>🔊</span><span>📶</span><span>🔋</span>
    </div>
    <div id="clock"></div>
  </div>
</div>

<div id="start-menu">
  <input type="text" id="start-search" placeholder="🔍 Type here to search">
  <div id="start-pinned">
    <h3>Pinned</h3>
    <div id="start-grid"></div>
  </div>
  <div id="start-bottom">
    <div id="start-user">
      <div id="start-user-avatar">👤</div>
      <span>User</span>
    </div>
    <div id="start-power">⏻</div>
  </div>
</div>

<div id="context-menu"></div>

<script>
// ===== ICON SVGs =====
const ICONS = {
  word: `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="40" height="40" rx="4" fill="#185ABD"/><path d="M14 14h6l4 12 4-12h6l-7 20h-6L14 14z" fill="#fff"/></svg>`,
  paint: `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="40" height="40" rx="4" fill="#F0F0F0"/><rect x="8" y="8" width="32" height="24" rx="2" fill="#fff" stroke="#ccc" stroke-width="1"/><circle cx="14" cy="38" r="3" fill="#E74C3C"/><circle cx="22" cy="38" r="3" fill="#3498DB"/><circle cx="30" cy="38" r="3" fill="#2ECC71"/><circle cx="38" cy="38" r="3" fill="#F39C12"/><path d="M32 8l6 6-14 14-6-6z" fill="#888" opacity=".5"/></svg>`,
  calculator: `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="4" width="32" height="40" rx="4" fill="#333"/><rect x="12" y="8" width="24" height="10" rx="2" fill="#7BE0AD"/><rect x="12" y="22" width="6" height="5" rx="1" fill="#666"/><rect x="20" y="22" width="6" height="5" rx="1" fill="#666"/><rect x="28" y="22" width="6" height="5" rx="1" fill="#666"/><rect x="12" y="29" width="6" height="5" rx="1" fill="#666"/><rect x="20" y="29" width="6" height="5" rx="1" fill="#666"/><rect x="28" y="29" width="6" height="5" rx="1" fill="#666"/><rect x="12" y="36" width="6" height="5" rx="1" fill="#666"/><rect x="20" y="36" width="6" height="5" rx="1" fill="#666"/><rect x="28" y="36" width="6" height="5" rx="1" fill="#4CC2A2"/></svg>`,

// ===== WINDOW MANAGEMENT =====
function createWindow(appId, title, icon, width, height, content) {
  const app = APPS.find(a=>a.id===appId);
  const w = document.createElement('div');
  w.className = 'window focused';
  w.id = 'win-'+appId;
  w.style.width = width+'px';
  w.style.height = height+'px';
  w.style.left = (100 + Object.keys(windows).length*30)+'px';
  w.style.top = (50 + Object.keys(windows).length*30)+'px';
  w.style.zIndex = ++windowZ;

  w.innerHTML = `
    <div class="window-titlebar">
      <img class="window-titlebar-icon" src="data:image/svg+xml,${encodeURIComponent(icon)}">
      <span class="window-title">${title}</span>
      <div class="window-controls">
        <div class="window-ctrl minimize" title="Minimize">─</div>
        <div class="window-ctrl maximize" title="Maximize">☐</div>
        <div class="window-ctrl close" title="Close">✕</div>
      </div>
    </div>
    <div class="window-body">${content}</div>
    <div class="resize-handle"></div>
  `;

  document.getElementById('desktop').appendChild(w);
  windows[appId] = w;
  focusWindow(appId);

  // Update taskbar
  const tb = document.getElementById('tb-'+appId);
  if(tb) tb.classList.add('active');

  // Title bar events
  const titlebar = w.querySelector('.window-titlebar');
  let dragging = false, dragX, dragY;

  titlebar.addEventListener('mousedown', (e) => {
    if(e.target.closest('.window-controls')) return;
    dragging = true;
    dragX = e.clientX - w.offsetLeft;
    dragY = e.clientY - w.offsetTop;
    w.classList.remove('maximized');
    focusWindow(appId);
  });

  document.addEventListener('mousemove', (e) => {
    if(!dragging) return;
    w.style.left = (e.clientX - dragX)+'px';
    w.style.top = Math.max(0, e.clientY - dragY)+'px';
  });
  document.addEventListener('mouseup', () => { dragging=false; });

  // Double click titlebar to maximize
  titlebar.addEventListener('dblclick', (e) => {
    if(e.target.closest('.window-controls')) return;
    w.classList.toggle('maximized');
  });

  // Controls
  w.querySelector('.minimize').onclick = () => {
    w.classList.add('minimized');
  };
  w.querySelector('.maximize').onclick = () => {
    w.classList.toggle('maximized');
  };
  w.querySelector('.close').onclick = () => {
    w.remove();
    delete windows[appId];
    const tb = document.getElementById('tb-'+appId);
    if(tb) tb.classList.remove('active');
    if(activeWindow === appId) activeWindow = null;
  };

  // Focus on click
  w.addEventListener('mousedown', () => focusWindow(appId));

  // Resize
  const rh = w.querySelector('.resize-handle');
  let resizing = false, rStartX, rStartY, rStartW, rStartH;
  rh.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    resizing = true;
    rStartX = e.clientX; rStartY = e.clientY;
    rStartW = w.offsetWidth; rStartH = w.offsetHeight;
  });
  document.addEventListener('mousemove', (e) => {
    if(!resizing) return;
    w.style.width = Math.max(300, rStartW + e.clientX - rStartX)+'px';
    w.style.height = Math.max(200, rStartH + e.clientY - rStartY)+'px';
  });
  document.addEventListener('mouseup', () => { resizing=false; });

  return w;
}

function focusWindow(appId){
  Object.values(windows).forEach(w => w.classList.remove('focused'));
  if(windows[appId]){
    windows[appId].classList.add('focused');
    windows[appId].style.zIndex = ++windowZ;
  }
  activeWindow = appId;
}

// ===== OPEN APP =====
function openApp(appId){
  if(windows[appId]){
    windows[appId].classList.remove('minimized');
    focusWindow(appId);
    return;
  }
  const app = APPS.find(a=>a.id===appId);
  let content = '';
  switch(appId){
    case 'notepad': content = getNotepadContent(); break;
    case 'calculator': content = getCalcContent(); break;
    case 'paint': content = getPaintContent(); break;
    case 'word': content = getWordContent(); break;
    case 'explorer': content = getExplorerContent(); break;
    case 'chrome': content = getChromeContent(); break;
  }
  const w = createWindow(appId, app.name, app.icon, app.width, app.height, content);
  // Init app logic
  switch(appId){
    case 'calculator': initCalc(w); break;
    case 'paint': initPaint(w); break;
    case 'explorer': initExplorer(w); break;
    case 'chrome': initChrome(w); break;
  }
}

// ===== CALCULATOR =====
function getCalcContent(){
  const btns = [
    ['%','top'],['CE','top'],['C','top'],['⌫','top'],
    ['⅟x','top'],['x²','top'],['√','top'],['÷','op'],
    ['7',''],['8',''],['9',''],['×','op'],
    ['4',''],['5',''],['6',''],['−','op'],
    ['1',''],['2',''],['3',''],['+','op'],
    ['±','top'],['0',''],['.',''],['＝','eq']
  ];
  let html = `<div class="calc-body">
    <div class="calc-display">
      <div class="calc-expr" id="calc-expr"></div>
      <div class="calc-result" id="calc-result">0</div>
    </div>
    <div class="calc-buttons">`;
  btns.forEach(([label,cls]) => {
    html += `<div class="calc-btn ${cls}" data-val="${label}">${label}</div>`;
  });
  html += `</div></div>`;
  return html;
}

function initCalc(w){
  let current='0', expression='', operator=null, prev=null, newNum=true;
  const result = w.querySelector('#calc-result');
  const expr = w.querySelector('#calc-expr');

  function update(){
    result.textContent = current;
    expr.textContent = expression;
    if(current.length > 12) result.style.fontSize = '28px';
    else result.style.fontSize = '42px';
  }

  w.querySelectorAll('.calc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.val;
      if(v >= '0' && v <= '9'){
        if(newNum){ current = v; newNum=false; }
        else current += v;
        update();
      } else if(v === '.'){
        if(newNum){ current='0.'; newNum=false; }
        else if(!current.includes('.')) current += '.';
        update();
      } else if(v === 'C'){
        current='0'; expression=''; operator=null; prev=null; newNum=true;
        update();
      } else if(v === 'CE'){
        current='0'; newNum=true; update();
      } else if(v === '⌫'){
        current = current.slice(0,-1) || '0';
        update();
      } else if(v === '±'){
        current = current.startsWith('-') ? current.slice(1) : '-'+current;
        update();
      } else if(v === 'x²'){
        current = String(Math.pow(parseFloat(current),2));
        update();
      } else if(v === '√'){
        current = String(Math.sqrt(parseFloat(current)));
        update();
      } else if(v === '⅟x'){
        current = String(1/parseFloat(current));
        update();
      } else if(v === '%'){
        if(prev!==null) current = String(prev * parseFloat(current)/100);
        update();
      } else if(['+','−','×','÷'].includes(v)){
        if(operator && !newNum){
          prev = calc(prev, parseFloat(current), operator);
          current = String(prev);
        } else {
          prev = parseFloat(current);
        }
        operator = v;
        expression = current + ' ' + v;
        newNum = true;
        update();
      } else if(v === '＝'){
        if(operator){
          const r = calc(prev, parseFloat(current), operator);
          expression = prev + ' ' + operator + ' ' + current + ' =';
          current = String(r);
          operator = null; prev = null; newNum = true;
          update();
        }
      }
    });
  });

  function calc(a,b,op){
    if(op==='+') return a+b;
    if(op==='−') return a-b;
    if(op==='×') return a*b;
    if(op==='÷') return b!==0 ? a/b : 'Error';
    return b;
  }
}

function initPaint(w){
  const canvas = w.querySelector('.paint-canvas');
  const wrap = w.querySelector('.paint-canvas-wrap');
  const ctx = canvas.getContext('2d');
  let tool='brush', color='#000', size=4, drawing=false;
  let lastX, lastY, startX, startY;
  let snapshot;

  function resize(){
    const rect = wrap.getBoundingClientRect();
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.putImageData(imgData,0,0);
  }
  resize();
  setTimeout(resize,100);

  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Tools
  w.querySelectorAll('.paint-tool[data-tool]').forEach(btn => {
    btn.onclick = () => {
      if(btn.dataset.tool === 'clear'){
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        return;
      }
      w.querySelectorAll('.paint-tool').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      tool = btn.dataset.tool;
    };
  });

  // Colors
  w.querySelectorAll('.paint-color').forEach(btn => {
    btn.onclick = () => {
      w.querySelectorAll('.paint-color').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      color = btn.dataset.color;
    };
  });

  // Size
  const sizeSlider = w.querySelector('.paint-size-slider');
  const sizeVal = w.querySelector('.paint-size-val');
  sizeSlider.oninput = () => {
    size = parseInt(sizeSlider.value);
    sizeVal.textContent = size;
  };

  function getPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('mousedown', (e) => {
    drawing = true;
    const p = getPos(e);
    lastX = p.x; lastY = p.y;
    startX = p.x; startY = p.y;
    snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);

    if(tool === 'fill'){
      floodFill(Math.round(p.x), Math.round(p.y), color);
      drawing = false;
    }
    if(tool === 'brush' || tool === 'eraser'){
      ctx.beginPath();
      ctx.arc(p.x, p.y, size/2, 0, Math.PI*2);
      ctx.fillStyle = tool==='eraser' ? '#fff' : color;
      ctx.fill();
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    if(!drawing) return;
    const p = getPos(e);

    if(tool === 'brush' || tool === 'eraser'){
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = tool==='eraser' ? '#fff' : color;
      ctx.lineWidth = size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    } else if(tool === 'line' || tool === 'rect' || tool === 'circle'){
      ctx.putImageData(snapshot, 0, 0);
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = 'round';
      if(tool === 'line'){
        ctx.moveTo(startX, startY);
        ctx.lineTo(p.x, p.y);
      } else if(tool === 'rect'){
        ctx.rect(startX, startY, p.x-startX, p.y-startY);
      } else if(tool === 'circle'){
        const rx = Math.abs(p.x-startX)/2, ry = Math.abs(p.y-startY)/2;
        const cx = startX + (p.x-startX)/2, cy = startY + (p.y-startY)/2;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
      }
      ctx.stroke();
    }
  });

  canvas.addEventListener('mouseup', () => { drawing=false; });
  canvas.addEventListener('mouseleave', () => { drawing=false; });

  function floodFill(sx, sy, fillColor){
    const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const data = imageData.data;
    const w = canvas.width, h = canvas.height;

    const fc = hexToRgb(fillColor);
    const idx = (sy*w+sx)*4;
    const tr=data[idx], tg=data[idx+1], tb=data[idx+2], ta=data[idx+3];

    if(tr===fc.r && tg===fc.g && tb===fc.b) return;

    const stack = [[sx,sy]];
    const visited = new Set();

    while(stack.length > 0){
      const [x,y] = stack.pop();
      if(x<0||x>=w||y<0||y>=h) continue;
      const key = y*w+x;
      if(visited.has(key)) continue;
      const i = key*4;
      if(Math.abs(data[i]-tr)>10 || Math.abs(data[i+1]-tg)>10 || Math.abs(data[i+2]-tb)>10) continue;
      visited.add(key);
      data[i]=fc.r; data[i+1]=fc.g; data[i+2]=fc.b; data[i+3]=255;
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(imageData,0,0);
  }

  function hexToRgb(hex){
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
  }
}
