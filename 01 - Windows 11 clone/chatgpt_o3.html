<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Windows 11 – HTML Desktop Clone</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ---------- 1. GLOBAL RESET ---------- */
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial,Helvetica,sans-serif}
html,body{height:100%;overflow:hidden;color:#111}

/* ---------- 2. DESKTOP ---------- */
#desktop{
  height:100%;width:100%;
  position:relative;
  background:#004;          /* fallback colour */
  background-image:url("wallpaper.jpg");
  background-size:cover;background-position:center;
}

/* ---------- 3. ICONS ---------- */
.icon{
  width:96px;text-align:center;cursor:default;
  position:absolute;user-select:none
}
.icon img{width:64px;height:64px;pointer-events:none}
.icon span{display:block;margin-top:4px;font-size:13px;color:#fff;
           text-shadow:0 0 4px #000}

/* ---------- 4. WINDOW SHELL ---------- */
.window{
  position:absolute;min-width:260px;min-height:180px;
  background:#fff;border:1px solid #888;border-radius:6px;
  box-shadow:0 6px 16px rgba(0,0,0,.35);overflow:hidden
}
.titlebar{
  height:32px;background:#e7e7e7;padding:0 8px;
  display:flex;align-items:center;cursor:move;
  user-select:none
}
.titlebar span{flex:1;font-weight:600;font-size:14px}
.btn{width:42px;height:100%;display:flex;align-items:center;
     justify-content:center}
.btn:hover{background:#d0d0d0}
.close:hover{background:#e81123;color:#fff}
.content{height:calc(100% - 32px);background:#fff;overflow:auto;
         padding:8px}

/* ---------- 5. TASKBAR ---------- */
#taskbar{
  height:48px;width:100%;background:rgba(240,240,240,.85);
  position:absolute;bottom:0;left:0;display:flex;
  align-items:center;backdrop-filter:blur(8px)
}
#startSpacer{flex:1}
#clock{width:120px;text-align:center;font-size:14px}

/* ---------- 6. APP-SPECIFIC STYLES ---------- */
textarea, .editor{
  width:100%;height:100%;border:none;outline:none;font:14px/1.4 monospace
}
canvas{background:#fff;display:block}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.calc-grid button{padding:12px;font-size:17px;border:1px solid #888;
                  background:#f6f6f6;border-radius:4px;cursor:pointer}
.calc-out{width:100%;height:45px;font-size:22px;text-align:right;
          padding:4px;border:1px solid #888;margin-bottom:6px}
.file-list{display:flex;flex-wrap:wrap;gap:24px}
.file-list .file{width:72px;text-align:center;cursor:pointer}
.file img{width:48px;height:48px}
.legend{position:absolute;top:8px;right:8px;font-size:12px;color:#666}

/* ---------- 7. PLACEHOLDER ICONS ---------- */
.icon img:not([src]){background:#09f;display:block;border-radius:12px}
</style>
</head>
<body>
<div id="desktop"></div>
<div id="taskbar"><div id="startSpacer"></div><div id="clock"></div></div>

<script>
/* =========================================================================
   SIMPLE WINDOW MANAGER
   ========================================================================= */
let zIndex = 10;
function makeWindow(title, bodyBuilder){
  const win = document.createElement('div');win.className='window';
  win.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <div class="btn minimize">➖</div>
      <div class="btn close">✖</div>
    </div>
    <div class="content"></div>`;
  document.body.appendChild(win);
  const tb = win.querySelector('.titlebar');
  const content = win.querySelector('.content');
  bodyBuilder(content);
  win.style.left = Math.random()*50+100+'px';
  win.style.top  = Math.random()*50+60+'px';
  focus(win);

  // drag
  let dx,dy,isDrag=false;
  tb.onmousedown=e=>{
    isDrag=true;dx=e.clientX-win.offsetLeft;dy=e.clientY-win.offsetTop;
    focus(win);
  };
  window.addEventListener('mousemove',e=>{
    if(isDrag){win.style.left=e.clientX-dx+'px';
               win.style.top =e.clientY-dy+'px';}
  });
  window.addEventListener('mouseup',()=>isDrag=false);

  // buttons
  win.querySelector('.close').onclick=()=>win.remove();
  win.querySelector('.minimize').onclick=()=>win.style.display='none';

  // restore on taskbar click
  task(win,title);

  return win;
}
function focus(win){
  zIndex++;win.style.zIndex=zIndex;
}
function task(win,title){
  const btn=document.createElement('div');
  btn.className='btn';btn.textContent=title[0];
  btn.onclick=()=>{
    if(win.style.display==='none'){win.style.display='block';focus(win);}
    else focus(win);
  };
  document.getElementById('startSpacer').appendChild(btn);
}

/* =========================================================================
   APPLICATIONS
   ========================================================================= */
const apps=[
  {name:'Word',icon:'word.png',open:openWord},
  {name:'Paint',icon:'paint.png',open:openPaint},
  {name:'Calculator',icon:'calc.png',open:openCalc},
  {name:'Notepad',icon:'notepad.png',open:openNote},
  {name:'File Explorer',icon:'explorer.png',open:openFiles},
  {name:'Chrome',icon:'chrome.png',open:openChrome},
];

function addDesktopIcons(){
  const desk=document.getElementById('desktop');
  apps.forEach((app,i)=>{
    const ico=document.createElement('div');ico.className='icon';
    ico.innerHTML=`<img src="${app.icon}" alt=""><span>${app.name}</span>`;
    ico.style.left=24+'px';
    ico.style.top =24+i*110+'px';
    ico.ondblclick=app.open;
    desk.appendChild(ico);
  });
}
addDesktopIcons();

/* ---------- Word (Rich-text) ---------- */
function openWord(){
  makeWindow('Word',c=>{
    c.innerHTML=`<div class="editor" contenteditable="true">
      <h2>Welcome to HTML Word</h2><p>Start typing…</p></div>`;
  });
}

/* ---------- Paint (Canvas) ---------- */
function openPaint(){
  makeWindow('Paint',c=>{
    const canvas=document.createElement('canvas');
    canvas.width=c.offsetWidth;canvas.height=c.offsetHeight;
    c.appendChild(canvas);
    const ctx=canvas.getContext('2d');
    let painting=false;
    canvas.onmousedown=e=>{painting=true;ctx.beginPath()};
    canvas.onmousemove=e=>{
      if(!painting)return;
      const rect=canvas.getBoundingClientRect();
      ctx.lineWidth=4;ctx.lineCap='round';
      ctx.lineTo(e.clientX-rect.left,e.clientY-rect.top);
      ctx.stroke();
    };
    window.addEventListener('mouseup',()=>painting=false);
  });
}

/* ---------- Calculator ---------- */
function openCalc(){
  makeWindow('Calculator',c=>{
    c.innerHTML=`<input class="calc-out" readonly><div class="calc-grid"></div>`;
    const out=c.querySelector('.calc-out');
    const keys='789/456*123-0.=+'.split('');
    const grid=c.querySelector('.calc-grid');
    keys.forEach(k=>{
      const b=document.createElement('button');b.textContent=k;
      b.onclick=()=>{
        if(k==='='){try{out.value=eval(out.value)}catch(e){out.value='ERR'}}
        else{out.value+=k}
      };
      grid.appendChild(b);
    });
  });
}

/* ---------- Notepad ---------- */
function openNote(){
  makeWindow('Notepad',c=>{
    c.innerHTML=`<textarea spellcheck="false">// jot down notes here…</textarea>`;
  });
}

/* ---------- File Explorer ---------- */
function openFiles(){
  makeWindow('File Explorer',c=>{
    c.innerHTML=`<div class="file-list"></div>`;
    const list=c.querySelector('.file-list');
    apps.forEach(a=>{
      const f=document.createElement('div');f.className='file';
      f.innerHTML=`<img src="${a.icon}" alt=""><span>${a.name}</span>`;
      f.ondblclick=a.open;
      list.appendChild(f);
    });
  });
}

/* ---------- Chrome (mini-browser) ---------- */
function openChrome(){
  makeWindow('Chrome',c=>{
    const bar=document.createElement('input');bar.style.cssText=
      'width:100%;padding:4px;border:1px solid #888;margin-bottom:4px';
    bar.placeholder='Enter URL and press Enter…';
    const frame=document.createElement('iframe');frame.style.cssText=
      'border:none;width:100%;height:calc(100% - 36px)';
    bar.onkeydown=e=>{
      if(e.key==='Enter'){
        let url=bar.value.trim();
        if(!/^https?:\/\//.test(url))url='https://'+url;
        frame.src=url;
      }
    };
    c.append(bar,frame);
  });
}

/* =========================================================================
   CLOCK
   ========================================================================= */
function tick(){
  const d=new Date();
  document.getElementById('clock').textContent=
    d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
setInterval(tick,1000);tick();

/* =========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================= */
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){           // Esc = show desktop
    document.querySelectorAll('.window').forEach(w=>w.style.display='none');
  }
});
</script>
</body>
</html>
