<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-glass-dark: rgba(32, 32, 32, 0.85);
            --primary: #0078d4;
            --text: #202020;
            --text-secondary: #5d5d5d;
            --border: #e5e5e5;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
            --radius: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: url('https://4kwallpapers.com/images/wallpapers/windows-11-bloom-3840x2160-14423.jpg') center/cover no-repeat;
        }

        /* Desktop */
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 48px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
        }

        .desktop-icon {
            width: 76px;
            height: 92px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px 4px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.15s;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .desktop-icon:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .desktop-icon img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .desktop-icon span {
            color: white;
            font-size: 12px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            word-wrap: break-word;
            max-width: 72px;
            line-height: 1.2;
        }

        /* Taskbar */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-top: 1px solid var(--border);
        }

        .taskbar-icons {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .taskbar-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .taskbar-icon:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .taskbar-icon.active::after {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 6px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        .taskbar-icon img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .system-tray {
            position: absolute;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .system-tray-item {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text);
        }

        .system-tray-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Windows */
        .window {
            position: absolute;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            min-width: 300px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .window.minimized {
            display: none;
        }

        .window-header {
            height: 32px;
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            padding: 0 12px;
            cursor: move;
            flex-shrink: 0;
        }

        .window-header img {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        .window-title {
            flex: 1;
            font-size: 12px;
            color: var(--text);
        }

        .window-controls {
            display: flex;
            gap: 0;
        }

        .window-control {
            width: 46px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            transition: background 0.1s;
        }

        .window-control:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .window-control.close:hover {
            background: #c42b1c;
            color: white;
        }

        .window-content {
            flex: 1;
            overflow: auto;
            background: white;
        }

        /* Start Menu */
        #start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            width: 600px;
            height: 500px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: none;
            flex-direction: column;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
        }

        #start-menu.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .start-search {
            padding: 16px 24px;
        }

        .start-search input {
            width: 100%;
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.05);
            font-size: 14px;
            outline: none;
        }

        .start-search input:focus {
            background: white;
            box-shadow: 0 0 0 2px var(--primary);
        }

        .start-pinned {
            padding: 8px 24px;
            flex: 1;
        }

        .start-pinned h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        .pinned-apps {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .pinned-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 8px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.15s;
        }

        .pinned-app:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .pinned-app img {
            width: 32px;
            height: 32px;
            margin-bottom: 4px;
        }

        .pinned-app span {
            font-size: 11px;
            color: var(--text);
            text-align: center;
        }

        /* Calculator Styles */
        .calc-display {
            padding: 16px;
            background: #f3f3f3;
            text-align: right;
        }

        .calc-display input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 32px;
            text-align: right;
            outline: none;
            color: var(--text);
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #e5e5e5;
        }

        .calc-btn {
            padding: 16px;
            border: none;
            background: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .calc-btn:hover {
            background: #f0f0f0;
        }

        .calc-btn:active {
            background: #e0e0e0;
        }

        .calc-btn.operator {
            background: #f3f3f3;
        }

        .calc-btn.equals {
            background: var(--primary);
            color: white;
        }

        .calc-btn.equals:hover {
            background: #106ebe;
        }

        /* Notepad Styles */
        .notepad-content {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            padding: 8px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            outline: none;
        }

        /* Paint Styles */
        .paint-toolbar {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: #f3f3f3;
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
        }

        .paint-tool {
            padding: 8px 12px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .paint-tool:hover {
            background: #e5e5e5;
        }

        .paint-tool.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .paint-tool input[type="color"] {
            width: 32px;
            height: 32px;
            padding: 0;
            border: none;
            cursor: pointer;
        }

        .paint-canvas-container {
            flex: 1;
            overflow: hidden;
        }

        #paint-canvas {
            cursor: crosshair;
        }

        /* Word Styles */
        .word-toolbar {
            display: flex;
            gap: 4px;
            padding: 8px;
            background: #f3f3f3;
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
        }

        .word-tool {
            padding: 6px 12px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .word-tool:hover {
            background: #e5e5e5;
        }

        .word-content {
            flex: 1;
            padding: 16px;
        }

        .word-content [contenteditable] {
            width: 100%;
            height: 100%;
            outline: none;
            font-size: 14px;
            line-height: 1.6;
        }

        /* File Explorer Styles */
        .explorer-toolbar {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: #f3f3f3;
            border-bottom: 1px solid #ddd;
            align-items: center;
        }

        .explorer-btn {
            padding: 4px 12px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .explorer-btn:hover {
            background: #e5e5e5;
        }

        .explorer-path {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }

        .explorer-content {
            flex: 1;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            align-content: start;
        }

        .explorer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .explorer-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .explorer-item img {
            width: 48px;
            height: 48px;
            margin-bottom: 4px;
        }

        .explorer-item span {
            font-size: 11px;
            text-align: center;
            word-break: break-word;
        }

        /* Chrome Styles */
        .chrome-toolbar {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: #f3f3f3;
            border-bottom: 1px solid #ddd;
            align-items: center;
        }

        .chrome-nav {
            display: flex;
            gap: 4px;
        }

        .chrome-nav-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .chrome-nav-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .chrome-url {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }

        .chrome-url:focus {
            box-shadow: 0 0 0 2px var(--primary);
        }

        .chrome-content {
            flex: 1;
            background: white;
        }

        .chrome-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .chrome-newtab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: white;
        }

        .chrome-newtab h1 {
            color: #4285f4;
            font-size: 48px;
            margin-bottom: 20px;
        }

        .chrome-search {
            width: 500px;
            padding: 12px 20px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
        }

        .chrome-search:focus {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        }
    </style>
</head>
<body>
    <!-- Desktop -->
    <div id="desktop"></div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="start-search">
            <input type="text" placeholder="Search for apps, settings, and documents">
        </div>
        <div class="start-pinned">
            <h3>Pinned</h3>
            <div class="pinned-apps" id="pinned-apps"></div>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="taskbar-icons" id="taskbar-icons"></div>
        <div class="system-tray">
            <div class="system-tray-item" id="tray-date"></div>
            <div class="system-tray-item" id="tray-time"></div>
        </div>
    </div>

    <!-- Window Container -->
    <div id="windows"></div>

    <script>
        // App definitions
        const apps = {
            word: {
                name: 'Word',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Microsoft_Office_Word_%282025%E2%80%93present%29.svg/960px-Microsoft_Office_Word_%282025%E2%80%93present%29.svg.png',
                width: 800,
                height: 600,
                render: renderWord
            },
            paint: {
                name: 'Paint',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/2/2b/Microsoft_Paint.svg',
                width: 700,
                height: 500,
                render: renderPaint
            },
            calculator: {
                name: 'Calculator',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/5/55/Windows_Calculator_icon.png',
                width: 320,
                height: 450,
                render: renderCalculator
            },
            notepad: {
                name: 'Notepad',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/c/c9/Windows_Notepad_icon.png',
                width: 600,
                height: 450,
                render: renderNotepad
            },
            explorer: {
                name: 'File Explorer',
                icon: 'https://img.icons8.com/fluent/1200/file-explorer-new.jpg',
                width: 800,
                height: 500,
                render: renderExplorer
            },
            chrome: {
                name: 'Chrome',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Google_Chrome_icon_%28February_2022%29.svg/960px-Google_Chrome_icon_%28February_2022%29.svg.png',
                width: 900,
                height: 600,
                render: renderChrome
            }
        };

        const desktopIcons = [
            { id: 'word', name: 'Word' },
            { id: 'paint', name: 'Paint' },
            { id: 'calculator', name: 'Calculator' },
            { id: 'notepad', name: 'Notepad' },
            { id: 'explorer', name: 'File Explorer' },
            { id: 'chrome', name: 'Chrome' }
        ];

        let zIndex = 100;
        let activeWindows = {};
        let windowStates = {};

        // Initialize desktop
        function initDesktop() {
            const desktop = document.getElementById('desktop');
            const taskbarIcons = document.getElementById('taskbar-icons');
            const pinnedApps = document.getElementById('pinned-apps');

            // Desktop icons
            desktopIcons.forEach(icon => {
                const app = apps[icon.id];
                const el = document.createElement('div');
                el.className = 'desktop-icon';
                el.innerHTML = `<img src="${app.icon}" alt="${icon.name}"><span>${icon.name}</span>`;
                el.onclick = () => openWindow(icon.id);
                desktop.appendChild(el);
            });

            // Taskbar icons
            desktopIcons.forEach(icon => {
                const app = apps[icon.id];
                const el = document.createElement('div');
                el.className = 'taskbar-icon';
                el.id = `taskbar-${icon.id}`;
                el.innerHTML = `<img src="${app.icon}" alt="${icon.name}">`;
                el.onclick = () => toggleWindow(icon.id);
                taskbarIcons.appendChild(el);
            });

            // Pinned apps in start menu
            desktopIcons.forEach(icon => {
                const app = apps[icon.id];
                const el = document.createElement('div');
                el.className = 'pinned-app';
                el.innerHTML = `<img src="${app.icon}" alt="${icon.name}"><span>${icon.name}</span>`;
                el.onclick = () => {
                    closeStartMenu();
                    openWindow(icon.id);
                };
                pinnedApps.appendChild(el);
            });

            // Start button
            const startBtn = document.createElement('div');
            startBtn.className = 'taskbar-icon';
            startBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#0078d4"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>';
            startBtn.onclick = toggleStartMenu;
            taskbarIcons.insertBefore(startBtn, taskbarIcons.firstChild);

            updateClock();
            setInterval(updateClock, 1000);
        }

        function updateClock() {
            const now = new Date();
            const date = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const time = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            document.getElementById('tray-date').textContent = date;
            document.getElementById('tray-time').textContent = time;
        }

        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('show');
        }

        function closeStartMenu() {
            document.getElementById('start-menu').classList.remove('show');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#start-menu') && !e.target.closest('.taskbar-icon:first-child')) {
                closeStartMenu();
            }
        });

        function openWindow(appId) {
            const app = apps[appId];

            if (activeWindows[appId]) {
                if (windowStates[appId].minimized) {
                    windowStates[appId].minimized = false;
                    document.getElementById(`window-${appId}`).classList.remove('minimized');
                }
                bringToFront(appId);
                return;
            }

            const windowsContainer = document.getElementById('windows');
            const windowEl = document.createElement('div');
            windowEl.className = 'window';
            windowEl.id = `window-${appId}`;
            windowEl.style.width = app.width + 'px';
            windowEl.style.height = app.height + 'px';
            windowEl.style.left = 100 + Object.keys(activeWindows).length * 30 + 'px';
            windowEl.style.top = 50 + Object.keys(activeWindows).length * 30 + 'px';
            windowEl.style.zIndex = ++zIndex;

            windowEl.innerHTML = `
                <div class="window-header" onmousedown="startDrag(event, '${appId}')">
                    <img src="${app.icon}" alt="">
                    <span class="window-title">${app.name}</span>
                    <div class="window-controls">
                        <div class="window-control" onclick="minimizeWindow('${appId}')">─</div>
                        <div class="window-control" onclick="maximizeWindow('${appId}')">□</div>
                        <div class="window-control close" onclick="closeWindow('${appId}')">✕</div>
                    </div>
                </div>
                <div class="window-content" id="content-${appId}"></div>
            `;

            windowsContainer.appendChild(windowEl);

            activeWindows[appId] = windowEl;
            windowStates[appId] = { minimized: false, maximized: false, x: windowEl.offsetLeft, y: windowEl.offsetTop };

            document.getElementById(`taskbar-${appId}`).classList.add('active');

            app.render(appId);

            windowEl.onmousedown = () => bringToFront(appId);
        }

        function bringToFront(appId) {
            const windowEl = activeWindows[appId];
            windowEl.style.zIndex = ++zIndex;
        }

        function minimizeWindow(appId) {
            const windowEl = activeWindows[appId];
            windowEl.classList.add('minimized');
            windowStates[appId].minimized = true;
            document.getElementById(`taskbar-${appId}`).classList.remove('active');
        }

        function maximizeWindow(appId) {
            const windowEl = activeWindows[appId];
            const state = windowStates[appId];

            if (state.maximized) {
                windowEl.style.left = state.x + 'px';
                windowEl.style.top = state.y + 'px';
                windowEl.style.width = apps[appId].width + 'px';
                windowEl.style.height = apps[appId].height + 'px';
                state.maximized = false;
            } else {
                state.x = windowEl.offsetLeft;
                state.y = windowEl.offsetTop;
                windowEl.style.left = '0';
                windowEl.style.top = '0';
                windowEl.style.width = '100%';
                windowEl.style.height = 'calc(100vh - 48px)';
                state.maximized = true;
            }
        }

        function closeWindow(appId) {
            const windowEl = activeWindows[appId];
            windowEl.remove();
            delete activeWindows[appId];
            delete windowStates[appId];
            document.getElementById(`taskbar-${appId}`).classList.remove('active');
        }

        function toggleWindow(appId) {
            if (activeWindows[appId]) {
                if (windowStates[appId].minimized) {
                    windowStates[appId].minimized = false;
                    document.getElementById(`window-${appId}`).classList.remove('minimized');
                    bringToFront(appId);
                    document.getElementById(`taskbar-${appId}`).classList.add('active');
                } else {
                    minimizeWindow(appId);
                }
            } else {
                openWindow(appId);
            }
        }

        // Drag functionality
        let dragData = null;

        function startDrag(e, appId) {
            if (windowStates[appId].maximized) return;

            dragData = {
                appId,
                startX: e.clientX,
                startY: e.clientY,
                origX: activeWindows[appId].offsetLeft,
                origY: activeWindows[appId].offsetTop
            };

            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        function doDrag(e) {
            if (!dragData) return;

            const dx = e.clientX - dragData.startX;
            const dy = e.clientY - dragData.startY;
            const windowEl = activeWindows[dragData.appId];

            windowEl.style.left = (dragData.origX + dx) + 'px';
            windowEl.style.top = Math.max(0, dragData.origY + dy) + 'px';
        }

        function stopDrag() {
            dragData = null;
            document.removeEventListener('mousemove', doDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // App renderers
        function renderCalculator(appId) {
            const content = document.getElementById(`content-${appId}`);
            content.innerHTML = `
                <div class="calc-display">
                    <input type="text" id="calc-display" value="0" readonly>
                </div>
                <div class="calc-buttons">
                    <button class="calc-btn operator" onclick="calcClear()">C</button>
                    <button class="calc-btn operator" onclick="calcBackspace()">←</button>
                    <button class="calc-btn operator" onclick="calcOperator('%')">%</button>
                    <button class="calc-btn operator" onclick="calcOperator('/')">÷</button>
                    <button class="calc-btn" onclick="calcNumber('7')">7</button>
                    <button class="calc-btn" onclick="calcNumber('8')">8</button>
                    <button class="calc-btn" onclick="calcNumber('9')">9</button>
                    <button class="calc-btn operator" onclick="calcOperator('*')">×</button>
                    <button class="calc-btn" onclick="calcNumber('4')">4</button>
                    <button class="calc-btn" onclick="calcNumber('5')">5</button>
                    <button class="calc-btn" onclick="calcNumber('6')">6</button>
                    <button class="calc-btn operator" onclick="calcOperator('-')">−</button>
                    <button class="calc-btn" onclick="calcNumber('1')">1</button>
                    <button class="calc-btn" onclick="calcNumber('2')">2</button>
                    <button class="calc-btn" onclick="calcNumber('3')">3</button>
                    <button class="calc-btn operator" onclick="calcOperator('+')">+</button>
                    <button class="calc-btn" onclick="calcNumber('0')">0</button>
                    <button class="calc-btn" onclick="calcNumber('.')">.</button>
                    <button class="calc-btn" onclick="calcNegate()">±</button>
                    <button class="calc-btn equals" onclick="calcEquals()">=</button>
                </div>
            `;
        }

        let calcValue = '0';
        let calcOperator = null;
        let calcPrevious = null;

        function calcUpdateDisplay() {
            document.getElementById('calc-display').value = calcValue;
        }

        function calcNumber(num) {
            if (calcValue === '0' && num !== '.') {
                calcValue = num;
            } else if (num === '.' && calcValue.includes('.')) {
                return;
            } else {
                calcValue += num;
            }
            calcUpdateDisplay();
        }

        function calcOperator(op) {
            calcPrevious = parseFloat(calcValue);
            calcOperator = op;
            calcValue = '0';
        }

        function calcEquals() {
            if (calcOperator === null || calcPrevious === null) return;

            const current = parseFloat(calcValue);
            let result;

            switch (calcOperator) {
                case '+': result = calcPrevious + current; break;
                case '-': result = calcPrevious - current; break;
                case '*': result = calcPrevious * current; break;
                case '/': result = current !== 0 ? calcPrevious / current : 'Error'; break;
                case '%': result = calcPrevious % current; break;
            }

            calcValue = String(result);
            calcOperator = null;
            calcPrevious = null;
            calcUpdateDisplay();
        }

        function calcClear() {
            calcValue = '0';
            calcOperator = null;
            calcPrevious = null;
            calcUpdateDisplay();
        }

        function calcBackspace() {
            calcValue = calcValue.length > 1 ? calcValue.slice(0, -1) : '0';
            calcUpdateDisplay();
        }

        function calcNegate() {
            calcValue = String(parseFloat(calcValue) * -1);
            calcUpdateDisplay();
        }

        function renderNotepad(appId) {
            const content = document.getElementById(`content-${appId}`);
            content.innerHTML = `
                <textarea class="notepad-content" id="notepad-text" placeholder="Start typing..."></textarea>
            `;
        }

        function renderPaint(appId) {
            const content = document.getElementById(`content-${appId}`);
            content.innerHTML = `
                <div class="paint-toolbar">
                    <button class="paint-tool active" onclick="setPaintTool('brush')">Brush</button>
                    <button class="paint-tool" onclick="setPaintTool('eraser')">Eraser</button>
                    <button class="paint-tool" onclick="setPaintTool('rect')">Rectangle</button>
                    <button class="paint-tool" onclick="setPaintTool('circle')">Circle</button>
                    <input type="color" id="paint-color" value="#000000" onchange="setPaintColor(this.value)">
                    <input type="range" id="paint-size" min="1" max="50" value="5" onchange="setPaintSize(this.value)">
                    <span id="paint-size-label">5px</span>
                    <button class="paint-tool" onclick="clearPaint()">Clear</button>
                </div>
                <div class="paint-canvas-container">
                    <canvas id="paint-canvas"></canvas>
                </div>
            `;

            setTimeout(() => initPaintCanvas(appId), 100);
        }

        let paintTool = 'brush';
        let paintColor = '#000000';
        let paintSize = 5;
        let paintCtx = null;
        let isPainting = false;
        let paintStartX, paintStartY;
        let tempCanvas = null;
        let tempCtx = null;

        function setPaintTool(tool) {
            paintTool = tool;
            document.querySelectorAll('.paint-tool').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function setPaintColor(color) {
            paintColor = color;
        }

        function setPaintSize(size) {
            paintSize = parseInt(size);
            document.getElementById('paint-size-label').textContent = size + 'px';
        }

        function clearPaint() {
            const canvas = document.getElementById('paint-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function initPaintCanvas(appId) {
            const container = document.querySelector(`#window-${appId} .paint-canvas-container`);
            const canvas = document.getElementById('paint-canvas');
            const containerRect = container.getBoundingClientRect();

            canvas.width = containerRect.width;
            canvas.height = containerRect.height;

            paintCtx = canvas.getContext('2d');
            paintCtx.fillStyle = 'white';
            paintCtx.fillRect(0, 0, canvas.width, canvas.height);

            tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx = tempCanvas.getContext('2d');

            canvas.onmousedown = (e) => startPaint(e);
            canvas.onmousemove = (e) => paint(e);
            canvas.onmouseup = () => stopPaint();
            canvas.onmouseleave = () => stopPaint();
        }

        function startPaint(e) {
            isPainting = true;
            const rect = e.target.getBoundingClientRect();
            paintStartX = e.clientX - rect.left;
            paintStartY = e.clientY - rect.top;

            tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            tempCtx.drawImage(e.target, 0, 0);

            if (paintTool === 'brush') {
                paintCtx.beginPath();
                paintCtx.moveTo(paintStartX, paintStartY);
            }
        }

        function paint(e) {
            if (!isPainting) return;

            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (paintTool === 'brush') {
                paintCtx.strokeStyle = paintColor;
                paintCtx.lineWidth = paintSize;
                paintCtx.lineCap = 'round';
                paintCtx.lineTo(x, y);
                paintCtx.stroke();
            } else if (paintTool === 'eraser') {
                paintCtx.strokeStyle = 'white';
                paintCtx.lineWidth = paintSize * 2;
                paintCtx.lineCap = 'round';
                paintCtx.lineTo(x, y);
                paintCtx.stroke();
            } else if (paintTool === 'rect' || paintTool === 'circle') {
                paintCtx.clearRect(0, 0, e.target.width, e.target.height);
                paintCtx.drawImage(tempCanvas, 0, 0);

                paintCtx.strokeStyle = paintColor;
                paintCtx.lineWidth = paintSize;

                if (paintTool === 'rect') {
                    paintCtx.strokeRect(paintStartX, paintStartY, x - paintStartX, y - paintStartY);
                } else {
                    paintCtx.beginPath();
                    const radius = Math.sqrt(Math.pow(x - paintStartX, 2) + Math.pow(y - paintStartY, 2));
                    paintCtx.arc(paintStartX, paintStartY, radius, 0, 2 * Math.PI);
                    paintCtx.stroke();
                }
            }
        }

        function stopPaint() {
            isPainting = false;
            if (paintTool === 'brush' || paintTool === 'eraser') {
                paintCtx.closePath();
            }
        }

        function renderWord(appId) {
            const content = document.getElementById(`content-${appId}`);
            content.innerHTML = `
                <div class="word-toolbar">
                    <button class="word-tool" onclick="formatWord('bold')"><b>B</b></button>
                    <button class="word-tool" onclick="formatWord('italic')"><i>I</i></button>
                    <button class="word-tool" onclick="formatWord('underline')"><u>U</u></button>
                    <button class="word-tool" onclick="formatWord('justifyLeft')">Left</button>
                    <button class="word-tool" onclick="formatWord('justifyCenter')">Center</button>
                    <button class="word-tool" onclick="formatWord('justifyRight')">Right</button>
                    <select class="word-tool" onchange="formatWord('fontSize', this.value); this.value='';">
                        <option value="">Size</option>
                        <option value="12">12</option>
                        <option value="16">16</option>
                        <option value="20">20</option>
                        <option value="24">24</option>
                        <option value="32">32</option>
                    </select>
                    <input type="color" class="word-tool" onchange="formatWord('foreColor', this.value)">
                    <button class="word-tool" onclick="saveWord()">Save</button>
                    <button class="word-tool" onclick="newWord()">New</button>
                </div>
                <div class="word-content">
                    <div contenteditable="true" id="word-editor" style="font-family: 'Calibri', sans-serif; min-height: 300px;">
                        <h1>Document Title</h1>
                        <p>Start typing your document here...</p>
                    </div>
                </div>
            `;
        }

        function formatWord(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('word-editor').focus();
        }

        function saveWord() {
            const content = document.getElementById('word-editor').innerHTML;
            const blob = new Blob([content], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'document.html';
            a.click();
        }

        function newWord() {
            document.getElementById('word-editor').innerHTML = '<h1></h1><p></p>';
        }

        // File Explorer
        const fileSystem = {
            'This PC': {
                type: 'root',
                children: {
                    'Desktop': { type: 'folder', children: {} },
                    'Documents': { type: 'folder', children: {} },
                    'Downloads': { type: 'folder', children: {} },
                    'Pictures': { type: 'folder', children: {} }
                }
            }
        };

        let currentPath = ['This PC'];

        function renderExplorer(appId) {
            const content = document.getElementById(`content-${appId}`);
            content.innerHTML = `
                <div class="explorer-toolbar">
                    <button class="explorer-btn" onclick="explorerBack()">←</button>
                    <button class="explorer-btn" onclick="explorerForward()">→</button>
                    <div class="explorer-path" id="explorer-path">This PC</div>
                </div>
                <div class="explorer-content" id="explorer-content"></div>
            `;
            renderExplorerContent();
        }

        function renderExplorerContent() {
            const content = document.getElementById('explorer-content');
            const pathDiv = document.getElementById('explorer-path');
            pathDiv.textContent = currentPath.join(' > ');

            content.innerHTML = '';

            const icons = {
                folder: 'https://img.icons8.com/color/96/folder.png',
                file: 'https://img.icons8.com/color/96/file.png',
                image: 'https://img.icons8.com/color/96/image.png',
                document: 'https://img.icons8.com/color/96/microsoft-word.png'
            };

            let current = fileSystem;
            for (const key of currentPath) {
                if (current[key]) {
                    current = current[key];
                }
            }

            if (current.children) {
                Object.keys(current.children).forEach(name => {
                    const item = current.children[name];
                    const el = document.createElement('div');
                    el.className = 'explorer-item';
                    el.innerHTML = `<img src="${icons[item.type] || icons.file}" alt=""><span>${name}</span>`;
                    el.ondblclick = () => {
                        if (item.type === 'folder') {
                            currentPath.push(name);
                            renderExplorerContent();
                        }
                    };
                    content.appendChild(el);
                });
            }

            // Add some sample files
            if (currentPath.join(' > ') === 'This PC > Documents') {
                const sampleFiles = [
                    { name: 'Notes.txt', type: 'document' },
                    { name: 'Report.docx', type: 'document' },
                    { name: 'Photo.jpg', type: 'image' }
                ];
                sampleFiles.forEach(file => {
                    const el = document.createElement('div');
                    el.className = 'explorer-item';
                    el.innerHTML = `<img src="${icons[file.type]}" alt=""><span>${file.name}</span>`;
                    content.appendChild(el);
                });
            }
        }

        function explorerBack() {
            if (currentPath.length > 1) {
                currentPath.pop();
                renderExplorerContent();
            }
        }

        function explorerForward() {
            // Simplified - would need history stack
        }

        // Chrome
        let chromeUrl = '';
        let chromeHistory = [];

        function renderChrome(appId) {
            const content = document.getElementById(`content-${appId}`);
            content.innerHTML = `
                <div class="chrome-toolbar">
                    <div class="chrome-nav">
                        <button class="chrome-nav-btn" onclick="chromeGoBack()">←</button>
                        <button class="chrome-nav-btn" onclick="chromeGoForward()">→</button>
                        <button class="chrome-nav-btn" onclick="chromeReload()">↻</button>
                    </div>
                    <input type="text" class="chrome-url" id="chrome-url" placeholder="Search or enter URL" onkeypress="chromeNavigate(event)">
                </div>
                <div class="chrome-content" id="chrome-content">
                    <div class="chrome-newtab">
                        <h1>Google</h1>
                        <input type="text" class="chrome-search" placeholder="Search Google..." onkeypress="googleSearch(event)">
                    </div>
                </div>
            `;
        }

        function chromeNavigate(e) {
            if (e.key === 'Enter') {
                const url = document.getElementById('chrome-url').value;
                let src = url;

                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    if (url.includes('.') && !url.includes(' ')) {
                        src = 'https://' + url;
                    } else {
                        src = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                    }
                }

                const content = document.getElementById('chrome-content');
                content.innerHTML = `<iframe src="${src}" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>`;
            }
        }

        function googleSearch(e) {
            if (e.key === 'Enter') {
                const query = e.target.value;
                window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
            }
        }

        function chromeGoBack() {
            if (chromeHistory.length > 1) {
                chromeHistory.pop();
                const prev = chromeHistory[chromeHistory.length - 1];
                const content = document.getElementById('chrome-content');
                content.innerHTML = `<iframe src="${prev}" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>`;
            }
        }

        function chromeGoForward() {
            // Simplified
        }

        function chromeReload() {
            const iframe = document.querySelector('#chrome-content iframe');
            if (iframe) {
                iframe.src = iframe.src;
            }
        }

        // Initialize
        initDesktop();
    </script>
