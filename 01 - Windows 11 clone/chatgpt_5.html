<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Windows 11 Desktop – In-Browser Clone</title>
  <style>
    :root{
      --text:#e6f0ff;
      --shadow:rgba(0,0,0,.35);
      --glass:rgba(255,255,255,.12);
      --glass-strong:rgba(255,255,255,.22);
      --accent:#3b82f6;
      --accent-2:#2563eb;
      --title:#111827;
    }
    html,body{height:100%;}
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family: Segoe UI, system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
      /* Windows 11 default wallpaper (Bloom). Using a stable mirror URL. */
      background:url('https://wallpaperaccess.com/full/5712447.jpg') center/cover fixed no-repeat;
    }

    /* Desktop */
    #desktop{position:relative;width:100%;height:100%;}
    .desktop-grid{position:absolute;top:20px;left:18px;display:grid;grid-template-columns:repeat(1,96px);grid-auto-rows:100px;gap:8px 12px;}

    .icon{width:96px;user-select:none;cursor:default;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;border-radius:8px;transition:background .2s, outline .2s;}
    .icon.selected{outline:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);}
    .icon svg{width:48px;height:48px;filter: drop-shadow(0 2px 4px var(--shadow));}
    .icon span{font-size:13px;text-align:center;text-shadow:0 2px 6px var(--shadow);}

    /* Window */
    .window{position:absolute;inset:auto auto 84px auto;min-width:420px;min-height:280px;width:720px;height:480px;background:#fff;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.45), 0 3px 10px rgba(0,0,0,.35);overflow:hidden;color:#0b1220;display:flex;flex-direction:column;}
    .titlebar{display:flex;align-items:center;gap:10px;height:42px;background:linear-gradient(180deg,#ffffff,#f6f7fb);border-bottom:1px solid #e8eaf3;padding:0 10px 0 8px;cursor:move;}
    .titlebar .appicon{width:18px;height:18px;border-radius:4px;}
    .titlebar .title{font-size:13px;color:#0b1220;flex:1;}
    .titlebar .controls{display:flex;gap:4px;}
    .btn{width:36px;height:30px;display:grid;place-items:center;border-radius:6px;border:none;background:transparent;cursor:pointer;}
    .btn:hover{background:#e8edf7}
    .btn.close:hover{background:#e81123;color:#fff}
    .content{flex:1;display:flex;min-height:0;background:#fafbff}
    .resizable{resize:both;}
    .hidden{display:none !important}

    /* Taskbar */
    .taskbar{position:absolute;left:0;right:0;bottom:0;height:68px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.18);backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);border-top:1px solid rgba(255,255,255,.35)}
    .task-icon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:transparent;cursor:pointer}
    .task-icon:hover{background:rgba(255,255,255,.25)}

    /* Apps */
    .ribbon{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #e8eaf3;background:#f7f8fc}
    .ribbon button,.toolbar button{border:1px solid #d9ddea;padding:6px 10px;border-radius:8px;background:#fff;cursor:pointer;font-size:12px}
    .ribbon button:hover,.toolbar button:hover{background:#f0f5ff}
    .editor{padding:16px;flex:1;overflow:auto}
    .editor[contenteditable="true"]{outline:none;}
    .monospace{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
    .textarea{width:100%;height:100%;border:none;outline:none;padding:12px;font-size:14px}
    .sidebar{width:240px;border-right:1px solid #e8eaf3;background:#fff}
    .list{height:100%;overflow:auto}
    .list-item{padding:10px 12px;border-bottom:1px solid #eef1f7;display:flex;align-items:center;gap:8px;cursor:pointer}
    .list-item:hover{background:#f6f8fe}
    .addressbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid #e8eaf3;background:#f7f8fc}
    .addressbar input{flex:1;padding:8px 10px;border:1px solid #d9ddea;border-radius:8px}
    .addressbar button{padding:8px 12px;border:1px solid #d9ddea;border-radius:8px;background:#fff;cursor:pointer}
    iframe.browser{border:none;width:100%;height:100%;}
    .canvas-wrap{display:flex;gap:12px;padding:10px;border-bottom:1px solid #e8eaf3;background:#f7f8fc;align-items:center}
    input[type=color]{height:32px;border:none;background:transparent}
    input[type=range]{width:140px}

    /* Selection rectangle */
    .select-rect{position:absolute;border:1px dashed rgba(255,255,255,.8);background:rgba(255,255,255,.2);pointer-events:none}

    /* Helper badges */
    .badge{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 6px;border-radius:6px}

    /* Small utility */
    .muted{opacity:.65}
  </style>
</head>
<body>
  <div id="desktop">
    <div class="desktop-grid" id="iconGrid">
      <!-- Word -->
      <div class="icon" data-app="word" title="MS Word">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="7" y="6" width="28" height="36" rx="4" fill="#185ABD"/>
          <rect x="19" y="10" width="22" height="28" rx="3" fill="#2B7CD3"/>
          <text x="21.5" y="31" font-family="Segoe UI, Arial" font-size="14" fill="#fff" font-weight="700">W</text>
        </svg>
        <span>Word</span>
      </div>
      <!-- Paint -->
      <div class="icon" data-app="paint" title="Paint">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="18" fill="#f59e0b"/>
          <circle cx="19" cy="19" r="3.2" fill="#22c55e"/>
          <circle cx="28" cy="16" r="3" fill="#60a5fa"/>
          <circle cx="31" cy="27" r="3" fill="#ef4444"/>
          <rect x="34" y="26" width="10" height="4" rx="2" fill="#9ca3af" transform="rotate(45 39 28)"/>
        </svg>
        <span>Paint</span>
      </div>
      <!-- Calculator -->
      <div class="icon" data-app="calc" title="Calculator">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="10" y="6" width="28" height="36" rx="6" fill="#0ea5e9"/>
          <rect x="14" y="12" width="20" height="8" rx="2" fill="#e2e8f0"/>
          <g fill="#fff">
            <rect x="14" y="24" width="6" height="6" rx="1"/>
            <rect x="22" y="24" width="6" height="6" rx="1"/>
            <rect x="30" y="24" width="6" height="6" rx="1"/>
            <rect x="14" y="32" width="6" height="6" rx="1"/>
            <rect x="22" y="32" width="14" height="6" rx="1"/>
          </g>
        </svg>
        <span>Calculator</span>
      </div>
      <!-- Notepad -->
      <div class="icon" data-app="notepad" title="Notepad">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="9" y="6" width="30" height="36" rx="6" fill="#22c55e"/>
          <rect x="14" y="12" width="20" height="3" rx="1.5" fill="#eafff0"/>
          <rect x="14" y="19" width="20" height="2.5" rx="1.25" fill="#eafff0"/>
          <rect x="14" y="26" width="20" height="2.5" rx="1.25" fill="#eafff0"/>
          <rect x="14" y="33" width="14" height="2.5" rx="1.25" fill="#eafff0"/>
        </svg>
        <span>Notepad</span>
      </div>
      <!-- File Explorer -->
      <div class="icon" data-app="explorer" title="File Explorer">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 18a6 6 0 0 1 6-6h7l3 3h14a6 6 0 0 1 6 6v13a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6V18z" fill="#FACC15"/>
          <rect x="6" y="20" width="36" height="20" rx="4" fill="#fde047"/>
        </svg>
        <span>File Explorer</span>
      </div>
      <!-- Chrome -->
      <div class="icon" data-app="chrome" title="Chrome">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="20" fill="#ef4444"/>
          <path d="M24 24 11 14a20 20 0 0 1 26 2l-13 8z" fill="#f59e0b"/>
          <path d="M24 24 18 35a20 20 0 0 1-7-21l13 10z" fill="#22c55e"/>
          <circle cx="24" cy="24" r="8.5" fill="#3b82f6"/>
          <circle cx="24" cy="24" r="5" fill="#e0f2fe"/>
        </svg>
        <span>Chrome</span>
      </div>
    </div>

    <!-- Selection rectangle for desktop like drag -->
    <div id="selectRect" class="select-rect hidden"></div>

    <!-- Taskbar (centered icons) -->
    <div class="taskbar">
      <div class="task-icon" data-app="explorer" title="File Explorer">🏞️</div>
      <div class="task-icon" data-app="word" title="Word">🅆</div>
      <div class="task-icon" data-app="notepad" title="Notepad">📝</div>
      <div class="task-icon" data-app="calc" title="Calculator">🧮</div>
      <div class="task-icon" data-app="paint" title="Paint">🎨</div>
      <div class="task-icon" data-app="chrome" title="Chrome">🌐</div>
    </div>
  </div>

  <script>
  // ===== Utilities =====
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

  let zIndexCounter = 10;
  const bringToFront = (el) => {el.style.zIndex = ++zIndexCounter;};

  // Basic FS in localStorage
  const FS_KEY = 'win11.fs.v1';
  const nowIso = () => new Date().toISOString();
  const loadFS = () => JSON.parse(localStorage.getItem(FS_KEY) || '{}');
  const saveFS = (fs) => localStorage.setItem(FS_KEY, JSON.stringify(fs));
  const ensureFS = () => {
    let fs = loadFS();
    if (!fs['/']) fs['/'] = { type:'dir', name:'/', children:['/Documents','/Pictures','/Desktop'] };
    if (!fs['/Documents']) fs['/Documents'] = { type:'dir', name:'Documents', children:[], parent:'/' };
    if (!fs['/Pictures']) fs['/Pictures'] = { type:'dir', name:'Pictures', children:[], parent:'/' };
    if (!fs['/Desktop']) fs['/Desktop'] = { type:'dir', name:'Desktop', children:[], parent:'/' };
    if (!fs['/Documents/Welcome.docx']) {
      fs['/Documents/Welcome.docx'] = { type:'doc', name:'Welcome.docx', created: nowIso(), updated: nowIso(), content: '<h1>Welcome</h1><p>This is a simple document. Try editing and saving it from <strong>Word</strong>.</p>' };
      fs['/Documents'].children.push('/Documents/Welcome.docx');
    }
    if (!fs['/Documents/Notes.txt']) {
      fs['/Documents/Notes.txt'] = { type:'txt', name:'Notes.txt', created: nowIso(), updated: nowIso(), content: 'Hello from Notepad!

- You can type here.
- Use File Explorer to open files.' };
      fs['/Documents'].children.push('/Documents/Notes.txt');
    }
    saveFS(fs);
  };
  ensureFS();

  const fsAPI = {
    list(path){ const fs = loadFS(); const node = fs[path]; if (!node || node.type!=='dir') return []; return node.children.map(p=>fs[p]); },
    mkdir(path, name){ const fs = loadFS(); const dir = fs[path]; const newPath = `${path}/${name}`.replace(/\/+/g,'/'); if(fs[newPath]) return; fs[newPath] = { type:'dir', name, children:[], parent:path }; dir.children.push(newPath); saveFS(fs); },
    create(path, name, type, content=''){ const fs=loadFS(); const newPath = `${path}/${name}`.replace(/\/+/g,'/'); if(fs[newPath]) throw new Error('Exists'); fs[newPath] = { type, name, content, created: nowIso(), updated: nowIso() }; fs[path].children.push(newPath); saveFS(fs); return newPath; },
    read(path){ const fs = loadFS(); return fs[path]; },
    write(path, content){ const fs=loadFS(); fs[path].content = content; fs[path].updated = nowIso(); saveFS(fs); },
    remove(path){ const fs=loadFS(); const node = fs[path]; if(!node) return; if(node.type==='dir' && node.children.length) throw new Error('Not empty'); const parent = fs[node.parent || path.split('/').slice(0,-1).join('/') || '/']; if(parent && parent.children){ parent.children = parent.children.filter(p=>p!==path);} delete fs[path]; saveFS(fs); },
    rename(path, newName){ const fs = loadFS(); const node = fs[path]; if(!node) return; const parentPath = node.parent || path.split('/').slice(0,-1).join('/') || '/'; const newPath = `${parentPath}/${newName}`.replace(/\/+/g,'/'); if(fs[newPath]) throw new Error('Exists');
      // move
      fs[newPath] = { ...node, name:newName };
      const parent = fs[parentPath]; parent.children = parent.children.map(p=> p===path? newPath:p);
      delete fs[path]; saveFS(fs); return newPath; }
  };

  // Create window
  function makeWindow(title, iconSVG, { width=720, height=480, x=120, y=100 } = {}){
    const win = document.createElement('div');
    win.className = 'window resizable';
    win.style.left = x + 'px';
    win.style.top = y + 'px';
    win.style.width = width + 'px';
    win.style.height = height + 'px';
    win.innerHTML = `
      <div class="titlebar">
        <div class="appicon">${iconSVG}</div>
        <div class="title">${title}</div>
        <div class="controls">
          <button class="btn minimize" title="Minimize">&#9472;</button>
          <button class="btn maximize" title="Maximize">&#9633;</button>
          <button class="btn close" title="Close">&#10005;</button>
        </div>
      </div>
      <div class="content"></div>`;
    document.body.appendChild(win);
    bringToFront(win);

    // Dragging
    const bar = win.querySelector('.titlebar');
    let drag = null;
    bar.addEventListener('mousedown', (e)=>{
      if (e.target.closest('.controls')) return; // don't drag from buttons
      drag = {dx:e.clientX - win.offsetLeft, dy:e.clientY - win.offsetTop};
      bringToFront(win);
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up, { once:true });
      function move(ev){ win.style.left = Math.max(0, ev.clientX - drag.dx)+ 'px'; win.style.top = Math.max(0, ev.clientY - drag.dy)+ 'px'; }
      function up(){ document.removeEventListener('mousemove', move); }
    });
    // Controls
    win.querySelector('.btn.close').onclick = ()=> win.remove();
    let maximized = false; let before = {left:0,top:0,width:0,height:0};
    win.querySelector('.btn.maximize').onclick = ()=>{
      if(!maximized){ before = { left:win.offsetLeft, top:win.offsetTop, width:win.offsetWidth, height:win.offsetHeight}; win.style.left='0px'; win.style.top='0px'; win.style.width= innerWidth+'px'; win.style.height = (innerHeight-68)+'px'; maximized=true;}
      else { win.style.left=before.left+'px'; win.style.top=before.top+'px'; win.style.width=before.width+'px'; win.style.height=before.height+'px'; maximized=false; }
    };
    win.querySelector('.btn.minimize').onclick = ()=>{ win.classList.add('hidden'); setTimeout(()=>win.remove(),10); };

    win.addEventListener('mousedown', ()=> bringToFront(win));
    return win;
  }

  // ===== Apps =====
  const Icons = {
    word:`<svg viewBox='0 0 18 18'><rect width='18' height='18' rx='4' fill='#185ABD'/><text x='4' y='13' font-size='10' font-family='Segoe UI, Arial' fill='#fff' font-weight='700'>W</text></svg>`,
    paint:`<svg viewBox='0 0 18 18'><circle cx='9' cy='9' r='8' fill='#f59e0b'/><circle cx='6.5' cy='6.5' r='1.4' fill='#22c55e'/><circle cx='11' cy='5' r='1.3' fill='#60a5fa'/><circle cx='12.5' cy='10' r='1.3' fill='#ef4444'/></svg>`,
    calc:`<svg viewBox='0 0 18 18'><rect width='18' height='18' rx='4' fill='#0ea5e9'/><rect x='3' y='3' width='12' height='4' rx='1' fill='#e2e8f0'/><g fill='#fff'><rect x='3' y='9' width='4' height='4' rx='1'/><rect x='7' y='9' width='4' height='4' rx='1'/><rect x='11' y='9' width='4' height='4' rx='1'/><rect x='3' y='13' width='4' height='4' rx='1'/><rect x='7' y='13' width='8' height='4' rx='1'/></g></svg>`,
    notepad:`<svg viewBox='0 0 18 18'><rect width='18' height='18' rx='4' fill='#22c55e'/></svg>`,
    explorer:`<svg viewBox='0 0 18 18'><path d='M2 7a4 4 0 0 1 4-4h3l2 2h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V7z' fill='#FACC15'/></svg>`,
    chrome:`<svg viewBox='0 0 18 18'><circle cx='9' cy='9' r='8' fill='#ef4444'/><circle cx='9' cy='9' r='3.5' fill='#3b82f6'/></svg>`
  };

  function appWord(){
    const win = makeWindow('Word', Icons.word, {x:160,y:90});
    const content = win.querySelector('.content');
    content.innerHTML = `
      <div class='ribbon'>
        <button data-cmd='bold'><b>Bold</b></button>
        <button data-cmd='italic'><i>Italic</i></button>
        <button data-cmd='underline'><u>Underline</u></button>
        <button data-cmd='insertUnorderedList'>• List</button>
        <button id='saveDoc'>Save</button>
        <select id='filePicker'><option value=''>Open…</option></select>
        <span class='muted'>Format:</span>
        <select id='block'>
          <option value='p'>Paragraph</option>
          <option value='h1'>Heading 1</option>
          <option value='h2'>Heading 2</option>
          <option value='h3'>Heading 3</option>
        </select>
      </div>
      <div class='editor' id='doc' contenteditable='true'>
        <h1>Blank document</h1>
        <p>Type here…</p>
      </div>`;

    // Commands
    content.querySelectorAll('[data-cmd]').forEach(btn=> btn.onclick = ()=>document.execCommand(btn.dataset.cmd,false,null));
    content.querySelector('#block').onchange = (e)=>{
      document.execCommand('formatBlock', false, e.target.value);
    };

    // Save/Open with FS
    const pick = content.querySelector('#filePicker');
    const refreshPicker = ()=>{
      pick.innerHTML = `<option value=''>Open…</option>` + fsAPI.list('/Documents').filter(x=>x.type==='doc').map(x=>`<option value="${x.name}">${x.name}</option>`).join('');
    };
    refreshPicker();

    content.querySelector('#saveDoc').onclick = ()=>{
      const name = prompt('Save as (Documents):', 'New Document.docx');
      if(!name) return;
      const html = content.querySelector('#doc').innerHTML;
      try{ const newPath = fsAPI.create('/Documents', name, 'doc', html); alert('Saved to '+newPath); refreshPicker(); }
      catch(e){ alert('Could not save: '+e.message); }
    };
    pick.onchange = ()=>{
      if(!pick.value) return; const node = fsAPI.read('/Documents/'+pick.value); if(node){ $('#doc', content).innerHTML = node.content; }
    };
  }

  function appNotepad(){
    const win = makeWindow('Notepad', Icons.notepad, {x:220,y:140,width:640,height:420});
    const content = win.querySelector('.content');
    content.innerHTML = `
      <div class='toolbar' style='padding:8px;border-bottom:1px solid #e8eaf3;background:#f7f8fc'>
        <button id='new'>New</button>
        <button id='open'>Open</button>
        <button id='save'>Save</button>
      </div>
      <textarea class='textarea monospace' id='pad'></textarea>`;
    const ta = content.querySelector('#pad');
    $('#new',content).onclick = ()=> ta.value='';
    $('#open',content).onclick = ()=>{
      const list = fsAPI.list('/Documents').filter(x=>x.type==='txt');
      if(!list.length) return alert('No .txt files in Documents.');
      const name = prompt('Open which file?
'+list.map(x=>x.name).join('
'));
      if(!name) return; const node = fsAPI.read('/Documents/'+name); if(node) ta.value = node.content;
    };
    $('#save',content).onclick = ()=>{
      let name = prompt('Save as (Documents):', 'Note.txt'); if(!name) return; name = name.endsWith('.txt')? name: name+'.txt';
      try{ fsAPI.create('/Documents', name, 'txt', ta.value); alert('Saved.'); } catch(e){ if(e.message==='Exists'){ fsAPI.write('/Documents/'+name, ta.value); alert('Updated.'); } else alert(e.message); }
    };
  }

  function appCalc(){
    const win = makeWindow('Calculator', Icons.calc, {x:280,y:110,width:340,height:430});
    const content = win.querySelector('.content');
    content.innerHTML = `
      <div style='padding:16px;display:flex;flex-direction:column;gap:10px;width:100%'>
        <input id='disp' class='monospace' style='font-size:24px;padding:10px;border:1px solid #d9ddea;border-radius:10px' readonly />
        <div id='keys' style='display:grid;grid-template-columns:repeat(4,1fr);gap:8px;'>
          ${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','⌫','(',')'].map(k=>`<button style='padding:12px;border:1px solid #d9ddea;border-radius:10px;background:#fff;font-size:16px'>${k}</button>`).join('')}
        </div>
      </div>`;
    const disp = $('#disp', content); const keys = $('#keys', content); let expr='';
    const update = ()=> disp.value = expr;
    keys.addEventListener('click', e=>{
      if(e.target.tagName!=='BUTTON') return; const k = e.target.textContent;
      if(k==='C'){ expr=''; }
      else if(k==='⌫'){ expr = expr.slice(0,-1); }
      else if(k==='='){ try{ expr = String(Function('return '+expr)()); } catch{ expr = 'Error'; setTimeout(()=>expr='',800); }
      } else { expr += k; }
      update();
    });
    update();
  }

  function appPaint(){
    const win = makeWindow('Paint', Icons.paint, {x:140,y:160,width:780,height:520});
    const content = win.querySelector('.content');
    content.innerHTML = `
      <div class='canvas-wrap'>
        <span>Color</span><input type='color' id='color' value='#1f2937'/>
        <span>Size</span><input type='range' id='size' min='1' max='40' value='8'/>
        <button id='clear'>Clear</button>
        <button id='save'>Save PNG</button>
      </div>
      <canvas id='canvas' style='flex:1;background:#fff;cursor:crosshair'></canvas>`;
    const canvas = $('#canvas',content); const ctx = canvas.getContext('2d');
    const color = $('#color',content); const size = $('#size',content);

    function fit(){ canvas.width = content.clientWidth; canvas.height = content.clientHeight - 52; }
    new ResizeObserver(fit).observe(content); fit();

    let drawing=false, last=null;
    canvas.addEventListener('mousedown', e=>{ drawing=true; last = [e.offsetX,e.offsetY]; });
    canvas.addEventListener('mousemove', e=>{
      if(!drawing) return; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=color.value; ctx.lineWidth = size.value; ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(e.offsetX,e.offsetY); ctx.stroke(); last=[e.offsetX,e.offsetY];
    });
    document.addEventListener('mouseup', ()=> drawing=false);

    $('#clear',content).onclick = ()=> ctx.clearRect(0,0,canvas.width,canvas.height);
    $('#save',content).onclick = ()=>{
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a'); a.href = url; a.download = 'paint.png'; a.click();
    };
  }

  function appExplorer(){
    const win = makeWindow('File Explorer', Icons.explorer, {x:200,y:100,width:820,height:520});
    const content = win.querySelector('.content');
    content.innerHTML = `
      <div class='sidebar'>
        <div class='list' id='tree'></div>
      </div>
      <div style='flex:1;display:flex;flex-direction:column;min-width:0'>
        <div class='toolbar' style='gap:6px;padding:8px;border-bottom:1px solid #e8eaf3;background:#f7f8fc'>
          <button id='newTxt'>New Text File</button>
          <button id='newDoc'>New Doc</button>
          <button id='newFolder'>New Folder</button>
          <button id='del'>Delete</button>
          <button id='ren'>Rename</button>
        </div>
        <div class='list' id='files' style='flex:1'></div>
      </div>`;

    let cwd = '/Documents';

    function drawTree(){
      const el = $('#tree', content); el.innerHTML = '';
      ['/','/Desktop','/Documents','/Pictures'].forEach(p=>{
        const d = document.createElement('div'); d.className='list-item'; d.textContent = p.replace('/','')||'This PC'; d.dataset.path=p; el.appendChild(d);
      });
    }
    function drawFiles(){
      const el = $('#files', content); el.innerHTML = '';
      fsAPI.list(cwd).forEach(node=>{
        const div = document.createElement('div'); div.className='list-item'; div.innerHTML = `<strong>${node.name}</strong> <span class='muted' style='margin-left:auto'>${node.type}</span>`; div.onclick = ()=> openNode(node); el.appendChild(div);
      });
    }
    function openNode(node){
      if(node.type==='dir'){ cwd = (node.parent? (node.parent+'/'+node.name):'/') .replace(/\+/g,'/'); drawFiles(); }
      if(node.type==='txt'){ appNotepad(); setTimeout(()=>{ const w = [...document.querySelectorAll('.window')].pop(); w.querySelector('#pad').value = node.content; },50); }
      if(node.type==='doc'){ appWord(); setTimeout(()=>{ const w = [...document.querySelectorAll('.window')].pop(); w.querySelector('#doc').innerHTML = node.content; },50); }
    }

    $('#newTxt',content).onclick = ()=>{ try{ const p = fsAPI.create(cwd,'New File.txt','txt',''); drawFiles(); }catch(e){ alert(e.message);} };
    $('#newDoc',content).onclick = ()=>{ try{ const p = fsAPI.create(cwd,'New Document.docx','doc','<p>New document</p>'); drawFiles(); }catch(e){ alert(e.message);} };
    $('#newFolder',content).onclick = ()=>{ const name = prompt('Folder name:','New Folder'); if(!name) return; fsAPI.mkdir(cwd,name); drawFiles(); };
    $('#del',content).onclick = ()=>{ const name = prompt('Delete which item?'); if(!name) return; try{ fsAPI.remove((cwd+'/'+name).replace(/\+/g,'/')); drawFiles(); }catch(e){ alert(e.message);} };
    $('#ren',content).onclick = ()=>{ const from = prompt('Rename which item?'); if(!from) return; const to = prompt('New name:'); if(!to) return; try{ fsAPI.rename((cwd+'/'+from).replace(/\+/g,'/'), to); drawFiles(); }catch(e){ alert(e.message);} };

    $('#tree',content).addEventListener('click', e=>{ if(e.target.classList.contains('list-item')){ cwd = e.target.dataset.path; drawFiles(); }});

    drawTree(); drawFiles();
  }

  function appChrome(){
    const win = makeWindow('Chrome', Icons.chrome, {x:260,y:160,width:860,height:560});
    const content = win.querySelector('.content');
    content.innerHTML = `
      <div class='addressbar'>
        <input id='url' placeholder='Enter URL (e.g., https://example.org)'/>
        <button id='go'>Go</button>
        <button id='newtab'>Open in new tab</button>
      </div>
      <iframe class='browser' id='view' src='https://example.org'></iframe>
      <div class='badge muted'>Some sites block embedding in iframes.</div>`;
    const view = $('#view',content); const url = $('#url',content);
    $('#go',content).onclick = ()=>{
      let u = url.value.trim(); if(!u) return; if(!/^https?:\/\//i.test(u)) u = 'https://'+u; view.src = u; };
    $('#newtab',content).onclick = ()=>{ let u = url.value.trim() || view.src; if(u) window.open(/^https?:\/\//i.test(u)? u: ('https://'+u),'_blank'); };
  }

  // ===== Desktop interactions =====
  const appMap = { word: appWord, paint: appPaint, calc: appCalc, notepad: appNotepad, explorer: appExplorer, chrome: appChrome };
  $$('#iconGrid .icon, .task-icon').forEach(el=>{
    el.addEventListener('dblclick', ()=>{ const app = el.dataset.app; if(app && appMap[app]) appMap[app](); });
    el.addEventListener('click', (e)=>{ $$('#iconGrid .icon').forEach(i=>i.classList.remove('selected')); if(el.classList.contains('icon')) el.classList.add('selected'); e.stopPropagation(); });
  });

  // Click to clear selection
  $('#desktop').addEventListener('click', ()=> $$('#iconGrid .icon').forEach(i=>i.classList.remove('selected')));

  // Desktop drag selection rectangle (visual only)
  (function(){
    const area = $('#desktop'); const rect = $('#selectRect');
    let start=null; area.addEventListener('mousedown', (e)=>{
      if(e.target.closest('.icon')||e.target.closest('.window')) return;
      start = {x:e.clientX, y:e.clientY}; rect.classList.remove('hidden'); rect.style.left=start.x+'px'; rect.style.top=start.y+'px'; rect.style.width='0px'; rect.style.height='0px';
      function move(ev){ rect.style.left = Math.min(start.x,ev.clientX)+'px'; rect.style.top = Math.min(start.y,ev.clientY)+'px'; rect.style.width = Math.abs(ev.clientX-start.x)+'px'; rect.style.height = Math.abs(ev.clientY-start.y)+'px'; }
      function up(){ rect.classList.add('hidden'); document.removeEventListener('mousemove', move); }
      document.addEventListener('mousemove', move); document.addEventListener('mouseup', up, { once:true });
    });
  })();

  // Auto-open Explorer on start for demo
  appExplorer();
  </script>
</body>
</html>
