        /* --- Global Styles --- */
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }

        /* --- Desktop --- */
        #desktop {
            width: 100%;
            height: 100%;
            background: var(--wallpaper) no-repeat center center;
            background-size: cover;
            position: relative;
        }

        #desktop-icons {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            height: 100%;
            align-content: flex-start;
        }

        .desktop-icon {
            width: 80px;
            text-align: center;
            padding: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
        }

        .desktop-icon:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .desktop-icon:active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .desktop-icon img {
            width: 48px;
            height: 48px;
        }

        .desktop-icon p {
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            margin: 5px 0 0 0;
            word-wrap: break-word;
        }

        /* --- Taskbar --- */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background-color: rgba(240, 240, 240, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        #taskbar-center {
            display: flex;
            justify-content: center;
            flex-grow: 1;
        }
        
        .taskbar-icon {
            width: 40px;
            height: 40px;
            margin: 0 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .taskbar-icon:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }

        #start-button {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%230078d4"><path d="M11 2.268C11.332 2.094 11.668 2 12 2s.668.094 1 .268V11h8.732c.174.332.268.668.268 1s-.094.668-.268 1H12v8.732c-.332.174-.668.268-1 .268s-.668-.094-1-.268V12H2.268C2.094 11.668 2 11.332 2 11s.094-.668.268-1H11V2.268z"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 20px;
        }

        #taskbar-right {
            display: flex;
            align-items: center;
            padding-right: 10px;
        }

        #clock {
            color: #000;
            font-size: 12px;
            text-align: right;
            padding: 0 10px;
        }

        /* --- Start Menu --- */
        #start-menu {
            position: absolute;
            bottom: 58px; /* taskbar height + margin */
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 650px;
            background-color: rgba(240, 240, 240, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 999;
            display: none;
            padding: 20px;
            box-sizing: border-box;
        }
        
        #start-menu-search {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        #start-menu-apps {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }

        /* --- Window Styles --- */
        .window {
            position: absolute;
            min-width: 200px;
            min-height: 150px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            resize: both;
            overflow: hidden;
        }
        
        .window.active {
            border-color: #0078d4;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        .window-header {
            height: 30px;
            background-color: #e0e0e0;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px 0 10px;
            font-size: 14px;
            color: #333;
            border-top-left-radius: 7px;
            border-top-right-radius: 7px;
        }

        .window-controls {
            display: flex;
        }

        .window-control {
            width: 45px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            cursor: pointer;
            font-family: 'Marlett', 'Webdings'; /* Font with symbols for controls */
            font-size: 14px;
        }
        
        .window-control:hover { background-color: #d0d0d0; }
        .window-control.close:hover { background-color: #e81123; color: white; }

        .window-content {
            flex-grow: 1;
            overflow: auto;
            background-color: #fff;
        }
        
        /* --- Specific App Styles --- */
        /* Calculator */
        .calculator { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; height: 100%; }
        .calc-display { grid-column: 1 / -1; background: #222; color: white; text-align: right; padding: 10px; font-size: 2em; }
        .calc-btn { background: #f0f0f0; border: none; font-size: 1.2em; cursor: pointer; }
        .calc-btn:hover { background: #ddd; }
        .calc-btn.operator { background: #ff9500; color: white; }

        /* Notepad */
        .notepad-textarea { width: 100%; height: 100%; border: none; resize: none; box-sizing: border-box; padding: 5px; font-family: 'Consolas', monospace; }
        
        /* Paint */
        .paint-canvas { display: block; }
        .paint-toolbar { padding: 5px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; }
        .paint-toolbar input[type=color] { border: none; padding: 0; width: 30px; height: 30px; }
        
        /* Chrome */
        .chrome-bar { display: flex; padding: 5px; background: #eee; }
        .chrome-bar input { flex-grow: 1; border: 1px solid #ccc; border-radius: 20px; padding: 5px 10px; }
        .chrome-content { width: 100%; height: 100%; border: none; }
    </style>
</head>

    <div id="window-container"></div>

    <div id="start-menu">
        <input id="start-menu-search" type="text" placeholder="Type here to search">
        <div id="start-menu-apps">
            <!-- These icons could be made functional too -->
        </div>
    </div>

    <div id="taskbar">
        <div style="width: 200px;"></div> <!-- Spacer -->
        <div id="taskbar-center">
            <div id="start-button" class="taskbar-icon"></div>
            <!-- More icons like search, widgets could go here -->
        </div>
        <div id="taskbar-right">
            <div id="clock"></div>
        </div>
    </div>

<script>
(function() {
    // --- STATE & CONFIG ---
    let highestZ = 1;
    const openWindows = {};

    // --- DOM ELEMENTS ---
    const desktop = document.getElementById('desktop');
    const taskbar = document.getElementById('taskbar');
    const startButton = document.getElementById('start-button');
    const startMenu = document.getElementById('start-menu');
    const clock = document.getElementById('clock');
    const windowContainer = document.getElementById('window-container');

    // --- UTILITY FUNCTIONS ---
    function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        const date = now.toLocaleDateString([], { month: 'numeric', day: 'numeric', year: 'numeric' });
        clock.innerHTML = `${time}<br>${date}`;
    }

    // --- WINDOW MANAGER ---
    function createWindow(appId, title, contentHTML, width = 600, height = 400) {
        // If window already exists, focus it and return
        if (openWindows[appId]) {
            focusWindow(openWindows[appId]);
            return;
        }

        const win = document.createElement('div');
        win.className = 'window active';
        win.style.width = `${width}px`;
        win.style.height = `${height}px`;
        win.style.top = `${(window.innerHeight - height) / 2 - 50 + (Object.keys(openWindows).length * 20)}px`;
        win.style.left = `${(window.innerWidth - width) / 2 + (Object.keys(openWindows).length * 20)}px`;
        win.dataset.appId = appId;

        const header = document.createElement('div');
        header.className = 'window-header';
        
        const titleSpan = document.createElement('span');
        titleSpan.textContent = title;

        const controls = document.createElement('div');
        controls.className = 'window-controls';

        // In a real OS, these would be min, max, close. 'r' is close in Marlett font.
        controls.innerHTML = `<div class="window-control close">r</div>`;

        header.appendChild(titleSpan);
        header.appendChild(controls);

        const content = document.createElement('div');
        content.className = 'window-content';
        content.innerHTML = contentHTML;

        win.appendChild(header);
        win.appendChild(content);

        windowContainer.appendChild(win);
        openWindows[appId] = win;

        focusWindow(win);
        makeDraggable(win, header);
        
        // Post-creation setup for specific apps
        const appInitializer = appInitializers[appId];
        if (appInitializer) {
            appInitializer(win);
        }

        // Event listeners for window controls
        win.querySelector('.close').addEventListener('click', (e) => {
            e.stopPropagation();
            closeWindow(win);
        });
        
        win.addEventListener('mousedown', () => focusWindow(win));
    }

    function focusWindow(win) {
        document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
        win.classList.add('active');
        win.style.zIndex = ++highestZ;
    }
    
    function closeWindow(win) {
        const appId = win.dataset.appId;
        win.remove();
        delete openWindows[appId];
    }

    function makeDraggable(element, handle) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        handle.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            element.style.top = (element.offsetTop - pos2) + "px";
            element.style.left = (element.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    // --- APP DEFINITIONS ---
    const appContent = {
        notepad: `<textarea class="notepad-textarea">Hello, Windows!</textarea>`,
        calculator: `
            <div class="calculator">
                <div class="calc-display" id="calc-display">0</div>
                <button class="calc-btn">C</button><button class="calc-btn">+/-</button><button class="calc-btn">%</button><button class="calc-btn operator">/</button>
                <button class="calc-btn">7</button><button class="calc-btn">8</button><button class="calc-btn">9</button><button class="calc-btn operator">*</button>
                <button class="calc-btn">4</button><button class="calc-btn">5</button><button class="calc-btn">6</button><button class="calc-btn operator">-</button>
                <button class="calc-btn">1</button><button class="calc-btn">2</button><button class="calc-btn">3</button><button class="calc-btn operator">+</button>
                <button class="calc-btn" style="grid-column: span 2;">0</button><button class="calc-btn">.</button><button class="calc-btn operator">=</button>
            </div>
        `,
        paint: `
            <div style="display: flex; flex-direction: column; height: 100%;">
                <div class="paint-toolbar">
                    <input type="color" id="paint-color" value="#000000">
                    <button id="paint-clear">Clear</button>
                </div>
                <canvas class="paint-canvas" style="flex-grow: 1;"></canvas>
            </div>
        `,
        chrome: `
            <div style="display: flex; flex-direction: column; height: 100%;">
                <div class="chrome-bar">
                    <input type="text" value="https://www.google.com/webhp?igu=1" id="chrome-url">
                </div>
                <iframe class="chrome-content" src="https://www.google.com/webhp?igu=1" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe>
            </div>
        `,
        explorer: `
            <div style="padding: 20px; font-family: 'Segoe UI', sans-serif;">
                <h3>File Explorer</h3>
                <p>Folders:</p>
                <ul>
                    <li>📁 Desktop</li>
                    <li>📁 Documents</li>
                    <li>📁 Downloads</li>
                    <li>📁 Pictures</li>
                </ul>
            </div>
        `,
        word: `
            <div style="padding: 20px; font-family: 'Times New Roman', serif;">
                <div contenteditable="true" style="width: 100%; height: 100%; min-height: 200px; border: 1px solid #eee; padding: 10px;">
                    <h2>A Mock Word Document</h2>
                    <p>You can type and edit text in this area.</p>
                </div>
            </div>
        `
    };

    const appTitles = {
        notepad: "Untitled - Notepad",
        calculator: "Calculator",
        paint: "Untitled - Paint",
        chrome: "New Tab - Chrome",
        explorer: "File Explorer",
        word: "Document1 - Word"
    };

    const appInitializers = {
        calculator: (win) => {
            const display = win.querySelector('#calc-display');
            let currentInput = '0';
            let operator = null;
            let previousInput = null;
            
            win.querySelectorAll('.calc-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const value = button.textContent;
                    
                    if (!isNaN(value) || value === '.') {
                        if (currentInput === '0' && value !== '.') {
                            currentInput = value;
                        } else if (!currentInput.includes('.') || value !== '.') {
                            currentInput += value;
                        }
                    } else if (value === 'C') {
                        currentInput = '0';
                        operator = null;
                        previousInput = null;
                    } else if (value === '=') {
                        if (operator && previousInput !== null) {
                            currentInput = String(eval(`${previousInput} ${operator} ${currentInput}`));
                            operator = null;
                            previousInput = null;
                        }
                    } else { // Operator
                        if (operator) { // chain operations
                             currentInput = String(eval(`${previousInput} ${operator} ${currentInput}`));
                        }
                        operator = value;
                        previousInput = currentInput;
                        currentInput = '0';
                    }
                    display.textContent = currentInput;
                });
            });
        },
        paint: (win) => {
            const canvas = win.querySelector('.paint-canvas');
            const ctx = canvas.getContext('2d');
            const colorPicker = win.querySelector('#paint-color');
            const clearBtn = win.querySelector('#paint-clear');

            // Resize canvas to fit content area
            const contentArea = win.querySelector('.window-content');
            function resizeCanvas() {
                canvas.width = contentArea.clientWidth;
                canvas.height = contentArea.clientHeight - win.querySelector('.paint-toolbar').offsetHeight;
            }
            resizeCanvas();
            
            let painting = false;

            function startPosition(e) { painting = true; draw(e); }
            function endPosition() { painting = false; ctx.beginPath(); }
            function draw(e) {
                if (!painting) return;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = colorPicker.value;
                
                const rect = canvas.getBoundingClientRect();
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            }

            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', draw);
            
            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
            
            // Re-adjust canvas on window resize
            new ResizeObserver(resizeCanvas).observe(contentArea);
        },
        chrome: (win) => {
            const urlInput = win.querySelector('#chrome-url');
            const iframe = win.querySelector('.chrome-content');
            
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    let url = urlInput.value;
                    if (!url.startsWith('http')) {
                        url = 'https://' + url;
                    }
                    iframe.src = url;
                }
            });
        }
    };

    // --- EVENT LISTENERS ---
    function initialize() {
        // Clock
        updateClock();
        setInterval(updateClock, 1000);

        // Start Menu
        startButton.addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('click', (e) => {
            if (!startMenu.contains(e.target) && !startButton.contains(e.target)) {
                startMenu.style.display = 'none';
            }
        });

        // Desktop Icons
        document.querySelectorAll('.desktop-icon').forEach(icon => {
            icon.addEventListener('dblclick', () => {
                const appId = icon.dataset.app;
                createWindow(appId, appTitles[appId], appContent[appId], ...getAppDimensions(appId));
            });
        });
    }
    
    function getAppDimensions(appId) {
        switch(appId) {
            case 'calculator': return [300, 450];
            case 'notepad': return [500, 400];
            case 'paint': return [700, 500];
            default: return [800, 600];
        }
    }

    // --- START ---
    initialize();

})();
</script>

</body>
