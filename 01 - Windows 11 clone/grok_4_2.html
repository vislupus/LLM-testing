<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: url('https://wallpaperaccess.com/full/6340570.jpg') center/cover no-repeat fixed;
            color: #fff;
            position: relative;
        }

        /* Desktop */
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 48px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            gap: 20px;
            align-content: flex-start;
        }

        .desktop-icon {
            width: 80px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 8px;
            border-radius: 8px;
        }

        .desktop-icon:hover {
            background: rgba(255,255,255,0.15);
        }

        .desktop-icon img {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .desktop-icon span {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        /* Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #taskbar-content {
            display: flex;
            align-items: center;
            height: 100%;
            max-width: 1200px;
            width: 100%;
        }

        .taskbar-start {
            width: 40px;
            height: 40px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Windows_11_logo.svg/512px-Windows_11_logo.svg.png') center/24px no-repeat;
            margin: 0 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .taskbar-start:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .taskbar-icon {
            width: 40px;
            height: 40px;
            margin: 0 2px;
            border-radius: 6px;
            background-size: 24px;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .taskbar-icon:hover {
            background-color: rgba(255,255,255,0.15);
        }

        .taskbar-icon.active {
            background-color: rgba(255,255,255,0.25);
        }

        #taskbar-apps {
            display: flex;
            gap: 4px;
        }

        #taskbar-system {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            font-size: 13px;
        }

        #clock {
            min-width: 60px;
            text-align: center;
        }

        /* Start Menu */
        #start-menu {
            position: fixed;
            bottom: 56px;
            left: 8px;
            width: 520px;
            height: 620px;
            background: rgba(32,32,32,0.95);
            backdrop-filter: blur(30px);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            display: none;
            flex-direction: column;
            z-index: 20000;
        }

        .start-header {
            padding: 12px 20px;
            background: rgba(255,255,255,0.05);
            font-size: 14px;
        }

        .start-pinned {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
        }

        .start-app {
            width: 64px;
            text-align: center;
            cursor: pointer;
        }

        .start-app img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
        }

        .start-app span {
            font-size: 11px;
            margin-top: 4px;
            display: block;
        }

        /* Window */
        .window {
            position: absolute;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            min-width: 300px;
            min-height: 200px;
            display: none;
            flex-direction: column;
            z-index: 1000;
            resize: both;
        }

        .window-header {
            height: 40px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            cursor: move;
            border-bottom: 1px solid #ddd;
        }

        .window-title {
            flex: 1;
            font-size: 14px;
            color: #333;
            padding-left: 8px;
            font-weight: 500;
        }

        .window-controls {
            display: flex;
            gap: 4px;
        }

        .window-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .window-btn:hover {
            background: rgba(0,0,0,0.1);
        }

        .close-btn:hover {
            background: #e81123 !important;
            color: white;
        }

        .window-content {
            flex: 1;
            background: #fff;
            overflow: auto;
            padding: 0;
        }

        /* Specific Apps */
        .notepad-content {
            width: 100%;
            height: 100%;
            padding: 10px;
        }

        textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            font-family: Consolas, monospace;
            font-size: 15px;
            resize: none;
        }

        .calc-display {
            background: #000;
            color: #0f0;
            font-size: 32px;
            padding: 20px;
            text-align: right;
            font-family: 'Segoe UI', sans-serif;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            background: #222;
        }

        .calc-btn {
            padding: 20px;
            font-size: 18px;
            background: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .calc-btn.operator {
            background: #f90;
        }

        .calc-btn.equals {
            background: #0b0;
        }

        .calc-btn:hover {
            opacity: 0.9;
        }

        canvas {
            display: block;
            background: #fff;
            touch-action: none;
        }

        .paint-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
        }

        .word-toolbar {
            background: #f0f0f0;
            padding: 8px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #ddd;
        }

        .word-toolbar button {
            padding: 6px 12px;
            font-size: 14px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .word-editor {
            width: 100%;
            height: calc(100% - 50px);
            padding: 40px;
            font-family: Calibri, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            outline: none;
        }

        .explorer-content {
            display: flex;
            height: 100%;
        }

        .explorer-sidebar {
            width: 220px;
            background: #f8f8f8;
            padding: 12px;
            border-right: 1px solid #ddd;
        }

        .explorer-main {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 20px;
        }

        .explorer-item {
            text-align: center;
            cursor: pointer;
        }

        .explorer-item img {
            width: 64px;
            height: 64px;
        }

        /* Context Menu */
        #context-menu {
            position: absolute;
            background: rgba(40,40,40,0.95);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            padding: 6px 0;
            display: none;
            z-index: 30000;
            min-width: 180px;
            font-size: 14px;
        }

        .context-item {
            padding: 8px 20px;
            color: #fff;
            cursor: pointer;
        }

        .context-item:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <!-- Desktop -->
    <div id="desktop">
        <!-- Icons -->
        <div class="desktop-icon" onclick="openApp('explorer')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968817.png" alt="File Explorer">
            <span>File Explorer</span>
        </div>
        <div class="desktop-icon" onclick="openApp('word')">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732221.png" alt="Word">
            <span>Word</span>
        </div>
        <div class="desktop-icon" onclick="openApp('paint')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968958.png" alt="Paint">
            <span>Paint</span>
        </div>
        <div class="desktop-icon" onclick="openApp('calc')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968974.png" alt="Calculator">
            <span>Calculator</span>
        </div>
        <div class="desktop-icon" onclick="openApp('notepad')">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968983.png" alt="Notepad">
            <span>Notepad</span>
        </div>
        <div class="desktop-icon" onclick="openApp('chrome')">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Chrome">
            <span>Google Chrome</span>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div id="taskbar-content">
            <div class="taskbar-start" onclick="toggleStartMenu()"></div>
            
            <div id="taskbar-apps">
                <!-- Pinned icons added via JS -->
            </div>

            <div id="taskbar-system">
                <span>↑</span>
                <span>🌐</span>
                <span>🔊</span>
                <span id="clock"></span>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="start-header">Pinned</div>
        <div class="start-pinned">
            <div class="start-app" onclick="openApp('explorer');toggleStartMenu()">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968817.png">
                <span>Explorer</span>
            </div>
            <div class="start-app" onclick="openApp('word');toggleStartMenu()">
                <img src="https://cdn-icons-png.flaticon.com/512/732/732221.png">
                <span>Word</span>
            </div>
            <div class="start-app" onclick="openApp('paint');toggleStartMenu()">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968958.png">
                <span>Paint</span>
            </div>
            <div class="start-app" onclick="openApp('calc');toggleStartMenu()">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968974.png">
                <span>Calculator</span>
            </div>
            <div class="start-app" onclick="openApp('notepad');toggleStartMenu()">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968983.png">
                <span>Notepad</span>
            </div>
            <div class="start-app" onclick="openApp('chrome');toggleStartMenu()">
                <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
                <span>Chrome</span>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu">
        <div class="context-item" onclick="hideContext()">View</div>
        <div class="context-item" onclick="hideContext()">Sort by</div>
        <div class="context-item" onclick="hideContext()">Refresh</div>
        <div class="context-item" onclick="hideContext()">New → Folder</div>
        <div class="context-item" onclick="hideContext()">Display settings</div>
    </div>

    <script>
        // Global variables
        let zIndexCounter = 100;
        let windows = [];
        let isStartOpen = false;

        // Update clock
        function updateClock() {
            const clock = document.getElementById('clock');
            setInterval(() => {
                const now = new Date();
                clock.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }, 1000);
        }

        // Create window
        function createWindow(title, iconUrl, contentHTML, width = '800px', height = '560px') {
            const win = document.createElement('div');
            win.className = 'window';
            win.style.width = width;
            win.style.height = height;
            win.style.left = (100 + windows.length * 30) + 'px';
            win.style.top = (60 + windows.length * 30) + 'px';
            win.style.display = 'flex';
            win.style.zIndex = zIndexCounter++;

            win.innerHTML = `
                <div class="window-header" onmousedown="startDrag(event, this.parentElement)">
                    <img src="${iconUrl}" width="20" height="20" style="margin-right:8px">
                    <div class="window-title">${title}</div>
                    <div class="window-controls">
                        <div class="window-btn" onclick="minimizeWindow(this)">−</div>
                        <div class="window-btn" onclick="maximizeWindow(this)">□</div>
                        <div class="window-btn close-btn" onclick="closeWindow(this)">✕</div>
                    </div>
                </div>
                <div class="window-content">
                    ${contentHTML}
                </div>
            `;

            document.body.appendChild(win);
            windows.push(win);

            // Bring to front on click
            win.addEventListener('mousedown', () => {
                win.style.zIndex = zIndexCounter++;
            });

            return win;
        }

        // Drag functionality
        let draggedWindow = null;
        let dragOffsetX = 0, dragOffsetY = 0;

        function startDrag(e, win) {
            if (e.target.classList.contains('window-btn')) return;
            draggedWindow = win;
            const rect = win.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            win.style.zIndex = zIndexCounter++;
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function onMouseMove(e) {
            if (!draggedWindow) return;
            draggedWindow.style.left = (e.clientX - dragOffsetX) + 'px';
            draggedWindow.style.top = (e.clientY - dragOffsetY) + 'px';
        }

        function onMouseUp() {
            draggedWindow = null;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }

        function closeWindow(btn) {
            const win = btn.closest('.window');
            win.remove();
            windows = windows.filter(w => w !== win);
        }

        function minimizeWindow(btn) {
            const win = btn.closest('.window');
            win.style.display = 'none';
        }

        function maximizeWindow(btn) {
            const win = btn.closest('.window');
            if (win.style.width === '100vw') {
                win.style.width = win.dataset.prevWidth || '800px';
                win.style.height = win.dataset.prevHeight || '560px';
                win.style.left = win.dataset.prevLeft || '100px';
                win.style.top = win.dataset.prevTop || '60px';
            } else {
                win.dataset.prevWidth = win.style.width;
                win.dataset.prevHeight = win.style.height;
                win.dataset.prevLeft = win.style.left;
                win.dataset.prevTop = win.style.top;
                win.style.width = '100vw';
                win.style.height = 'calc(100vh - 48px)';
                win.style.left = '0';
                win.style.top = '0';
                win.style.borderRadius = '0';
            }
        }

        // Open apps
        function openApp(app) {
            let title, icon, width, height, content;

            switch(app) {
                case 'explorer':
                    title = 'This PC';
                    icon = 'https://cdn-icons-png.flaticon.com/512/5968/5968817.png';
                    width = '900px';
                    height = '620px';
                    content = `
                        <div class="explorer-content">
                            <div class="explorer-sidebar">
                                <div style="margin-bottom:12px;font-weight:600;color:#0078d4">Quick access</div>
                                <div style="padding:4px 8px;color:#666">Desktop</div>
                                <div style="padding:4px 8px;color:#666">Downloads</div>
                                <div style="padding:4px 8px;color:#666">Documents</div>
                                <div style="padding:4px 8px;color:#666">Pictures</div>
                            </div>
                            <div class="explorer-main">
                                <div class="explorer-item" onclick="alert('Opened Desktop')">
                                    <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png">
                                    <div>Desktop</div>
                                </div>
                                <div class="explorer-item" onclick="alert('Opened Documents')">
                                    <img src="https://cdn-icons-png.flaticon.com/512/716/716783.png">
                                    <div>Documents</div>
                                </div>
                                <div class="explorer-item" onclick="alert('Opened Pictures')">
                                    <img src="https://cdn-icons-png.flaticon.com/512/716/716782.png">
                                    <div>Pictures</div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'word':
                    title = 'Document1.docx - Word';
                    icon = 'https://cdn-icons-png.flaticon.com/512/732/732221.png';
                    width = '820px';
                    height = '620px';
                    content = `
                        <div class="word-toolbar">
                            <button onclick="execCmd('bold')">B</button>
                            <button onclick="execCmd('italic')">I</button>
                            <button onclick="execCmd('underline')">U</button>
                            <button onclick="execCmd('justifyLeft')">Left</button>
                            <button onclick="execCmd('justifyCenter')">Center</button>
                            <button onclick="execCmd('justifyRight')">Right</button>
                        </div>
                        <div contenteditable="true" class="word-editor" style="background:#fff;color:#000">Welcome to Microsoft Word clone!<br><br>Type anything here...</div>
                    `;
                    break;

                case 'paint':
                    title = 'Untitled - Paint';
                    icon = 'https://cdn-icons-png.flaticon.com/512/5968/5968958.png';
                    width = '920px';
                    height = '640px';
                    content = `
                        <div class="paint-tools">
                            <input type="color" id="colorPicker" value="#000000" style="width:40px;height:32px;padding:0;border:none;cursor:pointer">
                            <input type="range" id="brushSize" min="1" max="50" value="5" style="width:120px">
                            <button onclick="clearCanvas()">Clear</button>
                            <button onclick="undoCanvas()">Undo</button>
                        </div>
                        <canvas id="paintCanvas" width="880" height="520" style="margin:10px;border:1px solid #ddd"></canvas>
                    `;
                    break;

                case 'calc':
                    title = 'Calculator';
                    icon = 'https://cdn-icons-png.flaticon.com/512/5968/5968974.png';
                    width = '320px';
                    height = '460px';
                    content = `
                        <div class="calc-display" id="calcDisplay">0</div>
                        <div class="calc-buttons">
                            <button class="calc-btn" onclick="calcInput('C')">C</button>
                            <button class="calc-btn" onclick="calcInput('±')">±</button>
                            <button class="calc-btn" onclick="calcInput('%')">%</button>
                            <button class="calc-btn operator" onclick="calcInput('/')">÷</button>
                            
                            <button class="calc-btn" onclick="calcInput('7')">7</button>
                            <button class="calc-btn" onclick="calcInput('8')">8</button>
                            <button class="calc-btn" onclick="calcInput('9')">9</button>
                            <button class="calc-btn operator" onclick="calcInput('*')">×</button>
                            
                            <button class="calc-btn" onclick="calcInput('4')">4</button>
                            <button class="calc-btn" onclick="calcInput('5')">5</button>
                            <button class="calc-btn" onclick="calcInput('6')">6</button>
                            <button class="calc-btn operator" onclick="calcInput('-')">−</button>
                            
                            <button class="calc-btn" onclick="calcInput('1')">1</button>
                            <button class="calc-btn" onclick="calcInput('2')">2</button>
                            <button class="calc-btn" onclick="calcInput('3')">3</button>
                            <button class="calc-btn operator" onclick="calcInput('+')">+</button>
                            
                            <button class="calc-btn" style="grid-column:span 2" onclick="calcInput('0')">0</button>
                            <button class="calc-btn" onclick="calcInput('.')">.</button>
                            <button class="calc-btn equals" onclick="calcEquals()">=</button>
                        </div>
                    `;
                    break;

                case 'notepad':
                    title = 'Untitled - Notepad';
                    icon = 'https://cdn-icons-png.flaticon.com/512/5968/5968983.png';
                    width = '720px';
                    height = '520px';
                    content = `
                        <div class="notepad-content">
                            <textarea spellcheck="false">Welcome to Notepad!\n\nThis is a fully functional clone.\n\nYou can type, copy, paste, etc.</textarea>
                        </div>
                    `;
                    break;

                case 'chrome':
                    title = 'New Tab - Google Chrome';
                    icon = 'https://cdn-icons-png.flaticon.com/512/732/732200.png';
                    width = '960px';
                    height = '680px';
                    content = `
                        <div style="height:100%;display:flex;flex-direction:column;background:#f1f1f1">
                            <div style="background:#fff;padding:6px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd">
                                <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="alert('Back')">←</button>
                                <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="alert('Forward')">→</button>
                                <button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="reloadChrome(this)">⟳</button>
                                <input id="chromeAddress" type="text" value="https://www.google.com" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:20px;font-size:14px" onkeypress="if(event.key==='Enter') loadChromePage()">
                            </div>
                            <div style="flex:1;padding:40px;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column">
                                <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" width="120">
                                <h2 style="margin:30px 0 10px;color:#202124">Google</h2>
                                <input type="text" placeholder="Search Google or type a URL" style="width:520px;padding:14px 20px;border:1px solid #dfe1e5;border-radius:50px;font-size:17px" onkeypress="if(event.key==='Enter') searchGoogle(this)">
                                <div style="margin-top:40px;color:#8ab4f8;font-size:13px">Google offered in: English</div>
                            </div>
                        </div>
                    `;
                    break;
            }

            const win = createWindow(title, icon, content, width, height);

            // Initialize specific apps
            if (app === 'paint') {
                setTimeout(() => initPaint(win), 100);
            }
            if (app === 'calc') {
                setTimeout(() => initCalc(win), 100);
            }
            if (app === 'chrome') {
                // Chrome is ready
            }
        }

        // Paint app
        let paintCanvas, ctx, isDrawing = false, lastX = 0, lastY = 0, undoStack = [];

        function initPaint(win) {
            paintCanvas = win.querySelector('#paintCanvas');
            ctx = paintCanvas.getContext('2d');
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';

            paintCanvas.addEventListener('mousedown', startDraw);
            paintCanvas.addEventListener('mousemove', draw);
            paintCanvas.addEventListener('mouseup', stopDraw);
            paintCanvas.addEventListener('mouseout', stopDraw);

            // Color picker
            const colorPicker = win.querySelector('#colorPicker');
            colorPicker.addEventListener('input', () => {
                ctx.strokeStyle = colorPicker.value;
            });

            // Brush size
            const brushSlider = win.querySelector('#brushSize');
            brushSlider.addEventListener('input', () => {
                ctx.lineWidth = brushSlider.value;
            });
        }

        function startDraw(e) {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
            undoStack.push(ctx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
        }

        function draw(e) {
            if (!isDrawing) return;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            [lastX, lastY] = [e.offsetX, e.offsetY];
        }

        function stopDraw() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
        }

        function undoCanvas() {
            if (undoStack.length > 0) {
                ctx.putImageData(undoStack.pop(), 0, 0);
            }
        }

        // Calculator
        let calcExpr = '';

        function initCalc(win) {
            // already handled in HTML
        }

        function calcInput(val) {
            const display = document.querySelectorAll('.calc-display')[document.querySelectorAll('.calc-display').length - 1];
            if (val === 'C') {
                calcExpr = '';
                display.textContent = '0';
            } else if (val === '±') {
                display.textContent = -parseFloat(display.textContent);
            } else {
                if (display.textContent === '0' && val !== '.') calcExpr = '';
                calcExpr += val;
                display.textContent = calcExpr || '0';
            }
        }

        function calcEquals() {
            const display = document.querySelectorAll('.calc-display')[document.querySelectorAll('.calc-display').length - 1];
            try {
                calcExpr = eval(calcExpr.replace('×','*').replace('÷','/').replace('−','-'));
                display.textContent = calcExpr;
            } catch(e) {
                display.textContent = 'Error';
                calcExpr = '';
            }
        }

        // Word execCommand
        function execCmd(cmd) {
            document.execCommand(cmd, false, null);
        }

        // Chrome helpers
        function loadChromePage() {
            alert("In a real browser this would load the page.\n\nDemo: You are already on Google!");
        }

        function reloadChrome(btn) {
            alert("Page refreshed (demo)");
        }

        function searchGoogle(input) {
            if (input.value.trim()) {
                alert(`Searching Google for: "${input.value}"\n\n(Full browser simulation would open results)`);
            }
        }

        // Start menu
        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            isStartOpen = !isStartOpen;
            menu.style.display = isStartOpen ? 'flex' : 'none';
        }

        // Context menu
        function showContext(e) {
            e.preventDefault();
            const menu = document.getElementById('context-menu');
            menu.style.display = 'block';
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
        }

        function hideContext() {
            document.getElementById('context-menu').style.display = 'none';
        }

        // Pinned taskbar icons
        function createTaskbarPinned() {
            const appsContainer = document.getElementById('taskbar-apps');
            const pinned = [
                {name:'explorer', icon:'https://cdn-icons-png.flaticon.com/512/5968/5968817.png', app:'explorer'},
                {name:'word', icon:'https://cdn-icons-png.flaticon.com/512/732/732221.png', app:'word'},
                {name:'chrome', icon:'https://cdn-icons-png.flaticon.com/512/732/732200.png', app:'chrome'}
            ];

            pinned.forEach(p => {
                const el = document.createElement('div');
                el.className = 'taskbar-icon';
                el.style.backgroundImage = `url('${p.icon}')`;
                el.title = p.name;
                el.onclick = () => openApp(p.app);
                appsContainer.appendChild(el);
            });
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                const menu = document.getElementById('start-menu');
                if (menu.style.display === 'flex') toggleStartMenu();
            }
        });

        // Init everything
        function init() {
            updateClock();
            createTaskbarPinned();

            // Desktop right click
            document.getElementById('desktop').addEventListener('contextmenu', showContext);
            document.addEventListener('click', hideContext);

            // Welcome message
            setTimeout(() => {
                alert("Welcome to Windows 11 Desktop Clone!\n\nAll apps are fully functional:\n• Paint (draw!)\n• Calculator\n• Notepad\n• Word (rich text)\n• File Explorer (demo)\n• Chrome (search simulation)\n\nDrag windows by title bar.\nEnjoy!");
            }, 800);
        }

        window.onload = init;
    </script>
</body>
</html>
