<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; }

  /* Desktop Wallpaper */
  #desktop {
    width: 100vw; height: 100vh;
    background: linear-gradient(135deg, #1a1a4e 0%, #1b2a6e 15%, #2e4a8a 30%, #3b6cb5 45%, #4a8fd4 55%, #6ba3e0 65%, #89b8ea 72%, #a8cce4 78%, #c5dde8 82%, #1b2a6e 85%, #1a1a4e 100%);
    background-size: cover;
    position: relative;
  }
  #desktop::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 800px 600px at 55% 50%, rgba(100,160,230,0.5) 0%, transparent 70%),
      radial-gradient(ellipse 600px 500px at 45% 45%, rgba(60,120,200,0.4) 0%, transparent 60%),
      radial-gradient(ellipse 900px 700px at 50% 55%, rgba(80,140,210,0.3) 0%, transparent 65%),
      radial-gradient(ellipse 400px 350px at 52% 48%, rgba(120,180,240,0.5) 0%, transparent 50%),
      radial-gradient(ellipse 300px 250px at 48% 52%, rgba(140,200,255,0.4) 0%, transparent 45%),
      radial-gradient(ellipse 1200px 900px at 50% 50%, rgba(30,60,120,0.3) 0%, transparent 70%);
  }

  /* Desktop Icons */
  #desktop-icons {
    position: absolute;
    top: 12px; left: 12px;
    display: flex; flex-direction: column;
    gap: 8px; z-index: 1;
  }
  .desktop-icon {
    width: 80px; padding: 8px 4px;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    border-radius: 6px; cursor: pointer;
    transition: background 0.15s;
  }
  .desktop-icon:hover { background: rgba(255,255,255,0.12); }
  .desktop-icon:active { background: rgba(255,255,255,0.18); }
  .desktop-icon img, .desktop-icon .icon-img {
    width: 44px; height: 44px;
    image-rendering: auto;
  }
  .desktop-icon span {
    color: #fff; font-size: 11px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    text-align: center; line-height: 1.2;
    word-wrap: break-word; max-width: 76px;
  }

  /* Taskbar */
  #taskbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 48px;
    background: rgba(32, 32, 32, 0.85);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    display: flex; align-items: center;
    justify-content: center; gap: 2px;
    z-index: 9999;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .taskbar-btn {
    width: 44px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .taskbar-btn:hover { background: rgba(255,255,255,0.1); }
  .taskbar-btn:active { background: rgba(255,255,255,0.06); }
  .taskbar-btn img, .taskbar-btn .tb-icon {
    width: 24px; height: 24px;
  }
  .taskbar-btn.active::after {
    content: '';
    position: absolute; bottom: 2px;
    width: 16px; height: 3px;
    background: #60cdff; border-radius: 2px;
  }
  .taskbar-btn.has-window::after {
    content: '';
    position: absolute; bottom: 2px;
    width: 6px; height: 3px;
    background: rgba(255,255,255,0.5); border-radius: 2px;
  }
  .taskbar-btn.active.has-window::after {
    width: 16px; background: #60cdff;
  }

  /* System Tray */
  #system-tray {
    position: absolute; right: 12px;
    display: flex; align-items: center; gap: 4px;
    color: #fff; font-size: 12px;
  }
  #clock { text-align: right; line-height: 1.3; }
  #clock .time { font-size: 12px; }
  #clock .date { font-size: 11px; opacity: 0.9; }

  /* Start Button */
  #start-btn {
    position: absolute; left: 12px;
  }

  /* Start Menu */
  #start-menu {
    position: absolute;
    bottom: 60px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: rgba(44, 44, 44, 0.92);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    z-index: 10000;
    display: none;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    padding: 24px;
  }
  #start-menu.show { display: flex; }
  #start-menu .search-bar {
    width: 100%; padding: 8px 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px; color: #fff;
    font-size: 14px; outline: none;
    margin-bottom: 20px;
  }
  #start-menu .search-bar::placeholder { color: rgba(255,255,255,0.5); }
  #start-menu h3 { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .start-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }
  .start-grid-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 12px 8px; border-radius: 6px;
    cursor: pointer; transition: background 0.15s;
  }
  .start-grid-item:hover { background: rgba(255,255,255,0.08); }
  .start-grid-item img, .start-grid-item .tb-icon { width: 32px; height: 32px; }
  .start-grid-item span { color: #fff; font-size: 11px; text-align: center; }

  /* Windows */
  .app-window {
    position: absolute;
    background: rgba(32, 32, 32, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    overflow: hidden;
    min-width: 400px; min-height: 300px;
    z-index: 100;
  }
  .app-window.focused { z-index: 1000; box-shadow: 0 8px 40px rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.15); }
  .app-window.maximized {
    top: 0 !important; left: 0 !important;
    width: 100vw !important; height: calc(100vh - 48px) !important;
    border-radius: 0; border: none;
  }

  /* Title Bar */
  .title-bar {
    height: 32px; display: flex;
    align-items: center;
    padding: 0 4px 0 12px;
    background: rgba(32, 32, 32, 0.98);
    flex-shrink: 0;
  }
  .title-bar .title-icon { width: 16px; height: 16px; margin-right: 8px; }
  .title-bar .title-text {
    color: #fff; font-size: 12px;
    flex: 1; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .title-bar-controls { display: flex; height: 100%; }
  .title-bar-controls button {
    width: 46px; height: 32px;
    background: transparent; border: none;
    color: #fff; font-size: 10px;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: background 0.1s;
  }
  .title-bar-controls button:hover { background: rgba(255,255,255,0.1); }
  .title-bar-controls .close-btn:hover { background: #c42b1c; }

  .window-body { flex: 1; overflow: auto; background: rgba(30,30,30,0.98); }

  /* Resize handles */
  .resize-handle {
    position: absolute;
  }
  .resize-n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: n-resize; }
  .resize-s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: s-resize; }
  .resize-e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: e-resize; }
  .resize-w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: w-resize; }
  .resize-ne { top: -3px; right: -3px; width: 12px; height: 12px; cursor: ne-resize; }
  .resize-nw { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nw-resize; }
  .resize-se { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: se-resize; }
  .resize-sw { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: sw-resize; }

  /* ===== CALCULATOR ===== */
  .calc-body { padding: 8px; display: flex; flex-direction: column; height: 100%; }
  .calc-display {
    background: transparent; color: #fff;
    text-align: right; padding: 8px 12px;
    font-size: 14px; min-height: 28px;
    opacity: 0.7;
  }
  .calc-expression {
    background: transparent; color: #fff;
    text-align: right; padding: 4px 12px 12px;
    font-size: 36px; font-weight: 300;
    min-height: 50px; overflow: hidden;
  }
  .calc-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px; flex: 1;
  }
  .calc-btn {
    background: rgba(59,59,59,0.9);
    border: none; color: #fff;
    font-size: 16px; border-radius: 4px;
    cursor: pointer; transition: background 0.1s;
    font-family: inherit;
  }
  .calc-btn:hover { background: rgba(75,75,75,0.9); }
  .calc-btn:active { background: rgba(50,50,50,0.9); }
  .calc-btn.operator { background: rgba(50,50,50,0.9); }
  .calc-btn.operator:hover { background: rgba(65,65,65,0.9); }
  .calc-btn.equals { background: #60cdff; color: #000; }
  .calc-btn.equals:hover { background: #4db8e8; }
  .calc-btn.top-row { background: rgba(45,45,45,0.9); }

  /* ===== NOTEPAD ===== */
  .notepad-body { display: flex; flex-direction: column; height: 100%; }
  .notepad-menu {
    display: flex; gap: 0;
    background: rgba(44,44,44,0.98);
    padding: 2px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .notepad-menu span {
    color: #ccc; font-size: 12px;
    padding: 4px 10px; border-radius: 4px;
    cursor: pointer;
  }
  .notepad-menu span:hover { background: rgba(255,255,255,0.08); }
  .notepad-textarea {
    flex: 1; background: rgba(30,30,30,0.98);
    border: none; color: #fff;
    padding: 8px 12px; font-size: 14px;
    font-family: 'Consolas', 'Courier New', monospace;
    resize: none; outline: none;
    line-height: 1.5;
  }
  .notepad-status {
    background: rgba(44,44,44,0.98);
    padding: 2px 12px; font-size: 11px;
    color: #999; display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  /* ===== WORD ===== */
  .word-body { display: flex; flex-direction: column; height: 100%; }
  .word-ribbon {
    background: #1b5eb5;
    padding: 4px 8px;
    display: flex; align-items: center;
    gap: 4px; flex-wrap: wrap;
  }
  .word-ribbon select, .word-ribbon button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 3px 8px;
    border-radius: 3px; font-size: 12px;
    cursor: pointer;
  }
  .word-ribbon button { min-width: 28px; }
  .word-ribbon button:hover { background: rgba(255,255,255,0.25); }
  .word-ribbon select:hover { background: rgba(255,255,255,0.25); }
  .word-ribbon select option { background: #333; }
  .word-ribbon .separator { width: 1px; height: 24px; background: rgba(255,255,255,0.2); margin: 0 4px; }
  .word-ribbon input[type="color"] {
    width: 28px; height: 26px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 3px; cursor: pointer;
    background: transparent; padding: 1px;
  }
  .word-editor {
    flex: 1; overflow: auto;
    background: #1e1e1e;
    padding: 20px;
    display: flex; justify-content: center;
  }
  .word-page {
    width: 700px; min-height: 900px;
    background: #fff; color: #000;
    padding: 72px 72px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    font-size: 14px; line-height: 1.6;
    outline: none;
    font-family: 'Calibri', 'Segoe UI', sans-serif;
  }
  .word-status {
    background: #1b5eb5;
    padding: 2px 12px; font-size: 11px;
    color: rgba(255,255,255,0.8);
    display: flex; justify-content: space-between;
  }

  /* ===== PAINT ===== */
  .paint-body { display: flex; flex-direction: column; height: 100%; }
  .paint-toolbar {
    background: rgba(44,44,44,0.98);
    padding: 6px 8px;
    display: flex; align-items: center;
    gap: 6px; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .paint-tool {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px; cursor: pointer;
    color: #fff; font-size: 14px;
    transition: background 0.1s;
  }
  .paint-tool:hover { background: rgba(255,255,255,0.15); }
  .paint-tool.active { background: rgba(96,205,255,0.3); border-color: #60cdff; }
  .paint-colors {
    display: flex; gap: 2px; align-items: center;
  }
  .paint-color {
    width: 20px; height: 20px;
    border-radius: 3px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .paint-color:hover { border-color: #fff; }
  .paint-color.active { border: 2px solid #60cdff; }
  .paint-size {
    width: 60px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px; color: #fff;
    padding: 2px 6px; font-size: 12px;
  }
  .paint-canvas-container {
    flex: 1; overflow: auto;
    background: #2d2d2d;
    display: flex; align-items: flex-start;
    justify-content: flex-start;
    padding: 10px;
  }
  .paint-canvas {
    background: #fff; cursor: crosshair;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ===== FILE EXPLORER ===== */
  .explorer-body { display: flex; flex-direction: column; height: 100%; }
  .explorer-toolbar {
    background: rgba(44,44,44,0.98);
    padding: 6px 12px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .explorer-nav-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none;
    color: #fff; border-radius: 4px;
    cursor: pointer; font-size: 14px;
  }
  .explorer-nav-btn:hover { background: rgba(255,255,255,0.1); }
  .explorer-path {
    flex: 1; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px; padding: 4px 10px;
    color: #fff; font-size: 13px;
  }
  .explorer-search {
    width: 200px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px; padding: 4px 10px;
    color: #fff; font-size: 12px; outline: none;
  }
  .explorer-content { display: flex; flex: 1; overflow: hidden; }
  .explorer-sidebar {
    width: 200px; background: rgba(35,35,35,0.98);
    border-right: 1px solid rgba(255,255,255,0.08);
    padding: 8px 0; overflow-y: auto;
  }
  .explorer-sidebar-item {
    padding: 6px 16px; color: #ccc;
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .explorer-sidebar-item:hover { background: rgba(255,255,255,0.06); }
  .explorer-sidebar-item.active { background: rgba(255,255,255,0.1); color: #fff; }
  .explorer-sidebar-icon { width: 16px; height: 16px; opacity: 0.8; }
  .explorer-files {
    flex: 1; padding: 8px;
    display: flex; flex-wrap: wrap;
    align-content: flex-start; gap: 4px;
    overflow-y: auto;
  }
  .explorer-file {
    width: 90px; padding: 8px 4px;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    border-radius: 4px; cursor: pointer;
  }
  .explorer-file:hover { background: rgba(255,255,255,0.06); }
  .explorer-file-icon { width: 40px; height: 40px; }
  .explorer-file-name {
    color: #ccc; font-size: 11px;
    text-align: center; word-wrap: break-word;
    max-width: 86px;
  }
  .explorer-status {
    background: rgba(44,44,44,0.98);
    padding: 2px 12px; font-size: 11px;
    color: #999;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  /* ===== CHROME ===== */
  .chrome-body { display: flex; flex-direction: column; height: 100%; }
  .chrome-tab-bar {
    background: rgba(35,35,35,0.98);
    padding: 8px 8px 0;
    display: flex; align-items: flex-end; gap: 2px;
  }
  .chrome-tab {
    padding: 6px 16px;
    background: rgba(60,60,60,0.9);
    color: #ccc; font-size: 12px;
    border-radius: 8px 8px 0 0;
    cursor: pointer; max-width: 200px;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    display: flex; align-items: center; gap: 8px;
  }
  .chrome-tab.active { background: rgba(44,44,44,0.98); color: #fff; }
  .chrome-tab-close { font-size: 10px; opacity: 0.6; cursor: pointer; }
  .chrome-tab-close:hover { opacity: 1; }
  .chrome-nav {
    background: rgba(44,44,44,0.98);
    padding: 6px 8px;
    display: flex; align-items: center; gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .chrome-nav-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none;
    color: #aaa; border-radius: 50%;
    cursor: pointer; font-size: 14px;
  }
  .chrome-nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .chrome-url {
    flex: 1; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 6px 14px;
    color: #fff; font-size: 13px; outline: none;
  }
  .chrome-url:focus { border-color: #60cdff; background: rgba(255,255,255,0.12); }
  .chrome-content { flex: 1; background: #fff; overflow: auto; }
  .chrome-content iframe { width: 100%; height: 100%; border: none; }
  .chrome-newtab {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; background: #202124;
    color: #fff;
  }
  .chrome-newtab h2 { font-weight: 300; font-size: 28px; margin-bottom: 20px; }
  .chrome-newtab-search {
    width: 500px; max-width: 90%;
    padding: 12px 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px; color: #fff;
    font-size: 15px; outline: none;
  }
  .chrome-newtab-search:focus { background: rgba(255,255,255,0.12); }

  /* Context Menu */
  #context-menu {
    position: absolute;
    background: rgba(44,44,44,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 4px;
    min-width: 200px;
    z-index: 99999;
    display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .ctx-item {
    padding: 6px 12px; color: #ccc;
    font-size: 13px; border-radius: 4px;
    cursor: pointer; display: flex;
    align-items: center; gap: 10px;
  }
  .ctx-item:hover { background: rgba(255,255,255,0.08); }
  .ctx-separator { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 8px; }

  /* Animations */
  .app-window { animation: windowOpen 0.2s ease-out; }
  @keyframes windowOpen {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  #start-menu { animation: startMenuOpen 0.2s ease-out; }
  @keyframes startMenuOpen {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>

<div id="desktop">
  <!-- Desktop Icons -->
  <div id="desktop-icons">
    <div class="desktop-icon" ondblclick="openApp('word')">
      <svg class="icon-img" viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="6" fill="#185ABD"/><text x="24" y="34" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Segoe UI">W</text></svg>
      <span>Word</span>
    </div>
    <div class="desktop-icon" ondblclick="openApp('paint')">
      <svg class="icon-img" viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="6" fill="#E8E8E8"/><circle cx="18" cy="20" r="4" fill="#E74C3C"/><circle cx="28" cy="16" r="4" fill="#2ECC71"/><circle cx="32" cy="26" r="4" fill="#3498DB"/><circle cx="20" cy="32" r="4" fill="#F39C12"/><rect x="14" y="30" width="20" height="12" rx="2" fill="#BDC3C7"/><path d="M24 30 L24 38" stroke="#333" stroke-width="2"/></svg>
      <span>Paint</span>
    </div>
    <div class="desktop-icon" ondblclick="openApp('calculator')">

<script>
  // ===== CLOCK =====
  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const date = now.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' });
    document.querySelector('#clock .time').textContent = time;
    document.querySelector('#clock .date').textContent = date;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== WINDOW MANAGEMENT =====
  let windowZIndex = 100;
  let activeWindows = {};
  let dragState = null;
  let resizeState = null;

  function createWindow(appId, title, icon, width, height, content) {
    if (activeWindows[appId]) {
      const win = activeWindows[appId];
      if (win.dataset.minimized === 'true') {
        win.style.display = 'flex';
        win.dataset.minimized = 'false';
      }
      focusWindow(win);
      return win;
    }

    const win = document.createElement('div');
    win.className = 'app-window focused';
    win.dataset.appId = appId;
    win.style.width = width + 'px';
    win.style.height = height + 'px';
    win.style.left = (80 + Object.keys(activeWindows).length * 30) + 'px';
    win.style.top = (40 + Object.keys(activeWindows).length * 30) + 'px';
    win.style.zIndex = ++windowZIndex;

    win.innerHTML = `
      <div class="title-bar" onmousedown="startDrag(event, this.parentElement)">
        <svg class="title-icon" viewBox="0 0 48 48">${icon}</svg>
        <span class="title-text">${title}</span>
        <div class="title-bar-controls">
          <button class="min-btn" onclick="minimizeWindow(this.closest('.app-window'))">─</button>
          <button class="max-btn" onclick="maximizeWindow(this.closest('.app-window'))">□</button>
          <button class="close-btn" onclick="closeWindow(this.closest('.app-window'))">✕</button>
        </div>
      </div>
      <div class="window-body">${content}</div>
      <div class="resize-handle resize-n" onmousedown="startResize(event, this.parentElement, 'n')"></div>
      <div class="resize-handle resize-s" onmousedown="startResize(event, this.parentElement, 's')"></div>
      <div class="resize-handle resize-e" onmousedown="startResize(event, this.parentElement, 'e')"></div>
      <div class="resize-handle resize-w" onmousedown="startResize(event, this.parentElement, 'w')"></div>
      <div class="resize-handle resize-ne" onmousedown="startResize(event, this.parentElement, 'ne')"></div>
      <div class="resize-handle resize-nw" onmousedown="startResize(event, this.parentElement, 'nw')"></div>
      <div class="resize-handle resize-se" onmousedown="startResize(event, this.parentElement, 'se')"></div>
      <div class="resize-handle resize-sw" onmousedown="startResize(event, this.parentElement, 'sw')"></div>
    `;

    document.getElementById('desktop').appendChild(win);
    activeWindows[appId] = win;
    focusWindow(win);
    updateTaskbar();

    win.addEventListener('mousedown', () => focusWindow(win));
    return win;
  }

  function focusWindow(win) {
    document.querySelectorAll('.app-window').forEach(w => w.classList.remove('focused'));
    win.classList.add('focused');
    win.style.zIndex = ++windowZIndex;
    updateTaskbar();
  }

  function minimizeWindow(win) {
    win.style.display = 'none';
    win.dataset.minimized = 'true';
    updateTaskbar();
  }

  function maximizeWindow(win) {
    if (win.classList.contains('maximized')) {
      win.classList.remove('maximized');
      win.style.left = win.dataset.prevLeft;
      win.style.top = win.dataset.prevTop;
      win.style.width = win.dataset.prevWidth;
      win.style.height = win.dataset.prevHeight;
    } else {
      win.dataset.prevLeft = win.style.left;
      win.dataset.prevTop = win.style.top;
      win.dataset.prevWidth = win.style.width;
      win.dataset.prevHeight = win.style.height;
      win.classList.add('maximized');
    }
  }

  function closeWindow(win) {
    const appId = win.dataset.appId;
    win.remove();
    delete activeWindows[appId];
    updateTaskbar();
  }

  function updateTaskbar() {
    document.querySelectorAll('.taskbar-btn').forEach(btn => {
      btn.classList.remove('active', 'has-window');
    });
  }

  // ===== DRAG =====
  function startDrag(e, win) {
    if (e.target.closest('.title-bar-controls')) return;
    if (win.classList.contains('maximized')) return;
    dragState = {
      win, startX: e.clientX, startY: e.clientY,
      origLeft: parseInt(win.style.left), origTop: parseInt(win.style.top)
    };
    focusWindow(win);
    e.preventDefault();
  }

  document.addEventListener('mousemove', e => {
    if (dragState) {
      dragState.win.style.left = (dragState.origLeft + e.clientX - dragState.startX) + 'px';
      dragState.win.style.top = Math.max(0, dragState.origTop + e.clientY - dragState.startY) + 'px';
    }
    if (resizeState) {
      const { win, dir, startX, startY, origW, origH, origL, origT } = resizeState;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (dir.includes('e')) win.style.width = Math.max(400, origW + dx) + 'px';
      if (dir.includes('w')) { win.style.width = Math.max(400, origW - dx) + 'px'; win.style.left = (origL + dx) + 'px'; }
      if (dir.includes('s')) win.style.height = Math.max(300, origH + dy) + 'px';
      if (dir.includes('n')) { win.style.height = Math.max(300, origH - dy) + 'px'; win.style.top = (origT + dy) + 'px'; }
    }
  });

  document.addEventListener('mouseup', () => { dragState = null; resizeState = null; });

  function startResize(e, win, dir) {
    if (win.classList.contains('maximized')) return;
    resizeState = {
      win, dir,
      startX: e.clientX, startY: e.clientY,
      origW: win.offsetWidth, origH: win.offsetHeight,
      origL: parseInt(win.style.left), origT: parseInt(win.style.top)
    };
    e.preventDefault();
    e.stopPropagation();
  }

  // ===== START MENU =====
  function toggleStartMenu() {
    document.getElementById('start-menu').classList.toggle('show');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
      document.getElementById('start-menu').classList.remove('show');
    }
  });

  // ===== CONTEXT MENU =====
  document.getElementById('desktop').addEventListener('contextmenu', e => {
    if (e.target.closest('.app-window') || e.target.closest('#taskbar') || e.target.closest('#start-menu')) return;
    e.preventDefault();
    const menu = document.getElementById('context-menu');
    menu.style.display = 'block';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
  });

  document.addEventListener('click', () => {
    document.getElementById('context-menu').style.display = 'none';
  });

  // ===== APP DEFINITIONS =====
  const appIcons = {
    word: '<rect x="4" y="4" width="40" height="40" rx="6" fill="#185ABD"/><text x="24" y="34" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Segoe UI">W</text>',
    paint: '<rect x="4" y="4" width="40" height="40" rx="6" fill="#E8E8E8"/><circle cx="18" cy="20" r="4" fill="#E74C3C"/><circle cx="28" cy="16" r="4" fill="#2ECC71"/><circle cx="32" cy="26" r="4" fill="#3498DB"/><circle cx="20" cy="32" r="4" fill="#F39C12"/>',
    calculator: '<rect x="4" y="4" width="40" height="40" rx="6" fill="#1B1B1B"/><rect x="8" y="8" width="32" height="10" rx="2" fill="#333"/><text x="36" y="16" text-anchor="end" fill="#60cdff" font-size="10" font-family="Consolas">0</text>',
    notepad: '<rect x="8" y="4" width="32" height="40" rx="3" fill="#4A90D9"/><rect x="12" y="8" width="24" height="32" rx="1" fill="#F5F5DC"/><line x1="16" y1="14" x2="32" y2="14" stroke="#999" stroke-width="0.8"/><line x1="16" y1="18" x2="32" y2="18" stroke="#999" stroke-width="0.8"/>',
    explorer: '<path d="M4 12 L4 40 Q4 42 6 42 L42 42 Q44 42 44 40 L44 16 L28 16 L24 12 Z" fill="#F5C842"/><path d="M4 16 L44 16 L44 40 Q44 42 42 42 L6 42 Q4 42 4 40 Z" fill="#FFD966"/>',
    chrome: '<circle cx="24" cy="24" r="20" fill="#4285F4"/><circle cx="24" cy="24" r="12" fill="#fff"/><circle cx="24" cy="24" r="6" fill="#4285F4"/>'
  };

  // ===== OPEN APP =====
  function openApp(appId) {
    switch(appId) {
      case 'calculator': openCalculator(); break;
      case 'notepad': openNotepad(); break;
      case 'word': openWord(); break;
      case 'paint': openPaint(); break;
      case 'explorer': openExplorer(); break;
      case 'chrome': openChrome(); break;
    }
  }

  // ===== CALCULATOR =====
  function openCalculator() {
    const content = `
      <div class="calc-body">
        <div class="calc-display" id="calc-display"></div>
        <div class="calc-expression" id="calc-expression">0</div>
        <div class="calc-buttons">
          <button class="calc-btn top-row" onclick="calcAction('%')">%</button>
          <button class="calc-btn top-row" onclick="calcAction('CE')">CE</button>
          <button class="calc-btn top-row" onclick="calcAction('C')">C</button>
          <button class="calc-btn top-row" onclick="calcAction('⌫')">⌫</button>
          <button class="calc-btn operator" onclick="calcAction('1/x')">⅟ₓ</button>
          <button class="calc-btn operator" onclick="calcAction('x²')">x²</button>
          <button class="calc-btn operator" onclick="calcAction('√')">√x</button>
          <button class="calc-btn operator" onclick="calcAction('÷')">÷</button>
          <button class="calc-btn" onclick="calcAction('7')">7</button>
          <button class="calc-btn" onclick="calcAction('8')">8</button>
          <button class="calc-btn" onclick="calcAction('9')">9</button>
          <button class="calc-btn operator" onclick="calcAction('×')">×</button>
          <button class="calc-btn" onclick="calcAction('4')">4</button>
          <button class="calc-btn" onclick="calcAction('5')">5</button>
          <button class="calc-btn" onclick="calcAction('6')">6</button>
          <button class="calc-btn operator" onclick="calcAction('-')">−</button>
          <button class="calc-btn" onclick="calcAction('1')">1</button>
          <button class="calc-btn" onclick="calcAction('2')">2</button>
          <button class="calc-btn" onclick="calcAction('3')">3</button>
          <button class="calc-btn operator" onclick="calcAction('+')">+</button>
          <button class="calc-btn" onclick="calcAction('±')">±</button>
          <button class="calc-btn" onclick="calcAction('0')">0</button>
          <button class="calc-btn" onclick="calcAction('.')">.</button>
          <button class="calc-btn equals" onclick="calcAction('=')">=</button>
        </div>
      </div>
    `;
    const win = createWindow('calculator', 'Calculator', appIcons.calculator, 320, 480, content);
    window.calcState = { display: '0', expression: '', operator: null, prevValue: null, newNumber: true };
  }

  function calcAction(action) {
    const state = window.calcState;
    const display = document.getElementById('calc-expression');
    const displayTop = document.getElementById('calc-display');
    if (!display || !state) return;

    if ('0123456789'.includes(action)) {
      if (state.newNumber) { state.display = action; state.newNumber = false; }
      else { state.display = state.display === '0' ? action : state.display + action; }
    } else if (action === '.') {
      if (state.newNumber) { state.display = '0.'; state.newNumber = false; }
      else if (!state.display.includes('.')) { state.display += '.'; }
    } else if (action === 'C') {
      state.display = '0'; state.expression = ''; state.operator = null; state.prevValue = null; state.newNumber = true;
    } else if (action === 'CE') {
      state.display = '0'; state.newNumber = true;
    } else if (action === '⌫') {
      state.display = state.display.length > 1 ? state.display.slice(0, -1) : '0';
    } else if (action === '±') {
      state.display = String(-parseFloat(state.display));
    } else if (action === 'x²') {
      state.display = String(Math.pow(parseFloat(state.display), 2));
      state.newNumber = true;
    } else if (action === '√') {
      state.display = String(Math.sqrt(parseFloat(state.display)));
      state.newNumber = true;
    } else if (action === '1/x') {
      state.display = String(1 / parseFloat(state.display));
      state.newNumber = true;
    } else if (action === '%') {
      if (state.prevValue !== null) {
        state.display = String(state.prevValue * parseFloat(state.display) / 100);
      }
      state.newNumber = true;
    } else if (['+', '-', '×', '÷'].includes(action)) {
      if (state.operator && !state.newNumber) {
        state.display = String(calcCompute(state.prevValue, parseFloat(state.display), state.operator));
      }
      state.prevValue = parseFloat(state.display);
      state.operator = action;
      state.expression = state.display + ' ' + action;
      state.newNumber = true;
    } else if (action === '=') {
      if (state.operator) {
        state.expression = state.prevValue + ' ' + state.operator + ' ' + state.display + ' =';
        state.display = String(calcCompute(state.prevValue, parseFloat(state.display), state.operator));
        state.operator = null; state.prevValue = null; state.newNumber = true;
      }
    }

    display.textContent = state.display;
    displayTop.textContent = state.expression;
  }

  function calcCompute(a, b, op) {
    switch(op) {
      case '+': return a + b;
      case '-': return a - b;
      case '×': return a * b;
      case '÷': return b !== 0 ? a / b : 'Error';
    }
  }

  // ===== NOTEPAD =====
  function openNotepad() {
    const content = `
      <div class="notepad-body">
        <div class="notepad-menu">
          <span>File</span><span>Edit</span><span>Format</span><span>View</span><span>Help</span>
        </div>
        <textarea class="notepad-textarea" placeholder="Start typing..." spellcheck="false"></textarea>
        <div class="notepad-status">
          <span>Ln 1, Col 1</span>
          <span>UTF-8</span>
          <span>Windows (CRLF)</span>
        </div>
      </div>
    `;
    const win = createWindow('notepad', 'Untitled - Notepad', appIcons.notepad, 650, 450, content);
    const textarea = win.querySelector('.notepad-textarea');
    textarea.addEventListener('input', () => {
      const lines = textarea.value.substr(0, textarea.selectionStart).split('\n');
      const ln = lines.length;
      const col = lines[lines.length - 1].length + 1;
      win.querySelector('.notepad-status span').textContent = `Ln ${ln}, Col ${col}`;
    });
    textarea.addEventListener('click', () => {
      const lines = textarea.value.substr(0, textarea.selectionStart).split('\n');
      const ln = lines.length;
      const col = lines[lines.length - 1].length + 1;
      win.querySelector('.notepad-status span').textContent = `Ln ${ln}, Col ${col}`;
    });
  }

  // ===== WORD =====
  function openWord() {
    const content = `
      <div class="word-body">
        <div class="word-ribbon">
          <select onchange="wordFormat('fontName', this.value)">
            <option>Calibri</option>
            <option>Arial</option>

  function wordFormat(command, value) {

  // ===== PAINT =====
  function openPaint() {
    const colors = ['#000000','#FFFFFF','#FF0000','#00FF00','#0000FF','#FFFF00','#FF00FF','#00FFFF',
                    '#FF8800','#8800FF','#0088FF','#888888','#FF4444','#44FF44','#4444FF','#FFAA00'];
    const colorBtns = colors.map((c, i) =>
      `<div class="paint-color ${i === 0 ? 'active' : ''}" style="background:${c}" onclick="selectPaintColor(this, '${c}')"></div>`
    ).join('');

    const content = `
      <div class="paint-body">
        <div class="paint-toolbar">
          <div class="paint-tool active" data-tool="brush" onclick="selectPaintTool(this, 'brush')" title="Brush">🖌️</div>
          <div class="paint-tool" data-tool="eraser" onclick="selectPaintTool(this, 'eraser')" title="Eraser">🧹</div>
          <div class="paint-tool" data-tool="line" onclick="selectPaintTool(this, 'line')" title="Line">╱</div>
          <div class="paint-tool" data-tool="rect" onclick="selectPaintTool(this, 'rect')" title="Rectangle">▭</div>
          <div class="paint-tool" data-tool="circle" onclick="selectPaintTool(this, 'circle')" title="Circle">◯</div>
          <div class="paint-tool" data-tool="fill" onclick="selectPaintTool(this, 'fill')" title="Fill">🪣</div>
          <span style="color:#999;font-size:11px;margin-left:8px;">Size:</span>
          <input type="range" class="paint-size" min="1" max="30" value="3" id="paint-brush-size">
          <div class="paint-colors">${colorBtns}</div>
          <span style="color:#999;font-size:11px;margin-left:4px;">Color:</span>
          <input type="color" value="#000000" id="paint-custom-color" style="width:28px;height:26px;border:none;cursor:pointer;background:transparent;" onchange="selectPaintColorCustom(this.value)">
          <button class="paint-tool" style="width:auto;padding:0 8px;font-size:11px;" onclick="clearPaintCanvas()">Clear</button>
        </div>
        <div class="paint-canvas-container">
          <canvas class="paint-canvas" width="800" height="500" id="paint-canvas"></canvas>
        </div>
      </div>
    `;
    const win = createWindow('paint', 'Untitled - Paint', appIcons.paint, 900, 600, content);

    const canvas = win.querySelector('#paint-canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    canvas._paintState = {
      drawing: false, tool: 'brush', color: '#000000',
      lastX: 0, lastY: 0, startX: 0, startY: 0,
      snapshot: null
    };

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const ps = canvas._paintState;
      ps.drawing = true;
      ps.lastX = x; ps.lastY = y;
      ps.startX = x; ps.startY = y;

      if (['line', 'rect', 'circle'].includes(ps.tool)) {
        ps.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }

      if (ps.tool === 'fill') {
        floodFill(ctx, canvas, Math.round(x), Math.round(y), ps.color);
        ps.drawing = false;
      }
    });

    canvas.addEventListener('mousemove', e => {
      const ps = canvas._paintState;
      if (!ps.drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const size = win.querySelector('#paint-brush-size').value;

      if (ps.tool === 'brush' || ps.tool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(ps.lastX, ps.lastY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = ps.tool === 'eraser' ? '#FFFFFF' : ps.color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ps.lastX = x; ps.lastY = y;
      } else if (ps.tool === 'line') {
        ctx.putImageData(ps.snapshot, 0, 0);
        ctx.beginPath();
        ctx.moveTo(ps.startX, ps.startY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = ps.color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.stroke();
      } else if (ps.tool === 'rect') {
        ctx.putImageData(ps.snapshot, 0, 0);
        ctx.strokeStyle = ps.color;
        ctx.lineWidth = size;
        ctx.strokeRect(ps.startX, ps.startY, x - ps.startX, y - ps.startY);
      } else if (ps.tool === 'circle') {
        ctx.putImageData(ps.snapshot, 0, 0);
        const rx = Math.abs(x - ps.startX) / 2;
        const ry = Math.abs(y - ps.startY) / 2;
        const cx = ps.startX + (x - ps.startX) / 2;
        const cy = ps.startY + (y - ps.startY) / 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.strokeStyle = ps.color;
        ctx.lineWidth = size;
        ctx.stroke();
      }
    });

    canvas.addEventListener('mouseup', () => { canvas._paintState.drawing = false; });
    canvas.addEventListener('mouseleave', () => { canvas._paintState.drawing = false; });

    window.selectPaintTool = function(el, tool) {
      el.closest('.paint-toolbar').querySelectorAll('.paint-tool').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      el.closest('.paint-body').querySelector('canvas')._paintState.tool = tool;
    };

    window.selectPaintColor = function(el, color) {
      el.closest('.paint-colors').querySelectorAll('.paint-color').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      el.closest('.paint-body').querySelector('canvas')._paintState.color = color;
      el.closest('.paint-body').querySelector('#paint-custom-color').value = color;
    };

    window.selectPaintColorCustom = function(color) {
      const canvas = document.querySelector('#paint-canvas');
      if (canvas) canvas._paintState.color = color;
    };

    window.clearPaintCanvas = function() {
      const canvas = document.querySelector('#paint-canvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
  }

  function floodFill(ctx, canvas, startX, startY, fillColor) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const w = canvas.width;
    const h = canvas.height;

    const fc = hexToRgb(fillColor);
    const idx = (startY * w + startX) * 4;
    const tr = data[idx], tg = data[idx + 1], tb = data[idx + 2], ta = data[idx + 3];

    if (tr === fc.r && tg === fc.g && tb === fc.b && ta === 255) return;

    const stack = [[startX, startY]];
    const visited = new Set();

    while (stack.length > 0) {
      const [x, y] = stack.pop();
      const key = y * w + x;
      if (x < 0 || x >= w || y < 0 || y >= h) continue;
      if (visited.has(key)) continue;
      visited.add(key);

      const i = key * 4;
      if (Math.abs(data[i] - tr) > 30 || Math.abs(data[i + 1] - tg) > 30 || Math.abs(data[i + 2] - tb) > 30) continue;

      data[i] = fc.r; data[i + 1] = fc.g; data[i + 2] = fc.b; data[i + 3] = 255;

      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }

    ctx.putImageData(imageData, 0, 0);
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return { r, g, b };
  }

  // ===== FILE EXPLORER =====
  function openExplorer() {
    const fileSystem = {
      'This PC': {
        type: 'root',
        children: {
          'Desktop': { type: 'folder', children: {
            'document.txt': { type: 'file', size: '2 KB' },
            'photo.png': { type: 'file', size: '1.2 MB' },
            'Notes': { type: 'folder', children: {
              'todo.txt': { type: 'file', size: '1 KB' },
              'ideas.txt': { type: 'file', size: '3 KB' }
            }}
          }},
          'Documents': { type: 'folder', children: {
            'Report.docx': { type: 'file', size: '24 KB' },
            'Budget.xlsx': { type: 'file', size: '15 KB' },
            'Presentation.pptx': { type: 'file', size: '2.1 MB' },
            'Projects': { type: 'folder', children: {
              'ProjectA': { type: 'folder', children: {
                'readme.md': { type: 'file', size: '1 KB' }
              }},
              'ProjectB': { type: 'folder', children: {} }
            }}
          }},
          'Downloads': { type: 'folder', children: {
            'setup.exe': { type: 'file', size: '45 MB' },
            'archive.zip': { type: 'file', size: '12 MB' },
            'image.jpg': { type: 'file', size: '3.4 MB' }
          }},
          'Pictures': { type: 'folder', children: {
            'Vacation': { type: 'folder', children: {
              'beach.jpg': { type: 'file', size: '4.2 MB' },
              'sunset.jpg': { type: 'file', size: '3.8 MB' }
            }},
            'Screenshots': { type: 'folder', children: {
              'screenshot1.png': { type: 'file', size: '800 KB' },
              'screenshot2.png': { type: 'file', size: '1.1 MB' }
            }}
          }},
          'Music': { type: 'folder', children: {
            'playlist.m3u': { type: 'file', size: '1 KB' },
            'song.mp3': { type: 'file', size: '5.4 MB' }
          }},
          'Videos': { type: 'folder', children: {
            'tutorial.mp4': { type: 'file', size: '120 MB' },
            'clip.avi': { type: 'file', size: '45 MB' }
          }}
        }
      }
    };

    let currentPath = ['This PC'];
    let sidebarItems = ['Desktop', 'Documents', 'Downloads', 'Pictures', 'Music', 'Videos'];

    function getFileIcon(item) {
      if (item.type === 'folder') return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><path d="M4 12 L4 40 Q4 42 6 42 L42 42 Q44 42 44 40 L44 16 L28 16 L24 12 Z" fill="#F5C842"/><path d="M4 16 L44 16 L44 40 Q44 42 42 42 L6 42 Q4 42 4 40 Z" fill="#FFD966"/></svg>`;
      const ext = item.name ? item.name.split('.').pop() : '';
      if (['jpg','png','gif','bmp'].includes(ext)) return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="4" fill="#4CAF50"/><circle cx="18" cy="18" r="6" fill="#FFEB3B"/><path d="M8 36 L18 24 L28 32 L36 22 L40 28 L40 36 Z" fill="#81C784"/></svg>`;
      if (['doc','docx'].includes(ext)) return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3" fill="#185ABD"/><text x="24" y="30" text-anchor="middle" fill="white" font-size="12" font-weight="bold">W</text></svg>`;
      if (['xls','xlsx'].includes(ext)) return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3" fill="#1D6B3F"/><text x="24" y="30" text-anchor="middle" fill="white" font-size="12" font-weight="bold">X</text></svg>`;
      if (['mp3','wav','m3u'].includes(ext)) return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3" fill="#E91E63"/><circle cx="24" cy="28" r="8" fill="none" stroke="white" stroke-width="2"/><circle cx="24" cy="28" r="3" fill="white"/></svg>`;
      if (['mp4','avi','mov'].includes(ext)) return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3" fill="#9C27B0"/><polygon points="20,16 20,32 34,24" fill="white"/></svg>`;
      if (['zip','rar','7z'].includes(ext)) return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3" fill="#FF9800"/><rect x="20" y="10" width="8" height="6" fill="white"/><rect x="20" y="18" width="8" height="6" fill="white"/><rect x="20" y="26" width="8" height="6" fill="white"/></svg>`;
      if (['exe','msi'].includes(ext)) return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3" fill="#607D8B"/><text x="24" y="28" text-anchor="middle" fill="white" font-size="10" font-weight="bold">⚙</text></svg>`;
      if (['txt','md'].includes(ext)) return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3" fill="#9E9E9E"/><line x1="16" y1="14" x2="32" y2="14" stroke="white" stroke-width="1.5"/><line x1="16" y1="20" x2="32" y2="20" stroke="white" stroke-width="1.5"/><line x1="16" y1="26" x2="28" y2="26" stroke="white" stroke-width="1.5"/></svg>`;
      return `<svg class="explorer-file-icon" viewBox="0 0 48 48"><rect x="10" y="4" width="28" height="40" rx="3" fill="#90A4AE"/><rect x="14" y="12" width="20" height="24" fill="#B0BEC5"/></svg>`;
    }

    function getNode(path) {
      let node = fileSystem;
      for (const p of path) {
        if (node[p]) node = node[p];
        else if (node.children && node.children[p]) node = node.children[p];
        else return null;
      }
      return node;
    }

    function renderExplorer() {
      const node = getNode(currentPath);
      const pathStr = currentPath.join(' > ');
      const body = document.querySelector('.app-window[data-app-id="explorer"] .explorer-body');
      if (!body) return;

      body.querySelector('.explorer-path').textContent = pathStr;

      const filesContainer = body.querySelector('.explorer-files');
      filesContainer.innerHTML = '';

      if (!node) return;

      const children = node.type === 'root' ? node.children : (node.children || {});
      const entries = Object.entries(children);

      entries.forEach(([name, item]) => {
        const fileEl = document.createElement('div');
        fileEl.className = 'explorer-file';
        fileEl.innerHTML = `${getFileIcon({...item, name})}<span class="explorer-file-name">${name}</span>`;
        fileEl.ondblclick = () => {
          if (item.type === 'folder') {
            currentPath.push(name);
            renderExplorer();
          }
        };
        filesContainer.appendChild(fileEl);
      });

      body.querySelector('.explorer-status').textContent = `${entries.length} items`;

      // Update sidebar
      body.querySelectorAll('.explorer-sidebar-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.path === currentPath[currentPath.length - 1]) item.classList.add('active');
      });
    }

    const sidebarItems_html = ['This PC', 'Desktop', 'Documents', 'Downloads', 'Pictures', 'Music', 'Videos'].map(name => {
      const icon = name === 'This PC' ? '💻' : '📁';
      return `<div class="explorer-sidebar-item ${name === 'This PC' ? 'active' : ''}" data-path="${name}" onclick="navigateTo('${name}')">${icon} ${name}</div>`;
    }).join('');

    const content = `
      <div class="explorer-body">
        <div class="explorer-toolbar">
          <button class="explorer-nav-btn" onclick="explorerBack()">←</button>
          <button class="explorer-nav-btn" onclick="explorerUp()">↑</button>
          <div class="explorer-path">This PC</div>
          <input type="text" class="explorer-search" placeholder="🔍 Search">
        </div>
        <div class="explorer-content">
          <div class="explorer-sidebar">${sidebarItems_html}</div>
          <div class="explorer-files"></div>
        </div>
        <div class="explorer-status">0 items</div>
      </div>
    `;
    const win = createWindow('explorer', 'File Explorer', appIcons.explorer, 850, 550, content);
    renderExplorer();

    window.explorerBack = function() {
      if (currentPath.length > 1) { currentPath.pop(); renderExplorer(); }
    };

    window.explorerUp = function() {
      if (currentPath.length > 1) { currentPath.pop(); renderExplorer(); }
    };

    window.navigateTo = function(name) {
      if (name === 'This PC') { currentPath = ['This PC']; }
      else { currentPath = ['This PC', name]; }
      renderExplorer();
    };
  }

  // ===== CHROME =====
  function openChrome() {
    const content = `
      <div class="chrome-body">
        <div class="chrome-tab-bar">
          <div class="chrome-tab active">
            <span>New Tab</span>
            <span class="chrome-tab-close">✕</span>
          </div>
        </div>
        <div class="chrome-nav">
          <button class="chrome-nav-btn">←</button>
          <button class="chrome-nav-btn">→</button>
          <button class="chrome-nav-btn">↻</button>
          <input type="text" class="chrome-url" placeholder="Search Google or type a URL" value="">
        </div>
        <div class="chrome-content">
          <div class="chrome-newtab">
            <h2>Google</h2>
            <input type="text" class="chrome-newtab-search" placeholder="Search Google or type a URL" id="chrome-search-input">
          </div>
        </div>
      </div>
    `;
    const win = createWindow('chrome', 'New Tab - Chrome', appIcons.chrome, 950, 600, content);

    const urlBar = win.querySelector('.chrome-url');
    const searchInput = win.querySelector('.chrome-newtab-search');
    const chromeContent = win.querySelector('.chrome-content');

    function navigate(url) {
      if (!url.startsWith('http')) {
        url = 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(url);
      }
      urlBar.value = url;
      chromeContent.innerHTML = `<iframe src="${url}" sandbox="allow-same-origin allow-scripts allow-forms" style="width:100%;height:100%;border:none;"></iframe>`;
      win.querySelector('.chrome-tab span').textContent = url.length > 30 ? url.substring(0, 30) + '...' : url;
    }

    urlBar.addEventListener('keydown', e => {
      if (e.key === 'Enter') navigate(urlBar.value);
    });

    if (searchInput) {
      searchInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') navigate(searchInput.value);
      });
    }
  }

  // ===== KEYBOARD SHORTCUTS =====
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('start-menu').classList.remove('show');
    }
  });
</script>
