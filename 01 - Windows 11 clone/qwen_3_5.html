<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Web Experience</title>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --taskbar-bg: rgba(243, 243, 243, 0.85);
            --window-bg: #ffffff;
            --hover-bg: rgba(255, 255, 255, 0.5);
            --accent: #0067c0;
            --text-main: #000;
            --border-radius: 8px;
        }

        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.wallpapersden.com/image/download/windows-11-default-original-desktop-background_bmdpaWmUmZqaraWkpJRmbmdlrWZlbWU.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Desktop Icons */
        #desktop {
            width: 100%;
            height: calc(100% - 48px);
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
        }

        .desktop-icon {
            width: 74px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: default;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            transition: background 0.1s;
        }
        .desktop-icon:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .desktop-icon:active { background: rgba(255,255,255,0.2); }
        .desktop-icon img { width: 40px; height: 40px; margin-bottom: 5px; }
        .desktop-icon span { font-size: 12px; text-align: center; line-height: 1.2; }

        /* Taskbar */
        #taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 48px;
            background: var(--taskbar-bg);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.3);
            z-index: 9000;
        }

        .taskbar-icons {
            display: flex;
            gap: 6px;
            height: 100%;
            align-items: center;
        }

        .taskbar-icon {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
            cursor: pointer;
            position: relative;
        }
        .taskbar-icon:hover { background: var(--hover-bg); }
        .taskbar-icon:active { transform: scale(0.95); }
        .taskbar-icon img { width: 24px; height: 24px; }
        
        .taskbar-icon.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            width: 16px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        .system-tray {
            position: absolute;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
            color: #333;
        }
        .tray-icons { display: flex; gap: 10px; }
        .clock-area { text-align: right; cursor: default; }

        /* Start Menu */
        #start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 600px;
            height: 650px;
            background: rgba(243, 243, 243, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            padding: 24px;
            z-index: 8999;
            transition: opacity 0.2s, transform 0.2s;
            opacity: 0;
        }
        #start-menu.open {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .search-bar {
            background: #fff;
            border-bottom: 2px solid var(--accent);
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            color: #666;
        }
        .pinned-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
        }
        .start-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px;
            border-radius: 4px;
        }
        .start-item:hover { background: rgba(255,255,255,0.5); }
        .start-item img { width: 32px; height: 32px; }
        .start-item span { font-size: 11px; color: #333; }

        /* Windows */
        .window {
            position: absolute;
            background: var(--window-bg);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 300px;
            min-height: 200px;
            resize: both;
            animation: popIn 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .title-bar {
            height: 32px;
            background: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid #eee;
        }
        .title-drag-area { flex: 1; height: 100%; display: flex; align-items: center; font-size: 12px; }
        .window-controls { display: flex; height: 100%; }
        .control-btn {
            width: 46px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .control-btn:hover { background: #e5e5e5; }
        .control-btn.close:hover { background: #e81123; color: white; }

        .window-content {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #fff;
        }

        /* App Specific Styles */
        /* Calculator */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); height: 100%; }
        .calc-display { grid-column: span 4; background: #f9f9f9; padding: 20px; text-align: right; font-size: 32px; border-bottom: 1px solid #eee; }
        .calc-btn { border: 1px solid #f0f0f0; background: #fff; font-size: 16px; cursor: pointer; }
        .calc-btn:hover { background: #f0f0f0; }
        .calc-btn.accent { background: var(--accent); color: white; }
        
        /* Notepad / Word */
        .editor-area { width: 100%; height: 100%; border: none; padding: 10px; font-family: 'Consolas', monospace; resize: none; outline: none; }
        .word-toolbar { padding: 5px; border-bottom: 1px solid #eee; background: #f3f3f3; }
        .word-btn { padding: 4px 8px; cursor: pointer; border: 1px solid transparent; }
        .word-btn:hover { background: #ddd; }

        /* Paint */
        .paint-toolbar { padding: 5px; background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; gap: 5px; }
        canvas { cursor: crosshair; touch-action: none; }

        /* Explorer */
        .explorer-layout { display: flex; height: 100%; }
        .sidebar { width: 150px; background: #f3f3f3; border-right: 1px solid #ddd; padding: 10px; font-size: 13px; }
        .main-view { flex: 1; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; align-content: start; }
        .file-item { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 5px; cursor: pointer; }
        .file-item:hover { background: #e5f3ff; border: 1px solid #cce8ff; }
        .file-icon { font-size: 32px; margin-bottom: 5px; }
        .file-name { font-size: 12px; word-break: break-word; }

        /* Chrome */
        .browser-bar { display: flex; padding: 8px; background: #f1f3f4; border-bottom: 1px solid #ddd; gap: 10px; }
        .url-input { flex: 1; background: #fff; border: 1px solid #ddd; border-radius: 20px; padding: 4px 15px; font-size: 13px; outline: none; }
        iframe { width: 100%; height: 100%; border: none; background: white; }

    </style>
</head>
<body>

    <!-- Desktop Icons -->
    <div id="desktop">
        <div class="desktop-icon" ondblclick="openApp('word')">
            <img src="https://img.icons8.com/color/96/000000/microsoft-word-2019--v2.png" alt="Word">
            <span>Word</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('paint')">
            <img src="https://img.icons8.com/color/96/000000/paint-palette.png" alt="Paint">
            <span>Paint</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('calculator')">
            <img src="https://img.icons8.com/color/96/000000/calculator--v1.png" alt="Calc">
            <span>Calculator</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('notepad')">
            <img src="https://img.icons8.com/color/96/000000/notepad.png" alt="Notepad">
            <span>Notepad</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('explorer')">
            <img src="https://img.icons8.com/color/96/000000/folder-invoices--v1.png" alt="Explorer">
            <span>Explorer</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('chrome')">
            <img src="https://img.icons8.com/color/96/000000/chrome--v1.png" alt="Chrome">
            <span>Chrome</span>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="search-bar">🔍 Type here to search</div>
        <div style="font-size: 14px; font-weight: 600; margin-bottom: 15px; color: #333;">Pinned</div>
        <div class="pinned-grid">
            <div class="start-item" onclick="openApp('word')"><img src="https://img.icons8.com/color/48/000000/microsoft-word-2019--v2.png"><span>Word</span></div>
            <div class="start-item" onclick="openApp('excel')"><img src="https://img.icons8.com/color/48/000000/microsoft-excel-2019--v1.png"><span>Excel</span></div>
            <div class="start-item" onclick="openApp('powerpoint')"><img src="https://img.icons8.com/color/48/000000/microsoft-powerpoint-2019--v1.png"><span>PowerPoint</span></div>
            <div class="start-item" onclick="openApp('paint')"><img src="https://img.icons8.com/color/48/000000/paint-palette.png"><span>Paint</span></div>
            <div class="start-item" onclick="openApp('calculator')"><img src="https://img.icons8.com/color/48/000000/calculator--v1.png"><span>Calculator</span></div>
            <div class="start-item" onclick="openApp('notepad')"><img src="https://img.icons8.com/color/48/000000/notepad.png"><span>Notepad</span></div>
            <div class="start-item" onclick="openApp('explorer')"><img src="https://img.icons8.com/color/48/000000/folder-invoices--v1.png"><span>Explorer</span></div>
            <div class="start-item" onclick="openApp('chrome')"><img src="https://img.icons8.com/color/48/000000/chrome--v1.png"><span>Chrome</span></div>
            <div class="start-item" onclick="openApp('store')"><img src="https://img.icons8.com/color/48/000000/microsoft-store-2018.png"><span>Store</span></div>
            <div class="start-item" onclick="openApp('settings')"><img src="https://img.icons8.com/color/48/000000/settings--v1.png"><span>Settings</span></div>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="taskbar-icons">
            <div class="taskbar-icon" onclick="toggleStartMenu()" title="Start">
                <img src="https://img.icons8.com/fluency/48/000000/windows-11.png" alt="Start">
            </div>
            <div class="taskbar-icon" title="Search">
                <img src="https://img.icons8.com/fluency/48/000000/search.png" alt="Search">
            </div>
            <div class="taskbar-icon" title="Task View">
                <img src="https://img.icons8.com/fluency/48/000000/task-view.png" alt="Task View">
            </div>
            <div class="taskbar-icon" title="Chat">
                <img src="https://img.icons8.com/fluency/48/000000/chat-message.png" alt="Chat">
            </div>
            <div class="taskbar-icon" title="Explorer" onclick="openApp('explorer')">
                <img src="https://img.icons8.com/fluency/48/000000/folder-invoices--v1.png" alt="Explorer">
            </div>
            <div class="taskbar-icon" title="Edge" onclick="openApp('chrome')">
                <img src="https://img.icons8.com/fluency/48/000000/ms-edge-new.png" alt="Edge">
            </div>
            <div class="taskbar-icon" title="Store">
                <img src="https://img.icons8.com/fluency/48/000000/microsoft-store-2018.png" alt="Store">
            </div>
        </div>

        <div class="system-tray">
            <div class="tray-icons">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="13" x2="23" y2="11"></line></svg>
            </div>
            <div class="clock-area" id="clock">
                <div id="time">12:00 PM</div>
                <div id="date">10/25/2023</div>
            </div>
        </div>
    </div>

    <script>
        // --- Clock Logic ---
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Start Menu Logic ---
        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('open');
        }

        // Close start menu when clicking desktop
        document.getElementById('desktop').addEventListener('click', () => {
            document.getElementById('start-menu').classList.remove('open');
        });

        // --- Window Manager ---
        let zIndexCounter = 100;
        let activeWindows = {};

        function openApp(appName) {
            document.getElementById('start-menu').classList.remove('open');
            
            // If already open, bring to front
            if (activeWindows[appName]) {
                bringToFront(activeWindows[appName]);
                return;
            }

            const id = 'win-' + appName;
            const win = document.createElement('div');
            win.className = 'window';
            win.id = id;
            win.style.left = (100 + (Object.keys(activeWindows).length * 30)) + 'px';
            win.style.top = (50 + (Object.keys(activeWindows).length * 30)) + 'px';
            win.style.zIndex = ++zIndexCounter;
            
            // Default sizes
            let width = '600px';
            let height = '400px';
            let title = appName.charAt(0).toUpperCase() + appName.slice(1);
            let content = '';

            // App Content Generation
            if (appName === 'calculator') {
                width = '320px'; height = '450px';
                content = `
                    <div class="calc-grid">
                        <div class="calc-display" id="calc-disp-${id}">0</div>
                        <button class="calc-btn" onclick="calcInput('${id}', 'C')">C</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '(')">(</button>
                        <button class="calc-btn" onclick="calcInput('${id}', ')')">)</button>
                        <button class="calc-btn accent" onclick="calcInput('${id}', '/')">/</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '7')">7</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '8')">8</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '9')">9</button>
                        <button class="calc-btn accent" onclick="calcInput('${id}', '*')">*</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '4')">4</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '5')">5</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '6')">6</button>
                        <button class="calc-btn accent" onclick="calcInput('${id}', '-')">-</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '1')">1</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '2')">2</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '3')">3</button>
                        <button class="calc-btn accent" onclick="calcInput('${id}', '+')">+</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '0')" style="grid-column: span 2">0</button>
                        <button class="calc-btn" onclick="calcInput('${id}', '.')">.</button>
                        <button class="calc-btn accent" onclick="calcInput('${id}', '=')">=</button>
                    </div>
                `;
            } else if (appName === 'notepad') {
                content = `<textarea class="editor-area" placeholder="Type here..."></textarea>`;
            } else if (appName === 'word') {
                content = `
                    <div class="word-toolbar">
                        <span class="word-btn" onclick="document.execCommand('bold',false,null)"><b>B</b></span>
                        <span class="word-btn" onclick="document.execCommand('italic',false,null)"><i>I</i></span>
                        <span class="word-btn" onclick="document.execCommand('underline',false,null)"><u>U</u></span>
                    </div>
                    <div class="editor-area" contenteditable="true" style="font-family: 'Calibri', sans-serif; padding: 20px; overflow-y: scroll;">Start typing your document...</div>
                `;
            } else if (appName === 'paint') {
                content = `
                    <div class="paint-toolbar">
                        <input type="color" id="color-${id}" value="#000000">
                        <input type="range" id="size-${id}" min="1" max="20" value="5">
                        <button onclick="clearCanvas('${id}')">Clear</button>
                    </div>
                    <canvas id="canvas-${id}" width="580" height="350" style="background:white; display:block;"></canvas>
                `;
                setTimeout(() => initPaint(id), 100);
            } else if (appName === 'explorer') {
                content = `
                    <div class="explorer-layout">
                        <div class="sidebar">
                            <div>📁 Desktop</div>
                            <div>⬇️ Downloads</div>
                            <div>📄 Documents</div>
                            <div>🖼️ Pictures</div>
                            <div>🎵 Music</div>
                        </div>
                        <div class="main-view">
                            <div class="file-item"><div class="file-icon">📁</div><div class="file-name">Work</div></div>
                            <div class="file-item"><div class="file-icon">📁</div><div class="file-name">Personal</div></div>
                            <div class="file-item"><div class="file-icon">📄</div><div class="file-name">Resume.pdf</div></div>
                            <div class="file-item"><div class="file-icon">🖼️</div><div class="file-name">Photo.jpg</div></div>
                            <div class="file-item"><div class="file-icon">🎵</div><div class="file-name">Song.mp3</div></div>
                        </div>
                    </div>
                `;
            } else if (appName === 'chrome') {
                content = `
                    <div class="browser-bar">
                        <button>⬅</button><button>➡</button><button>↻</button>
                        <input class="url-input" value="https://www.bing.com" readonly>
                    </div>
                    <iframe src="https://www.bing.com"></iframe>
                `;
            } else {
                content = `<div style="padding:20px; text-align:center;">${title} is not installed in this demo.</div>`;
            }

            win.innerHTML = `
                <div class="title-bar" onmousedown="startDrag(event, '${id}')">
                    <div class="title-drag-area">
                        <img src="https://img.icons8.com/color/16/000000/${appName}.png" style="margin-right:8px; width:16px; height:16px;">
                        ${title}
                    </div>
                    <div class="window-controls">
                        <div class="control-btn" onclick="minimizeWindow('${id}')">─</div>
                        <div class="control-btn" onclick="maximizeWindow('${id}')">□</div>
                        <div class="control-btn close" onclick="closeWindow('${id}')">✕</div>
                    </div>
                </div>
                <div class="window-content">${content}</div>
            `;

            win.onmousedown = () => bringToFront(win);
            document.body.appendChild(win);
            activeWindows[appName] = win;
            
            // Add taskbar indicator
            // (Simplified: just visual logic in real OS, here we skip complex taskbar state management for brevity)
        }

        function closeWindow(id) {
            const win = document.getElementById(id);
            win.style.transform = "scale(0.9)";
            win.style.opacity = "0";
            setTimeout(() => {
                win.remove();
                // Remove from active map
                for (const [key, value] of Object.entries(activeWindows)) {
                    if (value.id === id) delete activeWindows[key];
                }
            }, 200);
        }

        function bringToFront(win) {
            win.style.zIndex = ++zIndexCounter;
        }

        function minimizeWindow(id) {
            const win = document.getElementById(id);
            win.style.display = 'none';
            // In a full OS, this would minimize to taskbar. Here we just hide.
            // To restore, we'd need a taskbar click handler.
            alert("Minimized! (Click the taskbar icon to restore - feature simulated)");
            win.style.display = 'flex';
            bringToFront(win);
        }

        function maximizeWindow(id) {
            const win = document.getElementById(id);
            if (win.style.width === '100%') {
                win.style.width = '600px';
                win.style.height = '400px';
                win.style.top = '50px';
                win.style.left = '100px';
            } else {
                win.style.width = '100%';
                win.style.height = 'calc(100% - 48px)';
                win.style.top = '0';
                win.style.left = '0';
            }
        }

        // --- Drag Logic ---
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let currentWindow = null;

        function startDrag(e, id) {
            if(e.target.closest('.window-controls')) return; // Don't drag if clicking buttons
            isDragging = true;
            currentWindow = document.getElementById(id);
            bringToFront(currentWindow);
            
            const rect = currentWindow.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
        }

        document.addEventListener('mousemove', (e) => {
            if (isDragging && currentWindow) {
                currentWindow.style.left = (e.clientX - dragOffset.x) + 'px';
                currentWindow.style.top = (e.clientY - dragOffset.y) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            currentWindow = null;
        });

        // --- App Logic Helpers ---
        
        // Calculator
        let calcBuffer = {};
        function calcInput(id, val) {
            const display = document.getElementById(`calc-disp-${id}`);
            if (!calcBuffer[id]) calcBuffer[id] = '';
            
            if (val === 'C') {
                calcBuffer[id] = '';
                display.innerText = '0';
            } else if (val === '=') {
                try {
                    // Safe eval alternative could be used, but eval is okay for this isolated demo
                    display.innerText = eval(calcBuffer[id]);
                    calcBuffer[id] = display.innerText;
                } catch {
                    display.innerText = 'Error';
                    calcBuffer[id] = '';
                }
            } else {
                calcBuffer[id] += val;
                display.innerText = calcBuffer[id];
            }
        }

        // Paint
        function initPaint(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const colorPicker = document.getElementById(`color-${id}`);
            const sizePicker = document.getElementById(`size-${id}`);
            
            let painting = false;

            function startPosition(e) {
                painting = true;
                draw(e);
            }
            function endPosition() {
                painting = false;
                ctx.beginPath();
            }
            function draw(e) {
                if (!painting) return;
                const rect = canvas.getBoundingClientRect();
                ctx.lineWidth = sizePicker.value;
                ctx.lineCap = 'round';
                ctx.strokeStyle = colorPicker.value;
                
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            }

            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', draw);
        }

        function clearCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

    </script>
</body>
</html>
