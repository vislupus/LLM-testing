<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Web Clone</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for standard UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom scrollbars and utility animations */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .glass-dark {
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Desktop Wallpaper */
        #desktop {
            background-image: url('https://raw.githubusercontent.com/yashash1511/Windows11Web/master/src/assets/wallpapers/default/theme/A/img0.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Desktop Icon Grid */
        #desktop-icons {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            height: calc(100vh - 60px);
            padding: 10px;
            align-content: flex-start;
            gap: 5px;
        }

        .desktop-icon {
            width: 74px;
            height: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: default;
            transition: background 0.1s;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .desktop-icon img {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }

        .desktop-icon span {
            color: white;
            font-size: 11px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            padding: 0 2px;
        }

        /* Window Styling */
        .window {
            position: absolute;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(200,200,200,0.5);
            background: #f3f4f6;
            transition: transform 0.2s ease, opacity 0.2s ease;
            transform-origin: center;
        }
        
        .window.minimized {
            transform: scale(0.8) translateY(100px);
            opacity: 0;
            pointer-events: none;
        }

        .title-bar {
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding-left: 10px;
            font-size: 12px;
            user-select: none;
        }

        .window-controls button {
            width: 46px;
            height: 32px;
            border: none;
            background: transparent;
            font-size: 10px;
            color: #333;
            transition: background 0.2s;
        }

        .window-controls button:hover { background: #e5e7eb; }
        .window-controls button.close-btn:hover { background: #ef4444; color: white; }

        .window-content {
            flex: 1;
            position: relative;
            background: #ffffff;
            overflow: auto;
        }

        /* Taskbar */
        #taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
        }

        #taskbar-center {
            display: flex;
            gap: 4px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .taskbar-icon {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            position: relative;
        }
        
        .taskbar-icon:hover { background: rgba(255, 255, 255, 0.1); }
        .taskbar-icon.active { background: rgba(255, 255, 255, 0.15); }
        
        .taskbar-icon.open::after {
            content: '';
            position: absolute;
            bottom: 2px;
            width: 16px;
            height: 3px;
            background: #60a5fa;
            border-radius: 3px;
            transition: width 0.2s;
        }
        .taskbar-icon.active::after { width: 24px; }

        .taskbar-icon img { width: 24px; height: 24px; }

        #system-tray {
            display: flex;
            align-items: center;
            padding-right: 15px;
            color: white;
            font-size: 12px;
            height: 100%;
        }

        .tray-item {
            padding: 0 8px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .tray-item:hover { background: rgba(255, 255, 255, 0.1); }

        /* Specific App Styles */
        .app-iframe { width: 100%; height: 100%; border: none; }
        .editor-toolbar button { padding: 4px 8px; margin: 2px; border-radius: 4px; transition: background 0.2s; }
        .editor-toolbar button:hover { background: #e2e8f0; }
        
        /* Start Menu */
        #start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 650px;
            border-radius: 8px;
            padding: 30px;
            display: none;
            z-index: 9999;
            flex-direction: column;
        }
        #start-menu.active { display: flex; }
        .pinned-apps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-top: 20px; }
        .pinned-app { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px; border-radius: 4px; }
        .pinned-app:hover { background: rgba(0,0,0,0.05); }
        .pinned-app img { width: 32px; height: 32px; }
        .pinned-app span { font-size: 12px; color: #333; }
    </style>
</head>
<body>

<div id="desktop">
    <div id="desktop-icons">
        <!-- Icons injected via JS -->
    </div>
    
    <div id="windows-container">
        <!-- Windows injected via JS -->
    </div>

    <!-- Start Menu Mock -->
    <div id="start-menu" class="glass">
        <div class="relative w-full">
            <i class="fa-solid fa-search absolute left-4 top-3 text-gray-500"></i>
            <input type="text" placeholder="Type here to search" class="w-full bg-white/50 border border-gray-300 rounded-full py-2 pl-10 pr-4 outline-none focus:bg-white focus:border-blue-400 transition-all">
        </div>
        <h3 class="text-sm font-semibold text-gray-800 mt-6 px-4">Pinned</h3>
        <div class="pinned-apps" id="start-menu-pinned">
            <!-- Pinned apps injected via JS -->
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar" class="glass-dark">
        <div style="width: 150px;"></div> <!-- Spacer -->
        
        <div id="taskbar-center">
            <div class="taskbar-icon" id="start-button" onclick="toggleStartMenu()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Windows_11_logo.svg" alt="Start">
            </div>
            <!-- App taskbar icons injected via JS -->
        </div>

        <div id="system-tray">
            <div class="tray-item">
                <i class="fa-solid fa-chevron-up text-[10px]"></i>
            </div>
            <div class="tray-item flex-row gap-3 text-sm">
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-volume-high"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
            <div class="tray-item" id="taskbar-clock">
                <div id="time" class="text-[12px]">10:00 AM</div>
                <div id="date" class="text-[12px]">10/24/2023</div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Application Definitions ---
    const APPS = {
        word: {
            id: 'word',
            name: 'Word',
            icon: 'https://upload.wikimedia.org/wikipedia/commons/f/fd/Microsoft_Office_Word_%282019%E2%80%93present%29.svg',
            width: 800,
            height: 600,
            html: `
                <div class="flex flex-col h-full bg-[#f3f2f1]">
                    <div class="bg-[#2b579a] text-white flex items-center px-4 py-2 gap-4 text-sm">
                        <i class="fa-solid fa-file-word text-xl"></i>
                        <span class="font-semibold">Document - Word</span>
                    </div>
                    <div class="editor-toolbar bg-white border-b border-gray-200 flex p-1 text-gray-700 shadow-sm text-sm">
                        <button onclick="document.execCommand('bold',false,null)" title="Bold"><i class="fa-solid fa-bold"></i></button>
                        <button onclick="document.execCommand('italic',false,null)" title="Italic"><i class="fa-solid fa-italic"></i></button>
                        <button onclick="document.execCommand('underline',false,null)" title="Underline"><i class="fa-solid fa-underline"></i></button>
                        <div class="w-px h-6 bg-gray-300 mx-2 my-auto"></div>
                        <button onclick="document.execCommand('justifyLeft',false,null)"><i class="fa-solid fa-align-left"></i></button>
                        <button onclick="document.execCommand('justifyCenter',false,null)"><i class="fa-solid fa-align-center"></i></button>
                        <button onclick="document.execCommand('justifyRight',false,null)"><i class="fa-solid fa-align-right"></i></button>
                        <div class="w-px h-6 bg-gray-300 mx-2 my-auto"></div>
                        <button onclick="document.execCommand('insertUnorderedList',false,null)"><i class="fa-solid fa-list-ul"></i></button>
                        <button onclick="document.execCommand('insertOrderedList',false,null)"><i class="fa-solid fa-list-ol"></i></button>
                    </div>
                    <div class="flex-1 overflow-auto p-8 flex justify-center bg-gray-100">
                        <div contenteditable="true" class="bg-white w-[600px] min-h-[800px] shadow-md p-10 outline-none" style="font-family: Calibri, sans-serif; font-size: 11pt;">
                            <h1 style="font-size: 24pt; margin-bottom: 10px;">Welcome to Word</h1>
                            <p>Start typing your document here...</p>
                        </div>
                    </div>
                </div>
            `
        },
        paint: {
            id: 'paint',
            name: 'Paint',
            icon: 'https://img.icons8.com/color/96/ms-paint.png',
            width: 700,
            height: 500,
            html: `
                <div class="flex flex-col h-full bg-[#f3f4f6]">
                    <div class="bg-white border-b border-gray-200 flex p-2 gap-4 items-center shadow-sm">
                        <div class="flex gap-1" id="paint-colors">
                            <button class="w-6 h-6 rounded-full bg-black border border-gray-300" onclick="setPaintColor('#000000')"></button>
                            <button class="w-6 h-6 rounded-full bg-red-500 border border-gray-300" onclick="setPaintColor('#ef4444')"></button>
                            <button class="w-6 h-6 rounded-full bg-blue-500 border border-gray-300" onclick="setPaintColor('#3b82f6')"></button>
                            <button class="w-6 h-6 rounded-full bg-green-500 border border-gray-300" onclick="setPaintColor('#22c55e')"></button>
                            <button class="w-6 h-6 rounded-full bg-yellow-400 border border-gray-300" onclick="setPaintColor('#facc15')"></button>
                            <button class="w-6 h-6 rounded-full bg-white border border-gray-300" onclick="setPaintColor('#ffffff')"></button>
                        </div>
                        <div class="w-px h-6 bg-gray-300"></div>
                        <div class="flex items-center gap-2">
                            <label class="text-sm text-gray-600"><i class="fa-solid fa-paintbrush"></i> Size</label>
                            <input type="range" id="paint-size" min="1" max="20" value="3" class="w-24">
                        </div>
                        <div class="w-px h-6 bg-gray-300"></div>
                        <button onclick="clearCanvas()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded transition">Clear</button>
                    </div>
                    <div class="flex-1 bg-gray-200 overflow-auto flex justify-center items-center p-4">
                        <canvas id="paint-canvas" width="600" height="400" class="bg-white shadow-sm cursor-crosshair"></canvas>
                    </div>
                </div>
            `,
            onInit: () => {
                const canvas = document.getElementById('paint-canvas');
                const ctx = canvas.getContext('2d');
                let isDrawing = false;
                
                // Set default background to white instead of transparent
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                window.currentPaintColor = '#000000';
                window.setPaintColor = (color) => { window.currentPaintColor = color; };
                window.clearCanvas = () => {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                };

                const startDrawing = (e) => {
                    isDrawing = true;
                    draw(e);
                };
                
                const stopDrawing = () => {
                    isDrawing = false;
                    ctx.beginPath();
                };

                const draw = (e) => {
                    if (!isDrawing) return;
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const size = document.getElementById('paint-size').value;
                    
                    ctx.lineWidth = size;
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = window.currentPaintColor;
                    
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                };

                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);
            }
        },
        calculator: {
            id: 'calculator',
            name: 'Calculator',
            icon: 'https://img.icons8.com/fluency/96/calculator.png',
            width: 320,
            height: 500,
            html: `
                <div class="flex flex-col h-full bg-[#f3f3f3] text-gray-800 p-1">
                    <div class="flex-1 flex flex-col justify-end items-end p-4">
                        <div id="calc-history" class="text-gray-500 text-sm h-6"></div>
                        <div id="calc-display" class="text-5xl font-semibold overflow-hidden">0</div>
                    </div>
                    <div class="grid grid-cols-4 gap-1 h-[65%] p-1">
                        <button onclick="calcPress('C')" class="bg-gray-200 hover:bg-gray-300 rounded text-lg col-span-2">C</button>
                        <button onclick="calcPress('DEL')" class="bg-gray-200 hover:bg-gray-300 rounded text-lg"><i class="fa-solid fa-delete-left"></i></button>
                        <button onclick="calcPress('/')" class="bg-gray-200 hover:bg-gray-300 rounded text-xl">&divide;</button>
                        
                        <button onclick="calcPress('7')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">7</button>
                        <button onclick="calcPress('8')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">8</button>
                        <button onclick="calcPress('9')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">9</button>
                        <button onclick="calcPress('*')" class="bg-gray-200 hover:bg-gray-300 rounded text-xl">&times;</button>
                        
                        <button onclick="calcPress('4')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">4</button>
                        <button onclick="calcPress('5')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">5</button>
                        <button onclick="calcPress('6')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">6</button>
                        <button onclick="calcPress('-')" class="bg-gray-200 hover:bg-gray-300 rounded text-xl">&minus;</button>
                        
                        <button onclick="calcPress('1')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">1</button>
                        <button onclick="calcPress('2')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">2</button>
                        <button onclick="calcPress('3')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">3</button>
                        <button onclick="calcPress('+')" class="bg-gray-200 hover:bg-gray-300 rounded text-xl">+</button>
                        
                        <button onclick="calcPress('±')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">±</button>
                        <button onclick="calcPress('0')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">0</button>
                        <button onclick="calcPress('.')" class="bg-white hover:bg-gray-100 rounded text-xl font-semibold shadow-sm">.</button>
                        <button onclick="calcPress('=')" class="bg-[#005a9e] text-white hover:bg-[#004a82] rounded text-xl shadow-sm">=</button>
                    </div>
                </div>
            `,
            onInit: () => {
                let current = '0';
                let previous = '';
                let operator = null;
                const display = document.getElementById('calc-display');
                const history = document.getElementById('calc-history');

                const updateDisplay = () => {
                    display.innerText = current;
                    history.innerText = previous + (operator ? ' ' + operator : '');
                };

                window.calcPress = (key) => {
                    if (key >= '0' && key <= '9') {
                        if (current === '0') current = key;
                        else current += key;
                    } else if (key === '.') {
                        if (!current.includes('.')) current += '.';
                    } else if (key === 'C') {
                        current = '0'; previous = ''; operator = null;
                    } else if (key === 'DEL') {
                        if (current.length > 1) current = current.slice(0, -1);
                        else current = '0';
                    } else if (key === '±') {
                        current = current.startsWith('-') ? current.slice(1) : '-' + current;
                    } else if (['+', '-', '*', '/'].includes(key)) {
                        if (operator && current !== '0') {
                            window.calcPress('=');
                        }
                        operator = key;
                        previous = current;
                        current = '0';
                    } else if (key === '=') {
                        if (!operator || !previous) return;
                        const prevNum = parseFloat(previous);
                        const currNum = parseFloat(current);
                        let result = 0;
                        switch(operator) {
                            case '+': result = prevNum + currNum; break;
                            case '-': result = prevNum - currNum; break;
                            case '*': result = prevNum * currNum; break;
                            case '/': result = currNum !== 0 ? prevNum / currNum : 'Error'; break;
                        }
                        current = String(result).slice(0, 12); // limit length
                        operator = null;
                        previous = '';
                    }
                    updateDisplay();
                };
            }
        },
        notepad: {
            id: 'notepad',
            name: 'Notepad',
            icon: 'https://img.icons8.com/fluency/96/notepad.png',
            width: 600,
            height: 400,
            html: `

                        <div class="px-3 py-1 hover:bg-gray-100 cursor-pointer">Format</div>

                    </div>
                    <textarea class="flex-1 w-full p-2 resize-none outline-none font-mono text-[14px]" spellcheck="false">This is Windows 11 Notepad.
You can type anything here...</textarea>
                </div>
            `
        },
        explorer: {
            id: 'explorer',
            name: 'File Explorer',
            icon: 'https://img.icons8.com/color/96/windows-explorer.png',
            width: 800,
            height: 500,
            html: `
                <div class="flex flex-col h-full bg-white">
                    <div class="flex items-center gap-2 px-3 py-2 border-b border-gray-200 bg-[#f3f4f6]">
                        <button class="text-gray-500 hover:bg-gray-200 p-1 rounded"><i class="fa-solid fa-arrow-left"></i></button>
                        <button class="text-gray-500 hover:bg-gray-200 p-1 rounded"><i class="fa-solid fa-arrow-right"></i></button>
                        <button class="text-gray-500 hover:bg-gray-200 p-1 rounded"><i class="fa-solid fa-arrow-up"></i></button>
                        <div class="flex-1 border border-gray-300 bg-white rounded flex items-center px-2 py-1 gap-2">
                            <i class="fa-solid fa-desktop text-blue-500"></i>
                            <span class="text-sm text-gray-700">This PC > Documents</span>
                        </div>
                        <div class="w-48 border border-gray-300 bg-white rounded flex items-center px-2 py-1 gap-2">
                            <i class="fa-solid fa-search text-gray-400"></i>
                            <input type="text" placeholder="Search Documents" class="w-full text-sm outline-none">
                        </div>
                    </div>
                    <div class="flex flex-1 overflow-hidden">
                        <div class="w-48 border-r border-gray-200 overflow-y-auto py-2 text-sm text-gray-700 select-none">
                            <div class="px-4 py-1 hover:bg-gray-100 cursor-pointer flex gap-2 items-center"><i class="fa-solid fa-star text-yellow-500"></i> Quick access</div>
                            <div class="px-4 py-1 hover:bg-gray-100 cursor-pointer flex gap-2 items-center ml-4"><i class="fa-solid fa-desktop text-blue-400"></i> Desktop</div>
                            <div class="px-4 py-1 bg-gray-200 cursor-pointer flex gap-2 items-center ml-4"><i class="fa-solid fa-file-lines text-blue-400"></i> Documents</div>
                            <div class="px-4 py-1 hover:bg-gray-100 cursor-pointer flex gap-2 items-center ml-4"><i class="fa-solid fa-download text-blue-400"></i> Downloads</div>
                            <div class="px-4 py-1 hover:bg-gray-100 cursor-pointer flex gap-2 items-center ml-4"><i class="fa-solid fa-image text-blue-400"></i> Pictures</div>
                            <div class="px-4 py-1 hover:bg-gray-100 cursor-pointer flex gap-2 items-center mt-4"><i class="fa-brands fa-windows text-blue-500"></i> This PC</div>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 flex gap-4 content-start flex-wrap bg-white">
                            <!-- Dummy Files -->
                            <div class="flex flex-col items-center gap-1 w-20 p-2 hover:bg-blue-50 rounded cursor-pointer">
                                <i class="fa-solid fa-folder text-4xl text-yellow-400"></i>
                                <span class="text-xs text-center truncate w-full">Work</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 w-20 p-2 hover:bg-blue-50 rounded cursor-pointer">
                                <i class="fa-solid fa-folder text-4xl text-yellow-400"></i>
                                <span class="text-xs text-center truncate w-full">Personal</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 w-20 p-2 hover:bg-blue-50 rounded cursor-pointer">
                                <i class="fa-solid fa-file-word text-4xl text-blue-600"></i>
                                <span class="text-xs text-center truncate w-full">Resume.docx</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 w-20 p-2 hover:bg-blue-50 rounded cursor-pointer">
                                <i class="fa-solid fa-file-excel text-4xl text-green-600"></i>
                                <span class="text-xs text-center truncate w-full">Budget.xlsx</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 w-20 p-2 hover:bg-blue-50 rounded cursor-pointer">
                                <i class="fa-solid fa-file-image text-4xl text-blue-400"></i>
                                <span class="text-xs text-center truncate w-full">Vacation.jpg</span>
                            </div>
                        </div>
                    </div>
                </div>
            `
        },
        chrome: {
            id: 'chrome',
            name: 'Google Chrome',
            icon: 'https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg',
            width: 900,
            height: 600,
            html: `
                <div class="flex flex-col h-full bg-white">
                    <div class="bg-[#dee1e6] flex flex-col">
                        <div class="flex gap-1 px-2 pt-2">
                            <div class="bg-white rounded-t-lg px-3 py-1 text-xs flex items-center gap-2 max-w-[200px] border-b border-white shadow-[0_1px_0_white] z-10">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%28February_2022%29.svg" class="w-3 h-3">
                                <span class="truncate">Wikipedia, the free encyclopedia</span>
                                <i class="fa-solid fa-xmark ml-auto hover:bg-gray-200 rounded-full w-4 h-4 flex items-center justify-center cursor-pointer"></i>
                            </div>
                            <div class="w-6 h-6 flex items-center justify-center hover:bg-black/10 rounded-full text-xs text-gray-600 cursor-pointer mt-1">
                                <i class="fa-solid fa-plus"></i>
                            </div>
                        </div>
                        <div class="bg-white p-1.5 flex items-center gap-2 border-b border-gray-300">
                            <button class="w-7 h-7 rounded-full hover:bg-gray-100 text-gray-500"><i class="fa-solid fa-arrow-left"></i></button>
                            <button class="w-7 h-7 rounded-full hover:bg-gray-100 text-gray-500"><i class="fa-solid fa-arrow-right"></i></button>
                            <button class="w-7 h-7 rounded-full hover:bg-gray-100 text-gray-500"><i class="fa-solid fa-rotate-right"></i></button>
                            <div class="flex-1 bg-[#f1f3f4] rounded-full px-4 py-1 text-sm flex items-center gap-2 focus-within:bg-white focus-within:border-blue-300 focus-within:shadow-md border border-transparent transition-all">
                                <i class="fa-solid fa-lock text-gray-500 text-xs"></i>
                                <input type="text" id="chrome-url" value="https://en.wikipedia.org/wiki/Main_Page" class="bg-transparent outline-none w-full" onkeydown="if(event.key === 'Enter') navChrome()">
                                <i class="fa-regular fa-star text-gray-500 cursor-pointer"></i>
                            </div>
                            <button class="w-7 h-7 rounded-full hover:bg-gray-100 text-gray-500"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                        </div>
                    </div>
                    <div class="flex-1 relative">
                        <iframe id="chrome-frame" src="https://en.wikipedia.org/wiki/Main_Page" class="w-full h-full border-none"></iframe>
                    </div>
                </div>
            `,
            onInit: () => {
                window.navChrome = () => {
                    let url = document.getElementById('chrome-url').value;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) {
                        url = 'https://' + url;
                    }
                    document.getElementById('chrome-frame').src = url;
                    document.getElementById('chrome-url').value = url;
                };
            }
        }
    };

    // --- State Management ---
    let openWindows = [];
    let zIndexCounter = 100;

    // --- Boot Process ---
    function init() {
        renderDesktopIcons();
        renderTaskbarIcons();
        renderStartMenu();
        startClock();
        
        // Close start menu when clicking outside
        document.getElementById('desktop').addEventListener('click', (e) => {
            if (!e.target.closest('#start-menu') && !e.target.closest('#start-button')) {
                document.getElementById('start-menu').classList.remove('active');
            }
        });
    }

    function renderDesktopIcons() {
        const grid = document.getElementById('desktop-icons');
        Object.values(APPS).forEach(app => {
            const icon = document.createElement('div');
            icon.className = 'desktop-icon';
            icon.ondblclick = () => openApp(app.id);
            icon.innerHTML = `
                <img src="${app.icon}" alt="${app.name}">
                <span>${app.name}</span>
            `;
            grid.appendChild(icon);
        });
    }

    function renderTaskbarIcons() {
        const center = document.getElementById('taskbar-center');
        Object.values(APPS).forEach(app => {
            const icon = document.createElement('div');
            icon.className = 'taskbar-icon';
            icon.id = `taskbar-icon-${app.id}`;
            icon.onclick = () => toggleApp(app.id);
            icon.innerHTML = `<img src="${app.icon}" alt="${app.name}">`;
            center.appendChild(icon);
        });
    }

    function renderStartMenu() {
        const pinned = document.getElementById('start-menu-pinned');
        Object.values(APPS).forEach(app => {
            const div = document.createElement('div');
            div.className = 'pinned-app cursor-pointer';
            div.onclick = () => { openApp(app.id); toggleStartMenu(); };
            div.innerHTML = `
                <img src="${app.icon}" alt="${app.name}">
                <span>${app.name}</span>
            `;
            pinned.appendChild(div);
        });
    }

    // --- Window Manager ---
    function openApp(appId) {
        const app = APPS[appId];
        const existingWinIndex = openWindows.findIndex(w => w.id === appId);

        if (existingWinIndex > -1) {
            // Restore if minimized, focus
            const winEl = document.getElementById(`window-${appId}`);
            winEl.classList.remove('minimized');
            focusWindow(appId);
            return;
        }

        // Create new window
        const winId = `window-${appId}`;
        const win = document.createElement('div');
        win.className = 'window';
        win.id = winId;
        
        // Initial positioning (staggered)
        const offset = (openWindows.length % 5) * 30;
        const initialTop = 50 + offset;
        const initialLeft = 100 + offset;

        win.style.width = `${app.width}px`;
        win.style.height = `${app.height}px`;
        win.style.top = `${initialTop}px`;
        win.style.left = `${initialLeft}px`;
        
        win.onmousedown = () => focusWindow(appId);

        win.innerHTML = `
            <div class="title-bar" id="${winId}-header">
                <div class="flex items-center gap-2">
                    <img src="${app.icon}" class="w-4 h-4 ml-1">
                    <span>${app.name}</span>
                </div>
                <div class="window-controls flex">
                    <button onclick="minimizeWindow('${appId}')"><i class="fa-solid fa-minus"></i></button>
                    <button onclick="maximizeWindow('${appId}')"><i class="fa-regular fa-square"></i></button>
                    <button class="close-btn" onclick="closeWindow('${appId}')"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="window-content">
                ${app.html}
            </div>
        `;

        document.getElementById('windows-container').appendChild(win);
        
        openWindows.push({ id: appId, element: win, isMaximized: false, prevRect: null });
        
        // Update taskbar UI
        const taskbarIcon = document.getElementById(`taskbar-icon-${appId}`);
        taskbarIcon.classList.add('open');
        
        focusWindow(appId);
        makeDraggable(win, document.getElementById(`${winId}-header`));

        // Call specific app initialization if exists
        if (app.onInit) {
            setTimeout(app.onInit, 0); // let DOM render first
        }
    }

    function closeWindow(appId) {
        const win = document.getElementById(`window-${appId}`);
        if (win) win.remove();
        
        openWindows = openWindows.filter(w => w.id !== appId);
        
        const taskbarIcon = document.getElementById(`taskbar-icon-${appId}`);
        taskbarIcon.classList.remove('open');
        taskbarIcon.classList.remove('active');
        
        // Focus top most remaining
        if (openWindows.length > 0) {
            const topMost = openWindows.reduce((prev, current) => {
                return (parseInt(current.element.style.zIndex) > parseInt(prev.element.style.zIndex)) ? current : prev;
            });
            focusWindow(topMost.id);
        }
    }

    function minimizeWindow(appId) {
        const win = document.getElementById(`window-${appId}`);
        win.classList.add('minimized');
        document.getElementById(`taskbar-icon-${appId}`).classList.remove('active');
    }

    function maximizeWindow(appId) {
        const winObj = openWindows.find(w => w.id === appId);
        const winEl = winObj.element;

        if (!winObj.isMaximized) {
            // Save previous state
            winObj.prevRect = {
                top: winEl.style.top,
                left: winEl.style.left,
                width: winEl.style.width,
                height: winEl.style.height
            };
            
            // Maximize
            winEl.style.top = '0px';
            winEl.style.left = '0px';
            winEl.style.width = '100vw';
            winEl.style.height = 'calc(100vh - 48px)';
            winEl.style.borderRadius = '0px';
            winObj.isMaximized = true;
        } else {
            // Restore
            winEl.style.top = winObj.prevRect.top;
            winEl.style.left = winObj.prevRect.left;
            winEl.style.width = winObj.prevRect.width;
            winEl.style.height = winObj.prevRect.height;
            winEl.style.borderRadius = '8px';
            winObj.isMaximized = false;
        }
    }

    function focusWindow(appId) {
        zIndexCounter++;
        const winEl = document.getElementById(`window-${appId}`);
        if (winEl) {
            winEl.style.zIndex = zIndexCounter;
            winEl.classList.remove('minimized');
        }
        
        // Update taskbar active state
        document.querySelectorAll('.taskbar-icon').forEach(icon => icon.classList.remove('active'));
        const activeIcon = document.getElementById(`taskbar-icon-${appId}`);
        if (activeIcon) activeIcon.classList.add('active');
    }

    function toggleApp(appId) {
        const winEl = document.getElementById(`window-${appId}`);
        if (winEl) {
            if (winEl.classList.contains('minimized')) {
                focusWindow(appId);
            } else if (winEl.style.zIndex == zIndexCounter) {
                minimizeWindow(appId);
            } else {
                focusWindow(appId);
            }
        } else {
            openApp(appId);
        }
    }

    function toggleStartMenu() {
        document.getElementById('start-menu').classList.toggle('active');
    }

    // --- Drag Logic ---
    function makeDraggable(elmnt, dragHandle) {
        var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        
        dragHandle.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            // Prevent dragging if clicking window controls
            if(e.target.closest('.window-controls')) return;
            
            e = e || window.event;
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            
            // If dragging while maximized, restore down first
            const appId = elmnt.id.replace('window-', '');
            const winObj = openWindows.find(w => w.id === appId);
            if(winObj && winObj.isMaximized) {
                // Approximate restore position based on mouse X
                const ratio = e.clientX / window.innerWidth;
                const newWidth = parseInt(winObj.prevRect.width);
                elmnt.style.left = (e.clientX - (newWidth * ratio)) + "px";
                elmnt.style.top = "0px";
                maximizeWindow(appId); // this restores dimensions
                
                // Update pos3/4 to smooth out the drag
                pos3 = e.clientX;
                pos4 = e.clientY;
                return;
            }

            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            
            // Prevent dragging above top screen edge
            let newTop = elmnt.offsetTop - pos2;
            if (newTop < 0) newTop = 0;

            elmnt.style.top = newTop + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    // --- System Tray ---
    function startClock() {
        const updateClock = () => {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            document.getElementById('time').innerText = `${hours}:${minutes} ${ampm}`;
            
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const year = now.getFullYear();
            document.getElementById('date').innerText = `${month}/${day}/${year}`;
        };
        
        updateClock();
        setInterval(updateClock, 1000);
    }

    // Initialize OS
    window.onload = init;

</script>
</body>
</html>
