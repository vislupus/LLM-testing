<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Desktop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            height: 100vh;
            width: 100vw;
        }

        /* Wallpaper */
        #desktop {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://4kwallpapers.com/images/wallpapers/windows-11-blue-purple-abstract-swirls-3840x2160-5892.jpg') no-repeat center center fixed;
            background-size: cover;
            z-index: 0;
        }
        #desktop::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }
        #desktop.img-fail::before { opacity: 1; }

        /* Desktop Icons */
        .desktop-icons {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 10;
        }
        .desktop-icon {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .desktop-icon:hover {
            background: rgba(255,255,255,0.1);
        }
        .desktop-icon:active {
            background: rgba(255,255,255,0.2);
        }
        .desktop-icon svg {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .desktop-icon span {
            color: white;
            font-size: 12px;
            text-align: center;
            margin-top: 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            word-wrap: break-word;
            width: 100%;
        }

        /* Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(243, 243, 243, 0.85);
            backdrop-filter: blur(20px) saturate(125%);
            -webkit-backdrop-filter: blur(20px) saturate(125%);
            border-top: 1px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 8px;
            padding: 0 20px;
        }
        .taskbar-left {
            position: absolute;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .taskbar-right {
            position: absolute;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .taskbar-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }
        .taskbar-icon:hover {
            background: rgba(0,0,0,0.05);
        }
        .taskbar-icon.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            width: 16px;
            height: 3px;
            background: #0078d4;
            border-radius: 2px;
        }
        .taskbar-icon svg {
            width: 24px;
            height: 24px;
        }

        /* Start Menu */
        #start-menu {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 600px;
            height: 650px;
            background: rgba(243, 243, 243, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            padding: 32px;
        }
        #start-menu.open {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }
        .start-search {
            width: 100%;
            height: 40px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 0 12px;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .start-pinned {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .start-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start-app:hover {
            background: rgba(0,0,0,0.05);
        }
        .start-app svg {
            width: 32px;
            height: 32px;
        }
        .start-app span {
            font-size: 12px;
            color: #333;
            text-align: center;
        }
        .start-recommended {
            flex: 1;
            overflow-y: auto;
        }
        .start-recommended h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }
        .start-user {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
            margin-top: auto;
        }
        .start-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        /* Windows */
        .window {
            position: fixed;
            background: rgba(243, 243, 243, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
            min-width: 400px;
            min-height: 300px;
            resize: both;
        }
        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 48px) !important;
            border-radius: 0;
            resize: none;
        }
        .window.minimized {
            display: none;
        }
        .window-header {
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255,255,255,0.5);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: default;
        }
        .window-title {
            font-size: 12px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .window-title svg {
            width: 16px;
            height: 16px;
        }
        .window-controls {
            display: flex;
            gap: 0;
        }
        .window-btn {
            width: 46px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: background 0.2s;
        }
        .window-btn:hover {
            background: rgba(0,0,0,0.05);
        }
        .window-btn.close:hover {
            background: #e81123;
            color: white;
        }
        .window-content {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        /* Context Menu */
        #context-menu {
            position: fixed;
            background: rgba(243, 243, 243, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            padding: 8px 0;
            z-index: 10000;
            min-width: 200px;
            display: none;
        }
        .context-item {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.1s;
        }
        .context-item:hover {
            background: rgba(0,0,0,0.05);
        }
        .context-separator {
            height: 1px;
            background: rgba(0,0,0,0.1);
            margin: 4px 12px;
        }

        /* App Styles */
        /* Word */
        .word-toolbar {
            display: flex;
            gap: 4px;
            padding: 8px;
            background: #f3f3f3;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }
        .word-toolbar button {
            padding: 4px 8px;
            border: 1px solid transparent;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .word-toolbar button:hover {
            border-color: #c0c0c0;
        }
        .word-editor {
            flex: 1;
            padding: 40px;
            overflow: auto;
            background: #f3f3f3;
        }
        .word-page {
            width: 100%;
            max-width: 816px;
            min-height: 1056px;
            background: white;
            margin: 0 auto;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            outline: none;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Paint */
        .paint-container {
            display: flex;
            height: 100%;
        }
        .paint-toolbar {
            width: 60px;
            background: #f3f3f3;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 8px;
        }
        .paint-tool {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .paint-tool:hover, .paint-tool.active {
            background: rgba(0,0,0,0.05);
            border-color: #0078d4;
        }
        .paint-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px;
            justify-content: center;
        }
        .paint-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .paint-color:hover, .paint-color.active {
            border-color: #333;
            transform: scale(1.1);
        }
        .paint-canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f3f3;
            padding: 20px;
        }
        #paint-canvas {
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            cursor: crosshair;
        }

        /* Calculator */
        .calc-container {
            width: 320px;
            margin: 0 auto;
            background: #f9f9f9;
        }
        .calc-display {
            background: #f9f9f9;
            padding: 20px;
            text-align: right;
            font-size: 48px;
            font-weight: 300;
            color: #333;
            min-height: 80px;
            word-break: break-all;
        }
        .calc-history {
            font-size: 14px;
            color: #666;
            min-height: 20px;
            margin-bottom: 4px;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #e0e0e0;
        }
        .calc-btn {
            border: none;
            padding: 16px;
            font-size: 18px;
            cursor: pointer;
            background: white;
            transition: background 0.1s;
        }
        .calc-btn:hover {
            background: #f0f0f0;
        }
        .calc-btn:active {
            background: #e0e0e0;
        }
        .calc-btn.op { background: #f9f9f9; }
        .calc-btn.equals { background: #0078d4; color: white; }
        .calc-btn.equals:hover { background: #006cbd; }

        /* Notepad */
        .notepad-textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            line-height: 1.4;
        }
        .notepad-menu {
            display: flex;
            gap: 16px;
            padding: 4px 12px;
            background: #f3f3f3;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }
        .notepad-menu span {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 2px;
        }
        .notepad-menu span:hover {
            background: rgba(0,0,0,0.05);
        }

        /* File Explorer */
        .explorer-toolbar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #f3f3f3;
            border-bottom: 1px solid #e0e0e0;
            align-items: center;
        }
        .explorer-nav {
            display: flex;
            gap: 4px;
        }
        .explorer-nav button {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .explorer-nav button:hover {
            background: rgba(0,0,0,0.05);
        }
        .explorer-path {
            flex: 1;
            height: 32px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #333;
        }
        .explorer-content {
            display: flex;
            height: calc(100% - 49px);
        }
        .explorer-sidebar {
            width: 200px;
            background: #f3f3f3;
            border-right: 1px solid #e0e0e0;
            padding: 8px 0;
            overflow-y: auto;
        }
        .explorer-sidebar-item {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
        }
        .explorer-sidebar-item:hover {
            background: rgba(0,0,0,0.05);
        }
        .explorer-main {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
            align-content: start;
        }
        .explorer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .explorer-item:hover {
            background: rgba(0,0,0,0.05);
        }
        .explorer-item svg {
            width: 48px;
            height: 48px;
        }
        .explorer-item span {
            font-size: 12px;
            color: #333;
            word-break: break-word;
        }

        /* Chrome */
        .chrome-toolbar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #f3f3f3;
            border-bottom: 1px solid #e0e0e0;
            align-items: center;
        }
        .chrome-nav {
            display: flex;
            gap: 4px;
        }
        .chrome-nav button {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chrome-nav button:hover {
            background: rgba(0,0,0,0.05);
        }
        .chrome-address {
            flex: 1;
            height: 32px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #333;
            outline: none;
        }
        .chrome-content {
            flex: 1;
            background: white;
        }
        .chrome-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .chrome-newtab {
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            height: 100%;
        }
        .chrome-logo {
            font-size: 72px;
            margin-bottom: 20px;
        }
        .chrome-search {
            width: 100%;
            max-width: 560px;
            height: 44px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 20px;
            font-size: 16px;
            outline: none;
            margin: 20px auto;
            display: block;
        }
        .chrome-search:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
        }

        /* Clock */
        #clock {
            font-size: 12px;
            color: #333;
            text-align: center;
            line-height: 1.3;
            cursor: default;
        }

        /* Selection box */
        .selection-box {
            position: fixed;
            border: 1px solid rgba(0,120,212,0.5);
            background: rgba(0,120,212,0.1);
            pointer-events: none;
            z-index: 5;
            display: none;
        }
    </style>
</head>
<body>
    <div id="desktop"></div>
    <div class="selection-box" id="selection-box"></div>

    <!-- Desktop Icons -->
    <div class="desktop-icons" id="desktop-icons">
        <div class="desktop-icon" data-app="word">
            <svg viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="4" fill="#2b579a"/><text x="24" y="32" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial">W</text></svg>
            <span>Word</span>
        </div>
        <div class="desktop-icon" data-app="paint">
            <svg viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="4" fill="#f2f2f2"/><path d="M12 32 L20 20 L28 28 L36 12" stroke="#333" stroke-width="3" fill="none"/><circle cx="36" cy="12" r="3" fill="#e74c3c"/><circle cx="28" cy="28" r="3" fill="#f39c12"/><circle cx="20" cy="20" r="3" fill="#27ae60"/><circle cx="12" cy="32" r="3" fill="#3498db"/></svg>
            <span>Paint</span>
        </div>
        <div class="desktop-icon" data-app="calculator">
            <svg viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="4" fill="#f2f2f2"/><rect x="10" y="10" width="28" height="10" rx="2" fill="#e0e0e0"/><text x="24" y="18" text-anchor="middle" fill="#333" font-size="8" font-family="Arial">123</text><rect x="10" y="24" width="8" height="6" rx="1" fill="#e0e0e0"/><rect x="20" y="24" width="8" height="6" rx="1" fill="#e0e0e0"/><rect x="30" y="24" width="8" height="6" rx="1" fill="#e0e0e0"/><rect x="10" y="32" width="8" height="6" rx="1" fill="#e0e0e0"/><rect x="20" y="32" width="8" height="6" rx="1" fill="#e0e0e0"/><rect x="30" y="32" width="8" height="6" rx="1" fill="#0078d4"/></svg>
            <span>Calculator</span>
        </div>
        <div class="desktop-icon" data-app="notepad">
            <svg viewBox="0 0 48 48"><rect x="8" y="4" width="32" height="40" rx="2" fill="#f2f2f2"/><rect x="12" y="8" width="24" height="32" fill="white"/><line x1="16" y1="14" x2="32" y2="14" stroke="#ccc" stroke-width="1"/><line x1="16" y1="20" x2="32" y2="20" stroke="#ccc" stroke-width="1"/><line x1="16" y1="26" x2="32" y2="26" stroke="#ccc" stroke-width="1"/><line x1="16" y1="32" x2="28" y2="32" stroke="#ccc" stroke-width="1"/></svg>
            <span>Notepad</span>
        </div>
        <div class="desktop-icon" data-app="explorer">
            <svg viewBox="0 0 48 48"><rect x="4" y="12" width="40" height="28" rx="2" fill="#f8d775"/><rect x="4" y="8" width="20" height="12" rx="2" fill="#f8d775"/><rect x="6" y="10" width="16" height="8" rx="1" fill="#fceba8"/></svg>
            <span>File Explorer</span>
        </div>
        <div class="desktop-icon" data-app="chrome">
            <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#4285f4"/><circle cx="24" cy="24" r="8" fill="white"/><path d="M24 4 A20 20 0 0 1 44 24 L24 24 Z" fill="#ea4335"/><path d="M44 24 A20 20 0 0 1 24 44 L24 24 Z" fill="#34a853"/><path d="M24 44 A20 20 0 0 1 4 24 L24 24 Z" fill="#fbbc05"/></svg>
            <span>Chrome</span>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu">
        <div class="context-item" onclick="location.reload()">🔄 Refresh</div>
        <div class="context-separator"></div>
        <div class="context-item" onclick="createWindow('notepad')">📝 New Text Document</div>
        <div class="context-separator"></div>
        <div class="context-item">🎨 Personalize</div>
        <div class="context-item">⚙️ Display settings</div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <input type="text" class="start-search" placeholder="Type here to search" id="start-search">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 style="font-size:14px; font-weight:600;">Pinned</h3>
            <span style="font-size:12px; color:#0078d4; cursor:pointer;">All apps ></span>
        </div>
        <div class="start-pinned">
            <div class="start-app" onclick="createWindow('word')">
                <svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="3" fill="#2b579a"/><text x="16" y="22" text-anchor="middle" fill="white" font-size="14" font-weight="bold">W</text></svg>
                <span>Word</span>
            </div>
            <div class="start-app" onclick="createWindow('paint')">
                <svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="3" fill="#f2f2f2"/><path d="M8 22 L14 14 L20 20 L26 8" stroke="#333" stroke-width="2" fill="none"/></svg>
                <span>Paint</span>
            </div>
            <div class="start-app" onclick="createWindow('calculator')">
                <svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="3" fill="#f2f2f2"/><rect x="6" y="6" width="20" height="8" rx="1" fill="#e0e0e0"/><text x="16" y="12" text-anchor="middle" fill="#333" font-size="6">123</text></svg>
                <span>Calculator</span>

            </div>

                <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="#333"/><path d="M16.5 12c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z" fill="#333"/></svg>

    <!-- Windows Container -->

    <script>
        // Global state
        let zIndex = 200;
        let activeWindow = null;
        let windowCount = 0;
        const windows = {};
        const taskbarApps = document.getElementById('taskbar-apps');

        // Check wallpaper load
        const desktop = document.getElementById('desktop');
        const img = new Image();
        img.src = getComputedStyle(desktop).backgroundImage.slice(5, -2);
        img.onerror = () => desktop.classList.add('img-fail');

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
            document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', {month:'numeric', day:'numeric', year:'numeric'});
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Start Menu
        const startBtn = document.getElementById('start-btn');
        const startMenu = document.getElementById('start-menu');
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!startMenu.contains(e.target) && e.target !== startBtn) {
                startMenu.classList.remove('open');
            }
        });

        // Context Menu
        const contextMenu = document.getElementById('context-menu');
        desktop.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            contextMenu.style.display = 'block';
            contextMenu.style.left = e.clientX + 'px';
            contextMenu.style.top = e.clientY + 'px';
        });
        document.addEventListener('click', () => contextMenu.style.display = 'none');

        // Desktop icons
        document.querySelectorAll('.desktop-icon').forEach(icon => {
            icon.addEventListener('dblclick', () => {
                createWindow(icon.dataset.app);
            });
        });

        // Create Window
        function createWindow(appType) {
            windowCount++;
            const id = 'win-' + windowCount;
            const win = document.createElement('div');
            win.className = 'window';
            win.id = id;
            win.style.left = (100 + windowCount * 30) + 'px';
            win.style.top = (50 + windowCount * 30) + 'px';
            win.style.width = '900px';
            win.style.height = '600px';
            win.style.zIndex = ++zIndex;

            const configs = {
                word: { title: 'Document1 - Word', icon: '<rect x="2" y="2" width="28" height="28" rx="3" fill="#2b579a"/><text x="16" y="22" text-anchor="middle" fill="white" font-size="14" font-weight="bold">W</text>', content: getWordContent() },
                paint: { title: 'Untitled - Paint', icon: '<rect x="2" y="2" width="28" height="28" rx="3" fill="#f2f2f2"/><path d="M8 22 L14 14 L20 20 L26 8" stroke="#333" stroke-width="2" fill="none"/>', content: getPaintContent() },
                calculator: { title: 'Calculator', icon: '<rect x="2" y="2" width="28" height="28" rx="3" fill="#f2f2f2"/><rect x="6" y="6" width="20" height="8" rx="1" fill="#e0e0e0"/>', content: getCalcContent() },
                notepad: { title: 'Untitled - Notepad', icon: '<rect x="6" y="2" width="20" height="28" rx="2" fill="#f2f2f2"/>', content: getNotepadContent() },
                explorer: { title: 'This PC', icon: '<rect x="2" y="8" width="28" height="20" rx="2" fill="#f8d775"/>', content: getExplorerContent() },
                chrome: { title: 'New Tab - Chrome', icon: '<circle cx="16" cy="16" r="14" fill="#4285f4"/><circle cx="16" cy="16" r="5" fill="white"/>', content: getChromeContent() }
            };

            const config = configs[appType];
            win.innerHTML = `
                <div class="window-header">
                    <div class="window-title">
                        <svg width="16" height="16" viewBox="0 0 32 32">${config.icon}</svg>
                        ${config.title}
                    </div>
                    <div class="window-controls">
                        <button class="window-btn minimize">─</button>
                        <button class="window-btn maximize">□</button>
                        <button class="window-btn close">✕</button>
                    </div>
                </div>
                <div class="window-content">${config.content}</div>
            `;

            document.getElementById('windows-container').appendChild(win);
            windows[id] = { element: win, appType, minimized: false };

            // Taskbar item
            const taskItem = document.createElement('div');
            taskItem.className = 'taskbar-icon active';
            taskItem.dataset.win = id;
            taskItem.innerHTML = `<svg width="24" height="24" viewBox="0 0 32 32">${config.icon}</svg>`;
            taskbarApps.appendChild(taskItem);

            taskItem.addEventListener('click', () => {
                if (windows[id].minimized) {
                    win.classList.remove('minimized');
                    windows[id].minimized = false;
                    taskItem.classList.add('active');
                    focusWindow(id);
                } else if (activeWindow === id) {
                    win.classList.add('minimized');
                    windows[id].minimized = true;
                    taskItem.classList.remove('active');
                } else {
                    focusWindow(id);
                }
            });

            // Window controls
            win.querySelector('.close').addEventListener('click', () => closeWindow(id));
            win.querySelector('.minimize').addEventListener('click', () => {
                win.classList.add('minimized');
                windows[id].minimized = true;
                taskItem.classList.remove('active');
            });
            win.querySelector('.maximize').addEventListener('click', () => {
                win.classList.toggle('maximized');
            });

            // Dragging
            const header = win.querySelector('.window-header');
            let isDragging = false, startX, startY, startLeft, startTop;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.window-controls')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = win.offsetLeft;
                startTop = win.offsetTop;
                win.classList.remove('maximized');
                focusWindow(id);
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                win.style.left = (startLeft + e.clientX - startX) + 'px';
                win.style.top = (startTop + e.clientY - startY) + 'px';
            });
            document.addEventListener('mouseup', () => isDragging = false);

            win.addEventListener('mousedown', () => focusWindow(id));

            // App-specific init
            if (appType === 'paint') initPaint(win);
            if (appType === 'calculator') initCalc(win);
            if (appType === 'notepad') initNotepad(win);
            if (appType === 'explorer') initExplorer(win);
            if (appType === 'chrome') initChrome(win);
            if (appType === 'word') initWord(win);

            focusWindow(id);
            return id;
        }

        function focusWindow(id) {
            const win = windows[id].element;
            win.style.zIndex = ++zIndex;
            activeWindow = id;
            document.querySelectorAll('.taskbar-icon[data-win]').forEach(t => t.classList.remove('active'));
            const taskItem = document.querySelector(`.taskbar-icon[data-win="${id}"]`);
            if (taskItem) taskItem.classList.add('active');
        }

        function closeWindow(id) {
            windows[id].element.remove();
            delete windows[id];
            const taskItem = document.querySelector(`.taskbar-icon[data-win="${id}"]`);
            if (taskItem) taskItem.remove();
        }

        // App Content Generators
        function getWordContent() {
            return `

        }

        function getPaintContent() {
            return `
                <div class="paint-container">
                    <div class="paint-toolbar">
                        <div class="paint-tool active" data-tool="brush" title="Brush">✏️</div>
                        <div class="paint-tool" data-tool="eraser" title="Eraser">🧼</div>
                        <div class="paint-tool" data-tool="line" title="Line">📏</div>
                        <div class="paint-tool" data-tool="rect" title="Rectangle">⬜</div>
                        <div class="paint-tool" data-tool="circle" title="Circle">⭕</div>
                        <div style="border-top:1px solid #ccc; width:100%; margin:4px 0;"></div>
                        <div class="paint-colors">
                            <div class="paint-color active" style="background:black;" data-color="#000000"></div>
                            <div class="paint-color" style="background:red;" data-color="#ff0000"></div>
                            <div class="paint-color" style="background:blue;" data-color="#0000ff"></div>
                            <div class="paint-color" style="background:green;" data-color="#00ff00"></div>
                            <div class="paint-color" style="background:yellow;" data-color="#ffff00"></div>
                            <div class="paint-color" style="background:purple;" data-color="#800080"></div>
                            <div class="paint-color" style="background:orange;" data-color="#ffa500"></div>
                            <div class="paint-color" style="background:white; border:1px solid #ccc;" data-color="#ffffff"></div>
                        </div>
                        <div style="border-top:1px solid #ccc; width:100%; margin:4px 0;"></div>
                        <div class="paint-tool" onclick="clearPaint()" title="Clear">🗑️</div>
                        <div class="paint-tool" onclick="savePaint()" title="Save">💾</div>
                        <input type="range" min="1" max="20" value="3" id="brush-size" style="width:40px;" title="Size">
                    </div>
                    <div class="paint-canvas-container">
                        <canvas id="paint-canvas" width="800" height="600"></canvas>

            `;
        }

        function getCalcContent() {
            return `
                <div class="calc-container">
                    <div class="calc-display">
                        <div class="calc-history" id="calc-history"></div>
                        <div id="calc-display">0</div>
                    </div>
                    <div class="calc-buttons">
                        <button class="calc-btn op" onclick="calcClear()">C</button>

                        <button class="calc-btn op" onclick="calcOp('*')">×</button>

                        <button class="calc-btn" onclick="calcNum('.')">.</button>

        }

        function getNotepadContent() {
            return `
                <div style="display:flex; flex-direction:column; height:100%;">
                    <div class="notepad-menu">
                        <span onclick="notepadNew()">File</span>
                        <span onclick="notepadOpen()">Open</span>
                        <span onclick="notepadSave()">Save</span>
                        <span onclick="notepadFind()">Edit</span>
                        <span>Format</span>
                        <span>View</span>
                        <span>Help</span>
                    </div>
                    <textarea class="notepad-textarea" id="notepad-area-${windowCount}" placeholder="Type here..."></textarea>

        }

        function getExplorerContent() {
            return `
                <div style="height:100%; display:flex; flex-direction:column;">
                    <div class="explorer-toolbar">

                    </div>
                    <div class="explorer-content">
                        <div class="explorer-sidebar">
                            <div class="explorer-sidebar-item" onclick="navTo('home')">🏠 Home</div>

        function getChromeContent() {
            return `
                <div style="display:flex; flex-direction:column; height:100%;">
                    <div class="chrome-toolbar">
                        <div class="chrome-nav">
                            <button onclick="chromeBack()">◀</button>
                            <button onclick="chromeForward()">▶</button>
                            <button onclick="chromeRefresh()">↻</button>
                        </div>
                        <input type="text" class="chrome-address" id="chrome-address-${windowCount}" placeholder="Search or enter address" value="">
                        <button onclick="chromeGo()">➤</button>
                    </div>
                    <div class="chrome-content" id="chrome-content-${windowCount}">
                        <div class="chrome-newtab">
                            <div class="chrome-logo">🌐</div>
                            <input type="text" class="chrome-search" placeholder="Search Google or type a URL" onkeydown="if(event.key==='Enter')chromeSearch(this.value)">
                            <div style="display:flex; gap:20px; justify-content:center; margin-top:20px;">
                                <div style="text-align:center; cursor:pointer;" onclick="chromeGoTo('https://www.google.com')"><div style="font-size:32px;">🔍</div><div style="font-size:12px; margin-top:4px;">Google</div></div>
                                <div style="text-align:center; cursor:pointer;" onclick="chromeGoTo('https://www.youtube.com')"><div style="font-size:32px;">▶️</div><div style="font-size:12px; margin-top:4px;">YouTube</div></div>
                                <div style="text-align:center; cursor:pointer;" onclick="chromeGoTo('https://www.github.com')"><div style="font-size:32px;">🐙</div><div style="font-size:12px; margin-top:4px;">GitHub</div></div>
                                <div style="text-align:center; cursor:pointer;" onclick="chromeGoTo('https://www.wikipedia.org')"><div style="font-size:32px;">📚</div><div style="font-size:12px; margin-top:4px;">Wikipedia</div></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Word functions
        function initWord(win) {
            // Already functional via contenteditable
        }
        function formatDoc(cmd, value = null) {
            document.execCommand(cmd, false, value);
        }

        // Paint functions
        let paintCtx, paintCanvas, paintTool = 'brush', paintColor = '#000000', paintSize = 3;
        let painting = false, startX, startY;

        function initPaint(win) {
            paintCanvas = win.querySelector('#paint-canvas');
            paintCtx = paintCanvas.getContext('2d');
            paintCtx.fillStyle = 'white';
            paintCtx.fillRect(0, 0, paintCanvas.width, paintCanvas.height);
            paintCtx.lineCap = 'round';
            paintCtx.lineJoin = 'round';

            win.querySelectorAll('.paint-tool[data-tool]').forEach(t => {
                t.addEventListener('click', () => {
                    win.querySelectorAll('.paint-tool[data-tool]').forEach(x => x.classList.remove('active'));
                    t.classList.add('active');
                    paintTool = t.dataset.tool;
                });
            });
            win.querySelectorAll('.paint-color').forEach(c => {
                c.addEventListener('click', () => {
                    win.querySelectorAll('.paint-color').forEach(x => x.classList.remove('active'));
                    c.classList.add('active');
                    paintColor = c.dataset.color;
                });
            });
            win.querySelector('#brush-size').addEventListener('input', (e) => paintSize = e.target.value);

            const getPos = (e) => {
                const rect = paintCanvas.getBoundingClientRect();
                return { x: (e.clientX - rect.left) * (paintCanvas.width / rect.width), y: (e.clientY - rect.top) * (paintCanvas.height / rect.height) };
            };

            paintCanvas.addEventListener('mousedown', (e) => {
                painting = true;
                const pos = getPos(e);
                startX = pos.x; startY = pos.y;
                if (paintTool === 'brush' || paintTool === 'eraser') {
                    paintCtx.beginPath();
                    paintCtx.moveTo(pos.x, pos.y);
                }
            });
            paintCanvas.addEventListener('mousemove', (e) => {
                if (!painting) return;
                const pos = getPos(e);
                paintCtx.lineWidth = paintSize;
                if (paintTool === 'brush') {
                    paintCtx.globalCompositeOperation = 'source-over';
                    paintCtx.strokeStyle = paintColor;
                    paintCtx.lineTo(pos.x, pos.y);
                    paintCtx.stroke();
                } else if (paintTool === 'eraser') {
                    paintCtx.globalCompositeOperation = 'destination-out';
                    paintCtx.lineTo(pos.x, pos.y);
                    paintCtx.stroke();
                }
            });
            paintCanvas.addEventListener('mouseup', (e) => {
                if (!painting) return;
                painting = false;
                const pos = getPos(e);
                paintCtx.globalCompositeOperation = 'source-over';
                paintCtx.lineWidth = paintSize;
                paintCtx.strokeStyle = paintColor;
                if (paintTool === 'line') {
                    paintCtx.beginPath();
                    paintCtx.moveTo(startX, startY);
                    paintCtx.lineTo(pos.x, pos.y);
                    paintCtx.stroke();
                } else if (paintTool === 'rect') {
                    paintCtx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
                } else if (paintTool === 'circle') {
                    paintCtx.beginPath();
                    const r = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                    paintCtx.arc(startX, startY, r, 0, Math.PI * 2);
                    paintCtx.stroke();
                }
            });
            paintCanvas.addEventListener('mouseleave', () => painting = false);
        }
        function clearPaint() {
            if (paintCtx) {
                paintCtx.fillStyle = 'white';
                paintCtx.fillRect(0, 0, paintCanvas.width, paintCanvas.height);
            }
        }
        function savePaint() {
            if (paintCanvas) {
                const link = document.createElement('a');
                link.download = 'paint-drawing.png';
                link.href = paintCanvas.toDataURL();
                link.click();
            }
        }

        // Calculator functions
        let calcValue = '0', calcPrev = null, calcOp = null, calcReset = false;
        function initCalc(win) {}
        function calcNum(n) {
            if (calcReset) { calcValue = ''; calcReset = false; }
            if (calcValue === '0' && n !== '.') calcValue = '';
            if (n === '.' && calcValue.includes('.')) return;
            calcValue += n;
            updateCalc();
        }
        function calcOp(op) {
            if (calcPrev !== null) calcEquals();
            calcPrev = parseFloat(calcValue);
            calcOp = op;
            calcReset = true;
            document.getElementById('calc-history').textContent = calcPrev + ' ' + op;
        }
        function calcEquals() {
            if (calcPrev === null || !calcOp) return;
            const curr = parseFloat(calcValue);
            let result;
            switch(calcOp) {
                case '+': result = calcPrev + curr; break;
                case '-': result = calcPrev - curr; break;
                case '*': result = calcPrev * curr; break;
                case '/': result = calcPrev / curr; break;
            }
            calcValue = String(result);
            calcPrev = null;
            calcOp = null;
            document.getElementById('calc-history').textContent = '';
            updateCalc();
        }
        function calcClear() {
            calcValue = '0';
            calcPrev = null;
            calcOp = null;
            document.getElementById('calc-history').textContent = '';
            updateCalc();
        }
        function calcDelete() {
            calcValue = calcValue.slice(0, -1) || '0';
            updateCalc();
        }
        function updateCalc() {
            const disp = document.getElementById('calc-display');
            if (disp) disp.textContent = calcValue;
        }

        // Notepad functions
        function initNotepad(win) {}
        function notepadNew() {
            document.querySelectorAll('.notepad-textarea').forEach(t => t.value = '');
        }
        function notepadOpen() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        document.querySelectorAll('.notepad-textarea').forEach(t => t.value = ev.target.result);
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }
        function notepadSave() {
            const text = document.querySelector('.notepad-textarea')?.value || '';
            const blob = new Blob([text], {type: 'text/plain'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'document.txt';
            link.click();
        }
        function notepadFind() {
            const term = prompt('Find what:');
            if (term) {
                const ta = document.querySelector('.notepad-textarea');
                const idx = ta.value.indexOf(term);
                if (idx !== -1) {
                    ta.focus();
                    ta.setSelectionRange(idx, idx + term.length);
                }
            }
        }

        // Explorer functions
        const explorerData = {
            pc: [
                { name: 'Desktop', type: 'folder', icon: '🖥️' },
                { name: 'Documents', type: 'folder', icon: '📄' },
                { name: 'Downloads', type: 'folder', icon: '⬇️' },
                { name: 'Pictures', type: 'folder', icon: '🖼️' },
                { name: 'Music', type: 'folder', icon: '🎵' },
                { name: 'Videos', type: 'folder', icon: '🎬' },
                { name: 'Local Disk (C:)', type: 'drive', icon: '🖴' },
                { name: 'Local Disk (D:)', type: 'drive', icon: '🖴' }
            ],
            docs: [
                { name: 'Resume.docx', type: 'file', icon: '📄' },
                { name: 'Budget.xlsx', type: 'file', icon: '📊' },
                { name: 'Notes.txt', type: 'file', icon: '📝' },
                { name: 'Project', type: 'folder', icon: '📁' }
            ],
            desktop: [
                { name: 'Word', type: 'app', icon: '📝' },
                { name: 'Paint', type: 'app', icon: '🎨' },
                { name: 'Chrome', type: 'app', icon: '🌐' },
                { name: 'notes.txt', type: 'file', icon: '📝' }
            ],
            downloads: [
                { name: 'installer.exe', type: 'file', icon: '⚙️' },
                { name: 'image.png', type: 'file', icon: '🖼️' },
                { name: 'archive.zip', type: 'file', icon: '📦' }
            ],
            pics: [
                { name: 'Vacation', type: 'folder', icon: '📁' },
                { name: 'wallpaper.jpg', type: 'file', icon: '🖼️' },
                { name: 'screenshot.png', type: 'file', icon: '🖼️' }
            ],
            music: [
                { name: 'Playlist1', type: 'folder', icon: '📁' },
                { name: 'song1.mp3', type: 'file', icon: '🎵' },
                { name: 'song2.mp3', type: 'file', icon: '🎵' }
            ],
            videos: [
                { name: 'movie.mp4', type: 'file', icon: '🎬' },
                { name: 'clip.mkv', type: 'file', icon: '🎬' }
            ],
            c: [
                { name: 'Program Files', type: 'folder', icon: '📁' },
                { name: 'Windows', type: 'folder', icon: '📁' },
                { name: 'Users', type: 'folder', icon: '📁' },
                { name: 'temp.log', type: 'file', icon: '📝' }
            ],
            d: [
                { name: 'Games', type: 'folder', icon: '📁' },
                { name: 'Backup', type: 'folder', icon: '📁' },
                { name: 'data.db', type: 'file', icon: '🗄️' }
            ],
            home: [
                { name: 'Recent Files', type: 'folder', icon: '📁' },
                { name: 'Favorites', type: 'folder', icon: '⭐' }
            ]
        };
        let currentExplorer = 'pc';
        let explorerHistory = ['pc'];

        function initExplorer(win) {
            const wc = win.id.split('-')[1];
            renderExplorer('pc', wc);
        }
        function renderExplorer(path, wc) {
            const main = document.getElementById('explorer-main-' + wc);
            const pathBar = document.getElementById('explorer-path-' + wc);
            if (!main) return;
            main.innerHTML = '';
            const items = explorerData[path] || [];
            pathBar.textContent = path === 'pc' ? 'This PC' : path.charAt(0).toUpperCase() + path.slice(1);
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'explorer-item';
                div.innerHTML = `<div style="font-size:48px;">${item.icon}</div><span>${item.name}</span>`;
                div.addEventListener('dblclick', () => {
                    if (item.type === 'folder' || item.type === 'drive') {
                        const next = item.name.toLowerCase().replace(/[^a-z]/g, '');
                        if (explorerData[next]) {
                            explorerHistory.push(next);
                            renderExplorer(next, wc);
                        }
                    }
                });
                main.appendChild(div);
            });
        }
        function navTo(path) {
            const active = document.querySelector('.window[style*="z-index: ' + zIndex + '"]');
            if (active) {
                const wc = active.id.split('-')[1];
                explorerHistory.push(path);
                renderExplorer(path, wc);
            }
        }
        function navBack() {
            if (explorerHistory.length > 1) {
                explorerHistory.pop();
                const active = document.querySelector('.window[style*="z-index: ' + zIndex + '"]');
                if (active) renderExplorer(explorerHistory[explorerHistory.length - 1], active.id.split('-')[1]);
            }
        }
        function navUp() {
            navBack();
        }

        // Chrome functions
        let chromeHistory = [], chromeIndex = -1;
        function initChrome(win) {
            const addr = win.querySelector('.chrome-address');
            addr.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') chromeGo();
            });
        }
        function chromeGo() {
            const active = document.querySelector('.window[style*="z-index: ' + zIndex + '"]');
            if (!active) return;
            const wc = active.id.split('-')[1];
            const addr = document.getElementById('chrome-address-' + wc);
            const content = document.getElementById('chrome-content-' + wc);
            let url = addr.value.trim();
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            addr.value = url;
            content.innerHTML = `<iframe class="chrome-iframe" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
            active.querySelector('.window-title').textContent = url + ' - Chrome';
        }
        function chromeGoTo(url) {
            const active = document.querySelector('.window[style*="z-index: ' + zIndex + '"]');
            if (!active) return;
            const wc = active.id.split('-')[1];
            const addr = document.getElementById('chrome-address-' + wc);
            addr.value = url;
            chromeGo();
        }
        function chromeSearch(query) {
            const active = document.querySelector('.window[style*="z-index: ' + zIndex + '"]');
            if (!active) return;
            const wc = active.id.split('-')[1];
            const addr = document.getElementById('chrome-address-' + wc);
            addr.value = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            chromeGo();
        }
        function chromeBack() { /* Simplified */ }
        function chromeForward() { /* Simplified */ }
        function chromeRefresh() { chromeGo(); }

        // Selection box
        let selectBox = document.getElementById('selection-box');
        let selectStart = null;
        desktop.addEventListener('mousedown', (e) => {
            if (e.target !== desktop) return;
            selectStart = { x: e.clientX, y: e.clientY };
            selectBox.style.display = 'block';
            selectBox.style.left = e.clientX + 'px';
            selectBox.style.top = e.clientY + 'px';
            selectBox.style.width = '0px';
            selectBox.style.height = '0px';
        });
        document.addEventListener('mousemove', (e) => {
            if (!selectStart) return;
            const x = Math.min(selectStart.x, e.clientX);
            const y = Math.min(selectStart.y, e.clientY);
            const w = Math.abs(e.clientX - selectStart.x);
            const h = Math.abs(e.clientY - selectStart.y);
            selectBox.style.left = x + 'px';
            selectBox.style.top = y + 'px';
            selectBox.style.width = w + 'px';
            selectBox.style.height = h + 'px';
        });
        document.addEventListener('mouseup', () => {
            selectStart = null;
            selectBox.style.display = 'none';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Meta' || e.key === 'Command') {
                startMenu.classList.toggle('open');
            }
        });
    </script>
</body>
