<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Desktop 11 — Standalone Web OS</title>
<style>
:root{
  --glass:rgba(255,255,255,.64);
  --glass2:rgba(245,249,255,.82);
  --line:rgba(255,255,255,.42);
  --shadow:0 24px 80px rgba(16,34,64,.32);
  --blue:#2563eb;
  --dark:#101827;
  --taskbar:rgba(246,249,255,.78);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;color:#111827}
body{background:#0d1730}
#desktop{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:
    radial-gradient(ellipse at 62% 44%, rgba(255,255,255,.86) 0 4%, transparent 17%),
    radial-gradient(ellipse at 58% 50%, rgba(143,207,255,.95) 0 9%, rgba(54,134,255,.72) 22%, transparent 40%),
    radial-gradient(ellipse at 47% 50%, rgba(35,78,205,.86) 0 8%, rgba(27,58,173,.74) 24%, transparent 43%),
    radial-gradient(ellipse at 48% 39%, rgba(150,231,255,.76) 0 11%, transparent 33%),
    radial-gradient(ellipse at 50% 64%, rgba(115,78,226,.65) 0 12%, transparent 36%),
    linear-gradient(135deg,#0b1d4d,#358cff 48%,#a8d9ff);
  background-size:cover;
}
/* A standalone, CSS/SVG recreation inspired by the Windows 11 bloom wallpaper. */
#desktop:before{
  content:"";position:absolute;inset:-10%;
  background:
    conic-gradient(from 210deg at 52% 50%, transparent 0 15%, rgba(255,255,255,.46), transparent 38%, rgba(64,123,255,.72), transparent 70%, rgba(168,239,255,.38), transparent),
    radial-gradient(ellipse at 50% 50%, transparent 0 20%, rgba(15,32,90,.28) 62%, rgba(2,6,23,.32));
  filter:blur(18px) saturate(125%);
  opacity:.9;
}
#desktop:after{
  content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.05));pointer-events:none
}
.desktop-icons{position:absolute;left:20px;top:18px;display:grid;gap:14px;z-index:2}
.desktop-icon{
  width:92px;min-height:82px;border-radius:12px;padding:8px 6px;display:grid;justify-items:center;gap:6px;
  color:white;text-shadow:0 1px 4px rgba(0,0,0,.55);font-size:12px;text-align:center;cursor:default;user-select:none;
}
.desktop-icon:hover,.desktop-icon.selected{background:rgba(255,255,255,.18);outline:1px solid rgba(255,255,255,.24)}
.icon-img{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.22)}
.icon-img svg{width:32px;height:32px;display:block}
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:54px;z-index:2000;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:var(--taskbar);backdrop-filter:blur(22px) saturate(140%);
  border-top:1px solid rgba(255,255,255,.52);box-shadow:0 -10px 35px rgba(20,40,80,.16)
}
.task-center{display:flex;gap:8px;align-items:center;justify-content:center}
.task-left{padding-left:14px;color:#374151;font-size:13px}.task-right{padding-right:14px;text-align:right;color:#374151;font-size:12px;line-height:1.15}
.task-btn{
  width:42px;height:42px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;cursor:pointer;position:relative
}
.task-btn:hover,.task-btn.active{background:rgba(30,64,175,.10)}
.task-btn.running:after{content:"";position:absolute;bottom:3px;width:16px;height:3px;border-radius:99px;background:#2563eb}
.start-logo{width:24px;height:24px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.start-logo span{background:#0ea5e9;border-radius:2px}
#startMenu{
  position:absolute;bottom:64px;left:50%;transform:translateX(-50%) translateY(18px);width:min(620px,calc(100vw - 28px));height:560px;z-index:2200;
  background:rgba(250,252,255,.84);backdrop-filter:blur(28px) saturate(150%);border:1px solid rgba(255,255,255,.72);
  border-radius:24px;box-shadow:var(--shadow);padding:22px;display:none;opacity:0;transition:.18s
}
#startMenu.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
.search{height:38px;border-radius:999px;border:1px solid #d6e1ef;background:#fff;padding:0 16px;display:flex;align-items:center;color:#667085;margin-bottom:18px}
.start-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.start-app{display:grid;place-items:center;gap:7px;padding:10px;border-radius:14px;font-size:12px;cursor:pointer}.start-app:hover{background:rgba(37,99,235,.09)}
.window{
  position:absolute;z-index:100;min-width:280px;min-height:180px;background:rgba(255,255,255,.90);border:1px solid rgba(255,255,255,.75);
  border-radius:14px;box-shadow:0 30px 90px rgba(13,30,62,.34);overflow:hidden;backdrop-filter:blur(18px);display:flex;flex-direction:column
}
.window.max{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 70px)!important;border-radius:12px}
.titlebar{height:38px;background:rgba(246,249,255,.82);display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid #e5edf7;user-select:none}
.title{display:flex;align-items:center;gap:8px;padding-left:12px;font-size:13px;font-weight:600;color:#1f2937}
.window-controls{display:flex;height:100%}.win-btn{width:46px;border:0;background:transparent;cursor:pointer;font-size:14px}.win-btn:hover{background:rgba(0,0,0,.07)}.win-btn.close:hover{background:#e81123;color:white}
.content{flex:1;overflow:auto;background:#fff}
.toolbar{display:flex;gap:6px;align-items:center;padding:8px;background:#f8fafc;border-bottom:1px solid #e5edf7;flex-wrap:wrap}
.toolbar button,.toolbar select,.toolbar input{border:1px solid #d1dae8;background:#fff;border-radius:8px;padding:6px 9px;font:inherit}
.toolbar button{cursor:pointer;font-weight:600}.toolbar button:hover{background:#eef5ff}
textarea.plain{width:100%;height:100%;border:0;outline:0;resize:none;padding:14px;font:14px/1.5 Consolas,monospace}
.word-page{margin:24px auto;background:white;width:min(760px,calc(100% - 32px));min-height:900px;box-shadow:0 3px 16px rgba(0,0,0,.14);padding:60px;outline:none;line-height:1.55}
.explorer{display:grid;grid-template-columns:180px 1fr;height:100%}.sidebar{background:#f7f9fc;border-right:1px solid #e5edf7;padding:10px}.side-item{padding:8px 10px;border-radius:8px;font-size:13px}.side-item:hover,.side-item.active{background:#e8f1ff}
.files{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));grid-auto-rows:90px;gap:12px}.file{display:grid;place-items:center;text-align:center;font-size:12px;border-radius:10px;padding:8px}.file:hover{background:#eef5ff}.file svg{width:36px;height:36px}
.calc{width:100%;height:100%;display:grid;grid-template-rows:96px 1fr;background:#f3f4f6}.calc-display{padding:18px;text-align:right;font-size:36px;font-weight:300;overflow:hidden}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px}.calc button{border:0;background:#fff;border-radius:8px;font-size:18px;cursor:pointer}.calc button:hover{background:#eaf2ff}.calc .op{background:#f0f7ff;color:#0b63ce}.calc .eq{background:#0067c0;color:#fff}
.paint-wrap{height:100%;display:grid;grid-template-rows:auto 1fr}.paint-tools{display:flex;gap:8px;padding:8px;background:#f8fafc;border-bottom:1px solid #e5edf7;align-items:center;flex-wrap:wrap}.paint-tools input[type=range]{width:100px}
.paint-stage{overflow:auto;background:#d8dde6;display:grid;place-items:center;padding:20px}.paint-canvas{background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.18);cursor:crosshair}
.chrome{height:100%;display:grid;grid-template-rows:auto 1fr}.chrome-bar{display:flex;gap:8px;padding:8px;background:#f8fafc;border-bottom:1px solid #e5edf7}.chrome-bar input{flex:1;border:1px solid #d1dae8;border-radius:999px;padding:8px 14px}.webview{padding:24px;background:#fff;overflow:auto}.web-card{max-width:760px;margin:0 auto}.web-card h1{font-size:42px}.fake-search{display:flex;margin:18px 0}.fake-search input{flex:1;border:1px solid #d1dae8;border-radius:999px;padding:12px 16px}.fake-results{display:grid;gap:12px}.fake-result{border:1px solid #e5edf7;border-radius:14px;padding:14px}
.notepad-status{height:24px;border-top:1px solid #e5edf7;background:#f8fafc;color:#64748b;font-size:12px;padding:4px 8px}
@media(max-width:700px){.desktop-icons{grid-template-columns:repeat(3,92px)}#taskbar{grid-template-columns:auto 1fr auto}.task-left{display:none}.window{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 70px)!important}.start-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="desktop">
  <div class="desktop-icons" id="desktopIcons"></div>

  <div id="startMenu">
    <div class="search">🔎 Type here to search</div>
    <h3 style="margin:0 0 12px">Pinned</h3>
    <div class="start-grid" id="startGrid"></div>
  </div>

  <div id="taskbar">
    <div class="task-left">☁  Sunny · 24°C</div>
    <div class="task-center" id="taskCenter">
      <button class="task-btn" id="startBtn" title="Start"><div class="start-logo"><span></span><span></span><span></span><span></span></div></button>
    </div>
    <div class="task-right"><div id="clock">--:--</div><div id="date">---</div></div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const desktop = document.getElementById("desktop");
  const iconsWrap = document.getElementById("desktopIcons");
  const taskCenter = document.getElementById("taskCenter");
  const startMenu = document.getElementById("startMenu");
  const startGrid = document.getElementById("startGrid");
  let z = 100;
  const openWindows = new Map();

  const apps = [
    {id:"word", name:"MS Word", color:"#185abd", icon:wordIcon},
    {id:"paint", name:"Paint", color:"#7c3aed", icon:paintIcon},
    {id:"calc", name:"Calculator", color:"#4b5563", icon:calcIcon},
    {id:"note", name:"Notepad", color:"#2563eb", icon:noteIcon},
    {id:"explorer", name:"File Explorer", color:"#f59e0b", icon:folderIcon},
    {id:"chrome", name:"Chrome", color:"#fff", icon:chromeIcon}
  ];

  function svgWrap(fn, bg){
    return `<div class="icon-img" style="background:${bg}">${fn()}</div>`;
  }
  function wordIcon(){return `<svg viewBox="0 0 64 64"><rect x="8" y="10" width="42" height="44" rx="6" fill="#2b7de9"/><rect x="18" y="16" width="34" height="36" rx="4" fill="#fff" opacity=".95"/><rect x="4" y="20" width="30" height="28" rx="4" fill="#185abd"/><text x="12" y="40" font-size="22" font-weight="900" fill="#fff" font-family="Segoe UI">W</text><path d="M24 23h22M24 30h18M24 37h20M24 44h14" stroke="#8ab4ff" stroke-width="3"/></svg>`}
  function paintIcon(){return `<svg viewBox="0 0 64 64"><path d="M32 7C18 7 7 16 7 29c0 13 10 25 26 25h6c4 0 6-5 3-8-2-2-2-6 3-6h5c5 0 8-4 8-9C58 17 46 7 32 7z" fill="#fff"/><circle cx="20" cy="26" r="5" fill="#ef4444"/><circle cx="31" cy="20" r="5" fill="#f59e0b"/><circle cx="43" cy="27" r="5" fill="#22c55e"/><circle cx="28" cy="38" r="5" fill="#3b82f6"/></svg>`}
  function calcIcon(){return `<svg viewBox="0 0 64 64"><rect x="12" y="8" width="40" height="50" rx="7" fill="#f8fafc"/><rect x="17" y="14" width="30" height="10" rx="2" fill="#dbeafe"/><g fill="#334155"><rect x="17" y="30" width="8" height="8" rx="2"/><rect x="28" y="30" width="8" height="8" rx="2"/><rect x="39" y="30" width="8" height="8" rx="2"/><rect x="17" y="42" width="8" height="8" rx="2"/><rect x="28" y="42" width="8" height="8" rx="2"/><rect x="39" y="42" width="8" height="8" rx="2"/></g></svg>`}
  function noteIcon(){return `<svg viewBox="0 0 64 64"><rect x="14" y="8" width="36" height="50" rx="4" fill="#fff"/><path d="M20 20h24M20 29h24M20 38h18M20 47h20" stroke="#60a5fa" stroke-width="3"/><path d="M14 16h36" stroke="#2563eb" stroke-width="5"/></svg>`}
  function folderIcon(){return `<svg viewBox="0 0 64 64"><path d="M7 19c0-4 3-7 7-7h13l6 7h17c4 0 7 3 7 7v3H7z" fill="#f8c84e"/><rect x="7" y="24" width="50" height="30" rx="5" fill="#f9b72b"/><path d="M10 30h44v17c0 4-3 7-7 7H15c-3 0-5-2-5-5z" fill="#ffd56b"/></svg>`}
  function chromeIcon(){return `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#fff"/><path d="M32 32L17 8a28 28 0 0 1 41 20H32z" fill="#ef4444"/><path d="M32 32h26A28 28 0 0 1 20 57z" fill="#22c55e"/><path d="M32 32L20 57A28 28 0 0 1 17 8z" fill="#facc15"/><circle cx="32" cy="32" r="12" fill="#3b82f6" stroke="#fff" stroke-width="4"/></svg>`}

  apps.forEach(app => {
    const d = document.createElement("div");
    d.className = "desktop-icon";
    d.innerHTML = svgWrap(app.icon, app.color) + `<div>${app.name}</div>`;
    d.addEventListener("dblclick", () => openApp(app.id));
    d.addEventListener("click", () => {
      document.querySelectorAll(".desktop-icon").forEach(i => i.classList.remove("selected"));
      d.classList.add("selected");
    });
    iconsWrap.appendChild(d);

    const s = document.createElement("div");
    s.className = "start-app";
    s.innerHTML = svgWrap(app.icon, app.color) + `<div>${app.name}</div>`;
    s.addEventListener("click", () => { openApp(app.id); toggleStart(false); });
    startGrid.appendChild(s);
  });

  document.getElementById("startBtn").addEventListener("click", () => toggleStart());
  desktop.addEventListener("click", e => {
    if (!e.target.closest("#startMenu") && !e.target.closest("#startBtn")) toggleStart(false);
  });

  function toggleStart(force){
    const show = force === undefined ? !startMenu.classList.contains("show") : force;
    startMenu.classList.toggle("show", show);
  }

  function openApp(id){
    if (openWindows.has(id)) {
      const win = openWindows.get(id);
      focus(win);
      return;
    }
    const app = apps.find(a => a.id === id);
    const win = document.createElement("div");
    win.className = "window";
    win.style.left = (120 + openWindows.size * 34) + "px";
    win.style.top = (60 + openWindows.size * 28) + "px";
    win.style.width = defaultSize(id).w + "px";
    win.style.height = defaultSize(id).h + "px";
    win.dataset.app = id;
    win.innerHTML = `
      <div class="titlebar">
        <div class="title">${svgWrap(app.icon, app.color).replace('class="icon-img"','class="icon-img" style="width:22px;height:22px;border-radius:6px;box-shadow:none;background:'+app.color+'"').replace(/width:32px;height:32px/g,'width:17px;height:17px')}<span>${app.name}</span></div>
        <div class="window-controls"><button class="win-btn min">—</button><button class="win-btn maxbtn">□</button><button class="win-btn close">×</button></div>
      </div>
      <div class="content"></div>`;
    desktop.appendChild(win);
    openWindows.set(id, win);
    makeDraggable(win);
    $(".content", win).appendChild(appContent(id));
    $(".close", win).onclick = () => closeWin(id);
    $(".min", win).onclick = () => win.style.display = "none";
    $(".maxbtn", win).onclick = () => win.classList.toggle("max");
    win.addEventListener("pointerdown", () => focus(win));
    addTaskButton(app);
    focus(win);
  }

  function defaultSize(id){
    return {
      word:{w:820,h:620}, paint:{w:850,h:610}, calc:{w:330,h:500},
      note:{w:640,h:470}, explorer:{w:780,h:520}, chrome:{w:850,h:600}
    }[id] || {w:640,h:480};
  }

  function addTaskButton(app){
    const b = document.createElement("button");
    b.className = "task-btn running";
    b.dataset.app = app.id;
    b.title = app.name;
    b.innerHTML = app.icon();
    b.onclick = () => {
      const w = openWindows.get(app.id);
      if (!w) return;
      if (w.style.display === "none") w.style.display = "flex";
      focus(w);
    };
    taskCenter.appendChild(b);
  }

  function closeWin(id){
    const win = openWindows.get(id);
    if (win) win.remove();
    openWindows.delete(id);
    const b = taskCenter.querySelector(`[data-app="${id}"]`);
    if (b) b.remove();
  }

  function focus(win){
    win.style.display = "flex";
    win.style.zIndex = ++z;
    document.querySelectorAll(".task-btn").forEach(b => b.classList.remove("active"));
    const b = taskCenter.querySelector(`[data-app="${win.dataset.app}"]`);
    if (b) b.classList.add("active");
  }

  function makeDraggable(win){
    const bar = $(".titlebar", win);
    let drag = null;
    bar.addEventListener("pointerdown", e => {
      if (e.target.closest("button") || win.classList.contains("max")) return;
      drag = {x:e.clientX,y:e.clientY,l:win.offsetLeft,t:win.offsetTop};
      bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener("pointermove", e => {
      if (!drag) return;
      win.style.left = Math.max(0, drag.l + e.clientX - drag.x) + "px";
      win.style.top = Math.max(0, drag.t + e.clientY - drag.y) + "px";
    });
    bar.addEventListener("pointerup", () => drag = null);
  }

  function appContent(id){
    if (id === "note") return notepad();
    if (id === "word") return word();
    if (id === "calc") return calculator();
    if (id === "paint") return paint();
    if (id === "explorer") return explorer();
    if (id === "chrome") return chrome();
    return document.createElement("div");
  }

  function notepad(){
    const wrap = document.createElement("div");
    wrap.style.height = "100%";
    wrap.style.display = "grid";
    wrap.style.gridTemplateRows = "auto 1fr auto";
    wrap.innerHTML = `<div class="toolbar"><button data-act="new">New</button><button data-act="save">Download .txt</button><button data-act="sample">Sample</button></div><textarea class="plain" spellcheck="false">Welcome to Notepad.

This standalone desktop stores everything inside this one HTML file.</textarea><div class="notepad-status">Ln 1, Col 1 · UTF-8</div>`;
    const ta = $("textarea", wrap);
    wrap.querySelector('[data-act="new"]').onclick = () => ta.value = "";
    wrap.querySelector('[data-act="sample"]').onclick = () => ta.value = "Shopping list\\n- Apples\\n- Bread\\n- Learn JavaScript";
    wrap.querySelector('[data-act="save"]').onclick = () => download("note.txt", ta.value, "text/plain");
    return wrap;
  }

  function word(){
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="toolbar">
      <button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button>
      <select data-cmd="fontSize"><option value="3">Normal</option><option value="5">Heading</option><option value="7">Title</option></select>
      <button data-cmd="insertUnorderedList">Bullets</button><button data-save>Download HTML</button>
    </div><div class="word-page" contenteditable="true"><h1>Document title</h1><p>This is a lightweight Word-style editor. Use the toolbar to format text, create lists, and download your document.</p><p><b>Tip:</b> Select text first, then click a formatting button.</p></div>`;
    const page = $(".word-page", wrap);
    wrap.querySelectorAll("[data-cmd]").forEach(b => b.onchange = b.onclick = () => document.execCommand(b.dataset.cmd, false, b.value || null));
    wrap.querySelector("[data-save]").onclick = () => download("document.html", `<!DOCTYPE html><html><body>${page.innerHTML}</body></html>`, "text/html");
    return wrap;
  }

  function calculator(){
    const wrap = document.createElement("div");
    wrap.className = "calc";
    wrap.innerHTML = `<div class="calc-display" id="calcDisplay">0</div><div class="calc-grid"></div>`;
    const grid = $(".calc-grid", wrap), disp = $(".calc-display", wrap);
    let expr = "";
    const keys = ["C","⌫","%","/","7","8","9","*","4","5","6","-","1","2","3","+","±","0",".","="];
    keys.forEach(k => {
      const b = document.createElement("button");
      b.textContent = k;
      if ("/*-+=".includes(k)) b.className = "op";
      if (k === "=") b.className = "eq";
      b.onclick = () => press(k);
      grid.appendChild(b);
    });
    function press(k){
      if (k === "C") expr = "";
      else if (k === "⌫") expr = expr.slice(0,-1);
      else if (k === "±") expr = expr.startsWith("-") ? expr.slice(1) : "-" + expr;
      else if (k === "%") expr = String((Number(evalSafe(expr)) || 0) / 100);
      else if (k === "=") expr = String(evalSafe(expr));
      else expr += k;
      disp.textContent = expr || "0";
    }
    function evalSafe(s){
      try { if (!/^[0-9+\-*/().\s]+$/.test(s)) return "Error"; return Function("return ("+s+")")(); }
      catch { return "Error"; }
    }
    return wrap;
  }

  function paint(){
    const wrap = document.createElement("div");
    wrap.className = "paint-wrap";
    wrap.innerHTML = `<div class="paint-tools">
      <label>Color <input type="color" value="#2563eb"></label>
      <label>Size <input type="range" min="1" max="60" value="8"></label>
      <button data-tool="brush">Brush</button><button data-tool="eraser">Eraser</button><button data-clear>Clear</button><button data-save>Download PNG</button>
    </div><div class="paint-stage"><canvas class="paint-canvas" width="900" height="520"></canvas></div>`;
    const canvas = $("canvas", wrap), ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
    let drawing = false, tool = "brush", last = null;
    const color = $('input[type="color"]', wrap), size = $('input[type="range"]', wrap);
    wrap.querySelector('[data-tool="brush"]').onclick = () => tool = "brush";
    wrap.querySelector('[data-tool="eraser"]').onclick = () => tool = "eraser";
    wrap.querySelector("[data-clear]").onclick = () => { ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height); };
    wrap.querySelector("[data-save]").onclick = () => { const a=document.createElement("a"); a.download="painting.png"; a.href=canvas.toDataURL("image/png"); a.click(); };
    function p(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
    canvas.onpointerdown = e => {drawing=true; last=p(e); canvas.setPointerCapture(e.pointerId)};
    canvas.onpointermove = e => {
      if(!drawing) return; const q=p(e);
      ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=size.value;ctx.strokeStyle=tool==="eraser"?"#fff":color.value;
      ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke(); last=q;
    };
    canvas.onpointerup = () => drawing=false;
    return wrap;
  }

  function explorer(){
    const wrap = document.createElement("div");
    wrap.className = "explorer";
    wrap.innerHTML = `<div class="sidebar"><div class="side-item active">🏠 Home</div><div class="side-item">🖼 Pictures</div><div class="side-item">📄 Documents</div><div class="side-item">⬇ Downloads</div><div class="side-item">☁ OneDrive</div></div><div class="files"></div>`;
    const files = [
      ["Documents",folderIcon],["Pictures",folderIcon],["Music",folderIcon],["Project.docx",wordIcon],["Sketch.png",paintIcon],["Notes.txt",noteIcon],["Budget.xlsx",calcIcon],["Browser.url",chromeIcon]
    ];
    files.forEach(([name,icon]) => {
      const f=document.createElement("div");f.className="file";f.innerHTML=icon()+`<div>${name}</div>`;$(".files",wrap).appendChild(f);
    });
    return wrap;
  }

  function chrome(){
    const wrap = document.createElement("div");
    wrap.className = "chrome";
    wrap.innerHTML = `<div class="chrome-bar"><button data-back>←</button><button data-home>⌂</button><input value="https://www.example.com" spellcheck="false"><button data-go>Go</button></div><div class="webview"></div>`;
    const input = $("input", wrap), view = $(".webview", wrap);
    const render = () => {
      const q = input.value.trim();
      view.innerHTML = `<div class="web-card"><h1>Mini Web</h1><p>This Chrome-like app is a safe offline browser simulation. It can show built-in pages and search-style results inside the standalone desktop.</p><div class="fake-search"><input value="${escapeHtml(q)}"><button>Search</button></div><div class="fake-results"><div class="fake-result"><b>Result for ${escapeHtml(q)}</b><br><span style="color:#64748b">A simulated page preview rendered locally.</span></div><div class="fake-result"><b>About this desktop</b><br><span style="color:#64748b">All apps, icons, and wallpaper recreation are embedded in one HTML file.</span></div></div></div>`;
    };
    wrap.querySelector("[data-go]").onclick = render;
    wrap.querySelector("[data-home]").onclick = () => { input.value = "desktop://home"; render(); };
    render();
    return wrap;
  }

  function download(name, text, type){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type}));
    a.download=name;a.click();URL.revokeObjectURL(a.href);
  }
  function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
  function $(s,r=document){return r.querySelector(s)}

  setInterval(() => {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    document.getElementById("date").textContent = now.toLocaleDateString([], {month:"short", day:"numeric"});
  }, 1000);
  document.getElementById("clock").textContent = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  document.getElementById("date").textContent = new Date().toLocaleDateString([], {month:"short", day:"numeric"});
})();
</script>
</body>
</html>
