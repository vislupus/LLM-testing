<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Windows 11</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #0067c0;
    --accent-hover: #1a7ad1;
    --close: #c42b1c;
    --taskbar-h: 48px;
    --mica: rgba(243,243,243,.72);
    --title-h: 32px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  body {
    font-family: "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
    background: #000;
    color: #1a1a1a;
  }
  button, input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; background-clip: content-box; }

  #boot {
    position: fixed; inset: 0; background: #000; z-index: 20000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 64px;
    transition: opacity .5s ease;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .win-logo-boot { width: 88px; height: 88px; }
  .spin-dots { display: flex; gap: 8px; }
  .spin-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: #fff;
    animation: bootdot 1s ease-in-out infinite;
  }
  .spin-dots span:nth-child(2) { animation-delay: .12s; }
  .spin-dots span:nth-child(3) { animation-delay: .24s; }
  .spin-dots span:nth-child(4) { animation-delay: .36s; }
  .spin-dots span:nth-child(5) { animation-delay: .48s; }
  @keyframes bootdot {
    0%, 100% { opacity: .2; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-4px); }
  }

  #desktop {
    position: fixed; inset: 0 0 var(--taskbar-h) 0;
    background: #7aa0c4 center/cover no-repeat;
    overflow: hidden;
  }
  #desktop.night { filter: brightness(.65) sepia(.15); }

  #icon-grid {
    position: absolute; top: 8px; left: 8px; bottom: 8px;
    display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start;
    gap: 4px; width: max-content;
  }
  .desk-icon {
    width: 76px; min-height: 78px; padding: 6px 4px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border-radius: 4px; cursor: default; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
  }
  .desk-icon:hover { background: rgba(255,255,255,.12); }
  .desk-icon.selected { background: rgba(0,103,192,.38); outline: 1px solid rgba(255,255,255,.35); }
  .desk-icon img, .desk-icon .icon-svg { width: 48px; height: 48px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); pointer-events: none; }
  .desk-icon span { font-size: 12px; text-align: center; line-height: 1.2; max-width: 72px; word-break: break-word; }

  #windows { position: absolute; inset: 0; pointer-events: none; }
  .win {
    position: absolute; min-width: 280px; min-height: 180px;
    background: #fff; border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.12);
    display: flex; flex-direction: column; overflow: hidden;
    pointer-events: auto;
  }
  .win.maximized { border-radius: 0 !important; inset: 0 !important; width: auto !important; height: auto !important; }
  .win.minimized { display: none !important; }
  .win.active { box-shadow: 0 16px 48px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.16); }
  .titlebar {
    height: var(--title-h); flex-shrink: 0; display: flex; align-items: center;
    padding-left: 12px; background: #fff; cursor: default;
  }
  .titlebar .t-icon, .titlebar .icon-svg { width: 16px; height: 16px; object-fit: contain; margin-right: 8px; }
  .titlebar .t-title { font-size: 12px; color: #1a1a1a; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-btns { display: flex; height: 100%; }
  .t-btns button {
    width: 46px; height: 100%; border: 0; background: transparent; color: #1a1a1a;
    display: flex; align-items: center; justify-content: center; cursor: default;
  }
  .t-btns button:hover { background: #e5e5e5; }
  .t-btns .btn-close:hover { background: var(--close); color: #fff; }
  .win-body { flex: 1; overflow: hidden; position: relative; background: #fff; }
  .resize-h { position: absolute; z-index: 5; }
  .rh-n, .rh-s { left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
  .rh-e, .rh-w { top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
  .rh-n { top: 0; } .rh-s { bottom: 0; } .rh-e { right: 0; } .rh-w { left: 0; }
  .rh-ne, .rh-nw, .rh-se, .rh-sw { width: 10px; height: 10px; position: absolute; z-index: 6; }
  .rh-ne { top: 0; right: 0; cursor: nesw-resize; }
  .rh-nw { top: 0; left: 0; cursor: nwse-resize; }
  .rh-se { bottom: 0; right: 0; cursor: nwse-resize; }
  .rh-sw { bottom: 0; left: 0; cursor: nesw-resize; }
  .win.maximized .resize-h { display: none; }

  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar-h); z-index: 9000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(243,243,243,.78);
    backdrop-filter: blur(40px) saturate(1.4);
    -webkit-backdrop-filter: blur(40px) saturate(1.4);
    border-top: 1px solid rgba(255,255,255,.45);
    box-shadow: 0 -1px 0 rgba(0,0,0,.06);
  }
  #tb-center { display: flex; align-items: center; gap: 4px; height: 100%; }
  .tb-btn {
    width: 40px; height: 40px; border: 0; background: transparent; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; position: relative; cursor: default;
  }
  .tb-btn:hover { background: rgba(255,255,255,.55); }
  .tb-btn.active-menu, .tb-btn.open-app { background: rgba(255,255,255,.7); }
  .tb-btn img, .tb-btn svg, .tb-btn .icon-svg { width: 24px; height: 24px; object-fit: contain; }
  .tb-btn .pill {
    position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 3px; border-radius: 2px; background: #7a7a7a;
  }
  .tb-btn.focused .pill { width: 16px; background: var(--accent); }
  #tb-right {
    position: absolute; right: 0; top: 0; bottom: 0;
    display: flex; align-items: center; padding-right: 8px; gap: 0;
  }
  .tray-btn {
    height: 100%; padding: 0 8px; border: 0; background: transparent; border-radius: 4px;
    display: flex; align-items: center; gap: 8px; cursor: default; color: #1a1a1a;
  }
  .tray-btn:hover { background: rgba(255,255,255,.5); }
  #clock-btn { flex-direction: column; align-items: flex-end; line-height: 1.15; font-size: 12px; padding: 0 12px; }
  #show-desk {
    width: 6px; height: 100%; margin-left: 4px; border-left: 1px solid rgba(0,0,0,.12);
    cursor: default; background: transparent;
  }
  #show-desk:hover { background: rgba(255,255,255,.5); }

  .flyout {
    position: fixed; z-index: 9100; display: none;
    background: rgba(242,242,242,.78);
    backdrop-filter: blur(60px) saturate(1.6);
    -webkit-backdrop-filter: blur(60px) saturate(1.6);
    border-radius: 16px;
    box-shadow: 0 16px 64px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.08);
    overflow: hidden;
  }
  .flyout.show { display: block; animation: pop .16s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

  #start-menu { width: 640px; bottom: 60px; left: 0; right: 0; margin: 0 auto; padding: 20px 20px 12px; }
  #search-panel { width: 640px; height: 520px; bottom: 60px; left: 0; right: 0; margin: 0 auto; }
  #widgets-panel { width: 380px; height: calc(100vh - 72px); left: 12px; bottom: 60px; border-radius: 12px; padding: 16px; overflow: auto; }
  #calendar-panel { width: 360px; right: 12px; bottom: 60px; padding: 16px; }
  #quick-panel { width: 360px; right: 12px; bottom: 60px; padding: 16px; }
  #ctx-menu {
    position: fixed; z-index: 9200; min-width: 240px; padding: 6px;
    background: rgba(249,249,249,.86); backdrop-filter: blur(40px);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); display: none;
  }
  #ctx-menu.show { display: block; }
  .ctx-item { padding: 8px 12px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .ctx-item:hover { background: rgba(0,0,0,.06); }
  .ctx-sep { height: 1px; background: rgba(0,0,0,.08); margin: 4px 8px; }

  .qs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .qs-tile {
    height: 64px; border-radius: 8px; border: 0; background: rgba(255,255,255,.55);
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    padding: 10px 12px; font-size: 12px; gap: 4px; cursor: default;
  }
  .qs-tile.on { background: var(--accent); color: #fff; }
  .qs-tile:hover { filter: brightness(.97); }

  .pinned-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px 0; margin-top: 8px; }
  .pin-app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 8px; font-size: 12px; }
  .pin-app:hover { background: rgba(255,255,255,.5); }
  .pin-app img, .pin-app .icon-svg { width: 32px; height: 32px; object-fit: contain; }

  .calc-wrap { background: #e8e8e8; height: 100%; display: flex; flex-direction: column; padding: 8px; }
  .calc-display { text-align: right; padding: 8px 12px 16px; }
  .calc-expr { font-size: 13px; color: #666; min-height: 18px; }
  .calc-num { font-size: 42px; font-weight: 600; letter-spacing: -1px; overflow: hidden; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }
  .calc-grid button {
    border: 0; border-radius: 4px; font-size: 16px; background: #f9f9f9;
    box-shadow: 0 1px 0 rgba(0,0,0,.08); cursor: default;
  }
  .calc-grid button:hover { background: #fff; }
  .calc-grid button:active { background: #d5d5d5; }
  .calc-grid .op { background: #f3f3f3; }
  .calc-grid .eq { background: #005fb8; color: #fff; }
  .calc-grid .eq:hover { background: #1a73c7; }
  .calc-grid .span2 { grid-column: span 2; }

  .np-menu { display: flex; background: #f3f3f3; border-bottom: 1px solid #e0e0e0; font-size: 13px; }
  .np-menu .m { padding: 6px 12px; position: relative; }
  .np-menu .m:hover { background: #e5e5e5; }
  .np-drop {
    display: none; position: absolute; top: 100%; left: 0; min-width: 200px;
    background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.18); border-radius: 4px; z-index: 10; padding: 4px;
  }
  .np-menu .m:hover .np-drop, .np-menu .m.open .np-drop { display: block; }
  .np-drop div { padding: 6px 12px; border-radius: 4px; display: flex; justify-content: space-between; }
  .np-drop div:hover { background: #f0f0f0; }
  .np-ta { width: 100%; height: 100%; border: 0; outline: 0; resize: none; padding: 8px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px; user-select: text; }

  .word-ribbon { background: #fff; border-bottom: 1px solid #e5e5e5; }
  .word-tabs { display: flex; background: #002050; color: #fff; font-size: 12px; height: 30px; align-items: flex-end; padding-left: 8px; }
  .word-tabs span { padding: 6px 14px; cursor: default; border-radius: 4px 4px 0 0; }
  .word-tabs span.on { background: #fff; color: #002050; font-weight: 600; }
  .word-tools { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px; align-items: center; }
  .word-tools button {
    min-width: 28px; height: 28px; border: 0; background: transparent; border-radius: 4px; font-size: 13px;
  }
  .word-tools button:hover, .word-tools button.on { background: #e8e8e8; }
  .word-tools select, .word-tools input[type=color] { height: 26px; border: 1px solid #d0d0d0; border-radius: 4px; font-size: 12px; }
  .word-page-wrap { background: #605e5c; height: 100%; overflow: auto; padding: 24px; }
  .word-page {
    max-width: 720px; min-height: 900px; margin: 0 auto; background: #fff;
    padding: 72px 80px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    outline: 0; user-select: text; font-family: Calibri, Cambria, Georgia, serif; font-size: 16px; line-height: 1.5;
  }
  .word-page:empty:before { content: attr(data-ph); color: #aaa; }

  .paint-ui { display: flex; flex-direction: column; height: 100%; background: #f3f3f3; }
  .paint-bar { display: flex; gap: 6px; padding: 8px; align-items: center; flex-wrap: wrap; background: #fafafa; border-bottom: 1px solid #e5e5e5; }
  .paint-bar button {
    width: 32px; height: 32px; border: 1px solid transparent; background: #fff; border-radius: 4px; font-size: 14px;
  }
  .paint-bar button.on, .paint-bar button:hover { border-color: var(--accent); background: #e8f3ff; }
  .paint-canvas-wrap { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 16px; background: #d0d0d0; }
  canvas#paint-c, .paint-canvas-wrap canvas { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: crosshair; }

  .fe { display: flex; height: 100%; background: #fff; }
  .fe-side { width: 220px; background: #f3f3f3; padding: 8px; overflow: auto; flex-shrink: 0; }
  .fe-item { padding: 6px 10px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .fe-item:hover { background: rgba(0,0,0,.05); }
  .fe-item.on { background: #cce8ff; }
  .fe-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .fe-toolbar { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid #eee; align-items: center; }
  .fe-toolbar button { border: 0; background: transparent; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  .fe-toolbar button:hover { background: #f0f0f0; }
  .fe-addr { flex: 1; display: flex; align-items: center; background: #fff; border: 1px solid #d0d0d0; border-radius: 4px; padding: 4px 8px; font-size: 13px; min-width: 0; }
  .fe-files { flex: 1; overflow: auto; padding: 8px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; }
  .fe-files.list { display: block; }
  .fe-file { width: 96px; padding: 8px 4px; border-radius: 4px; text-align: center; font-size: 12px; }
  .fe-file:hover { background: #f5f5f5; }
  .fe-file.sel { background: #cce8ff; }
  .fe-file img, .fe-file .icon-svg { width: 40px; height: 40px; margin: 0 auto 4px; object-fit: contain; }
  .fe-files.list .fe-file { width: 100%; display: flex; text-align: left; align-items: center; gap: 10px; }
  .fe-files.list .fe-file img, .fe-files.list .fe-file .icon-svg { width: 20px; height: 20px; margin: 0; }

  .chr { display: flex; flex-direction: column; height: 100%; background: #202124; }
  .chr-tabs { display: flex; align-items: flex-end; height: 38px; padding: 0 8px; gap: 4px; background: #202124; }
  .chr-tab {
    height: 32px; min-width: 80px; max-width: 200px; flex: 1; background: #35363a; color: #e8eaed;
    border-radius: 8px 8px 0 0; display: flex; align-items: center; padding: 0 10px; font-size: 12px; gap: 6px;
  }
  .chr-tab.on { background: #3c4043; }
  .chr-tab img { width: 14px; height: 14px; }
  .chr-tab .x { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .chr-tab .x:hover { background: #5f6368; }
  .chr-new { width: 28px; height: 28px; border: 0; background: transparent; color: #e8eaed; border-radius: 4px; margin-bottom: 4px; }
  .chr-new:hover { background: #3c4043; }
  .chr-bar { display: flex; align-items: center; gap: 6px; padding: 8px; background: #3c4043; }
  .chr-bar button { width: 32px; height: 32px; border: 0; background: transparent; color: #e8eaed; border-radius: 16px; }
  .chr-bar button:hover { background: #5f6368; }
  .chr-omni {
    flex: 1; height: 34px; border-radius: 18px; border: 0; background: #202124; color: #e8eaed;
    padding: 0 16px; outline: 0; font-size: 14px; user-select: text;
  }
  .chr-frame { flex: 1; background: #fff; border: 0; width: 100%; height: 100%; }
  .ntp {
    height: 100%; background: #202124; color: #e8eaed; display: flex; flex-direction: column; align-items: center; padding-top: 80px;
  }
  .ntp-search {
    width: min(560px, 90%); height: 44px; border-radius: 24px; border: 0; background: #303134; color: #e8eaed;
    padding: 0 20px; font-size: 16px; outline: 0; user-select: text;
  }
  .ntp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-top: 48px; }
  .ntp-sc { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; width: 72px; }
  .ntp-sc .av { width: 48px; height: 48px; border-radius: 50%; background: #303134; display: flex; align-items: center; justify-content: center; }
  .ntp-sc img { width: 24px; height: 24px; }

  #taskview { position: fixed; inset: 0 var(--taskbar-h) 0 0; bottom: var(--taskbar-h); background: rgba(0,0,0,.45); backdrop-filter: blur(20px); z-index: 8900; display: none; padding: 60px; }
  #taskview.show { display: flex; flex-wrap: wrap; gap: 24px; align-content: center; justify-content: center; }
  .tv-card { width: 280px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.3); cursor: default; }
  .tv-card:hover { outline: 2px solid var(--accent); }
  .tv-card h4 { margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .tv-preview { height: 160px; background: #eee; display: flex; align-items: center; justify-content: center; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="boot">
  <svg class="win-logo-boot" viewBox="0 0 88 88" fill="white">
    <rect x="0" y="0" width="40" height="40" rx="2"/>
    <rect x="48" y="0" width="40" height="40" rx="2"/>
    <rect x="0" y="48" width="40" height="40" rx="2"/>
    <rect x="48" y="48" width="40" height="40" rx="2"/>
  </svg>
  <div class="spin-dots"><span></span><span></span><span></span><span></span><span></span></div>
</div>

<div id="desktop">
  <div id="icon-grid"></div>
  <div id="windows"></div>
</div>

<div id="taskbar">
  <div id="tb-center"></div>
  <div id="tb-right">
    <button class="tray-btn" id="qs-btn" title="Quick settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.5c0-2 1.5-4 4-5.5M2 12.5C2 8 6 4 12 4c.7 0 1.4.07 2 .22"/><path d="M8.5 12.5a3.5 3.5 0 015.2-3"/><circle cx="12" cy="16" r="1.6" fill="currentColor" stroke="none"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h2l5 4V5L6 9H4zm13.5 3a4.5 4.5 0 00-2.4-4v8a4.5 4.5 0 002.4-4z"/></svg>
    </button>
    <button class="tray-btn" id="clock-btn">
      <div id="clock-time"></div>
      <div id="clock-date"></div>
    </button>
    <div id="show-desk" title="Show desktop"></div>
  </div>
</div>

<div id="start-menu" class="flyout">
  <input id="start-search" placeholder="Search for apps, settings, and documents" class="w-full h-10 rounded-full px-4 text-sm outline-none bg-white/80 border border-black/5" />
  <div class="flex justify-between items-center mt-5 mb-1 px-1">
    <span class="text-sm font-semibold">Pinned</span>
    <button id="all-apps-btn" class="text-xs bg-white/70 px-3 py-1 rounded">All apps &gt;</button>
  </div>
  <div class="pinned-grid" id="pinned-grid"></div>
  <div class="flex justify-between items-center mt-4 mb-2 px-1">
    <span class="text-sm font-semibold">Recommended</span>
  </div>
  <div id="recommended" class="grid grid-cols-2 gap-1 text-sm"></div>
  <div class="flex items-center justify-between mt-4 pt-3 border-t border-black/10">
    <div class="flex items-center gap-3 px-2">
      <div class="w-8 h-8 rounded-full bg-sky-600 text-white flex items-center justify-center text-sm font-semibold">U</div>
      <span class="text-sm">User</span>
    </div>
    <button id="power-btn" class="p-2 rounded hover:bg-black/5" title="Restart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v9"/><path d="M7 5.5a8 8 0 108 0"/></svg>
    </button>
  </div>
</div>

<div id="search-panel" class="flyout p-5">
  <input id="os-search" placeholder="Type here to search" class="w-full h-11 rounded-lg px-4 text-base outline-none bg-white border border-black/10" />
  <div id="search-results" class="mt-4"></div>
</div>

<div id="widgets-panel" class="flyout">
  <div class="text-2xl font-semibold" id="wid-time"></div>
  <div class="text-sm text-black/60 mb-4" id="wid-date"></div>
  <div class="bg-white/60 rounded-xl p-4 mb-3">

<script>
const WALLPAPER = "https://static.wikitide.net/windowswallpaperwiki/5/57/Img0_%28Windows_11%29.jpg";
const WALLPAPER_DARK = "https://static.wikitide.net/windowswallpaperwiki/f/f3/Img19_%28Windows_11%29.jpg";
const WALLPAPER_FALLBACK = "https://static.wikitide.net/windowswallpaperwiki/thumb/5/57/Img0_%28Windows_11%29.jpg/1920px-Img0_%28Windows_11%29.jpg";

const ICONS = {
  word: "https://img.icons8.com/color/96/microsoft-word-2019.png",
  word2: "https://img.icons8.com/fluency/96/ms-word.png",
  paint: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Microsoft_Paint.svg/128px-Microsoft_Paint.svg.png",
  paint2: "https://img.icons8.com/color/96/paint.png",
  calc: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Windows_11_Windows_Calculator.svg/96px-Windows_11_Windows_Calculator.svg.png",
  calc2: "https://img.icons8.com/fluency/96/calculator.png",
  notepad: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Notepad_Win11.svg/96px-Notepad_Win11.svg.png",
  notepad2: "https://img.icons8.com/fluency/96/notepad.png",
  chrome: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Google_Chrome_icon_%28February_2022%29.svg/128px-Google_Chrome_icon_%28February_2022%29.svg.png",
  chrome2: "https://img.icons8.com/color/96/chrome.png",
  recycle: "https://img.icons8.com/fluency/96/recycle-bin.png",
  folder: "https://img.icons8.com/fluency/96/folder-invoices.png",
  file: "https://img.icons8.com/fluency/48/document.png",
  image: "https://img.icons8.com/fluency/48/image.png",
  disk: "https://img.icons8.com/fluency/48/hdd.png"
};

function explorerSVG(s) {
  s = s || 48;
  return `<svg class="icon-svg" width="${s}" height="${s}" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <rect x="7" y="8" width="18" height="26" rx="2" fill="#4FC3F7" transform="rotate(-12 16 21)"/>
    <rect x="12" y="10" width="18" height="26" rx="2" fill="#039BE5" transform="rotate(-5 21 23)"/>
    <path d="M6 20h8l3.2 3.2H42V40a3 3 0 01-3 3H9a3 3 0 01-3-3V20z" fill="#FFB300"/>
    <path d="M6 20h36v4H6z" fill="#FFC107"/>
    <path d="M9 17h12l2.5 3H6v-1a2 2 0 012-2z" fill="#FFE082"/>
  </svg>`;
}

function imgWithFb(src, fb, cls, alt) {
  return `<img class="${cls||''}" src="${src}" alt="${alt||''}" onerror="this.onerror=null;this.src='${fb}'" draggable="false"/>`;
}

const APPS = {
  word: { id: "word", name: "Word", icon: ICONS.word, fb: ICONS.word2, w: 980, h: 680 },
  paint: { id: "paint", name: "Paint", icon: ICONS.paint, fb: ICONS.paint2, w: 920, h: 640 },
  calc: { id: "calc", name: "Calculator", icon: ICONS.calc, fb: ICONS.calc2, w: 340, h: 520 },
  notepad: { id: "notepad", name: "Notepad", icon: ICONS.notepad, fb: ICONS.notepad2, w: 680, h: 480 },
  explorer: { id: "explorer", name: "File Explorer", icon: null, fb: ICONS.folder, w: 880, h: 560 },
  chrome: { id: "chrome", name: "Google Chrome", icon: ICONS.chrome, fb: ICONS.chrome2, w: 1040, h: 700 }
};

function appIcon(app, size) {
  size = size || 24;
  if (app.id === "explorer") return explorerSVG(size);
  return imgWithFb(app.icon, app.fb, "", app.name);
}

/* ---------- Virtual filesystem ---------- */
function defaultFS() {
  return {
    Desktop: { type: "folder", children: {} },
    Documents: {
      type: "folder",
      children: {
        "Welcome.txt": { type: "file", ext: "txt", content: "Welcome to Windows 11!\n\nThis is a working desktop clone.\nOpen apps from the desktop or Start menu." },
        "Notes.docx": { type: "file", ext: "docx", content: "<h1>Meeting notes</h1><p>Discuss the quarterly goals and ship the Windows 11 web desktop.</p>" }
      }
    },
    Downloads: {
      type: "folder",
      children: {
        "Readme.txt": { type: "file", ext: "txt", content: "Downloaded files appear here." }
      }
    },
    Pictures: { type: "folder", children: {} },
    Music: { type: "folder", children: {} },
    Videos: { type: "folder", children: {} },
    RecycleBin: { type: "folder", children: {} },
    "This PC": {
      type: "folder",
      children: {
        "Local Disk (C:)": {
          type: "drive",
          children: {
            Windows: { type: "folder", children: { System32: { type: "folder", children: {} } } },
            "Program Files": { type: "folder", children: { Google: { type: "folder", children: {} }, Microsoft: { type: "folder", children: {} } } },
            Users: { type: "folder", children: { User: { type: "folder", children: {} } } }
          }
        },
        "Data (D:)": { type: "drive", children: { Backup: { type: "folder", children: {} } } }
      }
    }
  };
}
let FS = defaultFS();
try { const s = localStorage.getItem("win11-fs"); if (s) FS = JSON.parse(s); } catch(e) {}
function saveFS() { try { localStorage.setItem("win11-fs", JSON.stringify(FS)); } catch(e) {} }

function getNode(path) {
  if (!path || path === "Home") return { type: "folder", children: {
    Desktop: FS.Desktop, Documents: FS.Documents, Downloads: FS.Downloads, Pictures: FS.Pictures, Music: FS.Music, Videos: FS.Videos, "This PC": FS["This PC"]
  }};
  const parts = path.split("/").filter(Boolean);
  let node = { type: "folder", children: FS };
  for (const p of parts) {
    if (!node || !node.children || !node.children[p]) return null;
    node = node.children[p];
  }
  return node;
}
function writeFile(folderPath, name, fileObj) {
  const n = getNode(folderPath);
  if (!n || !n.children) return;
  n.children[name] = fileObj;
  saveFS();
}

/* ---------- Window manager ---------- */
let zTop = 100, winUid = 1, windows = [];
const winsEl = document.getElementById("windows");

function iconHtml(app, size) {
  if (app.id === "explorer") return explorerSVG(size || 16);
  return `<img class="t-icon" src="${app.icon}" onerror="this.onerror=null;this.src='${app.fb}'" alt="">`;
}

function createWindow(app, extra) {
  extra = extra || {};
  const existing = windows.find(w => w.appId === app.id && !extra.forceNew && app.id !== "chrome" && app.id !== "notepad" && app.id !== "word");
  if (existing && !extra.forceNew && app.id !== "paint") {
    restoreFocus(existing);
    return existing;
  }
  const id = "w" + (winUid++);
  const count = windows.length;
  const el = document.createElement("div");
  el.className = "win";
  el.id = id;
  const W = Math.min(app.w, window.innerWidth - 40);
  const H = Math.min(app.h, window.innerHeight - 80);
  el.style.width = W + "px";
  el.style.height = H + "px";
  el.style.left = Math.max(24, (window.innerWidth - W) / 2 + (count % 6) * 22) + "px";
  el.style.top = Math.max(16, 40 + (count % 6) * 22) + "px";
  el.innerHTML = `
    <div class="resize-h rh-n" data-dir="n"></div>
    <div class="resize-h rh-s" data-dir="s"></div>
    <div class="resize-h rh-e" data-dir="e"></div>
    <div class="resize-h rh-w" data-dir="w"></div>
    <div class="resize-h rh-ne" data-dir="ne"></div>
    <div class="resize-h rh-nw" data-dir="nw"></div>
    <div class="resize-h rh-se" data-dir="se"></div>
    <div class="resize-h rh-sw" data-dir="sw"></div>
    <div class="titlebar">
      ${iconHtml(app, 16)}
      <div class="t-title">${extra.title || app.name}</div>
      <div class="t-btns">
        <button class="btn-min" title="Minimize">${minSvg()}</button>
        <button class="btn-max" title="Maximize">${maxSvg()}</button>
        <button class="btn-close" title="Close">${closeSvg()}</button>
      </div>
    </div>
    <div class="win-body"></div>`;
  winsEl.appendChild(el);
  const rec = { id, el, appId: app.id, app, minimized: false, maximized: false, prev: null, extra };
  windows.push(rec);
  bindWindow(rec);
  const body = el.querySelector(".win-body");
  APP_RENDER[app.id](body, rec, extra);
  focusWin(rec);
  renderTaskbar();
  return rec;
}

function minSvg(){return `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.1"/></svg>`;}
function maxSvg(){return `<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor"/></svg>`;}
function restSvg(){return `<svg width="10" height="10" viewBox="0 0 10 10"><rect x="2.5" y="1" width="6" height="6" fill="none" stroke="currentColor"/><path d="M1.5 3.5h6v6h-6z" fill="none" stroke="currentColor"/></svg>`;}
function closeSvg(){return `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.1"/></svg>`;}

function bindWindow(rec) {
  const el = rec.el;
  const bar = el.querySelector(".titlebar");
  el.addEventListener("mousedown", () => focusWin(rec));
  el.querySelector(".btn-min").onclick = e => { e.stopPropagation(); minimizeWin(rec); };
  el.querySelector(".btn-max").onclick = e => { e.stopPropagation(); toggleMax(rec); };
  el.querySelector(".btn-close").onclick = e => { e.stopPropagation(); closeWin(rec); };
  bar.ondblclick = () => toggleMax(rec);
  let drag = null;
  bar.addEventListener("mousedown", e => {
    if (e.target.closest(".t-btns") || rec.maximized) return;
    drag = { x: e.clientX - el.offsetLeft, y: e.clientY - el.offsetTop };
    focusWin(rec);
  });
  window.addEventListener("mousemove", e => {
    if (!drag) return;
    el.style.left = Math.max(-el.offsetWidth + 80, e.clientX - drag.x) + "px";
    el.style.top = Math.max(0, Math.min(window.innerHeight - 80, e.clientY - drag.y)) + "px";
  });
  window.addEventListener("mouseup", () => drag = null);
  el.querySelectorAll("[data-dir]").forEach(h => {
    h.addEventListener("mousedown", e => {
      e.stopPropagation();
      const dir = h.dataset.dir;
      const s = { x: e.clientX, y: e.clientY, l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
      function move(ev) {
        const dx = ev.clientX - s.x, dy = ev.clientY - s.y;
        let l = s.l, t = s.t, w = s.w, hgt = s.h;
        if (dir.includes("e")) w = Math.max(280, s.w + dx);
        if (dir.includes("s")) hgt = Math.max(180, s.h + dy);
        if (dir.includes("w")) { w = Math.max(280, s.w - dx); l = s.l + s.w - w; }
        if (dir.includes("n")) { hgt = Math.max(180, s.h - dy); t = s.t + s.h - hgt; }
        el.style.left = l + "px"; el.style.top = t + "px";
        el.style.width = w + "px"; el.style.height = hgt + "px";
      }
      function up() { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); }
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    });
  });
}

function focusWin(rec) {
  windows.forEach(w => w.el.classList.remove("active"));
  rec.el.classList.add("active");
  rec.el.style.zIndex = ++zTop;
  rec.minimized = false;
  rec.el.classList.remove("minimized");
  renderTaskbar();
}
function restoreFocus(rec) {
  rec.minimized = false;
  rec.el.classList.remove("minimized");
  focusWin(rec);
}
function minimizeWin(rec) {
  rec.minimized = true;
  rec.el.classList.add("minimized");
  rec.el.classList.remove("active");
  renderTaskbar();
}
function toggleMax(rec) {
  if (rec.maximized) {
    rec.maximized = false;
    elRestore(rec);
    rec.el.classList.remove("maximized");
    rec.el.querySelector(".btn-max").innerHTML = maxSvg();
  } else {
    rec.prev = { l: rec.el.style.left, t: rec.el.style.top, w: rec.el.style.width, h: rec.el.style.height };
    rec.maximized = true;
    rec.el.classList.add("maximized");
    rec.el.querySelector(".btn-max").innerHTML = restSvg();
  }
}
function elRestore(rec) {
  if (!rec.prev) return;
  rec.el.style.left = rec.prev.l; rec.el.style.top = rec.prev.t;
  rec.el.style.width = rec.prev.w; rec.el.style.height = rec.prev.h;
}
function closeWin(rec) {
  rec.el.remove();
  windows = windows.filter(w => w.id !== rec.id);
  renderTaskbar();
}

function openApp(id, extra) {
  hideFlyouts();
  createWindow(APPS[id], extra || {});
}

/* ---------- Apps ---------- */
const APP_RENDER = {};

APP_RENDER.calc = function(body) {
  let cur = "0", prev = null, op = null, fresh = true;
  body.innerHTML = `<div class="calc-wrap">
    <div class="calc-display"><div class="calc-expr"></div><div class="calc-num">0</div></div>
    <div class="calc-grid"></div>
  </div>`;
  const keys = ["%","CE","C","⌫","1/x","x²","√","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="];
  const grid = body.querySelector(".calc-grid");
  const num = body.querySelector(".calc-num");
  const expr = body.querySelector(".calc-expr");
  keys.forEach(k => {
    const b = document.createElement("button");
    b.textContent = k;
    if ("÷×−+".includes(k)) b.className = "op";
    if (k === "=") b.className = "eq";
    b.onclick = () => press(k);
    grid.appendChild(b);
  });
  function show() { num.textContent = cur.length > 14 ? Number(cur).toExponential(6) : cur; }
  function compute() {
    const a = parseFloat(prev), b = parseFloat(cur);
    if (op === "+") return a + b;
    if (op === "−") return a - b;
    if (op === "×") return a * b;
    if (op === "÷") return b === 0 ? NaN : a / b;
    return b;
  }
  function press(k) {
    if (/[0-9]/.test(k)) {
      cur = (fresh || cur === "0") ? k : cur + k; fresh = false;
    } else if (k === ".") {
      if (!cur.includes(".")) cur += ".";
      fresh = false;
    } else if (k === "C") { cur = "0"; prev = op = null; expr.textContent = ""; }
    else if (k === "CE") { cur = "0"; }
    else if (k === "⌫") { cur = cur.length > 1 ? cur.slice(0, -1) : "0"; }
    else if (k === "±") { cur = String(-parseFloat(cur)); }
    else if (k === "%") { cur = String(parseFloat(cur) / 100); }
    else if (k === "√") { cur = String(Math.sqrt(parseFloat(cur))); }
    else if (k === "x²") { cur = String(Math.pow(parseFloat(cur), 2)); }
    else if (k === "1/x") { cur = String(1 / parseFloat(cur)); }
    else if ("÷×−+".includes(k)) {
      if (prev != null && op && !fresh) { cur = String(compute()); }
      prev = cur; op = k; fresh = true;
      expr.textContent = prev + " " + op;
    } else if (k === "=") {
      if (op && prev != null) {
        expr.textContent = prev + " " + op + " " + cur + " =";
        cur = String(compute()); prev = op = null; fresh = true;
      }
    }
    show();
  }
  body.tabIndex = 0;
  setTimeout(() => body.focus(), 50);
  body.addEventListener("keydown", e => {
    const map = { "/": "÷", "*": "×", "-": "−", "+": "+", Enter: "=", Backspace: "⌫", Escape: "C" };
    const k = map[e.key] || e.key;
    if (keys.includes(k) || /[0-9.]/.test(k)) { e.preventDefault(); press(k); }
  });
};

APP_RENDER.notepad = function(body, rec, extra) {
  let fname = extra.fileName || "Untitled.txt";
  let folder = extra.folder || "Documents";
  rec.el.querySelector(".t-title").textContent = fname + " - Notepad";
  body.innerHTML = `<div class="flex flex-col h-full">
    <div class="np-menu">
      <div class="m">File
        <div class="np-drop">
          <div data-a="new">New<span>Ctrl+N</span></div>
          <div data-a="open">Open...</div>
          <div data-a="save">Save<span>Ctrl+S</span></div>
          <div data-a="saveas">Save As...</div>
          <div data-a="dl">Download</div>
          <div data-a="exit">Exit</div>
        </div>
      </div>
      <div class="m">Edit
        <div class="np-drop">
          <div data-a="undo">Undo</div>
          <div data-a="cut">Cut</div>
          <div data-a="copy">Copy</div>
          <div data-a="paste">Paste</div>
          <div data-a="all">Select All</div>
        </div>
      </div>
      <div class="m">View
        <div class="np-drop">
          <div data-a="wrap">Word wrap</div>
          <div data-a="zoomIn">Zoom in</div>
          <div data-a="zoomOut">Zoom out</div>
        </div>
      </div>
    </div>
    <textarea class="np-ta flex-1" spellcheck="false"></textarea>
    <div class="text-xs px-3 py-1 bg-[#f3f3f3] border-t border-black/10 flex justify-between"><span class="np-status">Ln 1, Col 1</span><span>UTF-8</span></div>
  </div>`;
  const ta = body.querySelector(".np-ta");
  ta.value = extra.content || "";
  ta.addEventListener("mouseup", upd);
  ta.addEventListener("keyup", upd);
  ta.addEventListener("input", upd);
  function upd() {
    const pos = ta.selectionStart;
    const lines = ta.value.slice(0, pos).split("\n");
    body.querySelector(".np-status").textContent = `Ln ${lines.length}, Col ${lines.pop().length + 1}`;
  }
  function save(as) {
    if (as || fname === "Untitled.txt") {
      const n = prompt("File name:", fname);
      if (!n) return;
      fname = n.endsWith(".txt") ? n : n + ".txt";
    }
    writeFile(folder, fname, { type: "file", ext: "txt", content: ta.value });
    rec.el.querySelector(".t-title").textContent = fname + " - Notepad";
  }
  body.querySelectorAll("[data-a]").forEach(el => {
    el.onclick = () => {
      const a = el.dataset.a;
      if (a === "new") ta.value = "";
      if (a === "save") save(false);
      if (a === "saveas") save(true);
      if (a === "dl") downloadText(fname, ta.value);
      if (a === "exit") closeWin(rec);
      if (a === "undo") document.execCommand("undo");
      if (a === "cut") { document.execCommand("cut"); }
      if (a === "copy") document.execCommand("copy");
      if (a === "paste") document.execCommand("paste");
      if (a === "all") { ta.select(); }
      if (a === "wrap") ta.style.whiteSpace = ta.style.whiteSpace === "nowrap" ? "pre-wrap" : "nowrap";
      if (a === "zoomIn") ta.style.fontSize = (parseInt(getComputedStyle(ta).fontSize) + 1) + "px";
      if (a === "zoomOut") ta.style.fontSize = (parseInt(getComputedStyle(ta).fontSize) - 1) + "px";
      if (a === "open") openApp("explorer", { startPath: "Documents" });
    };
  });
};

APP_RENDER.word = function(body, rec, extra) {
  let fname = extra.fileName || "Document.docx";
  rec.el.querySelector(".t-title").textContent = fname + " - Word";
  body.innerHTML = `<div class="flex flex-col h-full">

        </select>
        <select class="size-sel">

        </select>

APP_RENDER.paint = function(body, rec, extra) {
  extra = extra || {};
  body.innerHTML = `<div class="paint-ui">
    <div class="paint-bar">
      <button data-t="pencil" class="on" title="Pencil">✏️</button>
      <button data-t="brush" title="Brush">🖌️</button>
      <button data-t="eraser" title="Eraser">🧽</button>
      <button data-t="fill" title="Fill">🪣</button>
      <button data-t="line" title="Line">╱</button>
      <button data-t="rect" title="Rectangle">▭</button>
      <button data-t="ellipse" title="Ellipse">◯</button>
      <button data-t="picker" title="Color picker">💉</button>
      <input type="color" class="pcolor" value="#000000"/>
      <input type="range" class="psize" min="1" max="40" value="3"/>
      <button data-a="undo">Undo</button>
      <button data-a="clear">Clear</button>
      <button data-a="save">Save</button>
      <button data-a="dl">Download</button>
    </div>
    <div class="paint-canvas-wrap"><canvas width="860" height="520"></canvas></div>
  </div>`;
  const canvas = body.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  if (extra.content) {
    const im = new Image();
    im.onload = () => { ctx.drawImage(im, 0, 0, canvas.width, canvas.height); pushUndo(); };
    im.src = extra.content;
  }
  if (extra.fileName) rec.el.querySelector(".t-title").textContent = extra.fileName + " - Paint";
  let tool = "pencil", drawing = false, sx, sy, snapshot, color = "#000000", size = 3;
  const undo = [];
  function pushUndo() {
    undo.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    if (undo.length > 25) undo.shift();
  }
  pushUndo();
  body.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    body.querySelectorAll("[data-t]").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); tool = b.dataset.t;
  });
  body.querySelector(".pcolor").oninput = e => color = e.target.value;
  body.querySelector(".psize").oninput = e => size = +e.target.value;
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
  }
  canvas.onmousedown = e => {
    const p = pos(e);
    if (tool === "fill") { pushUndo(); flood(Math.floor(p.x), Math.floor(p.y), color); return; }
    if (tool === "picker") {
      const d = ctx.getImageData(p.x, p.y, 1, 1).data;
      color = rgbToHex(d[0], d[1], d[2]);
      body.querySelector(".pcolor").value = color;
      return;
    }
    drawing = true; sx = p.x; sy = p.y;
    snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = tool === "eraser" ? "#fff" : color;
    ctx.fillStyle = color;
    ctx.lineWidth = tool === "brush" ? size * 2.2 : tool === "eraser" ? size * 3 : size;
    if (tool === "pencil" || tool === "brush" || tool === "eraser") {
      pushUndo();
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
    }
  };
  canvas.onmousemove = e => {
    if (!drawing) return;
    const p = pos(e);
    if (tool === "pencil" || tool === "brush" || tool === "eraser") {
      ctx.lineTo(p.x, p.y); ctx.stroke();
    } else {
      ctx.putImageData(snapshot, 0, 0);
      ctx.beginPath();
      if (tool === "line") { ctx.moveTo(sx, sy); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      if (tool === "rect") { ctx.strokeRect(sx, sy, p.x - sx, p.y - sy); }
      if (tool === "ellipse") {
        ctx.beginPath();
        ctx.ellipse((sx+p.x)/2,(sy+p.y)/2, Math.abs(p.x-sx)/2, Math.abs(p.y-sy)/2, 0, 0, Math.PI*2);
        ctx.stroke();
      }
    }
  };
  window.addEventListener("mouseup", () => {
    if (drawing && (tool === "line" || tool === "rect" || tool === "ellipse")) pushUndo();
    drawing = false;
  });
  function flood(x, y, hex) {
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0,0,w,h);
    const d = img.data;
    const t = hexToRgb(hex);
    const i0 = (y * w + x) * 4;
    const sr = d[i0], sg = d[i0+1], sb = d[i0+2];
    if (sr === t[0] && sg === t[1] && sb === t[2]) return;
    const stack = [[x,y]];
    const seen = new Uint8Array(w*h);
    while (stack.length) {
      const [cx, cy] = stack.pop();
      if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
      const idx = cy * w + cx;
      if (seen[idx]) continue;
      const i = idx * 4;
      if (Math.abs(d[i]-sr)+Math.abs(d[i+1]-sg)+Math.abs(d[i+2]-sb) > 24) continue;
      seen[idx] = 1;
      d[i]=t[0]; d[i+1]=t[1]; d[i+2]=t[2]; d[i+3]=255;
      stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
    }
    ctx.putImageData(img,0,0);
  }
  body.querySelector("[data-a=undo]").onclick = () => {
    if (undo.length > 1) { undo.pop(); ctx.putImageData(undo[undo.length-1],0,0); }
  };
  body.querySelector("[data-a=clear]").onclick = () => { pushUndo(); ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height); };
  body.querySelector("[data-a=save]").onclick = () => {
    const n = prompt("File name:", "Drawing.png") || "Drawing.png";
    const name = n.endsWith(".png") ? n : n + ".png";
    writeFile("Pictures", name, { type: "file", ext: "png", content: canvas.toDataURL("image/png") });
    alert("Saved to Pictures\\" + name);
  };
  body.querySelector("[data-a=dl]").onclick = () => {
    const a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = "Drawing.png"; a.click();
  };
};

APP_RENDER.explorer = function(body, rec, extra) {

  body.innerHTML = `<div class="fe">

      <div class="fe-item" data-p="Desktop">🖥️ Desktop</div>

      <div class="fe-item" data-p="Music">🎵 Music</div>
      <div class="fe-item" data-p="Videos">🎬 Videos</div>
      <div class="fe-item" data-p="This PC">💻 This PC</div>

    </div>

      <div class="fe-toolbar">
        <button class="back">←</button>
        <button class="up">↑</button>

        <button class="del">Delete</button>
        <button class="ren">Rename</button>
      </div>
      <div class="fe-files"></div>
    </div>
  </div>`;
  const hist = [path];
  function render() {
    body.querySelectorAll(".fe-item").forEach(i => i.classList.toggle("on", i.dataset.p === path));
    body.querySelector(".fe-addr").textContent = path === "Home" ? "Home" : path.replace(/\//g, " › ");
    const node = getNode(path);
    const box = body.querySelector(".fe-files");
    box.innerHTML = "";
    if (!node || !node.children) { box.textContent = "This folder is empty."; return; }
    const names = Object.keys(node.children).sort((a,b) => {
      const da = node.children[a].type !== "file", db = node.children[b].type !== "file";
      if (da !== db) return da ? -1 : 1;
      return a.localeCompare(b);
    });
    names.forEach(name => {
      const item = node.children[name];
      const div = document.createElement("div");
      div.className = "fe-file";
      const ic = item.type === "file"
        ? (item.ext === "png" || item.ext === "jpg"
            ? `<img src="${ICONS.image}"/>`
            : `<img src="${ICONS.file}"/>`)
        : (item.type === "drive" ? `<img src="${ICONS.disk}"/>` : explorerSVG(40));
      div.innerHTML = `${ic}<div class="truncate">${name}</div>`;
      div.onclick = e => { e.stopPropagation(); selected = name; box.querySelectorAll(".fe-file").forEach(x => x.classList.remove("sel")); div.classList.add("sel"); };
      div.ondblclick = () => openItem(name, item);
      box.appendChild(div);
    });
    if (!names.length) box.innerHTML = `<div class="text-sm text-black/40 p-8 w-full text-center">This folder is empty</div>`;
  }
  function openItem(name, item) {
    if (item.type !== "file") {
      path = path === "Home" ? name : path + "/" + name;
      hist.push(path); render(); return;
    }
    if (item.ext === "txt") openApp("notepad", { fileName: name, content: item.content, folder: path, forceNew: true });
    else if (item.ext === "docx" || item.ext === "html") openApp("word", { fileName: name, content: item.content, forceNew: true });
    else if (item.ext === "png" || item.ext === "jpg") {
      openApp("paint", { forceNew: true, content: item.content, fileName: name });
    } else openApp("notepad", { fileName: name, content: item.content || "", forceNew: true });
  }
  body.querySelectorAll(".fe-item").forEach(i => i.onclick = () => { path = i.dataset.p; hist.push(path); render(); });
  body.querySelector(".back").onclick = () => { if (hist.length > 1) { hist.pop(); path = hist[hist.length-1]; render(); } };
  body.querySelector(".up").onclick = () => {
    if (path === "Home") return;
    const p = path.split("/"); p.pop();
    path = p.join("/") || "Home"; hist.push(path); render();
  };
  body.querySelector(".newf").onclick = () => {
    const n = prompt("Folder name:", "New folder");
    if (!n) return;
    const node = getNode(path);
    if (node && node.children) { node.children[n] = { type: "folder", children: {} }; saveFS(); render(); }
  };
  body.querySelector(".del").onclick = () => {
    if (!selected) return;
    const node = getNode(path);
    if (path !== "RecycleBin") {
      FS.RecycleBin.children[selected] = node.children[selected];
    }
    delete node.children[selected]; selected = null; saveFS(); render();
  };
  body.querySelector(".ren").onclick = () => {
    if (!selected) return;
    const n = prompt("Rename:", selected);
    if (!n || n === selected) return;
    const node = getNode(path);
    node.children[n] = node.children[selected];
    delete node.children[selected]; selected = n; saveFS(); render();
  };
  render();
};

APP_RENDER.chrome = function(body, rec) {
  let tabs = [{ id: 1, title: "New Tab", url: "", hist: [], idx: -1 }];
  let tid = 1, active = 1;
  body.innerHTML = `<div class="chr">
    <div class="chr-tabs"></div>
    <div class="chr-bar">
      <button class="back" title="Back">←</button>
      <button class="fwd" title="Forward">→</button>
      <button class="rel" title="Reload">↻</button>

      <input class="chr-omni" placeholder="Search Google or type a URL" spellcheck="false"/>
    </div>
    <div class="chr-content flex-1 relative min-h-0"></div>
  </div>`;
  const shortcuts = [
    { n: "Google", u: "https://www.google.com/webhp?igu=1", d: "google.com" },
    { n: "YouTube", u: "https://www.youtube.com", d: "youtube.com" },
    { n: "Wikipedia", u: "https://en.wikipedia.org", d: "wikipedia.org" },
    { n: "GitHub", u: "https://github.com", d: "github.com" },
    { n: "Gmail", u: "https://mail.google.com", d: "gmail.com" },
    { n: "Reddit", u: "https://www.reddit.com", d: "reddit.com" },
    { n: "Bing", u: "https://www.bing.com", d: "bing.com" },
    { n: "Maps", u: "https://www.google.com/maps?igu=1&output=embed", d: "maps.google.com" },
    { n: "Office", u: "https://www.office.com", d: "office.com" },
    { n: "DuckDuckGo", u: "https://duckduckgo.com", d: "duckduckgo.com" }
  ];
  function fav(d) { return `https://www.google.com/s2/favicons?domain=${d}&sz=64`; }
  function tab() { return tabs.find(t => t.id === active); }
  function toUrl(q) {
    q = q.trim();
    if (!q) return "";
    if (/^https?:\/\//i.test(q)) return q;
    if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(q)) return "https://" + q;
    return "https://www.google.com/search?igu=1&q=" + encodeURIComponent(q);
  }
  function iframeUrl(url) {
    if (!url) return "";
    try {
      const u = new URL(url);
      if (u.hostname.includes("google.com") && !u.search.includes("igu=1")) {
        u.searchParams.set("igu", "1");
        return u.toString();
      }
    } catch(e) {}
    return url;
  }
  function renderTabs() {
    const bar = body.querySelector(".chr-tabs");
    bar.innerHTML = "";
    tabs.forEach(t => {
      const d = document.createElement("div");
      d.className = "chr-tab" + (t.id === active ? " on" : "");
      d.innerHTML = `<img src="${t.url ? fav(t.url) : ICONS.chrome}" onerror="this.style.display='none'"/><span class="truncate flex-1">${t.title}</span><span class="x">×</span>`;
      d.onclick = e => { if (e.target.classList.contains("x")) { closeTab(t.id); return; } active = t.id; paint(); };
      bar.appendChild(d);
    });
    const add = document.createElement("button");
    add.className = "chr-new"; add.textContent = "+";
    add.onclick = () => { tabs.push({ id: ++tid, title: "New Tab", url: "", hist: [], idx: -1 }); active = tid; paint(); };
    bar.appendChild(add);
  }
  function closeTab(id) {
    tabs = tabs.filter(t => t.id !== id);
    if (!tabs.length) { closeWin(rec); return; }
    if (active === id) active = tabs[tabs.length-1].id;
    paint();
  }
  function navigate(url, push) {
    const t = tab();
    url = toUrl(url);
    t.url = url;
    try { t.title = new URL(url).hostname.replace("www.", ""); } catch(e) { t.title = url || "New Tab"; }
    if (push !== false) {
      t.hist = t.hist.slice(0, t.idx + 1);
      t.hist.push(url); t.idx = t.hist.length - 1;
    }
    rec.el.querySelector(".t-title").textContent = t.title + " - Google Chrome";
    paint(true);
  }
  function paint(keepNav) {
    renderTabs();
    const t = tab();
    const omni = body.querySelector(".chr-omni");
    if (!keepNav) omni.value = t.url || "";
    const content = body.querySelector(".chr-content");
    if (!t.url) {
      content.innerHTML = `<div class="ntp">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" width="272" alt="Google" class="mb-8" onerror="this.src='https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png'"/>
        <form class="ntp-form w-full flex justify-center"><input class="ntp-search" placeholder="Search Google or type a URL"/></form>
        <div class="ntp-grid"></div>
      </div>`;
      const grid = content.querySelector(".ntp-grid");
      shortcuts.forEach(s => {
        const a = document.createElement("div");
        a.className = "ntp-sc";
        a.innerHTML = `<div class="av"><img src="${fav(s.d)}"/></div><span>${s.n}</span>`;
        a.onclick = () => navigate(s.u);
        grid.appendChild(a);
      });
      content.querySelector(".ntp-form").onsubmit = e => {
        e.preventDefault();
        navigate(content.querySelector(".ntp-search").value);
      };
    } else {
      const src = iframeUrl(t.url);
      content.innerHTML = `<iframe class="chr-frame" src="${src.replace(/"/g,"&quot;")}"></iframe>`;
    }
  }
  body.querySelector(".chr-omni").addEventListener("keydown", e => {
    if (e.key === "Enter") navigate(e.target.value);
  });
  body.querySelector(".back").onclick = () => {
    const t = tab(); if (t.idx > 0) { t.idx--; t.url = t.hist[t.idx]; paint(); }
  };
  body.querySelector(".fwd").onclick = () => {
    const t = tab(); if (t.idx < t.hist.length - 1) { t.idx++; t.url = t.hist[t.idx]; paint(); }
  };
  body.querySelector(".rel").onclick = () => paint();
  body.querySelector(".home").onclick = () => { tab().url = ""; tab().title = "New Tab"; paint(); };
  paint();
};

function rgbToHex(r,g,b){ return "#" + [r,g,b].map(x => x.toString(16).padStart(2,"0")).join(""); }
function hexToRgb(hex){ const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return m ? [parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)] : [0,0,0]; }
function downloadText(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = name; a.click();
}

function renderTaskbar() {
  const c = document.getElementById("tb-center");
  const startActive = document.getElementById("start-menu").classList.contains("show");
  const searchActive = document.getElementById("search-panel").classList.contains("show");
  const widgetsActive = document.getElementById("widgets-panel").classList.contains("show");
  const tvActive = document.getElementById("taskview").classList.contains("show");
  c.innerHTML = "";
  function addSys(id, html, title, on) {
    const b = document.createElement("button");
    b.className = "tb-btn" + (on ? " active-menu" : "");
    b.title = title; b.innerHTML = html;
    b.onclick = e => { e.stopPropagation(); sysClick(id); };
    c.appendChild(b);
  }
  addSys("start", winLogo(22), "Start", startActive);
  addSys("search", searchSvg(), "Search", searchActive);
  addSys("taskview", taskviewSvg(), "Task view", tvActive);
  addSys("widgets", widgetsSvg(), "Widgets", widgetsActive);
  const seen = new Set();
  PINNED_TB.forEach(id => {
    seen.add(id);
    const app = APPS[id];
    const open = windows.filter(w => w.appId === id);
    const focused = open.find(w => w.el.classList.contains("active") && !w.minimized);
    const b = document.createElement("button");
    b.className = "tb-btn" + (open.length ? " open-app" : "") + (focused ? " focused" : "");
    b.title = app.name;
    b.innerHTML = appIcon(app, 24) + (open.length ? `<span class="pill"></span>` : "");
    b.onclick = e => {
      e.stopPropagation();
      hideFlyouts();
      if (!open.length) openApp(id);
      else if (focused) minimizeWin(focused);
      else restoreFocus(open[open.length-1]);
    };
    c.appendChild(b);
  });
  windows.forEach(w => {
    if (seen.has(w.appId)) return;
    seen.add(w.appId);
    const focused = w.el.classList.contains("active") && !w.minimized;
    const b = document.createElement("button");
    b.className = "tb-btn open-app" + (focused ? " focused" : "");
    b.title = w.app.name;
    b.innerHTML = appIcon(w.app, 24) + `<span class="pill"></span>`;
    b.onclick = e => { e.stopPropagation(); hideFlyouts(); focused ? minimizeWin(w) : restoreFocus(w); };
    c.appendChild(b);
  });
}

function sysClick(id) {
  if (id === "start") toggleFly("start-menu");
  if (id === "search") { toggleFly("search-panel"); setTimeout(() => document.getElementById("os-search").focus(), 50); }
  if (id === "widgets") toggleFly("widgets-panel");
  if (id === "taskview") toggleTaskView();
  renderTaskbar();
}

function hideFlyouts() {
  document.querySelectorAll(".flyout").forEach(f => f.classList.remove("show"));
  document.getElementById("ctx-menu").classList.remove("show");
  document.getElementById("taskview").classList.remove("show");
  renderTaskbar();
}
function toggleFly(id) {
  const el = document.getElementById(id);
  const on = el.classList.contains("show");
  hideFlyouts();
  if (!on) el.classList.add("show");
}

function toggleTaskView() {
  const tv = document.getElementById("taskview");
  const on = tv.classList.contains("show");
  hideFlyouts();
  if (on) return;
  tv.classList.add("show");
  tv.innerHTML = "";
  if (!windows.length) {
    tv.innerHTML = `<div class="text-white text-xl">No open windows</div>`;
    return;
  }
  windows.forEach(w => {
    const c = document.createElement("div");
    c.className = "tv-card";
    c.innerHTML = `<h4>${appIcon(w.app, 16)} ${w.app.name}</h4><div class="tv-preview">${appIcon(w.app, 64)}</div>`;
    c.onclick = () => { hideFlyouts(); restoreFocus(w); };
    tv.appendChild(c);
  });
}

/* ---------- Start / search ---------- */
function fillStart() {
  const g = document.getElementById("pinned-grid");
  g.innerHTML = "";
  Object.values(APPS).forEach(app => {
    const d = document.createElement("div");
    d.className = "pin-app";
    d.innerHTML = `${appIcon(app, 32)}<span>${app.name.replace("Google ","")}</span>`;
    d.onclick = () => openApp(app.id);
    g.appendChild(d);
  });
  const rec = document.getElementById("recommended");
  rec.innerHTML = `
    <div class="flex items-center gap-3 p-2 rounded hover:bg-white/50 pin-app-rec" data-a="notepad"><img src="${ICONS.notepad}" class="w-8 h-8 object-contain" onerror="this.src='${ICONS.notepad2}'"/><div><div>Welcome.txt</div><div class="text-xs text-black/50">Recently opened</div></div></div>
    <div class="flex items-center gap-3 p-2 rounded hover:bg-white/50 pin-app-rec" data-a="word"><img src="${ICONS.word}" class="w-8 h-8 object-contain" onerror="this.src='${ICONS.word2}'"/><div><div>Notes.docx</div><div class="text-xs text-black/50">Yesterday</div></div></div>`;
  rec.querySelectorAll("[data-a]").forEach(el => el.onclick = () => openApp(el.dataset.a));
  document.getElementById("start-search").oninput = e => filterApps(e.target.value, g);
  document.getElementById("start-search").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const vis = [...g.children].filter(c => c.style.display !== "none");
    if (vis[0]) vis[0].click();
  });
  document.getElementById("os-search").oninput = e => {
    const q = e.target.value.toLowerCase();
    const box = document.getElementById("search-results");
    box.innerHTML = "";
    Object.values(APPS).filter(a => a.name.toLowerCase().includes(q) || !q).forEach(app => {
      const d = document.createElement("div");
      d.className = "flex items-center gap-3 p-2 rounded hover:bg-white/60 cursor-default";
      d.innerHTML = `${appIcon(app, 28)}<span>${app.name}</span>`;
      d.onclick = () => openApp(app.id);
      box.appendChild(d);
    });
  };
}
function filterApps(q, g) {
  q = q.toLowerCase();
  [...g.children].forEach(ch => {
    ch.style.display = ch.textContent.toLowerCase().includes(q) || !q ? "" : "none";
  });
}

/* ---------- Clock / calendar ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function updateClock() {
  const now = new Date();
  let h = now.getHours(); const am = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  const t = `${h}:${pad(now.getMinutes())} ${am}`;
  const d = `${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()}`;
  document.getElementById("clock-time").textContent = t;
  document.getElementById("clock-date").textContent = d;
  const long = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  document.getElementById("wid-time").textContent = t;
  document.getElementById("wid-date").textContent = long;
  document.getElementById("cal-big-time").textContent = `${h}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${am}`;
  document.getElementById("cal-big-date").textContent = long;
}
function drawCal(el) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  let html = `<div class="grid grid-cols-7 gap-1 text-center text-xs">`;
  ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(d => html += `<div class="text-black/40 py-1">${d}</div>`);
  for (let i=0;i<first;i++) html += `<div></div>`;
  for (let i=1;i<=days;i++) {
    const on = i === now.getDate();
    html += `<div class="py-1 rounded-full ${on?"bg-sky-600 text-white":""}">${i}</div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

/* ---------- Context menu ---------- */
document.getElementById("desktop").addEventListener("contextmenu", e => {
  if (e.target.closest(".win")) return;
  e.preventDefault();
  const m = document.getElementById("ctx-menu");
  m.innerHTML = `
    <div class="ctx-item" data-x="refresh">Refresh</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-x="word">Open Word</div>
    <div class="ctx-item" data-x="paint">Open Paint</div>
    <div class="ctx-item" data-x="notepad">New text file</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-x="dark">Switch wallpaper</div>
    <div class="ctx-item" data-x="settings">Display settings</div>`;
  m.classList.add("show");
  const x = Math.min(e.clientX, window.innerWidth - 260);
  const y = Math.min(e.clientY, window.innerHeight - 280);
  m.style.left = x + "px"; m.style.top = y + "px";
  m.onclick = ev => {
    const x = ev.target.closest("[data-x]");
    if (!x) return;
    const k = x.dataset.x;
    if (k === "refresh") renderDesktopIcons();
    if (k === "word" || k === "paint") openApp(k);
    if (k === "notepad") openApp("notepad");
    if (k === "dark") toggleWallpaper();
    if (k === "settings") alert("Display: " + screen.width + " × " + screen.height + "\nScale: 100%");
    m.classList.remove("show");
  };
});

let darkWall = false;
function setWallpaper(url) {
  const desk = document.getElementById("desktop");
  desk.style.backgroundImage = `url("${url}")`;
}
function toggleWallpaper() {
  darkWall = !darkWall;
  setWallpaper(darkWall ? WALLPAPER_DARK : WALLPAPER);
}

document.addEventListener("click", e => {
  if (!e.target.closest(".flyout") && !e.target.closest(".tb-btn") && !e.target.closest(".tray-btn")) {
    document.querySelectorAll(".flyout").forEach(f => f.classList.remove("show"));
    document.getElementById("taskview").classList.remove("show");
    renderTaskbar();
  }
  if (!e.target.closest("#ctx-menu")) document.getElementById("ctx-menu").classList.remove("show");
  if (!e.target.closest(".desk-icon")) document.querySelectorAll(".desk-icon").forEach(x => x.classList.remove("selected"));
});

document.getElementById("clock-btn").onclick = e => { e.stopPropagation(); toggleFly("calendar-panel"); };
document.getElementById("qs-btn").onclick = e => { e.stopPropagation(); toggleFly("quick-panel"); };
document.getElementById("show-desk").onclick = () => {
  const anyVis = windows.some(w => !w.minimized);
  windows.forEach(w => { if (anyVis) minimizeWin(w); else restoreFocus(w); });
};
document.getElementById("power-btn").onclick = () => location.reload();
document.getElementById("all-apps-btn").onclick = () => {
  hideFlyouts();
  document.getElementById("search-panel").classList.add("show");
  document.getElementById("os-search").dispatchEvent(new Event("input"));
  document.getElementById("os-search").focus();
};

document.querySelectorAll("[data-qs]").forEach(b => {
  b.onclick = () => {
    b.classList.toggle("on");
    if (b.dataset.qs === "night") document.getElementById("desktop").classList.toggle("night", b.classList.contains("on"));
    if (b.dataset.qs === "air") {
      const wifi = document.querySelector('[data-qs="wifi"]');
      if (b.classList.contains("on")) wifi.classList.remove("on");
    }
  };
});
document.getElementById("bri-slider").oninput = e => {
  document.getElementById("desktop").style.filter = `brightness(${e.target.value / 100})`;
};

document.addEventListener("keydown", e => {
  if (e.key === "Escape") hideFlyouts();
  if ((e.metaKey || (e.ctrlKey && e.altKey)) && (e.key === "Meta" || e.key === " ")) {
    e.preventDefault(); sysClick("start");
  }
});

/* ---------- Boot / wallpaper load ---------- */
function loadWallpaper() {
  const urls = [
    WALLPAPER,
    WALLPAPER_FALLBACK,
    "https://upload.wikimedia.org/wikipedia/en/9/92/Windows_11_Desktop.png"
  ];
  let i = 0;
  function tryNext() {
    if (i >= urls.length) {
      document.getElementById("desktop").style.background =
        "radial-gradient(ellipse at 35% 40%, #6ea8d3 0%, #8eb6cc 35%, #c5cdd3 70%, #d5dbe0 100%)";
      return;
    }
    const img = new Image();
    img.onload = () => setWallpaper(urls[i]);
    img.onerror = () => { i++; tryNext(); };
    img.src = urls[i];
  }
  tryNext();
}

document.getElementById("news-img").src = "https://images.pexels.com/photos/34939150/pexels-photo-34939150.jpeg?auto=compress&cs=tinysrgb&w=800";
document.getElementById("news-img").onerror = function(){ this.src = "https://images.pexels.com/photos/7135012/pexels-photo-7135012.jpeg?auto=compress&cs=tinysrgb&w=800"; };

fetch("https://api.open-meteo.com/v1/forecast?latitude=40.71&longitude=-74.01&current_weather=true")
  .then(r => r.json())
  .then(d => {
    const t = Math.round(d.current_weather.temperature * 9/5 + 32);
    document.getElementById("weather-temp").textContent = t + "°";
    const codes = {0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",61:"Rain",71:"Snow"};
    document.getElementById("weather-desc").textContent = (codes[d.current_weather.weathercode] || "Cloudy") + " · New York";
  }).catch(()=>{});

renderDesktopIcons();
fillStart();
renderTaskbar();
drawCal(document.getElementById("cal-grid"));
drawCal(document.getElementById("wid-cal"));
updateClock();
setInterval(updateClock, 1000);
loadWallpaper();
setTimeout(() => document.getElementById("boot").classList.add("hide"), 2200);
</script>
