<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Courier New, monospace">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#005577" stroke-width="1"/>
    </pattern>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00ffff"/>
    </marker>
    <marker id="sectionArrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff4d4d"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0b1e3b"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- TITLE BLOCK -->
  <g transform="translate(50,1100)">
    <rect width="1500" height="90" fill="#0b1e3b" stroke="#00ffff" stroke-width="2"/>
    <text x="20" y="30" fill="#00ffff" font-size="26" font-weight="bold">PROJECT AURORA-X OTV</text>
    <text x="20" y="55" fill="#8abbd7" font-size="14">ORBITAL TRANSFER VEHICLE - INTEGRATED SYSTEMS SCHEMATIC</text>
    <text x="1100" y="30" fill="#00ffff" font-size="14">DWG NO: AX-OTV-2024-01</text>
    <text x="1100" y="55" fill="#00ffff" font-size="14">SCALE 1:75</text>
    <text x="1380" y="30" fill="#00ffff" font-size="14">REV C</text>
    <text x="1380" y="55" fill="#00ffff" font-size="14">SHEET 1/1</text>
  </g>

  <!-- VIEW A TOP PLAN -->
  <g transform="translate(50,50)">
    <text x="350" y="25" fill="#00ffff" font-size="18" text-anchor="middle" font-weight="bold">VIEW A: TOP PLAN</text>
    <ellipse cx="350" cy="300" rx="70" ry="220" fill="none" stroke="#00ffff" stroke-width="2"/>
    <!-- cargo doors -->
    <line x1="280" y1="80" x2="420" y2="80" stroke="#00ffff" stroke-width="1.5"/>
    <line x1="280" y1="520" x2="420" y2="520" stroke="#00ffff" stroke-width="1.5"/>
    <path d="M280 80 L280 520 M420 80 L420 520" stroke="#00ffff" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="350" y="65" fill="#00ffff" font-size="10" text-anchor="middle">CARGO BAY DOORS</text>
    <!-- docking port -->
    <rect x="330" y="40" width="40" height="30" fill="#0b1e3b" stroke="#00ffff" stroke-width="2"/>
    <circle cx="350" cy="55" r="6" fill="#00ffff"/>
    <text x="350" y="30" fill="#00ffff" font-size="10" text-anchor="middle">DOCKING PORT</text>
    <!-- solar arrays -->
    <rect x="10" y="240" width="80" height="120" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <g stroke="#00ffff" stroke-width="0.6">
      <line x1="20" y1="250" x2="20" y2="350"/><line x1="40" y1="250" x2="40" y2="350"/>
      <line x1="60" y1="250" x2="60" y2="350"/><line x1="80" y1="250" x2="80" y2="350"/>
    </g>
    <text x="50" y="235" fill="#00ffff" font-size="10" text-anchor="middle">SOLAR ARRAY PORT</text>
    <rect x="610" y="240" width="80" height="120" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <g stroke="#00ffff" stroke-width="0.6">
      <line x1="620" y1="250" x2="620" y2="350"/><line x1="640" y1="250" x2="640" y2="350"/>
      <line x1="660" y1="250" x2="660" y2="350"/><line x1="680" y1="250" x2="680" y2="350"/>
    </g>
    <text x="650" y="235" fill="#00ffff" font-size="10" text-anchor="middle">SOLAR ARRAY STBD</text>
    <!-- radiators -->
    <polygon points="250,300 150,250 150,350" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <polygon points="450,300 550,250 550,350" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="150" y="240" fill="#00ffff" font-size="10" text-anchor="middle">RADIATOR</text>
    <text x="550" y="240" fill="#00ffff" font-size="10" text-anchor="middle">RADIATOR</text>
    <!-- engines -->
    <circle cx="350" cy="520" r="25" fill="none" stroke="#00ffff" stroke-width="2"/>
    <text x="350" y="560" fill="#00ffff" font-size="12" text-anchor="middle">ENGINE CLUSTER</text>
    <!-- centerline -->
    <line x1="350" y1="60" x2="350" y2="540" stroke="#00ffff" stroke-width="1" stroke-dasharray="5 5"/>
    <!-- dims -->
    <line x1="750" y1="80" x2="750" y2="520" stroke="#00ffff" stroke-width="1.5" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="770" y="300" fill="#00ffff" font-size="12">32.0 m</text>
  </g>

  <!-- VIEW B SIDE -->
  <g transform="translate(850,50)">
    <text x="350" y="25" fill="#00ffff" font-size="18" text-anchor="middle" font-weight="bold">VIEW B: STARBOARD SIDE</text>
    <path d="M350 50 L390 140 L390 240 L430 290 L430 470 L390 520 L350 520 Z" fill="none" stroke="#00ffff" stroke-width="2.5"/>
    <path d="M350 50 C 280 100 280 140 350 140" fill="none" stroke="#00ffff" stroke-width="2.5"/>
    <rect x="360" y="130" width="40" height="30" fill="#0b1e3b" stroke="#00ffff" stroke-width="1.5"/>
    <text x="380" y="125" fill="#00ffff" font-size="11" text-anchor="middle">COCKPIT</text>
    <rect x="370" y="150" width="60" height="90" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="400" y="195" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90 400 195)">CREW MODULE</text>
    <rect x="380" y="250" width="50" height="35" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="405" y="270" fill="#00ffff" font-size="10" text-anchor="middle">AIRLOCK</text>
    <rect x="370" y="295" width="60" height="40" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="400" y="330" fill="#00ffff" font-size="9" text-anchor="middle" transform="rotate(90 400 330)">LIFE SUPPORT</text>
    <rect x="380" y="345" width="50" height="70" fill="url(#hatch)" stroke="#00ffff" stroke-width="1.5"/>
    <text x="405" y="380" fill="#00ffff" font-size="10" text-anchor="middle">CARGO BAY</text>
    <rect x="370" y="425" width="60" height="70" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="400" y="460" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90 400 460)">PROPELLANT TANKS</text>
    <rect x="430" y="170" width="25" height="50" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="442" y="195" fill="#00ffff" font-size="9" text-anchor="middle" transform="rotate(90 442 195)">AVIONICS</text>
    <path d="M370 490 L440 490 L455 550 L365 550 Z" fill="none" stroke="#00ffff" stroke-width="2"/>
    <text x="405" y="520" fill="#00ffff" font-size="12" text-anchor="middle">MAIN ENGINE</text>
    <path d="M400 520 L400 600 L430 630" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="400" y="560" fill="#00ffff" font-size="10">LANDING GEAR</text>
    <line x1="350" y1="180" x2="350" y2="220" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="350" cy="220" r="7" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="350" y="245" fill="#00ffff" font-size="10" text-anchor="middle">ANTENNA</text>
    <line x1="480" y1="50" x2="480" y2="550" stroke="#00ffff" stroke-width="1.5" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="495" y="300" fill="#00ffff" font-size="12">18.5 m</text>
    <!-- section line A-A -->
    <line x1="350" y1="40" x2="350" y2="520" stroke="#ff4d4d" stroke-width="2.5" stroke-dasharray="8 4"/>
    <text x="330" y="30" fill="#ff4d4d" font-size="14" font-weight="bold">A</text>
    <text x="330" y="535" fill="#ff4d4d" font-size="14" font-weight="bold">A</text>
  </g>

  <!-- VIEW C FRONT -->
  <g transform="translate(50,650)">
    <text x="350" y="25" fill="#00ffff" font-size="18" text-anchor="middle" font-weight="bold">VIEW C: FRONT ELEVATION</text>
    <circle cx="350" cy="280" r="95" fill="none" stroke="#00ffff" stroke-width="2.5"/>
    <circle cx="350" cy="280" r="75" fill="none" stroke="#00ffff" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 280 240 A 70 70 0 0 1 420 240" fill="none" stroke="#00ffff" stroke-width="2"/>
    <text x="350" y="220" fill="#00ffff" font-size="12" text-anchor="middle">COCKPIT WINDOWS</text>
    <circle cx="275" cy="280" r="12" fill="#0b1e3b" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="425" cy="280" r="12" fill="#0b1e3b" stroke="#00ffff" stroke-width="1.5"/>
    <text x="275" y="305" fill="#00ffff" font-size="10" text-anchor="middle">A/L</text>
    <text x="425" y="305" fill="#00ffff" font-size="10" text-anchor="middle">A/L</text>
    <rect x="170" y="240" width="35" height="80" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <rect x="525" y="240" width="35" height="80" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="187" y="225" fill="#00ffff" font-size="10" text-anchor="middle">RADIATOR</text>
    <text x="542" y="225" fill="#00ffff" font-size="10" text-anchor="middle">RADIATOR</text>
    <path d="M 260 280 L 120 230 L 120 330 Z" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <path d="M 440 280 L 580 230 L 580 330 Z" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <line x1="300" y1="340" x2="280" y2="380" stroke="#00ffff" stroke-width="1.5"/>
    <line x1="400" y1="340" x2="420" y2="380" stroke="#00ffff" stroke-width="1.5"/>
    <text x="350" y="405" fill="#00ffff" font-size="12" text-anchor="middle">LANDING GEAR</text>
    <circle cx="220" cy="280" r="5" fill="#ff6b6b"/>
    <circle cx="480" cy="280" r="5" fill="#ff6b6b"/>
    <line x1="720" y1="180" x2="720" y2="380" stroke="#00ffff" stroke-width="1.5" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="740" y="280" fill="#00ffff" font-size="12">5.0 m</text>
  </g>

  <!-- VIEW D CUTAWAY A-A -->
  <g transform="translate(850,650)">
    <text x="350" y="25" fill="#00ffff" font-size="18" text-anchor="middle" font-weight="bold">VIEW D: SECTION A-A</text>
    <path d="M350 60 L390 150 L390 250 L430 300 L430 480 L390 530 L350 530 Z" fill="#0b1e3b" stroke="#00ffff" stroke-width="2.5"/>
    <rect x="360" y="70" width="50" height="50" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="385" y="95" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90 385 95)">AVIONICS</text>
    <rect x="360" y="130" width="50" height="80" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="385" y="170" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90 385 170)">CREW MODULE</text>
    <rect x="360" y="230" width="50" height="30" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="385" y="245" fill="#00ffff" font-size="10" text-anchor="middle">AIRLOCK</text>
    <rect x="360" y="270" width="50" height="40" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="385" y="290" fill="#00ffff" font-size="9" text-anchor="middle" transform="rotate(90 385 290)">LIFE SUPPORT</text>
    <rect x="360" y="320" width="50" height="70" fill="url(#hatch)" stroke="#00ffff" stroke-width="1.5"/>
    <text x="385" y="355" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90 385 355)">CARGO</text>
    <rect x="360" y="400" width="50" height="70" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="385" y="435" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90 385 435)">PROPELLANT</text>
    <path d="M370 480 L430 480 L445 530 L355 530 Z" fill="none" stroke="#00ffff" stroke-width="1.5"/>
    <text x="400" y="505" fill="#00ffff" font-size="11" text-anchor="middle">ENGINE</text>
    <!-- callouts -->
    <line x1="440" y1="95" x2="530" y2="95" stroke="#00ffff" stroke-width="1"/>
    <text x="540" y="100" fill="#00ffff" font-size="10">1 AVIONICS BAY</text>
    <line x1="440" y1="170" x2="530" y2="170" stroke="#00ffff" stroke-width="1"/>
    <text x="540" y="175" fill="#00ffff" font-size="10">2 CREW MODULE</text>
    <line x1="440" y1="355" x2="530" y2="355" stroke="#00ffff" stroke-width="1"/>
    <text x="540" y="360" fill="#00ffff" font-size="10">3 CARGO BAY</text>
    <line x1="440" y1="435" x2="530" y2="435" stroke="#00ffff" stroke-width="1"/>
    <text x="540" y="440" fill="#00ffff" font-size="10">4 PROPELLANT TANKS</text>
  </g>

  <!-- REAR VIEW INSET -->
  <g transform="translate(1300,750)">
    <rect x="0" y="0" width="200" height="200" fill="#0b1e3b" stroke="#00ffff" stroke-width="1.5"/>
    <text x="100" y="25" fill="#00ffff" font-size="14" text-anchor="middle" font-weight="bold">VIEW E: REAR</text>
    <circle cx="100" cy="110" r="45" fill="none" stroke="#00ffff" stroke-width="2"/>
    <circle cx="100" cy="110" r="20" fill="#0b1e3b" stroke="#00ffff" stroke-width="1.5"/>
    <circle cx="75" cy="90" r="8" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
    <circle cx="125" cy="90" r="8" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
    <circle cx="75" cy="130" r="8" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
    <circle cx="125" cy="130" r="8" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="100" y="180" fill="#00ffff" font-size="12" text-anchor="middle">ENGINE NOZZLE CLUSTER</text>
  </g>

  <!-- SCALE & NOTES -->
  <g transform="translate(1300, 50)">
    <rect width="220" height="600" fill="#0c2440" stroke="#00ffff" stroke-width="1.5"/>
    <text x="20" y="30" fill="#00ffff" font-size="16" font-weight="bold">SYSTEMS LEGEND</text>
    <text x="20" y="55" fill="#8abbd7" font-size="12">A CREW MODULE</text>
    <text x="20" y="70" fill="#8abbd7" font-size="12">B COCKPIT</text>
    <text x="20" y="85" fill="#8abbd7" font-size="12">C DOCKING PORT</text>
    <text x="20" y="100" fill="#8abbd7" font-size="12">D SOLAR ARRAYS</text>
    <text x="20" y="115" fill="#8abbd7" font-size="12">E RADIATORS</text>
    <text x="20" y="130" fill="#8abbd7" font-size="12">F PROPELLANT TANKS</text>
    <text x="20" y="145" fill="#8abbd7" font-size="12">G MAIN ENGINE</text>
    <text x="20" y="160" fill="#8abbd7" font-size="12">H CARGO BAY</text>
    <text x="20" y="175" fill="#8abbd7" font-size="12">I LIFE SUPPORT</text>
    <text x="20" y="190" fill="#8abbd7" font-size="12">J AVIONICS</text>
    <text x="20" y="205" fill="#8abbd7" font-size="12">K LANDING GEAR</text>
    <text x="20" y="220" fill="#8abbd7" font-size="12">L AIRLOCKS</text>
    <text x="20" y="235" fill="#8abbd7" font-size="12">M ANTENNA</text>
    <text x="20" y="280" fill="#00ffff" font-size="14" font-weight="bold">NOTES</text>
    <text x="20" y="305" fill="#8abbd7" font-size="11">1. ALL DIMENSIONS IN METERS</text>
    <text x="20" y="320" fill="#8abbd7" font-size="11">2. MASS 18,500 KG DRY</text>
    <text x="20" y="335" fill="#8abbd7" font-size="11">3. CREW CAP 6</text>
    <text x="20" y="350" fill="#8abbd7" font-size="11">4. PROPELLANT LOX/LH2</text>
    <line x1="20" y1="380" x2="200" y2="380" stroke="#00ffff" stroke-width="2"/>
    <line x1="20" y1="370" x2="20" y2="390" stroke="#00ffff" stroke-width="2"/>
    <line x1="200" y1="370" x2="200" y2="390" stroke="#00ffff" stroke-width="2"/>
    <text x="110" y="410" fill="#00ffff" font-size="12" text-anchor="middle">5.0 m SCALE</text>
  </g>
</svg>