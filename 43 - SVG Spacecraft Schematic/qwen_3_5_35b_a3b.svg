<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <defs>
    <!-- Blueprint Style Styles -->
    <style>
      .outline { stroke: #007BFF; stroke-width: 3px; fill: none; }
      .detail { stroke: #0059b3; stroke-width: 1px; fill: none; }
      .section-hatch { stroke: #0059b3; stroke-width: 1px; fill: rgba(0, 123, 255, 0.1); stroke-dasharray: 4, 2; }
      .hidden { stroke: #AABBCC; stroke-width: 1px; stroke-dasharray: 8, 4; fill: none; }
      .dim-line { stroke: #FFFFFF; stroke-width: 1px; marker-end: url(#arrow); stroke-dasharray: 4, 4; }
      .leader { stroke: #CCCCCC; stroke-width: 1px; fill: #CCCCCC; }
      .label { font-family: 'Courier New', monospace; font-size: 14px; fill: #FFFFFF; text-anchor: middle; font-weight: bold; letter-spacing: -0.5px; opacity: 0.8;}
      .dim-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #FFFFFF; }
      .highlight { stroke: #FFD700; stroke-width: 1.5px; fill: none; }
      
      /* Gradients for depth */
      <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="100%" stop-color="#cccccc" />
      </linearGradient>
    </style>
    
    <!-- Markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFD700" />
    </marker>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
       <circle cx="3" cy="3" r="2" fill="#007BFF" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="1400" height="1000" fill="#0a0e17" />
  <g transform="translate(0,0)" opacity="0.1">
     <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
       <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#007BFF" stroke-width="0.5"/>
     </pattern>
     <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- Title Block Area -->
  <text x="50" y="30" class="label" font-size="24" style="fill:#FFFFFF">ORION X-7 INTERSTELLAR TRANSFER VEHICLE</text>
  <text x="50" y="55" class="label" font-size="12" style="fill:#AAA">DRW NO: AX-992-BLUEPRINT v4.2 | REV C | SCHEMATIC ONLY</text>
  
  <!-- ======================= MAIN SPACECRAFT GROUP ======================= -->
  <g transform="translate(100, 150)">
    
    <!-- ========================================= VIEW 1: TOP VIEW ========================================= -->
    <g transform="translate(300, 0)" id="top-view">
      <text x="-10" y="0" class="label" font-size="18">TOP VIEW (PLAN)</text>
      
      <!-- Fuselage Top -->
      <path class="outline" d="M0,0 C-20,-20 0,-40 50,-40 L100,-40 C120,-40 140,-20 120,0 Z" /> <!-- Nose -->
      <path class="outline" d="M100,-40 L110,-30 L120,-30 L130,-40 L300,-40 L300,100 L200,100 L140,40 L130,40 L120,30 L110,40 L100,100 L10,-50 Z" />
      
      <!-- Wings -->
      <path class="outline" d="M300,-40 L350,-120 L500,-50 L400,-30 Z" /> <!-- Left Wing -->
      <path class="outline" d="M300,40 L350,120 L500,50 L400,30 Z" /> <!-- Right Wing -->
      
      <!-- Vertical Stabilizer -->
      <path class="outline" d="M300,100 L280,250 L320,250 Z" />
      
      <!-- Cutout Detail (Engine Bay Top) -->
      <path class="detail" d="M270,100 L270,120 L330,120 L330,100 Z" />

      <!-- Solar Arrays Deployment Lines (Top Down) -->
      <line class="dim-line" x1="400" y1="-65" x2="600" y2="-65" marker-start="url(#dot)" marker-end="url(#dot)" />
      <text x="500" y="-70" class="dim-text">SOLAR ARRAY STOWAGE</text>
      
      <!-- Label Leader -->
      <line class="leader" x1="500" y1="80" x2="500" y2="20" />
      <text x="500" y="10" class="label">COCKPIT GLASS</text>
      
      <line class="leader" x1="380" y1="150" x2="380" y2="50" />
      <text x="380" y="30" class="label">MAIN WING SPAN</text>
    </g>

    <!-- ========================================= VIEW 2: SIDE VIEW ========================================= -->
    <g transform="translate(-150, 200)" id="side-view">
      <text x="0" y="0" class="label" font-size="18">SIDE VIEW (PROFILE)</text>
      
      <!-- Main Body Profile -->
      <path class="outline" d="M0,0 C-20,-20 0,-40 50,-40 L60,-40 L70,-40 L100,-100 L110,-80 Z" fill="url(#metal)" /> <!-- Nose -->
      
      <!-- Upper Fuselage -->
      <path class="outline" d="M50,-40 L50,-30 L20,-20 L-10,-20 Z" />
      <path class="outline" d="M60,-40 L60,-150 L500,-150 L500,200 L400,200 L100,200 Z" /> 
      
      <!-- Lower Fuselage & Payload Bay Door Line -->
      <path class="outline" d="M60,-40 L70,-40 L100,-100 L110,-80 Z" /> <!-- Nose lower connection -->
      <path class="outline" d="M110,-80 L500,200 L400,200 L100,200 Z" />
      
      <!-- Landing Gear Bays -->
      <rect class="hidden" x="410" y="190" width="30" height="40" /> <!-- Rear -->
      <path class="hidden" d="M100,200 L120,240 L160,240 L180,200" /> <!-- Nose -->
      
      <!-- Wings (Elliptical/Sweep) -->
      <path class="outline" d="M200,200 L250,180 L550,180 L600,200 L550,250 L250,250 Z" />
      
      <!-- Tail Fin -->
      <path class="outline" d="M500,150 L500,20 L550,20 L580,150 Z" />
      
      <!-- Dimensions -->
      <line class="dim-line" x1="10" y1="100" x2="500" y2="100" marker-start="url(#dot)" marker-end="url(#dot)" />
      <text x="255" y="115" class="dim-text">LENGTH: 65M</text>
    </g>

    <!-- ========================================= VIEW 3: CUTAWAY (Side) ========================================= -->
    <g transform="translate(350, 200)" id="cutaway-view">
      <text x="0" y="0" class="label" font-size="18">CUTAWAY SECTION A-A</text>
      
      <!-- Shell Outline (Same as side view but slightly transparent) -->
      <path class="outline" opacity="0.3" d="M60,-40 L500,-150 L500,200 L400,200 L100,200 Z" /> <!-- Top/Bottom simplified -->
      <path class="outline" opacity="0.3" d="M200,200 L550,180" /> <!-- Wing Bottom -->
      
      <!-- INTERNAL SYSTEMS: CREW MODULE -->
      <rect x="150" y="-120" width="140" height="300" rx="20" class="highlight" fill="rgba(255, 215, 0, 0.1)"/>
      <text x="220" y="0" class="label" font-size="12" style="fill:#FFD700">CREW QUARTERS</text>
      
      <!-- Cockpit Seats -->
      <rect x="160" y="-110" width="20" height="40" fill="#88CCFF"/>
      <rect x="190" y="-110" width="20" height="40" fill="#88CCFF"/>
      <rect x="160" y="-70" width="20" height="40" fill="#88CCFF"/>
      <rect x="190" y="-70" width="20" height="40" fill="#88CCFF"/>
      
      <!-- PROPELLANT TANKS -->
      <ellipse cx="350" cy="120" rx="40" ry="60" fill="#3366FF" opacity="0.8" />
      <text x="350" y="140" class="label" font-size="12" style="fill:white">FUEL TANK (LOX)</text>
      
      <ellipse cx="350" cy="-50" rx="30" ry="50" fill="#FF6600" opacity="0.8" />
      <text x="350" y="-40" class="label" font-size="12" style="fill:white">OXIDIZER</text>
      
      <!-- AVIONICS / BUS BAR -->
      <rect x="150" y="10" width="250" height="60" fill="#555" stroke="#888"/>
      <text x="275" y="45" class="label" font-size="12" style="fill:white">AVIONICS RACK</text>
      
      <!-- Life Support / Radiators -->
      <rect x="420" y="80" width="30" height="120" fill="rgba(0, 255, 255, 0.3)" stroke="#00FFFF"/>
      <text x="435" y="150" class="label" font-size="12" style="fill:cyan">RADIATOR FLAPS</text>

      <!-- Engines (Internal Nozzle) -->
      <path d="M480,150 Q460,190 450,200 Q460,210 480,200" fill="#333"/>
      
      <!-- Section Line Indicator -->
      <line x1="500" y1="-150" x2="500" y2="200" stroke="#FF0000" stroke-width="2" stroke-dasharray="10,5"/>
      <polygon points="500,200 495,195 505,195" fill="#FF0000"/>
    </g>

    <!-- ========================================= VIEW 4: FRONT VIEW ========================================= -->
    <g transform="translate(800, 200)" id="front-view">
      <text x="0" y="0" class="label" font-size="18">FRONT VIEW (ELEVATION)</text>
      
      <!-- Symmetrical Shape -->
      <path class="outline" d="M0,-40 L10,-80 L80,-40 L100,0 L50,50 L0,0 Z" /> <!-- Nose Cone -->
      
      <!-- Wingspan -->
      <path class="outline" d="M0,0 L-150,20 L-250,20 L-230,60 L50,60 Z" /> <!-- Left Wing Portion -->
      <path class="outline" d="M0,0 L150,20 L250,20 L230,60 L50,60 Z" /> <!-- Right Wing Portion -->
      
      <!-- Dorsal Intake/Fins -->
      <path class="outline" d="M50,0 L50,-100 L60,-100 L60,0 Z" /> <!-- Central spine top -->
      
      <!-- Air Brakes/Control Surfaces -->
      <path class="detail" d="M-230,60 L-250,70 L-230,70 Z" />
      <path class="detail" d="M230,60 L250,70 L230,70 Z" />
      
      <!-- Dimensions -->
      <line class="dim-line" x1="-250" y1="50" x2="250" y2="50" marker-start="url(#dot)" marker-end="url(#dot)" />
      <text x="0" y="70" class="dim-text">SPAN: 42M</text>

      <!-- Callouts -->
      <line class="leader" x1="50" y1="-100" x2="100" y2="-120" />
      <text x="110" y="-110" class="label">SENSOR ARRAY</text>
    </g>

    <!-- ========================================= VIEW 5: REAR VIEW ========================================= -->
    <g transform="translate(800, 500)" id="rear-view">
      <text x="0" y="0" class="label" font-size="18">REAR VIEW (BACK)</text>
      
      <!-- Circular Hull Base -->
      <circle class="outline" cx="100" cy="100" r="80" />
      
      <!-- Main Engine Cluster -->
      <circle class="highlight" cx="100" cy="100" r="30" fill="#111" stroke="#CCC" />
      <circle class="detail" cx="100" cy="100" r="20" fill="#000" /> <!-- Bell throat -->
      
      <!-- Secondary Engines (OMS) -->
      <circle cx="150" cy="50" r="15" class="detail" fill="#000" />
      <circle cx="50" cy="50" r="15" class="detail" fill="#000" />
      
      <!-- RCS Thrusters (Ring) -->
      <circle class="dim-line" cx="100" cy="100" r="75" stroke-dasharray="4,4" />
      <circle cx="100" cy="100" r="40" class="dim-line" stroke-dasharray="2,2" />
      
      <!-- Docking Port -->
      <rect x="80" y="150" width="40" height="40" class="detail" />
      <text x="100" y="175" class="label" font-size="12">NADIR DOCK</text>
      
      <!-- Antenna Dish -->
      <circle cx="100" cy="-50" r="20" stroke="#CCC" stroke-width="2" fill="none" />
      <line x1="100" y1="-50" x2="100" y2="20" stroke="#AAA" />
      <text x="150" y="-30" class="label" font-size="12">COMMUNICATION ARRAY</text>
      
      <!-- Thermal Protection Tile Pattern -->
      <path d="M50,50 L80,120 L120,120 L150,50" class="section-hatch" />
      <path d="M150,50 L170,80 L130,130 L90,130 L50,50" class="section-hatch" />
    </g>
  </g>
  
  <!-- KEY / LEGEND BLOCK -->
  <g transform="translate(1000, 50)">
    <rect x="0" y="0" width="280" height="400" fill="rgba(255, 255, 255, 0.05)" stroke="#007BFF" stroke-width="2"/>
    <text x="140" y="25" class="label" font-size="18" text-anchor="middle">SYSTEM KEY</text>
    
    <!-- Legend Items -->
    <rect x="20" y="50" width="20" height="20" fill="url(#metal)" stroke="#007BFF" />
    <text x="50" y="65" class="label" font-size="14" style="text-anchor:start">Primary Hull</text>
    
    <rect x="20" y="80" width="20" height="20" fill="rgba(0, 123, 255, 0.3)" stroke="#007BFF" />
    <text x="50" y="95" class="label" font-size="14" style="text-anchor:start">Pressurized Module</text>
    
    <rect x="20" y="110" width="20" height="20" fill="#333" stroke="#000" />
    <text x="50" y="125" class="label" font-size="14" style="text-anchor:start">Refractory Shield</text>
    
    <circle cx="30" cy="145" r="5" fill="#000" />
    <text x="50" y="150" class="label" font-size="14" style="text-anchor:start">Main Propulsion</text>
    
    <line x1="20" y1="175" x2="50" y2="175" stroke="#FFD700" stroke-width="2" />
    <text x="50" y="185" class="label" font-size="14" style="text-anchor:start">Critical Systems</text>
    
    <rect x="20" y="210" width="100" height="40" fill="none" stroke="#FF6600" stroke-width="2" />
    <text x="70" y="235" class="label" font-size="14" style="text-anchor:start">Propellant Feed</text>
    
    <text x="20" y="260" class="label" font-size="14" style="text-anchor:start">SCALE: 1:50</text>
    <text x="20" y="280" class="label" font-size="14" style="text-anchor:start">UNIT: METRIC</text>
    
    <text x="20" y="310" class="label" font-size="12" style="text-anchor:start">WARNING: THIS DOCUMENT CONTAINS CLASSIFIED ENGINEERING SPECIFICATIONS.</text>
  </g>

  <!-- Decorative Border -->
  <rect x="10" y="10" width="1380" height="980" fill="none" stroke="#007BFF" stroke-width="4" />

</svg>