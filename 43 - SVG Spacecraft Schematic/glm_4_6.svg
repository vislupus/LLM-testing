<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for patterns and markers -->
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    
    <!-- Fine grid -->
    <pattern id="finegrid" width="2" height="2" patternUnits="userSpaceOnUse">
      <path d="M 2 0 L 0 0 0 2" fill="none" stroke="#f0f0f0" stroke-width="0.3"/>
    </pattern>
    
    <!-- Cross-hatch for cutaway -->
    <pattern id="crosshatch" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M0,4 l4,-4 M0,0 l4,4" stroke="#888" stroke-width="0.5"/>
    </pattern>
    
    <!-- Arrow marker for dimensions -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    
    <!-- Dot marker for section lines -->
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="2" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background with grid -->
  <rect width="1200" height="900" fill="white"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#finegrid)"/>
  
  <!-- Title Block -->
  <g id="title-block">
    <rect x="850" y="750" width="340" height="130" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="850" y1="780" x2="1190" y2="780" stroke="#000" stroke-width="1"/>
    <line x1="850" y1="810" x2="1190" y2="810" stroke="#000" stroke-width="1"/>
    <line x1="850" y1="840" x2="1190" y2="840" stroke="#000" stroke-width="1"/>
    <line x1="950" y1="750" x2="950" y2="880" stroke="#000" stroke-width="1"/>
    <line x1="1050" y1="750" x2="1050" y2="880" stroke="#000" stroke-width="1"/>
    
    <text x="855" y="770" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PROJECT: ORBITER-X</text>
    <text x="855" y="795" font-family="Arial, sans-serif" font-size="10">DOCUMENT: TECHNICAL SCHEMATIC</text>
    <text x="855" y="825" font-family="Arial, sans-serif" font-size="10">SCALE: 1:100</text>
    <text x="855" y="855" font-family="Arial, sans-serif" font-size="10">DATE: 2024.01</text>
    <text x="855" y="875" font-family="Arial, sans-serif" font-size="10">DRAWN BY: AEROSPACE DIV.</text>
    
    <text x="955" y="770" font-family="Arial, sans-serif" font-size="10">REVISION: A</text>
    <text x="955" y="795" font-family="Arial, sans-serif" font-size="10">MATERIAL: AL-7075/Ti-6Al-4V</text>
    <text x="955" y="825" font-family="Arial, sans-serif" font-size="10">MASS: 45,200 kg</text>
    <text x="955" y="855" font-family="Arial, sans-serif" font-size="10">CREW: 4-6</text>
    <text x="955" y="875" font-family="Arial, sans-serif" font-size="10">MISSION: LEO/DEEP SPACE</text>
    
    <text x="1055" y="770" font-family="Arial, sans-serif" font-size="10">APPROVED:</text>
    <text x="1055" y="795" font-family="Arial, sans-serif" font-size="10">CHECKED:</text>
    <text x="1055" y="825" font-family="Arial, sans-serif" font-size="10">STATUS: PRELIMINARY</text>
  </g>
  
  <!-- TOP VIEW -->
  <g id="top-view" transform="translate(50, 50)">
    <text x="150" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold">TOP VIEW</text>
    
    <!-- Main hull -->
    <rect x="50" y="50" width="200" height="80" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Crew module -->
    <rect x="50" y="70" width="60" height="40" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="80" cy="90" r="8" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Cargo bay -->
    <rect x="110" y="70" width="60" height="40" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Engine section -->
    <rect x="170" y="60" width="80" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
    
    <!-- Solar arrays (left) -->
    <g transform="translate(50, 90)">
      <rect x="-40" y="-60" width="35" height="120" fill="none" stroke="#000" stroke-width="1"/>
      <line x1="-40" y1="-60" x2="-45" y2="-65" stroke="#000" stroke-width="1"/>
      <line x1="-5" y1="-60" x2="0" y2="-65" stroke="#000" stroke-width="1"/>
      <line x1="-40" y1="60" x2="-45" y2="65" stroke="#000" stroke-width="1"/>
      <line x1="-5" y1="60" x2="0" y2="65" stroke="#000" stroke-width="1"/>
    </g>
    
    <!-- Solar arrays (right) -->
    <g transform="translate(250, 90)">
      <rect x="5" y="-60" width="35" height="120" fill="none" stroke="#000" stroke-width="1"/>
      <line x1="5" y1="-60" x2="0" y2="-65" stroke="#000" stroke-width="1"/>
      <line x1="40" y1="-60" x2="45" y2="-65" stroke="#000" stroke-width="1"/>
      <line x1="5" y1="60" x2="0" y2="65" stroke="#000" stroke-width="1"/>
      <line x1="40" y1="60" x2="45" y2="65" stroke="#000" stroke-width="1"/>
    </g>
    
    <!-- Radiators -->
    <rect x="140" y="45" width="40" height="5" fill="none" stroke="#000" stroke-width="0.5"/>
    <rect x="140" y="130" width="40" height="5" fill="none" stroke="#000" stroke-width="0.5"/>
    
    <!-- Antennas -->
    <circle cx="80" cy="50" r="3" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="220" cy="50" r="3" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Dimensions -->
    <line x1="50" y1="150" x2="250" y2="150" stroke="#333" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="140" y="145" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">45.0 m</text>
    
    <line x1="30" y1="50" x2="30" y2="130" stroke="#333" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="25" y="95" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">18.0 m</text>
  </g>
  
  <!-- SIDE VIEW -->
  <g id="side-view" transform="translate(400, 50)">
    <text x="150" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SIDE VIEW</text>
    
    <!-- Main hull -->
    <rect x="50" y="60" width="200" height="40" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Crew module -->
    <ellipse cx="80" cy="80" rx="30" ry="20" fill="none" stroke="#000" stroke-width="1.5"/>
    <rect x="50" y="70" width="15" height="20" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Cargo bay -->
    <rect x="110" y="65" width="60" height="30" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Engine section -->
    <rect x="170" y="70" width="80" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
    <polygon points="250,70 270,80 250,90" fill="none" stroke="#000" stroke-width="1.5"/>
    
    <!-- Landing gear -->
    <line x1="80" y1="100" x2="80" y2="120" stroke="#000" stroke-width="1"/>
    <line x1="75" y1="120" x2="85" y2="120" stroke="#000" stroke-width="1"/>
    <line x1="180" y1="100" x2="180" y2="120" stroke="#000" stroke-width="1"/>
    <line x1="175" y1="120" x2="185" y2="120" stroke="#000" stroke-width="1"/>
    
    <!-- Solar array support -->
    <line x1="50" y1="80" x2="30" y2="80" stroke="#000" stroke-width="1"/>
    <line x1="250" y1="80" x2="270" y2="80" stroke="#000" stroke-width="1"/>
    
    <!-- Docking port -->
    <circle cx="50" cy="80" r="5" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Airlock -->
    <rect x="140" y="100" width="20" height="15" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="150" cy="107" r="3" fill="none" stroke="#000" stroke-width="0.5"/>
    
    <!-- Dimensions -->
    <line x1="50" y1="140" x2="270" y2="140" stroke="#333" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="160" y="135" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">45.0 m</text>
  </g>
  
  <!-- FRONT VIEW -->
  <g id="front-view" transform="translate(750, 50)">
    <text x="100" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FRONT VIEW</text>
    
    <!-- Main hull -->
    <ellipse cx="100" cy="80" rx="40" ry="25" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Cockpit window -->
    <rect x="80" y="70" width="40" height="20" rx="10" fill="none" stroke="#000" stroke-width="1.5"/>
    
    <!-- Airlock doors -->
    <ellipse cx="100" cy="100" rx="15" ry="8" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Docking port -->
    <circle cx="100" cy="50" r="8" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="100" cy="50" r="5" fill="none" stroke="#000" stroke-width="0.5"/>
    
    <!-- Dimensions -->
    <line x1="60" y1="130" x2="140" y2="130" stroke="#333" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="100" y="125" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">18.0 m</text>
  </g>
  
  <!-- REAR VIEW -->
  <g id="rear-view" transform="translate(50, 250)">
    <text x="100" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold">REAR VIEW</text>
    
    <!-- Engine bell -->
    <ellipse cx="100" cy="80" rx="35" ry="35" fill="none" stroke="#000" stroke-width="2"/>
    <ellipse cx="100" cy="80" rx="25" ry="25" fill="none" stroke="#000" stroke-width="1.5"/>
    <ellipse cx="100" cy="80" rx="15" ry="15" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Engine nozzle details -->
    <path d="M 65,80 Q 100,65 135,80" fill="none" stroke="#000" stroke-width="0.5"/>
    <path d="M 65,80 Q 100,95 135,80" fill="none" stroke="#000" stroke-width="0.5"/>
    
    <!-- Radiators -->
    <rect x="65" y="40" width="70" height="5" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="65" y="115" width="70" height="5" fill="none" stroke="#000" stroke-width="1"/>
    
    <!-- Dimensions -->
    <line x1="65" y1="130" x2="135" y2="130" stroke="#333" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="100" y="125" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">14.0 m</text>
  </g>
  
  <!-- CUTAWAY VIEW -->
  <g id="cutaway-view" transform="translate(250, 250)">
    <text x="150" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold">CUTAWAY SECTION A-A</text>
    
    <!-- Section line indicators -->
    <line x1="50" y1="50" x2="50" y2="150" stroke="#000" stroke-width="1" stroke-dasharray="5,5" marker-start="url(#dot)" marker-end="url(#dot)"/>
    <line x1="250" y1="50" x2="250" y2="150" stroke="#000" stroke-width="1" stroke-dasharray="5,5" marker-start="url(#dot)" marker-end="url(#dot)"/>
    
    <!-- Outer hull -->
    <rect x="50" y="50" width="200" height="100" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Internal structure with cross-hatch -->
    <rect x="50" y="50" width="200" height="100" fill="url(#crosshatch)" opacity="0.3"/>
    
    <!-- Crew module -->
    <rect x="50" y="60" width="60" height="40" fill="white" stroke="#000" stroke-width="1.5"/>
    <text x="80" y="80" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">CREW</text>
    <text x="80" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">MODULE</text>
    
    <!-- Avionics Bay -->
    <rect x="55" y="105" width="20" height="10" fill="white" stroke="#000" stroke-width="1"/>
    <text x="65" y="113" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">AVI</text>
    
    <!-- Life Support (ECLSS) -->
    <rect x="80" y="105" width="20" height="10" fill="white" stroke="#000" stroke-width="1"/>
    <text x="90" y="113" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">L/S</text>
    
    <!-- Cargo Bay -->
    <rect x="110" y="60" width="50" height="40" fill="white" stroke="#000" stroke-width="1"/>
    <text x="135" y="80" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">CARGO</text>
    
    <!-- Propellant Tanks -->
    <circle cx="190" cy="70" r="12" fill="white" stroke="#000" stroke-width="1"/>
    <text x="190" y="73" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">LH2</text>
    <circle cx="190" cy="95" r="12" fill="white" stroke="#000" stroke-width="1"/>
    <text x="190" y="98" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">LOX</text>
    
    <!-- Engine Nozzle -->
    <polygon points="210,65 250,80 210,95" fill="white" stroke="#000" stroke-width="1.5"/>
    <line x1="220" y1="70" x2="220" y2="90" stroke="#000" stroke-width="0.5"/>
    <line x1="220" y1="70" x2="220" y2="90" stroke="#000" stroke-width="0.5"/>
    <line x1="230" y1="73" x2="230" y2="87" stroke="#000" stroke-width="0.5"/>
    <line x1="240" y1="76" x2="240" y2="84" stroke="#000" stroke-width="0.5"/>
    
    <!-- Main Fuselage Structure -->
    <rect x="60" y="55" width="150" height="50" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Nose Cone -->
    <path d="M 40 80 L 60 55 L 60 105 Z" fill="white" stroke="#000" stroke-width="1.5"/>
    
    <!-- Stabilizing Fins -->
    <path d="M 200 55 L 210 45 L 210 55 Z" fill="white" stroke="#000" stroke-width="1"/>
    <path d="M 200 105 L 210 115 L 210 105 Z" fill="white" stroke="#000" stroke-width="1"/>
    
    <!-- Module Separation Lines -->
    <line x1="100" y1="55" x2="100" y2="105" stroke="#000" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="160" y1="55" x2="160" y2="105" stroke="#000" stroke-width="0.5" stroke-dasharray="2,2"/>
</g>
</svg>