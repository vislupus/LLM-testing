<svg viewBox="0 0 2000 1500" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles for technical drawing -->
  <defs>
    <style>
      .outline { stroke: #1a1a1a; stroke-width: 2; fill: none; }
      .hidden { stroke: #666; stroke-width: 1; stroke-dasharray: 5,5; fill: none; }
      .centerline { stroke: #c00; stroke-width: 1; stroke-dasharray: 10,5,2,5; }
      .dimension { stroke: #333; stroke-width: 1; fill: none; }
      .text { font-family: 'Courier New', monospace; font-size: 14px; fill: #1a1a1a; }
      .label { font-family: 'Arial', sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    </style>
    
    <!-- Arrow marker for dimensions -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="2000" height="1500" fill="#f5f3e8"/>
  
  <!-- TOP VIEW (Upper Left) -->
  <g id="top-view" transform="translate(100, 100)">
    <text x="200" y="-20" class="title">TOP VIEW</text>
    
    <!-- Main fuselage -->
    <ellipse cx="200" cy="150" rx="180" ry="60" class="outline"/>
    
    <!-- Propellant tanks -->
    <ellipse cx="200" cy="100" rx="150" ry="30" class="outline"/>
    <ellipse cx="200" cy="200" rx="150" ry="30" class="outline"/>
    
    <!-- Engine nozzle -->
    <path d="M50,150 L20,150 L30,130 L30,170 Z" class="outline"/>
    
    <!-- Dimensions -->
    <line x1="20" y1="50" x2="380" y2="50" class="dimension" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="200" y="40" class="label" text-anchor="middle">L=18.7 m</text>
    
    <!-- Labels -->
    <text x="200" y="90" class="label" text-anchor="middle">LOX</text>
    <text x="200" y="220" class="label" text-anchor="middle">RP-1</text>
  </g>
  
  <!-- SIDE VIEW (Upper Right) -->
  <g id="side-view" transform="translate(1100, 100)">
    <text x="200" y="-20" class="title">SIDE VIEW</text>
    
    <!-- Cockpit -->
    <path d="M50,150 Q100,100 200,100 L350,100 L350,200 L200,200 Q100,200 50,150" class="outline"/>
    
    <!-- Cockpit windows -->
    <ellipse cx="120" cy="130" rx="15" ry="10" class="outline"/>
    <ellipse cx="150" cy="130" rx="15" ry="10" class="outline"/>
    <ellipse cx="180" cy="130" rx="15" ry="10" class="outline"/>
    
    <!-- Main body -->
    <rect x="350" y="120" width="200" height="60" class="outline"/>
    
    <!-- Engine -->
    <path d="M550,130 L600,120 L600,180 L550,170 Z" class="outline"/>
    
    <!-- Landing gear -->
    <line x1="400" y1="180" x2="380" y2="220" class="outline"/>
    <line x1="450" y1="180" x2="480" y2="220" class="outline"/>
    <circle cx="380" cy="220" r="10" class="outline"/>
    <circle cx="480" cy="220" r="10" class="outline"/>
    
    <!-- Solar array -->
    <rect x="550" y="80" width="80" height="30" class="outline"/>
    
    <!-- Dimensions -->
    <line x1="50" y1="250" x2="600" y2="250" class="dimension" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="325" y="270" class="label" text-anchor="middle">L=18.7 m</text>
    
    <!-- Labels -->
    <text x="100" y="80" class="label">AIRLOCK</text>
    <text x="450" y="150" class="label">RP-1</text>
    <text x="550" y="60" class="label">SOLAR ARRAY</text>
  </g>
  
  <!-- FRONT VIEW (Center) -->
  <g id="front-view" transform="translate(500, 500)">
    <text x="200" y="-20" class="title">FRONT VIEW</text>
    
    <!-- Main body -->
    <circle cx="200" cy="150" r="100" class="outline"/>
    
    <!-- Cockpit windows -->
    <rect x="150" y="120" width="30" height="20" class="outline"/>
    <rect x="190" y="120" width="30" height="20" class="outline"/>
    <rect x="230" y="120" width="30" height="20" class="outline"/>
    
    <!-- Solar arrays -->
    <rect x="50" y="140" width="140" height="40" class="outline"/>
    <rect x="320" y="140" width="140" height="40" class="outline"/>
    
    <!-- Antenna -->
    <circle cx="200" cy="50" r="30" class="outline"/>
    <line x1="200" y1="80" x2="200" y2="100" class="outline"/>
    
    <!-- Landing gear -->
    <line x1="150" y1="250" x2="130" y2="290" class="outline"/>
    <line x1="250" y1="250" x2="270" y2="290" class="outline"/>
    <circle cx="130" cy="290" r="10" class="outline"/>
    <circle cx="270" cy="290" r="10" class="outline"/>
    
    <!-- Dimensions -->
    <line x1="50" y1="320" x2="460" y2="320" class="dimension" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="255" y="340" class="label" text-anchor="middle">L=18.7 m</text>
    
    <!-- Labels -->
    <text x="200" y="30" class="label">AIRLOCK</text>
    <text x="300" y="160" class="label">SOLAR ARRAY 24.5 kW</text>
  </g>
  
  <!-- REAR VIEW (Lower Left) -->
  <g id="rear-view" transform="translate(100, 900)">
    <text x="200" y="-20" class="title">REAR VIEW</text>
    
    <!-- Main engine -->
    <circle cx="200" cy="150" r="80" class="outline"/>
    <circle cx="200" cy="150" r="60" class="outline"/>
    
    <!-- Side engines -->
    <ellipse cx="120" cy="150" rx="40" ry="60" class="outline"/>
    <ellipse cx="280" cy="150" rx="40" ry="60" class="outline"/>
    
    <!-- Solar arrays -->
    <rect x="50" y="140" width="140" height="40" class="outline"/>
    <rect x="320" y="140" width="140" height="40" class="outline"/>
    
    <!-- Landing gear -->
    <line x1="150" y1="230" x2="130" y2="270" class="outline"/>
    <line x1="250" y1="230" x2="270" y2="270" class="outline"/>
    <circle cx="130" cy="270" r="10" class="outline"/>
    <circle cx="270" cy="270" r="10" class="outline"/>
    
    <!-- Dimensions -->
    <line x1="50" y1="300" x2="460" y2="300" class="dimension" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="255" y="320" class="label" text-anchor="middle">L=18.7 m</text>
    
    <!-- Labels -->
    <text x="200" y="100" class="label">MAIN ENGINE THRUST: 1,250 kN (VAC)</text>
    <text x="300" y="160" class="label">SOLAR ARRAY 24.5 kW</text>
  </g>
  
  <!-- CUTAWAY VIEW (Lower Right) -->
  <g id="cutaway-view" transform="translate(1100, 900)">
    <text x="200" y="-20" class="title">CUTAWAY VIEW</text>
    
    <!-- Outer shell (partial) -->
    <path d="M50,150 Q100,100 200,100 L400,100 L400,200 L200,200 Q100,200 50,150" class="outline"/>
    <path d="M200,100 L200,200" class="hidden"/>
    
    <!-- Internal structure -->
    <rect x="220" y="120" width="150" height="60" class="outline"/>
    <line x1="240" y1="120" x2="240" y2="180" class="hidden"/>
    <line x1="280" y1="120" x2="280" y2="180" class="hidden"/>
    <line x1="320" y1="120" x2="320" y2="180" class="hidden"/>
    
    <!-- Cockpit interior -->
    <rect x="100" y="110" width="80" height="40" class="outline"/>
    
    <!-- Solar arrays -->
    <rect x="400" y="80" width="120" height="40" class="outline"/>
    <rect x="400" y="180" width="120" height="40" class="outline"/>
    
    <!-- Engine -->
    <path d="M400,120 L450,110 L450,190 L400,180 Z" class="outline"/>
    
    <!-- Landing gear -->
    <line x1="300" y1="200" x2="280" y2="240" class="outline"/>
    <line x1="350" y1="200" x2="380" y2="240" class="outline"/>
    <circle cx="280" cy="240" r="10" class="outline"/>
    <circle cx="380" cy="240" r="10" class="outline"/>
    
    <!-- Labels -->
    <text x="250" y="260" class="label">AVIONICS BAY - RACK MOUNTED</text>
    <text x="150" y="260" class="label">O₂/CO₂ RECYCLING UNIT</text>
  </g>
  
  <!-- TITLE BLOCK (Bottom Right) -->
  <g id="title-block" transform="translate(1600, 1300)">
    <rect x="0" y="0" width="350" height="150" class="outline"/>
    <line x1="0" y1="30" x2="350" y2="30" class="outline"/>
    <line x1="0" y1="60" x2="350" y2="60" class="outline"/>
    <line x1="0" y1="90" x2="350" y2="90" class="outline"/>
    <line x1="200" y1="0" x2="200" y2="150" class="outline"/>
    
    <text x="175" y="20" class="title" text-anchor="middle">ASTRA-VII ORBITAL TRANSPORT</text>
    <text x="100" y="50" class="label">REV. C</text>
    <text x="100" y="80" class="label">SCALE: 1:100</text>
    <text x="100" y="110" class="label">ALL DIMENSIONS IN MILLIMETERS</text>
    <text x="100" y="135" class="label">TOLERANCE ±0.2 mm</text>
    <text x="275" y="50" class="label">DRAWN:</text>
    <text x="275" y="80" class="label">CHECKED:</text>
    <text x="275" y="110" class="label">DATE:</text>
  </g>
  
  <!-- Scale bar -->
  <g id="scale-bar" transform="translate(100, 1400)">
    <line x1="0" y1="0" x2="200" y2="0" class="dimension" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" class="dimension"/>
    <line x1="200" y1="-5" x2="200" y2="5" class="dimension"/>
    <line x1="100" y1="-3" x2="100" y2="3" class="dimension"/>
    <text x="100" y="20" class="label" text-anchor="middle">5 m</text>
  </g>
</svg>