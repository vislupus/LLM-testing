<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <!-- Border and title block -->
  <rect x="5" y="5" width="287" height="200" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="10" y="20" font-size="12" font-family="Arial">Spacecraft Schematic</text>
  <text x="10" y="35" font-size="8" font-family="Arial">Scale: 1:100</text>

  <!-- Top view -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="100" height="30" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="5" y="15" font-size="6" font-family="Arial" transform="rotate(0)">Crew Module</text>
    <rect x="30" y="-20" width="40" height="10" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="35" y="-15" font-size="6" font-family="Arial" transform="rotate(0)">Cockpit</text>
    <rect x="0" y="-30" width="20" height="10" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="5" y="-25" font-size="6" font-family="Arial" transform="rotate(0)">Airlock 1</text>
    <rect x="80" y="-30" width="20" height="10" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="85" y="-25" font-size="6" font-family="Arial" transform="rotate(0)">Airlock 2</text>
    <rect x="110" y="0" width="20" height="30" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="115" y="15" font-size="6" font-family="Arial" transform="rotate(0)">Docking Port</text>
    <line x1="50" y1="-40" x2="50" y2="40" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="55" y="-35" font-size="6" font-family="Arial" transform="rotate(90)">Centerline</text>
    <g transform="translate(50, 0)">
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#000" stroke-width="0.5"/>
      <text x="5" y="0" font-size="6" font-family="Arial">Section A-A</text>
    </g>
  </g>

  <!-- Side view -->
  <g transform="translate(170, 50)">
    <rect x="0" y="0" width="30" height="100" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="5" y="50" font-size="6" font-family="Arial" transform="rotate(90)">Crew Module</text>
    <rect x="-20" y="30" width="10" height="40" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="-15" y="50" font-size="6" font-family="Arial" transform="rotate(0)">Cockpit</text>
    <rect x="-30" y="0" width="10" height="20" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="-25" y="10" font-size="6" font-family="Arial" transform="rotate(0)">Airlock 1</text>
    <rect x="-30" y="80" width="10" height="20" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="-25" y="90" font-size="6" font-family="Arial" transform="rotate(0)">Airlock 2</text>
    <rect x="40" y="0" width="30" height="100" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="45" y="50" font-size="6" font-family="Arial" transform="rotate(90)">Service Module</text>
    <g transform="translate(0, 50)">
      <line x1="-40" x2="40" y1="0" y2="0" stroke="#000" stroke-width="0.5"/>
      <text x="0" y="5" font-size="6" font-family="Arial">Section B-B</text>
    </g>
  </g>

  <!-- Front view -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="100" height="30" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="5" y="15" font-size="6" font-family="Arial" transform="rotate(0)">Cockpit</text>
    <circle cx="50" cy="15" r="10" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="55" y="15" font-size="6" font-family="Arial" transform="rotate(0)">Radar Antenna</text>
    <rect x="30" y="-20" width="40" height="10" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="35" y="-15" font-size="6" font-family="Arial" transform="rotate(0)">Solar Arrays</text>
  </g>

  <!-- Rear view -->
  <g transform="translate(170, 120)">
    <rect x="0" y="0" width="30" height="100" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="5" y="50" font-size="6" font-family="Arial" transform="rotate(90)">Service Module</text>
    <rect x="-20" y="30" width="10" height="40" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="-15" y="50" font-size="6" font-family="Arial" transform="rotate(0)">Main Engine</text>
    <rect x="-30" y="0" width="10" height="20" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="-25" y="10" font-size="6" font-family="Arial" transform="rotate(0)"> RCS Thruster</text>
    <rect x="-30" y="80" width="10" height="20" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="-25" y="90" font-size="6" font-family="Arial" transform="rotate(0)"> RCS Thruster</text>
  </g>

  <!-- Cutaway view -->
  <g transform="translate(250, 50)">
    <rect x="0" y="0" width="30" height="100" fill="#ccc" stroke="#000" stroke-width="0.5" fill-opacity="0.5"/>
    <text x="5" y="50" font-size="6" font-family="Arial" transform="rotate(90)">Crew Module</text>
    <rect x="-20" y="30" width="10" height="40" fill="#ccc" stroke="#000" stroke-width="0.5" fill-opacity="0.5"/>
    <text x="-15" y="50" font-size="6" font-family="Arial" transform="rotate(0)">Cockpit</text>
    <rect x="40" y="0" width="30" height="100" fill="#ccc" stroke="#000" stroke-width="0.5" fill-opacity="0.5"/>
    <text x="45" y="50" font-size="6" font-family="Arial" transform="rotate(90)">Service Module</text>
    <line x1="0" y1="0" x2="70" y2="100" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="35" y="50" font-size="6" font-family="Arial" transform="rotate(45)">Cutaway Section</text>
  </g>

  <!-- Dimensions and callouts -->
  <g transform="translate(50, 180)">
    <text x="0" y="0" font-size="6" font-family="Arial">Length: 10m</text>
    <text x="0" y="10" font-size="6" font-family="Arial">Diameter: 3m</text>
    <text x="0" y="20" font-size="6" font-family="Arial">Mass: 5000kg</text>
  </g>

  <!-- Scale markers -->
  <g transform="translate(10, 190)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#000" stroke-width="0.5"/>
    <text x="10" y="5" font-size="6" font-family="Arial" text-anchor="middle">1m</text>
  </g>

  <!-- Section lines -->
  <line x1="50" y1="100" x2="170" y2="100" stroke="#000" stroke-width="0.5" stroke-dasharray="2 2"/>
  <text x="110" y="105" font-size="6" font-family="Arial">Section A-A</text>

  <!-- Structural details -->
  <g transform="translate(170, 50)">
    <rect x="20" y="40" width="10" height="20" fill="#ccc" stroke="#000" stroke-width="0.5"/>
    <text x="25" y="50" font-size="6" font-family="Arial">Frame</text>
    <line x1="20" y1="60" x2="30" y2="60" stroke="#000" stroke-width="0.5"/>
    <text x="25" y="65" font-size="6" font-family="Arial">Stringer</text>
  </g>

  <!-- Labeled components -->
  <g transform="translate(50, 50)">
    <text x="120" y="20" font-size="6" font-family="Arial">1. Engines</text>
    <text x="120" y="30" font-size="6" font-family="Arial">2. Propellant Tanks</text>
    <text x="120" y="40" font-size="6" font-family="Arial">3. Crew Module</text>
    <text x="120" y="50" font-size="6" font-family="Arial">4. Cockpit</text>
    <text x="120" y="60" font-size="6" font-family="Arial">5. Airlocks</text>
    <text x="120" y="70" font-size="6" font-family="Arial">6. Docking Port</text>
    <text x="120" y="80" font-size="6" font-family="Arial">7. Radiators</text>
    <text x="120" y="90" font-size="6" font-family="Arial">8. Solar Arrays</text>
    <text x="120" y="100" font-size="6" font-family="Arial">9. Antennas</text>
    <text x="120" y="110" font-size="6" font-family="Arial">10. Landing Gear</text>
    <text x="120" y="120" font-size="6" font-family="Arial">11. Cargo Bay</text>
    <text x="120" y="130" font-size="6" font-family="Arial">12. Avionics</text>
    <text x="120" y="140" font-size="6" font-family="Arial">13. Life-Support Systems</text>
  </g>
</svg>
