<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="'Courier New', monospace">
  <!-- DEFINITIONS -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1d3b5e" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#005f73" stroke-width="1" />
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00ffff" />
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#00ffff" />
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="#0b1e3b"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- TITLE BLOCK -->
  <g transform="translate(20, 1100)">
    <rect width="1560" height="80" fill="#0b1e3b" stroke="#00ffff" stroke-width="2"/>
    <text x="20" y="35" fill="#00ffff" font-size="24" font-weight="bold">PROJECT: AURORA-X MK.I</text>
    <text x="20" y="60" fill="#00ffff" font-size="14">ORBITAL TRANSFER VEHICLE - TECHNICAL SCHEMATIC</text>
    <text x="1000" y="35" fill="#00ffff" font-size="14">DWG. NO: AX-2023-001</text>
    <text x="1000" y="60" fill="#00ffff" font-size="14">SCALE: 1:50 (METRIC)</text>
    <text x="1450" y="35" fill="#00ffff" font-size="14">REV: 1.0</text>
    <text x="1450" y="60" fill="#00ffff" font-size="14">SHEET: 1/1</text>
  </g>

  <!-- ==================== VIEW A: TOP PLAN ==================== -->
  <g transform="translate(50, 50)">
    <text x="350" y="30" fill="#00ffff" font-size="20" text-anchor="middle" font-weight="bold">VIEW A: TOP PLAN</text>
    <line x1="20" y1="400" x2="680" y2="400" stroke="#00ffff" stroke-width="1" stroke-dasharray="10,5"/>
    
    <!-- Main Fuselage -->
    <ellipse cx="350" cy="400" rx="60" ry="250" fill="none" stroke="#00ffff" stroke-width="2"/>
    
    <!-- Cargo Bay Doors -->
    <line x1="290" y1="150" x2="410" y2="150" stroke="#00ffff" stroke-width="1"/>
    <line x1="290" y1="650" x2="410" y2="650" stroke="#00ffff" stroke-width="1"/>
    <path d="M290,150 L290,650 M410,150 L410,650" stroke="#00ffff" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="350" y="155" fill="#00ffff" font-size="10" text-anchor="middle">CARGO BAY DOORS</text>

    <!-- Docking Port (Top Center) -->
    <rect x="330" y="120" width="40" height="30" fill="#0b1e3b" stroke="#00ffff" stroke-width="2"/>
    <circle cx="350" cy="135" r="5" fill="#00ffff"/>
    <text x="350" y="110" fill="#00ffff" font-size="10" text-anchor="middle">DOCKING PORT</text>

    <!-- Solar Arrays (Left) -->
    <g transform="translate(20, 360)">
        <rect x="0" y="0" width="80" height="80" fill="none" stroke="#00ffff" stroke-width="1"/>
        <line x1="10" y1="0" x2="10" y2="80" stroke="#00ffff" stroke-width="0.5"/>
        <line x1="30" y1="0" x2="30" y2="80" stroke="#00ffff" stroke-width="0.5"/>
        <line x1="50" y1="0" x2="50" y2="80" stroke="#00ffff" stroke-width="0.5"/>
        <line x1="70" y1="0" x2="70" y2="80" stroke="#00ffff" stroke-width="0.5"/>
        <text x="40" y="-10" fill="#00ffff" font-size="10" text-anchor="middle">SOLAR ARRAY L</text>
    </g>

    <!-- Solar Arrays (Right) -->
    <g transform="translate(600, 360)">
        <rect x="0" y="0" width="80" height="80" fill="none" stroke="#00ffff" stroke-width="1"/>
        <line x1="10" y1="0" x2="10" y2="80" stroke="#00ffff" stroke-width="0.5"/>
        <line x1="30" y1="0" x2="30" y2="80" stroke="#00ffff" stroke-width="0.5"/>
        <line x1="50" y1="0" x2="50" y2="80" stroke="#00ffff" stroke-width="0.5"/>
        <line x1="70" y1="0" x2="70" y2="80" stroke="#00ffff" stroke-width="0.5"/>
        <text x="40" y="-10" fill="#00ffff" font-size="10" text-anchor="middle">SOLAR ARRAY R</text>
    </g>

    <!-- Radiators -->
    <path d="M 250,400 L 150,350 L 150,450 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M 450,400 L 550,350 L 550,450 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="150" y="340" fill="#00ffff" font-size="10" text-anchor="middle">RADIATOR</text>
    <text x="550" y="340" fill="#00ffff" font-size="10" text-anchor="middle">RADIATOR</text>

    <!-- Engine Cluster (Bottom) -->
    <circle cx="350" cy="600" r="20" fill="none" stroke="#00ffff" stroke-width="1"/>
    <circle cx="320" cy="580" r="10" fill="none" stroke="#00ffff" stroke-width="1"/>
    <circle cx="380" cy="580" r="10" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="350" y="640" fill="#00ffff" font-size="12" text-anchor="middle">ENGINE CLUSTER</text>
  </g>

  <!-- ==================== VIEW B: SIDE PROFILE ==================== -->
  <g transform="translate(800, 50)">
    <text x="350" y="30" fill="#00ffff" font-size="20" text-anchor="middle" font-weight="bold">VIEW B: STARBOARD SIDE</text>
    <line x1="20" y1="400" x2="680" y2="400" stroke="#00ffff" stroke-width="1" stroke-dasharray="10,5"/>

    <!-- Fuselage Outline -->
    <path d="M350,50 L380,150 L380,250 L420,300 L420,500 L380,550 L350,550 L350,50" fill="none" stroke="#00ffff" stroke-width="2"/>
    <!-- Nosecone -->
    <path d="M350,50 C 280,100 280,150 350,150" fill="none" stroke="#00ffff" stroke-width="2"/>
    
    <!-- Cockpit -->
    <path d="M355,130 L370,130 L370,150 L355,150" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="380" y="140" fill="#00ffff" font-size="10">COCKPIT</text>

    <!-- Crew Module -->
    <rect x="370" y="150" width="50" height="100" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="395" y="200" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90, 395,200)">CREW MODULE</text>
    
    <!-- Airlock -->
    <rect x="380" y="250" width="40" height="30" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="400" y="270" fill="#00ffff" font-size="10" text-anchor="middle">AIRLOCK</text>

    <!-- Life Support -->
    <rect x="370" y="290" width="50" height="40" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="395" y="310" fill="#00ffff" font-size="8" text-anchor="middle" transform="rotate(90, 395,310)">LSS</text>

    <!-- Cargo Bay -->
    <rect x="380" y="340" width="40" height="80" fill="url(#hatch)" stroke="#00ffff" stroke-width="1"/>
    <text x="400" y="380" fill="#00ffff" font-size="10" text-anchor="middle">CARGO BAY</text>

    <!-- Propellant Tank -->
    <rect x="370" y="430" width="50" height="80" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="395" y="470" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90, 395,470)">PROPELLANT</text>

    <!-- Avionics -->
    <rect x="410" y="160" width="20" height="40" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="420" y="170" fill="#00ffff" font-size="8" text-anchor="middle" transform="rotate(90, 420,170)">AVIONICS</text>

    <!-- Main Engine -->
    <path d="M370,500 L430,500 L440,560 L360,560 Z" fill="none" stroke="#00ffff" stroke-width="2"/>
    <text x="400" y="530" fill="#00ffff" font-size="10" text-anchor="middle">MAIN ENGINE</text>

    <!-- Landing Gear -->
    <path d="M390,550 L390,620 L420,640" fill="none" stroke="#00ffff" stroke-width="1"/>
    <circle cx="420" cy="640" r="3" fill="#00ffff"/>
    <text x="400" y="600" fill="#00ffff" font-size="10">LANDING GEAR</text>

    <!-- Antenna -->
    <line x1="350" y1="180" x2="350" y2="220" stroke="#00ffff" stroke-width="1"/>
    <circle cx="350" cy="220" r="8" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="350" y="245" fill="#00ffff" font-size="10" text-anchor="middle">ANTENNA</text>

    <!-- Docking Port -->
    <rect x="340" y="40" width="20" height="20" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="350" y="30" fill="#00ffff" font-size="10" text-anchor="middle">DOCKING PORT</text>

    <!-- Dimensions -->
    <line x1="480" y1="50" x2="480" y2="640" stroke="#00ffff" stroke-width="1"/>
    <line x1="470" y1="50" x2="490" y2="50" stroke="#00ffff"/>
    <line x1="470" y1="640" x2="490" y2="640" stroke="#00ffff"/>
    <line x1="480" y1="50" x2="530" y2="50" stroke="#00ffff"/>
    <line x1="480" y1="640" x2="530" y2="640" stroke="#00ffff"/>
    <line x1="480" y1="345" x2="530" y2="345" stroke="#00ffff"/>
    <text x="540" y="345" fill="#00ffff" font-size="10">H: 18.0m</text>
  </g>

  <!-- ==================== VIEW C: FRONT AXONOMETRIC ==================== -->
  <g transform="translate(50, 550)">
    <text x="350" y="30" fill="#00ffff" font-size="20" text-anchor="middle" font-weight="bold">VIEW C: FRONT AXON</text>
    
    <!-- Hull -->
    <circle cx="350" cy="250" r="90" fill="none" stroke="#00ffff" stroke-width="2"/>
    <circle cx="350" cy="250" r="70" fill="none" stroke="#00ffff" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Windows -->
    <path d="M 300,220 A 50,50 0 0 1 400,220" fill="none" stroke="#00ffff" stroke-width="2"/>
    <line x1="300" y1="220" x2="400" y2="220" stroke="#00ffff" stroke-width="1"/>
    <text x="350" y="210" fill="#00ffff" font-size="10" text-anchor="middle">COCKPIT</text>

    <!-- Airlocks (Port/Stbd) -->
    <circle cx="280" cy="250" r="10" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="280" y="275" fill="#00ffff" font-size="8" text-anchor="middle">A/L</text>
    <circle cx="420" cy="250" r="10" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="420" y="275" fill="#00ffff" font-size="8" text-anchor="middle">A/L</text>

    <!-- Radiators -->
    <rect x="160" y="220" width="30" height="60" fill="none" stroke="#00ffff" stroke-width="1"/>
    <line x1="175" y1="220" x2="175" y2="280" stroke="#00ffff" stroke-width="0.5"/>
    <rect x="510" y="220" width="30" height="60" fill="none" stroke="#00ffff" stroke-width="1"/>
    <line x1="525" y1="220" x2="525" y2="280" stroke="#00ffff" stroke-width="0.5"/>

    <!-- Solar Arrays (Perspective) -->
    <path d="M 260,250 L 100,200 L 100,300 L 260,250" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M 440,250 L 600,200 L 600,300 L 440,250" fill="none" stroke="#00ffff" stroke-width="1"/>

    <!-- Landing Gear Legs -->
    <line x1="290" y1="320" x2="270" y2="360" stroke="#00ffff" stroke-width="1"/>
    <line x1="410" y1="320" x2="430" y2="360" stroke="#00ffff" stroke-width="1"/>

    <!-- Dimensions -->
    <line x1="700" y1="160" x2="700" y2="340" stroke="#00ffff" stroke-width="1"/>
    <line x1="690" y1="160" x2="710" y2="160" stroke="#00ffff"/>
    <line x1="690" y1="340" x2="710" y2="340" stroke="#00ffff"/>
    <text x="720" y="255" fill="#00ffff" font-size="12">W: 5.0m</text>
  </g>

  <!-- ==================== VIEW D: SECTION A-A ==================== -->
  <g transform="translate(800, 550)">
    <text x="350" y="30" fill="#00ffff" font-size="20" text-anchor="middle" font-weight="bold">VIEW D: SECTION A-A</text>

    <!-- Section Profile -->
    <path d="M350,50 L380,150 L380,250 L420,300 L420,500 L380,550 L350,550" fill="#0b1e3b" stroke="#00ffff" stroke-width="2"/>
    <line x1="380" y1="50" x2="420" y2="90" stroke="#00ffff" stroke-width="1"/>
    <line x1="380" y1="550" x2="420" y2="510" stroke="#00ffff" stroke-width="1"/>

    <!-- Internal Compartments -->
    
    <!-- Forward Avionics -->
    <rect x="360" y="60" width="40" height="50" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="380" y="85" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90, 380,85)">AVIONICS</text>
    
    <!-- Crew / Life Support -->
    <rect x="360" y="120" width="40" height="80" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="380" y="160" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90, 380,160)">CREW/LSS</text>

    <!-- Cargo -->
    <rect x="360" y="210" width="40" height="70" fill="url(#hatch)" stroke="#00ffff" stroke-width="1"/>
    <text x="380" y="245" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90, 380,245)">CARGO</text>

    <!-- Propellant -->
    <rect x="360" y="290" width="40" height="100" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="380" y="340" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90, 380,340)">PROPELLANT</text>

    <!-- Engine -->
    <rect x="360" y="450" width="40" height="60" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="380" y="480" fill="#00ffff" font-size="10" text-anchor="middle" transform="rotate(90, 380,480)">ENGINE</text>

    <!-- Callouts -->
    <line x1="420" y1="85" x2="500" y2="85" stroke="#00ffff" stroke-width="1"/>
    <circle cx="500" cy="85" r="2" fill="#00ffff"/>
    <text x="510" y="89" fill="#00ffff" font-size="10">1. AVIONICS BAY</text>

    <line x1="420" y1="160" x2="500" y2="160" stroke="#00ffff" stroke-width="1"/>
    <circle cx="500" cy="160" r="2" fill="#00ffff"/>
    <text x="510" y="164" fill="#00ffff" font-size="10">2. CREW COMPARTMENT</text>

    <line x1="420" y1="245" x2="500" y2="245" stroke="#00ffff" stroke-width="1"/>
    <circle cx="500" cy="245" r="2" fill="#00ffff"/>
    <text x="510" y="249" fill="#00ffff" font-size="10">3. CARGO BAY</text>

    <line x1="420" y1="340" x2="500" y2="340" stroke="#00ffff" stroke-width="1"/>
    <circle cx="500" cy="340" r="2" fill="#00ffff"/>
    <text x="510" y="344" fill="#00ffff" font-size="10">4. PROPELLANT TANKS</text>
  </g>

  <!-- ==================== REAR VIEW INSET ==================== -->
  <g transform="translate(1300, 700)">
    <rect x="0" y="0" width="150" height="150" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="75" y="20" fill="#00ffff" font-size="12" text-anchor="middle" font-weight="bold">REAR VIEW</text>
    <!-- Engine Bells -->
    <circle cx="75" cy="80" r="25" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M 60,80 L 90,80" stroke="#00ffff" stroke-width="0.5"/>
    <circle cx="75" cy="80" r="8" fill="none" stroke="#00ffff" stroke-width="1"/>
    <!-- RCS -->
    <circle cx="50" cy="50" r="3" fill="#00ffff"/>
    <circle cx="100" cy="50" r="3" fill="#00ffff"/>
    <circle cx="50" cy="110" r="3" fill="#00ffff"/>
    <circle cx="100" cy="110" r="3" fill="#00ffff"/>
  </g>

  <!-- LEGEND & NOTES -->
  <g transform="translate(1300, 50)">
    <rect width="250" height="600" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="20" y="30" fill="#00ffff" font-size="16" font-weight="bold">COMPONENTS</text>
    <line x1="20" y1="40" x2="230" y2="40" stroke="#00ffff" stroke-width="1"/>
    
    <text x="20" y="60" fill="#00ffff" font-size="12">A. CREW MODULE</text>
    <text x="20" y="80" fill="#00ffff" font-size="12">B. COCKPIT</text>
    <text x="20" y="100" fill="#00ffff" font-size="12">C. DOCKING PORT</text>
    <text x="20" y="120" fill="#00ffff" font-size="12">D. SOLAR ARRAYS</text>
    <text x="20" y="140" fill="#00ffff" font-size="12">E. RADIATORS</text>
    <text x="20" y="160" fill="#00ffff" font-size="12">F. PROPELLANT TK</text>
    <text x="20" y="180" fill="#00ffff" font-size="12">G. MAIN ENGINE</text>
    <text x="20" y="200" fill="#00ffff" font-size="12">H. CARGO BAY</text>
    <text x="20" y="220" fill="#00ffff" font-size="12">I. LIFE SUPPORT</text>
    <text x="20" y="240" fill="#00ffff" font-size="12">J. AVIONICS</text>
    <text x="20" y="260" fill="#00ffff" font-size="12">K. LANDING GEAR</text>
    <text x="20" y="280" fill="#00ffff" font-size="12">L. AIRLOCKS</text>
    <text x="20" y="300" fill="#00ffff" font-size="12">M. ANTENNA</text>

    <text x="20" y="340" fill="#00ffff" font-size="16" font-weight="bold">GENERAL NOTES</text>
    <line x1="20" y1="350" x2="230" y2="350" stroke="#00ffff" stroke-width="1"/>
    <text x="20" y="370" fill="#00ffff" font-size="10">1. ALL DIMENSIONS IN METERS.</text>
    <text x="20" y="385" fill="#00ffff" font-size="10">2. MASS: 14,500 KG (DRY).</text>
    <text x="20" y="400" fill="#00ffff" font-size="10">3. CREW CAPACITY: 4.</text>
    <text x="20" y="415" fill="#00ffff" font-size="10">4. PROPELLANT: LOX/LH2.</text>
    <text x="20" y="440" fill="#00ffff" font-size="10">- STRUCTURE: AL-LI.</text>
    <text x="20" y="455" fill="#00ffff" font-size="10">- THERMAL: RE-ENTRY TILES.</text>
  </g>

  <!-- SCALE MARKER -->
  <g transform="translate(1300, 880)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#00ffff" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#00ffff" stroke-width="2"/>
    <line x1="100" y1="-10" x2="100" y2="10" stroke="#00ffff" stroke-width="2"/>
    <text x="50" y="20" fill="#00ffff" font-size="12" text-anchor="middle">5.0m</text>
  </g>
</svg>