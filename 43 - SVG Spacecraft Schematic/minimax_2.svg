<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Courier New, monospace">
  <!-- Definitions for patterns and markers -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e3a5f" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00ffff" />
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#00ffff" />
    </marker>
    <!-- Hatch Pattern for Cutaway -->
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#005577" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0b1e3b"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title Block -->
  <g transform="translate(50, 1100)">
    <rect width="1500" height="80" fill="#0b1e3b" stroke="#00ffff" stroke-width="2"/>
    <text x="20" y="35" fill="#00ffff" font-size="24" font-weight="bold">PROJECT: AURORA-X</text>
    <text x="20" y="60" fill="#00ffff" font-size="14">ORBITAL TRANSFER VEHICLE (OTV-1)</text>
    <text x="800" y="35" fill="#00ffff" font-size="14">DWG. NO: SP-2023-001</text>
    <text x="800" y="60" fill="#00ffff" font-size="14">SCALE: 1:100</text>
    <text x="1350" y="35" fill="#00ffff" font-size="14">REV: A</text>
    <text x="1350" y="60" fill="#00ffff" font-size="14">SHEET: 1/1</text>
  </g>

  <!-- ==================== VIEW 1: TOP VIEW ==================== -->
  <g transform="translate(50, 50)">
    <text x="350" y="30" fill="#00ffff" font-size="18" text-anchor="middle" font-weight="bold">VIEW A: TOP PLAN</text>
    <line x1="20" y1="400" x2="680" y2="400" stroke="#00ffff" stroke-width="1" stroke-dasharray="10,5"/>
    
    <!-- Main Body -->
    <ellipse cx="350" cy="400" rx="80" ry="250" fill="none" stroke="#00ffff" stroke-width="2"/>
    <!-- Cargo Bay Doors -->
    <line x1="290" y1="150" x2="410" y2="150" stroke="#00ffff" stroke-width="1"/>
    <line x1="290" y1="650" x2="410" y2="650" stroke="#00ffff" stroke-width="1"/>
    <path d="M290,150 L290,650 M410,150 L410,650" stroke="#00ffff" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Docking Port -->
    <circle cx="350" cy="130" r="25" fill="#0b1e3b" stroke="#00ffff" stroke-width="2"/>
    <circle cx="350" cy="130" r="15" fill="#00ffff" fill-opacity="0.2"/>
    <text x="350" y="100" fill="#00ffff" font-size="10" text-anchor="middle">DOCKING PORT</text>

    <!-- Solar Arrays -->
    <rect x="10" y="380" width="60" height="40" fill="none" stroke="#00ffff" stroke-width="1"/>
    <line x1="10" y1="390" x2="70" y2="390" stroke="#00ffff" stroke-width="0.5"/>
    <line x1="10" y1="400" x2="70" y2="400" stroke="#00ffff" stroke-width="0.5"/>
    <line x1="10" y1="410" x2="70" y2="410" stroke="#00ffff" stroke-width="0.5"/>
    <line x1="10" y1="420" x2="70" y2="420" stroke="#00ffff" stroke-width="0.5"/>
    <text x="40" y="375" fill="#00ffff" font-size="10" text-anchor="middle">SOLAR ARRAY</text>

    <rect x="630" y="380" width="60" height="40" fill="none" stroke="#00ffff" stroke-width="1"/>
    <line x1="630" y1="390" x2="690" y2="390" stroke="#00ffff" stroke-width="0.5"/>
    <line x1="630" y1="400" x2="690" y2="400" stroke="#00ffff" stroke-width="0.5"/>
    <line x1="630" y1="410" x2="690" y2="410" stroke="#00ffff" stroke-width="0.5"/>
    <line x1="630" y1="420" x2="690" y2="420" stroke="#00ffff" stroke-width="0.5"/>
    <text x="660" y="375" fill="#00ffff" font-size="10" text-anchor="middle">SOLAR ARRAY</text>

    <!-- Radiators -->
    <path d="M 250,400 L 150,350 L 150,450 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M 450,400 L 550,350 L 550,450 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="150" y="340" fill="#00ffff" font-size="10" text-anchor="middle">RADIATOR</text>

    <!-- Centerline -->
    <line x1="350" y1="100" x2="350" y2="700" stroke="#00ffff" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <!-- ==================== VIEW 2: SIDE VIEW ==================== -->
  <g transform="translate(800, 50)">
    <text x="350" y="30" fill="#00ffff" font-size="18" text-anchor="middle" font-weight="bold">VIEW B: STARBOARD SIDE</text>
    <line x1="20" y1="400" x2="680" y2="400" stroke="#00ffff" stroke-width="1" stroke-dasharray="10,5"/>

    <!-- Outline -->
    <path d="M350,50 L380,150 L380,250 L420,300 L420,500 L380,550 L350,550 L350,50" fill="none" stroke="#00ffff" stroke-width="2"/>
    <!-- Nose Cone -->
    <path d="M350,50 C 300,100 300,150 350,150" fill="none" stroke="#00ffff" stroke-width="2"/> <!-- Faked perspective for shape -->
    <!-- Cockpit Windows -->
    <path d="M355,130 L370,130 L370,140 L355,140" fill="#00ffff" fill-opacity="0.5" stroke="#00ffff"/>
    <text x="380" y="135" fill="#00ffff" font-size="10">COCKPIT</text>

    <!-- Crew Module -->
    <text x="350" y="180" fill="#00ffff" font-size="12" text-anchor="middle">CREW MODULE</text>
    <line x1="380" y1="150" x2="450" y2="150" stroke="#00ffff" stroke-width="1"/>
    
    <!-- Life Support / Avionics -->
    <rect x="390" y="160" width="30" height="60" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="405" y="180" fill="#00ffff" font-size="8" text-anchor="middle" transform="rotate(90, 405,180)">AVIONICS</text>
    
    <!-- Propellant Tank -->
    <rect x="380" y="250" width="40" height="150" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="400" y="325" fill="#00ffff" font-size="10" text-anchor="middle">PROPELLANT</text>
    <text x="400" y="335" fill="#00ffff" font-size="10" text-anchor="middle">TK</text>

    <!-- Cargo Bay -->
    <rect x="380" y="300" width="40" height="80" fill="url(#hatch)" stroke="#00ffff" stroke-width="1"/>
    <text x="400" y="340" fill="#00ffff" font-size="10" text-anchor="middle">CARGO BAY</text>

    <!-- Engines -->
    <path d="M370,500 L430,500 L450,560 L350,560 Z" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="400" y="520" fill="#00ffff" font-size="10" text-anchor="middle">MAIN ENGINE</text>
    
    <!-- Landing Gear -->
    <path d="M400,550 L400,600 L420,620" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M360,550 L360,590 L340,610" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="360" y="600" fill="#00ffff" font-size="10">LANDING GEAR</text>

    <!-- Docking Port Top -->
    <rect x="340" y="40" width="20" height="20" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="350" y="30" fill="#00ffff" font-size="10" text-anchor="middle">DOCKING PORT</text>

    <!-- Antenna -->
    <line x1="350" y1="180" x2="350" y2="220" stroke="#00ffff" stroke-width="1"/>
    <circle cx="350" cy="220" r="5" fill="none" stroke="#00ffff"/>
    <text x="350" y="240" fill="#00ffff" font-size="10" text-anchor="middle">ANTENNA</text>

    <!-- Dimensions -->
    <line x1="480" y1="50" x2="480" y2="560" stroke="#00ffff" stroke-width="1"/>
    <line x1="470" y1="50" x2="490" y2="50" stroke="#00ffff"/>
    <line x1="470" y1="560" x2="490" y2="560" stroke="#00ffff"/>
    <line x1="480" y1="300" x2="520" y2="300" stroke="#00ffff"/>
    <line x1="480" y1="50" x2="520" y2="50" stroke="#00ffff"/>
    <line x1="480" y1="560" x2="520" y2="560" stroke="#00ffff"/>
    <text x="530" y="305" fill="#00ffff" font-size="10">H: 16.0m</text>
  </g>

  <!-- ==================== VIEW 3: FRONT VIEW ==================== -->
  <g transform="translate(50, 550)">
    <text x="350" y="30" fill="#00ffff" font-size="18" text-anchor="middle" font-weight="bold">VIEW C: FRONT AXON</text>
    
    <!-- Main Hull Circle -->
    <circle cx="350" cy="250" r="80" fill="none" stroke="#00ffff" stroke-width="2"/>
    
    <!-- Inner Hull -->
    <circle cx="350" cy="250" r="60" fill="none" stroke="#00ffff" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Heat Shield / Base -->
    <path d="M 300,280 Q 350,320 400,280" fill="none" stroke="#00ffff" stroke-width="1"/>

    <!-- Cockpit Windows -->
    <path d="M 320,220 A 30,30 0 0 1 380,220" fill="none" stroke="#00ffff" stroke-width="1"/>
    <line x1="320" y1="220" x2="380" y2="220" stroke="#00ffff" stroke-width="2"/>

    <!-- Airlocks -->
    <circle cx="310" cy="250" r="8" fill="none" stroke="#00ffff" stroke-width="1"/>
    <circle cx="390" cy="250" r="8" fill="none" stroke="#00ffff" stroke-width="1"/>
    <text x="295" y="265" fill="#00ffff" font-size="8">A/L</text>
    <text x="385" y="265" fill="#00ffff" font-size="8">A/L</text>

    <!-- Radiators -->
    <rect x="150" y="230" width="40" height="40" fill="none" stroke="#00ffff" stroke-width="1"/>
    <rect x="510" y="230" width="40" height="40" fill="none" stroke="#00ffff" stroke-width="1"/>
    <line x1="170" y1="230" x2="170" y2="270" stroke="#00ffff" stroke-width="0.5"/>
    <line x1="530" y1="230" x2="530" y2="270" stroke="#00ffff" stroke-width="0.5"/>

    <!-- Solar Arrays -->
    <line x1="250" y1="250" x2="130" y2="250" stroke="#00ffff" stroke-width="1"/>
    <line x1="450" y1="250" x2="570" y2="250" stroke="#00ffff" stroke-width="1"/>
    <rect x="50" y="210" width="80" height="80" fill="none" stroke="#00ffff" stroke-width="1"/>
    <rect x="570" y="210" width="80" height="80" fill="none" stroke="#00ffff" stroke-width="1"/>

    <!-- Landing Gear (Deployed) -->
    <path d="M 310,310 L 300,350 L 280,360" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M 390,310 L 400,350 L 420,360" fill="none" stroke="#00ffff" stroke-width="1"/>
    
    <!-- RCS Thrusters -->
    <circle cx="270" cy="250" r="3" fill="#00ffff"/>
    <circle cx="430" cy="250" r="3" fill="#00ffff"/>
    <circle cx="350" cy="170" r="3" fill="#00ffff"/>
    <circle cx="350" cy="330" r="3" fill="#00ffff"/>

    <!-- Dimensions -->
    <line x1="650" y1="170" x2="650" y2="330" stroke="#00ffff" stroke-width="1"/>
    <line x1="640" y1="170" x2="660" y2="170" stroke="#00ffff"/>
    <line x1="640" y1="330" x2="660" y2="330" stroke="#00ffff"/>
    <text x="670" y="255" fill="#00ffff" font-size="10">W: 8.0m</text>
  </g>

  <!-- ==================== VIEW 4: REAR / ENGINE VIEW (Inset) ==================== -->
  <g transform="translate(600, 800)">
    <!-- Small inset for Rear View -->
    <rect x="0" y="0" width="150" height="150" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="75" y="20" fill="#00ffff" font-size="12" text-anchor="middle">REAR (ENGINE) VIEW</text>
    <circle cx="75" cy="80" r="30" fill="none" stroke="#00ffff" stroke-width="1"/>
    <path d="M 55,80 L 95,80" stroke="#00ffff" stroke-width="1"/>
    <!-- Engine bells -->
    <circle cx="75" cy="80" r="10" fill="none" stroke="#00ffff" stroke-width="1"/>
    <circle cx="50" cy="60" r="5" fill="none" stroke="#00ffff" stroke-width="1"/>
    <circle cx="100" cy="60" r="5" fill="none" stroke="#00ffff" stroke-width="1"/>
    <circle cx="50" cy="100" r="5" fill="none" stroke="#00ffff" stroke-width="1"/>
    <circle cx="100" cy="100" r="5" fill="none" stroke="#00ffff" stroke-width="1"/>
  </g>

  <!-- ==================== VIEW 5: CUTAWAY SECTION ==================== -->
  <g transform="translate(800, 550)">
    <text x="350" y="30" fill="#00ffff" font-size="18" text-anchor="middle" font-weight="bold">VIEW D: SECTION A-A (LONGITUDINAL)</text>
    
    <!-- Main Profile (Half) -->
    <path d="M350,50 L380,150 L380,250 L420,300 L420,500 L380,550 L350,550" fill="none" stroke="#00ffff" stroke-width="2"/>
    <!-- Fill for internal structure -->
    <path d="M350,50 L380,150 L380,250 L420,300 L420,500 L380,550 L350,550 Z" fill="#0b1e3b" stroke="none"/>
    
    <!-- Section Lines -->
    <line x1="350" y1="40" x2="380" y2="40" stroke="#00ffff" stroke-width="2"/>
    <line x1="380" y1="40" x2="430" y2="90" stroke="#00ffff" stroke-width="1"/>
    <line x1="430" y1="90" x2="430" y2="150" stroke="#00ffff" stroke-width="1"/>
    
    <line x1="350" y1="560" x2="380" y2="560" stroke="#00ffff" stroke-width="2"/>
    <line x1="380" y1="560" x2="430" y2="510" stroke="#00ffff" stroke-width="1"/>
    <line x1="430" y1="510" x2="430" y2="450" stroke="#00ffff" stroke-width="1"/>

    <!-- Internal Components -->
    
    <!-- Avionics Bay -->
    <rect x="360" y="60" width="30" height="40" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="375" y="80" fill="#00ffff" font-size="8" text-anchor="middle" transform="rotate(90, 375,80)">AVIONICS</text>
    
    <!-- Life Support System -->
    <rect x="360" y="110" width="30" height="60" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <line x1="360" y1="130" x2="390" y2="130" stroke="#00ffff" stroke-width="0.5"/>
    <text x="375" y="140" fill="#00ffff" font-size="8" text-anchor="middle" transform="rotate(90, 375,140)">LSS</text>

    <!-- Propellant Tanks -->
    <rect x="360" y="180" width="30" height="120" fill="url(#hatch)" stroke="#00ffff" stroke-width="1"/>
    <text x="375" y="240" fill="#00ffff" font-size="8" text-anchor="middle" transform="rotate(90, 375,240)">LOX/LH2</text>
    <text x="375" y="250" fill="#00ffff" font-size="8" text-anchor="middle" transform="rotate(90, 375,250)">TANKS</text>

    <!-- Cargo Bay -->
    <rect x="360" y="310" width="30" height="60" fill="url(#hatch)" stroke="#00ffff" stroke-width="1"/>
    <text x="375" y="340" fill="#00ffff" font-size="8" text-anchor="middle" transform="rotate(90, 375,340)">CARGO</text>

    <!-- Main Engine Detail -->
    <path d="M370,500 L410,500 L420,540 L360,540 Z" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <path d="M375,520 L405,520" stroke="#00ffff" stroke-width="0.5"/>
    <path d="M375,530 L405,530" stroke="#00ffff" stroke-width="0.5"/>
    <text x="390" y="515" fill="#00ffff" font-size="8" text-anchor="middle">ENGINE</text>
    <text x="390" y="525" fill="#00ffff" font-size="8" text-anchor="middle">NOZZLE</text>

    <!-- Pipes and Wires -->
    <path d="M390,170 C 450,170 450,300 390,300" fill="none" stroke="#00ffff" stroke-width="0.5" stroke-dasharray="2,2"/>
    
    <!-- Callouts -->
    <line x1="420" y1="80" x2="500" y2="80" stroke="#00ffff" stroke-width="1"/>
    <circle cx="500" cy="80" r="2" fill="#00ffff"/>
    <text x="510" y="84" fill="#00ffff" font-size="10">1. AVIONICS BAY</text>

    <line x1="420" y1="240" x2="500" y2="240" stroke="#00ffff" stroke-width="1"/>
    <circle cx="500" cy="240" r="2" fill="#00ffff"/>
    <text x="510" y="244" fill="#00ffff" font-size="10">2. PROPELLANT TANKS</text>

    <line x1="420" y1="340" x2="500" y2="340" stroke="#00ffff" stroke-width="1"/>
    <circle cx="500" cy="340" r="2" fill="#00ffff"/>
    <text x="510" y="344" fill="#00ffff" font-size="10">3. CARGO MODULE</text>

    <line x1="420" y1="520" x2="500" y2="520" stroke="#00ffff" stroke-width="1"/>
    <circle cx="500" cy="520" r="2" fill="#00ffff"/>
    <text x="510" y="524" fill="#00ffff" font-size="10">4. MAIN ENGINE</text>
  </g>

  <!-- General Notes -->
  <g transform="translate(1300, 50)">
    <rect width="250" height="400" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
    <text x="20" y="30" fill="#00ffff" font-size="14" font-weight="bold">GENERAL NOTES</text>
    <text x="20" y="50" fill="#00ffff" font-size="10">1. ALL DIMENSIONS IN METERS.</text>
    <text x="20" y="65" fill="#00ffff" font-size="10">2. MASS: 12,500 KG (DRY).</text>
    <text x="20" y="80" fill="#00ffff" font-size="10">3. PROPELLANT: LOX/LH2.</text>
    <text x="20" y="95" fill="#00ffff" font-size="10">4. CREW CAP: 4.</text>
    <text x="20" y="120" fill="#00ffff" font-size="10">- STRUCTURE: AL-LI ALLOY.</text>
    <text x="20" y="135" fill="#00ffff" font-size="10">- THERMAL PROTECTION:</text>
    <text x="30" y="150" fill="#00ffff" font-size="10">ABLATIVE/REUSEABLE.</text>
    
    <text x="20" y="180" fill="#00ffff" font-size="12" font-weight="bold">SYMBOLS</text>
    <line x1="20" y1="200" x2="50" y2="200" stroke="#00ffff" stroke-width="2"/>
    <text x="60" y="204" fill="#00ffff" font-size="10">VISIBLE LINE</text>
    
    <line x1="20" y1="220" x2="50" y2="220" stroke="#00ffff" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="60" y="224" fill="#00ffff" font-size="10">HIDDEN LINE</text>
    
    <line x1="20" y1="240" x2="50" y2="240" stroke="#00ffff" stroke-width="1" stroke-dasharray="10,5"/>
    <text x="60" y="244" fill="#00ffff" font-size="10">CENTERLINE</text>

    <rect x="20" y="260" width="30" height="20" fill="url(#hatch)" stroke="#00ffff" stroke-width="1"/>
    <text x="60" y="274" fill="#00ffff" font-size="10">INT. STRUCTURE</text>
  </g>
  
  <!-- Legend / Component List -->
  <g transform="translate(1300, 500)">
     <rect width="250" height="200" fill="#0b1e3b" stroke="#00ffff" stroke-width="1"/>
     <text x="20" y="30" fill="#00ffff" font-size="14" font-weight="bold">COMPONENTS</text>
     <text x="20" y="50" fill="#00ffff" font-size="10">A. CREW MODULE</text>
     <text x="20" y="65" fill="#00ffff" font-size="10">B. DOCKING MECHANISM</text>
     <text x="20" y="80" fill="#00ffff" font-size="10">C. PROPULSION UNIT</text>
     <text x="20" y="95" fill="#00ffff" font-size="10">D. POWER GENERATION</text>
     <text x="20" y="110" fill="#00ffff" font-size="10">E. THERMAL CONTROL</text>
     <text x="20" y="125" fill="#00ffff" font-size="10">F. LIFE SUPPORT</text>
     <text x="20" y="140" fill="#00ffff" font-size="10">G. AVIONICS</text>
     <text x="20" y="155" fill="#00ffff" font-size="10">H. LANDING GEAR</text>
     <text x="20" y="170" fill="#00ffff" font-size="10">I. CARGO BAY</text>
     <text x="20" y="185" fill="#00ffff" font-size="10">J. RCS THRUSTERS</text>
  </g>

</svg>