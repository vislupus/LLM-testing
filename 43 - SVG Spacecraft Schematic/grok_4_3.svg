<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Blueprint Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#003355" stroke-width="0.4"/>
    </pattern>
    <pattern id="fine-grid" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#003355" stroke-width="0.15"/>
    </pattern>
    
    <!-- Technical Patterns -->
    <pattern id="solar-grid" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#001122"/>
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#00aaff" stroke-width="0.3" opacity="0.6"/>
    </pattern>
    <pattern id="radiator-grid" width="3" height="20" patternUnits="userSpaceOnUse">
      <line x1="1.5" y1="0" x2="1.5" y2="20" stroke="#00aaff" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <pattern id="cutaway-hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ff9900" stroke-width="0.6" opacity="0.4"/>
    </pattern>
    
    <!-- Markers -->
    <marker id="dim-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00ccff"/>
    </marker>
    <marker id="callout-dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4">
      <circle cx="3" cy="3" r="2.5" fill="#ff9900"/>
    </marker>
  </defs>

  <style>
    .hull { stroke: #00ccff; stroke-width: 1.8; fill: none; stroke-linejoin: round; }
    .structure { stroke: #0088cc; stroke-width: 0.9; fill: none; }
    .internal { stroke: #ff9900; stroke-width: 1.1; fill: none; }
    .dimension { stroke: #00aaff; stroke-width: 0.7; fill: none; }
    .centerline { stroke: #ff9900; stroke-width: 0.6; stroke-dasharray: 12 4 2 4; }
    .text-label { fill: #00ccff; font-family: 'Consolas', monospace; font-size: 9px; font-weight: bold; }
    .text-title { fill: #ffffff; font-family: 'Consolas', monospace; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
    .text-dim { fill: #00aaff; font-family: 'Consolas', monospace; font-size: 8px; }
    .text-callout { fill: #ff9900; font-family: 'Consolas', monospace; font-size: 8px; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#000a14"/>
  <rect width="1920" height="1080" fill="url(#fine-grid)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="30" y="30" width="1860" height="1020" fill="none" stroke="#003355" stroke-width="3"/>

  <!-- ==================== TITLE BLOCK ==================== -->
  <g transform="translate(1450, 880)">
    <rect width="420" height="150" fill="#000a14" stroke="#00ccff" stroke-width="2"/>
    <text x="15" y="25" class="text-title">AETHER-9 DEEP SPACE CRUISER</text>
    <text x="15" y="45" class="text-label">SYSTEM ENGINEERING BLUEPRINT • REV 7.3</text>
    <line x1="15" y1="55" x2="405" y2="55" stroke="#00ccff" stroke-width="0.8"/>
    <text x="15" y="72" class="text-label">DRAWING NO: AE9-SCH-0073</text>
    <text x="15" y="88" class="text-label">SCALE: 1:120 METRIC</text>
    <text x="15" y="104" class="text-label">SHEET: 1 OF 1</text>
    <text x="15" y="120" class="text-label">DESIGN: ORION AEROSPACE • 2047</text>
    <text x="15" y="136" class="text-label">CONFIDENTIAL • FOR AUTHORIZED USE ONLY</text>
  </g>

  <!-- ==================== TOP VIEW ==================== -->
  <g id="top-view" transform="translate(80, 80)">
    <text x="0" y="-15" class="text-title">TOP VIEW — DORSAL LAYOUT</text>
    <line x1="0" y1="120" x2="620" y2="120" class="centerline"/>
    
    <!-- Solar Arrays -->
    <g>
      <rect x="220" y="-95" width="180" height="65" fill="url(#solar-grid)" class="hull"/>
      <rect x="220" y="150" width="180" height="65" fill="url(#solar-grid)" class="hull"/>
      <line x1="310" y1="30" x2="310" y2="-95" class="structure"/>
      <line x1="310" y1="120" x2="310" y2="215" class="structure"/>
    </g>
    
    <!-- Main Hull -->
    <path d="M 40,120 Q 60,75 120,75 L 200,70 L 380,70 L 480,85 L 560,110 L 580,120 L 580,130 L 560,140 L 480,165 L 380,180 L 200,180 L 120,175 Q 60,165 40,120" class="hull"/>
    
    <!-- Structural Panels -->
    <line x1="120" y1="75" x2="120" y2="175" class="structure"/>
    <line x1="200" y1="70" x2="200" y2="180" class="structure"/>
    <line x1="380" y1="70" x2="380" y2="180" class="structure"/>
    <line x1="480" y1="85" x2="480" y2="165" class="structure"/>
    
    <!-- Docking Port (Top) -->
    <circle cx="310" cy="120" r="18" class="hull"/>
    <circle cx="310" cy="120" r="10" fill="none" class="structure"/>
    
    <!-- Radiators -->
    <rect x="440" y="55" width="95" height="18" fill="url(#radiator-grid)" class="hull"/>
    <rect x="440" y="167" width="95" height="18" fill="url(#radiator-grid)" class="hull"/>
    
    <!-- Antennas -->
    <line x1="140" y1="70" x2="110" y2="25" class="structure"/>
    <circle cx="110" cy="25" r="5" class="hull"/>
  </g>

  <!-- ==================== SIDE VIEW ==================== -->
  <g id="side-view" transform="translate(80, 380)">
    <text x="0" y="-15" class="text-title">SIDE VIEW — PORT PROFILE</text>
    <line x1="0" y1="120" x2="620" y2="120" class="centerline"/>
    
    <!-- Landing Gear -->
    <g>
      <!-- Front Gear -->
      <line x1="95" y1="140" x2="75" y2="195" class="hull"/>
      <rect x="55" y="195" width="40" height="6" class="hull"/>
      <!-- Rear Gear -->
      <line x1="480" y1="145" x2="460" y2="195" class="hull"/>
      <rect x="440" y="195" width="40" height="6" class="hull"/>
    </g>
    
    <!-- Main Hull -->
    <path d="M 40,120 Q 55,85 110,85 L 200,80 L 380,80 L 480,95 L 560,115 L 575,120 L 575,130 L 560,135 L 480,155 L 380,170 L 200,170 L 110,165 Q 55,155 40,120" class="hull"/>
    
    <!-- Cockpit Windows -->
    <path d="M 55,100 L 95,92 L 95,108 L 55,100" class="hull"/>
    <line x1="70" y1="92" x2="70" y2="108" class="structure"/>
    
    <!-- Airlock -->
    <rect x="165" y="95" width="28" height="50" rx="4" class="hull"/>
    <circle cx="179" cy="120" r="6" class="structure"/>
    
    <!-- Antenna -->
    <line x1="145" y1="80" x2="125" y2="45" class="structure"/>
    <path d="M 120,40 Q 125,30 135,40" class="hull"/>
    
    <!-- Engines -->
    <path d="M 575,105 L 610,95 L 610,145 L 575,135 Z" class="hull"/>
    <path d="M 575,115 L 595,110 L 595,130 L 575,125 Z" fill="none" class="structure"/>
    
    <!-- Radiator -->
    <rect x="420" y="75" width="110" height="12" fill="url(#radiator-grid)" class="hull"/>
  </g>

  <!-- ==================== CUTAWAY VIEW ==================== -->
  <g id="cutaway-view" transform="translate(80, 680)">
    <text x="0" y="-15" class="text-title" fill="#ff9900">CUTAWAY VIEW — INTERNAL SYSTEMS</text>
    <line x1="0" y1="120" x2="620" y2="120" class="centerline"/>
    
    <!-- Ghost Hull Outline -->
    <path d="M 40,120 Q 55,85 110,85 L 200,80 L 380,80 L 480,95 L 560,115 L 575,120 L 575,130 L 560,135 L 480,155 L 380,170 L 200,170 L 110,165 Q 55,155 40,120" fill="none" stroke="#003355" stroke-width="1" stroke-dasharray="4,2"/>
    
    <!-- Cockpit / Avionics -->
    <rect x="45" y="92" width="55" height="55" fill="url(#cutaway-hatch)" class="internal"/>
    <text x="50" y="115" class="text-callout">AVIONICS</text>
    
    <!-- Crew Module -->
    <rect x="105" y="85" width="85" height="70" fill="url(#cutaway-hatch)" class="internal"/>
    <text x="115" y="115" class="text-callout">CREW MODULE</text>
    
    <!-- Life Support -->
    <rect x="195" y="95" width="45" height="50" fill="url(#cutaway-hatch)" class="internal"/>
    <text x="200" y="120" class="text-callout">ECLSS</text>
    
    <!-- Cargo Bay -->
    <rect x="245" y="82" width="140" height="76" fill="url(#cutaway-hatch)" class="internal"/>
    <text x="280" y="115" class="text-callout">CARGO BAY</text>
    
    <!-- Propellant Tanks -->
    <circle cx="430" cy="120" r="28" fill="url(#cutaway-hatch)" class="internal"/>
    <text x="415" y="125" class="text-callout">LH₂</text>
    <circle cx="490" cy="120" r="22" fill="url(#cutaway-hatch)" class="internal"/>
    <text x="480" y="125" class="text-callout">LOX</text>
    
    <!-- Engines -->
    <path d="M 575,105 L 610,95 L 610,145 L 575,135 Z" fill="none" class="internal"/>
    <path d="M 575,115 L 595,110 L 595,130 L 575,125 Z" fill="none" class="propulsion"/>
  </g>

  <!-- ==================== FRONT VIEW ==================== -->
  <g id="front-view" transform="translate(780, 80)">
    <text x="0" y="-15" class="text-title">FRONT VIEW</text>
    
    <!-- Solar Array Edges -->
    <line x1="-60" y1="120" x2="-140" y2="120" class="hull"/>
    <line x1="260" y1="120" x2="340" y2="120" class="hull"/>
    
    <!-- Hull Cross-Section -->
    <path d="M 0,60 Q 40,40 80,60 L 130,85 L 180,100 L 200,120 L 180,140 L 130,155 L 80,180 Q 40,200 0,180 Z" class="hull"/>
    
    <!-- Docking Port -->
    <circle cx="100" cy="120" r="22" class="hull"/>
    <circle cx="100" cy="120" r="12" class="structure"/>
    
    <!-- Landing Gear (Front) -->
    <line x1="60" y1="180" x2="45" y2="230" class="hull"/>
    <rect x="25" y="230" width="40" height="5" class="hull"/>
  </g>

  <!-- ==================== REAR VIEW ==================== -->
  <g id="rear-view" transform="translate(780, 380)">
    <text x="0" y="-15" class="text-title">REAR VIEW</text>
    
    <!-- Solar Array Edges -->
    <line x1="-60" y1="120" x2="-140" y2="120" class="hull"/>
    <line x1="260" y1="120" x2="340" y2="120" class="hull"/>
    
    <!-- Hull Cross-Section -->
    <path d="M 0,60 Q 40,40 80,60 L 130,85 L 180,100 L 200,120 L 180,140 L 130,155 L 80,180 Q 40,200 0,180 Z" class="hull"/>
    
    <!-- Dual Engines -->
    <circle cx="75" cy="120" r="18" class="hull"/>
    <circle cx="125" cy="120" r="18" class="hull"/>
    <circle cx="75" cy="120" r="8" fill="none" class="propulsion"/>
    <circle cx="125" cy="120" r="8" fill="none" class="propulsion"/>
    
    <!-- Radiator Edges -->
    <rect x="20" y="70" width="30" height="8" fill="url(#radiator-grid)" class="hull"/>
    <rect x="150" y="162" width="30" height="8" fill="url(#radiator-grid)" class="hull"/>
  </g>

  <!-- ==================== DIMENSIONS & CALLOUTS ==================== -->
  <g id="dimensions">
    <!-- Overall Length -->
    <line x1="80" y1="70" x2="700" y2="70" class="dimension" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
    <text x="380" y="62" class="text-dim" text-anchor="middle">OVERALL LENGTH: 52.4 m</text>
    
    <!-- Width -->
    <line x1="760" y1="80" x2="760" y2="240" class="dimension" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
    <text x="768" y="160" class="text-dim">WINGSPAN: 28.8 m</text>
    
    <!-- Height -->
    <line x1="760" y1="380" x2="760" y2="580" class="dimension" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
    <text x="768" y="480" class="text-dim">HEIGHT: 9.6 m</text>
    
    <!-- Section Callouts -->
    <g>
      <!-- Cockpit -->
      <line x1="130" y1="380" x2="100" y2="320" class="dimension"/>
      <text x="55" y="315" class="text-callout">01 — COCKPIT</text>
      
      <!-- Life Support -->
      <line x1="220" y1="680" x2="190" y2="620" class="dimension"/>
      <text x="145" y="615" class="text-callout">02 — LIFE SUPPORT</text>
      
      <!-- Propellant Tanks -->
      <line x1="460" y1="680" x2="430" y2="620" class="dimension"/>
      <text x="385" y="615" class="text-callout">03 — PROPELLANT TANKS</text>
      
      <!-- Engines -->
      <line x1="590" y1="380" x2="560" y2="320" class="dimension"/>
      <text x="505" y="315" class="text-callout">04 — MAIN ENGINES</text>
    </g>
  </g>

  <!-- Scale Bar -->
  <g transform="translate(80, 1020)">
    <rect x="0" y="0" width="80" height="4" fill="#00ccff"/>
    <rect x="80" y="0" width="80" height="4" fill="none" stroke="#00ccff" stroke-width="1"/>
    <rect x="160" y="0" width="80" height="4" fill="#00ccff"/>
    <text x="0" y="18" class="text-dim">0m</text>
    <text x="75" y="18" class="text-dim">10m</text>
    <text x="155" y="18" class="text-dim">20m</text>
    <text x="0" y="-8" class="text-label">METRIC SCALE REFERENCE</text>
  </g>

</svg>