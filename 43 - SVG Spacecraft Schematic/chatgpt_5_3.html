<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aerospace Spacecraft Schematic</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --bg: #061427;
      --grid: #103456;
      --line: #89d6ff;
      --line-dim: #4aa6d8;
      --accent: #00ffd0;
      --text: #cbefff;
      --warn: #ffe28a;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: radial-gradient(circle at 80% 20%, #0a2b4b 0%, #061427 55%);
    }

    .line-main { stroke: var(--line); stroke-width: 2; fill: none; }
    .line-thin { stroke: var(--line-dim); stroke-width: 1.2; fill: none; }
    .line-dash { stroke: var(--line-dim); stroke-width: 1.1; fill: none; stroke-dasharray: 7 6; }
    .line-hidden { stroke: #2e86b9; stroke-width: 1; fill: none; stroke-dasharray: 3 5; }
    .label { fill: var(--text); font-size: 14px; letter-spacing: 0.8px; }
    .label-sm { fill: var(--text); font-size: 12px; letter-spacing: 0.7px; }
    .heading { fill: var(--accent); font-size: 18px; font-weight: 600; letter-spacing: 1.2px; }
    .title { fill: #e2f6ff; font-size: 36px; font-weight: 700; letter-spacing: 2px; }
    .dim { fill: #9fe4ff; font-size: 12px; letter-spacing: 1px; }
    .hatch { fill: url(#hatchPattern); opacity: 0.45; }
    .cut-fill { fill: #0a3150; opacity: 0.45; }
  </style>
</head>
<body>
  <main class="min-h-screen w-full">
    <svg viewBox="0 0 1800 1300" xmlns="http://www.w3.org/2000/svg" aria-labelledby="drawingTitle drawingDesc" role="img">

      <desc id="drawingDesc">Technical engineering blueprint showing top, side, front, rear, and cutaway views with dimensions and subsystem labels.</desc>

      <defs>
        <pattern id="gridSmall" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" class="line-thin" opacity="0.18" />

        <pattern id="gridLarge" width="100" height="100" patternUnits="userSpaceOnUse">

          <path d="M 100 0 L 0 0 0 100" class="line-thin" opacity="0.35" />
        </pattern>
        <pattern id="hatchPattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#7ec8ef" stroke-width="1" />
        </pattern>
        <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
          <path d="M 0 1 L 11 6 L 0 11 z" fill="#9fe4ff" />
        </marker>

      <text x="70" y="104" class="label">MULTI-VIEW ENGINEERING BLUEPRINT | SCALE 1:200 | UNITS: METERS</text>

  <script>
    // Fill the title block date in UTC so the blueprint always reflects generation time.
    const dateNode = document.getElementById('drawDate');
    const now = new Date();
    const stamp = now.toISOString().slice(0, 10);
    dateNode.textContent = stamp;
  </script>
</body>
