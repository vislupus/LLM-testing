<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#000"/>
    </marker>
    <marker id="tick" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#000" stroke-width="1"/>
      <line x1="6" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="#f4f6f8"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <!-- Title Block -->
  <g transform="translate(1180, 870)">
    <rect x="0" y="0" width="380" height="210" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="380" y2="40" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="80" x2="380" y2="80" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="120" x2="380" y2="120" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="160" x2="380" y2="160" stroke="#000" stroke-width="1"/>
    <line x1="190" y1="80" x2="190" y2="210" stroke="#000" stroke-width="1"/>
    <text x="10" y="26" font-size="16" font-weight="bold">AEROSPACE ENGINEERING BLUEPRINT</text>
    <text x="10" y="62" font-size="12">VEHICLE: ORION-X MULTIROLE SPACECRAFT</text>
    <text x="10" y="102" font-size="12">DWG NO: OX-2024-001</text>
    <text x="200" y="102" font-size="12">REV: B</text>
    <text x="10" y="142" font-size="12">SCALE: 1:200 (NTS DETAILS)</text>
    <text x="200" y="142" font-size="12">UNITS: METRIC</text>
    <text x="10" y="182" font-size="12">DRAWN: J. SMITH</text>
    <text x="200" y="182" font-size="12">DATE: 2025-03</text>
    <text x="10" y="202" font-size="10" fill="#666">APPROVED FOR RELEASE</text>
  </g>

  <!-- Scale Bar -->
  <g transform="translate(40, 1040)">
    <rect x="0" y="0" width="50" height="8" fill="#000"/>
    <rect x="50" y="0" width="50" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="100" y="0" width="50" height="8" fill="#000"/>
    <rect x="150" y="0" width="50" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <text x="0" y="22" font-size="11">0</text>
    <text x="95" y="22" font-size="11">10</text>
    <text x="195" y="22" font-size="11">20 m</text>
    <text x="0" y="38" font-size="10" fill="#666">SCALE 1:200</text>
  </g>

  <!-- Section Line Indicator -->
  <g transform="translate(40, 40)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1.5" stroke-dasharray="10,4,2,4"/>
    <polygon points="40,0 34,4 34,-4" fill="#000"/>
    <text x="48" y="4" font-size="12" font-weight="bold">SECTION A-A (CUTAWAY)</text>
  </g>

  <!-- ================= TOP VIEW ================= -->
  <g transform="translate(120, 120)">
    <text x="250" y="-20" font-size="18" font-weight="bold" text-anchor="middle">TOP VIEW (PLAN)</text>
    <!-- Hull outline -->
    <rect x="50" y="60" width="400" height="100" rx="50" ry="50" fill="none" stroke="#000" stroke-width="2.5"/>
    <path d="M50 110 Q20 110 50 60 Z" fill="none" stroke="#000" stroke-width="2.5"/>
    <path d="M450 110 Q480 110 450 160 Z" fill="none" stroke="#000" stroke-width="2.5"/>
    <!-- Crew module -->
    <ellipse cx="120" cy="110" rx="45" ry="30" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- Cargo bay -->
    <rect x="220" y="70" width="120" height="80" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="220" y1="95" x2="340" y2="95" stroke="#333" stroke-width="1"/>
    <line x1="220" y1="125" x2="340" y2="125" stroke="#333" stroke-width="1"/>
    <!-- Engines (top projection) -->
    <circle cx="420" cy="90" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="420" cy="110" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="420" cy="130" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="440" cy="100" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="440" cy="120" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Radiators (stowed) -->
    <rect x="180" y="40" width="8" height="20" fill="none" stroke="#555" stroke-width="1"/>
    <rect x="360" y="40" width="8" height="20" fill="none" stroke="#555" stroke-width="1"/>
    <!-- Solar arrays folded -->
    <rect x="10" y="80" width="30" height="60" fill="none" stroke="#555" stroke-width="1"/>
    <rect x="460" y="80" width="30" height="60" fill="none" stroke="#555" stroke-width="1"/>
    <!-- Antennas -->
    <circle cx="250" cy="50" r="4" fill="none" stroke="#555" stroke-width="1"/>
    <line x1="250" y1="46" x2="250" y2="30" stroke="#555" stroke-width="1"/>
    <!-- Dimensions -->
    <g stroke="#000" stroke-width="1">
      <line x1="20" y1="40" x2="20" y2="180" stroke-dasharray="3,3"/>
      <line x1="480" y1="40" x2="480" y2="180" stroke-dasharray="3,3"/>
      <line x1="20" y1="40" x2="480" y2="40" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text x="250" y="32" font-size="12" text-anchor="middle">48.0 m</text>
    </g>
    <g stroke="#000" stroke-width="1">
      <line x1="50" y1="180" x2="450" y2="180" stroke-dasharray="3,3"/>
      <line x1="50" y1="175" x2="50" y2="185" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <line x1="450" y1="175" x2="450" y2="185" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <text x="250" y="198" font-size="12" text-anchor="middle">9.0 m BEAM</text>
    </g>
    <!-- Callouts -->
    <g font-size="11" stroke="#000" stroke-width="0.8" fill="#000">
      <line x1="120" y1="80" x2="80" y2="40"/><text x="20" y="36">CREW MODULE</text>
      <line x1="280" y1="70" x2="320" y2="30"/><text x="325" y="26">CARGO BAY (PRESSURIZED)</text>
      <line x1="420" y1="90" x2="470" y2="50"/><text x="475" y="46">ENGINE CLUSTER (9X)</text>
      <line x1="15" y1="110" x2="-30" y2="110"/><text x="-90" y="114" text-anchor="end">SOLAR ARRAY (STOWED)</text>
      <line x1="250" y1="50" x2="250" y2="20"/><text x="255" y="16">HIGH-GAIN ANTENNA</text>
    </g>
  </g>

  <!-- ================= FRONT VIEW ================= -->
  <g transform="translate(640, 120)">
    <text x="150" y="-20" font-size="18" font-weight="bold" text-anchor="middle">FRONT VIEW (ELEVATION)</text>
    <!-- Nose / Docking -->
    <circle cx="150" cy="80" r="12" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M110 110 Q150 40 190 110" fill="none" stroke="#000" stroke-width="2.5"/>
    <!-- Hull -->
    <ellipse cx="150" cy="130" rx="60" ry="40" fill="none" stroke="#000" stroke-width="2.5"/>
    <!-- Cockpit windows -->
    <path d="M120 110 Q150 90 180 110" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Radiators -->
    <rect x="90" y="140" width="6" height="40" rx="2" fill="none" stroke="#555" stroke-width="1"/>
    <rect x="204" y="140" width="6" height="40" rx="2" fill="none" stroke="#555" stroke-width="1"/>
    <!-- Antennas -->
    <circle cx="130" cy="95" r="3" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="170" cy="95" r="3" fill="none" stroke="#555" stroke-width="1"/>
    <!-- Dimensions -->
    <g stroke="#000" stroke-width="1">
      <line x1="60" y1="60" x2="240" y2="60" stroke-dasharray="3,3"/>
      <line x1="60" y1="55" x2="60" y2="65" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <line x1="240" y1="55" x2="240" y2="65" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <text x="150" y="50" font-size="12" text-anchor="middle">9.0 m DIA</text>
    </g>
    <!-- Callouts -->
    <g font-size="11" stroke="#000" stroke-width="0.8" fill="#000">
      <line x1="150" y1="68" x2="200" y2="40"/><text x="205" y="36">DOCKING PORT (ANDROGYNOUS)</text>
      <line x1="150" y1="100" x2="200" y2="80"/><text x="205" y="76">CREW COCKPIT / VIEWPORT</text>
      <line x1="93" y1="160" x2="50" y2="180"/><text x="45" y="184" text-anchor="end">RADIATOR PANEL</text>
    </g>
  </g>

  <!-- ================= SIDE VIEW ================= -->
  <g transform="translate(980, 120)">
    <text x="220" y="-20" font-size="18" font-weight="bold" text-anchor="middle">SIDE VIEW (PROFILE)</text>
    <!-- Hull -->
    <rect x="40" y="60" width="400" height="100" rx="50" ry="50" fill="none" stroke="#000" stroke-width="2.5"/>
    <path d="M40 110 Q10 110 40 60 Z" fill="none" stroke="#000" stroke-width="2.5"/>
    <!-- Engine nozzles -->
    <path d="M440 90 Q470 110 440 130 Z" fill="none" stroke="#000" stroke-width="2.5"/>
    <path d="M440 80 Q465 110 440 140 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Crew module -->
    <ellipse cx="100" cy="110" rx="40" ry="25" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
    <!-- Airlocks -->
    <circle cx="150" cy="70" r="7" fill="none" stroke="#555" stroke-width="1.5"/>
    <circle cx="150" cy="150" r="7" fill="none" stroke="#555" stroke-width="1.5"/>
    <!-- Cargo bay -->
    <rect x="190" y="70" width="140" height="80" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="190" y1="95" x2="330" y2="95" stroke="#333" stroke-width="1"/>
    <line x1="190" y1="125" x2="330" y2="125" stroke="#333" stroke-width="1"/>
    <!-- Landing gear (stowed) -->
    <rect x="360" y="150" width="24" height="14" rx="3" fill="none" stroke="#666" stroke-width="1"/>
    <rect x="390" y="150" width="24" height="14" rx="3" fill="none" stroke="#666" stroke-width="1"/>
    <!-- Radiators -->
    <path d="M170 30 L180 10 L190 30 L180 50 Z" fill="none" stroke="#555" stroke-width="1"/>
    <!-- Solar array stowed -->
    <rect x="0" y="80" width="30" height="60" fill="none" stroke="#555" stroke-width="1"/>
    <!-- Dimensions -->
    <g stroke="#000" stroke-width="1">
      <line x1="470" y1="60" x2="470" y2="160" stroke-dasharray="3,3"/>
      <line x1="465" y1="60" x2="475" y2="60" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <line x1="465" y1="160" x2="475" y2="160" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <text x="485" y="115" font-size="12">9.0 m</text>
    </g>
    <!-- Callouts -->
    <g font-size="11" stroke="#000" stroke-width="0.8" fill="#000">
      <line x1="100" y1="85" x2="60" y2="40"/><text x="20" y="36">CREW MODULE</text>
      <line x1="150" y1="70" x2="120" y2="30"/><text x="80" y="26">AIRLOCK (UPPER)</text>
      <line x1="260" y1="70" x2="300" y2="30"/><text x="305" y="26">CARGO BAY DOOR</text>
      <line x1="372" y1="164" x2="410" y2="190"/><text x="415" y="194">LANDING GEAR (STOWED)</text>
      <line x1="450" y1="110" x2="490" y2="80"/><text x="495" y="76">MAIN ENGINES</text>
      <line x1="180" y1="20" x2="220" y2="10"/><text x="225" y="6">RADIATOR</text>
    </g>
  </g>

  <!-- ================= REAR VIEW ================= -->
  <g transform="translate(200, 560)">
    <text x="150" y="-20" font-size="18" font-weight="bold" text-anchor="middle">REAR VIEW (STERN)</text>
    <!-- Hull -->
    <ellipse cx="150" cy="120" rx="60" ry="40" fill="none" stroke="#000" stroke-width="2.5"/>
    <!-- Engine cluster (9) -->
    <g fill="none" stroke="#000" stroke-width="2">
      <ellipse cx="150" cy="120" rx="18" ry="14"/>
      <ellipse cx="110" cy="100" rx="14" ry="11"/>
      <ellipse cx="190" cy="100" rx="14" ry="11"/>
      <ellipse cx="110" cy="140" rx="14" ry="11"/>
      <ellipse cx="190" cy="140" rx="14" ry="11"/>
      <ellipse cx="90" cy="120" rx="10" ry="8"/>
      <ellipse cx="210" cy="120" rx="10" ry="8"/>
      <ellipse cx="130" cy="85" rx="10" ry="8"/>
      <ellipse cx="170" cy="155" rx="10" ry="8"/>
    </g>
    <!-- RCS -->
    <circle cx="100" cy="80" r="3" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="200" cy="80" r="3" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="100" cy="160" r="3" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="200" cy="160" r="3" fill="none" stroke="#555" stroke-width="1"/>
    <!-- Dimensions -->
    <g stroke="#000" stroke-width="1">
      <line x1="60" y1="70" x2="240" y2="70" stroke-dasharray="3,3"/>
      <line x1="60" y1="65" x2="60" y2="75" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <line x1="240" y1="65" x2="240" y2="75" marker-start="url(#tick)" marker-end="url(#tick)"/>
      <text x="150" y="60" font-size="12" text-anchor="middle">9.0 m</text>
    </g>
    <!-- Callouts -->
    <g font-size="11" stroke="#000" stroke-width="0.8" fill="#000">
      <line x1="150" y1="134" x2="200" y2="170"/><text x="205" y="174">MAIN PROPULSION (9X RAPTOR)</text>
      <line x1="100" y1="80" x2="60" y2="50"/><text x="55" y="46" text-anchor="end">RCS QUAD</text>
    </g>
  </g>

  <!-- ================= CUTAWAY (SECTION A-A) ================= -->
  <g transform="translate(560, 560)">
    <text x="200" y="-20" font-size="18" font-weight="bold" text-anchor="middle">CUTAWAY VIEW — SECTION A-A</text>
    <!-- External hull -->
    <rect x="0" y="60" width="400" height="100" rx="50" ry="50" fill="url(#hatch)" stroke="#000" stroke-width="2.5"/>
    <path d="M0 110 Q-30 110 0 60 Z" fill="url(#hatch)" stroke="#000" stroke-width="2.5"/>
    <path d="M400 110 Q430 110 400 160 Z" fill="url(#hatch)" stroke="#000" stroke-width="2.5"/>
    <!-- Propellant tanks -->
    <rect x="120" y="70" width="200" height="80" fill="#e8f4ff" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="220" y1="70" x2="220" y2="150" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="170" y="115" font-size="10" fill="#333">LOX TANK</text>
    <text x="250" y="115" font-size="10" fill="#333">CH4 TANK</text>
    <!-- Crew module internals -->
    <ellipse cx="70" cy="110" rx="40" ry="25" fill="#ffe6e6" stroke="#333" stroke-width="1.5"/>
    <rect x="55" y="100" width="30" height="20" fill="none" stroke="#666" stroke-width="1"/>
    <text x="70" y="90" font-size="9" text-anchor="middle" fill="#333">CREW SEATS</text>
    <!-- Avionics -->
    <rect x="10" y="80" width="40" height="30" fill="#fff3cd" stroke="#666" stroke-width="1"/>
    <text x="30" y="100" font-size="8" text-anchor="middle" fill="#333">AVIONICS</text>
    <!-- Life support -->
    <rect x="90" y="80" width="30" height="30" fill="#d4edda" stroke="#666" stroke-width="1"/>
    <text x="105" y="100" font-size="8" text-anchor="middle" fill="#333">LSS</text>
    <!-- Cargo bay internals -->
    <rect x="330" y="75" width="60" height="70" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="330" y1="100" x2="390" y2="100" stroke="#555" stroke-width="1"/>
    <text x="360" y="90" font-size="9" text-anchor="middle" fill="#333">CARGO</text>
    <!-- Engine manifold -->
    <path d="M400 95 L430 95 L430 125 L400 125 Z" fill="#dee2e6" stroke="#000" stroke-width="1.5"/>
    <line x1="415" y1="95" x2="415" y2="125" stroke="#666" stroke-width="1"/>
    <!-- Airlocks (sectioned) -->
    <circle cx="150" cy="70" r="6" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <circle cx="150" cy="150" r="6" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <!-- Section line markers -->
    <text x="-10" y="45" font-size="12" font-weight="bold">A</text>
    <text x="410" y="45" font-size="12" font-weight="bold">A</text>
    <!-- Callouts -->
    <g font-size="11" stroke="#000" stroke-width="0.8" fill="#000">
      <line x1="30" y1="80" x2="-10" y2="40"/><text x="-15" y="36" text-anchor="end">AVIONICS BAY</text>
      <line x1="70" y1="85" x2="40" y2="30"/><text x="35" y="26">CREW MODULE (SECTIONED)</text>
      <line x1="105" y1="80" x2="140" y2="30"/><text x="145" y="26">LIFE-SUPPORT SYS</text>
      <line x1="220" y1="70" x2="260" y2="30"/><text x="265" y="26">PROPELLANT TANKS (LOX/CH4)</text>
      <line x1="360" y1="75" x2="400" y2="40"/><text x="405" y="36">CARGO BAY (PRESS)</text>
      <line x1="415" y1="125" x2="450" y2="160"/><text x="455" y="164">ENGINE MANIFOLD</text>
      <line x1="150" y1="70" x2="180" y2="40"/><text x="185" y="36">AIRLOCK HATCH</text>
    </g>
    <!-- Structural detail note -->
    <text x="200" y="185" font-size="9" fill="#666" text-anchor="middle">BULKHEAD STIFFENERS @ 2.0m INTERVALS — SEE DETAIL D</text>
  </g>

  <!-- View separation lines -->
  <g stroke="#aaa" stroke-width="1" stroke-dasharray="6,4">
    <line x1="600" y1="80" x2="600" y2="300"/>
    <line x1="900" y1="80" x2="900" y2="300"/>
    <line x1="80" y1="500" x2="1520" y2="500"/>
    <line x1="480" y1="520" x2="480" y2="780"/>
    <line x1="940" y1="520" x2="940" y2="780"/>
  </g>

  <!-- Legend -->
  <g transform="translate(1180, 780)" font-size="10">
    <rect x="0" y="0" width="380" height="80" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="10" y="16" font-weight="bold">LEGEND</text>
    <line x1="10" y1="30" x2="40" y2="30" stroke="#000" stroke-width="2.5"/>
    <text x="50" y="33">PRIMARY STRUCTURE</text>
    <line x1="10" y1="45" x2="40" y2="45" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="50" y="48">PRESSURE BOUNDARY</text>
    <rect x="10" y="55" width="30" height="12" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
    <text x="50" y="65">CUTAWAY / SECTION</text>
  </g>
</svg>
