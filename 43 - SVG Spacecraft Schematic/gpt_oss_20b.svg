<?xml version="1.0" encoding="UTF-8"?>
<svg width="2400" height="1600" viewBox="0 0 2400 1600"
     xmlns="http://www.w3.org/2000/svg">

  <!-- ======================== STYLES ===================== -->
  <style><![CDATA[
    :root{
      --bg:#10294A;
      --hatch:#90B4D2;
      --panel:#245669;
      --solar:url(#solarpanel);
      --rad:#064366;
      --tank:#121F34;
      --life:#08191C;
      --cargo:#161B2F;
      --off:#4A6A90;
      --on:#92D4FF;
      --dim:#6C9CCC;
      --call:#6C9CCC;
      --prim:#BDE5FF;
      --sec:#92A7C4;
      --hidden:#5B83A2;
      --frame:#6C9CCC;
    }

    .bg{fill:var(--bg);}
    .grid{stroke:rgba(270, 260, 270, .12);stroke-width:1;}
    .gridmajor{stroke:rgba(270, 260, 270, .22);stroke-width:2;}
    .oml{stroke:var(--prim);stroke-width:4;fill:none;}
    .solid{stroke:var(--sec);stroke-width:2;fill:none;}
    .thin{stroke:var(--off);stroke-width:1.5;fill:none;}
    .hidden{stroke:var(--hidden);stroke-width:1.4;stroke-dasharray:4 6;fill:none;}
    .dot{stroke:var(--on);stroke-width:1.5;fill:none;stroke-dasharray:2 6;}
    .wall{stroke:var(--on);stroke-width:1.5;fill:none;}
    .cut{stroke:var(--on);stroke-width:1.2;stroke-dasharray:5 6;}
    .section{stroke:var(--on);stroke-width:1.8;stroke-dasharray:12 8;}
    .fill{fill:url(#efill);}
    .tank{fill:var(--tank);stroke:var(--prim);stroke-width:1.4;}
    .cargo{fill:var(--cargo);stroke:var(--prim);stroke-width:1.5;}
    .life{fill:var(--life);stroke:var(--prim);stroke-width:1.4;}
    .solar{fill:var(--solar);stroke:var(--on);stroke-width:2;}
    .rad{fill:var(--rad);stroke:var(--on);stroke-width:2;}
    .title{fill:#FFF; font:700 32px/1.2 'Segoe UI',sans-serif;}
    .label{fill:#FFF; font:600 18px/1.2 'Segoe UI',sans-serif;}
    .dim{stroke:var(--dim);stroke-width:1.4;fill:none;
      marker-start:url(#arrow); marker-end:url(#arrow);}
    .dimext{stroke:var(--dim);stroke-width:1.2;fill:none;}
    .callout{stroke:var(--call);stroke-width:2;fill:none;
      marker-end:url(#dot);}
    .callnum{fill:var(--bg); stroke:var(--call);stroke-width:2; font:800 13px/1 'Consolas',monospace;}
    .scalelabel{fill:var(--dim); font:16px/1 'Consolas',monospace;}
  ]]></style>

  <!-- ===================== DEFINITIONS ===================== -->
  <defs>
    <!-- Solar panel cell pattern -->
    <pattern id="solarpanel" width="13" height="13" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="13" height="13" fill="#0A3E5B"/>
      <path d="M0 0 H13 M0 6.5 H13 M0 13 H13" stroke="#1FC6D0" stroke-width="1"/>
      <path d="M6.5 0 V13" stroke="#0E90BA" stroke-width="0.7"/>
    </pattern>
    <!-- Hatching for cut surfaces -->
    <pattern id="efill" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <path d="M0 0 L0 8" stroke="#76A3C5" stroke-width="2"/>
    </pattern>
    <!-- Arrow for dimension lines -->
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 L3,4 Z" fill="#6C9CCC"/>
    </marker>
    <!-- Dot for callout leaders -->
    <marker id="dot" viewBox="0 0 8 8" refX="6" refY="4"
            markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="4" cy="4" r="2" fill="#6C9CCC"/>
    </marker>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect class="bg" x="0" y="0" width="2400" height="1600"/>

  <!-- ===================== TITLE ===================== -->
  <text class="title" x="100" y="70">
    NOTIONAL CREW/CARGO SPACECRAFT – AUG 18 2026
    (All dimensions meters. Concept only)
  </text>

  <!-- ==================== TOP VIEW ===================== -->
  <g id="top" transform="translate(120,220)">
    <text class="label" x="0" y="-30">TOP VIEW</text>

    <!-- Hull outline -->
    <rect class="oml" x="0" y="-60" width="700" height="120" rx="54"/>
    <!-- Nose cone -->
    <ellipse class="oml" cx="0" cy="0" rx="55" ry="60"/>
    <!-- Cockpit glazing -->
    <rect class="solid" x="15" y="-23" width="90" height="46" rx="10"/>
    <!-- Crew module internal (hatch) -->
    <rect class="cut" x="0" y="-35" width="170" height="70" rx="20"/>
    <!-- Propellant tanks -->
    <rect class="tank" x="170" y="-26" width="160" height="52" rx="18"/>
    <rect class="tank" x="330" y="-26" width="120" height="52" rx="16"/>
    <!-- Avionics & Life-support -->
    <rect class="life" x="90" y="-28" width="60" height="56" rx="12"/>
    <rect class="cargo" x="150" y="-30" width="60" height="60" rx="8"/>
    <!-- Airlock hatch -->
    <rect class="solid" x="196" y="-10" width="32" height="22" rx="6"/>
    <!-- Docking port -->
    <circle class="solid" cx="12" cy="-47" r="12"/>
    <text class="label" x="-45" y="-70">DOCKING PORT</text>
    <!-- Solar arrays (plan) -->
    <rect class="solar" x="240" y="-155" width="220" height="70" rx="8"/>
    <rect class="solar" x="240" y="85" width="220" height="70" rx="8"/>
    <!-- Radiators -->
    <rect class="rad" x="520" y="-80" width="90" height="30" rx="6"/>  
    <rect class="rad" x="520" y="42" width="90" height="30" rx="6"/>
    <!-- Engines -->
    <g transform="translate(670,0)">
      <circle class="solid" cx="0" cy="0" r="18"/>
      <circle class="solid" cx="-30" cy="-24" r="14"/>
      <circle class="solid" cx="-30" cy="24" r="14"/>
      <circle class="solid" cx="30" cy="-24" r="14"/>
      <circle class="solid" cx="30" cy="24" r="14"/>
    </g>
    <!-- Antenna booms -->
    <g class="thin">
      <line x1="90" y1="-70" x2="90" y2="-100"/>
      <ellipse cx="90" cy="-108" rx="9" ry="3"/>
      <line x1="110" y1="-60" x2="170" y2="-90"/>
      <circle cx="180" cy="-95" r="4"/>
    </g>
    <!-- Landing gear bays (hidden) -->
    <rect class="hidden" x="530" y="10" width="30" height="20" rx="5"/>
    <rect class="hidden" x="530" y="90" width="30" height="20" rx="5"/>
    <!-- Section A‑A line -->
    <line class="section" x1="240" y1="-170" x2="240" y2="140"/>
    <text class="label" x="225" y="-180" fill="#FFD755">A</text>
    <text class="label" x="225" y="150" fill="#FFD755">A</text>
    <!-- Overall length dimension -->
    <line class="dim" x1="0" y1="160" x2="700" y2="160"/>
    <line class="dimext" x1="0" y1="155" x2="0" y2="165"/>
    <line class="dimext" x1="700" y1="155" x2="700" y2="165"/>
    <text class="dim" x="320" y="150">70 m OAL</text>
    <!-- Body diameter -->
    <line class="dimext" x1="760" y1="-60" x2="760" y2="60"/>
    <line class="dimext" x1="880" y1="-60" x2="880" y2="60"/>
    <line class="dim" x1="820" y1="-60" x2="820" y2="60"/>
    <text class="dim" x="884" y="-10">12 m Ø</text>
    <!-- Solar array span -->
    <line class="dimext" x1="240" y1="-170" x2="240" y2="-190"/>
    <line class="dimext" x1="460" y1="-170" x2="460" y2="-190"/>
    <line class="dim" x1="240" y1="-180" x2="460" y2="-180"/>
    <text class="dim" x="290" y="-190">22 m SPAN</text>
  </g>

  <!-- ==================== SIDE VIEW (PORT) ===================== -->
  <g id="side" transform="translate(120,720)">
    <text class="label" x="0" y="-30">SIDE VIEW (PORT)</text>

    <!-- Ground reference -->
    <line class="thin" x1="-60" y1="90" x2="800" y2="90"/>
    <!-- Hull -->
    <rect class="oml" x="0" y="-60" width="700" height="120" rx="54"/>
    <ellipse class="oml" cx="0" cy="0" rx="55" ry="60"/>
    <!-- Cockpit window -->
    <rect class="solid" x="15" y="-22" width="85" height="35" rx="10"/>
    <!-- Airlock mount -->
    <rect class="solid" x="196" y="-10" width="32" height="22" rx="6"/>
    <!-- Cargo bay ... hidden -->
    <rect class="hidden" x="470" y="20" width="140" height="30" rx="6"/>
    <!-- Engine cluster -->
    <rect class="cut" x="600" y="-60" width="120" height="120" rx="32"/>
    <rect class="cut" x="600" y="-25" width="80" height="50" rx="20"/>
    <!-- Radiators -->
    <rect class="rad" x="520" y="-90" width="90" height="16" rx="4"/>
    <rect class="rad" x="520" y="54" width="90" height="16" rx="4"/>
    <!-- Solar array edge -->
    <rect class="solar" x="260" y="-140" width="220" height="16" rx="6"/>
    <!-- Antennas -->
    <g class="thin">
      <line x1="90" y1="-70" x2="90" y2="-110"/>
      <ellipse cx="90" cy="-118" rx="9" ry="3"/>
      <line x1="115" y1="-60" x2="170" y2="-95"/>
      <circle cx="180" cy="-100" r="4"/>
    </g>
    <!-- Landing gear -->
    <g class="thin">
      <line x1="10" y1="65" x2="-10" y2="140"/>
      <ellipse cx="-10" cy="140" r="10"/>
      <line x1="700" y1="60" x2="720" y2="150"/>
      <ellipse cx="720" cy="150" r="11"/>
    </g>
    <!-- Section A‑A -->
    <line class="section" x1="240" y1="-140" x2="240" y2="110"/>
    <text class="label" x="225" y="-150" fill="#FFD755">A</text>
    <text class="label" x="225" y="120" fill="#FFD755">A</text>
    <!-- Height dimension -->
    <line class="dim" x1="800" y1="-60" x2="830" y2="-60"/>
    <line class="dim" x1="800" y1="110" x2="830" y2="110"/>
    <line class="dim" x1="815" y1="-60" x2="815" y2="110"/>
    <text class="dim" x="840" y="10">23 m HEIGHT</text>
  </g>

  <!-- ==================== FRONT VIEW ===================== -->
  <g id="front" transform="translate(1280,280)">
    <text class="label" x="-70" y="-35">FRONT VIEW</text>

    <!-- Hull -->
    <ellipse class="oml" cx="0" cy="0" rx="60" ry="60"/>
    <!-- Cockpit band -->
    <rect class="solid" x="-25" y="-13" width="50" height="26" rx="6"/>
    <!-- Docking collar -->
    <ellipse class="solid" cx="0" cy="-47" rx="10" ry="6"/>
    <!-- Solar array edge -->
    <rect class="solar" x="-140" y="-20" width="80" height="20" rx="6"/>
    <rect class="solar" x="60" y="-20" width="80" height="20" rx="6"/>
    <!-- Radiators -->
    <rect class="rad" x="-80" y="-45" width="30" height="9" rx="3"/>
    <rect class="rad" x="50" y="-45" width="30" height="9" rx="3"/>
    <!-- Main gear -->
    <ellipse class="solid" cx="-35" cy="95" rx="10" ry="10"/>
    <ellipse class="solid" cx="35" cy="95" rx="10" ry="10"/>
    <ellipse class="solid" cx="0" cy="120" rx="13" ry="13"/>
    <!-- Width dimension -->
    <line class="dim" x1="-140" y1="115" x2="140" y2="115"/>
    <line class="dimext" x1="-150" y1="110" x2="-150" y2="120"/>
    <line class="dimext" x1="140" y1="110" x2="140" y2="120"/>
    <text class="dim" x="-70" y="121">24 m WIDTH</text>
  </g>

  <!-- ==================== REAR VIEW ===================== -->
  <g id="rear" transform="translate(1780,280)">
    <text class="label" x="-70" y="-35">REAR VIEW</text>

    <!-- Hull -->
    <ellipse class="oml" cx="0" cy="0" rx="60" ry="60"/>
    <!-- Engines -->
    <rect class="cut" x="-50" y="-60" width="100" height="120" rx="30"/>
    <rect class="cut" x="0" y="-35" width="80" height="70" rx="22"/>
    <text class="label" x="-45" y="110">ENGINES</text>
    <!-- Radiators -->
    <rect class="rad" x="-80" y="-45" width="30" height="9" rx="3"/>
    <rect class="rad" x="50" y="-45" width="30" height="9" rx="3"/>
  </g>

  <!-- ==================== CUT‑AWAY (SECTION A‑A) ===================== -->
  <g id="cutaway" transform="translate(1280,800)">
    <text class="label" x="0" y="-35">LONGITUDINAL CUT‑AWAY (SECTION A‑A)</text>

    <!-- Damaged cut surface -->
    <path class="cut fill" d="M0 0 L0 120 L700 120 L700 0 Z"/>
    <!-- Hull profile border -->
    <rect class="oml" x="0" y="0" width="700" height="120" rx="54" fill="none"/>
    <!-- Frame lines -->
    <g class="thin">
      <line x1="120" y1="0" x2="120" y2="120"/>
      <line x1="240" y1="0" x2="240" y2="120"/>
      <line x1="360" y1="0" x2="360" y2="120"/>
      <line x1="480" y1="0" x2="480" y2="120"/>
      <line x1="600" y1="0" x2="600" y2="120"/>
    </g>
    <!-- Crew module -->
    <rect class="life" x="0" y="-35" width="170" height="70" rx="20"/>
    <text class="label" x="5" y="-40">CREW MODULE</text>
    <!-- Cockpit -->
    <rect class="life" x="0" y="-30" width="85" height="44" rx="12"/>
    <text class="label" x="5" y="-38">COCKPIT</text>
    <!-- Avionics -->
    <rect class="cargo" x="90" y="0" width="70" height="45" rx="10"/>
    <text class="label" x="95" y="20">AVIONICS</text>
    <!-- Life‑support racks -->
    <rect class="life" x="170" y="0" width="70" height="45" rx="10"/>
    <text class="label" x="175" y="20">LIFE‑SUPPORT</text>
    <!-- LOX & Fuel tanks -->
    <rect class="tank" x="250" y="-28" width="160" height="54" rx="18"/>
    <text class="label" x="255" y="-34">LOX/FUEL TANKS</text>
    <!-- Airlock chamber -->
    <rect class="solid" x="192" y="-10" width="32" height="22" rx="6"/>
    <text class="label" x="197" y="18">AIRLOCK</text>
    <!-- Cargo bay -->
    <rect class="cargo" x="440" y="-30" width="110" height="60" rx="8"/>
    <text class="label" x="445" y="-38">CARGO BAY</text>
    <!-- Engine section -->
    <rect class="solid" x="630" y="-50" width="70" height="70" rx="18"/>
    <ellipse class="solid" cx="680" cy="0" rx="12" ry="16"/>
    <!-- RCS -->
    <circle class="solid" cx="120" cy="55" r="4"/>
    <circle class="solid" cx="640" cy="55" r="4"/>
    <!-- Radiator manifold -->
    <rect class="rad" x="530" y="0" width="90" height="30" rx="6"/>
    <!-- Section dimensions -->
    <line class="dim" x1="0" y1="130" x2="170" y2="130"/>
    <line class="dimext" x1="0" y1="125" x2="0" y2="135"/>
    <line class="dimext" x1="170" y1="125" x2="170" y2="135"/>
    <text class="dim" x="70" y="120">16 m CREW</text>

    <line class="dim" x1="170" y1="140" x2="250" y2="140"/>
    <line class="dimext" x1="170" y1="135" x2="170" y2="145"/>
    <line class="dimext" x1="250" y1="135" x2="250" y2="145"/>
    <text class="dim" x="210" y="130">16 m TANKS</text>

    <line class="dim" x1="440" y1="120" x2="550" y2="120"/>
    <line class="dimext" x1="440" y1="115" x2="440" y2="125"/>
    <line class="dimext" x1="550" y1="115" x2="550" y2="125"/>
    <text class="dim" x="485" y="110">12 m CARGO</text>

    <!-- Call‑out balloons -->
    <g>
      <circle class="callnum" cx="-60" cy="-40" r="14"/><text class="callnum" x="-66" y="-37">1</text>
      <line class="callout" x1="-45" y1="-40" x2="12" y2="-10"/>
      <circle class="callnum" cx="212" cy="65" r="14"/><text class="callnum" x="206" y="68">2</text>
      <line class="callout" x1="227" y1="65" x2="300" y2="25"/>
      <circle class="callnum" cx="86" cy="70" r="14"/><text class="callnum" x="80" y="73">3</text>
      <line class="callout" x1="101" y1="70" x2="175" y2="35"/>
      <circle class="callnum" cx="440" cy="-50" r="14"/><text class="callnum" x="434" y="-47">4</text>
      <line class="callout" x1="455" y1="-50" x2="540" y2="-90"/>
      <circle class="callnum" cx="710" cy="40" r="14"/><text class="callnum" x="704" y="43">5</text>
      <line class="callout" x1="725" y1="40" x2="610" y2="20"/>
    </g>
  </g>

  <!-- ==================== SCALE BAR ===================== -->
  <g transform="translate(180,1350)">
    <rect x="0" y="0" width="700" height="30" class="solid" rx="6"/>
    <line x1="0" y1="4" x2="0" y2="26"/>
    <line x1="100" y1="8" x2="100" y2="26"/>
    <line x1="200" y1="8" x2="200" y2="26"/>
    <line x1="300" y1="8" x2="300" y2="26"/>
    <line x1="400" y1="8" x2="400" y2="26"/>
    <line x1="500" y1="8" x2="500" y2="26"/>
    <line x1="600" y1="8" x2="600" y2="26"/>
    <line x1="700" y1="4" x2="700" y2="26"/>
    <text class="scalelabel" x="12" y="28">0</text>
    <text class="scalelabel" x="92" y="28">10</text>
    <text class="scalelabel" x="192" y="28">20</text>
    <text class="scalelabel" x="292" y="28">30</text>
    <text class="scalelabel" x="392" y="28">40</text>
    <text class="scalelabel" x="492" y="28">50</text>
    <text class="scalelabel" x="592" y="28">60</text>
    <text class="scalelabel" x="692" y="28">70 m</text>
    <text class="legend" y="-10">GRAPHIC SCALE – 70 m (10 m ticks)</text>
  </g>

  <!-- ==================== LEGEND ===================== -->
  <g transform="translate(1700,340)">
    <rect width="590" height="460" rx="12" class="solid"/>
    <text x="20" y="40" class="label" fill="#FFF">CALL‑OUT LEGEND</text>
    <g class="label" transform="translate(35,70)">
      <text y="20">1  COCKPIT / FROND</text>
      <text y="50">2  PROPELLANT TANKS (LOX + FUEL)</text>
      <text y="80">3  LIFE‑SUPPORT RACKS (ECLSS)</text>
      <text y="110">4  CARGO BAY / PALLETS</text>
      <text y="140">5  MAIN ENGINE CLUSTER (5 thrusts)</text>
      <text y="170">DOCKING PORT (frontal)</text>
      <text y="200">AIRLOCK (side)</text>
      <text y="230">SOLAR ARRAYS &amp; RADIATORS</text>
      <text y="260">ANTENNAAS (HGA, omni)</text>
      <text y="290">LANDING GEAR (3‑point)</text>
      <text y="320">RCS THRUSTER CLUSTERS (fwd/aft)</text>
      <text y="350">FWD AVIONICS / BACK‑FUEL</text>
      <text y="380">MAJOR STRUCTURAL RINGS</text>
      <text y="410">CUT FILL = SECTION A‑A (see cut‑away)</text>
    </g>
  </g>
</svg>