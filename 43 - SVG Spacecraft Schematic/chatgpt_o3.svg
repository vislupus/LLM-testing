<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="1600"
   height="1200"
   viewBox="0 0 1600 1200"
   font-family="Arial, Helvetica, sans-serif"
   font-size="12"
   stroke-linecap="round"
   stroke-linejoin="round">

  <!-- ====== Definitions ====== -->
  <defs>
    <!-- Arrow marker for dimension lines -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polyline points="0,0 10,3.5 0,7" fill="none" stroke="black" stroke-width="1"/>
    </marker>
    <!-- Grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d0d0d0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background grid -->
  <rect x="0" y="0" width="100%" height="100%" fill="url(#grid)" />

  <!-- ====== Title Block ====== -->
  <g id="title-block">
    <rect x="20" y="20" width="360" height="220" stroke="black" stroke-width="2" fill="white"/>
    <text x="40" y="55" font-size="28" font-weight="bold">NX‑37 HORIZON</text>
    <text x="40" y="80" font-size="16">MULTI‑ROLE EXPLORATION SPACECRAFT</text>
    <text x="40" y="110" font-size="12">DRAWING NO.: NX37‑ENG‑SVG‑001</text>
    <text x="40" y="130" font-size="12">DATE: 2026‑08‑18</text>
    <text x="40" y="150" font-size="12">SCALE: 1 : 100</text>
    <text x="40" y="170" font-size="12">UNITS: METERS / KILOGRAMS</text>
    <text x="40" y="200" font-size="12">AERODYNE SYSTEMS</text>
  </g>

  <!-- ====== Legend ====== -->
  <g id="legend">
    <rect x="20" y="260" width="360" height="360" stroke="black" stroke-width="2" fill="white"/>
    <text x="40" y="290" font-size="16" font-weight="bold">LEGEND</text>
    <!-- Legend items -->
    <text x="50" y="320">1 — Command / Crew Module</text>
    <text x="50" y="340">2 — Cockpit</text>
    <text x="50" y="360">3 — Life‑Support Systems</text>
    <text x="50" y="380">4 — Avionics Bay</text>
    <text x="50" y="400">5 — Forward Docking Port</text>
    <text x="50" y="420">6 — Airlock (Port)</text>
    <text x="50" y="440">7 — Cargo Bay</text>
    <text x="50" y="460">8 — LH₂ Fuel Tank</text>
    <text x="50" y="480">9 — LOX Oxidizer Tank</text>
    <text x="50" y="500">10 — Main Engines</text>
    <text x="50" y="520">11 — RCS Thruster Clusters</text>
    <text x="50" y="540">12 — Landing Gear</text>
    <text x="50" y="560">13 — Radiators</text>
    <text x="50" y="580">14 — Solar Arrays</text>
    <text x="50" y="600">15 — Communications Antennas</text>
  </g>

  <!-- ====== Views ====== -->
  <!-- Top View -->
  <g id="top-view" transform="translate(450,40)">
    <text x="0" y="-10" font-size="16" font-weight="bold">TOP VIEW</text>

    <!-- Hull outline -->
    <rect x="0" y="0" width="800" height="240" fill="none" stroke="black" stroke-width="2"/>
    <!-- Nose -->
    <polygon points="0,0 -60,120 0,240" fill="none" stroke="black" stroke-width="2"/>
    <!-- Tail engines -->
    <polygon points="800,0 860,40 860,200 800,240" fill="none" stroke="black" stroke-width="2"/>
    <!-- Solar arrays -->
    <rect x="250" y="-160" width="200" height="160" fill="none" stroke="black"/>
    <rect x="250" y="240" width="200" height="160" fill="none" stroke="black"/>
    <!-- Landing gear -->
    <polygon points="100,260 120,260 110,300" fill="none" stroke="black"/>
    <polygon points="700,260 720,260 710,300" fill="none" stroke="black"/>
    <!-- RCS thrusters (simplified) -->
    <circle cx="100" cy="50" r="10" fill="none" stroke="black"/>
    <circle cx="100" cy="190" r="10" fill="none" stroke="black"/>
    <circle cx="700" cy="50" r="10" fill="none" stroke="black"/>
    <circle cx="700" cy="190" r="10" fill="none" stroke="black"/>

    <!-- Dimension lines -->
    <line x1="0" y1="300" x2="800" y2="300" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="380" y="320" text-anchor="middle">26.80 m</text>
    <line x1="-120" y1="0" x2="-120" y2="240" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-140" y="125" transform="rotate(-90 -140,125)" text-anchor="middle">3.46 m</text>

    <!-- Labels (callouts) -->
    <line x1="380" y1="0" x2="380" y2="-50" stroke="black" stroke-width="0.8"/>
    <text x="380" y="-55" text-anchor="middle">1</text>
    <line x1="800" y1="120" x2="850" y2="120" stroke="black" stroke-width="0.8"/>
    <text x="855" y="124">10</text>
    <line x1="250" y1="-160" x2="220" y2="-200" stroke="black" stroke-width="0.8"/>
    <text x="190" y="-200">14</text>
  </g>

  <!-- Side View -->
  <g id="side-view" transform="translate(450,460)">
    <text x="0" y="-10" font-size="16" font-weight="bold">SIDE VIEW</text>

    <!-- Hull -->
    <rect x="0" y="0" width="800" height="200" fill="none" stroke="black" stroke-width="2"/>
    <!-- Nose incline -->
    <polygon points="0,0 -60,100 0,200" fill="none" stroke="black" stroke-width="2"/>
    <!-- Tail engines -->
    <rect x="800" y="40" width="60" height="120" fill="none" stroke="black" stroke-width="2"/>
    <!-- Landing gear -->
    <polygon points="150,200 180,200 165,250" fill="none" stroke="black"/>
    <polygon points="650,200 680,200 665,250" fill="none" stroke="black"/>
    <!-- Solar arrays stowed on top -->
    <rect x="280" y="-120" width="160" height="120" fill="none" stroke="black"/>
    <!-- Cutaway tanks (simplified ellipse outlines) -->
    <ellipse cx="300" cy="100" rx="60" ry="40" fill="none" stroke="black"/>
    <ellipse cx="420" cy="100" rx="60" ry="40" fill="none" stroke="black"/>

    <!-- Dimension lines -->
    <line x1="0" y1="250" x2="800" y2="250" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="380" y="270" text-anchor="middle">26.80 m</text>
    <line x1="-120" y1="0" x2="-120" y2="200" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-140" y="100" transform="rotate(-90 -140,100)" text-anchor="middle">2.60 m</text>

    <!-- Labels -->
    <line x1="420" y1="100" x2="470" y2="60" stroke="black" stroke-width="0.8"/>
    <text x="475" y="55">9</text>
    <line x1="300" y1="100" x2="260" y2="60" stroke="black" stroke-width="0.8"/>
    <text x="230" y="55">8</text>
  </g>

  <!-- Front View -->
  <g id="front-view" transform="translate(100,700)">
    <text x="0" y="-10" font-size="16" font-weight="bold">FRONT VIEW</text>

    <!-- Circular front -->
    <circle cx="120" cy="100" r="100" fill="none" stroke="black" stroke-width="2"/>
    <!-- Solar arrays -->
    <rect x="-80" y="20" width="60" height="160" fill="none" stroke="black"/>
    <rect x="260" y="20" width="60" height="160" fill="none" stroke="black"/>
    <!-- Landing gear -->
    <polygon points="20,200 40,200 30,240" fill="none" stroke="black"/>
    <polygon points="180,200 200,200 190,240" fill="none" stroke="black"/>

    <!-- Dimension -->
    <line x1="-120" y1="100" x2="-120" y2="200" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="-140" y="150" transform="rotate(-90 -140,150)" text-anchor="middle">3.46 m</text>

    <!-- Label -->
    <line x1="120" y1="0" x2="120" y2="-50" stroke="black" stroke-width="0.8"/>
    <text x="120" y="-55" text-anchor="middle">5</text>
  </g>

  <!-- Rear View -->
  <g id="rear-view" transform="translate(400,700)">
    <text x="0" y="-10" font-size="16" font-weight="bold">REAR VIEW</text>

    <!-- Main engines (2) -->
    <circle cx="120" cy="120" r="50" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="280" cy="120" r="50" fill="none" stroke="black" stroke-width="2"/>
    <!-- Tail body -->
    <rect x="0" y="40" width="400" height="160" fill="none" stroke="black" stroke-width="2"/>
    <!-- Radiators -->
    <rect x="160" y="-60" width="80" height="60" fill="none" stroke="black"/>

    <!-- Labels -->
    <line x1="280" y1="120" x2="340" y2="120" stroke="black" stroke-width="0.8"/>
    <text x="345" y="124">10</text>
    <line x1="200" y1="-60" x2="200" y2="-100" stroke="black" stroke-width="0.8"/>
    <text x="200" y="-105" text-anchor="middle">13</text>
  </g>

  <!-- Section A‑A (Cutaway) -->
  <g id="section" transform="translate(880,700)">
    <text x="0" y="-10" font-size="16" font-weight="bold">SECTION A‑A</text>

    <!-- Hull outline -->
    <rect x="0" y="0" width="240" height="240" fill="none" stroke="black" stroke-width="2"/>
    <!-- Tanks -->
    <ellipse cx="80" cy="120" rx="60" ry="40" fill="none" stroke="black"/>
    <ellipse cx="160" cy="120" rx="60" ry="40" fill="none" stroke="black"/>
    <!-- Cargo bay -->
    <rect x="0" y="40" width="240" height="60" fill="none" stroke="black"/>
    <!-- Labels -->
    <line x1="80" y1="120" x2="50" y2="160" stroke="black" stroke-width="0.8"/>
    <text x="25" y="170">8</text>
    <line x1="160" y1="120" x2="190" y2="160" stroke="black" stroke-width="0.8"/>
    <text x="195" y="170">9</text>
  </g>

  <!-- Scale Bar -->
  <g id="scale-bar" transform="translate(450,1080)">
    <rect x="0" y="0" width="500" height="30" fill="white" stroke="black"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="black"/>
    <line x1="100" y1="0" x2="100" y2="30" stroke="black"/>
    <line x1="200" y1="0" x2="200" y2="30" stroke="black"/>
    <line x1="300" y1="0" x2="300" y2="30" stroke="black"/>
    <line x1="400" y1="0" x2="400" y2="30" stroke="black"/>
    <line x1="500" y1="0" x2="500" y2="30" stroke="black"/>
    <text x="0" y="25" text-anchor="middle">0</text>
    <text x="100" y="25" text-anchor="middle">1 m</text>
    <text x="200" y="25" text-anchor="middle">2 m</text>
    <text x="300" y="25" text-anchor="middle">3 m</text>
    <text x="400" y="25" text-anchor="middle">4 m</text>
    <text x="500" y="25" text-anchor="middle">5 m</text>
  </g>
</svg>
