<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f1c2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2f45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1c2e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Patterns -->
    <pattern id="gridSmall" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#152640" stroke-width="0.5"/>
    </pattern>
    <pattern id="gridBig" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#gridSmall)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1c3555" stroke-width="0.8"/>
    </pattern>
    
    <!-- Hatching for Cutaway -->
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#ff6b6b" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    
    <!-- Markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0d8f0" />
    </marker>
  </defs>

  <!-- Styles -->
  <style>
    .bg { fill: #0b1929; }
    .title-text { font-family: 'Courier New', monospace; fill: #ffffff; font-weight: bold; }
    .label-main { font-family: 'Arial', sans-serif; fill: #c0d8f0; font-size: 12px; letter-spacing: 0.5px; }
    .label-dim { font-family: 'Courier New', monospace; fill: #ffd166; font-size: 10px; }
    .section-text { fill: #ff6b6b; font-size: 14px; font-weight: bold; font-family: sans-serif;}
    .dim-line { stroke: #c0d8f0; stroke-width: 0.8; fill: none; }
    .center-line { stroke: #ff6b6b; stroke-width: 0.5; stroke-dasharray: 10,5,2,5; }
    .hidden-line { stroke: #3a8cc2; stroke-width: 0.6; stroke-dasharray: 4,3; }
    .structural { stroke: #4cc9f0; stroke-width: 1.2; fill: none; }
    .cut-path { fill: url(#metal-dark); stroke: #4cc9f0; stroke-width: 1.5; }
    .cut-hatch { fill: url(#hatch); stroke: none; }
    .sys-label { font-family: monospace; font-size: 9px; fill: #8899aa; }
  </style>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />
  <rect x="0" y="0" width="1600" height="1000" fill="url(#gridBig)" opacity="0.6"/>

  <!-- ==================== TITLE BLOCK ==================== -->
  <g transform="translate(0, 0)">
    <rect x="1100" y="20" width="480" height="80" fill="#0d1f35" stroke="#2a6a9f" stroke-width="2"/>
    <text x="1120" y="50" class="title-text" font-size="18">AURORA-7 MULTI-PURPOSE CREW EXPLORATION VEHICLE</text>
    <text x="1120" y="75" class="label-main" fill="#c0d8f0">DWG NO: AE-700-X | REV: C | SCALE: 1:100 | UNITS: METERS</text>
    
    <!-- Title Separator -->
    <line x1="20" y1="100" x2="1580" y2="100" stroke="#2a6a9f" stroke-width="1" stroke-dasharray="10,10"/>
  </g>

  <!-- ==================== TOP VIEW (PLAN) ==================== -->
  <g transform="translate(100, 150)">
    <text x="150" y="-20" class="title-text" font-size="16">TOP VIEW (PLAN)</text>
    
    <!-- Solar Arrays (Folded out) -->
    <rect x="-50" y="-120" width="100" height="300" rx="5" fill="#0f1c2e" stroke="#4cc9f0" stroke-width="1" />
    <!-- Grid on array -->
    <line x1="-40" y1="-115" x2="40" y2="-115" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="-80" x2="40" y2="-80" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="-45" x2="40" y2="-45" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="25" x2="40" y2="25" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="60" x2="40" y2="60" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="95" x2="40" y2="95" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="130" x2="40" y2="130" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="165" x2="40" y2="165" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="200" x2="40" y2="200" stroke="#1c3555" stroke-width="1"/>
    <line x1="-40" y1="235" x2="40" y2="235" stroke="#1c3555" stroke-width="1"/>
    
    <!-- Fuselage Outline -->
    <path d="M -15,0 L 480,0 A 10,10 0 0,1 500,0 L 500,-250 Q 350,-250 350,-150 Q 150,-150 0,0 Q 150,150 350,150 Q 350,250 500,250 L 480,250 Z" fill="none" stroke="#fff" stroke-width="1.5"/>
    
    <!-- Internal Sections Lines -->
    <line x1="100" y1="-140" x2="100" y2="140" stroke="#3a8cc2" stroke-width="0.5" stroke-dasharray="2,2"/> <!-- Docking -->
    <line x1="300" y1="-140" x2="300" y2="140" stroke="#3a8cc2" stroke-width="0.5" stroke-dasharray="2,2"/> <!-- Module Split -->
    <line x1="450" y1="-140" x2="450" y2="140" stroke="#3a8cc2" stroke-width="0.5" stroke-dasharray="2,2"/> <!-- Engine Skirt -->
    
    <!-- Radiators (Small rectangles near tail) -->
    <rect x="360" y="-300" width="80" height="15" fill="#1a2d48" stroke="#3a8cc2"/>
    <rect x="360" y="285" width="80" height="15" fill="#1a2d48" stroke="#3a8cc2"/>

    <!-- Antenna HGA (Dish) -->
    <circle cx="380" cy="0" r="25" fill="none" stroke="#ffd166" stroke-width="1.5"/>
    <circle cx="380" cy="0" r="5" fill="#ffd166"/>
    
    <!-- Callout Line to Top View -->
    <line x1="200" y1="150" x2="200" y2="450" stroke="#ffd166" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="185" y="450" width="30" height="10" fill="#ffd166"/>
    <text x="200" y="465" text-anchor="middle" fill="#0b1929" font-size="10">SECTION A-A</text>
  </g>

  <!-- ==================== SIDE VIEW (PROFILE) ==================== -->
  <g transform="translate(100, 450)">
    <text x="150" y="-20" class="title-text" font-size="16">SIDE VIEW (ELEVATION)</text>
    <path d="M 0,0 L 450,0 A 10,10 0 0,1 470,0 L 470,-30 L 470,30 L 450,30 Z" fill="none" stroke="#fff" stroke-width="2"/> <!-- Tail fins -->
    
    <!-- Body Profile -->
    <path d="M 0,0 C 50,-40 100,-40 150,-40 L 400,-40 L 400,40 L 150,40 C 100,40 50,40 0,0 Z" fill="url(#metal-dark)" stroke="#4cc9f0" stroke-width="1.5"/>
    
    <!-- Cockpit Windows (Top) -->
    <path d="M 60,-35 L 90,-35 L 85,-20 L 65,-20 Z" fill="#7fdbff" opacity="0.7" stroke="#fff" stroke-width="1"/>
    
    <!-- Docking Port (Protrusion) -->
    <rect x="20" y="-42" width="30" height="5" fill="#1a2d48" stroke="#fff" stroke-width="1"/>
    <circle cx="20" cy="-42" r="10" fill="none" stroke="#ffd166"/>
    
    <!-- Airlock Hatch (Circular detail) -->
    <circle cx="120" cy="0" r="8" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="120" cy="0" r="3" fill="#ff6b6b"/>
    
    <!-- Thermal Tiles texture (dots) -->
    <g fill="#1c3555">
       <circle cx="320" cy="-10" r="1"/><circle cx="340" cy="-10" r="1"/>
       <circle cx="320" cy="0" r="1"/><circle cx="340" cy="0" r="1"/>
    </g>

    <!-- Landing Gear (Deployed - dashed lines below) -->
    <line x1="350" y1="40" x2="350" y2="90" stroke="#3a8cc2" stroke-width="2" stroke-dasharray="4,2"/>
    <ellipse cx="350" cy="95" rx="5" ry="12" fill="#1a2d48" stroke="#fff"/>
    
    <!-- Dimension Lines -->
    <line x1="-50" y1="120" x2="500" y2="120" stroke="#ffd166" class="dim-line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="225" y="115" text-anchor="middle" class="label-dim">LENGTH: 45.0 m</text>
    
    <line x1="550" y1="-40" x2="550" y2="40" stroke="#ffd166" class="dim-line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="560" y="0" text-anchor="start" class="label-dim">DIAMETER: 5.0 m</text>
  </g>

  <!-- ==================== FRONT VIEW ==================== -->
  <g transform="translate(650, 150)">
    <text x="100" y="-20" class="title-text" font-size="16">FRONT VIEW</text>
    
    <!-- Hull Circle -->
    <circle cx="100" cy="100" r="50" fill="#0f1c2e" stroke="#4cc9f0" stroke-width="2"/>
    
    <!-- Cockpit Window Arc (Top) -->
    <path d="M 55,60 A 50,50 0 0,1 145,60" fill="none" stroke="#7fdbff" stroke-width="3"/>
    <text x="75" y="75" font-size="10" fill="#7fdbff">VIEWPORTS</text>
    
    <!-- Docking Mechanism (Top Center) -->
    <circle cx="100" cy="35" r="10" fill="none" stroke="#ffd166" stroke-width="2"/>
    <line x1="100" y1="25" x2="100" y2="35" stroke="#ffd166" stroke-width="1"/>
    
    <!-- Antenna Mast (Left) -->
    <circle cx="20" cy="100" r="5" fill="#c0d8f0"/>
    <text x="5" y="90" class="label-main">S-BAND</text>
    
    <!-- Solar Array Mount (Right) -->
    <circle cx="180" cy="100" r="5" fill="#c0d8f0"/>
    
    <!-- RCS Thruster Ports -->
    <circle cx="140" cy="60" r="2" fill="#ff6b6b"/>
    <circle cx="60" cy="140" r="2" fill="#ff6b6b"/>
  </g>

  <!-- ==================== REAR VIEW ==================== -->
  <g transform="translate(1050, 150)">
    <text x="100" y="-20" class="title-text" font-size="16">REAR VIEW</text>
    
    <!-- Engine Cluster Circle -->
    <circle cx="100" cy="100" r="50" fill="#0f1c2e" stroke="#4cc9f0" stroke-width="2"/>
    
    <!-- Nozzles (2x2 Pattern) -->
    <circle cx="70" cy="70" r="15" fill="#1a2d48" stroke="#ff6b6b" stroke-width="1.5"/>
    <circle cx="130" cy="70" r="15" fill="#1a2d48" stroke="#ff6b6b" stroke-width="1.5"/>
    <circle cx="70" cy="130" r="15" fill="#1a2d48" stroke="#ff6b6b" stroke-width="1.5"/>
    <circle cx="130" cy="130" r="15" fill="#1a2d48" stroke="#ff6b6b" stroke-width="1.5"/>
    
    <!-- Gimbal Ring -->
    <circle cx="100" cy="100" r="30" fill="none" stroke="#3a8cc2" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Label -->
    <text x="115" y="50" class="label-main" fill="#ff6b6b">MAIN ENGINES (×4)</text>
    <text x="115" y="65" class="sys-label">THRUST: 450 kN EACH</text>
  </g>

  <!-- ==================== CUTAWAY SECTION A-A ==================== -->
  <g transform="translate(80, 520)">
     <!-- Large Container for Cutaway -->
     <g transform="translate(0, -50)">
        <text x="150" y="-20" class="title-text" font-size="16">INTERNAL SCHEMATIC (SECTION A-A)</text>
        
        <!-- Floor Line -->
        <line x1="0" y1="430" x2="500" y2="430" stroke="#c0d8f0" stroke-width="1"/>
        
        <!-- CREW MODULE (Front) -->
        <path d="M 50,30 L 50,180 L 250,180 L 250,30 C 250,-10 150,-10 50,30 Z" fill="#1a2d48" stroke="#4cc9f0" stroke-width="2"/>
        
        <!-- Seats -->
        <rect x="100" y="140" width="20" height="30" fill="#3a8cc2" opacity="0.6"/>
        <rect x="150" y="140" width="20" height="30" fill="#3a8cc2" opacity="0.6"/>
        <text x="110" y="180" class="sys-label">CREW STATIONS (4)</text>
        
        <!-- Control Panel -->
        <line x1="50" y1="180" x2="50" y2="80" stroke="#ffd166" stroke-width="2"/>
        <text x="40" y="120" class="sys-label" transform="rotate(-90, 40, 120)">MASTER CONSOLE</text>
        
        <!-- Cargo Bay / Tunnel -->
        <path d="M 250,170 L 250,50 L 350,50 L 350,170 Z" fill="#1a2d48" stroke="#c0d8f0" stroke-width="1"/>
        <text x="270" y="115" class="label-main" fill="#fff">ACCESS TUNNEL</text>
        
        <!-- SERVICE MODULE (Rear) -->
        <!-- Structural Frame -->
        <line x1="350" y1="50" x2="350" y2="170" stroke="#fff" stroke-width="3"/>
        
        <!-- LOX Tank (Orange-ish hatch) -->
        <path d="M 350,170 L 350,50 L 420,50 L 420,170" fill="#1a2d48" stroke="#3a8cc2" stroke-width="1.5"/>
        <line x1="385" y1="50" x2="385" y2="170" stroke="#ffd166" stroke-width="1"/>
        <text x="375" y="100" class="label-main">LOX TANK</text>
        
        <!-- LH2 Tank (Blue-ish hatch) -->
        <path d="M 420,170 L 420,50 L 480,50 L 480,170" fill="#1a2d48" stroke="#3a8cc2" stroke-width="1.5"/>
        <text x="440" y="100" class="label-main">LH2 TANK</text>
        
        <!-- Equipment Bays (Bottom of SM) -->
        <rect x="360" y="180" width="100" height="40" fill="#152640" stroke="#8899aa" stroke-dasharray="2,2"/>
        <text x="380" y="205" class="sys-label">AVIONICS RACK</text>
        <rect x="360" y="220" width="100" height="30" fill="#152640" stroke="#8899aa" stroke-dasharray="2,2"/>
        <text x="365" y="240" class="sys-label">POWER SYSTEMS</text>
        
        <!-- Engines -->
        <path d="M 480,160 L 495,140 L 495,180 Z" fill="#333" stroke="#ff6b6b" stroke-width="2"/>
        <path d="M 480,60 L 495,40 L 495,80 Z" fill="#333" stroke="#ff6b6b" stroke-width="2"/>
        <text x="500" y="65" class="sys-label">MAIN ENG.</text>
        <text x="500" y="175" class="sys-label">MAIN ENG.</text>
        
        <!-- Section Labels -->
        <line x1="50" y1="250" x2="50" y2="400" stroke="#ffd166" marker-start="url(#arrow)"/>
        <text x="50" y="410" text-anchor="middle" class="label-dim">PRESSURIZED</text>
        
        <line x1="450" y1="250" x2="450" y2="400" stroke="#ffd166" marker-start="url(#arrow)"/>
        <text x="450" y="410" text-anchor="middle" class="label-dim">PROP. DEPT.</text>

     </g>
  </g>

  <!-- ==================== SPECIFICATIONS TABLE ==================== -->
  <g transform="translate(650, 700)">
    <rect x="0" y="0" width="950" height="280" fill="#0d1f35" stroke="#2a6a9f" stroke-width="2" rx="10"/>
    <rect x="0" y="0" width="950" height="40" fill="#1a3555" rx="10"/>
    <text x="475" y="27" text-anchor="middle" class="title-text" font-size="16">KEY PERFORMANCE PARAMETERS</text>
    
    <!-- Table Header -->
    <line x1="0" y1="40" x2="950" y2="40" stroke="#2a6a9f" stroke-width="1"/>
    <text x="20" y="65" class="label-main" font-weight="bold">PARAMETER</text>
    <text x="300" y="65" class="label-main" font-weight="bold">VALUE</text>
    <text x="550" y="65" class="label-main" font-weight="bold">UNIT</text>
    
    <!-- Rows -->
    <g class="label-main" font-size="11">
      <!-- Row 1 -->
      <line x1="0" y1="80" x2="950" y2="80" stroke="#1c3555"/>
      <text x="20" y="95">Overall Length</text>
      <text x="300" y="95">45.0</text>
      <text x="550" y="95">meters</text>
      
      <!-- Row 2 -->
      <line x1="0" y1="95" x2="950" y2="95" stroke="#1c3555"/>
      <text x="20" y="110">Max Diameter</text>
      <text x="300" y="110">5.0</text>
      <text x="550" y="110">meters</text>
      
      <!-- Row 3 -->
      <line x1="0" y1="110" x2="950" y2="110" stroke="#1c3555"/>
      <text x="20" y="125">Dry Mass</text>
      <text x="300" y="125">12,500</text>
      <text x="550" y="125">kg</text>
      
      <!-- Row 4 -->
      <line x1="0" y1="125" x2="950" y2="125" stroke="#1c3555"/>
      <text x="20" y="140">Propellant Load (LOX/LH2)</text>
      <text x="300" y="140">28,000</text>
      <text x="550" y="140">kg</text>
      
      <!-- Row 5 -->
      <line x1="0" y1="140" x2="950" y2="140" stroke="#1c3555"/>
      <text x="20" y="155">Total Thrust (Vacuum)</text>
      <text x="300" y="155">1,800</text>
      <text x="550" y="155">kN</text>
      
      <!-- Row 6 -->
      <line x1="0" y1="155" x2="950" y2="155" stroke="#1c3555"/>
      <text x="20" y="170">ΔV Capability</text>
      <text x="300" y="170">3,850</text>
      <text x="550" y="170">m/s</text>
      
      <!-- Row 7 -->
      <line x1="0" y1="170" x2="950" y2="170" stroke="#1c3555"/>
      <text x="20" y="185">Crew Capacity</text>
      <text x="300" y="185">4 - 6</text>
      <text x="550" y="185">astronauts</text>
      
      <!-- Row 8 -->
      <line x1="0" y1="185" x2="950" y2="185" stroke="#1c3555"/>
      <text x="20" y="200">Solar Array Span</text>
      <text x="300" y="200">24.0</text>
      <text x="550" y="200">meters</text>
      
      <!-- Row 9 -->
      <line x1="0" y1="200" x2="950" y2="200" stroke="#1c3555"/>
      <text x="20" y="215">Power Generation (Peak)</text>
      <text x="300" y="215">22</text>
      <text x="550" y="215">kW</text>
      
      <!-- Row 10 -->
      <line x1="0" y1="215" x2="950" y2="215" stroke="#1c3555"/>
      <text x="20" y="230">Mission Endurance</text>
      <text x="300" y="230">180</text>
      <text x="550" y="230">days</text>
      
      <!-- Row 11 -->
      <line x1="0" y1="230" x2="950" y2="230" stroke="#1c3555"/>
      <text x="20" y="245">Pressurized Volume</text>
      <text x="300" y="245">115</text>
      <text x="550" y="245">m³</text>
      
      <!-- Row 12 -->
      <line x1="0" y1="245" x2="950" y2="245" stroke="#1c3555"/>
      <text x="20" y="260">Docking Standard</text>
      <text x="300" y="260">IDSS / APAS-95</text>
      <text x="550" y="260">-</text>
    </g>
  </g>

  <!-- Scale Bar -->
  <g transform="translate(100, 850)">
    <text x="0" y="-10" class="label-dim">SCALE REFERENCE:</text>
    <rect x="0" y="0" width="200" height="10" fill="#c0d8f0" rx="2"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="#fff"/>
    <line x1="100" y1="10" x2="100" y2="20" stroke="#fff"/>
    <line x1="200" y1="10" x2="200" y2="20" stroke="#fff"/>
    <text x="0" y="30" text-anchor="middle" class="label-dim">0m</text>
    <text x="100" y="30" text-anchor="middle" class="label-dim">10m</text>
    <text x="200" y="30" text-anchor="middle" class="label-dim">20m</text>
  </g>

</svg>