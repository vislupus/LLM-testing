<svg width="1600" height="2200" viewBox="0 0 1600 2200" xmlns="http://www.w3.org/2000/svg">
  <!-- DEFINITIONS -->
  <defs</think>

>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00d4ff" />
    </marker>
    <marker id="dimArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,14 L14,7 z" fill="#ffffff" />
    </marker>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e3a5f" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="#0b1a2e" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.6" />

  <!-- TITLE BLOCK -->
  <g transform="translate(50, 2050)">
    <rect x="0" y="0" width="1500" height="100" fill="#0f253a" stroke="#00d4ff" stroke-width="2"/>
    <text x="20" y="35" font-family="monospace" font-size="24" fill="#ffffff" font-weight="bold">OTV-7 ORBITAL TRANSFER VEHICLE</text>
    <text x="20" y="65" font-family="monospace" font-size="14" fill="#88aadd">GENERAL ARRANGEMENT - MULTI-VIEW PROJECTION</text>
    <text x="1200" y="35" font-family="monospace" font-size="14" fill="#00d4ff">DOC: S-2001-A</text>
    <text x="1200" y="60" font-family="monospace" font-size="14" fill="#00d4ff">SCALE: 1:100</text>
    <text x="1380" y="85" font-family="monospace" font-size="10" fill="#557799">REV 1.0</text>
  </g>

  <!-- VIEW 1: TOP VIEW (Plan) -->
  <g transform="translate(400, 200)">
    <text x="250" y="-20" font-family="monospace" font-size="16" fill="#00d4ff" text-anchor="middle">VIEW A: TOP PLAN</text>
    <!-- Construction Lines -->
    <line x1="250" y1="200" x2="250" y2="400" stroke="#1e3a5f" stroke-dasharray="5,5"/>
    
    <!-- Solar Arrays Left -->
    <rect x="20" y="280" width="180" height="40" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="20" y1="300" x2="200" y2="300" stroke="#ffffff" stroke-width="1"/>
    <!-- Solar Arrays Right -->
    <rect x="300" y="280" width="180" height="40" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="300" y1="300" x2="480" y2="300" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Main Hull -->
    <path d="M 220 200 L 280 200 L 300 300 L 200 300 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 200 300 L 180 350 L 320 350 L 300 300" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Docking Port -->
    <rect x="235" y="160" width="30" height="40" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Radiators -->
    <path d="M 190 310 L 170 330" stroke="#ffffff" stroke-width="1"/>
    <path d="M 310 310 L 330 330" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Labels -->
    <line x1="30" y1="260" x2="30" y2="200" stroke="#00d4ff" stroke-width="1"/>
    <text x="30" y="190" font-family="monospace" font-size="12" fill="#00d4ff">SOLAR ARRAY (PORT)</text>
    
    <line x1="470" y1="260" x2="470" y2="200" stroke="#00d4ff" stroke-width="1"/>
    <text x="470" y="190" font-family="monospace" font-size="12" fill="#00d4ff">SOLAR ARRAY (STBD)</text>
  </g>

  <!-- VIEW 2: SIDE VIEW (Profile) - MAIN -->
  <g transform="translate(400, 450)">
    <text x="400" y="-20" font-family="monospace" font-size="16" fill="#00d4ff" text-anchor="middle">VIEW B: STARBOARD PROFILE</text>
    
    <!-- Grid alignment -->
    <line x1="50" y1="300" x2="750" y2="300" stroke="#1e3a5f" stroke-dasharray="5,5"/>
    <line x1="50" y1="350" x2="750" y2="350" stroke="#1e3a5f" stroke-dasharray="5,5"/>

    <!-- COCKPIT -->
    <path d="M 50 280 C 50 260, 120 260, 120 280 L 120 320 L 50 320 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 60 280 L 110 280 L 110 300 L 60 300 Z" fill="#ccffff" opacity="0.3"/> <!-- Window -->

    <!-- CREW MODULE -->
    <path d="M 120 280 L 350 280 C 380 280, 380 320, 350 320 L 120 320 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Airlock -->
    <rect x="280" y="320" width="40" height="20" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="300" y1="320" x2="300" y2="340" stroke="#ffffff" stroke-width="1"/>

    <!-- SERVICE MODULE -->
    <path d="M 350 290 L 600 290 L 620 310 L 330 310 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Propellant Tanks -->
    <ellipse cx="450" cy="300" rx="30" ry="10" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <ellipse cx="520" cy="300" rx="30" ry="10" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- ENGINES -->
    <path d="M 600 300 L 630 290 L 630 310 L 600 320" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 630 290 L 660 300 L 660 300 L 630 310" fill="#ffffff" opacity="0.2"/> <!-- Nozzle -->
    <path d="M 620 300 L 660 300" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- ANTENNA -->
    <line x1="150" y1="280" x2="150" y2="240" stroke="#ffffff" stroke-width="2"/>
    <circle cx="150" cy="240" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- LANDING GEAR -->
    <line x1="180" y1="320" x2="180" y2="370" stroke="#ffffff" stroke-width="2"/>
    <circle cx="180" cy="375" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="350" y1="320" x2="350" y2="370" stroke="#ffffff" stroke-width="2"/>
    <circle cx="350" cy="375" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- CALLOUTS -->
    <!-- Cockpit -->
    <line x1="80" y1="250" x2="80" y2="180" stroke="#ffff00" stroke-width="1"/>
    <text x="80" y="170" font-family="monospace" font-size="12" fill="#ffff00">COCKPIT / CREW MODULE</text>
    
    <!-- Cargo -->
    <line x1="300" y1="350" x2="300" y2="400" stroke="#ffff00" stroke-width="1"/>
    <text x="300" y="415" font-family="monospace" font-size="12" fill="#ffff00">AIRLOCK / CARGO BAY</text>

    <!-- Engines -->
    <line x1="640" y1="300" x2="640" y2="380" stroke="#ffff00" stroke-width="1"/>
    <text x="640" y="395" font-family="monospace" font-size="12" fill="#ffff00">MAIN ENGINE (RCS)</text>
    
    <!-- Avionics/Life Support (External icon representation) -->
    <rect x="400" y="265" width="30" height="15" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="415" y1="265" x2="415" y2="255" stroke="#ffff00" stroke-width="1"/>
    <text x="425" y="250" font-family="monospace" font-size="10" fill="#ffff00">AVIONICS</text>

    <!-- DIMENSIONS -->
    <!-- Length -->
    <line x1="50" y1="420" x2="660" y2="420" stroke="#ffffff" stroke-width="1"/>
    <line x1="50" y1="415" x2="50" y2="425" stroke="#ffffff" stroke-width="1"/>
    <line x1="660" y1="415" x2="660" y2="425" stroke="#ffffff" stroke-width="1"/>
    <text x="355" y="440" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">6100 mm</text>
    
    <!-- Height -->
    <line x1="700" y1="240" x2="700" y2="375" stroke="#ffffff" stroke-width="1"/>
    <line x1="695" y1="240" x2="705" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="695" y1="375" x2="705" y2="375" stroke="#ffffff" stroke-width="1"/>
    <text x="720" y="310" font-family="monospace" font-size="12" fill="#ffffff">13.5m</text>

  </g>

  <!-- VIEW 3: FRONT VIEW -->
  <g transform="translate(1200, 450)">
    <text x="100" y="-20" font-family="monospace" font-size="16" fill="#00d4ff" text-anchor="middle">VIEW C: FRONT (FORWARD)</text>
    
    <!-- Crew Module Face -->
    <circle cx="100" cy="250" r="80" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="100" cy="250" r="60" fill="none" stroke="#ffffff" stroke-width="1"/>
    <!-- Window -->
    <path d="M 60 220 L 140 220 L 130 250 L 70 250 Z" fill="#ccffff" opacity="0.3" stroke="none"/>
    <path d="M 60 220 L 140 220 L 130 250 L 70 250 Z" fill="none" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Radiators -->
    <path d="M 20 250 L 10 200 L 10 300 L 20 250" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 180 250 L 190 200 L 190 300 L 180 250" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Landing Gear -->
    <line x1="100" y1="330" x2="100" y2="360" stroke="#ffffff" stroke-width="2"/>
    <circle cx="100" cy="365" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Callouts -->
    <text x="10" y="180" font-family="monospace" font-size="10" fill="#ffff00">RADIATOR PANEL</text>
    <text x="60" y="150" font-family="monospace" font-size="10" fill="#ffff00">CREW COMPARTMENT</text>
  </g>

  <!-- VIEW 4: REAR VIEW -->
  <g transform="translate(1200, 900)">
    <text x="100" y="-20" font-family="monospace" font-size="16" fill="#00d4ff" text-anchor="middle">VIEW D: REAR (AFT)</text>
    
    <!-- Service Module Rear -->
    <rect x="40" y="200" width="120" height="100" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Engine Bells -->
    <ellipse cx="70" cy="320" rx="20" ry="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="130" cy="320" rx="20" ry="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 50 320 L 50 340 L 90 340 L 90 320" fill="none" stroke="#ffffff" stroke-width="1"/>
    <path d="M 110 320 L 110 340 L 150 340 L 150 320" fill="none" stroke="#ffffff" stroke-width="1"/>

    <text x="60" y="360" font-family="monospace" font-size="10" fill="#ffff00">MAIN ENGINE x2</text>
    <text x="60" y="190" font-family="monospace" font-size="10" fill="#ffff00">SERVICE MODULE</text>
  </g>

  <!-- VIEW 5: CUTAWAY VIEW -->
  <g transform="translate(50, 800)">
    <text x="250" y="0" font-family="monospace" font-size="16" fill="#00d4ff" text-anchor="middle">VIEW E: SECTION A-A (LONGITUDINAL)</text>
    <text x="250" y="20" font-family="monospace" font-size="10" fill="#00d4ff" text-anchor="middle">(INTERIOR LAYOUT)</text>

    <!-- Section Lines on reference -->
    <line x1="400" y1="300" x2="450" y2="250" stroke="#ff0000" stroke-width="2"/>
    <line x1="400" y1="300" x2="450" y2="350" stroke="#ff0000" stroke-width="2"/>
    <text x="460" y="310" font-family="monospace" font-size="12" fill="#ff0000">A-A</text>

    <!-- Half Profile Cutaway -->
    <!-- Right Half (External) -->
    <path d="M 250 200 L 400 200 L 400 250 L 250 250" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 250 200 C 250 180, 400 180, 400 200" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Left Half (Internal) -->
    <path d="M 250 200 L 50 200 L 50 250 L 250 250" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 250 200 C 250 180, 50 180, 50 200" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Internal Details -->
    <!-- Pilot Seat -->
    <rect x="100" y="210" width="30" height="20" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="110" y="200" font-family="monospace" font-size="8" fill="#00d4ff">PILOT</text>
    
    <!-- Life Support -->
    <rect x="150" y="215" width="20" height="15" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,1"/>
    <text x="155" y="240" font-family="monospace" font-size="8" fill="#00d4ff">LSS</text>

    <!-- Cargo Containers -->
    <rect x="200" y="215" width="30" height="15" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="205" y="240" font-family="monospace" font-size="8" fill="#00d4ff">CARGO</text>
    
    <!-- Fuel Lines -->
    <path d="M 300 225 L 350 225 L 380 225" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="320" y="215" font-family="monospace" font-size="8" fill="#00d4ff">FUEL</text>

    <!-- Avionics Bay -->
    <rect x="280" y="205" width="40" height="10" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="290" y="200" font-family="monospace" font-size="8" fill="#00d4ff">AVIONICS</text>

    <!-- Centerline -->
    <line x1="250" y1="180" x2="250" y2="270" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- COMPONENT LEGEND / NOTES -->
  <g transform="translate(50, 1400)">
    <text x="0" y="0" font-family="monospace" font-size="18" fill="#ffffff" font-weight="bold">TECHNICAL NOTES:</text>
    <text x="0" y="30" font-family="monospace" font-size="14" fill="#aaccee">1. ALL DIMENSIONS IN MILLIMETERS UNLESS OTHERWISE SPECIFIED.</text>
    <text x="0" y="50" font-family="monospace" font-size="14" fill="#aaccee">2. STRUCTURAL MATERIAL: CARBON FIBER COMPOSITE / AL-LI ALLOY.</text>
    <text x="0" y="70" font-family="monospace" font-size="14" fill="#aaccee">3. TOTAL MASS (DRY): 12,500 KG.</text>
    <text x="0" y="90" font-family="monospace" font-size="14" fill="#aaccee">4. PROPELLANT: LOX/LH2.</text>
  </g>

</svg>