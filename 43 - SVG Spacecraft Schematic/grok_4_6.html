    const svgNS = "http://www.w3.org/2000/svg";
    function svgEl(name, attrs, text) {
      const el = document.createElementNS(svgNS, name);
      Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
      if (text != null) el.textContent = text;
      return el;
    }

    const bomBody = document.getElementById("bom-body");
    BOM.forEach((row, i) => {
      const y = 68 + i * 20;
      const g = svgEl("g", { class: "part", "data-id": row[0] });
      g.appendChild(svgEl("rect", { x: 4, y: y - 14, width: 1080, height: 20, fill: i % 2 ? "rgba(20,50,70,0.25)" : "transparent" }));
      const xs = [16, 50, 360, 560, 708, 760, 860];
      row.forEach((cell, ci) => {
        g.appendChild(svgEl("text", { x: xs[ci], y, fill: ci === 0 ? "#e7cc74" : "#c5e2f0" }, cell));
      });
      bomBody.appendChild(g);
    });

    const rivetRow = document.getElementById("rivetRow");
    if (rivetRow) {
      for (let x = 70; x <= 730; x += 12) {
        rivetRow.appendChild(svgEl("circle", { cx: x, cy: 254, r: 0.7 }));
        rivetRow.appendChild(svgEl("circle", { cx: x, cy: 346, r: 0.7 }));
      }
    }

    function highlight(id) {
      document.querySelectorAll(".part").forEach((p) => {
        p.style.filter = String(p.dataset.id) === String(id) ? "url(#hoverGlow)" : "";
      });
    }

    function loadSpec(id, fallback) {
      highlight(id);
      const s = SPECS[id];
      if (!s && fallback) {
        document.getElementById("spec-id").textContent = fallback.name || "NV-441 AETHER CTV";
        document.getElementById("spec-name").textContent = fallback.note || "";
        document.getElementById("spec-pn").textContent = fallback.pn || "—";
        document.getElementById("spec-sta").textContent = fallback.sta || "—";
        document.getElementById("spec-mass").textContent = fallback.mass || "—";
        document.getElementById("spec-note").textContent = fallback.note || "";
        return;
      }
      if (!s) return;
      document.getElementById("spec-id").textContent = s[0];
      document.getElementById("spec-name").textContent = "Find No. " + id + "  ·  highlighted on sheet";
      document.getElementById("spec-pn").textContent = s[1];
      document.getElementById("spec-sta").textContent = s[2];
      document.getElementById("spec-mass").textContent = s[3];
      document.getElementById("spec-note").textContent = s[4];
    }

    document.querySelectorAll(".part").forEach((el) => {
      el.addEventListener("mouseenter", (e) => {
        const id = el.dataset.id;
        const tip = document.getElementById("tooltip");
        const s = SPECS[id];
        tip.style.display = "block";
        tip.innerHTML = s
          ? `<b style="color:#e2c15a">${id}  ${s[0]}</b><br>${s[1]}<br>${s[4]}`
          : `<b style="color:#e2c15a">${el.dataset.name || "SYSTEM"}</b><br>${el.dataset.note || ""}`;
      });
      el.addEventListener("mousemove", (e) => {
        const tip = document.getElementById("tooltip");
        tip.style.left = e.clientX + 14 + "px";
        tip.style.top = e.clientY + 14 + "px";
      });
      el.addEventListener("mouseleave", () => {
        document.getElementById("tooltip").style.display = "none";
      });
      el.addEventListener("click", () => {
        loadSpec(el.dataset.id, {
          name: el.dataset.name,
          pn: el.dataset.pn,
          sta: el.dataset.sta,
          mass: el.dataset.mass,
          note: el.dataset.note
        });
      });
    });

    document.querySelectorAll(".layer-balloons text").forEach((t) => {
      const id = (t.textContent || "").trim();
      if (!SPECS[id] && !BOM.find((r) => r[0] === id)) return;
      t.style.cursor = "pointer";
      t.addEventListener("click", () => loadSpec(id));
      t.addEventListener("mouseenter", (e) => {
        const s = SPECS[id];
        const tip = document.getElementById("tooltip");
        if (!s) return;
        tip.style.display = "block";
        tip.innerHTML = `<b style="color:#e2c15a">${id}  ${s[0]}</b><br>${s[1]}<br>${s[4]}`;
      });
      t.addEventListener("mousemove", (e) => {
        const tip = document.getElementById("tooltip");
        tip.style.left = e.clientX + 14 + "px";
        tip.style.top = e.clientY + 14 + "px";
      });
      t.addEventListener("mouseleave", () => {
        document.getElementById("tooltip").style.display = "none";
      });
    });

    // zoom / pan
    const viewport = document.getElementById("viewport");
    const sheet = document.getElementById("sheet");
    let scale = 0.62;
    let tx = 24;
    let ty = 18;
    let drag = false;
    let lx = 0, ly = 0;

    function applyView() {
      sheet.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      document.getElementById("zoom-readout").textContent = Math.round(scale * 100) + "%";
    }
    applyView();

    viewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".part")) return;
      drag = true;
      viewport.classList.add("dragging");
      lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener("pointerup", () => {
      drag = false;
      viewport.classList.remove("dragging");
    });
    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      tx += e.clientX - lx;
      ty += e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      applyView();
    });
    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const prev = scale;
      scale = Math.min(2.4, Math.max(0.28, scale * (e.deltaY > 0 ? 0.9 : 1.11)));
      tx = mx - (mx - tx) * (scale / prev);
      ty = my - (my - ty) * (scale / prev);
      applyView();
    }, { passive: false });

    document.getElementById("btn-zoom-in").onclick = () => { scale = Math.min(2.4, scale * 1.15); applyView(); };
    document.getElementById("btn-zoom-out").onclick = () => { scale = Math.max(0.28, scale / 1.15); applyView(); };
    document.getElementById("btn-reset").onclick = () => { scale = 0.62; tx = 24; ty = 18; applyView(); };

    function toggleLayer(btnId, selector, classOn) {
      const btn = document.getElementById(btnId);
      btn.addEventListener("click", () => {
        btn.classList.toggle("active");
        document.querySelectorAll(selector).forEach((n) => {
          n.style.display = btn.classList.contains("active") ? "" : "none";
        });
      });
    }
    toggleLayer("btn-grid", "#layer-grid", true);
    toggleLayer("btn-dims", ".layer-dims", true);
    toggleLayer("btn-balloons", ".layer-balloons", true);
    toggleLayer("btn-struct", ".layer-struct", true);
  </script>
</body>
