<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SC-X1 Ares Orbital Transport — Technical Schematic</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --cyan: #06b6d4;
      --cyan-bright: #22d3ee;
      --cyan-dim: #0891b2;
      --paper: #081018;
    }
    body {
      background: #0b1220;
      color: var(--cyan);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .blueprint-grid {
      background-image:
        linear-gradient(var(--cyan-dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--cyan-dim) 1px, transparent 1px);
      background-size: 20px 20px;
      opacity: 0.10;
    }
    svg { display: block; }

    /* Major outlines */
    .bp-major   { fill: none; stroke: var(--cyan-bright); stroke-width: 2.25; stroke-linejoin: round; }
    /* Medium structural lines */
    .bp-med     { fill: none; stroke: var(--cyan); stroke-width: 1.25; }
    /* Minor details / grid */
    .bp-minor   { fill: none; stroke: var(--cyan-dim); stroke-width: 0.75; opacity: 0.85; }
    /* Hidden / centerlines */
    .bp-hidden  { fill: none; stroke: var(--cyan); stroke-width: 0.75; stroke-dasharray: 5 4; opacity: 0.65; }
    .bp-center  { fill: none; stroke: var(--cyan); stroke-width: 0.6; stroke-dasharray: 8 4; opacity: 0.55; }
    /* Fills */
    .bp-fill    { fill: rgba(6, 182, 212, 0.08); stroke: none; }
    .bp-fill2   { fill: rgba(34, 211, 238, 0.12); stroke: none; }
    .bp-cut     { fill: url(#sectionHatch); stroke: var(--cyan); stroke-width: 0.75; opacity: 0.55; }
    .bp-tank    { fill: rgba(6, 182, 212, 0.22); stroke: var(--cyan); stroke-width: 0.75; }
    .bp-cargo   { fill: rgba(34, 211, 238, 0.08); stroke: var(--cyan); stroke-width: 0.75; }

    /* Dimensions */
    .dim-line   { fill: none; stroke: var(--cyan-bright); stroke-width: 1; marker-start: url(#dimArrowStart); marker-end: url(#dimArrowEnd); }
    .dim-ext    { fill: none; stroke: var(--cyan); stroke-width: 0.6; stroke-dasharray: 3 3; opacity: 0.8; }
    .dim-text, .label-text, .callout-text {
      paint-order: stroke fill;
      stroke: var(--paper);
      stroke-width: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .dim-text   { fill: #cffafe; font-size: 9.5px; font-weight: 700; }
    .label-text { fill: #e0f2fe; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .callout-text { fill: #cffafe; font-size: 9px; font-weight: 600; }
    .callout-line { fill: none; stroke: #38bdf8; stroke-width: 1; }
    .callout-dot { fill: var(--cyan-bright); stroke: none; }

    .title-block { fill: rgba(8, 16, 24, 0.85); stroke: var(--cyan); stroke-width: 1; }
    .title-text  { fill: #cffafe; font-size: 11px; font-weight: 700; }
    .title-small { fill: #89e4f3; font-size: 9px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
  <header class="w-full max-w-[1600px] mb-3 flex justify-between items-end border-b border-cyan-500/40 pb-2">
    <div>
      <h1 class="text-2xl font-bold tracking-[0.2em] text-cyan-400 uppercase">SC-X1 Ares Orbital Transport</h1>
      <p class="text-xs text-cyan-300/70 mt-1">General Arrangement & Systems Schematic — Revision 1.2</p>
    </div>
    <div class="text-right text-xs text-cyan-300/70 leading-relaxed">
      <div>SCALE 1:100</div>
      <div>SHEET 1 OF 1</div>
      <div>UNITS: METERS</div>
    </div>
  </header>

  <main class="relative w-full max-w-[1600px] border border-cyan-500/30 rounded-lg bg-[#081018] overflow-hidden shadow-2xl">
    <div class="absolute inset-0 blueprint-grid pointer-events-none"></div>
    <svg id="schematic" viewBox="0 0 1600 1100" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="sectionHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
        </pattern>
        <marker id="dimArrowStart" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
          <path d="M10,0 L0,3.5 L10,7 z" fill="#22d3ee" />
        </marker>
        <marker id="dimArrowEnd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <path d="M0,0 L10,3.5 L0,7 z" fill="#22d3ee" />
        </marker>
      </defs>
      <g id="views"></g>
    </svg>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('schematic');
      const viewsRoot = document.getElementById('views');

      function make(tag, attrs = {}) {
        const el = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
      }

      // Viewports
      const V = {
        top:    { cx: 260, cy: 220, s: 12, label: 'TOP VIEW' },
        side:   { cx: 620, cy: 220, s: 12, label: 'SIDE VIEW' },
        front:  { cx: 240, cy: 620, s: 14, label: 'FRONT VIEW' },
        rear:   { cx: 600, cy: 620, s: 14, label: 'REAR VIEW' },
        cut:    { cx: 1050, cy: 300, s: 11, label: 'SECTION A-A  (CUTAWAY)' }
      };

      // Spacecraft model constants (meters)
      const C = {
        zDockFront: 9.2, zDockRear: 8.5, rDock: 0.8, yDock: 2.6,
        zNoseRear: 4.0, rCrew: 1.8,
        zCrewRear: 2.0,
        zSvcFront: 2.0, zSvcRear: -4.0, rSvc: 2.0,
        zPropRear: -9.0, rProp: 1.6, yPropTop: 3.0,
        yFusBottom: 0.9, yFusTop: 3.9,
        yCrewBottom: 1.1, yCrewTop: 4.1,
        engineX: 1.8, engineY: 1.2, engineZ: -8.5, engineR: 0.8, engineLen: 1.4,
        extTankX: 3.4, extTankY: 2.2, extTankR: 1.2, extTankZ0: -5, extTankZ1: -1,
        solarXin: 3.0, solarXout: 10.5, solarZ0: 0, solarZ1: 1.5, solarY: 4.2,
        radXin: 2.0, radXout: 7.5, radY0: 1.5, radY1: 4.5, radZ: -1.5, radDz: 0.35,
        lgMainX: 2.2, lgMainZ: -2, lgNoseZ: 4.5,
        dishY: 4.8, dishZ: 2.0, dishR: 0.8,
        cockpitZ0: 6.5, cockpitZ1: 8.2, cockpitY0: 2.6, cockpitY1: 3.7,
        avionicsZ0: 6.0, avionicsZ1: 7.2, avionicsY0: 1.2, avionicsY1: 2.3,
        eclssZ0: 4.5, eclssZ1: 5.5, eclssY0: 1.5, eclssY1: 3.5,
        cargoZ0: -3.0, cargoZ1: 1.0, cargoY0: 1.1, cargoY1: 3.7,
        it1: { z: -6.0, y: 2.4, r: 1.1 },
        it2: { z: -7.8, y: 2.4, r: 0.9 }
      };

      const groups = {};
      for (const k of Object.keys(V)) {
        const g = make('g', { id: `view-${k}` });
        groups[k] = g;
        viewsRoot.appendChild(g);
      }

      function project(view, p) {
        const v = V[view];
        switch (view) {
          case 'top':  return [v.cx + p.x * v.s, v.cy - p.z * v.s];
          case 'side': return [v.cx + p.z * v.s, v.cy - p.y * v.s];
          case 'front':return [v.cx + p.x * v.s, v.cy - p.y * v.s];
          case 'rear': return [v.cx - p.x * v.s, v.cy - p.y * v.s];
          case 'cut':  return [v.cx + p.z * v.s, v.cy - p.y * v.s];
        }
        return [0, 0];
      }

      function f(n) { return (+n).toFixed(1); }

      function addPath(view, d, cls, attrs = {}) {
        groups[view].appendChild(make('path', { d, class: cls, ...attrs }));
      }

      function addLine(view, p1, p2, cls, attrs = {}) {
        const [x1, y1] = project(view, p1);
        const [x2, y2] = project(view, p2);
        groups[view].appendChild(make('line', { x1: f(x1), y1: f(y1), x2: f(x2), y2: f(y2), class: cls, ...attrs }));
      }

      function addCircle(view, c, r, cls, attrs = {}) {
        const [x, y] = project(view, c);
        groups[view].appendChild(make('circle', { cx: f(x), cy: f(y), r: f(r * V[view].s), class: cls, ...attrs }));
      }

      function addText(view, x, y, text, cls, anchor = 'start', attrs = {}) {
        const el = make('text', { x: f(x), y: f(y), class: cls, 'text-anchor': anchor, ...attrs });
        el.textContent = text;
        groups[view].appendChild(el);
      }

      function polyD(view, pts, closed = false) {
        let d = '';
        pts.forEach((p, i) => {
          const [x, y] = project(view, p);
          d += (i ? 'L' : 'M') + f(x) + ',' + f(y) + ' ';
        });
        if (closed) d += 'Z';
        return d;
      }

      function addPoly(view, pts, cls, attrs = {}) {
        addPath(view, polyD(view, pts, true), cls, attrs);
      }

      function addRect(view, p, w, h, cls, attrs = {}) {
        const [x, y] = project(view, p);
        groups[view].appendChild(make('rect', {
          x: f(x), y: f(y), width: f(w * V[view].s), height: f(h * V[view].s), class: cls, ...attrs
        }));
      }

      // ----- Drawing helpers per component -----

      function fuselageTop() {
        const right = [
          { x: C.rDock, z: C.zDockFront },
          { x: C.rDock, z: C.zDockRear },
          { x: C.rCrew, z: C.zNoseRear },
          { x: C.rCrew, z: C.zCrewRear },
          { x: C.rSvc, z: C.zSvcFront },
          { x: C.rSvc, z: C.zSvcRear },
          { x: C.rProp, z: C.zPropRear },
          { x: 0, z: C.zPropRear }
        ];
        const left = [
          { x: -C.rProp, z: C.zPropRear },
          { x: -C.rSvc, z: C.zSvcRear },
          { x: -C.rSvc, z: C.zSvcFront },
          { x: -C.rCrew, z: C.zCrewRear },
          { x: -C.rCrew, z: C.zNoseRear },
          { x: -C.rDock, z: C.zDockRear },
          { x: -C.rDock, z: C.zDockFront }
        ];
        addPoly('top', [...right, ...left], 'bp-major');
        // centerline
        addLine('top', { x: 0, z: C.zDockFront + 0.3 }, { x: 0, z: C.zPropRear - 0.3 }, 'bp-center');
      }

      function fuselageSide() {
        const top = [
          { z: C.zDockFront, y: C.yDock + C.rDock },
          { z: C.zDockRear, y: C.yDock + C.rDock },
          { z: C.zNoseRear, y: C.yCrewTop },
          { z: C.zCrewRear, y: C.yCrewTop },
          { z: C.zSvcFront, y: C.yFusTop },
          { z: C.zSvcRear, y: C.yFusTop },
          { z: C.zPropRear, y: C.yPropTop }
        ];
        const bottom = [
          { z: C.zPropRear, y: C.yFusBottom },
          { z: C.zSvcRear, y: C.yFusBottom },
          { z: C.zSvcFront, y: C.yFusBottom },
          { z: C.zCrewRear, y: C.yCrewBottom },
          { z: C.zNoseRear, y: C.yCrewBottom },
          { z: C.zDockRear, y: C.yDock - C.rDock },
          { z: C.zDockFront, y: C.yDock - C.rDock }
        ];
        addPoly('side', [...top, ...bottom], 'bp-major');
        addLine('side', { z: C.zDockFront + 0.3, y: 2.4 }, { z: C.zPropRear - 0.3, y: 2.4 }, 'bp-center');
      }

      function fuselageFront() {
        // Main service module envelope
        addRect('front', { x: -C.rSvc, y: C.yFusBottom }, C.rSvc * 2, C.yFusTop - C.yFusBottom, 'bp-major');
        // Crew / nose cylinder overlay
        addRect('front', { x: -C.rCrew, y: C.yCrewBottom }, C.rCrew * 2, C.yCrewTop - C.yCrewBottom, 'bp-med');
        // centerline
        addLine('front', { x: 0, y: 0.3 }, { x: 0, y: 5.0 }, 'bp-center');
      }

      function fuselageRear() {
        addRect('rear', { x: -C.rProp, y: C.yFusBottom }, C.rProp * 2, C.yPropTop - C.yFusBottom, 'bp-major');
        addLine('rear', { x: 0, y: 0.3 }, { x: 0, y: 3.6 }, 'bp-center');
      }

      function externalTanks(view) {
        // Cylindrical tanks along z, on each side
        const zMid = (C.extTankZ0 + C.extTankZ1) / 2;
        const zLen = C.extTankZ1 - C.extTankZ0;
        const signs = [1, -1];
        signs.forEach(sgn => {
          const cx = sgn * C.extTankX;
          if (view === 'top') {
            addRect('top', { x: cx - C.extTankR, z: C.extTankZ0 }, C.extTankR * 2, zLen, 'bp-med');
            addCircle('top', { x: cx + C.extTankR, z: zMid }, C.extTankR, 'bp-med');
            addCircle('top', { x: cx - C.extTankR, z: zMid }, C.extTankR, 'bp-med');
          } else if (view === 'side') {
            addRect('side', { z: C.extTankZ0, y: C.extTankY - C.extTankR }, zLen, C.extTankR * 2, 'bp-med bp-fill');
          } else if (view === 'front' || view === 'rear') {
            addCircle(view, { x: cx, y: C.extTankY }, C.extTankR, 'bp-med bp-fill');
          } else if (view === 'cut') {
            addRect('cut', { z: C.extTankZ0, y: C.extTankY - C.extTankR }, zLen, C.extTankR * 2, 'bp-hidden bp-fill');
          }
        });
      }

      function engines(view) {
        if (view === 'top') {
          addCircle('top', { x: -C.engineX, z: C.engineZ }, C.engineR, 'bp-major');
          addCircle('top', { x: C.engineX, z: C.engineZ }, C.engineR, 'bp-major');
          addCircle('top', { x: -C.engineX, z: C.engineZ }, C.engineR * 0.45, 'bp-minor');
          addCircle('top', { x: C.engineX, z: C.engineZ }, C.engineR * 0.45, 'bp-minor');
        } else if (view === 'side') {
          const z0 = C.engineZ - C.engineLen / 2;
          const z1 = C.engineZ + C.engineLen / 2;
          // Twin nozzles collapsed; draw one combined nozzle with internal line
          addPath('side',
            polyD('side', [
              { z: z1, y: C.engineY - C.engineR },
              { z: z0, y: C.engineY - C.engineR * 0.7 },
              { z: z0, y: C.engineY + C.engineR * 0.7 },
              { z: z1, y: C.engineY + C.engineR }
            ], true), 'bp-major bp-fill');
          addLine('side', { z: z0, y: C.engineY - C.engineR * 0.7 }, { z: z0, y: C.engineY + C.engineR * 0.7 }, 'bp-minor');
          // thrust cones
          addPath('side', polyD('side', [
            { z: z0 - 0.4, y: C.engineY },
            { z: z0 - 1.0, y: C.engineY - 0.35 },
            { z: z0 - 1.0, y: C.engineY + 0.35 }
          ], true), 'bp-hidden');
        } else if (view === 'front' || view === 'rear') {
          addCircle(view, { x: -C.engineX, y: C.engineY }, C.engineR, 'bp-major bp-fill');
          addCircle(view, { x: C.engineX, y: C.engineY }, C.engineR, 'bp-major bp-fill');
          addCircle(view, { x: -C.engineX, y: C.engineY }, C.engineR * 0.45, 'bp-minor');
          addCircle(view, { x: C.engineX, y: C.engineY }, C.engineR * 0.45, 'bp-minor');
        } else if (view === 'cut') {
          const z0 = C.engineZ - C.engineLen / 2;
          const z1 = C.engineZ + C.engineLen / 2;
          addPath('cut', polyD('cut', [
            { z: z1, y: C.engineY - C.engineR },
            { z: z0, y: C.engineY - C.engineR * 0.7 },
            { z: z0, y: C.engineY + C.engineR * 0.7 },
            { z: z1, y: C.engineY + C.engineR }
          ], true), 'bp-major bp-fill');
        }
      }

      function solarArrays(view) {
        const signs = [1, -1];
        signs.forEach(sgn => {
          const x0 = sgn * C.solarXin;
          const x1 = sgn * C.solarXout;
          const span = Math.abs(x1 - x0);
          if (view === 'top') {
            const z0 = C.solarZ0, z1 = C.solarZ1;
            addRect('top', { x: Math.min(x0, x1), z: z0 }, span, z1 - z0, 'bp-med bp-fill2');
            // cells
            for (let x = Math.min(x0, x1) + 1.5; Math.abs(x) < Math.abs(x1); x += sgn * 1.5) {
              addLine('top', { x, z: z0 }, { x, z: z1 }, 'bp-minor');
            }
            for (let z = z0 + 0.3; z < z1; z += 0.3) {
              addLine('top', { x: x0, z }, { x: x1, z }, 'bp-minor');
            }
            // boom
            addLine('top', { x: sgn * 2.0, z: (z0 + z1) / 2 }, { x: x0, z: (z0 + z1) / 2 }, 'bp-med');
          } else if (view === 'side') {
            addRect('side', { z: C.solarZ0, y: C.solarY }, C.solarZ1 - C.solarZ0, 0.12, 'bp-med bp-fill2');
            addLine('side', { z: (C.solarZ0 + C.solarZ1) / 2, y: C.yFusTop }, { z: (C.solarZ0 + C.solarZ1) / 2, y: C.solarY }, 'bp-med');
          } else if (view === 'front' || view === 'rear') {
            addRect(view, { x: Math.min(x0, x1), y: C.solarY }, span, 0.15, 'bp-med bp-fill2');
            for (let x = Math.min(x0, x1) + 1.5; Math.abs(x) < Math.abs(x1); x += sgn * 1.5) {
              addLine(view, { x, y: C.solarY }, { x, y: C.solarY + 0.15 }, 'bp-minor');
            }
            addLine(view, { x: sgn * 2.0, y: C.yFusTop }, { x: x0, y: C.solarY }, 'bp-med');
          }
        });
      }

      function radiators(view) {
        const signs = [1, -1];
        signs.forEach(sgn => {
          const x0 = sgn * C.radXin;
          const x1 = sgn * C.radXout;
          const span = Math.abs(x1 - x0);
          if (view === 'top') {
            addRect('top', { x: Math.min(x0, x1), z: C.radZ - C.radDz / 2 }, span, C.radDz, 'bp-med bp-fill');
            for (let x = Math.min(x0, x1) + 1.5; Math.abs(x) < Math.abs(x1); x += sgn * 1.5) {
              addLine('top', { x, z: C.radZ - C.radDz / 2 }, { x, z: C.radZ + C.radDz / 2 }, 'bp-minor');
            }
            addLine('top', { x: sgn * 1.8, z: C.radZ }, { x: x0, z: C.radZ }, 'bp-med');
          } else if (view === 'side') {
            addRect('side', { z: C.radZ - 0.08, y: C.radY0 }, 0.16, C.radY1 - C.radY0, 'bp-med bp-fill');
            for (let y = C.radY0 + 0.6; y < C.radY1; y += 0.6) {
              addLine('side', { z: C.radZ - 0.08, y }, { z: C.radZ + 0.08, y }, 'bp-minor');
            }
          } else if (view === 'front' || view === 'rear') {
            addRect(view, { x: Math.min(x0, x1), y: C.radY0 }, span, C.radY1 - C.radY0, 'bp-med bp-fill');
            for (let y = C.radY0 + 0.6; y < C.radY1; y += 0.6) {
              addLine(view, { x: x0, y }, { x: x1, y }, 'bp-minor');
            }
            addLine(view, { x: sgn * 1.9, y: C.radY0 + 0.2 }, { x: x0, y: C.radY0 + 0.2 }, 'bp-med');
          }
        });
      }

      function landingGear(view) {
        if (view === 'top') {
          // wheels / feet
          addCircle('top', { x: -C.lgMainX, z: C.lgMainZ }, 0.25, 'bp-med bp-fill');
          addCircle('top', { x: C.lgMainX, z: C.lgMainZ }, 0.25, 'bp-med bp-fill');
          addCircle('top', { x: 0, z: C.lgNoseZ }, 0.22, 'bp-med bp-fill');
          addLine('top', { x: -C.lgMainX, z: C.lgMainZ }, { x: -C.lgMainX + 0.3, z: C.lgMainZ }, 'bp-minor');
          addLine('top', { x: C.lgMainX, z: C.lgMainZ }, { x: C.lgMainX - 0.3, z: C.lgMainZ }, 'bp-minor');
          addLine('top', { x: 0, z: C.lgNoseZ }, { x: 0, z: C.lgNoseZ - 0.3 }, 'bp-minor');
        } else if (view === 'side') {
          // ground line
          addLine('side', { z: C.zPropRear - 0.5, y: 0 }, { z: C.zDockFront + 0.5, y: 0 }, 'bp-minor');
          // main gear strut
          addLine('side', { z: C.lgMainZ, y: 0 }, { z: C.lgMainZ, y: C.yFusBottom }, 'bp-med');
          addCircle('side', { z: C.lgMainZ, y: 0 }, 0.22, 'bp-med bp-fill');
          // nose gear strut
          addLine('side', { z: C.lgNoseZ, y: 0 }, { z: C.lgNoseZ, y: C.yFusBottom }, 'bp-med');
          addCircle('side', { z: C.lgNoseZ, y: 0 }, 0.20, 'bp-med bp-fill');
        } else if (view === 'front' || view === 'rear') {
          [-C.lgMainX, 0, C.lgMainX].forEach(x => {
            addLine(view, { x, y: 0 }, { x, y: C.yFusBottom }, 'bp-med');
            addCircle(view, { x, y: 0 }, 0.20, 'bp-med bp-fill');
          });
        }
      }

      function antennas(view) {
        if (view === 'top') {
          addCircle('top', { x: 0, z: C.dishZ }, C.dishR, 'bp-med bp-fill');
          addLine('top', { x: 0, z: C.dishZ }, { x: 0, z: C.dishZ - 0.6 }, 'bp-med');
          addCircle('top', { x: -1.0, z: 6.5 }, 0.12, 'bp-minor');
          addCircle('top', { x: 1.0, z: 6.5 }, 0.12, 'bp-minor');
        } else if (view === 'side') {
          // mast
          addLine('side', { z: C.dishZ, y: C.yFusTop }, { z: C.dishZ, y: C.dishY + 0.2 }, 'bp-med');
          // dish profile
          addPath('side', polyD('side', [
            { z: C.dishZ - C.dishR, y: C.dishY },
            { z: C.dishZ, y: C.dishY + 0.7 },
            { z: C.dishZ + C.dishR, y: C.dishY }
          ], true), 'bp-med bp-fill');
          // whips
          addLine('side', { z: 6.5, y: C.yCrewTop }, { z: 6.5, y: C.yCrewTop + 0.8 }, 'bp-minor');
        } else if (view === 'front' || view === 'rear') {
          addCircle(view, { x: 0, y: C.dishY }, C.dishR, 'bp-med bp-fill');
          addLine(view, { x: 0, y: C.dishY }, { x: 0, y: C.yFusTop }, 'bp-med');
          addLine(view, { x: -1.0, y: 4.5 }, { x: -1.0, y: C.yCrewTop }, 'bp-minor');
          addLine(view, { x: 1.0, y: 4.5 }, { x: 1.0, y: C.yCrewTop }, 'bp-minor');
        }
      }

      function airlocks(view) {
        if (view === 'top') {
          addRect('top', { x: -C.rCrew, z: 2.7 }, 0.45, 0.6, 'bp-med');
          addRect('top', { x: C.rCrew - 0.45, z: 2.7 }, 0.45, 0.6, 'bp-med');
          addRect('top', { x: -0.5, z: 0.1 }, 1.0, 0.8, 'bp-med');
        } else if (view === 'side') {
          addRect('side', { z: 2.7, y: 1.9 }, 1.0, 1.0, 'bp-hidden');
          addRect('side', { z: 0.1, y: C.yFusTop }, 0.8, 0.4, 'bp-med');
        } else if (view === 'front' || view === 'rear') {
          addRect(view, { x: -C.rCrew, y: 2.0 }, 0.35, 0.8, 'bp-med');
          addRect(view, { x: C.rCrew - 0.35, y: 2.0 }, 0.35, 0.8, 'bp-med');
          addRect(view, { x: -0.5, y: C.yFusTop }, 1.0, 0.35, 'bp-med');
        }
      }

      function dockingPort(view) {
        if (view === 'top') {
          addCircle('top', { x: 0, z: C.zDockFront }, C.rDock, 'bp-major');
          addLine('top', { x: -C.rDock, z: C.zDockRear }, { x: -C.rDock, z: C.zDockFront }, 'bp-med');
          addLine('top', { x: C.rDock, z: C.zDockRear }, { x: C.rDock, z: C.zDockFront }, 'bp-med');
        } else if (view === 'side') {
          addRect('side', { z: C.zDockRear, y: C.yDock - C.rDock }, C.zDockFront - C.zDockRear, C.rDock * 2, 'bp-major bp-fill');
          addLine('side', { z: C.zDockRear, y: C.yDock }, { z: C.zDockFront, y: C.yDock }, 'bp-minor');
        } else if (view === 'front') {
          addCircle('front', { x: 0, y: C.yDock }, C.rDock, 'bp-major bp-fill');
        } else if (view === 'rear') {
          // not visible from rear
        }
      }

      function cargoBay(view) {
        if (view === 'top') {
          addRect('top', { x: -1.8, z: C.cargoZ0 }, 3.6, C.cargoZ1 - C.cargoZ0, 'bp-hidden');
          addLine('top', { x: 0, z: C.cargoZ0 }, { x: 0, z: C.cargoZ1 }, 'bp-hidden');
        } else if (view === 'side') {
          addLine('side', { z: C.cargoZ0, y: C.cargoY0 }, { z: C.cargoZ0, y: C.cargoY1 }, 'bp-hidden');
          addLine('side', { z: C.cargoZ1, y: C.cargoY0 }, { z: C.cargoZ1, y: C.cargoY1 }, 'bp-hidden');
          addLine('side', { z: C.cargoZ0, y: (C.cargoY0 + C.cargoY1) / 2 }, { z: C.cargoZ1, y: (C.cargoY0 + C.cargoY1) / 2 }, 'bp-hidden');
        } else if (view === 'front' || view === 'rear') {
          // cargo not visible head-on
        }
      }

      function cockpitWindows(view) {
        if (view === 'side') {
          addPath('side', polyD('side', [
            { z: C.cockpitZ0, y: C.cockpitY0 },
            { z: C.cockpitZ1, y: C.cockpitY0 },
            { z: C.cockpitZ1 - 0.2, y: C.cockpitY1 },
            { z: C.cockpitZ0 + 0.3, y: C.cockpitY1 }
          ], true), 'bp-med bp-fill2');
        }
      }

      // ----- Cutaway internals -----
      function cutawayInternals() {
        // Outer hull (same as side view)
        fuselageSide();

        // Pressurized crew volume
        addPath('cut', polyD('cut', [
          { z: C.zCrewRear, y: C.cargoY1 },
          { z: C.zCrewRear, y: C.yCrewBottom },
          { z: C.zNoseRear, y: C.yCrewBottom },
          { z: C.zDockRear, y: C.yDock - C.rDock },
          { z: C.zDockFront, y: C.yDock - C.rDock },
          { z: C.zDockFront, y: C.yDock + C.rDock },
          { z: C.zDockRear, y: C.yDock + C.rDock },
          { z: C.zNoseRear, y: C.yCrewTop },
          { z: C.zCrewRear, y: C.yCrewTop }
        ], true), 'bp-med bp-fill');

        // Cockpit
        addPath('cut', polyD('cut', [
          { z: C.cockpitZ0, y: C.cockpitY0 },
          { z: C.cockpitZ1, y: C.cockpitY0 },
          { z: C.cockpitZ1, y: C.cockpitY1 },
          { z: C.cockpitZ0, y: C.cockpitY1 }
        ], true), 'bp-med bp-fill2');

        // Avionics bay
        addRect('cut', { z: C.avionicsZ0, y: C.avionicsY0 }, C.avionicsZ1 - C.avionicsZ0, C.avionicsY1 - C.avionicsY0, 'bp-cut');

        // ECLSS / life support
        addRect('cut', { z: C.eclssZ0, y: C.eclssY0 }, C.eclssZ1 - C.eclssZ0, C.eclssY1 - C.eclssY0, 'bp-cargo');

        // Cargo bay with pallets
        addRect('cut', { z: C.cargoZ0, y: C.cargoY0 }, C.cargoZ1 - C.cargoZ0, C.cargoY1 - C.cargoY0, 'bp-cargo');
        for (let z = C.cargoZ0 + 0.5; z < C.cargoZ1; z += 0.9) {
          addRect('cut', { z, y: C.cargoY0 + 0.2 }, 0.6, 0.35, 'bp-major bp-fill');
        }

        // Internal propellant tanks
        addCircle('cut', { z: C.it1.z, y: C.it1.y }, C.it1.r, 'bp-cut');
        addCircle('cut', { z: C.it2.z, y: C.it2.y }, C.it2.r, 'bp-cut');

        // Engines
        engines('cut');

        // Structural keel
        addLine('cut', { z: C.zPropRear, y: 1.05 }, { z: C.zSvcFront, y: 1.05 }, 'bp-major');

        // Bulkheads
        addLine('cut', { z: C.zCrewRear, y: C.yCrewBottom }, { z: C.zCrewRear, y: C.yCrewTop }, 'bp-hidden');
        addLine('cut', { z: C.zSvcRear, y: C.yFusBottom }, { z: C.zSvcRear, y: C.yPropTop }, 'bp-hidden');

        // External tanks (background)
        externalTanks('cut');
      }

      // ----- Station / grid lines -----
      function stationLines(view) {
        const zs = [-8, -6, -4, -2, 0, 2, 4, 6, 8];
        if (view === 'top') {
          zs.forEach(z => {
            addLine('top', { x: -10.5, z }, { x: 10.5, z }, 'bp-minor');
            addText('top', project('top', { x: -10.2, z })[0], project('top', { x: -10.2, z })[1] + 3, 'STA ' + z, 'bp-minor', 'start');
          });
          addLine('top', { x: -10.5, z: 0 }, { x: 10.5, z: 0 }, 'bp-center');
        } else if (view === 'side' || view === 'cut') {
          zs.forEach(z => {
            addLine(view, { z, y: 0 }, { z, y: view === 'cut' ? 5.0 : 4.8 }, 'bp-minor');
            addText(view, project(view, { z, y: 0 })[0], project(view, { z, y: 0 })[1] + 12, 'STA ' + z, 'bp-minor', 'middle');
          });
          // waterlines
          [1, 2, 3, 4].forEach(y => {
            addLine(view, { z: C.zPropRear - 0.5, y }, { z: C.zDockFront + 0.5, y }, 'bp-minor');
          });
        }
      }

      // ----- View assembly -----
      function buildTop() {
        stationLines('top');
        externalTanks('top');
        solarArrays('top');
        radiators('top');
        landingGear('top');
        antennas('top');
        airlocks('top');
        cargoBay('top');
        fuselageTop();
        dockingPort('top');
        engines('top');
        addText('top', V.top.cx - 10, V.top.cy - C.zDockFront * V.top.s - 25, V.top.label, 'label-text', 'middle');
      }

      function buildSide() {
        stationLines('side');
        landingGear('side');
        externalTanks('side');
        solarArrays('side');
        radiators('side');
        antennas('side');
        cargoBay('side');
        airlocks('side');
        fuselageSide();
        dockingPort('side');
        engines('side');
        cockpitWindows('side');
        addText('side', V.side.cx - 10, V.side.cy - C.yCrewTop * V.side.s - 30, V.side.label, 'label-text', 'middle');
      }

      function buildFront() {
        landingGear('front');
        externalTanks('front');
        solarArrays('front');
        radiators('front');
        antennas('front');
        airlocks('front');
        fuselageFront();
        dockingPort('front');
        engines('front');
        addText('front', V.front.cx, V.front.cy - 5.0 * V.front.s - 20, V.front.label, 'label-text', 'middle');
      }

      function buildRear() {
        // Note: uses front helper set because rear shares x handling via project('rear', -x)
        landingGear('rear');
        externalTanks('rear');
        solarArrays('rear');
        radiators('rear');
        antennas('rear');
        airlocks('rear');
        fuselageRear();
        engines('rear');
        addText('rear', V.rear.cx, V.rear.cy - 4.2 * V.rear.s - 20, V.rear.label, 'label-text', 'middle');
      }

      function buildCutaway() {
        stationLines('cut');
        cutawayInternals();
        // section line indicators in top view
        const aaStart = project('top', { x: 0, z: C.zPropRear - 0.5 });
        const aaEnd = project('top', { x: 0, z: C.zDockFront + 0.3 });
        addPath('top',
          `M${f(aaStart[0] - 4)},${f(aaStart[1])} L${f(aaStart[0] + 4)},${f(aaStart[1])} M${f(aaStart[0])},${f(aaStart[1])} L${f(aaEnd[0])},${f(aaEnd[1])} M${f(aaEnd[0] - 4)},${f(aaEnd[1])} L${f(aaEnd[0] + 4)},${f(aaEnd[1])}`,
          'bp-center');
        addText('top', aaEnd[0] + 8, aaEnd[1] - 6, 'A', 'label-text', 'start');
        addText('top', aaStart[0] + 8, aaStart[1] + 10, 'A', 'label-text', 'start');
        addText('cut', V.cut.cx, V.cut.cy - 5.0 * V.cut.s - 25, V.cut.label, 'label-text', 'middle');
      }

      // ----- Dimensions -----
      function drawDim(view, p1, p2, label, offset) {
        const s1 = project(view, p1);
        const s2 = project(view, p2);
        const dx = s2[0] - s1[0], dy = s2[1] - s1[1];
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const ox = nx * offset, oy = ny * offset;
        const a = [s1[0] + ox, s1[1] + oy];
        const b = [s2[0] + ox, s2[1] + oy];
        const g = groups[view];
        g.appendChild(make('line', { x1: f(s1[0]), y1: f(s1[1]), x2: f(a[0]), y2: f(a[1]), class: 'dim-ext' }));
        g.appendChild(make('line', { x1: f(s2[0]), y1: f(s2[1]), x2: f(b[0]), y2: f(b[1]), class: 'dim-ext' }));
        g.appendChild(make('line', { x1: f(a[0]), y1: f(a[1]), x2: f(b[0]), y2: f(b[1]), class: 'dim-line' }));
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        addText(view, mx, my - 5, label, 'dim-text', 'middle');
      }

      function addDimensions() {
        // Top
        drawDim('top', { x: 0, z: C.zPropRear }, { x: 0, z: C.zDockFront }, '18.2 m', 80);
        drawDim('top', { x: -C.solarXout, z: -6.5 }, { x: C.solarXout, z: -6.5 }, '21.0 m', -40);
        drawDim('top', { x: -C.rSvc, z: 6.5 }, { x: C.rSvc, z: 6.5 }, '4.0 m', 35);

        // Side
        drawDim('side', { z: C.zPropRear, y: 0 }, { z: C.zDockFront, y: 0 }, '18.2 m', -55);
        drawDim('side', { z: C.zDockFront + 1.0, y: 0 }, { z: C.zDockFront + 1.0, y: C.dishY }, '4.8 m', 45);
        drawDim('side', { z: C.zPropRear - 0.8, y: C.yFusBottom }, { z: C.zPropRear - 0.8, y: C.yFusTop }, '3.0 m', -35);

        // Front
        drawDim('front', { x: -C.solarXout, y: -0.5 }, { x: C.solarXout, y: -0.5 }, '21.0 m', -45);
        drawDim('front', { x: C.solarXout + 1.0, y: 0 }, { x: C.solarXout + 1.0, y: C.dishY }, '4.8 m', 40);

        // Rear
        drawDim('rear', { x: -C.rProp, y: 5.0 }, { x: C.rProp, y: 5.0 }, '3.2 m', 25);
        drawDim('rear', { x: C.rProp + 0.8, y: C.yFusBottom }, { x: C.rProp + 0.8, y: C.yPropTop }, '2.1 m', 30);

        // Cutaway
        drawDim('cut', { z: C.zPropRear, y: 0 }, { z: C.zDockFront, y: 0 }, '18.2 m', -50);
        drawDim('cut', { z: C.cargoZ0, y: 1.5 }, { z: C.cargoZ1, y: 1.5 }, 'CARGO 4.0 m', 35);
      }

      // ----- Callouts -----
      function drawCallout(view, anchor, label, dx, dy) {
        const [ax, ay] = project(view, anchor);
        const tx = ax + dx, ty = ay + dy;
        const elbow = [tx, ay];
        const d = `M${f(ax)},${f(ay)} L${f(elbow[0])},${f(elbow[1])} L${f(tx)},${f(ty)}`;
        addPath(view, d, 'callout-line');
        groups[view].appendChild(make('circle', { cx: f(ax), cy: f(ay), r: 2.5, class: 'callout-dot' }));
        const anchorSide = dx < 0 ? 'end' : 'start';
        const textX = dx < 0 ? tx - 4 : tx + 4;
        addText(view, textX, ty + 3, label, 'callout-text', anchorSide);
      }

      function addCallouts() {
        // Top
        drawCallout('top', { x: 0, z: 9.2 }, 'DOCKING PORT', 45, -30);
        drawCallout('top', { x: 0, z: 7.0 }, 'COCKPIT / AVIONICS', 50, -20);
        drawCallout('top', { x: 0, z: -1 }, 'CARGO BAY', 55, 5);
        drawCallout('top', { x: 3.4, z: -3 }, 'EXT. PROPELLANT TANKS', 45, 25);
        drawCallout('top', { x: 0, z: -8.5 }, 'MAIN ENGINES', 55, 35);
        drawCallout('top', { x: 7.0, z: 0.75 }, 'SOLAR ARRAYS', 50, -15);
        drawCallout('top', { x: 5.0, z: -1.5 }, 'RADIATORS', 45, 18);
        drawCallout('top', { x: 0, z: 2.0 }, 'ANTENNA ARRAY', -70, -20);
        drawCallout('top', { x: 2.2, z: -2 }, 'LANDING GEAR', 40, 40);
        drawCallout('top', { x: 1.9, z: 3.0 }, 'AIRLOCK', 50, -8);

        // Side
        drawCallout('side', { z: 9.2, y: 2.6 }, 'DOCKING PORT', 55, -25);
        drawCallout('side', { z: 7.2, y: 3.2 }, 'COCKPIT', 60, -20);
        drawCallout('side', { z: -1, y: 2.4 }, 'CARGO BAY DOORS', 65, 0);
        drawCallout('side', { z: -3, y: 2.2 }, 'EXT. TANKS', 65, 18);
        drawCallout('side', { z: -8.5, y: 1.2 }, 'MAIN ENGINES', 60, 35);
        drawCallout('side', { z: 0.75, y: 4.2 }, 'SOLAR ARRAY', 60, -35);
        drawCallout('side', { z: -1.5, y: 3.0 }, 'RADIATORS', 60, -12);
        drawCallout('side', { z: -2, y: 0.4 }, 'LANDING GEAR', 55, 40);
        drawCallout('side', { z: 2.0, y: 4.8 }, 'HIGH-GAIN ANTENNA', -70, -25);
        drawCallout('side', { z: 3.2, y: 2.4 }, 'AIRLOCK', -60, -5);

        // Front
        drawCallout('front', { x: 0, y: 3.8 }, 'DOCKING PORT', 0, -45);
        drawCallout('front', { x: 1.8, y: 1.2 }, 'ENGINES', 40, 25);
        drawCallout('front', { x: 3.4, y: 2.2 }, 'EXT. TANKS', 50, 15);
        drawCallout('front', { x: 7.0, y: 4.2 }, 'SOLAR ARRAY', 55, -10);
        drawCallout('front', { x: 5.0, y: 3.0 }, 'RADIATORS', 45, 22);
        drawCallout('front', { x: 2.2, y: 0.3 }, 'LANDING GEAR', 35, 40);
        drawCallout('front', { x: 0, y: 5.0 }, 'ANTENNA', 0, -55);
        drawCallout('front', { x: 1.9, y: 2.4 }, 'AIRLOCK', 45, -15);

        // Rear
        drawCallout('rear', { x: 1.8, y: 1.2 }, 'MAIN ENGINES', 40, 25);
        drawCallout('rear', { x: 3.4, y: 2.2 }, 'EXT. TANKS', 50, 15);
        drawCallout('rear', { x: 7.0, y: 4.2 }, 'SOLAR ARRAY', 55, -10);
        drawCallout('rear', { x: 5.0, y: 3.0 }, 'RADIATORS', 45, 22);
        drawCallout('rear', { x: 2.2, y: 0.3 }, 'LANDING GEAR', 35, 40);
        drawCallout('rear', { x: 0, y: 4.8 }, 'ANTENNA', 0, -55);

        // Cutaway
        drawCallout('cut', { z: 7.2, y: 3.2 }, 'COCKPIT', 60, -25);
        drawCallout('cut', { z: 6.6, y: 1.8 }, 'AVIONICS BAY', 65, 10);
        drawCallout('cut', { z: 5.0, y: 2.5 }, 'LIFE SUPPORT (ECLSS)', -75, -5);
        drawCallout('cut', { z: 3.0, y: 3.0 }, 'CREW MODULE', -70, -10);
        drawCallout('cut', { z: -1, y: 2.4 }, 'CARGO BAY', 65, 0);
        drawCallout('cut', { z: -6.9, y: 2.4 }, 'PROPELLANT TANKS', 65, 20);
        drawCallout('cut', { z: -8.5, y: 1.2 }, 'MAIN ENGINES', 60, 35);
        drawCallout('cut', { z: -5.0, y: 1.05 }, 'STRUCTURAL KEEL', -70, 20);
      }

      // ----- Title block & scale -----
      function titleBlock() {
        const g = make('g', { id: 'title-block' });
        const x = 1180, y = 920, w = 380, h = 140;
        g.appendChild(make('rect', { x, y, width: w, height: h, class: 'title-block' }));
        // internal grid lines
        g.appendChild(make('line', { x1: x, y1: y + 35, x2: x + w, y2: y + 35, stroke: '#06b6d4', 'stroke-width': 0.5, opacity: 0.5 }));
        g.appendChild(make('line', { x1: x + 140, y1: y, x2: x + 140, y2: y + h, stroke: '#06b6d4', 'stroke-width': 0.5, opacity: 0.5 }));
        g.appendChild(make('line', { x1: x + 260, y1: y + 35, x2: x + 260, y2: y + h, stroke: '#06b6d4', 'stroke-width': 0.5, opacity: 0.5 }));

        const txt = (tx, ty, str, cls = 'title-small', anchor = 'start') => {
          const t = make('text', { x: tx, y: ty, class: cls, 'text-anchor': anchor });
          t.textContent = str;
          g.appendChild(t);
        };
        txt(x + 8, y + 22, 'SC-X1 ARES ORBITAL TRANSPORT', 'title-text');
        txt(x + 8, y + 50, 'PROJECT');
        txt(x + 8, y + 68, 'Ares Heavy Lift / Cis-Lunar');
        txt(x + 8, y + 90, 'DRAWN BY');
        txt(x + 8, y + 108, 'Aero-Design Automation');
        txt(x + 8, y + 128, 'DATE: 2026-05-18   REV: 1.2');

        txt(x + 148, y + 50, 'SCALE');
        txt(x + 148, y + 68, '1 : 100');
        txt(x + 148, y + 90, 'SHEET');
        txt(x + 148, y + 108, '1 OF 1');
        txt(x + 148, y + 128, 'PROJECTION: ORTHO');

        txt(x + 268, y + 50, 'MATERIAL');
        txt(x + 268, y + 68, 'Al-Li 2195 / CFRP');
        txt(x + 268, y + 90, 'UNITS');
        txt(x + 268, y + 108, 'METERS');
        txt(x + 268, y + 128, 'TOLERANCES ±0.05');

        // graphic scale
        const sx = x + 20, sy = y + h - 20;
        const seg = 50; // 5 m at 10 px/m
        g.appendChild(make('line', { x1: sx, y1: sy, x2: sx + seg, y2: sy, stroke: '#22d3ee', 'stroke-width': 2 }));
        for (let i = 0; i <= 5; i++) {
          const xx = sx + (seg / 5) * i;
          g.appendChild(make('line', { x1: xx, y1: sy - 4, x2: xx, y2: sy + 4, stroke: '#22d3ee', 'stroke-width': 1.5 }));
          const t = make('text', { x: xx, y: sy + 14, class: 'title-small', 'text-anchor': 'middle' });
          t.textContent = i + 'm';
          g.appendChild(t);
        }
        txt(sx, sy - 8, 'GRAPHIC SCALE');

        viewsRoot.appendChild(g);
      }

      // ----- Execute -----
      buildTop();
      buildSide();
      buildFront();
      buildRear();
      buildCutaway();
      addDimensions();
      addCallouts();
      titleBlock();

      // Frame boxes around views (for visual separation)
      for (const k of Object.keys(V)) {
        const bbox = groups[k].getBBox();
        const pad = 14;
        groups[k].insertBefore(make('rect', {
          x: bbox.x - pad, y: bbox.y - pad,
          width: bbox.width + pad * 2, height: bbox.height + pad * 2,
          fill: 'none', stroke: '#06b6d4', 'stroke-width': 0.5, opacity: 0.35, 'stroke-dasharray': '6 4'
        }), groups[k].firstChild);
      }
    });
  </script>
</body>
