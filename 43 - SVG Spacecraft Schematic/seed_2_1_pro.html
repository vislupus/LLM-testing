<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2600 1900" width="100%" height="100%"
     font-family="'Courier New', 'Consolas', monospace">
<title>ICTV-7 "Aurora" — Interplanetary Crew Transfer Vehicle · General Arrangement Blueprint</title>

<!-- ============================================================= -->
<!-- DEFINITIONS                                                     -->
<!-- ============================================================= -->
<defs>
  <!-- Blueprint background gradient -->
  <linearGradient id="blueprintBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#0d2f52"/>
    <stop offset="100%" stop-color="#071e38"/>
  </linearGradient>

  <!-- Grid pattern -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1b4a78" stroke-width="0.4"/>
  </pattern>
  <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#275b8d" stroke-width="0.8"/>
  </pattern>

  <!-- Hatchure for section cuts -->
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#ffd24a" fill-opacity="0.12"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#ffd24a" stroke-width="1"/>
  </pattern>
  <pattern id="hatchDark" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#ffd24a" stroke-width="0.9" stroke-opacity="0.55"/>
  </pattern>

  <!-- Thermal blanket pattern -->
  <pattern id="mlibutton" patternUnits="userSpaceOnUse" width="14" height="14">
    <rect width="14" height="14" fill="#3a6b94" fill-opacity="0.4"/>
    <circle cx="7" cy="7" r="2.3" fill="#79b8e3" fill-opacity="0.7"/>
  </pattern>

  <!-- Arrowhead for dimensions -->
  <marker id="dimArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7ad6ff"/>
  </marker>
  <marker id="dimArrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto">
    <path d="M10,0 L0,5 L10,10 z" fill="#7ad6ff"/>
  </marker>
  <!-- Leader dot -->
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
    <circle cx="5" cy="5" r="4" fill="#ffd24a"/>
  </marker>
  <!-- Callout arrow for balloons -->
  <marker id="callout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M0,2 L10,5 L0,8 z" fill="#ffd24a"/>
  </marker>

  <!-- Solar cell pattern -->
  <pattern id="solarCells" patternUnits="userSpaceOnUse" width="18" height="24">
    <rect width="18" height="24" fill="#16344f"/>
    <rect x="1" y="1" width="7" height="10" fill="#2f6a9a" stroke="#0a1e31" stroke-width="0.5"/>
    <rect x="10" y="1" width="7" height="10" fill="#2f6a9a" stroke="#0a1e31" stroke-width="0.5"/>
    <rect x="1" y="13" width="7" height="10" fill="#2f6a9a" stroke="#0a1e31" stroke-width="0.5"/>
    <rect x="10" y="13" width="7" height="10" fill="#2f6a9a" stroke="#0a1e31" stroke-width="0.5"/>
  </pattern>

  <!-- Radiator honeycomb -->
  <pattern id="honeycomb" patternUnits="userSpaceOnUse" width="18" height="21">
    <rect width="18" height="21" fill="#1d3e5b"/>
    <path d="M0,0 L18,0 L18,21 L0,21 z" fill="none" stroke="#4a7fa8" stroke-width="0.4"/>
    <path d="M9,1.5 L16,5.5 L16,14 L9,18 L2,14 L2,5.5 z" fill="none" stroke="#6498c1" stroke-width="0.5"/>
  </pattern>

  <!-- Filter for subtle glow on key lines -->
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- ============================================================= -->
<!-- BACKGROUND + GRID                                               -->
<!-- ============================================================= -->
<rect width="2600" height="1900" fill="url(#blueprintBg)"/>
<rect width="2600" height="1900" fill="url(#grid)"/>
<rect width="2600" height="1900" fill="url(#gridMajor)"/>

<!-- Outer drawing border -->
<rect x="30" y="30" width="2540" height="1840" fill="none" stroke="#7ad6ff" stroke-width="2"/>
<rect x="45" y="45" width="2510" height="1810" fill="none" stroke="#7ad6ff" stroke-width="0.6"/>

<!-- ============================================================= -->
<!-- TITLE BLOCK (lower right)                                       -->
<!-- ============================================================= -->
<g id="titleblock">
  <!-- Outer frame of title block -->
  <rect x="1820" y="1680" width="720" height="160" fill="#071e38" stroke="#7ad6ff" stroke-width="1.5"/>

  <!-- Subdivisions -->
  <line x1="1820" y1="1740" x2="2540" y2="1740" stroke="#7ad6ff" stroke-width="0.8"/>
  <line x1="1820" y1="1800" x2="2540" y2="1800" stroke="#7ad6ff" stroke-width="0.8"/>
  <line x1="2020" y1="1740" x2="2020" y2="1840" stroke="#7ad6ff" stroke-width="0.8"/>
  <line x1="2200" y1="1740" x2="2200" y2="1840" stroke="#7ad6ff" stroke-width="0.8"/>
  <line x1="2370" y1="1740" x2="2370" y2="1840" stroke="#7ad6ff" stroke-width="0.8"/>
  <line x1="1820" y1="1710" x2="2540" y2="1710" stroke="#7ad6ff" stroke-width="0.5"/>

  <!-- Company / authority line -->
  <text x="1835" y="1700" font-size="13" fill="#ffd24a" letter-spacing="2">AURORA AEROSPACE CONSORTIUM · LUNAR DYNAMICS OFFICE</text>

  <!-- Title -->
  <text x="1835" y="1733" font-size="22" fill="#ffffff" font-weight="700" letter-spacing="2">INTERPLANETARY CREW TRANSFER VEHICLE</text>
  <text x="1835" y="1762" font-size="16" fill="#7ad6ff" letter-spacing="3">GENERAL ARRANGEMENT · VIEWS &amp; INTERNAL SECTIONS</text>

  <!-- Metadata cells -->
  <g font-size="11" fill="#b7dcf0">
    <text x="1830" y="1788">DWG NO.</text>
    <text x="1830" y="1828" font-size="14" fill="#ffffff" font-weight="700">ICTV-7-GA-001</text>

    <text x="2030" y="1788">REV.</text>
    <text x="2030" y="1828" font-size="14" fill="#ffffff" font-weight="700">C</text>

    <text x="2210" y="1788">SCALE</text>
    <text x="2210" y="1828" font-size="14" fill="#ffffff" font-weight="700">1:200</text>

    <text x="2380" y="1788">SHEET</text>
    <text x="2380" y="1828" font-size="14" fill="#ffffff" font-weight="700">1 OF 1</text>
  </g>

  <!-- Bottom row: approvals / date -->
  <g font-size="10" fill="#8fb4cc">
    <text x="1830" y="1855">DESIGNED: J. M. ORTEGA    CHECKED: S. K. RAVI    APPROVED: DR. H. LIN</text>
    <text x="1830" y="1870">DATE: 2147-03-12   MATERIAL: SEE NOTES   UNITS: METERS (m)   THIRD-ANGLE PROJECTION</text>
    <!-- Third-angle projection symbol -->
    <g transform="translate(2480 1750)" stroke="#7ad6ff" stroke-width="0.8" fill="none">
      <circle cx="0" cy="0" r="14"/>
      <circle cx="0" cy="0" r="6" fill="#7ad6ff"/>
      <path d="M-22,0 L-16,0 M16,0 L22,0"/>
      <path d="M-30,-6 L-30,6 L-24,6 L-24,-6 z"/>
      <path d="M24,-12 L24,12 L36,6 L36,-6 z"/>
    </g>
    <text x="2455" y="1855" font-size="9" fill="#8fb4cc">3rd ANGLE</text>
  </g>
</g>

<!-- ============================================================= -->
<!-- SHARED STYLES                                                   -->
<!-- ============================================================= -->
<style>
  <![CDATA[
    .ship         { stroke: #ffffff; stroke-width: 1.8; fill: #18395a; }
    .shipInner    { stroke: #9fc6e5; stroke-width: 1.0; fill: none; }
    .shipDim      { stroke: #b7dcf0; stroke-width: 0.9; fill: none; }
    .hull         { stroke: #ffffff; stroke-width: 2; fill: #1a3e5f; }
    .hullEdge     { stroke: #ffffff; stroke-width: 1.2; fill: none; }
    .hidden       { stroke: #7ad6ff; stroke-width: 0.8; stroke-dasharray: 5 4; fill: none; }
    .thin         { stroke: #cde8f7; stroke-width: 0.7; fill: none; }
    .panel        { fill: #0e2f50; stroke: #7ad6ff; stroke-width: 1.2; }
    .accent       { fill: #ffd24a; }
    .accentStroke { stroke: #ffd24a; stroke-width: 1.4; fill: none; }
    .label        { fill: #e8f5ff; font-size: 13px; letter-spacing: 0.5; }
    .labelSm      { fill: #b7dcf0; font-size: 11px; letter-spacing: 0.3; }
    .viewTitle    { fill: #ffd24a; font-size: 16px; letter-spacing: 2; font-weight: 700; }
    .sectionLtr   { fill: #ffd24a; font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace; }
    .dimTxt       { fill: #7ad6ff; font-size: 11px; text-anchor: middle; }
    .dimTxtL      { fill: #7ad6ff; font-size: 11px; }
    .dimLine      { stroke: #7ad6ff; stroke-width: 0.8; fill: none; }
    .extLine      { stroke: #7ad6ff; stroke-width: 0.5; fill: none; stroke-dasharray: 0; }
    .sectionLine  { stroke: #ffd24a; stroke-width: 1.6; fill: none; stroke-dasharray: 14 6; }
    .centerLine   { stroke: #ffd24a; stroke-width: 0.7; stroke-dasharray: 16 3 3 3; fill: none; }
    .cut          { stroke: #ffd24a; stroke-width: 1.2; fill: url(#hatch); }
    .cutDark      { stroke: #ffd24a; stroke-width: 1.0; fill: url(#hatchDark); }
  ]]>
</style>

<!-- ============================================================= -->
<!-- HELPERS: dimension line                                        -->
<!-- ============================================================= -->
<g id="dimH">
  <!-- horizontal dimension: pass x1,x2,y -->
</g>

<!-- ============================================================= -->
<!-- SIDE (ELEVATION) VIEW — UPPER LEFT                              -->
<!-- ============================================================= -->
<g id="side-view" transform="translate(120 220)">
  <!-- View frame -->
  <rect x="-30" y="-80" width="1320" height="460" fill="#0c2744" stroke="#275b8d" stroke-width="1"/>
  <text x="-25" y="-55" class="viewTitle">VIEW A — STARBOARD ELEVATION</text>
  <text x="-25" y="-38" class="labelSm">LOOKING TO PORT · DIMENSIONS IN METERS · REF. AXIS 0:00:00</text>

  <!-- Center line (fuselage axis) -->
  <line x1="-20" y1="190" x2="1260" y2="190" class="centerLine"/>
  <text x="1270" y="193" class="labelSm" fill="#ffd24a">C/L</text>

  <!-- === FUSELAGE PROFILE === -->
  <!-- Nose cone (ogive) -->
  <path class="hull" d="
    M 0,190
    L 90,165
    C 130,155 160,155 200,160
    L 200,220
    C 160,225 130,225 90,215
    L 0,190
    Z"/>
  <!-- Cockpit windows (3 panes on side) -->
  <g stroke="#7ad6ff" stroke-width="1.2" fill="#4a90c0" fill-opacity="0.6">
    <path d="M 110,167 Q 128,162 150,162 L 150,178 Q 128,178 110,173 Z"/>
    <path d="M 152,161 Q 170,160 182,163 L 182,182 Q 170,181 152,180 Z"/>
  </g>
  <!-- Docking port collar (front, nose) -->
  <path class="hull" d="M -30,178 L 0,175 L 0,205 L -30,202 Z"/>
  <circle cx="-32" cy="190" r="13" class="hull"/>
  <circle cx="-32" cy="190" r="8" class="hullEdge"/>
  <circle cx="-32" cy="190" r="3" fill="#ffd24a"/>

  <!-- Main cylindrical fuselage -->
  <rect x="200" y="152" width="820" height="76" class="hull"/>
  <!-- panel lines -->
  <g class="thin">
    <line x1="290" y1="152" x2="290" y2="228"/>
    <line x1="430" y1="152" x2="430" y2="228"/>
    <line x1="640" y1="152" x2="640" y2="228"/>
    <line x1="850" y1="152" x2="850" y2="228"/>
    <line x1="960" y1="152" x2="960" y2="228"/>
    <!-- circumferential seams -->
    <line x1="200" y1="170" x2="1020" y2="170"/>
    <line x1="200" y1="210" x2="1020" y2="210"/>
  </g>

  <!-- Crew module windows (ring of 6 small rectangular windows) -->
  <g fill="#4a90c0" fill-opacity="0.7" stroke="#7ad6ff" stroke-width="0.8">
    <rect x="230" y="160" width="18" height="10" rx="2"/>
    <rect x="258" y="159" width="18" height="11" rx="2"/>
    <rect x="286" y="160" width="18" height="10" rx="2"/>
  </g>
  <!-- Airlock outline (starboard side, mid-fwd) -->
  <g class="hullEdge">
    <rect x="350" y="172" width="46" height="36" rx="4"/>
    <circle cx="385" cy="190" r="2.2" fill="#ffd24a"/>
    <path d="M 350 180 L 396 180 M 350 200 L 396 200"/>
  </g>

  <!-- Cargo bay doors (2 long doors on upper and lower) -->
  <g class="accentStroke">
    <path d="M 470 152 L 470 142 L 820 142 L 820 152"/>
    <path d="M 470 228 L 470 238 L 820 238 L 820 228"/>
    <line x1="550" y1="142" x2="550" y2="152"/>
    <line x1="640" y1="142" x2="640" y2="152"/>
    <line x1="740" y1="142" x2="740" y2="152"/>
    <line x1="550" y1="228" x2="550" y2="238"/>
    <line x1="640" y1="228" x2="640" y2="238"/>
    <line x1="740" y1="228" x2="740" y2="238"/>
  </g>
  <!-- Cargo door hinges -->
  <g fill="#7ad6ff" stroke="#ffffff" stroke-width="0.6">
    <rect x="470" y="138" width="8" height="10" rx="1"/>
    <rect x="820" y="138" width="8" height="10" rx="1"/>
    <rect x="470" y="232" width="8" height="10" rx="1"/>
    <rect x="820" y="232" width="8" height="10" rx="1"/>
  </g>

  <!-- Radiator panel (retracted along spine, upper) -->
  <g>
    <rect x="860" y="138" width="140" height="14" rx="2" fill="url(#honeycomb)" stroke="#7ad6ff" stroke-width="1"/>
    <line x1="860" y1="145" x2="1000" y2="145" class="thin"/>
    <!-- radiator struts -->
    <line x1="875" y1="152" x2="875" y2="148" class="thin"/>
    <line x1="930" y1="152" x2="930" y2="148" class="thin"/>
    <line x1="985" y1="152" x2="985" y2="148" class="thin"/>
  </g>
  <g>
    <rect x="860" y="228" width="140" height="14" rx="2" fill="url(#honeycomb)" stroke="#7ad6ff" stroke-width="1"/>
    <line x1="860" y1="235" x2="1000" y2="235" class="thin"/>
  </g>

  <!-- Service tunnel ring / propellant feed (narrower) -->
  <rect x="1020" y="156" width="50" height="68" class="hull"/>
  <g class="thin">
    <line x1="1035" y1="156" x2="1035" y2="224"/>
    <line x1="1055" y1="156" x2="1055" y2="224"/>
  </g>

  <!-- Engine bells (4 main engines, 2 visible side by side top/bottom? In side view 2 are visible; stagger slightly) -->

    <!-- upper visible -->
    <path d="M 1070 160 L 1130 154 L 1180 135 L 1210 130 L 1230 135 L 1230 160 L 1180 168 L 1130 166 Z" fill="#1a3e5f"/>
    <!-- lower visible -->
    <path d="M 1070 220 L 1130 226 L 1180 245 L 1210 250 L 1230 245 L 1230 220 L 1180 212 L 1130 214 Z" fill="#1a3e5f"/>
  </g>
  <!-- Nozzle inner cone (regeneratively cooled) -->
  <g stroke="#7ad6ff" stroke-width="1.0" fill="#0a2138">
    <path d="M 1130 158 L 1190 144 L 1225 138 L 1225 158 L 1190 164 Z"/>
    <path d="M 1130 222 L 1190 236 L 1225 242 L 1225 222 L 1190 216 Z"/>
  </g>
  <!-- Cooling channels -->
  <g stroke="#ffd24a" stroke-width="0.6" opacity="0.75">
    <path d="M 1140 158 L 1140 168" />
    <path d="M 1160 153 L 1160 169" />
    <path d="M 1180 147 L 1180 171" />
    <path d="M 1140 222 L 1140 212" />
    <path d="M 1160 227 L 1160 211" />
    <path d="M 1180 233 L 1180 209" />
  </g>
  <!-- Gimbal joint (gimbal ring) -->
  <g stroke="#7ad6ff" stroke-width="1" fill="none">
    <ellipse cx="1085" cy="190" rx="28" ry="34"/>
  </g>

  <!-- RCS thruster quads (blocks on forward & aft fuselage) -->
  <g fill="#2a5b85" stroke="#ffffff" stroke-width="0.9">
    <!-- forward -->
    <rect x="210" y="140" width="12" height="12" rx="1"/>
    <rect x="210" y="228" width="12" height="12" rx="1"/>
    <!-- aft -->
    <rect x="1000" y="140" width="12" height="12" rx="1"/>
    <rect x="1000" y="228" width="12" height="12" rx="1"/>
  </g>
  <g fill="#ffd24a">
    <circle cx="216" cy="146" r="1.5"/>
    <circle cx="1006" cy="146" r="1.5"/>
    <circle cx="216" cy="234" r="1.5"/>
    <circle cx="1006" cy="234" r="1.5"/>
  </g>

  <!-- Landing gear (port & starboard, shown deployed) -->
  <g stroke="#ffffff" stroke-width="1.6" fill="#1a3e5f">
    <!-- forward strut -->
    <path d="M 300 228 L 295 280 L 330 295 L 340 295 L 340 282 L 312 272 L 315 228 Z"/>

  </g>
  <g stroke="#7ad6ff" stroke-width="0.6" fill="none">
    <line x1="308" y1="248" x2="322" y2="280"/>
    <line x1="890" y1="255" x2="904" y2="300"/>
  </g>

  <!-- High-gain antenna (dorsal mount) -->
  <g stroke="#ffffff" stroke-width="1.2" fill="#2a5b85">
    <rect x="640" y="130" width="6" height="24"/>
    <path d="M 618 128 Q 643 108 668 128 Q 643 118 618 128 Z"/>
    <circle cx="643" cy="118" r="2.5" fill="#ffd24a"/>
  </g>
  <!-- Low-gain whip antennas -->
  <g stroke="#ffffff" stroke-width="0.9" fill="none">
    <line x1="220" y1="152" x2="215" y2="105"/>
    <line x1="1010" y1="152" x2="1020" y2="110"/>
    <circle cx="215" cy="105" r="2" fill="#ffd24a"/>
    <circle cx="1020" cy="110" r="2" fill="#ffd24a"/>
  </g>

  <!-- MLI insulation blanket texture (subtle rectangles) on upper/lower panels -->
  <rect x="300" y="152" width="40" height="18" fill="url(#mlibutton)" opacity="0.4"/>
  <rect x="900" y="210" width="60" height="18" fill="url(#mlibutton)" opacity="0.4"/>

  <!-- Solar array (stowed along spine? In side view we'll show deployed, angled up) -->

    <!-- mast -->
    <line x1="430" y1="152" x2="380" y2="20"/>
    <line x1="430" y1="228" x2="380" y2="360"/>

    <line x1="380" y1="360" x2="380" y2="380" stroke-width="1.5"/>

    <circle cx="250" cy="-10" r="1"/>
    <circle cx="370" cy="-10" r="1"/>
    <circle cx="250" cy="370" r="1"/>
    <circle cx="370" cy="370" r="1"/>
  </g>

  <!-- ===================== DIMENSIONS (side view) ===================== -->
  <!-- Overall length -->
  <g>
    <line class="extLine" x1="-32" y1="50" x2="-32" y2="390"/>
    <line class="extLine" x1="1230" y1="50" x2="1230" y2="390"/>

    <line class="extLine" x1="1290" y1="152" x2="1290" y2="228"/>
    <line class="dimLine" x1="1275" y1="152" x2="1275" y2="228" marker-start="url(#dimArrowStart)" marker-end="url(#dimArrow)"/>

    <text class="dimTxt" x="1310" y="210" text-anchor="start" fill="#8fb4cc">BARREL DIA</text>
  </g>

  <!-- CALLOUTS (balloon labels with arrows pointing to features) -->
