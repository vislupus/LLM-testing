<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: #f4f4f4; font-family: 'Courier New', Courier, monospace;">
  <defs>
    <!-- Arrowhead Marker for Dimensions -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#333" />
    </marker>
    
    <!-- Crosshair Marker -->
    <marker id="crosshair" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <path d="M 0 5 L 10 5 M 5 0 L 5 10" stroke="#333" stroke-width="0.5" />
    </marker>

    <!-- Hatching Pattern for Section Cuts -->
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ccc" stroke-width="0.5" />
    </pattern>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5" />
    </pattern>
    
    <!-- Sub-grid -->
    <pattern id="subgrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d0d0d0" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f0f0" />
  <rect width="100%" height="100%" fill="url(#subgrid)" />

  <!-- Border -->
  <rect x="10" y="10" width="1180" height="780" fill="none" stroke="#333" stroke-width="2" />
  <rect x="15" y="15" width="1170" height="770" fill="none" stroke="#333" stroke-width="1" />

  <!-- Title Block -->
  <g transform="translate(920, 700)">
    <rect x="0" y="0" width="260" height="85" fill="white" stroke="#333" stroke-width="1" />
    <line x1="0" y1="25" x2="260" y2="25" stroke="#333" stroke-width="1" />
    <line x1="0" y1="50" x2="260" y2="50" stroke="#333" stroke-width="1" />
    <line x1="130" y1="25" x2="130" y2="85" stroke="#333" stroke-width="1" />
    
    <text x="10" y="18" font-size="14" font-weight="bold" fill="#333">PROJECT ORION-X</text>
    <text x="140" y="18" font-size="10" fill="#333">DWG NO: 884-X1</text>
    
    <text x="10" y="40" font-size="10" fill="#333">SUBJECT: ORBITAL LANDER</text>
    <text x="140" y="40" font-size="10" fill="#333">REV: A</text>
    
    <text x="10" y="65" font-size="10" fill="#333">SCALE: 1:50</text>
    <text x="140" y="65" font-size="10" fill="#333">DATE: 2023-10-27</text>
    
    <text x="10" y="80" font-size="10" fill="#333">UNITS: MM</text>
    <text x="140" y="80" font-size="10" fill="#333">APPROVED: ENG. LEAD</text>
  </g>

  <!-- Main Schematic Area -->
  <g transform="translate(40, 40)">

    <!-- VIEW 1: SIDE ELEVATION (Profile) -->
    <g transform="translate(50, 50)">
      <text x="0" y="-20" font-size="14" font-weight="bold">SIDE ELEVATION</text>
      
      <!-- Solar Array -->
      <path d="M -120 120 L -250 120 L -250 250 L -120 250 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M -110 130 L -240 130 L -240 240 L -110 240 Z" fill="none" stroke="#333" stroke-width="0.5" />
      <line x1="-120" y1="185" x2="-250" y2="185" stroke="#333" stroke-width="1" />
      <text x="-280" y="185" font-size="10">SOLAR ARRAY</text>
      <line x1="-250" y1="185" x2="-120" y2="185" stroke="#333" stroke-width="0.5" stroke-dasharray="4,2" /> <!-- Callout -->

      <!-- Main Body / Cargo Bay -->
      <path d="M -80 100 L 80 100 L 80 300 L -80 300 Z" fill="none" stroke="#333" stroke-width="2" />
      <path d="M -75 105 L 75 105 L 75 295 L -75 295 Z" fill="none" stroke="#333" stroke-width="1" />
      <text x="-100" y="200" font-size="10">PRESSURIZED CARGO BAY</text>
      <line x1="-80" y1="200" x2="-100" y2="200" stroke="#333" stroke-width="0.5" />

      <!-- Crew Module (Capsule) -->
      <path d="M -60 100 C -60 30, 60 30, 60 100 Z" fill="none" stroke="#333" stroke-width="2" />
      <path d="M -55 100 C -55 35, 55 35, 55 100 Z" fill="none" stroke="#333" stroke-width="1" />
      <!-- Cockpit Windows -->
      <path d="M -30 60 L 30 60 L 20 80 L -20 80 Z" fill="#eef" stroke="#333" stroke-width="1" />
      <text x="80" y="60" font-size="10">FORWARD COCKPIT</text>
      <line x1="30" y1="70" x2="70" y2="70" stroke="#333" stroke-width="0.5" />

      <!-- Airlocks -->
      <rect x="50" y="110" width="20" height="40" rx="5" fill="none" stroke="#333" stroke-width="1" />
      <text x="100" y="130" font-size="10">TWIN AIRLOCKS</text>
      <line x1="70" y1="130" x2="90" y2="130" stroke="#333" stroke-width="0.5" />

      <!-- Radiators -->
      <path d="M -90 300 L -90 380 L -70 380 L -70 300 Z" fill="url(#hatch)" stroke="#333" stroke-width="1" />
      <path d="M 70 300 L 70 380 L 90 380 L 90 300 Z" fill="url(#hatch)" stroke="#333" stroke-width="1" />
      <line x1="-90" y1="340" x2="-120" y2="340" stroke="#333" stroke-width="0.5" />
      <text x="-180" y="340" font-size="10">PANEL RADIATORS</text>

      <!-- Landing Gear -->
      <path d="M -60 300 L -100 400 L -80 400 L -40 300 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M 60 300 L 100 400 L 80 400 L 40 300 Z" fill="none" stroke="#333" stroke-width="1" />
      <line x1="-100" y1="400" x2="-80" y2="400" stroke="#333" stroke-width="2" />
      <line x1="80" y1="400" x2="100" y2="400" stroke="#333" stroke-width="2" />
      <text x="120" y="380" font-size="10">TRI-LEG LANDING GEAR</text>
      <line x1="100" y1="360" x2="110" y2="360" stroke="#333" stroke-width="0.5" />

      <!-- Main Engines (Side profile) -->
      <path d="M -30 300 L 30 300 L 40 340 L -40 340 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M -20 340 L -25 380 L 25 380 L 20 340 Z" fill="none" stroke="#333" stroke-width="1" />
      
      <!-- Centerline -->
      <line x1="0" y1="0" x2="0" y2="450" stroke="#333" stroke-width="0.5" stroke-dasharray="10,5,2,5" />

      <!-- Dimensions -->
      <line x1="100" y1="0" x2="100" y2="380" stroke="#333" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line x1="80" y1="0" x2="120" y2="0" stroke="#333" stroke-width="0.5" />
      <line x1="80" y1="380" x2="120" y2="380" stroke="#333" stroke-width="0.5" />
      <text x="105" y="190" font-size="10" transform="rotate(-90, 105, 190)">H: 12.5m</text>
    </g>

    <!-- VIEW 2: CUTAWAY SECTION (A-A) -->
    <g transform="translate(450, 50)">
      <text x="0" y="-20" font-size="14" font-weight="bold">SECTION A-A (CUTAWAY)</text>
      
      <!-- Outer Shell (Cut) -->
      <path d="M -80 100 L 80 100 L 80 300 L -80 300 Z" fill="url(#hatch)" stroke="#333" stroke-width="2" />
      <path d="M -60 100 C -60 30, 60 30, 60 100 Z" fill="url(#hatch)" stroke="#333" stroke-width="2" />
      
      <!-- Internal Rack Structures -->
      <!-- Life Support -->
      <rect x="-60" y="150" width="120" height="40" fill="none" stroke="#333" stroke-width="1" />
      <circle cx="-30" cy="170" r="10" fill="none" stroke="#333" stroke-width="1" />
      <circle cx="30" cy="170" r="10" fill="none" stroke="#333" stroke-width="1" />
      <text x="100" y="170" font-size="10">LIFE-SUPPORT MODULE</text>
      <line x1="60" y1="170" x2="90" y2="170" stroke="#333" stroke-width="0.5" />

      <!-- Avionics -->
      <rect x="-50" y="220" width="100" height="60" fill="none" stroke="#333" stroke-width="1" />
      <line x1="-50" y1="240" x2="50" y2="240" stroke="#333" stroke-width="1" />
      <line x1="-50" y1="260" x2="50" y2="260" stroke="#333" stroke-width="1" />
      <text x="100" y="250" font-size="10">AVIONICS RACK</text>
      <line x1="50" y1="250" x2="90" y2="250" stroke="#333" stroke-width="0.5" />

      <!-- Plumbing/Fluids -->
      <path d="M -20 100 L -20 300" fill="none" stroke="#900" stroke-width="3" /> <!-- Fuel line -->
      <path d="M 20 100 L 20 300" fill="none" stroke="#900" stroke-width="3" /> <!-- Ox line -->
      <text x="-80" y="180" font-size="8" fill="#900">OXIDIZER</text>
      <text x="20" y="180" font-size="8" fill="#900">FUEL</text>

      <!-- Antenna Mast -->
      <line x1="0" y1="30" x2="0" y2="-20" stroke="#333" stroke-width="2" />
      <path d="M -15 -20 L 15 -20 L 10 -40 L -10 -40 Z" fill="none" stroke="#333" stroke-width="1" />
      <text x="20" y="-10" font-size="10">HIGH-GAIN ANTENNA</text>
      <line x1="15" y1="-20" x2="20" y2="-20" stroke="#333" stroke-width="0.5" />

      <!-- Section Line Indicators -->
      <text x="-100" y="-10" font-size="12" font-weight="bold">A</text>
      <text x="-100" y="400" font-size="12" font-weight="bold">A</text>
      <line x1="-100" y1="-5" x2="-100" y2="395" stroke="#333" stroke-width="1" stroke-dasharray="5,5" />
    </g>

    <!-- VIEW 3: TOP ELEVATION (Plan View) -->
    <g transform="translate(450, 450)">
      <text x="0" y="-20" font-size="14" font-weight="bold">TOP PLAN VIEW</text>
      
      <!-- Central Body -->
      <circle cx="0" cy="100" r="60" fill="none" stroke="#333" stroke-width="2" />
      <circle cx="0" cy="100" r="55" fill="none" stroke="#333" stroke-width="1" />
      
      <!-- Solar Arrays (Folded/Top down) -->
      <path d="M -100 50 L -180 50 L -180 150 L -100 150 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M 100 50 L 180 50 L 180 150 L 100 150 Z" fill="none" stroke="#333" stroke-width="1" />
      <text x="-200" y="100" font-size="10">SOLAR ARRAYS</text>

      <!-- Propellant Tanks (Spherical) -->
      <circle cx="-80" cy="100" r="40" fill="none" stroke="#333" stroke-width="1.5" />
      <circle cx="80" cy="100" r="40" fill="none" stroke="#333" stroke-width="1.5" />
      <text x="-120" y="160" font-size="10">SPHERICAL TANKS</text>
      <line x1="-80" y1="140" x2="-120" y2="150" stroke="#333" stroke-width="0.5" />

      <!-- Landing Gear -->
      <path d="M -50 100 L -120 180 L -100 180 L -30 100 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M 50 100 L 120 180 L 100 180 L 30 100 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M 0 160 L 0 220 L -20 220 L -20 160 Z" fill="none" stroke="#333" stroke-width="1" /> <!-- Rear leg -->
      
      <!-- Docking Port -->
      <circle cx="0" cy="50" r="20" fill="none" stroke="#333" stroke-width="1" />
      <circle cx="0" cy="50" r="15" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4,2" />
      <text x="40" y="50" font-size="10">DOCKING PORT</text>
      <line x1="20" y1="50" x2="35" y2="50" stroke="#333" stroke-width="0.5" />

      <!-- Crosshairs -->
      <line x1="0" y1="0" x2="0" y2="250" stroke="#333" stroke-width="0.5" stroke-dasharray="10,5" />
      <line x1="-200" y1="100" x2="200" y2="100" stroke="#333" stroke-width="0.5" stroke-dasharray="10,5" />
    </g>

    <!-- VIEW 4: REAR ELEVATION (Engines) -->
    <g transform="translate(80, 450)">
      <text x="0" y="-20" font-size="14" font-weight="bold">REAR ELEVATION</text>
      
      <!-- Engine Cluster -->
      <!-- Center Engine -->
      <path d="M -30 100 L 30 100 L 50 180 L -50 180 Z" fill="none" stroke="#333" stroke-width="2" />
      <path d="M -25 180 L -35 250 L 35 250 L 25 180 Z" fill="none" stroke="#333" stroke-width="1" />
      <ellipse cx="0" cy="250" rx="35" ry="10" fill="none" stroke="#333" stroke-width="1" />
      
      <!-- Left Engine -->
      <path d="M -80 120 L -20 120 L -10 180 L -90 180 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M -85 180 L -95 230 L -15 230 L -25 180 Z" fill="none" stroke="#333" stroke-width="1" />
      <ellipse cx="-55" cy="230" rx="40" ry="8" fill="none" stroke="#333" stroke-width="1" />

      <!-- Right Engine -->
      <path d="M 20 120 L 80 120 L 90 180 L 10 180 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M 25 180 L 15 230 L 95 230 L 85 180 Z" fill="none" stroke="#333" stroke-width="1" />
      <ellipse cx="55" cy="230" rx="40" ry="8" fill="none" stroke="#333" stroke-width="1" />

      <text x="-100" y="150" font-size="10">MAIN ENGINES (x3)</text>
      <line x1="-80" y1="150" x2="-60" y2="150" stroke="#333" stroke-width="0.5" />
      
      <!-- Landing Gear Pads -->
      <rect x="-100" y="260" width="40" height="20" rx="5" fill="none" stroke="#333" stroke-width="1" />
      <rect x="60" y="260" width="40" height="20" rx="5" fill="none" stroke="#333" stroke-width="1" />
      <rect x="-20" y="260" width="40" height="20" rx="5" fill="none" stroke="#333" stroke-width="1" />
      
      <!-- Structural Ring -->
      <circle cx="0" cy="100" r="80" fill="none" stroke="#333" stroke-width="1" />
    </g>

    <!-- VIEW 5: FRONT ELEVATION -->
    <g transform="translate(80, 50)">
      <text x="0" y="-20" font-size="14" font-weight="bold">FRONT ELEVATION</text>
      
      <!-- Crew Module Face -->
      <path d="M -60 100 L 60 100 L 60 50 C 60 20, -60 20, -60 50 Z" fill="none" stroke="#333" stroke-width="2" />
      <path d="M -55 100 L 55 100 L 55 50 C 55 25, -55 25, -55 50 Z" fill="none" stroke="#333" stroke-width="1" />
      
      <!-- Windows -->
      <path d="M -40 40 L 40 40 L 30 60 L -30 60 Z" fill="#eef" stroke="#333" stroke-width="1" />
      <path d="M -35 42 L 35 42 L 25 58 L -25 58 Z" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="2,2" />
      
      <!-- Docking Ring -->
      <rect x="-15" y="20" width="30" height="10" fill="none" stroke="#333" stroke-width="1" />
      
      <!-- Landing Gear Stance (Wide) -->
      <path d="M -60 100 L -120 250 L -100 250 L -40 100 Z" fill="none" stroke="#333" stroke-width="1" />
      <path d="M 60 100 L 120 250 L 100 250 L 40 100 Z" fill="none" stroke="#333" stroke-width="1" />
      
      <!-- Gear Pads -->
      <line x1="-140" y1="250" x2="-120" y2="250" stroke="#333" stroke-width="2" />
      <line x1="120" y1="250" x2="140" y2="250" stroke="#333" stroke-width="2" />
      
      <!-- Centerline -->
      <line x1="0" y1="0" x2="0" y2="280" stroke="#333" stroke-width="0.5" stroke-dasharray="10,5" />
    </g>

    <!-- Scale Bar -->
    <g transform="translate(850, 720)">
      <text x="0" y="-5" font-size="10">SCALE BAR (1m)</text>
      <line x1="0" y1="0" x2="100" y2="0" stroke="#333" stroke-width="2" />
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#333" stroke-width="1" />
      <line x1="25" y1="-5" x2="25" y2="5" stroke="#333" stroke-width="1" />
      <line x1="50" y1="-5" x2="50" y2="5" stroke="#333" stroke-width="1" />
      <line x1="75" y1="-5" x2="75" y2="5" stroke="#333" stroke-width="1" />
      <line x1="100" y1="-5" x2="100" y2="5" stroke="#333" stroke-width="1" />
      <text x="0" y="15" font-size="8">0</text>
      <text x="45" y="15" font-size="8">0.25</text>
      <text x="95" y="15" font-size="8">0.5</text>
    </g>

  </g>
</svg>