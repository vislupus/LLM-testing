<?xml version="1.0" encoding="UTF-8"?>
<!--
  Technical Spacecraft Schematic Blueprint
  Five-View Orthographic Projection with Cutaway
  Consistent proportions: Length=80 units, Max Diameter=16 units
  Scale: 1 unit = 10 meters (shown in legend)
  Color scheme: Cyan/white linework on black background (industry standard)
  All components labeled with callouts and dimension lines.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 1800"
     width="1200"
     height="1800"
     style="font-family:'Courier New',Courier,monospace; background:#0a0a0a;">

  <!-- Definitions: arrowheads, patterns, colors -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
            orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#00ffff"/>
    </marker>
    <marker id="arrowrev" markerWidth="10" markerHeight="7" refX="1" refY="3.5"
            orient="auto-reverse">
      <polygon points="0 0, 9 3.5, 0 7" fill="#00ffff"/>
    </marker>
    <linearGradient id="radGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#55ffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:0.6"/>
    </linearGradient>
    <pattern id="solarPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#00ffff" stroke-width="1"/>
      <line x1="0" y1="0" x2="20" y2="20" stroke="#00ffff" stroke-width="0.5"/>
      <line x1="20" y1="0" x2="0" y2="20" stroke="#00ffff" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- ===== SCALE & LEGEND BLOCK (bottom) ===== -->
  <g id="legend" transform="translate(860,1730)">
    <rect x="-100" y="-40" width="200" height="50" fill="#111" stroke="#00ffff" stroke-width="1"/>
    <text x="0" y="12" fill="#00ffff" font-size="11" text-anchor="middle">Scale: 1 unit = 10 m</text>
    <text x="0" y="28" fill="#00ffff" font-size="11" text-anchor="middle">Primary Hull: Cylindrical, 80m × 16m</text>
    <text x="0" y="44" fill="#00ffff" font-size="11" text-anchor="middle">View Projection: Orthographic, 1:1 engineering scale</text>
  </g>

  <!-- ===== VIEWS ===== -->
  <!-- Top View (looking down -Z) -->
  <g id="viewTop" transform="translate(40, 40)">
    <g id="shipTop" transform="translate(40, 40)">
      <!-- Main hull cylinder (top ellipse + side rectangles) -->
      <ellipse cx="40" cy="40" rx="40" ry="8" fill="none" stroke="#00ffff" stroke-width="2"/>
      <rect x="0" y="8" width="80" height="16" fill="none" stroke="#00ffff" stroke-width="2"/>
      <rect x="0" y="32" width="80" height="8" fill="none" stroke="#00ffff" stroke-width="2"/>
      <!-- Solar arrays (top) -->
      <rect x="10" y="2" width="60" height="6" fill="url(#solarPattern)" stroke="#00ffff" stroke-width="1"/>
      <rect x="50" y="-4" width="30" height="12" fill="none" stroke="#00ffff" stroke-dasharray="3 2"/>
      <!-- Radiators (bottom) -->
      <rect x="5" y="50" width="70" height="6" fill="url(radGrad)" stroke="#00ffff" stroke-width="1"/>
      <!-- Landing gear (3 legs) -->
      <line x1="20" y1="58" x2="20" y2="70" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="40" y1="58" x2="40" y2="70" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="60" y1="58" x2="60" y2="70" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <circle cx="20" cy="72" r="3" fill="#00ffff"/>
      <circle cx="40" cy="72" r="3" fill="#00ffff"/>
      <circle cx="60" cy="72" r="3" fill="#00ffff"/>
      <!-- Docking port (top center) -->
      <circle cx="40" cy="20" r="5" fill="#ffaa00" stroke="#00ffff" stroke-width="1"/>
      <text x="40" y="15" fill="#ffaa00" font-size="9" text-anchor="middle">Docking Port</text>
    </g>
    <!-- Component Callouts (Top) -->
    <g transform="translate(0, 110)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
      <circle cx="0" cy="35" r="2" fill="#00ffff"/>
      <text x="-20" y="38" fill="#aaa" font-size="9">Engine Bell (rear)</text>
      <line x1="80" y1="0" x2="80" y2="30" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
      <circle cx="80" cy="35" r="2" fill="#00ffff"/>
      <text x="100" y="38" fill="#aaa" font-size="9">Radiators</text>
      <line x1="15" y1="10" x2="15" y2="40" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
      <circle cx="15" cy="45" r="2" fill="#00ffff"/>
      <text x="-25" y="48" fill="#aaa" font-size="9">Solar Arrays</text>
      <line x1="65" y1="10" x2="65" y2="40" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
      <circle cx="65" cy="45" r="2" fill="#00ffff"/>
      <text x="85" y="48" fill="#aaa" font-size="9">Landing Gear</text>
      <line x1="30" y1="12" x2="30" y2="55" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
      <circle cx="30" cy="60" r="2" fill="#00ffff"/>
      <text x="10" y="63" fill="#aaa" font-size="9">Cargo Bay Doors</text>
    </g>
    <text x="40" y="-2" fill="#00ffff" font-size="12" text-anchor="middle">TOP VIEW</text>
  </g>

  <!-- Front View (looking from +Y, profile) -->
  <g id="viewFront" transform="translate(40, 190)">
    <g id="shipFront" transform="translate(40, 40)">
      <!-- Cockpit dome -->
      <circle cx="40" cy="8" r="5" fill="#111" stroke="#00ffff" stroke-width="1"/>
      <text x="40" y="3" fill="#00ffff" font-size="9" text-anchor="middle">Cockpit</text>
      <!-- Crew module cylinder -->
      <ellipse cx="40" cy="24" rx="32" ry="8" fill="none" stroke="#00ffff" stroke-width="2"/>
      <rect x="8" y="16" width="64" height="16" fill="none" stroke="#00ffff" stroke-width="2"/>
      <!-- Propellant tanks (sides) -->
      <ellipse cx="16" cy="40" rx="12" ry="6" fill="none" stroke="#00ffff" stroke-width="2"/>
      <ellipse cx="64" cy="40" rx="12" ry="6" fill="none" stroke="#00ffff" stroke-width="2"/>
      <!-- Engine bell (rear) -->
      <path d="M70 38 Q85 50 78 62 L70 58 Z" fill="none" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="78" y="65" fill="#ffaa00" font-size="9" text-anchor="start">Main Engine</text>
      <!-- Radiators (side panels) -->
      <rect x="28" y="30" width="12" height="22" fill="url(radGrad)" stroke="#00ffff" stroke-width="1"/>
      <rect x="44" y="30" width="12" height="22" fill="url(radGrad)" stroke="#00ffff" stroke-width="1"/>
      <!-- Landing gear (retracted) -->
      <line x1="35" y1="55" x2="35" y2="65" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="49" y1="55" x2="49" y2="65" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <circle cx="35" cy="68" r="2.5" fill="#00ffff"/>
      <circle cx="49" cy="68" r="2.5" fill="#00ffff"/>
      <!-- Antennas (booms) -->
      <line x1="40" y1="12" x2="40" y2="4" stroke="#00ffff" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <circle cx="40" cy="8" r="2.5" fill="#00ffff"/>
      <text x="40" y="3" fill="#aaa" font-size="9" text-anchor="middle">Communications Antenna</text>
      <!-- Cargo bay rear doors -->
      <rect x="12" y="38" width="16" height="8" fill="none" stroke="#00ffff" stroke-dasharray="3 2"/>
      <text x="20" y="43" fill="#aaa" font-size="9">Cargo Bay</text>
    </g>
    <text x="40" y="-2" fill="#00ffff" font-size="12" text-anchor="middle">FRONT VIEW</text>
  </g>

  <!-- Side View (right side, looking from +X) -->
  <g id="viewSide" transform="translate(40, 340)">
    <g id="shipSide" transform="translate(40, 40)">
      <!-- Longitudinal profile: crew module + tanks + engines -->
      <ellipse cx="40" cy="24" rx="32" ry="8" fill="none" stroke="#00ffff" stroke-width="2"/>
      <rect x="8" y="16" width="64" height="16" fill="none" stroke="#00ffff" stroke-width="2"/>
      <!-- Propellant tanks (upper/lower) -->
      <ellipse cx="16" cy="40" rx="12" ry="6" fill="none" stroke="#00ffff" stroke-width="2"/>
      <ellipse cx="64" cy="40" rx="12" ry="6" fill="none" stroke="#00ffff" stroke-width="2"/>
      <!-- Engine bell and nozzle -->
      <path d="M70 45 Q85 70 78 85 L70 80 Z" fill="none" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="78" y="88" fill="#ffaa00" font-size="9">Engine Nozzle</text>
      <!-- Radiators (top-side panels) -->
      <rect x="10" y="28" width="70" height "5" fill="url(radGrad)" stroke="#00ffff" stroke-width="1"/>
      <!-- Solar arrays (angled) -->
      <g transform="rotate(30, 55, 12)">
        <rect x="5" y="10" width="50" height "6" fill="url(#solarPattern)" stroke="#00ffff" stroke-width="1"/>
      </g>
      <!-- Landing gear (extended) -->
      <line x1="25" y1="65" x2="20" y2="80" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="55" y1="65" x2="60" y2="80" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="38" y1="70" x2="32" y2="85" stroke="#00ffff" stroke-width="1.5"/>
      <circle cx="20" cy="82" r="2.5" fill="#00ffff"/>
      <circle cx="60" cy="82" r="2.5" fill="#00ffff"/>
      <!-- Avionics bay (cube stack) -->
      <rect x="32" y="30" width="14" height="10" fill="#333" stroke="#00ffff" stroke-width="1"/>
      <rect x="32" y="42" width="14" height="8" fill="#333" stroke="#00ffff" stroke-width="1"/>
      <text x="40" y="33" fill="#00ffff" font-size="9" text-anchor="middle">Avionics</text>
      <!-- Life-support units (circular) -->
      <g transform="translate(50, 50)">
        <circle r="3" fill="#00ffff"/>
        <circle r="3" fill="#00ffff" transform="translate(0, 8)"/>
        <circle r="3" fill="#00ffff" transform="translate(0, 16)"/>
      </g>
      <text x="50" y="55" fill="#aaa" font-size="9">Life-Support</text>
      <!-- Docking port (nose) -->
      <circle cx="40" cy="8" r="5" fill="#ffaa00" stroke="#00ffff" stroke-width="1"/>
      <text x="40" y="3" fill="#ffaa00" font-size="9" text-anchor="middle">Docking Port</text>
    </g>
    <text x="40" y="-2" fill="#00ffff" font-size="12" text-anchor="middle">SIDE VIEW</text>
  </g>

  <!-- Rear View (looking from -Y, engine side) -->
  <g id="viewRear" transform="translate(40, 520)">
    <g id="shipRear" transform="translate(40, 40)">
      <!-- Engine bell and exhaust cone -->
      <path d="M40 50 Q10 80 40 110 L40 100 Z" fill="#001122" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="40" y="115" fill="#00ffff" font-size="9" text-anchor="middle">Main Engine</text>
      <!-- Propellant tanks (rear) -->
      <ellipse cx="40" cy="78" rx="20" ry="10" fill="none" stroke="#00ffff" stroke-width="2"/>
      <text x="40" y="83" fill="#aaa" font-size="9">Propellant Tanks</text>
      <!-- Radiators (rear panel) -->
      <rect x="15" y="45" width "70" height="6" fill="url(radGrad)" stroke="#00ffff" stroke-width="1"/>
      <!-- Structural ribs/frame -->
      <line x1="40" y1="15" x2="40" y2="110" stroke="#00ffff" stroke-width="1" stroke-dasharray="5 3"/>
      <!-- Landing gear (rear stowage) -->
      <line x1="30" y1="85" x2="30" y2="95" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="50" y1="85" x2="50" y2="95" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <circle cx="30" cy="98" r="2.5" fill="#00ffff"/>
      <circle cx="50" cy="98" r="2.5" fill="#00ffff"/>
      <!-- Avionics (rear stack) -->
      <rect x="25" y="30" width "12" height="12" fill="#333" stroke="#00ffff" stroke-width="1"/>
      <rect x="25" y="44" width "12" height="8" fill="#333" stroke="#00ffff" stroke-width="1"/>
      <text x="31" y="33" fill="#00ffff" font-size="9">Avionics</text>
      <!-- Life-support (rear module) -->
      <g transform="translate(55, 55)">
        <circle r="3" fill="#00ffff"/>
        <circle r="3" fill="#00ffff" transform="translate(0, 8)"/>
      </g>
      <text x="55" y="60" fill="#aaa" font-size="9">Life-Support</text>
      <!-- Cargo bay rear doors open -->
      <rect x="10" y="70" width "20" height="10" fill="none" stroke="#00ffff" stroke-dasharray="3 2"/>
      <text x="20" y="77" fill="#aaa" font-size="9">Cargo Bay</text>
    </g>
    <text x="40" y="-2" fill="#00ffff" font-size="12" text-anchor="middle">REAR VIEW</text>
  </g>

  <!-- Cutaway View (longitudinal cross-section, left half) -->
  <g id="viewCutaway" transform="translate(40, 700)">
    <g id="shipCutaway" transform="translate(40, 40)">
      <!-- Cut plane line -->
      <line x1="0" y1="40" x2="80" y2="40" stroke="#ff0000" stroke-width="2" stroke-dasharray="8 4"/>
      <!-- Right half (intact) - silhouette -->
      <ellipse cx="70" cy="40" rx="30" ry="8" fill="none" stroke="#00ffff" stroke-width="2"/>
      <rect x="40" y="32" width="40" height="16" fill="none" stroke="#00ffff" stroke-width="2"/>
      <!-- Left half (cut-away) - reveal internals -->
      <g fill="none" stroke="#ff5500" stroke-width="2">
        <!-- Crew module interior -->
        <ellipse cx="20" cy="28" rx="14" ry="4" stroke="#ff5500"/>
        <rect x="6" y="24" width="28" height="12" stroke="#ff5500"/>
        <text x="20" y="23" fill="#ff5500" font-size="9" text-anchor="middle">Crew Module</text>
        <!-- Cockpit canopy -->
        <circle cx="8" cy="16" r="3" fill="#111" stroke="#ff5500" stroke-width="1"/>
        <text x="8" y="12" fill="#ff5500" font-size="9">Cockpit</text>
        <!-- Avionics rack -->
        <rect x="12" y="8" width="12" height="10" fill="#333" stroke="#ff5500" stroke-width="1"/>
        <text x="18" y="11" fill="#ff5500" font-size="9">Avionics</text>
        <!-- Life-support system -->
        <g transform="translate(30, 20)">
          <circle r="3" fill="#00ffff"/>
          <circle r="3" fill="#00ffff" transform="translate(0, 7)"/>
          <circle r="3" fill="#00ffff" transform="translate(0, 14)"/>
        </g>
        <text x="30" y="25" fill="#ff5500" font-size="9">Life-Support</text>
        <!-- Propellant feed lines -->
        <line x1="35" y1="45" x2="35" y2="70" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
        <line x1="45" y1="45" x2="45" y2="70" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
        <text x="40" y="75" fill="#00ffff" font-size="9">Propellant Lines</text>
        <!-- Electrical bus harness (zigzag) -->
        <g stroke="#00ffff" stroke-width="1">
          <path d="M 10 50 Q 20 50 30 50 Q 40 50 50 50"/>
        </g>
        <text x="25" y="55" fill="#00ffff" font-size="9">Wire Harness</text>
        <!-- Structural frame members -->
        <line x1="10" y1="35" x2="10" y2="75" stroke="#00ffff" stroke-width="1"/>
        <line x1="70" y1="35" x2="70" y2="75" stroke="#00ffff" stroke-width="1"/>
      </g>
      <!-- Engine assembly (rear, cutaway shows nozzle exit) -->
      <path d="M 72 55 Q 85 75 78 85 L 72 80 Z" fill="none" stroke="#00ffff" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="78" y="88" fill="#ffaa00" font-size="9">Main Engine</text>
      <!-- Radiator core (cut reveal) -->
      <rect x="5" y="52" width "70" height "6" fill="url(radGrad)" stroke="#00ffff" stroke-width="1"/>
      <!-- Solar array stowage track -->
      <line x1="15" y1="30" x2="65" y2="30" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
      <text x="40" y="35" fill="#00ffff" font-size="9">Solar Array Track</text>
      <!-- Landing gear well (internal) -->
      <g fill="#222" stroke="#00ffff" stroke-width="1">
        <rect x="22" y="65" width "16" height "15" rx="2"/>
        <text x="30" y="72" fill="#00ffff" font-size="9">Landing Gear Well</text>
      </g>
      <!-- Cargo bay internal bulkhead -->
      <line x1="40" y1="25" x2="40" y2="75" stroke="#00ffff" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="40" y="20" fill="#00ffff" font-size="9" text-anchor="middle">Cargo Bay</text>
    </g>
    <text x="40" y="-2" fill="#00ffff" font-size="12" text-anchor="middle">CUTAWAY VIEW</text>
  </g>

  <!-- Dimension Lines (shared across views, anchored top-left) -->
  <g transform="translate(20, 1580)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="310" y="8" fill="#00ffff" font-size="10">Overall Length: 80 m</text>
    <line x1="0" y1="15" x2="250" y2="15" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="260" y="23" fill="#00ffff" font-size="10">Max Diameter: 16 m</text>
    <line x1="0" y1="30" x2="200" y2="30" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="210" y="38" fill="#00ffff" font-size="10">Radiator Span: 30 m</text>
    <line x1="0" y1="45" x2="180" y2="45" stroke="#00ffff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="190" y="53" fill="#00ffff" font-size="10">Solar Array Length: 25 m</text>
  </g>

</svg>
