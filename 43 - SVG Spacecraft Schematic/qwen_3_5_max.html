<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacecraft Technical Blueprint - Model X-747</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .blueprint-container {
            max-width: 1600px;
            width: 100%;
            position: relative;
        }
        
        svg {
            filter: drop-shadow(0 0 20px rgba(0, 150, 255, 0.1));
        }
        
        .grid-pattern {
            opacity: 0.03;
        }
        
        .dimension-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            fill: #6aa0ff;
        }
        
        .label-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            fill: #4da6ff;
            text-transform: uppercase;
        }
        
        .component-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            fill: #6bb8ff;
        }
        
        .annotation-line {
            stroke: #3a80ff;
            stroke-dasharray: 3,3;
            opacity: 0.6;
        }
        
        .view-title {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            fill: #5ba0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="blueprint-container">
        <svg viewBox="0 0 2000 1400" xmlns="http://www.w3.org/2000/svg">
            <!-- Grid Background -->
            <defs>
                <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3a5c" stroke-width="0.5"/>
                </pattern>
                <linearGradient id="engineGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1"/>
                    <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.8"/>
                    <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0"/>
                </linearGradient>
                <linearGradient id="hullGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#1a3a5c"/>
                    <stop offset="50%" style="stop-color:#2a4a6c"/>
                    <stop offset="100%" style="stop-color:#1a3a5c"/>
                </linearGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <rect width="2000" height="1400" fill="#0d1b2a" rx="10"/>
            <rect width="2000" height="1400" fill="url(#gridPattern)" rx="10"/>
            
            <!-- Title Block -->
            <g transform="translate(50, 30)">
                <rect width="400" height="80" fill="none" stroke="#00aaff" stroke-width="2"/>
                <text x="10" y="20" class="view-title" font-size="14">SPACECRAFT MODEL X-747</text>
                <text x="10" y="40" class="label-text" font-size="10">TECHNICAL SCHEMATIC DRAWING</text>
                <text x="10" y="60" class="dimension-text" font-size="9">REVISION: A | DATE: 2024 | SCALE: 1:50</text>
                
                <!-- Scale Bar -->
                <g transform="translate(280, 45)">
                    <line x1="0" y1="0" x2="100" y2="0" stroke="#00aaff" stroke-width="2"/>
                    <line x1="0" y1="-5" x2="0" y2="5" stroke="#00aaff" stroke-width="2"/>
                    <line x1="50" y1="-5" x2="50" y2="5" stroke="#00aaff" stroke-width="2"/>
                    <line x1="100" y1="-5" x2="100" y2="5" stroke="#00aaff" stroke-width="2"/>
                    <text x="50" y="20" class="dimension-text" text-anchor="middle" font-size="9">5 M</text>
                </g>
            </g>
            
            <!-- ===================================================== -->
            <!-- SIDE VIEW (Left Side View) -->
            <!-- ===================================================== -->
            <g id="side-view">
                <rect x="20" y="150" width="450" height="650" fill="none" stroke="#2a4a6c" stroke-width="1" stroke-dasharray="5,5"/>
                <text x="245" y="135" class="view-title" text-anchor="middle">SIDE VIEW</text>
                <text x="245" y="148" class="dimension-text" text-anchor="middle">SECTION A-A</text>
                
                <!-- Main Fuselage -->
                <g transform="translate(80, 180)">
                    <!-- Upper Fuselage -->
                    <ellipse cx="0" cy="-180" rx="45" ry="55" fill="none" stroke="url(#hullGradient)" stroke-width="3"/>
                    
                    <!-- Crew Module Dome -->
                    <ellipse cx="0" cy="-180" rx="45" ry="50" fill="#1a2a3a" stroke="#00aaff" stroke-width="2"/>
                    <circle cx="0" cy="-180" r="12" fill="#003a5a" stroke="#0066aa" stroke-width="2"/>
                    <circle cx="-8" cy="-185" r="5" fill="#002a4a" stroke="#004488" stroke-width="1"/>
                    <circle cx="10" cy="-172" r="4" fill="#002a4a" stroke="#004488" stroke-width="1"/>
                    
                    <!-- Solar Array Left -->
                    <g transform="translate(-80, -80)">
                        <rect x="-40" y="-80" width="10" height="160" fill="#1a2a3a" stroke="#00aaff" stroke-width="2"/>
                        <polygon points="0,-75 50,-70 50,70 0,75" fill="#0d1a2a" stroke="#00aaff" stroke-width="2"/>
                        <rect x="2" y="-70" width="46" height="140" fill="none" stroke="#1a3a5c" stroke-width="0.5"/>
                        <line x1="0" y1="-40" x2="50" y2="-40" stroke="#1a3a5c" stroke-width="0.5"/>
                        <line x1="0" y1="0" x2="50" y2="0" stroke="#1a3a5c" stroke-width="0.5"/>
                        <line x1="0" y1="40" x2="50" y2="40" stroke="#1a3a5c" stroke-width="0.5"/>
                        
                        <!-- Label -->
                        <text x="70" y="-20" class="component-label">SOLAR ARRAY (L)</text>
                        <line x1="65" y1="-20" x2="-5" y2="-20" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="0" y1="-20" x2="5" y2="-28" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="0" y1="-20" x2="5" y2="-12" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Solar Array Right -->
                    <g transform="translate(80, -80)">
                        <rect x="-40" y="-80" width="10" height="160" fill="#1a2a3a" stroke="#00aaff" stroke-width="2"/>
                        <polygon points="0,-75 -50,-70 -50,70 0,75" fill="#0d1a2a" stroke="#00aaff" stroke-width="2"/>
                        <rect x="-48" y="-70" width="46" height="140" fill="none" stroke="#1a3a5c" stroke-width="0.5"/>
                        <line x1="0" y1="-40" x2="-50" y2="-40" stroke="#1a3a5c" stroke-width="0.5"/>
                        <line x1="0" y1="0" x2="-50" y2="0" stroke="#1a3a5c" stroke-width="0.5"/>
                        <line x1="0" y1="40" x2="-50" y2="40" stroke="#1a3a5c" stroke-width="0.5"/>
                        
                        <!-- Label -->
                        <text x="-75" y="-20" class="component-label" text-anchor="end">SOLAR ARRAY (R)</text>
                        <line x1="-70" y1="-20" x2="-5" y2="-20" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-5" y1="-20" x2="-10" y2="-28" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-5" y1="-20" x2="-10" y2="-12" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Radiator Panels -->
                    <g transform="translate(50, 20)">
                        <rect x="-5" y="-120" width="10" height="240" fill="#0d1a2a" stroke="#4488cc" stroke-width="2"/>
                        <line x1="0" y1="-80" x2="0" y2="80" stroke="#4488cc" stroke-width="1"/>
                        <line x1="0" y1="-40" x2="0" y2="40" stroke="#4488cc" stroke-width="1"/>
                        
                        <!-- Label -->
                        <text x="60" y="-50" class="component-label">THERMAL RADIATOR</text>
                        <line x1="55" y1="-50" x2="-5" y2="-50" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="0" y1="-50" x2="5" y2="-55" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="0" y1="-50" x2="5" y2="-45" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Cargo Bay -->
                    <g transform="translate(-30, 0)">
                        <rect x="-40" y="40" width="80" height="140" fill="none" stroke="#00aaff" stroke-width="2"/>
                        <rect x="-35" y="45" width="70" height="130" fill="#152535" stroke="#0066aa" stroke-width="1"/>
                        <line x1="-35" y1="45" x2="-35" y2="175" stroke="#004488" stroke-width="1"/>
                        <line x1="-35" y1="100" x2="-35" y2="175" stroke="#004488" stroke-width="0.5"/>
                        
                        <!-- Hatch Lines -->
                        <line x1="-40" y1="70" x2="40" y2="70" stroke="#004488" stroke-width="1"/>
                        <line x1="-40" y1="100" x2="40" y2="100" stroke="#004488" stroke-width="1"/>
                        <line x1="-40" y1="130" x2="40" y2="130" stroke="#004488" stroke-width="1"/>
                        
                        <!-- Label -->
                        <text x="-80" y="110" class="component-label">CARGO BAY DOOR</text>
                        <line x1="-75" y1="110" x2="-35" y2="110" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-35" y1="110" x2="-42" y2="105" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-35" y1="110" x2="-42" y2="115" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Propellant Tanks -->
                    <g transform="translate(0, 120)">
                        <rect x="-40" y="-50" width="80" height="140" fill="none" stroke="#0066aa" stroke-width="2"/>
                        <line x1="0" y1="-50" x2="0" y2="90" stroke="#4488cc" stroke-width="1"/>
                        
                        <!-- Tank Labels -->
                        <text x="60" y="-30" class="component-label">LIQUID OXYGEN TANK</text>
                        <line x1="55" y1="-30" x2="40" y2="-30" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="40" y1="-30" x2="35" y2="-35" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="40" y1="-30" x2="35" y2="-25" stroke="#6bb8ff" stroke-width="1"/>
                        
                        <text x="60" y="70" class="component-label">HYDROGEN FUEL TANK</text>
                        <line x1="55" y1="70" x2="40" y2="70" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="40" y1="70" x2="35" y2="75" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="40" y1="70" x2="35" y2="65" stroke="#6bb8ff" stroke-width="1"/>
                        
                        <!-- Level Markers -->
                        <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#0044aa" stroke-width="1" stroke-dasharray="2,1"/>
                        <line x1="-40" y1="30" x2="40" y2="30" stroke="#0044aa" stroke-width="1" stroke-dasharray="2,1"/>
                    </g>
                    
                    <!-- Avionics Section -->
                    <g transform="translate(0, 200)">
                        <rect x="-25" y="-20" width="50" height="40" fill="none" stroke="#0044aa" stroke-width="2"/>
                        <circle cx="-10" cy="0" r="5" fill="#1a2a3a" stroke="#0066aa" stroke-width="1"/>
                        <circle cx="10" cy="-5" r="4" fill="#1a2a3a" stroke="#0066aa" stroke-width="1"/>
                        <circle cx="-10" cy="15" r="4" fill="#1a2a3a" stroke="#0066aa" stroke-width="1"/>
                        
                        <!-- Label -->
                        <text x="-55" y="0" class="component-label">AVIONICS BAY</text>
                        <line x1="-50" y1="0" x2="-25" y2="0" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-25" y1="0" x2="-32" y2="-5" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-25" y1="0" x2="-32" y2="5" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Life Support Systems -->
                    <g transform="translate(30, 220)">
                        <rect x="-20" y="-15" width="40" height="30" fill="none" stroke="#006644" stroke-width="2"/>
                        <path d="M -15 -10 Q 0 -25 15 -10" fill="none" stroke="#00aa66" stroke-width="1"/>
                        <path d="M -12 5 Q 0 20 12 5" fill="none" stroke="#00aa66" stroke-width="1"/>
                        
                        <!-- Label -->
                        <text x="50" y="0" class="component-label">LIFE SUPPORT SYSTEM</text>
                        <line x1="45" y1="0" x2="30" y2="0" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="30" y1="0" x2="37" y2="-5" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="30" y1="0" x2="37" y2="5" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Docking Port -->
                    <g transform="translate(0, 280)">
                        <ellipse cx="0" cy="0" rx="25" ry="15" fill="#0d1a2a" stroke="#00aaff" stroke-width="2"/>
                        <ellipse cx="0" cy="0" rx="18" ry="10" fill="#1a2a3a" stroke="#0066aa" stroke-width="1"/>
                        <circle cx="0" cy="0" r="5" fill="#002a4a" stroke="#004488" stroke-width="1"/>
                        
                        <!-- Ring Details -->
                        <ellipse cx="0" cy="0" rx="22" ry="12" fill="none" stroke="#0066aa" stroke-width="1"/>
                        <ellipse cx="0" cy="0" rx="14" ry="8" fill="none" stroke="#0066aa" stroke-width="1"/>
                        
                        <!-- Antenna -->
                        <line x1="0" y1="15" x2="0" y2="25" stroke="#00aaff" stroke-width="2"/>
                        <circle cx="0" cy="25" r="3" fill="#004488"/>
                        
                        <!-- Label -->
                        <text x="40" y="0" class="component-label">DOCKING PORT</text>
                        <line x1="35" y1="0" x2="25" y2="0" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="25" y1="0" x2="20" y2="-5" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="25" y1="0" x2="20" y2="5" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Engines -->
                    <g transform="translate(0, 360)">
                        <ellipse cx="0" cy="0" rx="30" ry="20" fill="none" stroke="#ff4400" stroke-width="3"/>
                        <ellipse cx="0" cy="0" rx="25" ry="15" fill="#1a0a00" stroke="#ff6600" stroke-width="2"/>
                        <ellipse cx="0" cy="0" rx="18" ry="10" fill="url(#engineGlow)"/>
                        
                        <!-- Engine Nozzle Details -->
                        <path d="M -25 15 L -28 35 L 28 35 L 25 15" fill="none" stroke="#331100" stroke-width="2"/>
                        <line x1="-15" y1="20" x2="-15" y2="30" stroke="#442211" stroke-width="1"/>
                        <line x1="0" y1="20" x2="0" y2="30" stroke="#442211" stroke-width="1"/>
                        <line x1="15" y1="20" x2="15" y2="30" stroke="#442211" stroke-width="1"/>
                        
                        <!-- Label -->
                        <text x="-60" y="25" class="component-label" text-anchor="end">MAIN ENGINE</text>
                        <line x1="-55" y1="25" x2="-30" y2="25" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-30" y1="25" x2="-25" y2="20" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-30" y1="25" x2="-25" y2="30" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- RCS Thrusters -->
                    <g transform="translate(100, 250)">
                        <circle cx="0" cy="0" r="4" fill="#ff6600" stroke="#ff9900" stroke-width="1"/>
                        <text x="12" y="4" class="component-label">RCS THRUSTER</text>
                        <line x1="10" y1="4" x2="0" y2="4" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <g transform="translate(-100, 250)">
                        <circle cx="0" cy="0" r="4" fill="#ff6600" stroke="#ff9900" stroke-width="1"/>
                        <text x="-12" y="4" class="component-label" text-anchor="end">RCS THRUSTER</text>
                        <line x1="-10" y1="4" x2="0" y2="4" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Airlock -->
                    <g transform="translate(-10, 160)">
                        <rect x="-20" y="-25" width="40" height="50" fill="none" stroke="#00aa66" stroke-width="2"/>
                        <rect x="-15" y="-18" width="30" height="10" fill="#0d1a2a" stroke="#006644" stroke-width="1"/>
                        
                        <!-- Label -->
                        <text x="-55" y="-5" class="component-label">AIRLOCK</text>
                        <line x1="-50" y1="-5" x2="-20" y2="-5" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-20" y1="-5" x2="-25" y2="-10" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="-20" y1="-5" x2="-25" y2="0" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Landing Gear -->
                    <g transform="translate(0, 450)">
                        <rect x="-30" y="-15" width="60" height="40" fill="none" stroke="#666666" stroke-width="2"/>
                        <rect x="-10" y="25" width="20" height="20" fill="#444444" stroke="#666666" stroke-width="2"/>
                        <rect x="-25" y="45" width="50" height="10" rx="3" fill="#333333" stroke="#555555" stroke-width="2"/>
                        
                        <!-- Folded Position Indicator -->
                        <line x1="-30" y1="10" x2="30" y2="10" stroke="#336699" stroke-width="2"/>
                        <line x1="-30" y1="10" x2="-30" y2="-20" stroke="#336699" stroke-width="1" stroke-dasharray="3,2"/>
                        <line x1="30" y1="10" x2="30" y2="-20" stroke="#336699" stroke-width="1" stroke-dasharray="3,2"/>
                        
                        <!-- Label -->
                        <text x="80" y="30" class="component-label">LANDING GEAR (FOLDED)</text>
                        <line x1="75" y1="30" x2="30" y2="30" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="30" y1="30" x2="25" y2="25" stroke="#6bb8ff" stroke-width="1"/>
                        <line x1="30" y1="30" x2="25" y2="35" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <!-- Communication Antennas -->
                    <g transform="translate(-50, 50)">
                        <line x1="0" y1="0" x2="0" y2="-60" stroke="#00aaff" stroke-width="3"/>
                        <circle cx="0" cy="-60" r="8" fill="#002a4a" stroke="#0066aa" stroke-width="2"/>
                        
                        <!-- Label -->
                        <text x="-15" y="-75" class="component-label" text-anchor="end">COMMUNICATION ANTENNA</text>
                        <line x1="-10" y1="-75" x2="0" y2="-75" stroke="#6bb8ff" stroke-width="1"/>
                    </g>
                    
                    <g transform="translate(50, -100)">
                        <line x1="0" y1="0" x2="0" y2="-50" stroke="#00aaff" stroke-width="3"/>
                        <circle cx="0" cy="-50" r="6" fill="#002a4a" stroke="#0066aa" stroke-width="2"/>
                        
                        <line x1="-15" y1="0" x2="15" y2="0" stroke="#00aaff" stroke-width="2"/>
                    </g>
                    
                    <!-- Dimensions -->
                    <g transform="translate(220, 180)">
                        <!-- Total Length -->
                        <line x1="0" y1="0" x2="300" y2="0" stroke="#00aaff" stroke-width="1.5"/>
                        <line x1="0" y1="-10" x2="0" y2="10" stroke="#00aaff" stroke-width="2"/>
                        <line x1="300" y1="-10" x2="300" y2="10" stroke="#00aaff" stroke-width="2"/>
                        <text x="150" y="-15" class="dimension-text" text-anchor="middle" font-size="12">TOTAL LENGTH: 85.5 M</text>
                        
                        <!-- Hull Diameter -->
                        <line x1="0" y1="120" x2="0" y2="380" stroke="#00aaff" stroke-width="1.5"/>
                        <line x1="-10" y1="120" x2="10" y2="120" stroke="#00aaff" stroke-width="2"/>
                        <line x1="-10" y1="380" x2="10" y2="380" stroke="#00aaff" stroke-width="2"/>
                        <text x="-25" y="250" class="dimension-text" text-anchor="middle" font-size="12" transform="rotate(-90, -25, 250)">HULL DIAMETER: 9 M</text>
                        
                        <!-- Wing Span -->
                        <line x1="-100" y1="20" x2="100" y2="20" stroke="#00aaff" stroke-width="1.5"/>
                        <line x1="-100" y1="10" x2="-100" y2="30" stroke="#00aaff" stroke-width="2"/>
                        <line x1="100" y1="10" x2="100" y2="30" stroke="#00aaff" stroke-width="2"/>
                        <text x="0" y="45" class="dimension-text" text-anchor="middle" font-size="12">WING SPAN: 40 M</text>
                    </g>
                </g>
            </g>
            
            <!-- ===================================================== -->
            <!-- TOP VIEW -->
            <!-- ===================================================== -->
            <g id="top-view">
                <rect x="550" y="150" width="450" height="650" fill="none" stroke="#2a4a6c" stroke-width="1" stroke-dasharray="5,5"/>
                <text x="775" y="135" class="view-title" text-anchor="middle">TOP VIEW</text>
                <text x="775" y="148" class="dimension-text" text-anchor="middle">PLAN VIEW</text>
                
                <g transform="translate(610, 180)">
                    <!-- Overall Outline -->
                    <path d="M -45 -180 L 45 -180 L 70 -80 L 70 80 L 45 180 L -45 180 L -70 80 L -70 -80 Z" 
                          fill="none" stroke="#00aaff" stroke-width="2"/>
                    
                    <!-- Solar Arrays -->
                    <g transform="translate(-80, -80)">
                        <path d="M -10 -90 L 80 -70 L 80 70 L -10 90 Z" fill="#0d1a2a" stroke="#00aaff" stroke-width="2"/>
                        <line x1="10" y1="-75" x2="70" y2="-70" stroke="#1a3a5c" stroke-width="1"/>
                        <line x1="10" y1="-50" x2="70" y2="-48" stroke="#1a3a5c" stroke-width="1"/>
                        <line x1="10" y1="-25" x2="70" y2="-26" stroke="#1a3a5c" stroke-width="1"/>
                        <line x1="10" y1="0" x2="70" y2="-4" stroke="#1a3a5c" stroke-width="1"/>
                        <line x1="10" y1="25" x2="70" y2="18" stroke="#1a3a5c" stroke-width="1"/>
                        <line x1="10" y1="50" x2="70" y2="40" stroke="#1a3a5c" stroke-width="1"/>
                        <line x1="10" y1="75" x2="70" y2="63" stroke="#1a3a5c" stroke-width="1"/>
                        
                        <text x="10" y="-30" class="component-label">SOLAR PANEL</text>
                        <text x="15" y="-10" class="component-label">PANEL</text>
                        <text x="15" y="10" class="component-label">PANEL</text>
                    </g>
