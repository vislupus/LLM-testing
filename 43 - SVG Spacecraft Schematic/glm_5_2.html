<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARES-VII - General Arrangement & Systems Schematic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a2238; --bg2:#08203a;
    --ink:#dcefff; --ink2:#bcd9f2; --dim:#9cc4e6; --dim2:#86b0d6;
    --cyan:#7fe0ff; --cyan2:#5fc0e8;
    --amber:#ffcf6b; --amber2:#ffe9b0;
    --hidden:#6f9fc8;
    --frame:#2f6fa8; --zone:#3f7fb8;
    --panel:#123a5e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#04111f;}
  body{font-family:'Share Tech Mono',Consolas,monospace;}
  .sheet{max-width:1700px;margin:0 auto;padding:18px;}
  svg{width:100%;height:auto;display:block;background:var(--bg);}
  .cap{text-align:center;color:#6fa6cf;font-family:'Share Tech Mono',monospace;
       letter-spacing:3px;font-size:12px;margin-top:10px;text-transform:uppercase;}

  .outline{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
  .outline2{fill:none;stroke:var(--ink2);stroke-width:1.1;stroke-linejoin:round;}
  .struct{fill:none;stroke:var(--dim);stroke-width:0.9;}
  .thin{fill:none;stroke:var(--dim2);stroke-width:0.6;}
  .hidden{fill:none;stroke:var(--hidden);stroke-width:0.8;stroke-dasharray:7 4;}
  .center{fill:none;stroke:var(--cyan);stroke-width:0.7;stroke-dasharray:16 3 2 3;}
  .center2{fill:none;stroke:var(--cyan2);stroke-width:0.6;stroke-dasharray:10 2 2 2;}
  .dim{fill:none;stroke:var(--cyan);stroke-width:0.7;}
  .dimext{fill:none;stroke:var(--cyan2);stroke-width:0.5;}
  .leader{fill:none;stroke:var(--amber);stroke-width:0.75;}
  .ldash{fill:none;stroke:var(--amber);stroke-width:0.6;stroke-dasharray:3 2;}
  .skin{fill:url(#hatchWall);stroke:var(--dim);stroke-width:0.8;}
  .vol{fill:var(--panel);opacity:.45;}
  .tank{fill:#0f3357;opacity:.6;stroke:var(--dim);stroke-width:0.8;}
  .insul{fill:url(#hatchInsul);stroke:var(--dim2);stroke-width:0.6;}
  .pv{fill:url(#pvcells);stroke:var(--ink2);stroke-width:0.9;}
  .rad{fill:url(#hatchInsul);stroke:var(--ink2);stroke-width:0.9;}

  .t-title{fill:var(--ink);font-family:'Saira Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:2.5px;}
  .t-sub{fill:var(--dim);font-family:'Share Tech Mono',monospace;font-size:9.5px;letter-spacing:1.5px;}
  .t-dim{fill:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:10px;}
  .t-call{fill:var(--amber2);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.5px;}
  .t-key{fill:var(--ink2);font-family:'Share Tech Mono',monospace;font-size:10px;}
  .t-mut{fill:var(--dim2);font-family:'Share Tech Mono',monospace;font-size:9px;}
  .t-sta{fill:var(--dim);font-family:'Share Tech Mono',monospace;font-size:8px;}
  .t-big{fill:var(--ink);font-family:'Saira Condensed',sans-serif;font-weight:700;}
</style>
</head>
<body>
<div class="sheet">
<svg viewBox="0 0 1680 1272" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#0d2c4c"/>
      <stop offset="60%" stop-color="#0a2238"/>
      <stop offset="100%" stop-color="#061726"/>
    </radialGradient>
    <pattern id="pMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#10355c" stroke-width="0.4"/>
    </pattern>
    <pattern id="pMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#16466f" stroke-width="0.7"/>
    </pattern>
    <pattern id="hatchWall" width="6.5" height="6.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6.5" stroke="#7fd0ff" stroke-width="0.65" opacity="0.55"/>
    </pattern>
    <pattern id="hatchInsul" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6fb8e0" stroke-width="0.5" opacity="0.45"/>
    </pattern>
    <pattern id="pvcells" width="14" height="9" patternUnits="userSpaceOnUse">
      <rect width="14" height="9" fill="#0e2c4a"/>
      <path d="M0 0H14M0 4.5H14M7 0V9" stroke="#2f6fa8" stroke-width="0.5"/>
    </pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="0.7" fill="#5fb0e0" opacity="0.5"/>
    </pattern>

    <marker id="aDim" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,1 L10,5.5 L0,10 Z" fill="#7fe0ff"/>
    </marker>
    <marker id="aLead" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2.3" fill="#ffcf6b"/>
    </marker>
    <marker id="aTip" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#ffcf6b"/>
    </marker>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1680" height="1272" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1680" height="1272" fill="url(#pMinor)"/>
  <rect x="0" y="0" width="1680" height="1272" fill="url(#pMajor)"/>

  <!-- ============ DRAWING FRAME & ZONES ============ -->
  <rect x="14" y="14" width="1652" height="1244" fill="none" stroke="#2f6fa8" stroke-width="2.4"/>
  <rect x="26" y="26" width="1628" height="1220" fill="none" stroke="#2f6fa8" stroke-width="0.8"/>
  <g class="t-sta" fill="#5fa8d8">
    <!-- top zone letters -->
    <text x="129" y="22">A</text><text x="333" y="22">B</text><text x="537" y="22">C</text>
    <text x="741" y="22">D</text><text x="945" y="22">E</text><text x="1149" y="22">F</text>
    <text x="1353" y="22">G</text><text x="1557" y="22">H</text>
    <!-- side zone numbers -->
    <text x="18" y="160">6</text><text x="18" y="356">5</text><text x="18" y="552">4</text>
    <text x="18" y="748">3</text><text x="18" y="944">2</text><text x="18" y="1140">1</text>
  </g>
  <g stroke="#2f6fa8" stroke-width="0.6">
    <line x1="204" y1="26" x2="204" y2="36"/><line x1="408" y1="26" x2="408" y2="36"/>
    <line x1="612" y1="26" x2="612" y2="36"/><line x1="816" y1="26" x2="816" y2="36"/>
    <line x1="1020" y1="26" x2="1020" y2="36"/><line x1="1224" y1="26" x2="1224" y2="36"/>
    <line x1="1428" y1="26" x2="1428" y2="36"/>
  </g>

  <!-- ============ HEADER BAND ============ -->
  <g>
    <rect x="26" y="26" width="1628" height="44" fill="#0a2b49" opacity="0.55"/>
    <line x1="26" y1="70" x2="1654" y2="70" stroke="#2f6fa8" stroke-width="0.8"/>
    <!-- emblem -->
    <g transform="translate(72,48)">
      <circle r="17" fill="none" stroke="#7fe0ff" stroke-width="1.2"/>
      <ellipse rx="22" ry="8" fill="none" stroke="#5fc0e8" stroke-width="0.9" transform="rotate(-22)"/>
      <circle r="3.4" fill="#ffcf6b"/>
      <path d="M-17,0 A17,17 0 0,1 17,0" fill="none" stroke="#bcd9f2" stroke-width="0.7"/>
    </g>
    <text x="104" y="44" class="t-big" font-size="19" letter-spacing="3">HELIOS AEROSPACE BUREAU</text>
    <text x="104" y="60" class="t-sub">MANNED SPACEFLIGHT DIVISION  DWG-AS-7741-C</text>
    <!-- center title -->
    <text x="840" y="46" class="t-big" font-size="22" letter-spacing="5" text-anchor="middle">ARES-VII    INTERPLANETARY TRANSPORT</text>
    <text x="840" y="62" class="t-sub" text-anchor="middle">GENERAL ARRANGEMENT &amp; ON-BOARD SYSTEMS SCHEMATIC</text>
    <!-- right meta -->
    <text x="1646" y="44" class="t-sub" text-anchor="end">CLASSIFICATION : UNCLASSIFIED / PUBLIC RELEASE</text>
    <text x="1646" y="60" class="t-sub" text-anchor="end">THIRD-ANGLE PROJECTION  UNITS : METRIC (m)</text>
  </g>

  <!-- ============================================================= -->
  <!-- ============   VIEW 1 - SIDE ELEVATION (PORT)   ============ -->
  <!-- ============================================================= -->
  <g>
    <rect x="36" y="82" width="1608" height="226" fill="#0a2c4c" opacity="0.22" stroke="#2f6fa8" stroke-width="0.7"/>
    <text x="50" y="100" class="t-title">VIEW A - SIDE ELEVATION  (PORT)</text>
    <text x="1640" y="100" class="t-sub" text-anchor="end">SCALE 1:120  STA. DATUM @ BULKHEAD F-1</text>

    <!-- centerline / section A-A -->
    <line x1="120" y1="192" x2="1560" y2="192" class="center"/>
    <text x="118" y="189" class="t-sta" fill="#7fe0ff">?</text>
    <text x="1562" y="189" class="t-sta" fill="#7fe0ff">?</text>

    <!-- station grid ticks (bottom) -->
    <g class="thin">
      <line x1="372" y1="246" x2="372" y2="252"/><line x1="470" y1="246" x2="470" y2="252"/>
      <line x1="620" y1="246" x2="620" y2="252"/><line x1="900" y1="246" x2="900" y2="252"/>
      <line x1="1170" y1="246" x2="1170" y2="252"/><line x1="1320" y1="246" x2="1320" y2="252"/>
    </g>

    <!-- FUSELAGE OUTLINE -->
    <path class="outline" d="
      M 372,192
      C 380,170 406,148 442,140
      L 470,138
      L 1170,138
      L 1212,139
      L 1248,144
      L 1262,162
      L 1262,222
      L 1248,240
      L 1212,245
      L 1170,246
      L 470,246
      L 442,244
      C 406,236 380,214 372,192 Z"/>
    <!-- hull skin band suggestion -->
    <path class="thin" d="M 470,144 L 1170,144 M 470,240 L 1170,240"/>

    <!-- longitudinal panel lines -->
    <g class="thin">
      <line x1="470" y1="172" x2="1248" y2="172"/>
      <line x1="470" y1="212" x2="1248" y2="212"/>
    </g>

    <!-- docking probe -->
    <path class="outline" d="M 348,189 L 372,189 L 372,195 L 348,195 Z"/>
    <path class="outline" d="M 334,192 L 348,187 L 348,197 Z"/>
    <circle cx="372" cy="192" r="4" class="outline2"/>
    <text x="334" y="183" class="t-sta" text-anchor="middle">IDA-3</text>

    <!-- cockpit windows -->
    <path class="outline2 vol" d="M 402,168 L 452,160 L 456,178 L 406,186 Z"/>
    <line x1="429" y1="164" x2="431" y2="182" class="thin"/>
    <rect x="452" y="184" width="13" height="11" rx="2" class="outline2 vol"/>
    <rect x="452" y="200" width="13" height="9" rx="2" class="outline2 vol"/>

    <!-- avionics / forward service -->
    <g class="thin">
      <line x1="490" y1="138" x2="490" y2="246"/><line x1="540" y1="138" x2="540" y2="246"/>
      <line x1="490" y1="160" x2="540" y2="160"/><line x1="490" y1="200" x2="540" y2="200"/>
    </g>

    <!-- airlock (side hatch) -->
    <rect x="506" y="220" width="40" height="22" rx="5" class="outline"/>
    <line x1="526" y1="220" x2="526" y2="242" class="thin"/>
    <circle cx="518" cy="231" r="2.4" class="outline2"/><circle cx="534" cy="231" r="2.4" class="outline2"/>

    <!-- cargo bay doors (top) -->
    <g>
      <line x1="620" y1="138" x2="900" y2="138" class="outline"/>
      <line x1="760" y1="132" x2="760" y2="138" class="thin"/>
      <g class="thin">
        <line x1="650" y1="132" x2="650" y2="138"/><line x1="685" y1="132" x2="685" y2="138"/>
        <line x1="720" y1="132" x2="720" y2="138"/><line x1="800" y1="132" x2="800" y2="138"/>
        <line x1="835" y1="132" x2="835" y2="138"/><line x1="870" y1="132" x2="870" y2="138"/>
      </g>
      <line x1="620" y1="130" x2="900" y2="130" class="hidden"/>
    </g>
    <!-- cargo bay internal ribs -->
    <g class="thin">
      <line x1="660" y1="138" x2="660" y2="246"/><line x1="700" y1="138" x2="700" y2="246"/>
      <line x1="740" y1="138" x2="740" y2="246"/><line x1="780" y1="138" x2="780" y2="246"/>
      <line x1="820" y1="138" x2="820" y2="246"/><line x1="860" y1="138" x2="860" y2="246"/>
    </g>

    <!-- propellant tank section outline (side) -->
    <g class="thin">
      <line x1="900" y1="138" x2="900" y2="246"/><line x1="1032" y1="138" x2="1032" y2="246"/>
      <line x1="1170" y1="138" x2="1170" y2="246"/>
      <ellipse cx="912" cy="192" rx="12" ry="53" class="outline2"/>
      <ellipse cx="1158" cy="192" rx="12" ry="53" class="outline2"/>
    </g>
    <text x="966" y="196" class="t-sta" text-anchor="middle">LH?</text>
    <text x="1095" y="196" class="t-sta" text-anchor="middle">LOX</text>

    <!-- engine section -->
    <g class="thin">
      <line x1="1190" y1="150" x2="1252" y2="162"/><line x1="1190" y1="234" x2="1252" y2="222"/>
      <circle cx="1212" cy="192" r="9" class="outline2"/>
      <circle cx="1212" cy="192" r="3.5" class="thin"/>
    </g>

    <!-- MAIN ENGINES (bells) -->
    <path class="outline" d="M 1258,168 C 1268,164 1298,162 1326,166 L 1326,184 C 1298,188 1268,188 1258,184 Z"/>
    <path class="outline" d="M 1258,200 C 1268,196 1298,194 1326,198 L 1326,216 C 1298,220 1268,220 1258,216 Z"/>
    <path class="hidden" d="M 1260,184 C 1270,180 1296,179 1320,182 L 1320,198 C 1296,201 1270,201 1260,198 Z"/>
    <path class="thin" d="M 1258,176 C 1278,173 1304,172 1326,175 M 1258,208 C 1278,205 1304,204 1326,207"/>

    <!-- high-gain antenna -->

    <line x1="568" y1="100" x2="584" y2="95" class="thin"/>

    <line x1="512" y1="138" x2="512" y2="92" class="outline2"/>
    <circle cx="512" cy="90" r="2.2" class="outline2"/>

    <!-- solar array booms (edge-on, deployed +Z) -->

      <line x1="700" y1="138" x2="700" y2="118"/><line x1="820" y1="138" x2="820" y2="118"/>
      <line x1="700" y1="118" x2="820" y2="118"/>
      <rect x="694" y="112" width="132" height="6" rx="1"/>
    </g>
    <text x="760" y="108" class="t-sta" text-anchor="middle">PV ARRAY (EDGE)</text>

    <!-- radiator boom (edge-on) -->
    <g class="outline2">
      <line x1="1060" y1="246" x2="1060" y2="268"/><rect x="1010" y="266" width="100" height="6" rx="1"/>
    </g>

    <!-- RCS thruster quads -->
    <g class="outline2">
      <rect x="436" y="132" width="14" height="8"/><rect x="1240" y="150" width="8" height="14"/>
      <rect x="436" y="244" width="14" height="8"/><rect x="1240" y="220" width="8" height="14"/>
    </g>

    <!-- landing gear (deployed) -->
    <g class="outline">
      <!-- nose gear -->
      <line x1="520" y1="246" x2="500" y2="296"/>
      <line x1="526" y1="246" x2="506" y2="296"/>
      <line x1="500" y1="296" x2="478" y2="306"/><line x1="500" y1="296" x2="514" y2="306"/>
      <rect x="476" y="302" width="42" height="7" rx="2"/>
      <!-- main gear -->
      <line x1="1080" y1="246" x2="1106" y2="298"/>
      <line x1="1086" y1="246" x2="1112" y2="298"/>
      <line x1="1106" y1="298" x2="1084" y2="308"/><line x1="1106" y1="298" x2="1128" y2="308"/>
      <rect x="1082" y="304" width="48" height="7" rx="2"/>
    </g>
    <line x1="520" y1="246" x2="500" y2="296" class="hidden" opacity="0.5"/>

    <!-- nav / docking lights -->
    <circle cx="372" cy="192" r="2.4" fill="#ffcf6b"/>
    <circle cx="1170" cy="138" r="2.2" fill="#7fe0ff"/><circle cx="1170" cy="246" r="2.2" fill="#ff6b6b"/>

    <!-- ===== DIMENSIONS ===== -->
    <!-- OAL -->
    <g>
      <line x1="334" y1="248" x2="334" y2="316" class="dimext"/>
      <line x1="1326" y1="220" x2="1326" y2="316" class="dimext"/>
      <line x1="334" y1="312" x2="1326" y2="312" class="dim" marker-start="url(#aDim)" marker-end="url(#aDim)"/>
      <text x="830" y="307" class="t-dim" text-anchor="middle">64.80 m  -  OVERALL LENGTH (O.A.L.)</text>
    </g>
    <!-- diameter -->

      <line x1="1262" y1="140" x2="1380" y2="140" class="dimext"/>
      <line x1="1262" y1="244" x2="1380" y2="244" class="dimext"/>

      <text x="1390" y="196" class="t-dim" transform="rotate(90 1390 196)" text-anchor="middle">? 7.20 m</text>
    </g>
    <!-- cargo length -->
    <g>
      <line x1="620" y1="246" x2="620" y2="276" class="dimext"/>
      <line x1="900" y1="246" x2="900" y2="276" class="dimext"/>
      <line x1="620" y1="272" x2="900" y2="272" class="dim" marker-start="url(#aDim)" marker-end="url(#aDim)"/>
      <text x="760" y="268" class="t-dim" text-anchor="middle">18.60 m</text>
    </g>
    <!-- tank section -->
    <g>
      <line x1="900" y1="276" x2="900" y2="292" class="dimext"/>
      <line x1="1170" y1="276" x2="1170" y2="292" class="dimext"/>
      <line x1="900" y1="288" x2="1170" y2="288" class="dim" marker-start="url(#aDim)" marker-end="url(#aDim)"/>
      <text x="1035" y="285" class="t-dim" text-anchor="middle">18.00 m</text>
    </g>

    <!-- ===== CALLOUTS ===== -->
    <g>
      <line x1="352" y1="190" x2="380" y2="120" class="leader" marker-start="url(#aLead)"/>
      <text x="384" y="118" class="t-call">? DOCKING PORT (IDA)</text>

      <line x1="568" y1="100" x2="600" y2="118" class="leader" marker-start="url(#aLead)"/>
      <text x="604" y="120" class="t-call">? HIGH-GAIN ANTENNA</text>

      <text x="517" y="118" class="t-call">? AVIONICS &amp; COMMS</text>
      <line x1="760" y1="138" x2="760" y2="120" class="leader" marker-start="url(#aLead)"/>

      <text x="880" y="300" class="t-call">? LH? PROPELLANT TANK</text>
      <line x1="1095" y1="232" x2="1120" y2="296" class="leader" marker-start="url(#aLead)"/>
      <text x="1124" y="300" class="t-call">? LOX PROPELLANT TANK</text>
      <line x1="1106" y1="298" x2="1180" y2="296" class="leader" marker-start="url(#aLead)"/>

  </g>

  <!-- ============================================================= -->
  <!-- ============   VIEW 2 - TOP / PLAN VIEW   ================== -->
  <!-- ============================================================= -->
