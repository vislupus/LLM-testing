<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

  .viewer{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;}

</head>
<body>
<div class="viewer">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4200 3200" text-rendering="geometricPrecision" font-family="'Courier New', Consolas, monospace">
  <defs>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#13294a" stroke-width="0.5"/>
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#1a3355" stroke-width="0.7"/>
    </pattern>
    <pattern id="hatch45" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2a5a7a" stroke-width="0.6"/>
    </pattern>
    <pattern id="hatchCross" width="8" height="8" patternUnits="userSpaceOnUse">

      <line x1="6" y1="0" x2="6" y2="12" stroke="#2a5a7a" stroke-width="0.3"/>

    <pattern id="radiatorPe" width="6" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="12" fill="#1a3355" stroke="#2a5a7a" stroke-width="0.3"/>
    </pattern>
    <marker id="arrDim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8c870"/>
    </marker>
    <marker id="arrDimR" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#d8c870"/>
    </marker>
    <marker id="dotL" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
      <circle cx="5" cy="5" r="2.5" fill="#c8dce8"/>
    </marker>
    <marker id="arrCall" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#a8c8e0" stroke-width="0.8"/>

    <style>
      text { fill: #a8c8e0; }
      .lblMajor { fill: #c8dce8; font-size: 14px; font-weight: 700; }
      .lblCall { fill: #a8c8e0; font-size: 11px; }
      .lblDim { fill: #d8c870; font-size: 12px; }
      .lblSmall { fill: #7a9ab8; font-size: 10px; }
      .lblTitle { fill: #d0e0ec; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      .lblSub { fill: #8aaac0; font-size: 12px; }
      .lblView { fill: #c8dce8; font-size: 16px; font-weight: 700; }
      .lblSection { fill: #e8b84d; font-size: 12px; font-weight: 700; }
      .lineMajor { stroke: #c8dce8; stroke-width: 1.8; fill: none; }
      .lineSec { stroke: #5a8aaa; stroke-width: 1.2; fill: none; }
      .lineDetail { stroke: #3a6a8a; stroke-width: 0.8; fill: none; }
      .lineDashed { stroke: #3a6a8a; stroke-width: 0.8; fill: none; stroke-dasharray: 6,4; }
      .lineHatch { stroke: #2a5a7a; stroke-width: 0.5; fill: none; }
      .lineDim { stroke: #d8c870; stroke-width: 1.0; fill: none; }
      .lineLeader { stroke: #a8c8e0; stroke-width: 0.7; fill: none; }
      .extLine { stroke: #5a7a8a; stroke-width: 0.7; fill: none; stroke-dasharray: 2,3; }
      .fillCut { fill: url(#hatch45); opacity: 0.5; }
      .fillSolar { fill: url(#solarCell); }
      .fillRadiator { fill: url(#radiatorPe); }

  <!-- BACKGROUND -->

    <text x="2680" y="180" class="lblDim" style="font-size:9px;">REVIEW</text>

    <!-- Bluepnt stamp -->
    <text x="2510" y="280" class="lblDim" style="font-size:10px;font-weight:700;fill:#e8b84d;">◆ BLUEPRINT — NOT FOR CONSTRUCTION ◆</text>
    <text x="80" y="310" class="lblSmall" style="fill:#5a7a8a;">CONTROLLED DOCUMENT — REPRODUCTION RESTRICTED</text>

    <rect x="8" y="8" width="2164" height="1024" fill="none" stroke="#1a3a5a" stroke-width="0.5"/>
    <path d="M8,20 L8,8 L20,8" class="lineDetail"/>
    <path d="M2172,20 L2172,8 L2160,8" class="lineDetail"/>
    <path d="M8,1032 L8,1020 L20,1020" class="lineDetail"/>
    <path d="M2172,1032 L2172,1020 L2160,1020" class="lineDetail"/>

    <text x="16" y="30" class="lblView">VIEW A — SIDE ELEVATION</text>
    <text x="16" y="48" class="lblSmall">TPS-7 'AURORA' · LONGITUDINAL PROFILE · SCALE 1:200</text>

            class="lineMajor" fill="none"/>

      <path d="M 0,0 C 20,12 60,40 120,90 C 160,120 200,148 225,160"

      <g class="lineDashed" stroke-dasharray="3,3">

        <text x="1250" y="-175" text-anchor="middle">S 25</text>
        <text x="1425" y="-175" text-anchor="middle">S 28+00</text>

      <g transform="translate(425,0)">

        <ellipse cx="5" cy="0" rx="5" ry="25" class="lineSec" fill="#1a3355" fill-opacity="0.4"/>

      <!-- SOLAR ARRAYS -->
      <g transform="translate(780,-160)">
        <line x1="0" y1="0" x2="-8" y2="-200" class="lineSec"/>

    <g class="lblCall">
      <text x="16" y="80" style="font-weight:700;fill:#c8dce8;">1.0 GENERAL</text>
      <text x="20" y="98" class="lblCall">1.1 This document supersedes all previous revisions of TD-7741.</text>
      <text x="20" y="113" class="lblCall">1.2 All dimensions in meters (m) unless otherwise noted.</text>
      <text x="20" y="128" class="lblCall">1.3 Tolerances: Linear ±0.5 mm, Angular ±0.1°.</text>
      <text x="20" y="143" class="lblCall">1.4 Surface finish: Ra 1.6 μm (external), Ra 0.8 μm (internal).</text>

      <text x="16" y="168" style="font-weight:700;fill:#c8dce8;">2.0 STRUCTURAL</text>
      <text x="20" y="186" class="lblCall">2.1 Primary structure: AL-LI 2195-T8, weld class A.</text>
      <text x="20" y="201" class="lblCall">2.2 Pressure vessel: AL-LI 2195, 250 bar design, 375 bar proof.</text>
      <text x="20" y="216" class="lblCall">2.3 Landing gear: Ti-6Al-4V, rated 150 kN per strut.</text>
      <text x="20" y="231" class="lblCall">2.4 Solar array substrate: CFRP, panels hinged at S 15+00.</text>
      <text x="20" y="246" class="lblCall">2.5 Radiator material: Al 2219, 0.5 mm fin thickness.</text>

      <text x="16" y="271" style="font-weight:700;fill:#c8dce8;">3.0 PROPULSION</text>
      <text x="20" y="289" class="lblCall">3.1 Main engines: 4 × staged combustion, LOX/LH2, 1.2 MN ea.</text>
      <text x="20" y="304" class="lblCall">3.2 Vernier thrusters: 2 × bipropellant, 0.04 MN ea.</text>
      <text x="20" y="319" class="lblCall">3.3 Propellant capacity: LH2 320 t, LOX 160 t (80% burnout margin).</text>
      <text x="20" y="334" class="lblCall">3.4 Nozzle material: CuCrZr liner, CfC exit coating.</text>

      <text x="16" y="359" style="font-weight:700;fill:#c8dce8;">4.0 SYSTEMS</text>
      <text x="20" y="377" class="lblCall">4.1 Life support: O2 stored, CO2 scrubbed (LiOH), H2O recycled.</text>
      <text x="20" y="392" class="lblCall">4.2 Avionics: Triple-redundant, MIL-STD-1553B databus.</text>
      <text x="20" y="407" class="lblCall">4.3 Communications: Ka-band HGA (7.5 m), S-band backup.</text>
      <text x="20" y="422" class="lblCall">4.4 Docking: DUGS-7, active/passive, 6-DOF alignment.</text>
      <text x="20" y="437" class="lblCall">4.5 Power: Solar arrays + Li-Ion batteries, 120 V DC bus.</text>

      <text x="16" y="462" style="font-weight:700;fill:#c8dce8;">5.0 NOTES</text>
      <text x="20" y="480" class="lblCall">5.1 Break lines shown as ╌╌╌ indicate partial views.</text>
      <text x="20" y="495" class="lblCall">5.2 Sections A-A, B-B, C-C, D-D correspond to Views A-E.</text>
      <text x="20" y="510" class="lblCall">5.3 Title block references are authoritative for current revision.</text>
      <text x="20" y="525" class="lblCall">5.4 〈 〉 = critical characteristic, ∆ = revised item.</text>
