<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2400" font-family="Consolas, Monaco, 'Courier New', monospace">
  <defs>
    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e3a5f" stroke-width="1"/>
    </pattern>
    
    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00d4ff" />
    </marker>
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffffff" />
    </marker>
    <marker id="dimEnd" markerWidth="5" markerHeight="5" refX="2" refY="2.5" orient="auto">
        <circle cx="2" cy="2" r="2" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="#0b1a2e" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.8" />

  <!-- TITLE BLOCK -->
  <g transform="translate(50, 2250)">
    <rect x="0" y="0" width="1700" height="120" fill="#0f253a" stroke="#00d4ff" stroke-width="2"/>
    <text x="30" y="40" font-size="28" fill="#ffffff" font-weight="bold">AURORA MK-IV ORBITAL TRANSFER VEHICLE</text>
    <text x="30" y="70" font-size="16" fill="#88aadd">GENERAL ARRANGEMENT - MULTI-VIEW PROJECTION (TOP, SIDE, FWD, AFT, SECTIONS)</text>
    <text x="1400" y="40" font-size="16" fill="#00d4ff">DOC: S-2001-A</text>
    <text x="1400" y="70" font-size="16" fill="#00d4ff">SCALE: 1:100</text>
    <text x="1620" y="100" font-size="12" fill="#557799">REV 1.0</text>
    <text x="30" y="100" font-size="12" fill="#557799">ALL DIMENSIONS IN MILLIMETERS UNLESS OTHERWISE STATED</text>
  </g>

  <!-- VIEW A: TOP PLAN -->
  <g transform="translate(600, 150)">
    <text x="300" y="-30" font-size="18" fill="#00d4ff" text-anchor="middle" font-weight="bold">VIEW A: TOP PLAN</text>
    <line x1="300" y1="400" x2="300" y2="500" stroke="#1e3a5f" stroke-dasharray="5,5"/>
    
    <!-- Solar Arrays -->
    <rect x="20" y="280" width="160" height="50" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="100" y1="280" x2="100" y2="330" stroke="#ffffff" stroke-width="1"/>
    
    <rect x="420" y="280" width="160" height="50" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="500" y1="280" x2="500" y2="330" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Main Hull -->
    <path d="M 250 200 L 350 200 L 360 400 L 240 400 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 240 400 L 220 450 L 380 450 L 360 400" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Docking Port -->
    <rect x="280" y="150" width="40" height="50" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Radiators -->
    <path d="M 210 410 L 190 440" stroke="#ffffff" stroke-width="2"/>
    <path d="M 390 410 L 410 440" stroke="#ffffff" stroke-width="2"/>

    <!-- Labels -->
    <line x1="100" y1="250" x2="100" y2="150" stroke="#00d4ff" stroke-width="1"/>
    <text x="100" y="140" font-size="12" fill="#00d4ff">SOLAR ARRAY (PORT)</text>
    
    <line x1="500" y1="250" x2="500" y2="150" stroke="#00d4ff" stroke-width="1"/>
    <text x="500" y="140" font-size="12" fill="#00d4ff">SOLAR ARRAY (STBD)</text>

    <line x1="300" y1="130" x2="300" y2="110" stroke="#ffff00" stroke-width="1"/>
    <text x="300" y="100" font-size="12" fill="#ffff00" text-anchor="middle">DOCKING MECHANISM</text>
  </g>

  <!-- VIEW B: SIDE PROFILE -->
  <g transform="translate(400, 550)">
    <text x="400" y="-30" font-size="18" fill="#00d4ff" text-anchor="middle" font-weight="bold">VIEW B: STARBOARD PROFILE</text>
    
    <!-- Centerline -->
    <line x1="0" y1="300" x2="800" y2="300" stroke="#1e3a5f" stroke-dasharray="5,5"/>

    <!-- COCKPIT -->
    <path d="M 50 280 C 50 260, 130 260, 130 280 L 130 320 L 50 320 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Window -->
    <path d="M 60 280 L 120 280 L 115 300 L 65 300 Z" fill="#ccffff" opacity="0.4"/> 

    <!-- CREW MODULE -->
    <path d="M 130 280 L 350 280 C 380 280, 380 320, 350 320 L 130 320 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Crew Seats (Symbolic) -->
    <rect x="150" y="290" width="20" height="15" fill="none" stroke="#ffffff" stroke-width="1"/>
    <rect x="180" y="290" width="20" height="15" fill="none" stroke="#ffffff" stroke-width="1"/>

    <!-- AIRLOCK / CARGO BAY -->
    <rect x="280" y="320" width="60" height="15" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="310" y1="320" x2="310" y2="335" stroke="#ffffff" stroke-width="1"/>
    <text x="310" y="350" font-size="10" fill="#ffffff" text-anchor="middle">AIRLOCK</text>

    <!-- SERVICE MODULE -->
    <path d="M 350 290 L 600 290 L 620 310 L 330 310 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Propellant Tanks -->
    <ellipse cx="450" cy="300" rx="35" ry="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <ellipse cx="530" cy="300" rx="35" ry="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- ENGINES -->
    <path d="M 600 300 L 630 285 L 630 315 L 600 320" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 630 285 L 660 300 L 660 300 L 630 315" fill="#ffffff" opacity="0.2"/> 
    <!-- RCS Thrusters -->
    <circle cx="620" cy="290" r="2" fill="#ffffff"/>
    <circle cx="620" cy="310" r="2" fill="#ffffff"/>

    <!-- ANTENNA -->
    <line x1="160" y1="280" x2="160" y2="230" stroke="#ffffff" stroke-width="2"/>
    <circle cx="160" cy="230" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- LANDING GEAR -->
    <line x1="180" y1="320" x2="180" y2="380" stroke="#ffffff" stroke-width="2"/>
    <circle cx="180" cy="385" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="350" y1="320" x2="350" y2="380" stroke="#ffffff" stroke-width="2"/>
    <circle cx="350" cy="385" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="550" y1="320" x2="550" y2="380" stroke="#ffffff" stroke-width="2"/>
    <circle cx="550" cy="385" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- SECTION LINES -->
    <line x1="50" y1="250" x2="50" y2="230" stroke="#ff0000" stroke-width="2"/>
    <line x1="50" y1="230" x2="750" y2="230" stroke="#ff0000" stroke-width="1" stroke-dasharray="10,5"/>
    <line x1="750" y1="230" x2="750" y2="250" stroke="#ff0000" stroke-width="2"/>
    <text x="400" y="225" font-size="12" fill="#ff0000" text-anchor="middle">SECTION A-A</text>

    <!-- CALLOUTS -->
    <!-- Cockpit -->
    <line x1="80" y1="250" x2="80" y2="180" stroke="#ffff00" stroke-width="1"/>
    <text x="80" y="170" font-size="12" fill="#ffff00">COCKPIT</text>
    
    <!-- Avionics -->
    <rect x="380" y="265" width="40" height="15" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="265" x2="400" y2="255" stroke="#ffff00" stroke-width="1"/>
    <text x="410" y="250" font-size="12" fill="#ffff00">AVIONICS BAY</text>

    <!-- Engines -->
    <line x1="640" y1="300" x2="640" y2="420" stroke="#ffff00" stroke-width="1"/>
    <text x="640" y="435" font-size="12" fill="#ffff00">MAIN ENGINE (RCS)</text>

    <!-- Dimensions -->
    <!-- Length -->
    <line x1="50" y1="450" x2="660" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="50" y1="445" x2="50" y2="455" stroke="#ffffff" stroke-width="1"/>
    <line x1="660" y1="445" x2="660" y2="455" stroke="#ffffff" stroke-width="1"/>
    <text x="355" y="470" font-size="12" fill="#ffffff" text-anchor="middle">6100 mm</text>
    
    <!-- Height -->
    <line x1="700" y1="230" x2="700" y2="385" stroke="#ffffff" stroke-width="1"/>
    <line x1="695" y1="230" x2="705" y2="230" stroke="#ffffff" stroke-width="1"/>
    <line x1="695" y1="385" x2="705" y2="385" stroke="#ffffff" stroke-width="1"/>
    <text x="720" y="310" font-size="12" fill="#ffffff">15.5m</text>
  </g>

  <!-- VIEW C: FRONT -->
  <g transform="translate(1200, 650)">
    <text x="100" y="-30" font-size="18" fill="#00d4ff" text-anchor="middle" font-weight="bold">VIEW C: FRONT (FORWARD)</text>
    
    <!-- Crew Module Face -->
    <circle cx="100" cy="250" r="70" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="100" cy="250" r="50" fill="none" stroke="#ffffff" stroke-width="1"/>
    <!-- Window -->
    <path d="M 60 220 L 140 220 L 130 250 L 70 250 Z" fill="#ccffff" opacity="0.4"/>
    
    <!-- Wings -->
    <path d="M 30 250 L 10 180 L 10 320 L 30 250" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 170 250 L 190 180 L 190 320 L 170 250" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Vertical Stabilizer -->
    <path d="M 100 180 L 100 120 L 120 180" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Radiators -->
    <rect x="10" y="220" width="10" height="60" fill="none" stroke="#ffffff" stroke-width="1"/>
    <rect x="180" y="220" width="10" height="60" fill="none" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Landing Gear -->
    <line x1="100" y1="320" x2="100" y2="360" stroke="#ffffff" stroke-width="2"/>
    <circle cx="100" cy="365" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Callouts -->
    <text x="20" y="170" font-size="12" fill="#ffff00">RADIATOR</text>
    <text x="60" y="130" font-size="12" fill="#ffff00">CREW COMPARTMENT</text>
  </g>

  <!-- VIEW D: REAR -->
  <g transform="translate(1200, 1050)">
    <text x="100" y="-30" font-size="18" fill="#00d4ff" text-anchor="middle" font-weight="bold">VIEW D: REAR (AFT)</text>
    
    <!-- Service Module Rear -->
    <rect x="40" y="200" width="120" height="100" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Engine Bells -->
    <path d="M 60 320 L 60 340 L 90 340 L 90 320" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 110 320 L 110 340 L 140 340 L 140 320" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="75" cy="320" rx="15" ry="5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="125" cy="320" rx="15" ry="5" fill="none" stroke="#ffffff" stroke-width="2"/>

    <text x="70" y="360" font-size="12" fill="#ffff00">MAIN ENGINE</text>
    <text x="50" y="190" font-size="12" fill="#ffff00">SERVICE MODULE</text>
  </g>

  <!-- VIEW E: CUTAWAY SECTION A-A -->
  <g transform="translate(400, 1300)">
    <text x="400" y="0" font-size="18" fill="#00d4ff" text-anchor="middle" font-weight="bold">VIEW E: SECTION A-A (LONGITUDINAL CUTAWAY)</text>
    <text x="400" y="20" font-size="14" fill="#00d4ff" text-anchor="middle">INTERIOR ARRANGEMENT</text>

    <!-- Reference to Profile -->
    <text x="40" y="200" font-size="10" fill="#aaccee">PROFILE OUTLINE</text>

    <!-- Right Half (External Shell - Ghosted) -->
    <path d="M 400 100 L 660 100 L 660 250 L 400 250" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 400 100 C 400 80, 660 80, 660 100" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Left Half (Internal Details) -->
    <path d="M 400 100 L 50 100 L 50 250 L 400 250" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 400 100 C 400 80, 50 80, 50 100" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Internal Layout -->
    <!-- Pilot Seat -->
    <path d="M 80 120 L 110 120 L 110 150 L 80 150" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="95" y="115" font-size="10" fill="#00d4ff" text-anchor="middle">PILOT</text>
    
    <!-- Life Support System (LSS) -->
    <rect x="130" y="130" width="30" height="20" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,1"/>
    <text x="145" y="125" font-size="8" fill="#00d4ff" text-anchor="middle">LSS</text>
    
    <!-- Avionics Bay -->
    <rect x="180" y="110" width="50" height="20" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="205" y="105" font-size="8" fill="#00d4ff" text-anchor="middle">AVIONICS</text>

    <!-- Cargo Bay -->
    <rect x="250" y="130" width="80" height="40" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="290" y="180" font-size="8" fill="#00d4ff" text-anchor="middle">CARGO BAY</text>
    
    <!-- Fuel Tanks (Internal) -->
    <ellipse cx="500" cy="150" rx="40" ry="15" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="500" y="155" font-size="8" fill="#00d4ff" text-anchor="middle">LOX/LH2</text>
    
    <!-- Fuel Lines -->
    <path d="M 400 150 L 460 150" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Centerline -->
    <line x1="400" y1="70" x2="400" y2="270" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Section Cut Edge -->
    <line x1="50" y1="100" x2="400" y2="100" stroke="#ffffff" stroke-width="3"/>
    <line x1="50" y1="250" x2="400" y2="250" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- NOTES & LEGEND -->
  <g transform="translate(50, 1750)">
    <rect x="0" y="0" width="500" height="200" fill="#0f253a" stroke="#00d4ff" stroke-width="1"/>
    <text x="20" y="30" font-size="16" fill="#ffffff" font-weight="bold">COMPONENT LEGEND</text>
    
    <line x1="20" y1="50" x2="40" y2="50" stroke="#ffffff" stroke-width="2"/>
    <text x="50" y="55" font-size="14" fill="#aaccee">PRIMARY STRUCTURE (CFRP)</text>
    
    <line x1="20" y1="70" x2="40" y2="50" stroke="#ffffff" stroke-width="1" transform="translate(0, 20)"/>
    <text x="50" y="75" font-size="14" fill="#aaccee">SECONDARY STRUCTURE</text>
    
    <line x1="20" y1="90" x2="40" y2="90" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="50" y="95" font-size="14" fill="#aaccee">INTERNAL / HIDDEN</text>
    
    <line x1="20" y1="120" x2="40" y2="120" stroke="#ffff00" stroke-width="1"/>
    <text x="50" y="125" font-size="14" fill="#ffff00">CALLOUT / HIGHLIGHT</text>
  </g>
  
  <g transform="translate(600, 1750)">
    <text x="0" y="20" font-size="14" fill="#aaccee">
      <tspan x="0" dy="0">NOTES:</tspan>
      <tspan x="0" dy="25">1. MASS: 12,500 KG (DRY)</tspan>
      <tspan x="0" dy="20">2. CREW CAPACITY: 4 + 2</tspan>
      <tspan x="0" dy="20">3. PROPELLANT: LOX/LH2</tspan>
      <tspan x="0" dy="20">4. DELTA-V CAPACITY: 4.5 KM/S</tspan>
    </text>
  </g>

</svg>