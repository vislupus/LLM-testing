<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <!-- Blueprint Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#004466" stroke-width="0.5"/>
    </pattern>
    <pattern id="subgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#004466" stroke-width="0.2"/>
    </pattern>
    
    <!-- Textures -->
    <pattern id="solar-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#001122"/>
      <path d="M 0 0 L 4 4 M 4 0 L 0 4" stroke="#0088ff" stroke-width="0.1"/>
    </pattern>
    
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00ccff" />
    </marker>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="#001122" />
  <rect width="100%" height="100%" fill="url(#subgrid)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <style>
    .hull { fill: none; stroke: #00ccff; stroke-width: 1.5; stroke-linejoin: round; }
    .detail { fill: none; stroke: #00ccff; stroke-width: 0.6; opacity: 0.7; }
    .cutaway-fill { fill: #002233; fill-opacity: 0.8; }
    .internal { stroke: #ff9900; stroke-width: 1; fill: none; }
    .dimension { stroke: #0088aa; stroke-width: 0.8; fill: none; }
    .text-main { fill: #00ccff; font-family: 'Segoe UI', 'Courier New', monospace; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .text-title { fill: #ffffff; font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 2px; }
    .text-dim { fill: #0088aa; font-family: monospace; font-size: 9px; }
    .centerline { stroke: #ffffff; stroke-width: 0.5; stroke-dasharray: 10, 5, 2, 5; opacity: 0.3; }
    .propulsion { fill: none; stroke: #ff3300; stroke-width: 1.2; }
  </style>

  <!-- Title Block -->
  <g transform="translate(1250, 850)">
    <rect width="320" height="120" fill="#001122" stroke="#00ccff" stroke-width="2"/>
    <text x="10" y="25" class="text-title">X-12 INTERSTELLAR EXPLORER</text>
    <text x="10" y="45" class="text-main" fill="#ffffff">SYSTEM SCHEMATIC // REV 4.02</text>
    <line x1="0" y1="55" x2="320" y2="55" stroke="#00ccff"/>
    <text x="10" y="70" class="text-main">DRAWN BY: AI-ENG CORE</text>
    <text x="10" y="85" class="text-main">SCALE: 1:250m</text>
    <text x="10" y="100" class="text-main">SHEET: 01 OF 01</text>
  </g>

  <!-- 1. TOP VIEW (Y: 100-300) -->
  <g id="top-view" transform="translate(450, 150)">
    <text x="-50" y="-80" class="text-main" font-size="14">Fig 01: Dorsal Profile (Top View)</text>
    <line x1="-150" y1="0" x2="600" y2="0" class="centerline" />
    
    <!-- Solar Arrays -->
    <rect x="150" y="-180" width="100" height="150" fill="url(#solar-pattern)" class="hull" />
    <rect x="150" y="30" width="100" height="150" fill="url(#solar-pattern)" class="hull" />
    
    <!-- Main Hull -->
    <path d="M -100,0 L -60,-40 L 100,-40 L 300,-60 L 450,-50 L 500,-20 L 500,20 L 450,50 L 300,60 L 100,40 L -60,40 Z" class="hull" />
    
    <!-- Radiators -->
    <rect x="320" y="-80" width="80" height="20" class="detail" />
    <rect x="320" y="60" width="80" height="20" class="detail" />
    
    <!-- Cockpit Detail -->
    <path d="M -40,-20 L 20,-20 L 20,20 L -40,20 Z" class="detail" />
    
    <!-- Docking Port Top -->
    <circle cx="200" cy="0" r="15" class="detail" />
  </g>

  <!-- 2. SIDE VIEW (Y: 400-600) -->
  <g id="side-view" transform="translate(450, 450)">
    <text x="-50" y="-80" class="text-main" font-size="14">Fig 02: Port Profile (Side View)</text>
    <line x1="-150" y1="0" x2="600" y2="0" class="centerline" />
    
    <!-- Landing Gear (Extended) -->
    <line x1="0" y1="40" x2="-20" y2="100" class="hull" />
    <rect x="-40" y="100" width="40" height="5" class="hull" />
    <line x1="400" y1="50" x2="420" y2="100" class="hull" />
    <rect x="400" y="100" width="40" height="5" class="hull" />

    <!-- Hull -->
    <path d="M -100,0 L -50,-30 L 100,-30 L 400,-40 L 480,-20 L 490,20 L 440,50 L 100,40 L -50,40 Z" class="hull" />
    
    <!-- Windows -->
    <rect x="-30" y="-10" width="40" height="15" class="detail" />
    
    <!-- Airlock -->
    <rect x="80" y="0" width="20" height="30" rx="5" class="detail" />
    
    <!-- Antenna -->
    <line x1="120" y1="-30" x2="150" y2="-70" class="hull" />
    <path d="M 140,-75 Q 150,-85 160,-75" class="hull" />

    <!-- Engines -->
    <path d="M 490,-15 L 530,-25 L 530,25 L 490,15 Z" class="hull" />
  </g>

  <!-- 3. CUTAWAY VIEW (Y: 700-900) -->
  <g id="cutaway-view" transform="translate(450, 750)">
    <text x="-50" y="-80" class="text-main" font-size="14" fill="#ff9900">Fig 03: Internal Systems (Cutaway)</text>
    
    <!-- Background Ghost Hull -->
    <path d="M -100,0 L -50,-30 L 100,-30 L 400,-40 L 480,-20 L 490,20 L 440,50 L 100,40 L -50,40 Z" class="hull" opacity="0.2" />

    <!-- Cockpit/Avionics -->
    <rect x="-80" y="-10" width="60" height="40" class="internal" />
    <text x="-75" y="15" class="text-dim" fill="#ff9900">AVIONICS</text>

    <!-- Crew Module -->
    <rect x="-10" y="-20" width="120" height="55" class="internal" />
    <text x="10" y="15" class="text-dim" fill="#ff9900">CREW HABITATION</text>
    
    <!-- Life Support -->
    <rect x="110" y="0" width="50" height="35" class="internal" />
    <text x="115" y="50" class="text-dim" fill="#ff9900">ECLSS</text>

    <!-- Cargo Bay -->
    <rect x="170" y="-25" width="120" height="60" rx="2" class="internal" />
    <text x="200" y="10" class="text-dim" fill="#ff9900">CARGO BAY</text>

    <!-- Propellant Tanks (Spherical) -->
    <circle cx="340" cy="0" r="30" class="internal" />
    <circle cx="410" cy="0" r="25" class="internal" />
    <text x="325" y="45" class="text-dim" fill="#ff9900">LH2</text>
    <text x="400" y="45" class="text-dim" fill="#ff9900">LOX</text>

    <!-- Engine Reactor -->
    <path d="M 440,-10 L 480,-15 L 480,15 L 440,10 Z" class="propulsion" />
  </g>

  <!-- 4. FRONT & REAR VIEW -->
  <g transform="translate(100, 450)">
    <!-- Front View -->
    <g transform="translate(0, -150)">
        <text x="-40" y="-100" class="text-main">Fig 04: Front View</text>
        <path d="M 0,-40 L 40,0 L 0,40 L -40,0 Z" class="hull" />
        <circle cx="0" cy="0" r="10" class="detail" />
        <!-- Extended Solar Edges -->
        <line x1="-40" y1="0" x2="-100" y2="0" class="detail" />
        <line x1="40" y1="0" x2="100" y2="0" class="detail" />
    </g>

    <!-- Rear View -->
    <g transform="translate(0, 150)">
        <text x="-40" y="-100" class="text-main">Fig 05: Rear View</text>
        <path d="M 0,-60 L 60,0 L 0,60 L -60,0 Z" class="hull" />
        <!-- Exhaust nozzles -->
        <circle cx="-15" cy="0" r="12" class="propulsion" />
        <circle cx="15" cy="0" r="12" class="propulsion" />
    </g>
  </g>

  <!-- Dimensions & Callouts -->
  <g id="annotations">
    <!-- Main length dimension -->
    <line x1="350" y1="580" x2="980" y2="580" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="650" y="575" class="text-dim">TOTAL LENGTH: 48.2m</text>
    
    <!-- Propellant system callout -->
    <line x1="820" y1="750" x2="880" y2="680" class="dimension" />
    <text x="890" y="675" class="text-main" fill="#ff9900">Propellant Feed System</text>
    
    <!-- Cockpit callout -->
    <line x1="410" y1="440" x2="350" y2="380" class="dimension" />
    <text x="250" y="375" class="text-main">Pressurized Cockpit</text>

    <!-- Docking port callout -->
    <line x1="650" y1="150" x2="700" y2="100" class="dimension" />
    <text x="710" y="95" class="text-main">IDP-4 Docking Port</text>
  </g>

  <!-- Scale Marker -->
  <g transform="translate(50, 930)">
    <rect width="100" height="5" fill="#00ccff" />
    <text x="0" y="20" class="text-dim">0m</text>
    <text x="90" y="20" class="text-dim">10m</text>
    <text x="0" y="-10" class="text-main">Linear Scale</text>
  </g>

  <!-- Structural Tags -->
  <g transform="translate(1300, 100)">
    <text x="0" y="0" class="text-main" fill="#ff9900">Internal Key:</text>
    <rect x="0" y="10" width="10" height="10" fill="none" stroke="#ff9900" />
    <text x="15" y="20" class="text-dim">Structural Frame</text>
    <rect x="0" y="30" width="10" height="10" fill="none" stroke="#ff3300" />
    <text x="15" y="40" class="text-dim">High-Temp Propulsion</text>
  </g>

</svg>