<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <!-- Background and Title Block -->
  <rect width="1400" height="1000" fill="#f8f8f8"/>
  <rect x="1150" y="820" width="240" height="170" fill="none" stroke="#000" stroke-width="1"/>
  <text x="1160" y="840" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SPACECRAFT BLUEPRINT</text>
  <text x="1160" y="855" font-family="Arial, sans-serif" font-size="10">Model: Orion-X Multi-Role Vehicle</text>
  <text x="1160" y="870" font-family="Arial, sans-serif" font-size="10">Scale: 1:1000</text>
  <text x="1160" y="885" font-family="Arial, sans-serif" font-size="10">Drawn: 2024</text>
  <text x="1160" y="900" font-family="Arial, sans-serif" font-size="10">Sheet: 1/1</text>
  <text x="1160" y="915" font-family="Arial, sans-serif" font-size="10">Rev: A</text>

  <!-- Scale Bar -->
  <g transform="translate(20, 940)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="-5" x2="100" y2="5" stroke="#000" stroke-width="2"/>
    <text x="50" y="-10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">100m</text>
    <text x="50" y="20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Scale Bar</text>
  </g>

  <!-- Section Lines Legend -->
  <g transform="translate(20, 20)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
    <polyline points="30,0 35,5 30,10" fill="none" stroke="#000" stroke-width="2"/>
    <text x="40" y="5" font-family="Arial, sans-serif" font-size="12">A-A</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" font-weight="bold">SECTION A-A</text>
  </g>

  <!-- Views Layout Grid (light guides) -->
  <g stroke="#ccc" stroke-width="0.5" stroke-dasharray="2,2">
    <line x1="200" y1="50" x2="200" y2="750"/>
    <line x1="700" y1="50" x2="700" y2="750"/>
    <line x1="1100" y1="50" x2="1100" y2="750"/>
    <line x1="50" y1="350" x2="1350" y2="350"/>
  </g>

  <!-- TOP VIEW (Left Top: 50-650 x 50-350) -->
  <g transform="translate(100, 100)" font-family="Arial, sans-serif">
    <!-- Title -->
    <text x="0" y="-20" font-size="16" font-weight="bold" text-anchor="middle">TOP VIEW</text>
    
    <!-- Main Body (50m L x 8m W) -->
    <rect x="0" y="25" width="500" height="80" rx="20" ry="20" fill="none" stroke="#000" stroke-width="3"/>
    <!-- Nose Cone -->
    <path d="M 0 45 Q -20 25 0 5 L 0 25 Z" fill="none" stroke="#000" stroke-width="3"/>
    <path d="M 500 45 Q 520 25 500 5 L 500 25 Z" fill="none" stroke="#000" stroke-width="3"/>
    
    <!-- Crew Module Outline -->
    <ellipse cx="75" cy="65" rx="30" ry="15" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Cargo Bay Doors -->
    <rect x="200" y="30" width="100" height="70" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="200" y1="45" x2="300" y2="45" stroke="#333" stroke-width="1.5"/>
    
    <!-- Solar Arrays (Folded) -->
    <rect x="-50" y="10" width="30" height="120" fill="none" stroke="#555" stroke-width="1"/>
    <rect x="520" y="10" width="30" height="120" fill="none" stroke="#555" stroke-width="1"/>
    
    <!-- Radiators -->
    <rect x="150" y="-10" width="10" height="40" fill="none" stroke="#555" stroke-width="1"/>
    <rect x="340" y="-10" width="10" height="40" fill="none" stroke="#555" stroke-width="1"/>
    
    <!-- Antennas -->
    <circle cx="250" cy="20" r="5" fill="none" stroke="#555" stroke-width="1"/>
    <line x1="250" y1="15" x2="250" y2="0" stroke="#555" stroke-width="1"/>
    
    <!-- Dimensions -->
    <!-- Overall Length -->
    <g stroke="#000" stroke-width="1">
      <line x1="-10" y1="0" x2="-10" y2="110" />
      <line x1="510" y1="0" x2="510" y2="110" />
      <line x1="-10" y1="0" x2="510" y2="0" stroke-dasharray="2,2"/>
      <polyline points="-10,0 -5,5 -10,10" />
      <polyline points="510,0 505,5 510,10" />
      <text x="250" y="130" font-size="12" text-anchor="middle">50 m</text>
    </g>
    <!-- Width -->
    <g stroke="#000" stroke-width="1" transform="translate(0,110)">
      <line x1="0" y1="0" x2="110" y2="0" stroke-dasharray="2,2"/>
      <line x1="0" y1="-10" x2="0" y2="10" />
      <line x1="110" y1="-10" x2="110" y2="10" />
      <polyline points="0,-10 5,-5 10,-10" />
      <polyline points="110,-10 105,-5 100,-10" />
      <text x="55" y="25" font-size="12" text-anchor="middle">8 m</text>
    </g>
    
    <!-- Labels with Leaders -->
    <g font-size="10" stroke="#000" stroke-width="0.8">
      <!-- Engines -->
      <line x1="450" y1="90" x2="480" y2="110" />
      <polyline points="480,110 485,105 480,100" />
      <text x="490" y="108">9x Raptor Engines</text>
      <!-- Propellant Tanks -->
      <line x1="250" y1="105" x2="280" y2="125" />
      <text x="285" y="128">LOX/CH4 Tanks (2x)</text>
      <!-- Crew Module -->
      <line x1="75" y1="50" x2="105" y2="30" />
      <text x="110" y="33">Crew Module</text>
      <!-- Cargo Bay -->
      <line x1="250" y1="45" x2="280" y2="25" />
      <text x="285" y="28">Cargo Bay</text>
      <!-- Solar Arrays -->
      <line x1="-25" y1="70" x2="0" y2="50" />
      <text x="5" y="53" transform="rotate(-90 5 53)">Solar Arrays (Deployable)</text>
    </g>
  </g>

  <!-- FRONT VIEW (Center Top: 650-1050 x 50-350) -->
  <g transform="translate(600, 100)" font-family="Arial, sans-serif">
    <text x="0" y="-20" font-size="16" font-weight="bold" text-anchor="middle">FRONT VIEW</text>
    
    <!-- Nose/Cockpit -->
    <circle cx="200" cy="100" r="40" fill="none" stroke="#000" stroke-width="3"/>
    <path d="M 160 100 Q 200 40 240 100" fill="none" stroke="#000" stroke-width="3"/>
    
    <!-- Main Body -->
    <ellipse cx="200" cy="145" rx="40" ry="25" fill="none" stroke="#000" stroke-width="3"/>
    
    <!-- Docking Port -->
    <circle cx="200" cy="60" r="10" fill="none" stroke="#333" stroke-width="2"/>
    
    <!-- Radiators -->
    <rect x="170" y="120" width="5" height="50" rx="2" fill="none" stroke="#555" stroke-width="1"/>
    <rect x="225" y="120" width="5" height="50" rx="2" fill="none" stroke="#555" stroke-width="1"/>
    
    <!-- Antennas -->
    <circle cx="185" cy="80" r="3" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="215" cy="80" r="3" fill="none" stroke="#555" stroke-width="1"/>
    
    <!-- Dimensions -->
    <g stroke="#000" stroke-width="1">
      <line x1="120" y1="65" x2="280" y2="65" stroke-dasharray="2,2"/>
      <line x1="120" y1="55" x2="120" y2="75" />
      <line x1="280" y1="55" x2="280" y2="75" />
      <polyline points="120,55 115,60 120,65" />
      <polyline points="280,55 285,60 280,65" />
      <text x="200" y="90" font-size="12" text-anchor="middle">8 m Dia.</text>
    </g>
    
    <!-- Labels -->
    <g font-size="10" stroke="#000" stroke-width="0.8">
      <line x1="200" y1="50" x2="230" y2="30" />
      <text x="235" y="33">Docking Port</text>
      <line x1="200" y1="110" x2="230" y2="90" />
      <text x="235" y="93">Cockpit</text>
    </g>
  </g>

  <!-- SIDE VIEW (Right Top: 1050-1350 x 50-350) -->
  <g transform="translate(1100, 100)" font-family="Arial, sans-serif">
    <text x="0" y="-20" font-size="16" font-weight="bold" text-anchor="middle">SIDE VIEW</text>
    
    <!-- Main Profile (50m L x 8m H) -->
    <rect x="0" y="25" width="500" height="80" rx="20" ry="20" fill="none" stroke="#000" stroke-width="3"/>
    <!-- Nose -->
    <path d="M 0 45 Q -30 25 0 5" fill="none" stroke="#000" stroke-width="3"/>
    <line x1="0" y1="5" x2="0" y2="25" stroke="#000" stroke-width="3"/>
    <!-- Engine Nozzle -->
    <path d="M 500 65 Q 530 85 500 105 L 500 85 Z" fill="none" stroke="#000" stroke-width="3"/>
    
    <!-- Crew Module -->
    <ellipse cx="80" cy="65" rx="35" ry="20" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Airlocks -->
    <circle cx="120" cy="35" r="8" fill="none" stroke="#555" stroke-width="1.5"/>
    <circle cx="120" cy="95" r="8" fill="none" stroke="#555" stroke-width="1.5"/>
    
    <!-- Cargo Bay -->
    <rect x="180" y="30" width="140" height="60" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="180" y1="50" x2="320" y2="50" stroke="#333" stroke-width="1.5"/>
    
    <!-- Landing Gear (Stowed) -->
    <rect x="400" y="85" width="20" height="15" rx="3" fill="none" stroke="#666" stroke-width="1"/>
    <rect x="420" y="85" width="20" height="15" rx="3" fill="none" stroke="#666" stroke-width="1"/>
    
    <!-- Radiators -->
    <path d="M 150 0 L 160 -20 L 170 0 L 160 20 Z" fill="none" stroke="#555" stroke-width="1"/>
    <path d="M 350 0 L 360 -20 L 370 0 L 360 20 Z" fill="none" stroke="#555" stroke-width="1"/>
    
    <!-- Solar Arrays Stowed -->
    <rect x="-40" y="20" width="25" height="60" fill="none" stroke="#555" stroke-width="1"/>
    
    <!-- Dimensions (Height) -->
    <g stroke="#000" stroke-width="1">
      <line x1="-10" y1="0" x2="-10" y2="110" />
      <line x1="10" y1="0" x2="10" y2="110" />
      <line x1="-10" y1="0" x2="10" y2="0" stroke-dasharray="2,2"/>
      <text x="0" y="125" font-size="12" text-anchor="middle" transform="rotate(-90 0 125)">8 m</text>
    </g>
    
    <!-- Labels -->
    <g font-size="10" stroke="#000" stroke-width="0.8">
      <line x1="80" y1="45" x2="110" y2="25" />
      <text x="115" y="28">Crew Module</text>
      <line x1="250" y1="25" x2="280" y2="5" />
      <text x="285" y="8">Cargo Bay</text>
      <line x1="130" y1="25" x2="160" y2="5" />
      <text x="165" y="8">Airlock (Upper)</text>
      <line x1="410" y1="100" x2="440" y2="120" />
      <text x="445" y="123">Landing Gear</text>
      <line x1="480" y1="95" x2="510" y2="115" />
      <text x="515" y="118">Engines</text>
    </g>
  </g>

  <!-- REAR VIEW (Left Bottom: 50-650 x 400-750) -->
  <g transform="translate(100, 500)" font-family="Arial, sans-serif">
    <text x="0" y="-20" font-size="16" font-weight="bold" text-anchor="middle">REAR VIEW</text>
    
    <!-- Engine Cluster (9 engines in 3x3 grid) -->
    <g stroke="#000" stroke-width="2.5">
      <ellipse cx="100" cy="75" rx="20" ry="30" fill="none"/>
      <ellipse cx="200" cy="50" rx="20" ry="30" fill="none"/>
      <ellipse cx="200" cy="125" rx="20" ry="30" fill="none"/>
      <ellipse cx="300" cy="75" rx="20" ry="30" fill="none"/>
      <!-- Central -->
      <ellipse cx="200" cy="75" rx="25" ry="35" fill="none"/>
    </g>
    
    <!-- Main Body -->
    <ellipse cx="200" cy="75" rx="40" ry="25" fill="none" stroke="#000" stroke-width="3"/>
    
    <!-- RCS Thrusters -->
    <circle cx="140" cy="30" r="4" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="260" cy="30" r="4" fill="none" stroke="#555" stroke-width="1"/>
    
    <!-- Dimensions -->
    <g stroke="#000" stroke-width="1">
      <line x1="120" y1="35" x2="280" y2="35" stroke-dasharray="2,2"/>
      <line x1="120" y1="25" x2="120" y2="45"/>
      <line x1="280" y1="25" x2="280" y2="45"/>
      <polyline points="120,25 115,30 120,35"/>
      <polyline points="280,25 285,30 280,35"/>
      <text x="200" y="60" font-size="12" text-anchor="middle">8 m</text>
    </g>
    
    <!-- Labels -->
    <g font-size="10" stroke="#000" stroke-width="0.8">
      <line x1="200" y1="120" x2="230" y2="140"/>
      <text x="235" y="143">Main Engines (9x)</text>
    </g>
  </g>

  <!-- CUTAWAY VIEW (SECTION A-A: Center Bottom: 650-1050 x 400-750) -->
  <g transform="translate(700, 500)" font-family="Arial, sans-serif">
    <text x="-50" y="-20" font-size="16" font-weight="bold">CUTAWAY VIEW - SECTION A-A</text>
    
    <!-- External Shell (Hatch Lines) -->
    <rect x="-250" y="25" width="500" height="80" rx="20" ry="20" fill="none" stroke="#000" stroke-width="3"/>
    <path d="M -250 45 Q -280 25 -250 5" fill="none" stroke="#000" stroke-width="3"/>
    
    <!-- Internal Structures (Thinner Lines) -->
    <!-- Propellant Tanks -->
    <rect x="-200" y="35" width="400" height="60" fill="#e6f3ff" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="-100" y1="35" x2="-100" y2="95" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/> <!-- Baffle -->
    
    <!-- Avionics Bay -->
    <rect x="-240" y="45" width="60" height="40" fill="#fff3cd" stroke="#555" stroke-width="1.5"/>
    
    <!-- Life Support -->
    <rect x="100" y="45" width="50" height="40" fill="#d4edda" stroke="#555" stroke-width="1.5"/>
    
    <!-- Crew Module Internal -->
    <ellipse cx="-150" cy="65" rx="30" ry="15" fill="#f8d7da" stroke="#333" stroke-width="2"/>
    <circle cx="-170" cy="65" r="5" fill="#dc3545" stroke="#333" stroke-width="1"/> <!-- Window -->
    
    <!-- Cargo Bay Internal -->
    <rect x="-50" y="35" width="100" height="60" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- Engines Internal (Piping) -->
    <path d="M 200 55 L 240 55 L 240 75 L 200 75 Z" fill="#dee2e6" stroke="#000" stroke-width="2"/>
    
    <!-- Hatches/Airlocks -->
    <circle cx="-80" cy="35" r="8" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="-80" cy="95" r="8" fill="none" stroke="#666" stroke-width="2"/>
    
    <!-- Labels -->
    <g font-size="10" stroke="#000" stroke-width="0.8">
      <line x1="-220" y1="35" x2="-250" y2="15"/>
      <text x="-255" y="18">Avionics</text>
      <line x1="-125" y1="50" x2="-155" y2="30"/>
      <text x="-160" y="33">Crew Module (Life Support)</text>
      <line x1="125" y1="55" x2="155" y2="35"/>
      <text x="160" y="38">Life-Support Systems</text>
      <line x1="-25" y1="25" x2="5" y2="5"/>
      <text x="10" y="8">Cargo Bay</text>
      <line x1="-100" y1="105" x2="-130" y2="125"/>
      <text x="-135" y="128">Propellant Tanks</text>
      <line x1="220" y1="75" x2="250" y2="95"/>
      <text x="255" y="98">Engine Manifold</text>
    </g>
  </g>
</svg>
