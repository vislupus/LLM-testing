<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Blueprint Background -->
  <rect width="1200" height="900" fill="#0b1e33"/>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#2d5a7d" stroke-width="2"/>
  
  <!-- Grid Lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c3a5e" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- Style Definitions -->
  <style>
    .line { stroke: #64d2ff; stroke-width: 1.5; fill: none; }
    .text { fill: #64d2ff; font-family: 'Courier New', monospace; font-size: 12px; }
    .dim { stroke: #ff9d00; stroke-width: 1; stroke-dasharray: 4 2; }
  </style>

  <!-- TOP VIEW (Simplified projection) -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="300" height="100" class="line"/>
    <text x="100" y="-10" class="text">TOP VIEW (PLAN)</text>
    <line x1="300" y1="50" x2="350" y2="50" class="dim"/>
    <text x="310" y="40" class="text" fill="#ff9d00">12.5m</text>
  </g>

  <!-- SIDE VIEW (Main schematic) -->
  <g transform="translate(100, 250)">
    <text x="0" y="-20" class="text">SIDE ELEVATION &amp; CUTAWAY</text>
    <!-- Hull -->
    <path d="M 0 0 L 400 0 L 450 50 L 400 100 L 0 100 L 0 0" class="line"/>
    <!-- Internal Sections -->
    <line x1="100" y1="0" x2="100" y2="100" class="line" stroke-dasharray="5 5"/>
    <line x1="300" y1="0" x2="300" y2="100" class="line" stroke-dasharray="5 5"/>
    <!-- Components -->
    <rect x="20" y="25" width="40" height="50" class="line"/> <!-- Cockpit -->
    <rect x="150" y="10" width="100" height="80" class="line"/> <!-- Cargo Bay -->
    <circle cx="425" cy="50" r="20" class="line"/> <!-- Engine -->
    <!-- Labels -->
    <text x="20" y="120" class="text">COCKPIT/AVIONICS</text>
    <text x="150" y="120" class="text">CARGO BAY</text>
    <text x="350" y="120" class="text">PROPULSION</text>
  </g>

  <!-- FRONT/REAR VIEWS -->
  <g transform="translate(700, 250)">
    <circle cx="50" cy="50" r="50" class="line"/>
    <text x="0" y="120" class="text">FRONT VIEW</text>
    <rect x="200" y="0" width="100" height="100" class="line"/>
    <text x="200" y="120" class="text">REAR VIEW</text>
  </g>

  <!-- Technical Annotations -->
  <g transform="translate(50, 700)">
    <text x="0" y="0" class="text" style="font-size: 16px; font-weight: bold;">SPECIFICATIONS:</text>
    <text x="0" y="30" class="text">- PROPULSION: ION THRUSTER ARRAY (X4)</text>
    <text x="0" y="50" class="text">- LIFE SUPPORT: CLOSED-LOOP O2 RECYCLER</text>
    <text x="0" y="70" class="text">- THERMAL: RADIATOR WING-SPAN 18M</text>
    <text x="0" y="90" class="text">- DOCKING: ANDROGYNOUS PERIPHERAL SYSTEM</text>
  </g>

  <!-- Callout lines -->
  <line x1="120" y1="250" x2="150" y2="200" class="dim"/>
  <circle cx="150" cy="200" r="3" fill="#ff9d00"/>
  <text x="160" y="200" class="text" fill="#ff9d00">DOCKED CONFIG</text>
</svg>