<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
     viewBox="0 0 1200 900" width="1200" height="900" style="font-family: 'Arial', sans-serif;">
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  
  <!-- Title Block -->
  <g id="title-block">
    <rect x="20" y="850" width="1160" height="30" fill="#1a237e" stroke="#000" stroke-width="1"/>
    <text x="40" y="875" fill="white" font-size="14" font-weight="bold">
      TECHNICAL SCHEMATIC - MULTI-ROLE ORBITAL SPACECRAFT (MROS-7A) - SCALE 1:200
    </text>
    <text x="1000" y="875" fill="white" font-size="12">DWG. NO: MS-2024-001</text>
  </g>
  
  <!-- Main Views Container -->
  <g id="views">
    
    <!-- Top View -->
    <g id="top-view" transform="translate(50, 50)">
      <rect x="0" y="0" width="500" height="200" fill="none" stroke="#333" stroke-width="2"/>
      <text x="250" y="15" text-anchor="middle" font-weight="bold" fill="#1a237e">TOP VIEW</text>
      
      <!-- Spacecraft Body -->
      <path d="M50,100 L200,30 L350,30 L500,100 L350,170 L200,170 Z" 
            fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
      
      <!-- Solar Arrays -->
      <rect x="30" y="70" width="20" height="60" fill="#ffd54f" stroke="#f57f17" stroke-width="1"/>
      <rect x="500" y="70" width="20" height="60" fill="#ffd54f" stroke="#f57f17" stroke-width="1"/>
      
      <!-- Radiators -->
      <rect x="150" y="40" width="50" height="10" fill="#80deea" stroke="#00838f" stroke-width="1"/>
      <rect x="300" y="40" width="50" height="10" fill="#80deea" stroke="#00838f" stroke-width="1"/>
      
      <!-- Antennas -->
      <circle cx="250" cy="30" r="8" fill="#9e9e9e" stroke="#424242" stroke-width="1"/>
      <circle cx="250" cy="170" r="5" fill="#9e9e9e" stroke="#424242" stroke-width="1"/>
      
      <!-- Callouts -->
      <g id="top-callouts">
        <line x1="200" y1="100" x2="150" y2="80" stroke="#666" stroke-width="1"/>
        <text x="140" y="75" font-size="10" fill="#333">SOLAR ARRAY</text>
        
        <line x1="300" y1="45" x2="350" y2="30" stroke="#666" stroke-width="1"/>
        <text x="355" y="25" font-size="10" fill="#333">RADIATOR</text>
        
        <line x1="250" y1="25" x2="280" y2="15" stroke="#666" stroke-width="1"/>
        <text x="285" y="13" font-size="10" fill="#333">COMM ANTENNA</text>
      </g>
    </g>
    
    <!-- Side View -->
    <g id="side-view" transform="translate(600, 50)">
      <rect x="0" y="0" width="500" height="200" fill="none" stroke="#333" stroke-width="2"/>
      <text x="250" y="15" text-anchor="middle" font-weight="bold" fill="#1a237e">SIDE VIEW</text>
      
      <!-- Spacecraft Profile -->
      <path d="M50,150 L100,50 L400,50 L450,150 L400,180 L100,180 Z" 
            fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
      
      <!-- Crew Module -->
      <ellipse cx="250" cy="50" rx="30" ry="20" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
      
      <!-- Main Engines -->
      <rect x="200" y="180" width="100" height="20" fill="#424242" stroke="#212121" stroke-width="1"/>
      <path d="M200,200 L250,220 L300,200" fill="#757575" stroke="#424242" stroke-width="1"/>
      
      <!-- RCS Thrusters -->
      <rect x="80" y="120" width="15" height="10" fill="#616161" stroke="#424242" stroke-width="1"/>
      <rect x="405" y="120" width="15" height="10" fill="#616161" stroke="#424242" stroke-width="1"/>
      
      <!-- Docking Port -->
      <circle cx="250" cy="30" r="15" fill="#9e9e9e" stroke="#616161" stroke-width="2"/>
      
      <!-- Dimensions -->
      <g id="side-dimensions">
        <line x1="50" y1="190" x2="450" y2="190" stroke="#d32f2f" stroke-width="1"/>
        <line x1="50" y1="185" x2="50" y2="195" stroke="#d32f2f" stroke-width="1"/>
        <line x1="450" y1="185" x2="450" y2="195" stroke="#d32f2f" stroke-width="1"/>
        <text x="250" y="185" text-anchor="middle" font-size="10" fill="#d32f2f">12.5 m</text>
        
        <line x1="460" y1="50" x2="460" y2="180" stroke="#d32f2f" stroke-width="1"/>
        <line x1="455" y1="50" x2="465" y2="50" stroke="#d32f2f" stroke-width="1"/>
        <line x1="455" y1="180" x2="465" y2="180" stroke="#d32f2f" stroke-width="1"/>
        <text x="475" y="115" font-size="10" fill="#d32f2f" transform="rotate(90 475,115)">4.2 m</text>
      </g>
      
      <!-- Callouts -->
      <g id="side-callouts">
        <line x1="250" y1="30" x2="300" y2="10" stroke="#666" stroke-width="1"/>
        <text x="305" y="8" font-size="10" fill="#333">DOCKING PORT</text>
        
        <line x1="250" y1="70" x2="300" y2="90" stroke="#666" stroke-width="1"/>
        <text x="305" y="88" font-size="10" fill="#333">CREW MODULE</text>
        
        <line x1="250" y1="200" x2="200" y2="230" stroke="#666" stroke-width="1"/>
        <text x="195" y="235" font-size="10" fill="#333">MAIN ENGINE</text>
      </g>
    </g>
    
    <!-- Front View -->
    <g id="front-view" transform="translate(50, 300)">
      <rect x="0" y="0" width="300" height="200" fill="none" stroke="#333" stroke-width="2"/>
      <text x="150" y="15" text-anchor="middle" font-weight="bold" fill="#1a237e">FRONT VIEW</text>
      
      <!-- Spacecraft Front -->
      <ellipse cx="150" cy="100" rx="80" ry="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
      
      <!-- Cockpit Windows -->
      <rect x="120" y="80" width="60" height="15" fill="#bbdefb" stroke="#1976d2" stroke-width="1" rx="5"/>
      <line x1="135" y1="80" x2="135" y2="95" stroke="#1976d2" stroke-width="1"/>
      <line x1="165" y1="80" x2="165" y2="95" stroke="#1976d2" stroke-width="1"/>
      
      <!-- RCS Thrusters -->
      <circle cx="70" cy="120" r="8" fill="#616161" stroke="#424242" stroke-width="1"/>
      <circle cx="230" cy="120" r="8" fill="#616161" stroke="#424242" stroke-width="1"/>
      
      <!-- Landing Gear -->
      <path d="M100,150 L100,170 L90,170" fill="none" stroke="#795548" stroke-width="3"/>
      <path d="M200,150 L200,170 L210,170" fill="none" stroke="#795548" stroke-width="3"/>
      
      <!-- Callouts -->
      <g id="front-callouts">
        <line x1="150" y1="85" x2="100" y2="60" stroke="#666" stroke-width="1"/>
        <text x="95" y="55" font-size="10" fill="#333">COCKPIT</text>
        
        <line x1="70" y1="120" x2="40" y2="140" stroke="#666" stroke-width="1"/>
        <text x="35" y="145" font-size="10" fill="#333">RCS THRUSTER</text>
      </g>
    </g>
    
    <!-- Rear View -->
    <g id="rear-view" transform="translate(400, 300)">
      <rect x="0" y="0" width="300" height="200" fill="none" stroke="#333" stroke-width="2"/>
      <text x="150" y="15" text-anchor="middle" font-weight="bold" fill="#1a237e">REAR VIEW</text>
      
      <!-- Spacecraft Rear -->
      <ellipse cx="150" cy="100" rx="80" ry="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
      
      <!-- Main Engines -->
      <circle cx="100" cy="100" r="15" fill="#424242" stroke="#212121" stroke-width="2"/>
      <circle cx="150" cy="100" r="15" fill="#424242" stroke="#212121" stroke-width="2"/>
      <circle cx="200" cy="100" r="15" fill="#424242" stroke="#212121" stroke-width="2"/>
      
      <!-- Radiator Detail -->
      <rect x="60" y="60" width="180" height="20" fill="#80deea" stroke="#00838f" stroke-width="1" opacity="0.7"/>
      
      <!-- Callouts -->
      <g id="rear-callouts">
        <line x1="150" y1="85" x2="200" y2="50" stroke="#666" stroke-width="1"/>
        <text x="205" y="48" font-size="10" fill="#333">MAIN ENGINES (3)</text>
        
        <line x1="150" y1="70" x2="100" y2="40" stroke="#666" stroke-width="1"/>
        <text x="95" y="35" font-size="10" fill="#333">RADIATOR PANEL</text>
      </g>
    </g>
    
    <!-- Cutaway View -->
    <g id="cutaway-view" transform="translate(750, 300)">
      <rect x="0" y="0" width="400" height="250" fill="none" stroke="#333" stroke-width="2"/>
      <text x="200" y="15" text-anchor="middle" font-weight="bold" fill="#1a237e">CUTAWAY VIEW (SECTION A-A)</text>
      
      <!-- Cutaway Structure -->
      <rect x="50" y="50" width="300" height="150" fill="#f5f5f5" stroke="#1565c0" stroke-width="2"/>
      <line x1="50" y1="50" x2="50" y2="200" stroke="#1565c0" stroke-width="2"/>
      
      <!-- Internal Components -->
      <!-- Propellant Tanks -->
      <ellipse cx="150" cy="100" rx="40" ry="30" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
      <ellipse cx="250" cy="100" rx="40" ry="30" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
      <text x="150" y="100" text-anchor="middle" font-size="9" fill="#1b5e20">LOX</text>
      <text x="250" y="100" text-anchor="middle" font-size="9" fill="#1b5e20">LH2</text>
      
      <!-- Crew Module Interior -->
      <rect x="100" y="130" width="100" height="50" fill="#bbdefb" stroke="#1976d2" stroke-width="1" rx="5"/>
      
      <!-- Avionics Bay -->
      <rect x="200" y="130" width="80" height="40" fill="#ffecb3" stroke="#ffa000" stroke-width="1"/>
      
      <!-- Life Support -->
      <rect x="100" y="70" width="60" height="30" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
      
      <!-- Cargo Bay -->
      <rect x="50" y="160" width="250" height="30" fill="#d7ccc8" stroke="#5d4037" stroke-width="1" opacity="0.7"/>
      
      <!-- Airlock -->
      <rect x="300" y="130" width="30" height="40" fill="#cfd8dc" stroke="#455a64" stroke-width="1" rx="3"/>
      
      <!-- Labels -->
      <g id="cutaway-labels" font-size="10">
        <text x="80" y="65" fill="#7b1fa2">LIFE SUPPORT</text>
        <text x="140" y="120" fill="#1976d2">CREW MODULE</text>
        <text x="220" y="120" fill="#ffa000">AVIONICS</text>
        <text x="310" y="120" fill="#455a64">AIRLOCK</text>
        <text x="180" y="185" fill="#5d4037">CARGO BAY</text>
        <text x="100" y="90" fill="#1b5e20">PROPELLANT TANKS</text>
      </g>
      
      <!-- Section Lines -->
      <path d="M350,50 L380,30 L380,70" fill="none" stroke="#d32f2f" stroke-width="1"/>
      <text x="385" y="50" font-size="10" fill="#d32f2f">SECTION A-A</text>
    </g>
    
    <!-- Scale Marker -->
    <g id="scale-marker" transform="translate(1000, 600)">
      <rect x="0" y="0" width="150" height="30" fill="white" stroke="#333" stroke-width="1"/>
      <line x1="10" y1="15" x2="60" y2="15" stroke="#333" stroke-width="2"/>
      <line x1="10" y1="10" x2="10" y2="20" stroke="#333" stroke-width="2"/>
      <line x1="60" y1="10" x2="60" y2="20" stroke="#333" stroke-width="2"/>
      <text x="35" y="27" text-anchor="middle" font-size="10">5 m</text>
      <text x="75" y="15" font-size="10" dominant-baseline="middle">SCALE 1:200</text>
    </g>
    
    <!-- Legend -->
    <g id="legend" transform="translate(50, 550)">
      <rect x="0" y="0" width="400" height="120" fill="white" stroke="#333" stroke-width="1"/>
      <text x="10" y="20" font-weight="bold" fill="#1a237e">LEGEND</text>
      
      <g transform="translate(10, 35)">
        <rect width="10" height="10" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
        <text x="20" y="10" font-size="10" dominant-baseline="middle">Crew Areas</text>
      </g>
      
      <g transform="translate(10, 55)">
        <rect width="10" height="10" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
        <text x="20" y="10" font-size="10" dominant-baseline="middle">Propellant Systems</text>
      </g>
      
      <g transform="translate(10, 75)">
        <rect width="10" height="10" fill="#ffecb3" stroke="#ffa000" stroke-width="1"/>
        <text x="20" y="10" font-size="10" dominant-baseline="middle">Avionics</text>
      </g>
      
      <g transform="translate(10, 95)">
        <rect width="10" height="10" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
        <text x="20" y="10" font-size="10" dominant-baseline="middle">Life Support</text>
      </g>
      
      <g transform="translate(200, 35)">
        <rect width="10" height="10" fill="#ffd54f" stroke="#f57f17" stroke-width="1"/>
        <text x="20" y="10" font-size="10" dominant-baseline="middle">Solar Arrays</text>
      </g>
      
      <g transform="translate(200, 55)">
        <rect width="10" height="10" fill="#80deea" stroke="#00838f" stroke-width="1"/>
        <text x="20" y="10" font-size="10" dominant-baseline="middle">Radiators</text>
      </g>
      
      <g transform="translate(200, 75)">
        <rect width="10" height="10" fill="#424242" stroke="#212121" stroke-width="1"/>
        <text x="20" y="10" font-size="10" dominant-baseline="middle">Engines</text>
      </g>
      
      <g transform="translate(200, 95)">
        <rect width="10" height="10" fill="#d7ccc8" stroke="#5d4037" stroke-width="1"/>
        <text x="20" y="10" font-size="10" dominant-baseline="middle">Cargo Bay</text>
      </g>
    </g>
    
    <!-- Technical Notes -->
    <g id="notes" transform="translate(500, 550)">
      <rect x="0" y="0" width="350" height="120" fill="white" stroke="#333" stroke-width="1"/>
      <text x="10" y="20" font-weight="bold" fill="#1a237e">TECHNICAL NOTES</text>
      
      <g font-size="10" fill="#333">
        <text x="10" y="40">1. All dimensions in meters</text>
        <text x="10" y="60">2. Main propulsion: 3× LOX/LH2 engines (250 kN each)</text>
        <text x="10" y="80">3. RCS: 24× 5 kN thrusters (6 DOF control)</text>
        <text x="10" y="100">4. Power: 2× deployable solar arrays (15 kW total)</text>
        <text x="10" y="120">5. Crew capacity: 4 astronauts</text>
      </g>
    </g>
  </g>
  
  <!-- Border -->
  <rect x="10" y="10" width="1180" height="830" fill="none" stroke="#333" stroke-width="3"/>
  
  <!-- Grid Lines (light) -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.3"/>
</svg>
