<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; font-family: Arial, sans-serif;">
  <style>
    .line { stroke: #000000; stroke-width: 1; }
    .center-line { stroke: #000000; stroke-width: 1; stroke-dasharray: 4,2; }
    .dimension { stroke: #000000; stroke-width: 1; }
    .dimension-arrow { stroke: #000000; stroke-width: 1; marker-end: url(#arrowhead); }
    .text { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
    .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #000000; }
    .label { font-family: Arial, sans-serif; font-size: 10px; fill: #000000; }
    .cut-section { stroke: #0000ff; stroke-width: 1.5; stroke-dasharray: 8,4; }
    .hidden-line { stroke: #000000; stroke-width: 1; stroke-dasharray: 2,2; }
    .grid { stroke: #e0e0e0; stroke-width: 0.5; }
    .border { stroke: #000000; stroke-width: 2; }
    .title-block { fill: #f0f0f0; stroke: #000000; stroke-width: 1; }
  </style>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#000000"/>
    </marker>
  </defs>

  <!-- Grid background for technical appearance -->
  <g class="grid">
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="1600" fill="url(#smallGrid)"/>
  </g>

  <!-- Main drawing area with border -->
  <rect x="50" y="50" width="1100" height="1500" class="border"/>

  <!-- Title Block -->
  <g transform="translate(75, 75)">
    <rect x="0" y="0" width="400" height="120" class="title-block"/>
    <text x="10" y="25" class="title">SPACECRAFT TECHNICAL SCHEMATIC</text>
    <text x="10" y="45" class="label">Project: Aries-IX Interplanetary Transport</text>
    <text x="10" y="65" class="label">Scale: 1:100</text>
    <text x="10" y="85" class="label">Projection: Orthographic Multiview</text>
    <text x="10" y="105" class="label">Date: August 19, 2026</text>
    <text x="200" y="25" class="title">REV 1.0</text>
    <text x="200" y="45" class="label">Sheet 1 of 1</text>
    <line x1="0" y1="30" x2="400" y2="30" class="line"/>
  </g>

  <!-- Views Layout -->
  <!-- Top View (Left) -->
  <g transform="translate(100, 200)">
    <text x="150" y="20" class="title" text-anchor="middle">TOP VIEW</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <!-- Main Structure -->
    <polygon points="50,130 150,30 250,130 250,180 50,180" class="line"/>
    <line x1="150" y1="30" x2="150" y2="180" class="center-line"/>
    
    <!-- Propellant Tanks (Cylindrical) -->
    <ellipse cx="80" cy="130" rx="30" ry="15" class="line"/>
    <ellipse cx="220" cy="130" rx="30" ry="15" class="line"/>
    <line x1="50" y1="130" x2="80" y2="130" class="line"/>
    <line x1="220" y1="130" x2="250" y2="130" class="line"/>
    
    <!-- Solar Arrays -->
    <rect x="20" y="140" width="100" height="2" class="line"/>
    <rect x="180" y="140" width="100" height="2" class="line"/>
    <text x="70" y="155" class="label">Solar Array</text>
    <text x="230" y="155" class="label">Solar Array</text>
    
    <!-- Radiators -->
    <rect x="120" y="140" width="60" height="2" class="line"/>
    <text x="150" y="155" class="label">Radiator</text>
    
    <!-- Antennas -->
    <circle cx="150" cy="80" r="5" class="line"/>
    <text x="150" y="85" class="label">High-Gain</text>
    
    <!-- Docking Port -->
    <circle cx="150" cy="160" r="10" class="line"/>
    <text x="150" y="175" class="label">Docking Port</text>
    
    <!-- Dimensions -->
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">20.0 m</text>
    
    <line x1="250" y1="30" x2="250" y2="180" class="dimension"/>
    <text x="255" y="105" class="label" text-anchor="start">15.0 m</text>
  </g>

  <!-- Side View (Center) -->
  <g transform="translate(450, 200)">
    <text x="150" y="20" class="title" text-anchor="middle">SIDE VIEW</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <!-- Main Structure -->
    <polygon points="50,130 150,30 250,130 250,180 50,180" class="line"/>
    <line x1="150" y1="30" x2="150" y2="180" class="center-line"/>
    
    <!-- Propellant Tanks -->
    <ellipse cx="80" cy="130" rx="30" ry="15" class="line"/>
    <ellipse cx="220" cy="130" rx="30" ry="15" class="line"/>
    
    <!-- Engines -->
    <circle cx="250" cy="170" r="15" class="line"/>
    <text x="250" y="175" class="label">Main Engine</text>
    <circle cx="220" cy="170" r="8" class="line"/>
    <text x="220" y="175" class="label">RCS</text>
    
    <!-- Landing Gear -->
    <line x1="50" y1="180" x2="50" y2="200" class="line"/>
    <line x1="250" y1="180" x2="250" y2="200" class="line"/>
    <line x1="50" y1="200" x2="70" y2="200" class="line"/>
    <line x1="250" y1="200" x2="230" y2="200" class="line"/>
    <text x="150" y="205" class="label">Landing Gear</text>
    
    <!-- Dimensions -->
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">20.0 m</text>
    
    <line x1="250" y1="30" x2="250" y2="180" class="dimension"/>
    <text x="255" y="105" class="label" text-anchor="start">15.0 m</text>
  </g>

  <!-- Front View (Right) -->
  <g transform="translate(800, 200)">
    <text x="150" y="20" class="title" text-anchor="middle">FRONT VIEW</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <!-- Main Structure -->
    <polygon points="50,130 150,30 250,130 250,180 50,180" class="line"/>
    <line x1="150" y1="30" x2="150" y2="180" class="center-line"/>
    
    <!-- Cockpit Window -->
    <ellipse cx="150" cy="70" rx="20" ry="10" class="line"/>
    <text x="150" y="75" class="label">Cockpit</text>
    
    <!-- Airlock -->
    <rect x="120" y="150" width="60" height="30" class="line"/>
    <text x="150" y="165" class="label">Airlock</text>
    
    <!-- Antennas -->
    <circle cx="80" cy="130" r="5" class="line"/>
    <text x="80" y="135" class="label">Comm</text>
    <circle cx="220" cy="130" r="5" class="line"/>
    <text x="220" y="135" class="label">Science</text>
    
    <!-- Dimensions -->
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">20.0 m</text>
    
    <line x1="250" y1="30" x2="250" y2="180" class="dimension"/>
    <text x="255" y="105" class="label" text-anchor="start">15.0 m</text>
  </g>

  <!-- Rear View (Bottom Left) -->
  <g transform="translate(100, 500)">
    <text x="150" y="20" class="title" text-anchor="middle">REAR VIEW</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <!-- Main Structure -->
    <polygon points="50,130 150,30 250,130 250,180 50,180" class="line"/>
    <line x1="150" y1="30" x2="150" y2="180" class="center-line"/>
    
    <!-- Engines -->
    <circle cx="80" cy="170" r="15" class="line"/>
    <text x="80" y="175" class="label">Main</text>
    <circle cx="220" cy="170" r="15" class="line"/>
    <text x="220" y="175" class="label">Main</text>
    <circle cx="150" cy="170" r="8" class="line"/>
    <text x="150" y="175" class="label">RCS</text>
    
    <!-- Radiators -->
    <rect x="40" y="140" width="80" height="10" class="line"/>
    <rect x="180" y="140" width="80" height="10" class="line"/>
    <text x="80" y="155" class="label">Radiator</text>
    <text x="220" y="155" class="label">Radiator</text>
    
    <!-- Dimensions -->
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">20.0 m</text>
    
    <line x1="250" y1="30" x2="250" y2="180" class="dimension"/>
    <text x="255" y="105" class="label" text-anchor="start">15.0 m</text>
  </g>

  <!-- Cutaway View (Bottom Center) -->
  <g transform="translate(450, 500)">
    <text x="150" y="20" class="title" text-anchor="middle">CUTAWAY VIEW</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <!-- Main Structure with Section Lines -->
    <polygon points="50,130 150,30 250,130 250,180 50,180" class="line"/>
    <line x1="150" y1="30" x2="150" y2="180" class="center-line"/>
    
    <!-- Section Line Indicator -->
    <path d="M 400,350 L 400,550" class="cut-section"/>
    <text x="410" y="450" class="label" transform="rotate(90,410,450)">Section A-A</text>
    
    <!-- Internal Components -->
    <!-- Crew Module -->
    <rect x="80" y="60" width="140" height="60" class="line"/>
    <text x="150" y="85" class="label">Crew Module</text>
    <rect x="90" y="75" width="40" height="30" class="line"/>
    <text x="110" y="90" class="label">Cockpit</text>
    
    <!-- Life Support -->
    <circle cx="150" cy="140" r="15" class="line"/>
    <text x="150" y="145" class="label">Life Support</text>
    
    <!-- Avionics -->
    <rect x="200" y="60" width="40" height="40" class="line"/>
    <text x="220" y="85" class="label">Avionics</text>
    
    <!-- Cargo Bay -->
    <rect x="50" y="150" width="100" height="30" class="line"/>
    <text x="100" y="175" class="label">Cargo Bay</text>
    
    <!-- Propellant Tanks (Cross-section) -->
    <circle cx="80" cy="130" r="30" class="line"/>
    <text x="80" y="135" class="label">Propellant Tank</text>
    <circle cx="220" cy="130" r="30" class="line"/>
    <text x="220" y="135" class="label">Propellant Tank</text>
    
    <!-- Dimensions -->
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">20.0 m</text>
    
    <line x1="250" y1="30" x2="250" y2="180" class="dimension"/>
    <text x="255" y="105" class="label" text-anchor="start">15.0 m</text>
  </g>

  <!-- Component Legend -->
  <g transform="translate(800, 500)">
    <text x="150" y="20" class="title" text-anchor="middle">COMPONENT LEGEND</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <text x="10" y="50" class="label">1. Main Engines (2)</text>
    <text x="10" y="70" class="label">2. RCS Thrusters (4)</text>
    <text x="10" y="90" class="label">3. Propellant Tanks (2× liquid methane/oxygen)</text>
    <text x="10" y="110" class="label">4. Crew Module (6 persons)</text>
    <text x="10" y="130" class="label">5. Cargo Bay (8 m³)</text>
    <text x="10" y="150" class="label">6. Solar Arrays (2× 50 m²)</text>
    <text x="10" y="170" class="label">7. Radiators (2× 10 m²)</text>
    <text x="10" y="190" class="label">8. Avionics Bay & Life Support</text>
  </g>

  <!-- Scale Bar -->
  <g transform="translate(100, 750)">
    <text x="0" y="20" class="label">Scale: 1:100</text>
    <line x1="0" y1="30" x2="100" y2="30" class="dimension"/>
    <text x="50" y="25" class="label" text-anchor="middle">10.0 m</text>
  </g>

  <!-- Section Lines Reference -->
  <g transform="translate(450, 750)">
    <text x="150" y="20" class="title" text-anchor="middle">SECTION LINES</text>
    <rect x="0" y="30" width="300" height="100" class="line"/>
    
    <path d="M 50,50 L 250,50" class="cut-section"/>
    <text x="260" y="55" class="label">Section A-A (Cutaway View)</text>
    
    <path d="M 50,80 L 250,80" class="cut-section"/>
    <text x="260" y="85" class="label">Section B-B (Not Shown)</text>
    
    <path d="M 50,110 L 250,110" class="cut-section"/>
    <text x="260" y="115" class="label">Section C-C (Not Shown)</text>
  </g>

  <!-- Notes Area -->
  <g transform="translate(800, 750)">
    <text x="150" y="20" class="title" text-anchor="middle">NOTES</text>
    <rect x="0" y="30" width="300" height="150" class="line"/>
    
    <text x="10" y="50" class="label">1. All dimensions in meters</text>
    <text x="10" y="70" class="label">2. Structure: Aluminum-Lithium alloy</text>
    <text x="10" y="90" class="label">3. Thermal control: Passive + active</text>
    <text x="10" y="110" class="label">4. Power: Solar arrays + batteries</text>
    <text x="10" y="130" class="label">5. Propulsion: Methane/oxygen engines</text>
    <text x="10" y="150" class="label">6. Radiation shielding: Storm shelter in crew module</text>
  </g>

  <!-- Overall Assembly View (Small inset) -->
  <g transform="translate(100, 950)">
    <text x="150" y="20" class="title" text-anchor="middle">ASSEMBLY OVERVIEW</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <!-- Simplified assembly diagram -->
    <polygon points="50,130 150,30 250,130 250,180 50,180" class="line"/>
    <line x1="150" y1="30" x2="150" y2="180" class="center-line"/>
    
    <!-- Label all components -->
    <text x="150" y="220" class="label" text-anchor="middle">Aries-IX Interplanetary Transport</text>
    <text x="150" y="240" class="label" text-anchor="middle">Length: 20.0 m • Diameter: 15.0 m</text>
  </g>

  <!-- Detailed Component Views -->
  <!-- Engine Detail -->
  <g transform="translate(450, 950)">
    <text x="150" y="20" class="title" text-anchor="middle">MAIN ENGINE DETAIL</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <circle cx="150" cy="130" r="30" class="line"/>
    <line x1="120" y1="130" x2="180" y2="130" class="line"/>
    <line x1="150" y1="100" x2="150" y2="160" class="line"/>
    <text x="150" y="150" class="label">Nozzle Expansion</text>
    <text x="150" y="170" class="label">Ratio: 15:1</text>
    
    <line x1="150" y1="30" x2="150" y2="180" class="dimension"/>
    <text x="155" y="20" class="label">Diameter: 3.0 m</text>
  </g>

  <!-- Solar Array Detail -->
  <g transform="translate(800, 950)">
    <text x="150" y="20" class="title" text-anchor="middle">SOLAR ARRAY DETAIL</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <rect x="50" y="80" width="200" height="2" class="line"/>
    <line x1="50" y1="80" x2="50" y2="130" class="line"/>
    <line x1="250" y1="80" x2="250" y2="130" class="line"/>
    <text x="150" y="145" class="label">Deployable Panel</text>
    <text x="150" y="165" class="label">Area: 50 m²</text>
    
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">10.0 m</text>
  </g>

  <!-- Radiator Detail -->
  <g transform="translate(100, 1200)">
    <text x="150" y="20" class="title" text-anchor="middle">RADIATOR PANEL DETAIL</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <rect x="50" y="80" width="200" height="10" class="line"/>
    <line x1="50" y1="80" x2="50" y2="130" class="line"/>
    <line x1="250" y1="80" x2="250" y2="130" class="line"/>
    <text x="150" y="145" class="label">Heat Pipe Radiator</text>
    <text x="150" y="165" class="label">Area: 10 m²</text>
    
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">10.0 m</text>
  </g>

  <!-- Crew Module Detail -->
  <g transform="translate(450, 1200)">
    <text x="150" y="20" class="title" text-anchor="middle">CREW MODULE DETAIL</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <rect x="80" y="60" width="140" height="60" class="line"/>
    <line x1="80" y1="60" x2="80" y2="180" class="line"/>
    <line x1="220" y1="60" x2="220" y2="180" class="line"/>
    <text x="150" y="195" class="label" text-anchor="middle">6-Person Habitat</text>
    
    <rect x="90" y="75" width="40" height="30" class="line"/>
    <text x="110" y="90" class="label">Cockpit</text>
    
    <circle cx="150" cy="140" r="15" class="line"/>
    <text x="150" y="145" class="label">Life Support</text>
    
    <line x1="80" y1="190" x2="220" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">14.0 m</text>
  </g>

  <!-- Airlock Detail -->
  <g transform="translate(800, 1200)">
    <text x="150" y="20" class="title" text-anchor="middle">AIRLOCK DETAIL</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <rect x="120" y="80" width="60" height="30" class="line"/>
    <line x1="120" y1="80" x2="120" y2="130" class="line"/>
    <line x1="180" y1="80" x2="180" y2="130" class="line"/>
    <text x="150" y="145" class="label">Airlock Chamber</text>
    <text x="150" y="165" class="label">Capacity: 2 persons</text>
    
    <line x1="120" y1="190" x2="180" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">3.0 m</text>
  </g>

  <!-- Landing Gear Detail -->
  <g transform="translate(100, 1450)">
    <text x="150" y="20" class="title" text-anchor="middle">LANDING GEAR DETAIL</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <line x1="150" y1="80" x2="150" y2="150" class="line"/>
    <line x1="150" y1="80" x2="130" y2="120" class="line"/>
    <line x1="150" y1="80" x2="170" y2="120" class="line"/>
    <line x1="130" y1="120" x2="170" y2="120" class="line"/>
    <text x="150" y="165" class="label">Retractable Gear</text>
    <text x="150" y="185" class="label">Stroke: 0.5 m</text>
    
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">3.0 m</text>
  </g>

  <!-- Docking Port Detail -->
  <g transform="translate(450, 1450)">
    <text x="150" y="20" class="title" text-anchor="middle">DOCKING PORT DETAIL</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <circle cx="150" cy="130" r="20" class="line"/>
    <circle cx="150" cy="130" r="15" class="line"/>
    <text x="150" y="145" class="label"> androgynous Docking System</text>
    <text x="150" y="165" class="label">Standard: IDSS</text>
    
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">4.0 m</text>
  </g>

  <!-- Cargo Bay Detail -->
  <g transform="translate(800, 1450)">
    <text x="150" y="20" class="title" text-anchor="middle">CARGO BAY DETAIL</text>
    <rect x="0" y="30" width="300" height="200" class="line"/>
    
    <rect x="50" y="80" width="200" height="30" class="line"/>
    <line x1="50" y1="80" x2="50" y2="130" class="line"/>
    <line x1="250" y1="80" x2="250" y2="130" class="line"/>
    <text x="150" y="145" class="label">Pressurized Cargo Bay</text>
    <text x="150" y="165" class="label">Volume: 8 m³</text>
    
    <line x1="50" y1="190" x2="250" y2="190" class="dimension"/>
    <text x="150" y="185" class="label" text-anchor="middle">10.0 m</text>
  </g>
</svg>