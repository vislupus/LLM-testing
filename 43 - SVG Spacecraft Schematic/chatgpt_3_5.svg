<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1500"
  height="1100"
  viewBox="0 0 1500 1100"
  font-family="Consolas, monospace"
  font-size="12"
  fill="none"
  stroke="black"
  stroke-linejoin="round"
  stroke-linecap="round"
  >

  <!-- Background -->
  <rect width="1500" height="1100" fill="#f0f5fa"/>
  <!-- Blueprint grid -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#cfd9e8" stroke-width="0.5"/>
  </pattern>
  <rect width="1500" height="1100" fill="url(#grid)" />

  <!-- Blueprint Title Block -->
  <g transform="translate(1050, 1000)">
    <rect width="430" height="90" fill="#192f4a" />
    <text x="10" y="25" fill="#d0e2ff" font-size="20" font-weight="bold">SPACECRAFT TECHNICAL SCHEMATIC</text>
    <text x="10" y="50" fill="#d0e2ff" font-size="14">Scale 1:100 | © 2024 Aerospace Engineering Ltd.</text>
    <text x="10" y="70" fill="#a8bcd9" font-size="10">Views: Top · Side · Front · Rear · Cutaway</text>
    <text x="10" y="88" fill="#a8bcd9" font-size="10">All dimensions in millimeters (mm)</text>
  </g>

  <!-- Scale Marker -->
  <g id="scale" stroke="#192f4a" stroke-width="1.5" transform="translate(50, 1000)">
    <line x1="0" y1="0" x2="200" y2="0" />
    <line x1="0" y1="-5" x2="0" y2="5" />
    <line x1="50" y1="-5" x2="50" y2="5" />
    <line x1="100" y1="-5" x2="100" y2="5" />
    <line x1="150" y1="-5" x2="150" y2="5" />
    <line x1="200" y1="-5" x2="200" y2="5" />
    <text x="0" y="-10" fill="#192f4a" font-size="10">0 mm</text>
    <text x="45" y="-10" fill="#192f4a" font-size="10">50 mm</text>
    <text x="95" y="-10" fill="#192f4a" font-size="10">100 mm</text>
    <text x="145" y="-10" fill="#192f4a" font-size="10">150 mm</text>
    <text x="195" y="-10" fill="#192f4a" font-size="10">200 mm</text>
    <text x="60" y="15" fill="#192f4a" font-size="12" font-weight="bold">Scale bar (1:100)</text>
  </g>

  <!-- Structural Section Lines -->
  <g id="section_lines" stroke="#102030" stroke-dasharray="4 4" stroke-width="1">
    <!-- Cutaway section line on top view -->
    <line x1="300" y1="230" x2="700" y2="230" />
    <text x="705" y="230" fill="#102030" font-size="10" font-weight="bold" dominant-baseline="middle">A-A Cutaway Section</text>
  </g>

  <!-- Layout & coordinates:
       Top view (left-top quadrant): at (50,50) to (750,300)
       Side view (right-top quadrant): (800,50) to (1450,300)
       Front view (left-bottom quadrant): (50,350) to (400,600)
       Rear view (center-bottom quadrant): (420,350) to (770,600)
       Cutaway view (right-bottom quadrant): (800,350) to (1450,600)
  -->

  <!-- ======================== TOP VIEW ======================== -->
  <g id="top_view" transform="translate(50,50)" stroke-width="1.5">
    <!-- Spacecraft main hull -->
    <rect x="100" y="80" width="450" height="150" rx="75" ry="75" fill="#eaf1fb" stroke="#1a263a"/>
    <!-- Cockpit: front semi-ellipse -->
    <ellipse cx="100" cy="155" rx="50" ry="75" fill="#b0bedc" stroke="#1a263a"/>
    <!-- Solar Arrays -->
    <rect x="70" y="20" width="70" height="20" fill="#768db5" stroke="#3f5497"/>
    <rect x="480" y="20" width="70" height="20" fill="#768db5" stroke="#3f5497"/>
    <text x="75" y="15" fill="#314e7b" font-weight="bold" font-size="11">Solar Arrays</text>
    <text x="485" y="15" fill="#314e7b" font-weight="bold" font-size="11">Solar Arrays</text>
    <!-- Radiators -->
    <rect x="310" y="40" width="130" height="30" fill="#a7bad9" stroke="#2f4375"/>
    <text x="330" y="60" fill="#415a85" font-weight="bold" font-size="10">Radiators</text>
    <!-- Antennas (circle + line) -->
    <line x1="100" y1="230" x2="100" y2="260" stroke="#6585a5" stroke-width="1"/>
    <circle cx="100" cy="265" r="8" stroke="#36506f" stroke-width="1.2" fill="#bfccd9"/>
    <text x="110" y="270" font-size="10" fill="#355073" font-weight="bold">Antenna</text>
    <line x1="520" y1="230" x2="520" y2="260" stroke="#6585a5" stroke-width="1"/>
    <circle cx="520" cy="265" r="8" stroke="#36506f" stroke-width="1.2" fill="#bfccd9"/>
    <text x="530" y="270" font-size="10" fill="#355073" font-weight="bold">Antenna</text>
    <!-- Engine pods top (circles) -->
    <circle cx="570" cy="155" r="35" fill="#bccde3" stroke="#2a3f63" />
    <circle cx="40" cy="155" r="35" fill="#bccde3" stroke="#2a3f63" />
    <text x="555" y="160" font-size="10" fill="#2a3f63" font-weight="bold">Engine</text>
    <text x="20" y="160" font-size="10" fill="#2a3f63" font-weight="bold" text-anchor="middle">Engine</text>
    <!-- Propellant Tanks (ellipses) between engines and crew -->
    <ellipse cx="200" cy="155" rx="40" ry="70" fill="#d3e3ff" stroke="#234571" />
    <ellipse cx="430" cy="155" rx="40" ry="70" fill="#d3e3ff" stroke="#234571" />
    <text x="200" y="160" fill="#234571" font-size="11" font-weight="bold" text-anchor="middle">Propellant Tank</text>
    <text x="430" y="160" fill="#234571" font-size="11" font-weight="bold" text-anchor="middle">Propellant Tank</text>
    <!-- Crew Module (center rectangle) -->
    <rect x="280" y="115" width="140" height="80" rx="20" ry="20" fill="#cfd9f7" stroke="#1b2a47" />
    <text x="350" y="160" font-weight="bold" font-size="12" fill="#1b2a47" text-anchor="middle">Crew Module</text>
    <!-- Docking Port at front of cockpit ellipse -->
    <circle cx="40" cy="155" r="15" fill="#92a6c6" stroke="#1a2d4a" />
    <text x="40" y="155" fill="#1a2d4a" font-size="11" font-weight="bold" dominant-baseline="middle" text-anchor="middle">Docking Port</text>

    <!-- Dimensions -->
    <!-- Length -->
    <line x1="100" y1="250" x2="550" y2="250" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="325" y="267" fill="#375a85" font-weight="bold" font-size="13" text-anchor="middle">4500 mm</text>
    <!-- Width -->
    <line x1="570" y1="40" x2="570" y2="270" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="585" y="160" fill="#375a85" font-weight="bold" font-size="13" transform="rotate(90 585,160)">1700 mm</text>
  </g>

  <!-- ======================== SIDE VIEW ======================== -->
  <g id="side_view" transform="translate(800,50)" stroke-width="1.5">
    <!-- Hull body -->
    <rect x="30" y="150" width="400" height="250" rx="50" ry="50" fill="#eaf1fb" stroke="#1a263a" />
    <!-- Engine pods -->
    <rect x="310" y="140" width="70" height="120" rx="10" ry="10" fill="#bccde3" stroke="#2a3f63" />
    <rect x="60" y="140" width="70" height="120" rx="10" ry="10" fill="#bccde3" stroke="#2a3f63" />
    <text x="245" y="160" font-size="10" fill="#2a3f63" font-weight="bold">Engine</text>
    <text x="380" y="160" font-size="10" fill="#2a3f63" font-weight="bold">Engine</text>
    <!-- Dimension lines -->
    <!-- Height -->
    <line x1="330" y1="140" x2="330" y2="390" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="345" y="265" fill="#375a85" font-weight="bold" font-size="13" transform="rotate(-90 345,265)">2500 mm</text>
    <!-- Length -->
    <line x1="30" y1="150" x2="430" y2="150" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="230" y="135" fill="#375a85" font-weight="bold" font-size="13">4000 mm</text>
    <!-- Width -->
    <line x1="30" y1="375" x2="430" y2="375" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="445" y="375" fill="#375a85" font-weight="bold" font-size="13">750 mm</text>
  </g>

  <!-- ======================== FRONT VIEW ======================== -->
  <g id="front_view" transform="translate(50,350)" stroke-width="1.5">
    <!-- Hull body -->
    <rect x="50" y="50" width="350" height="300" rx="50" ry="50" fill="#eaf1fb" stroke="#1a263a" />
    <!-- Cockpit -->
    <ellipse cx="225" cy="160" rx="50" ry="30" fill="#b0bedc" stroke="#1a263a" />
    <text x="225" y="160" fill="#1a263a" font-size="11" font-weight="bold" dominant-baseline="middle" text-anchor="middle">Cockpit</text>
    <!-- Dimension lines -->
    <!-- Height -->
    <line x1="225" y1="50" x2="225" y2="350" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="240" y="200" fill="#375a85" font-weight="bold" font-size="13" transform="rotate(-90 240,200)">3000 mm</text>
    <!-- Length -->
    <line x1="50" y1="50" x2="400" y2="50" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="230" y="40" fill="#375a85" font-weight="bold" font-size="13">3500 mm</text>
    <!-- Width -->
    <line x1="50" y1="350" x2="400" y2="350" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="415" y="350" fill="#375a85" font-weight="bold" font-size="13">750 mm</text>
  </g>

   <!-- ======================== REAR VIEW ======================== -->
  <g id="rear_view" transform="translate(420,350)" stroke-width="1.5">
    <!-- Hull body -->
    <rect x="50" y="50" width="350" height="300" rx="50" ry="50" fill="#eaf1fb" stroke="#1a263a" />
    <!-- Radiators -->
    <rect x="180" y="20" width="20" height="50" fill="#a7bad9" stroke="#2f4375"/>
    <rect x="300" y="20" width="20" height="50" fill="#a7bad9" stroke="#2f4375"/>
    <text x="90" y="40" fill="#314e7b" font-weight="bold" font-size="11">Radiators</text>
    <!-- Dimension lines -->
    <!-- Height -->
    <line x1="225" y1="50" x2="225" y2="350" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="240" y="200" fill="#375a85" font-weight="bold" font-size="13" transform="rotate(-90 240,200)">3000 mm</text>
    <!-- Length -->
    <line x1="50" y1="50" x2="400" y2="50" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="230" y="40" fill="#375a85" font-weight="bold" font-size="13">3500 mm</text>
    <!-- Width -->
    <line x1="50" y1="350" x2="400" y2="350" stroke="#375a85" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="415" y="350" fill="#375a85" font-weight="bold" font-size="13">750 mm</text>
  </g>

  <!-- Add more details as needed for the spacecraft schematic -->

</svg>