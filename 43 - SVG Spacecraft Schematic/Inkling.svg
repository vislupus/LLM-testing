<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="100%" height="100%" style="background-color:#f8f9fb; font-family:'Segoe UI',Calibri,sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d2d6e0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#c41e1e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#003a70"/>
    </marker>
  </defs>

  <!-- Background and grid -->
  <rect width="1440" height="1020" fill="#f8f9fb"/>
  <rect width="1440" height="1020" fill="url(#grid)"/>

  <!-- Title Block -->
  <g transform="translate(40,30)">
    <rect width="1360" height="70" fill="#fff" stroke="#003a70" stroke-width="2"/>
    <text x="20" y="28" fill="#003a70" font-size="22" font-weight="700" letter-spacing="2">AEROSPACE ENGINEERING BLUEPRINT — ORION-CLASS CREWED TRANSFER VEHICLE (CTV)</text>
    <text x="20" y="52" fill="#555" font-size="13">DWG NO. CTV-9000-X | SCALE 1:120 | REV. D | CLASSIFICATION: ENGINEERING</text>
    <text x="950" y="28" fill="#003a70" font-size="14" font-weight="600">VIEWS: TOP · SIDE · FRONT · REAR · CUTAWAY</text>
  </g>

  <!-- Scale Bar -->
  <g transform="translate(1180, 100)">
    <text x="0" y="-10" fill="#003a70" font-size="11" font-weight="600">SCALE</text>
    <rect x="0" y="0" width="120" height="8" fill="#003a70"/>
    <line x1="0" y1="-6" x2="0" y2="14" stroke="#003a70" stroke-width="1"/>
    <line x1="60" y1="-6" x2="60" y2="14" stroke="#003a70" stroke-width="1"/>
    <line x1="120" y1="-6" x2="120" y2="14" stroke="#003a70" stroke-width="1"/>
    <text x="0" y="26" fill="#333" font-size="9">0m</text>
    <text x="54" y="26" fill="#333" font-size="9">5m</text>
    <text x="108" y="26" fill="#333" font-size="9">10m</text>
  </g>

  <!-- ============================================ -->
  <!-- VIEW 1: TOP (Plan)                         -->
  <!-- ============================================ -->
  <g transform="translate(60, 160)">
    <text x="260" y="-20" fill="#003a70" font-size="16" font-weight="700" text-anchor="middle">TOP VIEW (PLAN)</text>
    <rect x="0" y="0" width="520" height="260" fill="#fff" stroke="#003a70" stroke-width="1.5"/>

    <!-- Fuselage outline top -->
    <ellipse cx="260" cy="130" rx="220" ry="75" fill="#eaf0f8" stroke="#003a70" stroke-width="2"/>
    <!-- Nose taper -->
    <path d="M 55 130 Q 20 130 20 70 L 40 110 Z" fill="#eaf0f8" stroke="#003a70" stroke-width="2"/>
    <path d="M 55 130 Q 20 130 20 190 L 40 150 Z" fill="#eaf0f8" stroke="#003a70" stroke-width="2"/>
    <!-- Wing/panel lines -->
    <line x1="80" y1="40" x2="440" y2="40" stroke="#003a70" stroke-width="0.75" stroke-dasharray="4,2"/>
    <line x1="80" y1="220" x2="440" y2="220" stroke="#003a70" stroke-width="0.75" stroke-dasharray="4,2"/>
    <line x1="260" y1="30" x2="260" y2="230" stroke="#003a70" stroke-width="0.5"/>

    <!-- Solar arrays -->
    <rect x="460" y="70" width="60" height="120" fill="#1a2e4a" stroke="#003a70" stroke-width="1"/>
    <line x1="465" y1="90" x2="515" y2="90" stroke="#8899aa" stroke-width="0.5"/>
    <line x1="465" y1="110" x2="515" y2="110" stroke="#8899aa" stroke-width="0.5"/>
    <line x1="465" y1="130" x2="515" y2="130" stroke="#8899aa" stroke-width="0.5"/>
    <line x1="465" y1="150" x2="515" y2="150" stroke="#8899aa" stroke-width="0.5"/>
    <line x1="465" y1="170" x2="515" y2="170" stroke="#8899aa" stroke-width="0.5"/>
    <text x="490" y="210" fill="#003a70" font-size="9" text-anchor="middle">SOLAR ARRAY (PORT)</text>

    <rect x="-40" y="70" width="60" height="120" fill="#1a2e4a" stroke="#003a70" stroke-width="1"/>
    <line x1="-35" y1="90" x2="15" y2="90" stroke="#8899aa" stroke-width="0.5"/>
    <line x1="-35" y1="110" x2="15" y2="110" stroke="#8899aa" stroke-width="0.5"/>
    <line x1="-35" y1="130" x2="15" y2="130" stroke="#8899aa" stroke-width="0.5"/>
    <line x1="-35" y1="150" x2="15" y2="150" stroke="#8899aa" stroke-width="0.5"/>
    <line x1="-35" y1="170" x2="15" y2="170" stroke="#8899aa" stroke-width="0.5"/>
    <text x="-10" y="210" fill="#003a70" font-size="9" text-anchor="middle">SOLAR ARRAY (STBD)</text>

    <!-- Callouts -->
    <g stroke="#003a70" stroke-width="0.75" fill="none">
      <line x1="260" y1="75" x2="260" y2="10"/>
      <circle cx="260" cy="75" r="2" fill="#003a70" stroke="none"/>
    </g>
    <text x="265" y="8" fill="#003a70" font-size="9">DOCKING PORT (FORWARD RING)</text>

    <g stroke="#003a70" stroke-width="0.75" fill="none">
      <line x1="120" y1="130" x2="60" y2="130"/>
      <circle cx="120" cy="130" r="2" fill="#003a70" stroke="none"/>
    </g>
    <text x="10" y="120" fill="#003a70" font-size="9">CREW MODULE</text>

    <g stroke="#003a70" stroke-width="0.75" fill="none">
      <line x1="340" y1="130" x2="380" y2="130"/>
      <circle cx="340" cy="130" r="2" fill="#003a70" stroke="none"/>
    </g>
    <text x="385" y="125" fill="#003a70" font-size="9">AVIONICS BAY</text>

    <g stroke="#003a70" stroke-width="0.75" fill="none">
      <line x1="260" y1="140" x2="260" y2="245"/>
      <circle cx="260" cy="140" r="2" fill="#003a70" stroke="none"/>
    </g>
    <text x="265" y="255" fill="#003a70" font-size="9">CENTERLINE / SECTION A-A</text>

    <!-- Dimensions -->
    <g stroke="#c41e1e" stroke-width="1" fill="none">
      <line x1="20" y1="30" x2="500" y2="30"/>
      <line x1="20" y1="25" x2="20" y2="35" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="500" y1="25" x2="500" y2="35" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>
    <text x="260" y="20" fill="#c41e1e" font-size="10" text-anchor="middle">L: 42.5 m</text>
  </g>

  <!-- ============================================ -->
  <!-- VIEW 2: SIDE (Port Elevation)              -->
  <!-- ============================================ -->
  <g transform="translate(620, 160)">
    <text x="300" y="-20" fill="#003a70" font-size="16" font-weight="700" text-anchor="middle">SIDE VIEW (PORT ELEVATION)</text>
    <rect x="0" y="0" width="580" height="260" fill="#fff" stroke="#003a70" stroke-width="1.5"/>

    <!-- Fuselage side -->
    <path d="M 40 120 L 480 120 L 500 70 L 520 70 L 540 120 L 510 140 L 480 165 L 40 165 L 30 140 L 10 135 L 30 110 Z" fill="#eaf0f8" stroke="#003a70" stroke-width="2"/>
    <!-- Nose cone -->
    <path d="M 10 135 L 40 120 L 40 100 L 10 135" fill="#d0dde8" stroke="#003a70" stroke-width="1.5"/>
    <!-- Cockpit windows -->
    <rect x="50" y="105" width="70" height="35" rx="14" fill="#b0c0ce" stroke="#003a70" stroke-width="1"/>
    <text x="85" y="128" fill="#fff" font-size="8" text-anchor="middle">COCKPIT</text>

    <!-- Crew module -->
    <rect x="130" y="95" width="120" height="55" rx="8" fill="#fff" stroke="#003a70" stroke-width="1.5"/>
    <text x="190" y="115" fill="#003a70" font-size="8" text-anchor="middle">CREW MODULE</text>
    <text x="190" y="130" fill="#555" font-size="7" text-anchor="middle">LIFE-SUPPORT</text>
    <text x="190" y="140" fill="#555" font-size="7" text-anchor="middle">AVIONICS</text>

    <!-- Airlock -->
    <rect x="260" y="125" width="40" height="30" rx="4" fill="#fff" stroke="#003a70" stroke-width="1.5"/>
    <text x="280" y="145" fill="#003a70" font-size="7" text-anchor="middle">AIRLOCK</text>

    <!-- Cargo Bay -->
    <rect x="310" y="100" width="130" height="50" rx="6" fill="#fdf6e3" stroke="#003a70" stroke-width="1"/>
    <text x="375" y="118" fill="#003a70" font-size="8" text-anchor="middle">CARGO BAY</text>
    <text x="375" y="132" fill="#555" font-size="7" text-anchor="middle">PRESSURIZED / THERMAL</text>

    <!-- Propellant tanks -->
    <rect x="450" y="80" width="70" height="60" rx="4" fill="#c6e0f5" stroke="#003a70" stroke-width="1"/>
    <text x="485" y="110" fill="#003a70" font-size="8" text-anchor="middle">TANKS</text>
    <text x="485" y="125" fill="#003a70" font-size="7" text-anchor="middle">LOX / LH2</text>

    <!-- Engines -->
    <rect x="520" y="140" width="40" height="30" rx="3" fill="#1a2e4a" stroke="#003a70" stroke-width="1.5"/>
    <text x="540" y="158" fill="#fff" font-size="7" text-anchor="middle">ENGINES</text>

    <!-- Radiators -->
    <rect x="460" y="30" width="80" height="12" rx="3" fill="#8899aa" stroke="#003a70" stroke-width="1"/>
    <line x1="465" y1="36" x2="535" y2="36" stroke="#667788" stroke-width="0.5"/>
    <text x="500" y="22" fill="#003a70" font-size="8" text-anchor="middle">RADIATORS</text>

    <!-- Antenna -->
    <line x1="40" y1="80" x2="50" y2="40" stroke="#003a70" stroke-width="2"/>
    <circle cx="50" cy="40" r="5" fill="#003a70"/>
    <text x="55" y="35" fill="#003a70" font-size="8">ANTENNA</text>

    <!-- Landing gear -->
    <line x1="200" y1="165" x2="200" y2="200" stroke="#003a70" stroke-width="2"/>
    <line x1="190" y1="200" x2="210" y2="200" stroke="#003a70" stroke-width="2"/>
    <text x="160" y="215" fill="#003a70" font-size="9">LANDING GEAR</text>

    <!-- Docking port -->
    <rect x="5" y="122" width="15" height="22" rx="3" fill="#fff" stroke="#003a70" stroke-width="2"/>
    <text x="25" y="118" fill="#003a70" font-size="9">DOCKING</text>

    <!-- Dimension lines -->
    <g stroke="#c41e1e" stroke-width="1" fill="none">
      <line x1="10" y1="230" x2="540" y2="230"/>
      <line x1="10" y1="225" x2="10" y2="235" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="540" y1="225" x2="540" y2="235" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>
    <text x="275" y="245" fill="#c41e1e" font-size="10" text-anchor="middle">L: 42.5 m</text>
  </g>

  <!-- ============================================ -->
  <!-- VIEW 3: FRONT (Bow)                        -->
  <!-- ============================================ -->
  <g transform="translate(60, 480)">
    <text x="260" y="-20" fill="#003a70" font-size="16" font-weight="700" text-anchor="middle">FRONT VIEW (BOW)</text>
    <rect x="0" y="0" width="520" height="260" fill="#fff" stroke="#003a70" stroke-width="1.5"/>

    <!-- Nose cone -->
    <path d="M 260 30 L 160 120 L 200 100 Z" fill="#d0dde8" stroke="#003a70" stroke-width="2"/>
    <path d="M 260 30 L 360 120 L 320 100 Z" fill="#d0dde8" stroke="#003a70" stroke-width="2"/>
    <ellipse cx="260" cy="140" rx="140" ry="80" fill="#eaf0f8" stroke="#003a70" stroke-width="2"/>
    <rect x="140" y="130" width="240" height="30" fill="#b0c0ce" stroke="#003a70" stroke-width="1"/>
    <text x="260" y="148" fill="#003a70" font-size="9" text-anchor="middle">FORWARD DOCKING PORT / RING</text>

    <!-- Cockpit windows -->
    <rect x="220" y="70" width="80" height="30" rx="10" fill="#8899aa" stroke="#003a70" stroke-width="1"/>
    <text x="260" y="90" fill="#fff" font-size="8" text-anchor="middle">COCKPIT</text>

    <!-- Solar arrays vertical -->
    <rect x="20" y="50" width="20" height="160" fill="#1a2e4a" stroke="#003a70" stroke-width="1"/>
    <rect x="480" y="50" width="20" height="160" fill="#1a2e4a" stroke="#003a70" stroke-width="1"/>
    <text x="30" y="225" fill="#003a70" font-size="8" text-anchor="middle">SOLAR</text>
    <text x="490" y="225" fill="#003a70" font-size="8" text-anchor="middle">SOLAR</text>

    <!-- Dimensions -->
    <g stroke="#c41e1e" stroke-width="1" fill="none">
      <line x1="540" y1="80" x2="540" y2="200"/>
      <line x1="535" y1="80" x2="545" y2="80" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="535" y1="200" x2="545" y2="200" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>
    <text x="555" y="140" fill="#c41e1e" font-size="10" writing-mode="tb">W: 15.0 m</text>
  </g>

  <!-- ============================================ -->
  <!-- VIEW 4: REAR (Stern)                       -->
  <!-- ============================================ -->
  <g transform="translate(620, 480)">
    <text x="290" y="-20" fill="#003a70" font-size="16" font-weight="700" text-anchor="middle">REAR VIEW (STERN / ENGINE CLUSTER)</text>
    <rect x="0" y="0" width="580" height="260" fill="#fff" stroke="#003a70" stroke-width="1.5"/>

    <!-- Main nozzle ring -->
    <ellipse cx="290" cy="140" rx="150" ry="80" fill="#eaf0f8" stroke="#003a70" stroke-width="2"/>
    <ellipse cx="290" cy="140" rx="110" ry="55" fill="#fff" stroke="#003a70" stroke-width="1.5"/>

    <!-- Four main engines -->
    <rect x="240" y="110" width="30" height="60" rx="6" fill="#1a2e4a" stroke="#003a70" stroke-width="1.5"/>
    <text x="255" y="145" fill="#fff" font-size="7" text-anchor="middle">MAIN</text>
    <rect x="290" y="50" width="30" height="60" rx="6" fill="#1a2e4a" stroke="#003a70" stroke-width="1.5"/>
    <text x="305" y="85" fill="#fff" font-size="7" text-anchor="middle">MAIN</text>
    <rect x="290" y="170" width="30" height="60" rx="6" fill="#1a2e4a" stroke="#003a70" stroke-width="1.5"/>
    <text x="305" y="205" fill="#fff" font-size="7" text-anchor="middle">MAIN</text>
    <rect x="340" y="110" width="30" height="60" rx="6" fill="#1a2e4a" stroke="#003a70" stroke-width="1.5"/>
    <text x="355" y="145" fill="#fff" font-size="7" text-anchor="middle">MAIN</text>

    <!-- RCS thrusters -->
    <circle cx="140" cy="140" r="8" fill="#8899aa" stroke="#003a70" stroke-width="1"/>
    <text x="140" y="105" fill="#003a70" font-size="7" text-anchor="middle">RCS</text>
    <circle cx="440" cy="140" r="8" fill="#8899aa" stroke="#003a70" stroke-width="1"/>
    <text x="440" y="105" fill="#003a70" font-size="7" text-anchor="middle">RCS</text>

    <!-- Propellant lines -->
    <line x1="290" y1="170" x2="290" y2="180" stroke="#003a70" stroke-width="2"/>
    <line x1="255" y1="170" x2="255" y2="180" stroke="#003a70" stroke-width="2"/>
    <line x1="325" y1="170" x2="325" y2="180" stroke="#003a70" stroke-width="2"/>
    <line x1="290" y1="50" x2="290" y2="40" stroke="#003a70" stroke-width="2"/>

    <!-- Dimensions -->
    <g stroke="#c41e1e" stroke-width="1" fill="none">
      <line x1="10" y1="230" x2="570" y2="230"/>
      <line x1="10" y1="225" x2="10" y2="235" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="570" y1="225" x2="570" y2="235" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>
    <text x="290" y="245" fill="#c41e1e" font-size="10" text-anchor="middle">W: 15.0 m</text>
  </g>

  <!-- ============================================ -->
  <!-- VIEW 5: CUTAWAY (Section A-A)              -->
  <!-- ============================================ -->
  <g transform="translate(60, 740)">
    <text x="640" y="-20" fill="#003a70" font-size="16" font-weight="700" text-anchor="middle">CUTAWAY — LONGITUDINAL SECTION A-A</text>
    <rect x="0" y="0" width="1280" height="240" fill="#fff" stroke="#003a70" stroke-width="1.5"/>

    <!-- Section outline -->
    <path d="M 40 100 L 220 60 L 400 60 L 600 70 L 800 85 L 1000 100 L 1180 120 L 1180 180 L 1000 160 L 800 145 L 600 135 L 400 120 L 220 120 L 40 145 Z" fill="#eaf0f8" stroke="#003a70" stroke-width="2"/>

    <!-- Internal divisions -->
    <line x1="220" y1="60" x2="220" y2="120" stroke="#003a70" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="400" y1="60" x2="400" y2="120" stroke="#003a70" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="600" y1="70" x2="600" y2="135" stroke="#003a70" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="800" y1="85" x2="800" y2="145" stroke="#003a70" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="1000" y1="100" x2="1000" y2="160" stroke="#003a70" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Cockpit -->
    <rect x="40" y="85" width="160" height="40" rx="8" fill="#b0c0ce" stroke="#003a70" stroke-width="1"/>
    <text x="120" y="112" fill="#fff" font-size="9" text-anchor="middle">COCKPIT</text>

    <!-- Crew module -->
    <rect x="240" y="80" width="140" height="40" rx="8" fill="#fff" stroke="#003a70" stroke-width="1"/>
    <text x="310" y="105" fill="#003a70" font-size="9" text-anchor="middle">CREW MODULE</text>
    <text x="310" y="115" fill="#555" font-size="7" text-anchor="middle">LIFE SUPPORT</text>

    <!-- Airlock -->
    <rect x="410" y="90" width="50" height="30" rx="5" fill="#fff" stroke="#003a70" stroke-width="1"/>
    <text x="435" y="110" fill="#003a70" font-size="8" text-anchor="middle">AIRLOCK</text>

    <!-- Cargo -->
    <rect x="480" y="80" width="280" height="50" rx="6" fill="#fdf6e3" stroke="#003a70" stroke-width="1"/>
    <text x="620" y="103" fill="#003a70" font-size="10" text-anchor="middle">CARGO BAY — PRESSURIZED</text>
    <text x="620" y="118" fill="#555" font-size="8" text-anchor="middle">THERMAL CONTROL / RADIATOR LOOP</text>

    <!-- Propellant -->
    <rect x="780" y="85" width="220" height="60" rx="8" fill="#c6e0f5" stroke="#003a70" stroke-width="1"/>
    <line x1="890" y1="85" x2="890" y2="145" stroke="#003a70" stroke-width="0.75"/>
    <text x="890" y="108" fill="#003a70" font-size="9" text-anchor="middle">PROPELLANT</text>
    <text x="890" y="120" fill="#003a70" font-size="8" text-anchor="middle">LOX / LH2 TANKS</text>
    <text x="890" y="132" fill="#003a70" font-size="8" text-anchor="middle">INSULATED / VACUUM</text>

    <!-- Engines -->
    <rect x="1020" y="95" width="100" height="50" rx="6" fill="#1a2e4a" stroke="#003a70" stroke-width="1.5"/>
    <text x="1070" y="120" fill="#fff" font-size="9" text-anchor="middle">ENGINE CLUSTER</text>
    <text x="1070" y="135" fill="#fff" font-size="7" text-anchor="middle">4× MAIN + RCS</text>

    <!-- Docking port -->
    <rect x="1150" y="105" width="30" height="40" rx="8" fill="#fff" stroke="#003a70" stroke-width="2"/>
    <text x="1190" y="130" fill="#003a70" font-size="8">DOCKING</text>

    <!-- Section markers -->
    <line x1="220" y1="0" x2="220" y2="240" stroke="#c41e1e" stroke-width="0.5" stroke-dasharray="6,3"/>
    <line x1="400" y1="0" x2="400" y2="240" stroke="#c41e1e" stroke-width="0.5" stroke-dasharray="6,3"/>
    <text x="220" y="255" fill="#c41e1e" font-size="9" text-anchor="middle">SECTION A-A</text>
    <text x="400" y="255" fill="#c41e1e" font-size="9" text-anchor="middle">SECTION B-B</text>

    <!-- Callouts -->
    <line x1="120" y1="75" x2="120" y2="30" stroke="#003a70" stroke-width="0.75"/>
    <text x="120" y="22" fill="#003a70" font-size="9">COCKPIT / NAV</text>

    <line x1="620" y1="75" x2="620" y2="30" stroke="#003a70" stroke-width="0.75"/>
    <text x="620" y="22" fill="#003a70" font-size="9">CARGO / THERMAL</text>

    <line x1="890" y1="150" x2="890" y2="200" stroke="#003a70" stroke-width="0.75"/>
    <text x="890" y="210" fill="#003a70" font-size="9">TANKAGE / INSULATION</text>

    <line x1="1070" y1="150" x2="1070" y2="200" stroke="#003a70" stroke-width="0.75"/>
    <text x="1070" y="210" fill="#003a70" font-size="9">ENGINE CLUSTER</text>

    <line x1="1165" y1="145" x2="1165" y2="200" stroke="#003a70" stroke-width="0.75"/>
    <text x="1165" y="210" fill="#003a70" font-size="9">DOCKING PORT</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 980)">
    <rect x="0" y="0" width="1320" height="30" fill="#003a70" rx="4"/>
    <text x="10" y="19" fill="#fff" font-size="10" font-weight="600">BLUEPRINT LEGEND: BLUE = STRUCTURE | RED = DIMENSIONS | DASHED = SECTION / HIDDEN | YELLOW = PRESSURIZED VOLUME | DARK BLUE = ENGINE / POWER</text>
  </g>
</svg>