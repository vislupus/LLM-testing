<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALAXY FORGE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        body { margin:0; overflow:hidden; background:#111; }
        canvas { display:block; }
        #info {
            position:absolute; top:16px; left:16px; color:#fff; font-family:monospace; 
            background:rgba(0,0,0,0.5); padding:10px 16px; border-radius:8px; font-size:13px;
            pointer-events:none;
        }
    </style>
</head>
<body>
    <div id="info">
        10 000 STARS • COLLAPSING CLOUD → SPIRAL GALAXY<br>
        Newtonian gravity + central black hole + dark matter halo
    </div>

    <script>
        // ================================================
        // GALAXY FORGE — 10 000 particle galaxy formation
        // p5.js • Single standalone HTML file
        // Quadtree-free grid approximation for 60 fps
        // Persistent trails • Merging with mass conservation
        // Keplerian inner orbits • Spiral arms emerge naturally
        // ================================================

        let particles = [];
        let G = 0.28;
        let centralMass = 4200; // black hole + bulge
        let GRID_SIZE = 36;
        let grid = [];
        let cellW, cellH;
        let trailAlpha = 24;

        class Particle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = createVector(0, 0);
                this.mass = random(0.6, 5.2);
                this.radius = map(this.mass, 0.6, 5.2, 1.1, 4.8);
            }
        }

        function setup() {
            createCanvas(920, 920);
            background(220);
            cellW = width / GRID_SIZE;
            cellH = height / GRID_SIZE;
            
            // Create initial collapsing protogalactic cloud
            for (let i = 0; i < 10000; i++) {
                let angle = random(TWO_PI);
                let r = random(60, 380) * (0.4 + random(0.9));
                let x = width/2 + cos(angle) * r;
                let y = height/2 + sin(angle) * r * 0.75; // slightly flattened
                
                let p = new Particle(x, y);
                
                // Initial tangential velocity (Keplerian-like)
                let dx = x - width/2;
                let dy = y - height/2;
                let dist = sqrt(dx*dx + dy*dy) + 40;
                let tangSpeed = sqrt(G * centralMass / dist) * 1.45;
                
                let tang = createVector(-dy, dx);
                tang.normalize();
                tang.mult(tangSpeed);
                
                // Small inward radial velocity for collapse
                let radial = createVector(-dx, -dy);
                radial.normalize();
                radial.mult(1.2);
                
                p.vel = tang.add(radial);
                p.vel.add(random(-0.8, 0.8), random(-0.8, 0.8)); // turbulence
                
                particles.push(p);
            }
            
            // Central black hole is fixed (invisible but massive)
        }

        function draw() {
            background(220, trailAlpha); // subtle fade for beautiful persistent trails
            
            // Build spatial grid for fast gravity approximation
            grid = Array.from({length: GRID_SIZE}, () => 
                Array.from({length: GRID_SIZE}, () => ({mass: 0, comX: 0, comY: 0}))
            );
            
            for (let p of particles) {
                let gx = floor(p.pos.x / cellW);
                let gy = floor(p.pos.y / cellH);
                if (gx < 0 || gx >= GRID_SIZE || gy < 0 || gy >= GRID_SIZE) continue;
                
                let cell = grid[gy][gx];
                cell.mass += p.mass;
                cell.comX += p.pos.x * p.mass;
                cell.comY += p.pos.y * p.mass;
            }
            
            // Normalize center of mass per cell
            for (let gy = 0; gy < GRID_SIZE; gy++) {
                for (let gx = 0; gx < GRID_SIZE; gx++) {
                    let cell = grid[gy][gx];
                    if (cell.mass > 0) {
                        cell.comX /= cell.mass;
                        cell.comY /= cell.mass;
                    }
                }
            }
            
            // Compute forces and update
            for (let p of particles) {
                let fx = 0;
                let fy = 0;
                
                // Central black hole + dark matter halo (flatter rotation)
                let dx = width/2 - p.pos.x;
                let dy = height/2 - p.pos.y;
                let distSq = dx*dx + dy*dy + 800; // softening
                let dist = sqrt(distSq);
                let centralForce = G * centralMass * p.mass / distSq * 1.35; // halo boost
                fx += dx / dist * centralForce;
                fy += dy / dist * centralForce;
                
                // Grid-based self-gravity
                let gx = floor(p.pos.x / cellW);
                let gy = floor(p.pos.y / cellH);
                
                for (let dyGrid = -2; dyGrid <= 2; dyGrid++) {
                    for (let dxGrid = -2; dxGrid <= 2; dxGrid++) {
                        let cx = gx + dxGrid;
                        let cy = gy + dyGrid;
                        if (cx < 0 || cx >= GRID_SIZE || cy < 0 || cy >= GRID_SIZE) continue;
                        
                        let cell = grid[cy][cx];
                        if (cell.mass < 0.5) continue;
                        
                        let ddx = cell.comX - p.pos.x;
                        let ddy = cell.comY - p.pos.y;
                        let dSq = ddx*ddx + ddy*ddy + 600;
                        let d = sqrt(dSq);
                        let f = G * p.mass * cell.mass / dSq;
                        fx += ddx / d * f;
                        fy += ddy / d * f;
                    }
                }
                
                p.vel.x += fx / p.mass;
                p.vel.y += fy / p.mass;
                
                // Gentle damping for stability
                p.vel.mult(0.982);
                
                // Update position
                p.pos.add(p.vel);
                
                // Merge nearby particles (conserves mass)
                for (let j = particles.length - 1; j > particles.indexOf(p); j--) {
                    let other = particles[j];
                    let dx = other.pos.x - p.pos.x;
                    let dy = other.pos.y - p.pos.y;
                    let d2 = dx*dx + dy*dy;
                    if (d2 < 36) {
                        // Merge smaller into larger
                        if (p.mass < other.mass) {
                            let totalMass = p.mass + other.mass;
                            other.vel = p.vel.copy().mult(p.mass / totalMass).add(other.vel.copy().mult(other.mass / totalMass));
                            other.mass = totalMass;
                            other.radius = map(totalMass, 0.6, 12, 1.1, 6.5);
                            particles.splice(particles.indexOf(p), 1);
                        } else {
                            let totalMass = p.mass + other.mass;
                            p.vel = other.vel.copy().mult(other.mass / totalMass).add(p.vel.copy().mult(p.mass / totalMass));
                            p.mass = totalMass;
                            p.radius = map(totalMass, 0.6, 12, 1.1, 6.5);
                            particles.splice(j, 1);
                        }
                        break;
                    }
                }
                
                // Boundary repulsion
                if (p.pos.x < 40) p.vel.x += 1.2;
                if (p.pos.x > width - 40) p.vel.x -= 1.2;
                if (p.pos.y < 40) p.vel.y += 1.2;
                if (p.pos.y > height - 40) p.vel.y -= 1.2;
            }
            
            // Draw particles
            noStroke();
            for (let p of particles) {
                let alpha = map(p.mass, 0.6, 5.2, 90, 255);
                fill(255, alpha);
                circle(p.pos.x, p.pos.y, p.radius);
            }
            
            // Central black hole (bright core)
            fill(255, 240, 180);
            circle(width/2, height/2, 22);
            fill(255, 255, 255, 180);
            circle(width/2, height/2, 11);
        }

        // Click to add angular momentum boost (fun interaction)
        function mousePressed() {
            for (let p of particles) {
                let dx = p.pos.x - mouseX;
                let dy = p.pos.y - mouseY;
                let d = sqrt(dx*dx + dy*dy);
                if (d < 220) {
                    p.vel.x += dy / d * 0.8;
                    p.vel.y -= dx / d * 0.8;
                }
            }
        }
    </script>
</body>
</html>
