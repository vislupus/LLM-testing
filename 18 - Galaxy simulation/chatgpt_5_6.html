<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>10,000-Particle Galaxy Formation — p5.js + Barnes–Hut</title>
  <style>
    :root {
      --bg: rgb(220,220,220);
      --panel: rgba(245,245,245,.90);
      --ink: #17202a;
      --muted: #53606c;
      --line: rgba(30,42,52,.18);
      --accent: #304c67;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    #app { position: fixed; inset: 0; background: var(--bg); }
    canvas { display: block; }
    .panel {
      position: fixed; z-index: 10; top: 14px; left: 14px; width: min(330px, calc(100vw - 28px));
      padding: 14px 15px 13px; border: 1px solid var(--line); border-radius: 15px;
      background: var(--panel); backdrop-filter: blur(12px); box-shadow: 0 12px 34px rgba(32,44,52,.12);
      user-select: none;
    }
    h1 { margin: 0 0 3px; font-size: 16px; letter-spacing: .02em; }
    .subtitle { margin: 0 0 11px; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
    .row { display: grid; grid-template-columns: 114px 1fr 48px; align-items: center; gap: 8px; margin: 7px 0; font-size: 11.5px; }
    .row output { text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .buttons { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 11px; }
    button {
      border: 1px solid var(--line); border-radius: 9px; padding: 7px 5px; background: rgba(255,255,255,.72);
      color: var(--ink); font-weight: 650; cursor: pointer;
    }
    button:hover { background: white; }
    button.active { background: #304c67; color: white; }
    .checks { display: flex; gap: 11px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .checks label { display: flex; align-items: center; gap: 4px; }
    .stats {
      position: fixed; z-index: 10; right: 14px; top: 14px; min-width: 205px; padding: 11px 13px;
      border: 1px solid var(--line); border-radius: 13px; background: rgba(245,245,245,.84);
      backdrop-filter: blur(10px); font-size: 11px; line-height: 1.55; font-variant-numeric: tabular-nums;
    }
    .stats b { display:inline-block; min-width: 78px; }
    .help {
      position: fixed; z-index: 10; right: 14px; bottom: 12px; padding: 7px 10px; border-radius: 10px;
      background: rgba(245,245,245,.72); color: var(--muted); font-size: 10.5px; border: 1px solid var(--line);
    }
    @media (max-width: 720px) {
      .panel { width: 280px; padding: 11px; }
      .row { grid-template-columns: 100px 1fr 42px; margin: 5px 0; }
      .stats { top: auto; bottom: 12px; right: 12px; min-width: 174px; }
      .help { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <section class="panel">
    <h1>Protogalaxy Laboratory</h1>
    <p class="subtitle">10,000 p5.Vector bodies, Barnes–Hut self-gravity, dissipative collapse, dark halo, central core, and momentum-conserving mergers.</p>

    <div class="row"><label for="timeScale">Time scale</label><input id="timeScale" type="range" min="0.35" max="2.8" step="0.05" value="1.20"><output id="timeScaleOut">1.20×</output></div>
    <div class="row"><label for="gravity">Self-gravity</label><input id="gravity" type="range" min="0.45" max="1.65" step="0.01" value="1.00"><output id="gravityOut">1.00×</output></div>
    <div class="row"><label for="halo">Dark halo</label><input id="halo" type="range" min="0.25" max="1.80" step="0.01" value="1.00"><output id="haloOut">1.00×</output></div>
    <div class="row"><label for="spin">Initial spin</label><input id="spin" type="range" min="0.35" max="1.05" step="0.01" value="0.64"><output id="spinOut">0.64</output></div>
    <div class="row"><label for="cooling">Gas cooling</label><input id="cooling" type="range" min="0" max="1" step="0.01" value="0.56"><output id="coolingOut">0.56</output></div>
    <div class="row"><label for="theta">Tree opening θ</label><input id="theta" type="range" min="0.45" max="1.15" step="0.01" value="0.88"><output id="thetaOut">0.88</output></div>
    <div class="row"><label for="trails">Trail length</label><input id="trails" type="range" min="0" max="0.97" step="0.01" value="0.88"><output id="trailsOut">88%</output></div>
    <div class="row"><label for="zoom">View zoom</label><input id="zoom" type="range" min="0.72" max="1.65" step="0.01" value="1.00"><output id="zoomOut">1.00×</output></div>

    <div class="buttons">
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">New cloud</button>
      <button id="settleBtn">Fast settle</button>
    </div>
    <div class="checks">
      <label><input id="mergeToggle" type="checkbox" checked> mergers</label>
      <label><input id="treeToggle" type="checkbox"> quadtree</label>
      <label><input id="coreToggle" type="checkbox" checked> core glow</label>
    </div>
  </section>

  <aside class="stats" id="stats"></aside>
  <div class="help">Space pause · R reset · Q tree · M mergers · mouse wheel zoom</div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <script>
  'use strict';

  // ---------- Physical / numerical constants ----------
  const START_COUNT = 10000;
  const MAX_NODES = START_COUNT * 5 + 128;
  const WORLD_RADIUS = 355;
  const VIEW_RADIUS = 445;
  const G_BASE = 0.0052;
  const SOFTENING2 = 8.0;
  const HALO_MASS = 42000;
  const HALO_SCALE = 265;
  const INITIAL_CORE_MASS = 2800;
  const MAX_SPEED = 5.4;
  const MAX_ACCEL = 0.14;
  const MAX_DEPTH = 19;

  // ---------- Particle data ----------
  class StarParticle {
    constructor(x, y, vx, vy, mass, luminosity) {
      this.pos = createVector(x, y);       // p5.Vector motion state
      this.vel = createVector(vx, vy);     // p5.Vector motion state
      this.acc = createVector(0, 0);       // p5.Vector force / acceleration accumulator
      this.mass = mass;
      this.luminosity = luminosity;
      this.alive = true;
    }
    radius() { return Math.min(4.3, 0.48 + Math.sqrt(this.mass) * 0.31); }
  }

  let stars = [];
  let coreMass = INITIAL_CORE_MASS;
  let coreSpin = 0;
  let simTime = 0;
  let generationFrame = 0;
  let paused = false;
  let fastSettleFrames = 0;
  let mergesTotal = 0;
  let absorbedTotal = 0;
  let displayedFps = 60;
  let lastStatsUpdate = 0;
  let renderScale = 1;

  // ---------- Flat Barnes–Hut quadtree ----------
  const qx = new Float32Array(MAX_NODES);
  const qy = new Float32Array(MAX_NODES);
  const qhalf = new Float32Array(MAX_NODES);
  const qmass = new Float64Array(MAX_NODES);
  const qcomX = new Float64Array(MAX_NODES);
  const qcomY = new Float64Array(MAX_NODES);
  const qbody = new Int32Array(MAX_NODES);
  const qc0 = new Int32Array(MAX_NODES);
  const qc1 = new Int32Array(MAX_NODES);
  const qc2 = new Int32Array(MAX_NODES);
  const qc3 = new Int32Array(MAX_NODES);
  const traversalStack = new Int32Array(512);
  let nodeCount = 0;
  let rootHalf = 512;

  function initNode(index, x, y, half) {
    qx[index] = x; qy[index] = y; qhalf[index] = half;
    qmass[index] = 0; qcomX[index] = 0; qcomY[index] = 0;
    qbody[index] = -1;
    qc0[index] = qc1[index] = qc2[index] = qc3[index] = -1;
  }

  function newNode(x, y, half) {
    if (nodeCount >= MAX_NODES) return -1;
    const n = nodeCount++;
    initNode(n, x, y, half);
    return n;
  }

  function childFor(node, x, y) {
    const east = x >= qx[node];
    const south = y >= qy[node];
    if (!south) return east ? qc1[node] : qc0[node];
    return east ? qc3[node] : qc2[node];
  }

  function splitNode(node) {
    const h = qhalf[node] * 0.5;
    qc0[node] = newNode(qx[node] - h, qy[node] - h, h);
    qc1[node] = newNode(qx[node] + h, qy[node] - h, h);
    qc2[node] = newNode(qx[node] - h, qy[node] + h, h);
    qc3[node] = newNode(qx[node] + h, qy[node] + h, h);
  }

  function insertBody(node, bodyIndex, depth) {
    const s = stars[bodyIndex];
    const oldMass = qmass[node];
    const newMass = oldMass + s.mass;
    if (newMass > 0) {
      qcomX[node] = (qcomX[node] * oldMass + s.pos.x * s.mass) / newMass;
      qcomY[node] = (qcomY[node] * oldMass + s.pos.y * s.mass) / newMass;
    }
    qmass[node] = newMass;

    if (qbody[node] === -1 && qc0[node] === -1) {
      qbody[node] = bodyIndex;
      return;
    }

    if (qc0[node] === -1) {
      if (depth >= MAX_DEPTH || qhalf[node] < 0.002 || nodeCount + 4 >= MAX_NODES) {
        qbody[node] = -3; // aggregate leaf for coincident particles
        return;
      }
      const previous = qbody[node];
      qbody[node] = -2;
      splitNode(node);
      if (previous >= 0) insertBody(childFor(node, stars[previous].pos.x, stars[previous].pos.y), previous, depth + 1);
    }
    insertBody(childFor(node, s.pos.x, s.pos.y), bodyIndex, depth + 1);
  }

  function buildTree() {
    let maxExtent = 420;
    for (let i = 0; i < stars.length; i++) {
      const p = stars[i].pos;
      maxExtent = Math.max(maxExtent, Math.abs(p.x) + 8, Math.abs(p.y) + 8);
    }
    rootHalf = 1;
    while (rootHalf < maxExtent) rootHalf *= 2;
    rootHalf = Math.min(rootHalf, 4096);
    nodeCount = 0;
    newNode(0, 0, rootHalf);
    for (let i = 0; i < stars.length; i++) insertBody(0, i, 0);
  }

  function addBarnesHutAcceleration(i, theta, gravityScale) {
    const s = stars[i];
    const px = s.pos.x, py = s.pos.y;
    let ax = 0, ay = 0, top = 1;
    traversalStack[0] = 0;
    const theta2 = theta * theta;

    while (top > 0) {
      const node = traversalStack[--top];
      const mass = qmass[node];
      if (mass <= 0) continue;
      const dx = qcomX[node] - px;
      const dy = qcomY[node] - py;
      const d2 = dx * dx + dy * dy + SOFTENING2;
      const leaf = qc0[node] === -1;

      if (leaf) {
        if (qbody[node] === i && qbody[node] >= 0) continue;
        const invR = 1 / Math.sqrt(d2);
        const invR3 = invR * invR * invR;
        const f = G_BASE * gravityScale * mass * invR3;
        ax += dx * f; ay += dy * f;
      } else {
        const containsSelf = Math.abs(px - qx[node]) <= qhalf[node] && Math.abs(py - qy[node]) <= qhalf[node];
        const size2 = (qhalf[node] * 2) ** 2;
        if (!containsSelf && size2 < theta2 * d2) {
          const invR = 1 / Math.sqrt(d2);
          const invR3 = invR * invR * invR;
          const f = G_BASE * gravityScale * mass * invR3;
          ax += dx * f; ay += dy * f;
        } else {
          if (top + 4 < traversalStack.length) {
            traversalStack[top++] = qc0[node];
            traversalStack[top++] = qc1[node];
            traversalStack[top++] = qc2[node];
            traversalStack[top++] = qc3[node];
          }
        }
      }
    }

    // Central compact object (Plummer-softened) + extended dark matter halo.
    const r2 = px * px + py * py;
    const coreDen = Math.pow(r2 + SOFTENING2, 1.5);
    const haloDen = Math.pow(r2 + HALO_SCALE * HALO_SCALE, 1.5);
    const haloScale = Number(ui.halo.value);
    ax += -G_BASE * coreMass * px / coreDen;
    ay += -G_BASE * coreMass * py / coreDen;
    ax += -G_BASE * HALO_MASS * haloScale * px / haloDen;
    ay += -G_BASE * HALO_MASS * haloScale * py / haloDen;

    // A weak rotating m=2 bar perturbation seeds a physically common spiral density wave.
    const r = Math.sqrt(r2) + 1e-6;
    if (r < 330 && generationFrame > 140) {
      const angle = Math.atan2(py, px);
      const phase = 2 * (angle - coreSpin);
      const envelope = Math.exp(-r / 210) * Math.min(1, generationFrame / 900);
      const aTan = 0.00042 * envelope * Math.sin(phase);
      ax += -Math.sin(angle) * aTan;
      ay +=  Math.cos(angle) * aTan;
    }

    const a2 = ax * ax + ay * ay;
    if (a2 > MAX_ACCEL * MAX_ACCEL) {
      const k = MAX_ACCEL / Math.sqrt(a2); ax *= k; ay *= k;
    }
    s.acc.set(ax, ay);
  }

  // ---------- Local merge grid ----------
  const HASH_CELL = 4.8;
  const HASH_RADIUS = 720;
  const HASH_W = Math.ceil((HASH_RADIUS * 2) / HASH_CELL);
  const HASH_SIZE = HASH_W * HASH_W;
  const hashHead = new Int32Array(HASH_SIZE);
  const hashNext = new Int32Array(START_COUNT + 256);

  function hashIndex(x, y) {
    const cx = Math.floor((x + HASH_RADIUS) / HASH_CELL);
    const cy = Math.floor((y + HASH_RADIUS) / HASH_CELL);
    if (cx < 0 || cy < 0 || cx >= HASH_W || cy >= HASH_W) return -1;
    return cy * HASH_W + cx;
  }

  function mergeNearby() {
    let merged = 0;
    const allowMerges = ui.mergeToggle.checked && generationFrame > 90 && generationFrame % 10 === 0;
    if (!allowMerges) return;
    hashHead.fill(-1);

    for (let i = 0; i < stars.length; i++) {
      const a = stars[i];
      if (!a.alive) continue;
      const hi = hashIndex(a.pos.x, a.pos.y);
      if (hi < 0) continue;
      const cx = hi % HASH_W;
      const cy = (hi / HASH_W) | 0;

      if (allowMerges) {
        search:
        for (let oy = -1; oy <= 1; oy++) {
          const yy = cy + oy; if (yy < 0 || yy >= HASH_W) continue;
          for (let ox = -1; ox <= 1; ox++) {
            const xx = cx + ox; if (xx < 0 || xx >= HASH_W) continue;
            let j = hashHead[yy * HASH_W + xx];
            while (j !== -1) {
              const b = stars[j];
              if (b.alive) {
                const dx = b.pos.x - a.pos.x, dy = b.pos.y - a.pos.y;
                const contact = 0.20 + 0.060 * (Math.sqrt(a.mass) + Math.sqrt(b.mass));
                if (dx * dx + dy * dy < contact * contact) {
                  const rvx = b.vel.x - a.vel.x, rvy = b.vel.y - a.vel.y;
                  if (rvx * rvx + rvy * rvy < 0.18) {
                    let survivor = a, consumed = b;
                    if (b.mass > a.mass) { survivor = b; consumed = a; }
                    const total = survivor.mass + consumed.mass;
                    survivor.pos.set(
                      (survivor.pos.x * survivor.mass + consumed.pos.x * consumed.mass) / total,
                      (survivor.pos.y * survivor.mass + consumed.pos.y * consumed.mass) / total
                    );
                    survivor.vel.set(
                      (survivor.vel.x * survivor.mass + consumed.vel.x * consumed.mass) / total,
                      (survivor.vel.y * survivor.mass + consumed.vel.y * consumed.mass) / total
                    );
                    survivor.luminosity = Math.min(1, (survivor.luminosity * survivor.mass + consumed.luminosity * consumed.mass) / total + 0.03);
                    survivor.mass = total;
                    consumed.alive = false;
                    merged++; mergesTotal++;
                    if (consumed === a) break search;
                  }
                }
              }
              j = hashNext[j];
            }
          }
        }
      }

      if (a.alive) {
        hashNext[i] = hashHead[hi];
        hashHead[hi] = i;
      }
    }

    // Compact in place, preserving the p5.Vector objects of survivors.
    if (merged > 0 || absorbedTotal > 0) {
      let write = 0;
      for (let read = 0; read < stars.length; read++) {
        if (stars[read].alive) stars[write++] = stars[read];
      }
      stars.length = write;
    }
  }

  // ---------- Initial conditions ----------
  function circularSpeed(r, approximateBaryonicMass) {
    const rr = Math.max(2, r);
    const coreTerm = G_BASE * coreMass * rr * rr / Math.pow(rr * rr + SOFTENING2, 1.5);
    const haloTerm = G_BASE * HALO_MASS * rr * rr / Math.pow(rr * rr + HALO_SCALE * HALO_SCALE, 1.5);
    const enclosed = approximateBaryonicMass * (rr * rr / (rr * rr + 130 * 130));
    const diskTerm = G_BASE * enclosed / rr;
    return Math.sqrt(Math.max(0.001, coreTerm + haloTerm + diskTerm));
  }

  function gaussian() {
    const u = Math.max(1e-9, Math.random());
    const v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TWO_PI * v);
  }

  function createCloud() {
    stars = [];
    coreMass = INITIAL_CORE_MASS;
    coreSpin = 0;
    simTime = 0;
    generationFrame = 0;
    mergesTotal = 0;
    absorbedTotal = 0;
    fastSettleFrames = 0;
    const spin = Number(ui.spin.value);
    let estimatedMass = START_COUNT;

    for (let i = 0; i < START_COUNT; i++) {
      // A centrally concentrated projected cloud with a weak two-fold seed asymmetry.
      let angle = Math.random() * TWO_PI;
      angle += 0.12 * Math.sin(2 * angle) + gaussian() * 0.025;
      const radialSample = Math.pow(Math.random(), 0.62);
      const r = Math.max(7, WORLD_RADIUS * radialSample * (0.91 + 0.11 * gaussian()));
      const flattening = 0.84 + 0.10 * Math.random();
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r * flattening;
      const mass = 0.55 + Math.pow(Math.random(), 1.8) * 1.5;
      const vc = circularSpeed(r, estimatedMass);
      const inward = (0.07 + 0.10 * Math.random()) * vc;
      const noise = 0.13 * vc;
      const tx = -Math.sin(angle), ty = Math.cos(angle);
      const rx = Math.cos(angle), ry = Math.sin(angle);
      const vx = tx * vc * spin - rx * inward + gaussian() * noise;
      const vy = ty * vc * spin - ry * inward + gaussian() * noise;
      const lum = Math.min(1, 0.28 + Math.random() * 0.58 + mass * 0.05);
      stars.push(new StarParticle(x, y, vx, vy, mass, lum));
    }
    background(220);
  }

  // ---------- Evolution ----------
  function physicsStep(dt, recomputeForces = true) {
    if (stars.length === 0) return;
    if (recomputeForces) buildTree();
    const theta = Number(ui.theta.value);
    const gravityScale = Number(ui.gravity.value);
    const coolingControl = Number(ui.cooling.value);
    const ageFade = Math.max(0, 1 - generationFrame / 1800);
    const cooling = 1 - coolingControl * ageFade * 0.00075;

    if (recomputeForces) {
      for (let i = 0; i < stars.length; i++) addBarnesHutAcceleration(i, theta, gravityScale);
    }

    let newlyAbsorbed = 0;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      // Update the existing p5.Vector instances in place; no per-particle temporaries.
      s.vel.x += s.acc.x * dt;
      s.vel.y += s.acc.y * dt;
      s.vel.mult(cooling);
      const speed2 = s.vel.magSq();
      if (speed2 > MAX_SPEED * MAX_SPEED) s.vel.setMag(MAX_SPEED);
      s.pos.x += s.vel.x * dt;
      s.pos.y += s.vel.y * dt;

      const r2 = s.pos.magSq();
      const captureRadius = 3.8 + Math.log2(1 + coreMass / INITIAL_CORE_MASS) * 1.8;
      if (r2 < captureRadius * captureRadius) {
        coreMass += s.mass;
        s.alive = false;
        newlyAbsorbed++;
        absorbedTotal++;
      }
    }

    if (newlyAbsorbed > 0) {
      let write = 0;
      for (let read = 0; read < stars.length; read++) if (stars[read].alive) stars[write++] = stars[read];
      stars.length = write;
    }

    mergeNearby();
    coreSpin += 0.00105 * dt;
    simTime += dt;
    generationFrame++;
  }

  // ---------- Rendering ----------
  function drawTrailsFade() {
    const persistence = Number(ui.trails.value);
    if (persistence <= 0.01) {
      background(220);
      return;
    }
    const alpha = Math.max(3, Math.round((1 - persistence) * 66));
    noStroke();
    fill(220, 220, 220, alpha);
    rect(0, 0, width, height);
  }

  function renderStars() {
    const ctx = drawingContext;
    const zoom = Number(ui.zoom.value);
    renderScale = Math.min(width, height) / (VIEW_RADIUS * 2) * zoom;
    ctx.save();
    ctx.translate(width * 0.5, height * 0.5);
    ctx.scale(renderScale, renderScale);

    // Brightness bins reduce state changes while retaining variable luminosity.
    const bins = [[], [], [], [], [], [], [], []];
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const speedGlow = Math.min(0.16, s.vel.magSq() * 0.025);
      const b = Math.max(0, Math.min(7, ((s.luminosity + speedGlow) * 8) | 0));
      bins[b].push(s);
    }

    for (let b = 0; b < bins.length; b++) {
      const list = bins[b];
      if (!list.length) continue;
      const t = b / 7;
      const r = Math.round(42 - 24 * t);
      const g = Math.round(57 - 28 * t);
      const bl = Math.round(72 - 22 * t);
      ctx.fillStyle = `rgba(${r},${g},${bl},${0.38 + 0.56 * t})`;
      ctx.beginPath();
      for (let k = 0; k < list.length; k++) {
        const s = list[k];
        const rad = s.radius();
        ctx.moveTo(s.pos.x + rad, s.pos.y);
        ctx.arc(s.pos.x, s.pos.y, rad, 0, Math.PI * 2);
      }
      ctx.fill();
    }

    // The central massive object is also rendered only with circles.
    const coreR = 3.2 + Math.log2(1 + coreMass / INITIAL_CORE_MASS) * 1.6;
    if (ui.coreToggle.checked) {
      for (let ring = 4; ring >= 1; ring--) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(36,45,54,${0.018 * (5-ring)})`;
        ctx.arc(0, 0, coreR * (1 + ring * 1.9), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.beginPath();
    ctx.fillStyle = 'rgba(8,12,16,.96)';
    ctx.arc(0, 0, coreR, 0, Math.PI * 2);
    ctx.fill();

    if (ui.treeToggle.checked) drawQuadtree(ctx, 0, 0);
    ctx.restore();
  }

  function drawQuadtree(ctx) {
    ctx.strokeStyle = 'rgba(30,55,70,.11)';
    ctx.lineWidth = 0.7 / renderScale;
    ctx.beginPath();
    for (let n = 0; n < nodeCount; n++) {
      if (qc0[n] === -1 || qhalf[n] < 8 || qhalf[n] > rootHalf * 0.55) continue;
      const h = qhalf[n];
      ctx.rect(qx[n] - h, qy[n] - h, h * 2, h * 2);
    }
    ctx.stroke();
  }

  function updateStats() {
    const now = performance.now();
    if (now - lastStatsUpdate < 220) return;
    lastStatsUpdate = now;
    displayedFps = lerp(displayedFps, frameRate(), 0.25);

    let totalMass = coreMass;
    let angularMomentum = 0;
    let meanRadius = 0;
    let meanSpeed = 0;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      totalMass += s.mass;
      angularMomentum += s.mass * (s.pos.x * s.vel.y - s.pos.y * s.vel.x);
      meanRadius += s.pos.mag();
      meanSpeed += s.vel.mag();
    }
    const n = Math.max(1, stars.length);
    ui.stats.innerHTML =
      `<b>Particles</b> ${stars.length.toLocaleString()} / ${START_COUNT.toLocaleString()}<br>` +
      `<b>Core mass</b> ${coreMass.toFixed(1)}<br>` +
      `<b>Total mass</b> ${totalMass.toFixed(1)}<br>` +
      `<b>Mean radius</b> ${(meanRadius/n).toFixed(1)} px<br>` +
      `<b>Mean speed</b> ${(meanSpeed/n).toFixed(3)}<br>` +
      `<b>Angular L</b> ${(angularMomentum/1000).toFixed(1)}k<br>` +
      `<b>Mergers</b> ${mergesTotal.toLocaleString()}<br>` +
      `<b>Tree nodes</b> ${nodeCount.toLocaleString()}<br>` +
      `<b>FPS</b> ${displayedFps.toFixed(0)}`;
  }

  // ---------- p5 lifecycle ----------
  function setup() {
    const c = createCanvas(windowWidth, windowHeight, P2D);
    c.parent('app');
    pixelDensity(1);
    frameRate(60);
    ui = bindUI();
    createCloud();
  }

  function draw() {
    drawTrailsFade();
    if (!paused) {
      const timeScale = Number(ui.timeScale.value);
      // Gravity is recomputed every second or third display frame; particles still
      // integrate every frame using the latest field, which keeps 10,000 bodies fluid.
      const forceStride = displayedFps < 38 ? 3 : 2;
      const refreshGravity = frameCount < 3 || frameCount % forceStride === 0;
      let steps = fastSettleFrames > 0 ? 3 : 1;
      if (fastSettleFrames > 0) fastSettleFrames--;
      const dt = 0.94 * timeScale / Math.sqrt(steps);
      for (let s = 0; s < steps; s++) physicsStep(dt, refreshGravity && s === 0);
    }
    renderStars();
    updateStats();
  }

  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    background(220);
  }

  function mouseWheel(event) {
    if (mouseX > 350 || mouseY > 390) {
      const next = constrain(Number(ui.zoom.value) * (event.delta > 0 ? 0.94 : 1.06), 0.72, 1.65);
      ui.zoom.value = next.toFixed(2);
      ui.zoom.dispatchEvent(new Event('input'));
      return false;
    }
  }

  function keyPressed() {
    if (key === ' ') { togglePause(); return false; }
    if (key === 'r' || key === 'R') createCloud();
    if (key === 'q' || key === 'Q') ui.treeToggle.checked = !ui.treeToggle.checked;
    if (key === 'm' || key === 'M') ui.mergeToggle.checked = !ui.mergeToggle.checked;
  }

  // ---------- UI ----------
  let ui;
  function bindUI() {
    const ids = ['timeScale','gravity','halo','spin','cooling','theta','trails','zoom','mergeToggle','treeToggle','coreToggle','pauseBtn','resetBtn','settleBtn','stats'];
    const o = {};
    ids.forEach(id => o[id] = document.getElementById(id));
    const bind = (id, format) => {
      const input = o[id], out = document.getElementById(id + 'Out');
      const refresh = () => out.textContent = format(Number(input.value));
      input.addEventListener('input', refresh); refresh();
    };
    bind('timeScale', v => v.toFixed(2) + '×');
    bind('gravity', v => v.toFixed(2) + '×');
    bind('halo', v => v.toFixed(2) + '×');
    bind('spin', v => v.toFixed(2));
    bind('cooling', v => v.toFixed(2));
    bind('theta', v => v.toFixed(2));
    bind('trails', v => Math.round(v * 100) + '%');
    bind('zoom', v => v.toFixed(2) + '×');
    o.pauseBtn.addEventListener('click', togglePause);
    o.resetBtn.addEventListener('click', createCloud);
    o.settleBtn.addEventListener('click', () => { fastSettleFrames = 220; paused = false; syncPauseButton(); });
    return o;
  }

  function togglePause() { paused = !paused; syncPauseButton(); }
  function syncPauseButton() {
    ui.pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    ui.pauseBtn.classList.toggle('active', paused);
  }
  </script>
</body>
</html>
