<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Formation Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #220033;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            max-width: 280px;
        }
        #info h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #fff;
            font-weight: 600;
        }
        #info p {
            margin: 5px 0;
            line-height: 1.5;
        }
        #info .stat {
            color: #88ccff;
            font-family: monospace;
        }
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        #controls button {
            background: rgba(100,150,255,0.3);
            border: 1px solid rgba(100,150,255,0.5);
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 3px 0 0;
            transition: all 0.2s;
        }
        #controls button:hover {
            background: rgba(100,150,255,0.5);
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Galaxy Formation</h2>
        <p>Particles: <span class="stat" id="particleCount">0</span></p>
        <p>Time: <span class="stat" id="timeElapsed">0</span> Myrs</p>
        <p>Phase: <span class="stat" id="phase">Initializing</span></p>
        <p style="margin-top:10px;font-size:11px;color:rgba(255,255,255,0.5);">Drag to rotate view</p>
    </div>
    <div id="controls">
        <button onclick="resetSimulation()">Reset</button>
        <button onclick="toggleRotation()">Toggle Rotation</button>
        <button onclick="increaseSpeed()">Speed +</button>
        <button onclick="decreaseSpeed()">Speed -</button>
    </div>

    <script>
        // ============================================
        // QUADTREE IMPLEMENTATION FOR SPATIAL PARTITIONING
        // ============================================
        class Rectangle {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
            }

            contains(point) {
                return point.pos.x >= this.x - this.w &&
                       point.pos.x < this.x + this.w &&
                       point.pos.y >= this.y - this.h &&
                       point.pos.y < this.y + this.h;
            }

            intersects(range) {
                return !(range.x - range.w > this.x + this.w ||
                         range.x + range.w < this.x - this.w ||
                         range.y - range.h > this.y + this.h ||
                         range.y + range.h < this.y - this.h);
            }
        }

        class Quadtree {
            constructor(boundary, capacity) {
                this.boundary = boundary;
                this.capacity = capacity;
                this.particles = [];
                this.divided = false;
                this.northeast = null;
                this.northwest = null;
                this.southeast = null;
                this.southwest = null;
            }

            subdivide() {
                const x = this.boundary.x;
                const y = this.boundary.y;
                const w = this.boundary.w / 2;
                const h = this.boundary.h / 2;

                this.northeast = new Quadtree(new Rectangle(x + w, y - h, w, h), this.capacity);
                this.northwest = new Quadtree(new Rectangle(x - w, y - h, w, h), this.capacity);
                this.southeast = new Quadtree(new Rectangle(x + w, y + h, w, h), this.capacity);
                this.southwest = new Quadtree(new Rectangle(x - w, y + h, w, h), this.capacity);
                this.divided = true;
            }

            insert(particle) {
                if (!this.boundary.contains(particle)) {
                    return false;
                }

                if (this.particles.length < this.capacity) {
                    this.particles.push(particle);
                    return true;
                }

                if (!this.divided) {
                    this.subdivide();
                }

                return this.northeast.insert(particle) ||
                       this.northwest.insert(particle) ||
                       this.southeast.insert(particle) ||
                       this.southwest.insert(particle);
            }

            query(range, found = []) {
                if (!this.boundary.intersects(range)) {
                    return found;
                }

                for (let p of this.particles) {
                    if (range.contains(p)) {
                        found.push(p);
                    }
                }

                if (this.divided) {
                    this.northwest.query(range, found);
                    this.northeast.query(range, found);
                    this.southwest.query(range, found);
                    this.southeast.query(range, found);
                }

                return found;
            }

            queryRadius(center, radius) {
                const range = new Rectangle(center.x, center.y, radius, radius);
                return this.query(range);
            }
        }

        // ============================================
        // PARTICLE CLASS
        // ============================================
        class Particle {
            constructor(x, y, mass = null, isGas = true) {
                this.pos = createVector(x, y);
                this.vel = p5.Vector.random2D().mult(random(0.5, 2));

                // Initial velocity for collapsing cloud
                const toCenter = createVector(0, 0).sub(this.pos);
                this.vel.add(toCenter.normalize().mult(0.3));

                this.acc = createVector(0, 0);
                this.mass = mass || random(0.5, 3);
                this.radius = map(this.mass, 0.5, 3, 1, 3);

                // Brightness based on mass (more massive = brighter/larger stars)
                this.brightness = map(this.mass, 0.5, 3, 100, 255);

                // Color tint based on mass (massive = blue/white, small = red)
                this.temp = map(this.mass, 0.5, 3, 0, 1);
                this.isGas = isGas;
                this.trail = [];
                this.maxTrail = 5;
                this.merged = false;
                this.age = 0;
            }

            update(dt) {
                // Store trail
                if (frameCount % 3 === 0) {
                    this.trail.push(this.pos.copy());
                    if (this.trail.length > this.maxTrail) {
                        this.trail.shift();
                    }
                }

                // Velocity Verlet integration
                this.vel.add(p5.Vector.mult(this.acc, dt * 0.5));
                this.pos.add(p5.Vector.mult(this.vel, dt));
                this.vel.add(p5.Vector.mult(this.acc, dt * 0.5));
                this.acc.mult(0);
                this.age += dt;
            }

            applyForce(force) {
                this.acc.add(p5.Vector.div(force, this.mass));
            }

            draw() {
                // Draw trail
                for (let i = 0; i < this.trail.length - 1; i++) {
                    const alpha = map(i, 0, this.trail.length, 20, 60);
                    stroke(255, alpha);
                    strokeWeight(0.5);
                    line(this.trail[i].x, this.trail[i].y,
                         this.trail[i+1].x, this.trail[i+1].y);
                }

                // Draw particle
                noStroke();

                // Color based on temperature
                const r = lerp(255, 255, this.temp);
                const g = lerp(100, 200, this.temp);
                const b = lerp(100, 255, this.temp);

                fill(r, g, b, this.brightness);

                // Slight glow effect for larger particles
                if (this.radius > 2) {
                    fill(r, g, b, this.brightness * 0.3);
                    ellipse(this.pos.x, this.pos.y, this.radius * 3);
                }

                ellipse(this.pos.x, this.pos.y, this.radius * 2);
            }
        }

        // ============================================
        // SIMULATION PARAMETERS
        // ============================================
        let particles = [];
        let quadtree;
        let centralMass;
        let darkMatterHalo;
        let timeElapsed = 0;
        let rotationAngle = 0;
        let autoRotate = true;
        let simulationSpeed = 1;
        let canvas;
        let phase = "Initializing";
        const NUM_PARTICLES = 10000;
        const G = 0.5; // Gravitational constant
        const SOFTENING = 5; // Softening parameter to prevent singularities
        const CENTER_X = 0;
        const CENTER_Y = 0;

        function setup() {
            canvas = createCanvas(windowWidth, windowHeight);
            pixelDensity(1);
            resetSimulation();
        }

        function resetSimulation() {
            particles = [];
            timeElapsed = 0;
            phase = "Gravitational Collapse";
            centralMass = 5000;
            darkMatterHalo = {
                mass: 15000,
                radius: 800,
                coreRadius: 100
            };

            translate(width / 2, height / 2);

            // Create particles in a spherical cloud distribution
            for (let i = 0; i < NUM_PARTICLES; i++) {
                // Spherical distribution with some initial rotation
                const theta = random(TWO_PI);
                const phi = random(-PI/4, PI/4); // Flattened disk
                const r = random(0, 600) * pow(random(), 0.5); // Weighted toward outer regions

                const x = r * cos(theta) * cos(phi);
                const y = r * sin(theta) * cos(phi);

                // Initial velocity for disk formation
                const particle = new Particle(x, y, random(0.5, 3));

                // Give initial orbital velocity
                const orbitalSpeed = sqrt(G * centralMass / max(r, 50)) * random(0.3, 0.8);
                particle.vel = createVector(-sin(theta), cos(theta)).mult(orbitalSpeed);

                // Add some random motion
                particle.vel.add(p5.Vector.random2D().mult(random(0, 0.5)));

                // Initial inward drift for collapse
                const toCenter = createVector(-x, -y).normalize();
                particle.vel.add(toCenter.mult(random(0, 0.3)));

                particles.push(particle);
            }

            document.getElementById('particleCount').textContent = NUM_PARTICLES.toLocaleString();
        }

        function buildQuadtree() {
            const bounds = new Rectangle(CENTER_X, CENTER_Y, width, height);
            quadtree = new Quadtree(bounds, 8);
            for (let p of particles) {
                if (!p.merged) {
                    quadtree.insert(p);
                }
            }
        }

        function calculateForces() {
            // Central black hole gravity
            for (let p of particles) {
                if (p.merged) continue;

                // Force from central massive core
                let toCenter = createVector(CENTER_X, CENTER_Y).sub(p.pos);
                let dist = toCenter.mag();

                if (dist > 10) {
                    let forceMag = G * centralMass * p.mass / (dist * dist + SOFTENING);
                    p.applyForce(toCenter.normalize().mult(forceMag));
                }

                // Dark matter halo influence (more influence in outer regions)
                let darkMatterDist = dist / darkMatterHalo.radius;
                let darkMatterInfluence = exp(-darkMatterDist * darkMatterDist) * 0.5;
                let darkForceMag = G * darkMatterHalo.mass * p.mass * darkMatterInfluence / (dist * dist + SOFTENING * 4);
                p.applyForce(toCenter.normalize().mult(darkForceMag));
            }

            // Particle-particle gravity using quadtree
            for (let p of particles) {
                if (p.merged) continue;

                // Query nearby particles
                const searchRadius = 50;
                const nearby = quadtree.queryRadius(p.pos, searchRadius);

                for (let other of nearby) {
                    if (other === p || other.merged) continue;

                    let force = p5.Vector.sub(other.pos, p.pos);
                    let dist = force.mag();

                    if (dist > 1 && dist < searchRadius) {
                        // Gravitational force
                        let forceMag = G * p.mass * other.mass / (dist * dist + SOFTENING);
                        force.normalize().mult(forceMag);
                        p.applyForce(force);

                        // Merging for close particles
                        if (dist < 3 && p.mass < 5) {
                            // Conservation of momentum for merging
                            const totalMass = p.mass + other.mass;
                            p.vel = p5.Vector.add(
                                p5.Vector.mult(p.vel, p.mass),
                                p5.Vector.mult(other.vel, other.mass)
                            ).div(totalMass);
                            p.mass = min(totalMass, 10);
                            p.radius = map(p.mass, 0.5, 10, 1, 5);
                            p.brightness = map(p.mass, 0.5, 10, 100, 255);
                            p.temp = map(p.mass, 0.5, 10, 0, 1);
                            other.merged = true;
                        }
                    }
                }
            }

            // Apply differential rotation for spiral arm formation
            for (let p of particles) {
                if (p.merged) continue;

                let dist = p.pos.mag();
                if (dist > 20) {
                    // Keplerian rotation differential
                    let currentAngle = atan2(p.pos.y, p.pos.x);
                    let orbitalSpeed = sqrt(G * centralMass / dist) * 0.3;

                    // Angular velocity decreases with radius (Keplerian)
                    let targetVel = createVector(cos(currentAngle + 0.001), sin(currentAngle + 0.001)).mult(orbitalSpeed);

                    // Spiral arm density wave
                    let spiralPhase = log(dist) * 2 - currentAngle * 0.5;
                    let densityWave = sin(spiralPhase) * 0.05;

                    targetVel.rotate(densityWave);
                    p.vel.lerp(targetVel, 0.02);
                }
            }
        }

        function updateSimulation() {
            const dt = 0.016 * simulationSpeed;

            // Build quadtree
            buildQuadtree();

            // Calculate forces
            calculateForces();

            // Update particles
            for (let p of particles) {
                if (!p.merged) {
                    p.update(dt);
                }
            }

            // Remove merged particles
            particles = particles.filter(p => !p.merged);

            timeElapsed += dt * 10; // Scale to millions of years

            // Update phase display
            if (timeElapsed < 100) {
                phase = "Gravitational Collapse";
            } else if (timeElapsed < 500) {
                phase = "Disk Formation";
            } else if (timeElapsed < 2000) {
                phase = "Spiral Arm Development";
            } else {
                phase = "Galaxy Stabilization";
            }
        }

        function drawSimulation() {
            // Trail effect with background
            background(8, 0, 20, 40);

            push();

            // Camera rotation
            if (autoRotate) {
                rotationAngle += 0.001 * simulationSpeed;
            }

            translate(width / 2, height / 2);
            rotate(rotationAngle);
            scale(1);

            // Draw dark matter halo (subtle)
            noFill();
            for (let i = 5; i > 0; i--) {
                stroke(50, 30, 80, 20);
                strokeWeight(1);
                ellipse(0, 0, darkMatterHalo.radius * 2 * i / 5);
            }

            // Draw central core glow
            noStroke();
            for (let i = 20; i > 0; i--) {
                fill(100, 150, 255, 5);
                ellipse(0, 0, i * 10);
            }

            // Draw particles
            for (let p of particles) {
                p.draw();
            }

            // Draw some central particles brighter
            for (let p of particles) {
                let dist = p.pos.mag();
                if (dist < 50) {
                    fill(200, 220, 255, 200);
                    ellipse(p.pos.x, p.pos.y, p.radius * 3);
                }
            }

            pop();

            // Update UI
            document.getElementById('timeElapsed').textContent = timeElapsed.toFixed(0);
            document.getElementById('phase').textContent = phase;
            document.getElementById('particleCount').textContent = particles.length.toLocaleString();
        }

        function draw() {
            updateSimulation();
            drawSimulation();
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function mouseDragged() {
            rotationAngle += (mouseX - pmouseX) * 0.005;
            autoRotate = false;
        }

        function toggleRotation() {
            autoRotate = !autoRotate;
        }

        function increaseSpeed() {
            simulationSpeed = min(simulationSpeed * 1.5, 10);
        }

        function decreaseSpeed() {
            simulationSpeed = max(simulationSpeed / 1.5, 0.1);
        }

        // Make functions available globally for buttons
        window.resetSimulation = resetSimulation;
        window.toggleRotation = toggleRotation;
        window.increaseSpeed = increaseSpeed;
        window.decreaseSpeed = decreaseSpeed;
    </script>

      return;
    }
    var rect = target.getBoundingClientRect();
    var selector = getElementSelector(target);
    var text = getElementText(target);
    var attributes = getElementAttributes(target);

    // 更新悬停高亮框位置
    highlightBox.style.display = "block";
    highlightBox.style.left = "".concat(rect.left - 2, "px");
    highlightBox.style.top = "".concat(rect.top - 2, "px");
    highlightBox.style.width = "".concat(rect.width + 4, "px");
    highlightBox.style.height = "".concat(rect.height + 4, "px");

    // 更新标签位置和内容
    tagLabel.style.display = "block";
    tagLabel.textContent = "<".concat(target.tagName.toLowerCase(), ">");

    // 计算标签位置，确保不超出视窗
    var labelTop = rect.top - 22;
    var labelLeft = rect.left;

    // 如果标签会超出顶部，显示在元素下方
    if (labelTop < 0) {
      labelTop = rect.bottom + 5;
    }

    // 如果标签会超出右侧，向左调整
    if (labelLeft + tagLabel.offsetWidth > window.innerWidth) {
      labelLeft = window.innerWidth - tagLabel.offsetWidth - 5;
    }
    tagLabel.style.left = "".concat(Math.max(0, labelLeft), "px");
    tagLabel.style.top = "".concat(labelTop, "px");

    // 发送消息到父窗口
    var elementInfo = {
      tagName: target.tagName.toLowerCase(),
      rect: {
        left: rect.left,
        top: rect.top,
        right: rect.right,
        bottom: rect.bottom,
        width: rect.width,
        height: rect.height,
        x: rect.x,
        y: rect.y
      },
      selector: selector,
      text: text,
      attributes: attributes,
      url: window.location.href,
      path: window.location.pathname,
      timestamp: Date.now()
    };
    try {
      window.parent.postMessage({
        type: "iframe-element-hover",
        data: elementInfo,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 鼠标离开事件处理
  function handleMouseOut(e) {
    if (!highlightEnabled) return;
    var relatedTarget = e.relatedTarget;

    // 如果鼠标移动到高亮相关元素上，不隐藏高亮
    if (relatedTarget && (relatedTarget === highlightBox || relatedTarget === tagLabel || relatedTarget === overlay || relatedTarget === selectedBox || relatedTarget === selectedLabel)) {
      return;
    }
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    try {
      window.parent.postMessage({
        type: "iframe-element-hover",
        data: null,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 点击事件处理
  function handleClick(e) {
    var target = e.target;
    if (!target || target === overlay || target === highlightBox || target === tagLabel || target === selectedBox || target === selectedLabel) {
      return;
    }

    // 避免处理 html 和 body 元素
    if (target === document.documentElement || target === document.body) {
      return;
    }

    // 检查是否是交互元素，这些元素需要保留默认行为
    var isInteractiveElement = ['input', 'textarea', 'select', 'button', 'a'].includes(target.tagName.toLowerCase());

    // 如果高亮功能启用，对于非交互元素阻止默认行为和事件传播
    if (highlightEnabled) {
      e.preventDefault();
      e.stopPropagation();
    }
    var rect = target.getBoundingClientRect();
    var selector = getElementSelector(target);
    var text = getElementText(target);
    var attributes = getElementAttributes(target);
    console.log("Element clicked:", {
      tagName: target.tagName,
      selector: selector,
      rect: rect
    });

    // 立即更新选中高亮
    updateSelectedHighlight(target);

    // 隐藏悬停高亮，因为现在是选中状态
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    var elementInfo = {
      tagName: target.tagName.toLowerCase(),
      rect: {
        left: rect.left,
        top: rect.top,
        right: rect.right,
        bottom: rect.bottom,
        width: rect.width,
        height: rect.height,
        x: rect.x,
        y: rect.y
      },
      selector: selector,
      text: text,
      attributes: attributes,
      url: window.location.href,
      path: window.location.pathname,
      timestamp: Date.now()
    };
    try {
      window.parent.postMessage({
        type: "iframe-element-click",
        data: elementInfo,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 监听来自父窗口的消息
  function handleParentMessage(event) {
    console.log("Received message from parent:", event.data);
    if (event.data.type === "iframe-highlight-toggle") {
      var enabled = event.data.enabled;
      console.log("Highlight toggle:", enabled);
      if (enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "enable-iframe-highlight") {
      console.log("Enable iframe highlight");
      enableHighlight();
    } else if (event.data.type === "disable-iframe-highlight") {
      console.log("Disable iframe highlight");
      disableHighlight();
    } else if (event.data.type === "toggle-iframe-highlight") {
      var _enabled = event.data.enabled !== undefined ? event.data.enabled : !highlightEnabled;
      console.log("Toggle iframe highlight to:", _enabled);
      if (_enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "update-selected-element") {
      var selector = event.data.selector;
      console.log("Update selected element with selector:", selector);
      if (selector) {
        try {
          var element = document.querySelector(selector);
          console.log("Found element by selector:", element);
          updateSelectedHighlight(element);
        } catch (error) {
          console.warn("Failed to select element:", error);
          updateSelectedHighlight(null);
        }
      } else {
        updateSelectedHighlight(null);
      }
    } else if (event.data.type === "clear-selected-element") {
      console.log("Clear selected element");
      updateSelectedHighlight(null);
    }
  }

  // 启用高亮功能
  function enableHighlight() {
    console.log("Enabling highlight");
    document.addEventListener("mouseover", handleMouseOver, true);
    document.addEventListener("mouseout", handleMouseOut, true);
    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
</html>
