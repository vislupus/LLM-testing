<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Formation Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
</head>
<body>
    <script>
    // --- Simulation Constants & Globals ---
    let particles = [];
    const NUM_PARTICLES = 10000;

    // The gravitational constant. Fine-tuned for this simulation's scale.
    const G = 0.5;

    // The central "supermassive black hole"
    let centralMass;

    // The "dark matter halo" is not an object, but a force pulling particles towards the center.
    // This helps keep the galaxy from flying apart.
    const DARK_MATTER_STRENGTH = 0.0005;

    // Initial spin of the protogalactic cloud. Crucial for forming a disk.
    const INITIAL_SPIN = 1.5;


    // --- Quadtree Implementation for Performance ---
    // A Rectangle class to define the boundaries of a Quadtree node
    class Rectangle {
        constructor(x, y, w, h) {
            this.x = x;
            this.y = y;
            this.w = w;
            this.h = h;
        }

        // Check if a point is inside this rectangle
        contains(point) {
            return (point.pos.x >= this.x - this.w &&
                point.pos.x <= this.x + this.w &&
                point.pos.y >= this.y - this.h &&
                point.pos.y <= this.y + this.h);
        }

        // Check if another rectangle intersects with this one
        intersects(range) {
            return !(range.x - range.w > this.x + this.w ||
                range.x + range.w < this.x - this.w ||
                range.y - range.h > this.y + this.h ||
                range.y + range.h < this.y - this.h);
        }
    }

    // The Quadtree class
    class Quadtree {
        constructor(boundary, capacity) {
            this.boundary = boundary;
            this.capacity = capacity; // Max number of points before subdivision
            this.points = [];
            this.divided = false;
        }

        subdivide() {
            let x = this.boundary.x;
            let y = this.boundary.y;
            let w = this.boundary.w / 2;
            let h = this.boundary.h / 2;

            let ne = new Rectangle(x + w, y - h, w, h);
            this.northeast = new Quadtree(ne, this.capacity);
            let nw = new Rectangle(x - w, y - h, w, h);
            this.northwest = new Quadtree(nw, this.capacity);
            let se = new Rectangle(x + w, y + h, w, h);
            this.southeast = new Quadtree(se, this.capacity);
            let sw = new Rectangle(x - w, y + h, w, h);
            this.southwest = new Quadtree(sw, this.capacity);

            this.divided = true;
        }

        insert(point) {
            if (!this.boundary.contains(point)) {
                return false;
            }

            if (this.points.length < this.capacity) {
                this.points.push(point);
                return true;
            }

            if (!this.divided) {
                this.subdivide();
            }

            this.northeast.insert(point) ||
            this.northwest.insert(point) ||
            this.southeast.insert(point) ||
            this.southwest.insert(point);
        }

        // Query for points within a given range (another rectangle)
        query(range, found) {
            if (!found) {
                found = [];
            }

            if (!this.boundary.intersects(range)) {
                return found;
            }

            for (let p of this.points) {
                if (range.contains(p)) {
                    found.push(p);
                }
            }

            if (this.divided) {
                this.northwest.query(range, found);
                this.northeast.query(range, found);
                this.southwest.query(range, found);
                this.southeast.query(range, found);
            }

            return found;
        }
    }


    // --- Particle Class ---
    class Particle {
        constructor(x, y, mass) {
            this.pos = createVector(x, y);
            this.vel = createVector(0, 0);
            this.acc = createVector(0, 0);
            this.mass = mass;
            this.radius = sqrt(this.mass) * 0.5; // Visual size
            this.isMerged = false;
        }

        applyForce(force) {
            let f = p5.Vector.div(force, this.mass);
            this.acc.add(f);
        }
        
        // Calculate gravitational attraction to another particle
        attract(other) {
            let force = p5.Vector.sub(other.pos, this.pos);
            let distanceSq = constrain(force.magSq(), 25, 2500); // Avoid extreme forces
            let strength = (G * this.mass * other.mass) / distanceSq;
            force.setMag(strength);
            return force;
        }

        update() {
            this.vel.add(this.acc);
            this.pos.add(this.vel);
            this.acc.mult(0); // Reset acceleration for the next frame
        }

        draw() {
            // Brighter for more massive particles
            let brightness = map(sqrt(this.mass), 1, 15, 60, 255);
            fill(brightness);
            noStroke();
            ellipse(this.pos.x, this.pos.y, this.radius * 2);
        }
        
        // Handle merging with another particle
        merge(other) {
            let totalMass = this.mass + other.mass;
            
            // Conserve momentum: (m1*v1 + m2*v2) / (m1+m2)
            let newVel = p5.Vector.add(
                p5.Vector.mult(this.vel, this.mass),
                p5.Vector.mult(other.vel, other.mass)
            ).div(totalMass);

            // The more massive particle "eats" the other one
            if (this.mass >= other.mass) {
                this.mass = totalMass;
                this.vel = newVel;
                this.radius = sqrt(this.mass) * 0.5;
                other.isMerged = true;
            } else {
                other.mass = totalMass;
                other.vel = newVel;
                other.radius = sqrt(other.mass) * 0.5;
                this.isMerged = true;
            }
        }
    }

    // --- p5.js Main Functions ---
    function setup() {
        createCanvas(windowWidth, windowHeight);
        background(220); // Set the initial background color

        // Create the central supermassive object
        centralMass = new Particle(width / 2, height / 2, 8000);
        centralMass.isSuperMassive = true; // Flag to prevent it from moving

        // Generate the protogalactic cloud of particles
        for (let i = 0; i < NUM_PARTICLES; i++) {
            // Distribute particles in a disk using a Gaussian distribution for density
            let r = abs(randomGaussian(0, width / 4));
            let angle = random(TWO_PI);
            let x = width / 2 + r * cos(angle);
            let y = height / 2 + r * sin(angle);
            
            let p = new Particle(x, y, random(1, 4));

            // Give the cloud an initial rotation (Keplerian-like)
            let distToCenter = dist(width / 2, height / 2, p.pos.x, p.pos.y);
            let velMag = sqrt(G * centralMass.mass / distToCenter);
            let velDir = createVector(p.pos.y - height / 2, -(p.pos.x - width / 2));
            velDir.normalize();
            p.vel = velDir.mult(velMag * INITIAL_SPIN);
            
            // Add some random velocity jitter
            p.vel.add(p5.Vector.random2D().mult(0.1));
            
            particles.push(p);
        }
    }

    function draw() {
        // Draw a semi-transparent background to create motion trails
        background(220, 25);
        
        // Build the Quadtree for the current particle positions
        let boundary = new Rectangle(width / 2, height / 2, width / 2, height / 2);
        let qtree = new Quadtree(boundary, 4);
        for (let p of particles) {
            qtree.insert(p);
        }
        
        // Draw the central mass (it's part of the visual, but not in the main particle array)
        centralMass.draw();

        for (let p of particles) {
            if (p.isMerged) continue;
            
            // 1. Apply force from the central mass
            p.applyForce(p.attract(centralMass));
            
            // 2. Apply force from the "dark matter halo"
            let center = createVector(width / 2, height / 2);
            let darkMatterForce = p5.Vector.sub(center, p.pos);
            darkMatterForce.setMag(p.pos.dist(center) * DARK_MATTER_STRENGTH);
            p.applyForce(darkMatterForce);
            
            // 3. Query the quadtree to find nearby particles
            // The search range should be larger than the particle to find influencers
            let range = new Rectangle(p.pos.x, p.pos.y, p.radius * 20, p.radius * 20);
            let others = qtree.query(range);

            // 4. Interact with nearby particles (gravity and merging)
            for (let other of others) {
                if (p === other || other.isMerged) continue;
                
                // Check for collision/merging
                if (p.pos.dist(other.pos) < (p.radius + other.radius)) {
                    p.merge(other);
                    if (p.isMerged) break; // Stop interacting if this particle was eaten
                } else {
                    // If not merging, apply gravitational force
                    p.applyForce(p.attract(other));
                }
            }
        }
        
        // Update and draw all non-merged particles
        for (let p of particles) {
            if (!p.isMerged) {
                p.update();
                p.draw();
            }
        }
        
        // Remove merged particles for the next frame
        particles = particles.filter(p => !p.isMerged);
    }
    
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        // Restart simulation on resize
        particles = [];
        setup();
    }
    </script>
</body>
</html>
