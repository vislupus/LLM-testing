<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Garden - Cinematic 3D Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(180deg, #e8f4f8 0%, #fce4ec 50%, #fff8e1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        .overlay {
            position: fixed;
            z-index: 100;
            pointer-events: none;
        }

        .title-overlay {
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
        }

        .title-overlay h1 {
            font-size: 2.5rem;
            font-weight: 300;
            color: #4a4a4a;
            text-shadow: 2px 2px 10px rgba(255,255,255,0.8);
            letter-spacing: 0.3em;
            margin-bottom: 10px;
        }

        .title-overlay p {
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 0.2em;
        }

        .controls-overlay {
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
        }

        .controls-overlay p {
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 0.1em;
            background: rgba(255,255,255,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading h2 {
            color: white;
            font-weight: 300;
            letter-spacing: 0.3em;
            margin-bottom: 30px;
        }

        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.3s ease;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .time-indicator {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 8px 25px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 0.15em;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.15) 100%);
            z-index: 50;
        }

        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 51;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <h2>LOADING</h2>
        <div class="loading-bar">
            <div class="loading-bar-fill" id="loadingFill"></div>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="film-grain"></div>

    <div class="overlay title-overlay">
        <h1>ZEN GARDEN</h1>
        <p>JAPANESE TRADITIONAL GARDEN</p>
    </div>

    <div class="time-indicator" id="timeIndicator">DAWN</div>

    <div class="overlay controls-overlay">
        <p>Drag to orbit • Scroll to zoom • Double-click to reset</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================
        // JAPANESE GARDEN 3D - CINEMATIC EXPERIENCE
        // ============================================

        let scene, camera, renderer;
        let timeOfDay = 0;
        let petals = [];
        let koiFish = [];
        let bambooStalks = [];
        let lanternLights = [];
        let clock = new THREE.Clock();
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let cameraAngle = 0;
        let cameraRadius = 35;
        let cameraHeight = 25;
        let isAutoRotate = true;
        let isUserInteracting = false;

        const colors = {
            pagodaRoof: 0x3d3d3d,
            pagodaWall: 0xfafafa,
            pagodaBeam: 0x8b2323,
            pagodaBase: 0x6b6b6b,
            pagodaFinial: 0xd4af37,
            water: 0x87ceeb,
            waterDeep: 0x4a90a4,
            grass: 0x7cb342,
            grassDark: 0x558b2f,
            cherry: 0xffb7c5,
            cherryDark: 0xf48fb1,
            stone: 0x9e9e9e,
            stoneDark: 0x757575,
            bridge: 0xc62828,
            lantern: 0x8d6e63,
            lanternLight: 0xfff59d,
            bamboo: 0x4caf50,
            bambooDark: 0x2e7d32,
            koiRed: 0xf44336,
            koiWhite: 0xffffff,
            koiOrange: 0xff9800,
            koiBlack: 0x212121
        };

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xfce4ec, 0.008);

            // Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            setupLighting();

            // Create garden elements
            createGround();
            createPagoda();
            createPond();
            createBridge();
            createCherryTrees();
            createBamboo();
            createStonePath();
            createLanterns();
            createStoneElements();
            createCharacters();
            createPetals();

            // Event listeners
            setupEventListeners();

            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);

            // Start animation
            animate();
        }

        function setupLighting() {
            // Ambient light
            const ambient = new THREE.AmbientLight(0xffeedd, 0.4);
            scene.add(ambient);

            // Main directional light (sun)
            const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            sunLight.position.set(30, 40, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 100;
            sunLight.shadow.camera.left = -30;
            sunLight.shadow.camera.right = 30;
            sunLight.shadow.camera.top = 30;
            sunLight.shadow.camera.bottom = -30;
            sunLight.shadow.bias = -0.0001;
            sunLight.name = 'sunLight';
            scene.add(sunLight);

            // Hemisphere light for sky/ground color
            const hemi = new THREE.HemisphereLight(0x87ceeb, 0x7cb342, 0.3);
            scene.add(hemi);
        }

        function createGround() {
            // Main ground - island shape
            const groundGeometry = new THREE.CylinderGeometry(18, 20, 2, 64);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: colors.grass,
                roughness: 0.9,
                metalness: 0.0
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grass patches
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 14;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

                const grassPatch = new THREE.Mesh(
                    new THREE.CircleGeometry(Math.random() * 1.5 + 0.5, 8),
                    new THREE.MeshStandardMaterial({
                        color: Math.random() > 0.5 ? colors.grass : colors.grassDark,
                        roughness: 0.9
                    })
                );
                grassPatch.rotation.x = -Math.PI / 2;
                grassPatch.position.set(x, 0.01, z);
                grassPatch.receiveShadow = true;
                scene.add(grassPatch);
            }
        }

        function createPagoda() {
            const pagodaGroup = new THREE.Group();

            // Base platform
            const baseGeo = new THREE.BoxGeometry(6, 0.8, 6);
            const baseMat = new THREE.MeshStandardMaterial({ color: colors.pagodaBase, roughness: 0.8 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.4;
            base.castShadow = true;
            base.receiveShadow = true;
            pagodaGroup.add(base);

            // Stairs
            for (let i = 0; i < 4; i++) {
                const stair = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 0.2, 0.5),
                    new THREE.MeshStandardMaterial({ color: colors.stone, roughness: 0.7 })
                );
                stair.position.set(0, 0.1 + i * 0.2, 3.2 + i * 0.3);
                stair.castShadow = true;
                pagodaGroup.add(stair);
            }

            // Three levels of pagoda
            for (let level = 0; level < 3; level++) {
                const y = 1.2 + level * 3;
                const scale = 1 - level * 0.2;

                // Walls
                const wallGeo = new THREE.BoxGeometry(4 * scale, 1.5, 4 * scale);
                const wallMat = new THREE.MeshStandardMaterial({ color: colors.pagodaWall, roughness: 0.5 });
                const walls = new THREE.Mesh(wallGeo, wallMat);
                walls.position.y = y;
                walls.castShadow = true;
                walls.receiveShadow = true;
                pagodaGroup.add(walls);

                // Red beams
                const beamMat = new THREE.MeshStandardMaterial({ color: colors.pagodaBeam, roughness: 0.6 });

                // Vertical beams
                for (let b = 0; b < 4; b++) {
                    const angle = (b / 4) * Math.PI * 2 + Math.PI / 4;
                    const beam = new THREE.Mesh(
                        new THREE.BoxGeometry(0.15, 1.5, 0.15),
                        beamMat
                    );
                    beam.position.set(
                        Math.cos(angle) * 2 * scale,
                        y,
                        Math.sin(angle) * 2 * scale
                    );
                    beam.castShadow = true;
                    pagodaGroup.add(beam);
                }

                // Railings
                const railGeo = new THREE.BoxGeometry(4 * scale + 0.2, 0.1, 0.1);
                const railMat = new THREE.MeshStandardMaterial({ color: colors.pagodaBeam });
                for (let r = 0; r < 4; r++) {
                    const rail = new THREE.Mesh(railGeo, railMat);
                    rail.rotation.y = (r / 4) * Math.PI * 2;
                    rail.position.y = y - 0.6;
                    rail.castShadow = true;
                    pagodaGroup.add(rail);
                }

                // Roof
                const roofGeo = createPagodaRoof(4.5 * scale);
                const roofMat = new THREE.MeshStandardMaterial({ color: colors.pagodaRoof, roughness: 0.4 });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = y + 1.2;
                roof.castShadow = true;
                pagodaGroup.add(roof);

                // Roof finials
                const finialMat = new THREE.MeshStandardMaterial({ color: colors.pagodaFinial, metalness: 0.6 });
                for (let f = 0; f < 4; f++) {
                    const angle = (f / 4) * Math.PI * 2 + Math.PI / 4;
                    const finial = new THREE.Mesh(
                        new THREE.ConeGeometry(0.15, 0.5, 8),
                        finialMat
                    );
                    finial.position.set(
                        Math.cos(angle) * 3.8 * scale,
                        y + 1.8,
                        Math.sin(angle) * 3.8 * scale
                    );
                    finial.castShadow = true;
                    pagodaGroup.add(finial);
                }
            }

            // Central spire
            const spireMat = new THREE.MeshStandardMaterial({ color: colors.pagodaFinial, metalness: 0.6 });
            const spire = new THREE.Mesh(new THREE.ConeGeometry(0.2, 2, 8), spireMat);
            spire.position.y = 10.5;
            spire.castShadow = true;
            pagodaGroup.add(spire);

            // Top ornament
            const ornament = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 16, 16),
                spireMat
            );
            ornament.position.y = 11.5;
            ornament.castShadow = true;
            pagodaGroup.add(ornament);

            pagodaGroup.position.set(0, 0, -2);
            scene.add(pagodaGroup);
        }

        function createPagodaRoof(size) {
            const shape = new THREE.Shape();
            shape.moveTo(-size / 2, 0);
            shape.lineTo(0, size / 3);
            shape.lineTo(size / 2, 0);
            shape.lineTo(-size / 2, 0);

            const extrudeSettings = {
                steps: 1,
                depth: size * 0.8,
                bevelEnabled: false
            };

            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.rotateX(-Math.PI / 2);
            geometry.rotateY(Math.PI / 4);

            return geometry;
        }

        function createPond() {
            const pondGroup = new THREE.Group();

            // Pond base
            const pondShape = new THREE.Shape();
            pondShape.moveTo(0, 0);
            pondShape.bezierCurveTo(3, 0, 5, 2, 6, 4);
            pondShape.bezierCurveTo(7, 6, 5, 8, 3, 8);
            pondShape.bezierCurveTo(1, 8, -1, 6, 0, 4);
            pondShape.bezierCurveTo(1, 2, 0, 1, 0, 0);

            const pondGeo = new THREE.ExtrudeGeometry(pondShape, {
                depth: 0.5,
                bevelEnabled: true,
                bevelThickness: 0.1,
                bevelSize: 0.1,
                bevelSegments: 3
            });

            const waterMat = new THREE.MeshStandardMaterial({
                color: colors.water,
                roughness: 0.1,
                metalness: 0.3,
                transparent: true,
                opacity: 0.85
            });

            const pond = new THREE.Mesh(pondGeo, waterMat);
            pond.rotation.x = -Math.PI / 2;
            pond.position.set(-6, -0.3, 4);
            pond.receiveShadow = true;
            pondGroup.add(pond);

            // Pond edge stones
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 3.5 + Math.random() * 1.5;
                const stone = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(Math.random() * 0.4 + 0.2),
                    new THREE.MeshStandardMaterial({ color: colors.stone, roughness: 0.9 })
                );
                stone.position.set(
                    -6 + Math.cos(angle) * radius,
                    0.1,
                    4 + Math.sin(angle) * radius * 0.7
                );
                stone.rotation.set(Math.random(), Math.random(), Math.random());
                stone.castShadow = true;
                pondGroup.add(stone);
            }

            // Koi fish
            const koiColors = [colors.koiRed, colors.koiWhite, colors.koiOrange, colors.koiBlack];
            for (let i = 0; i < 8; i++) {
                const koi = createKoiFish(koiColors[i % 4]);
                koi.position.set(
                    -6 + (Math.random() - 0.5) * 5,
                    -0.1,
                    4 + (Math.random() - 0.5) * 6
                );
                koi.userData = {
                    baseX: koi.position.x,
                    baseZ: koi.position.z,
                    speed: Math.random() * 0.5 + 0.3,
                    phase: Math.random() * Math.PI * 2,
                    radius: Math.random() * 1.5 + 0.5
                };
                koiFish.push(koi);
                pondGroup.add(koi);
            }

            pondGroup.position.y = 0;
            scene.add(pondGroup);
        }

        function createKoiFish(mainColor) {
            const fishGroup = new THREE.Group();

            // Body
            const bodyGeo = new THREE.SphereGeometry(0.25, 16, 8);
            bodyGeo.scale(1.5, 0.5, 0.6);

            const bodyMat = new THREE.MeshStandardMaterial({
                color: mainColor,
                roughness: 0.3,
                metalness: 0.2
            });

            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            fishGroup.add(body);

            // Tail
            const tail = new THREE.Mesh(
                new THREE.ConeGeometry(0.2, 0.4, 4),
                bodyMat
            );
            tail.rotation.z = Math.PI / 2;
            tail.position.x = -0.4;
            tail.castShadow = true;
            fishGroup.add(tail);

            // Eyes
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            for (let e = 0; e < 2; e++) {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.03), eyeMat);
                eye.position.set(0.2, 0.05, e === 0 ? 0.15 : -0.15);
                fishGroup.add(eye);
            }

            return fishGroup;
        }

        function createBridge() {
            const bridgeGroup = new THREE.Group();

            const bridgeMat = new THREE.MeshStandardMaterial({ color: colors.bridge, roughness: 0.6 });

            // Bridge arch
            const archCurve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(-1.5, 0, 0),
                new THREE.Vector3(0, 0.8, 0),
                new THREE.Vector3(1.5, 0, 0)
            );

            const archPoints = archCurve.getPoints(20);

            // Planks
            for (let i = 0; i < 15; i++) {
                const t = i / 14;
                const point = archCurve.getPoint(t);
                const nextPoint = archCurve.getPoint(Math.min(t + 0.07, 1));

                const plank = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, 0.08, 1.2),
                    bridgeMat
                );
                plank.position.copy(point);
                plank.lookAt(nextPoint);
                plank.rotateX(Math.PI / 2);
                plank.castShadow = true;
                bridgeGroup.add(plank);
            }

            // Railings
            for (let side = -1; side <= 1; side += 2) {
                for (let i = 0; i < 8; i++) {
                    const t = i / 7;
                    const point = archCurve.getPoint(t);
                    const post = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.04, 0.04, 0.5),
                        bridgeMat
                    );
                    post.position.copy(point);
                    post.position.y += 0.25;
                    post.position.z += side * 0.5;
                    post.castShadow = true;
                    bridgeGroup.add(post);
                }

                // Top rail
                const railCurve = new THREE.CatmullRomCurve3(
                    archPoints.map(p => new THREE.Vector3(p.x, p.y + 0.5, p.z + side * 0.5))
                );
                const railGeo = new THREE.TubeGeometry(railCurve, 20, 0.04, 8, false);
                const rail = new THREE.Mesh(railGeo, bridgeMat);
                rail.castShadow = true;
                bridgeGroup.add(rail);
            }

            bridgeGroup.position.set(-4, 0.1, 2);
            bridgeGroup.rotation.y = Math.PI / 6;
            scene.add(bridgeGroup);
        }

        function createCherryTrees() {
            // Left cherry tree
            createCherryTree(-8, 0, -6);
            // Right cherry tree
            createCherryTree(7, 0, -5);
            // Back cherry tree
            createCherryTree(2, 0, -10);
        }

        function createCherryTree(x, y, z) {
            const treeGroup = new THREE.Group();

            // Trunk
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 });
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.5, 4, 8),
                trunkMat
            );
            trunk.position.y = 2;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // Branches
            for (let i = 0; i < 5; i++) {
                const branch = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.15, 2, 6),
                    trunkMat
                );
                branch.position.y = 3 + Math.random() * 1;
                branch.rotation.z = (Math.random() - 0.5) * 1.2;
                branch.rotation.y = (i / 5) * Math.PI * 2;
                branch.castShadow = true;
                treeGroup.add(branch);
            }

            // Blossom clouds
            const blossomMat = new THREE.MeshStandardMaterial({
                color: colors.cherry,
                roughness: 0.8,
                transparent: true,
                opacity: 0.9
            });

            for (let i = 0; i < 25; i++) {
                const blossom = new THREE.Mesh(
                    new THREE.SphereGeometry(Math.random() * 1.5 + 0.8, 12, 12),
                    blossomMat
                );
                blossom.position.set(
                    (Math.random() - 0.5) * 4,
                    4.5 + Math.random() * 2,
                    (Math.random() - 0.5) * 4
                );
                blossom.castShadow = true;
                treeGroup.add(blossom);
            }

            // Darker inner blossoms
            const darkBlossomMat = new THREE.MeshStandardMaterial({
                color: colors.cherryDark,
                roughness: 0.8
            });

            for (let i = 0; i < 10; i++) {
                const blossom = new THREE.Mesh(
                    new THREE.SphereGeometry(Math.random() * 1 + 0.5, 12, 12),
                    darkBlossomMat
                );
                blossom.position.set(
                    (Math.random() - 0.5) * 3,
                    4.5 + Math.random() * 1.5,
                    (Math.random() - 0.5) * 3
                );
                treeGroup.add(blossom);
            }

            treeGroup.position.set(x, y, z);
            scene.add(treeGroup);
        }

        function createBamboo() {
            // Left bamboo cluster
            createBambooCluster(-12, 0, -2);
            // Right bamboo cluster
            createBambooCluster(12, 0, 0);
        }

        function createBambooCluster(x, y, z) {
            const clusterGroup = new THREE.Group();

            const bambooMat = new THREE.MeshStandardMaterial({ color: colors.bamboo, roughness: 0.5 });
            const bambooDarkMat = new THREE.MeshStandardMaterial({ color: colors.bambooDark, roughness: 0.5 });

            for (let i = 0; i < 12; i++) {
                const height = Math.random() * 4 + 6;
                const bamboo = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.12, height, 8),
                    Math.random() > 0.3 ? bambooMat : bambooDarkMat
                );
                bamboo.position.set(
                    (Math.random() - 0.5) * 1.5,
                    height / 2,
                    (Math.random() - 0.5) * 1.5
                );
                bamboo.userData = {
                    originalX: bamboo.position.x,
                    swayPhase: Math.random() * Math.PI * 2,
                    swayAmount: Math.random() * 0.03 + 0.01
                };
                bambooStalks.push(bamboo);
                bamboo.castShadow = true;
                clusterGroup.add(bamboo);

                // Bamboo segments
                for (let s = 1; s < 6; s++) {
                    const segment = new THREE.Mesh(
                        new THREE.TorusGeometry(0.1, 0.02, 8, 16),
                        bambooDarkMat
                    );
                    segment.position.y = s * (height / 7);
                    segment.rotation.x = Math.PI / 2;
                    bamboo.add(segment);
                }

                // Leaves
                for (let l = 0; l < 4; l++) {
                    const leaf = new THREE.Mesh(
                        new THREE.ConeGeometry(0.1, 0.8, 4),
                        bambooMat
                    );
                    leaf.position.y = height - 0.5;
                    leaf.rotation.z = (Math.random() - 0.5) * 0.5;
                    leaf.rotation.y = (l / 4) * Math.PI * 2;
                    bamboo.add(leaf);
                }
            }

            clusterGroup.position.set(x, y, z);
            scene.add(clusterGroup);
        }

        function createStonePath() {
            const pathGroup = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: colors.stone, roughness: 0.85 });
            const stoneDarkMat = new THREE.MeshStandardMaterial({ color: colors.stoneDark, roughness: 0.9 });

            // Winding path from foreground to pagoda
            for (let i = 0; i < 25; i++) {
                const t = i / 24;
                const x = t * 0 - (1 - t) * 12; // Curve from front to pagoda
                const z = t * -2 + (1 - t) * 12; // Vertical position

                const stone = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(Math.random() * 0.4 + 0.25),
                    Math.random() > 0.5 ? stoneMat : stoneDarkMat
                );
                stone.position.set(x, 0.05, z);
                stone.rotation.set(
                    Math.random() * 0.3,
                    Math.random() * Math.PI,
                    Math.random() * 0.3
                );
                stone.scale.y = 0.4;
                stone.castShadow = true;
                stone.receiveShadow = true;
                pathGroup.add(stone);
            }

            scene.add(pathGroup);
        }

        function createLanterns() {
            // Multiple stone lanterns
            createLantern(4, 0, 6);
            createLantern(-9, 0, 2);
            createLantern(6, 0, -4);
            createLantern(-3, 0, -8);
        }

        function createLantern(x, y, z) {
            const lanternGroup = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: colors.lantern, roughness: 0.8 });

            // Base
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.2, 8), stoneMat);
            base.position.y = 0.1;
            base.castShadow = true;
            lanternGroup.add(base);

            // Stem
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1, 8), stoneMat);
            stem.position.y = 0.7;
            stem.castShadow = true;
            lanternGroup.add(stem);

            // Light chamber
            const chamberMat = new THREE.MeshStandardMaterial({
                color: 0xfff59d,
                emissive: 0xfff59d,
                emissiveIntensity: 0,
                transparent: true,
                opacity: 0.8
            });

            const chamber = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), chamberMat);
            chamber.position.y = 1.5;
            chamber.castShadow = true;
            lanternGroup.add(chamber);
            lanternLights.push(chamber);

            // Roof
            const roof = new THREE.Mesh(createLanternRoof(), stoneMat);
            roof.position.y = 1.9;
            roof.castShadow = true;
            lanternGroup.add(roof);

            // Point light (hidden, for actual lighting)
            const pointLight = new THREE.PointLight(0xffa726, 0, 8);
            pointLight.position.y = 1.5;
            lanternGroup.add(pointLight);
            lanternGroup.userData.light = pointLight;

            lanternGroup.position.set(x, y, z);
            scene.add(lanternGroup);
        }

        function createLanternRoof() {
            const shape = new THREE.Shape();
            shape.moveTo(-0.5, 0);
            shape.lineTo(0, 0.4);
            shape.lineTo(0.5, 0);
            shape.lineTo(-0.5, 0);

            const extrudeSettings = {
                steps: 1,
                depth: 0.7,
                bevelEnabled: false
            };

            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geometry.rotateX(-Math.PI / 2);
            geometry.rotateY(Math.PI / 2);

            return geometry;
        }

        function createStoneElements() {
            // Boulders near pond
            for (let i = 0; i < 6; i++) {
                const boulder = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(Math.random() * 0.8 + 0.5),
                    new THREE.MeshStandardMaterial({
                        color: Math.random() > 0.5 ? colors.stone : colors.stoneDark,
                        roughness: 0.9
                    })
                );
                boulder.position.set(
                    -10 + Math.random() * 3,
                    0.2,
                    8 + Math.random() * 2
                );
                boulder.rotation.set(Math.random(), Math.random(), Math.random());
                boulder.scale.y = 0.6;
                boulder.castShadow = true;
                scene.add(boulder);
            }

            // Topiary bushes
            for (let i = 0; i < 8; i++) {
                const bush = new THREE.Mesh(
                    new THREE.SphereGeometry(Math.random() * 0.4 + 0.3, 12, 12),
                    new THREE.MeshStandardMaterial({ color: colors.grassDark, roughness: 0.9 })
                );
                bush.position.set(
                    (Math.random() - 0.5) * 20,
                    0.3,
                    (Math.random() - 0.5) * 15
                );
                bush.scale.y = 0.7;
                bush.castShadow = true;
                scene.add(bush);
            }
        }

        function createCharacters() {
            // Walking woman
            createCharacter(-6, 0, 8, 0xffebee, 0x333333, 0);
            // Walking man
            createCharacter(-8, 0, 9, 0xc8e6c9, 0x333333, 0.3);
            // Man on bridge
            createCharacter(-4, 0.15, 1.5, 0xbbdefb, 0x333333, Math.PI / 6);
        }

        function createCharacter(x, y, z, shirtColor, pantsColor, rotation) {
            const charGroup = new THREE.Group();

            // Body
            const bodyMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.8 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.25), bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            charGroup.add(body);

            // Head
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.7 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), headMat);
            head.position.y = 1.5;
            head.castShadow = true;
            charGroup.add(head);

            // Legs
            const legsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.8 });
            for (let leg = -1; leg <= 1; leg += 2) {
                const legMesh = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.15), legsMat);
                legMesh.position.set(leg * 0.1, 0.35, 0);
                legMesh.castShadow = true;
                charGroup.add(legMesh);
            }

            // Arms
            for (let arm = -1; arm <= 1; arm += 2) {
                const armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), bodyMat);
                armMesh.position.set(arm * 0.25, 0.95, 0);
                armMesh.castShadow = true;
                charGroup.add(armMesh);
            }

            charGroup.position.set(x, y, z);
            charGroup.rotation.y = rotation;
            scene.add(charGroup);
        }

        function createPetals() {
            const petalMat = new THREE.MeshStandardMaterial({
                color: colors.cherry,
                roughness: 0.8,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });

            for (let i = 0; i < 100; i++) {
                const petal = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.15, 0.1),
                    petalMat.clone()
                );
                petal.position.set(
                    (Math.random() - 0.5) * 30,
                    Math.random() * 15 + 5,
                    (Math.random() - 0.5) * 30
                );
                petal.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                petal.userData = {
                    fallSpeed: Math.random() * 0.02 + 0.01,
                    swayPhase: Math.random() * Math.PI * 2,
                    swayAmount: Math.random() * 0.02 + 0.01,
                    rotSpeed: (Math.random() - 0.5) * 0.05
                };
                petals.push(petal);
                scene.add(petal);
            }
        }

        function setupEventListeners() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let interactionTimeout;

            const onMouseDown = (e) => {
                isDragging = true;
                isUserInteracting = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
                clearTimeout(interactionTimeout);
            };

            const onMouseMove = (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    cameraAngle -= deltaX * 0.005;
                    cameraHeight = Math.max(5, Math.min(40, cameraHeight + deltaY * 0.1));

                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            };

            const onMouseUp = () => {
                isDragging = false;
                interactionTimeout = setTimeout(() => {
                    isUserInteracting = false;
                }, 3000);
            };

            const onWheel = (e) => {
                e.preventDefault();
                cameraRadius = Math.max(15, Math.min(60, cameraRadius + e.deltaY * 0.05));
                isUserInteracting = true;
                clearTimeout(interactionTimeout);
                interactionTimeout = setTimeout(() => {
                    isUserInteracting = false;
                }, 3000);
            };

            const onDoubleClick = () => {
                cameraAngle = 0;
                cameraRadius = 35;
                cameraHeight = 25;
            };

            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('mouseleave', onMouseUp);
            renderer.domElement.addEventListener('wheel', onWheel, { passive: false });
            renderer.domElement.addEventListener('dblclick', onDoubleClick);

            // Touch support
            renderer.domElement.addEventListener('touchstart', (e) => {
                isDragging = true;
                isUserInteracting = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            renderer.domElement.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    const deltaX = e.touches[0].clientX - previousMousePosition.x;
                    const deltaY = e.touches[0].clientY - previousMousePosition.y;

                    cameraAngle -= deltaX * 0.005;
                    cameraHeight = Math.max(5, Math.min(40, cameraHeight + deltaY * 0.1));

                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });

            renderer.domElement.addEventListener('touchend', () => {
                isDragging = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function updateCameraPosition() {
            if (!isUserInteracting && isAutoRotate) {
                cameraAngle += 0.001;
            }

            camera.position.x = Math.cos(cameraAngle) * cameraRadius;
            camera.position.z = Math.sin(cameraAngle) * cameraRadius;
            camera.position.y = cameraHeight;
            camera.lookAt(0, 3, 0);
        }

        function updateTimeOfDay(delta) {
            timeOfDay += delta * 0.05;
            if (timeOfDay > 1) timeOfDay = 0;

            const sunLight = scene.getObjectByName('sunLight');

            // Sun position based on time
            const sunAngle = timeOfDay * Math.PI;
            const sunHeight = Math.sin(sunAngle) * 40;
            const sunX = Math.cos(sunAngle) * 30;

            sunLight.position.set(sunX, Math.max(5, sunHeight), 20);

            // Sun color and intensity based on time
            let sunColor, sunIntensity, ambientIntensity;
            let timeLabel;

            if (timeOfDay < 0.15) {
                // Dawn
                const t = timeOfDay / 0.15;
                sunColor = new THREE.Color().lerpColors(new THREE.Color(0xff6b6b), new THREE.Color(0xffd93d), t);
                sunIntensity = 0.3 + t * 0.5;
                ambientIntensity = 0.2 + t * 0.2;
                timeLabel = 'DAWN';
            } else if (timeOfDay < 0.35) {
                // Morning to Noon
                const t = (timeOfDay - 0.15) / 0.2;
                sunColor = new THREE.Color().lerpColors(new THREE.Color(0xffd93d), new THREE.Color(0xffffff), t);
                sunIntensity = 0.8 + t * 0.4;
                ambientIntensity = 0.4 + t * 0.1;
                timeLabel = t < 0.5 ? 'MORNING' : 'MIDDAY';
            } else if (timeOfDay < 0.65) {
                // Noon to Afternoon
                sunColor = new THREE.Color(0xffffff);
                sunIntensity = 1.2;
                ambientIntensity = 0.5;
                timeLabel = 'AFTERNOON';
            } else if (timeOfDay < 0.85) {
                // Evening
                const t = (timeOfDay - 0.65) / 0.2;
                sunColor = new THREE.Color().lerpColors(new THREE.Color(0xffffff), new THREE.Color(0xff6b6b), t);
                sunIntensity = 1.2 - t * 0.5;
                ambientIntensity = 0.5 - t * 0.2;
                timeLabel = t < 0.5 ? 'LATE AFTERNOON' : 'EVENING';
            } else {
                // Night
                const t = (timeOfDay - 0.85) / 0.15;
                sunColor = new THREE.Color().lerpColors(new THREE.Color(0xff6b6b), new THREE.Color(0x4a4a8a), t);
                sunIntensity = 0.7 - t * 0.6;
                ambientIntensity = 0.3 - t * 0.2;
                timeLabel = t < 0.5 ? 'TWILIGHT' : 'NIGHT';
            }

            sunLight.color = sunColor;
            sunLight.intensity = sunIntensity;

            // Update ambient light
            scene.children.forEach(child => {
                if (child.type === 'AmbientLight') {
                    child.intensity = ambientIntensity;
                }
                if (child.type === 'HemisphereLight') {
                    child.intensity = ambientIntensity * 0.6;
                    if (timeOfDay > 0.8 || timeOfDay < 0.15) {
                        child.groundColor = new THREE.Color(0x2d3436);
                    } else {
                        child.groundColor = new THREE.Color(0x7cb342);
                    }
                }
            });

            // Update lantern lights for night
            const isNight = timeOfDay > 0.8 || timeOfDay < 0.2;
            lanternLights.forEach(lantern => {
                const targetIntensity = isNight ? 2 : 0;
                lantern.material.emissiveIntensity += (targetIntensity - lantern.material.emissiveIntensity) * 0.02;
            });

            scene.traverse(obj => {
                if (obj.userData && obj.userData.light) {
                    const targetIntensity = isNight ? 1.5 : 0;
                    obj.userData.light.intensity += (targetIntensity - obj.userData.light.intensity) * 0.02;
                }
            });

            document.getElementById('timeIndicator').textContent = timeLabel;
        }

        function animatePetals(delta) {
            petals.forEach(petal => {
                petal.position.y -= petal.userData.fallSpeed;
                petal.position.x += Math.sin(petal.userData.swayPhase + petal.position.y) * petal.userData.swayAmount;
                petal.rotation.x += petal.userData.rotSpeed;
                petal.rotation.z += petal.userData.rotSpeed * 0.5;

                if (petal.position.y < 0) {
                    petal.position.y = Math.random() * 5 + 10;
                    petal.position.x = (Math.random() - 0.5) * 30;
                    petal.position.z = (Math.random() - 0.5) * 30;
                }
            });
        }

        function animateKoiFish(delta) {
            koiFish.forEach(koi => {
                const t = clock.getElapsedTime();
                koi.position.x = koi.userData.baseX + Math.sin(t * koi.userData.speed + koi.userData.phase) * koi.userData.radius;
                koi.position.z = koi.userData.baseZ + Math.cos(t * koi.userData.speed * 0.7 + koi.userData.phase) * koi.userData.radius * 0.5;
                koi.rotation.y = Math.sin(t * koi.userData.speed + koi.userData.phase) * 0.3;
            });
        }

        function animateBamboo(delta) {
            const t = clock.getElapsedTime();
            bambooStalks.forEach(stalk => {
                stalk.rotation.x = Math.sin(t * 0.5 + stalk.userData.swayPhase) * stalk.userData.swayAmount;
                stalk.rotation.z = Math.cos(t * 0.3 + stalk.userData.swayPhase) * stalk.userData.swayAmount * 0.5;
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            updateTimeOfDay(delta);
            updateCameraPosition();
            animatePetals(delta);
            animateKoiFish(delta);
            animateBamboo(delta);

            renderer.render(scene, camera);
        }

        // Initialize when page loads
        window.addEventListener('load', init);

        // Update loading bar
        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.random() * 15;
            if (loadProgress > 100) loadProgress = 100;
            document.getElementById('loadingFill').style.width = loadProgress + '%';
            if (loadProgress >= 100) {
                clearInterval(loadInterval);
            }
        }, 100);
    </script>
</body>
</html>
