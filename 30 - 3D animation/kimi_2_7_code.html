<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Garden Diorama</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #87CEEB; }
        #renderCanvas { width: 100%; height: 100%; display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            pointer-events: none; transition: opacity 0.5s;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="loading">Building Japanese Garden...</div>
    <script>
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.62, 0.83, 0.93);

            // Camera with smooth cinematic movement
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 3.2, 35, new BABYLON.Vector3(0, 3, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 18;
            camera.upperRadiusLimit = 60;
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = Math.PI / 2.2;
            camera.wheelPrecision = 50;
            camera.minZ = 0.5;

            // Post-process pipeline for depth-of-field and bloom
            const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
            pipeline.samples = 4;
            pipeline.fxaaEnabled = true;
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.7;
            pipeline.bloomWeight = 0.25;
            pipeline.bloomKernel = 64;
            pipeline.bloomScale = 0.5;
            pipeline.depthOfFieldEnabled = true;
            pipeline.depthOfField.focalLength = 35;
            pipeline.depthOfField.fStop = 1.8;
            pipeline.depthOfField.focusDistance = 2500;
            pipeline.depthOfFieldBlurLevel = BABYLON.DepthOfFieldEffectBlurLevel.Low;

            // Lighting
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.2, 1, 0.1), scene);
            hemi.intensity = 0.8;
            hemi.groundColor = new BABYLON.Color3(0.4, 0.5, 0.35);

            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5, -1, -0.8), scene);
            sun.intensity = 1.2;
            sun.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
            sun.position = new BABYLON.Vector3(20, 40, 20);

            // Shadows
            const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
            shadowGen.useBlurExponentialShadowMap = true;
            shadowGen.blurKernel = 32;

            // Glow for soft stylized look
            const glow = new BABYLON.GlowLayer("glow", scene);
            glow.intensity = 0.3;

            // Materials
            const matGrass = new BABYLON.PBRMaterial("grass", scene);
            matGrass.albedoColor = new BABYLON.Color3(0.45, 0.68, 0.35);
            matGrass.roughness = 1;
            matGrass.metallic = 0;

            const matPath = new BABYLON.PBRMaterial("path", scene);
            matPath.albedoColor = new BABYLON.Color3(0.78, 0.78, 0.75);
            matPath.roughness = 0.9;

            const matStone = new BABYLON.PBRMaterial("stone", scene);
            matStone.albedoColor = new BABYLON.Color3(0.6, 0.6, 0.58);
            matStone.roughness = 0.7;

            const matDarkStone = new BABYLON.PBRMaterial("darkStone", scene);
            matDarkStone.albedoColor = new BABYLON.Color3(0.35, 0.35, 0.35);
            matDarkStone.roughness = 0.8;

            const matWoodRed = new BABYLON.PBRMaterial("woodRed", scene);
            matWoodRed.albedoColor = new BABYLON.Color3(0.62, 0.21, 0.18);
            matWoodRed.roughness = 0.6;

            const matWoodDark = new BABYLON.PBRMaterial("woodDark", scene);
            matWoodDark.albedoColor = new BABYLON.Color3(0.25, 0.18, 0.13);
            matWoodDark.roughness = 0.7;

            const matWall = new BABYLON.PBRMaterial("wall", scene);
            matWall.albedoColor = new BABYLON.Color3(0.92, 0.88, 0.82);
            matWall.roughness = 0.9;

            const matRoof = new BABYLON.PBRMaterial("roof", scene);
            matRoof.albedoColor = new BABYLON.Color3(0.18, 0.18, 0.2);
            matRoof.roughness = 0.5;
            matRoof.metallic = 0.1;

            const matGold = new BABYLON.PBRMaterial("gold", scene);
            matGold.albedoColor = new BABYLON.Color3(0.95, 0.78, 0.25);
            matGold.metallic = 0.8;
            matGold.roughness = 0.25;

            const matBlack = new BABYLON.PBRMaterial("black", scene);
            matBlack.albedoColor = new BABYLON.Color3(0.08, 0.08, 0.1);
            matBlack.roughness = 0.5;

            const matWater = new BABYLON.PBRMaterial("water", scene);
            matWater.albedoColor = new BABYLON.Color3(0.25, 0.72, 0.75);
            matWater.alpha = 0.75;
            matWater.roughness = 0.05;
            matWater.metallic = 0.1;
            matWater.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;

            const matSakura = new BABYLON.PBRMaterial("sakura", scene);
            matSakura.albedoColor = new BABYLON.Color3(1, 0.82, 0.88);
            matSakura.roughness = 0.9;

            const matBamboo = new BABYLON.PBRMaterial("bamboo", scene);
            matBamboo.albedoColor = new BABYLON.Color3(0.55, 0.75, 0.25);
            matBamboo.roughness = 0.7;

            const matBambooStem = new BABYLON.PBRMaterial("bambooStem", scene);
            matBambooStem.albedoColor = new BABYLON.Color3(0.55, 0.62, 0.25);
            matBambooStem.roughness = 0.6;

            const matBush = new BABYLON.PBRMaterial("bush", scene);
            matBush.albedoColor = new BABYLON.Color3(0.22, 0.48, 0.18);
            matBush.roughness = 1;

            const matKoi1 = new BABYLON.PBRMaterial("koi1", scene);
            matKoi1.albedoColor = new BABYLON.Color3(0.95, 0.4, 0.15);
            matKoi1.roughness = 0.4;
            const matKoi2 = new BABYLON.PBRMaterial("koi2", scene);
            matKoi2.albedoColor = new BABYLON.Color3(1, 0.95, 0.9);
            matKoi2.roughness = 0.4;
            const matKoi3 = new BABYLON.PBRMaterial("koi3", scene);
            matKoi3.albedoColor = new BABYLON.Color3(0.12, 0.12, 0.15);
            matKoi3.roughness = 0.4;

            const matSkin = new BABYLON.PBRMaterial("skin", scene);
            matSkin.albedoColor = new BABYLON.Color3(0.96, 0.78, 0.68);
            matSkin.roughness = 0.6;

            const matShirt1 = new BABYLON.PBRMaterial("shirt1", scene);
            matShirt1.albedoColor = new BABYLON.Color3(0.2, 0.45, 0.25);
            matShirt1.roughness = 0.8;
            const matShirt2 = new BABYLON.PBRMaterial("shirt2", scene);
            matShirt2.albedoColor = new BABYLON.Color3(0.95, 0.95, 0.95);
            matShirt2.roughness = 0.8;
            const matShirt3 = new BABYLON.PBRMaterial("shirt3", scene);
            matShirt3.albedoColor = new BABYLON.Color3(0.15, 0.2, 0.35);
            matShirt3.roughness = 0.8;
            const matPants = new BABYLON.PBRMaterial("pants", scene);
            matPants.albedoColor = new BABYLON.Color3(0.18, 0.18, 0.25);
            matPants.roughness = 0.8;

            // Ground base
            const ground = BABYLON.MeshBuilder.CreateCylinder("ground", { diameter: 26, height: 0.8, tessellation: 64 }, scene);
            ground.position.y = -0.4;
            ground.material = matGrass;
            ground.receiveShadows = true;

            // Edge trim to hide water/gap
            const trim = BABYLON.MeshBuilder.CreateTorus("trim", { diameter: 26, thickness: 0.15, tessellation: 64 }, scene);
            trim.position.y = 0.01;
            trim.rotation.x = Math.PI / 2;
            trim.material = matDarkStone;
            trim.receiveShadows = true;

            // Pond
            const pondShape = [
                new BABYLON.Vector3(-3, 0, -2),
                new BABYLON.Vector3(3, 0, -2.5),
                new BABYLON.Vector3(5.5, 0, 0),
                new BABYLON.Vector3(4, 0, 3.5),
                new BABYLON.Vector3(0, 0, 4),
                new BABYLON.Vector3(-4.5, 0, 3),
            ];
            const pond = BABYLON.MeshBuilder.CreatePolygon("pond", { shape: pondShape, depth: 0.25, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
            pond.position.y = 0.02;
            pond.material = matWater;

            // Pond border stones
            for (let i = 0; i < pondShape.length; i++) {
                const p1 = pondShape[i];
                const p2 = pondShape[(i + 1) % pondShape.length];
                const mid = p1.add(p2).scale(0.5);
                const stone = BABYLON.MeshBuilder.CreateBox("pstone", { width: 0.6, height: 0.35, depth: BABYLON.Vector3.Distance(p1, p2) + 0.3 }, scene);
                stone.position.set(mid.x, 0.15, mid.z);
                stone.lookAt(new BABYLON.Vector3(p2.x, 0.15, p2.z));
                stone.material = matStone;
                stone.receiveShadows = true;
                shadowGen.addShadowCaster(stone);
            }

            // Path
            const pathPoints = [
                new BABYLON.Vector3(-7, 0.02, 2),
                new BABYLON.Vector3(-5, 0.02, 3),
                new BABYLON.Vector3(-2, 0.02, 2.5),
                new BABYLON.Vector3(0, 0.02, 4.5),
                new BABYLON.Vector3(3, 0.02, 4),
                new BABYLON.Vector3(5, 0.02, 2),
                new BABYLON.Vector3(7, 0.02, 1)
            ];
            for (let i = 0; i < pathPoints.length - 1; i++) {
                const p1 = pathPoints[i];
                const p2 = pathPoints[i + 1];
                const mid = p1.add(p2).scale(0.5);
                const len = BABYLON.Vector3.Distance(p1, p2);
                const seg = BABYLON.MeshBuilder.CreateBox("pathSeg", { width: 2.2, height: 0.05, depth: len }, scene);
                seg.position = mid;
                seg.lookAt(new BABYLON.Vector3(p2.x, 0.02, p2.z));
                seg.material = matPath;
                seg.receiveShadows = true;
            }

            // Stepping stones
            for (let i = 0; i < 12; i++) {
                const t = i / 11;
                const x = -5 + t * 10 + rand(-0.3, 0.3);
                const z = -1 + Math.sin(t * Math.PI) * 2 + rand(-0.3, 0.3);
                const stone = BABYLON.MeshBuilder.CreateCylinder("step", { diameter: rand(0.6, 1), height: 0.08, tessellation: 12 }, scene);
                stone.position.set(x, 0.05, z);
                stone.material = matStone;
                stone.receiveShadows = true;
            }

            // Pagoda
            function createPagoda() {
                const group = new BABYLON.TransformNode("pagoda", scene);
                group.position.set(-2, 0, -5);

                const base = BABYLON.MeshBuilder.CreateBox("base", { width: 7, height: 1.2, depth: 7 }, scene);
                base.position.y = 0.6;
                base.material = matStone;
                base.parent = group;
                base.receiveShadows = true;
                shadowGen.addShadowCaster(base);

                // Three tiers
                const tierWidths = [6, 5, 4];
                const tierHeights = [2.8, 2.4, 2.2];
                let y = 1.2;
                for (let i = 0; i < 3; i++) {
                    const w = tierWidths[i];
                    const h = tierHeights[i];
                    const body = BABYLON.MeshBuilder.CreateBox("body" + i, { width: w, height: h, depth: w }, scene);
                    body.position.y = y + h / 2;
                    body.material = matWall;
                    body.parent = group;
                    body.receiveShadows = true;
                    shadowGen.addShadowCaster(body);

                    // Red pillars/corners
                    const pillarSize = 0.35;
                    const offset = w / 2 - pillarSize / 2;
                    [[offset, offset], [offset, -offset], [-offset, offset], [-offset, -offset]].forEach(([px, pz]) => {
                        const pillar = BABYLON.MeshBuilder.CreateBox("pillar", { width: pillarSize, height: h, depth: pillarSize }, scene);
                        pillar.position.set(px, y + h / 2, pz);
                        pillar.material = matWoodRed;
                        pillar.parent = group;
                        shadowGen.addShadowCaster(pillar);
                    });

                    // Windows/doors
                    const doorW = 1.2;
                    [-1, 1].forEach(s => {
                        const door = BABYLON.MeshBuilder.CreateBox("door", { width: doorW, height: h * 0.55, depth: 0.08 }, scene);
                        door.position.set(s * (w / 4), y + h * 0.35, w / 2 + 0.02);
                        door.material = matWoodDark;
                        door.parent = group;
                        shadowGen.addShadowCaster(door);
                        const door2 = door.clone("door2");
                        door2.position.z = -w / 2 - 0.02;
                        door2.parent = group;
                        shadowGen.addShadowCaster(door2);
                    });

                    // Railing
                    const railH = 0.5;
                    const rail = BABYLON.MeshBuilder.CreateBox("rail", { width: w + 0.4, height: railH, depth: w + 0.4 }, scene);
                    rail.position.y = y + 0.25;
                    rail.material = matWoodRed;
                    rail.parent = group;
                    // Hollow railing via boolean? Simpler: use 4 thin bars
                    rail.dispose();
                    [-1, 1].forEach(sx => {
                        const bar = BABYLON.MeshBuilder.CreateBox("bar", { width: 0.15, height: railH, depth: w + 0.4 }, scene);
                        bar.position.set(sx * (w / 2 + 0.15), y + railH / 2, 0);
                        bar.material = matWoodRed;
                        bar.parent = group;
                        shadowGen.addShadowCaster(bar);
                        const bar2 = BABYLON.MeshBuilder.CreateBox("bar2", { width: w + 0.4, height: railH, depth: 0.15 }, scene);
                        bar2.position.set(0, y + railH / 2, sx * (w / 2 + 0.15));
                        bar2.material = matWoodRed;
                        bar2.parent = group;
                        shadowGen.addShadowCaster(bar2);
                    });

                // Roof tiles
                const roofW = w + 2.5;
                const roofH = 1.8;
                const roof = BABYLON.MeshBuilder.CreateCylinder("roof" + i, { diameterTop: 0, diameterBottom: roofW, height: roofH, tessellation: 4 }, scene);
                roof.position.y = y + h + roofH / 2 - 0.2;
                roof.rotation.y = Math.PI / 4;
                roof.material = matRoof;
                roof.parent = group;
                shadowGen.addShadowCaster(roof);

                // Roof tile ridge lines
                for (let ri = 0; ri < 4; ri++) {
                    const ridge = BABYLON.MeshBuilder.CreateBox("ridge", { width: 0.12, height: roofH - 0.1, depth: 0.12 }, scene);
                    const a = ri * Math.PI / 2 + Math.PI / 4;
                    ridge.position.set(Math.cos(a) * roofW * 0.32, roof.position.y, Math.sin(a) * roofW * 0.32);
                    ridge.rotation.y = a;
                    ridge.material = matRoof;
                    ridge.parent = group;
                    shadowGen.addShadowCaster(ridge);
                }

                    // Roof ornaments
                    const orn = BABYLON.MeshBuilder.CreateSphere("orn" + i, { diameter: 0.35 }, scene);
                    orn.position.y = y + h + roofH - 0.4;
                    orn.material = matGold;
                    orn.parent = group;

                    y += h + 0.3;
                }

                // Top spire
                const spire = BABYLON.MeshBuilder.CreateCylinder("spire", { diameterTop: 0, diameterBottom: 0.5, height: 2.5, tessellation: 8 }, scene);
                spire.position.y = y + 1.25;
                spire.material = matGold;
                spire.parent = group;
                shadowGen.addShadowCaster(spire);

                // Stairs
                const stairs = BABYLON.MeshBuilder.CreateBox("stairs", { width: 2.5, height: 0.5, depth: 2 }, scene);
                stairs.position.set(0, 0.25, 3.5);
                stairs.material = matStone;
                stairs.parent = group;
                stairs.receiveShadows = true;

                return group;
            }
            createPagoda();

            // Bridge
            function createBridge() {
                const group = new BABYLON.TransformNode("bridge", scene);
                group.position.set(3.5, 0, 2);
                const bridgeCurve = [];
                for (let i = 0; i <= 10; i++) {
                    const t = i / 10;
                    const x = -2.5 + t * 5;
                    const y = Math.sin(t * Math.PI) * 1.2;
                    bridgeCurve.push(new BABYLON.Vector3(x, y, 0));
                }
                const bridgePath = BABYLON.MeshBuilder.CreateTube("bridgePath", { path: bridgeCurve, radius: 0.12, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
                bridgePath.material = matWoodRed;
                bridgePath.parent = group;
                bridgePath.rotation.y = Math.PI / 2;
                shadowGen.addShadowCaster(bridgePath);

                // Planks
                for (let i = 0; i <= 10; i++) {
                    const t = i / 10;
                    const x = -2.5 + t * 5;
                    const y = Math.sin(t * Math.PI) * 1.2;
                    const plank = BABYLON.MeshBuilder.CreateBox("plank", { width: 2, height: 0.1, depth: 0.35 }, scene);
                    plank.position.set(0, y + 0.15, x);
                    plank.material = matWoodDark;
                    plank.parent = group;
                    shadowGen.addShadowCaster(plank);
                }

                // Railings
                [-0.9, 0.9].forEach(rx => {
                    const railCurve = [];
                    for (let i = 0; i <= 10; i++) {
                        const t = i / 10;
                        const x = -2.5 + t * 5;
                        const y = Math.sin(t * Math.PI) * 1.2 + 0.9;
                        railCurve.push(new BABYLON.Vector3(rx, y, x));
                    }
                    const rail = BABYLON.MeshBuilder.CreateTube("rail", { path: railCurve, radius: 0.08 }, scene);
                    rail.material = matWoodRed;
                    rail.parent = group;
                    shadowGen.addShadowCaster(rail);
                    for (let i = 0; i <= 5; i++) {
                        const t = i / 5;
                        const x = -2.5 + t * 5;
                        const y = Math.sin(t * Math.PI) * 1.2 + 0.45;
                        const post = BABYLON.MeshBuilder.CreateBox("post", { width: 0.12, height: 0.9, depth: 0.12 }, scene);
                        post.position.set(rx, y, x);
                        post.material = matWoodRed;
                        post.parent = group;
                        shadowGen.addShadowCaster(post);
                    }
                });
            }
            createBridge();

            // Stone lanterns
            function createLantern(x, z, s = 1) {
                const group = new BABYLON.TransformNode("lantern", scene);
                group.position.set(x, 0, z);
                group.scaling.scaleInPlace(s);

                const base = BABYLON.MeshBuilder.CreateBox("base", { width: 0.7, height: 0.3, depth: 0.7 }, scene);
                base.position.y = 0.15;
                base.material = matStone;
                base.parent = group;
                base.receiveShadows = true;
                shadowGen.addShadowCaster(base);

                const pillar = BABYLON.MeshBuilder.CreateBox("pillar", { width: 0.35, height: 1.2, depth: 0.35 }, scene);
                pillar.position.y = 0.9;
                pillar.material = matStone;
                pillar.parent = group;
                shadowGen.addShadowCaster(pillar);

                const cap = BABYLON.MeshBuilder.CreateBox("cap", { width: 0.9, height: 0.25, depth: 0.9 }, scene);
                cap.position.y = 1.55;
                cap.material = matStone;
                cap.parent = group;
                shadowGen.addShadowCaster(cap);

                const lightBox = BABYLON.MeshBuilder.CreateBox("light", { width: 0.45, height: 0.4, depth: 0.45 }, scene);
                lightBox.position.y = 1.2;
                lightBox.material = matDarkStone;
                lightBox.parent = group;
                shadowGen.addShadowCaster(lightBox);

                const top = BABYLON.MeshBuilder.CreateBox("top", { width: 0.5, height: 0.2, depth: 0.5 }, scene);
                top.position.y = 1.75;
                top.material = matStone;
                top.parent = group;
                shadowGen.addShadowCaster(top);
            }
            createLantern(-6, 2, 1.1);
            createLantern(-4, 5, 1);
            createLantern(2, 7, 0.9);
            createLantern(-7, -1, 0.9);

            // Bamboo clumps
            function createBamboo(x, z, count = 8) {
                const group = new BABYLON.TransformNode("bamboo", scene);
                group.position.set(x, 0, z);
                for (let i = 0; i < count; i++) {
                    const h = rand(3, 5);
                    const stem = BABYLON.MeshBuilder.CreateCylinder("stem", { diameter: 0.12, height: h, tessellation: 8 }, scene);
                    stem.position.set(rand(-0.6, 0.6), h / 2, rand(-0.6, 0.6));
                    stem.material = matBambooStem;
                    stem.parent = group;
                    shadowGen.addShadowCaster(stem);

                    // Leaves
                    for (let j = 0; j < 4; j++) {
                        const leaf = BABYLON.MeshBuilder.CreateBox("leaf", { width: 0.1, height: 0.6, depth: 0.02 }, scene);
                        leaf.position.set(stem.position.x + rand(-0.2, 0.2), rand(h * 0.4, h * 0.9), stem.position.z + rand(-0.2, 0.2));
                        leaf.rotation.set(rand(-0.5, 0.5), rand(0, Math.PI * 2), rand(-0.5, 0.5));
                        leaf.material = matBamboo;
                        leaf.parent = group;
                        shadowGen.addShadowCaster(leaf);
                    }
                }
            }
            createBamboo(-9, -2, 10);
            createBamboo(8, -4, 8);
            createBamboo(9, 4, 7);

            // Cherry blossom trees
            function createSakuraTree(x, z, scale = 1) {
                const group = new BABYLON.TransformNode("sakura", scene);
                group.position.set(x, 0, z);
                group.scaling.scaleInPlace(scale);

                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { diameterTop: 0.25, diameterBottom: 0.45, height: 3.5, tessellation: 8 }, scene);
                trunk.position.y = 1.75;
                trunk.material = matWoodDark;
                trunk.parent = group;
                shadowGen.addShadowCaster(trunk);

                // Branches
                for (let i = 0; i < 5; i++) {
                    const branch = BABYLON.MeshBuilder.CreateCylinder("branch", { diameterTop: 0.1, diameterBottom: 0.2, height: 1.8 }, scene);
                    const angle = (i / 5) * Math.PI * 2;
                    branch.position.set(Math.cos(angle) * 1, 3 + rand(0, 0.5), Math.sin(angle) * 1);
                    branch.rotation.z = rand(0.4, 0.8) * (Math.random() > 0.5 ? 1 : -1);
                    branch.rotation.y = angle;
                    branch.material = matWoodDark;
                    branch.parent = group;
                    shadowGen.addShadowCaster(branch);
                }

                // Flower clusters
                const clusterCount = 35;
                for (let i = 0; i < clusterCount; i++) {
                    const cluster = BABYLON.MeshBuilder.CreateSphere("flower", { diameter: rand(0.4, 0.7), segments: 6 }, scene);
                    const theta = rand(0, Math.PI * 2);
                    const phi = rand(0, Math.PI / 2);
                    const r = rand(1.2, 2.5);
                    cluster.position.set(
                        Math.sin(phi) * Math.cos(theta) * r,
                        3.5 + Math.cos(phi) * r,
                        Math.sin(phi) * Math.sin(theta) * r
                    );
                    cluster.material = matSakura;
                    cluster.parent = group;
                    shadowGen.addShadowCaster(cluster);
                }

                return group;
            }
            createSakuraTree(-7, -6, 1.3);
            createSakuraTree(7, -7, 1.1);
            createSakuraTree(8, 6, 1.2);

            // Bushes
            for (let i = 0; i < 18; i++) {
                const angle = rand(0, Math.PI * 2);
                const r = rand(7, 12);
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                if (x > -3 && x < 6 && z > -3 && z < 4) continue;
                const bush = BABYLON.MeshBuilder.CreateSphere("bush", { diameter: rand(0.8, 1.4), segments: 8 }, scene);
                bush.position.set(x, rand(0.3, 0.5), z);
                bush.scaling.y = 0.7;
                bush.material = matBush;
                bush.receiveShadows = true;
                shadowGen.addShadowCaster(bush);
            }

            // Rocks
            for (let i = 0; i < 12; i++) {
                const angle = rand(0, Math.PI * 2);
                const r = rand(5, 11);
                const rock = BABYLON.MeshBuilder.CreatePolyhedron("rock", { type: 1, size: rand(0.3, 0.7) }, scene);
                rock.position.set(Math.cos(angle) * r, 0.3, Math.sin(angle) * r);
                rock.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
                rock.material = matStone;
                rock.receiveShadows = true;
                shadowGen.addShadowCaster(rock);
            }

            // Koi fish
            const kois = [];
            function createKoi(colorMat, offset, radius, speed) {
                const body = BABYLON.MeshBuilder.CreateSphere("koi", { diameter: 0.35, segments: 8 }, scene);
                body.scaling.set(1.6, 0.6, 0.35);
                body.material = colorMat;
                const tail = BABYLON.MeshBuilder.CreateBox("tail", { width: 0.25, height: 0.05, depth: 0.25 }, scene);
                tail.position.x = -0.35;
                tail.rotation.z = Math.PI / 4;
                tail.material = colorMat;
                tail.parent = body;
                kois.push({ mesh: body, offset, radius, speed, tail });
                return body;
            }
            createKoi(matKoi1, 0, 2.2, 0.4);
            createKoi(matKoi2, 1.5, 1.8, 0.5);
            createKoi(matKoi1, 3, 2.5, 0.35);
            createKoi(matKoi3, 4.5, 1.5, 0.6);
            createKoi(matKoi2, 0.7, 2.0, 0.45);
            createKoi(matKoi1, 2.3, 1.6, 0.55);

            // People
            function createPerson(x, z, rot, shirtMat, pantsMat, isWoman = false) {
                const group = new BABYLON.TransformNode("person", scene);
                group.position.set(x, 0, z);
                group.rotation.y = rot;

                const leg1 = BABYLON.MeshBuilder.CreateBox("leg", { width: 0.18, height: 0.9, depth: 0.2 }, scene);
                leg1.position.set(-0.12, 0.45, 0);
                leg1.material = pantsMat;
                leg1.parent = group;
                shadowGen.addShadowCaster(leg1);
                const leg2 = leg1.clone("leg2");
                leg2.position.set(0.12, 0.45, 0);
                leg2.parent = group;
                shadowGen.addShadowCaster(leg2);

                const body = BABYLON.MeshBuilder.CreateBox("body", { width: 0.5, height: 0.7, depth: 0.28 }, scene);
                body.position.y = 1.25;
                body.material = shirtMat;
                body.parent = group;
                shadowGen.addShadowCaster(body);

                const head = BABYLON.MeshBuilder.CreateSphere("head", { diameter: 0.28 }, scene);
                head.position.y = 1.8;
                head.material = matSkin;
                head.parent = group;
                shadowGen.addShadowCaster(head);

                if (isWoman) {
                    const skirt = BABYLON.MeshBuilder.CreateBox("skirt", { width: 0.55, height: 0.55, depth: 0.32 }, scene);
                    skirt.position.y = 0.85;
                    skirt.material = pantsMat;
                    skirt.parent = group;
                    shadowGen.addShadowCaster(skirt);
                    leg1.dispose();
                    leg2.dispose();
                }

                // Arms
                [-1, 1].forEach(s => {
                    const arm = BABYLON.MeshBuilder.CreateBox("arm", { width: 0.12, height: 0.6, depth: 0.12 }, scene);
                    arm.position.set(s * 0.32, 1.3, 0);
                    arm.material = shirtMat;
                    arm.parent = group;
                    shadowGen.addShadowCaster(arm);
                });
            }
            createPerson(-1.5, 3, Math.PI / 6, matShirt2, matPants, true);
            createPerson(-0.2, 3.2, Math.PI / 5, matShirt1, matPants, false);
            const p3pants = new BABYLON.PBRMaterial("pants2", scene);
            p3pants.albedoColor = new BABYLON.Color3(0.6, 0.55, 0.5);
            p3pants.roughness = 0.8;
            createPerson(4.8, 2.5, -Math.PI / 3, matShirt3, p3pants, false);

            // Falling petals particle system using base64 1x1 pink texture
            const petalSystem = new BABYLON.ParticleSystem("petals", 200, scene);
            const petalTexture = new BABYLON.DynamicTexture("petalTex", { width: 32, height: 32 }, scene, false);
            const ctx = petalTexture.getContext();
            ctx.fillStyle = "#FFC0CB";
            ctx.beginPath();
            ctx.ellipse(16, 16, 10, 5, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            petalTexture.update();
            petalSystem.particleTexture = petalTexture;
            petalSystem.emitter = new BABYLON.Vector3(0, 8, 0);
            petalSystem.minEmitBox = new BABYLON.Vector3(-10, 0, -10);
            petalSystem.maxEmitBox = new BABYLON.Vector3(10, 0, 10);
            petalSystem.color1 = new BABYLON.Color4(1, 0.75, 0.85, 0.8);
            petalSystem.color2 = new BABYLON.Color4(1, 0.85, 0.9, 0.6);
            petalSystem.colorDead = new BABYLON.Color4(1, 0.9, 0.95, 0);
            petalSystem.minSize = 0.08;
            petalSystem.maxSize = 0.18;
            petalSystem.minLifeTime = 3;
            petalSystem.maxLifeTime = 6;
            petalSystem.emitRate = 25;
            petalSystem.gravity = new BABYLON.Vector3(0, -0.5, 0);
            petalSystem.direction1 = new BABYLON.Vector3(-0.5, -1, -0.5);
            petalSystem.direction2 = new BABYLON.Vector3(0.5, -1, 0.5);
            petalSystem.minEmitPower = 0.2;
            petalSystem.maxEmitPower = 0.6;
            petalSystem.updateSpeed = 0.02;
            petalSystem.start();

            // Soft ambient floating dust/light motes
            const motes = new BABYLON.ParticleSystem("motes", 80, scene);
            const motesTex = new BABYLON.DynamicTexture("motesTex", { width: 16, height: 16 }, scene, false);
            const mctx = motesTex.getContext();
            mctx.fillStyle = "rgba(255,255,255,0.6)";
            mctx.beginPath();
            mctx.arc(8, 8, 6, 0, Math.PI * 2);
            mctx.fill();
            motesTex.update();
            motes.particleTexture = motesTex;
            motes.emitter = new BABYLON.Vector3(0, 4, 0);
            motes.minEmitBox = new BABYLON.Vector3(-12, 0, -12);
            motes.maxEmitBox = new BABYLON.Vector3(12, 10, 12);
            motes.color1 = new BABYLON.Color4(1, 1, 0.95, 0.25);
            motes.color2 = new BABYLON.Color4(1, 1, 1, 0.15);
            motes.colorDead = new BABYLON.Color4(1, 1, 1, 0);
            motes.minSize = 0.05;
            motes.maxSize = 0.15;
            motes.minLifeTime = 4;
            motes.maxLifeTime = 9;
            motes.emitRate = 8;
            motes.gravity = new BABYLON.Vector3(0, 0.05, 0);
            motes.direction1 = new BABYLON.Vector3(-0.2, 0.3, -0.2);
            motes.direction2 = new BABYLON.Vector3(0.2, 0.6, 0.2);
            motes.minEmitPower = 0.05;
            motes.maxEmitPower = 0.15;
            motes.start();

            // Animations
            let time = 0;
            scene.registerBeforeRender(() => {
                time += 0.01;
                // Animate koi
                kois.forEach((k, i) => {
                    const t = time * k.speed + k.offset;
                    const x = Math.cos(t) * k.radius + 0.5;
                    const z = Math.sin(t) * k.radius * 0.6;
                    k.mesh.position.set(x, 0.1, z);
                    k.mesh.rotation.y = -t + Math.PI / 2;
                    k.tail.rotation.z = Math.PI / 4 + Math.sin(time * 10 + i) * 0.3;
                });

                // Camera gentle orbit + bob
                camera.alpha += 0.0006;
                camera.beta = Math.PI / 3.2 + Math.sin(time * 0.25) * 0.025;
                camera.radius = 35 + Math.sin(time * 0.18) * 1.5;
            });

            return scene;
        };

        function rand(min, max) { return Math.random() * (max - min) + min; }

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());

        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
        }, 500);
    </script>
</body>
</html>
