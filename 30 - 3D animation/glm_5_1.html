<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden of Serenity</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a1a1a;font-family:serif}
canvas{display:block}
#loading{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#2a3040,#1a1a1a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#d4c5a9;transition:opacity 2s ease}
#loading.done{opacity:0;pointer-events:none}
#loading h1{font-size:clamp(24px,4vw,42px);letter-spacing:6px;margin-bottom:20px;font-weight:300}
#loading p{font-size:14px;opacity:.6;margin-top:14px}
.bar{width:180px;height:2px;background:rgba(212,197,169,.15);border-radius:2px;overflow:hidden}
.bar-inner{width:0%;height:100%;background:#d4c5a9;border-radius:2px;transition:width .4s}
#ui{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:12px;opacity:0;transition:opacity 1.5s}
#ui.show{opacity:1}
#ui button{background:rgba(0,0,0,.35);color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.1);padding:7px 18px;border-radius:20px;cursor:pointer;font-family:serif;font-size:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .25s}
#ui button:hover{background:rgba(0,0,0,.5);color:#fff}
#ui button.on{background:rgba(180,140,80,.3);border-color:rgba(180,140,80,.4);color:#ffe0a0}
</style>
</head>
<body>
<div id="loading">
  <h1>Garden of Serenity</h1>
  <div class="bar"><div class="bar-inner" id="bar"></div></div>
  <p>Composing the scene...</p>
</div>
<div id="ui">
  <button id="btnCam" class="on">Auto Camera</button>
  <button id="btnBloom">Glow</button>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import*as THREE from'three';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';
import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';
import{RenderPass}from'three/addons/postprocessing/RenderPass.js';
import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';

/* ── Progress ── */
const bar=document.getElementById('bar');
let prog=0;
function setProgress(v){prog=Math.min(v,100);bar.style.width=prog+'%';}

/* ── Scene ── */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xc0cdd8,0.013);

const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,300);
camera.position.set(30,20,30);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
setProgress(10);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,0);
controls.enableDamping=true;
controls.dampingFactor=.04;
controls.minDistance=8;
controls.maxDistance=55;
controls.maxPolarAngle=Math.PI/2.05;
controls.update();

/* ── Lighting ── */
const hemi=new THREE.HemisphereLight(0x8eaac8,0x3d5530,.5);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xfff4e0,2.0);
sun.position.set(18,28,12);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=.5;sun.shadow.camera.far=80;
sun.shadow.camera.left=-25;sun.shadow.camera.right=25;
sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;
sun.shadow.bias=-.0008;sun.shadow.normalBias=.02;
scene.add(sun);

const fill=new THREE.DirectionalLight(0xaabbdd,.3);
fill.position.set(-10,8,-15);
scene.add(fill);

scene.add(new THREE.AmbientLight(0xc8b8a0,.25));
setProgress(15);

/* ── Materials ── */
const M={
  red:new THREE.MeshStandardMaterial({color:0xb83030,roughness:.45}),
  dkRed:new THREE.MeshStandardMaterial({color:0x7a1a1a,roughness:.5}),
  white:new THREE.MeshStandardMaterial({color:0xf2ece0,roughness:.55}),
  dark:new THREE.MeshStandardMaterial({color:0x181818,roughness:.9}),
  roof:new THREE.MeshStandardMaterial({color:0x505050,roughness:.35,side:THREE.DoubleSide}),
  roofR:new THREE.MeshStandardMaterial({color:0x6b3838,roughness:.4,side:THREE.DoubleSide}),
  stone:new THREE.MeshStandardMaterial({color:0x9a9a8a,roughness:.85}),
  grass:new THREE.MeshStandardMaterial({color:0x55773a,roughness:.95}),
  water:new THREE.MeshStandardMaterial({color:0x2a7a6a,roughness:.05,metalness:.35,transparent:true,opacity:.72}),
  wood:new THREE.MeshStandardMaterial({color:0x6b4226,roughness:.7}),
  bamboo:new THREE.MeshStandardMaterial({color:0x4a7a2a,roughness:.6}),
  bambooDk:new THREE.MeshStandardMaterial({color:0x3a6818,roughness:.55}),
  pink:new THREE.MeshStandardMaterial({color:0xffb0c4,roughness:.65}),
  pinkDk:new THREE.MeshStandardMaterial({color:0xf08898,roughness:.65}),
  pinkLt:new THREE.MeshStandardMaterial({color:0xffc8d8,roughness:.65}),
  lnStone:new THREE.MeshStandardMaterial({color:0x888878,roughness:.9}),
  lnGlow:new THREE.MeshStandardMaterial({color:0xffaa44,emissive:0xffaa44,emissiveIntensity:.6}),
  gravel:new THREE.MeshStandardMaterial({color:0xb0a888,roughness:.9}),
  gold:new THREE.MeshStandardMaterial({color:0xc0a030,metalness:.8,roughness:.2}),
  koi:new THREE.MeshStandardMaterial({color:0xff5500,roughness:.5}),
  koiW:new THREE.MeshStandardMaterial({color:0xffeedd,roughness:.5}),
  skin:new THREE.MeshStandardMaterial({color:0xf0d0b0,roughness:.6}),
  hair:new THREE.MeshStandardMaterial({color:0x151515,roughness:.8}),
  path:new THREE.MeshStandardMaterial({color:0xa09880,roughness:.85}),
};
setProgress(20);

/* ── Sky Dome ── */
(function(){
  const c=document.createElement('canvas');c.width=4;c.height=512;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#5a7ea0');g.addColorStop(.25,'#8aaac8');
  g.addColorStop(.5,'#b8c8d8');g.addColorStop(.7,'#d8ccb8');
  g.addColorStop(.85,'#e0d0b8');g.addColorStop(1,'#e8d8c0');
  x.fillStyle=g;x.fillRect(0,0,4,512);
  const t=new THREE.CanvasTexture(c);
  const s=new THREE.Mesh(new THREE.SphereGeometry(120,32,24),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false}));
  scene.add(s);
})();

/* ── Ground ── */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),M.grass);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;
scene.add(ground);
setProgress(25);

/* ── Gravel area ── */
const gravel=new THREE.Mesh(new THREE.CircleGeometry(9,48),M.gravel);
gravel.rotation.x=-Math.PI/2;gravel.position.set(0,.01,0);gravel.receiveShadow=true;
scene.add(gravel);

/* ── Stone path segments ── */
function addStone(x,z,sx,sz,rot){
  const s=new THREE.Mesh(new THREE.BoxGeometry(Math.max(.1,sx),.06,Math.max(.1,sz)),M.path);
  s.position.set(x,.03,z);s.rotation.y=rot||0;s.receiveShadow=true;scene.add(s);
}
// Main paths
for(let i=-12;i<=12;i+=.6){addStone(i,0,.45,.35,(Math.random()-.5)*.15);}
for(let i=-8;i<=8;i+=.6){addStone(0,i,.35,.45,(Math.random()-.5)*.15);}
// Diagonal paths
for(let t=-6;t<=6;t+=.6){addStone(t*.7,t*.7,.35,.35,(Math.random()-.5)*.2);}
for(let t=-6;t<=6;t+=.6){addStone(-t*.7,t*.7,.35,.35,(Math.random()-.5)*.2);}
setProgress(30);

/* ── Chinese Roof Generator ── */
function makeRoof(size,height,curl,mat){
  const seg=22;
  const pos=[],idx=[];
  for(let i=0;i<=seg;i++){
    for(let j=0;j<=seg;j++){
      const u=(i/seg)*2-1,v=(j/seg)*2-1;
      const x=u*size/2,z=v*size/2;
      const au=Math.abs(u),av=Math.abs(v);
      const d=Math.max(au,av);
      let y=height*(1-d);
      // Concave refinement
      y+=height*.08*d*d;
      // Upturned eaves
      if(d>.78){const t=(d-.78)/.22;y+=curl*t*t;}
      // Extra corner curl
      if(au>.5&&av>.5){const t=Math.pow((Math.min(au,av)-.5)/.5,2);y+=curl*.55*t;}
      // Ridge lines
      if((Math.abs(au-av)<.04)&&d>.08)y+=.06;
      pos.push(x,y,z);
    }
  }
  for(let i=0;i<seg;i++)for(let j=0;j<seg;j++){
    const a=i*(seg+1)+j,b=a+1,c=(i+1)*(seg+1)+j,dd=c+1;
    idx.push(a,c,b,b,c,dd);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;
  return m;
}
setProgress(35);

/* ── Pagoda ── */
const pagoda=new THREE.Group();
const levels=[
  {ps:6,ws:5,wh:3.2,rs:7.8,rh:1.6,curl:.55},
  {ps:5,ws:4,wh:2.6,rs:6.6,rh:1.3,curl:.45},
  {ps:4.2,ws:3.2,wh:2.1,rs:5.6,rh:1.0,curl:.35},
];
let cy=0;
levels.forEach((lv,li)=>{
  // Platform
  const plat=new THREE.Mesh(new THREE.BoxGeometry(lv.ps,.25,lv.ps),M.stone);
  plat.position.y=cy+.125;plat.castShadow=true;plat.receiveShadow=true;pagoda.add(plat);
  cy+=.25;
  // Walls
  const ws=lv.ws,wh=lv.wh,wt=.12;
  [[0,0,ws,wh,wt],[0,0,wt,wh,ws]].forEach(([ox,oz,sx,sy,sz],fi)=>{
    [-1,1].forEach(s=>{
      const wall=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),M.white);
      wall.position.set(ox,cy+wh/2,oz||(s*ws/2));
      if(fi===0)wall.position.z=s*ws/2; else wall.position.x=s*ws/2;
      wall.castShadow=true;pagoda.add(wall);
      // Windows
      const wn=li===0?3:li===1?2:1;
      for(let w=0;w<wn;w++){
        const wo=wn===1?0:(w-(wn-1)/2)*(ws/(wn+1));
        const win=new THREE.Mesh(new THREE.BoxGeometry(fi===0?.45:wt+.02,.6,fi===0?wt+.02:.45),M.dark);
        win.position.copy(wall.position);
        if(fi===0)win.position.x=wo; else win.position.z=wo;
        win.position.y=cy+wh*.62;
        pagoda.add(win);
      }
    });
  });
  // Pillars
  const pr=Math.max(.06,.1-li*.015);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const p=new THREE.Mesh(new THREE.CylinderGeometry(pr,pr+.02,wh,8),M.red);
    p.position.set(sx*ws/2,cy+wh/2,sz*ws/2);p.castShadow=true;pagoda.add(p);
  });
  // Mid-pillars for wider levels
  if(li<2){
    for(let s of[-1,1]){
      const mp=new THREE.Mesh(new THREE.CylinderGeometry(pr*.7,pr*.7,wh,6),M.red);
      mp.position.set(s*ws/2,cy+wh/2,0);mp.castShadow=true;pagoda.add(mp);
      const mp2=mp.clone();mp2.position.set(0,cy+wh/2,s*ws/2);pagoda.add(mp2);
    }
  }
  // Red trim
  const trim=new THREE.Mesh(new THREE.BoxGeometry(ws+.15,.12,ws+.15),M.red);
  trim.position.y=cy+wh;pagoda.add(trim);
  cy+=wh;
  // Roof
  const roof=makeRoof(lv.rs,lv.rh,lv.curl,li<2?M.roof:M.roofR);
  roof.position.y=cy;pagoda.add(roof);
  // Roof ridge ornament (end pieces)
  for(let sx of[-1,1])for(let sz of[-1,1]){
    const orn=new THREE.Mesh(new THREE.CylinderGeometry(.04,.08,.2,6),M.dkRed);
    orn.position.set(sx*lv.rs*.44,cy+lv.rh*.15,sz*lv.rs*.44);
    pagoda.add(orn);
  }
  cy+=lv.rh*.25;
});
// Spire
const sp=new THREE.Group();
sp.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,.4,8),M.stone),{position:{y:.2}}));
sp.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.04,.06,2.2,8),M.gold),{position:{y:1.5}}));
[.5,1.0,1.5].forEach(y=>{
  sp.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(.08,8,6),M.gold),{position:{y}}));
});
sp.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),M.gold),{position:{y:2.7}}));
sp.position.y=cy;pagoda.add(sp);
scene.add(pagoda);
setProgress(50);

/* ── Pond ── */
const pondR=5.5;
const pondGeo=new THREE.CircleGeometry(pondR,64);
pondGeo.rotateX(-Math.PI/2);
const pond=new THREE.Mesh(pondGeo,M.water);
pond.position.set(9,.04,6);pond.receiveShadow=true;
scene.add(pond);
// Pond rim stones
for(let a=0;a<Math.PI*2;a+=.25){
  const r=pondR+.3+Math.random()*.3;
  const s=new THREE.Mesh(new THREE.SphereGeometry(.2+Math.random()*.15,6,5),M.stone);
  s.position.set(9+Math.cos(a)*r,.1,6+Math.sin(a)*r);
  s.scale.y=.5;s.castShadow=true;scene.add(s);
}
// Store initial pond verts for animation
const pondInit=new Float32Array(pond.geometry.attributes.position.array);

/* ── Koi Fish ── */
const koiArr=[];
for(let i=0;i<6;i++){
  const k=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),i%3===0?M.koiW:M.koi);
  k.scale.set(2.2,.45,.7);scene.add(k);
  koiArr.push({mesh:k,a:(i/6)*Math.PI*2,r:1.5+Math.random()*2.8,sp:.25+Math.random()*.2,cx:9,cz:6});
}

/* ── Bridge ── */
(function(){
  const bL=7.5,bW=1.3,arch=2,seg=24;
  const pg=[],ig=[];
  for(let i=0;i<=seg;i++)for(let j=0;j<=1;j++){
    const t=i/seg,s=j;
    pg.push((t-.5)*bL,arch*4*t*(1-t),(s-.5)*bW);
  }
  for(let i=0;i<seg;i++){const a=i*2;ig.push(a,a+2,a+1,a+1,a+2,a+3);}
  const bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.Float32BufferAttribute(pg,3));bg.setIndex(ig);bg.computeVertexNormals();
  const bridge=new THREE.Mesh(bg,M.red);bridge.castShadow=true;bridge.receiveShadow=true;
  bridge.position.set(9,0,6);bridge.rotation.y=Math.PI*.15;scene.add(bridge);
  // Railings
  const rv=new THREE.CylinderGeometry(.025,.025,.45,5);
  for(let side of[-1,1])for(let i=0;i<=10;i++){
    const t=i/10;
    const px=(t-.5)*bL,py=arch*4*t*(1-t)+.22,pz=side*bW/2;
    const post=new THREE.Mesh(rv,M.dkRed);
    post.position.set(px,py,pz);bridge.add(post);
  }
  // Top rail as tube
  for(let side of[-1,1]){
    const pts=[];
    for(let i=0;i<=24;i++){
      const t=i/24;
      pts.push(new THREE.Vector3((t-.5)*bL,arch*4*t*(1-t)+.44,side*bW/2));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,24,.022,5,false),M.dkRed);
    bridge.add(tube);
  }
})();
setProgress(60);

/* ── Cherry Blossom Trees ── */
const cherryTrees=[];
function makeCherry(x,z,h,spread){
  const g=new THREE.Group();g.position.set(x,0,z);
  // Trunk
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.22,h,8),M.wood);
  trunk.position.y=h/2;trunk.castShadow=true;g.add(trunk);
  // Branches + blossoms
  const bCount=5+Math.floor(Math.random()*3);
  for(let i=0;i<bCount;i++){
    const ang=(i/bCount)*Math.PI*2+Math.random()*.4;
    const bLen=spread*(.4+Math.random()*.5);
    const bY=h*(.45+Math.random()*.35);
    const bg=new THREE.Group();bg.position.y=bY;bg.rotation.y=ang;
    bg.rotation.z=Math.PI/4.5+Math.random()*.25;
    const branch=new THREE.Mesh(new THREE.CylinderGeometry(.03,.07,bLen,5),M.wood);
    branch.position.y=bLen/2;branch.castShadow=true;bg.add(branch);
    // Blossom cluster
    const cs=Math.max(.2,bLen*.38);
    const blossom=new THREE.Mesh(new THREE.SphereGeometry(cs,8,7),[M.pink,M.pinkDk,M.pinkLt][i%3]);
    blossom.position.y=bLen*.85;blossom.scale.y=.55;blossom.castShadow=true;bg.add(blossom);
    g.add(bg);
  }
  // Top blossom
  const top=new THREE.Mesh(new THREE.SphereGeometry(spread*.35,9,8),M.pink);
  top.position.y=h+spread*.15;top.scale.y=.55;top.castShadow=true;g.add(top);
  scene.add(g);
  cherryTrees.push(g);
  return g;
}
makeCherry(-7,-4,4.5,3);
makeCherry(-5,7,5,3.5);
makeCherry(6,-7,4,2.8);
makeCherry(14,-3,4.5,3.2);
makeCherry(-10,2,5.5,3.8);
makeCherry(4,12,4,2.5);
makeCherry(-3,-9,3.8,2.6);
setProgress(68);

/* ── Bamboo Grove ── */
const bambooStalks=[];
(function(){
  const cx=-11,cz=-7,cnt=18,rad=4;
  for(let i=0;i<cnt;i++){
    const a=Math.random()*Math.PI*2,d=Math.random()*rad;
    const x=cx+Math.cos(a)*d,z=cz+Math.sin(a)*d;
    const h=5+Math.random()*5;
    const stalk=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,h,7),M.bamboo);
    stalk.position.set(x,h/2,z);stalk.castShadow=true;scene.add(stalk);
    bambooStalks.push(stalk);
    // Segment rings
    for(let s=1;s<Math.floor(h/.7);s++){
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.075,.012,5,8),M.bambooDk);
      ring.position.set(x,s*.7,z);ring.rotation.x=Math.PI/2;scene.add(ring);
    }
    // Leaves
    for(let l=0;l<4;l++){
      const leaf=new THREE.Mesh(new THREE.PlaneGeometry(.3+Math.random()*.15,.06),M.bamboo);
      leaf.position.set(x+(Math.random()-.5)*.4,h-.3+l*.25,z+(Math.random()-.5)*.4);
      leaf.rotation.set(Math.random(),Math.random(),Math.random());scene.add(leaf);
    }
  }
})();
setProgress(75);

/* ── Stone Lanterns ── */
function makeLantern(x,z,ry){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry||0;
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.28,.32,.15,6),M.lnStone),{position:{y:.075}}));
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,.9,6),M.lnStone),{position:{y:.6}}));
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(.35,.3,.35),M.lnStone),{position:{y:1.25}}));
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(.2,.18,.2),M.lnGlow),{position:{y:1.25}}));
  g.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(.3,.25,4),M.lnStone),{position:{y:1.55},rotation:{y:Math.PI/4}}));
  g.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(.04,5,5),M.lnStone),{position:{y:1.72}}));
  const pl=new THREE.PointLight(0xffaa44,.4,6);pl.position.y=1.25;g.add(pl);
  g.children.forEach(c=>{c.castShadow=true;});
  scene.add(g);return g;
}
makeLantern(3.5,3.5,.3);
makeLantern(-3.5,3.5,1.2);
makeLantern(3.5,-3.5,.8);
makeLantern(-3.5,-3.5,2);
makeLantern(9,1,-.5);
makeLantern(-6,-6,1.5);
setProgress(82);

/* ── People ── */
const people=[];
function makePerson(x,z,clothY,sc){
  sc=sc||1;const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(sc);
  const cloth=new THREE.MeshStandardMaterial({color:clothY,roughness:.65});
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,.7,8),cloth),{position:{y:.75}}));
  // Head
  g.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(.1,8,7),M.skin),{position:{y:1.25}}));
  // Hair
  g.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(.11,8,6),M.hair),{position:{y:1.3},scale:new THREE.Vector3(1,.75,1)}));
  g.children.forEach(c=>c.castShadow=true);
  scene.add(g);people.push({group:g,angle:Math.random()*Math.PI*2,radius:.5+Math.random()*1.5,speed:.08+Math.random()*.06,cx:x,cz:z});
  return g;
}
makePerson(2,5,0xcc4444);
makePerson(-4,-2,0x4466aa);
makePerson(7,-5,0x44aa66);
setProgress(86);

/* ── Shrubs ── */
function makeShrub(x,z,sz){
  const g=new THREE.Group();g.position.set(x,0,z);
  const n=3+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const r=Math.max(.1,sz*(.4+Math.random()*.5));
    const s=new THREE.Mesh(new THREE.SphereGeometry(r,7,6),
      new THREE.MeshStandardMaterial({color:new THREE.Color(.18+Math.random()*.1,.38+Math.random()*.15,.12+Math.random()*.08),roughness:.9}));
    s.position.set((Math.random()-.5)*sz,r*.65,(Math.random()-.5)*sz);
    s.castShadow=true;g.add(s);
  }
  scene.add(g);
}
[[-8,5],[5,9],[-6,-8],[12,5],[8,-8],[-12,0],[0,10],[-5,10],[10,10],[-9,-4],[15,2]].forEach(([x,z])=>makeShrub(x,z,.4+Math.random()*.4));
setProgress(90);

/* ── Small Rocks ── */
for(let i=0;i<30;i++){
  const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.15,0),M.stone);
  r.position.set((Math.random()-.5)*30,.06,(Math.random()-.5)*30);
  r.rotation.set(Math.random(),Math.random(),Math.random());
  r.scale.y=.5+Math.random()*.3;r.castShadow=true;scene.add(r);
}

/* ── Cherry Blossom Petals ── */
const petalN=600;
const petalGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(petalN*3);
const pVel=[];
for(let i=0;i<petalN;i++){
  pPos[i*3]=(Math.random()-.5)*50;
  pPos[i*3+1]=Math.random()*18+.5;
  pPos[i*3+2]=(Math.random()-.5)*50;
  pVel.push({x:(Math.random()-.5)*.015,y:-.008-Math.random()*.012,z:(Math.random()-.5)*.015,phase:Math.random()*6.28});
}
petalGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
// Petal texture
const pc=document.createElement('canvas');pc.width=32;pc.height=32;
const px=pc.getContext('2d');
const pg=px.createRadialGradient(16,16,0,16,16,14);
pg.addColorStop(0,'rgba(255,200,210,1)');pg.addColorStop(.6,'rgba(255,180,195,0.8)');pg.addColorStop(1,'rgba(255,160,180,0)');
px.fillStyle=pg;px.fillRect(0,0,32,32);
const petalTex=new THREE.CanvasTexture(pc);
const petals=new THREE.Points(petalGeo,new THREE.PointsMaterial({size:.22,map:petalTex,transparent:true,opacity:.85,depthWrite:false}));
scene.add(petals);
setProgress(94);

/* ── Low fog plane ── */
const fogP=new THREE.Mesh(new THREE.PlaneGeometry(60,60),
  new THREE.MeshBasicMaterial({color:0xc0cdd8,transparent:true,opacity:.1,side:THREE.DoubleSide,depthWrite:false}));
fogP.rotation.x=-Math.PI/2;fogP.position.y=.35;scene.add(fogP);

/* ── Post-processing ── */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.28,.6,.82);
composer.addPass(bloom);
setProgress(100);

/* ── State ── */
let autoCam=true,bloomOn=true;
const clock=new THREE.Clock();
let elapsed=0;

/* ── UI ── */
const btnCam=document.getElementById('btnCam');
const btnBloom=document.getElementById('btnBloom');
btnCam.onclick=()=>{autoCam=!autoCam;btnCam.classList.toggle('on',autoCam);};
btnBloom.onclick=()=>{bloomOn=!bloomOn;bloom.enabled=bloomOn;btnBloom.classList.toggle('on',bloomOn);};
controls.addEventListener('start',()=>{if(autoCam){autoCam=false;btnCam.classList.remove('on');}});

/* ── Loading done ── */
setTimeout(()=>{document.getElementById('loading').classList.add('done');document.getElementById('ui').classList.add('show');},800);

/* ── Animation ── */
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  elapsed+=dt;
  const t=elapsed;

  // Camera
  if(autoCam){
    const r=30+Math.sin(t*.06)*4;
    const sp=.12;
    camera.position.x=Math.cos(t*sp)*r;
    camera.position.z=Math.sin(t*sp)*r;
    camera.position.y=16+Math.sin(t*sp*.65)*5;
    camera.lookAt(0,4,0);
  }
  controls.update();

  // Water ripples
  const wPos=pond.geometry.attributes.position.array;
  for(let i=0;i<wPos.length;i+=3){
    const x=pondInit[i],z=pondInit[i+2];
    wPos[i+1]=Math.sin(x*2.5+t*1.8)*.025+Math.cos(z*3+t*1.4)*.02+Math.sin((x+z)*1.5+t*2.2)*.012;
  }
  pond.geometry.attributes.position.needsUpdate=true;

  // Koi
  koiArr.forEach(k=>{
    k.a+=k.sp*dt;
    k.mesh.position.x=k.cx+Math.cos(k.a)*k.r;
    k.mesh.position.z=k.cz+Math.sin(k.a)*k.r;
    k.mesh.position.y=.08+Math.sin(t*3+k.a)*.02;
    k.mesh.rotation.y=-k.a+Math.PI/2;
  });

  // Petals
  const pp=petals.geometry.attributes.position.array;
  for(let i=0;i<petalN;i++){
    const v=pVel[i];
    pp[i*3]+=v.x+Math.sin(t*1.2+v.phase)*.006;
    pp[i*3+1]+=v.y;
    pp[i*3+2]+=v.z+Math.cos(t*1.1+v.phase)*.006;
    if(pp[i*3+1]<0){
      pp[i*3]=(Math.random()-.5)*50;
      pp[i*3+1]=14+Math.random()*6;
      pp[i*3+2]=(Math.random()-.5)*50;
    }
  }
  petals.geometry.attributes.position.needsUpdate=true;

  // People walking
  people.forEach(p=>{
    p.angle+=p.speed*dt;
    p.group.position.x=p.cx+Math.cos(p.angle)*p.radius;
    p.group.position.z=p.cz+Math.sin(p.angle)*p.radius;
    p.group.rotation.y=-p.angle+Math.PI;
  });

  // Subtle tree sway
  cherryTrees.forEach((tr,i)=>{
    tr.rotation.z=Math.sin(t*.4+i)*.012;
    tr.rotation.x=Math.cos(t*.35+i*1.3)*.008;
  });

  // Bamboo sway
  bambooStalks.forEach((s,i)=>{
    s.rotation.z=Math.sin(t*.6+i*.5)*.02;
    s.rotation.x=Math.cos(t*.5+i*.7)*.012;
  });

  // Lantern pulse
  const pulse=.35+Math.sin(t*2)*.1;
  scene.traverse(o=>{
    if(o.isPointLight)o.intensity=o.position.y>1&&o.position.y<2?pulse:o.intensity;
  });

  composer.render();
}
animate();

/* ── Resize ── */
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
