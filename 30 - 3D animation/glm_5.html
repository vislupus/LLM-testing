<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Garden - Cinematic 3D Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Georgia', serif;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease-out;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-text {
            color: #e8d5b7;
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(232, 213, 183, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #e8d5b7, #f5e6d3);
            animation: loading 2s ease-in-out infinite;
        }
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 100%; }
            100% { width: 0%; }
        }
        #info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(232, 213, 183, 0.7);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 100;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        #title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #e8d5b7;
            font-size: 1.2rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            z-index: 100;
            text-shadow: 0 2px 20px rgba(0,0,0,0.8);
        }
        .controls {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        .control-btn {
            background: rgba(232, 213, 183, 0.1);
            border: 1px solid rgba(232, 213, 183, 0.3);
            color: #e8d5b7;
            padding: 10px 25px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .control-btn:hover {
            background: rgba(232, 213, 183, 0.2);
            border-color: rgba(232, 213, 183, 0.5);
        }
        .control-btn.active {
            background: rgba(232, 213, 183, 0.3);
            border-color: #e8d5b7;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-text">Entering the Garden</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>
    <div id="title">禅 Zen Garden</div>
    <div id="canvas-container"></div>
    <div class="controls">
        <button class="control-btn active" id="autoRotate">Auto Rotate</button>
        <button class="control-btn" id="toggleDOF">Toggle DOF</button>
        <button class="control-btn" id="togglePetals">Petals</button>
    </div>
    <div id="info">Click and drag to explore • Scroll to zoom</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

        // Scene setup
        let scene, camera, renderer, composer, controls;
        let pagoda, koiPond, bridge, cherryTrees = [], lanterns = [], bamboo = [], petals = [], koiFish = [];
        let dofPass, bloomPass;
        let autoRotate = true;
        let dofEnabled = true;
        let petalsEnabled = true;
        let time = 0;
        let mouseX = 0, mouseY = 0;

        // Color palette
        const colors = {
            pagodaRoof: 0x2c2c2c,
            pagodaWalls: 0xf5f5f0,
            pagodaBeams: 0xc41e3a,
            pagodaGold: 0xffd700,
            grass: 0x4a7c59,
            grassLight: 0x6b9b6f,
            water: 0x3d6b8c,
            waterDeep: 0x2a4d63,
            stone: 0x8c8c8c,
            stoneDark: 0x666666,
            cherry: 0xffb7c5,
            cherryDark: 0xe8909c,
            bamboo: 0x5d8a5d,
            bridge: 0xc41e3a,
            lantern: 0xf5f5dc,
            light: 0xfff8e7
        };

        init();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(25, 20, 25);

            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1;
            controls.minDistance = 15;
            controls.maxDistance = 60;
            controls.target.set(0, 3, 0);

            // Lighting
            setupLighting();

            // Create scene elements
            createGround();
            createPagoda();
            createKoiPond();
            createBridge();
            createCherryTrees();
            createBamboo();
            createLanterns();
            createPaths();
            createPetals();
            createKoiFish();
            createAmbientParticles();
            createSkyDome();

            // Post-processing
            setupPostProcessing();

            // Events
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
            setupControls();

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 2000);

            animate();
        }

        function setupLighting() {
            // Ambient light
            const ambient = new THREE.AmbientLight(0x404060, 0.4);
            scene.add(ambient);

            // Main directional light (sun)
            const sunLight = new THREE.DirectionalLight(0xfff8e7, 1.2);
            sunLight.position.set(30, 50, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 100;
            sunLight.shadow.camera.left = -30;
            sunLight.shadow.camera.right = 30;
            sunLight.shadow.camera.top = 30;
            sunLight.shadow.camera.bottom = -30;
            sunLight.shadow.bias = -0.0001;
            scene.add(sunLight);

            // Warm fill light
            const fillLight = new THREE.DirectionalLight(0xffe4c4, 0.3);
            fillLight.position.set(-20, 20, -20);
            scene.add(fillLight);

            // Rim light
            const rimLight = new THREE.DirectionalLight(0x87ceeb, 0.2);
            rimLight.position.set(-30, 30, 30);
            scene.add(rimLight);

            // Point light for lanterns glow
            const lanternGlow = new THREE.PointLight(0xffaa55, 2, 15);
            lanternGlow.position.set(0, 4, 0);
            scene.add(lanternGlow);
        }

        function createGround() {
            // Main ground
            const groundGeo = new THREE.CircleGeometry(50, 64);
            const groundMat = new THREE.MeshStandardMaterial({
                color: colors.grass,
                roughness: 0.9,
                metalness: 0
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Raised island for pagoda
            const islandGeo = new THREE.CylinderGeometry(8, 10, 1.5, 32);
            const islandMat = new THREE.MeshStandardMaterial({
                color: colors.grassLight,
                roughness: 0.8
            });
            const island = new THREE.Mesh(islandGeo, islandMat);
            island.position.y = 0.75;
            island.receiveShadow = true;
            island.castShadow = true;
            scene.add(island);
        }

        function createPagoda() {
            pagoda = new THREE.Group();

            // Base platform
            const baseGeo = new THREE.BoxGeometry(6, 1, 6);
            const baseMat = new THREE.MeshStandardMaterial({
                color: colors.stoneDark,
                roughness: 0.7
            });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 2;
            base.castShadow = true;
            base.receiveShadow = true;
            pagoda.add(base);

            // Create three tiers
            for (let tier = 0; tier < 3; tier++) {
                const tierGroup = new THREE.Group();
                const tierHeight = 4 - tier * 0.5;
                const tierWidth = 5 - tier * 1.2;
                const yPos = 2.5 + tier * 3.5;

                // Walls
                const wallGeo = new THREE.BoxGeometry(tierWidth, tierHeight, tierWidth);
                const wallMat = new THREE.MeshStandardMaterial({
                    color: colors.pagodaWalls,
                    roughness: 0.5
                });
                const walls = new THREE.Mesh(wallGeo, wallMat);
                walls.position.y = tierHeight / 2;
                walls.castShadow = true;
                walls.receiveShadow = true;
                tierGroup.add(walls);

                // Red beams
                const beamMat = new THREE.MeshStandardMaterial({
                    color: colors.pagodaBeams,
                    roughness: 0.4
                });

                // Corner beams
                const beamGeo = new THREE.BoxGeometry(0.2, tierHeight + 0.2, 0.2);
                const corners = [
                    [-tierWidth/2 + 0.1, tierHeight/2, -tierWidth/2 + 0.1],
                    [tierWidth/2 - 0.1, tierHeight/2, -tierWidth/2 + 0.1],
                    [-tierWidth/2 + 0.1, tierHeight/2, tierWidth/2 - 0.1],
                    [tierWidth/2 - 0.1, tierHeight/2, tierWidth/2 - 0.1]
                ];
                corners.forEach(pos => {
                    const beam = new THREE.Mesh(beamGeo, beamMat);
                    beam.position.set(...pos);
                    beam.castShadow = true;
                    tierGroup.add(beam);
                });

                // Roof
                const roofSize = tierWidth + 1.5;
                const roofGeo = new THREE.ConeGeometry(roofSize * 0.8, 1.5, 4);
                const roofMat = new THREE.MeshStandardMaterial({
                    color: colors.pagodaRoof,
                    roughness: 0.6,
                    metalness: 0.1
                });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = tierHeight + 0.75;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                tierGroup.add(roof);

                // Roof eaves
                const eaveGeo = new THREE.BoxGeometry(roofSize * 1.4, 0.15, roofSize * 1.4);
                const eave = new THREE.Mesh(eaveGeo, roofMat);
                eave.position.y = tierHeight + 0.1;
                eave.castShadow = true;
                tierGroup.add(eave);

                // Red railings
                if (tier < 2) {
                    const railingGeo = new THREE.BoxGeometry(roofSize * 1.4, 0.5, 0.1);
                    for (let i = 0; i < 4; i++) {
                        const railing = new THREE.Mesh(railingGeo, beamMat);
                        railing.position.y = tierHeight + 0.3;
                        if (i === 0) railing.position.z = roofSize * 0.7;
                        else if (i === 1) railing.position.z = -roofSize * 0.7;
                        else if (i === 2) {
                            railing.rotation.y = Math.PI / 2;
                            railing.position.x = roofSize * 0.7;
                        } else {
                            railing.rotation.y = Math.PI / 2;
                            railing.position.x = -roofSize * 0.7;
                        }
                        tierGroup.add(railing);
                    }
                }

                tierGroup.position.y = yPos - tier * 3.5 + 2.5;
                pagoda.add(tierGroup);
            }

            // Golden finial
            const finialGeo = new THREE.ConeGeometry(0.3, 1.5, 8);
            const finialMat = new THREE.MeshStandardMaterial({
                color: colors.pagodaGold,
                roughness: 0.3,
                metalness: 0.8
            });
            const finial = new THREE.Mesh(finialGeo, finialMat);
            finial.position.y = 13;
            pagoda.add(finial);

            // Entrance stairs
            const stairMat = new THREE.MeshStandardMaterial({
                color: colors.stone,
                roughness: 0.7
            });
            for (let i = 0; i < 5; i++) {
                const stairGeo = new THREE.BoxGeometry(2, 0.3, 0.6);
                const stair = new THREE.Mesh(stairGeo, stairMat);
                stair.position.set(0, 0.15 + i * 0.3, 3.5 + i * 0.3);
                stair.castShadow = true;
                stair.receiveShadow = true;
                pagoda.add(stair);
            }

            pagoda.position.y = 0;
            scene.add(pagoda);
        }

        function createKoiPond() {
            koiPond = new THREE.Group();

            // Pond shape
            const pondShape = new THREE.Shape();
            pondShape.moveTo(0, -4);
            pondShape.bezierCurveTo(5, -5, 8, -2, 7, 2);
            pondShape.bezierCurveTo(6, 5, 2, 6, -2, 5);
            pondShape.bezierCurveTo(-6, 4, -5, -2, 0, -4);

            const pondGeo = new THREE.ShapeGeometry(pondShape, 32);
            const pondMat = new THREE.MeshStandardMaterial({
                color: colors.water,
                roughness: 0.1,
                metalness: 0.3,
                transparent: true,
                opacity: 0.85
            });
            const pond = new THREE.Mesh(pondGeo, pondMat);
            pond.rotation.x = -Math.PI / 2;
            pond.position.set(10, 0.1, 8);
            koiPond.add(pond);

            // Deep water area
            const deepGeo = new THREE.ShapeGeometry(pondShape, 32);
            const deepMat = new THREE.MeshStandardMaterial({
                color: colors.waterDeep,
                roughness: 0.1,
                metalness: 0.2
            });
            const deep = new THREE.Mesh(deepGeo, deepMat);
            deep.rotation.x = -Math.PI / 2;
            deep.position.set(10, -0.5, 8);
            koiPond.add(deep);

            // Pond edge stones
            const stoneGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const stoneMat = new THREE.MeshStandardMaterial({
                color: colors.stoneDark,
                roughness: 0.9
            });
            
            for (let i = 0; i < 30; i++) {
                const angle = (i / 30) * Math.PI * 2;
                const radius = 5.5 + Math.sin(i * 0.8) * 1;
                const stone = new THREE.Mesh(stoneGeo, stoneMat);
                stone.scale.set(1 + Math.random() * 0.5, 0.6, 1 + Math.random() * 0.5);
                stone.position.set(
                    10 + Math.cos(angle) * radius,
                    0.15,
                    8 + Math.sin(angle) * radius * 0.8
                );
                stone.rotation.set(Math.random(), Math.random(), Math.random());
                stone.castShadow = true;
                koiPond.add(stone);
            }

            scene.add(koiPond);
        }

        function createBridge() {
            bridge = new THREE.Group();

            // Bridge arch
            const curve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(0, 0.5, 0),
                new THREE.Vector3(3, 2.5, 0),
                new THREE.Vector3(6, 0.5, 0)
            );

            const bridgeMat = new THREE.MeshStandardMaterial({
                color: colors.bridge,
                roughness: 0.5
            });

            // Bridge deck
            for (let i = 0; i <= 20; i++) {
                const t = i / 20;
                const point = curve.getPoint(t);
                const deckGeo = new THREE.BoxGeometry(0.4, 0.15, 1.5);
                const deck = new THREE.Mesh(deckGeo, bridgeMat);
                deck.position.copy(point);
                deck.position.z = 10;
                deck.lookAt(point.x, point.y + 1, 10);
                deck.rotateX(Math.PI / 2);
                deck.castShadow = true;
                bridge.add(deck);
            }

            // Bridge railings
            const railMat = new THREE.MeshStandardMaterial({
                color: colors.bridge,
                roughness: 0.4
            });

            for (let side = -1; side <= 1; side += 2) {
                for (let i = 0; i <= 10; i++) {
                    const t = i / 10;
                    const point = curve.getPoint(t);
                    
                    // Vertical posts
                    const postGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
                    const post = new THREE.Mesh(postGeo, railMat);
                    post.position.set(point.x, point.y + 0.4, 10 + side * 0.6);
                    post.castShadow = true;
                    bridge.add(post);
                }

                // Top rail
                const railCurve = new THREE.QuadraticBezierCurve3(
                    new THREE.Vector3(0, 1.3, 10 + side * 0.6),
                    new THREE.Vector3(3, 3.3, 10 + side * 0.6),
                    new THREE.Vector3(6, 1.3, 10 + side * 0.6)
                );
                const railGeo = new THREE.TubeGeometry(railCurve, 20, 0.05, 8, false);
                const rail = new THREE.Mesh(railGeo, railMat);
                rail.castShadow = true;
                bridge.add(rail);
            }

            scene.add(bridge);
        }

        function createCherryTree(x, z, scale = 1) {
            const tree = new THREE.Group();

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.15 * scale, 0.25 * scale, 2 * scale, 8);
            const trunkMat = new THREE.MeshStandardMaterial({
                color: 0x4a3728,
                roughness: 0.9
            });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = scale;
            trunk.castShadow = true;
            tree.add(trunk);

            // Branches
            const branchMat = new THREE.MeshStandardMaterial({
                color: 0x5a4738,
                roughness: 0.8
            });

            for (let i = 0; i < 4; i++) {
                const branchGeo = new THREE.CylinderGeometry(0.05 * scale, 0.1 * scale, 1.5 * scale, 6);
                const branch = new THREE.Mesh(branchGeo, branchMat);
                branch.position.y = 1.8 * scale;
                branch.rotation.z = Math.PI / 4;
                branch.rotation.y = (i / 4) * Math.PI * 2;
                branch.castShadow = true;
                tree.add(branch);
            }

            // Cherry blossoms (clusters)
            const blossomMat = new THREE.MeshStandardMaterial({
                color: colors.cherry,
                roughness: 0.6,
                transparent: true,
                opacity: 0.9
            });

            for (let i = 0; i < 8; i++) {
                const clusterGeo = new THREE.SphereGeometry(0.6 * scale * (0.8 + Math.random() * 0.4), 8, 8);
                const cluster = new THREE.Mesh(clusterGeo, blossomMat);
                const angle = (i / 8) * Math.PI * 2;
                const radius = 0.8 * scale;
                cluster.position.set(
                    Math.cos(angle) * radius,
                    2.2 * scale + Math.random() * 0.5 * scale,
                    Math.sin(angle) * radius
                );
                cluster.castShadow = true;
                tree.add(cluster);
            }

            // Central blossom cluster
            const centerGeo = new THREE.SphereGeometry(0.8 * scale, 10, 10);
            const center = new THREE.Mesh(centerGeo, blossomMat);
            center.position.y = 2.8 * scale;
            center.castShadow = true;
            tree.add(center);

            tree.position.set(x, 0, z);
            tree.userData.originalY = 0;
            return tree;
        }

        function createCherryTrees() {
            // Trees around the scene
            const positions = [
                [-8, -5, 1.2], [-6, 5, 1], [-10, 0, 0.9],
                [8, -8, 1.1], [12, -3, 0.8], [-4, -10, 1],
                [15, 5, 0.7], [-12, 8, 0.8]
            ];

            positions.forEach(([x, z, scale]) => {
                const tree = createCherryTree(x, z, scale);
                cherryTrees.push(tree);
                scene.add(tree);
            });
        }

        function createBamboo() {
            const bambooMat = new THREE.MeshStandardMaterial({
                color: colors.bamboo,
                roughness: 0.6
            });

            for (let i = 0; i < 15; i++) {
                const stalk = new THREE.Group();
                const height = 4 + Math.random() * 3;
                const segments = Math.floor(height / 0.5);

                for (let j = 0; j < segments; j++) {
                    const segGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.45, 8);
                    const seg = new THREE.Mesh(segGeo, bambooMat);
                    seg.position.y = j * 0.5 + 0.25;
                    seg.castShadow = true;
                    stalk.add(seg);
                }

                // Leaves
                const leafMat = new THREE.MeshStandardMaterial({
                    color: 0x3d6b3d,
                    roughness: 0.7,
                    side: THREE.DoubleSide
                });

                for (let j = 0; j < 5; j++) {
                    const leafGeo = new THREE.PlaneGeometry(0.3, 0.8);
                    const leaf = new THREE.Mesh(leafGeo, leafMat);
                    leaf.position.y = height - 0.5 - j * 0.3;
                    leaf.rotation.y = Math.random() * Math.PI * 2;
                    leaf.rotation.x = -0.3;
                    stalk.add(leaf);
                }

                stalk.position.set(
                    -12 + Math.random() * 3,
                    0,
                    -5 + Math.random() * 4
                );
                stalk.rotation.x = (Math.random() - 0.5) * 0.1;
                stalk.rotation.z = (Math.random() - 0.5) * 0.1;
                bamboo.push(stalk);
                scene.add(stalk);
            }
        }

        function createLantern(x, z) {
            const lantern = new THREE.Group();

            // Base
            const baseGeo = new THREE.CylinderGeometry(0.2, 0.25, 0.3, 6);
            const stoneMat = new THREE.MeshStandardMaterial({
                color: colors.stoneDark,
                roughness: 0.9
            });
            const base = new THREE.Mesh(baseGeo, stoneMat);
            base.position.y = 0.15;
            base.castShadow = true;
            lantern.add(base);

            // Pole
            const poleGeo = new THREE.CylinderGeometry(0.08, 0.1, 1.2, 6);
            const pole = new THREE.Mesh(poleGeo, stoneMat);
            pole.position.y = 0.9;
            pole.castShadow = true;
            lantern.add(pole);

            // Light housing
            const housingGeo = new THREE.BoxGeometry(0.4, 0.5, 0.4);
            const housingMat = new THREE.MeshStandardMaterial({
                color: colors.stone,
                roughness: 0.7
            });
            const housing = new THREE.Mesh(housingGeo, housingMat);
            housing.position.y = 1.75;
            housing.castShadow = true;
            lantern.add(housing);

            // Light
            const lightGeo = new THREE.BoxGeometry(0.25, 0.3, 0.25);
            const lightMat = new THREE.MeshStandardMaterial({
                color: colors.light,
                emissive: 0xffaa55,
                emissiveIntensity: 0.8,
                transparent: true,
                opacity: 0.9
            });
            const light = new THREE.Mesh(lightGeo, lightMat);
            light.position.y = 1.75;
            lantern.add(light);

            // Roof
            const roofGeo = new THREE.ConeGeometry(0.4, 0.25, 4);
            const roof = new THREE.Mesh(roofGeo, stoneMat);
            roof.position.y = 2.15;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            lantern.add(roof);

            lantern.position.set(x, 0, z);
            lantern.userData.lightMesh = light;
            return lantern;
        }

        function createLanterns() {
            const positions = [
                [-3, 8], [3, 8], [-6, 3], [6, 3],
                [-5, -5], [5, -5], [8, 12], [-8, 12]
            ];

            positions.forEach(([x, z]) => {
                const lantern = createLantern(x, z);
                lanterns.push(lantern);
                scene.add(lantern);
            });
        }

        function createPaths() {
            const pathMat = new THREE.MeshStandardMaterial({
                color: colors.stone,
                roughness: 0.8
            });

            // Main path stones
            const pathStones = [
                // Path to pagoda
                [0, 0.05, 12], [0, 0.05, 11], [0.5, 0.05, 10], [-0.5, 0.05, 10],
                // Around pond
                [6, 0.05, 10], [7, 0.05, 9], [8, 0.05, 8], [12, 0.05, 6],
                [13, 0.05, 4], [14, 0.05, 2], [13, 0.05, 0], [12, 0.05, -2],
                // Side paths
                [-4, 0.05, 6], [-5, 0.05, 4], [-6, 0.05, 2], [-5, 0.05, 0],
                [-4, 0.05, -2], [-6, 0.05, -8], [-8, 0.05, -6], [-10, 0.05, -4]
            ];

            pathStones.forEach(([x, y, z]) => {
                const stoneGeo = new THREE.CylinderGeometry(
                    0.3 + Math.random() * 0.2,
                    0.35 + Math.random() * 0.2,
                    0.1,
                    6
                );
                const stone = new THREE.Mesh(stoneGeo, pathMat);
                stone.position.set(x, y, z);
                stone.rotation.y = Math.random() * Math.PI;
                stone.receiveShadow = true;
                scene.add(stone);
            });
        }

        function createPetals() {
            const petalGeo = new THREE.PlaneGeometry(0.1, 0.15);
            const petalMat = new THREE.MeshStandardMaterial({
                color: colors.cherry,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });

            for (let i = 0; i < 100; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.position.set(
                    (Math.random() - 0.5) * 40,
                    Math.random() * 15 + 5,
                    (Math.random() - 0.5) * 40
                );
                petal.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                petal.userData.velocity = {
                    x: (Math.random() - 0.5) * 0.02,
                    y: -0.01 - Math.random() * 0.02,
                    z: (Math.random() - 0.5) * 0.02,
                    rotX: (Math.random() - 0.5) * 0.05,
                    rotY: (Math.random() - 0.5) * 0.05
                };
                petals.push(petal);
                scene.add(petal);
            }
        }

        function createKoiFish() {
            const fishColors = [0xff6b35, 0xffffff, 0xff4444, 0xffaa00];
            const koiMat = new THREE.MeshStandardMaterial({
                roughness: 0.3,
                metalness: 0.1
            });

            for (let i = 0; i < 8; i++) {
                const koi = new THREE.Group();
                
                // Body
                const bodyGeo = new THREE.SphereGeometry(0.2, 8, 8);
                bodyGeo.scale(1.5, 0.6, 0.6);
                const body = new THREE.Mesh(bodyGeo, koiMat.clone());
                body.material.color.setHex(fishColors[i % fishColors.length]);
                koi.add(body);

                // Tail
                const tailGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
                const tail = new THREE.Mesh(tailGeo, body.material);
                tail.position.x = -0.35;
                tail.rotation.z = Math.PI / 2;
                koi.add(tail);

                koi.position.set(
                    10 + (Math.random() - 0.5) * 8,
                    0.1,
                    8 + (Math.random() - 0.5) * 6
                );
                koi.userData.angle = Math.random() * Math.PI * 2;
                koi.userData.speed = 0.005 + Math.random() * 0.01;
                koi.userData.radius = 2 + Math.random() * 3;
                koiFish.push(koi);
                scene.add(koi);
            }
        }

        function createAmbientParticles() {
            const particleCount = 50;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 50;
                positions[i * 3 + 1] = Math.random() * 20;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 50;

                colors[i * 3] = 1;
                colors[i * 3 + 1] = 0.95;
                colors[i * 3 + 2] = 0.8;
            }

            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(particleGeo, particleMat);
            particles.userData.positions = positions;
            scene.add(particles);
        }

        function createSkyDome() {
            const skyGeo = new THREE.SphereGeometry(80, 32, 32);
            const skyMat = new THREE.ShaderMaterial({
                uniforms: {
                    topColor: { value: new THREE.Color(0x1a1a2e) },
                    bottomColor: { value: new THREE.Color(0x0f3460) },
                    offset: { value: 10 },
                    exponent: { value: 0.6 }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 bottomColor;
                    uniform float offset;
                    uniform float exponent;
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition + offset).y;
                        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                    }
                `,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);

            // Stars
            const starGeo = new THREE.BufferGeometry();
            const starCount = 200;
            const starPositions = new Float32Array(starCount * 3);
            
            for (let i = 0; i < starCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 0.4;
                const r = 75;
                
                starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPositions[i * 3 + 1] = r * Math.cos(phi);
                starPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            }
            
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.3,
                transparent: true,
                opacity: 0.8
            });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);
        }

        function setupPostProcessing() {
            composer = new EffectComposer(renderer);
            
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Bloom
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.5,
                0.4,
                0.85
            );
            composer.addPass(bloomPass);

            // Depth of Field
            dofPass = new BokehPass(scene, camera, {
                focus: 35,
                aperture: 0.002,
                maxblur: 0.01
            });
            composer.addPass(dofPass);
        }

        function setupControls() {
            document.getElementById('autoRotate').addEventListener('click', function() {
                autoRotate = !autoRotate;
                this.classList.toggle('active');
            });

            document.getElementById('toggleDOF').addEventListener('click', function() {
                dofEnabled = !dofEnabled;
                dofPass.enabled = dofEnabled;
                this.classList.toggle('active');
            });

            document.getElementById('togglePetals').addEventListener('click', function() {
                petalsEnabled = !petalsEnabled;
                petals.forEach(p => p.visible = petalsEnabled);
                this.classList.toggle('active');
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = (event.clientY / window.innerHeight) * 2 - 1;
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Auto-rotate camera
            if (autoRotate) {
                const rotSpeed = 0.002;
                const x = camera.position.x;
                const z = camera.position.z;
                camera.position.x = x * Math.cos(rotSpeed) - z * Math.sin(rotSpeed);
                camera.position.z = x * Math.sin(rotSpeed) + z * Math.cos(rotSpeed);
            }

            // Animate petals
            if (petalsEnabled) {
                petals.forEach(petal => {
                    petal.position.x += petal.userData.velocity.x + Math.sin(time + petal.id) * 0.005;
                    petal.position.y += petal.userData.velocity.y;
                    petal.position.z += petal.userData.velocity.z + Math.cos(time + petal.id) * 0.005;
                    petal.rotation.x += petal.userData.velocity.rotX;
                    petal.rotation.y += petal.userData.velocity.rotY;

                    // Reset petal position
                    if (petal.position.y < 0) {
                        petal.position.y = 15 + Math.random() * 5;
                        petal.position.x = (Math.random() - 0.5) * 40;
                        petal.position.z = (Math.random() - 0.5) * 40;
                    }
                });
            }

            // Animate koi fish
            koiFish.forEach(koi => {
                koi.userData.angle += koi.userData.speed;
                koi.position.x = 10 + Math.cos(koi.userData.angle) * koi.userData.radius;
                koi.position.z = 8 + Math.sin(koi.userData.angle) * koi.userData.radius * 0.7;
                koi.rotation.y = -koi.userData.angle + Math.PI / 2;
            });

            // Animate cherry trees (subtle sway)
            cherryTrees.forEach((tree, i) => {
                tree.rotation.z = Math.sin(time * 0.5 + i) * 0.02;
            });

            // Animate bamboo
            bamboo.forEach((stalk, i) => {
                stalk.rotation.x = Math.sin(time * 0.3 + i * 0.5) * 0.05;
                stalk.rotation.z = Math.cos(time * 0.3 + i * 0.5) * 0.05;
            });

            // Animate lantern lights (flickering)
            lanterns.forEach((lantern, i) => {
                const lightMesh = lantern.userData.lightMesh;
                if (lightMesh) {
                    const flicker = 0.7 + Math.sin(time * 3 + i) * 0.15 + Math.random() * 0.1;
                    lightMesh.material.emissiveIntensity = flicker;
                }
            });

            // Update DOF focus based on camera distance
            if (dofPass && dofEnabled) {
                const distance = camera.position.distanceTo(controls.target);
                dofPass.uniforms['focus'].value = distance;
            }

            controls.update();
            composer.render();
        }
    </script>
</body>
