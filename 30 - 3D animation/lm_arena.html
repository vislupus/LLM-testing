<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Japanese Garden • 3D Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=Playfair+Display:wght@700&amp;display=swap');
        
        :root {
            --bg: #f8f1e9;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0f0c08;
            color: #f8f1e9;
            font-family: 'Inter', system_ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cinematic-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            background: #0f0c08;
            box-shadow: 0 0 0 1px #3a2f24;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: crisp-edges;
            cursor: grab;
        }
        
        #canvas:active {
            cursor: grabbing;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle at center,
                transparent 40%,
                rgba(15, 12, 8, 0.35) 75%,
                rgba(15, 12, 8, 0.65) 92%
            );
            pointer-events: none;
            z-index: 5;
        }
        
        .title {
            position: absolute;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3.5px;
            color: #e8d9c2;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .controls {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 30;
            background: rgba(15, 12, 8, 0.65);
            padding: 6px;
            border-radius: 9999px;
            border: 1px solid #3a2f24;
            backdrop-filter: blur(12px);
        }
        
        .control-btn {
            background: #2c241b;
            color: #d4bea3;
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        
        .control-btn:hover {
            background: #3a2f24;
            color: #e8d9c2;
        }
        
        .control-btn.active {
            background: #d4bea3;
            color: #1f1812;
            font-weight: 600;
        }
        
        .info {
            position: absolute;
            top: 28px;
            right: 28px;
            font-size: 10px;
            color: #a38e70;
            text-align: right;
            z-index: 20;
            pointer-events: none;
            line-height: 1.3;
        }
        
        .film-grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 3px 3px;
            pointer-events: none;
            z-index: 6;
            mix-blend-mode: screen;
            opacity: 0.6;
        }
        
        .status {
            position: absolute;
            bottom: 28px;
            left: 28px;
            font-size: 10px;
            color: #a38e70;
            z-index: 30;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="cinematic-container">
        <!-- Main 3D Canvas -->
        <canvas id="canvas" width="1920" height="1080"></canvas>
        
        <!-- Cinematic overlays -->
        <div class="overlay">
            <!-- Soft vignette -->
            <div class="vignette"></div>
            
            <!-- Film grain -->
            <div class="film-grain"></div>
            
            <!-- Title -->
            <div class="title">TRANQUIL GARDEN • KYOTO</div>
            
            <!-- Info -->
            <div class="info">
                ISOMETRIC • CINEMATIC<br>
                3D RENDER • 2026
            </div>
            
            <!-- Status -->
            <div class="status" id="status">Camera orbiting • Drag to control</div>
            
            <!-- Controls -->
            <div class="controls">
                <button class="control-btn" id="btn-orbit">Auto Orbit</button>
                <button class="control-btn" id="btn-closeup">Close-up</button>
                <button class="control-btn" id="btn-side">Side View</button>
                <button class="control-btn" id="btn-top">Top Down</button>
                <button class="control-btn" id="btn-reset">Reset</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== CINEMATIC JAPANESE GARDEN 3D ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        // High resolution
        const DPR = Math.min(window.devicePixelRatio || 1, 2);
        let WIDTH = 1920;
        let HEIGHT = 1080;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            
            WIDTH = Math.floor(rect.width * DPR);
            HEIGHT = Math.floor(rect.height * DPR);
            
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        
        // ==================== SCENE STATE ====================
        let camera = {
            angle: 0.75,      // horizontal rotation
            height: 1.4,      // vertical angle
            distance: 11.5,
            targetX: 0,
            targetY: 0,
            targetZ: 1.8
        };
        
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        let time = 0;
        let autoOrbit = true;
        let orbitSpeed = 0.00018;
        
        // Particles for cherry blossoms
        let petals = [];
        
        // Koi fish
        let koi = [];
        
        // ==================== ISOMETRIC PROJECTION ====================
        function isoProject(x, y, z) {
            // Classic 30-degree isometric projection
            const scale = 42;
            const screenX = (x - y) * Math.cos(Math.PI / 6) * scale;
            const screenY = (x + y) * Math.sin(Math.PI / 6) * scale - z * scale * 0.75;
            
            // Center the scene
            const centerX = WIDTH / (2 * DPR);
            const centerY = HEIGHT / (2 * DPR) + 40;
            
            return {
                x: centerX + screenX,
                y: centerY + screenY
            };
        }
        
        // ==================== LIGHTING & SHADOWS ====================
        const SUN_ANGLE = 1.1;
        
        function getLighting(x, y, z, normal = {x: 0, y: 0, z: 1}) {
            // Simple directional lighting
            const sunDir = {
                x: Math.cos(SUN_ANGLE),
                y: Math.sin(SUN_ANGLE) * 0.6,
                z: -0.75
            };
            
            const dot = normal.x * sunDir.x + normal.y * sunDir.y + normal.z * sunDir.z;
            const brightness = Math.max(0.35, (dot + 1) * 0.5);
            
            return brightness;
        }
        
        function drawShadow(ctx, points, offset = 0.6) {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
            ctx.beginPath();
            
            const projected = points.map(p => {
                const proj = isoProject(p.x, p.y, p.z + offset);
                return proj;
            });
            
            ctx.moveTo(projected[0].x, projected[0].y);
            for (let i = 1; i < projected.length; i++) {
                ctx.lineTo(projected[i].x, projected[i].y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
        
        // ==================== DRAW FUNCTIONS ====================
        
        function drawGround() {
            ctx.save();
            
            // Main grass area
            const groundPoints = [
                {x: -8, y: -8, z: 0},
                {x: 9, y: -8, z: 0},
                {x: 9, y: 9, z: 0},
                {x: -8, y: 9, z: 0}
            ];
            
            const proj = groundPoints.map(p => isoProject(p.x, p.y, p.z));
            
            // Soft green gradient
            const grad = ctx.createLinearGradient(
                proj[0].x, proj[0].y - 80,
                proj[2].x, proj[2].y + 120
            );
            grad.addColorStop(0, '#3a5c3f');
            grad.addColorStop(0.4, '#2d4a32');
            grad.addColorStop(1, '#243d28');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(proj[0].x, proj[0].y);
            ctx.lineTo(proj[1].x, proj[1].y);
            ctx.lineTo(proj[2].x, proj[2].y);
            ctx.lineTo(proj[3].x, proj[3].y);
            ctx.closePath();
            ctx.fill();
            
            // Subtle ground texture
            ctx.strokeStyle = '#2a3c2a';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                const yOff = i * 1.8;
                ctx.moveTo(proj[0].x + 20, proj[0].y + yOff * 18);
                ctx.quadraticCurveTo(
                    (proj[0].x + proj[2].x) / 2, 
                    (proj[0].y + proj[2].y) / 2 + yOff * 14,
                    proj[2].x - 20, proj[2].y + yOff * 18
                );
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawStonePath() {
            ctx.save();
            
            const pathPoints = [
                {x: -2.5, y: 1.5, z: 0.05},
                {x: -1.5, y: 4.8, z: 0.05},
                {x: 1.5, y: 5.5, z: 0.05},
                {x: 3.5, y: 4.5, z: 0.05},
            ];
            
            ctx.strokeStyle = '#6b6f69';
            ctx.lineWidth = 18;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            let p0 = isoProject(pathPoints[0].x, pathPoints[0].y, pathPoints[0].z);
            ctx.moveTo(p0.x, p0.y);
            
            for (let i = 1; i < pathPoints.length; i++) {
                const p = isoProject(pathPoints[i].x, pathPoints[i].y, pathPoints[i].z);
                ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
            
            // Individual stones
            ctx.fillStyle = '#8a8e86';
            ctx.strokeStyle = '#565a54';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < 18; i++) {
                const t = i / 17;
                const x = -2.5 + t * 6;
                const y = 1.5 + t * 3.2 + Math.sin(t * 4) * 0.6;
                
                const proj = isoProject(x, y, 0.08);
                
                const size = 5.5 + Math.sin(i) * 1.2;
                ctx.beginPath();
                ctx.ellipse(proj.x, proj.y, size, size * 0.65, Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawPagoda() {
            const cx = 0.5;
            const cy = 2.2;
            const baseZ = 1.6;
            
            // Base platform
            ctx.fillStyle = '#5f5a52';
            const base = [
                {x: cx - 2.8, y: cy - 2.6, z: 0.1},
                {x: cx + 2.8, y: cy - 2.6, z: 0.1},
                {x: cx + 2.8, y: cy + 2.6, z: 0.1},
                {x: cx - 2.8, y: cy + 2.6, z: 0.1},
            ];
            const baseProj = base.map(p => isoProject(p.x, p.y, p.z));
            
            ctx.beginPath();
            ctx.moveTo(baseProj[0].x, baseProj[0].y);
            for (let i = 1; i < baseProj.length; i++) ctx.lineTo(baseProj[i].x, baseProj[i].y);
            ctx.closePath();
            ctx.fill();
            
            // Draw tiers
            const tiers = [
                { w: 2.3, h: 2.1, z: 1.7, roofH: 1.35, color: '#d4a17e' },
                { w: 1.85, h: 1.85, z: 4.0, roofH: 1.25, color: '#c68c6b' },
                { w: 1.45, h: 1.55, z: 6.1, roofH: 1.15, color: '#b87a5a' },
            ];
            
            tiers.forEach((tier, index) => {
                const w = tier.w;
                const d = tier.h;
                const z = tier.z;
                
                // Main body
                const bodyColor = tier.color;
                const bodyPoints = [
                    {x: cx - w, y: cy - d, z: z},
                    {x: cx + w, y: cy - d, z: z},
                    {x: cx + w, y: cy + d, z: z},
                    {x: cx - w, y: cy + d, z: z},
                ];
                
                // Front face
                ctx.fillStyle = '#e8d4b8';
                ctx.beginPath();
                let p = isoProject(bodyPoints[0].x, bodyPoints[0].y, bodyPoints[0].z);
                ctx.moveTo(p.x, p.y);
                p = isoProject(bodyPoints[1].x, bodyPoints[1].y, bodyPoints[1].z);
                ctx.lineTo(p.x, p.y);
                p = isoProject(bodyPoints[1].x, bodyPoints[1].y, z + 2.2);
                ctx.lineTo(p.x, p.y);
                p = isoProject(bodyPoints[0].x, bodyPoints[0].y, z + 2.2);
                ctx.lineTo(p.x, p.y);
                ctx.closePath();
                ctx.fill();
                
                // Side face
                ctx.fillStyle = '#d4b38a';
                ctx.beginPath();
                p = isoProject(bodyPoints[1].x, bodyPoints[1].y, bodyPoints[1].z);
                ctx.moveTo(p.x, p.y);
                p = isoProject(bodyPoints[2].x, bodyPoints[2].y, bodyPoints[2].z);
                ctx.lineTo(p.x, p.y);
                p = isoProject(bodyPoints[2].x, bodyPoints[2].y, z + 2.2);
                ctx.lineTo(p.x, p.y);
                p = isoProject(bodyPoints[1].x, bodyPoints[1].y, z + 2.2);
                ctx.lineTo(p.x, p.y);
                ctx.closePath();
                ctx.fill();
                
                // Windows
                ctx.fillStyle = '#3c2a1f';
                const winY = z + 0.7;
                for (let wx = -1.1; wx <= 1.1; wx += 1.1) {
                    const wp1 = isoProject(cx + wx - 0.28, cy - 0.9, winY);
                    const wp2 = isoProject(cx + wx + 0.28, cy - 0.9, winY);
                    const wp3 = isoProject(cx + wx + 0.28, cy - 0.9, winY + 1.1);
                    const wp4 = isoProject(cx + wx - 0.28, cy - 0.9, winY + 1.1);
                    
                    ctx.fillRect(wp1.x, wp1.y, wp2.x - wp1.x, wp3.y - wp1.y);
                    
                    // Window frame lines
                    ctx.strokeStyle = '#2c2118';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(wp1.x, (wp1.y + wp3.y) / 2);
                    ctx.lineTo(wp2.x, (wp1.y + wp3.y) / 2);
                    ctx.stroke();
                }
                
                // Roof
                ctx.fillStyle = '#2a2520';
                const roofBase = z + 2.2;
                const roofPeak = roofBase + tier.roofH;
                
                // Main roof shape
                const roofPoints = [
                    {x: cx - w * 1.18, y: cy - d * 1.18, z: roofBase},
                    {x: cx + w * 1.18, y: cy - d * 1.18, z: roofBase},
                    {x: cx + w * 1.18, y: cy + d * 1.18, z: roofBase},
                    {x: cx - w * 1.18, y: cy + d * 1.18, z: roofBase},
                ];
                
                // Roof sides
                ctx.beginPath();
                let r = isoProject(roofPoints[0].x, roofPoints[0].y, roofPoints[0].z);
                ctx.moveTo(r.x, r.y);
                
                r = isoProject(roofPoints[1].x, roofPoints[1].y, roofPoints[1].z);
                ctx.lineTo(r.x, r.y);
                r = isoProject(cx, cy, roofPeak);
                ctx.lineTo(r.x, r.y);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                r = isoProject(roofPoints[1].x, roofPoints[1].y, roofPoints[1].z);
                ctx.moveTo(r.x, r.y);
                r = isoProject(roofPoints[2].x, roofPoints[2].y, roofPoints[2].z);
                ctx.lineTo(r.x, r.y);
                r = isoProject(cx, cy, roofPeak);
                ctx.lineTo(r.x, r.y);
                ctx.closePath();
                ctx.fill();
                
                // Roof edge highlight
                ctx.strokeStyle = '#4a4035';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                r = isoProject(roofPoints[0].x, roofPoints[0].y, roofPoints[0].z);
                ctx.moveTo(r.x, r.y);
                r = isoProject(roofPoints[1].x, roofPoints[1].y, roofPoints[1].z);
                ctx.lineTo(r.x, r.y);
                ctx.stroke();
                
                // Gold accents
                if (index < 2) {
                    ctx.fillStyle = '#c5a15e';
                    const accent = isoProject(cx, cy, roofPeak - 0.1);
                    ctx.fillRect(accent.x - 3, accent.y - 3, 6, 6);
                }
            });
            
            // Top spire
            ctx.fillStyle = '#c5a15e';
            const top = isoProject(cx, cy, 9.3);
            ctx.beginPath();
            ctx.moveTo(top.x, top.y - 22);
            ctx.lineTo(top.x - 4, top.y);
            ctx.lineTo(top.x + 4, top.y);
            ctx.closePath();
            ctx.fill();
            
            // Small golden ball
            ctx.fillStyle = '#f0d9a0';
            ctx.beginPath();
            ctx.arc(top.x, top.y - 26, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawPond() {
            ctx.save();
            
            // Pond base
            const pondPoints = [
                {x: 2.8, y: 5.2, z: 0.2},
                {x: 7.2, y: 3.8, z: 0.2},
                {x: 7.6, y: 7.4, z: 0.2},
                {x: 3.2, y: 8.5, z: 0.2},
            ];
            
            const proj = pondPoints.map(p => isoProject(p.x, p.y, p.z));
            
            // Water gradient
            const waterGrad = ctx.createLinearGradient(proj[0].x, proj[0].y, proj[2].x, proj[2].y + 40);
            waterGrad.addColorStop(0, '#2a6d7e');
            waterGrad.addColorStop(0.4, '#1e5a6e');
            waterGrad.addColorStop(1, '#184d5e');
            
            ctx.fillStyle = waterGrad;
            ctx.beginPath();
            ctx.moveTo(proj[0].x, proj[0].y);
            for (let i = 1; i < proj.length; i++) ctx.lineTo(proj[i].x, proj[i].y);
            ctx.closePath();
            ctx.fill();
            
            // Ripples
            const t = time * 1.6;
            ctx.strokeStyle = 'rgba(190, 220, 235, 0.35)';
            ctx.lineWidth = 1.3;
            
            for (let i = 0; i < 5; i++) {
                const rippleT = (t * 0.6 + i * 1.4) % 5.5;
                const scale = 0.6 + rippleT * 0.3;
                
                ctx.beginPath();
                const cxp = (proj[0].x + proj[1].x) * 0.5 + Math.sin(i) * 12;
                const cyp = (proj[0].y + proj[3].y) * 0.5;
                
                ctx.ellipse(
                    cxp + Math.cos(i) * 8, 
                    cyp + Math.sin(i * 1.4) * 5, 
                    22 * scale, 
                    13 * scale * 0.7, 
                    0.4, 0, Math.PI * 2
                );
                ctx.stroke();
            }
            
            // Koi fish
            drawKoi();
            
            ctx.restore();
        }
        
        function drawKoi() {
            const fishData = [
                {x: 4.2, y: 5.8, z: 0.3, size: 0.9, phase: 0, color: '#c94c4c'},
                {x: 5.1, y: 6.9, z: 0.3, size: 0.75, phase: 1.8, color: '#d67a3a'},
                {x: 6.3, y: 5.3, z: 0.3, size: 0.85, phase: 3.6, color: '#e8b923'},
                {x: 5.5, y: 7.6, z: 0.3, size: 0.65, phase: 2.2, color: '#c94c4c'},
                {x: 6.9, y: 6.7, z: 0.3, size: 0.7, phase: 4.9, color: '#d67a3a'},
            ];
            
            fishData.forEach((fish, index) => {
                const swim = Math.sin(time * 1.8 + fish.phase) * 0.35;
                const swimY = Math.cos(time * 1.8 + fish.phase) * 0.22;
                
                const posX = fish.x + swim;
                const posY = fish.y + swimY * 0.8;
                
                const p = isoProject(posX, posY, fish.z);
                
                const size = fish.size * 13;
                const angle = Math.sin(time * 2.2 + fish.phase) * 0.5;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(angle);
                
                // Body
                ctx.fillStyle = fish.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, size, size * 0.42, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // White patches
                ctx.fillStyle = '#f8f1e9';
                ctx.beginPath();
                ctx.ellipse(-size * 0.2, -size * 0.05, size * 0.45, size * 0.18, 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // Tail
                ctx.fillStyle = '#b43c3c';
                ctx.beginPath();
                ctx.moveTo(size * 0.75, 0);
                ctx.lineTo(size * 1.45, -size * 0.45);
                ctx.lineTo(size * 1.35, size * 0.4);
                ctx.closePath();
                ctx.fill();
                
                // Eye
                ctx.fillStyle = '#1f1812';
                ctx.beginPath();
                ctx.arc(-size * 0.45, -size * 0.1, size * 0.12, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
        }
        
        function drawRedBridge() {
            ctx.save();
            
            const bridgeBaseX = 6.5;
            const bridgeBaseY = 7.5;
            const bridgeZ = 1.1;
            
            // Bridge deck
            ctx.fillStyle = '#9c2c2c';
            const deck = [
                {x: bridgeBaseX - 1.3, y: bridgeBaseY - 0.9, z: bridgeZ},
                {x: bridgeBaseX + 1.4, y: bridgeBaseY - 0.9, z: bridgeZ},
                {x: bridgeBaseX + 1.4, y: bridgeBaseY + 0.9, z: bridgeZ},
                {x: bridgeBaseX - 1.3, y: bridgeBaseY + 0.9, z: bridgeZ},
            ];
            
            let proj = deck.map(p => isoProject(p.x, p.y, p.z));
            
            ctx.beginPath();
            ctx.moveTo(proj[0].x, proj[0].y);
            ctx.lineTo(proj[1].x, proj[1].y);
            ctx.lineTo(proj[2].x, proj[2].y);
            ctx.lineTo(proj[3].x, proj[3].y);
            ctx.closePath();
            ctx.fill();
            
            // Bridge arch
            ctx.strokeStyle = '#7a1f1f';
            ctx.lineWidth = 7;
            ctx.beginPath();
            
            const archStart = isoProject(bridgeBaseX - 1.1, bridgeBaseY - 0.5, bridgeZ + 1.2);
            const archEnd = isoProject(bridgeBaseX + 1.1, bridgeBaseY - 0.5, bridgeZ + 1.2);
            const archTop = isoProject(bridgeBaseX, bridgeBaseY - 0.5, bridgeZ + 3.1);
            
            ctx.moveTo(archStart.x, archStart.y);
            ctx.quadraticCurveTo(archTop.x, archTop.y, archEnd.x, archEnd.y);
            ctx.stroke();
            
            // Railings
            ctx.strokeStyle = '#c94c4c';
            ctx.lineWidth = 3.5;
            
            const rail1 = isoProject(bridgeBaseX - 1.0, bridgeBaseY - 0.5, bridgeZ + 1.8);
            const rail2 = isoProject(bridgeBaseX + 1.0, bridgeBaseY - 0.5, bridgeZ + 1.8);
            
            ctx.beginPath();
            ctx.moveTo(rail1.x, rail1.y);
            ctx.quadraticCurveTo(archTop.x + 3, archTop.y - 4, rail2.x, rail2.y);
            ctx.stroke();
            
            // Posts
            ctx.fillStyle = '#9c2c2c';
            const posts = [-1.0, 1.0];
            posts.forEach(px => {
                const postBase = isoProject(bridgeBaseX + px, bridgeBaseY - 0.5, bridgeZ);
                const postTop = isoProject(bridgeBaseX + px, bridgeBaseY - 0.5, bridgeZ + 1.9);
                
                ctx.fillRect(postBase.x - 1.5, postTop.y, 3, postBase.y - postTop.y);
            });
            
            ctx.restore();
        }
        
        function drawCherryTree(x, y, scale = 1) {
            ctx.save();
            
            // Trunk
            ctx.fillStyle = '#3a2a1f';
            const trunkBase = isoProject(x, y, 0);
            const trunkTop = isoProject(x + 0.15, y - 0.1, 3.5 * scale);
            
            ctx.beginPath();
            ctx.ellipse(trunkBase.x, trunkBase.y, 3.5 * scale, 1.6 * scale, 0.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Foliage layers
            const foliageColors = ['#f8b4c4', '#f4a3b8', '#e88da8', '#f9c2d0'];
            
            for (let layer = 0; layer < 4; layer++) {
                const layerZ = 2.5 + layer * 1.3;
                const layerScale = (1.1 - layer * 0.13) * scale;
                
                const center = isoProject(x + Math.sin(layer) * 0.3, y + Math.cos(layer) * 0.2, layerZ);
                
                // Main blossom mass
                ctx.fillStyle = foliageColors[layer % foliageColors.length];
                
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + layer * 0.8;
                    const bx = center.x + Math.cos(angle) * (11 + layer * 2) * layerScale;
                    const by = center.y + Math.sin(angle) * (7 + layer * 1.5) * layerScale * 0.9;
                    
                    ctx.beginPath();
                    ctx.arc(bx, by, 9.5 * layerScale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Falling petals from this tree
            ctx.restore();
        }
        
        function drawBamboo(x, y, count = 5) {
            ctx.save();
            
            for (let i = 0; i < count; i++) {
                const bx = x + i * 0.35 - (count * 0.15);
                const sway = Math.sin(time * 1.2 + i) * 0.12;
                
                // Stems
                ctx.strokeStyle = '#2e4a2e';
                ctx.lineWidth = 3.5;
                
                const base = isoProject(bx, y, 0);
                const top = isoProject(bx + sway, y - 0.2, 4.8);
                
                ctx.beginPath();
                ctx.moveTo(base.x, base.y);
                ctx.lineTo(top.x, top.y);
                ctx.stroke();
                
                // Leaves
                ctx.strokeStyle = '#3a5c3a';
                ctx.lineWidth = 1.8;
                
                for (let l = 0; l < 4; l++) {
                    const ly = 1.2 + l * 0.9;
                    const leafBase = isoProject(bx + sway * (l / 4), y, ly);
                    
                    ctx.beginPath();
                    ctx.moveTo(leafBase.x, leafBase.y);
                    ctx.quadraticCurveTo(
                        leafBase.x + 7 + Math.sin(l) * 3, 
                        leafBase.y - 4, 
                        leafBase.x + 11, leafBase.y - 9
                    );
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(leafBase.x, leafBase.y);
                    ctx.quadraticCurveTo(
                        leafBase.x - 7 - Math.sin(l) * 3, 
                        leafBase.y - 3, 
                        leafBase.x - 10, leafBase.y - 8
                    );
                    ctx.stroke();
                }
            }
            
            ctx.restore();
        }
        
        function drawStoneLantern(x, y, z = 0.8) {
            ctx.save();
            
            const base = isoProject(x, y, z);
            const top = isoProject(x, y, z + 2.3);
            
            // Base
            ctx.fillStyle = '#6b6f69';
            ctx.fillRect(base.x - 4, base.y - 3, 8, 6);
            
            // Body
            ctx.fillStyle = '#8a8e86';
            ctx.fillRect(base.x - 3, base.y - 18, 6, 15);
            
            // Top cap
            ctx.fillStyle = '#5f635d';
            ctx.beginPath();
            ctx.moveTo(base.x - 6, base.y - 18);
            ctx.lineTo(base.x, base.y - 26);
            ctx.lineTo(base.x + 6, base.y - 18);
            ctx.fill();
            
            // Light glow
            ctx.fillStyle = 'rgba(245, 220, 150, 0.25)';
            ctx.beginPath();
            ctx.arc(base.x, base.y - 12, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawPerson(x, y, z, type = 'woman', facing = 1) {
            ctx.save();
            
            const p = isoProject(x, y, z);
            
            // Legs
            ctx.fillStyle = type === 'woman' ? '#2f3a4a' : '#2a3a2f';
            ctx.fillRect(p.x - 2.5, p.y + 2, 2, 9);
            ctx.fillRect(p.x + 0.5, p.y + 2, 2, 9);
            
            // Body
            ctx.fillStyle = type === 'woman' ? '#3a5a7a' : '#3a5a3f';
            ctx.fillRect(p.x - 3.5, p.y - 5, 7, 8);
            
            // Head
            ctx.fillStyle = '#d4b38a';
            ctx.beginPath();
            ctx.arc(p.x, p.y - 8, 2.8, 0, Math.PI * 2);
            ctx.fill();
            
            // Hair / clothes detail
            if (type === 'woman') {
                ctx.fillStyle = '#2a2520';
                ctx.fillRect(p.x - 2.8, p.y - 10.5, 5.6, 3);
            }
            
            // Arms
            ctx.strokeStyle = type === 'woman' ? '#d4b38a' : '#3a5a3f';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(p.x - 3.5, p.y - 2);
            ctx.lineTo(p.x - 7, p.y + 3);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(p.x + 3.5, p.y - 2);
            ctx.lineTo(p.x + 7, p.y + 3);
            ctx.stroke();
            
            ctx.restore();
        }
        
        // ==================== PARTICLES ====================
        function initPetals() {
            petals = [];
            for (let i = 0; i < 68; i++) {
                petals.push({
                    x: Math.random() * 15 - 6,
                    y: Math.random() * 15 - 5,
                    z: Math.random() * 9 + 1,
                    vx: (Math.random() - 0.5) * 0.012,
                    vy: (Math.random() - 0.5) * 0.009,
                    vz: -0.018 - Math.random() * 0.012,
                    size: 1.6 + Math.random() * 1.4,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.04,
                    sway: Math.random() * 3.5,
                });
            }
        }
        
        function updateAndDrawPetals() {
            ctx.save();
            
            for (let i = petals.length - 1; i >= 0; i--) {
                const p = petals[i];
                
                // Update
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                p.vz += 0.0009; // gravity
                
                p.rot += p.rotSpeed;
                
                // Gentle wind
                p.vx += Math.sin(time * 0.9 + p.sway) * 0.0003;
                p.vy += Math.cos(time * 1.1 + p.sway) * 0.0002;
                
                // Reset if fallen
                if (p.z < 0.05) {
                    p.x = Math.random() * 14 - 5;
                    p.y = Math.random() * 11 - 4;
                    p.z = 8.5 + Math.random() * 3;
                    p.vz = -0.022 - Math.random() * 0.01;
                    p.vx = (Math.random() - 0.5) * 0.01;
                    p.vy = (Math.random() - 0.5) * 0.008;
                }
                
                // Draw
                const proj = isoProject(p.x, p.y, p.z);
                
                ctx.save();
                ctx.translate(proj.x, proj.y);
                ctx.rotate(p.rot);
                
                ctx.fillStyle = '#f8b4c4';
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Inner detail
                ctx.fillStyle = '#e88da8';
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size * 0.4, p.size * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            ctx.restore();
        }
        
        // ==================== MAIN RENDER ====================
        function render() {
            ctx.save();
            ctx.clearRect(0, 0, WIDTH / DPR, HEIGHT / DPR);
            
            // Soft sky gradient background
            const skyGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT / DPR * 0.6);
            skyGrad.addColorStop(0, '#c5b8a8');
            skyGrad.addColorStop(0.5, '#d4c9b8');
            skyGrad.addColorStop(1, '#e8d9c2');
            
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, WIDTH / DPR, HEIGHT / DPR);
            
            // Update camera
            if (autoOrbit) {
                camera.angle += orbitSpeed;
            }
            
            // Gentle breathing on camera height
            const breathe = Math.sin(time * 0.6) * 0.04;
            
            // Calculate camera position
            const camX = Math.cos(camera.angle) * camera.distance;
            const camY = Math.sin(camera.angle) * camera.distance * 0.65;
            const camZ = camera.height + breathe;
            
            // Sort objects by depth for proper drawing order
            const objects = [];
            
            // Add all elements with their z-depth for sorting
            objects.push({ type: 'ground', depth: 0 });
            objects.push({ type: 'path', depth: 0.5 });
            objects.push({ type: 'pond', depth: 5.5 });
            
            // Cherry trees
            objects.push({ type: 'cherry1', depth: -3.5 });
            objects.push({ type: 'cherry2', depth: 5.8 });
            objects.push({ type: 'bamboo1', depth: -5.2 });
            objects.push({ type: 'bamboo2', depth: 7.2 });
            
            // Pagoda
            objects.push({ type: 'pagoda', depth: 1.5 });
            
            // Lanterns
            objects.push({ type: 'lantern1', depth: -2.8 });
            objects.push({ type: 'lantern2', depth: 3.2 });
            
            // People
            objects.push({ type: 'person1', depth: -1.2 });
            objects.push({ type: 'person2', depth: 0.8 });
            objects.push({ type: 'person3', depth: 7.5 });
            
            // Bridge
            objects.push({ type: 'bridge', depth: 6.8 });
            
            // Sort by depth (back to front)
            objects.sort((a, b) => a.depth - b.depth);
            
            // Draw everything in order
            for (const obj of objects) {
                switch (obj.type) {
                    case 'ground':
                        drawGround();
                        break;
                    case 'path':
                        drawStonePath();
                        break;
                    case 'pond':
                        drawPond();
                        break;
                    case 'cherry1':
                        drawCherryTree(-4.8, 0.5, 1.15);
                        break;
                    case 'cherry2':
                        drawCherryTree(5.8, 1.6, 1.0);
                        break;
                    case 'bamboo1':
                        drawBamboo(-6.2, -2.5, 6);
                        break;
                    case 'bamboo2':
                        drawBamboo(8.8, 2.2, 5);
                        break;
                    case 'pagoda':
                        drawPagoda();
                        break;
                    case 'lantern1':
                        drawStoneLantern(-3.2, -1.8);
                        break;
                    case 'lantern2':
                        drawStoneLantern(1.8, 6.2);
                        break;
                    case 'person1':
                        drawPerson(-1.6, 1.8, 0.4, 'woman');
                        break;
                    case 'person2':
                        drawPerson(0.3, 2.4, 0.4, 'man');
                        break;
                    case 'person3':
                        drawPerson(7.8, 7.3, 1.4, 'man');
                        break;
                    case 'bridge':
                        drawRedBridge();
                        break;
                }
            }
            
            // Falling petals (always on top)
            updateAndDrawPetals();
            
            // Subtle atmospheric haze
            ctx.fillStyle = 'rgba(232, 217, 194, 0.06)';
            ctx.fillRect(0, 0, WIDTH / DPR, HEIGHT / DPR * 0.65);
            
            ctx.restore();
        }
        
        // ==================== ANIMATION LOOP ====================
        function animate() {
            time += 0.016;
            
            render();
            
            // Update status
            const statusEl = document.getElementById('status');
            if (autoOrbit) {
                statusEl.textContent = 'Camera orbiting • Drag to control';
            } else {
                statusEl.textContent = 'Camera paused • Drag to orbit';
            }
            
            requestAnimationFrame(animate);
        }
        
        // ==================== INTERACTION ====================
        function setupControls() {
            const canvasEl = document.getElementById('canvas');
            
            // Mouse drag for camera control
            canvasEl.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                autoOrbit = false;
                document.getElementById('btn-orbit').classList.remove('active');
            });
            
            window.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const dx = (e.clientX - lastMouseX) * 0.004;
                const dy = (e.clientY - lastMouseY) * 0.003;
                
                camera.angle += dx;
                camera.height = Math.max(0.7, Math.min(2.6, camera.height - dy));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            
            // Touch support
            canvasEl.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                    autoOrbit = false;
                    document.getElementById('btn-orbit').classList.remove('active');
                }
            });
            
            canvasEl.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                
                const dx = (e.touches[0].clientX - lastMouseX) * 0.004;
                const dy = (e.touches[0].clientY - lastMouseY) * 0.003;
                
                camera.angle += dx;
                camera.height = Math.max(0.7, Math.min(2.6, camera.height - dy));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
                e.preventDefault();
            });
            
            canvasEl.addEventListener('touchend', () => {
                isDragging = false;
            });
            
            // Mouse wheel for zoom
            canvasEl.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.distance = Math.max(6.5, Math.min(18, camera.distance + e.deltaY * 0.012));
            });
            
            // Control buttons
            const btnOrbit = document.getElementById('btn-orbit');
            const btnCloseup = document.getElementById('btn-closeup');
            const btnSide = document.getElementById('btn-side');
            const btnTop = document.getElementById('btn-top');
            const btnReset = document.getElementById('btn-reset');
            
            btnOrbit.addEventListener('click', () => {
                autoOrbit = !autoOrbit;
                if (autoOrbit) {
                    btnOrbit.classList.add('active');
                } else {
                    btnOrbit.classList.remove('active');
                }
            });
            
            btnCloseup.addEventListener('click', () => {
                autoOrbit = false;
                btnOrbit.classList.remove('active');
                
                // Smooth transition to close-up
                const target = { angle: 1.35, height: 1.05, distance: 7.8 };
                animateCamera(target);
            });
            
            btnSide.addEventListener('click', () => {
                autoOrbit = false;
                btnOrbit.classList.remove('active');
                const target = { angle: 0.35, height: 1.75, distance: 13 };
                animateCamera(target);
            });
            
            btnTop.addEventListener('click', () => {
                autoOrbit = false;
                btnOrbit.classList.remove('active');
                const target = { angle: 0.85, height: 3.1, distance: 9.5 };
                animateCamera(target);
            });
            
            btnReset.addEventListener('click', () => {
                autoOrbit = true;
                btnOrbit.classList.add('active');
                
                const target = { angle: 0.75, height: 1.4, distance: 11.5 };
                animateCamera(target);
            });
            
            // Keyboard controls
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ') {
                    e.preventDefault();
                    autoOrbit = !autoOrbit;
                    btnOrbit.classList.toggle('active', autoOrbit);
                }
                
                if (e.key.toLowerCase() === 'r') {
                    autoOrbit = true;
                    btnOrbit.classList.add('active');
                    camera.angle = 0.75;
                    camera.height = 1.4;
                    camera.distance = 11.5;
                }
            });
            
            // Set initial active
            btnOrbit.classList.add('active');
        }
        
        function animateCamera(target, duration = 850) {
            const start = {
                angle: camera.angle,
                height: camera.height,
                distance: camera.distance
            };
            
            const startTime = performance.now();
            
            function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic
                
                camera.angle = start.angle + (target.angle - start.angle) * ease;
                camera.height = start.height + (target.height - start.height) * ease;
                camera.distance = start.distance + (target.distance - start.distance) * ease;
                
                if (t < 1) {
                    requestAnimationFrame(step);
                }
            }
            
            requestAnimationFrame(step);
        }
        
        // ==================== INITIALIZATION ====================
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Initialize particles
            initPetals();
            
            // Initial camera position
            camera.angle = 0.75;
            camera.height = 1.4;
            camera.distance = 11.5;
            
            // Seed some initial koi movement
            // (already handled in drawKoi)
            
            // Start animation
            setupControls();
            animate();
            
            // Gentle intro animation
            setTimeout(() => {
                camera.distance = 9.5;
                setTimeout(() => {
                    if (autoOrbit) camera.distance = 11.5;
                }, 1600);
            }, 800);
            
            // Easter egg: double click to focus on pagoda
            canvas.addEventListener('dblclick', () => {
                autoOrbit = false;
                document.getElementById('btn-orbit').classList.remove('active');
                animateCamera({ angle: 1.1, height: 0.95, distance: 7.2 }, 1100);
            });
            
            console.log('%c[Cinematic Japanese Garden] Fully self-contained 3D animation initialized.', 'color:#a38e70');
        }
        
        // Boot
        window.onload = init;
    </script>
