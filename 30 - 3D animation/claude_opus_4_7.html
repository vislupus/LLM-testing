<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>桜閣 · Sakura Pagoda — A Cinematic Scene</title>
<style>
  :root {
    --ink: #3a2a1f;
    --ink-soft: #6a4a35;
    --paper: #faf3e6;
    --vermillion: #b53b2a;
    --gold: #c39a3e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1410;
    font-family: 'Cormorant Garamond', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 80% 60% at 50% 50%, #2a1f18 0%, #15100c 70%, #0a0805 100%);
  }
  #stage {
    position: relative;
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    max-width: 1280px; max-height: 1280px;
    box-shadow: 0 0 0 1px rgba(255,235,200,0.04), 0 40px 100px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.4);
    background: var(--paper);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .frame-deco {
    position: absolute; pointer-events: none;
    color: rgba(58,42,31,0.55);
    font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
    font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500;
    transition: opacity 0.6s; mix-blend-mode: multiply;
  }
  .title { top: 28px; left: 32px; text-align: left; }
  .title .kanji {
    display: block; font-size: 22px; letter-spacing: 12px;
    color: var(--vermillion); margin-bottom: 6px; font-weight: 400;
  }
  .title .roman {
    display: block; font-size: 11px; letter-spacing: 6px;
    color: rgba(58,42,31,0.7);
  }
  .subtitle {
    bottom: 28px; left: 32px;
    font-style: italic; font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13px; letter-spacing: 1px;
    color: rgba(58,42,31,0.6); text-transform: none;
    max-width: 280px; line-height: 1.5;
  }
  .seal {
    top: 28px; right: 32px;
    width: 44px; height: 44px;
    border: 1.5px solid var(--vermillion);
    color: var(--vermillion);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; background: rgba(255,255,255,0.4);
    backdrop-filter: blur(4px);
  }
  .controls {
    position: absolute; bottom: 28px; right: 32px;
    display: flex; gap: 4px;
    background: rgba(255,250,240,0.55);
    backdrop-filter: blur(8px);
    padding: 6px;
    border: 1px solid rgba(58,42,31,0.1);
    transition: opacity 0.6s;
  }
  .controls button {
    background: transparent; border: 1px solid transparent;
    color: var(--ink-soft); font-family: inherit;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    padding: 6px 10px; cursor: pointer; transition: all 0.25s;
  }
  .controls button:hover { background: rgba(181,59,42,0.08); color: var(--vermillion); }
  .controls button.on {
    background: rgba(181,59,42,0.12); color: var(--vermillion);
    border-color: rgba(181,59,42,0.3);
  }
  #stage.minimal .frame-deco, #stage.minimal .controls { opacity: 0; }
  #loader {
    position: absolute; inset: 0;
    background: var(--paper);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    transition: opacity 1.2s ease; z-index: 100;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader .lkanji { color: var(--vermillion); font-size: 36px; letter-spacing: 16px; margin-left: 16px; }
  #loader .lbar { width: 140px; height: 1px; background: rgba(58,42,31,0.15); overflow: hidden; position: relative; }
  #loader .lbar::after {
    content: ''; position: absolute; inset: 0;
    background: var(--vermillion); transform-origin: left;
    transform: scaleX(0); animation: load 1.6s ease-out forwards;
  }
  @keyframes load { to { transform: scaleX(1); } }
  #loader .ltext { font-size: 9px; letter-spacing: 5px; color: rgba(58,42,31,0.5); text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div class="frame-deco title">
    <span class="kanji">桜閣</span>
    <span class="roman">Sakura Pagoda · Spring</span>
  </div>
  <div class="frame-deco seal">印</div>
  <div class="frame-deco subtitle">
    "petals fall, the pond remembers nothing —<br>the koi swims on"
  </div>
  <div class="controls">
    <button id="btnPlay" class="on">PAUSE</button>
    <button id="btnDof" class="on">DEPTH</button>
    <button id="btnPet" class="on">PETALS</button>
    <button id="btnUI">FRAME</button>
  </div>
  <div id="loader">
    <div class="lkanji">桜</div>
    <div class="lbar"></div>
    <div class="ltext">composing the scene</div>
  </div>
</div>
<script>
'use strict';
// ============================================================================
//  SAKURA PAGODA — A CINEMATIC CANVAS SCENE
// ============================================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const stage = document.getElementById('stage');
const SCENE_W = 1024, SCENE_H = 1024;
let viewW = SCENE_W, viewH = SCENE_H;
let DPR = Math.min(2, window.devicePixelRatio || 1);

function resize() {
  const r = stage.getBoundingClientRect();
  viewW = r.width; viewH = r.height;
  canvas.width  = Math.round(viewW * DPR);
  canvas.height = Math.round(viewH * DPR);
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// PALETTE
const C = {
  skyTop:'#f6ebd8', skyMid:'#f9e8cf', skyBot:'#f0d9b8',
  grassLight:'#b9d278', grassMid:'#9bbe5c', grassDark:'#7ea848',
  grassEdge:'#5d8232', earth:'#7e6242', earthDark:'#5a4530',
  pathLight:'#ece2cb', pathMid:'#d4c8ac', pathDark:'#b6a888',
  wallLight:'#f7eddc', wallMid:'#ead9bc', wallShade:'#d6c39a', wallDeep:'#b39f76',
  trim:'#a8341f', trimLight:'#c4513a', trimDark:'#7a2210',
  post:'#8d2a17', postDark:'#5a1a0a',
  roofMid:'#3a342d', roofUp:'#4a4138', roofDn:'#221d18', roofRim:'#0e0a07',
  roofGold:'#d8a946', goldLight:'#f5d27c', goldDark:'#8a6420',
  sakLight:'#fde2eb', sakMid:'#f5c5d4', sakDeep:'#e4a2b6', sakShade:'#b87890',
  trunk:'#5a3a2c', trunkDark:'#3a2418', branch:'#6a4838',
  bambLight:'#bcd884', bambMid:'#8eba56', bambDark:'#5e8a30',
  bambLeaf:'#7faa46', bambLeafDark:'#5a8228', bambLeafLight:'#a4c46a',
  waterLight:'#e0f0f4', waterMid:'#b2d7e2', waterDeep:'#7dafc4',
  waterEdge:'#5a8aa4', waterDark:'#2c4e60',
  stoneLight:'#dcd2c2', stoneMid:'#b8aa92', stoneDark:'#807260', stoneShade:'#4d4232',
  bushLight:'#6a9c3a', bushMid:'#4f7d22', bushDark:'#345e14', bushShade:'#1f3c0a',
  bridgeRed:'#b83928', bridgeRedDk:'#7d2415', bridgeRedLt:'#d8503a',
  bridgeWood:'#c08855', bridgeWoodDk:'#7e5a35', bridgeRail:'#9a2c1c',
  koiW:'#f6f0e2', koiOr:'#e6743a', koiOrLt:'#f59458',
  koiBk:'#1a1612', koiRed:'#c4452a',
  skin:'#ecc9aa', skinShade:'#c89a78',
  hair1:'#3a2218', hair2:'#1c0f0a',
  topW:'#f0e4d2', bagBlk:'#2a2620', skirt:'#2c2c3a', shoes:'#1c1814',
  shirtG:'#3d5a30', shirtGDk:'#26381c', pants:'#2a2624',
  petal:'#f8cfdc', petalLt:'#fde2ea', petalDk:'#e8a8be',
  fence:'#d8c0a0', fenceDk:'#9a7e58',
};

// HELPERS
const TAU = Math.PI * 2, PI = Math.PI;
const sin = Math.sin, cos = Math.cos;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const ISO_SLOPE = 0.5;

function fillPoly(c, pts, color) {
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  c.fillStyle = color; c.fill();
}
function ellipseFill(c, x, y, rx, ry, color) {
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU);
  if (color) c.fillStyle = color; c.fill();
}

// ============================================================================
//  STATIC SCENE ELEMENTS
// ============================================================================

function drawIsland(c) {
  const cx = SCENE_W * 0.50, cy = SCENE_H * 0.62;
  const rx = 460, ry = 250;
  // contact shadow
  c.save(); c.filter = 'blur(28px)';
  c.fillStyle = 'rgba(60,40,20,0.35)';
  ellipseFill(c, cx + 8, cy + 38, rx * 1.05, ry * 0.55);
  c.restore();
  // earth side
  c.fillStyle = C.earthDark; ellipseFill(c, cx, cy + 22, rx, ry);
  c.fillStyle = C.earth;     ellipseFill(c, cx, cy + 14, rx, ry);
  // grass top
  const g = c.createRadialGradient(cx - 80, cy - 60, 60, cx, cy, Math.max(rx, ry) * 1.1);
  g.addColorStop(0, C.grassLight);
  g.addColorStop(0.55, C.grassMid);
  g.addColorStop(1, C.grassDark);
  c.fillStyle = g; ellipseFill(c, cx, cy, rx, ry);
  // speckles
  for (let i = 0; i < 220; i++) {
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * 0.95;
    const px = cx + cos(a) * rx * r, py = cy + sin(a) * ry * r;
    const sz = rand(1.2, 2.6);
    c.fillStyle = Math.random() < 0.5 ? C.grassLight : C.grassDark;
    c.globalAlpha = rand(0.18, 0.45);
    c.fillRect(px, py, sz, sz * 0.6);
  }
  c.globalAlpha = 1;
  // grass tufts
  c.strokeStyle = C.grassEdge; c.lineWidth = 1;
  for (let i = 0; i < 80; i++) {
    const a = rand(0, TAU), r = Math.sqrt(Math.random());
    const px = cx + cos(a) * rx * r * 0.95, py = cy + sin(a) * ry * r * 0.95;
    c.beginPath();
    c.moveTo(px, py); c.lineTo(px - 1, py - rand(2, 4));
    c.moveTo(px, py); c.lineTo(px + 1, py - rand(2, 4));
    c.globalAlpha = rand(0.25, 0.6); c.stroke();
  }
  c.globalAlpha = 1;
  // edge highlight
  c.strokeStyle = 'rgba(255,255,255,0.28)'; c.lineWidth = 2;
  c.beginPath(); c.ellipse(cx, cy - 1, rx, ry, 0, PI * 1.05, PI * 1.95); c.stroke();
}

function drawPath(c) {
  const cx = SCENE_W * 0.50, cy = SCENE_H * 0.62;
  const cl = [
    [cx - 360, cy + 130], [cx - 240, cy + 145],
    [cx - 100, cy + 60], [cx + 0, cy - 30],
    [cx + 130, cy + 30], [cx + 260, cy + 140], [cx + 360, cy + 165],
  ];
  const pw = 64;
  function offset(pts, side) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const q = pts[Math.min(i + 1, pts.length - 1)];
      const r = pts[Math.max(i - 1, 0)];
      const tx = q[0] - r[0], ty = q[1] - r[1];
      const L = Math.hypot(tx, ty) || 1;
      out.push([p[0] + (-ty / L) * side * pw / 2, p[1] + (tx / L) * side * pw / 2]);
    }
    return out;
  }
  const a = offset(cl, 1), b = offset(cl, -1).reverse();
  const ring = a.concat(b);

  // shadow under
  c.save(); c.filter = 'blur(6px)';
  c.fillStyle = 'rgba(60,40,25,0.18)';
  c.beginPath();
  c.moveTo(ring[0][0], ring[0][1] + 4);
  for (let i = 1; i < ring.length; i++) c.lineTo(ring[i][0], ring[i][1] + 4);
  c.closePath(); c.fill();
  c.restore();

  fillPoly(c, ring, C.pathMid);

  // stones
  c.save();
  c.beginPath();
  c.moveTo(ring[0][0], ring[0][1]);
  for (let i = 1; i < ring.length; i++) c.lineTo(ring[i][0], ring[i][1]);
  c.closePath(); c.clip();
  for (let s = 0; s < 1; s += 0.06) {
    const t = s * (cl.length - 1);
    const i = Math.floor(t), u = t - i;
    const p = cl[i], q = cl[Math.min(i + 1, cl.length - 1)];
    const sx = lerp(p[0], q[0], u), sy = lerp(p[1], q[1], u);
    const tx = q[0] - p[0], ty = q[1] - p[1];
    const L = Math.hypot(tx, ty) || 1;
    const nx = -ty / L, ny = tx / L;
    for (let j = -1; j <= 1; j++) {
      const offs = j * 22 + rand(-3, 3);
      const stx = sx + nx * offs, sty = sy + ny * offs;
      const sw = rand(14, 22), sh = sw * rand(0.5, 0.7);
      c.save();
      c.translate(stx, sty);
      c.rotate(Math.atan2(ty, tx) + rand(-0.15, 0.15));
      c.fillStyle = (Math.random() < 0.4) ? C.pathLight : C.pathMid;
      c.beginPath(); c.ellipse(0, 0, sw, sh, 0, 0, TAU); c.fill();
      c.restore();
    }
  }
  c.restore();
  // edges
  c.lineWidth = 2; c.strokeStyle = 'rgba(60,45,25,0.18)';
  c.beginPath();
  for (let i = 0; i < a.length; i++) (i === 0 ? c.moveTo : c.lineTo).call(c, a[i][0], a[i][1]);
  c.stroke();
  c.beginPath();
  for (let i = 0; i < b.length; i++) (i === 0 ? c.moveTo : c.lineTo).call(c, b[i][0], b[i][1]);
  c.stroke();
}

function drawFence(c) {
  const x0 = SCENE_W * 0.50 - 360, y0 = SCENE_H * 0.62 + 110;
  const posts = 5;
  for (let i = 0; i < posts; i++) {
    const px = x0 + i * 28, py = y0 + i * 6, ph = 22;
    c.fillStyle = C.fenceDk; c.fillRect(px - 2, py - ph + 1, 4, ph);
    c.fillStyle = C.fence;   c.fillRect(px - 1.5, py - ph, 3, ph);
    c.fillStyle = C.fence;
    c.beginPath();
    c.moveTo(px - 3, py - ph); c.lineTo(px, py - ph - 3); c.lineTo(px + 3, py - ph);
    c.closePath(); c.fill();
    c.fillStyle = C.fenceDk;
    c.beginPath();
    c.moveTo(px, py - ph - 3); c.lineTo(px + 3, py - ph);
    c.lineTo(px + 3, py - ph + 1); c.lineTo(px, py - ph - 2);
    c.closePath(); c.fill();
  }
  c.fillStyle = C.fenceDk;
  c.beginPath();
  c.moveTo(x0 - 4, y0 - 14);
  c.lineTo(x0 + (posts - 1) * 28 + 4, y0 - 14 + (posts - 1) * 6);
  c.lineTo(x0 + (posts - 1) * 28 + 4, y0 - 11 + (posts - 1) * 6);
  c.lineTo(x0 - 4, y0 - 11);
  c.closePath(); c.fill();
  c.fillStyle = C.fence; c.fillRect(x0 - 4, y0 - 14, (posts - 1) * 28 + 8, 2);
}

function drawBush(c, x, y, r, dark) {
  c.save(); c.filter = 'blur(6px)';
  c.fillStyle = 'rgba(30,40,15,0.32)';
  ellipseFill(c, x + 3, y + r * 0.35, r * 1.05, r * 0.5);
  c.restore();
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.2, x, y, r);
  g.addColorStop(0, dark ? C.bushMid : C.bushLight);
  g.addColorStop(0.6, dark ? C.bushDark : C.bushMid);
  g.addColorStop(1, C.bushShade);
  c.fillStyle = g; ellipseFill(c, x, y, r, r * 0.85);
  c.fillStyle = dark ? C.bushDark : C.bushMid;
  for (let i = 0; i < 12; i++) {
    const a = rand(-PI, 0), rr = r * rand(0.55, 0.95);
    c.beginPath();
    c.ellipse(x + cos(a) * rr, y + sin(a) * rr * 0.85,
              rand(2.8, 4.6), rand(2, 3.4), rand(-0.6, 0.6), 0, TAU);
    c.globalAlpha = rand(0.5, 0.85); c.fill();
  }
  c.globalAlpha = 1;
  c.fillStyle = C.bushLight;
  for (let i = 0; i < 6; i++) {
    const a = rand(-PI * 0.85, -PI * 0.15), rr = r * rand(0.3, 0.7);
    c.beginPath();
    c.arc(x + cos(a) * rr, y + sin(a) * rr * 0.85, rand(1.5, 2.4), 0, TAU);
    c.globalAlpha = rand(0.4, 0.7); c.fill();
  }
  c.globalAlpha = 1;
}

function drawLantern(c, x, y, scale = 1) {
  c.save(); c.translate(x, y); c.scale(scale, scale);
  c.save(); c.filter = 'blur(4px)';
  c.fillStyle = 'rgba(40,30,20,0.4)';
  ellipseFill(c, 4, 2, 22, 8); c.restore();
  fillPoly(c, [[-18,0],[18,0],[16,-8],[-16,-8]], C.stoneDark);
  fillPoly(c, [[-16,-8],[16,-8],[14,-12],[-14,-12]], C.stoneMid);
  fillPoly(c, [[-10,-12],[10,-12],[9,-28],[-9,-28]], C.stoneMid);
  fillPoly(c, [[-10,-12],[-9,-28],[-5,-28],[-6,-12]], C.stoneShade);
  fillPoly(c, [[-15,-28],[15,-28],[13,-34],[-13,-34]], C.stoneLight);
  fillPoly(c, [[-15,-28],[15,-28],[17,-26],[-17,-26]], C.stoneDark);
  fillPoly(c, [[-13,-34],[13,-34],[13,-52],[-13,-52]], C.stoneMid);
  fillPoly(c, [[-7,-38],[7,-38],[7,-48],[-7,-48]], '#241a12');
  c.fillStyle = 'rgba(255,180,80,0.35)'; c.fillRect(-5, -47, 10, 8);
  fillPoly(c, [[-15,-52],[15,-52],[13,-56],[-13,-56]], C.stoneLight);
  fillPoly(c, [[-13,-56],[13,-56],[10,-64],[-10,-64]], C.stoneMid);
  fillPoly(c, [[-13,-56],[-10,-64],[10,-64],[13,-56]], C.stoneShade);
  fillPoly(c, [[-15,-52],[-18,-54],[-13,-56]], C.stoneDark);
  fillPoly(c, [[15,-52],[18,-54],[13,-56]], C.stoneDark);
  c.fillStyle = C.stoneLight; c.beginPath(); c.arc(0, -68, 3, 0, TAU); c.fill();
  c.fillStyle = C.stoneShade; c.beginPath(); c.arc(1, -67, 1.5, 0, TAU); c.fill();
  c.fillStyle = C.bushDark;
  for (let i = 0; i < 5; i++) {
    c.globalAlpha = rand(0.4, 0.7);
    c.beginPath(); c.arc(rand(-15, 15), rand(-8, -3), rand(1, 1.8), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
  c.restore();
}

function drawSakura(c, x, y, size, opts = {}) {
  const flip = opts.flip ? -1 : 1;
  c.save(); c.translate(x, y); c.scale(flip, 1);
  c.save(); c.filter = 'blur(10px)';
  c.fillStyle = 'rgba(40,30,20,0.32)';
  ellipseFill(c, size * 0.1, size * 0.1, size * 0.8, size * 0.18);
  c.restore();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = C.trunkDark; c.lineWidth = size * 0.08;
  c.beginPath(); c.moveTo(0, 0);
  c.quadraticCurveTo(size * -0.05, -size * 0.45, size * -0.15, -size * 0.85);
  c.stroke();
  c.strokeStyle = C.trunk; c.lineWidth = size * 0.06;
  c.beginPath(); c.moveTo(0, 0);
  c.quadraticCurveTo(size * -0.05, -size * 0.45, size * -0.15, -size * 0.85);
  c.stroke();

  let s = opts.seed || 42;
  const srnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };

  c.strokeStyle = C.branch; c.lineWidth = size * 0.04;
  for (let i = 0; i < 6; i++) {
    const t = 0.35 + i * 0.10 + srnd() * 0.05;
    const baseX = lerp(0, size * -0.15, t), baseY = lerp(0, -size * 0.85, t);
    const angle = -PI / 2 + (srnd() - 0.5) * 1.6;
    const bL = size * (0.3 + srnd() * 0.25);
    const tipX = baseX + cos(angle) * bL, tipY = baseY + sin(angle) * bL;
    c.beginPath(); c.moveTo(baseX, baseY);
    c.quadraticCurveTo(
      baseX + cos(angle) * bL * 0.5 + (srnd() - 0.5) * 8,
      baseY + sin(angle) * bL * 0.5 + (srnd() - 0.5) * 8,
      tipX, tipY);
    c.stroke();
  }

  const blossoms = [
    [size * 0.05, -size * 0.95, size * 0.42],
    [size * -0.35, -size * 0.85, size * 0.36],
    [size *  0.40, -size * 0.80, size * 0.38],
    [size *  0.10, -size * 1.10, size * 0.32],
    [size * -0.20, -size * 1.05, size * 0.28],
    [size *  0.30, -size * 1.00, size * 0.30],
    [size * -0.45, -size * 0.55, size * 0.22],
    [size *  0.50, -size * 0.55, size * 0.22],
  ];
  c.save(); c.filter = 'blur(8px)';
  for (const b of blossoms) {
    c.fillStyle = C.sakLight;
    c.beginPath(); c.ellipse(b[0], b[1], b[2] * 1.05, b[2] * 0.85, 0, 0, TAU); c.fill();
  }
  c.restore();
  for (const b of blossoms) {
    const g = c.createRadialGradient(b[0] - b[2] * 0.2, b[1] - b[2] * 0.2, b[2] * 0.1, b[0], b[1], b[2]);
    g.addColorStop(0, C.sakLight);
    g.addColorStop(0.5, C.sakMid);
    g.addColorStop(1, C.sakDeep);
    c.fillStyle = g;
    c.beginPath(); c.ellipse(b[0], b[1], b[2], b[2] * 0.85, 0, 0, TAU); c.fill();
  }
  for (const b of blossoms) {
    for (let i = 0; i < 22; i++) {
      const a = srnd() * TAU;
      const r = Math.sqrt(srnd()) * b[2] * 0.95;
      const px = b[0] + cos(a) * r, py = b[1] + sin(a) * r * 0.85;
      const sz = 1.4 + srnd() * 1.6;
      c.fillStyle = srnd() < 0.5 ? C.sakLight : C.sakDeep;
      c.globalAlpha = 0.55 + srnd() * 0.4;
      c.beginPath(); c.arc(px, py, sz, 0, TAU); c.fill();
    }
  }
  c.globalAlpha = 0.5; c.fillStyle = C.sakShade;
  for (const b of blossoms) {
    for (let i = 0; i < 4; i++) {
      const a = srnd() * TAU;
      const r = Math.sqrt(srnd()) * b[2] * 0.7;
      c.beginPath();
      c.arc(b[0] + cos(a) * r, b[1] + sin(a) * r * 0.85 + b[2] * 0.2, 1.5 + srnd(), 0, TAU);
      c.fill();
    }
  }
  c.globalAlpha = 1; c.restore();
}

function drawBambooStalk(c, x, y, h) {
  c.save(); c.translate(x, y);
  const w = 4, segs = 7, segH = h / segs;
  for (let i = 0; i < segs; i++) {
    const ty = -i * segH;
    c.fillStyle = C.bambDark; c.fillRect(-w / 2, ty - segH + 2, w, segH - 2);
    c.fillStyle = C.bambLight; c.fillRect(-w / 2, ty - segH + 2, 1.2, segH - 2);
    c.fillStyle = C.bambDark;  c.fillRect(-w / 2 - 0.5, ty - 1, w + 1, 2);
    c.fillStyle = C.bambMid;   c.fillRect(-w / 2 - 0.5, ty - 1, w + 1, 1);
  }
  c.save(); c.translate(0, -h);
  for (let g = 0; g < 3; g++) {
    const baseAng = (g / 3) * TAU + rand(-0.3, 0.3);
    for (let k = 0; k < 4; k++) {
      const a = baseAng + (k - 1.5) * 0.35;
      const len = rand(14, 22);
      c.save(); c.rotate(a);
      c.fillStyle = (k % 2 === 0) ? C.bambLeaf : C.bambLeafDark;
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(len * 0.2, -2, len, -1);
      c.quadraticCurveTo(len * 0.6, 1.5, 0, 0);
      c.fill();
      c.strokeStyle = C.bambLeafDark; c.lineWidth = 0.5;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(len, 0); c.stroke();
      c.restore();
    }
  }
  c.restore(); c.restore();
}

function drawBambooGrove(c, x, y, count) {
  for (let i = 0; i < count; i++) {
    const ox = (i - count / 2) * 8 + rand(-3, 3);
    const oy = rand(-3, 3), h = rand(120, 165);
    drawBambooStalk(c, x + ox, y + oy, h);
  }
}
// PAGODA — composed of stacked tiers + sweeping roofs
function drawTier(c, cx, cy, halfW, height, doors) {
  const slope = ISO_SLOPE;
  const F = [cx, cy + halfW * slope];
  const L = [cx - halfW, cy];
  const R = [cx + halfW, cy];
  const Ft = [F[0], F[1] - height];
  const Lt = [L[0], L[1] - height];
  const Rt = [R[0], R[1] - height];

  fillPoly(c, [F, L, Lt, Ft], C.wallLight);
  fillPoly(c, [F, R, Rt, Ft], C.wallMid);

  c.fillStyle = C.post;
  c.fillRect(F[0] - 2.5, F[1] - height - 1, 5, height + 2);
  c.fillStyle = C.postDark;
  c.fillRect(F[0] + 1, F[1] - height - 1, 1.5, height + 2);
  c.fillStyle = C.post;
  c.fillRect(L[0] - 2, L[1] - height - 1, 4, height + 2);
  c.fillStyle = C.postDark;
  c.fillRect(L[0] + 0.5, L[1] - height - 1, 1.5, height + 2);
  c.fillStyle = C.post;
  c.fillRect(R[0] - 2, R[1] - height - 1, 4, height + 2);
  c.fillStyle = C.postDark;
  c.fillRect(R[0] + 1.5, R[1] - height - 1, 0.5, height + 2);

  c.strokeStyle = C.post; c.lineWidth = 3;
  c.beginPath();
  c.moveTo(F[0], F[1]); c.lineTo(L[0], L[1]);
  c.moveTo(F[0], F[1]); c.lineTo(R[0], R[1]);
  c.stroke();
  c.beginPath();
  c.moveTo(Ft[0], Ft[1]); c.lineTo(Lt[0], Lt[1]);
  c.moveTo(Ft[0], Ft[1]); c.lineTo(Rt[0], Rt[1]);
  c.stroke();
  c.strokeStyle = 'rgba(0,0,0,0.18)'; c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(F[0], F[1] + 2); c.lineTo(L[0], L[1] + 1);
  c.moveTo(F[0], F[1] + 2); c.lineTo(R[0], R[1] + 1);
  c.stroke();

  if (doors) {
    function midPoint(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }
    function panel(p1, p2, color) {
      const tl = [p1[0], p1[1] - height + 4];
      const tr = [p2[0], p2[1] - height + 4];
      const bl = [p1[0], p1[1] - 2];
      const br = [p2[0], p2[1] - 2];
      fillPoly(c, [bl, br, tr, tl], color);
    }
    const lA = midPoint(F, L, 1/3), lB = midPoint(F, L, 2/3);
    panel(F, lA, C.wallShade);
    panel(lA, lB, C.wallMid);
    panel(lB, L, C.wallShade);
    c.strokeStyle = C.trimDark; c.lineWidth = 1;
    function midLine(a, b) {
      const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      c.beginPath();
      c.moveTo(m[0], m[1] - 2);
      c.lineTo(m[0], m[1] - height + 4);
      c.stroke();
    }
    midLine(F, lA); midLine(lA, lB); midLine(lB, L);

    const rA = midPoint(F, R, 1/3), rB = midPoint(F, R, 2/3);
    panel(F, rA, C.wallShade);
    panel(rA, rB, C.wallMid);
    panel(rB, R, C.wallShade);
    midLine(F, rA); midLine(rA, rB); midLine(rB, R);

    c.fillStyle = C.trimDark; c.globalAlpha = 0.55;
    const lp = midPoint(F, lA, 0.5);
    c.fillRect(lp[0] - 2, lp[1] - height + 12, 4, height - 18);
    const rp = midPoint(F, rA, 0.5);
    c.fillRect(rp[0] - 2, rp[1] - height + 12, 4, height - 18);
    c.globalAlpha = 1;
    c.fillStyle = C.goldLight;
    c.beginPath(); c.arc(lp[0] + 1, lp[1] - height / 2, 0.8, 0, TAU); c.fill();
    c.beginPath(); c.arc(rp[0] - 1, rp[1] - height / 2, 0.8, 0, TAU); c.fill();
  }
  return { F, L, R, Ft, Lt, Rt };
}

function drawRoof(c, cx, cy, halfW, rise, opts = {}) {
  const slope = ISO_SLOPE;
  const eF = [cx, cy + halfW * slope];
  const eL = [cx - halfW, cy];
  const eR = [cx + halfW, cy];
  const P  = [cx, cy - rise];
  const sag = 8;

  c.save(); c.filter = 'blur(4px)';
  c.fillStyle = 'rgba(0,0,0,0.22)';
  c.beginPath();
  c.moveTo(eF[0], eF[1] + 4);
  c.lineTo(eL[0] - 4, eL[1] + 5);
  c.lineTo(cx, cy - halfW * slope + 4);
  c.lineTo(eR[0] + 4, eR[1] + 5);
  c.closePath(); c.fill();
  c.restore();

  // LEFT slope
  c.beginPath();
  c.moveTo(P[0], P[1]);
  c.lineTo(eF[0], eF[1]);
  const m1x = (eF[0] + eL[0]) / 2, m1y = (eF[1] + eL[1]) / 2 + sag;
  c.quadraticCurveTo(m1x, m1y, eL[0], eL[1]);
  c.closePath();
  c.fillStyle = C.roofMid; c.fill();

  // RIGHT slope
  c.beginPath();
  c.moveTo(P[0], P[1]);
  c.lineTo(eF[0], eF[1]);
  const m2x = (eF[0] + eR[0]) / 2, m2y = (eF[1] + eR[1]) / 2 + sag;
  c.quadraticCurveTo(m2x, m2y, eR[0], eR[1]);
  c.closePath();
  c.fillStyle = C.roofDn; c.fill();

  // ridge edge
  c.strokeStyle = C.roofRim; c.lineWidth = 2;
  c.beginPath(); c.moveTo(P[0], P[1]); c.lineTo(eF[0], eF[1]); c.stroke();

  // eave thickness bands
  c.lineWidth = 4; c.strokeStyle = C.roofRim;
  c.beginPath(); c.moveTo(eF[0], eF[1]); c.quadraticCurveTo(m1x, m1y, eL[0], eL[1]); c.stroke();
  c.lineWidth = 2; c.strokeStyle = C.roofUp;
  c.beginPath(); c.moveTo(eF[0], eF[1] - 2); c.quadraticCurveTo(m1x, m1y - 2, eL[0], eL[1] - 2); c.stroke();
  c.lineWidth = 4; c.strokeStyle = C.roofRim;
  c.beginPath(); c.moveTo(eF[0], eF[1]); c.quadraticCurveTo(m2x, m2y, eR[0], eR[1]); c.stroke();
  c.lineWidth = 2; c.strokeStyle = C.roofMid;
  c.beginPath(); c.moveTo(eF[0], eF[1] - 2); c.quadraticCurveTo(m2x, m2y - 2, eR[0], eR[1] - 2); c.stroke();

  // upturned corner tips
  c.fillStyle = C.roofMid;
  c.beginPath();
  c.moveTo(eF[0] - 5, eF[1] - 1); c.lineTo(eF[0], eF[1] - 6); c.lineTo(eF[0] + 5, eF[1] - 1);
  c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(eL[0] - 4, eL[1]); c.lineTo(eL[0] - 8, eL[1] - 5); c.lineTo(eL[0] - 1, eL[1] - 3);
  c.closePath(); c.fill();
  c.fillStyle = C.roofDn;
  c.beginPath();
  c.moveTo(eR[0] + 4, eR[1]); c.lineTo(eR[0] + 8, eR[1] - 5); c.lineTo(eR[0] + 1, eR[1] - 3);
  c.closePath(); c.fill();

  // tile striations
  c.save();
  c.globalAlpha = 0.16; c.strokeStyle = '#000'; c.lineWidth = 0.6;
  for (let t = 0.15; t < 1.0; t += 0.12) {
    const px = lerp(P[0], eF[0], t), py = lerp(P[1], eF[1], t);
    const lx = lerp(P[0], eL[0], t), ly = lerp(P[1], eL[1], t);
    const mx = (px + lx) / 2, my = (py + ly) / 2 + sag * t * 0.7;
    c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(mx, my, lx, ly); c.stroke();
  }
  for (let t = 0.15; t < 1.0; t += 0.12) {
    const px = lerp(P[0], eF[0], t), py = lerp(P[1], eF[1], t);
    const rx = lerp(P[0], eR[0], t), ry = lerp(P[1], eR[1], t);
    const mx = (px + rx) / 2, my = (py + ry) / 2 + sag * t * 0.7;
    c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(mx, my, rx, ry); c.stroke();
  }
  c.restore();

  // gold bells under eaves
  if (opts.bells) {
    c.fillStyle = C.goldLight;
    [eF, eL, eR].forEach(p => {
      c.beginPath(); c.arc(p[0], p[1] + 4, 1.6, 0, TAU); c.fill();
    });
  }
  return { eF, eL, eR, P };
}

function drawPagoda(c, cx, cy) {
  const slope = ISO_SLOPE;
  const baseHalf = 145;
  const bF = [cx, cy + baseHalf * slope + 10];
  const bL = [cx - baseHalf, cy + 10];
  const bR = [cx + baseHalf, cy + 10];
  const bB = [cx, cy - baseHalf * slope + 10];

  c.save(); c.filter = 'blur(10px)';
  fillPoly(c, [bF, bL, bB, bR], 'rgba(40,28,18,0.4)');
  c.restore();
  fillPoly(c, [bF, bL, bB, bR], C.stoneLight);
  fillPoly(c, [bF, bL, [bL[0], bL[1] + 12], [bF[0], bF[1] + 12]], C.stoneDark);
  fillPoly(c, [bF, bR, [bR[0], bR[1] + 12], [bF[0], bF[1] + 12]], C.stoneMid);
  c.strokeStyle = C.stoneShade; c.lineWidth = 1;
  c.beginPath();
  c.moveTo(bF[0], bF[1]); c.lineTo(bL[0], bL[1]);
  c.moveTo(bF[0], bF[1]); c.lineTo(bR[0], bR[1]);
  c.stroke();

  // STAIRS
  for (let i = 0; i < 5; i++) {
    const sx = bF[0], sy = bF[1] + i * 5;
    const w = 28 - i;
    fillPoly(c, [[sx - w, sy], [sx, sy + 4], [sx + w, sy], [sx, sy - 1]],
             i % 2 === 0 ? C.stoneLight : C.stoneMid);
    fillPoly(c, [[sx - w, sy], [sx, sy + 4], [sx + w, sy]], C.stoneDark);
  }

  // TIER 1
  const t1HalfW = 130, t1Height = 100;
  const t1cx = cx, t1cy = cy + 4;
  drawTier(c, t1cx, t1cy, t1HalfW, t1Height, true);
  drawRoof(c, cx, t1cy - t1Height, t1HalfW + 28, 36, { bells: true });

  // TIER 2
  const t2HalfW = 105, t2Height = 60;
  const t2cy = t1cy - t1Height - 18;
  const t2 = drawTier(c, cx, t2cy, t2HalfW, t2Height, false);
  c.fillStyle = C.trim;
  c.fillRect(t2.F[0] - 1, t2.F[1] - 8, 2, 6);
  c.fillRect(t2.L[0] - 1, t2.L[1] - 8, 2, 6);
  c.fillRect(t2.R[0] - 1, t2.R[1] - 8, 2, 6);
  c.lineWidth = 2; c.strokeStyle = C.trim;
  c.beginPath();
  c.moveTo(t2.F[0], t2.F[1] - 2); c.lineTo(t2.L[0], t2.L[1] - 2);
  c.moveTo(t2.F[0], t2.F[1] - 2); c.lineTo(t2.R[0], t2.R[1] - 2);
  c.stroke();
  c.fillStyle = C.trimDark; c.globalAlpha = 0.5;
  function mid(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }
  const lwA = mid(t2.F, t2.L, 0.35), lwB = mid(t2.F, t2.L, 0.65);
  c.fillRect(lwA[0] - 4, lwA[1] - t2Height + 18, 8, 14);
  c.fillRect(lwB[0] - 4, lwB[1] - t2Height + 18, 8, 14);
  const rwA = mid(t2.F, t2.R, 0.35), rwB = mid(t2.F, t2.R, 0.65);
  c.fillRect(rwA[0] - 4, rwA[1] - t2Height + 18, 8, 14);
  c.fillRect(rwB[0] - 4, rwB[1] - t2Height + 18, 8, 14);
  c.globalAlpha = 1;
  drawRoof(c, cx, t2cy - t2Height, t2HalfW + 22, 30, { bells: true });

  // TIER 3
  const t3HalfW = 78, t3Height = 48;
  const t3cy = t2cy - t2Height - 14;
  const t3 = drawTier(c, cx, t3cy, t3HalfW, t3Height, false);
  c.fillStyle = C.trim;
  c.fillRect(t3.F[0] - 1, t3.F[1] - 6, 2, 4);
  c.fillRect(t3.L[0] - 1, t3.L[1] - 6, 2, 4);
  c.fillRect(t3.R[0] - 1, t3.R[1] - 6, 2, 4);
  c.strokeStyle = C.trim; c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(t3.F[0], t3.F[1] - 1); c.lineTo(t3.L[0], t3.L[1] - 1);
  c.moveTo(t3.F[0], t3.F[1] - 1); c.lineTo(t3.R[0], t3.R[1] - 1);
  c.stroke();
  c.fillStyle = C.trimDark; c.globalAlpha = 0.5;
  const t3l = mid(t3.F, t3.L, 0.5), t3r = mid(t3.F, t3.R, 0.5);
  c.fillRect(t3l[0] - 3, t3l[1] - t3Height + 14, 6, 12);
  c.fillRect(t3r[0] - 3, t3r[1] - t3Height + 14, 6, 12);
  c.globalAlpha = 1;
  const r3 = drawRoof(c, cx, t3cy - t3Height, t3HalfW + 18, 40, { bells: true });

  // FINIAL
  c.fillStyle = C.goldDark; c.fillRect(cx - 5, r3.P[1] - 2, 10, 3);
  c.fillStyle = C.roofGold; c.fillRect(cx - 4, r3.P[1] - 4, 8, 2);
  c.fillStyle = C.goldDark; c.fillRect(cx - 1, r3.P[1] - 22, 2, 18);
  c.fillStyle = C.roofGold; c.fillRect(cx - 1.5, r3.P[1] - 22, 1.5, 18);
  for (let i = 0; i < 3; i++) {
    const ry = r3.P[1] - 8 - i * 4;
    c.fillStyle = C.goldLight; c.fillRect(cx - 4 + i * 0.5, ry, 8 - i, 1.5);
  }
  c.fillStyle = C.goldLight;
  c.beginPath();
  c.moveTo(cx, r3.P[1] - 30); c.lineTo(cx + 3, r3.P[1] - 24);
  c.lineTo(cx, r3.P[1] - 22);  c.lineTo(cx - 3, r3.P[1] - 24);
  c.closePath(); c.fill();
  c.fillStyle = '#fff8e8'; c.fillRect(cx - 0.5, r3.P[1] - 28, 1, 4);
}

// POND
function drawPond(c) {
  const cx = SCENE_W * 0.62, cy = SCENE_H * 0.78;
  const rx = 200, ry = 105;
  c.fillStyle = C.earthDark; ellipseFill(c, cx, cy + 4, rx + 14, ry + 14);
  c.fillStyle = C.stoneDark; ellipseFill(c, cx, cy + 2, rx + 8, ry + 8);
  c.fillStyle = C.stoneMid;  ellipseFill(c, cx, cy, rx + 4, ry + 4);
  const g = c.createRadialGradient(cx - 30, cy - 20, 20, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, C.waterLight);
  g.addColorStop(0.5, C.waterMid);
  g.addColorStop(1, C.waterDeep);
  c.fillStyle = g; ellipseFill(c, cx, cy, rx, ry);
  c.globalAlpha = 0.35; c.fillStyle = C.waterEdge;
  ellipseFill(c, cx + 10, cy + 6, rx * 0.5, ry * 0.5);
  c.globalAlpha = 1;
  return { cx, cy, rx, ry };
}

function drawPondRocks(c, pond) {
  const rocks = [
    [pond.cx - pond.rx * 0.7, pond.cy - pond.ry * 0.65, 14, 7],
    [pond.cx - pond.rx * 0.3, pond.cy - pond.ry * 0.85, 18, 9],
    [pond.cx + pond.rx * 0.2, pond.cy - pond.ry * 0.95, 22, 11],
    [pond.cx + pond.rx * 0.65, pond.cy - pond.ry * 0.6, 16, 8],
    [pond.cx + pond.rx * 0.95, pond.cy + pond.ry * 0.15, 12, 7],
    [pond.cx - pond.rx * 0.92, pond.cy + pond.ry * 0.05, 12, 6],
  ];
  for (const [x, y, w, h] of rocks) {
    c.fillStyle = C.stoneShade; ellipseFill(c, x + 1, y + 1, w * 1.05, h * 1.05);
    const g = c.createRadialGradient(x - w * 0.3, y - h * 0.5, 2, x, y, w);
    g.addColorStop(0, C.stoneLight); g.addColorStop(1, C.stoneDark);
    c.fillStyle = g; ellipseFill(c, x, y, w, h);
    c.fillStyle = 'rgba(40,30,20,0.3)';
    ellipseFill(c, x, y + h * 0.7, w * 0.8, h * 0.25);
  }
}

// BRIDGE — arched red bridge spanning the pond
function drawBridge(c, pond) {
  const startX = pond.cx - 60, startY = pond.cy + pond.ry * 0.7;
  const endX = pond.cx + pond.rx * 0.85, endY = pond.cy - 10;
  const cpX = (startX + endX) / 2 + 10;
  const cpY = (startY + endY) / 2 - 60;
  function bz(t) {
    const u = 1 - t;
    return [u*u*startX + 2*u*t*cpX + t*t*endX,
            u*u*startY + 2*u*t*cpY + t*t*endY];
  }
  function bzD(t) {
    return [2*(1-t)*(cpX - startX) + 2*t*(endX - cpX),
            2*(1-t)*(cpY - startY) + 2*t*(endY - cpY)];
  }

  c.save(); c.filter = 'blur(6px)';
  c.fillStyle = 'rgba(0,0,0,0.25)';
  c.beginPath();
  c.moveTo(startX - 8, startY + 10);
  c.quadraticCurveTo(cpX, cpY + 30, endX + 8, endY + 10);
  c.lineTo(endX + 8, endY + 18);
  c.quadraticCurveTo(cpX, cpY + 38, startX - 8, startY + 18);
  c.closePath(); c.fill();
  c.restore();

  // underside
  c.fillStyle = C.bridgeRedDk;
  c.beginPath();
  c.moveTo(startX, startY);
  c.quadraticCurveTo(cpX, cpY + 5, endX, endY);
  c.lineTo(endX - 2, endY + 7);
  c.quadraticCurveTo(cpX, cpY + 14, startX - 2, startY + 7);
  c.closePath(); c.fill();

  // planks
  for (let t = 0; t <= 1.0; t += 0.05) {
    const p = bz(t), d = bzD(t);
    const L = Math.hypot(d[0], d[1]) || 1;
    const nx = -d[1] / L, ny = d[0] / L;
    const w = 22;
    c.fillStyle = (t * 20 % 2 < 1) ? C.bridgeWood : C.bridgeWoodDk;
    const pp = bz(Math.min(t + 0.05, 1));
    const dd = bzD(Math.min(t + 0.05, 1));
    const LL = Math.hypot(dd[0], dd[1]) || 1;
    const nnx = -dd[1] / LL, nny = dd[0] / LL;
    c.beginPath();
    c.moveTo(p[0] + nx * w / 2, p[1] + ny * w / 2);
    c.lineTo(pp[0] + nnx * w / 2, pp[1] + nny * w / 2);
    c.lineTo(pp[0] - nnx * w / 2, pp[1] - nny * w / 2);
    c.lineTo(p[0] - nx * w / 2, p[1] - ny * w / 2);
    c.closePath(); c.fill();
  }

  // rails on both sides
  for (const side of [1, -1]) {
    const off = side * 14;
    for (let t = 0; t <= 1.0; t += 0.1) {
      const p = bz(t), d = bzD(t);
      const L = Math.hypot(d[0], d[1]) || 1;
      const px = p[0] + (-d[1] / L) * off;
      const py = p[1] + (d[0] / L) * off;
      c.fillStyle = C.bridgeRail; c.fillRect(px - 1.5, py - 12, 3, 12);
      c.fillStyle = C.bridgeRed;  c.fillRect(px - 1.2, py - 12, 1.5, 12);
    }
    c.strokeStyle = C.bridgeRed; c.lineWidth = 3;
    c.beginPath();
    let first = true;
    for (let t = 0; t <= 1.001; t += 0.02) {
      const p = bz(t), d = bzD(t);
      const L = Math.hypot(d[0], d[1]) || 1;
      const px = p[0] + (-d[1] / L) * off;
      const py = p[1] + (d[0] / L) * off - 12;
      if (first) { c.moveTo(px, py); first = false; } else c.lineTo(px, py);
    }
    c.stroke();
    c.strokeStyle = C.bridgeRedLt; c.lineWidth = 1;
    c.beginPath(); first = true;
    for (let t = 0; t <= 1.001; t += 0.02) {
      const p = bz(t), d = bzD(t);
      const L = Math.hypot(d[0], d[1]) || 1;
      const px = p[0] + (-d[1] / L) * off;
      const py = p[1] + (d[0] / L) * off - 13;
      if (first) { c.moveTo(px, py); first = false; } else c.lineTo(px, py);
    }
    c.stroke();
  }

  return { bz, startX, startY, endX, endY };
}

// WATER — ripples, sparkles, surface streaks
function drawWaterDynamic(c, pond, t) {
  c.save();
  c.beginPath();
  c.ellipse(pond.cx, pond.cy, pond.rx, pond.ry, 0, 0, TAU);
  c.clip();

  const ripples = [
    { x: pond.cx - 50, y: pond.cy - 10, period: 4.5, phase: 0 },
    { x: pond.cx + 70, y: pond.cy + 30, period: 6, phase: 1.5 },
    { x: pond.cx + 20, y: pond.cy - 40, period: 5, phase: 3 },
  ];
  c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = 1;
  for (const r of ripples) {
    const tt = ((t + r.phase) % r.period) / r.period;
    const rad = tt * 60;
    c.globalAlpha = (1 - tt) * 0.45;
    c.beginPath(); c.ellipse(r.x, r.y, rad, rad * 0.45, 0, 0, TAU); c.stroke();
    c.beginPath(); c.ellipse(r.x, r.y, rad * 0.6, rad * 0.6 * 0.45, 0, 0, TAU); c.stroke();
  }
  c.globalAlpha = 1;

  c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 1;
  for (let i = 0; i < 7; i++) {
    const y = pond.cy - pond.ry + (i / 6) * pond.ry * 2;
    const phase = i * 0.7 + t * 0.6;
    c.beginPath();
    let first = true;
    for (let x = -pond.rx; x <= pond.rx; x += 4) {
      const yy = y + sin((x + t * 30) * 0.05 + phase) * 1.5;
      if (first) { c.moveTo(pond.cx + x, yy); first = false; }
      else c.lineTo(pond.cx + x, yy);
    }
    c.stroke();
  }

  for (let i = 0; i < 18; i++) {
    const seed = i * 13.7;
    const x = pond.cx + sin(seed + t * 0.3) * pond.rx * 0.85;
    const y = pond.cy + cos(seed * 1.3 + t * 0.2) * pond.ry * 0.85;
    const tw = (sin(t * 3 + seed) + 1) * 0.5;
    if (tw < 0.6) continue;
    c.globalAlpha = tw * 0.9;
    c.fillStyle = '#fff8e0';
    c.beginPath(); c.arc(x, y, 1.2 * tw, 0, TAU); c.fill();
  }
  c.globalAlpha = 0.18;
  c.fillStyle = C.sakMid;
  ellipseFill(c, pond.cx - 60, pond.cy - 20, 50, 12);
  c.globalAlpha = 1;
  c.restore();
}

// KOI — orbiting fish swimming in the pond
function makeKoi(pond) {
  const fishes = [];
  for (let i = 0; i < 6; i++) {
    fishes.push({
      angle: rand(0, TAU),
      speed: rand(0.18, 0.32),
      orbitW: pond.rx * rand(0.55, 0.85),
      orbitH: pond.ry * rand(0.5, 0.8),
      cx: pond.cx + rand(-30, 30),
      cy: pond.cy + rand(-15, 15),
      kind: i % 3,
      size: rand(0.85, 1.2),
      flick: rand(0, TAU),
      depthPhase: rand(0, TAU),
    });
  }
  return fishes;
}

function drawKoi(c, k, t) {
  const a = k.angle + t * k.speed;
  const x = k.cx + cos(a) * k.orbitW;
  const y = k.cy + sin(a) * k.orbitH * 0.55 + sin(a * 2 + k.flick) * 6;
  const heading = Math.atan2(
    -sin(a) * k.orbitH * 0.55 + cos(a * 2 + k.flick) * 12,
    -sin(a) * k.orbitW
  );
  const depth = 0.7 + 0.3 * (sin(t * 0.4 + k.depthPhase) + 1) * 0.5;

  c.save();
  c.translate(x, y);
  c.rotate(heading);
  c.scale(k.size, k.size * 0.85);
  c.globalAlpha = depth;

  c.fillStyle = 'rgba(20,30,50,0.35)';
  ellipseFill(c, 0, 1.5, 14, 5);

  c.fillStyle = C.koiW;
  c.beginPath(); c.ellipse(0, 0, 13, 4.5, 0, 0, TAU); c.fill();

  const flickAng = sin(t * 6 + k.flick) * 0.4;
  c.fillStyle = C.koiW;
  c.beginPath();
  c.moveTo(-12, 0);
  c.lineTo(-19 + cos(flickAng) * 2, -5 + sin(flickAng) * 3);
  c.lineTo(-21, 0);
  c.lineTo(-19 + cos(flickAng) * 2, 5 - sin(flickAng) * 3);
  c.closePath(); c.fill();

  c.fillStyle = C.koiW;
  c.beginPath(); c.ellipse(2, 4, 4, 1.6, -0.4, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(2, -4, 4, 1.6, 0.4, 0, TAU); c.fill();

  c.fillStyle = (k.kind === 2) ? C.koiBk : ((k.kind === 1) ? C.koiRed : C.koiOr);
  if (k.kind === 0) {
    c.beginPath(); c.ellipse(3, -1, 4, 2.3, 0.2, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(-4, 1, 3, 1.8, -0.3, 0, TAU); c.fill();
  } else if (k.kind === 1) {
    c.beginPath(); c.ellipse(2, 0, 5, 2.5, 0, 0, TAU); c.fill();
    c.beginPath(); c.arc(-5, -1, 2, 0, TAU); c.fill();
  } else {
    c.beginPath(); c.ellipse(4, -1, 2, 1.2, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(-3, 1, 2, 1.2, 0, 0, TAU); c.fill();
    c.fillStyle = C.koiOr;
    c.beginPath(); c.ellipse(0, -1, 2, 1.3, 0, 0, TAU); c.fill();
  }

  c.fillStyle = C.koiBk;
  c.beginPath(); c.arc(8, -1.2, 0.7, 0, TAU); c.fill();
  c.restore();
}

// PETALS — falling cherry blossoms
function spawnPetal(initial = false) {
  return {
    x: rand(SCENE_W * 0.05, SCENE_W * 0.95),
    y: initial ? rand(-100, SCENE_H * 0.7) : rand(-120, -20),
    vx: rand(-0.25, 0.25),
    vy: rand(0.4, 0.9),
    rot: rand(0, TAU),
    rotV: rand(-0.04, 0.04),
    swayPhase: rand(0, TAU),
    swayAmp: rand(0.6, 1.6),
    swayFreq: rand(0.6, 1.4),
    size: rand(4, 8),
    color: Math.random() < 0.4 ? C.petalLt : (Math.random() < 0.6 ? C.petal : C.petalDk),
    z: rand(0, 1),
  };
}

function makePetals(n) {
  const arr = [];
  for (let i = 0; i < n; i++) arr.push(spawnPetal(true));
  return arr;
}

function updatePetal(p, t) {
  p.x += p.vx + sin(t * p.swayFreq + p.swayPhase) * p.swayAmp * 0.4;
  p.y += p.vy * (0.6 + p.z * 0.6);
  p.rot += p.rotV;
  if (p.y > SCENE_H * 0.95) {
    Object.assign(p, spawnPetal(false));
  }
}

function drawPetal(c, p) {
  c.save();
  c.translate(p.x, p.y);
  c.rotate(p.rot);
  const s = p.size * (0.7 + p.z * 0.6);
  c.fillStyle = p.color;
  c.beginPath();
  c.moveTo(0, -s);
  c.bezierCurveTo(s * 0.7, -s, s * 0.7, s * 0.4, 0, s * 0.6);
  c.bezierCurveTo(-s * 0.7, s * 0.4, -s * 0.7, -s, 0, -s);
  c.fill();
  c.fillStyle = 'rgba(0,0,0,0.05)';
  c.beginPath();
  c.moveTo(0, s * 0.55);
  c.lineTo(s * 0.12, s * 0.35);
  c.lineTo(0, s * 0.45);
  c.lineTo(-s * 0.12, s * 0.35);
  c.closePath(); c.fill();
  c.restore();
}
// ============================================================================
//  SCENE COMPOSITION & RENDER LOOP
// ============================================================================
function makeLayer() {
  const cv = document.createElement('canvas');
  cv.width = SCENE_W; cv.height = SCENE_H;
  return cv;
}
const LAYER = {
  ground: makeLayer(),
  back:   makeLayer(),
  pagoda: makeLayer(),
  pondL:  makeLayer(),
  front:  makeLayer(),
};
let POND = null, BRIDGE = null, KOI = [];
let PETALS = makePetals(80);

function buildScene() {
  // GROUND
  {
    const c = LAYER.ground.getContext('2d');
    drawIsland(c);
    drawPath(c);
    drawFence(c);
    // stones near pagoda foot
    for (let i = 0; i < 5; i++) {
      const sx = SCENE_W * 0.50 + rand(-25, 25);
      const sy = SCENE_H * 0.62 + 75 + i * 8 + rand(-2, 2);
      c.fillStyle = C.pathLight;
      c.beginPath(); c.ellipse(sx, sy, 11, 5, rand(-0.3, 0.3), 0, TAU); c.fill();
    }
    // ground petals
    for (let i = 0; i < 90; i++) {
      const cx = SCENE_W * 0.50, cy = SCENE_H * 0.62, rx = 460, ry = 250;
      const a = rand(0, TAU), r = Math.sqrt(Math.random()) * 0.95;
      const x = cx + cos(a) * rx * r, y = cy + sin(a) * ry * r;
      c.save();
      c.translate(x, y); c.rotate(rand(0, TAU));
      c.fillStyle = Math.random() < 0.5 ? C.petalLt : C.petal;
      c.globalAlpha = rand(0.6, 0.95);
      const s = rand(2, 3.5);
      c.beginPath();
      c.moveTo(0, -s);
      c.bezierCurveTo(s * 0.7, -s, s * 0.7, s * 0.4, 0, s * 0.6);
      c.bezierCurveTo(-s * 0.7, s * 0.4, -s * 0.7, -s, 0, -s);
      c.fill();
      c.restore();
    }
  }

  // POND LAYER
  {
    const c = LAYER.pondL.getContext('2d');
    POND = drawPond(c);
    drawPondRocks(c, POND);
    KOI = makeKoi(POND);
  }

  // BACK
  {
    const c = LAYER.back.getContext('2d');
    drawBambooGrove(c, SCENE_W * 0.18, SCENE_H * 0.62, 7);
    drawBambooGrove(c, SCENE_W * 0.86, SCENE_H * 0.66, 6);
    drawBush(c, SCENE_W * 0.40, SCENE_H * 0.59, 14, true);
    drawBush(c, SCENE_W * 0.58, SCENE_H * 0.59, 15, true);
    drawBush(c, SCENE_W * 0.62, SCENE_H * 0.61, 12, false);
  }

  // PAGODA + flanking sakura, lanterns, base bushes
  {
    const c = LAYER.pagoda.getContext('2d');
    drawSakura(c, SCENE_W * 0.27, SCENE_H * 0.64, 165, { seed: 7 });
    drawSakura(c, SCENE_W * 0.78, SCENE_H * 0.62, 175, { seed: 31, flip: true });
    drawPagoda(c, SCENE_W * 0.50, SCENE_H * 0.62);
    drawLantern(c, SCENE_W * 0.31, SCENE_H * 0.71, 1.0);
    drawLantern(c, SCENE_W * 0.42, SCENE_H * 0.78, 0.85);
    drawLantern(c, SCENE_W * 0.27, SCENE_H * 0.79, 0.9);
    drawBush(c, SCENE_W * 0.34, SCENE_H * 0.74, 14, false);
    drawBush(c, SCENE_W * 0.39, SCENE_H * 0.76, 12, true);
    drawBush(c, SCENE_W * 0.62, SCENE_H * 0.74, 13, false);
    drawBush(c, SCENE_W * 0.66, SCENE_H * 0.75, 11, true);
    drawBush(c, SCENE_W * 0.45, SCENE_H * 0.81, 10, false);
    drawBush(c, SCENE_W * 0.55, SCENE_H * 0.79, 12, true);
    function smallRock(x, y, w, h) {
      const g = c.createRadialGradient(x - w * 0.3, y - h * 0.5, 1, x, y, w);
      g.addColorStop(0, C.stoneLight); g.addColorStop(1, C.stoneDark);
      c.fillStyle = g; ellipseFill(c, x, y, w, h);
    }
    smallRock(SCENE_W * 0.36, SCENE_H * 0.79, 8, 4);
    smallRock(SCENE_W * 0.41, SCENE_H * 0.80, 6, 3);
    smallRock(SCENE_W * 0.61, SCENE_H * 0.78, 7, 4);
    smallRock(SCENE_W * 0.65, SCENE_H * 0.79, 6, 3);
  }

  // FRONT — bridge + foreground
  {
    const c = LAYER.front.getContext('2d');
    BRIDGE = drawBridge(c, POND);
    drawBush(c, SCENE_W * 0.85, SCENE_H * 0.71, 11, false);
    drawBush(c, SCENE_W * 0.41, SCENE_H * 0.85, 12, true);
    drawBush(c, SCENE_W * 0.18, SCENE_H * 0.79, 10, false);
    drawBambooGrove(c, SCENE_W * 0.92, SCENE_H * 0.74, 4);
    for (let i = 0; i < 30; i++) {
      const x = rand(SCENE_W * 0.4, SCENE_W * 0.8);
      const y = rand(SCENE_H * 0.85, SCENE_H * 0.96);
      c.save();
      c.translate(x, y); c.rotate(rand(0, TAU));
      c.fillStyle = Math.random() < 0.5 ? C.petalLt : C.petal;
      c.globalAlpha = rand(0.7, 1);
      const s = rand(2.5, 4);
      c.beginPath();
      c.moveTo(0, -s);
      c.bezierCurveTo(s * 0.7, -s, s * 0.7, s * 0.4, 0, s * 0.6);
      c.bezierCurveTo(-s * 0.7, s * 0.4, -s * 0.7, -s, 0, -s);
      c.fill();
      c.restore();
    }
  }
}

// CAMERA
const camera = { x: 0, y: 0, zoom: 1 };
function updateCamera(t) {
  const slow = t * 0.06;
  camera.x = sin(slow * 0.7) * 30 + sin(slow * 0.23) * 12;
  camera.y = sin(slow * 0.45) * 18 + cos(slow * 0.31) * 8;
  camera.zoom = 1.05 + sin(slow * 0.5) * 0.07;
}

// STATE
let lastTime = 0, elapsed = 0;
let playing = true, dofOn = true, petalsOn = true;
let firstFrame = true;

function render(t) {
  // SKY
  const skyG = ctx.createLinearGradient(0, 0, 0, viewH);
  skyG.addColorStop(0, C.skyTop);
  skyG.addColorStop(0.6, C.skyMid);
  skyG.addColorStop(1, C.skyBot);
  ctx.fillStyle = skyG;
  ctx.fillRect(0, 0, viewW, viewH);

  // SUN GLOW
  const sun = ctx.createRadialGradient(
    viewW * 0.78, viewH * 0.18, 10,
    viewW * 0.78, viewH * 0.18, viewW * 0.65
  );
  sun.addColorStop(0, 'rgba(255,230,180,0.55)');
  sun.addColorStop(0.4, 'rgba(255,220,160,0.18)');
  sun.addColorStop(1, 'rgba(255,220,160,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(0, 0, viewW, viewH);

  // GOD RAYS
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.10 + 0.02 * sin(t * 0.4);
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * 0.6 + 0.2 + sin(t * 0.05 + i) * 0.02;
    ctx.save();
    ctx.translate(viewW * 0.78, viewH * 0.18);
    ctx.rotate(ang);
    const grd = ctx.createLinearGradient(0, 0, 0, viewH);
    grd.addColorStop(0, 'rgba(255,230,180,0.3)');
    grd.addColorStop(1, 'rgba(255,230,180,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(-12, 0, 24, viewH);
    ctx.restore();
  }
  ctx.restore();

  // SCENE TRANSFORM
  const scale = Math.min(viewW, viewH) / SCENE_W;
  const cx = viewW / 2, cy = viewH / 2;

  function drawLayer(layer, parallax = 1, blur = 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale * camera.zoom, scale * camera.zoom);
    ctx.translate(-camera.x * parallax, -camera.y * parallax);
    ctx.translate(-SCENE_W / 2, -SCENE_H / 2);
    if (blur > 0 && dofOn) ctx.filter = `blur(${blur}px)`;
    ctx.drawImage(layer, 0, 0);
    ctx.restore();
  }

  const pulse = sin(t * 0.15) * 0.5 + 0.5;
  const backBlur = dofOn ? 1.2 : 0;
  const frontBlur = dofOn ? 1.0 + pulse * 0.5 : 0;

  drawLayer(LAYER.ground, 0.85, 0.4);
  drawLayer(LAYER.back, 0.7, backBlur);
  drawLayer(LAYER.pondL, 0.92, 0);

  // ANIMATED WATER + KOI
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale * camera.zoom, scale * camera.zoom);
  ctx.translate(-camera.x * 0.92, -camera.y * 0.92);
  ctx.translate(-SCENE_W / 2, -SCENE_H / 2);
  drawWaterDynamic(ctx, POND, t);
  for (const k of KOI) drawKoi(ctx, k, t);
  ctx.restore();

  // PAGODA
  drawLayer(LAYER.pagoda, 1.0, 0);

  // CHARACTERS — animated breath
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale * camera.zoom, scale * camera.zoom);
  ctx.translate(-camera.x * 1.0, -camera.y * 1.0);
  ctx.translate(-SCENE_W / 2, -SCENE_H / 2);
  const wBob = sin(t * 1.0) * 0.6;
  drawWoman(ctx, SCENE_W * 0.40, SCENE_H * 0.83, wBob);
  if (BRIDGE) {
    const bp = BRIDGE.bz(0.55);
    const mBob = sin(t * 0.9 + 1) * 0.6;
    drawMan(ctx, bp[0] + 4, bp[1] - 14, mBob);
  }
  ctx.restore();

  // FRONT (bridge + foreground bushes)
  drawLayer(LAYER.front, 1.1, frontBlur * 0.4);

  // PETALS — three layers by depth
  if (petalsOn) {
    function drawPetalLayer(parallax, zMin, zMax, blur) {
      ctx.save();
      if (blur > 0) ctx.filter = `blur(${blur}px)`;
      ctx.translate(cx, cy);
      ctx.scale(scale * camera.zoom, scale * camera.zoom);
      ctx.translate(-camera.x * parallax, -camera.y * parallax);
      ctx.translate(-SCENE_W / 2, -SCENE_H / 2);
      for (const p of PETALS) {
        if (p.z >= zMin && p.z < zMax) drawPetal(ctx, p);
      }
      ctx.restore();
    }
    drawPetalLayer(0.85, 0, 0.4, dofOn ? 0.6 : 0);
    drawPetalLayer(1.0, 0.4, 0.75, 0);
    drawPetalLayer(1.1, 0.75, 1.01, dofOn ? 0.8 : 0);
  }

  // ATMOSPHERIC HAZE
  const haze = ctx.createLinearGradient(0, 0, 0, viewH);
  haze.addColorStop(0, 'rgba(255,235,200,0.06)');
  haze.addColorStop(0.5, 'rgba(255,225,180,0.04)');
  haze.addColorStop(1, 'rgba(255,210,160,0.10)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, viewW, viewH);

  // FLOATING DUST
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 30; i++) {
    const seed = i * 7.31;
    const x = (sin(t * 0.05 + seed) * 0.5 + 0.5) * viewW;
    const y = (cos(t * 0.07 + seed * 1.3) * 0.5 + 0.5) * viewH;
    const tw = (sin(t * 0.8 + seed) + 1) * 0.5;
    ctx.globalAlpha = tw * 0.12;
    ctx.fillStyle = '#fff5d8';
    ctx.beginPath();
    ctx.arc(x, y, 1.5 + tw * 1.2, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // VIGNETTE
  const vig = ctx.createRadialGradient(
    viewW / 2, viewH / 2, viewW * 0.3,
    viewW / 2, viewH / 2, viewW * 0.78
  );
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(35,18,8,0.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, viewW, viewH);

  // SUBTLE GRAIN — film texture
  ctx.save();
  ctx.globalAlpha = 0.04;
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < 240; i++) {
    const x = Math.random() * viewW, y = Math.random() * viewH;
    ctx.fillStyle = Math.random() < 0.5 ? '#000' : '#fff';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

// MAIN LOOP
function loop(now) {
  if (!lastTime) lastTime = now;
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  if (playing) {
    elapsed += dt;
    if (petalsOn) for (const p of PETALS) updatePetal(p, elapsed);
  }
  updateCamera(elapsed);
  render(elapsed);
  if (firstFrame) {
    firstFrame = false;
    setTimeout(() => {
      const ld = document.getElementById('loader');
      if (ld) ld.classList.add('gone');
    }, 200);
  }
  requestAnimationFrame(loop);
}

// CONTROLS
document.getElementById('btnPlay').addEventListener('click', (e) => {
  playing = !playing;
  e.target.classList.toggle('on', playing);
  e.target.textContent = playing ? 'PAUSE' : 'PLAY';
});
document.getElementById('btnDof').addEventListener('click', (e) => {
  dofOn = !dofOn;
  e.target.classList.toggle('on', dofOn);
});
document.getElementById('btnPet').addEventListener('click', (e) => {
  petalsOn = !petalsOn;
  e.target.classList.toggle('on', petalsOn);
});
document.getElementById('btnUI').addEventListener('click', (e) => {
  stage.classList.toggle('minimal');
  e.target.classList.toggle('on', !stage.classList.contains('minimal'));
});

// BOOT
buildScene();
requestAnimationFrame(loop);
</script>
</body>
</html>
