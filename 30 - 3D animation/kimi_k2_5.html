<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Garden - Cinematic 3D Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #e8d5e0 0%, #f5e6d8 50%, #d4e5ed 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #5a4a3a;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        #ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #5a4a3a;
            z-index: 10;
            pointer-events: none;
        }
        
        #ui h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        }
        
        #ui p {
            font-size: 0.9rem;
            opacity: 0.7;
            letter-spacing: 0.1em;
        }
        
        #controls-hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #5a4a3a;
            font-size: 0.8rem;
            opacity: 0.6;
            text-align: right;
            z-index: 10;
            pointer-events: none;
        }
        
        #controls-hint span {
            display: block;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="loading">Creating Garden...</div>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>桜の庭</h1>
        <p>Sakura Garden</p>
    </div>
    <div id="controls-hint">
        <span>🖱️ Drag to rotate</span>
        <span>📜 Scroll to zoom</span>
        <span>✨ Auto-cinematic mode</span>
    </div>

    <!-- Three.js and Post Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ============================================
        // SCENE SETUP
        // ============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xe8d5e0, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 25, 35);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        controls.minDistance = 15;
        controls.maxDistance = 80;
        controls.target.set(0, 5, 0);
        
        // ============================================
        // LIGHTING
        // ============================================
        const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.6);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xfff8e7, 1.2);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);
        
        const fillLight = new THREE.DirectionalLight(0xe8d5e0, 0.4);
        fillLight.position.set(-30, 40, -30);
        scene.add(fillLight);
        
        // ============================================
        // MATERIALS
        // ============================================
        const materials = {
            grass: new THREE.MeshStandardMaterial({ 
                color: 0x7a9a6a, 
                roughness: 0.9,
                flatShading: true 
            }),
            stone: new THREE.MeshStandardMaterial({ 
                color: 0x9a9a9a, 
                roughness: 0.8 
            }),
            stoneLight: new THREE.MeshStandardMaterial({ 
                color: 0xc5c5c5, 
                roughness: 0.6 
            }),
            roof: new THREE.MeshStandardMaterial({ 
                color: 0x3a3a3a, 
                roughness: 0.7,
                metalness: 0.1
            }),
            woodRed: new THREE.MeshStandardMaterial({ 
                color: 0xa04545, 
                roughness: 0.6 
            }),
            woodDark: new THREE.MeshStandardMaterial({ 
                color: 0x5a3a2a, 
                roughness: 0.7 
            }),
            wall: new THREE.MeshStandardMaterial({ 
                color: 0xf5f0e8, 
                roughness: 0.5 
            }),
            gold: new THREE.MeshStandardMaterial({ 
                color: 0xffd700, 
                roughness: 0.3,
                metalness: 0.8,
                emissive: 0xffaa00,
                emissiveIntensity: 0.2
            }),
            water: new THREE.MeshPhysicalMaterial({
                color: 0x5a9aaa,
                transmission: 0.6,
                opacity: 0.8,
                metalness: 0.1,
                roughness: 0.1,
                ior: 1.33,
                thickness: 2,
                transparent: true
            }),
            sakura: new THREE.MeshStandardMaterial({
                color: 0xffb7d5,
                roughness: 0.8,
                flatShading: true
            }),
            bamboo: new THREE.MeshStandardMaterial({
                color: 0x7a9a5a,
                roughness: 0.6
            }),
            bush: new THREE.MeshStandardMaterial({
                color: 0x5a8a4a,
                roughness: 0.9
            })
        };
        
        // ============================================
        // GROUND
        // ============================================
        const groundGroup = new THREE.Group();
        
        // Main grass area
        const groundGeometry = new THREE.CylinderGeometry(22, 22, 1, 64);
        const ground = new THREE.Mesh(groundGeometry, materials.grass);
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        groundGroup.add(ground);
        
        // Add some uneven terrain
        for (let i = 0; i < 15; i++) {
            const size = 1 + Math.random() * 2;
            const hill = new THREE.Mesh(
                new THREE.SphereGeometry(size, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
                materials.grass
            );
            const angle = Math.random() * Math.PI * 2;
            const distance = 12 + Math.random() * 8;
            hill.position.set(
                Math.cos(angle) * distance,
                -0.5,
                Math.sin(angle) * distance
            );
            hill.scale.y = 0.3;
            hill.receiveShadow = true;
            groundGroup.add(hill);
        }
        
        scene.add(groundGroup);
        
        // ============================================
        // PAGODA
        // ============================================
        function createPagoda() {
            const pagoda = new THREE.Group();
            
            // Base platform
            const baseGeometry = new THREE.BoxGeometry(10, 1.5, 10);
            const base = new THREE.Mesh(baseGeometry, materials.stone);
            base.position.y = 0.75;
            base.castShadow = true;
            base.receiveShadow = true;
            pagoda.add(base);
            
            // Stairs
            for (let i = 0; i < 5; i++) {
                const step = new THREE.Mesh(
                    new THREE.BoxGeometry(4 - i * 0.3, 0.3, 1),
                    materials.stone
                );
                step.position.set(0, 0.15 + i * 0.3, 5 + i * 0.5);
                step.castShadow = true;
                step.receiveShadow = true;
                pagoda.add(step);
            }
            
            // Create tiers
            const tierConfigs = [
                { y: 1.5, width: 8, height: 4, roofHeight: 2.5 },
                { y: 6, width: 6, height: 3.5, roofHeight: 2 },
                { y: 10, width: 4.5, height: 3, roofHeight: 1.8 }
            ];
            
            tierConfigs.forEach((config, index) => {
                const tier = new THREE.Group();
                
                // Walls
                const wallGeometry = new THREE.BoxGeometry(config.width - 0.5, config.height, config.width - 0.5);
                const walls = new THREE.Mesh(wallGeometry, materials.wall);
                walls.position.y = config.y + config.height / 2;
                walls.castShadow = true;
                walls.receiveShadow = true;
                tier.add(walls);
                
                // Red railings
                const railingHeight = 1;
                const railingGeometry = new THREE.BoxGeometry(config.width, railingHeight, 0.3);
                
                for (let i = 0; i < 4; i++) {
                    const railing = new THREE.Mesh(railingGeometry, materials.woodRed);
                    const angle = (i * Math.PI) / 2;
                    railing.position.y = config.y + railingHeight / 2;
                    railing.rotation.y = angle;
                    railing.position.x = Math.sin(angle) * (config.width / 2 + 0.3);
                    railing.position.z = Math.cos(angle) * (config.width / 2 + 0.3);
                    railing.castShadow = true;
                    tier.add(railing);
                }
                
                // Pillars at corners
                for (let i = 0; i < 4; i++) {
                    const pillar = new THREE.Mesh(
                        new THREE.BoxGeometry(0.4, config.height, 0.4),
                        materials.woodRed
                    );
                    const angle = (i * Math.PI) / 2 + Math.PI / 4;
                    pillar.position.y = config.y + config.height / 2;
                    pillar.position.x = Math.sin(angle) * (config.width / 2 - 0.3);
                    pillar.position.z = Math.cos(angle) * (config.width / 2 - 0.3);
                    pillar.castShadow = true;
                    tier.add(pillar);
                }
                
                // Roof
                const roofGroup = new THREE.Group();
                roofGroup.position.y = config.y + config.height;
                
                // Main roof curve
                const roofGeometry = new THREE.ConeGeometry(config.width * 0.9, config.roofHeight, 4);
                const roof = new THREE.Mesh(roofGeometry, materials.roof);
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                roofGroup.add(roof);
                
                // Roof overhangs (curved edges)
                for (let i = 0; i < 4; i++) {
                    const overhang = new THREE.Mesh(
                        new THREE.BoxGeometry(config.width * 0.7, 0.3, 0.8),
                        materials.roof
                    );
                    const angle = (i * Math.PI) / 2;
                    overhang.rotation.y = angle;
                    overhang.position.x = Math.sin(angle) * config.width * 0.5;
                    overhang.position.z = Math.cos(angle) * config.width * 0.5;
                    overhang.position.y = -config.roofHeight * 0.3;
                    overhang.castShadow = true;
                    roofGroup.add(overhang);
                    
                    // Gold ornament at corner
                    const ornament = new THREE.Mesh(
                        new THREE.SphereGeometry(0.25, 8, 8),
                        materials.gold
                    );
                    ornament.position.x = Math.sin(angle) * config.width * 0.75;
                    ornament.position.z = Math.cos(angle) * config.width * 0.75;
                    ornament.position.y = -config.roofHeight * 0.4;
                    roofGroup.add(ornament);
                }
                
                tier.add(roofGroup);
                pagoda.add(tier);
            });
            
            // Top spire
            const spire = new THREE.Mesh(
                new THREE.ConeGeometry(0.3, 2, 8),
                materials.gold
            );
            spire.position.y = 14.5;
            spire.castShadow = true;
            pagoda.add(spire);
            
            // Spire rings
            for (let i = 0; i < 3; i++) {
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(0.2 + i * 0.1, 0.05, 8, 16),
                    materials.gold
                );
                ring.position.y = 13 + i * 0.5;
                ring.rotation.x = Math.PI / 2;
                pagoda.add(ring);
            }
            
            return pagoda;
        }
        
        const pagoda = createPagoda();
        scene.add(pagoda);
        
        // ============================================
        // KOI POND
        // ============================================
        function createPond() {
            const pond = new THREE.Group();
            
            // Pond shape - irregular
            const pondShape = new THREE.Shape();
            pondShape.moveTo(0, 0);
            
            const pondPoints = [
                [0, 6], [3, 7], [6, 6], [8, 4], [8, 0], 
                [7, -3], [4, -5], [0, -5], [-3, -4], [-5, -2], [-5, 2], [-3, 5]
            ];
            
            pondPoints.forEach((p, i) => {
                if (i === 0) pondShape.moveTo(p[0], p[1]);
                else pondShape.lineTo(p[0], p[1]);
            });
            pondShape.closePath();
            
            const pondGeometry = new THREE.ExtrudeGeometry(pondShape, {
                depth: 1.5,
                bevelEnabled: true,
                bevelThickness: 0.2,
                bevelSize: 0.2,
                bevelSegments: 3
            });
            
            const pondMesh = new THREE.Mesh(pondGeometry, materials.stone);
            pondMesh.rotation.x = -Math.PI / 2;
            pondMesh.position.y = 0.2;
            pondMesh.position.x = 8;
            pondMesh.position.z = 5;
            pondMesh.receiveShadow = true;
            pond.add(pondMesh);
            
            // Water surface
            const waterGeometry = new THREE.ShapeGeometry(pondShape);
            const water = new THREE.Mesh(waterGeometry, materials.water);
            water.rotation.x = -Math.PI / 2;
            water.position.y = 0.8;
            water.position.x = 8;
            water.position.z = 5;
            pond.add(water);
            
            return { group: pond, waterMesh: water };
        }
        
        const pondData = createPond();
        scene.add(pondData.group);
        
        // ============================================
        // KOI FISH
        // ============================================
        const koiFish = [];
        const koiColors = [0xff6b35, 0xffffff, 0xff3333, 0xffaa00, 0x333333];
        
        function createKoi(color, x, z) {
            const koi = new THREE.Group();
            
            // Body
            const bodyGeometry = new THREE.SphereGeometry(0.4, 12, 8);
            bodyGeometry.scale(1, 0.6, 1.8);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.4,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            koi.add(body);
            
            // Tail
            const tailGeometry = new THREE.ConeGeometry(0.3, 0.8, 8);
            tailGeometry.scale(1, 0.2, 1);
            const tail = new THREE.Mesh(tailGeometry, bodyMaterial);
            tail.position.z = 1;
            tail.rotation.x = Math.PI / 2;
            koi.add(tail);
            
            // Fins
            const finGeometry = new THREE.BufferGeometry();
            const finVertices = new Float32Array([
                0, 0, 0,  0.3, 0, 0.2,  0, 0, 0.4,
                0, 0, 0,  -0.3, 0, 0.2,  0, 0, 0.4
            ]);
            finGeometry.setAttribute('position', new THREE.BufferAttribute(finVertices, 3));
            finGeometry.computeVertexNormals();
            
            const leftFin = new THREE.Mesh(finGeometry, bodyMaterial);
            leftFin.position.set(0.3, -0.1, 0.2);
            leftFin.rotation.y = -0.3;
            koi.add(leftFin);
            
            const rightFin = new THREE.Mesh(finGeometry, bodyMaterial);
            rightFin.position.set(-0.3, -0.1, 0.2);
            rightFin.rotation.y = 0.3;
            koi.add(rightFin);
            
            koi.position.set(x, 0.6, z);
            
            return {
                mesh: koi,
                tail: tail,
                leftFin: leftFin,
                rightFin: rightFin,
                angle: Math.random() * Math.PI * 2,
                speed: 0.3 + Math.random() * 0.4,
                centerX: 8,
                centerZ: 5,
                radius: 2 + Math.random() * 2
            };
        }
        
        // Add koi fish
        for (let i = 0; i < 8; i++) {
            const color = koiColors[i % koiColors.length];
            const angle = (i / 8) * Math.PI * 2;
            const x = 8 + Math.cos(angle) * 3;
            const z = 5 + Math.sin(angle) * 2;
            const koi = createKoi(color, x, z);
            koiFish.push(koi);
            scene.add(koi.mesh);
        }
        
        // ============================================
        // RED BRIDGE
        // ============================================
        function createBridge() {
            const bridge = new THREE.Group();
            
            // Bridge deck - arched
            const archPoints = [];
            for (let i = 0; i <= 20; i++) {
                const t = i / 20;
                const x = (t - 0.5) * 6;
                const y = Math.sin(t * Math.PI) * 1.5;
                archPoints.push(new THREE.Vector3(x, y, 0));
            }
            
            const archCurve = new THREE.CatmullRomCurve3(archPoints);
            const deckGeometry = new THREE.TubeGeometry(archCurve, 20, 0.8, 8, false);
            const deck = new THREE.Mesh(deckGeometry, materials.woodRed);
            deck.castShadow = true;
            deck.receiveShadow = true;
            bridge.add(deck);
            
            // Railings
            for (let i = 0; i <= 20; i++) {
                const t = i / 20;
                const point = archCurve.getPoint(t);
                
                // Left railing post
                const leftPost = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, 1.2, 0.15),
                    materials.woodRed
                );
                leftPost.position.set(point.x, point.y + 0.6, 0.6);
                leftPost.castShadow = true;
                bridge.add(leftPost);
                
                // Right railing post
                const rightPost = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, 1.2, 0.15),
                    materials.woodRed
                );
                rightPost.position.set(point.x, point.y + 0.6, -0.6);
                rightPost.castShadow = true;
                bridge.add(rightPost);
            }
            
            // Top rail
            const leftRailCurve = new THREE.CatmullRomCurve3(
                archPoints.map(p => new THREE.Vector3(p.x, p.y + 1.2, 0.6))
            );
            const leftRail = new THREE.Mesh(
                new THREE.TubeGeometry(leftRailCurve, 20, 0.1, 8, false),
                materials.woodRed
            );
            leftRail.castShadow = true;
            bridge.add(leftRail);
            
            const rightRailCurve = new THREE.CatmullRomCurve3(
                archPoints.map(p => new THREE.Vector3(p.x, p.y + 1.2, -0.6))
            );
            const rightRail = new THREE.Mesh(
                new THREE.TubeGeometry(rightRailCurve, 20, 0.1, 8, false),
                materials.woodRed
            );
            rightRail.castShadow = true;
            bridge.add(rightRail);
            
            // Gold ornaments on railings
            [0, 10, 20].forEach(i => {
                const t = i / 20;
                const point = archCurve.getPoint(t);
                
                const ornament = new THREE.Mesh(
                    new THREE.SphereGeometry(0.15, 8, 8),
                    materials.gold
                );
                ornament.position.set(point.x, point.y + 1.3, 0.6);
                bridge.add(ornament);
                
                const ornament2 = new THREE.Mesh(
                    new THREE.SphereGeometry(0.15, 8, 8),
                    materials.gold
                );
                ornament2.position.set(point.x, point.y + 1.3, -0.6);
                bridge.add(ornament2);
            });
            
            bridge.position.set(8, 0.5, 2);
            bridge.rotation.y = Math.PI / 6;
            
            return bridge;
        }
        
        const bridge = createBridge();
        scene.add(bridge);
        
        // ============================================
        // STONE LANTERNS
        // ============================================
        function createLantern(x, z) {
            const lantern = new THREE.Group();
            
            // Base
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 0.4, 1.2),
                materials.stoneLight
            );
            base.position.y = 0.2;
            base.castShadow = true;
            lantern.add(base);
            
            // Pillar
            const pillar = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 2, 0.6),
                materials.stoneLight
            );
            pillar.position.y = 1.4;
            pillar.castShadow = true;
            lantern.add(pillar);
            
            // Light chamber
            const chamber = new THREE.Mesh(
                new THREE.BoxGeometry(1, 0.8, 1),
                materials.stoneLight
            );
            chamber.position.y = 2.6;
            chamber.castShadow = true;
            lantern.add(chamber);
            
            // Roof
            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(1, 0.6, 4),
                materials.stoneLight
            );
            roof.position.y = 3.2;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            lantern.add(roof);
            
            // Top ornament
            const top = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8),
                materials.stoneLight
            );
            top.position.y = 3.6;
            lantern.add(top);
            
            // Inner glow
            const glow = new THREE.PointLight(0xffaa55, 0.5, 5);
            glow.position.y = 2.6;
            lantern.add(glow);
            
            lantern.position.set(x, 0, z);
            return lantern;
        }
        
        // Add lanterns
        scene.add(createLantern(-5, 8));
        scene.add(createLantern(-2, 10));
        scene.add(createLantern(2, 8));
        
        // ============================================
        // CHERRY BLOSSOM TREES
        // ============================================
        const sakuraTrees = [];
        const fallingPetals = [];
        
        function createSakuraTree(x, z, scale = 1) {
            const tree = new THREE.Group();
            
            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.4 * scale, 0.6 * scale, 4 * scale, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({
                color: 0x6a4a3a,
                roughness: 0.9
            });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 2 * scale;
            trunk.castShadow = true;
            tree.add(trunk);
            
            // Main branches
            const branchMaterial = trunkMaterial;
            for (let i = 0; i < 5; i++) {
                const branch = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.15 * scale, 0.25 * scale, 2 * scale, 6),
                    branchMaterial
                );
                const angle = (i / 5) * Math.PI * 2;
                branch.position.y = 3.5 * scale;
                branch.position.x = Math.cos(angle) * 0.8 * scale;
                branch.position.z = Math.sin(angle) * 0.8 * scale;
                branch.rotation.z = Math.cos(angle) * 0.5;
                branch.rotation.x = Math.sin(angle) * 0.5;
                branch.castShadow = true;
                tree.add(branch);
            }
            
            // Foliage - multiple spheres for fluffy look
            const foliageGroup = new THREE.Group();
            foliageGroup.position.y = 5 * scale;
            
            const foliagePositions = [
                [0, 0, 0, 2.5],
                [1.5, 0.5, 0, 1.8],
                [-1.5, 0.3, 0.5, 1.8],
                [0, 0.8, 1.5, 1.8],
                [0.5, -0.3, -1.5, 1.8],
                [-0.8, 0.5, -1, 1.5],
                [1, 0.8, 1, 1.5],
                [-1, -0.2, 0.8, 1.5]
            ];
            
            foliagePositions.forEach(pos => {
                const foliage = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(pos[3] * scale, 1),
                    materials.sakura
                );
                foliage.position.set(pos[0] * scale, pos[1] * scale, pos[2] * scale);
                foliage.castShadow = true;
                foliageGroup.add(foliage);
            });
            
            tree.add(foliageGroup);
            tree.position.set(x, 0, z);
            
            return { mesh: tree, foliage: foliageGroup, x, z, scale };
        }
        
        // Add sakura trees
        sakuraTrees.push(createSakuraTree(-10, -5, 1.2));
        sakuraTrees.push(createSakuraTree(12, -3, 1));
        sakuraTrees.push(createSakuraTree(-8, 8, 0.9));
        
        sakuraTrees.forEach(tree => scene.add(tree.mesh));
        
        // Falling petals particle system
        function createPetal() {
            const petalGeometry = new THREE.PlaneGeometry(0.15, 0.15);
            const petalMaterial = new THREE.MeshBasicMaterial({
                color: 0xffc0d5,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            });
            const petal = new THREE.Mesh(petalGeometry, petalMaterial);
            
            // Random starting position near trees
            const tree = sakuraTrees[Math.floor(Math.random() * sakuraTrees.length)];
            petal.position.set(
                tree.x + (Math.random() - 0.5) * 6,
                5 + Math.random() * 3,
                tree.z + (Math.random() - 0.5) * 6
            );
            
            return {
                mesh: petal,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.03,
                    -0.02 - Math.random() * 0.02,
                    (Math.random() - 0.5) * 0.03
                ),
                rotationSpeed: new THREE.Vector3(
                    Math.random() * 0.05,
                    Math.random() * 0.05,
                    Math.random() * 0.05
                )
            };
        }
        
        // Create initial petals
        for (let i = 0; i < 50; i++) {
            const petal = createPetal();
            fallingPetals.push(petal);
            scene.add(petal.mesh);
        }
        
        // ============================================
        // BAMBOO
        // ============================================
        function createBamboo(x, z) {
            const bamboo = new THREE.Group();
            
            const height = 4 + Math.random() * 2;
            const segments = Math.floor(height / 0.8);
            
            for (let i = 0; i < segments; i++) {
                const segment = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 0.7, 8),
                    materials.bamboo
                );
                segment.position.y = 0.4 + i * 0.8;
                segment.castShadow = true;
                bamboo.add(segment);
                
                // Joint
                const joint = new THREE.Mesh(
                    new THREE.TorusGeometry(0.12, 0.02, 6, 12),
                    new THREE.MeshStandardMaterial({ color: 0x5a7a4a })
                );
                joint.position.y = 0.75 + i * 0.8;
                joint.rotation.x = Math.PI / 2;
                bamboo.add(joint);
            }
            
            // Leaves
            for (let i = 0; i < 8; i++) {
                const leaf = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.4, 0.08),
                    materials.bamboo
                );
                leaf.position.y = 2 + Math.random() * (height - 2);
                leaf.position.x = Math.cos(i * 0.8) * 0.15;
                leaf.position.z = Math.sin(i * 0.8) * 0.15;
                leaf.rotation.y = i * 0.8;
                leaf.rotation.z = 0.3 + Math.random() * 0.3;
                bamboo.add(leaf);
            }
            
            bamboo.position.set(x, 0, z);
            bamboo.rotation.z = (Math.random() - 0.5) * 0.1;
            return bamboo;
        }
        
        // Add bamboo clusters
        for (let i = 0; i < 12; i++) {
            const angle = Math.PI + (i / 12) * Math.PI * 0.5;
            const distance = 14 + Math.random() * 3;
            const x = Math.cos(angle) * distance;
            const z = Math.sin(angle) * distance;
            scene.add(createBamboo(x, z));
        }
        
        // ============================================
        // BUSHES AND ROCKS
        // ============================================
        function createBush(x, z, scale = 1) {
            const bush = new THREE.Group();
            
            const spheres = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < spheres; i++) {
                const sphere = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(0.5 * scale * (0.7 + Math.random() * 0.6), 1),
                    materials.bush
                );
                sphere.position.set(
                    (Math.random() - 0.5) * scale,
                    0.3 * scale + Math.random() * 0.3 * scale,
                    (Math.random() - 0.5) * scale
                );
                sphere.castShadow = true;
                bush.add(sphere);
            }
            
            bush.position.set(x, 0, z);
            return bush;
        }
        
        // Add bushes
        const bushPositions = [
            [-8, -2], [-6, 4], [5, -8], [10, 6], [-12, 2],
            [3, 10], [-4, -8], [12, 2], [-10, -8]
        ];
        bushPositions.forEach(pos => {
            scene.add(createBush(pos[0], pos[1], 0.8 + Math.random() * 0.5));
        });
        
        function createRock(x, z, scale = 1) {
            const rock = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.6 * scale, 0),
                materials.stone
            );
            rock.position.set(x, 0.3 * scale, z);
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            rock.castShadow = true;
            rock.receiveShadow = true;
            return rock;
        }
        
        // Add rocks
        const rockPositions = [
            [-6, 6], [-4, 7], [10, 4], [11, 3], [-9, -3],
            [6, -6], [7, -7], [-11, 5]
        ];
        rockPositions.forEach(pos => {
            scene.add(createRock(pos[0], pos[1], 0.8 + Math.random() * 0.6));
        });
        
        // ============================================
        // STONE PATH
        // ============================================
        function createSteppingStones() {
            const path = new THREE.Group();
            
            const pathPoints = [
                [-8, 8], [-6, 6], [-4, 5], [-2, 4], [0, 3], 
                [2, 2], [4, 1], [5, 0], [5.5, -2]
            ];
            
            pathPoints.forEach((point, i) => {
                const stone = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.6 + Math.random() * 0.3, 0.7 + Math.random() * 0.3, 0.1, 7),
                    materials.stoneLight
                );
                stone.position.set(point[0], 0.05, point[1]);
                stone.rotation.y = Math.random() * Math.PI;
                stone.receiveShadow = true;
                path.add(stone);
            });
            
            return path;
        }
        
        scene.add(createSteppingStones());
        
        // ============================================
        // SIMPLE HUMAN FIGURES
        // ============================================
        function createPerson(x, z, rotation, shirtColor, pantsColor) {
            const person = new THREE.Group();
            
            const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const shirtMaterial = new THREE.MeshStandardMaterial({ color: shirtColor });
            const pantsMaterial = new THREE.MeshStandardMaterial({ color: pantsColor });
            
            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 12, 12),
                skinMaterial
            );
            head.position.y = 1.6;
            head.castShadow = true;
            person.add(head);
            
            // Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.3, 0.7, 8),
                shirtMaterial
            );
            body.position.y = 1.1;
            body.castShadow = true;
            person.add(body);
            
            // Arms
            const leftArm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.08, 0.6, 6),
                shirtMaterial
            );
            leftArm.position.set(0.35, 1.1, 0);
            leftArm.rotation.z = -0.2;
            person.add(leftArm);
            
            const rightArm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.08, 0.6, 6),
                shirtMaterial
            );
            rightArm.position.set(-0.35, 1.1, 0);
            rightArm.rotation.z = 0.2;
            person.add(rightArm);
            
            // Legs
            const leftLeg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 0.7, 6),
                pantsMaterial
            );
            leftLeg.position.set(0.15, 0.35, 0);
            person.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 0.7, 6),
                pantsMaterial
            );
            rightLeg.position.set(-0.15, 0.35, 0);
            person.add(rightLeg);
            
            person.position.set(x, 0, z);
            person.rotation.y = rotation;
            
            return person;
        }
        
        // Add people
        scene.add(createPerson(-4, 5, Math.PI / 4, 0xffffff, 0x3a4a6a)); // Woman in white
        scene.add(createPerson(-2, 4, Math.PI / 3, 0x4a8a4a, 0x2a3a4a)); // Man in green
        scene.add(createPerson(10, 3, -Math.PI / 2, 0x2a4a6a, 0x8a8a8a)); // Man by bridge
        
        // ============================================
        // POST PROCESSING
        // ============================================
        const composer = new THREE.EffectComposer(renderer);
        
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);
        
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.3,  // strength
            0.4,  // radius
            0.85  // threshold
        );
        composer.addPass(bloomPass);
        
        // ============================================
        // CAMERA ANIMATION PATH
        // ============================================
        let cameraTime = 0;
        let autoRotate = true;
        let userInteracted = false;
        
        function getCameraPosition(t) {
            // Cinematic orbit path
            const angle = t * 0.3;
            const height = 15 + Math.sin(t * 0.2) * 8;
            const radius = 35 + Math.sin(t * 0.15) * 10;
            
            return {
                x: Math.cos(angle) * radius,
                y: height,
                z: Math.sin(angle) * radius
            };
        }
        
        // Detect user interaction
        controls.addEventListener('start', () => {
            userInteracted = true;
            autoRotate = false;
        });
        
        // ============================================
        // ANIMATION LOOP
        // ============================================
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Animate koi fish
            koiFish.forEach((koi, i) => {
                koi.angle += koi.speed * delta * 0.3;
                
                const x = koi.centerX + Math.cos(koi.angle) * koi.radius;
                const z = koi.centerZ + Math.sin(koi.angle) * koi.radius * 0.7;
                
                koi.mesh.position.x = x;
                koi.mesh.position.z = z;
                koi.mesh.rotation.y = -koi.angle + Math.PI / 2;
                
                // Animate tail
                koi.tail.rotation.y = Math.sin(time * 5 + i) * 0.3;
                koi.leftFin.rotation.z = Math.sin(time * 4 + i) * 0.2;
                koi.rightFin.rotation.z = -Math.sin(time * 4 + i) * 0.2;
            });
            
            // Animate falling petals
            fallingPetals.forEach(petal => {
                petal.mesh.position.add(petal.velocity);
                petal.mesh.rotation.x += petal.rotationSpeed.x;
                petal.mesh.rotation.y += petal.rotationSpeed.y;
                petal.mesh.rotation.z += petal.rotationSpeed.z;
                
                // Wind effect
                petal.velocity.x += Math.sin(time + petal.mesh.position.y) * 0.0005;
                
                // Reset if falls too low
                if (petal.mesh.position.y < 0) {
                    const tree = sakuraTrees[Math.floor(Math.random() * sakuraTrees.length)];
                    petal.mesh.position.set(
                        tree.x + (Math.random() - 0.5) * 6,
                        5 + Math.random() * 3,
                        tree.z + (Math.random() - 0.5) * 6
                    );
                    petal.velocity.y = -0.02 - Math.random() * 0.02;
                }
            });
            
            // Gentle tree sway
            sakuraTrees.forEach((tree, i) => {
                tree.foliage.rotation.z = Math.sin(time * 0.5 + i) * 0.02;
                tree.foliage.rotation.x = Math.cos(time * 0.4 + i) * 0.015;
            });
            
            // Water ripple effect (subtle scaling)
            pondData.waterMesh.scale.x = 1 + Math.sin(time * 0.8) * 0.005;
            pondData.waterMesh.scale.y = 1 + Math.cos(time * 0.6) * 0.005;
            
            // Auto camera movement
            if (autoRotate && !userInteracted) {
                cameraTime += delta * 0.3;
                const pos = getCameraPosition(cameraTime);
                camera.position.lerp(new THREE.Vector3(pos.x, pos.y, pos.z), 0.02);
                camera.lookAt(0, 5, 0);
            } else {
                controls.update();
            }
            
            composer.render();
        }
        
        // ============================================
        // RESIZE HANDLER
        // ============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 1000);
        
        // Start animation
        animate();
    </script>
</body>
</html>
