<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cherry Blossom Pagoda — Cinematic Garden</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f4ef;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    #hud {
      position: fixed;
      left: 20px;
      bottom: 18px;
      color: #5a5048;
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0.7;
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }
    #title {
      position: fixed;
      top: 22px;
      left: 24px;
      pointer-events: none;
      color: #3d342c;
    }
    #title h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    #title p {
      font-size: 12px;
      opacity: 0.65;
    }
  </style>
</head>
<body>
  <div id="title">
    <h1>Spring Pagoda Garden</h1>
    <p>Drag to look · Scroll to zoom</p>
  </div>
  <div id="hud">Cinematic isometric scene · offline</div>
  <canvas id="c"></canvas>
  <script>
(function () {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  // ---------- Color palette matching the illustration ----------
  const P = {
    grass: "#8fbf5a",
    grassDark: "#6fa043",
    grassLight: "#a8d06e",
    path: "#c5c5c5",
    pathDark: "#a8a8a8",
    pathLight: "#dcdcdc",
    stone: "#b8b8b8",
    stoneDark: "#969696",
    stoneLight: "#d0d0d0",
    roof: "#3a3a42",
    roofLight: "#4e4e58",
    roofEdge: "#2a2a30",
    wood: "#b54a3c",
    woodDark: "#8f382e",
    woodLight: "#c75a4a",
    plaster: "#f3eee4",
    plasterShade: "#e4ddd0",
    base: "#8a8a8a",
    baseDark: "#6e6e6e",
    water: "#5ec4c0",
    waterDeep: "#3aa8a8",
    waterLight: "#7ed4d0",
    bamboo: "#5a9a3a",
    bambooDark: "#3d7a28",
    bambooLight: "#7ab84e",
    cherry: "#f5b8c8",
    cherryDeep: "#e89ab0",
    cherryPale: "#fad0da",
    trunk: "#6b4a32",
    trunkDark: "#4a3220",
    bush: "#3d7a38",
    bushLight: "#4f9448",
    bushDark: "#2d5c2a",
    gold: "#d4a017",
    goldLight: "#f0c040",
    fence: "#b0b0b0",
    petal: "#f7c4d0",
    shadow: "rgba(40,50,30,0.14)",
    white: "#ffffff",
    skin: "#f0c8a8",
    hair: "#2a2420"
  };

  // ---------- Camera / view ----------
  let W = 0, H = 0, dpr = 1;
  let camAngle = -0.52;      // isometric-ish yaw
  let camPitch = 0.55;       // elevation
  let camZoom = 1;
  let targetZoom = 1;
  let camX = 0, camY = 0;    // pan in world xz
  let autoOrbit = true;
  let userControl = 0;
  let time = 0;

  // Interaction
  let dragging = false, lastMX = 0, lastMY = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    lastMX = e.clientX;
    lastMY = e.clientY;
    autoOrbit = false;
    userControl = 4;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastMX;
    const dy = e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;
    camAngle += dx * 0.005;
    camPitch = clamp(camPitch + dy * 0.003, 0.28, 1.1);
    userControl = 4;
  });
  canvas.addEventListener("pointerup", () => { dragging = false; });
  canvas.addEventListener("pointercancel", () => { dragging = false; });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    targetZoom = clamp(targetZoom * (e.deltaY > 0 ? 0.92 : 1.08), 0.55, 1.85);
    autoOrbit = false;
    userControl = 4;
  }, { passive: false });

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) { return t * t * (3 - 2 * t); }

  // ---------- Isometric projection ----------
  // World: x right, y up, z "depth"
  function project(x, y, z) {
    // rotate yaw around Y
    const cos = Math.cos(camAngle), sin = Math.sin(camAngle);
    const rx = (x - camX) * cos - (z - camY) * sin;
    const rz = (x - camX) * sin + (z - camY) * cos;
    // pitch
    const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    const ry = y * cp - rz * sp;
    const depth = y * sp + rz * cp;
    const scale = 38 * camZoom * (1 + depth * 0.002);
    const sx = W * 0.5 + rx * scale;
    const sy = H * 0.52 - ry * scale;
    return { x: sx, y: sy, d: depth, s: scale };
  }

  // Sort key for painter's algorithm
  function depthOf(x, y, z) {
    const cos = Math.cos(camAngle), sin = Math.sin(camAngle);
    const rz = (x - camX) * sin + (z - camY) * cos;
    const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    return y * sp + rz * cp;
  }

  // ---------- Primitives ----------
  function drawEllipse(x, y, rx, ry, fill, stroke, lw) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }

  function poly(pts, fill, stroke, lw) {
    if (pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }

  function box(x, y, z, w, h, d, colors) {
    // colors: { top, left, right, front? }
    const hw = w / 2, hd = d / 2;
    const p = [
      project(x - hw, y, z - hd),
      project(x + hw, y, z - hd),
      project(x + hw, y, z + hd),
      project(x - hw, y, z + hd),
      project(x - hw, y + h, z - hd),
      project(x + hw, y + h, z - hd),
      project(x + hw, y + h, z + hd),
      project(x - hw, y + h, z + hd)
    ];
    // Determine face order by camera
    const faces = [
      { pts: [p[3], p[2], p[6], p[7]], c: colors.left || colors.side, key: depthOf(x, y + h / 2, z + hd) },
      { pts: [p[0], p[3], p[7], p[4]], c: colors.right || colors.side, key: depthOf(x - hw, y + h / 2, z) },
      { pts: [p[1], p[0], p[4], p[5]], c: colors.front || colors.side, key: depthOf(x, y + h / 2, z - hd) },
      { pts: [p[2], p[1], p[5], p[6]], c: colors.back || colors.side, key: depthOf(x + hw, y + h / 2, z) },
      { pts: [p[4], p[5], p[6], p[7]], c: colors.top, key: depthOf(x, y + h, z) + 0.5 }
    ];
    faces.sort((a, b) => a.key - b.key);
    faces.forEach((f) => poly(f.pts, f.c, "rgba(0,0,0,0.06)", 0.5));
    return depthOf(x, y + h / 2, z);
  }

  function cylinder(x, y, z, r, h, topCol, sideCol, segs) {
    segs = segs || 12;
    const top = [], bot = [];
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      const px = x + Math.cos(a) * r;
      const pz = z + Math.sin(a) * r;
      top.push(project(px, y + h, pz));
      bot.push(project(px, y, pz));
    }
    // side quads back-to-front
    const quads = [];
    for (let i = 0; i < segs; i++) {
      const mx = x + Math.cos((i + 0.5) / segs * Math.PI * 2) * r;
      const mz = z + Math.sin((i + 0.5) / segs * Math.PI * 2) * r;
      quads.push({
        pts: [bot[i], bot[i + 1], top[i + 1], top[i]],
        key: depthOf(mx, y + h / 2, mz)
      });
    }
    quads.sort((a, b) => a.key - b.key);
    quads.forEach((q, i) => {
      const shade = 0.85 + 0.15 * (i / quads.length);
      poly(q.pts, shadeColor(sideCol, shade), "rgba(0,0,0,0.05)", 0.4);
    });
    poly(top, topCol, "rgba(0,0,0,0.06)", 0.5);
  }

  function shadeColor(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = clamp(Math.round(r * f), 0, 255);
    g = clamp(Math.round(g * f), 0, 255);
    b = clamp(Math.round(b * f), 0, 255);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function coneRoof(x, y, z, r, h, col, segs) {
    segs = segs || 16;
    const tip = project(x, y + h, z);
    const base = [];
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      base.push(project(x + Math.cos(a) * r, y, z + Math.sin(a) * r));
    }
    const tris = [];
    for (let i = 0; i < segs; i++) {
      const mx = x + Math.cos((i + 0.5) / segs * Math.PI * 2) * r * 0.5;
      const mz = z + Math.sin((i + 0.5) / segs * Math.PI * 2) * r * 0.5;
      tris.push({
        pts: [base[i], base[i + 1], tip],
        key: depthOf(mx, y + h * 0.4, mz)
      });
    }
    tris.sort((a, b) => a.key - b.key);
    tris.forEach((t, i) => {
      const shade = 0.75 + 0.3 * (i / tris.length);
      poly(t.pts, shadeColor(col, shade), "rgba(0,0,0,0.08)", 0.4);
    });
  }

  // Pagoda curved roof as flattened pyramid with flared eaves
  function pagodaRoof(x, y, z, w, d, h, col) {
    const flare = 0.55;
    const hw = w / 2, hd = d / 2;
    const tipY = y + h;
    // bottom eave corners (flared)
    const e = [
      project(x - hw - flare, y, z - hd - flare),
      project(x + hw + flare, y, z - hd - flare),
      project(x + hw + flare, y, z + hd + flare),
      project(x - hw - flare, y, z + hd + flare)
    ];
    // ridge / top smaller
    const tw = w * 0.15, td = d * 0.15;
    const t = [
      project(x - tw, tipY, z - td),
      project(x + tw, tipY, z - td),
      project(x + tw, tipY, z + td),
      project(x - tw, tipY, z + td)
    ];
    // mid ridge for curved look
    const midY = y + h * 0.45;
    const mw = w * 0.55, md = d * 0.55;
    const m = [
      project(x - mw, midY, z - md),
      project(x + mw, midY, z - md),
      project(x + mw, midY, z + md),
      project(x - mw, midY, z + md)
    ];

    const faces = [
      { pts: [e[0], e[1], m[1], m[0]], c: shadeColor(col, 0.95), k: depthOf(x, midY, z - hd) },
      { pts: [e[1], e[2], m[2], m[1]], c: shadeColor(col, 1.05), k: depthOf(x + hw, midY, z) },
      { pts: [e[2], e[3], m[3], m[2]], c: shadeColor(col, 0.85), k: depthOf(x, midY, z + hd) },
      { pts: [e[3], e[0], m[0], m[3]], c: shadeColor(col, 0.9), k: depthOf(x - hw, midY, z) },
      { pts: [m[0], m[1], t[1], t[0]], c: shadeColor(col, 1.0), k: depthOf(x, tipY, z - td) },
      { pts: [m[1], m[2], t[2], t[1]], c: shadeColor(col, 1.1), k: depthOf(x + tw, tipY, z) },
      { pts: [m[2], m[3], t[3], t[2]], c: shadeColor(col, 0.88), k: depthOf(x, tipY, z + td) },
      { pts: [m[3], m[0], t[0], t[3]], c: shadeColor(col, 0.92), k: depthOf(x - tw, tipY, z) }
    ];
    faces.sort((a, b) => a.k - b.k);
    faces.forEach((f) => poly(f.pts, f.c, "rgba(0,0,0,0.1)", 0.6));

    // gold finial base
    const fin = project(x, tipY + 0.15, z);
    drawEllipse(fin.x, fin.y, 4 * camZoom, 2.2 * camZoom, P.gold);
    const tip = project(x, tipY + 0.55, z);
    ctx.beginPath();
    ctx.moveTo(fin.x, fin.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.strokeStyle = P.goldLight;
    ctx.lineWidth = 2.2 * camZoom;
    ctx.lineCap = "round";
    ctx.stroke();
    drawEllipse(tip.x, tip.y, 2.5 * camZoom, 2.5 * camZoom, P.goldLight);
  }

  // ---------- Scene objects as draw commands with depth ----------
  const petals = [];
  for (let i = 0; i < 55; i++) {
    petals.push({
      x: (Math.random() - 0.5) * 22,
      y: Math.random() * 8,
      z: (Math.random() - 0.5) * 22,
      r: 0.08 + Math.random() * 0.12,
      sp: 0.15 + Math.random() * 0.35,
      sway: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      col: Math.random() > 0.5 ? P.petal : P.cherryPale
    });
  }

  const koi = [];
  const koiColors = [
    ["#f5f5f5", "#e05040"],
    ["#f0f0f0", "#f0a020"],
    ["#2a2a2a", "#f5f5f5"],
    ["#e84838", "#ffffff"],
    ["#ffffff", "#e84838"],
    ["#f8f0e0", "#d04030"],
    ["#ffffff", "#2a2a2a"],
    ["#f0c040", "#ffffff"],
    ["#e05040", "#f8f0e0"],
    ["#ffffff", "#e07030"]
  ];
  for (let i = 0; i < 10; i++) {
    koi.push({
      a: Math.random() * Math.PI * 2,
      r: 1.2 + Math.random() * 2.2,
      speed: 0.25 + Math.random() * 0.45,
      phase: Math.random() * Math.PI * 2,
      cx: 3.2 + (Math.random() - 0.5) * 0.8,
      cz: 4.5 + (Math.random() - 0.5) * 1.2,
      colors: koiColors[i % koiColors.length],
      size: 0.28 + Math.random() * 0.12
    });
  }

  // ---------- Draw helpers for organic shapes ----------
  function drawBush(x, y, z, s) {
    const p = project(x, y, z);
    const sc = p.s * 0.028 * s;
    // soft shadow
    drawEllipse(p.x + 2, p.y + sc * 0.9, sc * 1.1, sc * 0.45, P.shadow);
    drawEllipse(p.x, p.y - sc * 0.1, sc, sc * 0.85, P.bushDark);
    drawEllipse(p.x - sc * 0.25, p.y - sc * 0.35, sc * 0.7, sc * 0.65, P.bush);
    drawEllipse(p.x + sc * 0.3, p.y - sc * 0.25, sc * 0.65, sc * 0.6, P.bushLight);
  }

  function drawRock(x, y, z, s, rot) {
    const p0 = project(x, y, z);
    const sc = p0.s * 0.03 * s;
    ctx.save();
    ctx.translate(p0.x, p0.y);
    ctx.rotate(rot || 0);
    drawEllipse(2, 3, sc * 1.1, sc * 0.5, P.shadow);
    ctx.beginPath();
    ctx.moveTo(-sc, 0);
    ctx.quadraticCurveTo(-sc * 1.1, -sc * 0.9, 0, -sc * 1.1);
    ctx.quadraticCurveTo(sc * 1.2, -sc * 0.8, sc * 1.0, 0);
    ctx.quadraticCurveTo(sc * 0.3, sc * 0.35, -sc, 0);
    ctx.fillStyle = P.stone;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.08)";
    ctx.lineWidth = 1;
    ctx.stroke();
    // highlight
    ctx.beginPath();
    ctx.ellipse(-sc * 0.25, -sc * 0.45, sc * 0.35, sc * 0.2, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fill();
    ctx.restore();
  }

  function drawStoneLantern(x, y, z, scale) {
    scale = scale || 1;
    const baseH = 0.15 * scale;
    box(x, y, z, 0.55 * scale, baseH, 0.55 * scale, {
      top: P.stoneLight, side: P.stone, left: P.stoneDark
    });
    cylinder(x, y + baseH, z, 0.18 * scale, 0.7 * scale, P.stoneLight, P.stone, 8);
    // light chamber
    box(x, y + baseH + 0.7 * scale, z, 0.45 * scale, 0.4 * scale, 0.45 * scale, {
      top: P.stoneLight, side: P.stoneLight, left: P.stone
    });
    // roof
    const ry = y + baseH + 1.1 * scale;
    const hw = 0.4 * scale;
    const e = [
      project(x - hw, ry, z - hw),
      project(x + hw, ry, z - hw),
      project(x + hw, ry, z + hw),
      project(x - hw, ry, z + hw)
    ];
    const tip = project(x, ry + 0.35 * scale, z);
    [[0,1],[1,2],[2,3],[3,0]].forEach((pair, i) => {
      poly([e[pair[0]], e[pair[1]], tip], shadeColor(P.stone, 0.9 + i * 0.05), "rgba(0,0,0,0.08)", 0.5);
    });
    // finial
    const f = project(x, ry + 0.42 * scale, z);
    drawEllipse(f.x, f.y, 2.5 * camZoom * scale, 2 * camZoom * scale, P.stoneLight);
  }

  function drawBamboo(x, y, z, h, lean) {
    lean = lean || 0;
    const segs = 5;
    for (let i = 0; i < segs; i++) {
      const t0 = i / segs, t1 = (i + 1) / segs;
      const y0 = y + h * t0, y1 = y + h * t1;
      const x0 = x + lean * t0 * t0, x1 = x + lean * t1 * t1;
      const p0 = project(x0, y0, z);
      const p1 = project(x1, y1, z);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = i % 2 ? P.bamboo : P.bambooDark;
      ctx.lineWidth = (4.5 - i * 0.4) * camZoom;
      ctx.lineCap = "round";
      ctx.stroke();
      // node
      drawEllipse(p1.x, p1.y, 3 * camZoom, 1.5 * camZoom, P.bambooDark);
    }
    // leaves
    for (let i = 0; i < 6; i++) {
      const t = 0.45 + i * 0.09;
      const lx = x + lean * t * t;
      const ly = y + h * t;
      const p = project(lx, ly, z);
      const side = i % 2 === 0 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(
        p.x + side * 14 * camZoom,
        p.y - 8 * camZoom,
        p.x + side * 22 * camZoom,
        p.y + 2 * camZoom
      );
      ctx.quadraticCurveTo(
        p.x + side * 12 * camZoom,
        p.y - 2 * camZoom,
        p.x, p.y
      );
      ctx.fillStyle = i % 2 ? P.bambooLight : P.bamboo;
      ctx.fill();
    }
  }

  function drawCherryTree(x, y, z, scale) {
    scale = scale || 1;
    // trunk
    const pBase = project(x, y, z);
    const pMid = project(x + 0.15 * scale, y + 1.8 * scale, z + 0.1 * scale);
    const pTop = project(x - 0.1 * scale, y + 3.2 * scale, z - 0.15 * scale);
    ctx.beginPath();
    ctx.moveTo(pBase.x, pBase.y);
    ctx.quadraticCurveTo(pMid.x - 8 * camZoom, pMid.y, pTop.x, pTop.y);
    ctx.strokeStyle = P.trunk;
    ctx.lineWidth = 10 * camZoom * scale;
    ctx.lineCap = "round";
    ctx.stroke();
    // branch
    const pB = project(x + 0.9 * scale, y + 2.6 * scale, z + 0.3 * scale);
    ctx.beginPath();
    ctx.moveTo(pMid.x, pMid.y);
    ctx.quadraticCurveTo((pMid.x + pB.x) / 2, pMid.y - 10, pB.x, pB.y);
    ctx.strokeStyle = P.trunkDark;
    ctx.lineWidth = 5 * camZoom * scale;
    ctx.stroke();

    // blossom clusters
    const clusters = [
      [x - 0.8 * scale, y + 3.5 * scale, z - 0.3 * scale, 1.3],
      [x + 0.5 * scale, y + 3.8 * scale, z + 0.2 * scale, 1.5],
      [x + 1.2 * scale, y + 3.0 * scale, z + 0.4 * scale, 1.1],
      [x - 0.2 * scale, y + 4.2 * scale, z + 0.1 * scale, 1.2],
      [x + 0.3 * scale, y + 3.3 * scale, z - 0.6 * scale, 1.0],
      [x - 1.1 * scale, y + 2.9 * scale, z + 0.2 * scale, 0.9]
    ];
    clusters.forEach((c) => {
      const p = project(c[0], c[1], c[2]);
      const sc = p.s * 0.045 * c[3] * scale;
      drawEllipse(p.x + 2, p.y + 4, sc * 1.1, sc * 0.5, P.shadow);
      drawEllipse(p.x, p.y, sc, sc * 0.85, P.cherryDeep);
      drawEllipse(p.x - sc * 0.25, p.y - sc * 0.2, sc * 0.7, sc * 0.65, P.cherry);
      drawEllipse(p.x + sc * 0.3, p.y - sc * 0.15, sc * 0.55, sc * 0.5, P.cherryPale);
      drawEllipse(p.x, p.y + sc * 0.15, sc * 0.5, sc * 0.4, P.cherry);
    });
  }

  function drawPerson(x, y, z, style) {
    // style: { hair, top, bottom, bag? }
    const sc = project(x, y, z).s * 0.028;
    const head = project(x, y + 1.55, z);
    const body = project(x, y + 0.95, z);
    const feet = project(x, y, z);

    // shadow
    drawEllipse(feet.x + 1, feet.y + 2, sc * 0.7, sc * 0.28, P.shadow);

    // legs
    ctx.strokeStyle = style.bottom;
    ctx.lineWidth = sc * 0.28;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(body.x - sc * 0.15, body.y + sc * 0.3);
    ctx.lineTo(feet.x - sc * 0.22, feet.y);
    ctx.moveTo(body.x + sc * 0.15, body.y + sc * 0.3);
    ctx.lineTo(feet.x + sc * 0.22, feet.y);
    ctx.stroke();

    // shoes
    drawEllipse(feet.x - sc * 0.22, feet.y + 1, sc * 0.18, sc * 0.1, P.hair);
    drawEllipse(feet.x + sc * 0.22, feet.y + 1, sc * 0.18, sc * 0.1, P.hair);

    // body
    ctx.beginPath();
    ctx.moveTo(body.x, body.y - sc * 0.55);
    ctx.lineTo(body.x - sc * 0.38, body.y + sc * 0.45);
    ctx.lineTo(body.x + sc * 0.38, body.y + sc * 0.45);
    ctx.closePath();
    ctx.fillStyle = style.top;
    ctx.fill();

    // arms
    ctx.strokeStyle = style.top;
    ctx.lineWidth = sc * 0.22;
    ctx.beginPath();
    ctx.moveTo(body.x - sc * 0.3, body.y - sc * 0.2);
    ctx.lineTo(body.x - sc * 0.55, body.y + sc * 0.35);
    ctx.moveTo(body.x + sc * 0.3, body.y - sc * 0.2);
    ctx.lineTo(body.x + sc * 0.55, body.y + sc * 0.35);
    ctx.stroke();

    // head
    drawEllipse(head.x, head.y, sc * 0.32, sc * 0.35, P.skin);
    // hair
    ctx.beginPath();
    ctx.ellipse(head.x, head.y - sc * 0.08, sc * 0.34, sc * 0.28, 0, Math.PI, 0);
    ctx.fillStyle = style.hair || P.hair;
    ctx.fill();
    if (style.hairStyle === "long") {
      ctx.fillRect(head.x - sc * 0.32, head.y - sc * 0.05, sc * 0.2, sc * 0.45);
      ctx.fillRect(head.x + sc * 0.12, head.y - sc * 0.05, sc * 0.2, sc * 0.45);
    }

    // bag strap
    if (style.bag) {
      ctx.strokeStyle = "#3a3a3a";
      ctx.lineWidth = 1.5 * camZoom;
      ctx.beginPath();
      ctx.moveTo(body.x - sc * 0.2, body.y - sc * 0.4);
      ctx.lineTo(body.x + sc * 0.35, body.y + sc * 0.2);
      ctx.stroke();
    }
  }

  function drawBridge(x, y, z) {
    // arched red bridge
    const steps = 10;
    const span = 3.2;
    const arch = 0.85;
    // deck planks
    for (let i = 0; i < steps; i++) {
      const t0 = i / steps - 0.5;
      const t1 = (i + 1) / steps - 0.5;
      const x0 = x + t0 * span;
      const x1 = x + t1 * span;
      const y0 = y + Math.cos(t0 * Math.PI) * arch * 0.15 + (1 - Math.abs(t0) * 2) * arch * 0.35;
      const y1 = y + Math.cos(t1 * Math.PI) * arch * 0.15 + (1 - Math.abs(t1) * 2) * arch * 0.35;
      // actually use sin arch
      const a0 = Math.sin((t0 + 0.5) * Math.PI) * arch;
      const a1 = Math.sin((t1 + 0.5) * Math.PI) * arch;
      const yy0 = y + a0, yy1 = y + a1;
      const z0 = z, z1 = z;
      const p = [
        project(x0, yy0, z0 - 0.45),
        project(x1, yy1, z1 - 0.45),
        project(x1, yy1, z1 + 0.45),
        project(x0, yy0, z0 + 0.45)
      ];
      poly(p, i % 2 ? "#d4a574" : "#c49564", "rgba(0,0,0,0.08)", 0.5);
    }
    // rails
    for (const side of [-0.5, 0.5]) {
      ctx.beginPath();
      for (let i = 0; i <= 16; i++) {
        const t = i / 16 - 0.5;
        const px = x + t * span;
        const py = y + Math.sin((t + 0.5) * Math.PI) * arch + 0.45;
        const pz = z + side;
        const p = project(px, py, pz);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = P.wood;
      ctx.lineWidth = 4 * camZoom;
      ctx.lineCap = "round";
      ctx.stroke();
      // posts
      for (let i = 0; i <= 4; i++) {
        const t = i / 4 - 0.5;
        const px = x + t * span;
        const py = y + Math.sin((t + 0.5) * Math.PI) * arch;
        const p0 = project(px, py, z + side);
        const p1 = project(px, py + 0.5, z + side);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.strokeStyle = P.woodDark;
        ctx.lineWidth = 3.2 * camZoom;
        ctx.stroke();
      }
    }
    // bridge feet
    box(x - span * 0.48, y - 0.05, z, 0.25, 0.55, 0.9, {
      top: P.woodLight, side: P.wood, left: P.woodDark
    });
    box(x + span * 0.48, y - 0.05, z, 0.25, 0.55, 0.9, {
      top: P.woodLight, side: P.wood, left: P.woodDark
    });
  }

  function drawPond(cx, cz) {
    // figure-8 / kidney shaped pond using multiple ellipses in world then project outline
    const pts = [];
    const n = 48;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      // kidney shape
      const rx = 3.6 + Math.cos(a * 2) * 0.4;
      const rz = 2.4 + Math.sin(a) * 0.3;
      let px = Math.cos(a) * rx;
      let pz = Math.sin(a) * rz;
      // bend
      if (px > 0) pz *= 0.85;
      if (px < -0.5) { px *= 0.9; pz += 0.3; }
      pts.push(project(cx + px, 0.02, cz + pz));
    }
    // shadow rim
    ctx.beginPath();
    ctx.moveTo(pts[0].x + 3, pts[0].y + 4);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + 3, pts[i].y + 4);
    ctx.closePath();
    ctx.fillStyle = "rgba(40,60,40,0.12)";
    ctx.fill();

    // water fill
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    const g = ctx.createLinearGradient(pts[0].x, pts[0].y - 40, pts[0].x, pts[0].y + 80);
    g.addColorStop(0, P.waterLight);
    g.addColorStop(0.5, P.water);
    g.addColorStop(1, P.waterDeep);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // stone rim
    for (let i = 0; i < n; i += 1) {
      const a = (i / n) * Math.PI * 2;
      const rx = 3.75 + Math.cos(a * 2) * 0.4;
      const rz = 2.55 + Math.sin(a) * 0.3;
      let px = Math.cos(a) * rx;
      let pz = Math.sin(a) * rz;
      if (px > 0) pz *= 0.85;
      if (px < -0.5) { px *= 0.9; pz += 0.3; }
      const p = project(cx + px, 0.04, cz + pz);
      drawEllipse(p.x, p.y, 5 * camZoom, 3 * camZoom, i % 2 ? P.stone : P.stoneLight);
    }

    // shimmer
    for (let i = 0; i < 8; i++) {
      const a = time * 0.4 + i * 0.9;
      const px = cx + Math.cos(a) * (1.5 + (i % 3) * 0.5);
      const pz = cz + Math.sin(a * 1.3) * (1.0 + (i % 2) * 0.4);
      const p = project(px, 0.05, pz);
      drawEllipse(p.x, p.y, 10 * camZoom, 3 * camZoom, "rgba(255,255,255," + (0.08 + 0.06 * Math.sin(time * 2 + i)) + ")");
    }
  }

  function drawKoi(k) {
    const ang = k.a + time * k.speed;
    const wobble = Math.sin(time * 3 + k.phase) * 0.15;
    const px = k.cx + Math.cos(ang) * k.r;
    const pz = k.cz + Math.sin(ang) * k.r * 0.65;
    const dir = ang + Math.PI / 2;
    const p = project(px, 0.08, pz);
    const sc = p.s * 0.035 * k.size * 8;

    ctx.save();
    ctx.translate(p.x, p.y);
    // approximate screen heading from world direction
    const p2 = project(px + Math.cos(dir) * 0.3, 0.08, pz + Math.sin(dir) * 0.3);
    const rot = Math.atan2(p2.y - p.y, p2.x - p.x);
    ctx.rotate(rot + wobble * 0.3);

    // body
    ctx.beginPath();
    ctx.ellipse(0, 0, sc * 1.1, sc * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = k.colors[0];
    ctx.fill();
    // spots
    ctx.beginPath();
    ctx.ellipse(-sc * 0.2, -sc * 0.05, sc * 0.35, sc * 0.22, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = k.colors[1];
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sc * 0.35, 0.05 * sc, sc * 0.2, sc * 0.12, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = k.colors[1];
    ctx.globalAlpha = 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;
    // tail
    ctx.beginPath();
    ctx.moveTo(-sc * 1.0, 0);
    ctx.lineTo(-sc * 1.5, -sc * 0.35 + Math.sin(time * 6 + k.phase) * sc * 0.1);
    ctx.lineTo(-sc * 1.5, sc * 0.35 + Math.sin(time * 6 + k.phase) * sc * 0.1);
    ctx.closePath();
    ctx.fillStyle = k.colors[0];
    ctx.fill();
    // eye
    drawEllipse(sc * 0.7, -sc * 0.08, sc * 0.08, sc * 0.08, "#222");

    ctx.restore();
  }

  function drawPath() {
    // winding path from front-left to pagoda stairs
    const pathPts = [];
    const samples = 40;
    for (let i = 0; i <= samples; i++) {
      const t = i / samples;
      // bezier-ish curve
      const x = -5 + t * 5.5 + Math.sin(t * Math.PI) * 1.2;
      const z = 6.5 - t * 7.5 + Math.cos(t * Math.PI * 0.5) * 0.5;
      pathPts.push({ x, z, t });
    }
    // draw path as overlapping stones
    for (let i = 0; i < pathPts.length; i++) {
      const p = pathPts[i];
      const pr = project(p.x, 0.03, p.z);
      const w = 18 * camZoom * (1.1 - p.t * 0.15);
      const h = 10 * camZoom;
      // irregular stones
      for (let s = -2; s <= 2; s++) {
        const ox = s * 7 * camZoom + Math.sin(i * 1.7 + s) * 2;
        const oy = Math.cos(i * 1.3 + s) * 2;
        ctx.beginPath();
        ctx.ellipse(pr.x + ox, pr.y + oy, w * 0.28 + (s % 2), h * 0.55, (i + s) * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = (i + s) % 3 === 0 ? P.pathLight : (i + s) % 3 === 1 ? P.path : P.pathDark;
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.05)";
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  function drawFence() {
    const posts = [];
    // left front fence along path
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      const x = -6.2 + t * 3.5;
      const z = 7.2 - t * 2.5;
      posts.push({ x, z });
    }
    posts.forEach((p, i) => {
      box(p.x, 0, p.z, 0.12, 0.55, 0.12, {
        top: P.stoneLight, side: P.fence, left: P.stoneDark
      });
      if (i < posts.length - 1) {
        const n = posts[i + 1];
        const a = project(p.x, 0.4, p.z);
        const b = project(n.x, 0.4, n.z);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = P.fence;
        ctx.lineWidth = 3 * camZoom;
        ctx.stroke();
        const a2 = project(p.x, 0.22, p.z);
        const b2 = project(n.x, 0.22, n.z);
        ctx.beginPath();
        ctx.moveTo(a2.x, a2.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.stroke();
      }
    });
  }

  function drawPagoda(x, y, z) {
    // stone base
    box(x, y, z, 4.2, 0.9, 4.2, {
      top: P.base, side: P.base, left: P.baseDark
    });
    // foundation ring
    box(x, y + 0.9, z, 4.0, 0.25, 4.0, {
      top: P.stoneLight, side: P.stone, left: P.stoneDark
    });

    // stairs
    for (let i = 0; i < 5; i++) {
      box(x, y + 0.15 + i * 0.18, z + 2.3 - i * 0.15, 1.3 - i * 0.05, 0.18, 0.45, {
        top: P.stoneLight, side: P.stone, left: P.stoneDark
      });
    }

    // levels
    const levels = [
      { y: 1.15, w: 3.4, h: 1.35, roofW: 4.2, roofH: 0.95 },
      { y: 3.35, w: 2.7, h: 1.15, roofW: 3.5, roofH: 0.85 },
      { y: 5.25, w: 2.1, h: 1.05, roofW: 2.9, roofH: 0.8 },
      { y: 7.0, w: 1.5, h: 0.9, roofW: 2.3, roofH: 1.1 }
    ];

    levels.forEach((L, li) => {
      const by = y + L.y;
      // floor deck
      box(x, by, z, L.w + 0.35, 0.12, L.w + 0.35, {
        top: P.woodLight, side: P.wood, left: P.woodDark
      });
      // walls
      box(x, by + 0.12, z, L.w, L.h, L.w, {
        top: P.plaster, side: P.plaster, left: P.plasterShade
      });
      // red frame pillars at corners
      const hw = L.w / 2 - 0.08;
      [[-hw, -hw], [hw, -hw], [-hw, hw], [hw, hw]].forEach((c) => {
        box(x + c[0], by + 0.12, z + c[1], 0.16, L.h, 0.16, {
          top: P.woodLight, side: P.wood, left: P.woodDark
        });
      });
      // railings
      const railY = by + 0.12;
      // front railing opening on ground floor
      for (let side = 0; side < 4; side++) {
        if (li === 0 && side === 0) continue; // front open for stairs
        // simplified: top rail beams
      }
      // windows
      const wy = by + 0.12 + L.h * 0.45;
      const ww = L.w * 0.22, wh = L.h * 0.4;
      // front windows
      box(x - L.w * 0.22, wy - wh / 2, z + L.w / 2 - 0.02, ww, wh, 0.05, {
        top: "#d8d0c0", side: "#c8c0b0", left: "#b8b0a0"
      });
      box(x + L.w * 0.22, wy - wh / 2, z + L.w / 2 - 0.02, ww, wh, 0.05, {
        top: "#d8d0c0", side: "#c8c0b0", left: "#b8b0a0"
      });
      // red beam under roof
      box(x, by + 0.12 + L.h - 0.08, z, L.w + 0.1, 0.14, L.w + 0.1, {
        top: P.woodLight, side: P.wood, left: P.woodDark
      });
      // roof
      pagodaRoof(x, by + 0.12 + L.h, z, L.roofW * 0.72, L.roofW * 0.72, L.roofH, P.roof);
    });

    // balcony rails (simple)
    for (let li = 1; li < 3; li++) {
      const L = levels[li];
      const by = y + L.y + 0.12;
      const hw = L.w / 2 + 0.12;
      [[0, hw], [0, -hw], [hw, 0], [-hw, 0]].forEach((d) => {
        const p1 = project(x + d[0] - (d[0] === 0 ? hw * 0.7 : 0), by + 0.35, z + d[1] - (d[1] === 0 ? hw * 0.7 : 0));
        const p2 = project(x + d[0] + (d[0] === 0 ? hw * 0.7 : 0), by + 0.35, z + d[1] + (d[1] === 0 ? hw * 0.7 : 0));
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = P.wood;
        ctx.lineWidth = 2 * camZoom;
        ctx.stroke();
      });
    }
  }

  function drawIsland() {
    // soft ground ellipse island
    const pts = [];
    const n = 64;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2;
      const r = 11.5 + Math.sin(a * 3) * 0.8 + Math.cos(a * 2) * 0.6;
      pts.push(project(Math.cos(a) * r * 1.05, 0, Math.sin(a) * r * 0.95));
    }
    // drop shadow under island
    ctx.beginPath();
    ctx.moveTo(pts[0].x + 8, pts[0].y + 18);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x + 8, pts[i].y + 18);
    ctx.closePath();
    ctx.fillStyle = "rgba(60,70,50,0.1)";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    const gg = ctx.createRadialGradient(W * 0.5, H * 0.55, 20, W * 0.5, H * 0.5, 280 * camZoom);
    gg.addColorStop(0, P.grassLight);
    gg.addColorStop(0.55, P.grass);
    gg.addColorStop(1, P.grassDark);
    ctx.fillStyle = gg;
    ctx.fill();

    // subtle grass texture dots
    for (let i = 0; i < 80; i++) {
      const a = (i / 80) * Math.PI * 2 + i;
      const r = 2 + (i * 7.3) % 9;
      const p = project(Math.cos(a) * r, 0.02, Math.sin(a) * r * 0.9);
      drawEllipse(p.x, p.y, 2, 1.2, i % 2 ? "rgba(255,255,255,0.06)" : "rgba(40,80,20,0.06)");
    }
  }

  // ---------- Depth of field helper ----------
  // We simulate subtle DOF by drawing a soft vignette and slight blur overlay on far edges
  function applyCinematicPost() {
    // vignette
    const g = ctx.createRadialGradient(W * 0.5, H * 0.48, H * 0.15, W * 0.5, H * 0.5, H * 0.75);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(0.65, "rgba(255,252,245,0)");
    g.addColorStop(1, "rgba(230,220,200,0.35)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft light bloom top
    const g2 = ctx.createRadialGradient(W * 0.55, H * 0.2, 10, W * 0.55, H * 0.25, H * 0.5);
    g2.addColorStop(0, "rgba(255,250,240,0.18)");
    g2.addColorStop(1, "rgba(255,250,240,0)");
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    // subtle film grain (sparse)
    ctx.globalAlpha = 0.03;
    for (let i = 0; i < 120; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      ctx.fillStyle = Math.random() > 0.5 ? "#fff" : "#000";
      ctx.fillRect(x, y, 1.2, 1.2);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Main render ----------
  function render(dt) {
    time += dt;
    camZoom = lerp(camZoom, targetZoom, 0.08);

    if (userControl > 0) {
      userControl -= dt;
      if (userControl <= 0) autoOrbit = true;
    }
    if (autoOrbit && !dragging) {
      camAngle += dt * 0.08;
      // gentle breathing pitch/zoom
      camPitch = lerp(camPitch, 0.55 + Math.sin(time * 0.25) * 0.04, 0.02);
      targetZoom = lerp(targetZoom, 1 + Math.sin(time * 0.15) * 0.06, 0.02);
      camX = Math.sin(time * 0.12) * 0.35;
      camY = Math.cos(time * 0.1) * 0.25;
    }

    // background
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#fbf8f3");
    bg.addColorStop(0.45, "#f3efe8");
    bg.addColorStop(1, "#e8e4dc");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // soft ground shadow disc far
    ctx.fillStyle = "rgba(200,195,185,0.35)";
    ctx.beginPath();
    ctx.ellipse(W * 0.5, H * 0.78, 320 * camZoom, 40 * camZoom, 0, 0, Math.PI * 2);
    ctx.fill();

    // --- Scene (rough painter order) ---
    drawIsland();

    // far bushes / rocks / bamboo / trees (back)
    const decor = [
      { t: "bamboo", x: -7.5, z: -2, h: 4.5, lean: 0.3 },
      { t: "bamboo", x: -8.2, z: -1.2, h: 5.2, lean: -0.2 },
      { t: "bamboo", x: -7.0, z: -0.5, h: 3.8, lean: 0.15 },
      { t: "bamboo", x: 7.5, z: -1.5, h: 4.2, lean: -0.25 },
      { t: "bamboo", x: 8.0, z: -0.3, h: 5.0, lean: 0.2 },
      { t: "bamboo", x: 7.2, z: 0.5, h: 3.6, lean: -0.1 },
      { t: "cherry", x: -5.5, z: -4.5, s: 1.15 },
      { t: "cherry", x: 6.0, z: -3.8, s: 1.05 },
      { t: "bush", x: -4.5, z: -2.5, s: 1.2 },
      { t: "bush", x: -3.2, z: -3.5, s: 0.9 },
      { t: "bush", x: 4.5, z: -2.8, s: 1.1 },
      { t: "bush", x: 3.2, z: -1.5, s: 0.85 },
      { t: "bush", x: -2.0, z: 1.5, s: 0.7 },
      { t: "bush", x: 1.5, z: -0.8, s: 0.75 },
      { t: "bush", x: 5.0, z: 1.2, s: 0.9 },
      { t: "bush", x: -5.5, z: 2.5, s: 0.8 },
      { t: "bush", x: -1.5, z: 4.5, s: 0.65 },
      { t: "rock", x: -6.5, z: 3.5, s: 1.1, rot: 0.3 },
      { t: "rock", x: -7.2, z: 1.5, s: 0.8, rot: -0.4 },
      { t: "rock", x: 6.8, z: 2.0, s: 1.0, rot: 0.5 },
      { t: "rock", x: 5.5, z: -5.0, s: 0.9, rot: 0.2 },
      { t: "rock", x: -3.5, z: -5.5, s: 1.2, rot: -0.2 },
      { t: "lantern", x: -4.2, z: 3.8, s: 1 },
      { t: "lantern", x: -5.5, z: 5.5, s: 0.95 },
      { t: "lantern", x: -1.2, z: 2.2, s: 0.9 },
      { t: "lantern", x: 0.8, z: 5.8, s: 0.75 }
    ];

    // Sort decor by depth
    decor.sort((a, b) => depthOf(a.x, 0, a.z) - depthOf(b.x, 0, b.z));

    // Draw back half decor, then path/pond/pagoda/people, then front
    const midDepth = depthOf(0, 0, 0);

    decor.forEach((d) => {
      if (depthOf(d.x, 0, d.z) < midDepth - 0.5) drawDecor(d);
    });

    drawPath();
    drawFence();
    drawPond(3.2, 4.5);

    // koi
    koi.forEach(drawKoi);

    drawBridge(5.2, 0.05, 5.2);

    // pagoda
    drawPagoda(0, 0, -1.2);

    // remaining decor
    decor.forEach((d) => {
      if (depthOf(d.x, 0, d.z) >= midDepth - 0.5) drawDecor(d);
    });

    // people
    drawPerson(-3.2, 0, 5.2, {
      top: "#f5f5f5", bottom: "#2c3a6e", hair: P.hair, hairStyle: "long", bag: true
    });
    drawPerson(-2.2, 0, 5.0, {
      top: "#3d8b5a", bottom: "#2a2a2a", hair: P.hair
    });
    drawPerson(5.6, 0.35 + Math.sin(time * 0.5) * 0.02, 5.5, {
      top: "#2c3d5a", bottom: "#9a9a8a", hair: P.hair
    });

    // petals
    petals.forEach((p) => {
      p.y -= p.sp * dt;
      p.x += Math.sin(time * 0.8 + p.sway) * dt * 0.4;
      p.z += Math.cos(time * 0.5 + p.sway) * dt * 0.2;
      p.rot += dt * 1.5;
      if (p.y < 0) {
        p.y = 6 + Math.random() * 3;
        p.x = (Math.random() - 0.5) * 18;
        p.z = (Math.random() - 0.5) * 18;
      }
      const pr = project(p.x, p.y, p.z);
      ctx.save();
      ctx.translate(pr.x, pr.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, 4.5 * camZoom * p.r * 8, 2.8 * camZoom * p.r * 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = p.col;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    });

    // ground petals scattered
    for (let i = 0; i < 25; i++) {
      const a = i * 2.3;
      const r = 2 + (i * 3.1) % 8;
      const p = project(Math.cos(a) * r, 0.04, Math.sin(a) * r * 0.9 + 1);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(i * 0.7);
      ctx.beginPath();
      ctx.ellipse(0, 0, 3.5 * camZoom, 2 * camZoom, 0, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? P.petal : P.cherryPale;
      ctx.globalAlpha = 0.75;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    applyCinematicPost();
  }

  function drawDecor(d) {
    if (d.t === "bamboo") drawBamboo(d.x, 0, d.z, d.h, d.lean);
    else if (d.t === "cherry") drawCherryTree(d.x, 0, d.z, d.s);
    else if (d.t === "bush") drawBush(d.x, 0.15, d.z, d.s);
    else if (d.t === "rock") drawRock(d.x, 0, d.z, d.s, d.rot);
    else if (d.t === "lantern") drawStoneLantern(d.x, 0, d.z, d.s);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    render(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
