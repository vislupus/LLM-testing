<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Garden - Cinematic 3D Experience</title>
    <style>
        :root {
            --pagoda-roof: #3a3a4a;
            --pagoda-wall: #f5f5f0;
            --pagoda-wood: #4a3728;
            --pagoda-red: #c41e3a;
            --pagoda-gold: #d4a84b;
            --grass: #4a7c4e;
            --grass-light: #6b9b6a;
            --water: #5a9eb8;
            --water-light: #8bc4d8;
            --stone: #8a8a8a;
            --stone-light: #a8a8a8;
            --bamboo: #5a8a4a;
            --cherry-trunk: #6a4a3a;
            --cherry-blossom: #ffb7c5;
            --cherry-light: #ffd1dc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene-container {
            width: 100vw;
            height: 100vh;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            position: relative;
            overflow: hidden;
        }

        /* Cinematic gradient background */
        .bg-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 30%, rgba(255, 182, 193, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(90, 158, 184, 0.1) 0%, transparent 40%),
                        linear-gradient(180deg, #0a0a15 0%, #1a1a2e 50%, #16213e 100%);
            z-index: 0;
        }

        /* Floating particles (dust motes) */
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 220, 200, 0.4);
            border-radius: 50%;
            animation: float-particle 15s infinite ease-in-out;
        }

        @keyframes float-particle {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
            25% { transform: translateY(-30px) translateX(10px); opacity: 0.6; }
            50% { transform: translateY(-20px) translateX(-5px); opacity: 0.4; }
            75% { transform: translateY(-40px) translateX(15px); opacity: 0.5; }
        }

        /* Main 3D scene */
        .scene {
            position: absolute;
            width: 800px;
            height: 600px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotateX(55deg) rotateZ(0deg);
            transform-style: preserve-3d;
            transition: transform 8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scene:hover {
            transform: translate(-50%, -50%) rotateX(50deg) rotateZ(5deg) scale(1.05);
        }

        /* Ground/Island base */
        .ground {
            position: absolute;
            width: 700px;
            height: 500px;
            left: 50px;
            top: 80px;
            background: linear-gradient(145deg, var(--grass-light) 0%, var(--grass) 50%, #3a6a3e 100%);
            border-radius: 50%;
            transform: translateZ(-20px);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 -5px 20px rgba(0, 0, 0, 0.2);
        }

        .ground::before {
            content: '';
            position: absolute;
            width: 90%;
            height: 90%;
            left: 5%;
            top: 5%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        /* Water pond */
        .pond {
            position: absolute;
            width: 200px;
            height: 120px;
            right: 80px;
            bottom: 60px;
            background: linear-gradient(135deg, var(--water-light) 0%, var(--water) 50%, #4a8aa8 100%);
            border-radius: 50% 60% 55% 45% / 60% 55% 45% 40%;
            transform: translateZ(-5px);
            box-shadow:
                inset 10px 10px 30px rgba(255, 255, 255, 0.3),
                inset -5px -5px 20px rgba(0, 0, 0, 0.2),
                0 10px 30px rgba(90, 158, 184, 0.4);
            overflow: hidden;
        }

        .pond::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                transparent 40%,
                rgba(255, 255, 255, 0.2) 45%,
                transparent 50%);
            animation: water-shimmer 4s infinite;
        }

        @keyframes water-shimmer {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        /* Koi fish */
        .koi {
            position: absolute;
            width: 25px;
            height: 12px;
            border-radius: 50%;
            animation: swim 8s infinite ease-in-out;
        }

        .koi-1 {
            top: 40px;
            left: 50px;
            background: linear-gradient(90deg, #ff6b35 0%, #ff8c42 50%, #ffaa55 100%);
            animation-delay: 0s;
        }

        .koi-1::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            right: -3px;
            top: 2px;
            background: #fff;
            border-radius: 50%;
        }

        .koi-2 {
            top: 60px;
            left: 80px;
            background: linear-gradient(90deg, #f5f5f5 0%, #fff 50%, #f0f0f0 100%);
            animation-delay: -3s;
        }

        .koi-2::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 6px;
            right: -4px;
            top: 3px;
            background: #c41e3a;
            border-radius: 50%;
        }

        .koi-3 {
            top: 30px;
            left: 120px;
            background: linear-gradient(90deg, #2a2a2a 0%, #4a4a4a 50%, #3a3a3a 100%);
            animation-delay: -5s;
        }

        .koi-3::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            right: -2px;
            top: 3px;
            background: #f5f5f5;
            border-radius: 50%;
        }

        @keyframes swim {
            0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
            25% { transform: translateX(40px) translateY(-10px) rotate(5deg); }
            50% { transform: translateX(80px) translateY(5px) rotate(0deg); }
            75% { transform: translateX(40px) translateY(15px) rotate(-5deg); }
        }

        /* Pagoda */
        .pagoda {
            position: absolute;
            left: 300px;
            top: 150px;
            transform-style: preserve-3d;
        }

        .pagoda-level {
            position: relative;
            transform-style: preserve-3d;
        }

        .pagoda-base {
            position: absolute;
            width: 120px;
            height: 100px;
            background: linear-gradient(180deg, #6a6a7a 0%, #4a4a5a 100%);
            left: 0;
            top: 280px;
            transform: skewX(-5deg);
            box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.3);
        }

        .pagoda-wall {
            position: absolute;
            background: linear-gradient(180deg, var(--pagoda-wall) 0%, #e8e8e0 100%);
            left: 10px;
        }

        .pagoda-level-1 {
            width: 140px;
            height: 50px;
            left: -10px;
            top: 230px;
        }

        .pagoda-level-2 {
            width: 110px;
            height: 45px;
            left: 15px;
            top: 170px;
        }

        .pagoda-level-3 {
            width: 80px;
            height: 40px;
            left: 30px;
            top: 115px;
        }

        .pagoda-roof {
            position: absolute;
            background: linear-gradient(180deg, #4a4a5a 0%, var(--pagoda-roof) 50%, #2a2a3a 100%);
            clip-path: polygon(0% 40%, 50% 0%, 100% 40%, 90% 50%, 50% 35%, 10% 50%);
        }

        .roof-1 {
            width: 180px;
            height: 40px;
            left: -30px;
            top: 185px;
            transform: rotateX(10deg);
        }

        .roof-2 {
            width: 150px;
            height: 35px;
            left: -20px;
            top: 125px;
            transform: rotateX(10deg);
        }

        .roof-3 {
            width: 110px;
            height: 30px;
            left: -15px;
            top: 70px;
            transform: rotateX(10deg);
        }

        .roof-top {
            width: 60px;
            height: 50px;
            left: 40px;
            top: 25px;
            background: linear-gradient(180deg, var(--pagoda-gold) 0%, #b8903a 100%);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            box-shadow: 0 0 20px rgba(212, 168, 75, 0.5);
        }

        /* Pagoda details */
        .pagoda-door {
            position: absolute;
            width: 30px;
            height: 45px;
            background: linear-gradient(180deg, var(--pagoda-wood) 0%, #3a2a1a 100%);
            left: 55px;
            top: 235px;
            border: 2px solid #2a1a0a;
            border-radius: 2px;
        }

        .pagoda-door::before {
            content: '';
            position: absolute;
            width: 3px;
            height: 100%;
            left: 50%;
            background: #2a1a0a;
            transform: translateX(-50%);
        }

        .pagoda-railings {
            position: absolute;
            height: 8px;
            background: var(--pagoda-red);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .railing-1 {
            width: 160px;
            left: -20px;
            top: 210px;
        }

        .railing-2 {
            width: 130px;
            left: -5px;
            top: 150px;
        }

        .railing-3 {
            width: 90px;
            left: 25px;
            top: 95px;
        }

        /* Cherry blossom trees */
        .cherry-tree {
            position: absolute;
            transform-style: preserve-3d;
        }

        .tree-1 {
            left: 50px;
            top: 100px;
        }

        .tree-2 {
            right: 50px;
            top: 120px;
        }

        .tree-trunk {
            width: 25px;
            height: 120px;
            background: linear-gradient(90deg, #5a3a2a 0%, var(--cherry-trunk) 50%, #5a3a2a 100%);
            border-radius: 5px;
            position: relative;
            box-shadow: 3px 3px 15px rgba(0, 0, 0, 0.3);
        }

        .tree-canopy {
            position: absolute;
            width: 120px;
            height: 80px;
            left: -47px;
            top: -40px;
            background: radial-gradient(ellipse at center, var(--cherry-light) 0%, var(--cherry-blossom) 50%, #ff9aab 100%);
            border-radius: 50%;
            box-shadow:
                0 10px 30px rgba(255, 183, 197, 0.5),
                inset 0 -10px 30px rgba(255, 150, 170, 0.3);
        }

        .blossom-cluster {
            position: absolute;
            width: 15px;
            height: 15px;
            background: var(--cherry-blossom);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 183, 197, 0.6);
        }

        /* Falling petals */
        .petals-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--cherry-light);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(400px) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Bridge */
        .bridge {
            position: absolute;
            right: 150px;
            bottom: 100px;
            width: 80px;
            height: 30px;
            transform-style: preserve-3d;
        }

        .bridge-arch {
            position: absolute;
            width: 80px;
            height: 40px;
            border: 8px solid var(--pagoda-red);
            border-bottom: none;
            border-radius: 50px 50px 0 0;
            background: transparent;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .bridge-planks {
            position: absolute;
            width: 70px;
            height: 20px;
            left: 5px;
            top: 5px;
            background: repeating-linear-gradient(
                90deg,
                #8b5a2b 0px,
                #8b5a2b 4px,
                #6b4a1b 4px,
                #6b4a1b 5px
            );
            border-radius: 3px;
        }

        /* Stone path */
        .stone-path {
            position: absolute;
            left: 30px;
            bottom: 80px;
            transform-style: preserve-3d;
        }

        .stone {
            position: absolute;
            background: linear-gradient(145deg, var(--stone-light) 0%, var(--stone) 50%, #6a6a6a 100%);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        .stone-1 { width: 40px; height: 25px; left: 0; top: 100px; }
        .stone-2 { width: 35px; height: 22px; left: 50px; top: 85px; }
        .stone-3 { width: 38px; height: 24px; left: 95px; top: 70px; }
        .stone-4 { width: 32px; height: 20px; left: 140px; top: 55px; }
        .stone-5 { width: 36px; height: 23px; left: 180px; top: 40px; }
        .stone-6 { width: 34px; height: 21px; left: 220px; top: 30px; }

        /* Stone lanterns */
        .lantern {
            position: absolute;
            transform-style: preserve-3d;
        }

        .lantern-base {
            position: absolute;
            width: 15px;
            height: 8px;
            background: linear-gradient(180deg, #7a7a8a 0%, #5a5a6a 100%);
            border-radius: 2px;
            top: 50px;
        }

        .lantern-post {
            position: absolute;
            width: 6px;
            height: 40px;
            background: linear-gradient(90deg, #6a6a7a 0%, #8a8a9a 50%, #6a6a7a 100%);
            left: 4px;
            top: 10px;
        }

        .lantern-light {
            position: absolute;
            width: 20px;
            height: 18px;
            background: linear-gradient(180deg, #f5e6d3 0%, #e8d4bc 100%);
            left: -2px;
            top: -5px;
            border-radius: 3px;
            box-shadow: 0 0 15px rgba(255, 220, 180, 0.6);
            animation: glow 3s infinite ease-in-out;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 220, 180, 0.6); }
            50% { box-shadow: 0 0 25px rgba(255, 220, 180, 0.9); }
        }

        .lantern-roof {
            position: absolute;
            width: 28px;
            height: 12px;
            background: linear-gradient(180deg, #4a4a5a 0%, #3a3a4a 100%);
            left: -9px;
            top: -12px;
            clip-path: polygon(0% 50%, 50% 0%, 100% 50%, 90% 100%, 10% 100%);
        }

        .lantern-1 { left: 180px; top: 200px; }
        .lantern-2 { left: 280px; top: 250px; }
        .lantern-3 { left: 60px; top: 280px; }
        .lantern-4 { left: 500px; top: 180px; }

        /* Bamboo */
        .bamboo-cluster {
            position: absolute;
            transform-style: preserve-3d;
        }

        .bamboo-stalk {
            position: absolute;
            width: 8px;
            background: linear-gradient(90deg, #4a7a3a 0%, var(--bamboo) 50%, #3a6a2a 100%);
            border-radius: 2px;
            transform-origin: bottom center;
        }

        .bamboo-leaf {
            position: absolute;
            width: 20px;
            height: 5px;
            background: linear-gradient(90deg, #5a9a4a 0%, #7aba6a 100%);
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
        }

        .bamboo-1 { left: 20px; top: 50px; }
        .bamboo-2 { right: 30px; top: 80px; }

        /* Figures */
        .figure {
            position: absolute;
            transform-style: preserve-3d;
        }

        .figure-body {
            position: absolute;
            border-radius: 5px 5px 0 0;
        }

        .figure-head {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #e8c4a0;
            border-radius: 50%;
            top: -12px;
            left: 4px;
        }

        .figure-legs {
            position: absolute;
            width: 10px;
            height: 20px;
            background: #3a3a4a;
            top: 25px;
            left: 6px;
            border-radius: 0 0 3px 3px;
        }

        .figure-1 {
            left: 80px;
            top: 250px;
        }

        .figure-1 .figure-body {
            width: 20px;
            height: 28px;
            background: linear-gradient(180deg, #f5f5f5 0%, #e0e0e0 100%);
        }

        .figure-1 .figure-skirt {
            position: absolute;
            width: 24px;
            height: 18px;
            background: #2a3a5a;
            top: 28px;
            left: -2px;
            border-radius: 0 0 5px 5px;
        }

        .figure-2 {
            left: 250px;
            top: 200px;
        }

        .figure-2 .figure-body {
            width: 22px;
            height: 30px;
            background: linear-gradient(180deg, #4a8a4a 0%, #3a7a3a 100%);
        }

        .figure-2 .figure-legs {
            background: #3a3a4a;
        }

        .figure-3 {
            right: 180px;
            bottom: 120px;
        }

        .figure-3 .figure-body {
            width: 22px;
            height: 30px;
            background: linear-gradient(180deg, #3a4a6a 0%, #2a3a5a 100%);
        }

        /* Rocks */
        .rock {
            position: absolute;
            background: linear-gradient(145deg, #7a7a8a 0%, #5a5a6a 50%, #4a4a5a 100%);
            border-radius: 40% 60% 50% 50% / 50% 50% 50% 50%;
            box-shadow: 3px 3px 15px rgba(0, 0, 0, 0.2);
        }

        .rock-1 { width: 35px; height: 25px; left: 450px; top: 150px; }
        .rock-2 { width: 28px; height: 20px; left: 480px; top: 170px; }
        .rock-3 { width: 22px; height: 15px; left: 40px; top: 320px; }

        /* Bushes */
        .bush {
            position: absolute;
            width: 40px;
            height: 30px;
            background: radial-gradient(ellipse at center, #5a9a5a 0%, #4a8a4a 50%, #3a7a3a 100%);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .bush-1 { left: 150px; top: 320px; }
        .bush-2 { left: 400px; top: 280px; }
        .bush-3 { right: 80px; top: 250px; }
        .bush-4 { left: 550px; top: 100px; }

        /* Fence */
        .fence {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 150px;
            height: 15px;
            background: repeating-linear-gradient(
                90deg,
                #5a4a3a 0px,
                #5a4a3a 3px,
                #6a5a4a 3px,
                #6a5a4a 5px
            );
            border-radius: 2px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        .fence-post {
            position: absolute;
            width: 5px;
            height: 20px;
            background: #4a3a2a;
            top: -5px;
        }

        /* Depth of field effect */
        .dof-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .dof-layer::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.15) 100%);
        }

        /* Title overlay */
        .title-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 200;
            animation: fade-in 2s ease-out;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .title-overlay h1 {
            font-family: 'Noto Serif', Georgia, serif;
            font-size: 2.5rem;
            color: rgba(255, 220, 200, 0.9);
            text-shadow: 0 0 30px rgba(255, 183, 197, 0.5);
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        .title-overlay p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Control hint */
        .control-hint {
            position: absolute;
            top: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            z-index: 200;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* Loading screen */
        .loading {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #0a0a15;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            font-size: 1.5rem;
            color: rgba(255, 220, 200, 0.8);
            letter-spacing: 5px;
            animation: loading-pulse 1.5s infinite;
        }

        @keyframes loading-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .scene {
                transform: translate(-50%, -50%) rotateX(65deg) scale(0.6);
            }

            .title-overlay h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-text">LOADING</div>
    </div>

    <div class="scene-container">
        <div class="bg-gradient"></div>

        <!-- Floating particles -->
        <div id="particles"></div>

        <div class="scene" id="scene">
            <!-- Ground -->
            <div class="ground"></div>

            <!-- Pond with koi -->
            <div class="pond">
                <div class="koi koi-1"></div>
                <div class="koi koi-2"></div>
                <div class="koi koi-3"></div>
            </div>

            <!-- Bridge -->
            <div class="bridge">
                <div class="bridge-arch">
                    <div class="bridge-planks"></div>
                </div>
            </div>

            <!-- Stone path -->
            <div class="stone-path">
                <div class="stone stone-1"></div>
                <div class="stone stone-2"></div>
                <div class="stone stone-3"></div>
                <div class="stone stone-4"></div>
                <div class="stone stone-5"></div>
                <div class="stone stone-6"></div>
            </div>

            <!-- Pagoda -->
            <div class="pagoda">
                <div class="pagoda-base"></div>

            <!-- Cherry blossom trees -->
            <div class="cherry-tree tree-1">

        <div class="control-hint">Hover to rotate</div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // Create falling cherry blossom petals
        function createPetals() {
            const container = document.getElementById('petals');
            const colors = ['#ffb7c5', '#ffd1dc', '#ffccd5', '#ffe4e9', '#fff0f3'];

            for (let i = 0; i < 50; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.top = -20 + 'px';
                petal.style.background = colors[Math.floor(Math.random() * colors.length)];
                petal.style.width = (6 + Math.random() * 4) + 'px';
                petal.style.height = (6 + Math.random() * 4) + 'px';
                petal.style.animationDuration = (8 + Math.random() * 8) + 's';
                petal.style.animationDelay = Math.random() * 10 + 's';
                petal.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(petal);
            }
        }

        // Subtle camera movement
        function animateCamera() {
            const scene = document.getElementById('scene');
            let angle = 0;
            let isHovering = false;
            let targetAngle = 0;

            scene.addEventListener('mouseenter', () => {
                isHovering = true;
            });

            scene.addEventListener('mouseleave', () => {
                isHovering = false;
            });

            scene.addEventListener('mousemove', (e) => {
                if (isHovering) {
                    const rect = scene.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width;
                    targetAngle = (x - 0.5) * 15;
                }
            });

            function animate() {
                if (!isHovering) {
                    targetAngle = Math.sin(angle * 0.5) * 3;
                }

                const currentTransform = scene.style.transform;
                const rotateZMatch = currentTransform.match(/rotateZ\(([^)]+)\)/);
                const currentAngle = rotateZMatch ? parseFloat(rotateZMatch[1]) : 0;
                const newAngle = currentAngle + (targetAngle - currentAngle) * 0.02;

                scene.style.transform = `translate(-50%, -50%) rotateX(55deg) rotateZ(${newAngle}deg) scale(1)`;

                angle += 0.01;
                requestAnimationFrame(animate);
            }

            animate();
        }

        // Light rays animation
        function createLightRays() {
            const bgGradient = document.querySelector('.bg-gradient');

            function animateRays() {
                const time = Date.now() * 0.001;
                const hue = 30 + Math.sin(time * 0.2) * 10;
                bgGradient.style.background = `
                    radial-gradient(ellipse at 50% 30%, hsla(${hue}, 80%, 85%, 0.15) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 80%, rgba(90, 158, 184, 0.1) 0%, transparent 40%),
                    linear-gradient(180deg, #0a0a15 0%, #1a1a2e 50%, #16213e 100%)
                `;
                requestAnimationFrame(animateRays);
            }

            animateRays();
        }

        // Initialize
        window.addEventListener('load', () => {
            createParticles();
            createPetals();
            animateCamera();
            createLightRays();

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);
        });

        // Add subtle parallax on mouse move for background
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / 50;
            const y = (e.clientY - window.innerHeight / 2) / 50;

            document.querySelectorAll('.particle').forEach((particle, i) => {
                const speed = (i + 1) * 0.5;
                particle.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body>
</html>
