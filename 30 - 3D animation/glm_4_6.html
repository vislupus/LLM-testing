<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic 3D Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            overflow: hidden;
            cursor: crosshair;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease-out;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            color: #fff;
            font-size: 1.2rem;
            margin-top: 20px;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
        }

        .control-btn.active {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-color: transparent;
        }

        .info {
            position: fixed;
            top: 30px;
            left: 30px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }

        .info h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info p {
            font-size: 0.9rem;
            line-height: 1.5;
            opacity: 0.8;
        }

        .fps {
            position: fixed;
            top: 30px;
            right: 30px;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loader"></div>
        <div class="loading-text">INITIALIZING CINEMATIC EXPERIENCE</div>
    </div>

    <div class="info">
        <h2>Cinematic 3D World</h2>
        <p>Click and drag to rotate • Scroll to zoom • Use controls below</p>
    </div>

    <div class="fps" id="fps">FPS: 60</div>

    <div class="controls">
        <button class="control-btn active" id="autoRotate" onclick="toggleAutoRotate()">Auto Rotate</button>
        <button class="control-btn" id="particles" onclick="toggleParticles()">Particles</button>
        <button class="control-btn" id="bloom" onclick="toggleBloom()">Bloom Effect</button>
        <button class="control-btn" id="dof" onclick="toggleDOF()">Depth of Field</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // Three.js inline implementation (simplified for demo)
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // Scene state
        let time = 0;
        let mouseX = width / 2;
        let mouseY = height / 2;
        let autoRotate = true;
        let showParticles = true;
        let showBloom = true;
        let showDOF = true;
        let fps = 60;
        let lastTime = performance.now();
        let frameCount = 0;

        // 3D objects
        const objects = [];
        const particles = [];
        const stars = [];

        // Initialize scene
        function init() {
            // Create stars
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 1000,
                    size: Math.random() * 2,
                    brightness: Math.random()
                });
            }

            // Create floating geometric shapes
            for (let i = 0; i < 5; i++) {
                objects.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 500 - 250,
                    size: 30 + Math.random() * 50,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.02,
                    type: ['cube', 'sphere', 'pyramid'][Math.floor(Math.random() * 3)],
                    color: `hsl(${Math.random() * 60 + 200}, 70%, 60%)`,
                    floatSpeed: Math.random() * 0.5 + 0.5,
                    floatOffset: Math.random() * Math.PI * 2
                });
            }

            // Create particles
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: width / 2,
                    y: height / 2,
                    z: Math.random() * 200 - 100,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    vz: (Math.random() - 0.5) * 2,
                    size: Math.random() * 3 + 1,
                    life: 1,
                    color: `hsl(${Math.random() * 60 + 240}, 100%, 70%)`
                });
            }

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1000);
        }

        // 3D to 2D projection
        function project3D(x, y, z) {
            const fov = 500;
            const scale = fov / (fov + z);
            return {
                x: x * scale + width / 2,
                y: y * scale + height / 2,
                scale: scale
            };
        }

        // Draw 3D shape
        function drawShape(obj) {
            const pos = project3D(obj.x - width/2, obj.y - height/2, obj.z);
            
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(obj.rotation + time * obj.rotationSpeed);
            ctx.scale(pos.scale, pos.scale);

            // Apply depth of field
            if (showDOF) {
                const blur = Math.abs(obj.z) / 100;
                ctx.filter = `blur(${blur}px)`;
            }

            // Apply bloom effect
            if (showBloom) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = obj.color;
            }

            ctx.fillStyle = obj.color;
            ctx.strokeStyle = obj.color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.8;

            const size = obj.size;

            switch(obj.type) {
                case 'cube':
                    // Draw cube faces
                    ctx.beginPath();
                    ctx.rect(-size/2, -size/2, size, size);
                    ctx.stroke();
                    ctx.globalAlpha = 0.3;
                    ctx.fill();
                    
                    // Draw 3D effect
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(-size/2, -size/2);
                    ctx.lineTo(-size/3, -size/3 - size/4);
                    ctx.lineTo(size/3, -size/3 - size/4);
                    ctx.lineTo(size/2, -size/2);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(size/2, -size/2);
                    ctx.lineTo(size/3, -size/3 - size/4);
                    ctx.lineTo(size/3, size/3 - size/4);
                    ctx.lineTo(size/2, size/2);
                    ctx.stroke();
                    break;

                case 'sphere':
                    // Draw sphere with gradient
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size/2);
                    gradient.addColorStop(0, obj.color);
                    gradient.addColorStop(0.5, obj.color);
                    gradient.addColorStop(1, 'rgba(0,0,0,0.5)');
                    ctx.fillStyle = gradient;
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, size/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    break;

                case 'pyramid':
                    // Draw pyramid
                    ctx.beginPath();
                    ctx.moveTo(0, -size/2);
                    ctx.lineTo(-size/2, size/2);
                    ctx.lineTo(size/2, size/2);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.globalAlpha = 0.3;
                    ctx.fill();
                    
                    // Draw 3D effect
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(0, -size/2);
                    ctx.lineTo(size/3, -size/3);
                    ctx.lineTo(size/2, size/2);
                    ctx.stroke();
                    break;
            }

            ctx.restore();
        }

        // Animation loop
        function animate() {
            // Clear canvas with gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0a0a0a');
            gradient.addColorStop(0.5, '#1a1a2e');
            gradient.addColorStop(1, '#0f0f23');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Update and draw stars
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                star.brightness = 0.5 + Math.sin(time * 0.001 + star.x) * 0.5;
                ctx.globalAlpha = star.brightness * 0.8;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Update and draw objects
            objects.forEach(obj => {
                // Floating animation
                obj.y += Math.sin(time * 0.001 * obj.floatSpeed + obj.floatOffset) * 0.5;
                
                // Auto rotation
                if (autoRotate) {
                    const angle = time * 0.0005;
                    const cos = Math.cos(angle);
                    const sin = Math.sin(angle);
                    const newX = obj.x * cos - obj.z * sin;
                    const newZ = obj.x * sin + obj.z * cos;
                    obj.x = newX;
                    obj.z = newZ;
                }

                drawShape(obj);
            });

            // Update and draw particles
            if (showParticles) {
                particles.forEach((particle, index) => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.z += particle.vz;
                    particle.life -= 0.01;

                    if (particle.life <= 0) {
                        // Reset particle
                        particle.x = width / 2;
                        particle.y = height / 2;
                        particle.z = 0;
                        particle.vx = (Math.random() - 0.5) * 2;
                        particle.vy = (Math.random() - 0.5) * 2;
                        particle.vz = (Math.random() - 0.5) * 2;
                        particle.life = 1;
                    }

                    const pos = project3D(particle.x - width/2, particle.y - height/2, particle.z);
                    
                    ctx.globalAlpha = particle.life * 0.6;
                    ctx.fillStyle = particle.color;
                    if (showBloom) {
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = particle.color;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, particle.size * pos.scale, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Reset effects
            ctx.globalAlpha = 1;
            ctx.filter = 'none';
            ctx.shadowBlur = 0;

            // Update time
            time += 16;

            // Calculate FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                document.getElementById('fps').textContent = `FPS: ${fps}`;
            }

            requestAnimationFrame(animate);
        }

        // Event listeners
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            if (!autoRotate) {
                const deltaX = (mouseX - width / 2) * 0.5;
                const deltaY = (mouseY - height / 2) * 0.5;
                
                objects.forEach(obj => {
                    obj.x += deltaX * 0.01;
                    obj.y += deltaY * 0.01;
                });
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoom = e.deltaY > 0 ? 1.1 : 0.9;
            
            objects.forEach(obj => {
                obj.z *= zoom;
            });
        });

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        // Control functions
        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.getElementById('autoRotate').classList.toggle('active');
        }

        function toggleParticles() {
            showParticles = !showParticles;
            document.getElementById('particles').classList.toggle('active');
        }

        function toggleBloom() {
            showBloom = !showBloom;
            document.getElementById('bloom').classList.toggle('active');
        }

        function toggleDOF() {
            showDOF = !showDOF;
            document.getElementById('dof').classList('active');
        }

        // Initialize and start animation
        init();
        animate();
    </script>
</body>
</html>
