<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Garden — Cinematic 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
canvas{display:block;width:100%;height:100%}
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity 1.5s ease;pointer-events:none}
#overlay.fade{opacity:0}
#overlay .loader{text-align:center;color:#e8d5c4}
#overlay .loader h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.4rem,3vw,2.2rem);font-weight:400;letter-spacing:0.15em;margin-bottom:12px;opacity:0.9}
#overlay .loader p{font-family:Georgia,serif;font-size:0.85rem;opacity:0.5;letter-spacing:0.3em;text-transform:uppercase}
#overlay .bar{width:200px;height:2px;background:rgba(255,255,255,0.1);border-radius:1px;margin:20px auto 0;overflow:hidden}
#overlay .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#c9a87c,#e8d5c4);border-radius:1px;transition:width 0.3s}
#ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px;opacity:0;transition:opacity 1s ease 2s}
#ui.show{opacity:1}
#ui button{background:rgba(0,0,0,0.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);font-family:Georgia,serif;font-size:0.78rem;padding:8px 18px;border-radius:20px;cursor:pointer;transition:all 0.3s;letter-spacing:0.05em}
#ui button:hover{background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.25)}
#ui button.active{background:rgba(201,168,124,0.25);border-color:rgba(201,168,124,0.4);color:#e8d5c4}
#title{position:fixed;top:28px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;opacity:0;transition:opacity 1.2s ease 2.5s;pointer-events:none}
#title.show{opacity:1}
#title h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(0.9rem,2vw,1.15rem);font-weight:400;color:rgba(232,213,196,0.7);letter-spacing:0.2em}
#title p{font-family:Georgia,serif;font-size:0.65rem;color:rgba(232,213,196,0.35);letter-spacing:0.35em;text-transform:uppercase;margin-top:4px}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 50%,rgba(10,10,20,0.5) 100%)}
</style>
</head>
<body>
<div id="overlay"><div class="loader"><h1>静寂の庭</h1><p>Garden of Serenity</p><div class="bar"><div class="bar-fill" id="barFill"></div></div></div></div>
<div id="vignette"></div>
<div id="title"><h2>Japanese Garden</h2><p>An Isometric Reverie</p></div>
<div id="ui">
<button id="btnOrbit" class="active" onclick="setMode('orbit')">Orbit</button>
<button id="btnCine" onclick="setMode('cine')">Cinematic</button>
<button id="btnTop" onclick="setMode('top')">Top View</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// GLOBALS
// ============================================================
let scene, camera, renderer, clock;
let cameraMode = 'orbit';
let cameraAngle = 0;
let petals = [];
let kois = [];
let waterMesh;
let loadProgress = 0;

// ============================================================
// INIT
// ============================================================
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdce8f0);
  scene.fog = new THREE.FogExp2(0xdce8f0, 0.008);

  camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 500);
  camera.position.set(28, 22, 28);
  camera.lookAt(0, 3, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();
  setupLights();
  progress(10);
  buildGround();
  progress(20);
  buildPagoda();
  progress(40);
  buildPond();
  progress(50);
  buildBridge();
  progress(55);
  buildCherryTrees();
  progress(65);
  buildBamboo();
  progress(72);
  buildStonePath();
  progress(78);
  buildLanterns();
  progress(82);
  buildPeople();
  progress(88);
  buildKoi();
  progress(92);
  buildFence();
  progress(95);
  initPetals();
  progress(100);

  window.addEventListener('resize', onResize);
  setTimeout(() => {
    document.getElementById('overlay').classList.add('fade');
    document.getElementById('ui').classList.add('show');
    document.getElementById('title').classList.add('show');
  }, 800);
  animate();
}

function progress(v) {
  loadProgress = v;
  document.getElementById('barFill').style.width = v + '%';
}

// ============================================================
// LIGHTS
// ============================================================
function setupLights() {
  const amb = new THREE.AmbientLight(0xb8c8d8, 0.55);
  scene.add(amb);

  const hemi = new THREE.HemisphereLight(0xc8daf0, 0x8b9b6b, 0.45);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
  sun.position.set(15, 25, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -20;
  sun.shadow.camera.right = 20;
  sun.shadow.camera.top = 20;
  sun.shadow.camera.bottom = -20;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 60;
  sun.shadow.bias = -0.001;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0xd0e0f8, 0.3);
  fill.position.set(-10, 12, -8);
  scene.add(fill);

  const warm = new THREE.PointLight(0xffd699, 0.3, 30);
  warm.position.set(0, 8, 0);
  scene.add(warm);
}

// ============================================================
// MATERIALS
// ============================================================
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: opts.rough !== undefined ? opts.rough : 0.75,
    metalness: opts.metal || 0,
    flatShading: opts.flat || false,
    transparent: opts.transparent || false,
    opacity: opts.opacity !== undefined ? opts.opacity : 1,
    side: opts.double ? THREE.DoubleSide : THREE.FrontSide
  });
}

// ============================================================
// GROUND ISLAND
// ============================================================
function buildGround() {
  // Main island - rounded shape
  const shape = new THREE.Shape();
  const R = 14;
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    const r = R + Math.sin(a * 3) * 1.2 + Math.cos(a * 5) * 0.6;
    shape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }

  const extrudeSettings = { depth: 1.8, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.3, bevelSegments: 3 };
  const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, -0.5, 0);

  const grass = mat(0x6b8f4e, { rough: 0.9 });
  const island = new THREE.Mesh(geo, grass);
  island.receiveShadow = true;
  island.castShadow = true;
  scene.add(island);

  // Dirt edge
  const dirtGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.6, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.15, bevelSegments: 2 });
  dirtGeo.rotateX(-Math.PI / 2);
  dirtGeo.translate(0, -1.9, 0);
  const dirt = new THREE.Mesh(dirtGeo, mat(0x8b7355, { rough: 0.95 }));
  dirt.receiveShadow = true;
  scene.add(dirt);

  // Small bushes scattered
  const bushMat = mat(0x3d6b35);
  for (let i = 0; i < 25; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 3 + Math.random() * 9;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    if (Math.abs(x) < 4 && Math.abs(z) < 4) continue; // avoid pagoda area
    const s = 0.25 + Math.random() * 0.45;
    const bush = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), bushMat);
    bush.position.set(x, s * 0.5, z);
    bush.castShadow = true;
    scene.add(bush);
  }
}

// ============================================================
// PAGODA (3-tier)
// ============================================================
function buildPagoda() {
  const pagoda = new THREE.Group();

  const wallMat = mat(0xf5f0e8, { rough: 0.6 });
  const frameMat = mat(0x8b2020, { rough: 0.5 });
  const roofMat = mat(0x3a3a45, { rough: 0.7 });
  const goldMat = mat(0xc9a030, { rough: 0.3, metal: 0.6 });

  const tiers = [
    { y: 0, w: 4.5, h: 3.2, roofW: 6.5, roofH: 1.6 },
    { y: 4.0, w: 3.5, h: 2.8, roofW: 5.2, roofH: 1.4 },
    { y: 7.2, w: 2.8, h: 2.5, roofW: 4.2, roofH: 1.3 }
  ];

  tiers.forEach((t, ti) => {
    // Base/walls
    const base = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.w), wallMat);
    base.position.y = t.y + t.h / 2;
    base.castShadow = true;
    base.receiveShadow = true;
    pagoda.add(base);

    // Red frame (pillars at corners)
    for (let cx = -1; cx <= 1; cx += 2) {
      for (let cz = -1; cz <= 1; cz += 2) {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.18, t.h + 0.2, 0.18), frameMat);
        pillar.position.set(cx * t.w / 2, t.y + t.h / 2, cz * t.w / 2);
        pillar.castShadow = true;
        pagoda.add(pillar);
      }
    }

    // Railing
    if (ti < 2) {
      const railH = 0.5;
      const railY = t.y + t.h;
      for (let side = 0; side < 4; side++) {
        const rGeo = new THREE.BoxGeometry(side % 2 === 0 ? t.w + 0.5 : 0.08, railH, side % 2 === 0 ? 0.08 : t.w + 0.5);
        const rail = new THREE.Mesh(rGeo, frameMat);
        const offset = (t.w + 0.5) / 2;
        if (side === 0) rail.position.set(0, railY + railH / 2, offset);
        else if (side === 1) rail.position.set(0, railY + railH / 2, -offset);
        else if (side === 2) rail.position.set(offset, railY + railH / 2, 0);
        else rail.position.set(-offset, railY + railH / 2, 0);
        pagoda.add(rail);
      }
    }

    // Roof (curved hip roof)
    const roofGroup = new THREE.Group();
    // Main roof slab with slight curve
    const roofPts = [];
    const segments = 6;
    for (let i = 0; i <= segments; i++) {
      const frac = i / segments;
      const x = -t.roofW / 2 + frac * t.roofW;
      const y = -Math.pow(frac - 0.5, 2) * 1.5 + t.roofH;
      roofPts.push(new THREE.Vector2(x, y));
    }
    for (let s = 0; s < 2; s++) {
      const angle = s * Math.PI / 2;
      for (let r = 0; r < 8; r++) {
        const frac = r / 7;
        const w = t.roofW * (1 - frac * 0.5);
        const slab = new THREE.Mesh(
          new THREE.BoxGeometry(w, 0.12, w),
          roofMat
        );
        slab.position.y = t.y + t.h + frac * t.roofH + 0.2;
        slab.castShadow = true;
        roofGroup.add(slab);
      }
    }
    pagoda.add(roofGroup);
  });

  // Spire on top
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.15, 1.5, 8), goldMat);
  spire.position.y = 11.5;
  spire.castShadow = true;
  pagoda.add(spire);

  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), goldMat);
  ball.position.y = 12.4;
  pagoda.add(ball);

  // Steps
  for (let i = 0; i < 4; i++) {
    const step = new THREE.Mesh(
      new THREE.BoxGeometry(2.2 + i * 0.3, 0.25, 0.6),
      mat(0xc8c0b0, { rough: 0.8 })
    );
    step.position.set(0, -0.1 - i * 0.25, 2.5 + i * 0.55);
    step.castShadow = true;
    step.receiveShadow = true;
    pagoda.add(step);
  }

  pagoda.position.set(-1, 0.3, -2);
  scene.add(pagoda);
}

// ============================================================
// KOI POND
// ============================================================
function buildPond() {
  const pondShape = new THREE.Shape();
  // Organic pond shape
  const pts = [];
  for (let i = 0; i <= 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    const rx = 5 + Math.sin(a * 2) * 0.8 + Math.cos(a * 3) * 0.5;
    const ry = 3.5 + Math.sin(a * 3) * 0.6;
    pts.push([Math.cos(a) * rx, Math.sin(a) * ry]);
    pondShape.lineTo(Math.cos(a) * rx, Math.sin(a) * ry);
  }

  // Water surface
  const waterGeo = new THREE.ShapeGeometry(pondShape, 32);
  waterGeo.rotateX(-Math.PI / 2);
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x6bbac8,
    roughness: 0.15,
    metalness: 0.1,
    transparent: true,
    opacity: 0.78
  });
  waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.position.set(4, 0.15, 4);
  waterMesh.receiveShadow = true;
  scene.add(waterMesh);

  // Pond bed
  const bedGeo = new THREE.ShapeGeometry(pondShape, 32);
  bedGeo.rotateX(-Math.PI / 2);
  const bedMat = mat(0x4a7a6a, { rough: 0.9 });
  const bed = new THREE.Mesh(bedGeo, bedMat);
  bed.position.set(4, -0.4, 4);
  scene.add(bed);

  // Stone edge
  const edgeMat = mat(0x9a9590, { rough: 0.85 });
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    const rx = 5.3 + Math.sin(a * 2) * 0.8 + Math.cos(a * 3) * 0.5;
    const ry = 3.8 + Math.sin(a * 3) * 0.6;
    const x = Math.cos(a) * rx + 4;
    const z = Math.sin(a) * ry + 4;
    const s = 0.3 + Math.random() * 0.25;
    const stone = new THREE.Mesh(
      new THREE.SphereGeometry(s, 6, 5),
      edgeMat
    );
    stone.position.set(x, 0.1, z);
    stone.scale.y = 0.5;
    stone.castShadow = true;
    scene.add(stone);
  }

  // Lily pads
  const lilyMat = mat(0x3a7a3a, { rough: 0.8, double: true });
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 1.5 + Math.random() * 2.5;
    const pad = new THREE.Mesh(
      new THREE.CircleGeometry(0.3 + Math.random() * 0.2, 12),
      lilyMat
    );
    pad.rotation.x = -Math.PI / 2;
    pad.position.set(4 + Math.cos(a) * r, 0.18, 4 + Math.sin(a) * r);
    scene.add(pad);
  }
}

// ============================================================
// RED BRIDGE
// ============================================================
function buildBridge() {
  const bridgeGroup = new THREE.Group();
  const redMat = mat(0x9b2a2a, { rough: 0.5 });
  const deckMat = mat(0xa85a3a, { rough: 0.65 });

  // Arch bridge deck
  const deckPts = [];
  for (let i = 0; i <= 16; i++) {
    const t = i / 16;
    const x = -2.5 + t * 5;
    const y = Math.sin(t * Math.PI) * 0.8;
    deckPts.push(new THREE.Vector3(x, y, 0));
  }

  // Deck planks
  for (let i = 0; i < 15; i++) {
    const t = (i + 0.5) / 16;
    const x = -2.5 + t * 5;
    const y = Math.sin(t * Math.PI) * 0.8;
    const plank = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 0.08, 1.8),
      deckMat
    );
    plank.position.set(x, y, 0);
    plank.rotation.z = Math.cos(t * Math.PI) * 0.08;
    plank.castShadow = true;
    bridgeGroup.add(plank);
  }

  // Railings
  for (let side = -1; side <= 1; side += 2) {
    // Posts
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      const x = -2.5 + t * 5;
      const y = Math.sin(t * Math.PI) * 0.8;
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 0.7, 6),
        redMat
      );
      post.position.set(x, y + 0.35, side * 0.8);
      post.castShadow = true;
      bridgeGroup.add(post);
    }
    // Top rail (curved)
    for (let i = 0; i < 8; i++) {
      const t1 = i / 8, t2 = (i + 1) / 8;
      const x1 = -2.5 + t1 * 5, x2 = -2.5 + t2 * 5;
      const y1 = Math.sin(t1 * Math.PI) * 0.8 + 0.7;
      const y2 = Math.sin(t2 * Math.PI) * 0.8 + 0.7;
      const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
      const len = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(len, 0.06, 0.06),
        redMat
      );
      rail.position.set(cx, cy, side * 0.8);
      rail.rotation.z = angle;
      bridgeGroup.add(rail);
    }
  }

  // Structural arches underneath
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 12; i++) {
      const t = (i + 0.5) / 12;
      const x = -2.5 + t * 5;
      const y = Math.sin(t * Math.PI) * 0.8;
      const support = new THREE.Mesh(
        new THREE.CylinderGeometry(0.03, 0.03, y, 4),
        redMat
      );
      support.position.set(x, y / 2, side * 0.6);
      bridgeGroup.add(support);
    }
  }

  bridgeGroup.position.set(9, 0.15, 4.5);
  bridgeGroup.rotation.y = -0.3;
  scene.add(bridgeGroup);
}

// ============================================================
// CHERRY BLOSSOM TREES
// ============================================================
function buildCherryTrees() {
  const treePositions = [
    { x: -6, z: -6, s: 1.1 },
    { x: -7, z: 2, s: 0.95 },
    { x: 4, z: -7, s: 1 },
    { x: 7, z: -5, s: 0.85 }
  ];

  treePositions.forEach(tp => {
    buildCherryTree(tp.x, tp.z, tp.s);
  });
}

function buildCherryTree(px, pz, scale) {
  const tree = new THREE.Group();

  // Trunk
  const trunkMat = mat(0x5a3a2a, { rough: 0.9 });

  // Main trunk
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.25, 3, 8),
    trunkMat
  );
  trunk.position.y = 1.5;
  trunk.castShadow = true;
  tree.add(trunk);

  // Branches
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + Math.random() * 0.5;
    const len = 1.2 + Math.random() * 1;
    const brGeo = new THREE.CylinderGeometry(0.04, 0.08, len, 5);
    const br = new THREE.Mesh(brGeo, trunkMat);
    const bh = 2.2 + Math.random() * 1.2;
    br.position.set(Math.cos(a) * len * 0.4, bh, Math.sin(a) * len * 0.4);
    br.rotation.z = Math.cos(a) * 0.6;
    br.rotation.x = Math.sin(a) * 0.6;
    br.castShadow = true;
    tree.add(br);
  }

  // Blossom canopy (multiple pink spheres)
  const blossomColors = [0xf8c8d0, 0xf0b0c0, 0xfcd6de, 0xf5a0b5, 0xffe0e8];
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.5 + Math.random() * 2;
    const h = 3 + Math.random() * 2;
    const s = 0.4 + Math.random() * 0.6;
    const blossom = new THREE.Mesh(
      new THREE.SphereGeometry(s, 7, 5),
      mat(blossomColors[i % blossomColors.length], { rough: 0.8 })
    );
    blossom.position.set(Math.cos(a) * r, h, Math.sin(a) * r);
    blossom.castShadow = true;
    tree.add(blossom);
  }

  tree.scale.setScalar(scale);
  tree.position.set(px, 0.2, pz);
  scene.add(tree);
}

// ============================================================
// BAMBOO
// ============================================================
function buildBamboo() {
  const positions = [
    { x: -9, z: -2, count: 12 },
    { x: -10, z: 3, count: 8 },
    { x: 8, z: -3, count: 6 },
    { x: 9, z: -6, count: 7 }
  ];

  const stalkMat = mat(0x7da85a, { rough: 0.6 });
  const leafMat = mat(0x5a9040, { rough: 0.8, double: true });

  positions.forEach(p => {
    for (let i = 0; i < p.count; i++) {
      const x = p.x + (Math.random() - 0.5) * 2;
      const z = p.z + (Math.random() - 0.5) * 2;
      const h = 3 + Math.random() * 4;

      // Stalk
      const stalk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.08, h, 6),
        stalkMat
      );
      stalk.position.set(x, h / 2, z);
      stalk.castShadow = true;
      scene.add(stalk);

      // Nodes
      for (let n = 0; n < 4; n++) {
        const node = new THREE.Mesh(
          new THREE.CylinderGeometry(0.09, 0.09, 0.05, 6),
          stalkMat
        );
        node.position.set(x, 0.8 + n * h / 4, z);
        scene.add(node);
      }

      // Leaves at top
      for (let l = 0; l < 3; l++) {
        const la = Math.random() * Math.PI * 2;
        const leaf = new THREE.Mesh(
          new THREE.PlaneGeometry(0.6, 0.12),
          leafMat
        );
        leaf.position.set(x + Math.cos(la) * 0.3, h - 0.3 + l * 0.2, z + Math.sin(la) * 0.3);
        leaf.rotation.set(Math.random() * 0.5, la, Math.random() * 0.5 - 0.25);
        scene.add(leaf);
      }
    }
  });
}

// ============================================================
// STONE PATH
// ============================================================
function buildStonePath() {
  const pathMat = mat(0xb0a898, { rough: 0.85 });
  const pathMat2 = mat(0xc8c0b0, { rough: 0.9 });

  // Winding path from steps to pond
  for (let i = 0; i < 40; i++) {
    const t = i / 39;
    const x = -1 + t * 6 + Math.sin(t * 4) * 1.5;
    const z = 2 + t * 3 + Math.cos(t * 3) * 1;
    const s = 0.25 + Math.random() * 0.35;
    const stone = new THREE.Mesh(
      new THREE.CylinderGeometry(s, s * 1.1, 0.12, 7),
      Math.random() > 0.5 ? pathMat : pathMat2
    );
    stone.position.set(x, 0.06, z);
    stone.rotation.y = Math.random() * Math.PI;
    stone.receiveShadow = true;
    stone.castShadow = true;
    scene.add(stone);
  }

  // Scattered petals on ground
  const petalMat = mat(0xfcd6de, { rough: 0.7, double: true });
  for (let i = 0; i < 50; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 2 + Math.random() * 10;
    const petal = new THREE.Mesh(
      new THREE.CircleGeometry(0.06, 5),
      petalMat
    );
    petal.position.set(Math.cos(a) * r, 0.22, Math.sin(a) * r);
    petal.rotation.x = -Math.PI / 2 + Math.random() * 0.3;
    petal.rotation.z = Math.random() * Math.PI;
    scene.add(petal);
  }
}

// ============================================================
// STONE LANTERNS (Tōrō)
// ============================================================
function buildLanterns() {
  const stoneMat = mat(0xa8a098, { rough: 0.8 });
  const lanternPositions = [
    { x: -4, z: 1 },
    { x: -3, z: -4 },
    { x: 2, z: 2 },
    { x: -5, z: 4 }
  ];

  lanternPositions.forEach(lp => {
    const lantern = new THREE.Group();

    // Base
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.6), stoneMat);
    base.position.set(0, 0.1, 0);
    lantern.add(base);

    // Pillar
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 1.0, 6), stoneMat);
    pillar.position.set(0, 0.7, 0);
    lantern.add(pillar);

    // Light box
    const lightBox = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), mat(0xd0c8b8, { rough: 0.6 }));
    lightBox.position.y = 1.4;
    lantern.add(lightBox);

    // Roof cap
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.35, 4), stoneMat);
    cap.position.y = 1.8;
    cap.rotation.y = Math.PI / 4;
    lantern.add(cap);

    // Warm glow
    const glow = new THREE.PointLight(0xffa040, 0.25, 3);
    glow.position.y = 1.4;
    lantern.add(glow);

    lantern.position.set(lp.x, 0.15, lp.z);
    lantern.castShadow = true;
    scene.add(lantern);
  });
}

// ============================================================
// PEOPLE
// ============================================================
function buildPeople() {
  // Three people as simple stylized figures
  const people = [
    { x: -1, z: 4, rot: 0.8, shirt: 0xf0f0f5, pants: 0x2a3a5a, hair: 0x2a2020 },
    { x: 0.5, z: 4.5, rot: 0.5, shirt: 0x3a5a3a, pants: 0x2a2a35, hair: 0x1a1510 },
    { x: 9.5, z: 3, rot: -1.5, shirt: 0x4a5a6a, pants: 0x2a2a30, hair: 0x1a1510 }
  ];

  people.forEach(p => {
    const person = new THREE.Group();

    // Legs
    const legMat = mat(p.pants);
    for (let side = -1; side <= 1; side += 2) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.7, 6), legMat);
      leg.position.set(side * 0.1, 0.35, 0);
      person.add(leg);
    }

    // Body
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.65, 8), mat(p.shirt));
    body.position.y = 1.0;
    body.castShadow = true;
    person.add(body);

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 8, 6), mat(0xf0d0b8));
    head.position.y = 1.5;
    person.add(head);

    // Hair
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), mat(p.hair));
    hair.position.y = 1.55;
    hair.scale.set(1, 0.7, 1);
    person.add(hair);

    person.position.set(p.x, 0.15, p.z);
    person.rotation.y = p.rot;
    scene.add(person);
  });
}

// ============================================================
// KOI FISH
// ============================================================
function buildKoi() {
  const koiColors = [
    { body: 0xf0a040, spots: 0xe03030 },
    { body: 0xf5f5f0, spots: 0xe05020 },
    { body: 0xf0c060, spots: 0xc02020 },
    { body: 0xf5f0e0, spots: 0xd04020 },
    { body: 0xe08030, spots: 0xf5f5f0 },
    { body: 0xf5f5f5, spots: 0x1a1a1a },
    { body: 0xf0b040, spots: 0xe02020 }
  ];

  for (let i = 0; i < 7; i++) {
    const koi = new THREE.Group();
    const c = koiColors[i];
    const bodyMat = mat(c.body, { rough: 0.4, metal: 0.05 });

    // Body (elongated)
    const bodyGeo = new THREE.SphereGeometry(0.2, 8, 6);
    bodyGeo.scale(2, 0.6, 1);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    koi.add(body);

    // Tail
    const tail = new THREE.Mesh(
      new THREE.ConeGeometry(0.12, 0.3, 4),
      mat(c.spots, { rough: 0.4, double: true })
    );
    tail.position.x = -0.4;
    tail.rotation.z = Math.PI / 2;
    koi.add(tail);

    // Spots
    for (let s = 0; s < 3; s++) {
      const spot = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 5, 4),
        mat(c.spots, { rough: 0.4 })
      );
      spot.position.set(-0.1 + s * 0.15, 0.07, (Math.random() - 0.5) * 0.12);
      koi.add(spot);
    }

    koi.scale.setScalar(0.7 + Math.random() * 0.3);
    const angle = Math.random() * Math.PI * 2;
    const radius = 1 + Math.random() * 2.5;
    koi.position.set(4 + Math.cos(angle) * radius, 0.05, 4 + Math.sin(angle) * radius);
    koi.rotation.y = angle;

    kois.push({
      mesh: koi,
      angle: angle,
      radius: radius,
      speed: 0.15 + Math.random() * 0.2,
      wobble: Math.random() * Math.PI * 2,
      centerX: 4,
      centerZ: 4
    });
    scene.add(koi);
  }
}

// ============================================================
// FENCE
// ============================================================
function buildFence() {
  const fenceMat = mat(0xd0c8b8, { rough: 0.8 });

  // Partial fence along the front edge
  for (let i = 0; i < 20; i++) {
    const a = -1.2 + (i / 19) * 2.4;
    const r = 12.5;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;

    // Post
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.08), fenceMat);
    post.position.set(x, 0.45, z);
    post.castShadow = true;
    scene.add(post);

    // Horizontal rail
    if (i < 19) {
      const a2 = -1.2 + ((i + 1) / 19) * 2.4;
      const x2 = Math.cos(a2) * r;
      const z2 = Math.sin(a2) * r;
      const mx = (x + x2) / 2, mz = (z + z2) / 2;
      const dist = Math.sqrt((x2 - x) ** 2 + (z2 - z) ** 2);
      const ang = Math.atan2(z2 - z, x2 - x);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(dist, 0.04, 0.04), fenceMat);
      rail.position.set(mx, 0.55, mz);
      rail.rotation.y = -ang;
      scene.add(rail);
    }
  }
}

// ============================================================
// FALLING PETALS
// ============================================================
function initPetals() {
  const petalGeo = new THREE.PlaneGeometry(0.08, 0.06);
  const petalMats = [
    mat(0xfcd6de, { rough: 0.6, double: true, transparent: true, opacity: 0.85 }),
    mat(0xf8c0cc, { rough: 0.6, double: true, transparent: true, opacity: 0.8 }),
    mat(0xffe0e8, { rough: 0.6, double: true, transparent: true, opacity: 0.9 })
  ];

  for (let i = 0; i < 80; i++) {
    const petal = new THREE.Mesh(petalGeo, petalMats[i % 3]);
    const x = (Math.random() - 0.5) * 24;
    const z = (Math.random() - 0.5) * 24;
    const y = 5 + Math.random() * 12;
    petal.position.set(x, y, z);
    petal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    scene.add(petal);
    petals.push({
      mesh: petal,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -(0.3 + Math.random() * 0.5),
      vz: (Math.random() - 0.5) * 0.3,
      rotSpeed: (Math.random() - 0.5) * 2,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleFreq: 1 + Math.random() * 2
    });
  }
}

// ============================================================
// CAMERA MODES
// ============================================================
function setMode(m) {
  cameraMode = m;
  document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
}

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // Camera
  if (cameraMode === 'orbit') {
    cameraAngle += dt * 0.12;
    const r = 30;
    camera.position.x = Math.cos(cameraAngle) * r;
    camera.position.z = Math.sin(cameraAngle) * r;
    camera.position.y = 18 + Math.sin(t * 0.15) * 2;
    camera.lookAt(0, 3, 0);
    camera.fov = 35;
  } else if (cameraMode === 'cine') {
    const phase = (t * 0.05) % 1;
    const cinePath = [
      { x: 25, y: 8, z: 20, lx: 0, ly: 4, lz: 0 },
      { x: -5, y: 5, z: 22, lx: 0, ly: 5, lz: -2 },
      { x: -20, y: 14, z: -15, lx: 0, ly: 3, lz: 0 },
      { x: 15, y: 25, z: -10, lx: 0, ly: 2, lz: 0 }
    ];
    const idx = Math.floor(phase * cinePath.length);
    const frac = (phase * cinePath.length) % 1;
    const smooth = frac * frac * (3 - 2 * frac); // smoothstep
    const a = cinePath[idx];
    const b = cinePath[(idx + 1) % cinePath.length];
    camera.position.x = a.x + (b.x - a.x) * smooth;
    camera.position.y = a.y + (b.y - a.y) * smooth;
    camera.position.z = a.z + (b.z - a.z) * smooth;
    camera.lookAt(a.lx + (b.lx - a.lx) * smooth, a.ly + (b.ly - a.ly) * smooth, a.lz + (b.lz - a.lz) * smooth);
    camera.fov = 30 + Math.sin(t * 0.2) * 5;
  } else if (cameraMode === 'top') {
    camera.position.set(0, 38, 0.1);
    camera.lookAt(0, 0, 0);
    camera.fov = 40;
  }
  camera.updateProjectionMatrix();

  // Petals
  petals.forEach(p => {
    p.mesh.position.x += (p.vx + Math.sin(t * p.wobbleFreq + p.wobblePhase) * 0.15) * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += (p.vz + Math.cos(t * p.wobbleFreq + p.wobblePhase) * 0.1) * dt;
    p.mesh.rotation.x += p.rotSpeed * dt;
    p.mesh.rotation.z += p.rotSpeed * 0.7 * dt;
    // Reset
    if (p.mesh.position.y < -0.5) {
      p.mesh.position.y = 10 + Math.random() * 6;
      p.mesh.position.x = (Math.random() - 0.5) * 24;
      p.mesh.position.z = (Math.random() - 0.5) * 24;
    }
  });

  // Koi fish
  kois.forEach(k => {
    k.angle += k.speed * dt;
    k.wobble += dt * 3;
    const wobbleR = Math.sin(k.wobble) * 0.3;
    k.mesh.position.x = k.centerX + Math.cos(k.angle) * (k.radius + wobbleR);
    k.mesh.position.z = k.centerZ + Math.sin(k.angle) * (k.radius + wobbleR);
    k.mesh.position.y = 0.08 + Math.sin(k.wobble * 0.5) * 0.03;
    k.mesh.rotation.y = -k.angle + Math.PI / 2;
  });

  // Water subtle animation
  if (waterMesh) {
    waterMesh.material.opacity = 0.76 + Math.sin(t * 0.8) * 0.03;
  }

  renderer.render(scene, camera);
}

// ============================================================
// RESIZE
// ============================================================
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ============================================================
// START
// ============================================================
init();
</script>
