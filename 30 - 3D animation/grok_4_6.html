  font-weight: 600;
  letter-spacing: 0.01em;
  transition: background 150ms cubic-bezier(0.22, 1, 0.36, 1),
    color 150ms cubic-bezier(0.22, 1, 0.36, 1),
    transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
}
.sg-bar button:hover { background: #f3ece1; }
.sg-bar button:active { transform: scale(0.98); }
.sg-bar button.is-on {
  background: #2a2622;
  color: #fbf7f0;
  border-color: #2a2622;
}
.sg-hint {
  position: absolute;
  right: max(18px, env(safe-area-inset-right));
  bottom: max(26px, env(safe-area-inset-bottom));
  margin: 0;
  color: #7a736a;
  font-size: 12px;
  letter-spacing: 0.02em;
  pointer-events: none;
}
.sg-shade {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: #f4efe6;
  z-index: 4;
  transition: opacity 500ms cubic-bezier(0.22, 1, 0.36, 1);
}
.sg-shade.is-gone {
  opacity: 0;
  pointer-events: none;
}
.sg-loader-card { text-align: center; }
@media (max-width: 640px) {
  .sg-hint { display: none; }
  .sg-brand { top: 12px; left: 14px; }
  .sg-bar { left: 14px; right: 14px; bottom: 14px; }
  .sg-bar button { flex: 1; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .sg-bar button, .sg-shade { transition: none; }
}
