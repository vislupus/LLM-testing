<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Pagoda Garden - 3D Cinematic Scene</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
#loading {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a0a2e, #2d1b4e);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 1000; transition: opacity 1s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
#loading h1 {
  font-family: Georgia, serif; color: #f8b4c8; font-size: 2.5em;
  text-shadow: 0 0 30px rgba(248,180,200,0.5); margin-bottom: 20px;
}
#loading p { color: #c9a0dc; font-size: 1.1em; }
#info {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.7); font-family: Georgia, serif; font-size: 0.9em;
  text-shadow: 0 0 10px rgba(0,0,0,0.8); pointer-events: none;
}
</style>
</head>
<body>
<div id="loading">
  <h1>🌸 Japanese Garden 🌸</h1>
  <p>Loading cinematic experience...</p>
</div>
<div id="info">🌸 Cinematic 3D Scene — Move mouse to look around 🌸</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Scene setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(25, 18, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 3, 0);
controls.maxPolarAngle = Math.PI / 2.2;
controls.minDistance = 15;
controls.maxDistance = 50;

// Fog
scene.fog = new THREE.FogExp2(0xe8d5e0, 0.008);

// Sky gradient
const skyGeo = new THREE.SphereGeometry(200, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x87ceeb) },
    bottomColor: { value: new THREE.Color(0xfce4ec) }
  },
  vertexShader: `varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4(position, 1.0); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vWorldPosition; void main() { float h = normalize(vWorldPosition).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(h, 0.0)), 1.0); }`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// Materials
const mat = {
  ground: new THREE.MeshStandardMaterial({ color: 0x7cb342, roughness: 0.9, flatShading: true }),
  stone: new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.8, flatShading: true }),
  wood: new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.7, flatShading: true }),
  darkWood: new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.7, flatShading: true }),
  redPaint: new THREE.MeshStandardMaterial({ color: 0xc62828, roughness: 0.6, flatShading: true }),
  whiteWall: new THREE.MeshStandardMaterial({ color: 0xfff8f0, roughness: 0.5, flatShading: true }),
  roof: new THREE.MeshStandardMaterial({ color: 0x263238, roughness: 0.8, flatShading: true }),
  roofEdge: new THREE.MeshStandardMaterial({ color: 0x424242, roughness: 0.7, flatShading: true }),
  gold: new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8, emissive: 0x332200 }),
  water: new THREE.MeshStandardMaterial({ color: 0x4fc3f7, roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.7 }),
  pondBottom: new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: 0.9 }),
  pink: new THREE.MeshStandardMaterial({ color: 0xf8bbd0, roughness: 0.8, flatShading: true }),
  pinkLight: new THREE.MeshStandardMaterial({ color: 0xfce4ec, roughness: 0.8, flatShading: true }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9, flatShading: true }),
  bamboo: new THREE.MeshStandardMaterial({ color: 0x66bb6a, roughness: 0.7, flatShading: true }),
  bush: new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9, flatShading: true }),
  darkBush: new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.9, flatShading: true }),
  bridge: new THREE.MeshStandardMaterial({ color: 0xc62828, roughness: 0.6, flatShading: true }),
  koi: [
    new THREE.MeshStandardMaterial({ color: 0xff6d00, roughness: 0.5, flatShading: true }),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, flatShading: true }),
    new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.5, flatShading: true })
  ],
  lantern: new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.8, flatShading: true }),
  lanternLight: new THREE.MeshStandardMaterial({ color: 0xffe0b2, emissive: 0xffa000, emissiveIntensity: 0.5, transparent: true, opacity: 0.8 }),
  person1Shirt: new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.7 }),
  person1Pants: new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: 0.7 }),
  person2Shirt: new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.7 }),
  person2Pants: new THREE.MeshStandardMaterial({ color: 0x616161, roughness: 0.7 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xffccbc, roughness: 0.7 }),
  hair: new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.9 }),
  path: new THREE.MeshStandardMaterial({ color: 0xbdbdbd, roughness: 0.9, flatShading: true }),
  fence: new THREE.MeshStandardMaterial({ color: 0xb0bec5, roughness: 0.8, flatShading: true }),
};

// Lighting
const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
sunLight.position.set(30, 40, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -30;
sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 30;
sunLight.shadow.camera.bottom = -30;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 100;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xb3e5fc, 0.4);
fillLight.position.set(-20, 15, -10);
scene.add(fillLight);

// Hemisphere light
const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x4a7c3f, 0.3);
scene.add(hemiLight);

// Ground
const groundGeo = new THREE.CylinderGeometry(22, 24, 1, 64);
const ground = new THREE.Mesh(groundGeo, mat.ground);
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// Path stones
function createPathStone(x, z, rot) {
  const geo = new THREE.BoxGeometry(1.2, 0.08, 0.8);
  const mesh = new THREE.Mesh(geo, mat.path);
  mesh.position.set(x, 0.04, z);
  mesh.rotation.y = rot || 0;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// Create curved path
const pathPoints = [
  {x: -8, z: -6}, {x: -6, z: -4}, {x: -4, z: -2}, {x: -3, z: 1},
  {x: -4, z: 4}, {x: -3, z: 7}, {x: -1, z: 9}, {x: 2, z: 10},
  {x: 5, z: 9}, {x: 7, z: 7}
];
for (let i = 0; i < pathPoints.length; i++) {
  const p = pathPoints[i];
  const angle = i * 0.3;
  createPathStone(p.x, p.z, angle);
  if (i > 0) {
    const prev = pathPoints[i-1];
    const mx = (p.x + prev.x) / 2;
    const mz = (p.z + prev.z) / 2;
    const angle2 = Math.atan2(p.z - prev.z, p.x - prev.x) + Math.PI/2;
    createPathStone(mx, mz, angle2);
  }
}

// Helper functions
function createPagodaRoof(width, depth, height, y) {
  const group = new THREE.Group();
  const hw = width / 2;
  const hd = depth / 2;
  
  // Main roof shape using custom geometry
  const roofShape = new THREE.Shape();
  roofShape.moveTo(-hw - 0.8, 0);
  roofShape.lineTo(-hw + 0.5, height * 0.6);
  roofShape.lineTo(-hw + 0.8, height);
  roofShape.lineTo(hw - 0.8, height);
  roofShape.lineTo(hw - 0.5, height * 0.6);
  roofShape.lineTo(hw + 0.8, 0);
  roofShape.lineTo(-hw - 0.8, 0);
  
  const extrudeSettings = { depth: depth + 1.6, bevelEnabled: false };
  const roofGeo = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
  const roof = new THREE.Mesh(roofGeo, mat.roof);
  roof.position.set(0, y, -(depth + 1.6) / 2);
  roof.castShadow = true;
  group.add(roof);
  
  // Roof edges (decorative)
  const edgeGeo = new THREE.BoxGeometry(width + 2, 0.15, depth + 2);
  const edge = new THREE.Mesh(edgeGeo, mat.roofEdge);
  edge.position.y = y - 0.1;
  edge.castShadow = true;
  group.add(edge);
  
  // Corner decorations
  const corners = [[-1,-1],[1,-1],[1,1],[-1,1]];
  corners.forEach(([cx, cz]) => {
    const postGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6);
    const post = new THREE.Mesh(postGeo, mat.gold);
    post.position.set(cx * (hw + 0.5), y + 0.3, cz * (hd + 0.5));
    group.add(post);
  });
  
  return group;
}

function createPagoda() {
  const pagoda = new THREE.Group();
  
  // Stone base
  const baseGeo = new THREE.BoxGeometry(8, 1.5, 8);
  const base = new THREE.Mesh(baseGeo, mat.stone);
  base.position.y = 0.75;
  base.castShadow = true;
  base.receiveShadow = true;
  pagoda.add(base);
  
  // Stairs
  for (let i = 0; i < 5; i++) {
    const stepGeo = new THREE.BoxGeometry(2, 0.3, 0.8);
    const step = new THREE.Mesh(stepGeo, mat.stone);
    step.position.set(0, 0.15 + i * 0.3, -4.4 + i * 0.8);
    step.receiveShadow = true;
    pagoda.add(step);
  }
  
  // First floor
  const floor1Geo = new THREE.BoxGeometry(6.5, 2.5, 6.5);
  const floor1 = new THREE.Mesh(floor1Geo, mat.whiteWall);
  floor1.position.y = 2.75;
  floor1.castShadow = true;
  pagoda.add(floor1);
  
  // Floor 1 pillars
  const pillarGeo = new THREE.BoxGeometry(0.3, 2.5, 0.3);
  const corners1 = [[-3, 2.75, -3], [3, 2.75, -3], [3, 2.75, 3], [-3, 2.75, 3]];
  corners1.forEach(([x, y, z]) => {
    const pillar = new THREE.Mesh(pillarGeo, mat.redPaint);
    pillar.position.set(x, y, z);
    pillar.castShadow = true;
    pagoda.add(pillar);
  });
  
  // Floor 1 balcony
  const balcony1Geo = new THREE.BoxGeometry(7.2, 0.15, 7.2);
  const balcony1 = new THREE.Mesh(balcony1Geo, mat.wood);
  balcony1.position.y = 4;
  balcony1.castShadow = true;
  pagoda.add(balcony1);
  
  // Railing
  const railingGeo = new THREE.BoxGeometry(7.2, 0.8, 0.1);
  [[0, 4.4, -3.5, 0], [0, 4.4, 3.5, 0], [3.5, 4.4, 0, Math.PI/2], [-3.5, 4.4, 0, Math.PI/2]].forEach(([x,y,z,r]) => {
    const r2 = new THREE.Mesh(railingGeo, mat.redPaint);
    r2.position.set(x, y, z);
    r2.rotation.y = r;
    pagoda.add(r2);
  });
  
  // Second floor
  const floor2Geo = new THREE.BoxGeometry(5.5, 2.2, 5.5);
  const floor2 = new THREE.Mesh(floor2Geo, mat.whiteWall);
  floor2.position.y = 5.1;
  floor2.castShadow = true;
  pagoda.add(floor2);
  
  const corners2 = [[-2.5, 5.1, -2.5], [2.5, 5.1, -2.5], [2.5, 5.1, 2.5], [-2.5, 5.1, 2.5]];
  corners2.forEach(([x, y, z]) => {
    const pillar = new THREE.Mesh(pillarGeo.clone(), mat.redPaint);
    pillar.scale.y = 2.2;
    pillar.position.set(x, y + 1.1, z);
    pillar.castShadow = true;
    pagoda.add(pillar);
  });
  
  const balcony2Geo = new THREE.BoxGeometry(6.2, 0.15, 6.2);
  const balcony2 = new THREE.Mesh(balcony2Geo, mat.wood);
  balcony2.position.y = 6.2;
  balcony2.castShadow = true;
  pagoda.add(balcony2);
  
  // Third floor
  const floor3Geo = new THREE.BoxGeometry(4.5, 2, 4.5);
  const floor3 = new THREE.Mesh(floor3Geo, mat.whiteWall);
  floor3.position.y = 7.3;
  floor3.castShadow = true;
  pagoda.add(floor3);
  
  const corners3 = [[-2, 7.3, -2], [2, 7.3, -2], [2, 7.3, 2], [-2, 7.3, 2]];
  corners3.forEach(([x, y, z]) => {
    const pillar = new THREE.Mesh(pillarGeo.clone(), mat.redPaint);
    pillar.scale.y = 2;
    pillar.position.set(x, y + 1, z);
    pillar.castShadow = true;
    pagoda.add(pillar);
  });
  
  const balcony3Geo = new THREE.BoxGeometry(5.2, 0.15, 5.2);
  const balcony3 = new THREE.Mesh(balcony3Geo, mat.wood);
  balcony3.position.y = 8.3;
  balcony3.castShadow = true;
  pagoda.add(balcony3);
  
  // Roofs
  pagoda.add(createPagodaRoof(7.5, 7.5, 1.8, 4));
  pagoda.add(createPagodaRoof(6.5, 6.5, 1.6, 6.2));
  pagoda.add(createPagodaRoof(5.5, 5.5, 1.5, 8.3));
  
  // Top ornament (sorin)
  const sorinBase = new THREE.Mesh(new THREE.BoxGeometry(1, 0.3, 1), mat.gold);
  sorinBase.position.y = 9.8;
  pagoda.add(sorinBase);
  
  const sorinSpike = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1.5, 8), mat.gold);
  sorinSpike.position.y = 10.7;
  pagoda.add(sorinSpike);
  
  // Gold ring decorations
  for (let i = 0; i < 3; i++) {
    const ringGeo = new THREE.TorusGeometry(0.4, 0.05, 8, 16);
    const ring = new THREE.Mesh(ringGeo, mat.gold);
    ring.position.y = 10 + i * 0.3;
    ring.rotation.x = Math.PI / 2;
    pagoda.add(ring);
  }
  
  pagoda.position.set(0, 0, 0);
  scene.add(pagoda);
}

function createCherryTree(x, z, scale) {
  const tree = new THREE.Group();
  
  // Trunk
  const trunkGeo = new THREE.CylinderGeometry(0.2 * scale, 0.4 * scale, 4 * scale, 8);
  const trunk = new THREE.Mesh(trunkGeo, mat.trunk);
  trunk.position.y = 2 * scale;
  trunk.castShadow = true;
  tree.add(trunk);
  
  // Branches
  const branchGeo = new THREE.CylinderGeometry(0.05 * scale, 0.12 * scale, 2 * scale, 6);
  const branchAngles = [
    { angle: 0.5, y: 3 * scale, len: 1.5 * scale },
    { angle: -1.2, y: 2.5 * scale, len: 1.8 * scale },
    { angle: 2.3, y: 3.5 * scale, len: 1.3 * scale },
    { angle: -0.5, y: 4 * scale, len: 1.2 * scale }
  ];
  branchAngles.forEach(b => {
    const branch = new THREE.Mesh(branchGeo, mat.trunk);
    branch.position.set(
      Math.cos(b.angle) * b.len * 0.3,
      b.y,
      Math.sin(b.angle) * b.len * 0.3
    );
    branch.rotation.z = Math.cos(b.angle) * 0.8;
    branch.rotation.x = Math.sin(b.angle) * 0.8;
    branch.castShadow = true;
    tree.add(branch);
  });
  
  // Cherry blossom clusters
  const blossomCluster = (cx, cy, cz, s) => {
    const group = new THREE.Group();
    const count = 15 + Math.floor(Math.random() * 10);
    for (let i = 0; i < count; i++) {
      const size = (0.3 + Math.random() * 0.5) * s * scale;
      const flowerGeo = new THREE.IcosahedronGeometry(size, 1);
      const flowerMat = Math.random() > 0.5 ? mat.pink : mat.pinkLight;
      const flower = new THREE.Mesh(flowerGeo, flowerMat);
      flower.position.set(
        cx + (Math.random() - 0.5) * 2.5 * scale,
        cy + (Math.random() - 0.5) * 1.5 * scale,
        cz + (Math.random() - 0.5) * 2.5 * scale
      );
      flower.castShadow = true;
      group.add(flower);
    }
    return group;
  };
  
  tree.add(blossomCluster(0, 5 * scale, 0, 1.2));
  tree.add(blossomCluster(1.5 * scale, 4 * scale, 0.5 * scale, 0.8));
  tree.add(blossomCluster(-1.2 * scale, 3.5 * scale, -0.8 * scale, 0.9));
  tree.add(blossomCluster(0.5 * scale, 5.5 * scale, -1 * scale, 0.7));
  tree.add(blossomCluster(-0.8 * scale, 4.5 * scale, 1.2 * scale, 0.8));
  
  tree.position.set(x, 0, z);
  scene.add(tree);
}

function createBamboo(x, z) {
  const bamboo = new THREE.Group();
  const count = 4 + Math.floor(Math.random() * 3);
  
  for (let i = 0; i < count; i++) {
    const height = 3 + Math.random() * 3;
    const poleGeo = new THREE.CylinderGeometry(0.08, 0.1, height, 8);
    const pole = new THREE.Mesh(poleGeo, mat.bamboo);
    pole.position.set(
      (Math.random() - 0.5) * 1.2,
      height / 2,
      (Math.random() - 0.5) * 1.2
    );
    pole.castShadow = true;
    bamboo.add(pole);
    
    // Bamboo segments
    const segments = Math.floor(height / 0.8);
    for (let s = 0; s < segments; s++) {
      const segGeo = new THREE.TorusGeometry(0.11, 0.015, 6, 12);
      const seg = new THREE.Mesh(segGeo, mat.darkBush);
      seg.position.set(pole.position.x, 0.8 + s * 0.8, pole.position.z);
      seg.rotation.x = Math.PI / 2;
      bamboo.add(seg);
    }
    
    // Leaves
    const leafGeo = new THREE.PlaneGeometry(0.3, 0.08);
    for (let l = 0; l < 5; l++) {
      const leaf = new THREE.Mesh(leafGeo, mat.bamboo);
      const ly = 1 + Math.random() * (height - 1);
      const angle = Math.random() * Math.PI * 2;
      leaf.position.set(
        pole.position.x + Math.cos(angle) * 0.3,
        ly,
        pole.position.z + Math.sin(angle) * 0.3
      );
      leaf.rotation.y = angle;
      leaf.rotation.x = (Math.random() - 0.5) * 0.5;
      bamboo.add(leaf);
    }
  }
  
  bamboo.position.set(x, 0, z);
  scene.add(bamboo);
}

function createBush(x, z, size) {
  const bushGeo = new THREE.SphereGeometry(size, 12, 10);
  const bush = new THREE.Mesh(bushGeo, Math.random() > 0.5 ? mat.bush : mat.darkBush);
  bush.position.set(x, size * 0.6, z);
  bush.scale.y = 0.7;
  bush.castShadow = true;
  scene.add(bush);
}

function createStoneLantern(x, z) {
  const lantern = new THREE.Group();
  
  // Base
  const baseGeo = new THREE.CylinderGeometry(0.4, 0.5, 0.2, 8);
  const base = new THREE.Mesh(baseGeo, mat.lantern);
  base.position.y = 0.1;
  base.castShadow = true;
  lantern.add(base);
  
  // Pillar
  const pillarGeo = new THREE.CylinderGeometry(0.15, 0.2, 0.8, 8);
  const pillar = new THREE.Mesh(pillarGeo, mat.lantern);
  pillar.position.y = 0.6;
  pillar.castShadow = true;
  lantern.add(pillar);
  
  // Light chamber
  const chamberGeo = new THREE.BoxGeometry(0.5, 0.4, 0.5);
  const chamber = new THREE.Mesh(chamberGeo, mat.lantern);
  chamber.position.y = 1.1;
  chamber.castShadow = true;
  lantern.add(chamber);
  
  // Light glow
  const glowGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
  const glow = new THREE.Mesh(glowGeo, mat.lanternLight);
  glow.position.y = 1.1;
  lantern.add(glow);
  
  // Point light
  const light = new THREE.PointLight(0xffa000, 0.5, 5);
  light.position.y = 1.1;
  lantern.add(light);
  
  // Roof
  const roofGeo = new THREE.ConeGeometry(0.5, 0.3, 4);
  const roof = new THREE.Mesh(roofGeo, mat.lantern);
  roof.position.y = 1.45;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  lantern.add(roof);
  
  lantern.position.set(x, 0, z);
  scene.add(lantern);
}

function createKoiPond() {
  const pond = new THREE.Group();
  
  // Pond bottom
  const bottomGeo = new THREE.CylinderGeometry(5, 4.5, 0.3, 32);
  const bottom = new THREE.Mesh(bottomGeo, mat.pondBottom);
  bottom.position.set(6, 0.15, -4);
  bottom.receiveShadow = true;
  pond.add(bottom);
  
  // Water surface
  const waterGeo = new THREE.CircleGeometry(4.8, 32);
  const water = new THREE.Mesh(waterGeo, mat.water);
  water.rotation.x = -Math.PI / 2;
  water.position.set(6, 0.35, -4);
  pond.add(water);
  
  // Pond edge stones
  for (let i = 0; i < 24; i++) {
    const angle = (i / 24) * Math.PI * 2;
    const r = 4.8 + Math.random() * 0.3;
    const stoneGeo = new THREE.SphereGeometry(0.3 + Math.random() * 0.2, 8, 6);
    const stone = new THREE.Mesh(stoneGeo, mat.stone);
    stone.position.set(
      6 + Math.cos(angle) * r,
      0.25,
      -4 + Math.sin(angle) * r
    );
    stone.scale.y = 0.5;
    stone.castShadow = true;
    pond.add(stone);
  }
  
  scene.add(pond);
  
  // Koi fish
  const koiFish = [];
  const koiCount = 10;
  for (let i = 0; i < koiCount; i++) {
    const koi = createKoi();
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 3;
    koi.position.set(6 + Math.cos(angle) * r, 0.3, -4 + Math.sin(angle) * r);
    koi.userData = {
      angle: angle,
      radius: r,
      speed: 0.2 + Math.random() * 0.3,
      bobSpeed: 1 + Math.random() * 2,
      bobAmount: 0.05 + Math.random() * 0.05,
      baseY: 0.3
    };
    scene.add(koi);
    koiFish.push(koi);
  }
  
  return koiFish;
}

function createKoi() {
  const koi = new THREE.Group();
  
  // Body
  const bodyGeo = new THREE.SphereGeometry(0.25, 8, 6);
  bodyGeo.scale(1.8, 0.5, 0.7);
  const colorIdx = Math.floor(Math.random() * 3);
  const body = new THREE.Mesh(bodyGeo, mat.koi[colorIdx]);
  body.castShadow = true;
  koi.add(body);
  
  // Tail
  const tailGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
  const tail = new THREE.Mesh(tailGeo, mat.koi[colorIdx]);
  tail.position.z = 0.4;
  tail.rotation.x = Math.PI / 2;
  tail.scale.y = 0.3;
  koi.add(tail);
  
  // White patches for some koi
  if (colorIdx === 0) {
    const patchGeo = new THREE.SphereGeometry(0.12, 6, 4);
    const patch = new THREE.Mesh(patchGeo, mat.koi[1]);
    patch.position.set(0.15, 0.05, 0);
    koi.add(patch);
  }
  
  return koi;
}

function createBridge() {
  const bridge = new THREE.Group();
  
  // Bridge deck (curved)
  for (let i = 0; i < 10; i++) {
    const t = i / 9;
    const x = 4 + t * 4;
    const arch = Math.sin(t * Math.PI) * 0.8;
    const deckGeo = new THREE.BoxGeometry(0.6, 0.08, 1.5);
    const deck = new THREE.Mesh(deckGeo, mat.wood);
    deck.position.set(x, 0.35 + arch, -4);
    deck.castShadow = true;
    bridge.add(deck);
    
    // Planks
    for (let p = -2; p <= 2; p++) {
      const plankGeo = new THREE.BoxGeometry(0.05, 0.05, 1.4);
      const plank = new THREE.Mesh(plankGeo, mat.darkWood);
      plank.position.set(x, 0.4 + arch, p * 0.25);
      bridge.add(plank);
    }
  }
  
  // Railings
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const x = 4 + t * 4;
      const arch = Math.sin(t * Math.PI) * 0.8;
      const postGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.8, 6);
      const post = new THREE.Mesh(postGeo, mat.redPaint);
      post.position.set(x, 0.75 + arch, side * 0.7);
      post.castShadow = true;
      bridge.add(post);
    }
    // Railing top
    const railingPoints = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const x = 4 + t * 4;
      const arch = Math.sin(t * Math.PI) * 0.8;
      railingPoints.push(new THREE.Vector3(x, 1.15 + arch, side * 0.7));
    }
    const railingCurve = new THREE.CatmullRomCurve3(railingPoints);
    const railingGeo = new THREE.TubeGeometry(railingCurve, 20, 0.03, 6, false);
    const railing = new THREE.Mesh(railingGeo, mat.redPaint);
    bridge.add(railing);
  }
  
  // Bridge pillars
  const pillarGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.6, 8);
  [[4.2, 0.3, -4], [7.8, 0.3, -4]].forEach(([x, y, z]) => {
    const pillar = new THREE.Mesh(pillarGeo, mat.stone);
    pillar.position.set(x, y - 0.3, z);
    pillar.castShadow = true;
    bridge.add(pillar);
  });
  
  scene.add(bridge);
}

function createPerson(x, z, shirtMat, pantsMat, isLooking) {
  const person = new THREE.Group();
  
  // Legs
  const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.7, 6);
  [-0.15, 0.15].forEach(lx => {
    const leg = new THREE.Mesh(legGeo, pantsMat);
    leg.position.set(lx, 0.35, 0);
    leg.castShadow = true;
    person.add(leg);
  });
  
  // Body
  const bodyGeo = new THREE.CylinderGeometry(0.2, 0.25, 0.7, 8);
  const body = new THREE.Mesh(bodyGeo, shirtMat);
  body.position.y = 1.05;
  body.castShadow = true;
  person.add(body);
  
  // Arms
  const armGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.5, 6);
  [-0.3, 0.3].forEach(ax => {
    const arm = new THREE.Mesh(armGeo, shirtMat);
    arm.position.set(ax, 1.1, 0);
    arm.rotation.z = ax > 0 ? -0.3 : 0.3;
    arm.castShadow = true;
    person.add(arm);
  });
  
  // Head
  const headGeo = new THREE.SphereGeometry(0.18, 8, 8);
  const head = new THREE.Mesh(headGeo, mat.skin);
  head.position.y = 1.55;
  head.castShadow = true;
  person.add(head);
  
  // Hair
  const hairGeo = new THREE.SphereGeometry(0.19, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2);
  const hair = new THREE.Mesh(hairGeo, mat.hair);
  hair.position.y = 1.58;
  person.add(hair);
  
  // Bag strap (for person with bag)
  if (shirtMat === mat.person1Shirt) {
    const strapGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 4);
    const strap = new THREE.Mesh(strapGeo, mat.hair);
    strap.position.set(0, 1.1, 0.15);
    strap.rotation.x = 0.3;
    person.add(strap);
    
    const bagGeo = new THREE.BoxGeometry(0.2, 0.25, 0.08);
    const bag = new THREE.Mesh(bagGeo, mat.hair);
    bag.position.set(0, 0.85, 0.2);
    person.add(bag);
  }
  
  person.position.set(x, 0, z);
  if (isLooking) {
    person.rotation.y = Math.PI / 4;
  } else {
    person.rotation.y = -Math.PI / 6;
  }
  
  scene.add(person);
  return person;
}

function createFence() {
  const fence = new THREE.Group();
  const points = [
    {x: -10, z: 2}, {x: -10, z: -2}, {x: -8, z: -4}
  ];
  
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const postGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6);
    const post = new THREE.Mesh(postGeo, mat.fence);
    post.position.set(p.x, 0.3, p.z);
    post.castShadow = true;
    fence.add(post);
    
    if (i > 0) {
      const prev = points[i-1];
      const mx = (p.x + prev.x) / 2;
      const mz = (p.z + prev.z) / 2;
      const dx = p.x - prev.x;
      const dz = p.z - prev.z;
      const len = Math.sqrt(dx*dx + dz*dz);
      const angle = Math.atan2(dz, dx);
      
      // Rails
      for (let r = 0; r < 2; r++) {
        const railGeo = new THREE.CylinderGeometry(0.02, 0.02, len, 4);
        const rail = new THREE.Mesh(railGeo, mat.fence);
        rail.position.set(mx, 0.2 + r * 0.25, mz);
        rail.rotation.y = -angle;
        rail.rotation.z = Math.PI / 2;
        fence.add(rail);
      }
    }
  }
  
  scene.add(fence);
}

// Cherry blossom petals particle system
const petalCount = 200;
const petalGeo = new THREE.BufferGeometry();
const petalPositions = new Float32Array(petalCount * 3);
const petalVelocities = [];
const petalRotations = [];

for (let i = 0; i < petalCount; i++) {
  petalPositions[i * 3] = (Math.random() - 0.5) * 25;
  petalPositions[i * 3 + 1] = Math.random() * 15;
  petalPositions[i * 3 + 2] = (Math.random() - 0.5) * 20;
  petalVelocities.push({
    x: (Math.random() - 0.5) * 0.02,
    y: -0.01 - Math.random() * 0.02,
    z: (Math.random() - 0.5) * 0.02,
    sway: Math.random() * Math.PI * 2
  });
  petalRotations.push({
    x: Math.random() * Math.PI,
    y: Math.random() * Math.PI,
    rx: (Math.random() - 0.5) * 0.03,
    ry: (Math.random() - 0.5) * 0.03
  });
}

petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPositions, 3));

const petalMaterial = new THREE.PointsMaterial({
  color: 0xf8bbd0,
  size: 0.15,
  transparent: true,
  opacity: 0.8,
  sizeAttenuation: true
});

const petals = new THREE.Points(petalGeo, petalMaterial);
scene.add(petals);

// Animation
let time = 0;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const delta = clock.getDelta();
  time += delta;
  
  // Animate koi fish
  scene.children.forEach(child => {
    if (child.userData && child.userData.speed) {
      const d = child.userData;
      d.angle += d.speed * delta;
      child.position.x = 6 + Math.cos(d.angle) * d.radius;
      child.position.z = -4 + Math.sin(d.angle) * d.radius;
      child.position.y = d.baseY + Math.sin(time * d.bobSpeed) * d.bobAmount;
      child.rotation.y = -d.angle + Math.PI / 2;
    }
  });
  
  // Animate petals
  const positions = petals.geometry.attributes.position.array;
  for (let i = 0; i < petalCount; i++) {
    const v = petalVelocities[i];
    const r = petalRotations[i];
    
    positions[i * 3] += v.x + Math.sin(time + v.sway) * 0.005;
    positions[i * 3 + 1] += v.y;
    positions[i * 3 + 2] += v.z + Math.cos(time + v.sway) * 0.005;
    
    if (positions[i * 3 + 1] < 0) {
      positions[i * 3] = (Math.random() - 0.5) * 25;
      positions[i * 3 + 1] = 12 + Math.random() * 3;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
    }
  }
  petals.geometry.attributes.position.needsUpdate = true;
  
  controls.update();
  renderer.render(scene, camera);
}

// Camera cinematic path
let cinematicMode = true;
const cameraPath = [
  { pos: new THREE.Vector3(25, 18, 25), target: new THREE.Vector3(0, 4, 0) },
  { pos: new THREE.Vector3(20, 12, 20), target: new THREE.Vector3(0, 4, 0) },
  { pos: new THREE.Vector3(15, 10, 22), target: new THREE.Vector3(2, 3, -2) },
  { pos: new THREE.Vector3(10, 8, 18), target: new THREE.Vector3(6, 0.5, -4) },
  { pos: new THREE.Vector3(18, 14, 15), target: new THREE.Vector3(0, 5, 0) },
  { pos: new THREE.Vector3(22, 16, 10), target: new THREE.Vector3(-5, 6, -6) },
];

let pathIndex = 0;
let pathProgress = 0;

function cinematicCamera() {
  if (!cinematicMode) return;
  
  pathProgress += 0.003;
  if (pathProgress >= 1) {
    pathProgress = 0;
    pathIndex = (pathIndex + 1) % cameraPath.length;
  }
  
  const current = cameraPath[pathIndex];
  const next = cameraPath[(pathIndex + 1) % cameraPath.length];
  
  const t = pathProgress;
  const smoothT = t * t * (3 - 2 * t); // Smoothstep
  
  camera.position.lerpVectors(current.pos, next.pos, smoothT);
  controls.target.lerpVectors(current.target, next.target, smoothT);
}

// Start animation after loading
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
  animate();
  
  // Switch to cinematic mode
  setInterval(cinematicCamera, 16);
  
  // Exit cinematic on user interaction
  renderer.domElement.addEventListener('pointerdown', () => {
    cinematicMode = false;
  });
}, 2000);

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
