<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pagoda Garden — a cinematic isometric daydream</title>
<style>
/* ============================================================
   THE PAGODA GARDEN · self-contained cinematic scene
   layers = parallax depth · camera = shot timeline · fx = canvas
   ============================================================ */
:root{
  --ease:cubic-bezier(.45,.05,.22,1);
  --ink:#2b2b33;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,#f7f5f1 0%,#f2efe9 55%,#eceae4 100%);
  font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  color:var(--ink);
}
#app{position:fixed;inset:0;perspective:1500px;cursor:default}

/* ---------- camera & scene ---------- */
.camera{
  position:absolute;inset:-7%;
  transition:transform 9.5s var(--ease);
  will-change:transform;
}
.scene{width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
svg#world{width:100%;height:100%;display:block;animation:breathe 16s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.025)}}

.layer{will-change:transform,filter;transition:filter 3.2s ease}

/* ---------- depth of field per shot ---------- */
body.shot-wide  #back{filter:blur(1.6px)} body.shot-wide  #front{filter:blur(1.2px)}
body.shot-pagoda #back{filter:blur(2.6px)} body.shot-pagoda #front{filter:blur(3px)} body.shot-pagoda #water{filter:blur(1.4px)}
body.shot-path  #back{filter:blur(2.4px)} body.shot-path  #front{filter:blur(1.6px)}
body.shot-pond  #back{filter:blur(3px)}  body.shot-pond  #pagoda{filter:blur(1.6px)} body.shot-pond #front{filter:blur(2.2px)}

/* ---------- ambient life (CSS anims inside SVG) ---------- */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6.5s ease-in-out infinite alternate}
.sway.s2{animation-duration:7.8s;animation-delay:-2.4s}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.6deg)}}
.canopy{transform-box:fill-box;transform-origin:50% 60%;animation:canopy 9s ease-in-out infinite alternate}
@keyframes canopy{from{transform:rotate(-.7deg)}to{transform:rotate(.8deg)}}
.person{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4.2s ease-in-out infinite alternate}
.person.p2{animation-delay:-1.7s}.person.p3{animation-delay:-3s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(1.6px)}}
.ripple{fill:none;stroke:rgba(255,255,255,.55);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:rip 5.5s ease-out infinite}
@keyframes rip{0%{transform:scale(.15);opacity:.75}70%{opacity:.25}100%{transform:scale(1);opacity:0}}
.shine{animation:shine 7s ease-in-out infinite alternate}
.shine.sh2{animation-delay:-3.5s}
@keyframes shine{from{transform:translateX(-26px);opacity:.10}50%{opacity:.22}to{transform:translateX(30px);opacity:.10}}
.lanternGlow{animation:glow 5s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.15}to{opacity:.4}}

/* ---------- cinematic overlays ---------- */
canvas#fx{position:absolute;inset:0;pointer-events:none}
.rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:
   radial-gradient(58% 42% at 16% 6%,rgba(255,214,150,.30),transparent 62%),
   linear-gradient(115deg,transparent 40%,rgba(255,241,214,.15) 46%,transparent 53%,rgba(255,241,214,.11) 61%,transparent 68%);
  animation:raysPulse 10s ease-in-out infinite alternate}
@keyframes raysPulse{from{opacity:.75}to{opacity:1}}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(125% 95% at 50% 42%,transparent 55%,rgba(38,40,52,.30) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
  animation:grain 1.1s steps(4) infinite}
@keyframes grain{
  0%{background-position:0 0}25%{background-position:-38px 24px}
  50%{background-position:26px -30px}75%{background-position:-16px -42px}100%{background-position:34px 18px}}

/* ---------- letterbox + titles ---------- */
.bar{position:absolute;left:0;right:0;height:0;background:#0a0a0d;z-index:6;
  transition:height 1.8s var(--ease)}
.bar.top{top:0}.bar.bottom{bottom:0}
body.cine .bar{height:7.5vh}
#title{position:absolute;left:0;right:0;top:11vh;text-align:center;z-index:7;
  opacity:0;transform:translateY(14px);transition:opacity 1.6s ease,transform 1.6s var(--ease);pointer-events:none}
#title.show{opacity:1;transform:none}
#title h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:#33333d;
  font-size:clamp(26px,4.6vw,54px);letter-spacing:.42em;text-indent:.42em;text-transform:uppercase}
#title p{margin-top:10px;font-size:clamp(10px,1.2vw,14px);letter-spacing:.34em;text-indent:.34em;
  text-transform:uppercase;color:#8a8a94}
#title .rule{width:min(300px,40vw);height:1px;margin:16px auto 0;
  background:linear-gradient(90deg,transparent,#b98fae,transparent)}
#caption{position:absolute;left:0;right:0;bottom:9.4vh;text-align:center;z-index:7;pointer-events:none;
  font-size:clamp(10px,1.25vw,15px);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
  color:#f0eef2;text-shadow:0 1px 8px rgba(0,0,0,.55);opacity:0;transition:opacity 1.4s ease}
#caption.show{opacity:.92}

/* ---------- HUD ---------- */
#hud{position:absolute;right:18px;bottom:calc(7.5vh + 14px);z-index:8;display:flex;gap:8px}
#hud button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(40,40,50,.25);
  background:rgba(255,255,255,.72);backdrop-filter:blur(4px);color:#3a3a44;font-size:15px;
  cursor:pointer;transition:transform .2s var(--ease),background .2s}
#hud button:hover{transform:translateY(-3px);background:#fff}
#hint{position:absolute;left:20px;bottom:calc(7.5vh + 18px);z-index:8;font-size:10.5px;
  letter-spacing:.22em;text-transform:uppercase;color:rgba(60,60,70,.55);pointer-events:none;
  animation:hintFade 2s ease 6s forwards}
@keyframes hintFade{to{opacity:0}}
body.paused .camera{transition:none}
body.paused *{animation-play-state:paused!important}
noscript{position:fixed;inset:0;display:grid;place-items:center;background:#f2efe9}
</style>
</head>

    <button id="btnPause" title="pause / play (Space)">❚❚</button>

<noscript>This cinematic scene requires JavaScript.</noscript>

<script>
"use strict";
/* ═══════════════ helpers ═══════════════ */
const $=s=>document.querySelector(s);
const body=document.body, camera=$("#camera"), scene=$("#scene");
const SVGNS="http://www.w3.org/2000/svg";
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ═══════════════ film grain tile ═══════════════ */
(function(){
  const c=document.createElement("canvas");c.width=c.height=96;
  const x=c.getContext("2d"),d=x.createImageData(96,96);
  for(let i=0;i<d.data.length;i+=4){const v=180+Math.random()*75|0;
    d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  x.putImageData(d,0,0);
  $("#grain").style.backgroundImage="url("+c.toDataURL()+")";
})();

/* ═══════════════ scattered ground petals ═══════════════ */
(function(){
  const g=$("#groundPetals"),cols=["#f6cede","#f3bcd2","#fbe3ee"];
  for(let i=0;i<34;i++){
    let x,y;do{x=120+Math.random()*760;y=470+Math.random()*390;}
    while(Math.abs(x-500)/440+Math.abs(y-655)/200>1);
    const e=document.createElementNS(SVGNS,"ellipse");
    e.setAttribute("cx",x);e.setAttribute("cy",y);
    e.setAttribute("rx",3.2);e.setAttribute("ry",1.8);
    e.setAttribute("transform","rotate("+(Math.random()*180|0)+" "+x+" "+y+")");
    e.setAttribute("fill",cols[i%3]);e.setAttribute("opacity",.85);
    g.appendChild(e);
  }
  const r=$("#ripples"),pos=[[760,700],[822,722],[700,682],[560,828],[612,842],[520,816]];
  pos.forEach((p,i)=>{
    const c=document.createElementNS(SVGNS,"circle");
    c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1]);c.setAttribute("r",26);
    c.setAttribute("class","ripple");c.style.animationDelay=(-i*1.1)+"s";
    r.appendChild(c);
  });
})();

/* ═══════════════ sakura petal particle canvas ═══════════════ */
const fx=$("#fx"),fctx=fx.getContext("2d");
let W,H,petals=[];
function sizeFx(){W=fx.width=innerWidth*devicePixelRatio;H=fx.height=innerHeight*devicePixelRatio;
  fx.style.width=innerWidth+"px";fx.style.height=innerHeight+"px";}
sizeFx();addEventListener("resize",sizeFx);
const PCOLS=["247,205,221","244,188,210","251,227,238"];
function newP(top){return{
  x:Math.random()*W, y:top?-20:Math.random()*H,
  s:(2.2+Math.random()*3.4)*devicePixelRatio,
  vy:(34+Math.random()*55)*devicePixelRatio,
  ph:Math.random()*6.28, sw:(18+Math.random()*30)*devicePixelRatio,
  rot:Math.random()*6.28, vr:(Math.random()-.5)*2.4,
  c:PCOLS[Math.random()*3|0], a:.55+Math.random()*.4};}
for(let i=0;i<Math.min(70,innerWidth/18|0);i++)petals.push(newP(false));

/* ═══════════════ parallax (cursor lean) ═══════════════ */
const layers=[...document.querySelectorAll(".layer")];
let tx=0,ty=0,cx=0,cy=0;
addEventListener("pointermove",e=>{
  tx=(e.clientX/innerWidth-.5)*2; ty=(e.clientY/innerHeight-.5)*2;});

/* ═══════════════ shot timeline (camera + DoF + captions) ═══════════════ */
const SHOTS=[
 {cls:"shot-wide",  cap:"the garden awakens",        cam:"translate(0%,0%) scale(1.06) rotate(0deg)",   dur:10000},
 {cls:"shot-pagoda",cap:"the five-tiered pagoda",    cam:"translate(0%,12%) scale(1.72) rotate(1deg)",  dur:9000},
 {cls:"shot-path",  cap:"strolling the stone path",  cam:"translate(13%,9%) scale(1.85) rotate(.8deg)", dur:8500},
 {cls:"shot-pond",  cap:"koi beneath the red bridge",cam:"translate(-15%,8%) scale(1.78) rotate(-1.2deg)",dur:9500},
];
let shotIdx=-1,shotEnd=0,paused=false,pausedAt=0;
const caption=$("#caption");
function nextShot(){
  shotIdx=(shotIdx+1)%SHOTS.length;
  const s=SHOTS[shotIdx];
  SHOTS.forEach(o=>body.classList.remove(o.cls));
  body.classList.add(s.cls);
  camera.style.transform=s.cam;
  caption.classList.remove("show");
  setTimeout(()=>{caption.textContent=s.cap;caption.classList.add("show");},900);
  setTimeout(()=>caption.classList.remove("show"),s.dur-1600);
  shotEnd=performance.now()+s.dur;
}

/* ═══════════════ main loop ═══════════════ */
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!paused){
    if(t>shotEnd&&!reduced)nextShot();
    /* parallax easing */
    cx+=(tx-cx)*.045; cy+=(ty-cy)*.045;
    scene.style.transform="rotateX("+(cy*-2.2)+"deg) rotateY("+(cx*3)+"deg)";
    layers.forEach(l=>{const d=+l.dataset.depth;
      l.style.transform="translate("+(cx*d)+"px,"+(cy*d*.7)+"px)";});
    /* petals */
    fctx.clearRect(0,0,W,H);
    const wind=Math.sin(t*.00022)*.6;
    for(const p of petals){
      p.y+=p.vy*dt; p.ph+=dt*1.4; p.rot+=p.vr*dt;
      p.x+=(Math.cos(p.ph)*p.sw*.02+wind*p.s*.6)*dt*60;
      if(p.y>H+30){Object.assign(p,newP(true));}
      fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);
      fctx.fillStyle="rgba("+p.c+","+p.a+")";
      fctx.beginPath();fctx.ellipse(0,0,p.s*1.5,p.s*.85,0,0,6.283);fctx.fill();
      fctx.restore();
    }
  }
  requestAnimationFrame(loop);
}

/* ═══════════════ controls ═══════════════ */
function setPaused(v){
  paused=v;body.classList.toggle("paused",v);
  $("#btnPause").textContent=v?"▶":"❚❚";
  if(v)pausedAt=performance.now();
  else shotEnd+=performance.now()-pausedAt;
}
$("#btnPause").onclick=()=>setPaused(!paused);
$("#btnNext").onclick=()=>{if(!paused)nextShot();else{setPaused(false);nextShot();}};
$("#btnFull").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();setPaused(!paused);}
  else if(e.key==="n"||e.key==="N")$("#btnNext").click();
  else if(e.key==="f"||e.key==="F")$("#btnFull").click();
});
if(reduced){camera.style.transition="none";}

/* ═══════════════ roll camera ═══════════════ */
setTimeout(()=>body.classList.add("cine"),300);
const title=$("#title");
setTimeout(()=>title.classList.add("show"),1200);
setTimeout(()=>title.classList.remove("show"),6200);
nextShot();
requestAnimationFrame(loop);
</script>
