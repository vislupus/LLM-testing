<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oriental Garden - Cinematic CSS 3D</title>
    <style>
        :root {
            --bg-color: #050505;
            --fog-color: rgba(200, 210, 220, 0.15);
            --pagoda-red: #c0392b;
            --pagoda-white: #ecf0f1;
            --pagoda-roof: #2c3e50;
            --wood-dark: #5d4037;
            --leaf-green: #2ecc71;
            --sakura-pink: #ffb7b2;
            --water-color: #1a2a3a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: sans-serif;
            perspective: 1200px;
        }

        /* --- UI Overlay --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loading-screen {
            background: #000;
            width: 100%;
            height: 100%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 2s ease-in-out;
            pointer-events: auto;
        }

        .title {
            color: white;
            font-size: 3rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0;
            animation: fadeInTitle 2s forwards 0.5s;
            text-shadow: 0 0 20px rgba(255, 183, 178, 0.5);
        }

        .subtitle {
            color: var(--sakura-pink);
            margin-top: 10px;
            font-size: 0.9rem;
            letter-spacing: 4px;
            opacity: 0;
            animation: fadeInTitle 2s forwards 1s;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @keyframes fadeInTitle {
            to { opacity: 1; }
        }

        /* --- 3D Scene Container --- */
        .viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .world {
            position: relative;
            transform-style: preserve-3d;
            width: 0;
            height: 0;
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* --- Common 3D Primitives --- */
        .face {
            position: absolute;
            backface-visibility: hidden; /* Optimization */
        }
        
        /* Helper to create a box */
        .cube {
            position: absolute;
            transform-style: preserve-3d;
        }
        
        .cube .f { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; }
        .cube .f.front  { transform: translateZ(var(--tz)); }
        .cube .f.back   { transform: rotateY(180deg) translateZ(var(--tz)); }
        .cube .f.right  { transform: rotateY(90deg) translateZ(var(--tx)); }
        .cube .f.left   { transform: rotateY(-90deg) translateZ(var(--tx)); }
        .cube .f.top    { transform: rotateX(90deg) translateZ(var(--ty)); }
        .cube .f.bottom { transform: rotateX(-90deg) translateZ(var(--by)); }

        /* --- The Pagoda --- */
        .pagoda-base {
            position: absolute;
            transform-style: preserve-3d;
            bottom: 0;
        }

        .roof-tier {
            position: absolute;
            transform-style: preserve-3d;
        }

        .roof-shape {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--pagoda-roof);
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: translateX(-50%) translateY(-50%) rotateX(90deg);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .roof-shape::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.05);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .pillar {
            position: absolute;
            width: 10px;
            height: 100px;
            background: var(--pagoda-red);
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.5);
            transform-origin: bottom;
        }

        .floor {
            position: absolute;
            width: 120px;
            height: 120px;
            background: var(--pagoda-red);
            border: 4px solid #a93226;
            transform: rotateX(90deg) translateZ(0);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* --- Trees (Bamboo & Sakura) --- */
        .trunk {
            position: absolute;
            width: 8px;
            background: linear-gradient(90deg, #5d4037, #795548);
            transform-style: preserve-3d;
        }

        .leaves {
            position: absolute;
            background: var(--sakura-pink);
            border-radius: 50%;
            transform: rotateX(90deg);
            opacity: 0.9;
            box-shadow: 0 0 10px var(--sakura-pink);
        }

        .bamboo-segment {
            position: absolute;
            width: 4px;
            background: #689f38;
            border-bottom: 1px solid #33691e;
            transform-style: preserve-3d;
        }

        /* --- Lanterns --- */
        .lantern {
            position: absolute;
            transform-style: preserve-3d;
        }
        .lantern-stone {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #7f8c8d;
            transform: translateX(-50%) rotateX(90deg);
            box-shadow: 0 0 5px #000;
        }
        .lantern-light {
            position: absolute;
            width: 14px;
            height: 18px;
            background: #f1c40f;
            transform: translateX(-50%) translateY(-10px);
            box-shadow: 0 0 20px #f39c12;
            opacity: 0.8;
        }

        /* --- The Bridge --- */
        .bridge {
            position: absolute;
            transform-style: preserve-3d;
        }
        .bridge-plank {
            position: absolute;
            width: 300px;
            height: 10px;
            background: var(--pagoda-red);
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            transform-origin: center;
        }
        
        /* --- Water & Reflection --- */
        .water-plane {
            position: absolute;
            width: 2000px;
            height: 2000px;
            background: radial-gradient(circle at center, var(--water-color), #000 80%);
            transform: rotateX(90deg) translateZ(0px);
            opacity: 0.9;
            filter: blur(2px);
        }

        /* Reflection Effect - Simply flip the world below Z=0 */
        .reflection-layer {
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(180deg) translateZ(-20px); /* Flip and shift down */
            filter: blur(4px) brightness(0.6) grayscale(0.3);
            pointer-events: none;
            mask-image: linear-gradient(to top, black 0%, transparent 80%);
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 80%);
        }

        /* --- Particles --- */
        .petal {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #fff, var(--sakura-pink));
            border-radius: 50% 0 50% 50%;
            opacity: 0.8;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* --- Lighting & Atmosphere --- */
        .fog-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, var(--bg-color) 90%);
            pointer-events: none;
            z-index: 50;
        }

        .spotlight {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            mix-blend-mode: overlay;
            z-index: 60;
        }

    </style>
</head>
<body>

    <!-- Cinematic Intro -->
    <div class="loading-screen" id="intro">
        <h1 class="title">Oriental Garden</h1>
        <div class="subtitle">CSS 3D EXPERIENCE</div>
        <div class="hint">Move mouse to explore • Scroll to zoom</div>
    </div>

    <div class="fog-overlay"></div>
    <div class="spotlight" id="spotlight"></div>
    
    <!-- 3D Scene -->
    <div class="viewport">
        <div class="world" id="world">
            
            <!-- Reflection Layer (Mirror of Real World) -->
            <div class="reflection-layer" id="reflection-root">
                <!-- Javascript will populate this with a copy of the main scene -->
            </div>

            <!-- Real World Objects -->
            <div id="real-root">
                <!-- Water Plane (Masking the bottom of reflection) -->
                <div class="water-plane"></div>
                
                <!-- We will inject the 3D objects here via JS for cleaner code management -->
            </div>
        </div>
    </div>

    <div class="ui-layer">
        <!-- Dynamic petals will be appended here -->
    </div>

    <script>
        // --- Configuration ---
        const config = {
            worldSpeed: 0.05,
            autoRotate: true,
            petalCount: 50
        };

        // --- Elements ---
        const world = document.getElementById('world');
        const realRoot = document.getElementById('real-root');
        const reflectionRoot = document.getElementById('reflection-root');
        const spotlight = document.getElementById('spotlight');
        const intro = document.getElementById('intro');

        // --- State ---
        let mouseX = 0, mouseY = 0;
        let targetRotateX = -20;
        let targetRotateY = 45;
        let currentRotateX = -20;
        let currentRotateY = 45;

        // --- 3D Object Builders ---
        
        function createCube(w, h, d, color, x, y, z) {
            const div = document.createElement('div');
            div.className = 'cube';
            div.style.width = w + 'px';
            div.style.height = h + 'px';
            div.style.setProperty('--tz', d/2 + 'px');
            div.style.setProperty('--tx', w/2 + 'px');
            div.style.setProperty('--ty', h/2 + 'px');
            div.style.setProperty('--by', h/2 + 'px'); // Fix bottom alignment
            
            const transform = `translate3d(${x}px, ${y}px, ${z}px)`;
            div.style.transform = transform;

            const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
            faces.forEach(face => {
                const f = document.createElement('div');
                f.className = `f ${face}`;
                f.style.background = color;
                
                // Add simple shading based on face
                if(face === 'right') f.style.filter = 'brightness(0.8)';
                if(face === 'bottom') f.style.filter = 'brightness(0.5)';
                if(face === 'top') f.style.filter = 'brightness(1.2)';

                div.appendChild(f);
            });
            return div;
        }

        function createPagoda(x, z) {
            const group = document.createElement('div');
            group.style.transformStyle = 'preserve-3d';
            group.style.transform = `translateX(${x}px) translateZ(${z}px)`;

            // Base
            group.appendChild(createCube(100, 20, 100, '#a93226', -50, -20, -50)); // Foundation

            // Tier 1
            group.appendChild(createCube(80, 60, 80, '#c0392b', -40, -80, -40)); // Walls
            // Roof 1
            const r1 = document.createElement('div');
            r1.className = 'roof-shape';
            r1.style.width = '140px';
            r1.style.height = '140px';
            r1.style.transform = `translateX(-70px) translateY(-70px) rotateX(90deg) translateZ(-80px)`;
            group.appendChild(r1);

            // Tier 2
            group.appendChild(createCube(60, 50, 60, '#ecf0f1', -30, -130, -30)); // Walls
            // Roof 2
            const r2 = document.createElement('div');
            r2.className = 'roof-shape';
            r2.style.width = '100px';
            r2.style.height = '100px';
            r2.style.transform = `translateX(-50px) translateY(-50px) rotateX(90deg) translateZ(-130px)`;
            group.appendChild(r2);

            // Tier 3
            group.appendChild(createCube(40, 40, 40, '#c0392b', -20, -170, -20)); // Walls
            // Roof 3
            const r3 = document.createElement('div');
            r3.className = 'roof-shape';
            r3.style.width = '70px';
            r3.style.height = '70px';
            r3.style.transform = `translateX(-35px) translateY(-35px) rotateX(90deg) translateZ(-170px)`;
            group.appendChild(r3);

            // Spire
            const spire = createCube(5, 40, 5, '#f1c40f', -2.5, -210, -2.5);
            group.appendChild(spire);

            return group;
        }

        function createSakuraTree(x, z, scale) {
            const group = document.createElement('div');
            group.style.transformStyle = 'preserve-3d';
            group.style.transform = `translateX(${x}px) translateZ(${z}px)`;

            // Trunk
            const trunk = createCube(8*scale, 60*scale, 8*scale, '#3e2723', -4*scale, -60*scale, -4*scale);
            group.appendChild(trunk);

            // Leaves (Clusters of pink spheres)
            for(let i=0; i<5; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaves';
                const s = (30 + Math.random()*20) * scale;
                leaf.style.width = s + 'px';
                leaf.style.height = s + 'px';
                // Random offset
                const ox = (Math.random() - 0.5) * 40 * scale;
                const oz = (Math.random() - 0.5) * 40 * scale;
                const oy = -60*scale - (Math.random() * 30 * scale);
                
                leaf.style.transform = `translate3d(${ox}px, ${oy}px, ${oz}px) rotateX(90deg)`;
                group.appendChild(leaf);
            }

            return group;
        }

        function createLantern(x, z) {
            const group = document.createElement('div');
            group.className = 'lantern';
            group.style.transform = `translate3d(${x}px, -20px, ${z}px)`;
            
            const stone = document.createElement('div');
            stone.className = 'lantern-stone';
            group.appendChild(stone);

            const light = document.createElement('div');
            light.className = 'lantern-light';
            group.appendChild(light);

            return group;
        }

        function createBridge(x, z) {
            const group = document.createElement('div');
            group.className = 'bridge';
            group.style.transform = `translate3d(${x}px, -10px, ${z}px) rotateY(-90deg)`;

            // Arched planks
            for(let i=0; i<15; i++) {
                const plank = document.createElement('div');
                plank.className = 'bridge-plank';
                // Arch curve using sin
                const y = Math.sin(i / 14 * Math.PI) * 40;
                const zOffset = (i * 20) - 140;
                
                plank.style.transform = `translateZ(${zOffset}px) translateY(${-y}px) rotateZ(${-i+7}deg)`;
                group.appendChild(plank);
            }

            return group;
        }

        // --- Build Scene ---
        function initScene() {
            // 1. Add Pagoda
            const pagoda = createPagoda(0, -100);
            realRoot.appendChild(pagoda);
            // Reflection
            reflectionRoot.appendChild(pagoda.cloneNode(true));

            // 2. Add Bridge
            const bridge = createBridge(120, 50);
            realRoot.appendChild(bridge);
            reflectionRoot.appendChild(bridge.cloneNode(true));

            // 3. Add Trees
            const treePositions = [
                {x: -150, z: -50}, {x: -200, z: 0}, {x: 200, z: -150},
                {x: 250, z: 50}, {x: -100, z: -200}, {x: 50, z: -250}
            ];
            
            treePositions.forEach(pos => {
                const tree = createSakuraTree(pos.x, pos.z, 0.8 + Math.random()*0.4);
                realRoot.appendChild(tree);
                reflectionRoot.appendChild(tree.cloneNode(true));
            });

            // 4. Add Lanterns
            const lanternPos = [{x: -50, z: 50}, {x: 50, z: 20}];
            lanternPos.forEach(pos => {
                const l = createLantern(pos.x, pos.z);
                realRoot.appendChild(l);
                // Don't reflect lights strongly to keep water clean, or dim them
                // reflectionRoot.appendChild(l.cloneNode(true)); 
            });

            // Remove Intro after load
            setTimeout(() => {
                intro.style.opacity = 0;
                setTimeout(() => intro.remove(), 2000);
            }, 2500);
        }

        // --- Particle System (Petals) ---
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            
            const size = 5 + Math.random() * 5;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.top = -10 + 'px';
            
            // Random fall speed and sway
            const duration = 5 + Math.random() * 5;
            const sway = 20 + Math.random() * 50;
            
            petal.style.transition = `top ${duration}s linear, transform ${duration}s ease-in-out`;
            
            document.querySelector('.ui-layer').appendChild(petal);

            // Animate
            setTimeout(() => {
                petal.style.top = '110vh';
                petal.style.transform = `translateX(${sway}px) rotate(${Math.random()*360}deg)`;
            }, 100);

            // Cleanup
            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }

        // Start Petal Loop
        setInterval(createPetal, 300);

        // --- Interaction ---
        document.addEventListener('mousemove', (e) => {
            // Map mouse to rotation degrees
            // Y-axis rotation depends on X position
            // X-axis rotation depends on Y position (clamped)
            
            const xPct = e.clientX / window.innerWidth;
            const yPct = e.clientY / window.innerHeight;

            targetRotateY = -30 + (xPct * 60); // -30 to 30 deg
            targetRotateX = -40 + (yPct * 20); // -40 to -20 deg (look down slightly)

            // Move spotlight
            spotlight.style.left = e.clientX + 'px';
            spotlight.style.top = e.clientY + 'px';

            // Stop auto rotation on interaction
            config.autoRotate = false;
        });

        // --- Animation Loop ---
        function animate() {
            if (config.autoRotate) {
                targetRotateY += 0.1;
            }

            // Smooth interpolation (Lerp)
            currentRotateX += (targetRotateX - currentRotateX) * 0.05;
            currentRotateY += (targetRotateY - currentRotateY) * 0.05;

            world.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
            
            // Animate Lantern lights slightly
            const lights = document.querySelectorAll('.lantern-light');
            lights.forEach(l => {
                l.style.opacity = 0.7 + Math.random() * 0.3;
            });

            requestAnimationFrame(animate);
        }

        // --- Init ---
        initScene();
        animate();

    </script>
</body>
</html>
