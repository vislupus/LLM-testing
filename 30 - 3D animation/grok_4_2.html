<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Sanctuary • Cinematic 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Inter:wght@400;500&amp;display=swap');
        body { margin:0; overflow:hidden; font-family: 'Inter', system-ui; }
        canvas { display:block; }
        #ui {
            position: absolute; top: 20px; left: 20px; right: 20px; z-index: 100;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none;
        }
        .panel {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
            padding: 16px 24px; color: white; pointer-events: auto;
        }
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem; letter-spacing: -2px; line-height: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <div class="panel flex items-center gap-6">
            <div class="title text-white">桜の庭</div>
            <div class="text-sm opacity-75">Sakura Sanctuary</div>
        </div>
        
        <div class="panel flex items-center gap-4 text-sm">
            <button onclick="togglePause()" id="pause-btn"
                    class="w-10 h-10 flex items-center justify-center rounded-2xl bg-white/20 hover:bg-white/30 transition">
                <span id="pause-icon">⏸</span>
            </button>
            <div class="flex flex-col">
                <span class="text-xs opacity-60">CAMERA SPEED</span>
                <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1" 
                       oninput="speedMultiplier = this.value" class="accent-pink-400 w-48">
            </div>
            <button onclick="resetCamera()" 
                    class="px-6 py-3 bg-white/20 hover:bg-white/30 rounded-2xl text-sm transition">
                Reset View
            </button>
        </div>
    </div>

    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur-xl px-8 py-3 rounded-3xl text-white/80 text-xs tracking-widest flex items-center gap-8">
        <div>🌸 Falling petals • 🐟 Swimming koi • 📷 Orbiting camera</div>
        <div onclick="toggleInfo()" class="cursor-pointer underline">ABOUT THIS SCENE</div>
    </div>

    <script>
        // ====================== THREE.JS CINEMATIC GARDEN ======================
        let scene, camera, renderer;
        let pagoda, pond, bridge, trees = [], petals = [], fish = [];
        let time = 0;
        let isPaused = false;
        let speedMultiplier = 1;
        let cameraAngle = 0;
        let targetCameraAngle = 0;

        function init() {
            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;

            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x88aadd, 60, 180);

            // CAMERA
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(45, 38, 55);
            camera.lookAt(0, 8, 0);

            // LIGHTING - cinematic golden hour
            const hemi = new THREE.HemisphereLight(0xaaccff, 0x448866, 0.8);
            scene.add(hemi);

            const sun = new THREE.DirectionalLight(0xffeecc, 1.2);
            sun.position.set(40, 60, 30);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 10;
            sun.shadow.camera.far = 200;
            sun.shadow.camera.left = -50;
            sun.shadow.camera.right = 50;
            sun.shadow.camera.top = 50;
            sun.shadow.camera.bottom = -40;
            scene.add(sun);

            const ambient = new THREE.AmbientLight(0x99bbff, 0.6);
            scene.add(ambient);

            createGround();
            createPagoda();
            createPond();
            createBridge();
            createTreesAndBamboo();
            createStonePath();
            createPeople();
            createFallingPetals();
            createKoiFish();

            window.addEventListener('resize', onResize);
            animate();
        }

        function createGround() {
            const groundGeo = new THREE.PlaneGeometry(120, 120);
            const groundMat = new THREE.MeshLambertMaterial({ 
                color: 0x3a8c4a, 
                flatShading: true 
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grass texture simulation
            const grass = new THREE.Mesh(
                new THREE.PlaneGeometry(120, 120),
                new THREE.MeshLambertMaterial({ color: 0x2e6b3a, transparent: true, opacity: 0.6 })
            );
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = 0.02;
            scene.add(grass);
        }

        function createPagoda() {
            pagoda = new THREE.Group();
            
            // Base stone
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(18, 3, 18),
                new THREE.MeshLambertMaterial({ color: 0xaaaaaa })
            );
            base.position.y = 1.5;
            base.castShadow = true;
            base.receiveShadow = true;
            pagoda.add(base);

            // Main structure - 3 tiers
            const colors = [0x9f2a2a, 0x9f2a2a, 0x9f2a2a];
            for (let i = 0; i < 3; i++) {
                const tierW = 16 - i * 2.5;
                const tier = new THREE.Mesh(
                    new THREE.BoxGeometry(tierW, 5, tierW),
                    new THREE.MeshLambertMaterial({ color: colors[i] })
                );
                tier.position.y = 4 + i * 6;
                tier.castShadow = true;
                pagoda.add(tier);

                // Roof
                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(tierW * 0.75, 4, 4),
                    new THREE.MeshLambertMaterial({ color: 0x1a1a1a })
                );
                roof.rotation.y = Math.PI / 4;
                roof.position.y = 6.5 + i * 6;
                pagoda.add(roof);
            }

            // Golden top
            const top = new THREE.Mesh(
                new THREE.ConeGeometry(1.5, 5, 8),
                new THREE.MeshPhongMaterial({ color: 0xffdd44, shininess: 100 })
            );
            top.position.y = 22;
            pagoda.add(top);

            pagoda.position.set(-8, 0, -12);
            scene.add(pagoda);
        }

        function createPond() {
            // Pond water
            const pondGeo = new THREE.CircleGeometry(22, 64);
            const pondMat = new THREE.MeshPhongMaterial({
                color: 0x22d3ee,
                shininess: 30,
                specular: 0xffffff,
                transparent: true,
                opacity: 0.85
            });
            pond = new THREE.Mesh(pondGeo, pondMat);
            pond.rotation.x = -Math.PI / 2;
            pond.position.set(18, 0.1, 12);
            pond.receiveShadow = true;
            scene.add(pond);

            // Stone border
            const border = new THREE.Mesh(
                new THREE.RingGeometry(21.5, 24, 64),
                new THREE.MeshLambertMaterial({ color: 0x777777 })
            );
            border.rotation.x = -Math.PI / 2;
            border.position.set(18, 0.2, 12);
            scene.add(border);
        }

        function createBridge() {
            bridge = new THREE.Group();
            
            // Arch
            const arch = new THREE.Mesh(
                new THREE.TorusGeometry(9, 1.2, 16, 32, Math.PI),
                new THREE.MeshLambertMaterial({ color: 0xb91c1c })
            );
            arch.rotation.z = Math.PI;
            arch.position.set(18, 4, 12);
            bridge.add(arch);

            // Deck
            const deck = new THREE.Mesh(
                new THREE.BoxGeometry(18, 0.8, 4),
                new THREE.MeshLambertMaterial({ color: 0xb91c1c })
            );
            deck.position.set(18, 5.5, 12);
            bridge.add(deck);

            scene.add(bridge);
        }

        function createTreesAndBamboo() {
            // Cherry blossom trees
            const positions = [[-32,0,-28], [-25,0,32], [38,0,-35], [-8,0,42]];
            positions.forEach(p => {
                const tree = new THREE.Group();
                
                // Trunk
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.2, 2, 14, 8),
                    new THREE.MeshLambertMaterial({ color: 0x4d2c1a })
                );
                trunk.position.set(p[0], 7, p[1]);
                tree.add(trunk);

                // Blossom cloud
                for (let i = 0; i < 18; i++) {
                    const bloom = new THREE.Mesh(
                        new THREE.SphereGeometry(4 + Math.random() * 3, 6, 6),
                        new THREE.MeshLambertMaterial({ color: 0xffb3c6 })
                    );
                    bloom.position.set(
                        p[0] + (Math.random()-0.5)*7,
                        12 + Math.random()*8,
                        p[1] + (Math.random()-0.5)*7
                    );
                    tree.add(bloom);
                }
                scene.add(tree);
                trees.push(tree);
            });

            // Bamboo
            for (let i = 0; i < 12; i++) {
                const x = -42 + i * 3;
                const bamboo = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.4, 0.4, 18, 6),
                    new THREE.MeshLambertMaterial({ color: 0x4ade80 })
                );
                bamboo.position.set(x, 9, -22);
                bamboo.rotation.z = (Math.random()-0.5)*0.2;
                scene.add(bamboo);
            }
        }

        function createStonePath() {
            const path = new THREE.Mesh(
                new THREE.PlaneGeometry(42, 6),
                new THREE.MeshLambertMaterial({ color: 0xaaaaaa })
            );
            path.rotation.x = -Math.PI / 2;
            path.position.set(-12, 0.3, -8);
            scene.add(path);
        }

        function createPeople() {
            // Simple stylized people
            const colors = [0xfff, 0x22c55e, 0x3b82f6];
            const positions = [[-22, 0, -6], [-18, 0, -4], [32, 0, 18]];
            
            positions.forEach((p, i) => {
                const person = new THREE.Group();
                
                // Body
                const body = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.6, 1.2, 5, 8),
                    new THREE.MeshLambertMaterial({ color: colors[i] })
                );
                body.position.y = 3.5;
                person.add(body);
                
                // Head
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(1.4, 8, 8),
                    new THREE.MeshLambertMaterial({ color: 0xffdbac })
                );
                head.position.y = 7.2;
                person.add(head);
                
                person.position.set(p[0], 0, p[1]);
                person.rotation.y = Math.random() * Math.PI;
                scene.add(person);
            });
        }

        function createFallingPetals() {
            const petalGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const petalMat = new THREE.MeshBasicMaterial({ 
                color: 0xff9ec1, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9
            });
            
            for (let i = 0; i < 280; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.position.set(
                    (Math.random() - 0.5) * 120,
                    25 + Math.random() * 30,
                    (Math.random() - 0.5) * 110
                );
                petal.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                petal.userData = {
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: -0.6 - Math.random() * 1.4,
                    vz: (Math.random() - 0.5) * 0.8,
                    rotSpeed: (Math.random() - 0.5) * 0.1
                };
                scene.add(petal);
                petals.push(petal);
            }
        }

        function createKoiFish() {
            const fishColors = [0xff3b2f, 0xfff, 0xffaa00, 0x111];
            for (let i = 0; i < 12; i++) {
                const fish = new THREE.Group();
                
                const body = new THREE.Mesh(
                    new THREE.SphereGeometry(0.9, 8, 8),
                    new THREE.MeshPhongMaterial({ 
                        color: fishColors[i % fishColors.length],
                        shininess: 20
                    })
                );
                body.scale.set(1.8, 0.8, 0.6);
                fish.add(body);
                
                // Tail
                const tail = new THREE.Mesh(
                    new THREE.ConeGeometry(0.6, 1.8, 4),
                    new THREE.MeshPhongMaterial({ color: fishColors[i % fishColors.length] })
                );
                tail.rotation.z = Math.PI;
                tail.position.x = -1.4;
                fish.add(tail);
                
                fish.position.set(
                    12 + Math.random() * 12,
                    0.8,
                    4 + Math.random() * 18
                );
                fish.userData = {
                    speed: 0.02 + Math.random() * 0.03,
                    phase: Math.random() * Math.PI * 2,
                    amplitude: 0.6 + Math.random() * 1.2
                };
                scene.add(fish);
                fish.push(fish); // Wait, fish array
            }
        }

        // Fix: global fish array
        let globalFish = [];

        function animate() {
            requestAnimationFrame(animate);
            if (isPaused) return;
            
            time += 0.016 * speedMultiplier;

            // Camera orbit - cinematic slow movement
            cameraAngle = Math.sin(time * 0.1) * 0.4 + Math.PI * 1.35;
            const radius = 78;
            camera.position.x = Math.cos(cameraAngle) * radius + 8;
            camera.position.z = Math.sin(cameraAngle) * radius * 0.8 + 12;
            camera.position.y = 42 + Math.sin(time * 0.3) * 3;
            camera.lookAt(6, 9, 8);

            // Gentle wind on trees
            trees.forEach((tree, i) => {
                tree.rotation.z = Math.sin(time * 1.2 + i) * 0.015;
            });

            // Falling petals
            petals.forEach(p => {
                p.position.y += p.userData.vy * 0.6;
                p.position.x += p.userData.vx * 0.4;
                p.position.z += p.userData.vz * 0.4;
                p.rotation.z += p.userData.rotSpeed;
                
                if (p.position.y < 1) {
                    p.position.y = 45 + Math.random() * 20;
                    p.position.x = (Math.random() - 0.5) * 110;
                    p.position.z = (Math.random() - 0.5) * 110;
                }
            });

            // Swimming koi
            globalFish.forEach((f, i) => {
                f.position.x += Math.sin(time * 2 + i) * f.userData.speed * 0.4;
                f.position.z += Math.cos(time * 1.6 + i * 1.3) * f.userData.speed * 1.1;
                
                if (f.position.x < 4) f.position.x = 32;
                if (f.position.x > 34) f.position.x = 6;
                if (f.position.z < 2) f.position.z = 24;
                if (f.position.z > 26) f.position.z = 4;
                
                f.rotation.y = Math.sin(time * 4 + i) * 0.3;
            });

            // Subtle water shimmer
            if (pond) pond.material.emissive = new THREE.Color(0x22d3ee).multiplyScalar(Math.sin(time * 6) * 0.06 + 0.1);

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-icon').textContent = isPaused ? '▶' : '⏸';
        }

        function resetCamera() {
            cameraAngle = Math.PI * 1.35;
        }

        function toggleInfo() {
            alert("🌸 Cinematic 3D Japanese Garden\n\n• Real-time falling sakura petals\n• Swimming koi fish\n• Smooth cinematic camera orbit\n• Golden hour lighting\n\nMade with ❤️ using Three.js\nCompletely offline & self-contained");
        }

        // Global fix
        window.onload = () => {
            init();
            // Create fish after init
            globalFish = fish; // from createKoiFish
            console.log('%c🌸 Sakura Sanctuary 3D Animation ready!', 'color:#f472b6; font-size:14px; font-family:monospace');
        };
    </script>
</body>
</html>
