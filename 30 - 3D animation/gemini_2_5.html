<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Japanese Garden Animation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; }
        canvas { display: block; }
        #loader {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div id="loader">Loading Scene...</div>
    <canvas id="render-canvas"></canvas>

    <!-- Three.js and post-processing dependencies from CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
        import { TWEEN } from 'https://unpkg.com/three@0.157.0/examples/jsm/libs/tween.module.min.js';

        // --- Basic Scene Setup ---
        let scene, camera, renderer, composer, bokehPass;
        let clock = new THREE.Clock();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(150, 100, 150);
            
            // Renderer
            const canvas = document.getElementById('render-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(100, 150, 100);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 50;
            directionalLight.shadow.camera.far = 500;
            directionalLight.shadow.camera.left = -150;
            directionalLight.shadow.camera.right = 150;
            directionalLight.shadow.camera.top = 150;
            directionalLight.shadow.camera.bottom = -150;
            scene.add(directionalLight);

            // --- Post-processing for Depth-of-Field ---
            const renderPass = new RenderPass(scene, camera);
            bokehPass = new BokehPass(scene, camera, {
                focus: 50.0,
                aperture: 0.0001,
                maxblur: 0.005,
                width: window.innerWidth,
                height: window.innerHeight
            });
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bokehPass);

            // --- Asset Creation ---
            createEnvironment();
            createPagoda();
            createPondAndBridge();
            createFlora();
            createPeople();
            createParticles();

            document.getElementById('loader').style.display = 'none';

            // Start animation loops
            animateCamera();
            animate();
        }

        function createEnvironment() {
            // Ground Plane
            const groundShape = new THREE.Shape();
            groundShape.moveTo(-100, -70);
            groundShape.bezierCurveTo(-100, -80, -90, -90, 0, -90);
            groundShape.bezierCurveTo(90, -90, 100, -80, 100, -70);
            groundShape.bezierCurveTo(115, -70, 115, 70, 100, 70);
            groundShape.bezierCurveTo(90, 80, 0, 80, -90, 80);
            groundShape.bezierCurveTo(-110, 80, -110, -50, -100, -70);
            const groundGeom = new THREE.ShapeGeometry(groundShape);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x8b9e61 });
            const ground = new THREE.Mesh(groundGeom, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Stone Path
            const pathShape = new THREE.Shape();
            pathShape.moveTo(-30, -70); pathShape.lineTo(30, -70);
            pathShape.bezierCurveTo(60, -70, 80, -50, 80, -20);
            pathShape.bezierCurveTo(80, 10, 60, 40, 20, 40);
            pathShape.lineTo(-5, 40);
            pathShape.bezierCurveTo(-60, 40, -80, 10, -80, -20);
            pathShape.bezierCurveTo(-80, -50, -60, -70, -30, -70);
            const pathGeom = new THREE.ShapeGeometry(pathShape);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0xdde0e3 });
            const path = new THREE.Mesh(pathGeom, pathMat);
            path.position.y = 0.1;
            path.rotation.x = -Math.PI / 2;
            path.receiveShadow = true;
            scene.add(path);
            
            // Path stones
            const stoneGeom = new THREE.CylinderGeometry(4, 4, 0.5, 8);
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0xbac1c7 });
            const pathPoints = pathShape.getPoints(50);
            for(let i = 0; i < pathPoints.length; i+=2) {
                const stone = new THREE.Mesh(stoneGeom, stoneMat);
                stone.position.set(pathPoints[i].x + (Math.random()-0.5)*10, 0.2, pathPoints[i].y + (Math.random()-0.5)*10);
                stone.rotation.y = Math.random() * Math.PI;
                stone.castShadow = true;
                scene.add(stone);
            }

            // Fence
            const fenceMat = new THREE.MeshStandardMaterial({ color: 0xced4da });
            const postGeom = new THREE.CylinderGeometry(0.8, 0.8, 8, 6);
            const railGeom = new THREE.BoxGeometry(20, 1, 1);
            const fenceGroup = new THREE.Group();
            let fencePath = [
                new THREE.Vector3(-80, 0, -40), new THREE.Vector3(-80, 0, -60),
                new THREE.Vector3(-60, 0, -70), new THREE.Vector3(-40, 0, -70),
                new THREE.Vector3(-100, 0, 50), new THREE.Vector3(-100, 0, 70),
                new THREE.Vector3(-80, 0, 78), new THREE.Vector3(-50, 0, 78)
            ];

            for(let p of fencePath) {
                const post = new THREE.Mesh(postGeom, fenceMat);
                post.position.set(p.x, 4, p.z);
                post.castShadow = true;
                fenceGroup.add(post);
            }
             scene.add(fenceGroup);

            // Stone Lanterns
            const lanternMat = new THREE.MeshStandardMaterial({ color: 0x9fa4aa });
            function createLantern(x, z, scale=1) {
                const group = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(6*scale, 1*scale, 6*scale), lanternMat);
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(1.5*scale, 1.5*scale, 8*scale, 8), lanternMat);
                stem.position.y = 4.5 * scale;
                const lightBox = new THREE.Mesh(new THREE.BoxGeometry(5*scale, 5*scale, 5*scale), lanternMat);
                lightBox.position.y = 9.5 * scale;
                const roofGeom = new THREE.CylinderGeometry(0, 5*scale, 4*scale, 4);
                const roof = new THREE.Mesh(roofGeom, new THREE.MeshStandardMaterial({ color: 0x5c5c5c}));
                roof.rotation.y = Math.PI/4;
                roof.position.y = 14 * scale;
                group.add(base, stem, lightBox, roof);
                group.position.set(x, 0.5 * scale, z);
                group.children.forEach(c => c.castShadow = true);
                scene.add(group);
            }
            createLantern(-60, -45);
            createLantern(-10, -5, 0.8);
            createLantern(70, 30, 0.8);
        }

        function createPagoda() {
            const pagoda = new THREE.Group();
            
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x6e6e6e });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f1e6 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x9f3f4a });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d });

            // Stone Base
            const stoneBase = new THREE.Mesh(new THREE.BoxGeometry(60, 8, 60), baseMat);
            stoneBase.position.y = 4;
            stoneBase.castShadow = true;
            stoneBase.receiveShadow = true;
            pagoda.add(stoneBase);

            // Tiers
            function createTier(y, scale) {
                const tierGroup = new THREE.Group();
                const tierWidth = 40 * scale;
                const tierHeight = 20 * scale;
                const roofWidth = 55 * scale;
                const roofHeight = 10 * scale;

                // Walls
                const wall = new THREE.Mesh(new THREE.BoxGeometry(tierWidth, tierHeight, tierWidth), wallMat);
                tierGroup.add(wall);

                // Roof
                const roofShape = new THREE.Shape();
                roofShape.moveTo(0, 0);
                roofShape.lineTo(roofWidth / 2, roofHeight);
                roofShape.lineTo(roofWidth / 2 - 5*scale, roofHeight);
                roofShape.lineTo(0, 3 * scale);
                const roofGeom = new THREE.LatheGeometry(roofShape.getPoints(), 4, 0, Math.PI/2);
                const roof = new THREE.Mesh(roofGeom, roofMat);
                roof.position.y = tierHeight / 2;
                roof.rotation.y = Math.PI / 4;
                tierGroup.add(roof.clone().rotateY(Math.PI/2), roof.clone().rotateY(Math.PI), roof.clone().rotateY(-Math.PI/2), roof);

                // Wood details
                const detailGeom = new THREE.BoxGeometry(tierWidth+2, 2*scale, tierWidth+2);
                const topDetail = new THREE.Mesh(detailGeom, woodMat);
                topDetail.position.y = tierHeight/2;
                const bottomDetail = new THREE.Mesh(detailGeom, woodMat);
                bottomDetail.position.y = -tierHeight/2;
                tierGroup.add(topDetail, bottomDetail);

                tierGroup.position.y = y;
                pagoda.add(tierGroup);
            }
            
            createTier(8 + 10, 1.0); // Ground floor
            createTier(8 + 30 + 5, 0.85); // Second floor
            createTier(8 + 30 + 17 + 5, 0.7); // Third floor

            // Top spire
            const spireGeom = new THREE.ConeGeometry(3, 10, 8);
            const spireMat = new THREE.MeshStandardMaterial({ color: 0xfdd835 });
            const spire = new THREE.Mesh(spireGeom, spireMat);
            spire.position.y = 8 + 30 + 17 + 10 + 11;
            pagoda.add(spire);

            // Stairs
            const stepGeom = new THREE.BoxGeometry(15, 1, 4);
            for(let i=0; i<5; i++) {
                const step = new THREE.Mesh(stepGeom, baseMat);
                step.position.set(-20 - i*3, i + 0.5, 0);
                step.castShadow = true;
                pagoda.add(step);
            }
            const railGeom = new THREE.BoxGeometry(1, 10, 1);
            const leftRail = new THREE.Mesh(railGeom, woodMat);
            leftRail.position.set(-35.5, 9.5, 2.5);
            leftRail.rotation.z = -Math.PI / 6;
            const rightRail = leftRail.clone();
            rightRail.position.z = -2.5;
            pagoda.add(leftRail, rightRail);
            
            pagoda.children.forEach(child => {
                child.castShadow = true;
                child.receiveShadow = true;
                if (child.isGroup) {
                    child.children.forEach(grandchild => {
                        grandchild.castShadow = true;
                        grandchild.receiveShadow = true;
                    });
                }
            });

            pagoda.position.set(10, 0, 0);
            scene.add(pagoda);
        }

        function createPondAndBridge() {
            // Pond water
            const pondShape = new THREE.Shape();
            pondShape.moveTo(80, -20);
            pondShape.bezierCurveTo(80, -60, 20, -60, 20, -30);
            pondShape.bezierCurveTo(20, 20, 70, 50, 90, 40);
            pondShape.bezierCurveTo(110, 30, 90, -10, 80, -20);
            
            const pondGeom = new THREE.ShapeGeometry(pondShape);
            
            // Custom shader for water ripple
            const waterMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 1.0 },
                    color: { value: new THREE.Color(0x76c2d7) }
                },
                vertexShader: `
                    uniform float time;
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        float sine = sin(pos.x * 20.0 + time * 2.0) * 0.1;
                        float cosine = cos(pos.y * 20.0 + time * 2.0) * 0.1;
                        pos.z += sine + cosine;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 color;
                    varying vec2 vUv;
                    void main() {
                        gl_FragColor = vec4(color, 0.85);
                    }
                `,
                transparent: true
            });

            const water = new THREE.Mesh(pondGeom, waterMaterial);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -0.5;
            water.receiveShadow = true;
            scene.add(water);
            
            // Koi Fish
            const koiGroup = new THREE.Group();
            scene.add(koiGroup);
            koiGroup.position.y = -2;
            const koiGeom = new THREE.BoxGeometry(4, 1, 1.5);
            const koiColors = [0xff6600, 0xffffff, 0x222222];
            for (let i = 0; i < 9; i++) {
                const koiMat = new THREE.MeshLambertMaterial({ color: koiColors[i % 3] });
                const koi = new THREE.Mesh(koiGeom, koiMat);
                koi.userData = {
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.005 + Math.random() * 0.005,
                    radius: 20 + Math.random() * 15,
                    offset: new THREE.Vector2((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 10)
                };
                koiGroup.add(koi);
            }
            // Animate koi fish in the main animate loop
            scene.userData.koiGroup = koiGroup;
            scene.userData.waterMaterial = waterMaterial;

            // Bridge
            const bridge = new THREE.Group();
            const bridgeMat = new THREE.MeshStandardMaterial({ color: 0xaa2d3b });
            const bridgePath = new THREE.Path();
            bridgePath.moveTo(-20, 0);
            bridgePath.quadraticCurveTo(0, 5, 20, 0);
            const pathPoints = bridgePath.getPoints(10);
            const bridgeGeom = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pathPoints), 20, 3, 4, true);
            const bridgeMesh = new THREE.Mesh(bridgeGeom, bridgeMat);
            bridgeMesh.scale.set(1,1,0.2);
            bridgeMesh.rotation.y = Math.PI/2;
            bridge.add(bridgeMesh);

            const postGeom = new THREE.BoxGeometry(1, 6, 1);
            for(let i = -18; i <= 18; i+=6) {
                const p1 = new THREE.Mesh(postGeom, bridgeMat);
                const p2 = p1.clone();
                const yPos = bridgePath.getPointAt( (i+20)/40 ).y;
                p1.position.set(-3, yPos + 3, i);
                p2.position.set(3, yPos + 3, i);
                bridge.add(p1,p2);
            }
            bridge.position.set(55, 0, 10);
            bridge.rotation.y = -0.2;
            bridge.children.forEach(c => c.castShadow = true);
            scene.add(bridge);
        }

        function createFlora() {
            // Bushes
            const bushGeom = new THREE.SphereGeometry(5, 8, 6);
            const bushMat = new THREE.MeshLambertMaterial({ color: 0x466d3a });
            const bushPositions = [
                [-45, -25], [-30, -30], [-55, 0], [40, 50], [55, 55], [75, 50], [-90, -10], [-95, 10]
            ];
            bushPositions.forEach(p => {
                const bush = new THREE.Mesh(bushGeom, bushMat);
                bush.position.set(p[0], 2.5, p[1]);
                bush.scale.set(1, 1 + Math.random() * 0.3, 1);
                bush.castShadow = true;
                scene.add(bush);
            });

            // Rocks
            const rockGeom = new THREE.IcosahedronGeometry(4, 0);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.8 });
             const rockPositions = [
                [-70, -60, 5], [70, -40, 6], [-85, 30, 7]
            ];
            rockPositions.forEach(p => {
                const rock = new THREE.Mesh(rockGeom, rockMat);
                rock.position.set(p[0], p[2]/2, p[1]);
                rock.scale.set(1, 0.5 + Math.random(), 1);
                rock.castShadow = true;
                scene.add(rock);
            });

            // Bamboo
            const bambooGroup = new THREE.Group();
            const bambooMat = new THREE.MeshLambertMaterial({ color: 0x88b26a });
            const segmentGeom = new THREE.CylinderGeometry(0.5, 0.5, 4, 8);
            for(let i = 0; i < 15; i++) {
                const stalk = new THREE.Group();
                const height = 20 + Math.random() * 20;
                for(let y=0; y < height; y+=4) {
                     const segment = new THREE.Mesh(segmentGeom, bambooMat);
                     segment.position.y = y + 2;
                     stalk.add(segment);
                }
                stalk.position.set(-90 + (Math.random()-0.5)*15, 0, -40 + (Math.random()-0.5)*15);
                stalk.rotation.x = (Math.random() - 0.5) * 0.1;
                stalk.rotation.z = (Math.random() - 0.5) * 0.1;
                stalk.castShadow = true;
                bambooGroup.add(stalk);
            }
            scene.add(bambooGroup);

            // Cherry Trees
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5d4037 });
            const blossomMat = new THREE.MeshLambertMaterial({ color: 0xffc0cb });
            function createTree(x, z) {
                const tree = new THREE.Group();
                const trunkGeom = new THREE.CylinderGeometry(2, 3, 20, 8);
                const trunk = new THREE.Mesh(trunkGeom, trunkMat);
                trunk.position.y = 10;
                trunk.castShadow = true;
                tree.add(trunk);
                
                // Foliage
                for (let i = 0; i < 8; i++) {
                    const foliageGeom = new THREE.IcosahedronGeometry(10 + Math.random()*5, 0);
                    const foliage = new THREE.Mesh(foliageGeom, blossomMat);
                    foliage.position.set(
                        (Math.random() - 0.5) * 15,
                        20 + Math.random() * 10,
                        (Math.random() - 0.5) * 15
                    );
                    foliage.castShadow = true;
                    tree.add(foliage);
                }
                tree.position.set(x, 0, z);
                scene.add(tree);
            }
            createTree(-50, 20);
            createTree(80, 0);
        }

        function createPeople() {
            const personMatGreen = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
            const personMatDark = new THREE.MeshLambertMaterial({ color: 0x37474f });
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc80 });

            function createPerson(x, z, rotationY, colorMat) {
                const person = new THREE.Group();
                const head = new THREE.Mesh(new THREE.SphereGeometry(2.5, 12, 12), skinMat);
                head.position.y = 16;
                const body = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.5, 10, 8), colorMat);
                body.position.y = 9;
                const legs = new THREE.Mesh(new THREE.BoxGeometry(5, 8, 3), personMatDark);
                legs.position.y = 4;
                person.add(head, body, legs);
                person.position.set(x, 0, z);
                person.rotation.y = rotationY;
                person.children.forEach(c => c.castShadow = true);
                scene.add(person);
            }

            createPerson(-40, -50, Math.PI / 4, personMatDark); // Woman
            createPerson(-25, -50, Math.PI / 4, personMatGreen); // Man on path
            createPerson(55, 10, Math.PI, personMatGreen); // Man on bridge
        }
        
        // --- Particle System for Cherry Blossoms ---
        let particleSystem;
        function createParticles() {
            const particleCount = 500;
            const particles = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 250;
                positions[i * 3 + 1] = Math.random() * 150;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 250;
            }

            particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const particleMaterial = new THREE.PointsMaterial({
                color: 0xffc0cb,
                size: 1.5,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(particles, particleMaterial);
            scene.add(particleSystem);
        }

        function animateParticles() {
            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i + 1] -= 0.1; // Fall speed
                 // Sideways drift
                positions[i] += Math.sin(clock.getElapsedTime() + i) * 0.05;

                if (positions[i + 1] < -10) {
                    positions[i + 1] = 150; // Reset to top
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        // --- Camera Animation ---
        function animateCamera() {
            const cameraPosition = { x: 150, y: 100, z: 150 };
            const cameraTarget = { x: 0, y: 20, z: 0 };
            const bokehFocus = { value: 200 };

            const tween1 = new TWEEN.Tween(cameraPosition)
                .to({ x: -150, y: 70, z: 150 }, 10000)
                .easing(TWEEN.Easing.Sinusoidal.InOut);
            
            const tween2 = new TWEEN.Tween(cameraPosition)
                .to({ x: -100, y: 120, z: -180 }, 10000)
                .easing(TWEEN.Easing.Sinusoidal.InOut);
                
            const tween3 = new TWEEN.Tween(cameraPosition)
                .to({ x: 150, y: 100, z: 150 }, 10000)
                .easing(TWEEN.Easing.Sinusoidal.InOut);

            // Animate focus along with camera
            new TWEEN.Tween(bokehFocus)
                .to({ value: 250 }, 10000).chain(
                    new TWEEN.Tween(bokehFocus).to({ value: 280 }, 10000).chain(
                        new TWEEN.Tween(bokehFocus).to({ value: 200 }, 10000)
                    )
                ).start();

            tween1.chain(tween2);
            tween2.chain(tween3);
            tween3.chain(tween1);

            tween1.start();
            
            function updateCamera() {
                camera.position.set(cameraPosition.x, cameraPosition.y, cameraPosition.z);
                camera.lookAt(cameraTarget.x, cameraTarget.y, cameraTarget.z);
                bokehPass.uniforms['focus'].value = camera.position.distanceTo(new THREE.Vector3(cameraTarget.x, cameraTarget.y, cameraTarget.z)) * 0.6;
            }
            
            scene.userData.updateCamera = updateCamera;
        }

        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            TWEEN.update();
            if(scene.userData.updateCamera) {
                scene.userData.updateCamera();
            }

            const delta = clock.getDelta();
            
            // Animate koi fish
            if (scene.userData.koiGroup) {
                const time = clock.getElapsedTime();
                scene.userData.koiGroup.children.forEach((koi, i) => {
                    koi.userData.angle += koi.userData.speed;
                    const center = new THREE.Vector3(55 + koi.userData.offset.x, 0, 10 + koi.userData.offset.y);
                    koi.position.x = center.x + Math.cos(koi.userData.angle) * koi.userData.radius;
                    koi.position.z = center.z + Math.sin(koi.userData.angle) * koi.userData.radius;
                    koi.rotation.y = -koi.userData.angle + Math.PI/2;
                });
            }
            
            // Animate water
            if(scene.userData.waterMaterial){
                scene.userData.waterMaterial.uniforms.time.value += delta;
            }
            
            animateParticles();

            // Render with post-processing
            composer.render(delta);
        }

        // --- Window Resize Handler ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize, false);

        // --- Start the experience ---
        init();
    </script>
</body>
</html>
