<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Battle</title>
<style>
*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block}
#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#fff;font-family:'Segoe UI',Arial,sans-serif;text-align:center;pointer-events:none;text-shadow:0 0 10px rgba(0,0,0,.9);z-index:10}
#hud h1{font-size:22px;font-weight:300;letter-spacing:4px;opacity:.9}
#hud p{font-size:11px;opacity:.4;margin-top:4px}
#score{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;pointer-events:none;display:flex;gap:40px;z-index:10;text-shadow:0 0 8px rgba(0,0,0,.8)}
.bc{color:#5bf}.rc{color:#f64}
#ov{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,.55);cursor:pointer}
#ov.show{display:flex}
#ov h2{font-size:44px;color:#fff;font-family:'Segoe UI',Arial,sans-serif;text-shadow:0 0 20px rgba(255,255,255,.5);letter-spacing:6px;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div id="hud"><h1>⚔ SPACE BATTLE ⚔</h1><p>drag to orbit · scroll to zoom</p></div>
<div id="score">
<span class="bc" id="bC">● Blue: 10</span>
<span class="rc" id="rC">● Red: 10</span>
</div>
<div id="ov"><h2 id="wM"></h2></div>
<canvas id="c"></canvas>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
'use strict';
const canvas=document.getElementById('c'),
      engine=new BABYLON.Engine(canvas,true,{stencil:true}),
      scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.005,.005,.02,1);
scene.ambientColor=new BABYLON.Color3(.08,.08,.12);

/* ── Camera ─────────────────────────────────────── */
const camera=new BABYLON.ArcRotateCamera('cam',-.5,1.1,150,BABYLON.Vector3.Zero(),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=25;camera.upperRadiusLimit=320;
camera.wheelDeltaPercentage=.01;camera.panningSensibility=0;

/* ── Lights ─────────────────────────────────────── */
const hemi=new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=.12;hemi.diffuse=new BABYLON.Color3(.5,.5,.7);
hemi.groundColor=new BABYLON.Color3(.05,.05,.1);
const sun=new BABYLON.DirectionalLight('s',new BABYLON.Vector3(-.3,-.8,.4),scene);
sun.intensity=.45;sun.diffuse=new BABYLON.Color3(.9,.85,.8);

let GL;try{GL=new BABYLON.GlowLayer('gl',scene,{mainTextureSamples:2});GL.intensity=.55}catch(e){}

/* ── Constants ──────────────────────────────────── */
const ESCORT_HP=80,FLAG_HP=250,PROJ_SPD=58,FIRE_RNG=55,FIRE_CD=3,
      PROJ_DMG=10,FLAG_DMG=16,CHAIN_K=.85;

/* ── State ──────────────────────────────────────── */
let ships=[],projs=[],fxs=[],glowTex,over=false;

/* ── Helpers ────────────────────────────────────── */
const V3=(x,y,z)=>new BABYLON.Vector3(x,y,z),
      C3=(r,g,b)=>new BABYLON.Color3(r,g,b),
      C4=(r,g,b,a)=>new BABYLON.Color4(r,g,b,a),
      rng=(a,b)=>a+(b-a)*Math.random(),
      cl=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ── Glow Texture ───────────────────────────────── */
function mkGlow(){const s=32,d=new Uint8Array(s*s*4);
for(let y=0;y<s;y++)for(let x=0;x<s;x++){
const dx=x-s/2,dy=y-s/2,dist=Math.sqrt(dx*dx+dy*dy)/(s/2),
a=Math.max(0,1-dist),i=(y*s+x)*4;
d[i]=d[i+1]=d[i+2]=255;d[i+3]=Math.floor(a*a*255)}
return new BABYLON.RawTexture(d,s,s,BABYLON.Engine.TEXTUREFORMAT_RGBA,scene,false,false,BABYLON.Texture.BILINEAR_SAMPLINGMODE)}

/* ── Starfield ──────────────────────────────────── */
function mkSky(){
const sky=BABYLON.MeshBuilder.CreateSphere('sky',{diameter:600,sideOrientation:BABYLON.Mesh.BACKSIDE},scene),
m=new BABYLON.StandardMaterial('sk',scene);m.disableLighting=true;m.backFaceCulling=false;
const sz=1024,dt=new BABYLON.DynamicTexture('st',sz,scene,false),ctx=dt.getContext();
ctx.fillStyle='#020208';ctx.fillRect(0,0,sz,sz);
for(let i=0;i<12;i++){const gx=rng(0,sz),gy=rng(0,sz),gr=rng(60,240),hue=rng(180,330),
gd=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
gd.addColorStop(0,'hsla('+hue+',70%,35%,.07)');
gd.addColorStop(.6,'hsla('+hue+',50%,20%,.03)');
gd.addColorStop(1,'transparent');ctx.fillStyle=gd;ctx.fillRect(gx-gr,gy-gr,gr*2,gr*2)}
for(let i=0;i<5000;i++){const sx=Math.random()*sz,sy=Math.random()*sz,
b=rng(.2,1),z=Math.random()<.008?2:1;
ctx.fillStyle='rgba(255,255,'+(220+Math.floor(Math.random()*35))+','+b+')';
ctx.fillRect(sx,sy,z,z)}
dt.update();m.emissiveTexture=dt;sky.material=m}

/* ── Material Factories ─────────────────────────── */
function shipM(c){const m=new BABYLON.StandardMaterial('sm'+Math.random(),scene);
m.diffuseColor=c;m.specularColor=C3(.25,.25,.3);m.specularPower=24;m.ambientColor=c.scale(.3);return m}
function glowM(c){const m=new BABYLON.StandardMaterial('gm'+Math.random(),scene);
m.emissiveColor=c;m.disableLighting=true;return m}

/* ── Escort Builder ─────────────────────────────── */
function buildEsc(t){
const b=t==='blue',c1=b?C3(.22,.38,.82):C3(.82,.22,.22),
c2=b?C3(.12,.22,.68):C3(.68,.12,.12),eg=b?C3(.3,.65,1):C3(1,.38,.18),
r=new BABYLON.TransformNode('e',scene);
const body=BABYLON.MeshBuilder.CreateBox('b',{width:.9,height:.42,depth:2.6},scene);
body.material=shipM(c1);body.parent=r;
const nose=BABYLON.MeshBuilder.CreateCylinder('n',{height:1,diameterTop:0,diameterBottom:.55,tessellation:6},scene);
nose.rotation.x=Math.PI/2;nose.position.z=-1.8;nose.material=shipM(c1);nose.parent=r;
for(const s of[-1,1]){const w=BABYLON.MeshBuilder.CreateBox('w',{width:1.5,height:.06,depth:.9},scene);
w.position=V3(s*1,0,.15);w.material=shipM(c2);w.parent=r;
const tip=BABYLON.MeshBuilder.CreateSphere('t',{diameter:.13},scene);
tip.position=V3(s*1.75,0,.15);tip.material=glowM(eg);tip.parent=r}
const eng=BABYLON.MeshBuilder.CreateSphere('eg',{diameter:.38},scene);
eng.position=V3(0,0,1.4);eng.material=glowM(eg);eng.parent=r;return r}

/* ── Flagship Builder ───────────────────────────── */
function buildFlag(t){
const b=t==='blue',c1=b?C3(.18,.32,.72):C3(.72,.18,.18),
c2=b?C3(.22,.42,.88):C3(.88,.28,.22),c3=b?C3(.12,.28,.62):C3(.62,.12,.12),
eg=b?C3(.3,.65,1):C3(1,.38,.18),r=new BABYLON.TransformNode('f',scene);
const hull=BABYLON.MeshBuilder.CreateBox('h',{width:2.4,height:1.2,depth:5.2},scene);
hull.material=shipM(c1);hull.parent=r;
const bridge=BABYLON.MeshBuilder.CreateBox('br',{width:1.3,height:.85,depth:1.5},scene);
bridge.position=V3(0,1,-.3);bridge.material=shipM(c2);bridge.parent=r;
const win=BABYLON.MeshBuilder.CreateBox('wn',{width:1.1,height:.32,depth:.1},scene);
win.position=V3(0,1.05,-1.1);win.material=glowM(b?C3(.4,.75,1):C3(1,.55,.35));win.parent=r;
for(const s of[-1,1]){const w=BABYLON.MeshBuilder.CreateBox('w',{width:3,height:.16,depth:2.1},scene);
w.position=V3(s*2.3,-.2,.3);w.material=shipM(c3);w.parent=r;
const fn=BABYLON.MeshBuilder.CreateBox('fn',{width:.12,height:1.1,depth:1.6},scene);
fn.position=V3(s*2.7,.35,.3);fn.material=shipM(c2);fn.parent=r}
for(const s of[-1.4,0,1.4]){const nac=BABYLON.MeshBuilder.CreateCylinder('nc',{height:.55,diameter:.58,tessellation:8},scene);
nac.position=V3(s,0,2.8);nac.material=shipM(C3(.32,.32,.38));nac.parent=r;
const eg2=BABYLON.MeshBuilder.CreateSphere('eg',{diameter:.48},scene);
eg2.position=V3(s,0,3.1);eg2.material=glowM(eg);eg2.parent=r}
const turret=BABYLON.MeshBuilder.CreateCylinder('tu',{height:.75,diameter:.48,tessellation:8},scene);
turret.position=V3(0,.9,1.3);turret.material=shipM(C3(.42,.42,.48));turret.parent=r;
const ant=BABYLON.MeshBuilder.CreateCylinder('an',{height:1.3,diameter:.07,tessellation:4},scene);
ant.position=V3(0,2.05,-.3);ant.material=shipM(C3(.52,.52,.58));ant.parent=r;
const at=BABYLON.MeshBuilder.CreateSphere('at',{diameter:.18},scene);
at.position=V3(0,2.75,-.3);at.material=glowM(b?C3(.3,.8,1):C3(1,.42,.32));at.parent=r;return r}

/* ── Health Bar ─────────────────────────────────── */
function mkHP(par,f){const w=f?3.5:2,
pl=BABYLON.MeshBuilder.CreatePlane('hp',{width:w,height:.22},scene);
pl.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;pl.position.y=f?2.9:1.7;pl.parent=par;
const mt=new BABYLON.StandardMaterial('hm',scene),
tx=new BABYLON.DynamicTexture('ht',{width:64,height:8},scene,false);
mt.emissiveTexture=tx;mt.disableLighting=true;mt.backFaceCulling=false;pl.material=mt;return tx}
function updHP(tx,hp,mhp){const ctx=tx.getContext(),w=64,h=8,p=cl(hp/mhp,0,1);
ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);
ctx.fillStyle=p>.5?'#0c0':p>.25?'#cc0':'#c00';ctx.fillRect(1,1,Math.max(0,(w-2)*p),h-2);tx.update()}

/* ── Ship Factory ───────────────────────────────── */
function mkShip(t,f){const mesh=f?buildFlag(t):buildEsc(t),hpTx=mkHP(mesh,f),
mhp=f?FLAG_HP:ESCORT_HP,s={t,f,mesh,hpTx,hp:mhp,mhp,
fwd:V3(0,0,t==='blue'?1:-1),cd:rng(.5,FIRE_CD),dead:false,
pos:V3(0,0,0),w:f?5.2:2.6};updHP(hpTx,s.hp,mhp);return s}

/* ── Fleet Factory ──────────────────────────────── */
function mkFleet(t){const b=t==='blue',bz=b?-48:48,fz=b?1:-1,
fl=mkShip(t,true);fl.pos=V3(rng(-2,2),rng(-2,2),bz);
fl.mesh.position.copyFrom(fl.pos);ships.push(fl);
const ofs=[[-10,1,-14],[10,-1,-14],[-20,0,-28],[-10,2.2,-28],[10,-2,-28],[20,1,-28],
[-14,-1,-42],[0,1.5,-42],[14,0,-42]];
for(const o of ofs){const e=mkShip(t,false);
e.pos=V3(o[0]+rng(-2,2),o[1]+rng(-1,1),bz+o[2]*fz+rng(-2,2));
e.mesh.position.copyFrom(e.pos);ships.push(e)}}

/* ── Projectile System ──────────────────────────── */
function fire(s){const b=s.t==='blue',col=b?C3(.3,.65,1):C3(1,.32,.18),
em=b?C3(.5,.9,1):C3(1,.52,.28),wm=s.mesh.computeWorldMatrix(true),
fwd=BABYLON.Vector3.TransformNormal(V3(0,0,1),wm).normalize(),
rgt=BABYLON.Vector3.TransformNormal(V3(1,0,0),wm).normalize(),ps=[];
if(s.f){ps.push(s.pos.add(rgt.scale(1.9)).add(fwd.scale(3.2)));
ps.push(s.pos.add(rgt.scale(-1.9)).add(fwd.scale(3.2)))}
else ps.push(s.pos.add(fwd.scale(1.6)));
for(const p of ps){const sp=BABYLON.MeshBuilder.CreateSphere('p',{diameter:.22},scene);
sp.position.copyFrom(p);sp.material=glowM(em);
const pl=new BABYLON.PointLight('pl',p.clone(),scene);
pl.diffuse=em;pl.intensity=2.5;pl.range=7;
const pa=new BABYLON.ParticleSystem('tr',50,scene);
pa.emitter=sp;pa.createSphereEmitter(.07);
pa.minLifeTime=.04;pa.maxLifeTime=.18;pa.emitRate=28;
pa.minSize=.03;pa.maxSize=.11;
pa.color1=C4(col.r,col.g,col.b,.75);pa.color2=C4(col.r,col.g,col.b,.3);
pa.colorDead=C4(col.r,col.g,col.b,0);
pa.minEmitPower=0;pa.maxEmitPower=.18;
pa.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;pa.particleTexture=glowTex;pa.start();
projs.push({mesh:sp,ps:pa,light:pl,vel:fwd.scale(PROJ_SPD),t:s.t,life:2.6,dmg:s.f?FLAG_DMG:PROJ_DMG})}}

function rmProj(i){const p=projs[i];p.ps.stop();p.ps.dispose();p.mesh.dispose();p.light.dispose();projs.splice(i,1)}

/* ── Explosion System ───────────────────────────── */
function explode(pos,sz,t){
const b=t==='blue';
const fire=new BABYLON.ParticleSystem('fire',380,scene);
fire.emitter=pos.clone();fire.createSphereEmitter(sz*.5);
fire.minLifeTime=.1;fire.maxLifeTime=.75;fire.emitRate=550;
fire.minSize=sz*.08;fire.maxSize=sz*.48;
fire.color1=C4(1,.92,.45,1);fire.color2=C4(1,.52,.12,.8);
fire.colorDead=C4(.42,.16,0,0);
fire.minEmitPower=1;fire.maxEmitPower=sz*2.2;
fire.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;fire.particleTexture=glowTex;
fire.targetStopDuration=.12;fire.disposeOnStop=true;fire.start();
const sp=new BABYLON.ParticleSystem('sp',220,scene);
sp.emitter=pos.clone();sp.createSphereEmitter(sz*.3);
sp.minLifeTime=.2;sp.maxLifeTime=1.1;sp.emitRate=280;
sp.minSize=.02;sp.maxSize=.09;
sp.color1=C4(1,1,.72,1);sp.color2=C4(1,.62,.22,.8);
sp.colorDead=C4(.5,.22,0,0);
sp.minEmitPower=3;sp.maxEmitPower=sz*4.5;
sp.gravity=V3(0,-.8,0);
sp.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;sp.particleTexture=glowTex;
sp.targetStopDuration=.06;sp.disposeOnStop=true;sp.start();
const shock=BABYLON.MeshBuilder.CreateSphere('sh',{diameter:1,segments:16},scene);
shock.position.copyFrom(pos);
const shm=new BABYLON.StandardMaterial('shm',scene);
shm.emissiveColor=b?C3(.4,.65,1):C3(1,.42,.22);
shm.alpha=.65;shm.disableLighting=true;shm.backFaceCulling=false;shock.material=shm;
const lt=new BABYLON.PointLight('el',pos.clone(),scene);
lt.diffuse=b?C3(.4,.72,1):C3(1,.52,.32);lt.intensity=45;lt.range=sz*7;
const debris=[];const nd=Math.min(16,Math.floor(sz*3));
for(let i=0;i<nd;i++){const dm=BABYLON.MeshBuilder.CreateBox('d',{size:rng(.08,.28)*sz},scene);
dm.position.copyFrom(pos);const dmt=new BABYLON.StandardMaterial('dm',scene);
dmt.emissiveColor=C3(rng(.45,.85),rng(.22,.55),rng(.05,.22));dm.material=dmt;
debris.push({mesh:dm,mat:dmt,
vel:V3(rng(-1,1),rng(-1,1),rng(-1,1)).normalize().scale(rng(4,13)*sz),
rot:V3(rng(-6,6),rng(-6,6),rng(-6,6))})}
fxs.push({time:0,shock,shm,lt,debris,sz,
update(dt){this.time+=dt;const st=this.time/.6;
this.shock.scaling=V3(1,1,1).scale(this.sz*4*st);
this.shock.rotation.x+=dt*2.5;this.shock.rotation.z+=dt*1.8;
this.shm.alpha=Math.max(0,.65*(1-st));
this.lt.intensity=Math.max(0,45*(1-this.time/.38));
for(const d of this.debris){d.mesh.position.addInPlace(d.vel.scale(dt));
d.vel.scaleInPlace(.97);d.mesh.rotation.x+=d.rot.x*dt;
d.mesh.rotation.y+=d.rot.y*dt;d.mesh.rotation.z+=d.rot.z*dt;
d.mat.alpha=Math.max(0,1-this.time/1.6)}
return this.time>2.2},
dispose(){this.shock.dispose();this.shm.dispose();this.lt.dispose();
for(const d of this.debris){d.mesh.dispose();d.mat.dispose()}}});
chainReact(pos,sz)}

/* ── Chain Reaction ─────────────────────────────── */
function chainReact(pos,sz){for(const s of ships){if(s.dead)continue;
const d=BABYLON.Vector3.Distance(pos,s.pos),cr=s.w*CHAIN_K;
if(d<cr&&d>.01){const sh=s;
setTimeout(()=>{if(!sh.dead)killShip(sh)},80+Math.random()*280)}
else if(d<cr*2){const dmg=(1-(d-cr)/cr)*45,sh=s;
setTimeout(()=>{if(sh.dead)return;sh.hp-=dmg;updHP(sh.hpTx,sh.hp,sh.mhp);
if(sh.hp<=0)killShip(sh)},160+Math.random()*220)}}}

/* ── Hit Flash ──────────────────────────────────── */
function hitFX(pos,t){const c=t==='blue'?C3(.3,.65,1):C3(1,.32,.18),
pa=new BABYLON.ParticleSystem('hf',28,scene);
pa.emitter=pos.clone();pa.createSphereEmitter(.3);
pa.minLifeTime=.03;pa.maxLifeTime=.16;pa.emitRate=90;
pa.minSize=.04;pa.maxSize=.16;
pa.color1=C4(1,1,1,1);pa.color2=C4(c.r,c.g,c.b,1);
pa.colorDead=C4(c.r,c.g,c.b,0);
pa.minEmitPower=1;pa.maxEmitPower=4.5;
pa.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;pa.particleTexture=glowTex;
pa.targetStopDuration=.02;pa.disposeOnStop=true;pa.start()}

/* ── Ship Destruction ───────────────────────────── */
function killShip(s){if(s.dead)return;s.dead=true;s.hp=0;
updHP(s.hpTx,0,s.mhp);explode(s.pos.clone(),s.w,s.t);s.mesh.setEnabled(false)}

/* ── Ship AI ────────────────────────────────────── */
function ai(s,dt){if(s.dead)return;
let tgt=null,td=1e9;
for(const o of ships){if(o.dead||o.t===s.t)continue;
const d=BABYLON.Vector3.Distance(s.pos,o.pos);if(d<td){td=d;tgt=o}}
if(!tgt)return;
const to=tgt.pos.subtract(s.pos),dist=to.length();
if(dist<.5)return;to.normalize();
let sep=V3(0,0,0);
for(const o of ships){if(o===s||o.dead||o.t!==s.t)continue;
const d=BABYLON.Vector3.Distance(s.pos,o.pos);
if(d<5&&d>.1)sep.addInPlace(s.pos.subtract(o.pos).scale(.6/d))}
let des=to.add(sep).add(V3(rng(-.04,.04),rng(-.04,.04),rng(-.04,.04)));des.normalize();
const tr=s.f?1.6:2.7,t=cl(tr*dt,0,1);
s.fwd=BABYLON.Vector3.Lerp(s.fwd,des,t);
const l=s.fwd.length();if(l<.01)s.fwd=des.clone();else s.fwd.scaleInPlace(1/l);
const spd=s.f?7:14,bd=s.pos.length();
if(bd>85){const inw=s.pos.scale(-1).normalize().scale(.5);s.fwd.addInPlace(inw);s.fwd.normalize()}
s.pos.addInPlace(s.fwd.scale(spd*dt));s.mesh.position.copyFrom(s.pos);
s.mesh.rotation.y=Math.atan2(s.fwd.x,s.fwd.z);
s.mesh.rotation.x=-Math.asin(cl(s.fwd.y,-1,1));
s.cd-=dt;const dot=BABYLON.Vector3.Dot(s.fwd,to);
if(s.cd<=0&&dot>.72&&dist<FIRE_RNG){fire(s);s.cd=FIRE_CD+rng(-.3,.3)}}

/* ── Collision ──────────────────────────────────── */
function checkHits(){for(let i=projs.length-1;i>=0;i--){const p=projs[i];let hit=false;
for(const s of ships){if(s.dead||s.t===p.t)continue;
const d=BABYLON.Vector3.Distance(p.mesh.position,s.pos);
if(d<s.w*.55){s.hp-=p.dmg;updHP(s.hpTx,s.hp,s.mhp);
hitFX(p.mesh.position.clone(),p.t);if(s.hp<=0)killShip(s);hit=true;break}}
if(hit)rmProj(i)}}

/* ── Restart ────────────────────────────────────── */
function restart(){for(const s of ships)s.mesh.dispose();
for(const p of projs){p.ps.stop();p.ps.dispose();p.mesh.dispose();p.light.dispose()}
for(const f of fxs)f.dispose();
ships=[];projs=[];fxs=[];over=false;
mkFleet('blue');mkFleet('red');
document.getElementById('ov').classList.remove('show')}
document.getElementById('ov').addEventListener('click',restart);

/* ── Main Loop ──────────────────────────────────── */
scene.registerBeforeRender(()=>{
const dt=Math.min(engine.getDeltaTime()/1000,.05);if(dt<=0)return;
for(const s of ships)ai(s,dt);
for(let i=projs.length-1;i>=0;i--){const p=projs[i];
p.mesh.position.addInPlace(p.vel.scale(dt));p.light.position.copyFrom(p.mesh.position);
p.life-=dt;if(p.life<=0)rmProj(i)}
checkHits();
for(let i=fxs.length-1;i>=0;i--){if(fxs[i].update(dt)){fxs[i].dispose();fxs.splice(i,1)}}

let bA=0,rA=0;
for(const s of ships){if(!s.dead){if(s.t==='blue')bA++;else rA++}}
document.getElementById('bC').textContent='● Blue: '+bA;
document.getElementById('rC').textContent='● Red: '+rA;
if(!over&&(bA===0||rA===0)){over=true;
const w=bA>0?'BLUE':'RED';
document.getElementById('wM').innerHTML=w+' FLEET VICTORIOUS!<br><span style="font-size:18px;opacity:.5">click to restart</span>';
document.getElementById('ov').classList.add('show')}

/* Camera follow */
let bc=V3(0,0,0),rc=V3(0,0,0),bn=0,rn=0;
for(const s of ships){if(s.dead)continue;
if(s.t==='blue'){bc.addInPlace(s.pos);bn++}else{rc.addInPlace(s.pos);rn++}}
if(bn)bc.scaleInPlace(1/bn);if(rn)rc.scaleInPlace(1/rn);
const ctr=BABYLON.Vector3.Lerp(bc,rc,.5);
camera.target=BABYLON.Vector3.Lerp(camera.target,ctr,.015)});

/* ── Init ───────────────────────────────────────── */
glowTex=mkGlow();mkSky();mkFleet('blue');mkFleet('red');
engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
</script>
