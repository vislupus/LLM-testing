<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Confrontation — 3D Space Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; font-family: 'Orbitron', sans-serif; color: #fff;
  }
  #renderCanvas {
    width: 100%; height: 100%; display: block;
    touch-action: none; outline: none;
  }
  .hud {
    position: absolute; top: 0; left: 0; width: 100%;
    padding: 24px 36px; display: flex; justify-content: space-between;
    pointer-events: none; z-index: 10;
  }
  .fleet-info {
    background: rgba(5,10,20,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 16px 26px; border-radius: 2px; min-width: 200px;
  }
  .fleet-info.blue { border-left: 3px solid #00d4ff; box-shadow: -8px 0 40px -10px rgba(0,212,255,0.5); }
  .fleet-info.red { border-right: 3px solid #ff3850; text-align: right; box-shadow: 8px 0 40px -10px rgba(255,56,80,0.5); }
  .fleet-name { font-size: 11px; letter-spacing: 5px; opacity: 0.55; margin-bottom: 6px; font-weight: 700; }
  .fleet-count { font-size: 44px; font-weight: 900; line-height: 1; font-feature-settings: 'tnum'; }
  .fleet-info.blue .fleet-count { color: #00d4ff; text-shadow: 0 0 25px rgba(0,212,255,0.6); }
  .fleet-info.red .fleet-count { color: #ff3850; text-shadow: 0 0 25px rgba(255,56,80,0.6); }
  .fleet-status { font-size: 9px; opacity: 0.4; margin-top: 8px; letter-spacing: 3px; }
  .title {
    position: absolute; bottom: 28px; left: 50%;
    transform: translateX(-50%); text-align: center;
    pointer-events: none; z-index: 10;
  }
  .title h1 { font-size: 13px; font-weight: 400; letter-spacing: 12px; opacity: 0.4; }
  .controls {
    position: absolute; bottom: 28px; right: 36px;
    font-size: 9px; letter-spacing: 2.5px; opacity: 0.4;
    text-align: right; pointer-events: none; z-index: 10; line-height: 2;
  }
  #victory {
    position: absolute; top: 45%; left: 50%;
    transform: translate(-50%, -50%); text-align: center;
    font-size: 56px; font-weight: 900; letter-spacing: 10px;
    opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease-out; z-index: 20;
    text-shadow: 0 0 40px currentColor, 0 0 80px currentColor;
    white-space: nowrap;
  }
  #victory.show { opacity: 1; }
  #restart {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, 60px);
    padding: 14px 36px;
    background: rgba(5,10,20,0.7);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-family: 'Orbitron', sans-serif;
    font-size: 11px; letter-spacing: 4px; font-weight: 700;
    cursor: pointer; display: none; z-index: 20;
    transition: all 0.3s;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #restart:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.6);
    transform: translate(-50%, 60px) scale(1.05);
  }
  #restart.show { display: block; }
  .loader {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px; letter-spacing: 6px; opacity: 0.5;
    z-index: 5; transition: opacity 0.5s;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div class="hud">
  <div class="fleet-info blue">
    <div class="fleet-name">AZURE FLEET</div>
    <div class="fleet-count" id="blueCount">10</div>
    <div class="fleet-status">SHIPS ACTIVE</div>
  </div>
  <div class="fleet-info red">
    <div class="fleet-name">CRIMSON FLEET</div>
    <div class="fleet-count" id="redCount">10</div>
    <div class="fleet-status">SHIPS ACTIVE</div>
  </div>
</div>
<div class="title"><h1>STELLAR CONFRONTATION</h1></div>
<div class="controls">DRAG TO ORBIT<br>SCROLL TO ZOOM</div>
<div class="loader" id="loader">INITIALIZING BATTLEFIELD</div>
<div id="victory"></div>
<button id="restart">RESTART BATTLE</button>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
<script>
// ============================================================
//  ENGINE / SCENE / CAMERA / LIGHTS / POST-PROCESS
// ============================================================
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { antialias: true, stencil: true });
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.005, 0.008, 0.022, 1);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogColor = new BABYLON.Color3(0.01, 0.015, 0.04);
scene.fogDensity = 0.0008;

const camera = new BABYLON.ArcRotateCamera(
  "camera", -Math.PI / 2, Math.PI / 2.6, 280, BABYLON.Vector3.Zero(), scene
);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 80;
camera.upperRadiusLimit = 700;
camera.wheelDeltaPercentage = 0.01;
camera.pinchDeltaPercentage = 0.01;
camera.upperBetaLimit = Math.PI - 0.1;
camera.lowerBetaLimit = 0.1;
camera.minZ = 0.1;
camera.maxZ = 5000;

const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
hemiLight.intensity = 0.35;
hemiLight.diffuse = new BABYLON.Color3(0.7, 0.8, 1);
hemiLight.groundColor = new BABYLON.Color3(0.3, 0.2, 0.4);

const keyLight = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.5, -0.7, -0.5), scene);
keyLight.intensity = 0.45;
keyLight.diffuse = new BABYLON.Color3(1, 0.95, 0.9);

const rimLight = new BABYLON.DirectionalLight("rim", new BABYLON.Vector3(0.5, 0.3, 0.5), scene);
rimLight.intensity = 0.25;
rimLight.diffuse = new BABYLON.Color3(0.6, 0.7, 1);

const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
pipeline.bloomEnabled = true;
pipeline.bloomThreshold = 0.35;
pipeline.bloomWeight = 0.8;
pipeline.bloomKernel = 64;
pipeline.bloomScale = 0.5;
pipeline.imageProcessing.contrast = 1.25;
pipeline.imageProcessing.exposure = 1.15;
pipeline.imageProcessing.vignetteEnabled = true;
pipeline.imageProcessing.vignetteWeight = 3;
pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 0.6);
pipeline.imageProcessing.vignetteStretch = 0.8;
pipeline.imageProcessing.toneMappingEnabled = true;
pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
pipeline.fxaaEnabled = true;
pipeline.samples = 4;

// ============================================================
//  NEBULA SKYBOX (custom shader: stars + colored clouds)
// ============================================================
BABYLON.Effect.ShadersStore["nebulaVertexShader"] = `
  precision highp float;
  attribute vec3 position;
  uniform mat4 worldViewProjection;
  varying vec3 vPos;
  void main(){ vPos = position; gl_Position = worldViewProjection * vec4(position,1.0); }
`;

BABYLON.Effect.ShadersStore["nebulaFragmentShader"] = `
  precision highp float;
  varying vec3 vPos;
  float hash(vec3 p){
    p = fract(p * vec3(443.897, 441.423, 437.195));
    p += dot(p, p.yzx + 19.19);
    return fract((p.x + p.y) * p.z);
  }
  float noise(vec3 p){
    vec3 i = floor(p); vec3 f = fract(p);
    f = f*f*(3.0-2.0*f);
    return mix(
      mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
          mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
      mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
          mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
  }
  float fbm(vec3 p){
    float v=0.0, a=0.5;
    for(int i=0;i<4;i++){ v += a*noise(p); p *= 2.0; a *= 0.5; }
    return v;
  }
  void main(){
    vec3 dir = normalize(vPos);
    vec3 color = vec3(0.005, 0.008, 0.022);
    float n1 = fbm(dir * 2.5);
    float n2 = fbm(dir * 4.5 + vec3(11.0, 5.0, 7.0));
    float n3 = fbm(dir * 1.5 + vec3(-3.0, 2.0, -8.0));
    color += vec3(0.5,0.15,0.7) * smoothstep(0.45,0.85,n1) * 0.35;
    color += vec3(0.15,0.35,0.85) * smoothstep(0.5,0.8,n2) * 0.25;
    color += vec3(0.8,0.25,0.2) * smoothstep(0.6,0.95,n3) * 0.2;
    color += vec3(0.9,0.7,1.0) * smoothstep(0.75,0.95,n1*n2) * 0.15;
    // bright stars
    vec3 sp = dir * 280.0;
    vec3 cell = floor(sp);
    float sv = hash(cell);
    if(sv > 0.996){
      vec3 cp = fract(sp);
      float d = length(cp - 0.5);
      float b = smoothstep(0.5, 0.0, d);
      float tw = 0.7 + 0.3 * sin(cell.x*12.0 + cell.y*7.3 + cell.z*5.1);
      vec3 sc = mix(vec3(0.8,0.9,1.0), vec3(1.0,0.8,0.6), hash(cell+1.0));
      color += sc * b * tw * (sv-0.996) * 250.0;
    }
    // dim stars
    vec3 sp2 = dir * 160.0;
    float sv2 = hash(floor(sp2) + 0.5);
    if(sv2 > 0.997) color += vec3(0.6,0.7,1.0) * (sv2-0.997) * 180.0;
    // distant stars
    vec3 sp3 = dir * 80.0;
    float sv3 = hash(floor(sp3) + 0.25);
    if(sv3 > 0.9985) color += vec3(0.5,0.6,0.9) * (sv3-0.9985) * 250.0;
    gl_FragColor = vec4(color, 1.0);
  }
`;

const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 3000 }, scene);
const skyMat = new BABYLON.ShaderMaterial("skyMat", scene, { vertex: "nebula", fragment: "nebula" },
  { attributes: ["position"], uniforms: ["worldViewProjection"] });
skyMat.backFaceCulling = false;
skyMat.disableLighting = true;
skybox.material = skyMat;
skybox.infiniteDistance = true;
skybox.isPickable = false;

// ============================================================
//  PARTICLE TEXTURE (generated radial flare)
// ============================================================
let particleTexture;
function getParticleTexture() {
  if (particleTexture) return particleTexture;
  const size = 64;
  const dt = new BABYLON.DynamicTexture("flareTex", size, scene, false);
  const ctx = dt.getContext();
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.3, "rgba(255,220,150,0.9)");
  grad.addColorStop(0.7, "rgba(255,100,30,0.4)");
  grad.addColorStop(1, "rgba(255,50,0,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  dt.update();
  particleTexture = dt;
  return particleTexture;
}

// ============================================================
//  MATERIALS (cached per team)
// ============================================================
const matCache = {};
function initMaterials() {
  const blueAccent = new BABYLON.Color3(0.1, 0.7, 1.0);
  const redAccent  = new BABYLON.Color3(1.0, 0.35, 0.15);

  matCache.blue = new BABYLON.StandardMaterial("shipMatBlue", scene);
  matCache.blue.diffuseColor = new BABYLON.Color3(0.13, 0.15, 0.2);
  matCache.blue.specularColor = new BABYLON.Color3(0.7, 0.8, 0.9);
  matCache.blue.specularPower = 64;
  matCache.blue.emissiveColor = blueAccent.scale(0.08);

  matCache.blueEngine = new BABYLON.StandardMaterial("engineMatBlue", scene);
  matCache.blueEngine.emissiveColor = blueAccent;
  matCache.blueEngine.diffuseColor = new BABYLON.Color3(0,0,0);
  matCache.blueEngine.disableLighting = true;

  matCache.blueAccent = new BABYLON.StandardMaterial("accentMatBlue", scene);
  matCache.blueAccent.emissiveColor = blueAccent;
  matCache.blueAccent.diffuseColor = new BABYLON.Color3(0.05,0.05,0.05);

  matCache.blueProj = new BABYLON.StandardMaterial("projMatBlue", scene);
  matCache.blueProj.emissiveColor = new BABYLON.Color3(0.4, 0.8, 1.0);
  matCache.blueProj.diffuseColor = new BABYLON.Color3(0,0,0);
  matCache.blueProj.disableLighting = true;

  matCache.red = new BABYLON.StandardMaterial("shipMatRed", scene);
  matCache.red.diffuseColor = new BABYLON.Color3(0.2, 0.13, 0.12);
  matCache.red.specularColor = new BABYLON.Color3(0.9, 0.7, 0.7);
  matCache.red.specularPower = 64;
  matCache.red.emissiveColor = redAccent.scale(0.08);

  matCache.redEngine = new BABYLON.StandardMaterial("engineMatRed", scene);
  matCache.redEngine.emissiveColor = redAccent;
  matCache.redEngine.diffuseColor = new BABYLON.Color3(0,0,0);
  matCache.redEngine.disableLighting = true;

  matCache.redAccent = new BABYLON.StandardMaterial("accentMatRed", scene);
  matCache.redAccent.emissiveColor = redAccent;
  matCache.redAccent.diffuseColor = new BABYLON.Color3(0.05,0.05,0.05);

  matCache.redProj = new BABYLON.StandardMaterial("projMatRed", scene);
  matCache.redProj.emissiveColor = new BABYLON.Color3(1.0, 0.4, 0.25);
  matCache.redProj.diffuseColor = new BABYLON.Color3(0,0,0);
  matCache.redProj.disableLighting = true;
}
initMaterials();

const adt = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

// ============================================================
//  GLOBAL STATE
// ============================================================
const allShips = [];
const allProjectiles = [];
const effects = [];
let gameOver = false;
let totalTime = 0;

// ============================================================
//  SHIP CLASS
// ============================================================
class Ship {
  constructor(team, isFlagship, position) {
    this.team = team;
    this.isFlagship = isFlagship;
    this.maxHealth = isFlagship ? 350 : 100;
    this.health = this.maxHealth;
    this.lastFireTime = -Math.random() * 2500;
    this.fireRate = 3000;
    this.alive = true;
    this.target = null;
    this.velocity = new BABYLON.Vector3(0, 0, 0);
    this.exploded = false;
    this.strafePhase = Math.random() * Math.PI * 2;
    this.strafeSpeed = 0.3 + Math.random() * 0.4;
    this.strafeDir = Math.random() < 0.5 ? 1 : -1;
    this.shipWidth = isFlagship ? 14 : 5;
    this.collisionRadius = isFlagship ? 10 : 3;

    this.mesh = this.createShipMesh();
    this.mesh.position = position.clone();
    this.mesh.rotationQuaternion = BABYLON.Quaternion.Identity();

    this.createHealthBar();
    this.createEngineLight();
  }

  createShipMesh() {
    const root = new BABYLON.Mesh("ship", scene);
    root.isPickable = false;

    const shipMat = this.team === 0 ? matCache.blue : matCache.red;
    const engineMat = this.team === 0 ? matCache.blueEngine : matCache.redEngine;
    const accentMat = this.team === 0 ? matCache.blueAccent : matCache.redAccent;

    if (this.isFlagship) {
      // ===== FLAGSHIP — large, multi-part =====
      const hull = BABYLON.MeshBuilder.CreateBox("hull", { width: 4, height: 1.8, depth: 14 }, scene);
      hull.material = shipMat; hull.parent = root; hull.isPickable = false;

      const bow = BABYLON.MeshBuilder.CreateBox("bow", { width: 2.5, height: 1.4, depth: 4 }, scene);
      bow.material = shipMat; bow.parent = root; bow.position.z = 8; bow.isPickable = false;

      const bowTip = BABYLON.MeshBuilder.CreateBox("bowTip", { width: 1, height: 1, depth: 2 }, scene);
      bowTip.material = shipMat; bowTip.parent = root; bowTip.position.z = 11; bowTip.isPickable = false;

      const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 2.5, height: 1.5, depth: 4 }, scene);
      bridge.material = shipMat; bridge.parent = root; bridge.position.y = 1.5; bridge.position.z = -1; bridge.isPickable = false;

      const tower = BABYLON.MeshBuilder.CreateBox("tower", { width: 1.5, height: 1.2, depth: 1.5 }, scene);
      tower.material = shipMat; tower.parent = root; tower.position.y = 2.7; tower.position.z = -1; tower.isPickable = false;

      const towerTop = BABYLON.MeshBuilder.CreateBox("towerTop", { width: 0.8, height: 0.4, depth: 0.8 }, scene);
      towerTop.material = accentMat; towerTop.parent = root; towerTop.position.y = 3.5; towerTop.position.z = -1; towerTop.isPickable = false;

      const antenna = BABYLON.MeshBuilder.CreateCylinder("antenna", { height: 2, diameter: 0.1 }, scene);
      antenna.material = shipMat; antenna.parent = root; antenna.position.y = 4.7; antenna.position.z = -1; antenna.isPickable = false;

      // Swept wings
      const leftWing = BABYLON.MeshBuilder.CreateBox("lw", { width: 8, height: 0.4, depth: 5 }, scene);
      leftWing.material = shipMat; leftWing.parent = root;
      leftWing.position.x = -5.5; leftWing.position.z = -1.5; leftWing.rotation.y = 0.25; leftWing.isPickable = false;

      const rightWing = BABYLON.MeshBuilder.CreateBox("rw", { width: 8, height: 0.4, depth: 5 }, scene);
      rightWing.material = shipMat; rightWing.parent = root;
      rightWing.position.x = 5.5; rightWing.position.z = -1.5; rightWing.rotation.y = -0.25; rightWing.isPickable = false;

      // Glowing wing edges
      const lwAccent = BABYLON.MeshBuilder.CreateBox("lwa", { width: 0.3, height: 0.5, depth: 5 }, scene);
      lwAccent.material = accentMat; lwAccent.parent = root;
      lwAccent.position.x = -9.2; lwAccent.position.z = -1.5; lwAccent.rotation.y = 0.25; lwAccent.isPickable = false;

      const rwAccent = BABYLON.MeshBuilder.CreateBox("rwa", { width: 0.3, height: 0.5, depth: 5 }, scene);
      rwAccent.material = accentMat; rwAccent.parent = root;
      rwAccent.position.x = 9.2; rwAccent.position.z = -1.5; rwAccent.rotation.y = -0.25; rwAccent.isPickable = false;

      // Hull accent strips
      const strip = BABYLON.MeshBuilder.CreateBox("strip", { width: 0.4, height: 0.15, depth: 13 }, scene);
      strip.material = accentMat; strip.parent = root; strip.position.y = 0.9; strip.isPickable = false;

      const bottomStrip = BABYLON.MeshBuilder.CreateBox("bstrip", { width: 1, height: 0.15, depth: 12 }, scene);
      bottomStrip.material = accentMat; bottomStrip.parent = root; bottomStrip.position.y = -0.95; bottomStrip.isPickable = false;

      // Turrets (5)
      const turretPositions = [
        new BABYLON.Vector3(-1.5, 1, 2), new BABYLON.Vector3(1.5, 1, 2),
        new BABYLON.Vector3(-1.5, 1, -3), new BABYLON.Vector3(1.5, 1, -3),
        new BABYLON.Vector3(0, 1, 5)
      ];
      for (const pos of turretPositions) {
        const turret = BABYLON.MeshBuilder.CreateCylinder("turret", { height: 0.5, diameter: 1 }, scene);
        turret.material = shipMat; turret.parent = root; turret.position = pos; turret.isPickable = false;
        const barrel = BABYLON.MeshBuilder.CreateCylinder("barrel", { height: 1.2, diameter: 0.2 }, scene);
        barrel.material = shipMat; barrel.parent = root;
        barrel.position = pos.add(new BABYLON.Vector3(0, 0.2, 0.5));
        barrel.rotation.x = Math.PI / 2; barrel.isPickable = false;
      }

      // 4 engine nacelles
      const enginePositions = [
        new BABYLON.Vector3(-3, 0, -7.5), new BABYLON.Vector3(3, 0, -7.5),
        new BABYLON.Vector3(-1.2, 0, -7.5), new BABYLON.Vector3(1.2, 0, -7.5)
      ];
      this.engineMeshes = [];
      for (const pos of enginePositions) {
        const nacelle = BABYLON.MeshBuilder.CreateCylinder("nacelle", { height: 3, diameter: 1.3 }, scene);
        nacelle.material = shipMat; nacelle.parent = root;
        nacelle.position = pos; nacelle.rotation.x = Math.PI / 2; nacelle.isPickable = false;

        const engine = BABYLON.MeshBuilder.CreateCylinder("engine", { height: 0.4, diameter: 1.2 }, scene);
        engine.material = engineMat; engine.parent = root;
        engine.position = pos.add(new BABYLON.Vector3(0, 0, -1.6));
        engine.rotation.x = Math.PI / 2; engine.isPickable = false;
        this.engineMeshes.push(engine);

        const innerGlow = BABYLON.MeshBuilder.CreateSphere("glow", { diameter: 0.8 }, scene);
        innerGlow.material = engineMat; innerGlow.parent = root;
        innerGlow.position = pos.add(new BABYLON.Vector3(0, 0, -1.6)); innerGlow.isPickable = false;
      }

      root.scaling = new BABYLON.Vector3(2.5, 2.5, 2.5);
    } else {
      // ===== ESCORT — smaller, simpler =====
      const hull = BABYLON.MeshBuilder.CreateBox("hull", { width: 1.2, height: 0.8, depth: 4 }, scene);
      hull.material = shipMat; hull.parent = root; hull.isPickable = false;

      const nose = BABYLON.MeshBuilder.CreateCylinder("nose", { height: 1.5, diameter: 0.9 }, scene);
      nose.material = shipMat; nose.parent = root;
      nose.position.z = 2.5; nose.rotation.x = Math.PI / 2; nose.isPickable = false;

      const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", { diameter: 0.6 }, scene);
      cockpit.material = accentMat; cockpit.parent = root;
      cockpit.position.z = 1.2; cockpit.position.y = 0.3;
      cockpit.scaling.z = 1.4; cockpit.isPickable = false;

      const leftWing = BABYLON.MeshBuilder.CreateBox("lw", { width: 2.8, height: 0.15, depth: 1.5 }, scene);
      leftWing.material = shipMat; leftWing.parent = root;
      leftWing.position.x = -1.7; leftWing.position.z = -0.3; leftWing.rotation.y = 0.18; leftWing.isPickable = false;

      const rightWing = BABYLON.MeshBuilder.CreateBox("rw", { width: 2.8, height: 0.15, depth: 1.5 }, scene);
      rightWing.material = shipMat; rightWing.parent = root;
      rightWing.position.x = 1.7; rightWing.position.z = -0.3; rightWing.rotation.y = -0.18; rightWing.isPickable = false;

      const la = BABYLON.MeshBuilder.CreateBox("la", { width: 0.15, height: 0.3, depth: 1.2 }, scene);
      la.material = accentMat; la.parent = root;
      la.position.x = -2.95; la.position.z = -0.3; la.rotation.y = 0.18; la.isPickable = false;

      const ra = BABYLON.MeshBuilder.CreateBox("ra", { width: 0.15, height: 0.3, depth: 1.2 }, scene);
      ra.material = accentMat; ra.parent = root;
      ra.position.x = 2.95; ra.position.z = -0.3; ra.rotation.y = -0.18; ra.isPickable = false;

      this.engineMeshes = [];
      const engine = BABYLON.MeshBuilder.CreateCylinder("engine", { height: 0.4, diameter: 0.9 }, scene);
      engine.material = engineMat; engine.parent = root;
      engine.position.z = -2.2; engine.rotation.x = Math.PI / 2; engine.isPickable = false;
      this.engineMeshes.push(engine);

      const innerGlow = BABYLON.MeshBuilder.CreateSphere("glow", { diameter: 0.5 }, scene);
      innerGlow.material = engineMat; innerGlow.parent = root;
      innerGlow.position.z = -2.2; innerGlow.isPickable = false;

      const fin = BABYLON.MeshBuilder.CreateBox("fin", { width: 0.1, height: 0.7, depth: 0.8 }, scene);
      fin.material = shipMat; fin.parent = root;
      fin.position.z = -1.4; fin.position.y = 0.55; fin.isPickable = false;

      const finAccent = BABYLON.MeshBuilder.CreateBox("finA", { width: 0.12, height: 0.2, depth: 0.85 }, scene);
      finAccent.material = accentMat; finAccent.parent = root;
      finAccent.position.z = -1.4; finAccent.position.y = 0.8; finAccent.isPickable = false;
    }

    // Invisible link target above the ship for health bar
    const linkMesh = BABYLON.MeshBuilder.CreateBox("link", { size: 0.1 }, scene);
    linkMesh.parent = root;
    linkMesh.position.y = this.isFlagship ? 4 : 1.2;
    linkMesh.isVisible = false;
    linkMesh.isPickable = false;
    this.linkMesh = linkMesh;

    return root;
  }

  createEngineLight() {
    if (this.isFlagship) {
      this.engineLight = new BABYLON.PointLight("engineLight", BABYLON.Vector3.Zero(), scene);
      this.engineLight.diffuse = this.team === 0
        ? new BABYLON.Color3(0.2, 0.6, 1.0)
        : new BABYLON.Color3(1.0, 0.3, 0.1);
      this.engineLight.intensity = 2.5;
      this.engineLight.range = 35;
    }
  }

  createHealthBar() {
    const container = new BABYLON.GUI.Rectangle();
    container.width = this.isFlagship ? "120px" : "70px";
    container.height = this.isFlagship ? "8px" : "5px";
    container.cornerRadius = 1;
    container.color = "rgba(255,255,255,0.35)";
    container.thickness = 1;
    container.background = "rgba(0,0,0,0.65)";
    container.zIndex = 5;
    adt.addControl(container);

    const fill = new BABYLON.GUI.Rectangle();
    fill.width = "100%";
    fill.height = "100%";
    fill.cornerRadius = 1;
    fill.color = "transparent";
    fill.thickness = 0;
    fill.zIndex = 6;
    const teamColor = this.team === 0 ? "#00d4ff" : "#ff3850";
    fill.background = teamColor;
    container.addControl(fill);

    container.linkWithMesh(this.linkMesh);
    container.linkOffsetY = this.isFlagship ? -25 : -15;

    this.healthBarContainer = container;
    this.healthBarFill = fill;
    this.teamColor = teamColor;
  }

  findTarget() {
    const enemies = allShips.filter(s => s.team !== this.team && s.alive);
    if (enemies.length === 0) { this.target = null; return; }

    // Flagships prefer enemy flagship
    if (this.isFlagship) {
      const enemyFlag = enemies.find(s => s.isFlagship);
      if (enemyFlag && Math.random() < 0.65) { this.target = enemyFlag; return; }
    }

    // Weighted nearest selection (some randomness)
    let best = null, bestScore = Infinity;
    for (const ship of enemies) {
      const d = BABYLON.Vector3.Distance(this.mesh.position, ship.mesh.position);
      const score = d + Math.random() * 35;
      if (score < bestScore) { bestScore = score; best = ship; }
    }
    this.target = best;
  }

  update(dt) {
    if (!this.alive) return;

    if (!this.target || !this.target.alive) {
      this.findTarget();
      if (!this.target) {
        this.velocity.scaleInPlace(0.985);
        this.mesh.position.addInPlace(this.velocity.scale(dt));
        return;
      }
    }

    const targetPos = this.target.mesh.position;
    const toTarget = targetPos.subtract(this.mesh.position);
    const distance = toTarget.length();

    const optimalDistance = this.isFlagship ? 75 : 50;
    const strafeRadius = this.isFlagship ? 15 : 25;

    this.strafePhase += dt * this.strafeSpeed * this.strafeDir;

    const forward = toTarget.normalize();
    const worldUp = new BABYLON.Vector3(0, 1, 0);
    let right = BABYLON.Vector3.Cross(worldUp, forward);
    if (right.lengthSquared() < 0.001) right = new BABYLON.Vector3(1, 0, 0);
    right.normalize();
    const up = BABYLON.Vector3.Cross(forward, right).normalize();

    // Desired position: at optimalDistance from target, strafing around it
    const desiredPos = targetPos.subtract(forward.scale(optimalDistance))
      .add(right.scale(Math.cos(this.strafePhase) * strafeRadius))
      .add(up.scale(Math.sin(this.strafePhase * 0.7) * strafeRadius * 0.4));

    const maxForce = this.isFlagship ? 10 : 18;
    const maxSpeed = this.isFlagship ? 14 : 22;

    let accel = desiredPos.subtract(this.mesh.position).normalize().scale(maxForce);

    // Separation from friendly ships
    let separation = new BABYLON.Vector3(0, 0, 0);
    for (const ship of allShips) {
      if (ship === this || !ship.alive || ship.team !== this.team) continue;
      const d = this.mesh.position.subtract(ship.mesh.position);
      const dist = d.length();
      const minDist = (this.shipWidth + ship.shipWidth) * 1.2;
      if (dist < minDist && dist > 0.1) {
        separation.addInPlace(d.normalize().scale((minDist - dist) / minDist * 25));
      }
    }
    accel.addInPlace(separation);

    // Stay near battlefield center
    const distFromOrigin = this.mesh.position.length();
    if (distFromOrigin > 220) {
      accel.addInPlace(this.mesh.position.scale(-1).normalize().scale(15));
    }

    this.velocity.addInPlace(accel.scale(dt));
    this.velocity.scaleInPlace(0.985);

    if (this.velocity.length() > maxSpeed) {
      this.velocity = this.velocity.normalize().scale(maxSpeed);
    }

    this.mesh.position.addInPlace(this.velocity.scale(dt));

    // Orient ship so +Z faces the target
    const lookDir = toTarget.normalize();
    let lookRight = BABYLON.Vector3.Cross(worldUp, lookDir);
    if (lookRight.lengthSquared() < 0.001) lookRight = new BABYLON.Vector3(1, 0, 0);
    lookRight.normalize();
    const lookUp = BABYLON.Vector3.Cross(lookDir, lookRight).normalize();
    const targetQuat = BABYLON.Quaternion.RotationQuaternionFromAxis(lookRight, lookUp, lookDir);
    BABYLON.Quaternion.SlerpToRef(this.mesh.rotationQuaternion, targetQuat, 0.1, this.mesh.rotationQuaternion);

    // Engine light follows the back of the ship
    if (this.engineLight) {
      this.mesh.computeWorldMatrix(true);
      const worldMat = this.mesh.getWorldMatrix();
      const localOffset = new BABYLON.Vector3(0, 0, -22);
      this.engineLight.position = BABYLON.Vector3.TransformCoordinates(localOffset, worldMat);
      this.engineLight.intensity = 2.0 + Math.sin(totalTime * 8) * 0.4;
    }

    // Engine glow pulse based on speed
    if (this.engineMeshes) {
      const speed = this.velocity.length();
      const intensity = 0.7 + Math.min(1, speed / 20) * 0.5;
      for (const em of this.engineMeshes) {
        em.scaling.x = intensity;
        em.scaling.y = intensity;
      }
    }

    // Fire when ready
    const now = performance.now();
    if (!gameOver && now - this.lastFireTime > this.fireRate && distance < 220) {
      this.fire();
      this.lastFireTime = now;
    }

    // Update health bar
    const hp = Math.max(0, this.health / this.maxHealth);
    this.healthBarFill.width = `${hp * 100}%`;
    this.healthBarFill.background = hp < 0.3 ? "#ffaa00" : this.teamColor;

    // Hide health bar when far from camera or behind
    const distCam = BABYLON.Vector3.Distance(camera.position, this.mesh.position);
    this.healthBarContainer.isVisible = distCam < 450;
  }

  fire() {
    if (!this.target || !this.target.alive) return;
    const projectileCount = this.isFlagship ? 2 : 1;

    this.mesh.computeWorldMatrix(true);
    const worldMat = this.mesh.getWorldMatrix();
    const localZ = this.isFlagship ? 14 : 4;

    for (let i = 0; i < projectileCount; i++) {
      const sideOffset = projectileCount === 2 ? (i === 0 ? -3 : 3) : 0;
      const localOffset = new BABYLON.Vector3(sideOffset, 0, localZ);
      const startPos = BABYLON.Vector3.TransformCoordinates(localOffset, worldMat);

      const targetPos = this.target.mesh.position.clone();
      targetPos.x += (Math.random() - 0.5) * 3;
      targetPos.y += (Math.random() - 0.5) * 3;
      targetPos.z += (Math.random() - 0.5) * 3;

      const direction = targetPos.subtract(startPos).normalize();
      allProjectiles.push(new Projectile(this.team, startPos, direction));
    }

    // Muzzle flash
    const muzzlePos = BABYLON.Vector3.TransformCoordinates(new BABYLON.Vector3(0, 0, localZ), worldMat);
    createMuzzleFlash(muzzlePos, this.team);
  }

  takeDamage(dmg) {
    if (!this.alive) return;
    this.health -= dmg;
    if (this.health <= 0) this.explode();
  }

  explode() {
    if (this.exploded) return;
    this.exploded = true;
    this.alive = false;

    this.mesh.setEnabled(false);
    this.healthBarContainer.isVisible = false;

    createExplosion(this.mesh.position.clone(), this.team, this.isFlagship);

    // Chain reaction: ships within ~1.5x ship-width detonate
    const chainRadius = this.shipWidth * 1.5;
    for (const ship of allShips) {
      if (ship === this || !ship.alive) continue;
      const d = BABYLON.Vector3.Distance(ship.mesh.position, this.mesh.position);
      if (d < chainRadius) {
        // Slight delay for visual cascade
        setTimeout(() => ship.takeDamage(180), 60 + Math.random() * 120);
      }
    }

    updateFleetCounts();
    checkVictory();
  }

  dispose() {
    this.mesh.dispose();
    this.healthBarContainer.dispose();
    if (this.engineLight) this.engineLight.dispose();
  }
}

// ============================================================
//  PROJECTILE
// ============================================================
class Projectile {
  constructor(team, position, direction) {
    this.team = team;
    this.position = position.clone();
    this.direction = direction.clone();
    this.speed = 180;
    this.life = 3.5;
    this.damage = 25;
    this.alive = true;

    const mat = team === 0 ? matCache.blueProj : matCache.redProj;

    this.mesh = BABYLON.MeshBuilder.CreateSphere("proj", { diameter: 0.9, segments: 8 }, scene);
    this.mesh.material = mat;
    this.mesh.position = position.clone();
    this.mesh.isPickable = false;

    // Trail
    this.trail = new BABYLON.TrailMesh("trail", this.mesh, scene, 0.5, 40, true);
    const trailMat = new BABYLON.StandardMaterial("trailMat", scene);
    trailMat.emissiveColor = team === 0
      ? new BABYLON.Color3(0.3, 0.7, 1.0)
      : new BABYLON.Color3(1.0, 0.3, 0.15);
    trailMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    trailMat.disableLighting = true;
    trailMat.alpha = 0.7;
    this.trail.material = trailMat;

    // Occasional light for atmosphere
    if (Math.random() < 0.25) {
      this.light = new BABYLON.PointLight("plight", position.clone(), scene);
      this.light.diffuse = team === 0
        ? new BABYLON.Color3(0.3, 0.7, 1.0)
        : new BABYLON.Color3(1.0, 0.3, 0.15);
      this.light.intensity = 2;
      this.light.range = 14;
    }
  }

  update(dt) {
    if (!this.alive) return;

    this.position.addInPlace(this.direction.scale(this.speed * dt));
    this.mesh.position = this.position;
    if (this.light) this.light.position = this.position;

    this.life -= dt;
    if (this.life <= 0) { this.destroy(); return; }

    for (const ship of allShips) {
      if (ship.team === this.team || !ship.alive) continue;
      const d = BABYLON.Vector3.Distance(this.position, ship.mesh.position);
      if (d < ship.collisionRadius + 0.5) {
        ship.takeDamage(this.damage);
        createHitEffect(this.position.clone(), this.team);
        this.destroy();
        return;
      }
    }

    if (this.position.length() > 900) this.destroy();
  }

  destroy() {
    if (!this.alive) return;
    this.alive = false;
    if (this.trail) {
      this.trail.material.dispose();
      this.trail.dispose();
    }
    if (this.mesh) this.mesh.dispose();
    if (this.light) this.light.dispose();
  }
}

// ============================================================
//  EFFECTS — explosions, muzzle flashes, hit sparks
// ============================================================
function createExplosion(position, team, isFlagship) {
  const scale = isFlagship ? 2.5 : 1.0;
  const baseColor = team === 0 ? new BABYLON.Color3(0.4, 0.7, 1.0) : new BABYLON.Color3(1.0, 0.4, 0.2);
  const fireColor = new BABYLON.Color3(1.0, 0.7, 0.2);

  // Flash light
  const flashLight = new BABYLON.PointLight("flash", position.clone(), scene);
  flashLight.diffuse = new BABYLON.Color3(1, 0.9, 0.7);
  flashLight.intensity = 8 * scale;
  flashLight.range = 80 * scale;

  // Outer shockwave
  const shockwave = BABYLON.MeshBuilder.CreateSphere("shock", { diameter: 1, segments: 16 }, scene);
  shockwave.position = position.clone();
  const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
  shockMat.emissiveColor = baseColor;
  shockMat.alpha = 0.6;
  shockMat.disableLighting = true;
  shockMat.backFaceCulling = false;
  shockwave.material = shockMat;
  shockwave.isPickable = false;

  // Inner shockwave
  const shockwave2 = BABYLON.MeshBuilder.CreateSphere("shock2", { diameter: 1, segments: 12 }, scene);
  shockwave2.position = position.clone();
  const shockMat2 = new BABYLON.StandardMaterial("shockMat2", scene);
  shockMat2.emissiveColor = fireColor;
  shockMat2.alpha = 0.8;
  shockMat2.disableLighting = true;
  shockMat2.backFaceCulling = false;
  shockwave2.material = shockMat2;
  shockwave2.isPickable = false;

  // Fire particle system
  const ps = new BABYLON.ParticleSystem("particles", isFlagship ? 600 : 350, scene);
  ps.particleTexture = getParticleTexture();
  ps.emitter = position.clone();
  ps.minEmitBox = new BABYLON.Vector3(-0.5, -0.5, -0.5).scale(scale);
  ps.maxEmitBox = new BABYLON.Vector3(0.5, 0.5, 0.5).scale(scale);
  ps.color1 = fireColor;
  ps.color2 = baseColor;
  ps.colorDead = new BABYLON.Color3(0.2, 0.1, 0.05);
  ps.minSize = 0.6 * scale;
  ps.maxSize = 2.5 * scale;
  ps.minLifeTime = 0.4;
  ps.maxLifeTime = 1.3;
  ps.emitRate = 1500;
  ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps.direction1 = new BABYLON.Vector3(-25, -25, -25).scale(scale);
  ps.direction2 = new BABYLON.Vector3(25, 25, 25).scale(scale);
  ps.minAngularSpeed = -3;
  ps.maxAngularSpeed = 3;
  ps.minEmitPower = 8 * scale;
  ps.maxEmitPower = 25 * scale;
  ps.updateSpeed = 0.016;
  ps.start();

  // Spark system
  const ss = new BABYLON.ParticleSystem("sparks", isFlagship ? 300 : 150, scene);
  ss.particleTexture = getParticleTexture();
  ss.emitter = position.clone();
  ss.minEmitBox = new BABYLON.Vector3(0, 0, 0);
  ss.maxEmitBox = new BABYLON.Vector3(0, 0, 0);
  ss.color1 = new BABYLON.Color3(1, 1, 0.9);
  ss.color2 = fireColor;
  ss.colorDead = new BABYLON.Color3(0.3, 0.1, 0);
  ss.minSize = 0.15;
  ss.maxSize = 0.5;
  ss.minLifeTime = 0.6;
  ss.maxLifeTime = 1.8;
  ss.emitRate = 600;
  ss.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  ss.direction1 = new BABYLON.Vector3(-40, -40, -40).scale(scale);
  ss.direction2 = new BABYLON.Vector3(40, 40, 40).scale(scale);
  ss.minEmitPower = 15 * scale;
  ss.maxEmitPower = 45 * scale;
  ss.updateSpeed = 0.016;
  ss.start();

  // Debris
  const debris = [];
  const debrisCount = isFlagship ? 25 : 12;
  for (let i = 0; i < debrisCount; i++) {
    const size = (0.3 + Math.random() * 0.6) * scale;
    const piece = BABYLON.MeshBuilder.CreateBox("debris", { size: size }, scene);
    piece.position = position.clone();
    const dMat = new BABYLON.StandardMaterial("dMat", scene);
    dMat.emissiveColor = baseColor.scale(0.4).add(fireColor.scale(0.2));
    dMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
    piece.material = dMat;
    piece.isPickable = false;

    const dir = new BABYLON.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
    const d = {
      mesh: piece,
      velocity: dir.scale(8 + Math.random() * 15),
      angVel: new BABYLON.Vector3((Math.random()-0.5)*12, (Math.random()-0.5)*12, (Math.random()-0.5)*12),
      life: 1.5 + Math.random() * 1.5,
      maxLife: 0
    };
    d.maxLife = d.life;
    debris.push(d);
  }

  let life = 0;
  let stopped = false;

  effects.push({
    update(dt) {
      life += dt;
      flashLight.intensity = Math.max(0, 8 * scale * (1 - life * 1.5));

      const s1 = life * 30 * scale;
      if (s1 > 0.1) shockwave.scaling.setAll(s1);
      shockMat.alpha = Math.max(0, 0.6 * (1 - life));

      const s2 = life * 22 * scale;
      if (s2 > 0.1) shockwave2.scaling.setAll(s2);
      shockMat2.alpha = Math.max(0, 0.8 * (1 - life * 1.8));

      if (!stopped && life > 0.25) { ps.stop(); ss.stop(); stopped = true; }

      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.mesh.position.addInPlace(d.velocity.scale(dt));
        d.velocity.scaleInPlace(0.96);
        d.mesh.rotation.x += d.angVel.x * dt;
        d.mesh.rotation.y += d.angVel.y * dt;
        d.mesh.rotation.z += d.angVel.z * dt;
        d.life -= dt;
        if (d.life <= 0) {
          d.mesh.material.dispose();
          d.mesh.dispose();
          debris.splice(i, 1);
        } else {
          d.mesh.visibility = Math.max(0, d.life / d.maxLife);
        }
      }

      if (life > 3 && debris.length === 0) return false;
      return true;
    },
    dispose() {
      flashLight.dispose();
      shockwave.dispose(); shockMat.dispose();
      shockwave2.dispose(); shockMat2.dispose();
      ps.dispose(); ss.dispose();
      for (const d of debris) {
        if (d.mesh) { d.mesh.material.dispose(); d.mesh.dispose(); }
      }
    }
  });
}

function createMuzzleFlash(position, team) {
  const color = team === 0 ? new BABYLON.Color3(0.4, 0.8, 1.0) : new BABYLON.Color3(1.0, 0.4, 0.2);
  const flashLight = new BABYLON.PointLight("muzzle", position.clone(), scene);
  flashLight.diffuse = color;
  flashLight.intensity = 4;
  flashLight.range = 18;

  let life = 0;
  effects.push({
    update(dt) {
      life += dt;
      flashLight.intensity = Math.max(0, 4 * (1 - life * 6));
      if (life > 0.2) return false;
      return true;
    },
    dispose() { flashLight.dispose(); }
  });
}

function createHitEffect(position, team) {
  const color = team === 0 ? new BABYLON.Color3(0.4, 0.8, 1.0) : new BABYLON.Color3(1.0, 0.4, 0.2);
  const ss = new BABYLON.ParticleSystem("hitSparks", 80, scene);
  ss.particleTexture = getParticleTexture();
  ss.emitter = position.clone();
  ss.minEmitBox = new BABYLON.Vector3(0,0,0);
  ss.maxEmitBox = new BABYLON.Vector3(0,0,0);
  ss.color1 = new BABYLON.Color3(1, 1, 0.9);
  ss.color2 = color;
  ss.colorDead = new BABYLON.Color3(0.3, 0.1, 0);
  ss.minSize = 0.15;
  ss.maxSize = 0.4;
  ss.minLifeTime = 0.2;
  ss.maxLifeTime = 0.6;
  ss.emitRate = 400;
  ss.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  ss.direction1 = new BABYLON.Vector3(-15, -15, -15);
  ss.direction2 = new BABYLON.Vector3(15, 15, 15);
  ss.minEmitPower = 5;
  ss.maxEmitPower = 15;
  ss.updateSpeed = 0.016;
  ss.start();

  let life = 0, stopped = false;
  effects.push({
    update(dt) {
      life += dt;
      if (!stopped && life > 0.05) { ss.stop(); stopped = true; }
      if (life > 1) return false;
      return true;
    },
    dispose() { ss.dispose(); }
  });
}

// ============================================================
//  FLEET CREATION
// ============================================================
function createFleet(team, flagshipPos) {
  const ships = [];
  ships.push(new Ship(team, true, flagshipPos));

  const xSign = team === 0 ? 1 : -1;
  const offsets = [
    new BABYLON.Vector3(15 * xSign, 5, -25),
    new BABYLON.Vector3(15 * xSign, -5, -25),
    new BABYLON.Vector3(15 * xSign, 5, 0),
    new BABYLON.Vector3(15 * xSign, -5, 0),
    new BABYLON.Vector3(15 * xSign, 5, 25),
    new BABYLON.Vector3(15 * xSign, -5, 25),
    new BABYLON.Vector3(15 * xSign, 12, -12),
    new BABYLON.Vector3(15 * xSign, -12, 12),
    new BABYLON.Vector3(22 * xSign, 0, 0)
  ];

  for (const offset of offsets) {
    ships.push(new Ship(team, false, flagshipPos.add(offset)));
  }
  return ships;
}

const blueFleet = createFleet(0, new BABYLON.Vector3(-95, 0, 0));
const redFleet = createFleet(1, new BABYLON.Vector3(95, 0, 0));
allShips.push(...blueFleet, ...redFleet);

// ============================================================
//  UI / VICTORY
// ============================================================
function updateFleetCounts() {
  const blueAlive = allShips.filter(s => s.team === 0 && s.alive).length;
  const redAlive = allShips.filter(s => s.team === 1 && s.alive).length;
  document.getElementById("blueCount").textContent = blueAlive;
  document.getElementById("redCount").textContent = redAlive;
}

function checkVictory() {
  if (gameOver) return;
  const blueAlive = allShips.filter(s => s.team === 0 && s.alive).length;
  const redAlive = allShips.filter(s => s.team === 1 && s.alive).length;
  if (blueAlive === 0 || redAlive === 0) {
    gameOver = true;
    const winner = blueAlive > 0 ? "AZURE FLEET" : "CRIMSON FLEET";
    const winnerColor = blueAlive > 0 ? "#00d4ff" : "#ff3850";
    const vEl = document.getElementById("victory");
    vEl.textContent = `${winner} VICTORIOUS`;
    vEl.style.color = winnerColor;
    setTimeout(() => {
      vEl.classList.add("show");
      document.getElementById("restart").classList.add("show");
    }, 900);
  }
}

// ============================================================
//  GAME LOOP
// ============================================================
let lastTime = performance.now();
scene.onBeforeRenderObservable.add(() => {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  totalTime += dt;

  for (const ship of allShips) ship.update(dt);

  for (let i = allProjectiles.length - 1; i >= 0; i--) {
    allProjectiles[i].update(dt);
    if (!allProjectiles[i].alive) allProjectiles.splice(i, 1);
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    if (!effects[i].update(dt)) {
      effects[i].dispose();
      effects.splice(i, 1);
    }
  }
});

engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());

document.getElementById("restart").addEventListener("click", () => location.reload());

scene.executeWhenReady(() => {
  setTimeout(() => document.getElementById("loader").classList.add("hide"), 500);
});
</script>
