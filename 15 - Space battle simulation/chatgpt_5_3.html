<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Babylon.js Space Battle</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:black;}
#renderCanvas{width:100%;height:100%;touch-action:none;}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);

const createScene = () => {
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0,0,0,1);

/* CAMERA */
const camera = new BABYLON.ArcRotateCamera("cam",
Math.PI/2, Math.PI/3, 120, new BABYLON.Vector3(0,0,0), scene);
camera.attachControl(canvas,true);

/* LIGHT */
const light = new BABYLON.HemisphericLight("h",
new BABYLON.Vector3(0,1,0),scene);
light.intensity = 0.6;

/* STARFIELD */
const stars = new BABYLON.PointsCloudSystem("pcs",1,scene);
stars.addPoints(2000,(p)=>{
p.position = new BABYLON.Vector3(
(Math.random()-0.5)*600,
(Math.random()-0.5)*600,
(Math.random()-0.5)*600);
});
stars.buildMeshAsync();

/* MATERIALS */
const blueMat = new BABYLON.StandardMaterial("b",scene);
blueMat.emissiveColor = new BABYLON.Color3(0.2,0.6,1);

const redMat = new BABYLON.StandardMaterial("r",scene);
redMat.emissiveColor = new BABYLON.Color3(1,0.3,0.3);

/* SHIP CLASS */
class Ship{
constructor(pos,team,isFlagship=false){
this.team = team;
this.isFlagship = isFlagship;
this.health = isFlagship ? 300 : 100;

this.mesh = BABYLON.MeshBuilder.CreateBox("ship",
{size:isFlagship?4:2},scene);
this.mesh.position = pos.clone();

this.mesh.material = team===0?blueMat:redMat;

this.velocity = new BABYLON.Vector3(
(Math.random()-0.5),
(Math.random()-0.5),
(Math.random()-0.5));

this.lastFire = 0;

this.createHealthBar();
}

createHealthBar(){
this.gui = BABYLON.MeshBuilder.CreatePlane("hb",{size:4},scene);
this.gui.position.y = 4;
this.gui.parent = this.mesh;

const mat = new BABYLON.StandardMaterial("hm",scene);
mat.emissiveColor = new BABYLON.Color3(0,1,0);
this.gui.material = mat;
}

update(dt){
this.mesh.position.addInPlace(this.velocity.scale(dt));
this.velocity.addInPlace(new BABYLON.Vector3(
(Math.random()-0.5)*0.02,
(Math.random()-0.5)*0.02,
(Math.random()-0.5)*0.02));

this.mesh.lookAt(this.mesh.position.add(this.velocity));

this.gui.scaling.x = this.health / (this.isFlagship?300:100);
}

damage(d){
this.health -= d;
if(this.health<=0){
explode(this);
}
}
}

/* PROJECTILES */
const projectiles = [];
function fire(ship){
const dir = ship.mesh.forward;
const p = BABYLON.MeshBuilder.CreateSphere("p",{diameter:0.5},scene);
p.position = ship.mesh.position.clone();

const mat = new BABYLON.StandardMaterial("pm",scene);
mat.emissiveColor = ship.team===0?
new BABYLON.Color3(0,0.6,1):
new BABYLON.Color3(1,0.2,0.2);
p.material = mat;

projectiles.push({
mesh:p,
dir:dir.clone(),
team:ship.team
});
}

/* EXPLOSION */
function explode(ship){
const pos = ship.mesh.position.clone();

const ps = new BABYLON.ParticleSystem("exp",500,scene);
ps.particleTexture = new BABYLON.Texture(
"https://playground.babylonjs.com/textures/flare.png",scene);
ps.emitter = pos;
ps.minEmitBox = new BABYLON.Vector3(-1,-1,-1);
ps.maxEmitBox = new BABYLON.Vector3(1,1,1);
ps.color1 = new BABYLON.Color4(1,0.5,0,1);
ps.color2 = new BABYLON.Color4(1,0,0,1);
ps.minSize = 0.5;
ps.maxSize = 2;
ps.minLifeTime = 0.3;
ps.maxLifeTime = 1.5;
ps.emitRate = 1000;
ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
ps.gravity = new BABYLON.Vector3(0,0,0);
ps.direction1 = new BABYLON.Vector3(-5,5,-5);
ps.direction2 = new BABYLON.Vector3(5,5,5);
ps.minEmitPower = 1;
ps.maxEmitPower = 5;
ps.updateSpeed = 0.01;
ps.start();

setTimeout(()=>ps.stop(),300);

ships.forEach(s=>{
if(s!==ship){
const dist = BABYLON.Vector3.Distance(s.mesh.position,pos);
if(dist<5){
explode(s);
}
}
});

scene.removeMesh(ship.mesh);
}

/* CREATE FLEETS */
const ships = [];

function createFleet(x,team){
for(let i=0;i<10;i++){
const isFlagship = i===0;
const pos = new BABYLON.Vector3(
x,
(Math.random()-0.5)*20,
(Math.random()-0.5)*20);
ships.push(new Ship(pos,team,isFlagship));
}
}

createFleet(-30,0);
createFleet(30,1);

/* GAME LOOP */
scene.onBeforeRenderObservable.add(()=>{
const dt = engine.getDeltaTime()*0.001;

ships.forEach(ship=>{
ship.update(dt);

ship.lastFire += dt;
if(ship.lastFire>3){
fire(ship);
if(ship.isFlagship) fire(ship);
ship.lastFire = 0;
}
});

/* PROJECTILE UPDATE */
projectiles.forEach((p,i)=>{
p.mesh.position.addInPlace(p.dir.scale(1));

ships.forEach(s=>{
if(s.team!==p.team){
if(BABYLON.Vector3.Distance(p.mesh.position,s.mesh.position)<2){
s.damage(50);
scene.removeMesh(p.mesh);
projectiles.splice(i,1);
}
}
});
});

});

return scene;
};

const scene = createScene();
engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>

</body>
</html>
