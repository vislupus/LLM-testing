<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Space Battle</title>
    <style>
        html, body, canvas { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = () => {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0, 0, 0.1);

            const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 4, 100, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            const background = new BABYLON.Layer("background", "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/starfield.jpg", scene);

            const fleets = [
                { color: new BABYLON.Color3(0, 0, 1), position: new BABYLON.Vector3(-50, 0, 0) },
                { color: new BABYLON.Color3(1, 0, 0), position: new BABYLON.Vector3(50, 0, 0) }
            ];

            fleets.forEach((fleet, fleetIndex) => {
                const flagship = BABYLON.MeshBuilder.CreateBox(`flagship-${fleetIndex}`, { size: 5 }, scene);
                flagship.position = fleet.position;
                flagship.health = 100;
                flagship.material = new BABYLON.StandardMaterial(`flagship-mat-${fleetIndex}`, scene);
                flagship.material.emissiveColor = fleet.color;

                const flagshipHealthBar = createHealthBar(flagship, scene);

                for (let i = 0; i < 9; i++) {
                    const escort = BABYLON.MeshBuilder.CreateBox(`escort-${fleetIndex}-${i}`, { size: 2 }, scene);
                    escort.position = new BABYLON.Vector3(
                        fleet.position.x + Math.sin(i * Math.PI / 4.5) * 10,
                        fleet.position.y + Math.sin(i * Math.PI / 4.5) * 5,
                        fleet.position.z + Math.cos(i * Math.PI / 4.5) * 10
                    );
                    escort.health = 50;
                    escort.material = new BABYLON.StandardMaterial(`escort-mat-${fleetIndex}-${i}`, scene);
                    escort.material.emissiveColor = fleet.color;

                    const escortHealthBar = createHealthBar(escort, scene);
                }
            });

            scene.registerBeforeRender(() => {
                scene.meshes.forEach(mesh => {
                    if (mesh.name.startsWith("flagship") || mesh.name.startsWith("escort")) {
                        mesh.position.x += Math.sin(mesh.position.y * 0.1) * 0.05;
                        mesh.position.y += Math.cos(mesh.position.x * 0.1) * 0.05;
                        mesh.rotation.y += 0.01;
                        mesh.rotation.z += 0.01;

                        if (mesh.health <= 0) {
                            explodeShip(mesh, scene);
                            scene.meshes.forEach(otherMesh => {
                                if (otherMesh !== mesh && BABYLON.Vector3.Distance(otherMesh.position, mesh.position) < mesh.getBoundingInfo().boundingBox.extendSize.length()) {
                                    explodeShip(otherMesh, scene);
                                }
                            });
                        }
                    }
                });
            });

            scene.registerAfterRender(() => {
                scene.meshes.forEach(mesh => {
                    if (mesh.name.startsWith("flagship") && mesh.health > 0) {
                        for (let i = 0; i < 2; i++) {
                            createProjectile(mesh, scene);
                        }
                    } else if (mesh.name.startsWith("escort") && mesh.health > 0) {
                        createProjectile(mesh, scene);
                    }
                });
            });

            return scene;
        };

        const createHealthBar = (mesh, scene) => {
            const healthBarMaterial = new BABYLON.StandardMaterial("healthBarMaterial", scene);
            healthBarMaterial.emissiveColor = BABYLON.Color3.Green();

            const healthBarMesh = BABYLON.MeshBuilder.CreatePlane(`healthBar-${mesh.name}`, { width: mesh.getBoundingInfo().boundingBox.extendSize.x * 2, height: 0.2 }, scene);
            healthBarMesh.material = healthBarMaterial;
            healthBarMesh.position = new BABYLON.Vector3(mesh.position.x, mesh.position.y + mesh.getBoundingInfo().boundingBox.extendSize.y + 0.5, mesh.position.z);
            healthBarMesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

            scene.registerBeforeRender(() => {
                healthBarMesh.scaling.x = mesh.health / 100;
                healthBarMesh.position.x = mesh.position.x;
                healthBarMesh.position.y = mesh.position.y + mesh.getBoundingInfo().boundingBox.extendSize.y + 0.5;
                healthBarMesh.position.z = mesh.position.z;

                if (mesh.health <= 50) {
                    healthBarMaterial.emissiveColor = BABYLON.Color3.Yellow();
                }
                if (mesh.health <= 25) {
                    healthBarMaterial.emissiveColor = BABYLON.Color3.Red();
                }
            });

            return healthBarMesh;
        };

        const createProjectile = (mesh, scene) => {
            const projectile = BABYLON.MeshBuilder.CreateSphere(`projectile-${mesh.name}-${Math.random()}`, { diameter: 0.5 }, scene);
            projectile.position = mesh.position.clone();
            projectile.material = new BABYLON.StandardMaterial(`projectileMaterial-${mesh.name}`, scene);
            projectile.material.emissiveColor = mesh.material.emissiveColor.clone();
            projectile.material.alpha = 0.7;

            const direction = mesh.getDirection(BABYLON.Axis.Z).scale(10);
            const startPosition = mesh.getAbsolutePosition().clone();
            const endPosition = startPosition.add(direction);

            const speed = 5;
            const distance = BABYLON.Vector3.Distance(startPosition, endPosition);
            const duration = distance / speed;

            BABYLON.Animation.CreateAndStartAnimation(`anim-${projectile.name}`, projectile, "position", 60, Math.floor(duration * 60), startPosition, endPosition, 0, null, () => {
                projectile.dispose();
            });

            const particleSystem = new BABYLON.ParticleSystem(`particles-${projectile.name}`, 100, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://raw.githubusercontent.com/PatrickRyanMS/BabylonJStextures/master/FFV/flare.png", scene);
            particleSystem.emitter = projectile;
            particleSystem.minEmitBox = new BABYLON.Vector3(-0.1, -0.1, -0.1);
            particleSystem.maxEmitBox = new BABYLON.Vector3(0.1, 0.1, 0.1);
            particleSystem.color1 = mesh.material.emissiveColor.clone();
            particleSystem.color2 = mesh.material.emissiveColor.clone();
            particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0.5);
            particleSystem.minSize = 0.1;
            particleSystem.maxSize = 0.2;
            particleSystem.minLifeTime = 0.1;
            particleSystem.maxLifeTime = 0.3;
            particleSystem.emitRate = 100;
            particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            particleSystem.start();

            projectile.onCollide = (collidedMesh) => {
                if (collidedMesh.name.startsWith("flagship") || collidedMesh.name.startsWith("escort")) {
                    collidedMesh.health -= 10;
                    projectile.dispose();
                    particleSystem.dispose();
                }
            };
        };

        const explodeShip = (mesh, scene) => {
            mesh.dispose();

            const explosion = BABYLON.MeshBuilder.CreateSphere(`explosion-${mesh.name}`, { diameter: mesh.getBoundingInfo().boundingBox.extendSize.length() * 2 }, scene);
            explosion.position = mesh.position.clone();
            explosion.material = new BABYLON.StandardMaterial(`explosionMaterial-${mesh.name}`, scene);
            explosion.material.diffuseTexture = new BABYLON.Texture("https://raw.githubusercontent.com/PatrickRyanMS/BabylonJStextures/master/FFV/ffv-explosion.png", scene);
            explosion.material.opacityTexture = new BABYLON.Texture("https://raw.githubusercontent.com/PatrickRyanMS/BabylonJStextures/master/FFV/ffv-explosion.png", scene);
            explosion.material.emissiveColor = BABYLON.Color3.White();
            explosion.material.alpha = 0.5;

            const particleSystem = new BABYLON.ParticleSystem(`particles-${explosion.name}`, 500, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://raw.githubusercontent.com/PatrickRyanMS/BabylonJStextures/master/FFV/smokeParticle.png", scene);
            particleSystem.emitter = explosion;
            particleSystem.minEmitBox = new BABYLON.Vector3(-1, -1, -1);
            particleSystem.maxEmitBox = new BABYLON.Vector3(1, 1, 1);
            particleSystem.color1 = new BABYLON.Color4(0.8, 0.8, 0.8, 1.0);
            particleSystem.color2 = new BABYLON.Color4(0.5, 0.5, 0.5, 1.0);
            particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0.5);
            particleSystem.minSize = 0.5;
            particleSystem.maxSize = 1;
            particleSystem.minLifeTime = 0.5;
            particleSystem.maxLifeTime = 1.5;
            particleSystem.emitRate = 500;
            particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            particleSystem.start();

            setTimeout(() => {
                explosion.dispose();
                particleSystem.dispose();
            }, 1000);
        };

        const scene = createScene();

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
