<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Battle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 32px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .fleet-status {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .fleet-panel {
            background: rgba(10, 10, 20, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 16px 24px;
            min-width: 180px;
            backdrop-filter: blur(10px);
        }

        .fleet-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .blue-fleet .fleet-name { color: #00d4ff; }
        .red-fleet .fleet-name { color: #ff4444; }

        .fleet-ships {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
        }

        .blue-fleet .fleet-ships { color: #00d4ff; }
        .red-fleet .fleet-ships { color: #ff4444; }

        .title-center {
            text-align: center;
            flex: 1;
        }

        .title-center h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255,255,255,0.3);
        }

        .title-center p {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            margin-top: 6px;
        }

        .controls-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px 24px;
            backdrop-filter: blur(10px);
        }

        .controls-hint span {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            margin: 0 12px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div class="ui-overlay">
        <div class="header">
            <div class="fleet-status">
                <div class="fleet-panel blue-fleet">
                    <div class="fleet-name">Blue Fleet</div>
                    <div class="fleet-ships" id="blueCount">10</div>
                </div>
            </div>

            <div class="title-center">
                <h1>SPACE BATTLE</h1>
                <p>Fleet Combat Simulation</p>
            </div>

            <div class="fleet-status">
                <div class="fleet-panel red-fleet">
                    <div class="fleet-name">Red Fleet</div>
                    <div class="fleet-ships" id="redCount">10</div>
                </div>
            </div>
        </div>

        <div class="controls-hint">
            <span>Drag to rotate</span>
            <span>Scroll to zoom</span>
            <span>Right-drag to pan</span>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

    <script>
        const CONFIG = {
            fleetSpacing: 120,
            escortCount: 9,
            escortRadius: 25,
            flagshipSize: { w: 4, h: 1.2, d: 2 },
            escortSize: { w: 1.5, h: 0.5, d: 0.8 },
            projectileSpeed: 60,
            escortFireRate: 3000,
            flagshipFireRate: 3000,
            escortHealth: 100,
            flagshipHealth: 300,
            damage: 25,
            explosionRadius: 8,
            chainRadius: 6
        };

        const BLUE_TEAM = 'blue';
        const RED_TEAM = 'red';

        class Ship {
            constructor(scene, team, isFlagship, position, index) {
                this.scene = scene;
                this.team = team;
                this.isFlagship = isFlagship;
                this.index = index;
                this.health = isFlagship ? CONFIG.flagshipHealth : CONFIG.escortHealth;
                this.maxHealth = this.health;
                this.alive = true;
                this.lastFire = 0;
                this.target = null;

                this.mesh = this.createMesh();
                this.mesh.position = position.clone();
                this.mesh.shipRef = this;

                this.velocity = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.5
                );

                this.createHealthBar();
                this.createEngineLights();
            }

            createMesh() {
                const color = this.team === BLUE_TEAM
                    ? new BABYLON.Color3(0.2, 0.6, 0.9)
                    : new BABYLON.Color3(0.9, 0.3, 0.2);

                let mesh;
                if (this.isFlagship) {
                    mesh = this.createFlagshipMesh(color);
                } else {
                    mesh = this.createEscortMesh(color);
                }

                return mesh;
            }

            createFlagshipMesh(color) {
                const root = new BABYLON.TransformNode("flagship_" + this.team + "_" + this.index, this.scene);

                // Main hull
                const hull = BABYLON.MeshBuilder.CreateCylinder("hull", {
                    height: 8,
                    diameterTop: 1.5,
                    diameterBottom: 2.5,
                    tessellation: 8
                }, this.scene);
                hull.rotation.x = Math.PI / 2;
                hull.parent = root;

                const mat = new BABYLON.StandardMaterial("hullMat", this.scene);
                mat.diffuseColor = color;
                mat.emissiveColor = color.scale(0.3);
                mat.specularColor = new BABYLON.Color3(0.8, 0.8, 0.8);
                hull.material = mat;

                // Bridge dome
                const bridge = BABYLON.MeshBuilder.CreateSphere("bridge", { diameter: 1.5 }, this.scene);
                bridge.position = new BABYLON.Vector3(0, 0.6, -1);
                bridge.scaling = new BABYLON.Vector3(1, 0.6, 1);
                bridge.parent = root;

                const bridgeMat = new BABYLON.StandardMaterial("bridgeMat", this.scene);
                bridgeMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.4);
                bridgeMat.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.15);
                bridge.material = bridgeMat;

                // Wings
                for (let side = -1; side <= 1; side += 2) {
                    const wing = BABYLON.MeshBuilder.CreateBox("wing" + side, {
                        width: 0.2, height: 0.1, depth: 4
                    }, this.scene);
                    wing.position = new BABYLON.Vector3(side * 3, 0, 0.5);
                    wing.rotation.z = side * 0.3;
                    wing.material = mat;
                    wing.parent = root;
                }

                // Engine pods
                const enginePositions = [
                    new BABYLON.Vector3(0, 0, 4.5),
                    new BABYLON.Vector3(-1.5, 0, 3.5),
                    new BABYLON.Vector3(1.5, 0, 3.5)
                ];

                this.engines = [];
                enginePositions.forEach((pos, i) => {
                    const engine = BABYLON.MeshBuilder.CreateCylinder("engine" + i, {
                        height: 1.5,
                        diameter: 0.8,
                        tessellation: 12
                    }, this.scene);
                    engine.rotation.x = Math.PI / 2;
                    engine.position = pos;
                    engine.parent = root;

                    const engineMat = new BABYLON.StandardMaterial("engineMat", this.scene);
                    engineMat.emissiveColor = this.team === BLUE_TEAM
                        ? new BABYLON.Color3(0, 0.5, 1)
                        : new BABYLON.Color3(1, 0.3, 0);
                    engine.material = engineMat;
                    this.engines.push(engine);
                });

                return root;
            }

            createEscortMesh(color) {
                const root = new BABYLON.TransformNode("escort_" + this.team + "_" + this.index, this.scene);

                // Main hull
                const hull = BABYLON.MeshBuilder.CreateCylinder("hull", {
                    height: 2,
                    diameterTop: 0.4,
                    diameterBottom: 0.8,
                    tessellation: 6
                }, this.scene);
                hull.rotation.x = Math.PI / 2;
                hull.parent = root;

                const mat = new BABYLON.StandardMaterial("escortMat", this.scene);
                mat.diffuseColor = color;
                mat.emissiveColor = color.scale(0.2);
                mat.specularColor = new BABYLON.Color3(0.6, 0.6, 0.6);
                hull.material = mat;

                // Wings
                for (let side = -1; side <= 1; side += 2) {
                    const wing = BABYLON.MeshBuilder.CreateBox("wing" + side, {
                        width: 0.1, height: 0.05, depth: 1.2
                    }, this.scene);
                    wing.position = new BABYLON.Vector3(side * 0.8, 0, 0);
                    wing.material = mat;
                    wing.parent = root;
                }

                // Single engine
                const engine = BABYLON.MeshBuilder.CreateCylinder("engine", {
                    height: 0.6,
                    diameter: 0.4,
                    tessellation: 8
                }, this.scene);
                engine.rotation.x = Math.PI / 2;
                engine.position = new BABYLON.Vector3(0, 0, 1.2);
                engine.parent = root;

                const engineMat = new BABYLON.StandardMaterial("escortEngineMat", this.scene);
                engineMat.emissiveColor = this.team === BLUE_TEAM
                    ? new BABYLON.Color3(0, 0.6, 1)
                    : new BABYLON.Color3(1, 0.4, 0);
                engine.material = engineMat;
                this.engines = [engine];

                return root;
            }

            createHealthBar() {
                const ui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("shipUI");

                const container = new BABYLON.GUI.Rectangle("healthContainer");
                container.width = this.isFlagship ? "60px" : "30px";
                container.height = "8px";
                container.cornerRadius = 2;
                container.color = "rgba(255,255,255,0.3)";
                container.thickness = 1;
                container.background = "rgba(0,0,0,0.5)";
                container.linkOffsetY = -this.getHeight() * 2;
                ui.addControl(container);
                container.linkWithMesh(this.mesh);

                this.healthBar = new BABYLON.GUI.Rectangle("healthBar");
                this.healthBar.width = "100%";
                this.healthBar.height = "100%";
                this.healthBar.cornerRadius = 2;
                this.healthBar.background = "#00ff00";
                this.healthBar.color = "transparent";
                container.addControl(this.healthBar);

                this.healthText = new BABYLON.GUI.TextBlock("healthText");
                this.healthText.text = Math.ceil(this.health) + "";
                this.healthText.color = "#fff";
                this.healthText.fontSize = this.isFlagship ? 10 : 7;
                this.healthText.fontFamily = "Orbitron";
                container.addControl(this.healthText);
            }

            getHeight() {
                return this.isFlagship ? 2 : 0.8;
            }

            createEngineLights() {
                this.engineLights = [];
                this.engines.forEach((engine, i) => {
                    const light = new BABYLON.PointLight(
                        "engineLight_" + this.index + "_" + i,
                        engine.getAbsolutePosition(),
                        this.scene
                    );
                    light.diffuse = this.team === BLUE_TEAM
                        ? new BABYLON.Color3(0, 0.5, 1)
                        : new BABYLON.Color3(1, 0.3, 0);
                    light.intensity = 0.5;
                    light.range = 8;
                    this.engineLights.push(light);
                });
            }

            update(deltaTime, enemies) {
                if (!this.alive) return;

                // Find nearest enemy
                let nearestDist = Infinity;
                this.target = null;
                enemies.forEach(enemy => {
                    if (enemy.alive) {
                        const dist = BABYLON.Vector3.Distance(
                            this.mesh.position, enemy.mesh.position
                        );
                        if (dist < nearestDist) {
                            nearestDist = dist;
                            this.target = enemy;
                        }
                    }
                });

                // Move and maneuver
                const time = performance.now() * 0.001;
                const orbitSpeed = 0.3;
                const orbitOffset = this.index * 0.7;

                this.velocity.x += (Math.random() - 0.5) * 0.1;
                this.velocity.y += (Math.random() - 0.5) * 0.05;
                this.velocity.z += (Math.random() - 0.5) * 0.1;
                this.velocity.scaleInPlace(0.98);

                this.mesh.position.addInPlace(this.velocity.scale(deltaTime * 0.05));

                // Rotate to face target
                if (this.target) {
                    const direction = this.target.mesh.position.subtract(this.mesh.position).normalize();
                    const targetRotation = Math.atan2(direction.x, direction.z);
                    this.mesh.rotation.y = BABYLON.Scalar.LerpAngle(this.mesh.rotation.y, targetRotation, 0.02);

                    const upDown = Math.sin(time + orbitOffset) * 0.02;
                    this.mesh.rotation.x = BABYLON.Scalar.Lerp(this.mesh.rotation.x, upDown, 0.05);
                }

                // Update engine lights
                this.engineLights.forEach((light, i) => {
                    light.position = this.engines[i].getAbsolutePosition();
                });
            }

            takeDamage(amount) {
                this.health -= amount;
                const healthPercent = this.health / this.maxHealth;

                if (healthPercent > 0.5) {
                    this.healthBar.background = "#00ff00";
                } else if (healthPercent > 0.25) {
                    this.healthBar.background = "#ffff00";
                } else {
                    this.healthBar.background = "#ff0000";
                }

                this.healthBar.width = (healthPercent * 100) + "%";
                this.healthText.text = Math.ceil(Math.max(0, this.health)) + "";

                if (this.health <= 0 && this.alive) {
                    this.alive = false;
                    return true;
                }
                return false;
            }

            canFire(now) {
                const fireRate = this.isFlagship ? CONFIG.flagshipFireRate : CONFIG.escortFireRate;
                return now - this.lastFire >= fireRate;
            }

            getProjectileOrigin() {
                return this.mesh.position.add(this.mesh.forward.scale(this.getHeight() * 2));
            }

            getForwardDirection() {
                return new BABYLON.Vector3(
                    Math.sin(this.mesh.rotation.y),
                    0,
                    Math.cos(this.mesh.rotation.y)
                );
            }
        }

        class Projectile {
            constructor(scene, team, origin, direction) {
                this.scene = scene;
                this.team = team;
                this.alive = true;
                this.startPos = origin.clone();

                this.mesh = BABYLON.MeshBuilder.CreateSphere("projectile", { diameter: 0.4 }, scene);
                this.mesh.position = origin.clone();

                const color = team === BLUE_TEAM
                    ? new BABYLON.Color3(0.2, 0.7, 1)
                    : new BABYLON.Color3(1, 0.4, 0.1);

                const mat = new BABYLON.StandardMaterial("projMat", scene);
                mat.emissiveColor = color;
                mat.disableLighting = true;
                this.mesh.material = mat;

                this.velocity = direction.normalize().scale(CONFIG.projectileSpeed);
                this.direction = direction.normalize();

                // Trail
                this.createTrail();

                // Light
                this.light = new BABYLON.PointLight("projLight", origin.clone(), scene);
                this.light.diffuse = color;
                this.light.intensity = 1;
                this.light.range = 10;
            }

            createTrail() {
                const color = this.team === BLUE_TEAM
                    ? new BABYLON.Color3(0, 0.4, 0.8)
                    : new BABYLON.Color3(0.8, 0.2, 0);

                const trail = BABYLON.MeshBuilder.CreateCylinder("trail", {
                    height: 3,
                    diameterTop: 0.05,
                    diameterBottom: 0.3,
                    tessellation: 8
                }, this.scene);
                trail.rotation.x = Math.PI / 2;
                trail.parent = this.mesh;
                trail.position = new BABYLON.Vector3(0, 0, 1.5);

                const trailMat = new BABYLON.StandardMaterial("trailMat", this.scene);
                trailMat.emissiveColor = color;
                trailMat.alpha = 0.6;
                trailMat.disableLighting = true;
                trail.material = trailMat;
                this.trail = trail;
            }

            update(deltaTime) {
                if (!this.alive) return;

                this.mesh.position.addInPlace(this.velocity.scale(deltaTime));
                this.light.position = this.mesh.position.clone();

                // Remove if too far
                if (BABYLON.Vector3.Distance(this.mesh.position, this.startPos) > 300) {
                    this.destroy();
                }
            }

            destroy() {
                this.alive = false;
                this.mesh.dispose();
                this.trail.dispose();
                this.light.dispose();
            }
        }

        class Explosion {
            constructor(scene, position, isChain = false) {
                this.scene = scene;
                this.time = 0;
                this.duration = 2;
                this.isChain = isChain;
                this.done = false;

                const scale = isChain ? 1.5 : 2;

                // Core flash
                this.flash = BABYLON.MeshBuilder.CreateSphere("flash", { diameter: 0.5 * scale }, scene);
                this.flash.position = position.clone();

                const flashMat = new BABYLON.StandardMaterial("flashMat", scene);
                flashMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
                flashMat.disableLighting = true;
                flashMat.alpha = 1;
                this.flash.material = flashMat;
                this.flash.scaling = new BABYLON.Vector3(0.1, 0.1, 0.1);

                // Fire particles
                this.fireParticles = this.createParticleSystem("fire", position, {
                    r: 1, g: 0.5, b: 0.1,
                    size: 0.8 * scale,
                    lifetime: 0.8,
                    emitRate: 200,
                    speed: 15
                });

                // Sparks
                this.sparkParticles = this.createParticleSystem("sparks", position, {
                    r: 1, g: 0.9, b: 0.5,
                    size: 0.15,
                    lifetime: 1.2,
                    emitRate: 100,
                    speed: 25
                });

                // Smoke
                this.smokeParticles = this.createParticleSystem("smoke", position, {
                    r: 0.3, g: 0.3, b: 0.3,
                    size: 1.5 * scale,
                    lifetime: 2,
                    emitRate: 50,
                    speed: 5
                });

                // Shockwave ring
                this.shockwave = BABYLON.MeshBuilder.CreateTorus("shockwave", {
                    diameter: 1,
                    thickness: 0.3,
                    tessellation: 32
                }, scene);
                this.shockwave.position = position.clone();
                this.shockwave.rotation.x = Math.PI / 2;

                const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
                shockMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0.5);
                shockMat.alpha = 0.8;
                shockMat.disableLighting = true;
                this.shockwave.material = shockMat;

                // Debris
                this.debris = [];
                for (let i = 0; i < 12; i++) {
                    const piece = BABYLON.MeshBuilder.CreateBox("debris" + i, {
                        size: 0.2 + Math.random() * 0.3
                    }, scene);
                    piece.position = position.clone();

                    const debrisMat = new BABYLON.StandardMaterial("debrisMat" + i, scene);
                    debrisMat.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.5);
                    piece.material = debrisMat;

                    this.debris.push({
                        mesh: piece,
                        velocity: new BABYLON.Vector3(
                            (Math.random() - 0.5) * 20,
                            (Math.random() - 0.5) * 20,
                            (Math.random() - 0.5) * 20
                        ),
                        rotation: new BABYLON.Vector3(
                            Math.random() * 5,
                            Math.random() * 5,
                            Math.random() * 5
                        )
                    });
                }

                // Explosion light
                this.light = new BABYLON.PointLight("explosionLight", position.clone(), scene);
                this.light.diffuse = new BABYLON.Color3(1, 0.7, 0.3);
                this.light.intensity = 5;
                this.light.range = 50;
            }

            createParticleSystem(name, position, config) {
                const ps = new BABYLON.ParticleSystem(name, 200, this.scene);
                ps.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAGklEQVQYV2NkYGD4z4AHMP7//x+fNKMyYwAjHAH/pv0AAQBJ3AUAAAAASUVORK5CYII=", this.scene);

                ps.emitter = position.clone();
                ps.color1 = new BABYLON.Color4(config.r, config.g, config.b, 1);
                ps.color2 = new BABYLON.Color4(config.r * 0.8, config.g * 0.8, config.b * 0.8, 1);
                ps.colorDead = new BABYLON.Color4(0, 0, 0, 0);

                ps.minSize = config.size * 0.5;
                ps.maxSize = config.size;
                ps.minLifeTime = config.lifetime * 0.5;
                ps.maxLifeTime = config.lifetime;
                ps.emitRate = config.emitRate;

                ps.minEmitPower = config.speed * 0.5;
                ps.maxEmitPower = config.speed;
                ps.updateSpeed = 0.01;

                ps.gravity = new BABYLON.Vector3(0, 0, 0);
                ps.direction1 = new BABYLON.Vector3(-1, -1, -1);
                ps.direction2 = new BABYLON.Vector3(1, 1, 1);

                ps.start();
                return ps;
            }

            update(deltaTime) {
                this.time += deltaTime;
                const t = this.time / this.duration;

                // Flash
                if (t < 0.1) {
                    const flashScale = t * 20 * (this.isChain ? 1.5 : 2);
                    this.flash.scaling = new BABYLON.Vector3(flashScale, flashScale, flashScale);
                    this.flash.material.alpha = 1 - t * 10;
                } else {
                    this.flash.dispose();
                }

                // Shockwave
                if (t < 0.5) {
                    const shockScale = t * 40;
                    this.shockwave.scaling = new BABYLON.Vector3(shockScale, shockScale, shockScale);
                    this.shockwave.material.alpha = 0.8 * (1 - t * 2);
                } else {
                    this.shockwave.dispose();
                }

                // Light
                this.light.intensity = Math.max(0, 5 * (1 - t));

                // Debris
                this.debris.forEach(d => {
                    d.mesh.position.addInPlace(d.velocity.scale(deltaTime));
                    d.velocity.scaleInPlace(0.98);
                    d.mesh.rotation.x += d.rotation.x * deltaTime;
                    d.mesh.rotation.y += d.rotation.y * deltaTime;
                    d.mesh.rotation.z += d.rotation.z * deltaTime;

                    const debrisAlpha = Math.max(0, 1 - t);
                    d.mesh.visibility = debrisAlpha;
                });

                // Stop particles
                if (t > 0.3) {
                    this.fireParticles.stop();
                    this.sparkParticles.stop();
                    this.smokeParticles.stop();
                }

                if (t >= 1) {
                    this.done = true;
                    this.fireParticles.dispose();
                    this.sparkParticles.dispose();
                    this.smokeParticles.dispose();
                    this.light.dispose();
                    this.debris.forEach(d => d.mesh.dispose());
                }
            }
        }

        class SpaceBattle {
            constructor() {
                this.canvas = document.getElementById("renderCanvas");
                this.engine = new BABYLON.Engine(this.canvas, true);
                this.scene = this.createScene();
                this.ships = [];
                this.projectiles = [];
                this.explosions = [];
                this.blueFleet = [];
                this.redFleet = [];

                this.createFleets();
                this.setupUI();

                this.engine.runRenderLoop(() => this.update());
                window.addEventListener("resize", () => this.engine.resize());
            }

            createScene() {
                const scene = new BABYLON.Scene(this.engine);
                scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.05, 1);

                // Camera
                this.camera = new BABYLON.ArcRotateCamera(
                    "camera", -Math.PI / 2, Math.PI / 3, 200,
                    new BABYLON.Vector3(0, 0, 0), scene
                );
                this.camera.attachControl(this.canvas, true);
                this.camera.lowerRadiusLimit = 80;
                this.camera.upperRadiusLimit = 400;
                this.camera.lowerBetaLimit = 0.2;
                this.camera.upperBetaLimit = Math.PI / 2.2;
                this.camera.wheelPrecision = 50;
                this.camera.inertia = 0.9;

                // Lighting
                const ambient = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
                ambient.intensity = 0.15;
                ambient.diffuse = new BABYLON.Color3(0.6, 0.6, 0.8);

                const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), scene);
                sun.intensity = 0.6;
                sun.diffuse = new BABYLON.Color3(1, 0.98, 0.95);

                // Starfield
                this.createStarfield(scene);

                // Nebula
                this.createNebula(scene);

                return scene;
            }

            createStarfield(scene) {
                const starCount = 2000;
                const positions = [];
                const colors = [];

                for (let i = 0; i < starCount; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = 500 + Math.random() * 200;

                    positions.push(
                        r * Math.sin(phi) * Math.cos(theta),
                        r * Math.sin(phi) * Math.sin(theta),
                        r * Math.cos(phi)
                    );

                    const brightness = 0.5 + Math.random() * 0.5;
                    colors.push(brightness, brightness, brightness * 1.1, 1);
                }

                const stars = new BABYLON.PointsCloudSystem("stars", 2, scene);
                stars.addPoints(starCount, (particle, i) => {
                    particle.position = new BABYLON.Vector3(
                        positions[i * 3],
                        positions[i * 3 + 1],
                        positions[i * 3 + 2]
                    );
                    const brightness = 0.5 + Math.random() * 0.5;
                    particle.color = new BABYLON.Color4(brightness, brightness, brightness * 1.1, 1);
                });
                stars.buildMeshAsync();
            }

            createNebula(scene) {
                const nebula = BABYLON.MeshBuilder.CreateSphere("nebula", { diameter: 800 }, scene);

                const nebulaMat = new BABYLON.StandardMaterial("nebulaMat", scene);
                nebulaMat.diffuseColor = new BABYLON.Color3(0.1, 0.05, 0.15);
                nebulaMat.emissiveColor = new BABYLON.Color3(0.05, 0.02, 0.08);
                nebulaMat.alpha = 0.3;
                nebulaMat.backFaceCulling = false;
                nebula.material = nebulaMat;
            }

            createFleets() {
                // Blue fleet formation
                const blueCenter = new BABYLON.Vector3(-CONFIG.fleetSpacing / 2, 0, 0);
                this.createFleet(BLUE_TEAM, blueCenter);

                // Red fleet formation
                const redCenter = new BABYLON.Vector3(CONFIG.fleetSpacing / 2, 0, 0);
                this.createFleet(RED_TEAM, redCenter);
            }

            createFleet(team, center) {
                // Flagship
                const flagship = new Ship(this.scene, team, true, center.clone(), 0);
                this.ships.push(flagship);
                if (team === BLUE_TEAM) this.blueFleet.push(flagship);
                else this.redFleet.push(flagship);

                // Escorts in orbital formation
                for (let i = 0; i < CONFIG.escortCount; i++) {
                    const angle = (i / CONFIG.escortCount) * Math.PI * 2;
                    const radius = CONFIG.escortRadius;
                    const yOffset = Math.sin(i * 0.8) * 10;

                    const pos = new BABYLON.Vector3(
                        center.x + Math.cos(angle) * radius,
                        center.y + yOffset,
                        center.z + Math.sin(angle) * radius
                    );

                    const escort = new Ship(this.scene, team, false, pos, i + 1);
                    this.ships.push(escort);
                    if (team === BLUE_TEAM) this.blueFleet.push(escort);
                    else this.redFleet.push(escort);
                }
            }

            setupUI() {
                this.updateFleetCounts();
            }

            updateFleetCounts() {
                const blueAlive = this.blueFleet.filter(s => s.alive).length;
                const redAlive = this.redFleet.filter(s => s.alive).length;

                document.getElementById("blueCount").textContent = blueAlive;
                document.getElementById("redCount").textContent = redAlive;
            }

            fireProjectile(ship) {
                if (!ship.alive || !ship.target || !ship.target.alive) return;

                const origin = ship.getProjectileOrigin();
                const targetPos = ship.target.mesh.position.clone();
                const direction = targetPos.subtract(origin).normalize();

                // Add some inaccuracy
                direction.x += (Math.random() - 0.5) * 0.1;
                direction.y += (Math.random() - 0.5) * 0.1;
                direction.z += (Math.random() - 0.5) * 0.1;

                const proj = new Projectile(this.scene, ship.team, origin, direction);
                this.projectiles.push(proj);

                ship.lastFire = performance.now();
            }

            createExplosion(position, isChain = false) {
                const explosion = new Explosion(this.scene, position, isChain);
                this.explosions.push(explosion);
            }

            checkProjectileHits() {
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const proj = this.projectiles[i];
                    if (!proj.alive) continue;

                    const enemies = proj.team === BLUE_TEAM ? this.redFleet : this.blueFleet;

                    for (const enemy of enemies) {
                        if (!enemy.alive) continue;

                        const dist = BABYLON.Vector3.Distance(proj.mesh.position, enemy.mesh.position);
                        const hitRadius = enemy.isFlagship ? 4 : 2;

                        if (dist < hitRadius) {
                            const destroyed = enemy.takeDamage(CONFIG.damage);
                            this.createExplosion(proj.mesh.position.clone());

                            if (destroyed) {
                                this.createExplosion(enemy.mesh.position.clone());
                                this.checkChainReaction(enemy.mesh.position.clone());
                            }

                            proj.destroy();
                            break;
                        }
                    }
                }
            }

            checkChainReaction(position) {
                for (const ship of this.ships) {
                    if (!ship.alive) continue;
                    if (ship.mesh.position.equals(position)) continue;

                    const dist = BABYLON.Vector3.Distance(ship.mesh.position, position);
                    if (dist < CONFIG.chainRadius) {
                        const destroyed = ship.takeDamage(CONFIG.damage * 2);
                        if (destroyed) {
                            this.createExplosion(ship.mesh.position.clone(), true);
                            this.checkChainReaction(ship.mesh.position.clone());
                        }
                    }
                }
            }

            update() {
                const deltaTime = this.engine.getDeltaTime() * 0.001;
                const now = performance.now();

                // Update ships
                this.blueFleet.forEach(ship => {
                    ship.update(deltaTime, this.redFleet);
                });
                this.redFleet.forEach(ship => {
                    ship.update(deltaTime, this.blueFleet);
                });

                // Fire weapons
                this.ships.forEach(ship => {
                    if (ship.alive && ship.canFire(now) && ship.target && ship.target.alive) {
                        this.fireProjectile(ship);
                        if (ship.isFlagship) {
                            // Fire second projectile for flagship
                            setTimeout(() => {
                                if (ship.alive) this.fireProjectile(ship);
                            }, 100);
                        }
                    }
                });

                // Update projectiles
                this.projectiles.forEach(proj => proj.update(deltaTime));
                this.projectiles = this.projectiles.filter(p => p.alive);

                // Check hits
                this.checkProjectileHits();

                // Update explosions
                this.explosions.forEach(exp => exp.update(deltaTime));
                this.explosions = this.explosions.filter(e => !e.done);

                // Remove dead ships
                this.ships.forEach(ship => {
                    if (!ship.alive && ship.mesh) {
                        ship.mesh.setEnabled(false);
                    }
                });

                // Update UI
                this.updateFleetCounts();

                this.scene.render();
            }
        }

        new SpaceBattle();
    </script>
</body>
</html>
