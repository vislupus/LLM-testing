<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Battle - Babylon.js</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    #renderCanvas { width: 100%; height: 100vh; display: block; touch-action: none; }
    #ui {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10;
    }
    .fleet-info {
        position: absolute; top: 20px; padding: 15px 25px; background: rgba(0,0,0,0.85);
        border-radius: 8px; color: #fff; font-size: 14px; line-height: 1.6;
        border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    }
    .fleet-blue { left: 20px; border-color: #00bfff; box-shadow: 0 0 20px rgba(0,191,255,0.3); }
    .fleet-red { right: 20px; border-color: #ff4444; box-shadow: 0 0 20px rgba(255,68,68,0.3); }
    .fleet-title { font-weight: 700; font-size: 16px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .fleet-blue .fleet-title { color: #00bfff; }
    .fleet-red .fleet-title { color: #ff4444; }
    .stat-row { display: flex; justify-content: space-between; gap: 20px; padding: 3px 0; }
    .stat-label { opacity: 0.7; }
    .stat-value { font-weight: 600; font-family: monospace; }
    .stat-value.alive { color: #00ff88; }
    .stat-value.dead { color: #ff4444; }
    #battleStatus {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    #battleStatus.visible { opacity: 1; }
    #victoryText { font-size: 48px; font-weight: 800; text-shadow: 0 0 30px currentColor; margin-bottom: 10px; }
    #victorySub { font-size: 18px; opacity: 0.8; }
    .controls-hint {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 20px;
        color: #aaa; font-size: 13px; border: 1px solid rgba(255,255,255,0.15);
    }
    .controls-hint kbd {
        background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px;
        font-family: monospace; margin: 0 4px; color: #fff;
    }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="ui">
    <div class="fleet-info fleet-blue" id="blueInfo">
        <div class="fleet-title">Blue Fleet</div>
        <div class="stat-row"><span class="stat-label">Ships Alive:</span><span class="stat-value alive" id="blueAlive">10</span></div>
        <div class="stat-row"><span class="stat-label">Flagship HP:</span><span class="stat-value alive" id="blueFlagshipHP">100%</span></div>
        <div class="stat-row"><span class="stat-label">Shots Fired:</span><span class="stat-value" id="blueShots">0</span></div>
    </div>
    <div class="fleet-info fleet-red" id="redInfo">
        <div class="fleet-title">Red Fleet</div>
        <div class="stat-row"><span class="stat-label">Ships Alive:</span><span class="stat-value alive" id="redAlive">10</span></div>
        <div class="stat-row"><span class="stat-label">Flagship HP:</span><span class="stat-value alive" id="redFlagshipHP">100%</span></div>
        <div class="stat-row"><span class="stat-label">Shots Fired:</span><span class="stat-value" id="redShots">0</span></div>
    </div>
    <div id="battleStatus">
        <div id="victoryText"></div>
        <div id="victorySub">Refresh to restart battle</div>
    </div>
    <div class="controls-hint">
        <kbd>Mouse Drag</kbd> Orbit &nbsp;|&nbsp; <kbd>Wheel</kbd> Zoom &nbsp;|&nbsp; <kbd>Space</kbd> Pause
    </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
/* ===== SPACE BATTLE SIMULATION ===== */
class SpaceBattle {
    constructor() {
        this.canvas = document.getElementById('renderCanvas');
        this.engine = new BABYLON.Engine(this.canvas, true, { preserveDrawingBuffer: true, stencil: true });
        this.scene = null;
        this.camera = null;
        
        // Game state
        this.ships = [];
        this.projectiles = [];
        this.explosions = [];
        this.paused = false;
        this.battleEnded = false;
        this.time = 0;
        
        // Fleet data
        this.blueFleet = { ships: [], alive: 10, flagship: null, shots: 0 };
        this.redFleet = { ships: [], alive: 10, flagship: null, shots: 0 };
        
        // Constants
        this.SHIP_SIZE = { flagship: 12, escort: 4 };
        this.EXPLOSION_RADIUS = 15;
        this.CHAIN_REACTION_DIST = 8;
        this.FORMATION_RADIUS = 40;
        this.BATTLE_DISTANCE = 200;
        
        this.init();
    }
    
    async init() {
        this.createScene();
        this.createEnvironment();
        this.createFleets();
        this.setupCamera();
        this.setupInput();
        this.engine.runRenderLoop(() => this.update());
        window.addEventListener('resize', () => this.engine.resize());
    }
    
    createScene() {
        this.scene = new BABYLON.Scene(this.engine);
        this.scene.clearColor = new BABYLON.Color3(0.01, 0.01, 0.02);
        
        // Physics-like movement without physics engine (lighter)
        this.scene.gravity = new BABYLON.Vector3(0, 0, 0);
    }
    
    createEnvironment() {
        // Starfield - multiple layers for depth
        this.createStarfield(2000, 500, 0.3, 0.8);  // Far stars
        this.createStarfield(800, 200, 0.5, 1.2);   // Mid stars
        this.createStarfield(200, 50, 1.0, 2.0);    // Near bright stars
        
        // Nebula clouds using particle systems
        this.createNebula();
        
        // Lighting
        const hemiLight = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), this.scene);
        hemiLight.intensity = 0.15;
        hemiLight.diffuse = new BABYLON.Color3(0.3, 0.3, 0.5);
        hemiLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);
        
        // Main directional light (distant star)
        const sunLight = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -0.3, -1), this.scene);
        sunLight.intensity = 0.6;
        sunLight.diffuse = new BABYLON.Color3(1, 0.95, 0.9);
        sunLight.specular = new BABYLON.Color3(0.5, 0.5, 0.5);
        
        // Rim lights for cinematic feel
        const rimBlue = new BABYLON.DirectionalLight('rimBlue', new BABYLON.Vector3(1, 0, 0), this.scene);
        rimBlue.intensity = 0.2;
        rimBlue.diffuse = new BABYLON.Color3(0, 0.5, 1);
        
        const rimRed = new BABYLON.DirectionalLight('rimRed', new BABYLON.Vector3(-1, 0, 0), this.scene);
        rimRed.intensity = 0.2;
        rimRed.diffuse = new BABYLON.Color3(1, 0.2, 0.2);
        
        // Fog for depth
        this.scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
        this.scene.fogDensity = 0.0008;
        this.scene.fogColor = new BABYLON.Color3(0.01, 0.01, 0.03);
    }
    
    createStarfield(count, radius, minSize, maxSize) {
        const positions = [];
        const colors = [];
        const sizes = [];
        
        for (let i = 0; i < count; i++) {
            // Spherical distribution
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = radius * (0.7 + Math.random() * 0.3);
            
            positions.push(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
            
            const temp = Math.random();
            let color;
            if (temp < 0.4) color = [1, 0.95, 0.9];      // Warm white
            else if (temp < 0.6) color = [1, 0.7, 0.5];   // Orange
            else if (temp < 0.8) color = [0.6, 0.8, 1];   // Blue
            else color = [0.9, 0.5, 1];                   // Purple
            
            colors.push(...color);
            sizes.push(minSize + Math.random() * (maxSize - minSize));
        }
        
        const stars = new BABYLON.PointCloudSystem('stars', this.scene);
        stars.addPoints(count, (p, i) => {
            p.position = new BABYLON.Vector3(positions[i*3], positions[i*3+1], positions[i*3+2]);
            p.color = new BABYLON.Color4(colors[i*4], colors[i*4+1], colors[i*4+2], 0.6 + Math.random()*0.4);
            p.size = sizes[i];
        });
        stars.buildMeshAsync().then(() => {
            // Animate twinkling
            const mesh = stars.mesh;
            this.scene.registerBeforeRender(() => {
                if (!this.paused) {
                    mesh.rotation.y += 0.00002;
                    mesh.rotation.x += 0.00001;
                }
            });
        });
    }
    
    createNebula() {
        // Three nebula clouds at different positions
        const nebulaData = [
            { pos: new BABYLON.Vector3(-150, 50, -100), color1: new BABYLON.Color4(0.2, 0.1, 0.4, 0.15), color2: new BABYLON.Color4(0.4, 0.1, 0.3, 0.1), size: 180 },
            { pos: new BABYLON.Vector3(200, -30, 50), color1: new BABYLON.Color4(0.4, 0.1, 0.1, 0.12), color2: new BABYLON.Color4(0.5, 0.2, 0.05, 0.08), size: 200 },
            { pos: new BABYLON.Vector3(0, 100, 250), color1: new BABYLON.Color4(0.1, 0.3, 0.4, 0.1), color2: new BABYLON.Color4(0.05, 0.2, 0.5, 0.08), size: 150 }
        ];
        
        nebulaData.forEach(data => {
            const ps = new BABYLON.ParticleSystem('nebula', 300, this.scene);
            ps.particleTexture = this.createGradientTexture(data.color1, data.color2);
            ps.emitter = data.pos;
            ps.minEmitBox = new BABYLON.Vector3(-data.size/2, -data.size/2, -data.size/2);
            ps.maxEmitBox = new BABYLON.Vector3(data.size/2, data.size/2, data.size/2);
            ps.color1 = data.color1;
            ps.color2 = data.color2;
            ps.colorDead = new BABYLON.Color4(0,0,0,0);
            ps.minSize = data.size * 0.3;
            ps.maxSize = data.size * 0.6;
            ps.minLifeTime = 120;
            ps.maxLifeTime = 200;
            ps.emitRate = 2;
            ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            ps.gravity = new BABYLON.Vector3(0, 0, 0);
            ps.direction1 = new BABYLON.Vector3(-0.1, -0.05, -0.1);
            ps.direction2 = new BABYLON.Vector3(0.1, 0.05, 0.1);
            ps.minEmitPower = 0.01;
            ps.maxEmitPower = 0.02;
            ps.updateSpeed = 0.005;
            ps.start();
        });
    }
    
    createGradientTexture(color1, color2) {
        const texture = new BABYLON.DynamicTexture('nebulaTex', 64, this.scene, true);
        const ctx = texture.getContext();
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, `rgba(${color1.r*255},${color1.g*255},${color1.b*255},${color1.a})`);
        grad.addColorStop(1, `rgba(${color2.r*255},${color2.g*255},${color2.b*255},0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        texture.update();
        return texture;
    }
    
    createFleets() {
        // Blue fleet (left side, negative X)
        this.createFleet('blue', new BABYLON.Vector3(-this.BATTLE_DISTANCE/2, 0, 0), 
            new BABYLON.Color3(0, 0.7, 1), new BABYLON.Color3(0, 1, 1));
        
        // Red fleet (right side, positive X)
        this.createFleet('red', new BABYLON.Vector3(this.BATTLE_DISTANCE/2, 0, 0), 
            new BABYLON.Color3(1, 0.2, 0.2), new BABYLON.Color3(1, 0.5, 0.2));
    }
    
    createFleet(side, centerPos, primaryColor, engineColor) {
        const fleet = side === 'blue' ? this.blueFleet : this.redFleet;
        const isBlue = side === 'blue';
        
        // Create flagship
        const flagship = this.createShip('flagship', centerPos.clone(), primaryColor, engineColor, true, isBlue);
        flagship.isFlagship = true;
        flagship.maxHealth = flagship.health = 500;
        fleet.flagship = flagship;
        fleet.ships.push(flagship);
        this.ships.push(flagship);
        
        // Create 9 escorts in formation around flagship
        const positions = this.generateFormationPositions(9, this.FORMATION_RADIUS);
        positions.forEach((pos, i) => {
            const escortPos = centerPos.add(pos);
            const escort = this.createShip('escort', escortPos, primaryColor, engineColor, false, isBlue);
            escort.formationOffset = pos.clone();
            escort.formationIndex = i;
            escort.maxHealth = escort.health = 120;
            fleet.ships.push(escort);
            this.ships.push(escort);
        });
    }
    
    generateFormationPositions(count, radius) {
        const positions = [];
        // One in center-back, rest in rough sphere
        for (let i = 0; i < count; i++) {
            const phi = Math.acos(1 - 2 * (i + 0.5) / count);
            const theta = Math.PI * (1 + Math.sqrt(5)) * i; // Golden angle
            const r = radius * (0.5 + Math.random() * 0.5);
            
            positions.push(new BABYLON.Vector3(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta) * 0.5, // Flatten slightly
                r * Math.cos(phi) - radius * 0.3 // Offset back
            ));
        }
        return positions;
    }
    
    createShip(type, position, primaryColor, engineColor, isFlagship, isBlue) {
        const size = isFlagship ? this.SHIP_SIZE.flagship : this.SHIP_SIZE.escort;
        const root = new BABYLON.TransformNode(`ship_${type}_${Date.now()}_${Math.random()}`, this.scene);
        root.position = position.clone();
        root.rotationQuaternion = BABYLON.Quaternion.Identity();
        
        // Ship data
        const ship = {
            root,
            mesh: root,
            type,
            isFlagship,
            isBlue,
            size,
            health: isFlagship ? 500 : 120,
            maxHealth: isFlagship ? 500 : 120,
            alive: true,
            velocity: new BABYLON.Vector3(0, 0, 0),
            targetVelocity: new BABYLON.Vector3(0, 0, 0),
            targetPos: position.clone(),
            fireCooldown: 0,
            fireRate: isFlagship ? 3 : 3,
            projectilesPerShot: isFlagship ? 2 : 1,
            primaryColor,
            engineColor,
            formationOffset: new BABYLON.Vector3(0,0,0),
            formationIndex: 0,
            engineMeshes: [],
            healthBar: null,
            healthBarBg: null,
            lastTarget: null
        };
        
        // Build ship geometry
        this.buildShipGeometry(ship);
        this.createHealthBar(ship);
        this.createEngineGlow(ship);
        
        return ship;
    }
    
    buildShipGeometry(ship) {
        const { root, size, primaryColor, isFlagship, isBlue } = ship;
        const mats = this.createShipMaterials(primaryColor);
        
        if (isFlagship) {
            this.buildFlagship(root, size, mats, isBlue);
        } else {
            this.buildEscort(root, size, mats, isBlue);
        }
        
        // Add glowing accents
        this.addGlowAccents(root, size, ship.engineColor, isBlue);
    }
    
    createShipMaterials(primaryColor) {
        const hullMat = new BABYLON.StandardMaterial('hullMat', this.scene);
        hullMat.diffuseColor = primaryColor.scale(0.4);
        hullMat.specularColor = new BABYLON.Color3(0.6, 0.6, 0.7);
        hullMat.specularPower = 64;
        hullMat.emissiveColor = primaryColor.scale(0.15);
        hullMat.ambientColor = new BABYLON.Color3(0.1, 0.1, 0.15);
        
        const accentMat = new BABYLON.StandardMaterial('accentMat', this.scene);
        accentMat.diffuseColor = primaryColor;
        accentMat.emissiveColor = primaryColor.scale(0.8);
        accentMat.specularColor = new BABYLON.Color3(1,1,1);
        accentMat.specularPower = 128;
        
        const darkMat = new BABYLON.StandardMaterial('darkMat', this.scene);
        darkMat.diffuseColor = new BABYLON.Color3(0.08, 0.08, 0.1);
        darkMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.35);
        darkMat.specularPower = 32;
        
        const glowMat = new BABYLON.StandardMaterial('glowMat', this.scene);
        glowMat.emissiveColor = primaryColor;
        glowMat.disableLighting = true;
        
        return { hullMat, accentMat, darkMat, glowMat };
    }
    
    buildFlagship(root, size, mats, isBlue) {
        const s = size;
        const dir = isBlue ? 1 : -1; // Face each other
        
        // Main hull - elongated carrier shape
        const hull = BABYLON.MeshBuilder.CreateCylinder('hull', {
            height: s * 3.5, diameterTop: s * 0.6, diameterBottom: s * 1.2,
            tessellation: 12, subdivisionsHeight: 4
        }, this.scene);
        hull.rotation.x = Math.PI/2 * dir;
        hull.material = mats.hullMat;
        hull.parent = root;
        
        // Command bridge
        const bridge = BABYLON.MeshBuilder.CreateBox('bridge', {
            width: s * 0.8, height: s * 0.5, depth: s * 1.0
        }, this.scene);
        bridge.position.y = s * 1.6 * dir;
        bridge.scaling.z = 0.7;
        bridge.material = mats.accentMat;
        bridge.parent = root;
        
        // Bridge windows
        const windows = BABYLON.MeshBuilder.CreateBox('windows', {
            width: s * 0.7, height: s * 0.1, depth: s * 0.9
        }, this.scene);
        windows.position.y = s * 1.75 * dir;
        windows.position.z = s * 0.05 * dir;
        windows.material = mats.glowMat;
        windows.parent = root;
        
        // Engine section (wider at back)
        const engineSection = BABYLON.MeshBuilder.CreateCylinder('engineSec', {
            height: s * 1.5, diameterTop: s * 1.2, diameterBottom: s * 1.8,
            tessellation: 12
        }, this.scene);
        engineSection.rotation.x = Math.PI/2 * dir;
        engineSection.position.y = -s * 2.0 * dir;
        engineSection.material = mats.darkMat;
        engineSection.parent = root;
        
        // Side pylons / hangars
        for (let side of [-1, 1]) {
            const pylon = BABYLON.MeshBuilder.CreateBox('pylon', {
                width: s * 0.4, height: s * 2.5, depth: s * 1.2
            }, this.scene);
            pylon.position.set(side * s * 1.3, -s * 0.2 * dir, -s * 0.3 * dir);
            pylon.rotation.y = side * 0.15;
            pylon.material = mats.hullMat;
            pylon.parent = root;
            
            // Hangar bay
            const hangar = BABYLON.MeshBuilder.CreateBox('hangar', {
                width: s * 0.3, height: s * 0.4, depth: s * 1.0
            }, this.scene);
            hangar.position.set(side * s * 1.4, -s * 1.3 * dir, s * 0.2 * dir);
            hangar.material = mats.glowMat;
            hangar.parent = root;
        }
        
        // Top antenna array
        const antenna = BABYLON.MeshBuilder.CreateCylinder('antenna', {
            height: s * 2, diameterTop: 0.1, diameterBottom: s * 0.15, tessellation: 6
        }, this.scene);
        antenna.rotation.x = Math.PI/2 * dir;
        antenna.position.y = s * 2.2 * dir;
        antenna.material = mats.accentMat;
        antenna.parent = root;
        
        // Weapon turrets
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const turret = this.createTurret(s * 0.5, mats, isBlue);
            turret.position.set(
                Math.cos(angle) * s * 1.1,
                s * 0.3 * dir,
                Math.sin(angle) * s * 1.1 - s * 0.5 * dir
            );
            turret.parent = root;
            ship.turrets = ship.turrets || [];
            ship.turrets.push({ mesh: turret, angle, offset: turret.position.clone() });
        }
        
        // Store main parts for damage effects
        ship.hullMesh = hull;
        ship.bridgeMesh = bridge;
    }
    
    buildEscort(root, size, mats, isBlue) {
        const s = size;
        const dir = isBlue ? 1 : -1;
        
        // Sleek fighter shape - wedge
        const hull = BABYLON.MeshBuilder.CreateCylinder('hull', {
            height: s * 2.5, diameterTop: s * 0.3, diameterBottom: s * 1.0,
            tessellation: 8
        }, this.scene);
        hull.rotation.x = Math.PI/2 * dir;
        hull.material = mats.hullMat;
        hull.parent = root;
        
        // Cockpit
        const cockpit = BABYLON.MeshBuilder.CreateSphere('cockpit', {
            diameter: s * 0.5, segments: 8
        }, this.scene);
        cockpit.scaling.set(1, 0.6, 1.5);
        cockpit.position.y = s * 0.8 * dir;
        cockpit.material = mats.glowMat;
        cockpit.parent = root;
        
        // Wings
        for (let side of [-1, 1]) {
            const wing = BABYLON.MeshBuilder.CreateBox('wing', {
                width: s * 2.2, height: s * 0.1, depth: s * 1.5
            }, this.scene);
            wing.position.set(side * s * 1.1, 0, -s * 0.2 * dir);
            wing.rotation.z = side * 0.1;
            wing.material = mats.hullMat;
            wing.parent = root;
            
            // Wing tip lights
            const tip = BABYLON.MeshBuilder.CreateSphere('tip', { diameter: s * 0.2 }, this.scene);
            tip.position.set(side * s * 2.2, 0, -s * 0.2 * dir);
            tip.material = mats.glowMat;
            tip.parent = root;
        }
        
        // Vertical stabilizers
        for (let side of [-1, 1]) {
            const stab = BABYLON.MeshBuilder.CreateBox('stab', {
                width: s * 0.1, height: s * 0.7, depth: s * 0.8
            }, this.scene);
            stab.position.set(side * s * 0.5, s * 0.3 * dir, -s * 0.8 * dir);
            stab.material = mats.darkMat;
            stab.parent = root;
        }
        
        // Engine nozzles
        for (let i = 0; i < 2; i++) {
            const nozzle = BABYLON.MeshBuilder.CreateCylinder('nozzle', {
                height: s * 0.4, diameterTop: s * 0.25, diameterBottom: s * 0.4,
                tessellation: 8
            }, this.scene);
            nozzle.rotation.x = Math.PI/2 * dir;
            nozzle.position.set((i-0.5) * s * 0.6, -s * 1.1 * dir, -s * 0.3 * dir);
            nozzle.material = mats.darkMat;
            nozzle.parent = root;
        }
        
        ship.hullMesh = hull;
        ship.cockpitMesh = cockpit;
    }
    
    createTurret(size, mats, isBlue) {
        const root = new BABYLON.TransformNode('turret', this.scene);
        const dir = isBlue ? 1 : -1;
        
        const base = BABYLON.MeshBuilder.CreateCylinder('base', {
            height: size * 0.3, diameterTop: size * 0.6, diameterBottom: size * 0.8, tessellation: 8
        }, this.scene);
        base.rotation.x = Math.PI/2 * dir;
        base.material = mats.darkMat;
        base.parent = root;
        
        const barrel = BABYLON.MeshBuilder.CreateCylinder('barrel', {
            height: size * 1.2, diameterTop: size * 0.15, diameterBottom: size * 0.25, tessellation: 8
        }, this.scene);
        barrel.rotation.x = Math.PI/2 * dir;
        barrel.position.y = size * 0.5 * dir;
        barrel.material = mats.accentMat;
        barrel.parent = root;
        
        return root;
    }
    
    addGlowAccents(root, size, engineColor, isBlue) {
        const dir = isBlue ? 1 : -1;
        // Running lights along hull
        for (let i = 0; i < 4; i++) {
            const light = BABYLON.MeshBuilder.CreateBox('runLight', {
                width: size * 0.1, height: size * 0.05, depth: size * 0.8
            }, this.scene);
            const angle = (i / 4) * Math.PI * 2;
            light.position.set(
                Math.cos(angle) * size * 0.7,
                size * 0.2 * dir,
                Math.sin(angle) * size * 0.7
            );
            light.rotation.y = angle;
            const mat = new BABYLON.StandardMaterial('runLightMat', this.scene);
            mat.emissiveColor = engineColor;
            mat.disableLighting = true;
            light.material = mat;
            light.parent = root;
        }
    }
    
    createEngineGlow(ship) {
        const { root, size, engineColor, isFlagship, isBlue } = ship;
        const dir = isBlue ? 1 : -1;
        const glowCount = isFlagship ? 4 : 2;
        const glowSize = isFlagship ? size * 0.5 : size * 0.3;
        
        for (let i = 0; i < glowCount; i++) {
            // Particle system for engine glow
            const ps = new BABYLON.ParticleSystem(`engineGlow_${i}`, 50, this.scene);
            ps.particleTexture = this.createGlowTexture(engineColor);
            ps.emitter = root;
            ps.minEmitBox = new BABYLON.Vector3(
                (i % 2 === 0 ? -1 : 1) * size * 0.3,
                -size * 1.2 * dir,
                (i < 2 ? -1 : 1) * size * 0.3
            );
            ps.maxEmitBox = ps.minEmitBox.clone();
            ps.color1 = new BABYLON.Color4(engineColor.r, engineColor.g, engineColor.b, 0.8);
            ps.color2 = new BABYLON.Color4(engineColor.r, engineColor.g, engineColor.b, 0.3);
            ps.colorDead = new BABYLON.Color4(engineColor.r, engineColor.g, engineColor.b, 0);
            ps.minSize = glowSize * 0.5;
            ps.maxSize = glowSize * 1.2;
            ps.minLifeTime = 0.1;
            ps.maxLifeTime = 0.3;
            ps.emitRate = 200;
            ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            ps.gravity = new BABYLON.Vector3(0, 0, 0);
            ps.direction1 = new BABYLON.Vector3(-0.2, -dir * 1, -0.2);
            ps.direction2 = new BABYLON.Vector3(0.2, -dir * 1, 0.2);
            ps.minEmitPower = 1;
            ps.maxEmitPower = 3;
            ps.updateSpeed = 0.01;
            ps.start();
            
            // Add dynamic light at engine
            const light = new BABYLON.PointLight(`engineLight_${i}`, 
                ps.minEmitBox.clone(), this.scene);
            light.diffuse = engineColor;
            light.specular = engineColor;
            light.intensity = isFlagship ? 15 : 8;
            light.range = isFlagship ? 40 : 20;
            light.parent = root;
            
            // Animate light intensity
            this.scene.registerBeforeRender(() => {
                if (!this.paused && ship.alive) {
                    light.intensity = (isFlagship ? 15 : 8) * (0.7 + Math.random() * 0.6);
                } else if (!ship.alive) {
                    light.intensity = 0;
                }
            });
            
            ship.engineMeshes.push({ particleSystem: ps, light });
        }
    }
    
    createGlowTexture(color) {
        const tex = new BABYLON.DynamicTexture('glowTex', 64, this.scene, true);
        const ctx = tex.getContext();
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, `rgba(${color.r*255},${color.g*255},${color.b*255},1)`);
        grad.addColorStop(0.5, `rgba(${color.r*255},${color.g*255},${color.b*255},0.5)`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        tex.update();
        return tex;
    }
    
    createHealthBar(ship) {
        const { root, size, isFlagship, primaryColor } = ship;
        const barWidth = isFlagship ? size * 2.5 : size * 1.5;
        const barHeight = isFlagship ? 0.6 : 0.4;
        const yOffset = isFlagship ? size * 2.8 : size * 1.8;
        
        // Background
        const bg = BABYLON.MeshBuilder.CreatePlane('hpBg', { width: barWidth, height: barHeight }, this.scene);
        bg.position.y = yOffset;
        bg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
        const bgMat = new BABYLON.StandardMaterial('hpBgMat', this.scene);
        bgMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
        bgMat.emissiveColor = new BABYLON.Color3(0.05, 0, 0);
        bgMat.disableLighting = true;
        bgMat.alpha = 0.8;
        bg.material = bgMat;
        bg.parent = root;
        ship.healthBarBg = bg;
        
        // Foreground (health)
        const fg = BABYLON.MeshBuilder.CreatePlane('hpFg', { width: barWidth, height: barHeight * 0.7 }, this.scene);
        fg.position.y = yOffset;
        fg.position.z = 0.1;
        fg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
        const fgMat = new BABYLON.StandardMaterial('hpFgMat', this.scene);
        fgMat.diffuseColor = new BABYLON.Color3(0, 1, 0.3);
        fgMat.emissiveColor = new BABYLON.Color3(0, 0.5, 0.15);
        fgMat.disableLighting = true;
        fgMat.alpha = 1;
        fg.material = fgMat;
        fg.parent = root;
        ship.healthBar = fg;
        ship.healthBarMat = fgMat;
        
        // Damage flash
        ship.lastDamageTime = 0;
    }
    
    updateHealthBar(ship) {
        if (!ship.alive || !ship.healthBar) return;
        const ratio = Math.max(0, ship.health / ship.maxHealth);
        ship.healthBar.scaling.x = ratio;
        
        // Color based on health
        if (ratio > 0.6) {
            ship.healthBarMat.diffuseColor = new BABYLON.Color3(0, 1, 0.3);
            ship.healthBarMat.emissiveColor = new BABYLON.Color3(0, 0.5, 0.15);
        } else if (ratio > 0.3) {
            ship.healthBarMat.diffuseColor = new BABYLON.Color3(1, 0.8, 0);
            ship.healthBarMat.emissiveColor = new BABYLON.Color3(0.5, 0.4, 0);
        } else {
            ship.healthBarMat.diffuseColor = new BABYLON.Color3(1, 0.2, 0);
            ship.healthBarMat.emissiveColor = new BABYLON.Color3(0.5, 0.1, 0);
        }
        
        // Flash on damage
        const timeSinceDamage = this.time - ship.lastDamageTime;
        if (timeSinceDamage < 0.3) {
            const flash = Math.sin(timeSinceDamage * 40) * 0.5 + 0.5;
            ship.healthBarMat.emissiveColor = ship.healthBarMat.emissiveColor.scale(1 + flash);
        }
    }
    
    setupCamera() {
        this.camera = new BABYLON.ArcRotateCamera('camera', 
            Math.PI/2, Math.PI/3, 300, new BABYLON.Vector3(0, 0, 0), this.scene);
        this.camera.attachControl(this.canvas, true);
        this.camera.lowerRadiusLimit = 50;
        this.camera.upperRadiusLimit = 600;
        this.camera.wheelDeltaPercentage = 0.01;
        this.camera.panningSensibility = 0;
        
        // Auto-rotate slowly
        this.scene.registerBeforeRender(() => {
            if (!this.paused && !this.battleEnded) {
                this.camera.alpha += 0.00015;
            }
        });
    }
    
    setupInput() {
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                this.paused = !this.paused;
                e.preventDefault();
            }
            if (e.code === 'KeyR' && this.battleEnded) {
                location.reload();
            }
        });
    }
    
    update() {
        if (this.paused || this.battleEnded) return;
        
        const dt = this.engine.getDeltaTime() / 1000;
        this.time += dt;
        
        this.updateShips(dt);
        this.updateProjectiles(dt);
        this.updateExplosions(dt);
        this.checkCollisions();
        this.updateUI();
        this.checkBattleEnd();
    }
    
    updateShips(dt) {
        this.ships.forEach(ship => {
            if (!ship.alive) return;
            
            const fleet = ship.isBlue ? this.blueFleet : this.redFleet;
            const enemyFleet = ship.isBlue ? this.redFleet : this.blueFleet;
            
            // Find target
            let target = this.findTarget(ship, enemyFleet);
            
            // Determine desired position
            let desiredPos;
            if (ship.isFlagship) {
                // Flagship moves toward enemy flagship but stays back
                if (enemyFleet.flagship && enemyFleet.flagship.alive) {
                    const toEnemy = enemyFleet.flagship.root.position.subtract(ship.root.position);
                    const dist = toEnemy.length();
                    if (dist > 120) {
                        desiredPos = ship.root.position.add(toEnemy.normalize().scale(Math.min(20 * dt, dist - 120)));
                    } else if (dist < 80) {
                        desiredPos = ship.root.position.subtract(toEnemy.normalize().scale(Math.min(15 * dt, 80 - dist)));
                    } else {
                        desiredPos = ship.root.position;
                    }
                } else {
                    desiredPos = ship.root.position;
                }
            } else {
                // Escorts: formation around flagship + attack runs
                if (fleet.flagship && fleet.flagship.alive) {
                    const formationPos = fleet.flagship.root.position.add(ship.formationOffset);
                    const toFormation = formationPos.subtract(ship.root.position);
                    
                    // Break formation to attack if target in range
                    if (target && target.alive) {
                        const toTarget = target.root.position.subtract(ship.root.position);
                        const targetDist = toTarget.length();
                        if (targetDist < 80 && Math.random() < 0.02) { // Attack run
                            desiredPos = target.root.position.add(toTarget.normalize().scale(30 + Math.random() * 20));
                        } else {
                            desiredPos = formationPos.add(new BABYLON.Vector3(
                                (Math.random()-0.5)*10, (Math.random()-0.5)*5, (Math.random()-0.5)*10
                            ));
                        }
                    } else {
                        desiredPos = formationPos;
                    }
                } else {
                    // Flagship dead - retreat or swarm
                    if (target && target.alive) {
                        const toTarget = target.root.position.subtract(ship.root.position);
                        desiredPos = target.root.position.add(toTarget.normalize().scale(40));
                    } else {
                        desiredPos = ship.root.position;
                    }
                }
            }
            
            // Smooth movement
            const toDesired = desiredPos.subtract(ship.root.position);
            const desiredSpeed = ship.isFlagship ? 25 : 40;
            ship.targetVelocity = toDesired.normalize().scale(Math.min(toDesired.length(), desiredSpeed));
            
            // Damped velocity
            ship.velocity = BABYLON.Vector3.Lerp(ship.velocity, ship.targetVelocity, 0.05);
            ship.root.position.addInPlace(ship.velocity.scale(dt));
            
            // Orient toward velocity or target
            if (ship.velocity.length() > 1) {
                const forward = ship.velocity.normalize();
                const up = new BABYLON.Vector3(0, 1, 0);
                const right = BABYLON.Vector3.Cross(up, forward).normalize();
                const actualUp = BABYLON.Vector3.Cross(forward, right).normalize();
                const rotMat = BABYLON.Matrix.FromXYZ(0,0,0); // placeholder
                // Use lookRotation equivalent
                const targetRot = BABYLON.Quaternion.LookRotationLH(forward, actualUp);
                ship.root.rotationQuaternion = BABYLON.Quaternion.Slerp(
                    ship.root.rotationQuaternion, targetRot, 0.08
                );
            } else if (target && target.alive) {
                const toTarget = target.root.position.subtract(ship.root.position).normalize();
                const up = new BABYLON.Vector3(0, 1, 0);
                const right = BABYLON.Vector3.Cross(up, toTarget).normalize();
                const actualUp = BABYLON.Vector3.Cross(toTarget, right).normalize();
                const targetRot = BABYLON.Quaternion.LookRotationLH(toTarget, actualUp);
                ship.root.rotationQuaternion = BABYLON.Quaternion.Slerp(
                    ship.root.rotationQuaternion, targetRot, 0.05
                );
            }
            
            // Firing logic
            ship.fireCooldown -= dt;
            if (ship.fireCooldown <= 0 && target && target.alive) {
                this.fireProjectiles(ship, target);
                ship.fireCooldown = ship.fireRate;
            }
            
            // Update health bar
            this.updateHealthBar(ship);
        });
    }
    
    findTarget(ship, enemyFleet) {
        let bestTarget = null;
        let bestScore = -Infinity;
        
        enemyFleet.ships.forEach(enemy => {
            if (!enemy.alive) return;
            const dist = BABYLON.Vector3.Distance(ship.root.position, enemy.root.position);
            // Prefer closer, prefer flagship
            const score = (enemy.isFlagship ? 100 : 0) - dist * 0.5;
            if (score > bestScore) {
                bestScore = score;
                bestTarget = enemy;
            }
        });
        
        return bestTarget;
    }
    
    fireProjectiles(ship, target) {
        const fleet = ship.isBlue ? this.blueFleet : this.redFleet;
        fleet.shots++;
        
        const projCount = ship.projectilesPerShot;
        const spread = projCount > 1 ? 0.08 : 0;
        
        for (let i = 0; i < projCount; i++) {
            // Get firing position (front of ship)
            const forward = ship.root.rotationQuaternion 
                ? new BABYLON.Vector3(0, 0, 1).rotateByQuaternion(ship.root.rotationQuaternion)
                : new BABYLON.Vector3(0, 0, ship.isBlue ? 1 : -1);
            
            const firePos = ship.root.position.add(forward.scale(ship.size * 1.5));
            
            // Direction to target with lead
            let toTarget = target.root.position.subtract(firePos);
            const targetVel = target.velocity || new BABYLON.Vector3(0,0,0);
            const leadTime = toTarget.length() / 120; // projectile speed
            toTarget.addInPlace(targetVel.scale(leadTime));
            
            if (projCount > 1) {
                const right = BABYLON.Vector3.Cross(new BABYLON.Vector3(0,1,0), toTarget).normalize();
                const offset = (i - 0.5) * spread;
                toTarget.addInPlace(right.scale(offset));
            }
            
            toTarget.normalize();
            
            this.createProjectile(firePos, toTarget, ship.isBlue, ship);
        }
    }
    
    createProjectile(position, direction, isBlue, sourceShip) {
        const proj = {
            mesh: null,
            trail: null,
            position: position.clone(),
            velocity: direction.scale(120), // Fast projectiles
            isBlue,
            damage: sourceShip.isFlagship ? 35 : 25,
            life: 5, // seconds
            sourceShip
        };
        
        // Visual mesh
        const sphere = BABYLON.MeshBuilder.CreateSphere('proj', { diameter: isBlue ? 0.8 : 1.0, segments: 8 }, this.scene);
        sphere.position = position.clone();
        const mat = new BABYLON.StandardMaterial('projMat', this.scene);
        const color = isBlue ? new BABYLON.Color3(0, 0.8, 1) : new BABYLON.Color3(1, 0.3, 0.1);
        mat.emissiveColor = color;
        mat.diffuseColor = color.scale(0.3);
        mat.disableLighting = true;
        sphere.material = mat;
        proj.mesh = sphere;
        
        // Glow light
        const light = new BABYLON.PointLight('projLight', position, this.scene);
        light.diffuse = color;
        light.specular = color;
        light.intensity = 10;
        light.range = 10;
        light.parent = sphere;
        
        // Trail particle system
        const trail = new BABYLON.ParticleSystem('projTrail', 30, this.scene);
        trail.particleTexture = this.createGlowTexture(color);
        trail.emitter = sphere;
        trail.minEmitBox = trail.maxEmitBox = new BABYLON.Vector3(0,0,0);
        trail.color1 = new BABYLON.Color4(color.r, color.g, color.b, 0.6);
        trail.color2 = new BABYLON.Color4(color.r, color.g, color.b, 0.2);
        trail.colorDead = new BABYLON.Color4(color.r, color.g, color.b, 0);
        trail.minSize = 0.5;
        trail.maxSize = 1.2;
        trail.minLifeTime = 0.05;
        trail.maxLifeTime = 0.2;
        trail.emitRate = 150;
        trail.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
        trail.gravity = new BABYLON.Vector3(0,0,0);
        trail.direction1 = direction.scale(-0.5).add(new BABYLON.Vector3(0.2,0.2,0.2));
        trail.direction2 = direction.scale(-0.5).add(new BABYLON.Vector3(-0.2,-0.2,-0.2));
        trail.minEmitPower = 0;
        trail.maxEmitPower = 0.5;
        trail.updateSpeed = 0.01;
        trail.start();
        proj.trail = trail;
        
        this.projectiles.push(proj);
    }
    
    updateProjectiles(dt) {
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            proj.life -= dt;
            proj.position.addInPlace(proj.velocity.scale(dt));
            proj.mesh.position = proj.position;
            
            if (proj.life <= 0) {
                this.destroyProjectile(proj);
                this.projectiles.splice(i, 1);
            }
        }
    }
    
    destroyProjectile(proj) {
        if (proj.mesh) {
            proj.mesh.dispose();
        }
        if (proj.trail) {
            proj.trail.stop();
            setTimeout(() => proj.trail.dispose(), 500);
        }
    }
    
    checkCollisions() {
        // Projectile vs Ship
        this.projectiles.forEach(proj => {
            if (proj.life <= 0) return;
            
            this.ships.forEach(ship => {
                if (!ship.alive || ship.isBlue === proj.isBlue) return;
                
                const dist = BABYLON.Vector3.Distance(proj.position, ship.root.position);
                const hitRadius = ship.size * (ship.isFlagship ? 1.2 : 0.8);
                
                if (dist < hitRadius) {
                    this.applyDamage(ship, proj.damage, proj.position);
                    this.destroyProjectile(proj);
                    proj.life = 0; // Mark for removal
                }
            });
        });
        
        // Remove dead projectiles
        this.projectiles = this.projectiles.filter(p => p.life > 0);
    }
    
    applyDamage(ship, damage, hitPos) {
        if (!ship.alive) return;
        
        ship.health -= damage;
        ship.lastDamageTime = this.time;
        
        // Hit effect
        this.createHitEffect(hitPos, ship.isBlue);
        
        if (ship.health <= 0) {
            this.destroyShip(ship);
        }
    }
    
    createHitEffect(position, isBlue) {
        const color = isBlue ? new BABYLON.Color3(0, 0.8, 1) : new BABYLON.Color3(1, 0.3, 0.1);
        
        // Spark burst
        const ps = new BABYLON.ParticleSystem('hitSparks', 50, this.scene);
        ps.particleTexture = this.createGlowTexture(color);
        ps.emitter = position;
        ps.minEmitBox = ps.maxEmitBox = new BABYLON.Vector3(0,0,0);
        ps.color1 = new BABYLON.Color4(color.r, color.g, color.b, 1);
        ps.color2 = new BABYLON.Color4(1, 1, 0.5, 0.8);
        ps.colorDead = new BABYLON.Color4(1, 0.5, 0, 0);
        ps.minSize = 0.3;
        ps.maxSize = 0.8;
        ps.minLifeTime = 0.1;
        ps.maxLifeTime = 0.4;
        ps.emitRate = 500;
        ps.manualEmitCount = 30;
        ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
        ps.gravity = new BABYLON.Vector3(0,0,0);
        ps.direction1 = new BABYLON.Vector3(-1,-1,-1);
        ps.direction2 = new BABYLON.Vector3(1,1,1);
        ps.minEmitPower = 5;
        ps.maxEmitPower = 15;
        ps.updateSpeed = 0.01;
        ps.start();
        setTimeout(() => ps.dispose(), 1000);
    }
    
    destroyShip(ship) {
        ship.alive = false;
        
        const fleet = ship.isBlue ? this.blueFleet : this.redFleet;
        fleet.alive--;
        
        // Hide health bar
        if (ship.healthBar) ship.healthBar.setEnabled(false);
        if (ship.healthBarBg) ship.healthBarBg.setEnabled(false);
        
        // Stop engines
        ship.engineMeshes.forEach(em => {
            em.particleSystem.stop();
            em.light.intensity = 0;
        });
        
        // Create explosion
        this.createExplosion(ship.root.position, ship.size, ship.isBlue, ship.isFlagship);
        
        // Remove ship mesh after delay (debris stays)
        setTimeout(() => {
            ship.root.getChildren().forEach(child => {
                if (child.name !== 'debris') child.dispose();
            });
        }, 5000);
    }
    
    createExplosion(position, shipSize, isBlue, isFlagship) {
        const scale = isFlagship ? 2.5 : 1;
        const baseRadius = shipSize * scale;
        const color = isBlue ? 
            { main: new BABYLON.Color3(0, 0.6, 1), hot: new BABYLON.Color3(0, 1, 1), warm: new BABYLON.Color3(0.2, 0.8, 1) } :
            { main: new BABYLON.Color3(1, 0.2, 0), hot: new BABYLON.Color3(1, 0.6, 0), warm: new BABYLON.Color3(1, 0.3, 0.1) };
        
        const explosion = {
            position: position.clone(),
            time: 0,
            duration: 3,
            shockwaveTime: 0,
            debris: [],
            light: null
        };
        
        // 1. FLASH - Intense point light
        const flashLight = new BABYLON.PointLight('expFlash', position, this.scene);
        flashLight.diffuse = color.hot;
        flashLight.specular = color.hot;
        flashLight.intensity = isFlagship ? 200 : 100;
        flashLight.range = baseRadius * 4;
        explosion.light = flashLight;
        
        // Animate flash
        const flashAnim = this.scene.registerBeforeRender(() => {
            if (explosion.time < 0.1) {
                flashLight.intensity = (isFlagship ? 200 : 100) * (1 - explosion.time / 0.1);
            } else {
                flashLight.intensity = 0;
                this.scene.unregisterBeforeRender(flashAnim);
            }
        });
        
        // 2. FIREBALL - Expanding sphere of fire
        const fireball = new BABYLON.ParticleSystem('fireball', 300, this.scene);
        fireball.particleTexture = this.createGlowTexture(color.hot);
        fireball.emitter = position;
        fireball.minEmitBox = new BABYLON.Vector3(-baseRadius*0.3, -baseRadius*0.3, -baseRadius*0.3);
        fireball.maxEmitBox = new BABYLON.Vector3(baseRadius*0.3, baseRadius*0.3, baseRadius*0.3);
        fireball.color1 = new BABYLON.Color4(color.hot.r, color.hot.g, color.hot.b, 1);
        fireball.color2 = new BABYLON.Color4(color.warm.r, color.warm.g, color.warm.b, 0.8);
        fireball.colorDead = new BABYLON.Color4(color.main.r, color.main.g, color.main.b, 0);
        fireball.minSize = baseRadius * 0.5;
        fireball.maxSize = baseRadius * 2;
        fireball.minLifeTime = 0.5;
        fireball.maxLifeTime = 1.5;
        fireball.emitRate = 2000;
        fireball.manualEmitCount = 150;
        fireball.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
        fireball.gravity = new BABYLON.Vector3(0, 0, 0);
        fireball.direction1 = new BABYLON.Vector3(-1, -1, -1);
        fireball.direction2 = new BABYLON.Vector3(1, 1, 1);
        fireball.minEmitPower = 0;
        fireball.maxEmitPower = baseRadius * 2;
        fireball.updateSpeed = 0.01;
        fireball.start();
        
        // 3. SHOCKWAVE - Expanding ring
        const shockwave = BABYLON.MeshBuilder.CreateTorus('shockwave', {
            diameter: 1, thickness: 0.1, tessellation: 64
        }, this.scene);
        shockwave.position = position.clone();
        shockwave.rotation.x = Math.PI/2;
        const swMat = new BABYLON.StandardMaterial('swMat', this.scene);
        swMat.emissiveColor = color.hot;
        swMat.alpha = 0.8;
        swMat.disableLighting = true;
        shockwave.material = swMat;
        
        // 4. SPARKS / EMBERS
        const sparks = new BABYLON.ParticleSystem('sparks', 500, this.scene);
        sparks.particleTexture = this.createGlowTexture(color.warm);
        sparks.emitter = position;
        sparks.minEmitBox = sparks.maxEmitBox = new BABYLON.Vector3(0,0,0);
        sparks.color1 = new BABYLON.Color4(1, 0.8, 0.3, 1);
        sparks.color2 = new BABYLON.Color4(color.warm.r, color.warm.g, color.warm.b, 0.8);
        sparks.colorDead = new BABYLON.Color4(0.5, 0.2, 0, 0);
        sparks.minSize = 0.2;
        sparks.maxSize = 0.6;
        sparks.minLifeTime = 0.5;
        sparks.maxLifeTime = 2.5;
        sparks.emitRate = 5000;
        sparks.manualEmitCount = 200;
        sparks.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
        sparks.gravity = new BABYLON.Vector3(0, -2, 0);
        sparks.direction1 = new BABYLON.Vector3(-1, -0.5, -1);
        sparks.direction2 = new BABYLON.Vector3(1, 1, 1);
        sparks.minEmitPower = baseRadius * 3;
        sparks.maxEmitPower = baseRadius * 8;
        sparks.updateSpeed = 0.01;
        sparks.start();
        
        // 5. SMOKE / DEBRIS CLOUD
        const smoke = new BABYLON.ParticleSystem('smoke', 200, this.scene);
        smoke.particleTexture = this.createSmokeTexture();
        smoke.emitter = position;
        smoke.minEmitBox = new BABYLON.Vector3(-baseRadius, -baseRadius, -baseRadius);
        smoke.maxEmitBox = new BABYLON.Vector3(baseRadius, baseRadius, baseRadius);
        smoke.color1 = new BABYLON.Color4(0.3, 0.25, 0.2, 0.4);
        smoke.color2 = new BABYLON.Color4(0.15, 0.12, 0.1, 0.2);
        smoke.colorDead = new BABYLON.Color4(0.05, 0.04, 0.03, 0);
        smoke.minSize = baseRadius * 0.8;
        smoke.maxSize = baseRadius * 2.5;
        smoke.minLifeTime = 2;
        smoke.maxLifeTime = 5;
        smoke.emitRate = 500;
        smoke.manualEmitCount = 80;
        smoke.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
        smoke.gravity = new BABYLON.Vector3(0, 0.5, 0);
        smoke.direction1 = new BABYLON.Vector3(-0.5, 0, -0.5);
        smoke.direction2 = new BABYLON.Vector3(0.5, 1, 0.5);
        smoke.minEmitPower = 1;
        smoke.maxEmitPower = 3;
        smoke.updateSpeed = 0.01;
        smoke.start();
        
        // 6. DEBRIS PIECES (meshes with physics-like motion)
        const debrisCount = isFlagship ? 20 : 10;
        for (let i = 0; i < debrisCount; i++) {
            const debrisSize = shipSize * (0.2 + Math.random() * 0.3) * scale;
            const debris = BABYLON.MeshBuilder.CreateBox(`debris_${i}`, {
                width: debrisSize, height: debrisSize * 0.5, depth: debrisSize * 0.8
            }, this.scene);
            debris.position = position.clone();
            debris.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            
            const dMat = new BABYLON.StandardMaterial('debrisMat', this.scene);
            dMat.diffuseColor = new BABYLON.Color3(0.2, 0.18, 0.15);
            dMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            dMat.specularPower = 16;
            debris.material = dMat;
            
            const vel = new BABYLON.Vector3(
                (Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*2
            ).normalize().scale(5 + Math.random() * 15 * scale);
            const angVel = new BABYLON.Vector3(
                (Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10
            );
            
            explosion.debris.push({ mesh: debris, velocity: vel, angularVelocity: angVel, life: 8 + Math.random()*5 });
        }
        
        // 7. SECONDARY EXPLOSIONS (delayed)
        if (isFlagship) {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const offset = new BABYLON.Vector3(
                        (Math.random()-0.5)*baseRadius*1.5,
                        (Math.random()-0.5)*baseRadius,
                        (Math.random()-0.5)*baseRadius*1.5
                    );
                    this.createMiniExplosion(position.add(offset), baseRadius * 0.4, color);
                }, 200 + i * 300);
            }
        }
        
        explosion.fireball = fireball;
        explosion.sparks = sparks;
        explosion.smoke = smoke;
        explosion.shockwave = shockwave;
        explosion.swMat = swMat;
        explosion.baseRadius = baseRadius;
        explosion.color = color;
        
        this.explosions.push(explosion);
        
        // Chain reaction check
        this.checkChainReaction(position, baseRadius * 1.2, ship.isBlue);
    }
    
    createMiniExplosion(position, radius, color) {
        const ps = new BABYLON.ParticleSystem('miniExp', 100, this.scene);
        ps.particleTexture = this.createGlowTexture(color.hot);
        ps.emitter = position;
        ps.minEmitBox = ps.maxEmitBox = new BABYLON.Vector3(0,0,0);
        ps.color1 = new BABYLON.Color4(color.hot.r, color.hot.g, color.hot.b, 1);
        ps.color2 = new BABYLON.Color4(color.warm.r, color.warm.g, color.warm.b, 0.8);
        ps.colorDead = new BABYLON.Color4(color.main.r, color.main.g, color.main.b, 0);
        ps.minSize = radius * 0.5;
        ps.maxSize = radius * 1.5;
        ps.minLifeTime = 0.3;
        ps.maxLifeTime = 1;
        ps.emitRate = 1000;
        ps.manualEmitCount = 50;
        ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
        ps.gravity = new BABYLON.Vector3(0,0,0);
        ps.direction1 = new BABYLON.Vector3(-1,-1,-1);
        ps.direction2 = new BABYLON.Vector3(1,1,1);
        ps.minEmitPower = 0;
        ps.maxEmitPower = radius * 2;
        ps.updateSpeed = 0.01;
        ps.start();
        setTimeout(() => ps.dispose(), 2000);
    }
    
    createSmokeTexture() {
        const tex = new BABYLON.DynamicTexture('smokeTex', 128, this.scene, true);
        const ctx = tex.getContext();
        // Perlin-like noise for smoke
        for (let i = 0; i < 200; i++) {
            const x = Math.random() * 128;
            const y = Math.random() * 128;
            const r = 5 + Math.random() * 20;
            const alpha = Math.random() * 0.3;
            const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, `rgba(80,70,60,${alpha})`);
            grad.addColorStop(1, 'rgba(40,35,30,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI*2);
            ctx.fill();
        }
        tex.update();
        return tex;
    }
    
    checkChainReaction(explosionPos, radius, excludeBlue) {
        this.ships.forEach(ship => {
            if (!ship.alive || ship.isBlue === excludeBlue) return;
            const dist = BABYLON.Vector3.Distance(ship.root.position, explosionPos);
            if (dist < radius) {
                // Chain reaction!
                setTimeout(() => {
                    if (ship.alive) this.destroyShip(ship);
                }, Math.random() * 500);
            }
        });
    }
    
    updateExplosions(dt) {
        for (let i = this.explosions.length - 1; i >= 0; i--) {
            const exp = this.explosions[i];
            exp.time += dt;
            
            // Shockwave expansion
            if (exp.shockwave && exp.time < 1.5) {
                const progress = exp.time / 1.5;
                const size = exp.baseRadius * 8 * progress;
                exp.shockwave.scaling.set(size, size, size);
                exp.swMat.alpha = 0.8 * (1 - progress) * Math.max(0, 1 - progress * 1.5);
            }
            
            // Debris physics
            exp.debris.forEach(deb => {
                if (deb.life > 0) {
                    deb.life -= dt;
                    deb.velocity.y -= 2 * dt; // gravity
                    deb.mesh.position.addInPlace(deb.velocity.scale(dt));
                    deb.mesh.rotation.addInPlace(deb.angularVelocity.scale(dt));
                    
                    if (deb.life < 2) {
                        deb.mesh.visibility = deb.life / 2;
                    }
                }
            });
            
            // Cleanup
            if (exp.time > exp.duration) {
                if (exp.fireball) { exp.fireball.stop(); exp.fireball.dispose(); }
                if (exp.sparks) { exp.sparks.stop(); exp.sparks.dispose(); }
                if (exp.smoke) { exp.smoke.stop(); exp.smoke.dispose(); }
                if (exp.shockwave) { exp.shockwave.dispose(); exp.swMat.dispose(); }
                if (exp.light) { exp.light.dispose(); }
                exp.debris.forEach(deb => deb.mesh.dispose());
                this.explosions.splice(i, 1);
            }
        }
    }
    
    checkBattleEnd() {
        if (this.battleEnded) return;
        
        const blueAlive = this.blueFleet.alive;
        const redAlive = this.redFleet.alive;
        
        if (blueAlive === 0 || redAlive === 0) {
            this.battleEnded = true;
            const victor = blueAlive > 0 ? 'BLUE FLEET' : 'RED FLEET';
            const victorColor = blueAlive > 0 ? '#00bfff' : '#ff4444';
            
            document.getElementById('victoryText').textContent = `${victor} VICTORIOUS`;
            document.getElementById('victoryText').style.color = victorColor;
            document.getElementById('battleStatus').classList.add('visible');
            
            // Stop camera auto-rotate
            this.camera.alpha = this.camera.alpha; // freeze
        }
    }
    
    updateUI() {
        document.getElementById('blueAlive').textContent = this.blueFleet.alive;
        document.getElementById('redAlive').textContent = this.redFleet.alive;
        document.getElementById('blueShots').textContent = this.blueFleet.shots;
        document.getElementById('redShots').textContent = this.redFleet.shots;
        
        if (this.blueFleet.flagship) {
            const hp = Math.max(0, Math.round(this.blueFleet.flagship.health / this.blueFleet.flagship.maxHealth * 100));
            document.getElementById('blueFlagshipHP').textContent = `${hp}%`;
            document.getElementById('blueFlagshipHP').className = hp > 60 ? 'stat-value alive' : hp > 30 ? 'stat-value' : 'stat-value dead';
        }
        if (this.redFleet.flagship) {
            const hp = Math.max(0, Math.round(this.redFleet.flagship.health / this.redFleet.flagship.maxHealth * 100));
            document.getElementById('redFlagshipHP').textContent = `${hp}%`;
            document.getElementById('redFlagshipHP').className = hp > 60 ? 'stat-value alive' : hp > 30 ? 'stat-value' : 'stat-value dead';
        }
    }
}

// Start the battle when page loads
window.addEventListener('DOMContentLoaded', () => {
    new SpaceBattle();
});
</script>
