<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Battle - Babylon.js</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // Scene variables
        let scene;
let ships = [];
let projectiles = [];
let debrisPieces = [];
let healthBars = [];

        // Fleet colors
        const BLUE_TEAM = '#00ffff';
        const RED_TEAM = '#ff0000';

        function createScene() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.1, 1);

            // Camera setup
            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 4, Math.PI / 2.5, 150, 
                new BABYLON.Vector3(0, 10, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 300;
            camera.wheelPrecision = 50;

            // Lighting
            const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 0, 1), scene);
            ambientLight.intensity = 0.3;

            const mainLight = new BABYLON.DirectionalLight("main", new BABYLON.Vector3(-1, -2, -1), scene);
            mainLight.intensity = 0.8;
            mainLight.position = new BABYLON.Vector3(50, 100, 50);

            const ambientGlow = new BABYLON.PointLight("ambientGlow", new BABYLON.Vector3(0, 20, 0), scene);
            ambientGlow.intensity = 0.5;
            ambientGlow.diffuse = new BABYLON.Color3(0.2, 0.3, 0.5);

            // Create starfield background
            createStarfield();

            // Create nebula effect
            createNebula();

            // Create fleets
            createFleet(BLUE_TEAM, -40, true);
            createFleet(RED_TEAM, 40, false);

            // Animation loop
            scene.registerBeforeRender(() => {
                updateShips();
                updateProjectiles();
                updateHealthBars();
            });

            return scene;
        }

        function createStarfield() {
            const texture = BABYLON.CubeTexture.CreateFromImages([""], "assets/images/", "", scene);
            
            // Create particles for stars
            const starCount = 5000;
            const stars = BABYLON.MeshBuilder.CreatePointsCloud("stars", {
                pointsCount: starCount,
                randomFill: false
            }, scene);
            
            const positions = [];
            for (let i = 0; i < starCount; i++) {
                const x = (Math.random() - 0.5) * 4000;
                const y = (Math.random() - 0.5) * 4000;
                const z = (Math.random() - 0.5) * 4000;
                positions.push(x, y, z);
            }
            stars.setParticles(positions, 2);
            stars.material = new BABYLON.StandardMaterial("starMat", scene);
            stars.material.emissiveTexture = new BABYLON.Texture("data:text/plain;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7", scene);
            stars.particleSystem = new BABYLON.ParticleSystem("particles", 2000, scene);
            stars.particleSystem.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIElEQVQIW42RMQqAMBCFx3YtO8d/2Tm2kYWFR4C6NrZuMzCzrKqqJhEREREREREREXgH9zWU1vAeAAAAAAAAAOBv6h5f37S2YwQAAAAASUVORK5CYII=", scene);
            
            // Use a different approach - create individual stars
            const sphere = BABYLON.MeshBuilder.CreateSphere("starMesh", { diameter: 2 }, scene);
            const starMaterial = new BABYLON.StandardMaterial("starMat", scene);
            starMaterial.emissiveColor = new BABYLON.Color3(1, 1, 0.8);
            starMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
            starMaterial.disableLighting = true;
            
            for (let i = 0; i < starCount; i++) {
                const star = BABYLON.Mesh.Copy("star_" + i, sphere, scene);
                star.scaling = new BABYLON.Vector3(
                    Math.random() * 0.5 + 0.1,
                    Math.random() * 0.5 + 0.1,
                    Math.random() * 0.5 + 0.1
                );
                star.material = starMaterial;
                star.position = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 3000,
                    (Math.random() - 0.5) * 2000,
                    (Math.random() - 0.5) * 3000
                );
                star.visibility = 0.3;
            }
        }

        function createNebula() {
            // Create volumetric cloud-like structures for nebula
            for (let i = 0; i < 5; i++) {
                const size = 80 + Math.random() * 60;
                const color = Math.random() > 0.5 ? 
                    new BABYLON.Color4(0.3, 0.1, 0.5, 0.3) :
                    new BABYLON.Color4(0.1, 0.3, 0.5, 0.3);
                    
                const material = new BABYLON.StandardMaterial("nebulaMat" + i, scene);
                material.backFaceCulling = false;
                material.alpha = 0.1;
                
                const sphere = BABYLON.MeshBuilder.CreateSphere("nebula_" + i, { 
                    diameter: size,
                    segments: 8
                }, scene);
                sphere.material = material;
                sphere.position = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 200,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 200
                );
            }
        }

        function createShipGeometry(teamIsBlue) {
            const isFlagship = Math.random() > 0.8;
            const scale = isFlagship ? 3 : 1;
            const geometry = BABYLON.MeshBuilder.CreateExtrudedShape("ship_" + teamIsBlue, {
                shape: [
                    { x: 0, y: 0 },
                    { x: 1, y: 0 },
                    { x: 1.5, y: -0.5 },
                    { x: 2, y: 0 },
                    { x: 1.5, y: 0.5 },
                    { x: 2, y: 1 },
                    { x: 1, y: 1 },
                    { x: 0, y: 0.5 },
                    { x: -1, y: 0 },
                    { x: 0, y: -0.5 }
                ],
                path: [
                    { x: 0, y: 0 },
                    { x: 0, y: 1 },
                    { x: 1, y: 1 },
                    { x: 1, y: 0 },
                    { x: 0, y: 0 }
                ],
                scale: scale,
                sections: 16,
                rotationX: Math.PI / 2
            }, scene);

            geometry.position.y = 1;

            const mat = new BABYLON.StandardMaterial("shipMat", scene);
            
            if (teamIsBlue) {
                mat.diffuseColor = new BABYLON.Color3(0.1, 0.5, 1);
                mat.emissiveColor = new BABYLON.Color3(0.1, 0.5, 1);
            } else {
                mat.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2);
                mat.emissiveColor = new BABYLON.Color3(1, 0.2, 0.2);
            }

            if (isFlagship) {
                // Add more detail to flagship
                const cockpit = BABYLON.MeshBuilder.CreateCylinder("cockpit", {
                    diameter: 0.3 * scale,
                    height: 0.5 * scale,
                    tessellation: 16
                }, scene);
                cockpit.position = new BABYLON.Vector3(0.5 * scale, 0.3 * scale, 0);
                cockpit.rotation = Math.PI / 2;
                cockpit.parent = geometry;
                
                const cockpitMat = new BABYLON.StandardMaterial("cockpitMat", scene);
                cockpitMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.3);
                cockpitMat.emissiveColor = teamIsBlue ? 
                    new BABYLON.Color3(0.2, 0.5, 1) : new BABYLON.Color3(1, 0.3, 0.3);
                cockpit.mat = cockpitMat;

                // Add wings
                const wingSize = scale * 1.2;
                const leftWing = BABYLON.MeshBuilder.CreatePlane("leftWing", { width: wingSize, height: 0.2 * scale }, scene);
                leftWing.position = new BABYLON.Vector3(0.3 * scale, -0.2 * scale, -0.3 * wingSize);
                leftWing.rotationX = Math.PI / 4;
                leftWing.parent = geometry;
                
                const rightWing = BABYLON.MeshBuilder.CreatePlane("rightWing", { width: wingSize, height: 0.2 * scale }, scene);
                rightWing.position = new BABYLON.Vector3(0.3 * scale, -0.2 * scale, 0.3 * wingSize);
                rightWing.rotationX = -Math.PI / 4;
                rightWing.parent = geometry;
            }

            geometry.material = mat;
            return { mesh: geometry, isFlagship: isFlagship };
        }

        function createProjectile(teamIsBlue, position, direction) {
            const projectMat = new BABYLON.StandardMaterial("projMat", scene);
            projectMat.emissiveColor = teamIsBlue ? 
                new BABYLON.Color3(0.2, 0.8, 1) : new BABYLON.Color3(1, 0.3, 0.3);
            projectMat.diffuseColor = projectMat.emissiveColor;
            
            const projectile = BABYLON.MeshBuilder.CreateSphere("projectile", { 
                diameter: 0.3 
            }, scene);
            projectile.material = projectMat;
            projectile.position.copyFrom(position);
            
            const trailMaterial = new BABYLON.StandardMaterial("trailMat", scene);
            trailMaterial.emissiveColor = projectMat.emissiveColor;
            
            const trail = BABYLON.MeshBuilder.CreateTube("trail", {
                path: [position.clone()],
                radius: 0.05,
                sections: 4
            }, scene);
            trail.material = trailMaterial;
            
            const speed = 2.0 + Math.random() * 0.5;
            const velocity = direction ? direction.scale(speed) : new BABYLON.Vector3(0, 0, -speed);
            
            return {
                mesh: projectile,
                velocity: velocity,
                teamIsBlue: teamIsBlue,
                life: 60,
                trail: trail,
                trailPositions: [position.clone()]
            };
        }

        function createExplosion(position, teamIsBlue) {
            // Fire particles - red for enemy team, blue for friendly team
            const firePS = new BABYLON.ParticleSystem("fire", 100, scene);
            firePS.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAACklEQVR4nGNgYGD4zwAEjGhgZGSiBQwMAAwyAwMDSQcAAAAASUVORK5CYII=", scene);
            firePS.color1 = new BABYLON.Color4(1, 0.5, 0.1, 1);
            firePS.color2 = new BABYLON.Color4(1, 0.8, 0.2, 1);
            firePS.minSize = 0.3;
            firePS.maxSize = 1;
            firePS.minLifeTime = 0.5;
            firePS.maxLifeTime = 1.5;
            firePS.emitPower = 50;
            firePS.imageWidth = 64;
            firePS.imageHeight = 64;
            firePS.targetStopDuration = 2;
            firePS.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            firePS.startDelay = BABYLON.UniversalTime;
            firePS.gravity = new BABYLON.Vector3(0, -1, 0);
            firePS.minEmitPower = 1;
            firePS.maxEmitPower = 3;
            firePS.updateRange = 60;
            firePS.start();

            // Shockwave ring
            const shockwave = BABYLON.MeshBuilder.CreateCircle("shockwave", { 
                radius: 1, 
                sides: 32,
                thickness: 0.05
            }, scene);
            const shockwaveMat = new BABYLON.StandardMaterial("shockwaveMat", scene);
            shockwaveMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0.4);
            shockwaveMat.alpha = 0.8;
            shockwave.material = shockwaveMat;
            shockwave.position = position;
            shockwave.visibility = 1;
            
            const animation = new BABYLON.Animation("expandAnim", "scaling", 60, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
            const keys = [
                { frame: 0, value: new BABYLON.Vector3(0.1, 0.1, 0.1) },
                { frame: 60, value: new BABYLON.Vector3(10, 0.1, 10) }
            ];
            animation.setKeys(keys);
            shockwave.animations = [animation];
            scene.beginAnimation(shockwave, 0, 60, false, 1);
            
            setTimeout(() => shockwave.dispose(), 2000);

            // Sparks
            const sparksPS = new BABYLON.ParticleSystem("sparks", 50, scene);
            sparksPS.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAACklEQVR4nGNgYGD4zwAEjGhgZGSiBQwMAAwyAwMDSQcAAAAASUVORK5CYII=", scene);
            sparksPS.color1 = new BABYLON.Color4(1, 0.9, 0.5, 1);
            sparksPS.color2 = new BABYLON.Color4(1, 0.7, 0.3, 1);
            sparksPS.minSize = 0.1;
            sparksPS.maxSize = 0.3;
            sparksPS.minLifeTime = 0.3;
            sparksPS.maxLifeTime = 1;
            sparksPS.emitPower = 100;
            sparksPS.minEmitPower = 1;
            sparksPS.maxEmitPower = 3;
            sparksPS.direction1 = new BABYLON.Vector3(-1, 0, -1);
            sparksPS.direction2 = new BABYLON.Vector3(1, 0, 1);
            sparksPS.updateRange = 60;
            sparksPS.start();

            // Debris pieces
            for (let i = 0; i < 10; i++) {
                const debrisPiece = BABYLON.MeshBuilder.CreatePolyhedron("debris_" + i, { 
                    size: 0.3 + Math.random() * 0.5,
                    type: 2
                }, scene);
                const debrisMat = new BABYLON.StandardMaterial("debrisMat", scene);
                debrisMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                debrisMat.emissiveColor = new BABYLON.Color3(0.8, 0.6, 0.3);
                debrisPiece.material = debrisMat;
                debrisPiece.position = position.clone().add(new BABYLON.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                ));
                debrisPiece.rotation = new BABYLON.Vector3(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );
                debrisPieces.push(debrisPiece);
                
                const debrisVel = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3
                );
                
                scene.beginAnimation(debrisPiece, 0, 200, false, 1);
                
                setTimeout(() => {
                    if (debrisPiece) debrisPiece.dispose();
                }, 2000);
            }

            // Engine flare effect - use explosion color based on team
            const engineFlare = BABYLON.MeshBuilder.CreateCylinder("engineFlare", {
                height: 1,
                diameter: 0.3
            }, scene);
            const engineFlareMat = new BABYLON.StandardMaterial("engineFlareMat", scene);
            engineFlareMat.emissiveColor = teamIsBlue ? 
                new BABYLON.Color3(0.2, 0.6, 1) : new BABYLON.Color3(1, 0.4, 0.2);
            engineFlareMat.alpha = 0.8;
            engineFlare.material = engineFlareMat;
            engineFlare.position = position;
            engineFlare.scaling.y = 0.3;
            engineFlare.rotationX = Math.PI / 2;
            
            engineFlare.animate("scaling", new BABYLON.Vector3(3, 3, 3), 1000, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
            engineFlare.animate("scaling", new BABYLON.Vector3(1, 1, 1), 1000, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
            
            setTimeout(() => engineFlare.dispose(), 2000);
        }

        function createThrustEffect(mesh, teamIsBlue) {
            const thrustMat = new BABYLON.StandardMaterial("thrustMat", scene);
            thrustMat.emissiveColor = teamIsBlue ? 
                new BABYLON.Color3(0.3, 0.6, 1) : new BABYLON.Color3(1, 0.4, 0.2);
            thrustMat.alpha = 0.8;
            
            for (let i = 0; i < 2; i++) {
                const thrust = BABYLON.MeshBuilder.CreateCylinder("thrust_" + i, {
                    height: 0.5,
                    diameter: teamIsBlue ? 0.15 : 0.1
                }, scene);
                thrust.material = thrustMat;
                thrust.parent = mesh;
                
                const yPos = teamIsBlue ? -1.5 : -1.8;
                thrust.position.set(teamIsBlue ? (i === 0 ? -0.2 : 0.2) : -0.3, yPos, 0);
                thrust.scaling.y = 0.4;
                thrust.rotationX = Math.PI / 2;
                
                // Animate thrust size
                thrust.animate("scalingY", 0.4, 1000, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
            }
        }

        function createHealthBar(shipMesh, teamIsBlue) {
            const healthBarBG = BABYLON.MeshBuilder.CreateBox("healthBG", {
                width: 1.5,
                height: 0.2,
                depth: 0.05
            }, scene);
            const bgMat = new BABYLON.StandardMaterial("bgMat", scene);
            bgMat.diffuseColor = teamIsBlue ? 
                new BABYLON.Color3(0.2, 0.2, 0.3) : new BABYLON.Color3(0.3, 0.2, 0.2);
            healthBarBG.material = bgMat;
            healthBarBG.position = new BABYLON.Vector3(0, 2.5, 0);
            healthBarBG.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            healthBarBG.parent = shipMesh;
            
            const healthBarFG = BABYLON.MeshBuilder.CreateBox("healthFG", {
                width: 1.5,
                height: 0.2,
                depth: 0.06
            }, scene);
            const fgMat = new BABYLON.StandardMaterial("fgMat", scene);
            fgMat.diffuseColor = teamIsBlue ? 
                new BABYLON.Color3(0.2, 0.8, 0.2) : new BABYLON.Color3(0.8, 0.2, 0.2);
            healthBarFG.material = fgMat;
            healthBarFG.position = new BABYLON.Vector3(-0.72, 2.5, 0.01);
            healthBarFG.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            healthBarFG.parent = shipMesh;
            
            return {
                bar: healthBarFG,
                maxHealth: 100,
                currentHealth: 100
            };
        }

        function createFleet(teamIsBlue, startX, isBlueTeam) {
            const formationSpacing = 15;
            
            // Create flagship
            const flagshipData = createShipGeometry(teamIsBlue);
            const flagshipMesh = flagshipData.mesh;
            flagshipMesh.position = new BABYLON.Vector3(startX, 0, 0);
            
            const flagshipHealth = createHealthBar(flagshipMesh, teamIsBlue);
            
            // Add thruster effect to flagship
            if (flagshipData.isFlagship) {
                createThrustEffect(flagshipMesh, teamIsBlue);
            }
            
            // Initialize flagship direction
            const dirToEnemy = new BABYLON.Vector3(-Math.sign(startX), 0, 0).normalize();
            flagshipMesh.lookAt(new BABYLON.Vector3(-Math.sign(startX) * 50, 0, 0));
            
            const flagship = {
                mesh: flagshipMesh,
                teamIsBlue: teamIsBlue,
                health: 200,
                targetPosition: null,
                speed: 0.6,
                rotationSpeed: 0.02,
                lastShot: 0,
                isFlagship: true,
                currentDirection: dirToEnemy
            };
            
            flagship.healthBar = flagshipHealth;
            ships.push(flagship);
            healthBars.push(flagshipHealth);

            // Create escort ships in formation
            const formations = [
                { x: -formationSpacing, z: -formationSpacing },
                { x: -formationSpacing, z: formationSpacing },
                { x: formationSpacing * 2, z: -formationSpacing },
                { x: formationSpacing * 2, z: formationSpacing },
                { x: formationSpacing * 3, z: -formationSpacing * 1.5 },
                { x: formationSpacing * 3, z: formationSpacing * 1.5 },
                { x: formationSpacing * 4, z: -formationSpacing * 0.5 },
                { x: formationSpacing * 4, z: formationSpacing * 0.5 },
                { x: formationSpacing * 5, z: 0 }
            ];
            
            formations.forEach((pos, index) => {
                const escortData = createShipGeometry(teamIsBlue);
                const escortMesh = escortData.mesh;
                escortMesh.position = new BABYLON.Vector3(
                    startX + pos.x,
                    0,
                    pos.z
                );
                
                // Initialize direction pointing toward enemy fleet
                const dirToEnemy = new BABYLON.Vector3(-Math.sign(startX), 0, 0).normalize();
                escortMesh.lookAt(new BABYLON.Vector3(-Math.sign(startX) * 50, 0, 0));
                
                // Add thrust to escorts
                createThrustEffect(escortMesh, teamIsBlue);
                
                const escortHealth = createHealthBar(escortMesh, teamIsBlue);
                
                const escort = {
                    mesh: escortMesh,
                    teamIsBlue: teamIsBlue,
                    health: 80,
                    targetPosition: null,
                    speed: 1.0,
                    rotationSpeed: 0.05,
                    lastShot: 0,
                    isFlagship: false,
                    currentDirection: dirToEnemy
                };
                
                escort.healthBar = escortHealth;
                ships.push(escort);
                healthBars.push(escortHealth);
            });
        }
        
        function updateShips() {
            const time = Date.now();
            
            ships.forEach(ship => {
                if (ship.isDead) return;
                
                // Find nearest enemy
                let nearestEnemy = null;
                let minDistance = Infinity;
                
                ships.forEach(other => {
                    if (!other.teamIsBlue && !other.isDead) {
                        const distance = ship.mesh.position.distanceTo(other.mesh.position);
                        if (distance < minDistance) {
                            minDistance = distance;
                            nearestEnemy = other;
                        }
                    }
                });
                
                if (nearestEnemy) {
                    const targetPos = nearestEnemy.mesh.position;
                    const dirToEnemy = targetPos.subtract(ship.mesh.position).normalize();
                    
                    // Smooth movement toward enemy
                    const desiredDirection = dirToEnemy;
                    
                    // Simple steering behavior
                    const steer = desiredDirection.subtract(ship.currentDirection || desiredDirection).scale(0.02);
                    ship.currentDirection = ship.currentDirection 
                        ? ship.currentDirection.add(steer).normalize()
                        : desiredDirection.normalize();
                    
                    // Move ship
                    ship.mesh.position.addInPlace(ship.currentDirection.scale(ship.speed * 0.15));
                    
                    // Rotate towards direction
                    ship.mesh.lookAt(ship.mesh.position.add(ship.currentDirection.clone().scale(10)));
                    
                    // Update visual orientation
                    ship.mesh.rotationQuaternion = BABYLON.Quaternion.LookRotationVector(ship.currentDirection, BABYLON.Vector3.UnitY());
                    
                    // Shooting every 3 seconds
                    if (time - ship.lastShot > 3000 && ship.currentDirection) {
                        if (ship.isFlagship) {
                            // Flagship fires two projectiles
                            for (let i = 0; i < 2; i++) {
                                const offset = new BABYLON.Vector3(i === 0 ? 0.6 : -0.6, 0.3, 0);
                                const projPos = ship.mesh.position.clone().add(offset);
                                const projDir = ship.currentDirection.clone().normalize();
                                createProjectile(ship.teamIsBlue, projPos, projDir);
                            }
                        } else {
                            const projDir = ship.currentDirection.clone().normalize();
                            createProjectile(ship.teamIsBlue, ship.mesh.position.clone().add(new BABYLON.Vector3(0, 0.5, 0)), projDir);
                        }
                        ship.lastShot = time;
                    }
                }
                
                // Random patrol movement when no target
                if (Math.random() < 0.02) {
                    ship.mesh.position.y += (Math.random() - 0.5) * 0.5;
                }
            });
        }

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                
                // Update trail
                proj.trailPositions.push(proj.mesh.position.clone());
                if (proj.trailPositions.length > 20) {
                    proj.trailPositions.shift();
                }
                
                proj.trail.path = [...proj.trailPositions];
                proj.trail.refresh();
                
                // Update trail with current position
                if (proj.trailPositions.length === 0 || proj.trailPositions[proj.trailPositions.length - 1].distanceTo(proj.mesh.position) > 0.1) {
                    proj.trailPositions.push(proj.mesh.position.clone());
                }
                if (proj.trailPositions.length > 25) {
                    proj.trailPositions.shift();
                }
                proj.trail.path = [...proj.trailPositions];
                proj.trail.refresh();
                
                // Move projectile
                proj.life -= 1;
                proj.mesh.position.addInPlace(proj.velocity.scale(0.1));
                
                // Check collision with enemies
                let hit = false;
                if (proj.life > 0) {
                    const targetTeam = proj.teamIsBlue ? 'enemy' : 'friend';
                    const enemies = ships.filter(s => 
                        proj.teamIsBlue ? (!s.teamIsBlue && !s.isDead) : (s.teamIsBlue && !s.isDead)
                    );
                    
                    for (const enemy of enemies) {
                        if (proj.mesh.position.distanceTo(enemy.mesh.position) < 4) {
                            takeDamage(enemy, 15 + Math.random() * 10);
                            hit = true;
                            break;
                        }
                    }
                }
                
                if (proj.life <= 0 || hit) {
                    // Explosion effect at projectile location
                    createSmallExplosion(proj.mesh.position);
                    proj.mesh.dispose();
                    proj.trail.dispose();
                    projectiles.splice(i, 1);
                }
            }
        }

        function createSmallExplosion(position) {
            const ps = new BABYLON.ParticleSystem("smallExpl", 30, scene);
            ps.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIElEQVQIW42RMQqAMBCFx3YtO8d/2Tm2kYWFR4C6NrZuMzCzrKqqJhEREREREREREXgH9zWU1vAeAAAAAAAAAOBv6h5f37S2YwQAAAAASUVORK5CYII=", scene);
            ps.color1 = new BABYLON.Color4(1, 0.6, 0.1, 1);
            ps.color2 = new BABYLON.Color4(0.5, 0.3, 0.1, 1);
            ps.minSize = 0.1;
            ps.maxSize = 0.3;
            ps.minLifeTime = 0.2;
            ps.maxLifeTime = 0.5;
            ps.emitPower = 10;
            ps.start();
        }

        function updateHealthBars() {
            healthBars.forEach(bar => {
                if (!bar.bar.isDisposed()) {
                    const ratio = bar.currentHealth / bar.maxHealth;
                    bar.bar.scaling.x = Math.max(0.1, ratio);
                }
            });
        }

        function takeDamage(ship, damage) {
            if (ship.isDead) return;
            
            ship.health -= damage;
            
            if (ship.healthBar) {
                ship.healthBar.currentHealth = Math.max(0, ship.health);
            }
            
            // Visual feedback - flash ship
            const originalEmissive = ship.mesh.material.emissiveColor.clone();
            ship.mesh.material.emissiveColor = new BABYLON.Color3(1, 0, 0);
            
            setTimeout(() => {
                if (!ship.mesh.isDisposed()) {
                    ship.mesh.material.emissiveColor = ship.teamIsBlue ? 
                        new BABYLON.Color3(0.1, 0.5, 1) : new BABYLON.Color3(1, 0.2, 0.2);
                }
            }, 100);
            
            if (ship.health <= 0) {
                destroyShip(ship);
            }
        }

        function destroyShip(ship) {
            ship.isDead = true;
            createExplosion(ship.mesh.position, ship.teamIsBlue);
            
            // Dispose ship
            ship.mesh.dispose();
            if (ship.healthBar) {
                ship.healthBar.bar.dispose();
                ship.healthBar.bar.parent = null;
            }
            
            // Check for chain reaction
            setTimeout(() => checkChainReaction(ship.mesh.position, ship.teamIsBlue), 100);
        }

        function checkChainReaction(explosionPosition, explodedTeamIsBlue) {
            ships.forEach(ship => {
                if (!ship.isDead && ship.teamIsBlue !== explodedTeamIsBlue) {
                    const distance = ship.mesh.position.distanceTo(explosionPosition);
                    if (distance < 8) { // Chain reaction range
                        createExplosion(ship.mesh.position, ship.teamIsBlue);
                        ship.isDead = true;
                        
                        ship.mesh.dispose();
                        if (ship.healthBar) {
                            ship.healthBar.bar.dispose();
                            ship.healthBar.bar.parent = null;
                        }
                    }
                }
            });
        }

        // Initialize
        scene = createScene();
        
        engine.runRenderLoop(function() {
            scene.render();
        });
        
        window.addEventListener('resize', function() {
            engine.resize();
        });
    </script>
</body>
