<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babylon.js Space Battle</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #e8f0ff;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(80, 160, 255, 0.8);
      z-index: 10;
    }
    #hud h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #hud p {
      margin: 2px 0;
      font-size: 13px;
      opacity: 0.9;
    }
    #legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      color: #cfe0ff;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .blue { background: #3aa0ff; box-shadow: 0 0 8px #3aa0ff; }
    .red { background: #ff3a4a; box-shadow: 0 0 8px #ff3a4a; }
    #banner {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 20;
    }
    #banner span {
      font-size: clamp(28px, 5vw, 56px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 30px rgba(120, 200, 255, 0.9), 0 0 60px rgba(255, 80, 120, 0.5);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    <h1>Deep Space Engagement</h1>
    <p id="blueStatus">Azure Fleet: 10 / 10</p>
    <p id="redStatus">Crimson Fleet: 10 / 10</p>
    <p id="hint">Drag to orbit · Scroll to zoom</p>
  </div>
  <div id="legend">
    <div><span class="dot blue"></span>Azure projectiles</div>
    <div><span class="dot red"></span>Crimson projectiles</div>
  </div>
  <div id="banner"><span id="bannerText"></span></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: true,
        stencil: true,
        adaptToDeviceRatio: true
      });

      const BLUE = new BABYLON.Color3(0.25, 0.65, 1.0);
      const RED = new BABYLON.Color3(1.0, 0.22, 0.28);
      const BLUE_LIGHT = new BABYLON.Color3(0.4, 0.8, 1.0);
      const RED_LIGHT = new BABYLON.Color3(1.0, 0.35, 0.25);

      const SHIP_WIDTH = 2.2;
      const ESCORT_HP = 100;
      const FLAGSHIP_HP = 280;
      const FIRE_INTERVAL = 3.0;
      const PROJECTILE_SPEED = 55;
      const PROJECTILE_DAMAGE = 28;
      const PROJECTILE_LIFE = 4.5;
      const CHAIN_RADIUS = SHIP_WIDTH * 1.15;

      let ships = [];
      let projectiles = [];
      let explosions = [];
      let battleOver = false;
      let advancedTexture = null;
      let sceneRef = null;

      function createScene() {
        const scene = new BABYLON.Scene(engine);
        sceneRef = scene;
        scene.clearColor = new BABYLON.Color4(0.01, 0.015, 0.04, 1);
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.0045;
        scene.fogColor = new BABYLON.Color3(0.02, 0.03, 0.08);

        const camera = new BABYLON.ArcRotateCamera(
          "camera",
          -Math.PI / 2.4,
          Math.PI / 2.6,
          95,
          new BABYLON.Vector3(0, 8, 0),
          scene
        );
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 30;
        camera.upperRadiusLimit = 220;
        camera.wheelPrecision = 20;
        camera.panningSensibility = 80;
        camera.useBouncingBehavior = false;
        camera.inertia = 0.85;

        // Ambient + key lighting
        const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.2, 1, 0.3), scene);
        hemi.intensity = 0.35;
        hemi.groundColor = new BABYLON.Color3(0.05, 0.05, 0.12);

        const key = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.6, -0.8, 0.4), scene);
        key.position = new BABYLON.Vector3(40, 60, -30);
        key.intensity = 0.55;
        key.diffuse = new BABYLON.Color3(0.85, 0.9, 1);

        const rim = new BABYLON.DirectionalLight("rim", new BABYLON.Vector3(0.5, 0.2, -0.7), scene);
        rim.intensity = 0.25;
        rim.diffuse = new BABYLON.Color3(0.6, 0.4, 1);

        createStarfield(scene);
        createNebula(scene);

        advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

        // Spawn fleets
        spawnFleet(scene, "blue", new BABYLON.Vector3(-38, 0, 0), 1);
        spawnFleet(scene, "red", new BABYLON.Vector3(38, 0, 0), -1);

        scene.onBeforeRenderObservable.add(() => {
          const dt = engine.getDeltaTime() / 1000;
          if (dt <= 0 || dt > 0.1) return;
          updateShips(scene, dt);
          updateProjectiles(scene, dt);
          updateExplosions(dt);
          updateHUD();
          checkVictory();
        });

        return scene;
      }

      function createStarfield(scene) {
        const starCount = 1800;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 4);
        for (let i = 0; i < starCount; i++) {
          const r = 180 + Math.random() * 220;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = r * Math.cos(phi);
          const tint = 0.7 + Math.random() * 0.3;
          const cool = Math.random() > 0.7;
          colors[i * 4] = cool ? tint * 0.85 : tint;
          colors[i * 4 + 1] = cool ? tint * 0.9 : tint * 0.95;
          colors[i * 4 + 2] = tint;
          colors[i * 4 + 3] = 1;
        }
        const stars = new BABYLON.Mesh("stars", scene);
        const vdata = new BABYLON.VertexData();
        vdata.positions = positions;
        vdata.colors = colors;
        vdata.applyToMesh(stars);
        const mat = new BABYLON.StandardMaterial("starMat", scene);
        mat.emissiveColor = BABYLON.Color3.White();
        mat.disableLighting = true;
        mat.pointsCloud = true;
        mat.pointSize = 2;
        stars.material = mat;
        stars.isPickable = false;
        stars.infiniteDistance = true;
      }

      function createNebula(scene) {
        // Soft volumetric-looking planes for nebula glow
        const layers = [
          { pos: new BABYLON.Vector3(-80, 20, -100), color: new BABYLON.Color3(0.15, 0.05, 0.35), s: 160 },
          { pos: new BABYLON.Vector3(90, -30, -120), color: new BABYLON.Color3(0.05, 0.12, 0.35), s: 180 },
          { pos: new BABYLON.Vector3(0, 40, 140), color: new BABYLON.Color3(0.25, 0.04, 0.18), s: 200 },
          { pos: new BABYLON.Vector3(-50, -50, 80), color: new BABYLON.Color3(0.08, 0.18, 0.28), s: 140 }
        ];
        layers.forEach((L, i) => {
          const plane = BABYLON.MeshBuilder.CreatePlane("neb" + i, { size: L.s }, scene);
          plane.position = L.pos;
          plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
          plane.isPickable = false;
          const mat = new BABYLON.StandardMaterial("nebMat" + i, scene);
          mat.disableLighting = true;
          mat.emissiveColor = L.color;
          mat.alpha = 0.12;
          mat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
          mat.backFaceCulling = false;
          plane.material = mat;
        });
      }

      function makeShipMaterial(scene, team, isFlagship) {
        const mat = new BABYLON.StandardMaterial(team + (isFlagship ? "Flag" : "Esc") + "Mat", scene);
        if (team === "blue") {
          mat.diffuseColor = isFlagship ? new BABYLON.Color3(0.2, 0.35, 0.55) : new BABYLON.Color3(0.18, 0.28, 0.42);
          mat.emissiveColor = isFlagship ? new BABYLON.Color3(0.08, 0.2, 0.4) : new BABYLON.Color3(0.05, 0.12, 0.28);
          mat.specularColor = new BABYLON.Color3(0.5, 0.7, 1);
        } else {
          mat.diffuseColor = isFlagship ? new BABYLON.Color3(0.5, 0.18, 0.18) : new BABYLON.Color3(0.4, 0.16, 0.16);
          mat.emissiveColor = isFlagship ? new BABYLON.Color3(0.35, 0.08, 0.08) : new BABYLON.Color3(0.25, 0.06, 0.06);
          mat.specularColor = new BABYLON.Color3(1, 0.5, 0.4);
        }
        mat.specularPower = 48;
        return mat;
      }

      function makeAccentMaterial(scene, team) {
        const mat = new BABYLON.StandardMaterial(team + "Accent", scene);
        const c = team === "blue" ? BLUE : RED;
        mat.diffuseColor = c;
        mat.emissiveColor = c.scale(0.7);
        mat.specularColor = BABYLON.Color3.White();
        return mat;
      }

      function buildShipMesh(scene, team, isFlagship) {
        const root = new BABYLON.TransformNode(team + (isFlagship ? "Flagship" : "Escort"), scene);
        const bodyMat = makeShipMaterial(scene, team, isFlagship);
        const accentMat = makeAccentMaterial(scene, team);
        const scale = isFlagship ? 1.85 : 1.0;
        const parts = [];

        // Main hull
        const hull = BABYLON.MeshBuilder.CreateBox("hull", {
          width: 1.4 * scale,
          height: 0.55 * scale,
          depth: 3.2 * scale
        }, scene);
        hull.material = bodyMat;
        hull.parent = root;
        parts.push(hull);

        // Nose wedge
        const nose = BABYLON.MeshBuilder.CreateCylinder("nose", {
          diameterTop: 0.05 * scale,
          diameterBottom: 1.1 * scale,
          height: 1.4 * scale,
          tessellation: 4
        }, scene);
        nose.rotation.x = Math.PI / 2;
        nose.position.z = 2.0 * scale;
        nose.material = bodyMat;
        nose.parent = root;
        parts.push(nose);

        // Wings
        const wingW = isFlagship ? 3.6 : 2.4;
        const wing = BABYLON.MeshBuilder.CreateBox("wing", {
          width: wingW * scale * 0.55,
          height: 0.12 * scale,
          depth: 1.1 * scale
        }, scene);
        wing.position.z = -0.3 * scale;
        wing.material = bodyMat;
        wing.parent = root;
        parts.push(wing);

        // Engine pods
        const podOffsets = isFlagship
          ? [[-0.9, -0.15, -1.5], [0.9, -0.15, -1.5], [0, 0.35, -1.4], [-0.5, 0.2, -1.55], [0.5, 0.2, -1.55]]
          : [[-0.55, -0.1, -1.35], [0.55, -0.1, -1.35]];
        podOffsets.forEach((o, i) => {
          const pod = BABYLON.MeshBuilder.CreateCylinder("pod" + i, {
            diameter: (isFlagship ? 0.35 : 0.28) * scale,
            height: 0.7 * scale,
            tessellation: 8
          }, scene);
          pod.rotation.x = Math.PI / 2;
          pod.position.set(o[0] * scale, o[1] * scale, o[2] * scale);
          pod.material = bodyMat;
          pod.parent = root;
          parts.push(pod);
        });

        // Cockpit / bridge
        const bridge = BABYLON.MeshBuilder.CreateSphere("bridge", {
          diameterX: 0.5 * scale,
          diameterY: 0.35 * scale,
          diameterZ: 0.7 * scale,
          segments: 8
        }, scene);
        bridge.position.set(0, 0.35 * scale, 0.5 * scale);
        bridge.material = accentMat;
        bridge.parent = root;
        parts.push(bridge);

        if (isFlagship) {
          // Extra detail: dorsal fin, antenna, side batteries
          const fin = BABYLON.MeshBuilder.CreateBox("fin", {
            width: 0.12 * scale,
            height: 1.1 * scale,
            depth: 1.4 * scale
          }, scene);
          fin.position.set(0, 0.7 * scale, -0.2 * scale);
          fin.material = bodyMat;
          fin.parent = root;
          parts.push(fin);

          const antenna = BABYLON.MeshBuilder.CreateCylinder("ant", {
            diameter: 0.06 * scale,
            height: 1.2 * scale,
            tessellation: 6
          }, scene);
          antenna.position.set(0, 1.2 * scale, 0.3 * scale);
          antenna.material = accentMat;
          antenna.parent = root;
          parts.push(antenna);

          for (let s = -1; s <= 1; s += 2) {
            const bat = BABYLON.MeshBuilder.CreateBox("bat" + s, {
              width: 0.35 * scale,
              height: 0.25 * scale,
              depth: 0.8 * scale
            }, scene);
            bat.position.set(s * 1.1 * scale, 0.1 * scale, 0.6 * scale);
            bat.material = accentMat;
            bat.parent = root;
            parts.push(bat);
          }
        }

        // Thruster glow discs
        const thrusterColor = team === "blue" ? BLUE_LIGHT : RED_LIGHT;
        const thrusterMat = new BABYLON.StandardMaterial(team + "Thrust", scene);
        thrusterMat.disableLighting = true;
        thrusterMat.emissiveColor = thrusterColor;
        thrusterMat.alpha = 0.9;

        const thrusterPositions = isFlagship
          ? [[-0.9, -0.15, -1.9], [0.9, -0.15, -1.9], [0, 0.35, -1.8], [-0.5, 0.2, -1.95], [0.5, 0.2, -1.95]]
          : [[-0.55, -0.1, -1.7], [0.55, -0.1, -1.7]];

        const thrusterLights = [];
        thrusterPositions.forEach((o, i) => {
          const glow = BABYLON.MeshBuilder.CreateDisc("thrust" + i, {
            radius: (isFlagship ? 0.22 : 0.16) * scale,
            tessellation: 12
          }, scene);
          glow.rotation.x = Math.PI / 2;
          glow.position.set(o[0] * scale, o[1] * scale, o[2] * scale);
          glow.material = thrusterMat;
          glow.parent = root;
          parts.push(glow);

          // Small point light for thruster illumination
          if (i < (isFlagship ? 3 : 2)) {
            const light = new BABYLON.PointLight(
              team + "tlight" + i,
              new BABYLON.Vector3(o[0] * scale, o[1] * scale, o[2] * scale - 0.5),
              scene
            );
            light.diffuse = thrusterColor;
            light.specular = thrusterColor;
            light.intensity = isFlagship ? 0.55 : 0.35;
            light.range = isFlagship ? 14 : 9;
            light.parent = root;
            thrusterLights.push(light);
          }
        });

        // Merge visual bounds helper — use a simple invisible collision sphere later
        const shipRadius = isFlagship ? 2.4 : 1.3;

        return { root, parts, thrusterLights, shipRadius, scale };
      }

      function createHealthBar(ship) {
        const panel = new BABYLON.GUI.Rectangle("hpPanel");
        panel.width = ship.isFlagship ? "56px" : "40px";
        panel.height = "6px";
        panel.cornerRadius = 3;
        panel.color = "transparent";
        panel.thickness = 0;
        panel.background = "rgba(0,0,0,0.55)";
        advancedTexture.addControl(panel);
        panel.linkWithMesh(ship.root);
        panel.linkOffsetY = ship.isFlagship ? -48 : -28;

        const bar = new BABYLON.GUI.Rectangle("hpBar");
        bar.width = 1;
        bar.height = 1;
        bar.thickness = 0;
        bar.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        bar.background = ship.team === "blue" ? "#3aa0ff" : "#ff3a4a";
        panel.addControl(bar);

        ship.hpPanel = panel;
        ship.hpBar = bar;
      }

      function escortFormationOffsets() {
        // 3x3-ish diamond around flagship center, slightly layered in Y
        return [
          new BABYLON.Vector3(-8, 2, 6),
          new BABYLON.Vector3(8, -1, 6),
          new BABYLON.Vector3(-10, -2, -2),
          new BABYLON.Vector3(10, 3, -2),
          new BABYLON.Vector3(-6, 4, -8),
          new BABYLON.Vector3(6, -3, -8),
          new BABYLON.Vector3(0, 5, 10),
          new BABYLON.Vector3(-12, 0, 2),
          new BABYLON.Vector3(12, 1, -6)
        ];
      }

      function spawnFleet(scene, team, center, facing) {
        const offsets = escortFormationOffsets();
        // Flagship at formation center
        createShip(scene, team, true, center.clone(), facing);
        // Nine escorts in layered formation around the flagship
        offsets.forEach((off) => {
          const side = team === "blue" ? 1 : -1;
          const local = new BABYLON.Vector3(off.x * side, off.y, off.z);
          createShip(scene, team, false, center.add(local), facing);
        });
      }

      function createShip(scene, team, isFlagship, position, facing) {
        const built = buildShipMesh(scene, team, isFlagship);
        built.root.position = position.clone();
        // Face toward enemy (blue faces +X-ish? Actually blue at -X faces +X toward red)
        const yaw = team === "blue" ? Math.PI / 2 : -Math.PI / 2;
        built.root.rotation.y = yaw;

        const ship = {
          root: built.root,
          parts: built.parts,
          thrusterLights: built.thrusterLights,
          radius: built.shipRadius,
          team,
          isFlagship,
          hp: isFlagship ? FLAGSHIP_HP : ESCORT_HP,
          maxHp: isFlagship ? FLAGSHIP_HP : ESCORT_HP,
          alive: true,
          velocity: new BABYLON.Vector3(
            (team === "blue" ? 1 : -1) * (2 + Math.random() * 2),
            (Math.random() - 0.5) * 1.5,
            (Math.random() - 0.5) * 2
          ),
          targetVelocity: BABYLON.Vector3.Zero(),
          fireTimer: Math.random() * FIRE_INTERVAL,
          maneuverTimer: Math.random() * 2,
          wanderTarget: position.clone(),
          homeCenter: position.clone(),
          angular: new BABYLON.Vector3(
            (Math.random() - 0.5) * 0.2,
            (Math.random() - 0.5) * 0.4,
            (Math.random() - 0.5) * 0.15
          )
        };

        createHealthBar(ship);
        ships.push(ship);
        return ship;
      }

      function aliveEnemies(team) {
        return ships.filter((s) => s.alive && s.team !== team);
      }

      function aliveAllies(team) {
        return ships.filter((s) => s.alive && s.team === team);
      }

      function pickTarget(ship) {
        const enemies = aliveEnemies(ship.team);
        if (!enemies.length) return null;
        let best = null;
        let bestScore = Infinity;
        enemies.forEach((e) => {
          const d = BABYLON.Vector3.DistanceSquared(ship.root.position, e.root.position);
          // Prefer closer; slight bias to flagships
          const score = d * (e.isFlagship ? 0.85 : 1);
          if (score < bestScore) {
            bestScore = score;
            best = e;
          }
        });
        return best;
      }

      function updateShips(scene, dt) {
        ships.forEach((ship) => {
          if (!ship.alive) return;

          ship.maneuverTimer -= dt;
          ship.fireTimer -= dt;

          const target = pickTarget(ship);
          const pos = ship.root.position;

          // Choose wander / engagement point
          if (ship.maneuverTimer <= 0) {
            ship.maneuverTimer = 1.2 + Math.random() * 2.5;
            if (target) {
              const toEnemy = target.root.position.subtract(pos);
              const dist = toEnemy.length();
              toEnemy.normalize();
              // Circle / strafe behavior
              const side = BABYLON.Vector3.Cross(toEnemy, BABYLON.Vector3.Up());
              if (side.lengthSquared() < 0.001) {
                side.copyFromFloats(0, 0, 1);
              }
              side.normalize();
              const strafe = side.scale((Math.random() - 0.5) * 2);
              const approach = toEnemy.scale(dist > 28 ? 1 : dist < 14 ? -0.7 : 0.15);
              const elev = new BABYLON.Vector3(0, (Math.random() - 0.5) * 1.2, 0);
              ship.targetVelocity = approach.add(strafe).add(elev).scale(ship.isFlagship ? 7 : 11);
              // Add slight noise
              ship.targetVelocity.x += (Math.random() - 0.5) * 2;
              ship.targetVelocity.y += (Math.random() - 0.5) * 2;
              ship.targetVelocity.z += (Math.random() - 0.5) * 2;
            } else {
              ship.targetVelocity = new BABYLON.Vector3(
                (Math.random() - 0.5) * 4,
                (Math.random() - 0.5) * 3,
                (Math.random() - 0.5) * 4
              );
            }
          }

          // Separation from allies
          const allies = aliveAllies(ship.team);
          const sep = BABYLON.Vector3.Zero();
          allies.forEach((a) => {
            if (a === ship) return;
            const d = pos.subtract(a.root.position);
            const dist = d.length();
            const minD = (ship.radius + a.radius) * 1.8;
            if (dist > 0.01 && dist < minD) {
              sep.addInPlace(d.normalize().scale((minD - dist) * 2.5));
            }
          });
          ship.targetVelocity.addInPlace(sep);

          // Soft bounds — keep battle in a volume
          const bound = 70;
          ["x", "y", "z"].forEach((axis) => {
            if (pos[axis] > bound) ship.targetVelocity[axis] -= (pos[axis] - bound) * 0.4;
            if (pos[axis] < -bound) ship.targetVelocity[axis] -= (pos[axis] + bound) * 0.4;
          });
          // Prefer mid height
          ship.targetVelocity.y -= pos.y * 0.08;

          // Smooth accelerate
          const accel = ship.isFlagship ? 4.5 : 7.5;
          ship.velocity = BABYLON.Vector3.Lerp(ship.velocity, ship.targetVelocity, Math.min(1, accel * dt * 0.15));
          // Clamp speed
          const maxSpeed = ship.isFlagship ? 10 : 14;
          if (ship.velocity.length() > maxSpeed) {
            ship.velocity.normalize().scaleInPlace(maxSpeed);
          }
          pos.addInPlace(ship.velocity.scale(dt));

          // Orient toward velocity / target blend
          let lookDir = ship.velocity.clone();
          if (target) {
            const toT = target.root.position.subtract(pos);
            if (toT.lengthSquared() > 0.0001) {
              toT.normalize();
              const base = lookDir.lengthSquared() > 0.01 ? lookDir.normalize() : toT;
              lookDir = BABYLON.Vector3.Lerp(base, toT, 0.55);
            }
          }
          if (lookDir.lengthSquared() > 0.0001) {
            lookDir.normalize();
            // Build look-at quaternion (forward = +Z) without relying on newer APIs
            let up = BABYLON.Vector3.Up();
            if (Math.abs(BABYLON.Vector3.Dot(lookDir, up)) > 0.98) {
              up = BABYLON.Vector3.Right();
            }
            const right = BABYLON.Vector3.Cross(up, lookDir).normalize();
            const realUp = BABYLON.Vector3.Cross(lookDir, right).normalize();
            const rotMat = BABYLON.Matrix.FromValues(
              right.x, right.y, right.z, 0,
              realUp.x, realUp.y, realUp.z, 0,
              lookDir.x, lookDir.y, lookDir.z, 0,
              0, 0, 0, 1
            );
            const desired = BABYLON.Quaternion.FromRotationMatrix(rotMat);
            if (!ship.root.rotationQuaternion) {
              ship.root.rotationQuaternion = BABYLON.Quaternion.FromEulerAngles(
                ship.root.rotation.x,
                ship.root.rotation.y,
                ship.root.rotation.z
              );
              ship.root.rotation.set(0, 0, 0);
            }
            ship.root.rotationQuaternion = BABYLON.Quaternion.Slerp(
              ship.root.rotationQuaternion,
              desired,
              Math.min(1, dt * 2.8)
            );
          }

          // Thruster flicker
          ship.thrusterLights.forEach((l, i) => {
            const base = ship.isFlagship ? 0.5 : 0.32;
            l.intensity = base + Math.sin(performance.now() * 0.02 + i * 1.7) * 0.12 + Math.random() * 0.05;
          });

          // Firing
          if (ship.fireTimer <= 0 && target) {
            ship.fireTimer = FIRE_INTERVAL + (Math.random() - 0.5) * 0.4;
            fireProjectiles(scene, ship, target);
          }

          // Update health bar
          const ratio = Math.max(0, ship.hp / ship.maxHp);
          ship.hpBar.width = ratio;
          if (ratio < 0.3) {
            ship.hpBar.background = "#ffcc33";
          } else {
            ship.hpBar.background = ship.team === "blue" ? "#3aa0ff" : "#ff3a4a";
          }
        });
      }

      function fireProjectiles(scene, ship, target) {
        const count = ship.isFlagship ? 2 : 1;
        const color = ship.team === "blue" ? BLUE_LIGHT : RED_LIGHT;
        // Aim at target with simple lead prediction
        const aimBase = target.root.position.subtract(ship.root.position);
        const dist = aimBase.length();
        const lead = target.velocity ? target.velocity.scale(dist / PROJECTILE_SPEED) : BABYLON.Vector3.Zero();
        const aim = target.root.position.add(lead).subtract(ship.root.position).normalize();

        // Lateral axis for dual flagship shots
        let right = BABYLON.Vector3.Cross(aim, BABYLON.Vector3.Up());
        if (right.lengthSquared() < 0.001) right = BABYLON.Vector3.Cross(aim, BABYLON.Vector3.Right());
        right.normalize();

        for (let i = 0; i < count; i++) {
          const lateral = right.scale(count === 2 ? (i === 0 ? -0.6 : 0.6) : 0);
          const spawn = ship.root.position.add(aim.scale(ship.radius + 0.8)).add(lateral);
          const dir = aim.add(lateral.scale(0.05)).normalize();

          const ball = BABYLON.MeshBuilder.CreateSphere("proj", {
            diameter: ship.isFlagship ? 0.55 : 0.4,
            segments: 6
          }, scene);
          ball.position = spawn;
          const mat = new BABYLON.StandardMaterial("projMat", scene);
          mat.disableLighting = true;
          mat.emissiveColor = color;
          ball.material = mat;

          // Glow core
          const glow = BABYLON.MeshBuilder.CreateSphere("projGlow", {
            diameter: ship.isFlagship ? 0.9 : 0.7,
            segments: 6
          }, scene);
          glow.parent = ball;
          const gmat = new BABYLON.StandardMaterial("gmat", scene);
          gmat.disableLighting = true;
          gmat.emissiveColor = color;
          gmat.alpha = 0.35;
          gmat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
          glow.material = gmat;

          // Trail
          const trail = new BABYLON.TrailMesh("trail", ball, scene, 0.18, 30, true);
          const tmat = new BABYLON.StandardMaterial("tmat", scene);
          tmat.disableLighting = true;
          tmat.emissiveColor = color;
          tmat.alpha = 0.65;
          tmat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
          trail.material = tmat;

          const light = new BABYLON.PointLight("pl", spawn.clone(), scene);
          light.diffuse = color;
          light.intensity = 0.8;
          light.range = 12;
          light.parent = ball;

          projectiles.push({
            mesh: ball,
            trail,
            light,
            velocity: dir.scale(PROJECTILE_SPEED),
            team: ship.team,
            life: PROJECTILE_LIFE,
            damage: PROJECTILE_DAMAGE * (ship.isFlagship ? 1.15 : 1),
            color
          });
        }
      }

      function updateProjectiles(scene, dt) {
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.life -= dt;
          p.mesh.position.addInPlace(p.velocity.scale(dt));

          let hit = false;
          for (let j = 0; j < ships.length; j++) {
            const s = ships[j];
            if (!s.alive || s.team === p.team) continue;
            const d = BABYLON.Vector3.Distance(p.mesh.position, s.root.position);
            if (d < s.radius + 0.4) {
              damageShip(scene, s, p.damage);
              hit = true;
              break;
            }
          }

          if (hit || p.life <= 0) {
            disposeProjectile(p);
            projectiles.splice(i, 1);
          }
        }
      }

      function disposeProjectile(p) {
        if (p.trail) p.trail.dispose();
        if (p.light) p.light.dispose();
        if (p.mesh) p.mesh.dispose();
      }

      function damageShip(scene, ship, amount) {
        if (!ship.alive) return;
        ship.hp -= amount;
        // Flash
        ship.parts.forEach((part) => {
          if (part.material && part.material.emissiveColor) {
            const orig = part.material.emissiveColor.clone();
            part.material.emissiveColor = BABYLON.Color3.White();
            setTimeout(() => {
              if (part.material) part.material.emissiveColor = orig;
            }, 60);
          }
        });
        if (ship.hp <= 0) {
          destroyShip(scene, ship);
        }
      }

      function destroyShip(scene, ship) {
        if (!ship.alive) return;
        ship.alive = false;
        ship.hp = 0;

        // Hide health bar
        if (ship.hpPanel) {
          ship.hpPanel.isVisible = false;
          advancedTexture.removeControl(ship.hpPanel);
          ship.hpPanel = null;
        }

        const pos = ship.root.position.clone();
        const big = ship.isFlagship;
        spawnExplosion(scene, pos, big, ship.team);

        // Dispose thruster lights and mesh
        ship.thrusterLights.forEach((l) => l.dispose());
        ship.parts.forEach((p) => p.dispose());
        ship.root.dispose();

        // Chain reaction
        ships.forEach((other) => {
          if (!other.alive || other === ship) return;
          const d = BABYLON.Vector3.Distance(pos, other.root.position);
          if (d < CHAIN_RADIUS + other.radius * 0.5) {
            // slight delay for cinematic cascade
            setTimeout(() => {
              if (other.alive) destroyShip(scene, other);
            }, 80 + Math.random() * 120);
          }
        });
      }

      function spawnExplosion(scene, position, big, team) {
        const baseSize = big ? 1.6 : 1.0;
        const fireColor = new BABYLON.Color3(1, 0.55, 0.1);
        const coreColor = new BABYLON.Color3(1, 0.9, 0.5);
        const sparkColor = team === "blue" ? BLUE_LIGHT : RED_LIGHT;

        // Shockwave ring
        const shock = BABYLON.MeshBuilder.CreateTorus("shock", {
          diameter: 0.5,
          thickness: 0.15 * baseSize,
          tessellation: 32
        }, scene);
        shock.position = position.clone();
        shock.rotation.x = Math.PI / 2;
        const smat = new BABYLON.StandardMaterial("shockMat", scene);
        smat.disableLighting = true;
        smat.emissiveColor = new BABYLON.Color3(1, 0.8, 0.4);
        smat.alpha = 0.85;
        smat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
        shock.material = smat;

        // Fire core sphere
        const core = BABYLON.MeshBuilder.CreateSphere("core", {
          diameter: 1.2 * baseSize,
          segments: 10
        }, scene);
        core.position = position.clone();
        const cmat = new BABYLON.StandardMaterial("coreMat", scene);
        cmat.disableLighting = true;
        cmat.emissiveColor = coreColor;
        cmat.alpha = 0.95;
        cmat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
        core.material = cmat;

        // Outer fire ball
        const fire = BABYLON.MeshBuilder.CreateSphere("fire", {
          diameter: 2.2 * baseSize,
          segments: 10
        }, scene);
        fire.position = position.clone();
        const fmat = new BABYLON.StandardMaterial("fireMat", scene);
        fmat.disableLighting = true;
        fmat.emissiveColor = fireColor;
        fmat.alpha = 0.55;
        fmat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
        fire.material = fmat;

        // Explosion light
        const light = new BABYLON.PointLight("expl", position.clone(), scene);
        light.diffuse = new BABYLON.Color3(1, 0.6, 0.2);
        light.intensity = big ? 8 : 4.5;
        light.range = big ? 40 : 25;

        // Debris
        const debris = [];
        const debrisCount = big ? 28 : 16;
        for (let i = 0; i < debrisCount; i++) {
          const size = (0.12 + Math.random() * 0.35) * baseSize;
          const d = BABYLON.MeshBuilder.CreateBox("deb", {
            width: size,
            height: size * (0.4 + Math.random()),
            depth: size * (0.5 + Math.random() * 0.8)
          }, scene);
          d.position = position.add(new BABYLON.Vector3(
            (Math.random() - 0.5) * 0.5,
            (Math.random() - 0.5) * 0.5,
            (Math.random() - 0.5) * 0.5
          ));
          const dmat = new BABYLON.StandardMaterial("dmat", scene);
          dmat.diffuseColor = new BABYLON.Color3(0.3 + Math.random() * 0.3, 0.2, 0.15);
          dmat.emissiveColor = Math.random() > 0.5 ? fireColor.scale(0.5) : sparkColor.scale(0.4);
          dmat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
          d.material = dmat;
          const dir = new BABYLON.Vector3(
            Math.random() - 0.5,
            Math.random() - 0.5,
            Math.random() - 0.5
          ).normalize().scale(8 + Math.random() * 18 * baseSize);
          debris.push({
            mesh: d,
            vel: dir,
            spin: new BABYLON.Vector3(
              (Math.random() - 0.5) * 8,
              (Math.random() - 0.5) * 8,
              (Math.random() - 0.5) * 8
            )
          });
        }

        // Sparks (small emissive spheres)
        const sparks = [];
        const sparkCount = big ? 40 : 22;
        for (let i = 0; i < sparkCount; i++) {
          const sp = BABYLON.MeshBuilder.CreateSphere("sp", {
            diameter: 0.08 + Math.random() * 0.12,
            segments: 4
          }, scene);
          sp.position = position.clone();
          const spmat = new BABYLON.StandardMaterial("spmat", scene);
          spmat.disableLighting = true;
          spmat.emissiveColor = Math.random() > 0.4 ? sparkColor : coreColor;
          sp.material = spmat;
          const dir = new BABYLON.Vector3(
            Math.random() - 0.5,
            Math.random() - 0.5,
            Math.random() - 0.5
          ).normalize().scale(12 + Math.random() * 25 * baseSize);
          sparks.push({ mesh: sp, vel: dir });
        }

        explosions.push({
          shock,
          core,
          fire,
          light,
          debris,
          sparks,
          age: 0,
          duration: big ? 1.8 : 1.25,
          baseSize
        });
      }

      function updateExplosions(dt) {
        for (let i = explosions.length - 1; i >= 0; i--) {
          const e = explosions[i];
          e.age += dt;
          const t = e.age / e.duration;
          if (t >= 1) {
            e.shock.dispose();
            e.core.dispose();
            e.fire.dispose();
            e.light.dispose();
            e.debris.forEach((d) => d.mesh.dispose());
            e.sparks.forEach((s) => s.mesh.dispose());
            explosions.splice(i, 1);
            continue;
          }

          // Expand shockwave
          const shockScale = 1 + t * 18 * e.baseSize;
          e.shock.scaling.set(shockScale, shockScale, shockScale);
          e.shock.material.alpha = 0.85 * (1 - t);

          // Fireball expand then fade
          const fireT = Math.min(1, t * 1.4);
          const coreScale = (1 + fireT * 2.5) * (1 - t * 0.5);
          e.core.scaling.setAll(Math.max(0.01, coreScale));
          e.core.material.alpha = 0.95 * (1 - t);
          e.fire.scaling.setAll(Math.max(0.01, 1 + fireT * 3.5));
          e.fire.material.alpha = 0.55 * (1 - t) * (1 - t);

          e.light.intensity = (e.baseSize > 1.2 ? 8 : 4.5) * (1 - t) * (1 - t);

          e.debris.forEach((d) => {
            d.mesh.position.addInPlace(d.vel.scale(dt));
            d.vel.scaleInPlace(0.98);
            d.mesh.rotation.x += d.spin.x * dt;
            d.mesh.rotation.y += d.spin.y * dt;
            d.mesh.rotation.z += d.spin.z * dt;
            if (d.mesh.material) d.mesh.material.alpha = 1 - t;
          });

          e.sparks.forEach((s) => {
            s.mesh.position.addInPlace(s.vel.scale(dt));
            s.vel.scaleInPlace(0.96);
            s.vel.y -= 2 * dt;
            const sc = Math.max(0.01, 1 - t);
            s.mesh.scaling.setAll(sc);
          });
        }
      }

      function updateHUD() {
        const blueAlive = ships.filter((s) => s.alive && s.team === "blue").length;
        const redAlive = ships.filter((s) => s.alive && s.team === "red").length;
        document.getElementById("blueStatus").textContent = `Azure Fleet: ${blueAlive} / 10`;
        document.getElementById("redStatus").textContent = `Crimson Fleet: ${redAlive} / 10`;
      }

      function checkVictory() {
        if (battleOver) return;
        const blueAlive = ships.filter((s) => s.alive && s.team === "blue").length;
        const redAlive = ships.filter((s) => s.alive && s.team === "red").length;
        if (blueAlive === 0 || redAlive === 0) {
          battleOver = true;
          const banner = document.getElementById("banner");
          const text = document.getElementById("bannerText");
          banner.style.display = "flex";
          if (blueAlive === 0 && redAlive === 0) {
            text.textContent = "Mutual Annihilation";
          } else if (redAlive === 0) {
            text.textContent = "Azure Fleet Victorious";
            text.style.textShadow = "0 0 30px rgba(80,180,255,0.95)";
          } else {
            text.textContent = "Crimson Fleet Victorious";
            text.style.textShadow = "0 0 30px rgba(255,80,100,0.95)";
          }
          // Soft respawn after a pause so the scene keeps working
          setTimeout(() => {
            resetBattle();
          }, 6000);
        }
      }

      function resetBattle() {
        // Clean projectiles & explosions
        projectiles.forEach(disposeProjectile);
        projectiles = [];
        explosions.forEach((e) => {
          e.shock.dispose();
          e.core.dispose();
          e.fire.dispose();
          e.light.dispose();
          e.debris.forEach((d) => d.mesh.dispose());
          e.sparks.forEach((s) => s.mesh.dispose());
        });
        explosions = [];

        // Dispose remaining ships
        ships.forEach((s) => {
          if (s.hpPanel) {
            advancedTexture.removeControl(s.hpPanel);
          }
          if (s.alive) {
            s.thrusterLights.forEach((l) => l.dispose());
            s.parts.forEach((p) => p.dispose());
            s.root.dispose();
          }
        });
        ships = [];
        battleOver = false;
        document.getElementById("banner").style.display = "none";

        spawnFleet(sceneRef, "blue", new BABYLON.Vector3(-38, 0, 0), 1);
        spawnFleet(sceneRef, "red", new BABYLON.Vector3(38, 0, 0), -1);
      }

      const scene = createScene();
      engine.runRenderLoop(() => {
        scene.render();
      });
      window.addEventListener("resize", () => engine.resize());
    })();
  </script>
</body>
</html>
