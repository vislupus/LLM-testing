<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Battle: Red vs Blue</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        p { margin: 5px 0; font-size: 0.9rem; opacity: 0.8; }
        .legend { display: flex; gap: 15px; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Babylon.js GUI -->
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>Orbital Conflict</h1>
        <p>Fleet Red vs. Fleet Blue</p>
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:#ff3333"></div>Red Fleet</div>
            <div class="legend-item"><div class="dot" style="background:#3388ff"></div>Blue Fleet</div>
        </div>
        <p style="margin-top:15px; font-size: 0.8rem;">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</p>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // --- Configuration ---
        const CONFIG = {
            shipCount: 10,
            flagshipHP: 500,
            escortHP: 100,
            fireRate: 3000, // ms
            projectileSpeed: 40,
            explosionRadius: 15,
            chainReactionRadius: 20,
            chainDamage: 150
        };

        // --- Global State ---
        let scene, camera, advancedTexture;
        let ships = [];
        let projectiles = [];
        let explosions = [];
        let stars;
        let lastTime = 0;

        // --- Classes ---

        class Ship {
            constructor(name, isFlagship, teamColor, startPos, targetPos) {
                this.name = name;
                this.isFlagship = isFlagship;
                this.teamColor = teamColor; // "red" or "blue"
                this.hp = isFlagship ? CONFIG.flagshipHP : CONFIG.escortHP;
                this.maxHp = this.hp;
                this.isDead = false;
                this.lastFireTime = 0;
                
                // Movement
                this.position = startPos.clone();
                this.velocity = new BABYLON.Vector3(0, 0, 0);
                this.targetPos = targetPos.clone();
                this.rotationSpeed = isFlagship ? 0.5 : 1.5;
                this.speed = isFlagship ? 8 : 12;

                // Mesh Creation
                this.mesh = this.createMesh();
                this.mesh.position = this.position;
                
                // Engine Light
                this.engineLight = new BABYLON.PointLight("engineLight", new BABYLON.Vector3(0, 0, 0), scene);
                this.engineLight.intensity = 2;
                this.engineLight.diffuse = teamColor === "red" ? new BABYLON.Color3(1, 0.2, 0.2) : new BABYLON.Color3(0.2, 0.5, 1);
                this.engineLight.parent = this.mesh;
                this.engineLight.position = new BABYLON.Vector3(0, 0, isFlagship ? -3 : -1.5); // Behind ship

                // Health Bar GUI
                this.createHealthBar();
            }

            createMesh() {
                const root = new BABYLON.TransformNode("shipRoot");
                const mat = new BABYLON.StandardMaterial("shipMat", scene);
                mat.diffuseColor = this.teamColor === "red" ? new BABYLON.Color3(0.6, 0.1, 0.1) : new BABYLON.Color3(0.1, 0.3, 0.6);
                mat.specularColor = new BABYLON.Color3(0.8, 0.8, 0.8);
                mat.emissiveColor = this.teamColor === "red" ? new BABYLON.Color3(0.2, 0, 0) : new BABYLON.Color3(0, 0.1, 0.2);

                let mainBody;
                if (this.isFlagship) {
                    // Flagship: Larger, complex shape
                    mainBody = BABYLON.MeshBuilder.CreateCylinder("body", {height: 6, diameterTop: 2, diameterBottom: 4, tessellation: 8}, scene);
                    mainBody.rotation.x = Math.PI / 2;
                    const wings = BABYLON.MeshBuilder.CreateBox("wings", {width: 8, height: 1, depth: 3}, scene);
                    wings.position.z = 1;
                    wings.parent = mainBody;
                    const turret = BABYLON.MeshBuilder.CreateSphere("turret", {diameter: 2}, scene);
                    turret.position.z = 3;
                    turret.parent = mainBody;
                } else {
                    // Escort: Smaller, sleek fighter
                    mainBody = BABYLON.MeshBuilder.CreateCylinder("body", {height: 3, diameterTop: 0.5, diameterBottom: 1.5, tessellation: 6}, scene);
                    mainBody.rotation.x = Math.PI / 2;
                    const wingL = BABYLON.MeshBuilder.CreateBox("wingL", {width: 3, height: 0.2, depth: 1}, scene);
                    wingL.position.set(1.5, 0, 0.5);
                    wingL.parent = mainBody;
                    const wingR = BABYLON.MeshBuilder.CreateBox("wingR", {width: 3, height:0.2, depth: 1}, scene);
                    wingR.position.set(-1.5, 0, 0.5);
                    wingR.parent = mainBody;
                }

                mainBody.material = mat;
                mainBody.parent = root;
                return root;
            }

            createHealthBar() {
                const rect = new BABYLON.GUI.Rectangle();
                rect.width = "60px";
                rect.height = "6px";
                rect.cornerRadius = 3;
                rect.color = "transparent";
                rect.thickness = 0;
                rect.background = "#333";
                
                const fill = new BABYLON.GUI.Rectangle();
                fill.width = "100%";
                fill.height = "100%";
                fill.cornerRadius = 3;
                fill.color = "transparent";
                fill.thickness = 0;
                fill.background = this.teamColor === "red" ? "#ff4444" : "#4488ff";
                fill.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                
                rect.addControl(fill);
                advancedTexture.addControl(rect);
                rect.linkWithMesh(this.mesh);
                rect.top = "-40px";

                this.hpBarFill = fill;
                this.hpBarRect = rect;
            }

            update(dt, time) {
                if (this.isDead) return;

                // 1. Movement Logic (Steer towards target area + avoid center slightly)
                const direction = this.targetPos.subtract(this.position).normalize();
                
                // Add some noise/wobble
                const noise = Math.sin(time * 2 + this.position.x) * 0.5;
                direction.y += noise * 0.1;

                // Move
                this.position.addInPlace(direction.scale(this.speed * dt));
                this.mesh.position = this.position;

                // Rotate to face movement direction
                const targetRotation = BABYLON.Vector3.RotationFromAxis(direction, BABYLON.Vector3.Up(), BABYLON.Vector3.Cross(direction, BABYLON.Vector3.Up()));
                this.mesh.rotation = BABYLON.Vector3.Slerp(this.mesh.rotation, targetRotation, this.rotationSpeed * dt);

                // 2. Combat Logic
                if (time - this.lastFireTime > CONFIG.fireRate) {
                    this.fire();
                    this.lastFireTime = time;
                }

                // 3. Update Health Bar
                const pct = Math.max(0, this.hp / this.maxHp);
                this.hpBarFill.width = (pct * 100) + "%";
                if (pct < 0.3) this.hpBarFill.background = "#ffaa00";
                else this.hpBarFill.background = this.teamColor === "red" ? "#ff4444" : "#4488ff";
            }

            fire() {
                const count = this.isFlagship ? 2 : 1;
                const offset = this.isFlagship ? 1.5 : 0;
                
                // Fire from front of ship
                const forward = this.mesh.getForwardRay(10).direction;
                const startPos = this.position.add(forward.scale(this.isFlagship ? 4 : 2));

                for(let i=0; i<count; i++) {
                    // Slight spread for flagship
                    let spread = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 0.2 * (i===0?1:-1), 
                        (Math.random() - 0.5) * 0.2, 
                        0
                    ).rotateByQuaternion(this.mesh.rotationQuaternion || new BABYLON.Quaternion());
                    
                    projectiles.push(new Projectile(
                        startPos.add(spread.scale(offset)), 
                        forward.add(spread), 
                        this.teamColor
                    ));
                }
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp <= 0 && !this.isDead) {
                    this.die();
                }
            }

            die() {
                this.isDead = true;
                this.mesh.setEnabled(false);
                this.hpBarRect.dispose();
                this.engineLight.dispose();
                createExplosion(this.position, this.teamColor, this.isFlagship);
                checkChainReaction(this.position);
            }
        }

        class Projectile {
            constructor(startPos, direction, teamColor) {
                this.position = startPos.clone();
                this.direction = direction.normalize();
                this.teamColor = teamColor;
                this.isDead = false;
                this.life = 3.0; // Seconds

                // Visuals
                const color = teamColor === "red" ? new BABYLON.Color3(1, 0.2, 0.2) : new BABYLON.Color3(0.2, 0.6, 1);
                this.mesh = BABYLON.MeshBuilder.CreateSphere("proj", {diameter: 0.4}, scene);
                this.mesh.position = this.position;
                
                const mat = new BABYLON.StandardMaterial("projMat", scene);
                mat.emissiveColor = color;
                mat.disableLighting = true;
                this.mesh.material = mat;

                // Trail
                this.trail = new BABYLON.TrailMesh("trail", this.mesh, scene, 0.2, 10, true);
                const trailMat = new BABYLON.StandardMaterial("trailMat", scene);
                trailMat.diffuseColor = color;
                trailMat.opacity = 0.6;
                this.trail.material = trailMat;
            }

            update(dt) {
                this.position.addInPlace(this.direction.scale(CONFIG.projectileSpeed * dt));
                this.mesh.position = this.position;
                this.life -= dt;
                if (this.life <= 0) this.die();
            }

            die() {
                this.isDead = true;
                this.mesh.dispose();
                this.trail.dispose();
            }
        }

        // --- Explosion System ---

        function createExplosion(pos, teamColor, isBig) {
            const scale = isBig ? 2.5 : 1.0;
            const color = teamColor === "red" ? new BABYLON.Color3(1, 0.3, 0.1) : new BABYLON.Color3(0.2, 0.5, 1);
            
            // 1. Shockwave
            const shockwave = BABYLON.MeshBuilder.CreateSphere("shock", {diameter: 1}, scene);
            const swMat = new BABYLON.StandardMaterial("swMat", scene);
            swMat.emissiveColor = color;
            swMat.alpha = 0.8;
            swMat.disableLighting = true;
            shockwave.material = swMat;
            shockwave.position = pos;
            
            // 2. Particles (Fire/Sparks)
            const particleSystem = new BABYLON.ParticleSystem("particles", 200 * scale, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            particleSystem.emitter = pos;
            particleSystem.color1 = new BABYLON.Color4(1, 1, 1, 1.0);
            particleSystem.color2 = new BABYLON.Color4(1, 0.5, 0, 1.0);
            particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0.0);
            particleSystem.minSize = 0.5 * scale;
            particleSystem.maxSize = 2.0 * scale;
            particleSystem.minLifeTime = 0.3;
            particleSystem.maxLifeTime = 1.0;
            particleSystem.emitRate = 1000 * scale;
            particleSystem.gravity = new BABYLON.Vector3(0, -2, 0);
            particleSystem.direction1 = new BABYLON.Vector3(-2, -2, -2);
            particleSystem.direction2 = new BABYLON.Vector3(2, 2, 2);
            particleSystem.minEmitPower = 5;
            particleSystem.maxEmitPower = 15;
            particleSystem.updateSpeed = 0.02;
            particleSystem.start();

            // 3. Debris
            for(let i=0; i<10 * scale; i++) {
                const debris = BABYLON.MeshBuilder.CreateBox("debris", {size: 0.5 * scale}, scene);
                debris.position = pos;
                const dVel = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20
                );
                
                explosions.push({
                    type: 'shockwave', mesh: shockwave, age: 0, maxAge: 1.0, scale: scale, color: color, mat: swMat,
                    particles: particleSystem,
                    debris: debris, debrisVel: dVel, debrisAge: 0
                });
            }
        }

        function updateExplosions(dt) {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                
                // Shockwave
                exp.age += dt;
                const progress = exp.age / exp.maxAge;
                const currentScale = 1 + (progress * 10 * exp.scale);
                exp.mesh.scaling = new BABYLON.Vector3(currentScale, currentScale * 0.1, currentScale);
                exp.mat.alpha = 1.0 - progress;
                
                if (exp.age >= exp.maxAge) {
                    exp.mesh.dispose();
                    exp.particles.stop();
                    exp.particles.dispose();
                    explosions.splice(i, 1);
                    continue; // Skip debris update if parent removed (simplified)
                }

                // Debris
                if(exp.debris) {
                    exp.debrisAge += dt;
                    exp.debris.position.addInPlace(exp.debrisVel.scale(dt));
                    exp.debris.rotation.x += dt * 5;
                    exp.debris.scaling.scaleInPlace(0.95); // Shrink
                    if(exp.debrisAge > 2.0) {
                        exp.debris.dispose();
                        exp.debris = null;
                    }
                }
            }
        }

        // --- Game Logic ---

        function checkChainReaction(explosionPos) {
            ships.forEach(ship => {
                if (!ship.isDead) {
                    const dist = BABYLON.Vector3.Distance(ship.position, explosionPos);
                    if (dist < CONFIG.chainReactionRadius) {
                        // Visual hit effect
                        ship.takeDamage(CONFIG.chainDamage);
                    }
                }
            });
        }

        function checkCollisions() {
            // Simple projectile vs ship collision
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                if (proj.isDead) continue;

                for (let ship of ships) {
                    if (ship.isDead || ship.teamColor === proj.teamColor) continue;

                    const dist = BABYLON.Vector3.Distance(proj.position, ship.position);
                    // Hitbox approximation
                    const hitDist = ship.isFlagship ? 4 : 2; 

                    if (dist < hitDist) {
                        ship.takeDamage(20); // Base damage
                        proj.die();
                        break; // Projectile hits one ship
                    }
                }
            }
        }

        function initScene() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.05, 1);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogDensity = 0.005;
            scene.fogColor = new BABYLON.Color3(0.02, 0.02, 0.05);

            // Camera
            camera = new BABYLON.ArcRotateCamera("Camera", Math.PI / 2, Math.PI / 3, 100, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 200;

            // Lighting
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.3;
            const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.intensity = 0.5;

            // GUI
            advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

            // Starfield
            const starSystem = new BABYLON.ParticleSystem("stars", 2000, scene);
            starSystem.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            starSystem.emitter = new BABYLON.Vector3(0, 0, 0);
            starSystem.minEmitBox = new BABYLON.Vector3(-100, -100, -100);
            starSystem.maxEmitBox = new BABYLON.Vector3(100, 100, 100);
            starSystem.color1 = new BABYLON.Color4(1, 1, 1, 1.0);
            starSystem.color2 = new BABYLON.Color4(1, 1, 1, 1.0);
            starSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0.0);
            starSystem.minSize = 0.1;
            starSystem.maxSize = 0.3;
            starSystem.minLifeTime = 9999;
            starSystem.maxLifeTime = 9999;
            starSystem.emitRate = 0;
            starSystem.gravity = new BABYLON.Vector3(0, 0, 0);
            starSystem.direction1 = new BABYLON.Vector3(0, 0, 0);
            starSystem.direction2 = new BABYLON.Vector3(0, 0, 0);
            starSystem.minEmitPower = 0;
            starSystem.maxEmitPower = 0;
            starSystem.updateSpeed = 0.01;
            starSystem.start();

            // Create Fleets
            // Red Fleet (Left side, moving Right)
            for (let i = 0; i < CONFIG.shipCount; i++) {
                const isFlag = (i === 0);
                const offsetZ = (i % 3 - 1) * 15;
                const offsetX = -40 - (Math.floor(i / 3) * 10);
                const offsetY = (Math.random() - 0.5) * 20;
                
                ships.push(new Ship(
                    `Red_${i}`, 
                    isFlag, 
                    "red", 
                    new BABYLON.Vector3(offsetX, offsetY, offsetZ), 
                    new BABYLON.Vector3(50, 0, 0) // Target right side
                ));
            }

            // Blue Fleet (Right side, moving Left)
            for (let i = 0; i < CONFIG.shipCount; i++) {
                const isFlag = (i === 0);
                const offsetZ = (i % 3 - 1) * 15;
                const offsetX = 40 + (Math.floor(i / 3) * 10);
                const offsetY = (Math.random() - 0.5) * 20;

                ships.push(new Ship(
                    `Blue_${i}`, 
                    isFlag, 
                    "blue", 
                    new BABYLON.Vector3(offsetX, offsetY, offsetZ), 
                    new BABYLON.Vector3(-50, 0, 0) // Target left side
                ));
            }
        }

        // --- Main Loop ---

        engine.runRenderLoop(function () {
            const time = performance.now() / 1000;
            const dt = Math.min((time - lastTime), 0.1); // Cap dt to prevent physics explosions on lag
            lastTime = time;

            if (scene) {
                // Update Ships
                ships.forEach(ship => ship.update(dt, time));

                // Update Projectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    projectiles[i].update(dt);
                    if (projectiles[i].isDead) {
                        projectiles.splice(i, 1);
                    }
                }

                // Update Explosions
                updateExplosions(dt);

                // Physics Checks
                checkCollisions();

                scene.render();
            }
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });

        // Start
        initScene();

    </script>
</body>
</html>
