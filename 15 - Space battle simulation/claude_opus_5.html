<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fleet Engagement — Babylon.js</title>
<style>
  :root{
    --void:#04060f;
    --azure:#4fb8ff;
    --crimson:#ff5a46;
    --bone:#dbe4f0;
    --dim:#66748c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--void);}
  #renderCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;}

  #hud{
    position:fixed;inset:0;pointer-events:none;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
  }
  .panel{
    position:absolute;
    background:linear-gradient(180deg,rgba(6,10,22,.72),rgba(6,10,22,.42));
    border:1px solid rgba(120,150,190,.18);
    backdrop-filter:blur(6px);
    padding:10px 12px;
  }
  #title{
    top:16px;left:16px;letter-spacing:.22em;font-size:11px;
  }
  #title b{display:block;font-size:13px;font-weight:600;letter-spacing:.34em;margin-bottom:6px;}
  #title span{color:var(--dim);letter-spacing:.12em;line-height:1.7;display:block;font-size:10px;}

  #fleets{
    top:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;align-items:stretch;
  }
  .fleet{min-width:172px;}
  .fleet .name{font-size:10px;letter-spacing:.28em;margin-bottom:7px;display:flex;justify-content:space-between;}
  .fleet .count{color:var(--dim);letter-spacing:.1em;}
  .track{height:4px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;}
  .track i{position:absolute;inset:0 auto 0 0;display:block;width:100%;transition:width .25s linear;}
  .pips{display:flex;gap:3px;margin-top:7px;}
  .pips u{width:100%;height:7px;background:rgba(255,255,255,.1);text-decoration:none;display:block;}
  .pips u.flag{height:11px;margin-top:-2px;}
  .pips u.dead{background:rgba(255,255,255,.05);}
  #vs{align-self:center;color:var(--dim);font-size:10px;letter-spacing:.2em;padding:0 2px;}

  #a .name,#a .pips u.on{color:var(--azure);}
  #a .track i,#a .pips u.on{background:var(--azure);}
  #b .name,#b .pips u.on{color:var(--crimson);}
  #b .track i,#b .pips u.on{background:var(--crimson);}

  #keys{bottom:16px;left:16px;font-size:10px;letter-spacing:.14em;color:var(--dim);line-height:1.9;}
  #keys kbd{color:var(--bone);border:1px solid rgba(120,150,190,.25);padding:0 4px;margin-right:6px;font:inherit;}
  #keys b{color:var(--bone);font-weight:400;}

  #banner{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;opacity:0;transition:opacity .6s ease;
  }
  #banner.show{opacity:1;}
  #banner .win{font-size:34px;letter-spacing:.32em;text-shadow:0 0 30px currentColor;}
  #banner .sub{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-top:14px;}

  #boot{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--void);color:var(--dim);z-index:5;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.3em;
    transition:opacity .8s ease;
  }
  #boot.gone{opacity:0;pointer-events:none;}
  @media (max-width:720px){
    #fleets{flex-direction:column;top:auto;bottom:14px;left:14px;transform:none;gap:6px;}
    .fleet{min-width:150px;}
    #vs{display:none;}
    #keys{display:none;}
  }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="hud">
  <div class="panel" id="title">
    <b>FLEET ENGAGEMENT</b>
    <span>SECTOR 7 · KUIPER DRIFT</span>
    <span>REAL-TIME TACTICAL FEED</span>
  </div>

  <div id="fleets">
    <div class="panel fleet" id="a">
      <div class="name"><span>AZURE LINE</span><span class="count">10/10</span></div>
      <div class="track"><i></i></div>
      <div class="pips"></div>
    </div>
    <div id="vs">VS</div>
    <div class="panel fleet" id="b">
      <div class="name"><span>CRIMSON HOST</span><span class="count">10/10</span></div>
      <div class="track"><i></i></div>
      <div class="pips"></div>
    </div>
  </div>

  <div class="panel" id="keys">
    <div><kbd>DRAG</kbd><b>orbit camera</b></div>
    <div><kbd>WHEEL</kbd><b>zoom</b></div>
    <div><kbd>C</kbd><b>auto-orbit</b></div>
    <div><kbd>R</kbd><b>restart battle</b></div>
  </div>

  <div id="banner"><div class="win"></div><div class="sub">REFORMING FLEETS · NEW ENGAGEMENT SHORTLY</div></div>
</div>

<div id="boot">BUILDING FLEETS…</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
"use strict";

/* ============================================================
   Fleet Engagement — a Babylon.js space battle
   ============================================================ */

const V3 = BABYLON.Vector3;
const C3 = BABYLON.Color3;
const C4 = BABYLON.Color4;
const Q = BABYLON.Quaternion;
const MB = BABYLON.MeshBuilder;

const CFG = {
  fleetSize: 10,
  fireInterval: 3.0,      // seconds between volleys (spec)
  boltSpeed: 118,
  boltLife: 3.4,
  escortHP: 100,
  flagHP: 780,
  escortDmg: 20,
  flagDmg: 34,
  arena: 330,
  restartDelay: 6.5
};

const TEAMS = [
  {
    id: 0, label: "AZURE LINE",
    hull: new C3(0.36, 0.42, 0.52),
    trim: new C3(0.16, 0.45, 0.72),
    bolt: new C3(0.35, 0.78, 1.0),
    engine: new C3(0.30, 0.80, 1.0),
    css: "#4fb8ff"
  },
  {
    id: 1, label: "CRIMSON HOST",
    hull: new C3(0.48, 0.40, 0.37),
    trim: new C3(0.62, 0.20, 0.14),
    bolt: new C3(1.0, 0.30, 0.20),
    engine: new C3(1.0, 0.50, 0.16),
    css: "#ff5a46"
  }
];

/* ---------- engine / scene ---------- */
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { stencil: true, antialias: true }, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new C4(0.008, 0.012, 0.03, 1);
scene.autoClearDepthAndStencil = true;

const camera = new BABYLON.ArcRotateCamera("cam", -1.05, 1.16, 380, V3.Zero(), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 45;
camera.upperRadiusLimit = 1000;
camera.lowerBetaLimit = 0.06;
camera.upperBetaLimit = Math.PI - 0.06;
camera.wheelDeltaPercentage = 0.015;
camera.pinchDeltaPercentage = 0.015;
camera.panningSensibility = 0;   // target is driven by the director
camera.inertia = 0.85;
camera.minZ = 0.6;
camera.maxZ = 9000;

/* ---------- lighting ---------- */
const hemi = new BABYLON.HemisphericLight("hemi", new V3(0.1, 1, 0.15), scene);
hemi.intensity = 0.38;
hemi.diffuse = new C3(0.52, 0.60, 0.86);
hemi.groundColor = new C3(0.16, 0.10, 0.24);

const keyLight = new BABYLON.DirectionalLight("key", new V3(-0.55, -0.62, 0.55), scene);
keyLight.intensity = 1.25;
keyLight.diffuse = new C3(1.0, 0.94, 0.84);
keyLight.specular = new C3(1, 1, 1);

const rimLight = new BABYLON.DirectionalLight("rim", new V3(0.75, 0.25, -0.6), scene);
rimLight.intensity = 0.55;
rimLight.diffuse = new C3(0.34, 0.55, 1.0);

const glow = new BABYLON.GlowLayer("glow", scene, { mainTextureFixedSize: 512, blurKernelSize: 64 });
glow.intensity = 1.15;

/* ---------- procedural textures ---------- */
function makeFlareTexture() {
  const dt = new BABYLON.DynamicTexture("flare", 128, scene, true);
  const ctx = dt.getContext();
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 63);
  g.addColorStop(0.00, "rgba(255,255,255,1)");
  g.addColorStop(0.22, "rgba(255,255,255,0.82)");
  g.addColorStop(0.52, "rgba(255,255,255,0.24)");
  g.addColorStop(1.00, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  dt.update();
  dt.hasAlpha = true;
  return dt;
}

function makeSkyTexture() {
  const W = 2048, H = 1024;
  const dt = new BABYLON.DynamicTexture("nebula", { width: W, height: H }, scene, true);
  const ctx = dt.getContext();

  ctx.fillStyle = "#03040c";
  ctx.fillRect(0, 0, W, H);

  // nebula fields
  const palette = [[64, 108, 255], [148, 62, 220], [26, 172, 196], [214, 58, 118], [40, 66, 170], [120, 90, 255]];
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 200; i++) {
    const c = palette[(Math.random() * palette.length) | 0];
    const x = Math.random() * W;
    const y = 60 + Math.random() * (H - 120);
    const r = 70 + Math.random() * 340;
    const a = 0.035 + Math.random() * 0.10;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")");
    g.addColorStop(0.55, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (a * 0.35) + ")");
    g.addColorStop(1, "rgba(" + c[0] + "," + c[1] + "," + c[2] + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // dust lanes carved back out
  ctx.globalCompositeOperation = "source-over";
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = 40 + Math.random() * 220;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "rgba(3,4,12,0.55)");
    g.addColorStop(1, "rgba(3,4,12,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // stars, distributed evenly over the sphere (not the rectangle)
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 3200; i++) {
    const x = Math.random() * W;
    const y = (Math.acos(2 * Math.random() - 1) / Math.PI) * H;
    const big = Math.random() > 0.94;
    const r = big ? 1.1 + Math.random() * 1.7 : 0.3 + Math.random() * 0.8;
    const b = 0.35 + Math.random() * 0.65;
    const t = Math.random();
    ctx.fillStyle = t < 0.70 ? "rgba(255,255,255," + b + ")"
      : t < 0.87 ? "rgba(168,200,255," + b + ")"
        : "rgba(255,214,168," + b + ")";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    if (big) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 7);
      g.addColorStop(0, "rgba(190,215,255,0.30)");
      g.addColorStop(1, "rgba(190,215,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 7, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";
  dt.update();
  return dt;
}

const flareTex = makeFlareTexture();

/* ---------- deep background ---------- */
const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
skyMat.backFaceCulling = false;
skyMat.disableLighting = true;
skyMat.diffuseColor = C3.Black();
skyMat.specularColor = C3.Black();
skyMat.emissiveTexture = makeSkyTexture();
const sky = MB.CreateSphere("sky", { diameter: 5000, segments: 32, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
sky.material = skyMat;
sky.infiniteDistance = true;
sky.isPickable = false;
sky.renderingGroupId = 0;
glow.addExcludedMesh(sky);

// nearer stars for parallax while orbiting
const pcs = new BABYLON.PointsCloudSystem("starfield", 2, scene);
pcs.addPoints(2200, (p) => {
  const u = Math.random() * Math.PI * 2;
  const v = Math.acos(2 * Math.random() - 1);
  const r = 700 + Math.random() * 1400;
  p.position = new V3(r * Math.sin(v) * Math.cos(u), r * Math.cos(v), r * Math.sin(v) * Math.sin(u));
  const b = 0.35 + Math.random() * 0.65;
  const t = Math.random();
  p.color = t < 0.75 ? new C4(b, b, b, 1) : (t < 0.9 ? new C4(b * 0.7, b * 0.85, b, 1) : new C4(b, b * 0.82, b * 0.6, 1));
});
pcs.buildMeshAsync().then((m) => { m.isPickable = false; glow.addExcludedMesh(m); });

/* ---------- shared materials ---------- */
function stdMat(name, cfg) {
  const m = new BABYLON.StandardMaterial(name, scene);
  m.maxSimultaneousLights = 8;
  Object.assign(m, cfg);
  return m;
}

const MAT = { hull: [], trim: [], engine: [], bolt: [], trail: [] };
TEAMS.forEach((T, i) => {
  MAT.hull[i] = stdMat("hull" + i, {
    diffuseColor: T.hull,
    specularColor: new C3(0.55, 0.58, 0.65),
    specularPower: 48,
    emissiveColor: T.hull.scale(0.06)
  });
  MAT.trim[i] = stdMat("trim" + i, {
    diffuseColor: T.trim.scale(0.5),
    emissiveColor: T.trim.scale(0.85),
    specularColor: new C3(0.3, 0.3, 0.3)
  });
  MAT.engine[i] = stdMat("eng" + i, {
    diffuseColor: C3.Black(),
    specularColor: C3.Black(),
    emissiveColor: T.engine,
    disableLighting: true
  });
  MAT.bolt[i] = stdMat("bolt" + i, {
    diffuseColor: C3.Black(),
    specularColor: C3.Black(),
    emissiveColor: T.bolt.scale(1.35),
    disableLighting: true
  });
  MAT.trail[i] = stdMat("trail" + i, {
    diffuseColor: C3.Black(),
    specularColor: C3.Black(),
    emissiveColor: T.bolt,
    disableLighting: true,
    backFaceCulling: false,
    alpha: 0.55
  });
  MAT.trail[i].alphaMode = BABYLON.Engine.ALPHA_ADD;
});

const barBgMat = stdMat("barBg", {
  diffuseColor: C3.Black(),
  specularColor: C3.Black(),
  emissiveColor: new C3(0.06, 0.07, 0.10),
  disableLighting: true,
  backFaceCulling: false,
  alpha: 0.7
});
barBgMat.disableDepthWrite = true;

const debrisMat = stdMat("debris", {
  diffuseColor: new C3(0.22, 0.23, 0.26),
  specularColor: new C3(0.35, 0.35, 0.4),
  emissiveColor: new C3(0.05, 0.04, 0.03)
});

/* ---------- mesh templates ---------- */
function bakedCylinder(opts, rot) {
  const m = MB.CreateCylinder("c", opts, scene);
  if (rot) m.rotation.copyFrom(rot);
  return m;
}

function buildEscort(team) {
  const parts = [];

  const hull = MB.CreateCylinder("h", { height: 4.6, diameterTop: 0.5, diameterBottom: 2.0, tessellation: 6 }, scene);
  hull.rotation.x = Math.PI / 2;            // nose -> +Z
  parts.push(hull);

  const spine = MB.CreateBox("s", { width: 1.1, height: 0.9, depth: 2.4 }, scene);
  spine.position.set(0, 0.25, -1.1);
  parts.push(spine);

  const belly = MB.CreateBox("b", { width: 1.4, height: 0.45, depth: 2.2 }, scene);
  belly.position.set(0, -0.7, -0.2);
  parts.push(belly);

  const canopy = MB.CreateSphere("k", { diameter: 1, segments: 10 }, scene);
  canopy.scaling.set(0.85, 0.55, 1.7);
  canopy.position.set(0, 0.42, 0.55);
  parts.push(canopy);

  for (const s of [-1, 1]) {
    const wing = MB.CreateBox("w", { width: 2.8, height: 0.16, depth: 1.6 }, scene);
    wing.position.set(s * 1.75, -0.02, -0.55);
    wing.rotation.z = -s * 0.20;
    wing.rotation.y = s * 0.26;
    parts.push(wing);

    const tip = MB.CreateBox("t", { width: 0.22, height: 0.62, depth: 1.05 }, scene);
    tip.position.set(s * 3.02, 0.16, -0.72);
    parts.push(tip);

    const nacelle = MB.CreateCylinder("n", { height: 2.4, diameter: 0.62, tessellation: 8 }, scene);
    nacelle.rotation.x = Math.PI / 2;
    nacelle.position.set(s * 1.2, -0.18, -1.15);
    parts.push(nacelle);

    const gun = MB.CreateCylinder("g", { height: 1.1, diameter: 0.18, tessellation: 6 }, scene);
    gun.rotation.x = Math.PI / 2;
    gun.position.set(s * 1.6, -0.05, 1.35);
    parts.push(gun);
  }

  const fin = MB.CreateBox("f", { width: 0.16, height: 1.25, depth: 1.15 }, scene);
  fin.position.set(0, 0.85, -1.75);
  parts.push(fin);

  const body = BABYLON.Mesh.MergeMeshes(parts, true, true, undefined, false, false);
  body.bakeCurrentTransformIntoVertices();
  body.name = "escortTpl" + team;
  body.material = MAT.hull[team];

  // glowing thrust assembly (separate material, parented)
  const gparts = [];
  for (const s of [-1, 1]) {
    const nozzle = MB.CreateCylinder("nz", { height: 0.34, diameterTop: 0.66, diameterBottom: 0.42, tessellation: 10 }, scene);
    nozzle.rotation.x = -Math.PI / 2;
    nozzle.position.set(s * 1.2, -0.18, -2.4);
    gparts.push(nozzle);

    const plume = MB.CreateCylinder("pl", { height: 1.8, diameterTop: 0.05, diameterBottom: 0.5, tessellation: 8 }, scene);
    plume.rotation.x = -Math.PI / 2;
    plume.position.set(s * 1.2, -0.18, -3.5);
    gparts.push(plume);
  }
  const strip = MB.CreateBox("st", { width: 0.14, height: 0.06, depth: 1.6 }, scene);
  strip.position.set(0, 0.62, -0.6);
  gparts.push(strip);

  const gmesh = BABYLON.Mesh.MergeMeshes(gparts, true, true, undefined, false, false);
  gmesh.bakeCurrentTransformIntoVertices();
  gmesh.material = MAT.engine[team];
  gmesh.parent = body;

  body.setEnabled(false);
  return body;
}

function buildFlagship(team) {
  const parts = [];

  const hull = MB.CreateBox("h", { width: 6.0, height: 3.0, depth: 15 }, scene);
  parts.push(hull);

  const prow = MB.CreateCylinder("p", { height: 8, diameterTop: 0.9, diameterBottom: 5.4, tessellation: 8 }, scene);
  prow.rotation.x = Math.PI / 2;
  prow.position.set(0, 0, 11.4);
  parts.push(prow);

  const keel = MB.CreateBox("k", { width: 4.2, height: 1.4, depth: 13 }, scene);
  keel.position.set(0, -2.0, -1.5);
  parts.push(keel);

  const tower = MB.CreateBox("tw", { width: 3.0, height: 2.4, depth: 6.2 }, scene);
  tower.position.set(0, 2.4, -2.2);
  parts.push(tower);

  const bridge = MB.CreateBox("br", { width: 1.9, height: 1.3, depth: 2.6 }, scene);
  bridge.position.set(0, 4.1, -0.6);
  parts.push(bridge);

  const mast = MB.CreateCylinder("ms", { height: 3.4, diameter: 0.24, tessellation: 6 }, scene);
  mast.position.set(0, 6.2, -2.6);
  parts.push(mast);

  for (const s of [-1, 1]) {
    const pod = MB.CreateBox("pd", { width: 1.8, height: 1.8, depth: 11 }, scene);
    pod.position.set(s * 4.1, -0.4, -0.5);
    parts.push(pod);

    const podNose = MB.CreateCylinder("pn", { height: 3.4, diameterTop: 0.5, diameterBottom: 1.8, tessellation: 8 }, scene);
    podNose.rotation.x = Math.PI / 2;
    podNose.position.set(s * 4.1, -0.4, 6.7);
    parts.push(podNose);

    const fin = MB.CreateBox("fn", { width: 0.35, height: 4.6, depth: 4.4 }, scene);
    fin.position.set(s * 2.6, 1.6, -8.2);
    fin.rotation.z = -s * 0.32;
    parts.push(fin);

    const cannon = MB.CreateCylinder("cn", { height: 5.2, diameter: 0.42, tessellation: 8 }, scene);
    cannon.rotation.x = Math.PI / 2;
    cannon.position.set(s * 2.1, 1.0, 9.0);
    parts.push(cannon);

    // greeble turrets along the dorsal spine
    for (let i = 0; i < 4; i++) {
      const t = MB.CreateBox("gr", { width: 1.0, height: 0.7, depth: 1.0 }, scene);
      t.position.set(s * 1.9, 1.85, -6.5 + i * 3.2);
      parts.push(t);
      const barrel = MB.CreateCylinder("gb", { height: 1.4, diameter: 0.18, tessellation: 6 }, scene);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(s * 1.9, 2.05, -5.8 + i * 3.2);
      parts.push(barrel);
    }
    // hull plating detail
    for (let i = 0; i < 3; i++) {
      const pl = MB.CreateBox("pl", { width: 0.5, height: 1.6, depth: 2.2 }, scene);
      pl.position.set(s * 3.15, -0.2, -4 + i * 4.2);
      parts.push(pl);
    }
  }

  const stern = MB.CreateBox("sn", { width: 6.6, height: 3.6, depth: 2.4 }, scene);
  stern.position.set(0, 0.2, -8.0);
  parts.push(stern);

  const body = BABYLON.Mesh.MergeMeshes(parts, true, true, undefined, false, false);
  body.bakeCurrentTransformIntoVertices();
  body.name = "flagTpl" + team;
  body.material = MAT.hull[team];

  const gparts = [];
  const offs = [-2.4, 0, 2.4];
  for (const x of offs) {
    const nozzle = MB.CreateCylinder("nz", { height: 0.7, diameterTop: 2.0, diameterBottom: 1.3, tessellation: 12 }, scene);
    nozzle.rotation.x = -Math.PI / 2;
    nozzle.position.set(x, 0.2, -9.5);
    gparts.push(nozzle);

    const plume = MB.CreateCylinder("pl", { height: 6.5, diameterTop: 0.12, diameterBottom: 1.5, tessellation: 10 }, scene);
    plume.rotation.x = -Math.PI / 2;
    plume.position.set(x, 0.2, -13.2);
    gparts.push(plume);
  }
  for (const s of [-1, 1]) {
    for (let i = 0; i < 5; i++) {
      const win = MB.CreateBox("wn", { width: 0.12, height: 0.22, depth: 0.9 }, scene);
      win.position.set(s * 3.05, 1.0, -5 + i * 2.6);
      gparts.push(win);
    }
    const runner = MB.CreateBox("rn", { width: 0.1, height: 0.1, depth: 9 }, scene);
    runner.position.set(s * 1.55, 3.65, -2.2);
    gparts.push(runner);
  }
  const gmesh = BABYLON.Mesh.MergeMeshes(gparts, true, true, undefined, false, false);
  gmesh.bakeCurrentTransformIntoVertices();
  gmesh.material = MAT.engine[team];
  gmesh.parent = body;

  body.setEnabled(false);
  return body;
}

const escortTpl = [buildEscort(0), buildEscort(1)];
const flagTpl = [buildFlagship(0), buildFlagship(1)];

const boltTpl = TEAMS.map((T, i) => {
  const core = MB.CreateCylinder("bolt", { height: 3.2, diameterTop: 0.16, diameterBottom: 0.16, tessellation: 6 }, scene);
  core.rotation.x = Math.PI / 2;
  core.bakeCurrentTransformIntoVertices();
  core.material = MAT.bolt[i];
  core.setEnabled(false);
  return core;
});

const debrisTpl = MB.CreateBox("debrisTpl", { size: 1 }, scene);
debrisTpl.material = debrisMat;
debrisTpl.setEnabled(false);

const ringTpl = MB.CreateTorus("ringTpl", { diameter: 2, thickness: 0.075, tessellation: 72 }, scene);
ringTpl.rotation.x = Math.PI / 2;          // face +Z so billboarding shows the full ring
ringTpl.bakeCurrentTransformIntoVertices();
ringTpl.setEnabled(false);

const flashTpl = MB.CreateSphere("flashTpl", { diameter: 1, segments: 12 }, scene);
flashTpl.setEnabled(false);

/* ---------- helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function randDir() {
  const u = Math.random() * Math.PI * 2;
  const v = Math.acos(2 * Math.random() - 1);
  return new V3(Math.sin(v) * Math.cos(u), Math.cos(v), Math.sin(v) * Math.sin(u));
}

function lookQuat(dir, up) {
  const f = dir.clone();
  const len = f.length();
  if (len < 1e-5) return Q.Identity();
  f.scaleInPlace(1 / len);
  let u = up ? up.clone() : V3.Up();
  if (Math.abs(V3.Dot(f, u)) > 0.998) u = Math.abs(f.y) > 0.9 ? new V3(1, 0, 0) : V3.Up();
  const m = BABYLON.Matrix.LookAtLH(V3.Zero(), f, u).invert();
  return Q.FromRotationMatrix(m);
}

// squared distance from point p to segment [a,b]
function segDistSq(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z;
  const apx = p.x - a.x, apy = p.y - a.y, apz = p.z - a.z;
  const denom = abx * abx + aby * aby + abz * abz;
  let t = denom > 1e-9 ? (apx * abx + apy * aby + apz * abz) / denom : 0;
  t = clamp(t, 0, 1);
  const dx = apx - abx * t, dy = apy - aby * t, dz = apz - abz * t;
  return dx * dx + dy * dy + dz * dz;
}

/* ---------- state ---------- */
const ships = [];
const bolts = [];
const effects = [];
let T = 0;
let battleOver = false;
let restartTimer = 0;
let shake = 0;
const camTarget = V3.Zero();
const camLook = V3.Zero();

/* explosion flash light pool */
const flashLights = [];
for (let i = 0; i < 2; i++) {
  const l = new BABYLON.PointLight("flash" + i, V3.Zero(), scene);
  l.intensity = 0;
  l.range = 260;
  l.diffuse = new C3(1, 0.72, 0.32);
  flashLights.push({ light: l, life: 0 });
}
function popFlash(pos, power) {
  let slot = flashLights[0];
  for (const f of flashLights) if (f.life < slot.life) slot = f;
  slot.light.position.copyFrom(pos);
  slot.light.intensity = power;
  slot.peak = power;
  slot.life = 0.55;
}

/* ---------- health bars ---------- */
function makeBar(s) {
  const W = s.isFlag ? 12 : 5.2;
  const H = s.isFlag ? 0.8 : 0.44;

  const bg = MB.CreatePlane("bar", { width: W + H * 0.6, height: H + H * 0.55 }, scene);
  bg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  bg.material = barBgMat;
  bg.isPickable = false;

  const fill = MB.CreatePlane("fill", { width: W, height: H }, scene);
  fill.parent = bg;
  fill.position.z = -0.02;
  fill.renderingGroupId = 1;
  fill.isPickable = false;

  const fm = stdMat("fill" + s.uid, {
    diffuseColor: C3.Black(),
    specularColor: C3.Black(),
    emissiveColor: new C3(0.2, 1, 0.35),
    disableLighting: true,
    backFaceCulling: false
  });
  fill.material = fm;

  glow.addExcludedMesh(bg);
  glow.addExcludedMesh(fill);

  s.bar = bg; s.fill = fill; s.fillMat = fm; s.barW = W;
  s.barOff = s.isFlag ? 10.5 : 3.6;
}

function dropBar(s) {
  if (!s.bar) return;
  glow.removeExcludedMesh(s.bar);
  glow.removeExcludedMesh(s.fill);
  s.bar.dispose();
  s.fillMat.dispose();
  s.bar = s.fill = s.fillMat = null;
}

/* ---------- ships ---------- */
let uidCounter = 0;

function spawnShip(team, isFlag, pos, heading) {
  const tpl = isFlag ? flagTpl[team] : escortTpl[team];
  const mesh = tpl.clone("ship" + (uidCounter));
  mesh.setEnabled(true);
  mesh.position.copyFrom(pos);
  mesh.rotationQuaternion = lookQuat(heading, V3.Up());

  const s = {
    uid: uidCounter++,
    team, isFlag, mesh,
    glowMesh: mesh.getChildMeshes(true)[0] || null,
    hp: isFlag ? CFG.flagHP : CFG.escortHP,
    maxHp: isFlag ? CFG.flagHP : CFG.escortHP,
    vel: heading.scale(isFlag ? 5 : 12),
    maxSpeed: isFlag ? 11 : rnd(20, 27),
    accel: isFlag ? 5 : rnd(20, 30),
    turn: isFlag ? 0.55 : rnd(1.9, 2.9),
    hitR: isFlag ? 8.5 : 2.7,
    width: isFlag ? 15 : 5.6,
    blastR: isFlag ? 26 : 6.6,
    dmg: isFlag ? CFG.flagDmg : CFG.escortDmg,
    engage: isFlag ? 130 : rnd(48, 96),
    orbitDir: Math.random() < 0.5 ? -1 : 1,
    seed: Math.random() * 100,
    fireT: Math.random() * CFG.fireInterval,
    muzzleSide: 1,
    target: null,
    alive: true,
    doomed: false,
    doomT: 0,
    throttle: 1,
    light: null
  };

  if (isFlag) {
    const l = new BABYLON.PointLight("eng" + s.uid, new V3(0, 0.2, -13), scene);
    l.parent = mesh;
    l.diffuse = TEAMS[team].engine;
    l.specular = TEAMS[team].engine;
    l.intensity = 1.35;
    l.range = 150;
    s.light = l;
  }

  makeBar(s);
  ships.push(s);
  return s;
}

function spawnFleet(team) {
  const dir = team === 0 ? 1 : -1;
  const base = new V3(rnd(-30, 30), rnd(-20, 20), -215 * dir);
  const heading = new V3(rnd(-0.12, 0.12), rnd(-0.06, 0.06), dir).normalize();

  spawnShip(team, true, base, heading);

  for (let i = 0; i < CFG.fleetSize - 1; i++) {
    const a = (i / (CFG.fleetSize - 1)) * Math.PI * 2 + (team * 0.4);
    const r = 26 + (i % 3) * 13;
    const off = new V3(
      Math.cos(a) * r,
      Math.sin(a * 2) * 14 + (i % 2 ? 9 : -9),
      Math.sin(a) * r * 0.7 + rnd(-14, 14)
    );
    spawnShip(team, false, base.add(off), heading);
  }
}

/* ---------- projectiles ---------- */
function fireBolt(owner, origin, aimDir) {
  const mesh = boltTpl[owner.team].clone("b");
  mesh.setEnabled(true);
  mesh.position.copyFrom(origin);
  mesh.rotationQuaternion = lookQuat(aimDir, V3.Up());

  let trail = null;
  if (BABYLON.TrailMesh) {
    try {
      trail = new BABYLON.TrailMesh("tr", mesh, scene, owner.isFlag ? 0.42 : 0.26, 30, true);
      trail.material = MAT.trail[owner.team];
      trail.isPickable = false;
    } catch (e) { trail = null; }
  }

  bolts.push({
    mesh, trail,
    vel: aimDir.scale(CFG.boltSpeed),
    team: owner.team,
    dmg: owner.dmg,
    life: CFG.boltLife,
    dead: false,
    lingering: 0,
    prev: origin.clone()
  });
}

function shipFire(s) {
  const t = s.target;
  if (!t || !t.alive) return;

  const toT = t.mesh.position.subtract(s.mesh.position);
  const dist = toT.length();
  const flight = dist / CFG.boltSpeed;
  const lead = t.mesh.position.add(t.vel.scale(flight * 0.95));
  const spread = dist * (s.isFlag ? 0.016 : 0.024);

  const wm = s.mesh.getWorldMatrix();
  const muzzles = s.isFlag
    ? [new V3(-2.1, 1.0, 12.0), new V3(2.1, 1.0, 12.0)]
    : [new V3(s.muzzleSide * 1.6, -0.05, 2.0)];
  s.muzzleSide *= -1;

  for (const local of muzzles) {
    const origin = V3.TransformCoordinates(local, wm);
    const aim = lead.add(randDir().scale(spread)).subtract(origin);
    if (aim.lengthSquared() < 1e-6) continue;
    aim.normalize();
    fireBolt(s, origin, aim);
    muzzleFlash(origin, s.team);
  }
}

/* ---------- effects ---------- */
function addEffect(life, update, dispose) {
  effects.push({ t: 0, life, update, dispose });
}

function burst(pos, cfg) {
  const ps = new BABYLON.ParticleSystem("burst", cfg.count, scene);
  ps.particleTexture = flareTex;
  ps.emitter = pos.clone();
  ps.createSphereEmitter(cfg.radius, 1);
  ps.color1 = cfg.c1;
  ps.color2 = cfg.c2;
  ps.colorDead = cfg.cd || new C4(0, 0, 0, 0);
  ps.minSize = cfg.minSize; ps.maxSize = cfg.maxSize;
  ps.minLifeTime = cfg.minLife; ps.maxLifeTime = cfg.maxLife;
  ps.minEmitPower = cfg.minPow; ps.maxEmitPower = cfg.maxPow;
  ps.minAngularSpeed = -4; ps.maxAngularSpeed = 4;
  ps.blendMode = cfg.blend !== undefined ? cfg.blend : BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps.gravity = V3.Zero();
  ps.updateSpeed = 0.014;
  ps.manualEmitCount = cfg.count;
  ps.start();
  addEffect(cfg.maxLife + 0.5, null, () => ps.dispose());
  return ps;
}

function muzzleFlash(pos, team) {
  const Tm = TEAMS[team];
  burst(pos, {
    count: 12, radius: 0.35,
    c1: new C4(Tm.bolt.r, Tm.bolt.g, Tm.bolt.b, 1),
    c2: new C4(1, 1, 1, 1),
    minSize: 0.35, maxSize: 1.1,
    minLife: 0.06, maxLife: 0.16,
    minPow: 2, maxPow: 7
  });
}

function impactSpark(pos, team) {
  const Tm = TEAMS[team];
  burst(pos, {
    count: 26, radius: 0.5,
    c1: new C4(Tm.bolt.r, Tm.bolt.g, Tm.bolt.b, 1),
    c2: new C4(1, 1, 0.85, 1),
    minSize: 0.18, maxSize: 0.75,
    minLife: 0.12, maxLife: 0.4,
    minPow: 6, maxPow: 22
  });
  popFlash(pos, 0.35);
}

function shockwave(pos, maxR, life, color, thickness) {
  const ring = ringTpl.clone("sw");
  ring.setEnabled(true);
  ring.position.copyFrom(pos);
  ring.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  ring.isPickable = false;
  const m = stdMat("swm", {
    diffuseColor: C3.Black(),
    specularColor: C3.Black(),
    emissiveColor: color,
    disableLighting: true,
    backFaceCulling: false,
    alpha: 1
  });
  m.alphaMode = BABYLON.Engine.ALPHA_ADD;
  ring.material = m;
  ring.scaling.setAll(0.4);

  addEffect(life, (dt, k) => {
    const e = 1 - Math.pow(1 - k, 3);
    ring.scaling.set(maxR * e, maxR * e, maxR * e * (thickness || 1));
    m.alpha = Math.max(0, 1 - k) * 0.9;
  }, () => { ring.dispose(); m.dispose(); });
}

function flashBall(pos, maxR, life, color) {
  const b = flashTpl.clone("fb");
  b.setEnabled(true);
  b.position.copyFrom(pos);
  b.isPickable = false;
  const m = stdMat("fbm", {
    diffuseColor: C3.Black(), specularColor: C3.Black(),
    emissiveColor: color, disableLighting: true, alpha: 1, backFaceCulling: false
  });
  m.alphaMode = BABYLON.Engine.ALPHA_ADD;
  b.material = m;
  addEffect(life, (dt, k) => {
    const s = maxR * (0.35 + 0.65 * Math.pow(k, 0.4));
    b.scaling.setAll(s);
    m.alpha = Math.max(0, 1 - k * k);
  }, () => { b.dispose(); m.dispose(); });
}

function spawnDebris(pos, baseVel, scale, count, team) {
  for (let i = 0; i < count; i++) {
    const d = debrisTpl.clone("dbr");
    d.setEnabled(true);
    d.material = Math.random() < 0.22 ? MAT.engine[team] : debrisMat;
    d.isPickable = false;
    const base = new V3(rnd(0.25, 1.0) * scale, rnd(0.2, 0.85) * scale, rnd(0.4, 2.0) * scale);
    d.scaling.copyFrom(base);
    d.position.copyFrom(pos).addInPlace(randDir().scale(rnd(0.2, 1.4) * scale));
    d.rotation.set(rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28));

    const vel = randDir().scale(rnd(7, 30) * Math.sqrt(scale)).addInPlace(baseVel.scale(0.4));
    const spin = new V3(rnd(-5, 5), rnd(-5, 5), rnd(-5, 5));
    const life = rnd(2.0, 3.6);

    addEffect(life, (dt, k) => {
      d.position.addInPlace(vel.scale(dt));
      vel.scaleInPlace(1 - 0.25 * dt);
      d.rotation.addInPlace(spin.scale(dt));
      const f = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      d.scaling.copyFrom(base).scaleInPlace(Math.max(0.001, f));
    }, () => d.dispose());
  }
}

function detonate(pos, vel, scale, team) {
  const Tm = TEAMS[team];

  // core fireball
  burst(pos, {
    count: Math.round(160 * scale), radius: 1.6 * scale,
    c1: new C4(1, 0.85, 0.35, 1), c2: new C4(1, 0.34, 0.06, 1),
    cd: new C4(0.25, 0.03, 0.0, 0),
    minSize: 1.4 * scale, maxSize: 6.5 * scale,
    minLife: 0.35, maxLife: 1.1 + 0.5 * scale,
    minPow: 6 * scale, maxPow: 30 * scale
  });

  // white-hot centre
  burst(pos, {
    count: Math.round(60 * scale), radius: 0.8 * scale,
    c1: new C4(1, 1, 0.92, 1), c2: new C4(1, 0.92, 0.6, 1),
    minSize: 1.0 * scale, maxSize: 3.6 * scale,
    minLife: 0.12, maxLife: 0.35,
    minPow: 10 * scale, maxPow: 40 * scale
  });

  // sparks
  burst(pos, {
    count: Math.round(190 * scale), radius: 0.6 * scale,
    c1: new C4(1, 0.95, 0.7, 1), c2: new C4(Tm.bolt.r, Tm.bolt.g, Tm.bolt.b, 1),
    minSize: 0.16 * scale, maxSize: 0.7 * scale,
    minLife: 0.5, maxLife: 1.6,
    minPow: 30 * scale, maxPow: 95 * scale
  });

  // slow embers / smoke
  burst(pos, {
    count: Math.round(50 * scale), radius: 2.2 * scale,
    c1: new C4(0.35, 0.22, 0.20, 0.55), c2: new C4(0.13, 0.11, 0.14, 0.4),
    cd: new C4(0.03, 0.03, 0.05, 0),
    minSize: 3 * scale, maxSize: 11 * scale,
    minLife: 1.4, maxLife: 3.0,
    minPow: 1.5 * scale, maxPow: 8 * scale,
    blend: BABYLON.ParticleSystem.BLENDMODE_STANDARD
  });

  flashBall(pos, 7 * scale, 0.32, new C3(1, 0.92, 0.7));
  shockwave(pos, 26 * scale, 0.75, new C3(1, 0.72, 0.35), 1);
  shockwave(pos, 42 * scale, 1.15, new C3(0.6, 0.78, 1.0), 1);
  spawnDebris(pos, vel, scale, Math.round(11 * scale), team);
  popFlash(pos, 2.6 * scale);

  shake = Math.min(2.6, shake + 0.7 * scale);
}

/* ---------- destruction & chain reaction ---------- */
function killShip(s) {
  if (!s.alive) return;
  s.alive = false;

  const pos = s.mesh.position.clone();
  const vel = s.vel.clone();
  detonate(pos, vel, s.isFlag ? 2.7 : 1.0, s.team);

  if (s.light) s.light.dispose();
  dropBar(s);
  s.mesh.dispose();

  const i = ships.indexOf(s);
  if (i >= 0) ships.splice(i, 1);

  // chain reaction: anything within roughly one ship-width of the blast goes up too
  for (const o of ships) {
    if (!o.alive || o.doomed) continue;
    const d = V3.Distance(o.mesh.position, pos);
    if (d < s.blastR + o.hitR) {
      o.doomed = true;
      o.doomT = 0.09 + Math.random() * 0.2;
      o.hp = Math.min(o.hp, 1);
    }
  }
}

function damageShip(s, amount, at, team) {
  s.hp -= amount;
  impactSpark(at, team);
  if (s.hp <= 0) killShip(s);
}

/* ---------- AI ---------- */
function pickTarget(s) {
  let best = null, bestScore = Infinity;
  for (const o of ships) {
    if (!o.alive || o.team === s.team) continue;
    let d = V3.Distance(o.mesh.position, s.mesh.position);
    if (o.isFlag) d *= s.isFlag ? 0.4 : 0.85;   // capital ships attract fire
    d *= rnd(0.85, 1.15);
    if (d < bestScore) { bestScore = d; best = o; }
  }
  return best;
}

const _desired = new V3();
const _tmp = new V3();

function updateShip(s, dt) {
  if (s.doomed) {
    s.doomT -= dt;
    if (s.doomT <= 0) { killShip(s); return; }
  }

  if (!s.target || !s.target.alive) s.target = pickTarget(s);

  _desired.setAll(0);

  if (s.target) {
    const tp = s.target.mesh.position;
    _tmp.copyFrom(tp).subtractInPlace(s.mesh.position);
    const d = _tmp.length();
    if (d > 1e-4) _tmp.scaleInPlace(1 / d);

    let side = V3.Cross(_tmp, V3.Up());
    if (side.lengthSquared() < 1e-5) side = new V3(1, 0, 0);
    side.normalize();

    if (d > s.engage) {
      _desired.addInPlace(_tmp.scale(1.25));
    } else if (d < s.engage * 0.5) {
      _desired.addInPlace(_tmp.scale(-1.0));
    } else {
      _desired.addInPlace(_tmp.scale(0.35));
    }
    _desired.addInPlace(side.scale(s.orbitDir * (s.isFlag ? 0.35 : 0.95)));
    _desired.y += Math.sin(T * 0.6 + s.seed) * (s.isFlag ? 0.12 : 0.45);
  }

  // separation from everyone nearby (friend or foe)
  for (const o of ships) {
    if (o === s || !o.alive) continue;
    const sepR = (s.width + o.width) * 1.5;
    const dx = s.mesh.position.x - o.mesh.position.x;
    const dy = s.mesh.position.y - o.mesh.position.y;
    const dz = s.mesh.position.z - o.mesh.position.z;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 < sepR * sepR && d2 > 1e-4) {
      const d = Math.sqrt(d2);
      const w = (1 - d / sepR) * 2.4;
      _desired.x += (dx / d) * w;
      _desired.y += (dy / d) * w;
      _desired.z += (dz / d) * w;
    }
  }

  // wander
  _desired.x += Math.sin(T * 0.9 + s.seed * 1.7) * 0.35;
  _desired.y += Math.sin(T * 1.3 + s.seed * 2.3) * 0.30;
  _desired.z += Math.cos(T * 0.8 + s.seed * 3.1) * 0.35;

  // keep the fight inside the arena
  const r = s.mesh.position.length();
  if (r > CFG.arena) {
    _desired.addInPlace(s.mesh.position.scale(-(r - CFG.arena) / (CFG.arena * 0.35) / Math.max(r, 1e-4)));
  }

  if (_desired.lengthSquared() < 1e-6) _desired.copyFrom(s.vel);
  const dl = _desired.length();
  if (dl > 1e-5) _desired.scaleInPlace(s.maxSpeed / dl);

  // steering (limited acceleration)
  const delta = _desired.subtract(s.vel);
  const dvLen = delta.length();
  const maxDv = s.accel * dt;
  if (dvLen > maxDv && dvLen > 1e-6) delta.scaleInPlace(maxDv / dvLen);
  s.vel.addInPlace(delta);

  const spd = s.vel.length();
  if (spd > s.maxSpeed) s.vel.scaleInPlace(s.maxSpeed / spd);
  s.throttle = clamp(spd / s.maxSpeed, 0.25, 1);

  s.mesh.position.addInPlace(s.vel.scale(dt));

  // orientation with banking into the turn
  if (spd > 0.2) {
    const fwd = s.vel.scale(1 / spd);
    let right = V3.Cross(V3.Up(), fwd);
    if (right.lengthSquared() < 1e-5) right = new V3(1, 0, 0);
    right.normalize();
    const up = V3.Cross(fwd, right).normalize();
    const lateral = V3.Dot(delta, right) / Math.max(dt, 1e-4);
    const roll = clamp(-lateral * 0.016, -1.15, 1.15) * (s.isFlag ? 0.35 : 1);
    const upR = V3.TransformCoordinates(up, BABYLON.Matrix.RotationAxis(fwd, roll));
    const target = lookQuat(fwd, upR);
    Q.SlerpToRef(s.mesh.rotationQuaternion, target, clamp(s.turn * dt, 0, 1), s.mesh.rotationQuaternion);
  }

  s.mesh.computeWorldMatrix(true);

  // thrust plume
  if (s.glowMesh) {
    const p = 0.65 + s.throttle * 0.55 + Math.sin(T * 22 + s.seed) * 0.07;
    s.glowMesh.scaling.set(1, 1, p);
  }
  if (s.light) s.light.intensity = 1.0 + s.throttle * 0.6;

  // guns
  s.fireT -= dt;
  if (s.fireT <= 0) {
    s.fireT = CFG.fireInterval;
    shipFire(s);
  }

  // health bar
  const f = Math.max(0, s.hp / s.maxHp);
  s.bar.position.copyFrom(s.mesh.position);
  s.bar.position.y += s.barOff;
  s.fill.scaling.x = Math.max(0.0015, f);
  s.fill.position.x = -(s.barW / 2) * (1 - f);
  const c = s.fillMat.emissiveColor;
  c.r = 1.0 - 0.78 * f;
  c.g = 0.13 + 0.87 * f;
  c.b = 0.10 + 0.22 * f;
}

/* ---------- projectile update ---------- */
function updateBolts(dt) {
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];

    if (b.dead) {
      b.lingering -= dt;
      if (b.lingering <= 0) {
        if (b.trail) b.trail.dispose();
        b.mesh.dispose();
        bolts.splice(i, 1);
      }
      continue;
    }

    b.prev.copyFrom(b.mesh.position);
    b.mesh.position.addInPlace(b.vel.scale(dt));
    b.life -= dt;

    let hit = false;
    for (const s of ships) {
      if (!s.alive || s.team === b.team) continue;
      const rr = s.hitR * s.hitR;
      if (segDistSq(s.mesh.position, b.prev, b.mesh.position) < rr) {
        damageShip(s, b.dmg, b.mesh.position.clone(), b.team);
        hit = true;
        break;
      }
    }

    if (hit || b.life <= 0) {
      b.dead = true;
      b.lingering = 0.3;
      b.mesh.isVisible = false;
    }
  }
}

/* ---------- HUD ---------- */
const hudEl = {
  a: document.querySelector("#a"),
  b: document.querySelector("#b"),
  banner: document.getElementById("banner"),
  bannerWin: document.querySelector("#banner .win")
};
hudEl.a.pips = hudEl.a.querySelector(".pips");
hudEl.b.pips = hudEl.b.querySelector(".pips");
hudEl.a.bar = hudEl.a.querySelector(".track i");
hudEl.b.bar = hudEl.b.querySelector(".track i");
hudEl.a.count = hudEl.a.querySelector(".count");
hudEl.b.count = hudEl.b.querySelector(".count");

function buildPips() {
  for (const el of [hudEl.a, hudEl.b]) {
    el.pips.innerHTML = "";
    for (let i = 0; i < CFG.fleetSize; i++) {
      const u = document.createElement("u");
      u.className = "on" + (i === 0 ? " flag" : "");
      el.pips.appendChild(u);
    }
  }
}

let hudClock = 0;
function updateHUD() {
  for (let t = 0; t < 2; t++) {
    const el = t === 0 ? hudEl.a : hudEl.b;
    const fleet = ships.filter((s) => s.team === t && s.alive);
    let hp = 0, max = 0;
    for (const s of fleet) { hp += Math.max(0, s.hp); }
    max = CFG.flagHP + (CFG.fleetSize - 1) * CFG.escortHP;
    el.bar.style.width = (100 * clamp(hp / max, 0, 1)) + "%";
    el.count.textContent = fleet.length + "/" + CFG.fleetSize;

    const pips = el.pips.children;
    const flagAlive = fleet.some((s) => s.isFlag);
    const escorts = fleet.filter((s) => !s.isFlag).length;
    for (let i = 0; i < pips.length; i++) {
      const on = i === 0 ? flagAlive : (i <= escorts);
      pips[i].className = (i === 0 ? "flag " : "") + (on ? "on" : "dead");
    }
  }
}

/* ---------- battle lifecycle ---------- */
function clearAll() {
  for (let i = ships.length - 1; i >= 0; i--) {
    const s = ships[i];
    if (s.light) s.light.dispose();
    dropBar(s);
    s.mesh.dispose();
  }
  ships.length = 0;

  for (const b of bolts) { if (b.trail) b.trail.dispose(); b.mesh.dispose(); }
  bolts.length = 0;

  for (const e of effects) { if (e.dispose) e.dispose(); }
  effects.length = 0;
}

function startBattle() {
  clearAll();
  spawnFleet(0);
  spawnFleet(1);
  buildPips();
  updateHUD();
  battleOver = false;
  restartTimer = 0;
  hudEl.banner.classList.remove("show");
  camera.radius = 400;
}

/* ---------- main loop ---------- */
let userInteracting = 0;
let autoOrbit = true;
canvas.addEventListener("pointerdown", () => { userInteracting = 3.0; });
canvas.addEventListener("wheel", () => { userInteracting = 3.0; }, { passive: true });

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "c") autoOrbit = !autoOrbit;
  if (k === "r") startBattle();
});

scene.onBeforeRenderObservable.add(() => {
  const dt = Math.min(0.05, engine.getDeltaTime() / 1000);
  T += dt;

  // ships (iterate a snapshot: the list mutates on death)
  const snapshot = ships.slice();
  for (const s of snapshot) if (s.alive) updateShip(s, dt);

  updateBolts(dt);

  // effects
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.t += dt;
    if (e.update) e.update(dt, clamp(e.t / e.life, 0, 1));
    if (e.t >= e.life) {
      if (e.dispose) e.dispose();
      effects.splice(i, 1);
    }
  }

  // flash light decay
  for (const f of flashLights) {
    if (f.life > 0) {
      f.life -= dt;
      const k = Math.max(0, f.life / 0.55);
      f.light.intensity = (f.peak || 1) * k * k;
    } else f.light.intensity = 0;
  }

  // cinematic camera: track the centre of mass of whatever is still fighting
  if (ships.length) {
    camLook.setAll(0);
    for (const s of ships) camLook.addInPlace(s.mesh.position);
    camLook.scaleInPlace(1 / ships.length);
  }
  V3.LerpToRef(camTarget, camLook, Math.min(1, dt * 0.8), camTarget);

  shake = Math.max(0, shake - dt * 2.2);
  const sh = shake * shake;
  camera.target.x = camTarget.x + rnd(-1, 1) * sh;
  camera.target.y = camTarget.y + rnd(-1, 1) * sh;
  camera.target.z = camTarget.z + rnd(-1, 1) * sh;

  if (userInteracting > 0) userInteracting -= dt;
  if (autoOrbit && userInteracting <= 0) camera.alpha += dt * 0.055;

  // HUD
  hudClock += dt;
  if (hudClock > 0.15) { hudClock = 0; updateHUD(); }

  // win condition
  if (!battleOver) {
    const a = ships.some((s) => s.team === 0 && s.alive);
    const b = ships.some((s) => s.team === 1 && s.alive);
    if (!a || !b) {
      battleOver = true;
      restartTimer = CFG.restartDelay;
      const winner = a ? 0 : (b ? 1 : -1);
      hudEl.bannerWin.textContent = winner < 0 ? "MUTUAL DESTRUCTION" : TEAMS[winner].label + " HOLDS THE FIELD";
      hudEl.bannerWin.style.color = winner < 0 ? "#dbe4f0" : TEAMS[winner].css;
      hudEl.banner.classList.add("show");
    }
  } else {
    restartTimer -= dt;
    if (restartTimer <= 0) startBattle();
  }
});

/* ---------- go ---------- */
startBattle();

engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());

scene.executeWhenReady(() => {
  const boot = document.getElementById("boot");
  boot.classList.add("gone");
  setTimeout(() => boot.remove(), 900);
});
</script>
</body>
</html>
