<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Breach — Space Battle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.3.2/babylon.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#06080e;--panel:rgba(6,8,14,0.88);--border:rgba(255,255,255,0.06);
  --text:#b8c4d8;--text2:#4a5468;--blue:#38a8ff;--red:#ff4848;--gold:#ffcc44;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text)}
canvas#c{width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}

#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center}
.t1{font-family:'Chakra Petch',sans-serif;font-size:14px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--text);text-shadow:0 0 20px rgba(56,168,255,0.2)}
.t2{font-size:9px;color:var(--text2);letter-spacing:3px;margin-top:1px}

/* Fleet panels */
.fleet-panel{position:absolute;top:50px;width:180px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;backdrop-filter:blur(6px)}
.fleet-panel.left{left:14px}.fleet-panel.right{right:14px}
.fp-title{font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.fp-title.blue{color:var(--blue)}.fp-title.red{color:var(--red)}
.fp-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:3px;letter-spacing:.5px}
.fp-val{font-weight:600;color:var(--text)}
.fp-bar{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:4px;overflow:hidden}
.fp-fill{height:100%;border-radius:2px;transition:width .3s}
.fp-fill.blue{background:var(--blue)}.fp-fill.red{background:var(--red)}

/* Victory overlay */
#victory{position:absolute;inset:0;background:rgba(6,8,14,0.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;pointer-events:all;backdrop-filter:blur(4px)}
#victory.show{display:flex}
.v-title{font-family:'Chakra Petch',sans-serif;font-size:38px;font-weight:700;letter-spacing:5px}
.v-sub{font-size:14px;color:var(--text2);letter-spacing:3px}
.v-btn{margin-top:12px;padding:10px 32px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:3px;cursor:pointer;transition:.2s}
.v-btn:hover{border-color:var(--blue);color:var(--blue)}

#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:8px;color:rgba(74,84,104,0.35);letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title"><div class="t1">Stellar Breach</div><div class="t2">Fleet Engagement Simulation</div></div>
  <div class="fleet-panel left">
    <div class="fp-title blue">◆ BLUE FLEET</div>
    <div class="fp-row">Ships Active <span class="fp-val" id="b-ships">10</span></div>
    <div class="fp-row">Flagship <span class="fp-val" id="b-flag">ONLINE</span></div>
    <div class="fp-bar"><div class="fp-fill blue" id="b-bar" style="width:100%"></div></div>
  </div>
  <div class="fleet-panel right">
    <div class="fp-title red">◆ RED FLEET</div>
    <div class="fp-row">Ships Active <span class="fp-val" id="r-ships">10</span></div>
    <div class="fp-row">Flagship <span class="fp-val" id="r-flag">ONLINE</span></div>
    <div class="fp-bar"><div class="fp-fill red" id="r-bar" style="width:100%"></div></div>
  </div>
  <div id="hint">drag to orbit · scroll to zoom</div>
</div>
<div id="victory">
  <div class="v-title" id="v-title">VICTORY</div>
  <div class="v-sub" id="v-sub">Fleet Destroyed</div>
  <button class="v-btn" onclick="location.reload()">ENGAGE AGAIN</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  STELLAR BREACH — 3D Space Battle Simulation
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, true, { stencil: true });
const scene = new BABYLON.Scene(engine);

const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 0.999));
const pick = a => a[ri(0, a.length - 1)];
const TAU = Math.PI * 2;
const V3 = (x, y, z) => new BABYLON.Vector3(x, y, z);
const C3 = (r, g, b) => new BABYLON.Color3(r, g, b);

// ┌──────────────────────────────┐
// │  SCENE SETUP                 │
// └──────────────────────────────┘
scene.clearColor = new BABYLON.Color4(0.02, 0.03, 0.06, 1);
scene.ambientColor = C3(0.08, 0.10, 0.15);

// Camera
const cam = new BABYLON.ArcRotateCamera('cam', -Math.PI * 0.3, Math.PI / 2.8, 120, V3(0, 0, 0), scene);
cam.attachControl(canvas, true);
cam.lowerRadiusLimit = 30;
cam.upperRadiusLimit = 350;
cam.wheelPrecision = 2;
cam.panningSensibility = 0;

// Key light — distant star
const starLight = new BABYLON.DirectionalLight('star', V3(0.3, -0.5, 0.7).normalize(), scene);
starLight.intensity = 1.2;
starLight.diffuse = C3(1, 0.95, 0.88);

// Rim light from opposite side
const rimLight = new BABYLON.DirectionalLight('rim', V3(-0.5, 0.3, -0.6).normalize(), scene);
rimLight.intensity = 0.35;
rimLight.diffuse = C3(0.5, 0.6, 0.85);

// Hemisphere ambient
const hemi = new BABYLON.HemisphericLight('hemi', V3(0, 1, 0), scene);
hemi.intensity = 0.25;
hemi.diffuse = C3(0.35, 0.40, 0.55);
hemi.groundColor = C3(0.05, 0.04, 0.08);

// ┌──────────────────────────────┐
// │  STARFIELD + NEBULA          │
// └──────────────────────────────┘
// Skybox sphere with stars
const skybox = BABYLON.MeshBuilder.CreateSphere('sky', {
  diameter: 800, segments: 16, sideOrientation: BABYLON.Mesh.BACKSIDE
}, scene);
const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
skyMat.disableLighting = true;

// Dynamic texture for starfield
const skyTex = new BABYLON.DynamicTexture('skyTex', 2048, scene);
const skyCtx = skyTex.getContext();
// Black background
skyCtx.fillStyle = '#020308';
skyCtx.fillRect(0, 0, 2048, 2048);
// Stars
for (let i = 0; i < 3000; i++) {
  const x = Math.random() * 2048;
  const y = Math.random() * 2048;
  const brightness = Math.random();
  const size = brightness < 0.95 ? 1 : (brightness < 0.99 ? 2 : 3);
  const b = Math.floor(150 + brightness * 105);
  const tint = ri(0, 2);
  const r = tint === 0 ? b : Math.floor(b * 0.8);
  const g = tint === 1 ? b : Math.floor(b * 0.85);
  const bl = tint === 2 ? b : Math.floor(b * 0.9);
  skyCtx.fillStyle = `rgb(${r},${g},${bl})`;
  skyCtx.fillRect(x, y, size, size);
}
// Nebula clouds — large translucent gradients
for (let i = 0; i < 8; i++) {
  const cx = rr(200, 1848);
  const cy = rr(200, 1848);
  const rad = rr(150, 450);
  const colors = [
    [40, 20, 80], [20, 40, 90], [80, 20, 50], [15, 50, 70],
    [60, 15, 60], [30, 60, 50], [70, 30, 40], [20, 35, 75]
  ];
  const [nr, ng, nb] = colors[i];
  const grad = skyCtx.createRadialGradient(cx, cy, 0, cx, cy, rad);
  grad.addColorStop(0, `rgba(${nr},${ng},${nb},0.12)`);
  grad.addColorStop(0.5, `rgba(${nr},${ng},${nb},0.05)`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  skyCtx.fillStyle = grad;
  skyCtx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
}
skyTex.update();
skyMat.emissiveTexture = skyTex;
skyMat.diffuseColor = BABYLON.Color3.Black();
skyMat.specularColor = BABYLON.Color3.Black();
skybox.material = skyMat;

// ┌──────────────────────────────┐
// │  MATERIALS                   │
// └──────────────────────────────┘
function mkMat(name, diff, em, spec, alpha) {
  const m = new BABYLON.StandardMaterial(name, scene);
  m.diffuseColor = diff || BABYLON.Color3.Black();
  m.emissiveColor = em || BABYLON.Color3.Black();
  m.specularColor = spec || C3(0.15, 0.15, 0.15);
  m.specularPower = 16;
  if (alpha !== undefined) m.alpha = alpha;
  return m;
}

// Blue fleet hull
const matBlueHull = mkMat('bh', C3(0.30, 0.35, 0.45), C3(0.02, 0.04, 0.08), C3(0.2, 0.25, 0.35));
const matBlueTrim = mkMat('bt', C3(0.15, 0.40, 0.70), C3(0.05, 0.20, 0.50));
const matBlueEngine = mkMat('be', C3(0.2, 0.5, 1.0), C3(0.3, 0.65, 1.0));

// Red fleet hull
const matRedHull = mkMat('rh', C3(0.45, 0.30, 0.28), C3(0.08, 0.02, 0.02), C3(0.35, 0.2, 0.18));
const matRedTrim = mkMat('rt', C3(0.70, 0.25, 0.18), C3(0.50, 0.10, 0.05));
const matRedEngine = mkMat('re', C3(1.0, 0.35, 0.15), C3(1.0, 0.50, 0.2));

// Projectile materials
const matBlueProj = mkMat('bp', C3(0.3, 0.6, 1), C3(0.4, 0.7, 1.0));
const matRedProj = mkMat('rp', C3(1, 0.3, 0.2), C3(1.0, 0.4, 0.25));

// Health bar materials
const matHpGreen = mkMat('hpg', C3(0.2, 0.85, 0.3), C3(0.1, 0.4, 0.15));
const matHpBg = mkMat('hpbg', C3(0.15, 0.15, 0.18), BABYLON.Color3.Black(), BABYLON.Color3.Black(), 0.5);

// Explosion
const matFire = mkMat('fire', BABYLON.Color3.Black(), C3(1, 0.7, 0.2));
const matSpark = mkMat('spark', BABYLON.Color3.Black(), C3(1, 0.9, 0.5));

// ┌──────────────────────────────┐
// │  SHIP BUILDER                │
// └──────────────────────────────┘
function buildShip(team, isFlagship) {
  const parent = new BABYLON.TransformNode('ship', scene);
  const s = isFlagship ? 2.0 : 1.0;
  const hullMat = team === 0 ? matBlueHull : matRedHull;
  const trimMat = team === 0 ? matBlueTrim : matRedTrim;
  const engMat = team === 0 ? matBlueEngine : matRedEngine;

  // Main hull — elongated box
  const hull = BABYLON.MeshBuilder.CreateBox('hull', {
    width: 1.2 * s, height: 0.5 * s, depth: 3.5 * s
  }, scene);
  hull.parent = parent;
  hull.material = hullMat;

  // Nose cone
  const nose = BABYLON.MeshBuilder.CreateCylinder('nose', {
    diameterTop: 0, diameterBottom: 1.1 * s, height: 1.5 * s, tessellation: 4
  }, scene);
  nose.parent = parent;
  nose.rotation.x = Math.PI / 2;
  nose.position.z = 2.2 * s;
  nose.material = hullMat;

  // Trim stripe
  const stripe = BABYLON.MeshBuilder.CreateBox('stripe', {
    width: 1.25 * s, height: 0.08, depth: 2.5 * s
  }, scene);
  stripe.parent = parent;
  stripe.position.y = 0.26 * s;
  stripe.material = trimMat;

  // Wing pylons
  for (const side of [-1, 1]) {
    const wing = BABYLON.MeshBuilder.CreateBox('wing', {
      width: 1.8 * s, height: 0.12 * s, depth: 1.2 * s
    }, scene);
    wing.parent = parent;
    wing.position.set(side * 1.2 * s, 0, -0.3 * s);
    wing.rotation.z = side * 0.15;
    wing.material = hullMat;

    // Wing tip
    const tip = BABYLON.MeshBuilder.CreateBox('tip', {
      width: 0.3 * s, height: 0.15 * s, depth: 0.5 * s
    }, scene);
    tip.parent = parent;
    tip.position.set(side * 2.0 * s, 0.05, -0.3 * s);
    tip.material = trimMat;

    // Weapon mounts
    const gun = BABYLON.MeshBuilder.CreateCylinder('gun', {
      diameter: 0.12 * s, height: 0.6 * s, tessellation: 6
    }, scene);
    gun.parent = parent;
    gun.rotation.x = Math.PI / 2;
    gun.position.set(side * 1.0 * s, -0.15 * s, 1.5 * s);
    gun.material = trimMat;
  }

  // Engine nacelles
  for (const side of [-1, 0, 1]) {
    if (side === 0 && !isFlagship) continue;
    const eng = BABYLON.MeshBuilder.CreateCylinder('eng', {
      diameter: 0.4 * s, height: 0.8 * s, tessellation: 8
    }, scene);
    eng.parent = parent;
    eng.rotation.x = Math.PI / 2;
    eng.position.set(side * 0.7 * s, -0.1 * s, -1.8 * s);
    eng.material = engMat;

    // Engine glow cone
    const glow = BABYLON.MeshBuilder.CreateCylinder('glow', {
      diameterTop: 0.35 * s, diameterBottom: 0.05, height: 0.8 * s, tessellation: 8
    }, scene);
    glow.parent = parent;
    glow.rotation.x = -Math.PI / 2;
    glow.position.set(side * 0.7 * s, -0.1 * s, -2.3 * s);
    glow.material = engMat;
  }

  // Flagship extras: bridge tower, extra armor plates
  if (isFlagship) {
    const bridge = BABYLON.MeshBuilder.CreateBox('bridge', {
      width: 0.7, height: 0.6, depth: 1.2
    }, scene);
    bridge.parent = parent;
    bridge.position.set(0, 0.7, 0.5);
    bridge.material = hullMat;

    const bridgeWindows = BABYLON.MeshBuilder.CreateBox('bwin', {
      width: 0.72, height: 0.15, depth: 0.6
    }, scene);
    bridgeWindows.parent = parent;
    bridgeWindows.position.set(0, 0.85, 0.6);
    bridgeWindows.material = trimMat;

    // Armor plates along sides
    for (const side of [-1, 1]) {
      const plate = BABYLON.MeshBuilder.CreateBox('plate', {
        width: 0.15, height: 0.8, depth: 2.5
      }, scene);
      plate.parent = parent;
      plate.position.set(side * 0.75, 0, 0);
      plate.material = trimMat;
    }

    // Dorsal antenna
    const ant = BABYLON.MeshBuilder.CreateCylinder('ant', {
      diameter: 0.06, height: 1.2, tessellation: 4
    }, scene);
    ant.parent = parent;
    ant.position.set(0, 1.2, -0.2);
    ant.material = trimMat;

    // Additional weapon turrets
    for (const side of [-1, 1]) {
      const turret = BABYLON.MeshBuilder.CreateSphere('turret', {
        diameter: 0.35, segments: 6
      }, scene);
      turret.parent = parent;
      turret.position.set(side * 0.5, 0.4, 1.0);
      turret.material = trimMat;
    }
  }

  // ── Engine point light ──
  const engLight = new BABYLON.PointLight('engL', V3(0, 0, -2 * s), scene);
  engLight.parent = parent;
  engLight.intensity = 0.6;
  engLight.range = 8 * s;
  engLight.diffuse = team === 0 ? C3(0.3, 0.5, 1) : C3(1, 0.4, 0.2);

  return parent;
}

// ┌──────────────────────────────┐
// │  HEALTH BAR SYSTEM           │
// └──────────────────────────────┘
function createHealthBar(ship) {
  const width = ship.isFlagship ? 4 : 2;
  const height = 0.2;

  // Background
  const bg = BABYLON.MeshBuilder.CreatePlane('hpbg', { width: width + 0.15, height: height + 0.1 }, scene);
  bg.material = matHpBg;
  bg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  bg.renderingGroupId = 1;

  // Foreground bar
  const bar = BABYLON.MeshBuilder.CreatePlane('hpbar', { width, height }, scene);
  const barMat = mkMat('hpBarMat',
    ship.team === 0 ? C3(0.2, 0.6, 1) : C3(1, 0.3, 0.2),
    ship.team === 0 ? C3(0.1, 0.3, 0.5) : C3(0.5, 0.15, 0.1)
  );
  bar.material = barMat;
  bar.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  bar.renderingGroupId = 1;

  return { bg, bar, width };
}

function updateHealthBar(ship) {
  if (!ship.alive) return;
  const hpInfo = ship.hpBar;
  const yOff = ship.isFlagship ? 3 : 1.8;
  const pos = ship.mesh.position;

  hpInfo.bg.position.set(pos.x, pos.y + yOff, pos.z);
  const pct = Math.max(0, ship.hp / ship.maxHp);
  hpInfo.bar.scaling.x = pct;
  hpInfo.bar.position.set(
    pos.x - (1 - pct) * hpInfo.width * 0.5,
    pos.y + yOff,
    pos.z
  );
  // Color shift: green → yellow → red
  const barMat = hpInfo.bar.material;
  if (pct > 0.5) {
    barMat.diffuseColor = ship.team === 0 ? C3(0.2, 0.6, 1) : C3(1, 0.3, 0.2);
  } else if (pct > 0.25) {
    barMat.diffuseColor = C3(1, 0.8, 0.2);
    barMat.emissiveColor = C3(0.4, 0.3, 0.05);
  } else {
    barMat.diffuseColor = C3(1, 0.15, 0.1);
    barMat.emissiveColor = C3(0.5, 0.05, 0.02);
  }
}

// ┌──────────────────────────────┐
// │  FLEET CREATION              │
// └──────────────────────────────┘
const ships = [];
const projectiles = [];
const explosionParticles = [];
let gameOver = false;
let simTime = 0;

function createFleet(team) {
  const baseX = team === 0 ? -40 : 40;
  const facing = team === 0 ? 0 : Math.PI;

  for (let i = 0; i < 10; i++) {
    const isFlagship = (i === 0);

    // Formation: flagship at center, escorts in a loose sphere around it
    let px, py, pz;
    if (isFlagship) {
      px = baseX;
      py = 0;
      pz = 0;
    } else {
      const angle = ((i - 1) / 9) * TAU;
      const spreadXZ = 12 + rr(-3, 3);
      const spreadY = rr(-6, 6);
      px = baseX + Math.cos(angle) * spreadXZ * 0.3 + rr(-2, 2);
      py = spreadY;
      pz = Math.sin(angle) * spreadXZ + rr(-2, 2);
    }

    const mesh = buildShip(team, isFlagship);
    mesh.position.set(px, py, pz);
    mesh.rotation.y = facing;

    const hp = isFlagship ? 300 : 100;
    const ship = {
      mesh,
      team,
      isFlagship,
      hp,
      maxHp: hp,
      alive: true,
      fireTimer: rr(0, 2), // Stagger initial shots
      fireCooldown: 3.0,
      // Movement AI
      vel: V3(0, 0, 0),
      targetPos: null,
      evadeTimer: 0,
      // Health bar
      hpBar: null,
    };

    ship.hpBar = createHealthBar(ship);
    ships.push(ship);
  }
}

createFleet(0); // Blue
createFleet(1); // Red

// ┌──────────────────────────────┐
// │  AI & MOVEMENT               │
// └──────────────────────────────┘
function findNearestEnemy(ship) {
  let best = null, bestDist = Infinity;
  for (const other of ships) {
    if (!other.alive || other.team === ship.team) continue;
    const d = BABYLON.Vector3.Distance(ship.mesh.position, other.mesh.position);
    if (d < bestDist) { bestDist = d; best = other; }
  }
  return { target: best, dist: bestDist };
}

function updateShipAI(ship, dt) {
  if (!ship.alive) return;

  const { target, dist } = findNearestEnemy(ship);
  if (!target) return;

  const pos = ship.mesh.position;
  const tpos = target.mesh.position;

  // ── Choose target position: approach enemy but maintain some distance ──
  const idealDist = ship.isFlagship ? 30 : 20;
  const dir = tpos.subtract(pos).normalize();

  // Approach or maintain distance
  let desiredPos;
  if (dist > idealDist + 5) {
    desiredPos = tpos.subtract(dir.scale(idealDist));
  } else if (dist < idealDist - 5) {
    // Too close — back off
    desiredPos = pos.subtract(dir.scale(5));
  } else {
    // Strafe around target
    const right = BABYLON.Vector3.Cross(dir, V3(0, 1, 0)).normalize();
    const up = BABYLON.Vector3.Cross(right, dir).normalize();
    ship.evadeTimer += dt;
    const strafeAngle = ship.evadeTimer * (ship.isFlagship ? 0.3 : 0.5 + Math.sin(ship.mesh.position.x) * 0.2);
    desiredPos = pos.add(right.scale(Math.sin(strafeAngle) * 8))
                     .add(up.scale(Math.cos(strafeAngle * 0.7) * 4));
  }

  // Acceleration toward desired position
  const toTarget = desiredPos.subtract(pos);
  const accel = toTarget.normalize().scale(ship.isFlagship ? 6 : 10);

  // Update velocity with damping
  ship.vel.addInPlace(accel.scale(dt));
  ship.vel.scaleInPlace(0.96); // Drag

  // Clamp speed
  const maxSpeed = ship.isFlagship ? 8 : 14;
  if (ship.vel.length() > maxSpeed) {
    ship.vel.normalize().scaleInPlace(maxSpeed);
  }

  // Apply velocity
  pos.addInPlace(ship.vel.scale(dt));

  // ── Face toward enemy (smooth rotation) ──
  const lookDir = tpos.subtract(pos);
  if (lookDir.length() > 0.1) {
    const targetYaw = Math.atan2(lookDir.x, lookDir.z);
    const targetPitch = -Math.asin(lookDir.y / lookDir.length());

    // Smooth rotation
    let yawDiff = targetYaw - ship.mesh.rotation.y;
    while (yawDiff > Math.PI) yawDiff -= TAU;
    while (yawDiff < -Math.PI) yawDiff += TAU;
    ship.mesh.rotation.y += yawDiff * 2 * dt;

    let pitchDiff = targetPitch - ship.mesh.rotation.x;
    ship.mesh.rotation.x += pitchDiff * 1.5 * dt;

    // Bank into turns
    ship.mesh.rotation.z = -yawDiff * 0.3;
  }
}

// ┌──────────────────────────────┐
// │  WEAPONS & PROJECTILES       │
// └──────────────────────────────┘
function fireProjectile(ship, offset) {
  const { target } = findNearestEnemy(ship);
  if (!target) return;

  const fwd = new BABYLON.Vector3(
    Math.sin(ship.mesh.rotation.y),
    -Math.sin(ship.mesh.rotation.x),
    Math.cos(ship.mesh.rotation.y)
  ).normalize();

  const right = BABYLON.Vector3.Cross(fwd, V3(0, 1, 0)).normalize();

  const spawnPos = ship.mesh.position.add(fwd.scale(ship.isFlagship ? 4.5 : 2.5))
                                      .add(right.scale(offset));

  // Lead the target
  const dist = BABYLON.Vector3.Distance(spawnPos, target.mesh.position);
  const projSpeed = 50;
  const timeToHit = dist / projSpeed;
  const predictedPos = target.mesh.position.add(target.vel.scale(timeToHit * 0.6));

  const direction = predictedPos.subtract(spawnPos).normalize();

  // Projectile mesh — elongated glowing sphere
  const proj = BABYLON.MeshBuilder.CreateCylinder('proj', {
    diameter: 0.25, height: 1.2, tessellation: 6
  }, scene);
  proj.position = spawnPos.clone();
  proj.material = ship.team === 0 ? matBlueProj : matRedProj;

  // Orient along direction
  const up = V3(0, 1, 0);
  const m = BABYLON.Matrix.LookAtLH(BABYLON.Vector3.Zero(), direction, up);
  const q = BABYLON.Quaternion.FromRotationMatrix(m);
  proj.rotationQuaternion = q;
  // Rotate 90 degrees to align cylinder length with flight direction
  proj.rotate(BABYLON.Axis.X, Math.PI / 2, BABYLON.Space.LOCAL);

  // Trail particles — we use a simple trail of small spheres
  const trail = [];
  for (let i = 0; i < 6; i++) {
    const t = BABYLON.MeshBuilder.CreateSphere('trail', { diameter: 0.15 - i * 0.02, segments: 4 }, scene);
    const tMat = mkMat('trailMat',
      BABYLON.Color3.Black(),
      ship.team === 0 ? C3(0.2 + i * 0.03, 0.4 + i * 0.03, 0.8 - i * 0.05) : C3(0.8 - i * 0.05, 0.2 + i * 0.03, 0.1),
      BABYLON.Color3.Black(),
      0.7 - i * 0.1
    );
    t.material = tMat;
    t.position = spawnPos.clone();
    trail.push(t);
  }

  // Projectile point light
  const pLight = new BABYLON.PointLight('pL', spawnPos.clone(), scene);
  pLight.intensity = 0.5;
  pLight.range = 6;
  pLight.diffuse = ship.team === 0 ? C3(0.3, 0.5, 1) : C3(1, 0.3, 0.15);

  projectiles.push({
    mesh: proj,
    trail,
    light: pLight,
    vel: direction.scale(projSpeed),
    team: ship.team,
    damage: ship.isFlagship ? 25 : 20,
    life: 4,
    prevPositions: [],
  });
}

function updateWeapons(ship, dt) {
  if (!ship.alive) return;
  ship.fireTimer -= dt;
  if (ship.fireTimer <= 0) {
    ship.fireTimer = ship.fireCooldown;
    if (ship.isFlagship) {
      fireProjectile(ship, -1.0);
      fireProjectile(ship, 1.0);
    } else {
      fireProjectile(ship, 0);
    }
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt;
    if (p.life <= 0) {
      disposeProjectile(p);
      projectiles.splice(i, 1);
      continue;
    }

    // Store position history for trail
    p.prevPositions.unshift(p.mesh.position.clone());
    if (p.prevPositions.length > 6) p.prevPositions.pop();

    // Move
    p.mesh.position.addInPlace(p.vel.scale(dt));
    p.light.position.copyFrom(p.mesh.position);

    // Update trail positions
    for (let t = 0; t < p.trail.length; t++) {
      if (t < p.prevPositions.length) {
        p.trail[t].position.copyFrom(p.prevPositions[t]);
      } else {
        p.trail[t].position.copyFrom(p.mesh.position);
      }
    }

    // Hit detection
    for (const ship of ships) {
      if (!ship.alive || ship.team === p.team) continue;
      const hitDist = ship.isFlagship ? 3.5 : 2.0;
      if (BABYLON.Vector3.Distance(p.mesh.position, ship.mesh.position) < hitDist) {
        ship.hp -= p.damage;
        // Hit flash
        createHitFlash(p.mesh.position.clone(), p.team);
        if (ship.hp <= 0) {
          destroyShip(ship);
        }
        disposeProjectile(p);
        projectiles.splice(i, 1);
        break;
      }
    }
  }
}

function disposeProjectile(p) {
  p.mesh.dispose();
  p.trail.forEach(t => t.dispose());
  p.light.dispose();
}

function createHitFlash(pos, team) {
  const flash = BABYLON.MeshBuilder.CreateSphere('flash', { diameter: 1.5, segments: 5 }, scene);
  flash.position = pos;
  flash.material = mkMat('flashMat', BABYLON.Color3.Black(),
    team === 0 ? C3(0.3, 0.6, 1.0) : C3(1, 0.4, 0.2));
  let t = 0;
  const obs = scene.onBeforeRenderObservable.add(() => {
    t += 0.02;
    flash.scaling.setAll(1 + t * 3);
    flash.material.alpha = 1 - t * 2;
    if (t > 0.5) { flash.dispose(); scene.onBeforeRenderObservable.remove(obs); }
  });
}

// ┌──────────────────────────────┐
// │  EXPLOSION SYSTEM            │
// └──────────────────────────────┘
function destroyShip(ship) {
  if (!ship.alive) return;
  ship.alive = false;

  const pos = ship.mesh.position.clone();
  const radius = ship.isFlagship ? 6 : 3;

  // Hide ship mesh and health bar
  ship.mesh.setEnabled(false);
  ship.hpBar.bg.dispose();
  ship.hpBar.bar.dispose();

  // ── SPECTACULAR EXPLOSION ──

  // 1. Central fireball — expanding bright sphere
  const fireball = BABYLON.MeshBuilder.CreateSphere('fb', { diameter: 1, segments: 8 }, scene);
  fireball.position = pos.clone();
  const fbMat = mkMat('fbm', BABYLON.Color3.Black(), C3(1, 0.8, 0.3));
  fireball.material = fbMat;

  // Fireball light
  const fbLight = new BABYLON.PointLight('fbL', pos.clone(), scene);
  fbLight.intensity = 3;
  fbLight.range = 40;
  fbLight.diffuse = C3(1, 0.7, 0.3);

  // 2. Shockwave ring — flat torus expanding outward
  const shockwave = BABYLON.MeshBuilder.CreateTorus('sw', {
    diameter: 1, thickness: 0.3, tessellation: 24
  }, scene);
  shockwave.position = pos.clone();
  const swMat = mkMat('swm', BABYLON.Color3.Black(), C3(1, 0.9, 0.6), BABYLON.Color3.Black(), 0.8);
  shockwave.material = swMat;

  // 3. Fire particles — many small spheres flying outward
  const fireCount = ship.isFlagship ? 60 : 30;
  const particles = [];
  for (let j = 0; j < fireCount; j++) {
    const size = rr(0.15, ship.isFlagship ? 0.6 : 0.4);
    const p = BABYLON.MeshBuilder.CreateSphere('fp', { diameter: size, segments: 4 }, scene);
    p.position = pos.clone();

    const isSpark = j < fireCount * 0.3;
    const pMat = mkMat('fpm', BABYLON.Color3.Black(),
      isSpark ? C3(1, rr(0.8, 1), rr(0.4, 0.8)) : C3(rr(0.8, 1), rr(0.3, 0.6), rr(0, 0.2)));
    p.material = pMat;

    const dir = V3(rr(-1, 1), rr(-1, 1), rr(-1, 1)).normalize();
    const speed = rr(8, ship.isFlagship ? 30 : 20);
    particles.push({
      mesh: p,
      vel: dir.scale(speed),
      life: rr(0.5, 1.8),
      maxLife: 0,
      drag: rr(0.92, 0.97),
    });
    particles[particles.length - 1].maxLife = particles[particles.length - 1].life;
  }

  // 4. Debris — larger angular chunks
  const debrisCount = ship.isFlagship ? 12 : 6;
  for (let j = 0; j < debrisCount; j++) {
    const d = BABYLON.MeshBuilder.CreateBox('debris', {
      width: rr(0.3, 1), height: rr(0.2, 0.6), depth: rr(0.3, 0.8)
    }, scene);
    d.position = pos.clone();
    d.material = ship.team === 0 ? matBlueHull : matRedHull;

    const dir = V3(rr(-1, 1), rr(-1, 1), rr(-1, 1)).normalize();
    const speed = rr(5, 15);
    particles.push({
      mesh: d,
      vel: dir.scale(speed),
      life: rr(1.5, 3.5),
      maxLife: 0,
      drag: 0.985,
      spin: V3(rr(-3, 3), rr(-3, 3), rr(-3, 3)),
    });
    particles[particles.length - 1].maxLife = particles[particles.length - 1].life;
  }

  // 5. Secondary explosions (delayed smaller blasts)
  for (let k = 1; k <= 3; k++) {
    setTimeout(() => {
      const offset = V3(rr(-3, 3), rr(-2, 2), rr(-3, 3));
      const secFb = BABYLON.MeshBuilder.CreateSphere('sfb', { diameter: 0.5, segments: 5 }, scene);
      secFb.position = pos.add(offset);
      secFb.material = mkMat('sfbm', BABYLON.Color3.Black(), C3(1, 0.6, 0.2));

      const secLight = new BABYLON.PointLight('sL', secFb.position.clone(), scene);
      secLight.intensity = 1.5;
      secLight.range = 15;
      secLight.diffuse = C3(1, 0.6, 0.2);

      let st = 0;
      const obs2 = scene.onBeforeRenderObservable.add(() => {
        st += 0.025;
        secFb.scaling.setAll(1 + st * 5);
        secFb.material.alpha = 1 - st * 2;
        secLight.intensity = 1.5 * (1 - st * 2);
        if (st > 0.5) {
          secFb.dispose();
          secLight.dispose();
          scene.onBeforeRenderObservable.remove(obs2);
        }
      });
    }, k * 200);
  }

  // ── Animate explosion elements ──
  let t = 0;
  const obs = scene.onBeforeRenderObservable.add(() => {
    const eDt = engine.getDeltaTime() / 1000;
    t += eDt;

    // Fireball expansion
    const fbScale = 1 + t * (ship.isFlagship ? 18 : 12);
    fireball.scaling.setAll(fbScale);
    fbMat.alpha = Math.max(0, 1 - t * 0.8);
    fbMat.emissiveColor = C3(
      Math.max(0, 1 - t * 0.5),
      Math.max(0, 0.6 - t * 0.6),
      Math.max(0, 0.2 - t * 0.5)
    );
    fbLight.intensity = Math.max(0, 3 - t * 2);

    // Shockwave
    const swScale = 1 + t * (ship.isFlagship ? 35 : 22);
    shockwave.scaling.set(swScale, 1, swScale);
    swMat.alpha = Math.max(0, 0.8 - t * 1.2);

    // Particles
    for (let j = particles.length - 1; j >= 0; j--) {
      const pp = particles[j];
      pp.life -= eDt;
      if (pp.life <= 0) {
        pp.mesh.dispose();
        particles.splice(j, 1);
        continue;
      }
      pp.mesh.position.addInPlace(pp.vel.scale(eDt));
      pp.vel.scaleInPlace(pp.drag);
      const fade = pp.life / pp.maxLife;
      pp.mesh.scaling.setAll(fade);
      if (pp.spin) {
        pp.mesh.rotation.x += pp.spin.x * eDt;
        pp.mesh.rotation.y += pp.spin.y * eDt;
        pp.mesh.rotation.z += pp.spin.z * eDt;
      }
    }

    // Cleanup when done
    if (t > 4 && particles.length === 0) {
      fireball.dispose();
      shockwave.dispose();
      fbLight.dispose();
      ship.mesh.dispose();
      scene.onBeforeRenderObservable.remove(obs);
    }
  });

  // ── CHAIN REACTION: check nearby ships ──
  setTimeout(() => {
    const chainRadius = ship.isFlagship ? 8 : 5;
    for (const other of ships) {
      if (!other.alive) continue;
      const d = BABYLON.Vector3.Distance(pos, other.mesh.position);
      if (d < chainRadius) {
        other.hp -= ship.isFlagship ? 80 : 40;
        if (other.hp <= 0) {
          destroyShip(other);
        }
      }
    }
  }, 150);

  checkVictory();
}

// ┌──────────────────────────────┐
// │  GAME STATE                  │
// └──────────────────────────────┘
function checkVictory() {
  if (gameOver) return;
  // Slight delay to allow chain reactions
  setTimeout(() => {
    const blueAlive = ships.filter(s => s.team === 0 && s.alive).length;
    const redAlive = ships.filter(s => s.team === 1 && s.alive).length;

    if (blueAlive === 0 || redAlive === 0) {
      gameOver = true;
      const vEl = document.getElementById('victory');
      const tEl = document.getElementById('v-title');
      const sEl = document.getElementById('v-sub');

      if (blueAlive === 0 && redAlive === 0) {
        tEl.textContent = 'MUTUAL DESTRUCTION';
        tEl.style.color = '#ffcc44';
        sEl.textContent = 'Both fleets annihilated';
      } else if (redAlive === 0) {
        tEl.textContent = 'BLUE FLEET VICTORY';
        tEl.style.color = '#38a8ff';
        sEl.textContent = 'Red fleet destroyed';
      } else {
        tEl.textContent = 'RED FLEET VICTORY';
        tEl.style.color = '#ff4848';
        sEl.textContent = 'Blue fleet destroyed';
      }
      setTimeout(() => vEl.classList.add('show'), 2000);
    }
  }, 500);
}

// ┌──────────────────────────────┐
// │  HUD UPDATE                  │
// └──────────────────────────────┘
let hudTimer = 0;
function updateHUD() {
  const ba = ships.filter(s => s.team === 0 && s.alive);
  const ra = ships.filter(s => s.team === 1 && s.alive);

  document.getElementById('b-ships').textContent = ba.length;
  document.getElementById('r-ships').textContent = ra.length;
  document.getElementById('b-flag').textContent = ba.some(s => s.isFlagship) ? 'ONLINE' : 'LOST';
  document.getElementById('r-flag').textContent = ra.some(s => s.isFlagship) ? 'ONLINE' : 'LOST';
  document.getElementById('b-bar').style.width = (ba.length / 10 * 100) + '%';
  document.getElementById('r-bar').style.width = (ra.length / 10 * 100) + '%';

  if (!ba.some(s => s.isFlagship)) {
    document.getElementById('b-flag').style.color = '#ff4848';
  }
  if (!ra.some(s => s.isFlagship)) {
    document.getElementById('r-flag').style.color = '#ff4848';
  }
}

// ┌──────────────────────────────┐
// │  MAIN LOOP                   │
// └──────────────────────────────┘
scene.registerBeforeRender(() => {
  const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
  simTime += dt;

  for (const ship of ships) {
    updateShipAI(ship, dt);
    updateWeapons(ship, dt);
    updateHealthBar(ship);
  }

  updateProjectiles(dt);

  hudTimer += dt;
  if (hudTimer > 0.25) { hudTimer = 0; updateHUD(); }
});

engine.runRenderLoop(() => scene.render());
window.addEventListener('resize', () => engine.resize());
</script>
