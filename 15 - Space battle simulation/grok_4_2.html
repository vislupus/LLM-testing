<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID CLASH • Space Battle</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin:0; overflow:hidden; background:#000; font-family:'Press Start 2P', sans-serif; }
        canvas { display:block; }
        #overlay {
            position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none;
            color:#0ff; text-align:center; text-shadow:0 0 15px #0ff;
        }
        #title { font-size:42px; margin-top:30px; letter-spacing:6px; }
        #status {
            position:absolute; top:20px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.6); padding:8px 24px; border-radius:8px; font-size:14px;
        }
        #winner {
            position:absolute; inset:0; background:rgba(0,0,0,0.92); display:none;
            align-items:center; justify-content:center; flex-direction:column; color:#0f0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="overlay">
        <div id="title">VOID CLASH</div>
    </div>
    <div id="status">BLUE FLEET vs RED FLEET • DRAG TO ORBIT</div>
    
    <div id="winner">
        <div id="winText" style="font-size:62px;margin-bottom:30px;"></div>
        <button onclick="location.reload()" style="padding:16px 48px;font-size:18px;background:#0ff;color:#000;border:none;border-radius:8px;cursor:pointer;">
            NEW BATTLE
        </button>
    </div>

    <script>
        // ================================================
        // VOID CLASH - Epic 3D Space Battle
        // Single HTML file • Babylon.js CDN
        // 10 vs 10 ships • Chain explosions • Health bars
        // Fully playable cinematic battle
        // ================================================

        const canvas = document.getElementById("canvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let scene, camera;
        let fleetBlue = [], fleetRed = [];
        let projectiles = [];
        let explosions = [];
        let gameOver = false;
        
        function createScene() {
            scene = new BABYLON.Scene(engine);
            
            // Camera
            camera = new BABYLON.ArcRotateCamera("cam", 2.8, 1.3, 520, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 180;
            camera.upperRadiusLimit = 920;
            camera.lowerBetaLimit = 0.4;
            camera.upperBetaLimit = 1.6;
            
            // Lights
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
            hemi.intensity = 0.6;
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1,-0.6,-0.8), scene);
            sun.intensity = 1.8;
            
            // Background nebula + stars
            createBackground();
            
            // Create fleets
            createFleet(-220, 0, 0, 0); // Blue fleet (left)
            createFleet( 220, 0, 0, 1); // Red fleet (right)
            
            // Initial projectiles and explosions arrays
            projectiles = [];
            explosions = [];
            
            return scene;
        }

        function createBackground() {
            // Nebula sphere
            const nebula = BABYLON.MeshBuilder.CreateSphere("nebula", {diameter: 2400}, scene);
            const nebMat = new BABYLON.StandardMaterial("nebMat", scene);
            nebMat.backFaceCulling = false;
            nebMat.diffuseColor = new BABYLON.Color3(0.05, 0.02, 0.15);
            nebMat.emissiveColor = new BABYLON.Color3(0.12, 0.05, 0.35);
            nebula.material = nebMat;
            
            // Stars
            for (let i = 0; i < 1200; i++) {
                const star = BABYLON.MeshBuilder.CreateSphere("star", {diameter: Math.random()*1.8 + 0.6}, scene);
                const angle = Math.random() * Math.PI * 2;
                const dist = 900 + Math.random() * 600;
                star.position.x = Math.cos(angle) * dist;
                star.position.z = Math.sin(angle) * dist * 0.6;
                star.position.y = (Math.random() - 0.5) * 380;
                star.material = new BABYLON.StandardMaterial("", scene);
                star.material.emissiveColor = new BABYLON.Color3(1,1,1);
            }
        }

        function createShip(isFlagship, team, offsetX) {
            const group = new BABYLON.TransformNode("ship", scene);
            
            // Team color
            const teamColor = team === 0 ? new BABYLON.Color3(0.2, 0.6, 1) : new BABYLON.Color3(1, 0.3, 0.2);
            
            // Hull
            const hull = BABYLON.MeshBuilder.CreateBox("hull", {
                width: isFlagship ? 22 : 11,
                height: isFlagship ? 9 : 5,
                depth: isFlagship ? 48 : 26
            }, scene);
            hull.parent = group;
            const hullMat = new BABYLON.StandardMaterial("", scene);
            hullMat.diffuseColor = teamColor;
            hull.material = hullMat;
            
            // Nose / Bridge
            const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {
                width: isFlagship ? 14 : 7,
                height: isFlagship ? 12 : 6,
                depth: 12
            }, scene);
            bridge.parent = group;
            bridge.position.z = isFlagship ? 18 : 10;
            bridge.material = hullMat;
            
            // Wings
            const wingL = BABYLON.MeshBuilder.CreateBox("wingL", {width: isFlagship ? 38 : 22, height: 2, depth: 14}, scene);
            wingL.parent = group;
            wingL.position.set(-isFlagship ? 14 : 8, 0, 4);
            wingL.material = hullMat;
            
            const wingR = wingL.clone("wingR");
            wingR.position.x *= -1;
            
            // Thrusters
            const thrustL = BABYLON.MeshBuilder.CreateCylinder("thrust", {height:6, diameter:3}, scene);
            thrustL.parent = group;
            thrustL.position.set(-8, -3, -18);
            thrustL.rotation.x = Math.PI/2;
            const thrustMat = new BABYLON.StandardMaterial("", scene);
            thrustMat.emissiveColor = new BABYLON.Color3(1, 0.4, 0.1);
            thrustL.material = thrustMat;
            
            const thrustR = thrustL.clone();
            thrustR.position.x *= -1;
            
            group.userData = {
                team: team,
                health: isFlagship ? 1200 : 420,
                maxHealth: isFlagship ? 1200 : 420,
                isFlagship: isFlagship,
                lastFire: Date.now(),
                speed: isFlagship ? 0.65 : 0.95,
                targetOffset: new BABYLON.Vector3(offsetX, 0, (Math.random()-0.5)*80)
            };
            
            // Health bar
            createHealthBar(group);
            
            return group;
        }

        function createHealthBar(ship) {
            const plane = BABYLON.MeshBuilder.CreatePlane("hp", {width: ship.userData.isFlagship ? 26 : 16, height: 2.5}, scene);
            plane.parent = ship;
            plane.position.y = ship.userData.isFlagship ? 28 : 14;
            plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            
            const texture = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(plane);
            const barBG = new BABYLON.GUI.Rectangle();
            barBG.width = "100%";
            barBG.height = "100%";
            barBG.background = "#222";
            texture.addControl(barBG);
            
            const bar = new BABYLON.GUI.Rectangle();
            bar.width = "100%";
            bar.height = "100%";
            bar.background = ship.userData.team === 0 ? "#44ccff" : "#ff4444";
            texture.addControl(bar);
            
            ship.userData.hpBar = bar;
            ship.userData.hpPlane = plane;
        }

        function createFleet(centerX, centerZ, team) {
            const fleet = team === 0 ? fleetBlue : fleetRed;
            
            // Flagship
            const flagship = createShip(true, team, 0);
            flagship.position.set(centerX, 35, centerZ);
            fleet.push(flagship);
            
            // Escorts
            for (let i = 0; i < 9; i++) {
                const escort = createShip(false, team, (i-4)*28);
                escort.position.set(
                    centerX + (i % 3 - 1) * 55,
                    25 + Math.random() * 18,
                    centerZ + (Math.floor(i/3) - 1) * 55
                );
                fleet.push(escort);
            }
        }

        function updateFleet(fleet, enemyFleet) {
            fleet.forEach(ship => {
                if (ship.userData.health <= 0) return;
                
                // Move towards formation center + slight orbit
                const center = ship.parent ? ship.parent.position : ship.position; // simple
                
                const desired = new BABYLON.Vector3(
                    ship.userData.targetOffset.x,
                    30,
                    ship.userData.targetOffset.z
                );
                
                const dir = desired.subtract(ship.position);
                dir.normalize();
                ship.position.addInPlace(dir.scale(ship.userData.speed));
                
                // Face enemy fleet center
                const enemyCenter = enemyFleet.reduce((a, s) => a.add(s.position), BABYLON.Vector3.Zero()).scale(1/enemyFleet.length);
                ship.lookAt(enemyCenter);
                
                // Fire logic
                if (Date.now() - ship.userData.lastFire > 3000) {
                    const closest = findClosestEnemy(ship, enemyFleet);
                    if (closest && BABYLON.Vector3.Distance(ship.position, closest.position) < 280) {
                        fireProjectile(ship, closest);
                        ship.userData.lastFire = Date.now();
                        
                        // Flagship fires twice
                        if (ship.userData.isFlagship) {
                            setTimeout(() => {
                                if (ship.userData.health > 0) fireProjectile(ship, closest);
                            }, 180);
                        }
                    }
                }
            });
        }

        function findClosestEnemy(ship, enemyFleet) {
            let closest = null;
            let minDist = Infinity;
            enemyFleet.forEach(e => {
                if (e.userData.health <= 0) return;
                const d = BABYLON.Vector3.Distance(ship.position, e.position);
                if (d < minDist) {
                    minDist = d;
                    closest = e;
                }
            });
            return closest;
        }

        function fireProjectile(ship, target) {
            const proj = BABYLON.MeshBuilder.CreateSphere("proj", {diameter: ship.userData.isFlagship ? 5.5 : 3.2}, scene);
            proj.position = ship.position.clone();
            proj.position.y += 12;
            
            const dir = target.position.subtract(ship.position);
            dir.normalize();
            
            proj.userData = {
                velocity: dir.scale(ship.userData.isFlagship ? 5.8 : 4.9),
                team: ship.userData.team,
                life: 180
            };
            
            const mat = new BABYLON.StandardMaterial("", scene);
            mat.emissiveColor = ship.userData.team === 0 ? new BABYLON.Color3(0.4, 0.8, 1) : new BABYLON.Color3(1, 0.3, 0.2);
            proj.material = mat;
            
            projectiles.push(proj);
        }

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.position.addInPlace(p.userData.velocity);
                p.userData.life--;
                
                if (p.userData.life <= 0) {
                    p.dispose();
                    projectiles.splice(i, 1);
                    continue;
                }
                
                // Check hits
                const enemyFleet = p.userData.team === 0 ? fleetRed : fleetBlue;
                for (let j = enemyFleet.length - 1; j >= 0; j--) {
                    const ship = enemyFleet[j];
                    if (ship.userData.health <= 0) continue;
                    
                    if (BABYLON.Vector3.Distance(p.position, ship.position) < 14) {
                        ship.userData.health -= 65;
                        updateHealthBar(ship);
                        
                        // Hit effect
                        createSmallHit(p.position);
                        
                        p.dispose();
                        projectiles.splice(i, 1);
                        
                        if (ship.userData.health <= 0) {
                            triggerExplosion(ship);
                        }
                        break;
                    }
                }
            }
        }

        function updateHealthBar(ship) {
            if (!ship.userData.hpBar) return;
            const percent = Math.max(0, ship.userData.health / ship.userData.maxHealth);
            ship.userData.hpBar.width = percent * 100 + "%";
        }

        function triggerExplosion(ship) {
            const pos = ship.position.clone();
            
            // Big explosion particles
            for (let i = 0; i < 85; i++) {
                const p = BABYLON.MeshBuilder.CreateSphere("ex", {diameter: Math.random()*6 + 3}, scene);
                p.position = pos.clone();
                const vel = new BABYLON.Vector3(
                    (Math.random()-0.5)*12,
                    (Math.random()-0.5)*12 + 4,
                    (Math.random()-0.5)*12
                );
                p.userData = { life: 45 + Math.random()*25, velocity: vel };
                const mat = new BABYLON.StandardMaterial("", scene);
                mat.emissiveColor = i < 30 ? new BABYLON.Color3(1,0.6,0.1) : new BABYLON.Color3(1,1,0.6);
                p.material = mat;
                explosions.push(p);
            }
            
            // Shockwave
            const wave = BABYLON.MeshBuilder.CreateSphere("wave", {diameter: 8}, scene);
            wave.position = pos.clone();
            const wMat = new BABYLON.StandardMaterial("", scene);
            wMat.emissiveColor = new BABYLON.Color3(0.8, 0.9, 1);
            wMat.alpha = 0.6;
            wave.material = wMat;
            wave.userData = { life: 22, scale: 8 };
            explosions.push(wave);
            
            // Remove ship
            ship.dispose();
            const fleet = ship.userData.team === 0 ? fleetBlue : fleetRed;
            const idx = fleet.indexOf(ship);
            if (idx > -1) fleet.splice(idx, 1);
            
            // Chain reaction check
            checkChainReaction(pos);
            
            // Check win condition
            checkWin();
        }

        function checkChainReaction(pos) {
            const allShips = [...fleetBlue, ...fleetRed];
            allShips.forEach(ship => {
                if (ship.userData.health <= 0) return;
                if (BABYLON.Vector3.Distance(ship.position, pos) < 42) {
                    setTimeout(() => {
                        if (ship.userData.health > 0) triggerExplosion(ship);
                    }, Math.random() * 280);
                }
            });
        }

        function createSmallHit(pos) {
            for (let i = 0; i < 12; i++) {
                const p = BABYLON.MeshBuilder.CreateSphere("hit", {diameter: 2.5}, scene);
                p.position = pos.clone();
                p.userData = { life: 18, velocity: new BABYLON.Vector3(
                    (Math.random()-0.5)*6,
                    Math.random()*5,
                    (Math.random()-0.5)*6
                )};
                explosions.push(p);
            }
        }

        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const e = explosions[i];
                e.userData.life--;
                if (e.userData.velocity) e.position.addInPlace(e.userData.velocity);
                if (e.userData.scale) {
                    e.scaling.scaleInPlace(1.18);
                }
                e.material.alpha = e.userData.life / 30;
                if (e.userData.life <= 0) {
                    e.dispose();
                    explosions.splice(i, 1);
                }
            }
        }

        function checkWin() {
            if (fleetBlue.length === 0 && !gameOver) {
                gameOver = true;
                showWinner("RED FLEET VICTORY", "#f33");
            } else if (fleetRed.length === 0 && !gameOver) {
                gameOver = true;
                showWinner("BLUE FLEET VICTORY", "#0af");
            }
        }

        function showWinner(text, color) {
            document.getElementById("winner").style.display = "flex";
            document.getElementById("winText").innerHTML = text;
            document.getElementById("winText").style.color = color;
        }

        function update() {
            if (gameOver) return;
            
            updateFleet(fleetBlue, fleetRed);
            updateFleet(fleetRed, fleetBlue);
            updateProjectiles();
            updateExplosions();
        }

        window.onload = () => {
            scene = createScene();
            
            engine.runRenderLoop(() => {
                update();
                scene.render();
            });
            
            window.addEventListener("resize", () => engine.resize());
        };
    </script>
</body>
</html>
