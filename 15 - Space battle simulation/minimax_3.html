<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Space Battle — Babylon.js</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; user-select: none; }
  #renderCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  #ui {
    position: absolute; top: 0; left: 0; right: 0; padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 10;
    background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 100%);
  }
  #title { font-size: 22px; letter-spacing: 4px; font-weight: 300; text-shadow: 0 0 10px #88f; }
  #title span { color: #f55; text-shadow: 0 0 12px #f55; }
  #scores { display: flex; gap: 24px; font-size: 14px; }
  .score { padding: 4px 12px; border-radius: 4px; background: rgba(0,0,0,0.4); }
  .red { color: #ff7060; text-shadow: 0 0 8px #f33; }
  .blue { color: #70b0ff; text-shadow: 0 0 8px #37f; }
  #help {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; opacity: 0.65; pointer-events: none; z-index: 10;
    padding: 6px 14px; background: rgba(0,0,0,0.5); border-radius: 14px;
  }
  #endScreen {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 64px; font-weight: 200; letter-spacing: 12px;
    text-shadow: 0 0 30px currentColor;
    display: none; z-index: 20; pointer-events: none;
    animation: fadeIn 1.5s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%,-50%) scale(0.5); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="ui">
  <div id="title">SPACE BATTLE</div>
  <div id="scores">
    <div class="score red">RED FLEET: <span id="redScore">10</span></div>
    <div class="score blue">BLUE FLEET: <span id="blueScore">10</span></div>
  </div>
</div>
<div id="help">LMB rotate · RMB pan · Wheel zoom</div>
<div id="endScreen"></div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function () {
  'use strict';

  // ============================================================
  // ENGINE & SCENE SETUP
  // ============================================================
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, antialias: true });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.005, 0.005, 0.02, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0028;
  scene.fogColor = new BABYLON.Color3(0.02, 0.02, 0.06);

  // ============================================================
  // CAMERA
  // ============================================================
  const camera = new BABYLON.ArcRotateCamera('cam', Math.PI / 2, Math.PI / 2.4, 95, BABYLON.Vector3.Zero(), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 25;
  camera.upperRadiusLimit = 280;
  camera.wheelDeltaPercentage = 0.01;
  camera.panningSensibility = 50;
  camera.minZ = 0.1;
  camera.maxZ = 2000;
  camera.inertia = 0.85;

  // ============================================================
  // LIGHTING
  // ============================================================
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.3, 1, 0.2), scene);
  hemi.intensity = 0.35;
  hemi.diffuse = new BABYLON.Color3(0.7, 0.7, 0.85);
  hemi.groundColor = new BABYLON.Color3(0.05, 0.05, 0.15);
  hemi.specular = new BABYLON.Color3(0.2, 0.2, 0.3);

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -0.6, -0.7), scene);
  sun.intensity = 0.6;
  sun.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
  sun.specular = new BABYLON.Color3(1, 0.95, 0.85);

  // ============================================================
  // GLOW LAYER (for emissive thrusters, projectiles, explosions)
  // ============================================================
  const glow = new BABYLON.GlowLayer('glow', scene, { mainTextureFixedSize: 512, blurKernelSize: 32 });
  glow.intensity = 1.4;

  // ============================================================
  // STARFIELD (Solid Particle System)
  // ============================================================
  function createStarfield() {
    const sps = new BABYLON.SolidParticleSystem('stars', scene, { updatable: false });
    const sphere = BABYLON.MeshBuilder.CreateSphere('s', { diameter: 0.6, segments: 4 }, scene);
    sps.addShape(sphere, 4000);
    sphere.dispose();
    const mesh = sps.buildMesh();
    const mat = new BABYLON.StandardMaterial('starmat', scene);
    mat.disableLighting = true;
    mat.emissiveColor = new BABYLON.Color3(1, 1, 1);
    mat.specularColor = new BABYLON.Color3(0, 0, 0);
    mesh.material = mat;
    mesh.isPickable = false;
    sps.initParticles = () => {
      const palette = [
        new BABYLON.Color4(1, 1, 1, 1),
        new BABYLON.Color4(0.8, 0.85, 1, 1),
        new BABYLON.Color4(1, 0.9, 0.7, 1),
        new BABYLON.Color4(1, 0.7, 0.7, 1),
        new BABYLON.Color4(0.7, 0.8, 1, 1),
        new BABYLON.Color4(0.6, 1, 0.95, 1)
      ];
      for (let p of sps.particles) {
        const r = 350 + Math.random() * 250;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        p.position.x = r * Math.sin(phi) * Math.cos(theta);
        p.position.y = r * Math.sin(phi) * Math.sin(theta);
        p.position.z = r * Math.cos(phi);
        const s = 0.4 + Math.random() * 2.2;
        p.scaling.setAll(s);
        p.color = palette[Math.floor(Math.random() * palette.length)];
      }
    };
    sps.initParticles();
    sps.setParticles();
    return sps;
  }
  createStarfield();

  // ============================================================
  // NEBULA (large transparent sprite-like clouds)
  // ============================================================
  function createNebulaClouds() {
    const nebulaColors = [
      new BABYLON.Color4(0.4, 0.1, 0.6, 0.15),
      new BABYLON.Color4(0.1, 0.2, 0.6, 0.12),
      new BABYLON.Color4(0.6, 0.2, 0.3, 0.1),
      new BABYLON.Color4(0.1, 0.4, 0.5, 0.13),
      new BABYLON.Color4(0.5, 0.3, 0.1, 0.1)
    ];
    for (let i = 0; i < 8; i++) {
      const cloud = BABYLON.MeshBuilder.CreateSphere('neb' + i, { diameter: 80 + Math.random() * 60 }, scene);
      cloud.position.x = (Math.random() - 0.5) * 400;
      cloud.position.y = (Math.random() - 0.5) * 200;
      cloud.position.z = (Math.random() - 0.5) * 400 - 100;
      const mat = new BABYLON.StandardMaterial('nebm' + i, scene);
      const c = nebulaColors[Math.floor(Math.random() * nebulaColors.length)];
      mat.emissiveColor = new BABYLON.Color3(c.r, c.g, c.b);
      mat.diffuseColor = new BABYLON.Color3(0, 0, 0);
      mat.specularColor = new BABYLON.Color3(0, 0, 0);
      mat.alpha = c.a;
      mat.disableLighting = true;
      mat.backFaceCulling = false;
      cloud.material = mat;
      cloud.isPickable = false;
    }
  }
  createNebulaClouds();

  // ============================================================
  // FLARE TEXTURE (used by particles & health bars)
  // ============================================================
  function makeRadialTexture(name, color1, color2, size) {
    size = size || 128;
    const tex = new BABYLON.DynamicTexture(name, { width: size, height: size }, scene, false);
    const ctx = tex.getContext();
    const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, color1);
    grad.addColorStop(0.4, color2);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    tex.hasAlpha = true;
    tex.update();
    return tex;
  }

  const flareTex = makeRadialTexture('flare', 'rgba(255,255,255,1)', 'rgba(255,200,100,0.5)');
  const blueFlareTex = makeRadialTexture('blueFlare', 'rgba(180,220,255,1)', 'rgba(80,140,255,0.5)');
  const redFlareTex = makeRadialTexture('redFlare', 'rgba(255,220,180,1)', 'rgba(255,100,60,0.5)');
  const smokeTex = makeRadialTexture('smoke', 'rgba(120,120,120,0.9)', 'rgba(40,40,40,0.4)');

  // ============================================================
  // MATERIAL FACTORIES
  // ============================================================
  function shipMaterial(name, baseColor, emissiveColor) {
    const m = new BABYLON.StandardMaterial(name, scene);
    m.diffuseColor = baseColor;
    m.emissiveColor = emissiveColor;
    m.specularColor = new BABYLON.Color3(0.4, 0.4, 0.5);
    m.specularPower = 64;
    return m;
  }

  function panelMaterial(name, baseColor, accentColor) {
    const m = new BABYLON.StandardMaterial(name, scene);
    m.diffuseColor = baseColor;
    m.emissiveColor = baseColor.scale(0.3);
    m.specularColor = new BABYLON.Color3(0.5, 0.5, 0.6);
    m.specularPower = 32;
    return m;
  }

  // ============================================================
  // SHIP CREATION
  // ============================================================
  let shipIdCounter = 0;

  function createShip(fleetColor, isFlagship) {
    const id = ++shipIdCounter;
    const root = new BABYLON.TransformNode('ship_' + id, scene);

    let baseColor, accentColor, emissiveColor, engineColor, glowColor, bodyHeight, bodyWidth;

    if (fleetColor === 'red') {
      baseColor = new BABYLON.Color3(0.35, 0.08, 0.08);
      accentColor = new BABYLON.Color3(0.7, 0.15, 0.1);
      emissiveColor = new BABYLON.Color3(0.5, 0.05, 0.05);
      engineColor = new BABYLON.Color3(1, 0.4, 0.15);
      glowColor = new BABYLON.Color3(1, 0.5, 0.2);
    } else {
      baseColor = new BABYLON.Color3(0.05, 0.1, 0.4);
      accentColor = new BABYLON.Color3(0.1, 0.3, 0.75);
      emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.5);
      engineColor = new BABYLON.Color3(0.2, 0.6, 1);
      glowColor = new BABYLON.Color3(0.3, 0.7, 1);
    }

    if (isFlagship) {
      bodyHeight = 14;
      bodyWidth = 3.2;
    } else {
      bodyHeight = 5.5;
      bodyWidth = 1.4;
    }

    const bodyMat = shipMaterial('shipBody_' + id, baseColor, emissiveColor);
    const accentMat = panelMaterial('shipAccent_' + id, accentColor, accentColor);
    const engineMat = new BABYLON.StandardMaterial('shipEng_' + id, scene);
    engineMat.emissiveColor = engineColor;
    engineMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    engineMat.specularColor = new BABYLON.Color3(0, 0, 0);
    engineMat.disableLighting = true;

    // ===== Main fuselage (pointing along +Z by default; we'll re-orient as needed) =====
    const fuselage = BABYLON.MeshBuilder.CreateCylinder('fus_' + id, {
      height: bodyHeight, diameterTop: bodyWidth * 0.7, diameterBottom: bodyWidth, tessellation: 12
    }, scene);
    fuselage.rotation.x = Math.PI / 2;
    fuselage.parent = root;
    fuselage.material = bodyMat;

    // ===== Nose cone =====
    const nose = BABYLON.MeshBuilder.CreateCylinder('nose_' + id, {
      height: bodyWidth * 1.2, diameterTop: 0.1, diameterBottom: bodyWidth * 0.7, tessellation: 12
    }, scene);
    nose.rotation.x = Math.PI / 2;
    nose.position.z = bodyHeight / 2 + (bodyWidth * 0.6);
    nose.parent = root;
    nose.material = bodyMat;

    // ===== Wings =====
    if (isFlagship) {
      // Bigger, swept wings for flagship
      for (let side = -1; side <= 1; side += 2) {
        const wing = BABYLON.MeshBuilder.CreateBox('wing_' + id + '_' + side, {
          width: bodyWidth * 2.5, height: 0.35, depth: bodyHeight * 0.5
        }, scene);
        wing.position.set(side * (bodyWidth * 1.3), 0, -bodyHeight * 0.05);
        wing.rotation.y = side * 0.15;
        wing.parent = root;
        wing.material = accentMat;

        // Wing tip
        const tip = BABYLON.MeshBuilder.CreateCylinder('tip_' + id + '_' + side, {
          height: bodyHeight * 0.5, diameter: 0.6, tessellation: 8
        }, scene);
        tip.rotation.x = Math.PI / 2;
        tip.position.set(side * (bodyWidth * 2.5), 0, -bodyHeight * 0.05);
        tip.parent = root;
        tip.material = accentMat;
      }

      // Side engine nacelles
      for (let side = -1; side <= 1; side += 2) {
        const nacelle = BABYLON.MeshBuilder.CreateCylinder('nac_' + id + '_' + side, {
          height: bodyHeight * 0.8, diameter: bodyWidth * 0.9, tessellation: 12
        }, scene);
        nacelle.rotation.x = Math.PI / 2;
        nacelle.position.set(side * (bodyWidth * 1.6), 0, -bodyHeight * 0.3);
        nacelle.parent = root;
        nacelle.material = bodyMat;

        // Nacelle engine glow
        const nacEng = BABYLON.MeshBuilder.CreateSphere('nacEng_' + id + '_' + side, { diameter: bodyWidth * 0.7 }, scene);
        nacEng.position.set(side * (bodyWidth * 1.6), 0, -bodyHeight * 0.7);
        nacEng.parent = root;
        nacEng.material = engineMat;
      }

      // Bridge / command tower
      const bridge = BABYLON.MeshBuilder.CreateBox('bridge_' + id, {
        width: bodyWidth * 0.8, height: bodyWidth * 0.6, depth: bodyHeight * 0.25
      }, scene);
      bridge.position.set(0, bodyWidth * 0.5, bodyHeight * 0.1);
      bridge.parent = root;
      bridge.material = accentMat;

      const bridgeTop = BABYLON.MeshBuilder.CreateCylinder('bridgeT_' + id, {
        height: bodyWidth * 0.4, diameter: bodyWidth * 0.5, tessellation: 8
      }, scene);
      bridgeTop.position.set(0, bodyWidth * 0.85, bodyHeight * 0.1);
      bridgeTop.parent = root;
      bridgeTop.material = accentMat;

      // Top antenna
      const antenna = BABYLON.MeshBuilder.CreateCylinder('ant_' + id, {
        height: bodyWidth * 1.2, diameter: 0.15, tessellation: 6
      }, scene);
      antenna.position.set(0, bodyWidth * 1.4, bodyHeight * 0.1);
      antenna.parent = root;
      antenna.material = accentMat;

      // Side weapon pods
      for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < 3; i++) {
          const pod = BABYLON.MeshBuilder.CreateBox('pod_' + id + '_' + side + '_' + i, {
            width: bodyWidth * 0.4, height: bodyWidth * 0.3, depth: bodyWidth * 0.6
          }, scene);
          pod.position.set(side * (bodyWidth * 0.9), -bodyWidth * 0.2, bodyHeight * (0.25 - i * 0.3));
          pod.parent = root;
          pod.material = accentMat;
        }
      }

    } else {
      // Escort wings - sleek fighter style
      for (let side = -1; side <= 1; side += 2) {
        const wing = BABYLON.MeshBuilder.CreateBox('wing_' + id + '_' + side, {
          width: bodyWidth * 2.2, height: 0.18, depth: bodyHeight * 0.55
        }, scene);
        wing.position.set(side * (bodyWidth * 1.0), 0, -bodyHeight * 0.05);
        wing.parent = root;
        wing.material = accentMat;
      }

      // Cockpit
      const cockpit = BABYLON.MeshBuilder.CreateSphere('cockpit_' + id, { diameter: bodyWidth * 0.55, segments: 8 }, scene);
      cockpit.position.set(0, bodyWidth * 0.35, bodyHeight * 0.2);
      cockpit.scaling.y = 0.6;
      cockpit.parent = root;
      cockpit.material = accentMat;

      // Tail fin
      const tail = BABYLON.MeshBuilder.CreateBox('tail_' + id, {
        width: 0.1, height: bodyWidth * 0.6, depth: bodyWidth * 0.5
      }, scene);
      tail.position.set(0, bodyWidth * 0.45, -bodyHeight * 0.3);
      tail.parent = root;
      tail.material = accentMat;
    }

    // ===== Main engine exhaust =====
    const engine = BABYLON.MeshBuilder.CreateSphere('engine_' + id, {
      diameter: isFlagship ? bodyWidth * 0.9 : bodyWidth * 0.55, segments: 12
    }, scene);
    engine.position.z = -bodyHeight / 2 - bodyWidth * 0.2;
    engine.parent = root;
    engine.material = engineMat;

    // Engine glow halo (slightly larger, semi-transparent)
    const halo = BABYLON.MeshBuilder.CreateSphere('halo_' + id, {
      diameter: isFlagship ? bodyWidth * 1.5 : bodyWidth * 0.9, segments: 10
    }, scene);
    halo.position.z = -bodyHeight / 2 - bodyWidth * 0.25;
    halo.parent = root;
    const haloMat = new BABYLON.StandardMaterial('haloM_' + id, scene);
    haloMat.emissiveColor = engineColor;
    haloMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    haloMat.specularColor = new BABYLON.Color3(0, 0, 0);
    haloMat.alpha = 0.5;
    haloMat.disableLighting = true;
    halo.material = haloMat;

    // ===== Health bar =====
    const hpPlane = BABYLON.MeshBuilder.CreatePlane('hp_' + id, { width: isFlagship ? 8 : 4, height: 0.9 }, scene);
    hpPlane.position.y = isFlagship ? bodyWidth * 2 : bodyWidth * 1.8;
    hpPlane.parent = root;
    hpPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
    hpPlane.isPickable = false;

    const hpTex = new BABYLON.DynamicTexture('hpT_' + id, { width: 256, height: 32 }, scene, false);
    const hpMat = new BABYLON.StandardMaterial('hpM_' + id, scene);
    hpMat.diffuseTexture = hpTex;
    hpMat.emissiveTexture = hpTex;
    hpMat.opacityTexture = hpTex;
    hpMat.disableLighting = true;
    hpMat.backFaceCulling = false;
    hpMat.useAlphaFromDiffuseTexture = true;
    hpPlane.material = hpMat;

    // ===== Ship metadata =====
    root.metadata = {
      id, fleetColor, isFlagship,
      hp: isFlagship ? 350 : 70,
      maxHp: isFlagship ? 350 : 70,
      lastFire: Date.now() + Math.random() * 2500,
      velocity: new BABYLON.Vector3(0, 0, 0),
      target: null,
      targetTime: 0,
      dead: false,
      size: isFlagship ? 8 : 3.5,
      engineHalo: halo,
      hpPlane, hpTex,
      bodyMat, accentMat, engineMat,
      formationOffset: new BABYLON.Vector3(0, 0, 0),
      wander: Math.random() * Math.PI * 2,
      hpBarVisible: true
    };

    updateHealthBar(root);
    return root;
  }

  function updateHealthBar(ship) {
    if (!ship.metadata || ship.metadata.dead) return;
    const tex = ship.metadata.hpTex;
    const ctx = tex.getContext();
    const w = 256, h = 32;
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = ship.metadata.fleetColor === 'red' ? '#ff8866' : '#88aaff';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, w - 2, h - 2);

    const pct = Math.max(0, ship.metadata.hp / ship.metadata.maxHp);
    let color;
    if (pct > 0.5) color = ship.metadata.fleetColor === 'red' ? '#ff5555' : '#5577ff';
    else if (pct > 0.25) color = '#ffaa00';
    else color = '#ff2222';

    ctx.fillStyle = color;
    ctx.fillRect(4, 4, (w - 8) * pct, h - 8);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ship.metadata.isFlagship ? 'FLAGSHIP' : 'Escort ' + ship.metadata.id, w/2, h - 8);

    tex.update();
  }

  // ============================================================
  // FLEETS — create formations
  // ============================================================
  const RED_FLEET_X = -55;
  const BLUE_FLEET_X = 55;

  const redFleet = [];
  const blueFleet = [];

  function spawnFleet(fleetColor, anchorX, shipsArr) {
    // Flagship at center
    const flagship = createShip(fleetColor, true);
    flagship.position.set(anchorX, 0, 0);
    shipsArr.push(flagship);

    // 9 escorts in formation: 3 rows x 3 columns
    let idx = 0;
    for (let row = -1; row <= 1; row++) {
      for (let col = -1; col <= 1; col++) {
        if (idx >= 9) break;
        const esc = createShip(fleetColor, false);
        const xOffset = (col + 0.5 * Math.sign(row)) * 9;
        const zOffset = row * 9;
        const yOffset = (col === 0 ? 2 : 0);
        esc.position.set(anchorX + xOffset, yOffset, zOffset);
        esc.metadata.formationOffset = new BABYLON.Vector3(xOffset, yOffset, zOffset);
        shipsArr.push(esc);
        idx++;
      }
    }
  }

  spawnFleet('red', RED_FLEET_X, redFleet);
  spawnFleet('blue', BLUE_FLEET_X, blueFleet);

  // ============================================================
  // PROJECTILE SYSTEM
  // ============================================================
  scene.metadata = { projectiles: [], explosions: [] };

  function fireProjectile(ship, target) {
    if (!target || ship.metadata.dead || target.metadata.dead) return;
    const startPos = ship.position.clone();
    const dir = target.position.subtract(startPos).normalize();

    const proj = BABYLON.MeshBuilder.CreateSphere('proj', { diameter: 0.7, segments: 8 }, scene);
    proj.position = startPos.clone();

    const isRed = ship.metadata.fleetColor === 'red';
    const color = isRed
      ? new BABYLON.Color3(1, 0.25, 0.15)
      : new BABYLON.Color3(0.25, 0.6, 1);

    const projMat = new BABYLON.StandardMaterial('pm', scene);
    projMat.emissiveColor = color;
    projMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    projMat.specularColor = new BABYLON.Color3(0, 0, 0);
    projMat.disableLighting = true;
    proj.material = projMat;

    // Outer glow halo
    const halo = BABYLON.MeshBuilder.CreateSphere('ph', { diameter: 1.6, segments: 8 }, scene);
    halo.parent = proj;
    const haloMat = new BABYLON.StandardMaterial('phm', scene);
    haloMat.emissiveColor = color;
    haloMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    haloMat.alpha = 0.4;
    haloMat.disableLighting = true;
    halo.material = haloMat;

    // Trail
    const trail = new BABYLON.TrailMesh('trail', proj, scene, 0.35, 30, true);
    const trailMat = new BABYLON.StandardMaterial('trm', scene);
    trailMat.emissiveColor = color;
    trailMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    trailMat.alpha = 0.7;
    trailMat.disableLighting = true;
    trail.material = trailMat;

    scene.metadata.projectiles.push({
      mesh: proj,
      trail,
      direction: dir,
      speed: 38,
      damage: ship.metadata.isFlagship ? 30 : 18,
      color,
      owner: ship,
      life: 6
    });
  }

  function updateProjectiles(dt) {
    const allShips = redFleet.concat(blueFleet);
    for (let i = scene.metadata.projectiles.length - 1; i >= 0; i--) {
      const p = scene.metadata.projectiles[i];
      p.life -= dt;
      p.mesh.position.addInPlace(p.direction.scale(p.speed * dt));

      // Out of bounds
      if (p.mesh.position.length() > 250 || p.life <= 0) {
        p.mesh.dispose();
        p.trail.dispose();
        scene.metadata.projectiles.splice(i, 1);
        continue;
      }

      // Collision check
      let hit = null;
      for (let s of allShips) {
        if (s.metadata.dead) continue;
        if (s === p.owner) continue;
        if (s.metadata.fleetColor === p.owner.metadata.fleetColor) continue;
        const d = BABYLON.Vector3.Distance(p.mesh.position, s.position);
        if (d < s.metadata.size * 0.6) {
          hit = s;
          break;
        }
      }

      if (hit) {
        hit.metadata.hp -= p.damage;
        updateHealthBar(hit);

        // Small hit flash
        spawnHitFlash(p.mesh.position.clone(), p.color);

        if (hit.metadata.hp <= 0) {
          explode(hit);

          // Chain reaction: trigger explosion for ships within ~1 ship-width
          const chainRange = hit.metadata.isFlagship ? 9 : 4.5;
          for (let s2 of allShips) {
            if (s2.metadata.dead || s2 === hit) continue;
            const cd = BABYLON.Vector3.Distance(hit.position, s2.position);
            if (cd < chainRange) {
              const delay = (cd / chainRange) * 250 + Math.random() * 100;
              setTimeout(() => {
                if (!s2.metadata.dead) {
                  s2.metadata.hp = 0;
                  explode(s2);
                }
              }, delay);
            }
          }
        }

        p.mesh.dispose();
        p.trail.dispose();
        scene.metadata.projectiles.splice(i, 1);
      }
    }
  }

  // ============================================================
  // EXPLOSION SYSTEM
  // ============================================================
  function explode(ship) {
    if (ship.metadata.dead) return;
    ship.metadata.dead = true;
    ship.metadata.hpPlane.isVisible = false;

    const pos = ship.position.clone();
    const isRed = ship.metadata.fleetColor === 'red';

    // ===== Flash light =====
    const flash = new BABYLON.PointLight('flash_' + ship.metadata.id, pos.clone(), scene);
    flash.diffuse = isRed ? new BABYLON.Color3(1, 0.7, 0.3) : new BABYLON.Color3(1, 0.8, 0.4);
    flash.specular = flash.diffuse;
    flash.intensity = 8;
    flash.range = 60;

    // ===== Fire particles =====
    const fire = new BABYLON.ParticleSystem('fire_' + ship.metadata.id, 600, scene);
    fire.particleTexture = isRed ? redFlareTex : flareTex;
    fire.emitter = pos.clone();
    fire.minEmitBox = new BABYLON.Vector3(-1.5, -1.5, -1.5);
    fire.maxEmitBox = new BABYLON.Vector3(1.5, 1.5, 1.5);
    fire.color1 = new BABYLON.Color4(1, 0.95, 0.4, 1);
    fire.color2 = new BABYLON.Color4(1, 0.5, 0.1, 1);
    fire.colorDead = new BABYLON.Color4(0.4, 0.1, 0, 0);
    fire.minSize = 0.6;
    fire.maxSize = 2.5;
    fire.minLifeTime = 0.6;
    fire.maxLifeTime = 1.8;
    fire.emitRate = 0;
    fire.manualEmitCount = ship.metadata.isFlagship ? 800 : 350;
    fire.gravity = new BABYLON.Vector3(0, 0, 0);
    fire.direction1 = new BABYLON.Vector3(-12, -12, -12);
    fire.direction2 = new BABYLON.Vector3(12, 12, 12);
    fire.minEmitPower = 8;
    fire.maxEmitPower = 22;
    fire.updateSpeed = 0.02;
    fire.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    fire.start();
    setTimeout(() => fire.stop(), 200);
    setTimeout(() => fire.dispose(), 3500);

    // ===== Smoke =====
    const smoke = new BABYLON.ParticleSystem('smoke_' + ship.metadata.id, 200, scene);
    smoke.particleTexture = smokeTex;
    smoke.emitter = pos.clone();
    smoke.minEmitBox = new BABYLON.Vector3(-1, -1, -1);
    smoke.maxEmitBox = new BABYLON.Vector3(1, 1, 1);
    smoke.color1 = new BABYLON.Color4(0.2, 0.2, 0.2, 0.7);
    smoke.color2 = new BABYLON.Color4(0.4, 0.4, 0.4, 0.5);
    smoke.colorDead = new BABYLON.Color4(0.1, 0.1, 0.1, 0);
    smoke.minSize = 2;
    smoke.maxSize = 5;
    smoke.minLifeTime = 2;
    smoke.maxLifeTime = 4;
    smoke.emitRate = 0;
    smoke.manualEmitCount = ship.metadata.isFlagship ? 300 : 120;
    smoke.direction1 = new BABYLON.Vector3(-3, 1, -3);
    smoke.direction2 = new BABYLON.Vector3(3, 4, 3);
    smoke.minEmitPower = 2;
    smoke.maxEmitPower = 6;
    smoke.updateSpeed = 0.02;
    smoke.start();
    setTimeout(() => smoke.stop(), 300);
    setTimeout(() => smoke.dispose(), 5000);

    // ===== Sparks =====
    const sparks = new BABYLON.ParticleSystem('sparks_' + ship.metadata.id, 400, scene);
    sparks.particleTexture = isRed ? redFlareTex : blueFlareTex;
    sparks.emitter = pos.clone();
    sparks.minEmitBox = new BABYLON.Vector3(-0.5, -0.5, -0.5);
    sparks.maxEmitBox = new BABYLON.Vector3(0.5, 0.5, 0.5);
    sparks.color1 = new BABYLON.Color4(1, 1, 0.5, 1);
    sparks.color2 = new BABYLON.Color4(1, 0.8, 0.3, 1);
    sparks.colorDead = new BABYLON.Color4(1, 0.5, 0, 0);
    sparks.minSize = 0.15;
    sparks.maxSize = 0.5;
    sparks.minLifeTime = 0.8;
    sparks.maxLifeTime = 2;
    sparks.emitRate = 0;
    sparks.manualEmitCount = ship.metadata.isFlagship ? 500 : 200;
    sparks.direction1 = new BABYLON.Vector3(-20, -20, -20);
    sparks.direction2 = new BABYLON.Vector3(20, 20, 20);
    sparks.minEmitPower = 15;
    sparks.maxEmitPower = 35;
    sparks.updateSpeed = 0.015;
    sparks.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    sparks.gravity = new BABYLON.Vector3(0, -2, 0);
    sparks.start();
    setTimeout(() => sparks.stop(), 150);
    setTimeout(() => sparks.dispose(), 3000);

    // ===== Shockwave (expanding sphere) =====
    const sw = BABYLON.MeshBuilder.CreateSphere('sw_' + ship.metadata.id, { diameter: 2, segments: 16 }, scene);
    sw.position = pos.clone();
    const swMat = new BABYLON.StandardMaterial('swm_' + ship.metadata.id, scene);
    swMat.emissiveColor = isRed ? new BABYLON.Color3(1, 0.6, 0.2) : new BABYLON.Color3(1, 0.9, 0.4);
    swMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    swMat.specularColor = new BABYLON.Color3(0, 0, 0);
    swMat.alpha = 0.85;
    swMat.disableLighting = true;
    swMat.wireframe = true;
    sw.material = swMat;

    // Inner shockwave (solid)
    const sw2 = BABYLON.MeshBuilder.CreateSphere('sw2_' + ship.metadata.id, { diameter: 2, segments: 12 }, scene);
    sw2.position = pos.clone();
    const sw2Mat = new BABYLON.StandardMaterial('sw2m_' + ship.metadata.id, scene);
    sw2Mat.emissiveColor = isRed ? new BABYLON.Color3(1, 0.8, 0.3) : new BABYLON.Color3(0.8, 1, 1);
    sw2Mat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    sw2Mat.specularColor = new BABYLON.Color3(0, 0, 0);
    sw2Mat.alpha = 0.4;
    sw2Mat.disableLighting = true;
    sw2.material = sw2Mat;

    // ===== Debris =====
    const debrisCount = ship.metadata.isFlagship ? 30 : 12;
    const debrisMat = new BABYLON.StandardMaterial('dbm_' + ship.metadata.id, scene);
    debrisMat.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.45);
    debrisMat.emissiveColor = new BABYLON.Color3(0.6, 0.2, 0.05);
    debrisMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);

    for (let i = 0; i < debrisCount; i++) {
      const size = 0.3 + Math.random() * 0.7;
      const d = Math.random() > 0.4
        ? BABYLON.MeshBuilder.CreateBox('db_' + ship.metadata.id + '_' + i, { size }, scene)
        : BABYLON.MeshBuilder.CreateCylinder('db_' + ship.metadata.id + '_' + i, { height: size, diameter: size * 0.6 }, scene);
      d.position = pos.clone();
      d.position.x += (Math.random() - 0.5) * 2;
      d.position.y += (Math.random() - 0.5) * 2;
      d.position.z += (Math.random() - 0.5) * 2;
      d.material = debrisMat;
      const vel = new BABYLON.Vector3(
        (Math.random() - 0.5) * 25,
        (Math.random() - 0.5) * 25,
        (Math.random() - 0.5) * 25
      );
      const angVel = new BABYLON.Vector3(
        (Math.random() - 0.5) * 8,
        (Math.random() - 0.5) * 8,
        (Math.random() - 0.5) * 8
      );
      d.metadata = { debris: true, vel, angVel, life: 3.5 };
    }

    // ===== Hide ship mesh =====
    ship.setEnabled(false);

    // ===== Animate flash and shockwave =====
    const explosionEntry = {
      pos: pos.clone(),
      flash, sw, swMat, sw2, sw2Mat,
      flashColor: flash.diffuse.clone(),
      startTime: performance.now()
    };
    scene.metadata.explosions.push(explosionEntry);

    // Update scores
    const winnerFleet = isRed ? blueFleet : redFleet;
    const survivors = winnerFleet.filter(s => !s.metadata.dead).length;
    const id = isRed ? 'blueScore' : 'redScore';
    document.getElementById(id).textContent = survivors;

    setTimeout(() => {
      ship.dispose();
    }, 500);
  }

  function updateExplosions(dt) {
    const now = performance.now();
    for (let i = scene.metadata.explosions.length - 1; i >= 0; i--) {
      const e = scene.metadata.explosions[i];
      const t = (now - e.startTime) / 1000;

      // Flash fade
      e.flash.intensity = Math.max(0, 8 - t * 16);
      e.flash.range = Math.max(0, 60 - t * 80);

      // Shockwave expand
      const scale = 1 + t * 18;
      e.sw.scaling.setAll(scale);
      e.sw2.scaling.setAll(scale * 0.7);
      e.swMat.alpha = Math.max(0, 0.85 - t * 1.4);
      e.sw2Mat.alpha = Math.max(0, 0.4 - t * 0.8);

      if (t > 1.2) {
        e.flash.dispose();
        e.sw.dispose();
        e.sw2.dispose();
        scene.metadata.explosions.splice(i, 1);
      }
    }

    // Update debris
    const meshes = scene.meshes.filter(m => m.metadata && m.metadata.debris);
    for (let m of meshes) {
      const d = m.metadata;
      d.life -= dt;
      if (d.life <= 0) {
        m.dispose();
        continue;
      }
      m.position.addInPlace(d.vel.scale(dt));
      d.vel.scaleInPlace(0.985);
      m.rotation.x += d.angVel.x * dt;
      m.rotation.y += d.angVel.y * dt;
      m.rotation.z += d.angVel.z * dt;
    }
  }

  // ============================================================
  // HIT FLASH (small particle burst on projectile hit)
  // ============================================================
  function spawnHitFlash(pos, color) {
    const ps = new BABYLON.ParticleSystem('hit', 80, scene);
    ps.particleTexture = flareTex;
    ps.emitter = pos.clone();
    ps.minEmitBox = new BABYLON.Vector3(-0.2, -0.2, -0.2);
    ps.maxEmitBox = new BABYLON.Vector3(0.2, 0.2, 0.2);
    ps.color1 = new BABYLON.Color4(color.r, color.g, color.b, 1);
    ps.color2 = new BABYLON.Color4(1, 1, 0.8, 1);
    ps.colorDead = new BABYLON.Color4(color.r, color.g, color.b, 0);
    ps.minSize = 0.2;
    ps.maxSize = 0.6;
    ps.minLifeTime = 0.2;
    ps.maxLifeTime = 0.5;
    ps.emitRate = 0;
    ps.manualEmitCount = 50;
    ps.direction1 = new BABYLON.Vector3(-5, -5, -5);
    ps.direction2 = new BABYLON.Vector3(5, 5, 5);
    ps.minEmitPower = 3;
    ps.maxEmitPower = 8;
    ps.updateSpeed = 0.02;
    ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    ps.start();
    setTimeout(() => { ps.stop(); setTimeout(() => ps.dispose(), 800); }, 50);
  }

  // ============================================================
  // SHIP AI & MOVEMENT
  // ============================================================
  function findNearestEnemy(ship) {
    const enemyFleet = ship.metadata.fleetColor === 'red' ? blueFleet : redFleet;
    let nearest = null;
    let nearestDist = Infinity;
    for (let e of enemyFleet) {
      if (e.metadata.dead) continue;
      const d = BABYLON.Vector3.Distance(ship.position, e.position);
      if (d < nearestDist) {
        nearestDist = d;
        nearest = e;
      }
    }
    return { target: nearest, dist: nearestDist };
  }

  function updateShip(ship, dt, now) {
    if (ship.metadata.dead) return;

    const meta = ship.metadata;

    // Pick a target periodically
    if (!meta.target || meta.target.metadata.dead || now - meta.targetTime > 2500) {
      const r = findNearestEnemy(ship);
      meta.target = r.target;
      meta.targetTime = now;
      meta.lastDist = r.dist;
    }

    if (!meta.target) {
      // Drift if no enemy
      ship.position.x += Math.sin(meta.wander + now * 0.0003) * 0.5;
      ship.position.y += Math.cos(meta.wander * 1.3 + now * 0.0005) * 0.3;
      meta.wander += dt * 0.5;
      return;
    }

    const toTarget = meta.target.position.subtract(ship.position);
    const dist = toTarget.length();
    meta.lastDist = dist;

    const desiredDist = meta.isFlagship ? 22 : 14;

    // Velocity steering
    let desiredDir;
    if (dist > desiredDist + 5) {
      desiredDir = toTarget.normalize();
    } else if (dist < desiredDist - 3) {
      desiredDir = toTarget.normalize().scale(-1);
    } else {
      // Strafe around target
      const up = new BABYLON.Vector3(0, 1, 0);
      const right = BABYLON.Vector3.Cross(toTarget.normalize(), up).normalize();
      desiredDir = right.scale(Math.sin(now * 0.0008 + meta.wander));
      desiredDir.addInPlace(up.scale(Math.cos(now * 0.0006 + meta.wander) * 0.4));
      desiredDir.normalize();
    }

    // Smooth velocity change
    const accel = meta.isFlagship ? 4 : 7;
    meta.velocity = meta.velocity.scale(0.92).add(desiredDir.scale(accel * dt));

    // Clamp speed
    const maxSpeed = meta.isFlagship ? 7 : 11;
    const speed = meta.velocity.length();
    if (speed > maxSpeed) meta.velocity.scaleInPlace(maxSpeed / speed);

    ship.position.addInPlace(meta.velocity.scale(dt));

    // Face the target (only if we have a clear target)
    if (dist > 0.1) {
      const lookTarget = meta.target.position.clone();
      lookTarget.y += 0.5;
      ship.lookAt(lookTarget);
    }

    // Fire
    if (now - meta.lastFire > 3000 && dist < 60) {
      fireProjectile(ship, meta.target);
      meta.lastFire = now;

      // Flagships fire 2 projectiles
      if (meta.isFlagship) {
        setTimeout(() => {
          if (!ship.metadata.dead && meta.target && !meta.target.metadata.dead) {
            fireProjectile(ship, meta.target);
          }
        }, 80);
      }
    }

    // Animate engine halo based on speed
    if (meta.engineHalo) {
      const pulse = 1 + Math.sin(now * 0.015 + meta.wander) * 0.15;
      const speedFactor = 0.85 + (speed / maxSpeed) * 0.4;
      meta.engineHalo.scaling.setAll(pulse * speedFactor);
    }
  }

  // ============================================================
  // DYNAMIC POINT LIGHTS (flagships only, for performance)
  // ============================================================
  const redFlagshipLight = new BABYLON.PointLight('redFlagLight', new BABYLON.Vector3(0, 0, 0), scene);
  redFlagshipLight.diffuse = new BABYLON.Color3(1, 0.4, 0.2);
  redFlagshipLight.specular = new BABYLON.Color3(1, 0.5, 0.2);
  redFlagshipLight.intensity = 1.5;
  redFlagshipLight.range = 30;

  const blueFlagshipLight = new BABYLON.PointLight('blueFlagLight', new BABYLON.Vector3(0, 0, 0), scene);
  blueFlagshipLight.diffuse = new BABYLON.Color3(0.3, 0.6, 1);
  blueFlagshipLight.specular = new BABYLON.Color3(0.4, 0.7, 1);
  blueFlagshipLight.intensity = 1.5;
  blueFlagshipLight.range = 30;

  // ============================================================
  // MAIN LOOP
  // ============================================================
  let endShown = false;
  let frameCount = 0;

  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
    const now = Date.now();
    frameCount++;

    // Update all ships
    for (let s of redFleet.concat(blueFleet)) {
      updateShip(s, dt, now);
    }

    // Update projectiles
    updateProjectiles(dt);

    // Update explosions
    updateExplosions(dt);

    // Update flagship lights
    const redFlag = redFleet[0];
    const blueFlag = blueFleet[0];
    if (redFlag && !redFlag.metadata.dead) {
      redFlagshipLight.position = redFlag.position.clone();
      redFlagshipLight.position.z -= 5;
    } else if (!redFlagshipLight.isDisposed()) {
      redFlagshipLight.intensity = 0;
    }
    if (blueFlag && !blueFlag.metadata.dead) {
      blueFlagshipLight.position = blueFlag.position.clone();
      blueFlagshipLight.position.z -= 5;
    } else if (!blueFlagshipLight.isDisposed()) {
      blueFlagshipLight.intensity = 0;
    }

    // Check end condition
    if (!endShown) {
      const redAlive = redFleet.filter(s => !s.metadata.dead).length;
      const blueAlive = blueFleet.filter(s => !s.metadata.dead).length;
      if (redAlive === 0 || blueAlive === 0) {
        endShown = true;
        const end = document.getElementById('endScreen');
        const winner = redAlive === 0 ? 'BLUE FLEET' : 'RED FLEET';
        end.textContent = winner + ' WINS';
        end.style.color = redAlive === 0 ? '#80c0ff' : '#ff8060';
        end.style.display = 'block';

        // Camera pull-back
        camera.radius = Math.min(camera.upperRadiusLimit, camera.radius + 30);
      }
    }

    // Slowly rotate camera target toward action center
    const aliveShips = redFleet.concat(blueFleet).filter(s => !s.metadata.dead);
    if (aliveShips.length > 0) {
      let cx = 0, cy = 0, cz = 0;
      for (let s of aliveShips) {
        cx += s.position.x;
        cy += s.position.y;
        cz += s.position.z;
      }
      cx /= aliveShips.length; cy /= aliveShips.length; cz /= aliveShips.length;
      camera.target = BABYLON.Vector3.Lerp(camera.target, new BABYLON.Vector3(cx, cy, cz), 0.02);
    }
  });

  // ============================================================
  // RENDER LOOP
  // ============================================================
  engine.runRenderLoop(() => {
    scene.render();
  });

  window.addEventListener('resize', () => engine.resize());

  // Auto-restart after a while (optional, commented out)
  // setTimeout(() => location.reload(), 60000);
})();
</script>
</body>
</html>
