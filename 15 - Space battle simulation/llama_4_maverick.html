<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Space Battle Scene</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script src="https://cdn.babylonjs.com/babylon.max.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
    <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTexturesLibrary.min.js"></script>
    <script>
        // Create the scene
        var canvas = document.getElementById("renderCanvas");
        var engine = new BABYLON.Engine(canvas, true);
        var scene = new BABYLON.Scene(engine);
        var camera = new BABYLON.ArcRotateCamera("Camera", 1, 0.8, 100, new BABYLON.Vector3(0, 0, 0), scene);
        camera.upperBetaLimit = Math.PI / 2;
        camera.wheelPrecision = 50;
        camera.minZ = 0.1;

        // Create the background
        var background = new BABYLON.Layer("background", "https://www.babylonjs-playground.com/textures/nebula.jpg", scene);

        // Create the ships
        var shipMesh = BABYLON.MeshBuilder.CreateBox("ship", { size: 1 }, scene);
        var flagshipMesh = BABYLON.MeshBuilder.CreateBox("flagship", { size: 2 }, scene);
        shipMesh.visibility = 0;
        flagshipMesh.visibility = 0;

        var blueFleet = [];
        var redFleet = [];

        for (var i = 0; i < 10; i++) {
            var ship;
            if (i == 0) {
                ship = flagshipMesh.createInstance("blueFlagship");
                ship.position = new BABYLON.Vector3(-10, 0, 0);
            } else {
                ship = shipMesh.createInstance("blueShip" + i);
                ship.position = new BABYLON.Vector3(-10 + i, Math.random() * 5 - 2.5, Math.random() * 5 - 2.5);
            }
            ship.health = 100;
            blueFleet.push(ship);

            if (i == 0) {
                ship = flagshipMesh.createInstance("redFlagship");
                ship.position = new BABYLON.Vector3(10, 0, 0);
            } else {
                ship = shipMesh.createInstance("redShip" + i);
                ship.position = new BABYLON.Vector3(10 - i, Math.random() * 5 - 2.5, Math.random() * 5 - 2.5);
            }
            ship.health = 100;
            redFleet.push(ship);
        }

        // Create the health bars
        for (var i = 0; i < blueFleet.length; i++) {
            var healthBar = BABYLON.MeshBuilder.CreatePlane("healthBar", { size: 1 }, scene);
            healthBar.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            healthBar.position = new BABYLON.Vector3(blueFleet[i].position.x, blueFleet[i].position.y + 1, blueFleet[i].position.z);
            healthBar.scaling = new BABYLON.Vector3(1, 0.1, 1);
            var healthBarMaterial = new BABYLON.StandardMaterial("healthBarMaterial", scene);
            healthBarMaterial.diffuseColor = new BABYLON.Color3(0, 1, 0);
            healthBar.material = healthBarMaterial;
            blueFleet[i].healthBar = healthBar;

            healthBar = BABYLON.MeshBuilder.CreatePlane("healthBar", { size: 1 }, scene);
            healthBar.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            healthBar.position = new BABYLON.Vector3(redFleet[i].position.x, redFleet[i].position.y + 1, redFleet[i].position.z);
            healthBar.scaling = new BABYLON.Vector3(1, 0.1, 1);
            healthBarMaterial = new BABYLON.StandardMaterial("healthBarMaterial", scene);
            healthBarMaterial.diffuseColor = new BABYLON.Color3(0, 1, 0);
            healthBar.material = healthBarMaterial;
            redFleet[i].healthBar = healthBar;
        }

        // Create the projectiles
        var blueProjectileMesh = BABYLON.MeshBuilder.CreateSphere("blueProjectile", { diameter: 0.2 }, scene);
        var redProjectileMesh = BABYLON.MeshBuilder.CreateSphere("redProjectile", { diameter: 0.2 }, scene);
        blueProjectileMesh.visibility = 0;
        redProjectileMesh.visibility = 0;

        // Animation and physics
        scene.registerBeforeRender(function () {
            for (var i = 0; i < blueFleet.length; i++) {
                blueFleet[i].rotation.y += 0.01;
                redFleet[i].rotation.y += 0.01;

                if (Math.random() < 0.01) {
                    if (i == 0) {
                        var projectile1 = blueProjectileMesh.createInstance("blueProjectile");
                        projectile1.position = blueFleet[i].position;
                        projectile1.direction = redFleet[Math.floor(Math.random() * redFleet.length)].position.subtract(blueFleet[i].position).normalize();
                        projectile1.speed = 5;

                        var projectile2 = blueProjectileMesh.createInstance("blueProjectile");
                        projectile2.position = blueFleet[i].position;
                        projectile2.direction = redFleet[Math.floor(Math.random() * redFleet.length)].position.subtract(blueFleet[i].position).normalize();
                        projectile2.speed = 5;
                    } else {
                        var projectile = blueProjectileMesh.createInstance("blueProjectile");
                        projectile.position = blueFleet[i].position;
                        projectile.direction = redFleet[Math.floor(Math.random() * redFleet.length)].position.subtract(blueFleet[i].position).normalize();
                        projectile.speed = 5;
                    }
                }

                if (Math.random() < 0.01) {
                    if (i == 0) {
                        var projectile1 = redProjectileMesh.createInstance("redProjectile");
                        projectile1.position = redFleet[i].position;
                        projectile1.direction = blueFleet[Math.floor(Math.random() * blueFleet.length)].position.subtract(redFleet[i].position).normalize();
                        projectile1.speed = 5;

                        var projectile2 = redProjectileMesh.createInstance("redProjectile");
                        projectile2.position = redFleet[i].position;
                        projectile2.direction = blueFleet[Math.floor(Math.random() * blueFleet.length)].position.subtract(redFleet[i].position).normalize();
                        projectile2.speed = 5;
                    } else {
                        var projectile = redProjectileMesh.createInstance("redProjectile");
                        projectile.position = redFleet[i].position;
                        projectile.direction = blueFleet[Math.floor(Math.random() * blueFleet.length)].position.subtract(redFleet[i].position).normalize();
                        projectile.speed = 5;
                    }
                }

                blueFleet[i].healthBar.scaling.x = blueFleet[i].health / 100;
                redFleet[i].healthBar.scaling.x = redFleet[i].health / 100;
            }

            // Update projectiles
            var projectiles = scene.meshes.filter(function (mesh) {
                return mesh.name.indexOf("blueProjectile") != -1 || mesh.name.indexOf("redProjectile") != -1;
            });
            for (var i = 0; i < projectiles.length; i++) {
                projectiles[i].position = projectiles[i].position.add(projectiles[i].direction.scale(projectiles[i].speed));
                if (projectiles[i].position.length() > 100) {
                    projectiles[i].dispose();
                }
            }

            // Check collisions
            for (var i = 0; i < blueFleet.length; i++) {
                for (var j = 0; j < projectiles.length; j++) {
                    if (projectiles[j].intersectsMesh(blueFleet[i], false)) {
                        blueFleet[i].health -= 10;
                        projectiles[j].dispose();
                        if (blueFleet[i].health <= 0) {
                            explode(blueFleet[i]);
                        }
                    }
                    if (projectiles[j].intersectsMesh(redFleet[i], false)) {
                        redFleet[i].health -= 10;
                        projectiles[j].dispose();
                        if (redFleet[i].health <= 0) {
                            explode(redFleet[i]);
                        }
                    }
                }
            }
        });

        // Explosion function
        function explode(ship) {
            var explosion = new BABYLON.ParticleSystem("particles", 1000, scene);
            explosion.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            explosion.emitter = ship.position;
            explosion.minEmitBox = new BABYLON.Vector3(-1, -1, -1);
            explosion.maxEmitBox = new BABYLON.Vector3(1, 1, 1);
            explosion.color1 = new BABYLON.Color4(1, 0.5, 0, 1);
            explosion.color2 = new BABYLON.Color4(1, 0.2, 0, 1);
            explosion.colorDead = new BABYLON.Color4(0, 0, 0, 0.0);
            explosion.minSize = 0.1;
            explosion.maxSize = 1.0;
            explosion.minLifeTime = 0.3;
            explosion.maxLifeTime = 1.5;
            explosion.emitRate = 1000;
            explosion.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            explosion.gravity = new BABYLON.Vector3(0, 0, 0);
            explosion.direction1 = new BABYLON.Vector3(-1, -1, -1);
            explosion.direction2 = new BABYLON.Vector3(1, 1, 1);
            explosion.minAngularSpeed = 0;
            explosion.maxAngularSpeed = Math.PI;
            explosion.minEmitPower = 1;
            explosion.maxEmitPower = 3;
            explosion.updateSpeed = 0.005;
            explosion.start();

            ship.dispose();
            ship.healthBar.dispose();

            // Check for chain reaction
            for (var i = 0; i < blueFleet.length; i++) {
                if (blueFleet[i].position.subtract(ship.position).length() < 5) {
                    blueFleet[i].health = 0;
                    explode(blueFleet[i]);
                }
            }
            for (var i = 0; i < redFleet.length; i++) {
                if (redFleet[i].position.subtract(ship.position).length() < 5) {
                    redFleet[i].health = 0;
                    explode(redFleet[i]);
                }
            }
        }

        // Materials
        var blueMaterial = new BABYLON.StandardMaterial("blueMaterial", scene);
        blueMaterial.diffuseColor = new BABYLON.Color3(0, 0, 1);
        blueMaterial.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
        var redMaterial = new BABYLON.StandardMaterial("redMaterial", scene);
        redMaterial.diffuseColor = new BABYLON.Color3(1, 0, 0);
        redMaterial.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);

        for (var i = 0; i < blueFleet.length; i++) {
            if (i == 0) {
                blueFleet[i].material = blueMaterial;
            } else {
                blueFleet[i].material = blueMaterial;
            }
            redFleet[i].material = redMaterial;
        }

        blueProjectileMesh.material = blueMaterial;
        redProjectileMesh.material = redMaterial;

        // Lights
        var light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.7;

        // Render loop
        engine.runRenderLoop(function () {
            scene.render();
        });

        // Resize
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
