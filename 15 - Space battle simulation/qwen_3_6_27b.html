<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Space Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; color: #0af; font-family: 'Courier New', monospace; font-size: 1.2em;
    z-index: 999; flex-direction: column; gap: 16px; transition: opacity 1s;
  }
  #loading .bar { width: 200px; height: 3px; background: #112; border-radius: 2px; overflow: hidden; }
  #loading .bar-inner { width: 0%; height: 100%; background: linear-gradient(90deg, #0af, #f44); transition: width 0.3s; }
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 40px; color: #ccc; font-family: 'Courier New', monospace; font-size: 13px;
    pointer-events: none; opacity: 0.8;
  }
  #hud span { display: flex; align-items: center; gap: 6px; }
  #hud .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div id="loading">
  <div>⚔ INITIALIZING BATTLEFIELD ⚔</div>
  <div class="bar"><div class="bar-inner" id="loadBar"></div></div>
</div>
<div id="hud">
  <span><span class="dot" style="background:#0af"></span> BLUE FLEET: <b id="blueCount">10</b></span>
  <span><span class="dot" style="background:#f44"></span> RED FLEET: <b id="redCount">10</b></span>
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function() {
  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  const engine = new BABYLON.Engine(canvas, true, { stencil: true, antialias: true });

  const loadBar = document.getElementById('loadBar');
  let loadProgress = 0;
  const loadInterval = setInterval(() => {
    loadProgress = Math.min(loadProgress + Math.random() * 25, 95);
    loadBar.style.width = loadProgress + '%';
  }, 200);

  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.03, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
  scene.fogDensity = 0.0008;
  scene.fogColor = new BABYLON.Color3(0.01, 0.01, 0.03);

  const camera = new BABYLON.ArcRotateCamera("cam", Math.PI / 3, Math.PI / 3, 180,
    new BABYLON.Vector3(0, 0, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 30;
  camera.upperRadiusLimit = 350;
  camera.wheelPrecision = 40;
  camera.panningSensibility = 600;
  camera.speed = 3;

  // ========== LIGHTING ==========
  const ambient = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
  ambient.diffuse = new BABYLON.Color3(0.15, 0.15, 0.2);
  ambient.groundColor = new BABYLON.Color3(0.05, 0.05, 0.1);

  const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
  dirLight.diffuse = new BABYLON.Color3(0.6, 0.6, 0.7);
  dirLight.intensity = 0.8;

  const fillLight = new BABYLON.PointLight("fill", new BABYLON.Vector3(0, 30, 0), scene);
  fillLight.diffuse = new BABYLON.Color3(0.2, 0.3, 0.5);
  fillLight.intensity = 0.4;
  fillLight.range = 300;

  // ========== STARFIELD ==========
  function createStarfield() {
    const starCount = 4000;
    const sps = BABYLON.MeshBuilder.CreateDashedLines("stars", { dashSize: 0.001, gapSize: 1, dashColor: new BABYLON.Color3(1,1,1) }, scene);
    const positions = [];
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 400 + Math.random() * 200;
      positions.push(r * Math.sin(phi) * Math.cos(theta));
      positions.push(r * Math.sin(phi) * Math.sin(theta));
      positions.push(r * Math.cos(phi));
    }
    sps.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
    sps.visibility = 0.7 + Math.random() * 0.3;
  }
  createStarfield();

  // ========== NEBULA ==========
  function createNebula() {
    const nebulaPositions = [
      { pos: [100, 40, -150], color: [0.3, 0.1, 0.5], scale: 80 },
      { pos: [-120, -20, 100], color: [0.1, 0.2, 0.5], scale: 60 },
      { pos: [50, 60, 80], color: [0.4, 0.1, 0.3], scale: 50 },
      { pos: [-80, -50, -120], color: [0.1, 0.3, 0.4], scale: 70 },
    ];
    const nebulaMat = mat([0.2, 0.1, 0.4], { alpha: 0.15, emissive: [0.1, 0.05, 0.2], name: "nebula" });

    nebulaPositions.forEach((n, i) => {
      const sphere = BABYLON.MeshBuilder.CreateSphere("nebula" + i, { diameter: n.scale, segments: 8 }, scene);
      sphere.position = new BABYLON.Vector3(...n.pos);
      const m = mat(n.color, { alpha: 0.12, emissive: [n.color[0]*0.5, n.color[1]*0.5, n.color[2]*0.5], name: "neb" + i });
      sphere.material = m;
    });
  }
  createNebula();

  // ========== MATERIAL HELPER ==========
  function mat(color, opts = {}) {
    const m = new BABYLON.StandardMaterial(opts.name || "mat", scene);
    m.diffuseColor = new BABYLON.Color3(...color);
    m.specularColor = opts.specular ? new BABYLON.Color3(...opts.specular) : new BABYLON.Color3(0.3, 0.3, 0.3);
    m.specularPower = opts.specularPower || 32;
    if (opts.emissive) m.emissiveColor = new BABYLON.Color3(...opts.emissive);
    if (opts.alpha !== undefined) { m.alpha = opts.alpha; m.backFaceCulling = false; }
    if (opts.roughness !== undefined) m.roughness = opts.roughness;
    return m;
  }

  const hullBlueMat = mat([0.15, 0.3, 0.55], { specular: [0.4,0.4,0.5], name: "hullBlue" });
  const hullRedMat = mat([0.55, 0.15, 0.15], { specular: [0.4,0.4,0.5], name: "hullRed" });
  const hullDetailBlue = mat([0.2, 0.4, 0.7], { name: "hullDetBlue" });
  const hullDetailRed = mat([0.7, 0.2, 0.2], { name: "hullDetRed" });
  const armorMat = mat([0.3, 0.3, 0.35], { specular: [0.5,0.5,0.5], name: "armor" });
  const glowBlueMat = mat([0, 0.6, 1], { emissive: [0, 0.5, 0.9], name: "glowBlue" });
  const glowRedMat = mat([1, 0.2, 0.1], { emissive: [0.8, 0.15, 0.05], name: "glowRed" });
  const thrusterBlueMat = mat([0, 0.7, 1], { emissive: [0, 0.6, 0.9], name: "thrBlue" });
  const thrusterRedMat = mat([1, 0.3, 0.1], { emissive: [0.9, 0.2, 0.05], name: "thrRed" });
  const engineBlueMat = mat([0, 0.5, 0.9], { emissive: [0, 0.4, 0.8], name: "engBlue" });
  const engineRedMat = mat([0.9, 0.2, 0.05], { emissive: [0.7, 0.15, 0.02], name: "engRed" });

  // ========== SHIP CREATION ==========
  const ships = [];
  const projectiles = [];
  const explosions = [];
  const trailParticles = [];
  let blueAlive = 10, redAlive = 10;

  function createEscortShip(team, isFlagship = false) {
    const root = new BABYLON.TransformNode("ship_" + ships.length, scene);
    const scale = isFlagship ? 1.8 : 1;

    // Hull
    const hullW = isFlagship ? 5 : 3;
    const hullH = isFlagship ? 2.5 : 1.5;
    const hullD = isFlagship ? 12 : 7;

    const hull = BABYLON.MeshBuilder.CreateBox("hull", {
      width: hullW * scale, height: hullH * scale, depth: hullD * scale
    }, scene);
    hull.parent = root;
    hull.material = team === 'blue' ? hullBlueMat : hullRedMat;
    hull.castShadow = false;

    // Tapered hull (front cone)
    const nose = BABYLON.MeshBuilder.CreateCylinder("nose", {
      height: (isFlagship ? 6 : 3.5) * scale,
      diameterTop: 0,
      diameterBottom: (isFlagship ? hullW * 0.8 : hullW * 0.7) * scale,
      tessellation: 6
    }, scene);
    nose.position.z = (isFlagship ? 8.5 : 5.2) * scale;
    nose.parent = root;
    nose.rotation.x = Math.PI / 2;
    nose.material = team === 'blue' ? hullBlueMat : hullRedMat;

    // Wings
    if (isFlagship) {
      for (let side = -1; side <= 1; side += 2) {
        const wing = BABYLON.MeshBuilder.CreateBox("wing", {
          width: 6 * scale, height: 0.2 * scale, depth: 4 * scale
        }, scene);
        wing.position = new BABYLON.Vector3(side * 4 * scale, -0.3 * scale, 1 * scale);
        wing.parent = root;
        wing.material = armorMat;
        wing.rotation.z = side * 0.15;
      }
    } else {
      for (let side = -1; side <= 1; side += 2) {
        const wing = BABYLON.MeshBuilder.CreateBox("wing", {
          width: 3 * scale, height: 0.15 * scale, depth: 2.5 * scale
        }, scene);
        wing.position = new BABYLON.Vector3(side * 2.2 * scale, -0.2 * scale, 0.5 * scale);
        wing.parent = root;
        wing.material = armorMat;
        wing.rotation.z = side * 0.2;
      }
    }

    // Engine blocks
    const engineCount = isFlagship ? 3 : 2;
    for (let e = 0; e < engineCount; e++) {
      const ex = (e - (engineCount - 1) / 2) * (isFlagship ? 1.5 : 0.8) * scale;
      const eng = BABYLON.MeshBuilder.CreateCylinder("engine", {
        height: 1.2 * scale, diameterTop: 0.4 * scale, diameterBottom: 0.6 * scale, tessellation: 8
      }, scene);
      eng.position = new BABYLON.Vector3(ex, 0, -(isFlagship ? 6.5 : 4) * scale);
      eng.parent = root;
      eng.rotation.x = Math.PI / 2;
      eng.material = armorMat;

      // Engine glow
      const engGlow = BABYLON.MeshBuilder.CreateCylinder("engGlow", {
        height: 0.3 * scale, diameter: 0.5 * scale, tessellation: 8
      }, scene);
      engGlow.position = new BABYLON.Vector3(ex, 0, -(isFlagship ? 7.2 : 4.6) * scale);
      engGlow.parent = root;
      engGlow.rotation.x = Math.PI / 2;
      engGlow.material = team === 'blue' ? engineBlueMat : engineRedMat;
    }

    // Cockpit
    const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", { diameter: (isFlagship ? 1.8 : 1.2) * scale, segments: 8 }, scene);
    cockpit.position = new BABYLON.Vector3(0, (isFlagship ? 1.2 : 0.8) * scale, (isFlagship ? 3 : 1.5) * scale);
    cockpit.parent = root;
    cockpit.material = team === 'blue' ? hullDetailBlue : hullDetailRed;

    // Flagship details
    if (isFlagship) {
      // Command tower
      const tower = BABYLON.MeshBuilder.CreateCylinder("tower", {
        height: 3 * scale, diameterTop: 1 * scale, diameterBottom: 2 * scale, tessellation: 6
      }, scene);
      tower.position = new BABYLON.Vector3(0, 2.5 * scale, -1 * scale);
      tower.parent = root;
      tower.material = hullDetailBlue;

      // Antenna
      const antenna = BABYLON.MeshBuilder.CreateCylinder("antenna", {
        height: 2 * scale, diameterTop: 0.05, diameterBottom: 0.15, tessellation: 4
      }, scene);
      antenna.position = new BABYLON.Vector3(0, 4.5 * scale, -1 * scale);
      antenna.parent = root;
      antenna.material = armorMat;

      // Glowing antenna tip
      const tip = BABYLON.MeshBuilder.CreateSphere("tip", { diameter: 0.3 * scale }, scene);
      tip.position = new BABYLON.Vector3(0, 5.5 * scale, -1 * scale);
      tip.parent = root;
      tip.material = team === 'blue' ? glowBlueMat : glowRedMat;

      // Bridge windows
      for (let w = 0; w < 4; w++) {
        const win = BABYLON.MeshBuilder.CreateBox("win", {
          width: 0.6 * scale, height: 0.3 * scale, depth: 0.1 * scale
        }, scene);
        win.position = new BABYLON.Vector3((w - 1.5) * 0.8 * scale, 1.5 * scale, 2 * scale);
        win.parent = root;
        win.material = team === 'blue' ? glowBlueMat : glowRedMat;
      }
    }

    // Thruster glow point light
    const thrLight = new BABYLON.PointLight("thrLight",
      new BABYLON.Vector3(0, 0, -(isFlagship ? 8 : 5) * scale), root);
    thrLight.diffuse = team === 'blue' ? new BABYLON.Color3(0, 0.5, 1) : new BABYLON.Color3(1, 0.3, 0);
    thrLight.intensity = isFlagship ? 1.2 : 0.6;
    thrLight.range = isFlagship ? 20 : 12;

    return root;
  }

  function createHealthBar(team) {
    const barGroup = new BABYLON.TransformNode("healthBar", scene);

    const bg = BABYLON.MeshBuilder.CreatePlane("bg", { width: 3, height: 0.3 }, scene);
    bg.position.z = -0.01;
    bg.parent = barGroup;
    bg.material = mat([0.1, 0.1, 0.1], { alpha: 0.7, name: "hbarBg" });

    const bar = BABYLON.MeshBuilder.CreatePlane("bar", { width: 2.8, height: 0.2 }, scene);
    bar.position.z = 0.01;
    bar.parent = barGroup;
    bar.material = team === 'blue' ? glowBlueMat : glowRedMat;

    barGroup.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

    return { group: barGroup, bar: bar };
  }

  // ========== CREATE FLEETS ==========
  function createFleet(team) {
    const fleet = [];
    const centerOffset = team === 'blue' ? -50 : 50;
    const zDir = team === 'blue' ? 1 : -1;

    // Flagship
    const flagship = createEscortShip(team, true);
    flagship.position = new BABYLON.Vector3(centerOffset, 0, 0);
    flagship.rotation.y = zDir > 0 ? 0 : Math.PI;

    const hb = createHealthBar(team);
    hb.group.position = new BABYLON.Vector3(0, 3, 0);
    hb.group.parent = flagship;

    const shipData = {
      mesh: flagship,
      team: team,
      isFlagship: true,
      health: 100,
      maxHealth: 100,
      healthBar: hb,
      speed: 0.15,
      velocity: new BABYLON.Vector3(0, 0, 0),
      target: null,
      fireTimer: Math.random() * 100,
      maneuverTimer: 0,
      maneuverDuration: 0,
      alive: true,
      scale: 1.8
    };
    flagship.userData = shipData;
    ships.push(shipData);
    fleet.push(shipData);

    // 9 escorts
    for (let i = 0; i < 9; i++) {
      const angle = (i / 9) * Math.PI * 2;
      const dist = 12 + Math.random() * 8;
      const escort = createEscortShip(team, false);
      escort.position = new BABYLON.Vector3(
        centerOffset + Math.cos(angle) * dist,
        (Math.random() - 0.5) * 10,
        Math.sin(angle) * dist * 0.6 + (Math.random() - 0.5) * 5
      );
      escort.rotation.y = zDir > 0 ? 0 : Math.PI;

      const hb2 = createHealthBar(team);
      hb2.group.position = new BABYLON.Vector3(0, 2, 0);
      hb2.group.parent = escort;

      const sd = {
        mesh: escort,
        team: team,
        isFlagship: false,
        health: 50,
        maxHealth: 50,
        healthBar: hb2,
        speed: 0.25,
        velocity: new BABYLON.Vector3(0, 0, 0),
        target: null,
        fireTimer: Math.random() * 100,
        maneuverTimer: 0,
        maneuverDuration: 0,
        alive: true,
        scale: 1
      };
      escort.userData = sd;
      ships.push(sd);
      fleet.push(sd);
    }

    return fleet;
  }

  const blueFleet = createFleet('blue');
  const redFleet = createFleet('red');

  // ========== PROJECTILES ==========
  function createProjectile(team) {
    const isBlue = team === 'blue';
    const proj = BABYLON.MeshBuilder.CreateCylinder("proj", {
      height: 1.2, diameter: 0.2, tessellation: 6
    }, scene);
    proj.rotation.x = Math.PI / 2;
    proj.material = isBlue ? glowBlueMat : glowRedMat;

    // Glow sphere
    const glow = BABYLON.MeshBuilder.CreateSphere("pGlow", { diameter: 0.4, segments: 6 }, scene);
    glow.parent = proj;
    glow.material = isBlue ? glowBlueMat : glowRedMat;

    // Thrust light
    const light = new BABYLON.PointLight("pLight", proj.position, scene);
    light.diffuse = isBlue ? new BABYLON.Color3(0, 0.5, 1) : new BABYLON.Color3(1, 0.2, 0);
    light.intensity = 0.8;
    light.range = 10;

    // Trail particle system
    const trailPS = new BABYLON.ParticleSystem("trail", 60, scene);
    trailPS.textureURL = "https://cdn.babylonjs.com/assets/flare.png";
    trailPS.emitter = proj;
    trailPS.emitRate = 30;
    trailPS.minLifeTime = 0.3;
    trailPS.maxLifeTime = 0.8;
    trailPS.minSize = 0.05;
    trailPS.maxSize = 0.15;
    trailPS.color1 = isBlue ? new BABYLON.Color4(0, 0.6, 1, 0.8) : new BABYLON.Color4(1, 0.3, 0, 0.8);
    trailPS.color2 = isBlue ? new BABYLON.Color4(0, 0.3, 0.8, 0.4) : new BABYLON.Color4(0.8, 0.1, 0, 0.4);
    trailPS.colorDead = new BABYLON.Color4(0, 0, 0, 0);
    trailPS.minEmitPower = 0.3;
    trailPS.maxEmitPower = 0.8;
    trailPS.direction1 = new BABYLON.Vector3(0, 0, 0.5);
    trailPS.direction2 = new BABYLON.Vector3(0, 0, -0.5);
    trailPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    trailPS.updateEmitPower = true;
    trailPS.start();

    return {
      mesh: proj,
      team: team,
      speed: 2.5,
      damage: isBlue ? 12 : 12,
      light: light,
      trailPS: trailPS,
      alive: true,
      age: 0
    };
  }

  function fireProjectile(ship) {
    if (!ship.alive) return;
    const isBlue = ship.team === 'blue';
    const dir = ship.mesh.getForwardRay().direction;
    const origin = ship.mesh.position.clone().add(dir.scale(ship.scale * 5));

    const proj = createProjectile(ship.team);
    proj.mesh.position = origin.clone();
    proj.velocity = dir.scale(proj.speed);
    proj.alive = true;
    projectiles.push(proj);
  }

  function fireDoubleProjectile(ship) {
    if (!ship.alive) return;
    fireProjectile(ship);
    // Second projectile slightly offset
    const proj2 = createProjectile(ship.team);
    const offset = new BABYLON.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 1, 0);
    const dir = ship.mesh.getForwardRay().direction;
    const origin = ship.mesh.position.clone().add(dir.scale(ship.scale * 5)).add(offset);
    proj2.mesh.position = origin;
    proj2.velocity = dir.scale(proj2.speed).add(offset.scale(0.1));
    proj2.alive = true;
    projectiles.push(proj2);
  }

  // ========== EXPLOSIONS ==========
  function createExplosion(position, scale = 1) {
    const group = new BABYLON.TransformNode("explosion", scene);
    group.position = position.clone();

    // Core fire sphere
    const core = BABYLON.MeshBuilder.CreateSphere("expCore", { diameter: 2 * scale, segments: 12 }, scene);
    core.parent = group;
    const fireMat = mat([1, 0.5, 0.1], { emissive: [1, 0.6, 0.1], alpha: 0.9, name: "fireMat" });
    core.material = fireMat;

    // Shockwave ring
    const shockwave = BABYLON.MeshBuilder.CreateTorus("shockwave", {
      diameter: 0.5 * scale, thickness: 0.15 * scale, tessellation: 24
    }, scene);
    shockwave.parent = group;
    const shockMat = mat([1, 0.9, 0.7], { emissive: [1, 0.8, 0.5], alpha: 0.8, name: "shockMat" });
    shockwave.material = shockMat;
    shockwave.rotation.x = Math.PI / 2;

    // Explosion light
    const expLight = new BABYLON.PointLight("expLight", new BABYLON.Vector3(0, 0, 0), group);
    expLight.diffuse = new BABYLON.Color3(1, 0.8, 0.3);
    expLight.intensity = 5 * scale;
    expLight.range = 40 * scale;

    // Fire particles
    const firePS = new BABYLON.ParticleSystem("firePS", 200, scene);
    firePS.textureURL = "https://cdn.babylonjs.com/assets/flare.png";
    firePS.emitter = group;
    firePS.minEmitBox = new BABYLON.Vector3(-1 * scale, -1 * scale, -1 * scale);
    firePS.maxEmitBox = new BABYLON.Vector3(1 * scale, 1 * scale, 1 * scale);
    firePS.emitRate = 200;
    firePS.minLifeTime = 0.3;
    firePS.maxLifeTime = 1.5;
    firePS.minSize = 0.2 * scale;
    firePS.maxSize = 0.8 * scale;
    firePS.color1 = new BABYLON.Color4(1, 0.9, 0.3, 1);
    firePS.color2 = new BABYLON.Color4(1, 0.4, 0.1, 0.8);
    firePS.color3 = new BABYLON.Color4(1, 0.1, 0, 0.6);
    firePS.colorDead = new BABYLON.Color4(0, 0, 0, 0);
    firePS.minEmitPower = 2;
    firePS.maxEmitPower = 6 * scale;
    firePS.gravity = new BABYLON.Vector3(0, 0, 0);
    firePS.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    firePS.start();
    firePS.stopEmittingDuration = 300;

    // Spark particles
    const sparkPS = new BABYLON.ParticleSystem("sparks", 100, scene);
    sparkPS.textureURL = "https://cdn.babylonjs.com/assets/flare.png";
    sparkPS.emitter = group;
    sparkPS.emitRate = 80;
    sparkPS.minLifeTime = 0.5;
    sparkPS.maxLifeTime = 2;
    sparkPS.minSize = 0.05;
    sparkPS.maxSize = 0.15;
    sparkPS.color1 = new BABYLON.Color4(1, 1, 0.8, 1);
    sparkPS.color2 = new BABYLON.Color4(1, 0.6, 0.2, 0.8);
    sparkPS.colorDead = new BABYLON.Color4(0, 0, 0, 0);
    sparkPS.minEmitPower = 4;
    sparkPS.maxEmitPower = 10 * scale;
    sparkPS.gravity = new BABYLON.Vector3(0, -0.05, 0);
    sparkPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    sparkPS.start();
    sparkPS.stopEmittingDuration = 200;

    // Debris
    const debris = [];
    const debrisCount = Math.floor(8 * scale);
    for (let d = 0; d < debrisCount; d++) {
      const angle = Math.random() * Math.PI * 2;
      const elev = (Math.random() - 0.5) * Math.PI;
      const speed = (2 + Math.random() * 5) * scale;
      const size = (0.1 + Math.random() * 0.4) * scale;
      const type = Math.floor(Math.random() * 3);

      let debrisMesh;
      if (type === 0) {
        debrisMesh = BABYLON.MeshBuilder.CreateBox("debris", { size: size }, scene);
      } else if (type === 1) {
        debrisMesh = BABYLON.MeshBuilder.CreateSphere("debris", { diameter: size, segments: 4 }, scene);
      } else {
        debrisMesh = BABYLON.MeshBuilder.CreatePolyhedron("debris", { size: size * 0.5, type: 1 }, scene);
      }
      debrisMesh.parent = group;
      const isMetal = Math.random() > 0.3;
      debrisMesh.material = isMetal ? armorMat : (Math.random() > 0.5 ? glowBlueMat : glowRedMat);

      const vel = new BABYLON.Vector3(
        Math.cos(angle) * Math.cos(elev) * speed,
        Math.sin(elev) * speed,
        Math.sin(angle) * Math.cos(elev) * speed
      );

      debris.push({ mesh: debrisMesh, velocity: vel, rotSpeed: new BABYLON.Vector3(
        (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3
      )});
    }

    // Debris trail particles (small fire on debris)
    const debrisFire = new BABYLON.ParticleSystem("debrisFire", 30, scene);
    debrisFire.textureURL = "https://cdn.babylonjs.com/assets/flare.png";
    debrisFire.emitter = group;
    debrisFire.emitRate = 10;
    debrisPS = debrisFire;
    debrisFire.minLifeTime = 0.5;
    debrisFire.maxLifeTime = 1.5;
    debrisFire.minSize = 0.1;
    debrisFire.maxSize = 0.3;
    debrisFire.color1 = new BABYLON.Color4(1, 0.7, 0.2, 0.9);
    debrisFire.colorDead = new BABYLON.Color4(0, 0, 0, 0);
    debrisFire.minEmitPower = 1;
    debrisFire.maxEmitPower = 4 * scale;
    debrisFire.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    debrisFire.start();
    debrisFire.stopEmittingDuration = 500;

    const explosion = {
      group: group,
      core: core,
      shockwave: shockwave,
      fireMat: fireMat,
      shockMat: shockMat,
      expLight: expLight,
      firePS: firePS,
      sparkPS: sparkPS,
      debris: debris,
      debrisFire: debrisFire,
      age: 0,
      duration: 4000,
      scale: scale,
      blastRadius: 6 * scale
    };
    explosions.push(explosion);

    // Animate core expansion
    BABYLON.Animation.CreateAndStartAnimation("coreScale", core, "scaling", 30, 60,
      new BABYLON.Vector3(1, 1, 1), new BABYLON.Vector3(3, 3, 3),
      BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

    BABYLON.Animation.CreateAndStartAnimation("coreFade", fireMat, "alpha", 30, 90, 0.9, 0,
      BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

    // Shockwave expansion
    BABYLON.Animation.CreateAndStartAnimation("shockExpand", shockwave, "scaling", 30, 120,
      new BABYLON.Vector3(1, 1, 1), new BABYLON.Vector3(15, 15, 15),
      BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

    BABYLON.Animation.CreateAndStartAnimation("shockFade", shockMat, "alpha", 30, 120, 0.8, 0,
      BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

    // Light fade
    BABYLON.Animation.CreateAndStartAnimation("lightFade", expLight, "intensity", 30, 90,
      5 * scale, 0, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

    return explosion;
  }

  function detonateShip(ship) {
    if (!ship.alive) return;
    ship.alive = false;
    ship.mesh.visibility = 0;
    ship.healthBar.group.visibility = 0;

    if (ship.team === 'blue') blueAlive--;
    else redAlive--;

    document.getElementById('blueCount').textContent = blueAlive;
    document.getElementById('redCount').textContent = redAlive;

    const explosion = createExplosion(ship.mesh.position.clone(), ship.scale);

    // Chain reaction check
    const chainDelay = 200 + Math.random() * 300;
    setTimeout(() => {
      if (ship.alive === false) {
        ships.forEach(other => {
          if (other.alive && other !== ship) {
            const dist = BABYLON.Vector3.Distance(other.mesh.position, explosion.group.position);
            if (dist < explosion.blastRadius + other.scale * 3) {
              other.health -= 30;
              if (other.health <= 0) {
                detonateShip(other);
              }
            }
          }
        });
      }
    }, chainDelay);
  }

  // ========== AI BEHAVIOR ==========
  function getNearestEnemy(ship) {
    let nearest = null;
    let minDist = Infinity;
    ships.forEach(other => {
      if (!other.alive || other.team === ship.team) return;
      const dist = BABYLON.Vector3.Distance(ship.mesh.position, other.mesh.position);
      if (dist < minDist) {
        minDist = dist;
        nearest = other;
      }
    });
    return nearest;
  }

  function updateShipAI(ship, deltaTime) {
    if (!ship.alive) return;

    ship.maneuverTimer -= deltaTime;
    if (ship.maneuverTimer <= 0) {
      ship.maneuverDuration = 1000 + Math.random() * 3000;
      ship.maneuverTimer = ship.maneuverDuration;
      ship.target = getNearestEnemy(ship);
      if (!ship.target) {
        // No enemies, fly toward center
        ship.target = { mesh: { position: new BABYLON.Vector3(0, 0, 0) } };
      }
    }

    if (ship.target && ship.target.alive !== false) {
      const targetPos = ship.target.mesh.position;
      const toTarget = targetPos.subtract(ship.mesh.position);
      const dist = toTarget.length();

      // Steer toward target
      if (dist > 0.1) {
        const desired = toTarget.normalize();
        const currentDir = ship.mesh.getForwardRay().direction;
        const steer = desired.subtract(currentDir.scale(currentDir.dot(desired)));
        const maxSteer = 0.02;
        steer.lengthClamp(0, maxSteer);

        const newDir = currentDir.add(steer).normalize();

        // Smooth rotation toward direction
        const axis = BABYLON.Vector3.Cross(currentDir, newDir);
        if (axis.lengthSquared() > 0.0001) {
          const angle = Math.acos(BABYLON.Vector3.Dot(currentDir, newDir));
          ship.mesh.rotate(axis.normalize(), angle * 0.05);
        }

        // Also rotate to face target horizontally
        const dirToTarget = new BABYLON.Vector3(toTarget.x, 0, toTarget.z);
        if (dirToTarget.length() > 0.1) {
          const targetAngle = Math.atan2(dirToTarget.x, dirToTarget.z);
          let currentAngle = ship.mesh.rotation.y;
          // Normalize angles
          while (targetAngle - currentAngle > Math.PI) currentAngle += Math.PI * 2;
          while (targetAngle - currentAngle < -Math.PI) currentAngle -= Math.PI * 2;
          const angleDiff = targetAngle - currentAngle;
          ship.mesh.rotation.y += angleDiff * 0.03;
        }

        // Move forward
        const forward = ship.mesh.getForwardRay().direction;
        ship.velocity = forward.scale(ship.speed);
        ship.mesh.position.addInPlace(ship.velocity.scale(deltaTime * 0.06));
      }
    }

    // Add some vertical movement
    ship.mesh.position.y += Math.sin(Date.now() * 0.001 + ship.mesh.id) * 0.02;

    // Keep ships in bounds
    const maxDist = 80;
    const fromCenter = ship.mesh.position.length();
    if (fromCenter > maxDist) {
      const backToCenter = ship.mesh.position.normalize().scale(-0.05);
      ship.mesh.position.addInPlace(backToCenter);
    }

    // Fire weapons
    ship.fireTimer -= deltaTime;
    if (ship.fireTimer <= 0 && ship.target && ship.target.alive !== false) {
      const distToTarget = BABYLON.Vector3.Distance(ship.mesh.position, ship.target.mesh.position);
      if (distToTarget < 80) {
        if (ship.isFlagship) {
          fireDoubleProjectile(ship);
          ship.fireTimer = 2500 + Math.random() * 500;
        } else {
          fireProjectile(ship);
          ship.fireTimer = 2800 + Math.random() * 400;
        }
      } else {
        ship.fireTimer = 500;
      }
    }
  }

  // ========== UPDATE PROJECTILES ==========
  function updateProjectiles(deltaTime) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const proj = projectiles[i];
      if (!proj.alive) {
        proj.mesh.dispose();
        proj.light.dispose();
        proj.trailPS.dispose();
        projectiles.splice(i, 1);
        continue;
      }

      proj.age += deltaTime;
      proj.mesh.position.addInPlace(proj.velocity.scale(deltaTime * 0.06));
      proj.light.position = proj.mesh.position.clone();

      // Check collisions with enemy ships
      let hit = false;
      ships.forEach(ship => {
        if (!ship.alive || ship.team === proj.team) return;
        const dist = BABYLON.Vector3.Distance(proj.mesh.position, ship.mesh.position);
        const hitRadius = ship.scale * 2.5;
        if (dist < hitRadius) {
          hit = true;
          ship.health -= proj.damage;

          // Update health bar
          const healthPct = Math.max(0, ship.health / ship.maxHealth);
          proj.trailPS.dispose();

          if (ship.health <= 0) {
            detonateShip(ship);
          } else {
            // Scale health bar
            ship.healthBar.bar.scaling.x = healthPct;
          }
        }
      });

      if (hit || proj.age > 8000) {
        proj.alive = false;
        proj.mesh.dispose();
        proj.light.dispose();
        proj.trailPS.stop();
      }
    }
  }

  // ========== UPDATE EXPLOSIONS ==========
  function updateExplosions(deltaTime) {
    for (let i = explosions.length - 1; i >= 0; i--) {
      const exp = explosions[i];
      exp.age += deltaTime;

      // Update debris
      exp.debris.forEach(d => {
        d.mesh.position.addInPlace(d.velocity.scale(deltaTime * 0.01));
        d.mesh.rotation.x += d.rotSpeed.x;
        d.mesh.rotation.y += d.rotSpeed.y;
        d.mesh.rotation.z += d.rotSpeed.z;
        d.velocity.scaleInPlace(0.995);
      });

      if (exp.age > exp.duration) {
        // Cleanup
        exp.group.dispose();
        exp.firePS.dispose();
        exp.sparkPS.dispose();
        exp.debrisFire.dispose();
        explosions.splice(i, 1);
      }
    }
  }

  // ========== GAME OVER CHECK ==========
  function checkGameOver() {
    if (blueAlive <= 0 || redAlive <= 0) {
      const winner = blueAlive > 0 ? 'BLUE' : 'RED';
      // Could show a message - for now just let the scene continue with debris
    }
  }

  // ========== RENDER LOOP ==========
  let lastTime = performance.now();

  engine.runRenderLoop(function() {
    const now = performance.now();
    const deltaTime = Math.min(now - lastTime, 50);
    lastTime = now;

    // Update ship AI
    ships.forEach(ship => updateShipAI(ship, deltaTime));

    // Update projectiles
    updateProjectiles(deltaTime);

    // Update explosions
    updateExplosions(deltaTime);

    checkGameOver();

    scene.render();
  });

  window.addEventListener('resize', () => engine.resize());

  // Hide loading
  loadBar.style.width = '100%';
  setTimeout(() => {
    const loading = document.getElementById('loading');
    loading.style.opacity = '0';
    setTimeout(() => loading.style.display = 'none', 1000);
  }, 800);

})();
</script>
