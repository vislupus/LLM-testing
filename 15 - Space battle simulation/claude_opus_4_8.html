<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fleet Engagement — 3D Space Battle</title>
<style>
  :root{
    --blue:#38a8ff;
    --blue-dim:#1f4d78;
    --red:#ff4d47;
    --red-dim:#7a2320;
    --ink:#dfeaf5;
    --muted:#7f93a8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#03040a;overflow:hidden;
    font-family:"SF Mono",ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    color:var(--ink);-webkit-font-smoothing:antialiased;}
  #renderCanvas{width:100vw;height:100vh;display:block;touch-action:none;outline:none;}

  /* ---- HUD ---- */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10;}

  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;
    padding:16px 20px 0;}
  .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
    width:min(760px,92vw);}

  .fleet{display:flex;flex-direction:column;gap:6px;}
  .fleet.red{align-items:flex-end;}
  .fleet .name{font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:8px;}
  .fleet.blue .name{color:var(--blue);}
  .fleet.red .name{color:var(--red);}
  .fleet .name .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 10px currentColor;
    background:currentColor;}
  .strength{position:relative;height:7px;width:100%;border-radius:4px;overflow:hidden;
    background:rgba(255,255,255,.06);}
  .strength .fill{position:absolute;top:0;bottom:0;transition:width .35s ease;}
  .fleet.blue .strength .fill{left:0;background:linear-gradient(90deg,#0d3a63,var(--blue));
    box-shadow:0 0 14px rgba(56,168,255,.7);}
  .fleet.red .strength .fill{right:0;background:linear-gradient(270deg,#5c1512,var(--red));
    box-shadow:0 0 14px rgba(255,77,71,.7);}
  .count{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
    letter-spacing:.02em;}
  .fleet.blue .count{color:var(--blue);}
  .fleet.red .count{color:var(--red);}
  .sub{font-size:9.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;}

  .vs{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .vs .label{font-size:10px;letter-spacing:.5em;color:var(--muted);text-indent:.5em;}
  .vs .title{font-size:12px;letter-spacing:.34em;color:#a9c0d6;text-indent:.34em;white-space:nowrap;}

  .controls{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;gap:20px;font-size:10px;letter-spacing:.18em;color:var(--muted);
    text-transform:uppercase;background:rgba(6,10,20,.4);border:1px solid rgba(120,150,180,.12);
    padding:8px 16px;border-radius:100px;backdrop-filter:blur(6px);}
  .controls b{color:#9fb6cc;font-weight:600;}

  .btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:#cfe0f0;background:rgba(12,20,34,.6);
    border:1px solid rgba(120,150,180,.28);padding:11px 22px;border-radius:100px;
    backdrop-filter:blur(6px);transition:.18s;}
  .btn:hover{border-color:rgba(150,190,230,.7);color:#fff;background:rgba(20,34,54,.8);}

  /* ---- Result banner ---- */
  .result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;opacity:0;pointer-events:none;transition:opacity .8s ease;}
  .result.show{opacity:1;pointer-events:auto;}
  .result .verdict{font-size:min(9vw,68px);font-weight:800;letter-spacing:.06em;line-height:.98;
    text-align:center;text-shadow:0 0 40px currentColor;}
  .result .flavor{font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);}

  /* ---- Boot ---- */
  #boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;background:#03040a;transition:opacity .6s ease;}
  #boot .ring{width:40px;height:40px;border-radius:50%;border:2px solid rgba(120,150,180,.15);
    border-top-color:var(--blue);animation:spin 1s linear infinite;}
  #boot .t{font-size:11px;letter-spacing:.4em;color:var(--muted);text-transform:uppercase;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fade-out{opacity:0;pointer-events:none;}
  #err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    padding:40px;text-align:center;color:#ff9a94;font-size:13px;line-height:1.7;background:#03040a;}
</style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div class="hud">
    <div class="topbar">
      <div class="scoreboard">
        <div class="fleet blue">
          <div class="name"><span class="dot"></span>Azure Vanguard</div>
          <div class="strength"><div class="fill" id="blueFill" style="width:100%"></div></div>
          <div style="display:flex;align-items:baseline;gap:8px;">
            <span class="count" id="blueCount">10</span><span class="sub">ships active</span>
          </div>
        </div>
        <div class="vs">
          <div class="label">FLEET</div>
          <div class="title">ENGAGEMENT</div>
        </div>
        <div class="fleet red">
          <div class="name">Crimson Armada<span class="dot"></span></div>
          <div class="strength"><div class="fill" id="redFill" style="width:100%"></div></div>
          <div style="display:flex;align-items:baseline;gap:8px;">
            <span class="sub">ships active</span><span class="count" id="redCount">10</span>
          </div>
        </div>
      </div>
    </div>

    <div class="result" id="result">
      <div class="verdict" id="verdict"></div>
      <div class="flavor" id="flavor"></div>
      <button class="btn" id="restartTop">Re-engage</button>
    </div>

    <div class="controls">
      <span><b>Drag</b> orbit</span>
      <span><b>Scroll</b> zoom</span>
      <span><b>Right-drag</b> pan</span>
      <span id="restartWrap" style="pointer-events:auto;cursor:pointer;"><b>R</b> restart</span>
    </div>
  </div>

  <div id="boot"><div class="ring"></div><div class="t">Spinning up engagement</div></div>
  <div id="err"></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
  "use strict";
  window.addEventListener("DOMContentLoaded", function () {
  try {

  // ======================================================================
  //  SETUP
  // ======================================================================
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false, stencil: true }, true);
  const scene  = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.01, 0.012, 0.03, 1);
  scene.autoClearDepthAndStencil = true;

  const V  = BABYLON.Vector3;
  const C3 = BABYLON.Color3;
  const C4 = BABYLON.Color4;
  const WORLD_UP = new V(0, 1, 0);

  // ---- Camera (orbit) ----
  const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2.3, 1.12, 190, V.Zero(), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 45;
  camera.upperRadiusLimit = 460;
  camera.wheelDeltaPercentage = 0.012;
  camera.pinchDeltaPercentage = 0.012;
  camera.panningSensibility = 55;
  camera.minZ = 0.4;
  camera.maxZ = 8000;
  camera.inertia = 0.82;
  camera.useAutoRotationBehavior = true;
  camera.autoRotationBehavior.idleRotationSpeed = 0.10;
  camera.autoRotationBehavior.idleRotationWaitTime = 3500;
  camera.autoRotationBehavior.idleRotationSpinupTime = 3000;

  // ---- Lights (kept few; effects rely on emissive + glow) ----
  const hemi = new BABYLON.HemisphericLight("hemi", new V(0.2, 1, 0.1), scene);
  hemi.intensity = 0.32;
  hemi.diffuse = new C3(0.7, 0.78, 0.95);
  hemi.groundColor = new C3(0.12, 0.08, 0.16);
  hemi.specular = new C3(0.2, 0.2, 0.25);

  const key = new BABYLON.DirectionalLight("key", new V(-0.5, -0.8, 0.4), scene);
  key.intensity = 0.85;
  key.diffuse = new C3(0.95, 0.96, 1.0);

  const rim = new BABYLON.DirectionalLight("rim", new V(0.7, 0.4, -0.6), scene);
  rim.intensity = 0.35;
  rim.diffuse = new C3(0.55, 0.6, 0.9);

  // Two soft engine lights that ride each flagship (assigned later).
  const flagLightBlue = new BABYLON.PointLight("fl-b", V.Zero(), scene);
  flagLightBlue.diffuse = new C3(0.25, 0.6, 1.0); flagLightBlue.intensity = 0; flagLightBlue.range = 60;
  const flagLightRed  = new BABYLON.PointLight("fl-r", V.Zero(), scene);
  flagLightRed.diffuse  = new C3(1.0, 0.45, 0.2);  flagLightRed.intensity  = 0; flagLightRed.range = 60;

  // ---- Glow ----
  const glow = new BABYLON.GlowLayer("glow", scene, { blurKernelSize: 32 });
  glow.intensity = 0.95;

  // ======================================================================
  //  HELPERS
  // ======================================================================
  const rand    = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick    = (arr) => arr[(Math.random() * arr.length) | 0];
  const clamp   = (x, a, b) => (x < a ? a : x > b ? b : x);

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  // Orientation quaternion so local +Z aligns to `forward`, local +Y ~ up (LH-safe, no lookAt sign traps).
  function quatLook(forward, up) {
    const f = forward.clone(); f.normalize();
    let u = up || WORLD_UP;
    let r = V.Cross(u, f);
    if (r.lengthSquared() < 1e-6) { u = Math.abs(f.y) > 0.9 ? new V(0, 0, 1) : new V(0, 1, 0); r = V.Cross(u, f); }
    r.normalize();
    const uu = V.Cross(f, r); uu.normalize();
    const m = BABYLON.Matrix.FromValues(
      r.x, r.y, r.z, 0,
      uu.x, uu.y, uu.z, 0,
      f.x, f.y, f.z, 0,
      0, 0, 0, 1
    );
    return BABYLON.Quaternion.FromRotationMatrix(m);
  }

  // Rotate vector v around unit axis by angle (Rodrigues).
  function rotateAround(v, axis, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    const cross = V.Cross(axis, v);
    const dot = V.Dot(axis, v);
    return v.scale(c).add(cross.scale(s)).add(axis.scale(dot * (1 - c)));
  }

  // Slerp between two direction vectors, capped at t.
  function slerpDir(a, b, t) {
    let d = clamp(V.Dot(a, b), -1, 1);
    if (d > 0.99995) return b.clone();
    const theta = Math.acos(d) * t;
    let rel = b.subtract(a.scale(d));
    if (rel.lengthSquared() < 1e-9) return b.clone();
    rel.normalize();
    return a.scale(Math.cos(theta)).add(rel.scale(Math.sin(theta)));
  }

  // ======================================================================
  //  PROCEDURAL TEXTURES
  // ======================================================================
  function makeGlowTex() {
    const s = 128;
    const t = new BABYLON.DynamicTexture("glowtex", { width: s, height: s }, scene, false);
    const c = t.getContext();
    const g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0.0, "rgba(255,255,255,1)");
    g.addColorStop(0.25, "rgba(255,255,255,0.85)");
    g.addColorStop(0.55, "rgba(255,255,255,0.35)");
    g.addColorStop(1.0, "rgba(255,255,255,0)");
    c.fillStyle = g; c.fillRect(0, 0, s, s);
    t.hasAlpha = true; t.update();
    return t;
  }
  const glowTex = makeGlowTex();

  function makeNebula() {
    const s = 2048;
    const t = new BABYLON.DynamicTexture("neb", { width: s, height: s }, scene, true);
    const c = t.getContext();
    // deep space base with a faint vertical gradient
    const bg = c.createLinearGradient(0, 0, 0, s);
    bg.addColorStop(0, "#04050d");
    bg.addColorStop(0.5, "#070610");
    bg.addColorStop(1, "#030409");
    c.fillStyle = bg; c.fillRect(0, 0, s, s);

    // nebula clouds (additive)
    const palette = ["#1b2f7a", "#3c1c74", "#12415f", "#57205e", "#0e3a66", "#6a2b46", "#203a86"];
    c.globalCompositeOperation = "lighter";
    for (let i = 0; i < 46; i++) {
      const x = Math.random() * s, y = Math.random() * s;
      const r = s * (0.05 + Math.random() * 0.24);
      const col = pick(palette);
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, hexA(col, 0.10 + Math.random() * 0.30));
      g.addColorStop(0.5, hexA(col, 0.05 + Math.random() * 0.12));
      g.addColorStop(1, hexA(col, 0));
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    }
    // a couple of denser cores
    for (let i = 0; i < 6; i++) {
      const x = Math.random() * s, y = Math.random() * s;
      const r = s * (0.03 + Math.random() * 0.06);
      const col = pick(["#5a6cff", "#b05cff", "#3fd0ff"]);
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, hexA(col, 0.22));
      g.addColorStop(1, hexA(col, 0));
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    }
    c.globalCompositeOperation = "source-over";

    // starfield
    for (let i = 0; i < 2600; i++) {
      const x = Math.random() * s, y = Math.random() * s;
      const b = Math.random();
      const rad = b * b * 1.7 + 0.25;
      c.fillStyle = `rgba(255,255,255,${0.35 + 0.65 * b})`;
      c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill();
    }
    // bright accent stars with a little bloom
    for (let i = 0; i < 60; i++) {
      const x = Math.random() * s, y = Math.random() * s;
      const rad = rand(1.5, 3.2);
      const tint = pick(["255,255,255", "180,210,255", "255,225,200"]);
      const g = c.createRadialGradient(x, y, 0, x, y, rad * 4);
      g.addColorStop(0, `rgba(${tint},0.9)`);
      g.addColorStop(1, `rgba(${tint},0)`);
      c.fillStyle = g; c.beginPath(); c.arc(x, y, rad * 4, 0, 7); c.fill();
      c.fillStyle = `rgba(${tint},1)`; c.beginPath(); c.arc(x, y, rad * 0.6, 0, 7); c.fill();
    }
    t.update();
    return t;
  }

  const bg = BABYLON.MeshBuilder.CreateSphere("bg", { diameter: 4000, segments: 40, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
  const bgMat = new BABYLON.StandardMaterial("bgMat", scene);
  bgMat.emissiveTexture = makeNebula();
  bgMat.disableLighting = true;
  bgMat.backFaceCulling = false;
  bg.material = bgMat;
  bg.infiniteDistance = true;
  bg.isPickable = false;
  glow.addExcludedMesh(bg);

  // ======================================================================
  //  TEAM CONFIG + SHARED MATERIALS
  // ======================================================================
  function stdEmissive(name, color, alpha) {
    const m = new BABYLON.StandardMaterial(name, scene);
    m.emissiveColor = color;
    m.diffuseColor = new C3(0, 0, 0);
    m.specularColor = new C3(0, 0, 0);
    m.disableLighting = true;
    if (alpha !== undefined) { m.alpha = alpha; }
    m.backFaceCulling = false;
    return m;
  }

  const hullMat = new BABYLON.StandardMaterial("hull", scene);
  hullMat.diffuseColor = new C3(0.34, 0.37, 0.44);
  hullMat.specularColor = new C3(0.5, 0.55, 0.65);
  hullMat.specularPower = 48;
  hullMat.emissiveColor = new C3(0.03, 0.035, 0.05);
  hullMat.maxSimultaneousLights = 6;

  const debrisMat = new BABYLON.StandardMaterial("debris", scene);
  debrisMat.diffuseColor = new C3(0.28, 0.29, 0.33);
  debrisMat.emissiveColor = new C3(0.9, 0.4, 0.12);
  debrisMat.specularColor = new C3(0.4, 0.4, 0.4);
  debrisMat.maxSimultaneousLights = 6;

  const shockMat = stdEmissive("shock", new C3(1, 0.95, 0.8));
  const flashMat = stdEmissive("flash", new C3(1, 0.98, 0.9));

  const TEAMS = {
    blue: {
      key: "blue",
      accent: stdEmissive("acc-b", new C3(0.35, 0.7, 1.0)),
      engine: stdEmissive("eng-b", new C3(0.45, 0.82, 1.0)),
      proj:   stdEmissive("proj-b", new C3(0.4, 0.72, 1.0)),
      trail:  stdEmissive("trail-b", new C3(0.35, 0.68, 1.0), 0.5),
      projC1: new C4(0.6, 0.85, 1.0, 1), projC2: new C4(0.2, 0.5, 1.0, 1),
      engC1:  new C4(0.55, 0.85, 1.0, 1), engC2: new C4(0.2, 0.45, 1.0, 0.6),
      light:  flagLightBlue,
    },
    red: {
      key: "red",
      accent: stdEmissive("acc-r", new C3(1.0, 0.4, 0.32)),
      engine: stdEmissive("eng-r", new C3(1.0, 0.5, 0.2)),
      proj:   stdEmissive("proj-r", new C3(1.0, 0.35, 0.28)),
      trail:  stdEmissive("trail-r", new C3(1.0, 0.3, 0.24), 0.5),
      projC1: new C4(1.0, 0.6, 0.4, 1), projC2: new C4(1.0, 0.2, 0.15, 1),
      engC1:  new C4(1.0, 0.6, 0.25, 1), engC2: new C4(1.0, 0.25, 0.1, 0.6),
      light:  flagLightRed,
    },
  };

  // ======================================================================
  //  SHIP GEOMETRY
  // ======================================================================
  function coneZ(name, dBottom, len, tess) {
    const c = BABYLON.MeshBuilder.CreateCylinder(name, { diameterTop: 0, diameterBottom: dBottom, height: len, tessellation: tess || 14 }, scene);
    c.rotation.x = Math.PI / 2;           // point along +Z
    c.bakeCurrentTransformIntoVertices();
    return c;
  }
  function box(name, w, h, d) { return BABYLON.MeshBuilder.CreateBox(name, { width: w, height: h, depth: d }, scene); }

  // Returns { root, engineNodes:[Vector3 local], noseZ, size, emitterMesh }
  function buildEscort(team) {
    const root = new BABYLON.TransformNode("escort", scene);
    const parts = [];

    const body = box("b", 1.15, 0.7, 3.2); parts.push(body);
    const nose = coneZ("n", 1.05, 1.7); nose.position.z = 2.35; parts.push(nose);
    const spineTop = box("st", 0.5, 0.4, 2.2); spineTop.position.y = 0.5; spineTop.position.z = -0.1; parts.push(spineTop);

    // swept wings (mirror pair) with slight dihedral
    for (const sgn of [-1, 1]) {
      const w = box("w", 1.9, 0.12, 1.0);
      w.position.set(sgn * 1.35, -0.02, -0.35);
      w.rotation.z = sgn * -0.18;
      w.rotation.y = sgn * 0.28;
      parts.push(w);
      const tip = box("wt", 0.18, 0.4, 0.7);
      tip.position.set(sgn * 2.15, 0.05, -0.5);
      parts.push(tip);
    }
    const tail = box("t", 0.16, 0.85, 0.7); tail.position.set(0, 0.55, -1.45); parts.push(tail);

    const hull = BABYLON.Mesh.MergeMeshes(parts, true, true, undefined, false, false);
    hull.material = hullMat;
    hull.parent = root;

    // cockpit accent (glowing team color)
    const cock = BABYLON.MeshBuilder.CreateSphere("cock", { diameterX: 0.55, diameterY: 0.4, diameterZ: 0.9, segments: 8 }, scene);
    cock.position.set(0, 0.34, 1.05); cock.material = team.accent; cock.parent = root;

    // engine glow pods (x2)
    const engineNodes = [];
    for (const sgn of [-1, 1]) {
      const e = BABYLON.MeshBuilder.CreateCylinder("e", { diameterTop: 0.42, diameterBottom: 0.5, height: 0.35, tessellation: 12 }, scene);
      e.rotation.x = Math.PI / 2;
      e.position.set(sgn * 0.4, -0.02, -1.75);
      e.material = team.engine; e.parent = root;
      engineNodes.push(new V(sgn * 0.4, -0.02, -1.9));
    }

    const emitter = BABYLON.MeshBuilder.CreateDisc("em", { radius: 0.05 }, scene);
    emitter.isVisible = false; emitter.parent = root; emitter.position.set(0, -0.02, -1.85);

    return { root, engineNodes, noseZ: 3.1, size: 3.0, emitter };
  }

  function buildFlagship(team) {
    const root = new BABYLON.TransformNode("flag", scene);
    const parts = [];

    const hullBody = box("fb", 3.4, 2.3, 12.5); parts.push(hullBody);
    const belly = box("fl", 4.2, 1.1, 8.5); belly.position.y = -0.9; parts.push(belly);
    const prow = coneZ("fp", 3.0, 4.2, 18); prow.position.z = 8.3; parts.push(prow);
    const prowLo = box("fpl", 2.2, 0.9, 3.2); prowLo.position.set(0, -0.9, 6.6); parts.push(prowLo);

    // stepped command tower toward the rear
    const t1 = box("t1", 2.0, 1.1, 3.4); t1.position.set(0, 1.5, -2.2); parts.push(t1);
    const t2 = box("t2", 1.4, 1.0, 2.2); t2.position.set(0, 2.5, -2.6); parts.push(t2);
    const t3 = box("t3", 0.8, 0.8, 1.2); t3.position.set(0, 3.3, -2.9); parts.push(t3);
    const bridge = box("br", 2.2, 0.6, 1.0); bridge.position.set(0, 1.35, -0.4); parts.push(bridge);

    // side sponsons / nacelle struts
    for (const sgn of [-1, 1]) {
      const spon = box("sp", 1.0, 1.4, 9.0); spon.position.set(sgn * 2.4, 0, -0.5); parts.push(spon);
      const nac = BABYLON.MeshBuilder.CreateCylinder("nc", { diameter: 1.3, height: 4.2, tessellation: 12 }, scene);
      nac.rotation.x = Math.PI / 2; nac.position.set(sgn * 2.4, 0, -3.6); parts.push(nac);
      const fin = box("ffin", 0.14, 2.0, 2.2); fin.position.set(sgn * 2.4, 1.2, -5.4); fin.rotation.z = sgn * 0.15; parts.push(fin);
    }

    // greebles along the hull
    for (let i = 0; i < 26; i++) {
      const g = box("g", rand(0.3, 0.9), rand(0.2, 0.5), rand(0.4, 1.2));
      const side = pick([-1, 1]);
      g.position.set(side * rand(1.4, 1.9), rand(-0.9, 1.0), rand(-5, 6));
      parts.push(g);
    }
    // dorsal antennae
    for (let i = 0; i < 3; i++) {
      const a = BABYLON.MeshBuilder.CreateCylinder("an", { diameter: 0.08, height: rand(1.2, 2.2), tessellation: 6 }, scene);
      a.position.set(rand(-0.6, 0.6), 3.4 + rand(0, 0.4), rand(-1, 2)); parts.push(a);
    }

    const hull = BABYLON.Mesh.MergeMeshes(parts, true, true, undefined, false, false);
    hull.material = hullMat;
    hull.parent = root;

    // bridge windows accent strip
    const strip = box("wins", 1.9, 0.18, 0.9); strip.position.set(0, 1.55, 0.15);
    strip.material = team.accent; strip.parent = root;
    const eyeL = BABYLON.MeshBuilder.CreateSphere("eye", { diameter: 0.4, segments: 8 }, scene);
    eyeL.position.set(0, 1.0, 8.9); eyeL.material = team.accent; eyeL.parent = root;

    // engine banks (glowing) + emit points
    const engineNodes = [];
    const engY = [-0.5, 0.6];
    const engX = [-2.4, 0, 2.4];
    for (const ex of engX) {
      for (const ey of engY) {
        const e = BABYLON.MeshBuilder.CreateCylinder("fe", { diameterTop: 0.7, diameterBottom: 0.85, height: 0.5, tessellation: 14 }, scene);
        e.rotation.x = Math.PI / 2;
        e.position.set(ex, ey, -6.5);
        e.material = team.engine; e.parent = root;
        engineNodes.push(new V(ex, ey, -6.9));
      }
    }
    const emitter = BABYLON.MeshBuilder.CreateDisc("fem", { radius: 0.05 }, scene);
    emitter.isVisible = false; emitter.parent = root; emitter.position.set(0, 0, -6.8);

    return { root, engineNodes, noseZ: 10.4, size: 8.2, emitter };
  }

  // ======================================================================
  //  STATE
  // ======================================================================
  const FIRE_INTERVAL = 3.0;
  const PROJ_SPEED    = 92;
  const PROJ_LIFE     = 3.2;
  const BOUNDS        = 135;

  let ships = [];
  let projectiles = [];
  let effects = [];
  let transient = new Set();   // one-shot particle systems, force-cleaned
  let elapsed = 0;
  let battleOver = false;

  function safeDispose(o) {
    try { if (o && !o._killed) { o._killed = true; o.dispose(); } } catch (e) {}
    transient.delete(o);
  }

  // ---- One-shot particle burst ----
  function burst(pos, cfg) {
    const ps = new BABYLON.ParticleSystem(cfg.name || "b", cfg.capacity || cfg.count + 20, scene);
    ps.particleTexture = glowTex;
    ps.emitter = pos.clone();
    ps.minEmitBox = new V(-cfg.spawn || 0, -cfg.spawn || 0, -cfg.spawn || 0);
    ps.maxEmitBox = new V(cfg.spawn || 0, cfg.spawn || 0, cfg.spawn || 0);
    ps.color1 = cfg.c1; ps.color2 = cfg.c2; ps.colorDead = cfg.cd || new C4(0, 0, 0, 0);
    ps.minSize = cfg.sizeMin; ps.maxSize = cfg.sizeMax;
    ps.minLifeTime = cfg.lifeMin; ps.maxLifeTime = cfg.lifeMax;
    ps.emitRate = cfg.count / 0.06;
    ps.targetStopDuration = 0.06;
    ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    ps.gravity = cfg.gravity || V.Zero();
    ps.direction1 = new V(-1, -1, -1); ps.direction2 = new V(1, 1, 1);
    ps.minEmitPower = cfg.powMin; ps.maxEmitPower = cfg.powMax;
    ps.minAngularSpeed = 0; ps.maxAngularSpeed = Math.PI;
    ps.disposeOnStop = true;
    ps.start();
    transient.add(ps);
    setTimeout(() => safeDispose(ps), (cfg.lifeMax + 0.6) * 1000);
    return ps;
  }

  // ======================================================================
  //  EFFECTS (updated each frame)
  // ======================================================================
  function addShockwave(pos, size) {
    const ring = BABYLON.MeshBuilder.CreateTorus("sw", { diameter: 1, thickness: 0.08, tessellation: 40 }, scene);
    ring.material = shockMat;
    ring.position.copyFrom(pos);
    ring.rotationQuaternion = BABYLON.Quaternion.FromEulerAngles(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
    ring.isPickable = false;
    const life = 0.42, to = size * 4.5;
    effects.push({
      update(dt, age) {
        const t = age / life;
        if (t >= 1) { ring.dispose(); return false; }
        const e = 1 - Math.pow(1 - t, 3);
        const s = 0.4 + (to - 0.4) * e;
        ring.scaling.set(s, s, s * 0.4);
        ring.visibility = 1 - t;
        return true;
      }, age: 0,
      dispose() { try { ring.dispose(); } catch (e) {} }
    });
  }

  function addFlashSphere(pos, size) {
    const sp = BABYLON.MeshBuilder.CreateSphere("fs", { diameter: 1, segments: 12 }, scene);
    sp.material = flashMat; sp.position.copyFrom(pos); sp.isPickable = false;
    const life = 0.2, to = size * 1.9;
    effects.push({
      update(dt, age) {
        const t = age / life;
        if (t >= 1) { sp.dispose(); return false; }
        const s = 0.4 + (to - 0.4) * Math.sqrt(t);
        sp.scaling.set(s, s, s);
        sp.visibility = 1 - t;
        return true;
      }, age: 0,
      dispose() { try { sp.dispose(); } catch (e) {} }
    });
  }

  function addDebris(pos, size, count) {
    for (let i = 0; i < count; i++) {
      let d;
      if (Math.random() < 0.5) d = box("d", rand(0.2, 0.6) * size * 0.25, rand(0.2, 0.6) * size * 0.25, rand(0.3, 0.9) * size * 0.25);
      else d = BABYLON.MeshBuilder.CreatePolyhedron("d", { type: randInt(0, 4), size: rand(0.15, 0.4) * size * 0.3 }, scene);
      d.material = debrisMat;
      d.position.copyFrom(pos);
      d.rotation = new V(rand(0, 6), rand(0, 6), rand(0, 6));
      d.isPickable = false;
      const dir = new V(rand(-1, 1), rand(-1, 1), rand(-1, 1)); dir.normalize();
      const vel = dir.scale(rand(6, 16) * (0.6 + size * 0.05));
      const spin = new V(rand(-6, 6), rand(-6, 6), rand(-6, 6));
      const life = rand(1.0, 1.9);
      effects.push({
        update(dt, age) {
          const t = age / life;
          if (t >= 1) { try { d.dispose(); } catch (e) {} return false; }
          vel.scaleInPlace(1 - dt * 0.6);
          vel.y -= dt * 2.0;
          d.position.addInPlace(vel.scale(dt));
          d.rotation.x += spin.x * dt; d.rotation.y += spin.y * dt; d.rotation.z += spin.z * dt;
          if (t > 0.6) d.visibility = 1 - (t - 0.6) / 0.4;
          return true;
        }, age: 0,
        dispose() { try { d.dispose(); } catch (e) {} }
      });
    }
  }

  function explode(pos, size, team) {
    addFlashSphere(pos, size);
    addShockwave(pos, size);
    if (size > 5) addShockwave(pos, size * 0.7);

    // fireball
    burst(pos, {
      name: "fire", count: Math.min(90, 40 + size * 8), capacity: 220,
      spawn: size * 0.15,
      c1: new C4(1, 0.92, 0.55, 1), c2: new C4(1, 0.4, 0.12, 1), cd: new C4(0.35, 0.05, 0.0, 0),
      sizeMin: size * 0.5, sizeMax: size * 1.5,
      lifeMin: 0.25, lifeMax: 0.7,
      powMin: size * 1.2, powMax: size * 4.5,
      gravity: V.Zero(),
    });
    // hot core
    burst(pos, {
      name: "core", count: 30, capacity: 60, spawn: 0,
      c1: new C4(1, 1, 0.95, 1), c2: new C4(1, 0.85, 0.5, 1), cd: new C4(1, 0.4, 0.1, 0),
      sizeMin: size * 0.4, sizeMax: size * 1.1, lifeMin: 0.15, lifeMax: 0.35,
      powMin: 0, powMax: size * 1.5,
    });
    // sparks
    burst(pos, {
      name: "spark", count: Math.min(140, 60 + size * 10), capacity: 260, spawn: 0,
      c1: new C4(1, 1, 0.85, 1), c2: new C4(1, 0.7, 0.3, 1), cd: new C4(0.6, 0.2, 0.0, 0),
      sizeMin: size * 0.06, sizeMax: size * 0.22, lifeMin: 0.4, lifeMax: 1.1,
      powMin: size * 4, powMax: size * 12,
      gravity: new V(0, -6, 0),
    });
    addDebris(pos, size, Math.min(16, 6 + Math.floor(size)));
  }

  // ======================================================================
  //  PROJECTILE
  // ======================================================================
  function spawnProjectile(team, position, direction, damage) {
    if (projectiles.length > 260) return;
    const dir = direction.clone(); dir.normalize();

    const mesh = BABYLON.MeshBuilder.CreateSphere("p", { diameter: 0.55, segments: 8 }, scene);
    mesh.scaling.z = 2.6;
    mesh.material = team.proj;
    mesh.position.copyFrom(position);
    mesh.rotationQuaternion = quatLook(dir, WORLD_UP);
    mesh.isPickable = false;

    const trail = new BABYLON.TrailMesh("pt", mesh, scene, 0.4, 42, true);
    trail.material = team.trail;

    projectiles.push({
      mesh, trail, team,
      vel: dir.scale(PROJ_SPEED),
      life: PROJ_LIFE,
      dmg: damage,
      dispose() { safeDispose(this.trail); safeDispose(this.mesh); },
    });
  }

  function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.mesh.position.addInPlace(p.vel.scale(dt));
      p.life -= dt;

      let hit = false;
      if (p.mesh.position.lengthSquared() > (BOUNDS * 1.4) * (BOUNDS * 1.4)) hit = true;

      if (!hit) {
        for (let j = 0; j < ships.length; j++) {
          const s = ships[j];
          if (!s.alive || s.team === p.team) continue;
          const rr = s.size * 0.55 + 0.7;
          if (V.DistanceSquared(p.mesh.position, s.root.position) < rr * rr) {
            s.takeDamage(p.dmg, p.mesh.position.clone());
            // impact sparks
            burst(p.mesh.position.clone(), {
              name: "imp", count: 22, capacity: 40, spawn: 0,
              c1: p.team.projC1, c2: p.team.projC2, cd: new C4(0, 0, 0, 0),
              sizeMin: 0.15, sizeMax: 0.5, lifeMin: 0.15, lifeMax: 0.4,
              powMin: 3, powMax: 12,
            });
            hit = true;
            break;
          }
        }
      }
      if (hit || p.life <= 0) { p.dispose(); projectiles.splice(i, 1); }
    }
  }

  // ======================================================================
  //  SHIP
  // ======================================================================
  class Ship {
    constructor(team, isFlagship, position) {
      this.team = team;
      this.isFlagship = isFlagship;
      const g = isFlagship ? buildFlagship(team) : buildEscort(team);
      this.root = g.root;
      this.engineNodes = g.engineNodes;
      this.noseZ = g.noseZ;
      this.size = g.size;
      this.emitter = g.emitter;

      this.root.position.copyFrom(position);
      this.maxHp = isFlagship ? 340 : 50;
      this.hp = this.maxHp;
      this.alive = true;

      this.maxSpeed = isFlagship ? 11 : rand(17, 22);
      this.speed = this.maxSpeed * 0.6;
      this.turnRate = isFlagship ? 0.5 : rand(1.5, 2.1);
      this.forward = new V(0, 0, 1);
      this.bank = 0;
      this.swirlAxis = new V(rand(-1, 1), rand(-0.5, 1), rand(-1, 1)); this.swirlAxis.normalize();
      this.swirlSign = pick([-1, 1]);
      this.vPhase = rand(0, 6.28); this.vFreq = rand(0.3, 0.7);
      this.standoff = isFlagship ? 48 : rand(18, 28);

      this.fireCd = rand(0, FIRE_INTERVAL);
      this.target = null;
      this.retarget = 0;
      this.huntsFlagship = !isFlagship && Math.random() < 0.35;
      this.wander = randPointInSphere(55);

      // health bar
      this.hbW = isFlagship ? 9 : 2.6;
      this.hbTex = new BABYLON.DynamicTexture("hb", { width: 220, height: 34 }, scene, false);
      this.hbTex.hasAlpha = true;
      const hbMat = new BABYLON.StandardMaterial("hbMat", scene);
      hbMat.emissiveTexture = this.hbTex;
      hbMat.opacityTexture = this.hbTex;
      hbMat.disableLighting = true;
      hbMat.backFaceCulling = false;
      this.hbPlane = BABYLON.MeshBuilder.CreatePlane("hbp", { width: this.hbW, height: this.hbW * 0.155 }, scene);
      this.hbPlane.material = hbMat;
      this.hbPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      this.hbPlane.isPickable = false;
      this.hbYoff = this.size * (isFlagship ? 0.55 : 1.0) + 2.2;
      glow.addExcludedMesh(this.hbPlane);
      this.drawHealth();

      // thruster plume
      this.thrust = new BABYLON.ParticleSystem("thr", isFlagship ? 260 : 90, scene);
      this.thrust.particleTexture = glowTex;
      this.thrust.emitter = this.emitter;
      this.thrust.isLocal = true;
      const spread = isFlagship ? 2.6 : 0.7;
      this.thrust.minEmitBox = new V(-spread, -0.3, 0);
      this.thrust.maxEmitBox = new V(spread, 0.3, 0);
      this.thrust.color1 = team.engC1;
      this.thrust.color2 = team.engC2;
      this.thrust.colorDead = new C4(0, 0, 0, 0);
      this.thrust.minSize = isFlagship ? 0.7 : 0.28;
      this.thrust.maxSize = isFlagship ? 1.8 : 0.7;
      this.thrust.minLifeTime = 0.12; this.thrust.maxLifeTime = 0.32;
      this.thrust.emitRate = isFlagship ? 260 : 90;
      this.thrust.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
      this.thrust.direction1 = new V(0, 0, -1);
      this.thrust.direction2 = new V(0, 0, -1);
      this.thrust.minEmitPower = isFlagship ? 6 : 4;
      this.thrust.maxEmitPower = isFlagship ? 12 : 8;
      this.thrust.start();
    }

    drawHealth() {
      const ctx = this.hbTex.getContext();
      const W = 220, H = 34, pad = 6, bw = W - pad * 2, bh = H - pad * 2;
      ctx.clearRect(0, 0, W, H);
      // frame
      ctx.fillStyle = "rgba(6,10,18,0.72)";
      roundRect(ctx, pad - 3, pad - 3, bw + 6, bh + 6, 6); ctx.fill();
      ctx.fillStyle = "rgba(20,26,38,0.9)";
      roundRect(ctx, pad, pad, bw, bh, 4); ctx.fill();
      const frac = clamp(this.hp / this.maxHp, 0, 1);
      let col;
      if (frac > 0.55) col = "#43e08a";
      else if (frac > 0.28) col = "#ffd23f";
      else col = "#ff5347";
      ctx.fillStyle = col;
      if (frac > 0) { roundRect(ctx, pad, pad, Math.max(3, bw * frac), bh, 4); ctx.fill(); }
      // team tick on the side
      ctx.fillStyle = this.team.key === "blue" ? "#38a8ff" : "#ff4d47";
      ctx.fillRect(pad, pad, 3, bh);
      this.hbTex.update();
    }

    takeDamage(d, at) {
      if (!this.alive) return;
      this.hp -= d;
      this.drawHealth();
      if (this.hp <= 0) killShip(this);
    }

    updateEngineLight() {
      if (!this.isFlagship) return;
      const rear = V.TransformCoordinates(new V(0, 0, -7.5), this.root.getWorldMatrix());
      this.team.light.position.copyFrom(rear);
      this.team.light.intensity = 1.6;
    }

    steer() {
      const pos = this.root.position;
      let desired = new V(0, 0, 0);

      const tgt = this.target;
      if (tgt && tgt.alive) {
        const to = tgt.root.position.subtract(pos);
        const dist = to.length() || 0.001;
        const dir = to.scale(1 / dist);
        const closeness = clamp((this.standoff - dist) / this.standoff, -1, 1); // >0 too close

        let swirl = V.Cross(dir, this.swirlAxis);
        if (swirl.lengthSquared() < 1e-4) swirl = V.Cross(dir, new V(1, 0, 0));
        swirl.normalize(); swirl.scaleInPlace(this.swirlSign);

        const approachW = 1 - Math.max(0, closeness);
        const swirlW = 0.55 + Math.max(0, closeness) * 0.9;
        const pushW = Math.max(0, closeness) * 0.9;
        desired.addInPlace(dir.scale(approachW));
        desired.addInPlace(swirl.scale(swirlW));
        desired.subtractInPlace(dir.scale(pushW));
      } else {
        const to = this.wander.subtract(pos);
        if (to.lengthSquared() < 100) this.wander = randPointInSphere(60);
        to.normalize(); desired.addInPlace(to.scale(0.8));
      }

      // vertical weave -> genuine 3D motion
      desired.y += Math.sin(elapsed * this.vFreq + this.vPhase) * 0.35;

      // separation from neighbours
      let sep = new V(0, 0, 0);
      for (let i = 0; i < ships.length; i++) {
        const o = ships[i];
        if (o === this || !o.alive) continue;
        const off = pos.subtract(o.root.position);
        const dsq = off.lengthSquared();
        const minD = (this.size + o.size) * 0.9;
        if (dsq < minD * minD && dsq > 1e-3) sep.addInPlace(off.scale(minD / dsq));
      }
      if (sep.lengthSquared() > 1e-4) { sep.normalize(); desired.addInPlace(sep.scale(0.7)); }

      // soft boundary
      const r = pos.length();
      if (r > BOUNDS * 0.78) {
        const inward = pos.scale(-1 / (r || 1));
        desired.addInPlace(inward.scale(((r - BOUNDS * 0.78) / (BOUNDS * 0.22)) * 1.4));
      }

      if (desired.lengthSquared() < 1e-6) desired = this.forward.clone();
      desired.normalize();
      return desired;
    }

    update(dt) {
      // targeting
      this.retarget -= dt;
      if (this.retarget <= 0 || !this.target || !this.target.alive) {
        this.target = pickTarget(this);
        this.retarget = rand(0.4, 0.8);
      }

      const desired = this.steer();

      // turn toward desired (capped)
      const angle = Math.acos(clamp(V.Dot(this.forward, desired), -1, 1));
      if (angle > 1e-4) {
        const maxStep = this.turnRate * dt;
        this.forward = slerpDir(this.forward, desired, Math.min(1, maxStep / angle));
        this.forward.normalize();
      }

      // banking from how hard we are turning sideways
      const rightNow = V.Cross(WORLD_UP, this.forward);
      let side = 0;
      if (rightNow.lengthSquared() > 1e-6) { rightNow.normalize(); side = V.Dot(desired, rightNow); }
      const bankTarget = clamp(-side * 1.6, -0.9, 0.9);
      this.bank += (bankTarget - this.bank) * Math.min(1, dt * 4);

      // move
      this.speed += (this.maxSpeed - this.speed) * Math.min(1, dt * 1.5);
      this.root.position.addInPlace(this.forward.scale(this.speed * dt));

      // orient
      const upB = rotateAround(WORLD_UP, this.forward, this.bank);
      this.root.rotationQuaternion = quatLook(this.forward, upB);

      // health bar follow
      this.hbPlane.position.copyFrom(this.root.position);
      this.hbPlane.position.y += this.hbYoff;

      this.updateEngineLight();

      // firing
      this.fireCd -= dt;
      if (this.fireCd <= 0 && this.target && this.target.alive) {
        this.fireCd = FIRE_INTERVAL + rand(-0.15, 0.15);
        this.fire();
      }
    }

    muzzle(offsetX) {
      return V.TransformCoordinates(new V(offsetX, 0, this.noseZ), this.root.getWorldMatrix());
    }

    aimDir(from) {
      const t = this.target;
      const lead = V.Distance(from, t.root.position) / PROJ_SPEED;
      const predicted = t.root.position.add(t.velEstimate ? t.velEstimate.scale(lead) : t.forward.scale(t.speed * lead));
      const d = predicted.subtract(from); d.normalize();
      // small inaccuracy
      const spread = this.isFlagship ? 0.02 : 0.045;
      d.x += rand(-spread, spread); d.y += rand(-spread, spread); d.z += rand(-spread, spread);
      d.normalize();
      return d;
    }

    fire() {
      const dmg = this.isFlagship ? 26 : 15;
      if (this.isFlagship) {
        const mL = this.muzzle(-2.2), mR = this.muzzle(2.2);
        spawnProjectile(this.team, mL, this.aimDir(mL), dmg);
        spawnProjectile(this.team, mR, this.aimDir(mR), dmg);
      } else {
        const m = this.muzzle(0);
        spawnProjectile(this.team, m, this.aimDir(m), dmg);
      }
    }

    destroyVisuals() {
      safeDispose(this.thrust);
      safeDispose(this.hbPlane);
      // dispose children then root
      const kids = this.root.getChildMeshes();
      kids.forEach((k) => safeDispose(k));
      safeDispose(this.root);
    }
  }

  // velocity estimate for lead aiming
  function trackVelocities(dt) {
    for (const s of ships) {
      if (!s._prevPos) { s._prevPos = s.root.position.clone(); s.velEstimate = new V(0, 0, 0); continue; }
      s.velEstimate = s.root.position.subtract(s._prevPos).scale(1 / Math.max(dt, 1e-3));
      s._prevPos.copyFrom(s.root.position);
    }
  }

  function pickTarget(ship) {
    let best = null, bestScore = Infinity;
    let enemyFlag = null;
    for (const s of ships) {
      if (!s.alive || s.team === ship.team) continue;
      if (s.isFlagship) enemyFlag = s;
      const dsq = V.DistanceSquared(ship.root.position, s.root.position);
      if (dsq < bestScore) { bestScore = dsq; best = s; }
    }
    if (ship.huntsFlagship && enemyFlag) return enemyFlag;
    return best;
  }

  // ======================================================================
  //  KILL + CHAIN REACTION
  // ======================================================================
  function killShip(ship) {
    if (!ship.alive) return;
    ship.alive = false;

    const pos = ship.root.position.clone();
    const size = ship.size;
    const team = ship.team;

    const idx = ships.indexOf(ship);
    if (idx >= 0) ships.splice(idx, 1);

    // reset flagship light if it was this ship
    if (ship.isFlagship) team.light.intensity = 0;

    ship.destroyVisuals();
    explode(pos, size, team);
    updateHUD();
    checkVictory();

    // chain: anything within ~one ship-width of the blast detonates
    const chainR = size * 1.35;
    for (const s of ships) {
      if (!s.alive) continue;
      const reach = chainR + s.size * 0.4;
      if (V.DistanceSquared(pos, s.root.position) < reach * reach) {
        const victim = s;
        setTimeout(() => { if (victim.alive && ships.indexOf(victim) >= 0) killShip(victim); }, rand(60, 200));
      }
    }
  }

  // ======================================================================
  //  FLEET CREATION
  // ======================================================================
  function randPointInSphere(r) {
    const d = new V(rand(-1, 1), rand(-1, 1), rand(-1, 1));
    if (d.lengthSquared() < 1e-4) d.set(0, 0, 1);
    d.normalize();
    return d.scale(r * Math.cbrt(Math.random()));
  }

  function fibSphere(n, radius) {
    const pts = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const y = 1 - (i / (n - 1)) * 2;
      const rr = Math.sqrt(Math.max(0, 1 - y * y));
      const th = i * golden;
      pts.push(new V(Math.cos(th) * rr * radius, y * radius * 0.6, Math.sin(th) * rr * radius));
    }
    return pts;
  }

  function createFleet(team, center, faceTarget) {
    // flagship at formation core
    const flag = new Ship(team, true, center.clone());
    ships.push(flag);
    // escorts on a spherical shell
    const offs = fibSphere(9, 24);
    for (let i = 0; i < 9; i++) {
      const p = center.add(offs[i]).add(new V(rand(-4, 4), rand(-4, 4), rand(-4, 4)));
      const e = new Ship(team, false, p);
      ships.push(e);
    }
    // initial heading toward the enemy
    for (const s of ships.filter((x) => x.team === team)) {
      const dir = faceTarget.subtract(s.root.position);
      dir.addInPlace(new V(rand(-8, 8), rand(-8, 8), rand(-8, 8)));
      dir.normalize();
      s.forward = dir;
      s.root.rotationQuaternion = quatLook(dir, WORLD_UP);
    }
  }

  function clearAll() {
    for (const s of ships) { s.alive = false; s.destroyVisuals(); }
    ships = [];
    for (const p of projectiles) p.dispose();
    projectiles = [];
    for (const e of effects) { if (e.dispose) e.dispose(); }
    effects = [];
    Array.from(transient).forEach(safeDispose);
    transient.clear();
    flagLightBlue.intensity = 0; flagLightRed.intensity = 0;
  }

  function startBattle() {
    clearAll();
    battleOver = false;
    document.getElementById("result").classList.remove("show");
    createFleet(TEAMS.blue, new V(-72, 6, -8), new V(72, 0, 0));
    createFleet(TEAMS.red,  new V(72, -6, 8),  new V(-72, 0, 0));
    updateHUD();
  }

  // ======================================================================
  //  HUD
  // ======================================================================
  const el = (id) => document.getElementById(id);
  function counts() {
    let b = 0, r = 0;
    for (const s of ships) { if (!s.alive) continue; s.team.key === "blue" ? b++ : r++; }
    return { b, r };
  }
  function updateHUD() {
    const c = counts();
    el("blueCount").textContent = c.b;
    el("redCount").textContent = c.r;
    el("blueFill").style.width = (c.b / 10 * 100) + "%";
    el("redFill").style.width = (c.r / 10 * 100) + "%";
  }
  function checkVictory() {
    if (battleOver) return;
    const c = counts();
    if (c.b === 0 || c.r === 0) {
      battleOver = true;
      const blueWins = c.r === 0 && c.b > 0;
      const draw = c.b === 0 && c.r === 0;
      const v = el("verdict"), f = el("flavor");
      if (draw) {
        v.textContent = "MUTUAL\nDESTRUCTION"; v.style.color = "#cbd6e2";
        f.textContent = "No survivors on either side";
      } else if (blueWins) {
        v.textContent = "AZURE VANGUARD\nPREVAILS"; v.style.color = "var(--blue)";
        f.textContent = c.b + " ship" + (c.b > 1 ? "s" : "") + " remaining";
      } else {
        v.textContent = "CRIMSON ARMADA\nPREVAILS"; v.style.color = "var(--red)";
        f.textContent = c.r + " ship" + (c.r > 1 ? "s" : "") + " remaining";
      }
      v.style.whiteSpace = "pre-line";
      setTimeout(() => el("result").classList.add("show"), 700);
    }
  }

  el("restartTop").addEventListener("click", startBattle);
  el("restartWrap").addEventListener("click", startBattle);
  window.addEventListener("keydown", (e) => { if (e.key === "r" || e.key === "R") startBattle(); });

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ======================================================================
  //  MAIN LOOP
  // ======================================================================
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
    elapsed += dt;
    bg.rotation.y += dt * 0.006;

    trackVelocities(dt);

    const snap = ships.slice();
    for (const s of snap) { if (s.alive) s.update(dt); }

    updateProjectiles(dt);

    for (let i = effects.length - 1; i >= 0; i--) {
      const fx = effects[i];
      fx.age += dt;
      if (!fx.update(dt, fx.age)) effects.splice(i, 1);
    }
  });

  engine.runRenderLoop(() => scene.render());
  window.addEventListener("resize", () => engine.resize());

  // ---- go ----
  startBattle();
  scene.executeWhenReady(() => {
    const boot = document.getElementById("boot");
    boot.classList.add("fade-out");
    setTimeout(() => boot.remove(), 700);
  });

  } catch (err) {
    const e = document.getElementById("err");
    e.style.display = "flex";
    e.innerHTML = "Failed to start the scene.<br><br>" + (err && err.message ? err.message : err) +
      "<br><br>This scene needs WebGL and loads Babylon.js from a CDN — check your connection.";
    const boot = document.getElementById("boot"); if (boot) boot.style.display = "none";
    console.error(err);
  }
  });
  </script>
</body>
</html>
