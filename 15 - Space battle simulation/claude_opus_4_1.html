<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Space Battle - 3D Fleet Combat</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #000;
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            touch-action: none;
        }

        .battle-info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            font-size: 14px;
            z-index: 100;
            min-width: 200px;
        }

        .fleet-status {
            margin-bottom: 15px;
        }

        .fleet-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .blue-fleet {
            color: #4FC3F7;
            text-shadow: 0 0 10px #4FC3F7;
        }

        .red-fleet {
            color: #FF5252;
            text-shadow: 0 0 10px #FF5252;
        }

        .ship-count {
            font-size: 13px;
            opacity: 0.9;
        }

        .controls-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            z-index: 100;
        }

        .control-item {
            margin-bottom: 5px;
        }

        .battle-title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 100;
            text-align: center;
        }

        .victory-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            display: none;
            z-index: 200;
            text-align: center;
            animation: victoryPulse 2s ease-in-out infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }

        .restart-btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.6);
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div class="battle-title">⚔️ SPACE FLEET BATTLE ⚔️</div>

    <div class="battle-info">
        <div class="fleet-status">
            <div class="fleet-name blue-fleet">Blue Alliance</div>
            <div class="ship-count">Ships: <span id="blueShips">10</span></div>
            <div class="ship-count">Flagship: <span id="blueFlagship">ACTIVE</span></div>
        </div>
        <div class="fleet-status">
            <div class="fleet-name red-fleet">Red Empire</div>
            <div class="ship-count">Ships: <span id="redShips">10</span></div>
            <div class="ship-count">Flagship: <span id="redFlagship">ACTIVE</span></div>
        </div>
    </div>

    <div class="controls-info">
        <div class="control-item">🖱️ Left Mouse - Rotate Camera</div>
        <div class="control-item">🖱️ Right Mouse - Pan</div>
        <div class="control-item">⚙️ Scroll - Zoom</div>
    </div>

    <div class="victory-message" id="victoryMessage">
        <div id="victoryText"></div>
        <button class="restart-btn" onclick="location.reload()">New Battle</button>
    </div>

    <script>
        let scene, engine, camera;
        let ships = [];
        let projectiles = [];
        let explosions = [];
        let blueFleet = [];
        let redFleet = [];
        let gameActive = true;

        // Ship class
        class Ship {
            constructor(scene, position, isBlue, isFlagship = false) {
                this.scene = scene;
                this.isBlue = isBlue;
                this.isFlagship = isFlagship;
                this.maxHealth = isFlagship ? 200 : 100;
                this.health = this.maxHealth;
                this.alive = true;
                this.fireTimer = 0;
                this.fireRate = 3; // seconds
                this.target = null;
                this.velocity = new BABYLON.Vector3(0, 0, 0);
                this.rotationSpeed = 0.02;
                this.maxSpeed = isFlagship ? 0.15 : 0.25;
                this.acceleration = 0.01;
                
                this.createShip(position);
                this.createHealthBar();
                this.createEngineEffects();
            }

            createShip(position) {
                const size = this.isFlagship ? 4 : 2;
                
                // Main hull
                this.mesh = BABYLON.MeshBuilder.CreateBox('ship', {
                    width: size,
                    height: size * 0.4,
                    depth: size * 2
                }, this.scene);
                
                this.mesh.position = position;
                
                // Ship material
                const shipMat = new BABYLON.StandardMaterial('shipMat', this.scene);
                if (this.isBlue) {
                    shipMat.diffuseColor = new BABYLON.Color3(0.1, 0.3, 0.5);
                    shipMat.emissiveColor = new BABYLON.Color3(0, 0.1, 0.3);
                    shipMat.specularColor = new BABYLON.Color3(0.5, 0.7, 1);
                } else {
                    shipMat.diffuseColor = new BABYLON.Color3(0.5, 0.1, 0.1);
                    shipMat.emissiveColor = new BABYLON.Color3(0.3, 0, 0);
                    shipMat.specularColor = new BABYLON.Color3(1, 0.5, 0.5);
                }
                shipMat.specularPower = 32;
                this.mesh.material = shipMat;
                
                // Add details to flagship
                if (this.isFlagship) {
                    // Bridge
                    const bridge = BABYLON.MeshBuilder.CreateBox('bridge', {
                        width: size * 0.6,
                        height: size * 0.3,
                        depth: size * 0.8
                    }, this.scene);
                    bridge.position.y = size * 0.35;
                    bridge.position.z = -size * 0.3;
                    bridge.parent = this.mesh;
                    bridge.material = shipMat;
                    
                    // Weapons array
                    for (let i = 0; i < 2; i++) {
                        const weapon = BABYLON.MeshBuilder.CreateCylinder('weapon', {
                            diameter: size * 0.15,
                            height: size * 1.2
                        }, this.scene);
                        weapon.position.x = (i - 0.5) * size * 0.8;
                        weapon.position.z = size * 0.5;
                        weapon.rotation.x = Math.PI / 2;
                        weapon.parent = this.mesh;
                        weapon.material = shipMat;
                    }
                    
                    // Command tower
                    const tower = BABYLON.MeshBuilder.CreateCylinder('tower', {
                        diameter: size * 0.2,
                        height: size * 0.8
                    }, this.scene);
                    tower.position.y = size * 0.5;
                    tower.parent = this.mesh;
                    tower.material = shipMat;
                }
                
                // Wings
                for (let side = -1; side <= 1; side += 2) {
                    const wing = BABYLON.MeshBuilder.CreateBox('wing', {
                        width: size * 2,
                        height: size * 0.1,
                        depth: size
                    }, this.scene);
                    wing.position.x = side * size * 1.2;
                    wing.position.z = -size * 0.2;
                    wing.parent = this.mesh;
                    wing.material = shipMat;
                    
                    // Wing tips
                    const wingTip = BABYLON.MeshBuilder.CreateCylinder('wingTip', {
                        diameterTop: 0,
                        diameterBottom: size * 0.3,
                        height: size * 0.5
                    }, this.scene);
                    wingTip.position.x = side * size * 2;
                    wingTip.rotation.z = -side * Math.PI / 6;
                    wingTip.parent = this.mesh;
                    wingTip.material = shipMat;
                }
                
                // Engine nacelles
                for (let i = 0; i < (this.isFlagship ? 4 : 2); i++) {
                    const engine = BABYLON.MeshBuilder.CreateCylinder('engine', {
                        diameter: size * 0.2,
                        height: size * 0.8
                    }, this.scene);
                    const xPos = this.isFlagship ? 
                        ((i % 2) - 0.5) * size * 0.6 : 
                        (i - 0.5) * size * 0.8;
                    const zOffset = this.isFlagship && i >= 2 ? -size * 0.5 : 0;
                    engine.position.x = xPos;
                    engine.position.z = -size + zOffset;
                    engine.rotation.x = Math.PI / 2;
                    engine.parent = this.mesh;
                    
                    const engineMat = new BABYLON.StandardMaterial('engineMat', this.scene);
                    engineMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                    engineMat.emissiveColor = this.isBlue ? 
                        new BABYLON.Color3(0, 0.3, 1) : 
                        new BABYLON.Color3(1, 0.3, 0);
                    engine.material = engineMat;
                }
            }

            createHealthBar() {
                // Create GUI health bar
                const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");
                
                this.healthBarContainer = new BABYLON.GUI.Rectangle();
                this.healthBarContainer.width = "60px";
                this.healthBarContainer.height = "8px";
                this.healthBarContainer.cornerRadius = 2;
                this.healthBarContainer.color = "white";
                this.healthBarContainer.thickness = 1;
                this.healthBarContainer.background = "black";
                advancedTexture.addControl(this.healthBarContainer);
                
                this.healthBar = new BABYLON.GUI.Rectangle();
                this.healthBar.width = "58px";
                this.healthBar.height = "6px";
                this.healthBar.cornerRadius = 2;
                this.healthBar.color = "transparent";
                this.healthBar.thickness = 0;
                this.healthBar.background = this.getHealthColor();
                this.healthBarContainer.addControl(this.healthBar);
                
                this.healthBarContainer.linkWithMesh(this.mesh);
                this.healthBarContainer.linkOffsetY = this.isFlagship ? -50 : -35;
            }

            createEngineEffects() {
                // Engine glow lights
                const engineLight = new BABYLON.PointLight('engineLight', 
                    new BABYLON.Vector3(0, 0, -3), this.scene);
                engineLight.diffuse = this.isBlue ? 
                    new BABYLON.Color3(0, 0.5, 1) : 
                    new BABYLON.Color3(1, 0.5, 0);
                engineLight.intensity = 0.5;
                engineLight.range = 10;
                engineLight.parent = this.mesh;
                
                // Engine trail particles
                const particleSystem = new BABYLON.ParticleSystem('engineTrail', 200, this.scene);
                particleSystem.particleTexture = this.createParticleTexture();
                
                particleSystem.emitter = this.mesh;
                particleSystem.minEmitBox = new BABYLON.Vector3(-1, -0.5, -2);
                particleSystem.maxEmitBox = new BABYLON.Vector3(1, 0.5, -2);
                
                if (this.isBlue) {
                    particleSystem.color1 = new BABYLON.Color4(0.3, 0.7, 1, 1);
                    particleSystem.color2 = new BABYLON.Color4(0.1, 0.4, 1, 0.5);
                } else {
                    particleSystem.color1 = new BABYLON.Color4(1, 0.7, 0.3, 1);
                    particleSystem.color2 = new BABYLON.Color4(1, 0.4, 0.1, 0.5);
                }
                particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                
                particleSystem.minSize = 0.1;
                particleSystem.maxSize = 0.5;
                particleSystem.minLifeTime = 0.3;
                particleSystem.maxLifeTime = 0.8;
                
                particleSystem.emitRate = 50;
                particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
                
                particleSystem.gravity = new BABYLON.Vector3(0, 0, 0);
                particleSystem.direction1 = new BABYLON.Vector3(0, 0, -1);
                particleSystem.direction2 = new BABYLON.Vector3(0.2, 0.2, -1);
                
                particleSystem.minEmitPower = 1;
                particleSystem.maxEmitPower = 3;
                particleSystem.updateSpeed = 0.01;
                
                particleSystem.start();
                this.engineParticles = particleSystem;
            }

            createParticleTexture() {
                const size = 64;
                const texture = new BABYLON.DynamicTexture('particle', size, this.scene);
                const context = texture.getContext();
                
                const gradient = context.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                context.fillStyle = gradient;
                context.fillRect(0, 0, size, size);
                texture.update();
                
                return texture;
            }

            getHealthColor() {
                const healthPercent = this.health / this.maxHealth;
                if (healthPercent > 0.6) return "green";
                if (healthPercent > 0.3) return "yellow";
                return "red";
            }

            update(deltaTime, enemyShips) {
                if (!this.alive) return;
                
                // Find target
                if (!this.target || !this.target.alive) {
                    this.findTarget(enemyShips);
                }
                
                if (this.target && this.target.alive) {
                    // Calculate direction to target
                    const targetDir = this.target.mesh.position.subtract(this.mesh.position);
                    const distance = targetDir.length();
                    targetDir.normalize();
                    
                    // Rotate towards target
                    const currentForward = new BABYLON.Vector3(
                        Math.sin(this.mesh.rotation.y),
                        0,
                        Math.cos(this.mesh.rotation.y)
                    );
                    
                    const cross = BABYLON.Vector3.Cross(currentForward, targetDir);
                    const dot = BABYLON.Vector3.Dot(currentForward, targetDir);
                    
                    if (cross.y > 0.1) {
                        this.mesh.rotation.y += this.rotationSpeed;
                    } else if (cross.y < -0.1) {
                        this.mesh.rotation.y -= this.rotationSpeed;
                    }
                    
                    // Movement behavior
                    if (distance > 30) {
                        // Move towards target
                        this.velocity = BABYLON.Vector3.Lerp(
                            this.velocity,
                            targetDir.scale(this.maxSpeed),
                            this.acceleration
                        );
                    } else if (distance < 15) {
                        // Too close, back away
                        this.velocity = BABYLON.Vector3.Lerp(
                            this.velocity,
                            targetDir.scale(-this.maxSpeed * 0.5),
                            this.acceleration
                        );
                    } else {
                        // Strafe around target
                        const strafeDir = BABYLON.Vector3.Cross(targetDir, BABYLON.Vector3.Up());
                        this.velocity = BABYLON.Vector3.Lerp(
                            this.velocity,
                            strafeDir.scale(this.maxSpeed * 0.7),
                            this.acceleration
                        );
                    }
                    
                    // Fire weapons
                    this.fireTimer += deltaTime;
                    if (this.fireTimer >= this.fireRate && dot > 0.7) {
                        this.fire();
                        this.fireTimer = 0;
                    }
                }
                
                // Apply movement
                this.mesh.position.addInPlace(this.velocity);
                
                // Add some vertical movement for 3D effect
                this.mesh.position.y += Math.sin(Date.now() * 0.001 + this.mesh.position.x) * 0.02;
                
                // Update health bar
                this.healthBar.width = (58 * (this.health / this.maxHealth)) + "px";
                this.healthBar.background = this.getHealthColor();
            }

            findTarget(enemyShips) {
                let closestDistance = Infinity;
                let closestEnemy = null;
                
                enemyShips.forEach(enemy => {
                    if (enemy.alive) {
                        const distance = BABYLON.Vector3.Distance(
                            this.mesh.position, 
                            enemy.mesh.position
                        );
                        if (distance < closestDistance) {
                            closestDistance = distance;
                            closestEnemy = enemy;
                        }
                    }
                });
                
                this.target = closestEnemy;
            }

            fire() {
                const projectileCount = this.isFlagship ? 2 : 1;
                
                for (let i = 0; i < projectileCount; i++) {
                    const projectile = new Projectile(
                        this.scene,
                        this.mesh.position.clone(),
                        this.target.mesh.position.clone(),
                        this.isBlue,
                        this.isFlagship
                    );
                    
                    if (projectileCount > 1) {
                        const offset = (i - 0.5) * 2;
                        projectile.mesh.position.x += offset;
                    }
                    
                    projectiles.push(projectile);
                }
            }

            takeDamage(damage) {
                this.health -= damage;
                
                // Flash effect
                const originalEmissive = this.mesh.material.emissiveColor;
                this.mesh.material.emissiveColor = new BABYLON.Color3(1, 1, 1);
                setTimeout(() => {
                    if (this.mesh) {
                        this.mesh.material.emissiveColor = originalEmissive;
                    }
                }, 100);
                
                if (this.health <= 0 && this.alive) {
                    this.explode();
                }
            }

            explode() {
                this.alive = false;
                
                // Create explosion
                const explosion = new Explosion(this.scene, this.mesh.position.clone(), this.isFlagship);
                explosions.push(explosion);
                
                // Check for chain reactions
                ships.forEach(ship => {
                    if (ship !== this && ship.alive) {
                        const distance = BABYLON.Vector3.Distance(
                            this.mesh.position,
                            ship.mesh.position
                        );
                        const chainDistance = this.isFlagship ? 12 : 8;
                        
                        if (distance < chainDistance) {
                            setTimeout(() => {
                                if (ship.alive) {
                                    ship.health = 0;
                                    ship.explode();
                                }
                            }, 200);
                        }
                    }
                });
                
                // Clean up
                if (this.healthBarContainer) {
                    this.healthBarContainer.dispose();
                }
                if (this.engineParticles) {
                    this.engineParticles.stop();
                    setTimeout(() => this.engineParticles.dispose(), 1000);
                }
                this.mesh.dispose();
                
                updateFleetStatus();
            }
        }

        // Projectile class
        class Projectile {
            constructor(scene, startPos, targetPos, isBlue, fromFlagship) {
                this.scene = scene;
                this.isBlue = isBlue;
                this.damage = fromFlagship ? 30 : 20;
                this.speed = 0.8;
                this.lifetime = 5;
                
                this.createProjectile(startPos);
                this.velocity = targetPos.subtract(startPos).normalize().scale(this.speed);
                this.createTrail();
            }

            createProjectile(position) {
                this.mesh = BABYLON.MeshBuilder.CreateSphere('projectile', {
                    diameter: 0.5,
                    segments: 8
                }, this.scene);
                
                this.mesh.position = position;
                
                const projectileMat = new BABYLON.StandardMaterial('projectileMat', this.scene);
                if (this.isBlue) {
                    projectileMat.emissiveColor = new BABYLON.Color3(0, 0.7, 1);
                } else {
                    projectileMat.emissiveColor = new BABYLON.Color3(1, 0.2, 0);
                }
                projectileMat.diffuseColor = projectileMat.emissiveColor;
                this.mesh.material = projectileMat;
                
                // Glow effect
                const light = new BABYLON.PointLight('projectileLight', position, this.scene);
                light.diffuse = projectileMat.emissiveColor;
                light.intensity = 2;
                light.range = 5;
                light.parent = this.mesh;
                this.light = light;
            }

            createTrail() {
                const trail = new BABYLON.ParticleSystem('trail', 50, this.scene);
                trail.particleTexture = this.createTrailTexture();
                
                trail.emitter = this.mesh;
                trail.minEmitBox = new BABYLON.Vector3(0, 0, 0);
                trail.maxEmitBox = new BABYLON.Vector3(0, 0, 0);
                
                if (this.isBlue) {
                    trail.color1 = new BABYLON.Color4(0, 0.7, 1, 1);
                    trail.color2 = new BABYLON.Color4(0, 0.4, 0.8, 0.5);
                } else {
                    trail.color1 = new BABYLON.Color4(1, 0.2, 0, 1);
                    trail.color2 = new BABYLON.Color4(0.8, 0.4, 0, 0.5);
                }
                trail.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                
                trail.minSize = 0.1;
                trail.maxSize = 0.3;
                trail.minLifeTime = 0.2;
                trail.maxLifeTime = 0.5;
                
                trail.emitRate = 100;
                trail.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
                
                trail.gravity = new BABYLON.Vector3(0, 0, 0);
                trail.direction1 = new BABYLON.Vector3(0, 0, -1);
                trail.direction2 = new BABYLON.Vector3(0, 0, -1);
                
                trail.minEmitPower = 0;
                trail.maxEmitPower = 0;
                trail.updateSpeed = 0.01;
                
                trail.start();
                this.trail = trail;
            }

            createTrailTexture() {
                const size = 32;
                const texture = new BABYLON.DynamicTexture('trail', size, this.scene);
                const context = texture.getContext();
                
                const gradient = context.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                context.fillStyle = gradient;
                context.fillRect(0, 0, size, size);
                texture.update();
                
                return texture;
            }

            update(deltaTime) {
                this.mesh.position.addInPlace(this.velocity);
                this.lifetime -= deltaTime;
                
                // Check collisions
                ships.forEach(ship => {
                    if (ship.alive) {
                        const isEnemy = (this.isBlue && !ship.isBlue) || (!this.isBlue && ship.isBlue);
                        if (isEnemy) {
                            const distance = BABYLON.Vector3.Distance(
                                this.mesh.position,
                                ship.mesh.position
                            );
                            if (distance < 3) {
                                ship.takeDamage(this.damage);
                                this.destroy();
                            }
                        }
                    }
                });
                
                if (this.lifetime <= 0) {
                    this.destroy();
                }
            }

            destroy() {
                if (this.trail) this.trail.dispose();
                if (this.light) this.light.dispose();
                if (this.mesh) this.mesh.dispose();
                this.lifetime = -1;
            }
        }

        // Explosion class
        class Explosion {
            constructor(scene, position, isLarge = false) {
                this.scene = scene;
                this.position = position;
                this.isLarge = isLarge;
                this.lifetime = 2;
                
                this.createExplosion();
                this.createShockwave();
                this.createDebris();
            }

            createExplosion() {
                // Main explosion
                const particleSystem = new BABYLON.ParticleSystem('explosion', 500, this.scene);
                particleSystem.particleTexture = this.createExplosionTexture();
                
                particleSystem.emitter = this.position;
                const size = this.isLarge ? 3 : 1.5;
                particleSystem.minEmitBox = new BABYLON.Vector3(-size, -size, -size);
                particleSystem.maxEmitBox = new BABYLON.Vector3(size, size, size);
                
                particleSystem.color1 = new BABYLON.Color4(1, 1, 0, 1);
                particleSystem.color2 = new BABYLON.Color4(1, 0.5, 0, 1);
                particleSystem.colorDead = new BABYLON.Color4(0.2, 0, 0, 0);
                
                particleSystem.minSize = this.isLarge ? 2 : 1;
                particleSystem.maxSize = this.isLarge ? 6 : 3;
                
                particleSystem.minLifeTime = 0.5;
                particleSystem.maxLifeTime = 1.5;
                
                particleSystem.emitRate = 1000;
                particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
                
                particleSystem.gravity = new BABYLON.Vector3(0, 0, 0);
                particleSystem.direction1 = new BABYLON.Vector3(-1, -1, -1);
                particleSystem.direction2 = new BABYLON.Vector3(1, 1, 1);
                
                particleSystem.minEmitPower = this.isLarge ? 5 : 3;
                particleSystem.maxEmitPower = this.isLarge ? 15 : 10;
                particleSystem.updateSpeed = 0.01;
                
                particleSystem.start();
                
                // Stop emitting after initial burst
                setTimeout(() => {
                    particleSystem.stop();
                }, 100);
                
                // Clean up
                setTimeout(() => {
                    particleSystem.dispose();
                }, 3000);
                
                this.particleSystem = particleSystem;
                
                // Flash light
                const flash = new BABYLON.PointLight('flash', this.position, this.scene);
                flash.diffuse = new BABYLON.Color3(1, 0.8, 0);
                flash.intensity = this.isLarge ? 50 : 30;
                flash.range = this.isLarge ? 50 : 30;
                
                // Animate flash
                let flashIntensity = flash.intensity;
                scene.registerBeforeRender(function fadeFlash() {
                    flashIntensity *= 0.9;
                    flash.intensity = flashIntensity;
                    if (flashIntensity < 0.1) {
                        scene.unregisterBeforeRender(fadeFlash);
                        flash.dispose();
                    }
                });
            }

            createShockwave() {
                const shockwave = BABYLON.MeshBuilder.CreateSphere('shockwave', {
                    diameter: 1,
                    segments: 16
                }, this.scene);
                
                shockwave.position = this.position;
                
                const shockwaveMat = new BABYLON.StandardMaterial('shockwaveMat', this.scene);
                shockwaveMat.emissiveColor = new BABYLON.Color3(1, 0.5, 0);
                shockwaveMat.alpha = 0.5;
                shockwave.material = shockwaveMat;
                
                // Animate shockwave
                let scale = 1;
                scene.registerBeforeRender(function expandShockwave() {
                    scale += 0.5;
                    shockwave.scaling.setAll(scale);
                    shockwaveMat.alpha *= 0.95;
                    
                    if (shockwaveMat.alpha < 0.01) {
                        scene.unregisterBeforeRender(expandShockwave);
                        shockwave.dispose();
                    }
                });
            }

            createDebris() {
                const debrisCount = this.isLarge ? 20 : 10;
                
                for (let i = 0; i < debrisCount; i++) {
                    const debris = BABYLON.MeshBuilder.CreateBox('debris', {
                        size: Math.random() * 0.5 + 0.2
                    }, this.scene);
                    
                    debris.position = this.position.clone();
                    
                    const debrisMat = new BABYLON.StandardMaterial('debrisMat', this.scene);
                    debrisMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                    debrisMat.emissiveColor = new BABYLON.Color3(0.8, 0.4, 0);
                    debris.material = debrisMat;
                    
                    // Random velocity
                    const velocity = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 1,
                        (Math.random() - 0.5) * 1,
                        (Math.random() - 0.5) * 1
                    );
                    
                    const rotationSpeed = new BABYLON.Vector3(
                        Math.random() * 0.2,
                        Math.random() * 0.2,
                        Math.random() * 0.2
                    );
                    
                    // Animate debris
                    let lifetime = 3;
                    scene.registerBeforeRender(function moveDebris() {
                        debris.position.addInPlace(velocity);
                        debris.rotation.addInPlace(rotationSpeed);
                        velocity.scaleInPlace(0.98);
                        debrisMat.emissiveColor.scaleInPlace(0.97);
                        lifetime -= 0.016;
                        
                        if (lifetime <= 0) {
                            scene.unregisterBeforeRender(moveDebris);
                            debris.dispose();
                        }
                    });
                }
            }

            createExplosionTexture() {
                const size = 64;
                const texture = new BABYLON.DynamicTexture('explosion', size, this.scene);
                const context = texture.getContext();
                
                const gradient = context.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(0.3, 'rgba(255, 200, 0, 1)');
                gradient.addColorStop(0.7, 'rgba(255, 100, 0, 0.5)');
                gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
                
                context.fillStyle = gradient;
                context.fillRect(0, 0, size, size);
                texture.update();
                
                return texture;
            }
        }

        // Initialize Babylon.js
        function initBabylon() {
            const canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
            
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0, 0, 0.05);
            
            createCamera();
            createLighting();
            createEnvironment();
            createFleets();
            
            // Game loop
            scene.registerBeforeRender(() => {
                if (gameActive) {
                    updateBattle();
                }
            });
            
            // Render loop
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                engine.resize();
            });
        }

        // Create camera
        function createCamera() {
            camera = new BABYLON.ArcRotateCamera('camera', 
                -Math.PI / 2, Math.PI / 3, 150, 
                new BABYLON.Vector3(0, 0, 0), scene);
            
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 300;
            camera.lowerBetaLimit = 0.5;
            camera.upperBetaLimit = Math.PI / 2.2;
            camera.wheelPrecision = 20;
            camera.panningSensibility = 50;
            
            // Smooth camera movement
            camera.inertia = 0.8;
            camera.speed = 0.5;
        }

        // Create lighting
        function createLighting() {
            // Ambient light
            const ambientLight = new BABYLON.HemisphericLight('ambientLight',
                new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.4;
            ambientLight.diffuse = new BABYLON.Color3(0.5, 0.5, 0.7);
            ambientLight.specular = new BABYLON.Color3(0.3, 0.3, 0.5);
            ambientLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);
        }

        // Create space environment
        function createEnvironment() {
            // Create starfield
            const starfieldSize = 500;
            const starfield = BABYLON.MeshBuilder.CreateSphere('starfield', {
                diameter: starfieldSize,
                segments: 32
            }, scene);
            
            const starfieldMat = new BABYLON.StandardMaterial('starfieldMat', scene);
            starfieldMat.backFaceCulling = false;
            starfieldMat.disableLighting = true;
            starfieldMat.emissiveColor = new BABYLON.Color3(0.02, 0.02, 0.05);
            
            // Add star texture procedurally
            const starTexture = new BABYLON.DynamicTexture('starTexture', 1024, scene);
            const context = starTexture.getContext();
            
            // Draw stars
            context.fillStyle = 'black';
            context.fillRect(0, 0, 1024, 1024);
            
            for (let i = 0; i < 1000; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const size = Math.random() * 2;
                const brightness = Math.random();
                
                context.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                context.beginPath();
                context.arc(x, y, size, 0, Math.PI * 2);
                context.fill();
            }
            
            // Add nebula clouds
            for (let i = 0; i < 5; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 1024;
                const radius = Math.random() * 100 + 50;
                
                const gradient = context.createRadialGradient(x, y, 0, x, y, radius);
                const hue = Math.random() * 60 + 180;
                gradient.addColorStop(0, `hsla(${hue}, 100%, 50%, 0.2)`);
                gradient.addColorStop(0.5, `hsla(${hue}, 100%, 30%, 0.1)`);
                gradient.addColorStop(1, 'transparent');
                
                context.fillStyle = gradient;
                context.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            }
            
            starTexture.update();
            starfieldMat.emissiveTexture = starTexture;
            starfield.material = starfieldMat;
        }

        // Create fleets
        function createFleets() {
            // Blue fleet formation (left side)
            const blueFormation = [
                new BABYLON.Vector3(-20, 0, 0),  // Flagship center
                new BABYLON.Vector3(-25, 2, 5),
                new BABYLON.Vector3(-25, 2, -5),
                new BABYLON.Vector3(-25, -2, 5),
                new BABYLON.Vector3(-25, -2, -5),
                new BABYLON.Vector3(-30, 0, 10),
                new BABYLON.Vector3(-30, 0, -10),
                new BABYLON.Vector3(-30, 4, 0),
                new BABYLON.Vector3(-30, -4, 0),
                new BABYLON.Vector3(-35, 0, 0)
            ];
            
            // Red fleet formation (right side)
            const redFormation = [
                new BABYLON.Vector3(20, 0, 0),   // Flagship center
                new BABYLON.Vector3(25, 2, 5),
                new BABYLON.Vector3(25, 2, -5),
                new BABYLON.Vector3(25, -2, 5),
                new BABYLON.Vector3(25, -2, -5),
                new BABYLON.Vector3(30, 0, 10),
                new BABYLON.Vector3(30, 0, -10),
                new BABYLON.Vector3(30, 4, 0),
                new BABYLON.Vector3(30, -4, 0),
                new BABYLON.Vector3(35, 0, 0)
            ];
            
            // Create blue fleet
            blueFormation.forEach((pos, index) => {
                const ship = new Ship(scene, pos, true, index === 0);
                blueFleet.push(ship);
                ships.push(ship);
            });
            
            // Create red fleet
            redFormation.forEach((pos, index) => {
                const ship = new Ship(scene, pos, false, index === 0);
                redFleet.push(ship);
                ships.push(ship);
            });
        }

        // Update battle
        function updateBattle() {
            const deltaTime = engine.getDeltaTime() / 1000;
            
            // Update ships
            blueFleet.forEach(ship => {
                ship.update(deltaTime, redFleet);
            });
            
            redFleet.forEach(ship => {
                ship.update(deltaTime, blueFleet);
            });
            
            // Update projectiles
            projectiles = projectiles.filter(projectile => {
                projectile.update(deltaTime);
                if (projectile.lifetime <= 0) {
                    return false;
                }
                return true;
            });
            
            // Check victory conditions
            checkVictory();
        }

        // Update fleet status
        function updateFleetStatus() {
            const blueAlive = blueFleet.filter(s => s.alive).length;
            const redAlive = redFleet.filter(s => s.alive).length;
            
            document.getElementById('blueShips').textContent = blueAlive;
            document.getElementById('redShips').textContent = redAlive;
            
            const blueFlagship = blueFleet[0];
            document.getElementById('blueFlagship').textContent = 
                blueFlagship.alive ? 'ACTIVE' : 'DESTROYED';
            
            const redFlagship = redFleet[0];
            document.getElementById('redFlagship').textContent = 
                redFlagship.alive ? 'ACTIVE' : 'DESTROYED';
        }

        // Check victory conditions
        function checkVictory() {
            const blueAlive = blueFleet.filter(s => s.alive).length;
            const redAlive = redFleet.filter(s => s.alive).length;
            
            if (blueAlive === 0 && gameActive) {
                gameActive = false;
                showVictory('Red Empire');
            } else if (redAlive === 0 && gameActive) {
                gameActive = false;
                showVictory('Blue Alliance');
            }
        }

        // Show victory message
        function showVictory(winner) {
            const victoryMessage = document.getElementById('victoryMessage');
            const victoryText = document.getElementById('victoryText');
            
            victoryText.innerHTML = `🎉 ${winner} Victorious! 🎉`;
            victoryText.style.color = winner.includes('Blue') ? '#4FC3F7' : '#FF5252';
            victoryText.style.textShadow = `0 0 30px ${winner.includes('Blue') ? '#4FC3F7' : '#FF5252'}`;
            
            victoryMessage.style.display = 'block';
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', () => {
            initBabylon();
        });
    </script>
</body>
</html>
