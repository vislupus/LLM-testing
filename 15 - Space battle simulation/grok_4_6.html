<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cygnus vs Crimson — Fleet Engagement</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #hud {
      position: absolute; inset: 0; pointer-events: none;
      font-family: "Segoe UI", "DIN Alternate", system-ui, sans-serif;
      color: #e8f1ff;
    }
    #title {
      position: absolute; left: 28px; top: 22px;
      text-shadow: 0 2px 18px rgba(0,0,0,.7);
    }
    #title h1 {
      margin: 0; font-weight: 700; letter-spacing: .22em;
      font-size: clamp(14px, 2vw, 20px); text-transform: uppercase;
    }
    #title p {
      margin: 4px 0 0; opacity: .65; font-size: 11px;
      letter-spacing: .32em; text-transform: uppercase;
    }
    #score {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 18px;
      background: rgba(4, 8, 16, .42);
      border: 1px solid rgba(255,255,255,.08);
      padding: 8px 18px; border-radius: 999px;
      backdrop-filter: blur(8px);
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
    }
    .side { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .16em; }
    .side b { font-size: 20px; font-weight: 700; letter-spacing: 0; }
    .blue { color: #7ecbff; }
    .red { color: #ff7a6e; }
    .vs { opacity: .4; font-size: 10px; letter-spacing: .3em; }
    #hint {
      position: absolute; right: 22px; bottom: 20px;
      font-size: 11px; letter-spacing: .1em; opacity: .62;
      background: rgba(4,8,16,.4); padding: 7px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
    }
    #banner {
      position: absolute; left: 50%; top: 46%;
      transform: translate(-50%, -50%);
      text-align: center; letter-spacing: .28em;
      font-size: 22px; font-weight: 700; text-transform: uppercase;
      opacity: 0; transition: opacity .6s ease;
      text-shadow: 0 0 24px currentColor, 0 4px 20px #000;
      pointer-events: none;
    }
    #banner.show { opacity: 1; }
    #loader {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at 50% 40%, #10182a 0%, #03050a 70%);
      transition: opacity .7s ease; z-index: 5;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .ring {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3px solid rgba(126,203,255,.15);
      border-top-color: #7ecbff;
      animation: spin .85s linear infinite;
    }
    #loader span { letter-spacing: .28em; font-size: 11px; color: #8ec4ff; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    <div id="title">
      <h1>Fleet Engagement</h1>
      <p>Cygnus Armada  ·  Crimson Host</p>
    </div>
    <div id="score">
      <div class="side blue">CYGNUS <b id="blue-count">10</b></div>
      <div class="vs">VS</div>
      <div class="side red"><b id="red-count">10</b> CRIMSON</div>
    </div>
    <div id="banner"></div>
    <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
  </div>
  <div id="loader"><div class="ring"></div><span>FORMING BATTLE LINE</span></div>

  <script>
  (function () {
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, {
      preserveDrawingBuffer: true,
      stencil: true,
      adaptToDeviceRatio: true
    });
    if (window.devicePixelRatio > 1.5) engine.setHardwareScalingLevel(window.devicePixelRatio / 1.5);

    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.01, 0.015, 0.03, 1);
    scene.ambientColor = new BABYLON.Color3(0.08, 0.09, 0.12);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.0016;
    scene.fogColor = new BABYLON.Color3(0.03, 0.04, 0.08);
    scene.imageProcessingConfiguration.toneMappingEnabled = true;
    scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
    scene.imageProcessingConfiguration.contrast = 1.18;
    scene.imageProcessingConfiguration.exposure = 1.08;
    scene.imageProcessingConfiguration.vignetteEnabled = true;
    scene.imageProcessingConfiguration.vignetteWeight = 2.6;
    scene.imageProcessingConfiguration.vignetteColor = new BABYLON.Color4(0.01, 0.02, 0.05, 1);

    const camera = new BABYLON.ArcRotateCamera("cam", -0.7, 1.18, 168, new BABYLON.Vector3(0, 6, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 36;
    camera.upperRadiusLimit = 320;
    camera.lowerBetaLimit = 0.18;
    camera.upperBetaLimit = Math.PI - 0.18;
    camera.wheelPrecision = 18;
    camera.panningSensibility = 40;
    camera.minZ = 0.3;
    camera.maxZ = 2000;
    camera.useAutoRotationBehavior = true;
    camera.autoRotationBehavior.idleRotationSpeed = 0.055;
    camera.autoRotationBehavior.idleRotationWaitTime = 2200;
    camera.autoRotationBehavior.idleRotationSpinupTime = 1600;

    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.15, 1, 0.25), scene);
    hemi.intensity = 0.38;
    hemi.diffuse = new BABYLON.Color3(0.55, 0.62, 0.85);
    hemi.groundColor = new BABYLON.Color3(0.08, 0.05, 0.12);
    hemi.specular = new BABYLON.Color3(0.15, 0.15, 0.2);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.45, -0.55, 0.35), scene);
    sun.position = new BABYLON.Vector3(80, 90, -60);
    sun.intensity = 0.85;
    sun.diffuse = new BABYLON.Color3(1.0, 0.92, 0.78);
    sun.specular = new BABYLON.Color3(1, 0.95, 0.85);

    const rim = new BABYLON.DirectionalLight("rim", new BABYLON.Vector3(0.3, 0.2, -1), scene);
    rim.intensity = 0.28;
    rim.diffuse = new BABYLON.Color3(0.45, 0.35, 0.85);

    const blueEngineLight = new BABYLON.PointLight("bEng", new BABYLON.Vector3(-70, 0, -6), scene);
    blueEngineLight.diffuse = new BABYLON.Color3(0.35, 0.7, 1);
    blueEngineLight.specular = new BABYLON.Color3(0.4, 0.7, 1);
    blueEngineLight.intensity = 1.8;
    blueEngineLight.range = 55;

    const redEngineLight = new BABYLON.PointLight("rEng", new BABYLON.Vector3(70, 0, -6), scene);
    redEngineLight.diffuse = new BABYLON.Color3(1, 0.35, 0.18);
    redEngineLight.specular = new BABYLON.Color3(1, 0.4, 0.2);
    redEngineLight.intensity = 1.8;
    redEngineLight.range = 55;

    const pipe = new BABYLON.DefaultRenderingPipeline("pipe", true, scene, [camera]);
    pipe.bloomEnabled = true;
    pipe.bloomThreshold = 0.55;
    pipe.bloomWeight = 0.72;
    pipe.bloomKernel = 48;
    pipe.bloomScale = 0.6;
    pipe.fxaaEnabled = true;
    pipe.imageProcessingEnabled = true;
    pipe.grainEnabled = true;
    pipe.grain.intensity = 6;
    pipe.chromaticAberrationEnabled = true;
    pipe.chromaticAberration.aberrationAmount = 12;

    const glow = new BABYLON.GlowLayer("glow", scene, { blurKernelSize: 48 });
    glow.intensity = 0.95;

    function std(name, hex, opts) {
      const m = new BABYLON.StandardMaterial(name, scene);
      const c = BABYLON.Color3.FromHexString(hex);
      m.diffuseColor = c;
      m.specularColor = (opts && opts.spec) || new BABYLON.Color3(0.35, 0.35, 0.38);
      m.specularPower = (opts && opts.pow) || 48;
      m.ambientColor = c.scale(0.25);
      m.emissiveColor = (opts && opts.emis) || BABYLON.Color3.Black();
      m.maxSimultaneousLights = 6;
      if (opts && opts.alpha != null) {
        m.alpha = opts.alpha;
        m.transparencyMode = 2;
      }
      return m;
    }
    function unlit(name, hex, alpha) {
      const m = new BABYLON.StandardMaterial(name, scene);
      const c = BABYLON.Color3.FromHexString(hex);
      m.diffuseColor = BABYLON.Color3.Black();
      m.emissiveColor = c;
      m.disableLighting = true;
      m.specularColor = BABYLON.Color3.Black();
      if (alpha != null) { m.alpha = alpha; m.transparencyMode = 2; }
      return m;
    }

    const mats = {
      hullB: std("hullB", "#6d7e96", { spec: new BABYLON.Color3(0.45, 0.5, 0.6), pow: 64 }),
      hullB2: std("hullB2", "#3d4d66"),
      accentB: std("accentB", "#2a6d9a"),
      hullR: std("hullR", "#6a5552", { spec: new BABYLON.Color3(0.5, 0.35, 0.3), pow: 56 }),
      hullR2: std("hullR2", "#3a2a28"),
      accentR: std("accentR", "#8a2a22"),
      dark: std("dark", "#1a1d24", { spec: new BABYLON.Color3(0.2, 0.2, 0.22), pow: 80 }),
      metal: std("metal", "#8a909a", { spec: new BABYLON.Color3(0.6, 0.6, 0.65), pow: 90 }),
      glassB: std("glassB", "#8fd4ff", { emis: new BABYLON.Color3(0.12, 0.35, 0.55) }),
      glassR: std("glassR", "#ffb08a", { emis: new BABYLON.Color3(0.45, 0.16, 0.08) }),
      thrusterB: unlit("thB", "#5ad0ff"),
      thrusterR: unlit("thR", "#ff6a32"),
      coreB: unlit("coreB", "#d8f4ff"),
      coreR: unlit("coreR", "#ffe0c0"),
      boltB: unlit("boltB", "#6ad4ff"),
      boltR: unlit("boltR", "#ff6b4a"),
      trailB: unlit("trailB", "#3aa8ff", 0.75),
      trailR: unlit("trailR", "#ff4a28", 0.75),
      hbBg: unlit("hbBg", "#0a0c10", 0.72),
      shock: unlit("shock", "#fff4d0", 0.7)
    };
    mats.trailB.backFaceCulling = false;
    mats.trailR.backFaceCulling = false;
    mats.shock.backFaceCulling = false;
    mats.shock.wireframe = false;

    function softTex(size) {
      const dt = new BABYLON.DynamicTexture("pt" + size, size, scene, false);
      const ctx = dt.getContext();
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, "rgba(255,255,255,1)");
      g.addColorStop(0.4, "rgba(255,255,255,0.45)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      dt.update();
      return dt;
    }
    const ptex = softTex(64);

    (function sky() {
      const sky = BABYLON.MeshBuilder.CreateSphere("sky", {
        diameter: 1400, segments: 16, sideOrientation: BABYLON.Mesh.BACKSIDE
      }, scene);
      const tex = new BABYLON.DynamicTexture("skyTex", 1024, scene, false);
      const ctx = tex.getContext();
      const grd = ctx.createLinearGradient(0, 0, 0, 1024);
      grd.addColorStop(0, "#070814");
      grd.addColorStop(0.45, "#0b1020");
      grd.addColorStop(0.7, "#140c1c");
      grd.addColorStop(1, "#08060e");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 1024, 1024);
      function blob(x, y, r, color) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      blob(280, 420, 260, "rgba(50, 40, 120, 0.45)");
      blob(720, 300, 300, "rgba(20, 70, 110, 0.38)");
      blob(540, 700, 220, "rgba(110, 30, 70, 0.28)");
      blob(160, 760, 180, "rgba(30, 90, 80, 0.22)");
      blob(880, 820, 200, "rgba(80, 40, 130, 0.25)");
      for (let i = 0; i < 1400; i++) {
        const x = Math.random() * 1024, y = Math.random() * 1024;
        const s = Math.random() * 1.4 + 0.3;
        const a = 0.35 + Math.random() * 0.65;
        ctx.fillStyle = "rgba(255,255,255," + a + ")";
        ctx.fillRect(x, y, s, s);
      }
      for (let i = 0; i < 18; i++) {
        const x = Math.random() * 1024, y = Math.random() * 1024;
        ctx.fillStyle = "rgba(200,220,255,0.95)";
        ctx.fillRect(x, y, 2.2, 2.2);
      }
      tex.update();
      const sm = new BABYLON.StandardMaterial("skyMat", scene);
      sm.emissiveTexture = tex;
      sm.disableLighting = true;
      sm.diffuseColor = BABYLON.Color3.Black();
      sky.material = sm;
      sky.infiniteDistance = true;
      sky.applyFog = false;
    })();

    const uid = (() => { let n = 0; return (s) => s + (++n); })();
    function box(w, h, d, mat, parent) {
      const m = BABYLON.MeshBuilder.CreateBox(uid("b"), { width: w, height: h, depth: d }, scene);
      m.material = mat;
      if (parent) m.parent = parent;
      return m;
    }
    function cyl(h, top, bot, tess, mat, parent) {
      const m = BABYLON.MeshBuilder.CreateCylinder(uid("c"), {
        height: h, diameterTop: top, diameterBottom: bot, tessellation: tess
      }, scene);
      m.material = mat;
      if (parent) m.parent = parent;
      return m;
    }
    function sphere(d, seg, mat, parent) {
      const m = BABYLON.MeshBuilder.CreateSphere(uid("s"), { diameter: d, segments: seg }, scene);
      m.material = mat;
      if (parent) m.parent = parent;
      return m;
    }

    function attachThruster(parent, x, y, z, scale, team) {
      const flame = cyl(1.15 * scale, 0.02, 0.42 * scale, 8, team === "blue" ? mats.thrusterB : mats.thrusterR, parent);
      flame.rotation.x = Math.PI / 2;
      flame.position.set(x, y, z - 0.55 * scale);
      const core = cyl(0.7 * scale, 0.01, 0.18 * scale, 6, team === "blue" ? mats.coreB : mats.coreR, parent);
      core.rotation.x = Math.PI / 2;
      core.position.set(x, y, z - 0.35 * scale);
      glow.addIncludedOnlyMesh(flame);
      glow.addIncludedOnlyMesh(core);
      return flame;
    }

    function makeBlueEscort() {
      const root = new BABYLON.TransformNode(uid("be"), scene);
      const hull = box(1.15, 0.5, 3.4, mats.hullB, root);
      const nose = cyl(0.9, 0.05, 0.95, 8, mats.hullB2, root);
      nose.rotation.x = Math.PI / 2;
      nose.position.z = 1.95;
      const wingL = box(1.7, 0.1, 1.15, mats.accentB, root);
      wingL.position.set(-1.15, 0, -0.15);
      wingL.rotation.y = 0.35;
      const wingR = box(1.7, 0.1, 1.15, mats.accentB, root);
      wingR.position.set(1.15, 0, -0.15);
      wingR.rotation.y = -0.35;
      const fin = box(0.1, 0.85, 0.9, mats.hullB2, root);
      fin.position.set(0, 0.5, -0.9);
      const canopy = sphere(0.55, 6, mats.glassB, root);
      canopy.position.set(0, 0.28, 0.7);
      canopy.scaling.set(0.8, 0.55, 1.1);
      attachThruster(root, -0.38, 0, -1.75, 0.85, "blue");
      attachThruster(root, 0.38, 0, -1.75, 0.85, "blue");
      box(0.25, 0.18, 0.35, mats.dark, root).position.set(-0.7, 0.22, 0.2);
      box(0.25, 0.18, 0.35, mats.dark, root).position.set(0.7, 0.22, 0.2);
      return root;
    }

    function makeRedEscort() {
      const root = new BABYLON.TransformNode(uid("re"), scene);
      const hull = box(1.25, 0.55, 3.1, mats.hullR, root);
      hull.rotation.z = 0;
      const nose = box(0.7, 0.4, 1.1, mats.hullR2, root);
      nose.position.z = 1.85;
      nose.rotation.x = 0.15;
      const wingL = box(2.0, 0.12, 0.85, mats.accentR, root);
      wingL.position.set(-1.2, -0.05, -0.2);
      wingL.rotation.set(0.15, 0.45, -0.2);
      const wingR = box(2.0, 0.12, 0.85, mats.accentR, root);
      wingR.position.set(1.2, -0.05, -0.2);
      wingR.rotation.set(0.15, -0.45, 0.2);
      const spike = box(0.12, 0.12, 1.4, mats.metal, root);
      spike.position.set(0, 0.15, 2.3);
      const canopy = box(0.55, 0.28, 0.7, mats.glassR, root);
      canopy.position.set(0, 0.38, 0.45);
      attachThruster(root, 0, 0, -1.65, 1.05, "red");
      box(0.35, 0.2, 0.4, mats.dark, root).position.set(-0.55, 0.28, -0.4);
      box(0.35, 0.2, 0.4, mats.dark, root).position.set(0.55, 0.28, -0.4);
      return root;
    }

    function makeBlueFlag() {
      const root = new BABYLON.TransformNode(uid("bf"), scene);
      const hull = box(3.4, 1.35, 10.2, mats.hullB, root);
      const neck = box(2.2, 1.0, 3.2, mats.hullB2, root);
      neck.position.z = 6.2;
      const nose = cyl(2.4, 0.2, 2.1, 10, mats.accentB, root);
      nose.rotation.x = Math.PI / 2;
      nose.position.z = 8.5;
      const wingL = box(5.4, 0.22, 3.6, mats.hullB2, root);
      wingL.position.set(-3.6, -0.15, -0.4);
      wingL.rotation.y = 0.22;
      const wingR = box(5.4, 0.22, 3.6, mats.hullB2, root);
      wingR.position.set(3.6, -0.15, -0.4);
      wingR.rotation.y = -0.22;
      const tower = box(1.5, 1.8, 2.4, mats.hullB, root);
      tower.position.set(0, 1.45, 1.2);
      const bridge = box(1.8, 0.55, 1.1, mats.glassB, root);
      bridge.position.set(0, 2.35, 1.5);
      const spine = box(0.35, 0.7, 7.5, mats.accentB, root);
      spine.position.set(0, 0.9, -0.6);
      for (let i = 0; i < 4; i++) {
        const p = box(0.45, 0.28, 0.7, mats.dark, root);
        p.position.set((i < 2 ? -1.1 : 1.1), 0.75, 2.2 - (i % 2) * 2.4);
      }
      const hangL = box(1.3, 0.7, 2.6, mats.hullB2, root);
      hangL.position.set(-2.1, -0.55, 1.4);
      const hangR = box(1.3, 0.7, 2.6, mats.hullB2, root);
      hangR.position.set(2.1, -0.55, 1.4);
      attachThruster(root, -1.15, 0.15, -5.2, 1.5, "blue");
      attachThruster(root, 1.15, 0.15, -5.2, 1.5, "blue");
      attachThruster(root, -0.45, -0.45, -5.15, 1.15, "blue");
      attachThruster(root, 0.45, -0.45, -5.15, 1.15, "blue");
      const disc = cyl(0.18, 2.4, 2.4, 12, mats.metal, root);
      disc.position.set(0, -0.75, -1.5);
      return root;
    }

    function makeRedFlag() {
      const root = new BABYLON.TransformNode(uid("rf"), scene);
      const hull = box(4.2, 1.7, 9.4, mats.hullR, root);
      const head = box(5.6, 1.5, 2.6, mats.hullR2, root);
      head.position.z = 5.4;
      const beak = box(1.6, 0.7, 2.2, mats.accentR, root);
      beak.position.set(0, -0.15, 7.4);
      const wingL = box(4.6, 0.28, 2.8, mats.accentR, root);
      wingL.position.set(-3.8, 0.1, 0.2);
      wingL.rotation.set(0.1, 0.35, -0.18);
      const wingR = box(4.6, 0.28, 2.8, mats.accentR, root);
      wingR.position.set(3.8, 0.1, 0.2);
      wingR.rotation.set(0.1, -0.35, 0.18);
      const citadel = box(2.2, 2.1, 2.8, mats.hullR2, root);
      citadel.position.set(0, 1.7, 0.6);
      const slit = box(1.8, 0.35, 0.8, mats.glassR, root);
      slit.position.set(0, 2.55, 1.3);
      for (let i = -1; i <= 1; i++) {
        const plate = box(1.1, 0.18, 3.4, mats.metal, root);
        plate.position.set(i * 1.35, 0.95, -1.6);
      }
      attachThruster(root, -1.5, 0.1, -4.8, 1.7, "red");
      attachThruster(root, 1.5, 0.1, -4.8, 1.7, "red");
      attachThruster(root, 0, -0.55, -4.85, 1.45, "red");
      const fin = box(0.2, 1.6, 2.2, mats.hullR2, root);
      fin.position.set(0, 1.5, -3.2);
      box(0.8, 0.45, 1.1, mats.dark, root).position.set(-2.2, 0.7, 3.4);
      box(0.8, 0.45, 1.1, mats.dark, root).position.set(2.2, 0.7, 3.4);
      return root;
    }

    function makeHealthBar(ship) {
      const node = new BABYLON.TransformNode(uid("hb"), scene);
      const w = ship.isFlag ? 4.4 : 2.15;
      const bg = BABYLON.MeshBuilder.CreatePlane(uid("hbb"), { width: w, height: ship.isFlag ? 0.28 : 0.18 }, scene);
      bg.material = mats.hbBg;
      bg.parent = node;
      bg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      const fillMat = unlit(uid("hfm"), ship.team === "blue" ? "#4dffb0" : "#ff6a55");
      const fill = BABYLON.MeshBuilder.CreatePlane(uid("hbf"), { width: w * 0.94, height: ship.isFlag ? 0.16 : 0.1 }, scene);
      fill.material = fillMat;
      fill.parent = node;
      fill.position.z = -0.02;
      fill.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      node.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      ship.hb = node;
      ship.hbFill = fill;
      ship.hbMat = fillMat;
      ship.hbW = w * 0.94;
    }

    function updateHealthBar(ship) {
      if (!ship.hbFill) return;
      const t = Math.max(ship.hp, 0) / ship.maxHp;
      ship.hbFill.scaling.x = Math.max(t, 0.001);
      const col = t > 0.5
        ? BABYLON.Color3.Lerp(new BABYLON.Color3(1, 0.85, 0.2), new BABYLON.Color3(0.25, 1, 0.55), (t - 0.5) * 2)
        : BABYLON.Color3.Lerp(new BABYLON.Color3(1, 0.15, 0.1), new BABYLON.Color3(1, 0.85, 0.2), t * 2);
      ship.hbMat.emissiveColor = col;
    }

    const ships = [];
    const projectiles = [];
    const debris = [];
    const shocks = [];
    let shake = 0;
    let battleOver = false;
    const t0 = performance.now();

    function spawnShip(team, isFlag, x, y, z, yaw) {
      const root = isFlag
        ? (team === "blue" ? makeBlueFlag() : makeRedFlag())
        : (team === "blue" ? makeBlueEscort() : makeRedEscort());
      root.position.set(x, y, z);
      root.rotation.y = yaw;
      const ship = {
        team, isFlag, root, alive: true, exploding: false,
        hp: isFlag ? 520 : 110,
        maxHp: isFlag ? 520 : 110,
        radius: isFlag ? 6.2 : 2.15,
        pos: root.position,
        vel: new BABYLON.Vector3(Math.sin(yaw) * 4, 0, Math.cos(yaw) * 4),
        yaw, pitch: 0,
        fireCd: 1.2 + Math.random() * 2.4,
        fireEvery: 3,
        target: null,
        orbit: Math.random() * Math.PI * 2,
        orbitH: 18 + Math.random() * 16,
        orbitY: 6 + Math.random() * 10,
        wander: Math.random() * Math.PI * 2,
        sep: new BABYLON.Vector3(),
        flag: isFlag
      };
      makeHealthBar(ship);
      ships.push(ship);
      return ship;
    }

    (function formFleets() {
      spawnShip("blue", true, -78, 2, 0, Math.PI / 2);
      spawnShip("red", true, 78, 2, 0, -Math.PI / 2);
      const ring = [
        [18, 8, 10], [18, -6, 12], [12, 12, -6], [12, -10, -8],
        [26, 2, 4], [8, 4, 16], [22, 14, -14], [10, -14, 6], [28, -8, -10]
      ];
      ring.forEach((p, i) => {
        spawnShip("blue", false, -78 - p[2] * 0.35, p[1], p[0] * (i % 2 ? 1 : -0.85), Math.PI / 2 + (Math.random() - 0.5) * 0.2);
        spawnShip("red", false, 78 + p[2] * 0.35, p[1] * 0.9, -p[0] * (i % 2 ? 1 : -0.85), -Math.PI / 2 + (Math.random() - 0.5) * 0.2);
      });
    })();

    const blueFlag = ships.find((s) => s.team === "blue" && s.isFlag);
    const redFlag = ships.find((s) => s.team === "red" && s.isFlag);

    function living(team) {
      return ships.filter((s) => s.alive && (!team || s.team === team));
    }

    function pickTarget(ship) {
      const foes = living(ship.team === "blue" ? "red" : "blue");
      if (!foes.length) return null;
      let best = null, bestS = 1e9;
      for (const f of foes) {
        const d = BABYLON.Vector3.Distance(ship.pos, f.pos);
        let score = d;
        if (!ship.isFlag && f.isFlag) score += 18;
        if (f.hp < f.maxHp * 0.4) score -= 10;
        if (score < bestS) { bestS = score; best = f; }
      }
      return best;
    }

    function forwardOf(ship) {
      const cs = Math.cos(ship.pitch), sy = Math.sin(ship.yaw), cy = Math.cos(ship.yaw);
      return new BABYLON.Vector3(sy * cs, -Math.sin(ship.pitch), cy * cs);
    }

    function spawnProjectile(ship, localOff) {
      const fwd = forwardOf(ship);
      const right = new BABYLON.Vector3(Math.cos(ship.yaw), 0, -Math.sin(ship.yaw));
      const up = BABYLON.Vector3.Cross(right, fwd).normalize();
      const origin = ship.pos.add(fwd.scale(ship.isFlag ? 8.4 : 2.4))
        .add(right.scale(localOff.x))
        .add(up.scale(localOff.y));
      let dir = fwd.clone();
      if (ship.target && ship.target.alive) {
        const dist = BABYLON.Vector3.Distance(origin, ship.target.pos);
        const lead = ship.target.vel.scale(dist / 92);
        dir = ship.target.pos.add(lead).subtract(origin).normalize();
      }
      const mesh = sphere(0.42, 5, ship.team === "blue" ? mats.boltB : mats.boltR, null);
      mesh.position.copyFrom(origin);
      glow.addIncludedOnlyMesh(mesh);
      const trail = new BABYLON.TrailMesh(uid("tr"), mesh, scene, 0.22, 36, true);
      trail.material = ship.team === "blue" ? mats.trailB : mats.trailR;
      glow.addIncludedOnlyMesh(trail);
      projectiles.push({
        mesh, trail, team: ship.team,
        vel: dir.scale(92),
        life: 3.4,
        dmg: ship.isFlag ? 28 : 20,
        owner: ship
      });
    }

    function fire(ship) {
      if (ship.isFlag) {
        spawnProjectile(ship, new BABYLON.Vector3(-0.85, 0.35, 0));
        spawnProjectile(ship, new BABYLON.Vector3(0.85, 0.35, 0));
      } else {
        spawnProjectile(ship, new BABYLON.Vector3(0, 0.12, 0));
      }
      ship.fireCd = ship.fireEvery;
    }

    function flashLight(pos, color, intensity, life) {
      const l = new BABYLON.PointLight(uid("fl"), pos.clone(), scene);
      l.diffuse = color;
      l.specular = color;
      l.intensity = intensity;
      l.range = 40;
      const born = performance.now();
      const obs = scene.onBeforeRenderObservable.add(() => {
        const k = 1 - (performance.now() - born) / (life * 1000);
        if (k <= 0) {
          scene.onBeforeRenderObservable.remove(obs);
          l.dispose();
          return;
        }
        l.intensity = intensity * k * k;
      });
    }

    function burstParticles(pos, opts) {
      const ps = new BABYLON.ParticleSystem(uid("ps"), opts.count, scene);
      ps.particleTexture = ptex;
      ps.emitter = pos.clone();
      ps.minEmitBox = opts.box.scale(-1);
      ps.maxEmitBox = opts.box;
      ps.color1 = opts.c1;
      ps.color2 = opts.c2;
      ps.colorDead = opts.dead;
      ps.minSize = opts.minS;
      ps.maxSize = opts.maxS;
      ps.minLifeTime = opts.minL;
      ps.maxLifeTime = opts.maxL;
      ps.emitRate = opts.count * 8;
      ps.targetStopDuration = opts.dur;
      ps.disposeOnStop = true;
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
      ps.gravity = opts.grav || BABYLON.Vector3.Zero();
      ps.direction1 = opts.d1;
      ps.direction2 = opts.d2;
      ps.minEmitPower = opts.minP;
      ps.maxEmitPower = opts.maxP;
      ps.updateSpeed = 0.016;
      ps.minAngularSpeed = -4;
      ps.maxAngularSpeed = 4;
      ps.start();
      return ps;
    }

    function explode(ship) {
      if (!ship.alive || ship.exploding) return;
      ship.exploding = true;
      ship.alive = false;
      const pos = ship.pos.clone();
      const big = ship.isFlag;
      const team = ship.team;
      const scale = big ? 2.15 : 1;

      ship.root.setEnabled(false);
      if (ship.hb) ship.hb.setEnabled(false);

      const fireC1 = team === "blue"
        ? new BABYLON.Color4(0.55, 0.85, 1, 1)
        : new BABYLON.Color4(1, 0.75, 0.25, 1);
      const fireC2 = team === "blue"
        ? new BABYLON.Color4(0.2, 0.45, 1, 0.9)
        : new BABYLON.Color4(1, 0.28, 0.08, 0.9);
      const sparkC = team === "blue"
        ? new BABYLON.Color4(0.85, 0.95, 1, 1)
        : new BABYLON.Color4(1, 0.9, 0.55, 1);

      flashLight(pos, team === "blue" ? new BABYLON.Color3(0.4, 0.7, 1) : new BABYLON.Color3(1, 0.45, 0.15), big ? 14 : 7, 0.45);

      burstParticles(pos, {
        count: big ? 280 : 140,
        box: new BABYLON.Vector3(0.4, 0.4, 0.4),
        c1: fireC1, c2: fireC2,
        dead: new BABYLON.Color4(1, 0.4, 0.1, 0),
        minS: 0.5 * scale, maxS: 2.4 * scale,
        minL: 0.25, maxL: 0.7, dur: 0.22,
        d1: new BABYLON.Vector3(-1, -0.4, -1),
        d2: new BABYLON.Vector3(1, 1.2, 1),
        minP: 6, maxP: 22 * scale
      });
      burstParticles(pos, {
        count: big ? 220 : 110,
        box: new BABYLON.Vector3(0.2, 0.2, 0.2),
        c1: sparkC, c2: new BABYLON.Color4(1, 1, 1, 1),
        dead: new BABYLON.Color4(1, 0.8, 0.3, 0),
        minS: 0.08, maxS: 0.28,
        minL: 0.35, maxL: 1.1, dur: 0.18,
        d1: new BABYLON.Vector3(-1, -1, -1),
        d2: new BABYLON.Vector3(1, 1, 1),
        minP: 14, maxP: 46 * scale
      });
      burstParticles(pos, {
        count: big ? 90 : 45,
        box: new BABYLON.Vector3(0.6, 0.6, 0.6),
        c1: new BABYLON.Color4(0.25, 0.25, 0.28, 0.45),
        c2: new BABYLON.Color4(0.15, 0.15, 0.18, 0.25),
        dead: new BABYLON.Color4(0.1, 0.1, 0.1, 0),
        minS: 1.4 * scale, maxS: 4.2 * scale,
        minL: 0.8, maxL: 1.8, dur: 0.3,
        d1: new BABYLON.Vector3(-0.6, 0.2, -0.6),
        d2: new BABYLON.Vector3(0.6, 1, 0.6),
        minP: 1.5, maxP: 6,
        grav: new BABYLON.Vector3(0, 0.4, 0)
      });

      const shock = BABYLON.MeshBuilder.CreateTorus(uid("sh"), {
        diameter: 1.2, thickness: 0.18, tessellation: 32
      }, scene);
      shock.position.copyFrom(pos);
      shock.rotation.x = Math.PI / 2;
      const sm = mats.shock.clone(uid("shm"));
      sm.emissiveColor = team === "blue" ? new BABYLON.Color3(0.55, 0.8, 1) : new BABYLON.Color3(1, 0.7, 0.35);
      sm.alpha = 0.85;
      shock.material = sm;
      glow.addIncludedOnlyMesh(shock);
      shocks.push({ mesh: shock, mat: sm, age: 0, life: 0.55, grow: big ? 38 : 18 });

      const disc = BABYLON.MeshBuilder.CreateDisc(uid("sd"), { radius: 0.6, tessellation: 28 }, scene);
      disc.position.copyFrom(pos);
      disc.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      const dm = unlit(uid("dm"), team === "blue" ? "#9ad8ff" : "#ffc27a", 0.7);
      disc.material = dm;
      glow.addIncludedOnlyMesh(disc);
      shocks.push({ mesh: disc, mat: dm, age: 0, life: 0.32, grow: big ? 26 : 12, disc: true });

      const bits = big ? 16 : 9;
      for (let i = 0; i < bits; i++) {
        const sz = (0.18 + Math.random() * 0.55) * (big ? 1.4 : 1);
        const piece = box(sz, sz * (0.4 + Math.random()), sz * (0.5 + Math.random() * 0.8),
          Math.random() > 0.5 ? (team === "blue" ? mats.hullB : mats.hullR) : mats.dark, null);
        piece.position.copyFrom(pos);
        const dir = new BABYLON.Vector3(Math.random() - 0.5, Math.random() - 0.25, Math.random() - 0.5).normalize();
        debris.push({
          mesh: piece,
          vel: dir.scale(8 + Math.random() * 22 * scale),
          spin: new BABYLON.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8),
          life: 1.6 + Math.random() * 1.4
        });
      }

      if (big) shake = Math.max(shake, 1.15);
      else shake = Math.max(shake, 0.35);

      const chainR = ship.radius * 2.05;
      window.setTimeout(() => {
        for (const other of ships) {
          if (!other.alive || other === ship) continue;
          if (BABYLON.Vector3.Distance(pos, other.pos) <= chainR + other.radius * 0.15) {
            explode(other);
          }
        }
      }, 90);

      refreshScore();
    }

    function hitShip(ship, dmg, point) {
      if (!ship.alive) return;
      ship.hp -= dmg;
      updateHealthBar(ship);
      flashLight(point || ship.pos, new BABYLON.Color3(1, 0.9, 0.6), 2.2, 0.12);
      if (ship.hp <= 0) explode(ship);
    }

    function refreshScore() {
      const b = living("blue").length;
      const r = living("red").length;
      document.getElementById("blue-count").textContent = b;
      document.getElementById("red-count").textContent = r;
      if (!battleOver && (b === 0 || r === 0)) {
        battleOver = true;
        const el = document.getElementById("banner");
        if (b === 0 && r === 0) {
          el.textContent = "Mutual Annihilation";
          el.style.color = "#f0e6c8";
        } else if (b === 0) {
          el.textContent = "Crimson Host Victorious";
          el.style.color = "#ff7a6e";
        } else {
          el.textContent = "Cygnus Armada Victorious";
          el.style.color = "#7ecbff";
        }
        el.classList.add("show");
      }
    }

    const lookQ = new BABYLON.Quaternion();
    const tmpT = new BABYLON.Vector3();
    const tmpS = new BABYLON.Vector3(1, 1, 1);

    function steerShips(dt) {
      const n = ships.length;
      for (let i = 0; i < n; i++) {
        const a = ships[i];
        if (!a.alive) continue;
        a.sep.set(0, 0, 0);
        for (let j = i + 1; j < n; j++) {
          const b = ships[j];
          if (!b.alive) continue;
          const dx = a.pos.x - b.pos.x, dy = a.pos.y - b.pos.y, dz = a.pos.z - b.pos.z;
          const d2 = dx * dx + dy * dy + dz * dz;
          const min = (a.radius + b.radius) * 1.35;
          if (d2 < min * min && d2 > 0.001) {
            const d = Math.sqrt(d2);
            const push = (min - d) / d;
            a.sep.x += dx * push; a.sep.y += dy * push; a.sep.z += dz * push;
            b.sep.x -= dx * push; b.sep.y -= dy * push; b.sep.z -= dz * push;
          }
        }
      }

      for (const ship of ships) {
        if (!ship.alive) continue;
        if (!ship.target || !ship.target.alive || Math.random() < 0.004) {
          ship.target = pickTarget(ship);
        }
        ship.orbit += dt * (0.35 + (ship.isFlag ? 0.08 : 0.22));
        ship.wander += dt * 0.7;

        const desired = tmpT;
        const flag = ship.team === "blue" ? blueFlag : redFlag;
        if (ship.target) {
          const ox = Math.cos(ship.orbit) * ship.orbitH;
          const oz = Math.sin(ship.orbit * 0.85) * ship.orbitH * 0.75;
          const oy = Math.sin(ship.orbit * 0.6 + ship.wander) * ship.orbitY;
          desired.copyFrom(ship.target.pos);
          desired.x += ox;
          desired.y += oy;
          desired.z += oz;
        } else {
          desired.set(ship.team === "blue" ? -40 : 40, Math.sin(ship.wander) * 8, Math.cos(ship.orbit) * 20);
        }
        if (!ship.isFlag && flag && flag.alive) {
          const toF = ship.pos.subtract(flag.pos);
          const fd = toF.length();
          if (fd > 48) {
            desired.x = desired.x * 0.35 + (flag.pos.x + toF.x / fd * 22) * 0.65;
            desired.y = desired.y * 0.35 + flag.pos.y * 0.65;
            desired.z = desired.z * 0.35 + (flag.pos.z + toF.z / fd * 22) * 0.65;
          }
        }

        const steer = desired.subtract(ship.pos);
        const dist = steer.length() || 1;
        const maxSpd = ship.isFlag ? 13.5 : 19.5;
        steer.scaleInPlace(Math.min(maxSpd, dist * 0.55) / dist);
        steer.addInPlace(ship.sep.scale(7));
        if (ship.pos.y > 34) steer.y -= (ship.pos.y - 34) * 0.8;
        if (ship.pos.y < -22) steer.y += (-22 - ship.pos.y) * 0.8;
        const lim = 130;
        if (Math.abs(ship.pos.x) > lim) steer.x -= Math.sign(ship.pos.x) * (Math.abs(ship.pos.x) - lim);
        if (Math.abs(ship.pos.z) > lim) steer.z -= Math.sign(ship.pos.z) * (Math.abs(ship.pos.z) - lim);

        BABYLON.Vector3.LerpToRef(ship.vel, steer, 1 - Math.pow(0.08, dt * 2.4), ship.vel);
        ship.pos.addInPlace(ship.vel.scale(dt));

        const spd = ship.vel.length();
        if (spd > 0.4) {
          const wantYaw = Math.atan2(ship.vel.x, ship.vel.z);
          let dy = wantYaw - ship.yaw;
          while (dy > Math.PI) dy -= Math.PI * 2;
          while (dy < -Math.PI) dy += Math.PI * 2;
          ship.yaw += dy * Math.min(1, dt * 2.8);
          const wantPitch = -Math.asin(Math.max(-1, Math.min(1, ship.vel.y / spd)));
          ship.pitch += (wantPitch - ship.pitch) * Math.min(1, dt * 2.2);
        }
        if (ship.target && ship.target.alive) {
          const toT = ship.target.pos.subtract(ship.pos);
          const td = toT.length();
          const fw = forwardOf(ship);
          const aim = BABYLON.Vector3.Dot(fw, toT.scale(1 / (td || 1)));
          const sinceStart = (performance.now() - t0) / 1000;
          ship.fireCd -= dt;
          if (sinceStart > 2.2 && ship.fireCd <= 0 && aim > 0.62 && td < 115) fire(ship);
        } else {
          ship.fireCd -= dt;
        }

        const roll = BABYLON.Scalar.Clamp(-ship.vel.x * 0.03 - (ship.yaw) * 0, -0.55, 0.55);
        const q = BABYLON.Quaternion.FromEulerAngles(ship.pitch, ship.yaw, roll * 0.35 + Math.sin(ship.orbit) * 0.04);
        ship.root.rotationQuaternion = q;
        if (ship.hb) {
          ship.hb.position.copyFrom(ship.pos);
          ship.hb.position.y += ship.isFlag ? 5.6 : 2.15;
        }
      }
    }

    function updateProjectiles(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.life -= dt;
        p.mesh.position.addInPlace(p.vel.scale(dt));
        let dead = p.life <= 0;
        if (!dead) {
          for (const s of ships) {
            if (!s.alive || s.team === p.team) continue;
            const d = BABYLON.Vector3.Distance(p.mesh.position, s.pos);
            if (d < s.radius + 0.55) {
              hitShip(s, p.dmg, p.mesh.position);
              burstParticles(p.mesh.position, {
                count: 28,
                box: new BABYLON.Vector3(0.1, 0.1, 0.1),
                c1: s.team === "blue" ? new BABYLON.Color4(1, 0.6, 0.3, 1) : new BABYLON.Color4(0.6, 0.85, 1, 1),
                c2: new BABYLON.Color4(1, 1, 1, 1),
                dead: new BABYLON.Color4(1, 1, 1, 0),
                minS: 0.1, maxS: 0.4, minL: 0.12, maxL: 0.32, dur: 0.08,
                d1: new BABYLON.Vector3(-1, -1, -1), d2: new BABYLON.Vector3(1, 1, 1),
                minP: 4, maxP: 14
              });
              dead = true;
              break;
            }
          }
        }
        if (dead) {
          p.trail.dispose();
          p.mesh.dispose();
          projectiles.splice(i, 1);
        }
      }
    }

    function updateVfx(dt) {
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.life -= dt;
        d.mesh.position.addInPlace(d.vel.scale(dt));
        d.vel.scaleInPlace(0.985);
        d.mesh.rotation.x += d.spin.x * dt;
        d.mesh.rotation.y += d.spin.y * dt;
        d.mesh.rotation.z += d.spin.z * dt;
        if (d.life <= 0) {
          d.mesh.dispose();
          debris.splice(i, 1);
        } else if (d.life < 0.4) {
          d.mesh.visibility = d.life / 0.4;
        }
      }
      for (let i = shocks.length - 1; i >= 0; i--) {
        const s = shocks[i];
        s.age += dt;
        const t = s.age / s.life;
        const k = 1 - Math.pow(1 - t, 2);
        const sc = 0.4 + k * s.grow;
        if (s.disc) s.mesh.scaling.set(sc, sc, sc);
        else s.mesh.scaling.set(sc, 0.35 + k * 0.8, sc);
        s.mat.alpha = (1 - t) * (s.disc ? 0.55 : 0.8);
        if (t >= 1) {
          s.mesh.dispose();
          s.mat.dispose();
          shocks.splice(i, 1);
        }
      }
    }

    ships.forEach(updateHealthBar);

    let introR = 240;
    camera.radius = introR;

    scene.registerBeforeRender(() => {
      const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
      steerShips(dt);
      updateProjectiles(dt);
      updateVfx(dt);

      if (blueFlag.alive) {
        const f = forwardOf(blueFlag);
        blueEngineLight.position.copyFrom(blueFlag.pos).addInPlace(f.scale(-6));
        blueEngineLight.intensity = 1.5 + Math.sin(performance.now() * 0.012) * 0.35;
      } else {
        blueEngineLight.intensity *= 0.9;
      }
      if (redFlag.alive) {
        const f = forwardOf(redFlag);
        redEngineLight.position.copyFrom(redFlag.pos).addInPlace(f.scale(-6));
        redEngineLight.intensity = 1.5 + Math.sin(performance.now() * 0.013 + 1) * 0.35;
      } else {
        redEngineLight.intensity *= 0.9;
      }

      if (introR > 158) {
        introR += (150 - introR) * 0.02;
        camera.radius = introR;
      }
      if (shake > 0.01) {
        camera.target.x = Math.sin(performance.now() * 0.06) * shake * 1.4;
        camera.target.y = 6 + Math.cos(performance.now() * 0.08) * shake * 1.1;
        shake *= Math.pow(0.08, dt);
      } else {
        camera.target.x *= 0.9;
        camera.target.y += (6 - camera.target.y) * 0.05;
      }
    });

    scene.executeWhenReady(() => {
      document.getElementById("loader").classList.add("hide");
    });

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  })();
  </script>
</body>
