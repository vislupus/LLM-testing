<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Babylon.js Space Battle</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#c{width:100%;height:100%;display:block}
#info{position:fixed;top:10px;left:10px;color:#ddd;font-family:system-ui;font-size:13px;background:rgba(0,0,0,.4);padding:8px 10px;border-radius:8px}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Babylon.js Space Battle • Orbit with mouse • Blue vs Red • 10 vs 10</div>
<script>
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true);
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0,0,0,1);

const camera=new BABYLON.ArcRotateCamera('cam',Math.PI/2,1.1,260,BABYLON.Vector3.Zero(),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=80;camera.upperRadiusLimit=500;

new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene).intensity=0.6;
const glow=new BABYLON.GlowLayer('glow',scene);
glow.intensity=0.7;

// Starfield
const pcs=new BABYLON.PointsCloudSystem('stars',2,scene);
pcs.addPoints(4000,(p,i)=>{
  const r=700;
  const u=Math.random()*2*Math.PI;
  const v=Math.acos(2*Math.random()-1);
  p.position.x=r*Math.sin(v)*Math.cos(u);
  p.position.y=r*Math.sin(v)*Math.sin(u);
  p.position.z=r*Math.cos(v);
});
pcs.buildMeshAsync();

// Helper
function makeShip(team,isFlagship,basePos,offset){
  const group=new BABYLON.TransformNode('g',scene);
  group.position=basePos.add(offset);
  const size=isFlagship?2.2:1.2;
  const mat=new BABYLON.StandardMaterial('m',scene);
  mat.diffuseColor=team==='blue'?new BABYLON.Color3(0.2,0.6,1):new BABYLON.Color3(1,0.25,0.25);
  mat.emissiveColor=mat.diffuseColor.scale(0.35);
  const body=BABYLON.MeshBuilder.CreateBox('body',{size:size},scene);
  body.parent=group;body.material=mat;
  const nose=BABYLON.MeshBuilder.CreateCylinder('nose',{diameterTop:0,height:size*1.2,tessellation:4},scene);
  nose.rotation.z=Math.PI/2;nose.position.z=size*0.8;
  nose.parent=group;nose.material=mat;
  // thruster
  const light=new BABYLON.PointLight('l',new BABYLON.Vector3(0,0,-size),scene);
  light.parent=group;light.intensity=0.8;light.range=30;
  // health bar
  const bg=BABYLON.MeshBuilder.CreateBox('bg',{width:2.6,height:0.18,depth:0.1},scene);
  bg.position.y=size+2.2;bg.parent=group;
  const bgm=new BABYLON.StandardMaterial('bgm',scene);bgm.diffuseColor=new BABYLON.Color3(0,0,0);bg.parentMaterial=bgm;
  const fg=BABYLON.MeshBuilder.CreateBox('fg',{width:2.4,height:0.14,depth:0.1},scene);
  fg.position.y=size+2.2;fg.parent=group;
  const fgm=new BABYLON.StandardMaterial('fgm',scene);fgm.diffuseColor=new BABYLON.Color3(0,1,0.3);fg.material=fgm;
  const ship={group,team,isFlagship,health:isFlagship?300:100,maxHealth:isFlagship?300:100,cooldown:Math.random()*3,alive:true,bar:fg,speed:isFlagship?0.03:0.06};
  return ship;
}

const ships=[];
const blueBase=new BABYLON.Vector3(-80,0,0);
const redBase=new BABYLON.Vector3(80,0,0);
function randOffset(){return new BABYLON.Vector3((Math.random()-0.5)*40,(Math.random()-0.5)*20,(Math.random()-0.5)*40);}
for(let i=0;i<10;i++){
  const flag=i===0;
  ships.push(makeShip('blue',flag,blueBase,randOffset()));
  ships.push(makeShip('red',flag,redBase,randOffset()));
}

// Projectiles
const projectiles=[];

function fire(ship,target){
  const dir=target.position.subtract(ship.group.position).normalize();
  for(let k=0;k<(ship.isFlagship?2:1);k++){
    const p=BABYLON.MeshBuilder.CreateSphere('proj',{diameter:0.35},scene);
    const mat=new BABYLON.StandardMaterial('pm',scene);
    mat.emissiveColor=ship.team==='blue'?new BABYLON.Color3(0,0.8,1):new BABYLON.Color3(1,0.2,0);
    p.material=mat;
    p.position=ship.group.position.clone().add(dir.scale(3));
    p.metadata={team:ship.team,speed:2.2,dir:dir.clone(),life:0};
    projectiles.push(p);
  }
}

function explode(pos){
  const s=BABYLON.MeshBuilder.CreateSphere('exp',{diameter:1},scene);
  s.position=pos.clone();
  const m=new BABYLON.StandardMaterial('em',scene);
  m.emissiveColor=new BABYLON.Color3(1,0.6,0.1);
  s.material=m;
  let t=0;
  scene.onBeforeRenderObservable.add(()=>{t+=engine.getDeltaTime()*0.001; s.scaling.scaleInPlace(1+ t*4); s.material.alpha=1-t; if(t>0.6){s.dispose(); scene.onBeforeRenderObservable.removeCurrent();}});
  const ps=new BABYLON.ParticleSystem('ps',2000,scene);
  ps.particleTexture=new BABYLON.Texture('https://playground.babylonjs.com/textures/flare.png',scene);
  ps.emitter=pos;ps.minEmitBox=BABYLON.Vector3.Zero();ps.maxEmitBox=BABYLON.Vector3.Zero();
  ps.color1=new BABYLON.Color4(1,0.6,0.1,1);ps.color2=new BABYLON.Color4(1,0.9,0.4,1);ps.colorDead=new BABYLON.Color4(0,0,0,0);
  ps.minSize=0.1;ps.maxSize=0.6;ps.minLifeTime=0.2;ps.maxLifeTime=0.6;ps.emitRate=2000;ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ONEONE;ps.gravity=new BABYLON.Vector3(0,0,0);ps.direction1=new BABYLON.Vector3(-1,-1,-1);ps.direction2=new BABYLON.Vector3(1,1,1);ps.minEmitPower=2;ps.maxEmitPower=6;ps.start();
  setTimeout(()=>ps.stop(),150);
}

function killShip(ship){
  if(!ship.alive) return;
  ship.alive=false;
  explode(ship.group.position.clone());
  ship.group.dispose();
  // chain reaction
  for(const o of ships){
    if(o.alive && o!==ship){
      if(BABYLON.Vector3.Distance(ship.group.position,o.group.position)<8){
        o.health=0;
      }
    }
  }
}

scene.onBeforeRenderObservable.add(()=>{
  const dt=engine.getDeltaTime()*0.001;
  // ships AI
  for(const s of ships){
    if(!s.alive) continue;
    // find nearest enemy
    let target=null,dist=1e9;
    for(const o of ships){if(o.alive && o.team!==s.team){const d=BABYLON.Vector3.Distance(s.group.position,o.group.position); if(d<dist){dist=d;target=o;}}}
    if(!target) continue;
    const dir=target.group.position.subtract(s.group.position);
    const len=dir.length();
    dir.normalize();
    s.group.lookAt(target.group.position);
    s.group.position.addInPlace(dir.scale(s.speed*dt*60));
    // fire
    s.cooldown-=dt;
    if(len<70 && s.cooldown<=0 && len>4){
      fire(s,target);
      s.cooldown=3;
    }
    // health bar
    const r=s.health/s.maxHealth;
    s.bar.scaling.x=Math.max(0.01,r);
    s.bar.material.diffuseColor=new BABYLON.Color3(0,Math.max(0.2,r),0.3);
  }
  // projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    const md=p.metadata;
    md.life+=engine.getDeltaTime()*0.001;
    p.position.addInPlace(md.dir.scale(md.speed*engine.getDeltaTime()*0.06));
    if(md.life>8){p.dispose();projectiles.splice(i,1);continue;}
    for(const s of ships){
      if(!s.alive||s.team===md.team) continue;
      if(BABYLON.Vector3.Distance(p.position,s.group.position)<2.5){
        s.health-=s.isFlagship?40:25;
        if(s.health<=0) killShip(s);
        p.dispose();projectiles.splice(i,1);break;
      }
    }
  }
  // remove dead ships flagged by health
  for(const s of ships){if(s.alive && s.health<=0) killShip(s);}
});

window.addEventListener('resize',()=>engine.resize());
engine.runRenderLoop(()=>scene.render());
</script>
</body>
</html>
