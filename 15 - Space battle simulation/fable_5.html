<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Rift — Fleet Engagement</title>
<style>
  :root{
    --ink:#060a14;
    --steel:#93a7c4;
    --steel-dim:#48566e;
    --azure:#4fc3ff;
    --crimson:#ff5a47;
    --amber:#ffb35c;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--ink); }
  body{
    font-family:"Cascadia Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--steel);
  }
  #scene{ width:100%; height:100%; display:block; outline:none; touch-action:none; }
  #vignette{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%);
  }
  #hud{
    position:fixed; top:18px; left:20px; pointer-events:none; user-select:none;
  }
  #hud .eyebrow{
    font-size:10px; letter-spacing:0.34em; color:var(--steel-dim);
    margin-bottom:10px; text-transform:uppercase;
  }
  #hud .fleet{
    display:flex; align-items:center; gap:10px; margin-bottom:7px;
  }
  #hud .fname{
    font-size:11px; letter-spacing:0.22em; width:86px; text-transform:uppercase;
  }
  #hud .fleet.azure .fname{ color:var(--azure); }
  #hud .fleet.crimson .fname{ color:var(--crimson); }
  .pips{ display:flex; gap:4px; align-items:center; }
  .pip{
    width:10px; height:10px; border:1px solid currentColor;
    transition:background 0.4s ease, opacity 0.4s ease;
  }
  .pip.flag{ width:15px; height:13px; }
  .fleet.azure .pip{ color:var(--azure); background:var(--azure); box-shadow:0 0 6px rgba(79,195,255,0.55); }
  .fleet.crimson .pip{ color:var(--crimson); background:var(--crimson); box-shadow:0 0 6px rgba(255,90,71,0.55); }
  .pip.lost{ background:transparent !important; box-shadow:none !important; opacity:0.32; }
  #hint{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    font-size:10px; letter-spacing:0.28em; color:var(--steel-dim);
    text-transform:uppercase; pointer-events:none; user-select:none; text-align:center;
  }
  #end{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(4,6,12,0.55); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity 0.9s ease;
  }
  #end.show{ opacity:1; pointer-events:auto; }
  #endcard{
    border:1px solid var(--steel-dim); padding:34px 46px; text-align:center;
    background:rgba(6,10,20,0.72);
  }
  #endcard .eyebrow{
    font-size:10px; letter-spacing:0.34em; color:var(--steel-dim); text-transform:uppercase; margin-bottom:14px;
  }
  #endtitle{ font-size:26px; letter-spacing:0.3em; text-transform:uppercase; margin-bottom:12px; }
  #endsub{ font-size:11px; letter-spacing:0.14em; color:var(--steel); margin-bottom:24px; }
  #again{
    font:inherit; font-size:11px; letter-spacing:0.26em; text-transform:uppercase;
    color:var(--steel); background:transparent; border:1px solid var(--steel-dim);
    padding:10px 22px; cursor:pointer;
  }
  #again:hover{ color:#fff; border-color:var(--steel); }
  #again:focus-visible{ outline:2px solid var(--azure); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    .pip{ transition:none; }
    #end{ transition:none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<div id="hud">
  <div class="eyebrow">Engagement 7-Kilo · Meridian Rift</div>
  <div class="fleet azure">
    <div class="fname">Azure</div>
    <div class="pips" id="pipsA"></div>
  </div>
  <div class="fleet crimson">
    <div class="fname">Crimson</div>
    <div class="pips" id="pipsB"></div>
  </div>
</div>

<div id="hint">drag · orbit&nbsp;&nbsp;&nbsp;wheel · zoom&nbsp;&nbsp;&nbsp;right-drag · pan</div>

<div id="end">
  <div id="endcard">
    <div class="eyebrow">Engagement resolved</div>
    <div id="endtitle"></div>
    <div id="endsub"></div>
    <button id="again" onclick="location.reload()">Re-engage</button>
  </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script id="game">
(function(){
'use strict';

if (!window.BABYLON){
  document.getElementById('hint').textContent = 'Failed to load Babylon.js from the CDN — check your internet connection and reload.';
  return;
}

const V3 = BABYLON.Vector3, C3 = BABYLON.Color3, C4 = BABYLON.Color4, Q = BABYLON.Quaternion;
const UP = new V3(0, 1, 0);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
function randDir(){
  const a = Math.random() * Math.PI * 2, z = Math.random() * 2 - 1, r = Math.sqrt(Math.max(0, 1 - z * z));
  return new V3(r * Math.cos(a), z, r * Math.sin(a));
}
function lookRotation(forward, up){
  const f = forward.clone().normalize();
  let r = V3.Cross(up || UP, f);
  if (r.lengthSquared() < 1e-6) r = V3.Cross(new V3(1, 0, 0), f);
  r.normalize();
  const u = V3.Cross(f, r);
  return Q.RotationQuaternionFromAxis(r, u, f);
}

// ---------------------------------------------------------------- engine / scene
const canvas = document.getElementById('scene');
const engine = new BABYLON.Engine(canvas, true, { stencil: true, antialias: true });
const scene = new BABYLON.Scene(engine);
scene.clearColor = new C4(0.012, 0.016, 0.035, 1);

const camera = new BABYLON.ArcRotateCamera('cam', -1.32, 1.12, 255, new V3(0, 2, 0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 18;
camera.upperRadiusLimit = 560;
camera.wheelDeltaPercentage = 0.012;
camera.pinchDeltaPercentage = 0.012;
camera.panningSensibility = 600;
camera.minZ = 0.5;
camera.maxZ = 6000;
camera.inertia = 0.88;
camera.useAutoRotationBehavior = true;
if (camera.autoRotationBehavior){
  camera.autoRotationBehavior.idleRotationSpeed = 0.05;
  camera.autoRotationBehavior.idleRotationWaitTime = 5000;
  camera.autoRotationBehavior.idleRotationSpinupTime = 3000;
}

const hemi = new BABYLON.HemisphericLight('hemi', new V3(0.2, 1, 0.1), scene);
hemi.intensity = 0.32;
hemi.diffuse = new C3(0.55, 0.66, 0.9);
hemi.groundColor = new C3(0.12, 0.1, 0.2);

const sunDir = new V3(-0.55, -0.42, 0.35).normalize();
const sun = new BABYLON.DirectionalLight('sun', sunDir, scene);
sun.intensity = 1.15;
sun.diffuse = new C3(1.0, 0.93, 0.82);
sun.specular = new C3(1, 0.95, 0.85);

const rim = new BABYLON.DirectionalLight('rim', new V3(0.5, 0.3, -0.6).normalize(), scene);
rim.intensity = 0.24;
rim.diffuse = new C3(0.35, 0.5, 0.95);
rim.specular = new C3(0.2, 0.3, 0.6);

const glowLayer = new BABYLON.GlowLayer('glow', scene);
glowLayer.intensity = 0.9;

// ---------------------------------------------------------------- shared procedural textures
function radialTexture(name, size, stops){
  const dt = new BABYLON.DynamicTexture(name, { width: size, height: size }, scene, false);
  dt.hasAlpha = true;
  const ctx = dt.getContext();
  ctx.clearRect(0, 0, size, size);
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  dt.update();
  return dt;
}
const flareTex = radialTexture('flare', 64, [
  [0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.6)'], [1, 'rgba(255,255,255,0)']
]);

// ---------------------------------------------------------------- sky dome + nebula sprites + sun impostor
(function makeSky(){
  const w = 2048, h = 1024;
  const dt = new BABYLON.DynamicTexture('skytex', { width: w, height: h }, scene, false);
  const ctx = dt.getContext();
  ctx.fillStyle = '#04060d';
  ctx.fillRect(0, 0, w, h);
  const nebs = [
    [w * 0.28, h * 0.35, h * 0.55, 'rgba(64,120,255,0.16)'],
    [w * 0.74, h * 0.6,  h * 0.5,  'rgba(150,70,255,0.13)'],
    [w * 0.52, h * 0.22, h * 0.34, 'rgba(255,90,80,0.10)'],
    [w * 0.12, h * 0.78, h * 0.4,  'rgba(40,220,255,0.08)'],
    [w * 0.9,  h * 0.3,  h * 0.45, 'rgba(255,150,60,0.07)']
  ];
  for (const n of nebs){
    const g = ctx.createRadialGradient(n[0], n[1], 0, n[0], n[1], n[2]);
    g.addColorStop(0, n[3]);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(n[0] - n[2], n[1] - n[2], n[2] * 2, n[2] * 2);
  }
  for (let i = 0; i < 1200; i++){
    const x = Math.random() * w, y = Math.random() * h;
    const r = Math.random();
    const radius = r > 0.985 ? 1.9 : (r > 0.9 ? 1.3 : 0.7);
    const cg = 205 + ((Math.random() * 50) | 0);
    ctx.fillStyle = 'rgba(' + cg + ',' + cg + ',255,' + (0.25 + Math.random() * 0.75).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  dt.update();
  const dome = BABYLON.MeshBuilder.CreateSphere('sky', { diameter: 2600, segments: 24, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
  const m = new BABYLON.StandardMaterial('skymat', scene);
  m.emissiveTexture = dt;
  m.diffuseColor = C3.Black();
  m.specularColor = C3.Black();
  m.disableLighting = true;
  m.backFaceCulling = false;
  dome.material = m;
  dome.isPickable = false;
  glowLayer.addExcludedMesh(dome);

  const nebulaDefs = [
    ['rgba(80,140,255,0.55)',  new V3(-620, 180, -540), 560],
    ['rgba(170,80,255,0.5)',   new V3(560, -140, -680), 640],
    ['rgba(255,110,70,0.42)',  new V3(120, 340, 760), 500]
  ];
  nebulaDefs.forEach(function(nd, i){
    const tex = radialTexture('neb' + i, 256, [[0, nd[0]], [0.55, nd[0].replace(/0\.\d+\)/, '0.16)')], [1, 'rgba(0,0,0,0)']]);
    const p = BABYLON.MeshBuilder.CreatePlane('nebp' + i, { size: nd[2] }, scene);
    const pm = new BABYLON.StandardMaterial('nebm' + i, scene);
    pm.diffuseTexture = tex;
    pm.emissiveTexture = tex;
    pm.useAlphaFromDiffuseTexture = true;
    pm.disableLighting = true;
    pm.backFaceCulling = false;
    p.material = pm;
    p.position.copyFrom(nd[1]);
    p.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
    p.isPickable = false;
    glowLayer.addExcludedMesh(p);
  });

  const sunTex = radialTexture('suntex', 256, [
    [0, 'rgba(255,246,224,1)'], [0.18, 'rgba(255,214,150,0.9)'], [0.45, 'rgba(255,160,90,0.32)'], [1, 'rgba(0,0,0,0)']
  ]);
  const sp = BABYLON.MeshBuilder.CreatePlane('sunp', { size: 260 }, scene);
  const sm = new BABYLON.StandardMaterial('sunm', scene);
  sm.diffuseTexture = sunTex;
  sm.emissiveTexture = sunTex;
  sm.useAlphaFromDiffuseTexture = true;
  sm.disableLighting = true;
  sm.backFaceCulling = false;
  sp.material = sm;
  sp.position.copyFrom(sunDir.scale(-1150));
  sp.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  sp.isPickable = false;
})();

// ---------------------------------------------------------------- fleets & materials
const ships = [];
const projectiles = [];
const fx = [];
const scheduled = [];
const stats = { kills: 0, chains: 0, shots: 0, hits: 0 };

function makeFleet(key, name, cssColor, accentHex, hullTint, facing){
  const accent = C3.FromHexString(accentHex);
  const F = { key: key, name: name, css: cssColor, accent: accent, facing: facing, ships: [], squads: [], alive: 0 };

  const hull = new BABYLON.StandardMaterial(key + '_hull', scene);
  hull.diffuseColor = hullTint;
  hull.specularColor = new C3(0.45, 0.5, 0.58);
  hull.specularPower = 48;
  hull.emissiveColor = hullTint.scale(0.05);
  hull.maxSimultaneousLights = 8;

  const dark = new BABYLON.StandardMaterial(key + '_dark', scene);
  dark.diffuseColor = hullTint.scale(0.32);
  dark.specularColor = new C3(0.22, 0.24, 0.28);
  dark.specularPower = 32;
  dark.maxSimultaneousLights = 8;

  const accentMat = new BABYLON.StandardMaterial(key + '_accent', scene);
  accentMat.emissiveColor = accent;
  accentMat.diffuseColor = C3.Black();
  accentMat.specularColor = C3.Black();
  accentMat.disableLighting = true;

  const glass = new BABYLON.StandardMaterial(key + '_glass', scene);
  glass.diffuseColor = accent.scale(0.18);
  glass.emissiveColor = accent.scale(0.55);
  glass.specularColor = new C3(1, 1, 1);
  glass.specularPower = 96;
  glass.maxSimultaneousLights = 8;

  const flame = new BABYLON.StandardMaterial(key + '_flame', scene);
  flame.emissiveColor = new C3(
    Math.min(1, accent.r * 0.75 + 0.45),
    Math.min(1, accent.g * 0.75 + 0.45),
    Math.min(1, accent.b * 0.75 + 0.45)
  );
  flame.diffuseColor = C3.Black();
  flame.specularColor = C3.Black();
  flame.disableLighting = true;
  flame.alpha = 0.75;
  flame.backFaceCulling = false;

  const proj = new BABYLON.StandardMaterial(key + '_proj', scene);
  proj.emissiveColor = accent.scale(1.5);
  proj.diffuseColor = C3.Black();
  proj.specularColor = C3.Black();
  proj.disableLighting = true;

  const trail = new BABYLON.StandardMaterial(key + '_trail', scene);
  trail.emissiveColor = accent;
  trail.diffuseColor = C3.Black();
  trail.specularColor = C3.Black();
  trail.disableLighting = true;
  trail.alpha = 0.7;
  trail.backFaceCulling = false;

  F.hullMat = hull; F.darkMat = dark; F.accentMat = accentMat; F.glassMat = glass;
  F.flameMat = flame; F.projMat = proj; F.trailMat = trail;
  F.c4a = new C4(Math.min(1, accent.r + 0.5), Math.min(1, accent.g + 0.5), Math.min(1, accent.b + 0.5), 1);
  F.c4b = new C4(accent.r, accent.g, accent.b, 1);
  return F;
}

const fleetA = makeFleet('A', 'Azure',   '#4fc3ff', '#4fc3ff', new C3(0.5, 0.56, 0.68), new V3(1, 0, 0));
const fleetB = makeFleet('B', 'Crimson', '#ff5a47', '#ff5a47', new C3(0.62, 0.5, 0.46), new V3(-1, 0, 0));
fleetA.enemy = fleetB;
fleetB.enemy = fleetA;
const fleets = [fleetA, fleetB];

const debrisMat = new BABYLON.StandardMaterial('debris', scene);
debrisMat.diffuseColor = new C3(0.16, 0.15, 0.16);
debrisMat.emissiveColor = new C3(0.55, 0.2, 0.05);
debrisMat.specularColor = new C3(0.1, 0.1, 0.1);
debrisMat.maxSimultaneousLights = 8;

// pooled explosion flash lights
const boomLights = [];
for (let i = 0; i < 2; i++){
  const L = new BABYLON.PointLight('boom' + i, new V3(0, -9999, 0), scene);
  L.diffuse = new C3(1, 0.72, 0.4);
  L.specular = new C3(1, 0.8, 0.5);
  L.intensity = 0;
  L.range = 80;
  boomLights.push(L);
}
let boomIdx = 0;

// ---------------------------------------------------------------- ship construction
function makeEngine(parentRoot, flames, pos, size, F){
  const noz = BABYLON.MeshBuilder.CreateCylinder('noz', { diameterTop: size * 1.15, diameterBottom: size * 0.8, height: size * 0.9, tessellation: 12 }, scene);
  noz.rotation.x = Math.PI / 2;
  noz.position.copyFrom(pos);
  noz.material = F.darkMat;
  noz.parent = parentRoot;

  const core = BABYLON.MeshBuilder.CreateCylinder('core', { diameter: size * 0.82, height: size * 0.3, tessellation: 12 }, scene);
  core.rotation.x = Math.PI / 2;
  core.position.copyFrom(pos);
  core.position.z -= size * 0.4;
  core.material = F.accentMat;
  core.parent = parentRoot;

  const flameMesh = BABYLON.MeshBuilder.CreateCylinder('flame', { diameterTop: size * 0.1, diameterBottom: size * 0.7, height: 1, tessellation: 10 }, scene);
  flameMesh.rotation.x = -Math.PI / 2;              // local +Y points to -Z (backwards)
  flameMesh.setPivotPoint(new V3(0, -0.5, 0));      // anchor at the wide base
  flameMesh.material = F.flameMat;
  flameMesh.parent = parentRoot;
  flameMesh.position.copyFrom(pos);
  flameMesh.position.z -= size * 0.45;              // pivot puts the base right at the nozzle exit
  flameMesh.metadata = { baseLen: size * 2.6 };
  flameMesh.isPickable = false;
  flames.push(flameMesh);
}

function buildEscort(F){
  const root = new BABYLON.TransformNode('escort', scene);
  const flames = [];

  const hull = BABYLON.MeshBuilder.CreateCapsule('hull', { height: 3.4, radius: 0.42, tessellation: 12, capSubdivisions: 4 }, scene);
  hull.rotation.x = Math.PI / 2;
  hull.material = F.hullMat;
  hull.parent = root;

  const nose = BABYLON.MeshBuilder.CreateCylinder('nose', { diameterTop: 0.05, diameterBottom: 0.62, height: 1.1, tessellation: 12 }, scene);
  nose.rotation.x = Math.PI / 2;
  nose.position.z = 2.15;
  nose.material = F.darkMat;
  nose.parent = root;

  const wing = BABYLON.MeshBuilder.CreateBox('wing', { width: 3.7, height: 0.09, depth: 1.15 }, scene);
  wing.position.z = -0.35;
  wing.material = F.hullMat;
  wing.parent = root;

  for (const sx of [-1, 1]){
    const tip = BABYLON.MeshBuilder.CreateBox('tip', { width: 0.22, height: 0.13, depth: 1.2 }, scene);
    tip.position.set(sx * 1.78, 0, -0.35);
    tip.material = F.accentMat;
    tip.parent = root;

    const gun = BABYLON.MeshBuilder.CreateCylinder('gun', { diameter: 0.09, height: 0.95, tessellation: 8 }, scene);
    gun.rotation.x = Math.PI / 2;
    gun.position.set(sx * 0.55, -0.08, 1.5);
    gun.material = F.darkMat;
    gun.parent = root;
  }

  const fin = BABYLON.MeshBuilder.CreateBox('fin', { width: 0.08, height: 0.85, depth: 0.95 }, scene);
  fin.position.set(0, 0.5, -1.15);
  fin.material = F.hullMat;
  fin.parent = root;

  const cockpit = BABYLON.MeshBuilder.CreateSphere('cockpit', { diameter: 0.55, segments: 10 }, scene);
  cockpit.scaling.set(0.85, 0.62, 1.5);
  cockpit.position.set(0, 0.34, 0.55);
  cockpit.material = F.glassMat;
  cockpit.parent = root;

  makeEngine(root, flames, new V3(0, 0, -1.95), 0.46, F);
  return { root: root, flames: flames };
}

function buildFlagship(F){
  const root = new BABYLON.TransformNode('flagship', scene);
  const flames = [];

  const hull = BABYLON.MeshBuilder.CreateCapsule('hull', { height: 15, radius: 1.7, tessellation: 16, capSubdivisions: 6 }, scene);
  hull.rotation.x = Math.PI / 2;
  hull.material = F.hullMat;
  hull.parent = root;

  const prow = BABYLON.MeshBuilder.CreateCylinder('prow', { diameterTop: 0.12, diameterBottom: 2.6, height: 4.2, tessellation: 14 }, scene);
  prow.rotation.x = Math.PI / 2;
  prow.position.z = 9.4;
  prow.material = F.darkMat;
  prow.parent = root;

  const keel = BABYLON.MeshBuilder.CreateBox('keel', { width: 0.28, height: 2.3, depth: 5.2 }, scene);
  keel.position.set(0, -1.9, -0.6);
  keel.material = F.hullMat;
  keel.parent = root;

  const bridge = BABYLON.MeshBuilder.CreateBox('bridge', { width: 2.3, height: 1.6, depth: 3.1 }, scene);
  bridge.position.set(0, 2.0, -2.6);
  bridge.material = F.hullMat;
  bridge.parent = root;

  const bridgeGlass = BABYLON.MeshBuilder.CreateBox('bglass', { width: 1.8, height: 0.34, depth: 0.16 }, scene);
  bridgeGlass.position.set(0, 2.25, -0.98);
  bridgeGlass.material = F.glassMat;
  bridgeGlass.parent = root;

  const antenna = BABYLON.MeshBuilder.CreateCylinder('ant', { diameter: 0.07, height: 2.4, tessellation: 6 }, scene);
  antenna.position.set(0, 3.7, -2.6);
  antenna.material = F.darkMat;
  antenna.parent = root;

  const antTip = BABYLON.MeshBuilder.CreateSphere('anttip', { diameter: 0.16, segments: 6 }, scene);
  antTip.position.set(0, 4.9, -2.6);
  antTip.material = F.accentMat;
  antTip.parent = root;

  const spine = BABYLON.MeshBuilder.CreateBox('spine', { width: 0.36, height: 0.18, depth: 9.5 }, scene);
  spine.position.set(0, 1.72, 1.2);
  spine.material = F.accentMat;
  spine.parent = root;

  for (const sx of [-1, 1]){
    const stripe = BABYLON.MeshBuilder.CreateBox('stripe', { width: 0.12, height: 0.4, depth: 8.5 }, scene);
    stripe.position.set(sx * 1.74, 0.1, 0.3);
    stripe.material = F.accentMat;
    stripe.parent = root;

    const pylon = BABYLON.MeshBuilder.CreateBox('pylon', { width: 1.7, height: 0.2, depth: 1.5 }, scene);
    pylon.position.set(sx * 2.1, -0.2, -2.2);
    pylon.material = F.darkMat;
    pylon.parent = root;

    const nac = BABYLON.MeshBuilder.CreateCylinder('nac', { diameter: 1.5, height: 6.2, tessellation: 14 }, scene);
    nac.rotation.x = Math.PI / 2;
    nac.position.set(sx * 3.05, -0.2, -2.2);
    nac.material = F.hullMat;
    nac.parent = root;

    const nacCap = BABYLON.MeshBuilder.CreateCylinder('naccap', { diameterTop: 0.15, diameterBottom: 1.5, height: 1.6, tessellation: 14 }, scene);
    nacCap.rotation.x = Math.PI / 2;
    nacCap.position.set(sx * 3.05, -0.2, 1.7);
    nacCap.material = F.darkMat;
    nacCap.parent = root;
  }

  const turretSpots = [ new V3(0.9, 1.65, 3.4), new V3(-0.9, 1.65, 3.4), new V3(0, -1.62, 3.2) ];
  for (const tp of turretSpots){
    const tb = BABYLON.MeshBuilder.CreateSphere('turret', { diameter: 0.8, segments: 8 }, scene);
    tb.position.copyFrom(tp);
    tb.material = F.darkMat;
    tb.parent = root;
    const barrel = BABYLON.MeshBuilder.CreateCylinder('barrel', { diameter: 0.12, height: 1.3, tessellation: 6 }, scene);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(tp.x, tp.y, tp.z + 0.8);
    barrel.material = F.darkMat;
    barrel.parent = root;
  }

  makeEngine(root, flames, new V3(3.05, -0.2, -5.6), 1.0, F);
  makeEngine(root, flames, new V3(-3.05, -0.2, -5.6), 1.0, F);
  makeEngine(root, flames, new V3(0.85, 0.15, -7.45), 0.85, F);
  makeEngine(root, flames, new V3(-0.85, 0.15, -7.45), 0.85, F);

  const engineLight = new BABYLON.PointLight('flagEngL', new V3(0, 0, -9.8), scene);
  engineLight.diffuse = F.accent;
  engineLight.specular = F.accent.scale(0.6);
  engineLight.intensity = 1.7;
  engineLight.range = 48;
  engineLight.parent = root;

  return { root: root, flames: flames };
}

// ---------------------------------------------------------------- health bars
function makeHealthBar(s){
  const w = s.isFlag ? 9 : 3.4, h = s.isFlag ? 0.8 : 0.42;
  const dt = new BABYLON.DynamicTexture('bar', { width: 128, height: 20 }, scene, false);
  dt.hasAlpha = true;
  const plane = BABYLON.MeshBuilder.CreatePlane('barp', { width: w, height: h }, scene);
  const m = new BABYLON.StandardMaterial('barm', scene);
  m.diffuseTexture = dt;
  m.emissiveTexture = dt;
  m.useAlphaFromDiffuseTexture = true;
  m.disableLighting = true;
  m.backFaceCulling = false;
  plane.material = m;
  plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  plane.isPickable = false;
  glowLayer.addExcludedMesh(plane);
  s.bar = plane;
  s.barTex = dt;
  s.barMat = m;
  s.barY = s.isFlag ? 6.8 : 2.6;
  drawBar(s);
}
function drawBar(s){
  const ctx = s.barTex.getContext();
  ctx.clearRect(0, 0, 128, 20);
  ctx.fillStyle = 'rgba(6,10,18,0.78)';
  ctx.fillRect(0, 0, 128, 20);
  ctx.strokeStyle = 'rgba(185,205,235,0.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, 126, 18);
  const f = clamp(s.hp / s.maxHp, 0, 1);
  ctx.fillStyle = f > 0.5 ? '#46e08a' : (f > 0.25 ? '#ffb347' : '#ff5347');
  ctx.fillRect(3, 3, 122 * f, 14);
  s.barTex.update();
}
function syncBar(s){
  s.bar.position.copyFrom(s.root.position);
  s.bar.position.y += s.barY;
}

// ---------------------------------------------------------------- spawning
function spawnShip(F, isFlag, pos){
  const built = isFlag ? buildFlagship(F) : buildEscort(F);
  built.root.position.copyFrom(pos);
  built.root.rotationQuaternion = lookRotation(F.facing, UP);
  const maxHp = isFlag ? 720 : 165;
  const s = {
    fleet: F, isFlag: isFlag,
    root: built.root, flames: built.flames,
    hp: maxHp, maxHp: maxHp,
    radius: isFlag ? 6.8 : 2.1,
    chainDist: isFlag ? 13.5 : 6.5,   // blast reach, roughly a ship-width past the hull
    vel: new V3(0, 0, 0),
    maxSpeed: isFlag ? 7 : rand(15, 20),
    accel: isFlag ? 6 : 22,
    turn: isFlag ? 0.9 : rand(2.6, 3.8),
    range: isFlag ? 62 : rand(13, 35),
    orbitDir: Math.random() < 0.5 ? -1 : 1,
    wob: Math.random() * Math.PI * 2,
    wob2: Math.random() * Math.PI * 2,
    fireT: rand(0.4, 3),
    fireRange: isFlag ? 150 : 110,
    dmg: isFlag ? 38 : 25,
    projSpeed: isFlag ? 62 : 55,
    projTurn: isFlag ? 0.5 : 0.6,
    spread: isFlag ? 0.05 : 0.08,
    muzzles: isFlag ? [new V3(-2.0, 0.55, 8.8), new V3(2.0, 0.55, 8.8)] : [new V3(0, -0.05, 2.6)],
    bank: 0,
    throttle: 0.6,
    dead: false,
    doomed: false,
    boomScale: isFlag ? 2.7 : 1
  };
  makeHealthBar(s);
  syncBar(s);
  ships.push(s);
  F.ships.push(s);
  F.alive++;
  return s;
}

function makeSquad(F, members){
  const q = { members: members, target: null, retargetT: rand(0, 2) };
  for (const m of members) m.squad = q;
  F.squads.push(q);
  return q;
}

function deploy(F, cx){
  const center = new V3(cx, 0, 0);
  makeSquad(F, [spawnShip(F, true, center)]);
  const local = [new V3(0, 0, 0), new V3(0, 4.5, 4.5), new V3(0, -4.5, 4.5)];
  for (let sqi = 0; sqi < 3; sqi++){
    const a = (sqi / 3) * Math.PI * 2 + (cx < 0 ? 0 : Math.PI / 3);
    const anchor = new V3(0, Math.sin(a) * 16, Math.cos(a) * 16);
    const members = [];
    for (const off of local){
      const jitter = new V3(rand(-3, 3) - Math.sign(cx) * 2, 0, 0);
      members.push(spawnShip(F, false, center.add(anchor).add(off).add(jitter)));
    }
    makeSquad(F, members);
  }
}

deploy(fleetA, -105);
deploy(fleetB, 105);

// ---------------------------------------------------------------- particles / explosion pieces
function burst(pos, o){
  const ps = new BABYLON.ParticleSystem('burst', o.n, scene);
  ps.particleTexture = flareTex;
  ps.emitter = pos.clone();
  ps.createSphereEmitter(o.rad || 0.2, 1);
  ps.minEmitPower = o.p0;
  ps.maxEmitPower = o.p1;
  ps.minSize = o.s0;
  ps.maxSize = o.s1;
  ps.minLifeTime = o.l0;
  ps.maxLifeTime = o.l1;
  ps.color1 = o.c1;
  ps.color2 = o.c2;
  ps.colorDead = o.cd || new C4(0, 0, 0, 0);
  ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
  ps.updateSpeed = 1 / 60;
  ps.gravity = V3.Zero();
  ps.emitRate = 0;
  ps.manualEmitCount = o.n;
  ps.targetStopDuration = 0.06;
  ps.disposeOnStop = true;
  ps.start();
  schedule(4, function(){ if (scene.particleSystems.indexOf(ps) !== -1) ps.dispose(); });
  return ps;
}

function makeFlash(pos, sc){
  const m = BABYLON.MeshBuilder.CreateSphere('flash', { diameter: 1, segments: 10 }, scene);
  const mat = new BABYLON.StandardMaterial('flashm', scene);
  mat.emissiveColor = new C3(1, 0.95, 0.8);
  mat.diffuseColor = C3.Black();
  mat.specularColor = C3.Black();
  mat.disableLighting = true;
  mat.alpha = 0.95;
  m.material = mat;
  m.position.copyFrom(pos);
  m.isPickable = false;
  let t = 0;
  const dur = 0.28;
  return { update: function(dt){
    t += dt;
    const k = Math.min(1, t / dur);
    const sca = 0.8 + k * 7 * sc;
    m.scaling.set(sca, sca, sca);
    mat.alpha = Math.max(0, 0.95 * (1 - k));
    if (t >= dur){ mat.dispose(); m.dispose(); return false; }
    return true;
  }};
}

function makeRing(pos, sc, variant){
  const m = BABYLON.MeshBuilder.CreateTorus('ring', { diameter: 1.6, thickness: 0.12 + 0.06 * sc, tessellation: 40 }, scene);
  const mat = new BABYLON.StandardMaterial('ringm', scene);
  mat.emissiveColor = variant ? new C3(0.6, 0.8, 1) : new C3(1, 0.7, 0.35);
  mat.diffuseColor = C3.Black();
  mat.specularColor = C3.Black();
  mat.disableLighting = true;
  mat.alpha = 0.9;
  mat.backFaceCulling = false;
  m.material = mat;
  m.position.copyFrom(pos);
  m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  m.isPickable = false;
  let t = 0;
  const dur = 0.6 + 0.2 * variant;
  const maxS = (13 + 9 * variant) * sc;
  return { update: function(dt){
    t += dt;
    const k = Math.min(1, t / dur);
    const e = 1 - Math.pow(1 - k, 2.2);
    const sca = 0.6 + e * maxS;
    m.scaling.set(sca, sca, sca);
    mat.alpha = 0.9 * (1 - k);
    if (k >= 1){ mat.dispose(); m.dispose(); return false; }
    return true;
  }};
}

function makeDebris(pos, sc){
  const base = (0.16 + Math.random() * 0.4) * sc;
  const m = BABYLON.MeshBuilder.CreateBox('debris', {
    width: base, height: base * (0.4 + Math.random()), depth: base * (0.4 + Math.random() * 1.3)
  }, scene);
  m.material = debrisMat;
  m.isPickable = false;
  m.position.copyFrom(pos);
  const v = randDir().scale(rand(6, 6 + 20 * Math.min(sc, 2)));
  const av = new V3(rand(-8, 8), rand(-8, 8), rand(-8, 8));
  let t = 0;
  const life = rand(1.3, 2.6);
  return { update: function(dt){
    t += dt;
    m.position.addInPlace(v.scale(dt));
    v.scaleInPlace(Math.exp(-0.35 * dt));
    m.rotation.x += av.x * dt;
    m.rotation.y += av.y * dt;
    m.rotation.z += av.z * dt;
    const rem = life - t;
    m.visibility = rem < 0.5 ? Math.max(0, rem / 0.5) : 1;
    if (t >= life){ m.dispose(); return false; }
    return true;
  }};
}

function lightFader(L){
  let t = 0;
  const dur = 0.5;
  const i0 = L.intensity;
  return { update: function(dt){
    t += dt;
    L.intensity = Math.max(0, i0 * (1 - t / dur));
    return t < dur;
  }};
}

function schedule(t, fn){ scheduled.push({ t: t, fn: fn }); }

function explodeAt(pos, sc, srcShip){
  burst(pos, {
    n: Math.round(170 * Math.min(sc, 2.2)), rad: 0.6 * sc,
    p0: 5 * sc, p1: 16 * sc, s0: 0.9 * sc, s1: 2.4 * sc, l0: 0.35, l1: 0.95,
    c1: new C4(1, 0.82, 0.35, 1), c2: new C4(1, 0.32, 0.06, 1), cd: new C4(0.2, 0.02, 0, 0)
  });
  burst(pos, {
    n: Math.round(90 * Math.min(sc, 2)), rad: 0.2,
    p0: 16 * sc, p1: 38 * sc, s0: 0.12 * sc, s1: 0.32 * sc, l0: 0.5, l1: 1.3,
    c1: new C4(1, 1, 0.85, 1), c2: new C4(1, 0.75, 0.3, 1)
  });
  fx.push(makeFlash(pos, sc));
  fx.push(makeRing(pos, sc, 0));
  fx.push(makeRing(pos, sc, 1));
  const nd = 9 + ((Math.random() * 5) | 0) + (sc > 2 ? 9 : 0);
  for (let i = 0; i < nd; i++) fx.push(makeDebris(pos, sc));

  const L = boomLights[boomIdx++ % boomLights.length];
  L.position.copyFrom(pos);
  L.range = 70 * sc;
  L.intensity = 6 * sc;
  fx.push(lightFader(L));

  // chain reaction: anything within ~one ship-width of the blast goes up too
  if (srcShip){
    for (const o of ships){
      if (o.dead || o.doomed || o === srcShip) continue;
      const d = V3.Distance(pos, o.root.position);
      if (d - o.radius < srcShip.chainDist){
        o.doomed = true;
        o.tumbleAxis = randDir();
        o.tumbleRate = rand(1, 3);
        o.throttle = 0.12;
        stats.chains++;
        schedule(0.1 + d * 0.03, (function(victim){
          return function(){ if (!victim.dead) destroyShip(victim); };
        })(o));
      }
    }
  }
}

function impactFx(pos, F){
  burst(pos, { n: 22, rad: 0.15, p0: 4, p1: 12, s0: 0.25, s1: 0.6, l0: 0.2, l1: 0.5, c1: F.c4a, c2: F.c4b });
}
function muzzleFx(pos, F){
  burst(pos, { n: 10, rad: 0.1, p0: 2, p1: 6, s0: 0.25, s1: 0.5, l0: 0.1, l1: 0.25, c1: F.c4a, c2: F.c4b });
}

// ---------------------------------------------------------------- combat
function destroyShip(s){
  if (s.dead) return;
  s.dead = true;
  s.doomed = true;
  s.fleet.alive--;
  stats.kills++;
  const pos = s.root.position.clone();
  s.barMat.dispose(true, true);
  s.bar.dispose();
  s.root.dispose(false, false);
  explodeAt(pos, s.boomScale, s);
  updateHUD();
  checkEnd();
}

function damageShip(s, dmg, byFleet){
  if (s.dead || s.doomed) return;
  s.hp -= dmg;
  stats.hits++;
  if (s.hp <= 0) destroyShip(s);
  else drawBar(s);
}

function squadCentroid(q){
  const c = new V3(0, 0, 0);
  let n = 0;
  for (const m of q.members){
    if (m.dead) continue;
    c.addInPlace(m.root.position);
    n++;
  }
  return n ? c.scaleInPlace(1 / n) : c;
}

function pickSquadTarget(F, q){
  const pool = F.enemy.ships.filter(function(o){ return !o.dead && !o.doomed; });
  if (!pool.length) return null;
  const c = squadCentroid(q);
  pool.sort(function(a, b){
    return V3.DistanceSquared(c, a.root.position) - V3.DistanceSquared(c, b.root.position);
  });
  return pool[(Math.random() * Math.min(pool.length, 3)) | 0];
}

function fireVolley(s, tgt){
  s.root.computeWorldMatrix(true);
  const wm = s.root.getWorldMatrix();
  for (const m of s.muzzles){
    const pos = V3.TransformCoordinates(m, wm);
    spawnProjectile(s, pos, tgt);
  }
}

function spawnProjectile(s, pos, tgt){
  const F = s.fleet;
  const mesh = BABYLON.MeshBuilder.CreateSphere('proj', { diameter: s.isFlag ? 0.8 : 0.55, segments: 8 }, scene);
  mesh.material = F.projMat;
  mesh.isPickable = false;
  mesh.position.copyFrom(pos);
  const trail = new BABYLON.TrailMesh('trail', mesh, scene, s.isFlag ? 0.34 : 0.22, s.isFlag ? 34 : 26, true);
  trail.material = F.trailMat;
  trail.isPickable = false;

  const d = V3.Distance(pos, tgt.root.position);
  const lead = tgt.root.position.add(tgt.vel.scale(d / s.projSpeed));
  const dir = lead.subtract(pos);
  if (dir.lengthSquared() < 1e-6) dir.copyFrom(s.fleet.facing);
  dir.normalize();
  dir.addInPlace(randDir().scale(s.spread * Math.random()));
  dir.normalize();

  projectiles.push({
    mesh: mesh, trail: trail,
    vel: dir.scale(s.projSpeed), speed: s.projSpeed,
    turn: s.projTurn, dmg: s.dmg, fleet: F, target: tgt, t: 0
  });
  stats.shots++;
  muzzleFx(pos, F);
}

function updateProjectiles(dt){
  for (let i = projectiles.length - 1; i >= 0; i--){
    const pr = projectiles[i];
    pr.t += dt;
    let done = pr.t > 6 || pr.mesh.position.length() > 700;
    if (!done){
      const tgt = pr.target;
      if (tgt && !tgt.dead){
        const cur = pr.vel.scale(1 / pr.speed);
        const des = tgt.root.position.subtract(pr.mesh.position);
        const dl = des.length();
        if (dl > 1e-3){
          des.scaleInPlace(1 / dl);
          const dot = clamp(V3.Dot(cur, des), -1, 1);
          const ang = Math.acos(dot);
          if (ang > 1e-4){
            const f = Math.min(1, (pr.turn * dt) / ang);
            const nd = cur.scale(1 - f).add(des.scale(f));
            if (nd.lengthSquared() > 1e-6){
              nd.normalize();
              pr.vel.copyFrom(nd.scale(pr.speed));
            }
          }
        }
      }
      pr.mesh.position.addInPlace(pr.vel.scale(dt));
      for (const s of ships){
        if (s.dead || s.fleet === pr.fleet) continue;
        const rr = s.radius + 0.45;
        if (V3.DistanceSquared(s.root.position, pr.mesh.position) < rr * rr){
          impactFx(pr.mesh.position, pr.fleet);
          damageShip(s, pr.dmg, pr.fleet);
          done = true;
          break;
        }
      }
    }
    if (done){
      pr.trail.dispose();
      pr.mesh.dispose();
      projectiles.splice(i, 1);
    }
  }
}

// ---------------------------------------------------------------- ship behaviour
function updateShip(s, dt, t){
  const p = s.root.position;

  if (s.doomed){
    p.addInPlace(s.vel.scale(dt));
    if (s.tumbleAxis){
      const tq = Q.RotationAxis(s.tumbleAxis, s.tumbleRate * dt);
      s.root.rotationQuaternion = tq.multiply(s.root.rotationQuaternion);
    }
    flickerFlames(s);
    syncBar(s);
    return;
  }

  const tgt = s.squad.target;

  const desired = new V3(0, 0, 0);
  if (tgt){
    const to = tgt.root.position.subtract(p);
    const dist = Math.max(to.length(), 1e-4);
    const dir = to.scale(1 / dist);
    desired.addInPlace(dir.scale(clamp((dist - s.range) * 0.15, -1, 1)));
    let tang = V3.Cross(dir, UP);
    if (tang.lengthSquared() < 1e-4) tang = V3.Cross(dir, new V3(1, 0, 0));
    tang.normalize().scaleInPlace(s.orbitDir * 0.85);
    tang.y += Math.sin(t * 0.7 + s.wob) * 0.7;
    desired.addInPlace(tang);
  } else {
    desired.addInPlace(p.scale(-0.008));
  }

  const qm = s.squad.members;
  if (qm.length > 1){
    const c = new V3(0, 0, 0);
    let cnt = 0;
    for (const m of qm){
      if (m === s || m.dead || m.doomed) continue;
      c.addInPlace(m.root.position);
      cnt++;
    }
    if (cnt > 0){
      c.scaleInPlace(1 / cnt).subtractInPlace(p);
      const cl = c.length();
      if (cl > 7.5) desired.addInPlace(c.scale(0.6 / cl));
    }
  }

  desired.x += Math.sin(t * 1.3 + s.wob) * 0.35;
  desired.y += Math.cos(t * 1.1 + s.wob2) * 0.35;
  desired.z += Math.sin(t * 0.9 + s.wob + s.wob2) * 0.35;
  desired.y += Math.sin(t * 2.1 + s.wob2 * 2) * 0.3;

  for (const o of ships){
    if (o === s || o.dead) continue;
    const away = p.subtract(o.root.position);
    const l = away.length();
    const min = (s.radius + o.radius) * 1.5;
    if (l < min && l > 1e-3){
      desired.addInPlace(away.scale(((min - l) / min) * 2.2 / l));
    }
  }

  const rlen = p.length();
  if (rlen > 165) desired.addInPlace(p.scale(-(rlen - 165) * 0.02 / rlen));

  if (desired.lengthSquared() > 1e-6) desired.normalize();
  const desVel = desired.scale(s.maxSpeed);
  const steer = desVel.subtract(s.vel);
  const sl = steer.length();
  let lastAccel = null;
  if (sl > 1e-4){
    const a = steer.scale(Math.min(sl / Math.max(dt, 1e-4), s.accel) / sl);
    s.vel.addInPlace(a.scale(dt));
    lastAccel = a;
  }
  const sp = s.vel.length();
  if (sp > s.maxSpeed) s.vel.scaleInPlace(s.maxSpeed / sp);
  p.addInPlace(s.vel.scale(dt));

  let fwd = null;
  if (sp > 0.8) fwd = s.vel.scale(1 / sp);
  else if (tgt) fwd = tgt.root.position.subtract(p).normalize();
  if (fwd){
    let right = V3.Cross(UP, fwd);
    if (right.lengthSquared() < 1e-6) right = new V3(1, 0, 0);
    right.normalize();
    const lat = lastAccel ? V3.Dot(lastAccel, right) : 0;
    s.bank += (clamp(lat * 0.05, -0.9, 0.9) - s.bank) * Math.min(1, 4 * dt);
    const upv = UP.add(right.scale(s.bank)).normalize();
    const q = lookRotation(fwd, upv);
    Q.SlerpToRef(s.root.rotationQuaternion, q, Math.min(1, s.turn * dt), s.root.rotationQuaternion);
  }

  s.throttle = clamp(sp / s.maxSpeed, 0.18, 1);
  flickerFlames(s);

  s.fireT -= dt;
  if (s.fireT <= 0){
    if (tgt && !tgt.dead && V3.Distance(p, tgt.root.position) < s.fireRange){
      fireVolley(s, tgt);
      s.fireT = 3;                    // escorts: 1 shot / 3 s — flagships: 2 shots / 3 s
    } else {
      s.fireT = 0.25;
    }
  }

  syncBar(s);
}

function flickerFlames(s){
  for (const f of s.flames){
    f.scaling.y = f.metadata.baseLen * (0.7 + s.throttle * 0.85) * rand(0.85, 1.15);
    const wsc = rand(0.85, 1.12);
    f.scaling.x = wsc;
    f.scaling.z = wsc;
  }
}

// ---------------------------------------------------------------- HUD / end state
const pipEls = { A: [], B: [] };
(function buildPips(){
  [['A', 'pipsA'], ['B', 'pipsB']].forEach(function(cfg){
    const wrap = document.getElementById(cfg[1]);
    if (!wrap) return;
    for (let i = 0; i < 10; i++){
      const el = document.createElement('div');
      el.className = 'pip' + (i === 0 ? ' flag' : '');
      wrap.appendChild(el);
      pipEls[cfg[0]].push(el);
    }
  });
})();

function updateHUD(){
  fleets.forEach(function(F){
    const els = pipEls[F.key];
    F.ships.forEach(function(s, i){
      if (els[i]) els[i].classList.toggle('lost', s.dead);
    });
  });
}
updateHUD();

let ended = false;
function checkEnd(){
  if (ended) return;
  const a = fleetA.alive, b = fleetB.alive;
  if (a > 0 && b > 0) return;
  ended = true;
  schedule(1.7, function(){
    const overlay = document.getElementById('end');
    const title = document.getElementById('endtitle');
    const sub = document.getElementById('endsub');
    if (!overlay || !title || !sub) return;
    if (fleetA.alive === 0 && fleetB.alive === 0){
      title.textContent = 'Mutual annihilation';
      title.style.color = 'var(--amber)';
      sub.textContent = 'No contacts remain on either side.';
    } else {
      const w = fleetA.alive > 0 ? fleetA : fleetB;
      title.textContent = w.name + ' fleet victorious';
      title.style.color = w.css;
      sub.textContent = w.alive + ' of 10 ships survived the engagement.';
    }
    overlay.classList.add('show');
  });
}

// ---------------------------------------------------------------- main loop
let elapsed = 0;
function update(dt){
  elapsed += dt;
  for (let i = scheduled.length - 1; i >= 0; i--){
    scheduled[i].t -= dt;
    if (scheduled[i].t <= 0){
      const fn = scheduled[i].fn;
      scheduled.splice(i, 1);
      fn();
    }
  }
  for (const F of fleets){
    for (const q of F.squads){
      q.retargetT -= dt;
      if (!q.target || q.target.dead || q.target.doomed || q.retargetT <= 0){
        q.target = pickSquadTarget(F, q);
        q.retargetT = rand(6, 11);
      }
    }
  }
  for (const s of ships){
    if (!s.dead) updateShip(s, dt, elapsed);
  }
  updateProjectiles(dt);
  for (let i = fx.length - 1; i >= 0; i--){
    if (!fx[i].update(dt)) fx.splice(i, 1);
  }
}

engine.runRenderLoop(function(){
  const dt = Math.min(engine.getDeltaTime() / 1000, 0.05) || 0.016;
  update(dt);
  scene.render();
});
window.addEventListener('resize', function(){ engine.resize(); });

// small debug handle (also used by automated tests): __battle.update(dt) steps the sim
window.__battle = { update: update, ships: ships, projectiles: projectiles, fleets: fleets, fx: fx, stats: stats, scene: scene, engine: engine };

})();
</script>
