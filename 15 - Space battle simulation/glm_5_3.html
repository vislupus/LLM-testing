<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stellar Sieges — Babylon.js Space Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05060a;
    color: #e6f0ff;
    font-family: 'Rajdhani', sans-serif;
  }
  #renderCanvas {
    width: 100vw; height: 100vh;
    display: block; outline: none;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 10;
  }
  .overlay::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
  }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 22px 30px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand-mark {
    width: 44px; height: 44px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 35%, rgba(77,217,255,0.95) 0%, rgba(26,93,153,0.7) 45%, transparent 65%),
      radial-gradient(circle at 65% 65%, rgba(255,85,68,0.85) 0%, transparent 55%);
    border: 1px solid rgba(180,220,255,0.25);
    box-shadow:
      0 0 18px rgba(77,217,255,0.35),
      0 0 18px rgba(255,85,68,0.3),
      inset 0 0 10px rgba(0,0,0,0.6);
    position: relative;
  }
  .brand-mark::before, .brand-mark::after {
    content: ''; position: absolute;
    background: rgba(180,220,255,0.5);
  }
  .brand-mark::before { top: 50%; left: -5px; right: -5px; height: 1px; }
  .brand-mark::after { left: 50%; top: -5px; bottom: -5px; width: 1px; }
  .brand-text { line-height: 1; }
  .brand-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900; font-size: 22px;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #4dd9ff 0%, #ffffff 50%, #ff7766 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-sub {
    font-size: 11px; letter-spacing: 4px;
    color: #7187a8; margin-top: 5px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .stats { display: flex; gap: 12px; }
  .stat-card {
    background: rgba(8, 14, 28, 0.65);
    border: 1px solid rgba(100, 140, 200, 0.2);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 9px 18px;
    border-radius: 2px;
    min-width: 130px;
    position: relative;
  }
  .stat-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; width: 3px; height: 100%;
  }
  .stat-blue::before { background: #4dd9ff; box-shadow: 0 0 8px #4dd9ff; }
  .stat-red::before { background: #ff5544; box-shadow: 0 0 8px #ff5544; }
  .stat-time::before { background: #ffce4d; box-shadow: 0 0 8px #ffce4d; }
  .stat-label {
    font-size: 10px; letter-spacing: 2.5px;
    color: #8aa3c4; text-transform: uppercase;
    font-weight: 500;
  }
  .stat-value {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700; font-size: 22px;
    line-height: 1.1; margin-top: 3px;
  }
  .stat-blue .stat-value { color: #4dd9ff; text-shadow: 0 0 14px rgba(77,217,255,0.7); }
  .stat-red .stat-value { color: #ff5544; text-shadow: 0 0 14px rgba(255,85,68,0.7); }
  .stat-time .stat-value { color: #ffce4d; text-shadow: 0 0 14px rgba(255,206,77,0.5); }
  .bottombar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 22px 30px;
  }
  .controls {
    background: rgba(8, 14, 28, 0.65);
    border: 1px solid rgba(100, 140, 200, 0.2);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 12px 20px;
    border-radius: 2px;
    font-size: 13px;
    color: #b0c4dc;
    line-height: 1.6;
  }
  .controls-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; letter-spacing: 2.5px;
    color: #fff; margin-bottom: 5px;
    font-weight: 700;
  }
  .controls kbd {
    background: rgba(100,140,200,0.15);
    border: 1px solid rgba(100,140,200,0.4);
    padding: 1px 7px;
    border-radius: 2px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px; color: #fff;
    font-weight: 500; margin: 0 1px;
  }
  .restart-btn {
    pointer-events: auto;
    background: linear-gradient(135deg, rgba(26,74,122,0.85), rgba(15,40,68,0.85));
    border: 1px solid rgba(77,217,255,0.5);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; letter-spacing: 3px;
    padding: 13px 26px;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 700;
    transition: all 0.25s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .restart-btn:hover {
    background: linear-gradient(135deg, rgba(77,217,255,0.9), rgba(26,93,153,0.9));
    box-shadow: 0 0 22px rgba(77,217,255,0.5);
    transform: translateY(-1px);
  }
  .corner {
    position: absolute; width: 22px; height: 22px;
    border-color: rgba(77,217,255,0.45);
    border-style: solid; border-width: 0;
  }
  .corner-tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; }
  .corner-tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; }
  .corner-bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; }
  .corner-br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; }
  .banner {
    position: absolute; top: 45%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s;
  }
  .banner.show { opacity: 1; }
  .banner-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900; font-size: 54px;
    letter-spacing: 8px;
    text-shadow: 0 0 30px currentColor;
  }
  .banner-sub {
    font-size: 14px;
    letter-spacing: 5px;
    color: #8aa3c4;
    margin-top: 10px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .scanline {
    position: absolute; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(77,217,255,0.35) 50%, transparent);
    pointer-events: none;
    animation: scanline 7s linear infinite;
  }
  @keyframes scanline {
    0% { top: 0; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div class="overlay">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="scanline"></div>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <div class="brand-title">STELLAR SIEGES</div>
        <div class="brand-sub">Cobalt Offensive · Sector 7</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card stat-blue">
        <div class="stat-label">Cobalt Fleet</div>
        <div class="stat-value" id="blueCount">10</div>
      </div>
      <div class="stat-card stat-red">
        <div class="stat-label">Crimson Fleet</div>
        <div class="stat-value" id="redCount">10</div>
      </div>
      <div class="stat-card stat-time">
        <div class="stat-label">Battle Time</div>
        <div class="stat-value" id="battleTime">0:00</div>
      </div>
    </div>
  </div>
  <div class="banner" id="banner">
    <div class="banner-text" id="bannerText"></div>
    <div class="banner-sub" id="bannerSub"></div>
  </div>
  <div class="bottombar">
    <div class="controls">
      <div class="controls-title">Tactical Camera</div>
      <kbd>Drag</kbd> Rotate &nbsp;·&nbsp; <kbd>Wheel</kbd> Zoom &nbsp;·&nbsp; <kbd>Ctrl+Drag</kbd> Pan
    </div>
    <button class="restart-btn" id="restartBtn">New Engagement</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===================================================================
  // ENGINE, SCENE, CAMERA
  // ===================================================================
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, {
    preserveDrawingBuffer: false,
    stencil: true,
    disableWebGL2Support: false
  });

  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.015, 0.02, 0.04, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogColor = new BABYLON.Color3(0.025, 0.03, 0.06);
  scene.fogDensity = 0.0015;

  const camera = new BABYLON.ArcRotateCamera(
    'camera',
    -Math.PI / 2.2,
    Math.PI / 2.4,
    260,
    BABYLON.Vector3.Zero(),
    scene
  );
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 60;
  camera.upperRadiusLimit = 700;
  camera.wheelPrecision = 2;
  camera.panningSensibility = 80;
  camera.useNaturalPinchZoom = true;
  camera.minZ = 0.1;
  camera.maxZ = 5000;

  // ===================================================================
  // LIGHTING
  // ===================================================================
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.3, 1, 0.2), scene);
  hemi.intensity = 0.45;
  hemi.diffuse = new BABYLON.Color3(0.75, 0.85, 1.0);
  hemi.groundColor = new BABYLON.Color3(0.28, 0.22, 0.32);

  const keyLight = new BABYLON.DirectionalLight('key', new BABYLON.Vector3(-0.4, -0.5, -0.5), scene);
  keyLight.intensity = 0.7;
  keyLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

  const rimLight = new BABYLON.DirectionalLight('rim', new BABYLON.Vector3(0.6, 0.2, 0.5), scene);
  rimLight.intensity = 0.28;
  rimLight.diffuse = new BABYLON.Color3(0.55, 0.7, 1.0);

  // Glow layer - makes emissive materials bloom
  const glow = new BABYLON.GlowLayer('glow', scene, {
    mainTextureFixedSize: 512,
    blurKernelSize: 64
  });
  glow.intensity = 1.1;

  // Post-processing: FXAA + ACES tone mapping
  const pipeline = new BABYLON.DefaultRenderingPipeline('pipeline', true, scene, [camera]);
  pipeline.fxaaEnabled = true;
  pipeline.bloomEnabled = false;
  pipeline.imageProcessingEnabled = true;
  pipeline.imageProcessing.toneMappingEnabled = true;
  pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
  pipeline.imageProcessing.exposure = 1.15;
  pipeline.imageProcessing.contrast = 1.15;

  // GUI for health bars (loaded via separate babylon.gui.js script)
  const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI('ui');

  // ===================================================================
  // PROCEDURAL TEXTURES (radial gradients for particles)
  // ===================================================================
  function makeRadialTexture(r, g, b) {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 60);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(0.4, `rgba(${r},${g},${b},0.5)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);
    const tex = new BABYLON.DynamicTexture('rt', c, scene, false);
    tex.update();
    return tex;
  }

  const starTex  = makeRadialTexture(255, 255, 255);
  const fireTex  = makeRadialTexture(255, 200, 80);
  const sparkTex = makeRadialTexture(255, 240, 200);
  const smokeTex = makeRadialTexture(120, 100, 90);

  // ===================================================================
  // STARFIELD - thousands of static stars in a giant sphere
  // ===================================================================
  const stars = new BABYLON.ParticleSystem('stars', 5000, scene);
  stars.particleTexture = starTex;
  stars.emitter = BABYLON.Vector3.Zero();
  stars.minEmitBox = new BABYLON.Vector3(-700, -700, -700);
  stars.maxEmitBox = new BABYLON.Vector3(700, 700, 700);
  stars.color1 = new BABYLON.Color4(1, 1, 1, 1);
  stars.color2 = new BABYLON.Color4(0.75, 0.85, 1, 1);
  stars.colorDead = new BABYLON.Color4(1, 1, 1, 0);
  stars.minSize = 0.3;
  stars.maxSize = 2.2;
  stars.minLifeTime = 9999;
  stars.maxLifeTime = 9999;
  stars.emitRate = 0;
  stars.manualEmitCount = 5000;
  stars.minEmitPower = 0;
  stars.maxEmitPower = 0;
  stars.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  stars.start();

  // ===================================================================
  // NEBULA CLOUDS - large soft colored particle clouds
  // ===================================================================
  function createNebula(center, r, g, b, count, size) {
    const ps = new BABYLON.ParticleSystem('neb', count, scene);
    ps.particleTexture = makeRadialTexture(r, g, b);
    ps.emitter = center;
    ps.minEmitBox = new BABYLON.Vector3(-200, -130, -200);
    ps.maxEmitBox = new BABYLON.Vector3(200, 130, 200);
    ps.color1 = new BABYLON.Color4(r/255, g/255, b/255, 0.22);
    ps.color2 = new BABYLON.Color4(r/255, g/255, b/255, 0.10);
    ps.colorDead = new BABYLON.Color4(r/255, g/255, b/255, 0);
    ps.minSize = size * 0.5;
    ps.maxSize = size * 1.5;
    ps.minLifeTime = 9999;
    ps.maxLifeTime = 9999;
    ps.emitRate = 0;
    ps.manualEmitCount = count;
    ps.minEmitPower = 0;
    ps.maxEmitPower = 0;
    ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    ps.start();
    return ps;
  }

  createNebula(new BABYLON.Vector3(-380, 60, -280), 60, 110, 240, 80, 240);
  createNebula(new BABYLON.Vector3(440, -50, -200), 240, 90, 70, 80, 240);
  createNebula(new BABYLON.Vector3(-100, 200, -480), 180, 80, 200, 50, 280);
  createNebula(new BABYLON.Vector3(150, -180, 420), 90, 200, 200, 40, 200);
  createNebula(new BABYLON.Vector3(0, -100, 0), 50, 70, 130, 60, 300);

  // ===================================================================
  // GLOBAL STATE
  // ===================================================================
  const ships = [];
  const projectiles = [];
  const effects = [];
  let battleTime = 0;
  let battleOver = false;

  // Shared materials cache (per team)
  const matCache = {};
  function getMaterial(name, buildFn) {
    if (!matCache[name]) matCache[name] = buildFn();
    return matCache[name];
  }

  // ===================================================================
  // SHIP MESH BUILDER - flagship and escort variants
  // ===================================================================
  function buildShipMesh(team, isFlagship) {
    const root = new BABYLON.TransformNode('ship', scene);
    const teamBlue = team === 'blue';

    const hullColor    = teamBlue ? new BABYLON.Color3(0.18, 0.30, 0.55) : new BABYLON.Color3(0.58, 0.20, 0.18);
    const accentColor = teamBlue ? new BABYLON.Color3(0.35, 0.75, 1.0)  : new BABYLON.Color3(1.0, 0.45, 0.35);
    const engineColor = teamBlue ? new BABYLON.Color3(0.45, 0.85, 1.0)  : new BABYLON.Color3(1.0, 0.55, 0.30);

    const hullMat = getMaterial('hull_' + team, () => {
      const m = new BABYLON.StandardMaterial('hull', scene);
      m.diffuseColor = hullColor;
      m.specularColor = new BABYLON.Color3(0.75, 0.75, 0.85);
      m.specularPower = 96;
      m.emissiveColor = hullColor.scale(0.15);
      return m;
    });

    const accentMat = getMaterial('accent_' + team, () => {
      const m = new BABYLON.StandardMaterial('accent', scene);
      m.diffuseColor = accentColor.scale(0.35);
      m.emissiveColor = accentColor.scale(0.85);
      m.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
      return m;
    });

    const engineMat = getMaterial('engine_' + team, () => {
      const m = new BABYLON.StandardMaterial('engine', scene);
      m.emissiveColor = engineColor;
      m.diffuseColor = BABYLON.Color3.Black();
      m.disableLighting = true;
      return m;
    });

    const darkMat = getMaterial('dark', () => {
      const m = new BABYLON.StandardMaterial('dark', scene);
      m.diffuseColor = new BABYLON.Color3(0.08, 0.09, 0.11);
      m.specularColor = new BABYLON.Color3(0.4, 0.4, 0.5);
      m.emissiveColor = new BABYLON.Color3(0.02, 0.02, 0.03);
      return m;
    });

    if (isFlagship) {
      // ===== FLAGSHIP - large and detailed =====
      const hull = BABYLON.MeshBuilder.CreateCylinder('fhull', {
        height: 16, diameterTop: 2.5, diameterBottom: 5.5, tessellation: 6
      }, scene);
      hull.rotation.x = Math.PI / 2;
      hull.parent = root;
      hull.material = hullMat;

      const fin = BABYLON.MeshBuilder.CreateBox('fin', {
        width: 1.2, height: 5, depth: 10
      }, scene);
      fin.position.y = -3;
      fin.parent = root;
      fin.material = hullMat;

      const bridge = BABYLON.MeshBuilder.CreateSphere('bridge', {
        diameter: 4, segments: 12
      }, scene);
      bridge.position.y = 1.8;
      bridge.position.z = 1.5;
      bridge.parent = root;
      bridge.material = accentMat;
      bridge.scaling.y = 0.55;

      const spire = BABYLON.MeshBuilder.CreateCylinder('spire', {
        height: 3, diameterTop: 0.2, diameterBottom: 0.7, tessellation: 6
      }, scene);
      spire.position.y = 3.6;
      spire.position.z = 1.5;
      spire.parent = root;
      spire.material = accentMat;

      const wingL = BABYLON.MeshBuilder.CreateBox('wingL', {
        width: 7, height: 0.6, depth: 9
      }, scene);
      wingL.position.x = -5.5;
      wingL.position.y = -0.3;
      wingL.rotation.y = -0.15;
      wingL.parent = root;
      wingL.material = hullMat;

      const wingR = wingL.clone('wingR');
      wingR.position.x = 5.5;
      wingR.rotation.y = 0.15;
      wingR.parent = root;

      const stripL = BABYLON.MeshBuilder.CreateBox('stripL', {
        width: 0.2, height: 0.18, depth: 6.5
      }, scene);
      stripL.position.x = -9.0;
      stripL.position.y = -0.3;
      stripL.parent = root;
      stripL.material = accentMat;

      const stripR = stripL.clone('stripR');
      stripR.position.x = 9.0;
      stripR.parent = root;

      const cannon = BABYLON.MeshBuilder.CreateCylinder('cannon', {
        height: 5.5, diameterTop: 0.3, diameterBottom: 0.8, tessellation: 8
      }, scene);
      cannon.rotation.x = Math.PI / 2;
      cannon.position.z = 9.5;
      cannon.parent = root;
      cannon.material = darkMat;

      for (const side of [-1, 1]) {
        const sc = BABYLON.MeshBuilder.CreateCylinder('scannon', {
          height: 3.5, diameterTop: 0.2, diameterBottom: 0.5, tessellation: 6
        }, scene);
        sc.rotation.x = Math.PI / 2;
        sc.position.x = side * 3;
        sc.position.z = 7;
        sc.parent = root;
        sc.material = darkMat;
      }

      const enginePositions = [
        new BABYLON.Vector3(-2.5, 0, -7),
        new BABYLON.Vector3( 2.5, 0, -7),
        new BABYLON.Vector3(-2.5, -2, -7),
        new BABYLON.Vector3( 2.5, -2, -7)
      ];
      for (const ep of enginePositions) {
        const housing = BABYLON.MeshBuilder.CreateCylinder('eh', {
          height: 2.5, diameter: 1.5, tessellation: 8
        }, scene);
        housing.rotation.x = Math.PI / 2;
        housing.position = ep.clone();
        housing.parent = root;
        housing.material = hullMat;

        const eglow = BABYLON.MeshBuilder.CreateSphere('eg', {
          diameter: 1.4, segments: 10
        }, scene);
        eglow.position = ep.add(new BABYLON.Vector3(0, 0, -0.6));
        eglow.parent = root;
        eglow.material = engineMat;
        eglow.scaling.z = 0.5;
      }

      const centerHousing = BABYLON.MeshBuilder.CreateCylinder('ceh', {
        height: 3, diameter: 2.8, tessellation: 8
      }, scene);
      centerHousing.rotation.x = Math.PI / 2;
      centerHousing.position.z = -7;
      centerHousing.parent = root;
      centerHousing.material = hullMat;

      const centerGlow = BABYLON.MeshBuilder.CreateSphere('ceg', {
        diameter: 2.4, segments: 12
      }, scene);
      centerGlow.position.z = -8.4;
      centerGlow.parent = root;
      centerGlow.material = engineMat;
      centerGlow.scaling.z = 0.4;

      for (let i = 0; i < 3; i++) {
        const panel = BABYLON.MeshBuilder.CreateBox('panel', {
          width: 0.15, height: 0.4, depth: 1.5
        }, scene);
        panel.position.x = (i - 1) * 1.5;
        panel.position.y = 0.6;
        panel.position.z = -1 + i * 1.5;
        panel.parent = root;
        panel.material = accentMat;
      }

      root.metadata = { width: 12 };
    } else {
      // ===== ESCORT - smaller, sleeker dart =====
      const body = BABYLON.MeshBuilder.CreateCylinder('body', {
        height: 7, diameterTop: 0.4, diameterBottom: 2.2, tessellation: 6
      }, scene);
      body.rotation.x = Math.PI / 2;
      body.parent = root;
      body.material = hullMat;

      const cockpit = BABYLON.MeshBuilder.CreateSphere('cockpit', {
        diameter: 1.5, segments: 8
      }, scene);
      cockpit.position.z = 1.5;
      cockpit.position.y = 0.4;
      cockpit.parent = root;
      cockpit.material = accentMat;
      cockpit.scaling.set(0.7, 0.5, 1.1);

      const wingL = BABYLON.MeshBuilder.CreateBox('wingL', {
        width: 4, height: 0.25, depth: 2.5
      }, scene);
      wingL.position.x = -2.5;
      wingL.position.z = -1;
      wingL.rotation.y = -0.4;
      wingL.parent = root;
      wingL.material = hullMat;

      const wingR = wingL.clone('wingR');
      wingR.position.x = 2.5;
      wingR.rotation.y = 0.4;
      wingR.parent = root;

      const stripL = BABYLON.MeshBuilder.CreateBox('stripL', {
        width: 0.18, height: 0.12, depth: 1.8
      }, scene);
      stripL.position.x = -4.3;
      stripL.position.z = -1.5;
      stripL.rotation.y = -0.4;
      stripL.parent = root;
      stripL.material = accentMat;

      const stripR = stripL.clone('stripR');
      stripR.position.x = 4.3;
      stripR.rotation.y = 0.4;
      stripR.parent = root;

      const gun = BABYLON.MeshBuilder.CreateCylinder('gun', {
        height: 2.8, diameterTop: 0.18, diameterBottom: 0.4, tessellation: 6
      }, scene);
      gun.rotation.x = Math.PI / 2;
      gun.position.z = 4;
      gun.parent = root;
      gun.material = darkMat;

      const engineHousing = BABYLON.MeshBuilder.CreateCylinder('eh', {
        height: 1.5, diameter: 1.3, tessellation: 8
      }, scene);
      engineHousing.rotation.x = Math.PI / 2;
      engineHousing.position.z = -3.5;
      engineHousing.parent = root;
      engineHousing.material = hullMat;

      const engineGlow = BABYLON.MeshBuilder.CreateSphere('eg', {
        diameter: 1.2, segments: 10
      }, scene);
      engineGlow.position.z = -4.3;
      engineGlow.parent = root;
      engineGlow.material = engineMat;
      engineGlow.scaling.z = 0.4;

      root.metadata = { width: 6 };
    }

    return root;
  }

  // ===================================================================
  // SHIP CLASS - AI, combat, health
  // ===================================================================
  class Ship {
    constructor(team, isFlagship, position) {
      this.team = team;
      this.isFlagship = isFlagship;
      this.maxHealth = isFlagship ? 320 : 100;
      this.health = this.maxHealth;
      this.alive = true;
      this.fireTimer = 1 + Math.random() * 2;
      this.target = null;
      this.velocity = new BABYLON.Vector3(
        (Math.random() - 0.5) * 5,
        0,
        (Math.random() - 0.5) * 5
      );
      this.offset = this.generateOffset();
      this.root = buildShipMesh(team, isFlagship);
      this.root.position = position.clone();
      this.width = isFlagship ? 12 : 6;
      this.createHealthBar();
    }

    generateOffset() {
      const r = 25 + Math.random() * 35;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      return new BABYLON.Vector3(
        r * Math.cos(theta) * Math.sin(phi),
        r * Math.sin(theta) * Math.sin(phi) * 0.45,
        r * Math.cos(phi)
      );
    }

    createHealthBar() {
      const rect = new BABYLON.GUI.Rectangle('hb');
      rect.width = (this.isFlagship ? 120 : 75) + 'px';
      rect.height = (this.isFlagship ? 8 : 5) + 'px';
      rect.cornerRadius = 1;
      rect.color = 'rgba(0,0,0,0.7)';
      rect.thickness = 1.5;
      rect.background = 'rgba(8,10,18,0.75)';

      const fill = new BABYLON.GUI.Rectangle('hbf');
      fill.width = '100%';
      fill.height = '100%';
      fill.thickness = 0;
      fill.background = this.team === 'blue' ? '#22d4ff' : '#ff5533';
      fill.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
      rect.addControl(fill);

      rect.linkWithMesh(this.root);
      rect.linkOffsetY = (this.isFlagship ? -80 : -50) + 'px';
      gui.addControl(rect);

      this.healthBarRect = rect;
      this.healthBarFill = fill;
    }

    acquireTarget(allShips) {
      let best = null;
      let bestDist = Infinity;
      for (const other of allShips) {
        if (other.team === this.team || !other.alive) continue;
        const d = BABYLON.Vector3.Distance(this.root.position, other.root.position);
        if (d < bestDist) { bestDist = d; best = other; }
      }
      this.target = best;
    }

    update(dt, allShips) {
      if (!this.alive) return;

      if (!this.target || !this.target.alive) this.acquireTarget(allShips);

      if (this.target) {
        const targetPos = this.target.root.position;
        const desiredPos = targetPos.add(this.offset);
        const toDesired = desiredPos.subtract(this.root.position);
        const dist = toDesired.length();

        const maxSpeed = this.isFlagship ? 14 : 24;
        const maxForce = this.isFlagship ? 10 : 22;

        let desiredVel = toDesired.normalize().scale(maxSpeed);

        const enemyDist = BABYLON.Vector3.Distance(this.root.position, targetPos);
        if (enemyDist < 30) {
          const away = this.root.position.subtract(targetPos).normalize();
          desiredVel = desiredVel.add(away.scale(maxSpeed * 0.7));
        }

        if (dist < 12) desiredVel = desiredVel.scale(dist / 12);

        let steer = desiredVel.subtract(this.velocity);
        if (steer.length() > maxForce) steer.normalize().scaleInPlace(maxForce);
        this.velocity.addInPlace(steer.scale(dt));

        if (this.velocity.length() > maxSpeed) {
          this.velocity.normalize().scaleInPlace(maxSpeed);
        }

        this.root.position.addInPlace(this.velocity.scale(dt));

        const arenaR = 220;
        const distFromCenter = this.root.position.length();
        if (distFromCenter > arenaR) {
          const back = this.root.position.clone().normalize().scale(-1);
          this.velocity.addInPlace(back.scale(maxSpeed * 0.6));
        }

        if (this.velocity.lengthSquared() > 0.5) {
          const vel = this.velocity.clone().normalize();
          const lookPos = this.root.position.add(vel.scale(5));
          this.root.lookAt(lookPos);
        }
      }

      this.fireTimer -= dt;
      if (this.fireTimer <= 0 && this.target && this.target.alive) {
        const enemyDist = BABYLON.Vector3.Distance(this.root.position, this.target.root.position);
        if (enemyDist < 160) {
          this.fire();
          this.fireTimer = 3.0;
        } else {
          this.fireTimer = 0.5;
        }
      }

      this.updateHealthBar();
    }

    fire() {
      const dist = BABYLON.Vector3.Distance(this.root.position, this.target.root.position);
      const projSpeed = 130;
      const timeToHit = dist / projSpeed;
      const leadPos = this.target.root.position.add(this.target.velocity.scale(timeToHit));

      const fwd = this.root.getDirection(BABYLON.Axis.Z).normalize();
      const right = this.root.getDirection(BABYLON.Axis.X).normalize();

      const count = this.isFlagship ? 2 : 1;
      for (let i = 0; i < count; i++) {
        const sideOffset = count > 1 ? (i === 0 ? -3 : 3) : 0;
        const firePos = this.root.position
          .add(fwd.scale(this.isFlagship ? 10 : 5))
          .add(right.scale(sideOffset));
        createProjectile(firePos, leadPos, this.team, projSpeed);
      }
    }

    takeDamage(amount) {
      if (!this.alive) return;
      this.health -= amount;
      if (this.health <= 0) {
        this.health = 0;
        this.die();
      }
    }

    updateHealthBar() {
      const pct = this.health / this.maxHealth;
      this.healthBarFill.width = (pct * 100) + '%';
      let color;
      if (pct < 0.3) color = '#ff3030';
      else if (pct < 0.6) color = '#ffaa30';
      else color = this.team === 'blue' ? '#22d4ff' : '#ff5533';
      this.healthBarFill.background = color;
    }

    die() {
      if (!this.alive) return;
      this.alive = false;
      this.healthBarRect.isVisible = false;
      this.root.setEnabled(false);

      createExplosion(this.root.position.clone(), this.team, this.isFlagship);
      this.checkChainReaction();
    }

    checkChainReaction() {
      const chainRadius = this.isFlagship ? 14 : 8;
      for (const other of ships) {
        if (other === this || !other.alive) continue;
        const dist = BABYLON.Vector3.Distance(this.root.position, other.root.position);
        if (dist < chainRadius) {
          const delay = 100 + Math.random() * 220;
          setTimeout(() => {
            if (other.alive && ships.indexOf(other) >= 0) {
              other.takeDamage(other.health);
            }
          }, delay);
        }
      }
    }

    dispose() {
      this.alive = false;
      const children = this.root.getChildMeshes();
      for (const m of children) m.dispose();
      this.root.dispose();
      if (this.healthBarRect) this.healthBarRect.dispose();
    }
  }

  // ===================================================================
  // PROJECTILE FACTORY - glowing sphere + trail
  // ===================================================================
  function createProjectile(startPos, targetPos, team, speed) {
    const projRoot = new BABYLON.TransformNode('proj', scene);
    projRoot.position = startPos.clone();

    const dir = targetPos.subtract(startPos).normalize();
    const velocity = dir.scale(speed);

    const teamBlue = team === 'blue';
    const projColor = teamBlue
      ? new BABYLON.Color3(0.55, 0.95, 1.0)
      : new BABYLON.Color3(1.0, 0.5, 0.35);

    const coreMat = new BABYLON.StandardMaterial('pmat', scene);
    coreMat.emissiveColor = projColor;
    coreMat.diffuseColor = BABYLON.Color3.Black();
    coreMat.disableLighting = true;

    const core = BABYLON.MeshBuilder.CreateSphere('projCore', {
      diameter: 1.0, segments: 8
    }, scene);
    core.parent = projRoot;
    core.material = coreMat;

    const glowMat = new BABYLON.StandardMaterial('pglow', scene);
    glowMat.emissiveColor = projColor.scale(0.5);
    glowMat.diffuseColor = BABYLON.Color3.Black();
    glowMat.disableLighting = true;
    glowMat.alpha = 0.35;

    const glowSphere = BABYLON.MeshBuilder.CreateSphere('pglowSph', {
      diameter: 2.8, segments: 8
    }, scene);
    glowSphere.parent = projRoot;
    glowSphere.material = glowMat;

    const trailMat = new BABYLON.StandardMaterial('trailMat', scene);
    trailMat.emissiveColor = projColor;
    trailMat.diffuseColor = BABYLON.Color3.Black();
    trailMat.disableLighting = true;
    trailMat.alpha = 0.7;

    const trail = new BABYLON.TrailMesh('trail', core, scene, 0.65, 0.55, true);
    trail.material = trailMat;

    const projectile = {
      root: projRoot, core, glowSphere, trail,
      velocity, team, life: 5.0, damage: 25,

      update(dt) {
        this.root.position.addInPlace(this.velocity.scale(dt));
        this.life -= dt;

        for (const ship of ships) {
          if (!ship.alive || ship.team === this.team) continue;
          const dist = BABYLON.Vector3.Distance(this.root.position, ship.root.position);
          if (dist < (ship.isFlagship ? 5.5 : 3.5)) {
            ship.takeDamage(this.damage);
            spawnImpact(this.root.position.clone(), this.team);
            this.destroy();
            return;
          }
        }

        if (this.root.position.length() > 500) { this.destroy(); return; }
        if (this.life <= 0) this.destroy();
      },

      destroy() {
        const idx = projectiles.indexOf(this);
        if (idx >= 0) projectiles.splice(idx, 1);
        try {
          this.trail.dispose();
          this.core.dispose();
          this.glowSphere.dispose();
          this.root.dispose();
        } catch (e) { /* already disposed */ }
      }
    };

    projectiles.push(projectile);
    return projectile;
  }

  // ===================================================================
  // IMPACT EFFECT
  // ===================================================================
  function spawnImpact(position, team) {
    const teamBlue = team === 'blue';
    const color = teamBlue
      ? new BABYLON.Color4(0.4, 0.85, 1.0, 1)
      : new BABYLON.Color4(1.0, 0.4, 0.3, 1);

    const ps = new BABYLON.ParticleSystem('impact', 30, scene);
    ps.particleTexture = sparkTex;
    ps.emitter = position.clone();
    ps.minEmitBox = new BABYLON.Vector3(0,0,0);
    ps.maxEmitBox = new BABYLON.Vector3(0,0,0);
    ps.color1 = color;
    ps.color2 = new BABYLON.Color4(1, 1, 1, 1);
    ps.colorDead = new BABYLON.Color4(0.5, 0.5, 0.5, 0);
    ps.minSize = 0.3;
    ps.maxSize = 1.2;
    ps.minLifeTime = 0.2;
    ps.maxLifeTime = 0.55;
    ps.emitRate = 0;
    ps.manualEmitCount = 30;
    ps.minEmitPower = 5;
    ps.maxEmitPower = 14;
    ps.gravity = new BABYLON.Vector3(0, 0, 0);
    ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    ps.start();
    setTimeout(() => ps.dispose(), 1500);

    const flash = BABYLON.MeshBuilder.CreateSphere('iflash', {
      diameter: 1, segments: 8
    }, scene);
    flash.position = position.clone();
    const fMat = new BABYLON.StandardMaterial('ifm', scene);
    fMat.emissiveColor = teamBlue ? new BABYLON.Color3(0.5, 0.9, 1.0) : new BABYLON.Color3(1.0, 0.5, 0.35);
    fMat.disableLighting = true;
    flash.material = fMat;

    effects.push({
      age: 0,
      update(dt) {
        this.age += dt;
        const t = this.age / 0.25;
        if (t >= 1) { flash.dispose(); return false; }
        flash.scaling.setAll(1 + t * 5);
        fMat.alpha = 1 - t;
        return true;
      }
    });
  }

  // ===================================================================
  // EXPLOSION - fire, sparks, shockwave, debris, light
  // ===================================================================
  function createExplosion(position, team, isFlagship) {
    const teamBlue = team === 'blue';
    const teamColor4 = teamBlue
      ? new BABYLON.Color4(0.45, 0.85, 1.0, 1)
      : new BABYLON.Color4(1.0, 0.45, 0.3, 1);

    const scale = isFlagship ? 2.2 : 1.0;

    // Fire
    const fire = new BABYLON.ParticleSystem('fire', 250, scene);
    fire.particleTexture = fireTex;
    fire.emitter = position.clone();
    fire.minEmitBox = new BABYLON.Vector3(-1, -1, -1).scale(scale);
    fire.maxEmitBox = new BABYLON.Vector3(1, 1, 1).scale(scale);
    fire.color1 = new BABYLON.Color4(1, 0.85, 0.35, 1);
    fire.color2 = new BABYLON.Color4(1, 0.45, 0.15, 1);
    fire.colorDead = new BABYLON.Color4(0.3, 0.1, 0, 0);
    fire.minSize = 2 * scale;
    fire.maxSize = 7 * scale;
    fire.minLifeTime = 0.4;
    fire.maxLifeTime = 1.4;
    fire.emitRate = 0;
    fire.manualEmitCount = 250;
    fire.minEmitPower = 8 * scale;
    fire.maxEmitPower = 24 * scale;
    fire.gravity = new BABYLON.Vector3(0, 0, 0);
    fire.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    fire.start();
    setTimeout(() => { fire.stop(); setTimeout(() => fire.dispose(), 2500); }, 400);

    // Sparks
    const sparks = new BABYLON.ParticleSystem('sparks', 100, scene);
    sparks.particleTexture = sparkTex;
    sparks.emitter = position.clone();
    sparks.minEmitBox = new BABYLON.Vector3(0,0,0);
    sparks.maxEmitBox = new BABYLON.Vector3(0,0,0);
    sparks.color1 = teamColor4;
    sparks.color2 = new BABYLON.Color4(1, 1, 1, 1);
    sparks.colorDead = new BABYLON.Color4(0.5, 0.5, 0.5, 0);
    sparks.minSize = 0.2;
    sparks.maxSize = 0.9;
    sparks.minLifeTime = 0.7;
    sparks.maxLifeTime = 1.8;
    sparks.emitRate = 0;
    sparks.manualEmitCount = 100;
    sparks.minEmitPower = 18 * scale;
    sparks.maxEmitPower = 40 * scale;
    sparks.gravity = new BABYLON.Vector3(0, 0, 0);
    sparks.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    sparks.direction1 = new BABYLON.Vector3(-1, -1, -1);
    sparks.direction2 = new BABYLON.Vector3(1, 1, 1);
    sparks.start();
    setTimeout(() => { sparks.stop(); setTimeout(() => sparks.dispose(), 2500); }, 400);

    // Smoke
    const smoke = new BABYLON.ParticleSystem('smoke', 50, scene);
    smoke.particleTexture = smokeTex;
    smoke.emitter = position.clone();
    smoke.minEmitBox = new BABYLON.Vector3(-1,-1,-1).scale(scale);
    smoke.maxEmitBox = new BABYLON.Vector3(1,1,1).scale(scale);
    smoke.color1 = new BABYLON.Color4(0.35, 0.3, 0.3, 0.6);
    smoke.color2 = new BABYLON.Color4(0.5, 0.4, 0.3, 0.5);
    smoke.colorDead = new BABYLON.Color4(0.2, 0.2, 0.2, 0);
    smoke.minSize = 3 * scale;
    smoke.maxSize = 12 * scale;
    smoke.minLifeTime = 1.5;
    smoke.maxLifeTime = 3.5;
    smoke.emitRate = 0;
    smoke.manualEmitCount = 50;
    smoke.minEmitPower = 2 * scale;
    smoke.maxEmitPower = 7 * scale;
    smoke.gravity = new BABYLON.Vector3(0, 0, 0);
    smoke.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
    smoke.start();
    setTimeout(() => { smoke.stop(); setTimeout(() => smoke.dispose(), 5000); }, 400);

    // Shockwave ring 1
    const wave = BABYLON.MeshBuilder.CreateTorus('wave', {
      diameter: 1, thickness: 0.4, tessellation: 32
    }, scene);
    wave.position = position.clone();
    wave.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

    const waveMat = new BABYLON.StandardMaterial('waveMat', scene);
    waveMat.emissiveColor = new BABYLON.Color3(1, 0.85, 0.5);
    waveMat.disableLighting = true;
    waveMat.alpha = 0.9;
    waveMat.backFaceCulling = false;
    wave.material = waveMat;

    effects.push({
      age: 0,
      update(dt) {
        this.age += dt;
        const t = this.age / 0.9;
        if (t >= 1) { wave.dispose(); return false; }
        wave.scaling.setAll(1 + t * 35 * scale);
        waveMat.alpha = (1 - t) * 0.9;
        return true;
      }
    });

    // Shockwave ring 2 (team-colored)
    const wave2 = BABYLON.MeshBuilder.CreateTorus('wave2', {
      diameter: 1, thickness: 0.25, tessellation: 32
    }, scene);
    wave2.position = position.clone();
    wave2.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

    const wave2Mat = new BABYLON.StandardMaterial('wave2Mat', scene);
    wave2Mat.emissiveColor = teamBlue
      ? new BABYLON.Color3(0.45, 0.9, 1.0)
      : new BABYLON.Color3(1.0, 0.45, 0.3);
    wave2Mat.disableLighting = true;
    wave2Mat.alpha = 1.0;
    wave2Mat.backFaceCulling = false;
    wave2.material = wave2Mat;

    effects.push({
      age: 0,
      update(dt) {
        this.age += dt;
        const t = this.age / 1.2;
        if (t >= 1) { wave2.dispose(); return false; }
        wave2.scaling.setAll(1 + t * 48 * scale);
        wave2Mat.alpha = (1 - t) * 0.75;
        return true;
      }
    });

    // Bright flash sphere
    const flash = BABYLON.MeshBuilder.CreateSphere('flash', {
      diameter: 1, segments: 12
    }, scene);
    flash.position = position.clone();

    const flashMat = new BABYLON.StandardMaterial('flashMat', scene);
    flashMat.emissiveColor = new BABYLON.Color3(1, 0.95, 0.7);
    flashMat.disableLighting = true;
    flash.material = flashMat;

    effects.push({
      age: 0,
      update(dt) {
        this.age += dt;
        const t = this.age / 0.4;
        if (t >= 1) { flash.dispose(); return false; }
        flash.scaling.setAll(1 + t * 22 * scale);
        flashMat.alpha = 1 - t;
        return true;
      }
    });

    // Debris chunks
    const debrisCount = isFlagship ? 30 : 14;
    for (let i = 0; i < debrisCount; i++) {
      const size = 0.4 + Math.random() * 0.9;
      const debris = Math.random() < 0.5
        ? BABYLON.MeshBuilder.CreateBox('debris', { size }, scene)
        : BABYLON.MeshBuilder.CreatePolyhedron('debris', { size: size * 0.7, type: 1 }, scene);

      debris.position = position.clone();

      const dMat = new BABYLON.StandardMaterial('dMat', scene);
      dMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.32);
      dMat.emissiveColor = new BABYLON.Color3(0.6, 0.25, 0.1);
      dMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
      debris.material = dMat;

      let dir = new BABYLON.Vector3(
        Math.random() - 0.5,
        Math.random() - 0.5,
        Math.random() - 0.5
      );
      if (dir.lengthSquared() < 0.01) dir.x = 1;
      dir.normalize();
      const speed = 10 + Math.random() * 22;
      debris.scaling.setAll(0.7 + Math.random() * 0.5);

      effects.push({
        age: 0,
        life: 2.5 + Math.random() * 1.5,
        velocity: dir.scale(speed * scale),
        angVel: new BABYLON.Vector3(
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10
        ),
        update(dt) {
          this.age += dt;
          if (this.age >= this.life) { debris.dispose(); return false; }
          debris.position.addInPlace(this.velocity.scale(dt));
          this.velocity.scaleInPlace(0.96);
          debris.rotation.x += this.angVel.x * dt;
          debris.rotation.y += this.angVel.y * dt;
          debris.rotation.z += this.angVel.z * dt;
          const t = this.age / this.life;
          if (t > 0.65) {
            dMat.alpha = 1 - (t - 0.65) / 0.35;
            dMat.alphaMode = BABYLON.Material.MATERIAL_ALPHABLEND;
          }
          return true;
        }
      });
    }

    // Explosion point light
    const light = new BABYLON.PointLight('expLight', position.clone(), scene);
    light.diffuse = new BABYLON.Color3(1, 0.7, 0.4);
    light.specular = new BABYLON.Color3(1, 0.7, 0.4);
    light.intensity = 4 * scale;
    light.range = 100 * scale;

    effects.push({
      age: 0,
      update(dt) {
        this.age += dt;
        const t = this.age / 0.6;
        if (t >= 1) { light.dispose(); return false; }
        light.intensity = (1 - t) * 4 * scale;
        return true;
      }
    });
  }

  // ===================================================================
  // FLEET SETUP
  // ===================================================================
  function setupFleets() {
    for (const ship of ships) ship.dispose();
    ships.length = 0;
    for (const proj of projectiles) { try { proj.destroy(); } catch(e){} }
    projectiles.length = 0;
    for (const eff of effects) { eff.age = 999; }
    effects.length = 0;

    const blueCenter = new BABYLON.Vector3(-90, 0, 0);
    ships.push(new Ship('blue', true, blueCenter.clone()));
    for (let i = 0; i < 9; i++) {
      const phi = Math.acos(-1 + (2 * i + 1) / 9);
      const theta = Math.sqrt(9 * Math.PI) * phi;
      const r = 38;
      const pos = blueCenter.add(new BABYLON.Vector3(
        r * Math.cos(theta) * Math.sin(phi),
        r * Math.sin(theta) * Math.sin(phi) * 0.45,
        r * Math.cos(phi)
      ));
      ships.push(new Ship('blue', false, pos));
    }

    const redCenter = new BABYLON.Vector3(90, 0, 0);
    ships.push(new Ship('red', true, redCenter.clone()));
    for (let i = 0; i < 9; i++) {
      const phi = Math.acos(-1 + (2 * i + 1) / 9);
      const theta = Math.sqrt(9 * Math.PI) * phi + 0.6;
      const r = 38;
      const pos = redCenter.add(new BABYLON.Vector3(
        r * Math.cos(theta) * Math.sin(phi),
        r * Math.sin(theta) * Math.sin(phi) * 0.45,
        r * Math.cos(phi)
      ));
      ships.push(new Ship('red', false, pos));
    }

    battleTime = 0;
    battleOver = false;
    document.getElementById('banner').classList.remove('show');
  }

  // ===================================================================
  // UI UPDATE
  // ===================================================================
  function updateUI() {
    const blueAlive = ships.filter(s => s.team === 'blue' && s.alive).length;
    const redAlive  = ships.filter(s => s.team === 'red'  && s.alive).length;
    document.getElementById('blueCount').textContent = blueAlive;
    document.getElementById('redCount').textContent  = redAlive;
    const min = Math.floor(battleTime / 60);
    const sec = Math.floor(battleTime % 60);
    document.getElementById('battleTime').textContent = `${min}:${sec.toString().padStart(2,'0')}`;

    if (!battleOver && ships.length > 0 && (blueAlive === 0 || redAlive === 0)) {
      battleOver = true;
      const blueWon = blueAlive > 0;
      const winner = blueWon ? 'COBALT FLEET' : 'CRIMSON FLEET';
      const color  = blueWon ? '#4dd9ff'      : '#ff5544';
      const banner = document.getElementById('banner');
      const text   = document.getElementById('bannerText');
      const sub    = document.getElementById('bannerSub');
      text.textContent = winner + ' VICTORIOUS';
      text.style.color = color;
      sub.textContent  = 'Sector secured · Press New Engagement to restart';
      banner.classList.add('show');
    }
  }

  // ===================================================================
  // RENDER LOOP
  // ===================================================================
  let lastTime = performance.now();
  scene.onBeforeRenderObservable.add(() => {
    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(0.05, dt);

    if (!battleOver) battleTime += dt;

    for (const ship of ships) ship.update(dt, ships);

    const projsCopy = projectiles.slice();
    for (const proj of projsCopy) proj.update(dt);

    for (let i = effects.length - 1; i >= 0; i--) {
      if (!effects[i].update(dt)) effects.splice(i, 1);
    }

    updateUI();
  });

  engine.runRenderLoop(() => scene.render());
  window.addEventListener('resize', () => engine.resize());

  document.getElementById('restartBtn').addEventListener('click', setupFleets);

  setupFleets();
})();
</script>
