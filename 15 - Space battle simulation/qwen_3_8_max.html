<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID BATTLE — Babylon.js Fleet Combat</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>
  :root{
    --blue:#58b6ff; --red:#ff5a4d;
    --panel:rgba(6,11,22,.62); --line:rgba(120,170,255,.22);
    --disp:'Segoe UI','Avenir Next',system-ui,sans-serif;
    --mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#02040a;font-family:var(--disp);color:#cfe0f5}
  #c{width:100%;height:100%;display:block;outline:none}
  /* subtle cinematic overlay */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,2,8,.55) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px)}
  .hud{position:fixed;z-index:5;pointer-events:none}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    backdrop-filter:blur(4px);box-shadow:0 6px 24px rgba(0,0,0,.45)}
  /* title */
  #title{top:14px;left:50%;transform:translateX(-50%);text-align:center;padding:8px 26px}
  #title h1{font-size:15px;letter-spacing:.55em;font-weight:600;color:#eaf4ff;text-shadow:0 0 18px rgba(120,190,255,.55)}
  #title p{font-size:9px;letter-spacing:.3em;color:#7d92b5;margin-top:3px;text-transform:uppercase}
  /* fleet status */
  .fleet{top:14px;padding:10px 16px;min-width:210px}
  #fBlue{left:14px;border-left:3px solid var(--blue)}
  #fRed{right:14px;border-right:3px solid var(--red);text-align:right}
  .fleet .nm{font-size:10px;letter-spacing:.32em;font-weight:700}
  #fBlue .nm{color:var(--blue)} #fRed .nm{color:var(--red)}
  .fleet .ct{font:700 26px/1.1 var(--mono);color:#fff;margin:2px 0 6px}
  .fleet .ct small{font-size:12px;color:#6f84a6}
  .fbar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  .fbar i{display:block;height:100%;width:100%;transition:width .35s ease}
  #bBar i{background:linear-gradient(90deg,#2a6fd0,var(--blue))}
  #rBar i{background:linear-gradient(90deg,var(--red),#d02a2a)}
  /* hint + toast */
  #hint{bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.22em;
    color:#7d92b5;padding:6px 18px;text-transform:uppercase}
  #toast{bottom:60px;left:50%;transform:translateX(-50%) translateY(8px);padding:8px 22px;
    font-size:12px;letter-spacing:.28em;font-weight:700;color:#ffd76a;border-color:rgba(255,200,90,.4);
    opacity:0;transition:all .3s;text-transform:uppercase}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* victory banner */
  #banner{inset:0;display:none;place-items:center;background:rgba(2,4,10,.35)}
  #banner.show{display:grid}
  #banner .bx{text-align:center;animation:bnr .7s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes bnr{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  #banner h2{font-size:clamp(26px,5vw,54px);letter-spacing:.3em;font-weight:800}
  #banner p{font-size:11px;letter-spacing:.3em;color:#93a7c8;margin-top:12px;text-transform:uppercase}
  #banner.blue h2{color:var(--blue);text-shadow:0 0 34px rgba(88,182,255,.8)}
  #banner.red h2{color:var(--red);text-shadow:0 0 34px rgba(255,90,77,.8)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>

<div class="hud panel" id="title"><h1>VOID BATTLE</h1><p>fleet engagement · sector 7</p></div>
<div class="hud panel fleet" id="fBlue">
  <div class="nm">AZURE ARMADA</div><div class="ct"><span id="bCnt">10</span><small>/10</small></div>
  <div class="fbar" id="bBar"><i></i></div>
</div>
<div class="hud panel fleet" id="fRed">
  <div class="nm">CRIMSON ARMADA</div><div class="ct"><span id="rCnt">10</span><small>/10</small></div>
  <div class="fbar" id="rBar"><i></i></div>
</div>
<div class="hud panel" id="hint">drag — orbit &nbsp;·&nbsp; wheel — zoom</div>
<div class="hud panel" id="toast">⚠ chain reaction</div>
<div class="hud" id="banner"><div class="bx"><h2 id="bTxt"></h2><p>next engagement begins shortly…</p></div></div>

<script>
'use strict';
/* ╔════════════════════════════════════════════════════════════════════╗
   ║ VOID BATTLE — single-file Babylon.js space combat                    ║
   ║                                                                      ║
   ║ • 2 fleets × (1 flagship + 9 escorts), formation spawns              ║
   ║ • Steering AI: pursue nearest enemy with evasive offsets, keep       ║
   ║   firing range, ally separation, arena containment, smooth 3D turns  ║
   ║ • Fire control: 3 s volley. Escorts = 1 shell, flagships = 2         ║
   ║ • Projectiles: glowing team-colored bolts + TrailMesh wakes          ║
   ║ • Death: fireball, spark burst, expanding shockwave ring, debris,    ║
   ║   pooled explosion point-lights, camera shake                        ║
   ║ • Chain reaction: ships inside the blast width detonate too          ║
   ║ • Thrusters: bright emissive exhaust + glow bloom; flagships also    ║
   ║   carry real PointLights at their engines                            ║
   ╚════════════════════════════════════════════════════════════════════╝ */

const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true,{stencil:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.008,0.012,0.03,1);
scene.ambientColor=new BABYLON.Color3(0.05,0.06,0.09);

/* ─────────────────────────── camera & lights ──────────────────────── */
const cam=new BABYLON.ArcRotateCamera('cam',1.25,1.18,470,BABYLON.Vector3.Zero(),scene);
cam.attachControl(canvas,true);
cam.lowerRadiusLimit=90;cam.upperRadiusLimit=760;
cam.lowerBetaLimit=0.15;cam.upperBetaLimit=Math.PI-0.15;
cam.wheelPrecision=4;cam.pinchPrecision=30;cam.minZ=1;cam.maxZ=4000;

const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0.2,1,0.1),scene);
hemi.intensity=0.5;hemi.diffuse=new BABYLON.Color3(0.75,0.82,1);
hemi.groundColor=new BABYLON.Color3(0.15,0.1,0.2);
const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-0.45,-0.6,-0.4),scene);
key.intensity=0.95;key.diffuse=new BABYLON.Color3(1,0.96,0.9);

const glow=new BABYLON.GlowLayer('glow',scene);
glow.intensity=0.85;

/* ───────────────────────────── helpers ────────────────────────────── */
const rnd=(a,b)=>a+Math.random()*(b-a);
const V3=(x,y,z)=>new BABYLON.Vector3(x,y,z);
const tmpA=V3(0,0,0),tmpB=V3(0,0,0);
let simT=0;

/* orientation quaternion: ship geometry faces +Z */
function quatFromDir(dir){
  const fwd=dir.normalizeToNew();
  let up=V3(0,1,0); if(Math.abs(BABYLON.Vector3.Dot(fwd,up))>0.93)up=V3(0,0,1);
  const right=BABYLON.Vector3.Cross(up,fwd).normalizeToNew();
  const up2=BABYLON.Vector3.Cross(fwd,right);
  const m=BABYLON.Matrix.FromValues(
    right.x,right.y,right.z,0,  up2.x,up2.y,up2.z,0,  fwd.x,fwd.y,fwd.z,0,  0,0,0,1);
  return BABYLON.Quaternion.FromRotationMatrix(m);
}
function place(m,x,y,z,rx=0,ry=0,rz=0){
  m.position.set(x,y,z);m.rotation.set(rx,ry,rz);
  m.bakeTransformIntoVertices(m.computeWorldMatrix(true));return m;
}

/* ───────────────────────── background: stars + nebulae ───────────── */
function makeStars(count,size){
  const pcs=new BABYLON.PointsCloudSystem('stars',size,scene);
  pcs.addPoints(count,(p)=>{
    const d=V3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalizeToNew();
    p.position=d.scale(rnd(750,1600));
    const t=Math.random(),b=rnd(0.45,1);
    p.color=t<0.7?new BABYLON.Color4(0.9*b,0.94*b,1*b,1)
         :t<0.88?new BABYLON.Color4(0.65*b,0.8*b,1*b,1)
         :new BABYLON.Color4(1*b,0.85*b,0.68*b,1);
  });
  pcs.buildMeshAsync().then(()=>{
    pcs.setParticles();
    const mat=new BABYLON.StandardMaterial('sm',scene);
    mat.disableLighting=true;mat.emissiveColor=BABYLON.Color3.White();
    mat.diffuseColor=BABYLON.Color3.Black();mat.specularColor=BABYLON.Color3.Black();
    mat.pointSize=size;pcs.mesh.material=mat;pcs.mesh.isPickable=false;
  });
}
makeStars(1500,2.1);makeStars(130,4.6);

function nebulaTexture(r,g,b){
  const t=new BABYLON.DynamicTexture('n',{width:256,height:256},scene,false);t.hasAlpha=true;
  const c=t.getContext();c.clearRect(0,0,256,256);
  for(let i=0;i<8;i++){
    const x=rnd(50,206),y=rnd(50,206),rad=rnd(45,120),a=rnd(0.14,0.3);
    const gr=c.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0,`rgba(${r},${g},${b},${a})`);
    gr.addColorStop(0.55,`rgba(${r},${g},${b},${a*0.4})`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=gr;c.fillRect(0,0,256,256);
  }
  t.update();return t;
}
function nebula(rgb,dir,dist,size,alpha){
  const p=BABYLON.MeshBuilder.CreatePlane('neb',{size},scene);
  p.position=dir.normalizeToNew().scale(dist);
  p.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;p.isPickable=false;
  const tex=nebulaTexture(rgb[0],rgb[1],rgb[2]);
  const m=new BABYLON.StandardMaterial('nm',scene);
  m.emissiveTexture=tex;m.opacityTexture=tex;m.emissiveColor=BABYLON.Color3.White();
  m.diffuseColor=BABYLON.Color3.Black();m.specularColor=BABYLON.Color3.Black();
  m.disableLighting=true;m.alpha=alpha;m.alphaMode=BABYLON.Engine.ALPHA_ADD;
  p.material=m;
}
nebula([110,60,190],V3(-0.7,0.25,0.6),1250,980,0.85);
nebula([40,130,160],V3(0.75,0.1,-0.6),1180,880,0.8);
nebula([190,60,130],V3(0.2,-0.65,-0.75),1300,820,0.7);
nebula([60,90,210],V3(0.1,0.7,0.7),1350,900,0.75);

/* ─────────────────────────── team palette ─────────────────────────── */
const TEAMS={
  blue:{accent:new BABYLON.Color3(0.25,0.62,1.0),proj:new BABYLON.Color3(0.4,0.72,1.0),
        engine:new BABYLON.Color3(0.55,0.85,1.0),hull:new BABYLON.Color3(0.24,0.28,0.36)},
  red:{accent:new BABYLON.Color3(1.0,0.32,0.25),proj:new BABYLON.Color3(1.0,0.4,0.3),
       engine:new BABYLON.Color3(1.0,0.62,0.45),hull:new BABYLON.Color3(0.33,0.22,0.24)}};

/* shared materials */
const barBgMat=new BABYLON.StandardMaterial('bbm',scene);
barBgMat.diffuseColor=BABYLON.Color3.Black();barBgMat.emissiveColor=new BABYLON.Color3(0.05,0.07,0.12);
barBgMat.disableLighting=true;barBgMat.alpha=0.62;
const projMat={},trailMat={};
for(const k in TEAMS){
  projMat[k]=new BABYLON.StandardMaterial('pm',scene);
  projMat[k].diffuseColor=BABYLON.Color3.Black();projMat[k].emissiveColor=TEAMS[k].proj;
  projMat[k].specularColor=BABYLON.Color3.Black();
  trailMat[k]=new BABYLON.StandardMaterial('tm',scene);
  trailMat[k].diffuseColor=BABYLON.Color3.Black();
  trailMat[k].emissiveColor=TEAMS[k].proj.scale(0.85);
  trailMat[k].specularColor=BABYLON.Color3.Black();
  trailMat[k].alpha=0.75;trailMat[k].alphaMode=BABYLON.Engine.ALPHA_ADD;
}
const debrisMat=new BABYLON.StandardMaterial('dm',scene);
debrisMat.diffuseColor=new BABYLON.Color3(0.16,0.15,0.16);
debrisMat.emissiveColor=new BABYLON.Color3(0.12,0.05,0.02);
debrisMat.specularColor=new BABYLON.Color3(0.1,0.1,0.1);

/* soft particle texture */
const softTex=new BABYLON.DynamicTexture('pt',{width:64,height:64},scene,false);
{const c=softTex.getContext();const g=c.createRadialGradient(32,32,0,32,32,32);
 g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.35,'rgba(255,255,255,.7)');
 g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);softTex.update();
 softTex.hasAlpha=true;}

/* ─────────────────────────── ship construction ────────────────────── */
function buildShipMesh(team,flagship){
  const T=TEAMS[team],hull=[],gl=[];
  const B=o=>BABYLON.MeshBuilder.CreateBox('b',o,scene);
  const C=o=>BABYLON.MeshBuilder.CreateCylinder('c',o,scene);
  const S=o=>BABYLON.MeshBuilder.CreateSphere('s',o,scene);
  let gun;
  if(flagship){
    hull.push(place(B({width:3.4,height:1.9,depth:10}),0,0,0));
    hull.push(place(C({height:3.6,diameterTop:0.3,diameterBottom:2.5,tessellation:12}),0,0,6.6,Math.PI/2));
    hull.push(place(B({width:2.0,height:1.0,depth:4.6}),0,1.25,-1.2));
    hull.push(place(B({width:1.2,height:0.7,depth:1.7}),0,2.05,-2.3));
    hull.push(place(B({width:6.8,height:0.8,depth:3.4}),0,-0.3,-0.6));
    hull.push(place(B({width:4.6,height:0.5,depth:2.3}),0,0.6,2.4));
    hull.push(place(B({width:0.5,height:2.7,depth:2.5}),0,1.5,-4.5));
    hull.push(place(B({width:5.6,height:0.35,depth:1.6}),0,-1.05,1.2));
    gl.push(place(C({height:2.7,diameter:0.36,tessellation:8}),-0.95,0.15,5.7,Math.PI/2));
    gl.push(place(C({height:2.7,diameter:0.36,tessellation:8}), 0.95,0.15,5.7,Math.PI/2));
    for(const[ex,ey]of[[-1.1,-0.5],[1.1,-0.5],[-1.1,0.45],[1.1,0.45]]){
      hull.push(place(C({height:1.0,diameterTop:0.78,diameterBottom:0.98,tessellation:10}),ex,ey,-5.3,Math.PI/2));
      gl.push(place(C({height:0.32,diameter:0.64,tessellation:10}),ex,ey,-5.9,Math.PI/2));
    }
    gl.push(place(B({width:0.24,height:0.24,depth:7.6}),0,1.08,0.6));
    gl.push(place(B({width:0.2,height:0.2,depth:3.0}),-3.35,0.15,-0.6));
    gl.push(place(B({width:0.2,height:0.2,depth:3.0}), 3.35,0.15,-0.6));
    gl.push(place(S({diameter:1.15,segments:8}),0,2.0,-3.6));
    gun=[V3(-0.95,0.15,7.2),V3(0.95,0.15,7.2)];
  }else{
    hull.push(place(B({width:1.5,height:0.8,depth:4.2}),0,0,0));
    hull.push(place(C({height:1.8,diameterTop:0.08,diameterBottom:1.15,tessellation:10}),0,0,2.9,Math.PI/2));
    hull.push(place(B({width:2.7,height:0.12,depth:1.5}),-1.8,0,-0.8,0,0.5,0));
    hull.push(place(B({width:2.7,height:0.12,depth:1.5}), 1.8,0,-0.8,0,-0.5,0));
    hull.push(place(B({width:0.12,height:1.15,depth:1.05}),0,0.78,-1.55));
    hull.push(place(B({width:3.4,height:0.1,depth:0.7}),0,-0.28,-1.6));
    hull.push(place(C({height:0.55,diameterTop:0.42,diameterBottom:0.56,tessellation:8}),-0.45,-0.05,-2.25,Math.PI/2));
    hull.push(place(C({height:0.55,diameterTop:0.42,diameterBottom:0.56,tessellation:8}), 0.45,-0.05,-2.25,Math.PI/2));
    gl.push(place(C({height:0.24,diameter:0.42,tessellation:8}),-0.45,-0.05,-2.58,Math.PI/2));
    gl.push(place(C({height:0.24,diameter:0.42,tessellation:8}), 0.45,-0.05,-2.58,Math.PI/2));
    gl.push(place(S({diameter:0.56,segments:8}),0,0.33,0.95));
    gl.push(place(B({width:0.1,height:0.1,depth:2.6}),-0.78,0.22,0.2));
    gl.push(place(B({width:0.1,height:0.1,depth:2.6}), 0.78,0.22,0.2));
    gun=[V3(0,0,3.9)];
  }
  const hullMesh=BABYLON.Mesh.MergeMeshes(hull,true,true);
  const glowMesh=BABYLON.Mesh.MergeMeshes(gl,true,true);
  hullMesh.isPickable=false;glowMesh.isPickable=false;
  const hullMat=new BABYLON.StandardMaterial('h',scene);
  hullMat.diffuseColor=T.hull;hullMat.specularColor=new BABYLON.Color3(0.25,0.25,0.3);
  hullMat.specularPower=24;hullMat.emissiveColor=BABYLON.Color3.Black();
  const glowMat=new BABYLON.StandardMaterial('g',scene);
  glowMat.diffuseColor=BABYLON.Color3.Black();glowMat.specularColor=BABYLON.Color3.Black();
  glowMat.emissiveColor=T.engine;
  hullMesh.material=hullMat;glowMesh.material=glowMat;
  return{hull:hullMesh,glow:glowMesh,hullMat,glowMat,gun};
}

/* ────────────────────────────── fleets ────────────────────────────── */
const ships=[],projectiles=[];
const ARENA_R=250;
function createShip(team,flagship,pos,vel){
  const root=new BABYLON.TransformNode('ship',scene);
  root.position.copyFrom(pos);
  root.rotationQuaternion=quatFromDir(vel.clone());
  const built=buildShipMesh(team,flagship);
  built.hull.parent=root;built.glow.parent=root;
  /* health bar (billboarded, world-anchored) */
  const barRoot=new BABYLON.TransformNode('bar',scene);
  const w=flagship?13:6,h=flagship?0.9:0.55;
  const bg=BABYLON.MeshBuilder.CreatePlane('bg',{width:w,height:h},scene);
  bg.parent=barRoot;bg.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;bg.material=barBgMat;bg.isPickable=false;
  const fg=BABYLON.MeshBuilder.CreatePlane('fg',{width:w-0.3,height:h-0.22},scene);
  fg.parent=barRoot;fg.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;fg.position.z=0.06;fg.isPickable=false;
  const fgMat=new BABYLON.StandardMaterial('fgm',scene);
  fgMat.diffuseColor=BABYLON.Color3.Black();fgMat.disableLighting=true;
  fgMat.emissiveColor=new BABYLON.Color3(0.3,0.9,0.35);fg.material=fgMat;
  const ship={team,flagship,root,pos:root.position,vel:vel.clone(),
    alive:true,hp:flagship?240:60,maxHp:flagship?240:60,
    radius:flagship?7.5:3.2,size:flagship?8:3,chainR:flagship?18:7.5,
    maxSpeed:flagship?13:rnd(26,32),accel:flagship?7:22,turn:flagship?1.4:3.2,
    cooldown:rnd(0.6,3),target:null,retarget:0,
    evade:V3(0,0,0),evadeT:rnd(0.5,2),seed:Math.random()*20,
    flash:0,gun:built.gun,hullMat:built.hullMat,glowMat:built.glowMat,
    barRoot,fg,fgMat,barW:w-0.3,thrusterLight:null,
    mats:[built.hullMat,built.glowMat,fgMat]};
  /* flagships carry real thruster point lights */
  if(flagship){
    const l=new BABYLON.PointLight('th',V3(0,0,-7),scene);
    l.parent=root;l.diffuse=TEAMS[team].engine.scale(0.9);l.intensity=1.5;l.range=65;l.falloffType=BABYLON.Light.FALLOFF_PHYSICAL;
    ship.thrusterLight=l;
  }
  ships.push(ship);return ship;
}
function spawnFleets(){
  for(const side of[1,-1]){
    const team=side<0?'blue':'red',base=V3(side*-150,0,0),dir=V3(side,0,0);
    createShip(team,true,base.clone(),dir.scale(8));
    for(let i=0;i<9;i++){
      const a=i/9*Math.PI*2,r=rnd(26,36),y=(i%2?1:-1)*rnd(7,15);
      const p=base.add(V3(Math.cos(a)*r*0.6,y,Math.sin(a)*r));
      createShip(team,false,p,dir.scale(rnd(10,16)).add(V3(0,rnd(-2,2),rnd(-3,3))));
    }
  }
}
spawnFleets();

/* ────────────────────────── steering / combat AI ──────────────────── */
function nearestEnemy(ship){
  let best=null,bd=1e9;
  for(const o of ships){if(!o.alive||o.team===ship.team)continue;
    const d=BABYLON.Vector3.DistanceSquared(ship.pos,o.pos);
    if(d<bd){bd=d;best=o;}}
  return best;
}
function updateShip(s,dt){
  s.retarget-=dt;
  if(s.retarget<=0||!s.target||!s.target.alive){s.target=nearestEnemy(s);s.retarget=1.6;}
  s.evadeT-=dt;
  if(s.evadeT<=0){s.evadeT=rnd(2,4);
    const m=s.flagship?rnd(10,24):rnd(16,40);
    s.evade=V3(rnd(-1,1),rnd(-0.6,0.6),rnd(-1,1)).normalizeToNew().scale(m);}
  let goal=tmpA;
  if(s.target){
    const d=BABYLON.Vector3.Distance(s.pos,s.target.pos);
    const minR=s.flagship?62:34;
    if(d<minR){ // hold firing distance: swing outward
      goal.copyFrom(s.pos).subtractInPlace(s.target.pos).normalize()
        .scaleInPlace(minR).addInPlace(s.target.pos)
        .addInPlace(tmpB.copyFrom(s.evade).scaleInPlace(0.4));
    }else goal.copyFrom(s.target.pos).addInPlace(s.evade);
  }else goal.copyFrom(V3(0,0,0));
  /* steer toward goal */
  const dv=tmpB.copyFrom(goal).subtractInPlace(s.pos).normalize().scaleInPlace(s.maxSpeed);
  dv.subtractInPlace(s.vel);
  const mf=s.accel*dt;
  if(dv.length()>mf)dv.scaleInPlace(mf/dv.length());
  s.vel.addInPlace(dv);
  /* ally separation */
  const sepR=s.flagship?16:11;
  for(const o of ships){if(o===s||!o.alive||o.team!==s.team)continue;
    const dx=s.pos.x-o.pos.x,dy=s.pos.y-o.pos.y,dz=s.pos.z-o.pos.z;
    const L=Math.hypot(dx,dy,dz);
    if(L<sepR&&L>0.01){const f=(1-L/sepR)*30*dt/L;s.vel.x+=dx*f;s.vel.y+=dy*f;s.vel.z+=dz*f;}}
  /* arena containment */
  const r=s.pos.length();
  if(r>ARENA_R)s.vel.addInPlace(s.pos.scale(-((r-ARENA_R)/45)*dt*2));
  if(Math.abs(s.pos.y)>115)s.vel.y-=Math.sign(s.pos.y)*dt*22;
  if(s.vel.length()>s.maxSpeed)s.vel.scaleInPlace(s.maxSpeed/s.vel.length());
  s.pos.addInPlace(s.vel.scale(dt));
  /* smooth 3D orientation toward velocity */
  if(s.vel.lengthSquared()>1){
    const q=quatFromDir(s.vel);
    s.root.rotationQuaternion=BABYLON.Quaternion.Slerp(s.root.rotationQuaternion,q,Math.min(1,dt*s.turn));
  }
  /* engine flicker + damage flash */
  const T=TEAMS[s.team];
  const f=0.78+0.22*Math.sin(simT*24+s.seed)+0.08*Math.sin(simT*57+s.seed*3);
  s.glowMat.emissiveColor=T.engine.scale(f*1.05);
  if(s.flash>0){s.flash-=dt*3;s.hullMat.emissiveColor=T.accent.scale(Math.max(s.flash,0)*0.85);}
  /* fire control — one volley every 3 s */
  s.cooldown-=dt;
  if(s.cooldown<=0){
    s.cooldown+=3;
    if(s.target&&s.target.alive)fireVolley(s);
  }
  /* health bar */
  s.barRoot.position.copyFrom(s.pos);s.barRoot.position.y+=s.radius+2.6;
  const hf=Math.max(s.hp/s.maxHp,0.001);
  s.fg.scaling.x=hf;s.fg.position.x=-(1-hf)*s.barW*0.5;
  s.fgMat.emissiveColor=hf>0.5?BABYLON.Color3.Lerp(new BABYLON.Color3(0.95,0.85,0.2),new BABYLON.Color3(0.3,0.9,0.35),(hf-0.5)*2)
                              :BABYLON.Color3.Lerp(new BABYLON.Color3(0.95,0.25,0.2),new BABYLON.Color3(0.95,0.85,0.2),hf*2);
}
function fireVolley(s){
  const t=s.target;
  s.root.computeWorldMatrix(true);
  const wm=s.root.getWorldMatrix();
  for(const off of s.gun){ // flagships have two gun offsets → twin volley
    const gp=BABYLON.Vector3.TransformCoordinates(off,wm);
    const dist=BABYLON.Vector3.Distance(gp,t.pos);
    const aim=t.pos.add(t.vel.scale(dist/64))
      .add(V3(rnd(-2.4,2.4),rnd(-2.4,2.4),rnd(-2.4,2.4)));
    const dir=aim.subtract(gp).normalizeToNew();
    spawnProjectile(s.team,gp,dir);
    burst(gp,TEAMS[s.team].proj,{cap:26,rate:380,win:0.05,pw:[2,7],life:0.3,sz:[0.5,1.1]}); // muzzle flash
  }
}

/* ───────────────────────────── projectiles ────────────────────────── */
function spawnProjectile(team,pos,dir){
  const m=BABYLON.MeshBuilder.CreateSphere('p',{diameter:1.5,segments:6},scene);
  m.position.copyFrom(pos);m.material=projMat[team];m.isPickable=false;
  const trail=new BABYLON.TrailMesh('tr',m,scene,0.75,16,true);
  trail.material=trailMat[team];trail.isPickable=false;
  projectiles.push({team,mesh:m,trail,pos:m.position,vel:dir.scale(64),life:0});
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.life+=dt;p.pos.addInPlace(p.vel.scale(dt));
    let dead=p.life>4.5||p.pos.length()>640;
    if(!dead){
      for(const s of ships){
        if(!s.alive||s.team===p.team)continue;
        if(BABYLON.Vector3.DistanceSquared(p.pos,s.pos)<(s.radius+0.8)*(s.radius+0.8)){
          damage(s,12,p.pos);burst(p.pos,TEAMS[p.team].proj,{cap:46,rate:420,win:0.07,pw:[6,20],life:0.6,sz:[0.4,1]});
          dead=true;break;
        }
      }
    }
    if(dead){p.mesh.dispose();p.trail.dispose();projectiles.splice(i,1);}
  }
}
function damage(s,dmg,hitPos){
  if(!s.alive)return;
  s.hp-=dmg;s.flash=1;
  if(s.hp<=0)killShip(s,0);
}

/* ─────────────────── explosions, debris & chain reactions ─────────── */
const pending=[],fxMeshes=[],psList=[];
let shake=0,toastT=null;
const flashLights=[];
for(let i=0;i<4;i++){
  const l=new BABYLON.PointLight('ex',V3(0,0,0),scene);
  l.diffuse=new BABYLON.Color3(1,0.7,0.35);l.intensity=0;l.range=110;
  l.falloffType=BABYLON.Light.FALLOFF_PHYSICAL;l.setEnabled(false);
  flashLights.push(l);
}
function killShip(s,stagger){
  if(!s.alive)return;
  s.alive=false;
  s.root.setEnabled(false);s.barRoot.setEnabled(false);
  if(s.thrusterLight)s.thrusterLight.setEnabled(false);
  pending.push({at:simT+stagger,pos:s.pos.clone(),size:s.size,chainR:s.chainR});
  hudDirty=true;
}
function toast(){
  const el=document.getElementById('toast');
  el.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),1800);
}
function burst(pos,color,o){
  const ps=new BABYLON.ParticleSystem('b',o.cap,scene);
  ps.particleTexture=softTex;ps.emitter=pos.clone();
  ps.minEmitBox=V3(-0.4,-0.4,-0.4);ps.maxEmitBox=V3(0.4,0.4,0.4);
  ps.direction1=V3(-1,-1,-1);ps.direction2=V3(1,1,1);
  ps.minEmitPower=o.pw[0];ps.maxEmitPower=o.pw[1];
  ps.minLifeTime=o.life*0.4;ps.maxLifeTime=o.life;
  ps.minSize=o.sz[0];ps.maxSize=o.sz[1];
  ps.color1=new BABYLON.Color4(color.r,color.g,color.b,1);
  ps.color2=new BABYLON.Color4(Math.min(color.r*1.2,1),Math.min(color.g*1.2,1),Math.min(color.b*1.2,1),1);
  ps.colorDead=new BABYLON.Color4(color.r*0.3,color.g*0.2,0,0);
  ps.emitRate=o.rate;ps.targetStopDuration=o.win;
  ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps.gravity=V3(0,-1.5,0);ps.start();
  psList.push({ps,die:simT+o.life+0.4});
}
function doExplosion(e){
  const s=e.size;
  shake=Math.min(shake+(s>5?2.2:1.1),3);
  /* pooled flash light */
  const L=flashLights.reduce((a,b)=>a.intensity<b.intensity?a:b);
  L.position.copyFrom(e.pos);L.setEnabled(true);L.intensity=8*(s/4);L.range=40+s*10;
  /* fire burst + sparks */
  burst(e.pos,new BABYLON.Color3(1,0.55,0.18),{cap:170,rate:650,win:0.3,pw:[5*s*0.35+4,9*s*0.35+14],life:1.0,sz:[1.6*s*0.35,3.4*s*0.35]});
  burst(e.pos,new BABYLON.Color3(1,0.9,0.55),{cap:130,rate:950,win:0.16,pw:[26,30*s*0.35+42],life:0.75,sz:[0.4,1.2]});
  /* expanding fireball */
  const fb=BABYLON.MeshBuilder.CreateSphere('fb',{diameter:2.2,segments:10},scene);
  fb.position.copyFrom(e.pos);fb.isPickable=false;
  const fm=new BABYLON.StandardMaterial('fbm',scene);
  fm.diffuseColor=BABYLON.Color3.Black();fm.emissiveColor=new BABYLON.Color3(1,0.62,0.22);
  fm.specularColor=BABYLON.Color3.Black();fm.alphaMode=BABYLON.Engine.ALPHA_ADD;fm.alpha=0.95;
  fb.material=fm;fxMeshes.push({m:fb,mat:fm,t0:simT,dur:0.5,kind:'ball',s});
  /* shockwave ring */
  const ring=BABYLON.MeshBuilder.CreateTorus('sw',{diameter:2.4,thickness:0.16,tessellation:40},scene);
  ring.position.copyFrom(e.pos);ring.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;ring.isPickable=false;
  const rm=new BABYLON.StandardMaterial('swm',scene);
  rm.diffuseColor=BABYLON.Color3.Black();rm.emissiveColor=new BABYLON.Color3(1,0.85,0.6);
  rm.specularColor=BABYLON.Color3.Black();rm.alphaMode=BABYLON.Engine.ALPHA_ADD;rm.alpha=0.9;
  ring.material=rm;fxMeshes.push({m:ring,mat:rm,t0:simT,dur:0.6,kind:'ring',s});
  /* debris chunks */
  const n=s>5?14:8;
  for(let i=0;i<n;i++){
    const d=BABYLON.MeshBuilder.CreateBox('db',{width:rnd(0.3,1)*s*0.3,height:rnd(0.3,1)*s*0.3,depth:rnd(0.4,1.4)*s*0.3},scene);
    d.position.copyFrom(e.pos);d.material=debrisMat;d.isPickable=false;
    fxMeshes.push({m:d,t0:simT,dur:rnd(1.8,2.9),kind:'debris',
      vel:V3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalizeToNew().scale(rnd(8,12)*s*0.35+8),
      spin:V3(rnd(-6,6),rnd(-6,6),rnd(-6,6))});
  }
  /* ═══ CHAIN REACTION: anything inside ~one ship width also detonates ═══ */
  for(const o of ships){
    if(!o.alive)continue;
    if(BABYLON.Vector3.Distance(o.pos,e.pos)<e.chainR+o.radius*0.5){
      toast();killShip(o,0.13);
    }
  }
}
function updateFX(dt){
  for(const L of flashLights){if(!L.isEnabled())continue;
    L.intensity*=Math.exp(-dt*7);if(L.intensity<0.05)L.setEnabled(false);}
  for(let i=fxMeshes.length-1;i>=0;i--){
    const f=fxMeshes[i],k=(simT-f.t0)/f.dur;
    if(f.kind==='ball'){const sc=1+k*f.s*2.4;f.m.scaling.setAll(sc);f.mat.alpha=0.95*(1-k);}
    else if(f.kind==='ring'){const sc=1+k*f.s*2.6;f.m.scaling.setAll(sc);f.mat.alpha=0.9*(1-k);}
    else if(f.kind==='debris'){f.m.position.addInPlace(f.vel.scale(dt));
      f.m.rotation.addInPlace(f.spin.scale(dt));
      if(k>0.7)f.m.scaling.scaleInPlace(1-dt*3);f.vel.scaleInPlace(1-dt*0.4);}
    if(k>=1){f.m.dispose();if(f.mat)f.mat.dispose();fxMeshes.splice(i,1);}
  }
  for(let i=psList.length-1;i>=0;i--){
    if(simT>psList[i].die){psList[i].ps.dispose();psList.splice(i,1);}}
  if(shake>0){
    cam.target.copyFrom(V3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).scale(shake*0.55));
    shake*=Math.exp(-dt*2.6);if(shake<0.02){shake=0;cam.target.copyFrom(BABYLON.Vector3.Zero());}}
}

/* ─────────────────────── HUD, victory & restart ───────────────────── */
let hudDirty=true,battleOver=false;
function hudUpdate(){
  let b=0,r=0;
  for(const s of ships)if(s.alive)(s.team==='blue'?b++:r++);
  document.getElementById('bCnt').textContent=b;
  document.getElementById('rCnt').textContent=r;
  document.querySelector('#bBar i').style.width=(b*10)+'%';
  document.querySelector('#rBar i').style.width=(r*10)+'%';
  if(!battleOver){
    if(b===0||r===0){
      battleOver=true;
      const ban=document.getElementById('banner');
      ban.className='hud '+(b===0?'red':'blue');
      ban.classList.add('show');
      document.getElementById('bTxt').textContent=(b===0?'CRIMSON':'AZURE')+' ARMADA VICTORIOUS';
      setTimeout(restartBattle,6500);
    }
  }
}
function restartBattle(){
  for(const s of ships){s.root.dispose();s.barRoot.dispose();for(const m of s.mats)m.dispose();
    if(s.thrusterLight)s.thrusterLight.dispose();}
  ships.length=0;
  for(const p of projectiles){p.mesh.dispose();p.trail.dispose();}
  projectiles.length=0;
  for(const f of fxMeshes){f.m.dispose();if(f.mat)f.mat.dispose();}
  fxMeshes.length=0;
  for(const p of psList)p.ps.dispose();
  psList.length=0;
  pending.length=0;shake=0;simT=0;battleOver=false;
  document.getElementById('banner').classList.remove('show');
  spawnFleets();hudDirty=true;
}

/* ────────────────────────────── main loop ─────────────────────────── */
let intro=0;
engine.runRenderLoop(()=>{
  const dt=Math.min(engine.getDeltaTime(),50)/1000;
  simT+=dt;
  /* cinematic push-in on load + slow auto-orbit */
  if(intro<1){intro=Math.min(1,intro+dt/2.6);cam.radius=470-(470-320)*(1-Math.pow(1-intro,3));}
  cam.alpha+=dt*0.05;
  for(const s of ships)if(s.alive)updateShip(s,dt);
  updateProjectiles(dt);
  for(let i=pending.length-1;i>=0;i--){
    if(simT>=pending[i].at){doExplosion(pending[i]);pending.splice(i,1);}}
  updateFX(dt);
  if(hudDirty){hudDirty=false;hudUpdate();}
  scene.render();
});
addEventListener('resize',()=>engine.resize());
</script>
