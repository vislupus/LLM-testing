<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Fleet Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        #infoPanel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 10, 30, 0.85);
            border: 1px solid rgba(0, 200, 255, 0.4);
            border-radius: 10px;
            padding: 15px 20px;
            z-index: 100;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #a0d8ef;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }

        .fleet-info {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .fleet-info:last-child {
            margin-bottom: 0;
        }

        .fleet-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px currentColor;
        }

        .fleet-dot.blue {
            background: #00d4ff;
            color: #00d4ff;
        }

        .fleet-dot.red {
            background: #ff3344;
            color: #ff3344;
        }

        .fleet-count {
            font-size: 18px;
            font-weight: bold;
            min-width: 40px;
        }

        .fleet-label {
            color: #607080;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #fpsCounter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #406080;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="infoPanel">
        <div class="fleet-info">
            <div class="fleet-dot blue"></div>
            <span class="fleet-label">BLUE FLEET</span>
            <span class="fleet-count" id="blueCount" style="color: #00d4ff; margin-left: 10px;">10</span>
        </div>
        <div class="fleet-info">
            <div class="fleet-dot red"></div>
            <span class="fleet-label">RED FLEET</span>
            <span class="fleet-count" id="redCount" style="color: #ff3344; margin-left: 10px;">10</span>
        </div>
    </div>

    <div id="fpsCounter">FPS: <span id="fpsValue">60</span></div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

    <script>
        // ============================================
        // SPACE FLEET BATTLE SIMULATION
        // ============================================

        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        // Configuration
        const CONFIG = {
            ESCORT_HP: 100,
            FLAGSHIP_HP: 500,
            FIRE_RATE: 3000,
            PROJECTILE_SPEED: 0.8,
            SHIP_SPEED: 0.15,
            CHAIN_REACTION_RADIUS: 5,
            BATTLE_BOUNDS: 40,
            ESCORT_SIZE: 2,
            FLAGSHIP_SIZE: 6
        };

        // Colors
        const BLUE_COLOR = new BABYLON.Color3(0, 0.83, 1);
        const RED_COLOR = new BABYLON.Color3(1, 0.2, 0.27);
        const BLUE_TRAIL = new BABYLON.Color3(0.2, 0.6, 1);
        const RED_TRAIL = new BABYLON.Color3(1, 0.3, 0.2);

        // Game State
        let ships = [];
        let projectiles = [];
        let explosions = [];
        let scene;

        // ============================================
        // SCENE SETUP
        // ============================================

        function createScene() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.05, 1);
            scene.ambientColor = new BABYLON.Color3(0.1, 0.1, 0.15);

            // Camera
            const camera = new BABYLON.ArcRotateCamera(
                'camera',
                -Math.PI / 2,
                Math.PI / 3,
                120,
                new BABYLON.Vector3(0, 0, 0),
                scene
            );
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 40;
            camera.upperRadiusLimit = 200;
            camera.lowerBetaLimit = 0.2;
            camera.upperBetaLimit = Math.PI - 0.2;
            camera.wheelPrecision = 20;

            // Auto-rotate slowly
            scene.registerBeforeRender(() => {
                camera.alpha += 0.0003;
            });

            // Lighting
            const hemiLight = new BABYLON.HemisphericLight(
                'hemi',
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            hemiLight.intensity = 0.3;
            hemiLight.diffuse = new BABYLON.Color3(0.6, 0.7, 1);
            hemiLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);

            const sunLight = new BABYLON.DirectionalLight(
                'sun',
                new BABYLON.Vector3(-1, -0.5, 0),
                scene
            );
            sunLight.intensity = 0.8;
            sunLight.diffuse = new BABYLON.Color3(1, 0.95, 0.9);

            // Create starfield background
            createStarfield();

            // Create nebula
            createNebula();

            // Initialize GUI
            const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI('UI');

            // Create fleets
            createFleet(BLUE_COLOR, BLUE_TRAIL, new BABYLON.Vector3(0, 0, -40), 1);
            createFleet(RED_COLOR, RED_TRAIL, new BABYLON.Vector3(0, 0, 40), -1);

            return scene;
        }

        // ============================================
        // BACKGROUND
        // ============================================

        function createStarfield() {
            const starCount = 2000;
            const positions = [];
            const colors = [];

            for (let i = 0; i < starCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 300 + Math.random() * 100;

                positions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );

                const brightness = 0.5 + Math.random() * 0.5;
                const tint = Math.random();
                if (tint < 0.7) {
                    colors.push(brightness, brightness, brightness, 1);
                } else if (tint < 0.85) {
                    colors.push(brightness, brightness * 0.8, brightness * 0.6, 1);
                } else {
                    colors.push(brightness * 0.7, brightness * 0.8, brightness, 1);
                }
            }

            const stars = new BABYLON.PointsCloudSystem('stars', 2, scene);
            stars.addPoints(starCount, (particle, i) => {
                particle.position = new BABYLON.Vector3(
                    positions[i * 3],
                    positions[i * 3 + 1],
                    positions[i * 3 + 2]
                );
                particle.color = new BABYLON.Color4(
                    colors[i * 4],
                    colors[i * 4 + 1],
                    colors[i * 4 + 2],
                    colors[i * 4 + 3]
                );
            });
            stars.buildMeshAsync();
        }

        function createNebula() {
            // Create several colored fog planes
            const nebulaColors = [
                new BABYLON.Color3(0.1, 0, 0.2),
                new BABYLON.Color3(0, 0.1, 0.15),
                new BABYLON.Color3(0.15, 0.05, 0)
            ];

            for (let i = 0; i < 5; i++) {
                const nebula = BABYLON.MeshBuilder.CreatePlane('nebula' + i, {
                    width: 200,
                    height: 200
                }, scene);

                const angle = (i / 5) * Math.PI * 2;
                nebula.position = new BABYLON.Vector3(
                    Math.cos(angle) * 150,
                    (Math.random() - 0.5) * 60,
                    Math.sin(angle) * 150
                );
                nebula.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

                const mat = new BABYLON.StandardMaterial('nebulaMat' + i, scene);
                mat.emissiveColor = nebulaColors[i % nebulaColors.length];
                mat.alpha = 0.15;
                mat.backFaceCulling = false;
                nebula.material = mat;
            }
        }

        // ============================================
        // SHIP CREATION
        // ============================================

        function createShip(fleetColor, trailColor, position, direction, isFlagship) {
            const ship = new BABYLON.TransformNode('ship', scene);
            ship.position = position.clone();

            const size = isFlagship ? CONFIG.FLAGSHIP_SIZE : CONFIG.ESCORT_SIZE;
            const hp = isFlagship ? CONFIG.FLAGSHIP_HP : CONFIG.ESCORT_HP;

            if (isFlagship) {
                createFlagshipMesh(ship, fleetColor, size);
            } else {
                createEscortMesh(ship, fleetColor, size);
            }

            // Engine glow
            createEngineGlow(ship, fleetColor, size, direction);

            // Health bar
            const healthBar = createHealthBar(ship, hp, isFlagship);

            const shipData = {
                node: ship,
                mesh: ship.getChildMeshes()[0],
                health: hp,
                maxHealth: hp,
                fleetColor: fleetColor,
                trailColor: trailColor,
                direction: direction,
                isFlagship: isFlagship,
                healthBar: healthBar,
                lastFire: 0,
                velocity: new BABYLON.Vector3(0, 0, direction * CONFIG.SHIP_SPEED),
                targetRotation: new BABYLON.Vector3(0, direction > 0 ? Math.PI : 0, 0),
                noiseOffset: Math.random() * 1000
            };

            ships.push(shipData);
            return shipData;
        }

        function createEscortMesh(parent, color, size) {
            // Main body
            const body = BABYLON.MeshBuilder.CreateBox('escortBody', {
                width: size * 0.6,
                height: size * 0.3,
                depth: size * 1.2
            }, scene);
            body.parent = parent;

            // Cockpit
            const cockpit = BABYLON.MeshBuilder.CreateBox('cockpit', {
                width: size * 0.4,
                height: size * 0.25,
                depth: size * 0.4
            }, scene);
            cockpit.position.z = size * 0.3;
            cockpit.position.y = size * 0.1;
            cockpit.parent = parent;

            // Wings
            for (let side = -1; side <= 1; side += 2) {
                const wing = BABYLON.MeshBuilder.CreateBox('wing', {
                    width: size * 0.8,
                    height: size * 0.08,
                    depth: size * 0.6
                }, scene);
                wing.position.x = side * size * 0.5;
                wing.position.z = -size * 0.2;
                wing.parent = parent;
            }

            // Materials
            const bodyMat = new BABYLON.StandardMaterial('bodyMat', scene);
            bodyMat.diffuseColor = color.scale(0.6);
            bodyMat.specularColor = new BABYLON.Color3(0.4, 0.4, 0.4);
            bodyMat.emissiveColor = color.scale(0.2);

            body.material = bodyMat;
            cockpit.material = bodyMat;

            const wingMat = new BABYLON.StandardMaterial('wingMat', scene);
            wingMat.diffuseColor = color.scale(0.4);
            wingMat.emissiveColor = color.scale(0.1);
            parent.getChildMeshes().forEach(m => {
                if (m.name === 'wing') m.material = wingMat;
            });
        }

        function createFlagshipMesh(parent, color, size) {
            // Central hull
            const hull = BABYLON.MeshBuilder.CreateBox('hull', {
                width: size * 0.7,
                height: size * 0.5,
                depth: size * 1.5
            }, scene);
            hull.parent = parent;

            // Bridge
            const bridge = BABYLON.MeshBuilder.CreateBox('bridge', {
                width: size * 0.5,
                height: size * 0.4,
                depth: size * 0.6
            }, scene);
            bridge.position.y = size * 0.45;
            bridge.position.z = size * 0.3;
            bridge.parent = parent;

            // Engine nacelles
            for (let side = -1; side <= 1; side += 2) {
                for (let vert = -1; vert <= 1; vert += 2) {
                    const nacelle = BABYLON.MeshBuilder.CreateCylinder('nacelle', {
                        height: size * 0.8,
                        diameter: size * 0.25,
                        tessellation: 8
                    }, scene);
                    nacelle.rotation.x = Math.PI / 2;
                    nacelle.position.x = side * size * 0.5;
                    nacelle.position.y = vert * size * 0.2;
                    nacelle.position.z = -size * 0.5;
                    nacelle.parent = parent;
                }
            }

            // Side panels
            for (let side = -1; side <= 1; side += 2) {
                const panel = BABYLON.MeshBuilder.CreateBox('panel', {
                    width: size * 0.3,
                    height: size * 0.6,
                    depth: size * 0.8
                }, scene);
                panel.position.x = side * size * 0.5;
                panel.position.y = size * 0.1;
                panel.position.z = -size * 0.2;
                panel.parent = parent;
            }

            // Materials
            const hullMat = new BABYLON.StandardMaterial('hullMat', scene);
            hullMat.diffuseColor = color.scale(0.7);
            hullMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
            hullMat.emissiveColor = color.scale(0.15);

            const darkMat = new BABYLON.StandardMaterial('darkMat', scene);
            darkMat.diffuseColor = color.scale(0.3);
            darkMat.emissiveColor = color.scale(0.05);

            parent.getChildMeshes().forEach(m => {
                if (m.name === 'hull' || m.name === 'bridge') {
                    m.material = hullMat;
                } else {
                    m.material = darkMat;
                }
            });
        }

        function createEngineGlow(parent, color, size, direction) {
            const glow = BABYLON.MeshBuilder.CreateSphere('engineGlow', {
                diameter: size * 0.2,
                segments: 8
            }, scene);
            glow.position.z = -size * 0.6 * direction;
            glow.parent = parent;

            const glowMat = new BABYLON.StandardMaterial('glowMat', scene);
            glowMat.emissiveColor = color;
            glowMat.disableLighting = true;
            glow.material = glowMat;

            // Point light for engine
            const light = new BABYLON.PointLight('engineLight', new BABYLON.Vector3(0, 0, -size * 0.7), scene);
            light.diffuse = color;
            light.intensity = 0.5;
            light.parent = parent;
        }

        function createHealthBar(parent, maxHealth, isFlagship) {
            const healthBar = new BABYLON.GUI.Rectangle();
            healthBar.width = (isFlagship ? '80px' : '40px');
            healthBar.height = (isFlagship ? '12px' : '8px');
            healthBar.cornerRadius = 2;
            healthBar.color = '#ffffff';
            healthBar.thickness = 1;
            healthBar.background = 'rgba(0, 0, 0, 0.5)';
            healthBar.linkOffsetY = -30;

            const healthInner = new BABYLON.GUI.Rectangle();
            healthInner.width = '100%';
            healthInner.height = '100%';
            healthInner.cornerRadius = 1;
            healthInner.color = 'transparent';
            healthInner.thickness = 0;
            healthInner.background = '#00ff00';
            healthInner.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
            healthBar.addControl(healthInner);

            advancedTexture.addControl(healthBar);
            healthBar.linkWithMesh(parent.getChildMeshes()[0]);
            healthBar.linkOffsetY = isFlagship ? -50 : -20;

            return { bar: healthBar, inner: healthInner, maxWidth: isFlagship ? 80 : 40 };
        }

        // ============================================
        // FLEET CREATION
        // ============================================

        function createFleet(fleetColor, trailColor, centerPos, direction) {
            // Create flagship at center
            const flagshipPos = centerPos.clone();
            flagshipPos.y = (Math.random() - 0.5) * 10;
            createShip(fleetColor, trailColor, flagshipPos, direction, true);

            // Create escorts in formation
            const formationOffsets = [
                { x: -8, y: 5, z: 0 },
                { x: 8, y: 5, z: 0 },
                { x: -8, y: -5, z: 0 },
                { x: 8, y: -5, z: 0 },
                { x: -15, y: 0, z: 5 },
                { x: 15, y: 0, z: 5 },
                { x: -15, y: 8, z: -5 },
                { x: 15, y: -8, z: -5 },
                { x: 0, y: -10, z: 3 }
            ];

            formationOffsets.forEach((offset, i) => {
                const pos = centerPos.clone();
                pos.x += offset.x + (Math.random() - 0.5) * 3;
                pos.y += offset.y + (Math.random() - 0.5) * 3;
                pos.z += offset.z + (Math.random() - 0.5) * 3;
                createShip(fleetColor, trailColor, pos, direction, false);
            });
        }

        // ============================================
        // PROJECTILE SYSTEM
        // ============================================

        function fireProjectile(ship) {
            const target = findNearestEnemy(ship);
            if (!target) return;

            const shipPos = ship.node.position.clone();
            const targetPos = target.node.position.clone();

            const direction = targetPos.subtract(shipPos).normalize();

            const projectile = BABYLON.MeshBuilder.CreateSphere('projectile', {
                diameter: ship.isFlagship ? 0.8 : 0.5,
                segments: 8
            }, scene);

            projectile.position = shipPos.clone();
            projectile.position.addInPlace(direction.scale(ship.isFlagship ? CONFIG.FLAGSHIP_SIZE : CONFIG.ESCORT_SIZE));

            const projMat = new BABYLON.StandardMaterial('projMat', scene);
            projMat.emissiveColor = ship.fleetColor;
            projMat.disableLighting = true;
            projectile.material = projMat;

            // Point light on projectile
            const light = new BABYLON.PointLight('projLight', projectile.position, scene);
            light.diffuse = ship.fleetColor;
            light.intensity = 0.3;
            light.range = 5;

            // Trail
            const trail = new BABYLON.TrailMesh('trail', projectile, scene, 0.3, 30, true);
            const trailMat = new BABYLON.StandardMaterial('trailMat', scene);
            trailMat.emissiveColor = ship.trailColor;
            trailMat.disableLighting = true;
            trail.material = trailMat;

            projectiles.push({
                mesh: projectile,
                light: light,
                trail: trail,
                direction: direction,
                speed: CONFIG.PROJECTILE_SPEED,
                fleetColor: ship.fleetColor,
                owner: ship,
                lifetime: 0
            });
        }

        function findNearestEnemy(ship) {
            let nearest = null;
            let nearestDist = Infinity;

            ships.forEach(other => {
                if (other === ship || other.fleetColor === ship.fleetColor) return;
                const dist = BABYLON.Vector3.Distance(ship.node.position, other.node.position);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearest = other;
                }
            });

            return nearest;
        }

        // ============================================
        // EXPLOSION SYSTEM
        // ============================================

        function createExplosion(position, color, size) {
            // Core flash
            const core = BABYLON.MeshBuilder.CreateSphere('explosionCore', {
                diameter: size * 0.5,
                segments: 16
            }, scene);
            core.position = position.clone();

            const coreMat = new BABYLON.StandardMaterial('coreMat', scene);
            coreMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
            coreMat.disableLighting = true;
            core.material = coreMat;

            // Flash light
            const flashLight = new BABYLON.PointLight('flashLight', position, scene);
            flashLight.diffuse = new BABYLON.Color3(1, 0.8, 0.5);
            flashLight.intensity = 3;
            flashLight.range = size * 5;

            // Particle system for debris
            const debris = new BABYLON.ParticleSystem('debris', 100, scene);
            debris.particleTexture = new BABYLON.Texture('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAGklEQVQYV2NkYGD4z4AHMP7//x8fN1IFA8MDAFBwBQEzmXK1AAAAAElFTkSuQmCC', scene);
            debris.emitter = position.clone();
            debris.minEmitBox = new BABYLON.Vector3(-size/4, -size/4, -size/4);
            debris.maxEmitBox = new BABYLON.Vector3(size/4, size/4, size/4);
            debris.color1 = new BABYLON.Color4(1, 0.6, 0.2, 1);
            debris.color2 = new BABYLON.Color4(1, 0.3, 0.1, 1);
            debris.colorDead = new BABYLON.Color4(0.2, 0.2, 0.2, 0);
            debris.minSize = 0.3;
            debris.maxSize = size * 0.4;
            debris.minLifeTime = 0.5;
            debris.maxLifeTime = 1.5;
            debris.emitRate = 200;
            debris.gravity = new BABYLON.Vector3(0, 0, 0);
            debris.direction1 = new BABYLON.Vector3(-1, -1, -1);
            debris.direction2 = new BABYLON.Vector3(1, 1, 1);
            debris.minEmitPower = size * 0.5;
            debris.maxEmitPower = size * 1.5;
            debris.updateSpeed = 0.02;
            debris.targetStopDuration = 0.3;
            debris.disposeOnStop = true;
            debris.start();

            // Spark particles
            const sparks = new BABYLON.ParticleSystem('sparks', 200, scene);
            sparks.particleTexture = debris.particleTexture;
            sparks.emitter = position.clone();
            sparks.minEmitBox = new BABYLON.Vector3(-size/8, -size/8, -size/8);
            sparks.maxEmitBox = new BABYLON.Vector3(size/8, size/8, size/8);
            sparks.color1 = new BABYLON.Color4(1, 0.9, 0.5, 1);
            sparks.color2 = new BABYLON.Color4(1, 0.5, 0.2, 1);
            sparks.colorDead = new BABYLON.Color4(0.1, 0.1, 0.1, 0);
            sparks.minSize = 0.1;
            sparks.maxSize = 0.3;
            sparks.minLifeTime = 0.3;
            sparks.maxLifeTime = 0.8;
            sparks.emitRate = 500;
            sparks.gravity = new BABYLON.Vector3(0, 0, 0);
            sparks.direction1 = new BABYLON.Vector3(-1, -1, -1);
            sparks.direction2 = new BABYLON.Vector3(1, 1, 1);
            sparks.minEmitPower = size;
            sparks.maxEmitPower = size * 2;
            sparks.updateSpeed = 0.01;
            sparks.targetStopDuration = 0.2;
            sparks.disposeOnStop = true;
            sparks.start();

            // Shockwave ring
            const shockwave = BABYLON.MeshBuilder.CreateTorus('shockwave', {
                diameter: 1,
                thickness: 0.3,
                tessellation: 32
            }, scene);
            shockwave.position = position.clone();
            shockwave.rotation.x = Math.PI / 2;

            const shockMat = new BABYLON.StandardMaterial('shockMat', scene);
            shockMat.emissiveColor = new BABYLON.Color3(1, 0.6, 0.3);
            shockMat.alpha = 0.8;
            shockMat.disableLighting = true;
            shockwave.material = shockMat;

            // Animate explosion
            let frame = 0;
            const animObserver = scene.onBeforeRenderObservable.add(() => {
                frame++;

                // Expand core then fade
                const scale = 1 + frame * 0.3;
                core.scaling = new BABYLON.Vector3(scale, scale, scale);
                coreMat.alpha = Math.max(0, 1 - frame * 0.05);

                // Expand shockwave
                const shockScale = 1 + frame * 0.4;
                shockwave.scaling = new BABYLON.Vector3(shockScale, shockScale, 1);
                shockMat.alpha = Math.max(0, 0.8 - frame * 0.02);

                // Fade light
                flashLight.intensity = Math.max(0, 3 - frame * 0.1);

                if (frame > 60) {
                    core.dispose();
                    shockwave.dispose();
                    flashLight.dispose();
                    scene.onBeforeRenderObservable.remove(animObserver);
                }
            });

            // Chain reaction check
            const explosionRadius = CONFIG.CHAIN_REACTION_RADIUS * (ship.isFlagship ? CONFIG.FLAGSHIP_SIZE : CONFIG.ESCORT_SIZE) / CONFIG.ESCORT_SIZE;

            ships.forEach(otherShip => {
                if (otherShip.health <= 0) return;
                const dist = BABYLON.Vector3.Distance(position, otherShip.node.position);
                if (dist < explosionRadius) {
                    // Chain reaction!
                    setTimeout(() => {
                        if (otherShip.health > 0) {
                            otherShip.health = 0;
                            destroyShip(otherShip, true);
                        }
                    }, 100 + Math.random() * 200);
                }
            });

            explosions.push({ position: position.clone(), time: Date.now() });
        }
