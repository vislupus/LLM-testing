<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js - Epic 3D Space Battle</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #05050a;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #uiOverlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; color: #e0e0ff; }
        .faction-status { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .red-team { color: #ff4d4d; }
        .blue-team { color: #3399ff; }
    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="uiOverlay">
        <h1>Space Battle Simulation</h1>
        <div class="faction-status red-team">Vanguard Fleet (Red): <span id="redCount">10</span>/10 Ships</div>
        <div class="faction-status blue-team">Alliance Fleet (Blue): <span id="blueCount">10</span>/10 Ships</div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        // Simulation parameters
        const SHIPS_PER_FACTION = 10;
        const ARENA_SIZE = 180;
        
        let ships = [];
        let lasers = [];
        let particles = [];
        let scene, camera;

        const createScene = function () {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.02, 0.02, 0.04);

            // Setup Camera
            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 220, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 400;
            camera.useAutoRotationBehavior = true;
            camera.autoRotationBehavior.idleRotationSpeed = 0.05;

            // Ambient and directional lighting
            const ambient = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
            ambient.intensity = 0.25;

            const sunLight = new BABYLON.DirectionalLight("sunLight", new BABYLON.Vector3(1, -1, -0.5), scene);
            sunLight.intensity = 1.2;
            sunLight.diffuse = new BABYLON.Color3(0.95, 0.95, 1.0);

            // Generate Cosmic Starfield Background
            createStarfield(scene);

            // Initialize Teams
            spawnFleet("Red", new BABYLON.Vector3(-100, 0, 0), new BABYLON.Color3(1, 0.1, 0.1));
            spawnFleet("Blue", new BABYLON.Vector3(100, 0, 0), new BABYLON.Color3(0.1, 0.5, 1));

            return scene;
        };

        // Deep Space Starfield Generator
        function createStarfield(scene) {
            const starCount = 1500;
            const starPositions = [];
            const starColors = [];

            for (let i = 0; i < starCount; i++) {
                // Distribute stars on a sphere far outside arena bounds
                const theta = Math.random() * 2 * Math.PI;
                const phi = Math.acos((Math.random() * 2) - 1);
                const radius = 400 + Math.random() * 200;

                starPositions.push(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );

                const c = 0.6 + Math.random() * 0.4;
                starColors.push(c, c, c + 0.1 * Math.random(), 1);
            }

            const pcs = new BABYLON.PointsCloudSystem("starfield", 2, scene);
            pcs.addPoints(starCount, (particle, i) => {
                particle.position.set(starPositions[i*3], starPositions[i*3+1], starPositions[i*3+2]);
                particle.color.set(starColors[i*4], starColors[i*4+1], starColors[i*4+2], starColors[i*4+3]);
            });
            pcs.buildMeshAsync();
        }

        // Procedural Geometry Generator for Unique Capital Ships
        function createShipMesh(isFlagship, color, scene) {
            const root = new BABYLON.Mesh("shipRoot", scene);
            
            // Materials
            const hullMat = new BABYLON.StandardMaterial("hullMat", scene);
            hullMat.diffuseColor = new BABYLON.Color3(0.2, 0.22, 0.25);
            hullMat.specularColor = color.scale(0.8);
            hullMat.glossiness = 0.6;

            const trimMat = new BABYLON.StandardMaterial("trimMat", scene);
            trimMat.diffuseColor = color;
            trimMat.emissiveColor = color.scale(0.4);

            const scale = isFlagship ? 2.5 : 1.0;

            // Main Core Hull
            const core = BABYLON.MeshBuilder.CreateCylinder("core", {
                diameterTop: 0, diameterBottom: 2 * scale, height: 7 * scale, tessellation: 5
            }, scene);
            core.rotation.x = Math.PI / 2;
            core.material = hullMat;
            core.parent = root;

            // Wings / Structs
            const wingL = BABYLON.MeshBuilder.CreateBox("wingL", { width: 4 * scale, height: 0.4 * scale, depth: 2 * scale }, scene);
            wingL.position.x = -2 * scale;
            wingL.position.z = -1 * scale;
            wingL.rotation.y = Math.PI / 6;
            wingL.material = trimMat;
            wingL.parent = root;

            const wingR = wingL.clone("wingR");
            wingR.position.x = 2 * scale;
            wingR.rotation.y = -Math.PI / 6;
            wingR.parent = root;

            if (isFlagship) {
                // Additional detailing for Flagship Command Towers
                const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 1.5, height: 2, depth: 2 }, scene);
                bridge.position.y = 1.5;
                bridge.position.z = -1;
                bridge.material = hullMat;
                bridge.parent = root;

                const heavyFlank = BABYLON.MeshBuilder.CreateBox("flank", { width: 6, height: 1, depth: 4 }, scene);
                heavyFlank.position.z = -2;
                heavyFlank.material = hullMat;
                heavyFlank.parent = root;
            }

            // Engine Exhaust Visuals
            const engineGlow = BABYLON.MeshBuilder.CreateCylinder("engine", { diameter: 1 * scale, height: 0.5 * scale }, scene);
            engineGlow.rotation.x = Math.PI / 2;
            engineGlow.position.z = -3.5 * scale;
            engineGlow.material = trimMat;
            engineGlow.parent = root;

            // Localized Dynamic Thruster Illumination
            const thrusterLight = new BABYLON.PointLight("thrusterLight", new BABYLON.Vector3(0, 0, -4 * scale), scene);
            thrusterLight.diffuse = color;
            thrusterLight.intensity = isFlagship ? 4 : 1.5;
            thrusterLight.range = isFlagship ? 25 : 10;
            thrusterLight.parent = root;

            // Initialize Thruster Trail Engine
            createThrusterTrail(engineGlow, color, isFlagship);

            return root;
        }

        // Engine Thruster Particle System
        function createThrusterTrail(parentMesh, color, isFlagship) {
            const ps = new BABYLON.ParticleSystem("thruster", 100, scene);
            ps.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
            ps.emitter = parentMesh;
            ps.minEmitBox = new BABYLON.Vector3(-0.2, -0.2, 0);
            ps.maxEmitBox = new BABYLON.Vector3(0.2, 0.2, 0);
            ps.color1 = color.toColor4(1);
            ps.color2 = new BABYLON.Color4(1, 0.6, 0, 0.8);
            ps.colorDead = new BABYLON.Color4(0, 0, 0, 0);
            ps.minSize = isFlagship ? 0.6 : 0.2;
            ps.maxSize = isFlagship ? 1.5 : 0.5;
            ps.minLifeTime = 0.1;
            ps.maxLifeTime = 0.4;
            ps.emitRate = 60;
            ps.gravity = new BABYLON.Vector3(0, 0, 0);
            ps.direction1 = new BABYLON.Vector3(0, 0, -4);
            ps.direction2 = new BABYLON.Vector3(0, 0, -6);
            ps.speed = 2;
            ps.updateSpeed = 0.015;
            ps.start();
        }

        // Custom UI Health Bar Overlay Mesh
        function createHealthBar(parentMesh, size) {
            const width = size * 3;
            const container = BABYLON.MeshBuilder.CreatePlane("hpContainer", { width: width, height: 0.3 }, scene);
            container.position.y = size * 3;
            container.parent = parentMesh;
            container.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

            const bg = BABYLON.MeshBuilder.CreatePlane("hpBg", { width: width, height: 0.3 }, scene);
            bg.material = new BABYLON.StandardMaterial("hpBgMat", scene);
            bg.material.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            bg.material.emissiveColor = new BABYLON.Color3(0.2, 0, 0);
            bg.parent = container;
            bg.position.z = 0.01;

            const bar = BABYLON.MeshBuilder.CreatePlane("hpBar", { width: width, height: 0.3 }, scene);
            bar.material = new BABYLON.StandardMaterial("hpBarMat", scene);
            bar.material.diffuseColor = new BABYLON.Color3(0.1, 0.9, 0.2);
            bar.material.emissiveColor = new BABYLON.Color3(0, 0.5, 0);
            bar.parent = container;
            bar.position.z = -0.01;

            // Pivot shift to left edge scaling
            bar.bakeTransformIntoVertices(BABYLON.Matrix.Translation(width / 2, 0, 0));
            bar.position.x = -width / 2;

            return { container, bar, maxWidth: width };
        }

        // Create and position a complete tactical squadron
        function spawnFleet(faction, centerPos, factionColor) {
            for (let i = 0; i < SHIPS_PER_FACTION; i++) {
                const isFlagship = (i === 0);
                const mesh = createShipMesh(isFlagship, factionColor, scene);
                
                // Formational array dispersion offsets
                let offset;
                if (isFlagship) {
                    offset = new BABYLON.Vector3(0, 0, 0);
                } else {
                    const angle = ((i - 1) / (SHIPS_PER_FACTION - 1)) * Math.PI * 2;
                    const radius = 30 + Math.random() * 15;
                    offset = new BABYLON.Vector3(
                        Math.sin(angle) * radius * 0.4,
                        (Math.random() - 0.5) * 20,
                        Math.cos(angle) * radius
                    );
                }

                mesh.position = centerPos.add(offset);
                mesh.rotation.y = faction === "Red" ? 0 : Math.PI;

                const size = isFlagship ? 2.5 : 1.0;
                const hpComponents = createHealthBar(mesh, size);

                ships.push({
                    mesh: mesh,
                    faction: faction,
                    isFlagship: isFlagship,
                    color: factionColor,
                    size: size,
                    health: 100,
                    maxHealth: 100,
                    hpBar: hpComponents.bar,
                    hpContainer: hpComponents.container,
                    velocity: BABYLON.Vector3.Zero(),
                    target: null,
                    lastFired: Math.random() * 3, // Staggered initial firing sequences
                    radius: size * 4.5
                });
            }
        }

        // Energy Projectile Generation Factory
        function fireLaser(origin, targetPos, color, isFlagship) {
            const dir = targetPos.subtract(origin).normalize();
            
            const count = isFlagship ? 2 : 1;
            for (let i = 0; i < count; i++) {
                const laser = BABYLON.MeshBuilder.CreateCylinder("laser", { diameter: 0.3, height: 5 }, scene);
                laser.rotation.x = Math.PI / 2;
                
                // Align laser direction axis matrix
                laser.lookAt(laser.position.add(dir));

                // Flagship parallel broadside offset calculations
                if (isFlagship) {
                    const rightVec = BABYLON.Vector3.Cross(dir, BABYLON.Vector3.Up()).normalize();
                    const offsetAmt = (i === 0 ? 2.0 : -2.0);
                    laser.position = origin.add(rightVec.scale(offsetAmt));
                } else {
                    laser.position = origin.clone();
                }

                const mat = new BABYLON.StandardMaterial("laserMat", scene);
                mat.emissiveColor = color;
                mat.diffuseColor = color;
                laser.material = mat;

                // Visual Glow trail setup
                const trail = new BABYLON.ParticleSystem("laserTrail", 20, scene);
                trail.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
                trail.emitter = laser;
                trail.color1 = color.toColor4(1);
                trail.colorDead = new BABYLON.Color4(0,0,0,0);
                trail.minSize = 0.4;
                trail.maxSize = 0.8;
                trail.emitRate = 40;
                trail.minLifeTime = 0.05;
                trail.maxLifeTime = 0.15;
                trail.direction1 = dir.scale(-1);
                trail.start();

                lasers.push({
                    mesh: laser,
                    direction: dir,
                    speed: 160, // Rapid kinetic speed
                    damage: isFlagship ? 12 : 15,
                    faction: isFlagship ? "Flagship" : "Escort",
                    birth: performance.now(),
                    trail: trail
                });
            }
        }

        // Kinetic Chain Blast Engine (Cascading Destructions)
        function triggerExplosionChain(epicenter, blastRadius) {
            ships.forEach(ship => {
                if (ship.health > 0) {
                    const distance = BABYLON.Vector3.Distance(epicenter, ship.mesh.position);
                    // Proximity check calibrated around 1 ship-width factor
                    if (distance <= blastRadius + ship.radius) {
                        const damageMod = (1.0 - (distance / (blastRadius + ship.radius))) * 80;
                        damageShip(ship, damageMod);
                    }
                }
            });
        }

        // Kinetic damage impact register
        function damageShip(ship, amount) {
            if (ship.health <= 0) return;

            ship.health -= amount;
            if (ship.health < 0) ship.health = 0;

            // Render health matrix scale down
            const healthPct = ship.health / ship.maxHealth;
            ship.hpBar.scaling.x = healthPct;

            if (ship.health <= 0) {
                explodeShip(ship);
            }
        }

        // Volumetric VFX Explosion Generator
        function explodeShip(ship) {
            const pos = ship.mesh.position.clone();
            const scale = ship.size;

            // 1. Shockwave Flash
            const shockwave = BABYLON.MeshBuilder.CreateSphere("shockwave", { diameter: 2 }, scene);
            shockwave.position = pos;
            const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
            shockMat.emissiveColor = new BABYLON.Color3(1, 0.6, 0.2);
            shockMat.specularColor = BABYLON.Color3.Black();
            shockwave.material = shockMat;

            // 2. High-Density Plasma & Fire Particle Burst Engine
            const expParticles = new BABYLON.ParticleSystem("explosion", 300, scene);
            expParticles.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
            expParticles.emitter = pos;
            expParticles.minEmitBox = new BABYLON.Vector3(-scale, -scale, -scale);
            expParticles.maxEmitBox = new BABYLON.Vector3(scale, scale, scale);
            
            expParticles.color1 = new BABYLON.Color4(1, 0.7, 0.2, 1);
            expParticles.color2 = new BABYLON.Color4(1, 0.2, 0, 0.8);
            expParticles.colorDead = new BABYLON.Color4(0.1, 0.1, 0.1, 0);
            
            expParticles.minSize = 1.5 * scale;
            expParticles.maxSize = 4.5 * scale;
            expParticles.minLifeTime = 0.4;
            expParticles.maxLifeTime = 1.2;
            expParticles.emitRate = 400;
            expParticles.manualEmitCount = 250;
            expParticles.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            expParticles.gravity = new BABYLON.Vector3(0, 0, 0);
            
            // Random omnidirectional expansion paths
            expParticles.direction1 = new BABYLON.Vector3(-4, -4, -4);
            expParticles.direction2 = new BABYLON.Vector3(4, 4, 4);
            expParticles.minEmitPower = 5 * scale;
            expParticles.maxEmitPower = 12 * scale;
            expParticles.updateSpeed = 0.02;
            expParticles.start();

            // 3. Incandescent Metallic Debris Fragments
            const debrisCount = 12 * scale;
            const debrisMeshes = [];
            for(let i=0; i<debrisCount; i++) {
                const chunk = BABYLON.MeshBuilder.CreateBox("debris", {width: 0.4*scale, height: 0.4*scale, depth: 1*scale}, scene);
                chunk.position = pos.add(new BABYLON.Vector3((Math.random()-0.5)*scale, (Math.random()-0.5)*scale, (Math.random()-0.5)*scale));
                chunk.material = ship.mesh.getChildMeshes()[0].material;
                
                const dVel = new BABYLON.Vector3((Math.random()-0.5)*40, (Math.random()-0.5)*40, (Math.random()-0.5)*40);
                const dRot = new BABYLON.Vector3(Math.random()*5, Math.random()*5, Math.random()*5);
                debrisMeshes.push({ mesh: chunk, vel: dVel, rot: dRot, birth: performance.now() });
            }

            // Animate dynamic objects via runtime track extensions
            particles.push({
                type: "explosion",
                mesh: shockwave,
                particleSystem: expParticles,
                debris: debrisMeshes,
                maxScale: 28 * scale,
                currentScale: 2,
                birth: performance.now(),
                duration: 1500
            });

            // Clean down object data records
            ship.hpContainer.dispose();
            ship.mesh.dispose();

            // Run spatial assessment check to prompt Cascading Proximity Chain reactions
            const actualBlastRadius = 16 * scale; 
            setTimeout(() => {
                triggerExplosionChain(pos, actualBlastRadius);
            }, 80);

            updateUI();
        }

        // Live HUD Metrics updates
        function updateUI() {
            const redAlive = ships.filter(s => s.faction === "Red" && s.health > 0).length;
            const blueAlive = ships.filter(s => s.faction === "Blue" && s.health > 0).length;
            
            document.getElementById("redCount").innerText = redAlive;
            document.getElementById("blueCount").innerText = blueAlive;
        }

        // Main scene loop logic
        scene = createScene();

        engine.runRenderLoop(function () {
            if (!scene) return;

            const dt = engine.getDeltaTime() / 1000;
            const now = performance.now();

            // Filter active structural units
            const activeShips = ships.filter(s => s.health > 0);

            activeShips.forEach(ship => {
                // Acquisition Protocol: Target nearest structural enemy unit
                if (!ship.target || ship.target.health <= 0) {
                    let closestEnemy = null;
                    let minDist = Infinity;
                    
                    activeShips.forEach(enemy => {
                        if (enemy.faction !== ship.faction) {
                            const dist = BABYLON.Vector3.Distance(ship.mesh.position, enemy.mesh.position);
                            if (dist < minDist) {
                                minDist = dist;
                                closestEnemy = enemy;
                            }
                        }
                    });
                    ship.target = closestEnemy;
                }

                // AI Pathing, Flight Mechanics and Evasion Coordinates
                let desiredVelocity = BABYLON.Vector3.Zero();

                if (ship.target) {
                    const targetPos = ship.target.mesh.position;
                    const toTarget = targetPos.subtract(ship.mesh.position);
                    const distance = toTarget.length();

                    // Strategic optimal weapons distance range threshold tracking
                    if (distance > 60) {
                        desiredVelocity = toTarget.normalize().scale(25); // Advance
                    } else if (distance < 25) {
                        desiredVelocity = toTarget.normalize().scale(-20); // Disengage / Evade
                    } else {
                        // Strafe maneuvering patterns around target orbits
                        const tangent = BABYLON.Vector3.Cross(toTarget, BABYLON.Vector3.Up()).normalize();
                        desiredVelocity = tangent.scale(18).add(toTarget.normalize().scale(5));
                    }
                } else {
                    // Fleet victory celebration orbit paths
                    desiredVelocity = new BABYLON.Vector3(Math.sin(now*0.001)*10, 0, Math.cos(now*0.001)*10);
                }

                // Enforce containment boundaries within theater airspace zones
                if (ship.mesh.position.length() > ARENA_SIZE) {
                    const returnDir = ship.mesh.position.scale(-1).normalize();
                    desiredVelocity = returnDir.scale(30);
                }

                // Interpolated steering physics logic mechanics
                const steer = desiredVelocity.subtract(ship.velocity);
                ship.velocity.addInPlace(steer.scale(dt * 1.5));
                
                // Enforce structural thrust caps
                const speedCap = ship.isFlagship ? 18 : 32;
                if (ship.velocity.length() > speedCap) {
                    ship.velocity.normalize().scaleInPlace(speedCap);
                }

                ship.mesh.position.addInPlace(ship.velocity.scale(dt));

                // Fluid rotation alignment matrices tracking vector movement velocities
                if (ship.velocity.lengthSquared() > 0.01) {
                    const currentRotation = ship.mesh.rotationQuaternion || BABYLON.Quaternion.RotationYawPitchRoll(ship.mesh.rotation.y, ship.mesh.rotation.x, ship.mesh.rotation.z);
                    const targetRotation = BABYLON.Quaternion.LookRotationWindowCamera(ship.velocity, BABYLON.Vector3.Up());
                    
                    ship.mesh.rotationQuaternion = BABYLON.Quaternion.Slerp(currentRotation, targetRotation, dt * 3.0);
                }

                // Standardized Weapons Fire Matrix intervals
                ship.lastFired += dt;
                if (ship.target && ship.lastFired >= 3.0) {
                    const targetPos = ship.target.mesh.position;
                    if (BABYLON.Vector3.Distance(ship.mesh.position, targetPos) < 130) {
                        fireLaser(ship.mesh.position, targetPos, ship.color, ship.isFlagship);
                        ship.lastFired = 0;
                    }
                }
            });

            // Laser Updates & Collision Physics Matrix checks
            for (let i = lasers.length - 1; i >= 0; i--) {
                const laser = lasers[i];
                laser.mesh.position.addInPlace(laser.direction.scale(laser.speed * dt));

                let impact = false;

                // Test geometric bounds ray intersections across opposing faction targets
                for (let j = 0; j < activeShips.length; j++) {
                    const ship = activeShips[j];
                    // Skip friendly units
                    if (ship.color.equals(laser.mesh.material.diffuseColor)) continue;

                    if (laser.mesh.intersectsMesh(ship.mesh, false)) {
                        damageShip(ship, laser.damage);
                        impact = true;
                        break;
                    }
                }

                // Boundary cleanup lifecycle rules
                if (impact || now - laser.birth > 2500) {
                    laser.trail.stop();
                    // Delink dependencies prior to immediate object cleanups
                    const tMesh = laser.trail.emitter;
                    setTimeout(() => { if(tMesh) tMesh.dispose(); }, 400); 
                    laser.mesh.dispose();
                    lasers.splice(i, 1);
                }
            }

            // Continuous Realtime Animation Processing Arrays (Explosions/Debris Tracking)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                const age = now - p.birth;

                if (age > p.duration) {
                    p.mesh.dispose();
                    p.debris.forEach(d => d.mesh.dispose());
                    particles.splice(i, 1);
                } else {
                    // Scaling Outward Expanding Thermal Shockwaves
                    const progress = age / p.duration;
                    p.currentScale = BABYLON.Scalar.Lerp(2, p.maxScale, progress);
                    p.mesh.scaling.setAll(p.currentScale);
                    if(p.mesh.material) {
                        p.mesh.material.alpha = 1.0 - progress;
                    }

                    // Vector translations mapping mechanical field scrap
                    p.debris.forEach(d => {
                        d.mesh.position.addInPlace(d.vel.scale(dt));
                        d.mesh.rotation.addInPlace(d.rot.scale(dt));
                        // Decaying kinetic energy resistance simulation
                        d.vel.scaleInPlace(0.96); 
                    });
                }
            }

            scene.render();
        });

        // Dynamic adaptive canvas scaling rules listener
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
