<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Battle - Fleet Engagement</title>
    <style>
        :root {
            --bg: #000010;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #hud {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
            pointer-events: none;
        }
        .fleet-status {
            background: rgba(0, 0, 20, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 18px;
            color: #ddd;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.04em;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            text-align: center;
        }
        .fleet-blue {
            border-color: rgba(70, 140, 255, 0.6);
            text-shadow: 0 0 12px rgba(70, 140, 255, 0.6);
        }
        .fleet-red {
            border-color: rgba(255, 70, 70, 0.6);
            text-shadow: 0 0 12px rgba(255, 70, 70, 0.6);
        }
        .fleet-label {
            font-size: 10px;
            opacity: 0.8;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .fleet-count {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud">
        <div class="fleet-status fleet-blue">
            <div class="fleet-label">🔵 Blue Fleet</div>
            <div class="fleet-count" id="blue-count">10</div>
        </div>
        <div class="fleet-status fleet-red">
            <div class="fleet-label">🔴 Red Fleet</div>
            <div class="fleet-count" id="red-count">10</div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js">
    </script>
    <script>
        (function() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: false,
                stencil: true,
                antialias: true
            });
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.04, 1.0);

            // ────────────────────────────────────────
            // CAMERA
            // ────────────────────────────────────────
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 3, Math.PI / 3.5, 70, new BABYLON.Vector3(
                0, 3, 0), scene);
            camera.lowerRadiusLimit = 25;
            camera.upperRadiusLimit = 160;
            camera.lowerBetaLimit = 0.2;
            camera.upperBetaLimit = 1.4;
            camera.panningSensibility = 500;
            camera.wheelPrecision = 35;
            camera.attachControl(canvas, true);
            camera.target = new BABYLON.Vector3(0, 2, 0);

            // ────────────────────────────────────────
            // LIGHTING
            // ────────────────────────────────────────
            const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0.3, 1, 0.2), scene);
            ambientLight.intensity = 0.35;
            ambientLight.diffuse = new BABYLON.Color3(0.4, 0.45, 0.55);
            ambientLight.groundColor = new BABYLON.Color3(0.03, 0.03, 0.08);

            const directionalLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.4, -0.7, -0.3), scene);
            directionalLight.intensity = 0.55;
            directionalLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

            // ────────────────────────────────────────
            // STARFIELD & NEBULA
            // ────────────────────────────────────────
            const starCount = 900;
            const starData = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                starData[i * 3] = (Math.random() - 0.5) * 200;
                starData[i * 3 + 1] = (Math.random() - 0.5) * 100;
                starData[i * 3 + 2] = (Math.random() - 0.5) * 200;
            }
            const starPCS = new BABYLON.PointsCloudSystem("stars", 1, scene);
            starPCS.addPoints(starCount, (p, i) => {
                p.position = new BABYLON.Vector3(starData[i * 3], starData[i * 3 + 1], starData[i * 3 + 2]);
                p.color = new BABYLON.Color4(0.8 + Math.random() * 0.2, 0.82 + Math.random() * 0.18, 0.85 + Math
                    .random() * 0.15, 0.6 + Math.random() * 0.4);
            });
            starPCS.buildMeshAsync().then(m => {
                const mat = new BABYLON.StandardMaterial("starMat", scene);
                mat.emissiveColor = new BABYLON.Color3(1, 1, 1);
                mat.disableLighting = true;
                mat.pointsCloud = true;
                mat.pointSize = 0.28;
                m.material = mat;
            });

            // Nebula rings
            for (let n = 0; n < 3; n++) {
                const nebula = BABYLON.MeshBuilder.CreateTorus("nebula" + n, {
                    diameter: 45 + n * 25,
                    thickness: 2.5 + n * 2,
                    tessellation: 48,
                }, scene);
                nebula.position.y = -10 - n * 4;
                nebula.rotation.x = Math.PI / 2 + (n - 1) * 0.35;
                const nebMat = new BABYLON.StandardMaterial("nebMat" + n, scene);
                nebMat.emissiveColor = new BABYLON.Color3(0.06, 0.03, 0.18 + n * 0.08);
                nebMat.alpha = 0.12;
                nebMat.disableLighting = true;
                nebula.material = nebMat;
            }

            // ────────────────────────────────────────
            // MATERIALS
            // ────────────────────────────────────────
            function createGlowMat(name, hex, alpha = 1) {
                const m = new BABYLON.StandardMaterial(name, scene);
                m.emissiveColor = BABYLON.Color3.FromHexString(hex);
                m.diffuseColor = BABYLON.Color3.FromHexString(hex);
                m.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                m.roughness = 0.35;
                m.alpha = alpha;
                return m;
            }
            const hullBlue = new BABYLON.StandardMaterial("hullBlue", scene);
            hullBlue.diffuseColor = new BABYLON.Color3(0.45, 0.5, 0.6);
            hullBlue.specularColor = new BABYLON.Color3(0.3, 0.35, 0.45);
            hullBlue.roughness = 0.55;
            const accentBlue = createGlowMat("accentBlue", "#4488cc");

            const hullRed = new BABYLON.StandardMaterial("hullRed", scene);
            hullRed.diffuseColor = new BABYLON.Color3(0.55, 0.42, 0.4);
            hullRed.specularColor = new BABYLON.Color3(0.4, 0.28, 0.25);
            hullRed.roughness = 0.55;
            const accentRed = createGlowMat("accentRed", "#cc5544");

            const grayMat = new BABYLON.StandardMaterial("gray", scene);
            grayMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.52);
            grayMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            grayMat.roughness = 0.6;

            const projBlueMat = createGlowMat("projBlue", "#0088ff");
            const projRedMat = createGlowMat("projRed", "#ff3300");
            const trailBlueMat = createGlowMat("trailBlue", "#3399ff", 0.7);
            const trailRedMat = createGlowMat("trailRed", "#ff5533", 0.7);

            // ────────────────────────────────────────
            // SHIP CREATION
            // ────────────────────────────────────────
            function createEscortShip(fleetIndex) {
                const root = new BABYLON.TransformNode("escortRoot", scene);
                const hullMat = fleetIndex === 0 ? hullBlue : hullRed;
                const accentMat = fleetIndex === 0 ? accentBlue : accentRed;
                const engineColor = fleetIndex === 0 ? new BABYLON.Color3(0.2, 0.5, 1) : new BABYLON.Color3(1, 0.3,
                0.2);

                // Main body
                const body = BABYLON.MeshBuilder.CreateBox("body", { width: 1.2, height: 0.6, depth: 3.5 }, scene);
                body.parent = root;
                body.position.y = 0;
                body.material = hullMat;
                body.receiveShadows = true;

                // Cockpit
                const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", { diameter: 0.7, segments: 8 }, scene);
                cockpit.parent = root;
                cockpit.position.set(0, 0.3, 1.0);
                cockpit.scaling.set(0.8, 0.5, 0.6);
                cockpit.material = accentMat;

                // Wings
                for (let s = -1; s <= 1; s += 2) {
                    const wing = BABYLON.MeshBuilder.CreateBox("wing", { width: 2.8, height: 0.1, depth: 1.0 },
                    scene);
                    wing.parent = root;
                    wing.position.set(s * 1.6, -0.15, -0.2);
                    wing.rotation.z = s * 0.15;
                    wing.material = hullMat;
                    wing.receiveShadows = true;
                }

                // Engine pods
                const engineGlowMat = new BABYLON.StandardMaterial("engineGlow", scene);
                engineGlowMat.emissiveColor = engineColor;
                engineGlowMat.diffuseColor = engineColor;
                engineGlowMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                engineGlowMat.roughness = 0.2;

                for (let s = -1; s <= 1; s += 2) {
                    const enginePod = BABYLON.MeshBuilder.CreateCylinder("engine", {
                        diameterTop: 0.2,
                        diameterBottom: 0.3,
                        height: 1.0,
                        tessellation: 8,
                    }, scene);
                    enginePod.parent = root;
                    enginePod.position.set(s * 0.7, -0.1, -1.8);
                    enginePod.rotation.x = Math.PI / 2;
                    enginePod.material = grayMat;

                    const glow = BABYLON.MeshBuilder.CreateSphere("glow", { diameter: 0.35, segments: 6 }, scene);
                    glow.parent = root;
                    glow.position.set(s * 0.7, -0.1, -2.35);
                    glow.material = engineGlowMat;
                }

                // Engine point light
                const engineLight = new BABYLON.PointLight("engineLight", new BABYLON.Vector3(0, -0.1, -2.2), scene);
                engineLight.parent = root;
                engineLight.diffuse = engineColor;
                engineLight.intensity = 0.5;
                engineLight.range = 8;
                root._engineLight = engineLight;

                return { root, engineLight, isFlagship: false, size: 2.5 };
            }

            function createFlagship(fleetIndex) {
                const root = new BABYLON.TransformNode("flagshipRoot", scene);
                const hullMat = fleetIndex === 0 ? hullBlue : hullRed;
                const accentMat = fleetIndex === 0 ? accentBlue : accentRed;
                const engineColor = fleetIndex === 0 ? new BABYLON.Color3(0.15, 0.4, 1) : new BABYLON.Color3(1, 0.2,
                0.1);

                // Main hull
                const mainHull = BABYLON.MeshBuilder.CreateBox("mainHull", { width: 3.5, height: 1.2, depth: 8 },
                scene);
                mainHull.parent = root;
                mainHull.position.y = 0;
                mainHull.material = hullMat;
                mainHull.receiveShadows = true;

                // Command bridge
                const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 1.8, height: 1.0, depth: 2.0 }, scene);
                bridge.parent = root;
                bridge.position.set(0, 0.8, 1.5);
                bridge.material = accentMat;
                bridge.receiveShadows = true;

                // Side pods
                for (let s = -1; s <= 1; s += 2) {
                    const pod = BABYLON.MeshBuilder.CreateCylinder("sidePod", {
                        diameterTop: 0.7,
                        diameterBottom: 0.9,
                        height: 3.5,
                        tessellation: 12,
                    }, scene);
                    pod.parent = root;
                    pod.position.set(s * 2.2, -0.3, -0.5);
                    pod.rotation.x = Math.PI / 2;
                    pod.material = hullMat;
                    pod.receiveShadows = true;
                }

                // Engine nacelles
                const engineGlowMat = new BABYLON.StandardMaterial("flagEngineGlow", scene);
                engineGlowMat.emissiveColor = engineColor;
                engineGlowMat.diffuseColor = engineColor;
                engineGlowMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                engineGlowMat.roughness = 0.15;

                const engineLights = [];
                for (let s = -1; s <= 1; s++) {
                    const nacelle = BABYLON.MeshBuilder.CreateCylinder("nacelle", {
                        diameterTop: 0.4,
                        diameterBottom: 0.6,
                        height: 2.0,
                        tessellation: 10,
                    }, scene);
                    nacelle.parent = root;
                    nacelle.position.set(s * 1.5, -0.2, -4.2);
                    nacelle.rotation.x = Math.PI / 2;
                    nacelle.material = grayMat;

                    const glow = BABYLON.MeshBuilder.CreateSphere("glowLg", { diameter: 0.7, segments: 8 }, scene);
                    glow.parent = root;
                    glow.position.set(s * 1.5, -0.2, -5.3);
                    glow.material = engineGlowMat;

                    const el = new BABYLON.PointLight("flagEngLight", new BABYLON.Vector3(s * 1.5, -0.2, -5.3),
                    scene);
                    el.parent = root;
                    el.diffuse = engineColor;
                    el.intensity = 0.7;
                    el.range = 14;
                    engineLights.push(el);
                }

                // Turrets
                for (let t = 0; t < 2; t++) {
                    const turret = BABYLON.MeshBuilder.CreateCylinder("turret", {
                        diameterTop: 0.15,
                        diameterBottom: 0.3,
                        height: 0.7,
                        tessellation: 8,
                    }, scene);
                    turret.parent = root;
                    turret.position.set((t - 0.5) * 1.6, 0.85, 0.5);
                    turret.material = grayMat;
                }

                root._engineLights = engineLights;
                return { root, engineLights, isFlagship: true, size: 5.5 };
            }

            // ────────────────────────────────────────
            // HEALTH BAR
            // ────────────────────────────────────────
            function createHealthBar(parent, yOffset) {
                const barRoot = new BABYLON.TransformNode("healthBarRoot", scene);
                barRoot.parent = parent;
                barRoot.position.y = yOffset;
                barRoot.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

                const bg = BABYLON.MeshBuilder.CreateBox("hpBg", { width: 2.5, height: 0.22, depth: 0.05 }, scene);
                bg.parent = barRoot;
                bg.material = new BABYLON.StandardMaterial("hpBgMat", scene);
                bg.material.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);
                bg.material.emissiveColor = new BABYLON.Color3(0.05, 0.05, 0.05);

                const fg = BABYLON.MeshBuilder.CreateBox("hpFg", { width: 2.4, height: 0.16, depth: 0.06 }, scene);
                fg.parent = barRoot;
                fg.position.z = 0.02;
                const fgMat = new BABYLON.StandardMaterial("hpFgMat", scene);
                fgMat.emissiveColor = new BABYLON.Color3(0, 1, 0);
                fgMat.diffuseColor = new BABYLON.Color3(0, 0.8, 0);
                fgMat.specularColor = new BABYLON.Color3(0, 0, 0);
                fg.material = fgMat;
                fg.scaling.x = 1;

                return { root: barRoot, fg, fgMat, bg };
            }

            function updateHealthBar(hpBar, health, maxHealth) {
                const ratio = Math.max(0, health / maxHealth);
                hpBar.fg.scaling.x = ratio;
                hpBar.fg.position.x = -(1 - ratio) * 1.2;
                if (ratio > 0.5) {
                    hpBar.fgMat.emissiveColor = new BABYLON.Color3(0, 1, 0);
                    hpBar.fgMat.diffuseColor = new BABYLON.Color3(0, 0.8, 0);
                } else if (ratio > 0.25) {
                    hpBar.fgMat.emissiveColor = new BABYLON.Color3(1, 0.7, 0);
                    hpBar.fgMat.diffuseColor = new BABYLON.Color3(0.9, 0.55, 0);
                } else {
                    hpBar.fgMat.emissiveColor = new BABYLON.Color3(1, 0.1, 0);
                    hpBar.fgMat.diffuseColor = new BABYLON.Color3(0.8, 0.05, 0);
                }
            }

            // ────────────────────────────────────────
            // GAME STATE
            // ────────────────────────────────────────
            const allShips = [];
            const projectiles = [];
            const explosions = [];
            const debrisPieces = [];
            const chainExplosionQueue = [];
            let battleActive = true;

            // ────────────────────────────────────────
            // CREATE FLEETS
            // ────────────────────────────────────────
            function createFleet(fleetIndex, startX, startZ, facingAngle) {
                const ships = [];
                // Flagship at center
                const flagship = createFlagship(fleetIndex);
                flagship.root.position.set(startX, 0, startZ);
                flagship.root.rotation.y = facingAngle;
                flagship.fleetIndex = fleetIndex;
                flagship.health = 350;
                flagship.maxHealth = 350;
                flagship.fireCooldown = Math.random() * 3;
                flagship.alive = true;
                flagship.hpBar = createHealthBar(flagship.root, fleetIndex === 0 ? 6 : 6.5);
                flagship.velocity = new BABYLON.Vector3(0, 0, 0);
                flagship.targetEnemy = null;
                flagship.formationOffset = new BABYLON.Vector3(0, 0, 0);
                allShips.push(flagship);
                ships.push(flagship);

                // 9 escort ships in 3x3 formation around flagship
                const offsets = [
                    [-5, -5],
                    [0, -5],
                    [5, -5],
                    [-5, 0],
                    [5, 0],
                    [-5, 5],
                    [0, 5],
                    [5, 5],
                    [-2, -7]
                ];
                for (let i = 0; i < 9; i++) {
                    const escort = createEscortShip(fleetIndex);
                    const ox = offsets[i][0];
                    const oz = offsets[i][1];
                    escort.root.position.set(startX + ox, (Math.random() - 0.5) * 1.5, startZ + oz);
                    escort.root.rotation.y = facingAngle + (Math.random() - 0.5) * 0.3;
                    escort.fleetIndex = fleetIndex;
                    escort.health = 100;
                    escort.maxHealth = 100;
                    escort.fireCooldown = Math.random() * 3;
                    escort.alive = true;
                    escort.hpBar = createHealthBar(escort.root, 3.5);
                    escort.velocity = new BABYLON.Vector3(0, 0, 0);
                    escort.targetEnemy = null;
                    escort.formationOffset = new BABYLON.Vector3(ox, 0, oz);
                    allShips.push(escort);
                    ships.push(escort);
                }
                return ships;
            }

            const fleetBlue = createFleet(0, -35, 0, Math.PI / 2);
            const fleetRed = createFleet(1, 35, 0, -Math.PI / 2);

            function getAliveShips(fleetIndex) {
                return allShips.filter(s => s.alive && s.fleetIndex === fleetIndex);
            }

            function getAliveEnemies(fleetIndex) {
                return allShips.filter(s => s.alive && s.fleetIndex !== fleetIndex);
            }

            function findNearestEnemy(ship) {
                const enemies = getAliveEnemies(ship.fleetIndex);
                if (enemies.length === 0) return null;
                let nearest = enemies[0];
                let minDist = BABYLON.Vector3.Distance(ship.root.position, nearest.root.position);
                for (let i = 1; i < enemies.length; i++) {
                    const d = BABYLON.Vector3.Distance(ship.root.position, enemies[i].root.position);
                    if (d < minDist) { minDist = d;
                        nearest = enemies[i]; }
                }
                return nearest;
            }

            function getForward(ship) {
                const matrix = ship.root.getWorldMatrix();
                const forward = new BABYLON.Vector3(matrix.m[8], matrix.m[9], matrix.m[10]);
                forward.normalize();
                return forward;
            }

            // ────────────────────────────────────────
            // PROJECTILE SYSTEM
            // ────────────────────────────────────────
            function fireProjectile(ship, target) {
                const fleetIndex = ship.fleetIndex;
                const mat = fleetIndex === 0 ? projBlueMat : projRedMat;
                const trailMat = fleetIndex === 0 ? trailBlueMat : trailRedMat;
                const glowColor = fleetIndex === 0 ? new BABYLON.Color3(0.2, 0.5, 1) : new BABYLON.Color3(1, 0.3, 0.2);

                const spawnPos = ship.root.position.clone();
                const forward = getForward(ship);
                spawnPos.addInPlace(forward.scale(ship.isFlagship ? 4.5 : 2.2));
                spawnPos.y += 0.3;

                const dir = target.root.position.subtract(spawnPos).normalize();
                if (dir.length() < 0.01) return;

                const projRoot = new BABYLON.TransformNode("projRoot", scene);
                projRoot.position.copyFrom(spawnPos);

                const core = BABYLON.MeshBuilder.CreateSphere("projCore", { diameter: 0.25, segments: 6 }, scene);
                core.parent = projRoot;
                core.material = mat;

                const glow = BABYLON.MeshBuilder.CreateSphere("projGlow", { diameter: 0.55, segments: 6 }, scene);
                glow.parent = projRoot;
                const glowMat = new BABYLON.StandardMaterial("projGlowMat", scene);
                glowMat.emissiveColor = glowColor;
                glowMat.diffuseColor = glowColor;
                glowMat.alpha = 0.5;
                glowMat.specularColor = new BABYLON.Color3(0, 0, 0);
                glow.material = glowMat;

                const trailParticles = [];
                const projData = {
                    root: projRoot,
                    core,
                    glow,
                    glowMat,
                    velocity: dir.scale(28),
                    damage: ship.isFlagship ? 18 : 10,
                    fleetIndex,
                    lifetime: 5,
                    trailParticles,
                    trailMat,
                    glowColor,
                };
                projectiles.push(projData);
            }

            function addTrailParticle(projData) {
                const p = BABYLON.MeshBuilder.CreateSphere("trail", { diameter: 0.18, segments: 4 }, scene);
                p.position.copyFrom(projData.root.position);
                p.material = projData.trailMat;
                p._life = 0.45;
                projData.trailParticles.push(p);
            }

            // ────────────────────────────────────────
            // EXPLOSION SYSTEM
            // ────────────────────────────────────────
            function triggerExplosion(ship, delay = 0) {
                if (!ship.alive) return;
                ship.alive = false;
                ship.root.setEnabled(false);

                const pos = ship.root.position.clone();
                const isFlagship = ship.isFlagship;
                const radius = isFlagship ? 7 : 4;
                const intensity = isFlagship ? 1.5 : 0.8;

                // Shockwave sphere
                const shockwave = BABYLON.MeshBuilder.CreateSphere("shockwave", { diameter: 1, segments: 12 }, scene);
                shockwave.position.copyFrom(pos);
                const swMat = new BABYLON.StandardMaterial("swMat", scene);
                swMat.emissiveColor = new BABYLON.Color3(1, 0.7, 0.3);
                swMat.diffuseColor = new BABYLON.Color3(1, 0.5, 0.2);
                swMat.alpha = 0.9;
                swMat.specularColor = new BABYLON.Color3(0, 0, 0);
                shockwave.material = swMat;
                const swData = { mesh: shockwave, mat: swMat, life: 0.7, maxLife: 0.7, targetScale: radius * 2.5 };

                // Flash light
                const flashLight = new BABYLON.PointLight("flashLight", pos.clone(), scene);
                flashLight.diffuse = new BABYLON.Color3(1, 0.6, 0.25);
                flashLight.intensity = intensity * 8;
                flashLight.range = radius * 6;
                flashLight._life = 0.4;

                // Sparks
                const sparkCount = isFlagship ? 40 : 22;
                const sparks = [];
                for (let i = 0; i < sparkCount; i++) {
                    const spark = BABYLON.MeshBuilder.CreateSphere("spark", {
                        diameter: 0.1 + Math.random() * 0.4,
                        segments: 4
                    }, scene);
                    spark.position.copyFrom(pos);
                    const sMat = new BABYLON.StandardMaterial("sparkMat", scene);
                    sMat.emissiveColor = new BABYLON.Color3(1, 0.4 + Math.random() * 0.5, 0.05 + Math.random() *
                    0.3);
                    sMat.diffuseColor = sMat.emissiveColor.clone();
                    sMat.specularColor = new BABYLON.Color3(0, 0, 0);
                    spark.material = sMat;
                    const sv = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 25 * intensity,
                        Math.random() * 15 * intensity + 3,
                        (Math.random() - 0.5) * 25 * intensity
                    );
                    sparks.push({ mesh: spark, mat: sMat, velocity: sv, life: 0.5 + Math.random() * 0.8 });
                }

                // Debris chunks
                const debrisCount = isFlagship ? 18 : 8;
                for (let i = 0; i < debrisCount; i++) {
                    const chunk = BABYLON.MeshBuilder.CreateBox("debris", {
                        width: 0.2 + Math.random() * 0.8,
                        height: 0.2 + Math.random() * 0.6,
                        depth: 0.2 + Math.random() * 0.7,
                    }, scene);
                    chunk.position.copyFrom(pos);
                    chunk.material = grayMat;
                    chunk.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                    const dv = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 18,
                        Math.random() * 10 + 3,
                        (Math.random() - 0.5) * 18
                    );
                    debrisPieces.push({ mesh: chunk, velocity: dv, life: 1.5 + Math.random() * 2, rotSpeed: new BABYLON
                            .Vector3(Math.random() * 5, Math.random() * 5, Math.random() * 5) });
                }

                explosions.push({ shockwave: swData, flashLight, sparks, life: 0 });

                // Chain reaction check
                setTimeout(() => {
                    for (const other of allShips) {
                        if (!other.alive || other === ship) continue;
                        const dist = BABYLON.Vector3.Distance(pos, other.root.position);
                        if (dist < radius + 1) {
                            if (!chainExplosionQueue.includes(other)) {
                                chainExplosionQueue.push(other);
                                triggerExplosion(other, 200 + Math.random() * 300);
                            }
                        }
                    }
                }, delay + 150);

                updateHUD();
            }

            function updateHUD() {
                const blueAlive = getAliveShips(0).length;
                const redAlive = getAliveShips(1).length;
                document.getElementById('blue-count').textContent = blueAlive;
                document.getElementById('red-count').textContent = redAlive;
                if (blueAlive === 0 || redAlive === 0) {
                    battleActive = false;
                }
            }

            // ────────────────────────────────────────
            // AI MOVEMENT
            // ────────────────────────────────────────
            function updateShipAI(ship, dt) {
                if (!ship.alive) return;
                const enemy = findNearestEnemy(ship);
                ship.targetEnemy = enemy;
                if (!enemy) return;

                const toEnemy = enemy.root.position.subtract(ship.root.position);
                const dist = toEnemy.length();
                const dir = dist > 0.01 ? toEnemy.normalize() : new BABYLON.Vector3(0, 0, 1);

                // Desired distance from enemy
                const desiredDist = ship.isFlagship ? 18 : 14;
                let desiredSpeed = ship.isFlagship ? 6 : 10;
                if (dist < desiredDist * 0.6) desiredSpeed *= -0.5;
                else if (dist < desiredDist) desiredSpeed *= 0.4;

                // Separation from allies
                const separation = new BABYLON.Vector3(0, 0, 0);
                const allies = getAliveShips(ship.fleetIndex);
                for (const ally of allies) {
                    if (ally === ship || !ally.alive) continue;
                    const d = BABYLON.Vector3.Distance(ship.root.position, ally.root.position);
                    if (d < 5 && d > 0.01) {
                        const away = ship.root.position.subtract(ally.root.position).normalize();
                        separation.addInPlace(away.scale(3 / d));
                    }
                }

                const moveDir = dir.add(separation).normalize();
                const targetVel = moveDir.scale(desiredSpeed);
                const lerpF = 1 - Math.exp(-2.5 * dt);
                ship.velocity.x += (targetVel.x - ship.velocity.x) * lerpF;
                ship.velocity.y += (targetVel.y - ship.velocity.y) * lerpF;
                ship.velocity.z += (targetVel.z - ship.velocity.z) * lerpF;

                // Clamp speed
                const maxSpeed = ship.isFlagship ? 8 : 14;
                const spd = ship.velocity.length();
                if (spd > maxSpeed) ship.velocity.scaleInPlace(maxSpeed / spd);

                ship.root.position.addInPlace(ship.velocity.scale(dt));

                // Turn toward movement direction
                if (ship.velocity.length() > 0.5) {
                    const facing = ship.velocity.clone().normalize();
                    const targetYaw = Math.atan2(facing.x, facing.z);
                    const currentYaw = ship.root.rotation.y;
                    let diff = targetYaw - currentYaw;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    ship.root.rotation.y += diff * Math.min(1, 3 * dt);
                }
                ship.root.rotation.z += (0 - ship.root.rotation.z) * 2 * dt;
                ship.root.rotation.x += (0 - ship.root.rotation.x) * 2 * dt;

                // Boundary
                const pos = ship.root.position;
                const bound = 55;
                if (Math.abs(pos.x) > bound) ship.velocity.x -= Math.sign(pos.x) * 3 * dt;
                if (Math.abs(pos.y) > 25) ship.velocity.y -= Math.sign(pos.y) * 3 * dt;
                if (Math.abs(pos.z) > bound) ship.velocity.z -= Math.sign(pos.z) * 3 * dt;
            }

            // ────────────────────────────────────────
            // GAME LOOP
            // ────────────────────────────────────────
            let trailTimer = 0;
            scene.registerBeforeRender(() => {
                const dt = Math.min(engine.getDeltaTime() / 1000, 0.15);
                if (!battleActive && allShips.filter(s => s.alive).length <= 1) {
                    // Battle over, but keep rendering
                }

                // Update all alive ships
                for (const ship of allShips) {
                    if (!ship.alive) continue;
                    updateShipAI(ship, dt);

                    // Update health bar
                    updateHealthBar(ship.hpBar, ship.health, ship.maxHealth);

                    // Fire weapons
                    ship.fireCooldown -= dt;
                    if (ship.fireCooldown <= 0 && ship.targetEnemy && ship.targetEnemy.alive) {
                        const dist = BABYLON.Vector3.Distance(ship.root.position, ship.targetEnemy.root
                        .position);
                        if (dist < 50) {
                            fireProjectile(ship, ship.targetEnemy);
                            if (ship.isFlagship) {
                                // Fire second projectile slightly offset
                                setTimeout(() => {
                                    if (ship.alive && ship.targetEnemy && ship.targetEnemy.alive) {
                                        fireProjectile(ship, ship.targetEnemy);
                                    }
                                }, 150);
                            }
                        }
                        ship.fireCooldown = 2.8 + Math.random() * 0.5;
                    }
                }

                // Update projectiles
                trailTimer += dt;
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.lifetime -= dt;
                    if (p.lifetime <= 0 || !p.root || p.root.isDisposed()) {
                        p.root?.dispose();
                        for (const t of p.trailParticles) t.dispose();
                        projectiles.splice(i, 1);
                        continue;
                    }
                    p.root.position.addInPlace(p.velocity.scale(dt));

                    // Trail
                    if (trailTimer > 0.04) {
                        addTrailParticle(p);
                    }

                    // Update trail particles
                    for (let j = p.trailParticles.length - 1; j >= 0; j--) {
                        const tp = p.trailParticles[j];
                        tp._life -= dt;
                        if (tp._life <= 0) {
                            tp.dispose();
                            p.trailParticles.splice(j, 1);
                        } else {
                            tp.scaling.scaleInPlace(1 - 2.5 * dt);
                        }
                    }

                    // Collision check
                    const enemies = getAliveEnemies(p.fleetIndex);
                    for (const enemy of enemies) {
                        const d = BABYLON.Vector3.Distance(p.root.position, enemy.root.position);
                        const hitRadius = enemy.isFlagship ? 5 : 2.5;
                        if (d < hitRadius) {
                            enemy.health -= p.damage;
                            if (enemy.health <= 0 && enemy.alive) {
                                triggerExplosion(enemy, 0);
                            }
                            // Small hit spark
                            const spark = BABYLON.MeshBuilder.CreateSphere("hitSpark", { diameter: 0.4,
                                segments: 5 }, scene);
                            spark.position.copyFrom(p.root.position);
                            const sm = new BABYLON.StandardMaterial("hitSparkMat", scene);
                            sm.emissiveColor = p.glowColor;
                            sm.diffuseColor = p.glowColor;
                            sm.specularColor = new BABYLON.Color3(0, 0, 0);
                            spark.material = sm;
                            spark._life = 0.25;
                            explosions.push({
                                hitSpark: { mesh: spark, mat: sm, life: 0.25 },
                                flashLight: null,
                                sparks: [],
                                life: 0
                            });

                            p.root.dispose();
                            for (const t of p.trailParticles) t.dispose();
                            projectiles.splice(i, 1);
                            break;
                        }
                    }

                    // Out of bounds
                    const pp = p.root.position;
                    if (Math.abs(pp.x) > 60 || Math.abs(pp.y) > 35 || Math.abs(pp.z) > 60) {
                        p.root.dispose();
                        for (const t of p.trailParticles) t.dispose();
                        projectiles.splice(i, 1);
                    }
                }
                if (trailTimer > 0.04) trailTimer = 0;

                // Update explosions
                for (let i = explosions.length - 1; i >= 0; i--) {
                    const ex = explosions[i];
                    ex.life += dt;

                    // Shockwave
                    if (ex.shockwave && ex.shockwave.mesh && !ex.shockwave.mesh.isDisposed()) {
                        const sw = ex.shockwave;
                        const ratio = Math.min(1, ex.life / sw.maxLife);
                        const scale = 1 + (sw.targetScale - 1) * ratio;
                        sw.mesh.scaling.setAll(scale);
                        sw.mat.alpha = 0.9 * (1 - ratio);
                        if (ratio >= 1) {
                            sw.mesh.dispose();
                            sw.mat.dispose();
                            ex.shockwave = null;
                        }
                    }

                    // Flash light
                    if (ex.flashLight && !ex.flashLight.isDisposed()) {
                        ex.flashLight._life -= dt;
                        ex.flashLight.intensity *= Math.exp(-4 * dt);
                        if (ex.flashLight._life <= 0) {
                            ex.flashLight.dispose();
                            ex.flashLight = null;
                        }
                    }

                    // Hit spark
                    if (ex.hitSpark && ex.hitSpark.mesh && !ex.hitSpark.mesh.isDisposed()) {
                        ex.hitSpark.life -= dt;
                        ex.hitSpark.mesh.scaling.scaleInPlace(1 + 5 * dt);
                        ex.hitSpark.mat.alpha = Math.max(0, ex.hitSpark.life / 0.25);
                        if (ex.hitSpark.life <= 0) {
                            ex.hitSpark.mesh.dispose();
                            ex.hitSpark.mat.dispose();
                            ex.hitSpark = null;
                        }
                    }

                    // Sparks
                    for (let j = ex.sparks.length - 1; j >= 0; j--) {
                        const sp = ex.sparks[j];
                        sp.life -= dt;
                        if (sp.life <= 0 || !sp.mesh || sp.mesh.isDisposed()) {
                            sp.mesh?.dispose();
                            sp.mat?.dispose();
                            ex.sparks.splice(j, 1);
                        } else {
                            sp.mesh.position.addInPlace(sp.velocity.scale(dt));
                            sp.velocity.y -= 6 * dt;
                            sp.mesh.scaling.scaleInPlace(1 - 2 * dt);
                        }
                    }

                    // Clean up if all done
                    if (!ex.shockwave && !ex.flashLight && !ex.hitSpark && ex.sparks.length === 0) {
                        explosions.splice(i, 1);
                    }
                }

                // Update debris
                for (let i = debrisPieces.length - 1; i >= 0; i--) {
                    const db = debrisPieces[i];
                    db.life -= dt;
                    if (db.life <= 0 || !db.mesh || db.mesh.isDisposed()) {
                        db.mesh?.dispose();
                        debrisPieces.splice(i, 1);
                    } else {
                        db.mesh.position.addInPlace(db.velocity.scale(dt));
                        db.velocity.y -= 5 * dt;
                        db.mesh.rotation.x += db.rotSpeed.x * dt;
                        db.mesh.rotation.y += db.rotSpeed.y * dt;
                        db.mesh.rotation.z += db.rotSpeed.z * dt;
                    }
                }

                // Process chain explosion queue
                for (let i = chainExplosionQueue.length - 1; i >= 0; i--) {
                    const ship = chainExplosionQueue[i];
                    if (ship.alive) {
                        chainExplosionQueue.splice(i, 1);
                        triggerExplosion(ship, 0);
                    } else {
                        chainExplosionQueue.splice(i, 1);
                    }
                }

                // Engine light flicker
                for (const ship of allShips) {
                    if (!ship.alive) continue;
                    if (ship._engineLight && !ship._engineLight.isDisposed()) {
                        ship._engineLight.intensity = 0.4 + Math.random() * 0.3;
                    }
                    if (ship._engineLights) {
                        for (const el of ship._engineLights) {
                            if (el && !el.isDisposed()) el.intensity = 0.55 + Math.random() * 0.35;
                        }
                    }
                }

                updateHUD();
            });

            // ────────────────────────────────────────
            // RENDER LOOP
            // ────────────────────────────────────────
            engine.runRenderLoop(() => {
                scene.render();
            });

            // ────────────────────────────────────────
            // RESIZE
            // ────────────────────────────────────────
            window.addEventListener('resize', () => engine.resize());

            // ────────────────────────────────────────
            // KEYBOARD SHORTCUT
            // ────────────────────────────────────────
            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    camera.alpha = -Math.PI / 3;
                    camera.beta = Math.PI / 3.5;
                    camera.radius = 70;
                    camera.target.set(0, 2, 0);
                }
            });

            console.log('🚀 Space Battle Ready!');
            console.log('   🔵 Blue Fleet vs 🔴 Red Fleet');
            console.log('   🖱️ Drag to orbit | Scroll to zoom | Right-drag to pan | R to reset view');
            console.log('   💥 Ships explode in chain reactions when close!');
        })();
    </script>
</body>
</html>
