<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Battle</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
        #renderCanvas { width: 100%; height: 100%; outline: none; }
        #hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 10, 30, 0.8); border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px; padding: 16px; color: #fff; min-width: 250px;
            backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #hud h2 { font-size: 1.1rem; margin-bottom: 8px; color: #88ccff; }
        .stat { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 4px 0; }
        .stat span { font-weight: bold; }
        .blue { color: #4fc3f7; }
        .red { color: #ff5252; }
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; pointer-events: auto; z-index: 100;
        }
        #game-over h1 { font-size: 48px; margin-bottom: 10px; }
        #game-over button { padding: 14px 32px; font-size: 18px; cursor: pointer; margin-top: 20px; background: linear-gradient(135deg, #2196f3, #1976d2); border: none; color: #fff; border-radius: 8px; }
        #info {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: #aaa; padding: 8px 16px; border-radius: 20px;
            font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud">
        <h2>⚔️ Space Battle</h2>
        <div class="stat">🔵 Blue Fleet: <span class="blue" id="blue-count">10</span></div>
        <div class="stat">🔴 Red Fleet: <span class="red" id="red-count">10</span></div>
    </div>
    <div id="game-over">
        <h1 id="winner-text">Victory!</h1>
        <button onclick="location.reload()">⚔️ New Battle</button>
    </div>
    <div id="info">🖱️ Orbit: Left-click & drag | Zoom: Scroll | Pan: Right-click & drag</div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.02, 0.01, 0.05, 1);
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.0004;

        // Camera
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/4, Math.PI/3, 180, new BABYLON.Vector3(0, 0, 0), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 40;
        camera.upperRadiusLimit = 400;
        camera.lowerBetaLimit = 0.15;
        camera.upperBetaLimit = Math.PI/2.05;
        camera.wheelPrecision = 30;

        // Lights
        const ambient = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
        ambient.intensity = 0.15;
        ambient.groundColor = new BABYLON.Color3(0.05, 0.02, 0.1);

        const nebulaLight1 = new BABYLON.PointLight("neb1", new BABYLON.Vector3(-100, 80, -50), scene);
        nebulaLight1.intensity = 0.4;
        nebulaLight1.diffuse = new BABYLON.Color3(0.3, 0.1, 0.5);

        const nebulaLight2 = new BABYLON.PointLight("neb2", new BABYLON.Vector3(100, -60, 80), scene);
        nebulaLight2.intensity = 0.3;
        nebulaLight2.diffuse = new BABYLON.Color3(0.1, 0.2, 0.4);

        // Starfield
        const starCount = 4000;
        const stars = BABYLON.MeshBuilder.CreateSphere("stars", {diameter: 0.3, segments: 4}, scene);
        stars.material = new BABYLON.StandardMaterial("starMat", scene);
        stars.material.emissiveColor = new BABYLON.Color3(1, 1, 1);
        stars.material.disableLighting = true;
        stars.isPickable = false;
        const starInstances = [];
        for(let i=0; i<starCount; i++) {
            const inst = stars.createInstance("star_" + i);
            inst.position.set(
                (Math.random() - 0.5) * 800,
                (Math.random() - 0.5) * 800,
                (Math.random() - 0.5) * 800
            );
            const s = 0.5 + Math.random() * 1.5;
            inst.scaling.set(s, s, s);
            starInstances.push(inst);
        }

        // Nebula clouds (particle systems)
        const createNebula = (color, pos, size=80) => {
            const ps = new BABYLON.ParticleSystem("neb", 300, scene);
            ps.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
            ps.createPointEmitter(
                new BABYLON.Vector3(-size, -size/2, -size/4),
                new BABYLON.Vector3(size, size/2, size/4)
            );
            ps.color1 = new BABYLON.Color4(color.r, color.g, color.b, 0.08);
            ps.color2 = new BABYLON.Color4(color.r*0.7, color.g*0.7, color.b*0.8, 0.03);
            ps.colorDead = new BABYLON.Color4(color.r, color.g, color.b, 0);
            ps.minSize = 5; ps.maxSize = 25;
            ps.minLifeTime = 10; ps.maxLifeTime = 20;
            ps.emitRate = 8;
            ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            ps.minEmitPower = 0.1; ps.maxEmitPower = 0.3;
            ps.updateSpeed = 0.005;
            ps.emitter = pos;
            ps.start();
        };
        createNebula({r:0.4, g:0.15, b:0.5}, new BABYLON.Vector3(-60, 30, -40));
        createNebula({r:0.1, g:0.25, b:0.45}, new BABYLON.Vector3(50, -20, 60));
        createNebula({r:0.3, g:0.05, b:0.35}, new BABYLON.Vector3(0, 50, -80));

        // Game State
        const ships = [];
        const projectiles = [];
        let gameOver = false;

        // Materials
        const blueHullMat = new BABYLON.StandardMaterial("blueHull", scene);
        blueHullMat.diffuseColor = new BABYLON.Color3(0.15, 0.3, 0.6);
        blueHullMat.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.2);
        blueHullMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);

        const redHullMat = new BABYLON.StandardMaterial("redHull", scene);
        redHullMat.diffuseColor = new BABYLON.Color3(0.6, 0.15, 0.15);
        redHullMat.emissiveColor = new BABYLON.Color3(0.2, 0.05, 0.05);
        redHullMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);

        const blueFlagMat = new BABYLON.StandardMaterial("blueFlag", scene);
        blueFlagMat.diffuseColor = new BABYLON.Color3(0.2, 0.4, 0.7);
        blueFlagMat.emissiveColor = new BABYLON.Color3(0.1, 0.15, 0.25);

        const redFlagMat = new BABYLON.StandardMaterial("redFlag", scene);
        redFlagMat.diffuseColor = new BABYLON.Color3(0.7, 0.2, 0.2);
        redFlagMat.emissiveColor = new BABYLON.Color3(0.25, 0.05, 0.05);

        const engineBlue = new BABYLON.Color3(0.2, 0.6, 1.0);
        const engineRed = new BABYLON.Color3(1.0, 0.3, 0.2);

        // Ship Builder
        function createShip(isFlagship, team) {
            const group = new BABYLON.TransformNode("ship", scene);
            group.metadata = { 
                team, isFlagship, 
                hp: isFlagship ? 800 : 250, maxHp: isFlagship ? 800 : 250,
                lastFire: 0, alive: true, speed: isFlagship ? 8 : 12,
                rotSpeed: (0.8 + Math.random() * 0.5),
                target: new BABYLON.Vector3(),
                stateTimer: Math.random() * 3
            };

            if(isFlagship) {
                // Flagship: Large, multi-part
                const hull = BABYLON.MeshBuilder.CreateBox("hull", {width: 3, height: 2, depth: 12}, scene);
                hull.material = team === 0 ? blueFlagMat : redFlagMat;
                hull.parent = group;

                const bow = BABYLON.MeshBuilder.CreateBox("bow", {width: 2, height: 1.5, depth: 4}, scene);
                bow.position.z = -8;
                bow.rotation.x = 0.25;
                bow.material = team === 0 ? blueFlagMat : redFlagMat;
                bow.parent = group;

                const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {width: 2.5, height: 1.8, depth: 4}, scene);
                bridge.position.y = 1.8;
                bridge.position.z = -1;
                bridge.material = team === 0 ? blueFlagMat : redFlagMat;
                bridge.parent = group;

                const wings = BABYLON.MeshBuilder.CreateBox("wings", {width: 10, height: 0.6, depth: 5}, scene);
                wings.position.y = -0.5;
                wings.position.z = 2;
                wings.material = team === 0 ? blueHullMat : redHullMat;
                wings.parent = group;

                // Engine glow
                const eng1 = BABYLON.MeshBuilder.CreateBox("eng1", {width: 1.2, height: 0.6, depth: 1.5}, scene);
                eng1.position.set(-1, 0, 6.5);
                const eMat = new BABYLON.StandardMaterial("e", scene);
                eMat.emissiveColor = team === 0 ? engineBlue : engineRed;
                eMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                eng1.material = eMat;
                eng1.parent = group;

                const eng2 = BABYLON.MeshBuilder.CreateBox("eng2", {width: 1.2, height: 0.6, depth: 1.5}, scene);
                eng2.position.set(1, 0, 6.5);
                eng2.material = eMat.clone();
                eng2.parent = group;

                // Turrets
                for(let t=-1; t<=1; t+=2) {
                    const turret = BABYLON.MeshBuilder.CreateCylinder("turret" + t, {height: 1.5, diameterTop: 0.8, diameterBottom: 1.2}, scene);
                    turret.position.set(t*2, 1.2, 3);
                    turret.material = team === 0 ? blueHullMat : redHullMat;
                    turret.parent = group;
                }

                // Engine thruster lights
                const light1 = new BABYLON.PointLight("light1", new BABYLON.Vector3(0,0,0), scene);
                light1.intensity = 0.4;
                light1.diffuse = team === 0 ? engineBlue : engineRed;
                light1.range = 15;
                light1.position = new BABYLON.Vector3(0, 0, 8);
                light1.parent = group;

                group.metadata.size = 6; // collision radius
            } else {
                // Escort ship
                const hull = BABYLON.MeshBuilder.CreateBox("hull", {width: 1.8, height: 1.2, depth: 5}, scene);
                hull.material = team === 0 ? blueHullMat : redHullMat;
                hull.parent = group;

                const nose = BABYLON.MeshBuilder.CreateBox("nose", {width: 1.2, height: 0.8, depth: 2.5}, scene);
                nose.position.z = -3.5;
                nose.rotation.x = 0.3;
                nose.material = team === 0 ? blueHullMat : redHullMat;
                nose.parent = group;

                const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", {diameter: 1.2, segments: 8}, scene);
                cockpit.position.set(0, 0.5, -1.5);
                const cockpitMat = new BABYLON.StandardMaterial("cockpit", scene);
                cockpitMat.emissiveColor = new BABYLON.Color3(0.5, 0.7, 1.0);
                cockpitMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.5);
                cockpit.material = cockpitMat;
                cockpit.parent = group;

                const engine = BABYLON.MeshBuilder.CreateBox("engine", {width: 1.5, height: 0.4, depth: 1.2}, scene);
                engine.position.z = 3;
                const eMat = new BABYLON.StandardMaterial("e", scene);
                eMat.emissiveColor = team === 0 ? engineBlue : engineRed;
                eMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                engine.material = eMat;
                engine.parent = group;

                const light = new BABYLON.PointLight("light", new BABYLON.Vector3(0,0,0), scene);
                light.intensity = 0.25;
                light.diffuse = team === 0 ? engineBlue : engineRed;
                light.range = 10;
                light.position = new BABYLON.Vector3(0, 0, 4);
                light.parent = group;

                group.metadata.size = 3;
            }

            // Health bar
            const hbBack = BABYLON.MeshBuilder.CreatePlane("hb_back", {width: 8, height: 1.2}, scene);
            hbBack.position.y = isFlagship ? 8 : 5;
            hbBack.parent = group;
            const hbMat = new BABYLON.StandardMaterial("hb_back", scene);
            hbMat.diffuseColor = new BABYLON.Color3(0.2, 0.1, 0.1);
            hbMat.disableLighting = true;
            hbBack.material = hbMat;
            group.metadata.hbBack = hbBack;

            const hbFill = BABYLON.MeshBuilder.CreatePlane("hb_fill", {width: 7.6, height: 0.8}, scene);
            hbFill.position.set(0, 0, -0.05);
            hbFill.parent = hbBack;
            const hbFMat = new BABYLON.StandardMaterial("hb_fill", scene);
            hbFMat.diffuseColor = new BABYLON.Color3(0.1, 0.8, 0.2);
            hbFMat.emissiveColor = new BABYLON.Color3(0.05, 0.4, 0.1);
            hbFMat.disableLighting = true;
            hbFill.material = hbFMat;
            group.metadata.hbFill = hbFill;

            return group;
        }

        // Initialize Fleets
        function initFleets() {
            const offset = 60;
            
            // Blue Fleet (team 0) at -offset
            for(let i=0; i<10; i++) {
                const isFlag = i===0;
                const ship = createShip(isFlag, 0);
                
                // Formation: Flagship center, escorts in V
                if(isFlag) {
                    ship.position.set(-offset, 0, 0);
                } else {
                    const row = Math.floor((i-1)/4);
                    const col = (i-1) % 4;
                    ship.position.set(-offset - 8 - row*12, (col-1.5)*10, (col-1.5)*15);
                }
                
                ship.metadata.target = ship.position.clone().add(new BABYLON.Vector3(Math.random()*20, Math.random()*10-5, Math.random()*20-10));
                ships.push(ship);
            }

            // Red Fleet (team 1) at +offset
            for(let i=0; i<10; i++) {
                const isFlag = i===0;
                const ship = createShip(isFlag, 1);
                
                if(isFlag) {
                    ship.position.set(offset, 0, 0);
                } else {
                    const row = Math.floor((i-1)/4);
                    const col = (i-1) % 4;
                    ship.position.set(offset + 8 + row*12, (col-1.5)*10, (col-1.5)*15);
                }
                
                ship.metadata.target = ship.position.clone().add(new BABYLON.Vector3(-Math.random()*20, Math.random()*10-5, Math.random()*20-10));
                ships.push(ship);
            }
        }

        initFleets();

        // Projectile firing
        function fireProjectile(ship) {
            if(ship.metadata.alive === false) return;
            const now = performance.now()/1000;
            if(now - ship.metadata.lastFire < 3) return;
            ship.metadata.lastFire = now;

            const isFlag = ship.metadata.isFlagship;
            const team = ship.metadata.team;
            const projCount = isFlag ? 2 : 1;

            for(let p=0; p<projCount; p++) {
                const proj = BABYLON.MeshBuilder.CreateSphere("proj", {diameter: 1.2, segments: 8}, scene);
                const mat = new BABYLON.StandardMaterial("projMat", scene);
                const color = team === 0 ? new BABYLON.Color3(0.3, 0.7, 1.0) : new BABYLON.Color3(1.0, 0.3, 0.2);
                mat.diffuseColor = color;
                mat.emissiveColor = color.scale(0.8);
                mat.disableLighting = true;
                proj.material = mat;

                const light = new BABYLON.PointLight("projLight", new BABYLON.Vector3(0,0,0), scene);
                light.intensity = 0.5;
                light.diffuse = color;
                light.range = 12;
                light.parent = proj;

                // Start position
                const forward = new BABYLON.Vector3(0, 0, -1);
                const shipDir = forward.applyRotationQuaternion(ship.rotationQuaternion || new BABYLON.Quaternion.RotationYawPitchRoll(0,0,0));
                
                const offsetX = (p===0 ? -1 : 1) * (isFlag ? 2.5 : 0);
                proj.position.copyFrom(ship.position).addInPlace(shipDir.scale(4)).addInPlace(new BABYLON.Vector3(offsetX, -0.5, 0).applyRotationQuaternion(ship.rotationQuaternion || BABYLON.Quaternion.Identity()));

                proj.metadata = {
                    dir: shipDir.clone(),
                    speed: 45,
                    damage: isFlag ? 35 : 25,
                    team: team,
                    life: 6
                };

                // Trail particle system
                const trail = new BABYLON.ParticleSystem("trail", 40, scene);
                trail.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
                trail.createPointEmitter(new BABYLON.Vector3(-0.15,-0.15,-0.15), new BABYLON.Vector3(0.15,0.15,0.15));
                trail.color1 = new BABYLON.Color4(color.r, color.g, color.b, 0.7);
                trail.color2 = new BABYLON.Color4(color.r*0.6, color.g*0.6, color.b*0.8, 0.3);
                trail.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                trail.minSize = 0.3; trail.maxSize = 1.2;
                trail.minLifeTime = 0.2; trail.maxLifeTime = 0.6;
                trail.emitRate = 80;
                trail.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
                trail.minEmitPower = 0.5; trail.maxEmitPower = 2;
                trail.updateSpeed = 0.015;
                trail.emitter = proj;
                trail.start();

                proj.metadata.trail = trail;
                projectiles.push(proj);
            }
        }

        // Explosion system
        function createExplosion(pos, teamColor, radius=3) {
            const group = new BABYLON.TransformNode("exp", scene);
            group.position.copyFrom(pos);

            // 1. Fireball
            const fireball = BABYLON.MeshBuilder.CreateSphere("fire", {diameter: radius*2, segments: 12}, scene);
            const fMat = new BABYLON.StandardMaterial("fMat", scene);
            fMat.emissiveColor = new BABYLON.Color3(1, 0.6, 0.1);
            fMat.diffuseColor = new BABYLON.Color3(0.9, 0.3, 0.05);
            fireball.material = fMat;
            fireball.parent = group;

            // 2. Shockwave ring
            const shock = BABYLON.MeshBuilder.CreateTorus("shock", {diameter: radius*4, thickness: 1.5, tessellation: 32}, scene);
            const sMat = new BABYLON.StandardMaterial("sMat", scene);
            sMat.diffuseColor = new BABYLON.Color3(1, 0.9, 0.6);
            sMat.emissiveColor = new BABYLON.Color3(0.8, 0.6, 0.3);
            sMat.alpha = 0.8;
            shock.material = sMat;
            shock.parent = group;

            // 3. Sparks particle system
            const sparks = new BABYLON.ParticleSystem("sparks", 200, scene);
            sparks.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
            sparks.createPointEmitter(new BABYLON.Vector3(-1,-1,-1), new BABYLON.Vector3(1,1,1));
            sparks.color1 = new BABYLON.Color4(1, 0.8, 0.2, 1);
            sparks.color2 = new BABYLON.Color4(1, 0.4, 0.1, 0.8);
            sparks.colorDead = new BABYLON.Color4(1, 0.1, 0, 0);
            sparks.minSize = 0.3; sparks.maxSize = 1.5;
            sparks.minLifeTime = 0.3; sparks.maxLifeTime = 1.5;
            sparks.emitRate = 300;
            sparks.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            sparks.minEmitPower = 3; sparks.maxEmitPower = 12;
            sparks.gravity = new BABYLON.Vector3(0, -2, 0);
            sparks.updateSpeed = 0.012;
            sparks.emitter = group;
            sparks.start();

            // 4. Debris chunks
            const debris = [];
            for(let i=0; i<15; i++) {
                const d = BABYLON.MeshBuilder.CreateBox("d" + i, {width: 0.5+Math.random(), height: 0.3+Math.random()*0.5, depth: 0.5+Math.random()}, scene);
                d.position.copyFrom(pos);
                d.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                const dMat = new BABYLON.StandardMaterial("dMat", scene);
                dMat.emissiveColor = new BABYLON.Color3(0.4, 0.2, 0.05);
                dMat.diffuseColor = new BABYLON.Color3(0.5, 0.3, 0.2);
                d.material = dMat;
                d.metadata = {
                    vel: new BABYLON.Vector3((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15),
                    rot: new BABYLON.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).scale(10)
                };
                debris.push(d);
            }

            // 5. Explosion light
            const expLight = new BABYLON.PointLight("expLight", pos.clone(), scene);
            expLight.intensity = 4;
            expLight.diffuse = new BABYLON.Color3(1, 0.7, 0.3);
            expLight.range = 30;

            group.metadata = {
                fireball, shock, sparks, debris, expLight,
                age: 0, life: 2.5
            };

            scene.metadata = scene.metadata || { explosions: [] };
            scene.metadata.explosions.push(group);
        }

        function checkChainReaction(pos, radius) {
            ships.forEach(ship => {
                if(!ship.metadata.alive) return;
                const dist = BABYLON.Vector3.Distance(pos, ship.position);
                if(dist < radius + ship.metadata.size) {
                    ship.metadata.hp = 0;
                    destroyShip(ship);
                }
            });
        }

        function destroyShip(ship) {
            if(!ship.metadata.alive) return;
            ship.metadata.alive = false;
            
            const teamColor = ship.metadata.team === 0 ? 
                new BABYLON.Color3(0.3, 0.7, 1.0) : 
                new BABYLON.Color3(1.0, 0.3, 0.2);

            createExplosion(ship.position.clone(), teamColor, ship.metadata.isFlagship ? 5 : 3);
            
            // Dispose ship mesh
            ship.dispose();
            
            checkChainReaction(ship.position, ship.metadata.size * 2);
            updateHUD();
        }

        function updateHUD() {
            const blueAlive = ships.filter(s => s.metadata.team === 0 && s.metadata.alive).length;
            const redAlive = ships.filter(s => s.metadata.team === 1 && s.metadata.alive).length;
            document.getElementById("blue-count").textContent = blueAlive;
            document.getElementById("red-count").textContent = redAlive;

            if(!gameOver) {
                if(blueAlive === 0 || redAlive === 0) {
                    gameOver = true;
                    const winner = blueAlive > 0 ? "🔵 Blue Fleet Wins!" : "🔴 Red Fleet Wins!";
                    document.getElementById("winner-text").textContent = winner;
                    document.getElementById("game-over").style.display = "flex";
                }
            }
        }

        // Ship AI & Movement
        function updateShips(dt) {
            const now = performance.now()/1000;
            
            ships.forEach(ship => {
                if(!ship.metadata.alive) return;
                
                // Health bar update
                const pct = ship.metadata.hp / ship.metadata.maxHp;
                ship.metadata.hbFill.scaling.x = Math.max(0.01, pct);
                ship.metadata.hbFill.position.x = -(1 - pct) * 3.8;
                ship.metadata.hbFill.material.diffuseColor = 
                    pct > 0.5 ? new BABYLON.Color3(0.1, 0.8, 0.2) :
                    pct > 0.25 ? new BABYLON.Color3(0.8, 0.8, 0.1) :
                    new BABYLON.Color3(0.8, 0.1, 0.1);

                // AI: Find nearest enemy
                const team = ship.metadata.team;
                let nearest = null; let minDist = Infinity;
                ships.forEach(other => {
                    if(other.metadata.team !== team && other.metadata.alive) {
                        const d = BABYLON.Vector3.Distance(ship.position, other.position);
                        if(d < minDist) { minDist = d; nearest = other; }
                    }
                });

                if(nearest) {
                    // Face target gradually
                    const target = nearest.position.clone();
                    const current = ship.position.clone();
                    const dir = target.subtract(current).normalize();
                    
                    // Smooth rotation
                    const targetY = Math.atan2(dir.x, dir.z);
                    const diff = targetY - (ship.rotation.y || 0);
                    const normDiff = ((diff + Math.PI) % (Math.PI*2)) - Math.PI;
                    ship.rotation.y += normDiff * ship.metadata.rotSpeed * dt;
                    ship.rotation.x = 0;
                    ship.rotation.z = 0;

                    // Move forward
                    const forward = new BABYLON.Vector3(0, 0, -1);
                    const shipDir = forward.applyRotationQuaternion(ship.rotationQuaternion || new BABYLON.Quaternion());
                    
                    const speed = ship.metadata.speed * dt;
                    ship.position.x += shipDir.x * speed;
                    ship.position.y += shipDir.y * speed * 0.3; // Less vertical movement
                    ship.position.z += shipDir.z * speed;

                    // Keep in bounds
                    const bounds = 80;
                    ship.position.x = BABYLON.Scalar.Clamp(ship.position.x, -bounds, bounds);
                    ship.position.y = BABYLON.Scalar.Clamp(ship.position.y, -30, 30);
                    ship.position.z = BABYLON.Scalar.Clamp(ship.position.z, -bounds, bounds);

                    // Fire at target
                    if(minDist < 100) {
                        fireProjectile(ship);
                    }
                }
            });
        }

        function updateProjectiles(dt) {
            projectiles.forEach(proj => {
                if(!proj.metadata) return;
                proj.position.addInPlace(proj.metadata.dir.scale(proj.metadata.speed * dt));
                proj.metadata.life -= dt;

                // Check hit
                ships.forEach(ship => {
                    if(!ship.metadata.alive || ship.metadata.team === proj.metadata.team) return;
                    const dist = BABYLON.Vector3.Distance(proj.position, ship.position);
                    if(dist < ship.metadata.size + 1) {
                        ship.metadata.hp -= proj.metadata.damage;
                        proj.metadata.life = 0;
                        if(proj.metadata.trail) proj.metadata.trail.stop();
                        if(ship.metadata.hp <= 0) destroyShip(ship);
                    }
                });

                if(proj.metadata.life <= 0) {
                    if(proj.metadata.trail) {
                        proj.metadata.trail.stop();
                        proj.metadata.trail.dispose();
                    }
                    proj.dispose();
                }
            });
            
            // Clean up
            for(let i = projectiles.length - 1; i >= 0; i--) {
                if(projectiles[i].metadata && projectiles[i].metadata.life <= 0) {
                    projectiles.splice(i, 1);
                }
            }
        }

        function updateExplosions(dt) {
            if(!scene.metadata || !scene.metadata.explosions) return;
            
            for(let i = scene.metadata.explosions.length - 1; i >= 0; i--) {
                const exp = scene.metadata.explosions[i];
                exp.metadata.age += dt;
                const t = exp.metadata.age / exp.metadata.life;
                
                if(t >= 1) {
                    exp.dispose();
                    scene.metadata.explosions.splice(i, 1);
                    continue;
                }
                
                // Animate fireball
                exp.metadata.fireball.scaling.setScalar(1 + t * 0.5);
                exp.metadata.fireball.material.alpha = 1 - t;
                
                // Animate shockwave
                exp.metadata.shock.scaling.set(1 + t * 2, 1 + t * 2, 1);
                exp.metadata.shock.material.alpha = 0.8 * (1 - t);
                
                // Light fade
                exp.metadata.expLight.intensity = 4 * (1 - t);
                
                // Debris physics
                exp.metadata.debris.forEach(d => {
                    d.position.addInPlace(d.metadata.vel.clone().scale(dt));
                    d.rotation.x += d.metadata.rot.x * dt;
                    d.rotation.y += d.metadata.rot.y * dt;
                    d.rotation.z += d.metadata.rot.z * dt;
                    d.material.emissiveColor.scaleInPlace(0.95);
                });
            }
        }

        // Main loop
        engine.runRenderLoop(() => {
            const dt = Math.min(engine.getDeltaTime()/1000, 0.05);
            updateShips(dt);
            updateProjectiles(dt);
            updateExplosions(dt);
            scene.render();
        });

        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
