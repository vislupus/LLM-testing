<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Battle - Babylon.js</title>
<style>
    body { margin: 0; overflow: hidden; background: #000; }
    #renderCanvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

const createScene = function () {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.02, 0.02, 0.05);

    // Camera
    const camera = new BABYLON.ArcRotateCamera("camera", 
        BABYLON.Tools.ToRadians(90), 
        BABYLON.Tools.ToRadians(60), 
        180, 
        new BABYLON.Vector3(0, 0, 0), 
        scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 30;
    camera.upperRadiusLimit = 400;
    camera.wheelDeltaPercentage = 0.005;

    // Lighting
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.3;
    hemi.diffuse = new BABYLON.Color3(0.6, 0.7, 0.9);

    const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
    dirLight.intensity = 0.8;
    dirLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

    // Starfield
    const stars = BABYLON.MeshBuilder.CreatePoints("stars", {
        points: Array.from({ length: 8000 }, () => {
            return new BABYLON.Vector3(
                (Math.random() - 0.5) * 1200,
                (Math.random() - 0.5) * 1200,
                (Math.random() - 0.5) * 1200
            );
        })
    }, scene);
    stars.material = new BABYLON.PointsMaterial("starMat", scene);
    stars.material.pointSize = 1.5;
    stars.material.emissiveColor = new BABYLON.Color3(1, 1, 1);

    // Nebula background (simple)
    const nebula = BABYLON.MeshBuilder.CreateSphere("nebula", { diameter: 900, segments: 32 }, scene);
    nebula.position = new BABYLON.Vector3(0, 0, 0);
    const nebulaMat = new BABYLON.StandardMaterial("nebulaMat", scene);
    nebulaMat.diffuseColor = new BABYLON.Color3(0.05, 0.02, 0.15);
    nebulaMat.emissiveColor = new BABYLON.Color3(0.1, 0.05, 0.2);
    nebulaMat.backFaceCulling = false;
    nebulaMat.alpha = 0.15;
    nebula.material = nebulaMat;

    // Ship creation function
    function createShip(isFlagship, isBlueTeam) {
        const ship = new BABYLON.TransformNode("ship", scene);

        // Hull
        const hull = BABYLON.MeshBuilder.CreateBox("hull", { 
            width: isFlagship ? 4 : 2.2, 
            height: isFlagship ? 1.8 : 1.1, 
            depth: isFlagship ? 8 : 5 
        }, scene);
        hull.parent = ship;
        hull.position.y = 0;

        const hullMat = new BABYLON.StandardMaterial("hullMat", scene);
        hullMat.diffuseColor = isBlueTeam ? 
            new BABYLON.Color3(0.2, 0.4, 0.8) : 
            new BABYLON.Color3(0.8, 0.3, 0.2);
        hullMat.emissiveColor = isBlueTeam ? 
            new BABYLON.Color3(0.1, 0.2, 0.4) : 
            new BABYLON.Color3(0.4, 0.15, 0.1);
        hull.material = hullMat;

        // Engines (thrusters)
        const engineColor = isBlueTeam ? new BABYLON.Color3(0.3, 0.7, 1) : new BABYLON.Color3(1, 0.4, 0.3);
        
        for (let i = -1; i <= 1; i++) {
            const thruster = BABYLON.MeshBuilder.CreateCylinder("thruster", {
                height: 1.2, diameter: isFlagship ? 0.9 : 0.6
            }, scene);
            thruster.parent = ship;
            thruster.position.z = isFlagship ? -4.5 : -3;
            thruster.position.x = i * (isFlagship ? 1.5 : 0.9);
            thruster.rotation.x = Math.PI / 2;
            thruster.material = new BABYLON.StandardMaterial("thrusterMat", scene);
            thruster.material.emissiveColor = engineColor;
        }

        // Health bar
        const healthBar = BABYLON.MeshBuilder.CreatePlane("healthBar", { width: 6, height: 0.6 }, scene);
        healthBar.parent = ship;
        healthBar.position.y = isFlagship ? 4 : 3.5;
        healthBar.billboardMode = BABYLON.AbstractMesh.BILLBOARDMODE_Y;

        const healthMat = new BABYLON.StandardMaterial("healthMat", scene);
        healthMat.diffuseColor = new BABYLON.Color3(0, 1, 0);
        healthMat.emissiveColor = new BABYLON.Color3(0, 0.8, 0);
        healthBar.material = healthMat;

        ship.health = isFlagship ? 120 : 40;
        ship.maxHealth = ship.health;
        ship.isFlagship = isFlagship;
        ship.isBlueTeam = isBlueTeam;
        ship.healthBar = healthBar;
        ship.velocity = new BABYLON.Vector3(0, 0, 0);
        ship.target = null;
        ship.lastFire = 0;

        return ship;
    }

    // Create two fleets
    const ships = [];
    const blueFleet = [];
    const redFleet = [];

    // Blue fleet (left side)
    const blueFlagship = createShip(true, true);
    blueFlagship.position = new BABYLON.Vector3(-60, 0, 0);
    blueFleet.push(blueFlagship);
    ships.push(blueFlagship);

    for (let i = 0; i < 9; i++) {
        const escort = createShip(false, true);
        escort.position = new BABYLON.Vector3(
            -60 + (Math.random() - 0.5) * 30,
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 40
        );
        blueFleet.push(escort);
        ships.push(escort);
    }

    // Red fleet (right side)
    const redFlagship = createShip(true, false);
    redFlagship.position = new BABYLON.Vector3(60, 0, 0);
    redFleet.push(redFlagship);
    ships.push(redFlagship);

    for (let i = 0; i < 9; i++) {
        const escort = createShip(false, false);
        escort.position = new BABYLON.Vector3(
            60 + (Math.random() - 0.5) * 30,
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 40
        );
        redFleet.push(escort);
        ships.push(escort);
    }

    // Projectiles
    const projectiles = [];

    function createProjectile(position, direction, isBlue) {
        const proj = BABYLON.MeshBuilder.CreateSphere("proj", { diameter: 0.8 }, scene);
        proj.position = position.clone();
        proj.direction = direction.normalize().scale(1.8);
        proj.isBlue = isBlue;
        proj.life = 180;

        const mat = new BABYLON.StandardMaterial("projMat", scene);
        mat.emissiveColor = isBlue ? 
            new BABYLON.Color3(0.3, 0.8, 1.5) : 
            new BABYLON.Color3(1.5, 0.4, 0.3);
        proj.material = mat;

        // Trail
        const trail = new BABYLON.ParticleSystem("trail", 80, scene);
        trail.particleTexture = new BABYLON.Texture("https://cdn.babylonjs.com/textures/flare.png", scene);
        trail.emitter = proj;
        trail.color1 = isBlue ? new BABYLON.Color4(0.3, 0.7, 1, 0.6) : new BABYLON.Color4(1, 0.3, 0.2, 0.6);
        trail.color2 = isBlue ? new BABYLON.Color4(0.2, 0.5, 1, 0.3) : new BABYLON.Color4(1, 0.2, 0.1, 0.3);
        trail.minSize = 0.4;
        trail.maxSize = 1.2;
        trail.emitRate = 120;
        trail.minEmitBox = new BABYLON.Vector3(-0.1, -0.1, -0.1);
        trail.maxEmitBox = new BABYLON.Vector3(0.1, 0.1, 0.1);
        trail.direction1 = direction.scale(-0.3);
        trail.direction2 = direction.scale(-0.3);
        trail.start();

        proj.trail = trail;
        projectiles.push(proj);
    }

    // Explosion function
    function explode(ship) {
        const pos = ship.position.clone();

        // Fire
        const fire = new BABYLON.ParticleSystem("fire", 300, scene);
        fire.particleTexture = new BABYLON.Texture("https://cdn.babylonjs.com/textures/flare.png", scene);
        fire.emitter = pos;
        fire.color1 = new BABYLON.Color4(1, 0.6, 0.1, 1);
        fire.color2 = new BABYLON.Color4(1, 0.2, 0, 0.6);
        fire.minSize = 2;
        fire.maxSize = 6;
        fire.emitRate = 400;
        fire.minLifeTime = 0.6;
        fire.maxLifeTime = 1.4;
        fire.gravity = new BABYLON.Vector3(0, 0, 0);
        fire.start();

        // Sparks
        const sparks = new BABYLON.ParticleSystem("sparks", 150, scene);
        sparks.particleTexture = new BABYLON.Texture("https://cdn.babylonjs.com/textures/flare.png", scene);
        sparks.emitter = pos;
        sparks.color1 = new BABYLON.Color4(1, 1, 0.8, 1);
        sparks.minSize = 0.3;
        sparks.maxSize = 0.8;
        sparks.emitRate = 200;
        sparks.minLifeTime = 0.8;
        sparks.maxLifeTime = 2;
        sparks.direction1 = new BABYLON.Vector3(-1, -1, -1);
        sparks.direction2 = new BABYLON.Vector3(1, 1, 1);
        sparks.start();

        // Shockwave
        const shockwave = BABYLON.MeshBuilder.CreateSphere("shock", { diameter: 1 }, scene);
        shockwave.position = pos;
        const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
        shockMat.emissiveColor = new BABYLON.Color3(1, 0.9, 0.7);
        shockMat.alpha = 0.6;
        shockwave.material = shockMat;

        let scale = 1;
        const shockInterval = setInterval(() => {
            scale += 4;
            shockwave.scaling = new BABYLON.Vector3(scale, scale, scale);
            shockwave.material.alpha = Math.max(0, 0.6 - scale * 0.04);
            if (scale > 18) {
                clearInterval(shockInterval);
                shockwave.dispose();
            }
        }, 16);

        // Chain reaction
        ships.forEach(other => {
            if (other !== ship && other.health > 0) {
                const dist = BABYLON.Vector3.Distance(pos, other.position);
                if (dist < 18) {
                    other.health = 0;
                    setTimeout(() => explode(other), 200);
                }
            }
        });

        // Cleanup
        setTimeout(() => {
            fire.dispose();
            sparks.dispose();
        }, 2500);

        ship.dispose();
    }

    // Update health bar
    function updateHealthBar(ship) {
        if (!ship.healthBar || ship.health <= 0) return;
        const ratio = Math.max(0, ship.health / ship.maxHealth);
        ship.healthBar.scaling.x = ratio;
        ship.healthBar.material.diffuseColor = ratio > 0.5 ? 
            new BABYLON.Color3(0, 1, 0) : new BABYLON.Color3(1, 0.6, 0);
    }

    // Main loop
    let time = 0;

    scene.onBeforeRenderObservable.add(() => {
        time += engine.getDeltaTime() / 1000;

        // Ship AI and movement
        ships.forEach(ship => {
            if (ship.health <= 0) return;

            const enemies = ship.isBlueTeam ? redFleet : blueFleet;
            let closest = null;
            let minDist = Infinity;

            enemies.forEach(enemy => {
                if (enemy.health > 0) {
                    const dist = BABYLON.Vector3.Distance(ship.position, enemy.position);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = enemy;
                    }
                }
            });

            if (closest) {
                ship.target = closest;

                // Move toward target
                const dir = closest.position.subtract(ship.position).normalize();
                ship.velocity = ship.velocity.add(dir.scale(0.03)).scale(0.96);

                // Fire
                if (time - ship.lastFire > 3) {
                    ship.lastFire = time;
                    const fireDir = closest.position.subtract(ship.position).normalize();

                    if (ship.isFlagship) {
                        createProjectile(ship.position.add(fireDir.scale(6)), fireDir, ship.isBlueTeam);
                        createProjectile(ship.position.add(fireDir.scale(6)), fireDir.scale(1.02), ship.isBlueTeam);
                    } else {
                        createProjectile(ship.position.add(fireDir.scale(4)), fireDir, ship.isBlueTeam);
                    }
                }

                // Simple turning
                const targetRot = Math.atan2(dir.x, dir.z);
                ship.rotation.y = BABYLON.Scalar.Lerp(ship.rotation.y, targetRot, 0.08);
            }

            ship.position.addInPlace(ship.velocity);
        });

        // Update projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            const proj = projectiles[i];
            proj.position.addInPlace(proj.direction);
            proj.life--;

            // Collision check
            let hit = false;
            ships.forEach(ship => {
                if (ship.health > 0 && proj.isBlue !== ship.isBlueTeam) {
                    const dist = BABYLON.Vector3.Distance(proj.position, ship.position);
                    if (dist < 6) {
                        ship.health -= proj.isBlue ? 12 : 10;
                        updateHealthBar(ship);
                        if (ship.health <= 0) {
                            explode(ship);
                        }
                        hit = true;
                    }
                }
            });

            if (proj.life <= 0 || hit) {
                if (proj.trail) proj.trail.dispose();
                proj.dispose();
                projectiles.splice(i, 1);
            }
        }

        // Update health bars position
        ships.forEach(ship => {
            if (ship.healthBar) {
                ship.healthBar.position.y = ship.isFlagship ? 5 : 3.8;
            }
        });
    });

    return scene;
};

const scene = createScene();
engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
