<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Space Battle Simulation</title>
    
    <!-- Babylon JS Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- Babylon JS GUI for Health Bars -->
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <!-- Babylon JS Material FX for Glow/Lens Flares -->
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>

    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">Initializing Battle...</div>
    <canvas id="renderCanvas"></canvas>

<script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    // --- Global Game State ---
    const ships = [];
    const projectiles = [];
    let blueTeamScore = 0;
    let redTeamScore = 0;

    const createScene = function () {
        const scene = new BABYLON.Scene(engine);
        
        // Enable anti-aliasing for smoother visuals
        scene.antiAliasingLevel = 2;

        // --- Camera ---
        // ArcRotate allows us to spin around the battle
        const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.5, 200, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 50;
        camera.upperRadiusLimit = 500;
        camera.wheelPrecision = 50;
        camera.panningSensibility = 100;

        // --- Lighting ---
        const light = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(1, -2, 1), scene);
        light.position = new BABYLON.Vector3(200, 400, 200);
        light.intensity = 1.5;

        // Ambient light so shadow sides aren't pitch black
        const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.4;
        hemiLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);

        // Post Process for Bloom (Glowing Lasers and Explosions)
        const pipeline = new BABYLON.DefaultRenderingPipeline("defaultPipeline", true, scene, [camera]);
        pipeline.bloomEnabled = true;
        pipeline.bloomThreshold = 0.5;
        pipeline.bloomWeight = 0.3;
        pipeline.bloomKernel = 64;
        pipeline.bloomScaleRatio = 0.5;
        
        // --- Background: Nebula & Stars ---
        // Create a particle system for stars
        const stars = new BABYLON.ParticleSystem("stars", 2000, scene);
        stars.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
        stars.emitter = BABYLON.MeshBuilder.CreateSphere("starSphere", {diameter: 1000}, scene);
        stars.emitter.position.z = -500; // Push back
        stars.color1 = new BABYLON.Color4(1, 1, 1, 1); 
        stars.color2 = new BABYLON.Color4(1, 1, 1, 1);
        stars.minSize = 1;
        stars.maxSize = 3;
        stars.minLifeTime = 10;
        stars.maxLifeTime = 10;
        stars.emitRate = 2000;
        stars.gravity = new BABYLON.Vector3(0, 0, 0);
        particles = []; // Store for reference
        particles.push(stars);
        stars.start();

        // --- Materials ---
        const matBlueShield = new BABYLON.StandardMaterial("matBlue", scene);
        matBlueShield.diffuseColor = new BABYLON.Color3(0, 0.5, 1);
        matBlueShield.specularColor = new BABYLON.Color3(0.5, 0.5, 0.8);

        const matRedShield = new BABYLON.StandardMaterial("matRed", scene);
        matRedShield.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2);
        matRedShield.specularColor = new BABYLON.Color3(0.8, 0.5, 0.5);

        const matMetal = new BABYLON.StandardMaterial("matMetal", scene);
        matMetal.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.7);
        matMetal.ambientColor = new BABYLON.Color3(0.3, 0.3, 0.3);

        // --- Helpers ---

        // Create a sleek spaceship shape
        function createShip(type, team) {
            const root = new BABYLON.TransformNode("root_" + type + "_" + team);
            
            // Color based on team
            const teamMat = team === 'blue' ? matBlueShield : matRedShield;
            
            if (type === 'escorts') {
                // Escort Design: Sleek arrow
                const mainBody = BABYLON.MeshBuilder.CreateCylinder("body", {height: 4, diameterTop: 0.5, diameterBottom: 2, tessellation: 8}, scene);
                mainBody.rotation.x = Math.PI / 2;
                mainBody.parent = root;
                mainBody.material = teamMat;

                // Wings
                const wings = BABYLON.MeshBuilder.CreateCylinder("wings", {height: 0.2, diameterTop: 0, diameterBottom: 4, tessellation: 4}, scene);
                wings.rotation.x = Math.PI / 2;
                wings.scaling.y = 0.2;
                wings.parent = root;
                wings.material = matMetal;

                // Thruster glow
                const glow = BABYLON.MeshBuilder.CreateCylinder("glow", {height: 0.5, diameter: 1}, scene);
                glow.position.z = 2.1;
                glow.material = teamMat; // Same color for now
                
                // Size settings
                root.metadata = { size: 2, speed: 0.15, firepower: 3000 }; // 3s reload
            } 
            else if (type === 'flagship') {
                // Flagship Design: Large Blocky Cruiser
                const mainDeck = BABYLON.MeshBuilder.CreateBox("deck", {width: 12, height: 5, depth: 8}, scene);
                mainDeck.parent = root;
                mainDeck.material = matMetal;

                const upperTower = BABYLON.MeshBuilder.CreateBox("tower", {width: 6, height: 4, depth: 4}, scene);
                upperTower.position.y = 3.5;
                upperTower.parent = root;
                upperTower.material = teamMat;

                // Engine pods
                for(let i=-1; i<=1; i++) {
                    const pod = BABYLON.MeshBuilder.CreateCylinder("pod", {height: 4, diameter: 2}, scene);
                    pod.position.set(i*5, -1, 4.5);
                    pod.rotation.x = Math.PI/2;
                    pod.parent = root;
                    pod.material = matMetal;
                    
                    const glow = BABYLON.MeshBuilder.CreateCylinder("glow", {height: 1, diameter: 1.2}, scene);
                    glow.position.set(i*5, -1, 5);
                    glow.parent = root;
                    glow.material = teamMat;
                }

                // Size settings
                root.metadata = { size: 10, speed: 0.08, firepower: 3000 }; // Flagships slower, fire same rate
            }

            return root;
        }

        // --- Fleet Generation ---
        
        // Function to spawn a whole fleet
        function spawnFleet(team, offsetZ) {
            let flagshipCreated = false;

            for (let i = 0; i < 10; i++) {
                let type = "escorts";
                
                // One flagship per fleet
                if (i === 0) type = "flagship";
                
                const shipMesh = createShip(type, team);
                
                // Position: Formation V-shape
                let posX = 0;
                let posZ = offsetZ;
                if (type === "flagship") {
                    posZ += 5; // Lead slightly
                } else {
                    const row = i;
                    const spread = row * 8;
                    const side = Math.floor((row - 1) / 2);
                    const isLeft = row % 2 !== 0;
                    posX = isLeft ? -spread : spread;
                }

                shipMesh.position = new BABYLON.Vector3(posX, (Math.random()-0.5)*5, posZ);

                // Orientation
                if (team === 'blue') {
                    shipMesh.rotation.y = -Math.PI / 2; // Face Right (+X)
                } else {
                    shipMesh.rotation.y = Math.PI / 2; // Face Left (-X)
                }

                // Add Health UI
                // We use a GUI container anchored to the 3D point
                const uiContainer = new BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(shipMesh, 1);
                const progressBar = new BABYLON.GUI.Rectangle("barBack");
                progressBar.width = "60px";
                progressBar.height = "10px";
                progressBar.cornerRadius = 5;
                progressBar.color = "orange";
                progressBar.thickness = 2;
                progressBar.background = "#333";
                progressBar.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
                progressBar.top = "-40px"; // Above ship
                progressBar.isVisible = false; // Hidden initially

                const barFill = new BABYLON.GUI.Rectangle("barFill");
                barFill.width = "100%";
                barFill.height = "100%";
                barFill.background = "green";
                barFill.cornerRadius = 5;
                progressBar.addChild(barFill);
                uiContainer.addControl(progressBar);

                const shipObj = {
                    mesh: shipMesh,
                    team: team,
                    health: type === "flagship" ? 500 : 100,
                    maxHealth: type === "flagship" ? 500 : 100,
                    lastShot: Date.now(),
                    guiBar: progressBar,
                    guiFill: barFill,
                    dead: false
                };
                ships.push(shipObj);
            }
        }

        spawnFleet('blue', 0); // Spawn on center/right
        spawnFleet('red', 0);  // Spawn on center/left

        // Move Red fleet to start at x=200
        ships.filter(s => s.team === 'red').forEach(s => s.mesh.position.x = -200);
        // Move Blue fleet to start at x=-200
        ships.filter(s => s.team === 'blue').forEach(s => s.mesh.position.x = 200);

        document.getElementById("loading").style.display = "none";


        // --- Shooting Mechanics ---

        function fireProjectile(sourceShip) {
            const teamMat = sourceShip.team === 'blue' ? matBlueShield : matRedShield;
            
            // Visual Laser Mesh
            const laser = BABYLON.MeshBuilder.CreateSphere("laser", {diameter: 0.4}, scene);
            laser.material = teamMat;
            
            // Position at gun location (front of ship)
            laser.position = sourceShip.mesh.getAbsolutePosition().clone();
            // Offset based on rotation
            if(sourceShip.team === 'blue') laser.position.x -= 2;
            else laser.position.x += 2;
            
            // Scale it thin
            laser.scaling.z = 2; 

            projectiles.push({
                mesh: laser,
                team: sourceShip.team,
                speed: 1.5,
                dir: sourceShip.mesh.forward.scale(1.5),
                life: 100 // Frames to live roughly
            });
        }

        // --- Explosion System ---

        function triggerExplosion(position) {
            // 1. Particle Fire
            const fireParticles = new BABYLON.ParticleSystem("explosion", 500, scene);
            fireParticles.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
            fireParticles.emitter = position;
            fireParticles.color1 = new BABYLON.Color4(1, 1, 0, 1); // Yellow
            fireParticles.color2 = new BABYLON.Color4(1, 0.1, 0, 1); // Red
            fireParticles.minSize = 2;
            fireParticles.maxSize = 8;
            fireParticles.minLifeTime = 0.3;
            fireParticles.maxLifeTime = 1.0;
            fireParticles.emitRate = 500;
            fireParticles.gravity = new BABYLON.Vector3(0, 0, 0); // Explode outwards
            fireParticles.targetStopDuration = 0.2;
            fireParticles.start();

            // 2. Shockwave Ring
            const shockwave = BABYLON.MeshBuilder.CreateTorus("shockwave", {diameter: 1, thickness: 0.1, tessellation: 32}, scene);
            shockwave.position = position;
            const shockMat = new BABYLON.StandardMaterial("shock", scene);
            shockMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
            shockMat.alpha = 0.6;
            shockwave.material = shockMat;

            // Animate Shockwave manually in loop (or rely on physics, but manual scaling is easier here)
            shockwave.registerBeforeRender(() => {
                shockwave.scaling.multiplyByScalar(1.05);
                shockwave.material.alpha -= 0.02;
            });

            // 3. Debris
            const debrisCount = 10;
            for(let i=0; i<debrisCount; i++){
                const debr = BABYLON.MeshBuilder.CreatePolyhedron("debris", {size: 0.5}, scene);
                debr.position = position;
                debr.material = matMetal;
                debr.velocity = BABYLON.Vector3.Random().scale(Math.random() * 0.5);
                
                debr.registerBeforeRender(() => {
                    debr.position.addInPlace(debr.velocity);
                    debr.rotationQuaternion.rotate(new BABYLON.Quaternion.FromEulerAngles(0.1,0.2,0.3));
                    if(debr.position.subtract(position).length() > 20) debr.dispose();
                });
            }
        }

        // --- Main Game Loop ---

        scene.registerBeforeRender(function () {
            if (ships.length === 0) return; // All dead

            const now = Date.now();

            // 1. Update Ships (Movement & AI)
            ships.forEach(ship => {
                if (ship.dead) return;

                // Hide health bar if far away
                ship.guiBar.isVisible = true;

                // Find Target (Nearest Enemy)
                let nearestEnemy = null;
                let minDist = 9999;

                ships.forEach(enemy => {
                    if (enemy.dead || enemy.team === ship.team) return;
                    const dist = ship.mesh.position.distanceTo(enemy.mesh.position);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestEnemy = enemy;
                    }
                });

                if (nearestEnemy) {
                    // Rotate towards enemy (simple lerp for smooth turning)
                    const targetDir = nearestEnemy.mesh.position.subtract(ship.mesh.position).normalize();
                    const currentForward = ship.mesh.forward; // Note: depends on how Babylon handles rotation vectors
                    
                    // Convert position difference to quaternion
                    const targetQuat = BABYLON.Quaternion.LookRotation(targetDir, ship.mesh.upVector);
                    
                    // Smooth rotation
                    ship.mesh.rotationQuaternion.slerpToRef(targetQuat, 0.05, ship.mesh.rotationQuaternion);

                    // Move Forward
                    const moveAmount = ship.mesh.metadata.speed;
                    ship.mesh.position.addInPlace(targetDir.scale(moveAmount));
                    
                    // Jitter slightly to simulate maneuvering
                    ship.mesh.position.y += (Math.random() - 0.5) * 0.05;
                }

                // Shooting
                if (now - ship.lastShot > ship.mesh.metadata.firepower) {
                    // Flagships fire double
                    if (ship.mesh.metadata.type === 'flagship') { // Typo fix later, checking name below
                         // Flagships defined earlier as type 'flagship' string but metadata doesn't explicitly say 'flagship', checking maxHealth
                         if(ship.maxHealth > 100) {
                             fireProjectile(ship); // First
                             setTimeout(() => fireProjectile(ship), 100); // Second with slight delay
                         } else {
                             fireProjectile(ship);
                         }
                    } else {
                        fireProjectile(ship);
                    }
                    ship.lastShot = now;
                }
            });

            // 2. Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.life--;
                
                // Move
                p.mesh.position.addInPlace(p.dir);
                
                // Remove if too old or exploded
                if (p.life <= 0) {
                    p.mesh.dispose();
                    projectiles.splice(i, 1);
                    continue;
                }

                // Collision Detection
                let hit = false;
                // Check all ships against this projectile
                for (let j = 0; j < ships.length; j++) {
                    const target = ships[j];
                    if (target.dead || target.team === p.team) continue;

                    // Simple Distance check for collision
                    if (target.mesh.position.distanceTo(p.mesh.position) < target.mesh.metadata.size) {
                        // HIT!
                        hit = true;
                        
                        // Damage
                        target.health -= 20;
                        
                        // Visual Feedback (Flash)
                        const flash = p.mesh.material.clone();
                        flash.emissiveColor = new BABYLON.Color3(1, 1, 1);
                        p.mesh.material = flash;
                        setTimeout(() => p.mesh.material.dispose(), 100);

                        // Health Bar Update
                        const hpPercent = target.health / target.maxHealth;
                        target.guiFill.width = (hpPercent * 100) + "%";
                        target.guiFill.background = hpPercent < 0.3 ? "red" : "green";

                        // Check Death
                        if (target.health <= 0 && !target.dead) {
                            target.dead = true;
                            target.mesh.isVisible = false;
                            target.guiBar.isVisible = false;
                            
                            triggerExplosion(target.mesh.position);

                            // Chain Reaction Check
                            ships.forEach(other => {
                                if(!other.dead && other.team !== target.team) {
                                    const dist = other.mesh.position.distanceTo(target.mesh.position);
                                    // Within roughly 1 ship width (approx 5 units for flags, 2 for escorts -> avg 3)
                                    if(dist < 15) { 
                                        // Chain reaction instant kill logic:
                                        other.health = 0; 
                                        // Trigger recursive death handling? 
                                        // To avoid deep recursion loops instantly crashing browser, we just mark for next loop or handle carefully.
                                        // But since we are inside loop j, setting health=0 won't destroy 'other' until next frame pass usually.
                                        // Let's force the explosion now to chain visually
                                        other.dead = true;
                                        other.mesh.isVisible = false;
                                        other.guiBar.isVisible = false;
                                        triggerExplosion(other.mesh.position);
                                    }
                                }
                            });
                        }
                        break; // Bullet destroyed by first hit
                    }
                }

                if (hit) {
                    p.mesh.dispose();
                    projectiles.splice(i, 1);
                }
            }
        });

        return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(function () {
        scene.render();
    });

    window.addEventListener("resize", function () {
        engine.resize();
    });
</script>
</body>
</html>
