<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cosmic Fleet Battle Arena</title>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #030308;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        /* HUD overlay and telemetry */
        .telemetry-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            max-width: 320px;
            backdrop-filter: blur(5px);
        }

        .title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00d2ff;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .sub-title {
            font-size: 11px;
            opacity: 0.75;
            margin-bottom: 12px;
        }

        .faction-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .blue-faction {
            color: #3b82f6;
            font-weight: bold;
        }

        .red-faction {
            color: #ef4444;
            font-weight: bold;
        }

        /* Fleet Control Card */
        .controls-card {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 15px;
            z-index: 10;
            font-size: 12px;
            width: 260px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .controls-card h3 {
            margin: 0 0 10px 0;
            color: #00d2ff;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .btn-restart {
            width: 100%;
            background: #00d2ff;
            border: none;
            color: #000;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-restart:hover {
            opacity: 0.9;
        }

        /* 3D Healthbars via Floating Divs */
        .health-bar-container {
            position: absolute;
            width: 45px;
            height: 4px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2px;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        .health-bar-fill {
            height: 100%;
            width: 100%;
            border-radius: 1px;
            transition: width 0.1s ease-out;
        }

        .health-blue {
            background-color: #3b82f6;
            box-shadow: 0 0 4px #3b82f6;
        }

        .health-red {
            background-color: #ef4444;
            box-shadow: 0 0 4px #ef4444;
        }
    </style>
</head>
<body>

    <!-- HUD Overview -->
    <div class="telemetry-overlay">
        <div class="title">Nebula Combat Simulation</div>
        <div class="sub-title">Flagships & Escort Fighters | Tactical Deep Space Telemetry</div>
        <div class="faction-stats">
            <span>Blue Vanguard:</span>
            <span class="blue-faction" id="blue-count">10 / 10 Active</span>
        </div>
        <div class="faction-stats">
            <span>Red Swarm:</span>
            <span class="red-faction" id="red-count">10 / 10 Active</span>
        </div>
    </div>

    <!-- Right Controls Info -->
    <div class="controls-card">
        <h3>Camera Telemetry</h3>
        <div style="margin-bottom:8px; opacity:0.8;">
            Orbit Camera enabled. Left-click & drag to adjust angle. Scroll wheel to zoom.
        </div>
        <button class="btn-restart" onclick="restartSimulation()">Restart Simulation</button>
    </div>

    <!-- HTML Overlay for health bars -->
    <div id="health-bars-overlay"></div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let scene;
        let camera;

        // Factions Configuration
        const Faction = {
            BLUE: 'Blue',
            RED: 'Red'
        };

        // Simulated entity registries
        let ships = [];
        let projectiles = [];
        let particles = [];

        const createScene = function () {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.02, 1.0);

            // Orbit Camera
            camera = new BABYLON.ArcRotateCamera("SpaceCamera", Math.PI / 4, Math.PI / 3, 100, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 250;

            // Ambient cosmic glowing light
            const ambient = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
            ambient.intensity = 0.35;
            ambient.diffuse = new BABYLON.Color3(0.08, 0.12, 0.25);

            // Dynamic cosmic point light sources representing nebular radiation
            const starLight = new BABYLON.PointLight("starLight", new BABYLON.Vector3(0, 150, 0), scene);
            starLight.intensity = 1.2;
            starLight.diffuse = new BABYLON.Color3(1, 0.9, 0.7);

            // Create Starfield
            createStarfield();

            // Spawn Fleets
            spawnFleets();

            // Run render & simulation update loops
            scene.onBeforeRenderObservable.add(() => {
                updateShips();
                updateProjectiles();
                updateParticles();
                updateHUDHealthBars();
            });

            return scene;
        };

        // --- SPACE ENVIRONMENT ---
        function createStarfield() {
            // High efficiency single-mesh starfield using points
            const starCount = 2000;
            const positions = [];
            const colors = [];

            for (let i = 0; i < starCount; i++) {
                const angle1 = Math.random() * Math.PI * 2;
                const angle2 = Math.random() * Math.PI;
                const radius = 200 + Math.random() * 100;
                
                positions.push(
                    radius * Math.sin(angle2) * Math.cos(angle1),
                    radius * Math.cos(angle2),
                    radius * Math.sin(angle2) * Math.sin(angle1)
                );

                colors.push(0.8 + Math.random() * 0.2, 0.8 + Math.random() * 0.2, 1, 1);
            }

            const starMesh = new BABYLON.Mesh("stars", scene);
            const pcs = new BABYLON.PointsCloudSystem("pcs", 2, scene);
            pcs.addPoints(starCount, (particle, i) => {
                particle.position.set(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
                particle.color = new BABYLON.Color4(colors[i * 4], colors[i * 4 + 1], colors[i * 4 + 2], colors[i * 4 + 3]);
            });
            pcs.buildMeshAsync();
        }

        // --- SHIP CONSTRUCTORS ---
        function createShipMesh(isFlagship, faction) {
            // Create a complex combined compound mesh for flagships and escorts
            const rootNode = new BABYLON.Mesh("shipRoot", scene);
            
            const mat = new BABYLON.StandardMaterial("shipMat", scene);
            mat.diffuseColor = faction === Faction.BLUE ? new BABYLON.Color3(0.1, 0.35, 0.7) : new BABYLON.Color3(0.8, 0.15, 0.15);
            mat.emissiveColor = faction === Faction.BLUE ? new BABYLON.Color3(0.05, 0.1, 0.2) : new BABYLON.Color3(0.2, 0.05, 0.05);
            mat.specularColor = new BABYLON.Color3(1, 1, 1);
            mat.specularPower = 32;

            const scale = isFlagship ? 2.5 : 1.0;

            // Main hull (needle / arrowhead shape)
            const hull = BABYLON.MeshBuilder.CreateCylinder("hull", {
                diameterTop: 0,
                diameterBottom: 1.2 * scale,
                height: 4 * scale,
                tessellation: 6
            }, scene);
            hull.rotation.x = Math.PI / 2; // Face forward along Z axis
            hull.material = mat;
            hull.parent = rootNode;

            // Wings / Side struts
            const wingLeft = BABYLON.MeshBuilder.CreateBox("wingLeft", {
                width: 1.8 * scale,
                height: 0.2 * scale,
                depth: 1.5 * scale
            }, scene);
            wingLeft.position.set(-1.1 * scale, -0.2 * scale, -0.5 * scale);
            wingLeft.rotation.z = -0.2;
            wingLeft.material = mat;
            wingLeft.parent = rootNode;

            const wingRight = wingLeft.clone("wingRight");
            wingRight.position.x = 1.1 * scale;
            wingRight.rotation.z = 0.2;
            wingRight.parent = rootNode;

            // Engine nozzle (emitting trail)
            const engineMat = new BABYLON.StandardMaterial("engineMat", scene);
            engineMat.emissiveColor = faction === Faction.BLUE ? new BABYLON.Color3(0, 0.8, 1) : new BABYLON.Color3(1, 0.3, 0);
            
            const engineNozzle = BABYLON.MeshBuilder.CreateCylinder("engine", {
                diameterTop: 0.6 * scale,
                diameterBottom: 0.4 * scale,
                height: 0.8 * scale,
                tessellation: 6
            }, scene);
            engineNozzle.position.set(0, 0, -2 * scale);
            engineNozzle.rotation.x = Math.PI / 2;
            engineNozzle.material = engineMat;
            engineNozzle.parent = rootNode;

            return rootNode;
        }

        function spawnFleets() {
            // Setup Blue formation
            spawnFormation(Faction.BLUE, new BABYLON.Vector3(-45, 0, 0), new BABYLON.Vector3(1, 0, 0));

            // Setup Red formation
            spawnFormation(Faction.RED, new BABYLON.Vector3(45, 0, 0), new BABYLON.Vector3(-1, 0, 0));
        }

        function spawnFormation(faction, centerPos, forwardVec) {
            // Flagship center
            const flagship = {
                mesh: createShipMesh(true, faction),
                isFlagship: true,
                faction: faction,
                health: 400,
                maxHealth: 400,
                pos: centerPos.clone(),
                velocity: BABYLON.Vector3.Zero(),
                target: null,
                lastShotTime: 0,
                radius: 5,
                id: 'flagship-' + faction,
                healthBarEl: createHealthBarUI(faction)
            };
            flagship.mesh.position.copyFrom(flagship.pos);
            ships.push(flagship);

            // 9 Escort Ships around flagship
            for (let i = 0; i < 9; i++) {
                const angle = (i / 9) * Math.PI * 2;
                const offset = new BABYLON.Vector3(
                    Math.cos(angle) * 12 + (Math.random() - 0.5) * 4,
                    (Math.random() - 0.5) * 6,
                    Math.sin(angle) * 12 + (Math.random() - 0.5) * 4
                );
                const pos = centerPos.add(offset);

                const escort = {
                    mesh: createShipMesh(false, faction),
                    isFlagship: false,
                    faction: faction,
                    health: 100,
                    maxHealth: 100,
                    pos: pos,
                    velocity: BABYLON.Vector3.Zero(),
                    target: null,
                    lastShotTime: 0,
                    radius: 2,
                    id: `escort-${faction}-${i}`,
                    healthBarEl: createHealthBarUI(faction)
                };
                escort.mesh.position.copyFrom(escort.pos);
                ships.push(escort);
            }
        }

        function createHealthBarUI(faction) {
            const container = document.createElement('div');
            container.className = 'health-bar-container';
            const fill = document.createElement('div');
            fill.className = `health-bar-fill ${faction === Faction.BLUE ? 'health-blue' : 'health-red'}`;
            container.appendChild(fill);
            document.getElementById('health-bars-overlay').appendChild(container);
            return container;
        }

        // --- UPDATE & SIMULATION LOOPS ---
        function updateShips() {
            const now = Date.now();

            ships.forEach(ship => {
                // Find nearest enemy target if not exists or dead
                if (!ship.target || ships.indexOf(ship.target) === -1 || ship.target.health <= 0) {
                    ship.target = findNearestEnemy(ship);
                }

                // If target available, fly toward it and attack
                if (ship.target) {
                    const toTarget = ship.target.pos.subtract(ship.pos);
                    const distance = toTarget.length();

                    // Movement AI: Keep combat distance
                    const idealDistance = ship.isFlagship ? 35 : 20;
                    let targetVelocity = BABYLON.Vector3.Zero();

                    if (distance > idealDistance) {
                        targetVelocity = toTarget.normalize().scale(0.25); // Accelerate forward
                    } else if (distance < idealDistance - 5) {
                        targetVelocity = toTarget.normalize().scale(-0.18); // Back up or evade
                    } else {
                        // Strafe / Orbit maneuver
                        const up = new BABYLON.Vector3(0, 1, 0);
                        const strafe = BABYLON.Vector3.Cross(toTarget, up).normalize().scale(0.12);
                        targetVelocity = strafe;
                    }

                    // Soft smooth interpolation for inertia & maneuvering physics
                    ship.velocity = BABYLON.Vector3.Lerp(ship.velocity, targetVelocity, 0.05);
                    ship.pos.addInPlace(ship.velocity);
                    ship.mesh.position.copyFrom(ship.pos);

                    // Smooth rotation facing target
                    const lookTarget = ship.pos.add(ship.velocity.normalize().scale(5));
                    ship.mesh.lookAt(lookTarget, 0, 0, 0);

                    // Shoot mechanics
                    if (now - ship.lastShotTime > 3000) {
                        fireProjectiles(ship);
                        ship.lastShotTime = now;
                    }
                } else {
                    // Idle cruise if no enemies remain
                    ship.velocity = BABYLON.Vector3.Lerp(ship.velocity, new BABYLON.Vector3(0, 0, 0.02), 0.02);
                    ship.pos.addInPlace(ship.velocity);
                    ship.mesh.position.copyFrom(ship.pos);
                }
            });
        }

        function findNearestEnemy(ship) {
            let closest = null;
            let minDist = Infinity;

            ships.forEach(other => {
                if (other.faction !== ship.faction && other.health > 0) {
                    const dist = BABYLON.Vector3.Distance(ship.pos, other.pos);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = other;
                    }
                }
            });
            return closest;
        }

        // --- FIRE WEAPONS ---
        function fireProjectiles(ship) {
            if (!ship.target) return;

            const factionColor = ship.faction === Faction.BLUE ? new BABYLON.Color3(0, 0.7, 1) : new BABYLON.Color3(1, 0.2, 0.1);

            // Direct line with slight predictive aiming
            const direction = ship.target.pos.subtract(ship.pos).normalize();

            if (ship.isFlagship) {
                // Dual firing projectiles side by side
                for (let i = 0; i < 2; i++) {
                    const sideOffset = new BABYLON.Vector3(i === 0 ? -1.5 : 1.5, 0, 0);
                    const spawnPos = ship.pos.add(BABYLON.Vector3.TransformNormal(sideOffset, ship.mesh.getWorldMatrix()));
                    
                    createLaser(spawnPos, direction, ship.faction, factionColor);
                }
            } else {
                createLaser(ship.pos.clone(), direction, ship.faction, factionColor);
            }
        }

        function createLaser(position, direction, faction, color) {
            const laser = BABYLON.MeshBuilder.CreateCylinder("laser", {
                diameter: 0.18,
                height: 2.2
            }, scene);
            laser.rotation.x = Math.PI / 2;
            laser.position.copyFrom(position);
            
            const mat = new BABYLON.StandardMaterial("laserMat", scene);
            mat.emissiveColor = color;
            laser.material = mat;

            // Direct orientation matching flight direction
            laser.lookAt(position.add(direction));

            projectiles.push({
                mesh: laser,
                direction: direction,
                faction: faction,
                speed: 0.9,
                birth: Date.now(),
                pos: position
            });
        }

        function updateProjectiles() {
            const now = Date.now();

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.pos.addInPlace(proj.direction.scale(proj.speed));
                proj.mesh.position.copyFrom(proj.pos);

                // Laser Trail particle generation
                createTrailParticle(proj.pos, proj.faction);

                // Hit Detection
                let hit = false;
                for (let s = 0; s < ships.length; s++) {
                    const ship = ships[s];
                    if (ship.faction !== proj.faction) {
                        const dist = BABYLON.Vector3.Distance(proj.pos, ship.pos);
                        if (dist < ship.radius) {
                            // Inflict damage
                            ship.health -= 20;
                            hit = true;
                            createImpactSpark(proj.pos, proj.faction);
                            
                            // Check death
                            if (ship.health <= 0) {
                                triggerExplosionChain(ship);
                            }
                            break;
                        }
                    }
                }

                // Range limit or Hit destruction
                if (hit || now - proj.birth > 4000) {
                    proj.mesh.dispose();
                    projectiles.splice(i, 1);
                }
            }
        }

        // --- SPECTACULAR CHAIN REACTION EXPLOSIONS ---
        function triggerExplosionChain(deadShip) {
            const index = ships.indexOf(deadShip);
            if (index === -1) return;

            // Explode this ship
            triggerShipExplosionVisuals(deadShip);

            // Remove and dispose
            deadShip.mesh.dispose();
            deadShip.healthBarEl.style.display = 'none';
            deadShip.healthBarEl.remove();
            ships.splice(index, 1);

            updateTelemetryStats();

            // Chain Reaction Check: trigger explosion on any ship within roughly 1 ship‑width
            const chainRadius = deadShip.radius * 2.5; 

            // Copy array to search to prevent concurrent deletion issues
            const currentActiveShips = [...ships];
            currentActiveShips.forEach(otherShip => {
                const dist = BABYLON.Vector3.Distance(deadShip.pos, otherShip.pos);
                if (dist <= chainRadius) {
                    // Detonate chained ship automatically!
                    otherShip.health = 0; 
                    setTimeout(() => {
                        triggerExplosionChain(otherShip);
                    }, 200); // slight satisfying delay
                }
            });
        }

        function triggerShipExplosionVisuals(ship) {
            const pCount = ship.isFlagship ? 100 : 40;
            const factionColor = ship.faction === Faction.BLUE ? new BABYLON.Color3(0, 0.8, 1) : new BABYLON.Color3(1, 0.4, 0);

            // Spark burst
            for (let i = 0; i < pCount; i++) {
                const vel = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 1.5,
                    (Math.random() - 0.5) * 1.5,
                    (Math.random() - 0.5) * 1.5
                );
                createExpParticle(ship.pos, vel, factionColor, 35);
            }

            // Shockwave ring
            for (let i = 0; i < 24; i++) {
                const angle = (i / 24) * Math.PI * 2;
                const vel = new BABYLON.Vector3(
                    Math.cos(angle) * 0.8,
                    0,
                    Math.sin(angle) * 0.8
                );
                createExpParticle(ship.pos, vel, new BABYLON.Color3(1, 1, 1), 25);
            }
        }

        // --- PARTICLE PHYSICS ENGINE ---
        function createTrailParticle(pos, faction) {
            const p = BABYLON.MeshBuilder.CreateBox("trail", { size: 0.15 }, scene);
            p.position.copyFrom(pos);
            const mat = new BABYLON.StandardMaterial("trailMat", scene);
            mat.emissiveColor = faction === Faction.BLUE ? new BABYLON.Color3(0, 0.6, 1) : new BABYLON.Color3(1, 0.2, 0);
            p.material = mat;

            particles.push({
                mesh: p,
                velocity: new BABYLON.Vector3((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02),
                life: 15,
                maxLife: 15
            });
        }

        function createImpactSpark(pos, faction) {
            for (let i = 0; i < 8; i++) {
                const p = BABYLON.MeshBuilder.CreateBox("spark", { size: 0.1 }, scene);
                p.position.copyFrom(pos);
                const mat = new BABYLON.StandardMaterial("sparkMat", scene);
                mat.emissiveColor = faction === Faction.BLUE ? new BABYLON.Color3(0.5, 0.9, 1) : new BABYLON.Color3(1, 0.6, 0.2);
                p.material = mat;

                particles.push({
                    mesh: p,
                    velocity: new BABYLON.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5),
                    life: 10,
                    maxLife: 10
                });
            }
        }

        function createExpParticle(pos, vel, color, maxLife) {
            const size = 0.25 + Math.random() * 0.4;
            const p = BABYLON.MeshBuilder.CreateBox("expP", { size: size }, scene);
            p.position.copyFrom(pos);
            const mat = new BABYLON.StandardMaterial("expMat", scene);
            mat.emissiveColor = color;
            p.material = mat;

            particles.push({
                mesh: p,
                velocity: vel,
                life: maxLife,
                maxLife: maxLife
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addInPlace(p.velocity);
                p.life--;

                // Shrink and dim over life
                p.mesh.scaling.scaleInPlace(p.life / p.maxLife);

                if (p.life <= 0) {
                    p.mesh.dispose();
                    particles.splice(i, 1);
                }
            }
        }

        // --- 2D CANVAS FLOATING HEALTHBAR SYSTEM ---
        function updateHUDHealthBars() {
            ships.forEach(ship => {
                const screenCoords = BABYLON.Vector3.Project(
                    ship.pos.add(new BABYLON.Vector3(0, ship.radius + 1, 0)),
                    BABYLON.Matrix.Identity(),
                    scene.getTransformMatrix(),
                    camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight())
                );

                const bar = ship.healthBarEl;
                if (bar) {
                    // Hide healthbars if behind camera frustum
                    if (screenCoords.z < 0 || screenCoords.z > 1) {
                        bar.style.display = 'none';
                    } else {
                        bar.style.display = 'block';
                        bar.style.left = `${screenCoords.x - 22}px`;
                        bar.style.top = `${screenCoords.y - 10}px`;

                        // Fill ratio update
                        const fill = bar.querySelector('.health-bar-fill');
                        const ratio = Math.max(0, ship.health / ship.maxHealth) * 100;
                        fill.style.width = `${ratio}%`;
                    }
                }
            });
        }

        function updateTelemetryStats() {
            const blues = ships.filter(s => s.faction === Faction.BLUE).length;
            const reds = ships.filter(s => s.faction === Faction.RED).length;

            document.getElementById('blue-count').innerText = `${blues} / 10 Active`;
            document.getElementById('red-count').innerText = `${reds} / 10 Active`;
        }

        // --- RESTART GAME LOOP ---
        function restartSimulation() {
            // Clean up existing meshes
            ships.forEach(s => {
                s.mesh.dispose();
                if (s.healthBarEl) s.healthBarEl.remove();
            });
            projectiles.forEach(p => p.mesh.dispose());
            particles.forEach(p => p.mesh.dispose());

            ships = [];
            projectiles = [];
            particles = [];

            // Re-spawn
            spawnFleets();
            updateTelemetryStats();
        }

        // Run application
        createScene();
        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
