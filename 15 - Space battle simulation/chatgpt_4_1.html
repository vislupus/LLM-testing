<!DOCTYPE html>
<html>
<head>
  <title>Babylon.js 3D Space Battle Demo</title>
  <meta charset="utf-8" />
  <style>
    html, body { width:100vw; height:100vh; margin:0; background:#000; }
    #renderCanvas { width:100vw; height:100vh; display:block; background:#070824; }
    #titleBar {
      position: absolute; top:0; left:0; width:100vw; text-align:center; z-index:100; font-family:"Segoe UI",sans-serif;
      padding: 8px 0 0 0; font-size: 1.25em; color: #f7fbff; text-shadow: 1px 2px 8px #070A2B, 0px 2px 14px #1000FF80,0 1px 24px #0af9;
      pointer-events:none; user-select:none; font-weight:600; letter-spacing:0.09em;
    }
    @media (max-width: 700px) {
      #titleBar { font-size:.95em; }
    }
  </style>
</head>
<body>
  <div id="titleBar">Babylon.js 3D Space Battle Demo &mdash; Two Fleets with Explosions, Chain Reactions, and Glowing Projectiles</div>
  <canvas id="renderCanvas"></canvas>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/procedural-textures/babylon.starfieldproceduraltexture.min.js"></script>
  <script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true, stencil:true});

function randUnitSphere() {
  const u = Math.random(), v = Math.random();
  const theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1);
  return new BABYLON.Vector3(
    Math.sin(phi) * Math.cos(theta),
    Math.sin(phi) * Math.sin(theta),
    Math.cos(phi)
  );
}

///////////////////////////////////////////////////////
// Starfield background
///////////////////////////////////////////////////////
function createStarBackground(scene) {
  // Babylon's procedural starfield
  const starTex = new BABYLON.StarfieldProceduralTexture("starfieldTex", 1024, scene);
  starTex.beta = 0.3 + Math.random() * 0.5;
  starTex.azimuth = Math.random() * Math.PI*2;
  starTex.tiling = 2.8;
  starTex.time = Math.random()*6;
  const sky = BABYLON.MeshBuilder.CreateSphere("starBG",{diameter:800,sideOrientation:BABYLON.Mesh.BACKSIDE},scene);
  const mat = new BABYLON.StandardMaterial("skyMat",scene);
  mat.diffuseTexture = starTex;
  mat.specularColor = BABYLON.Color3.Black();
  mat.emissiveColor = new BABYLON.Color3(0.99,1,.99);
  mat.backFaceCulling = false;
  mat.freeze();
  sky.material = mat;
}

///////////////////////////////////////////////////////
// SHIP MESHES
///////////////////////////////////////////////////////
function createFlagshipMesh(scene, color) {
  // Big sleek ship; mostly cylinder, details
  const parent = new BABYLON.Mesh("flagship", scene);
  // Body
  const hull = BABYLON.MeshBuilder.CreateCylinder("fhull",
    {diameter: 3.2, height: 11.5, tessellation:22}, scene);
  hull.position.z = 0;
  hull.material = new BABYLON.StandardMaterial("fmat", scene);
  hull.material.diffuseColor = color.scale(0.9);
  hull.material.specularColor = color.scale(0.75);
  hull.material.emissiveColor = color.scale(0.16);
  hull.material.freeze();

  // Cockpit
  const cockpit = BABYLON.MeshBuilder.CreateSphere("fcockpit",{diameter:2.1, slice:0.65},scene);
  cockpit.position.z = 4.05; cockpit.position.y = 0.64;
  cockpit.material = new BABYLON.StandardMaterial("fcmat",scene);
  cockpit.material.diffuseColor = BABYLON.Color3.White().scale(.99);
  cockpit.material.specularColor = color.scale(0.9);
  cockpit.material.emissiveColor = color.scale(0.39);
  cockpit.material.alpha = 0.82;
  cockpit.material.freeze();

  // Fins
  for(let k=0;k<4;++k) {
    let fin = BABYLON.MeshBuilder.CreateBox("ffin"+k, {
      width: .24, height:2.7, depth:1
    }, scene);
    fin.position = new BABYLON.Vector3(
      Math.sin(Math.PI/2*k)*1.8,
      Math.cos(Math.PI/2*k)*1.3-0.1,
      1.5-0.37*k
    );
    fin.rotation.z = Math.PI/2*k;
    fin.material = hull.material;
    fin.parent = parent;
  }

  // Engine units
  for(let k=0;k<3;++k) {
    let eng = BABYLON.MeshBuilder.CreateCylinder("feng"+k,{
      diameterTop:.8, diameterBottom:.95, height:.63, tessellation:20
    },scene);
    eng.position = new BABYLON.Vector3(Math.sin(Math.PI*2*k/3)*1.12,Math.cos(Math.PI*2*k/3)*1.12, -5.7);
    eng.material = hull.material;
    eng.parent = parent;
  }
  // Main hull/cockpit
  hull.parent = parent;
  cockpit.parent = parent;
  return parent;
}

function createEscortMesh(scene, color) {
  // Small fighter
  const parent = new BABYLON.Mesh("escort", scene);

  // Main hull
  const hull = BABYLON.MeshBuilder.CreateCylinder("hull",
    {diameter:1.1, height:5.3, tessellation:12}, scene);
  hull.position.z = 0;
  hull.material = new BABYLON.StandardMaterial("hmat", scene);
  hull.material.diffuseColor = color.scale(0.9);
  hull.material.specularColor = color.scale(0.77);
  hull.material.emissiveColor = color.scale(.13);
  hull.material.freeze();

  // Cockpit
  const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit",{diameter:.8, slice:.73},scene);
  cockpit.position.z = 2;
  cockpit.position.y = 0.21;
  cockpit.material = new BABYLON.StandardMaterial("cmat",scene);
  cockpit.material.diffuseColor = BABYLON.Color3.White().scale(.92);
  cockpit.material.specularColor = color.scale(.62);
  cockpit.material.emissiveColor = color.scale(.16);
  cockpit.material.alpha = 0.78;
  cockpit.material.freeze();

  // Fins (two sides)
  for(let k=-1;k<=1;k+=2) {
    let fin = BABYLON.MeshBuilder.CreateBox("fin"+k, {
      width: .23, height:1.19, depth:.68
    }, scene);
    fin.position = new BABYLON.Vector3(k*.69, -.15, 0.63);
    fin.material = hull.material;
    fin.parent = parent;
  }

  // Engine nozzle
  let eng = BABYLON.MeshBuilder.CreateCylinder("eng",{
    diameterTop:.37,diameterBottom:.5,height:.28,tessellation:10
  },scene);
  eng.position = new BABYLON.Vector3(0,0,-2.5);
  eng.material = hull.material;
  eng.parent = parent;

  hull.parent = parent;
  cockpit.parent = parent;
  return parent;
}

///////////////////////////////////////////////////////
// SHIP DATA/LOGIC
///////////////////////////////////////////////////////
const FleetColors = [
  new BABYLON.Color3(.54,.82,1),   // "Blue" fleet, launches blue projectiles
  new BABYLON.Color3(1,0.38,0.45)  // "Red" fleet, launches red projectiles
];
const fleets = [[],[]];   // fleets[0] = blue, fleets[1]=red

function spawnFleet(scene, fleetIdx, basePos, isLeft) {
  // Params: - flagship in center
  // - nine escorts in circular formation
  // Returns list of ships {mesh, flagship, health, ...}
  const ships = [];
  // Flagship
  let flagship = {
    mesh: createFlagshipMesh(scene, FleetColors[fleetIdx]).clone("f"+fleetIdx, null),
    flagship: true,
    health: 250,
    maxHealth: 250,
    destroyed: false,
    fleet: fleetIdx,
    firingTimer: Math.random()*3, // time to next shot
  };
  flagship.mesh.scaling.scaleInPlace(1.27);
  flagship.mesh.position = basePos;
  ships.push(flagship);

  // Escorts
  for(let i=0;i<9;++i) {
    let ang = Math.PI*2*i/9 + Math.PI*0.05*i + (isLeft?0:Math.PI);
    let rad = 9 + 2*Math.sin(i*1.3);
    let escort = {
      mesh: createEscortMesh(scene, FleetColors[fleetIdx]).clone("e"+fleetIdx+'_'+i, null),
      flagship: false,
      health: 60,
      maxHealth: 60,
      destroyed: false,
      fleet: fleetIdx,
      firingTimer: Math.random()*3,
    };
    let off = new BABYLON.Vector3(Math.cos(ang)*rad, randUnitSphere().y*2, Math.sin(ang)*rad);
    escort.mesh.position = basePos.add(off);
    escort.mesh.rotation.y = (isLeft?0:Math.PI);
    escort.mesh.scaling.scaleInPlace(.99+Math.random()*0.11);
    ships.push(escort);
  }
  return ships;
}

///////////////////////////////////////////////////////
// HEALTH BARS
///////////////////////////////////////////////////////
function createHealthBar(ship, scene, color) {
  // 2 bars: background and foreground (green/red/blue etc)
  const width = ship.flagship? 4 : 2, height = .23, yoff = ship.flagship? 5.6 : 2.75;
  const root = new BABYLON.TransformNode("hbarParent", scene);
  root.position = new BABYLON.Vector3(0, yoff, 0);
  root.parent = ship.mesh;

  // BG
  let bgBar = BABYLON.MeshBuilder.CreateBox("hbbg", {width, height:height*.68, depth:.19}, scene);
  bgBar.material = new BABYLON.StandardMaterial("bgmat",scene);
  bgBar.material.diffuseColor = new BABYLON.Color3(.04,.04,.04);
  bgBar.material.alpha = 0.72;
  bgBar.parent = root;

  // Main
  let fgBar = BABYLON.MeshBuilder.CreateBox("hbfg", {width, height:height, depth:.14}, scene);
  fgBar.material = new BABYLON.StandardMaterial("fgmat",scene);
  fgBar.material.diffuseColor = color.scale(.75).add(new BABYLON.Color3(0.13, .6, color.b*0.11));
  fgBar.material.emissiveColor = color.scale(.16+.22*(ship.flagship?1:0));
  fgBar.parent = root;

  ship.__healthBar = {bgBar, fgBar, width, root};
}
function updateHealthBar(ship) {
  if (!ship.__healthBar) return;
  const healthFrac = Math.max(0, ship.health/ship.maxHealth);
  ship.__healthBar.fgBar.scaling.x = healthFrac;
  ship.__healthBar.fgBar.position.x = -(1-healthFrac)*ship.__healthBar.width/2;
  ship.__healthBar.fgBar.material.diffuseColor = ship.__healthBar.fgBar.material.diffuseColor
    .scale(healthFrac+.33).add(new BABYLON.Color3(1-healthFrac, 0,0).scale(1-healthFrac));
  ship.__healthBar.root.setEnabled(!ship.destroyed);
}

///////////////////////////////////////////////////////
// PROJECTILES AND TRAILS
///////////////////////////////////////////////////////
const projectiles = [];
function spawnProjectile(pos, direction, speed, color, shooter) {
  // Small glowing sphere with persistent trail mesh
  const mesh = BABYLON.MeshBuilder.CreateSphere("proj",{diameter:.41}, shooter.mesh._scene);
  mesh.position.copyFrom(pos);
  mesh.material = new BABYLON.StandardMaterial("projmat", mesh._scene);
  mesh.material.diffuseColor = color;
  mesh.material.emissiveColor = color.scale(.82);
  mesh.material.specularColor = color.scale(.68);
  mesh.material.alpha = .72;
  const trail = new BABYLON.TrailMesh("ptrail", mesh, mesh._scene, 0.15, 7, true);
  let trailMat = new BABYLON.StandardMaterial("trailmat", mesh._scene);
  trailMat.emissiveColor = color;
  trailMat.alpha = .5;
  trail.material = trailMat;

  projectiles.push({
    mesh, trail, direction: direction.normalize(), speed,
    color,
    shooter,
    alive: true,
    lifetime: 0,
  });
}

///////////////////////////////////////////////////////
// DESTRUCTION EFFECTS & CHAIN REACTIONS
///////////////////////////////////////////////////////
let pendingExplosions = [];
function triggerExplosion(ship) {
  // Spectacular: sphere shockwave, debris, sparks, fireball (billboard planes)
  // Plus, check for nearby ships
  const scene = ship.mesh._scene;
  const pos = ship.mesh.position.clone();
  pendingExplosions.push({pos, time:0, color:FleetColors[ship.fleet], big:ship.flagship, scene});
  // Debris cubes, sparks, expanding ring
  for (let i=0;i<18+(ship.flagship?10:0);++i) {
    let d = BABYLON.MeshBuilder.CreateBox("debris",{width:.17+.18*Math.random(), depth:.11, height:.11},scene);
    d.position = pos.add(randUnitSphere().scale(1+.6*Math.random()));
    d.material = new BABYLON.StandardMaterial("debmat",scene);
    d.material.diffuseColor = FleetColors[ship.fleet].scale(.4+.4*Math.random());
    d.material.specularColor = new BABYLON.Color3(.27,.14,.09);
    let vel = randUnitSphere().scale(2.5+Math.random()*3.5);
    let rot = randUnitSphere().scale(Math.PI*2);
    d.metadata = {vel, rot, t:0, ttl:.8+Math.random()*1.08};
    explosionDebris.push(d);
  }

  // Chain explosions
  for(const f of fleets)
    for(const s2 of f)
      if (!s2.destroyed && s2!==ship) {
        const dist = s2.mesh.position.subtract(pos).length();
        const threshold = (ship.flagship?3.9:2) + (s2.flagship?3.9:2);
        if (dist < threshold+0.6) {
          s2.health=0;
          s2.destroyed = true;
        }
      }
}
let explosionDebris = [];

///////////////////////////////////////////////////////
// EXPLOSION/ANIMATION HTTP://tiny.cc/babylonjs-explode
///////////////////////////////////////////////////////
function renderPendingExplosions(dt, scene) {
  for(let i=pendingExplosions.length-1;i>=0;--i){
    let ex = pendingExplosions[i]; ex.time+=dt;
    if (!ex.fx1) {
      // Shockwave: Plane with additive fire texture
      ex.fx1 = BABYLON.MeshBuilder.CreateDisc("shock", {radius:(ex.big?3.6:2.1)}, scene);
      ex.fx1.position = ex.pos.clone();
      ex.fx1.position.y += 0.3;
      ex.fx1.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      let m = new BABYLON.StandardMaterial("exmat", scene);
      m.diffuseColor = ex.color.scale(.85);
      m.emissiveColor = BABYLON.Color3.White();
      m.alpha = 0.38;
      m.specularColor = BABYLON.Color3.White();
      ex.fx1.material = m;
      m.disableLighting = true;
    }
    if (!ex.fx2) {
      // Fireball: billboard sphere
      ex.fx2 = BABYLON.MeshBuilder.CreateSphere("fireball", {diameter:ex.big?2.6:1.4}, scene);
      ex.fx2.position = ex.pos.clone();
      ex.fx2.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      let m = new BABYLON.StandardMaterial("exmatf", scene);
      m.diffuseColor = new BABYLON.Color3(1,.95,.51);
      m.emissiveColor = BABYLON.Color3.White();
      m.alpha = 0.26 + Math.random()*.2;
      m.specularColor = BABYLON.Color3.White();
      ex.fx2.material = m;
      m.disableLighting = true;
    }
    if (!ex.fx3) {
      // Sparks
      ex.fx3 = [];
      for (let j=0;j<18;++j) {
        let sp = BABYLON.MeshBuilder.CreateDisc("spark", {radius:.12+.13*Math.random()}, scene)
        sp.position = ex.pos.add(randUnitSphere().scale(.8+Math.random()*2.4));
        sp.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
        let m = new BABYLON.StandardMaterial("sparkmat",scene);
        m.diffuseColor = ex.color.scale(.88);
        m.emissiveColor = BABYLON.Color3.White().scale(.5+Math.random()*1.2);
        m.specularColor = BABYLON.Color3.White();
        m.alpha = 0.47 + Math.random()*.24;
        m.disableLighting = true;
        sp.material = m;
        ex.fx3.push(sp);
        sp.metadata = {vel:randUnitSphere().scale(.33+2*Math.random()),t:0};
      }
    }
    // Animate
    if (ex.fx1) { ex.fx1.scaling = new BABYLON.Vector3(1+8*ex.time,1+8*ex.time,1); ex.fx1.material.alpha = 0.38*(1-ex.time/1.3); }
    if (ex.fx2) { ex.fx2.material.alpha = (ex.big?0.35:0.21)*(1-ex.time/.8); }
    if (ex.fx3) for (let sp of ex.fx3) {
      sp.position.addInPlace(sp.metadata.vel.scale(dt));
      sp.material.alpha *= 0.97;
    }
    // Remove after 1.3s
    if (ex.time>1.3) {
      ex.fx1 && ex.fx1.dispose();
      ex.fx2 && ex.fx2.dispose();
      ex.fx3&& ex.fx3.forEach(sp=>sp.dispose());
      pendingExplosions.splice(i,1);
    }
  }
  // Debris cubes
  for (let i=explosionDebris.length-1; i>=0; --i) {
    let d = explosionDebris[i];
    d.position.addInPlace(d.metadata.vel.scale(dt));
    d.rotation.x += d.metadata.rot.x * dt * 1.3;
    d.rotation.y += d.metadata.rot.y * dt *.8;
    d.metadata.t += dt;
    d.material.alpha *= 0.98;
    if (d.metadata.t > d.metadata.ttl) { d.dispose(); explosionDebris.splice(i,1);}
  }
}

///////////////////////////////////////////////////////
// MAIN SCENE
///////////////////////////////////////////////////////
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0,0,0, 1);
scene.ambientColor = new BABYLON.Color3(.17,.17,.2);

// Camera
const camera = new BABYLON.ArcRotateCamera("arc", -Math.PI/2, Math.PI/2.35, 52, BABYLON.Vector3.Zero(), scene);
camera.wheelPrecision = 120;
camera.upperRadiusLimit = 180;
camera.lowerRadiusLimit = 36;
camera.panningSensibility = 0;
camera.attachControl(canvas,true);

// Background
createStarBackground(scene);

// Lighting - one cool, one warm, plus engine glows per ship
const light1 = new BABYLON.DirectionalLight("dirLight1", new BABYLON.Vector3(-.8, -.9, -1.6).normalize(), scene);
light1.position = new BABYLON.Vector3(-31,41,47); light1.intensity = 0.7;
light1.diffuse = new BABYLON.Color3(.91,1,.97);
const light2 = new BABYLON.DirectionalLight("dirLight2", new BABYLON.Vector3(.5, -.8, 1.3).normalize(), scene);
light2.position = new BABYLON.Vector3(32,56,-44); light2.intensity = 0.21;
light2.diffuse = new BABYLON.Color3(1,.68,.52);

// FLEETS: spawn!
fleets[0].push(...spawnFleet(scene, 0, new BABYLON.Vector3(-22,0,0), true));
fleets[1].push(...spawnFleet(scene, 1, new BABYLON.Vector3(+22,0,0), false));
for (let f=0;f<=1; ++f)
  for (let s of fleets[f])
    createHealthBar(s, scene, FleetColors[f]);

// Post-processing: glow for projectiles/engines
var glowLayer = new BABYLON.GlowLayer("glow", scene);
glowLayer.intensity = 0.76;

// Multi-engine/ship light sources: a "thruster" point light per ship, blue/red color
let engineLights = [];
function updateShipEngineLights() {
  for (let i = engineLights.length-1; i>=0; --i) {
    engineLights[i].dispose();
    engineLights.splice(i,1);
  }
  for (let f=0; f<=1; ++f) for (let s of fleets[f])
    if (!s.destroyed) {
      let eng = new BABYLON.PointLight("engL", s.mesh.position.subtract(s.mesh.forward.scale(3)), scene);
      eng.diffuse = FleetColors[f].scale(0.8+0.11*Math.random());
      eng.intensity = s.flagship?1.12:0.73;
      eng.range = s.flagship?13:8;
      engineLights.push(eng);
    }
}

///////////////////////////////////////////////////////
// SHIP MOVEMENT, LOGIC, FIRE, PROJECTILE HIT
///////////////////////////////////////////////////////
function findEnemyFleetIdx(myFleetIdx) { return (myFleetIdx+1)&1; };
function randomBetween(a,b){ return a+(b-a)*Math.random(); }
let shipSpacing = 5.6;

function shipsTick(dt) {
  for (let f=0; f<=1; ++f) for (let s of fleets[f]) {
    if (s.destroyed) continue;
    // Target nearest alive enemy
    let enemyFleet = fleets[findEnemyFleetIdx(f)].filter(en=>!en.destroyed);
    if (enemyFleet.length==0) continue;
    let myPos = s.mesh.position;
    let nearest = null, mindist=1e9;
    for (let en of enemyFleet) {
      let d = en.mesh.position.subtract(myPos).length();
      if (d < mindist) { mindist = d; nearest = en; }
    }
    if (!nearest) continue;
    // Move: aim/turn toward enemy, maneuver a little
    let toTarget = nearest.mesh.position.subtract(myPos).normalize();
    let forward = s.mesh.forward;
    let turnSpeed = s.flagship?1.3:2.3;
    s.mesh.rotation.y += (Math.atan2(toTarget.x, toTarget.z) - s.mesh.rotation.y) * dt * turnSpeed;
    // Speed: close if far, circle if close
    let speed = (mindist >14? (s.flagship?6.7:8.8): (s.flagship?3.4:5.7));
    let circleStr = Math.sin(performance.now()/860 + f + (s.flagship?0:37));
    let lateral = new BABYLON.Vector3(-toTarget.z,0,toTarget.x).normalize().scale(circleStr * .52 * (mindist<12?1:0));
    // Actually move
    let moveDir = toTarget.scale(.94).add(lateral);
    s.mesh.moveWithCollisions(moveDir.scale(dt*speed));
    // Avoid collisions with nearby same-fleet ships
    for (let so of fleets[f]) {
      if (so===s||so.destroyed) continue;
      let d = so.mesh.position.subtract(myPos);
      let dist = d.length();
      let thresh = shipSpacing* ((s.flagship?1.3:1)+(so.flagship?1.3:1))/2;
      if (dist < thresh) {
        s.mesh.position.subtractInPlace(d.normalize().scale((thresh-dist)*0.5)); // separate
      }
    }

    // Firing
    s.firingTimer -= dt;
    if (s.firingTimer <= 0) {
      if (enemyFleet.length>0&&mindist<44){
        let muzzleOffset = s.flagship? 3.2 : 2.2;
        let basePos = s.mesh.position.add(s.mesh.forward.scale(muzzleOffset));
        let baseDir = s.mesh.forward;
        if (s.flagship) {
          // Double shot, slightly angled
          for (let k=-1;k<=1;k+=2) {
            let dir = new BABYLON.Vector3(
              baseDir.x + 0.21*k, baseDir.y, baseDir.z + 0.11*k).normalize();
            spawnProjectile( basePos.add(new BABYLON.Vector3(.46*k,0,0)), dir,
              randomBetween(25,33), FleetColors[s.fleet], s);
          }
        }
        else {
          spawnProjectile(basePos, baseDir, randomBetween(22,29), FleetColors[s.fleet], s);
        }
      }
      s.firingTimer = 3 + Math.random()*0.25;
    }
  }
}

function projectilesTick(dt){
  // Move, check for collisions
  for (let i = projectiles.length-1; i>=0; --i) {
    let p = projectiles[i];
    if (!p.alive) continue;
    p.lifetime += dt;
    p.mesh.position.addInPlace(p.direction.scale(dt*p.speed));
    if (p.lifetime>6) { // despawn if off-screen
      p.mesh.dispose();
      p.trail.dispose();
      projectiles.splice(i,1);
      continue;
    }
    // Collide with enemy ships
    let targets = fleets[findEnemyFleetIdx(p.shooter.fleet)];
    let hit = null, mind=99;
    for (let s of targets) {
      if (s.destroyed) continue;
      const d = s.mesh.position.subtract(p.mesh.position).length();
      let hitDist = s.flagship?2.1:1.05;
      if (d < hitDist && d < mind) { hit = s; mind = d; }
    }
    if (hit) {
      hit.health -= (p.shooter.flagship?35:18) * (hit.flagship?1:.84);
      if (hit.health <= 0 && !hit.destroyed) {
        hit.destroyed = true;
        triggerExplosion(hit);
      }
      // Particle pop
      p.mesh.dispose();
      p.trail.dispose();
      projectiles.splice(i,1);
      continue;
    }
  }
}

///////////////////////////////////////////////////////
// RENDER LOOP
///////////////////////////////////////////////////////
scene.executeOnceBeforeRender(()=>engine.hideLoadingUI());
let lastT = performance.now();
scene.registerBeforeRender(()=> {
  let now = performance.now(), dt = Math.min((now-lastT)/1000,0.06); lastT = now;
  if (!document.hasFocus()) return;
  shipsTick(dt);
  projectilesTick(dt);
  renderPendingExplosions(dt, scene);
  // Health bars update, engine lights
  for (let f=0; f<=1; ++f) for (let s of fleets[f])
    updateHealthBar(s);
  updateShipEngineLights();
  // Animate engine glows (scale based on time)
  for (let f=0; f<=1; ++f) for (let s of fleets[f])
    if (!s.destroyed)
      for (let mID in s.mesh._children)
        if ((s.flagship && s.mesh._children[mID].name.startsWith("feng"))
         || (!s.flagship && s.mesh._children[mID].name==="eng")) {
          let eng = s.mesh._children[mID];
          eng.material.emissiveColor = FleetColors[f].scale(.38+Math.sin(performance.now()/85.7)/1.5+.08);
        }
  // End the battle if all of a fleet is destroyed
  for (let f=0; f<=1; ++f) {
    if (fleets[f].every(s=>s.destroyed)) {
      if (!scene.metadata || scene.metadata.ended !== true) {
        scene.metadata = {ended:true};
        setTimeout(()=>{
          let msg = [ "Blue", "Red" ][findEnemyFleetIdx(f)]+" Fleet Wins!";
          document.getElementById("titleBar").innerHTML = "&#x2728; "+msg+" &#x2728;";
        },1300);
      }
    }
  }
});


engine.runRenderLoop(()=>{
  if (scene.activeCamera) scene.render();
});
window.addEventListener('resize', ()=>engine.resize());
  </script>
</body>
