<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Space Battle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;
  display:flex;justify-content:center;padding-top:8px}
#title{text-align:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 28px;
  color:#fff;font-size:15px;font-weight:600;letter-spacing:1px;text-shadow:0 0 12px rgba(255,255,255,.15)}
#bars{position:fixed;bottom:0;left:0;right:0;pointer-events:none;z-index:10;
  display:flex;justify-content:space-between;align-items:flex-end;padding:14px 18px}
.tb{text-align:center;min-width:160px}
.tb .nm{font-size:11px;font-weight:700;letter-spacing:1.5px;margin-bottom:5px;text-shadow:0 0 10px currentColor}
.tb.a .nm{color:#00aaff}
.tb.b .nm{color:#ff4444}
.bwrap{width:160px;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin:0 auto 3px}
.bfill{height:100%;border-radius:4px;transition:width .3s}
.tb.a .bfill{background:linear-gradient(90deg,#0055aa,#00ddff)}
.tb.b .bfill{background:linear-gradient(90deg,#aa2222,#ff5544)}
.tb .st{font-size:10px;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
#info{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.25);font-size:10px;pointer-events:none;z-index:10}
#log{position:fixed;top:60px;right:12px;pointer-events:none;z-index:10;
  font-size:11px;color:rgba(255,255,255,.6);text-align:right;line-height:1.7}
#log .a{color:#00ccff}
#log .b{color:#ff6655}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="title">⚡ SPACE BATTLE ⚡</div></div>
<div id="bars">
  <div class="tb a"><div class="nm">▲ BLUE FLEET</div><div class="bwrap"><div class="bfill" id="bf" style="width:100%"></div></div><div class="st" id="bs">10 / 10 ships</div></div>
  <div class="tb b"><div class="nm">RED FLEET ▼</div><div class="bwrap"><div class="bfill" id="rf" style="width:100%"></div></div><div class="st" id="rs">10 / 10 ships</div></div>
</div>
<div id="info">Click & drag to orbit · Scroll to zoom</div>
<div id="log" id="logEl"></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
'use strict';

var canvas=document.getElementById('c');
var engine=new BABYLON.Engine(canvas,true,{stencil:true},true);
var scene=new BABYLON.Scene(engine);
var logEl=document.getElementById('log');
var logLines=[];

function addLog(msg,cls){
  logLines.unshift({m:msg,c:cls});
  if(logLines.length>5)logLines.pop();
  logEl.innerHTML=logLines.map(function(l){return '<span class="'+l.c+'">'+l.m+'</span>';}).join('<br>');
}

// ═══════════════════════════════════════
//  SCENE SETUP
// ═══════════════════════════════════════
scene.clearColor=new BABYLON.Color4(0.008,0.008,0.025,1);
scene.ambientColor=new BABYLON.Color3(0.06,0.06,0.1);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=0.0008;
scene.fogColor=new BABYLON.Color3(0.008,0.008,0.025);

var camera=new BABYLON.ArcRotateCamera("cam",-0.8,1.05,130,new BABYLON.Vector3(0,0,0),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=35;
camera.upperRadiusLimit=350;
camera.lowerBetaLimit=0.15;
camera.upperBetaLimit=Math.PI-0.15;
camera.wheelPrecision=10;
camera.panningAxis=new BABYLON.Vector3(1,0,1);
camera.maxZ=600;

var hl=new BABYLON.HemisphericLight("hl",new BABYLON.Vector3(0,1,0.3),scene);
hl.intensity=0.35;
hl.groundColor=new BABYLON.Color3(0.01,0.01,0.04);

var dl=new BABYLON.DirectionalLight("dl",new BABYLON.Vector3(-1,-2.5,-1).normalize(),scene);
dl.intensity=0.7;
dl.diffuse=new BABYLON.Color3(0.95,0.92,1.0);

var gl=new BABYLON.PointLight("gl",new BABYLON.Vector3(0,30,0),scene);
gl.intensity=0.3;
gl.range=150;
gl.diffuse=new BABYLON.Color3(0.4,0.4,0.7);

// ═══════════════════════════════════════
//  STARFIELD & NEBULA
// ═══════════════════════════════════════
function createStarfield(){
  var sb=BABYLON.MeshBuilder.CreateSphere("sky",{diameter:500,segments:16,sideOrientation:BABYLON.Mesh.BACKSIDE},scene);
  var sm=new BABYLON.StandardMaterial("skyM",scene);
  sm.emissiveColor=new BABYLON.Color3(0.04,0.04,0.08);
  sm.disableLighting=true;
  sb.material=sm;

  var ps=new BABYLON.ParticleSystem("stars",2500,scene);
  ps.createPointEmitter(new BABYLON.Vector3(-240,-240,-240),new BABYLON.Vector3(240,240,240));
  ps.emitter=BABYLON.Vector3.Zero();
  ps.particleEmitterType=new BABYLON.SphereParticleEmitter(250);
  var st=BABYLON.DynamicTexture("stTex",32,scene,false);
  var ctx=st.getContext();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(16,16,6,0,6.28);ctx.fill();
  st.update();
  ps.particleTexture=st;
  ps.emitRate=2500;
  ps.minLifeTime=9999;ps.maxLifeTime=9999;
  ps.minSize=0.04;ps.maxSize=0.28;
  ps.color1=new BABYLON.Color4(1,1,1,1);
  ps.color2=new BABYLON.Color4(0.6,0.7,1,1);
  ps.colorDead=new BABYLON.Color4(1,1,1,1);
  ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps.start();

  var ns=new BABYLON.ParticleSystem("neb",350,scene);
  ns.createPointEmitter(new BABYLON.Vector3(-1,-1,-1),new BABYLON.Vector3(1,1,1));
  ns.emitter=new BABYLON.Vector3(0,20,-80);
  ns.particleEmitterType=new BABYLON.SphereParticleEmitter(130);
  var nebT=BABYLON.DynamicTexture("nebT",128,scene,false);
  var nc=nebT.getContext();
  var gr=nc.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,"rgba(80,40,140,0.5)");
  gr.addColorStop(0.4,"rgba(40,80,160,0.25)");
  gr.addColorStop(1,"rgba(0,0,0,0)");
  nc.fillStyle=gr;nc.fillRect(0,0,128,128);
  nebT.update();
  ns.particleTexture=nebT;
  ns.emitRate=35;
  ns.minLifeTime=9999;ns.maxLifeTime=9999;
  ns.minSize=18;ns.maxSize=45;
  ns.color1=new BABYLON.Color4(0.25,0.12,0.55,0.055);
  ns.color2=new BABYLON.Color4(0.12,0.25,0.65,0.055);
  ns.colorDead=new BABYLON.Color4(0,0,0,0);
  ns.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  ns.start();

  // ambient dust
  var dust=new BABYLON.ParticleSystem("dust",150,scene);
  dust.createPointEmitter(new BABYLON.Vector3(-1,0,-1),new BABYLON.Vector3(1,0.5,1));
  dust.emitter=BABYLON.Vector3.Zero();
  dust.particleEmitterType=new BABYLON.SphereParticleEmitter(55);
  var dt=BABYLON.DynamicTexture("dtTex",16,scene,false);
  var dc=dt.getContext();
  dc.fillStyle="#fff";dc.beginPath();dc.arc(8,8,3,0,6.28);dc.fill();
  dt.update();
  dust.particleTexture=dt;
  dust.emitRate=12;
  dust.minLifeTime=15;dust.maxLifeTime=25;
  dust.minSize=0.08;dust.maxSize=0.25;
  dust.minEmitPower=0.05;dust.maxEmitPower=0.15;
  dust.color1=new BABYLON.Color4(1,1,1,0.25);
  dust.color2=new BABYLON.Color4(0.6,0.7,1,0.15);
  dust.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  dust.start();
}

// ═══════════════════════════════════════
//  MATERIALS FACTORY
// ═══════════════════════════════════════
var M={};
function makeMats(){
  var mc={blue:{d:[0.12,0.28,0.65],e:[0.03,0.08,0.2]},red:{d:[0.65,0.12,0.12],e:[0.2,0.04,0.04]}};
  ['blue','red'].forEach(function(t){
    var c=mc[t];
    M[t+'Body']=new BABYLON.StandardMaterial(t+'B',scene);
    M[t+'Body'].diffuseColor=new BABYLON.Color3(c.d[0],c.d[1],c.d[2]);
    M[t+'Body'].specularColor=new BABYLON.Color3(0.35,0.35,0.4);
    M[t+'Body'].emissiveColor=new BABYLON.Color3(c.e[0],c.e[1],c.e[2]);

    M[t+'Eng']=new BABYLON.StandardMaterial(t+'E',scene);
    M[t+'Eng'].emissiveColor=new BABYLON.Color3(
      t==='blue'?0.3:0.8, t==='blue'?0.6:0.15, t==='blue'?1.0:0.05);
    M[t+'Eng'].disableLighting=true;
    M[t+'Eng'].alpha=0.75;
  });
  M.cock=new BABYLON.StandardMaterial("cock",scene);
  M.cock.diffuseColor=new BABYLON.Color3(0.35,0.55,0.65);
  M.cock.emissiveColor=new BABYLON.Color3(0.1,0.2,0.35);
  M.cock.alpha=0.55;

  M.projBlue=new BABYLON.StandardMaterial("pb",scene);
  M.projBlue.emissiveColor=new BABYLON.Color3(0.4,0.7,1);
  M.projBlue.disableLighting=true;M.projBlue.alpha=0.9;

  M.projRed=new BABYLON.StandardMaterial("pr",scene);
  M.projRed.emissiveColor=new BABYLON.Color3(1,0.35,0.15);
  M.projRed.disableLighting=true;M.projRed.alpha=0.9;

  M.debris=new BABYLON.StandardMaterial("deb",scene);
  M.debris.emissiveColor=new BABYLON.Color3(0.8,0.4,0.1);
  M.debris.disableLighting=true;
}

// ═══════════════════════════════════════
//  SHIP MODEL BUILDER
// ═══════════════════════════════════════
function buildShip(team,flag){
  var g=new BABYLON.TransformNode("sG",scene);
  var s=flag?2.2:1;
  var bm=M[team+'Body'];
  var em=M[team+'Eng'];

  // main hull
  var h=BABYLON.MeshBuilder.CreateCylinder("h",{height:4.8*s,diameterTop:0.15*s,diameterBottom:1.4*s,tessellation:8},scene);
  h.rotation.x=Math.PI/2;h.material=bm;h.parent=g;

  // center ridge
  var ridge=BABYLON.MeshBuilder.CreateBox("rd",{width:0.35*s,height:0.45*s,depth:3.2*s},scene);
  ridge.position.y=0.42*s;ridge.material=bm;ridge.parent=g;

  // cockpit sphere
  var ck=BABYLON.MeshBuilder.CreateSphere("ck",{diameter:0.65*s,segments:8},scene);
  ck.position.set(0,0.25*s,1.6*s);ck.material=M.cock;ck.parent=g;

  // wings
  var wp=flag?1.9:1.5;
  [-1,1].forEach(function(d){
    var w=BABYLON.MeshBuilder.CreateBox("w",{width:wp*s,height:0.08*s,depth:2.4*s},scene);
    w.position.set(d*wp*s/2,0,0.15*s);w.rotation.y=d*0.12;w.material=bm;w.parent=g;

    // wing tip accent
    var tip=BABYLON.MeshBuilder.CreateBox("tip",{width:0.3*s,height:0.12*s,depth:0.6*s},scene);
    tip.position.set(d*wp*s,0,0.3*s);
    var tipM=new BABYLON.StandardMaterial("tipM",scene);
    tipM.emissiveColor=team==='blue'?new BABYLON.Color3(0.2,0.5,1):new BABYLON.Color3(1,0.3,0.1);
    tipM.disableLighting=true;
    tip.material=tipM;tip.parent=g;

    // engines
    var eg=BABYLON.MeshBuilder.CreateCylinder("eg",{height:1.6*s,diameter:0.5*s,tessellation:8},scene);
    eg.position.set(d*wp*s/2,0,-2.2*s);eg.rotation.x=Math.PI/2;eg.material=em;eg.parent=g;

    // engine inner
    var ei=BABYLON.MeshBuilder.CreateCylinder("ei",{height:0.4*s,diameter:0.35*s,tessellation:8},scene);
    ei.position.set(d*wp*s/2,0,-2.8*s);ei.rotation.x=Math.PI/2;
    var eiM=new BABYLON.StandardMaterial("eiM",scene);
    eiM.emissiveColor=new BABYLON.Color3(0.15,0.25,0.5);
    eiM.disableLighting=true;ei.material=eiM;ei.parent=g;
  });

  if(flag){
    [-1,1].forEach(function(d){
      var w2=BABYLON.MeshBuilder.CreateBox("w2",{width:0.7*s,height:0.06*s,depth:3.8*s},scene);
      w2.position.set(d*(wp+0.6)*s/2,-0.15*s,-0.3*s);w2.rotation.y=d*0.2;w2.material=bm;w2.parent=g;
    });
    // dorsal fin
    var df=BABYLON.MeshBuilder.CreateBox("df",{width:0.06*s,height:1.4*s,depth:2.2*s},scene);
    df.position.set(0,1.2*s,-0.8*s);df.material=bm;df.parent=g;
    // tail
    var tail=BABYLON.MeshBuilder.CreateBox("tail",{width:2.2*s,height:0.06*s,depth:0.8*s},scene);
    tail.position.set(0,0.05*s,-2.6*s);tail.material=bm;tail.parent=g;
  }

  // engine glow light
  var el=new BABYLON.PointLight("eL",new BABYLON.Vector3(0,0,-3*s),scene);
  var ec=team==='blue'?new BABYLON.Color3(0.3,0.55,1):new BABYLON.Color3(1,0.35,0.1);
  el.diffuse=ec;el.intensity=flag?2.2:1.0;el.range=flag?28:16;el.parent=g;

  return g;
}

// ═══════════════════════════════════════
//  HEALTH BAR
// ═══════════════════════════════════════
function makeHPBar(parent,team){
  var dt=new BABYLON.DynamicTexture("hpt",{width:80,height:14},scene,false);
  dt.hasAlpha=true;
  var plane=BABYLON.MeshBuilder.CreatePlane("hp",{width:3.2,height:0.5},scene);
  plane.position.y=2.8;plane.parent=parent;
  plane.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL;
  var hm=new BABYLON.StandardMaterial("hm",scene);
  hm.diffuseTexture=dt;hm.emissiveColor=new BABYLON.Color3(1,1,1);
  hm.disableLighting=true;hm.backFaceCulling=false;
  plane.material=hm;
  return dt;
}

function updHP(dt,hp,max,team){
  var ctx=dt.getContext();
  ctx.clearRect(0,0,80,14);
  ctx.fillStyle="rgba(0,0,0,0.55)";
  ctx.fillRect(0,0,80,14);
  var r=Math.max(0,hp/max);
  var col;
  if(r>0.6)col="#00ee66";else if(r>0.3)col="#eedd00";else col="#ee2222";
  ctx.fillStyle=col;
  ctx.fillRect(1,1,78*r,12);
  ctx.strokeStyle=team==='blue'?"rgba(0,170,255,0.5)":"rgba(255,68,68,0.5)";
  ctx.lineWidth=1;ctx.strokeRect(0,0,80,14);
  dt.update();
}

// ═══════════════════════════════════════
//  SHIP FACTORY
// ═══════════════════════════════════════
var ships=[],projs=[],explos=[];

function mkShip(team,type,pos){
  var flag=type==='flagship';
  var g=buildShip(team,flag);
  g.position.copyFrom(pos);
  var s={group:g,team:team,type:type,pos:pos.clone(),
    vel:new BABYLON.Vector3(0,0,0),
    hp:flag?250:60,maxHP:flag?250:60,
    alive:true,target:null,
    cd:1+Math.random()*1.5,
    hitT:0,deathT:0,sz:flag?4.5:2.2};
  s.hpTex=makeHPBar(g,team);
  updHP(s.hpTex,s.hp,s.maxHP,team);
  return s;
}

function spawnFleet(team){
  var x=team==='blue'?-55:55;
  var zOff=team==='blue'?0:Math.PI/3;
  var arr=[];
  arr.push(mkShip(team,'flagship',new BABYLON.Vector3(x,0,0)));
  for(var i=0;i<9;i++){
    var a=(i/9)*Math.PI*2+zOff;
    var r=8+(i%3)*4;
    arr.push(mkShip(team,'escort',new BABYLON.Vector3(x+Math.cos(a)*r*0.3, Math.sin(a)*r*0.25, Math.sin(a)*r*0.3)));
  }
  return arr;
}

// ═══════════════════════════════════════
//  TRAIL PARTICLE SYSTEM
// ═══════════════════════════════════════
function mkTrail(parent,team){
  var ps=new BABYLON.ParticleSystem("tr",80,scene);
  ps.emitter=parent;
  var tt=BABYLON.DynamicTexture("tt",16,scene,false);
  var tc=tt.getContext();
  tc.fillStyle="#fff";tc.beginPath();tc.arc(8,8,5,0,6.28);tc.fill();tt.update();
  ps.particleTexture=tt;
  ps.minEmitBox=new BABYLON.Vector3(-0.12,-0.12,-0.12);
  ps.maxEmitBox=new BABYLON.Vector3(0.12,0.12,0.12);
  ps.emitRate=50;
  ps.minLifeTime=0.25;ps.maxLifeTime=0.7;
  ps.minSize=0.08;ps.maxSize=0.35;
  ps.minEmitPower=0.5;ps.maxEmitPower=1.5;
  ps.targetStopDuration=0.6;
  ps.color1=team==='blue'?new BABYLON.Color4(0.4,0.75,1,1):new BABYLON.Color4(1,0.45,0.2,1);
  ps.color2=team==='blue'?new BABYLON.Color4(0.1,0.3,0.8,0.7):new BABYLON.Color4(0.8,0.2,0.05,0.7);
  ps.colorDead=new BABYLON.Color4(0,0,0,0);
  ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps.start();
  return ps;
}

// ═══════════════════════════════════════
//  PROJECTILE SPAWNER
// ═══════════════════════════════════════
function spawnProj(ship){
  if(!ship.alive||!ship.target)return;
  var dir=ship.target.pos.subtract(ship.pos);
  if(dir.length()<1)return;
  dir.normalize();
  var right=BABYLON.Vector3.Cross(dir,new BABYLON.Vector3(0,1,0)).normalize();
  var num=ship.type==='flagship'?2:1;
  var spread=ship.type==='flagship'?1.2:0;
  var offsets=num===2?[-spread/2,spread/2]:[0];

  offsets.forEach(function(off){
    var spd=ship.type==='flagship'?55:48;
    var mesh=BABYLON.MeshBuilder.CreateSphere("p",{diameter:0.45,segments:5},scene);
    mesh.material=ship.team==='blue'?M.projBlue:M.projRed;
    var p=mesh.position=ship.pos.add(dir.scale(3)).add(right.scale(off));
    var trail=mkTrail(mesh,ship.team);

    var pl=new BABYLON.PointLight("pL",p,scene);
    pl.diffuse=ship.team==='blue'?new BABYLON.Color3(0.3,0.6,1):new BABYLON.Color3(1,0.3,0.1);
    pl.intensity=1.2;pl.range=10;pl.parent=mesh;

    projs.push({mesh:mesh,trail:trail,light:pl,team:ship.team,
      pos:p.clone(),vel:dir.scale(spd),life:3.0,
      dmg:ship.type==='flagship'?18:12});
  });
}

// ═══════════════════════════════════════
//  EXPLOSION SYSTEM
// ═══════════════════════════════════════
function createExplosion(pos,color,delay){
  var p=pos.clone();
  var c=color||new BABYLON.Color3(1,0.6,0.2);
  var alive=true,t=0;

  var tex16=BABYLON.DynamicTexture("ex16",16,scene,false);
  var ctx16=tex16.getContext();
  ctx16.fillStyle="#fff";ctx16.beginPath();ctx16.arc(8,8,6,0,6.28);ctx16.fill();tex16.update();

  var tex64=BABYLON.DynamicTexture("ex64",64,scene,false);
  var ctx64=tex64.getContext();
  var gr=ctx64.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(0.2,"rgba(255,220,100,0.8)");
  gr.addColorStop(0.6,"rgba(255,80,20,0.4)");gr.addColorStop(1,"rgba(0,0,0,0)");
  ctx64.fillStyle=gr;ctx64.fillRect(0,0,64,64);tex64.update();

  // fire
  var fire=new BABYLON.ParticleSystem("fire",400,scene);
  fire.emitter=p;
  fire.particleTexture=tex64;
  fire.emitRate=0;
  fire.createPointEmitter(new BABYLON.Vector3(-1,-1,-1),new BABYLON.Vector3(1,1,1));
  fire.minLifeTime=0.25;fire.maxLifeTime=0.9;
  fire.minSize=0.6;fire.maxSize=3.5;
  fire.minEmitPower=6;fire.maxEmitPower=22;
  fire.color1=new BABYLON.Color4(1,1,0.85,1);
  fire.color2=new BABYLON.Color4(1,0.45,0.08,0.85);
  fire.colorDead=new BABYLON.Color4(0.15,0.02,0.01,0);
  fire.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;

  // sparks
  var sparks=new BABYLON.ParticleSystem("spk",500,scene);
  sparks.emitter=p;sparks.particleTexture=tex16;
  sparks.emitRate=0;
  sparks.createPointEmitter(new BABYLON.Vector3(-1,-1,-1),new BABYLON.Vector3(1,1,1));
  sparks.minLifeTime=0.4;sparks.maxLifeTime=1.6;
  sparks.minSize=0.06;sparks.maxSize=0.22;
  sparks.minEmitPower=12;sparks.maxEmitPower=35;
  sparks.gravity=new BABYLON.Vector3(0,-1.5,0);
  sparks.color1=new BABYLON.Color4(1,0.95,0.65,1);
  sparks.color2=new BABYLON.Color4(1,0.55,0.15,0.85);
  sparks.colorDead=new BABYLON.Color4(0.2,0.05,0,0);
  sparks.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;

  // shockwave ring
  var ring=BABYLON.MeshBuilder.CreateTorus("rng",{diameter:0.5,thickness:0.4,tessellation:32},scene);
  ring.position.copyFrom(p);
  var rm=new BABYLON.StandardMaterial("rm",scene);
  rm.emissiveColor=new BABYLON.Color3(c.r*1.8,c.g*1.8,c.b*1.8);
  rm.disableLighting=true;rm.backFaceCulling=false;rm.alpha=0.85;
  rm.useAlphaFromDiffuseTexture=false;
  ring.material=rm;

  var ring2=BABYLON.MeshBuilder.CreateTorus("rng2",{diameter:0.3,thickness:0.25,tessellation:32},scene);
  ring2.position.copyFrom(p);
  var rm2=new BABYLON.StandardMaterial("rm2",scene);
  rm2.emissiveColor=new BABYLON.Color3(1,0.7,0.3);
  rm2.disableLighting=true;rm2.backFaceCulling=false;rm2.alpha=0.7;
  ring2.material=rm2;

  // debris pieces
  var debris=[];
  for(var i=0;i<14;i++){
    var shapes=[function(){return BABYLON.MeshBuilder.CreateBox("d",{size:0.25+Math.random()*0.4},scene);},
                function(){return BABYLON.MeshBuilder.CreateCylinder("d",{height:0.35,diameterTop:0,diameterBottom:0.35,tessellation:4},scene);},
                function(){return BABYLON.MeshBuilder.CreateSphere("d",{diameter:0.2+Math.random()*0.25,segments:3},scene);}];
    var dp=shapes[Math.floor(Math.random()*3)]();
    var dm=new BABYLON.StandardMaterial("dm",scene);
    dm.emissiveColor=new BABYLON.Color3(c.r*0.9,c.g*0.5,c.b*0.2);
    dm.disableLighting=true;dp.material=dm;
    dp.position.copyFrom(p);
    var ddir=new BABYLON.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*2,(Math.random()-0.5)*2).normalize();
    debris.push({m:dp,v:ddir.scale(5+Math.random()*12),
      av:new BABYLON.Vector3((Math.random()-0.5)*8,(Math.random()-0.5)*8,(Math.random()-0.5)*8),
      g:2+Math.random()*3});
  }

  // point flash
  var flash=new BABYLON.PointLight("fl",p,scene);
  flash.diffuse=new BABYLON.Color3(c.r*2,c.g*2,c.b*2);
  flash.intensity=12;flash.range=50;

  // chain reaction tracking
  var chainDone=false;

  function start(){
    fire.start();sparks.start();
    fire.manualEmitCount=200;
    sparks.manualEmitCount=250;
  }

  function update(dt){
    if(!alive)return false;
    t+=dt;

    if(t<0.06&&delay<=0&&fire.emitter)fire.emitRate=500;
    else{fire.emitRate=Math.max(0,400*(1-t/1.2));sparks.emitRate=Math.max(0,300*(1-t/1.8));}

    var rs=Math.min(t*35,25);
    ring.scaling.set(rs,rs,rs);rm.alpha=Math.max(0,0.85*(1-t/0.7));
    var rs2=Math.min(t*22,18);ring2.scaling.set(rs2,rs2,rs2);
    rm2.alpha=Math.max(0,0.65*(1-t/0.5));

    flash.intensity=Math.max(0,12*(1-t*5));

    debris.forEach(function(d){
      d.m.position.addInPlace(d.v.scale(dt));
      d.v.y-=d.g*dt;
      d.m.rotation.x+=d.av.x*dt;d.m.rotation.y+=d.av.y*dt;d.m.rotation.z+=d.av.z*dt;
      d.m.scaling.scaleInPlace(0.995);
    });

    // chain reaction at 0.12s
    if(!chainDone&&t>=0.12){
      chainDone=true;
      ships.forEach(function(s){
        if(s.alive&&s.deathT<=0){
          var d=s.pos.subtract(p).length();
          if(d<5.5){
            destroyShip(s);
          }
        }
      });
    }

    if(t>2.2){dispose();alive=false;}
    return alive;
  }

  function dispose(){
    try{fire.dispose();}catch(e){}
    try{sparks.dispose();}catch(e){}
    try{ring.dispose();}catch(e){}
    try{rm.dispose();}catch(e){}
    try{ring2.dispose();}catch(e){}
    try{rm2.dispose();}catch(e){}
    try{flash.dispose();}catch(e){}
    debris.forEach(function(d){try{d.m.dispose();d.m.material.dispose();}catch(e){}});
  }

  if(delay>0){setTimeout(start,delay*1000);}
  else{start();}

  return{update:update};
}

// ═══════════════════════════════════════
//  SHIP DESTRUCTION
// ═══════════════════════════════════════
function destroyShip(s){
  if(!s.alive)return;
  s.alive=false;
  var ec=s.team==='blue'?new BABYLON.Color3(0.3,0.55,1):new BABYLON.Color3(1,0.35,0.1);
  explos.push(createExplosion(s.pos,ec,0));
  s.group.dispose();
  addLog((s.team==='blue'?'Blue':'Red')+' '+(s.type==='flagship'?'Flagship':'Ship')+' destroyed!',s.team==='blue'?'a':'b');
}

// ═══════════════════════════════════════
//  TARGETING
// ═══════════════════════════════════════
function findTarget(s){
  var best=null,bd=9999;
  ships.forEach(function(e){
    if(e.team===s.team||!e.alive)return;
    var d=BABYLON.Vector3.Distance(s.pos,e.pos);
    var w=e.type==='flagship'?0.4:1;
    if(d*w<bd){bd=d*w;best=e;}
  });
  return best;
}

// ═══════════════════════════════════════
//  AI UPDATE
// ═══════════════════════════════════════
function updateShip(s,dt){
  if(!s.alive)return;

  // hit flash
  if(s.hitT>0){
    s.hitT-=dt;
    var f=Math.max(0,s.hitT/0.12);
    var base=s.team==='blue'?[0.03,0.08,0.2]:[0.2,0.04,0.04];
    M[s.team+'Body'].emissiveColor.set(base[0]+f*0.9,base[1]+f*0.3,base[2]+f*0.1);
  }

  // retarget
  if(!s.target||!s.target.alive){s.target=findTarget(s);}
  if(!s.target||!s.target.alive)return;

  var toT=s.target.pos.subtract(s.pos);
  var dist=toT.length();
  var dir=toT.normalize();

  // desired velocity
  var des;
  if(dist>28)des=dir.scale(18);
  else if(dist>14)des=dir.scale(9);
  else des=dir.scale(4);

  // separation from same-team ships
  var sep=new BABYLON.Vector3(0,0,0);
  ships.forEach(function(o){
    if(o===s||o.team!==s.team||!o.alive)return;
    var d=s.pos.subtract(o.pos);
    var l=d.length();
    if(l<5&&l>0.01){sep.addInPlace(d.normalize().scale(8/(l+0.5)));}
  });
  des.addInPlace(sep);

  // smooth steering
  s.vel=BABYLON.Vector3.Lerp(s.vel,des,Math.min(1,3.5*dt));

  // jitter
  s.vel.x+=(Math.random()-0.5)*0.4*dt;
  s.vel.y+=(Math.random()-0.5)*0.5*dt;
  s.vel.z+=(Math.random()-0.5)*0.4*dt;

  s.pos.addInPlace(s.vel.scale(dt));

  // bounds
  var lim=85;
  ['x','y','z'].forEach(function(a){
    s.pos[a]=Math.max(-lim,Math.min(lim,s.pos[a]));
  });

  // look toward target
  var lt=s.target.pos.subtract(s.pos);
  if(lt.length()>0.5){
    var tr=BABYLON.Vector3.GetAngleBetweenVectors(
      new BABYLON.Vector3(0,0,1),
      new BABYLON.Vector3(lt.x,0,lt.z),
      new BABYLON.Vector3(0,1,0));
    var trY=Math.atan2(lt.y,Math.sqrt(lt.x*lt.x+lt.z*lt.z));
    s.group.rotation.y=BABYLON.Scalar.Lerp(s.group.rotation.y,tr,Math.min(1,7*dt));
    s.group.rotation.x=BABYLON.Scalar.Lerp(s.group.rotation.x,-trY,Math.min(1,5*dt));
  }

  s.group.position.copyFrom(s.pos);

  // firing
  s.cd-=dt;
  if(s.cd<=0&&dist<55){
    spawnProj(s);
    s.cd=s.type==='flagship'?2.8:2.8+Math.random()*0.4;
  }

  // engine glow pulse
  var engLight=s.group.getChildMeshes && s.group.getChildMeshes().find(function(m){return m.name==='eL';});
  // just let it stay constant
}

// ═══════════════════════════════════════
//  PROJECTILE UPDATE
// ═══════════════════════════════════════
function updateProjs(dt){
  for(var i=projs.length-1;i>=0;i--){
    var p=projs[i];
    p.pos.addInPlace(p.vel.scale(dt));
    p.mesh.position.copyFrom(p.pos);
    p.life-=dt;

    if(p.life<=0||p.pos.length()>120){
      try{p.trail.stop();}catch(e){}
      setTimeout(function(){try{p.mesh.dispose();p.trail.dispose();p.light.dispose();}catch(e){}},700);
      projs.splice(i,1);continue;
    }

    // hit detection
    var hit=false;
    for(var j=0;j<ships.length;j++){
      var s=ships[j];
      if(s.team===p.team||!s.alive)continue;
      var d=BABYLON.Vector3.Distance(p.pos,s.pos);
      if(d<s.sz){
        s.hp-=p.dmg;
        s.hitT=0.12;
        hit=true;
        updHP(s.hpTex,s.hp,s.maxHP,s.team);
        if(s.hp<=0)destroyShip(s);
        break;
      }
    }

    if(hit){
      try{p.trail.stop();}catch(e){}
      // mini flash
      var mf=new BABYLON.PointLight("mf",p.pos.clone(),scene);
      mf.diffuse=p.team==='blue'?new BABYLON.Color3(0.5,0.8,1):new BABYLON.Color3(1,0.5,0.2);
      mf.intensity=5;mf.range=12;
      setTimeout(function(){try{mf.dispose();}catch(e){}},150);
      setTimeout(function(){try{p.mesh.dispose();p.trail.dispose();p.light.dispose();}catch(e){}},600);
      projs.splice(i,1);
    }
  }
}

// ═══════════════════════════════════════
//  HUD UPDATE
// ═══════════════════════════════════════
function updateHUD(){
  var bAlive=0,bHP=0,bMax=0,rAlive=0,rHP=0,rMax=0;
  ships.forEach(function(s){
    if(s.team==='blue'){if(s.alive){bAlive++;bHP+=Math.max(0,s.hp);bMax+=s.maxHP;}}
    else{if(s.alive){rAlive++;rHP+=Math.max(0,s.hp);rMax+=s.maxHP;}}
  });
  document.getElementById('bf').style.width=(bMax>0?bHP/bMax*100:0)+'%';
  document.getElementById('rf').style.width=(rMax>0?rHP/rMax*100:0)+'%';
  document.getElementById('bs').textContent=bAlive+' / 10 ships · '+Math.round(bHP)+' HP';
  document.getElementById('rs').textContent=rAlive+' / 10 ships · '+Math.round(rHP)+' HP';
}

// ═══════════════════════════════════════
//  CAMERA FOLLOW
// ═══════════════════════════════════════
function updateCam(dt){
  var alive=ships.filter(function(s){return s.alive;});
  if(alive.length===0)return;
  var c=new BABYLON.Vector3(0,0,0);
  alive.forEach(function(s){c.addInPlace(s.pos);});
  c.scaleInPlace(1/alive.length);
  camera.target=BABYLON.Vector3.Lerp(camera.target,c,Math.min(1,1.5*dt));
}

// ═══════════════════════════════════════
//  SPAWN NEW SHIP (RESPAWN)
// ═══════════════════════════════════════
var respawnTimer=0;
function tryRespawn(dt){
  respawnTimer+=dt;
  if(respawnTimer<8)return;
  respawnTimer=0;
  ['blue','red'].forEach(function(t){
    var alive=ships.filter(function(s){return s.team===t&&s.alive;});
    if(alive.length<=2&&alive.length>0){
      var pos=new BABYLON.Vector3(
        t==='blue'?-55+Math.random()*8:55-Math.random()*8,
        (Math.random()-0.5)*15,
        (Math.random()-0.5)*20);
      var ns=mkShip(t,'escort',pos);
      ns.cd=3;
      ships.push(ns);
      addLog((t==='blue'?'Blue':'Red')+' reinforcement deployed!','a');
    }
  });
}

// ═══════════════════════════════════════
//  INIT & GAME LOOP
// ═══════════════════════════════════════
function init(){
  createStarfield();
  makeMats();

  var bFleet=spawnFleet('blue');
  var rFleet=spawnFleet('red');
  ships=bFleet.concat(rFleet);

  addLog('Battle begins!','a');
}

init();

var lastTime=performance.now();

engine.runRenderLoop(function(){
  var now=performance.now();
  var dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;

  // update ships
  ships.forEach(function(s){updateShip(s,dt);});

  // update projectiles
  updateProjs(dt);

  // update explosions
  for(var i=explos.length-1;i>=0;i--){
    if(!explos[i].update(dt)){explos.splice(i,1);}
  }

  // respawn
  tryRespawn(dt);

  // camera
  updateCam(dt);

  // HUD
  if(Math.floor(now/300)!==Math.floor((now-dt*1000)/300))updateHUD();

  scene.render();
});

window.addEventListener('resize',function(){engine.resize();});

})();
</script>
