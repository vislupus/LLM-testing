<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Battle — Babylon.js</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:-apple-system,Segoe UI,sans-serif;color:#cfe}
  #renderCanvas{width:100vw;height:100vh;display:block;touch-action:none}
  #hud{position:absolute;top:12px;left:12px;padding:10px 14px;background:rgba(10,15,30,.55);
       border:1px solid rgba(120,180,255,.25);border-radius:10px;font-size:13px;line-height:1.5;
       backdrop-filter:blur(8px);pointer-events:none;min-width:200px}
  #hud b{color:#7cf}
  .red{color:#f88}
  .blue{color:#6cf}
  #restart{position:absolute;bottom:20px;right:20px;padding:10px 18px;background:rgba(30,60,120,.7);
           border:1px solid #6af;color:#fff;border-radius:8px;cursor:pointer;font-size:13px}
  #restart:hover{background:rgba(60,100,180,.9)}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hud">
  <b>◆ SPACE BATTLE</b><br>
  Drag to orbit • Wheel to zoom<br>
  <span class="blue">Blue Fleet:</span> <span id="blueCount">10</span> ships<br>
  <span class="red">Red Fleet:</span> <span id="redCount">10</span> ships<br>
  <span id="winner"></span>
</div>
<button id="restart">↻ Restart Battle</button>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(() => {
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { stencil:true, antialias:true });

// --------------- Global state ---------------
const STATE = {
  ships: [],
  projectiles: [],
  pendingExplosions: [],   // queued chain reactions
  debrisSystems: [],
  time: 0
};

const COLORS = {
  blue: new BABYLON.Color3(0.3, 0.7, 1.0),
  red:  new BABYLON.Color3(1.0, 0.35, 0.3),
  blueE: new BABYLON.Color3(0.2, 0.6, 1.0),
  redE:  new BABYLON.Color3(1.0, 0.25, 0.2),
  hull:  new BABYLON.Color3(0.35, 0.40, 0.48),
  hullD: new BABYLON.Color3(0.20, 0.23, 0.30),
  metal: new BABYLON.Color3(0.55, 0.58, 0.62),
  fire:  [new BABYLON.Color4(1,1,0.6,1), new BABYLON.Color4(1,0.5,0.1,1), new BABYLON.Color4(0.6,0.1,0.0,0)],
  smoke: [new BABYLON.Color4(0.2,0.2,0.25,0.9), new BABYLON.Color4(0.05,0.05,0.08,0)]
};

let scene, camera, sg;

// --------------- Scene creation ---------------
function buildScene(){
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.01, 0.02, 0.05, 1.0);
  scene.ambientColor = new BABYLON.Color3(0.15, 0.17, 0.22);

  // Camera
  camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2.5, Math.PI/2.4, 90, new BABYLON.Vector3(0,0,0), scene);
  camera.lowerRadiusLimit = 25;
  camera.upperRadiusLimit = 200;
  camera.wheelPrecision = 20;
  camera.attachControl(canvas, true);

  // Lights
  const hemi = new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.45;
  hemi.diffuse = new BABYLON.Color3(0.55, 0.60, 0.75);
  hemi.groundColor = new BABYLON.Color3(0.15, 0.10, 0.25);

  const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.4, -0.6, 0.3), scene);
  sun.intensity = 1.1;
  sun.diffuse = new BABYLON.Color3(0.95, 0.92, 1.0);

  sg = new BABYLON.ShadowGenerator(1024, sun);
  sg.useBlurExponentialShadowMap = true;
  sg.darkness = 0.5;

  // A subtle glow layer for emissive thrusters & projectiles
  const gl = new BABYLON.GlowLayer("gl", scene, { mainTextureFixedSize: 512, blurKernelSize: 32 });
  gl.intensity = 0.9;

  // Starfield (SolidParticleSystem)
  buildStarfield(scene);
  buildNebula(scene);

  // Reset
  STATE.ships = [];
  STATE.projectiles = [];
  STATE.pendingExplosions = [];
  STATE.debrisSystems = [];
  STATE.time = 0;
  document.getElementById("winner").textContent = "";

  // Build two fleets
  buildFleet("blue", new BABYLON.Vector3(-35, 0, 0), new BABYLON.Vector3(1,0,0));
  buildFleet("red",  new BABYLON.Vector3( 35, 0, 0), new BABYLON.Vector3(-1,0,0));
}

// --------------- Starfield ---------------
function buildStarfield(scene){
  const COUNT = 2500;
  const starShape = BABYLON.MeshBuilder.CreatePlane("starShape", {size:0.3}, scene);
  const sps = new BABYLON.SolidParticleSystem("stars", scene, {updatable:false});
  sps.addShape(starShape, COUNT);
  starShape.dispose();
  const mesh = sps.buildMesh();
  mesh.isPickable = false;

  const mat = new BABYLON.StandardMaterial("starMat", scene);
  mat.emissiveColor = new BABYLON.Color3(1,1,1);
  mat.disableLighting = true;
  mat.backFaceCulling = false;
  mesh.material = mat;
  mesh.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

  sps.initParticles = () => {
    for (let p=0; p<sps.nbParticles; p++){
      const particle = sps.particles[p];
      // place on large sphere
      const r = 400 + Math.random()*150;
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos(2*Math.random()-1);
      particle.position.x = r*Math.sin(phi)*Math.cos(theta);
      particle.position.y = r*Math.sin(phi)*Math.sin(theta);
      particle.position.z = r*Math.cos(phi);
      const s = 0.3 + Math.random()*1.4;
      particle.scaling.setAll(s);
      // color tint
      const tint = 0.6 + Math.random()*0.4;
      particle.color = new BABYLON.Color4(tint, tint, 0.85+Math.random()*0.15, 1);
    }
  };
  sps.initParticles();
  sps.setParticles();
  sps.isAlwaysVisible = true;
  sps.computeParticleTexture = false;
  sps.computeParticleColor = false;
}

// --------------- Nebula ---------------
function buildNebula(scene){
  const nebColors = [
    new BABYLON.Color3(0.35, 0.15, 0.55),
    new BABYLON.Color3(0.15, 0.35, 0.60),
    new BABYLON.Color3(0.55, 0.20, 0.40),
    new BABYLON.Color3(0.25, 0.45, 0.55)
  ];
  for (let i=0; i<14; i++){
    const size = 40 + Math.random()*80;
    const m = BABYLON.MeshBuilder.CreateSphere("neb"+i, {diameter:size, segments:8}, scene);
    const mat = new BABYLON.StandardMaterial("nmat"+i, scene);
    const col = nebColors[i % nebColors.length].clone();
    mat.emissiveColor = col.scale(0.25);
    mat.diffuseColor = col;
    mat.alpha = 0.08 + Math.random()*0.08;
    mat.disableLighting = true;
    mat.backFaceCulling = false;
    m.material = mat;
    m.position = new BABYLON.Vector3(
      (Math.random()-0.5)*300,
      (Math.random()-0.5)*150,
      (Math.random()-0.5)*300
    );
    m.scaling = new BABYLON.Vector3(1+Math.random(), 0.5+Math.random()*0.8, 1+Math.random());
    m.isPickable = false;
  }
}

// --------------- Materials ---------------
const MAT = {};
function initMaterials(scene){
  MAT.hull = std("hull", COLORS.hull, 0.3);
  MAT.hullD = std("hullD", COLORS.hullD, 0.2);
  MAT.metal = std("metal", COLORS.metal, 0.6);
  MAT.blueAccent = std("ba", new BABYLON.Color3(0.1,0.4,0.8), 0.4);
  MAT.redAccent  = std("ra", new BABYLON.Color3(0.8,0.15,0.15), 0.4);
  MAT.thrusterBlue = stdE("tb", new BABYLON.Color3(0.3,0.8,1.0), new BABYLON.Color3(0.5,1.2,1.6));
  MAT.thrusterRed  = stdE("tr", new BABYLON.Color3(1.0,0.4,0.3), new BABYLON.Color3(1.6,0.6,0.3));
  MAT.cockpit = stdE("ck", new BABYLON.Color3(0.2,0.5,0.7), new BABYLON.Color3(0.1,0.3,0.5));

  MAT.projBlue = stdE("pb", new BABYLON.Color3(0.5,0.9,1.0), new BABYLON.Color3(1.0,1.5,2.0));
  MAT.projRed  = stdE("pr", new BABYLON.Color3(1.0,0.6,0.5), new BABYLON.Color3(2.0,0.7,0.5));

  MAT.hpGreen = stdE("hpg", new BABYLON.Color3(0.2,0.9,0.4), new BABYLON.Color3(0.3,1.2,0.5));
  MAT.hpYellow = stdE("hpy", new BABYLON.Color3(0.9,0.9,0.2), new BABYLON.Color3(1.2,1.2,0.3));
  MAT.hpRed = stdE("hpr", new BABYLON.Color3(0.9,0.2,0.2), new BABYLON.Color3(1.2,0.3,0.3));
  MAT.hpBg = std("hpbg", new BABYLON.Color3(0.1,0.1,0.12), 0.0);

  function std(n,c,spec){
    const m = new BABYLON.StandardMaterial(n, scene);
    m.diffuseColor = c;
    m.specularColor = new BABYLON.Color3(spec,spec,spec);
    m.specularPower = 32;
    return m;
  }
  function stdE(n,c,e){
    const m = new BABYLON.StandardMaterial(n, scene);
    m.diffuseColor = c;
    m.emissiveColor = e;
    m.specularColor = new BABYLON.Color3(0.1,0.1,0.1);
    return m;
  }
}

// --------------- Ship mesh builders ---------------
function buildEscort(team, scene){
  const root = new BABYLON.TransformNode("escort", scene);
  const accentMat = team === "blue" ? MAT.blueAccent : MAT.redAccent;
  const thrMat = team === "blue" ? MAT.thrusterBlue : MAT.thrusterRed;

  // Main fuselage (tapered)
  const body = BABYLON.MeshBuilder.CreateCylinder("body", {
    diameterTop: 0.5, diameterBottom: 0.9, height: 2.4, tessellation: 8
  }, scene);
  body.material = MAT.hull;
  body.rotation.z = Math.PI/2;
  body.parent = root;

  // Nose cone
  const nose = BABYLON.MeshBuilder.CreateCylinder("nose", {
    diameterTop: 0, diameterBottom: 0.5, height: 0.8, tessellation: 8
  }, scene);
  nose.material = MAT.hullD;
  nose.rotation.z = Math.PI/2;
  nose.position.x = 1.6;
  nose.parent = root;

  // Cockpit
  const ck = BABYLON.MeshBuilder.CreateSphere("ck", {diameter:0.55, segments:8}, scene);
  ck.material = MAT.cockpit;
  ck.position.set(0.7, 0.35, 0);
  ck.scaling.set(1, 0.6, 0.8);
  ck.parent = root;

  // Wings
  const wingL = BABYLON.MeshBuilder.CreateBox("wl", {width:0.4, height:0.1, depth:1.6}, scene);
  wingL.material = accentMat;
  wingL.position.set(-0.4, 0, 0.7);
  wingL.parent = root;
  const wingR = wingL.clone("wr");
  wingR.position.z = -0.7;
  wingR.parent = root;

  // Tail fin
  const fin = BABYLON.MeshBuilder.CreateBox("fin", {width:0.4, height:0.5, depth:0.1}, scene);
  fin.material = accentMat;
  fin.position.set(-0.9, 0.3, 0);
  fin.parent = root;

  // Engines (2)
  const engPositions = [[0.3],[- 0.3]];
  const engines = [];
  for (const z of engPositions){
    const eng = BABYLON.MeshBuilder.CreateCylinder("eng", {diameter:0.35, height:0.5, tessellation:8}, scene);
    eng.material = MAT.metal;
    eng.rotation.z = Math.PI/2;
    eng.position.set(-1.3, 0, z);
    eng.parent = root;
    const glow = BABYLON.MeshBuilder.CreateCylinder("eglow", {diameter:0.32, height:0.08, tessellation:12}, scene);
    glow.material = thrMat;
    glow.rotation.z = Math.PI/2;
    glow.position.set(-1.55, 0, z);
    glow.parent = root;
    engines.push(glow);
  }

  // Health bar
  const hp = makeHealthBar(scene);
  hp.root.position.set(0, 1.6, 0);
  hp.root.parent = root;

  // Thruster particle systems
  const thrustPS = [];
  for (const z of engPositions){
    const ps = new BABYLON.ParticleSystem("t", 40, scene);
    ps.emitter = root;
    ps.minEmitBox = new BABYLON.Vector3(-1.6, 0, z);
    ps.maxEmitBox = new BABYLON.Vector3(-1.6, 0, z);
    configureThruster(ps, team);
    ps.start();
    thrustPS.push(ps);
  }

  // Mark children for shadow
  root.getChildMeshes().forEach(m => { if (m.material !== thrMat && m.material !== MAT.cockpit) sg.addShadowCaster(m, true); });

  return {
    mesh: root,
    thrustPS,
    hp,
    engines,
    team,
    flagship: false,
    width: 3.0,  // length for collision reference
    collisionRadius: 1.6,
    maxHealth: 100,
    health: 100,
    velocity: BABYLON.Vector3.Zero(),
    angularVelocity: BABYLON.Vector3.Zero(),
    fireCooldown: Math.random()*3,
    isDead: false,
    wanderOffset: Math.random()*Math.PI*2,
    preferredRange: 15 + Math.random()*5
  };
}

function buildFlagship(team, scene){
  const root = new BABYLON.TransformNode("flagship", scene);
  const accentMat = team === "blue" ? MAT.blueAccent : MAT.redAccent;
  const thrMat = team === "blue" ? MAT.thrusterBlue : MAT.thrusterRed;

  // Main hull - elongated wedge
  const body = BABYLON.MeshBuilder.CreateBox("body", {width:6, height:1.2, depth:2.2}, scene);
  body.material = MAT.hull;
  body.parent = root;

  // Nose wedge (tapered box via 2 scaled boxes)
  const nose = BABYLON.MeshBuilder.CreateCylinder("nose", {
    diameterTop: 0, diameterBottom: 1.5, height: 2, tessellation: 4
  }, scene);
  nose.material = MAT.hull;
  nose.rotation.z = Math.PI/2;
  nose.rotation.y = Math.PI/4;
  nose.position.x = 4;
  nose.parent = root;

  // Command bridge
  const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {width:2.2, height:0.8, depth:1.4}, scene);
  bridge.material = MAT.hullD;
  bridge.position.set(0.5, 1.0, 0);
  bridge.parent = root;
  // Bridge windows
  const bwin = BABYLON.MeshBuilder.CreateBox("bwin", {width:2.0, height:0.3, depth:1.2}, scene);
  bwin.material = MAT.cockpit;
  bwin.position.set(0.5, 1.45, 0);
  bwin.parent = root;

  // Dorsal antenna
  const ant = BABYLON.MeshBuilder.CreateCylinder("ant", {diameter:0.1, height:1.5}, scene);
  ant.material = MAT.metal;
  ant.position.set(-0.5, 2.0, 0);
  ant.parent = root;
  const dish = BABYLON.MeshBuilder.CreateSphere("dish", {diameter:0.5, segments:8}, scene);
  dish.material = accentMat;
  dish.position.set(-0.5, 2.8, 0);
  dish.scaling.set(1, 0.4, 1);
  dish.parent = root;

  // Side wings (angular)
  const wingL = BABYLON.MeshBuilder.CreateBox("wl", {width:3, height:0.3, depth:3}, scene);
  wingL.material = accentMat;
  wingL.position.set(-1, 0, 2.3);
  wingL.parent = root;
  const wingR = wingL.clone("wr");
  wingR.position.z = -2.3;
  wingR.parent = root;
  // Wing tips
  const tipL = BABYLON.MeshBuilder.CreateBox("tl", {width:1, height:0.6, depth:0.8}, scene);
  tipL.material = MAT.hullD;
  tipL.position.set(-2, 0.2, 3.2);
  tipL.parent = root;
  const tipR = tipL.clone("tr");
  tipR.position.z = -3.2;
  tipR.parent = root;

  // Engine array (3 big engines)
  const engZs = [-0.8, 0, 0.8];
  const engines = [];
  for (const z of engZs){
    const eng = BABYLON.MeshBuilder.CreateCylinder("eng", {diameter:0.9, height:1.2, tessellation:12}, scene);
    eng.material = MAT.metal;
    eng.rotation.z = Math.PI/2;
    eng.position.set(-3.6, 0, z);
    eng.parent = root;
    const glow = BABYLON.MeshBuilder.CreateCylinder("eg", {diameter:0.8, height:0.15, tessellation:16}, scene);
    glow.material = thrMat;
    glow.rotation.z = Math.PI/2;
    glow.position.set(-4.25, 0, z);
    glow.parent = root;
    engines.push(glow);
  }

  // Weapon turrets
  for (const pos of [[1.5, 0.9, 0.8], [1.5, 0.9, -0.8], [-1.2, 0.9, 0]]){
    const base = BABYLON.MeshBuilder.CreateCylinder("tb", {diameter:0.5, height:0.3, tessellation:8}, scene);
    base.material = MAT.hullD;
    base.position.set(pos[0], pos[1], pos[2]);
    base.parent = root;
    const barrel = BABYLON.MeshBuilder.CreateCylinder("br", {diameter:0.15, height:0.7, tessellation:8}, scene);
    barrel.material = MAT.metal;
    barrel.rotation.z = Math.PI/2;
    barrel.position.set(pos[0]+0.35, pos[1]+0.1, pos[2]);
    barrel.parent = root;
  }

  // Health bar
  const hp = makeHealthBar(scene);
  hp.root.position.set(0, 3.2, 0);
  hp.root.parent = root;

  // Thruster particle systems
  const thrustPS = [];
  for (const z of engZs){
    const ps = new BABYLON.ParticleSystem("t", 80, scene);
    ps.emitter = root;
    ps.minEmitBox = new BABYLON.Vector3(-4.3, 0, z);
    ps.maxEmitBox = new BABYLON.Vector3(-4.3, 0, z);
    configureThruster(ps, team, true);
    ps.start();
    thrustPS.push(ps);
  }

  // Point light on flagship for engine glow
  const pl = new BABYLON.PointLight("flagLight", new BABYLON.Vector3(-5,0,0), scene);
  pl.diffuse = team === "blue" ? COLORS.blueE : COLORS.redE;
  pl.intensity = 0.8;
  pl.range = 15;
  pl.parent = root;

  root.getChildMeshes().forEach(m => {
    if (m.material !== thrMat && m.material !== MAT.cockpit) sg.addShadowCaster(m, true);
  });

  return {
    mesh: root,
    thrustPS,
    hp,
    engines,
    team,
    flagship: true,
    width: 8.0,
    collisionRadius: 3.5,
    maxHealth: 450,
    health: 450,
    velocity: BABYLON.Vector3.Zero(),
    angularVelocity: BABYLON.Vector3.Zero(),
    fireCooldown: Math.random()*3,
    isDead: false,
    wanderOffset: Math.random()*Math.PI*2,
    preferredRange: 22
  };
}

// --------------- Health bar ---------------
function makeHealthBar(scene){
  const root = new BABYLON.TransformNode("hp", scene);
  const bg = BABYLON.MeshBuilder.CreatePlane("bg", {width:2.2, height:0.2}, scene);
  bg.material = MAT.hpBg;
  bg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  bg.parent = root;
  const fill = BABYLON.MeshBuilder.CreatePlane("fill", {width:2.1, height:0.12}, scene);
  fill.material = MAT.hpGreen;
  fill.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  fill.position.z = -0.01;
  fill.parent = root;
  return { root, bg, fill };
}

function updateHealthBar(ship){
  const ratio = Math.max(0, ship.health / ship.maxHealth);
  ship.hp.fill.scaling.x = ratio;
  ship.hp.fill.position.x = -(1 - ratio) * 1.05; // left-aligned
  if (ratio > 0.55) ship.hp.fill.material = MAT.hpGreen;
  else if (ratio > 0.25) ship.hp.fill.material = MAT.hpYellow;
  else ship.hp.fill.material = MAT.hpRed;
}

// --------------- Thruster particle configuration ---------------
function configureThruster(ps, team, big=false){
  const col = team === "blue" ? new BABYLON.Color4(0.3,0.8,1.0,1) : new BABYLON.Color4(1.0,0.4,0.3,1);
  const colMid = team === "blue" ? new BABYLON.Color4(0.4,0.9,1.0,0.8) : new BABYLON.Color4(1.0,0.6,0.4,0.8);
  const colEnd = new BABYLON.Color4(0.1,0.1,0.2,0);

  ps.color1 = col;
  ps.color2 = colMid;
  ps.colorDead = colEnd;
  ps.minSize = big ? 0.4 : 0.2;
  ps.maxSize = big ? 0.9 : 0.5;
  ps.minLifeTime = 0.15;
  ps.maxLifeTime = 0.4;
  ps.emitRate = big ? 120 : 60;
  ps.direction1 = new BABYLON.Vector3(-1, 0, 0);
  ps.direction2 = new BABYLON.Vector3(-1, 0, 0);
  ps.minEmitPower = big ? 3 : 2;
  ps.maxEmitPower = big ? 5 : 3;
  ps.gravity = new BABYLON.Vector3(0,0,0);
  ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
}

// --------------- Fleet building ---------------
function buildFleet(team, center, facing){
  // Flagship in center
  const flag = buildFlagship(team, scene);
  flag.mesh.position.copyFrom(center);
  // orient toward enemy (facing is unit vector)
  flag.mesh.rotation.y = Math.atan2(facing.x, facing.z);
  flag.targetYaw = flag.mesh.rotation.y;
  STATE.ships.push(flag);

  // 9 escorts in layered formation around flagship
  const offsets = [
    [ 8,  2,  6],
    [ 8, -2, -6],
    [ 6,  0, 10],
    [ 6,  0,-10],
    [12,  3,  3],
    [12, -3, -3],
    [ 4,  4,  0],
    [ 4, -4,  0],
    [15,  0,  0]
  ];
  for (let i=0; i<9; i++){
    const o = offsets[i];
    const esc = buildEscort(team, scene);
    // Apply facing direction: if facing is -X, flip X offset
    const fx = facing.x < 0 ? -o[0] : o[0];
    esc.mesh.position.set(center.x + fx, center.y + o[1], center.z + o[2]);
    esc.mesh.rotation.y = Math.atan2(facing.x, facing.z);
    esc.targetYaw = esc.mesh.rotation.y;
    STATE.ships.push(esc);
  }
}

// --------------- Projectiles ---------------
function spawnProjectile(ship, targetShip, offset=0){
  const team = ship.team;
  const mat = team === "blue" ? MAT.projBlue : MAT.projRed;

  const root = new BABYLON.TransformNode("proj", scene);

  // Core sphere
  const core = BABYLON.MeshBuilder.CreateSphere("core", {diameter: 0.5, segments:8}, scene);
  core.material = mat;
  core.parent = root;

  // Glow halo (larger, semi-transparent)
  const halo = BABYLON.MeshBuilder.CreateSphere("halo", {diameter: 1.3, segments:10}, scene);
  const haloMat = new BABYLON.StandardMaterial("hm", scene);
  haloMat.emissiveColor = team === "blue" ? COLORS.blueE : COLORS.redE;
  haloMat.diffuseColor = new BABYLON.Color3(0,0,0);
  haloMat.alpha = 0.35;
  haloMat.backFaceCulling = false;
  halo.material = haloMat;
  halo.parent = root;

  // Starting position: slightly forward of ship
  const forward = ship.mesh.getDirection(new BABYLON.Vector3(0,0,1));
  const spawnPos = ship.mesh.position.add(forward.scale(ship.flagship ? 5 : 2));
  // Add lateral offset if flagship firing twin shots
  if (offset !== 0){
    const right = ship.mesh.getDirection(new BABYLON.Vector3(1,0,0));
    spawnPos.addInPlace(right.scale(offset));
  }
  root.position.copyFrom(spawnPos);

  // Velocity toward target with some lead
  const toTarget = targetShip.mesh.position.subtract(spawnPos);
  const dir = toTarget.normalize();
  const speed = 50;
  const vel = dir.scale(speed);

  // Trail particle system
  const ps = new BABYLON.ParticleSystem("trail", 200, scene);
  ps.emitter = root;
  const col1 = team === "blue" ? new BABYLON.Color4(0.5,0.9,1.0,1) : new BABYLON.Color4(1.0,0.6,0.5,1);
  const col2 = team === "blue" ? new BABYLON.Color4(0.3,0.6,1.0,0.8) : new BABYLON.Color4(1.0,0.3,0.2,0.8);
  ps.color1 = col1;
  ps.color2 = col2;
  ps.colorDead = new BABYLON.Color4(0,0,0,0);
  ps.minSize = 0.15;
  ps.maxSize = 0.35;
  ps.minLifeTime = 0.15;
  ps.maxLifeTime = 0.35;
  ps.emitRate = 180;
  ps.minEmitBox = BABYLON.Vector3.Zero();
  ps.maxEmitBox = BABYLON.Vector3.Zero();
  // Emit opposite to motion (trail)
  ps.direction1 = vel.scale(-0.05);
  ps.direction2 = vel.scale(-0.02);
  ps.minEmitPower = 0.5;
  ps.maxEmitPower = 1.5;
  ps.gravity = BABYLON.Vector3.Zero();
  ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps.start();

  // Light on projectile
  const pl = new BABYLON.PointLight("pl", root.position, scene);
  pl.diffuse = team === "blue" ? COLORS.blueE : COLORS.redE;
  pl.intensity = 0.6;
  pl.range = 6;
  pl.parent = root;

  STATE.projectiles.push({
    mesh: root,
    ps,
    light: pl,
    haloMat,
    velocity: vel,
    team,
    life: 5, // seconds before auto-despawn
    damage: ship.flagship ? 45 : 25
  });
}

// --------------- Explosions ---------------
function triggerExplosion(ship, isChain=false){
  if (ship.isDead) return;
  ship.isDead = true;

  // Stop thruster particles
  ship.thrustPS.forEach(ps => { ps.stop(); });

  const pos = ship.mesh.position.clone();
  const scale = ship.flagship ? 2.5 : 1.0;

  // === 1. Shockwave ring ===
  const ring = BABYLON.MeshBuilder.CreateTorus("ring", {diameter: 0.5, thickness:0.2, tessellation:48}, scene);
  const ringMat = new BABYLON.StandardMaterial("rm", scene);
  ringMat.emissiveColor = new BABYLON.Color3(1.0, 0.9, 0.7);
  ringMat.diffuseColor = new BABYLON.Color3(0,0,0);
  ringMat.alpha = 0.9;
  ringMat.backFaceCulling = false;
  ring.material = ringMat;
  ring.position.copyFrom(pos);
  ring.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

  const ringStart = STATE.time;
  const ringDuration = 0.6;
  ring.metadata = {
    update: (t) => {
      const age = t - ringStart;
      const k = age / ringDuration;
      if (k > 1) { ring.dispose(); ringMat.dispose(); return false; }
      const s = 0.5 + k * 20 * scale;
      ring.scaling.setAll(s);
      ringMat.alpha = (1 - k) * 0.8;
      return true;
    }
  };
  STATE.debrisSystems.push(ring.metadata);

  // Second shockwave (delayed, slower)
  setTimeout(() => {
    if (!ring.isDisposed) {
      const ring2 = BABYLON.MeshBuilder.CreateTorus("ring2", {diameter: 0.5, thickness:0.15, tessellation:48}, scene);
      const rm2 = new BABYLON.StandardMaterial("rm2", scene);
      rm2.emissiveColor = new BABYLON.Color3(0.8, 0.5, 1.0);
      rm2.alpha = 0.6;
      rm2.backFaceCulling = false;
      ring2.material = rm2;
      ring2.position.copyFrom(pos);
      ring2.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      const s2 = STATE.time;
      const m2 = { update:(t)=>{
        const k = (t - s2)/0.9;
        if (k>1){ ring2.dispose(); rm2.dispose(); return false; }
        ring2.scaling.setAll(0.5 + k*15*scale);
        rm2.alpha = (1-k)*0.5;
        return true;
      }};
      STATE.debrisSystems.push(m2);
    }
  }, 80);

  // === 2. Fire + sparks particle system ===
  const firePS = new BABYLON.ParticleSystem("fire", 600, scene);
  firePS.emitter = pos;
  firePS.minEmitBox = new BABYLON.Vector3(-1*scale, -1*scale, -1*scale);
  firePS.maxEmitBox = new BABYLON.Vector3( 1*scale,  1*scale,  1*scale);
  firePS.color1 = new BABYLON.Color4(1.0, 0.9, 0.4, 1);
  firePS.color2 = new BABYLON.Color4(1.0, 0.4, 0.1, 1);
  firePS.colorDead = new BABYLON.Color4(0.2, 0.05, 0.0, 0);
  firePS.minSize = 0.5 * scale;
  firePS.maxSize = 2.5 * scale;
  firePS.minLifeTime = 0.5;
  firePS.maxLifeTime = 1.5;
  firePS.emitRate = 800;
  firePS.direction1 = new BABYLON.Vector3(-1,-1,-1).scale(8);
  firePS.direction2 = new BABYLON.Vector3( 1, 1, 1).scale(8);
  firePS.minEmitPower = 3;
  firePS.maxEmitPower = 10;
  firePS.gravity = BABYLON.Vector3.Zero();
  firePS.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  firePS.start();
  setTimeout(() => { firePS.stop(); }, 250);
  setTimeout(() => { firePS.dispose(); }, 2500);

  // Smoke
  const smokePS = new BABYLON.ParticleSystem("smoke", 400, scene);
  smokePS.emitter = pos;
  smokePS.minEmitBox = new BABYLON.Vector3(-1*scale, -1*scale, -1*scale);
  smokePS.maxEmitBox = new BABYLON.Vector3( 1*scale,  1*scale,  1*scale);
  smokePS.color1 = new BABYLON.Color4(0.3, 0.25, 0.2, 0.9);
  smokePS.color2 = new BABYLON.Color4(0.15, 0.1, 0.08, 0.7);
  smokePS.colorDead = new BABYLON.Color4(0.05, 0.05, 0.05, 0);
  smokePS.minSize = 1.5 * scale;
  smokePS.maxSize = 4 * scale;
  smokePS.minLifeTime = 1.5;
  smokePS.maxLifeTime = 3.0;
  smokePS.emitRate = 300;
  smokePS.direction1 = new BABYLON.Vector3(-1,-1,-1).scale(4);
  smokePS.direction2 = new BABYLON.Vector3( 1, 1, 1).scale(4);
  smokePS.gravity = new BABYLON.Vector3(0, 0.3, 0);
  smokePS.start();
  setTimeout(() => { smokePS.stop(); }, 500);
  setTimeout(() => { smokePS.dispose(); }, 5000);

  // Sparks
  const sparkPS = new BABYLON.ParticleSystem("sparks", 300, scene);
  sparkPS.emitter = pos;
  sparkPS.minEmitBox = BABYLON.Vector3.Zero();
  sparkPS.maxEmitBox = BABYLON.Vector3.Zero();
  sparkPS.color1 = new BABYLON.Color4(1.0, 1.0, 0.8, 1);
  sparkPS.color2 = new BABYLON.Color4(1.0, 0.7, 0.2, 1);
  sparkPS.colorDead = new BABYLON.Color4(0.2, 0.1, 0.0, 0);
  sparkPS.minSize = 0.08;
  sparkPS.maxSize = 0.25;
  sparkPS.minLifeTime = 0.4;
  sparkPS.maxLifeTime = 1.2;
  sparkPS.emitRate = 1500;
  sparkPS.direction1 = new BABYLON.Vector3(-1,-1,-1).scale(25);
  sparkPS.direction2 = new BABYLON.Vector3( 1, 1, 1).scale(25);
  sparkPS.minEmitPower = 8;
  sparkPS.maxEmitPower = 20;
  sparkPS.gravity = BABYLON.Vector3.Zero();
  sparkPS.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  sparkPS.start();
  setTimeout(() => { sparkPS.stop(); }, 150);
  setTimeout(() => { sparkPS.dispose(); }, 2500);

  // === 3. Debris (SolidParticleSystem) ===
  const debrisCount = ship.flagship ? 40 : 20;
  const shape = BABYLON.MeshBuilder.CreateBox("sh", {size:0.3}, scene);
  const sps = new BABYLON.SolidParticleSystem("debris", scene);
  sps.addShape(shape, debrisCount);
  shape.dispose();
  const dmesh = sps.buildMesh();
  const dmat = new BABYLON.StandardMaterial("dm", scene);
  dmat.diffuseColor = COLORS.hull;
  dmat.emissiveColor = new BABYLON.Color3(0.3, 0.15, 0.05);
  dmat.specularColor = new BABYLON.Color3(0.3,0.3,0.3);
  dmesh.material = dmat;
  dmesh.isPickable = false;
  sg.addShadowCaster(dmesh);

  const debrisData = [];
  sps.initParticles = () => {
    for (let i=0; i<sps.nbParticles; i++){
      const p = sps.particles[i];
      p.position.copyFrom(pos);
      const speed = 5 + Math.random()*15;
      const dir = new BABYLON.Vector3(
        Math.random()-0.5, Math.random()-0.5, Math.random()-0.5
      ).normalize();
      const rotSpeed = new BABYLON.Vector3(
        (Math.random()-0.5)*8,
        (Math.random()-0.5)*8,
        (Math.random()-0.5)*8
      );
      const scale = 0.5 + Math.random() * (ship.flagship ? 2.5 : 1.5);
      p.scaling.setAll(scale);
      debrisData.push({ vel: dir.scale(speed), rot: rotSpeed, life: 3 + Math.random()*2 });
    }
  };
  sps.initParticles();
  sps.setParticles();

  const dMeta = {
    sps, dmesh, dmat, debrisData,
    startTime: STATE.time,
    update: (t) => {
      const dt = engine.getDeltaTime()/1000;
      let alive = false;
      for (let i=0; i<sps.nbParticles; i++){
        const p = sps.particles[i;
        const d = debrisData[i];
        const age = t - dMeta.startTime;
        if (age > d.life) continue;
        alive = true;
        p.position.addInPlace(d.vel.scale(dt));
        d.vel.scaleInPlace(0.99);
        p.rotation.addInPlace(d.rot.scale(dt));
      }
      sps.setParticles();
      if (!alive){
        dmesh.dispose();
        dmat.dispose();
        return false;
      }
      return true;
    }
  };
  STATE.debrisSystems.push(dMeta);

  // === 4. Brief flash light ===
  const flash = new BABYLON.PointLight("flash", pos, scene);
  flash.diffuse = new BABYLON.Color3(1.0, 0.9, 0.6);
  flash.intensity = 10 * scale;
  flash.range = 30 * scale;
  const flashStart = STATE.time;
  const flashMeta = {
    flash,
    update: (t) => {
      const age = t - flashStart;
      if (age > 0.4) { flash.dispose(); return false; }
      flash.intensity = (1 - age/0.4) * 10 * scale;
      return true;
    }
  };
  STATE.debrisSystems.push(flashMeta);

  // === 5. Hide ship mesh ===
  ship.mesh.setEnabled(false);

  // === 6. Chain reaction check ===
  // Chain radius ~ 1 ship-width of exploding ship (the problem's specification)
  const chainRadius = ship.width * (ship.flagship ? 1.5 : 1.2);
  STATE.ships.forEach(other => {
    if (other === ship || other.isDead) return;
    const d = BABYLON.Vector3.Distance(other.mesh.position, pos);
    if (d < chainRadius){
      // Queue with slight delay for cascade
      const delay = 150 + Math.random()*250;
      setTimeout(() => triggerExplosion(other, true), delay);
    }
  });

  // Camera shake if close
  if (camera){
    const camDist = BABYLON.Vector3.Distance(camera.target, pos);
    if (camDist < 40){
      const intensity = (1 - camDist/40) * (ship.flagship ? 1.5 : 0.6);
      shakeCamera(intensity);
    }
  }

  // Update HUD
  updateHUD();
  checkWinner();
}

// Camera shake
function shakeCamera(intensity){
  const original = camera.target.clone();
  const startT = performance.now();
  const dur = 400;
  const tick = () => {
    const k = (performance.now() - startT) / dur;
    if (k >= 1){
      camera.target.copyFrom(original);
      return;
    }
    const shake = (1 - k) * intensity;
    camera.target.x = original.x + (Math.random()-0.5) * shake;
    camera.target.y = original.y + (Math.random()-0.5) * shake;
    camera.target.z = original.z + (Math.random()-0.5) * shake;
    requestAnimationFrame(tick);
  };
  tick();
}

// --------------- AI ---------------
function updateAI(dt){
  const ships = STATE.ships;
  for (const ship of ships){
    if (ship.isDead) continue;

    // Find nearest living enemy
    let target = null;
    let minDist = Infinity;
    for (const other of ships){
      if (other.team === ship.team || other.isDead) continue;
      const d = BABYLON.Vector3.Distance(ship.mesh.position, other.mesh.position);
      if (d < minDist){ minDist = d; target = other; }
    }
    if (!target) continue;

    // Desired direction to target
    const toTarget = target.mesh.position.subtract(ship.mesh.position);
    const dist = toTarget.length();
    const dirToTarget = toTarget.normalize();

    // Compute desired yaw (around Y axis)
    // Ship forward is +Z in local space
    const desiredYaw = Math.atan2(dirToTarget.x, dirToTarget.z);

    // Smooth yaw
    let yawDiff = desiredYaw - ship.mesh.rotation.y;
    while (yawDiff > Math.PI) yawDiff -= 2*Math.PI;
    while (yawDiff < -Math.PI) yawDiff += 2*Math.PI;
    const turnRate = ship.flagship ? 0.8 : 1.6;
    ship.mesh.rotation.y += yawDiff * Math.min(1, turnRate * dt);

    // Pitch toward target (subtle)
    const horizontalDist = Math.sqrt(toTarget.x*toTarget.x + toTarget.z*toTarget.z);
    const desiredPitch = Math.atan2(toTarget.y, horizontalDist);
    let pitchDiff = desiredPitch - ship.mesh.rotation.x;
    ship.mesh.rotation.x += pitchDiff * Math.min(1, turnRate * 0.6 * dt);
    // Clamp pitch
    ship.mesh.rotation.x = Math.max(-0.6, Math.min(0.6, ship.mesh.rotation.x));

    // Thrust: accelerate if facing target roughly
    const facingAlignment = Math.abs(yawDiff);
    const forward = ship.mesh.getDirection(new BABYLON.Vector3(0,0,1));
    const accel = ship.flagship ? 8 : 14;
    const maxSpeed = ship.flagship ? 8 : 12;

    // Behavior based on distance
    let thrustFactor = 0;
    if (dist > ship.preferredRange + 5){
      thrustFactor = 1.0; // approach
    } else if (dist < ship.preferredRange - 5){
      thrustFactor = -0.4; // back off
    } else {
      // orbit / strafe
      const right = ship.mesh.getDirection(new BABYLON.Vector3(1,0,0));
      const strafeDir = Math.sin(STATE.time * 0.5 + ship.wanderOffset) > 0 ? 1 : -1;
      ship.velocity.addInPlace(right.scale(strafeDir * 2 * dt));
      thrustFactor = 0.3;
    }

    if (facingAlignment < 0.8){
      ship.velocity.addInPlace(forward.scale(accel * thrustFactor * dt));
    }

    // Drag
    ship.velocity.scaleInPlace(0.97);

    // Clamp speed
    const speed = ship.velocity.length();
    if (speed > maxSpeed) ship.velocity.scaleInPlace(maxSpeed / speed);

    // Apply velocity
    ship.mesh.position.addInPlace(ship.velocity.scale(dt));

    // Keep ships within bounds (soft constraint toward battle center)
    const bounds = 60;
    if (ship.mesh.position.length() > bounds){
      const pull = ship.mesh.position.scale(-0.5);
      ship.velocity.addInPlace(pull.scale(dt));
    }

    // Bank ship (roll based on turning)
    const targetRoll = -yawDiff * 1.5;
    ship.mesh.rotation.z += (targetRoll - ship.mesh.rotation.z) * Math.min(1, 3*dt);

    // Fire weapons
    ship.fireCooldown -= dt;
    if (ship.fireCooldown <= 0 && facingAlignment < 0.3 && dist < 60){
      if (ship.flagship){
        spawnProjectile(ship, target, -0.6);
        spawnProjectile(ship, target,  0.6);
      } else {
        spawnProjectile(ship, target, 0);
      }
      ship.fireCooldown = 3.0;
    }
  }
}

// --------------- Projectile update ---------------
function updateProjectiles(dt){
  for (let i = STATE.projectiles.length - 1; i >= 0; i--){
    const p = STATE.projectiles[i];
    p.mesh.position.addInPlace(p.velocity.scale(dt));
    p.life -= dt;

    // Collision with enemy ships
    let hit = false;
    for (const ship of STATE.ships){
      if (ship.team === p.team || ship.isDead) continue;
      const d = BABYLON.Vector3.Distance(p.mesh.position, ship.mesh.position);
      if (d < ship.collisionRadius){
        ship.health -= p.damage;
        updateHealthBar(ship);
        hit = true;
        // small hit spark
        spawnHitSpark(p.mesh.position.clone(), p.team);
        if (ship.health <= 0){
          triggerExplosion(ship);
        }
        break;
      }
    }

    if (hit || p.life <= 0){
      p.ps.stop();
      p.light.dispose();
      p.mesh.dispose();
      setTimeout(() => { try { p.ps.dispose(); } catch(e){} }, 500);
      STATE.projectiles.splice(i, 1);
    }
  }
}

function spawnHitSpark(pos, team){
  const ps = new BABYLON.ParticleSystem("hit", 80, scene);
  ps.emitter = pos;
  ps.minEmitBox = BABYLON.Vector3.Zero();
  ps.maxEmitBox = BABYLON.Vector3.Zero();
  const col = team === "blue" ? new BABYLON.Color4(0.5,0.9,1.0,1) : new BABYLON.Color4(1.0,0.6,0.4,1);
  ps.color1 = col;
  ps.color2 = new BABYLON.Color4(1,1,1,1);
  ps.colorDead = new BABYLON.Color4(0,0,0,0);
  ps.minSize = 0.1;
  ps.maxSize = 0.3;
  ps.minLifeTime = 0.15;
  ps.maxLifeTime = 0.4;
  ps.emitRate = 400;
  ps.direction1 = new BABYLON.Vector3(-1,-1,-1).scale(10);
  ps.direction2 = new BABYLON.Vector3( 1, 1, 1).scale(10);
  ps.gravity = BABYLON.Vector3.Zero();
  ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps.start();
  setTimeout(()=>{ ps.stop(); }, 100);
  setTimeout(()=>{ ps.dispose(); }, 800);
}

// --------------- Debris/effects update ---------------
function updateEffects(){
  for (let i = STATE.debrisSystems.length - 1; i >= 0; i--){
    const e = STATE.debrisSystems[i];
    if (!e.update(STATE.time)){
      STATE.debrisSystems.splice(i, 1);
    }
  }
}

// --------------- HUD ---------------
function updateHUD(){
  let b = 0, r = 0;
  STATE.ships.forEach(s => { if (!s.isDead){ if (s.team === "blue") b++; else r++; } });
  document.getElementById("blueCount").textContent = b;
  document.getElementById("redCount").textContent = r;
}

function checkWinner(){
  let b = 0, r = 0;
  STATE.ships.forEach(s => { if (!s.isDead){ if (s.team === "blue") b++; else r++; } });
  const el = document.getElementById("winner");
  if (b === 0 && r > 0) el.innerHTML = '<span class="red">🏆 RED FLEET VICTORIOUS</span>';
  else if (r === 0 && b > 0) el.innerHTML = '<span class="blue">🏆 BLUE FLEET VICTORIOUS</span>';
  else if (r === 0 && b === 0) el.innerHTML = '💥 MUTUAL DESTRUCTION';
}

// --------------- Main loop ---------------
let lastT = 0;
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now() / 1000;
  const dt = Math.min(0.05, now - lastT || 0);
  lastT = now;
  STATE.time = now;

  updateAI(dt);
  updateProjectiles(dt);
  updateEffects();

  // Pulse engine glows
  const pulse = 0.7 + Math.sin(now * 20) * 0.3;
  STATE.ships.forEach(s => {
    if (s.isDead) return;
    s.engines.forEach(e => {
      if (e.material && e.material.emissiveColor){
        // subtle flicker
      }
    });
  });

  scene.render();
}

// --------------- Init ---------------
function init(){
  initMaterials();
  buildScene();
  lastT = performance.now() / 1000;
  loop();
}

document.getElementById("restart").addEventListener("click", () => {
  // Dispose all
  STATE.projectiles.forEach(p => { try{p.mesh.dispose();}catch(e){} try{p.ps.dispose();}catch(e){} });
  STATE.debrisSystems.forEach(d => {
    try{ if(d.dmesh) d.dmesh.dispose(); if(d.dmat) d.dmat.dispose(); if(d.flash) d.flash.dispose(); }catch(e){}
  });
  // dispose all ships
  STATE.ships.forEach(s => {
    s.thrustPS.forEach(ps => { try{ps.dispose();}catch(e){} });
    try{ s.mesh.dispose(); }catch(e){}
  });
  // Rebuild everything
  scene.dispose();
  initMaterials();
  buildScene();
});

initMaterials();
init();

engine.runRenderLoop(() => {}); // not used directly; loop drives
window.addEventListener("resize", () => engine.resize());
})();
