<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Battle - Babylon.js</title>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<script>
window.addEventListener('DOMContentLoaded', function () {
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = function () {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.05, 1);

        // --- Camera ---
        const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.5, 220, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 20;
        camera.upperRadiusLimit = 400;

        // --- Lighting ---
        const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.3;

        const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
        dirLight.position = new BABYLON.Vector3(50, 100, 50);
        dirLight.intensity = 0.8;

        // GUI for Healthbars
        const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

        // --- Starfield & Nebula Background ---
        const particleSystem = new BABYLON.ParticleSystem("stars", 3000, scene);
        particleSystem.particleTexture = createStarTexture(scene);
        particleSystem.emitter = BABYLON.Vector3.Zero();
        particleSystem.minEmitBox = new BABYLON.Vector3(-300, -300, -300);
        particleSystem.maxEmitBox = new BABYLON.Vector3(300, 300, 300);
        particleSystem.color1 = new BABYLON.Color4(0.8, 0.9, 1.0, 1.0);
        particleSystem.color2 = new BABYLON.Color4(1.0, 0.7, 0.8, 1.0);
        particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
        particleSystem.minSize = 0.5;
        particleSystem.maxSize = 2.0;
        particleSystem.minLifeTime = 999999;
        particleSystem.maxLifeTime = 999999;
        particleSystem.emitRate = 3000;
        particleSystem.gravity = new BABYLON.Vector3(0, 0, 0);
        particleSystem.start();

        // --- Materials ---
        const matBlue = new BABYLON.StandardMaterial("matBlue", scene);
        matBlue.diffuseColor = new BABYLON.Color3(0.1, 0.3, 0.8);
        matBlue.emissiveColor = new BABYLON.Color3(0.05, 0.15, 0.4);

        const matRed = new BABYLON.StandardMaterial("matRed", scene);
        matRed.diffuseColor = new BABYLON.Color3(0.8, 0.1, 0.1);
        matRed.emissiveColor = new BABYLON.Color3(0.4, 0.05, 0.05);

        const matLaserBlue = new BABYLON.StandardMaterial("matLaserBlue", scene);
        matLaserBlue.emissiveColor = new BABYLON.Color3(0.2, 0.6, 1.0);
        matLaserBlue.disableLighting = true;

        const matLaserRed = new BABYLON.StandardMaterial("matLaserRed", scene);
        matLaserRed.emissiveColor = new BABYLON.Color3(1.0, 0.2, 0.2);
        matLaserRed.disableLighting = true;

        const matThruster = new BABYLON.StandardMaterial("matThruster", scene);
        matThruster.emissiveColor = new BABYLON.Color3(0.2, 0.8, 1.0);
        matThruster.disableLighting = true;

        // --- Fleet Data & Lists ---
        const ships = [];
        const projectiles = [];

        // --- Ship Generators ---
        function createShipMesh(isFlagship, isBlue) {
            const root = new BABYLON.TransformNode("shipRoot", scene);
            const bodyMat = isBlue ? matBlue : matRed;

            if (isFlagship) {
                // Larger, multi-component flagship
                const core = BABYLON.MeshBuilder.CreateBox("core", { width: 4, height: 2, depth: 10 }, scene);
                core.material = bodyMat;
                core.parent = root;

                const wingL = BABYLON.MeshBuilder.CreateBox("wingL", { width: 6, height: 0.5, depth: 4 }, scene);
                wingL.position = new BABYLON.Vector3(-4, 0, -1);
                wingL.material = bodyMat;
                wingL.parent = root;

                const wingR = wingL.clone("wingR");
                wingR.position.x = 4;
                wingR.parent = root;

                const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 2, height: 1.5, depth: 3 }, scene);
                bridge.position = new BABYLON.Vector3(0, 1.5, 1);
                bridge.material = bodyMat;
                bridge.parent = root;

                // Thrusters
                const thrusterL = BABYLON.MeshBuilder.CreateCylinder("tL", { diameter: 1.2, height: 1 }, scene);
                thrusterL.rotation.x = Math.PI / 2;
                thrusterL.position = new BABYLON.Vector3(-2, 0, -5);
                thrusterL.material = matThruster;
                thrusterL.parent = root;

                const thrusterR = thrusterL.clone("tR");
                thrusterR.position.x = 2;
                thrusterR.parent = root;

                // Thruster Light
                const tLight = new BABYLON.PointLight("tLight", new BABYLON.Vector3(0, 0, -6), scene);
                tLight.diffuse = isBlue ? new BABYLON.Color3(0.2, 0.5, 1) : new BABYLON.Color3(1, 0.3, 0.2);
                tLight.intensity = 2;
                tLight.range = 10;
                tLight.parent = root;

            } else {
                // Escort Ship
                const body = BABYLON.MeshBuilder.CreateCylinder("body", { diameterTop: 0, diameterBottom: 2, height: 5, tessellation: 4 }, scene);
                body.rotation.x = Math.PI / 2;
                body.scaling.x = 0.6;
                body.material = bodyMat;
                body.parent = root;

                const wing = BABYLON.MeshBuilder.CreateBox("wing", { width: 4, height: 0.2, depth: 2 }, scene);
                wing.position.z = -1;
                wing.material = bodyMat;
                wing.parent = root;

                // Thruster Light
                const tLight = new BABYLON.PointLight("tLight", new BABYLON.Vector3(0, 0, -3), scene);
                tLight.diffuse = isBlue ? new BABYLON.Color3(0.2, 0.5, 1) : new BABYLON.Color3(1, 0.3, 0.2);
                tLight.intensity = 1.5;
                tLight.range = 5;
                tLight.parent = root;
            }

            return root;
        }

        class Ship {
            constructor(team, isFlagship, position) {
                this.team = team; // "blue" or "red"
                this.isFlagship = isFlagship;
                this.maxHealth = isFlagship ? 500 : 100;
                this.health = this.maxHealth;
                this.radius = isFlagship ? 6 : 3; // Approx physical size
                this.speed = isFlagship ? 8 : 14;
                this.fireRate = 3.0; // Seconds between shots
                this.fireCooldown = Math.random() * this.fireRate;

                this.mesh = createShipMesh(isFlagship, team === "blue");
                this.mesh.position = position.clone();

                // Health Bar UI
                this.setupUI();

                // AI Movement targets
                this.velocity = new BABYLON.Vector3(0, 0, 0);
                this.targetPosition = position.clone();
                this.getNewTarget();
            }

            setupUI() {
                this.healthBarContainer = new BABYLON.GUI.Rectangle();
                this.healthBarContainer.width = "40px";
                this.healthBarContainer.height = "6px";
                this.healthBarContainer.cornerRadius = 2;
                this.healthBarContainer.color = "black";
                this.healthBarContainer.thickness = 1;
                this.healthBarContainer.background = "rgba(0,0,0,0.5)";
                advancedTexture.addControl(this.healthBarContainer);

                this.healthBar = new BABYLON.GUI.Rectangle();
                this.healthBar.width = "100%";
                this.healthBar.height = "100%";
                this.healthBar.cornerRadius = 2;
                this.healthBar.background = this.team === "blue" ? "#0088ff" : "#ff3333";
                this.healthBarContainer.addControl(this.healthBar);

                this.healthBarContainer.linkWithMesh(this.mesh);
                this.healthBarContainer.linkOffsetY = this.isFlagship ? -40 : -25;
            }

            getNewTarget() {
                const range = 80;
                const offsetX = (Math.random() - 0.5) * range;
                const offsetY = (Math.random() - 0.5) * (range / 2);
                const offsetZ = (Math.random() - 0.5) * range;
                const center = this.team === "blue" ? new BABYLON.Vector3(-40, 0, 0) : new BABYLON.Vector3(40, 0, 0);
                this.targetPosition = center.add(new BABYLON.Vector3(offsetX, offsetY, offsetZ));
            }

            update(dt) {
                // Movement & Maneuvers
                const dir = this.targetPosition.subtract(this.mesh.position);
                if (dir.length() < 5) {
                    this.getNewTarget();
                }

                dir.normalize();
                const targetRot = Math.atan2(dir.x, dir.z);

                // Smooth rotation turning toward velocity
                this.mesh.rotation.y = BABYLON.Scalar.LerpAngle(this.mesh.rotation.y, targetRot, dt * 2);
                this.mesh.rotation.x = BABYLON.Scalar.LerpAngle(this.mesh.rotation.x, -dir.y * 0.5, dt * 2);

                const forward = this.mesh.forward;
                this.mesh.position.addInPlace(forward.scale(this.speed * dt));

                // Shooting Logic
                this.fireCooldown -= dt;
                if (this.fireCooldown <= 0) {
                    this.fireCooldown = this.fireRate;
                    this.shoot();
                }
            }

            shoot() {
                const enemies = ships.filter(s => s.team !== this.team && s.health > 0);
                if (enemies.length === 0) return;

                // Target nearest enemy
                let closest = enemies[0];
                let minDst = BABYLON.Vector3.DistanceSquared(this.mesh.position, closest.mesh.position);
                for (let i = 1; i < enemies.length; i++) {
                    let d = BABYLON.Vector3.DistanceSquared(this.mesh.position, enemies[i].mesh.position);
                    if (d < minDst) {
                        minDst = d;
                        closest = enemies[i];
                    }
                }

                if (this.isFlagship) {
                    // Fire 2 parallel shots
                    const right = this.mesh.right;
                    createProjectile(this.mesh.position.add(right.scale(2)), closest, this.team, scene);
                    createProjectile(this.mesh.position.subtract(right.scale(2)), closest, this.team, scene);
                } else {
                    // Single shot
                    createProjectile(this.mesh.position.clone(), closest, this.team, scene);
                }
            }

            takeDamage(amount) {
                this.health -= amount;
                if (this.health < 0) this.health = 0;
                
                const pct = (this.health / this.maxHealth) * 100;
                this.healthBar.width = pct + "%";

                if (this.health <= 0) {
                    this.explode();
                }
            }

            explode(isChain = false) {
                // Trigger explosion VFX
                createExplosion(this.mesh.position.clone(), this.isFlagship ? 2.5 : 1.0, scene);

                // Clean up UI & Mesh
                this.healthBarContainer.dispose();
                this.mesh.dispose();

                // Chain reaction check to adjacent ships within ~1 ship width radius
                const explodePos = this.mesh.position.clone();
                const chainRadius = this.radius * 2.5;

                // Mark dead before processing chain to prevent infinite loops
                const myIndex = ships.indexOf(this);
                if (myIndex !== -1) ships.splice(myIndex, 1);

                setTimeout(() => {
                    for (let i = ships.length - 1; i >= 0; i--) {
                        const other = ships[i];
                        if (BABYLON.Vector3.Distance(explodePos, other.mesh.position) <= chainRadius + other.radius) {
                            other.explode(true);
                        }
                    }
                }, 150); // Slight frame delay for cascading look
            }
        }

        // --- Projectile System ---
        function createProjectile(startPos, targetShip, team, scene) {
            const mesh = BABYLON.MeshBuilder.CreateSphere("proj", { diameter: 0.8 }, scene);
            mesh.position = startPos;
            mesh.material = team === "blue" ? matLaserBlue : matLaserRed;

            // Trail System
            const trail = new BABYLON.ParticleSystem("trail", 100, scene);
            trail.particleTexture = createStarTexture(scene);
            trail.emitter = mesh;
            trail.minSize = 0.3;
            trail.maxSize = 0.6;
            trail.minLifeTime = 0.1;
            trail.maxLifeTime = 0.25;
            trail.emitRate = 80;
            trail.color1 = team === "blue" ? new BABYLON.Color4(0.2, 0.6, 1, 1) : new BABYLON.Color4(1, 0.2, 0.2, 1);
            trail.color2 = new BABYLON.Color4(1, 1, 1, 0.5);
            trail.start();

            projectiles.push({
                mesh: mesh,
                trail: trail,
                target: targetShip,
                team: team,
                speed: 45,
                life: 4.0
            });
        }

        // --- Explosion Effect ---
        function createExplosion(position, scale, scene) {
            // Bright flash light
            const light = new BABYLON.PointLight("expLight", position, scene);
            light.diffuse = new BABYLON.Color3(1, 0.5, 0.1);
            light.intensity = 15 * scale;
            light.range = 40 * scale;

            // Animate light fade
            let lightAnim = 1.0;
            const lightInterval = setInterval(() => {
                lightAnim -= 0.1;
                light.intensity = 15 * scale * lightAnim;
                if (lightAnim <= 0) {
                    light.dispose();
                    clearInterval(lightInterval);
                }
            }, 30);

            // Fire & Sparks Particle System
            const expParticles = new BABYLON.ParticleSystem("explosion", (1000 * scale), scene);
            expParticles.particleTexture = createStarTexture(scene);
            expParticles.emitter = position;
            expParticles.minEmitBox = new BABYLON.Vector3(0,0,0);
            expParticles.maxEmitBox = new BABYLON.Vector3(0,0,0);

            expParticles.color1 = new BABYLON.Color4(1, 0.8, 0.2, 1.0);
            expParticles.color2 = new BABYLON.Color4(1, 0.2, 0.0, 1.0);
            expParticles.colorDead = new BABYLON.Color4(0.2, 0.0, 0.0, 0.0);

            expParticles.minSize = 0.5 * scale;
            expParticles.maxSize = 2.5 * scale;
            expParticles.minLifeTime = 0.3 * scale;
            expParticles.maxLifeTime = 0.8 * scale;
            expParticles.emitRate = 1500 * scale;
            expParticles.manualEmitCount = 300 * scale;
            expParticles.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            expParticles.minEmitPower = 10 * scale;
            expParticles.maxEmitPower = 30 * scale;
            expParticles.start();

            // Expanding Shockwave Mesh
            const shockwave = BABYLON.MeshBuilder.CreateDisc("shockwave", { radius: 1, tessellation: 32 }, scene);
            shockwave.position = position;
            shockwave.rotation.x = Math.PI / 2;
            const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
            shockMat.emissiveColor = new BABYLON.Color3(1, 0.6, 0.1);
            shockMat.disableLighting = true;
            shockMat.alpha = 0.8;
            shockwave.material = shockMat;

            let shockScale = 1.0;
            const shockAnim = scene.onBeforeRenderObservable.add(() => {
                shockScale += 30 * engine.getDeltaTime() * scale;
                shockwave.scaling = new BABYLON.Vector3(shockScale, shockScale, shockScale);
                shockMat.alpha -= 1.5 * engine.getDeltaTime();

                if (shockMat.alpha <= 0) {
                    shockwave.dispose();
                    scene.onBeforeRenderObservable.remove(shockAnim);
                }
            });

            // Debris Mesh Particles
            for(let i = 0; i < 8 * scale; i++) {
                const chunk = BABYLON.MeshBuilder.CreateBox("chunk", { size: Math.random() * 0.8 + 0.2 }, scene);
                chunk.position = position.clone();
                chunk.material = matRed; // Generic dark material look
                
                const vel = new BABYLON.Vector3((Math.random()-0.5)*30, (Math.random()-0.5)*30, (Math.random()-0.5)*30).scale(scale);
                const rotVel = new BABYLON.Vector3(Math.random()*5, Math.random()*5, Math.random()*5);

                const chunkAnim = scene.onBeforeRenderObservable.add(() => {
                    const dt = engine.getDeltaTime();
                    chunk.position.addInPlace(vel.scale(dt));
                    chunk.rotation.addInPlace(rotVel.scale(dt));
                    chunk.scaling.scaleInPlace(1 - dt*0.8);

                    if (chunk.scaling.x <= 0.05) {
                        chunk.dispose();
                        scene.onBeforeRenderObservable.remove(chunkAnim);
                    }
                });
            }
        }

        // Texture Generator for particles (Procedural Canvas)
        function createStarTexture(scene) {
            const dynamicTexture = new BABYLON.DynamicTexture("dynamic texture", 64, scene, true);
            const ctx = dynamicTexture.getContext();
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.5)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            dynamicTexture.update();
            return dynamicTexture;
        }

        // --- Spawn Fleets ---
        function initFleets() {
            // Blue Fleet (Left)
            ships.push(new Ship("blue", true, new BABYLON.Vector3(-60, 0, 0))); // Flagship
            for (let i = 0; i < 9; i++) {
                const pos = new BABYLON.Vector3(-60 - Math.random() * 20, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 60);
                ships.push(new Ship("blue", false, pos));
            }

            // Red Fleet (Right)
            ships.push(new Ship("red", true, new BABYLON.Vector3(60, 0, 0))); // Flagship
            for (let i = 0; i < 9; i++) {
                const pos = new BABYLON.Vector3(60 + Math.random() * 20, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 60);
                ships.push(new Ship("red", false, pos));
            }
        }

        initFleets();

        // --- Main Game Loop ---
        scene.onBeforeRenderObservable.add(() => {
            const dt = engine.getDeltaTime() / 1000;

            // Update Ships
            for (let i = ships.length - 1; i >= 0; i--) {
                ships[i].update(dt);
            }

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.life -= dt;

                if (p.life <= 0 || !p.target || p.target.health <= 0) {
                    p.trail.dispose();
                    p.mesh.dispose();
                    projectiles.splice(i, 1);
                    continue;
                }

                // Homed guidance vector towards target
                const targetPos = p.target.mesh.position;
                const dir = targetPos.subtract(p.mesh.position).normalize();
                p.mesh.position.addInPlace(dir.scale(p.speed * dt));

                // Collision Detection
                if (BABYLON.Vector3.Distance(p.mesh.position, targetPos) < p.target.radius) {
                    p.target.takeDamage(25);
                    p.trail.dispose();
                    p.mesh.dispose();
                    projectiles.splice(i, 1);
                }
            }
        });

        return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(function () {
        scene.render();
    });

    window.addEventListener("resize", function () {
        engine.resize();
    });
});
</script>

</body>
</html>
