<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js Space Battle</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Load Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>Galactic Conflict</h1>
        <p>Red Fleet vs Blue Fleet | Orbit Camera: Left Click to Rotate, Right Click to Pan, Scroll to Zoom</p>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0, 0, 0);

            // --- Camera & Lighting ---
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 200, BABYLON.Vector3.Zero(), scene);
            camera.setTarget(BABYLON.Vector3.Zero());
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 500;

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.5;

            // Glow layer for projectiles
            const glow = new BABYLON.GlowLayer("glow", scene);
            glow.intensity = 1.2;

            // --- Environment: Starfield ---
            const starField = new BABYLON.ParticleSystem("stars", 2000, scene);
            starField.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            starField.emitter = new BABYLON.Vector3(0, 0, 0);
            starField.minEmitBox = new BABYLON.Vector3(-500, -500, -500);
            starField.maxEmitBox = new BABYLON.Vector3(500, 500, 500);
            starField.color1 = new BABYLON.Color3(1, 1, 1);
            starField.color2 = new BABYLON.Color3(0.8, 0.8, 1);
            starField.minSize = 0.1;
            starField.maxSize = 0.5;
            starField.emitRate = 1000;
            starField.lifeTime = 10000;
            starField.updateSpeed = 0;
            starField.start();

            // --- Projectile System ---
            const projectiles = [];

            // --- Explosion System ---
            const createExplosion = (position, color) => {
                // Fire/Sparks
                const particles = new BABYLON.ParticleSystem("explosion", 100, scene);
                particles.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                particles.emitter = new BABYLON.Vector3(0, 0, 0);
                particles.color1 = color;
                particles.color2 = new BABYLON.Color3(1, 1, 0);
                particles.minSize = 0.2;
                particles.maxSize = 1.5;
                particles.minLifeTime = 0.2;
                particles.maxLifeTime = 0.6;
                particles.emitRate = 100;
                particles.gravity = new BABYLON.Vector3(0, 0, 0);
                particles.direction1 = new BABYLON.Vector3(-1, -1, -1);
                particles.direction2 = newYLON.Vector3(1, 1, 1);
                particles.minEmitPower = 2;
                particles.maxEmitPower = 10;
                particles.start();
                particles.emitter = position.clone();

                // Shockwave
                const shockwave = BABYLON.MeshBuilder.CreateSphere("shock", {diameter: 1}, scene);
                shockwave.position = position.clone();
                const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
                shockMat.diffuseColor = color;
                shockMat.alpha = 0.5;
                shockwave.material = shockMat;

                let scale = 1;
                const shockAni = setInterval(() => {
                    scale += 2;
                    shockwave.scaling = new BABYLON.Vector3(scale, scale, scale);
                    shockMat.alpha -= 0.05;
                    if (shockMat.alpha <= 0) {
                        shockwave.dispose();
                        clearInterval(shockAni);
                    }
                }, 16);

                setTimeout(() => particles.stop(), 500);
            };

            // --- SpaceShip Class ---
            class SpaceShip {
                constructor(fleet, isFlagship, position) {
                    this.fleet = fleet; // 'blue' or 'red'
                    this.isFlagship = isFlagship;
                    this.health = isFlagship ? 500 : 100;
                    this.maxHealth = this.health;
                    this.alive = true;
                    this.lastFireTime = 0;

                    // Mesh creation
                    this.mesh = this.createShipMesh();
                    this.mesh.position = position.clone();
                    this.mesh.setPivotPoint(new BABYLON.Vector3(0, 0, 0));

                    // Health bar
                    this.healthBar = BABYLON.MeshBuilder.CreatePlane("hb", {width: 2, height: 0.2}, scene);
                    this.healthBar.parent = this.mesh;
                    this.healthBar.position = new BABYLON.Vector3(0, 2, 0);
                    const hbMat = new BABYLON.StandardMaterial("hbMat", scene);
                    hbMat.diffuseColor = new BABYLON.Color3(0, 1, 0);
                    this.healthBar.material = hbMat;

                    // Engine light
                    this.thruster = new BABYLON.PointLight("thruster", new BABYLON.Vector3(0,0,0), scene);
                    this.thruster.diffuse = (this.fleet === 'blue') ? new BABYLON.Color3(0, 0, 1) : new BABYLON.Color3(1, 0, 0);
                    this.thruster.intensity = 0.8;
                    this.thruster.range = 5;
                    this.thruster.parent = this.mesh;
                    this.thruster.position = new BABYLON.Vector3(0, 0, 0);
                }

                createShipMesh() {
                    const group = new BABYLON.Mesh([], "shipGroup");
                    const color = (this.fleet === 'blue') ? new BABYLON.Color3(0.2, 0.4, 1) : new BABYLON.Color3(1, 0.2, 0.2);
                    const mat = new BABYLON.StandardMaterial("shipMat", scene);
                    mat.diffuseColor = color;
                    mat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);

                    const sizeMult = this.isFlagship ? 3 : 1;

                    // Body
                    const body = BABYLON.MeshBuilder.CreateBox("body", {width: 1 * sizeMult, height: 0.5 * sizeMult, depth: 3 * sizeMult}, scene);
                    body.material = mat;
                    body.parent = group;

                    // Wings/Fins
                    const wing = BABYLON.MeshBuilder.CreateBox("wing", {width: 3 * sizeMult, height: 0.1 * sizeMult, depth: 1 * sizeMult}, scene);
                    wing.material = mat;
                    wing.parent = group;

                    // Cockpit
                    const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", {diameter: 0.6 * sizeMult}, scene);
                    cockpit.position.z = 0.5 * sizeMult;
                    cockpit.position.y = 0.3 * sizeMult;
                    const cockMat = new BABYLON.StandardMaterial("cockMat", scene);
                    cockMat.diffuseColor = new BABYLON.Color3(0.5, 0.8, 1);
                    cockpit.material = cockMat;
                    cockpit.parent = group;

                    return group;
                }

                update(time, enemies, allShips) {
                    if (!this.alive) return;

                    // AI: Target closest enemy
                    let closest = null;
                    let minDist = Infinity;
                    enemies.forEach(e => {
                        if (e.alive) {
                            const d = BABYLON.Vector3.Distance(this.mesh.position, e.mesh.position);
                            if (d < minDist) {
                                minDist = d;
                                closest = e;
                            }
                        }
                    });

                    if (closest) {
                        // Smooth rotation towards target
                        const targetPos = closest.mesh.position;
                        const lookAt = BABYLON.Vector3.Catapult(this.mesh.position, targetPos, 0); // Dummy to help calc
                        
                        const direction = targetPos.subtract(this.mesh.position).normalize();
                        const targetRotation = BABYLON.Quaternion.FromRotationAxis(direction, Math.PI); // Simplified
                        // We use lookAt for ease
                        this.mesh.lookAt(targetPos);

                        // Maneuvering: orbit and approach
                        const orbit = new BABYLON.Vector3(Math.sin(time * 0.001), Math.cos(time * 0.001), 0).scale(0.1);
                        const moveDir = direction.add(orbit).normalize();
                        this.mesh.position.addInPlace(moveDir.scale(0.15));

                        // Firing
                        if (time - this.lastFireTime > 3000) {
                            this.fire(closest);
                            this.lastFireTime = time;
                        }
                    }

                    // Update health bar scale
                    const healthPct = this.health / this.maxHealth;
                    this.healthBar.scaling.x = healthPct;
                    this.healthBar.material.diffuseColor = new BABYLON.Color3(1 - healthPct, healthPct, 0);
                }

                fire(target) {
                    const count = this.isFlagship ? 2 : 1;
                    for (let i = 0; i < count; i++) {
                        const proj = BABYLON.MeshBuilder.CreateSphere("proj", {diameter: 0.3}, scene);
                        proj.position = this.mesh.position.clone().add(this.mesh.forward.scale(2));
                        
                        const pMat = new BABYLON.StandardMaterial("pMat", scene);
                        pMat.emissiveColor = (this.fleet === 'blue') ? new BABYLON.Color3(0, 0.5, 1) : new BABYLON.Color3(1, 0, 0);
                        proj.material = pMat;

                        // Projectile velocity
                        const offset = new BABYLON.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).scale(0.1);
                        const vel = this.mesh.forward.clone().add(offset).normalize().scale(1.5);
                        
                        projectiles.push({ mesh: proj, vel: vel, fleet: this.fleet, life: 200 });
                    }
                }

                takeDamage(amount) {
                    this.health -= amount;
                    if (this.health <= 0 && this.alive) {
                        this.die();
                    }
                }

                die() {
                    this.alive = false;
                    const color = (this.fleet === 'blue') ? new BABYLON.Color3(0, 0.5, 1) : new BABYLON.Color3(1, 0, 0);
                    createExplosion(this.mesh.position, color);
                    
                    // Chain reaction check
                    scene.ships.forEach(s => {
                        if (s !== this && s.alive) {
                            const dist = BABYLON.Vector3.Distance(this.mesh.position, s.mesh.position);
                            if (dist < 8) {
                                setTimeout(() => s.takeDamage(100), 100);
                            }
                        }
                    });

                    this.mesh.dispose();
                    this.healthBar.dispose();
                    this.thruster.dispose();
                }
            }

            // --- Initialize Fleets ---
            scene.ships = [];
            const fleetA = [], fleetB = [];

            const spawnFleet = (fleetName, startZ, targetFleetArray, currentFleetArray) => {
                // Flagship
                const flagship = new SpaceShip(fleetName, true, new BABYLON.Vector3(0, 0, startZ));
                currentFleetArray.push(flagship);
                scene.ships.push(flagship);

                // Escorts
                for (let i = 0; i < 9; i++) {
                    const pos = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 60,
                        (Math.random() - 0.5) * 60,
                        startZ + (Math.random() - 0.5) * 40
                    );
                    const escort = new SpaceShip(fleetName, false, pos);
                    currentFleetArray.push(escort);
                    scene.ships.push(escort);
                }
            };

            spawnFleet('blue', -100, fleetB, fleetA);
            spawnFleet('red', 100, fleetA, fleetB);

            // --- Game Loop ---
            scene.registerBeforeRender(function () {
                const time = performance.now();

                // Update Ships
                fleetA.forEach(s => s.update(time, fleetB, scene.ships));
                fleetB.forEach(s => s.update(time, fleetA, scene.ships));

                // Update Projectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.mesh.position.addInPlace(p.vel);
                    p.life--;

                    // Collision check
                    const enemyFleet = (p.fleet === 'blue') ? fleetB : fleetA;
                    enemyFleet.forEach(ship => {
                        if (ship.alive && BABYLON.Vector3.Distance(p.mesh.position, ship.mesh.position) < 3) {
                            ship.takeDamage(20);
                            p.life = 0;
                        }
                    });

                    if (p.life <= 0) {
                        p.mesh.dispose();
                        projectiles.splice(i, 1);
                    }
                }
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
