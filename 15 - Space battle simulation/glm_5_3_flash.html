<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Duel — Fleet Engagement K-7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --a:#5fd2ff; --b:#ff8a5f;
    --ink:#e9f1fa; --mut:#8fa2b8;
    --panel:rgba(7,11,19,.74); --line:rgba(130,170,220,.22);
    --mono:'IBM Plex Mono',ui-monospace,monospace; --disp:'Chakra Petch','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#04060d}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
       background:radial-gradient(ellipse at 50% 44%,transparent 52%,rgba(2,4,9,.55) 100%)}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-family:var(--disp);color:var(--ink);user-select:none}
  #fade{position:fixed;inset:0;background:#02030a;z-index:40;pointer-events:none;opacity:1;transition:opacity 1.3s ease}
  [hidden]{display:none!important}

  .plate{position:absolute;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px)}
  .ticks::before,.ticks::after{content:'';position:absolute;width:9px;height:9px;border:1px solid rgba(160,200,255,.45)}
  .ticks::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .ticks::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

  #topPlate{top:16px;left:50%;transform:translateX(-50%);padding:8px 22px 9px;text-align:center}
  .ovl{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut)}
  #clock{font:500 20px/1.25 var(--mono);letter-spacing:.1em;margin-top:2px}

  .fleet-card{position:absolute;top:16px;width:238px;padding:10px 13px 12px}
  #cardA{left:16px;border-left:2px solid var(--a)}
  #cardB{right:16px;border-right:2px solid var(--b)}
  .fc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  #cardB .fc-head{flex-direction:row-reverse}
  .fc-name{font-size:12.5px;font-weight:600;letter-spacing:.18em}
  .fc-count{font:12px var(--mono);color:var(--mut)}
  .fc-pips{display:flex;gap:4px;margin:9px 0 8px}
  #cardB .fc-pips{justify-content:flex-end}
  .pip{width:14px;height:7px;transform:skewX(-16deg);opacity:.92}
  .pip.flag{width:24px;height:9px}
  .pip.dead{opacity:.14}
  #cardA .fc-pips{color:var(--a)} #cardB .fc-pips{color:var(--b)}
  .fc-strength{height:3px;background:rgba(255,255,255,.09)}
  .fc-strength i{display:block;height:100%;transition:width .35s ease}
  #cardA .fc-strength i{background:var(--a)} #cardB .fc-strength i{background:var(--b)}

  #ctrls{position:absolute;bottom:16px;right:16px;display:flex;gap:8px;pointer-events:auto}
  .cbtn{display:flex;align-items:center;justify-content:center;min-width:40px;height:34px;padding:0 11px;
        background:var(--panel);border:1px solid var(--line);color:var(--ink);
        font:600 12.5px var(--mono);letter-spacing:.06em;cursor:pointer;transition:.15s;backdrop-filter:blur(6px)}
  .cbtn:hover{border-color:rgba(160,205,255,.55);background:rgba(16,26,42,.85)}

  #feed{position:absolute;left:16px;top:136px;width:305px;display:flex;flex-direction:column;gap:5px}
  .fline{font:11.5px/1.5 var(--mono);color:var(--mut);background:rgba(6,10,18,.55);
         border-left:2px solid var(--line);padding:4px 9px;animation:fin .25s ease;transition:opacity 1s}
  .fline.out{opacity:0}
  .fline b{font-weight:500}
  .fline b.fa{color:var(--a)} .fline b.fb{color:var(--b)} .fline b.fk{color:#ffd9a8;letter-spacing:.08em}
  @keyframes fin{from{opacity:0;transform:translateX(-10px)}}

  #hint{position:absolute;bottom:19px;left:50%;transform:translateX(-50%);
        font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(150,175,205,.62);white-space:nowrap}
  #followTag{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);
        font:500 11px var(--mono);letter-spacing:.14em;color:#dcebff;background:var(--panel);
        border:1px solid rgba(160,205,255,.35);padding:6px 13px;white-space:nowrap}

  #banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          background:rgba(3,5,10,.45);pointer-events:auto;opacity:0;transition:opacity .9s}
  #banner.show{opacity:1}
  .banner-box{text-align:center;padding:40px 68px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
  #bannerTitle{font-size:32px;font-weight:700;letter-spacing:.16em;margin:12px 0 10px}
  #bannerStats{font:12.5px var(--mono);color:var(--mut);letter-spacing:.08em;margin-bottom:24px}

  @media (max-width:780px){
    #feed{display:none}
    .fleet-card{width:150px;padding:8px 10px}
    .fc-name{font-size:10.5px;letter-spacing:.1em}
    #bannerTitle{font-size:22px}
    .banner-box{padding:28px 30px}
    #hint{display:none}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vig"></div>

<div id="hud">
  <div class="plate ticks" id="topPlate">
    <div class="ovl">Live feed — Sector K-7</div>
    <div id="clock">00:00</div>
  </div>

  <div class="plate ticks fleet-card" id="cardA">
    <div class="fc-head"><span class="fc-name">AZURE LEGION</span><span class="fc-count" id="countA">10/10</span></div>
    <div class="fc-pips" id="pipsA"></div>
    <div class="fc-strength"><i id="strA" style="width:100%"></i></div>
  </div>

  <div class="plate ticks fleet-card" id="cardB">
    <div class="fc-head"><span class="fc-name">EMBER SYNDICATE</span><span class="fc-count" id="countB">10/10</span></div>
    <div class="fc-pips" id="pipsB"></div>
    <div class="fc-strength"><i id="strB" style="width:100%"></i></div>
  </div>

  <div id="feed"></div>

  <div id="followTag" hidden></div>
  <div id="hint">drag orbit &nbsp;·&nbsp; scroll zoom &nbsp;·&nbsp; click a ship to track it</div>

  <div id="ctrls">
    <button class="cbtn" id="btnPause" title="Pause — Space">
      <svg id="icoPause" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
      <svg id="icoPlay" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>
    <button class="cbtn" id="btnSpeed" title="Battle speed">1&times;</button>
    <button class="cbtn" id="btnRestart" title="Restart battle — R">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v4.2h-4.2"/></svg>
    </button>
  </div>

  <div id="banner" hidden>
    <div class="banner-box ticks">
      <div class="ovl">Engagement concluded</div>
      <h1 id="bannerTitle"></h1>
      <p id="bannerStats"></p>
      <button class="cbtn" id="btnAgain" style="min-width:150px">RESTART BATTLE</button>
    </div>
  </div>
</div>

<div id="fade"></div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.BABYLON){ $('hint').textContent='BABYLON.JS FAILED TO LOAD — CHECK YOUR CONNECTION AND RELOAD'; return; }

/* ============ 0. small helpers ============ */
const V3=(x,y,z)=>new BABYLON.Vector3(x,y,z);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rsym=()=>Math.random()*2-1;
const FWD=V3(0,0,1), UP=V3(0,1,0);
const TMPA=V3(0,0,0),TMPB=V3(0,0,0),TMPC=V3(0,0,0),TMPD=V3(0,0,0),TMPE=V3(0,0,0);
const TMQ=new BABYLON.Quaternion(), DQ=new BABYLON.Quaternion();

/* ============ 1. engine, camera, pipeline ============ */
const canvas=$('scene');
const engine=new BABYLON.Engine(canvas,true,{antialias:true,powerPreference:'high-performance'});
engine.setHardwareScalingLevel(1/Math.min(window.devicePixelRatio||1,1.75));
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.012,0.016,0.032,1);
scene.skipPointerMovePicking=true;

const camera=new BABYLON.ArcRotateCamera('cam',1.05,1.1,140,V3(0,2,0),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=26; camera.upperRadiusLimit=420;
camera.lowerBetaLimit=0.1; camera.upperBetaLimit=Math.PI-0.1;
camera.wheelDeltaPercentage=0.02; camera.pinchDeltaPercentage=0.012;
camera.minZ=0.5; camera.maxZ=2400; camera.panningSensibility=0; camera.inertia=0.88;
try{camera.inputs.removeByType('ArcRotateCameraKeyboardMoveInput');}catch(e){}

const pipe=new BABYLON.DefaultRenderingPipeline('pipe',true,scene,[camera]);
pipe.fxaaEnabled=true;
pipe.bloomEnabled=true; pipe.bloomThreshold=0.55; pipe.bloomWeight=0.6; pipe.bloomKernel=64; pipe.bloomScale=0.5;
pipe.imageProcessing.toneMappingEnabled=true;
pipe.imageProcessing.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
pipe.imageProcessing.exposure=1.12; pipe.imageProcessing.contrast=1.14;
pipe.imageProcessing.vignetteEnabled=true; pipe.imageProcessing.vignetteWeight=1.3;
pipe.imageProcessing.vignetteCameraFov=0.9;

/* ============ 2. lights ============ */
const hemi=new BABYLON.HemisphericLight('hemi',V3(0.2,1,0.1),scene);
hemi.diffuse=new BABYLON.Color3(0.45,0.55,0.75); hemi.groundColor=new BABYLON.Color3(0.05,0.06,0.1);
hemi.intensity=0.5;
const key=new BABYLON.DirectionalLight('key',V3(-0.5,-0.8,0.35).normalize(),scene);
key.diffuse=new BABYLON.Color3(1,0.95,0.86); key.intensity=1.15;
const rim=new BABYLON.DirectionalLight('rim',V3(0.55,0.2,-0.8).normalize(),scene);
rim.diffuse=new BABYLON.Color3(0.28,0.5,0.72); rim.intensity=0.55;

/* pooled explosion lights + one thruster light per flagship */
const boomLights=[];
for(let i=0;i<5;i++){
  const l=new BABYLON.PointLight('boom'+i,V3(0,-9999,0),scene);
  l.diffuse=new BABYLON.Color3(1,0.6,0.28); l.intensity=0; l.range=60;
  boomLights.push({l,t:0,peak:0});
}
let boomRR=0;
function flashLight(pos,power){
  const b=boomLights[boomRR++%boomLights.length];
  b.l.position.copyFrom(pos); b.t=1; b.peak=16*power;
}
const engLights=[];

/* ============ 3. nebula sky & dust ============ */
(function makeSky(){
  const dt=new BABYLON.DynamicTexture('neb',{width:2048,height:1024},scene,true);
  dt.wrapU=BABYLON.Texture.WRAP_ADDRESSMODE;
  const x=dt.getContext();
  x.fillStyle='#04060e'; x.fillRect(0,0,2048,1024);
  const R=(function(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};})(777);
  function blob(cx,cy,r,c,a){
    for(const ox of[-2048,0,2048]){
      const g=x.createRadialGradient(cx+ox,cy,0,cx+ox,cy,r);
      g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.fillRect(cx+ox-r,cy-r,r*2,r*2);
    }
  }
  const cols=[[38,110,140],[70,44,130],[140,52,96],[30,90,110],[92,60,150]];
  for(let i=0;i<46;i++) blob(R()*2048,R()*1024,140+R()*420,cols[(R()*cols.length)|0],0.05+R()*0.10);
  x.save(); x.translate(1024,512); x.rotate(-0.5);
  const band=x.createLinearGradient(0,-260,0,260);
  band.addColorStop(0,'rgba(0,0,0,0)'); band.addColorStop(0.5,'rgba(120,140,190,0.10)'); band.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=band; x.fillRect(-1600,-260,3200,520); x.restore();
  for(let i=0;i<1100;i++){
    const sx=R()*2048,sy=R()*1024,r=R()<0.94?0.4+R()*0.9:1.3+R()*1.3;
    const t=R(),col=t<0.7?'255,255,255':t<0.87?'190,215,255':'255,225,190';
    x.fillStyle=`rgba(${col},${0.25+R()*0.75})`;
    for(const ox of[-2048,0,2048]){x.beginPath();x.arc(sx+ox,sy,r,0,7);x.fill();}
  }
  for(let i=0;i<26;i++){
    const sx=R()*2048,sy=R()*1024,r=2+R()*3;
    for(const ox of[-2048,0,2048]){
      const g=x.createRadialGradient(sx+ox,sy,0,sx+ox,sy,r*6);
      g.addColorStop(0,'rgba(255,255,255,0.9)'); g.addColorStop(0.25,'rgba(200,220,255,0.28)'); g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.beginPath(); x.arc(sx+ox,sy,r*6,0,7); x.fill();
    }
  }
  dt.update();
  const dome=BABYLON.MeshBuilder.CreateSphere('dome',{diameter:1700,segments:24,sideOrientation:BABYLON.Mesh.BACKSIDE},scene);
  const m=new BABYLON.StandardMaterial('skyM',scene);
  m.emissiveTexture=dt; m.emissiveColor=new BABYLON.Color3(1,1,1);
  m.disableLighting=true; m.backFaceCulling=false;
  dome.material=m; dome.infiniteDistance=true; dome.isPickable=false; dome.applyFog=false;
})();

const softTex=(function(){
  const t=new BABYLON.DynamicTexture('soft',{width:64,height:64},scene,false);
  const c=t.getContext(),g=c.createRadialGradient(32,32,1,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.5,'rgba(255,255,255,0.45)'); g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g; c.fillRect(0,0,64,64); t.update(); t.hasAlpha=true; return t;
})();
const dust=new BABYLON.ParticleSystem('dust',500,scene);
dust.particleTexture=softTex; dust.emitter=V3(0,0,0);
dust.minEmitBox=V3(-170,-70,-170); dust.maxEmitBox=V3(170,70,170);
dust.color1=new BABYLON.Color4(0.7,0.8,1,0.09); dust.color2=new BABYLON.Color4(1,0.85,0.9,0.06);
dust.colorDead=new BABYLON.Color4(0.7,0.8,1,0);
dust.minSize=0.06; dust.maxSize=0.34; dust.minLifeTime=6; dust.maxLifeTime=13;
dust.emitRate=55; dust.direction1=V3(-0.06,-0.02,-0.06); dust.direction2=V3(0.06,0.02,0.06);
dust.blendMode=BABYLON.ParticleSystem.BLENDMODE_STANDARD;
dust.preWarmCycles=140; dust.preWarmStepOffset=6; dust.start();

/* ============ 4. materials & fleet palettes ============ */
const MAXL=10;
function stdMat(name){const m=new BABYLON.StandardMaterial(name,scene);m.maxSimultaneousLights=MAXL;return m;}
const FLEET=[
 {tag:'AZ',name:'AZURE LEGION',short:'AZ',ui:'#5fd2ff',
  hullL:[0.58,0.66,0.78],hullM:[0.33,0.42,0.55],hullD:[0.15,0.20,0.29],
  glow:new BABYLON.Color3(0.30,1.25,2.2),proj:new BABYLON.Color3(0.5,1.9,3.2),
  tr:[0.45,1.5,2.4],barC:new BABYLON.Color3(0.35,0.8,1.0),engC:new BABYLON.Color3(0.3,0.7,1.6)},
 {tag:'EM',name:'EMBER SYNDICATE',short:'EM',ui:'#ff8a5f',
  hullL:[0.74,0.60,0.50],hullM:[0.46,0.35,0.30],hullD:[0.21,0.14,0.11],
  glow:new BABYLON.Color3(2.4,0.85,0.35),proj:new BABYLON.Color3(2.6,0.9,0.4),
  tr:[2.6,0.75,0.35],barC:new BABYLON.Color3(1.0,0.5,0.32),engC:new BABYLON.Color3(1.6,0.55,0.25)}
];
const hullMat=[],glowMat=[],projMat=[];
for(let fi=0;fi<2;fi++){
  const h=stdMat('hull'+fi); h.diffuseColor=new BABYLON.Color3(1,1,1);
  h.specularColor=new BABYLON.Color3(0.22,0.24,0.28); h.specularPower=56; hullMat.push(h);
  const g=new BABYLON.StandardMaterial('glow'+fi,scene);
  g.emissiveColor=FLEET[fi].glow.clone(); g.disableLighting=true; glowMat.push(g);
  const p=new BABYLON.StandardMaterial('proj'+fi,scene);
  p.emissiveColor=FLEET[fi].proj.clone(); p.disableLighting=true; projMat.push(p);
}
const debrisMat=[],emberMat=new BABYLON.StandardMaterial('ember',scene);
emberMat.emissiveColor=new BABYLON.Color3(1.5,0.55,0.2); emberMat.diffuseColor=new BABYLON.Color3(0.1,0.05,0.03);
for(let fi=0;fi<2;fi++){
  const d=stdMat('deb'+fi);
  d.diffuseColor=new BABYLON.Color3(FLEET[fi].hullD[0]*2,FLEET[fi].hullD[1]*2,FLEET[fi].hullD[2]*2);
  d.specularColor=new BABYLON.Color3(0.1,0.1,0.12); debrisMat.push(d);
}
const flashMat=[];
[[0.5,1.3,2.2],[2.2,0.8,0.4]].forEach(function(c,i){
  const m=new BABYLON.StandardMaterial('flash'+i,scene);
  m.emissiveTexture=softTex; m.emissiveColor=new BABYLON.Color3(c[0],c[1],c[2]);
  m.disableLighting=true; m.alpha=0.999;
  m.transparencyMode=BABYLON.Material.MATERIAL_ALPHABLEND; m.alphaMode=BABYLON.Engine.ALPHA_ADD;
  flashMat.push(m);
});

/* ============ 5. geometry builder (vertex-colored merged primitives) ============ */
function GB(){return{p:[],n:[],c:[],i:[],off:0};}
function gbAppend(gb,mesh,col){
  mesh.bakeCurrentTransformIntoVertices();
  const pos=mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  const nor=mesh.getVerticesData(BABYLON.VertexBuffer.NormalKind);
  const idx=mesh.getIndices();
  for(let k=0;k<pos.length;k+=3){
    gb.p.push(pos[k],pos[k+1],pos[k+2]);
    gb.n.push(nor[k],nor[k+1],nor[k+2]);
    const j=1+rsym()*0.05;
    gb.c.push(col[0]*j,col[1]*j,col[2]*j,1);
  }
  for(let k=0;k<idx.length;k++)gb.i.push(idx[k]+gb.off);
  gb.off+=pos.length/3;
  mesh.dispose();
}
function gbBox(g,w,h,d,col,x,y,z,rx,ry,rz){
  const m=BABYLON.MeshBuilder.CreateBox('t',{width:w,height:h,depth:d},scene);
  m.position.set(x,y,z); m.rotation.set(rx||0,ry||0,rz||0); gbAppend(g,m,col);
}
function gbCyl(g,dT,dB,h,tess,col,x,y,z,rx){
  const m=BABYLON.MeshBuilder.CreateCylinder('t',{diameterTop:dT,diameterBottom:dB,height:h,tessellation:tess},scene);
  m.position.set(x,y,z); m.rotation.x=rx||0; gbAppend(g,m,col);
}
function gbBuild(g,name,mat){
  const m=new BABYLON.Mesh(name,scene);
  const vd=new BABYLON.VertexData();
  vd.positions=g.p; vd.normals=g.n; vd.indices=g.i; vd.colors=g.c;
  vd.applyToMesh(m); m.material=mat; m.hasVertexAlpha=false;
  return m;
}

/* escort: fuselage, hex prow, swept wings, twin pod engines, tail fin — length ~4.6 */
function buildEscort(fi){
  const P=FLEET[fi],g=GB(),gg=GB();
  gbBox(g,0.95,0.6,2.7,P.hullM,0,0,0.1);
  gbCyl(g,0.08,0.8,1.2,6,P.hullM,0,0,1.95,Math.PI/2);
  gbBox(g,2.1,0.07,1.15,P.hullD, 1.05,-0.02,-0.55,0,-0.28, 0.1);
  gbBox(g,2.1,0.07,1.15,P.hullD,-1.05,-0.02,-0.55,0, 0.28,-0.1);
  gbCyl(g,0.34,0.3,0.95,8,P.hullD, 2.0,-0.02,-0.75,Math.PI/2);
  gbCyl(g,0.34,0.3,0.95,8,P.hullD,-2.0,-0.02,-0.75,Math.PI/2);
  gbBox(g,0.07,0.55,0.8,P.hullD,0,0.42,-0.95,-0.25,0,0);
  gbCyl(g,0.3,0.34,0.5,8,P.hullL,0,0.16,0.85,0);
  gbBox(g,0.5,0.16,1.0,P.hullL,0,0.12,-0.2,0,0,0);
  gbBox(gg,0.42,0.1,0.8,P.glow,0,0.3,1.1,0,0,0);
  gbCyl(gg,0.2,0.2,0.1,8,P.glow, 2.0,-0.02,-1.28,Math.PI/2);

/* ============ 7. projectile ribbon trails (one dynamic mesh, custom shader) ============ */
const TSEG=14,TMAX=120;
const tPos=new Float32Array(TMAX*TSEG*2*3);
const tCol=new Float32Array(TMAX*TSEG*2*4);
(function(){
  const idx=new Uint32Array(TMAX*(TSEG-1)*6); let p=0;
  for(let t=0;t<TMAX;t++){
    const b=t*TSEG*2;
    for(let k=0;k<TSEG-1;k++){
      const a=b+k*2;
      idx[p++]=a;idx[p++]=a+2;idx[p++]=a+1;
      idx[p++]=a+1;idx[p++]=a+2;idx[p++]=a+3;
    }
  }
  const m=new BABYLON.Mesh('trails',scene);
  m.setVerticesData(BABYLON.VertexBuffer.PositionKind,tPos,true);
  m.setVerticesData(BABYLON.VertexBuffer.ColorKind,tCol,true,4);
  m.setIndices(Array.from(idx));
  const sh=new BABYLON.ShaderMaterial('trailM',scene,
    {vertexSource:"precision highp float;attribute vec3 position;attribute vec4 color;uniform mat4 worldViewProjection;varying vec4 vC;void main(){vC=color;gl_Position=worldViewProjection*vec4(position,1.0);}",
     fragmentSource:"precision highp float;varying vec4 vC;void main(){gl_FragColor=vC;}"},
    {attributes:['position','color'],uniforms:['worldViewProjection'],needAlphaBlending:true});
  sh.alpha=0.999; sh.alphaMode=BABYLON.Engine.ALPHA_ADD; sh.backFaceCulling=false;
  m.material=sh; m.isPickable=false; m.alwaysSelectAsActiveMesh=true; m.freezeWorldMatrix();
  window.__trailMesh=m;
})();
const trailMesh=window.__trailMesh;
const trailS=[],trailFree=[];
for(let i=0;i<TMAX;i++){
  trailS.push({pts:new Float32Array(TSEG*3),state:0,a:1,r:1,g:1,b:1,w:0.5,fresh:true,hx:0,hy:0,hz:0});
  trailFree.push(i);
}
function trailStart(fi,w,px,py,pz){
  if(!trailFree.length)return -1;
  const i=trailFree.pop(),s=trailS[i];
  s.state=1;s.a=1;s.fresh=false;s.w=w;
  s.r=FLEET[fi].tr[0];s.g=FLEET[fi].tr[1];s.b=FLEET[fi].tr[2];
  s.hx=px;s.hy=py;s.hz=pz;
  for(let k=0;k<TSEG;k++){s.pts[k*3]=px;s.pts[k*3+1]=py;s.pts[k*3+2]=pz;}
  return i;
}
function trailFade(i){if(i>=0&&trailS[i].state===1)trailS[i].state=2;}
function updateTrails(dt){
  const cp=camera.position;let any=false;
  for(let i=0;i<TMAX;i++){
    const s=trailS[i];
    if(s.state===0){
      if(!s.fresh){tCol.fill(0,i*TSEG*2*4,(i+1)*TSEG*2*4);s.fresh=true;any=true;}
      continue;
    }
    any=true;
    if(dt>0){
      if(s.state===1){
        s.pts.copyWithin(3,0,(TSEG-1)*3);
        s.pts[0]=s.hx;s.pts[1]=s.hy;s.pts[2]=s.hz;
      }else{
        s.pts.copyWithin(3,0,(TSEG-1)*3);
        s.a-=dt*2.6;
        if(s.a<=0.04){s.state=0;continue;}
      }
    }
    const base=i*TSEG*2;
    for(let k=0;k<TSEG;k++){
      const kp=Math.max(0,k-1)*3,kn=Math.min(TSEG-1,k+1)*3,k0=k*3;
      const dx=s.pts[kn]-s.pts[kp],dy=s.pts[kn+1]-s.pts[kp+1],dz=s.pts[kn+2]-s.pts[kp+2];
      const vx=s.pts[k0]-cp.x,vy=s.pts[k0+1]-cp.y,vz=s.pts[k0+2]-cp.z;
      let sx=dy*vz-dz*vy,sy=dz*vx-dx*vz,sz=dx*vy-dy*vx;
      const sl=Math.sqrt(sx*sx+sy*sy+sz*sz);
      if(sl<1e-6){sx=1;sy=0;sz=0;}else{const inv=1/sl;sx*=inv;sy*=inv;sz*=inv;}
      const f=k/(TSEG-1),fade=1-f,w=s.w*fade,al=s.a*fade*fade;
      const o=(base+k*2)*3;
      tPos[o]=s.pts[k0]+sx*w; tPos[o+1]=s.pts[k0+1]+sy*w; tPos[o+2]=s.pts[k0+2]+sz*w;
      tPos[o+3]=s.pts[k0]-sx*w;tPos[o+4]=s.pts[k0+1]-sy*w;tPos[o+5]=s.pts[k0+2]-sz*w;
      const inten=(fade*fade)*0.9+0.1,co=(base+k*2)*4;
      tCol[co]=s.r*inten; tCol[co+1]=s.g*inten; tCol[co+2]=s.b*inten; tCol[co+3]=al;
      tCol[co+4]=s.r*inten*0.6;tCol[co+5]=s.g*inten*0.6;tCol[co+6]=s.b*inten*0.6;tCol[co+7]=al;
    }
  }
  if(any){
    trailMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind,tPos);
    trailMesh.updateVerticesData(BABYLON.VertexBuffer.ColorKind,tCol);
  }
}

function spawnProj(fi,px,py,pz,dx,dy,dz,src){
  const pool=projPool[fi];let p=null;
  for(let i=0;i<pool.length;i++){const c=pool[projRR[fi]++%pool.length];if(!c.active){p=c;break;}}
  if(!p){p=pool[projRR[fi]++%pool.length];killProj(p);}
  p.active=true;p.life=PROJ_LIFE;p.src=src;p.dmg=8+Math.random()*5;
  p.pos.set(px,py,pz);
  const L=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
  p.vel.set(dx/L*PROJ_SPEED,dy/L*PROJ_SPEED,dz/L*PROJ_SPEED);
  p.inst.setEnabled(true);p.inst.position.copyFrom(p.pos);
  BABYLON.Quaternion.RotationYawPitchRollToRef(Math.atan2(dx,dz),-Math.asin(clamp(dy/L,-1,1)),0,TMQ);
  p.inst.rotationQuaternion.copyFrom(TMQ);
  p.tSlot=trailStart(fi,src&&src.flag?0.68:0.45,px,py,pz);
}
function killProj(p){
  if(!p.active)return;
  p.active=false;p.inst.setEnabled(false);trailFade(p.tSlot);p.tSlot=-1;
}
function updateProjs(dt){
  for(let fi=0;fi<2;fi++){
    const foes=fleetShips[1-fi];
    for(const p of projPool[fi]){
      if(!p.active)continue;
      p.pos.addInPlace(TMPA.copyFrom(p.vel).scaleInPlace(dt));
      p.life-=dt;
      if(p.life<=0){killProj(p);continue;}
      p.inst.position.copyFrom(p.pos);
      if(p.tSlot>=0){const s=trailS[p.tSlot];s.hx=p.pos.x;s.hy=p.pos.y;s.hz=p.pos.z;}
      for(const sh of foes){
        if(!sh.alive)continue;
        const dx=p.pos.x-sh.pos.x,dy=p.pos.y-sh.pos.y,dz=p.pos.z-sh.pos.z;
        const R=sh.radius+0.7;
        if(dx*dx+dy*dy+dz*dz<R*R){
          impactFX(p.pos,fi);damage(sh,p.dmg,p.src);killProj(p);break;
        }
      }
    }
  }
}

  const si=bsRR++%8;
  boomSpark[si].emitter.copyFrom(pos);boomSpark[si].manualEmitCount=(46*power)|0;
  boomSmoke[si].emitter.copyFrom(pos);boomSmoke[si].manualEmitCount=(12*power)|0;
  flashLight(pos,power);
  const d=BABYLON.Vector3.Distance(camera.position,pos);
  addShake(power*0.45*clamp(1-d/170,0.12,1));
}
function blastDamage(pos,power,src){
  const R=power>1.4?11:6;
  for(const sh of ships){
    if(!sh.alive||sh.dying)continue;
    const dx=sh.pos.x-pos.x,dy=sh.pos.y-pos.y,dz=sh.pos.z-pos.z,RR=R+sh.radius;
    if(dx*dx+dy*dy+dz*dz<RR*RR){
      if(sh.flag)damage(sh,65,src);
      else startDeath(sh,src,'blast',0.05+Math.random()*0.2);
    }
  }
}

/* ============ 11. ships & fleet AI ============ */
const ARENA=280;
const ships=[],fleetShips=[[],[]],pending=[];
let escMasters=null,flagBuilt=[false,false];
function makeShip(fi,flag,name,x,y,z,yaw){
  const s={
    fi,flag,name,alive:true,dying:false,deathSrc:null,deathCause:'',
    pos:V3(x,y,z),q:new BABYLON.Quaternion(),bank:0,speed:12,throttle:1,
    maxSpeed:flag?13.5:24,turn:flag?0.6:1.5,radius:flag?3.6:2.0,
    nose:flag?7.2:2.6,hp:flag?140:40,maxHp:flag?140:40,
    target:null,retargetT:0,orbitDir:Math.random()<0.5?-1:1,wob:Math.random()*10,
    fireT:Math.random()*3,home:{x,y,z,yaw},exhaust:[],engLight:null,pip:null,bar:null
  };
  BABYLON.Quaternion.RotationYawPitchRollToRef(yaw,0,0,s.q);
  if(flag){
    if(!flagBuilt[fi]){
      const m=buildFlagship(fi);
      m.hull.name='flagHull'+fi;m.glow.name='flagGlow'+fi;
      flagBuilt[fi]=m;
    }
    const fm=flagBuilt[fi];
    s.hull=fm.hull;s.glow=fm.glow;
    s.hull.setEnabled(true);s.glow.setEnabled(true);
    if(!s.engLight){
      const l=new BABYLON.PointLight('eng'+fi,V3(0,0,-6.9),scene);
      l.parent=s.hull;l.diffuse=FLEET[fi].engC.clone();l.range=24;l.intensity=2;
      s.engLight=l;engLights.push(l);
    }else s.engLight=s.hull.getChildren(undefined,false).find(n=>n.getClassName()==='PointLight')||s.engLight;
    const offs=[[1.15,-0.35],[-1.15,-0.35],[1.15,0.45],[-1.15,0.45]];
    for(const o of offs)s.exhaust.push(makeExhaust(fi,s,o[0],o[1],-6.35,2.2,2.6));
  }else{
    if(!escMasters)escMasters=buildEscort(0)&&buildEscort(1)||escMasters;
    const M=[escMasters[0],escMasters[1]][fi];
    s.hull=M.hull.createInstance(name+'_h');
    s.glow=M.glow.createInstance(name+'_g');
    s.exhaust.push(makeExhaust(fi,s, 2.0,-0.02,-1.32,1.4,1.8));
    s.exhaust.push(makeExhaust(fi,s,-2.0,-0.02,-1.32,1.4,1.8));
  }
  s.hull.rotationQuaternion=s.q.clone();
  s.glow.rotationQuaternion=s.q.clone();
  s.hull.metadata={ship:s};s.glow.metadata={ship:s};
  s.bar=makeBar(s);
  ships.push(s);fleetShips[fi].push(s);
  return s;
}
function buildEscortPair(){
  const a=buildEscort(0),b=buildEscort(1);
  a.hull.isVisible=false;a.glow.isVisible=false;b.hull.isVisible=false;b.glow.isVisible=false;
  a.hull.isPickable=false;a.glow.isPickable=false;b.hull.isPickable=false;b.glow.isPickable=false;
  return[a,b];
}
const exhaustMat=[];
for(let fi=0;fi<2;fi++){
  const m=new BABYLON.StandardMaterial('ex'+fi,scene);
  m.emissiveColor=FLEET[fi].glow.clone().scale(0.8);m.disableLighting=true;
  m.alpha=0.999;m.transparencyMode=BABYLON.Material.MATERIAL_ALPHABLEND;m.alphaMode=BABYLON.Engine.ALPHA_ADD;
  m.backFaceCulling=false;exhaustMat.push(m);
}
let exMaster=null;
function makeExhaust(fi,s,ox,oy,oz,sx,sz){
  if(!exMaster){
    const m=BABYLON.MeshBuilder.CreateCylinder('exM',{diameterTop:0.06,diameterBottom:0.55,height:1,tessellation:10},scene);
    m.rotation.x=-Math.PI/2;m.position.z=-0.5;m.bakeCurrentTransformIntoVertices();
    m.isVisible=false;m.isPickable=false;exMaster=m;
  }
  const inst=exMaster.clone('ex_'+s.name);
  inst.material=exhaustMat[fi];inst.setEnabled(true);
  inst.rotationQuaternion=s.q.clone();
  return{inst,ox,oy,oz,sx,sz,ph:Math.random()*10};
}
function spawnFleets(){
  escMasters=buildEscortPair();
  for(let fi=0;fi<2;fi++){
    const cx=-110*(fi===0?1:-1),yaw=fi===0?Math.PI/2:-Math.PI/2;
    makeShip(fi,true,FLEET[fi].short+'-CMD',cx,0,0,yaw);
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+Math.PI/4+rsym()*0.15,r=rnd(15,18);
      makeShip(fi,false,FLEET[fi].short+'-0'+(i+1),cx+Math.cos(a)*r,(i%2?1:-1)*rnd(3.5,5.5),Math.sin(a)*r*1.15,yaw);
    }
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5+0.35+rsym()*0.2,r=rnd(27,31);
      makeShip(fi,false,FLEET[fi].short+'-0'+(i+5),cx+Math.cos(a)*r,rsym()*7,Math.sin(a)*r*1.15,yaw);
    }
  }
}
function pickTarget(s){
  const cand=[];
  for(const f of fleetShips[1-s.fi]){
    if(!f.alive)continue;
    cand.push([BABYLON.Vector3.DistanceSquared(s.pos,f.pos),f]);
  }
  if(!cand.length)return null;
  cand.sort((a,b)=>a[0]-b[0]);
  return Math.random()<0.7?cand[0][1]:cand[(Math.random()*Math.min(3,cand.length))|0][1];
}
function shipFwd(s,out){FWD.applyRotationQuaternionToRef(s.q,out);}
function fireShip(s,aimX,aimY,aimZ,nx,ny,nz){
  shipFwd(s,TMPA);UP.applyRotationQuaternionToRef(s.q,TMPB);
  const rx=TMPA.y*TMPB.z-TMPA.z*TMPB.y,ry=TMPA.z*TMPB.x-TMPA.x*TMPB.z,rz=TMPA.x*TMPB.y-TMPA.y*TMPB.x;
  const offs=s.flag?[-0.85,0.85]:[0];
  for(const o of offs){
    const px=nx+rx*o,py=ny+ry*o,pz=nz+rz*o;
    let dx=aimX-px,dy=aimY-py,dz=aimZ-pz;
    const L=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;dx/=L;dy/=L;dz/=L;
    dx+=rsym()*0.035;dy+=rsym()*0.035;dz+=rsym()*0.035;
    spawnProj(s.fi,px,py,pz,dx,dy,dz,s);
    spawnFlash(TMPC.set(px,py,pz),0.65+Math.random()*0.3,0.09,s.fi);
  }
}
function updateShip(s,dt,t){
  if(!s.alive)return;
  if(s.dying){
    s.speed=Math.max(0,s.speed*(1-1.6*dt));
    shipFwd(s,TMPA);TMPA.scaleInPlace(s.speed*dt);s.pos.addInPlace(TMPA);
    s.throttle=Math.max(0.1,s.throttle-3*dt);
    return;
  }
  s.retargetT-=dt;
  if(!s.target||!s.target.alive||s.retargetT<=0){s.target=pickTarget(s);s.retargetT=1.2+Math.random()*2.2;}
  shipFwd(s,TMPF_);
  let dx,dy,dz;
  if(s.target){
    const T=s.target;
    const rx=s.pos.x-T.pos.x,ry=s.pos.y-T.pos.y,rz=s.pos.z-T.pos.z;
    const rl=Math.sqrt(rx*rx+ry*ry+rz*rz)||1;
    const engage=s.flag?54:32;
    if(rl>engage*1.5){gx_=T.pos.x;gy_=T.pos.y;gz_=T.pos.z;}
    else{
      const tc=engage*0.85/((Math.sqrt(rx*rx+rz*rz)||1));
      gx_=T.pos.x+rx/rl*engage+rz*tc*s.orbitDir;
      gz_=T.pos.z+rz/rl*engage-rx*tc*s.orbitDir;
      gy_=T.pos.y+Math.sin(t*0.45+s.wob)*4;
    }
    let sxp=0,syp=0,szp=0;
    for(const o of ships){
      if(o===s||!o.alive)continue;
      const ax=s.pos.x-o.pos.x,ay=s.pos.y-o.pos.y,az=s.pos.z-o.pos.z;
      const L2=ax*ax+ay*ay+az*az,min=s.radius+o.radius+3.2;
      if(L2<min*min&&L2>1e-6){const L=Math.sqrt(L2),f=(min-L)/min/L;sxp+=ax*f;syp+=ay*f;szp+=az*f;}
    }
    dx=gx_-s.pos.x+sxp*7;dy=gy_-s.pos.y+syp*7;dz=gz_-s.pos.z+szp*7;
    const rr=Math.sqrt(s.pos.x*s.pos.x+s.pos.y*s.pos.y+s.pos.z*s.pos.z);
    if(rr>ARENA){const k=(rr-ARENA)/rr*2.2;dx-=s.pos.x*k;dy-=s.pos.y*k;dz-=s.pos.z*k;}
  }else{dx=-s.pos.x;dy=-s.pos.y*0.5;dz=-s.pos.z;}
  const dl=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;dx/=dl;dy/=dl;dz/=dl;
  const dot=TMPF_.x*dx+TMPF_.y*dy+TMPF_.z*dz;
  if(dot<0.99995){
    const ax=TMPF_.y*dz-TMPF_.z*dy,ay=TMPF_.z*dx-TMPF_.x*dz,az=TMPF_.x*dy-TMPF_.y*dx;
    const al=Math.sqrt(ax*ax+ay*ay+az*az);
    if(al>1e-6){
      const ang=Math.acos(dot<-1?-1:dot>1?1:dot);
      TMPA.set(ax/al,ay/al,az/al);
      const tq=BABYLON.Quaternion.RotationAxis(TMPA,Math.min(ang,s.turn*dt));
      s.q=tq.multiply(s.q);
      shipFwd(s,TMPF_);
    }
  }
  const thr=clamp(dot*1.1,0.22,1);s.throttle=thr;
  s.speed+=(s.maxSpeed*thr-s.speed)*Math.min(1,dt*(thr>s.speed?0.9:1.8));
  s.pos.x+=TMPF_.x*s.speed*dt;s.pos.y+=TMPF_.y*s.speed*dt;s.pos.z+=TMPF_.z*s.speed*dt;
  UP.applyRotationQuaternionToRef(s.q,TMPB);
  const cx=TMPF_.y*dz-TMPF_.z*dy,cy=TMPF_.z*dx-TMPF_.x*dz,cz=TMPF_.x*dy-TMPF_.y*dx;
  const side=cx*TMPB.x+cy*TMPB.y+cz*TMPB.z;
  s.bank+=(clamp(side*1.6,-0.9,0.9)-s.bank)*Math.min(1,dt*3);
  s.fireT-=dt;
  if(s.fireT<=0&&s.target){
    const T=s.target;
    const tdx=T.pos.x-s.pos.x,tdy=T.pos.y-s.pos.y,tdz=T.pos.z-s.pos.z;
    const td=Math.sqrt(tdx*tdx+tdy*tdy+tdz*tdz);
    if(td<FIRE_RANGE){
      shipFwd(T,TMPD);
      const tt=td/PROJ_SPEED;
      const ax2=T.pos.x+TMPD.x*T.speed*tt,ay2=T.pos.y+TMPD.y*T.speed*tt,az2=T.pos.z+TMPD.z*T.speed*tt;
      shipFwd(s,TMPF_);
      const nx=s.pos.x+TMPF_.x*s.nose,ny=s.pos.y+TMPF_.y*s.nose,nz=s.pos.z+TMPF_.z*s.nose;
      let adx=ax2-nx,ady=ay2-ny,adz=az2-nz;
      const al=Math.sqrt(adx*adx+ady*ady+adz*adz)||1;adx/=al;ady/=al;adz/=al;
      if(TMPF_.x*adx+TMPF_.y*ady+TMPF_.z*adz>0.78){fireShip(s,ax2,ay2,az2,nx,ny,nz);s.fireT=3;}
      else s.fireT=0.15;
    }else s.fireT=0.2;
  }
}
let TMPF_=V3(0,0,0),gx_=0,gy_=0,gz_=0;
function damage(s,amt,src){
  if(!s.alive)return;
  s.hp-=amt;if(s.hp<0)s.hp=0;
  updateBar(s);updateFleetHUD();
  if(s.hp<=0)startDeath(s,src,'fire',0);
}
function startDeath(s,src,cause,delay){
  if(!s.alive||s.dying)return;
  s.alive=false;s.dying=true;s.deathSrc=src||null;s.deathCause=cause;
  s.bar.root.setEnabled(false);
  if(s.pip)s.pip.classList.add('dead');
  pending.push({s,t:delay});
  updateFleetHUD();
}
function updateDeaths(dt){
  for(let i=pending.length-1;i>=0;i--){
    pending[i].t-=dt;
    if(pending[i].t<=0){
      const s=pending[i].s;pending.splice(i,1);
      doExplode(s);
    }
  }
}
function doExplode(s){
  s.dying=false;
  s.hull.setEnabled(false);s.glow.setEnabled(false);
  for(const ex of s.exhaust)ex.inst.setEnabled(false);
  boom(s.pos,s.flag?1.9:1);
  spawnDebris(s);
  feedDeath(s);
  if(followShip===s){followShip=null;$('followTag').hidden=true;}
  if(s.flag)slowT=0.85;

}

/* ============ 12. HUD ============ */

function tagSpan(s){return '<b class="'+(s.fi===0?'fa':'fb')+'">'+s.name+'</b>';}
function feedMsg(html){

/* ============ 14. battle state, victory, restart ============ */
let battleT=0,battleOver=false,winner=-1,victoryAt=0,bannerShown=false;
function checkVictory(){
  if(battleOver)return;
  const a=fleetShips[0].some(function(s){return s.alive;}),
        b=fleetShips[1].some(function(s){return s.alive;});
  if(a&&b)return;
  battleOver=true;winner=a?0:(b?1:-1);victoryAt=battleT;
}
function showBanner(){
  bannerShown=true;
  const title=$('bannerTitle'),stats=$('bannerStats');
  if(winner<0){
    title.textContent='MUTUAL ANNIHILATION';title.style.color='#e8eef7';
    stats.textContent='ENGAGEMENT LENGTH '+fmtT(battleT)+' · NOTHING SURVIVES';
  }else{
    const F=FLEET[winner];
    title.textContent=F.name+' VICTORIOUS';title.style.color=F.ui;
    const lost=10-fleetShips[1-winner].filter(function(s){return s.alive;}).length;
    const surv=fleetShips[winner].filter(function(s){return s.alive;}).length;
    stats.textContent='ENGAGEMENT LENGTH '+fmtT(battleT)+' · '+FLEET[1-winner].short+' LOSSES '+lost+' · '+surv+' SHIPS SURVIVE';
  }
  const b=$('banner');b.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('show');});});
}
function resetBattle(){
  battleT=0;battleOver=false;winner=-1;victoryAt=0;bannerShown=false;slowT=0;shake=0;
  $('banner').hidden=true;$('banner').classList.remove('show');
  $('feed').innerHTML='';setFollow(null);baseTarget.set(0,2,0);
  pending.length=0;
  for(const p of projPool[0].concat(projPool[1])){p.active=false;p.inst.setEnabled(false);p.tSlot=-1;}
  for(const s of trailS){s.state=0;s.fresh=false;}
  for(const f of fireballs){f.active=false;f.m.setEnabled(false);}
  for(const r of rings){r.active=false;r.m.setEnabled(false);}
  for(const f of flashes){f.active=false;f.m.setEnabled(false);}
  for(const d of debrisPools[0].concat(debrisPools[1])){d.active=false;d.inst.setEnabled(false);}
  for(const b of boomLights){b.t=0;b.l.intensity=0;}
  for(const ps of allPS){ps.reset();ps.manualEmitCount=0;}
  for(const s of ships){
    s.pos.set(s.home.x,s.home.y,s.home.z);
    BABYLON.Quaternion.RotationYawPitchRollToRef(s.home.yaw,0,0,s.q);
    s.hp=s.maxHp;s.alive=true;s.dying=false;s.speed=12;s.bank=0;s.throttle=1;
    s.target=null;s.retargetT=0;s.fireT=Math.random()*3;s.deathSrc=null;
    s.hull.setEnabled(true);s.glow.setEnabled(true);s.hull.visibility=1;s.glow.visibility=1;
    for(const ex of s.exhaust){ex.inst.setEnabled(true);ex.inst.visibility=1;}
    s.bar.root.setEnabled(true);

/* ============ 15. per-frame visuals ============ */
function updateVisuals(){
  for(const s of ships){
    if(!s.alive&&!s.dying)continue;
    if(Math.abs(s.bank)>0.001){
      BABYLON.Quaternion.RotationAxisToRef(FWD,s.bank,TMQ);
      DQ.copyFrom(s.q).multiplyInPlace(TMQ);
    }else DQ.copyFrom(s.q);
    s.hull.position.copyFrom(s.pos);s.hull.rotationQuaternion.copyFrom(DQ);
    s.glow.position.copyFrom(s.pos);s.glow.rotationQuaternion.copyFrom(DQ);
    if(s.dying){const v=0.45+Math.random()*0.55;s.hull.visibility=v;s.glow.visibility=v;}
    else{s.hull.visibility=1;s.glow.visibility=1;}
    for(const ex of s.exhaust){
      TMPA.set(ex.ox,ex.oy,ex.oz);TMPA.applyRotationQuaternionToRef(DQ,TMPB);
      ex.inst.position.set(s.pos.x+TMPB.x,s.pos.y+TMPB.y,s.pos.z+TMPB.z);
      ex.inst.rotationQuaternion.copyFrom(DQ);
      const flick=0.82+0.28*Math.sin(battleT*23+ex.ph);
      ex.inst.scaling.set(ex.sx,ex.sx,ex.sz*flick*(0.55+0.65*s.throttle));
      ex.inst.visibility=s.dying?(Math.random()<0.4?0.25:0.9):1;
    }
    if(s.engLight)s.engLight.intensity=s.alive?
      (1.6+0.8*Math.sin(battleT*17+s.fi*3)+0.5*Math.sin(battleT*43+s.fi))*s.throttle*1.3:0;
  }
  for(const s of ships){
    const b=s.bar;
    if(!s.alive){if(b.root.isEnabled())b.root.setEnabled(false);continue;}
    if(!b.root.isEnabled())b.root.setEnabled(true);
    UP.applyRotationQuaternionToRef(s.q,TMPA);
    b.root.position.set(s.pos.x+TMPA.x*b.offY,s.pos.y+TMPA.y*b.offY,s.pos.z+TMPA.z*b.offY);
    const sc=clamp(BABYLON.Vector3.Distance(camera.position,b.root.position)/75,0.8,3.4);
    b.root.scaling.set(sc,sc,1);
  }
}
function updateFX(dt){
  for(const f of fireballs){
    if(!f.active)continue;
    f.t+=dt;
    const k=(f.t-f.delay)/f.dur;
    if(k<0){f.m.setEnabled(false);continue;}
    if(k>=1){f.active=false;f.m.setEnabled(false);continue;}
    const e=1-(1-k)*(1-k);
    f.m.setEnabled(true);
    f.m.scaling.setAll(f.s0+(f.s1-f.s0)*e);
    if(k<0.3)BABYLON.Color3.Lerp(f.c0,f.c1,k/0.3,f.mat.emissiveColor);
    else BABYLON.Color3.Lerp(f.c1,f.c2,(k-0.3)/0.7,f.mat.emissiveColor);
    f.mat.alpha=(1-k)*0.95;
  }
  for(const r of rings){
    if(!r.active)continue;
    r.t+=dt;
    const k=r.t/r.dur;
    if(k<0){r.m.setEnabled(false);continue;}
    if(k>=1){r.active=false;r.m.setEnabled(false);continue;}
    const e=1-Math.pow(1-k,3);
    r.m.setEnabled(true);
    r.m.scaling.setAll(0.5+(r.s1-0.5)*e);
    r.mat.alpha=(1-k)*0.85;
  }
  for(const f of flashes){
    if(!f.active)continue;
    f.t+=dt;
    const k=f.t/f.dur;
    if(k>=1){f.active=false;f.m.setEnabled(false);continue;}
    f.m.setEnabled(true);
    f.m.scaling.setAll(f.s0+(f.s1-f.s0)*k);
    f.m.visibility=1-k;
  }
  for(let fi=0;fi<2;fi++)for(const d of debrisPools[fi]){
    if(!d.active)continue;
    d.pos.addInPlace(TMPA.copyFrom(d.vel).scaleInPlace(dt));
    d.vel.scaleInPlace(Math.max(0,1-0.45*dt));
    d.inst.position.copyFrom(d.pos);
    d.inst.rotation.x+=d.ang.x*dt;d.inst.rotation.y+=d.ang.y*dt;d.inst.rotation.z+=d.ang.z*dt;
    d.life-=dt;
    if(d.life<=0){d.active=false;d.inst.setEnabled(false);continue;}
    const fd=d.dur*0.3;
    d.inst.visibility=d.life<fd?d.life/fd:1;
  }
  for(const b of boomLights){
    if(b.t<=0)continue;
    b.t-=dt*2;
    const k=Math.max(0,b.t);
    b.l.intensity=b.peak*k*k;
  }
  const sf=clamp(dt*60,0,3);
  for(const ps of allPS)ps.updateSpeed=0.01*sf;
}

/* ============ 16. controls & boot ============ */
let paused=false,timeScale=1;
const SPEEDS=[1,2,0.5];let spIdx=0;
function togglePause(){
  paused=!paused;
  $('icoPause').style.display=paused?'none':'block';
  $('icoPlay').style.display=paused?'block':'none';
}
 $('btnPause').addEventListener('click',togglePause);
 $('btnSpeed').addEventListener('click',function(){
  spIdx=(spIdx+1)%SPEEDS.length;timeScale=SPEEDS[spIdx];
  this.innerHTML=timeScale+'&times;';
});
 $('btnRestart').addEventListener('click',resetBattle);
 $('btnAgain').addEventListener('click',resetBattle);
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();togglePause();}
  else if(e.key==='r'||e.key==='R')resetBattle();
});
window.addEventListener('resize',function(){engine.resize();});

spawnFleets();
buildPips();
updateFleetHUD();
resetBattle();

/* ============ 17. main loop ============ */
let lastClock=-1;
engine.runRenderLoop(function(){
  const rdt=Math.min(engine.getDeltaTime()/1000,0.05);
  let scale=paused?0:timeScale;
  if(slowT>0){slowT-=rdt;scale=Math.min(scale,0.35);}
  const dt=rdt*scale;
  battleT+=dt;
  if(dt>0){
    for(const s of ships)updateShip(s,dt,battleT);
    updateDeaths(dt);
    updateProjs(dt);
  }
  updateFX(dt);
  updateTrails(dt);
  updateVisuals();
  /* camera */
  if(followShip&&followShip.alive){
    const k=1-Math.exp(-5*rdt);
    baseTarget.x+=(followShip.pos.x-baseTarget.x)*k;
    baseTarget.y+=(followShip.pos.y-baseTarget.y)*k;
    baseTarget.z+=(followShip.pos.z-baseTarget.z)*k;
  }
  shake*=Math.exp(-rdt*3);
  camera.target.copyFrom(baseTarget);
  if(shake>0.004){
    const amp=shake*shake*3;
    camera.target.addInPlace(TMPA.set(rsym()*amp,rsym()*amp,rsym()*amp));
  }
  if(introT>0){introT-=rdt;camera.radius+=(96-camera.radius)*(1-Math.exp(-rdt*1.1));}
  else if(!followShip&&performance.now()-lastInteract>9000)camera.alpha+=rdt*0.025;
  /* HUD */
  const cs=fmtT(battleT);
  if(cs!==lastClock){lastClock=cs;$('clock').textContent=cs;}
  if(battleOver&&!bannerShown&&battleT-victoryAt>1.4)showBanner();
  scene.render();
});
requestAnimationFrame(function(){
  $('fade').style.opacity='0';
  setTimeout(function(){const f=$('fade');if(f)f.parentNode.removeChild(f);},1500);
});
})();
</script>
