<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>3D Space Battle - Babylon.js</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02040f;}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none;}

<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hud"><div class="blue"><span class="dot" style="background:#3a9eff;color:#3a9eff"></span><b id="blueCount">10</b> BLUE</div><div style="opacity:0.3">|</div><div class="red"><span class="dot" style="background:#ff4a33;color:#ff4a33"></span><b id="redCount">10</b> RED</div><div style="opacity:0.3">|</div><div id="status">BATTLE ENGAGED</div></div>
<div id="legend"><span style="color:#5ab8ff">BLUE</span> ● blue projectiles &nbsp; <span style="color:#ff6b5a">RED</span> ● red<br/>Flagships fire 2× every 3s • Escorts 1× /3s<br/>Chain reaction ≈ 1 ship-width • Engine thrusters lit</div>
<div id="centerMsg"><div id="centerTitle">VICTORY</div><small id="centerSub"></small></div>
<script>
window.addEventListener('DOMContentLoaded',()=>{
const canvas=document.getElementById('renderCanvas');
const engine=new BABYLON.Engine(canvas,true,{antialias:true});
const scene=new BABYLON.Scene(engine);

new BABYLON.DirectionalLight('dir',new BABYLON.Vector3(-0.6,-0.8,-0.5),scene).intensity=1.1;
function createFlareTexture(sc){

  const ctx=cv.getContext('2d'); const g=ctx.createRadialGradient(32,32,0,32,32,32);

}
const flareTex=createFlareTexture(scene);
(()=>{
  const count=5000; const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){const th=Math.random()*Math.PI*2; const ph=Math.acos(2*Math.random()-1); const r=800+Math.random()*900; pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);}

function escortMat(team,sc){const m=new BABYLON.PBRMaterial('m'+Math.random(),sc); const base=team===0?new BABYLON.Color3(0.16,0.38,0.92):new BABYLON.Color3(0.92,0.22,0.14); m.albedoColor=base.scale(0.75); m.emissiveColor=base.scale(0.18); m.metallic=0.65; m.roughness=0.38; return m;}

  const glow=BABYLON.MeshBuilder.CreateCylinder('g',{diameterTop:0.55,diameterBottom:0.2,height:0.75,tessellation:8},sc); glow.parent=root; glow.rotation.x=Math.PI/2; glow.position.z=-2.9;

  const light=new BABYLON.PointLight('l'+Math.random(),new BABYLON.Vector3(0,0,-2.9),sc); light.parent=root; light.diffuse=gmat.emissiveColor.clone(); light.intensity=1.3; light.range=12;

function buildFlagship(team,sc){
  const root=new BABYLON.TransformNode('f'+Math.random(),sc); const mat=new BABYLON.PBRMaterial('fm'+Math.random(),sc); const base=team===0?new BABYLON.Color3(0.2,0.44,1):new BABYLON.Color3(1,0.24,0.14); mat.albedoColor=base.scale(0.82); mat.emissiveColor=base.scale(0.2); mat.metallic=0.72; mat.roughness=0.32;

  const light=new BABYLON.PointLight('fl'+Math.random(),new BABYLON.Vector3(0,0,-7),sc); light.parent=root; light.diffuse=team===0?new BABYLON.Color3(0.3,0.7,1):new BABYLON.Color3(1,0.4,0.12); light.intensity=2.6; light.range=28;
  const ps=new BABYLON.ParticleSystem('fps'+Math.random(),160,sc); ps.particleTexture=flareTex; ps.emitter=root; ps.minEmitBox=new BABYLON.Vector3(-1.25,0,-7.2); ps.maxEmitBox=new BABYLON.Vector3(1.25,0,-7.2); ps.direction1=new BABYLON.Vector3(-0.32,-0.32,-1); ps.direction2=new BABYLON.Vector3(0.32,0.32,-1); ps.minSize=0.22; ps.maxSize=0.92; ps.minLifeTime=0.32; ps.maxLifeTime=0.72; ps.emitRate=92; ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD; ps.color1=team===0?new BABYLON.Color4(0.4,0.8,1,1):new BABYLON.Color4(1,0.52,0.18,1); ps.color2=team===0?new BABYLON.Color4(0.12,0.34,1,0):new BABYLON.Color4(1,0.22,0.05,0); ps.minEmitPower=2.2; ps.maxEmitPower=5.2; ps.start();
  root._ps=ps; root.rotationQuaternion=BABYLON.Quaternion.Identity(); return root;
}
function healthBar(ship,sc){
  const r=new BABYLON.TransformNode('hb'+ship.id,sc);
  const w=ship.isFlagship?4.2:2.6;
  const bg=BABYLON.MeshBuilder.CreatePlane('bg'+ship.id,{width:w,height:0.34},sc); bg.parent=r; bg.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL; const bm=new BABYLON.StandardMaterial('bgm'+ship.id,sc); bm.diffuseColor=new BABYLON.Color3(0,0,0); bm.emissiveColor=new BABYLON.Color3(0.08,0.1); bm.alpha=0.75; bg.material=bm;
  const fg=BABYLON.MeshBuilder.CreatePlane('fg'+ship.id,{width:w*0.92,height:0.22},sc); fg.parent=r; fg.position.z=-0.02; fg.billboardMode=BABYLON.Mesh.BILLBOARDMODE_ALL; const fm=new BABYLON.StandardMaterial('fgm'+ship.id,sc); fm.emissiveColor=new BABYLON.Color3(0,1,0.2); bg.material.backFaceCulling=fm.backFaceCulling=false; fg.material=fm; return r;

const ships=[], projectiles=[]; let sid=0;
function makeShip(team,flag,center,off){
  const pos=center.clone().add(off); const root=flag?buildFlagship(team,scene):buildEscort(team,scene); root.position=pos.clone();
  const enemy=team===0?new BABYLON.Vector3(75,0,0):new BABYLON.Vector3(-75,0,0); root.rotationQuaternion=BABYLON.Quaternion.FromLookDirectionLH(enemy.subtract(pos).normalize(),BABYLON.Vector3.Up());
  const ship={id:sid++,team,isFlagship:flag,root,health:flag?420:110,maxHealth:flag?420:110,velocity:new BABYLON.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*2,(Math.random()-0.5)*2),target:null,fireCooldown:Math.random()*2,alive:true,radius:flag?5.8:2.6};
  ship.healthBar=healthBar(ship,scene); ships.push(ship);
}
const blueC=new BABYLON.Vector3(-72,0,0), redC=new BABYLON.Vector3(72,0,0);
makeShip(0,true,blueC,BABYLON.Vector3.Zero()); makeShip(1,true,redC,BABYLON.Vector3.Zero());
for(let i=0;i<9;i++){const a=(i/9)*Math.PI*2; const off=new BABYLON.Vector3(Math.cos(a)*13+ (Math.random()-0.5)*6, (Math.random()-0.5)*12, Math.sin(a)*13); makeShip(0,false,blueC,off);}
for(let i=0;i<9;i++){const a=(i/9)*Math.PI*2; const off=new BABYLON.Vector3(Math.cos(a)*13+ (Math.random()-0.5)*6, (Math.random()-0.5)*12, Math.sin(a)*13); makeShip(1,false,redC,off);}

function createExplosion(pos,isLarge){
  const inten=isLarge?2.2:1.2;
  const light=new BABYLON.PointLight('ex'+Date.now(),pos.clone(),scene); light.diffuse=new BABYLON.Color3(1,0.62,0.22); light.intensity=9*inten; light.range=48*inten;
  let t0=performance.now(); const obs=scene.onBeforeRenderObservable.add(()=>{const e=(performance.now()-t0)/1000; light.intensity=Math.max(0,9*inten*(1-e/0.65)); if(e>0.65){scene.onBeforeRenderObservable.remove(obs); light.dispose();}});
  const mkPS=(cap,minS,maxS,lifeMin,lifeMax,rate,c1,c2,pMin,pMax)=>{
    const ps=new BABYLON.ParticleSystem('p'+Math.random(),cap,scene); ps.particleTexture=flareTex; ps.emitter=pos.clone(); ps.minEmitBox=new BABYLON.Vector3(-0.6,-0.6); ps.maxEmitBox=new BABYLON.Vector3(0.6,0.6); ps.direction1=new BABYLON.Vector3(-1,-1,-1); ps.direction2=new BABYLON.Vector3(1,1,1); ps.minSize=minS; ps.maxSize=maxS; ps.minLifeTime=lifeMin; ps.maxLifeTime=lifeMax; ps.emitRate=rate; ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD; ps.color1=c1; ps.color2=c2; ps.minEmitPower=pMin; ps.maxEmitPower=pMax; ps.start(); return ps;
  };
  const p1=mkPS(isLarge?750:420,isLarge?0.9:0.45,isLarge?4.2:2.2,0.22,0.92,isLarge?2600:1300,new BABYLON.Color4(1,0.92,0.32,1),new BABYLON.Color4(1,0.22,0.02,1),6*inten,19*inten);
  setTimeout(()=>{p1.stop(); setTimeout(()=>p1.dispose(),2100);},isLarge?420:260);
  const p2=mkPS(isLarge?420:220,0.06,0.28,0.45,1.15,isLarge?1900:950,new BABYLON.Color4(1,1,0.88,1),new BABYLON.Color4(1,0.52,0.1,0.7),11*inten,30*inten);
  setTimeout(()=>{p2.stop(); setTimeout(()=>p2.dispose(),1600);},isLarge?520:320);
  const p3=new BABYLON.ParticleSystem('sm'+Math.random(),160,scene); p3.particleTexture=flareTex; p3.emitter=pos.clone(); p3.direction1=new BABYLON.Vector3(-0.6,0.2,-0.6); p3.direction2=new BABYLON.Vector3(0.6,1,0.6); p3.minSize=0.7; p3.maxSize=isLarge?6.5:3.4; p3.minLifeTime=1.1; p3.maxLifeTime=2.4; p3.emitRate=65; p3.color1=new BABYLON.Color4(0.26,0.23,0.21,0.62); p3.minEmitPower=1.2; p3.maxEmitPower=4.5; p3.start(); setTimeout(()=>{p3.stop(); setTimeout(()=>p3.dispose(),3200);},isLarge?950:620);
  const ring=BABYLON.MeshBuilder.CreateTorus('ring',{diameter:1.2,thickness:0.38,tessellation:36},scene); ring.position=pos.clone(); const rm=new BABYLON.StandardMaterial('rm'+Math.random(),scene); rm.emissiveColor=new BABYLON.Color3(1,0.64,0.18); rm.alpha=0.88; ring.material=rm; let rs=0.2; const ro=scene.onBeforeRenderObservable.add(()=>{rs+=isLarge?0.92:0.62; ring.scaling.setAll(rs); rm.alpha-=0.028; if(rm.alpha<=0){scene.onBeforeRenderObservable.remove(ro); ring.dispose(); rm.dispose();}});
  const sw=BABYLON.MeshBuilder.CreateSphere('sw',{diameter:1},scene); sw.position=pos.clone(); const sm=new BABYLON.StandardMaterial('swm'+Math.random(),scene); sm.emissiveColor=new BABYLON.Color3(1,0.52,0.12); sm.wireframe=true; sm.alpha=0.62; sw.material=sm; let sws=0.3; const so=scene.onBeforeRenderObservable.add(()=>{sws+=isLarge?1.15:0.74; sw.scaling.setAll(sws); sm.alpha-=0.022; if(sm.alpha<=0){scene.onBeforeRenderObservable.remove(so); sw.dispose(); sm.dispose();}});
  for(let i=0;i<(isLarge?20:11);i++){const d=BABYLON.MeshBuilder.CreateBox('d'+Math.random(),{size:isLarge?0.55+Math.random()*0.9:0.32+Math.random()*0.45},scene); d.position=pos.clone().add(new BABYLON.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*2,(Math.random()-0.5)*2)); const dm=new BABYLON.PBRMaterial('dm'+Math.random(),scene); dm.albedoColor=new BABYLON.Color3(0.36,0.34,0.32); dm.metallic=0.82; dm.roughness=0.58; d.material=dm; const v=new BABYLON.Vector3((Math.random()-0.5)*22,(Math.random()-0.5)*22,(Math.random()-0.5)*22); const av=new BABYLON.Vector3((Math.random()-0.5)*9,(Math.random()-0.5)*9,(Math.random()-0.5)*9); let life=0; const ob=scene.onBeforeRenderObservable.add(()=>{const dt=engine.getDeltaTime()/1000; d.position.addInPlace(v.scale(dt)); v.scaleInPlace(0.994); d.rotation.x+=av.x*dt; d.rotation.y+=av.y*dt; life+=dt; if(life>(isLarge?3.8:2.4)){scene.onBeforeRenderObservable.remove(ob); d.dispose(); dm.dispose();}});}

function explodeShip(ship){if(!ship.alive) return; ship.alive=false; try{ship.root._ps.stop();}catch(e){} ship.root.setEnabled(false); ship.healthBar.setEnabled(false); createExplosion(ship.root.position.clone(),ship.isFlagship); const cr=ship.isFlagship?14:8.5; ships.forEach(o=>{if(o.alive && o!==ship && BABYLON.Vector3.Distance(o.root.position,ship.root.position) < cr+o.radius){setTimeout(()=>explodeShip(o),90+Math.random()*160);}});}
function fire(ship){
  const col=ship.team===0?new BABYLON.Color3(0.22,0.66,1):new BABYLON.Color3(1,0.18,0.1);
  const offs=ship.isFlagship?[-1.45,1.45]:[0];
  offs.forEach(ox=>{
    const mesh=BABYLON.MeshBuilder.CreateSphere('pr',{diameter:0.52},scene); const mat=new BABYLON.StandardMaterial('prm'+Math.random(),scene); mat.emissiveColor=col.clone(); mat.diffuseColor=col.clone(); mesh.material=mat;

scene.onBeforeRenderObservable.add(()=>{
  const dt=Math.min(engine.getDeltaTime()/1000,0.05);
  ships.forEach(s=>{
    if(!s.alive) return;
    if(!s.target ||!s.target.alive){let b=null,bd=1e9; ships.forEach(o=>{if(o.team!==s.team && o.alive){const d=BABYLON.Vector3.DistanceSquared(s.root.position,o.root.position); if(d<bd){bd=d; b=o;}}}); s.target=b;}
    if(s.target){
      let des=s.target.root.position.subtract(s.root.position); des.addInPlace(new BABYLON.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*2,(Math.random()-0.5)*2));
      ships.forEach(o=>{if(o!==s && o.alive){const diff=s.root.position.subtract(o.root.position); const d2=diff.lengthSquared(); if(d2<36 && d2>0.001) des.addInPlace(diff.normalize().scale(4.5/(d2+0.5)));}});

      s.fireCooldown-=dt; const dist=BABYLON.Vector3.Distance(s.root.position,s.target.root.position); const dot=BABYLON.Vector3.Dot(fwd,dir);
      if(s.fireCooldown<=0 && dist<138 && dot>0.52){fire(s); s.fireCooldown=3+Math.random()*0.6;}
    }
    if(s.healthBar){s.healthBar.position=s.root.position.clone().add(new BABYLON.Vector3(0,s.isFlagship?6.2:3.6,0)); const r=Math.max(0,s.health/s.maxHealth); const fg=s.healthBar.getChildren()[1]; if(fg){fg.scaling.x=r; const fm=fg.material; if(r>0.6) fm.emissiveColor.set(0,1,0.2); else if(r>0.32) fm.emissiveColor.set(1,0.9,0.1); else fm.emissiveColor.set(1,0.15,0.08);}}
    if(s.health<=0 && s.alive) explodeShip(s);
  });
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.life+=dt; p.mesh.position.addInPlace(p.velocity.scale(dt));
    if(p.life>p.maxLife || p.mesh.position.length()>420){try{p.trail.dispose();}catch(e){} p.light.dispose(); p.mesh.dispose(); p.tmat.dispose(); projectiles.splice(i,1); continue;}
    for(let j=0;j<ships.length;j++){const sh=ships[j]; if(!sh.alive || sh.team===p.team) continue; if(BABYLON.Vector3.DistanceSquared(p.mesh.position,sh.root.position) < (sh.radius+0.7)*(sh.radius+0.7)){sh.health-=p.damage; try{p.trail.dispose();}catch(e){} p.light.dispose(); p.mesh.dispose(); p.tmat.dispose(); projectiles.splice(i,1); break;}}
  }
  let b=0,r=0; ships.forEach(s=>{if(s.alive){if(s.team===0) b++; else r++;}}); document.getElementById('blueCount').textContent=b; document.getElementById('redCount').textContent=r;
  if((b===0 || r===0) &&!window._ended){window._ended=true; const msg=document.getElementById('centerMsg'); const ti=document.getElementById('centerTitle'); const su=document.getElementById('centerSub'); if(b===0 && r===0){ti.textContent='MUTUAL ANNIHILATION'; su.textContent='Both fleets destroyed';} else if(b===0){ti.textContent='RED FLEET VICTORIOUS'; su.textContent='Blue flagship lost';} else {ti.textContent='BLUE FLEET VICTORIOUS'; su.textContent='Red flagship lost';} msg.style.display='block';}
});
engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
});
</script>
