<!DOCTYPE html>
<html>
<head>
    <title>3D Space Battle Scene</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        var canvas = document.createElement('canvas');
        document.body.appendChild(canvas);

        var engine = new BABYLON.Engine(canvas, true);
        var scene = new BABYLON.Scene(engine);

        // Camera
        var camera = new BABYLON.ArcRotateCamera('camera', 0, 0, 10, new BABYLON.Vector3(0, 0, 0), scene);
        camera.attachControl(canvas, true);

        // Light
        var light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.7;

        // Background
        var background = new BABYLON.Layer('background', 'assets/space_background.jpg', scene);
        background.isBackground = true;

        // Spaceships
        // Add code here to create the fleets, ships, health bars, explosions, projectiles, movements, etc.

        // Render loop
        engine.runRenderLoop(function () {
            scene.render();
            // Update ship movements, collisions, explosions, etc.
        });

        // Resize
        window.addEventListener('resize', function () {
            engine.resize();
        });
    </script>
</body>
</html>
