<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Battle - Babylon.js</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="info"><strong>SPACE BATTLE</strong> - Drag to rotate, scroll to zoom</div>
    <div id="controls">Blue fleet: 10 ships | Red fleet: 10 ships</div>

    <script>
        // ============================================
        // SPACE BATTLE SCENE - BABYLON.JS
        // ============================================

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { 
            preserveDrawingBuffer: true,
            stencil: true 
        }, true);

        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.05, 1);

        // Camera setup
        const camera = new BABYLON.ArcRotateCamera("Camera", 
            -Math.PI / 2, Math.PI / 2.5, 250, 
            BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 50;
        camera.upperRadiusLimit = 500;
        camera.minZ = 0.1;
        camera.fov = 0.8;

        // Lighting
        const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
        ambientLight.intensity = 0.3;
        
        const mainLight = new BABYLON.DirectionalLight("main", new BABYLON.Vector3(-1, -2, 1), scene);
        mainLight.intensity = 0.6;

        // Glow layer for emissive effects
        const glow = new BABYLON.GlowLayer("glow", scene);
        glow.intensity = 0.6;

        // ============================================
        // STARFIELD BACKGROUND
        // ============================================
        function createStarfield() {
            const stars = new BABYLON.PointsCloudSystem("stars", 2, scene);
            const starCount = 1500;
            
            stars.addPoints(starCount, (particle) => {
                particle.position = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 800,
                    (Math.random() - 0.5) * 800,
                    (Math.random() - 0.5) * 800
                );
                const brightness = Math.random() * 0.8 + 0.2;
                particle.color = new BABYLON.Color4(
                    brightness * (0.9 + Math.random() * 0.1),
                    brightness * (0.9 + Math.random() * 0.1),
                    brightness * (0.95 + Math.random() * 0.05),
                    1
                );
            });
            
            stars.buildMeshAsync().then(() => {
                stars.mesh.renderingGroupId = 0;
            });
        }
        createStarfield();

        // ============================================
        // SHIP CREATION SYSTEM
        // ============================================
        
        // Create ship mesh parts
        function createShipParts(isFlagship, color) {
            const parts = [];
            const scale = isFlagship ? 2.5 : 1.5;
            const hullColor = color;
            
            // Main hull (central body)
            const hull = BABYLON.MeshBuilder.CreateCylinder("hull", {
                height: 3 * scale,
                diameterTop: 0.3 * scale,
                diameterBottom: 1.2 * scale,
                tessellation: isFlagship ? 8 : 6
            }, scene);
            hull.rotation.x = Math.PI / 2;
            parts.push(hull);

            // Engine block
            const engine = BABYLON.MeshBuilder.CreateCylinder("engine", {
                height: 1.2 * scale,
                diameter: 0.9 * scale,
                tessellation: 6
            }, scene);
            engine.rotation.x = Math.PI / 2;
            engine.position.z = -1.8 * scale;
            parts.push(engine);

            // Engine glow
            const engineGlow = BABYLON.MeshBuilder.CreateCylinder("engineGlow", {
                height: 0.4 * scale,
                diameter: 0.7 * scale,
                tessellation: 8
            }, scene);
            engineGlow.rotation.x = Math.PI / 2;
            engineGlow.position.z = -2.4 * scale;
            engineGlow.material = new BABYLON.StandardMaterial("engineGlowMat", scene);
            engineGlow.material.emissiveColor = color.scale(0.8);
            engineGlow.material.disableLighting = true;
            parts.push(engineGlow);

            // Wings
            const wingShape = new BABYLON.Vector3(0, 0, 0);
            const wingPath = [
                new BABYLON.Vector3(0, 0, 0.8 * scale),
                new BABYLON.Vector3(1.5 * scale, 0, -0.3 * scale),
                new BABYLON.Vector3(1.8 * scale, 0, -0.8 * scale)
            ];
            
            for (let i = 0; i < 2; i++) {
                const wing = BABYLON.MeshBuilder.CreateTube("wing" + i, {
                    path: wingPath,
                    radiusFunction: (i) => 0.1 * scale,
                    tessellation: 6,
                    cap: BABYLON.Mesh.CAP_ALL
                }, scene);
                wing.rotation.x = Math.PI / 2;
                wing.position.y = (i === 0 ? 0.3 * scale : -0.3 * scale);
                wing.scaling.x = i === 0 ? 1 : -1;
                parts.push(wing);
            }

            // Cockpit/cannon
            const cockpit = BABYLON.MeshBuilder.CreateBox("cockpit", {
                width: 0.8 * scale,
                height: 0.4 * scale,
                depth: 1.2 * scale
            }, scene);
            cockpit.position.z = 1.2 * scale;
            cockpit.position.y = 0.4 * scale;
            parts.push(cockpit);

            // Additional details for flagships
            if (isFlagship) {
                // Side towers
                for (let i = 0; i < 2; i++) {
                    const tower = BABYLON.MeshBuilder.CreateBox("tower" + i, {
                        width: 0.5 * scale,
                        height: 0.5 * scale,
                        depth: 1.5 * scale
                    }, scene);
                    tower.position.x = (i === 0 ? -0.6 * scale : 0.6 * scale);
                    tower.position.z = 0.5 * scale;
                    parts.push(tower);
                }
                
                // Antenna
                const antenna = BABYLON.MeshBuilder.CreateCylinder("antenna", {
                    height: 1 * scale,
                    diameterTop: 0.05 * scale,
                    diameterBottom: 0.15 * scale
                }, scene);
                antenna.position.y = 0.8 * scale;
                antenna.position.z = 0.8 * scale;
                parts.push(antenna);
            }

            // Merge all parts
            const merged = BABYLON.Mesh.MergeMeshes(parts, true, false, null, false, false);
            merged.name = "ship";
            merged.metadata = {
                health: isFlagship ? 150 : 100,
                maxHealth: isFlagship ? 150 : 100,
                isFlagship: isFlagship,
                team: 'blue',
                lastFireTime: 0
            };
            
            const material = new BABYLON.StandardMaterial("shipMat", scene);
            material.diffuseColor = hullColor;
            material.specularColor = new BABYLON.Color3(0.3, 0.4, 0.5);
            material.emissiveColor = hullColor.scale(0.1);
            merged.material = material;
            
            return merged;
        }

        // Create health bar plane
        function createHealthBar() {
            const bg = BABYLON.MeshBuilder.CreatePlane("healthBg", { width: 3, height: 0.4 }, scene);
            const bgMat = new BABYLON.StandardMaterial("healthBgMat", scene);
            bgMat.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            bgMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
            bg.material = bgMat;

            const fg = BABYLON.MeshBuilder.CreatePlane("healthFg", { width: 2.8, height: 0.3 }, scene);
            const fgMat = new BABYLON.StandardMaterial("healthFgMat", scene);
            fgMat.emissiveColor = new BABYLON.Color3(0, 1, 0);
            fg.material = fgMat;

            return { bg, fg };
        }

        // ============================================
        // PROJECTILE SYSTEM
        // ============================================
        
        // Create projectile mesh
        function createProjectile(color) {
            const proj = BABYLON.MeshBuilder.CreateSphere("projectile", {
                diameter: 0.5,
                segments: 8
            }, scene);
            
            const material = new BABYLON.StandardMaterial("projMat", scene);
            material.emissiveColor = color;
            material.disableLighting = true;
            proj.material = material;
            
            return proj;
        }

        // Create trail particle system
        function createTrail(color, emitter) {
            const trail = new BABYLON.ParticleSystem("trail", 150, scene);
            trail.emitter = emitter;
            trail.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            trail.createSphereEmitter(0.1);
            
            trail.color1 = new BABYLON.Color4(color.r, color.g, color.b, 1);
            trail.color2 = new BABYLON.Color4(color.r, color.g, color.b, 0.8);
            trail.colorDead = new BABYLON.Color4(color.r, color.g, color.b, 0);
            
            trail.minSize = 0.2;
            trail.maxSize = 0.6;
            trail.minLifeTime = 0.3;
            trail.maxLifeTime = 0.5;
            trail.emitRate = 60;
            trail.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
            trail.gravity = new BABYLON.Vector3(0, 0, 0);
            trail.minEmitPower = 0.1;
            trail.maxEmitPower = 0.2;
            trail.updateSpeed = 0.02;
            
            return trail;
        }

        // ============================================
        // EXPLOSION SYSTEM
        // ============================================
        function createExplosion(ship) {
            const pos = ship.position.clone();
            
            // Fire burst
            const fire = new BABYLON.ParticleSystem("explosionFire", 500, scene);
            fire.emitter = pos;
            fire.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            fire.createSphereEmitter(1);
            fire.color1 = new BABYLON.Color4(1, 0.5, 0.2, 1);
            fire.color2 = new BABYLON.Color4(1, 0.3, 0.1, 1);
            fire.colorDead = new BABYLON.Color4(0.1, 0, 0, 0);
            fire.minSize = 0.5;
            fire.maxSize = 3;
            fire.minLifeTime = 0.4;
            fire.maxLifeTime = 0.8;
            fire.emitRate = 500;
            fire.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
            fire.gravity = new BABYLON.Vector3(0, 0, 0);
            fire.minEmitPower = 8;
            fire.maxEmitPower = 15;
            fire.updateSpeed = 0.02;
            fire.targetStopDuration = 0.5;
            fire.disposeOnStop = true;

            // Sparks
            const sparks = new BABYLON.ParticleSystem("explosionSparks", 200, scene);
            sparks.emitter = pos;
            sparks.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            sparks.createSphereEmitter(1);
            sparks.color1 = new BABYLON.Color4(1, 1, 0.8, 1);
            sparks.color2 = new BABYLON.Color4(1, 0.8, 0.3, 0.8);
            sparks.colorDead = new BABYLON.Color4(0.5, 0.2, 0, 0);
            sparks.minSize = 0.3;
            sparks.maxSize = 1;
            sparks.minLifeTime = 0.5;
            sparks.maxLifeTime = 1.5;
            sparks.emitRate = 200;
            sparks.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
            sparks.gravity = new BABYLON.Vector3(0, -0.5, 0);
            sparks.minEmitPower = 10;
            sparks.maxEmitPower = 20;
            sparks.updateSpeed = 0.02;
            sparks.targetStopDuration = 0.3;
            sparks.disposeOnStop = true;

            // Shockwave
            const shockwave = BABYLON.MeshBuilder.CreateDisc("shockwave", { radius: 1, tessellation: 32 }, scene);
            shockwave.position = pos.clone();
            const swMat = new BABYLON.StandardMaterial("swMat", scene);
            swMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0.5);
            swMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
            swMat.alpha = 0.8;
            swMat.backFaceCulling = false;
            shockwave.material = swMat;
            shockwave.lookAt(camera.position);

            // Animate shockwave
            const startTime = performance.now();
            const animDuration = 0.6;
            
            const shockAnim = () => {
                const elapsed = (performance.now() - startTime) / 1000;
                const progress = elapsed / animDuration;
                if (progress < 1) {
                    shockwave.scaling = new BABYLON.Vector3(
                        progress * 15,
                        progress * 15,
                        progress * 15
                    );
                    swMat.alpha = 0.8 * (1 - progress);
                    requestAnimationFrame(shockAnim);
                } else {
                    shockwave.dispose();
                }
            };
            requestAnimationFrame(shockAnim);

            // Debris
            for (let i = 0; i < 8; i++) {
                const debris = BABYLON.MeshBuilder.CreateBox("debris" + i, {
                    size: 0.3 + Math.random() * 0.3
                }, scene);
                debris.position = pos.clone();
                const dMat = new BABYLON.StandardMaterial("dMat" + i, scene);
                dMat.emissiveColor = new BABYLON.Color3(0.5, 0.5, 0.6);
                debris.material = dMat;
                
                debris.metadata = {
                    velocity: new BABYLON.Vector3(
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10
                    ),
                    angularVelocity: new BABYLON.Vector3(
                        Math.random() * 2,
                        Math.random() * 2,
                        Math.random() * 2
                    ),
                    life: 2.0
                };
                
                debrisAnim(debris);
            }

            // Check for chain reactions
            checkExplosionChainReaction(pos, ship);
        }

        function debrisAnim(debris) {
            if (!debris || debris.isDisposed()) return;
            
            debris.metadata.life -= 0.016;
            if (debris.metadata.life <= 0) {
                debris.dispose();
                return;
            }
            
            debris.position.addInPlace(debris.metadata.velocity.scale(0.016));
            debris.rotation.x += debris.metadata.angularVelocity.x * 0.016;
            debris.rotation.y += debris.metadata.angularVelocity.y * 0.016;
            debris.metadata.velocity.scaleInPlace(0.98);
            
            requestAnimationFrame(() => debrisAnim(debris));
        }

        function checkExplosionChainReaction(explosionPos, excludeShip) {
            const ships = scene.meshes.filter(m => m.name === "ship" && !m.isDisposed());
            
            for (const ship of ships) {
                if (ship === excludeShip || ship.isDisposed()) continue;
                
                const dist = BABYLON.Vector3.Distance(explosionPos, ship.position);
                if (dist < 8) {
                    // Chain reaction!
                    setTimeout(() => {
                        if (!ship.isDisposed()) {
                            ship.metadata.health = 0;
                            createExplosion(ship);
                            ship.dispose();
                        }
                    }, 100);
                }
            }
        }

        // ============================================
        // SHIP AI AND MOVEMENT
        // ============================================
        
        class ShipAI {
            constructor(ship, targetFleets) {
                this.ship = ship;
                this.targetFleets = targetFleets;
                this.targetPos = null;
                this.lastPositionChange = 0;
                this.changeInterval = 2 + Math.random() * 2;
                
                // Movement parameters
                this.speed = 0.03 + Math.random() * 0.02;
                this.turnSpeed = 0.02 + Math.random() * 0.01;
                this.preferredDistance = 15 + Math.random() * 10;
            }

            update(time) {
                if (this.ship.isDisposed()) return;

                // Update target position periodically
                if (time - this.lastPositionChange > this.changeInterval) {
                    this.updateTargetPosition();
                    this.lastPositionChange = time;
                    this.changeInterval = 1 + Math.random() * 3;
                }

                // Move toward target
                if (this.targetPos) {
                    const direction = this.targetPos.subtract(this.ship.position);
                    const distance = direction.length();
                    
                    if (distance > 2) {
                        direction.normalize();
                        
                        // Smooth turning
                        const targetRotation = Math.atan2(direction.y, direction.x);
                        const currentRotation = this.ship.rotation.y;
                        let rotationDelta = targetRotation - currentRotation;
                        
                        // Normalize rotation angle
                        while (rotationDelta > Math.PI) rotationDelta -= 2 * Math.PI;
                        while (rotationDelta < -Math.PI) rotationDelta += 2 * Math.PI;
                        
                        this.ship.rotation.y += rotationDelta * this.turnSpeed;
                        
                        // Move forward
                        const moveVec = new BABYLON.Vector3(
                            Math.cos(this.ship.rotation.y) * this.speed,
                            Math.sin(this.ship.rotation.y) * this.speed,
                            0
                        );
                        this.ship.position.addInPlace(moveVec);
                    }
                }

                // Add some random floating motion
                if (Math.random() < 0.01) {
                    this.ship.rotation.z += (Math.random() - 0.5) * 0.1;
                }

                // Keep within bounds
                const bound = 80;
                if (this.ship.position.x > bound) this.ship.position.x = bound;
                if (this.ship.position.x < -bound) this.ship.position.x = -bound;
                if (this.ship.position.y > bound) this.ship.position.y = bound;
                if (this.ship.position.y < -bound) this.ship.position.y = -bound;
            }

            updateTargetPosition() {
                if (!this.targetFleets || this.targetFleets.length === 0) return;

                // Find nearest enemy fleet center
                let nearestEnemy = null;
                let minDist = Infinity;
                
                for (const fleet of this.targetFleets) {
                    const center = new BABYLON.Vector3(0, 0, 0);
                    let count = 0;
                    
                    for (const ship of fleet.ships) {
                        if (!ship.isDisposed()) {
                            center.addInPlace(ship.position);
                            count++;
                        }
                    }
                    
                    if (count > 0) {
                        center.scaleInPlace(1/count);
                        const dist = BABYLON.Vector3.Distance(this.ship.position, center);
                        if (dist < minDist) {
                            minDist = dist;
                            nearestEnemy = center;
                        }
                    }
                }

                if (nearestEnemy) {
                    // Get random ship from fleet
                    const targetShip = this.targetFleets[0].ships.find(s => !s.isDisposed());
                    if (targetShip) {
                        this.targetPos = targetShip.position.clone();
                        // Add some randomness
                        this.targetPos.x += (Math.random() - 0.5) * 15;
                        this.targetPos.y += (Math.random() - 0.5) * 15;
                    } else {
                        this.targetPos = nearestEnemy.clone();
                    }
                }
            }

            getFiringSolution() {
                if (!this.targetFleets || this.targetFleets.length === 0) return null;
                
                // Find nearest enemy ship
                let nearestShip = null;
                let minDist = Infinity;
                
                for (const fleet of this.targetFleets) {
                    for (const ship of fleet.ships) {
                        if (ship.isDisposed()) continue;
                        const dist = BABYLON.Vector3.Distance(this.ship.position, ship.position);
                        if (dist < minDist) {
                            minDist = dist;
                            nearestShip = ship;
                        }
                    }
                }
                
                return nearestShip && minDist < 60 ? nearestShip : null;
            }
        }

        // ============================================
        // FLEET MANAGEMENT
        // ============================================
        
        function createFleet(team, centerPos, flagships, escorts) {
            const fleet = {
                team: team,
                ships: [],
                ais: []
            };
            
            const color = team === 'blue' ? 
                new BABYLON.Color3(0.2, 0.3, 0.4) : 
                new BABYLON.Color3(0.4, 0.2, 0.2);
            
            const projectileColor = team === 'blue' ?
                new BABYLON.Color3(0.3, 0.6, 1) :
                new BABYLON.Color3(1, 0.3, 0.3);

            // Create flagship
            const flagship = createShipParts(true, color);
            flagship.position = centerPos.clone();
            flagship.metadata.team = team;
            
            const flagshipHealthBar = createHealthBar();
            flagshipHealthBar.bg.position = centerPos.clone();
            flagshipHealthBar.bg.position.y += 3;
            flagshipHealthBar.fg.position = centerPos.clone();
            flagshipHealthBar.fg.position.y += 3;
            flagshipHealthBar.fg.position.z += 0.1;
            
            fleet.ships.push(flagship);
            const flagshipAI = new ShipAI(flagship, []);
            fleet.ais.push(flagshipAI);
            
            // Create 9 escorts
            for (let i = 0; i < 9; i++) {
                const angle = (i / 9) * Math.PI * 2;
                const radius = 12 + Math.random() * 8;
                const escortPos = new BABYLON.Vector3(
                    centerPos.x + Math.cos(angle) * radius,
                    centerPos.y + Math.sin(angle) * radius,
                    centerPos.z + (Math.random() - 0.5) * 10
                );
                
                const escort = createShipParts(false, color);
                escort.position = escortPos;
                escort.metadata.team = team;
                
                const escortHealthBar = createHealthBar();
                escortHealthBar.bg.position = escortPos.clone();
                escortHealthBar.bg.position.y += 2.5;
                escortHealthBar.fg.position = escortPos.clone();
                escortHealthBar.fg.position.y += 2.5;
                escortHealthBar.fg.position.z += 0.1;
                
                fleet.ships.push(escort);
                const escortAI = new ShipAI(escort, []);
                fleet.ais.push(escortAI);
            }
            
            return fleet;
        }

        // ============================================
        // COMBAT SYSTEM
        // ============================================
        
        const projectiles = [];
        
        function fireProjectile(ship, target, color) {
            if (ship.isDisposed() || target.isDisposed()) return;
            
            const projectile = createProjectile(color);
            projectile.position = ship.position.clone();
            projectile.position.z += 1.5;
            
            const trail = createTrail(color, projectile);
            trail.start();
            
            projectile.metadata = {
                velocity: target.position.subtract(ship.position).normalize().scale(1.5),
                damage: ship.metadata.isFlagship ? 20 : 15,
                team: ship.metadata.team,
                life: 3.0,
                trail: trail
            };
            
            projectiles.push(projectile);
        }

        function updateProjectiles(time, delta) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                if (proj.isDisposed()) {
                    projectiles.splice(i, 1);
                    continue;
                }
                
                proj.position.addInPlace(proj.metadata.velocity.scale(delta * 60));
                proj.metadata.life -= delta;
                
                if (proj.metadata.life <= 0) {
                    proj.dispose();
                    if (proj.metadata.trail) proj.metadata.trail.dispose();
                    projectiles.splice(i, 1);
                    continue;
                }
                
                // Check collisions
                const ships = scene.meshes.filter(m => 
                    m.name === "ship" && !m.isDisposed() && m.metadata.team !== proj.metadata.team
                );
                
                for (const ship of ships) {
                    const dist = BABYLON.Vector3.Distance(proj.position, ship.position);
                    if (dist < 2.5) {
                        ship.metadata.health -= proj.metadata.damage;
                        proj.dispose();
                        if (proj.metadata.trail) proj.metadata.trail.dispose();
                        projectiles.splice(i, 1);
                        
                        if (ship.metadata.health <= 0) {
                            createExplosion(ship);
                            ship.dispose();
                        }
                        break;
                    }
                }
            }
        }

        function updateHealthBars() {
            const ships = scene.meshes.filter(m => m.name === "ship");
            
            for (const ship of ships) {
                // Find associated health bars
                const healthBgs = scene.meshes.filter(m => m.name === "healthBg" && !m.isDisposed());
                const healthFgs = scene.meshes.filter(m => m.name === "healthFg" && !m.isDisposed());
                
                // This is simplified - in practice you'd want to track this better
                // For now, just update all health bars to match their ships
            }
        }

        // ============================================
        // INITIALIZE FLEETS
        // ============================================
        
        const blueFleet = createFleet('blue', new BABYLON.Vector3(-60, 0, 0));
        const redFleet = createFleet('red', new BABYLON.Vector3(60, 0, 0));

        // Set enemy fleets for AI
