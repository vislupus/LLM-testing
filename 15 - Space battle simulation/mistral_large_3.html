<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Space Battle</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
        }

        #canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: Arial, sans-serif;
        }

        #loading-text {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #progress-container {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #4a6baf;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading-screen">
        <div id="loading-text">Initializing Space Battle...</div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script>
        // Wait for the page to load
        document.addEventListener('DOMContentLoaded', function() {
            // Get the canvas element
            const canvas = document.getElementById("canvas");

            // Initialize the Babylon.js engine
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: true,
                stencil: true
            });

            // Update progress bar
            function updateProgress(percentage) {
                const progressBar = document.getElementById('progress-bar');
                progressBar.style.width = `${percentage}%`;
            }

            // Create the scene
            const createScene = async function() {
                // Create a basic Babylon scene
                const scene = new BABYLON.Scene(engine);

                // Add a camera
                const camera = new BABYLON.ArcRotateCamera(
                    "camera",
                    -Math.PI / 2,
                    Math.PI / 2.5,
                    100,
                    new BABYLON.Vector3(0, 0, 0),
                    scene
                );
                camera.attachControl(canvas, true);
                camera.wheelPrecision = 50;
                camera.lowerRadiusLimit = 20;
                camera.upperRadiusLimit = 500;
                camera.panningSensibility = 50;

                // Add lights
                const hemiLight = new BABYLON.HemisphericLight(
                    "hemiLight",
                    new BABYLON.Vector3(0, 1, 0),
                    scene
                );
                hemiLight.intensity = 0.2;
                hemiLight.diffuse = new BABYLON.Color3(0.8, 0.8, 1);
                hemiLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);

                const dirLight = new BABYLON.DirectionalLight(
                    "dirLight",
                    new BABYLON.Vector3(-1, -2, -1),
                    scene
                );
                dirLight.intensity = 0.5;
                dirLight.diffuse = new BABYLON.Color3(1, 0.95, 0.9);

                // Enable shadows
                dirLight.shadowEnabled = true;
                dirLight.shadowMinZ = 1;
                dirLight.shadowMaxZ = 500;

                // Create background
                updateProgress(10);
                await createBackground(scene);

                // Create fleets
                updateProgress(30);
                const fleet1 = await createFleet(scene, -30, 0, 0, new BABYLON.Color3(0.2, 0.4, 0.8), "blue");
                const fleet2 = await createFleet(scene, 30, 0, 0, new BABYLON.Color3(0.8, 0.2, 0.2), "red");

                // Set up battle
                updateProgress(70);
                setupBattle(scene, fleet1, fleet2);

                // Add post-processing
                updateProgress(80);
                addPostProcessing(scene, camera);

                // Finalize
                updateProgress(100);
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 500);

                return scene;
            };

            // Create background
            async function createBackground(scene) {
                // Create starfield
                const starfield = BABYLON.MeshBuilder.CreateSphere(
                    "starfield",
                    { diameter: 1000, segments: 32 },
                    scene
                );
                starfield.infiniteDistance = true;

                const starfieldMat = new BABYLON.StandardMaterial("starfieldMat", scene);
                starfieldMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
                starfieldMat.emissiveColor = new BABYLON.Color3(0.8, 0.8, 1);
                starfieldMat.backFaceCulling = false;

                // Create stars
                const starTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/starfield.png", scene);
                starfieldMat.emissiveTexture = starTexture;
                starfield.material = starfieldMat;

                // Create nebula
                const nebula = BABYLON.MeshBuilder.CreateSphere(
                    "nebula",
                    { diameter: 800, segments: 32 },
                    scene
                );
                nebula.infiniteDistance = true;

                const nebulaMat = new BABYLON.StandardMaterial("nebulaMat", scene);
                nebulaMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
                nebulaMat.emissiveColor = new BABYLON.Color3(0.5, 0.2, 0.8);
                nebulaMat.backFaceCulling = false;
                nebulaMat.alpha = 0.3;

                const nebulaTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/nebula.png", scene);
                nebulaMat.emissiveTexture = nebulaTexture;
                nebula.material = nebulaMat;

                // Create some distant planets
                for (let i = 0; i < 3; i++) {
                    const planet = BABYLON.MeshBuilder.CreateSphere(
                        `planet${i}`,
                        { diameter: 50 + Math.random() * 50, segments: 32 },
                        scene
                    );
                    planet.position = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 800,
                        (Math.random() - 0.5) * 800,
                        (Math.random() - 0.5) * 800
                    );

                    const planetMat = new BABYLON.StandardMaterial(`planetMat${i}`, scene);
                    planetMat.diffuseColor = new BABYLON.Color3(
                        Math.random() * 0.5,
                        Math.random() * 0.5,
                        Math.random() * 0.5
                    );
                    planetMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                    planetMat.emissiveColor = new BABYLON.Color3(
                        Math.random() * 0.2,
                        Math.random() * 0.2,
                        Math.random() * 0.2
                    );

                    planet.material = planetMat;
                }
            }

            // Create a fleet
            async function createFleet(scene, x, y, z, color, team) {
                const fleet = {
                    ships: [],
                    team: team,
                    color: color,
                    formationCenter: new BABYLON.Vector3(x, y, z)
                };

                // Create flagship
                const flagship = await createShip(scene, x, y, z, color, team, true);
                fleet.ships.push(flagship);
                flagship.isFlagship = true;

                // Create escort ships
                const formationRadius = 15;
                for (let i = 0; i < 9; i++) {
                    const angle = (i / 9) * Math.PI * 2;
                    const distance = formationRadius + Math.random() * 5;
                    const shipX = x + Math.cos(angle) * distance;
                    const shipZ = z + Math.sin(angle) * distance;

                    const ship = await createShip(scene, shipX, y, shipZ, color, team, false);
                    fleet.ships.push(ship);
                    ship.formationPosition = new BABYLON.Vector3(
                        Math.cos(angle) * distance,
                        0,
                        Math.sin(angle) * distance
                    );
                }

                return fleet;
            }

            // Create a ship
            async function createShip(scene, x, y, z, color, team, isFlagship) {
                const ship = {
                    mesh: null,
                    health: 100,
                    maxHealth: 100,
                    team: team,
                    color: color,
                    isFlagship: isFlagship,
                    target: null,
                    cooldown: 0,
                    healthBar: null,
                    engineParticles: null,
                    formationPosition: null,
                    velocity: new BABYLON.Vector3(0, 0, 0),
                    rotationVelocity: new BABYLON.Vector3(0, 0, 0),
                    position: new BABYLON.Vector3(x, y, z)
                };

                // Create ship mesh
                const shipSize = isFlagship ? 3 : 1.5;
                const shipMesh = BABYLON.MeshBuilder.CreateBox(
                    `ship_${team}_${isFlagship ? 'flagship' : 'escort'}`,
                    { width: shipSize, height: shipSize * 0.5, depth: shipSize * 2 },
                    scene
                );
                shipMesh.position = new BABYLON.Vector3(x, y, z);

                // Create more detailed ship shape
                const body = BABYLON.MeshBuilder.CreateCylinder(
                    `body_${team}_${isFlagship ? 'flagship' : 'escort'}`,
                    { height: shipSize * 1.5, diameter: shipSize * 0.8, tessellation: 16 },
                    scene
                );
                body.parent = shipMesh;
                body.position.z = shipSize * 0.5;
                body.rotation.x = Math.PI / 2;

                const wing1 = BABYLON.MeshBuilder.CreateBox(
                    `wing1_${team}_${isFlagship ? 'flagship' : 'escort'}`,
                    { width: shipSize * 0.8, height: shipSize * 0.2, depth: shipSize * 0.8 },
                    scene
                );
                wing1.parent = shipMesh;
                wing1.position = new BABYLON.Vector3(shipSize * 0.4, 0, 0);

                const wing2 = BABYLON.MeshBuilder.CreateBox(
                    `wing2_${team}_${isFlagship ? 'flagship' : 'escort'}`,
                    { width: shipSize * 0.8, height: shipSize * 0.2, depth: shipSize * 0.8 },
                    scene
                );
                wing2.parent = shipMesh;
                wing2.position = new BABYLON.Vector3(-shipSize * 0.4, 0, 0);

                if (isFlagship) {
                    // Add more details to flagship
                    const bridge = BABYLON.MeshBuilder.CreateCylinder(
                        `bridge_${team}`,
                        { height: shipSize * 0.5, diameter: shipSize * 0.4, tessellation: 16 },
                        scene
                    );
                    bridge.parent = shipMesh;
                    bridge.position = new BABYLON.Vector3(0, shipSize * 0.3, shipSize * 0.5);
                    bridge.rotation.x = Math.PI / 2;

                    const engine1 = BABYLON.MeshBuilder.CreateCylinder(
                        `engine1_${team}`,
                        { height: shipSize * 0.8, diameter: shipSize * 0.3, tessellation: 16 },
                        scene
                    );
                    engine1.parent = shipMesh;
                    engine1.position = new BABYLON.Vector3(shipSize * 0.3, 0, -shipSize * 0.8);
                    engine1.rotation.x = Math.PI / 2;

                    const engine2 = BABYLON.MeshBuilder.CreateCylinder(
                        `engine2_${team}`,
                        { height: shipSize * 0.8, diameter: shipSize * 0.3, tessellation: 16 },
                        scene
                    );
                    engine2.parent = shipMesh;
                    engine2.position = new BABYLON.Vector3(-shipSize * 0.3, 0, -shipSize * 0.8);
                    engine2.rotation.x = Math.PI / 2;
                }

                // Create ship material
                const shipMat = new BABYLON.StandardMaterial(`shipMat_${team}`, scene);
                shipMat.diffuseColor = color;
                shipMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                shipMat.emissiveColor = color.scale(0.2);
                shipMesh.material = shipMat;
                body.material = shipMat;
                wing1.material = shipMat;
                wing2.material = shipMat;

                if (isFlagship) {
                    bridge.material = shipMat;
                    engine1.material = shipMat;
                    engine2.material = shipMat;
                }

                // Create health bar
                const healthBar = new BABYLON.MeshBuilder.CreatePlane(
                    `healthBar_${team}_${isFlagship ? 'flagship' : 'escort'}`,
                    { width: shipSize * 1.5, height: shipSize * 0.2 },
                    scene
                );
                healthBar.parent = shipMesh;
                healthBar.position.y = shipSize * 1.2;
                healthBar.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

                const healthBarMat = new BABYLON.StandardMaterial(`healthBarMat_${team}`, scene);
                healthBarMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                healthBarMat.specularColor = new BABYLON.Color3(0, 0, 0);
                healthBar.material = healthBarMat;

                const healthBarFill = new BABYLON.MeshBuilder.CreatePlane(
                    `healthBarFill_${team}_${isFlagship ? 'flagship' : 'escort'}`,
                    { width: shipSize * 1.4, height: shipSize * 0.15 },
                    scene
                );
                healthBarFill.parent = healthBar;
                healthBarFill.position.z = -0.01;

                const healthBarFillMat = new BABYLON.StandardMaterial(`healthBarFillMat_${team}`, scene);
                healthBarFillMat.diffuseColor = color;
                healthBarFillMat.specularColor = new BABYLON.Color3(0, 0, 0);
                healthBarFillMat.emissiveColor = color.scale(0.5);
                healthBarFill.material = healthBarFillMat;

                // Create engine particles
                const engineParticles = new BABYLON.ParticleSystem(`engineParticles_${team}`, 200, scene);
                engineParticles.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
                engineParticles.emitter = shipMesh;
                engineParticles.minEmitBox = new BABYLON.Vector3(-shipSize * 0.2, -shipSize * 0.1, -shipSize * 1.1);
                engineParticles.maxEmitBox = new BABYLON.Vector3(shipSize * 0.2, shipSize * 0.1, -shipSize * 1.2);
                engineParticles.color1 = color.scale(0.8);
                engineParticles.color2 = color.scale(0.5);
                engineParticles.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                engineParticles.minSize = shipSize * 0.05;
                engineParticles.maxSize = shipSize * 0.1;
                engineParticles.minLifeTime = 0.5;
                engineParticles.maxLifeTime = 1.0;
                engineParticles.emitRate = 100;
                engineParticles.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
                engineParticles.gravity = new BABYLON.Vector3(0, 0, 0);
                engineParticles.direction1 = new BABYLON.Vector3(0, 0, -1);
                engineParticles.direction2 = new BABYLON.Vector3(0, 0, -1);
                engineParticles.minAngularSpeed = 0;
                engineParticles.maxAngularSpeed = Math.PI;
                engineParticles.minEmitPower = 1;
                engineParticles.maxEmitPower = 2;
                engineParticles.updateSpeed = 0.01;

                engineParticles.start();

                // Set ship properties
                ship.mesh = shipMesh;
                ship.healthBar = healthBarFill;
                ship.engineParticles = engineParticles;

                // Add shadows
                shipMesh.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(shipMesh);

                return ship;
            }

            // Set up battle
            function setupBattle(scene, fleet1, fleet2) {
                // Set targets for each ship
                fleet1.ships.forEach(ship => {
                    ship.target = getRandomShip(fleet2.ships);
                });

                fleet2.ships.forEach(ship => {
                    ship.target = getRandomShip(fleet1.ships);
                });

                // Create projectile pool
                const projectilePool = [];
                for (let i = 0; i < 100; i++) {
                    const projectile = createProjectile(scene);
                    projectilePool.push(projectile);
                }

                // Battle loop
                let time = 0;
                scene.registerBeforeRender(function() {
                    time += scene.getEngine().getDeltaTime() / 1000;

                    // Update ships
                    updateFleet(scene, fleet1, time, projectilePool);
                    updateFleet(scene, fleet2, time, projectilePool);

                    // Update projectiles
                    updateProjectiles(scene, projectilePool, fleet1, fleet2);

                    // Check for chain reactions
                    checkChainReactions(scene, fleet1, fleet2);
                });
            }

            function getRandomShip(ships) {
                return ships[Math.floor(Math.random() * ships.length)];
            }

            function updateFleet(scene, fleet, time, projectilePool) {
                fleet.ships.forEach(ship => {
                    if (ship.health <= 0) return;

                    // Update cooldown
                    ship.cooldown -= scene.getEngine().getDeltaTime() / 1000;

                    // Find a new target if current one is destroyed
                    if (ship.target && ship.target.health <= 0) {
                        const enemyFleet = fleet.team === "blue" ? scene.fleet2 : scene.fleet1;
                        ship.target = getRandomShip(enemyFleet.ships.filter(s => s.health > 0));

                        if (!ship.target) {
                            // No targets left - move to center
                            ship.target = {
                                position: fleet.formationCenter.clone()
                            };
                        }
                    }

                    // Move ship
                    updateShipMovement(scene, ship, time);

                    // Fire projectiles
                    if (ship.cooldown <= 0 && ship.target && ship.target.health > 0) {
                        const projectilesToFire = ship.isFlagship ? 2 : 1;

                        for (let i = 0; i < projectilesToFire; i++) {
                            const projectile = getAvailableProjectile(projectilePool);
                            if (projectile) {
                                fireProjectile(scene, ship, projectile, i * 0.1);
                            }
                        }

                        ship.cooldown = 3; // 3 second cooldown
                    }

                    // Update health bar
                    const healthPercentage = ship.health / ship.maxHealth;
                    ship.healthBar.scaling.x = healthPercentage;
                    ship.healthBar.position.x = -(1 - healthPercentage) * ship.mesh.scaling.x * 0.75;

                    // Update engine particles based on speed
                    const speed = ship.velocity.length();
                    ship.engineParticles.emitRate = 50 + speed * 50;
                });
            }

            function updateShipMovement(scene, ship, time) {
                if (!ship.target) return;

                const targetPosition = ship.target.position;
                const shipPosition = ship.mesh.position;

                // Calculate direction to target
                const direction = targetPosition.subtract(shipPosition);
                const distance = direction.length();

                // If we're close to the target, pick a new formation position
                if (distance < 10 && ship.formationPosition) {
                    // Move to formation position
                    const formationTarget = ship.formationPosition.add(ship.mesh.parent ? ship.mesh.parent.position : BABYLON.Vector3.Zero);
                    const formationDirection = formationTarget.subtract(shipPosition);
                    const formationDistance = formationDirection.length();

                    if (formationDistance > 1) {
                        direction.copyFrom(formationDirection);
                    } else {
                        // Orbit around formation position
                        const orbitRadius = 5;
                        const orbitAngle = time * 0.2 + ship.mesh.uniqueId;
                        const orbitX = Math.cos(orbitAngle) * orbitRadius;
                        const orbitZ = Math.sin(orbitAngle) * orbitRadius;

                        direction.copyFrom(formationTarget.add(new BABYLON.Vector3(orbitX, 0, orbitZ)).subtract(shipPosition));
                    }
                }

                // Normalize direction
                direction.normalize();

                // Calculate desired rotation
                const forward = new BABYLON.Vector3(0, 0, 1);
                forward.applyRotationQuaternionInPlace(ship.mesh.rotationQuaternion);

                const rotationAxis = BABYLON.Vector3.Cross(forward, direction);
                const rotationAngle = Math.acos(BABYLON.Vector3.Dot(forward, direction));

                // Apply rotation with some damping
                const rotationSpeed = 0.5;
                if (rotationAngle > 0.1) {
                    const rotationQuaternion = BABYLON.Quaternion.RotationAxis(rotationAxis, rotationAngle * rotationSpeed * scene.getEngine().getDeltaTime() / 1000);
                    ship.mesh.rotationQuaternion = rotationQuaternion.multiply(ship.mesh.rotationQuaternion);
                }

                // Calculate speed based on distance to target
                const maxSpeed = ship.isFlagship ? 5 : 8;
                const minSpeed = 1;
                const speed = Math.min(maxSpeed, Math.max(minSpeed, distance * 0.1));

                // Apply velocity
                const velocity = forward.scale(speed);
                ship.velocity = BABYLON.Vector3.Lerp(ship.velocity, velocity, 0.1);

                // Update position
                ship.mesh.position.addInPlace(ship.velocity.scale(scene.getEngine().getDeltaTime() / 1000));

                // Add some randomness to movement
                if (Math.random() < 0.02) {
                    ship.rotationVelocity.y = (Math.random() - 0.5) * 0.5;
                }

                // Apply rotation velocity
                if (ship.rotationVelocity.length() > 0.01) {
                    const rotationQuaternion = BABYLON.Quaternion.RotationYawPitchRoll(
                        ship.rotationVelocity.y * scene.getEngine().getDeltaTime() / 1000,
                        ship.rotationVelocity.x * scene.getEngine().getDeltaTime() / 1000,
                        ship.rotationVelocity.z * scene.getEngine().getDeltaTime() / 1000
                    );
                    ship.mesh.rotationQuaternion = rotationQuaternion.multiply(ship.mesh.rotationQuaternion);
                    ship.rotationVelocity.scaleInPlace(0.95);
                }
            }

            function createProjectile(scene) {
                const projectile = BABYLON.MeshBuilder.CreateSphere(
                    "projectile",
                    { diameter: 0.3, segments: 8 },
                    scene
                );
                projectile.isVisible = false;

                const projectileMat = new BABYLON.StandardMaterial("projectileMat", scene);
                projectileMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
                projectileMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
                projectile.material = projectileMat;

                // Create trail particles
                const trailParticles = new BABYLON.ParticleSystem("trailParticles", 100, scene);
                trailParticles.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
                trailParticles.emitter = projectile;
                trailParticles.minEmitBox = new BABYLON.Vector3(0, 0, 0);
                trailParticles.maxEmitBox = new BABYLON.Vector3(0, 0, 0);
                trailParticles.color1 = new BABYLON.Color4(0.8, 0.8, 1, 1);
                trailParticles.color2 = new BABYLON.Color4(0.5, 0.5, 1, 1);
                trailParticles.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                trailParticles.minSize = 0.1;
                trailParticles.maxSize = 0.3;
                trailParticles.minLifeTime = 0.5;
                trailParticles.maxLifeTime = 1.0;
                trailParticles.emitRate = 50;
                trailParticles.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
                trailParticles.gravity = new BABYLON.Vector3(0, 0, 0);
                trailParticles.direction1 = new BABYLON.Vector3(0, 0, -1);
                trailParticles.direction2 = new BABYLON.Vector3(0, 0, -1);
                trailParticles.minAngularSpeed = 0;
                trailParticles.maxAngularSpeed = Math.PI;
                trailParticles.minEmitPower = 0;
                trailParticles.maxEmitPower = 0;
                trailParticles.updateSpeed = 0.01;

                return {
                    mesh: projectile,
                    velocity: new BABYLON.Vector3(0, 0, 0),
                    team: null,
                    trailParticles: trailParticles,
                    active: false
                };
            }

            function getAvailableProjectile(projectilePool) {
                for (const projectile of projectilePool) {
                    if (!projectile.active) {
                        return projectile;
                    }
                }
                return null;
            }

            function fireProjectile(scene, ship, projectile, delay) {
                setTimeout(() => {
                    if (ship.health <= 0) return;

                    projectile.active = true;
                    projectile.mesh.isVisible = true;
                    projectile.mesh.position = ship.mesh.position.clone();

                    // Set projectile color based on team
                    if (ship.team === "blue") {
                        projectile.mesh.material.emissiveColor = new BABYLON.Color3(0.2, 0.4, 0.8);
                        projectile.trailParticles.color1 = new BABYLON.Color4(0.2, 0.4, 0.8, 1);
                        projectile.trailParticles.color2 = new BABYLON.Color4(0.1, 0.2, 0.4, 1);
                    } else {
                        projectile.mesh.material.emissiveColor = new BABYLON.Color3(0.8, 0.2, 0.2);
                        projectile.trailParticles.color1 = new BABYLON.Color4(0.8, 0.2, 0.2, 1);
                        projectile.trailParticles.color2 = new BABYLON.Color4(0.4, 0.1, 0.1, 1);
                    }

                    projectile.team = ship.team;

                    // Calculate direction to target
                    const direction = ship.target.position.subtract(ship.mesh.position).normalize();
                    const forward = new BABYLON.Vector3(0, 0, 1);
                    forward.applyRotationQuaternionInPlace(ship.mesh.rotationQuaternion);

                    // Add some spread
                    const spread = 0.1;
                    direction.x += (Math.random() - 0.5) * spread;
                    direction.y += (Math.random() - 0.5) * spread;
                    direction.z += (Math.random() - 0.5) * spread;
                    direction.normalize();

                    // Set velocity
                    const speed = 30;
                    projectile.velocity = direction.scale(speed);

                    // Start trail particles
                    projectile.trailParticles.start();
                }, delay * 1000);
            }

            function updateProjectiles(scene, projectilePool, fleet1, fleet2) {
                const deltaTime = scene.getEngine().getDeltaTime() / 1000;

                projectilePool.forEach(projectile => {
                    if (!projectile.active) return;

                    // Update position
                    projectile.mesh.position.addInPlace(projectile.velocity.scale(deltaTime));

                    // Check for collisions with enemy ships
                    const enemyFleet = projectile.team === "blue" ? fleet2 : fleet1;

                    for (const ship of enemyFleet.ships) {
                        if (ship.health <= 0) continue;

                        const distance = BABYLON.Vector3.Distance(projectile.mesh.position, ship.mesh.position);
                        const shipSize = ship.isFlagship ? 3 : 1.5;

                        if (distance < shipSize * 0.7) {
                            // Hit!
                            ship.health -= 10;
                            projectile.active = false;
                            projectile.mesh.isVisible = false;
                            projectile.trailParticles.stop();

                            // Create explosion
                            createSmallExplosion(scene, projectile.mesh.position, projectile.team === "blue" ? new BABYLON.Color3(0.2, 0.4, 0.8) : new BABYLON.Color3(0.8, 0.2, 0.2));

                            break;
                        }
                    }

                    // Deactivate if too far from origin
                    if (projectile.mesh.position.length() > 500) {
                        projectile.active = false;
                        projectile.mesh.isVisible = false;
                        projectile.trailParticles.stop();
                    }
                });
            }

            function checkChainReactions(scene, fleet1, fleet2) {
                // Check for destroyed ships
                const allShips = [...fleet1.ships, ...fleet2.ships];
                const destroyedShips = allShips.filter(ship => ship.health <= 0 && ship.mesh.isVisible);

                destroyedShips.forEach(ship => {
                    // Create explosion
                    createExplosion(scene, ship.mesh.position, ship.color);

                    // Hide ship
                    ship.mesh.isVisible = false;
                    ship.healthBar.parent.isVisible = false;
                    ship.engineParticles.stop();

                    // Check for chain reactions
                    const explosionRadius = ship.isFlagship ? 10 : 5;
                    const nearbyShips = allShips.filter(otherShip => {
                        if (otherShip === ship || otherShip.health <= 0) return false;
                        return BABYLON.Vector3.Distance(ship.mesh.position, otherShip.mesh.position) < explosionRadius;
                    });

                    nearbyShips.forEach(otherShip => {
                        otherShip.health = 0;
                    });
                });
            }

            function createSmallExplosion(scene, position, color) {
                // Create explosion particles
                const explosionParticles = new BABYLON.ParticleSystem("explosionParticles", 200, scene);
                explosionParticles.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
                explosionParticles.emitter = position;
                explosionParticles.minEmitBox = new BABYLON.Vector3(-0.1, -0.1, -0.1);
                explosionParticles.maxEmitBox = new BABYLON.Vector3(0.1, 0.1, 0.1);
                explosionParticles.color1 = new BABYLON.Color4(color.r, color.g, color.b, 1);
                explosionParticles.color2 = new BABYLON.Color4(color.r * 0.5, color.g * 0.5, color.b * 0.5, 1);
                explosionParticles.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                explosionParticles.minSize = 0.2;
                explosionParticles.maxSize = 0.5;
                explosionParticles.minLifeTime = 0.5;
                explosionParticles.maxLifeTime = 1.0;
                explosionParticles.emitRate = 200;
                explosionParticles.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
                explosionParticles.gravity = new BABYLON.Vector3(0, 0, 0);
                explosionParticles.direction1 = new BABYLON.Vector3(-1, -1, -1);
                explosionParticles.direction2 = new BABYLON.Vector3(1, 1, 1);
                explosionParticles.minAngularSpeed = 0;
                explosionParticles.maxAngularSpeed = Math.PI;
                explosionParticles.minEmitPower = 5;
                explosionParticles.maxEmitPower = 10;
                explosionParticles.updateSpeed = 0.01;

                explosionParticles.start();

                // Stop after 1 second
                setTimeout(() => {
                    explosionParticles.stop();
                }, 1000);
            }

            function createExplosion(scene, position, color) {
                // Create explosion particles
                const explosionParticles = new BABYLON.ParticleSystem("explosionParticles", 500, scene);
                explosionParticles.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
                explosionParticles.emitter = position;
                explosionParticles.minEmitBox = new BABYLON.Vector3(-0.5, -0.5, -0.5);
                explosionParticles.maxEmitBox = new BABYLON.Vector3(0.5, 0.5, 0.5);
                explosionParticles.color1 = new BABYLON.Color4(color.r, color.g, color.b, 1);
                explosionParticles.color2 = new BABYLON.Color4(color.r * 0.5, color.g * 0.5, color.b * 0.5, 1);
                explosionParticles.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                explosionParticles.minSize = 0.5;
                explosionParticles.maxSize = 1.5;
                explosionParticles.minLifeTime = 0.5;
                explosionParticles.maxLifeTime = 1.5;
                explosionParticles.emitRate = 500;
                explosionParticles.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
                explosionParticles.gravity = new BABYLON.Vector3(0, 0, 0);
                explosionParticles.direction1 = new BABYLON.Vector3(-1, -1, -1);
                explosionParticles.direction2 = new BABYLON.Vector3(1, 1, 1);
                explosionParticles.minAngularSpeed = 0;
                explosionParticles.maxAngularSpeed = Math.PI * 2;
                explosionParticles.minEmitPower = 10;
                explosionParticles.maxEmitPower = 20;
                explosionParticles.updateSpeed = 0.01;

                explosionParticles.start();

                // Create shockwave
                const shockwave = BABYLON.MeshBuilder.CreateDisc(
                    "shockwave",
                    { radius: 0.1, tessellation: 32 },
                    scene
                );
                shockwave.position = position.clone();
                shockwave.rotation.x = Math.PI / 2;

                const shockwaveMat = new BABYLON.StandardMaterial("shockwaveMat", scene);
                shockwaveMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
                shockwaveMat.emissiveColor = color.scale(2);
                shockwaveMat.alpha = 0.5;
                shockwave.material = shockwaveMat;

                // Animate shockwave
                let shockwaveScale = 0.1;
                const shockwaveAnimation = scene.registerBeforeRender(function() {
                    shockwaveScale += 0.5;
                    shockwave.scaling = new BABYLON.Vector3(shockwaveScale, shockwaveScale, shockwaveScale);
                    shockwaveMat.alpha *= 0.95;

                    if (shockwaveScale > 10) {
                        scene.unregisterBeforeRender(shockwaveAnimation);
                        shockwave.dispose();
                    }
                });

                // Create debris
                for (let i = 0; i < 20; i++) {
                    const debris = BABYLON.MeshBuilder.CreateBox(
                        `debris${i}`,
                        { width: 0.2, height: 0.2, depth: 0.2 },
                        scene
                    );
                    debris.position = position.clone();

                    const debrisMat = new BABYLON.StandardMaterial(`debrisMat${i}`, scene);
                    debrisMat.diffuseColor = color.scale(0.8);
                    debrisMat.emissiveColor = color.scale(0.5);
                    debris.material = debrisMat;

                    // Apply random velocity
                    const velocity = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10
                    );

                    // Animate debris
                    let time = 0;
                    const debrisAnimation = scene.registerBeforeRender(function() {
                        time += scene.getEngine().getDeltaTime() / 1000;
                        debris.position.addInPlace(velocity.scale(scene.getEngine().getDeltaTime() / 1000));
                        debris.rotation.x += 0.1;
                        debris.rotation.y += 0.1;
                        debris.rotation.z += 0.1;

                        // Apply gravity
                        velocity.y -= 0.1;

                        // Fade out
                        debrisMat.alpha = 1 - time * 0.5;

                        if (time > 2) {
                            scene.unregisterBeforeRender(debrisAnimation);
                            debris.dispose();
                        }
                    });
                }

                // Stop after 2 seconds
                setTimeout(() => {
                    explosionParticles.stop();
                }, 2000);
            }

            // Add post-processing
            function addPostProcessing(scene, camera) {
                // Bloom effect
                const bloomEffect = new BABYLON.PostProcessRenderPipeline(
                    engine,
                    "bloom",
                    ["Bloom"]
                );

                const bloom = new BABYLON.BloomEffect(
                    scene,
                    1.0, // bloom threshold
                    0.8, // bloom weight
                    1.0, // kernel size
                    256  // texture size
                );

                bloomEffect.addEffect(bloom);
                scene.postProcessRenderPipelineManager.addPipeline(bloomEffect);
                scene.postProcessRenderPipelineManager.attachCamerasToRenderPipeline(
                    "bloom",
                    camera
                );

                // Glow layer
                const glowLayer = new BABYLON.GlowLayer("glow", scene);
                glowLayer.intensity = 0.5;

                // Tone mapping
                scene.imageProcessingConfiguration.toneMappingEnabled = true;
                scene.imageProcessingConfiguration.toneMappingType =
                    BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
                scene.imageProcessingConfiguration.exposure = 1.0;
            }

            // Create the scene
            createScene().then((scene) => {
                // Store fleets in scene for access in other functions
                scene.fleet1 = scene._fleets[0];
                scene.fleet2 = scene._fleets[1];

                // Run the render loop
                engine.runRenderLoop(() => {
                    scene.render();
                });

                // Handle browser resize
                window.addEventListener("resize", () => {
                    engine.resize();
                });
            });
        });
    </script>
</body>
