<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Fleet Battle - Babylon.js</title>
    <!-- Babylon.js & Babylon.js GUI -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: #020208;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        /* Sci-Fi HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .fleet-card {
            background: rgba(10, 15, 30, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 14px 20px;
            backdrop-filter: blur(8px);
            min-width: 220px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }
        .fleet-card.blue {
            border-left: 5px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }
        .fleet-card.red {
            border-right: 5px solid #ff2b56;
            text-align: right;
            box-shadow: 0 0 15px rgba(255, 43, 86, 0.2);
        }
        .fleet-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .fleet-card.blue .fleet-title { color: #00d2ff; }
        .fleet-card.red .fleet-title { color: #ff2b56; }
        .fleet-stat {
            font-size: 13px;
            color: #aaa;
            margin-top: 5px;
        }
        .fleet-stat span {
            color: #fff;
            font-weight: bold;
        }
        .center-title {
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .controls-panel {
            pointer-events: auto;
            align-self: center;
            display: flex;
            gap: 12px;
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        .hud-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
            transform: scale(1.05);
        }
        .hud-btn.active {
            background: #00d2ff;
            color: #000;
            font-weight: 700;
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }
        #banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="hud">
        <div class="header">
            <div class="fleet-card blue">
                <div class="fleet-title">Alliance Fleet</div>
                <div class="fleet-stat">Flagship: <span id="blue-flagship">ONLINE</span></div>
                <div class="fleet-stat">Escorts Active: <span id="blue-escorts">9 / 9</span></div>
            </div>

            <div class="center-title">
                TACTICAL SIMULATION SPACE BATTLE
                <div style="font-size: 10px; margin-top: 4px; color: #667;">Orbit: Left Mouse | Zoom: Scroll | Pan: Right Mouse</div>
            </div>

            <div class="fleet-card red">
                <div class="fleet-title">Crimson Fleet</div>
                <div class="fleet-stat">Flagship: <span id="red-flagship">ONLINE</span></div>
                <div class="fleet-stat">Escorts Active: <span id="red-escorts">9 / 9</span></div>
            </div>
        </div>

        <div id="banner">FLEET ENGAGED</div>

        <div class="controls-panel">
            <button class="hud-btn" id="btn-cam-orbit">Free Orbit</button>
            <button class="hud-btn" id="btn-cam-cinematic">Cinematic Cam</button>
            <button class="hud-btn" id="btn-slowmo">Slow Motion</button>
            <button class="hud-btn" id="btn-restart">Restart Battle</button>
        </div>
    </div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    
    let scene, camera, glowLayer, guiTexture;
    let ships = [];
    let projectiles = [];
    let debrisList = [];
    let shockwaves = [];
    let timeScale = 1.0;
    let cameraMode = 'orbit'; // 'orbit' or 'cinematic'
    let cinematicTarget = null;
    let cinematicTimer = 0;

    // Canvas procedural textures (ensures zero missing assets / offline standalone support)
    function createParticleTexture(type) {
        const pCanvas = document.createElement('canvas');
        pCanvas.width = 64;
        pCanvas.height = 64;
        const ctx = pCanvas.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);

        if (type === 'fire') {
            grad.addColorStop(0, 'rgba(255, 255, 220, 1)');
            grad.addColorStop(0.3, 'rgba(255, 140, 20, 0.8)');
            grad.addColorStop(0.7, 'rgba(180, 40, 10, 0.4)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else if (type === 'spark') {
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(255, 220, 150, 0.9)');
            grad.addColorStop(0.6, 'rgba(255, 100, 0, 0.4)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else if (type === 'smoke') {
            grad.addColorStop(0, 'rgba(120, 120, 140, 0.6)');
            grad.addColorStop(0.5, 'rgba(60, 60, 70, 0.3)');
            grad.addColorStop(1, 'rgba(20, 20, 20, 0)');
        } else if (type === 'trail') {
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.4, 'rgba(100, 200, 255, 0.8)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        }

        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        return new BABYLON.Texture(pCanvas.toDataURL(), scene);
    }

    let fireTexture, sparkTexture, smokeTexture, trailTexture;

    // --- SCENE INITIALIZATION ---
    function createScene() {
        scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.03, 1.0);

        // Orbit Camera
        camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.5, 380, new BABYLON.Vector3(0, 0, 0), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 20;
        camera.upperRadiusLimit = 800;
        camera.wheelPrecision = 15;
        camera.panningSensibility = 50;

        // Glow Layer for lasers, shields, thrusters & explosions
        glowLayer = new BABYLON.GlowLayer("glow", scene, {
            mainTextureRatio: 0.5,
            blurKernelSize: 32
        });
        glowLayer.intensity = 1.25;

        // Fullscreen GUI
        guiTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

        // Lights
        const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.35;
        hemiLight.groundColor = new BABYLON.Color3(0.05, 0.05, 0.1);
        hemiLight.diffuse = new BABYLON.Color3(0.6, 0.7, 0.9);

        const dirLight = new BABYLON.DirectionalLight("sunLight", new BABYLON.Vector3(-1, -0.7, 0.8).normalize(), scene);
        dirLight.intensity = 1.6;
        dirLight.diffuse = new BABYLON.Color3(1.0, 0.95, 0.85);

        // Textures
        fireTexture = createParticleTexture('fire');
        sparkTexture = createParticleTexture('spark');
        smokeTexture = createParticleTexture('smoke');
        trailTexture = createParticleTexture('trail');

        // Starfield & Deep Space Nebula
        createCosmicEnvironment();

        return scene;
    }

    // --- ENVIRONMENT & STARFIELD ---
    function createCosmicEnvironment() {
        // Starfield Particle Dome
        const starDome = BABYLON.MeshBuilder.CreateSphere("starDome", { diameter: 1400, segments: 16 }, scene);
        const starMat = new BABYLON.StandardMaterial("starMat", scene);
        starMat.backFaceCulling = false;
        starMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
        starMat.specularColor = new BABYLON.Color3(0, 0, 0);

        // Procedural Star Texture
        const sCanvas = document.createElement('canvas');
        sCanvas.width = 1024;
        sCanvas.height = 1024;
        const ctx = sCanvas.getContext('2d');
        ctx.fillStyle = '#020207';
        ctx.fillRect(0, 0, 1024, 1024);

        // Nebulae clouds
        for (let i = 0; i < 6; i++) {
            const nx = Math.random() * 1024;
            const ny = Math.random() * 1024;
            const rad = 200 + Math.random() * 300;
            const nGrad = ctx.createRadialGradient(nx, ny, 0, nx, ny, rad);
            const isBlue = Math.random() > 0.5;
            nGrad.addColorStop(0, isBlue ? 'rgba(20, 50, 120, 0.25)' : 'rgba(100, 20, 80, 0.2)');
            nGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nGrad;
            ctx.beginPath();
            ctx.arc(nx, ny, rad, 0, Math.PI * 2);
            ctx.fill();
        }

        // Stars
        for (let i = 0; i < 1500; i++) {
            const x = Math.random() * 1024;
            const y = Math.random() * 1024;
            const size = Math.random() * 1.8 + 0.3;
            const brightness = Math.random() * 0.8 + 0.2;
            ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }
        
        const cosmicTex = new BABYLON.Texture(sCanvas.toDataURL(), scene);
        starMat.emissiveTexture = cosmicTex;
        starDome.material = starMat;
    }

    // --- PROCEDURAL SHIP MESH GENERATORS ---

    // Materials cache to improve performance
    let materialsCache = {};
    function getShipMaterials(team) {
        const prefix = team === 0 ? 'blue' : 'red';
        if (materialsCache[prefix]) return materialsCache[prefix];

        // Hull Primary
        const hullMat = new BABYLON.StandardMaterial(prefix + "Hull", scene);
        hullMat.diffuseColor = team === 0 ? new BABYLON.Color3(0.18, 0.25, 0.35) : new BABYLON.Color3(0.32, 0.18, 0.2);
        hullMat.specularColor = new BABYLON.Color3(0.4, 0.4, 0.4);
        hullMat.roughness = 0.3;

        // Armor Secondary
        const armorMat = new BABYLON.StandardMaterial(prefix + "Armor", scene);
        armorMat.diffuseColor = team === 0 ? new BABYLON.Color3(0.08, 0.12, 0.18) : new BABYLON.Color3(0.16, 0.08, 0.09);
        armorMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);

        // Glow Trim / Cockpit
        const glowMat = new BABYLON.StandardMaterial(prefix + "Glow", scene);
        glowMat.emissiveColor = team === 0 ? new BABYLON.Color3(0.0, 0.8, 1.0) : new BABYLON.Color3(1.0, 0.1, 0.25);
        glowMat.diffuseColor = glowMat.emissiveColor;

        // Engine Thruster Glow
        const engineMat = new BABYLON.StandardMaterial(prefix + "Engine", scene);
        engineMat.emissiveColor = team === 0 ? new BABYLON.Color3(0.2, 0.7, 1.0) : new BABYLON.Color3(1.0, 0.3, 0.1);
        engineMat.diffuseColor = engineMat.emissiveColor;

        materialsCache[prefix] = { hull: hullMat, armor: armorMat, glow: glowMat, engine: engineMat };
        return materialsCache[prefix];
    }

    // Escort / Fighter Craft Builder
    function buildEscortMesh(team) {
        const root = new BABYLON.TransformNode("escortRoot", scene);
        const mats = getShipMaterials(team);

        // Main Fuselage (Arrow Wedge)
        const body = BABYLON.MeshBuilder.CreateCylinder("body", {
            diameterTop: 0.2,
            diameterBottom: 3.2,
            height: 12,
            tessellation: 4
        }, scene);
        body.rotation.x = Math.PI / 2;
        body.rotation.y = Math.PI / 4;
        body.scaling.set(1.4, 1, 0.6);
        body.material = mats.hull;
        body.parent = root;

        // Left Wing & Right Wing
        const wingL = BABYLON.MeshBuilder.CreateBox("wingL", { width: 5.5, height: 0.3, depth: 4.5 }, scene);
        wingL.position.set(-3.2, -0.2, -1.5);
        wingL.rotation.z = -0.15;
        wingL.rotation.y = 0.3;
        wingL.material = mats.armor;
        wingL.parent = root;

        const wingR = BABYLON.MeshBuilder.CreateBox("wingR", { width: 5.5, height: 0.3, depth: 4.5 }, scene);
        wingR.position.set(3.2, -0.2, -1.5);
        wingR.rotation.z = 0.15;
        wingR.rotation.y = -0.3;
        wingR.material = mats.armor;
        wingR.parent = root;

        // Wingtip Plasma Cannons
        const gunL = BABYLON.MeshBuilder.CreateCylinder("gunL", { diameter: 0.4, height: 4 }, scene);
        gunL.rotation.x = Math.PI / 2;
        gunL.position.set(-5.5, -0.2, -0.5);
        gunL.material = mats.hull;
        gunL.parent = root;

        const gunR = gunL.clone("gunR", root);
        gunR.position.x = 5.5;

        // Cockpit canopy glow
        const cockpit = BABYLON.MeshBuilder.CreateBox("cockpit", { width: 1.2, height: 0.8, depth: 3 }, scene);
        cockpit.position.set(0, 0.8, 1);
        cockpit.material = mats.glow;
        cockpit.parent = root;

        // Engine Thruster Nozzle
        const engineMesh = BABYLON.MeshBuilder.CreateCylinder("thruster", { diameter: 1.4, height: 0.8 }, scene);
        engineMesh.rotation.x = Math.PI / 2;
        engineMesh.position.set(0, 0, -5.8);
        engineMesh.material = mats.engine;
        engineMesh.parent = root;

        return { root, engineMesh, gunOffsets: [new BABYLON.Vector3(0, 0, 5)] };
    }

    // Flagship / Dreadnought Builder (3.5x size, massive layered architecture)
    function buildFlagshipMesh(team) {
        const root = new BABYLON.TransformNode("flagshipRoot", scene);
        const mats = getShipMaterials(team);

        // Core Armored Hull
        const mainHull = BABYLON.MeshBuilder.CreateBox("mainHull", { width: 10, height: 7, depth: 36 }, scene);
        mainHull.position.set(0, 0, 0);
        mainHull.material = mats.hull;
        mainHull.parent = root;

        // Prow Ram / Forward Wedge
        const prow = BABYLON.MeshBuilder.CreateCylinder("prow", {
            diameterTop: 1.5,
            diameterBottom: 12,
            height: 14,
            tessellation: 4
        }, scene);
        prow.rotation.x = Math.PI / 2;
        prow.rotation.y = Math.PI / 4;
        prow.position.set(0, 0, 23);
        prow.scaling.set(1.1, 1, 0.7);
        prow.material = mats.armor;
        prow.parent = root;

        // Command Bridge Tower
        const bridgeBase = BABYLON.MeshBuilder.CreateBox("bridgeBase", { width: 7, height: 4, depth: 14 }, scene);
        bridgeBase.position.set(0, 4.5, -4);
        bridgeBase.material = mats.armor;
        bridgeBase.parent = root;

        const bridgeTower = BABYLON.MeshBuilder.CreateBox("bridgeTower", { width: 14, height: 2.2, depth: 6 }, scene);
        bridgeTower.position.set(0, 7.2, -6);
        bridgeTower.material = mats.hull;
        bridgeTower.parent = root;

        // Command Viewport Visor
        const bridgeVisor = BABYLON.MeshBuilder.CreateBox("bridgeVisor", { width: 12, height: 0.8, depth: 1.5 }, scene);
        bridgeVisor.position.set(0, 7.4, -3.2);
        bridgeVisor.material = mats.glow;
        bridgeVisor.parent = root;

        // Heavy Outrigger Armor Wings / Hangar Pods
        const podL = BABYLON.MeshBuilder.CreateBox("podL", { width: 5, height: 5, depth: 26 }, scene);
        podL.position.set(-8.5, -0.5, -3);
        podL.material = mats.armor;
        podL.parent = root;

        const podR = podL.clone("podR", root);
        podR.position.x = 8.5;

        // Glowing Shield/Subsystem Channels on Pods
        const glowStripeL = BABYLON.MeshBuilder.CreateBox("glowStripeL", { width: 0.4, height: 2.2, depth: 22 }, scene);
        glowStripeL.position.set(-11.1, -0.5, -3);
        glowStripeL.material = mats.glow;
        glowStripeL.parent = root;

        const glowStripeR = glowStripeL.clone("glowStripeR", root);
        glowStripeR.position.x = 11.1;

        // Heavy Twin Railgun Batteries (Dual Cannons)
        const turretL = BABYLON.MeshBuilder.CreateCylinder("turretL", { diameter: 1.4, height: 16 }, scene);
        turretL.rotation.x = Math.PI / 2;
        turretL.position.set(-4.5, 3.2, 12);
        turretL.material = mats.armor;
        turretL.parent = root;

        const turretR = turretL.clone("turretR", root);
        turretR.position.x = 4.5;

        // 3 Massive Rear Engine Thrusters
        const thrusterCenter = BABYLON.MeshBuilder.CreateCylinder("thrusterC", { diameter: 3.6, height: 2 }, scene);
        thrusterCenter.rotation.x = Math.PI / 2;
        thrusterCenter.position.set(0, 0, -18.5);
        thrusterCenter.material = mats.engine;
        thrusterCenter.parent = root;

        const thrusterLeft = BABYLON.MeshBuilder.CreateCylinder("thrusterL", { diameter: 2.6, height: 2 }, scene);
        thrusterLeft.rotation.x = Math.PI / 2;
        thrusterLeft.position.set(-8.5, -0.5, -16.5);
        thrusterLeft.material = mats.engine;
        thrusterLeft.parent = root;

        const thrusterRight = thrusterLeft.clone("thrusterR", root);
        thrusterRight.position.x = 8.5;

        return {
            root,
            engineMesh: thrusterCenter,
            gunOffsets: [
                new BABYLON.Vector3(-4.5, 3.2, 20),
                new BABYLON.Vector3(4.5, 3.2, 20)
            ]
        };
    }

    // --- SHIP CLASS & COMBAT LOGIC ---
    class Ship {
        constructor(team, isFlagship, spawnPos, facingDir) {
            this.team = team; // 0 = Blue, 1 = Red
            this.isFlagship = isFlagship;
            this.isDead = false;

            // Stats
            this.maxHp = isFlagship ? 500 : 100;
            this.hp = this.maxHp;
            this.radius = isFlagship ? 22 : 6.5; // used for collision & chain explosion
            this.speed = isFlagship ? 22 : 38;
            this.turnSpeed = isFlagship ? 0.6 : 1.4;
            
            // Firing parameters (every 3.0 seconds)
            this.fireCooldown = 3.0;
            this.fireTimer = Math.random() * 2.5; // Stagger first shots

            // 3D Navigation
            this.position = spawnPos.clone();
            this.velocity = facingDir.scale(this.speed);
            this.target = null;

            // Construct 3D Mesh
            const meshData = isFlagship ? buildFlagshipMesh(team) : buildEscortMesh(team);
            this.root = meshData.root;
            this.root.position = this.position;
            this.gunOffsets = meshData.gunOffsets;

            // Thruster particle emitter
            this.trailEmitter = new BABYLON.ParticleSystem("thrusterParticles", 40, scene);
            this.trailEmitter.particleTexture = trailTexture;
            this.trailEmitter.emitter = meshData.engineMesh;
            this.trailEmitter.minEmitBox = new BABYLON.Vector3(-0.2, -0.2, -0.2);
            this.trailEmitter.maxEmitBox = new BABYLON.Vector3(0.2, 0.2, 0.2);
            this.trailEmitter.color1 = team === 0 ? new BABYLON.Color4(0.2, 0.8, 1, 0.9) : new BABYLON.Color4(1, 0.3, 0.2, 0.9);
            this.trailEmitter.color2 = team === 0 ? new BABYLON.Color4(0.0, 0.4, 0.9, 0.4) : new BABYLON.Color4(0.8, 0.1, 0.1, 0.4);
            this.trailEmitter.colorDead = new BABYLON.Color4(0, 0, 0, 0);
            this.trailEmitter.minSize = isFlagship ? 1.5 : 0.8;
            this.trailEmitter.maxSize = isFlagship ? 3.5 : 1.8;
            this.trailEmitter.minLifeTime = 0.15;
            this.trailEmitter.maxLifeTime = 0.35;
            this.trailEmitter.emitRate = isFlagship ? 70 : 40;
            this.trailEmitter.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
            this.trailEmitter.direction1 = new BABYLON.Vector3(0, 0, -1);
            this.trailEmitter.direction2 = new BABYLON.Vector3(0, 0, -1);
            this.trailEmitter.minEmitPower = 8;
            this.trailEmitter.maxEmitPower = 18;
            this.trailEmitter.start();

            // Health Bar UI
            this.createHealthBar();
        }

        createHealthBar() {
            this.uiContainer = new BABYLON.GUI.Container();
            this.uiContainer.width = this.isFlagship ? "90px" : "60px";
            this.uiContainer.height = "16px";
            guiTexture.addControl(this.uiContainer);
            this.uiContainer.linkWithMesh(this.root);
            this.uiContainer.linkOffsetY = this.isFlagship ? -45 : -25;

            // Background
            this.barBg = new BABYLON.GUI.Rectangle();
            this.barBg.width = "100%";
            this.barBg.height = "6px";
            this.barBg.background = "rgba(10, 10, 15, 0.8)";
            this.barBg.color = "rgba(255, 255, 255, 0.3)";
            this.barBg.thickness = 1;
            this.barBg.cornerRadius = 2;
            this.uiContainer.addControl(this.barBg);

            // Fill Bar
            this.barFill = new BABYLON.GUI.Rectangle();
            this.barFill.width = "100%";
            this.barFill.height = "100%";
            this.barFill.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
            this.barFill.background = this.team === 0 ? "#00d2ff" : "#ff2b56";
            this.barFill.thickness = 0;
            this.barBg.addControl(this.barFill);

            // Flagship Crown Marker
            if (this.isFlagship) {
                const label = new BABYLON.GUI.TextBlock();
                label.text = "★ FLAGSHIP";
                label.color = this.team === 0 ? "#00d2ff" : "#ff2b56";
                label.fontSize = 9;
                label.fontStyle = "bold";
                label.top = "-9px";
                this.uiContainer.addControl(label);
            }
        }

        update(dt) {
            if (this.isDead) return;

            // 1. Target Acquisition
            if (!this.target || this.target.isDead) {
                this.acquireTarget();
            }

            // 2. Flight AI / Maneuvers
            this.maneuver(dt);

            // 3. Weapons Systems
            this.fireTimer += dt;
            if (this.fireTimer >= this.fireCooldown) {
                this.fireTimer = 0;
                this.fireWeapons();
            }

            // 4. Update UI Position / Health ratio
            const hpRatio = Math.max(0, this.hp / this.maxHp);
            this.barFill.width = `${hpRatio * 100}%`;
            
            // Flash color when low
            if (hpRatio < 0.25) {
                this.barFill.background = "#ffff00";
            }
        }

        acquireTarget() {
            const enemies = ships.filter(s => s.team !== this.team && !s.isDead);
            if (enemies.length === 0) {
                this.target = null;
                return;
            }

            // 40% priority to target enemy flagship, otherwise closest escort
            const enemyFlagship = enemies.find(e => e.isFlagship);
            if (enemyFlagship && Math.random() < 0.45) {
                this.target = enemyFlagship;
            } else {
                let closest = enemies[0];
                let minDist = BABYLON.Vector3.DistanceSquared(this.position, closest.position);
                for (let i = 1; i < enemies.length; i++) {
                    const d = BABYLON.Vector3.DistanceSquared(this.position, enemies[i].position);
                    if (d < minDist) {
                        minDist = d;
                        closest = enemies[i];
                    }
                }
                this.target = closest;
            }
        }

        maneuver(dt) {
            let desiredDir = this.velocity.normalizeToNew();

            if (this.target && !this.target.isDead) {
                const toTarget = this.target.position.subtract(this.position);
                const dist = toTarget.length();
                const toTargetDir = toTarget.normalizeToNew();

                // Combat orbit spacing: dogfight distance
                if (dist > (this.isFlagship ? 140 : 70)) {
                    desiredDir = toTargetDir;
                } else if (dist < 35) {
                    // Evade / Peel away
                    desiredDir = toTargetDir.scale(-1).add(new BABYLON.Vector3(0, 0.8, 0)).normalize();
                } else {
                    // Circle & strafe target
                    const cross = BABYLON.Vector3.Cross(toTargetDir, BABYLON.Vector3.Up());
                    desiredDir = toTargetDir.scale(0.5).add(cross.scale(this.team === 0 ? 0.7 : -0.7)).normalize();
                }
            }

            // Arena boundary containment (soft return sphere radius = 320)
            const distFromOrigin = this.position.length();
            if (distFromOrigin > 300) {
                const returnDir = this.position.scale(-1).normalize();
                const blend = Math.min(1.0, (distFromOrigin - 300) / 60);
                desiredDir = BABYLON.Vector3.Lerp(desiredDir, returnDir, blend).normalize();
            }

            // Ship avoidance (Separation)
            for (let other of ships) {
                if (other === this || other.isDead) continue;
                const offset = this.position.subtract(other.position);
                const dist = offset.length();
                const minDist = (this.radius + other.radius) * 1.6;
                if (dist < minDist && dist > 0.001) {
                    const push = offset.normalizeToNew().scale((minDist - dist) / minDist * 2.0);
                    desiredDir.addInPlace(push);
                }
            }
            desiredDir.normalize();

            // Smooth Turning (SLERP direction)
            const currentDir = this.velocity.normalizeToNew();
            const smoothedDir = BABYLON.Vector3.Lerp(currentDir, desiredDir, this.turnSpeed * dt).normalize();
            this.velocity = smoothedDir.scale(this.speed);
            this.position.addInPlace(this.velocity.scale(dt));
            this.root.position.copyFrom(this.position);

            // Compute Rotation with Realistic Bank/Roll on turns
            const lookTarget = this.position.add(this.velocity);
            this.root.lookAt(lookTarget);

            // Calculate lateral yaw delta for banking effect
            const rightVector = BABYLON.Vector3.Cross(BABYLON.Vector3.Up(), currentDir).normalize();
            const turnFactor = BABYLON.Vector3.Dot(desiredDir, rightVector);
            const targetRoll = BABYLON.Scalar.Clamp(turnFactor * (this.isFlagship ? 0.3 : 1.1), -1.2, 1.2);
            this.root.rotation.z = BABYLON.Scalar.Lerp(this.root.rotation.z, -targetRoll, dt * 3.0);
        }

        fireWeapons() {
            if (!this.target || this.target.isDead) return;

            // Spawn projectile(s) based on gun mounting offsets
            this.gunOffsets.forEach(offset => {
                // Transform gun local offset into world coordinates
                const worldMatrix = this.root.getWorldMatrix();
                const spawnPoint = BABYLON.Vector3.TransformCoordinates(offset, worldMatrix);

                // Lead target calculation for exciting high-accuracy space combat
                const distToTarget = BABYLON.Vector3.Distance(spawnPoint, this.target.position);
                const projSpeed = 190;
                const timeToHit = distToTarget / projSpeed;
                const predictedTargetPos = this.target.position.add(this.target.velocity.scale(timeToHit * 0.75));
                const aimDir = predictedTargetPos.subtract(spawnPoint).normalize();

                // Add slight inaccuracy dispersion
                const spread = this.isFlagship ? 0.02 : 0.05;
                aimDir.x += (Math.random() - 0.5) * spread;
                aimDir.y += (Math.random() - 0.5) * spread;
                aimDir.z += (Math.random() - 0.5) * spread;
                aimDir.normalize();

                projectiles.push(new Projectile(spawnPoint, aimDir, this.team, this.isFlagship ? 35 : 22, this));
            });
        }

        takeDamage(dmg, attacker) {
            if (this.isDead) return;
            this.hp -= dmg;

            if (this.hp <= 0) {
                this.hp = 0;
                this.explode();
            }
        }

        explode(isChain = false) {
            if (this.isDead) return;
            this.isDead = true;

            // Trigger Spectacular Multi-Stage FX
            createExplosionFX(this.position, this.isFlagship, this.team);

            // Clean up UI & thrusters
            if (this.trailEmitter) this.trailEmitter.stop();
            if (this.uiContainer) this.uiContainer.dispose();
            this.root.dispose();

            // Update UI count
            updateHUDStats();

            // CHAIN REACTION EXPLOSION CHECK:
            // "If another ship is within roughly one ship-width of the explosion, it also detonates in a chain reaction."
            const chainRadius = this.radius * (this.isFlagship ? 2.2 : 2.5); // ~1 ship width margin

            ships.forEach(other => {
                if (other === this || other.isDead) return;
                const d = BABYLON.Vector3.Distance(this.position, other.position);
                if (d < (chainRadius + other.radius)) {
                    // Stagger the detonation slightly for cinematic chain reaction sensation
                    setTimeout(() => {
                        if (!other.isDead) {
                            other.takeDamage(9999, this); // Fatal chain explosion!
                        }
                    }, 120 + Math.random() * 180);
                }
            });
        }
    }

    // --- GLOWING LASER PROJECTILE CLASS ---
    class Projectile {
        constructor(pos, dir, team, damage, owner) {
            this.position = pos.clone();
            this.velocity = dir.scale(210);
            this.team = team;
            this.damage = damage;
            this.owner = owner;
            this.life = 2.4; // Max travel time
            this.isDead = false;

            // Laser Mesh (Cylinder)
            this.mesh = BABYLON.MeshBuilder.CreateCylinder("laser", {
                diameter: owner.isFlagship ? 1.0 : 0.6,
                height: owner.isFlagship ? 6.5 : 4.0
            }, scene);
            this.mesh.position.copyFrom(this.position);
            
            // Align cylinder with travel direction
            this.mesh.lookAt(this.position.add(dir));
            this.mesh.rotation.x += Math.PI / 2;

            // Glowing Laser Material
            const laserMat = new BABYLON.StandardMaterial("laserMat", scene);
            const col = team === 0 ? new BABYLON.Color3(0, 0.9, 1) : new BABYLON.Color3(1, 0.1, 0.3);
            laserMat.emissiveColor = col;
            laserMat.diffuseColor = col;
            this.mesh.material = laserMat;
        }

        update(dt) {
            if (this.isDead) return;

            this.life -= dt;
            if (this.life <= 0) {
                this.destroy();
                return;
            }

            const step = this.velocity.scale(dt);
            const nextPos = this.position.add(step);

            // Ray collision check with enemy ships
            for (let ship of ships) {
                if (ship.team !== this.team && !ship.isDead) {
                    const dist = BABYLON.Vector3.Distance(nextPos, ship.position);
                    if (dist < (ship.radius + 1.2)) {
                        // Impact!
                        ship.takeDamage(this.damage, this.owner);
                        createImpactFlash(nextPos, this.team);
                        this.destroy();
                        return;
                    }
                }
            }

            this.position.copyFrom(nextPos);
            this.mesh.position.copyFrom(this.position);
        }

        destroy() {
            this.isDead = true;
            this.mesh.dispose();
        }
    }

    // --- SPECTACULAR EXPLOSION & CHAIN REACTION SYSTEM ---
    function createExplosionFX(pos, isFlagship, team) {
        const scale = isFlagship ? 3.0 : 1.2;

        // 1. Dynamic Point Light Flash
        const blastLight = new BABYLON.PointLight("blastLight", pos, scene);
        blastLight.diffuse = new BABYLON.Color3(1.0, 0.6, 0.2);
        blastLight.intensity = isFlagship ? 14 : 6;
        blastLight.range = isFlagship ? 160 : 70;

        // Light fade out animation
        let lightLife = 0.8;
        const lightObserver = scene.onBeforeRenderObservable.add(() => {
            lightLife -= engine.getDeltaTime() / 1000;
            blastLight.intensity = (lightLife / 0.8) * (isFlagship ? 14 : 6);
            if (lightLife <= 0) {
                blastLight.dispose();
                scene.onBeforeRenderObservable.remove(lightObserver);
            }
        });

        // 2. Shockwave Expanding Ring Mesh
        const shockwave = BABYLON.MeshBuilder.CreateTorus("shockwave", {
            diameter: 2,
            thickness: isFlagship ? 1.4 : 0.7,
            tessellation: 32
        }, scene);
        shockwave.position.copyFrom(pos);
        shockwave.rotation.x = Math.random() * Math.PI;
        shockwave.rotation.y = Math.random() * Math.PI;

        const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
        shockMat.emissiveColor = team === 0 ? new BABYLON.Color3(0.3, 0.8, 1) : new BABYLON.Color3(1, 0.4, 0.2);
        shockMat.alpha = 0.9;
        shockwave.material = shockMat;

        shockwaves.push({ mesh: shockwave, mat: shockMat, life: 0.75, maxLife: 0.75, maxRadius: isFlagship ? 70 : 30 });

        // 3. Fireball Particle Explosion
        const fireSystem = new BABYLON.ParticleSystem("fireBlast", 180 * scale, scene);
        fireSystem.particleTexture = fireTexture;
        fireSystem.emitter = pos;
        fireSystem.minEmitBox = new BABYLON.Vector3(-1.5, -1.5, -1.5).scale(scale);
        fireSystem.maxEmitBox = new BABYLON.Vector3(1.5, 1.5, 1.5).scale(scale);
        fireSystem.color1 = new BABYLON.Color4(1, 1, 0.8, 1);
        fireSystem.color2 = new BABYLON.Color4(1, 0.4, 0.05, 0.9);
        fireSystem.colorDead = new BABYLON.Color4(0.2, 0.05, 0.02, 0);
        fireSystem.minSize = 4 * scale;
        fireSystem.maxSize = 9 * scale;
        fireSystem.minLifeTime = 0.5;
        fireSystem.maxLifeTime = 1.1;
        fireSystem.manualEmitCount = 120 * scale;
        fireSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
        fireSystem.minEmitPower = 8 * scale;
        fireSystem.maxEmitPower = 28 * scale;
        fireSystem.direction1 = new BABYLON.Vector3(-1, -1, -1);
        fireSystem.direction2 = new BABYLON.Vector3(1, 1, 1);
        fireSystem.disposeOnStop = true;
        fireSystem.start();

        // 4. Spark Shrapnel Particle Blast
        const sparkSystem = new BABYLON.ParticleSystem("sparkBlast", 250 * scale, scene);
        sparkSystem.particleTexture = sparkTexture;
        sparkSystem.emitter = pos;
        sparkSystem.color1 = new BABYLON.Color4(1, 0.9, 0.6, 1);
        sparkSystem.color2 = new BABYLON.Color4(1, 0.3, 0.1, 0.8);
        sparkSystem.colorDead = new BABYLON.Color4(1, 0.1, 0, 0);
        sparkSystem.minSize = 0.6 * scale;
        sparkSystem.maxSize = 2.0 * scale;
        sparkSystem.minLifeTime = 0.8;
        sparkSystem.maxLifeTime = 1.8;
        sparkSystem.manualEmitCount = 200 * scale;
        sparkSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
        sparkSystem.minEmitPower = 20 * scale;
        sparkSystem.maxEmitPower = 65 * scale;
        sparkSystem.direction1 = new BABYLON.Vector3(-1, -1, -1);
        sparkSystem.direction2 = new BABYLON.Vector3(1, 1, 1);
        sparkSystem.disposeOnStop = true;
        sparkSystem.start();

        // 5. Bilowing Smoke Ring
        const smokeSystem = new BABYLON.ParticleSystem("smokeBlast", 60 * scale, scene);
        smokeSystem.particleTexture = smokeTexture;
        smokeSystem.emitter = pos;
        smokeSystem.color1 = new BABYLON.Color4(0.4, 0.4, 0.45, 0.6);
        smokeSystem.colorDead = new BABYLON.Color4(0.1, 0.1, 0.12, 0);
        smokeSystem.minSize = 6 * scale;
        smokeSystem.maxSize = 14 * scale;
        smokeSystem.minLifeTime = 1.0;
        smokeSystem.maxLifeTime = 2.2;
        smokeSystem.manualEmitCount = 45 * scale;
        smokeSystem.minEmitPower = 5 * scale;
        smokeSystem.maxEmitPower = 18 * scale;
        smokeSystem.disposeOnStop = true;
        smokeSystem.start();

        // 6. Flying Broken Hull Debris Fragments
        const debrisCount = isFlagship ? 18 : 8;
        const mats = getShipMaterials(team);

        for (let i = 0; i < debrisCount; i++) {
            const debris = BABYLON.MeshBuilder.CreateBox("debris", {
                width: (Math.random() * 2 + 1) * scale * 0.5,
                height: (Math.random() * 1.5 + 0.4) * scale * 0.5,
                depth: (Math.random() * 3 + 1) * scale * 0.5
            }, scene);
            debris.position = pos.clone().add(new BABYLON.Vector3(
                (Math.random() - 0.5) * 4 * scale,
                (Math.random() - 0.5) * 4 * scale,
                (Math.random() - 0.5) * 4 * scale
            ));
            debris.material = Math.random() > 0.5 ? mats.hull : mats.armor;

            const vel = new BABYLON.Vector3(
                (Math.random() - 0.5) * 45 * scale,
                (Math.random() - 0.5) * 45 * scale,
                (Math.random() - 0.5) * 45 * scale
            );
            const rotSpeed = new BABYLON.Vector3(
                Math.random() * 6 - 3,
                Math.random() * 6 - 3,
                Math.random() * 6 - 3
            );

            debrisList.push({ mesh: debris, velocity: vel, rotSpeed: rotSpeed, life: 2.5 + Math.random() * 1.5 });
        }
    }

    // Laser Impact Sparks Flash
    function createImpactFlash(pos, team) {
        const impactSystem = new BABYLON.ParticleSystem("impactSparks", 20, scene);
        impactSystem.particleTexture = sparkTexture;
        impactSystem.emitter = pos;
        impactSystem.color1 = team === 0 ? new BABYLON.Color4(0.3, 0.9, 1, 1) : new BABYLON.Color4(1, 0.3, 0.4, 1);
        impactSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
        impactSystem.minSize = 0.5;
        impactSystem.maxSize = 1.4;
        impactSystem.minLifeTime = 0.15;
        impactSystem.maxLifeTime = 0.35;
        impactSystem.manualEmitCount = 16;
        impactSystem.minEmitPower = 8;
        impactSystem.maxEmitPower = 20;
        impactSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
        impactSystem.direction1 = new BABYLON.Vector3(-1, -1, -1);
        impactSystem.direction2 = new BABYLON.Vector3(1, 1, 1);
        impactSystem.disposeOnStop = true;
        impactSystem.start();
    }

    // --- FLEET GENERATION & PLACEMENT ---
    function spawnFleets() {
        // Clear old entities
        ships.forEach(s => {
            if (s.trailEmitter) s.trailEmitter.dispose();
            if (s.uiContainer) s.uiContainer.dispose();
            if (s.root) s.root.dispose();
        });
        projectiles.forEach(p => p.mesh.dispose());
        debrisList.forEach(d => d.mesh.dispose());
        shockwaves.forEach(sw => sw.mesh.dispose());

        ships = [];
        projectiles = [];
        debrisList = [];
        shockwaves = [];

        // Blue Fleet (Team 0) on Left facing +X
        const blueCenter = new BABYLON.Vector3(-180, 0, 0);
        const blueDir = new BABYLON.Vector3(1, 0, 0);
        // Flagship
        ships.push(new Ship(0, true, blueCenter, blueDir));
        // 9 Escorts in 3D V-Formation around flagship
        const blueEscortOffsets = [
            new BABYLON.Vector3(-25, 12, 25),
            new BABYLON.Vector3(-25, -12, -25),
            new BABYLON.Vector3(-45, 20, 45),
            new BABYLON.Vector3(-45, -20, -45),
            new BABYLON.Vector3(-20, 0, 50),
            new BABYLON.Vector3(-20, 0, -50),
            new BABYLON.Vector3(15, 18, 30),
            new BABYLON.Vector3(15, -18, -30),
            new BABYLON.Vector3(-60, 0, 0)
        ];
        blueEscortOffsets.forEach(off => {
            ships.push(new Ship(0, false, blueCenter.add(off), blueDir));
        });

        // Red Fleet (Team 1) on Right facing -X
        const redCenter = new BABYLON.Vector3(180, 0, 0);
        const redDir = new BABYLON.Vector3(-1, 0, 0);
        // Flagship
        ships.push(new Ship(1, true, redCenter, redDir));
        // 9 Escorts in 3D V-Formation around flagship
        const redEscortOffsets = [
            new BABYLON.Vector3(25, 12, 25),
            new BABYLON.Vector3(25, -12, -25),
            new BABYLON.Vector3(45, 20, 45),
            new BABYLON.Vector3(45, -20, -45),
            new BABYLON.Vector3(20, 0, 50),
            new BABYLON.Vector3(20, 0, -50),
            new BABYLON.Vector3(-15, 18, 30),
            new BABYLON.Vector3(-15, -18, -30),
            new BABYLON.Vector3(60, 0, 0)
        ];
        redEscortOffsets.forEach(off => {
            ships.push(new Ship(1, false, redCenter.add(off), redDir));
        });

        updateHUDStats();
        hideBanner();
    }

    // --- UI HUD UPDATER ---
    function updateHUDStats() {
        const blueFlag = ships.find(s => s.team === 0 && s.isFlagship);
        const redFlag = ships.find(s => s.team === 1 && s.isFlagship);
        const blueEscorts = ships.filter(s => s.team === 0 && !s.isFlagship && !s.isDead).length;
        const redEscorts = ships.filter(s => s.team === 1 && !s.isFlagship && !s.isDead).length;

        const blueFlagEl = document.getElementById('blue-flagship');
        const redFlagEl = document.getElementById('red-flagship');
        const blueEscortsEl = document.getElementById('blue-escorts');
        const redEscortsEl = document.getElementById('red-escorts');

        if (blueFlagEl) {
            blueFlagEl.textContent = (blueFlag && !blueFlag.isDead) ? "ONLINE" : "DESTROYED";
            blueFlagEl.style.color = (blueFlag && !blueFlag.isDead) ? "#00d2ff" : "#ff4444";
        }
        if (redFlagEl) {
            redFlagEl.textContent = (redFlag && !redFlag.isDead) ? "ONLINE" : "DESTROYED";
            redFlagEl.style.color = (redFlag && !redFlag.isDead) ? "#ff2b56" : "#ff4444";
        }
        if (blueEscortsEl) blueEscortsEl.textContent = `${blueEscorts} / 9`;
        if (redEscortsEl) redEscortsEl.textContent = `${redEscorts} / 9`;

        // Victory Condition Check
        const blueAlive = ships.some(s => s.team === 0 && !s.isDead);
        const redAlive = ships.some(s => s.team === 1 && !s.isDead);

        if (!blueAlive && redAlive) {
            showBanner("CRIMSON FLEET VICTORIOUS", "#ff2b56");
        } else if (!redAlive && blueAlive) {
            showBanner("ALLIANCE FLEET VICTORIOUS", "#00d2ff");
        } else if (!blueAlive && !redAlive) {
            showBanner("MUTUAL ANNIHILATION", "#ffaa00");
        }
    }

    function showBanner(text, color) {
        const banner = document.getElementById('banner');
        banner.textContent = text;
        banner.style.color = color;
        banner.style.opacity = '1';
    }

    function hideBanner() {
        const banner = document.getElementById('banner');
        banner.style.opacity = '0';
    }

    // --- MAIN RENDER LOOP ---
    createScene();
    spawnFleets();

    scene.registerBeforeRender(() => {
        const dt = (engine.getDeltaTime() / 1000) * timeScale;
        if (dt <= 0) return;

        // Update Active Ships
        for (let i = 0; i < ships.length; i++) {
            ships[i].update(dt);
        }

        // Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            projectiles[i].update(dt);
            if (projectiles[i].isDead) {
                projectiles.splice(i, 1);
            }
        }

        // Update Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            const sw = shockwaves[i];
            sw.life -= dt;
            const progress = 1 - (sw.life / sw.maxLife);
            const scale = progress * sw.maxRadius;
            sw.mesh.scaling.set(scale, scale, scale);
            sw.mat.alpha = (sw.life / sw.maxLife) * 0.9;

            if (sw.life <= 0) {
                sw.mesh.dispose();
                shockwaves.splice(i, 1);
            }
        }

        // Update Hull Debris
        for (let i = debrisList.length - 1; i >= 0; i--) {
            const d = debrisList[i];
            d.life -= dt;
            d.mesh.position.addInPlace(d.velocity.scale(dt));
            d.mesh.rotation.addInPlace(d.rotSpeed.scale(dt));

            if (d.life <= 0) {
                d.mesh.dispose();
                debrisList.splice(i, 1);
            }
        }

        // Cinematic Camera Director
        if (cameraMode === 'cinematic') {
            cinematicTimer -= dt;
            const aliveShips = ships.filter(s => !s.isDead);

            if (cinematicTimer <= 0 || !cinematicTarget || cinematicTarget.isDead) {
                cinematicTimer = 5.0 + Math.random() * 3.0;
                if (aliveShips.length > 0) {
                    // Pick a random alive ship (prefer flagships)
                    const flagships = aliveShips.filter(s => s.isFlagship);
                    cinematicTarget = (flagships.length > 0 && Math.random() > 0.4) 
                        ? flagships[Math.floor(Math.random() * flagships.length)]
                        : aliveShips[Math.floor(Math.random() * aliveShips.length)];
                }
            }

            if (cinematicTarget && !cinematicTarget.isDead) {
                const targetPos = cinematicTarget.position;
                camera.target = BABYLON.Vector3.Lerp(camera.target, targetPos, dt * 3.0);
                camera.radius = BABYLON.Scalar.Lerp(camera.radius, cinematicTarget.isFlagship ? 80 : 45, dt * 2.0);
                camera.alpha += dt * 0.25;
            }
        }
    });

    engine.runRenderLoop(() => {
        scene.render();
    });

    window.addEventListener('resize', () => {
        engine.resize();
    });

    // --- HUD BUTTON CONTROLS ---
    const btnOrbit = document.getElementById('btn-cam-orbit');
    const btnCinematic = document.getElementById('btn-cam-cinematic');
    const btnSlowMo = document.getElementById('btn-slowmo');
    const btnRestart = document.getElementById('btn-restart');

    btnOrbit.classList.add('active');

    btnOrbit.addEventListener('click', () => {
        cameraMode = 'orbit';
        btnOrbit.classList.add('active');
        btnCinematic.classList.remove('active');
        camera.setTarget(BABYLON.Vector3.Zero());
        camera.radius = 380;
    });

    btnCinematic.addEventListener('click', () => {
        cameraMode = 'cinematic';
        cinematicTimer = 0;
        btnCinematic.classList.add('active');
        btnOrbit.classList.remove('active');
    });

    btnSlowMo.addEventListener('click', () => {
        if (timeScale === 1.0) {
            timeScale = 0.25;
            btnSlowMo.textContent = "Speed: 0.25x";
            btnSlowMo.classList.add('active');
        } else {
            timeScale = 1.0;
            btnSlowMo.textContent = "Slow Motion";
            btnSlowMo.classList.remove('active');
        }
    });

    btnRestart.addEventListener('click', () => {
        spawnFleets();
