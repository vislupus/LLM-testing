<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Space Fleet Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        /* UI Overlay */
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 100;
        }

        .fleet-status {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .fleet-panel {
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.9), rgba(5, 10, 20, 0.95));
            border-radius: 12px;
            padding: 15px 25px;
            min-width: 200px;
        }

        .fleet-panel.blue {
            border: 2px solid #4a9eff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }

        .fleet-panel.red {
            border: 2px solid #ff4a4a;
            box-shadow: 0 0 20px rgba(255, 74, 74, 0.3);
        }

        .fleet-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fleet-panel.blue .fleet-title { color: #4a9eff; }
        .fleet-panel.red .fleet-title { color: #ff4a4a; }

        .fleet-ships {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .fleet-status-text {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        /* Battle info */
        .battle-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.9), rgba(5, 10, 20, 0.95));
            border: 2px solid #666;
            border-radius: 12px;
            padding: 12px 30px;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        /* Victory/Defeat screen */
        .end-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }

        .end-screen.show {
            display: flex;
        }

        .end-title {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 30px currentColor;
            margin-bottom: 20px;
        }

        .end-title.blue { color: #4a9eff; }
        .end-title.red { color: #ff4a4a; }

        .end-subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 16px;
            background: linear-gradient(135deg, #4a9eff, #0066cc);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: auto;
        }

        .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.5);
        }

        /* Controls hint */
        .controls-hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 11px;
        }

        .controls-hint span {
            color: #4ecdc4;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <!-- UI -->
    <div id="ui">
        <div class="fleet-status">
            <div class="fleet-panel blue">
                <div class="fleet-title">🔵 Blue Fleet</div>
                <div class="fleet-ships"><span id="blueShips">10</span> / 10</div>
                <div class="fleet-status-text">Flagship: <span id="blueFlagship">Active</span></div>
            </div>
            <div class="fleet-panel red">
                <div class="fleet-title">🔴 Red Fleet</div>
                <div class="fleet-ships"><span id="redShips">10</span> / 10</div>
                <div class="fleet-status-text">Flagship: <span id="redFlagship">Active</span></div>
            </div>
        </div>
    </div>

    <!-- Battle Info -->
    <div class="battle-info">
        <div class="info-item">
            <div class="info-label">Time</div>
            <div class="info-value" id="battleTime">0:00</div>
        </div>
        <div class="info-item">
            <div class="info-label">Explosions</div>
            <div class="info-value" id="explosionCount">0</div>
        </div>
        <div class="info-item">
            <div class="info-label">Shots Fired</div>
            <div class="info-value" id="shotsFired">0</div>
        </div>
    </div>

    <div class="controls-hint">
        <span>🖱️ Drag</span> Rotate &nbsp;
        <span>🔘 Scroll</span> Zoom &nbsp;
        <span>⌨️ WASD</span> Pan
    </div>

    <!-- End Screen -->
    <div class="end-screen" id="endScreen">
        <div class="end-title" id="endTitle">Victory!</div>
        <div class="end-subtitle" id="endSubtitle">The battle is over</div>
        <button class="restart-btn" onclick="restartBattle()">⚔️ New Battle</button>
    </div>

    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>

    <script>
        /* ============================================
           CONFIGURATION
           ============================================ */
        const CONFIG = {
            SHIPS_PER_FLEET: 10,
            FLAGSHIP_SIZE: 4,
            ESCORT_SIZE: 1.5,
            PROJECTILE_SPEED: 80,
            FIRE_RATE: 3000,
            PROJECTILE_DAMAGE: 15,
            FLAGSHIP_HEALTH: 200,
            ESCORT_HEALTH: 60,
            CHAIN_REACTION_RANGE: 8,
            SHIP_SPEED: 8,
            ENGAGEMENT_RANGE: 120
        };

        /* ============================================
           GLOBAL STATE
           ============================================ */
        let canvas, engine, scene, camera;
        let blueFleet = [];
        let redFleet = [];
        let projectiles = [];
        let explosions = [];
        let debris = [];
        
        let battleTime = 0;
        let explosionCount = 0;
        let shotsFired = 0;
        let battleEnded = false;

        // Materials
        let materials = {};

        /* ============================================
           INITIALIZATION
           ============================================ */
        function init() {
            canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

            createScene();
            createMaterials();
            createStarfield();
            createNebula();
            createFleets();

            engine.runRenderLoop(() => {
                if (!battleEnded) {
                    updateBattle();
                }
                scene.render();
            });

            window.addEventListener('resize', () => engine.resize());
        }

        function createScene() {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.05, 1);

            // Camera
            camera = new BABYLON.ArcRotateCamera(
                "camera",
                Math.PI / 4,
                Math.PI / 3,
                150,
                new BABYLON.Vector3(0, 0, 0),
                scene
            );
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 30;
            camera.upperRadiusLimit = 300;
            camera.wheelPrecision = 5;

            // Ambient light
            const ambient = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
            ambient.intensity = 0.3;
            ambient.diffuse = new BABYLON.Color3(0.6, 0.6, 0.8);

            // Main directional light
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -0.5, -0.5), scene);
            sun.intensity = 0.8;
            sun.diffuse = new BABYLON.Color3(1, 0.95, 0.9);

            // Point lights for dramatic effect
            const blueLight = new BABYLON.PointLight("blueLight", new BABYLON.Vector3(-60, 20, 0), scene);
            blueLight.diffuse = new BABYLON.Color3(0.3, 0.5, 1);
            blueLight.intensity = 0.5;

            const redLight = new BABYLON.PointLight("redLight", new BABYLON.Vector3(60, 20, 0), scene);
            redLight.diffuse = new BABYLON.Color3(1, 0.3, 0.3);
            redLight.intensity = 0.5;

            // Keyboard controls
            scene.onKeyboardObservable.add((kbInfo) => {
                const moveSpeed = 3;
                if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
                    switch (kbInfo.event.code) {
                        case 'KeyW': camera.target.z -= moveSpeed; break;
                        case 'KeyS': camera.target.z += moveSpeed; break;
                        case 'KeyA': camera.target.x -= moveSpeed; break;
                        case 'KeyD': camera.target.x += moveSpeed; break;
                    }
                }
            });
        }

        function createMaterials() {
            // Blue fleet materials
            materials.blueHull = new BABYLON.StandardMaterial("blueHull", scene);
            materials.blueHull.diffuseColor = new BABYLON.Color3(0.2, 0.4, 0.8);
            materials.blueHull.specularColor = new BABYLON.Color3(0.5, 0.6, 0.9);
            materials.blueHull.specularPower = 32;

            materials.blueEngine = new BABYLON.StandardMaterial("blueEngine", scene);
            materials.blueEngine.diffuseColor = new BABYLON.Color3(0.3, 0.6, 1);
            materials.blueEngine.emissiveColor = new BABYLON.Color3(0.2, 0.5, 1);

            // Red fleet materials
            materials.redHull = new BABYLON.StandardMaterial("redHull", scene);
            materials.redHull.diffuseColor = new BABYLON.Color3(0.8, 0.3, 0.2);
            materials.redHull.specularColor = new BABYLON.Color3(0.9, 0.5, 0.5);
            materials.redHull.specularPower = 32;

            materials.redEngine = new BABYLON.StandardMaterial("redEngine", scene);
            materials.redEngine.diffuseColor = new BABYLON.Color3(1, 0.4, 0.3);
            materials.redEngine.emissiveColor = new BABYLON.Color3(1, 0.3, 0.2);

            // Projectile materials
            materials.blueProjectile = new BABYLON.StandardMaterial("blueProj", scene);
            materials.blueProjectile.diffuseColor = new BABYLON.Color3(0.5, 0.8, 1);
            materials.blueProjectile.emissiveColor = new BABYLON.Color3(0.3, 0.6, 1);

            materials.redProjectile = new BABYLON.StandardMaterial("redProj", scene);
            materials.redProjectile.diffuseColor = new BABYLON.Color3(1, 0.5, 0.5);
            materials.redProjectile.emissiveColor = new BABYLON.Color3(1, 0.3, 0.3);

            // Explosion materials
            materials.explosionCore = new BABYLON.StandardMaterial("expCore", scene);
            materials.explosionCore.emissiveColor = new BABYLON.Color3(1, 0.8, 0.3);

            materials.explosionFire = new BABYLON.StandardMaterial("expFire", scene);
            materials.explosionFire.emissiveColor = new BABYLON.Color3(1, 0.4, 0.1);

            materials.spark = new BABYLON.StandardMaterial("spark", scene);
            materials.spark.emissiveColor = new BABYLON.Color3(1, 0.9, 0.6);
        }

        function createStarfield() {
            const starCount = 2000;
            const positions = [];
            const colors = [];

            for (let i = 0; i < starCount; i++) {
                // Spherical distribution
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 400 + Math.random() * 100;

                positions.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );

                const brightness = 0.5 + Math.random() * 0.5;
                colors.push(brightness, brightness, brightness + 0.1, 1);
            }

            const stars = new BABYLON.Mesh("stars", scene);
            const vertexData = new BABYLON.VertexData();
            vertexData.positions = positions;
            vertexData.colors = colors;

            // Create point indices
            const indices = [];
            for (let i = 0; i < starCount; i++) {
                indices.push(i);
            }
            vertexData.indices = indices;
            vertexData.applyToMesh(stars);

            const starMat = new BABYLON.StandardMaterial("starMat", scene);
            starMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
            starMat.disableLighting = true;
            starMat.pointsCloud = true;
            starMat.pointSize = 2;
            stars.material = starMat;
        }

        function createNebula() {
            // Create multiple nebula clouds
            const nebulaColors = [
                new BABYLON.Color3(0.2, 0.1, 0.4),
                new BABYLON.Color3(0.1, 0.2, 0.3),
                new BABYLON.Color3(0.3, 0.1, 0.2)
            ];

            for (let i = 0; i < 5; i++) {
                const nebula = BABYLON.MeshBuilder.CreateSphere(`nebula${i}`, {
                    diameter: 150 + Math.random() * 100,
                    segments: 16
                }, scene);

                nebula.position = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 300,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 300
                );

                const nebulaMat = new BABYLON.StandardMaterial(`nebulaMat${i}`, scene);
                nebulaMat.diffuseColor = nebulaColors[i % nebulaColors.length];
                nebulaMat.emissiveColor = nebulaColors[i % nebulaColors.length].scale(0.2);
                nebulaMat.alpha = 0.15;
                nebulaMat.backFaceCulling = false;
                nebula.material = nebulaMat;
            }
        }

        /* ============================================
           FLEET CREATION
           ============================================ */
        function createFleets() {
            // Blue fleet (left side)
            createFleet(blueFleet, 'blue', new BABYLON.Vector3(-50, 0, 0), new BABYLON.Vector3(1, 0, 0));

            // Red fleet (right side)
            createFleet(redFleet, 'red', new BABYLON.Vector3(50, 0, 0), new BABYLON.Vector3(-1, 0, 0));
        }

        function createFleet(fleet, team, position, facing) {
            // Create flagship
            const flagship = createShip(team, true);
            flagship.mesh.position = position.clone();
            flagship.mesh.position.y += (Math.random() - 0.5) * 10;
            flagship.mesh.lookAt(position.add(facing));
            flagship.forward = facing.clone();
            fleet.push(flagship);

            // Create escort ships in formation
            for (let i = 0; i < CONFIG.SHIPS_PER_FLEET - 1; i++) {
                const escort = createShip(team, false);
                
                // Formation around flagship
                const angle = (i / (CONFIG.SHIPS_PER_FLEET - 1)) * Math.PI * 2;
                const radius = 15 + Math.random() * 10;
                const yOffset = (Math.random() - 0.5) * 15;

                escort.mesh.position = position.clone();
                escort.mesh.position.x += Math.cos(angle) * radius * facing.z;
                escort.mesh.position.z += Math.sin(angle) * radius;
                escort.mesh.position.y += yOffset;

                escort.mesh.lookAt(escort.mesh.position.add(facing));
                escort.forward = facing.clone();

                fleet.push(escort);
            }
        }

        function createShip(team, isFlagship) {
            const size = isFlagship ? CONFIG.FLAGSHIP_SIZE : CONFIG.ESCORT_SIZE;
            const health = isFlagship ? CONFIG.FLAGSHIP_HEALTH : CONFIG.ESCORT_HEALTH;

            const shipGroup = new BABYLON.TransformNode(team + "_ship_" + Date.now() + Math.random(), scene);

            // Main hull
            const hullLength = size * 3;
            const hullWidth = size * 0.8;
            const hullHeight = size * 0.4;

            const hull = BABYLON.MeshBuilder.CreateBox("hull", {
                width: hullLength,
                height: hullHeight,
                depth: hullWidth
            }, scene);
            hull.parent = shipGroup;
            hull.material = team === 'blue' ? materials.blueHull : materials.redHull;

            // Bridge/Superstructure
            const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {
                width: hullLength * 0.4,
                height: hullHeight * 0.8,
                depth: hullWidth * 0.6
            }, scene);
            bridge.position.y = hullHeight * 0.8;
            bridge.parent = shipGroup;
            bridge.material = team === 'blue' ? materials.blueHull : materials.redHull;

            // Nose cone
            const nose = BABYLON.MeshBuilder.CreateCylinder("nose", {
                diameterTop: 0,
                diameterBottom: hullWidth * 0.8,
                height: hullLength * 0.3
            }, scene);
            nose.rotation.z = Math.PI / 2;
            nose.position.x = hullLength * 0.6;
            nose.parent = shipGroup;
            nose.material = team === 'blue' ? materials.blueHull : materials.redHull;

            // Engine thrusters
            const engineCount = isFlagship ? 4 : 2;
            const enginePositions = isFlagship 
                ? [[-hullLength * 0.45, hullHeight * 0.2, hullWidth * 0.25],
                   [-hullLength * 0.45, hullHeight * 0.2, -hullWidth * 0.25],
                   [-hullLength * 0.45, -hullHeight * 0.1, hullWidth * 0.15],
                   [-hullLength * 0.45, -hullHeight * 0.1, -hullWidth * 0.15]]
                : [[-hullLength * 0.45, 0, hullWidth * 0.2],
                   [-hullLength * 0.45, 0, -hullWidth * 0.2]];

            const engines = [];
            enginePositions.forEach((pos, i) => {
                const engine = BABYLON.MeshBuilder.CreateCylinder(`engine${i}`, {
                    diameter: size * 0.3,
                    height: size * 0.5
                }, scene);
                engine.rotation.z = Math.PI / 2;
                engine.position = new BABYLON.Vector3(...pos);
                engine.parent = shipGroup;
                engine.material = team === 'blue' ? materials.blueEngine : materials.redEngine;
                engines.push(engine);
            });

            // Add detail for flagships
            if (isFlagship) {
                // Wing-like structures
                const wing = BABYLON.MeshBuilder.CreateBox("wing", {
                    width: hullLength * 0.3,
                    height: hullHeight * 0.2,
                    depth: hullWidth * 2
                }, scene);
                wing.position.x = -hullLength * 0.2;
                wing.position.y = -hullHeight * 0.2;
                wing.parent = shipGroup;
                wing.material = team === 'blue' ? materials.blueHull : materials.redHull;

                // Antenna
                const antenna = BABYLON.MeshBuilder.CreateCylinder("antenna", {
                    diameter: size * 0.05,
                    height: size * 2
                }, scene);
                antenna.position.y = hullHeight * 1.5;
                antenna.parent = shipGroup;
                antenna.material = team === 'blue' ? materials.blueHull : materials.redHull;
            }

            // Create health bar
            const healthBar = createHealthBar(shipGroup, size);

            const ship = {
                mesh: shipGroup,
                hull: hull,
                team: team,
                isFlagship: isFlagship,
                health: health,
                maxHealth: health,
                size: size,
                engines: engines,
                healthBar: healthBar,
                lastFire: 0,
                forward: new BABYLON.Vector3(1, 0, 0),
                velocity: new BABYLON.Vector3(0, 0, 0),
                target: null,
                maneuverTimer: 0,
                maneuverDirection: new BABYLON.Vector3(0, 0, 0)
            };

            return ship;
        }

        function createHealthBar(parent, size) {
            const barWidth = size * 2;
            const barHeight = size * 0.15;

            // Background
            const bg = BABYLON.MeshBuilder.CreatePlane("healthBg", {
                width: barWidth,
                height: barHeight
            }, scene);
            bg.position.y = size * 2;
            bg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            bg.parent = parent;

            const bgMat = new BABYLON.StandardMaterial("healthBgMat", scene);
            bgMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            bgMat.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            bg.material = bgMat;

            // Fill
            const fill = BABYLON.MeshBuilder.CreatePlane("healthFill", {
                width: barWidth,
                height: barHeight
            }, scene);
            fill.position.y = size * 2;
            fill.position.z = -0.01;
            fill.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
            fill.parent = parent;

            const fillMat = new BABYLON.StandardMaterial("healthFillMat", scene);
            fillMat.diffuseColor = new BABYLON.Color3(0.2, 0.9, 0.2);
            fillMat.emissiveColor = new BABYLON.Color3(0.1, 0.5, 0.1);
            fill.material = fillMat;

            return { bg, fill, width: barWidth };
        }

        function updateHealthBar(ship) {
            const ratio = ship.health / ship.maxHealth;
            ship.healthBar.fill.scaling.x = Math.max(0.01, ratio);

            const mat = ship.healthBar.fill.material;
            if (ratio > 0.6) {
                mat.diffuseColor = new BABYLON.Color3(0.2, 0.9, 0.2);
                mat.emissiveColor = new BABYLON.Color3(0.1, 0.5, 0.1);
            } else if (ratio > 0.3) {
                mat.diffuseColor = new BABYLON.Color3(0.9, 0.8, 0.2);
                mat.emissiveColor = new BABYLON.Color3(0.5, 0.4, 0.1);
            } else {
                mat.diffuseColor = new BABYLON.Color3(0.9, 0.2, 0.2);
                mat.emissiveColor = new BABYLON.Color3(0.5, 0.1, 0.1);
            }
        }

        /* ============================================
           COMBAT SYSTEM
           ============================================ */
        function updateBattle() {
            const deltaTime = engine.getDeltaTime() / 1000;
            battleTime += deltaTime;

            // Update UI
            const minutes = Math.floor(battleTime / 60);
            const seconds = Math.floor(battleTime % 60);
            document.getElementById('battleTime').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;

            // Update ships
            updateFleet(blueFleet, redFleet, deltaTime);
            updateFleet(redFleet, blueFleet, deltaTime);

            // Update projectiles
            updateProjectiles(deltaTime);

            // Update explosions
            updateExplosions(deltaTime);

            // Update debris
            updateDebris(deltaTime);

            // Check for chain reactions
            checkChainReactions();

            // Check victory conditions
            checkVictory();

            // Update fleet status UI
            updateFleetUI();
        }

        function updateFleet(fleet, enemyFleet, deltaTime) {
            fleet.forEach(ship => {
                if (ship.health <= 0) return;

                // Find target
                if (!ship.target || ship.target.health <= 0) {
                    ship.target = findTarget(ship, enemyFleet);
                }

                if (ship.target) {
                    // Move toward target with maneuvering
                    updateShipMovement(ship, deltaTime);

                    // Fire at target
                    tryFire(ship);
                }
            });
        }

        function findTarget(ship, enemyFleet) {
            let closest = null;
            let closestDist = Infinity;

            enemyFleet.forEach(enemy => {
                if (enemy.health <= 0) return;

                const dist = BABYLON.Vector3.Distance(ship.mesh.position, enemy.mesh.position);
                if (dist < closestDist) {
                    closestDist = dist;
                    closest = enemy;
                }
            });

            return closest;
        }

        function updateShipMovement(ship, deltaTime) {
            if (!ship.target) return;

            const toTarget = ship.target.mesh.position.subtract(ship.mesh.position);
            const distance = toTarget.length();

            // Update maneuver timer
            ship.maneuverTimer -= deltaTime;
            if (ship.maneuverTimer <= 0) {
                ship.maneuverTimer = 2 + Math.random() * 3;
                ship.maneuverDirection = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5),
                    (Math.random() - 0.5) * 2
                ).normalize();
            }

            // Desired direction combines approach and maneuvering
            let desiredDir;
            if (distance > CONFIG.ENGAGEMENT_RANGE * 0.5) {
                // Approach
                desiredDir = toTarget.normalize();
            } else if (distance < CONFIG.ENGAGEMENT_RANGE * 0.2) {
                // Back off
                desiredDir = toTarget.normalize().scale(-1);
            } else {
                // Strafe
                desiredDir = ship.maneuverDirection;
            }

            // Smoothly turn toward desired direction
            ship.forward = BABYLON.Vector3.Lerp(ship.forward, desiredDir, deltaTime * 0.5).normalize();

            // Update velocity
            const speed = CONFIG.SHIP_SPEED * (ship.isFlagship ? 0.7 : 1);
            ship.velocity = ship.forward.scale(speed);

            // Apply movement
            ship.mesh.position.addInPlace(ship.velocity.scale(deltaTime));

            // Rotate to face direction
            const lookTarget = ship.mesh.position.add(ship.forward);
            ship.mesh.lookAt(lookTarget);

            // Engine glow effect
            ship.engines.forEach(engine => {
                const intensity = 0.5 + Math.random() * 0.5;
                engine.material.emissiveColor = (ship.team === 'blue' 
                    ? new BABYLON.Color3(0.2 * intensity, 0.5 * intensity, 1)
                    : new BABYLON.Color3(1, 0.3 * intensity, 0.2 * intensity));
            });
        }

        function tryFire(ship) {
            const now = Date.now();
            if (now - ship.lastFire < CONFIG.FIRE_RATE) return;
            if (!ship.target || ship.target.health <= 0) return;

            const distance = BABYLON.Vector3.Distance(ship.mesh.position, ship.target.mesh.position);
            if (distance > CONFIG.ENGAGEMENT_RANGE) return;

            ship.lastFire = now;

            // Flagships fire two projectiles
            const projectileCount = ship.isFlagship ? 2 : 1;

            for (let i = 0; i < projectileCount; i++) {
                const offset = projectileCount > 1 ? (i - 0.5) * ship.size * 0.5 : 0;
                fireProjectile(ship, offset);
            }

            shotsFired++;
            document.getElementById('shotsFired').textContent = shotsFired;
        }

        function fireProjectile(ship, offset) {
            const projectile = BABYLON.MeshBuilder.CreateSphere("projectile", {
                diameter: 0.4
            }, scene);

            projectile.position = ship.mesh.position.clone();
            projectile.position.y += offset;

            const targetPos = ship.target.mesh.position.clone();
            // Add some inaccuracy
            targetPos.x += (Math.random() - 0.5) * 2;
            targetPos.y += (Math.random() - 0.5) * 2;
            targetPos.z += (Math.random() - 0.5) * 2;

            const direction = targetPos.subtract(projectile.position).normalize();

            projectile.material = ship.team === 'blue' ? materials.blueProjectile : materials.redProjectile;

            // Create trail
            const trail = createTrail(projectile, ship.team);

            projectiles.push({
                mesh: projectile,
                direction: direction,
                team: ship.team,
                damage: CONFIG.PROJECTILE_DAMAGE,
                source: ship,
                trail: trail,
                life: 5
            });
        }

        function createTrail(projectile, team) {
            const trail = BABYLON.MeshBuilder.CreateCylinder("trail", {
                height: 3,
                diameter: 0.15
            }, scene);
            
            trail.parent = projectile;
            trail.rotation.x = Math.PI / 2;
            trail.position.z = 1.5;

            const trailMat = new BABYLON.StandardMaterial("trailMat", scene);
            trailMat.diffuseColor = team === 'blue' 
                ? new BABYLON.Color3(0.3, 0.6, 1)
                : new BABYLON.Color3(1, 0.4, 0.4);
            trailMat.emissiveColor = team === 'blue'
                ? new BABYLON.Color3(0.2, 0.4, 0.8)
                : new BABYLON.Color3(0.8, 0.3, 0.3);
            trailMat.alpha = 0.7;
            trail.material = trailMat;

            return trail;
        }

        function updateProjectiles(deltaTime) {
            projectiles = projectiles.filter(proj => {
                proj.mesh.position.addInPlace(proj.direction.scale(CONFIG.PROJECTILE_SPEED * deltaTime));
                proj.life -= deltaTime;

                // Check collision with ships
                const targetFleet = proj.team === 'blue' ? redFleet : blueFleet;
                
                for (const ship of targetFleet) {
                    if (ship.health <= 0) continue;

                    const dist = BABYLON.Vector3.Distance(proj.mesh.position, ship.mesh.position);
                    if (dist < ship.size * 2) {
                        // Hit!
                        ship.health -= proj.damage;
                        updateHealthBar(ship);

                        if (ship.health <= 0) {
                            destroyShip(ship);
                        }

                        // Create small impact effect
                        createImpactEffect(proj.mesh.position, proj.team);

                        // Cleanup
                        proj.mesh.dispose();
                        return false;
                    }
                }

                // Remove if expired or too far
                if (proj.life <= 0 || BABYLON.Vector3.Distance(proj.mesh.position, BABYLON.Vector3.Zero()) > 300) {
                    proj.mesh.dispose();
                    return false;
                }

                return true;
            });
        }

        function createImpactEffect(position, team) {
            const spark = BABYLON.MeshBuilder.CreateSphere("impact", { diameter: 0.5 }, scene);
            spark.position = position.clone();
            spark.material = team === 'blue' ? materials.blueProjectile : materials.redProjectile;

            setTimeout(() => spark.dispose(), 100);
        }

        /* ============================================
           DESTRUCTION & EXPLOSIONS
           ============================================ */
        function destroyShip(ship) {
            // Create explosion
            createExplosion(ship.mesh.position.clone(), ship.size);

            // Create debris
            createDebris(ship);

            // Remove from scene
            ship.mesh.dispose();

            explosionCount++;
            document.getElementById('explosionCount').textContent = explosionCount;
        }

        function createExplosion(position, size) {
            const explosion = {
                position: position.clone(),
                size: size,
                time: 0,
                maxTime: 1.5,
                particles: [],
                shockwave: null,
                light: null
            };

            // Core fireball
            const core = BABYLON.MeshBuilder.CreateSphere("expCore", {
                diameter: size * 2
            }, scene);
            core.position = position.clone();
            core.material = materials.explosionCore;
            explosion.particles.push(core);

            // Outer fire
            const fire = BABYLON.MeshBuilder.CreateSphere("expFire", {
                diameter: size * 3
            }, scene);
            fire.position = position.clone();
            fire.material = materials.explosionFire;
            fire.scaling = new BABYLON.Vector3(1, 0.6, 1);
            explosion.particles.push(fire);

            // Shockwave ring
            const shockwave = BABYLON.MeshBuilder.CreateTorus("shockwave", {
                diameter: size * 2,
                thickness: size * 0.3,
                tessellation: 32
            }, scene);
            shockwave.position = position.clone();
            shockwave.rotation.x = Math.PI / 2;
            
            const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
            shockMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0.4);
            shockMat.alpha = 0.8;
            shockwave.material = shockMat;
            explosion.shockwave = shockwave;

            // Point light for explosion glow
            const light = new BABYLON.PointLight("expLight", position.clone(), scene);
            light.diffuse = new BABYLON.Color3(1, 0.6, 0.2);
            light.intensity = 3;
            light.range = size * 20;
            explosion.light = light;

            // Sparks
            for (let i = 0; i < 20; i++) {
                const spark = BABYLON.MeshBuilder.CreateSphere("spark", {
                    diameter: 0.2 + Math.random() * 0.3
                }, scene);
                spark.position = position.clone();
                spark.material = materials.spark;

                const velocity = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 30,
                    (Math.random() - 0.5) * 30,
                    (Math.random() - 0.5) * 30
                );

                explosion.particles.push({
                    mesh: spark,
                    velocity: velocity,
                    isSpark: true
                });
            }

            explosions.push(explosion);
        }

        function updateExplosions(deltaTime) {
            explosions = explosions.filter(exp => {
                exp.time += deltaTime;
                const progress = exp.time / exp.maxTime;

                if (progress >= 1) {
                    // Cleanup
                    exp.particles.forEach(p => {
                        if (p.mesh) p.mesh.dispose();
                        else if (p.dispose) p.dispose();
                    });
                    if (exp.shockwave) exp.shockwave.dispose();
                    if (exp.light) exp.light.dispose();
                    return false;
                }

                // Animate core and fire
                const coreParticle = exp.particles[0];
                const fireParticle = exp.particles[1];

                if (coreParticle && coreParticle.scaling) {
                    const scale = 1 + progress * 3;
                    coreParticle.scaling = new BABYLON.Vector3(scale, scale, scale);
                    coreParticle.material.alpha = 1 - progress;
                }

                if (fireParticle && fireParticle.scaling) {
                    const scale = 1 + progress * 4;
                    fireParticle.scaling = new BABYLON.Vector3(scale, scale * 0.6, scale);
                    fireParticle.material.alpha = (1 - progress) * 0.8;
                }

                // Animate shockwave
                if (exp.shockwave) {
                    const scale = 1 + progress * 8;
                    exp.shockwave.scaling = new BABYLON.Vector3(scale, scale, scale);
                    exp.shockwave.material.alpha = (1 - progress) * 0.6;
                }

                // Animate light
                if (exp.light) {
                    exp.light.intensity = 3 * (1 - progress);
                }

                // Animate sparks
                for (let i = 2; i < exp.particles.length; i++) {
                    const spark = exp.particles[i];
                    if (spark.mesh && spark.velocity) {
                        spark.mesh.position.addInPlace(spark.velocity.scale(deltaTime));
                        spark.velocity.scaleInPlace(0.98);
                        spark.mesh.material.alpha = (1 - progress);
                    }
                }

                return true;
            });
        }

        function createDebris(ship) {
            const count = ship.isFlagship ? 15 : 8;

            for (let i = 0; i < count; i++) {
                const size = 0.2 + Math.random() * 0.5;
                const debris = BABYLON.MeshBuilder.CreateBox("debris", {
                    width: size,
                    height: size * 0.5,
                    depth: size * 0.7
                }, scene);

                debris.position = ship.mesh.position.clone();
                debris.position.x += (Math.random() - 0.5) * ship.size * 2;
                debris.position.y += (Math.random() - 0.5) * ship.size * 2;
                debris.position.z += (Math.random() - 0.5) * ship.size * 2;

                debris.rotation = new BABYLON.Vector3(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );

                const debrisMat = new BABYLON.StandardMaterial("debrisMat", scene);
                debrisMat.diffuseColor = ship.team === 'blue' 
                    ? new BABYLON.Color3(0.3, 0.5, 0.7)
                    : new BABYLON.Color3(0.7, 0.4, 0.3);
                debris.material = debrisMat;

                debris.push({
                    mesh: debris,
                    velocity: new BABYLON.Vector3(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 20
                    ),
                    angularVelocity: new BABYLON.Vector3(
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 5
                    ),
                    life: 5 + Math.random() * 5
                });
            }
        }

        function updateDebris(deltaTime) {
            debris = debris.filter(d => {
                d.mesh.position.addInPlace(d.velocity.scale(deltaTime));
                d.mesh.rotation.addInPlace(d.angularVelocity.scale(deltaTime));
                d.velocity.scaleInPlace(0.99);
                d.life -= deltaTime;

                if (d.life <= 0) {
                    d.mesh.dispose();
                    return false;
                }

                return true;
            });
        }

        function checkChainReactions() {
            // Check if any ship is within explosion range
            explosions.forEach(exp => {
                if (exp.time > 0.3) return; // Only check early explosion phase

                const allShips = [...blueFleet, ...redFleet];
                allShips.forEach(ship => {
                    if (ship.health <= 0) return;

                    const dist = BABYLON.Vector3.Distance(exp.position, ship.mesh.position);
                    if (dist < CONFIG.CHAIN_REACTION_RANGE) {
                        ship.health = 0;
                        updateHealthBar(ship);
                        destroyShip(ship);
                    }
                });
            });
        }

        /* ============================================
           VICTORY CONDITIONS
           ============================================ */
        function checkVictory() {
            const blueAlive = blueFleet.filter(s => s.health > 0).length;
            const redAlive = redFleet.filter(s => s.health > 0).length;

            if (blueAlive === 0 || redAlive === 0) {
                battleEnded = true;

                const endScreen = document.getElementById('endScreen');
                const endTitle = document.getElementById('endTitle');
                const endSubtitle = document.getElementById('endSubtitle');

                if (blueAlive === 0 && redAlive === 0) {
                    endTitle.textContent = "DRAW!";
                    endTitle.className = "end-title";
                    endSubtitle.textContent = "Both fleets destroyed!";
                } else if (blueAlive > 0) {
                    endTitle.textContent = "🔵 BLUE VICTORY!";
                    endTitle.className = "end-title blue";
                    endSubtitle.textContent = `${blueAlive} ships survived`;
                } else {
                    endTitle.textContent = "🔴 RED VICTORY!";
                    endTitle.className = "end-title red";
                    endSubtitle.textContent = `${redAlive} ships survived`;
                }

                endScreen.classList.add('show');
            }
        }

        function updateFleetUI() {
            const blueAlive = blueFleet.filter(s => s.health > 0).length;
            const redAlive = redFleet.filter(s => s.health > 0).length;

            document.getElementById('blueShips').textContent = blueAlive;
            document.getElementById('redShips').textContent = redAlive;

            const blueFlagship = blueFleet.find(s => s.isFlagship);
            const redFlagship = redFleet.find(s => s.isFlagship);

            document.getElementById('blueFlagship').textContent = 
                blueFlagship && blueFlagship.health > 0 ? 'Active' : 'Destroyed';
            document.getElementById('redFlagship').textContent = 
                redFlagship && redFlagship.health > 0 ? 'Active' : 'Destroyed';
        }

        function restartBattle() {
            // Clear existing
            blueFleet.forEach(s => s.mesh.dispose());
            redFleet.forEach(s => s.mesh.dispose());
            projectiles.forEach(p => p.mesh.dispose());
            explosions.forEach(e => {
                e.particles.forEach(p => p.mesh ? p.mesh.dispose() : null);
                if (e.shockwave) e.shockwave.dispose();
                if (e.light) e.light.dispose();
            });
            debris.forEach(d => d.mesh.dispose());

            // Reset arrays
            blueFleet = [];
            redFleet = [];
            projectiles = [];
            explosions = [];
            debris = [];

            // Reset state
            battleTime = 0;
            explosionCount = 0;
            shotsFired = 0;
            battleEnded = false;

            // Hide end screen
            document.getElementById('endScreen').classList.remove('show');

            // Create new fleets
            createFleets();
        }

        // Initialize
        init();
    </script>
