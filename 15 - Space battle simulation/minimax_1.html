<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Babylon.js Space Battle</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="ui">
        <h1>Space Battle Simulation</h1>
        <p>Blue Team vs Red Team | Chain Reactions Enabled</p>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // --- GAME CONSTANTS ---
        const TEAM_BLUE = 0;
        const TEAM_RED = 1;
        const SHIP_SPEED = 0.2;
        const TURN_SPEED = 0.05;
        const PROJ_SPEED = 1.5;
        const FIRE_RATE = 180; // Frames (approx 3 sec at 60fps)
        const FLAGSHIP_FIRE_RATE = 180;
        const EXPLOSION_RADIUS = 8;
        const CHAIN_REACTION_RADIUS = 5;
        
        // Global Lists
        let ships = [];
        let projectiles = [];
        let particles = [];

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.02, 0.02, 0.05);

            // --- CAMERA & LIGHTS ---
            const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 3, 80, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;

            // Ambient light
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.3;

            // Sun / Directional Light
            const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.intensity = 0.8;

            // --- ENVIRONMENT (Starfield) ---
            const starGeo = BABYLON.MeshBuilder.CreateSphere("stars", {diameter: 400, segments: 32}, scene);
            const starMat = new BABYLON.StandardMaterial("starMat", scene);
            starMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
            starMat.disableLighting = true;
            // Create a noise texture for stars
            const noiseTexture = new BABYLON.NoiseProceduralTexture("perlin", 256, scene);
            noiseTexture.animationSpeedFactor = 0;
            noiseTexture.brightness = 1;
            noiseTexture.octaves = 4;
            starMat.opacityTexture = noiseTexture;
            starMat.alphaMode = BABYLON.Engine.ALPHA_MULTIPLY;
            starGeo.material = starMat;
            starGeo.isPickable = false;

            // --- MATERIALS ---
            const blueMat = new BABYLON.StandardMaterial("blueMat", scene);
            blueMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 1);
            blueMat.emissiveColor = new BABYLON.Color3(0.1, 0.3, 0.5);

            const redMat = new BABYLON.StandardMaterial("redMat", scene);
            redMat.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2);
            redMat.emissiveColor = new BABYLON.Color3(0.5, 0.1, 0.1);

            const engineBlueMat = new BABYLON.StandardMaterial("engBlue", scene);
            engineBlueMat.emissiveColor = new BABYLON.Color3(0, 0.8, 1);

            const engineRedMat = new BABYLON.StandardMaterial("engRed", scene);
            engineRedMat.emissiveColor = new BABYLON.Color3(1, 0.4, 0);

            // --- SHIP FACTORY ---
            function createShipMesh(isFlagship, team) {
                const root = new BABYLON.TransformNode("shipRoot", scene);
                
                const mat = team === TEAM_BLUE ? blueMat : redMat;
                const engMat = team === TEAM_BLUE ? engineBlueMat : engineRedMat;

                // Body
                if (isFlagship) {
                    const body = BABYLON.MeshBuilder.CreateCylinder("body", {height: 8, diameterTop: 1, diameterBottom: 3, tessellation: 8}, scene);
                    body.rotation.x = Math.PI / 2;
                    body.material = mat;
                    body.parent = root;

                    const ring = BABYLON.MeshBuilder.CreateTorus("ring", {diameter: 4, thickness: 0.8}, scene);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.z = 1;
                    ring.material = mat;
                    ring.parent = root;
                } else {
                    const body = BABYLON.MeshBuilder.CreateCylinder("body", {height: 3, diameterTop: 0.5, diameterBottom: 1.5}, scene);
                    body.rotation.x = Math.PI / 2;
                    body.material = mat;
                    body.parent = root;
                    
                    const wingL = BABYLON.MeshBuilder.CreateBox("wingL", {width: 0.2, height: 2, depth: 1}, scene);
                    wingL.position.x = -1;
                    wingL.rotation.z = 0.5;
                    wingL.material = mat;
                    wingL.parent = root;

                    const wingR = wingL.clone("wingR");
                    wingR.position.x = 1;
                    wingR.rotation.z = -0.5;
                    wingR.parent = root;
                }

                // Engine Glow
                const engine = BABYLON.MeshBuilder.CreateSphere("engine", {diameter: isFlagship? 2 : 1}, scene);
                engine.position.z = isFlagship ? -4 : -1.5;
                engine.material = engMat;
                engine.parent = root;

                // Health Bar Container
                const barBg = BABYLON.MeshBuilder.CreatePlane("barBg", {width: isFlagship?6:3, height: 0.5}, scene);
                barBg.position.y = isFlagship ? 4 : 2;
                barBg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                barBg.parent = root;
                
                const barMat = new BABYLON.StandardMaterial("barMat", scene);
                barMat.emissiveColor = BABYLON.Color3.Red();
                barBg.material = barMat;

                const barFg = BABYLON.MeshBuilder.CreatePlane("barFg", {width: isFlagship?6:3, height: 0.5}, scene);
                barFg.position.y = isFlagship ? 4 : 2;
                barFg.position.z = -0.01; // slightly in front
                barFg.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                
                const fgMat = new BABYLON.StandardMaterial("fgMat", scene);
                fgMat.emissiveColor = BABYLON.Color3.Green();
                barFg.material = fgMat;
                barFg.parent = root;

                return { root, barFg, barBg, isFlagship };
            }

            // --- SPAWN FLEETS ---
            function spawnFleet(team, offsetX) {
                // Flagship
                const flagship = createShipMesh(true, team);
                flagship.root.position = new BABYLON.Vector3(offsetX, 0, 0);
                ships.push({
                    mesh: flagship.root,
                    bar: flagship.barFg,
                    team: team,
                    hp: 500,
                    maxHp: 500,
                    cooldown: 0,
                    type: "flagship"
                });

                // Escorts (Formation)
                for (let i = 0; i < 9; i++) {
                    const angle = (i / 9) * Math.PI * 2;
                    const r = 15 + (i % 2) * 5; // Two rings
                    const x = offsetX + Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    const y = Math.sin(angle * 2) * 5; // Wavy height

                    const escort = createShipMesh(false, team);
                    escort.root.position = new BABYLON.Vector3(x, y, z);
                    
                    // Face center initially
                    escort.root.lookAt(new BABYLON.Vector3(offsetX, 0, 0));

                    ships.push({
                        mesh: escort.root,
                        bar: escort.barFg,
                        team: team,
                        hp: 100,
                        maxHp: 100,
                        cooldown: Math.random() * 100, // Offset firing
                        type: "escort"
                    });
                }
            }

            spawnFleet(TEAM_BLUE, -30);
            spawnFleet(TEAM_RED, 30);


            // --- PROJECTILE LOGIC ---
            function fireProjectile(shooter) {
                const isFlagship = shooter.type === "flagship";
                const color = shooter.team === TEAM_BLUE ? new BABYLON.Color3(0, 0.8, 1) : new BABYLON.Color3(1, 0.2, 0);
                const count = isFlagship ? 2 : 1;
                
                const forward = shooter.mesh.getDirection(BABYLON.Axis.Z).scale(-1); // Forward is -Z in local space usually, but Babylon cylinder points Y
                // Adjusting for cylinder orientation: We rotated X by 90. Forward is effectively -Z local, which is Y world? 
                // Let's just use world forward from rotation.
                
                // Correction: The mesh root is Z-up? No, we rotated cylinder to point Z.
                // Let's just get the direction the mesh is facing.
                const direction = shooter.mesh.forward; // This works if we oriented correctly. 

                for(let k=0; k<count; k++) {
                    const offset = (k === 0 ? -1 : 1) * (isFlagship ? 1.5 : 0.5);
                    
                    const sphere = BABYLON.MeshBuilder.CreateSphere("proj", {diameter: 0.5}, scene);
                    sphere.position = shooter.mesh.position.clone();
                    // Add slight offset to barrel
                    sphere.position.addInPlace(direction.scale(4)); 
                    sphere.position.x += offset;

                    const mat = new BABYLON.StandardMaterial("projMat", scene);
                    mat.emissiveColor = color;
                    mat.disableLighting = true;
                    sphere.material = mat;

                    // Trail
                    const trail = new BABYLON.ParticleSystem("trail", 100, scene);
                    trail.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                    trail.emitter = sphere;
                    trail.minSize = 0.2;
                    trail.maxSize = 0.5;
                    trail.color1 = color;
                    trail.color2 = new BABYLON.Color4(color.r, color.g, color.b, 0);
                    trail.minLifeTime = 0.2;
                    trail.maxLifeTime = 0.5;
                    trail.emitRate = 100;
                    trail.start();

                    projectiles.push({
                        mesh: sphere,
                        dir: direction.clone(),
                        team: shooter.team,
                        life: 150, // Frames
                        trail: trail
                    });
                }
            }

            // --- EXPLOSION LOGIC ---
            function createExplosion(position, scale) {
                // Core Fire
                const fire = new BABYLON.ParticleSystem("fire", 500, scene);
                fire.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                fire.emitter = position;
                fire.minEmitBox = new BABYLON.Vector3(-scale/2, -scale/2, -scale/2);
                fire.maxEmitBox = new BABYLON.Vector3(scale/2, scale/2, scale/2);
                fire.color1 = new BABYLON.Color4(1, 0.5, 0, 1.0);
                fire.color2 = new BABYLON.Color4(1, 0, 0, 1.0);
                fire.colorDead = new BABYLON.Color4(0, 0, 0, 0.0);
                fire.minSize = scale * 0.5;
                fire.maxSize = scale * 1.5;
                fire.minLifeTime = 0.5;
                fire.maxLifeTime = 1.5;
                fire.emitRate = 1000;
                fire.targetStopDuration = 0.2;
                fire.direction1 = new BABYLON.Vector3(-1, -1, -1);
                fire.direction2 = new BABYLON.Vector3(1, 1, 1);
                fire.gravity = new BABYLON.Vector3(0, 0, 0);
                fire.start();

                // Sparks
                const sparks = new BABYLON.ParticleSystem("sparks", 200, scene);
                sparks.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                sparks.emitter = position;
                sparks.color1 = new BABYLON.Color4(1, 1, 1, 1);
                sparks.color2 = new BABYLON.Color4(1, 0.8, 0, 1);
                sparks.minSize = 0.2;
                sparks.maxSize = 0.5;
                sparks.minLifeTime = 1.0;
                sparks.maxLifeTime = 2.0;
                sparks.emitRate = 500;
                sparks.targetStopDuration = 0.1;
                sparks.direction1 = new BABYLON.Vector3(-1, -1, -1);
                sparks.direction2 = new BABYLON.Vector3(1, 1, 1);
                sparks.minEmitPower = 5 * scale;
                sparks.maxEmitPower = 10 * scale;
                sparks.start();

                // Debris
                for(let i=0; i<8; i++) {
                    const debris = BABYLON.MeshBuilder.CreateBox("debris", {size: scale * 0.4}, scene);
                    debris.position = position.clone();
                    const vel = new BABYLON.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().scale(0.5);
                    
                    const debrisMat = new BABYLON.StandardMaterial("debris", scene);
                    debrisMat.emissiveColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                    debris.material = debrisMat;

                    const anim = new BABYLON.Animation("debrisAnim", "position", 60, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                    const keys = [
                        { frame: 0, value: position },
                        { frame: 60, value: position.add(vel.scale(20)) }
                    ];
                    anim.setKeys(keys);
                    debris.animations.push(anim);
                    
                    // Add rotation
                    const rotAnim = new BABYLON.Animation("rot", "rotation", 60, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                    rotAnim.setKeys([{frame:0, value: BABYLON.Vector3.Zero()}, {frame:60, value: new BABYLON.Vector3(Math.random(), Math.random(), Math.random())}]);
                    debris.animations.push(rotAnim);

                    scene.beginAnimation(debris, 0, 60, false, 1, () => {
                        debris.dispose();
                    });
                }
                
                // Shockwave Ring
                const shockwave = BABYLON.MeshBuilder.CreateTorus("shock", {diameter: 1, thickness: 0.2}, scene);
                shockwave.position = position;
                const shockMat = new BABYLON.StandardMaterial("shockMat", scene);
                shockMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
                shockMat.alpha = 0.8;
                shockwave.material = shockMat;

                const obs = shockwave.scaling.add(new BABYLON.Vector3(0.5, 0.5, 0.5));
                const animScale = new BABYLON.Animation("scaling", "scaling", 60, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                animScale.setKeys([{frame: 0, value: new BABYLON.Vector3(1,1,1)}, {frame: 30, value: new BABYLON.Vector3(10*scale, 10*scale, 10*scale)}]);
                
                const animAlpha = new BABYLON.Animation("alpha", "material.alpha", 60, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                animAlpha.setKeys([{frame: 0, value: 0.8}, {frame: 30, value: 0}]);

                shockwave.animations.push(animScale);
                shockwave.animations.push(animAlpha);
                scene.beginAnimation(shockwave, 0, 30, false, 1, () => {
                    shockwave.dispose();
                });
            }

            function killShip(ship) {
                // Explode
                createExplosion(ship.mesh.position, ship.type === "flagship" ? 4 : 2);
                
                // Chain reaction check
                ships.forEach(other => {
                    if (other !== ship && other.hp > 0) {
                        const dist = BABYLON.Vector3.Distance(ship.mesh.position, other.mesh.position);
                        if (dist < CHAIN_REACTION_RADIUS) {
                            // Delay slightly for visual effect
                            setTimeout(() => {
                                if(other.hp > 0) killShip(other);
                            }, 200);
                        }
                    }
                });

                // Remove mesh
                ship.mesh.dispose();
                ship.hp = 0;
            }

            // --- MAIN LOOP ---
            scene.registerBeforeRender(() => {
                
                // 1. Ship Movement & AI
                ships.forEach(ship => {
                    if (ship.hp <= 0) return;

                    // Find nearest enemy
                    let nearest = null;
                    let minDist = 10000;

                    ships.forEach(enemy => {
                        if (enemy.team !== ship.team && enemy.hp > 0) {
                            const d = BABYLON.Vector3.Distance(ship.mesh.position, enemy.mesh.position);
                            if (d < minDist) {
                                minDist = d;
                                nearest = enemy;
                            }
                        }
                    });

                    if (nearest) {
                        // Turn towards
                        const targetPos = nearest.mesh.position;
                        const currentPos = ship.mesh.position;
                        
                        // Calculate direction vector
                        const direction = targetPos.subtract(currentPos).normalize();
                        
                        // Calculate rotation
                        const axes = BABYLON.Vector3.Cross(BABYLON.Axis.Z, direction); // Assuming Z is forward for calc
                        // Actually simpler: LookAt
                        // We create a dummy target slightly ahead to smooth turning
                        const lookTarget = currentPos.add(direction.scale(10));
                        
                        // Smooth rotation (Lerp)
                        const targetRot = BABYLON.Quaternion.FromLookDirectionLH(direction, BABYLON.Axis.Y); // Standard Look
                        // Babylon LookAt updates position, we want rotation only. 
                        // Use lookAt with up vector
                        ship.mesh.lookAt(lookTarget);

                        // Move forward if far, slow down if close
                        if (minDist > 20) {
                            ship.mesh.position.addInPlace(direction.scale(SHIP_SPEED));
                        } else if (minDist < 10) {
                            ship.mesh.position.subtractInPlace(direction.scale(SHIP_SPEED * 0.5));
                        }
                    }

                    // Firing Logic
                    ship.cooldown--;
                    if (ship.cooldown <= 0 && nearest && minDist < 40) {
                        fireProjectile(ship);
                        ship.cooldown = ship.type === "flagship" ? FLAGSHIP_FIRE_RATE : FIRE_RATE;
                    }

                    // Update Health Bar
                    const pct = ship.hp / ship.maxHp;
                    ship.bar.scaling.x = Math.max(0, pct);
                    ship.bar.position.x = -(1 - pct) * (ship.type==="flagship"?3:1.5); // Shift left as it shrinks
                });

                // 2. Projectile Updates
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.life--;
                    
                    // Move
                    p.mesh.position.addInPlace(p.dir.scale(PROJ_SPEED));

                    // Collision
                    let hit = false;
                    for (let s = 0; s < ships.length; s++) {
                        const ship = ships[s];
                        if (ship.team !== p.team && ship.hp > 0) {
                            // Simple Sphere collision
                            if (BABYLON.Vector3.Distance(p.mesh.position, ship.mesh.position) < 1.5) {
                                hit = true;
                                ship.hp -= 25;
                                createExplosion(p.mesh.position, 1); // Small impact explosion
                                
                                if (ship.hp <= 0) {
                                    killShip(ship);
                                }
                                break;
                            }
                        }
                    }

                    if (hit || p.life <= 0) {
                        p.trail.stop();
                        p.mesh.dispose();
                        projectiles.splice(i, 1);
                    }
                }

                // Cleanup Dead Ships from array occasionally or just filter
                ships = ships.filter(s => s.hp > 0);
                
                // End Game Check (Optional)
                const blueAlive = ships.some(s => s.team === TEAM_BLUE);
                const redAlive = ships.some(s => s.team === TEAM_RED);
                if(!blueAlive || !redAlive) {
                    // Could add restart logic here
                }
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
