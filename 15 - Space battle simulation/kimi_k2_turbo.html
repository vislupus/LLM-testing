<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Space Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
        }
        
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #444;
        }
        
        #ui h2 {
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }
        
        .fleet-status {
            margin: 8px 0;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .blue-fleet {
            background: rgba(0, 100, 255, 0.3);
            border: 1px solid #0064ff;
        }
        
        .red-fleet {
            background: rgba(255, 50, 50, 0.3);
            border: 1px solid #ff3232;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #444;
        }
        
        #controls p {
            margin: 5px 0;
            opacity: 0.9;
        }
        
        #controls span {
            color: #ffd700;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui">
        <h2>⚔️ SPACE BATTLE</h2>
        <div class="fleet-status blue-fleet" id="blueStatus">🔵 Blue Fleet: 10 ships</div>
        <div class="fleet-status red-fleet" id="redStatus">🔴 Red Fleet: 10 ships</div>
    </div>
    <div id="controls">
        <p><span>🖱️ Left Drag:</span> Rotate Camera</p>
        <p><span>🖱️ Right Drag:</span> Pan</p>
        <p><span>🖱️ Scroll:</span> Zoom</p>
        <p><span>⌨️ Space:</span> Reset View</p>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        
        // Game state
        const gameState = {
            blueShips: [],
            redShips: [],
            projectiles: [],
            explosions: [],
            lastUpdate: Date.now()
        };
        
        const SHIP_HEALTH = 100;
        const FLAGSHIP_HEALTH = 300;
        const PROJECTILE_DAMAGE = 25;
        const EXPLOSION_RADIUS = 8;
        const CHAIN_REACTION_RADIUS = 6;
        
        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.02, 0.02, 0.05);
            
            // Fog for depth
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.002;
            scene.fogColor = new BABYLON.Color3(0.02, 0.02, 0.08);
            
            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 150, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 400;
            camera.wheelPrecision = 50;
            
            // Lighting
            const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.3;
            ambientLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.15);
            
            // Dynamic lights for explosions
            const explosionLight = new BABYLON.PointLight("explosionLight", new BABYLON.Vector3(0, 0, 0), scene);
            explosionLight.intensity = 0;
            explosionLight.diffuse = new BABYLON.Color3(1, 0.8, 0.5);
            explosionLight.range = 100;
            
            // Materials
            const matBlueShip = new BABYLON.StandardMaterial("blueShip", scene);
            matBlueShip.diffuseColor = new BABYLON.Color3(0.2, 0.4, 0.9);
            matBlueShip.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.3);
            matBlueShip.specularColor = new BABYLON.Color3(0.8, 0.8, 1);
            
            const matBlueFlagship = new BABYLON.StandardMaterial("blueFlagship", scene);
            matBlueFlagship.diffuseColor = new BABYLON.Color3(0.15, 0.35, 0.85);
            matBlueFlagship.emissiveColor = new BABYLON.Color3(0.1, 0.2, 0.4);
            matBlueFlagship.specularColor = new BABYLON.Color3(0.9, 0.9, 1);
            
            const matRedShip = new BABYLON.StandardMaterial("redShip", scene);
            matRedShip.diffuseColor = new BABYLON.Color3(0.9, 0.25, 0.2);
            matRedShip.emissiveColor = new BABYLON.Color3(0.3, 0.05, 0.05);
            matRedShip.specularColor = new BABYLON.Color3(1, 0.8, 0.8);
            
            const matRedFlagship = new BABYLON.StandardMaterial("redFlagship", scene);
            matRedFlagship.diffuseColor = new BABYLON.Color3(0.85, 0.2, 0.15);
            matRedFlagship.emissiveColor = new BABYLON.Color3(0.4, 0.1, 0.1);
            matRedFlagship.specularColor = new BABYLON.Color3(1, 0.85, 0.85);
            
            const matEngineBlue = new BABYLON.StandardMaterial("engineBlue", scene);
            matEngineBlue.emissiveColor = new BABYLON.Color3(0.3, 0.6, 1);
            matEngineBlue.disableLighting = true;
            
            const matEngineRed = new BABYLON.StandardMaterial("engineRed", scene);
            matEngineRed.emissiveColor = new BABYLON.Color3(1, 0.3, 0.2);
            matEngineRed.disableLighting = true;
            
            const matProjectileBlue = new BABYLON.StandardMaterial("projBlue", scene);
            matProjectileBlue.emissiveColor = new BABYLON.Color3(0.4, 0.7, 1);
            matProjectileBlue.disableLighting = true;
            
            const matProjectileRed = new BABYLON.StandardMaterial("projRed", scene);
            matProjectileRed.emissiveColor = new BABYLON.Color3(1, 0.4, 0.3);
            matProjectileRed.disableLighting = true;
            
            // GUI for health bars
            const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");
            
            // === STARFIELD BACKGROUND ===
            function createStarfield() {
                const starCount = 3000;
                const stars = new BABYLON.PointsCloudSystem("stars", 2, scene);
                
                const positions = [];
                const colors = [];
                
                for (let i = 0; i < starCount; i++) {
                    positions.push(
                        (Math.random() - 0.5) * 800,
                        (Math.random() - 0.5) * 800,
                        (Math.random() - 0.5) * 800
                    );
                    
                    const brightness = 0.5 + Math.random() * 0.5;
                    colors.push(brightness, brightness, brightness, 1);
                }
                
                stars.addPoints(starCount, (particle, i) => {
                    particle.position.x = positions[i * 3];
                    particle.position.y = positions[i * 3 + 1];
                    particle.position.z = positions[i * 3 + 2];
                    particle.color = new BABYLON.Color4(colors[i * 4], colors[i * 4 + 1], colors[i * 4 + 2], colors[i * 4 + 3]);
                });
                
                stars.buildMeshAsync();
            }
            createStarfield();
            
            // === NEBULA EFFECT ===
            function createNebula() {
                const nebulaCount = 5;
                for (let i = 0; i < nebulaCount; i++) {
                    const nebula = BABYLON.MeshBuilder.CreateSphere("nebula" + i, { diameter: 100 + Math.random() * 50 }, scene);
                    nebula.position = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 400,
                        (Math.random() - 0.5) * 200,
                        (Math.random() - 0.5) * 400
                    );
                    
                    const matNebula = new BABYLON.StandardMaterial("nebula" + i, scene);
                    const hue = Math.random();
                    if (hue < 0.33) {
                        matNebula.diffuseColor = new BABYLON.Color3(0.3, 0.1, 0.5);
                        matNebula.emissiveColor = new BABYLON.Color3(0.1, 0.05, 0.2);
                    } else if (hue < 0.66) {
                        matNebula.diffuseColor = new BABYLON.Color3(0.1, 0.3, 0.5);
                        matNebula.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.2);
                    } else {
                        matNebula.diffuseColor = new BABYLON.Color3(0.4, 0.2, 0.3);
                        matNebula.emissiveColor = new BABYLON.Color3(0.15, 0.05, 0.1);
                    }
                    matNebula.alpha = 0.15;
                    matNebula.backFaceCulling = false;
                    nebula.material = matNebula;
                }
            }
            createNebula();
            
            // === SHIP CREATION ===
            function createShip(isBlue, isFlagship, position) {
                const shipGroup = new BABYLON.TransformNode("ship", scene);
                
                const scale = isFlagship ? 2.5 : 1;
                const health = isFlagship ? FLAGSHIP_HEALTH : SHIP_HEALTH;
                
                // Main hull
                const hull = BABYLON.MeshBuilder.CreateBox("hull", {
                    width: 1.5 * scale,
                    height: 0.6 * scale,
                    depth: 3 * scale
                }, scene);
                hull.parent = shipGroup;
                hull.material = isBlue ? (isFlagship ? matBlueFlagship : matBlueShip) : (isFlagship ? matRedFlagship : matRedShip);
                
                // Wings
                const wingGeo = isFlagship ? 
                    { width: 5 * scale, height: 0.3 * scale, depth: 2 * scale } :
                    { width: 3 * scale, height: 0.2 * scale, depth: 1.5 * scale };
                
                const leftWing = BABYLON.MeshBuilder.CreateBox("leftWing", wingGeo, scene);
                leftWing.position.x = -wingGeo.width / 2 - 0.3 * scale;
                leftWing.position.z = -0.3 * scale;
                leftWing.parent = shipGroup;
                leftWing.material = hull.material;
                
                const rightWing = BABYLON.MeshBuilder.CreateBox("rightWing", wingGeo, scene);
                rightWing.position.x = wingGeo.width / 2 + 0.3 * scale;
                rightWing.position.z = -0.3 * scale;
                rightWing.parent = shipGroup;
                rightWing.material = hull.material;
                
                // Engine glows
                const engineCount = isFlagship ? 4 : 2;
                for (let i = 0; i < engineCount; i++) {
                    const engine = BABYLON.MeshBuilder.CreateSphere("engine" + i, { diameter: 0.4 * scale }, scene);
                    const offset = isFlagship ? 
                        (i < 2 ? -1.5 + i * 3 : -1.5 + (i - 2) * 3) :
                        (i === 0 ? -0.5 : 0.5);
                    engine.position.x = offset * scale;
                    engine.position.z = -1.8 * scale;
                    engine.parent = shipGroup;
                    engine.material = isBlue ? matEngineBlue : matEngineRed;
                    
                    // Engine trail particle system
                    const trail = new BABYLON.ParticleSystem("trail" + i, 100, scene);
                    trail.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                    trail.emitter = engine;
                    trail.minEmitBox = new BABYLON.Vector3(-0.1, -0.1, -0.2);
                    trail.maxEmitBox = new BABYLON.Vector3(0.1, 0.1, -0.2);
                    trail.color1 = isBlue ? new BABYLON.Color4(0.3, 0.6, 1, 0.8) : new BABYLON.Color4(1, 0.3, 0.2, 0.8);
                    trail.color2 = isBlue ? new BABYLON.Color4(0.1, 0.3, 0.8, 0.3) : new BABYLON.Color4(0.8, 0.2, 0.1, 0.3);
                    trail.minSize = 0.1 * scale;
                    trail.maxSize = 0.4 * scale;
                    trail.minLifeTime = 0.3;
                    trail.maxLifeTime = 0.8;
                    trail.emitRate = 30;
                    trail.minEmitPower = 2;
                    trail.maxEmitPower = 5;
                    trail.direction1 = new BABYLON.Vector3(0, 0, -1);
                    trail.direction2 = new BABYLON.Vector3(0, 0, -1);
                    trail.start();
                }
                
                // Cockpit
                const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", { diameter: 0.8 * scale }, scene);
                cockpit.position.z = 1 * scale;
                cockpit.position.y = 0.3 * scale;
                cockpit.scaling.z = 1.5;
                cockpit.parent = shipGroup;
                const matCockpit = new BABYLON.StandardMaterial("cockpit", scene);
                matCockpit.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.15);
                matCockpit.specularColor = new BABYLON.Color3(0.9, 0.9, 1);
                matCockpit.alpha = 0.7;
                cockpit.material = matCockpit;
                
                // Details for flagship
                if (isFlagship) {
                    // Extra armor plates
                    for (let i = 0; i < 4; i++) {
                        const plate = BABYLON.MeshBuilder.CreateBox("plate" + i, { width: 0.3, height: 0.1, depth: 1 }, scene);
                        plate.position.x = (i < 2 ? -1.8 : 1.8);
                        plate.position.z = (i % 2 === 0 ? 0.5 : -0.5);
                        plate.position.y = 0.35;
                        plate.parent = shipGroup;
                        plate.material = hull.material;
                    }
                    
                    // Command tower
                    const tower = BABYLON.MeshBuilder.CreateBox("tower", { width: 0.8, height: 0.8, depth: 1.2 }, scene);
                    tower.position.y = 0.6;
                    tower.position.z = 0.5;
                    tower.parent = shipGroup;
                    tower.material = hull.material;
                    
                    // Antenna
                    const antenna = BABYLON.MeshBuilder.CreateCylinder("antenna", { diameter: 0.05, height: 1.5 }, scene);
                    antenna.position.y = 1.2;
                    antenna.position.z = 0.5;
                    antenna.parent = shipGroup;
                    antenna.material = matCockpit;
                }
                
                shipGroup.position = position;
                
                // Health bar GUI
                const healthBarContainer = new BABYLON.GUI.Rectangle();
                healthBarContainer.width = isFlagship ? "80px" : "50px";
                healthBarContainer.height = "8px";
                healthBarContainer.thickness = 1;
                healthBarContainer.color = "#444";
                healthBarContainer.background = "#222";
                advancedTexture.addControl(healthBarContainer);
                healthBarContainer.linkWithMesh(hull);
                healthBarContainer.linkOffsetY = isFlagship ? -60 : -35;
                
                const healthBar = new BABYLON.GUI.Rectangle();
                healthBar.width = "100%";
                healthBar.height = "100%";
                healthBar.background = isBlue ? "#0064ff" : "#ff3232";
                healthBar.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                healthBarContainer.addControl(healthBar);
                
                // Ship data
                const shipData = {
                    mesh: shipGroup,
                    hull: hull,
                    isBlue: isBlue,
                    isFlagship: isFlagship,
                    health: health,
                    maxHealth: health,
                    healthBar: healthBar,
                    healthContainer: healthBarContainer,
                    velocity: new BABYLON.Vector3(0, 0, 0),
                    target: null,
                    lastFireTime: Date.now() + Math.random() * 2000,
                    destroyed: false,
                    id: Math.random().toString(36).substr(2, 9)
                };
                
                // Add to appropriate fleet
                if (isBlue) {
                    gameState.blueShips.push(shipData);
                } else {
                    gameState.redShips.push(shipData);
                }
                
                return shipData;
            }
            
            // Create fleets
            function createFleets() {
                // Blue fleet (left side)
                createShip(true, true, new BABYLON.Vector3(-60, 0, 0)); // Flagship
                
                for (let i = 0; i < 9; i++) {
                    const angle = (i / 9) * Math.PI * 2;
                    const radius = 25 + Math.random() * 10;
                    const y = (Math.random() - 0.5) * 20;
                    createShip(true, false, new BABYLON.Vector3(
                        -60 + Math.cos(angle) * radius,
                        y,
                        Math.sin(angle) * radius
                    ));
                }
                
                // Red fleet (right side)
                createShip(false, true, new BABYLON.Vector3(60, 0, 0)); // Flagship
                
                for (let i = 0; i < 9; i++) {
                    const angle = (i / 9) * Math.PI * 2;
                    const radius = 25 + Math.random() * 10;
                    const y = (Math.random() - 0.5) * 20;
                    createShip(false, false, new BABYLON.Vector3(
                        60 + Math.cos(angle) * radius,
                        y,
                        Math.sin(angle) * radius
                    ));
                }
            }
            createFleets();
            
            // === PROJECTILE SYSTEM ===
            function fireProjectile(ship) {
                const projScale = ship.isFlagship ? 0.4 : 0.25;
                const projectile = BABYLON.MeshBuilder.CreateSphere("proj", { diameter: projScale }, scene);
                
                // Position at front of ship
                const forward = ship.mesh.forward;
                projectile.position = ship.mesh.position.add(forward.scale(ship.isFlagship ? 4 : 2));
                
                const material = ship.isBlue ? matProjectileBlue : matProjectileRed;
                projectile.material = material;
                
                // Trail effect
                const trail = new BABYLON.ParticleSystem("projTrail", 50, scene);
                trail.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                trail.emitter = projectile;
                trail.minEmitBox = new BABYLON.Vector3(-0.05, -0.05, -0.1);
                trail.maxEmitBox = new BABYLON.Vector3(0.05, 0.05, 0.1);
                trail.color1 = ship.isBlue ? new BABYLON.Color4(0.3, 0.7, 1, 0.9) : new BABYLON.Color4(1, 0.4, 0.3, 0.9);
                trail.color2 = ship.isBlue ? new BABYLON.Color4(0.1, 0.4, 0.8, 0.4) : new BABYLON.Color4(0.8, 0.3, 0.2, 0.4);
                trail.minSize = 0.1;
                trail.maxSize = 0.3;
                trail.minLifeTime = 0.2;
                trail.maxLifeTime = 0.5;
                trail.emitRate = 60;
                trail.start();
                
                // Find target
                const enemyFleet = ship.isBlue ? gameState.redShips : gameState.blueShips;
                let target = null;
                let minDist = Infinity;
                
                enemyFleet.forEach(enemy => {
                    if (!enemy.destroyed) {
                        const dist = BABYLON.Vector3.Distance(ship.mesh.position, enemy.mesh.position);
                        if (dist < minDist) {
                            minDist = dist;
                            target = enemy;
                        }
                    }
                });
                
                const projData = {
                    mesh: projectile,
                    trail: trail,
                    velocity: forward.scale(2),
                    damage: PROJECTILE_DAMAGE,
                    isBlue: ship.isBlue,
                    life: 200,
                    target: target
                };
                
                gameState.projectiles.push(projData);
                
                // Flagship fires double
                if (ship.isFlagship) {
                    const proj2 = projectile.clone("proj2");
                    proj2.position.x += 0.5;
                    const trail2 = trail.clone();
                    trail2.emitter = proj2;
                    trail2.start();
                    
                    gameState.projectiles.push({
                        mesh: proj2,
                        trail: trail2,
                        velocity: forward.scale(2),
                        damage: PROJECTILE_DAMAGE,
                        isBlue: ship.isBlue,
                        life: 200,
                        target: target
                    });
                }
            }
            
            // === EXPLOSION SYSTEM ===
            function createExplosion(position, radius, isChainReaction = false) {
                // Flash light
                explosionLight.position = position.clone();
                explosionLight.intensity = 2;
                setTimeout(() => { explosionLight.intensity = 0; }, 200);
                
                // Shockwave
                const shockwave = BABYLON.MeshBuilder.CreateSphere("shockwave", { diameter: 1 }, scene);
                shockwave.position = position.clone();
                const matShock = new BABYLON.StandardMaterial("shock", scene);
                matShock.emissiveColor = new BABYLON.Color3(1, 0.8, 0.4);
                matShock.alpha = 0.6;
                matShock.wireframe = true;
                shockwave.material = matShock;
                
                // Animate shockwave
                const shockAnim = new BABYLON.Animation("shockAnim", "scaling", 60, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                const shockKeys = [
                    { frame: 0, value: new BABYLON.Vector3(1, 1, 1) },
                    { frame: 30, value: new BABYLON.Vector3(radius * 2, radius * 2, radius * 2) }
                ];
                shockAnim.setKeys(shockKeys);
                shockwave.animations.push(shockAnim);
                scene.beginAnimation(shockwave, 0, 30, false, 1, () => shockwave.dispose());
                
                // Fade out
                const fadeAnim = new BABYLON.Animation("fadeAnim", "material.alpha", 60, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                const fadeKeys = [
                    { frame: 0, value: 0.6 },
                    { frame: 30, value: 0 }
                ];
                fadeAnim.setKeys(fadeKeys);
                shockwave.animations.push(fadeAnim);
                scene.beginAnimation(shockwave, 0, 30, false);
                
                // Fire explosion particles
                const fire = new BABYLON.ParticleSystem("fire", 200, scene);
                fire.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                fire.emitter = position;
                fire.minEmitBox = new BABYLON.Vector3(-1, -1, -1);
                fire.maxEmitBox = new BABYLON.Vector3(1, 1, 1);
                fire.color1 = new BABYLON.Color4(1, 0.9, 0.3, 1);
                fire.color2 = new BABYLON.Color4(1, 0.4, 0.1, 0.8);
                fire.colorDead = new BABYLON.Color4(0.5, 0.1, 0, 0);
                fire.minSize = 0.5;
                fire.maxSize = 2;
                fire.minLifeTime = 0.5;
                fire.maxLifeTime = 1.5;
                fire.emitRate = isChainReaction ? 100 : 300;
                fire.minEmitPower = 5;
                fire.maxEmitPower = 15;
                fire.direction1 = new BABYLON.Vector3(-1, -1, -1);
                fire.direction2 = new BABYLON.Vector3(1, 1, 1);
                fire.gravity = new BABYLON.Vector3(0, 0, 0);
                fire.start();
                
                // Sparks
                const sparks = new BABYLON.ParticleSystem("sparks", 150, scene);
                sparks.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                sparks.emitter = position;
                sparks.minEmitBox = new BABYLON.Vector3(-0.5, -0.5, -0.5);
                sparks.maxEmitBox = new BABYLON.Vector3(0.5, 0.5, 0.5);
                sparks.color1 = new BABYLON.Color4(1, 1, 0.8, 1);
                sparks.color2 = new BABYLON.Color4(1, 0.8, 0.4, 0.8);
                sparks.colorDead = new BABYLON.Color4(0.8, 0.4, 0, 0);
                sparks.minSize = 0.1;
                sparks.maxSize = 0.4;
                sparks.minLifeTime = 0.3;
                sparks.maxLifeTime = 1;
                sparks.emitRate = 200;
                sparks.minEmitPower = 8;
                sparks.maxEmitPower = 20;
                sparks.direction1 = new BABYLON.Vector3(-1, -1, -1);
                sparks.direction2 = new BABYLON.Vector3(1, 1, 1);
                sparks.start();
                
                // Debris
                for (let i = 0; i < 20; i++) {
                    const debris = BABYLON.MeshBuilder.CreateBox("debris" + i, { size: 0.3 + Math.random() * 0.4 }, scene);
                    debris.position = position.clone();
                    debris.position.x += (Math.random() - 0.5) * 3;
                    debris.position.y += (Math.random() - 0.5) * 3;
                    debris.position.z += (Math.random() - 0.5) * 3;
                    
                    const matDebris = new BABYLON.StandardMaterial("debris", scene);
                    matDebris.diffuseColor = new BABYLON.Color3(0.4 + Math.random() * 0.3, 0.3 + Math.random() * 0.2, 0.2);
                    debris.material = matDebris;
                    
                    // Physics-like movement
                    const velocity = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10
                    );
                    
                    let life = 60 + Math.random() * 60;
                    scene.registerBeforeRender(() => {
                        if (life > 0 && debris.isDisposed() === false) {
                            debris.position.addInPlace(velocity.scale(0.016));
                            debris.rotation.x += velocity.x * 0.01;
                            debris.rotation.y += velocity.y * 0.01;
                            debris.rotation.z += velocity.z * 0.01;
                            life--;
                            if (life <= 0) debris.dispose();
                        }
                    });
                }
                
                // Stop particles after burst
                setTimeout(() => {
                    fire.stop();
                    sparks.stop();
                }, isChainReaction ? 300 : 500);
                
                setTimeout(() => {
                    fire.dispose();
                    sparks.dispose();
                }, 3000);
                
                // Chain reaction check
                const allShips = [...gameState.blueShips, ...gameState.redShips];
                allShips.forEach(ship => {
                    if (!ship.destroyed) {
                        const dist = BABYLON.Vector3.Distance(position, ship.mesh.position);
                        if (dist < CHAIN_REACTION_RADIUS && dist > 0.1) {
                            // Damage and potentially trigger chain reaction
                            damageShip(ship, PROJECTILE_DAMAGE * 2, true);
                        }
                    }
                });
            }
            
            // === DAMAGE SYSTEM ===
            function damageShip(ship, damage, isChainReaction = false) {
                if (ship.destroyed) return;
                
                ship.health -= damage;
                const healthPercent = Math.max(0, ship.health / ship.maxHealth * 100);
                ship.healthBar.width = healthPercent + "%";
                
                // Flash damage
                const originalColor = ship.hull.material.emissiveColor.clone();
                ship.hull.material.emissiveColor = new BABYLON.Color3(1, 1, 1);
                setTimeout(() => {
                    if (!ship.destroyed) ship.hull.material.emissiveColor = originalColor;
                }, 100);
                
                if (ship.health <= 0) {
                    destroyShip(ship, isChainReaction);
                }
            }
            
            function destroyShip(ship, isChainReaction = false) {
                if (ship.destroyed) return;
                ship.destroyed = true;
                
                // Hide health bar
                ship.healthContainer.isVisible = false;
                
                // Create explosion
                const explosionRadius = ship.isFlagship ? 15 : 8;
                createExplosion(ship.mesh.position, explosionRadius, isChainReaction);
                
                // Remove ship
                ship.mesh.dispose();
                
                // Update UI
                updateUI();
            }
            
            function updateUI() {
                const blueAlive = gameState.blueShips.filter(s => !s.destroyed).length;
                const redAlive = gameState.redShips.filter(s => !s.destroyed).length;
                
                document.getElementById("blueStatus").textContent = `🔵 Blue Fleet: ${blueAlive} ships`;
                document.getElementById("redStatus").textContent = `🔴 Red Fleet: ${redAlive} ships`;
            }
            
            // === GAME LOOP ===
            scene.registerBeforeRender(() => {
                const deltaTime = engine.getDeltaTime() / 1000;
                const now = Date.now();
                
                // Update ships
                const allShips = [...gameState.blueShips, ...gameState.redShips];
                
                allShips.forEach(ship => {
                    if (ship.destroyed) return;
                    
                    // Find nearest enemy
                    const enemyFleet = ship.isBlue ? gameState.redShips : gameState.blueShips;
                    let nearestEnemy = null;
                    let minDist = Infinity;
                    
                    enemyFleet.forEach(enemy => {
                        if (!enemy.destroyed) {
                            const dist = BABYLON.Vector3.Distance(ship.mesh.position, enemy.mesh.position);
                            if (dist < minDist) {
                                minDist = dist;
                                nearestEnemy = enemy;
                            }
                        }
                    });
                    
                    if (nearestEnemy) {
                        // Calculate direction to enemy
                        const direction = nearestEnemy.mesh.position.subtract(ship.mesh.position).normalize();
                        
                        // Smooth rotation towards target
                        const targetRotation = Math.atan2(direction.x, direction.z);
                        const currentRotation = ship.mesh.rotation.y;
                        let rotationDiff = targetRotation - currentRotation;
                        
                        // Normalize angle
                        while (rotationDiff > Math.PI) rotationDiff -= Math.PI * 2;
                        while (rotationDiff < -Math.PI) rotationDiff += Math.PI * 2;
                        
                        ship.mesh.rotation.y += rotationDiff * deltaTime * 2;
                        ship.mesh.rotation.x = Math.sin(now * 0.001 + ship.id) * 0.1;
                        ship.mesh.rotation.z = Math.cos(now * 0.001 + ship.id) * 0.05;
                        
                        // Movement - approach but keep distance
                        const idealDistance = ship.isFlagship ? 35 : 25;
                        const speed = ship.isFlagship ? 8 : 12;
                        
                        if (minDist > idealDistance) {
                            ship.velocity = direction.scale(speed * deltaTime);
                        } else if (minDist < idealDistance - 10) {
                            ship.velocity = direction.scale(-speed * 0.5 * deltaTime);
                        } else {
                            // Strafing movement
                            ship.velocity = new BABYLON.Vector3(
                                Math.sin(now * 0.001 + ship.id) * speed * 0.3 * deltaTime,
                                Math.cos(now * 0.002 + ship.id) * speed * 0.2 * deltaTime,
                                0
                            );
                            // Transform to local space
                            ship.velocity = BABYLON.Vector3.TransformNormal(ship.velocity, BABYLON.Matrix.RotationY(ship.mesh.rotation.y));
                        }
                        
                        ship.mesh.position.addInPlace(ship.velocity);
                        
                        // Keep within bounds
                        ship.mesh.position.x = Math.max(-100, Math.min(100, ship.mesh.position.x));
                        ship.mesh.position.y = Math.max(-50, Math.min(50, ship.mesh.position.y));
                        ship.mesh.position.z = Math.max(-100, Math.min(100, ship.mesh.position.z));
                        
                        // Firing
                        if (now - ship.lastFireTime > 3000 && minDist < 80) {
                            fireProjectile(ship);
                            ship.lastFireTime = now;
                        }
                    }
                });
                
                // Update projectiles
                for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                    const proj = gameState.projectiles[i];
                    proj.life--;
                    
                    // Homing behavior
                    if (proj.target && !proj.target.destroyed) {
                        const toTarget = proj.target.mesh.position.subtract(proj.mesh.position).normalize();
                        proj.velocity = BABYLON.Vector3.Lerp(proj.velocity, toTarget.scale(3), 0.05);
                    }
                    
                    proj.mesh.position.addInPlace(proj.velocity);
                    
                    // Check collisions
                    const enemyFleet = proj.isBlue ? gameState.redShips : gameState.blueShips;
                    let hit = false;
                    
                    for (const enemy of enemyFleet) {
                        if (!enemy.destroyed) {
                            const dist = BABYLON.Vector3.Distance(proj.mesh.position, enemy.mesh.position);
                            const hitRadius = enemy.isFlagship ? 4 : 2;
                            
                            if (dist < hitRadius) {
                                damageShip(enemy, proj.damage);
                                hit = true;
                                break;
                            }
                        }
                    }
                    
                    if (hit || proj.life <= 0) {
                        // Small impact explosion
                        if (hit) {
                            const impact = new BABYLON.ParticleSystem("impact", 30, scene);
                            impact.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                            impact.emitter = proj.mesh.position;
                            impact.minEmitBox = new BABYLON.Vector3(-0.2, -0.2, -0.2);
                            impact.maxEmitBox = new BABYLON.Vector3(0.2, 0.2, 0.2);
                            impact.color1 = proj.isBlue ? new BABYLON.Color4(0.3, 0.7, 1, 1) : new BABYLON.Color4(1, 0.4, 0.3, 1);
                            impact.color2 = new BABYLON.Color4(1, 1, 1, 0.5);
                            impact.minSize = 0.2;
                            impact.maxSize = 0.6;
                            impact.minLifeTime = 0.2;
                            impact.maxLifeTime = 0.5;
                            impact.emitRate = 100;
                            impact.start();
                            setTimeout(() => impact.stop(), 100);
                            setTimeout(() => impact.dispose(), 1000);
                        }
                        
                        proj.trail.stop();
                        proj.mesh.dispose();
                        gameState.projectiles.splice(i, 1);
                    }
                }
                
                // Camera follow battle center
                let centerX = 0, centerY = 0, centerZ = 0;
                let aliveCount = 0;
                allShips.forEach(ship => {
                    if (!ship.destroyed) {
                        centerX += ship.mesh.position.x;
                        centerY += ship.mesh.position.y;
                        centerZ += ship.mesh.position.z;
                        aliveCount++;
                    }
                });
                
                if (aliveCount > 0) {
                    camera.target = BABYLON.Vector3.Lerp(camera.target, new BABYLON.Vector3(
                        centerX / aliveCount,
                        centerY / aliveCount,
                        centerZ / aliveCount
                    ), 0.02);
                }
            });
            
            // Reset camera on space
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    camera.alpha = -Math.PI / 2;
                    camera.beta = Math.PI / 2.5;
                    camera.radius = 150;
                    camera.target = BABYLON.Vector3.Zero();
                }
            });
            
            return scene;
        };
        
        const scene = createScene();
        
        engine.runRenderLoop(function () {
            scene.render();
        });
        
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
