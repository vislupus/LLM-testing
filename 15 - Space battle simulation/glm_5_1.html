<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Space Battle - Babylon.js</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #fff; }
        .stats { font-size: 18px; }
        .blue-text { color: #4dc9f6; }
        .red-text { color: #f67019; }
    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>
    <div id="ui">
        <h1>Fleet Engagement</h1>
        <div class="stats">
            <span class="blue-text">Blue Fleet: <span id="blueCount">10</span></span> | 
            <span class="red-text">Red Fleet: <span id="redCount">10</span></span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        
        // Global Arrays & State
        const ships = [];
        const projectiles = [];
        const explosionFX = [];
        let blueTeamAlive = 10;
        let redTeamAlive = 10;

        const createScene = function() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.02, 1); // Deep space

            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 180, new BABYLON.Vector3(0, 10, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 400;
            camera.wheelPrecision = 5;
            camera.panningSensibility = 50;

            // Lights
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.3;
            hemiLight.diffuse = new BABYLON.Color3(0.8, 0.8, 1.0);

            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, 1), scene);
            dirLight.position = new BABYLON.Vector3(100, 200, -100);
            dirLight.intensity = 0.8;

            // Glow Layer for engines and lasers
            const gl = new BABYLON.GlowLayer("glow", scene);
            gl.intensity = 0.8;

            // GUI for Health Bars
            const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

            // --- STARFIELD ---
            const starMat = new BABYLON.StandardMaterial("starMat", scene);
            starMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
            starMat.disableLighting = true;
            // Create a large skybox sphere or SPS for stars
            const starSPS = new BABYLON.SolidParticleSystem("stars", scene);
            const starModel = BABYLON.MeshBuilder.CreateSphere("s", { diameter: 0.5, segments: 4 }, scene);
            starSPS.addShape(starModel, 2000);
            starModel.dispose();
            const starMesh = starSPS.buildMesh();
            starMesh.material = starMat;
            starSPS.initParticles = function() {
                for (let p = 0; p < this.nbParticles; p++) {
                    const particle = this.particles[p];
                    particle.position.x = (Math.random() - 0.5) * 800;
                    particle.position.y = (Math.random() - 0.5) * 800;
                    particle.position.z = (Math.random() - 0.5) * 800;
                    const scale = Math.random() * 1.5 + 0.5;
                    particle.scaling = new BABYLON.Vector3(scale, scale, scale);
                }
            };
            starSPS.initParticles();
            starSPS.setParticles();
            starSPS.isAlwaysVisible = true;

            // --- SHIP CREATION FUNCTIONS ---
            function createShipMesh(type, team) {
                const root = new BABYLON.TransformNode("ship_root", scene);
                const hullMat = new BABYLON.StandardMaterial("hullMat_" + team + type, scene);
                const engineMat = new BABYLON.StandardMaterial("engMat_" + team + type, scene);
                
                let primaryColor, projectileColor;
                if (team === 'blue') {
                    primaryColor = new BABYLON.Color3(0.2, 0.5, 1.0);
                    projectileColor = new BABYLON.Color3(0.4, 0.8, 1.0);
                } else {
                    primaryColor = new BABYLON.Color3(1.0, 0.3, 0.1);
                    projectileColor = new BABYLON.Color3(1.0, 0.5, 0.2);
                }

                hullMat.diffuseColor = primaryColor;
                hullMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                engineMat.emissiveColor = primaryColor;
                engineMat.diffuseColor = primaryColor;

                let sizeMultiplier = type === 'flagship' ? 2.5 : 1;

                // Hull
                const hull = BABYLON.MeshBuilder.CreateBox("hull", {
                    width: 2 * sizeMultiplier,
                    height: 0.8 * sizeMultiplier,
                    depth: 5 * sizeMultiplier
                }, scene);
                hull.material = hullMat;
                hull.parent = root;

                // Cockpit/Nose
                const nose = BABYLON.MeshBuilder.CreateCylinder("nose", {
                    diameterTop: 0,
                    diameterBottom: 1.5 * sizeMultiplier,
                    height: 3 * sizeMultiplier,
                    tessellation: 4
                }, scene);
                nose.material = hullMat;
                nose.parent = root;
                nose.rotation.x = Math.PI / 2;
                nose.position.z = 3.5 * sizeMultiplier;
                nose.rotation.y = Math.PI / 4; // Align edges

                // Wings (Escort) or Engine Pods (Flagship)
                if (type === 'escort') {
                    const wingL = BABYLON.MeshBuilder.CreateBox("wingL", {width: 3, height: 0.1, depth: 2}, scene);
                    wingL.material = hullMat; wingL.parent = root; wingL.position.x = 2; wingL.position.z = -1;
                    const wingR = wingL.clone("wingR"); wingR.position.x = -2;
                } else {
                    // Flagship details - Bridge and Pods
                    const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {width: 1, height: 1.2, depth: 2}, scene);
                    bridge.material = hullMat; bridge.parent = root; bridge.position.y = 1; bridge.position.z = -1;
                    
                    const podL = BABYLON.MeshBuilder.CreateCylinder("podL", {diameter: 1, height: 5, tessellation: 6}, scene);
                    podL.material = hullMat; podL.parent = root; podL.position.x = 3; podL.rotation.x = Math.PI / 2;
                    const podR = podL.clone("podR"); podR.position.x = -3;
                }

                // Engines (Rear)
                const engine1 = BABYLON.MeshBuilder.CreateSphere("eng1", {diameter: 0.8 * sizeMultiplier, segments: 8}, scene);
                engine1.material = engineMat; engine1.parent = root; engine1.position.z = -2.5 * sizeMultiplier;
                if (type === 'flagship') {
                    engine1.position.x = 3;
                    const engine2 = engine1.clone("eng2"); engine2.position.x = -3;
                    const engine3 = engine1.clone("eng3"); engine3.position.x = 0;
                }

                // Health Bar UI
                const healthBarBg = new BABYLON.GUI.Rectangle("hbg");
                healthBarBg.width = "60px"; healthBarBg.height = "6px";
                healthBarBg.color = "transparent";
                healthBarBg.background = "black";
                healthBarBg.thickness = 0;
                advancedTexture.addControl(healthBarBg);

                const healthBar = new BABYLON.GUI.Rectangle("hb");
                healthBar.width = 1; // Percentage based
                healthBar.height = "6px";
                healthBar.color = "transparent";
                healthBar.background = team === 'blue' ? "#4dc9f6" : "#f67019";
                healthBar.thickness = 0;
                healthBarBg.addControl(healthBar);

                healthBarBg.linkWithMesh(root);
                healthBarBg.linkOffsetY = - (5 * sizeMultiplier);

                return { root, healthBar, healthBarBg, projectileColor };
            }

            // --- SPAWN FLEETS ---
            function spawnFleet(team, baseZ) {
                const isBlue = team === 'blue';
                const flagshipPos = new BABYLON.Vector3(0, 0, baseZ);
                
                // Spawn Flagship
                spawnShip('flagship', team, flagshipPos);
                
                // Spawn Escorts in V-formation
                for(let i = 0; i < 9; i++) {
                    const row = Math.floor(i / 2) + 1;
                    const side = i % 2 === 0 ? 1 : -1;
                    const xOff = side * (row * 6);
                    const zOff = isBlue ? baseZ - (row * 8) : baseZ + (row * 8);
                    const yOff = (Math.random() - 0.5) * 5;
                    spawnShip('escort', team, new BABYLON.Vector3(xOff, yOff, zOff));
                }
            }

            function spawnShip(type, team, position) {
                const meshData = createShipMesh(type, team);
                meshData.root.position = position.clone();
                
                // Face the enemy (Blue faces +Z, Red faces -Z)
                if (team === 'blue') meshData.root.rotation.y = 0;
                else meshData.root.rotation.y = Math.PI;

                const maxHp = type === 'flagship' ? 200 : 100;
                const blastRadius = type === 'flagship' ? 15 : 8;
                const speed = type === 'flagship' ? 0.08 : 0.15;

                ships.push({
                    mesh: meshData.root,
                    healthBar: meshData.healthBar,
                    team: team,
                    type: type,
                    hp: maxHp,
                    maxHp: maxHp,
                    blastRadius: blastRadius,
                    speed: speed,
                    projectileColor: meshData.projectileColor,
                    isDead: false,
                    fireTimer: Math.random() * 60, // Stagger initial fire
                    target: null
                });
            }

            spawnFleet('blue', -60);
            spawnFleet('red', 60);

            // --- COMBAT LOGIC ---
            const projectileBase = BABYLON.MeshBuilder.CreateSphere("projBase", {diameter: 0.5, segments: 6}, scene);
            projectileBase.isVisible = false;

            function fireProjectile(ship) {
                if (!ship.target || ship.target.isDead) return;

                const projMat = new BABYLON.StandardMaterial("projMat_" + Math.random(), scene);
                projMat.emissiveColor = ship.projectileColor;
                projMat.disableLighting = true;

                const offsets = ship.type === 'flagship' ? [-1.5, 1.5] : [0];

                offsets.forEach(offset => {
                    const projMesh = projectileBase.clone("proj");
                    projMesh.material = projMat;
                    projMesh.isVisible = true;
                    projMesh.position = ship.mesh.position.clone();
                    
                    // Add local offset for double shot
                    const localOffset = new BABYLON.Vector3(offset, 0, 0);
                    localOffset.x = localOffset.x * (ship.type === 'flagship' ? 2.5 : 1); // Scale offset for flag
                    const worldOffset = localOffset.rotateByQuaternionToLocal(ship.mesh.rotationQuaternion || BABYLON.Quaternion.Identity());
                    projMesh.position.addInPlace(worldOffset);

                    // Trail
                    const trail = new BABYLON.TrailMesh("trail", projMesh, scene, 0.3, 10, true);
                    trail.material = projMat;

                    const dir = ship.target.mesh.position.subtract(projMesh.position).normalize();
                    
                    projectiles.push({
                        mesh: projMesh,
                        trail: trail,
                        direction: dir,
                        speed: 1.5,
                        team: ship.team,
                        life: 120 // frames
                    });
                });
            }

            // --- EXPLOSION VFX ---
            function explodeShip(ship) {
                ship.isDead = true;
                ship.mesh.dispose();
                ship.healthBarBg.dispose(); // Custom property needed to track parent rect, or just hide
                // The GUI link will break, so we just hide it or track it properly. 
                // For simplicity, just setting isVisible false on the rect is safer if not disposing parent.
                // Since we disposed mesh, linked UI floats away or vanishes usually, let's manually hide.
                ship.healthBar.parent.isVisible = false; 

                if (ship.team === 'blue') blueTeamAlive--;
                else redTeamAliveAlive--;
                updateUI();

                const pos = ship.mesh.position.clone();

                // 1. Flash
                const flashMat = new BABYLON.StandardMaterial("flashMat", scene);
                flashMat.emissiveColor = new BABYLON.Color3(1, 1, 0.5);
                flashMat.disableLighting = true;
                flashMat.alpha = 1;
                const flash = BABYLON.MeshBuilder.CreateSphere("flash", {diameter: 1, segments: 8}, scene);
                flash.position = pos.clone();
                flash.material = flashMat;
                
                const flashAnim = new BABYLON.Animation("flashAnim", "scaling", 60, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                flashAnim.setKeys([
                    { frame: 0, value: new BABYLON.Vector3(1,1,1) },
                    { frame: 10, value: new BABYLON.Vector3(8,8,8) }
                ]);
                flash.animations.push(flashAnim);
                scene.beginAnimation(flash, 0, 10, false, 1, () => { flash.dispose(); });

                // Fade out flash
                const fadeAnim = new BABYLON.Animation("fadeAnim", "visibility", 60, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                fadeAnim.setKeys([{ frame: 0, value: 1 }, { frame: 15, value: 0 }]);
                flash.animations.push(fadeAnim);
                scene.beginAnimation(flash, 0, 15, false, 1);

                // 2. Shockwave (Torus)
                const swMat = new BABYLON.StandardMaterial("swMat", scene);
                swMat.emissiveColor = new BABYLON.Color3(0.5, 0.8, 1);
                swMat.disableLighting = true; swMat.alpha = 0.8;
                const sw = BABYLON.MeshBuilder.CreateTorus("sw", {diameter: 1, thickness: 0.2, tessellation: 32}, scene);
                sw.position = pos.clone(); sw.material = swMat;
                
                const swAnim = new BABYLON.Animation("swAnim", "scaling", 60, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
                swAnim.setKeys([{ frame: 0, value: new BABYLON.Vector3(1,1,1) }, { frame: 30, value: new BABYLON.Vector3(15,15,15) }]);
                sw.animations.push(swAnim);
                scene.beginAnimation(sw, 0, 30, false, 1, () => { sw.dispose(); });
                
                const swFade = new BABYLON.Animation("swFade", "visibility", 60, BABYLON.Animation.ANIMATIONTYPE_FLOAT);
                swFade.setKeys([{ frame: 0, value: 1 }, { frame: 30, value: 0 }]);
                sw.animations.push(swFade);
                scene.beginAnimation(sw, 0, 30, false, 1);

                // 3. Debris
                const debrisMat = new BABYLON.StandardMaterial("debMat", scene);
                debrisMat.diffuseColor = ship.team === 'blue' ? new BABYLON.Color3(0.2, 0.4, 0.8) : new BABYLON.Color3(0.8, 0.2, 0.1);
                for(let i=0; i<5; i++) {
                    const deb = BABYLON.MeshBuilder.CreateBox("deb", {size: 0.5 + Math.random()}, scene);
                    deb.position = pos.clone();
                    deb.material = debrisMat;
                    deb.physicsImpostor = new BABYLON.PhysicsImpostor(deb, BABYLON.PhysicsImpostor.BoxImpostor, {mass: 1}, scene);
                    deb.physicsImpostor.setLinearVelocity(new BABYLON.Vector3((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20));
                    deb.physicsImpostor.setAngularVelocity(new BABYLON.Vector3((Math.random()-0.5)*5, (Math.random()-0.5)*5, (Math.random()-0.5)*5));
                    setTimeout(() => { deb.dispose(); }, 3000);
                }

                // 4. Particles (Sparks/Fire)
                const particleSystem = new BABYLON.ParticleSystem("particles", 500, scene);
                particleSystem.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
                particleSystem.emitter = pos.clone();
                particleSystem.minEmitBox = new BABYLON.Vector3(-0.5, -0.5, -0.5);
                particleSystem.maxEmitBox = new BABYLON.Vector3(0.5, 0.5, 0.5);
                
                particleSystem.color1 = new BABYLON.Color4(1, 0.8, 0.2, 1);
                particleSystem.color2 = new BABYLON.Color4(1, 0.2, 0.1, 1);
                particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                
                particleSystem.minSize = 0.5;
                particleSystem.maxSize = 2;
                particleSystem.minLifeTime = 0.2;
                particleSystem.maxLifeTime = 1.0;
                particleSystem.emitRate = 500;
                particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
                particleSystem.gravity = new BABYLON.Vector3(0, 0, 0);
                particleSystem.direction1 = new BABYLON.Vector3(-1, -1, -1);
                particleSystem.direction2 = new BABYLON.Vector3(1, 1, 1);
                particleSystem.minEmitPower = 5;
                particleSystem.maxEmitPower = 15;
                particleSystem.start();
                setTimeout(() => { particleSystem.stop(); }, 200);

                // 5. Chain Reaction Check
                ships.forEach(other => {
                    if (other.isDead || other.team === ship.team) return;
                    const dist = BABYLON.Vector3.Distance(pos, other.mesh.position);
                    if (dist < ship.blastRadius) {
                        applyDamage(other, 9999); // Instant kill for chain reaction
                    }
                });
            }

            function applyDamage(ship, amount) {
                if (ship.isDead) return;
                ship.hp -= amount;
                ship.healthBar.width = Math.max(0, ship.hp / ship.maxHp);
                
                // Hit flash
                ship.healthBar.background = "#ffffff";
                setTimeout(() => {
                    if (!ship.isDead) ship.healthBar.background = ship.team === 'blue' ? "#4dc9f6" : "#f67019";
                }, 100);

                if (ship.hp <= 0) {
                    explodeShip(ship);
                }
            }

            function updateUI() {
                document.getElementById("blueCount").innerText = blueTeamAlive;
                document.getElementById("redCount").innerText = redTeamAlive;
            }

            // --- GAME LOOP ---
            scene.registerBeforeRender(function() {
                if (blueTeamAlive <= 0 || redTeamAlive <= 0) return; // Battle over

                // Update Ships
                ships.forEach(ship => {
                    if (ship.isDead) return;

                    // Find Target
                    if (!ship.target || ship.target.isDead) {
                        const enemies = ships.filter(e => e.team !== ship.team && !e.isDead);
                        if (enemies.length > 0) {
                            ship.target = enemies[Math.floor(Math.random() * enemies.length)];
                        } else {
                            ship.target = null;
                        }
                    }

                    if (ship.target) {
                        // Turn towards target
                        const direction = ship.target.mesh.position.subtract(ship.mesh.position);
                        const targetRotY = Math.atan2(direction.x, direction.z);
                        
                        // Smooth rotation
                        let diff = targetRotY - ship.mesh.rotation.y;
                        // Normalize angle
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        
                        ship.mesh.rotation.y += diff * 0.05;

                        // Move forward
                        const forward = new BABYLON.Vector3(0, 0, 1);
                        const globalForward = forward.rotateByQuaternionToLocal(BABYLON.Quaternion.RotationAxis(new BABYLON.Vector3(0,1,0), ship.mesh.rotation.y));
                        
                        ship.mesh.position.addInPlace(globalForward.scale(ship.speed));

                        // Fire
                        ship.fireTimer++;
                        if (ship.fireTimer >= 180) { // 3 seconds at 60fps
                            fireProjectile(ship);
                            ship.fireTimer = 0;
                        }
                    }
                });

                // Update Projectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const proj = projectiles[i];
                    proj.mesh.position.addInPlace(proj.direction.scale(proj.speed));
                    proj.life--;

                    // Check collision with enemies
                    let hit = false;
                    ships.forEach(ship => {
                        if (ship.isDead || ship.team === proj.team) return;
                        const dist = BABYLON.Vector3.Distance(proj.mesh.position, ship.mesh.position);
                        const hitRadius = ship.type === 'flagship' ? 5 : 3;
                        if (dist < hitRadius) {
                            applyDamage(ship, 25);
                            hit = true;
                        }
                    });

                    if (hit || proj.life <= 0) {
                        proj.mesh.dispose();
                        proj.trail.dispose();
                        projectiles.splice(i, 1);
                    }
                }
            });

            // Enable Physics for debris
            scene.enablePhysics(new BABYLON.Vector3(0, 0, 0), new BABYLON.CannonJSPlugin());

            return scene;
        };

        // Fix typo in spawnFleet -> redTeamAlive
        // Actually let's fix it properly in the code block above. 
        // I noticed a typo `redTeamAliveAlive` in the thought process, I will fix it in the final output.
        
        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
