<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvoSim - Monte Carlo Ecosystem Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/addons/p5.dom.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #canvas-container {
            border: 2px solid #555;
            line-height: 0;
        }
        #controls-stats {
            display: flex;
            flex-direction: column;
            width: 320px;
            gap: 20px;
        }
        .control-group, .stats-group {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
        }
        h3 {
            margin-top: 0;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #popGraph-container {
            position: relative;
            height: 150px;
            background-color: #111;
            border-radius: 4px;
        }
        .trait-stats {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <main>
        <div id="canvas-container"></div>
    </main>
    <div id="controls-stats">
        <div class="control-group">
            <h3>Controls</h3>
            <div id="sliders"></div>
            <button id="resetButton">Reset Simulation</button>
        </div>
        <div class="stats-group">
            <h3>Population Dynamics</h3>
            <div id="popGraph-container"></div>
        </div>
        <div class="stats-group">
            <h3>Average Evolved Traits</h3>
            <div id="trait-stats-container"></div>
        </div>
        <div class="stats-group">
            <h3>Key</h3>
            <p>🟩 Plant &nbsp; 🔵 Herbivore &nbsp; 🔺 Predator</p>
            <p>Animal color indicates speed (gray is slow, bright is fast).</p>
        </div>
    </div>

    <script>
    // ===================================
    // ECOSYSTEM SIMULATION SETUP
    // ===================================

    // World
    const gridSize = 10;
    const worldWidth = 80; // in grid cells
    const worldHeight = 60; // in grid cells
    let plantGrid;

    // Agent lists
    let herbivores = [];
    let predators = [];

    // Simulation parameters
    let params = {
        plantGrowthRate: 0.1,
        mutationRate: 0.05,
        initialHerbs: 50,
        initialPreds: 5,
    };

    // Statistics
    let history = {
        plants: [],
        herbivores: [],
        predators: [],
        maxHistory: 500
    };

    // UI Elements
    let sliders = {};

    function setup() {
        let canvas = createCanvas(worldWidth * gridSize, worldHeight * gridSize);
        canvas.parent('canvas-container');
        createUI();
        resetSimulation();
    }

    function createUI() {
        const slidersContainer = select('#sliders');
        
        sliders.plantGrowthRate = createSliderWithLabel(slidersContainer, "Plant Growth Rate", 0.01, 0.5, params.plantGrowthRate, 0.01);
        sliders.mutationRate = createSliderWithLabel(slidersContainer, "Mutation Rate", 0, 0.2, params.mutationRate, 0.005);
        sliders.initialHerbs = createSliderWithLabel(slidersContainer, "Initial Herbivores", 10, 200, params.initialHerbs, 1);
        sliders.initialPreds = createSliderWithLabel(slidersContainer, "Initial Predators", 0, 50, params.initialPreds, 1);

        select('#resetButton').mousePressed(resetSimulation);
    }
    
    function createSliderWithLabel(parent, label, min, max, initial, step) {
        const p = createP(label).parent(parent);
        p.style('margin', '10px 0 5px 0');
        const s = createSlider(min, max, initial, step).parent(parent);
        s.style('width', '100%');
        const valSpan = createSpan(s.value()).parent(p);
        s.input(() => valSpan.html(s.value()));
        return s;
    }

    function resetSimulation() {
        // Read values from sliders
        params.plantGrowthRate = sliders.plantGrowthRate.value();
        params.mutationRate = sliders.mutationRate.value();
        params.initialHerbs = sliders.initialHerbs.value();
        params.initialPreds = sliders.initialPreds.value();

        // Initialize grid
        plantGrid = Array(worldWidth).fill(0).map(() => Array(worldHeight).fill(0));
        for (let i = 0; i < worldWidth * worldHeight * 0.2; i++) {
             plantGrid[floor(random(worldWidth))][floor(random(worldHeight))] = 1;
        }

        // Initialize agents
        herbivores = [];
        for (let i = 0; i < params.initialHerbs; i++) {
            herbivores.push(new Herbivore(random(width), random(height)));
        }

        predators = [];
        for (let i = 0; i < params.initialPreds; i++) {
            predators.push(new Predator(random(width), random(height)));
        }
        
        // Reset history
        history.plants = [];
        history.herbivores = [];
        history.predators = [];
    }

    // ===================================
    // MAIN SIMULATION LOOP
    // ===================================
    function draw() {
        // Update simulation multiple times per frame for speed
        const updatesPerFrame = 2;
        for (let i = 0; i < updatesPerFrame; i++) {
            // 1. Grow plants
            growPlants();

            // 2. Update agents (Monte Carlo step)
            // Process a number of agents equal to the total population each cycle
            let totalAgents = herbivores.length + predators.length;
            for (let j = 0; j < totalAgents; j++) {
                // Randomly pick an agent type, weighted by population
                let isHerb = random() < herbivores.length / totalAgents;
                if (isHerb && herbivores.length > 0) {
                    random(herbivores).update(herbivores, predators);
                } else if (predators.length > 0) {
                    random(predators).update(herbivores, predators);
                }
            }
        
            // 3. Clean up dead agents
            herbivores = herbivores.filter(h => !h.isDead);
            predators = predators.filter(p => !p.isDead);
        }

        // 4. Render everything
        background(50, 40, 30); // Earthy brown
        drawPlants();
        drawAgents();
        
        // 5. Update and draw statistics
        updateHistory();
        drawStats();
    }
    
    function growPlants() {
        for(let i=0; i < worldWidth * worldHeight * params.plantGrowthRate / (60/2); i++) { // Normalized for updates
            const x = floor(random(worldWidth));
            const y = floor(random(worldHeight));
            if (plantGrid[x][y] === 0) {
                plantGrid[x][y] = 1; // 1 represents a full-grown plant
            }
        }
    }
    
    function drawPlants() {
        noStroke();
        fill(34, 139, 34, 150); // Forest green
        for (let i = 0; i < worldWidth; i++) {
            for (let j = 0; j < worldHeight; j++) {
                if (plantGrid[i][j] > 0) {
                    square(i * gridSize, j * gridSize, gridSize);
                }
            }
        }
    }
    
    function drawAgents() {
        herbivores.forEach(h => h.draw());
        predators.forEach(p => p.draw());
    }

    // ===================================
    // STATISTICS & VISUALIZATION
    // ===================================
    function updateHistory() {
        let plantCount = 0;
        for (let i = 0; i < worldWidth; i++) {
            for (let j = 0; j < worldHeight; j++) {
                if (plantGrid[i][j] > 0) plantCount++;
            }
        }
        
        history.plants.push(plantCount / (worldWidth * worldHeight)); // Store as density
        history.herbivores.push(herbivores.length);
        history.predators.push(predators.length);

        if (history.plants.length > history.maxHistory) {
            history.plants.shift();
            history.herbivores.shift();
            history.predators.shift();
        }
    }

    function drawStats() {
        drawPopulationGraph();
        drawTraitStats();
    }
    
    function drawPopulationGraph() {
        const container = select('#popGraph-container');
        const w = container.width;
        const h = container.height;
        const pg = createGraphics(w, h);
        pg.background(20);
        pg.noFill();
        
        const maxPop = max(10, ...history.herbivores, ...history.predators);

        // Draw herbivore line
        pg.stroke(100, 100, 255);
        pg.beginShape();
        history.herbivores.forEach((pop, i) => {
            pg.vertex(map(i, 0, history.maxHistory, 0, w), map(pop, 0, maxPop, h, 0));
        });
        pg.endShape();

        // Draw predator line
        pg.stroke(255, 100, 100);
        pg.beginShape();
        history.predators.forEach((pop, i) => {
            pg.vertex(map(i, 0, history.maxHistory, 0, w), map(pop, 0, maxPop, h, 0));
        });
        pg.endShape();
        
        // Draw plant density area
        pg.noStroke();
        pg.fill(34, 139, 34, 50);
        pg.beginShape();
        pg.vertex(0, h);
        history.plants.forEach((density, i) => {
            pg.vertex(map(i, 0, history.maxHistory, 0, w), map(density, 0, 1, h, 0));
        });
        pg.vertex(w, h);
        pg.endShape(CLOSE);


        image(pg, container.elt.offsetLeft, container.elt.offsetTop, w, h);
        pg.remove();
    }
    
    function drawTraitStats() {
        const container = select('#trait-stats-container');
        
        const avgHerbSpeed = herbivores.length > 0 ? herbivores.reduce((acc, h) => acc + h.genome.speed, 0) / herbivores.length : 0;
        const avgHerbSize = herbivores.length > 0 ? herbivores.reduce((acc, h) => acc + h.genome.size, 0) / herbivores.length : 0;
        const avgPredSpeed = predators.length > 0 ? predators.reduce((acc, p) => acc + p.genome.speed, 0) / predators.length : 0;
        const avgPredSize = predators.length > 0 ? predators.reduce((acc, p) => acc + p.genome.size, 0) / predators.length : 0;

        container.html(`
            <div class="trait-stats"><span>Herbivore Speed:</span> <span>${avgHerbSpeed.toFixed(2)}</span></div>
            <div class="trait-stats"><span>Herbivore Size:</span> <span>${avgHerbSize.toFixed(2)}</span></div>
            <div class="trait-stats"><span>Predator Speed:</span> <span>${avgPredSpeed.toFixed(2)}</span></div>
            <div class="trait-stats"><span>Predator Size:</span> <span>${avgPredSize.toFixed(2)}</span></div>
        `);
    }

    // ===================================
    // BASE AGENT CLASS
    // ===================================
    class Animal {
        constructor(x, y, genome, energy) {
            this.pos = createVector(x, y);
            this.vel = p5.Vector.random2D();
            this.genome = genome || this.defaultGenome();
            this.energy = energy || this.genome.initialEnergy;
            this.isDead = false;
        }

        defaultGenome() {
            return {
                speed: 1.0,
                vision: 50,
                size: 10,
                reproThreshold: 80,
                initialEnergy: 50,
                energyFromFood: 40,
                energyCostPerTick: 0.1
            };
        }

        update() {
            this.energy -= this.genome.energyCostPerTick + (this.genome.speed * this.genome.size * 0.001); // Cost of living
            if (this.energy <= 0) {
                this.isDead = true;
                return;
            }
            this.vel.limit(this.genome.speed);
            this.pos.add(this.vel);
            this.wrapEdges();
        }

        reproduce(agentList) {
            if (this.energy > this.genome.reproThreshold) {
                this.energy /= 2;
                let newGenome = this.mutate();
                let child = new this.constructor(this.pos.x, this.pos.y, newGenome, this.energy);
                agentList.push(child);
            }
        }
        
        mutate() {
            let newGenome = { ...this.genome };
            if (random() < params.mutationRate) newGenome.speed = max(0.5, newGenome.speed + random(-0.2, 0.2));
            if (random() < params.mutationRate) newGenome.vision = max(20, newGenome.vision + random(-10, 10));
            if (random() < params.mutationRate) newGenome.size = max(5, newGenome.size + random(-1, 1));
            if (random() < params.mutationRate) newGenome.reproThreshold = max(50, newGenome.reproThreshold + random(-5, 5));
            return newGenome;
        }

        findClosest(targetList) {
            let closest = null;
            let closestDist = Infinity;
            for (const target of targetList) {
                let d = dist(this.pos.x, this.pos.y, target.pos.x, target.pos.y);
                if (d < this.genome.vision && d < closestDist) {
                    closest = target;
                    closestDist = d;
                }
            }
            return {target: closest, dist: closestDist};
        }

        wrapEdges() {
            if (this.pos.x > width) this.pos.x = 0;
            if (this.pos.x < 0) this.pos.x = width;
            if (this.pos.y > height) this.pos.y = 0;
            if (this.pos.y < 0) this.pos.y = height;
        }
    }

    // ===================================
    // DERIVED AGENT CLASSES
    // ===================================
    class Herbivore extends Animal {
        constructor(x, y, genome, energy) {
            super(x, y, genome, energy);
        }

        defaultGenome() {
            return {
                speed: 1.2, vision: 60, size: 8, reproThreshold: 60,
                initialEnergy: 40, energyFromFood: 25, energyCostPerTick: 0.08
            };
        }

        update(herbivores, predators) {
            super.update();
            if (this.isDead) return;
            
            // Logic: 1. Flee, 2. Reproduce, 3. Eat, 4. Wander
            const {target: closestPred} = this.findClosest(predators);
            if (closestPred && dist(this.pos.x, this.pos.y, closestPred.pos.x, closestPred.pos.y) < this.genome.vision) {
                // Flee!
                let desired = p5.Vector.sub(this.pos, closestPred.pos);
                this.vel.lerp(desired.normalize().mult(this.genome.speed), 0.2);
            } else {
                this.reproduce(herbivores);
                
                // Find and eat plants
                const gridX = floor(this.pos.x / gridSize);
                const gridY = floor(this.pos.y / gridSize);
                if (plantGrid[gridX] && plantGrid[gridX][gridY] > 0) {
                    this.energy += this.genome.energyFromFood;
                    plantGrid[gridX][gridY] = 0;
                    this.vel.mult(0.5); // Slow down to eat
                } else {
                    // Wander and seek plants
                    this.vel.rotate(random(-0.2, 0.2));
                }
            }
        }

        draw() {
            push();
            translate(this.pos.x, this.pos.y);
            const speedColor = map(this.genome.speed, 0.5, 3, 100, 255);
            fill(100, 100, speedColor, 220); // Blueish, brightness based on speed
            stroke(200, 200, 255);
            circle(0, 0, this.genome.size);
            pop();
        }
    }

    class Predator extends Animal {
        constructor(x, y, genome, energy) {
            super(x, y, genome, energy);
        }

        defaultGenome() {
            return {
                speed: 1.0, vision: 80, size: 12, reproThreshold: 100,
                initialEnergy: 80, energyFromFood: 60, energyCostPerTick: 0.15
            };
        }

        update(herbivores, predators) {
            super.update();
            if (this.isDead) return;

            // Logic: 1. Reproduce, 2. Hunt, 3. Wander
            this.reproduce(predators);
            
            const {target: prey, dist: preyDist} = this.findClosest(herbivores);
            
            if (prey) {
                // Hunt
                let desired = p5.Vector.sub(prey.pos, this.pos);
                this.vel.lerp(desired.normalize().mult(this.genome.speed), 0.1);
                
                // Eat
                if (preyDist < this.genome.size / 2) {
                    prey.isDead = true;
                    this.energy += this.genome.energyFromFood;
                }
            } else {
                // Wander
                this.vel.rotate(random(-0.1, 0.1));
            }
        }

        draw() {
            push();
            translate(this.pos.x, this.pos.y);
            rotate(this.vel.heading() + PI / 2);
            const speedColor = map(this.genome.speed, 0.5, 3, 100, 255);
            fill(speedColor, 100, 100, 220); // Redish, brightness based on speed
            stroke(255, 200, 200);
            triangle(0, -this.genome.size, -this.genome.size/2, this.genome.size/2, this.genome.size/2, this.genome.size/2);
            pop();
        }
    }

    </script>
</body>
</html>
