<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monte Carlo Ecosystem · Stochastic Evolution</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080d;
    --panel: #0c0d14;
    --panel-2: #11131c;
    --line: #1a1c28;
    --line-bright: #262938;
    --ink: #d6deec;
    --ink-2: #8a93ad;
    --ink-3: #545b73;
    --accent: #6c93ff;
    --plant: #4fc97a;
    --herb: #6c93ff;
    --pred: #ff6e5e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(108,147,255,0.06), transparent 50%),
      radial-gradient(circle at 90% 100%, rgba(255,110,94,0.04), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 18px;
  }
  .header .left h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0 0 4px 0;
    color: var(--ink);
  }
  .header .left .sub {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .header .right {
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    line-height: 1.7;
  }
  .header .right .legend {
    display: flex;
    gap: 14px;
    justify-content: flex-end;
    margin-top: 4px;
  }
  .swatch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .swatch::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .swatch.p::before { background: var(--plant); box-shadow: 0 0 6px rgba(79,201,122,0.5); }
  .swatch.h::before { background: var(--herb); box-shadow: 0 0 6px rgba(108,147,255,0.5); }
  .swatch.r::before { background: var(--pred); box-shadow: 0 0 6px rgba(255,110,94,0.5); }
  #canvas-container {
    line-height: 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg);
  }
  .toolbar {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line-bright);
    padding: 7px 14px;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover {
    background: var(--panel-2);
    border-color: #34384c;
    color: #fff;
  }
  button.primary {
    background: rgba(108,147,255,0.1);
    border-color: rgba(108,147,255,0.4);
    color: var(--accent);
  }
  button.primary:hover {
    background: rgba(108,147,255,0.18);
    color: #b6c8ff;
  }
  .help {
    margin-left: 8px;
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.05em;
  }
  kbd {
    display: inline-block;
    padding: 2px 6px;
    background: var(--panel);
    border: 1px solid var(--line-bright);
    border-bottom-width: 2px;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-2);
    margin: 0 2px;
  }
  .controls {
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    column-gap: 28px;
    row-gap: 14px;
  }
  .controls .group-label {
    grid-column: 1 / -1;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-3);
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin-top: 4px;
  }
  .controls .group-label:first-child { margin-top: 0; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 4px;
  }
  .control label .v {
    color: var(--ink);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    background: transparent;
    height: 16px;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px;
    background: var(--line-bright);
    border-radius: 2px;
  }
  input[type=range]::-moz-range-track {
    height: 2px;
    background: var(--line-bright);
    border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: -4.5px;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent);
    cursor: pointer;
  }
  @media (max-width: 900px) {
    .controls { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="left">
      <h1>Monte Carlo Ecosystem</h1>
      <div class="sub">Stochastic predator–prey evolution · agent-based</div>
    </div>
    <div class="right">
      <div>real-time grid · 96 × 96 cells</div>
      <div class="legend">
        <span class="swatch p">Plants</span>
        <span class="swatch h">Herbivores</span>
        <span class="swatch r">Predators</span>
      </div>
    </div>
  </div>
  <div id="canvas-container"></div>
  <div class="toolbar">
    <button class="primary" id="btn-pause">⏸ Pause</button>
    <button id="btn-step">▷ Step</button>
    <button id="btn-reset">↻ Reset</button>
    <button id="btn-speed">Speed ×1</button>
    <button id="btn-mode">Color: lineage</button>
    <span class="help">
      <kbd>Space</kbd> pause &nbsp;
      <kbd>S</kbd> step &nbsp;
      <kbd>R</kbd> reset &nbsp;
      <kbd>+</kbd>/<kbd>−</kbd> speed &nbsp;
      <kbd>V</kbd> color mode
    </span>
  </div>
  <div class="controls" id="controls"></div>
</div>

<script>
'use strict';

// ============================================================
//  CONFIG
// ============================================================
const GRID_W = 96;
const GRID_H = 96;
const CELL = 6;                  // pixel size of a cell
const STATS_W = 360;             // width of the right-hand stats panel
const HISTORY_LEN = 320;         // how many sample points to keep
const HISTORY_EVERY = 2;         // record stats every N ticks
const MAX_HERB = 5000;
const MAX_PRED = 1500;

// Aesthetic palette (must match CSS vars)
const COL = {
  bg:        [7, 8, 13],
  panel:     [12, 13, 20],
  line:      [26, 28, 40],
  axis:      [38, 41, 56],
  ink:       [214, 222, 236],
  ink2:      [138, 147, 173],
  ink3:      [84, 91, 115],
  accent:    [108, 147, 255],
  plant:     [79, 201, 122],
  herb:      [108, 147, 255],
  pred:      [255, 110, 94],
};

// ============================================================
//  PARAMETERS (user-controlled)
// ============================================================
const params = {
  mutationRate:  { val: 0.10,  min: 0.0,   max: 0.30,  step: 0.005, label: 'Mutation σ',          fmt: v => v.toFixed(3) },
  plantGrowth:   { val: 0.025, min: 0.001, max: 0.08,  step: 0.001, label: 'Plant growth',        fmt: v => v.toFixed(3) },
  carryingCap:   { val: 1.0,   min: 0.3,   max: 2.0,   step: 0.05,  label: 'Carrying capacity',   fmt: v => v.toFixed(2) },
  herbEatRate:   { val: 0.40,  min: 0.05,  max: 1.0,   step: 0.02,  label: 'Herbivore graze',     fmt: v => v.toFixed(2) },
  predGain:      { val: 0.38,  min: 0.1,   max: 1.5,   step: 0.02,  label: 'Predation gain',      fmt: v => v.toFixed(2) },
  metaHerb:      { val: 0.075, min: 0.02,  max: 0.30,  step: 0.005, label: 'Herb. metabolism',    fmt: v => v.toFixed(3) },
  metaPred:      { val: 0.20,  min: 0.02,  max: 0.40,  step: 0.005, label: 'Pred. metabolism',    fmt: v => v.toFixed(3) },
  reproThreshH:  { val: 5,     min: 3,     max: 20,    step: 0.5,   label: 'Herb. repro thresh.', fmt: v => v.toFixed(1) },
  reproThreshP:  { val: 16,    min: 5,     max: 30,    step: 0.5,   label: 'Pred. repro thresh.', fmt: v => v.toFixed(1) },
  reproProb:     { val: 0.22,  min: 0.02,  max: 0.6,   step: 0.01,  label: 'Repro probability',   fmt: v => v.toFixed(2) },
  initHerb:      { val: 450,   min: 0,     max: 800,   step: 10,    label: 'Initial herbivores',  fmt: v => v.toFixed(0), initOnly: true },
  initPred:      { val: 22,    min: 0,     max: 200,   step: 1,     label: 'Initial predators',   fmt: v => v.toFixed(0), initOnly: true },
};

// Ordering for the controls grid; group labels inserted between sections
const PARAM_LAYOUT = [
  '__INTERACTIONS',
  'plantGrowth', 'carryingCap', 'herbEatRate', 'predGain',
  '__VITAL_RATES',
  'metaHerb', 'metaPred', 'reproProb', 'mutationRate',
  '__POPULATION',
  'reproThreshH', 'reproThreshP', 'initHerb', 'initPred',
];

// ============================================================
//  STATE
// ============================================================
let plants;          // 2D array of biomass per cell
let herbivores = [];
let predators = [];
let herbCells;       // spatial index: herbCells[x][y] = list of herbivores
let plantBuf;        // p5.Graphics for plant rendering (one pixel per cell)

let history;
let tick = 0;
let paused = false;
let stepOnce = false;
let speedMult = 1;
let colorMode = 0;   // 0=lineage, 1=speed, 2=vision
const COLOR_MODES = ['lineage', 'speed', 'vision'];

// ============================================================
//  RNG HELPERS — Box-Muller Gaussian (Monte Carlo workhorse)
// ============================================================
let _gPair = null;
function gauss() {
  if (_gPair !== null) { const v = _gPair; _gPair = null; return v; }
  const u1 = Math.max(1e-12, Math.random());
  const u2 = Math.random();
  const m = Math.sqrt(-2 * Math.log(u1));
  _gPair = m * Math.sin(2 * Math.PI * u2);
  return m * Math.cos(2 * Math.PI * u2);
}

function clamp(v, mn, mx) { return v < mn ? mn : v > mx ? mx : v; }
function sgn(v) { return v > 0 ? 1 : v < 0 ? -1 : 0; }
function torDelta(d, size) {
  if (d > size / 2) return d - size;
  if (d < -size / 2) return d + size;
  return d;
}

function mutateScalar(v, sigma, mn, mx) {
  return clamp(v + gauss() * sigma, mn, mx);
}

// Hue lives in a type-specific range so species stay visually identifiable
function hueRange(type) {
  return type === 'h' ? [170, 270] : [-30, 55];
}
function mutateHue(h, sigma, type) {
  const [mn, mx] = hueRange(type);
  let v = h + gauss() * sigma;
  // Reflect at boundaries (so we don't pile up on the edges)
  let safety = 6;
  while ((v < mn || v > mx) && safety-- > 0) {
    if (v < mn) v = 2 * mn - v;
    if (v > mx) v = 2 * mx - v;
  }
  return clamp(v, mn, mx);
}

// HSL → RGB (h in degrees, s/l in %)
function hslRGB(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}

// ============================================================
//  AGENT FACTORY
// ============================================================
function makeAgent(x, y, type) {
  if (type === 'h') {
    const [hMin, hMax] = hueRange('h');
    return {
      x, y, type: 'h',
      energy: 4 + Math.random() * 2,
      age: 0,
      speed:  0.6 + Math.random() * 0.5,   // cells per attempted move (>1 => more frequent moves)
      vision: 2 + Math.random() * 2,       // chebyshev radius
      repro:  0.18 + Math.random() * 0.08,
      eff:    0.85 + Math.random() * 0.15,
      hue:    hMin + Math.random() * (hMax - hMin),
    };
  } else {
    const [hMin, hMax] = hueRange('p');
    return {
      x, y, type: 'p',
      energy: 8 + Math.random() * 3,
      age: 0,
      speed:  0.85 + Math.random() * 0.5,
      vision: 3 + Math.random() * 3,
      repro:  0.14 + Math.random() * 0.06,
      eff:    0.80 + Math.random() * 0.2,
      hue:    hMin + Math.random() * (hMax - hMin),
    };
  }
}

function reproduce(parent) {
  const r = params.mutationRate.val;
  const child = {
    x: parent.x,
    y: parent.y,
    type: parent.type,
    energy: parent.energy * 0.45,
    age: 0,
    speed:  mutateScalar(parent.speed,  r * 0.6,  0.2, 4.0),
    vision: mutateScalar(parent.vision, r * 2.2,  1.0, 12.0),
    repro:  mutateScalar(parent.repro,  r * 0.06, 0.02, 0.55),
    eff:    mutateScalar(parent.eff,    r * 0.10, 0.30, 1.5),
    hue:    mutateHue(parent.hue, r * 28, parent.type),
  };
  parent.energy *= 0.50;
  parent.age = parent.age; // unchanged; just clarifying mutation cost is purely energetic
  return child;
}

// ============================================================
//  SETUP / RESET
// ============================================================
function setup() {
  pixelDensity(1);
  const w = GRID_W * CELL + STATS_W + 30;
  const h = GRID_H * CELL + 20;
  const cnv = createCanvas(w, h);
  cnv.parent('canvas-container');

  plantBuf = createGraphics(GRID_W, GRID_H);
  plantBuf.noSmooth();
  noSmooth();

  buildControls();
  bindButtons();
  reset();
}

function reset() {
  // Plants: fractal-ish initial biomass via simplex-like noise
  plants = [];
  const n = noise; // p5 perlin
  noiseSeed(Math.floor(Math.random() * 99999));
  for (let i = 0; i < GRID_W; i++) {
    plants.push(new Float32Array(GRID_H));
    for (let j = 0; j < GRID_H; j++) {
      const v = n(i * 0.08, j * 0.08);
      plants[i][j] = clamp(0.15 + v * 0.85, 0.05, params.carryingCap.val);
    }
  }

  herbivores = [];
  predators = [];
  for (let k = 0; k < params.initHerb.val; k++) {
    herbivores.push(makeAgent(Math.floor(Math.random() * GRID_W), Math.floor(Math.random() * GRID_H), 'h'));
  }
  for (let k = 0; k < params.initPred.val; k++) {
    predators.push(makeAgent(Math.floor(Math.random() * GRID_W), Math.floor(Math.random() * GRID_H), 'p'));
  }

  history = {
    plant: [], herb: [], pred: [],
    hSpeed: [], hVision: [], hRepro: [], hEff: [],
    pSpeed: [], pVision: [], pRepro: [], pEff: [],
  };
  tick = 0;
}

// ============================================================
//  SPATIAL INDEX
// ============================================================
function buildHerbCells() {
  if (!herbCells) {
    herbCells = [];
    for (let i = 0; i < GRID_W; i++) {
      const row = [];
      for (let j = 0; j < GRID_H; j++) row.push([]);
      herbCells.push(row);
    }
  }
  for (let i = 0; i < GRID_W; i++) {
    const row = herbCells[i];
    for (let j = 0; j < GRID_H; j++) row[j].length = 0;
  }
  for (let i = 0; i < herbivores.length; i++) {
    const a = herbivores[i];
    herbCells[a.x][a.y].push(a);
  }
}

// ============================================================
//  MONTE CARLO STEP
//  Each tick, every agent gets a turn. Within the turn, each
//  decision (move, eat, reproduce) is taken stochastically based
//  on traits, neighborhood state, and tunable parameters.
// ============================================================
function step() {
  // 1. Plants regrow toward the carrying capacity (logistic-style,
  //    but with a constant seeding term so dead cells can recolonize)
  const cap = params.carryingCap.val;
  const g = params.plantGrowth.val;
  for (let i = 0; i < GRID_W; i++) {
    const row = plants[i];
    for (let j = 0; j < GRID_H; j++) {
      const v = row[j];
      // Constant-rate logistic: growth = g·(1 − v/K). Always positive while v < K.
      const ng = v + g * (1 - v / cap);
      row[j] = ng > cap ? cap : (ng < 0 ? 0 : ng);
    }
  }

  buildHerbCells();

  // 2. Herbivores
  const newHerbs = [];
  const reproThreshH = params.reproThreshH.val;
  const reproProb = params.reproProb.val;
  const eatRate = params.herbEatRate.val;
  const metaH = params.metaHerb.val;

  for (let i = herbivores.length - 1; i >= 0; i--) {
    const a = herbivores[i];
    a.age++;
    // Metabolism scales with speed² and modestly with vision (cognition cost)
    a.energy -= metaH * (1 + 0.35 * a.speed * a.speed + 0.04 * a.vision);

    if (a.energy <= 0) {
      herbivores[i] = herbivores[herbivores.length - 1];
      herbivores.pop();
      continue;
    }

    // Stochastic move decision (probability scales with speed)
    if (Math.random() < Math.min(1, a.speed * 0.65)) {
      const v = Math.max(1, Math.floor(a.vision));

      // First: detect predators within vision (Monte Carlo sample)
      let fleeDx = 0, fleeDy = 0, fleeing = false;
      if (predators.length > 0) {
        const samples = Math.min(predators.length, 6);
        for (let s = 0; s < samples; s++) {
          const p = predators[Math.floor(Math.random() * predators.length)];
          let dx = torDelta(p.x - a.x, GRID_W);
          let dy = torDelta(p.y - a.y, GRID_H);
          if (Math.max(Math.abs(dx), Math.abs(dy)) <= a.vision) {
            fleeing = true;
            fleeDx -= dx; fleeDy -= dy;
          }
        }
      }

      let dx, dy;
      if (fleeing) {
        dx = sgn(fleeDx); dy = sgn(fleeDy);
        if (dx === 0 && dy === 0) {
          dx = Math.floor(Math.random() * 3) - 1;
          dy = Math.floor(Math.random() * 3) - 1;
        }
      } else {
        // Otherwise: stochastic search for the most plant-rich cell in vision
        let bestVal = plants[a.x][a.y];
        let bestDx = 0, bestDy = 0;
        const samples = Math.min(20, (2 * v + 1) * (2 * v + 1));
        for (let s = 0; s < samples; s++) {
          const sx = Math.floor(Math.random() * (2 * v + 1)) - v;
          const sy = Math.floor(Math.random() * (2 * v + 1)) - v;
          const nx = (a.x + sx + GRID_W) % GRID_W;
          const ny = (a.y + sy + GRID_H) % GRID_H;
          if (plants[nx][ny] > bestVal) {
            bestVal = plants[nx][ny];
            bestDx = sx; bestDy = sy;
          }
        }
        if (bestDx === 0 && bestDy === 0) {
          // No improvement: random walk
          dx = Math.floor(Math.random() * 3) - 1;
          dy = Math.floor(Math.random() * 3) - 1;
        } else {
          dx = sgn(bestDx); dy = sgn(bestDy);
        }
      }

      a.x = (a.x + dx + GRID_W) % GRID_W;
      a.y = (a.y + dy + GRID_H) % GRID_H;
    }

    // Graze on the current cell
    const avail = plants[a.x][a.y];
    const eaten = Math.min(avail, eatRate);
    plants[a.x][a.y] = avail - eaten;
    a.energy += eaten * 6 * a.eff;

    // Reproduce stochastically once over the energy threshold
    if (a.energy > reproThreshH && Math.random() < a.repro * reproProb / 0.20 &&
        herbivores.length + newHerbs.length < MAX_HERB) {
      newHerbs.push(reproduce(a));
    }
  }
  for (let i = 0; i < newHerbs.length; i++) herbivores.push(newHerbs[i]);

  // Rebuild spatial index now that herbivores moved/spawned/died
  buildHerbCells();

  // 3. Predators
  const newPreds = [];
  const reproThreshP = params.reproThreshP.val;
  const metaP = params.metaPred.val;
  const predGain = params.predGain.val;

  for (let i = predators.length - 1; i >= 0; i--) {
    const a = predators[i];
    a.age++;
    a.energy -= metaP * (1 + 0.35 * a.speed * a.speed + 0.04 * a.vision);

    if (a.energy <= 0) {
      predators[i] = predators[predators.length - 1];
      predators.pop();
      continue;
    }

    if (Math.random() < Math.min(1, a.speed * 0.75)) {
      const v = Math.max(1, Math.floor(a.vision));
      // Monte Carlo prey search: sample cells in vision square, pick closest occupied.
      // Sample budget grows with vision but caps below the full square — so even
      // moderately-far prey can be missed, especially with low-vision predators.
      const span = 2 * v + 1;
      const numSamples = Math.min(8 + v * 2, span * span);
      let target = null, bestDist = v + 1;
      for (let s = 0; s < numSamples; s++) {
        const sx = Math.floor(Math.random() * span) - v;
        const sy = Math.floor(Math.random() * span) - v;
        const nx = (a.x + sx + GRID_W) % GRID_W;
        const ny = (a.y + sy + GRID_H) % GRID_H;
        if (herbCells[nx][ny].length > 0) {
          const d = Math.max(Math.abs(sx), Math.abs(sy));
          if (d < bestDist) {
            target = { dx: sx, dy: sy };
            bestDist = d;
          }
        }
      }

      let dx, dy;
      if (target) {
        dx = sgn(target.dx); dy = sgn(target.dy);
      } else {
        dx = Math.floor(Math.random() * 3) - 1;
        dy = Math.floor(Math.random() * 3) - 1;
      }
      a.x = (a.x + dx + GRID_W) % GRID_W;
      a.y = (a.y + dy + GRID_H) % GRID_H;
    }

    // Eat any herbivore on the current cell — stochastic capture biased by
    // speed differential. Faster prey can outrun a slow predator; this creates
    // a genuine evolutionary pressure on both predator and prey speeds.
    const cell = herbCells[a.x][a.y];
    if (cell.length > 0) {
      const idxInCell = Math.floor(Math.random() * cell.length);
      const prey = cell[idxInCell];
      const idxInList = herbivores.indexOf(prey);
      if (idxInList !== -1) {
        const capProb = Math.max(0.08, Math.min(0.92, 0.55 + 0.35 * (a.speed - prey.speed)));
        if (Math.random() < capProb) {
          a.energy += (prey.energy + 4) * a.eff * predGain;
          herbivores[idxInList] = herbivores[herbivores.length - 1];
          herbivores.pop();
          cell[idxInCell] = cell[cell.length - 1];
          cell.pop();
        }
      }
    }

    if (a.energy > reproThreshP && Math.random() < a.repro * reproProb / 0.20 &&
        predators.length + newPreds.length < MAX_PRED) {
      newPreds.push(reproduce(a));
    }
  }
  for (let i = 0; i < newPreds.length; i++) predators.push(newPreds[i]);

  // 4. Record history
  if (tick % HISTORY_EVERY === 0) {
    let plantTotal = 0;
    for (let i = 0; i < GRID_W; i++) {
      const row = plants[i];
      for (let j = 0; j < GRID_H; j++) plantTotal += row[j];
    }
    pushHist(history.plant, plantTotal);
    pushHist(history.herb,  herbivores.length);
    pushHist(history.pred,  predators.length);

    const aH = avgTraits(herbivores);
    const aP = avgTraits(predators);
    pushHist(history.hSpeed,  aH.speed);
    pushHist(history.hVision, aH.vision);
    pushHist(history.hRepro,  aH.repro);
    pushHist(history.hEff,    aH.eff);
    pushHist(history.pSpeed,  aP.speed);
    pushHist(history.pVision, aP.vision);
    pushHist(history.pRepro,  aP.repro);
    pushHist(history.pEff,    aP.eff);
  }

  tick++;
}

function pushHist(arr, v) {
  arr.push(v);
  if (arr.length > HISTORY_LEN) arr.shift();
}

function avgTraits(arr) {
  if (arr.length === 0) return { speed: NaN, vision: NaN, repro: NaN, eff: NaN };
  let s = 0, v = 0, r = 0, e = 0;
  for (let i = 0; i < arr.length; i++) {
    const a = arr[i];
    s += a.speed; v += a.vision; r += a.repro; e += a.eff;
  }
  const n = arr.length;
  return { speed: s / n, vision: v / n, repro: r / n, eff: e / n };
}

// ============================================================
//  RENDER
// ============================================================
function draw() {
  // Step the simulation
  if (!paused) {
    for (let s = 0; s < speedMult; s++) step();
  } else if (stepOnce) {
    step();
    stepOnce = false;
  }

  background(COL.bg[0], COL.bg[1], COL.bg[2]);
  drawPlants();
  drawAgents();
  drawStats();
}

function drawPlants() {
  plantBuf.loadPixels();
  const pix = plantBuf.pixels;
  const cap = params.carryingCap.val;
  for (let i = 0; i < GRID_W; i++) {
    const row = plants[i];
    for (let j = 0; j < GRID_H; j++) {
      const t = clamp(row[j] / cap, 0, 1);
      // Soft eased mapping: dark earth → vivid green
      const e = t * t * (3 - 2 * t);
      const idx = 4 * (j * GRID_W + i);
      pix[idx]     = 8 + e * 40;
      pix[idx + 1] = 16 + e * 175;
      pix[idx + 2] = 14 + e * 70;
      pix[idx + 3] = 255;
    }
  }
  plantBuf.updatePixels();
  noSmooth();
  image(plantBuf, 10, 10, GRID_W * CELL, GRID_H * CELL);

  // Subtle inner border
  noFill();
  stroke(COL.line[0], COL.line[1], COL.line[2]);
  strokeWeight(1);
  rect(10, 10, GRID_W * CELL, GRID_H * CELL);
}

function agentColor(a) {
  let hue;
  if (colorMode === 0) {
    hue = a.hue;                           // lineage drift
  } else if (colorMode === 1) {
    // speed-mapped hue
    if (a.type === 'h') hue = 200 + clamp(a.speed, 0, 4) * 18;
    else                hue = 5 + clamp(a.speed, 0, 4) * 14;
  } else {
    if (a.type === 'h') hue = 175 + clamp(a.vision, 0, 12) * 8;
    else                hue = -10 + clamp(a.vision, 0, 12) * 6;
  }
  const sat = a.type === 'h' ? 70 : 80;
  const lig = a.type === 'h' ? 64 : 60;
  return hslRGB(hue, sat, lig);
}

function drawAgents() {
  noStroke();
  // Herbivores: small filled circles
  for (let i = 0; i < herbivores.length; i++) {
    const a = herbivores[i];
    const cx = 10 + a.x * CELL + CELL / 2;
    const cy = 10 + a.y * CELL + CELL / 2;
    const sz = clamp(2.4 + a.energy * 0.12, 2.4, 5);
    const c = agentColor(a);
    fill(c[0], c[1], c[2]);
    circle(cx, cy, sz);
  }
  // Predators: triangles, slightly larger
  for (let i = 0; i < predators.length; i++) {
    const a = predators[i];
    const cx = 10 + a.x * CELL + CELL / 2;
    const cy = 10 + a.y * CELL + CELL / 2;
    const r = clamp(2.6 + a.energy * 0.07, 2.6, 5.5);
    const c = agentColor(a);
    fill(c[0], c[1], c[2]);
    triangle(cx, cy - r, cx - r * 0.86, cy + r * 0.66, cx + r * 0.86, cy + r * 0.66);
  }
}

// ----------- STATS PANEL ------------
function drawStats() {
  const x0 = GRID_W * CELL + 20;
  const y0 = 10;
  const w  = STATS_W;
  const h  = GRID_H * CELL;

  // Panel
  noStroke();
  fill(COL.panel[0], COL.panel[1], COL.panel[2]);
  rect(x0, y0, w, h, 4);
  noFill();
  stroke(COL.line[0], COL.line[1], COL.line[2]);
  strokeWeight(1);
  rect(x0, y0, w, h, 4);

  // Header row: tick / fps / speed / state
  const padX = 16;
  textFont('IBM Plex Mono');
  textAlign(LEFT, TOP);

  drawHeaderStat(x0 + padX,         y0 + 14, 'tick',   tick.toString());
  drawHeaderStat(x0 + padX + 80,    y0 + 14, 'fps',    frameRate().toFixed(0));
  drawHeaderStat(x0 + padX + 145,   y0 + 14, 'speed',  '×' + speedMult);
  drawHeaderStat(x0 + padX + 215,   y0 + 14, 'mode',   COLOR_MODES[colorMode]);
  drawHeaderStat(x0 + padX + 290,   y0 + 14, 'state',  paused ? 'paused' : 'live', paused ? COL.pred : COL.plant);

  // Section: population chart
  let cy = y0 + 56;
  drawSectionLabel(x0 + padX, cy, 'POPULATIONS · time series');
  cy += 14;
  drawPopChart(x0 + padX, cy, w - 2 * padX, 122);
  cy += 122 + 8;

  // Population numeric strip
  drawPopStrip(x0 + padX, cy, w - 2 * padX);
  cy += 56;

  // Section: average traits
  drawSectionLabel(x0 + padX, cy, 'AVERAGE TRAITS · evolved');
  cy += 16;
  drawTraitTable(x0 + padX, cy, w - 2 * padX);
}

function drawHeaderStat(x, y, label, val, valColor) {
  noStroke();
  fill(COL.ink3[0], COL.ink3[1], COL.ink3[2]);
  textSize(9);
  text(label.toUpperCase(), x, y);
  if (valColor) fill(valColor[0], valColor[1], valColor[2]);
  else fill(COL.ink[0], COL.ink[1], COL.ink[2]);
  textSize(13);
  text(val, x, y + 12);
}

function drawSectionLabel(x, y, label) {
  noStroke();
  fill(COL.ink3[0], COL.ink3[1], COL.ink3[2]);
  textSize(9);
  text(label, x, y);
  // hairline divider
  stroke(COL.line[0], COL.line[1], COL.line[2]);
  strokeWeight(1);
  const tw = textWidth(label);
  line(x + tw + 8, y + 5, x + 320, y + 5);
}

function drawPopChart(x, y, w, h) {
  // bg + grid
  noStroke();
  fill(7, 8, 13);
  rect(x, y, w, h, 2);
  stroke(COL.axis[0], COL.axis[1], COL.axis[2], 100);
  strokeWeight(1);
  for (let g = 1; g < 4; g++) {
    const yy = y + (g / 4) * h;
    line(x, yy, x + w, yy);
  }
  noFill();
  stroke(COL.line[0], COL.line[1], COL.line[2]);
  rect(x, y, w, h, 2);

  if (history.herb.length < 2) return;

  // Auto-scale
  const plantScaleDiv = 60; // scale plant biomass into a comparable count
  let maxV = 1;
  for (let i = 0; i < history.plant.length; i++) {
    const v = history.plant[i] / plantScaleDiv;
    if (v > maxV) maxV = v;
  }
  for (let i = 0; i < history.herb.length; i++) if (history.herb[i] > maxV) maxV = history.herb[i];
  for (let i = 0; i < history.pred.length; i++) if (history.pred[i] > maxV) maxV = history.pred[i];
  maxV = Math.max(maxV, 50);

  const drawSeries = (data, color, w_, scale) => {
    noFill();
    stroke(color[0], color[1], color[2], 230);
    strokeWeight(1.4);
    beginShape();
    for (let i = 0; i < data.length; i++) {
      const xi = x + (i / Math.max(1, HISTORY_LEN - 1)) * w_;
      const yi = y + h - clamp((data[i] / scale) / maxV, 0, 1) * h;
      vertex(xi, yi);
    }
    endShape();
  };

  drawSeries(history.plant, COL.plant, w, plantScaleDiv);
  drawSeries(history.herb,  COL.herb,  w, 1);
  drawSeries(history.pred,  COL.pred,  w, 1);

  // Y max annotation
  noStroke();
  fill(COL.ink3[0], COL.ink3[1], COL.ink3[2]);
  textSize(9);
  textAlign(RIGHT, TOP);
  text(maxV.toFixed(0), x + w - 6, y + 4);
  textAlign(LEFT, BOTTOM);
  text('t = ' + tick, x + 6, y + h - 4);
  textAlign(LEFT, TOP);
}

function drawPopStrip(x, y, w) {
  const cw = w / 3;
  const items = [
    { label: 'PLANTS',    val: totalPlants().toFixed(0), col: COL.plant },
    { label: 'HERBIV.',   val: herbivores.length,        col: COL.herb  },
    { label: 'PREDATORS', val: predators.length,         col: COL.pred  },
  ];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const cx = x + i * cw;
    noStroke();
    fill(COL.ink3[0], COL.ink3[1], COL.ink3[2]);
    textSize(9);
    text(it.label, cx, y);
    fill(it.col[0], it.col[1], it.col[2]);
    textSize(20);
    text(String(it.val), cx, y + 14);
    // tiny accent line
    stroke(it.col[0], it.col[1], it.col[2], 160);
    strokeWeight(1.5);
    line(cx, y + 40, cx + 28, y + 40);
  }
  noStroke();
}

function totalPlants() {
  let s = 0;
  for (let i = 0; i < GRID_W; i++) {
    const row = plants[i];
    for (let j = 0; j < GRID_H; j++) s += row[j];
  }
  return s;
}

function drawTraitTable(x, y, w) {
  const aH = avgTraits(herbivores);
  const aP = avgTraits(predators);

  const traits = [
    { key: 'speed',  label: 'speed',  hVal: aH.speed,  pVal: aP.speed,  range: [0, 4]    },
    { key: 'vision', label: 'vision', hVal: aH.vision, pVal: aP.vision, range: [0, 12]   },
    { key: 'repro',  label: 'repro',  hVal: aH.repro,  pVal: aP.repro,  range: [0, 0.55] },
    { key: 'eff',    label: 'effic.', hVal: aH.eff,    pVal: aP.eff,    range: [0, 1.5]  },
  ];

  // Column headers
  textAlign(LEFT, TOP);
  textSize(9);
  noStroke();
  fill(COL.ink3[0], COL.ink3[1], COL.ink3[2]);
  text('TRAIT', x, y);
  fill(COL.herb[0], COL.herb[1], COL.herb[2]);
  text('HERBIVORES', x + 70, y);
  fill(COL.pred[0], COL.pred[1], COL.pred[2]);
  text('PREDATORS', x + 200, y);
  y += 14;

  const rowH = 22;
  for (let i = 0; i < traits.length; i++) {
    const t = traits[i];
    drawTraitRow(x, y + i * rowH, w, t);
  }
}

function drawTraitRow(x, y, w, t) {
  noStroke();
  fill(COL.ink2[0], COL.ink2[1], COL.ink2[2]);
  textSize(11);
  textAlign(LEFT, TOP);
  text(t.label, x, y + 4);

  const drawBar = (bx, bw, val, color) => {
    // background track
    noStroke();
    fill(COL.line[0], COL.line[1], COL.line[2]);
    rect(bx, y + 8, bw, 3, 1.5);
    if (!isFinite(val) || isNaN(val)) {
      fill(COL.ink3[0], COL.ink3[1], COL.ink3[2]);
      textSize(11);
      text('—', bx, y + 4);
      return;
    }
    const f = clamp((val - t.range[0]) / (t.range[1] - t.range[0]), 0, 1);
    fill(color[0], color[1], color[2]);
    rect(bx, y + 8, Math.max(2, bw * f), 3, 1.5);
    fill(COL.ink[0], COL.ink[1], COL.ink[2]);
    textSize(11);
    text(val.toFixed(t.key === 'repro' ? 3 : 2), bx, y + 4);
  };

  drawBar(x + 70, 110, t.hVal, COL.herb);
  drawBar(x + 200, 110, t.pVal, COL.pred);
}

// ============================================================
//  CONTROLS / EVENTS
// ============================================================
function buildControls() {
  const root = document.getElementById('controls');
  for (const item of PARAM_LAYOUT) {
    if (item.startsWith('__')) {
      const div = document.createElement('div');
      div.className = 'group-label';
      div.textContent = item.replace('__', '').replace('_', ' ');
      root.appendChild(div);
      continue;
    }
    const p = params[item];
    const wrap = document.createElement('div');
    wrap.className = 'control';
    wrap.innerHTML =
      '<label><span>' + p.label + '</span><span class="v" id="val-' + item + '">' + p.fmt(p.val) + '</span></label>' +
      '<input type="range" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '" value="' + p.val + '">';
    const input = wrap.querySelector('input');
    const valSpan = wrap.querySelector('.v');
    input.addEventListener('input', () => {
      p.val = parseFloat(input.value);
      valSpan.textContent = p.fmt(p.val);
    });
    root.appendChild(wrap);
  }
}

function bindButtons() {
  document.getElementById('btn-pause').addEventListener('click', togglePause);
  document.getElementById('btn-step').addEventListener('click', () => { stepOnce = true; });
  document.getElementById('btn-reset').addEventListener('click', reset);
  document.getElementById('btn-speed').addEventListener('click', cycleSpeed);
  document.getElementById('btn-mode').addEventListener('click', cycleColorMode);
}

function togglePause() {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ Resume' : '⏸ Pause';
}
function cycleSpeed() {
  speedMult = speedMult >= 8 ? 1 : speedMult * 2;
  document.getElementById('btn-speed').textContent = 'Speed ×' + speedMult;
}
function decSpeed() {
  if (speedMult > 1) speedMult /= 2;
  document.getElementById('btn-speed').textContent = 'Speed ×' + speedMult;
}
function cycleColorMode() {
  colorMode = (colorMode + 1) % COLOR_MODES.length;
  document.getElementById('btn-mode').textContent = 'Color: ' + COLOR_MODES[colorMode];
}

function keyPressed() {
  // Don't hijack keys while editing a slider (arrow keys etc.)
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  if (key === ' ') { togglePause(); return false; }
  if (key === 'r' || key === 'R') { reset(); return false; }
  if (key === 's' || key === 'S') { stepOnce = true; return false; }
  if (key === 'v' || key === 'V') { cycleColorMode(); return false; }
  if (key === '+' || key === '=') { cycleSpeed(); return false; }
  if (key === '-' || key === '_') { decSpeed(); return false; }
}
