<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution Ecosystem Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 11px;
            width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 100, 0.3);
            box-shadow: 0 4px 20px rgba(0, 255, 100, 0.1);
        }
        
        #controls h3 {
            margin: 0 0 10px 0;
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
            font-size: 14px;
        }
        
        .control-group {
            margin: 10px 0;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 3px;
            color: #66ff99;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 3px 0;
            accent-color: #00ff66;
        }
        
        .value-display {
            color: #00ffaa;
            float: right;
            font-weight: bold;
        }
        
        button {
            background: linear-gradient(135deg, #00aa44, #00ff66);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px 3px 3px 0;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: linear-gradient(135deg, #00ff66, #66ffaa);
            box-shadow: 0 2px 15px rgba(0, 255, 100, 0.5);
        }
        
        .key {
            display: inline-block;
            background: rgba(0, 255, 100, 0.15);
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
            border: 1px solid rgba(0, 255, 100, 0.4);
        }
        
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 11px;
            width: 250px;
            border: 1px solid rgba(0, 255, 100, 0.3);
        }
        
        #stats canvas {
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .species-stat {
            margin: 5px 0;
            padding: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .plant-color { color: #00ff00; }
        .herbivore-color { color: #00aaff; }
        .predator-color { color: #ff4444; }
    </style>
</head>
<body>
    <div id="controls">
        <h3>🌿 Evolution Ecosystem</h3>
        
        <div class="control-group">
            <strong>Controls:</strong><br>
            <span class="key">R</span> Reset simulation<br>
            <span class="key">Space</span> Pause/Resume<br>
            <span class="key">E</span> Extinction event<br>
            <span class="key">M</span> Mass mutation<br>
            <span class="key">V</span> Toggle vision range<br>
            <span class="key">T</span> Toggle traits view
        </div>
        
        <div class="control-group">
            <label>Mutation Rate:
                <span class="value-display" id="mutationVal">0.05</span>
            </label>
            <input type="range" id="mutationRate" min="0" max="0.2" value="0.05" step="0.01">
        </div>
        
        <div class="control-group">
            <label>Plant Growth Rate:
                <span class="value-display" id="plantGrowthVal">0.08</span>
            </label>
            <input type="range" id="plantGrowth" min="0.01" max="0.2" value="0.08" step="0.01">
        </div>
        
        <div class="control-group">
            <label>Herbivore Birth Rate:
                <span class="value-display" id="herbBirthVal">0.02</span>
            </label>
            <input type="range" id="herbBirth" min="0.005" max="0.1" value="0.02" step="0.005">
        </div>
        
        <div class="control-group">
            <label>Predator Birth Rate:
                <span class="value-display" id="predBirthVal">0.015</span>
            </label>
            <input type="range" id="predBirth" min="0.005" max="0.1" value="0.015" step="0.005">
        </div>
        
        <div class="control-group">
            <label>Energy Transfer Efficiency:
                <span class="value-display" id="energyTransferVal">0.5</span>
            </label>
            <input type="range" id="energyTransfer" min="0.1" max="0.9" value="0.5" step="0.1">
        </div>
        
        <div class="control-group">
            <label>Vision Range Importance:
                <span class="value-display" id="visionImportanceVal">0.3</span>
            </label>
            <input type="range" id="visionImportance" min="0" max="1" value="0.3" step="0.1">
        </div>
        
        <div class="control-group">
            <label>Speed Cost:
                <span class="value-display" id="speedCostVal">0.1</span>
            </label>
            <input type="range" id="speedCost" min="0" max="0.5" value="0.1" step="0.05">
        </div>
        
        <div class="control-group">
            <label>Grid Density:
                <span class="value-display" id="gridDensityVal">100</span>
            </label>
            <input type="range" id="gridDensity" min="50" max="200" value="100" step="10">
        </div>
        
        <div class="control-group">
            <button onclick="resetSimulation()">Reset</button>
            <button onclick="togglePause()">Pause</button>
            <button onclick="addRandomSpecies()">Add Species</button>
            <button onclick="triggerExtinction()">Extinction</button>
        </div>
    </div>
    
    <div id="stats">
        <h3>📊 Population Statistics</h3>
        <div id="population-counts"></div>
        <canvas id="population-graph" width="230" height="120"></canvas>
        <h4>Average Traits</h4>
        <div id="trait-stats"></div>
    </div>

    <script>
        // Organism base class
        class Organism {
            constructor(x, y, traits = {}) {
                this.x = x;
                this.y = y;
                this.age = 0;
                this.energy = 50;
                this.maxEnergy = 100;
                this.alive = true;
                
                // Evolvable traits
                this.traits = {
                    speed: traits.speed || random(0.5, 1.5),
                    visionRange: traits.visionRange || random(2, 5),
                    reproductionRate: traits.reproductionRate || random(0.01, 0.05),
                    efficiency: traits.efficiency || random(0.7, 1.3),
                    size: traits.size || random(0.8, 1.2),
                    colorHue: traits.colorHue || random(0, 360)
                };
            }
            
            mutate(mutationRate) {
                for (let trait in this.traits) {
                    if (random() < mutationRate) {
                        let mutation = randomGaussian(0, 0.1);
                        this.traits[trait] *= (1 + mutation);
                        this.traits[trait] = constrain(this.traits[trait], 0.1, 5);
                    }
                }
            }
            
            move(grid) {
                // Movement based on speed trait
                if (random() < this.traits.speed * 0.5) {
                    let dx = floor(random(-1, 2));
                    let dy = floor(random(-1, 2));
                    
                    let newX = constrain(this.x + dx, 0, grid.width - 1);
                    let newY = constrain(this.y + dy, 0, grid.height - 1);
                    
                    // Energy cost for movement
                    this.energy -= this.traits.speed * speedCostValue * 0.5;
                    
                    this.x = newX;
                    this.y = newY;
                }
            }
            
            update() {
                this.age++;
                // Base energy consumption
                this.energy -= 0.1 * this.traits.size;
                
                if (this.energy <= 0 || this.age > 1000 / this.traits.size) {
                    this.alive = false;
                }
            }
        }
        
        class Plant extends Organism {
            constructor(x, y, traits) {
                super(x, y, traits);
                this.type = 'plant';
                this.energy = 30;
                this.maxEnergy = 60;
                this.growthRate = random(0.05, 0.15);
            }
            
            grow() {
                if (this.energy < this.maxEnergy) {
                    this.energy += this.growthRate * this.traits.efficiency * plantGrowthValue;
                }
            }
            
            canReproduce() {
                return this.energy > this.maxEnergy * 0.8 && random() < this.traits.reproductionRate;
            }
        }
        
        class Herbivore extends Organism {
            constructor(x, y, traits) {
                super(x, y, traits);
                this.type = 'herbivore';
                this.lastEat = 0;
            }
            
            findFood(grid) {
                let vision = floor(this.traits.visionRange);
                let bestFood = null;
                let bestDist = Infinity;
                
                for (let dy = -vision; dy <= vision; dy++) {
                    for (let dx = -vision; dx <= vision; dx++) {
                        let nx = this.x + dx;
                        let ny = this.y + dy;
                        
                        if (nx >= 0 && nx < grid.width && ny >= 0 && ny < grid.height) {
                            let cell = grid.cells[nx][ny];
                            for (let org of cell) {
                                if (org.type === 'plant' && org.alive) {
                                    let dist = abs(dx) + abs(dy);
                                    if (dist < bestDist) {
                                        bestDist = dist;
                                        bestFood = {x: nx, y: ny, org: org};
                                    }
                                }
                            }
                        }
                    }
                }
                
                return bestFood;
            }
            
            eat(plant) {
                let energyGain = plant.energy * energyTransferValue * this.traits.efficiency;
                this.energy = min(this.energy + energyGain, this.maxEnergy);
                plant.alive = false;
                this.lastEat = 0;
            }
            
            moveToward(targetX, targetY) {
                let dx = targetX - this.x;
                let dy = targetY - this.y;
                
                if (abs(dx) > abs(dy)) {
                    this.x += dx > 0 ? 1 : -1;
                } else if (dy !== 0) {
                    this.y += dy > 0 ? 1 : -1;
                }
                
                this.energy -= this.traits.speed * speedCostValue;
            }
            
            canReproduce() {
                return this.energy > this.maxEnergy * 0.7 && random() < this.traits.reproductionRate * herbBirthValue;
            }
        }
        
        class Predator extends Organism {
            constructor(x, y, traits) {
                super(x, y, traits);
                this.type = 'predator';
                this.lastHunt = 0;
            }
            
            findPrey(grid) {
                let vision = floor(this.traits.visionRange);
                let bestPrey = null;
                let bestDist = Infinity;
                
                for (let dy = -vision; dy <= vision; dy++) {
                    for (let dx = -vision; dx <= vision; dx++) {
                        let nx = this.x + dx;
                        let ny = this.y + dy;
                        
                        if (nx >= 0 && nx < grid.width && ny >= 0 && ny < grid.height) {
                            let cell = grid.cells[nx][ny];
                            for (let org of cell) {
                                if (org.type === 'herbivore' && org.alive) {
                                    let dist = abs(dx) + abs(dy);
                                    // Factor in prey size and speed
                                    let catchability = dist + org.traits.speed * visionImportanceValue;
                                    if (catchability < bestDist) {
                                        bestDist = catchability;
                                        bestPrey = {x: nx, y: ny, org: org};
                                    }
                                }
                            }
                        }
                    }
                }
                
                return bestPrey;
            }
            
            hunt(prey) {
                // Success based on speed difference
                let catchProbability = 0.5 + (this.traits.speed - prey.traits.speed) * 0.3;
                catchProbability = constrain(catchProbability, 0.1, 0.9);
                
                if (random() < catchProbability) {
                    let energyGain = prey.energy * energyTransferValue * this.traits.efficiency;
                    this.energy = min(this.energy + energyGain, this.maxEnergy);
                    prey.alive = false;
                    this.lastHunt = 0;
                    return true;
                }
                return false;
            }
            
            moveToward(targetX, targetY) {
                let dx = targetX - this.x;
                let dy = targetY - this.y;
                
                // Predators can move faster
                let moveSpeed = ceil(this.traits.speed);
                for (let i = 0; i < moveSpeed && (dx !== 0 || dy !== 0); i++) {
                    if (abs(dx) > abs(dy)) {
                        this.x += dx > 0 ? 1 : -1;
                        dx += dx > 0 ? -1 : 1;
                    } else {
                        this.y += dy > 0 ? 1 : -1;
                        dy += dy > 0 ? -1 : 1;
                    }
                }
                
                this.energy -= this.traits.speed * speedCostValue * 1.5;
            }
            
            canReproduce() {
                return this.energy > this.maxEnergy * 0.8 && random() < this.traits.reproductionRate * predBirthValue;
            }
        }
        
        class Grid {
            constructor(width, height) {
                this.width = width;
                this.height = height;
                this.cells = [];
                
                for (let x = 0; x < width; x++) {
                    this.cells[x] = [];
                    for (let y = 0; y < height; y++) {
                        this.cells[x][y] = [];
                    }
                }
            }
            
            addOrganism(org) {
                this.cells[org.x][org.y].push(org);
            }
            
            removeOrganism(org) {
                let cell = this.cells[org.x][org.y];
                let index = cell.indexOf(org);
                if (index > -1) {
                    cell.splice(index, 1);
                }
            }
            
            moveOrganism(org, oldX, oldY) {
                let oldCell = this.cells[oldX][oldY];
                let index = oldCell.indexOf(org);
                if (index > -1) {
                    oldCell.splice(index, 1);
                }
                this.cells[org.x][org.y].push(org);
            }
            
            getAllOrganisms() {
                let organisms = [];
                for (let x = 0; x < this.width; x++) {
                    for (let y = 0; y < this.height; y++) {
                        organisms.push(...this.cells[x][y]);
                    }
                }
                return organisms;
            }
        }
        
        // Global variables
        let grid;
        let gridSize = 100;
        let cellSize;
        let isPaused = false;
        let showVision = false;
        let showTraits = false;
        let generation = 0;
        
        // Parameters
        let mutationRateValue = 0.05;
        let plantGrowthValue = 0.08;
        let herbBirthValue = 0.02;
        let predBirthValue = 0.015;
        let energyTransferValue = 0.5;
        let visionImportanceValue = 0.3;
        let speedCostValue = 0.1;
        
        // Statistics
        let populationHistory = {
            plants: [],
            herbivores: [],
            predators: []
        };
        
        function setup() {
            let canvasWidth = windowWidth - 620;
            let canvasHeight = windowHeight - 20;
            createCanvas(canvasWidth, canvasHeight);
            
            cellSize = min(canvasWidth / gridSize, canvasHeight / gridSize);
            
            initializeEcosystem();
            setupControls();
        }
        
        function initializeEcosystem() {
            grid = new Grid(gridSize, gridSize);
            generation = 0;
            
            // Create initial populations
            // Plants
            for (let i = 0; i < gridSize * gridSize * 0.15; i++) {
                let x = floor(random(gridSize));
                let y = floor(random(gridSize));
                grid.addOrganism(new Plant(x, y));
            }
            
            // Herbivores
            for (let i = 0; i < gridSize * gridSize * 0.02; i++) {
                let x = floor(random(gridSize));
                let y = floor(random(gridSize));
                grid.addOrganism(new Herbivore(x, y));
            }
            
            // Predators
            for (let i = 0; i < gridSize * gridSize * 0.005; i++) {
                let x = floor(random(gridSize));
                let y = floor(random(gridSize));
                grid.addOrganism(new Predator(x, y));
            }
            
            // Reset history
            populationHistory.plants = [];
            populationHistory.herbivores = [];
            populationHistory.predators = [];
        }
        
        function draw() {
            background(20, 20, 30);
            
            if (!isPaused) {
                updateEcosystem();
                generation++;
            }
            
            renderGrid();
            
            if (showVision) {
                renderVisionRanges();
            }
            
            // Update statistics every 10 frames
            if (frameCount % 10 === 0) {
                updateStatistics();
            }
        }
        
        function updateEcosystem() {
            let organisms = grid.getAllOrganisms();
            
            // Shuffle for fairness
            organisms = shuffle(organisms);
            
            // Process each organism
            for (let org of organisms) {
                if (!org.alive) continue;
                
                let oldX = org.x;
                let oldY = org.y;
                
                if (org.type === 'plant') {
                    org.grow();
                    
                    // Reproduction
                    if (org.canReproduce()) {
                        let offspring = new Plant(
                            constrain(org.x + floor(random(-1, 2)), 0, gridSize - 1),
                            constrain(org.y + floor(random(-1, 2)), 0, gridSize - 1),
                            {...org.traits}
                        );
                        offspring.mutate(mutationRateValue);
                        grid.addOrganism(offspring);
                        org.energy *= 0.5; // Cost of reproduction
                    }
                    
                } else if (org.type === 'herbivore') {
                    org.lastEat++;
                    
                    // Find and eat plants
                    let food = org.findFood(grid);
                    if (food && abs(food.x - org.x) + abs(food.y - org.y) <= 1) {
                        org.eat(food.org);
                    } else if (food) {
                        org.moveToward(food.x, food.y);
                    } else {
                        org.move(grid);
                    }
                    
                    // Reproduction
                    if (org.canReproduce()) {
                        let offspring = new Herbivore(
                            constrain(org.x + floor(random(-1, 2)), 0, gridSize - 1),
                            constrain(org.y + floor(random(-1, 2)), 0, gridSize - 1),
                            {...org.traits}
                        );
                        offspring.mutate(mutationRateValue);
                        grid.addOrganism(offspring);
                        org.energy *= 0.6;
                    }
                    
                } else if (org.type === 'predator') {
                    org.lastHunt++;
                    
                    // Find and hunt prey
                    let prey = org.findPrey(grid);
                    if (prey && abs(prey.x - org.x) + abs(prey.y - org.y) <= 1) {
                        org.hunt(prey.org);
                    } else if (prey) {
                        org.moveToward(prey.x, prey.y);
                    } else {
                        org.move(grid);
                    }
                    
                    // Reproduction
                    if (org.canReproduce()) {
                        let offspring = new Predator(
                            constrain(org.x + floor(random(-1, 2)), 0, gridSize - 1),
                            constrain(org.y + floor(random(-1, 2)), 0, gridSize - 1),
                            {...org.traits}
                        );
                        offspring.mutate(mutationRateValue);
                        grid.addOrganism(offspring);
                        org.energy *= 0.7;
                    }
                }
                
                // Update organism
                org.update();
                
                // Handle movement in grid
                if (org.x !== oldX || org.y !== oldY) {
                    grid.moveOrganism(org, oldX, oldY);
                }
                
                // Remove dead organisms
                if (!org.alive) {
                    grid.removeOrganism(org);
                }
            }
        }
        
        function renderGrid() {
            // Render each cell
            for (let x = 0; x < gridSize; x++) {
                for (let y = 0; y < gridSize; y++) {
                    let cell = grid.cells[x][y];
                    
                    if (cell.length > 0) {
                        // Find dominant organism in cell
                        let dominant = cell.find(org => org.alive);
                        
                        if (dominant) {
                            let px = x * cellSize;
                            let py = y * cellSize;
                            
                            if (dominant.type === 'plant') {
                                // Green with variation based on traits
                                let brightness = map(dominant.energy, 0, dominant.maxEnergy, 100, 255);
                                fill(0, brightness, 50, 200);
                            } else if (dominant.type === 'herbivore') {
                                // Blue with trait variations
                                if (showTraits) {
                                    colorMode(HSB);
                                    fill(200 + dominant.traits.colorHue * 0.1, 80, 
                                         map(dominant.traits.speed, 0, 3, 50, 100));
                                    colorMode(RGB);
                                } else {
                                    fill(0, map(dominant.energy, 0, dominant.maxEnergy, 100, 200), 255);
                                }
                            } else if (dominant.type === 'predator') {
                                // Red with trait variations
                                if (showTraits) {
                                    let size = map(dominant.traits.size, 0.5, 2, 150, 255);
                                    fill(size, 50, 50);
                                } else {
                                    fill(255, map(dominant.energy, 0, dominant.maxEnergy, 100, 200), 0);
                                }
                            }
                            
                            noStroke();
                            let size = cellSize * (showTraits ? dominant.traits.size : 1);
                            rect(px + (cellSize - size) / 2, py + (cellSize - size) / 2, size, size);
                        }
                    }
                }
            }
        }
        
        function renderVisionRanges() {
            let organisms = grid.getAllOrganisms();
            
            for (let org of organisms) {
                if (org.alive && (org.type === 'herbivore' || org.type === 'predator')) {
                    let px = org.x * cellSize + cellSize / 2;
                    let py = org.y * cellSize + cellSize / 2;
                    
                    noFill();
                    strokeWeight(1);
                    
                    if (org.type === 'herbivore') {
                        stroke(0, 100, 255, 50);
                    } else {
                        stroke(255, 0, 0, 50);
                    }
                    
                    let visionRadius = org.traits.visionRange * cellSize;
                    ellipse(px, py, visionRadius * 2, visionRadius * 2);
                }
            }
        }
        
        function updateStatistics() {
            let counts = {plants: 0, herbivores: 0, predators: 0};
            let traits = {
                herbivores: {speed: [], vision: [], efficiency: []},
                predators: {speed: [], vision: [], efficiency: []}
            };
            
            let organisms = grid.getAllOrganisms();
            
            for (let org of organisms) {
                if (!org.alive) continue;
                
                if (org.type === 'plant') counts.plants++;
                else if (org.type === 'herbivore') {
                    counts.herbivores++;
                    traits.herbivores.speed.push(org.traits.speed);
                    traits.herbivores.vision.push(org.traits.visionRange);
                    traits.herbivores.efficiency.push(org.traits.efficiency);
                } else if (org.type === 'predator') {
                    counts.predators++;
                    traits.predators.speed.push(org.traits.speed);
                    traits.predators.vision.push(org.traits.visionRange);
                    traits.predators.efficiency.push(org.traits.efficiency);
                }
            }
            
            // Update population history
            populationHistory.plants.push(counts.plants);
            populationHistory.herbivores.push(counts.herbivores);
            populationHistory.predators.push(counts.predators);
            
            // Keep history limited
            let maxHistory = 200;
            if (populationHistory.plants.length > maxHistory) {
                populationHistory.plants.shift();
                populationHistory.herbivores.shift();
                populationHistory.predators.shift();
            }
            
            // Update HTML stats
            let statsHtml = `
                <div class="species-stat">
                    <span class="plant-color">🌿 Plants: ${counts.plants}</span>
                </div>
                <div class="species-stat">
                    <span class="herbivore-color">🦌 Herbivores: ${counts.herbivores}</span>
                </div>
                <div class="species-stat">
                    <span class="predator-color">🦁 Predators: ${counts.predators}</span>
                </div>
                <div class="species-stat">
                    Generation: ${generation}
                </div>
            `;
            document.getElementById('population-counts').innerHTML = statsHtml;
            
            // Update trait stats
            let traitHtml = '';
            if (traits.herbivores.speed.length > 0) {
                let avgSpeed = traits.herbivores.speed.reduce((a, b) => a + b) / traits.herbivores.speed.length;
                let avgVision = traits.herbivores.vision.reduce((a, b) => a + b) / traits.herbivores.vision.length;
                traitHtml += `<div class="species-stat herbivore-color">
                    Herbivore Speed: ${avgSpeed.toFixed(2)}<br>
                    Herbivore Vision: ${avgVision.toFixed(2)}
                </div>`;
            }
            if (traits.predators.speed.length > 0) {
                let avgSpeed = traits.predators.speed.reduce((a, b) => a + b) / traits.predators.speed.length;
                let avgVision = traits.predators.vision.reduce((a, b) => a + b) / traits.predators.vision.length;
                traitHtml += `<div class="species-stat predator-color">
                    Predator Speed: ${avgSpeed.toFixed(2)}<br>
                    Predator Vision: ${avgVision.toFixed(2)}
                </div>`;
            }
            document.getElementById('trait-stats').innerHTML = traitHtml;
            
            // Draw population graph
            drawPopulationGraph();
        }
        
        function drawPopulationGraph() {
            let canvas = document.getElementById('population-graph');
            let ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let maxPop = Math.max(
                ...populationHistory.plants,
                ...populationHistory.herbivores,
                ...populationHistory.predators,
                1
            );
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            for (let i = 0; i <= 4; i++) {
                let y = (i / 4) * canvas.height;
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
            
            // Draw population lines
            function drawLine(data, color) {
                if (data.length < 2) return;
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let i = 0; i < data.length; i++) {
                    let x = (i / (maxHistory - 1)) * canvas.width;
                    let y = canvas.height - (data[i] / maxPop) * canvas.height;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            
            drawLine(populationHistory.plants, '#00ff00');
            drawLine(populationHistory.herbivores, '#00aaff');
            drawLine(populationHistory.predators, '#ff4444');
        }
        
        function setupControls() {
            // Mutation rate
            document.getElementById('mutationRate').addEventListener('input', function(e) {
                mutationRateValue = parseFloat(e.target.value);
                document.getElementById('mutationVal').textContent = mutationRateValue.toFixed(2);
            });
            
            // Plant growth
            document.getElementById('plantGrowth').addEventListener('input', function(e) {
                plantGrowthValue = parseFloat(e.target.value);
                document.getElementById('plantGrowthVal').textContent = plantGrowthValue.toFixed(2);
            });
            
            // Herbivore birth
            document.getElementById('herbBirth').addEventListener('input', function(e) {
                herbBirthValue = parseFloat(e.target.value);
                document.getElementById('herbBirthVal').textContent = herbBirthValue.toFixed(3);
            });
            
            // Predator birth
            document.getElementById('predBirth').addEventListener('input', function(e) {
                predBirthValue = parseFloat(e.target.value);
                document.getElementById('predBirthVal').textContent = predBirthValue.toFixed(3);
            });
            
            // Energy transfer
            document.getElementById('energyTransfer').addEventListener('input', function(e) {
                energyTransferValue = parseFloat(e.target.value);
                document.getElementById('energyTransferVal').textContent = energyTransferValue.toFixed(1);
            });
            
            // Vision importance
            document.getElementById('visionImportance').addEventListener('input', function(e) {
                visionImportanceValue = parseFloat(e.target.value);
                document.getElementById('visionImportanceVal').textContent = visionImportanceValue.toFixed(1);
            });
            
            // Speed cost
            document.getElementById('speedCost').addEventListener('input', function(e) {
                speedCostValue = parseFloat(e.target.value);
                document.getElementById('speedCostVal').textContent = speedCostValue.toFixed(2);
            });
            
            // Grid density
            document.getElementById('gridDensity').addEventListener('input', function(e) {
                gridSize = parseInt(e.target.value);
                document.getElementById('gridDensityVal').textContent = gridSize;
                cellSize = min(width / gridSize, height / gridSize);
                initializeEcosystem();
            });
        }
        
        function keyPressed() {
            switch(key.toLowerCase()) {
                case 'r':
                    resetSimulation();
                    break;
                case ' ':
                    togglePause();
                    break;
                case 'e':
                    triggerExtinction();
                    break;
                case 'm':
                    massMutation();
                    break;
                case 'v':
                    showVision = !showVision;
                    break;
                case 't':
                    showTraits = !showTraits;
                    break;
            }
        }
        
        function resetSimulation() {
            initializeEcosystem();
        }
        
        function togglePause() {
            isPaused = !isPaused;
        }
        
        function addRandomSpecies() {
            let type = random(['plant', 'herbivore', 'predator']);
            for (let i = 0; i < 20; i++) {
                let x = floor(random(gridSize));
                let y = floor(random(gridSize));
                
                let org;
                if (type === 'plant') org = new Plant(x, y);
                else if (type === 'herbivore') org = new Herbivore(x, y);
                else org = new Predator(x, y);
                
                grid.addOrganism(org);
            }
        }
        
        function triggerExtinction() {
            // Random extinction event
            let organisms = grid.getAllOrganisms();
            for (let org of organisms) {
                if (random() < 0.7) {
                    org.alive = false;
                }
            }
        }
        
        function massMutation() {
            // Trigger mass mutation event
            let organisms = grid.getAllOrganisms();
            for (let org of organisms) {
                if (org.alive) {
                    org.mutate(0.5); // High mutation rate
                }
            }
        }
        
        // Helper function
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }
    </script>
</body>
</html>
