<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Carlo Ecosystem Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#080c14;color:#c9d1d9;font:13px/1.55 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;overflow-x:hidden}
#root{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px}
#sim-wrap{border:1px solid #1c2333;border-radius:8px;overflow:hidden}
#panel{width:290px;display:flex;flex-direction:column;gap:8px;max-height:570px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#1c2333 #080c14}
#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-track{background:#080c14}#panel::-webkit-scrollbar-thumb{background:#1c2333;border-radius:3px}
.card{background:#0d1117;border:1px solid #1c2333;border-radius:8px;padding:10px 12px}
.card h3{font-size:12px;font-weight:600;color:#8b949e;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.sr{display:flex;align-items:center;margin-bottom:3px}
.sr label{flex:0 0 110px;font-size:11px;color:#8b949e}
.sr input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:#1c2333;border-radius:2px;outline:none}
.sr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#388bfd;cursor:pointer;border:none}
.sr .v{width:38px;text-align:right;font:11px 'SF Mono',Consolas,monospace;color:#58a6ff}
.btn{padding:5px 12px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#c9d1d9;font-size:12px;cursor:pointer;transition:background .15s}
.btn:hover{background:#30363d}
#bottom{width:100%;display:flex;justify-content:center;gap:8px;padding:0 8px 8px;flex-wrap:wrap}
#bottom .card{flex:1;max-width:680px;min-width:300px}
.pn{display:flex;align-items:center;margin-bottom:4px}
.dot{width:9px;height:9px;border-radius:50%;margin-right:6px;flex-shrink:0}
.pl{flex:0 0 78px;font-size:11px;color:#8b949e}
.pv{font:12px 'SF Mono',Consolas,monospace;color:#e6edf3}
.pbar{flex:1;height:5px;background:#1c2333;border-radius:3px;margin-left:6px;overflow:hidden}
.pbar-i{height:100%;border-radius:3px;transition:width .3s}
.kbd{display:inline-block;padding:1px 5px;border:1px solid #30363d;border-radius:3px;font:10px 'SF Mono',Consolas,monospace;color:#8b949e;background:#161b22;margin:0 1px}
</style>
</head>
<body>
<div id="root">
<div id="sim-wrap"></div>
<div id="panel"></div>
<div id="bottom">
  <div class="card"><h3>Population Trends<span style="font-size:10px;font-weight:400;color:#484f58">last 600 ticks</span></h3><canvas id="gc1" height="150"></canvas></div>
  <div class="card"><h3>Average Traits<span style="font-size:10px;font-weight:400;color:#484f58">herbivore · predator</span></h3><canvas id="gc2" height="150"></canvas></div>
  <div class="card"><h3>Distribution<span style="font-size:10px;font-weight:400;color:#484f58">speed × vision</span></h3><canvas id="gc3" height="150"></canvas></div>
</div>
</div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   Monte Carlo Ecosystem Simulation
   Plants · Herbivores · Predators with evolving traits
   ═══════════════════════════════════════════════════════════════════ */
'use strict';

/* ── Constants ───────────────────────────────────────────────── */
const COLS=160,ROWS=100,CELL=6,PW=300,HMAX=600,PMAX=4000;
const CW=COLS*CELL,CH=ROWS*CELL;

/* ── Helpers ─────────────────────────────────────────────────── */
function wmod(v,m){return((v%m)+m)%m}
function wdist(a,b,c,d){let dx=Math.abs(a-c),dy=Math.abs(b-d);dx=Math.min(dx,COLS-dx);dy=Math.min(dy,ROWS-dy);return Math.sqrt(dx*dx+dy*dy)}
function hsb(h,s,b){return('hsl('+h+','+s+'%,'+b+'%)')}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function lerpc(a,b,t){return a+(b-a)*t}

function hcol(sp){return hsb(lerpc(220,0,clamp(sp/1.5,0,1)),78,58)}
function pcol(vi){return hsb(lerpc(30,4,clamp(vi/10,0,1)),88,52)}

/* ═══════════════════════════════════════════════════════════════
   SIMULATION CLASS
   ═══════════════════════════════════════════════════════════════ */
class Sim{
  constructor(){
    this.grid=[];this.ag=[];this.pr=[];
    this.paused=false;this.tick=0;this.gen=1;
    this.sel=-1;this.selT='';
    this.infoPanel=false;
    this.hist=[];this.tHist=[];
    this.cfg={mR:.03,pGR:.004,iPl:400,iHb:120,iPd:25,iEn:100,mC:.07};
    this.st={pl:0,hb:0,pd:0,ahS:0,ahV:0,apV:0,apS:0,age:0,aen:0,hn:0,pn:0};
    this._initGrid();this._initAgents();
  }

  /* ── Init ─────────────────────────────────────────────────── */
  _initGrid(){this.grid=[];for(let r=0;r<ROWS;r++){this.grid[r]=new Uint8Array(COLS);for(let c=0;c<COLS;c++)this.grid[r][c]=0}}
  _initAgents(){
    this.ag=[];this.pr=[];
    const mg=Math.max(1,Math.floor(ROWS*.15)),cen=ROWS*.5;
    for(let i=0,n=Math.min(this.cfg.iPl,PMAX);i<n;i++){
      const r=Math.random()>.25?(cen+(Math.random()-.5)*ROWS*.55|0):(Math.random()*ROWS|0);
      const c=Math.random()*COLS|0;
      const rr=wmod(r,ROWS),cc=wmod(c,COLS);
      if(!this.grid[rr][cc]){this.grid[rr][cc]=1}
    }
    for(let i=0;i<this.cfg.iHb&&this.ag.length<HMAX;i++){
      this.ag.push({x:Math.random()*COLS,y:Math.random()*ROWS,
        e:this.cfg.iEn*(.7+Math.random()*.6),
        v:2.5+Math.random()*4,s:.25+Math.random()*.7,
        rt:55+Math.random()*110,sz:.65+Math.random()*.55,mt:.08+Math.random()*.2,g:1});
    }
    for(let i=0;i<this.cfg.iPd&&this.pr.length<250;i++){
      this.pr.push({x:Math.random()*COLS,y:Math.random()*ROWS,
        e:this.cfg.iEn*1.6*(.7+Math.random()*.6),
        v:3.5+Math.random()*5,s:.35+Math.random()*.7,
        rt:70+Math.random()*130,sz:1+Math.random()*.5,mt:.1+Math.random()*.2,g:1});
    }
  }

  reset(){this.tick=0;this.gen=1;this.hist=[];this.tHist=[];this.sel=-1;this._initGrid();this._initAgents()}

  /* ── Stats ────────────────────────────────────────────────── */
  _stats(){
    let hS=0,hV=0,pV=0,pS=0,hE=0,pE=0;
    const hn=this.ag.length,pn=this.pr.length;
    for(const a of this.ag){hS+=a.s;hV+=a.v;hE+=a.e}
    for(const a of this.pr){pV+=a.v;pS+=a.s;pE+=a.e}
    let pl=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(this.grid[r][c])pl++;
    this.st={pl,hb:hn,pd:pn,
      ahS:hn?hS/hn:.5,ahV:hn?hV/hn:3,
      apV:pn?pV/pn:5,apS:pn?pS/pn:.5,
      age:(hn?hE/hn:0)+(pn?pE/pn:0),
      aen:hn?(hE/hn):0,hn,pn};
    if(this.tick%5===0){
      this.hist.push({t:this.tick,p:pl,h:hn,d:pn});
      if(this.hist.length>HMAX)this.hist.shift();
      this.tHist.push({t:this.tick,hs:this.st.ahS,hv:this.st.ahV,pv:this.st.apV,ps:this.st.apS});
      if(this.tHist.length>HMAX)this.tHist.shift();
    }
  }

  /* ── Mutation ─────────────────────────────────────────────── */
  _mut(par){
    const m=this.cfg.mR;
    return{
      x:par.x,y:par.y,e:par.e*.45,
      v:clamp(par.v+gauss()*m*.35,.5,11),
      s:clamp(par.s+gauss()*m*.12,.05,1.5),
      rt:clamp(par.rt+gauss()*m*8,20,260),
      sz:clamp(par.sz+gauss()*m*.08,.3,2.2),
      mt:clamp(par.mt+gauss()*m*.03,.02,.4),g:par.g+1
    };
  }

  /* ── Clusters ─────────────────────────────────────────────── */
  _surroundings(x,y){
    let pl=0,he=0,pr=0;const vr=6;
    for(const a of this.ag)if(wdist(x,y,a.x,a.y)<vr)he++;
    for(const a of this.pr)if(wdist(x,y,a.x,a.y)<vr)pr++;
    const gx=Math.round(x),gy=Math.round(y);
    for(let dr=-3;dr<=3;dr++)for(let dc=-3;dc<=3;dc++){
      const r2=wmod(gy+dr,ROWS),c2=wmod(gx+dc,COLS);
      if(this.grid[r2][c2])pl++;
    }
    return{pl,he,pr};
  }

  /* ── Herbivore action ─────────────────────────────────────── */
  _hAct(a,idx){
    const en=a.e;
    if(en<=0)return false;
    const sur=this._surroundings(a.x,a.y);

    // flee predators
    let fx=0,fy=0,flee=false;
    for(const p of this.pr){
      const d=wdist(a.x,a.y,p.x,p.y);
      if(d<a.v&&d>.1){const dx=a.x-p.x,dy=a.y-p.y,dd=Math.sqrt(dx*dx+dy*dy)||1;fx+=dx/dd;fy+=dy/dd;flee=true}
    }
    if(flee){
      const fl=Math.sqrt(fx*fx+fy*fy)||1;
      const mx=(fx/fl)*a.s*1.6,my=(fy/fl)*a.s*1.6;
      a.x=wmod(a.x+mx,COLS);a.y=wmod(a.y+my,ROWS);
      a.e-=a.mt*1.3-a.sz*.008;
      return a.e>0;
    }

    // eat plants
    const gx=Math.round(a.x),gy=Math.round(a.y);
    const gr=wmod(gy,ROWS),gc=wmod(gx,COLS);
    if(this.grid[gr][gc]&&en<a.rt*1.3){
      this.grid[gr][gc]=0;a.e+=32;
      if(this.st.pl>PMAX*.3)a.e+=8;
    }

    // move toward food or randomly
    let tx=a.x,ty=a.y,found=false;
    const vr=Math.max(1,Math.round(a.v));
    for(let att=0;att<8;att++){
      const dr=Math.floor(Math.random()*(vr*2+1))-vr;
      const dc=Math.floor(Math.random()*(vr*2+1))-vr;
      if(!dr&&!dc)continue;
      const tr=wmod(Math.round(a.y)+dr,ROWS),tc=wmod(Math.round(a.x)+dc,COLS);
      if(this.grid[tr][tc]){tx=wmod(a.x+dc,COLS);ty=wmod(a.y+dr,ROWS);found=true;break}
    }
    if(!found){tx=wmod(a.x+(Math.random()-.5)*2,COLS);ty=wmod(a.y+(Math.random()-.5)*2,ROWS)}
    a.x=tx;a.y=ty;
    a.e-=a.mt+a.sz*.012+(sur.he>3?.015*sur.he:0);

    // reproduce
    if(a.e>a.rt&&this.ag.length<HMAX&&Math.random()<.008){
      this.ag.push(this._mut(a));a.e*=.5;
    }
    return a.e>0;
  }

  /* ── Predator action ──────────────────────────────────────── */
  _pAct(a,idx){
    const en=a.e;
    if(en<=0)return false;

    // hunt herbivores
    let tx=a.x,ty=a.y,found=false;
    for(const h of this.ag){
      if(wdist(a.x,a.y,h.x,h.y)<a.v){tx=h.x;ty=h.y;found=true;break}
    }
    let mx,my;
    if(found){
      const dx=tx-a.x,dy=ty-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      mx=(dx/d)*a.s*1.4;my=(dy/d)*a.s*1.4;
    }else{
      mx=(Math.random()-.5)*2*a.s;my=(Math.random()-.5)*2*a.s;
    }
    a.x=wmod(a.x+mx,COLS);a.y=wmod(a.y+my,ROWS);
    a.e-=a.mt*.85+a.sz*.008;

    // attack
    let caught=-1;
    for(let i=0;i<this.ag.length;i++){
      if(wdist(a.x,a.y,this.ag[i].x,this.ag[i].y)<a.sz+.7){caught=i;break}
    }
    if(caught>=0){
      const prey=this.ag[caught];
      if(Math.random()>.25){a.e+=prey.e*.35+22;this.ag.splice(caught,1)}
    }

    // reproduce
    if(a.e>a.rt&&this.pr.length<250&&Math.random()<.004){
      this.pr.push(this._mut(a));a.e*=.5;
    }
    return a.e>0;
  }

  /* ── Main step ────────────────────────────────────────────── */
  step(){
    if(this.paused)return;
    this.tick++;
    if(this.tick%1200===0)this.gen++;

    // plants spread
    const pGR=this.cfg.pGR;
    if(this.st.pl<PMAX){
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        if(this.grid[r][c]&&Math.random()<pGR){
          const dr=(Math.random()*3|0)-1,dc=(Math.random()*3|0)-1;
          if(!dr&&!dc)continue;
          const nr=wmod(r+dr,ROWS),nc=wmod(c+dc,COLS);
          if(!this.grid[nr][nc])this.grid[nr][nc]=1;
        }
      }
    }

    // herbivores
    for(let i=0;i<this.ag.length;i++){if(Math.random()<this.ag[i].s)this._hAct(this.ag[i],i)}
    this.ag=this.ag.filter(a=>a.e>0);

    // predators
    for(let i=0;i<this.pr.length;i++){if(Math.random()<this.pr[i].s)this._pAct(this.pr[i],i)}
    this.pr=this.pr.filter(a=>a.e>0);

    // cull overflow
    while(this.ag.length>HMAX)this.ag.splice(Math.random()*this.ag.length|0,1);
    let pl=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(this.grid[r][c])pl++;
    while(pl>PMAX){const r=Math.random()*ROWS|0,c=Math.random()*COLS|0;if(this.grid[r][c]){this.grid[r][c]=0;pl--}}

    this._stats();
  }

  /* ── Render main view ─────────────────────────────────────── */
  drawMain(cv){
    cv.background(10,14,22);

    // plants
    const ps=Math.max(2,CELL-1);
    for(let r=0;r<ROWS;r++){
      const ro=r*CELL;
      for(let c=0;c<COLS;c++){
        if(!this.grid[r][c])continue;
        const s=38+((r*7+c*13)&31);
        cv.fill(75,s,32);
        cv.rect(c*CELL+(CELL-ps)/2,ro+(CELL-ps)/2,ps,ps);
      }
    }

    // herbivores
    for(const a of this.ag){
      const sz=Math.max(3.5,(CELL-1)*a.sz*.82);
      cv.fill(hcol(a.s));cv.noStroke();
      cv.ellipse(a.x*CELL,a.y*CELL,sz,sz);
    }

    // predators
    for(const a of this.pr){
      const sz=Math.max(5,(CELL+1)*a.sz*.7);
      cv.fill(pcol(a.v));cv.noStroke();
      const px=a.x*CELL,py=a.y*CELL;
      cv.beginShape();
      cv.vertex(px,py-sz*.85);cv.vertex(px+sz*.6,py+sz*.35);
      cv.vertex(px+sz*.18,py+sz*.15);cv.vertex(px,py+sz*.6);
      cv.vertex(px-sz*.18,py+sz*.15);cv.vertex(px-sz*.6,py+sz*.35);
      cv.endShape(cv.CLOSE);
    }

    // selection ring
    if(this.sel>=0){
      let a=null;
      if(this.selT==='h'&&this.sel<this.ag.length)a=this.ag[this.sel];
      if(this.selT==='p'&&this.sel<this.pr.length)a=this.pr[this.sel];
      if(a){
        cv.noFill();cv.stroke(255,255,90,200);cv.strokeWeight(2);
        cv.ellipse(a.x*CELL,a.y*CELL,24,24);
        cv.stroke(255,255,90,70);cv.strokeWeight(1);
        cv.ellipse(a.x*CELL,a.y*CELL,34,34);
      }
    }

    // tick
    cv.noStroke();cv.fill(255,255,255,30);cv.textSize(10);cv.textAlign(cv.RIGHT,cv.BOTTOM);
    cv.text('t='+this.tick+'  g='+this.gen,CW-6,CH-3);
  }

  /* ── Render pop graph ─────────────────────────────────────── */
  drawPopGraph(cv){
    const w=cv.width,h=cv.height;cv.background(10,14,22);
    const data=this.hist;if(data.length<2)return;
    const mx=Math.max(1,...data.map(d=>Math.max(d.h*5,d.d*2,d.p/3)));
    cv.noFill();cv.stroke(25,32,44);cv.strokeWeight(.5);
    for(let i=1;i<=4;i++){const y=h*.08+i/5*(h*.82);cv.line(32,y,w-6,y)}
    function line(key,col,sc){
      cv.stroke(col);cv.strokeWeight(1.6);cv.noFill();cv.beginShape();
      for(let i=0;i<data.length;i++){
        const x=32+(i/(data.length-1))*(w-38);
        const y=h*.9-Math.min(data[i][key]*sc,mx)/mx*(h*.82);
        cv.vertex(x,y);
      }cv.endShape();
    }
    line('h','rgba(130,220,130,0.9)',5);
    line('d','rgba(255,175,85,0.9)',2);
    line('p','rgba(110,170,255,0.75)',1/3);
    cv.noStroke();cv.textSize(9);cv.textAlign(cv.LEFT,cv.TOP);
    cv.fill(130,220,130,.7);cv.text('Herbivores',36,6);
    cv.fill(255,175,85,.7);cv.text('Predators',122,6);
    cv.fill(110,170,255,.6);cv.text('Plants ÷3',204,6);
  }

  /* ── Render trait graph ───────────────────────────────────── */
  drawTraitGraph(cv){
    const w=cv.width,h=cv.height;cv.background(10,14,22);
    const data=this.tHist;if(data.length<2)return;
    cv.noFill();cv.stroke(25,32,44);cv.strokeWeight(.5);
    for(let i=1;i<=4;i++){const y=h*.08+i/5*(h*.82);cv.line(32,y,w-6,y)}
    function tl(key,col){
      cv.stroke(col);cv.strokeWeight(1.3);cv.noFill();cv.beginShape();
      for(let i=0;i<data.length;i++){
        const x=32+(i/(data.length-1))*(w-38);
        const y=h*.9-(data[i][key]/1.5)*(h*.82);
        cv.vertex(x,y);
      }cv.endShape();
    }
    tl('hs','rgba(130,220,130,0.85)');
    tl('hv','rgba(180,255,180,0.55)');
    tl('ps','rgba(255,175,85,0.85)');
    tl('pv','rgba(255,220,150,0.55)');
    cv.noStroke();cv.textSize(9);cv.textAlign(cv.LEFT,cv.TOP);
    cv.fill(130,220,130,.7);cv.text('H-Speed',36,4);
    cv.fill(180,255,180,.45);cv.text('H-Vision',36,16);
    cv.fill(255,175,85,.7);cv.text('P-Speed',118,4);
    cv.fill(255,220,150,.45);cv.text('P-Vision',118,16);
  }

  /* ── Render distribution ──────────────────────────────────── */
  drawDistGraph(cv){
    const w=cv.width,h=cv.height;cv.background(10,14,22);
    const m={t:20,r:8,b:28,l:32};
    const gw=w-m.l-m.r,gh=h-m.t-m.b;

    // axes
    cv.stroke(35,42,56);cv.strokeWeight(1);
    cv.line(m.l,h-m.b,w-m.r,h-m.b);
    cv.line(m.l,m.t,m.l,h-m.b);
    cv.noStroke();cv.fill(70,78,92);cv.textSize(9);
    cv.textAlign(cv.CENTER,cv.TOP);cv.text('Speed →',m.l+gw/2,h-m.b+4);
    cv.textAlign(cv.RIGHT,cv.CENTER);cv.text('Vis',m.l-4,m.t+gh/2);

    // heat map for herbivores
    const bs=6;
    const bw=Math.ceil(gw/bs),bh=Math.ceil(gh/bs);
    const hm=[];for(let i=0;i<bw*bh;i++)hm[i]=0;
    for(const a of this.ag){
      const bx=Math.floor(a.s/1.5*clamp(bw-1,0,bw-1));
      const by=Math.floor(a.v/11*clamp(bh-1,0,bh-1));
      if(bx>=0&&bx<bw&&by>=0&&by<bh)hm[by*bw+bx]++;
    }
    const mx=Math.max(1,...hm);
    for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
      const v=hm[by*bw+bx]/mx;if(v<.02)continue;
      cv.fill(75,lerpc(30,85,v),32,lerpc(15,220,v));
      cv.noStroke();
      cv.rect(m.l+bx*bs,h-m.b-(by+1)*bs,bs-1,bs-1);
    }

    // predators as dots
    for(const a of this.pr){
      const px=m.l+a.s/1.5*gw;
      const py=h-m.b-a.v/11*gh;
      cv.fill(255,175,85,.6);cv.noStroke();
      cv.ellipse(px,py,3.5,3.5);
    }

    cv.noStroke();cv.fill(70,78,92);cv.textSize(9);
    cv.textAlign(cv.LEFT,cv.TOP);cv.text('● Herbivores (green heat)',m.l+4,m.t+2);
    cv.fill(255,175,85,.6);cv.text('● Predators (dots)',m.l+4,m.t+15);
  }
}

/* ═══════════════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════════════ */

const sim=new Sim();
let panelVisible=true;

function buildPanel(){
  const el=document.getElementById('panel');
  function sl(lab,key,lo,hi,st,cb){
    return`<div class="sr"><label>${lab}</label><input type="range" min="${lo}" max="${hi}" step="${st}" value="${sim.cfg[key]}" id="s_${key}" oninput="sim.cfg['${key}']=parseFloat(this.value);if(${cb?1:0})${cb}()"><span class="v" id="v_${key}">${sim.cfg[key]}</span></div>`;
  }
  el.innerHTML=`
  <div class="card">
    <h3>🌍 Ecosystem<span class="kbd">Gen ${sim.gen}</span></h3>
    <div class="pn"><span class="dot" style="background:#4d8"></span><span class="pl">Plants</span><span class="pv" id="sp">${sim.st.pl}</span><div class="pbar"><div class="pbar-i" id="pbp" style="background:#4d8;width:0%"></div></div></div>
    <div class="pn"><span class="dot" style="background:#e96"></span><span class="pl">Herbivores</span><span class="pv" id="sh">${sim.st.hb}</span><div class="pbar"><div class="pbar-i" id="pbh" style="background:#e96;width:0%"></div></div></div>
    <div class="pn"><span class="dot" style="background:#f64"></span><span class="pl">Predators</span><span class="pv" id="sd">${sim.st.pd}</span><div class="pbar"><div class="pbar-i" id="pbd" style="background:#f64;width:0%"></div></div></div>
  </div>
  <div class="card">
    <h3>🧬 Evolution<span class="kbd">mut ${sim.cfg.mR}</span></h3>
    <div id="tb" style="font-size:11px;line-height:1.7;color:#8b949e">
      <div style="color:#4d8;font-weight:600;margin-bottom:2px">Herbivore Avg</div>
      <div id="ths">Speed: —</div><div id="thv">Vision: —</div><div id="the">Energy: —</div>
      <div style="color:#f64;font-weight:600;margin:6px 0 2px">Predator Avg</div>
      <div id="tpv">Vision: —</div><div id="tps">Speed: —</div><div id="tpe">Energy: —</div>
    </div>
  </div>
  <div class="card"><h3>🎯 Selected Agent</h3><div id="si" style="font-size:11px;color:#484f58">Click an agent to inspect</div></div>
  <div class="card"><h3>⚙️ Parameters</h3>
    ${sl('Mutation rate','mR',.005,.2,.005)}
    ${sl('Plant growth','pGR',.001,.02,.001)}
    ${sl('Init plants','iPl',50,1500,50)}
    ${sl('Init herbivores','iHb',10,400,10)}
    ${sl('Init predators','iPd',0,100,5)}
    ${sl('Start energy','iEn',30,300,10)}
    ${sl('Carrying cap','mC',.3,1,.05)}
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="btn" onclick="sim.reset()">⟳ Reset</button>
      <button class="btn" id="pb" onclick="sim.paused=!sim.paused;document.getElementById('pb').textContent=sim.paused?'▶ Play':'⏸ Pause'">⏸ Pause</button>
    </div>
  </div>
  <div class="card" style="font-size:10px;color:#484f58;line-height:1.7">
    <span class="kbd">Space</span> pause · <span class="kbd">R</span> reset · <span class="kbd">I</span> info<br>
    <span class="kbd">Click</span> agent inspect · drag near agent to move it<br>
    Traits mutate on reproduction → colour / size evolve
  </div>`;

  // wire sliders
  document.querySelectorAll('#panel input[type=range]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const k=inp.id.replace('s_','');
      sim.cfg[k]=parseFloat(inp.value);
      const vEl=document.getElementById('v_'+k);
      if(vEl)vEl.textContent=inp.value;
    });
  });
}

function updateStats(){
  const s=sim.st;
  const el=id=>document.getElementById(id);
  if(el('sp'))el('sp').textContent=s.pl;
  if(el('sh'))el('sh').textContent=s.hb;
  if(el('sd'))el('sd').textContent=s.pd;
  if(el('pbp'))el('pbp').style.width=(s.pl/PMAX*100)+'%';
  if(el('pbh'))el('pbh').style.width=(s.hb/HMAX*100)+'%';
  if(el('pbd'))el('pbd').style.width=(s.pd/250*100)+'%';

  const sc=v=>v<.35?'#79c0ff':v<.7?'#7ee787':v<1?'#ffa657':'#ff7b72';
  const vc=v=>v<3?'#79c0ff':v<6?'#7ee787':v<9?'#ffa657':'#ff7b72';

  if(el('ths'))el('ths').innerHTML='Speed: <span style="color:'+sc(s.ahS)+'">'+s.ahS.toFixed(3)+'</span>';
  if(el('thv'))el('thv').innerHTML='Vision: <span style="color:'+vc(s.ahV)+'">'+s.ahV.toFixed(1)+'</span>';
  if(el('the'))el('the').textContent='Energy: '+(s.aen? s.aen.toFixed(0):'—');
  if(el('tpv'))el('tpv').innerHTML='Vision: <span style="color:'+vc(s.apV)+'">'+s.apV.toFixed(1)+'</span>';
  if(el('tps'))el('tps').innerHTML='Speed: <span style="color:'+sc(s.apS)+'">'+s.apS.toFixed(3)+'</span>';
  if(el('tpe'))el('tpe').textContent='Energy: —';
}

function updateSelected(){
  const el=document.getElementById('si');if(!el)return;
  if(sim.sel<0){el.innerHTML='<span style="color:#484f58">Click an agent to inspect</span>';return}
  let a=null;
  if(sim.selT==='h'&&sim.sel<sim.ag.length)a=sim.ag[sim.sel];
  if(sim.selT==='p'&&sim.sel<sim.pr.length)a=sim.pr[sim.sel];
  if(!a){sim.sel=-1;el.innerHTML='<span style="color:#484f58">Agent died</span>';return}
  const isH=sim.selT==='h';
  el.innerHTML=`
    <div style="color:${isH?'#7ee787':'#ffa657'};font-weight:600;margin-bottom:3px">
      ${isH?'🐇 Herbivore':'🦊 Predator'} #${sim.sel} · Gen ${a.g}</div>
    <div>Energy: <b>${a.e.toFixed(0)}</b></div>
    <div>Speed: <b style="color:${sc(a.s)}">${a.s.toFixed(3)}</b></div>
    <div>Vision: <b style="color:${vc(a.v)}">${a.v.toFixed(1)}</b></div>
    <div>Repr thresh: <b>${a.rt.toFixed(0)}</b></div>
    <div>Size: <b>${a.sz.toFixed(2)}</b></div>
    <div>Metabolism: <b>${a.mt.toFixed(3)}</b></div>
    <div>Pos: (${a.x.toFixed(1)}, ${a.y.toFixed(1)})</div>`;
  function sc(v){return v<.35?'#79c0ff':v<.7?'#7ee787':v<1?'#ffa657':'#ff7b72'}
  function vc(v){return v<3?'#79c0ff':v<6?'#7ee787':v<9?'#ffa657':'#ff7b72'}
}

/* ═══════════════════════════════════════════════════════════════
   P5.JS
   ═══════════════════════════════════════════════════════════════ */

let dragging=null,dragIdx=-1;

function setup(){
  const cv=createCanvas(CW,CH);
  cv.parent('sim-wrap');
  cv.mousePressed(function(){
    const gx=mouseX/CELL,gy=mouseY/CELL;
    let bestD=6,bestI=-1,bestT='';
    for(let i=0;i<sim.ag.length;i++){
      const d=Math.sqrt((gx-sim.ag[i].x)**2+(gy-sim.ag[i].y)**2);
      if(d<bestD){bestD=d;bestI=i;bestT='h'}
    }
    for(let i=0;i<sim.pr.length;i++){
      const d=Math.sqrt((gx-sim.pr[i].x)**2+(gy-sim.pr[i].y)**2);
      if(d<bestD+.5){bestD=d;bestI=i;bestT='p'}
    }
    sim.sel=bestI;sim.selT=bestT;
    if(bestI>=0){dragging=bestT;dragIdx=bestI}
  });

  buildPanel();
  const gc1=document.getElementById('gc1');
  const gc2=document.getElementById('gc2');
  const gc3=document.getElementById('gc3');
  gc1.width=Math.min(660,gc1.parentElement.clientWidth-24);
  gc2.width=Math.min(660,gc2.parentElement.clientWidth-24);
  gc3.width=Math.min(660,gc3.parentElement.clientWidth-24);
}

function draw(){
  sim.step();
  sim.drawMain(window);     // uses p5 global canvas
  updateStats();
  if(frameCount%8===0)updateSelected();

  // dragging
  if(mouseIsPressed&&dragging){
    const gx=mouseX/CELL,gy=mouseY/CELL;
    if(dragging==='h'&&dragIdx<sim.ag.length){
      sim.ag[dragIdx].x=gx;sim.ag[dragIdx].y=gy;
    }
    if(dragging==='p'&&dragIdx<sim.pr.length){
      sim.pr[dragIdx].x=gx;sim.pr[dragIdx].y=gy;
    }
  }
  if(!mouseIsPressed){dragging=null;dragIdx=-1}

  // graphs
  const c1=document.getElementById('gc1');
  const c2=document.getElementById('gc2');
  const c3=document.getElementById('gc3');
  if(c1){const x1=c1.getContext('2d');sim.drawPopGraph(x1)}
  if(c2){const x2=c2.getContext('2d');sim.drawTraitGraph(x2)}
  if(c3){const x3=c3.getContext('2d');sim.drawDistGraph(x3)}

  // update slider displays
  if(frameCount%10===0){
    for(const k of['mR','pGR','iPl','iHb','iPd','iEn','mC']){
      const el=document.getElementById('v_'+k);
      if(el)el.textContent=sim.cfg[k];
    }
  }
}

function keyPressed(){
  if(key===' '){sim.paused=!sim.paused;const b=document.getElementById('pb');if(b)b.textContent=sim.paused?'▶ Play':'⏸ Pause';return false}
  if(key==='r'||key==='R')sim.reset();
  if(key==='i'||key==='I')sim.infoPanel=!sim.infoPanel;
}

window.addEventListener('resize',()=>{
  const gc1=document.getElementById('gc1');
  const gc2=document.getElementById('gc2');
  const gc3=document.getElementById('gc3');
  if(gc1)gc1.width=Math.min(660,gc1.parentElement.clientWidth-24);
  if(gc2)gc2.width=Math.min(660,gc2.parentElement.clientWidth-24);
  if(gc3)gc3.width=Math.min(660,gc3.parentElement.clientWidth-24);
});
</script>
