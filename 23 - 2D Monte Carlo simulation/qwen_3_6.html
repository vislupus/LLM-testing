<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSim: Monte Carlo Ecosystem Evolution</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0f14; color: #e0e8f0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; }
    #sim-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; background: #05080c; position: relative; }
    canvas { box-shadow: 0 0 25px rgba(0, 255, 200, 0.08); border-radius: 4px; }
    
    #panel {
      width: 300px; background: rgba(15, 20, 30, 0.95);
      border-left: 1px solid #1a2230; padding: 16px;
      overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
    }
    h2 { font-size: 18px; color: #64ffda; margin-bottom: 4px; letter-spacing: 0.5px; }
    h3 { font-size: 13px; color: #8892b0; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #1a2230; padding-bottom: 4px; }
    .ctrl { margin-bottom: 10px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: #a8b2d1; }
    .ctrl input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: #1a2230; border-radius: 2px; outline: none; }
    .ctrl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #64ffda; border-radius: 50%; cursor: pointer; }
    .ctrl input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; background: #64ffda; border-radius: 50%; cursor: pointer; border: none; }
    
    .stat-row { display: flex; justify-content: space-between; font-size: 12px; margin: 3px 0; color: #8892b0; }
    .stat-val { color: #ccd6f6; font-weight: bold; }
    
    #stats-canvas { width: 100%; height: 120px; background: rgba(10,14,20,0.8); border-radius: 4px; border: 1px solid #1a2230; margin-top: 8px; }
    .legend { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    
    .btn { background: #1a2230; color: #8892b0; border: 1px solid #232d42; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
    .btn:hover { background: #232d42; color: #ccd6f6; }
    .btn-row { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <div id="sim-wrapper">
    <canvas id="main"></canvas>
  </div>
  
  <div id="panel">
    <h2>🌍 EcoSim MC</h2>
    <div class="legend">
      <span><div class="dot" style="background:#4caf50"></div> Plants</span>
      <span><div class="dot" style="background:#29b6f6"></div> Herbivores</span>
      <span><div class="dot" style="background:#ef5350"></div> Predators</span>
    </div>
    
    <div>
      <h3>Environment</h3>
      <div class="ctrl">
        <label><span>Plant Growth Rate</span><span id="v-pgr">0.04</span></label>
        <input type="range" id="s-pgr" min="0.01" max="0.1" step="0.01" value="0.04">
      </div>
      <div class="ctrl">
        <label><span>Carrying Capacity</span><span id="v-cap">400</span></label>
        <input type="range" id="s-cap" min="100" max="800" step="50" value="400">
      </div>
      <div class="ctrl">
        <label><span>Metabolism Cost</span><span id="v-met">0.35</span></label>
        <input type="range" id="s-met" min="0.1" max="1.0" step="0.05" value="0.35">
      </div>
    </div>

    <div>
      <h3>Biology & Evolution</h3>
      <div class="ctrl">
        <label><span>Mutation Rate</span><span id="v-mut">0.15</span></label>
        <input type="range" id="s-mut" min="0" max="0.5" step="0.05" value="0.15">
      </div>
      <div class="ctrl">
        <label><span>Herbivore Energy Gain</span><span id="v-heng">25</span></label>
        <input type="range" id="s-heng" min="10" max="50" step="5" value="25">
      </div>
      <div class="ctrl">
        <label><span>Predator Energy Gain</span><span id="v-peng">40</span></label>
        <input type="range" id="s-peng" min="20" max="80" step="5" value="40">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" onclick="resetSim()">🔄 Reset</button>
      <button class="btn" onclick="togglePause()">⏸ Pause</button>
    </div>

    <h3>Population Dynamics</h3>
    <div id="stats-canvas"></div>
    <div class="stat-row">Plants: <span class="stat-val" id="st-p">0</span></div>
    <div class="stat-row">Herbivores: <span class="stat-val" id="st-h">0</span></div>
    <div class="stat-row">Predators: <span class="stat-val" id="st-pred">0</span></div>
    <div class="stat-row">Avg H-Speed: <span class="stat-val" id="st-hs">0.0</span></div>
    <div class="stat-row">Avg P-Vision: <span class="stat-val" id="st-pv">0.0</span></div>
    <div style="font-size:10px; color:#556688; margin-top:8px; line-height:1.4;">
      Colors shift with traits. Herbivores: slow→blue, fast→cyan. Predators: blind→red, sharp→orange.
    </div>
  </div>

  <script>
    // ===== CONFIGURATION & STATE =====
    const W = 100, H = 80; // Grid dimensions
    const CELL_SIZE = 6;
    let paused = false;
    let frameHistory = { p: [], h: [], pred: [], hSpeed: [], pVision: [], maxLen: 200 };
    let simTime = 0;

    // Grid: stores entity index + 1 (0 = empty, 1 = plant, >1 = animal)
    let grid = new Int16Array(W * H);
    let plants = [];
    let herbivores = [];
    let predators = [];

    // Parameters
    let params = {
      plantGrowthRate: 0.04,
      carryingCap: 400,
      metabolism: 0.35,
      mutationRate: 0.15,
      herbEnergyGain: 25,
      predEnergyGain: 40
    };

    // UI Bindings
    function bindSlider(id, valId, key, scale = 1) {
      const el = document.getElementById(id);
      const vEl = document.getElementById(valId);
      el.addEventListener('input', () => {
        const v = parseFloat(el.value);
        vEl.textContent = v.toFixed(scale === 1 ? 0 : 2);
        params[key] = v;
      });
    }
    bindSlider('s-pgr', 'v-pgr', 'plantGrowthRate', 2);
    bindSlider('s-cap', 'v-cap', 'carryingCap');
    bindSlider('s-met', 'v-met', 'metabolism', 2);
    bindSlider('s-mut', 'v-mut', 'mutationRate', 2);
    bindSlider('s-heng', 'v-heng', 'herbEnergyGain');
    bindSlider('s-peng', 'v-peng', 'predEnergyGain');

    // ===== SETUP =====
    function setup() {
      const canvas = document.getElementById('main');
      const wrapper = document.getElementById('sim-wrapper');
      const cw = Math.min(windowWidth - 300, W * CELL_SIZE + 20);
      const ch = Math.min(windowHeight - 20, H * CELL_SIZE + 20);
      createCanvas(cw, ch).parent('sim-wrapper');
      pixelDensity(1);
      resetSim();
    }

    function resetSim() {
      grid.fill(0);
      plants.length = herbivores.length = predators.length = 0;
      simTime = 0;
      frameHistory = { p: [], h: [], pred: [], hSpeed: [], pVision: [], maxLen: 200 };

      // Seed plants
      for (let i = 0; i < params.carryingCap; i++) {
        spawnPlant();
      }
      // Seed herbivores
      for (let i = 0; i < 80; i++) spawnHerbivore();
      // Seed predators
      for (let i = 0; i < 20; i++) spawnPredator();
    }

    // ===== ENTITY FACTORIES =====
    function idx(x, y) { return y * W + x; }
    function emptyCells() {
      const empty = [];
      for (let i = 0; i < grid.length; i++) if (grid[i] === 0) empty.push(i);
      return empty;
    }

    function spawnPlant() {
      const empties = emptyCells();
      if (empties.length === 0 || plants.length >= params.carryingCap) return;
      const idx = random(empties);
      grid[idx] = 1;
      plants.push({ idx });
    }

    function createAnimal(type, x, y, parentTraits = null) {
      const traits = parentTraits ? {
        speed: clamp(parentTraits.speed + randomGaussian(0, params.mutationRate), 0.5, 3.0),
        vision: clamp(parentTraits.vision + randomGaussian(0, params.mutationRate), 1, 6),
        reproRate: clamp(parentTraits.reproRate + randomGaussian(0, params.mutationRate * 0.5), 0.01, 0.25),
        energy: parentTraits.energy * 0.6 // Split energy
      } : {
        speed: type === 'h' ? random(0.8, 2.0) : random(0.6, 1.5),
        vision: type === 'h' ? random(1, 3) : random(2, 5),
        reproRate: type === 'h' ? random(0.05, 0.15) : random(0.03, 0.1),
        energy: 60
      };

      const entity = { x, y, type, ...traits, age: 0 };
      const i = idx(x, y);
      grid[i] = (type === 'h' ? herbivores : predators).length + 2;
      if (type === 'h') herbivores.push(entity);
      else predators.push(entity);
      return entity;
    }

    function spawnHerbivore(x = null, y = null) {
      x = x ?? floor(random(10, W - 10));
      y = y ?? floor(random(10, H - 10));
      if (grid[idx(x, y)] === 0) return createAnimal('h', x, y);
      return null;
    }

    function spawnPredator(x = null, y = null) {
      x = x ?? floor(random(10, W - 10));
      y = y ?? floor(random(10, H - 10));
      if (grid[idx(x, y)] === 0) return createAnimal('p', x, y);
      return null;
    }

    function removeEntity(arr, idxInArr) {
      const ent = arr[idxInArr];
      grid[idx(ent.x, ent.y)] = 0;
      arr[idxInArr] = arr[arr.length - 1];
      arr.pop();
      // Fix grid reference for the moved entity
      if (idxInArr < arr.length) {
        const moved = arr[idxInArr];
        grid[idx(moved.x, moved.y)] = idxInArr + (arr === herbivores ? 2 : herbivores.length + 2);
      }
    }

    // ===== MONTE CARLO UPDATE =====
    function update() {
      if (paused) return;
      simTime++;

      // 1. Plant Growth (Probabilistic)
      if (plants.length < params.carryingCap) {
        const growChance = params.plantGrowthRate * (1 - plants.length / params.carryingCap);
        for (let i = 0; i < W * H * 0.02; i++) { // Sample subset for performance
          const i = floor(random(W * H));
          if (grid[i] === 0 && random() < growChance) {
            grid[i] = 1;
            plants.push({ idx: i });
          }
        }
      }

      // 2. Update Herbivores
      for (let i = herbivores.length - 1; i >= 0; i--) {
        const h = herbivores[i];
        h.energy -= params.metabolism;
        h.age++;
        
        if (h.energy <= 0) { removeEntity(herbivores, i); continue; }

        // Monte Carlo movement & feeding
        const moveSteps = floor(h.speed);
        let foundFood = false;
        let bestDist = Infinity, bestFood = null;
        
        // Vision scan
        if (h.vision > 0) {
          for (let vy = -h.vision; vy <= h.vision; vy++) {
            for (let vx = -h.vision; vx <= h.vision; vx++) {
              const nx = constrain(h.x + vx, 0, W - 1);
              const ny = constrain(h.y + vy, 0, H - 1);
              if (grid[idx(nx, ny)] === 1) {
                const d = abs(vx) + abs(vy);
                if (d < bestDist) { bestDist = d; bestFood = {x: nx, y: ny}; }
              }
            }
          }
        }

        // Movement
        if (moveSteps > 0) {
          let mx = h.x, my = h.y;
          for (let step = 0; step < moveSteps; step++) {
            if (bestFood && random() < 0.8) {
              // Biased move toward food
              mx += sign(bestFood.x - mx) * (random() < 0.5 ? 1 : 0);
              my += sign(bestFood.y - my) * (random() < 0.5 ? 1 : 0);
            } else {
              // Random walk
              mx += floor(random(-1, 2));
              my += floor(random(-1, 2));
            }
            mx = constrain(mx, 0, W - 1);
            my = constrain(my, 0, H - 1);
          }

          if (grid[idx(mx, my)] === 0) {
            grid[idx(h.x, h.y)] = 0;
            h.x = mx; h.y = my;
            grid[idx(mx, my)] = i + 2;
          }
        }

        // Eat
        if (grid[idx(h.x, h.y)] === 1 || (h.vision > 0 && bestFood && abs(bestFood.x - h.x) + abs(bestFood.y - h.y) === 1)) {
          // Consume plant
          const plantIdx = bestFood ? idx(bestFood.x, bestFood.y) : idx(h.x, h.y);
          if (grid[plantIdx] === 1) {
            grid[plantIdx] = 0;
            plants = plants.filter(p => p.idx !== plantIdx); // O(N) but N is small enough
            h.energy += params.herbEnergyGain;
            foundFood = true;
          }
        }

        // Reproduce
        if (h.energy > 80 && random() < h.reproRate) {
          let bx = h.x + floor(random(-1, 2));
          let by = h.y + floor(random(-1, 2));
          bx = constrain(bx, 0, W - 1);
          by = constrain(by, 0, H - 1);
          if (grid[idx(bx, by)] === 0) {
            createAnimal('h', bx, by, h);
            h.energy *= 0.5;
          }
        }
      }

      // 3. Update Predators
      for (let i = predators.length - 1; i >= 0; i--) {
        const p = predators[i];
        p.energy -= params.metabolism * 1.2;
        p.age++;

        if (p.energy <= 0) { removeEntity(predators, i); continue; }

        let bestDist = Infinity, bestPrey = null;
        if (p.vision > 0) {
          for (let vy = -p.vision; vy <= p.vision; vy++) {
            for (let vx = -p.vision; vx <= p.vision; vx++) {
              const nx = constrain(p.x + vx, 0, W - 1);
              const ny = constrain(p.y + vy, 0, H - 1);
              const cell = grid[idx(nx, ny)];
              if (cell > 1 && cell <= herbivores.length + 1) { // Herbivore range
                const d = abs(vx) + abs(vy);
                if (d < bestDist) { bestDist = d; bestPrey = {x: nx, y: ny}; }
              }
            }
          }
        }

        const moveSteps = floor(p.speed);
        if (moveSteps > 0) {
          let mx = p.x, my = p.y;
          for (let step = 0; step < moveSteps; step++) {
            if (bestPrey && random() < 0.85) {
              mx += sign(bestPrey.x - mx) * (random() < 0.5 ? 1 : 0);
              my += sign(bestPrey.y - my) * (random() < 0.5 ? 1 : 0);
            } else {
              mx += floor(random(-1, 2));
              my += floor(random(-1, 2));
            }
            mx = constrain(mx, 0, W - 1);
            my = constrain(my, 0, H - 1);
          }
          if (grid[idx(mx, my)] === 0) {
            grid[idx(p.x, p.y)] = 0;
            p.x = mx; p.y = my;
            grid[idx(mx, my)] = i + herbivores.length + 2;
          }
        }

        // Eat
        if (bestPrey && abs(bestPrey.x - p.x) + abs(bestPrey.y - p.y) <= 1) {
          const hIdx = grid[idx(bestPrey.x, bestPrey.y)] - 2;
          if (hIdx >= 0 && hIdx < herbivores.length) {
            const prey = herbivores[hIdx];
            grid[idx(prey.x, prey.y)] = 0;
            removeEntity(herbivores, hIdx);
            p.energy += params.predEnergyGain;
          }
        }

        // Reproduce
        if (p.energy > 100 && random() < p.reproRate) {
          let bx = p.x + floor(random(-1, 2));
          let by = p.y + floor(random(-1, 2));
          bx = constrain(bx, 0, W - 1);
          by = constrain(by, 0, H - 1);
          if (grid[idx(bx, by)] === 0) {
            createAnimal('p', bx, by, p);
            p.energy *= 0.5;
          }
        }
      }

      // Record stats
      if (simTime % 5 === 0) {
        frameHistory.p.push(plants.length);
        frameHistory.h.push(herbivores.length);
        frameHistory.pred.push(predators.length);
        frameHistory.hSpeed.push(herbivores.reduce((a, h) => a + h.speed, 0) / (herbivores.length || 1));
        frameHistory.pVision.push(predators.reduce((a, p) => a + p.vision, 0) / (predators.length || 1));
        
        if (frameHistory.p.length > frameHistory.maxLen) {
          frameHistory.p.shift();
          frameHistory.h.shift();
          frameHistory.pred.shift();
          frameHistory.hSpeed.shift();
          frameHistory.pVision.shift();
        }
      }
    }

    // ===== RENDERING =====
    let pImg;
    function draw() {
      update();
      renderGrid();
      renderStatsPanel();
      updateUI();
    }

    function renderGrid() {
      if (!pImg) pImg = createGraphics(W, H);
      pImg.loadPixels();
      const p = pImg.pixels;

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = idx(x, y);
          const val = grid[i];
          const pi = i * 4;
          
          if (val === 1) { // Plant
            p[pi] = 30; p[pi+1] = 120; p[pi+2] = 40; p[pi+3] = 255;
          } else if (val > 1) {
            let isH = val <= herbivores.length + 1;
            let ent = isH ? herbivores[val - 2] : predators[val - herbivores.length - 2];
            if (ent) {
              // Color based on traits
              if (isH) {
                const t = constrain((ent.speed - 0.5) / 2.5, 0, 1);
                p[pi] = 20; p[pi+1] = lerp(80, 255, t); p[pi+2] = lerp(200, 255, t);
              } else {
                const t = constrain((ent.vision - 1) / 5, 0, 1);
                p[pi] = 200; p[pi+1] = lerp(40, 180, t); p[pi+2] = 40;
              }
              p[pi+3] = 255;
            } else {
              p[pi] = p[pi+1] = p[pi+2] = p[pi+3] = 0;
            }
          } else {
            p[pi] = p[pi+1] = p[pi+2] = p[pi+3] = 0;
          }
        }
      }
      pImg.updatePixels();
      image(pImg, 0, 0, width, height, 0, 0, W, H);
      
      // Subtle grid lines
      noFill(); stroke(255, 15);
      for (let x = 0; x <= W; x += 10) line(x * width/W, 0, x * width/W, height);
      for (let y = 0; y <= H; y += 10) line(0, y * height/H, width, y * height/H);
    }

    function renderStatsPanel() {
      const pc = document.getElementById('stats-canvas');
      const w = pc.clientWidth, h = pc.clientHeight;
      if (!pc.canvas || pc.width !== w) {
        pc.replaceChildren();
        const cvs = createGraphics(w, h);
        cvs.elt.style.width = '100%';
        cvs.elt.style.height = '100%';
        pc.appendChild(cvs.elt);
        pc.canvas = cvs;
      }
      const g = pc.canvas;
      g.background(10, 14, 20);
      if (frameHistory.p.length < 2) return;

      const drawLine = (data, color, maxVal) => {
        g.noFill();
        g.stroke(color);
        g.strokeWeight(1.5);
        g.beginShape();
        for (let i = 0; i < data.length; i++) {
          const x = map(i, 0, frameHistory.maxLen, 0, w);
          const y = h - map(data[i], 0, maxVal, 0, h);
          g.vertex(x, y);
        }
        g.endShape();
      };

      const maxPop = Math.max(1, ...frameHistory.p, ...frameHistory.h, ...frameHistory.pred);
      drawLine(frameHistory.p, '#4caf50', maxPop * 1.2);
      drawLine(frameHistory.h, '#29b6f6', maxPop * 1.2);
      drawLine(frameHistory.pred, '#ef5350', maxPop * 1.2);
      
      g.fill(150); g.noStroke(); g.textSize(10);
      g.text('Time →', w - 30, h - 4);
      g.text(maxPop, 4, 12);
      g.text(0, 4, h - 4);
    }

    function updateUI() {
      document.getElementById('st-p').textContent = plants.length;
      document.getElementById('st-h').textContent = herbivores.length;
      document.getElementById('st-pred').textContent = predators.length;
      document.getElementById('st-hs').textContent = (herbivores.reduce((a,h)=>a+h.speed,0)/(herbivores.length||1)).toFixed(2);
      document.getElementById('st-pv').textContent = (predators.reduce((a,p)=>a+p.vision,0)/(predators.length||1)).toFixed(2);
    }

    function resetSim() { resetSim(); } // Already defined, just binding
    function togglePause() { paused = !paused; }

    window.addEventListener('resize', () => {
      const cw = Math.min(windowWidth - 300, W * CELL_SIZE + 20);
      const ch = Math.min(windowHeight - 20, H * CELL_SIZE + 20);
      resizeCanvas(cw, ch);
    });
  </script>
</body>
</html>
