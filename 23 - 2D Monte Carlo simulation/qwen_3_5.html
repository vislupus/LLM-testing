<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte Carlo Ecosystem Evolution</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background-color: #1e1e1e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #main-view {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #000;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            color: #4db8ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 0.9rem;
            margin: 0 0 10px 0;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .control-group {
            background: #252525;
            padding: 10px;
            border-radius: 6px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #ccc;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #4db8ff;
        }

        .value-display {
            color: #4db8ff;
            font-weight: bold;
        }

        button {
            background-color: #4db8ff;
            border: none;
            color: #121212;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #3399cc;
        }

        button.danger {
            background-color: #ff5252;
            color: white;
        }
        button.danger:hover {
            background-color: #cc3333;
        }

        #stats-container {
            margin-top: auto;
            background: #252525;
            padding: 10px;
            border-radius: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated; /* Keep grid sharp */
        }

        #graph-container {
            width: 100%;
            height: 150px;
            background: #252525;
            margin-top: 10px;
            border-radius: 4px;
            position: relative;
        }
        
        .legend {
            display: flex;
            gap: 10px;
            font-size: 0.7rem;
            margin-top: 5px;
        }
        .dot { width: 8px; height: 8px; display: inline-block; border-radius: 50%; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <h1>Eco-Evolution Sim</h1>
            <p style="font-size: 0.8rem; color: #888; line-height: 1.4;">
                A Monte Carlo simulation of predator-prey dynamics with genetic evolution.
            </p>
        </div>

        <div class="control-group">
            <h2>Simulation Parameters</h2>
            
            <label>Mutation Rate <span id="val-mut" class="value-display">0.1</span></label>
            <input type="range" id="inp-mut" min="0" max="0.5" step="0.01" value="0.1">

            <label>Plant Growth Rate <span id="val-growth" class="value-display">0.05</span></label>
            <input type="range" id="inp-growth" min="0.01" max="0.2" step="0.01" value="0.05">

            <label>Initial Herbivores <span id="val-herb" class="value-display">40</span></label>
            <input type="range" id="inp-herb" min="0" max="200" step="10" value="40">

            <label>Initial Predators <span id="val-pred" class="value-display">10</span></label>
            <input type="range" id="inp-pred" min="0" max="100" step="5" value="10">
            
            <button id="btn-reset" class="danger">Reset Simulation</button>
            <button id="btn-pause">Pause / Resume</button>
        </div>

        <div id="stats-container">
            <h2>Live Statistics</h2>
            <div class="stat-row"><span>Generation:</span> <span id="stat-gen">0</span></div>
            <div class="stat-row"><span>Plants:</span> <span id="stat-plant" style="color:#4caf50">0</span></div>
            <div class="stat-row"><span>Herbivores:</span> <span id="stat-herb" style="color:#2196f3">0</span></div>
            <div class="stat-row"><span>Predators:</span> <span id="stat-pred" style="color:#f44336">0</span></div>
            <div class="stat-row" style="margin-top:8px; border-top:1px solid #444; padding-top:4px;">
                <span>Avg Herbivore Speed:</span> <span id="stat-speed">0</span>
            </div>
        </div>

        <div id="graph-container">
            <canvas id="graphCanvas"></canvas>
        </div>
        <div class="legend">
            <div><span class="dot" style="background:#4caf50"></span> Plants</div>
            <div><span class="dot" style="background:#2196f3"></span> Herbivores</div>
            <div><span class="dot" style="background:#f44336"></span> Predators</div>
        </div>
    </div>

    <div id="main-view">
        <!-- Main simulation canvas will be injected here by p5 -->
    </div>

    <script>
        // --- Configuration & Global State ---
        const GRID_W = 100;
        const GRID_H = 100;
        const CELL_SIZE = 6; // Visual size
        
        let grid = []; // 2D array storing entities
        let agents = []; // Flat list for iteration
        let generation = 0;
        let isPaused = false;
        let frameCountSim = 0;

        // Parameters
        let params = {
            mutationRate: 0.1,
            plantGrowthRate: 0.05,
            initHerbivores: 40,
            initPredators: 10
        };

        // Stats history for graph
        let history = {
            plants: [],
            herbivores: [],
            predators: [],
            maxHistory: 300
        };

        // --- Classes ---

        class Gene {
            constructor(value, min, max, mutationStdDev) {
                this.value = value;
                this.min = min;
                this.max = max;
                this.mutationStdDev = mutationStdDev;
            }

            mutate(rate) {
                if (Math.random() < rate) {
                    // Gaussian mutation
                    let u = 0, v = 0;
                    while(u === 0) u = Math.random();
                    while(v === 0) v = Math.random();
                    let num = Math.sqrt( -2.0 * Math.log( u ) ) * Math.sin( 2.0 * Math.PI * v );
                    
                    this.value += num * this.mutationStdDev;
                    // Clamp
                    this.value = Math.max(this.min, Math.min(this.max, this.value));
                }
            }
        }

        class Entity {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.energy = 100;
                this.age = 0;
                this.dead = false;
                this.type = 'base';
                this.color = [255, 255, 255];
            }

            update() {
                this.age++;
                this.energy -= 0.5; // Basal metabolic rate
                if (this.energy <= 0) this.dead = true;
            }

            draw() {
                // Override in subclasses
            }
        }

        class Plant extends Entity {
            constructor(x, y) {
                super(x, y);
                this.type = 'plant';
                this.color = [76, 175, 80]; // Green
                this.energy = 50; // Food value
                this.growthRate = new Gene(0.5, 0.1, 1.0, 0.1);
            }

            update() {
                this.energy += this.growthRate.value * 2;
                if (this.energy > 100) this.energy = 100;
                
                // Reproduce (spread seeds)
                if (this.energy > 80 && Math.random() < params.plantGrowthRate) {
                    this.reproduce();
                    this.energy -= 40;
                }
            }

            reproduce() {
                let dir = floor(random(8));
                let nx = this.x + floor(cos(dir * PI/4));
                let ny = this.y + floor(sin(dir * PI/4));
                
                if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && !grid[nx][ny]) {
                    let child = new Plant(nx, ny);
                    child.growthRate.mutate(params.mutationRate);
                    grid[nx][ny] = child;
                    agents.push(child);
                }
            }

            draw() {
                // Drawn as small green squares
                fill(this.color[0], this.color[1], this.color[2]);
                noStroke();
                rect(this.x * CELL_SIZE, this.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }

        class Animal extends Entity {
            constructor(x, y) {
                super(x, y);
                this.type = 'animal';
                // Traits
                this.speed = new Gene(1, 0, 3, 0.2); // Moves per turn
                this.vision = new Gene(3, 1, 8, 0.5); // Look ahead cells
                this.sense = new Gene(0.5, 0, 1, 0.1); // Probability to detect food/predator in vision
                this.reproThreshold = new Gene(150, 100, 250, 10); // Energy needed to breed
            }

            move() {
                // Simple random walk with boundary check
                // Advanced: Move towards food if seen (omitted for pure Monte Carlo randomness unless specified)
                // Let's add simple sensing: if food seen, move towards it.
                
                let target = this.senseEnvironment();
                
                if (target) {
                    let dx = target.x - this.x;
                    let dy = target.y - this.y;
                    
                    // Normalize to step
                    if (dx !== 0) dx = dx / abs(dx);
                    if (dy !== 0) dy = dy / abs(dy);
                    
                    // Try diagonal first
                    if (!this.tryMove(this.x + dx, this.y + dy)) {
                        this.tryMove(this.x + dx, this.y);
                        this.tryMove(this.x, this.y + dy);
                    }
                } else {
                    // Random move
                    let attempts = 0;
                    while(attempts < 5) {
                        let nx = this.x + floor(random(-1, 2));
                        let ny = this.y + floor(random(-1, 2));
                        if (this.tryMove(nx, ny)) break;
                        attempts++;
                    }
                }
            }

            tryMove(nx, ny) {
                if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
                    if (!grid[nx][ny]) {
                        grid[this.x][this.y] = null;
                        this.x = nx;
                        this.y = ny;
                        grid[this.x][this.y] = this;
                        this.energy -= 1 * this.speed.value; // Movement cost
                        return true;
                    }
                }
                return false;
            }

            senseEnvironment() {
                // Look in a square radius around
                let range = floor(this.vision.value);
                let candidates = [];
                
                for (let i = -range; i <= range; i++) {
                    for (let j = -range; j <= range; j++) {
                        let nx = this.x + i;
                        let ny = this.y + j;
                        if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
                            let cell = grid[nx][ny];
                            if (cell && cell !== this) {
                                if (this.canEat(cell) && random() < this.sense.value) {
                                    candidates.push(cell);
                                }
                            }
                        }
                    }
                }
                
                if (candidates.length > 0) {
                    return candidates[floor(random(candidates.length))];
                }
                return null;
            }

            canEat(other) {
                return false; // Override
            }

            eat(other) {
                // Remove other from grid and agents
                other.dead = true;
                grid[other.x][other.y] = null;
                // Remove from agents array (mark for cleanup later to avoid index issues)
                // We'll filter agents array at end of step
                
                this.energy += other.energy;
            }

            reproduce() {
                if (this.energy > this.reproThreshold.value) {
                    let dir = floor(random(8));
                    let nx = this.x + floor(cos(dir * PI/4));
                    let ny = this.y + floor(sin(dir * PI/4));
                    
                    if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && !grid[nx][ny]) {
                        let child = this.clone(nx, ny);
                        // Mutate traits
                        child.speed.mutate(params.mutationRate);
                        child.vision.mutate(params.mutationRate);
                        child.sense.mutate(params.mutationRate);
                        child.reproThreshold.mutate(params.mutationRate);
                        
                        child.energy = this.energy / 2;
                        this.energy /= 2;
                        
                        grid[nx][ny] = child;
                        agents.push(child);
                    }
                }
            }

            clone(x, y) {
                // Override
                return new Animal(x, y);
            }

            getColor() {
                // Map speed to brightness, vision to hue shift
                let h = map(this.vision.value, 1, 8, 200, 240); 
                let b = map(this.speed.value, 0, 3, 50, 100);
                return color(h, 80, b);
            }

            draw() {
                fill(this.getColor());
                noStroke();
                // Size indicates energy health
                let s = map(this.energy, 0, 200, 2, CELL_SIZE);
                s = constrain(s, 2, CELL_SIZE);
                rect(this.x * CELL_SIZE + (CELL_SIZE-s)/2, this.y * CELL_SIZE + (CELL_SIZE-s)/2, s, s);
            }
        }

        class Herbivore extends Animal {
            constructor(x, y) {
                super(x, y);
                this.type = 'herbivore';
            }

            canEat(other) {
                return other.type === 'plant';
            }

            update() {
                super.update();
                this.move();
                
                // Eat if on plant
                if (grid[this.x][this.y] && grid[this.x][this.y].type === 'plant') {
                    this.eat(grid[this.x][this.y]);
                }
                
                this.reproduce();
            }

            clone(x, y) {
                return new Herbivore(x, y);
            }
        }

        class Predator extends Animal {
            constructor(x, y) {
                super(x, y);
                this.type = 'predator';
                this.energy = 150;
            }

            canEat(other) {
                return other.type === 'herbivore';
            }

            update() {
                super.update();
                this.energy -= 1; // Higher metabolic rate
                this.move();
                
                if (grid[this.x][this.y] && grid[this.x][this.y].type === 'herbivore') {
                    this.eat(grid[this.x][this.y]);
                }
                
                this.reproduce();
            }

            getColor() {
                let h = map(this.vision.value, 1, 8, 0, 30); 
                let b = map(this.speed.value, 0, 3, 50, 100);
                return color(h, 90, b);
            }

            clone(x, y) {
                return new Predator(x, y);
            }
        }

        // --- P5.js Functions ---

        function setup() {
            let cnv = createCanvas(GRID_W * CELL_SIZE, GRID_H * CELL_SIZE);
            cnv.parent('main-view');
            noSmooth();
            resetSimulation();
            setupGraph();
            setupUI();
        }

        function resetSimulation() {
            grid = new Array(GRID_W).fill(null).map(() => new Array(GRID_H).fill(null));
            agents = [];
            generation = 0;
            frameCountSim = 0;
            history = { plants: [], herbivores: [], predators: [], maxHistory: 300 };

            // Initial Population
            for (let i = 0; i < GRID_W * GRID_H * 0.3; i++) {
                let x = floor(random(GRID_W));
                let y = floor(random(GRID_H));
                if (!grid[x][y]) {
                    let p = new Plant(x, y);
                    grid[x][y] = p;
                    agents.push(p);
                }
            }

            spawnAgents(params.initHerbivores, Herbivore);
            spawnAgents(params.initPredators, Predator);
        }

        function spawnAgents(count, ClassType) {
            for (let i = 0; i < count; i++) {
                let x = floor(random(GRID_W));
                let y = floor(random(GRID_H));
                if (!grid[x][y]) {
                    let a = new ClassType(x, y);
                    grid[x][y] = a;
                    agents.push(a);
                }
            }
        }

        function draw() {
            background(20);
            
            if (!isPaused) {
                updateSimulation();
            }
            
            drawSimulation();
            updateStats();
        }

        function updateSimulation() {
            // Shuffle agents to prevent order bias (Monte Carlo requirement)
            // Fisher-Yates shuffle
            for (let i = agents.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [agents[i], agents[j]] = [agents[j], agents[i]];
            }

            // Update all agents
            for (let i = 0; i < agents.length; i++) {
                let agent = agents[i];
                if (!agent.dead) {
                    agent.update();
                }
            }

            // Cleanup dead agents
            // Filter is cleaner but creates new array. For performance with many agents, 
            // swapping with last and popping is better, but filter is readable.
            // Given p5 speed, filter is okay for < 5000 agents.
            let newAgents = [];
            for (let agent of agents) {
                if (!agent.dead) {
                    newAgents.push(agent);
                } else {
                    // Ensure grid is cleared if somehow still there (should be handled in eat/die)
                    if (grid[agent.x][agent.y] === agent) {
                        grid[agent.x][agent.y] = null;
                    }
                }
            }
            agents = newAgents;

            frameCountSim++;
            if (frameCountSim % 10 === 0) {
                generation++;
                recordHistory();
            }
        }

        function drawSimulation() {
            // Draw all agents
            for (let agent of agents) {
                agent.draw();
            }
        }

        // --- Statistics & Graphing ---

        let graphCanvas;
        let graphCtx;

        function setupGraph() {
            graphCanvas = document.getElementById('graphCanvas');
            graphCanvas.width = graphCanvas.parentElement.clientWidth;
            graphCanvas.height = graphCanvas.parentElement.clientHeight;
            graphCtx = graphCanvas.getContext('2d');
        }

        function recordHistory() {
            let counts = { plants: 0, herbivores: 0, predators: 0 };
            let totalSpeed = 0;
            let herbCount = 0;

            for (let agent of agents) {
                if (agent.type === 'plant') counts.plants++;
                else if (agent.type === 'herbivore') {
                    counts.herbivores++;
                    totalSpeed += agent.speed.value;
                    herbCount++;
                }
                else if (agent.type === 'predator') counts.predators++;
            }

            history.plants.push(counts.plants);
            history.herbivores.push(counts.herbivores);
            history.predators.push(counts.predators);

            if (history.plants.length > history.maxHistory) {
                history.plants.shift();
                history.herbivores.shift();
                history.predators.shift();
            }

            // Update DOM stats
            document.getElementById('stat-gen').innerText = generation;
            document.getElementById('stat-plant').innerText = counts.plants;
            document.getElementById('stat-herb').innerText = counts.herbivores;
            document.getElementById('stat-pred').innerText = counts.predators;
            if (herbCount > 0) {
                document.getElementById('stat-speed').innerText = (totalSpeed / herbCount).toFixed(2);
            } else {
                document.getElementById('stat-speed').innerText = "0";
            }

            drawGraph(counts);
        }

        function drawGraph(currentCounts) {
            let w = graphCanvas.width;
            let h = graphCanvas.height;
            graphCtx.clearRect(0, 0, w, h);

            let maxVal = Math.max(
                Math.max(...history.plants, 10), 
                Math.max(...history.herbivores, 10), 
                Math.max(...history.predators, 10)
            );

            function drawLine(data, colorStr) {
                graphCtx.beginPath();
                graphCtx.strokeStyle = colorStr;
                graphCtx.lineWidth = 2;
                for (let i = 0; i < data.length; i++) {
                    let x = map(i, 0, history.maxHistory, 0, w);
                    let y = h - map(data[i], 0, maxVal, 0, h);
                    if (i === 0) graphCtx.moveTo(x, y);
                    else graphCtx.lineTo(x, y);
                }
                graphCtx.stroke();
            }

            drawLine(history.plants, '#4caf50');
            drawLine(history.herbivores, '#2196f3');
            drawLine(history.predators, '#f44336');
        }

        // --- UI Handling ---

        function setupUI() {
            // Sliders
            bindSlider('inp-mut', 'val-mut', (v) => params.mutationRate = parseFloat(v));
            bindSlider('inp-growth', 'val-growth', (v) => params.plantGrowthRate = parseFloat(v));
            bindSlider('inp-herb', 'val-herb', (v) => params.initHerbivores = parseInt(v));
            bindSlider('inp-pred', 'val-pred', (v) => params.initPredators = parseInt(v));

            // Buttons
            document.getElementById('btn-reset').addEventListener('click', resetSimulation);
            document.getElementById('btn-pause').addEventListener('click', () => {
                isPaused = !isPaused;
            });
        }

        function bindSlider(inputId, displayId, callback) {
            const input = document.getElementById(inputId);
            const display = document.getElementById(displayId);
            input.addEventListener('input', (e) => {
                display.innerText = e.target.value;
                callback(e.target.value);
            });
            // Init callback
            callback(input.value);
        }

    </script>
</body>
</html>
