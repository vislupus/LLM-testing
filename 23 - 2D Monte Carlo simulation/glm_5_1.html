<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte Carlo Ecosystem Evolution</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.dom.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            display: flex;
            gap: 25px;
            padding: 20px;
            background: #222;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas { border: 1px solid #444; border-radius: 4px; }
        #controls {
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: #2a2a2a;
            padding: 25px;
            border-radius: 8px;
            width: 320px;
            border: 1px solid #333;
        }
        h3 { margin: 0 0 15px 0; color: #4dc9f6; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .slider-group { display: flex; flex-direction: column; gap: 5px; }
        .slider-group label { font-size: 0.85em; color: #bbb; display: flex; justify-content: space-between;}
        .slider-group label span { color: #fff; font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: #4dc9f6; }
        button { padding: 12px; background: #4dc9f6; border: none; color: #111; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 0.95em; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #3aa8d4; }
        #stats { font-family: 'Courier New', Courier, monospace; font-size: 0.85em; line-height: 1.6; background: #222; padding: 15px; border-radius: 6px; border: 1px solid #333; }
        .stat-title { color: #4dc9f6; font-weight: bold; margin-top: 8px; display: block; }
        .legend { display: flex; gap: 15px; margin-top: 15px; font-size: 0.8em; color: #aaa; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>

<div id="container">
    <div id="canvas-holder"></div>
    <div id="controls">
        <h3>Ecosystem Controls</h3>
        
        <div class="slider-group">
            <label>Mutation Rate <span id="mutRateVal">0.10</span></label>
            <input type="range" id="mutRate" min="0" max="0.5" step="0.01" value="0.10">
        </div>
        
        <div class="slider-group">
            <label>Carrying Capacity (Plant Density) <span id="capacityVal">3</span></label>
            <input type="range" id="capacity" min="1" max="7" step="1" value="3">
        </div>

        <div class="slider-group">
            <label>Interaction Strength (Predation) <span id="interStrVal">1.0</span></label>
            <input type="range" id="interStr" min="0.1" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="slider-group">
            <label>Initial Plant Population % <span id="initPVal">15</span></label>
            <input type="range" id="initP" min="5" max="40" step="1" value="15">
        </div>

        <div class="slider-group">
            <label>Initial Herbivore Population % <span id="initHVal">3</span></label>
            <input type="range" id="initH" min="1" max="15" step="1" value="3">
        </div>

        <div class="slider-group">
            <label>Initial Predator Population % <span id="initRVal">1</span></label>
            <input type="range" id="initR" min="0.5" max="5" step="0.5" value="1">
        </div>

        <button id="resetBtn">Reset Simulation</button>
        
        <div id="stats">
            <span class="stat-title">Population</span>
            Plants: <span id="pPop">0</span><br>
            Herbivores: <span id="hPop">0</span><br>
            Predators: <span id="rPop">0</span><br>
            
            <span class="stat-title">Avg Traits (Herb / Pred)</span>
            Speed: <span id="hSpd">0</span> / <span id="rSpd">0</span><br>
            Vision: <span id="hVis">0</span> / <span id="rVis">0</span><br>
            Repro Rate: <span id="hRep">0</span> / <span id="rRep">0</span>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: #2ecc71;"></div> Plant</div>
            <div class="legend-item"><div class="dot" style="background: #3498db;"></div> Herbivore</div>
            <div class="legend-item"><div class="dot" style="background: #e74c3c;"></div> Predator</div>
        </div>
    </div>
</div>

<script>
// --- Configuration ---
const GRID_W = 120;
const GRID_H = 120;
const CELL_SIZE = 5;
const SIM_W = GRID_W * CELL_SIZE;
const SIM_H = GRID_H * CELL_SIZE;
const GRAPH_H = 120;

let grid = [];
let agents = { plant: 0, herbivore: 0, predator: 0 };
let traits = { herbivore: { speed: 0, vision: 0, repro: 0 }, predator: { speed: 0, vision: 0, repro: 0 } };

let popHistory = { plant: [], herbivore: [], predator: [] };
const MAX_HISTORY = 250;

// Params (linked to UI)
let mutationRate = 0.1;
let carryingCapacity = 3;
let interactionStrength = 1.0;
let initPlant = 15;
let initHerb = 3;
let initPred = 1;

function setup() {
    let canvas = createCanvas(SIM_W, SIM_H + GRAPH_H + 20);
    canvas.parent('canvas-holder');
    
    // UI Bindings
    select('#mutRate').input(function() { mutationRate = float(this.value()); select('#mutRateVal').html(this.value()); });
    select('#capacity').input(function() { carryingCapacity = int(this.value()); select('#capacityVal').html(this.value()); });
    select('#interStr').input(function() { interactionStrength = float(this.value()); select('#interStrVal').html(this.value()); });
    select('#initP').input(function() { initPlant = float(this.value()); select('#initPVal').html(this.value()); });
    select('#initH').input(function() { initHerb = float(this.value()); select('#initHVal').html(this.value()); });
    select('#initR').input(function() { initPred = float(this.value()); select('#initRVal').html(this.value()); });
    
    select('#resetBtn').mousePressed(initGrid);
    
    initGrid();
}

function initGrid() {
    grid = new Array(GRID_W * GRID_H).fill(null);
    popHistory = { plant: [], herbivore: [], predator: [] };
    
    // Initial population based on percentages
    for (let i = 0; i < GRID_W * GRID_H; i++) {
        let r = random(100);
        if (r < initPlant) grid[i] = new Plant(i);
        else if (r < initPlant + initHerb) grid[i] = new Herbivore(i);
        else if (r < initPlant + initHerb + initPred) grid[i] = new Predator(i);
    }
    countPopulations();
}

function idx(x, y) { return y * GRID_W + x; }
function getX(i) { return i % GRID_W; }
function getY(i) { return floor(i / GRID_W); }

// --- Monte Carlo Update Loop ---
function draw() {
    background(30);
    
    // Monte Carlo sampling: random updates per frame
    // Updating a fraction of the grid per frame allows real-time performance
    let updates = floor(GRID_W * GRID_H * 0.6); 
    for (let i = 0; i < updates; i++) {
        let randIdx = floor(random(GRID_W * GRID_H));
        let agent = grid[randIdx];
        if (agent) {
            agent.update(randIdx);
        }
    }
    
    // Render Grid
    noStroke();
    for (let i = 0; i < grid.length; i++) {
        let agent = grid[i];
        if (agent) {
            let x = getX(i) * CELL_SIZE;
            let y = getY(i) * CELL_SIZE;
            fill(agent.getColor());
            rect(x, y, CELL_SIZE, CELL_SIZE);
        }
    }
    
    // Render Graph
    drawGraph();
    
    // Stats
    countPopulations();
    updateStatsUI();
}

function countPopulations() {
    agents.plant = 0; agents.herbivore = 0; agents.predator = 0;
    let hSpd=0, hVis=0, hRep=0, rSpd=0, rVis=0, rRep=0;
    
    for (let agent of grid) {
        if (!agent) continue;
        if (agent.type === 'plant') agents.plant++;
        else if (agent.type === 'herbivore') {
            agents.herbivore++;
            hSpd += agent.speed; hVis += agent.vision; hRep += agent.reproRate;
        } else if (agent.type === 'predator') {
            agents.predator++;
            rSpd += agent.speed; rVis += agent.vision; rRep += agent.reproRate;
        }
    }
    
    if (agents.herbivore > 0) {
        traits.herbivore = { speed: (hSpd/agents.herbivore).toFixed(2), vision: (hVis/agents.herbivore).toFixed(2), repro: (hRep/agents.herbivore).toFixed(3) };
    } else { traits.herbivore = { speed: "N/A", vision: "N/A", repro: "N/A" }; }
    
    if (agents.predator > 0) {
        traits.predator = { speed: (rSpd/agents.predator).toFixed(2), vision: (rVis/agents.predator).toFixed(2), repro: (rRep/agents.predator).toFixed(3) };
    } else { traits.predator = { speed: "N/A", vision: "N/A", repro: "N/A" }; }
    
    popHistory.plant.push(agents.plant);
    popHistory.herbivore.push(agents.herbivore);
    popHistory.predator.push(agents.predator);
    
    if (popHistory.plant.length > MAX_HISTORY) {
        popHistory.plant.shift(); popHistory.herbivore.shift(); popHistory.predator.shift();
    }
}

function updateStatsUI() {
    select('#pPop').html(agents.plant);
    select('#hPop').html(agents.herbivore);
    select('#rPop').html(agents.predator);
    select('#hSpd').html(traits.herbivore.speed);
    select('#hVis').html(traits.herbivore.vision);
    select('#hRep').html(traits.herbivore.repro);
    select('#rSpd').html(traits.predator.speed);
    select('#rVis').html(traits.predator.vision);
    select('#rRep').html(traits.predator.repro);
}

function drawGraph() {
    let graphY = SIM_H + 15;
    stroke(60);
    fill(15);
    rect(0, graphY, SIM_W, GRAPH_H);
    
    noFill();
    strokeWeight(2);
    
    // Normalize based on max population in history to keep graph readable
    let maxPop = max(1, max(popHistory.plant));
    
    // Draw Plants
    stroke(46, 204, 113, 150); // Green alpha
    beginShape();
    for (let i = 0; i < popHistory.plant.length; i++) {
        vertex(map(i, 0, MAX_HISTORY, 0, SIM_W), map(popHistory.plant[i], 0, maxPop, graphY + GRAPH_H, graphY));
    }
    endShape();
    
    // Dynamic scale for animals so they aren't squashed by plant numbers
    let maxAnimal = max(1, max(max(popHistory.herbivore), max(popHistory.predator)));
    
    // Draw Herbivores
    stroke(52, 152, 219); // Blue
    beginShape();
    for (let i = 0; i < popHistory.herbivore.length; i++) {
        vertex(map(i, 0, MAX_HISTORY, 0, SIM_W), map(popHistory.herbivore[i], 0, maxAnimal, graphY + GRAPH_H, graphY));
    }
    endShape();
    
    // Draw Predators
    stroke(231, 76, 60); // Red
    beginShape();
    for (let i = 0; i < popHistory.predator.length; i++) {
        vertex(map(i, 0, MAX_HISTORY, 0, SIM_W), map(popHistory.predator[i], 0, maxAnimal, graphY + GRAPH_H, graphY));
    }
    endShape();
    strokeWeight(1);
    
    // Labels
    noStroke();
    fill(150);
    textSize(10);
    text("Population over time (Top: Plants, Bottom: Animals)", 5, graphY + 12);
}

// --- Helpers ---
function getNeighbors(idx) {
    let x = getX(idx);
    let y = getY(idx);
    let n = [];
    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            if (dx === 0 && dy === 0) continue;
            let nx = x + dx;
            let ny = y + dy;
            if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
                n.push(idx(nx, ny));
            }
        }
    }
    return n;
}

function findInVision(myIdx, vision, targetType) {
    let x = getX(myIdx);
    let y = getY(myIdx);
    let targets = [];
    // Efficient bounding box check
    for (let dx = -vision; dx <= vision; dx++) {
        for (let dy = -vision; dy <= vision; dy++) {
            let nx = x + dx;
            let ny = y + dy;
            if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
                let nIdx = idx(nx, ny);
                if (grid[nIdx] && grid[nIdx].type === targetType) {
                    targets.push(nIdx);
                }
            }
        }
    }
    if (targets.length === 0) return -1;
    return targets[floor(random(targets.length))]; // Return random target in vision
}

function mutate(val, min, max) {
    // Add gaussian noise scaled by mutation rate
    let m = randomGaussian() * mutationRate * val;
    return constrain(val + m, min, max);
}

// --- Agent Classes ---
class Agent {
    constructor(idx, type, energy) {
        this.type = type;
        this.energy = energy;
    }
    getColor() { return [100, 100, 100]; }
}

class Plant extends Agent {
    constructor(idx) {
        super(idx, 'plant', 1);
        this.reproRate = 0.05; // Base chance
    }
    update(myIdx) {
        // Stochastic birth
        if (random() < this.reproRate) {
            let neighbors = getNeighbors(myIdx);
            let emptyNeighbors = neighbors.filter(n => !grid[n]);
            let plantNeighbors = neighbors.filter(n => grid[n] && grid[n].type === 'plant');
            
            // Check carrying capacity (local density limit)
            if (emptyNeighbors.length > 0 && plantNeighbors.length < carryingCapacity) {
                let spawnIdx = emptyNeighbors[floor(random(emptyNeighbors.length))];
                let child = new Plant(spawnIdx);
                // Slight mutation
                child.reproRate = mutate(this.reproRate, 0.01, 0.12);
                grid[spawnIdx] = child;
            }
        }
    }
    getColor() {
        // Brightness mapped to reproduction rate (more robust = brighter green)
        let g = map(this.reproRate, 0.01, 0.12, 120, 255);
        return [30, g, 50];
    }
}

class Herbivore extends Agent {
    constructor(idx) {
        super(idx, 'herbivore', 5);
        this.speed = 1.0;     // Affects how likely they are to move effectively (simulated by energy cost)
        this.vision = 3;
        this.reproRate = 0.04;
        this.reproThreshold = 10;
    }
    update(myIdx) {
        // Metabolism cost based on speed and size (vision)
        this.energy -= (0.15 + this.speed * 0.05 + this.vision * 0.02);
        
        // Death condition
        if (this.energy <= 0) { grid[myIdx] = null; return; }
        
        // Decision making: Flee > Eat > Wander
        let predatorIdx = findInVision(myIdx, floor(this.vision), 'predator');
        let moveIdx = -1;
        
        // 1. Flee predator
        if (predatorIdx !== -1) {
            let dx = getX(myIdx) - getX(predatorIdx);
            let dy = getY(myIdx) - getY(predatorIdx);
            // Move away from predator
            let fleeX = constrain(getX(myIdx) + (dx > 0 ? floor(random(1, this.speed+1)) : -floor(random(1, this.speed+1))), 0, GRID_W - 1);
            let fleeY = constrain(getY(myIdx) + (dy > 0 ? floor(random(1, this.speed+1)) : -floor(random(1, this.speed+1))), 0, GRID_H - 1);
            let fleeIdx = idx(fleeX, fleeY);
            // Can flee into plants to eat them, or empty space
            if (!grid[fleeIdx] || grid[fleeIdx].type === 'plant') moveIdx = fleeIdx;
        } else {
            // 2. Seek food
            let foodIdx = findInVision(myIdx, floor(this.vision), 'plant');
            if (foodIdx !== -1) {
                moveIdx = foodIdx; // Move towards plant
            } else {
                // 3. Random walk
                let n = getNeighbors(myIdx);
                let validN = n.filter(i => !grid[i]);
                if (validN.length > 0) moveIdx = validN[floor(random(validN.length))];
            }
        }
        
        // Execute Move
        if (moveIdx !== -1) {
            if (grid[moveIdx] && grid[moveIdx].type === 'plant') {
                this.energy += 2; // Eat
                grid[moveIdx] = this;
                grid[myIdx] = null;
            } else if (!grid[moveIdx]) {
                grid[moveIdx] = this;
                grid[myIdx] = null;
            }
        }
        
        // Reproduction
        if (this.energy > this.reproThreshold && random() < this.reproRate) {
            let currentPos = grid[moveIdx] === this ? moveIdx : myIdx;
            let emptyN = getNeighbors(currentPos).filter(i => !grid[i]);
            if (emptyN.length > 0) {
                let spawnIdx = emptyN[floor(random(emptyN.length))];
                let child = new Herbivore(spawnIdx);
                // Mutate traits
                child.speed = mutate(this.speed, 0.5, 3.0);
                child.vision = mutate(this.vision, 1, 6);
                child.reproRate = mutate(this.reproRate, 0.01, 0.12);
                child.reproThreshold = mutate(this.reproThreshold, 8, 15);
                child.energy = this.energy / 2;
                this.energy /= 2;
                grid[spawnIdx] = child;
            }
        }
    }
    getColor() {
        // Blue channel mapped to speed (faster = brighter blue)
        let b = map(this.speed, 0.5, 3.0, 100, 255);
        return [30, 60, b];
    }
}

class Predator extends Agent {
    constructor(idx) {
        super(idx, 'predator', 12);
        this.speed = 1.5;
        this.vision = 4;
        this.reproRate = 0.03;
        this.reproThreshold = 18;
    }
    update(myIdx) {
        // Higher metabolism
        this.energy -= (0.25 + this.speed * 0.08 + this.vision * 0.03);
        
        // Death
        if (this.energy <= 0) { grid[myIdx] = null; return; }
        
        // Decision: Hunt > Wander
        let preyIdx = findInVision(myIdx, floor(this.vision), 'herbivore');
        let moveIdx = -1;
        
        if (preyIdx !== -1) {
            moveIdx = preyIdx; // Move towards prey
        } else {
            let n = getNeighbors(myIdx);
            let validN = n.filter(i => !grid[i]);
            if (validN.length > 0) moveIdx = validN[floor(random(validN.length))];
        }
        
        // Execute Move
        if (moveIdx !== -1) {
            if (grid[moveIdx] && grid[moveIdx].type === 'herbivore') {
                this.energy += 6 * interactionStrength; // Eat efficiency
                grid[moveIdx] = this;
                grid[myIdx] = null;
            } else if (!grid[moveIdx]) {
                grid[moveIdx] = this;
                grid[myIdx] = null;
            }
        }
        
        // Reproduction
        if (this.energy > this.reproThreshold && random() < this.reproRate) {
            let currentPos = grid[moveIdx] === this ? moveIdx : myIdx;
            let emptyN = getNeighbors(currentPos).filter(i => !grid[i]);
            if (emptyN.length > 0) {
                let spawnIdx = emptyN[floor(random(emptyN.length))];
                let child = new Predator(spawnIdx);
                // Mutate traits
                child.speed = mutate(this.speed, 0.5, 3.5);
                child.vision = mutate(this.vision, 1, 8);
                child.reproRate = mutate(this.reproRate, 0.005, 0.08);
                child.reproThreshold = mutate(this.reproThreshold, 15, 25);
                child.energy = this.energy / 2;
                this.energy /= 2;
                grid[spawnIdx] = child;
            }
        }
    }
    getColor() {
        // Red channel mapped to vision (better hunters = brighter red)
        let r = map(this.vision, 1, 8, 100, 255);
        return [r, 30, 30];
    }
}
</script>
</body>
</html>
