<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecosystem Evolution – Monte Carlo Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080f; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #c0c8e0; }
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,25,0.94); border-top: 1px solid rgba(100,140,255,0.15);
    padding: 10px 20px; font-size: 11px; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
    backdrop-filter: blur(10px);
  }
  #controls h4 { color: #6ea8fe; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; margin-bottom: 2px; }
  .ctrl-group { display: flex; align-items: center; gap: 6px; }
  .ctrl-group label { color: #889; white-space: nowrap; }
  .ctrl-group input[type=range] { width: 80px; accent-color: #6ea8fe; }
  .ctrl-group .val { color: #6ea8fe; font-family: 'Consolas', monospace; min-width: 28px; text-align: right; }
  .btn {
    padding: 4px 12px; border-radius: 5px; border: 1px solid rgba(100,140,255,0.3);
    background: rgba(40,60,120,0.2); color: #6ea8fe; font-size: 11px; cursor: pointer;
  }
  .btn:hover { background: rgba(40,60,120,0.4); }
  .btn.active { background: rgba(100,140,255,0.25); border-color: #6ea8fe; color: #fff; }
  #stats-overlay {
    position: fixed; top: 10px; left: 10px;
    background: rgba(10,10,25,0.9); border: 1px solid rgba(100,140,255,0.15);
    border-radius: 10px; padding: 12px 14px; font-size: 11px; z-index: 10;
    min-width: 180px; backdrop-filter: blur(10px);
  }
  #stats-overlay h3 { color: #6ea8fe; font-size: 12px; margin-bottom: 8px; }
  .stat-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .stat-row .label { color: #778; }
  .stat-row .value { font-family: 'Consolas', monospace; font-weight: 600; }
  .plant-c { color: #4ade80; } .herb-c { color: #fbbf24; } .pred-c { color: #f87171; }
  #info { position: fixed; top: 10px; right: 10px; font-size: 10px; color: #445; z-index: 10; text-align: right; }
</style>
</head>
<body>

<div id="stats-overlay">
  <h3>🌿 Ecosystem Stats</h3>
  <div class="stat-row"><span class="label">Step:</span><span class="value" id="s-step">0</span></div>
  <div class="stat-row"><span class="label">Generation:</span><span class="value" id="s-gen">0</span></div>
  <div class="stat-row"><span class="label plant-c">Plants:</span><span class="value plant-c" id="s-plants">0</span></div>
  <div class="stat-row"><span class="label herb-c">Herbivores:</span><span class="value herb-c" id="s-herbs">0</span></div>
  <div class="stat-row"><span class="label pred-c">Predators:</span><span class="value pred-c" id="s-preds">0</span></div>
  <div style="margin-top:8px;border-top:1px solid rgba(100,140,255,0.1);padding-top:6px">
    <div class="stat-row"><span class="label">Avg Herb Speed:</span><span class="value" id="s-hspeed">—</span></div>
    <div class="stat-row"><span class="label">Avg Herb Vision:</span><span class="value" id="s-hvision">—</span></div>
    <div class="stat-row"><span class="label">Avg Pred Speed:</span><span class="value" id="s-pspeed">—</span></div>
    <div class="stat-row"><span class="label">Avg Pred Vision:</span><span class="value" id="s-pvision">—</span></div>
  </div>
  <div style="margin-top:8px;border-top:1px solid rgba(100,140,255,0.1);padding-top:6px">
    <div class="stat-row"><span class="label">Extinctions:</span><span class="value" id="s-extinct">0</span></div>
    <div class="stat-row"><span class="label">FPS:</span><span class="value" id="s-fps">0</span></div>
  </div>
</div>

<div id="controls">
  <h4>⚙️ Parameters</h4>
  <div class="ctrl-group"><label>Grid</label><input type="range" id="c-grid" min="40" max="200" value="100"><span class="val" id="v-grid">100</span></div>
  <div class="ctrl-group"><label>Mutation</label><input type="range" id="c-mut" min="0" max="100" value="15"><span class="val" id="v-mut">0.15</span></div>
  <div class="ctrl-group"><label>Plant Rate</label><input type="range" id="c-plant" min="1" max="50" value="12"><span class="val" id="v-plant">12</span></div>
  <div class="ctrl-group"><label>Carrying Cap</label><input type="range" id="c-cap" min="100" max="5000" value="1500"><span class="val" id="v-cap">1500</span></div>
  <div class="ctrl-group"><label>Init Herbs</label><input type="range" id="c-iherb" min="5" max="200" value="50"><span class="val" id="v-iherb">50</span></div>
  <div class="ctrl-group"><label>Init Preds</label><input type="range" id="c-ipred" min="0" max="100" value="15"><span class="val" id="v-ipred">15</span></div>
  <div class="ctrl-group"><label>Sim Speed</label><input type="range" id="c-speed" min="1" max="20" value="5"><span class="val" id="v-speed">5</span></div>
  <div class="ctrl-group">
    <button class="btn" id="btn-pause" onclick="togglePause()">⏸ Pause</button>
    <button class="btn" onclick="resetSim()">↺ Reset</button>
    <button class="btn" id="btn-graph" onclick="toggleGraph()">📊 Graph</button>
  </div>
</div>

<div id="info">Ecosystem Evolution Simulation<br>Monte Carlo · p5.js</div>

<script>
// ===== GLOBALS =====
let GRID_SIZE = 100;
let CELL_W, CELL_H;
let plants = [];      // 2D grid: plants[x][y] = energy amount
let herbivores = [];
let predators = [];
let simStep = 0;
let generation = 0;
let paused = false;
let showGraph = true;
let extinctionCount = 0;

// History for graphs
let history = { plants: [], herbs: [], preds: [], hSpeed: [], hVision: [], pSpeed: [], pVision: [] };
const MAX_HISTORY = 600;

// Parameters
let mutationRate = 0.15;
let plantGrowRate = 12;
let carryingCapacity = 1500;
let initHerbs = 50;
let initPreds = 15;
let simSpeed = 5;

// Graph canvas
let graphCanvas;

// ===== AGENT CLASS =====
class Agent {
  constructor(x, y, type, traits) {
    this.x = x;
    this.y = y;
    this.type = type; // 'herbivore' or 'predator'
    this.energy = type === 'herbivore' ? 40 : 60;
    this.age = 0;
    this.maxAge = type === 'herbivore' ? random(200, 400) : random(150, 350);
    this.alive = true;
    this.generation = 0;

    // Evolvable traits
    this.traits = traits || {
      speed: type === 'herbivore' ? random(1, 3) : random(1.5, 3.5),
      vision: type === 'herbivore' ? random(3, 8) : random(4, 10),
      reproRate: type === 'herbivore' ? random(0.02, 0.06) : random(0.01, 0.04),
      efficiency: type === 'herbivore' ? random(0.5, 0.9) : random(0.4, 0.8),
    };
  }
}

// ===== SETUP =====
function setup() {
  createCanvas(windowWidth, windowHeight);
  frameRate(60);
  graphCanvas = createGraphics(320, 180);
  readControls();
  resetSim();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

// ===== CONTROLS =====
function readControls() {
  GRID_SIZE = +document.getElementById('c-grid').value;
  mutationRate = +document.getElementById('c-mut').value / 100;
  plantGrowRate = +document.getElementById('c-plant').value;
  carryingCapacity = +document.getElementById('c-cap').value;
  initHerbs = +document.getElementById('c-iherb').value;
  initPreds = +document.getElementById('c-ipred').value;
  simSpeed = +document.getElementById('c-speed').value;

  document.getElementById('v-grid').textContent = GRID_SIZE;
  document.getElementById('v-mut').textContent = mutationRate.toFixed(2);
  document.getElementById('v-plant').textContent = plantGrowRate;
  document.getElementById('v-cap').textContent = carryingCapacity;
  document.getElementById('v-iherb').textContent = initHerbs;
  document.getElementById('v-ipred').textContent = initPreds;
  document.getElementById('v-speed').textContent = simSpeed;
}

function togglePause() {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ Play' : '⏸ Pause';
  document.getElementById('btn-pause').classList.toggle('active', paused);
}

function toggleGraph() {
  showGraph = !showGraph;
  document.getElementById('btn-graph').classList.toggle('active', showGraph);
}

function resetSim() {
  readControls();
  CELL_W = width / GRID_SIZE;
  CELL_H = (height - 60) / GRID_SIZE;

  // Init plant grid
  plants = [];
  for (let x = 0; x < GRID_SIZE; x++) {
    plants[x] = [];
    for (let y = 0; y < GRID_SIZE; y++) {
      plants[x][y] = random() < 0.3 ? random(20, 60) : 0;
    }
  }

  // Init herbivores
  herbivores = [];
  for (let i = 0; i < initHerbs; i++) {
    const x = floor(random(GRID_SIZE));
    const y = floor(random(GRID_SIZE));
    herbivores.push(new Agent(x, y, 'herbivore'));
  }

  // Init predators
  predators = [];
  for (let i = 0; i < initPreds; i++) {
    const x = floor(random(GRID_SIZE));
    const y = floor(random(GRID_SIZE));
    predators.push(new Agent(x, y, 'predator'));
  }

  simStep = 0;
  generation = 0;
  extinctionCount = 0;
  history = { plants: [], herbs: [], preds: [], hSpeed: [], hVision: [], pSpeed: [], pVision: [] };
}

// ===== MUTATION =====
function mutateTrait(value, min, max) {
  if (random() < mutationRate) {
    const delta = randomGaussian(0, (max - min) * 0.1);
    return constrain(value + delta, min, max);
  }
  return value;
}

function mutateTraits(parent, type) {
  const ranges = type === 'herbivore'
    ? { speed: [0.5, 5], vision: [1, 15], reproRate: [0.005, 0.1], efficiency: [0.2, 1.0] }
    : { speed: [0.5, 6], vision: [1, 18], reproRate: [0.003, 0.08], efficiency: [0.2, 1.0] };

  return {
    speed: mutateTrait(parent.traits.speed, ...ranges.speed),
    vision: mutateTrait(parent.traits.vision, ...ranges.vision),
    reproRate: mutateTrait(parent.traits.reproRate, ...ranges.reproRate),
    efficiency: mutateTrait(parent.traits.efficiency, ...ranges.efficiency),
  };
}

// ===== NEIGHBORHOOD =====
function getNeighbors(x, y, radius) {
  const cells = [];
  for (let dx = -radius; dx <= radius; dx++) {
    for (let dy = -radius; dy <= radius; dy++) {
      const nx = (x + dx + GRID_SIZE) % GRID_SIZE;
      const ny = (y + dy + GRID_SIZE) % GRID_SIZE;
      cells.push({ x: nx, y: ny, dist: sqrt(dx*dx + dy*dy) });
    }
  }
  return cells;
}

function findNearestPlant(x, y, vision) {
  let best = null, bestDist = Infinity;
  for (let dx = -vision; dx <= vision; dx++) {
    for (let dy = -vision; dy <= vision; dy++) {
      const nx = (x + dx + GRID_SIZE) % GRID_SIZE;
      const ny = (y + dy + GRID_SIZE) % GRID_SIZE;
      if (plants[nx][ny] > 5) {
        const d = sqrt(dx*dx + dy*dy);
        if (d < bestDist) { bestDist = d; best = { x: nx, y: ny }; }
      }
    }
  }
  return best;
}

function findNearestPrey(x, y, vision) {
  let best = null, bestDist = Infinity;
  for (const h of herbivores) {
    if (!h.alive) continue;
    let dx = h.x - x, dy = h.y - y;
    // Wrap
    if (dx > GRID_SIZE/2) dx -= GRID_SIZE;
    if (dx < -GRID_SIZE/2) dx += GRID_SIZE;
    if (dy > GRID_SIZE/2) dy -= GRID_SIZE;
    if (dy < -GRID_SIZE/2) dy += GRID_SIZE;
    const d = sqrt(dx*dx + dy*dy);
    if (d <= vision && d < bestDist) { bestDist = d; best = h; }
  }
  return best;
}

// ===== MONTE CARLO STEP =====
function simStepFn() {
  simStep++;

  // 1. Grow plants
  let totalPlantEnergy = 0;
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      // Logistic growth
      const local = plants[x][y];
      const growth = plantGrowRate * (1 - local / 100) * random(0.5, 1.5);
      if (local > 0 || random() < 0.01) {
        plants[x][y] = constrain(local + growth, 0, 100);
      }
      totalPlantEnergy += plants[x][y];
    }
  }

  // 2. Herbivore actions (Monte Carlo: shuffle and process)
  const shuffledHerbs = [...herbivores].filter(h => h.alive).sort(() => random() - 0.5);

  for (const h of shuffledHerbs) {
    if (!h.alive) continue;
    h.age++;
    h.energy -= 0.5 + h.traits.speed * 0.1; // Metabolic cost

    // Death
    if (h.energy <= 0 || h.age > h.maxAge) {
      h.alive = false;
      continue;
    }

    // Movement & feeding
    const target = findNearestPlant(h.x, h.y, floor(h.traits.vision));
    if (target) {
      // Move toward plant
      const dx = target.x - h.x;
      const dy = target.y - h.y;
      const wdx = abs(dx) > GRID_SIZE/2 ? dx - sign(dx) * GRID_SIZE : dx;
      const wdy = abs(dy) > GRID_SIZE/2 ? dy - sign(dy) * GRID_SIZE : dy;
      const dist = sqrt(wdx*wdx + wdy*wdy);
      const moveSpeed = min(h.traits.speed, dist);

      if (dist > 0) {
        h.x = ((h.x + round(wdx / dist * moveSpeed)) % GRID_SIZE + GRID_SIZE) % GRID_SIZE;
        h.y = ((h.y + round(wdy / dist * moveSpeed)) % GRID_SIZE + GRID_SIZE) % GRID_SIZE;
      }

      // Eat if on plant
      if (h.x === target.x && h.y === target.y && plants[h.x][h.y] > 0) {
        const eaten = min(plants[h.x][h.y], 20 * h.traits.efficiency);
        h.energy += eaten * h.traits.efficiency;
        plants[h.x][h.y] -= eaten;
      }
    } else {
      // Random walk
      h.x = ((h.x + round(random(-h.traits.speed, h.traits.speed))) % GRID_SIZE + GRID_SIZE) % GRID_SIZE;
      h.y = ((h.y + round(random(-h.traits.speed, h.traits.speed))) % GRID_SIZE + GRID_SIZE) % GRID_SIZE;
    }

    // Reproduction
    const totalPop = herbivores.filter(a => a.alive).length + predators.filter(a => a.alive).length;
    if (h.energy > 60 && random() < h.traits.reproRate && totalPop < carryingCapacity) {
      const childTraits = mutateTraits(h, 'herbivore');
      const child = new Agent(h.x, h.y, 'herbivore', childTraits);
      child.generation = h.generation + 1;
      child.energy = h.energy * 0.4;
      h.energy *= 0.5;
      herbivores.push(child);
      generation = max(generation, child.generation);
    }
  }

  // 3. Predator actions
  const shuffledPreds = [...predators].filter(p => p.alive).sort(() => random() - 0.5);

  for (const p of shuffledPreds) {
    if (!p.alive) continue;
    p.age++;
    p.energy -= 0.6 + p.traits.speed * 0.12;

    if (p.energy <= 0 || p.age > p.maxAge) {
      p.alive = false;
      continue;
    }

    // Hunt
    const prey = findNearestPrey(p.x, p.y, p.traits.vision);
    if (prey) {
      const dx = prey.x - p.x;
      const dy = prey.y - p.y;
      const wdx = abs(dx) > GRID_SIZE/2 ? dx - sign(dx) * GRID_SIZE : dx;
      const wdy = abs(dy) > GRID_SIZE/2 ? dy - sign(dy) * GRID_SIZE : dy;
      const dist = sqrt(wdx*wdx + wdy*wdy);
      const moveSpeed = min(p.traits.speed, dist);

      if (dist > 0) {
        p.x = ((p.x + round(wdx / dist * moveSpeed)) % GRID_SIZE + GRID_SIZE) % GRID_SIZE;
        p.y = ((p.y + round(wdy / dist * moveSpeed)) % GRID_SIZE + GRID_SIZE) % GRID_SIZE;
      }

      // Catch prey
      if (p.x === prey.x && p.y === prey.y) {
        p.energy += prey.energy * p.traits.efficiency;
        prey.alive = false;
      }
    } else {
      p.x = ((p.x + round(random(-p.traits.speed, p.traits.speed))) % GRID_SIZE + GRID_SIZE) % GRID_SIZE;
      p.y = ((p.y + round(random(-p.traits.speed, p.traits.speed))) % GRID_SIZE + GRID_SIZE) % GRID_SIZE;
    }

    // Reproduction
    const totalPop = herbivores.filter(a => a.alive).length + predators.filter(a => a.alive).length;
    if (p.energy > 80 && random() < p.traits.reproRate && totalPop < carryingCapacity) {
      const childTraits = mutateTraits(p, 'predator');
      const child = new Agent(p.x, p.y, 'predator', childTraits);
      child.generation = p.generation + 1;
      child.energy = p.energy * 0.4;
      p.energy *= 0.5;
      predators.push(child);
      generation = max(generation, child.generation);
    }
  }

  // 4. Cleanup dead agents (periodically)
  if (simStep % 50 === 0) {
    herbivores = herbivores.filter(h => h.alive);
    predators = predators.filter(p => p.alive);
  }

  // 5. Check extinctions
  const aliveHerbs = herbivores.filter(h => h.alive).length;
  const alivePreds = predators.filter(p => p.alive).length;

  if (aliveHerbs === 0 && herbivores.length > 0) {
    extinctionCount++;
    // Respawn a few herbivores from "seeds"
    for (let i = 0; i < 5; i++) {
      herbivores.push(new Agent(floor(random(GRID_SIZE)), floor(random(GRID_SIZE)), 'herbivore'));
    }
  }
  if (alivePreds === 0 && predators.length > 0 && simStep > 100) {
    extinctionCount++;
    for (let i = 0; i < 3; i++) {
      predators.push(new Agent(floor(random(GRID_SIZE)), floor(random(GRID_SIZE)), 'predator'));
    }
  }

  // 6. Record history
  if (simStep % 5 === 0) {
    const herbs = herbivores.filter(h => h.alive);
    const preds = predators.filter(p => p.alive);
    let plantCount = 0;
    for (let x = 0; x < GRID_SIZE; x++)
      for (let y = 0; y < GRID_SIZE; y++)
        if (plants[x][y] > 5) plantCount++;

    history.plants.push(plantCount);
    history.herbs.push(herbs.length);
    history.preds.push(preds.length);

    if (herbs.length > 0) {
      history.hSpeed.push(herbs.reduce((s, h) => s + h.traits.speed, 0) / herbs.length);
      history.hVision.push(herbs.reduce((s, h) => s + h.traits.vision, 0) / herbs.length);
    } else {
      history.hSpeed.push(0);
      history.hVision.push(0);
    }

    if (preds.length > 0) {
      history.pSpeed.push(preds.reduce((s, p) => s + p.traits.speed, 0) / preds.length);
      history.pVision.push(preds.reduce((s, p) => s + p.traits.vision, 0) / preds.length);
    } else {
      history.pSpeed.push(0);
      history.pVision.push(0);
    }

    // Trim history
    for (const key in history) {
      if (history[key].length > MAX_HISTORY) history[key].shift();
    }
  }
}

// ===== DRAW =====
function draw() {
  readControls();

  // Run simulation steps
  if (!paused) {
    for (let i = 0; i < simSpeed; i++) {
      simStepFn();
    }
  }

  // Background
  background(8, 8, 15);

  // Draw grid
  const gridPixelW = width;
  const gridPixelH = height - 60;
  CELL_W = gridPixelW / GRID_SIZE;
  CELL_H = gridPixelH / GRID_SIZE;

  // Draw plants (as a continuous field)
  noStroke();
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      if (plants[x][y] > 2) {
        const green = map(plants[x][y], 0, 100, 0, 200);
        fill(10, green + 30, 15, min(255, green + 20));
        rect(x * CELL_W, y * CELL_H, CELL_W + 0.5, CELL_H + 0.5);
      }
    }
  }

  // Draw herbivores
  const aliveHerbs = herbivores.filter(h => h.alive);
  for (const h of aliveHerbs) {
    const speedNorm = constrain(map(h.traits.speed, 0.5, 5, 0, 1), 0, 1);
    const visionNorm = constrain(map(h.traits.vision, 1, 15, 0, 1), 0, 1);
    const r = lerp(180, 255, speedNorm);
    const g = lerp(150, 220, visionNorm);
    const b = lerp(40, 60, 1 - h.energy / 100);
    const sz = constrain(map(h.energy, 0, 100, 2, 5), 2, 6);

    fill(r, g, b, 220);
    noStroke();
    ellipse(h.x * CELL_W + CELL_W/2, h.y * CELL_H + CELL_H/2, sz, sz);

    // Vision range indicator (subtle)
    if (CELL_W > 4) {
      noFill();
      stroke(r, g, b, 30);
      strokeWeight(0.5);
      ellipse(h.x * CELL_W + CELL_W/2, h.y * CELL_H + CELL_H/2, h.traits.vision * CELL_W * 2, h.traits.vision * CELL_H * 2);
    }
  }

  // Draw predators
  const alivePreds = predators.filter(p => p.alive);
  for (const p of alivePreds) {
    const speedNorm = constrain(map(p.traits.speed, 0.5, 6, 0, 1), 0, 1);
    const visionNorm = constrain(map(p.traits.vision, 1, 18, 0, 1), 0, 1);
    const r = lerp(200, 255, speedNorm);
    const g = lerp(60, 120, 1 - visionNorm);
    const b = lerp(60, 80, 1 - p.energy / 120);
    const sz = constrain(map(p.energy, 0, 120, 3, 7), 3, 8);

    fill(r, g, b, 230);
    noStroke();

    // Draw as triangle for predators
    const cx = p.x * CELL_W + CELL_W/2;
    const cy = p.y * CELL_H + CELL_H/2;
    triangle(cx, cy - sz/2, cx - sz/2, cy + sz/2, cx + sz/2, cy + sz/2);

    // Vision range
    if (CELL_W > 4) {
      noFill();
      stroke(r, g, b, 25);
      strokeWeight(0.5);
      ellipse(cx, cy, p.traits.vision * CELL_W * 2, p.traits.vision * CELL_H * 2);
    }
  }

  // Draw graph
  if (showGraph) {
    drawGraph();
    image(graphCanvas, width - 340, 10);
  }

  // Update stats
  updateStats();
}

// ===== GRAPH =====
function drawGraph() {
  const g = graphCanvas;
  g.background(10, 10, 25, 200);
  g.noFill();

  const W = g.width, H = g.height;
  const pad = { l: 40, r: 10, t: 25, b: 25 };
  const plotW = W - pad.l - pad.r;
  const plotH = H - pad.t - pad.b;

  // Title
  g.fill(110, 168, 254);
  g.noStroke();
  g.textSize(10);
  g.textAlign(LEFT, TOP);
  g.text('Population Over Time', pad.l, 6);

  // Find max for scaling
  const allVals = [...history.plants, ...history.herbs.map(v => v * 5), ...history.preds.map(v => v * 10)];
  let maxVal = max(allVals.length > 0 ? allVals : [1]);
  if (maxVal < 1) maxVal = 1;

  // Grid lines
  g.stroke(40, 40, 60);
  g.strokeWeight(0.5);
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (i / 4) * plotH;
    g.line(pad.l, y, pad.l + plotW, y);
    g.fill(80, 80, 100);
    g.noStroke();
    g.textSize(8);
    g.textAlign(RIGHT, CENTER);
    g.text(nf(maxVal * (1 - i/4), 1, 0), pad.l - 4, y);
    g.stroke(40, 40, 60);
  }

  function drawLine(data, col, mult) {
    if (data.length < 2) return;
    g.stroke(col);
    g.strokeWeight(1.2);
    g.noFill();
    g.beginShape();
    for (let i = 0; i < data.length; i++) {
      const x = pad.l + (i / (MAX_HISTORY - 1)) * plotW;
      const y = pad.t + plotH - (data[i] * mult / maxVal) * plotH;
      g.vertex(x, constrain(y, pad.t, pad.t + plotH));
    }
    g.endShape();
  }

  drawLine(history.plants, [74, 222, 128, 180], 1);
  drawLine(history.herbs, [251, 191, 36, 200], 5);
  drawLine(history.preds, [248, 113, 113, 200], 10);

  // Legend
  g.noStroke();
  g.textSize(8);
  g.textAlign(LEFT, CENTER);
  const legendY = H - 8;
  g.fill(74, 222, 128); g.text('■ Plants', pad.l, legendY);
  g.fill(251, 191, 36); g.text('■ Herbs ×5', pad.l + 55, legendY);
  g.fill(248, 113, 113); g.text('■ Preds ×10', pad.l + 120, legendY);
}

// ===== STATS =====
function updateStats() {
  const aliveHerbs = herbivores.filter(h => h.alive);
  const alivePreds = predators.filter(p => p.alive);
  let plantCount = 0;
  for (let x = 0; x < GRID_SIZE; x++)
    for (let y = 0; y < GRID_SIZE; y++)
      if (plants[x][y] > 5) plantCount++;

  document.getElementById('s-step').textContent = simStep;
  document.getElementById('s-gen').textContent = generation;
  document.getElementById('s-plants').textContent = plantCount;
  document.getElementById('s-herbs').textContent = aliveHerbs.length;
  document.getElementById('s-preds').textContent = alivePreds.length;
  document.getElementById('s-extinct').textContent = extinctionCount;
  document.getElementById('s-fps').textContent = nf(frameRate(), 2, 0);

  if (aliveHerbs.length > 0) {
    const avgSpeed = aliveHerbs.reduce((s, h) => s + h.traits.speed, 0) / aliveHerbs.length;
    const avgVision = aliveHerbs.reduce((s, h) => s + h.traits.vision, 0) / aliveHerbs.length;
    document.getElementById('s-hspeed').textContent = avgSpeed.toFixed(2);
    document.getElementById('s-hvision').textContent = avgVision.toFixed(2);
  } else {
    document.getElementById('s-hspeed').textContent = '—';
    document.getElementById('s-hvision').textContent = '—';
  }

  if (alivePreds.length > 0) {
    const avgSpeed = alivePreds.reduce((s, p) => s + p.traits.speed, 0) / alivePreds.length;
    const avgVision = alivePreds.reduce((s, p) => s + p.traits.vision, 0) / alivePreds.length;
    document.getElementById('s-pspeed').textContent = avgSpeed.toFixed(2);
    document.getElementById('s-pvision').textContent = avgVision.toFixed(2);
  } else {
    document.getElementById('s-pspeed').textContent = '—';
    document.getElementById('s-pvision').textContent = '—';
  }
}

// ===== KEYBOARD =====
function keyPressed() {
  if (key === ' ') { togglePause(); return false; }
  if (key === 'r' || key === 'R') resetSim();
  if (key === 'g' || key === 'G') toggleGraph();
  return false;
}
