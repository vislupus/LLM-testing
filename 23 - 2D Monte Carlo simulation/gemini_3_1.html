<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte Carlo Ecosystem & Evolution Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            overflow: hidden;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        #ui-panel {
            width: 320px;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            border: 1px solid #334155;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .stat-row:last-child { margin-bottom: 0; }
        
        .c-plant { color: #22c55e; font-weight: bold; }
        .c-herb { color: #38bdf8; font-weight: bold; }
        .c-pred { color: #ef4444; font-weight: bold; }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        button:hover { background: #7dd3fc; }
        button:active { transform: scale(0.98); }

        /* Chart Canvas */
        #chart {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-top: auto;
        }
        
        .legend {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>Ecosystem Stats</h2>
        
        <div class="stat-box">
            <div class="stat-row"><span>Time Steps:</span> <span id="s-time">0</span></div>
            <div class="stat-row"><span class="c-plant">Plants:</span> <span id="s-plants">0</span></div>
            <div class="stat-row"><span class="c-herb">Herbivores:</span> <span id="s-herbs">0</span></div>
            <div class="stat-row"><span class="c-pred">Predators:</span> <span id="s-preds">0</span></div>
        </div>

        <div class="stat-box" style="margin-bottom: 25px;">
            <div style="margin-bottom:5px; color:#94a3b8; font-size:0.8rem;">Average Herbivore Traits:</div>
            <div class="stat-row"><span>Speed:</span> <span id="s-h-speed">0.00</span></div>
            <div class="stat-row"><span>Vision:</span> <span id="s-h-vis">0.0</span></div>
        </div>

        <div class="control-group">
            <label><span>Mutation Rate</span> <span id="v-mut">5%</span></label>
            <input type="range" id="p-mut" min="0" max="0.2" step="0.01" value="0.05">
        </div>

        <div class="control-group">
            <label><span>Plant Growth Rate</span> <span id="v-pgrow">100</span></label>
            <input type="range" id="p-pgrow" min="10" max="500" step="10" value="100">
        </div>

        <div class="control-group">
            <label><span>Base Metabolism</span> <span id="v-metab">0.5</span></label>
            <input type="range" id="p-metab" min="0.1" max="2.0" step="0.1" value="0.5">
        </div>

        <button id="btn-restart">Trigger Mass Extinction</button>

        <div class="legend">
            <b>Evolution Visuals:</b><br>
            • 🟦 Cyan Herbivores = High Speed<br>
            • 🟥 Pink Predators = High Speed<br>
            • Size = Energy capacity threshold
        </div>

        <canvas id="chart" width="280" height="120"></canvas>
    </div>

<script>
/**
 * 2D Monte Carlo Ecosystem Simulation
 * Core features:
 * - Grid-based spatial hashing for O(1) performance
 * - Probabilistic Monte Carlo agent actions and vision sampling
 * - Neural/Trait evolution via mutation
 */

// --- Simulation Parameters ---
const CELL_SIZE = 8;
let cols, rows;
let timeStep = 0;

// Grid Data
let plants; // Float32Array storing plant density
let spatialGrid; // Array of arrays storing agents per cell

// Agent Data
let agents = [];

// Settings
let MUTATION_RATE = 0.05;
let PLANT_GROWTH_ATTEMPTS = 100;
let BASE_METABOLISM = 0.5;

// Chart Data
let historyH = [];
let historyP = [];
let historyPl = [];
const chartCanvas = document.getElementById('chart');
const ctx = chartCanvas.getContext('2d');

// --- UI Bindings ---
document.getElementById('p-mut').oninput = e => { MUTATION_RATE = parseFloat(e.target.value); document.getElementById('v-mut').innerText = Math.round(MUTATION_RATE*100) + '%'; };
document.getElementById('p-pgrow').oninput = e => { PLANT_GROWTH_ATTEMPTS = parseInt(e.target.value); document.getElementById('v-pgrow').innerText = PLANT_GROWTH_ATTEMPTS; };
document.getElementById('p-metab').oninput = e => { BASE_METABOLISM = parseFloat(e.target.value); document.getElementById('v-metab').innerText = BASE_METABOLISM.toFixed(1); };
document.getElementById('btn-restart').onclick = initSim;

// --- Agent Class ---
class Agent {
    constructor(x, y, type, parent = null) {
        this.x = x;
        this.y = y;
        this.type = type; // 'H' = Herbivore, 'P' = Predator
        this.dead = false;
        
        if (parent) {
            // Inherit & Mutate
            this.speed = this.mutate(parent.speed, 0.1, 1.0);     // Action probability & movement
            this.vision = Math.round(this.mutate(parent.vision, 1, 6)); // Search radius
            this.reproThresh = this.mutate(parent.reproThresh, 5, 20); // Energy required to reproduce
            this.energy = parent.energy / 2;
        } else {
            // Random Genesis
            this.speed = random(0.2, 0.8);
            this.vision = floor(random(1, 4));
            this.reproThresh = random(8, 15);
            this.energy = this.reproThresh * 0.8;
        }
    }

    mutate(val, minV, maxV) {
        if (random() < MUTATION_RATE) {
            val += random(-0.15, 0.15) * (maxV - minV);
        }
        return constrain(val, minV, maxV);
    }

    update() {
        // 1. Metabolism (Energy Burn)
        // Cost scales geometrically with speed and vision (Evolutionary Tradeoff)
        let cost = (BASE_METABOLISM * 0.1) + (this.speed * this.speed * 0.15) + (this.vision * 0.02);
        if (this.type === 'P') cost *= 1.2; // Predators burn more energy
        
        this.energy -= cost;
        if (this.energy <= 0) {
            this.dead = true;
            return;
        }

        // 2. Monte Carlo Action Check (Stochastic Activation)
        // Agent only acts if random chance < its speed trait
        if (random() < this.speed) {
            this.act();
        }

        // 3. Reproduction
        if (this.energy >= this.reproThresh) {
            this.energy /= 2;
            agents.push(new Agent(this.x, this.y, this.type, this));
        }
    }

    act() {
        // Monte Carlo Vision: Sample a few random cells within vision radius rather than exhaustive search.
        // This is extremely efficient and biologically mimics imperfect awareness.
        let samples = this.vision * 4; 
        let bestTarget = null;
        let bestScore = -Infinity;

        for (let i = 0; i < samples; i++) {
            let tx = (this.x + floor(random(-this.vision, this.vision + 1)) + cols) % cols;
            let ty = (this.y + floor(random(-this.vision, this.vision + 1)) + rows) % rows;
            let idx = tx + ty * cols;
            
            let score = 0;
            let cellAgents = spatialGrid[idx];

            if (this.type === 'H') {
                // Herbivore evaluates cell
                score += plants[idx] * 5; // Likes food
                for (let a of cellAgents) {
                    if (a.type === 'P') score -= 100; // Hates predators (Fear)
                }
            } else {
                // Predator evaluates cell
                for (let a of cellAgents) {
                    if (a.type === 'H') score += 50; // Likes prey
                    if (a.type === 'P') score -= 5;  // Slight territoriality (avoids other predators)
                }
            }

            if (score > bestScore) {
                bestScore = score;
                bestTarget = {x: tx, y: ty, idx: idx};
            }
        }

        // Move to best target
        if (bestTarget) {
            this.x = bestTarget.x;
            this.y = bestTarget.y;
        }

        // Interact at new location
        let currentIdx = this.x + this.y * cols;
        if (this.type === 'H') {
            // Eat plant
            if (plants[currentIdx] > 0.1 && random() < 0.8) {
                let bite = min(plants[currentIdx], 1.0);
                this.energy += bite * 2.0; 
                plants[currentIdx] -= bite;
            }
        } else if (this.type === 'P') {
            // Eat herbivore
            let prey = spatialGrid[currentIdx];
            for (let a of prey) {
                if (a.type === 'H' && !a.dead) {
                    if (random() < 0.7) { // 70% kill success rate
                        this.energy += a.energy * 0.5 + 4.0; // Gains energy
                        a.dead = true;
                        break; // Eat one per turn
                    }
                }
            }
        }
    }

    draw() {
        noStroke();
        if (this.type === 'H') {
            // Cyan/Blue based on speed
            fill(0, map(this.speed, 0.2, 1.0, 100, 255), 255, 200);
        } else {
            // Pink/Red based on speed
            fill(255, 0, map(this.speed, 0.2, 1.0, 50, 150), 200);
        }
        // Size scales slightly with reproThreshold (capacity)
        let r = map(this.reproThresh, 5, 20, CELL_SIZE*0.6, CELL_SIZE*1.2);
        circle(this.x * CELL_SIZE + CELL_SIZE/2, this.y * CELL_SIZE + CELL_SIZE/2, r);
    }
}

// --- P5.JS Setup & Loop ---
function setup() {
    let container = document.getElementById('canvas-container');
    let canvas = createCanvas(container.clientWidth, container.clientHeight);
    canvas.parent('canvas-container');
    
    cols = floor(width / CELL_SIZE);
    rows = floor(height / CELL_SIZE);
    
    initSim();
}

function initSim() {
    plants = new Float32Array(cols * rows);
    spatialGrid = new Array(cols * rows).fill(0).map(() => []);
    agents = [];
    timeStep = 0;
    historyH = []; historyP = []; historyPl = [];

    // Seed Plants
    for (let i = 0; i < cols * rows; i++) {
        if (random() < 0.1) plants[i] = random(0.5, 1.0);
    }

    // Seed Agents
    for (let i = 0; i < 400; i++) {
        agents.push(new Agent(floor(random(cols)), floor(random(rows)), 'H'));
    }
    for (let i = 0; i < 40; i++) {
        agents.push(new Agent(floor(random(cols)), floor(random(rows)), 'P'));
    }
}

function draw() {
    background(15, 23, 42); // slate-900
    
    // 1. Plant Growth (Monte Carlo Sampling)
    // Select N random cells and grow plants. If neighbor has plants, higher chance.
    for (let i = 0; i < PLANT_GROWTH_ATTEMPTS; i++) {
        let x = floor(random(cols));
        let y = floor(random(rows));
        let idx = x + y * cols;
        
        if (plants[idx] < 1.0) {
            plants[idx] += 0.2;
            // Diffusion / Seed spreading
            if (random() < 0.2) {
                let nx = (x + floor(random(-1, 2)) + cols) % cols;
                let ny = (y + floor(random(-1, 2)) + rows) % rows;
                plants[nx + ny * cols] = min(1.0, plants[nx + ny * cols] + 0.1);
            }
        }
    }

    // 2. Draw Plants
    noStroke();
    let totalPlants = 0;
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            let p = plants[x + y * cols];
            if (p > 0) {
                fill(34, 197, 94, p * 180); // Green with opacity
                rect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                totalPlants++;
            }
        }
    }

    // 3. Rebuild Spatial Grid for O(1) Lookups
    for (let i = 0; i < cols * rows; i++) {
        spatialGrid[i].length = 0; 
    }
    for (let a of agents) {
        if (!a.dead) spatialGrid[a.x + a.y * cols].push(a);
    }

    // 4. Update & Draw Agents
    let hCount = 0, pCount = 0;
    let avgHSpeed = 0, avgHVis = 0;

    for (let i = agents.length - 1; i >= 0; i--) {
        let a = agents[i];
        a.update();
        
        if (a.dead) {
            // Become fertilizer
            plants[a.x + a.y * cols] = min(1.0, plants[a.x + a.y * cols] + 0.3);
            agents.splice(i, 1);
        } else {
            a.draw();
            if (a.type === 'H') {
                hCount++;
                avgHSpeed += a.speed;
                avgHVis += a.vision;
            } else {
                pCount++;
            }
        }
    }

    // 5. Update UI & Charts
    timeStep++;
    if (timeStep % 10 === 0) {
        document.getElementById('s-time').innerText = timeStep;
        document.getElementById('s-plants').innerText = totalPlants;
        document.getElementById('s-herbs').innerText = hCount;
        document.getElementById('s-preds').innerText = pCount;
        
        if (hCount > 0) {
            document.getElementById('s-h-speed').innerText = (avgHSpeed / hCount).toFixed(2);
            document.getElementById('s-h-vis').innerText = (avgHVis / hCount).toFixed(1);
        }

        // Add to history
        historyH.push(hCount);
        historyP.push(pCount);
        historyPl.push(totalPlants / 5); // Scale down plants for chart
        
        if (historyH.length > chartCanvas.width) {
            historyH.shift(); historyP.shift(); historyPl.shift();
        }
        
        drawChart();
    }
}

// --- Chart Drawing Logic ---
function drawChart() {
    ctx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
    
    let maxVal = Math.max(...historyH, ...historyP, ...historyPl, 10);
    
    function drawLine(data, color) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        for (let i = 0; i < data.length; i++) {
            let x = i;
            let y = chartCanvas.height - (data[i] / maxVal) * chartCanvas.height;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    drawLine(historyPl, '#22c55e'); // Green (Plants)
    drawLine(historyH, '#38bdf8');  // Blue (Herbivores)
    drawLine(historyP, '#ef4444');  // Red (Predators)
}

function windowResized() {
    let container = document.getElementById('canvas-container');
    resizeCanvas(container.clientWidth, container.clientHeight);
    cols = floor(width / CELL_SIZE);
    rows = floor(height / CELL_SIZE);
    initSim();
}
</script>
</body>
</html>
