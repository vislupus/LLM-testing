<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSIM • Evolving Ecosystem</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0f1a;
            font-family: 'Inter', system-ui;
            color: #ddd;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15,20,40,0.92);
            padding: 20px;
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            user-select: none;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 21px;
            text-align: center;
            color: #6cf;
        }
        .control {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #88ffdd;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #6cf;
        }
        .val {
            float: right;
            font-family: monospace;
            color: #6cf;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6cf;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        #stats {
            position: absolute;
            bottom: 25px;
            left: 25px;
            background: rgba(0,0,0,0.6);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>ECOSIM</h1>
        
        <div class="control">
            <label>MUTATION RATE <span id="mutVal" class="val">0.08</span></label>
            <input type="range" id="mutSlider" min="0" max="40" value="8">
        </div>
        
        <div class="control">
            <label>INITIAL HERBIVORES <span id="herbVal" class="val">80</span></label>
            <input type="range" id="herbSlider" min="20" max="200" value="80">
        </div>
        
        <div class="control">
            <label>INITIAL PREDATORS <span id="predVal" class="val">25</span></label>
            <input type="range" id="predSlider" min="5" max="80" value="25">
        </div>
        
        <button onclick="resetSimulation()">RESET ECOSYSTEM</button>
    </div>
    
    <div id="stats">
        PLANTS: <span id="plantCount">0</span><br>
        HERBIVORES: <span id="herbCount">0</span><br>
        PREDATORS: <span id="predCount">0</span><br>
        AVG SPEED: <span id="avgSpeed">0</span>
    </div>

    <script>
        // ================================================
        // ECOSIM — Evolving Monte Carlo Ecosystem
        // Plants • Herbivores • Predators
        // Probabilistic Monte Carlo rules
        // Trait mutation & evolution
        // Real-time statistics
        // Single standalone HTML file
        // ================================================

        let plants = [];
        let herbivores = [];
        let predators = [];
        
        let mutationRate = 0.08;
        let targetHerb = 80;
        let targetPred = 25;
        
        let history = { plants: [], herbs: [], preds: [] };
        
        class Plant {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.energy = random(40, 90);
                this.size = 5;
            }
            update() {
                if (random() < 0.12) this.energy = min(100, this.energy + 8);
                if (this.energy > 85 && random() < 0.04) {
                    let nx = this.pos.x + random(-35, 35);
                    let ny = this.pos.y + random(-35, 35);
                    plants.push(new Plant(nx, ny));
                }
            }
            draw() {
                fill(80, 255, 90, this.energy);
                noStroke();
                circle(this.pos.x, this.pos.y, this.size);
            }
        }
        
        class Herbivore {
            constructor(x, y, traits = null) {
                this.pos = createVector(x, y);
                this.vel = createVector(random(-1.2, 1.2), random(-1.2, 1.2));
                this.energy = 60;
                this.traits = traits || {
                    speed: random(1.6, 3.2),
                    vision: random(45, 95),
                    reproRate: random(0.008, 0.028)
                };
                this.size = 7;
                this.color = color(100, 180, 255);
            }
            update() {
                // Movement with vision bias toward plants
                let closestPlant = null;
                let minDist = Infinity;
                for (let p of plants) {
                    let d = this.pos.dist(p.pos);
                    if (d < this.traits.vision && d < minDist) {
                        minDist = d;
                        closestPlant = p;
                    }
                }
                if (closestPlant) {
                    let dir = p5.Vector.sub(closestPlant.pos, this.pos);
                    dir.normalize();
                    this.vel.add(dir.mult(0.6));
                }
                this.vel.mult(0.96);
                this.pos.add(this.vel.copy().mult(this.traits.speed));
                
                // Eat nearby plants
                for (let i = plants.length - 1; i >= 0; i--) {
                    if (this.pos.dist(plants[i].pos) < 14) {
                        this.energy += plants[i].energy * 0.7;
                        plants.splice(i, 1);
                        break;
                    }
                }
                
                // Reproduction with mutation
                if (this.energy > 75 && random() < this.traits.reproRate) {
                    let childTraits = {
                        speed: this.traits.speed + random(-mutationRate, mutationRate),
                        vision: this.traits.vision + random(-mutationRate*30, mutationRate*30),
                        reproRate: this.traits.reproRate + random(-mutationRate*0.01, mutationRate*0.01)
                    };
                    let child = new Herbivore(this.pos.x + random(-12,12), this.pos.y + random(-12,12), childTraits);
                    herbivores.push(child);
                    this.energy *= 0.6;
                }
                
                // Death
                this.energy -= 0.35;
                if (this.energy <= 0) {
                    let idx = herbivores.indexOf(this);
                    if (idx > -1) herbivores.splice(idx, 1);
                }
            }
            draw() {
                fill(this.color);
                circle(this.pos.x, this.pos.y, this.size);
            }
        }
        
        class Predator {
            constructor(x, y, traits = null) {
                this.pos = createVector(x, y);
                this.vel = createVector(random(-1.8, 1.8), random(-1.8, 1.8));
                this.energy = 55;
                this.traits = traits || {
                    speed: random(2.2, 4.1),
                    vision: random(65, 130),
                    reproRate: random(0.004, 0.016)
                };
                this.size = 9;
                this.color = color(255, 80, 90);
            }
            update() {
                let closestHerb = null;
                let minDist = Infinity;
                for (let h of herbivores) {
                    let d = this.pos.dist(h.pos);
                    if (d < this.traits.vision && d < minDist) {
                        minDist = d;
                        closestHerb = h;
                    }
                }
                if (closestHerb) {
                    let dir = p5.Vector.sub(closestHerb.pos, this.pos);
                    dir.normalize();
                    this.vel.add(dir.mult(0.9));
                }
                this.vel.mult(0.94);
                this.pos.add(this.vel.copy().mult(this.traits.speed));
                
                // Eat nearby herbivores
                for (let i = herbivores.length - 1; i >= 0; i--) {
                    if (this.pos.dist(herbivores[i].pos) < 16) {
                        this.energy += herbivores[i].energy * 0.6;
                        herbivores.splice(i, 1);
                        break;
                    }
                }
                
                // Reproduction
                if (this.energy > 85 && random() < this.traits.reproRate) {
                    let childTraits = {
                        speed: this.traits.speed + random(-mutationRate, mutationRate),
                        vision: this.traits.vision + random(-mutationRate*25, mutationRate*25),
                        reproRate: this.traits.reproRate + random(-mutationRate*0.008, mutationRate*0.008)
                    };
                    let child = new Predator(this.pos.x + random(-15,15), this.pos.y + random(-15,15), childTraits);
                    predators.push(child);
                    this.energy *= 0.55;
                }
                
                this.energy -= 0.55;
                if (this.energy <= 0) {
                    let idx = predators.indexOf(this);
                    if (idx > -1) predators.splice(idx, 1);
                }
            }
            draw() {
                fill(this.color);
                circle(this.pos.x, this.pos.y, this.size);
            }
        }
        
        function setup() {
            createCanvas(920, 620);
            resetSimulation();
        }
        
        function resetSimulation() {
            plants = [];
            herbivores = [];
            predators = [];
            
            // Initial plants
            for (let i = 0; i < 620; i++) {
                plants.push(new Plant(random(width), random(height)));
            }
            
            // Initial herbivores
            for (let i = 0; i < 80; i++) {
                herbivores.push(new Herbivore(random(width), random(height)));
            }
            
            // Initial predators
            for (let i = 0; i < 25; i++) {
                predators.push(new Predator(random(width), random(height)));
            }
        }
        
        function draw() {
            background(10, 15, 25);
            
            // Update plants
            for (let i = plants.length - 1; i >= 0; i--) {
                plants[i].update();
                plants[i].draw();
            }
            
            // Update herbivores (Monte Carlo style: only some act each frame)
            for (let i = 0; i < herbivores.length; i++) {
                if (random() < 0.7) herbivores[i].update();
                herbivores[i].draw();
            }
            
            // Update predators
            for (let i = 0; i < predators.length; i++) {
                if (random() < 0.85) predators[i].update();
                predators[i].draw();
            }
            
            // Spawn new plants if low
            if (plants.length < 300 && random() < 0.4) {
                plants.push(new Plant(random(width), random(height)));
            }
            
            // Update stats
            document.getElementById('plantCount').textContent = plants.length;
            document.getElementById('herbCount').textContent = herbivores.length;
            document.getElementById('predCount').textContent = predators.length;
            
            // Simple average speed (herbivores only)
            let avgSpeed = 0;
            if (herbivores.length > 0) {
                for (let h of herbivores) avgSpeed += h.traits.speed;
                avgSpeed /= herbivores.length;
            }
            document.getElementById('avgSpeed').textContent = avgSpeed.toFixed(1);
        }
        
        function mousePressed() {
            if (mouseButton === LEFT) {
                // Add plant
                plants.push(new Plant(mouseX, mouseY));
            } else if (mouseButton === CENTER) {
                // Add herbivore
                herbivores.push(new Herbivore(mouseX, mouseY));
            } else if (mouseButton === RIGHT) {
                // Add predator
                predators.push(new Predator(mouseX, mouseY));
            }
        }
        
        function setupUI() {
            const mutSlider = document.getElementById('mutSlider');
            mutSlider.oninput = () => {
                mutationRate = parseFloat(mutSlider.value) / 100;
                document.getElementById('mutVal').textContent = mutationRate.toFixed(2);
            };
            
            const herbSlider = document.getElementById('herbSlider');
            herbSlider.oninput = () => {
                targetHerb = parseInt(herbSlider.value);
                document.getElementById('herbVal').textContent = targetHerb;
            };
            
            const predSlider = document.getElementById('predSlider');
            predSlider.oninput = () => {
                targetPred = parseInt(predSlider.value);
                document.getElementById('predVal').textContent = targetPred;
            };
        }
        
        window.onload = () => {
            setupUI();
        };
    </script>
</body>
</html>
