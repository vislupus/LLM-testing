<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID RUNNER — Survivor Action</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; cursor: crosshair; }
canvas { display: block; }

#ui-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#ui-layer > * { pointer-events: auto; }

#hud {
  position: absolute; top: 0; left: 0; width: 100%; padding: 16px 24px;
  display: none; flex-direction: column; gap: 8px;
}

.bar-container {
  width: 320px; height: 22px; background: rgba(0,0,0,0.6);
  border: 2px solid rgba(255,255,255,0.15); border-radius: 11px;
  overflow: hidden; position: relative;
}
.bar-fill {
  height: 100%; border-radius: 9px; transition: width 0.3s;
  position: relative;
}
.bar-fill::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
  border-radius: 9px 9px 0 0;
}
.bar-label {
  position: absolute; top: 50%; left: 12px; transform: translateY(-50%);
  color: #fff; font-size: 11px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  letter-spacing: 0.5px; z-index: 1;
}

#hp-bar .bar-fill { background: linear-gradient(90deg, #ff2255, #ff6644); }
#xp-bar .bar-fill { background: linear-gradient(90deg, #4488ff, #44ffcc); }

#stats-row {
  display: flex; gap: 20px; align-items: center; margin-top: 4px;
}
.stat {
  color: #aab; font-size: 13px; font-weight: 600;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
.stat span { color: #fff; }

#wave-announce {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #fff; font-size: 48px; font-weight: 900; letter-spacing: 4px;
  text-shadow: 0 0 40px rgba(100,200,255,0.8), 0 0 80px rgba(100,200,255,0.4);
  opacity: 0; transition: opacity 0.3s; text-align: center;
}
#wave-announce .sub {
  font-size: 18px; font-weight: 400; letter-spacing: 2px; color: #8cf;
  margin-top: 8px;
}

#upgrade-panel {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  display: none; flex-direction: column; align-items: center; gap: 16px;
  z-index: 100;
}
#upgrade-panel h2 {
  color: #fff; font-size: 32px; font-weight: 900; letter-spacing: 3px;
  text-shadow: 0 0 30px rgba(100,200,255,0.6);
}
#upgrade-panel .subtitle {
  color: #8cf; font-size: 14px; margin-bottom: 8px;
}
#upgrade-cards {
  display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
}
.upgrade-card {
  width: 200px; padding: 20px 16px; background: rgba(10,15,30,0.9);
  border: 2px solid rgba(100,200,255,0.3); border-radius: 12px;
  cursor: pointer; transition: all 0.2s; text-align: center;
  backdrop-filter: blur(10px);
}
.upgrade-card:hover {
  border-color: rgba(100,200,255,0.8); transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(100,200,255,0.3);
}
.upgrade-card .icon { font-size: 36px; margin-bottom: 8px; }
.upgrade-card .name { color: #fff; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.upgrade-card .desc { color: #8ab; font-size: 12px; line-height: 1.4; }
.upgrade-card .rarity {
  font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px;
  text-transform: uppercase;
}
.rarity-common { color: #8ab; }
.rarity-rare { color: #4af; }
.rarity-epic { color: #a4f; }
.rarity-legendary { color: #fa4; }

#game-over {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  display: none; flex-direction: column; align-items: center; gap: 16px;
  text-align: center; z-index: 100;
}
#game-over h1 {
  color: #ff4466; font-size: 56px; font-weight: 900; letter-spacing: 4px;
  text-shadow: 0 0 40px rgba(255,50,80,0.6);
}
#game-over .final-stats {
  color: #aab; font-size: 16px; line-height: 2;
}
#game-over .final-stats span { color: #fff; font-weight: 700; }

.btn {
  padding: 14px 40px; background: linear-gradient(135deg, #2244aa, #4488ff);
  color: #fff; border: none; border-radius: 8px; font-size: 16px;
  font-weight: 700; letter-spacing: 2px; cursor: pointer;
  transition: all 0.2s; text-transform: uppercase;
}
.btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(68,136,255,0.5); }

#title-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; z-index: 200;
  background: radial-gradient(ellipse at center, rgba(10,15,40,0.8) 0%, rgba(0,0,0,0.95) 100%);
}
#title-screen h1 {
  font-size: 72px; font-weight: 900; letter-spacing: 8px;
  background: linear-gradient(135deg, #4488ff, #44ffcc, #aa44ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: none; filter: drop-shadow(0 0 30px rgba(68,136,255,0.5));
}
#title-screen .tagline {
  color: #668; font-size: 16px; letter-spacing: 4px; text-transform: uppercase;
}
#title-screen .controls {
  color: #556; font-size: 13px; margin-top: 10px; text-align: center; line-height: 1.8;
}
#title-screen .controls b { color: #8ab; }

#minimap {
  position: absolute; bottom: 20px; right: 20px;
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(100,200,255,0.3);
  background: rgba(0,0,0,0.5); overflow: hidden;
}
#minimap canvas { width: 100%; height: 100%; }

#weapon-display {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
}
.weapon-slot {
  width: 56px; height: 56px; background: rgba(0,0,0,0.6);
  border: 2px solid rgba(100,200,255,0.2); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; position: relative;
}
.weapon-slot.active { border-color: rgba(100,200,255,0.7); }
.weapon-slot .cd-overlay {
  position: absolute; bottom: 0; left: 0; width: 100%;
  background: rgba(0,0,0,0.7); border-radius: 0 0 8px 8px;
  transition: height 0.1s;
}

#damage-numbers {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden;
}
.dmg-num {
  position: absolute; font-weight: 900; pointer-events: none;
  animation: dmgFloat 1s ease-out forwards;
  text-shadow: 0 0 6px currentColor;
}
@keyframes dmgFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(0.6); }
}

#kill-counter {
  position: absolute; top: 16px; right: 24px;
  color: #fff; font-size: 14px; font-weight: 700;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

#boss-hp-container {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  width: 500px; display: none; flex-direction: column; align-items: center; gap: 4px;
}
#boss-name { color: #ff4466; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
#boss-hp-bar {
  width: 100%; height: 12px; background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,50,80,0.4); border-radius: 6px; overflow: hidden;
}
#boss-hp-fill {
  height: 100%; background: linear-gradient(90deg, #ff2244, #ff6644);
  border-radius: 6px; transition: width 0.3s;
}

#pickup-notify {
  position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
  color: #4f8; font-size: 14px; font-weight: 700; opacity: 0;
  text-shadow: 0 0 10px rgba(68,255,136,0.6); transition: opacity 0.3s;
}

#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  pointer-events: none; z-index: 15;
  width: 24px; height: 24px;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(100,200,255,0.6);
}
#crosshair::before {
  width: 2px; height: 100%; left: 50%; transform: translateX(-50%);
}
#crosshair::after {
  height: 2px; width: 100%; top: 50%; transform: translateY(-50%);
}
#crosshair .dot {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(100,200,255,0.8);
  box-shadow: 0 0 6px rgba(100,200,255,0.5);
}

.screen-flash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 50; opacity: 0;
}

#vignette {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 5;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
}
</style>
</head>
<body>

<div id="vignette"></div>
<div id="ui-layer">
  <div id="hud">
    <div class="bar-container" id="hp-bar">
      <div class="bar-fill" style="width:100%"></div>
      <div class="bar-label">HP 100 / 100</div>
    </div>
    <div class="bar-container" id="xp-bar">
      <div class="bar-fill" style="width:0%"></div>
      <div class="bar-label">XP 0 / 10</div>
    </div>
    <div id="stats-row">
      <div class="stat">LVL <span id="level-num">1</span></div>
      <div class="stat">WAVE <span id="wave-num">1</span></div>
      <div class="stat">SCORE <span id="score-num">0</span></div>
      <div class="stat">TIME <span id="time-num">0:00</span></div>
    </div>
  </div>

  <div id="wave-announce"></div>

  <div id="upgrade-panel">
    <h2>LEVEL UP</h2>
    <div class="subtitle">Choose an upgrade</div>
    <div id="upgrade-cards"></div>
  </div>

  <div id="game-over">
    <h1>VOID CLAIMED</h1>
    <div class="final-stats" id="final-stats"></div>
    <button class="btn" onclick="restartGame()">RESTART</button>
  </div>

  <div id="title-screen">
    <h1>VOID RUNNER</h1>
    <div class="tagline">Survive the endless horde</div>
    <button class="btn" onclick="startGame()">ENTER THE VOID</button>
    <div class="controls">
      <b>WASD</b> Move &nbsp;|&nbsp; <b>Mouse</b> Aim &nbsp;|&nbsp; Combat is automatic<br>
      Survive waves • Collect XP • Choose upgrades • Defeat bosses
    </div>
  </div>

  <div id="minimap"><canvas id="minimap-canvas" width="160" height="160"></canvas></div>

  <div id="weapon-display"></div>

  <div id="damage-numbers"></div>

  <div id="kill-counter">KILLS: <span id="kill-num">0</span></div>

  <div id="boss-hp-container">
    <div id="boss-name">VOID TITAN</div>
    <div id="boss-hp-bar"><div id="boss-hp-fill" style="width:100%"></div></div>
  </div>

  <div id="pickup-notify"></div>

  <div class="screen-flash" id="flash-red" style="background:rgba(255,30,60,0.3)"></div>
  <div class="screen-flash" id="flash-blue" style="background:rgba(60,130,255,0.2)"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// VOID RUNNER — Complete 3D Survivor Action Game
// ============================================================

// --- GLOBALS ---
let scene, camera, renderer, clock;
let player, playerGroup;
let enemies = [], projectiles = [], pickups = [], particles = [], damageNums3D = [];
let environmentObjects = [];
let gameActive = false, gamePaused = false, gameOverState = false;
let gameTime = 0, score = 0, kills = 0;
let wave = 1, waveTimer = 0, waveSpawnCount = 0, waveTotalEnemies = 0, waveEnemiesSpawned = 0;
let bossActive = false, currentBoss = null;

// Player stats
let P = {
  hp: 100, maxHp: 100, hpRegen: 0, speed: 12, xp: 0, xpToLevel: 10, level: 1,
  damage: 10, fireRate: 0.4, fireTimer: 0, range: 25, critChance: 0.05, critMult: 2,
  armor: 0, magnetRange: 3, weapons: ['pulse'], weaponData: {},
  piercing: 0, chainLightning: 0, orbitalStrike: 0, orbitalTimer: 0,
  novaBlast: 0, novaTimer: 0, frostNova: 0,
  multiShot: 0, attackSpeed: 1, lifeSteal: 0, dodgeChance: 0,
  moveSpeedMult: 1, damageMult: 1, maxHpMult: 1
};

const keys = {};
let mouseX = 0, mouseY = 0, mouseWorld = new THREE.Vector3();
let aimAngle = 0;
let screenShake = 0, screenShakeIntensity = 0;
let cameraBasePos = new THREE.Vector3(0, 28, 22);

// --- THREE.JS SETUP ---
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050510);
  scene.fog = new THREE.FogExp2(0x050510, 0.012);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 28, 22);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.insertBefore(renderer.domElement, document.getElementById('ui-layer'));

  // Lighting
  const ambient = new THREE.AmbientLight(0x1a1a3a, 0.6);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0x4466aa, 0.8);
  dirLight.position.set(20, 40, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.left = -60;
  dirLight.shadow.camera.right = 60;
  dirLight.shadow.camera.top = 60;
  dirLight.shadow.camera.bottom = -60;
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 100;
  dirLight.shadow.bias = -0.001;
  scene.add(dirLight);

  // Point lights for atmosphere
  const colors = [0x4488ff, 0xaa44ff, 0x44ffaa, 0xff4466];
  for (let i = 0; i < 4; i++) {
    const pl = new THREE.PointLight(colors[i], 2, 40);
    const angle = (i / 4) * Math.PI * 2;
    pl.position.set(Math.cos(angle) * 30, 8, Math.sin(angle) * 30);
    scene.add(pl);
  }

  clock = new THREE.Clock();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// --- PROCEDURAL ENVIRONMENT ---
function createEnvironment() {
  // Ground
  const groundGeo = new THREE.PlaneGeometry(160, 160, 40, 40);
  const positions = groundGeo.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i), y = positions.getY(i);
    positions.setZ(i, (Math.sin(x * 0.3) * Math.cos(y * 0.3) * 0.5 +
      Math.sin(x * 0.1 + y * 0.15) * 1.0));
  }
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a2e, roughness: 0.9, metalness: 0.1,
    flatShading: true
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid overlay
  const gridGeo = new THREE.PlaneGeometry(160, 160);
  const gridMat = new THREE.MeshBasicMaterial({
    color: 0x222244, transparent: true, opacity: 0.15,
    wireframe: true
  });
  const grid = new THREE.Mesh(gridGeo, gridMat);
  grid.rotation.x = -Math.PI / 2;
  grid.position.y = 0.05;
  scene.add(grid);

  // Crystal formations
  environmentObjects = [];
  for (let i = 0; i < 30; i++) {
    const crystal = createCrystal();
    const angle = Math.random() * Math.PI * 2;
    const dist = 15 + Math.random() * 50;
    crystal.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
    crystal.rotation.y = Math.random() * Math.PI * 2;
    scene.add(crystal);
    environmentObjects.push(crystal);
  }

  // Rock formations
  for (let i = 0; i < 20; i++) {
    const rock = createRock();
    const angle = Math.random() * Math.PI * 2;
    const dist = 10 + Math.random() * 55;
    rock.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
    scene.add(rock);
    environmentObjects.push(rock);
  }

  // Glowing floor runes
  for (let i = 0; i < 8; i++) {
    const rune = createFloorRune();
    const angle = (i / 8) * Math.PI * 2;
    const dist = 20 + Math.random() * 15;
    rune.position.set(Math.cos(angle) * dist, 0.1, Math.sin(angle) * dist);
    scene.add(rune);
  }

  // Boundary ring
  const ringGeo = new THREE.RingGeometry(68, 70, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x4488ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.2;
  scene.add(ring);

  // Floating particles in the air
  const dustGeo = new THREE.BufferGeometry();
  const dustCount = 500;
  const dustPos = new Float32Array(dustCount * 3);
  for (let i = 0; i < dustCount; i++) {
    dustPos[i * 3] = (Math.random() - 0.5) * 120;
    dustPos[i * 3 + 1] = Math.random() * 20 + 1;
    dustPos[i * 3 + 2] = (Math.random() - 0.5) * 120;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  const dustMat = new THREE.PointsMaterial({
    color: 0x4488ff, size: 0.15, transparent: true, opacity: 0.4,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const dust = new THREE.Points(dustGeo, dustMat);
  dust.userData.isDust = true;
  scene.add(dust);
}

function createCrystal() {
  const group = new THREE.Group();
  const h = 2 + Math.random() * 5;
  const geo = new THREE.ConeGeometry(0.4 + Math.random() * 0.6, h, 5 + Math.floor(Math.random() * 3));
  const hue = Math.random();
  const color = new THREE.Color().setHSL(hue, 0.7, 0.5);
  const mat = new THREE.MeshStandardMaterial({
    color: color, emissive: color, emissiveIntensity: 0.3,
    roughness: 0.2, metalness: 0.8, flatShading: true,
    transparent: true, opacity: 0.85
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = h / 2;
  mesh.castShadow = true;
  group.add(mesh);

  // Glow light
  const light = new THREE.PointLight(color, 1, 8);
  light.position.y = h * 0.7;
  group.add(light);

  return group;
}

function createRock() {
  const group = new THREE.Group();
  const s = 0.5 + Math.random() * 1.5;
  const geo = new THREE.DodecahedronGeometry(s, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x2a2a3e, roughness: 0.9, metalness: 0.2, flatShading: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = s * 0.5;
  mesh.rotation.set(Math.random(), Math.random(), Math.random());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
  return group;
}

function createFloorRune() {
  const geo = new THREE.RingGeometry(0.8, 1.2, 6);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x4488ff, transparent: true, opacity: 0.15, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  return mesh;
}

// --- PLAYER ---
function createPlayer() {
  playerGroup = new THREE.Group();

  // Body - sleek armored torso
  const bodyGeo = new THREE.CylinderGeometry(0.3, 0.4, 1.2, 8);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x2244aa, roughness: 0.3, metalness: 0.7, flatShading: true
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.0;
  body.castShadow = true;
  playerGroup.add(body);

  // Chest plate
  const chestGeo = new THREE.BoxGeometry(0.6, 0.4, 0.3);
  const chestMat = new THREE.MeshStandardMaterial({
    color: 0x3366cc, roughness: 0.2, metalness: 0.8, flatShading: true
  });
  const chest = new THREE.Mesh(chestGeo, chestMat);
  chest.position.set(0, 1.3, 0.1);
  chest.castShadow = true;
  playerGroup.add(chest);

  // Head - helmet
  const headGeo = new THREE.SphereGeometry(0.28, 8, 6);
  const headMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a3a, roughness: 0.2, metalness: 0.9, flatShading: true
  });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 1.85;
  head.castShadow = true;
  playerGroup.add(head);

  // Visor glow
  const visorGeo = new THREE.BoxGeometry(0.4, 0.1, 0.15);
  const visorMat = new THREE.MeshBasicMaterial({ color: 0x44ffcc });
  const visor = new THREE.Mesh(visorGeo, visorMat);
  visor.position.set(0, 1.85, 0.2);
  playerGroup.add(visor);

  // Player glow light
  const playerLight = new THREE.PointLight(0x4488ff, 2, 12);
  playerLight.position.y = 1.5;
  playerGroup.add(playerLight);

  // Magnet range ring
  const magnetGeo = new THREE.RingGeometry(2.8, 3.2, 32);
  const magnetMat = new THREE.MeshBasicMaterial({
    color: 0x44ffcc, transparent: true, opacity: 0.1, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const magnetRing = new THREE.Mesh(magnetGeo, magnetMat);
  magnetRing.rotation.x = -Math.PI / 2;
  magnetRing.position.y = 0.15;
  magnetRing.userData.isMagnetRing = true;
  playerGroup.add(magnetRing);

  // Shoulder pads
  for (let side of [-1, 1]) {
    const shoulderGeo = new THREE.BoxGeometry(0.25, 0.15, 0.3);
    const shoulder = new THREE.Mesh(shoulderGeo, chestMat);
    shoulder.position.set(side * 0.4, 1.5, 0);
    shoulder.castShadow = true;
    playerGroup.add(shoulder);
  }

  // Legs
  for (let side of [-1, 1]) {
    const legGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.6, 6);
    const leg = new THREE.Mesh(legGeo, bodyMat);
    leg.position.set(side * 0.18, 0.3, 0);
    leg.castShadow = true;
    playerGroup.add(leg);
  }

  // Cape / energy trail
  const capeGeo = new THREE.PlaneGeometry(0.5, 1.0);
  const capeMat = new THREE.MeshBasicMaterial({
    color: 0x4488ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const cape = new THREE.Mesh(capeGeo, capeMat);
  cape.position.set(0, 1.0, -0.3);
  cape.userData.isCape = true;
  playerGroup.add(cape);

  playerGroup.position.set(0, 0, 0);
  scene.add(playerGroup);
  player = playerGroup;
}

// --- ENEMY CREATION ---
function createEnemy(type, pos) {
  const group = new THREE.Group();
  let hp, speed, dmg, xpValue, size, color;

  switch(type) {
    case 'crawler':
      hp = 15 + wave * 3; speed = 6 + wave * 0.2; dmg = 5 + wave;
      xpValue = 2; size = 0.5; color = 0x44cc44;
      // Small insectoid
      const cBody = new THREE.Mesh(
        new THREE.SphereGeometry(size, 6, 4),
        new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.3, flatShading: true })
      );
      cBody.position.y = size;
      cBody.castShadow = true;
      group.add(cBody);
      // Eyes
      for (let s of [-1, 1]) {
        const eye = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 4, 4),
          new THREE.MeshBasicMaterial({ color: 0xff4444 })
        );
        eye.position.set(s * 0.2, size + 0.15, size * 0.6);
        group.add(eye);
      }
      // Legs
      for (let i = 0; i < 4; i++) {
        for (let s of [-1, 1]) {
          const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.03, 0.5, 3),
            new THREE.MeshStandardMaterial({ color: 0x338833, flatShading: true })
          );
          leg.position.set(s * 0.4, size * 0.5, (i - 1.5) * 0.2);
          leg.rotation.z = s * 0.5;
          group.add(leg);
        }
      }
      break;

    case 'brute':
      hp = 60 + wave * 10; speed = 2.5 + wave * 0.1; dmg = 15 + wave * 2;
      xpValue = 5; size = 1.0; color = 0xcc4444;
      // Large hulking creature
      const bBody = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.6, 0.8),
        new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.2, flatShading: true })
      );
      bBody.position.y = 1.2;
      bBody.castShadow = true;
      group.add(bBody);
      // Head
      const bHead = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 0.6, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x883333, flatShading: true })
      );
      bHead.position.y = 2.3;
      bHead.castShadow = true;
      group.add(bHead);
      // Horns
      for (let s of [-1, 1]) {
        const horn = new THREE.Mesh(
          new THREE.ConeGeometry(0.1, 0.5, 4),
          new THREE.MeshStandardMaterial({ color: 0x666666, flatShading: true })
        );
        horn.position.set(s * 0.25, 2.7, 0);
        group.add(horn);
      }
      // Arms
      for (let s of [-1, 1]) {
        const arm = new THREE.Mesh(
          new THREE.BoxGeometry(0.3, 1.0, 0.3),
          new THREE.MeshStandardMaterial({ color: 0xaa3333, flatShading: true })
        );
        arm.position.set(s * 0.8, 1.0, 0);
        arm.castShadow = true;
        group.add(arm);
      }
      break;

    case 'spitter':
      hp = 25 + wave * 5; speed = 3.5; dmg = 8 + wave;
      xpValue = 3; size = 0.7; color = 0xcc44cc;
      // Tall thin ranged enemy
      const sBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.35, 1.4, 6),
        new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.4, flatShading: true })
      );
      sBody.position.y = 1.0;
      sBody.castShadow = true;
      group.add(sBody);
      // Glowing mouth
      const mouth = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 6, 4),
        new THREE.MeshBasicMaterial({ color: 0xff44ff })
      );
      mouth.position.set(0, 1.6, 0.25);
      group.add(mouth);
      // Orb on top
      const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xff88ff, transparent: true, opacity: 0.8 })
      );
      orb.position.y = 2.0;
      group.add(orb);
      const sLight = new THREE.PointLight(0xff44ff, 0.5, 5);
      sLight.position.y = 2.0;
      group.add(sLight);
      break;

    case 'wraith':
      hp = 35 + wave * 6; speed = 5 + wave * 0.15; dmg = 10 + wave;
      xpValue = 4; size = 0.6; color = 0x4444cc;
      // Floating ghostly entity
      const wBody = new THREE.Mesh(
        new THREE.SphereGeometry(size, 8, 6),
        new THREE.MeshStandardMaterial({
          color, emissive: color, emissiveIntensity: 0.4,
          roughness: 0.3, metalness: 0.5, flatShading: true,
          transparent: true, opacity: 0.7
        })
      );
      wBody.position.y = 1.5;
      wBody.castShadow = true;
      group.add(wBody);
      // Trailing particles effect (static geometry)
      const trailGeo = new THREE.ConeGeometry(0.4, 1.2, 6);
      const trailMat = new THREE.MeshBasicMaterial({
        color: 0x6666ff, transparent: true, opacity: 0.2,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const trail = new THREE.Mesh(trailGeo, trailMat);
      trail.position.y = 0.8;
      trail.rotation.x = Math.PI;
      group.add(trail);
      const wLight = new THREE.PointLight(0x4444ff, 1, 6);
      wLight.position.y = 1.5;
      group.add(wLight);
      break;

    case 'boss':
      hp = 300 + wave * 80; speed = 2; dmg = 25 + wave * 5;
      xpValue = 50; size = 2.0; color = 0xff2244;
      // Massive boss creature - Void Titan
      const bossBody = new THREE.Mesh(
        new THREE.CylinderGeometry(1.0, 1.5, 3.0, 8),
        new THREE.MeshStandardMaterial({
          color, roughness: 0.3, metalness: 0.6, flatShading: true
        })
      );
      bossBody.position.y = 2.0;
      bossBody.castShadow = true;
      group.add(bossBody);
      // Crown of spikes
      for (let i = 0; i < 8; i++) {
        const spike = new THREE.Mesh(
          new THREE.ConeGeometry(0.15, 0.8, 4),
          new THREE.MeshStandardMaterial({ color: 0xff6644, flatShading: true })
        );
        const a = (i / 8) * Math.PI * 2;
        spike.position.set(Math.cos(a) * 1.0, 3.8, Math.sin(a) * 1.0);
        spike.rotation.z = Math.cos(a) * 0.3;
        spike.rotation.x = -Math.sin(a) * 0.3;
        group.add(spike);
      }
      // Core glow
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff4466 })
      );
      core.position.y = 2.5;
      group.add(core);
      // Eyes
      for (let s of [-1, 1]) {
        const eye = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0xffff00 })
        );
        eye.position.set(s * 0.5, 3.0, 1.0);
        group.add(eye);
      }
      const bossLight = new THREE.PointLight(0xff2244, 3, 20);
      bossLight.position.y = 3;
      group.add(bossLight);
      // Arms
      for (let s of [-1, 1]) {
        const arm = new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 2.0, 0.4),
          new THREE.MeshStandardMaterial({ color: 0xcc2244, flatShading: true })
        );
        arm.position.set(s * 1.6, 1.5, 0);
        arm.castShadow = true;
        group.add(arm);
      }
      break;
  }

  group.position.copy(pos);
  group.userData = {
    type, hp, maxHp: hp, speed, dmg, xpValue, size,
    attackTimer: 0, attackCooldown: type === 'spitter' ? 2.5 : 1.0,
    spitterProjectileTimer: 0,
    hitFlash: 0, frozen: 0,
    isBoss: type === 'boss',
    spawnAnim: 0.5, // Spawn animation duration
    _chained: false
  };

  scene.add(group);
  enemies.push(group);

  // Spawn VFX
  const spawnColor = type === 'boss' ? 0xff2244 : (type === 'wraith' ? 0x4444ff : 0x44cc44);
  spawnParticles(pos.clone().add(new THREE.Vector3(0, 0.5, 0)), spawnColor, 8, 3, 0.08, 0.5);

  return group;
}

// --- PROJECTILES ---
function createProjectile(from, to, data) {
  const geo = new THREE.SphereGeometry(0.12, 4, 4);
  const mat = new THREE.MeshBasicMaterial({
    color: data.color || 0x44aaff, transparent: true, opacity: 0.9
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(from);

  // Glow
  const glowGeo = new THREE.SphereGeometry(0.2, 4, 4);
  const glowMat = new THREE.MeshBasicMaterial({
    color: data.color || 0x44aaff, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  mesh.add(glow);

  const dir = new THREE.Vector3().subVectors(to, from).normalize();
  mesh.userData = {
    dir, speed: data.speed || 40, damage: data.damage || P.damage,
    range: data.range || P.range, traveled: 0,
    piercing: data.piercing || 0, hitList: [],
    chain: data.chain || 0, isEnemy: data.isEnemy || false,
    enemyDmg: data.enemyDmg || 0,
    color: data.color || 0x44aaff
  };

  scene.add(mesh);
  projectiles.push(mesh);
  return mesh;
}

// --- PICKUPS ---
function createPickup(pos, type) {
  const group = new THREE.Group();
  let color, value;

  if (type === 'xp') {
    color = 0x44ffcc;
    value = 1 + Math.floor(wave * 0.5);
    const geo = new THREE.OctahedronGeometry(0.2, 0);
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.9
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.5;
    group.add(mesh);
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 4, 4),
      new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.2,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    glow.position.y = 0.5;
    group.add(glow);
  } else if (type === 'health') {
    color = 0xff4466;
    value = 20;
    const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
    const mat = new THREE.MeshBasicMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.5;
    mesh.rotation.set(Math.PI / 4, Math.PI / 4, 0);
    group.add(mesh);
  }

  group.position.copy(pos);
  group.position.y = 0;
  group.userData = { type, value, color, bobPhase: Math.random() * Math.PI * 2 };
  scene.add(group);
  pickups.push(group);
}

// --- PARTICLES ---
function spawnParticles(pos, color, count, speed, size, lifetime) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(size || 0.08, 3, 3);
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    const dir = new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      Math.random() * 1.5,
      (Math.random() - 0.5) * 2
    ).normalize().multiplyScalar((speed || 3) * (0.5 + Math.random()));
    mesh.userData = {
      vel: dir, lifetime: (lifetime || 0.8) * (0.5 + Math.random() * 0.5),
      age: 0, gravity: -8
    };
    scene.add(mesh);
    particles.push(mesh);
  }
}

function spawnExplosion(pos, color, count) {
  spawnParticles(pos, color, count || 15, 5, 0.1, 0.8);
  // Ring effect
  const ringGeo = new THREE.RingGeometry(0.1, 0.5, 12);
  const ringMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.6, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(pos);
  ring.position.y = 0.3;
  ring.rotation.x = -Math.PI / 2;
  ring.userData = { vel: new THREE.Vector3(), lifetime: 0.4, age: 0, isRing: true, expandSpeed: 8 };
  scene.add(ring);
  particles.push(ring);
}

// --- DAMAGE NUMBERS ---
function showDamageNumber(pos, value, color, isCrit) {
  const div = document.createElement('div');
  div.className = 'dmg-num';
  div.textContent = Math.round(value);
  div.style.color = color || '#fff';
  div.style.fontSize = isCrit ? '22px' : '16px';

  // Project 3D position to screen
  const screenPos = pos.clone().project(camera);
  const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
  div.style.left = (x + (Math.random() - 0.5) * 30) + 'px';
  div.style.top = (y - 20) + 'px';

  document.getElementById('damage-numbers').appendChild(div);
  setTimeout(() => div.remove(), 1000);
}

function screenFlash(id, duration) {

  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', duration || 100);
}

function triggerShake(intensity) {

// --- WEAPON SYSTEM ---
function initWeapons() {
  P.weaponData = {
    pulse: { name: 'Pulse Rifle', icon: '🔫', fireRate: 0.4, damage: 10, range: 25, color: 0x44aaff, speed: 40 },
    laser: { name: 'Beam Laser', icon: '⚡', fireRate: 0.15, damage: 4, range: 30, color: 0xff4444, speed: 60 },
    shotgun: { name: 'Scatter Gun', icon: '💥', fireRate: 0.8, damage: 8, range: 15, color: 0xffaa44, speed: 30, count: 5 },
    plasma: { name: 'Plasma Orb', icon: '🔮', fireRate: 0.6, damage: 20, range: 22, color: 0xaa44ff, speed: 20 },
    missile: { name: 'Micro Missiles', icon: '🚀', fireRate: 1.2, damage: 30, range: 35, color: 0xff8844, speed: 18 }
  };
}

function getNearestEnemy(fromPos, maxRange) {
  let nearest = null, nearestDist = maxRange || P.range;
  for (const e of enemies) {
    if (e.userData.hp <= 0) continue;
    const d = fromPos.distanceTo(e.position);
    if (d < nearestDist) {
      nearestDist = d;
      nearest = e;
    }
  }
  return nearest;
}

function fireWeapon() {
  const weapon = P.weapons[0]; // Primary weapon
  const wd = P.weaponData[weapon];
  if (!wd) return;

  const target = getNearestEnemy(player.position, P.range);
  if (!target) return;

  const fromPos = player.position.clone();
  fromPos.y += 1.5;

  const effectiveDmg = wd.damage * P.damageMult * P.damage / 10;

  if (weapon === 'shotgun') {
    const count = (wd.count || 5) + P.multiShot;
    for (let i = 0; i < count; i++) {
      const spread = 0.3;
      const toPos = target.position.clone();
      toPos.x += (Math.random() - 0.5) * spread * 2;
      toPos.z += (Math.random() - 0.5) * spread * 2;
      toPos.y += 1;
      createProjectile(fromPos, toPos, {
        damage: effectiveDmg, color: wd.color, speed: wd.speed,
        range: wd.range, piercing: P.piercing, chain: P.chainLightning
      });
    }
  } else if (weapon === 'missile') {
    const toPos = target.position.clone();
    toPos.y += 1;
    createProjectile(fromPos, toPos, {
      damage: effectiveDmg, color: wd.color, speed: wd.speed,
      range: wd.range, piercing: P.piercing, chain: P.chainLightning
    });
  } else {
    const count = 1 + P.multiShot;
    for (let i = 0; i < count; i++) {
      const toPos = target.position.clone();
      toPos.y += 1;
      if (count > 1) {
        toPos.x += (i - (count - 1) / 2) * 0.5;
      }
      createProjectile(fromPos, toPos, {
        damage: effectiveDmg, color: wd.color, speed: wd.speed,
        range: wd.range, piercing: P.piercing, chain: P.chainLightning
      });
    }
  }

  // Muzzle flash
  spawnParticles(fromPos, wd.color, 3, 2, 0.05, 0.2);
}

// --- ABILITIES ---
function tryOrbitalStrike(dt) {
  if (P.orbitalStrike <= 0) return;
  P.orbitalTimer -= dt * P.attackSpeed;
  if (P.orbitalTimer > 0) return;
  P.orbitalTimer = 3 / P.attackSpeed;

  const target = getNearestEnemy(player.position, P.range * 1.5);
  if (!target) return;

  const pos = target.position.clone();
  // Delayed impact
  setTimeout(() => {
    if (!gameActive) return;
    const dmg = 30 * P.damageMult * P.damage / 10;
    // Damage enemies in area
    for (const e of enemies) {
      if (e.userData.hp <= 0) continue;
      if (e.position.distanceTo(pos) < 5) {
        dealDamageToEnemy(e, dmg);
      }
    }
    spawnExplosion(pos, 0x4488ff, 30);
    screenFlash('flash-blue', 150);
    triggerShake(0.8);
  }, 500);

  // Warning indicator
  const warnGeo = new THREE.RingGeometry(3, 5, 16);
  const warnMat = new THREE.MeshBasicMaterial({
    color: 0x4488ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const warn = new THREE.Mesh(warnGeo, warnMat);
  warn.rotation.x = -Math.PI / 2;
  warn.position.copy(pos);
  warn.position.y = 0.2;
  warn.userData = { vel: new THREE.Vector3(), lifetime: 0.5, age: 0, isRing: true, expandSpeed: 0 };
  scene.add(warn);
  particles.push(warn);
}

function tryNovaBlast(dt) {
  if (P.novaBlast <= 0) return;
  P.novaTimer -= dt * P.attackSpeed;
  if (P.novaTimer > 0) return;
  P.novaTimer = 4 / P.attackSpeed;

  const dmg = 20 * P.damageMult * P.damage / 10;
  const radius = 6 + P.novaBlast;

  for (const e of enemies) {
    if (e.userData.hp <= 0) continue;
    if (e.position.distanceTo(player.position) < radius) {
      dealDamageToEnemy(e, dmg);
    }
  }

  spawnExplosion(player.position.clone(), 0xffaa44, 25);
  screenFlash('flash-blue', 100);
  triggerShake(0.6);

  // Nova ring
  const ringGeo = new THREE.RingGeometry(0.5, radius, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffaa44, transparent: true, opacity: 0.4, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.copy(player.position);
  ring.position.y = 0.3;
  ring.userData = { vel: new THREE.Vector3(), lifetime: 0.5, age: 0, isRing: true, expandSpeed: 0 };
  scene.add(ring);
  particles.push(ring);
}

// --- COMBAT ---
function dealDamageToEnemy(enemy, baseDmg) {
  if (enemy.userData.hp <= 0) return;

  let dmg = baseDmg;
  let isCrit = Math.random() < P.critChance;
  if (isCrit) dmg *= P.critMult;

  // Armor reduction (for enemies, minimal)
  dmg = Math.max(1, dmg);

  enemy.userData.hp -= dmg;
  enemy.userData.hitFlash = 0.15;

  // Damage number
  const numPos = enemy.position.clone();
  numPos.y += enemy.userData.size + 1;
  showDamageNumber(numPos, dmg, isCrit ? '#ffdd44' : '#ffffff', isCrit);

  // Hit particles
  spawnParticles(numPos, 0xff8844, 4, 3, 0.06, 0.3);

  // Life steal
  if (P.lifeSteal > 0) {
    P.hp = Math.min(P.maxHp, P.hp + dmg * P.lifeSteal);
  }

  // Chain lightning
  if (P.chainLightning > 0 && !enemy.userData._chained) {
    enemy.userData._chained = true;
    let chainTarget = null, chainDist = 8;
    for (const e2 of enemies) {
      if (e2 === enemy || e2.userData.hp <= 0 || e2.userData._chained) continue;
      const d = enemy.position.distanceTo(e2.position);
      if (d < chainDist) { chainDist = d; chainTarget = e2; }
    }
    if (chainTarget) {
      dealDamageToEnemy(chainTarget, baseDmg * 0.6);
      // Lightning visual
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        enemy.position.clone().add(new THREE.Vector3(0, 1, 0)),
        chainTarget.position.clone().add(new THREE.Vector3(0, 1, 0))
      ]);
      const lineMat = new THREE.LineBasicMaterial({
        color: 0x44aaff, transparent: true, opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      const line = new THREE.Line(lineGeo, lineMat);
      line.userData = { vel: new THREE.Vector3(), lifetime: 0.2, age: 0 };
      scene.add(line);
      particles.push(line);
    }
    // Reset chain flag after short delay
    setTimeout(() => { enemy.userData._chained = false; }, 200);
  }

  if (enemy.userData.hp <= 0) {
    killEnemy(enemy);
  }
}

function killEnemy(enemy) {
  const ud = enemy.userData;

  // Death explosion
  const color = ud.type === 'boss' ? 0xff2244 : (ud.type === 'brute' ? 0xcc4444 : 0x44cc44);
  spawnExplosion(enemy.position.clone(), color, ud.isBoss ? 40 : 12);

  // Drop XP
  const xpCount = ud.isBoss ? 10 : (ud.type === 'brute' ? 3 : 1);
  for (let i = 0; i < xpCount; i++) {
    const offset = new THREE.Vector3((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2);
    createPickup(enemy.position.clone().add(offset), 'xp');
  }

  // Health drop chance
  if (Math.random() < (ud.isBoss ? 1 : 0.08)) {
    createPickup(enemy.position.clone(), 'health');
  }

  // Score
  score += ud.xpValue * 10;
  kills++;

  // Boss death
  if (ud.isBoss) {
    bossActive = false;
    currentBoss = null;
    document.getElementById('boss-hp-container').style.display = 'none';
    screenFlash('flash-red', 300);
    triggerShake(2.0);
    // Big XP drop
    for (let i = 0; i < 5; i++) {
      const offset = new THREE.Vector3((Math.random() - 0.5) * 4, 0, (Math.random() - 0.5) * 4);
      createPickup(enemy.position.clone().add(offset), 'xp');
    }
  }

  scene.remove(enemy);
  const idx = enemies.indexOf(enemy);
  if (idx > -1) enemies.splice(idx, 1);
}

function damagePlayer(amount) {
  if (Math.random() < P.dodgeChance) {
    showDamageNumber(player.position.clone().add(new THREE.Vector3(0, 2, 0)), 0, '#44ffcc', false);
    return;
  }

  const reduced = Math.max(1, amount - P.armor);
  P.hp -= reduced;
  screenFlash('flash-red', 150);
  triggerShake(0.5);

  if (P.hp <= 0) {
    P.hp = 0;
    endGame();
  }
}

// --- WAVE SYSTEM ---
function startWave(n) {
  wave = n;
  waveEnemiesSpawned = 0;
  waveTimer = 0;

  // Boss every 5 waves
  const isBossWave = (n % 5 === 0);

  if (isBossWave) {
    waveTotalEnemies = 1 + Math.floor(n / 5);
    showWaveAnnounce(`WAVE ${n}`, '⚠ BOSS INCOMING ⚠');
  } else {
    waveTotalEnemies = 5 + n * 3;
    showWaveAnnounce(`WAVE ${n}`, `${waveTotalEnemies} enemies`);
  }
}

function showWaveAnnounce(title, sub) {
  const el = document.getElementById('wave-announce');
  el.innerHTML = `${title}<div class="sub">${sub}</div>`;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2000);
}

function spawnWaveEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const dist = 35 + Math.random() * 15;
  const pos = new THREE.Vector3(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

  // Determine type
  let type;
  const isBossWave = (wave % 5 === 0) && waveEnemiesSpawned === 0;

  if (isBossWave) {
    type = 'boss';
  } else {
    const r = Math.random();
    if (wave < 3) {
      type = 'crawler';
    } else if (r < 0.5) {
      type = 'crawler';
    } else if (r < 0.75) {
      type = wave >= 4 ? 'brute' : 'crawler';
    } else if (r < 0.9) {
      type = wave >= 6 ? 'spitter' : 'crawler';
    } else {
      type = wave >= 8 ? 'wraith' : 'crawler';
    }
  }

  const enemy = createEnemy(type, pos);

  if (type === 'boss') {
    bossActive = true;
    currentBoss = enemy;
    document.getElementById('boss-hp-container').style.display = 'flex';
    document.getElementById('boss-name').textContent = 'VOID TITAN';
  }
}

let takenUpgrades = {};

function showUpgradePanel() {
  gamePaused = true;
  const panel = document.getElementById('upgrade-panel');
  const cards = document.getElementById('upgrade-cards');
  cards.innerHTML = '';

  // Pick 3 random upgrades
  const available = ALL_UPGRADES.filter(u => {
    if (u.once && takenUpgrades[u.id]) return false;
    return true;
  });

  const choices = [];
  const pool = [...available];
  for (let i = 0; i < Math.min(3, pool.length); i++) {
    const idx = Math.floor(Math.random() * pool.length);
    choices.push(pool.splice(idx, 1)[0]);
  }

  choices.forEach(upgrade => {
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    card.innerHTML = `
      <div class="rarity rarity-${upgrade.rarity}">${upgrade.rarity}</div>
      <div class="icon">${upgrade.icon}</div>
      <div class="name">${upgrade.name}</div>
      <div class="desc">${upgrade.desc}</div>
    `;
    card.addEventListener('click', () => {
      upgrade.apply();
      takenUpgrades[upgrade.id] = true;
      panel.style.display = 'none';
      gamePaused = false;
      updateHUD();
    });
    cards.appendChild(card);
  });

  panel.style.display = 'flex';
}

// --- HUD ---
function updateHUD() {
  const hpPct = Math.max(0, P.hp / P.maxHp * 100);
  document.querySelector('#hp-bar .bar-fill').style.width = hpPct + '%';
  document.querySelector('#hp-bar .bar-label').textContent = `HP ${Math.ceil(P.hp)} / ${P.maxHp}`;

  const xpPct = Math.min(100, P.xp / P.xpToLevel * 100);
  document.querySelector('#xp-bar .bar-fill').style.width = xpPct + '%';
  document.querySelector('#xp-bar .bar-label').textContent = `XP ${P.xp} / ${P.xpToLevel}`;

  document.getElementById('level-num').textContent = P.level;
  document.getElementById('wave-num').textContent = wave;
  document.getElementById('score-num').textContent = score;
  document.getElementById('kill-num').textContent = kills;

  const mins = Math.floor(gameTime / 60);
  const secs = Math.floor(gameTime % 60);
  document.getElementById('time-num').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

  // Boss HP
  if (currentBoss && currentBoss.userData.hp > 0) {
    const bossPct = currentBoss.userData.hp / currentBoss.userData.maxHp * 100;
    document.getElementById('boss-hp-fill').style.width = bossPct + '%';
  }
}

function updateWeaponDisplay() {
  const wd = document.getElementById('weapon-display');
  wd.innerHTML = '';
  P.weapons.forEach((wKey, i) => {
    const w = P.weaponData[wKey];
    if (!w) return;
    const slot = document.createElement('div');
    slot.className = 'weapon-slot' + (i === 0 ? ' active' : '');
    slot.innerHTML = `<span>${w.icon}</span>`;
    wd.appendChild(slot);
  });
}

// --- MINIMAP ---
function updateMinimap() {
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 160, 160);

  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.arc(80, 80, 78, 0, Math.PI * 2);
  ctx.fill();

  const scale = 1.8;
  const cx = 80, cy = 80;

  // Player
  const px = cx + player.position.x * scale;
  const py = cy + player.position.z * scale;
  ctx.fillStyle = '#4488ff';
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();

  // Enemies
  for (const e of enemies) {
    if (e.userData.hp <= 0) continue;
    const ex = cx + e.position.x * scale;
    const ey = cy + e.position.z * scale;
    if (ex < 2 || ex > 158 || ey < 2 || ey > 158) continue;
    ctx.fillStyle = e.userData.isBoss ? '#ff2244' : '#ff4444';
    ctx.beginPath();
    ctx.arc(ex, ey, e.userData.isBoss ? 5 : 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Pickups
  for (const p of pickups) {
    const ppx = cx + p.position.x * scale;
    const ppy = cy + p.position.z * scale;
    if (ppx < 2 || ppx > 158 || ppy < 2 || ppy > 158) continue;
    ctx.fillStyle = p.userData.type === 'xp' ? '#44ffcc' : '#ff4466';
    ctx.fillRect(ppx - 1, ppy - 1, 2, 2);
  }

  // Border
  ctx.strokeStyle = 'rgba(100,200,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(80, 80, 78, 0, Math.PI * 2);
  ctx.stroke();
}

// --- INPUT ---
function setupInput() {
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
}

function getMouseWorldPos() {
  const ndc = new THREE.Vector2(
    (mouseX / window.innerWidth) * 2 - 1,
    -(mouseY / window.innerHeight) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(ndc, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, target);
  return target;
}

// --- GAME LOOP ---
function update(dt) {
  if (!gameActive || gamePaused || gameOverState) return;

  gameTime += dt;

  // Player movement
  const moveDir = new THREE.Vector3();
  if (keys['w'] || keys['arrowup']) moveDir.z -= 1;
  if (keys['s'] || keys['arrowdown']) moveDir.z += 1;
  if (keys['a'] || keys['arrowleft']) moveDir.x -= 1;
  if (keys['d'] || keys['arrowright']) moveDir.x += 1;

  if (moveDir.length() > 0) {
    moveDir.normalize();
    const speed = P.speed * P.moveSpeedMult;
    player.position.x += moveDir.x * speed * dt;
    player.position.z += moveDir.z * speed * dt;

    // Boundary
    const dist = Math.sqrt(player.position.x ** 2 + player.position.z ** 2);
    if (dist > 65) {
      const norm = new THREE.Vector3(player.position.x, 0, player.position.z).normalize();
      player.position.x = norm.x * 65;
      player.position.z = norm.z * 65;
    }
  }

  // Aim direction
  const mouseWorld = getMouseWorldPos();
  if (mouseWorld) {
    aimAngle = Math.atan2(mouseWorld.x - player.position.x, mouseWorld.z - player.position.z);
    player.rotation.y = aimAngle;
  }

  // HP regen
  if (P.hpRegen > 0) {
    P.hp = Math.min(P.maxHp, P.hp + P.hpRegen * dt);
  }

  // Auto-fire
  P.fireTimer -= dt * P.attackSpeed;
  if (P.fireTimer <= 0) {
    const wd = P.weaponData[P.weapons[0]];
    if (wd) {
      P.fireTimer = wd.fireRate / P.attackSpeed;
      fireWeapon();
    }
  }

  // Abilities
  tryOrbitalStrike(dt);
  tryNovaBlast(dt);

  // Wave spawning
  waveTimer += dt;
  const spawnInterval = Math.max(0.2, 1.0 - wave * 0.03);
  if (waveEnemiesSpawned < waveTotalEnemies && waveTimer >= spawnInterval) {
    waveTimer = 0;
    spawnWaveEnemy();
    waveEnemiesSpawned++;
  }

  // Check wave complete
  if (waveEnemiesSpawned >= waveTotalEnemies && enemies.length === 0) {
    startWave(wave + 1);
  }

  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const ud = e.userData;
    if (ud.hp <= 0) continue;

    // Spawn animation
    if (ud.spawnAnim > 0) {
      ud.spawnAnim -= dt;
      const progress = 1 - ud.spawnAnim / 0.5;
      const scale = Math.min(1, progress * 1.5);
      e.scale.set(scale, scale, scale);
    } else {
      e.scale.set(1, 1, 1);
    }

    // Hit flash
    if (ud.hitFlash > 0) {
      ud.hitFlash -= dt;
      e.children.forEach(c => {
        if (c.material && c.material.emissive) {
          c.material.emissive.setHex(ud.hitFlash > 0 ? 0xffffff : 0x000000);
          c.material.emissiveIntensity = ud.hitFlash > 0 ? 1 : 0;
        }
      });
    }

    // Frozen
    if (ud.frozen > 0) {
      ud.frozen -= dt;
    }

    const speedMult = ud.frozen > 0 ? 0.3 : 1;

    // Move toward player
    const toPlayer = new THREE.Vector3().subVectors(player.position, e.position);
    const distToPlayer = toPlayer.length();

    if (distToPlayer > (ud.type === 'spitter' ? 15 : 1.5)) {
      toPlayer.normalize();
      e.position.x += toPlayer.x * ud.speed * speedMult * dt;
      e.position.z += toPlayer.z * ud.speed * speedMult * dt;
    }

    // Face player
    e.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);

    // Bobbing animation
    const bobAmount = ud.type === 'wraith' ? 0.3 : 0.1;
    const bobSpeed = ud.type === 'wraith' ? 3 : 5;
    e.position.y = Math.sin(gameTime * bobSpeed + i) * bobAmount;

    // Attack
    ud.attackTimer -= dt;
    if (distToPlayer < (ud.type === 'spitter' ? 20 : 2) && ud.attackTimer <= 0) {
      ud.attackTimer = ud.attackCooldown;

      if (ud.type === 'spitter' && distToPlayer > 3) {
        // Ranged attack
        const fromP = e.position.clone();
        fromP.y += 1.5;
        createProjectile(fromP, player.position.clone().add(new THREE.Vector3(0, 1, 0)), {
          isEnemy: true, enemyDmg: ud.dmg, color: 0xff44ff, speed: 15, range: 30
        });
      } else if (distToPlayer < 2.5) {
        // Melee attack
        damagePlayer(ud.dmg);
      }
    }

    // Boss special attacks
    if (ud.isBoss && distToPlayer < 30) {
      ud.attackTimer -= dt * 0.5;
      if (ud.attackTimer <= 0 && Math.random() < 0.3) {
        ud.attackTimer = 2;
        // Spawn minions
        for (let j = 0; j < 3; j++) {
          const angle = Math.random() * Math.PI * 2;
          const spawnPos = e.position.clone().add(
            new THREE.Vector3(Math.cos(angle) * 3, 0, Math.sin(angle) * 3)
          );
          createEnemy('crawler', spawnPos);
        }
        spawnParticles(e.position.clone().add(new THREE.Vector3(0, 2, 0)), 0xff2244, 15, 4, 0.1, 0.5);
      }
    }
  }

  // Update projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    const pud = p.userData;

    p.position.add(pud.dir.clone().multiplyScalar(pud.speed * dt));
    pud.traveled += pud.speed * dt;

    // Trail particle
    if (Math.random() < 0.3) {
      const trailGeo = new THREE.SphereGeometry(0.04, 3, 3);
      const trailMat = new THREE.MeshBasicMaterial({
        color: pud.color, transparent: true, opacity: 0.6,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const trail = new THREE.Mesh(trailGeo, trailMat);
      trail.position.copy(p.position);
      trail.userData = { vel: new THREE.Vector3(), lifetime: 0.2, age: 0 };
      scene.add(trail);
      particles.push(trail);
    }

    if (pud.traveled > pud.range) {
      scene.remove(p);
      projectiles.splice(i, 1);
      continue;
    }

    if (pud.isEnemy) {
      // Enemy projectile - check player collision
      if (p.position.distanceTo(player.position) < 1.2) {
        damagePlayer(pud.enemyDmg);
        spawnParticles(p.position, 0xff44ff, 5, 3, 0.06, 0.3);
        scene.remove(p);
        projectiles.splice(i, 1);
      }
    } else {
      // Player projectile - check enemy collision
      let hit = false;
      for (const e of enemies) {
        if (e.userData.hp <= 0) continue;
        if (pud.hitList.includes(e)) continue;
        const hitDist = e.userData.size + 0.3;
        if (p.position.distanceTo(e.position.clone().add(new THREE.Vector3(0, e.userData.size, 0))) < hitDist) {
          dealDamageToEnemy(e, pud.damage);
          pud.hitList.push(e);

          if (pud.piercing > 0 && pud.hitList.length <= pud.piercing + 1) {
            // Continue through
          } else {
            hit = true;
          }
          break;
        }
      }
      if (hit) {
        spawnParticles(p.position, pud.color, 4, 2, 0.05, 0.2);
        scene.remove(p);
        projectiles.splice(i, 1);
      }
    }
  }

  // Update pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const pk = pickups[i];
    const pud = pk.userData;

    // Bob
    pk.children.forEach(c => {
      c.position.y = 0.5 + Math.sin(gameTime * 3 + pud.bobPhase) * 0.15;
      c.rotation.y += dt * 2;
    });

    // Magnet toward player
    const distToPlayer = pk.position.distanceTo(player.position);
    if (distToPlayer < P.magnetRange) {
      const dir = new THREE.Vector3().subVectors(player.position, pk.position).normalize();
      const pullSpeed = 15 * (1 - distToPlayer / P.magnetRange) + 5;
      pk.position.add(dir.multiplyScalar(pullSpeed * dt));
    }

    // Collect
    if (distToPlayer < 1.5) {
      if (pud.type === 'xp') {
        P.xp += pud.value;
        showPickupNotify(`+${pud.value} XP`, '#44ffcc');
        if (P.xp >= P.xpToLevel) {
          P.xp -= P.xpToLevel;
          P.level++;
          P.xpToLevel = Math.floor(10 * Math.pow(1.3, P.level - 1));
          // Level up VFX
          spawnExplosion(player.position.clone(), 0x44ffcc, 20);
          spawnParticles(player.position.clone().add(new THREE.Vector3(0, 2, 0)), 0xffdd44, 15, 5, 0.1, 1.0);
          screenFlash('flash-blue', 200);
          triggerShake(0.3);
          showUpgradePanel();
        }
      } else if (pud.type === 'health') {
        P.hp = Math.min(P.maxHp, P.hp + pud.value);
        showPickupNotify(`+${pud.value} HP`, '#ff4466');
      }
      scene.remove(pk);
      pickups.splice(i, 1);
    }

    // Timeout
    pud.bobPhase += dt;
    if (pud.bobPhase > 60) { // Remove old pickups
      scene.remove(pk);
      pickups.splice(i, 1);
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    const pud = pt.userData;
    pud.age += dt;

    if (pud.age >= pud.lifetime) {
      scene.remove(pt);
      particles.splice(i, 1);
      continue;
    }

    const alpha = 1 - pud.age / pud.lifetime;
    if (pt.material) {
      pt.material.opacity = alpha;
    }

    if (pud.isRing) {
      if (pud.expandSpeed > 0) {
        const s = 1 + pud.expandSpeed * pud.age;
        pt.scale.set(s, s, s);
      }
      pt.material.opacity = alpha * 0.5;
    } else {
      pt.position.add(pud.vel.clone().multiplyScalar(dt));
      pud.vel.y += pud.gravity * dt;
      const s = 1 - pud.age / pud.lifetime * 0.5;
      pt.scale.set(s, s, s);
    }
  }

  // Cape animation
  player.children.forEach(c => {
    if (c.userData && c.userData.isCape) {
      c.rotation.y = Math.sin(gameTime * 3) * 0.3;
      c.material.opacity = 0.2 + Math.sin(gameTime * 5) * 0.1;
    }
  });

  // Player idle bob
  player.position.y = Math.sin(gameTime * 4) * 0.08;

  // Dynamic player glow based on HP
  const hpRatio = P.hp / P.maxHp;
  player.children.forEach(c => {
    if (c.isLight) {
      const r = Math.max(0.2, 1 - hpRatio);
      c.color.setRGB(0.3 * r + 0.27 * (1 - r), 0.53 * (1 - r), 1.0 * (1 - r) + 0.27 * r);
      c.intensity = 1.5 + (1 - hpRatio) * 2;
    }
    // Update magnet ring
    if (c.userData && c.userData.isMagnetRing) {
      const s = P.magnetRange / 3;
      c.scale.set(s, s, s);
      c.material.opacity = 0.06 + Math.sin(gameTime * 2) * 0.02;
    }
  });

  // Animate dust particles
  scene.children.forEach(c => {
    if (c.userData && c.userData.isDust && c.geometry && c.geometry.attributes.position) {
      const pos = c.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let y = pos.getY(i);
        y += dt * 0.3;
        if (y > 20) y = 1;
        pos.setY(i, y);
        pos.setX(i, pos.getX(i) + Math.sin(gameTime + i) * dt * 0.1);
      }
      pos.needsUpdate = true;
    }
  });

  // Crystal pulsing glow
  environmentObjects.forEach((obj, idx) => {
    if (obj.children[0] && obj.children[0].material && obj.children[0].material.emissiveIntensity !== undefined) {
      obj.children[0].material.emissiveIntensity = 0.2 + Math.sin(gameTime * 2 + idx) * 0.15;
    }
    if (obj.children[1] && obj.children[1].isLight) {
      obj.children[1].intensity = 0.8 + Math.sin(gameTime * 1.5 + idx * 0.7) * 0.5;
    }
  });

  // Camera follow
  const camTarget = player.position.clone();
  camTarget.y = 28;
  camTarget.z += 22;
  camera.position.lerp(camTarget, dt * 5);

  // Screen shake
  if (screenShake > 0) {
    screenShake -= dt;
    camera.position.x += (Math.random() - 0.5) * screenShakeIntensity;
    camera.position.y += (Math.random() - 0.5) * screenShakeIntensity * 0.5;
    camera.position.z += (Math.random() - 0.5) * screenShakeIntensity;
  }

  camera.lookAt(player.position);

  // Update HUD
  updateHUD();
  updateMinimap();
}

function showPickupNotify(text, color) {
  const el = document.getElementById('pickup-notify');
  el.textContent = text;
  el.style.color = color;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 800);
}

// --- RENDER LOOP ---
function gameLoop() {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

// --- GAME FLOW ---
function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('game-over').style.display = 'none';

  // Reset
  P.hp = 100; P.maxHp = 100; P.hpRegen = 0; P.speed = 12;
  P.xp = 0; P.xpToLevel = 10; P.level = 1;
  P.damage = 10; P.fireRate = 0.4; P.fireTimer = 0; P.range = 25;
  P.critChance = 0.05; P.critMult = 2; P.armor = 0; P.magnetRange = 3;
  P.weapons = ['pulse']; P.piercing = 0; P.chainLightning = 0;
  P.orbitalStrike = 0; P.orbitalTimer = 0; P.novaBlast = 0; P.novaTimer = 0;
  P.multiShot = 0; P.attackSpeed = 1; P.lifeSteal = 0; P.dodgeChance = 0;
  P.moveSpeedMult = 1; P.damageMult = 1; P.maxHpMult = 1;
  P.frostNova = 0;

  score = 0; kills = 0; gameTime = 0; wave = 0;
  gameOverState = false; gamePaused = false;
  takenUpgrades = {};

  // Clear old entities
  enemies.forEach(e => scene.remove(e));
  projectiles.forEach(p => scene.remove(p));
  pickups.forEach(p => scene.remove(p));
  particles.forEach(p => scene.remove(p));
  enemies = []; projectiles = []; pickups = []; particles = [];

  if (player) scene.remove(player);
  if (currentBoss) { currentBoss = null; bossActive = false; }
  document.getElementById('boss-hp-container').style.display = 'none';

  createPlayer();
  initWeapons();
  updateWeaponDisplay();
  startWave(1);
  gameActive = true;
}

function endGame() {
  gameActive = false;
  gameOverState = true;

  const mins = Math.floor(gameTime / 60);
  const secs = Math.floor(gameTime % 60);

  document.getElementById('final-stats').innerHTML = `
    Score: <span>${score}</span><br>
    Level: <span>${P.level}</span><br>
    Wave: <span>${wave}</span><br>
    Kills: <span>${kills}</span><br>
    Time: <span>${mins}:${secs.toString().padStart(2, '0')}</span>
  `;
  document.getElementById('game-over').style.display = 'flex';
}

function restartGame() {
  startGame();
}

// --- INIT ---
function init() {
  initThree();
  createEnvironment();
  setupInput();
  initWeapons();
  gameLoop();
}

init();
</script>
