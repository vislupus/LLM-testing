<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID SURVIVOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,sans-serif;color:#fff;user-select:none}
canvas{display:block;position:fixed;top:0;left:0}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 16px;z-index:10;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
.hud-l{display:flex;flex-direction:column;gap:3px}
.lvl-badge{font-size:13px;font-weight:900;color:#00ffcc;text-shadow:0 0 10px rgba(0,255,200,.6);letter-spacing:2px}
.bar-wrap{width:240px;height:16px;background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.15);border-radius:8px;overflow:hidden;position:relative}
.bar-wrap.xp{height:10px;border-radius:5px}
.bar-fill{height:100%;border-radius:6px;transition:width .25s ease}
.bar-fill.hp{background:linear-gradient(90deg,#ff2255,#ff6688)}
.bar-fill.xp{background:linear-gradient(90deg,#00bbee,#00ffaa);border-radius:4px}
.bar-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-shadow:1px 1px 2px #000}
.hud-r{text-align:right;font-size:13px;text-shadow:1px 1px 3px #000;line-height:1.6}
.hud-r span{color:#aaa}
#wep-bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;pointer-events:none}
.wep-slot{width:48px;height:48px;background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;opacity:1;transition:opacity .3s}
.wep-slot.locked{opacity:.25}
.wep-slot .cd-bar{position:absolute;bottom:0;left:0;right:0;height:0;background:rgba(255,255,255,.15);transition:height 50ms linear}
.wep-slot .wlv{position:absolute;top:1px;right:3px;font-size:9px;font-weight:900;color:#00ffcc}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:rgba(0,0,0,.75);backdrop-filter:blur(6px)}
.overlay.hidden{display:none}
.overlay h1{font-size:58px;font-weight:900;background:linear-gradient(135deg,#00ffcc,#0088ff,#aa44ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:6px;margin-bottom:8px}
.overlay h2{font-size:42px;font-weight:900;margin-bottom:16px}
.overlay p{font-size:15px;color:rgba(255,255,255,.6);margin-bottom:6px}
.overlay .sub{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:20px}
.btn{padding:12px 44px;font-size:18px;font-weight:800;background:linear-gradient(135deg,#00ccaa,#0077ff);border:none;border-radius:8px;color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:3px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:scale(1.06);box-shadow:0 0 30px rgba(0,200,255,.4)}
.btn:active{transform:scale(.97)}
#lu-screen h2{color:#ffcc00;text-shadow:0 0 25px rgba(255,200,0,.5)}
.lu-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lu-card{width:190px;padding:18px 14px;background:rgba(15,20,50,.92);border:2px solid rgba(80,130,255,.25);border-radius:12px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:center;pointer-events:all}
.lu-card:hover{transform:translateY(-6px) scale(1.04);border-color:#00ccff;box-shadow:0 8px 30px rgba(0,200,255,.2)}
.lu-card .ci{font-size:34px;margin-bottom:6px}
.lu-card .cn{font-size:15px;font-weight:800;color:#00ccff;margin-bottom:5px}
.lu-card .cd{font-size:11px;color:rgba(255,255,255,.6);line-height:1.4}
#go-screen h2{color:#ff3366;text-shadow:0 0 30px rgba(255,50,100,.6)}
.go-stats{font-size:17px;line-height:2;margin-bottom:24px}
#boss-warn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#ff4400;text-shadow:0 0 30px rgba(255,70,0,.8);z-index:50;pointer-events:none;opacity:0}
#boss-warn.show{animation:bWarn 2s ease-out forwards}
@keyframes bWarn{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
.dmg{position:fixed;font-weight:900;pointer-events:none;z-index:20;animation:dFloat .7s ease-out forwards}
@keyframes dFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(.8)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .08s}
</style>
</head>
<body>
<div id="hud" style="display:none">
<div class="hud-l">
<div class="lvl-badge">LVL <span id="hLv">1</span></div>
<div class="bar-wrap"><div class="bar-fill hp" id="hpBar" style="width:100%"></div><div class="bar-label" id="hpLbl">100 / 100</div></div>
<div class="bar-wrap xp"><div class="bar-fill xp" id="xpBar" style="width:0%"></div><div class="bar-label" id="xpLbl" style="font-size:9px">0 / 10</div></div>
</div>
<div class="hud-r">
<div>&#9201; <span id="hTime">0:00</span></div>
<div>&#128128; <span id="hKills">0</span></div>
<div>&#11088; <span id="hScore">0</span></div>
</div>
</div>
<div id="wep-bar" style="display:none">
<div class="wep-slot" id="ws0"><span>&#128302;</span><div class="cd-bar" id="wc0"></div><span class="wlv" id="wl0">1</span></div>
<div class="wep-slot locked" id="ws1"><span>&#9889;</span><div class="cd-bar" id="wc1"></div><span class="wlv" id="wl1">0</span></div>
<div class="wep-slot locked" id="ws2"><span>&#128165;</span><div class="cd-bar" id="wc2"></div><span class="wlv" id="wl2">0</span></div>
<div class="wep-slot locked" id="ws3"><span>&#128481;&#65039;</span><div class="cd-bar" id="wc3"></div><span class="wlv" id="wl3">0</span></div>
</div>
<div id="start-screen" class="overlay"><div style="text-align:center">
<h1>VOID SURVIVOR</h1>
<p>Survive the endless void. Slay the horde. Become legend.</p>
<p class="sub">WASD to move &bull; Weapons fire automatically &bull; Collect XP to level up</p>
<button class="btn" id="startBtn">BEGIN</button>
</div></div>
<div id="lu-screen" class="overlay hidden"><div style="text-align:center">
<h2>&#9889; LEVEL UP &#9889;</h2>
<div class="lu-cards" id="lu-cards"></div>
</div></div>
<div id="go-screen" class="overlay hidden"><div style="text-align:center">
<h2>GAME OVER</h2>
<div class="go-stats" id="go-stats"></div>
<button class="btn" id="goBtn">PLAY AGAIN</button>
</div></div>
<div id="boss-warn">&#9888; BOSS INCOMING &#9888;</div>
<div id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ============================================================
// VOID SURVIVOR — Complete Single-File 3D Survivor-Action Game
// ============================================================

// ---- CONFIGURATION ----
const CFG = {
  arena: 90, spawnDist: 42, camH: 24, camD: 20,
  maxEnemies: 250, maxProj: 120, maxParts: 4000,
  basePickupRange: 4.5, xpMagnetSpeed: 22,
};

// ---- GLOBALS ----
let scene, camera, renderer, dirLight, groundMat;
let audioCtx, masterGain;
let gameTime = 0, score = 0, kills = 0, diff = 0;
let state = 'menu'; // menu | play | levelup | over
let lastBossTime = -50, bossCount = 0;
let lastT = 0, shakePow = 0, shakeDur = 0;
const keys = {};
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();

// ---- PLAYER ----
const P = {
  mesh: null, pos: new THREE.Vector3(), vel: new THREE.Vector3(),
  hp: 100, maxHp: 100, lvl: 1, xp: 0, xpNext: 10,
  spd: 7.5, spdM: 1, dmgM: 1, atkM: 1, pickM: 1,
  regen: 0, armor: 0, critCh: 0.05, invT: 0, face: 0,
  weps: {
    orbit:  { lv:1, ang:0 },
    zap:    { lv:0, t:0 },
    nova:   { lv:0, t:0 },
    shards: { lv:0, t:0 }
  }
};

// ---- WEP STATS ----
const WSTAT = {
  orbit: [
    {n:3,d:10,r:3.0,spd:2.8,hcd:.28},{n:4,d:15,r:3.3,spd:3.2,hcd:.24},
    {n:5,d:20,r:3.6,spd:3.6,hcd:.20},{n:6,d:28,r:4.0,spd:4.0,hcd:.16},
    {n:8,d:38,r:4.5,spd:4.5,hcd:.12}
  ],
  zap: [
    {ch:2,d:20,rng:14,chr:8,cd:2.0},{ch:3,d:28,rng:16,chr:9,cd:1.7},
    {ch:4,d:38,rng:18,chr:10,cd:1.4},{ch:5,d:50,rng:20,chr:11,cd:1.1},
    {ch:7,d:68,rng:24,chr:13,cd:.7}
  ],
  nova: [
    {d:28,r:6,cd:3.5},{d:44,r:7.5,cd:3.0},
    {d:65,r:9,cd:2.5},{d:90,r:11,cd:2.0},{d:130,r:14,cd:1.4}
  ],
  shards: [
    {n:2,d:16,spd:18,rng:20,cd:1.0,pr:1},{n:3,d:22,spd:20,rng:22,cd:.85,pr:1},
    {n:4,d:30,spd:22,rng:25,cd:.7,pr:2},{n:5,d:40,spd:25,rng:28,cd:.55,pr:2},
    {n:7,d:55,spd:30,rng:32,cd:.38,pr:3}
  ]
};

// ---- ENEMY TYPES ----
const ETYPES = {
  shard:  {hp:18,spd:5.5,dmg:8,xp:1,col:0xff3355,sc:.42,sh:'oct'},
  blink:  {hp:12,spd:11,dmg:5,xp:2,col:0xffdd00,sc:.35,sh:'tet'},
  tank:   {hp:70,spd:2.8,dmg:14,xp:5,col:0xaa33ff,sc:.85,sh:'box'},
  spitter:{hp:22,spd:3.8,dmg:10,xp:3,col:0x33bbff,sc:.48,sh:'dod'},
  boss:   {hp:500,spd:3.2,dmg:22,xp:60,col:0xff6600,sc:2.0,sh:'ico'}
};

// ---- ARRAYS ----
let enemies=[], projectiles=[], pickups=[], effects=[];
let orbMeshes=[], playerGlow;

// ---- PARTICLES ----
let pPos,pVel,pCol,pLife,pSz,pGeo,pPts;
let pIdx=0;
const PMAX=4000;

// ---- AUDIO ----
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}
function snd(type){
  if(!audioCtx) return;
  const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.connect(g); g.connect(masterGain);
  switch(type){
    case 'hit': o.type='square'; o.frequency.setValueAtTime(280,t); o.frequency.exponentialRampToValueAtTime(120,t+.08); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.1); o.start(t); o.stop(t+.1); break;
    case 'kill': o.type='sawtooth'; o.frequency.setValueAtTime(400,t); o.frequency.exponentialRampToValueAtTime(80,t+.15); g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.start(t); o.stop(t+.18); break;
    case 'xp': o.type='sine'; o.frequency.setValueAtTime(800,t); o.frequency.exponentialRampToValueAtTime(1400,t+.08); g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.12); o.start(t); o.stop(t+.12); break;
    case 'lvl': o.type='sine'; o.frequency.setValueAtTime(500,t); o.frequency.linearRampToValueAtTime(1000,t+.15); o.frequency.linearRampToValueAtTime(1500,t+.3); g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.4); o.start(t); o.stop(t+.4); break;
    case 'hurt': o.type='sawtooth'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(60,t+.12); g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); o.start(t); o.stop(t+.15); break;
    case 'zap': o.type='sawtooth'; o.frequency.setValueAtTime(2000,t); o.frequency.exponentialRampToValueAtTime(200,t+.12); g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); o.start(t); o.stop(t+.15); break;
    case 'nova': o.type='triangle'; o.frequency.setValueAtTime(100,t); o.frequency.exponentialRampToValueAtTime(40,t+.3); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.35); o.start(t); o.stop(t+.35); break;
    case 'shard': o.type='square'; o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(300,t+.06); g.gain.setValueAtTime(.07,t); g.gain.exponentialRampToValueAtTime(.001,t+.08); o.start(t); o.stop(t+.08); break;
    case 'heal': o.type='sine'; o.frequency.setValueAtTime(600,t); o.frequency.linearRampToValueAtTime(1200,t+.2); g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.start(t); o.stop(t+.25); break;
    case 'boss': o.type='sawtooth'; o.frequency.setValueAtTime(60,t); o.frequency.linearRampToValueAtTime(120,t+.5); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.6); o.start(t); o.stop(t+.6); break;
    case 'gameover': o.type='sine'; o.frequency.setValueAtTime(400,t); o.frequency.linearRampToValueAtTime(100,t+.8); g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+1); o.start(t); o.stop(t+1); break;
  }
}

// ---- THREE.JS INIT ----
function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04040e);
  scene.fog = new THREE.FogExp2(0x04040e, 0.013);

  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 250);
  camera.position.set(0, CFG.camH, CFG.camD);
  camera.lookAt(0,0,0);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.prepend(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x334466, .5));
  scene.add(new THREE.HemisphereLight(0x4466aa, 0x110022, .5));

  dirLight = new THREE.DirectionalLight(0xffeedd, 1.8);
  dirLight.position.set(15, 30, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 100;
  const s=45;
  dirLight.shadow.camera.left=-s; dirLight.shadow.camera.right=s;
  dirLight.shadow.camera.top=s; dirLight.shadow.camera.bottom=-s;
  scene.add(dirLight);

  // Ground
  const gGeo = new THREE.PlaneGeometry(CFG.arena*2.5, CFG.arena*2.5);
  groundMat = new THREE.ShaderMaterial({
    uniforms:{ uT:{value:0}, uC1:{value:new THREE.Color(0x080818)}, uC2:{value:new THREE.Color(0x10102a)}, uGC:{value:new THREE.Color(0x1a2850)} },
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform float uT;uniform vec3 uC1,uC2,uGC;varying vec2 vUv;
      void main(){
        vec2 wp=(vUv-.5)*${(CFG.arena*2.5).toFixed(1)};
        vec2 g=abs(fract(wp*.5)-.5)/fwidth(wp*.5);
        float line=1.-min(min(g.x,g.y),1.);
        float d=length(wp)/${(CFG.arena*1.2).toFixed(1)};
        vec3 base=mix(uC1,uC2,smoothstep(0.,1.,d));
        float pulse=sin(uT*1.5)*.15+.85;
        vec3 col=mix(base,uGC,line*.45*pulse);
        col+=vec3(.03,.06,.14)*exp(-d*2.5);
        gl_FragColor=vec4(col,1.);
      }`
  });
  const gnd = new THREE.Mesh(gGeo, groundMat);
  gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true;
  scene.add(gnd);

  // Arena boundary ring
  const ringGeo = new THREE.RingGeometry(CFG.arena-1, CFG.arena, 64);
  const ringMat = new THREE.MeshBasicMaterial({color:0x1133aa, transparent:true, opacity:.25, side:THREE.DoubleSide});
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x=-Math.PI/2; ring.position.y=.05; scene.add(ring);

  // Env props
  createEnv();

  // Particles
  initParticles();
}

function createEnv(){
  const cols=[0x1a1a3a,0x222255,0x181840];
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2, r=20+Math.random()*50;
    const geo = Math.random()>.5 ?
      new THREE.DodecahedronGeometry(.8+Math.random()*2.5, 0) :
      new THREE.OctahedronGeometry(.6+Math.random()*2, 0);
    const mat = new THREE.MeshStandardMaterial({color:cols[i%3], roughness:.8, metalness:.2});
    const m = new THREE.Mesh(geo,mat);
    m.position.set(Math.cos(a)*r, Math.random()*3-1, Math.sin(a)*r);
    m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    m.castShadow=true;
    m.userData.rotSpd = (Math.random()-.5)*.3;
    scene.add(m);
    effects.push({type:'env', mesh:m, time:0, dur:99999});
  }
  // Glowing crystals
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2, r=15+Math.random()*40;
    const geo = new THREE.OctahedronGeometry(.3+Math.random()*.6,0);
    const mat = new THREE.MeshStandardMaterial({color:0x00aaff, emissive:0x0044ff, emissiveIntensity:.8, roughness:.3});
    const m = new THREE.Mesh(geo,mat);
    m.position.set(Math.cos(a)*r, .5+Math.random()*2, Math.sin(a)*r);
    m.userData.rotSpd=.5+Math.random(); m.userData.baseY=m.position.y;
    scene.add(m);
    const pl = new THREE.PointLight(0x0066ff, .5, 8);
    pl.position.copy(m.position);
    scene.add(pl);
    effects.push({type:'crystal', mesh:m, light:pl, time:Math.random()*10, dur:99999});
  }
}

function initParticles(){
  pPos=new Float32Array(PMAX*3); pVel=new Float32Array(PMAX*3);
  pCol=new Float32Array(PMAX*3); pLife=new Float32Array(PMAX);
  pSz=new Float32Array(PMAX);
  pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
  pGeo.setAttribute('size',new THREE.BufferAttribute(pSz,1));
  const mat=new THREE.PointsMaterial({size:.35,vertexColors:true,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  pPts=new THREE.Points(pGeo,mat);
  scene.add(pPts);
}
function emitP(px,py,pz,vx,vy,vz,r,g,b,sz,life){
  const i=pIdx; pIdx=(pIdx+1)%PMAX;
  pPos[i*3]=px;pPos[i*3+1]=py;pPos[i*3+2]=pz;
  pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
  pCol[i*3]=r;pCol[i*3+1]=g;pCol[i*3+2]=b;
  pSz[i]=sz; pLife[i]=life;
}
function burstP(x,y,z,count,r,g,b,szMin,szMax,spd,life){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, u=Math.random()-.5, sp=spd*(.5+Math.random());
    const sx=Math.cos(a)*Math.sqrt(1-u*u)*sp, sy=(.5+Math.random())*sp, sz=Math.sin(a)*Math.sqrt(1-u*u)*sp;
    emitP(x,y+1,z, sx,sy,sz, r+Math.random()*.2,g+Math.random()*.2,b+Math.random()*.2, szMin+Math.random()*(szMax-szMin), life*(.5+Math.random()*.5));
  }
}
function updateParticles(dt){
  for(let i=0;i<PMAX;i++){
    if(pLife[i]>0){
      pLife[i]-=dt;
      pPos[i*3]+=pVel[i*3]*dt; pPos[i*3+1]+=pVel[i*3+1]*dt; pPos[i*3+2]+=pVel[i*3+2]*dt;
      pVel[i*3+1]-=3*dt; // gravity
      pSz[i]*=.995;
      if(pLife[i]<=0) pSz[i]=0;
    }
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
  pGeo.attributes.size.needsUpdate=true;
}

// ---- PLAYER CREATION ----
function createPlayer(){
  const g = new THREE.Group();
  // Body
  const bodyGeo = new THREE.OctahedronGeometry(.55,1);
  const bodyMat = new THREE.MeshStandardMaterial({color:0x00ddbb, emissive:0x005544, emissiveIntensity:.6, roughness:.3, metalness:.4});
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y=1.1; body.castShadow=true;
  g.add(body);
  // Head
  const headGeo = new THREE.SphereGeometry(.28,12,8);
  const headMat = new THREE.MeshStandardMaterial({color:0x00eedd, emissive:0x006655, emissiveIntensity:.5, roughness:.3});
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y=1.9; head.castShadow=true;
  g.add(head);
  // Core glow

  const visorGeo = new THREE.BoxGeometry(.35,.08,.12);

// ---- ORB WEAPONS (orbit meshes) ----
function syncOrbs(){
  const stats = WSTAT.orbit[P.weps.orbit.lv-1];
  while(orbMeshes.length < stats.n){
    const geo=new THREE.SphereGeometry(.2,8,6);
    const mat=new THREE.MeshStandardMaterial({color:0x00ffaa,emissive:0x008855,emissiveIntensity:1.2,roughness:.2});
    const m=new THREE.Mesh(geo,mat);
    m.castShadow=true;
    const gl=new THREE.PointLight(0x00ffaa,.6,5);
    m.add(gl);
    scene.add(m);
    orbMeshes.push({mesh:m, hitCD:{}});
  }
  while(orbMeshes.length > stats.n){
    const o=orbMeshes.pop();
    scene.remove(o.mesh);
  }
}

// ---- ENEMY CREATION ----
function makeEnemyMesh(type){
  const T=ETYPES[type];
  const g = new THREE.Group();
  let geo;
  switch(T.sh){
    case 'oct': geo=new THREE.OctahedronGeometry(T.sc,1); break;
    case 'tet': geo=new THREE.TetrahedronGeometry(T.sc,0); break;
    case 'box': geo=new THREE.BoxGeometry(T.sc,T.sc,T.sc); break;
    case 'dod': geo=new THREE.DodecahedronGeometry(T.sc,0); break;
    case 'ico': geo=new THREE.IcosahedronGeometry(T.sc,1); break;
    default: geo=new THREE.SphereGeometry(T.sc,8,6);
  }
  const mat = new THREE.MeshStandardMaterial({color:T.col, emissive:T.col, emissiveIntensity:.4, roughness:.4, metalness:.3});
  const mesh = new THREE.Mesh(geo,mat);
  mesh.position.y = type==='boss'? 1.5 : .6+T.sc*.5;
  mesh.castShadow=true;
  g.add(mesh);
  // Eyes for non-boss
  if(type!=='boss'){
    const eyeMat=new THREE.MeshBasicMaterial({color:0xffffff});
    for(let sx=-.12;sx<=.12;sx+=.24){
      const eye=new THREE.Mesh(new THREE.SphereGeometry(.06*T.sc/.4,6,4),eyeMat);
      eye.position.set(sx, mesh.position.y+.05, T.sc*.5);
      g.add(eye);
    }
  }
  // HP bar for bosses
  if(type==='boss'){
    const barBg=new THREE.Mesh(new THREE.PlaneGeometry(3,.25), new THREE.MeshBasicMaterial({color:0x220000,side:THREE.DoubleSide}));
    barBg.position.set(0, T.sc*2+1, 0);
    g.add(barBg);
    const barFg=new THREE.Mesh(new THREE.PlaneGeometry(3,.25), new THREE.MeshBasicMaterial({color:0xff4400,side:THREE.DoubleSide}));
    barFg.position.set(0, T.sc*2+1, .01);
    g.add(barFg);
    g.userData.hpBarBg=barBg; g.userData.hpBarFg=barFg;
  }
  return g;
}

function spawnEnemy(type, x, z, hpMult){
  if(enemies.length >= CFG.maxEnemies) return;
  const T = ETYPES[type];
  const mesh = makeEnemyMesh(type);
  mesh.position.set(x, 0, z);
  scene.add(mesh);
  const hp = T.hp * (hpMult||1);
  enemies.push({
    mesh, type, hp, maxHp:hp, spd:T.spd, dmg:T.dmg, xp:T.xp,
    hitCD:{}, atkCD:0, vel:new THREE.Vector3(),
    bossHpBg:mesh.userData.hpBarBg, bossHpFg:mesh.userData.hpBarFg
  });
}

function spawnWave(){
  const count = Math.floor(1 + diff*.6 + Math.random()*diff*.3);
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const d = CFG.spawnDist + Math.random()*8;
    const x = P.pos.x + Math.cos(a)*d;
    const z = P.pos.z + Math.sin(a)*d;
    // Clamp to arena
    const dist = Math.sqrt(x*x+z*z);
    const fx = dist>CFG.arena ? x/dist*CFG.arena*.95 : x;
    const fz = dist>CFG.arena ? z/dist*CFG.arena*.95 : z;

    let type='shard';
    const roll=Math.random();
    if(diff>1.5 && roll<.18) type='blink';
    if(diff>3 && roll<.12) type='tank';
    if(diff>2 && roll<.08) type='spitter';
    const hpMult = 1 + diff*.12;
    spawnEnemy(type, fx, fz, hpMult);
  }
}

function spawnBoss(){
  const a = Math.random()*Math.PI*2;
  const d = CFG.spawnDist;
  spawnEnemy('boss', P.pos.x+Math.cos(a)*d, P.pos.z+Math.sin(a)*d, 1+bossCount*.5);
  snd('boss');
  shake(12,.6);
  // Boss warning
  const bw=document.getElementById('boss-warn');
  bw.classList.remove('show');
  void bw.offsetWidth;
  bw.classList.add('show');
  setTimeout(()=>bw.classList.remove('show'),2200);
  bossCount++;
}

// ---- LEVEL UP SYSTEM ----
function getUpgradePool(){
  const pool=[];
  // General upgrades
  pool.push({id:'might',icon:'\u2694\uFE0F',name:'Might',desc:'+20% All Damage',fn:()=>{P.dmgM+=.2}});
  pool.push({id:'agility',icon:'\uD83D\uDC5F',name:'Agility',desc:'+12% Move Speed',fn:()=>{P.spdM+=.12}});
  pool.push({id:'vitality',icon:'\u2764\uFE0F',name:'Vitality',desc:'+30 Max HP & Heal',fn:()=>{P.maxHp+=30;P.hp=Math.min(P.hp+30,P.maxHp)}});
  pool.push({id:'frenzy',icon:'\u26A1',name:'Frenzy',desc:'+15% Attack Speed',fn:()=>{P.atkM+=.15}});
  pool.push({id:'magnet',icon:'\uD83E\uDDF2',name:'Magnetism',desc:'+50% Pickup Range',fn:()=>{P.pickM+=.5}});
  pool.push({id:'regen',icon:'\uD83D\uDC9A',name:'Regeneration',desc:'+2 HP/sec',fn:()=>{P.regen+=2}});
  pool.push({id:'fortify',icon:'\uD83D\uDEE1\uFE0F',name:'Fortitude',desc:'+12% Damage Reduction',fn:()=>{P.armor=Math.min(P.armor+.12,.6)}});
  pool.push({id:'crit',icon:'\uD83C\uDFAF',name:'Precision',desc:'+8% Crit Chance',fn:()=>{P.critCh=Math.min(P.critCh+.08,.5)}});
  pool.push({id:'haste',icon:'\uD83D\uDCA8',name:'Haste',desc:'+8% Speed & Attack',fn:()=>{P.spdM+=.08;P.atkM+=.08}});

  // Weapon upgrades
  const w=P.weps;
  const unlocked = [w.orbit.lv>0, w.zap.lv>0, w.nova.lv>0, w.shards.lv>0].filter(Boolean).length;

  if(w.orbit.lv>0 && w.orbit.lv<5)
    pool.push({id:'orb_up',icon:'\uD83D\uDD2E',name:'Orb Power',desc:'Energy Orbit Lv'+(w.orbit.lv+1),fn:()=>{w.orbit.lv++;syncOrbs()}});
  if(w.zap.lv===0 && unlocked<4)
    pool.push({id:'zap_new',icon:'\u26A1',name:'Lightning Arc',desc:'Chain lightning to enemies',fn:()=>{w.zap.lv=1}});
  else if(w.zap.lv>0 && w.zap.lv<5)
    pool.push({id:'zap_up',icon:'\u26A1',name:'Arc Power',desc:'Lightning Arc Lv'+(w.zap.lv+1),fn:()=>{w.zap.lv++}});
  if(w.nova.lv===0 && unlocked<4)
    pool.push({id:'nova_new',icon:'\uD83D\uDCA5',name:'Nova Burst',desc:'Periodic explosion around you',fn:()=>{w.nova.lv=1}});
  else if(w.nova.lv>0 && w.nova.lv<5)
    pool.push({id:'nova_up',icon:'\uD83D\uDCA5',name:'Nova Power',desc:'Nova Burst Lv'+(w.nova.lv+1),fn:()=>{w.nova.lv++}});
  if(w.shards.lv===0 && unlocked<4)
    pool.push({id:'shard_new',icon:'\uD83D\uDDE1\uFE0F',name:'Seeking Shards',desc:'Homing projectiles',fn:()=>{w.shards.lv=1}});
  else if(w.shards.lv>0 && w.shards.lv<5)
    pool.push({id:'shard_up',icon:'\uD83D\uDDE1\uFE0F',name:'Shard Power',desc:'Seeking Shards Lv'+(w.shards.lv+1),fn:()=>{w.shards.lv++}});

  return pool;
}

  state='levelup';

function addXP(amt){
  P.xp+=amt;
  while(P.xp>=P.xpNext){
    P.xp-=P.xpNext;
    P.lvl++;
    P.xpNext=Math.floor(10*Math.pow(1.4,P.lvl-1));
    showLevelUp();
  }
}

// ---- COMBAT ----
function calcDmg(base){
  let d=base*P.dmgM;
  let crit=false;
  if(Math.random()<P.critCh){d*=2; crit=true;}
  return {d:Math.round(d), crit};
}

function dealDmgEnemy(e, baseDmg){
  const {d,crit}=calcDmg(baseDmg);
  e.hp-=d;
  snd('hit');
  // Flash enemy
  if(e.mesh.children[0] && e.mesh.children[0].material){
    const m=e.mesh.children[0].material;
    const origE=m.emissiveIntensity;
    m.emissiveIntensity=2;
    setTimeout(()=>{if(m) m.emissiveIntensity=origE},80);
  }
  // Damage number
  showDmgNum(e.mesh.position, d, crit);
  // Particles
  const ec=ETYPES[e.type].col;
  burstP(e.mesh.position.x, e.mesh.position.y, e.mesh.position.z, 4, (ec>>16&255)/255, (ec>>8&255)/255, (ec&255)/255, .1,.3,3,.4);
  // Boss HP bar
  if(e.type==='boss' && e.bossHpFg){
    const ratio=Math.max(0,e.hp/e.maxHp);
    e.bossHpFg.scale.x=Math.max(.01,ratio);
    e.bossHpFg.position.x=-(1-ratio)*1.5;
  }
  if(e.hp<=0){
    killEnemy(e);
    return true;
  }
  return false;
}

function killEnemy(e){
  snd('kill');
  kills++;
  score+=ETYPES[e.type].xp*10;
  // Death burst
  const ec=ETYPES[e.type].col;
  const count=e.type==='boss'?40:12;
  burstP(e.mesh.position.x,e.mesh.position.y+.5,e.mesh.position.z, count, (ec>>16&255)/255,(ec>>8&255)/255,(ec&255)/255, .15,.5,5,.6);
  if(e.type==='boss'){
    shake(18,.8);
    score+=500;
    // Drop multiple xp and heal
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2;
      spawnXP(e.mesh.position.x+Math.cos(a)*2, e.mesh.position.z+Math.sin(a)*2, 8);
    }
    spawnHeal(e.mesh.position.x, e.mesh.position.z);
  } else {
    shake(3,.1);
    spawnXP(e.mesh.position.x, e.mesh.position.z, ETYPES[e.type].xp);
    if(Math.random()<.08) spawnHeal(e.mesh.position.x, e.mesh.position.z);
  }
  // Remove
  scene.remove(e.mesh);
  e.dead=true;
}

function dealDmgPlayer(dmg){
  if(P.invT>0) return;
  const actual = dmg*(1-P.armor);
  P.hp-=actual;
  P.invT=.3;
  snd('hurt');
  shake(6,.15);
  // Flash red
  const flash=document.getElementById('flash');
  flash.style.background='rgba(255,30,30,.2)'; flash.style.opacity='1';
  setTimeout(()=>flash.style.opacity='0',100);
  burstP(P.pos.x,P.pos.y+1,P.pos.z, 6, 1,.2,.2, .1,.3,3,.35);
  if(P.hp<=0){
    P.hp=0;
    gameOver();
  }
}

function shake(pow,dur){
  shakePow=Math.max(shakePow,pow);
  shakeDur=Math.max(shakeDur,dur);
}

// ---- UPDATE FUNCTIONS ----
function updatePlayer(dt){
  let mx=0, mz=0;
  if(keys['w']||keys['arrowup']) mz=-1;
  if(keys['s']||keys['arrowdown']) mz=1;
  if(keys['a']||keys['arrowleft']) mx=-1;
  if(keys['d']||keys['arrowright']) mx=1;
  const len=Math.sqrt(mx*mx+mz*mz)||1;
  mx/=len; mz/=len;
  const spd=P.spd*P.spdM;
  P.vel.x=mx*spd; P.vel.z=mz*spd;
  P.pos.x+=P.vel.x*dt; P.pos.z+=P.vel.z*dt;
  // Arena clamp
  const dist=Math.sqrt(P.pos.x*P.pos.x+P.pos.z*P.pos.z);
  if(dist>CFG.arena){P.pos.x*=CFG.arena/dist; P.pos.z*=CFG.arena/dist;}
  P.mesh.position.copy(P.pos);
  // Face direction
  if(mx!==0||mz!==0){
    P.face=Math.atan2(mx,mz);
  }
  P.mesh.rotation.y=P.face;
  // Bob animation
  P.mesh.children[0].position.y=1.1+Math.sin(gameTime*4)*.08;
  P.mesh.children[1].position.y=1.9+Math.sin(gameTime*4+.5)*.06;
  // Invulnerability
  if(P.invT>0) P.invT-=dt;
  P.mesh.visible = P.invT<=0 || Math.floor(gameTime*20)%2===0;
  // Regen
  if(P.regen>0){
    P.hp=Math.min(P.hp+P.regen*dt, P.maxHp);
  }
  // Pickup range
  const pickR=CFG.basePickupRange*P.pickM;
  // Ambient particles
  if(Math.random()<.15){
    emitP(P.pos.x+(Math.random()-.5)*.5, 1+Math.random(), P.pos.z+(Math.random()-.5)*.5,
      (Math.random()-.5)*.3, Math.random()*.5, (Math.random()-.5)*.3,
      0,.8,.6, .08+.Math.random()*.06, .5+Math.random()*.5);
  }
}

function updateCamera(dt){
  const tx=P.pos.x, tz=P.pos.z+CFG.camD*.7;
  const ty=CFG.camH;
  camera.position.x+=(tx-camera.position.x)*4*dt;
  camera.position.y+=(ty-camera.position.y)*4*dt;
  camera.position.z+=(tz-camera.position.z)*4*dt;
  camera.lookAt(P.pos.x, 0, P.pos.z);
  // Shake
  if(shakeDur>0){
    shakeDur-=dt;
    camera.position.x+=(Math.random()-.5)*shakePow*.15;
    camera.position.z+=(Math.random()-.5)*shakePow*.15;
    shakePow*=.88;
  }
  // Update shadow camera to follow player
  dirLight.position.set(P.pos.x+15, 30, P.pos.z+10);
  dirLight.target.position.copy(P.pos);
  dirLight.target.updateMatrixWorld();
}

function updateEnemies(dt){
  let spawnRate = Math.max(.4, 2.5 - diff*.12);
  // Spawn timer
  if(!updateEnemies.spawnT) updateEnemies.spawnT=0;
  updateEnemies.spawnT-=dt;
  if(updateEnemies.spawnT<=0){
    spawnWave();
    updateEnemies.spawnT=spawnRate;
  }
  // Boss
  if(gameTime-lastBossTime>=60){
    spawnBoss();
    lastBossTime=gameTime;
  }
  // Update enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){enemies.splice(i,1);continue;}
    // Move toward player
    const dx=P.pos.x-e.mesh.position.x, dz=P.pos.z-e.mesh.position.z;
    const dist=Math.sqrt(dx*dx+dz*dz)||1;
    const nx=dx/dist, nz=dz/dist;
    let spd=e.spd*(e.type==='blink'?1:1);
    e.mesh.position.x+=nx*spd*dt;
    e.mesh.position.z+=nz*spd*dt;
    // Arena clamp
    const ed=Math.sqrt(e.mesh.position.x**2+e.mesh.position.z**2);
    if(ed>CFG.arena){e.mesh.position.x*=CFG.arena/ed;e.mesh.position.z*=CFG.arena/ed;}
    // Rotate
    e.mesh.children[0].rotation.y+=dt*2;
    e.mesh.children[0].rotation.x+=dt*.5;
    // Bob
    const bobY = e.type==='boss'?1.5:.6+ETYPES[e.type].sc*.5;
    e.mesh.children[0].position.y = bobY + Math.sin(gameTime*3+i)*.15;
    // Boss hp bar face camera
    if(e.type==='boss' && e.bossHpBg){
      e.bossHpBg.lookAt(camera.position);
      e.bossHpFg.lookAt(camera.position);
    }
    // Collision with player
    if(dist<1.2+ETYPES[e.type].sc*.5){
      e.atkCD-=dt;
      if(e.atkCD<=0){
        dealDmgPlayer(e.dmg);
        e.atkCD=.5;
      }
    }
    // Spitter ranged attack
    if(e.type==='spitter'){
      e.spitT=(e.spitT||0)+dt;
      if(e.spitT>2.2 && dist<20 && dist>3){
        e.spitT=0;
        spawnEProj(e.mesh.position.x, e.mesh.position.z, P.pos.x, P.pos.z, e.dmg);
      }
    }
    // Update hit cooldowns
    for(const k in e.hitCD) if(e.hitCD[k]>0) e.hitCD[k]-=dt;
  }
}

function updateWeapons(dt){
  const w=P.weps;
  // Orbit
  if(w.orbit.lv>0){
    const stats=WSTAT.orbit[w.orbit.lv-1];
    w.orbit.ang += stats.spd*dt;
    for(let i=0;i<orbMeshes.length;i++){
      const a=w.orbit.ang + (Math.PI*2/orbMeshes.length)*i;
      const ox=P.pos.x+Math.cos(a)*stats.r;
      const oz=P.pos.z+Math.sin(a)*stats.r;
      orbMeshes[i].mesh.position.set(ox, 1+Math.sin(gameTime*5+i)*.2, oz);
      orbMeshes[i].mesh.rotation.y+=dt*3;
      // Hit check
      for(const e of enemies){
        if(e.dead) continue;
        if(e.hitCD['orb'+i]>0) continue;
        const d=orbMeshes[i].mesh.position.distanceTo(e.mesh.position);
        if(d<1.2){
          dealDmgEnemy(e, stats.d);
          e.hitCD['orb'+i]=stats.hcd;
        }
      }
    }
  }
  // Lightning
  if(w.zap.lv>0){
    const stats=WSTAT.zap[w.zap.lv-1];
    w.zap.t-=dt;
    if(w.zap.t<=0){
      w.zap.t=stats.cd/P.atkM;
      fireLightning(stats);
    }
  }
  // Nova
  if(w.nova.lv>0){
    const stats=WSTAT.nova[w.nova.lv-1];
    w.nova.t-=dt;
    if(w.nova.t<=0){
      w.nova.t=stats.cd/P.atkM;
      fireNova(stats);
    }
  }
  // Shards
  if(w.shards.lv>0){
    const stats=WSTAT.shards[w.shards.lv-1];
    w.shards.t-=dt;
    if(w.shards.t<=0){
      w.shards.t=stats.cd/P.atkM;
      fireShards(stats);
    }
  }
}

function findNearest(pos, range, exclude){
  let best=null, bestD=range*range;
  for(const e of enemies){
    if(e.dead) continue;
    if(exclude && exclude.includes(e)) continue;
    const dx=e.mesh.position.x-pos.x, dz=e.mesh.position.z-pos.z;
    const d2=dx*dx+dz*dz;
    if(d2<bestD){bestD=d2;best=e;}
  }
  return best;
}

function fireLightning(stats){
  const first=findNearest(P.pos, stats.rng);
  if(!first) return;
  snd('zap');
  let current=first;
  const hit=[current];
  let from=P.pos.clone(); from.y=1.5;
  for(let c=0;c<stats.ch;c++){
    dealDmgEnemy(current, stats.d);
    const to=current.mesh.position.clone(); to.y=1;
    createLightningFx(from, to);
    from=to;
    const next=findNearest(current.mesh.position, stats.chr, hit);
    if(!next) break;
    hit.push(next);
    current=next;
  }
}

function createLightningFx(from, to){
  const pts=[];
  const segs=6;
  const dir=to.clone().sub(from);
  const perp=new THREE.Vector3(-dir.z,0,dir.x).normalize();
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    const p=from.clone().lerp(to,t);
    if(i>0&&i<segs){p.add(perp.clone().multiplyScalar((Math.random()-.5)*1.5));p.y+=(Math.random()-.5)*1;}
    pts.push(p);
  }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({color:0x66eeff,transparent:true,opacity:1});
  const line=new THREE.Line(geo,mat);
  scene.add(line);
  // Glow sphere at hit
  const gs=new THREE.Mesh(new THREE.SphereGeometry(.15,6,4),new THREE.MeshBasicMaterial({color:0x44ddff}));
  gs.position.copy(to);
  scene.add(gs);
  effects.push({type:'fade',mesh:line,geo,mat,time:0,dur:.15});
  effects.push({type:'fade',mesh:gs,geo:gs.geometry,mat:gs.material,time:0,dur:.2});
}

function fireNova(stats){
  snd('nova');
  shake(5,.12);
  // Create ring effect
  const ringGeo=new THREE.RingGeometry(.2,.6,32);
  const ringMat=new THREE.MeshBasicMaterial({color:0xff8833,transparent:true,opacity:.9,side:THREE.DoubleSide});
  const ring=new THREE.Mesh(ringGeo,ringMat);
  ring.position.copy(P.pos); ring.position.y=.3;
  ring.rotation.x=-Math.PI/2;
  scene.add(ring);
  effects.push({type:'nova',mesh:ring,geo:ringGeo,mat:ringMat,time:0,dur:.4,radius:stats.r});
  // Damage enemies
  for(const e of enemies){
    if(e.dead) continue;
    const d=e.mesh.position.distanceTo(P.pos);
    if(d<stats.r){
      dealDmgEnemy(e, stats.d);
      // Knockback
      const dx=e.mesh.position.x-P.pos.x, dz=e.mesh.position.z-P.pos.z;
      const len=Math.sqrt(dx*dx+dz*dz)||1;
      e.mesh.position.x+=dx/len*3; e.mesh.position.z+=dz/len*3;
    }
  }
  burstP(P.pos.x,1,P.pos.z, 20, 1,.5,.2, .1,.4, 6, .5);
}

function fireShards(stats){
  snd('shard');
  for(let i=0;i<stats.n;i++){
    let target=findNearest(P.pos, stats.rng);
    if(!target) break;
    const a=Math.atan2(target.mesh.position.x-P.pos.x, target.mesh.position.z-P.pos.z)+(Math.random()-.5)*.4;
    spawnProj(P.pos.x, 1.2, P.pos.z, Math.sin(a), Math.cos(a), stats.d, stats.spd, 2, 0x44ffaa, true);
  }
}

function updateProjectiles(dt){
  // Player projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.time+=dt;
    if(p.time>p.life){scene.remove(p.mesh);projectiles.splice(i,1);continue;}
    // Homing
    if(p.homing){
      const t=findNearest(p.mesh.position, 15);
      if(t){
        const dx=t.mesh.position.x-p.mesh.position.x, dz=t.mesh.position.z-p.mesh.position.z;
        const len=Math.sqrt(dx*dx+dz*dz)||1;
        p.vx+=(dx/len-p.vx)*3*dt;
        p.vz+=(dz/len-p.vz)*3*dt;
        const s=Math.sqrt(p.vx*p.vx+p.vz*p.vz);
        p.vx=p.vx/s*p.spd; p.vz=p.vz/s*p.spd;
      }
    }
    p.mesh.position.x+=p.vx*dt; p.mesh.position.z+=p.vz*dt;
    p.mesh.position.y=1+Math.sin(p.time*10)*.1;
    // Hit check
    for(const e of enemies){
      if(e.dead) continue;
      const d=p.mesh.position.distanceTo(e.mesh.position);
      if(d<1){
        dealDmgEnemy(e, p.dmg);
        scene.remove(p.mesh); projectiles.splice(i,1);
        burstP(e.mesh.position.x,1,e.mesh.position.z, 3,.3,1,.6, .05,.2, 2,.3);
        break;
      }
    }
    // Trail particle
    if(Math.random()<.3){
      emitP(p.mesh.position.x,p.mesh.position.y,p.mesh.position.z, (Math.random()-.5)*.5,(Math.random()-.5)*.5,(Math.random()-.5)*.5, .2,1,.5, .06,.2);
    }
  }
  // Enemy projectiles
  for(let i=eProj.length-1;i>=0;i--){
    const p=eProj[i];
    p.life-=dt;
    if(p.life<=0){scene.remove(p.mesh);eProj.splice(i,1);continue;}
    p.mesh.position.x+=p.vx*dt; p.mesh.position.z+=p.vz*dt;
    p.mesh.rotation.y+=dt*5;
    // Hit player
    const d=p.mesh.position.distanceTo(P.mesh.position);
    if(d<1.2){
      dealDmgPlayer(p.dmg);
      scene.remove(p.mesh); eProj.splice(i,1);
      continue;
    }
    // Trail
    if(Math.random()<.2) emitP(p.mesh.position.x,.8,p.mesh.position.z, 0,.2,0, .15,.5,1, .04,.15);
  }
}

function updatePickups(dt){
  const pickR=CFG.basePickupRange*P.pickM;
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];
    p.time+=dt;
    p.mesh.rotation.y+=dt*3;
    p.mesh.position.y=.4+Math.sin(p.time*3)*.15;
    const dx=P.pos.x-p.mesh.position.x, dz=P.pos.z-p.mesh.position.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<pickR){
      // Attract toward player
      const spd=CFG.xpMagnetSpeed;
      p.mesh.position.x+=dx/d*spd*dt;
      p.mesh.position.z+=dz/d*spd*dt;
    }
    if(d<1){
      if(p.type==='xp'){
        addXP(p.amt);
        snd('xp');
        score+=p.amt*5;
      } else if(p.type==='heal'){
        P.hp=Math.min(P.hp+p.amt, P.maxHp);
        snd('heal');
      }
      scene.remove(p.mesh);
      pickups.splice(i,1);
      continue;
    }
    // Remove if too old or too far
    if(p.time>30 || d>80){
      scene.remove(p.mesh);
      pickups.splice(i,1);
    }
  }
}

function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){
    const fx=effects[i];
    fx.time+=dt;
    if(fx.type==='env'){
      if(fx.mesh.userData.rotSpd) fx.mesh.rotation.y+=fx.mesh.userData.rotSpd*dt;
      continue;
    }
    if(fx.type==='crystal'){
      if(fx.mesh.userData.rotSpd) fx.mesh.rotation.y+=fx.mesh.userData.rotSpd*dt;
      fx.mesh.position.y=fx.mesh.userData.baseY+Math.sin(fx.time)*.3;
      if(fx.light) fx.light.position.copy(fx.mesh.position);
      continue;
    }
    const t=fx.time/fx.dur;
    if(fx.time>=fx.dur){
      scene.remove(fx.mesh);
      if(fx.geo) fx.geo.dispose();
      if(fx.mat) fx.mat.dispose();
      effects.splice(i,1); continue;
    }
    if(fx.type==='fade'){
      fx.mat.opacity=1-t;
    }
    if(fx.type==='nova'){
      const s=t*fx.radius;
      fx.mesh.scale.set(s,s,s);
      fx.mat.opacity=(1-t)*.8;
    }
  }
}

function updateDifficulty(dt){
  diff+=dt/30; // +1 every 30 seconds
}

function updateHUD(){
  document.getElementById('hLv').textContent=P.lvl;
  document.getElementById('hpBar').style.width=Math.max(0,P.hp/P.maxHp*100)+'%';
  document.getElementById('hpLbl').textContent=Math.ceil(P.hp)+' / '+P.maxHp;
  document.getElementById('xpBar').style.width=(P.xp/P.xpNext*100)+'%';
  document.getElementById('xpLbl').textContent=P.xp+' / '+P.xpNext;
  const m=Math.floor(gameTime/60), s=Math.floor(gameTime%60);
  document.getElementById('hTime').textContent=m+':'+s.toString().padStart(2,'0');
  document.getElementById('hKills').textContent=kills;
  document.getElementById('hScore').textContent=score;
  // Weapon cooldowns
  const w=P.weps;
  const wKeys=['orbit','zap','nova','shards'];
  for(let i=0;i<4;i++){
    const wk=wKeys[i];
    const wdata=w[wk];
    const cdEl=document.getElementById('wc'+i);
    if(wdata.lv>0){
      let cdRatio=0;
      if(wk==='zap'&&WSTAT.zap[wdata.lv-1]) cdRatio=wdata.t/(WSTAT.zap[wdata.lv-1].cd/P.atkM);
      if(wk==='nova'&&WSTAT.nova[wdata.lv-1]) cdRatio=wdata.t/(WSTAT.nova[wdata.lv-1].cd/P.atkM);
      if(wk==='shards'&&WSTAT.shards[wdata.lv-1]) cdRatio=wdata.t/(WSTAT.shards[wdata.lv-1].cd/P.atkM);
      cdEl.style.height=Math.max(0,cdRatio*100)+'%';
    }
  }
}

// ---- MAIN LOOP ----
function loop(ts){
  requestAnimationFrame(loop);
  const now=ts/1000;
  let dt=now-lastT;
  lastT=now;
  dt=Math.min(dt,.08);
  if(state==='play'){
    gameTime+=dt;
    updatePlayer(dt);
    updateEnemies(dt);
    updateWeapons(dt);
    updateProjectiles(dt);
    updatePickups(dt);
    updateDifficulty(dt);
    updateHUD();
  }
  updateCamera(dt);
  updateEffects(dt);
  updateParticles(dt);
  // Ground shader
  if(groundMat) groundMat.uniforms.uT.value=gameTime;
  renderer.render(scene, camera);
}

// ---- INPUT ----
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ---- BUTTONS ----
document.getElementById('startBtn').onclick=startGame;
document.getElementById('goBtn').onclick=restartGame;

// ---- INIT ----
initThree();
createPlayer();
syncOrbs();
requestAnimationFrame(loop);

</script>
