<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Warden - Shadow Survival</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/geometries/DecalGeometry.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        .health-bar, .xp-bar {
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        .health-fill { background: linear-gradient(90deg, #ff4081, #ff6b9d); transition: width 0.3s; }
        .xp-fill { background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width 0.3s; }
        .damage-number {
            position: absolute;
            color: #ffeb3b;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
            font-size: 24px;
            animation: floatUp 1s forwards;
            pointer-events: none;
            z-index: 200;
            transform: translate(-50%, -50%);
            font-family: 'Arial', sans-serif;
        }
        
        .damage-number.crit {
            color: #ff0000;
            font-size: 28px;
            text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 0 0 45px #ff0000;
            animation: floatUpCrit 1s forwards;
        }
        
        .damage-number.heal {
            color: #4caf50;
            font-size: 20px;
        }
        
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) translateY(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) translateY(-100px); opacity: 0; }
        }
        
        @keyframes floatUpCrit {
            0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) translateY(-50px) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) translateY(-100px) scale(1); opacity: 0; }
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        #start-menu, #game-over, #level-up {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            pointer-events: auto;
        }
        #start-menu h1, #game-over h1, #level-up h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #fff, 0 0 40px #fff;
            background: linear-gradient(90deg, #00bcd4, #0097a7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #level-up h1 {
            background: linear-gradient(90deg, #ffd700, #ffb300);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .menu-btn {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            color: #00bcd4;
            border: 2px solid #00bcd4;
            padding: 15px 40px;
            font-size: 1.5rem;
            margin: 10px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0,188,212,0.3);
        }
        .menu-btn:hover {
            background: linear-gradient(145deg, #00bcd4, #0097a7);
            color: #000;
            box-shadow: 0 0 40px rgba(0,188,212,0.6);
        }
        #score-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ffeb3b;
            background: linear-gradient(90deg, #ffeb3b, #ffc107);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #level-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ffeb3b;
        }
        #wave-display {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #00bcd4;
            text-shadow: 0 0 10px rgba(0,188,212,0.5);
        }
        .health-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
        }
        .xp-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
        }
        .health-label, .xp-label {
            padding: 5px 10px;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 0 0 5px #000;
        }
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 800px;
            margin-top: 20px;
        }
        .upgrade-card {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 2px solid #00bcd4;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,188,212,0.2);
        }
        .upgrade-card:hover {
            background: linear-gradient(145deg, #00bcd4, #0097a7);
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0,188,212,0.4);
        }
        .upgrade-card h3 {
            color: #ffeb3b;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .upgrade-card p {
            color: #ccc;
            font-size: 0.9rem;
        }
        .hidden { display: none !important; }
        #ability-cooldowns {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }
        .ability-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 2px solid #00bcd4;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .ability-icon:hover:not(.on-cooldown) {
            background: rgba(0,188,212,0.3);
            box-shadow: 0 0 20px rgba(0,188,212,0.5);
        }
        .ability-icon.on-cooldown {
            opacity: 0.5;
        }
        .ability-icon.on-cooldown::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            animation: cooldown 1s linear forwards;
        }
        @keyframes cooldown {
            0% { clip-path: inset(0 0 0 100%); }
            100% { clip-path: inset(0 0 0 0); }
        }
        #weapon-selector {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 10px;
        }
        .weapon-slot {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid #00bcd4;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }
        .weapon-slot.active {
            background: rgba(0,188,212,0.4);
            box-shadow: 0 0 15px rgba(0,188,212,0.5);
        }
        #boss-health {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 20px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff4081;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        #boss-health .fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4081, #ff6b9d);
            transition: width 0.3s;
        }
        #boss-name {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff4081;
            text-shadow: 0 0 20px #ff4081;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="ui">
        <div id="score-display">SCORE: 0</div>
        <div id="level-display">LEVEL 1</div>
        <div id="wave-display">WAVE 1</div>
        
        <div class="health-container">
            <div class="health-label">HEALTH</div>
            <div class="health-bar"><div class="health-fill" style="width: 100%"></div></div>
        </div>
        <div class="xp-container">
            <div class="xp-label">XP: <span id="xp-value">0</span>/<span id="xp-max">100</span></div>
            <div class="xp-bar"><div class="xp-fill" style="width: 0%"></div></div>
        </div>
        
        <div id="boss-name"></div>
        <div id="boss-health"><div class="fill" style="width: 100%"></div></div>
        
        <div id="ability-cooldowns">
            <div class="ability-icon" data-ability="0" title="Radiant Beam">☀</div>
            <div class="ability-icon" data-ability="1" title="Photon Burst">⚡</div>
            <div class="ability-icon" data-ability="2" title="Nova Pulse">✦</div>
            <div class="ability-icon" data-ability="3" title="Celestial Strike">⚔</div>
        </div>
        
        <div id="weapon-selector">
            <div class="weapon-slot active" data-weapon="0">1</div>
            <div class="weapon-slot" data-weapon="1">2</div>
            <div class="weapon-slot" data-weapon="2">3</div>
            <div class="weapon-slot" data-weapon="3">4</div>
        </div>
    </div>
    
    <div id="start-menu">
        <h1>LUMEN WARDEN</h1>
        <p style="font-size: 1.5rem; margin-bottom: 3rem; color: #ccc;">Defend the Celestial Garden from the Void</p>
        <button class="menu-btn" onclick="startGame()">BEGIN JOURNEY</button>
        <p style="margin-top: 2rem; color: #888; font-size: 0.9rem;">WASD to move | Mouse to aim | 1-4 for weapons | Q to cycle weapons</p>
    </div>
    
    <div id="game-over" class="hidden">
        <h1>GAME OVER</h1>
        <p id="final-score" style="font-size: 2rem; margin-bottom: 2rem; color: #ffeb3b;">Score: 0</p>
        <p id="final-wave" style="font-size: 1.5rem; margin-bottom: 2rem; color: #00bcd4;">Waves Survived: 0</p>
        <button class="menu-btn" onclick="restartGame()">RESTART</button>
        <button class="menu-btn" onclick="showStartMenu()">MAIN MENU</button>
    </div>
    
    <div id="level-up" class="hidden">
        <h1>LEVEL UP!</h1>
        <p style="font-size: 1.5rem; margin-bottom: 2rem; color: #ffd700;">Choose an upgrade:</p>
        <div class="upgrade-grid" id="upgrade-grid"></div>
    </div>

    <script>
        // ============================================
        // GAME CONFIGURATION
        // ============================================
        const CONFIG = {
            // Game settings
            targetFPS: 60,
            maxEnemies: 200,
            maxProjectiles: 500,
            maxParticles: 1000,
            
            // World
            worldRadius: 500,
            islandCount: 15,
            islandSize: { min: 40, max: 120 },
            islandHeight: { min: 2, max: 15 },
            crystalCount: 30,
            plantCount: 50,
            
            // Player
            playerHealth: 100,
            playerSpeed: 8,
            playerRotationSpeed: 0.15,
            playerModelScale: 0.8,
            
            // Weapons
            weapons: [
                { name: 'Radiant Beam', damage: 10, cooldown: 0.1, range: 300, auto: true, pierce: 1, width: 0.3, duration: 0.5, color: 0x00bcd4 },
                { name: 'Photon Burst', damage: 40, cooldown: 1.5, range: 500, auto: false, pierce: 3, width: 0.5, chargeTime: 0.5, color: 0x0097a7 },
                { name: 'Nova Pulse', damage: 30, cooldown: 3, range: 20, auto: false, pierce: Infinity, width: 0, radius: 12, color: 0xffeb3b },
                { name: 'Celestial Strike', damage: 60, cooldown: 5, range: 15, auto: false, pierce: 1, width: 0, color: 0xffffff }
            ],
            
            // Enemies
            enemies: [
                { name: 'Void Wraith', health: 30, damage: 5, speed: 4, scale: 0.6, color: 0x4a148c, xp: 10, spawnWeight: 80 },
                { name: 'Shadow Crawler', health: 60, damage: 10, speed: 6, scale: 0.8, color: 0x212121, xp: 20, spawnWeight: 50 },
                { name: 'Umbra Stalker', health: 40, damage: 8, speed: 5, scale: 0.7, color: 0x0d47a1, xp: 15, spawnWeight: 60, ranged: true, attackRange: 200, attackCooldown: 2 },
                { name: 'Eclipse Mage', health: 80, damage: 15, speed: 3, scale: 0.9, color: 0x4527a0, xp: 30, spawnWeight: 30, ranged: true, attackRange: 300, attackCooldown: 3 },
                { name: 'Abyssal Titan', health: 500, damage: 25, speed: 4, scale: 1.5, color: 0x000000, xp: 100, spawnWeight: 5, isBoss: true, attackRange: 40, attackCooldown: 1.5 }
            ],
            
            // Waves
            waveBaseTime: 30,
            waveSpawnInterval: 1,
            waveEnemyMultiplier: 1.15,
            waveHealthMultiplier: 1.2,
            waveDamageMultiplier: 1.1,
            bossEvery: 5,
            
            // XP
            xpBase: 100,
            xpGrowth: 1.5,
            
            // Upgrades
            upgradesPerLevel: 3,
            upgradeCategories: [
                { name: 'Weapon Damage', type: 'damage', value: 1.1, description: '+10% Damage' },
                { name: 'Attack Speed', type: 'attackSpeed', value: 1.1, description: '+10% Attack Speed' },
                { name: 'Health', type: 'health', value: 20, description: '+20 Max Health' },
                { name: 'Health Regen', type: 'healthRegen', value: 0.5, description: '+0.5 HP/s' },
                { name: 'Movement Speed', type: 'speed', value: 0.5, description: '+0.5 Movement Speed' },
                { name: 'Range', type: 'range', value: 1.1, description: '+10% Range' },
                { name: 'Pierce', type: 'pierce', value: 1, description: '+1 Pierce' },
                { name: 'Area of Effect', type: 'aoe', value: 1.1, description: '+10% AoE Radius' },
                { name: 'Critical Hit', type: 'crit', value: 0.1, description: '+10% Critical Chance' },
                { name: 'Lifesteal', type: 'lifesteal', value: 0.05, description: '+5% Lifesteal' },
                { name: 'Cooldown Reduction', type: 'cooldown', value: 0.9, description: '-10% Cooldowns' },
                { name: 'XP Gain', type: 'xpGain', value: 1.1, description: '+10% XP Gain' }
            ],
            
            // Visuals
            ambientLightIntensity: 0.4,
            directionalLightIntensity: 1,
            pointLightIntensity: 2,
            pointLightDistance: 100,
            fogColor: 0x000000,
            fogDensity: 0.001,
            shadowMapSize: 2048,
            antialias: true,
            
            // Audio (we'll use Web Audio API)
            audioEnabled: true
        };

// ============================================
// GAME STATE
// ============================================
        let gameState = {
            current: 'menu', // menu, playing, gameover, levelup
            score: 0,
            level: 1,
            xp: 0,
            xpMax: CONFIG.xpBase,
            wave: 0,
            waveTime: 0,
            waveMaxTime: CONFIG.waveBaseTime,
            enemiesKilled: 0,
            timeAlive: 0,
            upgrades: {
                damage: 1,
                attackSpeed: 1,
                health: CONFIG.playerHealth,
                healthRegen: 0,
                speed: CONFIG.playerSpeed,
                range: 1,
                pierce: 0,
                aoe: 1,
                crit: 0,
                lifesteal: 0,
                cooldown: 1,
                xpGain: 1
            },
            selectedUpgrades: [],
            bossActive: false,
            bossType: null
        };

        // Screen shake
        let screenShake = { intensity: 0, duration: 0 };

        // ============================================
        // THREE.JS SETUP
        // ============================================
        let scene, camera, renderer, world, light, ambientLight, directionalLight;
        let player, enemies = [], projectiles = [], particles = [], pickups = [];
        let islands = [], crystals = [], plants = [];
        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let clock = new THREE.Clock();
        let deltaTime = 0;
        let lastTime = 0;

        // Input state
        let keys = { w: false, a: false, s: false, d: false };
        let mouseDown = false;
        let mousePosition = new THREE.Vector2();

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 30, 40);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('game-canvas'),
                antialias: CONFIG.antialias,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.shadowMap.width = CONFIG.shadowMapSize;
            renderer.shadowMap.height = CONFIG.shadowMapSize;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.5;

            // Lights
            ambientLight = new THREE.AmbientLight(0x404040, CONFIG.ambientLightIntensity);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xffffff, CONFIG.directionalLightIntensity);
            directionalLight.position.set(100, 200, 100);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = CONFIG.shadowMapSize;
            directionalLight.shadow.mapSize.height = CONFIG.shadowMapSize;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 500;
            directionalLight.shadow.camera.left = -200;
            directionalLight.shadow.camera.right = 200;
            directionalLight.shadow.camera.top = 200;
            directionalLight.shadow.camera.bottom = -200;
            scene.add(directionalLight);

            // Add point lights for crystals
            for (let i = 0; i < 5; i++) {
                const pl = new THREE.PointLight(0x00bcd4, CONFIG.pointLightIntensity, CONFIG.pointLightDistance);
                pl.castShadow = true;
                scene.add(pl);
            }

            // Create world
            createWorld();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);

            // Hide start menu initially (will show it after loading)
            document.getElementById('start-menu').style.display = 'flex';
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('level-up').classList.add('hidden');

            // Start game loop
            animate();
        }

        function createWorld() {
            // Ground plane (invisible, just for shadows)
            const groundGeometry = new THREE.PlaneGeometry(CONFIG.worldRadius * 2, CONFIG.worldRadius * 2);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Skybox - starfield
            createStarfield();

            // Floating islands
            createIslands();

            // Crystals
            createCrystals();

            // Plants
            createPlants();

            // Create player (but don't add to scene yet)
            player = new Player();
        }

        function createStarfield() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.1,
                transparent: true,
                opacity: 0.8
            });

            const starsVertices = [];
            for (let i = 0; i < 5000; i++) {
                const x = (Math.random() - 0.5) * CONFIG.worldRadius * 4;
                const y = (Math.random() - 0.5) * CONFIG.worldRadius * 4;
                const z = (Math.random() - 0.5) * CONFIG.worldRadius * 4;
                starsVertices.push(x, y, z);
            }

            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }

        function createIslands() {
            const islandGeometry = new THREE.ConeGeometry(1, 1, 8);
            const islandMaterial = new THREE.MeshStandardMaterial({
                color: 0x333333,
                roughness: 0.9,
                metalness: 0.1
            });

            for (let i = 0; i < CONFIG.islandCount; i++) {
                const size = CONFIG.islandSize.min + Math.random() * (CONFIG.islandSize.max - CONFIG.islandSize.min);
                const height = CONFIG.islandHeight.min + Math.random() * (CONFIG.islandHeight.max - CONFIG.islandHeight.min);
                const angle = Math.random() * Math.PI * 2;
                const distance = CONFIG.worldRadius * 0.3 + Math.random() * CONFIG.worldRadius * 0.4;
                
                const island = new THREE.Mesh(islandGeometry, islandMaterial.clone());
                island.scale.set(size, height, size);
                island.position.x = Math.cos(angle) * distance;
                island.position.z = Math.sin(angle) * distance;
                island.position.y = -50 + Math.random() * 20;
                island.castShadow = true;
                island.receiveShadow = true;
                
                // Add some variation to color
                const hue = 0.1 + Math.random() * 0.1;
                const saturation = 0.2 + Math.random() * 0.2;
                const lightness = 0.2 + Math.random() * 0.1;
                island.material.color.setHSL(hue, saturation, lightness);

                // Add a point light to some islands
                if (Math.random() > 0.7) {
                    const light = new THREE.PointLight(0x00bcd4, 0.5, 50);
                    light.position.copy(island.position);
                    light.position.y += height + 5;
                    scene.add(light);
                }

                scene.add(island);
                islands.push(island);
            }
        }

        function createCrystals() {
            const geometry = new THREE.DodecahedronGeometry(1, 0);
            
            for (let i = 0; i < CONFIG.crystalCount; i++) {
                const size = 0.5 + Math.random() * 1.5;
                const angle = Math.random() * Math.PI * 2;
                const distance = CONFIG.worldRadius * 0.2 + Math.random() * CONFIG.worldRadius * 0.5;
                
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(Math.random() * 0.1 + 0.55, 0.8, 0.5),
                    emissive: new THREE.Color().setHSL(Math.random() * 0.1 + 0.55, 0.8, 0.3),
                    emissiveIntensity: 0.5 + Math.random() * 0.5,
                    roughness: 0.2,
                    metalness: 0.8,
                    transparent: true,
                    opacity: 0.9
                });

                const crystal = new THREE.Mesh(geometry, material);
                crystal.scale.set(size, size, size);
                crystal.position.x = Math.cos(angle) * distance;
                crystal.position.z = Math.sin(angle) * distance;
                crystal.position.y = -40 + Math.random() * 60;
                crystal.castShadow = true;
                
                // Add glow effect
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: material.emissive,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.BackSide
                });
                const glow = new THREE.Mesh(geometry, glowMaterial);
                glow.scale.copy(crystal.scale);
                glow.scale.multiplyScalar(1.2);
                glow.position.copy(crystal.position);
                crystal.add(glow);

                scene.add(crystal);
                crystals.push(crystal);

                // Add point light
                const light = new THREE.PointLight(material.emissive, 0.5 + Math.random() * 0.5, 30);
                light.position.copy(crystal.position);
                scene.add(light);
            }
        }

        function createPlants() {
            const geometry = new THREE.ConeGeometry(0.5, 2, 6);
            
            for (let i = 0; i < CONFIG.plantCount; i++) {
                const size = 0.3 + Math.random() * 0.7;
                const angle = Math.random() * Math.PI * 2;
                const distance = CONFIG.worldRadius * 0.1 + Math.random() * CONFIG.worldRadius * 0.6;
                
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.2 + Math.random() * 0.1, 0.8, 0.4),
                    emissive: new THREE.Color().setHSL(0.2 + Math.random() * 0.1, 0.8, 0.2),
                    emissiveIntensity: 0.2,
                    roughness: 0.7,
                    metalness: 0.1
                });

                const plant = new THREE.Mesh(geometry, material);
                plant.scale.set(size, size * 2, size);
                plant.position.x = Math.cos(angle) * distance;
                plant.position.z = Math.sin(angle) * distance;
                plant.position.y = -45 + Math.random() * 10;
                plant.castShadow = true;
                
                scene.add(plant);
                plants.push(plant);
            }
        }

        // ============================================
        // PLAYER CLASS
        // ============================================
        class Player {
            constructor() {
                this.health = gameState.upgrades.health;
                this.maxHealth = gameState.upgrades.health;
                this.speed = gameState.upgrades.speed;
                this.position = new THREE.Vector3(0, 0, 0);
                this.velocity = new THREE.Vector3();
                this.rotation = 0;
                this.pitch = 0;
                this.weapons = [];
                this.selectedWeapon = 0;
                this.cooldowns = [0, 0, 0, 0];
                this.isCharging = false;
                this.chargeTime = 0;
                this.mesh = null;
                this.model = null;
                this.healthRegenTimer = 0;
                
                this.createMesh();
                this.createWeapons();
            }

            createMesh() {
                // Create player model - a glowing crystal guardian
                const bodyGeometry = new THREE.IcosahedronGeometry(1.5, 0);
                const bodyMaterial = new THREE.MeshStandardMaterial({
                    color: 0x00bcd4,
                    emissive: 0x00bcd4,
                    emissiveIntensity: 1,
                    roughness: 0.2,
                    metalness: 0.95,
                    transparent: true,
                    opacity: 0.95
                });
                
                this.model = new THREE.Mesh(bodyGeometry, bodyMaterial);
                this.model.scale.set(CONFIG.playerModelScale, CONFIG.playerModelScale, CONFIG.playerModelScale);
                this.model.castShadow = true;
                this.model.receiveShadow = true;
                
                // Add inner core
                const coreGeometry = new THREE.DodecahedronGeometry(1, 0);
                const coreMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0xffffff,
                    emissiveIntensity: 2,
                    roughness: 0.1,
                    metalness: 1,
                    transparent: true,
                    opacity: 0.9
                });
                const core = new THREE.Mesh(coreGeometry, coreMaterial);
                this.model.add(core);
                
                // Add glow effect
                const glowGeometry = new THREE.IcosahedronGeometry(1.9, 0);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00bcd4,
                    transparent: true,
                    opacity: 0.25,
                    side: THREE.BackSide
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                this.model.add(glow);

                // Add point light
                this.light = new THREE.PointLight(0x00bcd4, 2, 30);
                this.model.add(this.light);

                // Add aura ring
                const ringGeometry = new THREE.TorusGeometry(2, 0.15, 8, 32);
                const ringMaterial = new THREE.MeshStandardMaterial({
                    color: 0x0097a7,
                    emissive: 0x0097a7,
                    emissiveIntensity: 0.8,
                    roughness: 0.3,
                    metalness: 0.8,
                    transparent: true,
                    opacity: 0.7
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.rotation.x = Math.PI / 2;
                this.model.add(ring);
                
                // Store ring for animation
                this.auraRing = ring;

                // Add wings/ornaments
                for (let i = 0; i < 4; i++) {
                    const wingGeometry = new THREE.ConeGeometry(0.3, 1.5, 4);
                    const wingMaterial = new THREE.MeshStandardMaterial({
                        color: 0x0097a7,
                        emissive: 0x0097a7,
                        emissiveIntensity: 0.6,
                        roughness: 0.3,
                        metalness: 0.85
                    });
                    const wing = new THREE.Mesh(wingGeometry, wingMaterial);
                    wing.position.y = 0.5;
                    wing.rotation.x = Math.PI / 4;
                    wing.rotation.z = (i % 2 === 0 ? 1 : -1) * Math.PI / 4 + i * Math.PI / 2;
                    this.model.add(wing);
                }

                this.mesh = new THREE.Group();
                this.mesh.add(this.model);
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);
            }

            createWeapons() {
                this.weapons = [];
                CONFIG.weapons.forEach((weaponConfig, index) => {
                    this.weapons.push({
                        ...JSON.parse(JSON.stringify(weaponConfig)),
                        cooldown: weaponConfig.cooldown * gameState.upgrades.cooldown,
                        damage: weaponConfig.damage * gameState.upgrades.damage,
                        range: weaponConfig.range * gameState.upgrades.range
                    });
                });
            }

            update() {
                if (gameState.current !== 'playing') return;

                // Health regeneration
                this.healthRegenTimer += deltaTime;
                if (this.healthRegenTimer >= 1 && gameState.upgrades.healthRegen > 0) {
                    this.healthRegenTimer = 0;
                    this.heal(gameState.upgrades.healthRegen * deltaTime * CONFIG.targetFPS);
                }

                // Movement
                this.velocity.set(0, 0, 0);
                
                if (keys.w) this.velocity.z -= 1;
                if (keys.s) this.velocity.z += 1;
                if (keys.a) this.velocity.x -= 1;
                if (keys.d) this.velocity.x += 1;

                if (this.velocity.length() > 0) {
                    this.velocity.normalize();
                    this.velocity.multiplyScalar(this.speed * deltaTime * CONFIG.targetFPS);
                    this.position.add(this.velocity);
                    
                    // Clamp position to world bounds
                    const maxDist = CONFIG.worldRadius * 0.8;
                    if (this.position.length() > maxDist) {
                        this.position.normalize();
                        this.position.multiplyScalar(maxDist);
                    }
                    
                    // Update rotation based on movement direction
                    this.rotation = Math.atan2(this.velocity.x, this.velocity.z);
                }

                // Update mesh position and rotation
                this.mesh.position.copy(this.position);
                this.mesh.rotation.y = this.rotation;
                
                // Animate aura ring
                if (this.auraRing) {
                    this.auraRing.rotation.z += deltaTime * 2;
                    this.auraRing.material.emissiveIntensity = 0.6 + Math.sin(Date.now() * 0.005) * 0.2;
                }
                
                // Animate core
                if (this.model && this.model.children[1]) {
                    this.model.children[1].rotation.y += deltaTime * 0.5;
                    this.model.children[1].material.emissiveIntensity = 1.5 + Math.sin(Date.now() * 0.003) * 0.5;
                }
                
                // Update weapons
                this.updateWeapons();
            }

            updateWeapons() {
                // Update cooldowns
                for (let i = 0; i < this.cooldowns.length; i++) {
                    if (this.cooldowns[i] > 0) {
                        this.cooldowns[i] -= deltaTime;
                        if (this.cooldowns[i] < 0) this.cooldowns[i] = 0;
                    }
                }

                // Auto-attack for weapon 0 (Radiant Beam)
                if (this.weapons[0].auto && mouseDown && this.cooldowns[0] <= 0) {
                    this.attack(0);
                }

                // Handle charging for weapon 1 (Photon Burst)
                if (this.isCharging && this.selectedWeapon === 1) {
                    this.chargeTime += deltaTime;
                    const maxCharge = this.weapons[1].chargeTime;
                    if (this.chargeTime >= maxCharge) {
                        this.chargeTime = maxCharge;
                        // Auto-release at max charge
                        this.attack(1);
                        this.isCharging = false;
                    }
                    
                    // Visual feedback for charging
                    if (this.model && this.model.children[0]) {
                        this.model.children[0].material.emissiveIntensity = 1 + (this.chargeTime / maxCharge) * 2;
                    }
                } else {
                    // Reset emissive intensity
                    if (this.model && this.model.children[0]) {
                        this.model.children[0].material.emissiveIntensity = 1;
                    }
                }
            }

            attack(weaponIndex = this.selectedWeapon) {
                const weapon = this.weapons[weaponIndex];
                
                if (this.cooldowns[weaponIndex] > 0) return;
                if (weaponIndex === 1 && this.isCharging && this.chargeTime < weapon.chargeTime) return;

                // Apply cooldown
                this.cooldowns[weaponIndex] = weapon.cooldown * (weaponIndex === 1 && this.isCharging ? 0.5 : 1) * gameState.upgrades.cooldown;
                
                if (weaponIndex === 1) {
                    // Photon Burst - charged shot
                    const damageMultiplier = 1 + (this.chargeTime / weapon.chargeTime) * 2;
                    const projectileCount = 1 + Math.floor(this.chargeTime / weapon.chargeTime * 2);
                    
                    for (let i = 0; i < projectileCount; i++) {
                        const spread = (i - (projectileCount - 1) / 2) * 0.1;
                        this.fireProjectile(weaponIndex, damageMultiplier, spread);
                    }
                    
                    this.isCharging = false;
                    this.chargeTime = 0;
                } else if (weaponIndex === 2) {
                    // Nova Pulse - AoE around player
                    this.createNovaPulse();
                } else if (weaponIndex === 3) {
                    // Celestial Strike - melee dash
                    this.createCelestialStrike();
                } else {
                    // Default projectile
                    this.fireProjectile(weaponIndex);
                }

                // Play attack sound
                playSound('attack', 0.3);
            }

            fireProjectile(weaponIndex, damageMultiplier = 1, spread = 0) {
                const weapon = this.weapons[weaponIndex];
                const damage = weapon.damage * gameState.upgrades.damage * damageMultiplier;
                const range = weapon.range * gameState.upgrades.range;
                const pierce = weapon.pierce + gameState.upgrades.pierce;
                const width = weapon.width;
                const color = weapon.color;

                // Calculate direction to mouse
                const direction = new THREE.Vector3(mousePosition.x, mousePosition.y, mousePosition.z);
                direction.sub(this.position);
                direction.normalize();
                
                // Apply spread
                if (spread !== 0) {
                    const spreadVector = new THREE.Vector3(
                        (Math.random() - 0.5) * spread,
                        (Math.random() - 0.5) * spread,
                        (Math.random() - 0.5) * spread
                    );
                    direction.add(spreadVector).normalize();
                }

                // Create projectile
                const projectile = new Projectile({
                    position: this.position.clone(),
                    direction: direction,
                    speed: range * 2, // Speed is range per second
                    damage: damage,
                    pierce: pierce,
                    color: color,
                    width: width,
                    range: range,
                    owner: 'player',
                    weaponIndex: weaponIndex
                });
                
                projectiles.push(projectile);
                scene.add(projectile.mesh);
            }

            createNovaPulse() {
                const weapon = this.weapons[2];
                const damage = weapon.damage * gameState.upgrades.damage * gameState.upgrades.aoe;
                const radius = weapon.radius * gameState.upgrades.aoe;
                const color = weapon.color;

                // Create explosion effect
                createExplosionEffect(this.position, radius * 1.8, color, 0.7);
                
                // Create shockwave ring
                createShockwaveRing(this.position, radius * 2, color, 0.7);

                // Damage enemies in radius
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    const distance = enemy.position.distanceTo(this.position);
                    
                    if (distance <= radius) {
                        const damageDealt = applyDamage(enemy, damage * (1 - distance / radius));
                        showDamageNumber(enemy.position, damageDealt, color);
                    }
                }

                // Screen shake
                triggerScreenShake(0.5, 0.5);

                // Play sound
                playSound('explosion', 0.6);
            }

            createCelestialStrike() {
                const weapon = this.weapons[3];
                const damage = weapon.damage * gameState.upgrades.damage;
                const range = weapon.range * gameState.upgrades.range;
                const color = weapon.color;

                // Calculate direction to mouse
                const direction = new THREE.Vector3(mousePosition.x, 0, mousePosition.z);
                direction.sub(this.position);
                direction.normalize();

                // Create dash effect
                const dashDistance = range;
                const dashTarget = this.position.clone().add(direction.clone().multiplyScalar(dashDistance));
                
                // Create trail particles
                for (let i = 0; i < 20; i++) {
                    const t = i / 20;
                    const pos = this.position.clone().lerp(dashTarget, t);
                    createParticle(pos, color, 0.5 + Math.random() * 0.5, 0.5);
                }

                // Damage enemies along path
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    const distance = enemy.position.distanceTo(this.position);
                    
                    if (distance <= range) {
                        const damageDealt = applyDamage(enemy, damage);
                        showDamageNumber(enemy.position, damageDealt, color);
                    }
                }

                // Teleport player
                this.position.copy(dashTarget);
                this.mesh.position.copy(this.position);

                // Play sound
                playSound('dash', 0.4);
            }

            takeDamage(amount) {
                this.health -= amount;
                updateHealthUI();
                
                if (this.health <= 0) {
                    this.health = 0;
                    gameOver();
                }
                
                // Visual feedback
                this.model.material.emissiveIntensity = 2;
                setTimeout(() => {
                    this.model.material.emissiveIntensity = 0.8;
                }, 200);

                // Play sound
                playSound('hurt', 0.5);
            }

            heal(amount) {
                this.health = Math.min(this.health + amount, this.maxHealth);
                updateHealthUI();
            }

            switchWeapon(index) {
                this.selectedWeapon = Math.max(0, Math.min(index, this.weapons.length - 1));
                updateWeaponSelector();
                
                // Stop charging if switching from photon burst
                if (index !== 1) {
                    this.isCharging = false;
                    this.chargeTime = 0;
                }
            }

            cycleWeapons(direction = 1) {
                const newIndex = (this.selectedWeapon + direction + this.weapons.length) % this.weapons.length;
                this.switchWeapon(newIndex);
            }
        }

        // ============================================
        // PROJECTILE CLASS
        // ============================================
        class Projectile {
            constructor(options) {
                this.position = options.position || new THREE.Vector3();
                this.direction = options.direction || new THREE.Vector3(0, 0, 1);
                this.speed = options.speed || 50;
                this.damage = options.damage || 10;
                this.pierce = options.pierce || 1;
                this.color = options.color || 0xffffff;
                this.width = options.width || 0.2;
                this.range = options.range || 100;
                this.owner = options.owner || 'player';
                this.weaponIndex = options.weaponIndex || 0;
                this.distanceTraveled = 0;
                this.mesh = null;
                this.startPosition = this.position.clone();
                this.lifetime = 0;
                this.maxLifetime = this.range / this.speed;
                
                this.createMesh();
            }

            createMesh() {
                if (this.weaponIndex === 0) {
                    // Radiant Beam - continuous beam
                    const geometry = new THREE.CylinderGeometry(this.width, this.width, 1, 8);
                    const material = new THREE.MeshStandardMaterial({
                        color: this.color,
                        emissive: this.color,
                        emissiveIntensity: 2,
                        transparent: true,
                        opacity: 0.9
                    });
                    this.mesh = new THREE.Mesh(geometry, material);
                    this.mesh.rotation.x = Math.PI / 2;
                    this.mesh.castShadow = false;
                } else if (this.weaponIndex === 1) {
                    // Photon Burst - energy orb
                    const size = this.width * 2 * (1 + (this.damage / 40 - 1) * 0.5); // Scale with damage
                    const geometry = new THREE.SphereGeometry(size, 16, 16);
                    const material = new THREE.MeshStandardMaterial({
                        color: this.color,
                        emissive: this.color,
                        emissiveIntensity: 1.5 + (this.damage / 40 - 1) * 1,
                        transparent: true,
                        opacity: 0.9
                    });
                    this.mesh = new THREE.Mesh(geometry, material);
                    this.mesh.castShadow = true;
                    
                    // Add glow
                    const glowGeometry = new THREE.SphereGeometry(size * 1.25, 16, 16);
                    const glowMaterial = new THREE.MeshBasicMaterial({
                        color: this.color,
                        transparent: true,
                        opacity: 0.3 + (this.damage / 40 - 1) * 0.2,
                        side: THREE.BackSide
                    });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    this.mesh.add(glow);
                } else if (this.weaponIndex === 3) {
                    // Celestial Strike - melee slash effect
                    const geometry = new THREE.BoxGeometry(this.width * 2, this.width * 2, this.range);
                    const material = new THREE.MeshStandardMaterial({
                        color: this.color,
                        emissive: this.color,
                        emissiveIntensity: 3,
                        transparent: true,
                        opacity: 0.7
                    });
                    this.mesh = new THREE.Mesh(geometry, material);
                    this.mesh.castShadow = false;
                } else {
                    // Default projectile
                    const geometry = new THREE.CylinderGeometry(this.width, this.width, 1, 8);
                    const material = new THREE.MeshStandardMaterial({
                        color: this.color,
                        emissive: this.color,
                        emissiveIntensity: 0.8,
                        transparent: true,
                        opacity: 0.8
                    });
                    this.mesh = new THREE.Mesh(geometry, material);
                    this.mesh.rotation.x = Math.PI / 2;
                }

                this.mesh.position.copy(this.position);
            }

            update() {
                if (this.mesh === null) return false;

                this.lifetime += deltaTime;
                
                // Move projectile
                const moveAmount = this.speed * deltaTime;
                this.position.add(this.direction.clone().multiplyScalar(moveAmount));
                this.distanceTraveled += moveAmount;
                this.mesh.position.copy(this.position);

                // For beam weapons, scale the mesh based on distance traveled
                if (this.weaponIndex === 0) {
                    this.mesh.scale.z = this.distanceTraveled;
                    this.mesh.position.copy(this.startPosition);
                    this.mesh.position.add(this.direction.clone().multiplyScalar(this.distanceTraveled * 0.5));
                }

                // Check if out of range or lifetime expired
                if (this.distanceTraveled >= this.range || this.lifetime >= this.maxLifetime) {
                    this.destroy();
                    return false;
                }

                // Check for collisions
                if (this.owner === 'player') {
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        const enemy = enemies[i];
                        const distance = this.position.distanceTo(enemy.position);
                        
                        if (distance <= enemy.radius + this.width) {
                            const damageDealt = applyDamage(enemy, this.damage);
                            showDamageNumber(enemy.position, damageDealt, this.color);
                            
                            this.pierce--;
                            if (this.pierce <= 0) {
                                this.destroy();
                                return false;
                            }
                        }
                    }
                } else {
                    // Enemy projectile
                    const distance = this.position.distanceTo(player.position);
                    if (distance <= 1.5 + this.width) {
                        player.takeDamage(this.damage);
                        this.destroy();
                        return false;
                    }
                }

                // Animate emissive intensity
                if (this.mesh.material) {
                    this.mesh.material.emissiveIntensity = this.mesh.material.emissiveIntensity * (0.9 + Math.sin(Date.now() * 0.01) * 0.1);
                }

                return true;
            }

            destroy() {
                if (this.mesh) {
                    scene.remove(this.mesh);
                    this.mesh = null;
                }
            }
        }

        // ============================================
        // ENEMY CLASS
        // ============================================
        class Enemy {
            constructor(typeIndex, position = null) {
                this.type = CONFIG.enemies[typeIndex];
                this.typeIndex = typeIndex;
                this.health = this.type.health * Math.pow(CONFIG.waveHealthMultiplier, gameState.wave);
                this.maxHealth = this.health;
                this.damage = this.type.damage * Math.pow(CONFIG.waveDamageMultiplier, gameState.wave);
                this.speed = this.type.speed;
                this.radius = this.type.scale * 1.5;
                this.position = position || new THREE.Vector3(
                    (Math.random() - 0.5) * CONFIG.worldRadius * 0.9,
                    0,
                    (Math.random() - 0.5) * CONFIG.worldRadius * 0.9
                );
                this.velocity = new THREE.Vector3();
                this.targetPosition = null;
                this.mesh = null;
                this.attackCooldown = 0;
                this.isAttacking = false;
                this.isDead = false;
                this.spawnTime = Date.now();
                
                this.createMesh();
            }

            createMesh() {
                // Use different geometry based on enemy type
                let geometry;
                if (this.type.isBoss) {
                    geometry = new THREE.IcosahedronGeometry(this.type.scale * 1.2, 0);
                } else if (this.type.ranged) {
                    geometry = new THREE.OctahedronGeometry(this.type.scale, 0);
                } else {
                    geometry = new THREE.DodecahedronGeometry(this.type.scale, 0);
                }
                
                let material;
                if (this.type.isBoss) {
                    // Boss - special material with texture-like appearance
                    material = new THREE.MeshStandardMaterial({
                        color: this.type.color,
                        emissive: this.type.color,
                        emissiveIntensity: 1.5,
                        roughness: 0.2,
                        metalness: 0.9,
                        transparent: true,
                        opacity: 0.95
                    });
                } else if (this.type.ranged) {
                    // Ranged enemy - ethereal appearance
                    material = new THREE.MeshStandardMaterial({
                        color: this.type.color,
                        emissive: this.type.color,
                        emissiveIntensity: 0.8,
                        roughness: 0.4,
                        metalness: 0.6,
                        transparent: true,
                        opacity: 0.85
                    });
                } else {
                    // Melee enemy - solid appearance
                    material = new THREE.MeshStandardMaterial({
                        color: this.type.color,
                        roughness: 0.7,
                        metalness: 0.3
                    });
                }

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                
                // Add glow for boss and ranged enemies
                if (this.type.isBoss || this.type.ranged) {
                    const glowGeometry = new THREE.IcosahedronGeometry(this.type.scale * (this.type.isBoss ? 1.3 : 1.15), 0);
                    const glowMaterial = new THREE.MeshBasicMaterial({
                        color: this.type.color,
                        transparent: true,
                        opacity: 0.2 + (this.type.isBoss ? 0.1 : 0),
                        side: THREE.BackSide
                    });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    this.mesh.add(glow);

                    // Add point light
                    const light = new THREE.PointLight(this.type.color, this.type.isBoss ? 2 : 1, this.type.isBoss ? 50 : 30);
                    this.mesh.add(light);
                }

                // Add eyes/ornaments - different for each type
                const eyeCount = this.type.isBoss ? 4 : (this.type.ranged ? 2 : 3);
                for (let i = 0; i < eyeCount; i++) {
                    const eyeGeometry = new THREE.SphereGeometry(this.type.scale * (this.type.isBoss ? 0.25 : 0.2), 8, 8);
                    const eyeColor = this.type.isBoss ? 0xff00ff : (this.type.ranged ? 0x00ffff : 0xff0000);
                    const eyeMaterial = new THREE.MeshBasicMaterial({
                        color: eyeColor,
                        emissive: eyeColor,
                        emissiveIntensity: 1.5
                    });
                    const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                    const angle = (i / eyeCount) * Math.PI * 2;
                    const radius = this.type.scale * (this.type.isBoss ? 0.7 : 0.6);
                    eye.position.x = Math.cos(angle) * radius;
                    eye.position.y = Math.sin(angle) * radius * (this.type.isBoss ? 0.5 : 1);
                    eye.position.z = this.type.isBoss ? Math.sin(angle * 0.5) * radius * 0.3 : 0;
                    this.mesh.add(eye);
                }

                // Add wings for boss
                if (this.type.isBoss) {
                    for (let i = 0; i < 2; i++) {
                        const wingGeometry = new THREE.ConeGeometry(this.type.scale * 0.8, this.type.scale * 1.5, 6);
                        const wingMaterial = new THREE.MeshStandardMaterial({
                            color: this.type.color,
                            emissive: this.type.color,
                            emissiveIntensity: 0.5,
                            roughness: 0.4,
                            metalness: 0.7
                        });
                        const wing = new THREE.Mesh(wingGeometry, wingMaterial);
                        wing.position.y = this.type.scale * 0.5;
                        wing.rotation.x = Math.PI / 2;
                        wing.rotation.z = i === 0 ? Math.PI / 4 : -Math.PI / 4;
                        this.mesh.add(wing);
                    }
                }

                scene.add(this.mesh);
            }

            update() {
                if (this.isDead) return false;

                // Update cooldowns
                if (this.attackCooldown > 0) {
                    this.attackCooldown -= deltaTime;
                }

                // Movement
                if (this.type.ranged) {
                    // Ranged enemies keep distance
                    const distanceToPlayer = this.position.distanceTo(player.position);
                    
                    if (distanceToPlayer > this.type.attackRange) {
                        // Move towards player
                        this.velocity = player.position.clone().sub(this.position).normalize();
                        this.velocity.multiplyScalar(this.speed * deltaTime * CONFIG.targetFPS);
                        this.position.add(this.velocity);
                    } else if (distanceToPlayer < this.type.attackRange * 0.7) {
                        // Move away from player
                        this.velocity = this.position.clone().sub(player.position).normalize();
                        this.velocity.multiplyScalar(this.speed * deltaTime * CONFIG.targetFPS);
                        this.position.add(this.velocity);
                    } else {
                        this.velocity.set(0, 0, 0);
                    }

                    // Attack
                    if (distanceToPlayer <= this.type.attackRange && this.attackCooldown <= 0) {
                        this.attack();
                        this.attackCooldown = this.type.attackCooldown;
                    }
                } else {
                    // Melee enemies chase player
                    this.velocity = player.position.clone().sub(this.position).normalize();
                    this.velocity.multiplyScalar(this.speed * deltaTime * CONFIG.targetFPS);
                    this.position.add(this.velocity);

                    // Attack
                    const distanceToPlayer = this.position.distanceTo(player.position);
                    if (distanceToPlayer <= this.radius + 1.5 && this.attackCooldown <= 0) {
                        player.takeDamage(this.damage);
                        this.attackCooldown = 1;
                        
                        // Visual feedback
                        this.mesh.material.emissiveIntensity = 2;
                        setTimeout(() => {
                            if (this.mesh) {
                                this.mesh.material.emissiveIntensity = this.type.isBoss ? 1 : (this.type.ranged ? 0.5 : 0);
                            }
                        }, 200);
                    }
                }

                // Clamp position to world bounds
                const maxDist = CONFIG.worldRadius * 0.8;
                if (this.position.length() > maxDist) {
                    this.position.normalize();
                    this.position.multiplyScalar(maxDist);
                }

                // Update mesh
                this.mesh.position.copy(this.position);
                this.mesh.lookAt(player.position);

                // Bob up and down for flying enemies
                if (this.type.ranged || this.type.isBoss) {
                    this.mesh.position.y += Math.sin(Date.now() * 0.001 + this.position.x * 0.1) * 0.1;
                }

                return true;
            }

            attack() {
                if (this.type.ranged) {
                    // Fire projectile
                    const direction = player.position.clone().sub(this.position).normalize();
                    
                    const projectile = new Projectile({
                        position: this.position.clone(),
                        direction: direction,
                        speed: 30,
                        damage: this.damage,
                        pierce: 1,
                        color: this.type.color,
                        width: 0.4,
                        range: this.type.attackRange,
                        owner: 'enemy',
                        weaponIndex: 0
                    });
                    
                    projectiles.push(projectile);
                    scene.add(projectile.mesh);
                    
                    // Play sound
                    playSound('enemyAttack', 0.3);
                }
            }

            takeDamage(amount) {
                const crit = Math.random() < gameState.upgrades.crit;
                const damage = crit ? amount * 2 : amount;
                
                this.health -= damage;
                
                // Visual feedback
                this.mesh.material.emissiveIntensity = 3;
                
                // Create hit particles
                for (let i = 0; i < 5; i++) {
                    const offset = new THREE.Vector3(
                        (Math.random() - 0.5) * this.radius,
                        (Math.random() - 0.5) * this.radius,
                        (Math.random() - 0.5) * this.radius
                    );
                    createParticle(this.position.clone().add(offset), 0xff0000, 0.2, 0.3);
                }
                
                setTimeout(() => {
                    if (this.mesh) {
                        this.mesh.material.emissiveIntensity = this.type.isBoss ? 1.5 : (this.type.ranged ? 0.8 : 0);
                    }
                }, 100);

                if (this.health <= 0) {
                    this.die();
                }

                return crit ? Math.round(damage) + '!' : Math.round(damage);
            }

            die() {
                this.isDead = true;
                
                // Add XP
                const xpGain = this.type.xp * gameState.upgrades.xpGain * (this.type.isBoss ? 5 : 1);
                addXP(xpGain);
                
                // Update score
                gameState.score += Math.round(this.type.xp * 10 * (this.type.isBoss ? 5 : 1));
                updateScoreUI();
                
                // Create death effect
                const explosionRadius = this.radius * 2 * (this.type.isBoss ? 2 : 1);
                createExplosionEffect(this.position, explosionRadius, this.type.color, this.type.isBoss ? 1.2 : 0.8);
                
                // Screen shake based on enemy size
                if (this.type.isBoss) {
                    triggerScreenShake(2, 1);
                } else if (this.type.scale > 0.7) {
                    triggerScreenShake(0.8, 0.5);
                } else {
                    triggerScreenShake(0.3, 0.3);
                }
                
                // Drop pickup
                if (Math.random() < 0.2 && !this.type.isBoss) {
                    createPickup(this.position, Math.random() < 0.5 ? 'health' : 'xp');
                } else if (this.type.isBoss) {
                    createPickup(this.position, 'xp', 500);
                    createPickup(this.position.clone().add(new THREE.Vector3(3, 0, 0)), 'health', 100);
                }
                
                // Remove from scene
                scene.remove(this.mesh);
                this.mesh = null;
                
                // Play sound
                playSound('enemyDeath', this.type.isBoss ? 0.8 : 0.4);
                
                // Check if boss
                if (this.type.isBoss) {
                    gameState.bossActive = false;
                    document.getElementById('boss-name').style.display = 'none';
                    document.getElementById('boss-health').style.display = 'none';
                }
            }
        }

        // ============================================
        // WAVE MANAGER
        // ============================================
        let waveEnemies = [];
        let waveSpawnIndex = 0;
        let waveSpawnTimer = 0;

        function startWave(waveNumber) {
            gameState.wave = waveNumber;
            gameState.waveTime = 0;
            gameState.waveMaxTime = CONFIG.waveBaseTime * Math.pow(0.95, waveNumber - 1);
            
            // Calculate enemies for this wave
            waveEnemies = [];
            const enemyCount = Math.floor(5 + waveNumber * 2 * CONFIG.waveEnemyMultiplier);
            
            // Add boss every 5 waves
            if (waveNumber % CONFIG.bossEvery === 0 && waveNumber > 0) {
                const bossType = CONFIG.enemies.findIndex(e => e.isBoss);
                waveEnemies.push({ type: bossType, delay: gameState.waveMaxTime * 0.5 });
                gameState.bossActive = true;
                gameState.bossType = bossType;
            }
            
            // Fill with regular enemies
            for (let i = 0; i < enemyCount; i++) {
                const enemyType = getRandomEnemyType(waveNumber);
                const delay = Math.random() * gameState.waveMaxTime * 0.8;
                waveEnemies.push({ type: enemyType, delay: delay });
            }
            
            // Sort by delay
            waveEnemies.sort((a, b) => a.delay - b.delay);
            waveSpawnIndex = 0;
            waveSpawnTimer = 0;
            
            updateWaveUI();
        }

        function getRandomEnemyType(waveNumber) {
            // Higher waves have higher chance of spawning stronger enemies
            const weights = CONFIG.enemies.map((e, i) => {
                if (e.isBoss) return 0; // Don't spawn bosses randomly
                const waveFactor = Math.pow(1.1, waveNumber);
                return e.spawnWeight * waveFactor;
            });
            
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            let random = Math.random() * totalWeight;
            
            for (let i = 0; i < weights.length; i++) {
                random -= weights[i];
                if (random < 0) return i;
            }
            
            return 0; // Fallback
        }

        function updateWave() {
            if (gameState.current !== 'playing') return;

            gameState.waveTime += deltaTime;
            waveSpawnTimer += deltaTime;
            
            // Spawn enemies
            while (waveSpawnIndex < waveEnemies.length && waveSpawnTimer >= waveEnemies[waveSpawnIndex].delay) {
                const enemyData = waveEnemies[waveSpawnIndex];
                
                // Check if we can spawn more enemies
                if (enemies.length < CONFIG.maxEnemies) {
                    const enemy = new Enemy(enemyData.type);
                    enemies.push(enemy);
                    
                    // If this is a boss, show boss UI
                    if (CONFIG.enemies[enemyData.type].isBoss) {
                        document.getElementById('boss-name').textContent = enemy.type.name.toUpperCase();
                        document.getElementById('boss-name').style.display = 'block';
                        document.getElementById('boss-health').style.display = 'block';
                    }
                }
                
                waveSpawnIndex++;
            }
            
            // Check if wave is complete
            if (waveSpawnIndex >= waveEnemies.length && enemies.length === 0) {
                // Wave complete - start next wave
                startWave(gameState.wave + 1);
            }
            
            updateWaveUI();
        }

        // ============================================
        // PICKUP SYSTEM
        // ============================================
        class Pickup {
            constructor(position, type, value = 25) {
                this.position = position.clone();
                this.type = type; // 'health' or 'xp'
                this.value = value;
                this.radius = 1;
                this.mesh = null;
                this.spawnTime = Date.now();
                this.bobOffset = Math.random() * Math.PI * 2;
                
                this.createMesh();
            }

            createMesh() {
                const geometry = new THREE.DodecahedronGeometry(0.8, 0);
                
                let material, color;
                if (this.type === 'health') {
                    color = 0xff4081;
                } else {
                    color = 0x4caf50;
                }
                
                material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 1,
                    roughness: 0.3,
                    metalness: 0.8,
                    transparent: true,
                    opacity: 0.9
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                this.mesh.castShadow = true;
                
                // Add glow
                const glowGeometry = new THREE.DodecahedronGeometry(1, 0);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.BackSide
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                this.mesh.add(glow);

                // Add point light
                const light = new THREE.PointLight(color, 1, 10);
                this.mesh.add(light);

                scene.add(this.mesh);
            }

            update() {
                if (!this.mesh) return false;

                // Bob up and down
                this.mesh.position.y = this.position.y + Math.sin(Date.now() * 0.003 + this.bobOffset) * 0.3;
                this.mesh.rotation.y += deltaTime * 0.5;

                // Check for collision with player
                const distance = this.position.distanceTo(player.position);
                if (distance <= this.radius + 1.5) {
                    this.collect();
                    return false;
                }

                // Despawn after 30 seconds
                if (Date.now() - this.spawnTime > 30000) {
                    this.destroy();
                    return false;
                }

                return true;
            }

            collect() {
                if (this.type === 'health') {
                    player.heal(this.value);
                    showFloatingText(this.mesh.position, '+HEALTH', 0xff4081);
                } else {
                    addXP(this.value);
                    showFloatingText(this.mesh.position, `+${this.value} XP`, 0x4caf50);
                }
                
                this.destroy();
                playSound('pickup', 0.3);
            }

            destroy() {
                if (this.mesh) {
                    scene.remove(this.mesh);
                    this.mesh = null;
                }
            }
        }

        function createPickup(position, type, value = 25) {
            const pickup = new Pickup(position, type, value);
            pickups.push(pickup);
        }

        // ============================================
        // PARTICLE SYSTEM
        // ============================================
        class Particle {
            constructor(position, color, size, lifetime) {
                this.position = position.clone();
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10
                );
                this.color = color;
                this.size = size;
                this.maxSize = size * (1 + Math.random() * 0.5);
                this.lifetime = lifetime;
                this.age = 0;
                this.mesh = null;
                
                this.createMesh();
            }

            createMesh() {
                const geometry = new THREE.SphereGeometry(0.1, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: this.color,
                    transparent: true,
                    opacity: 1
                });
                
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                this.mesh.scale.set(this.size, this.size, this.size);
                
                scene.add(this.mesh);
            }

            update() {
                if (!this.mesh) return false;

                this.age += deltaTime;
                const progress = this.age / this.lifetime;
                
                // Update position
                this.position.add(this.velocity.clone().multiplyScalar(deltaTime * CONFIG.targetFPS));
                this.mesh.position.copy(this.position);
                
                // Update size
                const scale = this.size * (1 - progress) + this.maxSize * progress * 0.5;
                this.mesh.scale.set(scale, scale, scale);
                
                // Update opacity
                this.mesh.material.opacity = 1 - progress;
                
                if (this.age >= this.lifetime) {
                    this.destroy();
                    return false;
                }

                return true;
            }

            destroy() {
                if (this.mesh) {
                    scene.remove(this.mesh);
                    this.mesh = null;
                }
            }
        }

        function createParticle(position, color, size, lifetime) {
            if (particles.length >= CONFIG.maxParticles) {
                // Remove oldest particle
                const oldest = particles.shift();
                if (oldest && oldest.mesh) {
                    scene.remove(oldest.mesh);
                    oldest.destroy();
                }
            }
            
            const particle = new Particle(position, color, size, lifetime);
            particles.push(particle);
        }

        function createExplosionEffect(position, radius, color, lifetime) {
            const particleCount = Math.min(50, Math.floor(radius * 2));
            
            for (let i = 0; i < particleCount; i++) {
                const pPosition = position.clone();
                pPosition.add(new THREE.Vector3(
                    (Math.random() - 0.5) * radius,
                    (Math.random() - 0.5) * radius * 0.5,
                    (Math.random() - 0.5) * radius
                ));
                
                createParticle(pPosition, color, 0.2 + Math.random() * 0.3, lifetime * (0.5 + Math.random() * 0.5));
            }
            
            // Create shockwave ring
            createShockwaveRing(position, radius * 0.5, color, lifetime * 0.5);
            
            // Play sound
            playSound('explosion', 0.4);
        }

        function createShockwaveRing(position, radius, color, lifetime) {
            const ringParticles = Math.min(40, Math.floor(radius * 2));
            
            for (let j = 0; j < ringParticles; j++) {
                const angle = j / ringParticles * Math.PI * 2;
                const pPosition = position.clone();
                pPosition.x += Math.cos(angle) * radius;
                pPosition.z += Math.sin(angle) * radius;
                pPosition.y += (Math.random() - 0.5) * radius * 0.1;
                
                const particle = new Particle(pPosition, color, 0.15, lifetime);
                particle.velocity = new THREE.Vector3(
                    Math.cos(angle) * (10 + Math.random() * 5),
                    (Math.random() - 0.5) * 3,
                    Math.sin(angle) * (10 + Math.random() * 5)
                );
                particles.push(particle);
                scene.add(particle.mesh);
            }
            
            // Create a visual ring mesh
            const ringGeometry = new THREE.TorusGeometry(radius, 0.1, 8, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.position.copy(position);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);
