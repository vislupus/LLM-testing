            // Animate and remove ring
            const startTime = Date.now();
            const animateRing = () => {
                const elapsed = (Date.now() - startTime) / 1000;
                if (elapsed >= lifetime) {
                    scene.remove(ring);
                    return;
                }
                
                ring.scale.multiplyScalar(1 + deltaTime * 2);
                ring.material.opacity = 0.6 * (1 - elapsed / lifetime);
                requestAnimationFrame(animateRing);
            };
            animateRing();
        }

        // ============================================
        // XP AND LEVELING SYSTEM
        // ============================================
        function addXP(amount) {
            const xpGain = amount * gameState.upgrades.xpGain;
            gameState.xp += xpGain;
            
            updateXPUI();
            
            // Check for level up
            while (gameState.xp >= gameState.xpMax) {
                gameState.xp -= gameState.xpMax;
                gameState.level++;
                gameState.xpMax = Math.floor(CONFIG.xpBase * Math.pow(CONFIG.xpGrowth, gameState.level - 1));
                
                updateLevelUI();
                updateXPUI();
                
                // Show level up screen
                showLevelUp();
            }
        }

        function showLevelUp() {
            gameState.current = 'levelup';
            document.getElementById('level-up').classList.remove('hidden');
            
            // Generate random upgrades
            const upgradeGrid = document.getElementById('upgrade-grid');
            upgradeGrid.innerHTML = '';
            
            const availableUpgrades = [...CONFIG.upgradeCategories];
            const selectedUpgrades = [];
            
            // Ensure we don't get duplicate upgrades
            for (let i = 0; i < CONFIG.upgradesPerLevel; i++) {
                const randomIndex = Math.floor(Math.random() * availableUpgrades.length);
                const upgrade = availableUpgrades[randomIndex];
                selectedUpgrades.push(upgrade);
                availableUpgrades.splice(randomIndex, 1);
            }
            
            // Create upgrade cards
            selectedUpgrades.forEach(upgrade => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <h3>${upgrade.name}</h3>
                    <p>${upgrade.description}</p>
                `;
                card.onclick = () => selectUpgrade(upgrade);
                upgradeGrid.appendChild(card);
            });
        }

        function selectUpgrade(upgrade) {
            // Apply upgrade
            switch (upgrade.type) {
                case 'damage':
                    gameState.upgrades.damage *= upgrade.value;
                    break;
                case 'attackSpeed':
                    gameState.upgrades.attackSpeed *= upgrade.value;
                    break;
                case 'health':
                    gameState.upgrades.health += upgrade.value;
                    player.maxHealth = gameState.upgrades.health;
                    player.health = player.maxHealth;
                    updateHealthUI();
                    break;
                case 'healthRegen':
                    gameState.upgrades.healthRegen += upgrade.value;
                    break;
                case 'speed':
                    gameState.upgrades.speed += upgrade.value;
                    player.speed = gameState.upgrades.speed;
                    break;
                case 'range':
                    gameState.upgrades.range *= upgrade.value;
                    break;
                case 'pierce':
                    gameState.upgrades.pierce += upgrade.value;
                    break;
                case 'aoe':
                    gameState.upgrades.aoe *= upgrade.value;
                    break;
                case 'crit':
                    gameState.upgrades.crit += upgrade.value;
                    break;
                case 'lifesteal':
                    gameState.upgrades.lifesteal += upgrade.value;
                    break;
                case 'cooldown':
                    gameState.upgrades.cooldown *= upgrade.value;
                    break;
                case 'xpGain':
                    gameState.upgrades.xpGain *= upgrade.value;
                    break;
            }
            
            gameState.selectedUpgrades.push(upgrade);
            
            // Update player weapons with new stats
            player.createWeapons();
            
            // Hide level up screen and resume game
            document.getElementById('level-up').classList.add('hidden');
            gameState.current = 'playing';
            
            // Create level up effect
            createExplosionEffect(player.position, 10, 0xffd700, 1);
            playSound('levelUp', 0.5);
        }

        // ============================================
        // DAMAGE AND HEALTH SYSTEM
        // ============================================
        function applyDamage(target, amount) {
            const crit = Math.random() < gameState.upgrades.crit;
            const damage = crit ? amount * 2 : amount;
            
            if (target.takeDamage) {
                return target.takeDamage(damage);
            }
            
            return Math.round(damage);
        }

        function showDamageNumber(position, damage, color = 0xffeb3b) {
            const damageElement = document.createElement('div');
            damageElement.className = 'damage-number';
            
            // Check if damage is a string (contains '!') for crit
            const isCrit = typeof damage === 'string' && damage.includes('!');
            const isHeal = color === 0x4caf50 || color === 0xff4081;
            
            if (isCrit) {
                damageElement.classList.add('crit');
                damageElement.textContent = damage.replace('!', '');
            } else {
                damageElement.textContent = damage.toString();
            }
            
            if (isHeal) {
                damageElement.classList.add('heal');
            }
            
            damageElement.style.color = `#${color.toString(16).padStart(6, '0')}`;
            
            // Convert world position to screen position
            const worldPos = position.clone();
            const screenPos = worldPos.project(camera);
            
            // Convert NDC to screen coordinates
            const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
            
            damageElement.style.left = `${x}px`;
            damageElement.style.top = `${y}px`;
            
            document.getElementById('ui').appendChild(damageElement);
            
            setTimeout(() => {
                damageElement.remove();
            }, 1000);
        }

        function showFloatingText(position, text, color) {
            const textElement = document.createElement('div');
            textElement.className = 'damage-number';
            textElement.textContent = text;
            textElement.style.color = `#${color.toString(16).padStart(6, '0')}`;
            
            // Convert world position to screen position
            const worldPos = position.clone();
            const screenPos = worldPos.project(camera);
            
            // Convert NDC to screen coordinates
            const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
            
            textElement.style.left = `${x}px`;
            textElement.style.top = `${y}px`;
            
            document.getElementById('ui').appendChild(textElement);
            
            setTimeout(() => {
                textElement.remove();
            }, 1000);
        }

        // ============================================
        // UI UPDATES
        // ============================================
        function updateHealthUI() {
            const healthPercent = (player.health / player.maxHealth) * 100;
            document.querySelector('.health-fill').style.width = `${healthPercent}%`;
        }

        function updateXPUI() {
            const xpPercent = (gameState.xp / gameState.xpMax) * 100;
            document.querySelector('.xp-fill').style.width = `${xpPercent}%`;
            document.getElementById('xp-value').textContent = Math.round(gameState.xp);
            document.getElementById('xp-max').textContent = Math.round(gameState.xpMax);
        }

        function updateLevelUI() {
            document.getElementById('level-display').textContent = `LEVEL ${gameState.level}`;
        }

        function updateScoreUI() {
            document.getElementById('score-display').textContent = `SCORE: ${Math.round(gameState.score)}`;
        }

        function updateWaveUI() {
            document.getElementById('wave-display').textContent = `WAVE ${gameState.wave} | ${Math.floor(gameState.waveTime)}s`;
        }

        function updateBossHealthUI() {
            if (gameState.bossActive) {
                const boss = enemies.find(e => e.type.isBoss);
                if (boss) {
                    const healthPercent = (boss.health / boss.maxHealth) * 100;
                    document.getElementById('boss-health').querySelector('.fill').style.width = `${healthPercent}%`;
                    document.getElementById('boss-name').textContent = `${boss.type.name.toUpperCase()} - ${Math.round(healthPercent)}%`;
                } else {
                    // Boss was killed but wave not complete yet
                    gameState.bossActive = false;
                    document.getElementById('boss-name').style.display = 'none';
                    document.getElementById('boss-health').style.display = 'none';
                }
            }
        }

        function updateWeaponSelector() {
            const slots = document.querySelectorAll('.weapon-slot');
            slots.forEach((slot, index) => {
                if (index === player.selectedWeapon) {
                    slot.classList.add('active');
                } else {
                    slot.classList.remove('active');
                }
            });
        }

        function updateAbilityCooldowns() {
            const icons = document.querySelectorAll('.ability-icon');
            icons.forEach((icon, index) => {
                if (player.cooldowns[index] > 0) {
                    icon.classList.add('on-cooldown');
                    const progress = 1 - (player.cooldowns[index] / player.weapons[index].cooldown);
                    icon.style.setProperty('--cooldown-progress', progress);
                } else {
                    icon.classList.remove('on-cooldown');
                }
            });
        }

        // ============================================
        // AUDIO SYSTEM
        // ============================================
        let audioContext = null;
        let audioCache = {};

        function initAudio() {
            if (!CONFIG.audioEnabled) return;
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Create simple synthesizers for sounds
                audioCache = {
                    attack: createRichOscillatorSound([800, 1200], 0.1, ['sine', 'sawtooth']),
                    explosion: createRichOscillatorSound([100, 200, 300], 0.5, ['sawtooth', 'sine', 'square']),
                    dash: createRichOscillatorSound([400, 600], 0.2, ['square', 'triangle']),
                    hurt: createRichOscillatorSound([200, 300, 400], 0.3, ['sine', 'sawtooth']),
                    enemyAttack: createRichOscillatorSound([400, 600], 0.15, ['sawtooth', 'square']),
                    enemyDeath: createRichOscillatorSound([100, 150, 200], 0.4, ['sine', 'sawtooth']),
                    pickup: createRichOscillatorSound([800, 1200, 1600], 0.1, ['sine', 'triangle']),
                    levelUp: createRichOscillatorSound([600, 800, 1000, 1200], 0.5, ['sawtooth', 'sine', 'square'])
                };
                
                // Start background music
                startBackgroundMusic();
            } catch (e) {
                console.log('Audio not supported:', e);
                CONFIG.audioEnabled = false;
            }
        }

        function createRichOscillatorSound(frequencies, duration, types) {
            return function(volume = 0.5) {
                if (!audioContext || !CONFIG.audioEnabled) return;
                
                const gainNode = audioContext.createGain();
                gainNode.connect(audioContext.destination);
                gainNode.gain.value = volume * 0.2;
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
                
                frequencies.forEach((freq, i) => {
                    const oscillator = audioContext.createOscillator();
                    oscillator.connect(gainNode);
                    oscillator.type = types[i % types.length];
                    oscillator.frequency.value = freq;
                    
                    // Add some detuning
                    oscillator.detune.value = (Math.random() - 0.5) * 50;
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration);
                });
            };
        }

        function startBackgroundMusic() {
            if (!audioContext || !CONFIG.audioEnabled) return;
            
            const notes = [130.81, 164.81, 196.00, 220.00, 261.63, 329.63, 392.00, 440.00]; // C major scale
            let currentNote = 0;
            let nextChange = 0;
            
            const gainNode = audioContext.createGain();
            gainNode.connect(audioContext.destination);
            gainNode.gain.value = 0.05;
            
            const playNote = () => {
                if (!audioContext || gameState.current !== 'playing') {
                    // Stop music if game is not playing
                    setTimeout(playNote, 1000);
                    return;
                }
                
                const oscillator = audioContext.createOscillator();
                oscillator.connect(gainNode);
                oscillator.type = 'sine';
                oscillator.frequency.value = notes[currentNote];
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 2);
                
                currentNote = (currentNote + 1) % notes.length;
                nextChange = Date.now() + 200 + Math.random() * 300;
                
                setTimeout(playNote, 200 + Math.random() * 300);
            };
            
            // Start music after a delay
            setTimeout(playNote, 2000);
        }

        function createOscillatorSound(frequency, duration, type) {
            return function(volume = 0.5) {
                if (!audioContext || !CONFIG.audioEnabled) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                
                gainNode.gain.value = volume * 0.3;
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            };
        }

        function playSound(name, volume = 0.5) {
            if (audioCache[name]) {
                audioCache[name](volume);
            }
        }

        // ============================================
        // GAME STATE MANAGEMENT
        // ============================================
        function startGame() {
            // Reset game state
            gameState = {
                current: 'playing',
                score: 0,
                level: 1,
                xp: 0,
                xpMax: CONFIG.xpBase,
                wave: 0,
                waveTime: 0,
                waveMaxTime: CONFIG.waveBaseTime,
                enemiesKilled: 0,
                timeAlive: 0,
                upgrades: {
                    damage: 1,
                    attackSpeed: 1,
                    health: CONFIG.playerHealth,
                    healthRegen: 0,
                    speed: CONFIG.playerSpeed,
                    range: 1,
                    pierce: 0,
                    aoe: 1,
                    crit: 0,
                    lifesteal: 0,
                    cooldown: 1,
                    xpGain: 1
                },
                selectedUpgrades: [],
                bossActive: false,
                bossType: null
            };

            // Clear scene
            while (scene.children.length > 0) {
                scene.remove(scene.children[0]);
            }
            
            // Recreate world
            createWorld();
            
            // Reset arrays
            enemies = [];
            projectiles = [];
            particles = [];
            pickups = [];
            
            // Start first wave
            startWave(1);
            
            // Hide menus
            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('level-up').classList.add('hidden');
            
            // Update UI
            updateScoreUI();
            updateLevelUI();
            updateXPUI();
            updateHealthUI();
            updateWaveUI();
            
            // Reset player
            player.health = gameState.upgrades.health;
            player.maxHealth = gameState.upgrades.health;
            player.position.set(0, 0, 0);
            player.velocity.set(0, 0, 0);
            player.mesh.position.copy(player.position);
            player.createWeapons();
            
            // Reset camera
            camera.position.set(0, 30, 40);
            camera.lookAt(0, 0, 0);
            
            // Focus canvas
            document.getElementById('game-canvas').focus();
        }

        function restartGame() {
            startGame();
        }

        function showStartMenu() {
            gameState.current = 'menu';
            document.getElementById('start-menu').style.display = 'flex';
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('level-up').classList.add('hidden');
        }

        function gameOver() {
            gameState.current = 'gameover';
            
            document.getElementById('final-score').textContent = `Score: ${Math.round(gameState.score)}`;
            document.getElementById('final-wave').textContent = `Waves Survived: ${gameState.wave}`;
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('start-menu').style.display = 'none';
            
            // Play game over sound
            playSound('explosion', 0.8);
        }

        // ============================================
        // INPUT HANDLING
        // ============================================
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Update mouse position in world coordinates at player height
            const ray = new THREE.Raycaster();
            ray.setFromCamera(mouse, camera);
            
            // Create a plane at player's Y position
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -player.position.y);
            const intersect = new THREE.Vector3();
            ray.ray.intersectPlane(plane, intersect);
            
            if (intersect) {
                mousePosition.copy(intersect);
            } else {
                // Fallback: use direction from camera
                const direction = new THREE.Vector3(mouse.x, mouse.y, 1);
                direction.unproject(camera);
                direction.sub(camera.position).normalize();
                const distance = 100;
                mousePosition.copy(camera.position).add(direction.multiplyScalar(distance));
                mousePosition.y = player.position.y;
            }
        }

        function onMouseDown(event) {
            if (gameState.current !== 'playing') return;
            
            mouseDown = true;
            
            // Check if clicking on ability icon
            const abilityIcons = document.querySelectorAll('.ability-icon');
            let clickedAbility = -1;
            
            abilityIcons.forEach((icon, index) => {
                const rect = icon.getBoundingClientRect();
                if (event.clientX >= rect.left && event.clientX <= rect.right &&
                    event.clientY >= rect.top && event.clientY <= rect.bottom) {
                    clickedAbility = index;
                }
            });
            
            if (clickedAbility >= 0) {
                // Use ability
                if (player.cooldowns[clickedAbility] <= 0) {
                    player.attack(clickedAbility);
                }
            } else {
                // Check if clicking on weapon slot
                const weaponSlots = document.querySelectorAll('.weapon-slot');
                weaponSlots.forEach((slot, index) => {
                    const rect = slot.getBoundingClientRect();
                    if (event.clientX >= rect.left && event.clientX <= rect.right &&
                        event.clientY >= rect.top && event.clientY <= rect.bottom) {
                        player.switchWeapon(index);
                    }
                });
            }
            
            // Start charging for photon burst if it's the selected weapon
            if (player.selectedWeapon === 1 && player.cooldowns[1] <= 0) {
                player.isCharging = true;
                player.chargeTime = 0;
            }
        }

        function onMouseUp(event) {
            mouseDown = false;
            
            // Stop charging
            if (player.isCharging && player.selectedWeapon === 1) {
                if (player.chargeTime >= player.weapons[1].chargeTime) {
                    player.attack(1);
                }
                player.isCharging = false;
                player.chargeTime = 0;
            }
        }

        function onKeyDown(event) {
            if (gameState.current !== 'playing') {
                // Only allow certain keys in menu
                if (event.key === 'Escape' && gameState.current === 'levelup') {
                    // Can't escape level up, must choose
                    return;
                }
                return;
            }
            
            switch (event.key.toLowerCase()) {
                case 'w': keys.w = true; break;
                case 'a': keys.a = true; break;
                case 's': keys.s = true; break;
                case 'd': keys.d = true; break;
                case 'q': 
                    // Don't set flag, handle in keyup
                    break;
                case '1': player.switchWeapon(0); break;
                case '2': player.switchWeapon(1); break;
                case '3': player.switchWeapon(2); break;
                case '4': player.switchWeapon(3); break;
                case 'r': 
                    if (player.selectedWeapon === 1 && player.cooldowns[1] <= 0) {
                        player.isCharging = true;
                        player.chargeTime = 0;
                    }
                    break;
                case ' ': 
                    // Space bar for Nova Pulse
                    if (player.cooldowns[2] <= 0) {
                        player.attack(2);
                    }
                    break;
                case 'escape':
                    // Pause game (not implemented in this version)
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.key.toLowerCase()) {
                case 'w': keys.w = false; break;
                case 'a': keys.a = false; break;
                case 's': keys.s = false; break;
                case 'd': keys.d = false; break;
                case 'r':
                    if (player.isCharging && player.selectedWeapon === 1) {
                        player.isCharging = false;
                        player.chargeTime = 0;
                    }
                    break;
            }
            
            // Weapon cycling with Q - cycle on keyup
            if (event.key.toLowerCase() === 'q' && gameState.current === 'playing') {
                player.cycleWeapons();
            }
        }

        // ============================================
        // GAME LOOP
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            
            deltaTime = clock.getDelta();
            
            // Limit deltaTime to prevent physics issues
            deltaTime = Math.min(deltaTime, 1 / 30);

            if (gameState.current === 'playing') {
                // Update game objects
                player.update();
                
                // Update enemies
                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (!enemies[i].update()) {
                        enemies.splice(i, 1);
                    }
                }
                
                // Update projectiles
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    if (!projectiles[i].update()) {
                        projectiles.splice(i, 1);
                    }
                }
                
                // Update particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    if (!particles[i].update()) {
                        particles.splice(i, 1);
                    }
                }
                
                // Update pickups
                for (let i = pickups.length - 1; i >= 0; i--) {
                    if (!pickups[i].update()) {
                        pickups.splice(i, 1);
                    }
                }
                
                // Update wave
                updateWave();
                
                // Update time
                gameState.timeAlive += deltaTime;
                
                // Update UI
                updateWaveUI();
                updateBossHealthUI();
                updateAbilityCooldowns();
                
                // Camera follow
                updateCamera();
            }
            
            // Render
            renderer.render(scene, camera);
        }

        function updateCamera() {
            // Dynamic camera offset based on player movement
            const baseOffset = new THREE.Vector3(0, 30, 40);
            
            // Add slight offset based on mouse position for better visibility
            const mouseOffset = new THREE.Vector3(
                mouse.x * 5,
                0,
                mouse.y * 5
            );
            
            const targetCameraPosition = player.position.clone().add(baseOffset).add(mouseOffset);
            
            // Apply screen shake
            if (screenShake.intensity > 0) {
                const shakeX = (Math.random() - 0.5) * screenShake.intensity * 2;
                const shakeY = (Math.random() - 0.5) * screenShake.intensity * 2;
                const shakeZ = (Math.random() - 0.5) * screenShake.intensity * 2;
                targetCameraPosition.add(new THREE.Vector3(shakeX, shakeY, shakeZ));
                
                // Update shake state
                screenShake.duration -= deltaTime;
                if (screenShake.duration <= 0) {
                    screenShake.intensity = 0;
                    screenShake.duration = 0;
                } else {
                    screenShake.intensity *= 0.9;
                }
            }
            
            // Smooth camera movement with velocity
            const cameraVelocity = targetCameraPosition.clone().sub(camera.position);
            camera.position.add(cameraVelocity.multiplyScalar(0.1));
            
            // Look at player with slight offset
            const lookAtTarget = player.position.clone();
            lookAtTarget.y += 5;
            camera.lookAt(lookAtTarget);
        }

        function triggerScreenShake(intensity = 0.5, duration = 0.5) {
            if (intensity > screenShake.intensity) {
                screenShake.intensity = intensity;
                screenShake.duration = duration;
            }
        }

        // ============================================
        // START THE GAME
        // ============================================
        init();
        initAudio();
        
        // Show start menu
        document.getElementById('start-menu').style.display = 'flex';
        
        // Focus canvas for keyboard input
        document.getElementById('game-canvas').addEventListener('click', function() {
            this.focus();
        });
        
        // Add touch controls for mobile (basic)
        document.addEventListener('touchstart', function(e) {
            if (gameState.current !== 'playing') return;
            mouseDown = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchend', function(e) {
            mouseDown = false;
            e.preventDefault();
        });
    </script>
</body>
</html>
