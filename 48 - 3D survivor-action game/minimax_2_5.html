<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Survivors</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #gameCanvas { display: block; }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #healthBar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 24px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff3366;
            border-radius: 12px;
            overflow: hidden;
        }
        #healthFill {
            height: 100%;
            background: linear-gradient(90deg, #ff3366, #ff6b9d);
            width: 100%;
            transition: width 0.2s;
            box-shadow: 0 0 20px #ff3366;
        }
        
        #xpBar {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 12px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #00ffaa;
            border-radius: 6px;
            overflow: hidden;
        }
        #xpFill {
            height: 100%;
            background: linear-gradient(90deg, #00ffaa, #66ffcc);
            width: 0%;
            box-shadow: 0 0 15px #00ffaa;
        }
        
        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #stats div { margin-bottom: 8px; }
        #levelDisplay { color: #ffcc00; font-weight: bold; }
        #scoreDisplay { color: #00ffaa; }
        #waveDisplay { color: #ff6b9d; }
        #timerDisplay { color: #66ccff; }
        
        #upgradePanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: auto;
            text-align: center;
        }
        #upgradePanel.active { display: block; }
        #upgradePanel h2 {
            color: #ffcc00;
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 0 0 30px #ffcc00;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .upgrade-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .upgrade-card {
            width: 200px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(30,30,50,0.95), rgba(20,20,40,0.95));
            border: 2px solid #444;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        .upgrade-card:hover {
            transform: translateY(-10px);
            border-color: #ffcc00;
            box-shadow: 0 10px 40px rgba(255,204,0,0.3);
        }
        .upgrade-card h3 {
            color: #00ffaa;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .upgrade-card p {
            font-size: 13px;
            color: #aaa;
            line-height: 1.4;
        }
        .upgrade-card .rarity {
            font-size: 11px;
            margin-top: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .rarity.common { background: #666; }
        .rarity.rare { background: #0066ff; }
        .rarity.legendary { background: #ffcc00; color: #000; }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
            pointer-events: auto;
        }
        #gameOver.active { display: block; }
        #gameOver h1 {
            color: #ff3366;
            font-size: 64px;
            text-shadow: 0 0 50px #ff3366;
            margin-bottom: 20px;
        }
        #gameOver .stats {
            color: white;
            font-size: 24px;
            margin-bottom: 30px;
        }
        #restartBtn {
            padding: 15px 50px;
            font-size: 20px;
            background: linear-gradient(135deg, #00ffaa, #00cc88);
            border: none;
            border-radius: 30px;
            color: #000;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        #restartBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #00ffaa;
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 200;
        }
        #startScreen.hidden { display: none; }
        #startScreen h1 {
            font-size: 72px;
            color: #00ffaa;
            text-shadow: 0 0 50px #00ffaa, 0 0 100px #00ffaa;
            margin-bottom: 20px;
            letter-spacing: 8px;
        }
        #startScreen .subtitle {
            color: #ff6b9d;
            font-size: 24px;
            margin-bottom: 50px;
        }
        #startBtn {
            padding: 20px 80px;
            font-size: 24px;
            background: linear-gradient(135deg, #ff3366, #ff6b9d);
            border: none;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            animation: glow 2s infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px #ff3366; }
            50% { box-shadow: 0 0 50px #ff3366, 0 0 80px #ff6b9d; }
        }
        #startBtn:hover {
            transform: scale(1.1);
        }
        #controls {
            position: absolute;
            bottom: 30px;
            color: #666;
            font-size: 14px;
        }
        
        .damage-number {
            position: absolute;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 1s forwards;
            text-shadow: 0 0 10px currentColor;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
        }
        
        #bossWarning {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: #ff3366;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 30px #ff3366;
            display: none;
            animation: bossPulse 0.5s infinite;
        }
        #bossWarning.active { display: block; }
        @keyframes bossPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="stats">
            <div id="levelDisplay">LEVEL 1</div>
            <div id="scoreDisplay">SCORE: 0</div>
            <div id="waveDisplay">WAVE 1</div>
            <div id="timerDisplay">00:00</div>
        </div>
        
        <div id="xpBar"><div id="xpFill"></div></div>
        <div id="healthBar"><div id="healthFill"></div></div>
        
        <div id="bossWarning">⚠ BOSS INCOMING ⚠</div>
        
        <div id="upgradePanel">
            <h2>⚡ LEVEL UP! ⚡</h2>
            <div class="upgrade-cards" id="upgradeCards"></div>
        </div>
        
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <div class="stats" id="finalStats"></div>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
        
        <div id="startScreen">
            <h1>NEON SURVIVORS</h1>
            <div class="subtitle">Survive the Void Horde</div>
            <button id="startBtn">START GAME</button>
            <div id="controls">WASD or Arrow Keys to Move • Auto-Attack Enabled</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== GAME CONFIGURATION ====================
        const CONFIG = {
            PLAYER_SPEED: 0.18,
            PLAYER_MAX_HEALTH: 100,
            BASE_DAMAGE: 10,
            ATTACK_RANGE: 5,
            ATTACK_COOLDOWN: 0.5,
            XP_DROP_SCALE: 1,
            WAVE_DURATION: 30,
            ARENA_SIZE: 80,
            ENEMY_SPAWN_RATE: 2,
            DIFFICULTY_SCALE: 1.15
        };

        // ==================== UPGRADES DATABASE ====================
        const UPGRADES = [
            { id: 'damage', name: 'Power Surge', desc: '+25% Damage', rarity: 'common', apply: (p) => p.damage *= 1.25 },
            { id: 'attackSpeed', name: 'Rapid Fire', desc: '+20% Attack Speed', rarity: 'common', apply: (p) => p.attackCooldown *= 0.8 },
            { id: 'health', name: 'Vitality', desc: '+30 Max HP & Heal', rarity: 'common', apply: (p) => { p.maxHealth += 30; p.health = Math.min(p.health + 30, p.maxHealth); } },
            { id: 'speed', name: 'Swift Feet', desc: '+15% Movement Speed', rarity: 'common', apply: (p) => p.speed *= 1.15 },
            { id: 'range', name: 'Extended Reach', desc: '+30% Attack Range', rarity: 'rare', apply: (p) => p.attackRange *= 1.3 },
            { id: 'multishot', name: 'Multishot', desc: '+1 Projectile', rarity: 'legendary', apply: (p) => p.projectiles += 1 },
            { id: 'crit', name: 'Critical Eye', desc: '+15% Crit Chance', rarity: 'rare', apply: (p) => p.critChance += 0.15 },
            { id: 'lifesteal', name: 'Vampirism', desc: '5% Lifesteal', rarity: 'legendary', apply: (p) => p.lifesteal += 0.05 },
            { id: 'pierce', name: 'Piercing Rounds', desc: '+1 Pierce', rarity: 'rare', apply: (p) => p.pierce += 1 },
            { id: 'regen', name: 'Regeneration', desc: '+1 HP/sec', rarity: 'common', apply: (p) => p.regen += 1 },
            { id: 'area', name: 'Blast Radius', desc: '+25% Area', rarity: 'rare', apply: (p) => p.area *= 1.25 },
            { id: 'velocity', name: 'Velocity', desc: '+30% Projectile Speed', rarity: 'common', apply: (p) => p.projectileSpeed *= 1.3 }
        ];

        // ==================== GAME STATE ====================
        let gameState = {
            running: false,
            paused: false,
            time: 0,
            score: 0,
            wave: 1,
            waveTimer: 0,
            enemiesKilled: 0,
            level: 1,
            xp: 0,
            xpToLevel: 20,
            pendingUpgrades: [],
            showUpgrades: false
        };

        let player = {
            x: 0, y: 0.5, z: 0,
            health: CONFIG.PLAYER_MAX_HEALTH,
            maxHealth: CONFIG.PLAYER_MAX_HEALTH,
            speed: CONFIG.PLAYER_SPEED,
            damage: CONFIG.BASE_DAMAGE,
            attackRange: CONFIG.ATTACK_RANGE,
            attackCooldown: CONFIG.ATTACK_COOLDOWN,
            lastAttack: 0,
            level: 1,
            critChance: 0.1,
            critDamage: 2,
            lifesteal: 0,
            regen: 0,
            projectiles: 1,
            pierce: 1,
            area: 1,
            projectileSpeed: 1
        };

        let keys = {};
        let enemies = [];
        let projectiles = [];
        let particles = [];
        let xpOrbs = [];
        let damageNumbers = [];
        let pickups = [];

        // ==================== THREE.JS SETUP ====================
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a15);
        scene.fog = new THREE.Fog(0x0a0a15, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 25, 20);
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(20, 40, 20);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 100;
        mainLight.shadow.camera.left = -50;
        mainLight.shadow.camera.right = 50;
        mainLight.shadow.camera.top = 50;
        mainLight.shadow.camera.bottom = -50;
        scene.add(mainLight);

        // Colored point lights
        const purpleLight = new THREE.PointLight(0xff00ff, 0.5, 50);
        purpleLight.position.set(-20, 10, -20);
        scene.add(purpleLight);

        const cyanLight = new THREE.PointLight(0x00ffff, 0.5, 50);
        cyanLight.position.set(20, 10, 20);
        scene.add(cyanLight);

        // Ground
        const groundGeom = new THREE.PlaneGeometry(CONFIG.ARENA_SIZE * 2, CONFIG.ARENA_SIZE * 2, 40, 40);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a2e,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid lines on ground
        const gridHelper = new THREE.GridHelper(CONFIG.ARENA_SIZE * 2, 40, 0x00ffaa, 0x1a3a3a);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Arena boundary
        const boundaryGeom = new THREE.RingGeometry(CONFIG.ARENA_SIZE - 1, CONFIG.ARENA_SIZE, 64);
        const boundaryMat = new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        const boundary = new THREE.Mesh(boundaryGeom, boundaryMat);
        boundary.rotation.x = -Math.PI / 2;
        boundary.position.y = 0.1;
        scene.add(boundary);

        // ==================== PLAYER MESH ====================
        const playerGroup = new THREE.Group();
        
        // Body (crystal-like shape)
        const bodyGeom = new THREE.OctahedronGeometry(0.6, 0);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x00ffaa, 
            emissive: 0x00ffaa,
            emissiveIntensity: 0.3,
            roughness: 0.2,
            metalness: 0.8
        });
        const body = new THREE.Mesh(bodyGeom, bodyMat);
        body.position.y = 0.8;
        body.castShadow = true;
        playerGroup.add(body);

        // Core glow
        const coreGeom = new THREE.SphereGeometry(0.25, 16, 16);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const core = new THREE.Mesh(coreGeom, coreMat);
        core.position.y = 0.8;
        playerGroup.add(core);

        // Floating crystals around player
        for (let i = 0; i < 4; i++) {
            const crystalGeom = new THREE.OctahedronGeometry(0.15, 0);
            const crystal = new THREE.Mesh(crystalGeom, bodyMat.clone());
            crystal.position.set(Math.cos(i * Math.PI / 2) * 0.8, 0.6, Math.sin(i * Math.PI / 2) * 0.8);
            crystal.userData.orbitAngle = i * Math.PI / 2;
            playerGroup.add(crystal);
        }

        scene.add(playerGroup);

        // ==================== ENEMY CREATION ====================
        function createEnemy(type = 'basic', level = 1) {
            const enemy = {
                type,
                level,
                health: 20 * level,
                maxHealth: 20 * level,
                speed: 0.04 + level * 0.005,
                damage: 5 + level * 2,
                xpValue: 10 * level,
                size: 1,
                lastAttack: 0,
                attackCooldown: 1.5,
                mesh: null,
                isBoss: type === 'boss'
            };

            let geom, mat;
            
            switch(type) {
                case 'basic':
                    geom = new THREE.DodecahedronGeometry(0.5, 0);
                    mat = new THREE.MeshStandardMaterial({ 
                        color: 0xff3366, 
                        emissive: 0xff3366,
                        emissiveIntensity: 0.2,
                        roughness: 0.5
                    });
                    enemy.health = 15 * level;
                    enemy.xpValue = 8 * level;
                    enemy.speed = 0.05;
                    break;
                    
                case 'fast':
                    geom = new THREE.TetrahedronGeometry(0.4, 0);
                    mat = new THREE.MeshStandardMaterial({ 
                        color: 0xffaa00, 
                        emissive: 0xffaa00,
                        emissiveIntensity: 0.2,
                        roughness: 0.5
                    });
                    enemy.health = 8 * level;
                    enemy.xpValue = 6 * level;
                    enemy.speed = 0.1;
                    enemy.damage = 3 + level;
                    enemy.size = 0.8;
                    break;
                    
                case 'tank':
                    geom = new THREE.IcosahedronGeometry(0.8, 0);
                    mat = new THREE.MeshStandardMaterial({ 
                        color: 0x8844ff, 
                        emissive: 0x8844ff,
                        emissiveIntensity: 0.2,
                        roughness: 0.7
                    });
                    enemy.health = 50 * level;
                    enemy.xpValue = 25 * level;
                    enemy.speed = 0.025;
                    enemy.damage = 10 + level * 3;
                    enemy.size = 1.5;
                    enemy.attackCooldown = 2.5;
                    break;
                    
                case 'shooter':
                    geom = new THREE.OctahedronGeometry(0.5, 0);
                    mat = new THREE.MeshStandardMaterial({ 
                        color: 0x00aaff, 
                        emissive: 0x00aaff,
                        emissiveIntensity: 0.3,
                        roughness: 0.4
                    });
                    enemy.health = 12 * level;
                    enemy.xpValue = 15 * level;
                    enemy.speed = 0.035;
                    enemy.damage = 8 + level * 2;
                    enemy.isRanged = true;
                    break;
                    
                case 'boss':
                    geom = new THREE.DodecahedronGeometry(2, 1);
                    mat = new THREE.MeshStandardMaterial({ 
                        color: 0xff0000, 
                        emissive: 0xff0000,
                        emissiveIntensity: 0.5,
                        roughness: 0.3,
                        metalness: 0.9
                    });
                    enemy.health = 500 + level * 200;
                    enemy.xpValue = 200 * level;
                    enemy.speed = 0.03;
                    enemy.damage = 20 + level * 5;
                    enemy.size = 2.5;
                    enemy.attackCooldown = 2;
                    break;
            }

            enemy.mesh = new THREE.Mesh(geom, mat);
            enemy.mesh.castShadow = true;
            enemy.mesh.scale.setScalar(enemy.size);
            
            // Random spawn position outside camera view
            const angle = Math.random() * Math.PI * 2;
            const dist = 25 + Math.random() * 15;
            enemy.x = Math.cos(angle) * dist;
            enemy.z = Math.sin(angle) * dist;
            enemy.mesh.position.set(enemy.x, enemy.size * 0.6, enemy.z);
            
            scene.add(enemy.mesh);
            enemies.push(enemy);
            
            return enemy;
        }

        // ==================== PROJECTILE CREATION ====================
        function createProjectile(x, y, z, targetX, targetZ, damage, isPlayer = true) {
            const proj = {
                x, y, z,
                targetX, targetZ,
                speed: 0.4 * player.projectileSpeed,
                damage,
                isPlayer,
                life: 3,
                pierce: player.pierce,
                hitEnemies: []
            };

            // Calculate direction
            const dx = targetX - x;
            const dz = targetZ - z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            proj.vx = (dx / dist) * proj.speed;
            proj.vz = (dz / dist) * proj.speed;

            const geom = new THREE.SphereGeometry(0.15, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ 
                color: isPlayer ? 0x00ffaa : 0xff3366 
            });
            proj.mesh = new THREE.Mesh(geom, mat);
            proj.mesh.position.set(x, y, z);
            scene.add(proj.mesh);

            // Trail
            const trailGeom = new THREE.CylinderGeometry(0.05, 0.1, 0.5, 8);
            const trailMat = new THREE.MeshBasicMaterial({ 
                color: isPlayer ? 0x00ffaa : 0xff3366,
                transparent: true,
                opacity: 0.5
            });
            proj.trail = new THREE.Mesh(trailGeom, trailMat);
            scene.add(proj.trail);

            projectiles.push(proj);
            return proj;
        }

        // ==================== PARTICLE EFFECTS ====================
        function createParticle(x, y, z, color, size = 0.2, life = 1) {
            const particle = {
                x, y, z,
                vx: (Math.random() - 0.5) * 0.2,
                vy: Math.random() * 0.2 + 0.1,
                vz: (Math.random() - 0.5) * 0.2,
                life,
                maxLife: life,
                size,
                color
            };

            const geom = new THREE.SphereGeometry(size, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ 
                color: color,
                transparent: true
            });
            particle.mesh = new THREE.Mesh(geom, mat);
            particle.mesh.position.set(x, y, z);
            scene.add(particle.mesh);

            particles.push(particle);
            return particle;
        }

        function createExplosion(x, y, z, color, count = 20) {
            for (let i = 0; i < count; i++) {
                createParticle(x, y, z, color, 0.1 + Math.random() * 0.2, 0.5 + Math.random() * 0.5);
            }
        }

        // ==================== XP ORB ====================
        function createXPOrb(x, z, value) {
            const orb = {
                x, z,
                value,
                life: 30,
                attracted: false
            };

            const geom = new THREE.OctahedronGeometry(0.2, 0);
            const mat = new THREE.MeshBasicMaterial({ 
                color: 0x00ffaa,
                transparent: true,
                opacity: 0.8
            });
            orb.mesh = new THREE.Mesh(geom, mat);
            orb.mesh.position.set(x, 0.5, z);
            scene.add(orb.mesh);

            xpOrbs.push(orb);
            return orb;
        }

        // ==================== DAMAGE NUMBERS ====================
        function showDamageNumber(x, z, damage, isCrit = false) {
            const num = {
                x: x + (Math.random() - 0.5) * 2,
                z: z + (Math.random() - 0.5) * 2,
                damage,
                isCrit,
                life: 1
            };

            const div = document.createElement('div');
            div.className = 'damage-number';
            div.style.color = isCrit ? '#ffcc00' : '#ffffff';
            div.style.fontSize = isCrit ? '32px' : '20px';
            div.textContent = Math.round(damage);
            div.style.left = '50%';
            div.style.top = '50%';
            document.getElementById('ui').appendChild(div);
            
            num.element = div;
            damageNumbers.push(num);
        }

        // ==================== INPUT HANDLING ====================
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') keys['w'] = true;
            if (e.key === 'ArrowDown') keys['s'] = true;
            if (e.key === 'ArrowLeft') keys['a'] = true;
            if (e.key === 'ArrowRight') keys['d'] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') keys['w'] = false;
            if (e.key === 'ArrowDown') keys['s'] = false;
            if (e.key === 'ArrowLeft') keys['a'] = false;
            if (e.key === 'ArrowRight') keys['d'] = false;
        });

        // ==================== GAME LOOP ====================
        let lastTime = 0;
        
        function gameLoop(currentTime) {
            requestAnimationFrame(gameLoop);
            
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (!gameState.running || gameState.paused) {
                renderer.render(scene, camera);
                return;
            }
            
            gameState.time += deltaTime;
            gameState.waveTimer += deltaTime;
            
            // Update timer display
            const mins = Math.floor(gameState.time / 60);
            const secs = Math.floor(gameState.time % 60);
            document.getElementById('timerDisplay').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            // Wave management
            if (gameState.waveTimer >= CONFIG.WAVE_DURATION && !gameState.showUpgrades) {
                gameState.wave++;
                gameState.waveTimer = 0;
                document.getElementById('waveDisplay').textContent = `WAVE ${gameState.wave}`;
                
                // Show boss warning every 5 waves
                if (gameState.wave % 5 === 0) {
                    document.getElementById('bossWarning').classList.add('active');
                    setTimeout(() => document.getElementById('bossWarning').classList.remove('active'), 3000);
                    
                    setTimeout(() => {
                        const boss = createEnemy('boss', gameState.wave);
                    }, 2000);
                }
            }
            
            // Spawn enemies
            if (!gameState.showUpgrades && Math.random() < 0.03 * gameState.wave * CONFIG.DIFFICULTY_SCALE) {
                const types = ['basic', 'basic', 'fast', 'tank', 'shooter'];
                const weights = [0.4, 0.3, 0.15, 0.1, 0.05];
                let r = Math.random();
                let type = 'basic';
                for (let i = 0; i < weights.length; i++) {
                    r -= weights[i];
                    if (r <= 0) {
                        type = types[i];
                        break;
                    }
                }
                createEnemy(type, Math.ceil(gameState.wave / 3));
            }
            
            // Player movement
            let moveX = 0, moveZ = 0;
            if (keys['w'] || keys['arrowup']) moveZ -= 1;
            if (keys['s'] || keys['arrowdown']) moveZ += 1;
            if (keys['a'] || keys['arrowleft']) moveX -= 1;
            if (keys['d'] || keys['arrowright']) moveX += 1;
            
            if (moveX !== 0 || moveZ !== 0) {
                const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
                player.x += (moveX / len) * player.speed;
                player.z += (moveZ / len) * player.speed;
                
                // Boundary
                const dist = Math.sqrt(player.x * player.x + player.z * player.z);
                if (dist > CONFIG.ARENA_SIZE - 2) {
                    player.x *= (CONFIG.ARENA_SIZE - 2) / dist;
                    player.z *= (CONFIG.ARENA_SIZE - 2) / dist;
                }
            }
            
            playerGroup.position.set(player.x, player.y, player.z);
            
            // Rotate floating crystals
            playerGroup.children.forEach((child, i) => {
                if (child.userData.orbitAngle !== undefined) {
                    child.userData.orbitAngle += deltaTime * 2;
                    child.position.x = Math.cos(child.userData.orbitAngle) * 0.8;
                    child.position.z = Math.sin(child.userData.orbitAngle) * 0.8;
                    child.position.y = 0.6 + Math.sin(gameState.time * 3 + i) * 0.1;
                }
            });
            
            // Body rotation
            body.rotation.y += deltaTime;
            body.rotation.x += deltaTime * 0.5;
            
            // Auto-attack
            player.lastAttack += deltaTime;
            if (player.lastAttack >= player.attackCooldown && enemies.length > 0) {
                // Find nearest enemy
                let nearest = null;
                let nearestDist = player.attackRange;
                
                enemies.forEach(enemy => {
                    const dx = enemy.x - player.x;
                    const dz = enemy.z - player.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearest = enemy;
                    }
                });
                
                if (nearest) {
                    player.lastAttack = 0;
                    
                    // Calculate spread for multishot
                    const baseAngle = Math.atan2(nearest.z - player.z, nearest.x - player.x);
                    const spread = 0.15;
                    const startAngle = baseAngle - (player.projectiles - 1) * spread / 2;
                    
                    for (let i = 0; i < player.projectiles; i++) {
                        const angle = startAngle + i * spread;
                        const targetX = player.x + Math.cos(angle) * 10;
                        const targetZ = player.z + Math.sin(angle) * 10;
                        
                        let damage = player.damage;
                        const isCrit = Math.random() < player.critChance;
                        if (isCrit) damage *= player.critDamage;
                        
                        createProjectile(player.x, 1, player.z, targetX, targetZ, damage, true);
                    }
                    
                    // Attack effect
                    createParticle(player.x, 1, player.z, 0x00ffaa, 0.3, 0.2);
                }
            }
            
            // Player regeneration
            if (player.regen > 0) {
                player.health = Math.min(player.health + player.regen * deltaTime, player.maxHealth);
            }
            
            // Update enemies
            enemies.forEach((enemy, index) => {
                const dx = player.x - enemy.x;
                const dz = player.z - enemy.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                if (dist > 1.5) {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.z += (dz / dist) * enemy.speed;
                }
                
                enemy.mesh.position.x = enemy.x;
                enemy.mesh.position.z = enemy.z;
                enemy.mesh.rotation.x += deltaTime * 0.5;
                enemy.mesh.rotation.y += deltaTime * 0.7;
                
                // Enemy attack
                enemy.lastAttack += deltaTime;
                if (enemy.lastAttack >= enemy.attackCooldown && dist < 2) {
                    enemy.lastAttack = 0;
                    
                    if (enemy.isRanged) {
                        createProjectile(enemy.x, 1, enemy.z, player.x, player.z, enemy.damage, false);
                    } else {
                        // Melee attack
                        player.health -= enemy.damage;
                        createExplosion(player.x, 0.5, player.z, 0xff3366, 5);
                        showDamageNumber(player.x, player.z, enemy.damage);
                        
                        if (player.health <= 0) {
                            gameOver();
                        }
                    }
                }
            });
            
            // Update projectiles
            projectiles.forEach((proj, index) => {
                proj.x += proj.vx;
                proj.z += proj.vz;
                proj.life -= deltaTime;
                
                proj.mesh.position.set(proj.x, 1, proj.z);
                proj.trail.position.set(proj.x, 1, proj.z);
                proj.trail.rotation.y = Math.atan2(proj.vz, proj.vx) + Math.PI / 2;
                
                // Collision detection
                if (proj.isPlayer) {
                    enemies.forEach(enemy => {
                        if (proj.hitEnemies.includes(enemy)) return;
                        
                        const dx = enemy.x - proj.x;
                        const dz = enemy.z - proj.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        
                        if (dist < enemy.size * 0.5 + 0.2) {
                            proj.hitEnemies.push(enemy);
                            
                            const isCrit = Math.random() < player.critChance;
                            const damage = proj.damage * (isCrit ? player.critDamage : 1);
                            enemy.health -= damage;
                            
                            showDamageNumber(enemy.x, enemy.z, damage, isCrit);
                            createExplosion(proj.x, 1, proj.z, isCrit ? 0xffcc00 : 0x00ffaa, 5);
                            
                            if (enemy.health <= 0) {
                                killEnemy(enemy);
                            }
                            
                            proj.pierce--;
                            if (proj.pierce <= 0) {
                                proj.life = 0;
                            }
                        }
                    });
                } else {
                    // Enemy projectile hitting player
                    const dx = player.x - proj.x;
                    const dz = player.z - proj.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    
                    if (dist < 1) {
                        player.health -= proj.damage;
                        showDamageNumber(player.x, player.z, proj.damage);
                        createExplosion(proj.x, 1, proj.z, 0xff3366, 5);
                        proj.life = 0;
                        
                        if (player.health <= 0) {
                            gameOver();
                        }
                    }
                }
            });
            
            // Remove dead projectiles
            projectiles = projectiles.filter(proj => {
                if (proj.life <= 0) {
                    scene.remove(proj.mesh);
                    scene.remove(proj.trail);
                    return false;
                }
                return true;
            });
            
            // Update particles
            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.z += particle.vz;
                particle.vy -= 0.01; // gravity
                particle.life -= deltaTime;
                
                particle.mesh.position.set(particle.x, Math.max(0.1, particle.y), particle.z);
                particle.mesh.material.opacity = particle.life / particle.maxLife;
            });
            
            particles = particles.filter(p => {
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    return false;
                }
                return true;
            });
            
            // Update XP orbs
            xpOrbs.forEach((orb, index) => {
                const dx = player.x - orb.x;
                const dz = player.z - orb.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                if (dist < 3) {
                    orb.attracted = true;
                }
                
                if (orb.attracted) {
                    orb.x += dx / dist * 0.3;
                    orb.z += dz / dist * 0.3;
                }
                
                orb.mesh.position.set(orb.x, 0.5 + Math.sin(gameState.time * 3 + index) * 0.2, orb.z);
                orb.mesh.rotation.y += deltaTime * 2;
                
                if (dist < 0.8) {
                    gainXP(orb.value);
                    scene.remove(orb.mesh);
                    return false;
                }
                
                orb.life -= deltaTime;
                if (orb.life <= 0) {
                    scene.remove(orb.mesh);
                    return false;
                }
                
                return true;
            });
            
            // Update damage numbers
            damageNumbers.forEach(num => {
                num.life -= deltaTime;
                
                // Project to screen
                const vector = new THREE.Vector3(num.x, 1, num.z);
                vector.project(camera);
                
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                
                num.element.style.left = x + 'px';
                num.element.style.top = y + 'px';
                num.element.style.opacity = num.life;
            });
            
            damageNumbers = damageNumbers.filter(num => {
                if (num.life <= 0) {
                    num.element.remove();
                    return false;
                }
                return true;
            });
            
            // Update camera to follow player
            camera.position.x = player.x * 0.3;
            camera.position.z = player.z * 0.3 + 20;
            camera.lookAt(player.x * 0.3, 0, player.z * 0.3);
            
            // Update UI
            updateUI();
            
            renderer.render(scene, camera);
        }

        // ==================== GAME FUNCTIONS ====================
        function killEnemy(enemy) {
            createExplosion(enemy.x, enemy.size * 0.5, enemy.z, enemy.isBoss ? 0xffcc00 : 0xff3366, enemy.isBoss ? 30 : 15);
            
            // XP drop
            createXPOrb(enemy.x, enemy.z, enemy.xpValue);
            
            // Score
            gameState.score += enemy.xpValue * 10;
            gameState.enemiesKilled++;
            
            // Remove
            scene.remove(enemy.mesh);
            enemies = enemies.filter(e => e !== enemy);
        }

        function gainXP(amount) {
            gameState.xp += amount;
            
            if (gameState.xp >= gameState.xpToLevel) {
                gameState.xp -= gameState.xpToLevel;
                gameState.level++;
                gameState.xpToLevel = Math.floor(gameState.xpToLevel * 1.2);
                
                showUpgradePanel();
            }
        }

        function showUpgradePanel() {
            gameState.paused = true;
            gameState.showUpgrades = true;
            
            // Pick 3 random upgrades
            const options = [];
            const weights = { common: 0.6, rare: 0.3, legendary: 0.1 };
            
            for (let i = 0; i < 3; i++) {
                let r = Math.random();
                let rarity = 'common';
                for (const [key, w] of Object.entries(weights)) {
                    r -= w;
                    if (r <= 0) {
                        rarity = key;
                        break;
                    }
                }
                
                const filtered = UPGRADES.filter(u => u.rarity === rarity);
                options.push(filtered[Math.floor(Math.random() * filtered.length)]);
            }
            
            const container = document.getElementById('upgradeCards');
            container.innerHTML = '';
            
            options.forEach(upgrade => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <h3>${upgrade.name}</h3>
                    <p>${upgrade.desc}</p>
                    <span class="rarity ${upgrade.rarity}">${upgrade.rarity.toUpperCase()}</span>
                `;
                card.onclick = () => selectUpgrade(upgrade);
                container.appendChild(card);
            });
            
            document.getElementById('upgradePanel').classList.add('active');
        }

        function selectUpgrade(upgrade) {
            upgrade.apply(player);
            
            document.getElementById('upgradePanel').classList.remove('active');
            gameState.paused = false;
            gameState.showUpgrades = false;
        }

        function updateUI() {
            document.getElementById('healthFill').style.width = `${(player.health / player.maxHealth) * 100}%`;
            document.getElementById('xpFill').style.width = `${(gameState.xp / gameState.xpToLevel) * 100}%`;
            document.getElementById('levelDisplay').textContent = `LEVEL ${gameState.level}`;
            document.getElementById('scoreDisplay').textContent = `SCORE: ${gameState.score}`;
        }

        function gameOver() {
            gameState.running = false;
            
            document.getElementById('finalStats').innerHTML = `
                Level: ${gameState.level}<br>
                Wave: ${gameState.wave}<br>
                Score: ${gameState.score}<br>
                Enemies Killed: ${gameState.enemiesKilled}<br>
                Time: ${document.getElementById('timerDisplay').textContent}
            `;
            
            document.getElementById('gameOver').classList.add('active');
        }

        function restartGame() {
            // Clear all entities
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];
            
            projectiles.forEach(p => {
                scene.remove(p.mesh);
                scene.remove(p.trail);
            });
            projectiles = [];
            
            particles.forEach(p => scene.remove(p.mesh));
            particles = [];
            
            xpOrbs.forEach(o => scene.remove(o.mesh));
            xpOrbs = [];
            
            // Reset player
            player.x = 0;
            player.z = 0;
            player.health = CONFIG.PLAYER_MAX_HEALTH;
            player.maxHealth = CONFIG.PLAYER_MAX_HEALTH;
            player.speed = CONFIG.PLAYER_SPEED;
            player.damage = CONFIG.BASE_DAMAGE;
            player.attackRange = CONFIG.ATTACK_RANGE;
            player.attackCooldown = CONFIG.ATTACK_COOLDOWN;
            player.lastAttack = 0;
            player.level = 1;
            player.critChance = 0.1;
            player.critDamage = 2;
            player.lifesteal = 0;
            player.regen = 0;
            player.projectiles = 1;
            player.pierce = 1;
            player.area = 1;
            player.projectileSpeed = 1;
            
            // Reset game state
            gameState = {
                running: true,
                paused: false,
                time: 0,
                score: 0,
                wave: 1,
                waveTimer: 0,
                enemiesKilled: 0,
                level: 1,
                xp: 0,
                xpToLevel: 20,
                pendingUpgrades: [],
                showUpgrades: false
            };
            
            document.getElementById('gameOver').classList.remove('active');
            document.getElementById('waveDisplay').textContent = 'WAVE 1';
            updateUI();
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            gameState.running = true;
        }

        // ==================== EVENT LISTENERS ====================
        document.getElementById('startBtn').onclick = startGame;
        document.getElementById('restartBtn').onclick = restartGame;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== START GAME ====================
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
