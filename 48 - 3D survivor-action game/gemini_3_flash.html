<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Shard Survivor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .pointer-events-auto { pointer-events: auto; }
        .glass { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); }
        .xp-bar-fill { transition: width 0.3s ease-out; }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse 3s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud" class="absolute top-0 left-0 w-full p-6 flex flex-col gap-4 hidden">
            <div class="flex justify-between items-end">
                <div class="flex flex-col">
                    <span class="text-cyan-400 text-xs font-bold uppercase tracking-widest">Level</span>
                    <span id="level-display" class="text-4xl font-black text-white neon-text">1</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-gray-400 text-xs font-bold uppercase tracking-widest">Time Survived</span>
                    <span id="timer-display" class="text-2xl font-mono text-white">00:00</span>
                </div>
            </div>
            
            <!-- XP Bar -->
            <div class="w-full h-2 bg-gray-900 rounded-full overflow-hidden border border-gray-800">
                <div id="xp-bar" class="xp-bar-fill h-full bg-cyan-500 shadow-[0_0_15px_rgba(6,182,212,0.5)]" style="width: 0%"></div>
            </div>

            <!-- Health Bar -->
            <div class="flex items-center gap-3">
                <div class="w-48 h-4 bg-gray-900 rounded border border-gray-800 relative">
                    <div id="hp-bar" class="h-full bg-rose-600 transition-all duration-300" style="width: 100%"></div>
                    <div class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white uppercase">Health</div>
                </div>
                <div id="kill-count" class="text-cyan-400 text-sm font-bold"><span class="text-gray-500">KILLS:</span> 0</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="absolute inset-0 flex items-center justify-center pointer-events-auto bg-black/80">
            <div class="max-w-md w-full p-8 glass rounded-2xl text-center space-y-6">
                <h1 class="text-6xl font-black text-white neon-text italic tracking-tighter">VOID<br/>SHARD</h1>
                <p class="text-cyan-400 font-medium tracking-wide">SURVIVE THE CRYSTALLINE SWARM</p>
                <div class="space-y-2 text-gray-400 text-sm">
                    <p>WASD / Arrows to Move</p>
                    <p>Auto-attacking enabled</p>
                    <p>Collect shards to level up</p>
                </div>
                <button id="start-btn" class="w-full py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(8,145,178,0.4)]">
                    INITIALIZE SYSTEM
                </button>
            </div>
        </div>

        <!-- Upgrade Screen -->
        <div id="upgrade-screen" class="absolute inset-0 flex items-center justify-center pointer-events-auto bg-black/60 backdrop-blur-sm hidden">
            <div class="max-w-2xl w-full p-8 space-y-6">
                <h2 class="text-3xl font-black text-white text-center neon-text uppercase tracking-widest">System Enhancement Available</h2>
                <div id="upgrade-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Upgrades injected here -->
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="absolute inset-0 flex items-center justify-center pointer-events-auto bg-rose-950/40 backdrop-blur-md hidden">
            <div class="max-w-md w-full p-8 glass rounded-2xl text-center space-y-6 border-rose-500/30">
                <h2 class="text-5xl font-black text-rose-500 italic">SYSTEM FAILURE</h2>
                <div class="grid grid-cols-2 gap-4 text-left">
                    <div class="p-3 bg-white/5 rounded-lg">
                        <div class="text-xs text-gray-400 uppercase">Survival Time</div>
                        <div id="final-time" class="text-xl font-bold text-white">00:00</div>
                    </div>
                    <div class="p-3 bg-white/5 rounded-lg">
                        <div class="text-xs text-gray-400 uppercase">Shards Shattered</div>
                        <div id="final-kills" class="text-xl font-bold text-white">0</div>
                    </div>
                </div>
                <button id="restart-btn" class="w-full py-4 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl transition-all shadow-[0_0_20px_rgba(225,29,72,0.4)]">
                    REBOOT SYSTEM
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration & Constants ---
        const CONFIG = {
            PLAYER_SPEED: 0.15,
            PLAYER_MAX_HP: 100,
            SPAWN_RADIUS: 30,
            MAX_ENEMIES: 200,
            XP_TO_LEVEL: (lvl) => Math.floor(10 * Math.pow(lvl, 1.5)),
            WEAPONS: {
                PULSE: { name: 'Pulse Repeater', desc: 'Rapid energy bolts at nearest foe', damage: 10, cooldown: 600, speed: 0.4, range: 20 },
                ORBITER: { name: 'Void Orbiters', desc: 'Spinning shards that damage contacts', damage: 15, cooldown: 2000, count: 2, radius: 3 },
                NOVA: { name: 'Nova Burst', desc: 'Powerful AOE shockwave around you', damage: 40, cooldown: 4000, range: 8 }
            }
        };

        // --- Game State ---
        let state = {
            running: false,
            paused: false,
            time: 0,
            score: 0,
            kills: 0,
            level: 1,
            xp: 0,
            maxXp: CONFIG.XP_TO_LEVEL(1),
            player: {
                hp: CONFIG.PLAYER_MAX_HP,
                maxHp: CONFIG.PLAYER_MAX_HP,
                pos: new THREE.Vector3(0, 0, 0),
                vel: new THREE.Vector3(0, 0, 0),
                upgrades: { pulse: 1, orbiter: 0, nova: 0, speed: 0, health: 0 }
            },
            keys: {},
            entities: {
                enemies: [],
                projectiles: [],
                pickups: [],
                particles: [],
                orbiters: [],
                floatingTexts: []
            },
            nextSpawn: 0,
            lastFrame: 0
        };

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x4040ff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0x00ffff, 1.2);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        scene.add(sunLight);

        // --- Environment ---
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshPhongMaterial({ 
            color: 0x050505,
            specular: 0x222222,
            shininess: 10
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid Helper for style
        const grid = new THREE.GridHelper(200, 50, 0x00ffff, 0x111122);
        grid.position.y = 0.01;
        scene.add(grid);

        // Environment Props
        const props = new THREE.Group();
        for(let i=0; i<40; i++) {
            const h = 2 + Math.random() * 8;
            const geo = new THREE.CylinderGeometry(0.5, 0.8, h, 6);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x0a0a1a, 
                emissive: 0x002244,
                roughness: 0.1,
                metalness: 0.9
            });
            const p = new THREE.Mesh(geo, mat);
            const r = 20 + Math.random() * 80;
            const a = Math.random() * Math.PI * 2;
            p.position.set(Math.cos(a)*r, h/2, Math.sin(a)*r);
            p.castShadow = true;
            p.receiveShadow = true;
            props.add(p);
            
            // Crystal cap
            const capGeo = new THREE.OctahedronGeometry(1, 0);
            const capMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x006666, transparent: true, opacity: 0.8 });
            const cap = new THREE.Mesh(capGeo, capMat);
            cap.position.set(p.position.x, h + 1, p.position.z);
            props.add(cap);
        }
        scene.add(props);

        // --- Assets Creation ---
        const createPlayerMesh = () => {
            const group = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.IcosahedronGeometry(0.8, 1);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                emissive: 0x006666,
                metalness: 0.8,
                roughness: 0.2
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            group.add(body);

            // Floating bits
            for(let i=0; i<4; i++) {
                const bitGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const bit = new THREE.Mesh(bitGeo, bodyMat);
                const angle = (i / 4) * Math.PI * 2;
                bit.position.set(Math.cos(angle)*1.2, 1, Math.sin(angle)*1.2);
                group.add(bit);
            }

            return group;
        };

        const playerMesh = createPlayerMesh();
        scene.add(playerMesh);

        // --- Systems ---

        function spawnEnemy(type = 'basic') {
            const angle = Math.random() * Math.PI * 2;
            const dist = CONFIG.SPAWN_RADIUS;
            const pos = new THREE.Vector3(
                state.player.pos.x + Math.cos(angle) * dist,
                0,
                state.player.pos.z + Math.sin(angle) * dist
            );

            let geo, mat, hp, speed, scale;
            
            if (state.time > 120 && Math.random() > 0.8) {
                // Heavy enemy
                geo = new THREE.OctahedronGeometry(1.2, 0);
                mat = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0x330033 });
                hp = 50 + (state.level * 10);
                speed = 0.03;
                scale = 1.5;
            } else {
                // Basic enemy
                geo = new THREE.TetrahedronGeometry(0.8, 0);
                mat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0x330000 });
                hp = 15 + (state.level * 3);
                speed = 0.06 + (Math.random() * 0.02);
                scale = 1;
            }

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.position.y = 1;
            mesh.castShadow = true;
            scene.add(mesh);

            state.entities.enemies.push({
                mesh,
                hp,
                maxHp: hp,
                speed,
                type
            });
        }

        function createProjectile(pos, dir, weapon) {
            const geo = new THREE.SphereGeometry(0.2, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            scene.add(mesh);

            state.entities.projectiles.push({
                mesh,
                dir: dir.clone().normalize(),
                speed: weapon.speed,
                damage: weapon.damage * (1 + state.player.upgrades.pulse * 0.2),
                life: 100
            });
        }

        function createPickup(pos, type = 'xp') {
            const geo = new THREE.OctahedronGeometry(0.3, 0);
            const mat = new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x008888 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.position.y = 0.5;
            scene.add(mesh);
            state.entities.pickups.push({ mesh, type, val: 5 });
        }

        function createExplosion(pos, color = 0x00ffff, count = 10) {
            for(let i=0; i<count; i++) {
                const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const mat = new THREE.MeshBasicMaterial({ color });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);
                
                const dir = new THREE.Vector3(
                    (Math.random()-0.5),
                    (Math.random()),
                    (Math.random()-0.5)
                ).normalize();
                
                state.entities.particles.push({
                    mesh,
                    dir,
                    speed: 0.1 + Math.random() * 0.2,
                    life: 30 + Math.random() * 30
                });
            }
        }

        function createDamageNumber(pos, val) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 64;
            canvas.height = 64;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(Math.floor(val), 32, 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.copy(pos);
            sprite.position.y += 1;
            sprite.scale.set(1.5, 1.5, 1);
            scene.add(sprite);
            
            state.entities.floatingTexts.push({
                sprite,
                life: 40,
                maxLife: 40
            });
        }

        // --- Logic Updates ---

        function handleInput() {
            const move = new THREE.Vector3(0, 0, 0);
            if (state.keys['KeyW'] || state.keys['ArrowUp']) move.z -= 1;
            if (state.keys['KeyS'] || state.keys['ArrowDown']) move.z += 1;
            if (state.keys['KeyA'] || state.keys['ArrowLeft']) move.x -= 1;
            if (state.keys['KeyD'] || state.keys['ArrowRight']) move.x += 1;

            if (move.length() > 0) {
                move.normalize();
                const speed = CONFIG.PLAYER_SPEED * (1 + state.player.upgrades.speed * 0.15);
                state.player.pos.add(move.multiplyScalar(speed));
                
                // Rotation
                const targetRotation = Math.atan2(move.x, move.z);
                playerMesh.rotation.y = THREE.MathUtils.lerp(playerMesh.rotation.y, targetRotation, 0.1);
            }
            
            playerMesh.position.copy(state.player.pos);
            playerMesh.position.y = 1 + Math.sin(Date.now() * 0.005) * 0.1; // Hover effect
            
            // Camera follow
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, state.player.pos.x, 0.05);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, state.player.pos.z + 15, 0.05);
            camera.lookAt(state.player.pos);
        }

        function updateWeapons(delta) {
            // Pulse Blaster Logic
            if (state.player.upgrades.pulse > 0) {
                const w = CONFIG.WEAPONS.PULSE;
                if (!w.lastShot || Date.now() - w.lastShot > w.cooldown / (1 + state.player.upgrades.pulse * 0.3)) {
                    // Find nearest enemy
                    let nearest = null;
                    let minDist = w.range;
                    state.entities.enemies.forEach(e => {
                        const d = e.mesh.position.distanceTo(state.player.pos);
                        if (d < minDist) {
                            minDist = d;
                            nearest = e;
                        }
                    });

                    if (nearest) {
                        const dir = new THREE.Vector3().subVectors(nearest.mesh.position, state.player.pos);
                        createProjectile(state.player.pos, dir, w);
                        w.lastShot = Date.now();
                    }
                }
            }

            // Orbiter Logic
            const orbiterCount = state.player.upgrades.orbiter;
            if (orbiterCount > 0) {
                // Ensure correct number of meshes
                while(state.entities.orbiters.length < orbiterCount) {
                    const geo = new THREE.IcosahedronGeometry(0.4, 0);
                    const mat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444 });
                    const mesh = new THREE.Mesh(geo, mat);
                    scene.add(mesh);
                    state.entities.orbiters.push(mesh);
                }
                
                const time = Date.now() * 0.002;
                state.entities.orbiters.forEach((orb, i) => {
                    const angle = time + (i / orbiterCount) * Math.PI * 2;
                    const r = CONFIG.WEAPONS.ORBITER.radius;
                    orb.position.set(
                        state.player.pos.x + Math.cos(angle) * r,
                        1,
                        state.player.pos.z + Math.sin(angle) * r
                    );
                    orb.rotation.y += 0.1;
                    
                    // Orbit damage collision
                    state.entities.enemies.forEach(e => {
                        if (e.mesh.position.distanceTo(orb.position) < 1.2) {
                            damageEnemy(e, CONFIG.WEAPONS.ORBITER.damage * 0.1); // Continuous low damage
                        }
                    });
                });
            }

            // Nova Logic
            if (state.player.upgrades.nova > 0) {
                const w = CONFIG.WEAPONS.NOVA;
                if (!w.lastShot || Date.now() - w.lastShot > w.cooldown) {
                    // Create Nova Visual
                    const ringGeo = new THREE.TorusGeometry(w.range, 0.1, 16, 100);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI/2;
                    ring.position.copy(state.player.pos);
                    scene.add(ring);
                    
                    state.entities.particles.push({
                        mesh: ring,
                        type: 'nova',
                        life: 20,
                        maxLife: 20
                    });

                    // Damage all in range
                    state.entities.enemies.forEach(e => {
                        if (e.mesh.position.distanceTo(state.player.pos) < w.range) {
                            damageEnemy(e, w.damage * state.player.upgrades.nova);
                        }
                    });
                    
                    w.lastShot = Date.now();
                }
            }
        }

        function damageEnemy(enemy, dmg) {
            enemy.hp -= dmg;
            enemy.mesh.material.emissive.setHex(0xffffff);
            
            // Damage numbers - only show for significant hits or sparingly
            if (Math.random() > 0.5 || dmg > 20) {
                createDamageNumber(enemy.mesh.position, dmg);
            }

            setTimeout(() => {
                if(enemy.mesh) {
                    enemy.mesh.material.emissive.setHex(enemy.type === 'heavy' ? 0x330033 : 0x330000);
                }
            }, 50);

            if (enemy.hp <= 0 && !enemy.dead) {
                enemy.dead = true;
                state.kills++;
                createExplosion(enemy.mesh.position, enemy.mesh.material.color.getHex());
                createPickup(enemy.mesh.position);
            }
        }

        function updateEntities() {
            // Enemies
            for (let i = state.entities.enemies.length - 1; i >= 0; i--) {
                const e = state.entities.enemies[i];
                if (e.dead) {
                    scene.remove(e.mesh);
                    state.entities.enemies.splice(i, 1);
                    continue;
                }

                const dir = new THREE.Vector3().subVectors(state.player.pos, e.mesh.position).normalize();
                e.mesh.position.add(dir.multiplyScalar(e.speed));
                e.mesh.rotation.y += 0.05;
                e.mesh.position.y = 1 + Math.sin(Date.now() * 0.01 + i) * 0.2;

                // Player collision
                if (e.mesh.position.distanceTo(state.player.pos) < 1.2) {
                    state.player.hp -= 0.5;
                    // Screen shake effect
                    camera.position.x += (Math.random()-0.5) * 0.2;
                    camera.position.y += (Math.random()-0.5) * 0.2;
                    if (state.player.hp <= 0) gameOver();
                }
            }

            // Projectiles
            for (let i = state.entities.projectiles.length - 1; i >= 0; i--) {
                const p = state.entities.projectiles[i];
                p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed));
                p.life--;

                let hit = false;
                state.entities.enemies.forEach(e => {
                    if (!hit && p.mesh.position.distanceTo(e.mesh.position) < 1.5) {
                        damageEnemy(e, p.damage);
                        hit = true;
                    }
                });

                if (hit || p.life <= 0) {
                    scene.remove(p.mesh);
                    state.entities.projectiles.splice(i, 1);
                }
            }

            // Pickups
            for (let i = state.entities.pickups.length - 1; i >= 0; i--) {
                const p = state.entities.pickups[i];
                p.mesh.rotation.y += 0.05;
                
                const dist = p.mesh.position.distanceTo(state.player.pos);
                if (dist < 5) {
                    const dir = new THREE.Vector3().subVectors(state.player.pos, p.mesh.position).normalize();
                    p.mesh.position.add(dir.multiplyScalar(0.3));
                }

                if (dist < 1.5) {
                    collectXP(p.val);
                    scene.remove(p.mesh);
                    state.entities.pickups.splice(i, 1);
                }
            }

            // Particles
            for (let i = state.entities.particles.length - 1; i >= 0; i--) {
                const p = state.entities.particles[i];
                if (p.type === 'nova') {
                    p.life--;
                    p.mesh.scale.setScalar(1 + (p.maxLife - p.life) * 0.1);
                    p.mesh.material.opacity = p.life / p.maxLife;
                } else {
                    p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed));
                    p.life--;
                }

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    state.entities.particles.splice(i, 1);
                }
            }

            // Floating Texts
            for (let i = state.entities.floatingTexts.length - 1; i >= 0; i--) {
                const ft = state.entities.floatingTexts[i];
                ft.sprite.position.y += 0.05;
                ft.life--;
                ft.sprite.material.opacity = ft.life / ft.maxLife;

                if (ft.life <= 0) {
                    scene.remove(ft.sprite);
                    state.entities.floatingTexts.splice(i, 1);
                }
            }
        }

        function collectXP(amount) {
            state.xp += amount;
            if (state.xp >= state.maxXp) {
                levelUp();
            }
            updateHUD();
        }

        function levelUp() {
            state.level++;
            state.xp -= state.maxXp;
            state.maxXp = CONFIG.XP_TO_LEVEL(state.level);
            showUpgradeScreen();
        }

        function updateHUD() {
            document.getElementById('xp-bar').style.width = `${(state.xp / state.maxXp) * 100}%`;
            document.getElementById('hp-bar').style.width = `${(state.player.hp / state.player.maxHp) * 100}%`;
            document.getElementById('level-display').innerText = state.level;
            document.getElementById('kill-count').innerHTML = `<span class="text-gray-500">KILLS:</span> ${state.kills}`;
            
            const mins = Math.floor(state.time / 60);
            const secs = Math.floor(state.time % 60);
            document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // --- UI Handlers ---

        function showUpgradeScreen() {
            state.paused = true;
            const container = document.getElementById('upgrade-container');
            container.innerHTML = '';
            
            const pool = [
                { id: 'pulse', name: 'Pulse Blaster', desc: 'Faster fire rate & damage', icon: '🔫' },
                { id: 'orbiter', name: 'Void Orbiters', desc: 'Add spinning defense shard', icon: '🌀' },
                { id: 'nova', name: 'Nova Burst', desc: 'Increase shockwave power', icon: '💥' },
                { id: 'speed', name: 'Thruster Overclock', desc: 'Permanent movement speed', icon: '⚡' },
                { id: 'health', name: 'Nano-Repair', desc: 'Heal and increase Max HP', icon: '❤️' }
            ];

            // Shuffle and pick 3
            const choices = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
            
            choices.forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'glass p-6 rounded-xl cursor-pointer hover:bg-cyan-900/30 transition-all border-cyan-500/20 hover:border-cyan-500 flex flex-col items-center gap-3 text-center group';
                btn.innerHTML = `
                    <div class="text-4xl group-hover:scale-110 transition-transform">${c.icon}</div>
                    <div class="font-bold text-white text-lg">${c.name}</div>
                    <div class="text-xs text-gray-400">${c.desc}</div>
                    <div class="mt-2 px-3 py-1 bg-cyan-500/20 rounded text-[10px] text-cyan-400 font-bold uppercase">Upgrade</div>
                `;
                btn.onclick = () => applyUpgrade(c.id);
                container.appendChild(btn);
            });

            document.getElementById('upgrade-screen').classList.remove('hidden');
        }

        function applyUpgrade(id) {
            if (id === 'health') {
                state.player.maxHp += 20;
                state.player.hp = state.player.maxHp;
            } else {
                state.player.upgrades[id]++;
            }
            
            document.getElementById('upgrade-screen').classList.add('hidden');
            state.paused = false;
        }

        function gameOver() {
            state.running = false;
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-time').innerText = document.getElementById('timer-display').innerText;
            document.getElementById('final-kills').innerText = state.kills;
        }

        function resetGame() {
            state.time = 0;
            state.score = 0;
            state.kills = 0;
            state.level = 1;
            state.xp = 0;
            state.maxXp = CONFIG.XP_TO_LEVEL(1);
            state.player.hp = CONFIG.PLAYER_MAX_HP;
            state.player.maxHp = CONFIG.PLAYER_MAX_HP;
            state.player.pos.set(0, 0, 0);
            state.player.upgrades = { pulse: 1, orbiter: 0, nova: 0, speed: 0, health: 0 };
            
            // Clear entities
            state.entities.enemies.forEach(e => scene.remove(e.mesh));
            state.entities.projectiles.forEach(p => scene.remove(p.mesh));
            state.entities.pickups.forEach(p => scene.remove(p.mesh));
            state.entities.particles.forEach(p => scene.remove(p.mesh));
            state.entities.orbiters.forEach(o => scene.remove(o));
            
            state.entities.enemies = [];
            state.entities.projectiles = [];
            state.entities.pickups = [];
            state.entities.particles = [];
            state.entities.orbiters = [];
            
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            state.lastFrame = performance.now();
            state.running = true;
            state.paused = false;
            updateHUD();
        }

        // --- Main Loop ---

        function animate(now) {
            requestAnimationFrame(animate);
            
            if (!state.running || state.paused) {
                renderer.render(scene, camera);
                return;
            }

            const delta = now - state.lastFrame;
            state.lastFrame = now;
            state.time += delta / 1000;

            handleInput();
            updateWeapons(delta);
            updateEntities();
            updateHUD();

            // Spawn Logic
            if (now > state.nextSpawn) {
                const count = 1 + Math.floor(state.time / 60);
                for(let i=0; i<count; i++) {
                    if (state.entities.enemies.length < CONFIG.MAX_ENEMIES) {
                        spawnEnemy();
                    }
                }
                state.nextSpawn = now + Math.max(200, 1000 - (state.time * 2));
            }

            renderer.render(scene, camera);
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => state.keys[e.code] = true);
        window.addEventListener('keyup', (e) => state.keys[e.code] = false);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('start-btn').onclick = resetGame;
        document.getElementById('restart-btn').onclick = resetGame;

        requestAnimationFrame(animate);
    </script>
</body>
</html>
