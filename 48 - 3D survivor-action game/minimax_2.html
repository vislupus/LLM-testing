<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON HORDE - Survivor Action Game</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Rajdhani', sans-serif;
        }
        
        #gameCanvas {
            display: block;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-element {
            pointer-events: auto;
        }
        
        /* Health Bar */
        #healthBarContainer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 300px;
        }
        
        #healthBarBg {
            width: 100%;
            height: 24px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff3366;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        #healthBar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3366, #ff6b9d);
            transition: width 0.3s ease;
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.3);
        }
        
        #healthText {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 0 10px #ff3366;
            margin-top: 5px;
            font-family: 'Orbitron', sans-serif;
        }
        
        /* XP Bar */
        #xpBarContainer {
            position: absolute;
            bottom: 30px;
            left: 350px;
            width: 400px;
        }
        
        #xpBarBg {
            width: 100%;
            height: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffcc;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }
        
        #xpBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #00ff88);
            transition: width 0.2s ease;
        }
        
        #levelText {
            color: #00ffcc;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 10px #00ffcc;
            font-family: 'Orbitron', sans-serif;
        }
        
        /* Score */
        #scoreContainer {
            position: absolute;
            top: 30px;
            left: 30px;
        }
        
        #scoreLabel {
            color: #ffcc00;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #scoreText {
            color: #fff;
            font-size: 36px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 20px #ffcc00, 0 0 40px rgba(255, 204, 0, 0.5);
        }
        
        /* Wave Info */
        #waveContainer {
            position: absolute;
            top: 30px;
            right: 30px;
            text-align: right;
        }
        
        #waveLabel {
            color: #ff6600;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #waveText {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px #ff6600;
        }
        
        #enemyCount {
            color: #ff3366;
            font-size: 16px;
            font-weight: 600;
        }
        
        /* Upgrade Menu */
        #upgradeMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.95), rgba(20, 20, 40, 0.95));
            border: 3px solid #00ffcc;
            border-radius: 16px;
            padding: 30px;
            display: none;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.5), inset 0 0 30px rgba(0, 255, 204, 0.1);
            min-width: 500px;
        }
        
        #upgradeMenu h2 {
            color: #00ffcc;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 0 20px #00ffcc;
        }
        
        .upgrade-option {
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.1), rgba(0, 100, 80, 0.2));
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upgrade-option:hover {
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.3), rgba(0, 150, 120, 0.4));
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
        }
        
        .upgrade-option h3 {
            color: #00ffcc;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .upgrade-option p {
            color: #aaa;
            font-size: 14px;
        }
        
        .upgrade-option .upgrade-icon {
            font-size: 32px;
            margin-right: 15px;
            float: left;
        }
        
        /* Game Over Screen */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #gameOverScreen h1 {
            color: #ff3366;
            font-family: 'Orbitron', sans-serif;
            font-size: 64px;
            text-shadow: 0 0 30px #ff3366;
            margin-bottom: 20px;
        }
        
        #gameOverScreen .stats {
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        #restartBtn {
            background: linear-gradient(135deg, #ff3366, #ff6b9d);
            border: none;
            color: white;
            padding: 15px 50px;
            font-size: 20px;
            font-family: 'Orbitron', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #restartBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #ff3366;
        }
        
        /* Start Screen */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a, #1a0a2a);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }
        
        #startScreen h1 {
            color: #00ffcc;
            font-family: 'Orbitron', sans-serif;
            font-size: 72px;
            text-shadow: 0 0 40px #00ffcc, 0 0 80px rgba(0, 255, 204, 0.5);
            margin-bottom: 20px;
        }
        
        #startScreen .subtitle {
            color: #ff3366;
            font-size: 24px;
            margin-bottom: 50px;
            letter-spacing: 4px;
        }
        
        #startBtn {
            background: linear-gradient(135deg, #00ffcc, #00ff88);
            border: none;
            color: #0a0a1a;
            padding: 20px 80px;
            font-size: 24px;
            font-family: 'Orbitron', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }
        
        #startBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px #00ffcc;
        }
        
        #startScreen .controls {
            color: #666;
            margin-top: 40px;
            font-size: 14px;
        }
        
        /* Damage Numbers Container */
        #damageNumbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        
        .damage-number {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 20px;
            pointer-events: none;
            animation: damageFloat 1s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }
        
        @keyframes damageFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.5);
            }
        }
        
        /* Weapon indicator */
        #weaponIndicator {
            position: absolute;
            bottom: 100px;
            left: 30px;
            color: #fff;
            font-size: 16px;
        }
        
        #weaponIndicator .weapon-name {
            color: #ffcc00;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }
        
        /* Pause overlay */
        #pauseOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        #pauseOverlay h2 {
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            text-shadow: 0 0 20px #fff;
        }
        
        /* Boss warning */
        #bossWarning {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0000;
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            text-shadow: 0 0 30px #ff0000;
            display: none;
            animation: bossWarningPulse 0.5s ease-in-out infinite;
        }
        
        @keyframes bossWarningPulse {
            0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.7; transform: translateX(-50%) scale(1.1); }
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>NEON HORDE</h1>
        <div class="subtitle">SURVIVE THE ONSLAUGHT</div>
        <button id="startBtn">START GAME</button>
        <div class="controls">WASD - Move | Auto-Attack | Survive</div>
    </div>
    
    <div id="ui">
        <div id="scoreContainer">
            <div id="scoreLabel">SCORE</div>
            <div id="scoreText">0</div>
        </div>
        
        <div id="waveContainer">
            <div id="waveLabel">WAVE</div>
            <div id="waveText">1</div>
            <div id="enemyCount">Enemies: 0</div>
        </div>
        
        <div id="healthBarContainer">
            <div id="healthBarBg">
                <div id="healthBar"></div>
            </div>
            <div id="healthText">100 / 100</div>
        </div>
        
        <div id="xpBarContainer">
            <div id="levelText">LEVEL 1</div>
            <div id="xpBarBg">
                <div id="xpBar"></div>
            </div>
        </div>
        
        <div id="weaponIndicator">
            Weapon: <span class="weapon-name">Plasma Bolt</span>
        </div>
        
        <div id="bossWarning">⚠ BOSS APPROACHING ⚠</div>
        
        <div id="damageNumbers"></div>
        
        <div id="upgradeMenu">
            <h2>LEVEL UP!</h2>
            <div id="upgradeOptions"></div>
        </div>
        
        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <div class="stats">Final Score: <span id="finalScore">0</span></div>
            <div class="stats">Waves Survived: <span id="finalWave">0</span></div>
            <div class="stats">Enemies Defeated: <span id="finalKills">0</span></div>
            <div class="stats">Level Reached: <span id="finalLevel">0</span></div>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>
        
        <div id="pauseOverlay">
            <h2>PAUSED</h2>
        </div>
    </div>

    <script>
        // ============================================
        // NEON HORDE - Survivor Action Game
        // ============================================

        // Game Configuration
        const CONFIG = {
            PLAYER_SPEED: 8,
            PLAYER_MAX_HEALTH: 100,
            XP_PER_LEVEL: 100,
            BASE_ENEMY_SPAWN_RATE: 2000,
            WAVE_DURATION: 30,
            ARENA_SIZE: 80,
            DAMAGE_NUMBER_LIFETIME: 1000
        };

        // Game State
        let gameState = {
            started: false,
            paused: false,
            gameOver: false,
            score: 0,
            wave: 1,
            level: 1,
            xp: 0,
            enemiesKilled: 0,
            time: 0,
            waveTimer: 0,
            enemySpawnTimer: 0,
            currentEnemies: [],
            projectiles: [],
            pickups: [],
            damageNumbers: [],
            upgrades: [],
            nextLevelXP: CONFIG.XP_PER_LEVEL
        };

        // Player State
        let player = {
            health: CONFIG.PLAYER_MAX_HEALTH,
            maxHealth: CONFIG.PLAYER_MAX_HEALTH,
            damage: 10,
            attackSpeed: 500,
            lastAttack: 0,
            range: 15,
            critChance: 0.1,
            critMultiplier: 2,
            movementSpeed: CONFIG.PLAYER_SPEED,
            weapons: ['plasmaBolt'],
            abilityCooldowns: {}
        };

        // Weapon Definitions
        const WEAPONS = {
            plasmaBolt: {
                name: 'Plasma Bolt',
                damage: 10,
                speed: 30,
                fireRate: 500,
                range: 20,
                color: 0x00ffcc,
                size: 0.3,
                pierce: 1,
                description: 'Basic plasma projectile'
            },
            fireBurst: {
                name: 'Fire Burst',
                damage: 15,
                speed: 25,
                fireRate: 800,
                range: 12,
                color: 0xff6600,
                size: 0.4,
                pierce: 3,
                area: 3,
                description: 'Explosive fire that hits multiple enemies'
            },
            lightningChain: {
                name: 'Lightning Chain',
                damage: 8,
                speed: 40,
                fireRate: 400,
                range: 18,
                color: 0xffff00,
                size: 0.2,
                chain: 3,
                description: 'Chains between nearby enemies'
            },
            iceShard: {
                name: 'Ice Shard',
                damage: 12,
                speed: 35,
                fireRate: 600,
                range: 16,
                color: 0x00ccff,
                size: 0.35,
                slow: 0.5,
                duration: 2000,
                description: 'Slows enemies on hit'
            },
            voidOrb: {
                name: 'Void Orb',
                damage: 25,
                speed: 20,
                fireRate: 1000,
                range: 25,
                color: 0x9900ff,
                size: 0.5,
                pierce: 5,
                description: 'Powerful void energy'
            }
        };

        // Ability Definitions
        const ABILITIES = {
            shockwave: {
                name: 'Shockwave',
                cooldown: 8000,
                damage: 30,
                radius: 10,
                description: 'Push back and damage all nearby enemies'
            },
            teleport: {
                name: 'Blink',
                cooldown: 5000,
                distance: 15,
                description: 'Quickly dash in any direction'
            },
            shield: {
                name: 'Energy Shield',
                cooldown: 12000,
                duration: 3000,
                absorption: 50,
                description: 'Become invulnerable for a short time'
            }
        };

        // Upgrade Options
        const UPGRADE_POOL = [
            { type: 'weapon', id: 'plasmaBolt', name: 'Plasma Bolt', icon: '⚡', description: 'Add plasma bolt weapon' },
            { type: 'weapon', id: 'fireBurst', name: 'Fire Burst', icon: '🔥', description: 'Add fire burst weapon' },
            { type: 'weapon', id: 'lightningChain', name: 'Lightning Chain', icon: '⚡', description: 'Add lightning chain weapon' },
            { type: 'weapon', id: 'iceShard', name: 'Ice Shard', icon: '❄️', description: 'Add ice shard weapon' },
            { type: 'weapon', id: 'voidOrb', name: 'Void Orb', icon: '🔮', description: 'Add void orb weapon' },
            { type: 'stat', id: 'damage', name: 'Power Boost', icon: '💪', description: '+20% Damage' },
            { type: 'stat', id: 'attackSpeed', name: 'Rapid Fire', icon: '🏹', description: '+15% Attack Speed' },
            { type: 'stat', id: 'health', name: 'Vitality', icon: '❤️', description: '+25 Max Health & Heal' },
            { type: 'stat', id: 'speed', name: 'Swiftness', icon: '👟', description: '+10% Movement Speed' },
            { type: 'stat', id: 'range', name: 'Sniper', icon: '🎯', description: '+20% Attack Range' },
            { type: 'stat', id: 'crit', name: 'Critical Eye', icon: '👁️', description: '+5% Crit Chance' },
            { type: 'ability', id: 'shockwave', name: 'Shockwave', icon: '💥', description: 'Push back enemies' },
            { type: 'ability', id: 'teleport', name: 'Blink', icon: '✨', description: 'Quick dash' },
            { type: 'ability', id: 'shield', name: 'Energy Shield', icon: '🛡️', description: 'Temporary invincibility' }
        ];

        // Three.js Setup
        let scene, camera, renderer;
        let playerMesh, playerGlow;
        let groundMesh;
        let clock;

        // Input
        const keys = {};

        // Initialize Three.js
        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 20);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setClearColor(0x0a0a1a);
            document.body.insertBefore(renderer.domElement, document.body.firstChild);
            renderer.domElement.id = 'gameCanvas';
            
            clock = new THREE.Clock();
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(20, 40, 20);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 100;
            mainLight.shadow.camera.left = -50;
            mainLight.shadow.camera.right = 50;
            mainLight.shadow.camera.top = 50;
            mainLight.shadow.camera.bottom = -50;
            scene.add(mainLight);
            
            // Colored point lights for atmosphere
            const purpleLight = new THREE.PointLight(0x9900ff, 1, 50);
            purpleLight.position.set(-20, 10, -20);
            scene.add(purpleLight);
            
            const cyanLight = new THREE.PointLight(0x00ffcc, 0.8, 50);
            cyanLight.position.set(20, 10, 20);
            scene.add(cyanLight);
            
            createEnvironment();
            createPlayer();
            
            window.addEventListener('resize', onWindowResize);
        }

        // Create Environment
        function createEnvironment() {
            // Ground
            const groundGeometry = new THREE.PlaneGeometry(CONFIG.ARENA_SIZE * 2, CONFIG.ARENA_SIZE * 2, 50, 50);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                roughness: 0.8,
                metalness: 0.2,
                wireframe: false
            });
            groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);
            
            // Grid lines
            const gridHelper = new THREE.GridHelper(CONFIG.ARENA_SIZE * 2, 40, 0x00ffcc, 0x222244);
            gridHelper.position.y = 0.01;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            
            // Arena boundary markers
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const x = Math.cos(angle) * CONFIG.ARENA_SIZE;
                const z = Math.sin(angle) * CONFIG.ARENA_SIZE;
                
                const pillarGeo = new THREE.CylinderGeometry(1, 1, 8, 8);
                const pillarMat = new THREE.MeshStandardMaterial({
                    color: 0x00ffcc,
                    emissive: 0x00ffcc,
                    emissiveIntensity: 0.5
                });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(x, 4, z);
                pillar.castShadow = true;
                scene.add(pillar);
                
                // Add glow at top
                const glowGeo = new THREE.SphereGeometry(0.8, 16, 16);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0x00ffcc,
                    transparent: true,
                    opacity: 0.8
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.set(x, 8.5, z);
                scene.add(glow);
            }
            
            // Random decorative obstacles
            for (let i = 0; i < 15; i++) {
                const x = (Math.random() - 0.5) * CONFIG.ARENA_SIZE * 1.5;
                const z = (Math.random() - 0.5) * CONFIG.ARENA_SIZE * 1.5;
                
                // Skip if too close to center
                if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;
                
                const height = 2 + Math.random() * 4;
                const geo = new THREE.BoxGeometry(2 + Math.random() * 2, height, 2 + Math.random() * 2);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x2a2a4e,
                    roughness: 0.7
                });
                const obstacle = new THREE.Mesh(geo, mat);
                obstacle.position.set(x, height / 2, z);
                obstacle.castShadow = true;
                obstacle.receiveShadow = true;
                scene.add(obstacle);
            }
        }

        // Create Player
        function createPlayer() {
            // Main body - geometric humanoid
            const bodyGroup = new THREE.Group();
            
            // Torso
            const torsoGeo = new THREE.BoxGeometry(1.2, 1.5, 0.8);
            const torsoMat = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,
                emissive: 0x00ffcc,
                emissiveIntensity: 0.3,
                metalness: 0.8,
                roughness: 0.2
            });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 1.5;
            torso.castShadow = true;
            bodyGroup.add(torso);
            
            // Head
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshStandardMaterial({
                color: 0x00ff88,
                emissive: 0x00ff88,
                emissiveIntensity: 0.5,
                metalness: 0.9,
                roughness: 0.1
            });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.7;
            head.castShadow = true;
            bodyGroup.add(head);
            
            // Visor
            const visorGeo = new THREE.BoxGeometry(0.6, 0.2, 0.5);
            const visorMat = new THREE.MeshBasicMaterial({
                color: 0xff3366,
                transparent: true,
                opacity: 0.9
            });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 2.7, 0.3);
            bodyGroup.add(visor);
            
            // Arms
            const armGeo = new THREE.BoxGeometry(0.3, 1, 0.3);
            const armMat = new THREE.MeshStandardMaterial({

                    // Armor plates

                        plate.lookAt(0, 2, 0);

                    }
                    break;
                    
                case 'swarm':
                    // Very small, weak, many
                    health = 5 + gameState.wave;

                    size = 0.3;
                    color = 0xffaa00;
                    xpValue = 5;
                    
                    const swarmBody = new THREE.Mesh(

                    );
                    swarmBody.position.y = 0.4;
                    enemyGroup.add(swarmBody);
                    break;
                    
                case 'boss':

                    health = 200 + gameState.wave * 50;

                    // Main body
                    const bossBody = new THREE.Mesh(

        // Create Projectile
        function createProjectile(weaponKey, target) {
            const weapon = WEAPONS[weaponKey];
            if (!weapon) return;
            
            const projectile = {
                mesh: new THREE.Mesh(
                    new THREE.SphereGeometry(weapon.size, 8, 8),
                    new THREE.MeshBasicMaterial({ color: weapon.color })
                ),
                weapon: weaponKey,
                damage: player.damage * (weapon.damage / 10),
                speed: weapon.speed,
                range: weapon.range,
                distance: 0,
                pierce: weapon.pierce || 1,
                targetsHit: []
            };
            
            projectile.mesh.position.copy(playerMesh.position);
            projectile.mesh.position.y = 1.5;
            
            // Direction toward target or nearest enemy
            let direction;
            if (target) {
                direction = new THREE.Vector3().subVectors(target.mesh.position, playerMesh.position).normalize();
            } else {
                // Find nearest enemy
                let nearest = null;
                let nearestDist = Infinity;
                gameState.currentEnemies.forEach(enemy => {
                    const dist = enemy.mesh.position.distanceTo(playerMesh.position);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearest = enemy;
                    }
                });
                
                if (nearest) {
                    direction = new THREE.Vector3().subVectors(nearest.mesh.position, playerMesh.position).normalize();
                } else {
                    direction = new THREE.Vector3(1, 0, 0);
                }
            }
            
            projectile.direction = direction;
            projectile.velocity = direction.clone().multiplyScalar(weapon.speed);
            
            scene.add(projectile.mesh);
            gameState.projectiles.push(projectile);
            
            // Add trail
            createProjectileTrail(projectile);
        }

        // Create Projectile Trail
        function createProjectileTrail(projectile) {
            const trailGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(30);
            trailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const trailMat = new THREE.LineBasicMaterial({
                color: WEAPONS[projectile.weapon].color,
                transparent: true,
                opacity: 0.5
            });
            
            const trail = new THREE.Line(trailGeo, trailMat);
            trail.userData.positions = [];
            scene.add(trail);
            projectile.trail = trail;
        }

        // Create Damage Number
        function createDamageNumber(position, damage, isCrit = false) {
            const container = document.getElementById('damageNumbers');
            const div = document.createElement('div');
            div.className = 'damage-number';
            div.textContent = Math.round(damage);
            div.style.color = isCrit ? '#ffff00' : '#ffffff';
            div.style.fontSize = isCrit ? '32px' : '20px';
            
            // Project to screen coordinates
            const vector = position.clone();
            vector.project(camera);
            
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
            
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            
            container.appendChild(div);
            
            setTimeout(() => div.remove(), CONFIG.DAMAGE_NUMBER_LIFETIME);
        }

        // Create Pickup
        function createPickup(position, type = 'xp') {

            switch(type) {
                case 'health':
                    color = 0xff3366;
                    size = 0.4;
                    value = 20;
                    break;
                case 'xp':
                default:
                    color = 0x00ffcc;
                    size = 0.3;
                    value = 10;
            }
            
            const pickup = {
                mesh: new THREE.Mesh(
                    new THREE.OctahedronGeometry(size),

                lifetime: 0
            };
            
            pickup.mesh.position.copy(position);
            pickup.mesh.position.y = 1;
            
            // Add glow

                new THREE.SphereGeometry(size * 2, 8, 8),
                new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.3 })

        // Create Particle Effect
        function createParticles(position, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.1, 4, 4),
                    new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1 })
                );
                
                particle.position.copy(position);
                
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    Math.random() * 8,
                    (Math.random() - 0.5) * 10
                );
                
                scene.add(particle);
                
                // Animate particle
                const animate = () => {
                    velocity.y -= 0.3;
                    particle.position.add(velocity.clone().multiplyScalar(0.016));
                    particle.material.opacity -= 0.03;
                    
                    if (particle.material.opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        scene.remove(particle);
                    }
                };
                animate();
            }
        }

        // Create Shockwave Effect
        function createShockwave(position, radius) {
            const ringGeo = new THREE.RingGeometry(0.1, radius, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00ffcc,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(position);
            ring.position.y = 0.5;
            ring.rotation.x = -Math.PI / 2;
            scene.add(ring);
            
            const animate = () => {
                ring.scale.x += 0.3;
                ring.scale.y += 0.3;
                ring.material.opacity -= 0.05;
                
                if (ring.material.opacity > 0) {
                    requestAnimationFrame(animate);
                } else {
                    scene.remove(ring);
                }
            };
            animate();
        }

        // Update Player
        function updatePlayer(delta) {
            if (!gameState.started || gameState.paused || gameState.gameOver) return;
            
            // Movement
            let moveX = 0, moveZ = 0;
            if (keys['w'] || keys['arrowup']) moveZ = -1;
            if (keys['s'] || keys['arrowdown']) moveZ = 1;
            if (keys['a'] || keys['arrowleft']) moveX = -1;
            if (keys['d'] || keys['arrowright']) moveX = 1;
            
            if (moveX !== 0 || moveZ !== 0) {
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= length;
                moveZ /= length;
                
                const movement = new THREE.Vector3(moveX, 0, moveZ).multiplyScalar(player.movementSpeed * delta);
                
                // Apply camera-relative movement
                const cameraDir = new THREE.Vector3();
                camera.getWorldDirection(cameraDir);
                cameraDir.y = 0;
                cameraDir.normalize();
                
                const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), cameraDir).normalize();
                
                const finalMovement = new THREE.Vector3()
                    .addScaledVector(right, -moveX)
                    .addScaledVector(cameraDir, -moveZ)
                    .multiplyScalar(player.movementSpeed * delta);
                
                playerMesh.position.add(finalMovement);
                
                // Keep in bounds
                const maxDist = CONFIG.ARENA_SIZE - 2;
                const dist = Math.sqrt(playerMesh.position.x ** 2 + playerMesh.position.z ** 2);
                if (dist > maxDist) {
                    playerMesh.position.x *= maxDist / dist;
                    playerMesh.position.z *= maxDist / dist;
                }
                
                // Rotate to face movement direction
                const angle = Math.atan2(moveX, moveZ);
                playerMesh.rotation.y = angle;
            }
            
            // Animate player
            const time = clock.getElapsedTime();
            playerGlow.scale.setScalar(1 + Math.sin(time * 3) * 0.1);
            
            // Auto attack
            const now = Date.now();
            player.weapons.forEach(weaponKey => {
                const weapon = WEAPONS[weaponKey];
                if (weapon && now - player.lastAttack > weapon.fireRate) {
                    // Find nearest enemy in range
                    let nearest = null;
                    let nearestDist = player.range;
                    
                    gameState.currentEnemies.forEach(enemy => {
                        const dist = enemy.mesh.position.distanceTo(playerMesh.position);
                        if (dist < nearestDist) {
                            nearestDist = dist;
                            nearest = enemy;
                        }
                    });
                    
                    if (nearest) {
                        createProjectile(weaponKey, nearest);
                        player.lastAttack = now;
                    }
                }
            });
            
            // Update camera to follow player
            camera.position.x = playerMesh.position.x;
            camera.position.z = playerMesh.position.z + 20;
            camera.lookAt(playerMesh.position.x, 0, playerMesh.position.z);
        }

        // Update Enemies
        function updateEnemies(delta) {
            if (!gameState.started || gameState.paused) return;
            
            const toRemove = [];
            
            gameState.currentEnemies.forEach(enemy => {
                // Move toward player
                const direction = new THREE.Vector3()
                    .subVectors(playerMesh.position, enemy.mesh.position)
                    .normalize();
                
                let speed = enemy.speed;
                if (enemy.slowed) {
                    speed *= 0.5;
                    enemy.slowTimer -= delta * 1000;
                    if (enemy.slowTimer <= 0) {
                        enemy.slowed = false;
                    }
                }
                
                enemy.mesh.position.add(direction.multiplyScalar(speed * delta));
                
                // Face player
                enemy.mesh.lookAt(playerMesh.position);
                
                // Rotate boss orbs
                if (enemy.orbs) {
                    const time = clock.getElapsedTime();
                    enemy.orbs.forEach((orb, i) => {
                        const angle = orb.angle + time * 2;
                        orb.mesh.position.x = Math.cos(angle) * 4;
                        orb.mesh.position.z = Math.sin(angle) * 4;
                        orb.mesh.position.y = 4 + Math.sin(time * 3 + i) * 1;
                    });
                }
                
                // Bob animation
                enemy.mesh.position.y = Math.sin(clock.getElapsedTime() * 3 + enemy.mesh.id) * 0.2;
                
                // Check collision with player
                const dist = enemy.mesh.position.distanceTo(playerMesh.position);
                if (dist < enemy.size + 1) {
                    takeDamage(enemy.damage);
                }
            });
        }

        // Update Projectiles
        function updateProjectiles(delta) {
            if (!gameState.started || gameState.paused) return;
            
            const toRemove = [];
            
            gameState.projectiles.forEach((projectile, index) => {
                const movement = projectile.velocity.clone().multiplyScalar(delta);
                projectile.mesh.position.add(movement);
                projectile.distance += movement.length();
                
                // Update trail
                if (projectile.trail) {
                    const positions = projectile.trail.userData.positions;
                    positions.unshift(projectile.mesh.position.clone());
                    if (positions.length > 10) positions.pop();
                    
                    const posArray = new Float32Array(positions.length * 3);
                    positions.forEach((pos, i) => {
                        posArray[i * 3] = pos.x;
                        posArray[i * 3 + 1] = pos.y;
                        posArray[i * 3 + 2] = pos.z;
                    });
                    projectile.trail.geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                }
                
                // Check collision with enemies
                if (projectile.distance > projectile.range) {
                    toRemove.push(index);
                    return;
                }
                
                const weapon = WEAPONS[projectile.weapon];
                
                gameState.currentEnemies.forEach(enemy => {
                    if (projectile.targetsHit.includes(enemy)) return;
                    
                    const dist = projectile.mesh.position.distanceTo(enemy.mesh.position);
                    if (dist < enemy.size + weapon.size) {
                        // Hit!
                        projectile.targetsHit.push(enemy);
                        
                        // Calculate damage
                        let damage = projectile.damage;
                        const isCrit = Math.random() < player.critChance;
                        if (isCrit) damage *= player.critMultiplier;
                        
                        enemy.health -= damage;
                        
                        // Show damage number
                        createDamageNumber(enemy.mesh.position.clone(), damage, isCrit);
                        
                        // Apply slow
                        if (weapon.slow) {
                            enemy.slowed = true;
                            enemy.slowTimer = weapon.duration;
                        }
                        
                        // Create hit particles
                        createParticles(enemy.mesh.position.clone(), weapon.color, 5);
                        
                        // Handle chain lightning
                        if (weapon.chain) {
                            let chainTargets = gameState.currentEnemies
                                .filter(e => e !== enemy && !projectile.targetsHit.includes(e))
                                .sort((a, b) => a.mesh.position.distanceTo(enemy.mesh.position) - b.mesh.position.distanceTo(enemy.mesh.position))
                                .slice(0, weapon.chain);
                            
                            chainTargets.forEach(target => {
                                createChainLightning(enemy.mesh.position, target.mesh.position, weapon.color);
                                target.health -= damage * 0.5;
                                projectile.targetsHit.push(target);
                                createDamageNumber(target.mesh.position.clone(), damage * 0.5, false);
                            });
                        }
                        
                        // Handle area damage
                        if (weapon.area) {
                            gameState.currentEnemies.forEach(e => {
                                if (e !== enemy && !projectile.targetsHit.includes(e)) {
                                    const dist = e.mesh.position.distanceTo(enemy.mesh.position);
                                    if (dist < weapon.area) {
                                        e.health -= damage * 0.5;
                                        projectile.targetsHit.push(e);
                                        createDamageNumber(e.mesh.position.clone(), damage * 0.5, false);
                                    }
                                }
                            });
                            createShockwave(projectile.mesh.position, weapon.area);
                        }
                        
                        // Remove if pierce depleted
                        if (projectile.targetsHit.length >= projectile.pierce) {
                            toRemove.push(index);
                        }
                    }
                });
            });
            
            // Remove dead enemies
            gameState.currentEnemies.forEach((enemy, index) => {
                if (enemy.health <= 0) {
                    // Drop XP
                    createPickup(enemy.mesh.position.clone(), 'xp');
                    
                    // Add score
                    gameState.score += enemy.xpValue;
                    gameState.enemiesKilled++;
                    
                    // Particles
                    createParticles(enemy.mesh.position.clone(), 0xff6600, 15);
                    
                    scene.remove(enemy.mesh);
                    gameState.currentEnemies.splice(index, 1);
                }
            });
            
            // Remove projectiles
            toRemove.reverse().forEach(index => {
                const proj = gameState.projectiles[index];
                scene.remove(proj.mesh);
                if (proj.trail) scene.remove(proj.trail);
                gameState.projectiles.splice(index, 1);
            });
        }

        // Create Chain Lightning
        function createChainLightning(start, end, color) {
            const points = [];
            const segments = 5;
            
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const pos = new THREE.Vector3().lerpVectors(start, end, t);
                pos.y += Math.sin(t * Math.PI) * 2 * (1 - t); // Arc
                pos.x += (Math.random() - 0.5) * 2;
                pos.z += (Math.random() - 0.5) * 2;
                points.push(pos);
            }
            
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: color });
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            
            setTimeout(() => scene.remove(line), 100);
        }

        // Update Pickups
        function updatePickups(delta) {
            if (!gameState.started || gameState.paused) return;
            
            const toRemove = [];
            
            gameState.pickups.forEach((pickup, index) => {
                pickup.lifetime += delta;
                
                // Rotate and bob
                pickup.mesh.rotation.y += delta * 2;
                pickup.mesh.position.y = 1 + Math.sin(pickup.lifetime * 3) * 0.3;
                
                // Attract to player when close
                const dist = pickup.mesh.position.distanceTo(playerMesh.position);
                if (dist < 5) {
                    const dir = new THREE.Vector3()
                        .subVectors(playerMesh.position, pickup.mesh.position)
                        .normalize()
                        .multiplyScalar(10 * delta);
                    pickup.mesh.position.add(dir);
                }
                
                // Collect
                if (dist < 1.5) {
                    if (pickup.type === 'xp') {
                        gainXP(pickup.value);
                    } else if (pickup.type === 'health') {
                        heal(pickup.value);
                    }
                    toRemove.push(index);
                    scene.remove(pickup.mesh);
                }
                
                // Despawn after time
                if (pickup.lifetime > 30) {
                    toRemove.push(index);
                    scene.remove(pickup.mesh);
                }
            });
            
            toRemove.reverse().forEach(index => {
                gameState.pickups.splice(index, 1);
            });
        }

        // Spawn Enemies
        function updateSpawning(delta) {
            if (!gameState.started || gameState.paused) return;
            
            gameState.waveTimer += delta;
            gameState.enemySpawnTimer += delta * 1000;
            
            // Calculate spawn rate based on wave
            const spawnRate = Math.max(500, CONFIG.BASE_ENEMY_SPAWN_RATE - gameState.wave * 100);
            
            if (gameState.enemySpawnTimer > spawnRate && gameState.currentEnemies.length < 50 + gameState.wave * 5) {
                gameState.enemySpawnTimer = 0;
                
                // Determine enemy type based on wave
                let type = 'basic';
                const rand = Math.random();
                
                if (gameState.wave >= 3 && rand < 0.15) type = 'tank';
                else if (gameState.wave >= 2 && rand < 0.3) type = 'fast';
                else if (rand < 0.4) type = 'swarm';
                
                createEnemy(type);
            }
            
            // Wave progression
            if (gameState.waveTimer > CONFIG.WAVE_DURATION) {
                gameState.wave++;
                gameState.waveTimer = 0;
                
                // Spawn boss every 5 waves
                if (gameState.wave % 5 === 0) {
                    showBossWarning();
                    setTimeout(() => createEnemy('boss'), 3000);
                }
                
                // Spawn extra enemies for wave
                for (let i = 0; i < gameState.wave * 3; i++) {
                    setTimeout(() => {
                        if (!gameState.gameOver) {
                            createEnemy(Math.random() < 0.3 ? 'fast' : Math.random() < 0.2 ? 'tank' : 'basic');
                        }
                    }, i * 200);
                }
            }
            
            // Random health pickups
            if (Math.random() < 0.001) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 10 + Math.random() * 20;
                createPickup(new THREE.Vector3(Math.cos(angle) * dist, 0, Math.sin(angle) * dist), 'health');
            }
        }

        // Take Damage
        function takeDamage(amount) {
            player.health -= amount;
            
            // Screen shake effect
            const shake = 0.5;
            camera.position.x += (Math.random() - 0.5) * shake;
            camera.position.y += (Math.random() - 0.5) * shake;
            
            // Red flash
            document.getElementById('healthBar').style.background = 'linear-gradient(90deg, #ff0000, #ff6666)';
            setTimeout(() => {
                document.getElementById('healthBar').style.background = 'linear-gradient(90deg, #ff3366, #ff6b9d)';
            }, 100);
            
            if (player.health <= 0) {
                player.health = 0;
                gameOver();
            }
            
            updateUI();
        }

        // Heal
        function heal(amount) {
            player.health = Math.min(player.maxHealth, player.health + amount);
            updateUI();
        }

        // Gain XP
        function gainXP(amount) {
            gameState.xp += amount;
            
            if (gameState.xp >= gameState.nextLevelXP) {
                gameState.xp -= gameState.nextLevelXP;
                gameState.level++;
                gameState.nextLevelXP = Math.floor(gameState.nextLevelXP * 1.5);
                
                // Heal on level up
                player.health = Math.min(player.maxHealth, player.health + player.maxHealth * 0.25);
                
                showUpgradeMenu();
            }
            
            updateUI();
        }

        // Show Upgrade Menu
        function showUpgradeMenu() {
            gameState.paused = true;
            
            const menu = document.getElementById('upgradeMenu');
            const optionsContainer = document.getElementById('upgradeOptions');
            optionsContainer.innerHTML = '';
            
            // Get 3 random upgrades
            const availableUpgrades = UPGRADE_POOL.filter(u => {
                if (u.type === 'weapon') return !player.weapons.includes(u.id);
                if (u.type === 'ability') return !player.abilities?.includes(u.id);
                return true;
            });
            
            const choices = [];
            for (let i = 0; i < 3 && availableUpgrades.length > 0; i++) {
                const idx = Math.floor(Math.random() * availableUpgrades.length);
                choices.push(availableUpgrades[idx]);
                availableUpgrades.splice(idx, 1);
            }
            
            choices.forEach(upgrade => {
                const div = document.createElement('div');
                div.className = 'upgrade-option';
                div.innerHTML = `
                    <span class="upgrade-icon">${upgrade.icon}</span>
                    <div>
                        <h3>${upgrade.name}</h3>
                        <p>${upgrade.description}</p>
                    </div>
                `;
                div.onclick = () => applyUpgrade(upgrade);
                optionsContainer.appendChild(div);
            });
            
            menu.style.display = 'block';
        }

        // Apply Upgrade
        function applyUpgrade(upgrade) {
            switch(upgrade.id) {
                case 'plasmaBolt':
                case 'fireBurst':
                case 'lightningChain':
                case 'iceShard':
                case 'voidOrb':
                    if (!player.weapons.includes(upgrade.id)) {
                        player.weapons.push(upgrade.id);
                    }
                    break;
                case 'damage':
                    player.damage *= 1.2;
                    break;
                case 'attackSpeed':
                    player.weapons.forEach(w => {
                        if (WEAPONS[w]) WEAPONS[w].fireRate *= 0.85;
                    });
                    break;
                case 'health':
                    player.maxHealth += 25;
                    player.health = Math.min(player.health + 25, player.maxHealth);
                    break;
                case 'speed':
                    player.movementSpeed *= 1.1;
                    break;
                case 'range':
                    player.range *= 1.2;
                    break;
                case 'crit':
                    player.critChance += 0.05;
                    break;
                case 'shockwave':
                case 'teleport':
                case 'shield':
                    if (!player.abilities) player.abilities = [];
                    if (!player.abilities.includes(upgrade.id)) {
                        player.abilities.push(upgrade.id);
                    }
                    break;
            }
            
            document.getElementById('upgradeMenu').style.display = 'none';
            gameState.paused = false;
            
            // Update weapon indicator
            updateWeaponIndicator();
        }

        // Update Weapon Indicator
        function updateWeaponIndicator() {
            const weapons = player.weapons.map(w => WEAPONS[w].name).join(', ');
            document.querySelector('#weaponIndicator .weapon-name').textContent = weapons;
        }

        // Show Boss Warning
        function showBossWarning() {
            const warning = document.getElementById('bossWarning');
            warning.style.display = 'block';
            setTimeout(() => warning.style.display = 'none', 3000);
        }

        // Update UI
        function updateUI() {
            document.getElementById('scoreText').textContent = gameState.score.toLocaleString();
            document.getElementById('waveText').textContent = gameState.wave;
            document.getElementById('enemyCount').textContent = `Enemies: ${gameState.currentEnemies.length}`;
            
            const healthPercent = (player.health / player.maxHealth) * 100;
            document.getElementById('healthBar').style.width = healthPercent + '%';
            document.getElementById('healthText').textContent = `${Math.round(player.health)} / ${player.maxHealth}`;
            
            const xpPercent = (gameState.xp / gameState.nextLevelXP) * 100;
            document.getElementById('xpBar').style.width = xpPercent + '%';
            document.getElementById('levelText').textContent = `LEVEL ${gameState.level}`;
        }

        // Game Over
        function gameOver() {
            gameState.gameOver = true;
            
            document.getElementById('finalScore').textContent = gameState.score.toLocaleString();
            document.getElementById('finalWave').textContent = gameState.wave;
            document.getElementById('finalKills').textContent = gameState.enemiesKilled;
            document.getElementById('finalLevel').textContent = gameState.level;
            
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        // Restart Game
        function restartGame() {
            // Reset game state
            gameState = {
                started: true,
                paused: false,
                gameOver: false,
                score: 0,
                wave: 1,
                level: 1,
                xp: 0,
                enemiesKilled: 0,
                time: 0,
                waveTimer: 0,
                enemySpawnTimer: 0,
                currentEnemies: [],
                projectiles: [],
                pickups: [],
                damageNumbers: [],
                upgrades: [],
                nextLevelXP: CONFIG.XP_PER_LEVEL
            };
            
            // Reset player
            player = {
                health: CONFIG.PLAYER_MAX_HEALTH,
                maxHealth: CONFIG.PLAYER_MAX_HEALTH,
                damage: 10,
                attackSpeed: 500,
                lastAttack: 0,
                range: 15,
                critChance: 0.1,
                critMultiplier: 2,
                movementSpeed: CONFIG.PLAYER_SPEED,
                weapons: ['plasmaBolt'],
                abilities: [],
                abilityCooldowns: {}
            };
            
            // Reset weapon fire rates
            Object.keys(WEAPONS).forEach(key => {
                const weapon = WEAPONS[key];
                weapon.fireRate = {
                    plasmaBolt: 500,
                    fireBurst: 800,
                    lightningChain: 400,
                    iceShard: 600,
                    voidOrb: 1000
                }[key] || 500;
            });
            
            // Clear scene enemies, projectiles, pickups
            gameState.currentEnemies.forEach(e => scene.remove(e.mesh));
            gameState.projectiles.forEach(p => {
                scene.remove(p.mesh);
                if (p.trail) scene.remove(p.trail);
            });
            gameState.pickups.forEach(p => scene.remove(p.mesh));
            
            // Reset player position
            playerMesh.position.set(0, 0, 0);
            
            // Update UI
            updateUI();
            updateWeaponIndicator();
            
            // Hide screens
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('upgradeMenu').style.display = 'none';
            
            // Start spawning
            for (let i = 0; i < 5; i++) {
                createEnemy('basic');
            }
        }

        // Window Resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Input Handlers
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === 'Escape') {
                if (gameState.started && !gameState.gameOver) {
                    gameState.paused = !gameState.paused;
                    document.getElementById('pauseOverlay').style.display = gameState.paused ? 'flex' : 'none';
                }
            }
            
            // Ability hotkeys (1, 2, 3)
            if (gameState.started && !gameState.paused && !gameState.gameOver) {
                if (e.key === '1' && player.abilities) useAbility(0);
                if (e.key === '2' && player.abilities) useAbility(1);
                if (e.key === '3' && player.abilities) useAbility(2);
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Use Ability
        function useAbility(index) {
            if (!player.abilities || !player.abilities[index]) return;
            
            const abilityId = player.abilities[index];
            const ability = ABILITIES[abilityId];
            const now = Date.now();
            
            if (player.abilityCooldowns[abilityId] && now - player.abilityCooldowns[abilityId] < ability.cooldown) {
                return; // On cooldown
            }
            
            player.abilityCooldowns[abilityId] = now;
            
            switch(abilityId) {
                case 'shockwave':
                    // Damage all nearby enemies
                    gameState.currentEnemies.forEach(enemy => {
                        const dist = enemy.mesh.position.distanceTo(playerMesh.position);
                        if (dist < ability.radius) {
                            enemy.health -= ability.damage;
                            createDamageNumber(enemy.mesh.position.clone(), ability.damage, false);
                        }
                    });
                    createShockwave(playerMesh.position.clone(), ability.radius);
                    createParticles(playerMesh.position.clone(), 0x00ffcc, 20);
                    break;
                    
                case 'teleport':
                    // Dash in movement direction
                    let dx = 0, dz = 0;
                    if (keys['w'] || keys['arrowup']) dz = -1;
                    if (keys['s'] || keys['arrowdown']) dz = 1;
                    if (keys['a'] || keys['arrowleft']) dx = -1;
                    if (keys['d'] || keys['arrowright']) dx = 1;
                    
                    if (dx !== 0 || dz !== 0) {
                        const len = Math.sqrt(dx * dx + dz * dz);
                        dx /= len;
                        dz /= len;
                        
                        playerMesh.position.x += dx * ability.distance;
                        playerMesh.position.z += dz * ability.distance;
                        
                        // Keep in bounds
                        const maxDist = CONFIG.ARENA_SIZE - 2;
                        const dist = Math.sqrt(playerMesh.position.x ** 2 + playerMesh.position.z ** 2);
                        if (dist > maxDist) {
                            playerMesh.position.x *= maxDist / dist;
                            playerMesh.position.z *= maxDist / dist;
                        }
                        
                        createParticles(playerMesh.position.clone(), 0x00ffcc, 10);
                    }
                    break;
                    
                case 'shield':
                    // Temporarily absorb damage
                    player.health += ability.absorption;
                    player.shielded = true;
                    setTimeout(() => {
                        player.shielded = false;
                    }, ability.duration);
                    createParticles(playerMesh.position.clone(), 0x00ffcc, 15);
                    break;
            }
        }

        // Main Game Loop
        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            
            if (gameState.started && !gameState.paused && !gameState.gameOver) {
                gameState.time += delta;
                
                updatePlayer(delta);
                updateEnemies(delta);
                updateProjectiles(delta);
                updatePickups(delta);
                updateSpawning(delta);
                updateUI();
            }
            
            renderer.render(scene, camera);
        }

        // Initialize Game
        function init() {
            initThreeJS();
            
            // Start button
            document.getElementById('startBtn').addEventListener('click', () => {
                document.getElementById('startScreen').style.display = 'none';
                gameState.started = true;
                
                // Spawn initial enemies
                for (let i = 0; i < 5; i++) {
                    createEnemy('basic');
                }
            });
            
            // Restart button
            document.getElementById('restartBtn').addEventListener('click', restartGame);
            
            // Update UI initially
            updateUI();
            updateWeaponIndicator();
            
            // Start game loop
            gameLoop();
        }

        // Start the game
        init();
    </script>
</body>
</html>
