<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survivor Action Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #health-bar-container { position: absolute; top: 20px; left: 20px; width: 200px; height: 20px; border: 1px solid white; }
        #health-bar { width: 100%; height: 100%; background-color: red; }
        #experience-bar-container { position: absolute; bottom: 20px; left: 20px; width: 200px; height: 10px; border: 1px solid white; }
        #experience-bar { width: 0%; height: 100%; background-color: cyan; }
        #level-text { position: absolute; bottom: 35px; left: 20px; color: white; font-size: 16px; }
    </style>
</head>
<body>
    <div id="ui-container">
        <div id="health-bar-container">
            <div id="health-bar"></div>
        </div>
        <div id="experience-bar-container">
            <div id="experience-bar"></div>
        </div>
        <div id="level-text">Level: 1</div>

    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // Basic scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.shadowMap.enabled = true;

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ground
        const groundGeometry = new THREE.PlaneGeometry(100, 100, 50, 50);
                const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22, wireframe: false });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function simplexNoise(x, y) {
            // A simple placeholder for a noise function. 
            // A real implementation would be more complex.
            return (Math.sin(x * 0.1) + Math.sin(y * 0.1)) * 2;
        }

        const vertices = ground.geometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            vertices[i+2] = simplexNoise(vertices[i], vertices[i+1]);
        }
        ground.geometry.attributes.position.needsUpdate = true;
                ground.geometry.computeVertexNormals();

        function createTree() {
            const trunkGeometry = new THREE.CylinderGeometry(0.1, 0.2, 1, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);

            const leavesGeometry = new THREE.ConeGeometry(0.5, 1.5, 8);
            const leavesMaterial = new THREE.MeshStandardMaterial({ color: 0x006400 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 1;

            const tree = new THREE.Group();
            tree.add(trunk);
            tree.add(leaves);

            return tree;
        }

        for (let i = 0; i < 50; i++) {
            const tree = createTree();
            const x = (Math.random() - 0.5) * 100;
            const z = (Math.random() - 0.5) * 100;
            const y = simplexNoise(x, z) + 0.5;
            tree.position.set(x, y, z);
            scene.add(tree);
        }

        function createRock() {
            const rockGeometry = new THREE.DodecahedronGeometry(0.5, 0);
            const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x696969 });
            const rock = new THREE.Mesh(rockGeometry, rockMaterial);
            return rock;
        }

        for (let i = 0; i < 100; i++) {
            const rock = createRock();
            const x = (Math.random() - 0.5) * 100;
            const z = (Math.random() - 0.5) * 100;
            const y = simplexNoise(x, z) + 0.25;
            rock.position.set(x, y, z);
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            scene.add(rock);
        }


        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Player
        const playerGeometry = new THREE.BoxGeometry(1, 1, 1);
        const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        player.health = 100;
        player.experience = 0;
        player.level = 1;


        player.position.y = 0.5;
        scene.add(player);

        const enemyGeometry = new THREE.BoxGeometry(1, 1, 1);
        const enemyMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const enemies = [];
        const projectiles = [];
        const projectileGeometry = new THREE.SphereGeometry(0.1, 8, 8);
        const projectileMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const experienceOrbGeometry = new THREE.SphereGeometry(0.2, 8, 8);
        const experienceOrbMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const experienceOrbs = [];



        function spawnEnemy() {
            const enemy = new THREE.Mesh(enemyGeometry, enemyMaterial);
            enemy.position.x = player.position.x + (Math.random() - 0.5) * 20;
            enemy.position.z = player.position.z + (Math.random() - 0.5) * 20;
            enemy.position.y = 0.5;
            scene.add(enemy);
            enemies.push(enemy);
        }

                setInterval(spawnEnemy, 1000);

        function findClosestEnemy() {
            let closestEnemy = null;
            let minDistance = Infinity;
            enemies.forEach(enemy => {
                const distance = player.position.distanceTo(enemy.position);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestEnemy = enemy;
                }
            });
            return closestEnemy;
        }

        function spawnProjectile() {
            const closestEnemy = findClosestEnemy();
            if (!closestEnemy) return;

            const projectile = new THREE.Mesh(projectileGeometry, projectileMaterial);
            projectile.position.copy(player.position);
            const direction = new THREE.Vector3().subVectors(closestEnemy.position, player.position).normalize();
            projectile.userData.velocity = direction.multiplyScalar(0.5);
            scene.add(projectile);
            projectiles.push(projectile);
        }

        setInterval(spawnProjectile, 500);


        player.position.y = 0.5;
        scene.add(player);

        camera.position.z = 5;
        camera.position.y = 5;
        camera.lookAt(player.position);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.near = 0.1;
        directionalLight.shadow.camera.far = 200;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;

        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);

        // Game loop
        
        const keys = {};
        document.addEventListener('keydown', (e) => (keys[e.key] = true));
        document.addEventListener('keyup', (e) => (keys[e.key] = false));
        const playerSpeed = 0.1;

        function animate() {
            if (keys['w']) player.position.z -= playerSpeed;
            if (keys['s']) player.position.z += playerSpeed;
            if (keys['a']) player.position.x -= playerSpeed;
            if (keys['d']) player.position.x += playerSpeed;

            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 5;

            projectiles.forEach((projectile, pIndex) => {
                projectile.position.add(projectile.userData.velocity);

                if (projectile.position.distanceTo(player.position) > 50) {
                    scene.remove(projectile);
                    projectiles.splice(pIndex, 1);
                }
            });

            for (let i = experienceOrbs.length - 1; i >= 0; i--) {
                const orb = experienceOrbs[i];
                if (player.position.distanceTo(orb.position) < 1.5) {
                    player.experience += 10;
                    scene.remove(orb);
                    experienceOrbs.splice(i, 1);

                    if (player.experience >= 100) {
                        player.level++;
                        player.experience = 0;
                        document.getElementById('level-text').innerText = 'Level: ' + player.level;
                    }
                    document.getElementById('experience-bar').style.width = player.experience + '%';
                }
            }

            for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
                const enemy = enemies[eIndex];

                if (player.position.distanceTo(enemy.position) < 1) {
                    player.health -= 10;
                    document.getElementById('health-bar').style.width = player.health + '%';
                    scene.remove(enemy);
                    enemies.splice(eIndex, 1);

                    if (player.health <= 0) {
                        alert('Game Over');
                    }
                    continue;
                }


                const enemy = enemies[eIndex];
                enemy.position.x += (player.position.x - enemy.position.x) * 0.01;
                enemy.position.z += (player.position.z - enemy.position.z) * 0.01;

                for (let pIndex = projectiles.length - 1; pIndex >= 0; pIndex--) {
                    const projectile = projectiles[pIndex];
                    if (projectile.position.distanceTo(enemy.position) < 1) {
                        scene.remove(projectile);
                        projectiles.splice(pIndex, 1);
                        scene.remove(enemy);
                        enemies.splice(eIndex, 1);

                        const experienceOrb = new THREE.Mesh(experienceOrbGeometry, experienceOrbMaterial);
                        experienceOrb.position.copy(enemy.position);
                        scene.add(experienceOrb);
                        experienceOrbs.push(experienceOrb);
                    }
                }
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
