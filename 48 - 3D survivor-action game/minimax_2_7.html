<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOIDWALKER: Last Stand</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0a15; 
            font-family: 'Orbitron', sans-serif;
            cursor: crosshair;
        }
        #gameCanvas { display: block; }
        
        #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .hud-element { position: absolute; color: white; text-shadow: 0 0 10px currentColor; }
        
        #healthContainer { top: 20px; left: 20px; width: 250px; }
        #healthBar { width: 100%; height: 24px; background: rgba(0,0,0,0.7); border: 2px solid #ff3333; border-radius: 12px; overflow: hidden; }
        #healthFill { height: 100%; background: linear-gradient(90deg, #ff0000, #ff4444); transition: width 0.3s; box-shadow: 0 0 20px #ff0000; }
        #healthText { font-size: 12px; margin-top: 4px; color: #ff6666; }
        
        #waveContainer { top: 20px; left: 50%; transform: translateX(-50%); text-align: center; }
        #waveNumber { font-size: 28px; color: #ff00ff; font-weight: 900; }
        #score { font-size: 16px; color: #00ffcc; margin-top: 5px; }
        
        #xpContainer { top: 20px; right: 20px; width: 250px; text-align: right; }
        #levelBadge { font-size: 20px; color: #ffff00; font-weight: 700; margin-bottom: 5px; }
        #xpBar { width: 100%; height: 16px; background: rgba(0,0,0,0.7); border: 2px solid #ffff00; border-radius: 8px; overflow: hidden; }
        #xpFill { height: 100%; background: linear-gradient(90deg, #ffaa00, #ffff00); transition: width 0.2s; box-shadow: 0 0 15px #ffff00; }
        
        #weaponBar { bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
        .weapon-slot { 
            width: 70px; height: 70px; 
            background: rgba(0,0,0,0.8); 
            border: 3px solid #00ffcc; 
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
        }
        .weapon-slot.active { border-color: #ff00ff; box-shadow: 0 0 30px rgba(255,0,255,0.5); }
        .weapon-icon { font-size: 28px; }
        .weapon-cooldown { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: rgba(0,0,0,0.6); border-radius: 0 0 9px 9px;
            transition: height 0.1s;
        }
        .weapon-key { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #00ffcc; }
        
        #damageNumbers { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .damage-num { 
            position: absolute; font-weight: 900; 
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.5); }
        }
        
        #titleScreen, #gameOverScreen, #levelUpScreen, #bossWarning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(10,10,21,0.95); z-index: 100;
            pointer-events: auto;
        }
        
        #titleScreen h1 { 
            font-size: 64px; color: #00ffcc; 
            text-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffcc;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        #titleScreen h2 { font-size: 24px; color: #ff00ff; margin-bottom: 40px; }
        #titleScreen p { font-size: 18px; color: #aaa; margin: 10px 0; }
        .start-btn {
            margin-top: 40px; padding: 20px 60px;
            font-size: 24px; font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #00ffcc, #00aa88);
            border: none; border-radius: 10px;
            color: #0a0a15; font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(0,255,204,0.5);
            transition: all 0.3s;
        }
        .start-btn:hover { transform: scale(1.1); box-shadow: 0 0 60px rgba(0,255,204,0.8); }
        
        #gameOverScreen h1 { font-size: 72px; color: #ff3333; text-shadow: 0 0 50px #ff3333; }
        #gameOverScreen .stats { font-size: 24px; color: #ffff00; margin: 30px 0; }
        
        #bossWarning {
            background: rgba(255,0,102,0.2);
            animation: bossFlash 0.5s infinite;
        }
        @keyframes bossFlash {
            0%, 100% { background: rgba(255,0,102,0.2); }
            50% { background: rgba(255,0,102,0.4); }
        }
        #bossWarning h1 { font-size: 64px; color: #ff0066; text-shadow: 0 0 40px #ff0066; animation: shake 0.5s infinite; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        #levelUpScreen { background: rgba(10,10,21,0.9); }
        #levelUpScreen h1 { font-size: 48px; color: #ffff00; text-shadow: 0 0 30px #ffff00; margin-bottom: 40px; }
        #upgradeCards { display: flex; gap: 30px; }
        .upgrade-card {
            width: 220px; padding: 30px;
            background: linear-gradient(135deg, rgba(30,30,60,0.9), rgba(50,50,80,0.9));
            border: 3px solid #00ffcc;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .upgrade-card:hover {
            transform: translateY(-20px) scale(1.05);
            border-color: #ff00ff;
            box-shadow: 0 0 50px rgba(255,0,255,0.5);
        }
        .upgrade-icon { font-size: 48px; margin-bottom: 15px; }
        .upgrade-title { font-size: 18px; color: #00ffcc; margin-bottom: 10px; font-weight: 700; }
        .upgrade-desc { font-size: 14px; color: #aaa; }
        
        #killCombo { 
            position: fixed; top: 50%; right: 30px; 
            font-size: 36px; color: #ff00ff;
            text-shadow: 0 0 20px #ff00ff;
            opacity: 0; transition: opacity 0.3s;
        }
        
        #pickupNotification {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            font-size: 20px; padding: 10px 30px;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            opacity: 0; transition: opacity 0.3s;
        }
        
        .screen-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
            opacity: 0;
        }
        #damageFlash { background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.3)); }
        #killFlash { background: radial-gradient(circle, rgba(0,255,204,0.2), transparent); }
    </style>
</head>
<body>
    <div id="ui">
        <div id="healthContainer" class="hud-element">
            <div id="healthBar"><div id="healthFill"></div></div>
            <div id="healthText">100 / 100</div>
        </div>
        
        <div id="waveContainer" class="hud-element">
            <div id="waveNumber">WAVE 1</div>
            <div id="score">SCORE: 0</div>
        </div>
        
        <div id="xpContainer" class="hud-element">
            <div id="levelBadge">LEVEL 1</div>
            <div id="xpBar"><div id="xpFill"></div></div>
        </div>
        
        <div id="weaponBar">
            <div class="weapon-slot active" data-weapon="0">
                <span class="weapon-key">1</span>
                <span class="weapon-icon">⚡</span>
                <div class="weapon-cooldown"></div>
            </div>
            <div class="weapon-slot" data-weapon="1">
                <span class="weapon-key">2</span>
                <span class="weapon-icon">💥</span>
                <div class="weapon-cooldown"></div>
            </div>
            <div class="weapon-slot" data-weapon="2">
                <span class="weapon-key">3</span>
                <span class="weapon-icon">🌀</span>
                <div class="weapon-cooldown"></div>
            </div>
        </div>
        
        <div id="damageNumbers"></div>
        <div id="killCombo"></div>
        <div id="pickupNotification"></div>
        <div id="damageFlash" class="screen-flash"></div>
        <div id="killFlash" class="screen-flash"></div>
    </div>
    
    <div id="titleScreen">
        <h1>VOIDWALKER</h1>
        <h2>LAST STAND</h2>
        <p>Survive the endless horde</p>
        <p>Auto-attack enabled • WASD/Arrows to move</p>
        <p>Press 1-2-3 to switch weapons</p>
        <button class="start-btn" onclick="game.start()">ENTER THE VOID</button>
    </div>
    
    <div id="gameOverScreen" style="display:none;">
        <h1>VOID CONSUMED</h1>
        <div class="stats">
            <div>Wave Reached: <span id="finalWave">1</span></div>
            <div>Final Score: <span id="finalScore">0</span></div>
            <div>Enemies Slain: <span id="finalKills">0</span></div>
        </div>
        <button class="start-btn" onclick="game.restart()">RISE AGAIN</button>
    </div>
    
    <div id="bossWarning" style="display:none;">
        <h1>⚠ BOSS INCOMING ⚠</h1>
    </div>
    
    <div id="levelUpScreen" style="display:none;">
        <h1>LEVEL UP!</h1>
        <div id="upgradeCards"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ==================== GAME CONFIGURATION ====================
    const CONFIG = {
        ARENA_SIZE: 80,
        HERO_SPEED: 12,
        HERO_MAX_HP: 100,
        XP_BASE: 10,
        WAVE_BASE_ENEMIES: 5,
        WAVE_ENEMY_INCREASE: 3,
        BOSS_WAVE_INTERVAL: 5,
        PICKUP_SPAWN_CHANCE: 0.15
    };

    const WEAPONS = [
        { name: 'Void Bolt', damage: 15, fireRate: 0.4, range: 25, projectileSpeed: 35, color: 0x00ffcc, icon: '⚡', aoe: false },
        { name: 'Nova Burst', damage: 25, fireRate: 1.5, range: 8, projectileSpeed: 0, color: 0xff00ff, icon: '💥', aoe: true },
        { name: 'Void Aura', damage: 5, fireRate: 0.3, range: 6, projectileSpeed: 0, color: 0x8800ff, icon: '🌀', aoe: true }
    ];

    const ENEMY_TYPES = [
        { name: 'Crawler', hp: 30, speed: 4, damage: 8, xp: 10, color: 0xff3333, scale: 0.8 },
        { name: 'Dasher', hp: 20, speed: 10, damage: 12, xp: 15, color: 0xff8800, scale: 0.6 },
        { name: 'Tank', hp: 120, speed: 2, damage: 20, xp: 40, color: 0x8800ff, scale: 1.5 },
        { name: 'Swarm', hp: 10, speed: 8, damage: 5, xp: 5, color: 0xff66aa, scale: 0.4 }
    ];

    const BOSS_CONFIG = {
        name: 'Void Titan',
        hp: 800,
        speed: 3,
        damage: 35,
        xp: 200,
        color: 0xff0066,
        scale: 3
    };

    const UPGRADES = [
        { id: 'damage', title: 'Void Power', desc: '+15% Attack Damage', icon: '⚔️', apply: (g) => g.damageMultiplier *= 1.15 },
        { id: 'speed', title: 'Swift Step', desc: '+10% Movement Speed', icon: '👟', apply: (g) => g.speedMultiplier *= 1.1 },
        { id: 'health', title: 'Vitality', desc: '+25 Max HP (Heals)', icon: '❤', apply: (g) => { g.maxHp += 25; g.hp = Math.min(g.hp + 25, g.maxHp); }},
        { id: 'attackSpeed', title: 'Rapid Fire', desc: '+12% Attack Speed', icon: '⚡', apply: (g) => g.fireRateMultiplier *= 1.12 },
        { id: 'armor', title: 'Void Shield', desc: '-10% Damage Taken', icon: '🛡', apply: (g) => g.armorMultiplier *= 0.9 },
        { id: 'xpGain', title: 'Soul Harvest', desc: '+20% XP Gain', icon: '💎', apply: (g) => g.xpMultiplier *= 1.2 },
        { id: 'lifesteal', title: 'Drain', desc: '+3% Life Steal', icon: '🩸', apply: (g) => g.lifesteal += 0.03 },
        { id: 'crit', title: 'Precision', desc: '+8% Crit Chance', icon: '🎯', apply: (g) => g.critChance += 0.08 }
    ];

    // ==================== THREE.JS SETUP ====================
    let scene, camera, renderer, clock;
    let hero, arena;
    let projectiles = [];
    let enemies = [];
    let particles = [];
    let pickups = [];
    let damageNumbers = [];
    let game;

    function initThreeJS() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a15, 0.015);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 30);
        camera.lookAt(0, 0, 0);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.insertBefore(renderer.domElement, document.body.firstChild);
        renderer.domElement.id = 'gameCanvas';
        
        clock = new THREE.Clock();
        
        // Lighting
        const ambient = new THREE.AmbientLight(0x222244, 0.4);
        scene.add(ambient);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(20, 40, 20);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 100;
        mainLight.shadow.camera.left = -50;
        mainLight.shadow.camera.right = 50;
        mainLight.shadow.camera.top = 50;
        mainLight.shadow.camera.bottom = -50;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x00ffcc, 0.5, 50);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);
        
        const rimLight = new THREE.PointLight(0xff00ff, 0.3, 50);
        rimLight.position.set(10, 5, 10);
        scene.add(rimLight);
        
        createArena();
        createHero();
        
        window.addEventListener('resize', onWindowResize);
    }

    function createArena() {
        // Main ground
        const groundGeo = new THREE.CylinderGeometry(CONFIG.ARENA_SIZE, CONFIG.ARENA_SIZE, 2, 64);
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a2e,
            metalness: 0.3,
            roughness: 0.8
        });
        arena = new THREE.Mesh(groundGeo, groundMat);
        arena.receiveShadow = true;
        arena.position.y = -1;
        scene.add(arena);
        
        // Grid pattern
        const gridHelper = new THREE.GridHelper(CONFIG.ARENA_SIZE * 2, 40, 0x2a2a4e, 0x2a2a4e);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);
        
        // Glowing ring
        const ringGeo = new THREE.TorusGeometry(CONFIG.ARENA_SIZE - 2, 0.3, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.5 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.1;
        scene.add(ring);
        
        // Edge glow
        const edgeGeo = new THREE.TorusGeometry(CONFIG.ARENA_SIZE, 1, 16, 100);
        const edgeMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.2 });
        const edge = new THREE.Mesh(edgeGeo, edgeMat);
        edge.rotation.x = Math.PI / 2;
        edge.position.y = -0.5;
        scene.add(edge);
        
        // Floating crystals in background
        for (let i = 0; i < 30; i++) {
            const size = Math.random() * 2 + 1;
            const crystalGeo = new THREE.OctahedronGeometry(size);
            const crystalMat = new THREE.MeshBasicMaterial({ 
                color: Math.random() > 0.5 ? 0x00ffcc : 0xff00ff,
                transparent: true,
                opacity: 0.3
            });
            const crystal = new THREE.Mesh(crystalGeo, crystalMat);
            const angle = Math.random() * Math.PI * 2;
            const dist = CONFIG.ARENA_SIZE + Math.random() * 40;
            crystal.position.set(
                Math.cos(angle) * dist,
                Math.random() * 20 + 5,
                Math.sin(angle) * dist
            );
            crystal.userData.rotSpeed = (Math.random() - 0.5) * 0.5;
            crystal.userData.floatOffset = Math.random() * Math.PI * 2;
            scene.add(crystal);
        }
    }

    function createHero() {
        hero = new THREE.Group();
        
        // Body - crystalline torso
        const bodyGeo = new THREE.OctahedronGeometry(0.8, 0);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x00ffcc, 
            emissive: 0x00ffcc,
            emissiveIntensity: 0.3,
            metalness: 0.8,
            roughness: 0.2
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.5;
        body.castShadow = true;
        hero.add(body);
        
        // Head
        const headGeo = new THREE.IcosahedronGeometry(0.5, 0);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.y = 2.8;
        head.castShadow = true;
        hero.add(head);
        
        // Core glow
        const coreGeo = new THREE.SphereGeometry(0.3, 16, 16);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.position.y = 1.5;
        hero.add(core);
        
        // Energy wings
        for (let i = 0; i < 2; i++) {
            const wingGeo = new THREE.ConeGeometry(0.5, 2, 4);
            const wingMat = new THREE.MeshBasicMaterial({ 
                color: i === 0 ? 0x00ffcc : 0xff00ff,
                transparent: true,
                opacity: 0.7
            });
            const wing = new THREE.Mesh(wingGeo, wingMat);
            wing.position.set(i === 0 ? -1 : 1, 1.5, 0);
            wing.rotation.z = i === 0 ? Math.PI / 4 : -Math.PI / 4;
            hero.add(wing);
        }
        
        // Floating orbs around hero
        for (let i = 0; i < 3; i++) {
            const orbGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const orbMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
            const orb = new THREE.Mesh(orbGeo, orbMat);
            orb.userData.angle = (i / 3) * Math.PI * 2;
            orb.userData.radius = 1.5;
            orb.userData.speed = 2 + i * 0.5;
            hero.add(orb);
            hero.userData.orbs = hero.userData.orbs || [];
            hero.userData.orbs.push(orb);
        }
        
        scene.add(hero);
    }

    function createEnemy(type, isBoss = false) {
        const enemy = new THREE.Group();
        const config = isBoss ? BOSS_CONFIG : type;
        
        // Main body
        const bodyGeo = isBoss ? 
            new THREE.BoxGeometry(2, 3, 2) : 
            new THREE.DodecahedronGeometry(config.scale, 0);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: config.color,
            emissive: config.color,
            emissiveIntensity: 0.4,
            metalness: 0.6,
            roughness: 0.3
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        enemy.add(body);
        
        // Eyes
        const eyeGeo = new THREE.SphereGeometry(0.2 * config.scale, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = -1; i <= 1; i += 2) {
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.set(i * 0.3 * config.scale, 0.3 * config.scale, config.scale * 0.6);
            enemy.add(eye);
        }
        
        // Boss crown spikes
        if (isBoss) {
            for (let i = 0; i < 5; i++) {
                const spikeGeo = new THREE.ConeGeometry(0.3, 1.5, 4);
                const spike = new THREE.Mesh(spikeGeo, bodyMat);
                spike.position.set((i - 2) * 0.6, 2, 0);
                enemy.add(spike);
            }
        }
        
        enemy.userData = {
            type: config.name,
            hp: config.hp,
            maxHp: config.hp,
            speed: config.speed,
            damage: config.damage,
            xp: config.xp,
            scale: config.scale,
            isBoss: isBoss,
            attackCooldown: 0,
            dashCooldown: type.name === 'Dasher' ? 2 : 0,
            isDashing: false
        };
        
        // Spawn at edge
        const angle = Math.random() * Math.PI * 2;
        const dist = CONFIG.ARENA_SIZE + 5;
        enemy.position.set(
            Math.cos(angle) * dist,
            config.scale,
            Math.sin(angle) * dist
        );
        
        scene.add(enemy);
        enemies.push(enemy);
        return enemy;
    }

    function createProjectile(origin, target, weapon) {
        const projectile = new THREE.Group();
        
        const boltGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const boltMat = new THREE.MeshBasicMaterial({ color: weapon.color });
        const bolt = new THREE.Mesh(boltGeo, boltMat);
        projectile.add(bolt);
        
        // Trail
        const trailGeo = new THREE.CylinderGeometry(0.1, 0.3, 1, 8);
        const trailMat = new THREE.MeshBasicMaterial({ 
            color: weapon.color, 
            transparent: true, 
            opacity: 0.5 
        });
        const trail = new THREE.Mesh(trailGeo, trailMat);
        trail.rotation.x = Math.PI / 2;
        trail.position.z = 0.5;
        projectile.add(trail);
        
        projectile.position.copy(origin);
        projectile.position.y = 1.5;
        
        const direction = new THREE.Vector3().subVectors(target, origin).normalize();
        projectile.userData = {
            velocity: direction.multiplyScalar(weapon.projectileSpeed),
            damage: weapon.damage,
            range: weapon.range,
            traveled: 0,
            color: weapon.color,
            aoe: weapon.aoe
        };
        
        // Orient projectile
        projectile.lookAt(target);
        
        scene.add(projectile);
        projectiles.push(projectile);
    }

    function createParticle(position, color, velocity, size = 0.2, life = 1) {
        const particle = new THREE.Mesh(
            new THREE.SphereGeometry(size, 4, 4),
            new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1 })
        );
        particle.position.copy(position);
        particle.userData = {
            velocity: velocity,
            life: life,
            maxLife: life
        };
        scene.add(particle);
        particles.push(particle);
    }

    function createExplosion(position, color, count = 20) {
        for (let i = 0; i < count; i++) {
            const vel = new THREE.Vector3(
                (Math.random() - 0.5) * 10,
                Math.random() * 8,
                (Math.random() - 0.5) * 10
            );
            createParticle(
                position.clone().add(new THREE.Vector3(0, 1, 0)),
                color,
                vel,
                Math.random() * 0.3 + 0.1,
                Math.random() * 0.5 + 0.5
            );
        }
    }

    function createPickup(position, type) {
        const pickup = new THREE.Group();
        
        const geo = type === 'health' ? 
            new THREE.OctahedronGeometry(0.5, 0) :
            new THREE.IcosahedronGeometry(0.4, 0);
        
        const colors = {
            health: 0x00ff00,
            speed: 0x0088ff,
            shield: 0xffffff
        };
        
        const mat = new THREE.MeshStandardMaterial({
            color: colors[type],
            emissive: colors[type],
            emissiveIntensity: 0.5,
            metalness: 0.9,
            roughness: 0.1
        });
        
        const mesh = new THREE.Mesh(geo, mat);
        pickup.add(mesh);
        
        pickup.position.copy(position);
        pickup.position.y = 1;
        pickup.userData = { type: type, life: 15 };
        
        scene.add(pickup);
        pickups.push(pickup);
    }

    // ==================== GAME LOGIC ====================
    class Game {
        constructor() {
            this.state = 'title';
            this.score = 0;
            this.wave = 0;
            this.kills = 0;
            this.killStreak = 0;
            this.killStreakTimer = 0;
            
            // Hero stats
            this.hp = CONFIG.HERO_MAX_HP;
            this.maxHp = CONFIG.HERO_MAX_HP;
            this.xp = 0;
            this.level = 1;
            this.xpToNext = 50;
            
            // Multipliers
            this.damageMultiplier = 1;
            this.speedMultiplier = 1;
            this.fireRateMultiplier = 1;
            this.armorMultiplier = 1;
            this.xpMultiplier = 1;
            this.lifesteal = 0;
            this.critChance = 0.05;
            
            // Weapons
            this.currentWeapon = 0;
            this.weaponCooldowns = [0, 0, 0];
            
            // Movement
            this.moveDir = new THREE.Vector3();
            this.heroPos = new THREE.Vector3(0, 0, 0);
            
            // Wave
            this.enemiesRemaining = 0;
            this.waveTimer = 0;
            this.bossActive = false;
            
            // Effects
            this.screenShake = 0;
            this.invincible = 0;
            
            // Upgrades collected
            this.upgradeCounts = {};
        }

        start() {
            this.state = 'playing';
            document.getElementById('titleScreen').style.display = 'none';
            this.startWave();
            this.gameLoop();
        }

        restart() {
            // Clear entities
            enemies.forEach(e => scene.remove(e));
            projectiles.forEach(p => scene.remove(p));
            particles.forEach(p => scene.remove(p));
            pickups.forEach(p => scene.remove(p));
            enemies = [];
            projectiles = [];
            particles = [];
            pickups = [];
            
            // Reset game
            this.state = 'playing';
            this.score = 0;
            this.wave = 0;
            this.kills = 0;
            this.hp = CONFIG.HERO_MAX_HP;
            this.maxHp = CONFIG.HERO_MAX_HP;
            this.xp = 0;
            this.level = 1;
            this.xpToNext = 50;
            this.damageMultiplier = 1;
            this.speedMultiplier = 1;
            this.fireRateMultiplier = 1;
            this.armorMultiplier = 1;
            this.xpMultiplier = 1;
            this.lifesteal = 0;
            this.critChance = 0.05;
            this.currentWeapon = 0;
            this.weaponCooldowns = [0, 0, 0];
            this.heroPos.set(0, 0, 0);
            this.bossActive = false;
            this.upgradeCounts = {};
            
            document.getElementById('gameOverScreen').style.display = 'none';
            this.startWave();
        }

        startWave() {
            this.wave++;
            this.waveTimer = 2;
            
            const isBossWave = this.wave % CONFIG.BOSS_WAVE_INTERVAL === 0;
            
            if (isBossWave) {
                this.showBossWarning();
                this.enemiesRemaining = 1;
                this.bossActive = true;
            } else {
                this.enemiesRemaining = CONFIG.WAVE_BASE_ENEMIES + this.wave * CONFIG.WAVE_ENEMY_INCREASE;
            }
        }

        showBossWarning() {
            const warning = document.getElementById('bossWarning');
            warning.style.display = 'flex';
            setTimeout(() => {
                if (this.state === 'playing') {
                    warning.style.display = 'none';
                    createEnemy(null, true);
                }
            }, 2000);
        }

        gameOver() {
            this.state = 'gameover';
            document.getElementById('finalWave').textContent = this.wave;
            document.getElementById('finalScore').textContent = Math.floor(this.score);
            document.getElementById('finalKills').textContent = this.kills;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        levelUp() {
            this.state = 'levelup';
            this.level++;
            this.xp -= this.xpToNext;
            this.xpToNext = Math.floor(this.xpToNext * 1.3);
            
            // Show upgrade screen
            const container = document.getElementById('upgradeCards');
            container.innerHTML = '';
            
            // Pick 3 random upgrades
            const available = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
            
            available.forEach(upgrade => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="upgrade-icon">${upgrade.icon}</div>
                    <div class="upgrade-title">${upgrade.title}</div>
                    <div class="upgrade-desc">${upgrade.desc}</div>
                `;
                card.onclick = () => this.selectUpgrade(upgrade);
                container.appendChild(card);
            });
            
            document.getElementById('levelUpScreen').style.display = 'flex';
        }

        selectUpgrade(upgrade) {
            upgrade.apply(this);
            this.upgradeCounts[upgrade.id] = (this.upgradeCounts[upgrade.id] || 0) + 1;
            document.getElementById('levelUpScreen').style.display = 'none';
            this.state = 'playing';
        }

        takeDamage(amount) {
            if (this.invincible > 0) return;
            
            const finalDamage = Math.floor(amount * this.armorMultiplier);
            this.hp -= finalDamage;
            this.invincible = 0.3;
            this.screenShake = 0.3;
            
            // Damage flash
            const flash = document.getElementById('damageFlash');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 100);
            
            if (this.hp <= 0) {
                this.hp = 0;
                this.gameOver();
            }
        }

        gainXp(amount) {
            this.xp += Math.floor(amount * this.xpMultiplier);
            
            if (this.xp >= this.xpToNext) {
                this.levelUp();
            }
        }

        showDamageNumber(position, amount, isCrit = false) {
            const screenPos = this.worldToScreen(position);
            const num = document.createElement('div');
            num.className = 'damage-num';
            num.textContent = Math.floor(amount);
            num.style.left = screenPos.x + 'px';
            num.style.top = screenPos.y + 'px';
            num.style.color = isCrit ? '#ffff00' : '#ffffff';
            num.style.fontSize = (isCrit ? 32 : 20) + 'px';
            document.getElementById('damageNumbers').appendChild(num);
            setTimeout(() => num.remove(), 1000);
        }

        worldToScreen(pos) {
            const vector = pos.clone();
            vector.y += 2;
            vector.project(camera);
            return {
                x: (vector.x + 1) / 2 * window.innerWidth,
                y: (-vector.y + 1) / 2 * window.innerHeight
            };
        }

        showKillFlash() {
            const flash = document.getElementById('killFlash');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 50);
        }

        showPickupNotification(text, color) {
            const notif = document.getElementById('pickupNotification');
            notif.textContent = text;
            notif.style.color = color;
            notif.style.opacity = '1';
            notif.style.borderColor = color;
            notif.style.border = `2px solid ${color}`;
            setTimeout(() => notif.style.opacity = '0', 2000);
        }

        update(dt) {
            if (this.state !== 'playing') return;
            
            this.updateHero(dt);
            this.updateEnemies(dt);
            this.updateProjectiles(dt);
            this.updateParticles(dt);
            this.updatePickups(dt);
            this.updateEffects(dt);
            this.updateUI();
            this.checkWaveComplete();
        }

        updateHero(dt) {
            // Movement
            const speed = CONFIG.HERO_SPEED * this.speedMultiplier;
            this.heroPos.x += this.moveDir.x * speed * dt;
            this.heroPos.z += this.moveDir.z * speed * dt;
            
            // Clamp to arena
            const dist = Math.sqrt(this.heroPos.x ** 2 + this.heroPos.z ** 2);
            if (dist > CONFIG.ARENA_SIZE - 2) {
                this.heroPos.x *= (CONFIG.ARENA_SIZE - 2) / dist;
                this.heroPos.z *= (CONFIG.ARENA_SIZE - 2) / dist;
            }
            
            hero.position.x = this.heroPos.x;
            hero.position.z = this.heroPos.z;
            
            // Rotate hero toward movement
            if (this.moveDir.length() > 0.1) {
                hero.rotation.y = Math.atan2(this.moveDir.x, this.moveDir.z);
            }
            
            // Floating orbs animation
            if (hero.userData.orbs) {
                hero.userData.orbs.forEach((orb, i) => {
                    const angle = orb.userData.angle + clock.elapsedTime * orb.userData.speed;
                    orb.position.x = Math.cos(angle) * orb.userData.radius;
                    orb.position.z = Math.sin(angle) * orb.userData.radius;
                    orb.position.y = 1.5 + Math.sin(clock.elapsedTime * 3 + i) * 0.3;
                });
            }
            
            // Weapon cooldowns
            for (let i = 0; i < 3; i++) {
                this.weaponCooldowns[i] = Math.max(0, this.weaponCooldowns[i] - dt);
            }
            
            // Auto-attack
            this.autoAttack(dt);
            
            // Invincibility
            this.invincible = Math.max(0, this.invincible - dt);
        }

        autoAttack(dt) {
            const weapon = WEAPONS[this.currentWeapon];
            const cooldown = weapon.fireRate / this.fireRateMultiplier;
            
            if (this.weaponCooldowns[this.currentWeapon] > 0) return;
            
            // Find target
            let target = null;
            let minDist = Infinity;
            
            enemies.forEach(enemy => {
                const d = hero.position.distanceTo(enemy.position);
                if (d < weapon.range && d < minDist) {
                    minDist = d;
                    target = enemy;
                }
            });
            
            if (target) {
                this.weaponCooldowns[this.currentWeapon] = cooldown;
                
                if (weapon.aoe) {
                    // Nova Burst - AoE damage
                    if (this.currentWeapon === 1) {
                        // Nova Burst
                        createExplosion(hero.position, weapon.color, 40);
                        enemies.forEach(enemy => {
                            const d = hero.position.distanceTo(enemy.position);
                            if (d < weapon.range) {
                                this.damageEnemy(enemy, weapon.damage * this.damageMultiplier);
                            }
                        });
                        this.screenShake = 0.2;
                    } else {
                        // Void Aura - passive damage
                        enemies.forEach(enemy => {
                            const d = hero.position.distanceTo(enemy.position);
                            if (d < weapon.range) {
                                this.damageEnemy(enemy, weapon.damage * this.damageMultiplier * dt * 3);
                            }
                        });
                    }
                } else {
                    // Projectile attack
                    createProjectile(hero.position, target.position, weapon);
                }
            }
        }

        damageEnemy(enemy, baseDamage) {
            const isCrit = Math.random() < this.critChance;
            const damage = baseDamage * (isCrit ? 2 : 1);
            
            enemy.userData.hp -= damage;
            this.showDamageNumber(enemy.position, damage, isCrit);
            
            // Life steal
            if (this.lifesteal > 0) {
                this.hp = Math.min(this.maxHp, this.hp + damage * this.lifesteal);
            }
            
            // Hit particles
            createExplosion(enemy.position, 0xffffff, 5);
            
            if (enemy.userData.hp <= 0) {
                this.killEnemy(enemy);
            }
        }

        killEnemy(enemy) {
            this.kills++;
            this.killsStreak++;
            this.killStreakTimer = 2;
            this.score += enemy.userData.xp * 10;
            
            // Show combo
            if (this.killStreak >= 5) {
                document.getElementById('killCombo').textContent = `${this.killStreak} KILL STREAK!`;
                document.getElementById('killCombo').style.opacity = '1';
            }
            
            // XP gain
            this.gainXp(enemy.userData.xp);
            
            // Death effects
            createExplosion(enemy.position, enemy.userData.isBoss ? 0xff0066 : 0xff3333, 
                enemy.userData.isBoss ? 60 : 30);
            
            // Pickup chance
            if (Math.random() < CONFIG.PICKUP_SPAWN_CHANCE) {
                const types = ['health', 'speed', 'shield'];
                createPickup(enemy.position.clone(), types[Math.floor(Math.random() * types.length)]);
            }
            
            // Boss drops
            if (enemy.userData.isBoss) {
                for (let i = 0; i < 5; i++) {
                    createPickup(
                        enemy.position.clone().add(new THREE.Vector3(
                            (Math.random() - 0.5) * 5,
                            0,
                            (Math.random() - 0.5) * 5
                        )),
                        'health'
                    );
                }
                this.bossActive = false;
            }
            
            // Remove enemy
            scene.remove(enemy);
            enemies = enemies.filter(e => e !== enemy);
            
            this.enemiesRemaining--;
            this.showKillFlash();
        }

        updateEnemies(dt) {
            enemies.forEach(enemy => {
                const dir = new THREE.Vector3()
                    .subVectors(hero.position, enemy.position)
                    .normalize();
                
                const userData = enemy.userData;
                
                // Dasher behavior
                if (userData.type === 'Dasher') {
                    userData.dashCooldown -= dt;
                    if (userData.dashCooldown <= 0 && !userData.isDashing) {
                        userData.isDashing = true;
                        userData.dashTime = 0.5;
                        userData.dashCooldown = 3;
                    }
                    
                    if (userData.isDashing) {
                        userData.dashTime -= dt;
                        enemy.position.x += dir.x * userData.speed * 3 * dt;
                        enemy.position.z += dir.z * userData.speed * 3 * dt;
                        if (userData.dashTime <= 0) userData.isDashing = false;
                    } else {
                        enemy.position.x += dir.x * userData.speed * 0.3 * dt;
                        enemy.position.z += dir.z * userData.speed * 0.3 * dt;
                    }
                } else {
                    enemy.position.x += dir.x * userData.speed * dt;
                    enemy.position.z += dir.z * userData.speed * dt;
                }
                
                // Hover animation
                enemy.position.y = userData.scale + Math.sin(clock.elapsedTime * 3) * 0.2;
                
                // Rotation
                enemy.rotation.y += dt;
                
                // Attack hero
                userData.attackCooldown -= dt;
                const attackDist = 2 * userData.scale;
                if (enemy.position.distanceTo(hero.position) < attackDist && userData.attackCooldown <= 0) {
                    this.takeDamage(userData.damage);
                    userData.attackCooldown = 1;
                }
            });
        }

        updateProjectiles(dt) {
            projectiles.forEach(proj => {
                const move = proj.userData.velocity.clone().multiplyScalar(dt);
                proj.position.add(move);
                proj.userData.traveled += move.length();
                
                // Check enemy collision
                enemies.forEach(enemy => {
                    if (proj.position.distanceTo(enemy.position) < 1.5 * enemy.userData.scale) {
                        this.damageEnemy(enemy, proj.userData.damage * this.damageMultiplier);
                        createExplosion(proj.position, proj.userData.color, 10);
                        proj.userData.traveled = proj.userData.range + 1; // Destroy
                    }
                });
            });
            
            // Remove out-of-range projectiles
            projectiles = projectiles.filter(p => {
                if (p.userData.traveled > p.userData.range) {
                    scene.remove(p);
                    return false;
                }
                return true;
            });
        }

        updateParticles(dt) {
            particles.forEach(p => {
                p.position.add(p.userData.velocity.clone().multiplyScalar(dt));
                p.userData.velocity.y -= 15 * dt; // Gravity
                p.userData.life -= dt;
                p.material.opacity = p.userData.life / p.userData.maxLife;
                p.scale.setScalar(p.userData.life / p.userData.maxLife);
            });
            
            particles = particles.filter(p => {
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    return false;
                }
                return true;
            });
        }

        updatePickups(dt) {
            pickups.forEach(pickup => {
                pickup.userData.life -= dt;
                
                // Float and rotate
                pickup.position.y = 1 + Math.sin(clock.elapsedTime * 3) * 0.3;
                pickup.rotation.y += dt * 2;
                
                // Collect
                if (pickup.position.distanceTo(hero.position) < 2) {
                    this.collectPickup(pickup);
                }
            });
            
            pickups = pickups.filter(p => {
                if (p.userData.life <= 0 || !p.parent) {
                    if (p.parent) scene.remove(p);
                    return false;
                }
                return true;
            });
        }

        collectPickup(pickup) {
            const type = pickup.userData.type;
            
            switch(type) {
                case 'health':
                    this.hp = Math.min(this.maxHp, this.hp + 20);
                    this.showPickupNotification('+20 HP', '#00ff00');
                    break;
                case 'speed':
                    this.speedMultiplier *= 1.5;
                    setTimeout(() => this.speedMultiplier /= 1.5, 5000);
                    this.showPickupNotification('SPEED BOOST!', '#0088ff');
                    break;
                case 'shield':
                    this.invincible = 3;
                    this.showPickupNotification('SHIELD ACTIVE!', '#ffffff');
                    break;
            }
            
            createExplosion(pickup.position, 0x00ff00, 15);
            scene.remove(pickup);
            pickups = pickups.filter(p => p !== pickup);
        }

        updateEffects(dt) {
            // Screen shake
            if (this.screenShake > 0) {
                this.screenShake -= dt;
                camera.position.x = (Math.random() - 0.5) * 0.5;
                camera.position.z = 30 + (Math.random() - 0.5) * 0.5;
            } else {
                camera.position.x = 0;
                camera.position.z = 30;
            }
            
            // Kill streak decay
            if (this.killStreakTimer > 0) {
                this.killStreakTimer -= dt;
                if (this.killStreakTimer <= 0) {
                    this.killStreak = 0;
                    document.getElementById('killCombo').style.opacity = '0';
                }
            }
        }

        checkWaveComplete() {
            if (this.enemiesRemaining <= 0 && enemies.length === 0) {
                this.waveTimer -= clock.getDelta();
                if (this.waveTimer <= 0) {
                    this.startWave();
                }
            } else if (this.waveTimer > 0 && this.wave > 0) {
                // Spawn enemies during wave
                if (enemies.length < Math.min(this.wave * 2, 30) && this.enemiesRemaining > enemies.length) {
                    const type = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
                    createEnemy(type);
                }
            }
        }

        updateUI() {
            // Health
            const healthPercent = (this.hp / this.maxHp) * 100;
            document.getElementById('healthFill').style.width = healthPercent + '%';
            document.getElementById('healthText').textContent = `${Math.floor(this.hp)} / ${this.maxHp}`;
            
            // XP
            const xpPercent = (this.xp / this.xpToNext) * 100;
            document.getElementById('xpFill').style.width = xpPercent + '%';
            document.getElementById('levelBadge').textContent = `LEVEL ${this.level}`;
            
            // Wave & Score
            document.getElementById('waveNumber').textContent = `WAVE ${this.wave}`;
            document.getElementById('score').textContent = `SCORE: ${Math.floor(this.score)}`;
            
            // Weapon cooldown
            document.querySelectorAll('.weapon-slot').forEach((slot, i) => {
                const weapon = WEAPONS[i];
                const cooldown = this.weaponCooldowns[i];
                const maxCooldown = weapon.fireRate / this.fireRateMultiplier;
                const percent = (cooldown / maxCooldown) * 100;
                slot.querySelector('.weapon-cooldown').style.height = percent + '%';
                slot.classList.toggle('active', this.currentWeapon === i);
            });
        }

        gameLoop() {
            const dt = Math.min(clock.getDelta(), 0.1);
            
            this.update(dt);
            
            // Background crystal animation
            scene.children.forEach(child => {
                if (child.userData && child.userData.rotSpeed) {
                    child.rotation.y += child.userData.rotSpeed * dt;
                    child.position.y += Math.sin(clock.elapsedTime + child.userData.floatOffset) * dt * 2;
                }
            });
            
            renderer.render(scene, camera);
            requestAnimationFrame(() => this.gameLoop());
        }
    }

    // ==================== INPUT HANDLING ====================
    function setupInput() {
        const keys = {};
        
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            
            // Weapon switching
            if (e.key >= '1' && e.key <= '3') {
                game.currentWeapon = parseInt(e.key) - 1;
            }
        });
        
        document.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });
        
        // Movement update loop
        setInterval(() => {
            if (game && game.state === 'playing') {
                game.moveDir.set(0, 0, 0);
                
                if (keys['w'] || keys['arrowup']) game.moveDir.z -= 1;
                if (keys['s'] || keys['arrowdown']) game.moveDir.z += 1;
                if (keys['a'] || keys['arrowleft']) game.moveDir.x -= 1;
                if (keys['d'] || keys['arrowright']) game.moveDir.x += 1;
                
                if (game.moveDir.length() > 0) {
                    game.moveDir.normalize();
                }
            }
        }, 16);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==================== INITIALIZATION ====================
    initThreeJS();
    game = new Game();
    setupInput();
    </script>
