<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Void Survivor — Stylized 3D Horde Action</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;500;700&display=swap');
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0f18; color: #e8f0fa; font-family: 'Exo 2', sans-serif; user-select: none; }
  #gameCanvas { width: 100vw; height: 100vh; display: block; }
  .font-orbitron { font-family: 'Orbitron', sans-serif; }
  .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(14px) saturate(120%); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
  .glass-strong { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px) saturate(140%); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; }
  @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 18px rgba(0,230,255,0.35); } 50% { box-shadow: 0 0 30px rgba(0,230,255,0.6); } }
  @keyframes float-up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-22px); } }
  @keyframes shimmer { 0% { opacity: 0.35; } 50% { opacity: 1; } 100% { opacity: 0.35; } }
  .damage-float { position: absolute; pointer-events: none; animation: float-up 0.8s ease-out forwards; font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 0.04em; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .wave-banner { animation: pulse-glow 2.5s infinite; }
  .level-card:hover { border-color: rgba(0,230,255,0.35); transform: translateY(-2px); }
  .level-card { transition: all 0.2s ease; }
  .btn-shine { position: relative; overflow: hidden; }
  .btn-shine::after { content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); animation: shimmer 2.2s infinite; }
</style>
</head>
<body class="bg-gradient-to-br from-[#060b14] via-[#0a1222] to-[#041024] min-h-screen">

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud" class="fixed top-0 left-0 w-full h-full pointer-events-none z-20 p-5 flex flex-col justify-between">
  <div class="flex items-start justify-between">
    <div class="flex gap-4">
      <div class="glass px-5 py-3 min-w-[160px]">
        <div class="text-[10px] uppercase tracking-[0.15em] text-cyan-300/60 font-bold mb-1">Health</div>
        <div class="flex items-end gap-2">
          <span id="hpText" class="text-2xl font-orbitron font-black text-white">100</span>
          <span class="text-xs text-white/40 mb-1">/ 100</span>
        </div>
        <div class="w-full h-2 bg-white/10 rounded-full mt-2 overflow-hidden">
          <div id="hpBar" class="h-full bg-gradient-to-r from-rose-400 via-rose-500 to-rose-400 rounded-full shadow-[0_0_10px_rgba(244,63,94,0.5)] transition-all duration-200" style="width:100%"></div>
        </div>
      </div>
      <div class="glass px-5 py-3 min-w-[160px]">
        <div class="text-[10px] uppercase tracking-[0.15em] text-amber-300/60 font-bold mb-1">XP</div>
        <div class="flex items-end gap-2">
          <span id="xpText" class="text-2xl font-orbitron font-black text-white">0</span>
          <span class="text-xs text-white/40 mb-1">/ 100</span>
        </div>
        <div class="w-full h-2 bg-white/10 rounded-full mt-2 overflow-hidden">
          <div id="xpBar" class="h-full bg-gradient-to-r from-amber-300 via-amber-400 to-amber-300 rounded-full shadow-[0_0_10px_rgba(245,158,11,0.5)] transition-all duration-200" style="width:0%"></div>
        </div>
      </div>
      <div class="glass px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-[0.15em] text-violet-300/60 font-bold mb-1">Score</div>
        <span id="scoreText" class="text-2xl font-orbitron font-black text-violet-300">0</span>
      </div>
      <div class="glass px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-[0.15em] text-emerald-300/60 font-bold mb-1">Wave</div>
        <span id="waveText" class="text-2xl font-orbitron font-black text-emerald-300">1</span>
      </div>
      <div class="glass px-5 py-3 min-w-[140px]">
        <div class="text-[10px] uppercase tracking-[0.15em] text-cyan-200/60 font-bold mb-1">Kills</div>
        <span id="killText" class="text-2xl font-orbitron font-black text-cyan-200">0</span>
      </div>
    </div>
    <div class="glass px-4 py-3 text-right">
      <div class="text-[10px] uppercase tracking-[0.15em] text-white/30 font-bold">Time</div>
      <span id="timeText" class="text-xl font-orbitron font-black text-white">0:00</span>
      <div class="text-[10px] text-white/30 mt-1">Auto-fire: ON</div>
    </div>
  </div>

  <div class="flex items-end justify-between">
    <div>
      <div id="weaponName" class="font-orbitron text-xl font-black text-cyan-200 tracking-wide mb-1">Pulse Blade</div>
      <div id="weaponDesc" class="text-sm text-white/60">Rapid energy strikes</div>
    </div>
    <div class="flex gap-3">
      <div class="glass px-4 py-2 text-center">
        <div class="text-[9px] uppercase tracking-[0.12em] text-white/30">Damage</div>
        <span id="dmgText" class="text-lg font-orbitron font-black text-rose-300">24</span>
      </div>
      <div class="glass px-4 py-2 text-center">
        <div class="text-[9px] uppercase tracking-[0.12em] text-white/30">Fire Rate</div>
        <span id="rateText" class="text-lg font-orbitron font-black text-cyan-200">2.4</span>
      </div>
      <div class="glass px-4 py-2 text-center">
        <div class="text-[9px] uppercase tracking-[0.12em] text-white/30">Range</div>
        <span id="rangeText" class="text-lg font-orbitron font-black text-violet-300">5.5</span>
      </div>
    </div>
  </div>
</div>

<!-- Level Up Modal -->
<div id="levelModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/60 backdrop-blur-md">
  <div class="glass-strong p-8 max-w-[640px] w-[92vw]">
    <h2 class="font-orbitron text-3xl font-black text-cyan-200 mb-1 tracking-tight">LEVEL UP</h2>
    <p class="text-white/40 text-sm mb-6">Choose an upgrade to grow stronger.</p>
    <div id="upgradeCards" class="grid grid-cols-3 gap-4 mb-6"></div>
    <div class="text-center text-xs text-white/20">Select with 1 / 2 / 3 keys or click</div>
  </div>
</div>

<!-- Game Over -->
<div id="gameOverScreen" class="fixed inset-0 z-[60] hidden flex flex-col items-center justify-center bg-gradient-to-b from-[#060b14]/95 via-[#0a1222]/95 to-[#041024]/98 backdrop-blur-lg">
  <h1 class="font-orbitron text-6xl md:text-8xl font-black text-rose-400 drop-shadow-[0_0_40px_rgba(244,63,94,0.4)] mb-3 tracking-tighter">VOID SURVIVED</h1>
  <div class="text-white/30 text-lg mb-2">You lasted <span id="finalTime" class="text-white font-orbitron">0:00</span></div>
  <div class="flex gap-8 mt-4">
    <div class="text-center"><div class="text-[10px] uppercase tracking-[0.2em] text-white/20">Score</div><div id="finalScore" class="text-3xl font-orbitron font-black text-violet-200">0</div></div>
    <div class="text-center"><div class="text-[10px] uppercase tracking-[0.2em] text-white/20">Kills</div><div id="finalKills" class="text-3xl font-orbitron font-black text-cyan-200">0</div></div>
    <div class="text-center"><div class="text-[10px] uppercase tracking-[0.2em] text-white/20">Waves</div><div id="finalWaves" class="text-3xl font-orbitron font-black text-emerald-200">1</div></div>
  </div>
  <button onclick="startGame()" class="mt-10 px-10 py-4 bg-gradient-to-r from-cyan-500/20 to-violet-500/20 border border-cyan-400/40 rounded-2xl text-cyan-100 font-orbitron font-black text-xl tracking-wide hover:scale-105 hover:shadow-[0_0_30px_rgba(0,230,255,0.3)] transition btn-shine">RESTART RUN</button>
</div>

<!-- Wave banner -->
<div id="waveBanner" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 hidden">
  <div class="wave-banner glass-strong px-8 py-4 text-center">
    <div class="text-[10px] uppercase tracking-[0.2em] text-white/40 font-bold">Incoming</div>
    <h3 id="waveTitle" class="font-orbitron text-3xl font-black text-emerald-200 tracking-tight">WAVE 2</h3>
  </div>
</div>

<script>
// === GAME STATE ===
let scene, camera, renderer, hero, clock, raycaster, mouse, keys;
let particles = [], enemies = [], bullets = [], xpOrbs = [], pickups = [], damageTexts = [], stars = [];
let gameActive = false, paused = false, startTime = 0, score = 0, kills = 0, wave = 1, timeSurvived = 0;
let heroHP = 100, heroMaxHP = 100, heroXP = 0, heroXPToNext = 100;
let heroSpeed = 6.5, weaponCooldown = 0, weaponRange = 5.5, weaponDmg = 24, weaponFireRate = 2.4, weaponName = 'Pulse Blade';
let spawnRate = 0.9, spawnTimer = 0, enemySpeed = 1.8, enemyHP = 35, enemyDmg = 8;
let ambientLight, directionalLight, groundMesh, skySphere;

// === INITIALIZATION ===
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060b14);
  scene.fog = new THREE.FogExp2(0x060b14, 0.015);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(0, 18, 14);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  clock = new THREE.Clock();
  mouse = new THREE.Vector2();
  raycaster = new THREE.Raycaster();
  keys = {};

  window.addEventListener('keydown', (e) => { keys[e.key] = true; if (e.key === '1' || e.key === '2' || e.key === '3') chooseUpgrade(parseInt(e.key) - 1); });
  window.addEventListener('keyup', (e) => keys[e.key] = false);
  window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  window.addEventListener('mousemove', (e) => { mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1; });

  // Lights
  ambientLight = new THREE.AmbientLight(0x8899aa, 0.35);
  scene.add(ambientLight);
  directionalLight = new THREE.DirectionalLight(0xfff8e7, 1.2);
  directionalLight.position.set(8, 25, 10);
  directionalLight.castShadow = true;
  directionalLight.shadow.mapSize.width = 1024;
  directionalLight.shadow.mapSize.height = 1024;
  directionalLight.shadow.bias = -0.001;
  scene.add(directionalLight);
  const hemi = new THREE.HemisphereLight(0x88aaff, 0x333333, 0.35);
  scene.add(hemi);

  // Ground
  const groundGeo = new THREE.CircleGeometry(60, 128);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x0d1625, roughness: 0.9, metalness: 0.1 });
  groundMesh = new THREE.Mesh(groundGeo, groundMat);
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.receiveShadow = true;
  scene.add(groundMesh);

  // Grid lines overlay
  const grid = new THREE.GridHelper(60, 30, 0x1a3a5c, 0x0d1625);
  scene.add(grid);

  // Sky dome
  const skyGeo = new THREE.SphereGeometry(150, 32, 32);
  const skyMat = new THREE.MeshBasicMaterial({ color: 0x040b18, side: THREE.BackSide, fog: false });
  skySphere = new THREE.Mesh(skyGeo, skyMat);
  scene.add(skySphere);

  // Stars (points)
  const starCount = 600;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 180;
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xaaddff, size: 0.45, transparent: true, opacity: 0.7, sizeAttenuation: true });
  stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // Hero
  const heroGeo = new THREE.ConeGeometry(0.9, 2.2, 8);
  heroGeo.rotateX(-Math.PI / 2);
  const heroMat = new THREE.MeshStandardMaterial({ color: 0x00e6ff, emissive: 0x00b3cc, emissiveIntensity: 0.4, roughness: 0.2, metalness: 0.6 });
  hero = new THREE.Mesh(heroGeo, heroMat);
  hero.position.y = 1.2;
  hero.castShadow = true;
  scene.add(hero);

  // Hero ring (decorative)
  const ringGeo = new THREE.TorusGeometry(1.4, 0.06, 8, 36);
  const ringMat = new THREE.MeshStandardMaterial({ color: 0xff0099, emissive: 0xcc0066, emissiveIntensity: 0.6, roughness: 0.1, metalness: 0.8 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2.2;
  hero.add(ring);

  // Procedural terrain chunks
  for (let i = 0; i < 24; i++) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(2 + Math.random() * 4, 0.6 + Math.random() * 2.5, 2 + Math.random() * 4), new THREE.MeshStandardMaterial({ color: 0x15233a, roughness: 0.8, metalness: 0.2 }));
    t.position.set((Math.random() - 0.5) * 50, 0.3 + Math.random() * 0.8, (Math.random() - 0.5) * 50);
    t.castShadow = true;
    t.receiveShadow = true;
    scene.add(t);
  }

  // Start
  startGame();
  animate();
}

function spawnEnemy() {
  const geo = new THREE.OctahedronGeometry(Math.random() * 0.6 + 0.7, 0);
  const mat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.3 ? 0xff2a6a : 0xff8800, emissive: Math.random() > 0.3 ? 0xcc0033 : 0xcc4400, emissiveIntensity: 0.5, roughness: 0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  const angle = Math.random() * Math.PI * 2;
  const dist = 20 + Math.random() * 25;
  mesh.position.set(Math.cos(angle) * dist, 0.8, Math.sin(angle) * dist);
  mesh.userData = { hp: enemyHP, maxHP: enemyHP, type: Math.random() > 0.3 ? 'swarm' : 'tank' };
  scene.add(mesh);
  enemies.push(mesh);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.03, 8, 20), new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0.2 }));
  ring2.rotation.x = Math.PI / 2;
  ring2.position.y = 0.3;
  mesh.add(ring2);
}

function spawnXPOrb(pos, amount = 15) {
  const geo = new THREE.IcosahedronGeometry(0.25 + Math.random() * 0.2, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x66ffcc, emissive: 0x22aa88, emissiveIntensity: 1.2, roughness: 0.1, metalness: 0.8 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.position.y = 0.8;
  scene.add(mesh);
  xpOrbs.push({ mesh, age: 0, amount });
}

function spawnPickup(pos) {
  const geo = new THREE.TetrahedronGeometry(0.35, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xcc8800, emissiveIntensity: 1.5, roughness: 0.05, metalness: 1 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.position.y = 0.5;
  scene.add(mesh);
  pickups.push({ mesh, age: 0, type: Math.random() > 0.5 ? 'heal' : 'speed' });
}

function fireWeapon() {
  const closest = findClosestEnemy();
  if (!closest) return;
  const dir = new THREE.Vector3().subVectors(closest.position, hero.position).normalize();
  const start = hero.position.clone();
  start.y = 1.5;
  const geo = new THREE.SphereGeometry(0.15 + Math.random() * 0.1, 8, 8);
  const mat = new THREE.MeshStandardMaterial({ color: 0x00e6ff, emissive: 0x0099cc, emissiveIntensity: 2.5, roughness: 0, metalness: 1, transparent: true, opacity: 0.85 });
  const bullet = new THREE.Mesh(geo, mat);
  bullet.position.copy(start);
  scene.add(bullet);
  bullets.push({ mesh: bullet, dir, speed: 18 + Math.random() * 8, life: 2, dmg: weaponDmg });
}

function findClosestEnemy() {
  let best = null, bestDist = Infinity;
  for (const e of enemies) {
    const d = hero.position.distanceTo(e.position);
    if (d < weaponRange && d < bestDist) { bestDist = d; best = e; }
  }
  return best;
}

function spawnExplosion(pos) {
  for (let i = 0; i < 14; i++) {
    const geo = new THREE.SphereGeometry(0.08 + Math.random() * 0.12, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.9 });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.position.y += 0.5;
    scene.add(p);
    const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.6 + 0.3, Math.random() - 0.5).normalize().multiplyScalar(2 + Math.random() * 3);
    particles.push({ mesh: p, vel: dir, life: 0.5 + Math.random() * 0.5 });
  }
}

function spawnDamageText(pos, amount) {
  const el = document.createElement('div');
  el.className = 'damage-float';
  el.textContent = '-' + Math.round(amount);
  el.style.left = (window.innerWidth * 0.4 + Math.random() * 100 - 50) + 'px';
  el.style.top = (window.innerHeight * 0.35 - Math.random() * 80) + 'px';
  el.style.color = amount > 30 ? '#ff0099' : '#ff5555';
  el.style.fontSize = (16 + Math.random() * 14) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
  damageTexts.push(el);
}

function startGame() {
  // Reset
  heroHP = heroMaxHP = 100; heroXP = 0; heroXPToNext = 100;
  score = 0; kills = 0; wave = 1; timeSurvived = 0; startTime = Date.now();
  spawnRate = 0.9; spawnTimer = 0; enemyHP = 35; enemyDmg = 8; enemySpeed = 1.8;
  hero.position.set(0, 1.2, 0);
  hero.rotation.set(0, 0, 0);
  weaponCooldown = 0; weaponDmg = 24; weaponFireRate = 2.4; weaponRange = 5.5; weaponName = 'Pulse Blade';
  // Clear objects
  for (const o of [...enemies, ...bullets, ...xpOrbs, ...pickups, ...particles]) { scene.remove(o.mesh || o); }
  enemies = []; bullets = []; xpOrbs = []; pickups = []; particles = []; damageTexts.forEach(el => el.remove()); damageTexts = [];
  // UI
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.remove('flex');
  document.getElementById('levelModal').classList.add('hidden');
  document.getElementById('levelModal').classList.remove('flex');
  gameActive = true; paused = false;
  updateUI();
}

function levelUp() {
  heroXP = 0; heroXPToNext = Math.round(heroXPToNext * 1.6);
  const options = [
    { title: 'Blade Surge', desc: '+20% Damage & Rate', effect: () => { weaponDmg *= 1.2; weaponFireRate *= 1.15; weaponRange *= 1.08; } },
    { title: 'Void Shield', desc: '+25 Max HP + Regen', effect: () => { heroMaxHP += 25; heroHP = heroMaxHP; } },
    { title: 'Star Burst', desc: 'Wider AOE & Range', effect: () => { weaponRange *= 1.15; weaponDmg *= 1.1; } },
    { title: 'Swift Drift', desc: '+18% Movement Speed', effect: () => { heroSpeed *= 1.18; } },
  ];
  const picked = options.sort(() => Math.random() - 0.5).slice(0, 3);
  const container = document.getElementById('upgradeCards');
  container.innerHTML = '';
  picked.forEach((opt, i) => {
    const card = document.createElement('button');
    card.className = 'level-card glass-strong p-5 text-left';
    card.innerHTML = `<h3 class="font-orbitron font-black text-xl text-cyan-200 mb-1">${opt.title}</h3><p class="text-sm text-white/50">${opt.desc}</p><div class="mt-3 text-[10px] text-white/20 font-bold">PRESS ${i + 1}</div>`;
    card.onclick = () => { opt.effect(); closeLevelModal(); };
    container.appendChild(card);
  });
  document.getElementById('levelModal').classList.remove('hidden');
  document.getElementById('levelModal').classList.add('flex');
  paused = true;
}

function closeLevelModal() {
  document.getElementById('levelModal').classList.add('hidden');
  document.getElementById('levelModal').classList.remove('flex');
  paused = false;
}

function chooseUpgrade(index) {
  const cards = document.querySelectorAll('#upgradeCards button');
  if (cards[index]) cards[index].click();
}

function updateUI() {
  document.getElementById('hpText').textContent = Math.round(heroHP);
  document.getElementById('hpBar').style.width = (heroHP / heroMaxHP * 100) + '%';
  document.getElementById('xpText').textContent = heroXP;
  document.getElementById('xpText').nextElementSibling ? null : null;
  document.getElementById('xpBar').style.width = (heroXP / heroXPToNext * 100) + '%';
  document.getElementById('scoreText').textContent = score;
  document.getElementById('waveText').textContent = wave;
  document.getElementById('killText').textContent = kills;
  document.getElementById('timeText').textContent = formatTime(Math.floor((Date.now() - startTime) / 1000));
  document.getElementById('weaponName').textContent = weaponName;
  document.getElementById('weaponDesc').textContent = 'Rapid energy strikes';
  document.getElementById('dmgText').textContent = Math.round(weaponDmg);
  document.getElementById('rateText').textContent = weaponFireRate.toFixed(1);
  document.getElementById('rangeText').textContent = weaponRange.toFixed(1);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60); const s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s;
}

// === GAME LOOP ===
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  if (!gameActive || paused) { renderer.render(scene, camera); return; }

  // Hero movement
  if (keys['w'] || keys['ArrowUp']) hero.position.z -= heroSpeed * delta;
  if (keys['s'] || keys['ArrowDown']) hero.position.z += heroSpeed * delta;
  if (keys['a'] || keys['ArrowLeft']) hero.position.x -= heroSpeed * delta;
  if (keys['d'] || keys['ArrowRight']) hero.position.x += heroSpeed * delta;
  hero.position.x = Math.max(-28, Math.min(28, hero.position.x));
  hero.position.z = Math.max(-28, Math.min(28, hero.position.z));

  // Weapon cooldown
  weaponCooldown -= delta;
  if (weaponCooldown <= 0) { fireWeapon(); weaponCooldown = 1 / weaponFireRate; }

  // Spawn
  spawnTimer += delta;
  const rate = Math.max(0.35, spawnRate - wave * 0.05);
  if (spawnTimer > rate) { spawnEnemy(); spawnTimer = 0; spawnRate = Math.max(0.15, spawnRate - 0.02); }

  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dir = new THREE.Vector3().subVectors(hero.position, e.position).normalize();
    e.position.add(dir.multiplyScalar(enemySpeed * delta));
    e.rotation.y += delta * 3;
    e.lookAt(hero.position);
    e.rotation.y += Math.PI / 2;
    if (hero.position.distanceTo(e.position) < 1.2) { heroHP -= enemyDmg * delta; spawnExplosion(hero.position.clone()); hero.position.y = 1.2; if (heroHP <= 0) gameOver(); }
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed * delta));
    b.life -= delta;
    b.mesh.scale.multiplyScalar(0.9);
    if (b.life <= 0 || b.mesh.scale.x < 0.02) { scene.remove(b.mesh); bullets.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (b.mesh.position.distanceTo(e.position) < 1.2) {
        e.userData.hp -= b.dmg;
        scene.remove(b.mesh); bullets.splice(i, 1);
        spawnExplosion(e.position.clone());
        spawnDamageText(e.position.clone(), b.dmg);
        if (e.userData.hp <= 0) {
          scene.remove(e); enemies.splice(j, 1);
          kills++; score += 25 + wave * 10; spawnXPOrb(e.position.clone(), 10 + wave * 2);
          if (Math.random() < 0.08) spawnPickup(e.position.clone());
        }
        break;
      }
    }
  }

  // XP orbs
  for (let i = xpOrbs.length - 1; i >= 0; i--) {
    const o = xpOrbs[i];
    o.age += delta; o.mesh.position.y = 0.8 + Math.sin(o.age * 5) * 0.2;
    o.mesh.rotation.y += delta * 4; o.mesh.rotation.z += delta * 2;
    if (hero.position.distanceTo(o.mesh.position) < 2) {
      heroXP += o.amount; scene.remove(o.mesh); xpOrbs.splice(i, 1);
      if (heroXP >= heroXPToNext) levelUp();
    } else if (o.age > 15) { scene.remove(o.mesh); xpOrbs.splice(i, 1); }
  }

  // Pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.age += delta; p.mesh.rotation.y += delta * 3;
    if (hero.position.distanceTo(p.mesh.position) < 2) {
      scene.remove(p.mesh); pickups.splice(i, 1);
      if (p.type === 'heal') { heroHP = Math.min(heroMaxHP, heroHP + 30); }
      else { heroSpeed *= 1.12; setTimeout(() => heroSpeed /= 1.12, 5000); }
    } else if (p.age > 12) { scene.remove(p.mesh); pickups.splice(i, 1); }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.mesh.position.add(p.vel.clone().multiplyScalar(delta));
    p.vel.y -= delta * 2; p.life -= delta;
    p.mesh.material.opacity = Math.max(0, p.life / 0.8);
    p.mesh.scale.multiplyScalar(0.96);
    if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
  }

  // Waves
  if (kills >= wave * 15) { wave++; enemyHP = 35 + wave * 12; enemyDmg = 8 + wave * 2; showWaveBanner(); updateUI(); }

  timeSurvived = Math.floor((Date.now() - startTime) / 1000);
  updateUI();

  // Camera follow with subtle rotation based on mouse
  const targetPos = new THREE.Vector3(hero.position.x, 16, hero.position.z + 10);
  camera.position.lerp(targetPos, delta * 3);
  camera.lookAt(hero.position.x, 0, hero.position.z);

  renderer.render(scene, camera);
}

function showWaveBanner() {
  const el = document.getElementById('waveBanner');
  document.getElementById('waveTitle').textContent = 'WAVE ' + wave;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2200);
}

function gameOver() {
  gameActive = false;
  document.getElementById('finalTime').textContent = formatTime(timeSurvived);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('finalWaves').textContent = wave;
  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('gameOverScreen').classList.add('flex');
}

// Start
window.addEventListener('load', init);
</script>
</body>
</html>
