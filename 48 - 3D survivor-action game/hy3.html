<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #000; font-family: 'Orbitron', sans-serif; 
            user-select: none; color: #fff;
        }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .hud { padding: 20px; text-shadow: 0 0 5px #0ff; }
        .hud-stats { font-size: 1.2rem; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; }
        
        .bar-container { margin-bottom: 8px; }
        .bar-label { font-size: 0.8rem; margin-bottom: 2px; color: #aaa; text-shadow: none; }
        .bar-bg { width: 300px; height: 18px; background: rgba(0,0,0,0.6); border: 2px solid #0ff; border-radius: 4px; overflow: hidden; }
        .bar-fg { height: 100%; transition: width 0.1s linear; }
        .xp-fg { background: #0f0; box-shadow: 0 0 10px #0f0; }
        .hp-fg { background: #f0f; box-shadow: 0 0 10px #f0f; }
        
        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,10,20,0.85); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; pointer-events: auto; z-index: 20; 
        }
        .hidden { display: none !important; }
        
        h1 { 
            font-size: 5rem; color: #fff; text-align: center;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff; 
            margin-bottom: 20px; letter-spacing: 5px; 
        }
        
        .btn { 
            padding: 15px 40px; font-size: 1.5rem; background: transparent; 
            border: 2px solid #0ff; color: #0ff; cursor: pointer; text-transform: uppercase; 
            font-family: 'Orbitron'; transition: all 0.2s; border-radius: 5px;
            animation: pulse 2s infinite; font-weight: bold;
        }
        .btn:hover { background: #0ff; color: #000; box-shadow: 0 0 40px #0ff; animation: none; }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px #0ff; }
            50% { box-shadow: 0 0 30px #0ff; }
            100% { box-shadow: 0 0 10px #0ff; }
        }
        
        .cards { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .card { 
            width: 220px; height: 320px; border: 2px solid #0ff; border-radius: 10px;
            background: linear-gradient(135deg, rgba(0,20,40,0.9), rgba(0,40,80,0.9)); 
            color: #fff; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; padding: 20px; text-align: center; cursor: pointer; 
            transition: all 0.2s; box-shadow: 0 0 15px rgba(0,255,255,0.2); 
        }
        .card:hover { 
            transform: translateY(-10px) scale(1.05); border-color: #f0f; 
            box-shadow: 0 0 25px rgba(255,0,255,0.6); 
        }
        .card h3 { color: #0ff; font-size: 1.4rem; margin-bottom: 15px; text-shadow: 0 0 5px #0ff; }
        .card p { font-size: 1rem; color: #ccc; }
        
        #damageNumbers { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index: 5; }
        .dmg { 
            position: absolute; font-weight: bold; font-size: 1.2rem; pointer-events: none; 
            animation: floatUp 0.5s ease-out forwards; text-shadow: 0 0 2px #000; 
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(1); opacity: 1; } 
            100% { transform: translateY(-40px) scale(1.5); opacity: 0; } 
        }
        
        #damageOverlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f00; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 15; 
        }
        
        #bossHud {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            width: 60%; text-align: center; z-index: 10;
        }
        .boss-label { color: #f40; font-weight: bold; text-shadow: 0 0 5px #f00; margin-bottom: 5px; font-size: 1.2rem; letter-spacing: 2px; }
        .boss-bar-bg { width: 100%; height: 15px; background: rgba(0,0,0,0.8); border: 2px solid #f40; border-radius: 4px; overflow: hidden; }
        .boss-bar-fg { height: 100%; background: #f40; box-shadow: 0 0 10px #f40; width: 100%; transition: width 0.1s linear; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="damageNumbers"></div>
    <div id="damageOverlay"></div>
    
    <div class="ui-layer" id="hud" style="display:none;">
        <div class="hud">
            <div class="hud-stats">
                LVL <span id="uiLevel">1</span> &nbsp;|&nbsp; SCORE: <span id="uiScore">0</span> &nbsp;|&nbsp; TIME: <span id="uiTime">0:00</span>
            </div>
            <div class="bar-container">
                <div class="bar-label">DATA (XP)</div>
                <div class="bar-bg"><div class="bar-fg xp-fg" id="uiXpBar"></div></div>
            </div>
            <div class="bar-container">
                <div class="bar-label">INTEGRITY (HP)</div>
                <div class="bar-bg"><div class="bar-fg hp-fg" id="uiHpBar"></div></div>
            </div>
        </div>
        <div id="bossHud" class="hidden">
            <div class="boss-label">THE MONOLITH</div>
            <div class="boss-bar-bg"><div class="boss-bar-fg" id="uiBossHpBar"></div></div>
        </div>
    </div>
    
    <div class="screen" id="startScreen">
        <h1>NEXUS PROTOCOL</h1>
        <p style="color:#aaa; max-width:600px; text-align:center; margin-bottom:30px; font-size: 1.2rem; line-height: 1.5;">
            Survive the void swarm. Use <b>WASD</b> to move. Weapons fire automatically.<br>
            Collect green data shards to upgrade your systems.
        </p>
        <button class="btn" id="startBtn">Initiate Link</button>
    </div>

    <div class="screen hidden" id="levelUpScreen">
        <h1 style="color:#f0f; text-shadow: 0 0 20px #f0f;">SYSTEM UPGRADE</h1>
        <div class="cards" id="upgradeCards"></div>
    </div>

    <div class="screen hidden" id="gameOverScreen">
        <h1 style="color:#f00; text-shadow: 0 0 20px #f00;">CONNECTION LOST</h1>
        <p style="font-size:1.5rem; color:#fff; margin: 10px 0;">Final Score: <span id="finalScore" style="color:#0ff;">0</span></p>
        <p style="font-size:1.5rem; color:#fff; margin: 10px 0;">Time Survived: <span id="finalTime" style="color:#0ff;">0:00</span></p>
        <button class="btn" id="restartBtn" style="margin-top:30px; border-color:#f00; color:#f00; animation: none;">Reboot System</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- AUDIO SYSTEM (Web Audio API) ---
        const AudioSys = {
            ctx: null,
            init() {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            },
            play(type) {
                if(!this.ctx) return;
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                const now = this.ctx.currentTime;
                if (type === 'shoot') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'explode') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'levelup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(600, now + 0.1);
                    osc.frequency.setValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'pickup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                }
            }
        };

        // --- THREE.JS SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 15, 10);
        camera.lookAt(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0x222244);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x88ccff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);
        scene.add(dirLight.target);

        // Ground & Grid
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x050510, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(200, 100, 0x00ffff, 0x002244);
        grid.position.y = 0.01;
        scene.add(grid);

        // Procedural Decor (Rocks)
        const decorGroup = new THREE.Group();
        const rockGeo = new THREE.DodecahedronGeometry(1);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 1.0 });
        for(let i=0; i<50; i++) {
            const rock = new THREE.Mesh(rockGeo, rockMat);
            rock.position.set((Math.random()-0.5)*180, 0.5, (Math.random()-0.5)*180);
            const s = Math.random() * 2 + 0.5;
            rock.scale.set(s, s, s);
            rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            rock.castShadow = true; rock.receiveShadow = true;
            decorGroup.add(rock);
        }
        scene.add(decorGroup);

        // Background Data Particles
        const bgParticles = [];
        const bgColors = [0x00ffff, 0xff00ff, 0x00ff00, 0x0088ff];
        for(let i=0; i<150; i++) {
            const p = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.1, 0.1),
                new THREE.MeshBasicMaterial({ color: bgColors[Math.floor(Math.random()*bgColors.length)], transparent: true, opacity: 0.4 })
            );
            p.position.set((Math.random()-0.5)*150, Math.random()*30, (Math.random()-0.5)*150);
            scene.add(p);
            bgParticles.push(p);
        }

        // --- GAME STATE & ENTITIES ---
        let gameState = 'start'; 
        let lastTime = 0;
        let gameTime = 0;
        let score = 0;
        let loopStarted = false;

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k] = true; });
        window.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k] = false; });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        window.oncontextmenu = () => false;

        // Player
        const player = {
            mesh: new THREE.Group(),
            x: 0, z: 0, vx: 0, vz: 0,
            speed: 8, hp: 100, maxHp: 100,
            xp: 0, maxXp: 10, level: 1, magnet: 5,
            weapons: {
                plasma: { timer: 0, cooldown: 0.5, damage: 10, count: 1, speed: 15, range: 25, level: 1 },
                orbit: { count: 0, damage: 5, radius: 3, speed: 3, level: 0, meshes: [] }
            },
            init() {
                const core = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.5),
                    new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x008888, roughness: 0.2 })
                );
                core.position.y = 0.5; core.castShadow = true;
                this.mesh.add(core); this.core = core;

                const cloak = new THREE.Mesh(
                    new THREE.ConeGeometry(0.6, 1.5, 4),
                    new THREE.MeshStandardMaterial({ color: 0x222255, transparent: true, opacity: 0.8 })
                );
                cloak.position.y = 0.2; cloak.rotation.y = Math.PI/4; cloak.castShadow = true;
                this.mesh.add(cloak);
                
                const pLight = new THREE.PointLight(0x00ffff, 1.5, 15);
                pLight.position.y = 1;
                this.mesh.add(pLight);
                
                scene.add(this.mesh);
            },
            update(dt) {
                let dx = 0, dz = 0;
                if(keys.w) dz -= 1; if(keys.s) dz += 1;
                if(keys.a) dx -= 1; if(keys.d) dx += 1;
                
                if(dx !== 0 || dz !== 0) {
                    const len = Math.sqrt(dx*dx + dz*dz);
                    this.x += (dx/len) * this.speed * dt;
                    this.z += (dz/len) * this.speed * dt;
                }
                
                this.x = Math.max(-95, Math.min(95, this.x));
                this.z = Math.max(-95, Math.min(95, this.z));
                
                this.mesh.position.set(this.x, 0, this.z);
                this.core.rotation.y += dt * 2;
                this.core.position.y = 0.5 + Math.sin(gameTime * 5) * 0.1;
                this.core.material.emissiveIntensity = 1 + Math.sin(gameTime * 10) * 0.2;
                
                this.updateWeapons(dt);
            },
            updateWeapons(dt) {
                const w = this.weapons.plasma;
                w.timer -= dt;
                if(w.timer <= 0) {
                    const target = getNearestEnemy(this.x, this.z, w.range);
                    if(target) {
                        w.timer = w.cooldown;
                        AudioSys.play('shoot');
                        for(let i=0; i<w.count; i++) {
                            const angleOffset = (i - (w.count-1)/2) * 0.2;
                            const angle = Math.atan2(target.z - this.z, target.x - this.x) + angleOffset;
                            spawnProjectile(this.x, this.z, angle, w.speed, w.damage, 0x00ffff);
                        }
                    }
                }
                
                const o = this.weapons.orbit;
                if(o.count > 0) {
                    while(o.meshes.length < o.count) {
                        const m = new THREE.Mesh(
                            new THREE.SphereGeometry(0.3),
                            new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xaa00aa })
                        );
                        scene.add(m); o.meshes.push(m);
                    }
                    o.meshes.forEach((m, i) => {
                        const a = gameTime * o.speed + (i * Math.PI * 2 / o.count);
                        m.position.set(this.x + Math.cos(a) * o.radius, 0.5, this.z + Math.sin(a) * o.radius);
                        enemies.forEach(e => {
                            if(e.hp > 0 && Math.hypot(e.x - m.position.x, e.z - m.position.z) < 0.8) {
                                if(!e.lastOrbitHit || gameTime - e.lastOrbitHit > 0.5) {
                                    damageEnemy(e, o.damage);
                                    e.lastOrbitHit = gameTime;
                                    spawnParticles(e.x, e.z, 0xff00ff, 5);
                                }
                            }
                        });
                    });
                }
            },
            takeDamage(amt) {
                this.hp -= amt;
                AudioSys.play('hit');
                const overlay = document.getElementById('damageOverlay');
                overlay.style.opacity = '0.3';
                setTimeout(() => overlay.style.opacity = '0', 100);
                if(this.hp <= 0) { this.hp = 0; gameOver(); }
                updateHUD();
            },
            addXp(amt) {
                this.xp += amt; score += amt;
                if(this.xp >= this.maxXp) {
                    this.xp -= this.maxXp; this.level++;
                    this.maxXp = Math.floor(this.maxXp * 1.5);
                    triggerLevelUp();
                }
                updateHUD();
            },
            reset() {
                this.x = 0; this.z = 0;
                this.hp = 100; this.maxHp = 100;
                this.xp = 0; this.maxXp = 10; this.level = 1;
                this.speed = 8; this.magnet = 5;
                this.weapons = {
                    plasma: { timer: 0, cooldown: 0.5, damage: 10, count: 1, speed: 15, range: 25, level: 1 },
                    orbit: { count: 0, damage: 5, radius: 3, speed: 3, level: 0, meshes: [] }
                };
                this.weapons.orbit.meshes.forEach(m => scene.remove(m));
                this.weapons.orbit.meshes = [];
            }
        };
        player.init();

        const enemies = [];
        const projectiles = [];
        const xpGems = [];
        const particles = [];

        // Geometries & Materials
        const enemyGeo1 = new THREE.IcosahedronGeometry(0.5);
        const enemyMat1 = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.5 });
        const enemyGeo2 = new THREE.TetrahedronGeometry(0.4);
        const enemyMat2 = new THREE.MeshStandardMaterial({ color: 0xffff00, roughness: 0.5 });
        const enemyGeo3 = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const enemyMat3 = new THREE.MeshStandardMaterial({ color: 0x8800ff, roughness: 0.5 });
        const bossGeo = new THREE.DodecahedronGeometry(3);
        const bossMat = new THREE.MeshStandardMaterial({ color: 0xff4400, roughness: 0.3, emissive: 0x331100 });

        const projGeo = new THREE.SphereGeometry(0.15);
        const projMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const eProjGeo = new THREE.SphereGeometry(0.25);
        const eProjMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const gemGeo = new THREE.OctahedronGeometry(0.2);
        const gemMat = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x008800 });

        function spawnEnemy(type, x, z) {
            let mesh, hp, speed, damage, xpVal, yPos = 0.5;
            if(type === 1) { mesh = new THREE.Mesh(enemyGeo1, enemyMat1); hp = 20; speed = 4; damage = 10; xpVal = 1; }
            else if(type === 2) { mesh = new THREE.Mesh(enemyGeo2, enemyMat2); hp = 10; speed = 7; damage = 5; xpVal = 1; yPos = 1.5; }
            else if(type === 3) { mesh = new THREE.Mesh(enemyGeo3, enemyMat3); hp = 60; speed = 2; damage = 20; xpVal = 3; yPos = 0.6; }
            else if(type === 4) { 
                mesh = new THREE.Mesh(bossGeo, bossMat); hp = 500; speed = 1.5; damage = 30; xpVal = 50; yPos = 3;
                const plight = new THREE.PointLight(0xff4400, 2, 20); mesh.add(plight);
            }
            
            const timeScale = 1 + gameTime / 60;
            hp = Math.floor(hp * timeScale);
            
            mesh.position.set(x, yPos, z);
            mesh.castShadow = true;
            scene.add(mesh);
            enemies.push({ mesh, type, x, z, hp, maxHp: hp, speed, damage, xpVal, yPos, angle: 0, timer: 0 });
        }

        function spawnProjectile(x, z, angle, speed, damage, colorHex) {
            const mat = colorHex === 0xff0000 ? eProjMat : projMat;
            const geo = colorHex === 0xff0000 ? eProjGeo : projGeo;
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.5, z);
            scene.add(mesh);
            projectiles.push({
                mesh, x, z, vx: Math.cos(angle)*speed, vz: Math.sin(angle)*speed, damage, life: 2, isEnemy: colorHex === 0xff0000
            });
        }

        function spawnGem(x, z, val) {
            const mesh = new THREE.Mesh(gemGeo, gemMat);
            mesh.position.set(x, 0.3, z);
            scene.add(mesh);
            xpGems.push({ mesh, x, z, val, vx: 0, vz: 0 });
        }

        function spawnParticles(x, z, color, count) {
            for(let i=0; i<count; i++) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: color }));
                mesh.position.set(x, 0.5, z);
                scene.add(mesh);
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({ mesh, life: 0.5 + Math.random()*0.5, vx: Math.cos(angle)*speed, vy: Math.random()*5+2, vz: Math.sin(angle)*speed });
            }
        }

        function showDamage(x, z, amount, color) {
            const container = document.getElementById('damageNumbers');
            if(container.children.length > 40) container.removeChild(container.firstChild);
            
            const el = document.createElement('div');
            el.className = 'dmg'; el.innerText = amount; el.style.color = color;
            const pos = new THREE.Vector3(x, 1, z); pos.project(camera);
            const sx = (pos.x * .5 + .5) * window.innerWidth;
            const sy = (pos.y * -.5 + .5) * window.innerHeight;
            el.style.left = sx + 'px'; el.style.top = sy + 'px';
            container.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }

        function getNearestEnemy(x, z, range) {
            let nearest = null; let minDist = range;
            for(const e of enemies) {
                if(e.hp <= 0) continue;
                const d = Math.hypot(e.x - x, e.z - z);
                if(d < minDist) { minDist = d; nearest = e; }
            }
            return nearest;
        }

        function damageEnemy(e, amt) {
            e.hp -= amt;
            showDamage(e.x, e.z, amt, '#ffffff');
            e.mesh.scale.setScalar(1.3);
            setTimeout(() => { if(e.mesh) e.mesh.scale.setScalar(1.0); }, 50);
            
            if(e.hp <= 0) {
                spawnParticles(e.x, e.z, e.mesh.material.color.getHex(), 15);
                AudioSys.play('explode');
                score += e.xpVal * 10;
                spawnGem(e.x, e.z, e.xpVal);
                scene.remove(e.mesh);
                e.hp = 0; 
            }
        }

        // --- GAME LOOP ---
        let spawnTimer = 0;
        let bossTimer = 120;

        function update(dt) {
            gameTime += dt;
            player.update(dt);
            
            // Camera follow
            const targetCamX = player.x;
            const targetCamZ = player.z + 10;
            camera.position.x += (targetCamX - camera.position.x) * 5 * dt;
            camera.position.z += (targetCamZ - camera.position.z) * 5 * dt;
            camera.lookAt(camera.position.x, 0, camera.position.z - 10);
            
            dirLight.position.set(player.x + 10, 20, player.z + 10);
            dirLight.target.position.set(player.x, 0, player.z);
            dirLight.target.updateMatrixWorld();
            
            // Spawning
            spawnTimer -= dt;
            if(spawnTimer <= 0) {
                spawnTimer = Math.max(0.2, 1.0 - gameTime/120);
                const angle = Math.random() * Math.PI * 2;
                const dist = 25 + Math.random() * 10;
                const ex = player.x + Math.cos(angle)*dist;
                const ez = player.z + Math.sin(angle)*dist;
                
                const r = Math.random();
                let type = 1;
                if(gameTime > 30 && r > 0.7) type = 2;
                if(gameTime > 60 && r > 0.9) type = 3;
                spawnEnemy(type, ex, ez);
            }
            
            bossTimer -= dt;
            if(bossTimer <= 0) {
                bossTimer = 120;
                spawnEnemy(4, player.x + 15, player.z);
            }
            
            // Enemies
            for(let i=enemies.length-1; i>=0; i--) {
                const e = enemies[i];
                if(e.hp <= 0) { enemies.splice(i, 1); continue; }
                
                const dx = player.x - e.x; const dz = player.z - e.z;
                const dist = Math.hypot(dx, dz);
                
                if(e.type === 4) {
                    e.mesh.rotation.y += dt; e.mesh.rotation.x += dt*0.5;
                    e.timer -= dt;
                    if(e.timer <= 0) {
                        e.timer = 2.0;
                        for(let j=0; j<8; j++) {
                            const a = (j/8)*Math.PI*2 + gameTime;
                            spawnProjectile(e.x, e.z, a, 10, 15, 0xff0000);
                        }
                        spawnEnemy(1, e.x + (Math.random()-0.5)*5, e.z + (Math.random()-0.5)*5);
                    }
                } else {
                    if(e.type === 2) { e.mesh.rotation.x += dt * 10; e.mesh.rotation.y += dt * 10; }
                    else { e.mesh.rotation.x += dt * e.speed * 0.5; e.mesh.rotation.y += dt * e.speed * 0.5; }
                    
                    if(dist > 0.1) {
                        const nx = dx/dist; const nz = dz/dist;
                        if(e.type === 2) {
                            e.x += nx * e.speed * dt + Math.cos(gameTime*10 + e.z)*dt;
                            e.z += nz * e.speed * dt + Math.sin(gameTime*10 + e.x)*dt;
                        } else {
                            e.x += nx * e.speed * dt; e.z += nz * e.speed * dt;
                        }
                    }
                }
                
                const yPos = e.type === 2 ? e.yPos + Math.sin(gameTime*10 + e.x)*0.5 : e.yPos;
                e.mesh.position.set(e.x, yPos, e.z);
                
                if(dist < 1.0) player.takeDamage(e.damage * dt * 2);
            }
            
            // Projectiles
            for(let i=projectiles.length-1; i>=0; i--) {
                const p = projectiles[i];
                p.x += p.vx * dt; p.z += p.vz * dt;
                p.mesh.position.set(p.x, 0.5, p.z);
                p.life -= dt;
                
                let hit = false;
                if(p.isEnemy) {
                    if(Math.hypot(p.x - player.x, p.z - player.z) < 0.8) { player.takeDamage(p.damage); hit = true; }
                } else {
                    for(const e of enemies) {
                        if(e.hp > 0 && Math.hypot(p.x - e.x, p.z - e.z) < 0.8) { damageEnemy(e, p.damage); hit = true; break; }
                    }
                }
                if(hit || p.life <= 0) { scene.remove(p.mesh); projectiles.splice(i, 1); }
            }
            
            // XP Gems
            for(let i=xpGems.length-1; i>=0; i--) {
                const g = xpGems[i];
                const dx = player.x - g.x; const dz = player.z - g.z;
                const dist = Math.hypot(dx, dz);
                
                if(dist < player.magnet) {
                    g.x += (dx/dist) * 15 * dt; g.z += (dz/dist) * 15 * dt;
                }
                g.mesh.position.set(g.x, 0.3 + Math.sin(gameTime*5 + i)*0.1, g.z);
                g.mesh.rotation.y += dt * 2;
                g.mesh.scale.setScalar(1 + Math.sin(gameTime*5 + i)*0.2);
                
                if(dist < 0.8) {
                    player.addXp(g.val); AudioSys.play('pickup');
                    scene.remove(g.mesh); xpGems.splice(i, 1);
                }
            }
            
            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.life -= dt; p.vy -= 10 * dt;
                p.mesh.position.x += p.vx * dt; p.mesh.position.y += p.vy * dt; p.mesh.position.z += p.vz * dt;
                p.mesh.scale.setScalar(p.life);
                if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }
            
            // Boss UI
            const boss = enemies.find(e => e.type === 4);
            if(boss) {
                document.getElementById('bossHud').classList.remove('hidden');
                document.getElementById('uiBossHpBar').style.width = Math.max(0, (boss.hp / boss.maxHp * 100)) + '%';
            } else {
                document.getElementById('bossHud').classList.add('hidden');
            }
            
            updateHUD();
        }

        // --- UI & FLOW ---
        const uiLevel = document.getElementById('uiLevel');
        const uiScore = document.getElementById('uiScore');
        const uiTime = document.getElementById('uiTime');
        const uiXpBar = document.getElementById('uiXpBar');
        const uiHpBar = document.getElementById('uiHpBar');

        function updateHUD() {
            uiLevel.innerText = player.level;
            uiScore.innerText = score;
            const m = Math.floor(gameTime / 60);
            const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
            uiTime.innerText = `${m}:${s}`;
            uiXpBar.style.width = (player.xp / player.maxXp * 100) + '%';
            uiHpBar.style.width = (player.hp / player.maxHp * 100) + '%';
        }

        const upgrades = [
            { id: 'plasma_cd', name: 'Overclock', desc: 'Plasma fires 15% faster', apply: () => player.weapons.plasma.cooldown *= 0.85 },
            { id: 'plasma_dmg', name: 'High Caliber', desc: 'Plasma damage +5', apply: () => player.weapons.plasma.damage += 5 },
            { id: 'plasma_cnt', name: 'Split Shot', desc: 'Plasma fires +1 projectile', apply: () => player.weapons.plasma.count += 1 },
            { id: 'orbit_cnt', name: 'Deflector', desc: 'Add an orbiting drone', apply: () => player.weapons.orbit.count += 1 },
            { id: 'orbit_dmg', name: 'Heavy Drone', desc: 'Drone damage +5', apply: () => player.weapons.orbit.damage += 5 },
            { id: 'speed', name: 'Servos', desc: 'Movement speed +1', apply: () => player.speed += 1 },
            { id: 'maxhp', name: 'Reinforce', desc: 'Max HP +20 & Heal', apply: () => { player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 20); } },
            { id: 'magnet', name: 'Vacuum', desc: 'Pickup range +2', apply: () => player.magnet += 2 }
        ];

        function triggerLevelUp() {
            gameState = 'levelup';
            AudioSys.play('levelup');
            document.getElementById('levelUpScreen').classList.remove('hidden');
            
            const container = document.getElementById('upgradeCards');
            container.innerHTML = '';
            
            const shuffled = [...upgrades].sort(() => 0.5 - Math.random());
            const choices = shuffled.slice(0, 3);
            
            choices.forEach(c => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<h3>${c.name}</h3><p>${c.desc}</p>`;
                div.onclick = () => {
                    c.apply();
                    document.getElementById('levelUpScreen').classList.add('hidden');
                    gameState = 'playing';
                    lastTime = performance.now();
                };
                container.appendChild(div);
            });
        }

        document.getElementById('startBtn').onclick = () => {
            AudioSys.init();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';
            resetGame();
            gameState = 'playing';
            lastTime = performance.now();
            if(!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }
        };

        document.getElementById('restartBtn').onclick = () => {
            document.getElementById('gameOverScreen').classList.add('hidden');
            resetGame();
            gameState = 'playing';
            lastTime = performance.now();
        };

        function gameOver() {
            gameState = 'gameover';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('bossHud').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            const m = Math.floor(gameTime / 60);
            const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
            document.getElementById('finalTime').innerText = `${m}:${s}`;
        }

        function resetGame() {
            enemies.forEach(e => scene.remove(e.mesh)); enemies.length = 0;
            projectiles.forEach(p => scene.remove(p.mesh)); projectiles.length = 0;
            xpGems.forEach(g => scene.remove(g.mesh)); xpGems.length = 0;
            particles.forEach(p => scene.remove(p.mesh)); particles.length = 0;
            player.reset();
            gameTime = 0; score = 0; spawnTimer = 0; bossTimer = 120;
            updateHUD();
        }

        function loop(now) {
            requestAnimationFrame(loop);
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            
            if(gameState === 'playing') {
                update(dt);
            } else if(gameState === 'start' || gameState === 'gameover') {
                camera.position.x = Math.sin(now * 0.0002) * 20;
                camera.position.z = Math.cos(now * 0.0002) * 20;
                camera.lookAt(0, 0, 0);
            }
            
            bgParticles.forEach(p => {
                p.position.y -= dt * 2;
                if(p.position.y < 0) p.position.y = 30;
                p.rotation.x += dt; p.rotation.y += dt;
            });
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
