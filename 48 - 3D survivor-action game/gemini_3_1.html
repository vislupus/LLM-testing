<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Survivor 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        .ui-layer { position: absolute; inset: 0; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        .text-outline {
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 4px rgba(0,0,0,0.5);
        }
        
        .floating-text {
            position: absolute; pointer-events: none; font-weight: 900;
            transform: translate(-50%, -50%); transition: opacity 0.5s ease-out;
            text-shadow: 0 0 5px rgba(0,0,0,0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* Custom Scrollbar for upgrade menu if it gets too big */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- Screen Flashes -->
    <div id="damage-overlay" class="absolute inset-0 bg-red-600 opacity-0 pointer-events-none transition-opacity duration-150 z-10"></div>
    <div id="levelup-overlay" class="absolute inset-0 bg-blue-400 opacity-0 pointer-events-none transition-opacity duration-500 z-10"></div>

    <!-- HUD Layer -->
    <div id="hud-layer" class="ui-layer flex flex-col justify-between p-6 z-20 hidden">
        <div class="flex justify-between items-start">
            <!-- Stats -->
            <div class="flex flex-col gap-3 w-80">
                <div class="flex items-center gap-3">
                    <span class="text-2xl font-black text-cyan-400 text-outline tracking-wider">LVL <span id="ui-level">1</span></span>
                    <div class="w-full bg-gray-900/80 rounded-full h-5 border-2 border-gray-700 relative overflow-hidden shadow-[0_0_10px_rgba(6,182,212,0.3)]">
                        <div id="ui-xp-bar" class="bg-gradient-to-r from-cyan-600 to-cyan-400 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
                <div class="w-full bg-gray-900/80 rounded-full h-8 border-2 border-gray-700 relative overflow-hidden shadow-[0_0_10px_rgba(239,68,68,0.3)]">
                    <div id="ui-hp-bar" class="bg-gradient-to-r from-red-700 to-red-500 h-full w-full transition-all duration-300"></div>
                    <span id="ui-hp-text" class="absolute inset-0 flex items-center justify-center text-md font-black text-white text-outline">100 / 100</span>
                </div>
            </div>
            
            <!-- Timer & Score -->
            <div class="text-center flex flex-col items-center">
                <div id="ui-timer" class="text-5xl font-mono font-black text-yellow-400 text-outline tracking-widest drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]">00:00</div>
                <div class="text-xl font-bold text-gray-300 text-outline mt-2 uppercase tracking-wide">Eliminated: <span id="ui-kills" class="text-white">0</span></div>
            </div>
            
            <div class="w-80"></div>
        </div>
    </div>

    <!-- Floating Text -->
    <div id="floating-text-container" class="ui-layer z-30 overflow-hidden"></div>

    <!-- Menus -->
    <div id="menu-layer" class="ui-layer interactive flex items-center justify-center bg-slate-950/80 backdrop-blur-md z-50">
        
        <!-- Start Menu -->
        <div id="start-menu" class="text-center">
            <h1 class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 mb-4 drop-shadow-[0_0_20px_rgba(6,182,212,0.6)] uppercase tracking-tighter">Stellar Survivor</h1>
            <p class="text-gray-300 mb-10 text-xl font-medium max-w-lg mx-auto leading-relaxed">
                Use <b class="text-white">WASD</b> or <b class="text-white">Arrows</b> to move.<br>Combat is automated.<br>Collect energy crystals to level up.
            </p>
            <button id="btn-start" class="px-10 py-5 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-black rounded-2xl text-2xl hover:scale-105 hover:from-cyan-500 hover:to-blue-500 transition-all shadow-[0_0_30px_rgba(6,182,212,0.5)] border-2 border-cyan-400 uppercase tracking-widest cursor-pointer">Initialize Drop</button>
        </div>
        
        <!-- Game Over Menu -->
        <div id="game-over-menu" class="text-center hidden">
            <h1 class="text-7xl font-black text-red-500 mb-6 drop-shadow-[0_0_20px_rgba(239,68,68,0.8)] uppercase tracking-tighter">Signal Lost</h1>
            <div class="bg-gray-900/80 p-8 rounded-3xl border border-gray-700 inline-block mb-10 shadow-2xl">
                <p class="text-2xl text-gray-400 font-bold mb-4 uppercase">Survival Time: <span id="go-time" class="text-yellow-400 block text-4xl mt-2">00:00</span></p>
                <div class="w-full h-px bg-gray-700 my-4"></div>
                <p class="text-2xl text-gray-400 font-bold uppercase">Hostiles Destroyed: <span id="go-kills" class="text-white block text-4xl mt-2">0</span></p>
            </div>
            <br>
            <button id="btn-restart" class="px-10 py-5 bg-red-600 text-white font-black rounded-2xl text-2xl hover:scale-105 hover:bg-red-500 transition-all shadow-[0_0_30px_rgba(239,68,68,0.5)] border-2 border-red-400 uppercase tracking-widest cursor-pointer">Deploy Again</button>
        </div>

        <!-- Upgrade Menu -->
        <div id="upgrade-menu" class="hidden flex flex-col items-center max-w-5xl w-full px-6">
            <h2 class="text-6xl font-black text-cyan-400 mb-10 drop-shadow-[0_0_15px_rgba(6,182,212,0.6)] text-outline uppercase tracking-widest">Level Up</h2>
            <div id="upgrade-choices" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                <!-- Injected via JS -->
            </div>
        </div>
        
    </div>

    <script>
        // --- GAME CONFIG & CONSTANTS ---
        const CONFIG = {
            cameraOffsetY: 25,
            cameraOffsetZ: 15,
            spawnRadius: 40,
            despawnRadius: 65,
            enemyCap: 250,
            gemCap: 400
        };

        const ENEMY_TYPES = [
            { id: 'scrap', name: 'Scrap', hp: 20, speed: 4, radius: 0.8, color: 0xef4444, xp: 1, type: 'box', size: 1.5, weight: 1 },
            { id: 'hunter', name: 'Hunter', hp: 12, speed: 7.5, radius: 0.6, color: 0xa855f7, xp: 2, type: 'cone', size: 1.2, weight: 0.5 },
            { id: 'brute', name: 'Brute', hp: 150, speed: 2, radius: 1.6, color: 0x22c55e, xp: 5, type: 'box', size: 3.2, weight: 3 },
            { id: 'boss', name: 'Titan', hp: 1200, speed: 2.5, radius: 3, color: 0xeab308, xp: 50, type: 'boss', size: 5, weight: 10 }
        ];

        const UPGRADES = [
            { id: 'hp', name: 'Titanium Plating', desc: 'Max HP +30', icon: '🛡️' },
            { id: 'speed', name: 'Servo Motors', desc: 'Move Speed +15%', icon: '⚡' },
            { id: 'blaster_dmg', name: 'Plasma Coils', desc: 'Blaster Damage +30%', icon: '💥' },
            { id: 'blaster_cd', name: 'Overclock', desc: 'Blaster Fire Rate +25%', icon: '🔫' },
            { id: 'orbital', name: 'Defender Drone', desc: 'Add 1 Orbital Drone', icon: '🪐' },
            { id: 'shockwave', name: 'Pulse Emitter', desc: 'Upgrade AoE Damage', icon: '🌊' },
            { id: 'magnet', name: 'Grav-Tether', desc: 'Pickup Radius +60%', icon: '🧲' },
            { id: 'heal', name: 'Nanorepair', desc: 'Restore 50% HP', icon: '🩹' }
        ];

        // --- UTILITIES ---
        function getRequiredXP(level) {
            return 5 + Math.floor(Math.pow(level, 1.8) * 3);
        }

        // --- CORE GAME CLASS ---
        class Game {
            constructor() {
                this.state = 'MENU'; // MENU, PLAYING, UPGRADE, GAMEOVER
                this.gameTime = 0;
                this.kills = 0;
                this.lastTime = performance.now();
                
                this.initThree();
                this.initSystems();
                this.initInput();
                this.initUI();
                
                this.frameId = requestAnimationFrame(this.loop.bind(this));
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0f172a);
                this.scene.fog = new THREE.Fog(0x0f172a, 30, 70);

                this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 150);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('game-container').appendChild(this.renderer.domElement);

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                // Lights
                const ambient = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0x93c5fd, 1.5);
                dirLight.position.set(30, 50, -30);
                dirLight.castShadow = true;
                dirLight.shadow.camera.left = -50;
                dirLight.shadow.camera.right = 50;
                dirLight.shadow.camera.top = 50;
                dirLight.shadow.camera.bottom = -50;
                dirLight.shadow.mapSize.width = 1024;
                dirLight.shadow.mapSize.height = 1024;
                this.scene.add(dirLight);
                this.dirLight = dirLight;

                // Infinite Ground
                const groundGeo = new THREE.PlaneGeometry(2000, 2000);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x0b1120, roughness: 0.9, metalness: 0.1 });
                this.ground = new THREE.Mesh(groundGeo, groundMat);
                this.ground.rotation.x = -Math.PI / 2;
                this.ground.receiveShadow = true;
                this.scene.add(this.ground);

                // Grid helper for tech look
                this.grid = new THREE.GridHelper(2000, 500, 0x1e293b, 0x1e293b);
                this.grid.position.y = 0.05;
                this.scene.add(this.grid);
            }

            initSystems() {
                this.environment = new Environment(this.scene);
                this.particles = new ParticleSystem(this.scene);
                this.gems = new GemManager(this.scene);
                this.floatingText = new FloatingTextManager(document.getElementById('floating-text-container'));
                
                this.player = new Player(this.scene, this);
                this.enemies = [];
                this.projectiles = [];
                
                this.spawner = new Spawner(this);
            }

            initInput() {
                this.keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
                window.addEventListener('keydown', e => { if(this.keys.hasOwnProperty(e.key)) this.keys[e.key] = true; });
                window.addEventListener('keyup', e => { if(this.keys.hasOwnProperty(e.key)) this.keys[e.key] = false; });
            }

            initUI() {
                document.getElementById('btn-start').onclick = () => this.startGame();
                document.getElementById('btn-restart').onclick = () => this.startGame();
            }

            startGame() {
                // Reset State
                this.gameTime = 0;
                this.kills = 0;
                this.player.reset();
                this.spawner.reset();
                
                // Clear entities
                this.enemies.forEach(e => { e.active = false; e.mesh.visible = false; });
                this.projectiles.forEach(p => { p.active = false; p.mesh.visible = false; });
                this.gems.clear();
                
                // Update UI
                document.getElementById('menu-layer').classList.add('hidden');
                document.getElementById('start-menu').classList.add('hidden');
                document.getElementById('game-over-menu').classList.add('hidden');
                document.getElementById('hud-layer').classList.remove('hidden');
                
                this.updateHUD();
                
                this.state = 'PLAYING';
                this.lastTime = performance.now();
            }

            gameOver() {
                this.state = 'GAMEOVER';
                document.getElementById('hud-layer').classList.add('hidden');
                document.getElementById('menu-layer').classList.remove('hidden');
                document.getElementById('game-over-menu').classList.remove('hidden');
                
                const mins = Math.floor(this.gameTime / 60).toString().padStart(2, '0');
                const secs = Math.floor(this.gameTime % 60).toString().padStart(2, '0');
                document.getElementById('go-time').innerText = `${mins}:${secs}`;
                document.getElementById('go-kills').innerText = this.kills;
            }

            triggerLevelUp() {
                this.state = 'UPGRADE';
                
                // Visual effect
                const el = document.getElementById('levelup-overlay');
                el.style.opacity = '0.3';
                setTimeout(() => el.style.opacity = '0', 500);
                
                // Emit particles
                this.particles.emit(this.player.pos.x, 2, this.player.pos.z, 0xfacc15, 50, 8);
                
                document.getElementById('menu-layer').classList.remove('hidden');
                document.getElementById('upgrade-menu').classList.remove('hidden');
                
                const shuffled = [...UPGRADES].sort(() => 0.5 - Math.random());
                const choices = shuffled.slice(0, 3);
                
                const container = document.getElementById('upgrade-choices');
                container.innerHTML = '';
                
                choices.forEach(upg => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-slate-900 border-2 border-slate-700 hover:border-cyan-400 p-8 rounded-2xl flex flex-col items-center gap-4 transition-all hover:scale-105 cursor-pointer shadow-lg hover:shadow-[0_0_20px_rgba(6,182,212,0.4)] group text-left w-full';
                    btn.innerHTML = `
                        <div class="text-5xl group-hover:scale-110 transition-transform">${upg.icon}</div>
                        <div class="text-2xl font-black text-white uppercase tracking-wide text-center">${upg.name}</div>
                        <div class="text-gray-400 text-center font-medium text-lg">${upg.desc}</div>
                    `;
                    btn.onclick = () => {
                        this.applyUpgrade(upg.id);
                        document.getElementById('upgrade-menu').classList.add('hidden');
                        document.getElementById('menu-layer').classList.add('hidden');
                        this.state = 'PLAYING';
                        this.lastTime = performance.now();
                        this.updateHUD();
                    };
                    container.appendChild(btn);
                });
            }

            applyUpgrade(id) {
                switch(id) {
                    case 'hp': 
                        this.player.maxHp += 30; 
                        this.player.hp = Math.min(this.player.maxHp, this.player.hp + 30); 
                        break;
                    case 'speed': this.player.speed *= 1.15; break;
                    case 'blaster_dmg': this.player.weapons.blaster.damage *= 1.30; break;
                    case 'blaster_cd': this.player.weapons.blaster.cooldown *= 0.75; break;
                    case 'orbital': 
                        this.player.weapons.orbital.count++; 
                        this.player.updateOrbitals(); 
                        break;
                    case 'shockwave': 
                        this.player.weapons.shockwave.active = true; 
                        this.player.weapons.shockwave.damage += 15; 
                        break;
                    case 'magnet': this.player.magnetRadius *= 1.6; break;
                    case 'heal': this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.player.maxHp * 0.5); break;
                }
            }

            updateHUD() {
                document.getElementById('ui-level').innerText = this.player.level;
                document.getElementById('ui-hp-text').innerText = `${Math.ceil(this.player.hp)} / ${this.player.maxHp}`;
                document.getElementById('ui-hp-bar').style.width = `${(this.player.hp / this.player.maxHp) * 100}%`;
                
                const xpPercent = (this.player.xp / getRequiredXP(this.player.level)) * 100;
                document.getElementById('ui-xp-bar').style.width = `${xpPercent}%`;
                
                const mins = Math.floor(this.gameTime / 60).toString().padStart(2, '0');
                const secs = Math.floor(this.gameTime % 60).toString().padStart(2, '0');
                document.getElementById('ui-timer').innerText = `${mins}:${secs}`;
                document.getElementById('ui-kills').innerText = this.kills;
            }

            loop() {
                const now = performance.now();
                let delta = (now - this.lastTime) / 1000;
                if (delta > 0.1) delta = 0.1; // Cap delta
                this.lastTime = now;

                if (this.state === 'PLAYING') {
                    this.gameTime += delta;
                    
                    // Input to movement
                    let dx = 0, dz = 0;
                    if (this.keys.w || this.keys.ArrowUp) dz -= 1;
                    if (this.keys.s || this.keys.ArrowDown) dz += 1;
                    if (this.keys.a || this.keys.ArrowLeft) dx -= 1;
                    if (this.keys.d || this.keys.ArrowRight) dx += 1;
                    
                    if (dx !== 0 || dz !== 0) {
                        const len = Math.sqrt(dx*dx + dz*dz);
                        this.player.move(dx/len, dz/len, delta);
                    } else {
                        this.player.idle(delta);
                    }

                    this.player.updateWeapons(delta, this);
                    
                    this.updateEnemies(delta);
                    this.updateProjectiles(delta);
                    this.gems.update(delta, this.player);
                    this.particles.update(delta);
                    this.spawner.update(delta);
                    this.environment.update(this.player.pos.x, this.player.pos.z);
                    
                    // Camera Follow
                    const targetX = this.player.pos.x;
                    const targetZ = this.player.pos.z + CONFIG.cameraOffsetZ;
                    this.camera.position.x += (targetX - this.camera.position.x) * delta * 4;
                    this.camera.position.z += (targetZ - this.camera.position.z) * delta * 4;
                    this.camera.position.y = CONFIG.cameraOffsetY;
                    this.camera.lookAt(this.camera.position.x, 0, this.camera.position.z - CONFIG.cameraOffsetZ);

                    // Light Follow
                    this.dirLight.position.x = this.camera.position.x + 30;
                    this.dirLight.position.z = this.camera.position.z - 30;
                    this.dirLight.target.position.set(this.camera.position.x, 0, this.camera.position.z);
                    this.dirLight.target.updateMatrixWorld();

                    this.floatingText.update(delta, this.camera);
                    
                    // Periodic UI update for timer
                    if (Math.floor(this.gameTime) > Math.floor(this.gameTime - delta)) {
                        this.updateHUD();
                    }
                }

                this.renderer.render(this.scene, this.camera);
                this.frameId = requestAnimationFrame(this.loop.bind(this));
            }

            updateEnemies(delta) {
                // Separation Logic (Simplified for performance)
                for (let i = 0; i < this.enemies.length; i++) {
                    const e1 = this.enemies[i];
                    if (!e1.active) continue;
                    
                    // Move towards player
                    const dx = this.player.pos.x - e1.mesh.position.x;
                    const dz = this.player.pos.z - e1.mesh.position.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    
                    if (dist > CONFIG.despawnRadius) {
                        e1.active = false; e1.mesh.visible = false;
                        continue;
                    }
                    
                    if (dist > 0.1) {
                        e1.mesh.position.x += (dx/dist) * e1.speed * delta;
                        e1.mesh.position.z += (dz/dist) * e1.speed * delta;
                        e1.mesh.lookAt(this.player.pos.x, e1.mesh.position.y, this.player.pos.z);
                    }

                    // Collision with player
                    if (dist < e1.radius + this.player.radius && e1.hitCooldown <= 0) {
                        this.player.takeDamage(10);
                        e1.hitCooldown = 1.0; // Attack speed
                    }
                    if (e1.hitCooldown > 0) e1.hitCooldown -= delta;

                    // Separation from other enemies
                    for (let j = i + 1; j < Math.min(i + 15, this.enemies.length); j++) {
                        const e2 = this.enemies[j];
                        if (!e2.active) continue;
                        const sdx = e1.mesh.position.x - e2.mesh.position.x;
                        const sdz = e1.mesh.position.z - e2.mesh.position.z;
                        const sdistSq = sdx*sdx + sdz*sdz;
                        const minDist = e1.radius + e2.radius;
                        if (sdistSq < minDist * minDist) {
                            const sdist = Math.sqrt(sdistSq) || 0.01;
                            const overlap = (minDist - sdist) * 0.5;
                            e1.mesh.position.x += (sdx/sdist) * overlap;
                            e1.mesh.position.z += (sdz/sdist) * overlap;
                            e2.mesh.position.x -= (sdx/sdist) * overlap;
                            e2.mesh.position.z -= (sdz/sdist) * overlap;
                        }
                    }

                    // Flash recovery
                    if (e1.flashTime > 0) {
                        e1.flashTime -= delta;
                        if (e1.flashTime <= 0) e1.mesh.material.emissive.setHex(0x000000);
                    }
                }
            }

            updateProjectiles(delta) {
                for (let p of this.projectiles) {
                    if (!p.active) continue;
                    p.life -= delta;
                    if (p.life <= 0) {
                        p.active = false; p.mesh.visible = false; continue;
                    }
                    
                    p.mesh.position.x += p.vx * delta;
                    p.mesh.position.z += p.vz * delta;

                    // Collision check
                    for (let e of this.enemies) {
                        if (!e.active) continue;
                        const dx = p.mesh.position.x - e.mesh.position.x;
                        const dz = p.mesh.position.z - e.mesh.position.z;
                        if (dx*dx + dz*dz < (p.radius + e.radius)*(p.radius + e.radius)) {
                            this.damageEnemy(e, p.damage);
                            p.active = false; p.mesh.visible = false;
                            this.particles.emit(p.mesh.position.x, 1, p.mesh.position.z, 0x06b6d4, 5, 5);
                            break;
                        }
                    }
                }
            }

            damageEnemy(enemy, amount) {
                // Randomize damage slightly
                const dmg = Math.floor(amount * (0.8 + Math.random() * 0.4));
                const isCrit = Math.random() < 0.1;
                const finalDmg = isCrit ? dmg * 2 : dmg;
                
                enemy.hp -= finalDmg;
                enemy.mesh.material.emissive.setHex(0xffffff);
                enemy.flashTime = 0.1;

                this.floatingText.spawn(enemy.mesh.position.x, enemy.mesh.position.y + 2, enemy.mesh.position.z, finalDmg, isCrit ? '#facc15' : '#ffffff', isCrit);

                if (enemy.hp <= 0) {
                    enemy.active = false;
                    enemy.mesh.visible = false;
                    this.kills++;
                    this.particles.emit(enemy.mesh.position.x, 1, enemy.mesh.position.z, enemy.type.color, 15, 6);
                    this.gems.spawn(enemy.mesh.position.x, enemy.mesh.position.z, enemy.type.xp);
                }
            }
        }

        // --- ENTITY CLASSES ---
        class Player {
            constructor(scene, game) {
                this.game = game;
                this.scene = scene;
                this.group = new THREE.Group();
                this.pos = this.group.position;
                this.radius = 1.2;
                
                // Visuals
                const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 1.2);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.3, metalness: 0.8 });
                this.body = new THREE.Mesh(bodyGeo, bodyMat);
                this.body.position.y = 0.9;
                this.body.castShadow = true;
                this.group.add(this.body);

                const headGeo = new THREE.OctahedronGeometry(0.7);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x0ea5e9, emissiveIntensity: 0.5 });
                this.head = new THREE.Mesh(headGeo, headMat);
                this.head.position.y = 2.2;
                this.head.castShadow = true;
                this.group.add(this.head);

                this.scene.add(this.group);
                
                // Shockwave visual
                this.swMesh = new THREE.Mesh(
                    new THREE.TorusGeometry(1, 0.2, 8, 32),
                    new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0 })
                );
                this.swMesh.rotation.x = -Math.PI / 2;
                this.swMesh.position.y = 0.2;
                this.scene.add(this.swMesh);

                this.orbitals = [];
                this.orbitalRotation = 0;

                this.reset();
            }

            reset() {
                this.hp = 100;
                this.maxHp = 100;
                this.speed = 10;
                this.level = 1;
                this.xp = 0;
                this.magnetRadius = 8;
                this.pos.set(0, 0, 0);
                this.walkTime = 0;
                
                this.weapons = {
                    blaster: { damage: 15, cooldown: 0.6, timer: 0 },
                    orbital: { count: 0, damage: 10, radius: 3.5, hitTimers: new Map() },
                    shockwave: { active: false, damage: 25, cooldown: 3, timer: 0, radius: 6, life: 0 }
                };
                this.updateOrbitals();
            }

            takeDamage(amount) {
                this.hp -= amount;
                this.game.updateHUD();
                
                // Red flash
                const el = document.getElementById('damage-overlay');
                el.style.opacity = '0.4';
                setTimeout(() => el.style.opacity = '0', 150);

                if (this.hp <= 0) {
                    this.game.gameOver();
                }
            }

            addXP(amount) {
                this.xp += amount;
                if (this.xp >= getRequiredXP(this.level)) {
                    this.xp -= getRequiredXP(this.level);
                    this.level++;
                    this.game.triggerLevelUp();
                }
                this.game.updateHUD();
            }

            move(dx, dz, delta) {
                this.pos.x += dx * this.speed * delta;
                this.pos.z += dz * this.speed * delta;
                
                const targetAngle = Math.atan2(dx, dz);
                let diff = targetAngle - this.group.rotation.y;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                this.group.rotation.y += diff * delta * 15;

                this.walkTime += delta * 15;
                this.body.position.y = 0.9 + Math.abs(Math.sin(this.walkTime)) * 0.2;
                this.head.position.y = 2.2 + Math.abs(Math.sin(this.walkTime)) * 0.2;
                this.head.rotation.y += delta;
            }

            idle(delta) {
                this.body.position.y += (0.9 - this.body.position.y) * delta * 10;
                this.head.position.y += (2.2 - this.head.position.y) * delta * 10;
                this.head.rotation.y += delta * 0.5;
            }

            updateOrbitals() {
                // Remove old
                this.orbitals.forEach(o => this.scene.remove(o));
                this.orbitals = [];
                // Create new
                const geo = new THREE.SphereGeometry(0.4, 16, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x3b82f6, emissiveIntensity: 0.8 });
                for(let i=0; i<this.weapons.orbital.count; i++) {
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.y = 1.2;
                    this.scene.add(mesh);
                    this.orbitals.push(mesh);
                }
            }

            updateWeapons(delta, game) {
                // Blaster
                this.weapons.blaster.timer -= delta;
                if (this.weapons.blaster.timer <= 0) {
                    // Find nearest
                    let nearest = null; let minDist = Infinity;
                    for (let e of game.enemies) {
                        if (!e.active) continue;
                        const dSq = e.mesh.position.distanceToSquared(this.pos);
                        if (dSq < minDist && dSq < 400) { minDist = dSq; nearest = e; }
                    }
                    if (nearest) {
                        this.weapons.blaster.timer = this.weapons.blaster.cooldown;
                        const dx = nearest.mesh.position.x - this.pos.x;
                        const dz = nearest.mesh.position.z - this.pos.z;
                        const dist = Math.sqrt(dx*dx + dz*dz);
                        game.spawner.fireProjectile(this.pos.x, 1, this.pos.z, (dx/dist)*25, (dz/dist)*25, this.weapons.blaster.damage);
                    }
                }

                // Orbitals
                if (this.orbitals.length > 0) {
                    this.orbitalRotation += delta * 3;
                    for(let i=0; i<this.orbitals.length; i++) {
                        const angle = this.orbitalRotation + (i * Math.PI * 2 / this.orbitals.length);
                        const ox = this.pos.x + Math.cos(angle) * this.weapons.orbital.radius;
                        const oz = this.pos.z + Math.sin(angle) * this.weapons.orbital.radius;
                        this.orbitals[i].position.set(ox, 1.2, oz);
                        
                        // Collision
                        for (let e of game.enemies) {
                            if (!e.active) continue;
                            const ex = e.mesh.position.x, ez = e.mesh.position.z;
                            if ((ox-ex)**2 + (oz-ez)**2 < (e.radius + 0.4)**2) {
                                const hitKey = e.mesh.uuid + '_' + i;
                                const lastHit = this.weapons.orbital.hitTimers.get(hitKey) || 0;
                                if (game.gameTime - lastHit > 0.5) {
                                    game.damageEnemy(e, this.weapons.orbital.damage);
                                    this.weapons.orbital.hitTimers.set(hitKey, game.gameTime);
                                }
                            }
                        }
                    }
                }

                // Shockwave
                if (this.weapons.shockwave.active) {
                    this.weapons.shockwave.timer -= delta;
                    if (this.weapons.shockwave.timer <= 0) {
                        this.weapons.shockwave.timer = this.weapons.shockwave.cooldown;
                        this.weapons.shockwave.life = 0.5;
                        this.swMesh.position.set(this.pos.x, 0.2, this.pos.z);
                        this.swMesh.material.opacity = 0.8;
                        
                        // Damage all in radius
                        const rSq = this.weapons.shockwave.radius ** 2;
                        for (let e of game.enemies) {
                            if (!e.active) continue;
                            if (e.mesh.position.distanceToSquared(this.pos) < rSq) {
                                game.damageEnemy(e, this.weapons.shockwave.damage);
                                // pushback
                                const dx = e.mesh.position.x - this.pos.x;
                                const dz = e.mesh.position.z - this.pos.z;
                                const dist = Math.sqrt(dx*dx + dz*dz) || 1;
                                e.mesh.position.x += (dx/dist) * 2;
                                e.mesh.position.z += (dz/dist) * 2;
                            }
                        }
                    }
                    
                    if (this.weapons.shockwave.life > 0) {
                        this.weapons.shockwave.life -= delta;
                        const progress = 1 - (this.weapons.shockwave.life / 0.5);
                        const s = 0.1 + progress * this.weapons.shockwave.radius;
                        this.swMesh.scale.set(s, s, s);
                        this.swMesh.material.opacity = 0.8 * (1 - progress);
                    } else {
                        this.swMesh.material.opacity = 0;
                    }
                }
            }
        }

        // --- SYSTEMS ---
        class Spawner {
            constructor(game) {
                this.game = game;
                this.accumulator = 0;
                this.bossSpawned = [false, false, false, false];
            }
            reset() {
                this.accumulator = 0;
                this.bossSpawned = [false, false, false, false];
            }
            update(delta) {
                const mins = this.game.gameTime / 60;
                
                // Boss spawns every 2 minutes
                const bossIndex = Math.floor(mins / 2);
                if (mins > 0 && bossIndex > 0 && !this.bossSpawned[bossIndex]) {
                    this.spawnEnemy(ENEMY_TYPES[3]);
                    this.bossSpawned[bossIndex] = true;
                }

                const waveIntensity = 1 + mins * 0.8;
                this.accumulator += delta * waveIntensity * 2;
                
                while(this.accumulator > 1) {
                    this.accumulator -= 1;
                    
                    // Pick enemy
                    let type = ENEMY_TYPES[0];
                    const r = Math.random();
                    if (mins > 3) type = r < 0.3 ? ENEMY_TYPES[2] : (r < 0.6 ? ENEMY_TYPES[1] : ENEMY_TYPES[0]);
                    else if (mins > 1.5) type = r < 0.15 ? ENEMY_TYPES[2] : (r < 0.4 ? ENEMY_TYPES[1] : ENEMY_TYPES[0]);
                    else if (mins > 0.5) type = r < 0.25 ? ENEMY_TYPES[1] : ENEMY_TYPES[0];

                    this.spawnEnemy(type);
                }
            }
            
            spawnEnemy(type) {
                const activeCount = this.game.enemies.filter(e => e.active).length;
                if (activeCount >= CONFIG.enemyCap) return;

                let enemy = this.game.enemies.find(e => !e.active && e.type.id === type.id);
                if (!enemy) {
                    // Create new
                    let geo;
                    if (type.type === 'box') geo = new THREE.BoxGeometry(type.size, type.size, type.size);
                    else if (type.type === 'cone') geo = new THREE.ConeGeometry(type.size/2, type.size, 8).rotateX(Math.PI/2);
                    else if (type.type === 'boss') geo = new THREE.OctahedronGeometry(type.size);

                    const mat = new THREE.MeshStandardMaterial({ color: type.color, roughness: 0.7 });
                    if (type.type === 'boss') { mat.emissive.setHex(0x551100); mat.metalness = 0.5; }
                    
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true; mesh.receiveShadow = true;
                    this.game.scene.add(mesh);
                    
                    enemy = { type, mesh, active: false };
                    this.game.enemies.push(enemy);
                }

                // Stats scaling
                const mins = this.game.gameTime / 60;
                enemy.hp = type.hp * (1 + mins * 0.5);
                enemy.speed = type.speed * (1 + mins * 0.1);
                enemy.radius = type.radius;
                enemy.hitCooldown = 0;
                enemy.flashTime = 0;
                enemy.active = true;
                enemy.mesh.visible = true;
                enemy.mesh.material.emissive.setHex(type.type === 'boss' ? 0x551100 : 0x000000);

                // Position
                const angle = Math.random() * Math.PI * 2;
                enemy.mesh.position.set(
                    this.game.player.pos.x + Math.cos(angle) * CONFIG.spawnRadius,
                    type.size / 2,
                    this.game.player.pos.z + Math.sin(angle) * CONFIG.spawnRadius
                );
            }

            fireProjectile(x, y, z, vx, vz, damage) {
                let p = this.game.projectiles.find(p => !p.active);
                if (!p) {
                    const mesh = new THREE.Mesh(
                        new THREE.CapsuleGeometry(0.2, 0.8, 4, 8).rotateX(Math.PI/2),
                        new THREE.MeshBasicMaterial({ color: 0x06b6d4 })
                    );
                    this.game.scene.add(mesh);
                    p = { mesh, active: false };
                    this.game.projectiles.push(p);
                }
                p.active = true;
                p.mesh.visible = true;
                p.mesh.position.set(x, y, z);
                p.mesh.lookAt(x+vx, y, z+vz);
                p.vx = vx; p.vz = vz;
                p.damage = damage;
                p.radius = 0.5;
                p.life = 2.0;
            }
        }

        class GemManager {
            constructor(scene) {
                this.max = CONFIG.gemCap;
                this.geometry = new THREE.OctahedronGeometry(0.3);
                this.material = new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x06b6d4, emissiveIntensity: 0.5, roughness: 0.2 });
                this.mesh = new THREE.InstancedMesh(this.geometry, this.material, this.max);
                this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                this.mesh.castShadow = true;
                scene.add(this.mesh);
                
                this.gems = [];
                this.dummy = new THREE.Object3D();
                this.time = 0;
            }
            clear() {
                this.gems = [];
                this.mesh.count = 0;
            }
            spawn(x, z, value) {
                if (this.gems.length >= this.max) {
                    // Replace oldest or combine
                    this.gems[0].value += value;
                    return;
                }
                this.gems.push({ x, z, value, y: 0.3 });
            }
            update(delta, player) {
                this.time += delta * 3;
                let alive = 0;
                const magSq = player.magnetRadius ** 2;
                
                for(let i=0; i<this.gems.length; i++) {
                    const g = this.gems[i];
                    const dx = player.pos.x - g.x;
                    const dz = player.pos.z - g.z;
                    const distSq = dx*dx + dz*dz;
                    
                    if (distSq < magSq) {
                        const dist = Math.sqrt(distSq);
                        if (dist < player.radius) {
                            player.addXP(g.value);
                            continue; // collect, don't keep alive
                        } else {
                            // move towards player
                            const speed = 15 * delta;
                            g.x += (dx/dist) * speed;
                            g.z += (dz/dist) * speed;
                        }
                    }
                    
                    // Bounce animation
                    g.y = 0.4 + Math.sin(this.time + g.x) * 0.15;
                    
                    this.dummy.position.set(g.x, g.y, g.z);
                    this.dummy.rotation.y = this.time + g.z;
                    this.dummy.rotation.x = this.time * 0.5;
                    // scale by value
                    const s = 1 + Math.min(g.value * 0.1, 1.5);
                    this.dummy.scale.set(s,s,s);
                    this.dummy.updateMatrix();
                    this.mesh.setMatrixAt(alive, this.dummy.matrix);
                    
                    this.gems[alive] = g;
                    alive++;
                }
                this.gems.length = alive;
                this.mesh.count = alive;
                this.mesh.instanceMatrix.needsUpdate = true;
            }
        }

        class ParticleSystem {
            constructor(scene) {
                this.max = 1000;
                this.geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                this.material = new THREE.MeshBasicMaterial({ color: 0xffffff });
                this.mesh = new THREE.InstancedMesh(this.geometry, this.material, this.max);
                this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                scene.add(this.mesh);
                
                this.particles = [];
                this.dummy = new THREE.Object3D();
                this.color = new THREE.Color();
            }
            emit(x, y, z, colorHex, count, speed) {
                for(let i=0; i<count; i++) {
                    if (this.particles.length >= this.max) break;
                    const vx = (Math.random() - 0.5) * speed;
                    const vy = (Math.random() * 0.5 + 0.5) * speed;
                    const vz = (Math.random() - 0.5) * speed;
                    this.particles.push({
                        x, y, z, vx, vy, vz,
                        life: 1.0, maxLife: 0.3 + Math.random()*0.4,
                        color: new THREE.Color(colorHex)
                    });
                }
            }
            update(delta) {
                let alive = 0;
                for(let i=0; i<this.particles.length; i++) {
                    const p = this.particles[i];
                    p.life -= delta;
                    if (p.life > 0) {
                        p.x += p.vx * delta;
                        p.y += p.vy * delta;
                        p.z += p.vz * delta;
                        p.vy -= 15 * delta; // gravity
                        
                        this.dummy.position.set(p.x, p.y, p.z);
                        const scale = p.life / p.maxLife;
                        this.dummy.scale.set(scale, scale, scale);
                        this.dummy.updateMatrix();
                        
                        this.mesh.setMatrixAt(alive, this.dummy.matrix);
                        this.mesh.setColorAt(alive, p.color);
                        
                        this.particles[alive] = p;
                        alive++;
                    }
                }
                this.particles.length = alive;
                this.mesh.count = alive;
                this.mesh.instanceMatrix.needsUpdate = true;
                if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
            }
        }

        class Environment {
            constructor(scene) {
                this.props = [];
                this.group = new THREE.Group();
                scene.add(this.group);
                
                const geo1 = new THREE.CylinderGeometry(0, 0.8, 4, 5); // stylized tree/crystal
                const mat1 = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, flatShading: true });
                
                const geo2 = new THREE.DodecahedronGeometry(1.5); // rock
                const mat2 = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9, flatShading: true });

                for(let i=0; i<80; i++) {
                    const isTree = Math.random() > 0.5;
                    const mesh = new THREE.Mesh(isTree ? geo1 : geo2, isTree ? mat1 : mat2);
                    mesh.position.set((Math.random()-0.5)*200, isTree ? 2 : 0.5, (Math.random()-0.5)*200);
                    mesh.rotation.y = Math.random() * Math.PI;
                    mesh.rotation.z = (Math.random() - 0.5) * 0.2;
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    this.group.add(mesh);
                    this.props.push(mesh);
                }
            }
            update(px, pz) {
                for(let mesh of this.props) {
                    if (mesh.position.x < px - 100) mesh.position.x += 200;
                    if (mesh.position.x > px + 100) mesh.position.x -= 200;
                    if (mesh.position.z < pz - 100) mesh.position.z += 200;
                    if (mesh.position.z > pz + 100) mesh.position.z -= 200;
                }
            }
        }

        class FloatingTextManager {
            constructor(container) {
                this.container = container;
                this.pool = [];
                this.active = [];
            }
            spawn(x, y, z, text, color, isCrit) {
                let el;
                if (this.pool.length > 0) {
                    el = this.pool.pop();
                    el.style.display = 'block';
                } else {
                    el = document.createElement('div');
                    el.className = 'floating-text text-outline';
                    this.container.appendChild(el);
                }
                el.innerText = text;
                el.style.color = color;
                el.style.fontSize = isCrit ? '32px' : '20px';
                
                this.active.push({ el, pos: new THREE.Vector3(x, y, z), life: 0.6, maxLife: 0.6 });
            }
            update(delta, camera) {
                for (let i = this.active.length - 1; i >= 0; i--) {
                    const item = this.active[i];
                    item.life -= delta;
                    if (item.life <= 0) {
                        item.el.style.display = 'none';
                        this.pool.push(item.el);
                        this.active.splice(i, 1);
                        continue;
                    }
                    
                    item.pos.y += delta * 4; // float up fast
                    
                    const screenPos = item.pos.clone().project(camera);
                    if (screenPos.z > 1) { // behind camera
                        item.el.style.display = 'none';
                        continue;
                    }
                    item.el.style.display = 'block';
                    const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y = -(screenPos.y * 0.5 - 0.5) * window.innerHeight;
                    
                    item.el.style.left = `${x}px`;
                    item.el.style.top = `${y}px`;
                    item.el.style.opacity = item.life / item.maxLife;
                    item.el.style.transform = `translate(-50%, -50%) scale(${0.5 + (item.life/item.maxLife)*0.5})`;
                }
            }
        }

        // --- START ---
        window.onload = () => {
            const game = new Game();
        };
    </script>
