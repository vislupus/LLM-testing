<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Nexus Survivor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        #healthBar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
            height: 24px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff4757;
            border-radius: 12px;
            overflow: hidden;
        }
        
        #healthFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff4757);
            transition: width 0.3s ease;
        }
        
        #xpBar {
            position: absolute;
            top: 50px;
            left: 20px;
            width: 200px;
            height: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #2ed573;
            border-radius: 8px;
            overflow: hidden;
        }
        
        #xpFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2ed573, #7bed9f);
            transition: width 0.3s ease;
        }
        
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
        }
        
        .stat {
            margin-bottom: 8px;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        .stat-value {
            color: #ffd700;
            font-weight: bold;
        }
        
        #waveInfo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }
        
        #upgradeMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #7bed9f;
            border-radius: 20px;
            padding: 30px;
            width: 500px;
            max-width: 90%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        
        #upgradeMenu.active {
            opacity: 1;
            pointer-events: all;
        }
        
        #upgradeTitle {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #7bed9f;
        }
        
        .upgrade-option {
            background: rgba(40, 40, 60, 0.8);
            border: 1px solid #2ed573;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upgrade-option:hover {
            background: rgba(60, 60, 90, 0.9);
            transform: translateY(-2px);
            border-color: #7bed9f;
        }
        
        .upgrade-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .upgrade-desc {
            font-size: 14px;
            color: #a4b0be;
        }
        
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        
        #gameOver.active {
            opacity: 1;
            pointer-events: all;
        }
        
        #gameOver h1 {
            font-size: 64px;
            color: #ff4757;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
        }
        
        #finalScore {
            font-size: 24px;
            margin-bottom: 30px;
            color: #7bed9f;
        }
        
        #restartButton {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: all;
        }
        
        #restartButton:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
        }
        
        .damage-number {
            position: absolute;
            color: #ff6b6b;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 20;
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
        
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #loadingText {
            font-size: 24px;
            margin-top: 20px;
            color: #7bed9f;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="pulse">Loading Crystal Nexus...</div>
        <div id="loadingText">Preparing your survival experience</div>
    </div>
    
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <div id="uiOverlay">
            <div id="healthBar">
                <div id="healthFill"></div>
            </div>
            <div id="xpBar">
                <div id="xpFill"></div>
            </div>
            <div id="stats">
                <div class="stat">Wave: <span id="waveCount" class="stat-value">1</span></div>
                <div class="stat">Score: <span id="scoreValue" class="stat-value">0</span></div>
                <div class="stat">Level: <span id="levelValue" class="stat-value">1</span></div>
            </div>
            <div id="waveInfo">Wave 1 Starting!</div>
            <div id="upgradeMenu">
                <div id="upgradeTitle">Choose Your Upgrade!</div>
                <div id="upgradeOptions"></div>
            </div>
            <div id="gameOver">
                <h1>CRYSTAL NEXUS FALLEN</h1>
                <div id="finalScore">Final Score: 0</div>
                <button id="restartButton">RESTART SURVIVAL</button>
            </div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.185.1/examples/js/controls/OrbitControls.min.js"></script>
    
    <script>
        // Game constants and configuration
        const CONFIG = {
            PLAYER: {
                SPEED: 8,
                HEALTH: 100,
                MAX_HEALTH: 100,
                SIZE: 1.2,
                DAMAGE: 25,
                ATTACK_RANGE: 8,
                ATTACK_COOLDOWN: 0.3
            },
            ENEMIES: {
                BASE: {
                    HEALTH: 30,
                    SPEED: 2,
                    SIZE: 0.8,
                    DAMAGE: 10,
                    SPAWN_RADIUS: 25
                },
                FAST: {
                    HEALTH: 20,
                    SPEED: 4,
                    SIZE: 0.6,
                    DAMAGE: 8,
                    SPAWN_RADIUS: 30
                },
                TANK: {
                    HEALTH: 80,
                    SPEED: 1.2,
                    SIZE: 1.5,
                    DAMAGE: 20,
                    SPAWN_RADIUS: 20
                },
                BOSS: {
                    HEALTH: 500,
                    SPEED: 0.8,
                    SIZE: 3,
                    DAMAGE: 35,
                    SPAWN_RADIUS: 15
                }
            },
            WEAPONS: {
                PULSE_CANNON: { DAMAGE: 25, RANGE: 8, COOLDOWN: 0.3, COLOR: 0x00ffff },
                CRYSTAL_BURST: { DAMAGE: 40, RANGE: 12, COOLDOWN: 0.8, COLOR: 0xff00ff },
                ENERGY_RAY: { DAMAGE: 15, RANGE: 15, COOLDOWN: 0.1, COLOR: 0x00ff00 }
            },
            UPGRADES: [
                { name: "Health Boost", desc: "+25 Max Health", type: "health", value: 25 },
                { name: "Damage Amplifier", desc: "+10 Attack Damage", type: "damage", value: 10 },
                { name: "Speed Enhancement", desc: "+2 Movement Speed", type: "speed", value: 2 },
                { name: "Regeneration Core", desc: "+2 HP/s Regeneration", type: "regen", value: 2 },
                { name: "Critical Surge", desc: "+15% Critical Chance", type: "crit", value: 0.15 },
                { name: "Range Extender", desc: "+3 Attack Range", type: "range", value: 3 }
            ],
            PARTICLE_COLORS: [0xff6b6b, 0x7bed9f, 0x2ed573, 0xffd700, 0x00ffff],
            ENVIRONMENT: {
                GROUND_SIZE: 100,
                PLATFORM_COUNT: 12,
                PLATFORM_MIN_SIZE: 3,
                PLATFORM_MAX_SIZE: 8,
                OBSTACLE_COUNT: 8
            }
        };

        // Game state
        const gameState = {
            player: null,
            enemies: [],
            projectiles: [],
            particles: [],
            pickups: [],
            platforms: [],
            obstacles: [],
            camera: null,
            scene: null,
            renderer: null,
            clock: new THREE.Clock(),
            keys: {},
            mouse: { x: 0, y: 0, down: false },
            wave: 1,
            score: 0,
            level: 1,
            xp: 0,
            xpToNext: 100,
            isGameOver: false,
            isPaused: false,
            showingUpgrade: false,
            lastAttackTime: 0,
            regenTimer: 0,
            waveTimer: 0,
            waveDuration: 45,
            enemiesKilled: 0,
            totalEnemies: 0,
            bossSpawned: false
        };

        // Initialize Three.js
        function init() {
            // Remove loading screen
            document.getElementById('loading').style.display = 'none';
            
            // Scene setup
            gameState.scene = new THREE.Scene();
            gameState.scene.background = new THREE.Color(0x0a0a1a);
            gameState.scene.fog = new THREE.Fog(0x0a0a1a, 20, 50);
            
            // Camera setup
            gameState.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            gameState.camera.position.set(0, 15, 20);
            gameState.camera.lookAt(0, 0, 0);
            
            // Renderer setup
            gameState.renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'),
                antialias: true,
                alpha: true
            });
            gameState.renderer.setSize(window.innerWidth, window.innerHeight);
            gameState.renderer.shadowMap.enabled = true;
            gameState.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            gameState.scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 15);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            gameState.scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0x7bed9f, 1, 50);
            pointLight.position.set(0, 5, 0);
            pointLight.castShadow = true;
            gameState.scene.add(pointLight);
            
            // Create game world
            createEnvironment();
            createPlayer();
            
            // Event listeners
            setupEventListeners();
            
            // Start game loop
            animate();
            
            // Show first wave info
            showWaveInfo("Wave 1 Starting!");
        }

        function createEnvironment() {
            // Ground
            const groundGeometry = new THREE.PlaneGeometry(CONFIG.ENVIRONMENT.GROUND_SIZE, CONFIG.ENVIRONMENT.GROUND_SIZE);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2d3436,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            gameState.scene.add(ground);
            
            // Platforms
            for (let i = 0; i < CONFIG.ENVIRONMENT.PLATFORM_COUNT; i++) {
                const size = Math.random() * (CONFIG.ENVIRONMENT.PLATFORM_MAX_SIZE - CONFIG.ENVIRONMENT.PLATFORM_MIN_SIZE) + CONFIG.ENVIRONMENT.PLATFORM_MIN_SIZE;
                const platformGeometry = new THREE.BoxGeometry(size, 1, size);
                const platformMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x6c5ce7,
                    roughness: 0.7,
                    metalness: 0.3
                });
                const platform = new THREE.Mesh(platformGeometry, platformMaterial);
                platform.position.set(
                    (Math.random() - 0.5) * (CONFIG.ENVIRONMENT.GROUND_SIZE - 10),
                    0.5,
                    (Math.random() - 0.5) * (CONFIG.ENVIRONMENT.GROUND_SIZE - 10)
                );
                platform.castShadow = true;
                platform.receiveShadow = true;
                gameState.scene.add(platform);
                gameState.platforms.push(platform);
            }
            
            // Obstacles (crystal formations)
            for (let i = 0; i < CONFIG.ENVIRONMENT.OBSTACLE_COUNT; i++) {
                const obstacleGeometry = new THREE.ConeGeometry(
                    Math.random() * 2 + 1,
                    Math.random() * 4 + 2,
                    6
                );
                const obstacleMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0x00cec9,
                    roughness: 0.3,
                    metalness: 0.6
                });
                const obstacle = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
                obstacle.position.set(
                    (Math.random() - 0.5) * (CONFIG.ENVIRONMENT.GROUND_SIZE - 15),
                    obstacle.geometry.parameters.height / 2,
                    (Math.random() - 0.5) * (CONFIG.ENVIRONMENT.GROUND_SIZE - 15)
                );
                obstacle.rotation.y = Math.random() * Math.PI * 2;
                obstacle.castShadow = true;
                gameState.scene.add(obstacle);
                gameState.obstacles.push(obstacle);
            }
        }

        function createPlayer() {
            // Player body (octahedron for crystal theme)
            const playerGeometry = new THREE.OctahedronGeometry(CONFIG.PLAYER.SIZE, 0);
            const playerMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x7bed9f,
                emissive: 0x2ed573,
                emissiveIntensity: 0.3,
                roughness: 0.2,
                metalness: 0.8
            });
            const player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.y = CONFIG.PLAYER.SIZE;
            player.castShadow = true;
            gameState.scene.add(player);
            gameState.player = player;
            
            // Update UI
            updateUI();
        }

        function setupEventListeners() {
            // Keyboard input
            document.addEventListener('keydown', (e) => {
                gameState.keys[e.code] = true;
                if (e.code === 'Space' && !gameState.isGameOver) {
                    e.preventDefault();
                }
            });
            
            document.addEventListener('keyup', (e) => {
                gameState.keys[e.code] = false;
            });
            
            // Mouse input
            document.addEventListener('mousemove', (e) => {
                gameState.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                gameState.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            
            document.addEventListener('mousedown', () => {
                gameState.mouse.down = true;
            });
            
            document.addEventListener('mouseup', () => {
                gameState.mouse.down = false;
            });
            
            // Window resize
            window.addEventListener('resize', () => {
                gameState.camera.aspect = window.innerWidth / window.innerHeight;
                gameState.camera.updateProjectionMatrix();
                gameState.renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // Restart button
            document.getElementById('restartButton').addEventListener('click', restartGame);
        }

        function updatePlayer(delta) {
            if (gameState.isGameOver || gameState.showingUpgrade) return;
            
            const speed = CONFIG.PLAYER.SPEED * delta;
            const direction = new THREE.Vector3();
            
            // Movement
            if (gameState.keys['KeyW'] || gameState.keys['ArrowUp']) direction.z -= speed;
            if (gameState.keys['KeyS'] || gameState.keys['ArrowDown']) direction.z += speed;
            if (gameState.keys['KeyA'] || gameState.keys['ArrowLeft']) direction.x -= speed;
            if (gameState.keys['KeyD'] || gameState.keys['ArrowRight']) direction.x += speed;
            
            if (direction.length() > 0) {
                direction.normalize().multiplyScalar(speed);
                gameState.player.position.add(direction);
                
                // Keep player within bounds
                const halfGround = CONFIG.ENVIRONMENT.GROUND_SIZE / 2 - 2;
                gameState.player.position.x = Math.max(-halfGround, Math.min(halfGround, gameState.player.position.x));
                gameState.player.position.z = Math.max(-halfGround, Math.min(halfGround, gameState.player.position.z));
            }
            
            // Auto-attack towards mouse direction
            const attackCooldown = CONFIG.PLAYER.ATTACK_COOLDOWN;
            if (gameState.clock.getElapsedTime() - gameState.lastAttackTime > attackCooldown) {
                performAttack();
                gameState.lastAttackTime = gameState.clock.getElapsedTime();
            }
            
            // Health regeneration
            gameState.regenTimer += delta;
            if (gameState.regenTimer >= 1) {
                if (gameState.player.health < gameState.player.maxHealth) {
                    gameState.player.health = Math.min(gameState.player.maxHealth, gameState.player.health + (gameState.player.regen || 0));
                    updateUI();
                }
                gameState.regenTimer = 0;
            }
        }

        function performAttack() {
            if (gameState.enemies.length === 0) return;
            
            // Find closest enemy within range
            let closestEnemy = null;
            let closestDistance = CONFIG.PLAYER.ATTACK_RANGE;
            
            for (const enemy of gameState.enemies) {
                const distance = gameState.player.position.distanceTo(enemy.position);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestEnemy = enemy;
                }
            }
            
            if (closestEnemy) {
                // Calculate damage with crit chance
                let damage = CONFIG.PLAYER.DAMAGE;
                if (Math.random() < (gameState.player.critChance || 0)) {
                    damage *= 2;
                    createDamageNumber(closestEnemy.position, damage, true);
                } else {
                    createDamageNumber(closestEnemy.position, damage, false);
                }
                
                closestEnemy.health -= damage;
                
                // Create hit particle effect
                createHitParticles(closestEnemy.position.clone());
                
                if (closestEnemy.health <= 0) {
                    destroyEnemy(closestEnemy);
                }
            }
        }

        function createEnemy(type, position) {
            const enemyConfig = CONFIG.ENEMIES[type];
            const geometry = type === 'BOSS' ? 
                new THREE.DodecahedronGeometry(enemyConfig.SIZE, 0) :
                new THREE.IcosahedronGeometry(enemyConfig.SIZE, 0);
            
            const colors = {
                BASE: 0xff6b6b,
                FAST: 0xffd700,
                TANK: 0xa55eea,
                BOSS: 0xff4757
            };
            
            const material = new THREE.MeshStandardMaterial({ 
                color: colors[type],
                emissive: colors[type],
                emissiveIntensity: type === 'BOSS' ? 0.5 : 0.2,
                roughness: 0.4,
                metalness: 0.6
            });
            
            const enemy = new THREE.Mesh(geometry, material);
            enemy.position.copy(position);
            enemy.position.y = enemyConfig.SIZE;
            enemy.castShadow = true;
            enemy.health = enemyConfig.HEALTH;
            enemy.maxHealth = enemyConfig.HEALTH;
            enemy.speed = enemyConfig.SPEED;
            enemy.damage = enemyConfig.DAMAGE;
            enemy.type = type;
            
            gameState.scene.add(enemy);
            gameState.enemies.push(enemy);
            gameState.totalEnemies++;
        }

        function updateEnemies(delta) {
            if (gameState.isGameOver || gameState.showingUpgrade) return;
            
            for (let i = gameState.enemies.length - 1; i >= 0; i--) {
                const enemy = gameState.enemies[i];
                
                // Move towards player
                const direction = new THREE.Vector3().subVectors(gameState.player.position, enemy.position);
                direction.y = 0; // Keep on ground plane
                direction.normalize().multiplyScalar(enemy.speed * delta);
                enemy.position.add(direction);
                
                // Check collision with player
                const distance = gameState.player.position.distanceTo(enemy.position);
                if (distance < CONFIG.PLAYER.SIZE + enemy.geometry.parameters.radius) {
                    takeDamage(enemy.damage);
                }
            }
        }

        function destroyEnemy(enemy) {
            // Remove from scene and array
            gameState.scene.remove(enemy);
            const index = gameState.enemies.indexOf(enemy);
            if (index > -1) {
                gameState.enemies.splice(index, 1);
            }
            
            // Add score
            const scoreValues = { BASE: 10, FAST: 15, TANK: 25, BOSS: 100 };
            gameState.score += scoreValues[enemy.type];
            gameState.enemiesKilled++;
            
            // Add XP
            const xpValues = { BASE: 5, FAST: 8, TANK: 12, BOSS: 50 };
            addXP(xpValues[enemy.type]);
            
            // Create death particles
            createDeathParticles(enemy.position.clone(), enemy.material.color.getHex());
            
            // Chance to drop pickup
            if (Math.random() < 0.3) {
                createPickup(enemy.position.clone());
            }
            
            // Check if wave is complete
            checkWaveComplete();
        }

        function takeDamage(amount) {
            if (!gameState.player || gameState.isGameOver) return;
            
            gameState.player.health -= amount;
            createDamageNumber(gameState.player.position, amount, false);
            createHitParticles(gameState.player.position.clone());
            
            // Screen shake effect
            shakeCamera();
            
            if (gameState.player.health <= 0) {
                gameState.player.health = 0;
                gameOver();
            }
            
            updateUI();
        }

        function addXP(amount) {
            gameState.xp += amount;
            updateUI();
            
            if (gameState.xp >= gameState.xpToNext) {
                levelUp();
            }
        }

        function levelUp() {
            gameState.level++;
            gameState.xp -= gameState.xpToNext;
            gameState.xpToNext = Math.floor(gameState.xpToNext * 1.5);
            updateUI();
            
            // Show upgrade menu
            showUpgradeMenu();
        }

        function showUpgradeMenu() {
            gameState.showingUpgrade = true;
            document.getElementById('upgradeMenu').classList.add('active');
            
            // Select 3 random upgrades
            const availableUpgrades = [...CONFIG.UPGRADES];
            const selectedUpgrades = [];
            for (let i = 0; i < 3 && availableUpgrades.length > 0; i++) {
                const randomIndex = Math.floor(Math.random() * availableUpgrades.length);
                selectedUpgrades.push(availableUpgrades[randomIndex]);
                availableUpgrades.splice(randomIndex, 1);
            }
            
            const upgradeOptions = document.getElementById('upgradeOptions');
            upgradeOptions.innerHTML = '';
            
            selectedUpgrades.forEach(upgrade => {
                const option = document.createElement('div');
                option.className = 'upgrade-option';
                option.innerHTML = `
                    <div class="upgrade-name">${upgrade.name}</div>
                    <div class="upgrade-desc">${upgrade.desc}</div>
                `;
                option.addEventListener('click', () => applyUpgrade(upgrade));
                upgradeOptions.appendChild(option);
            });
        }

        function applyUpgrade(upgrade) {
            switch (upgrade.type) {
                case 'health':
                    CONFIG.PLAYER.MAX_HEALTH += upgrade.value;
                    gameState.player.health = CONFIG.PLAYER.MAX_HEALTH;
                    break;
                case 'damage':
                    CONFIG.PLAYER.DAMAGE += upgrade.value;
                    break;
                case 'speed':
                    CONFIG.PLAYER.SPEED += upgrade.value;
                    break;
                case 'regen':
                    gameState.player.regen = (gameState.player.regen || 0) + upgrade.value;
                    break;
                case 'crit':
                    gameState.player.critChance = (gameState.player.critChance || 0) + upgrade.value;
                    break;
                case 'range':
                    CONFIG.PLAYER.ATTACK_RANGE += upgrade.value;
                    break;
            }
            
            gameState.showingUpgrade = false;
            document.getElementById('upgradeMenu').classList.remove('active');
            updateUI();
        }

        function createPickup(position) {
            const pickupGeometry = new THREE.SphereGeometry(0.5, 8, 8);
            const pickupMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffd700,
                emissive: 0xffd700,
                emissiveIntensity: 0.5,
                roughness: 0.1,
                metalness: 0.9
            });
            const pickup = new THREE.Mesh(pickupGeometry, pickupMaterial);
            pickup.position.copy(position);
            pickup.position.y = 0.5;
            pickup.castShadow = true;
            pickup.type = 'health'; // Could add other types later
            gameState.scene.add(pickup);
            gameState.pickups.push(pickup);
        }

        function updatePickups() {
            if (gameState.isGameOver || gameState.showingUpgrade) return;
            
            for (let i = gameState.pickups.length - 1; i >= 0; i--) {
                const pickup = gameState.pickups[i];
                const distance = gameState.player.position.distanceTo(pickup.position);
                
                if (distance < CONFIG.PLAYER.SIZE + 1) {
                    // Collect pickup
                    if (pickup.type === 'health') {
                        gameState.player.health = Math.min(CONFIG.PLAYER.MAX_HEALTH, gameState.player.health + 25);
                        updateUI();
                    }
                    
                    gameState.scene.remove(pickup);
                    gameState.pickups.splice(i, 1);
                }
            }
        }

        function createDamageNumber(position, amount, isCrit) {
            const damageElement = document.createElement('div');
            damageElement.className = 'damage-number';
            damageElement.textContent = amount;
            if (isCrit) {
                damageElement.style.color = '#ffd700';
                damageElement.style.fontSize = '24px';
                damageElement.style.fontWeight = 'bold';
            }
            
            // Convert 3D position to screen coordinates
            const vector = position.clone().project(gameState.camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
            
            damageElement.style.left = `${x}px`;
            damageElement.style.top = `${y}px`;
            document.getElementById('uiOverlay').appendChild(damageElement);
            
            // Remove after animation
            setTimeout(() => {
                if (damageElement.parentNode) {
                    damageElement.parentNode.removeChild(damageElement);
                }
            }, 1000);
        }

        function createHitParticles(position) {
            for (let i = 0; i < 8; i++) {
                createParticle(position, 0xff6b6b, 0.5, 1);
            }
        }

        function createDeathParticles(position, color) {
            const particleCount = color === 0xff4757 ? 30 : 15; // More particles for boss
            for (let i = 0; i < particleCount; i++) {
                createParticle(position, color, 1, 2);
            }
        }

        function createParticle(position, color, size, lifetime) {
            const geometry = new THREE.SphereGeometry(size * 0.2, 4, 4);
            const material = new THREE.MeshBasicMaterial({ color: color });
            const particle = new THREE.Mesh(geometry, material);
            particle.position.copy(position);
            particle.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    Math.random() * 3,
                    (Math.random() - 0.5) * 4
                ),
                lifetime: lifetime,
                age: 0
            };
            gameState.scene.add(particle);
            gameState.particles.push(particle);
        }

        function updateParticles(delta) {
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const particle = gameState.particles[i];
                particle.userData.age += delta;
                
                if (particle.userData.age >= particle.userData.lifetime) {
                    gameState.scene.remove(particle);
                    gameState.particles.splice(i, 1);
                    continue;
                }
                
                // Update position
                particle.position.add(particle.userData.velocity.clone().multiplyScalar(delta));
                particle.userData.velocity.y -= 9.8 * delta; // Gravity
                
                // Fade out
                const alpha = 1 - (particle.userData.age / particle.userData.lifetime);
                particle.material.opacity = alpha;
            }
        }

        function spawnWave() {
            const wave = gameState.wave;
            const baseCount = Math.min(5 + wave * 2, 20);
            const fastCount = Math.min(Math.floor(wave / 2), 8);
            const tankCount = Math.min(Math.floor(wave / 3), 5);
            
            // Spawn regular enemies
            for (let i = 0; i < baseCount; i++) {
                spawnEnemyAtRandomPosition('BASE');
            }
            for (let i = 0; i < fastCount; i++) {
                spawnEnemyAtRandomPosition('FAST');
            }
            for (let i = 0; i < tankCount; i++) {
                spawnEnemyAtRandomPosition('TANK');
            }
            
            // Boss every 5 waves
            if (wave % 5 === 0 && !gameState.bossSpawned) {
                spawnEnemyAtRandomPosition('BOSS');
                gameState.bossSpawned = true;
            }
            
            showWaveInfo(`Wave ${wave} Started!`);
        }

        function spawnEnemyAtRandomPosition(type) {
            const radius = CONFIG.ENEMIES[type].SPAWN_RADIUS;
            const angle = Math.random() * Math.PI * 2;
            const distance = radius * (0.7 + Math.random() * 0.3);
            const x = Math.cos(angle) * distance;
            const z = Math.sin(angle) * distance;
            createEnemy(type, new THREE.Vector3(x, 0, z));
        }

        function checkWaveComplete() {
            if (gameState.enemies.length === 0 && gameState.totalEnemies > 0) {
                gameState.wave++;
                gameState.totalEnemies = 0;
                gameState.bossSpawned = false;
                gameState.waveTimer = 0;
                spawnWave();
            }
        }

        function showWaveInfo(message) {
            const waveInfo = document.getElementById('waveInfo');
            waveInfo.textContent = message;
            waveInfo.style.opacity = '1';
            
            setTimeout(() => {
                waveInfo.style.opacity = '0';
            }, 3000);
        }

        function shakeCamera() {
            const originalPosition = gameState.camera.position.clone();
            const shakeAmount = 0.5;
            
            const shakeInterval = setInterval(() => {
                gameState.camera.position.x = originalPosition.x + (Math.random() - 0.5) * shakeAmount;
                gameState.camera.position.y = originalPosition.y + (Math.random() - 0.5) * shakeAmount;
                gameState.camera.position.z = originalPosition.z + (Math.random() - 0.5) * shakeAmount;
            }, 50);
            
            setTimeout(() => {
                clearInterval(shakeInterval);
                gameState.camera.position.copy(originalPosition);
            }, 200);
        }

        function gameOver() {
            gameState.isGameOver = true;
            document.getElementById('finalScore').textContent = `Final Score: ${gameState.score}`;
            document.getElementById('gameOver').classList.add('active');
        }

        function restartGame() {
            // Reset game state
            gameState.enemies.forEach(enemy => gameState.scene.remove(enemy));
            gameState.projectiles.forEach(projectile => gameState.scene.remove(projectile));
            gameState.particles.forEach(particle => gameState.scene.remove(particle));
            gameState.pickups.forEach(pickup => gameState.scene.remove(pickup));
            
            gameState.enemies = [];
            gameState.projectiles = [];
            gameState.particles = [];
            gameState.pickups = [];
            gameState.wave = 1;
            gameState.score = 0;
            gameState.level = 1;
            gameState.xp = 0;
            gameState.xpToNext = 100;
            gameState.isGameOver = false;
            gameState.showingUpgrade = false;
            gameState.lastAttackTime = 0;
            gameState.regenTimer = 0;
            gameState.waveTimer = 0;
            gameState.enemiesKilled = 0;
            gameState.totalEnemies = 0;
            gameState.bossSpawned = false;
            
            // Reset player
            gameState.player.health = CONFIG.PLAYER.HEALTH;
            gameState.player.maxHealth = CONFIG.PLAYER.MAX_HEALTH;
            gameState.player.position.set(0, CONFIG.PLAYER.SIZE, 0);
            gameState.player.regen = 0;
            gameState.player.critChance = 0;
            
            // Reset config
            CONFIG.PLAYER.DAMAGE = 25;
            CONFIG.PLAYER.SPEED = 8;
            CONFIG.PLAYER.MAX_HEALTH = 100;
            CONFIG.PLAYER.ATTACK_RANGE = 8;
            
            // Hide UI elements
            document.getElementById('gameOver').classList.remove('active');
            document.getElementById('upgradeMenu').classList.remove('active');
            
            // Spawn first wave
            spawnWave();
            
            updateUI();
        }

        function updateUI() {
            if (!gameState.player) return;
            
            // Health bar
            const healthPercent = (gameState.player.health / CONFIG.PLAYER.MAX_HEALTH) * 100;
            document.getElementById('healthFill').style.width = `${healthPercent}%`;
            
            // XP bar
            const xpPercent = (gameState.xp / gameState.xpToNext) * 100;
            document.getElementById('xpFill').style.width = `${xpPercent}%`;
            
            // Stats
            document.getElementById('waveCount').textContent = gameState.wave;
            document.getElementById('scoreValue').textContent = gameState.score;
            document.getElementById('levelValue').textContent = gameState.level;
        }

        function updateCamera() {
            if (gameState.isGameOver) return;
            
            // Smoothly follow player
            const targetPosition = new THREE.Vector3(
                gameState.player.position.x,
                15,
                gameState.player.position.z + 15
            );
            
            gameState.camera.position.lerp(targetPosition, 0.1);
            gameState.camera.lookAt(gameState.player.position.x, 0, gameState.player.position.z);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(gameState.clock.getDelta(), 0.1);
            
            if (!gameState.isGameOver && !gameState.showingUpgrade) {
                updatePlayer(delta);
                updateEnemies(delta);
                updatePickups();
                updateParticles(delta);
                updateCamera();
                
                // Wave timer
                gameState.waveTimer += delta;
                if (gameState.waveTimer >= gameState.waveDuration && gameState.enemies.length === 0 && gameState.totalEnemies === 0) {
                    gameState.wave++;
                    gameState.waveTimer = 0;
                    spawnWave();
                }
            }
            
            gameState.renderer.render(gameState.scene, gameState.camera);
        }

        // Initialize game when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
