<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shardfall: Emberline</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1d2a4a 0%, #070b16 55%, #020307 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #e6f0ff;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
    .hud-text {
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }
    .panel {
      background: linear-gradient(140deg, rgba(10, 14, 28, 0.9), rgba(18, 24, 46, 0.88));
      border: 1px solid rgba(140, 188, 255, 0.24);
      backdrop-filter: blur(8px);
    }
    .choice-btn {
      transition: transform 0.14s ease, border-color 0.2s ease, background-color 0.2s ease;
      border: 1px solid rgba(130, 170, 255, 0.28);
      background: rgba(70, 98, 168, 0.2);
    }
    .choice-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(182, 219, 255, 0.72);
      background: rgba(88, 130, 218, 0.28);
    }
    .flash {
      animation: flash-hit 0.22s ease;
    }
    @keyframes flash-hit {
      0% { box-shadow: inset 0 0 0 0 rgba(255, 50, 50, 0.36); }
      100% { box-shadow: inset 0 0 0 30px rgba(255, 50, 50, 0.0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud" class="absolute top-0 left-0 right-0 p-4 pointer-events-none">
      <div class="flex justify-between items-start gap-4">
        <div class="hud-text">
          <div class="text-2xl font-black tracking-wide">SHARDFALL: EMBERLINE</div>
          <div class="text-sm text-blue-200/90">Move: WASD / Arrows | Survive, level up, and break the horde</div>
        </div>
        <div class="text-right hud-text">
          <div id="timeLabel" class="text-sm text-blue-100/90">00:00</div>
          <div id="scoreLabel" class="text-xl font-bold">Score 0</div>
          <div id="waveLabel" class="text-sm text-violet-200/90">Wave 1</div>
        </div>
      </div>
      <div class="mt-3 max-w-md">
        <div class="text-xs mb-1 text-blue-100/85">Integrity</div>
        <div class="h-4 bg-black/45 rounded overflow-hidden border border-white/15">
          <div id="hpBar" class="h-full bg-gradient-to-r from-rose-500 to-orange-400" style="width:100%"></div>
        </div>
      </div>
      <div class="mt-2 max-w-md">
        <div class="text-xs mb-1 text-blue-100/85">Level <span id="levelLabel">1</span></div>
        <div class="h-3 bg-black/45 rounded overflow-hidden border border-white/15">
          <div id="xpBar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500" style="width:0%"></div>
        </div>
      </div>
      <div id="weaponsLabel" class="mt-3 text-xs text-blue-100/90 hud-text"></div>
    </div>

    <div id="damageLayer" class="absolute inset-0 pointer-events-none"></div>

    <div id="upgradePanel" class="absolute inset-0 hidden items-center justify-center p-6">
      <div class="panel rounded-2xl w-full max-w-2xl p-5">
        <div class="text-2xl font-black mb-1">Signal Upgrade</div>
        <div class="text-sm text-blue-100/90 mb-4">Choose one adaptation</div>
        <div id="upgradeChoices" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
      </div>
    </div>

    <div id="gameOver" class="absolute inset-0 hidden items-center justify-center p-6">
      <div class="panel rounded-2xl w-full max-w-lg p-6 text-center">
        <div class="text-4xl font-black mb-2">SYSTEM COLLAPSE</div>
        <div id="gameOverStats" class="text-blue-100/90 mb-6"></div>
        <button id="restartBtn" class="px-5 py-3 rounded-lg choice-btn font-semibold pointer-events-auto">Reboot Run</button>
      </div>
    </div>
  </div>

  <script>
    const app = document.getElementById('app');
    const hpBar = document.getElementById('hpBar');
    const xpBar = document.getElementById('xpBar');
    const levelLabel = document.getElementById('levelLabel');
    const scoreLabel = document.getElementById('scoreLabel');
    const waveLabel = document.getElementById('waveLabel');
    const timeLabel = document.getElementById('timeLabel');
    const weaponsLabel = document.getElementById('weaponsLabel');
    const upgradePanel = document.getElementById('upgradePanel');
    const upgradeChoices = document.getElementById('upgradeChoices');
    const gameOverPanel = document.getElementById('gameOver');
    const gameOverStats = document.getElementById('gameOverStats');
    const restartBtn = document.getElementById('restartBtn');
    const damageLayer = document.getElementById('damageLayer');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1022, 0.018);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 600);
    camera.position.set(0, 26, 23);

    const hemi = new THREE.HemisphereLight(0x86a8ff, 0x1e130c, 0.68);
    scene.add(hemi);

    const moon = new THREE.DirectionalLight(0xd6e6ff, 1.2);
    moon.position.set(-16, 26, 10);
    moon.castShadow = true;
    moon.shadow.mapSize.set(2048, 2048);
    moon.shadow.camera.near = 1;
    moon.shadow.camera.far = 140;
    moon.shadow.camera.left = -60;
    moon.shadow.camera.right = 60;
    moon.shadow.camera.top = 60;
    moon.shadow.camera.bottom = -60;
    scene.add(moon);

    const rim = new THREE.PointLight(0x4dd2ff, 0.9, 85, 2);
    rim.position.set(0, 12, -18);
    scene.add(rim);

    const arenaRadius = 82;
    const tempVec = new THREE.Vector3();

    function hashNoise(x, z) {
      return (Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1;
    }

    const terrainGeo = new THREE.PlaneGeometry(230, 230, 120, 120);
    terrainGeo.rotateX(-Math.PI / 2);
    const colors = [];
    for (let i = 0; i < terrainGeo.attributes.position.count; i++) {
      const x = terrainGeo.attributes.position.getX(i);
      const z = terrainGeo.attributes.position.getZ(i);
      const d = Math.sqrt(x * x + z * z) / arenaRadius;
      const ripple = Math.sin(x * 0.1) * Math.cos(z * 0.09) * 1.3;
      const n = hashNoise(x * 0.4, z * 0.4) * 1.4;
      const y = ripple + n - Math.max(0, d - 0.75) * 9;
      terrainGeo.attributes.position.setY(i, y);
      const t = Math.max(0, Math.min(1, (y + 2.8) / 6));
      colors.push(0.05 + t * 0.14, 0.16 + t * 0.3, 0.24 + t * 0.34);
    }
    terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    terrainGeo.computeVertexNormals();

    const terrain = new THREE.Mesh(
      terrainGeo,
      new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.94,
        metalness: 0.02
      })
    );
    terrain.receiveShadow = true;
    scene.add(terrain);

    const ringGeo = new THREE.TorusGeometry(arenaRadius, 0.45, 10, 160);
    ringGeo.rotateX(Math.PI / 2);
    const ring = new THREE.Mesh(
      ringGeo,
      new THREE.MeshStandardMaterial({
        color: 0x5dd0ff,
        emissive: 0x2765a4,
        emissiveIntensity: 0.85,
        transparent: true,
        opacity: 0.8
      })
    );
    ring.position.y = 0.16;
    scene.add(ring);

    const rockMats = [
      new THREE.MeshStandardMaterial({ color: 0x2c3552, roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: 0x284861, roughness: 0.9 }),
      new THREE.MeshStandardMaterial({ color: 0x3b3352, roughness: 0.88 })
    ];
    const crystalMat = new THREE.MeshStandardMaterial({
      color: 0x8bc7ff,
      emissive: 0x245f93,
      emissiveIntensity: 1.0,
      roughness: 0.2,
      metalness: 0.38
    });

    for (let i = 0; i < 260; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = 9 + Math.random() * (arenaRadius - 8);
      const x = Math.cos(ang) * rad;
      const z = Math.sin(ang) * rad;
      if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;

      if (Math.random() < 0.72) {
        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.6 + Math.random() * 1.4, 0),
          rockMats[(Math.random() * rockMats.length) | 0]
        );
        rock.position.set(x, -0.1 + Math.random() * 0.8, z);
        rock.rotation.set(Math.random(), Math.random(), Math.random());
        rock.castShadow = true;
        rock.receiveShadow = true;
        scene.add(rock);
      } else {
        const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.5 + Math.random() * 1.2, 0), crystalMat);
        crystal.position.set(x, 0.4 + Math.random() * 1.4, z);
        crystal.rotation.y = Math.random() * Math.PI;
        crystal.castShadow = true;
        scene.add(crystal);
      }
    }

    const hero = {
      group: new THREE.Group(),
      velocity: new THREE.Vector3(),
      hp: 140,
      maxHp: 140,
      level: 1,
      xp: 0,
      nextXp: 42,
      speed: 13,
      magnet: 7,
      invuln: 0,
      blasterDamage: 18,
      blasterRate: 0.34,
      blasterTimer: 0.1,
      blasterRange: 35,
      projSpeed: 44,
      projPierce: 0,
      orbitCount: 0,
      orbitDamage: 11,
      orbitRadius: 3.2,
      novaUnlocked: false,
      novaDamage: 28,
      novaRadius: 8,
      novaRate: 8,
      novaTimer: 4
    };

    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0xeef8ff,
      roughness: 0.3,
      metalness: 0.18
    });
    const coreMat = new THREE.MeshStandardMaterial({
      color: 0x88f1ff,
      emissive: 0x46b7ff,
      emissiveIntensity: 1.8,
      roughness: 0.2
    });
    const suitMat = new THREE.MeshStandardMaterial({ color: 0x465d93, roughness: 0.6, metalness: 0.25 });

    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.62, 1.15, 5, 10), bodyMat);
    torso.castShadow = true;
    torso.position.y = 1.3;
    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.46, 18, 18), suitMat);
    helmet.position.set(0, 2.3, 0.05);
    helmet.castShadow = true;
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.26, 0), coreMat);
    core.position.set(0, 1.5, 0.58);
    const shoulderL = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.2, 0.34), suitMat);
    shoulderL.position.set(-0.62, 1.6, 0.03);
    const shoulderR = shoulderL.clone();
    shoulderR.position.x = 0.62;

    hero.group.add(torso, helmet, core, shoulderL, shoulderR);
    hero.group.position.set(0, 0.1, 0);
    scene.add(hero.group);

    const heroGlow = new THREE.PointLight(0x58daff, 1.8, 18, 2.1);
    heroGlow.position.set(0, 2, 0.3);
    hero.group.add(heroGlow);

    const clock = new THREE.Clock();
    const keys = {};
    const enemies = [];
    const projectiles = [];
    const pickups = [];
    const particles = [];
    const damageTexts = [];
    const orbiters = [];

    const state = {
      time: 0,
      spawnBudget: 0,
      kills: 0,
      score: 0,
      wave: 1,
      paused: false,
      over: false,
      bossAlive: false
    };

    const audio = {
      ctx: null,
      ready: false
    };

    function ensureAudio() {
      if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.ctx.state === 'suspended') audio.ctx.resume();
      audio.ready = true;
    }

    function beep(type, freq, dur, gain, glide = 0) {
      if (!audio.ready || !audio.ctx) return;
      const t = audio.ctx.currentTime;
      const osc = audio.ctx.createOscillator();
      const g = audio.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (glide !== 0) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + glide), t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(audio.ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    function makeEnemy(type, x, z) {
      let mesh;
      const enemy = {
        type,
        mesh: null,
        hp: 30,
        maxHp: 30,
        speed: 4.8,
        radius: 0.75,
        dmg: 9,
        xp: 8,
        touchCd: 0,
        pulse: Math.random() * Math.PI * 2
      };

      if (type === 'skitter') {
        const g = new THREE.Group();
        const shell = new THREE.Mesh(
          new THREE.ConeGeometry(0.66, 1.2, 7),
          new THREE.MeshStandardMaterial({ color: 0xff7062, roughness: 0.65, metalness: 0.08 })
        );
        shell.rotation.x = Math.PI;
        shell.position.y = 0.75;
        const eye = new THREE.Mesh(
          new THREE.SphereGeometry(0.14, 8, 8),
          new THREE.MeshStandardMaterial({ color: 0xfff4ba, emissive: 0xffb636, emissiveIntensity: 1.2 })
        );
        eye.position.set(0, 0.62, 0.2);
        g.add(shell, eye);
        mesh = g;
        enemy.hp = enemy.maxHp = 34;
        enemy.speed = 6.3;
        enemy.radius = 0.7;
        enemy.dmg = 10;
        enemy.xp = 9;
      } else if (type === 'brute') {
        const g = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(1.7, 1.4, 1.55),
          new THREE.MeshStandardMaterial({ color: 0x7b6dff, roughness: 0.5, metalness: 0.2 })
        );
        body.position.y = 0.85;
        const horn = new THREE.Mesh(
          new THREE.ConeGeometry(0.22, 0.8, 6),
          new THREE.MeshStandardMaterial({ color: 0xc7beff, roughness: 0.4 })
        );
        horn.position.set(-0.4, 1.7, 0.3);
        horn.rotation.z = 0.35;
        const horn2 = horn.clone();
        horn2.position.x = 0.4;
        horn2.rotation.z = -0.35;
        g.add(body, horn, horn2);
        mesh = g;
        enemy.hp = enemy.maxHp = 92;
        enemy.speed = 3.9;
        enemy.radius = 1.0;
        enemy.dmg = 16;
        enemy.xp = 20;
      } else {
        const g = new THREE.Group();
        const coreBoss = new THREE.Mesh(
          new THREE.IcosahedronGeometry(2.2, 1),
          new THREE.MeshStandardMaterial({ color: 0xff4f96, emissive: 0xaa2155, emissiveIntensity: 0.88, roughness: 0.46 })
        );
        coreBoss.position.y = 2.2;
        const halo = new THREE.Mesh(
          new THREE.TorusGeometry(3, 0.18, 12, 64),
          new THREE.MeshStandardMaterial({ color: 0xff9acd, emissive: 0xa33f7f, emissiveIntensity: 1.1 })
        );
        halo.rotation.x = Math.PI / 2;
        halo.position.y = 1.6;
        g.add(coreBoss, halo);
        mesh = g;
        enemy.hp = enemy.maxHp = 1200;
        enemy.speed = 2.7;
        enemy.radius = 2.4;
        enemy.dmg = 26;
        enemy.xp = 230;
      }

      mesh.position.set(x, 0.1, z);
      mesh.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });
      enemy.mesh = mesh;
      scene.add(mesh);
      enemies.push(enemy);
      return enemy;
    }

    function spawnEnemy() {
      const t = state.time;
      const wave = 1 + Math.floor(t / 34);
      state.wave = wave;
      const angle = Math.random() * Math.PI * 2;
      const radius = arenaRadius - 2 + Math.random() * 4;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      let type = 'skitter';
      const r = Math.random();
      if (wave > 2 && r < 0.34) type = 'brute';
      if (!state.bossAlive && t > 65 && Math.floor(t / 55) > 0 && Math.random() < 0.0042) {
        type = 'boss';
        state.bossAlive = true;
      }
      makeEnemy(type, x, z);
    }

    function spawnProjectile(origin, dir, speed, damage, color, radius = 0.2, pierce = 0) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 10, 10),
        new THREE.MeshStandardMaterial({
          color,
          emissive: color,
          emissiveIntensity: 1.3,
          roughness: 0.2,
          metalness: 0.25
        })
      );
      mesh.position.copy(origin);
      scene.add(mesh);
      projectiles.push({
        mesh,
        vel: dir.clone().multiplyScalar(speed),
        damage,
        life: 1.4,
        pierce,
        hit: new Set(),
        radius
      });
      beep('triangle', 380 + Math.random() * 50, 0.06, 0.035, 120);
    }

    function spawnPickup(x, z, amount) {
      const mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.3, 0),
        new THREE.MeshStandardMaterial({
          color: 0x67d4ff,
          emissive: 0x2f89cc,
          emissiveIntensity: 1.4,
          roughness: 0.28,
          metalness: 0.25
        })
      );
      mesh.position.set(x, 0.65, z);
      mesh.castShadow = true;
      scene.add(mesh);
      pickups.push({ mesh, amount, spin: Math.random() * 2 + 1.2, bob: Math.random() * Math.PI * 2 });
    }

    function spawnBurst(position, color, count, spread, speed) {
      for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.09 + Math.random() * 0.08, 6, 6),
          new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.2 })
        );
        mesh.position.copy(position);
        scene.add(mesh);
        const v = new THREE.Vector3((Math.random() - 0.5) * spread, Math.random() * 0.8 + 0.2, (Math.random() - 0.5) * spread)
          .normalize()
          .multiplyScalar(speed * (0.5 + Math.random()));
        particles.push({ mesh, vel: v, life: 0.45 + Math.random() * 0.45 });
      }
    }

    function spawnDamageText(pos, value, color = '#e9f7ff', scale = 1) {
      const el = document.createElement('div');
      el.className = 'absolute font-bold hud-text';
      el.style.color = color;
      el.style.fontSize = `${Math.round(13 * scale)}px`;
      el.textContent = value;
      damageLayer.appendChild(el);
      damageTexts.push({ el, pos: pos.clone(), age: 0, life: 0.62 + Math.random() * 0.2, drift: (Math.random() - 0.5) * 0.6 });
    }

    function hitEnemy(enemy, dmg, knock = 0.7) {
      enemy.hp -= dmg;
      spawnDamageText(enemy.mesh.position, Math.round(dmg), '#fff0bf', enemy.type === 'boss' ? 1.3 : 1);
      spawnBurst(enemy.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)), enemy.type === 'boss' ? 0xff6ab1 : 0xff9f77, 6, 1.7, 5);
      enemy.mesh.position.add(tempVec.set(
        enemy.mesh.position.x - hero.group.position.x,
        0,
        enemy.mesh.position.z - hero.group.position.z
      ).normalize().multiplyScalar(knock));
      beep('square', enemy.type === 'boss' ? 150 : 180 + Math.random() * 30, 0.05, enemy.type === 'boss' ? 0.06 : 0.04, -40);

      if (enemy.hp <= 0) {
        if (enemy.type === 'boss') {
          state.bossAlive = false;
          state.score += 850;
          spawnBurst(enemy.mesh.position, 0xff8dc8, 48, 4, 13);
          beep('sawtooth', 110, 0.28, 0.12, 250);
        } else {
          state.score += enemy.type === 'brute' ? 65 : 24;
          spawnBurst(enemy.mesh.position, 0x7dc7ff, 12, 2.6, 8);
        }
        state.kills += 1;
        if (Math.random() < 0.96 || enemy.type !== 'skitter') spawnPickup(enemy.mesh.position.x, enemy.mesh.position.z, enemy.xp);
        scene.remove(enemy.mesh);
        enemy.mesh.traverse(n => {
          if (n.geometry) n.geometry.dispose();
          if (n.material) n.material.dispose();
        });
        return true;
      }
      return false;
    }

    function worldToScreen(v) {
      const p = v.clone().project(camera);
      return {
        x: (p.x * 0.5 + 0.5) * window.innerWidth,
        y: (-p.y * 0.5 + 0.5) * window.innerHeight,
        visible: p.z < 1
      };
    }

    function getNearestEnemy(range) {
      let best = null;
      let bestD = range * range;
      for (const e of enemies) {
        const dx = e.mesh.position.x - hero.group.position.x;
        const dz = e.mesh.position.z - hero.group.position.z;
        const d2 = dx * dx + dz * dz;
        if (d2 < bestD) {
          bestD = d2;
          best = e;
        }
      }
      return best;
    }

    function addOrbiter() {
      const orb = new THREE.Mesh(
        new THREE.TorusKnotGeometry(0.26, 0.1, 40, 8),
        new THREE.MeshStandardMaterial({ color: 0x7ffdff, emissive: 0x27b6d1, emissiveIntensity: 1.6, roughness: 0.25 })
      );
      orb.castShadow = true;
      scene.add(orb);
      orbiters.push({ mesh: orb, angle: Math.random() * Math.PI * 2, cooldown: 0 });
      hero.orbitCount = orbiters.length;
      beep('triangle', 540, 0.12, 0.08, -120);
    }

    const upgradePool = [
      {
        id: 'hp',
        name: 'Reinforced Shell',
        desc: '+28 max integrity, heal 28',
        apply: () => {
          hero.maxHp += 28;
          hero.hp = Math.min(hero.maxHp, hero.hp + 28);
        }
      },
      {
        id: 'speed',
        name: 'Thruster Weave',
        desc: '+14% movement speed',
        apply: () => { hero.speed *= 1.14; }
      },
      {
        id: 'blasterDmg',
        name: 'Condensed Arc',
        desc: '+30% Arc Blaster damage',
        apply: () => { hero.blasterDamage *= 1.3; }
      },
      {
        id: 'blasterRate',
        name: 'Rapid Cycler',
        desc: 'Arc Blaster fires 18% faster',
        apply: () => { hero.blasterRate *= 0.82; }
      },
      {
        id: 'pierce',
        name: 'Phase Tip',
        desc: '+1 projectile pierce',
        apply: () => { hero.projPierce += 1; }
      },
      {
        id: 'orbitUnlock',
        name: 'Prism Orbit',
        desc: 'Summon an orbit blade',
        available: () => orbiters.length === 0,
        apply: () => addOrbiter()
      },
      {
        id: 'orbitPlus',
        name: 'Orbit Multiplex',
        desc: '+1 orbit blade',
        available: () => orbiters.length > 0 && orbiters.length < 5,
        apply: () => addOrbiter()
      },
      {
        id: 'orbitDmg',
        name: 'Orbit Resonance',
        desc: '+45% orbit damage',
        available: () => orbiters.length > 0,
        apply: () => { hero.orbitDamage *= 1.45; }
      },
      {
        id: 'novaUnlock',
        name: 'Pulse Nova',
        desc: 'Unlock periodic shockwave',
        available: () => !hero.novaUnlocked,
        apply: () => { hero.novaUnlocked = true; hero.novaTimer = 1.2; }
      },
      {
        id: 'novaBoost',
        name: 'Nova Overcharge',
        desc: '+40% Nova damage and radius',
        available: () => hero.novaUnlocked,
        apply: () => { hero.novaDamage *= 1.4; hero.novaRadius *= 1.16; }
      },
      {
        id: 'magnet',
        name: 'Vacuum Lattice',
        desc: '+45% pickup magnet range',
        apply: () => { hero.magnet *= 1.45; }
      }
    ];

    function showUpgrade() {
      state.paused = true;
      upgradePanel.classList.remove('hidden');
      upgradePanel.classList.add('flex');
      upgradeChoices.innerHTML = '';

      const options = upgradePool.filter(u => !u.available || u.available());
      options.sort(() => Math.random() - 0.5);
      const picks = options.slice(0, 3);

      for (const pick of picks) {
        const btn = document.createElement('button');
        btn.className = 'choice-btn rounded-xl p-4 text-left pointer-events-auto';
        btn.innerHTML = `<div class="font-bold text-lg">${pick.name}</div><div class="text-sm text-blue-100/90 mt-1">${pick.desc}</div>`;
        btn.onclick = () => {
          pick.apply();
          state.paused = false;
          upgradePanel.classList.add('hidden');
          upgradePanel.classList.remove('flex');
          beep('triangle', 700, 0.14, 0.08, -180);
        };
        upgradeChoices.appendChild(btn);
      }
    }

    function gainXp(amount) {
      hero.xp += amount;
      while (hero.xp >= hero.nextXp) {
        hero.xp -= hero.nextXp;
        hero.level += 1;
        hero.nextXp = Math.round(hero.nextXp * 1.35 + 8);
        state.score += 90;
        beep('sine', 350, 0.12, 0.07, 300);
        showUpgrade();
      }
    }

    function heroDamage(amount) {
      if (hero.invuln > 0 || state.over) return;
      hero.hp -= amount;
      hero.invuln = 0.18;
      app.classList.remove('flash');
      void app.offsetWidth;
      app.classList.add('flash');
      spawnDamageText(hero.group.position.clone().add(new THREE.Vector3(0, 2.6, 0)), amount, '#ffaeae', 1.1);
      beep('sawtooth', 120, 0.08, 0.07, -30);
      if (hero.hp <= 0) {
        hero.hp = 0;
        state.over = true;
        state.paused = true;
        gameOverStats.textContent = `Survived ${timeLabel.textContent} | Kills ${state.kills} | Score ${Math.floor(state.score)} | Level ${hero.level}`;
        gameOverPanel.classList.remove('hidden');
        gameOverPanel.classList.add('flex');
        beep('triangle', 90, 0.35, 0.1, -30);
      }
    }

    function updateHUD() {
      hpBar.style.width = `${Math.max(0, (hero.hp / hero.maxHp) * 100)}%`;
      xpBar.style.width = `${Math.max(0, (hero.xp / hero.nextXp) * 100)}%`;
      levelLabel.textContent = hero.level;
      scoreLabel.textContent = `Score ${Math.floor(state.score)}`;
      waveLabel.textContent = state.bossAlive ? `Wave ${state.wave} - Apex Threat` : `Wave ${state.wave}`;
      const mins = Math.floor(state.time / 60);
      const secs = Math.floor(state.time % 60);
      timeLabel.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const weaponLines = [
        `Arc Blaster: ${Math.round(hero.blasterDamage)} dmg @ ${(1 / hero.blasterRate).toFixed(1)}/s${hero.projPierce ? ` | Pierce ${hero.projPierce}` : ''}`,
        orbiters.length ? `Prism Orbit: ${orbiters.length} blades, ${Math.round(hero.orbitDamage)} dmg` : null,
        hero.novaUnlocked ? `Pulse Nova: ${Math.round(hero.novaDamage)} dmg / ${hero.novaRate.toFixed(1)}s` : null
      ].filter(Boolean);
      weaponsLabel.innerHTML = weaponLines.map(t => `<div>${t}</div>`).join('');
    }

    function updateHero(dt) {
      const input = new THREE.Vector3(
        (keys['ArrowRight'] || keys['KeyD'] ? 1 : 0) - (keys['ArrowLeft'] || keys['KeyA'] ? 1 : 0),
        0,
        (keys['ArrowDown'] || keys['KeyS'] ? 1 : 0) - (keys['ArrowUp'] || keys['KeyW'] ? 1 : 0)
      );

      if (input.lengthSq() > 0) {
        input.normalize().multiplyScalar(hero.speed);
      }
      const blend = Math.min(1, dt * 11);
      hero.velocity.lerp(input, blend);
      hero.group.position.addScaledVector(hero.velocity, dt);

      const d = Math.hypot(hero.group.position.x, hero.group.position.z);
      if (d > arenaRadius - 2) {
        hero.group.position.x *= (arenaRadius - 2) / d;
        hero.group.position.z *= (arenaRadius - 2) / d;
      }

      if (hero.velocity.lengthSq() > 0.4) {
        const angle = Math.atan2(hero.velocity.x, hero.velocity.z);
        hero.group.rotation.y = THREE.MathUtils.lerp(hero.group.rotation.y, angle, dt * 10);
      }
      const bob = Math.sin(state.time * 8) * 0.06;
      torso.position.y = 1.3 + bob;
      core.rotation.y += dt * 2.7;
      core.scale.setScalar(1 + Math.sin(state.time * 6) * 0.08);
      heroGlow.intensity = 1.5 + Math.sin(state.time * 7) * 0.3;

      hero.invuln = Math.max(0, hero.invuln - dt);
      const targetCam = new THREE.Vector3(hero.group.position.x + 0.1, hero.group.position.y + 17, hero.group.position.z + 17);
      camera.position.lerp(targetCam, Math.min(1, dt * 3.4));
      camera.lookAt(hero.group.position.x, 1.1, hero.group.position.z);
    }

    function updateCombat(dt) {
      hero.blasterTimer -= dt;
      if (hero.blasterTimer <= 0) {
        const target = getNearestEnemy(hero.blasterRange);
        if (target) {
          const start = hero.group.position.clone().add(new THREE.Vector3(0, 1.5, 0));
          const dir = target.mesh.position.clone().add(new THREE.Vector3(0, 0.9, 0)).sub(start).normalize();
          spawnProjectile(start, dir, hero.projSpeed, hero.blasterDamage, 0x8bf6ff, 0.22, hero.projPierce);
          hero.blasterTimer = hero.blasterRate;
        } else {
          hero.blasterTimer = 0.06;
        }
      }

      for (let i = 0; i < orbiters.length; i++) {
        const orb = orbiters[i];
        orb.angle += dt * (2.2 + i * 0.18);
        const a = orb.angle + (i / Math.max(1, orbiters.length)) * Math.PI * 2;
        orb.mesh.position.set(
          hero.group.position.x + Math.cos(a) * hero.orbitRadius,
          1.5 + Math.sin(state.time * 4 + i) * 0.2,
          hero.group.position.z + Math.sin(a) * hero.orbitRadius
        );
        orb.mesh.rotation.x += dt * 2;
        orb.mesh.rotation.y += dt * 3;
        orb.cooldown = Math.max(0, orb.cooldown - dt);
      }

      if (hero.novaUnlocked) {
        hero.novaTimer -= dt;
        if (hero.novaTimer <= 0) {
          hero.novaTimer = hero.novaRate;
          const pulse = new THREE.Mesh(
            new THREE.RingGeometry(0.8, 1.4, 48),
            new THREE.MeshBasicMaterial({ color: 0xa8f7ff, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
          );
          pulse.rotation.x = -Math.PI / 2;
          pulse.position.set(hero.group.position.x, 0.2, hero.group.position.z);
          scene.add(pulse);
          particles.push({ mesh: pulse, ring: true, growth: hero.novaRadius * 1.9, life: 0.45 });

          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            const dist = e.mesh.position.distanceTo(hero.group.position);
            if (dist < hero.novaRadius + e.radius) {
              if (hitEnemy(e, hero.novaDamage, 2.2)) enemies.splice(i, 1);
            }
          }
          spawnBurst(hero.group.position.clone().add(new THREE.Vector3(0, 0.8, 0)), 0x89eaff, 18, 2.8, 10);
          beep('triangle', 220, 0.18, 0.09, 170);
        }
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const toHero = hero.group.position.clone().sub(e.mesh.position);
        const dist = toHero.length();
        toHero.normalize();

        e.mesh.position.addScaledVector(toHero, e.speed * dt);
        e.mesh.lookAt(hero.group.position.x, e.mesh.position.y + 0.4, hero.group.position.z);
        e.mesh.position.y = 0.08 + Math.sin(state.time * 4 + e.pulse) * 0.06;

        e.touchCd = Math.max(0, e.touchCd - dt);
        if (dist < e.radius + 0.9 && e.touchCd <= 0) {
          heroDamage(e.dmg);
          e.touchCd = e.type === 'boss' ? 0.42 : 0.7;
        }

        for (const orb of orbiters) {
          if (orb.cooldown > 0) continue;
          if (orb.mesh.position.distanceTo(e.mesh.position) < e.radius + 0.7) {
            if (hitEnemy(e, hero.orbitDamage, 1.2)) {
              enemies.splice(i, 1);
              break;
            }
            orb.cooldown = 0.08;
          }
        }
      }
    }

    function updateProjectiles(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.life -= dt;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          p.mesh.geometry.dispose();
          p.mesh.material.dispose();
          projectiles.splice(i, 1);
          continue;
        }
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mesh.material.emissiveIntensity = 1 + Math.sin(state.time * 22 + i) * 0.25;

        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (p.hit.has(e)) continue;
          if (p.mesh.position.distanceTo(e.mesh.position) < e.radius + p.radius + 0.2) {
            p.hit.add(e);
            const dead = hitEnemy(e, p.damage, 0.8);
            if (dead) enemies.splice(j, 1);
            if (p.hit.size > p.pierce) {
              p.life = 0;
              break;
            }
          }
        }
      }
    }

    function updatePickups(dt) {
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.bob += dt * 5;
        p.mesh.rotation.y += dt * p.spin;
        p.mesh.position.y = 0.6 + Math.sin(p.bob) * 0.16;

        const d = p.mesh.position.distanceTo(hero.group.position);
        if (d < hero.magnet) {
          const pull = hero.group.position.clone().sub(p.mesh.position).normalize().multiplyScalar((hero.magnet - d + 1.1) * dt * 9.5);
          p.mesh.position.add(pull);
        }
        if (d < 1.2) {
          gainXp(p.amount);
          state.score += p.amount * 1.6;
          beep('sine', 700 + Math.random() * 80, 0.055, 0.04, 100);
          scene.remove(p.mesh);
          p.mesh.geometry.dispose();
          p.mesh.material.dispose();
          pickups.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          if (p.mesh.geometry) p.mesh.geometry.dispose();
          if (p.mesh.material) p.mesh.material.dispose();
          particles.splice(i, 1);
          continue;
        }

        if (p.ring) {
          const t = 1 - p.life / 0.45;
          p.mesh.scale.setScalar(1 + t * p.growth);
          p.mesh.material.opacity = 0.8 * (1 - t);
        } else {
          p.vel.y -= 10 * dt;
          p.mesh.position.addScaledVector(p.vel, dt);
          p.mesh.scale.multiplyScalar(0.985);
          p.mesh.material.emissiveIntensity = Math.max(0, p.life * 2.1);
        }
      }
    }

    function updateDamageTexts(dt) {
      for (let i = damageTexts.length - 1; i >= 0; i--) {
        const d = damageTexts[i];
        d.age += dt;
        if (d.age > d.life) {
          d.el.remove();
          damageTexts.splice(i, 1);
          continue;
        }
        d.pos.y += dt * 2.3;
        d.pos.x += d.drift * dt;
        const s = worldToScreen(d.pos);
        if (!s.visible) {
          d.el.style.display = 'none';
          continue;
        }
        d.el.style.display = 'block';
        d.el.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -50%)`;
        d.el.style.opacity = `${1 - d.age / d.life}`;
      }
    }

    function cleanupTransientArrays() {
      while (damageTexts.length) {
        damageTexts.pop().el.remove();
      }
      for (const arr of [enemies, projectiles, pickups, particles, orbiters]) {
        while (arr.length) {
          const o = arr.pop();
          if (o.mesh) {
            scene.remove(o.mesh);
            if (o.mesh.geometry) o.mesh.geometry.dispose();
            if (o.mesh.material) o.mesh.material.dispose();
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.033, clock.getDelta());

      if (!state.paused) {
        state.time += dt;
        state.score += dt * (2 + state.wave * 0.65);

        updateHero(dt);
        updateCombat(dt);
        updateEnemies(dt);
        updateProjectiles(dt);
        updatePickups(dt);
        updateParticles(dt);
        updateDamageTexts(dt);

        state.spawnBudget += dt * (1.8 + state.wave * 0.72 + Math.min(3.8, state.time * 0.018));
        const cap = 46 + state.wave * 14 + (state.bossAlive ? 8 : 0);
        while (state.spawnBudget >= 1 && enemies.length < cap) {
          state.spawnBudget -= 1;
          spawnEnemy();
        }
      } else {
        updateDamageTexts(dt);
      }

      ring.material.emissiveIntensity = 0.65 + Math.sin(state.time * 2.1) * 0.28;
      ring.rotation.z += dt * 0.05;
      updateHUD();
      renderer.render(scene, camera);
    }

    function restartGame() {
      cleanupTransientArrays();
      hero.group.position.set(0, 0.1, 0);
      hero.velocity.set(0, 0, 0);
      hero.hp = hero.maxHp = 140;
      hero.level = 1;
      hero.xp = 0;
      hero.nextXp = 42;
      hero.speed = 13;
      hero.magnet = 7;
      hero.invuln = 0;
      hero.blasterDamage = 18;
      hero.blasterRate = 0.34;
      hero.blasterTimer = 0.1;
      hero.blasterRange = 35;
      hero.projSpeed = 44;
      hero.projPierce = 0;
      hero.orbitDamage = 11;
      hero.orbitRadius = 3.2;
      hero.novaUnlocked = false;
      hero.novaDamage = 28;
      hero.novaRadius = 8;
      hero.novaRate = 8;
      hero.novaTimer = 4;

      state.time = 0;
      state.spawnBudget = 0;
      state.kills = 0;
      state.score = 0;
      state.wave = 1;
      state.paused = false;
      state.over = false;
      state.bossAlive = false;

      gameOverPanel.classList.add('hidden');
      gameOverPanel.classList.remove('flex');
      upgradePanel.classList.add('hidden');
      upgradePanel.classList.remove('flex');
    }

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      ensureAudio();
      if (e.code === 'KeyR' && state.over) restartGame();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    window.addEventListener('pointerdown', ensureAudio);
    restartBtn.addEventListener('click', restartGame);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    for (let i = 0; i < 6; i++) spawnEnemy();
    updateHUD();
    animate();
  </script>
</body>
</html>
