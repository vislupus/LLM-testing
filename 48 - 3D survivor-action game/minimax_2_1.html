<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON FORGE - Survivor Action</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #0a0a12;
            font-family: 'Rajdhani', sans-serif;
        }
        
        #gameCanvas {
            display: block;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        
        #healthBar {
            width: 300px;
            height: 24px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff3366;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }
        
        #healthFill {
            height: 100%;
            background: linear-gradient(90deg, #ff3366, #ff6b9d);
            transition: width 0.3s ease;
            box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.3);
        }
        
        #xpBar {
            width: 400px;
            height: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        
        #xpFill {
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #00ff88);
            transition: width 0.2s ease;
        }
        
        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
        }
        
        #stats div {
            margin-bottom: 5px;
        }
        
        #waveInfo {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            text-align: right;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.8);
        }
        
        #waveNumber {
            font-size: 36px;
            font-weight: 900;
            color: #ff3366;
        }
        
        #levelUpScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto;
            z-index: 200;
        }
        
        #levelUpTitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 30px rgba(255, 204, 0, 0.8);
            margin-bottom: 40px;
            animation: pulse 1s ease infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        #upgradeCards {
            display: flex;
            gap: 30px;
        }
        
        .upgrade-card {
            width: 200px;
            height: 280px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #00ffcc;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }
        
        .upgrade-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: #ffcc00;
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.5);
        }
        
        .upgrade-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upgrade-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #00ffcc;
            margin-bottom: 10px;
        }
        
        .upgrade-desc {
            font-size: 14px;
            color: #aaa;
            line-height: 1.4;
        }
        
        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto;
            z-index: 300;
        }
        
        #gameOverTitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 72px;
            font-weight: 900;
            color: #ff3366;
            text-shadow: 0 0 50px rgba(255, 51, 102, 0.8);
            margin-bottom: 20px;
        }
        
        #finalScore {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            color: #ffcc00;
            margin-bottom: 40px;
        }
        
        #restartBtn {
            padding: 20px 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff3366, #ff6b9d);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.5);
        }
        
        #restartBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(255, 51, 102, 0.8);
        }
        
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a12 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto;
            z-index: 400;
        }
        
        #gameTitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(90deg, #00ffcc, #ff3366, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            margin-bottom: 20px;
            animation: glow 2s ease infinite;
        }
        
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 51, 102, 0.8)); }
        }
        
        #subtitle {
            font-size: 24px;
            color: #888;
            margin-bottom: 60px;
        }
        
        #startBtn {
            padding: 25px 80px;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ffcc, #00ff88);
            border: none;
            border-radius: 40px;
            color: #0a0a12;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.5);
            pointer-events: auto;
        }
        
        #startBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.8);
        }
        
        #controls {
            position: absolute;
            bottom: 30px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }
        
        .damage-number {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }
        
        #pickupNotification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffcc00;
            text-shadow: 0 0 30px rgba(255, 204, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="stats">
            <div>SCORE: <span id="scoreValue">0</span></div>
            <div>LEVEL: <span id="levelValue">1</span></div>
            <div>KILLS: <span id="killsValue">0</span></div>
        </div>
        
        <div id="waveInfo">
            <div>WAVE</div>
            <div id="waveNumber">1</div>
            <div id="waveEnemyCount"></div>
        </div>
        
        <div id="hud">
            <div id="healthBar">
                <div id="healthFill" style="width: 100%"></div>
            </div>
            <div id="xpBar">
                <div id="xpFill" style="width: 0%"></div>
            </div>
        </div>
    </div>
    
    <div id="levelUpScreen">
        <div id="levelUpTitle">⚡ LEVEL UP! ⚡</div>
        <div id="upgradeCards"></div>
    </div>
    
    <div id="gameOverScreen">
        <div id="gameOverTitle">GAME OVER</div>
        <div id="finalScore">SCORE: 0</div>
        <div id="finalStats" style="color: #888; margin-bottom: 30px; font-size: 18px;"></div>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>
    
    <div id="startScreen">
        <div id="gameTitle">NEON FORGE</div>
        <div id="subtitle">Survive the Horde • Forge Your Power</div>
        <button id="startBtn">START GAME</button>
        <div id="controls">WASD or Arrow Keys to Move • Auto-Attack Enabled</div>
    </div>
    
    <div id="pickupNotification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== GAME CONFIGURATION ====================
        const CONFIG = {
            PLAYER_SPEED: 0.18,
            PLAYER_MAX_HEALTH: 100,
            BASE_DAMAGE: 15,
            ATTACK_RANGE: 4,
            ATTACK_COOLDOWN: 0.4,
            XP_PER_KILL: 25,
            XP_LEVEL_MULTIPLIER: 1.3,
            WAVE_DURATION: 30,
            ENEMY_SPAWN_RATE: 2,
            BOSS_WAVE_INTERVAL: 5,
            PICKUP_RADIUS: 1.5
        };

        // ==================== GAME STATE ====================
        let gameState = {
            score: 0,
            level: 1,
            xp: 0,
            xpToNextLevel: 100,
            kills: 0,
            wave: 1,
            waveTime: 0,
            enemiesRemaining: 0,
            isPaused: false,
            isGameOver: false,
            isStarted: false
        };

        // ==================== UPGRADES DATABASE ====================
        const UPGRADES = [
            { id: 'damage', name: 'Plasma Edge', desc: '+25% Damage', icon: '⚔️', type: 'damage', value: 1.25 },
            { id: 'speed', name: 'Quantum Boots', desc: '+20% Move Speed', icon: '👟', type: 'speed', value: 1.2 },
            { id: 'health', name: 'Nano Shield', desc: '+30 Max Health', icon: '🛡️', type: 'health', value: 30 },
            { id: 'attackSpeed', name: 'Rapid Fire', desc: '+20% Attack Speed', icon: '🔥', type: 'attackSpeed', value: 0.8 },
            { id: 'range', name: 'Scope Lens', desc: '+30% Range', icon: '👁️', type: 'range', value: 1.3 },
            { id: 'multishot', name: 'Split Shot', desc: 'Fire +1 Projectile', icon: '✴️', type: 'multishot', value: 1 },
            { id: 'crit', name: 'Critical Eye', desc: '+15% Crit Chance', icon: '💥', type: 'crit', value: 0.15 },
            { id: 'lifesteal', name: 'Vampiric Core', desc: '+5% Lifesteal', icon: '🩸', type: 'lifesteal', value: 0.05 },
            { id: 'pierce', name: 'Railgun', desc: 'Projectiles Pierce', icon: '🎯', type: 'pierce', value: 1 },
            { id: 'orbit', name: 'Orbit Drones', desc: 'Orbiting Turrets', icon: '🛸', type: 'orbit', value: 1 }
        ];

        // ==================== WEAPONS ====================
        let player = {
            mesh: null,
            health: CONFIG.PLAYER_MAX_HEALTH,
            maxHealth: CONFIG.PLAYER_MAX_HEALTH,
            damage: CONFIG.BASE_DAMAGE,
            speed: CONFIG.PLAYER_SPEED,
            attackCooldown: CONFIG.ATTACK_COOLDOWN,
            attackTimer: 0,
            range: CONFIG.ATTACK_RANGE,
            multishot: 1,
            critChance: 0,
            lifesteal: 0,
            hasPierce: false,
            orbitDrones: 0,
            level: 1,
            xp: 0,
            xpToNextLevel: 100,
            weapons: ['plasma']
        };

        let enemies = [];
        let projectiles = [];
        let particles = [];
        let damageNumbers = [];
        let pickups = [];
        let orbitDrones = [];

        // ==================== THREE.JS SETUP ====================
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.Fog(0x0a0a12, 30, 80);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 20);
        camera.lookAt(0, 0, 0);

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0x1a1a3a, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(20, 40, 20);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 100;
        mainLight.shadow.camera.left = -40;
        mainLight.shadow.camera.right = 40;
        mainLight.shadow.camera.top = 40;
        mainLight.shadow.camera.bottom = -40;
        scene.add(mainLight);

        const purpleLight = new THREE.PointLight(0xff00ff, 0.5, 50);
        purpleLight.position.set(-15, 10, -15);
        scene.add(purpleLight);

        const cyanLight = new THREE.PointLight(0x00ffff, 0.5, 50);
        cyanLight.position.set(15, 10, 15);
        scene.add(cyanLight);

        // ==================== ENVIRONMENT ====================
        // Ground
        const groundGeometry = new THREE.PlaneGeometry(200, 200, 50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            metalness: 0.8,
            roughness: 0.4,
            wireframe: false
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid overlay
        const gridHelper = new THREE.GridHelper(200, 100, 0x00ffcc, 0x1a1a3a);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Procedural pillars/obstacles
        const pillarMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a4e,
            metalness: 0.9,
            roughness: 0.3,
            emissive: 0x00ffcc,
            emissiveIntensity: 0.05
        });

        for (let i = 0; i < 20; i++) {
            const height = 3 + Math.random() * 8;
            const pillarGeo = new THREE.CylinderGeometry(0.5 + Math.random() * 0.5, 0.8 + Math.random() * 0.5, height, 8);
            const pillar = new THREE.Mesh(pillarGeo, pillarMaterial);
            const angle = Math.random() * Math.PI * 2;
            const dist = 20 + Math.random() * 60;
            pillar.position.set(Math.cos(angle) * dist, height / 2, Math.sin(angle) * dist);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        }

        // ==================== PLAYER CHARACTER ====================
        function createPlayer() {
            const playerGroup = new THREE.Group();
            
            // Body (stylized robot/suit)
            const bodyGeo = new THREE.CapsuleGeometry(0.6, 1.2, 8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,
                metalness: 0.7,
                roughness: 0.3,
                emissive: 0x00ffcc,
                emissiveIntensity: 0.2
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.2;
            body.castShadow = true;
            playerGroup.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({
                color: 0x111133,
                metalness: 0.9,
                roughness: 0.2,
                emissive: 0x00ffcc,
                emissiveIntensity: 0.5
            });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.2;
            head.castShadow = true;
            playerGroup.add(head);

            // Visor
            const visorGeo = new THREE.BoxGeometry(0.6, 0.15, 0.3);
            const visorMat = new THREE.MeshStandardMaterial({
                color: 0xff3366,
                emissive: 0xff3366,
                emissiveIntensity: 1,
                metalness: 1,
                roughness: 0
            });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 2.2, 0.35);
            playerGroup.add(visor);

            // Shoulders
            const shoulderGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const shoulderMat = new THREE.MeshStandardMaterial({
                color: 0xffcc00,
                metalness: 0.8,
                roughness: 0.2,
                emissive: 0xffcc00,
                emissiveIntensity: 0.3
            });
            
            const leftShoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
            leftShoulder.position.set(-0.7, 1.6, 0);
            playerGroup.add(leftShoulder);
            
            const rightShoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
            rightShoulder.position.set(0.7, 1.6, 0);
            playerGroup.add(rightShoulder);

            // Legs
            const legGeo = new THREE.CapsuleGeometry(0.2, 0.6, 4, 8);
            const legMat = new THREE.MeshStandardMaterial({
                color: 0x2a2a4e,
                metalness: 0.8,
                roughness: 0.3
            });
            
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.3, 0.4, 0);
            playerGroup.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.3, 0.4, 0);
            playerGroup.add(rightLeg);

            // Weapon (gun)
            const gunGeo = new THREE.CylinderGeometry(0.08, 0.12, 0.8, 8);
            const gunMat = new THREE.MeshStandardMaterial({
                color: 0xff3366,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0xff3366,
                emissiveIntensity: 0.5
            });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.rotation.x = Math.PI / 2;
            gun.position.set(0.5, 1.2, 0.6);
            playerGroup.add(gun);

            // Glow effect
            const glowGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x00ffcc,
                transparent: true,
                opacity: 0.8
            });
            
            const glow1 = new THREE.Mesh(glowGeo, glowMat);
            glow1.position.set(0, 2.2, 0);
            playerGroup.add(glow1);

            player.mesh = playerGroup;
            scene.add(player.mesh);
        }

        // ==================== ENEMIES ====================
        const ENEMY_TYPES = {
            crawler: {
                name: 'Crawler',
                health: 30,
                damage: 10,
                speed: 0.08,
                color: 0xff3366,
                scale: 0.8,
                xp: 20,
                score: 10
            },
            soldier: {
                name: 'Soldier',
                health: 60,
                damage: 15,
                speed: 0.06,
                color: 0xff6600,
                scale: 1,
                xp: 35,
                score: 20
            },
            tank: {
                name: 'Brute',
                health: 150,
                damage: 25,
                speed: 0.03,
                color: 0x9900ff,
                scale: 1.5,
                xp: 60,
                score: 50
            },
            boss: {
                name: 'Void Titan',
                health: 500,
                damage: 40,
                speed: 0.04,
                color: 0xffd700,
                scale: 2.5,
                xp: 500,
                score: 500
            }
        };

        function createEnemy(type, position) {
            const enemyData = ENEMY_TYPES[type];
            const enemyGroup = new THREE.Group();
            
            // Main body
            const bodyGeo = new THREE.DodecahedronGeometry(enemyData.scale * 0.6);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: enemyData.color,
                metalness: 0.6,
                roughness: 0.4,
                emissive: enemyData.color,
                emissiveIntensity: 0.3
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            enemyGroup.add(body);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(enemyData.scale * 0.15, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                emissive: 0xffffff,
                emissiveIntensity: 1
            });
            
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-enemyData.scale * 0.2, enemyData.scale * 0.2, enemyData.scale * 0.4);
            enemyGroup.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(enemyData.scale * 0.2, enemyData.scale * 0.2, enemyData.scale * 0.4);
            enemyGroup.add(rightEye);

            // Legs/spikes based on type
            if (type === 'tank' || type === 'boss') {
                const spikeGeo = new THREE.ConeGeometry(enemyData.scale * 0.2, enemyData.scale * 0.6, 6);
                const spikeMat = new THREE.MeshStandardMaterial({
                    color: 0x333333,
                    metalness: 0.9,
                    roughness: 0.2
                });
                
                for (let i = 0; i < 6; i++) {
                    const spike = new THREE.Mesh(spikeGeo, spikeMat);
                    const angle = (i / 6) * Math.PI * 2;
                    spike.position.set(
                        Math.cos(angle) * enemyData.scale * 0.5,
                        -enemyData.scale * 0.3,
                        Math.sin(angle) * enemyData.scale * 0.5
                    );
                    spike.rotation.x = Math.PI;
                    enemyGroup.add(spike);
                }
            }

            enemyGroup.position.copy(position);
            
            const enemy = {
                mesh: enemyGroup,
                type: type,
                health: enemyData.health,
                maxHealth: enemyData.health,
                damage: enemyData.damage,
                speed: enemyData.speed,
                xp: enemyData.xp,
                score: enemyData.score,
                scale: enemyData.scale,
                isDead: false,
                hitFlash: 0,
                attackTimer: 0
            };
            
            scene.add(enemyGroup);
            enemies.push(enemy);
            
            return enemy;
        }

        // ==================== PROJECTILES ====================
        function createProjectile(origin, target, damage, isPlayer = true) {
            const projGroup = new THREE.Group();
            
            // Core
            const coreGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const coreMat = new THREE.MeshBasicMaterial({
                color: isPlayer ? 0x00ffcc : 0xff3366
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            projGroup.add(core);

            // Glow
            const glowGeo = new THREE.SphereGeometry(0.25, 8, 8);
            const glowMat = new THREE.MeshBasicMaterial({
                color: isPlayer ? 0x00ffcc : 0xff3366,
                transparent: true,
                opacity: 0.5
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            projGroup.add(glow);

            // Trail
            const trailGeo = new THREE.CylinderGeometry(0.05, 0.15, 0.5, 8);
            const trailMat = new THREE.MeshBasicMaterial({
                color: isPlayer ? 0x00ffcc : 0xff3366,
                transparent: true,
                opacity: 0.6
            });
            const trail = new THREE.Mesh(trailGeo, trailMat);
            trail.rotation.x = Math.PI / 2;
            trail.position.z = -0.3;
            projGroup.add(trail);

            projGroup.position.copy(origin);
            
            const direction = new THREE.Vector3().subVectors(target, origin).normalize();
            
            const projectile = {
                mesh: projGroup,
                direction: direction,
                speed: 0.5,
                damage: damage,
                isPlayer: isPlayer,
                pierceCount: player.hasPierce ? 3 : 1,
                isDead: false,
                lifetime: 3
            };
            
            scene.add(projGroup);
            projectiles.push(projectile);
            
            return projectile;
        }

        // ==================== PARTICLES ====================
        function createParticle(position, color, velocity, lifetime = 1) {
            const geo = new THREE.SphereGeometry(0.1, 4, 4);
            const mat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 1
            });
            const particle = new THREE.Mesh(geo, mat);
            particle.position.copy(position);
            
            const p = {
                mesh: particle,
                velocity: velocity,
                lifetime: lifetime,
                maxLifetime: lifetime,
                isDead: false
            };
            
            scene.add(particle);
            particles.push(p);
            
            return p;
        }

        function createExplosion(position, color, count = 20) {
            for (let i = 0; i < count; i++) {
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    Math.random() * 0.2,
                    (Math.random() - 0.5) * 0.3
                );
                createParticle(position.clone(), color, velocity, 0.5 + Math.random() * 0.5);
            }
        }

        // ==================== PICKUPS ====================
        function createPickup(position, type) {
            const pickupGroup = new THREE.Group();
            
            if (type === 'xp') {
                const geo = new THREE.OctahedronGeometry(0.3);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x00ffcc,
                    emissive: 0x00ffcc,
                    emissiveIntensity: 0.8,
                    metalness: 1,
                    roughness: 0
                });
                const gem = new THREE.Mesh(geo, mat);
                pickupGroup.add(gem);
                
                // Outer glow
                const glowGeo = new THREE.OctahedronGeometry(0.4);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0x00ffcc,
                    transparent: true,
                    opacity: 0.3
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                pickupGroup.add(glow);
            }
            
            pickupGroup.position.copy(position);
            pickupGroup.position.y = 0.5;
            
            const pickup = {
                mesh: pickupGroup,
                type: type,
                value: type === 'xp' ? 25 : 10,
                isDead: false,
                bobOffset: Math.random() * Math.PI * 2
            };
            
            scene.add(pickupGroup);
            pickups.push(pickup);
            
            return pickup;
        }

        // ==================== ORBIT DRONES ====================
        function createOrbitDrone() {
            const droneGroup = new THREE.Group();
            
            const bodyGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x00ffcc,
                emissive: 0x00ffcc,
                emissiveIntensity: 0.8,
                metalness: 1,
                roughness: 0
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            droneGroup.add(body);

            const ringGeo = new THREE.TorusGeometry(0.3, 0.03, 8, 16);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            droneGroup.add(ring);

            const drone = {
                mesh: droneGroup,
                angle: orbitDrones.length * (Math.PI * 2 / (orbitDrones.length + 1)),
                distance: 2,
                height: 1.5,
                speed: 0.03,
                attackTimer: 0
            };

            scene.add(droneGroup);
            orbitDrones.push(drone);
            
            return drone;
        }

        // ==================== DAMAGE NUMBERS ====================
        function createDamageNumber(position, damage, isCrit = false, isHeal = false) {
            const div = document.createElement('div');
            div.className = 'damage-number';
            div.style.left = (window.innerWidth / 2 + (position.x - player.mesh.position.x) * 30) + 'px';
            div.style.top = (window.innerHeight / 2 - (position.z - player.mesh.position.z) * 20 - 50) + 'px';
            div.style.color = isHeal ? '#00ff88' : (isCrit ? '#ffcc00' : '#ffffff');
            div.style.fontSize = isCrit ? '36px' : '24px';
            div.textContent = isHeal ? `+${Math.round(damage)}` : Math.round(damage);
            
            if (isCrit) {
                div.style.textShadow = '0 0 20px #ffcc00, 0 0 40px #ff6600';
            }
            
            document.body.appendChild(div);
            
            setTimeout(() => div.remove(), 1000);
        }

        // ==================== INPUT HANDLING ====================
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
        };

        document.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // ==================== GAME LOGIC ====================
        function updatePlayer(delta) {
            if (!player.mesh) return;

            // Movement
            let moveX = 0, moveZ = 0;
            if (keys.w || keys.ArrowUp) moveZ -= 1;
            if (keys.s || keys.ArrowDown) moveZ += 1;
            if (keys.a || keys.ArrowLeft) moveX -= 1;
            if (keys.d || keys.ArrowRight) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= length;
                moveZ /= length;
                
                player.mesh.position.x += moveX * player.speed;
                player.mesh.position.z += moveZ * player.speed;
                
                // Face movement direction
                const targetAngle = Math.atan2(moveX, moveZ);
                player.mesh.rotation.y = targetAngle;
            }

            // Boundary
            const bound = 45;
            player.mesh.position.x = Math.max(-bound, Math.min(bound, player.mesh.position.x));
            player.mesh.position.z = Math.max(-bound, Math.min(bound, player.mesh.position.z));

            // Attack
            player.attackTimer -= delta;
            if (player.attackTimer <= 0 && enemies.length > 0) {
                // Find nearest enemy
                let nearest = null;
                let nearestDist = player.range;
                
                for (const enemy of enemies) {
                    if (enemy.isDead) continue;
                    const dist = player.mesh.position.distanceTo(enemy.mesh.position);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearest = enemy;
                    }
                }
                
                if (nearest) {
                    // Multi-shot
                    const spread = 0.15;
                    for (let i = 0; i < player.multishot; i++) {
                        const offset = (i - (player.multishot - 1) / 2) * spread;
                        const origin = player.mesh.position.clone();
                        origin.y = 1.5;
                        
                        const targetPos = nearest.mesh.position.clone();
                        targetPos.y = 1;
                        
                        // Apply spread
                        const dir = new THREE.Vector3().subVectors(targetPos, origin);
                        dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), offset);
                        
                        // Calculate damage with crit
                        let damage = player.damage;
                        let isCrit = Math.random() < player.critChance;
                        if (isCrit) damage *= 2;
                        
                        const projOrigin = origin.clone();
                        const projTarget = projOrigin.clone().add(dir.normalize().multiplyScalar(10));
                        
                        createProjectile(projOrigin, projTarget, damage, true);
                    }
                    
                    player.attackTimer = player.attackCooldown;
                    
                    // Attack sound effect (visual)
                    createExplosion(player.mesh.position.clone(), 0x00ffcc, 3);
                }
            }

            // Update orbit drones
            for (let i = 0; i < orbitDrones.length; i++) {
                const drone = orbitDrones[i];
                drone.angle += drone.speed;
                drone.mesh.position.x = player.mesh.position.x + Math.cos(drone.angle) * drone.distance;
                drone.mesh.position.z = player.mesh.position.z + Math.sin(drone.angle) * drone.distance;
                drone.mesh.position.y = player.mesh.position.y + drone.height + Math.sin(drone.angle * 2) * 0.2;
                
                // Drone attack
                drone.attackTimer -= delta;
                if (drone.attackTimer <= 0 && enemies.length > 0) {
                    let nearest = null;
                    let nearestDist = 4;
                    
                    for (const enemy of enemies) {
                        if (enemy.isDead) continue;
                        const dist = drone.mesh.position.distanceTo(enemy.mesh.position);
                        if (dist < nearestDist) {
                            nearestDist = dist;
                            nearest = enemy;
                        }
                    }
                    
                    if (nearest) {
                        createProjectile(drone.mesh.position.clone(), nearest.mesh.position.clone(), player.damage * 0.3, true);
                        drone.attackTimer = 0.5;
                    }
                }
            }
        }

        function updateProjectiles(delta) {
            for (const proj of projectiles) {
                if (proj.isDead) continue;
                
                proj.mesh.position.add(proj.direction.clone().multiplyScalar(proj.speed));
                proj.lifetime -= delta;
                
                if (proj.lifetime <= 0 || proj.pierceCount <= 0) {
                    proj.isDead = true;
                    scene.remove(proj.mesh);
                    continue;
                }
                
                // Check collision with enemies (player projectiles)
                if (proj.isPlayer) {
                    for (const enemy of enemies) {
                        if (enemy.isDead) continue;
                        
                        const dist = proj.mesh.position.distanceTo(enemy.mesh.position);
                        if (dist < enemy.scale * 0.8) {
                            // Hit enemy
                            let damage = proj.damage;
                            let isCrit = Math.random() < player.critChance;
                            if (isCrit) damage *= 2;
                            
                            enemy.health -= damage;
                            enemy.hitFlash = 0.2;
                            proj.pierceCount--;
                            
                            createDamageNumber(enemy.mesh.position.clone(), damage, isCrit);
                            createExplosion(proj.mesh.position.clone(), 0x00ffcc, 5);
                            
                            if (enemy.health <= 0) {
                                killEnemy(enemy);
                            }
                            
                            if (proj.pierceCount <= 0) {
                                proj.isDead = true;
                                scene.remove(proj.mesh);
                            }
                            
                            break;
                        }
                    }
                }
                // Check collision with player (enemy projectiles)
                else {
                    const dist = proj.mesh.position.distanceTo(player.mesh.position);
                    if (dist < 1) {
                        damagePlayer(proj.damage);
                        proj.isDead = true;
                        scene.remove(proj.mesh);
                    }
                }
            }
            
            projectiles = projectiles.filter(p => !p.isDead);
        }

        function updateEnemies(delta) {
            for (const enemy of enemies) {
                if (enemy.isDead) continue;
                
                const dist = enemy.mesh.position.distanceTo(player.mesh.position);
                
                if (dist > 1.5) {
                    // Move towards player
                    const direction = new THREE.Vector3()
                        .subVectors(player.mesh.position, enemy.mesh.position)
                        .normalize();
                    
                    enemy.mesh.position.add(direction.multiplyScalar(enemy.speed));
                    
                    // Face player
                    enemy.mesh.lookAt(player.mesh.position);
                } else {
                    // Attack
                    enemy.attackTimer -= delta;
                    if (enemy.attackTimer <= 0) {
                        damagePlayer(enemy.damage);
                        enemy.attackTimer = 1;
                    }
                }
                
                // Hit flash decay
                if (enemy.hitFlash > 0) {
                    enemy.hitFlash -= delta;
                    const intensity = enemy.hitFlash * 5;
                    enemy.mesh.children[0].material.emissiveIntensity = 0.3 + intensity;
                }
            }
            
            // Remove dead enemies
            enemies = enemies.filter(e => !e.isDead);
        }

        function updateParticles(delta) {
            for (const particle of particles) {
                if (particle.isDead) continue;
                
                particle.mesh.position.add(particle.velocity);
                particle.velocity.y -= 0.01; // gravity
                particle.lifetime -= delta;
                
                particle.mesh.material.opacity = particle.lifetime / particle.maxLifetime;
                
                if (particle.lifetime <= 0) {
                    particle.isDead = true;
                    scene.remove(particle.mesh);
                }
            }
            
            particles = particles.filter(p => !p.isDead);
        }

        function updatePickups(delta) {
            const time = Date.now() * 0.001;
            
            for (const pickup of pickups) {
                if (pickup.isDead) continue;
                
                // Bob animation
                pickup.mesh.position.y = 0.5 + Math.sin(time * 3 + pickup.bobOffset) * 0.3;
                pickup.mesh.rotation.y += delta * 2;
                
                // Check collection
                const dist = player.mesh.position.distanceTo(pickup.mesh.position);
                if (dist < CONFIG.PICKUP_RADIUS) {
                    if (pickup.type === 'xp') {
                        addXP(pickup.value);
                        createExplosion(pickup.mesh.position.clone(), 0x00ffcc, 10);
                    }
                    pickup.isDead = true;
                    scene.remove(pickup.mesh);
                }
            }
            
            pickups = pickups.filter(p => !p.isDead);
        }

        function killEnemy(enemy) {
            enemy.isDead = true;
            scene.remove(enemy.mesh);
            
            // Create XP pickup
            createPickup(enemy.mesh.position.clone(), 'xp');
            
            // Add score
            gameState.score += enemy.score;
            gameState.kills++;
            
            // Explosion effect
            createExplosion(enemy.mesh.position.clone(), enemy.type === 'boss' ? 0xffd700 : 0xff3366, 30);
            
            updateUI();
        }

        function damagePlayer(amount) {
            player.health -= amount;
            
            // Screen shake
            camera.position.x += (Math.random() - 0.5) * 0.5;
            camera.position.z += (Math.random() - 0.5) * 0.5;
            
            createDamageNumber(player.mesh.position.clone(), amount, false);
            createExplosion(player.mesh.position.clone(), 0xff3366, 5);
            
            updateUI();
            
            if (player.health <= 0) {
                gameOver();
            }
        }

        function addXP(amount) {
            player.xp += amount;
            
            while (player.xp >= player.xpToNextLevel) {
                player.xp -= player.xpToNextLevel;
                player.level++;
                player.xpToNextLevel = Math.floor(player.xpToNextLevel * CONFIG.XP_LEVEL_MULTIPLIER);
                
                showLevelUp();
            }
            
            updateUI();
        }

        function showLevelUp() {
            gameState.isPaused = true;
            
            const screen = document.getElementById('levelUpScreen');
            const cardsContainer = document.getElementById('upgradeCards');
            
            // Pick 3 random upgrades
            const available = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
            
            cardsContainer.innerHTML = '';
            
            for (const upgrade of available) {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="upgrade-icon">${upgrade.icon}</div>
                    <div class="upgrade-name">${upgrade.name}</div>
                    <div class="upgrade-desc">${upgrade.desc}</div>
                `;
                card.onclick = () => applyUpgrade(upgrade);
                cardsContainer.appendChild(card);
            }
            
            screen.style.display = 'flex';
        }

        function applyUpgrade(upgrade) {
            switch (upgrade.type) {
                case 'damage':
                    player.damage *= upgrade.value;
                    break;
                case 'speed':
                    player.speed *= upgrade.value;
                    break;
                case 'health':
                    player.maxHealth += upgrade.value;
                    player.health += upgrade.value;
                    break;
                case 'attackSpeed':
                    player.attackCooldown *= upgrade.value;
                    break;
                case 'range':
                    player.range *= upgrade.value;
                    break;
                case 'multishot':
                    player.multishot += upgrade.value;
                    break;
                case 'crit':
                    player.critChance += upgrade.value;
                    break;
                case 'lifesteal':
                    player.lifesteal += upgrade.value;
                    break;
                case 'pierce':
                    player.hasPierce = true;
                    break;
                case 'orbit':
                    player.orbitDrones += upgrade.value;
                    createOrbitDrone();
                    break;
            }
            
            document.getElementById('levelUpScreen').style.display = 'none';
            gameState.isPaused = false;
        }

        function spawnEnemies() {
            if (gameState.isPaused || gameState.isGameOver) return;
            
            const wave = gameState.wave;
            const isBossWave = wave % CONFIG.BOSS_WAVE_INTERVAL === 0;
            
            if (isBossWave) {
                // Spawn boss
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 10;
                const pos = new THREE.Vector3(
                    Math.cos(angle) * dist,
                    0,
                    Math.sin(angle) * dist
                );
                createEnemy('boss', pos);
                gameState.enemiesRemaining = 1;
                
                showNotification('⚠️ BOSS APPROACHING ⚠️');
            } else {
                // Spawn regular enemies
                const enemyCount = 3 + Math.floor(wave * 1.5);
                const spawnTypes = ['crawler', 'crawler', 'soldier', 'tank'];
                
                for (let i = 0; i < enemyCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 25 + Math.random() * 20;
                    const pos = new THREE.Vector3(
                        Math.cos(angle) * dist,
                        0,
                        Math.sin(angle) * dist
                    );
                    
                    let type = 'crawler';
                    if (wave > 2 && Math.random() < 0.3) type = 'soldier';
                    if (wave > 4 && Math.random() < 0.2) type = 'tank';
                    
                    createEnemy(type, pos);
                }
                
                gameState.enemiesRemaining = enemyCount;
            }
            
            updateUI();
        }

        function checkWaveComplete() {
            if (gameState.enemiesRemaining <= 0 && enemies.length === 0) {
                gameState.wave++;
                gameState.waveTime = 0;
                
                // Brief pause between waves
                setTimeout(() => {
                    if (!gameState.isGameOver) {
                        spawnEnemies();
                    }
                }, 2000);
            }
        }

        function updateUI() {
            document.getElementById('scoreValue').textContent = gameState.score;
            document.getElementById('levelValue').textContent = player.level;
            document.getElementById('killsValue').textContent = gameState.kills;
            document.getElementById('waveNumber').textContent = gameState.wave;
            
            const healthPercent = Math.max(0, (player.health / player.maxHealth) * 100);
            document.getElementById('healthFill').style.width = healthPercent + '%';
            
            const xpPercent = (player.xp / player.xpToNextLevel) * 100;
            document.getElementById('xpFill').style.width = xpPercent + '%';
            
            const enemyText = enemies.length > 0 ? `${enemies.length} enemies` : 'Next wave...';
            document.getElementById('waveEnemyCount').textContent = enemyText;
        }

        function showNotification(text) {
            const notif = document.getElementById('pickupNotification');
            notif.textContent = text;
            notif.style.opacity = '1';
            
            setTimeout(() => {
                notif.style.opacity = '0';
            }, 2000);
        }

        function gameOver() {
            gameState.isGameOver = true;
            gameState.isPaused = true;
            
            const screen = document.getElementById('gameOverScreen');
            document.getElementById('finalScore').textContent = `SCORE: ${gameState.score}`;
            document.getElementById('finalStats').innerHTML = `
                Waves Survived: ${gameState.wave}<br>
                Enemies Killed: ${gameState.kills}<br>
                Level Reached: ${player.level}
            `;
            
            screen.style.display = 'flex';
        }

        function restartGame() {
            // Clear all entities
            for (const enemy of enemies) {
                scene.remove(enemy.mesh);
            }
            for (const proj of projectiles) {
                scene.remove(proj.mesh);
            }
            for (const particle of particles) {
                scene.remove(particle.mesh);
            }
            for (const pickup of pickups) {
                scene.remove(pickup.mesh);
            }
            for (const drone of orbitDrones) {
                scene.remove(drone.mesh);
            }
            
            enemies = [];
            projectiles = [];
            particles = [];
            pickups = [];
            orbitDrones = [];
            
            // Reset game state
            gameState = {
                score: 0,
                level: 1,
                xp: 0,
                xpToNextLevel: 100,
                kills: 0,
                wave: 1,
                waveTime: 0,
                enemiesRemaining: 0,
                isPaused: false,
                isGameOver: false,
                isStarted: true
            };
            
            // Reset player
            player.health = CONFIG.PLAYER_MAX_HEALTH;
            player.maxHealth = CONFIG.PLAYER_MAX_HEALTH;
            player.damage = CONFIG.BASE_DAMAGE;
            player.speed = CONFIG.PLAYER_SPEED;
            player.attackCooldown = CONFIG.ATTACK_COOLDOWN;
            player.range = CONFIG.ATTACK_RANGE;
            player.multishot = 1;
            player.critChance = 0;
            player.lifesteal = 0;
            player.hasPierce = false;
            player.orbitDrones = 0;
            player.level = 1;
            player.xp = 0;
            player.xpToNextLevel = 100;
            
            player.mesh.position.set(0, 0, 0);
            
            // Hide screens
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('levelUpScreen').style.display = 'none';
            
            updateUI();
            
            // Spawn first wave
            setTimeout(spawnEnemies, 1000);
        }

        // ==================== CAMERA FOLLOW ====================
        function updateCamera() {
            const targetX = player.mesh.position.x;
            const targetZ = player.mesh.position.z + 20;
            
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.z += (targetZ - camera.position.z) * 0.05;
            camera.position.y = 25;
            
            camera.lookAt(player.mesh.position.x, 0, player.mesh.position.z);
        }

        // ==================== GAME LOOP ====================
        const clock = new THREE.Clock();
        let spawnTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            
            if (!gameState.isPaused && !gameState.isGameOver && gameState.isStarted) {
                // Update wave timer
                gameState.waveTime += delta;
                
                // Spawn enemies periodically
                spawnTimer += delta;
                if (spawnTimer > CONFIG.ENEMY_SPAWN_RATE && enemies.length < 5 + gameState.wave * 2) {
                    if (Math.random() < 0.3) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 25 + Math.random() * 15;
                        const pos = new THREE.Vector3(
                            Math.cos(angle) * dist,
                            0,
                            Math.sin(angle) * dist
                        );
                        
                        let type = 'crawler';
                        if (gameState.wave > 2 && Math.random() < 0.3) type = 'soldier';
                        if (gameState.wave > 4 && Math.random() < 0.2) type = 'tank';
                        
                        createEnemy(type, pos);
                    }
                    spawnTimer = 0;
                }
                
                updatePlayer(delta);
                updateProjectiles(delta);
                updateEnemies(delta);
                updateParticles(delta);
                updatePickups(delta);
                updateCamera();
                
                // Check for lifesteal
                if (player.lifesteal > 0) {
                    // Could add lifesteal on kill here
                }
                
                checkWaveComplete();
            }
            
            // Animate lights
            const time = Date.now() * 0.001;
            purpleLight.position.x = Math.sin(time * 0.5) * 15;
            purpleLight.position.z = Math.cos(time * 0.5) * 15;
            cyanLight.position.x = Math.cos(time * 0.3) * 15;
            cyanLight.position.z = Math.sin(time * 0.3) * 15;
            
            renderer.render(scene, camera);
        }

        // ==================== INITIALIZATION ====================
        function init() {
            createPlayer();
            updateUI();
            
            // Start button
            document.getElementById('startBtn').onclick = () => {
                restartGame();
            };
            
            // Restart button
            document.getElementById('restartBtn').onclick = () => {
                restartGame();
            };
            
            // Handle resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            animate();
        }

        init();
    </script>
</body>
</html>
