<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Survivor - Stylized 3D Horde Survival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            user-select: none;
        }

        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #uiOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .ui-element {
            position: absolute;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 10px;
            border-radius: 4px;
            text-shadow: 0 0 5px #0ff;
        }

        #healthBar {
            top: 20px;
            left: 20px;
            width: 300px;
        }

        #xpBar {
            top: 60px;
            left: 20px;
            width: 300px;
        }

        #scoreDisplay {
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        #waveDisplay {
            top: 70px;
            right: 20px;
        }

        #levelUpDisplay {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 0, 255, 0.9);
            border-color: #f0f;
            color: #fff;
            display: none;
        }

        #levelUpOptions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .levelUpOption {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #f0f;
            color: #f0f;
            padding: 15px;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s;
        }

        .levelUpOption:hover {
            background: rgba(255, 0, 255, 0.9);
            color: #000;
        }

        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #gameOverText {
            font-size: 48px;
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
            margin-bottom: 20px;
        }

        #restartButton {
            background: #0ff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        #restartButton:hover {
            background: #fff;
        }

        #controlsHint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            font-size: 14px;
            opacity: 0.7;
        }

        .damageNumber {
            position: absolute;
            color: #ff0;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 5px #ff0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) opacity: 1; }
            100% { transform: translateY(-50px) opacity: 0; }
        }

        .pickupEffect {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #0f0;
            border-radius: 50%;
            pointer-events: none;
            animation: pulse 1s infinite;
 box-shadow: 0 0 20px #0f0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="uiOverlay">
        <div id="healthBar" class="ui-element">
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                <span>HP: <span id="healthValue">100</span>/100</span>
                <span>Level <span id="playerLevel">1</span></span>
 </div>
            <div style="width: 100%; height: 20px; background: #333; border: 1px solid #0ff;">
                <div id="healthBarFill" style="width: 100%; height: 100%; background: #f00; transition: width 0.3s;"></div>
            </div>
        </div>
        
        <div id="xpBar" class="ui-element">
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                <span>XP: <span id="xpValue">0</span>/<span id="xpToNext">100</span></span>
                <span><span id="enemiesLeft">0</span> enemies</span>
 </div>
            <div style="width: 100%; height: 20px; background: #333; border: 1px solid #0ff;">
                <div id="xpBarFill" style="width: 0%; height: 100%; background: #0ff; transition: width 0.3s;"></div>
 </div>
        </div>
        
        <div id="scoreDisplay" class="ui-element">
            SCORE: <span id="scoreValue">0</span>
        </div>
        
        <div id="waveDisplay" class="ui-element">
            WAVE: <span id="waveValue">1</span>
        </div>
        
        <div id="levelUpDisplay" class="ui-element">
            <div style="font-size: 24px; margin-bottom: 10px;">LEVEL UP!</div>
            <div id="levelUpOptions"></div>
        </div>
    </div>
    
    <div id="gameOverScreen">
        <div>
            <div id="gameOverText">GAME OVER</div>
            <div style="color: #0ff; font-size: 20px; margin-bottom: 20px;">
 Final Score: <span id="finalScore">0</span><br>
                Wave: <span id="finalWave">1</span>
            </div>
            <button id="restartButton">RESTART GAME</button>
        </div>
    </div>
    
    <div id="controlsHint" class="ui-element">
        WASD to move • Auto-attacks • Pick up XP orbs • Level up every5 waves
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script>
        // Simplex Noise implementation for procedural generation
        class SimplexNoise {
            constructor() {
                this.perm = new Uint8Array(256);
                for (let i = 0; i < 256; i++) this.perm[i] = i;
                for (let i = 0; i < 256; i++) {
 const r = Math.floor(Math.random() * 256);
                    [this.perm[i], this.perm[r]] = [this.perm[r], this.perm[i]];
                }
                this.permMod12 = new Uint8Array(512);
                for (let i = 0; i < 512; i++) this.permMod12[i] = this.perm[i % 256] % 12;
 }

            noise2D(x, y) {
                const F2 = 0.5 * (Math.sqrt(3.0) - 1.0);
                const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;
                let n0, n1, n2;
                const s = (x + y) * F2;
                const i = Math.floor(x + s);
                const j = Math.floor(y + s);
                const t = (i + j) * G2;
                const X0 = i - t;
                const Y0 = j - t;
                const x0 = x - X0;
                const y0 = y - Y0;
                let i1, j1;
                if (x0 > y0) { i1 = 1; j1 = 0; } else { i1 = 0; j1 = 1; }
                const x1 = x0 - i1 + G2;
                const y1 = y0 - j1 + G2;
                const x2 = x0 - 1.0 + 2.0 * G2;
                const y2 = y0 - 1.0 + 2.0 * G2;
                const ii = i & 255;
                const jj = j & 255;
                const gi0 = this.permMod12[ii + this.perm[jj]];
                const gi1 = this.permMod12[ii + i1 + this.perm[jj + j1]];
                const gi2 = this.permMod12[ii + 1 + this.perm[jj + 1]];
                let t0 = 0.5 - x0 * x0 - y0 * y0;
                if (t0 < 0) n0 = 0.0; else {
 t0 *= t0;
                    n0 = t0 * t0 * this.dot(gi0, x0, y0);
                }
                let t1 = 0.5 - x1 * x1 - y1 * y1;
                if (t1 < 0) n1 = 0.0; else {
                    t1 *= t1;
                    n1 = t1 * t1 * this.dot(gi1, x1, y1);
                }
                let t2 = 0.5 - x2 * x2 - y2 * y2;
                if (t2 < 0) n2 = 0.0; else {
                    t2 *= t2;
                    n2 = t2 * t2 * this.dot(gi2, x2, y2);
                }
                return70.0 * (n0 + n1 + n2);
            }

            dot(gi, x, y) {
                return gi & 1 ? x : -x + (gi & 2 ? y : -y);
            }
 }

        // Game variables
        const game = {
            scene: null,
            camera: null,
            renderer: null,
            player: null,
            enemies: [],
            projectiles: [],
            particles: [],
            pickups: [],
            grid: [],
            clock: new THREE.Clock(),
            lastTime: 0,
            isGameOver: false,
            isLevelingUp: false,
            score: 0,
            wave: 1,
            enemiesPerWave: 5,
            enemiesKilled: 0,
            xp: 0,
            xpToNextLevel: 100,
            playerLevel: 1,
            playerHealth: 100,
            maxHealth: 100,
            weapons: [],
            currentWeaponIndex: 0,
            upgrades: [],
            difficulty: 1,
            playerSpeed: 10,
            damageMultiplier: 1,
            fireRateMultiplier: 1,
            moveMultiplier: 1,
            playerInvincibility: 0
        };

        // Input handling
        const keys = {};
        const mouse = new THREE.Vector2();
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('keydown', (event) => {
            keys[event.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (event) => {
            keys[event.key.toLowerCase()] = false;
        });

        document.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Initialize Three.js
        function initThree() {
            const container = document.getElementById('gameContainer');
            game.scene = new THREE.Scene();
            game.scene.fog = new THREE.Fog(0x0a0a1a, 20, 100);

            game.camera = new THREE.OrthographicCamera(
 window.innerWidth / -2,
                window.innerWidth / 2,
                window.innerHeight / 2,
                window.innerHeight / -2,
                1,
                1000
            );
            game.camera.position.set(0, 200, 200);
            game.camera.lookAt(0, 0, 0);

            game.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            game.renderer.setSize(window.innerWidth, window.innerHeight);
            game.renderer.shadowMap.enabled = true;
            game.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(game.renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            game.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffaa00, 0.5);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.near = 1;
            directionalLight.shadow.camera.far = 300;
            directionalLight.shadow.camera.left = -100;
            directionalLight.shadow.camera.right = 100;
            directionalLight.shadow.camera.top = 100;
            directionalLight.shadow.camera.bottom = -100;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            game.scene.add(directionalLight);

            // Create procedural environment
            createEnvironment();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }

        function createEnvironment() {
            const simplex = new SimplexNoise();
            const size = 2000;
            const scale = 50;
            
            // Clear existing grid
            game.grid = [];
            
            // Create ground plane
            const geometry = new THREE.PlaneGeometry(size, size, 32, 32);
            const positions = geometry.attributes.position.array;
            
            // Displace vertices with noise for terrain
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                const noise = simplex.noise2D(x / scale, y / scale);
                positions[i + 2] = noise * 20;
            }
            
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshLambertMaterial({ color: 0x0a2a3a,
                flatShading: true
            });
            
            const ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            game.scene.add(ground);
            
            // Add some random obstacles const obstacleGeom = new THREE.BoxGeometry(4, 8, 4);
            const obstacleMat = new THREE.MeshPhongMaterial({ 
                color: 0x1a3a2a,
                shininess: 30
            });
            
            for (let i = 0; i < 50; i++) {
                const x = (Math.random() - 0.5) * size * 0.9;
                const z = (Math.random() - 0.5) * size * 0.9;
                const y = simplex.noise2D(x / scale, z / scale) * 20 + 4;
                
                const obstacle = new THREE.Mesh(obstacleGeom, obstacleMat);
                obstacle.position.set(x, y, z);
                obstacle.castShadow = true;
                obstacle.receiveShadow = true;
                game.scene.add(obstacle);
            }
        }

        // Player class
        class Player {
            constructor() {
 this.geometry = new THREE.ConeGeometry(4, 12, 8);
                this.material = new THREE.MeshPhongMaterial({ 
                    color: 0x00ffff,
                    emissive: 0x0044aa,
                    shininess: 100
                });
                this.mesh = new THREE.Mesh(this.geometry, this.material);
                this.mesh.position.y = 6;
                this.mesh.castShadow = true;
                game.scene.add(this.mesh);
                
                this.velocity = new THREE.Vector3();
                this.direction = new THREE.Vector3();
                this.lastShotTime = 0;
                this.weaponCooldown = 0;
 }

 update(delta) {
                // Movement
                this.direction.z = Number(keys['w'] || keys['arrowup']) - Number(keys['s'] || keys['arrowdown']);
                this.direction.x = Number(keys['a'] || keys['arrowleft']) - Number(keys['d'] || keys['arrowright']);
                
                if (this.direction.length() > 0) {
                    this.direction.normalize();
 }
                
                this.velocity.add(this.direction.multiplyScalar(game.playerSpeed * delta));
                this.velocity.clampLength(0, game.playerSpeed);
                
                this.mesh.position.add(this.velocity);
                this.velocity.multiplyScalar(0.9); // Friction                // Keep player in bounds
                const limit = 900;
                if (this.mesh.position.x < -limit) this.mesh.position.x = -limit;
                if (this.mesh.position.x > limit) this.mesh.position.x = limit;
                if (this.mesh.position.z < -limit) this.mesh.position.z = -limit;
                if (this.mesh.position.z > limit) this.mesh.position.z = limit;
                
                // Face mouse position
                const target = new THREE.Vector3(mouse.x * 1000, 0, mouse.y * 1000);
                const angle = Math.atan2(target.z - this.mesh.position.z, target.x - this.mesh.position.x);
                this.mesh.rotation.y = angle;
                
                // Shooting if (game.playerInvincibility > 0) {
                    game.playerInvincibility -= delta;
                    this.material.emissiveIntensity = 2;
 } else {
                    this.material.emissiveIntensity = 0.5;
                }
                
                if (Math.random() < 0.5 && game.weapons.length > 0) {
                    this.shoot();
                }
            }

            shoot() {
                const now = Date.now();
                const weapon = game.weapons[game.currentWeaponIndex];
                if (now - this.lastShotTime > weapon.fireRate * (1 / game.fireRateMultiplier)) {
                    weapon.fire(this.mesh.position, this.mesh.rotation.y);
                    this.lastShotTime = now;
                }
            }

            takeDamage(amount) {
                if (game.playerInvincibility > 0) return;
                
                game.playerHealth -= amount;
                updateUI();
                
                if (game.playerHealth <= 0) {
                    game.playerHealth = 0;
                    gameOver();
                } else {
                    game.playerInvincibility = 1;
                    createDamageEffect(this.mesh.position);
                }
            }
        }

        // Weapon class
        class Weapon {
            constructor(type) {
                this.type = type;
                this.cooldown = 0;
                
                switch(type) {
                    case 'plasma':
                        this.damage = 10;
                        this.projectileSpeed = 40;
                        this.fireRate = 200;
                        this.color = 0xff00ff;
                        this.size = 0.5;
                        break;
                    case 'laser':
                        this.damage = 5;
                        this.projectileSpeed = 60;
                        this.fireRate = 100;
                        this.color = 0x00ffff;
                        this.size = 0.3;
                        break;
                    case 'spread':
                        this.damage = 8;
                        this.projectileSpeed = 30;
                        this.fireRate = 400;
                        this.color = 0xffff00;
                        this.size = 0.4;
                        this.shots = 5;
                        break;
                    case 'rocket':
                        this.damage = 30;
                        this.projectileSpeed = 20;
                        this.fireRate = 1500;
                        this.color = 0xff4400;
                        this.size = 1;
                        this.explosionRadius = 5;
                        break;
 }
            }

            fire(position, angle) {
                if (this.type === 'spread') {
                    for (let i = -2; i <= 2; i++) {
                        const spreadAngle = angle + i * 0.2;
                        const projectile = new Projectile(this, position, spreadAngle);
                        game.projectiles.push(projectile);
                    }
                } else if (this.type === 'rocket') {
                    const projectile = new RocketProjectile(this, position, angle);
                    game.projectiles.push(projectile);
                } else {
                    const projectile = new Projectile(this, position, angle);
                    game.projectiles.push(projectile);
                }
                
                // Visual effect
                createMuzzleFlash(position, angle);
            }
        }

        // Projectile class
        class Projectile {
            constructor(weapon, position, angle) {
                this.weapon = weapon;
                this.direction = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
                this.speed = weapon.projectileSpeed;
                this.damage = weapon.damage;
                this.lifetime = 2;
                this.distanceTraveled = 0;
                
                const geometry = new THREE.SphereGeometry(weapon.size, 8, 8);
                const material = new THREE.MeshBasicMaterial({ color: weapon.color,
                    emissive =0x440044,
                    transparent: true
                });
                
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(position);
                this.mesh.castShadow = true;
                game.scene.add(this.mesh);
 }

            update(delta) {
                this.mesh.position.add(this.direction.clone().multiplyScalar(this.speed * delta));
                this.distanceTraveled += this.speed * delta;
                
                if (this.distanceTraveled > 100) {
                    this.remove();
                }
                
                // Check collision with enemies
                for (let enemy of game.enemies) {
                    if (this.mesh.position.distanceTo(enemy.mesh.position) < 5) {
                        enemy.takeDamage(this.damage);
                        this.remove();
                        break;
                    }
                }
            }

            remove() {
                game.scene.remove(this.mesh);
                const index = game.projectiles.indexOf(this);
                if (index > -1) game.projectiles.splice(index, 1);
 }
        }

        // Rocket projectile with explosion
        class RocketProjectile extends Projectile {
            constructor(weapon, position, angle) {
                super(weapon, position, angle);
                this.weapon = weapon;
                this.hasExploded = false;
            }

            update(delta) {
                super.update(delta);
                
                if (!this.hasExploded && this.distanceTraveled > 50) {
                    this.explode();
                }
            }

            explode() {
                this.hasExploded = true;
                createExplosion(this.mesh.position, this.weapon.explosionRadius, this.weapon.damage);
                this.remove();
            }
        }

        // Enemy class
        class Enemy {
            constructor(level) {
                const types = ['drone', 'crawler', 'tank', 'shooter'];
                this.type = types[Math.floor(Math.random() * types.length)];
                this.level = level;
                
                // Scale stats with level
                const scale = 1 + (level - 1) * 0.2;
                this.health = Math.floor(30 * scale);
                this.maxHealth = this.health;
                this.damage = Math.floor(5 * scale);
                this.speed =1 + Math.random() * 0.5;
                this.color = this.getColorByType();
                
                // Visual representation
                const geometry = new THREE.SphereGeometry(3 + level * 0.5, 8, 8);
                const material = new THREE.MeshPhongMaterial({ 
                    color: this.color,
                    emissive: this.color,
                    shininess: 30
                });
 this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.y = 3;
                this.mesh.castShadow = true;
                game.scene.add(this.mesh);
                
                // Random position far from player
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 50;
                this.mesh.position.x = Math.cos(angle) * distance;
                this.mesh.position.z = Math.sin(angle) * distance;
                
                this.velocity = new THREE.Vector3();
                this.lastAttackTime = 0;
                this.attackCooldown = 1000;
            }

            getColorByType() {
                switch(this.type) {
                    case 'drone': return 0xff4444;
                    case 'crawler': return 0x44ff44;
                    case 'tank': return 0x4444ff;
                    case 'shooter': return 0xff44ff;
                    default: return 0xffffff;
                }
            }

            update(delta, player) {
                // Move towards player
                const direction = new THREE.Vector3().subVectors(
 player.mesh.position,
                    this.mesh.position
 ).normalize();
                this.mesh.position.add(direction.multiplyScalar(this.speed * delta));
                
                // Rotate to face player
                const angle = Math.atan2(
                    this.mesh.position.z - player.mesh.position.z,
                    this.mesh.position.x - player.mesh.position.x
                );
                this.mesh.rotation.y = angle + Math.PI / 2;
                
                // Attack if close enough
                const distance = this.mesh.position.distanceTo(player.mesh.position);
                if (distance < 8 && Date.now() - this.lastAttackTime > this.attackCooldown) {
                    player.takeDamage(this.damage);
                    this.lastAttackTime = Date.now();
 }
            }

            takeDamage(amount) {
                this.health -= amount;
                createHitEffect(this.mesh.position, this.color);
                
                if (this.health <= 0) {
                    this.die();
                }
            }

            die() {
                createDeathEffect(this.mesh.position, this.color);
                game.scene.remove(this.mesh);
                const index = game.enemies.indexOf(this);
                if (index > -1) game.enemies.splice(index, 1);
                
                game.score += 10 * game.difficulty;
                game.xp += 5;
                game.enemiesKilled++;
                updateUI();
                
                // Random pickup if (Math.random() < 0.1) {
                    createPickup(this.mesh.position);
                }
            }
        }

        // Pickup class
        class Pickup {
            constructor(type, position) {
                this.type = type;
                this.lifetime = 10;
                this.collected = false;
                
                const geometry = new THREE.OctahedronGeometry(2, 0);
                const material = new THREE.MeshBasicMaterial({ 
                    color: type === 'health' ? 0xff0000 : 0x00ff00,
                    wireframe: true
                });
                
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(position);
                this.mesh.position.y = 2;
                game.scene.add(this.mesh);
            }

            update(delta) {
                if (this.collected) return;
                
                this.lifetime -= delta;
                this.mesh.rotation.y += delta;
                this.mesh.rotation.x += delta * 0.5;
                
                // Check if player collected
                if (game.player.mesh.position.distanceTo(this.mesh.position) < 5) {
                    this.collect();
                }
                
                if (this.lifetime <= 0) {
                    this.remove();
                }
            }

            collect() {
 this.collected = true;
                game.scene.remove(this.mesh);
                
                if (this.type === 'health') {
                    game.playerHealth = Math.min(game.playerHealth + 30, game.maxHealth);
                } else if (this.type === 'xp') {
                    game.xp += 20;
                }
                
                updateUI();
            }

            remove() {
                game.scene.remove(this.mesh);
                const index = game.pickups.indexOf(this);
                if (index > -1) game.pickups.splice(index, 1);
            }
        }

        // Particle effect        function createParticles(position, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const material = new THREE.MeshBasicMaterial({ 
                    color: color,
                    transparent: true,
                    opacity: 1
                });
                
                const particle = new THREE.Mesh(geometry, material);
                particle.position.copy(position);
                particle.position.y = 2;
                
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 10,
                    Math.random() * 10,
                    (Math.random() - 0.5) * 10
                );
                
                game.particles.push({
                    mesh: particle,
                    velocity: velocity,
                    lifetime: 1.0 });
                
                game.scene.add(particle);
            }
        }

        // Visual effects
        function createHitEffect(position, color) {
            createParticles(position, color, 5);
        }

        function createDeathEffect(position, color) {
            createParticles(position, color, 20);
        }

        function createMuzzleFlash(position, angle) {
            const flashPos = position.clone().add(
 new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).multiplyScalar(2)
            );
            createParticles(flashPos, 0xffff00, 8);
        }

        function createExplosion(position, radius, damage) {
            createParticles(position, 0xff4400, 30);
            
            // Damage nearby enemies
            for (let enemy of game.enemies) {
                if (enemy.mesh.position.distanceTo(position) < radius) {
                    enemy.takeDamage(damage);
                }
            }
        }

        function createDamageEffect(position) {
            createParticles(position, 0xff0000, 15);
        }

        function createPickup(position) {
            const type = Math.random() < 0.5 ? 'health' : 'xp';
            const pickup = new Pickup(type, position);
            game.pickups.push(pickup);
        }

        // Wave management
        function startWave(waveNumber) {
            game.wave = waveNumber;
            game.enemiesPerWave = 5 + waveNumber * 2;
            game.difficulty = 1 + waveNumber * 0.1;
            
            for (let i = 0; i < game.enemiesPerWave; i++) {
                setTimeout(() => {
                    if (!game.isGameOver) {
 const enemy = new Enemy(waveNumber);
                        game.enemies.push(enemy);
                    }
                }, i * 500);
            }
        }

        // Level up system
        function checkLevelUp() {
            if (game.xp >= game.xpToNextLevel && !game.isLevelingUp) {
                game.isLevelingUp = true;
                game.playerLevel++;
                game.xp -= game.xpToNextLevel;
                game.xpToNextLevel = Math.floor(game.xpToNextLevel * 1.5);
                
                // Show level up screen
                const levelUpDisplay = document.getElementById('levelUpDisplay');
                const optionsContainer = document.getElementById('levelUpOptions');
                levelUpDisplay.style.display = 'block';
                
                // Generate3 random upgrades
                const upgrades = [
 { text: 'Increased Health', effect: () => { game.maxHealth += 20; game.playerHealth += 20; } },
                    { text: 'Faster Movement', effect: () => { game.playerSpeed += 2; } },
                    { text: 'More Damage', effect: () => { game.damageMultiplier += 0.2; } },
                    { text: 'Faster Fire Rate', effect: () => { game.fireRateMultiplier += 0.2; } },
                    { text: 'New Weapon: Plasma', effect: () => { game.weapons.push(new Weapon('plasma')); } },
                    { text: 'New Weapon: Laser', effect: () => { game.weapons.push(new Weapon('laser')); } },
                    { text: 'New Weapon: Spread', effect: () => { game.weapons.push(new Weapon('spread')); } },
                    { text: 'New Weapon: Rocket', effect: () => { game.weapons.push(new Weapon('rocket')); } },
                    { text: 'XP Boost', effect: () => { game.xpToNextLevel = Math.floor(game.xpToNextLevel * 0.8); } },
                    { text: 'Critical Strike', effect: () => { game.damageMultiplier += 1; } }
                ];
                optionsContainer.innerHTML = '';
                const selectedUpgrades = [];
                while (selectedUpgrades.length < 3) {
                    const upgrade = upgrades[Math.floor(Math.random() * upgrades.length)];
                    if (!selectedUpgrades.includes(upgrade)) {
                        selectedUpgrades.push(upgrade);
                    }
                }
                
                selectedUpgrades.forEach((upgrade, index) => {
                    const option = document.createElement('div');
                    option.className = 'levelUpOption';
                    option.textContent = upgrade.text;
                    option.onclick = () => {
                        upgrade.effect();
                        levelUpDisplay.style.display = 'none';
                        game.isLevelingUp = false;
                        updateUI();
                    };
                    optionsContainer.appendChild(option);
                });
            }
        }

        // UI updates
        function updateUI() {
            document.getElementById('healthValue').textContent = Math.ceil(game.playerHealth);
            document.getElementById('healthBarFill').style.width = `${(game.playerHealth / game.maxHealth) * 100}%`;
            document.getElementById('xpValue').textContent = game.xp;
            document.getElementById('xpToNext').textContent = game.xpToNextLevel;
            document.getElementById('xpBarFill').style.width = `${(game.xp / game.xpToNextLevel) * 100}%`;
            document.getElementById('scoreValue').textContent = game.score;
            document.getElementById('waveValue').textContent = game.wave;
            document.getElementById('playerLevel').textContent = game.playerLevel;
            document.getElementById('enemiesLeft').textContent = game.enemies.length;
        }

        // Game over
        function gameOver() {
            game.isGameOver = true;
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('finalWave').textContent = game.wave;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        // Restart game
        document.getElementById('restartButton').addEventListener('click', () => {
            document.getElementById('gameOverScreen').style.display = 'none';
            resetGame();
        });

        function resetGame() {
            // Clear scene
            game.scene.clear();
            game.enemies = [];
            game.projectiles = [];
            game.particles = [];
            game.pickups = [];
            
            // Reset game state
            game.isGameOver = false;
            game.isLevelingUp = false;
            game.score = 0;
            game.wave = 1;
            game.enemiesKilled = 0;
            game.xp = 0;
            game.xpToNextLevel = 100;
            game.playerLevel = 1;
            game.playerHealth = 100;
            game.maxHealth = 100;
            game.weapons = [new Weapon('plasma')];
            game.currentWeaponIndex = 0;
            game.difficulty = 1;
 game.playerSpeed = 10;
            game.damageMultiplier = 1;
            game.fireRateMultiplier = 1;
            game.moveMultiplier = 1;
            
            // Reinitialize player
            game.player = new Player();
            
            // Create environment again
            createEnvironment();
            
            // Start first wave
            startWave(1);
            
            // Update UI
            updateUI();
        }

        // Main game loop
        function animate() {
            if (game.isGameOver) return;
            
            const delta = game.clock.getDelta();
            
            // Update player
            game.player.update(delta);
            
            // Update enemies
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                game.enemies[i].update(delta, game.player);
            }
            
            // Update projectiles
            for (let i = game.projectiles.length - 1; i >= 0; i--) {
                game.projectiles[i].update(delta);
 }
            
            // Update particles
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const particle = game.particles[i];
                particle.mesh.position.add(particle.velocity.clone().multiplyScalar(delta));
                particle.mesh.rotation.x += delta;
                particle.mesh.rotation.y += delta;
                particle.lifetime -= delta;
                particle.mesh.material.opacity = particle.lifetime;
                
                if (particle.lifetime <= 0) {
                    game.scene.remove(particle.mesh);
                    game.particles.splice(i, 1);
                }
            }
            
            // Update pickups
            for (let i = game.pickups.length - 1; i >= 0; i--) {
                game.pickups[i].update(delta);
            }
            
            // Check for wave completion
            if (game.enemies.length === 0 && game.enemiesKilled >0) {
                game.enemiesKilled = 0;
                setTimeout(() => {
                    if (!game.isGameOver) {
                        startWave(game.wave + 1);
                        checkLevelUp();
                    }
                }, 2000);
            }
            
            // Check for level up
            checkLevelUp();
            
            // Camera follow player
            const targetCameraX = game.player.mesh.position.x;
            const targetCameraZ = game.player.mesh.position.z + 100;
            game.camera.position.x += (targetCameraX - game.camera.position.x) * 0.1;
            game.camera.position.z += (targetCameraZ - game.camera.position.z) * 0.1;
            game.camera.lookAt(game.player.mesh.position.x, 0, game.player.mesh.position.z);
            
            // Render game.renderer.render(game.scene, game.camera);
            
            requestAnimationFrame(animate);
        }

        // Initialize game function init() {
            initThree();
            game.player = new Player();
            game.weapons = [new Weapon('plasma')];
            startWave(1);
            animate();
        }

        // Start game when page loads
        window.onload = init;
 </script>
</body>
</html>
