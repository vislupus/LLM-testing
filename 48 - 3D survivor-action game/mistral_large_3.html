<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Survivor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #game-over {
            display: none;
        }
        .damage-number {
            position: absolute;
            color: #ff4444;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 5px black;
            animation: float 1s ease-out;
        }
        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body class="bg-black">
    <div id="game-container"></div>
    <div id="game-ui">
        <!-- Health Bar -->
        <div class="absolute top-4 left-4 w-64 bg-gray-800 bg-opacity-50 rounded-full p-1">
            <div id="health-bar" class="h-4 bg-red-500 rounded-full" style="width: 100%"></div>
        </div>
        <!-- XP Bar -->
        <div class="absolute bottom-4 left-4 w-64 bg-gray-800 bg-opacity-50 rounded-full p-1">
            <div id="xp-bar" class="h-4 bg-blue-500 rounded-full" style="width: 0%"></div>
        </div>
        <!-- Level -->
        <div id="level-text" class="absolute bottom-12 left-4 text-white text-lg">Level 1</div>
        <!-- Score -->
        <div id="score-text" class="absolute top-4 right-4 text-white text-lg">Score: 0</div>
        <!-- Upgrade Choices -->
        <div id="upgrade-choices" class="absolute inset-0 flex items-center justify-center space-x-8 bg-black bg-opacity-50 hidden">
            <div class="bg-gray-900 p-4 rounded-lg border-2 border-blue-500 cursor-pointer hover:bg-gray-700" onclick="chooseUpgrade(0)">
                <div class="text-white font-bold">Upgrade 1</div>
                <div class="text-gray-400">+10% Damage</div>
            </div>
            <div class="bg-gray-900 p-4 rounded-lg border-2 border-blue-500 cursor-pointer hover:bg-gray-700" onclick="chooseUpgrade(1)">
                <div class="text-white font-bold">Upgrade 2</div>
                <div class="text-gray-400">+20% Attack Speed</div>
            </div>
            <div class="bg-gray-900 p-4 rounded-lg border-2 border-blue-500 cursor-pointer hover:bg-gray-700" onclick="chooseUpgrade(2)">
                <div class="text-white font-bold">Upgrade 3</div>
                <div class="text-gray-400">+15% Movement Speed</div>
            </div>
        </div>
        <!-- Game Over -->
        <div id="game-over" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-75">
            <div class="text-white text-4xl font-bold mb-4">GAME OVER</div>
            <div id="final-score" class="text-white text-2xl mb-8">Score: 0</div>
            <button onclick="restartGame()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Restart</button>
        </div>
    </div>
    <script>
        // Game state
        const gameState = {
            health: 100,
            maxHealth: 100,
            xp: 0,
            xpToLevel: 100,
            level: 1,
            score: 0,
            enemies: [],
            projectiles: [],
            lastSpawnTime: 0,
            spawnInterval: 2000,
            gameOver: false,
            upgrades: [
                { name: "Damage +10%", effect: () => { gameState.damageMultiplier *= 1.1; } },
                { name: "Attack Speed +20%", effect: () => { gameState.attackSpeedMultiplier *= 1.2; } },
                { name: "Movement Speed +15%", effect: () => { gameState.speedMultiplier *= 1.15; } }
            ],
            damageMultiplier: 1,
            attackSpeedMultiplier: 1,
            speedMultiplier: 1,
        };

        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        scene.add(directionalLight);

        // Environment
        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a2a,
            roughness: 0.8,
            metalness: 0.2,
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Atmospheric fog
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.002);

        // Camera follows hero
        function updateCamera() {
            camera.position.x = hero.object.position.x;
            camera.position.z = hero.object.position.z + 20;
            camera.lookAt(hero.object.position);
        }

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            updateCamera();
            renderer.render(scene, camera);
        }
        animate();

        // Hero
        const hero = {
            object: new THREE.Object3D(),
            speed: 0.1 * gameState.speedMultiplier,
            attackCooldown: 1000 / gameState.attackSpeedMultiplier,
            lastAttackTime: 0,
            attackRange: 5,
            damage: 10 * gameState.damageMultiplier,
        };
        scene.add(hero.object);

        // Hero mesh (temporary capsule)
        const heroGeometry = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
        const heroMaterial = new THREE.MeshStandardMaterial({ color: 0x4488ff });
        const heroMesh = new THREE.Mesh(heroGeometry, heroMaterial);
        heroMesh.castShadow = true;
        heroMesh.position.y = 1.5;
        hero.object.add(heroMesh);

        // Movement controls
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        // Particles
        function spawnParticles(position, color) {
            const particleCount = 20;
            const particles = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;
                
                velocities[i * 3] = (Math.random() - 0.5) * 2;
                velocities[i * 3 + 1] = Math.random() * 2;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 2;
                
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }
            
            particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
            });
            
            const particleSystem = new THREE.Points(particles, particleMaterial);
            scene.add(particleSystem);
            
            // Animate particles
            const particleAnimate = () => {
                const positions = particles.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] += velocities[i * 3] * 0.1;
                    positions[i * 3 + 1] += velocities[i * 3 + 1] * 0.1;
                    positions[i * 3 + 2] += velocities[i * 3 + 2] * 0.1;
                    velocities[i * 3 + 1] -= 0.02;
                }
                particles.attributes.position.needsUpdate = true;
                
                if (positions[1] > 0) {
                    requestAnimationFrame(particleAnimate);
                } else {
                    scene.remove(particleSystem);
                }
            };
            particleAnimate();
        }

        // Hero attack
        function heroAttack() {
            const now = Date.now();
            if (now - hero.lastAttackTime < hero.attackCooldown) return;
            hero.lastAttackTime = now;

            // Find closest enemy
            let closestEnemy = null;
            let closestDistance = Infinity;
            gameState.enemies.forEach(enemy => {
                const distance = hero.object.position.distanceTo(enemy.object.position);
                if (distance < closestDistance && distance <= hero.attackRange) {
                    closestDistance = distance;
                    closestEnemy = enemy;
                }
            });

            if (closestEnemy) {
                closestEnemy.health -= hero.damage;
                spawnDamageNumber(closestEnemy.object.position, hero.damage);
                spawnParticles(closestEnemy.object.position, new THREE.Color(0xff4444));
                
                if (closestEnemy.health <= 0) {
                    gameState.enemies = gameState.enemies.filter(e => e !== closestEnemy);
                    scene.remove(closestEnemy.object);
                    spawnParticles(closestEnemy.object.position, new THREE.Color(0x44ff44));
                    gameState.xp += 10;
                    gameState.score += 100;
                    updateUI();
                }
            }
        }

        // Spawn damage number
        function spawnDamageNumber(position, damage) {
            const damageNumber = document.createElement('div');
            damageNumber.className = 'damage-number';
            damageNumber.textContent = damage;
            damageNumber.style.left = `${window.innerWidth / 2 + (position.x - camera.position.x) * 20}px`;
            damageNumber.style.top = `${window.innerHeight / 2 - (position.z - camera.position.z) * 20}px`;
            document.getElementById('game-ui').appendChild(damageNumber);
            setTimeout(() => damageNumber.remove(), 1000);
        }

        // Update UI
        function updateUI() {
            document.getElementById('health-bar').style.width = `${(gameState.health / gameState.maxHealth) * 100}%`;
            document.getElementById('xp-bar').style.width = `${(gameState.xp / gameState.xpToLevel) * 100}%`;
            document.getElementById('level-text').textContent = `Level ${gameState.level}`;
            document.getElementById('score-text').textContent = `Score: ${gameState.score}`;
            if (gameState.xp >= gameState.xpToLevel) {
                gameState.level++;
                gameState.xp = 0;
                gameState.xpToLevel = Math.floor(gameState.xpToLevel * 1.5);
                showUpgradeChoices();
            }
        }

        // Show upgrade choices
        function showUpgradeChoices() {
            document.getElementById('upgrade-choices').classList.remove('hidden');
        }

        // Choose upgrade
        function chooseUpgrade(index) {
            gameState.upgrades[index].effect();
            document.getElementById('upgrade-choices').classList.add('hidden');
            updateUI();
        }

        // Restart game
        function restartGame() {
            gameState.health = 100;
            gameState.maxHealth = 100;
            gameState.xp = 0;
            gameState.xpToLevel = 100;
            gameState.level = 1;
            gameState.score = 0;
            gameState.enemies.forEach(enemy => scene.remove(enemy.object));
            gameState.enemies = [];
            gameState.gameOver = false;
            document.getElementById('game-over').style.display = 'none';
            updateUI();
        }

        // Game loop
        function gameLoop() {
            if (gameState.gameOver) return;

            // Hero movement
            const moveDirection = new THREE.Vector3();
            if (keys.w) moveDirection.z -= 1;
            if (keys.s) moveDirection.z += 1;
            if (keys.a) moveDirection.x -= 1;
            if (keys.d) moveDirection.x += 1;
            if (moveDirection.length() > 0) {
                moveDirection.normalize().multiplyScalar(hero.speed);
                hero.object.position.add(moveDirection);
                hero.object.lookAt(
                    hero.object.position.x + moveDirection.x,
                    hero.object.position.y,
                    hero.object.position.z + moveDirection.z
                );
            }

            // Hero attack
            heroAttack();

            // Enemy types
        const enemyTypes = [
            {
                name: "Gloomling",
                color: 0x8844aa,
                health: 20,
                speed: 0.02,
                size: 0.8,
                geometry: new THREE.DodecahedronGeometry(0.8, 0),
            },
            {
                name: "Spikeback",
                color: 0x44aa88,
                health: 30,
                speed: 0.01,
                size: 1.2,
                geometry: new THREE.ConeGeometry(0.8, 1.5, 8),
            },
            {
                name: "Blightborn",
                color: 0xaa4444,
                health: 50,
                speed: 0.005,
                size: 1.5,
                geometry: new THREE.TorusKnotGeometry(0.6, 0.2, 100, 16),
            }
        ];

        // Spawn enemy
        function spawnEnemy() {
            const enemyType = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
            const enemy = {
                object: new THREE.Object3D(),
                health: enemyType.health,
                speed: enemyType.speed,
                type: enemyType.name,
            };
            
            // Enemy mesh
            const enemyMaterial = new THREE.MeshStandardMaterial({ color: enemyType.color });
            const enemyMesh = new THREE.Mesh(enemyType.geometry, enemyMaterial);
            enemyMesh.castShadow = true;
            enemyMesh.position.y = enemyType.size / 2;
            enemy.object.add(enemyMesh);
            
            // Spawn at random position
            const angle = Math.random() * Math.PI * 2;
            const distance = 30 + Math.random() * 20;
            enemy.object.position.set(
                hero.object.position.x + Math.cos(angle) * distance,
                0,
                hero.object.position.z + Math.sin(angle) * distance
            );
            
            scene.add(enemy.object);
            gameState.enemies.push(enemy);
        }

            // Enemy behavior
            gameState.enemies.forEach(enemy => {
                const direction = hero.object.position.clone().sub(enemy.object.position).normalize();
                enemy.object.position.add(direction.multiplyScalar(enemy.speed));
                enemy.object.lookAt(hero.object.position);
                
                // Check collision
                if (hero.object.position.distanceTo(enemy.object.position) < 1.5) {
                    gameState.health -= 1;
                    updateUI();
                    if (gameState.health <= 0) {
                        gameState.gameOver = true;
                        document.getElementById('final-score').textContent = `Score: ${gameState.score}`;
                        document.getElementById('game-over').style.display = 'flex';
                    }
                }
            });

            updateCamera();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        updateUI();
        gameLoop();
    </script>
</body>
</html>
