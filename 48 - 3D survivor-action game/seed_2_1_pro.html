<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILDFORGE: Rift Warden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0618; font-family: 'Courier New', monospace; color: #e8e4ff; user-select: none; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  /* Start Screen */
  #startScreen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(30,15,60,0.95) 0%, rgba(5,2,15,0.98) 70%);
    pointer-events: all; z-index: 100;
  }
  #startScreen h1 {
    font-size: clamp(40px, 8vw, 90px);
    font-weight: 900; letter-spacing: 8px;
    background: linear-gradient(90deg, #ff7b3d, #ffdb4d, #4ddbff, #b84dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(255,180,80,0.5);
    margin-bottom: 10px;
    animation: glow 3s ease-in-out infinite alternate;
  }
  #startScreen h2 {
    font-size: clamp(14px, 2vw, 22px); letter-spacing: 4px; color: #9b8aff;
    margin-bottom: 40px; font-weight: 300;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 10px #ff7b3d); }
    to { filter: drop-shadow(0 0 30px #b84dff); }
  }
  .btn {
    pointer-events: all; cursor: pointer;
    padding: 16px 48px; font-size: 20px; letter-spacing: 3px;
    background: linear-gradient(135deg, #ff7b3d 0%, #ff4d94 100%);
    border: none; color: white; font-weight: bold;
    border-radius: 6px; font-family: inherit;
    box-shadow: 0 6px 30px rgba(255,80,120,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    margin: 8px;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 40px rgba(255,80,120,0.7); }
  .btn.secondary { background: linear-gradient(135deg, #4d6bff 0%, #9b4dff 100%); box-shadow: 0 6px 30px rgba(100,80,255,0.5); }
  .controls {
    margin-top: 30px; color: #b8a8ff; font-size: 14px; line-height: 1.8;
    text-align: center; letter-spacing: 1px;
  }
  .controls span { color: #ffdb4d; font-weight: bold; }

  /* HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .bar-container {
    position: absolute; background: rgba(10,5,30,0.7);
    border: 2px solid rgba(180,150,255,0.4); border-radius: 8px;
    padding: 4px; backdrop-filter: blur(8px);
  }
  #healthBarWrap { top: 20px; left: 20px; width: 280px; height: 28px; }
  #xpBarWrap { bottom: 20px; left: 50%; transform: translateX(-50%); width: min(600px, 70vw); height: 20px; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.2s ease-out; position: relative; overflow: hidden; }
  #healthBar { background: linear-gradient(90deg, #ff3d5f, #ff7b3d); width: 100%; box-shadow: 0 0 15px rgba(255,80,100,0.6) inset; }
  #xpBar { background: linear-gradient(90deg, #4dffb8, #4ddbff, #b84dff); width: 0%; box-shadow: 0 0 15px rgba(100,220,255,0.6) inset; }
  .bar-fill::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shine 2s infinite;
  }
  @keyframes shine { to { left: 100%; } }

  #levelIndicator {
    position: absolute; top: 58px; left: 20px; font-size: 22px; font-weight: bold;
    color: #ffdb4d; text-shadow: 0 0 10px rgba(255,220,80,0.8); letter-spacing: 2px;
  }
  #timer {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 28px; font-weight: bold; color: #e8e4ff;
    text-shadow: 0 0 15px rgba(180,150,255,0.8); letter-spacing: 3px;
  }
  #score {
    position: absolute; top: 20px; right: 20px; font-size: 22px; font-weight: bold;
    color: #4dffb8; text-shadow: 0 0 10px rgba(80,255,180,0.7); letter-spacing: 2px;
  }
  #weaponList {
    position: absolute; top: 60px; right: 20px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
  }
  .weapon-icon {
    background: rgba(10,5,30,0.7); border: 2px solid rgba(180,150,255,0.4);
    padding: 6px 12px; border-radius: 6px; font-size: 13px; letter-spacing: 1px;
    color: #e8e4ff; display: flex; align-items: center; gap: 8px;
  }
  .weapon-icon .lvl { color: #ffdb4d; font-weight: bold; }
  #waveAlert {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
    font-size: 50px; font-weight: 900; letter-spacing: 6px;
    color: #ff3d5f; text-shadow: 0 0 30px rgba(255,60,90,0.9);
    opacity: 0; pointer-events: none;
  }
  #bossHealth {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    width: min(500px, 60vw); height: 16px; background: rgba(10,5,30,0.8);
    border: 2px solid #ff3d5f; border-radius: 6px; padding: 2px; display: none;
  }
  #bossHealthFill { height: 100%; background: linear-gradient(90deg, #ff3d5f, #ff7b3d); width: 100%; border-radius: 3px; transition: width 0.2s; }
  #bossName { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); color: #ff3d5f; font-size: 18px; letter-spacing: 3px; font-weight: bold; display: none; text-shadow: 0 0 10px rgba(255,60,90,0.8); }

  /* Level Up Screen */
  #levelUp {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(40,20,80,0.85), rgba(5,2,20,0.95));
    z-index: 50; pointer-events: all; flex-direction: column;
  }
  #levelUp h2 {
    font-size: 42px; letter-spacing: 6px; color: #ffdb4d; margin-bottom: 30px;
    text-shadow: 0 0 30px rgba(255,220,80,0.9);
  }
  .upgrade-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 1000px; padding: 0 20px; }
  .upgrade-card {
    width: 240px; padding: 24px 20px; background: linear-gradient(180deg, rgba(60,40,120,0.9), rgba(30,15,60,0.9));
    border: 2px solid rgba(180,150,255,0.5); border-radius: 12px; cursor: pointer;
    transition: all 0.2s; pointer-events: all; text-align: center;
  }
  .upgrade-card:hover { transform: translateY(-6px) scale(1.03); border-color: #ffdb4d; box-shadow: 0 10px 40px rgba(255,220,80,0.4); }
  .upgrade-icon { font-size: 40px; margin-bottom: 12px; }
  .upgrade-name { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 8px; letter-spacing: 1px; }
  .upgrade-desc { font-size: 13px; color: #b8a8ff; line-height: 1.4; }
  .upgrade-level { font-size: 11px; color: #ffdb4d; margin-top: 8px; letter-spacing: 2px; }

  /* Game Over */
  #gameOver {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(60,10,20,0.9), rgba(5,2,10,0.98));
    z-index: 50; pointer-events: all; flex-direction: column;
  }
  #gameOver h2 { font-size: 60px; letter-spacing: 8px; color: #ff3d5f; text-shadow: 0 0 30px rgba(255,60,90,0.8); margin-bottom: 20px; }
  #gameOver .stat { font-size: 22px; color: #e8e4ff; margin: 6px; letter-spacing: 2px; }
  #gameOver .stat span { color: #ffdb4d; font-weight: bold; }

  /* Damage numbers container */
  #dmgNums { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .dmg-num {
    position: absolute; font-weight: bold; font-size: 18px;
    text-shadow: 0 0 8px currentColor, 0 2px 4px #000;
    pointer-events: none; font-family: 'Courier New', monospace;
    animation: floatUp 0.8s ease-out forwards;
  }
  @keyframes floatUp {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    20% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
  }

  .pickup-text {
    position: absolute; font-size: 16px; font-weight: bold; color: #4dffb8;
    text-shadow: 0 0 10px #4dffb8; pointer-events: none;
    animation: floatUp 1s ease-out forwards;
  }

  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
    transform: translate(-50%, -50%); pointer-events: none;
  }
</style>

<div id="game"></div>
<div id="ui">
  <div id="startScreen">
    <h1>WILDFORGE</h1>
    <h2>RIFT WARDEN</h2>
    <button class="btn" id="startBtn">BEGIN THE RIFT</button>
    <div class="controls">
      <div>MOVE: <span>W A S D</span> / ARROWS</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   AUDIO SYSTEM (procedural, no external files)
   ============================================================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let masterGain;
function initAudio() {
  if (masterGain) return;
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}
function playTone(freq, dur=0.1, type='sine', vol=0.2, sweep=0) {
  if (!masterGain) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  if (sweep) osc.frequency.exponentialRampToValueAtTime(freq + sweep, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function playNoise(dur=0.15, vol=0.2, filterFreq=800) {
  if (!masterGain) return;
  const bufSize = audioCtx.sampleRate * dur;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0; i<bufSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = filterFreq;
  const gain = audioCtx.createGain(); gain.gain.value = vol;
  src.connect(filter); filter.connect(gain); gain.connect(masterGain);
  src.start();
}
const sfx = {
  hit: () => playTone(220, 0.08, 'square', 0.15, -100),
  shoot: () => playTone(600, 0.06, 'sawtooth', 0.08, -200),
  kill: () => { playNoise(0.12, 0.15, 400); playTone(120, 0.2, 'triangle', 0.1, -60); },
  pickup: () => playTone(880, 0.08, 'sine', 0.1, 400),
  levelup: () => { playTone(523, 0.1, 'sine', 0.2); setTimeout(()=>playTone(659, 0.1, 'sine', 0.2), 80); setTimeout(()=>playTone(784, 0.2, 'sine', 0.2), 160); },
  playerHit: () => { playNoise(0.15, 0.25, 200); playTone(100, 0.2, 'sawtooth', 0.15, -30); },
  boss: () => { playTone(60, 0.8, 'sawtooth', 0.3); playNoise(0.5, 0.15, 100); },
  wave: () => { playTone(200, 0.3, 'square', 0.15); setTimeout(()=>playTone(300, 0.3, 'square', 0.15), 150); },
  upgrade: () => playTone(1000, 0.15, 'triangle', 0.2, 400),
  heal: () => playTone(700, 0.2, 'sine', 0.15, 300),
};

/* ============================================================
   GAME STATE
   ============================================================ */
const state = {
  running: false, paused: false,
  time: 0, kills: 0, score: 0,
  player: null, enemies: [], projectiles: [], pickups: [], particles: [], damageNums: [],
  wave: 0, waveTimer: 0, spawnTimer: 0,
  bossActive: false, boss: null, nextBossTime: 60,
  keys: {}, cameraOffset: new THREE.Vector3(0, 18, 22),
  ground: null, crystals: [],
};

const ENEMY_TYPES = {
  mite: { hp: 8, dmg: 6, speed: 6.5, radius: 0.4, color: 0xff4d94, emissive: 0xff1166, score: 5, xp: 1, scale: 0.6 },
  runner: { hp: 14, dmg: 10, speed: 5, radius: 0.5, color: 0xff7b3d, emissive: 0xff4411, score: 10, xp: 2, scale: 0.8 },
  brute: { hp: 45, dmg: 18, speed: 2.8, radius: 0.9, color: 0xb84dff, emissive: 0x6622aa, score: 25, xp: 4, scale: 1.3 },
  shrieker: { hp: 20, dmg: 0, speed: 4, radius: 0.5, color: 0x4ddbff, emissive: 0x1188cc, score: 15, xp: 3, scale: 0.9, ranged: true },
  titan: { hp: 800, dmg: 35, speed: 2.2, radius: 2.2, color: 0xff3d5f, emissive: 0xaa0022, score: 500, xp: 50, scale: 3, boss: true },
};

/* ============================================================
   WEAPONS / UPGRADES
   ============================================================ */
const weaponDefs = {
  orbiters: {
    name: 'GEO SHARDS', icon: '✦',
    desc: 'Orbiting crystal shards damage enemies on contact.',
    maxLevel: 8,
    stats: (lv) => ({ count: Math.min(2 + lv, 10), dmg: 10 + lv * 6, radius: 2.2 + lv * 0.25, rotSpeed: 2 + lv * 0.3 }),
  },
  bolts: {
    name: 'RIFT BOLTS', icon: '➤',
    desc: 'Rapidly fires homing bolts at nearest enemies.',
    maxLevel: 8,
    stats: (lv) => ({ dmg: 14 + lv * 7, rate: 0.5 - lv * 0.04, speed: 30 + lv * 3, count: 1 + Math.floor(lv / 2) }),
  },
  nova: {
    name: 'PULSE NOVA', icon: '◉',
    desc: 'Periodic shockwave damages all nearby enemies.',
    maxLevel: 6,
    stats: (lv) => ({ dmg: 20 + lv * 12, radius: 5 + lv * 0.8, cooldown: 3.5 - lv * 0.3 }),
  },
  thorns: {
    name: 'THORN AURA', icon: '✺',
    desc: 'Enemies that touch you take damage and are slowed.',
    maxLevel: 6,
    stats: (lv) => ({ dmg: 4 + lv * 3, interval: 0.4, slow: 0.3 + lv * 0.05 }),
  },
  chain: {
    name: 'ARCANE CHAIN', icon: '⚡',
    desc: 'Lightning chains between nearby enemies.',
    maxLevel: 6,
    stats: (lv) => ({ dmg: 18 + lv * 10, chains: 2 + lv, cooldown: 1.2 - lv * 0.1, range: 12 + lv * 1.5 }),
  },
};
const passiveDefs = {
  maxhp: { name: 'VITALITY', icon: '❤', desc: '+25 Max Health', maxLevel: 10, apply: (p, lv) => { p.maxHp += 25; p.hp += 25; } },
  speed: { name: 'SWIFTNESS', icon: '»', desc: '+12% Movement Speed', maxLevel: 8, apply: (p, lv) => { p.speedMult *= 1.12; } },
  regen: { name: 'REGEN', icon: '✚', desc: '+1 Health Regen/sec', maxLevel: 6, apply: (p, lv) => { p.regen += 1; } },
  magnet: { name: 'MAGNET', icon: '◈', desc: '+40% Pickup Radius', maxLevel: 8, apply: (p, lv) => { p.magnetMult *= 1.4; } },
  dmg: { name: 'FEROCITY', icon: '✸', desc: '+15% Damage', maxLevel: 10, apply: (p, lv) => { p.dmgMult *= 1.15; } },
  armor: { name: 'FORTITUDE', icon: '◆', desc: '-8% Damage Taken', maxLevel: 6, apply: (p, lv) => { p.dmgReduce *= 0.92; } },
};

/* ============================================================
   THREE.JS SETUP
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0618);
scene.fog = new THREE.FogExp2(0x1a0d3a, 0.018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('game').appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0x554488, 0.5);
scene.add(ambient);

const moonLight = new THREE.DirectionalLight(0x99aaff, 0.8);
moonLight.position.set(20, 40, 15);
moonLight.castShadow = true;
moonLight.shadow.mapSize.width = 2048;
moonLight.shadow.mapSize.height = 2048;
moonLight.shadow.camera.left = -60; moonLight.shadow.camera.right = 60;
moonLight.shadow.camera.top = 60; moonLight.shadow.camera.bottom = -60;
moonLight.shadow.camera.near = 0.5; moonLight.shadow.camera.far = 120;
moonLight.shadow.bias = -0.0005;
scene.add(moonLight);

const rimLight = new THREE.DirectionalLight(0xff6699, 0.4);
rimLight.position.set(-20, 15, -15);
scene.add(rimLight);

/* ============================================================
   PROCEDURAL TEXTURES / HELPERS
   ============================================================ */
function makeNoiseTexture(size = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i=0; i<size*size; i++) {
    const v = Math.random()*255;
    img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const noiseTex = makeNoiseTexture(128);

function createGround() {
  // Procedural heightmap-ish ground with geometric tiles
  const size = 200, seg = 80;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  for (let i=0; i<pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const dist = Math.sqrt(x*x + z*z);
    let y = 0;
    y += Math.sin(x*0.15)*0.3 + Math.cos(z*0.12)*0.3;
    y += Math.sin(x*0.4 + z*0.3)*0.15;
    y += (Math.random()-0.5)*0.08;
    pos.setY(i, y);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color: 0x2a1f52,
    roughness: 0.9, metalness: 0.0,
    flatShading: true,
    map: noiseTex
  });
  mat.map.repeat.set(40, 40);
  const ground = new THREE.Mesh(geo, mat);
  ground.receiveShadow = true;
  scene.add(ground);

  // Add scattered stylized rocks/pebbles
  const rockGeo = new THREE.DodecahedronGeometry(1, 0);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x3a2d6e, roughness: 0.8, flatShading: true });
  const rockCount = 120;
  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, rockCount);
  rocks.castShadow = true; rocks.receiveShadow = true;
  const dummy = new THREE.Object3D();
  for (let i=0; i<rockCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 15 + Math.random() * 80;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    const s = 0.3 + Math.random() * 1.2;
    dummy.position.set(x, s*0.3, z);
    dummy.rotation.set(Math.random(), Math.random(), Math.random());
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
  }
  scene.add(rocks);

  // Add giant glowing crystal formations (static scenery)
  for (let i=0; i<40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 25 + Math.random() * 70;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    createSceneryCrystal(x, z);
  }

  return ground;
}

function createSceneryCrystal(x, z) {
  const colors = [0x4ddbff, 0xb84dff, 0xff7b3d, 0x4dffb8, 0xff4d94];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const group = new THREE.Group();
  const h = 2 + Math.random() * 5;
  const geo = new THREE.ConeGeometry(0.8 + Math.random() * 0.6, h, 5 + Math.floor(Math.random()*3));
  const mat = new THREE.MeshStandardMaterial({
    color: color, emissive: color, emissiveIntensity: 0.6,
    roughness: 0.2, metalness: 0.5, flatShading: true
  });
  const cryst = new THREE.Mesh(geo, mat);
  cryst.castShadow = true;
  cryst.position.y = h/2;
  cryst.rotation.z = (Math.random()-0.5)*0.4;
  cryst.rotation.x = (Math.random()-0.5)*0.4;
  group.add(cryst);
  // sometimes small cluster
  if (Math.random() < 0.5) {
    const h2 = 1 + Math.random() * 2;
    const g2 = new THREE.Mesh(new THREE.ConeGeometry(0.5, h2, 5), mat);
    g2.position.set(1, h2/2, 0.5);
    g2.rotation.z = -0.3;
    group.add(g2);
  }
  group.position.set(x, 0, z);
  group.userData.baseY = 0;
  group.userData.phase = Math.random() * Math.PI * 2;
  scene.add(group);
  state.crystals.push(group);

  // point light for big crystals
  if (h > 4) {
    const pl = new THREE.PointLight(color, 0.8, 12, 2);
    pl.position.set(x, h*0.5, z);
    scene.add(pl);
  }
}

function buildOrbiters(p) {
  // clear existing
  p.orbiters.forEach(o => p.orbiterGroup.remove(o.mesh));
  p.orbiters = [];
  const stats = weaponDefs.orbiters.stats(p.weapons.orbiters.level);
  const shardGeo = new THREE.OctahedronGeometry(0.35, 0);
  const shardMat = new THREE.MeshStandardMaterial({ color: 0x4ddbff, emissive: 0x22aadd, emissiveIntensity: 1.0, roughness: 0.1, metalness: 0.8, flatShading: true });
  for (let i=0; i<stats.count; i++) {
    const mesh = new THREE.Mesh(shardGeo, shardMat);
    mesh.castShadow = true;
    p.orbiterGroup.add(mesh);
    p.orbiters.push({ mesh, angle: (i / stats.count) * Math.PI * 2 });
  }
}

   ENEMIES

const enemyGeometries = {};
const enemyMaterials = {};
const enemyMeshes = {}; // active enemies will be individual meshes for simplicity; up to ~200 is fine

function makeEnemyMesh(type) {
  const def = ENEMY_TYPES[type];
  let mesh;
  if (type === 'mite') {
    // Small spiky bug: tetrahedron body with small spikes
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.TetrahedronGeometry(0.5, 0), new THREE.MeshStandardMaterial({ color: def.color, emissive: def.emissive, emissiveIntensity: 0.5, roughness: 0.4, flatShading: true }));
    body.castShadow = true;
    g.add(body);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 });
    for (let s of [-1, 1]) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.08, 4, 4), eyeMat);
      e.position.set(s*0.2, 0.15, 0.3);
      g.add(e);
    }
    mesh = g;
  } else if (type === 'runner') {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 5), new THREE.MeshStandardMaterial({ color: def.color, emissive: def.emissive, emissiveIntensity: 0.4, roughness: 0.3, metalness: 0.5, flatShading: true }));
    body.castShadow = true;
    body.rotation.x = Math.PI/2;
    g.add(body);
    const tip = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 0), new THREE.MeshStandardMaterial({ color: 0xffdb4d, emissive: 0xffaa22, emissiveIntensity: 1, flatShading: true }));
    tip.position.z = 0.6;
    g.add(tip);
    mesh = g;
  } else if (type === 'brute') {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9, 0), new THREE.MeshStandardMaterial({ color: def.color, emissive: def.emissive, emissiveIntensity: 0.5, roughness: 0.5, metalness: 0.4, flatShading: true }));
    body.castShadow = true;
    g.add(body);
    // Horns
    const hornMat = new THREE.MeshStandardMaterial({ color: 0x220033, flatShading: true });
    for (let s of [-1, 1]) {
      const h = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.7, 4), hornMat);
      h.position.set(s*0.5, 0.7, 0.2);
      h.rotation.z = s*0.3;
      g.add(h);
    }
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), eyeMat);
    eye.position.set(0, 0.2, 0.8);
    g.add(eye);
    mesh = g;
  } else if (type === 'shrieker') {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.OctahedronGeometry(0.55, 0), new THREE.MeshStandardMaterial({ color: def.color, emissive: def.emissive, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.6, flatShading: true }));
    body.castShadow = true;
    g.add(body);
    // Tentacles
    const tenMat = new THREE.MeshStandardMaterial({ color: def.color, emissive: def.emissive, emissiveIntensity: 0.4, flatShading: true });
    for (let i=0; i<4; i++) {
      const t = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.7, 4), tenMat);
      const a = (i/4) * Math.PI * 2;
      t.position.set(Math.cos(a)*0.4, -0.2, Math.sin(a)*0.4);
      t.rotation.x = Math.PI - 0.3;
      t.rotation.z = a;
      g.add(t);
    }
    mesh = g;
  } else if (type === 'titan') {
    const g = new THREE.Group();
    // Boss - giant crystalline monster
    const bodyMat = new THREE.MeshStandardMaterial({ color: def.color, emissive: def.emissive, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.6, flatShading: true });
    const coreMat = new THREE.MeshStandardMaterial({ color: 0xffdb4d, emissive: 0xff6600, emissiveIntensity: 2, flatShading: true });
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 0), bodyMat);
    body.position.y = 2.5;
    body.castShadow = true;
    g.add(body);
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 0), coreMat);
    core.position.y = 2.5;
    g.add(core);
    // Four big crystal arms
    for (let i=0; i<4; i++) {
      const a = (i/4) * Math.PI * 2;
      const arm = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2, 5), bodyMat);
      arm.position.set(Math.cos(a)*1.8, 2.5, Math.sin(a)*1.8);
      arm.rotation.z = -Math.PI/2;
      arm.rotation.y = -a;
      g.add(arm);
      const tip = new THREE.Mesh(new THREE.OctahedronGeometry(0.4, 0), coreMat);
      tip.position.set(Math.cos(a)*3, 2.5, Math.sin(a)*3);
      g.add(tip);
    }
    // Head spike crown
    for (let i=0; i<6; i++) {
      const a = (i/6)*Math.PI*2;
      const sp = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1, 4), bodyMat);
      sp.position.set(Math.cos(a)*1.2, 4.2, Math.sin(a)*1.2);
      sp.rotation.z = (Math.cos(a) > 0 ? 0.3 : -0.3);
      sp.rotation.x = (Math.sin(a) > 0 ? 0.3 : -0.3);
      g.add(sp);
    }
    // Boss light
    const bl = new THREE.PointLight(0xff3d5f, 3, 20, 2);
    bl.position.y = 2.5;
    g.add(bl);
    mesh = g;
  }
  mesh.userData = { type };
  return mesh;
}

function spawnEnemy(type, pos) {
  const def = ENEMY_TYPES[type];
  const mesh = makeEnemyMesh(type);
  mesh.scale.setScalar(def.scale);
  mesh.position.copy(pos);
  scene.add(mesh);
  const enemy = {
    mesh, type, def,
    hp: def.hp, maxHp: def.hp,
    dmg: def.dmg, speed: def.speed,
    pos: mesh.position,
    vel: new THREE.Vector3(),
    hitFlash: 0,
    slowTimer: 0, slowAmt: 0,
    stunTimer: 0,
    knockback: new THREE.Vector3(),
    attackCd: 0,
    rangedCd: 1 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
    alive: true,
  };
  state.enemies.push(enemy);
  return enemy;
}

function spawnEnemyAtRadius(type, radius = 40) {
  const a = Math.random() * Math.PI * 2;
  const x = state.player.pos.x + Math.cos(a) * radius;
  const z = state.player.pos.z + Math.sin(a) * radius;
  // Keep within playable area
  const d = Math.hypot(x, z);
  if (d > 90) { x *= 90/d; z *= 90/d; }
  spawnEnemy(type, new THREE.Vector3(x, 0, z));
}

/* ============================================================
   PARTICLES
   ============================================================ */
function spawnParticles(pos, color, count=8, speed=6, size=0.2, life=0.6, gravity=false) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const vels = [];
  for (let i=0; i<count; i++) {
    positions[i*3] = pos.x; positions[i*3+1] = pos.y; positions[i*3+2] = pos.z;
    const a = Math.random() * Math.PI * 2;
    const sy = Math.random() * 0.8 + 0.2;
    const sp = speed * (0.5 + Math.random()*0.8);
    vels.push(new THREE.Vector3(Math.cos(a)*sp*Math.sqrt(1-sy*sy), sy*sp, Math.sin(a)*sp*Math.sqrt(1-sy*sy)));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: color, size: size, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  state.particles.push({ points, vels, life, maxLife: life, gravity });
}

function spawnHitBurst(pos, color) {
  spawnParticles(pos, color, 6, 5, 0.2, 0.3);
}
function spawnDeathBurst(pos, color) {
  spawnParticles(pos, color, 16, 8, 0.3, 0.6);
  spawnParticles(pos, 0xffffff, 6, 10, 0.2, 0.3);
}

function createXPShape(color) {

function spawnPickup(pos, type='xp', value=1) {
  let mesh, color;
  if (type === 'xp') {
    const colors = [0x4dffb8, 0x4ddbff, 0xb84dff];
    color = colors[Math.min(Math.floor(value/3), 2)];
    mesh = createXPShape(color);
    mesh.scale.setScalar(0.6 + Math.min(value, 10)*0.08);
  } else if (type === 'heart') {
    const g = new THREE.Group();
    const m = new THREE.MeshStandardMaterial({ color: 0xff3d5f, emissive: 0xff1133, emissiveIntensity: 1.2, flatShading: true });
    const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 6), m);
    s1.position.x = -0.18; s1.position.y = 0.1;
    const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 6), m);
    s2.position.x = 0.18; s2.position.y = 0.1;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.5, 4), m);
    cone.position.y = -0.1; cone.rotation.x = Math.PI;
    g.add(s1); g.add(s2); g.add(cone);
    g.scale.setScalar(0.6);
    mesh = g;

  mesh.position.y = 0.5;

function spawnLightningChain(startPos, dmg, chains, range) {
  let current = startPos.clone();
  const hitSet = new Set();
  let targets = [];
  for (let c=0; c<chains; c++) {
    // find nearest unhit enemy within range
    let best = null, bestDist = range;
    for (const e of state.enemies) {
      if (!e.alive || hitSet.has(e)) continue;
      const d = e.pos.distanceTo(current);
      if (d < bestDist) { bestDist = d; best = e; }
    }
    if (!best) break;
    hitSet.add(best);
    targets.push(best);
    // draw lightning bolt
    createLightningBolt(current, best.pos, 0x4ddbff);
    damageEnemy(best, dmg, new THREE.Vector3(), true);
    current = best.pos.clone();
  }
  if (targets.length > 0) playTone(400, 0.2, 'sawtooth', 0.2, 200);
}

function createLightningBolt(from, to, color) {
  const points = [];
  const steps = 8;
  for (let i=0; i<=steps; i++) {
    const t = i/steps;
    const p = new THREE.Vector3().lerpVectors(from, to, t);
    if (i > 0 && i < steps) {
      p.x += (Math.random()-0.5) * 0.8;
      p.y += (Math.random()-0.5) * 0.8;
      p.z += (Math.random()-0.5) * 0.8;
    }
    points.push(p);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, linewidth: 2 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  state.particles.push({ line, life: 0.2, maxLife: 0.2 });
}

/* ============================================================
   DAMAGE / COMBAT
   ============================================================ */
function damageEnemy(enemy, dmg, kb, crit=false) {
  if (!enemy.alive) return;
  enemy.hp -= dmg;
  enemy.hitFlash = 0.1;
  if (kb) enemy.knockback.add(kb);
  // damage number
  showDamageNumber(enemy.pos, Math.round(dmg), crit ? 0xffdb4d : 0xffffff);
  spawnHitBurst(enemy.pos, enemy.def.color);
  sfx.hit();
  if (enemy.hp <= 0) killEnemy(enemy);
}

function killEnemy(enemy) {
  enemy.alive = false;
  spawnDeathBurst(enemy.pos, enemy.def.color);
  sfx.kill();
  state.kills++;
  state.score += enemy.def.score;
  // drop xp
  const xpVal = enemy.def.xp;
  spawnPickup(enemy.pos.clone().add(new THREE.Vector3((Math.random()-0.5), 0, (Math.random()-0.5))), 'xp', xpVal);
  // chance to drop heart
  if (Math.random() < (enemy.def.boss ? 1 : 0.015)) {
    spawnPickup(enemy.pos.clone().add(new THREE.Vector3(1, 0, 0)), 'heart');
  }
  // Boss loot: lots of xp
  if (enemy.def.boss) {
    for (let i=0; i<20; i++) {
      const a = (i/20)*Math.PI*2;
      spawnPickup(enemy.pos.clone().add(new THREE.Vector3(Math.cos(a)*2, 0, Math.sin(a)*2)), 'xp', 5);
    }
    state.bossActive = false;
    state.boss = null;
    document.getElementById('bossHealth').style.display = 'none';
    document.getElementById('bossName').style.display = 'none';
    showWaveAlert('TITAN VANQUISHED!', 0x4dffb8);
  }
  scene.remove(enemy.mesh);
}

function damagePlayer(dmg) {
  if (state.player.invulnTimer > 0) return;
  const actual = dmg * state.player.dmgReduce;
  state.player.hp -= actual;
  state.player.invulnTimer = 0.6;
  sfx.playerHit();
  showDamageNumber(state.player.pos, Math.round(actual), 0xff3d5f);
  // screen shake
  screenShake(0.3);
  if (state.player.hp <= 0) {
    state.player.hp = 0;
    gameOver();
  }
}

let shakeAmt = 0;
function screenShake(amt) { shakeAmt = Math.max(shakeAmt, amt); }

/* ============================================================
   UI HELPERS
   ============================================================ */
function showDamageNumber(pos, value, color) {
  const v = state.camera.position;
  const dir = new THREE.Vector3().subVectors(pos, v).normalize();
  const screenPos = pos.clone().add(dir.multiplyScalar(-0.5));
  screenPos.project(camera);
  const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;

  const el = document.createElement('div');
  el.className = 'dmg-num';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = '#' + new THREE.Color(color).getHexString();
  el.textContent = value;
  document.getElementById('dmgNums').appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function showWaveAlert(text, color=0xff3d5f) {
  const el = document.getElementById('waveAlert');
  el.textContent = text;
  el.style.color = '#' + new THREE.Color(color).getHexString();
  el.style.textShadow = `0 0 30px ${el.style.color}`;
  el.style.transition = 'none';
  el.style.opacity = 1;
  setTimeout(() => {
    el.style.transition = 'opacity 1s';
    el.style.opacity = 0;
  }, 1500);
}

function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

/* ============================================================
   WAVE / SPAWN LOGIC
   ============================================================ */
function updateWaves(dt) {
  state.waveTimer += dt;
  state.spawnTimer += dt;

  const time = state.time;
  // Boss every 60s
  if (!state.bossActive && time >= state.nextBossTime) {
    spawnBoss();
    state.nextBossTime += 60;
  }

  // Spawn rate scales with time
  const spawnInterval = Math.max(0.25, 1.5 - time * 0.012);
  const pMite = Math.max(0.2, 0.7 - time * 0.003);
  const pRunner = 0.2 + Math.min(0.3, time * 0.003);
  const pBrute = Math.min(0.25, time * 0.004);
  const pShrieker = Math.min(0.2, Math.max(0, (time - 20)) * 0.004);

  if (!state.bossActive && state.spawnTimer >= spawnInterval) {
    state.spawnTimer = 0;
    const count = 1 + Math.floor(time / 40);
    for (let i=0; i<count; i++) {
      const r = Math.random();
      let type;
      if (r < pMite) type = 'mite';
      else if (r < pMite + pRunner) type = 'runner';
      else if (r < pMite + pRunner + pBrute) type = 'brute';
      else if (r < pMite + pRunner + pBrute + pShrieker) type = 'shrieker';
      else type = 'mite';
      spawnEnemyAtRadius(type, 38 + Math.random()*8);
    }
  }
}

function spawnBoss() {
  const a = Math.random() * Math.PI * 2;
  const x = state.player.pos.x + Math.cos(a) * 35;
  const z = state.player.pos.z + Math.sin(a) * 35;
  const boss = spawnEnemy('titan', new THREE.Vector3(x, 0, z));
  // Boss scales with time
  const scale = 1 + state.time / 120;
  boss.maxHp = Math.floor(ENEMY_TYPES.titan.hp * scale);
  boss.hp = boss.maxHp;
  state.bossActive = true;
  state.boss = boss;
  document.getElementById('bossHealth').style.display = 'block';
  document.getElementById('bossName').style.display = 'block';
  document.getElementById('bossName').textContent = '✦ RIFT TITAN ✦';
  sfx.boss();
  showWaveAlert('RIFT TITAN AWAKENS', 0xff3d5f);
  screenShake(1);
}

/* ============================================================
   LEVELING / UPGRADES
   ============================================================ */
function grantXP(amount) {
  const p = state.player;
  p.xp += amount;
  p.totalXp += amount;
  while (p.xp >= p.xpNext) {
    p.xp -= p.xpNext;
    p.level++;
    p.xpNext = Math.floor(5 + p.level * 3 + Math.pow(p.level, 1.4));
    showLevelUp();
  }
}

function showLevelUp() {
  state.paused = true;
  sfx.levelup();
  const el = document.getElementById('levelUp');
  el.style.display = 'flex';
  const grid = document.getElementById('upgradeGrid');
  grid.innerHTML = '';

  // pick 3 random upgrades (weighted toward what player doesn't have)
  const pool = [];
  Object.keys(weaponDefs).forEach(k => {
    if (state.player.weapons[k].level < weaponDefs[k].maxLevel) pool.push({ kind: 'weapon', key: k });
  });
  Object.keys(passiveDefs).forEach(k => {
    if (state.player.passives[k] < passiveDefs[k].maxLevel) pool.push({ kind: 'passive', key: k });
  });

  // Shuffle and pick 3
  for (let i=pool.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const choices = pool.slice(0, 3);

  choices.forEach(c => {
    const def = c.kind === 'weapon' ? weaponDefs[c.key] : passiveDefs[c.key];
    const curLv = c.kind === 'weapon' ? state.player.weapons[c.key].level : state.player.passives[c.key];
    const isNew = c.kind === 'weapon' && curLv === 0;
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    card.innerHTML = `
      <div class="upgrade-icon">${def.icon}</div>
      <div class="upgrade-name">${def.name}</div>
      <div class="upgrade-desc">${isNew ? 'NEW! ' : ''}${def.desc}</div>
      <div class="upgrade-level">${isNew ? 'ACQUIRE' : 'LV ' + (curLv+1) + ' / ' + def.maxLevel}</div>
    `;
    card.onclick = () => {
      sfx.upgrade();
      if (c.kind === 'weapon') {
        state.player.weapons[c.key].level++;
        if (c.key === 'orbiters') buildOrbiters(state.player);
      } else {
        state.player.passives[c.key]++;
        passiveDefs[c.key].apply(state.player, state.player.passives[c.key]);
      }
      el.style.display = 'none';
      state.paused = false;
    };
    grid.appendChild(card);
  });
}

/* ============================================================
   WEAPON UPDATES
   ============================================================ */
function findNearestEnemy(pos, maxRange=60) {
  let best = null, bestD = maxRange * maxRange;
  for (const e of state.enemies) {
    if (!e.alive) continue;
    const dx = e.pos.x - pos.x, dz = e.pos.z - pos.z;
    const d = dx*dx + dz*dz;
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}
function findEnemiesInRadius(pos, radius) {
  const res = []; const r2 = radius*radius;
  for (const e of state.enemies) {
    if (!e.alive) continue;
    const dx = e.pos.x - pos.x, dz = e.pos.z - pos.z;
    const d = dx*dx + dz*dz;
    if (d < r2) res.push(e);
  }
  return res;
}

function updateWeapons(dt) {
  const p = state.player;

  // Orbiters
  const orbLv = p.weapons.orbiters.level;
  if (orbLv > 0) {
    const stats = weaponDefs.orbiters.stats(orbLv);
    for (let i=0; i<p.orbiters.length; i++) {
      const o = p.orbiters[i];
      o.angle += dt * stats.rotSpeed;
      const x = Math.cos(o.angle) * stats.radius;
      const z = Math.sin(o.angle) * stats.radius;
      o.mesh.position.set(x, 1.2 + Math.sin(state.time*4 + i)*0.2, z);
      o.mesh.rotation.x += dt * 5;
      o.mesh.rotation.y += dt * 3;
      // Damage enemies near this orb
      const op = new THREE.Vector3(x, 0, z).add(p.pos);
      for (const e of state.enemies) {
        if (!e.alive) continue;
        const dx = e.pos.x - op.x, dz = e.pos.z - op.z;
        const d2 = dx*dx + dz*dz;
        const hitR = (e.def.radius + 0.5);
        if (d2 < hitR * hitR) {
          if (!o.lastHit || o.lastHit[i] !== e || o.lastHitTime[i] < state.time - 0.25) {
            damageEnemy(e, stats.dmg * p.dmgMult, new THREE.Vector3(dx, 0, dz).normalize().multiplyScalar(3));
            if (!o.lastHit) { o.lastHit = {}; o.lastHitTime = {}; }
            o.lastHit[i] = e; o.lastHitTime[i] = state.time;
          }
        }
      }
    }
  }

  // Bolts
  const boltLv = p.weapons.bolts.level;
  if (boltLv > 0) {
    const stats = weaponDefs.bolts.stats(boltLv);
    p.weapons.bolts.cd -= dt;
    if (p.weapons.bolts.cd <= 0) {
      p.weapons.bolts.cd = stats.rate;
      const target = findNearestEnemy(p.pos, 50);
      if (target) {
        sfx.shoot();
        for (let i=0; i<stats.count; i++) {
          const spread = (i - (stats.count-1)/2) * 0.15;
          const dir = new THREE.Vector3(target.pos.x - p.pos.x, 0, target.pos.z - p.pos.z).normalize();
          // rotate by spread
          const cs = Math.cos(spread), sn = Math.sin(spread);
          const nx = dir.x*cs - dir.z*sn;
          const nz = dir.x*sn + dir.z*cs;
          dir.set(nx, 0, nz);
          spawnProjectile(p.pos.clone().setY(1.5), dir, stats.dmg * p.dmgMult, stats.speed, 2, true, 0xffdb4d);
        }
      }
    }
  }

  // Nova
  const novaLv = p.weapons.nova.level;
  if (novaLv > 0) {
    const stats = weaponDefs.nova.stats(novaLv);
    p.weapons.nova.cd -= dt;
    if (p.weapons.nova.cd <= 0) {
      p.weapons.nova.cd = stats.cooldown;
      spawnShockwave(p.pos.clone().setY(0), stats.dmg * p.dmgMult, stats.radius);
    }
  }

  // Thorns
  const thornLv = p.weapons.thorns.level;
  if (thornLv > 0) {
    const stats = weaponDefs.thorns.stats(thornLv);
    p.weapons.thorns.cd -= dt;
    if (p.weapons.thorns.cd <= 0) {
      p.weapons.thorns.cd = stats.interval;
      const nearby = findEnemiesInRadius(p.pos, 2);
      for (const e of nearby) {
        damageEnemy(e, stats.dmg * p.dmgMult, new THREE.Vector3());
        e.slowTimer = 1; e.slowAmt = stats.slow;
      }
      if (nearby.length > 0) {
        spawnParticles(p.pos, 0xb84dff, 6, 3, 0.15, 0.3);
      }
    }
  }

  // Chain
  const chainLv = p.weapons.chain.level;
  if (chainLv > 0) {
    const stats = weaponDefs.chain.stats(chainLv);
    p.weapons.chain.cd -= dt;
    if (p.weapons.chain.cd <= 0) {
      p.weapons.chain.cd = stats.cooldown;
      const target = findNearestEnemy(p.pos, stats.range);
      if (target) {
        spawnLightningChain(p.pos.clone().setY(1.5), stats.dmg * p.dmgMult, stats.chains, stats.range);
      }
    }
  }
}

/* ============================================================
   MAIN UPDATE
   ============================================================ */
function updatePlayer(dt) {
  const p = state.player;
  // Input
  const dir = new THREE.Vector3();
  if (state.keys['KeyW'] || state.keys['ArrowUp']) dir.z -= 1;
  if (state.keys['KeyS'] || state.keys['ArrowDown']) dir.z += 1;
  if (state.keys['KeyA'] || state.keys['ArrowLeft']) dir.x -= 1;
  if (state.keys['KeyD'] || state.keys['ArrowRight']) dir.x += 1;

  // Camera-relative: in our top-down view, forward is -z for the player, but camera looks from +z/+y, so standard "screen space" controls
  if (dir.lengthSq() > 0) dir.normalize();
  const speed = p.baseSpeed * p.speedMult;
  p.vel.lerp(dir.multiplyScalar(speed), Math.min(1, dt * 12));
  p.pos.x += p.vel.x * dt;
  p.pos.z += p.vel.z * dt;

  // Clamp to arena
  const maxR = 90;
  const d = Math.hypot(p.pos.x, p.pos.z);
  if (d > maxR) { p.pos.x *= maxR/d; p.pos.z *= maxR/d; }

  p.pos.y = 0;
  p.mesh.position.copy(p.pos);

  // Facing direction (toward nearest enemy or movement)
  const nearest = findNearestEnemy(p.pos, 30);
  if (nearest) {
    p.facing = Math.atan2(nearest.pos.x - p.pos.x, nearest.pos.z - p.pos.z);
  } else if (dir.lengthSq() > 0) {
    p.facing = Math.atan2(dir.x, dir.z);
  }
  p.mesh.rotation.y = p.facing;

  // Bobbing animation
  p.bobPhase += dt * 4;
  const bob = Math.sin(p.bobPhase) * 0.1;
  p.body.position.y = 1.2 + bob;
  p.head.position.y = 2.1 + bob;

  // Invulnerability flicker
  if (p.invulnTimer > 0) {
    p.invulnTimer -= dt;
    const visible = Math.floor(p.invulnTimer * 20) % 2 === 0;
    p.mesh.visible = visible;
  } else {
    p.mesh.visible = true;
  }

  // Regen
  if (p.regen > 0 && p.hp < p.maxHp) {
    p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
  }
}

function updateEnemies(dt) {
  const p = state.player;
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    if (!e.alive) { state.enemies.splice(i, 1); continue; }

    if (e.stunTimer > 0) { e.stunTimer -= dt; continue; }

    // Movement toward player
    const dx = p.pos.x - e.pos.x;
    const dz = p.pos.z - e.pos.z;
    const dist = Math.hypot(dx, dz);
    let sp = e.speed;
    if (e.slowTimer > 0) {
      sp *= (1 - e.slowAmt);
      e.slowTimer -= dt;
    }

    let moveDir = new THREE.Vector3(dx, 0, dz);
    if (dist > 0.1) moveDir.normalize();

    // Shriekers (ranged) keep distance
    if (e.def.ranged) {
      if (dist < 8) {
        moveDir.multiplyScalar(-1);
      } else if (dist < 12) {
        moveDir.set(-dz, 0, dx).normalize();
      }
    }

    // Boss movement is slower and more methodical
    e.pos.x += moveDir.x * sp * dt;
    e.pos.z += moveDir.z * sp * dt;

    // Knockback
    e.pos.add(e.knockback);
    e.knockback.multiplyScalar(Math.pow(0.001, dt));

    e.mesh.position.copy(e.pos);
    e.mesh.position.y = Math.sin(state.time * 4 + e.phase) * 0.1;

    // Face player
    e.mesh.rotation.y = Math.atan2(dx, dz);

    // Hit flash
    if (e.hitFlash > 0) {
      e.hitFlash -= dt;
      e.mesh.traverse(o => {
        if (o.isMesh && o.material) {
          if (!o.userData.origEmissive && o.material.emissive) {
            o.userData.origEmissive = o.material.emissive.getHex();
          }
          if (o.material.emissive && e.hitFlash > 0) {
            o.material.emissive.setHex(0xffffff);
          } else if (o.material.emissive && o.userData.origEmissive !== undefined) {
            o.material.emissive.setHex(o.userData.origEmissive);
          }
        }
      });
    }

    // Attack / contact damage
    e.attackCd -= dt;
    if (dist < e.def.radius + 0.8 && e.attackCd <= 0 && !e.def.ranged) {
      damagePlayer(e.dmg);
      e.attackCd = 0.8;
      // small knockback on enemy
      const kb = moveDir.clone().multiplyScalar(-2);
      e.knockback.add(kb);
    }

    // Shrieker ranged attack
    if (e.def.ranged) {
      e.rangedCd -= dt;
      if (dist < 22 && e.rangedCd <= 0) {
        e.rangedCd = 2 + Math.random() * 0.5;
        const dir = new THREE.Vector3(dx, 0, dz).normalize();
        spawnEnemyProjectile(e.pos.clone().setY(1.4), dir, e.dmg * 0.5, 16, 3);
      }
    }
  }
}

function spawnEnemyProjectile(pos, dir, dmg, speed, life) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x4ddbff, emissive: 0x1188ff, emissiveIntensity: 2, flatShading: true });
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), mat);
  mesh.position.copy(pos);
  scene.add(mesh);
  state.projectiles.push({
    mesh, pos: mesh.position,
    vel: dir.clone().multiplyScalar(speed),
    dmg, life, enemy: true, hitEnemies: new Set()
  });
}

function updateProjectiles(dt) {
  for (let i = state.projectiles.length - 1; i >= 0; i--) {
    const pr = state.projectiles[i];
    pr.life -= dt;

    if (pr.shockwave) {
      const t = 1 - (pr.life / pr.maxLife);
      const r = pr.maxRadius * t;
      pr.mesh.scale.setScalar(r * 2);
      pr.mesh.material.opacity = 1 - t;
      // hit enemies
      for (const e of state.enemies) {
        if (!e.alive || pr.hitEnemies.has(e)) continue;
        const d = e.pos.distanceTo(pr.pos);
        if (d < r + e.def.radius) {
          pr.hitEnemies.add(e);
          const kb = new THREE.Vector3(e.pos.x - pr.pos.x, 0, e.pos.z - pr.pos.z).normalize().multiplyScalar(8);
          damageEnemy(e, pr.dmg, kb);
        }
      }
      if (pr.life <= 0) { scene.remove(pr.mesh); state.projectiles.splice(i, 1); }
      continue;
    }

    if (pr.enemy) {
      pr.pos.addScaledVector(pr.vel, dt);
      // hit player
      const d = pr.pos.distanceTo(state.player.pos);
      if (d < 1) {
        damagePlayer(pr.dmg);
        spawnHitBurst(pr.pos, 0x4ddbff);
        scene.remove(pr.mesh); state.projectiles.splice(i, 1);
        continue;
      }
    } else {
      if (pr.homing) {
        const target = findNearestEnemy(pr.pos, 30);
        if (target) {
          const toT = new THREE.Vector3(target.pos.x - pr.pos.x, 0, target.pos.z - pr.pos.z).normalize();
          pr.vel.lerp(toT.multiplyScalar(pr.vel.length()), Math.min(1, dt * 8));
        }
      }
      pr.pos.addScaledVector(pr.vel, dt);

      // trail
      pr.trailTimer += dt;
      if (pr.trailTimer > 0.05) {
        pr.trailTimer = 0;
        const trGeo = new THREE.SphereGeometry(0.08, 4, 4);
        const trMat = new THREE.MeshBasicMaterial({ color: pr.mesh.material.color, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const tr = new THREE.Mesh(trGeo, trMat);
        tr.position.copy(pr.pos);
        scene.add(tr);
        state.particles.push({ mesh: tr, life: 0.25, maxLife: 0.25 });
      }

      // collision with enemies
      for (const e of state.enemies) {
        if (!e.alive || pr.hitEnemies.has(e)) continue;
        const d = pr.pos.distanceTo(e.pos);
        if (d < e.def.radius + 0.3) {
          pr.hitEnemies.add(e);
          const kb = pr.vel.clone().normalize().multiplyScalar(4);
          damageEnemy(e, pr.dmg, kb);
          spawnHitBurst(pr.pos, 0xffdb4d);
          scene.remove(pr.mesh);
          state.projectiles.splice(i, 1);
          break;
        }
      }
    }

    if (pr.life <= 0 || Math.abs(pr.pos.x) > 120 || Math.abs(pr.pos.z) > 120) {
      scene.remove(pr.mesh);
      state.projectiles.splice(i, 1);
    }
  }
}

function updatePickups(dt) {
  const p = state.player;
  const magnetRange = p.magnet * p.magnetMult;
  for (let i = state.pickups.length - 1; i >= 0; i--) {
    const pk = state.pickups[i];
    pk.phase += dt * 3;
    pk.mesh.position.y = 0.5 + Math.sin(pk.phase) * 0.15;
    pk.mesh.rotation.y += dt * 2;

    const dx = p.pos.x - pk.pos.x;
    const dz = p.pos.z - pk.pos.z;
    const dist = Math.hypot(dx, dz);

    if (dist < magnetRange || pk.attract) {
      pk.attract = true;
      const pull = 15;
      pk.pos.x += (dx / dist) * pull * dt;
      pk.pos.z += (dz / dist) * pull * dt;
    }

    if (dist < 1.2) {
      if (pk.type === 'xp') {
        grantXP(pk.value);
        sfx.pickup();
      } else if (pk.type === 'heart') {
        p.hp = Math.min(p.maxHp, p.hp + 25);
        sfx.heal();
        showDamageNumber(p.pos, 25, 0x4dffb8);
      }
      scene.remove(pk.mesh);
      state.pickups.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const pa = state.particles[i];
    pa.life -= dt;
    if (pa.points) {
      const pos = pa.points.geometry.attributes.position;
      for (let j=0; j<pa.vels.length; j++) {
        pa.vels[j].y -= (pa.gravity ? 20 : 2) * dt;
        pos.setXYZ(j,
          pos.getX(j) + pa.vels[j].x * dt,
          pos.getY(j) + pa.vels[j].y * dt,
          pos.getZ(j) + pa.vels[j].z * dt
        );
      }
      pos.needsUpdate = true;
      pa.points.material.opacity = Math.max(0, pa.life / pa.maxLife);
    } else if (pa.mesh) {
      pa.mesh.material.opacity = Math.max(0, pa.life / pa.maxLife);
      pa.mesh.scale.multiplyScalar(1 + dt * 2);
    } else if (pa.line) {
      pa.line.material.opacity = Math.max(0, pa.life / pa.maxLife);
    }
    if (pa.life <= 0) {
      if (pa.points) {
        scene.remove(pa.points);
        pa.points.geometry.dispose();
        pa.points.material.dispose();
      }
      if (pa.mesh) {
        scene.remove(pa.mesh);
        if (pa.mesh.geometry) pa.mesh.geometry.dispose();
        if (pa.mesh.material) pa.mesh.material.dispose();
      }
      if (pa.line) {
        scene.remove(pa.line);
        pa.line.geometry.dispose();
        pa.line.material.dispose();
      }
      state.particles.splice(i, 1);
    }
  }
}

function updateEnvironment(dt) {
  for (const c of state.crystals) {
    c.position.y = Math.sin(state.time * 1.2 + c.userData.phase) * 0.1;
    c.rotation.y += dt * 0.1;
  }
}

/* ============================================================
   UI UPDATE
   ============================================================ */
function updateHUD() {
  const p = state.player;
  document.getElementById('healthBar').style.width = (p.hp / p.maxHp * 100) + '%';
  document.getElementById('xpBar').style.width = (p.xp / p.xpNext * 100) + '%';
  document.getElementById('levelIndicator').textContent = `LV ${p.level}`;
  document.getElementById('timer').textContent = formatTime(state.time);
  document.getElementById('score').textContent = state.score.toLocaleString();

  // Weapons list
  const wl = document.getElementById('weaponList');
  wl.innerHTML = '';
  Object.keys(p.weapons).forEach(k => {
    const lv = p.weapons[k].level;
    if (lv > 0) {
      const def = weaponDefs[k];
      const d = document.createElement('div');
      d.className = 'weapon-icon';
      d.innerHTML = `<span style="color:${'#'+new THREE.Color(lv >= def.maxLevel ? 0xffdb4d : 0x4ddbff).getHexString()}">${def.icon}</span> ${def.name} <span class="lvl">${lv}/${def.maxLevel}</span>`;
      wl.appendChild(d);
    }
  });

  // Boss health
  if (state.bossActive && state.boss) {
    document.getElementById('bossHealthFill').style.width = (state.boss.hp / state.boss.maxHp * 100) + '%';
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if (state.running && !state.paused) {
    state.time += dt;
    updatePlayer(dt);
    updateWeapons(dt);
    updateEnemies(dt);
    updateProjectiles(dt);
    updatePickups(dt);
    updateWaves(dt);
    updateEnvironment(dt);
    updateHUD();
  }
  updateParticles(dt);

  // Camera follow with screenshake
  const p = state.player;
  const targetCamPos = new THREE.Vector3(
    p.pos.x + state.cameraOffset.x,
    p.pos.y + state.cameraOffset.y,
    p.pos.z + state.cameraOffset.z
  );
  if (shakeAmt > 0.01) {
    targetCamPos.x += (Math.random()-0.5) * shakeAmt;
    targetCamPos.y += (Math.random()-0.5) * shakeAmt;
    targetCamPos.z += (Math.random()-0.5) * shakeAmt;
    shakeAmt *= 0.85;
  }
  camera.position.lerp(targetCamPos, Math.min(1, dt * 5));
  camera.lookAt(p.pos.x, 1, p.pos.z);

  renderer.render(scene, camera);
}

/* ============================================================
   GAME INIT / RESTART
   ============================================================ */
function resetGame() {
  // clear enemies
  state.enemies.forEach(e => scene.remove(e.mesh));
  state.enemies = [];
  state.projectiles.forEach(p => scene.remove(p.mesh));
  state.projectiles = [];
  state.pickups.forEach(p => scene.remove(p.mesh));
  state.pickups = [];
  // particles cleared automatically by life
  state.particles.forEach(pa => {
    if (pa.points) scene.remove(pa.points);
    if (pa.mesh) scene.remove(pa.mesh);
    if (pa.line) scene.remove(pa.line);
  });
  state.particles = [];

  state.time = 0;
  state.kills = 0;
  state.score = 0;
  state.wave = 0;
  state.waveTimer = 0;
  state.spawnTimer = 0;
  state.bossActive = false;
  state.boss = null;
  state.nextBossTime = 60;

  if (state.player) scene.remove(state.player.mesh);
  state.player = createPlayer();
  buildOrbiters(state.player);

  // Start with two weapons unlocked
  state.player.weapons.bolts.level = 1;
}

function startGame() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  resetGame();
  state.running = true;
  state.paused = false;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  sfx.wave();
  showWaveAlert('WAVE INCOMING', 0xff7b3d);
}

function gameOver() {
  state.running = false;
  document.getElementById('finalTime').textContent = formatTime(state.time);
  document.getElementById('finalLevel').textContent = state.player.level;
  document.getElementById('finalScore').textContent = state.score.toLocaleString();
  document.getElementById('finalKills').textContent = state.kills;
  document.getElementById('gameOver').style.display = 'flex';
}

/* ============================================================
   SETUP
   ============================================================ */
createGround();
state.player = createPlayer();
buildOrbiters(state.player);
camera.position.copy(state.cameraOffset);
camera.lookAt(0, 1, 0);

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

window.addEventListener('keydown', e => {
  state.keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => {
  state.keys[e.code] = false;
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// prevent right-click menu
window.addEventListener('contextmenu', e => e.preventDefault());

animate();
</script>
</body>
</html>
