<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdfbf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f2efea;stop-opacity:1" />
    </linearGradient>
    
    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9f9f9;stop-opacity:1" />
    </linearGradient>

    <!-- GDP Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BC002D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a0021;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGrad)" />
  
  <!-- Decorative Waves -->
  <path d="M0 200 Q 300 150 600 200 T 1200 200 V 0 H 0 Z" fill="#f0ede7" opacity="0.5" />
  <path d="M0 1700 Q 300 1750 600 1700 T 1200 1700 V 1800 H 0 Z" fill="#f0ede7" opacity="0.5" />
  <circle cx="1100" cy="100" r="150" fill="#BC002D" opacity="0.03" />
  <circle cx="100" cy="1700" r="200" fill="#BC002D" opacity="0.03" />

  <!-- Header -->
  <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#2C3E50" letter-spacing="-1">Japan at a glance</text>
  <rect x="560" y="140" width="80" height="6" rx="3" fill="#BC002D" />

  <!-- ROW 1: Map and Text -->
  <g transform="translate(60, 220)">
    <!-- Map Card -->
    <rect width="520" height="500" rx="20" fill="url(#cardGrad)" filter="url(#shadow)" />
    
    <!-- Stylized Map of Japan (Approximate organic paths) -->
    <g transform="translate(100, 80) scale(0.8)" fill="#ddd" stroke="#BC002D" stroke-width="3" stroke-linejoin="round">
      <path d="M250,50 L270,60 L290,40 L310,70 L330,60 L350,110 L340,140 L370,180 L360,220 L390,260 L370,300 L340,310 L320,280 L300,320 L280,300 L260,330 L230,310 L210,350 L180,340 L160,380 L130,360 L100,400 L70,370 L50,390 L30,360 L10,380 L-20,350 L10,320 L40,300 L60,250 L80,220 L70,180 L100,150 L120,120 L150,110 L180,140 L210,100 Z" />
      <!-- Major Islands connectivity -->
      <path d="M350,110 Q 380,130 400,160" fill="none" stroke="#BC002D" stroke-width="3" />
    </g>

    <!-- City Markers -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
      <circle cx="365" cy="260" r="6" fill="#BC002D" />
      <text x="375" y="265">Tokyo</text>
      
      <circle cx="372" cy="275" r="6" fill="#BC002D" />
      <text x="382" y="280">Yokohama</text>
      
      <circle cx="330" cy="310" r="6" fill="#BC002D" />
      <text x="340" y="315">Nagoya</text>
      
      <circle cx="300" cy="335" r="6" fill="#BC002D" />
      <text x="310" y="340">Osaka</text>
    </g>
    <text x="260" y="470" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-style="italic" fill="#7f8c8d">Stylized geographical representation</text>
  </g>

  <g transform="translate(620, 220)">
    <rect width="520" height="500" rx="20" fill="url(#cardGrad)" filter="url(#shadow)" />
    <text x="40" y="60" font-family="Segoe UI, Arial" font-size="32" font-weight="bold" fill="#2C3E50">The Land of the Rising Sun</text>
    <foreignObject x="40" y="90" width="440" height="380">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', Arial; font-size: 18px; line-height: 1.6; color: #555;">
        Japan is an archipelagic country in East Asia, located in the northwest Pacific Ocean. It consists of thousands of islands, with the four largest being Honshu, Hokkaido, Kyushu, and Shikoku. 
        <br/><br/>
        Known for its seamless integration of hyper-modern technology and deeply rooted cultural traditions, Japan offers a unique perspective on societal evolution, from the neon lights of Shinjuku to the serene shrines of Kyoto.
      </div>
    </foreignObject>
  </g>

  <!-- Full Width Paragraph -->
  <g transform="translate(60, 760)">
    <rect width="1080" height="120" rx="20" fill="#BC002D" filter="url(#shadow)" />
    <foreignObject x="40" y="30" width="1000" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', Arial; font-size: 22px; text-align: center; color: white; font-weight: 500; line-height: 1.4;">
        As a global leader in automotive and electronics industries, Japan's economy has faced challenges and transformations over the last decade, maintaining a steady but fluctuating nominal GDP.
      </div>
    </foreignObject>
  </g>

  <!-- ROW 2: GDP Chart -->
  <g transform="translate(60, 920)">
    <!-- Text Card -->
    <rect width="400" height="500" rx="20" fill="url(#cardGrad)" filter="url(#shadow)" />
    <text x="40" y="60" font-family="Segoe UI, Arial" font-size="28" font-weight="bold" fill="#2C3E50">Economic Trends</text>
    <foreignObject x="40" y="90" width="320" height="380">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', Arial; font-size: 18px; line-height: 1.6; color: #555;">
        The nominal GDP of Japan reflects the nation's immense productivity and its struggle with currency devaluation and demographic shifts. 
        <br/><br/>
        The peak observed around 2019 reflects a period of stability before the global volatility of the early 2020s.
      </div>
    </foreignObject>

    <!-- Chart Card -->
    <rect x="440" width="640" height="500" rx="20" fill="url(#cardGrad)" filter="url(#shadow)" />
    <text x="480" y="60" font-family="Segoe UI, Arial" font-size="24" font-weight="bold" fill="#2C3E50">Nominal GDP (Current US$ Trillions)</text>
    
    <!-- Chart Axes -->
    <line x1="480" y1="420" x2="1040" y2="420" stroke="#B2bec3" stroke-width="2" />
    <line x1="480" y1="120" x2="480" y2="420" stroke="#B2bec3" stroke-width="2" />
    
    <!-- GDP Bars -->
    <!-- Data: 2015 4.44, 2016 5.00, 2017 4.93, 2018 5.04, 2019 5.12, 2020 5.05, 2021 5.04, 2022 4.26, 2023 4.21, 2024 4.03 -->
    <!-- Scale: (Value - 3.5) * 60px height. Baseline at 420. -->
    
    <g transform="translate(480, 420)">
      <!-- 2015 -->
      <rect x="20" y="-56" width="30" height="56" fill="url(#barGrad)" rx="4" />
      <text x="35" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2015</text>
      <text x="35" y="-65" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">4.44</text>
      
      <!-- 2016 -->
      <rect x="80" y="-90" width="30" height="90" fill="url(#barGrad)" rx="4" />
      <text x="95" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2016</text>
      <text x="95" y="-100" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">5.00</text>
      
      <!-- 2017 -->
      <rect x="140" y="-86" width="30" height="86" fill="url(#barGrad)" rx="4" />
      <text x="155" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2017</text>
      <text x="155" y="-95" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">4.93</text>
      
      <!-- 2018 -->
      <rect x="200" y="-92" width="30" height="92" fill="url(#barGrad)" rx="4" />
      <text x="215" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2018</text>
      <text x="215" y="-102" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">5.04</text>
      
      <!-- 2019 -->
      <rect x="260" y="-97" width="30" height="97" fill="url(#barGrad)" rx="4" />
      <text x="275" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2019</text>
      <text x="275" y="-107" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">5.12</text>
      
      <!-- 2020 -->
      <rect x="320" y="-93" width="30" height="93" fill="url(#barGrad)" rx="4" />
      <text x="335" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2020</text>
      <text x="335" y="-103" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">5.05</text>
      
      <!-- 2021 -->
      <rect x="380" y="-92" width="30" height="92" fill="url(#barGrad)" rx="4" />
      <text x="395" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2021</text>
      <text x="395" y="-102" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">5.04</text>
      
      <!-- 2022 -->
      <rect x="440" y="-46" width="30" height="46" fill="url(#barGrad)" rx="4" />
      <text x="455" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2022</text>
      <text x="455" y="-55" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">4.26</text>
      
      <!-- 2023 -->
      <rect x="500" y="-42" width="30" height="42" fill="url(#barGrad)" rx="4" />
      <text x="515" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2023</text>
      <text x="515" y="-52" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">4.21</text>
      
      <!-- 2024 -->
      <rect x="560" y="-32" width="30" height="32" fill="url(#barGrad)" rx="4" />
      <text x="575" y="20" text-anchor="middle" font-family="Arial" font-size="12" fill="#7f8c8d">2024</text>
      <text x="575" y="-42" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">4.03</text>
    </g>
  </g>

  <!-- BOTTOM ROW: Population and Tourism -->
  <g transform="translate(60, 1460)">
    <!-- Population Donut Chart -->
    <rect width="520" height="300" rx="20" fill="url(#cardGrad)" filter="url(#shadow)" />
    <text x="260" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="bold" fill="#2C3E50">Population Composition</text>
    
    <!-- Donut Chart -->
    <g transform="translate(260, 170)">
      <!-- Japanese 97.5% -->
      <path d="M 0,-70 A 70,70 0 1,1 -69.5,11.3" fill="none" stroke="#BC002D" stroke-width="30" />
      <!-- Chinese 0.6% -->
      <path d="M -69.5,11.3 A 70,70 0 0,1 -68,18" fill="none" stroke="#3498db" stroke-width="30" />
      <!-- Vietnamese 0.4% -->
      <path d="M -68,18 A 70,70 0 0,1 -65,25" fill="none" stroke="#f1c40f" stroke-width="30" />
      <!-- Korean 0.3% -->
      <path d="M -65,25 A 70,70 0 0,1 -62,32" fill="none" stroke="#2ecc71" stroke-width="30" />
      <!-- Other 1.2% -->
      <path d="M -62,32 A 70,70 0 0,1 0,-70" fill="none" stroke="#95a5a6" stroke-width="30" />
      
      <!-- Center Hole -->
      <circle r="40" fill="#f9f9f9" />
      <text text-anchor="middle" y="5" font-family="Arial" font-size="14" font-weight="bold" fill="#2C3E50">By Nationality</text>
    </g>
    
    <!-- Legend -->
    <g transform="translate(360, 120)" font-family="Arial" font-size="12" fill="#555">
      <rect x="0" y="0" width="10" height="10" fill="#BC002D" /> <text x="15" y="10">Japanese 97.5%</text>
      <rect x="0" y="20" width="10" height="10" fill="#3498db" /> <text x="15" y="30">Chinese 0.6%</text>
      <rect x="0" y="40" width="10" height="10" fill="#f1c40f" /> <text x="15" y="50">Vietnamese 0.4%</text>
      <rect x="0" y="60" width="10" height="10" fill="#2ecc71" /> <text x="15" y="70">S. Korean 0.3%</text>
      <rect x="0" y="80" width="10" height="10" fill="#95a5a6" /> <text x="15" y="90">Other 1.2%</text>
    </g>
  </g>

  <g transform="translate(620, 1460)">
    <rect width="520" height="300" rx="20" fill="url(#cardGrad)" filter="url(#shadow)" />
    <text x="40" y="50" font-family="Segoe UI, Arial" font-size="24" font-weight="bold" fill="#2C3E50">Top Destinations</text>
    
    <g transform="translate(40, 80)" font-family="Segoe UI, Arial" font-size="18" fill="#555">
      <text x="0" y="0">● Tokyo (Metropolis &amp; Tech)</text>
      <text x="0" y="35">● Kyoto (Temples &amp; Tradition)</text>
      <text x="0" y="70">● Osaka (Street Food &amp; Neon)</text>
      <text x="0" y="105">● Hiroshima / Miyajima (History)</text>
      <text x="0" y="140">● Mount Fuji / Hakone (Nature)</text>
      <text x="0" y="175">● Hokkaido (Winter &amp; Wilds)</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="1760" text-anchor="middle" font-family="Arial" font-size="12" fill="#999">Source: World Bank, IMF, and National Statistics Japan | Data updated 2024</text>
</svg>