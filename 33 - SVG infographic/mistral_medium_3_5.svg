<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="100%" stop-color="#e6f3ff"/>
    </linearGradient>

    <!-- Wave pattern for background -->
    <pattern id="wavePattern" patternUnits="userSpaceOnUse" width="1200" height="200">
      <path d="M0,100 Q300,80 600,100 T1200,100" fill="none" stroke="#d4e6ff" stroke-width="1" opacity="0.3"/>
      <path d="M0,120 Q300,100 600,120 T1200,120" fill="none" stroke="#d4e6ff" stroke-width="1" opacity="0.2"/>
      <path d="M0,140 Q300,120 600,140 T1200,140" fill="none" stroke="#d4e6ff" stroke-width="1" opacity="0.1"/>
    </pattern>

    <!-- Card style -->
    <linearGradient id="cardGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-2" y="-2" width="104" height="104">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGradient)"/>
  <rect x="0" y="1400" width="1200" height="400" fill="url(#wavePattern)"/>

  <!-- Title with decorative wave -->
  <g>
    <text x="600" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#2c3e50">Japan at a glance</text>
    <path d="M500,80 Q600,70 700,80" fill="none" stroke="#3498db" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- First row: Map and intro text -->
  <g transform="translate(100, 100)">
    <!-- Stylized map of Japan -->
    <g id="japanMap">
      <!-- Main islands (simplified) -->
      <path d="M0,100 L50,80 L100,70 L150,80 L200,100 L250,130 L300,170 L350,200 L380,220 L350,250 L300,230 L250,200 L200,150 L150,100 L100,80 L50,70 L0,100 Z
               M150,150 L200,170 L250,180 L200,200 L150,170 Z"
            fill="#ffffff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)"/>

      <!-- Cities -->
      <circle cx="200" cy="150" r="5" fill="#e74c3c"/>
      <text x="200" y="135" text-anchor="middle" font-size="12" fill="#2c3e50">Tokyo</text>
      <circle cx="210" cy="160" r="4" fill="#e74c3c"/>
      <text x="210" y="145" text-anchor="middle" font-size="10" fill="#2c3e50">Yokohama</text>
      <circle cx="180" cy="200" r="5" fill="#e74c3c"/>
      <text x="180" y="185" text-anchor="middle" font-size="12" fill="#2c3e50">Osaka</text>
      <circle cx="190" cy="175" r="4" fill="#e74c3c"/>
      <text x="190" y="160" text-anchor="middle" font-size="10" fill="#2c3e50">Nagoya</text>
    </g>

    <!-- Intro text with cherry blossom icon -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="400" height="240" rx="10" fill="url(#cardGradient)" stroke="#d4e6ff" stroke-width="1" filter="url(#shadow)"/>
      <g transform="translate(20, 20)">
        <circle cx="0" cy="0" r="6" fill="#ffb6c1"/>
        <circle cx="-4" cy="-4" r="3" fill="#ffb6c1"/>
        <circle cx="4" cy="-4" r="3" fill="#ffb6c1"/>
        <circle cx="-4" cy="4" r="3" fill="#ffb6c1"/>
        <circle cx="4" cy="4" r="3" fill="#ffb6c1"/>
        <circle cx="0" cy="0" r="1.5" fill="#fff"/>
      </g>
      <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">About Japan</text>
      <text x="20" y="60" font-size="14" fill="#34495e">
        <tspan x="20" dy="20">Japan is an island nation in East Asia,</tspan>
        <tspan x="20" dy="20">located in the Pacific Ocean. It consists</tspan>
        <tspan x="20" dy="20">of 6,852 islands, with the four largest</tspan>
        <tspan x="20" dy="20">being Honshu, Hokkaido, Kyushu, and</tspan>
        <tspan x="20" dy="20">Shikoku. The capital is Tokyo.</tspan>
      </text>
    </g>
  </g>

  <!-- Full-width paragraph -->
  <text x="100" y="360" font-size="16" fill="#34495e">
    <tspan x="100" dy="0">Japan is known for its blend of traditional and modern culture,</tspan>
    <tspan x="100" dy="25">from ancient temples to cutting-edge technology. With a</tspan>
    <tspan x="100" dy="25">population of over 125 million, it is one of the world's most</tspan>
    <tspan x="100" dy="25">populous countries and a major economic power.</tspan>
  </text>

  <!-- Second row: Text and GDP bar chart -->
  <g transform="translate(100, 420)">
    <!-- Left text with yen icon -->
    <g>
      <text x="0" y="20" font-size="20" fill="#3498db">¥</text>
      <text x="30" y="30" font-size="18" font-weight="bold" fill="#2c3e50">Economic Overview</text>
      <text x="0" y="60" font-size="14" fill="#34495e">
        <tspan x="0" dy="20">Japan has the third-largest economy</tspan>
        <tspan x="0" dy="20">in the world by nominal GDP. The</tspan>
        <tspan x="0" dy="20">country is known for its advanced</tspan>
        <tspan x="0" dy="20">technology, automotive industry,</tspan>
        <tspan x="0" dy="20">and electronics manufacturing.</tspan>
      </text>
    </g>

    <!-- Right: GDP bar chart -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="400" height="260" rx="10" fill="url(#cardGradient)" stroke="#d4e6ff" stroke-width="1" filter="url(#shadow)"/>
      <text x="200" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Nominal GDP (Trillions USD)</text>

      <!-- Y-axis labels -->
      <text x="-10" y="238" text-anchor="end" font-size="12" fill="#34495e">4.0</text>
      <text x="-10" y="176" text-anchor="end" font-size="12" fill="#34495e">4.5</text>
      <text x="-10" y="115" text-anchor="end" font-size="12" fill="#34495e">5.0</text>

      <!-- X-axis labels -->
      <g transform="translate(0, 255)">
        <text x="50" text-anchor="middle" font-size="12" fill="#34495e">2015</text>
        <text x="90" text-anchor="middle" font-size="12" fill="#34495e">2016</text>
        <text x="130" text-anchor="middle" font-size="12" fill="#34495e">2017</text>
        <text x="170" text-anchor="middle" font-size="12" fill="#34495e">2018</text>
        <text x="210" text-anchor="middle" font-size="12" fill="#34495e">2019</text>
        <text x="250" text-anchor="middle" font-size="12" fill="#34495e">2020</text>
        <text x="290" text-anchor="middle" font-size="12" fill="#34495e">2021</text>
        <text x="330" text-anchor="middle" font-size="12" fill="#34495e">2022</text>
        <text x="370" text-anchor="middle" font-size="12" fill="#34495e">2023</text>
        <text x="410" text-anchor="middle" font-size="12" fill="#34495e">2024</text>
      </g>

      <!-- Bars (scaled with base=3.9 to ensure visibility) -->
      <rect x="50" y="184" width="30" height="66" fill="#3498db" rx="2"/>
      <rect x="90" y="115" width="30" height="135" fill="#3498db" rx="2"/>
      <rect x="130" y="123" width="30" height="127" fill="#3498db" rx="2"/>
      <rect x="170" y="110" width="30" height="140" fill="#3498db" rx="2"/>
      <rect x="210" y="100" width="30" height="150" fill="#3498db" rx="2"/>
      <rect x="250" y="109" width="30" height="141" fill="#3498db" rx="2"/>
      <rect x="290" y="110" width="30" height="140" fill="#3498db" rx="2"/>
      <rect x="330" y="206" width="30" height="44" fill="#3498db" rx="2"/>
      <rect x="370" y="212" width="30" height="38" fill="#3498db" rx="2"/>
      <rect x="410" y="234" width="30" height="16" fill="#3498db" rx="2"/>

      <!-- Value labels -->
      <text x="65" y="179" text-anchor="middle" font-size="10" fill="#2c3e50">4.44</text>
      <text x="105" y="110" text-anchor="middle" font-size="10" fill="#2c3e50">5.00</text>
      <text x="145" y="118" text-anchor="middle" font-size="10" fill="#2c3e50">4.93</text>
      <text x="185" y="105" text-anchor="middle" font-size="10" fill="#2c3e50">5.04</text>
      <text x="225" y="95" text-anchor="middle" font-size="10" fill="#2c3e50">5.12</text>
      <text x="265" y="104" text-anchor="middle" font-size="10" fill="#2c3e50">5.05</text>
      <text x="305" y="105" text-anchor="middle" font-size="10" fill="#2c3e50">5.04</text>
      <text x="345" y="196" text-anchor="middle" font-size="10" fill="#2c3e50">4.26</text>
      <text x="385" y="202" text-anchor="middle" font-size="10" fill="#2c3e50">4.21</text>
      <text x="425" y="229" text-anchor="middle" font-size="10" fill="#2c3e50">4.03</text>

      <!-- Chart caption -->
      <text x="200" y="255" text-anchor="middle" font-size="12" fill="#7f8c8d">Nominal GDP in current US$ trillions (2015–2024)</text>
    </g>
  </g>

  <!-- Bottom row: Donut chart and places to visit -->
  <g transform="translate(100, 700)">
    <!-- Left: Population donut chart -->
    <g>
      <rect x="0" y="0" width="400" height="260" rx="10" fill="url(#cardGradient)" stroke="#d4e6ff" stroke-width="1" filter="url(#shadow)"/>
      <!-- People icon -->
      <g transform="translate(20, 20)">
        <circle cx="0" cy="-5" r="8" fill="#3498db"/>
        <circle cx="0" cy="5" r="6" fill="#3498db"/>
        <rect x="-3" y="-10" width="6" height="8" fill="#3498db"/>
      </g>
      <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Population Composition</text>

      <!-- Donut chart -->
      <g transform="translate(200, 130)">
        <circle cx="0" cy="0" r="40" fill="#ffffff"/>
        <!-- Japanese (97.5%) -->
        <path d="M -80,0 A 80,80 0 0,1 -70.71,70.71 A 80,80 0 0,1 0,80 A 80,80 0 0,1 70.71,70.71 A 80,80 0 0,1 80,0 A 80,80 0 0,1 70.71,-70.71 A 80,80 0 0,1 0,-80 A 80,80 0 0,1 -70.71,-70.71 A 80,80 0 0,1 -80,0 Z"
              fill="#3498db" stroke="#2c3e50" stroke-width="0.5"/>
        <!-- Other (2.5%) -->
        <path d="M 70.71,70.71 A 80,80 0 0,1 77.27,74.83 A 80,80 0 0,1 70.71,70.71 Z"
              fill="#e74c3c" stroke="#2c3e50" stroke-width="0.5"/>
      </g>

      <!-- Legend -->
      <g transform="translate(100, 200)">
        <g>
          <rect x="0" y="0" width="15" height="15" fill="#3498db" rx="2"/>
          <text x="20" y="12" font-size="12" fill="#2c3e50">Japanese: 97.5%</text>
        </g>
        <g>
          <rect x="0" y="25" width="15" height="15" fill="#e74c3c" rx="2"/>
          <text x="20" y="37" font-size="12" fill="#2c3e50">Other: 2.5%</text>
        </g>
        <text x="20" y="57" font-size="10" fill="#7f8c8d">Includes:</text>
        <text x="40" y="72" font-size="10" fill="#7f8c8d">Chinese: 0.6%</text>
        <text x="40" y="87" font-size="10" fill="#7f8c8d">Vietnamese: 0.4%</text>
        <text x="40" y="102" font-size="10" fill="#7f8c8d">South Korean: 0.3%</text>
        <text x="40" y="117" font-size="10" fill="#7f8c8d">Other: 1.2%</text>
      </g>

      <!-- Caption -->
      <text x="200" y="255" text-anchor="middle" font-size="12" fill="#7f8c8d">Population by nationality/ethnic grouping</text>
    </g>

    <!-- Right: Places to visit with mountain icon -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="400" height="260" rx="10" fill="url(#cardGradient)" stroke="#d4e6ff" stroke-width="1" filter="url(#shadow)"/>
      <g transform="translate(20, 20)">
        <path d="M0,10 L10,0 L20,10 Z" fill="#2c3e50"/>
        <path d="M5,10 L15,0 L25,10 Z" fill="#34495e"/>
        <rect x="8" y="10" width="4" height="8" fill="#5a6c7d"/>
      </g>
      <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Places to Visit</text>
      <text x="20" y="55" font-size="14" fill="#34495e">
        <tspan x="20" dy="20">Tokyo: Modern metropolis with</tspan>
        <tspan x="20" dy="20">historic temples</tspan>
        <tspan x="20" dy="25">Kyoto: Ancient capital with</tspan>
        <tspan x="20" dy="20">traditional tea houses</tspan>
        <tspan x="20" dy="25">Osaka: Vibrant food culture and</tspan>
        <tspan x="20" dy="20">nightlife</tspan>
        <tspan x="20" dy="25">Hiroshima/Miyajima: Peace</tspan>
        <tspan x="20" dy="20">memorial and floating torii</tspan>
        <tspan x="20" dy="25">Mount Fuji/Hakone: Iconic</tspan>
        <tspan x="20" dy="20">mountain and hot springs</tspan>
        <tspan x="20" dy="25">Hokkaido: Natural beauty and</tspan>
        <tspan x="20" dy="20">ski resorts</tspan>
      </text>
    </g>
  </g>

  <!-- Source note -->
  <text x="600" y="1750" text-anchor="middle" font-size="12" fill="#7f8c8d">Sources: World Bank, Statistics Japan, 2024 estimates</text>
</svg>