<svg width="1200" height="1800" xmlns="http://www.w3.org/2000/svg">
<!-- Background -->
<rect width="1200" height="1800" fill="#F9F9F9" />

<!-- Title -->
<text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="36" fill="#333">Japan at a Glance</text>

<!-- Map of Japan -->
<text x="150" y="200" font-family="Arial" font-size="18" fill="#333">Tokyo</text>
<text x="300" y="220" font-family="Arial" font-size="18" fill="#333">Yokohama</text>
<text x="170" y="280" font-family="Arial" font-size="18" fill="#333">Osaka</text>
<text x="280" y="250" font-family="Arial" font-size="18" fill="#333">Nagoya</text>

<!-- Explanatory text about Japan -->
<text x="700" y="200" font-family="Arial" font-size="18" fill="#333">Japan is an island country in East Asia known for its</text>
<text x="700" y="220" font-family="Arial" font-size="18" fill="#333">rich culture, history, and technological advancements.</text>

<!-- GDP bar chart -->
<text x="150" y="400" font-family="Arial" font-size="18" fill="#333">2015</text>
<text x="290" y="590" font-family="Arial" font-size="18" fill="#333">2024</text>
<rect x="200" y="450" width="50" height="350" fill="#0077FF" />
<rect x="350" y="350" width="50" height="450" fill="#0077FF" />
<!-- GDP data labels -->
<text x="180" y="830" font-family="Arial" font-size="16" fill="#333">4.44T</text>
<text x="330" y="820" font-family="Arial" font-size="16" fill="#333">4.03T</text>

<!-- Full-width paragraph -->
<text x="600" y="900" font-family="Arial" font-size="18" fill="#333">Japan is a country of contrasts, blending traditional</text>
<text x="600" y="920" font-family="Arial" font-size="18" fill="#333">culture with modern innovation.</text>

<!-- Population composition pie/donut chart -->
<circle cx="300" cy="1200" r="100" fill="#FF6D6D" />
<circle cx="300" cy="1200" r="70" fill="#F9F9F9" />
<!-- Population data labels -->
<text x="250" y="1180" font-family="Arial" font-size="12" fill="#333">Japanese 97.5%</text>
<text x="150" y="1220" font-family="Arial" font-size="12" fill="#333">Other 1.2%</text>
<text x="370" y="1200" font-family="Arial" font-size="12" fill="#333">Chinese 0.6%</text>
<text x="380" y="1180" font-family="Arial" font-size="12" fill="#333">Vietnamese 0.4%</text>
<text x="350" y="1220" font-family="Arial" font-size="12" fill="#333">South Korean 0.3%</text>

<!-- What to visit in Japan text -->
<text x="850" y="1100" font-family="Arial" font-size="18" fill="#333">What to visit in Japan:</text>
<text x="850" y="1130" font-family="Arial" font-size="16" fill="#333">Tokyo, Kyoto, Osaka, Hiroshima/Miyajima,</text>
<text x="850" y="1160" font-family="Arial" font-size="16" fill="#333">Mount Fuji/Hakone, Hokkaido</text>

<!-- Source note -->
<text x="600" y="1700" font-family="Arial" font-size="12" fill="#999">Source: World Bank, Japan National Tourism Organization</text>
</svg>