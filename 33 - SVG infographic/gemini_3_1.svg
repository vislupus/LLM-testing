<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
    <defs>
        <style>
            .font-serif { font-family: 'Georgia', 'Times New Roman', serif; }
            .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
            .title-main { font-size: 52px; font-weight: bold; fill: #1C2B4B; }
            .title-card { font-size: 22px; font-weight: bold; fill: #1C2B4B; }
            .text-body { font-size: 16px; fill: #475569; }
            .text-body-sm { font-size: 14px; fill: #64748B; }
            .text-bold { font-weight: bold; fill: #1C2B4B; }
            .text-white { fill: #FDFBF9; }
        </style>

        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#1C2B4B" flood-opacity="0.06" />
        </filter>

        <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1C2B4B" flood-opacity="0.04" />
        </filter>

        <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#BC002D"/>
            <stop offset="100%" stop-color="#E87A90"/>
        </linearGradient>

        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FDFBF9"/>
            <stop offset="100%" stop-color="#F4EFEB"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1200" height="1800" fill="url(#bgGrad)" />
    
    <!-- Subtle Background Waves -->
    <path d="M0,300 C300,450 700,100 1200,400 L1200,0 L0,0 Z" fill="#F8F3F0" opacity="0.8"/>
    <path d="M0,1300 C400,1150 800,1500 1200,1350 L1200,1800 L0,1800 Z" fill="#F8F3F0" opacity="0.8"/>
    <path d="M0,450 C400,300 800,550 1200,400 L1200,420 C800,570 400,320 0,470 Z" fill="#EADCD5" opacity="0.3"/>
    <path d="M0,1200 C300,1350 700,1100 1200,1250 L1200,1270 C700,1120 300,1370 0,1220 Z" fill="#EADCD5" opacity="0.3"/>

    <!-- Header -->
    <circle cx="110" cy="95" r="35" fill="#BC002D" opacity="0.15" />
    <circle cx="110" cy="95" r="15" fill="#BC002D" />
    <text x="160" y="112" class="font-serif title-main">Japan at a glance</text>

    <!-- ================= ROW 1 ================= -->
    <!-- Map Card -->
    <rect x="80" y="160" width="480" height="420" rx="16" fill="#ffffff" filter="url(#shadow)" />
    
    <g transform="translate(60, 150) scale(1.15)">
        <!-- Hokkaido -->
        <path d="M 330,50 L 360,40 L 390,55 L 410,80 L 400,105 L 360,115 L 340,110 L 320,85 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Honshu -->
        <path d="M 320,130 C 330,135 325,160 310,185 C 300,205 315,220 310,235 C 300,250 280,250 265,255 C 240,265 240,290 220,280 C 190,265 180,300 145,290 C 135,285 130,270 145,260 C 170,245 190,255 220,230 C 250,205 270,180 290,150 C 300,130 310,120 320,130 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Shikoku -->
        <path d="M 160,305 C 180,295 200,305 210,315 C 205,330 170,325 160,305 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Kyushu -->
        <path d="M 115,310 C 135,305 150,330 140,360 C 120,370 100,340 115,310 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/>

        <!-- Cities -->
        <!-- Tokyo -->
        <circle cx="305" cy="215" r="4.5" fill="#BC002D" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="318" y="219" class="font-sans text-bold" font-size="12">Tokyo</text>
        
        <!-- Yokohama -->
        <circle cx="303" cy="227" r="3.5" fill="#BC002D" stroke="#ffffff" stroke-width="1.5"/>
        <text x="316" y="233" class="font-sans text-bold" font-size="11" fill="#475569">Yokohama</text>
        
        <!-- Nagoya -->
        <circle cx="265" cy="247" r="3.5" fill="#BC002D" stroke="#ffffff" stroke-width="1.5"/>
        <text x="265" y="265" class="font-sans text-bold" font-size="11" fill="#475569" text-anchor="middle">Nagoya</text>
        
        <!-- Osaka -->
        <circle cx="230" cy="268" r="4" fill="#BC002D" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow-sm)"/>
        <text x="220" y="287" class="font-sans text-bold" font-size="12" text-anchor="middle">Osaka</text>
    </g>

    <!-- Intro Text Card -->
    <rect x="590" y="160" width="530" height="420" rx="16" fill="#ffffff" filter="url(#shadow)" />
    <rect x="630" y="200" width="4" height="24" fill="#BC002D" rx="2" />
    <text x="645" y="219" class="font-serif title-card">A Nation of Islands</text>
    
    <text x="630" y="260" class="font-sans text-body">
        <tspan x="630" dy="0">Japan is a prominent island country in East Asia, situated in</tspan>
        <tspan x="630" dy="28">the northwest Pacific Ocean. It is bordered on the west by</tspan>
        <tspan x="630" dy="28">the Sea of Japan, extending from the Sea of Okhotsk in the</tspan>
        <tspan x="630" dy="28">north toward the East China Sea, Philippine Sea, and</tspan>
        <tspan x="630" dy="28">Taiwan in the south.</tspan>
        
        <tspan x="630" dy="40">Comprising a stratovolcanic archipelago of over 14,000</tspan>
        <tspan x="630" dy="28">islands, Japan's four main islands are Hokkaido, Honshu,</tspan>
        <tspan x="630" dy="28">Shikoku, and Kyushu, which together account for most of</tspan>
        <tspan x="630" dy="28">its land area. Its diverse and dramatic geography ranges</tspan>
        <tspan x="630" dy="28">from snow-capped mountains to subtropical beaches.</tspan>
    </text>

    <!-- ================= ROW 1.5 (Full Width Paragraph) ================= -->
    <rect x="80" y="610" width="1040" height="120" rx="16" fill="#1C2B4B" filter="url(#shadow)" />
    <text x="600" y="655" class="font-serif text-white" font-style="italic" font-size="18" text-anchor="middle">
        <tspan x="600" dy="0">"A major economic and technological powerhouse, Japan is known for its distinctive blend</tspan>
        <tspan x="600" dy="28">of deeply rooted traditions and cutting-edge modernity. The nation boasts a highly skilled</tspan>
        <tspan x="600" dy="28">workforce, world-renowned manufacturing, and a rich cultural heritage spanning thousands</tspan>
        <tspan x="600" dy="28">of years, offering unparalleled experiences from ancient temples to futuristic megacities."</tspan>
    </text>

    <!-- ================= ROW 2 ================= -->
    <!-- Left Text Card -->
    <rect x="80" y="760" width="370" height="380" rx="16" fill="#ffffff" filter="url(#shadow)" />
    <rect x="120" y="800" width="4" height="24" fill="#BC002D" rx="2" />
    <text x="135" y="819" class="font-serif title-card">Economic Evolution</text>
    
    <text x="120" y="860" class="font-sans text-body">
        <tspan x="120" dy="0">Japan has historically been one of</tspan>
        <tspan x="120" dy="26">the world's largest and most</tspan>
        <tspan x="120" dy="26">advanced economies. The chart on</tspan>
        <tspan x="120" dy="26">the right illustrates Japan's nominal</tspan>
        <tspan x="120" dy="26">GDP in current US$ trillions from</tspan>
        <tspan x="120" dy="26">2015 to 2024.</tspan>
        
        <tspan x="120" dy="38">Fluctuations in recent years largely</tspan>
        <tspan x="120" dy="26">reflect shifting currency exchange</tspan>
        <tspan x="120" dy="26">rates—particularly the depreciation</tspan>
        <tspan x="120" dy="26">of the Japanese yen against the US</tspan>
        <tspan x="120" dy="26">dollar—along with demographic</tspan>
        <tspan x="120" dy="26">challenges and changing global</tspan>
        <tspan x="120" dy="26">dynamics.</tspan>
    </text>

    <!-- Right Chart Card -->
    <rect x="480" y="760" width="640" height="380" rx="16" fill="#ffffff" filter="url(#shadow)" />
    <text x="520" y="819" class="font-serif title-card">Nominal GDP (Current US$ Trillions)</text>

    <!-- Chart Axes & Grid -->
    <!-- 6.0 -->
    <line x1="520" y1="860" x2="1080" y2="860" stroke="#E2E8F0" stroke-dasharray="4" />
    <text x="505" y="865" class="font-sans text-body-sm" text-anchor="end">6.0</text>
    <!-- 4.0 -->
    <line x1="520" y1="933.3" x2="1080" y2="933.3" stroke="#E2E8F0" stroke-dasharray="4" />
    <text x="505" y="938.3" class="font-sans text-body-sm" text-anchor="end">4.0</text>
    <!-- 2.0 -->
    <line x1="520" y1="1006.6" x2="1080" y2="1006.6" stroke="#E2E8F0" stroke-dasharray="4" />
    <text x="505" y="1011.6" class="font-sans text-body-sm" text-anchor="end">2.0</text>
    <!-- 0.0 -->
    <text x="505" y="1085" class="font-sans text-body-sm" text-anchor="end">0.0</text>

    <!-- Bars -->
    <!-- Max height = 220px for 6.0 value. (Y_base = 1080, scale = 36.666px per unit) -->
    
    <!-- 2015: 4.44 (h=162.8, y=917.2) -->
    <rect x="540" y="917.2" width="34" height="162.8" fill="url(#barGrad)" rx="4" />
    <text x="557" y="907.2" class="font-sans text-bold" font-size="12" text-anchor="middle">4.44</text>
    <text x="557" y="1105" class="font-sans text-body-sm" text-anchor="middle">2015</text>

    <!-- 2016: 5.00 (h=183.3, y=896.7) -->
    <rect x="594" y="896.7" width="34" height="183.3" fill="url(#barGrad)" rx="4" />
    <text x="611" y="886.7" class="font-sans text-bold" font-size="12" text-anchor="middle">5.00</text>
    <text x="611" y="1105" class="font-sans text-body-sm" text-anchor="middle">2016</text>

    <!-- 2017: 4.93 (h=180.7, y=899.3) -->
    <rect x="648" y="899.3" width="34" height="180.7" fill="url(#barGrad)" rx="4" />
    <text x="665" y="889.3" class="font-sans text-bold" font-size="12" text-anchor="middle">4.93</text>
    <text x="665" y="1105" class="font-sans text-body-sm" text-anchor="middle">2017</text>

    <!-- 2018: 5.04 (h=184.8, y=895.2) -->
    <rect x="702" y="895.2" width="34" height="184.8" fill="url(#barGrad)" rx="4" />
    <text x="719" y="885.2" class="font-sans text-bold" font-size="12" text-anchor="middle">5.04</text>
    <text x="719" y="1105" class="font-sans text-body-sm" text-anchor="middle">2018</text>

    <!-- 2019: 5.12 (h=187.7, y=892.3) -->
    <rect x="756" y="892.3" width="34" height="187.7" fill="url(#barGrad)" rx="4" />
    <text x="773" y="882.3" class="font-sans text-bold" font-size="12" text-anchor="middle">5.12</text>
    <text x="773" y="1105" class="font-sans text-body-sm" text-anchor="middle">2019</text>

    <!-- 2020: 5.05 (h=185.1, y=894.9) -->
    <rect x="810" y="894.9" width="34" height="185.1" fill="url(#barGrad)" rx="4" />
    <text x="827" y="884.9" class="font-sans text-bold" font-size="12" text-anchor="middle">5.05</text>
    <text x="827" y="1105" class="font-sans text-body-sm" text-anchor="middle">2020</text>

    <!-- 2021: 5.04 (h=184.8, y=895.2) -->
    <rect x="864" y="895.2" width="34" height="184.8" fill="url(#barGrad)" rx="4" />
    <text x="881" y="885.2" class="font-sans text-bold" font-size="12" text-anchor="middle">5.04</text>
    <text x="881" y="1105" class="font-sans text-body-sm" text-anchor="middle">2021</text>

    <!-- 2022: 4.26 (h=156.2, y=923.8) -->
    <rect x="918" y="923.8" width="34" height="156.2" fill="url(#barGrad)" rx="4" />
    <text x="935" y="913.8" class="font-sans text-bold" font-size="12" text-anchor="middle">4.26</text>
    <text x="935" y="1105" class="font-sans text-body-sm" text-anchor="middle">2022</text>

    <!-- 2023: 4.21 (h=154.3, y=925.7) -->
    <rect x="972" y="925.7" width="34" height="154.3" fill="url(#barGrad)" rx="4" />
    <text x="989" y="915.7" class="font-sans text-bold" font-size="12" text-anchor="middle">4.21</text>
    <text x="989" y="1105" class="font-sans text-body-sm" text-anchor="middle">2023</text>

    <!-- 2024: 4.03 (h=147.7, y=932.3) -->
    <rect x="1026" y="932.3" width="34" height="147.7" fill="url(#barGrad)" rx="4" />
    <text x="1043" y="922.3" class="font-sans text-bold" font-size="12" text-anchor="middle">4.03</text>
    <text x="1043" y="1105" class="font-sans text-body-sm" text-anchor="middle">2024</text>

    <!-- Baseline Overlay (to hide bottom rounded corners) -->
    <line x1="520" y1="1080" x2="1080" y2="1080" stroke="#CBD5E1" stroke-width="2" />


    <!-- ================= ROW 3 ================= -->
    <!-- Donut Card -->
    <rect x="80" y="1170" width="480" height="460" rx="16" fill="#ffffff" filter="url(#shadow)" />
    <rect x="120" y="1210" width="4" height="24" fill="#BC002D" rx="2" />
    <text x="135" y="1229" class="font-serif title-card">Population by Nationality</text>

    <!-- Donut Chart -->
    <g transform="rotate(-60 320 1380)">
        <!-- Japanese 97.5% (673.87) -->
        <circle cx="320" cy="1380" r="110" fill="none" stroke="#BC002D" stroke-width="45" stroke-dasharray="673.87 691.15" stroke-dashoffset="0" />
        <!-- Chinese 0.6% (4.15) -->
        <circle cx="320" cy="1380" r="110" fill="none" stroke="#F4A261" stroke-width="45" stroke-dasharray="4.15 691.15" stroke-dashoffset="-673.87" />
        <!-- Vietnamese 0.4% (2.76) -->
        <circle cx="320" cy="1380" r="110" fill="none" stroke="#2A9D8F" stroke-width="45" stroke-dasharray="2.76 691.15" stroke-dashoffset="-678.02" />
        <!-- S. Korean 0.3% (2.07) -->
        <circle cx="320" cy="1380" r="110" fill="none" stroke="#264653" stroke-width="45" stroke-dasharray="2.07 691.15" stroke-dashoffset="-680.78" />
        <!-- Other 1.2% (8.29) -->
        <circle cx="320" cy="1380" r="110" fill="none" stroke="#8D99AE" stroke-width="45" stroke-dasharray="8.29 691.15" stroke-dashoffset="-682.85" />
    </g>

    <!-- Donut Center Text -->
    <text x="320" y="1375" class="font-sans title-main" font-size="32" text-anchor="middle">124M</text>
    <text x="320" y="1395" class="font-sans text-body-sm" text-anchor="middle">Total Population</text>

    <!-- Legend Grid -->
    <!-- Row 1 -->
    <circle cx="120" cy="1540" r="6" fill="#BC002D" />
    <text x="135" y="1545" class="font-sans text-body-sm text-bold">Japanese (97.5%)</text>

    <circle cx="270" cy="1540" r="6" fill="#F4A261" />
    <text x="285" y="1545" class="font-sans text-body-sm text-bold">Chinese (0.6%)</text>

    <circle cx="410" cy="1540" r="6" fill="#2A9D8F" />
    <text x="425" y="1545" class="font-sans text-body-sm text-bold">Vietnamese (0.4%)</text>

    <!-- Row 2 -->
    <circle cx="120" cy="1575" r="6" fill="#264653" />
    <text x="135" y="1580" class="font-sans text-body-sm text-bold">South Korean (0.3%)</text>

    <circle cx="270" cy="1575" r="6" fill="#8D99AE" />
    <text x="285" y="1580" class="font-sans text-body-sm text-bold">Other (1.2%)</text>


    <!-- Destinations Card -->
    <rect x="590" y="1170" width="530" height="460" rx="16" fill="#ffffff" filter="url(#shadow)" />
    <rect x="630" y="1210" width="4" height="24" fill="#BC002D" rx="2" />
    <text x="645" y="1229" class="font-serif title-card">Must-Visit Destinations</text>

    <!-- Dest 1: Tokyo -->
    <rect x="630" y="1270" width="220" height="80" rx="10" fill="#F8FAFC" />
    <rect x="630" y="1270" width="8" height="80" fill="#BC002D" rx="4" />
    <rect x="634" y="1270" width="4" height="80" fill="#BC002D" />
    <text x="655" y="1305" class="font-sans text-bold" font-size="16">Tokyo</text>
    <text x="655" y="1325" class="font-sans text-body-sm">Capital of culture &amp; tech</text>
    <path d="M 830,1305 L 835,1310 L 830,1315" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dest 2: Kyoto -->
    <rect x="870" y="1270" width="220" height="80" rx="10" fill="#F8FAFC" />
    <rect x="870" y="1270" width="8" height="80" fill="#E87A90" rx="4" />
    <rect x="874" y="1270" width="4" height="80" fill="#E87A90" />
    <text x="895" y="1305" class="font-sans text-bold" font-size="16">Kyoto</text>
    <text x="895" y="1325" class="font-sans text-body-sm">Heart of traditional Japan</text>
    <path d="M 1070,1305 L 1075,1310 L 1070,1315" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dest 3: Osaka -->
    <rect x="630" y="1370" width="220" height="80" rx="10" fill="#F8FAFC" />
    <rect x="630" y="1370" width="8" height="80" fill="#F4A261" rx="4" />
    <rect x="634" y="1370" width="4" height="80" fill="#F4A261" />
    <text x="655" y="1405" class="font-sans text-bold" font-size="16">Osaka</text>
    <text x="655" y="1425" class="font-sans text-body-sm">The nation's kitchen</text>
    <path d="M 830,1405 L 835,1410 L 830,1415" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dest 4: Hiroshima/Miyajima -->
    <rect x="870" y="1370" width="220" height="80" rx="10" fill="#F8FAFC" />
    <rect x="870" y="1370" width="8" height="80" fill="#2A9D8F" rx="4" />
    <rect x="874" y="1370" width="4" height="80" fill="#2A9D8F" />
    <text x="895" y="1405" class="font-sans text-bold" font-size="16">Hiroshima / Miyajima</text>
    <text x="895" y="1425" class="font-sans text-body-sm">History &amp; scenic beauty</text>
    <path d="M 1070,1405 L 1075,1410 L 1070,1415" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dest 5: Mount Fuji/Hakone -->
    <rect x="630" y="1470" width="220" height="80" rx="10" fill="#F8FAFC" />
    <rect x="630" y="1470" width="8" height="80" fill="#264653" rx="4" />
    <rect x="634" y="1470" width="4" height="80" fill="#264653" />
    <text x="655" y="1505" class="font-sans text-bold" font-size="16">Mount Fuji &amp; Hakone</text>
    <text x="655" y="1525" class="font-sans text-body-sm">Iconic views &amp; hot springs</text>
    <path d="M 830,1505 L 835,1510 L 830,1515" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dest 6: Hokkaido -->
    <rect x="870" y="1470" width="220" height="80" rx="10" fill="#F8FAFC" />
    <rect x="870" y="1470" width="8" height="80" fill="#1C2B4B" rx="4" />
    <rect x="874" y="1470" width="4" height="80" fill="#1C2B4B" />
    <text x="895" y="1505" class="font-sans text-bold" font-size="16">Hokkaido</text>
    <text x="895" y="1525" class="font-sans text-body-sm">Pristine nature &amp; winter sports</text>
    <path d="M 1070,1505 L 1075,1510 L 1070,1515" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>


    <!-- ================= FOOTER ================= -->
    <line x1="80" y1="1690" x2="1120" y2="1690" stroke="#CBD5E1" stroke-width="1" />
    <text x="80" y="1720" class="font-sans text-body-sm">Data sources: World Bank, Statistics Bureau of Japan (Approx. 2023-2024).</text>
    <text x="1120" y="1720" class="font-sans text-body-sm" text-anchor="end">Created for Editorial Infographics</text>

</svg>