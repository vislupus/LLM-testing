  <g transform="translate(620, 140)">
    <rect width="520" height="380" rx="16" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="30" y="50" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#334155">About Japan</text>
    <foreignObject x="30" y="70" width="460" height="280">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.6; color: #475569;">
        Japan is an island nation in East Asia comprising four main islands—Honshu, Hokkaido, Kyushu, and Shikoku—along with nearly 7,000 smaller islands. Spanning approximately 377,975 square kilometers, it features diverse landscapes from tropical beaches to alpine peaks.
        <br/><br/>
        With a population exceeding 123 million, Japan harmoniously blends millennia-old traditions with pioneering technology. The constitutional monarchy maintains the Emperor as ceremonial head of state while governance operates through a parliamentary system led by a Prime Minister.
      </div>
    </foreignObject>
  </g>
  
  <g transform="translate(60, 540)">
    <rect width="1080" height="100" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="540" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">Economic Overview</text>
    <foreignObject x="40" y="50" width="1000" height="50">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #64748b; text-align: center;">
        Japan maintains its position as the world's third-largest economy, characterized by advanced manufacturing, technological innovation, and significant global trade relationships, despite recent demographic challenges and currency fluctuations affecting nominal valuations.
      </div>
    </foreignObject>
  </g>
  
  <g transform="translate(60, 660)">
    <rect width="360" height="420" rx="16" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="30" y="50" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#334155">Economic Trends</text>
    <foreignObject x="30" y="70" width="300" height="320">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6; color: #475569;">
        Japan's nominal GDP peaked in 2019 at $5.12 trillion before experiencing volatility from global economic shifts and yen depreciation against the dollar.
        <br/><br/>
        The decline to $4.03 trillion in 2024 primarily reflects exchange rate movements rather than fundamental economic contraction. Japan continues dominating global markets in automotive manufacturing, robotics, precision machinery, and electronics.
        <br/><br/>
        <strong>Key Metrics:</strong><br/>
        • Peak GDP: 2019 ($5.12T)<br/>
        • 2024 GDP: $4.03T<br/>
        • Decade Average: $4.71T
      </div>
    </foreignObject>
  </g>
  
