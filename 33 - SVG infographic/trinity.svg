<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8e1e7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Wave pattern for subtle background -->
    <pattern id="wavePattern" patternUnits="userSpaceOnUse" width="200" height="100">
      <path d="M0,50 Q50,30 100,50 T200,50" fill="none" stroke="#b2ebf2" stroke-width="2" opacity="0.3"/>
    </pattern>
    
    <!-- Card shadow filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    
    <!-- GDP bar gradient -->
    <linearGradient id="gdpGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0288d1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Population pie gradients -->
    <linearGradient id="jpnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vieGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="korGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f44336;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="otherGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#607d8b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#455a64;stop-opacity:1" />
    </linearGradient>
    
    <!-- City icon gradient -->
    <radialGradient id="cityGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd740;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffab00;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Map outline gradient -->
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#01579b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGradient)"/>
  <rect width="1200" height="1800" fill="url(#wavePattern)" opacity="0.4"/>
  
  <!-- Main Title -->
  <text x="600" y="100" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="48" fill="#0d47a1" letter-spacing="1">
    Japan at a glance
  </text>
  <line x1="400" y1="140" x2="800" y2="140" stroke="#0d47a1" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- First Row: Map and Explanatory Text -->
  <g transform="translate(0, 180)">
    <!-- Map Card -->
    <rect x="50" y="0" width="550" height="400" rx="12" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
    
    <!-- Stylized Map of Japan -->
    <g transform="translate(100, 50)">
      <!-- Main islands outline -->
      <path d="M150,100 C180,80 200,60 220,80 C240,100 260,80 280,100 C300,120 320,100 340,120 C360,140 380,120 400,140 C420,160 440,140 460,160 C480,180 500,160 520,180 C540,200 560,180 580,200 C600,220 620,200 640,220 C660,240 680,220 700,240 C720,260 740,240 760,260 C780,280 800,260 820,280 C840,300 860,280 880,300 C900,320 920,300 940,320 C960,340 980,320 1000,340 C1020,360 1040,340 1060,360 C1080,380 1100,360 1120,380" 
            stroke="#0288d1" stroke-width="3" fill="none" stroke-linecap="round"/>
      
      <!-- Hokkaido (top island) -->
      <path d="M100,50 L200,30 L280,60 L260,120 L180,100 Z" stroke="url(#mapGradient)" stroke-width="2" fill="rgba(2,136,209,0.1)"/>
      
      <!-- Honshu (main island) -->
      <path d="M300,100 L400,80 L500,120 L480,200 L400,180 L320,200 L280,150 Z" stroke="url(#mapGradient)" stroke-width="2" fill="rgba(2,136,209,0.1)"/>
      
      <!-- Shikoku (small island) -->
      <path d="M420,220 L460,210 L480,240 L440,260 L400,240 Z" stroke="url(#mapGradient)" stroke-width="2" fill="rgba(2,136,209,0.1)"/>
      
      <!-- Kyushu (southern island) -->
      <path d="M500,260 L580,250 L600,300 L520,310 L500,280 Z" stroke="url(#mapGradient)" stroke-width="2" fill="rgba(2,136,209,0.1)"/>
      
      <!-- City markers with gradients -->
      <circle cx="480" cy="150" r="12" fill="url(#cityGradient)" stroke="#f57f17" stroke-width="2"/>
      <circle cx="500" cy="180" r="10" fill="url(#cityGradient)" stroke="#f57f17" stroke-width="2"/>
      <circle cx="420" cy="200" r="12" fill="url(#cityGradient)" stroke="#f57f17" stroke-width="2"/>
      <circle cx="380" cy="140" r="10" fill="url(#cityGradient)" stroke="#f57f17" stroke-width="2"/>
      
      <!-- City labels -->
      <text x="480" y="148" text-anchor="center" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#0d47a1">Tokyo</text>
      <text x="500" y="178" text-anchor="center" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#0d47a1">Yokohama</text>
      <text x="420" y="218" text-anchor="center" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#0d47a1">Osaka</text>
      <text x="380" y="168" text-anchor="center" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#0d47a1">Nagoya</text>
    </g>
    
    <!-- Explanatory Text Card -->
    <rect x="650" y="0" width="500" height="400" rx="12" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
    
    <!-- Text Content -->
    <text x="675" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="24" fill="#0d47a1" letter-spacing="0.5">
      About Japan
    </text>
    <text x="675" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="18" fill="#1a237e" line-height="1.6" width="480">
      Japan is an island country in East Asia, located in the Pacific Ocean. It consists of four main islands—Honshu, Hokkaido, Kyushu, and Shikoku—as well as numerous smaller islands. With a population of approximately 125 million, it is known for its unique blend of traditional culture and cutting-edge technology, stunning natural landscapes, and vibrant cities.
    </text>
    <text x="675" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="18" fill="#1a237e" line-height="1.6" width="480">
      Capital: Tokyo
      <tspan x="675" y="310">Population: ~125 million</tspan>
      <tspan x="675" y="340">Language: Japanese</tspan>
      <tspan x="675" y="370">Currency: Japanese Yen (¥)</tspan>
    </text>
  </g>
  
  <!-- Full-width Paragraph -->
  <g transform="translate(0, 620)">
    <rect x="50" y="0" width="1100" height="120" rx="8" fill="#ffffff" filter="url(#cardShadow)" opacity="0.9"/>
    <text x="75" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="20" fill="#0d47a1" line-height="1.6" width="1050">
      Japan maintains a constitutional monarchy with a parliamentary democracy. The country has the world's third-largest economy by nominal GDP, renowned for its automotive and electronics industries. Despite its modernity, Japan preserves rich traditions, from tea ceremonies and geisha culture to seasonal festivals and ancient temples.
    </text>
  </g>
  
  <!-- Second Row: GDP Bar Chart -->
  <g transform="translate(0, 780)">
    <!-- Text Card -->
    <rect x="50" y="0" width="550" height="500" rx="12" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
    
    <text x="75" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#0d47a1">
      Japan's Nominal GDP (2015-2024)
    </text>
    <text x="75" y="100" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="18" fill="#1a237e">
      GDP in current US$ trillions
    </text>
    
    <!-- Bar Chart -->
    <g transform="translate(75, 150)">
      <!-- Axes -->
      <line x1="0" y1="300" x2="450" y2="300" stroke="#0d47a1" stroke-width="2"/>
      <line x1="0" y1="300" x2="0" y2="20" stroke="#0d47a1" stroke-width="2"/>
      
      <!-- Year labels -->
      <text x="-15" y="320" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#1a237e">2015</text>
      <text x="90" y="320" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#1a237e">2016</text>
      <text x="195" y="320" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#1a237e">2017</text>
      <text x="300" y="320" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#1a237e">2018</text>
      <text x="405" y="320" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#1a237e">2019</text>
      
      <!-- GDP bars -->
      <rect x="10" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -44.4)">
        <animate attributeName="height" from="0" to="44.4" dur="1s" fill="freeze"/>
      </rect>
      <rect x="115" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -50)">
        <animate attributeName="height" from="0" to="50" dur="1s" fill="freeze"/>
      </rect>
      <rect x="220" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -49.3)">
        <animate attributeName="height" from="0" to="49.3" dur="1s" fill="freeze"/>
      </rect>
      <rect x="325" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -50.4)">
        <animate attributeName="height" from="0" to="50.4" dur="1s" fill="freeze"/>
      </rect>
      <rect x="430" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -51.2)">
        <animate attributeName="height" from="0" to="51.2" dur="1s" fill="freeze"/>
      </rect>
      
      <!-- Value labels on top of bars -->
      <text x="40" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">4.44</text>
      <text x="145" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">5.00</text>
      <text x="250" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">4.93</text>
      <text x="355" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">5.04</text>
      <text x="460" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">5.12</text>
    </g>
    
    <!-- Additional years (2020-2024) -->
    <g transform="translate(75, 150)">
      <!-- Continue bars from previous position -->
      <rect x="10" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -50.5)"/>
      <rect x="115" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -50.4)"/>
      <rect x="220" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -50.4)"/>
      <rect x="325" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -42.6)"/>
      <rect x="430" y="300" width="60" height="0" fill="url(#gdpGradient)" stroke="#0288d1" stroke-width="1" transform="translate(0, -42.1)"/>
      
      <!-- Value labels -->
      <text x="40" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">5.05</text>
      <text x="145" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">5.04</text>
      <text x="250" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">4.26</text>
      <text x="355" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">4.21</text>
      <text x="460" y="280" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#0d47a1">4.03</text>
    </g>
    
    <!-- Legend -->
    <rect x="75" y="450" width="400" height="30" fill="none"/>
    <text x="85" y="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#666">
      Data source: World Bank (2015-2024)
    </text>
  </g>
  
  <!-- Third Row: Population Pie Chart and Travel Info -->
  <g transform="translate(0, 1380)">
    <!-- Population Card -->
    <rect x="50" y="0" width="550" height="400" rx="12" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
    
    <text x="75" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#0d47a1">
      Population Composition
    </text>
    <text x="75" y="100" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="18" fill="#1a237e">
      By nationality/ethnic grouping
    </text>
    
    <!-- Donut chart -->
    <g transform="translate(275, 180)">
      <!-- Japanese (97.5%) -->
      <circle cx="0" cy="0" r="120" fill="url(#jpnGradient)" stroke="none"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#4caf50" stroke-width="3"/>
      
      <!-- Chinese (0.6%) -->
      <path d="M0,0 L120,0 A120,120 0 0 1 30,118" fill="url(#chnGradient)" stroke="none"/>
      <path d="M0,0 L120,0 A120,120 0 0 1 30,118" fill="none" stroke="#ff9800" stroke-width="3" stroke-dasharray="2,2"/>
      
      <!-- Vietnamese (0.4%) -->
      <path d="M0,0 L30,118 A120,120 0 0 1 -20,115" fill="url(#vieGradient)" stroke="none"/>
      <path d="M0,0 L30,118 A120,120 0 0 1 -20,115" fill="none" stroke="#9c27b0" stroke-width="3" stroke-dasharray="2,2"/>
      
      <!-- South Korean (0.3%) -->
      <path d="M0,0 L-20,115 A120,120 0 0 1 -50,100" fill="url(#korGradient)" stroke="none"/>
      <path d="M0,0 L-20,115 A120,120 0 0 1 -50,100" fill="none" stroke="#f44336" stroke-width="3" stroke-dasharray="2,2"/>
      
      <!-- Other (1.2%) -->
      <path d="M0,0 L-50,100 A120,120 0 0 1 0,-120" fill="url(#otherGradient)" stroke="none"/>
      <path d="M0,0 L-50,100 A120,120 0 0 1 0,-120" fill="none" stroke="#607d8b" stroke-width="3" stroke-dasharray="2,2"/>
      
      <!-- Center circle -->
      <circle cx="0" cy="0" r="60" fill="#ffffff" stroke="#ffffff" stroke-width="5"/>
    </g>
    
    <!-- Legend -->
    <rect x="75" y="320" width="400" height="60" fill="none"/>
    <text x="85" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#666">
      Japanese: 97.5% | Chinese: 0.6% | Vietnamese: 0.4% | South Korean: 0.3% | Other: 1.2%
    </text>
  </g>
  
  <!-- Travel Info Card -->
  <rect x="650" y="1380" width="500" height="400" rx="12" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
  
  <text x="675" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="28" fill="#0d47a1">
    What to Visit
  </text>
  <text x="675" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="18" fill="#1a237e" line-height="1.8" width="480">
    <tspan x="675" y="110" font-weight="500">Tokyo</tspan>
    <tspan x="675" y="140">The bustling capital with modern skyscrapers and historic temples</tspan>
    
    <tspan x="675" y="180" font-weight="500">Kyoto</tspan>
    <tspan x="675" y="210">Ancient capital with beautiful temples, gardens, and geisha culture</tspan>
    
    <tspan x="675" y="250" font-weight="500">Osaka</tspan>
    <tspan x="675" y="280">Famous for its food scene, nightlife, and friendly locals</tspan>
    
    <tspan x="675" y="320" font-weight="500">Hiroshima/Miyajima</tspan>
    <tspan x="675" y="350">Peace memorial park and the iconic floating torii gate</tspan>
    
    <tspan x="675" y="390" font-weight="500">Mount Fuji/Hakone</tspan>
    <tspan x="675" y="420">Iconic volcano and hot spring resort area</tspan>
    
    <tspan x="675" y="460" font-weight="500">Hokkaido</tspan>
    <tspan x="675" y="490">Northern island known for winter sports and natural beauty</tspan>
  </text>
  
  <!-- Source Note -->
  <text x="600" y="1850" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="14" fill="#666">
    Source: World Bank, Japan National Tourism Organization
  </text>
</svg>
