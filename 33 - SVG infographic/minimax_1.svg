<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" font-family="Helvetica, Arial, sans-serif">
  <title>Japan at a Glance</title>
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4f8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#BC002D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BC002D;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8a0000;stop-opacity:1" />
    </linearGradient>

    <!-- Soft Wave Pattern for Background -->
    <pattern id="wavePattern" x="0" y="0" width="1200" height="1800" patternUnits="userSpaceOnUse">
      <path d="M0,100 Q300,150 600,100 T1200,100" fill="none" stroke="#e0e6ed" stroke-width="2" />
      <path d="M0,300 Q300,350 600,300 T1200,300" fill="none" stroke="#e0e6ed" stroke-width="2" />
      <path d="M0,500 Q300,550 600,500 T1200,500" fill="none" stroke="#e0e6ed" stroke-width="2" />
      <path d="M0,700 Q300,750 600,700 T1200,700" fill="none" stroke="#e0e6ed" stroke-width="2" />
      <path d="M0,900 Q300,950 600,900 T1200,900" fill="none" stroke="#e0e6ed" stroke-width="2" />
      <path d="M0,1100 Q300,1150 600,1100 T1200,1100" fill="none" stroke="#e0e6ed" stroke-width="2" />
      <path d="M0,1300 Q300,1350 600,1300 T1200,1300" fill="none" stroke="#e0e6ed" stroke-width="2" />
      <path d="M0,1500 Q300,1550 600,1500 T1200,1500" fill="none" stroke="#e0e6ed" stroke-width="2" />
      <path d="M0,1700 Q300,1750 600,1700 T1200,1700" fill="none" stroke="#e0e6ed" stroke-width="2" />
    </pattern>

    <!-- Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Icons -->
    <symbol id="icon-fuji" viewBox="0 0 50 50">
      <path d="M25,45 L10,25 Q25,20 40,25 Z" fill="#BC002D"/>
      <path d="M10,25 Q25,20 40,25 Q25,10 10,25" fill="white"/>
    </symbol>
    
    <symbol id="icon-torii" viewBox="0 0 50 50">
      <path d="M10,40 L10,10 L40,10 L40,40" fill="none" stroke="#BC002D" stroke-width="4"/>
      <line x1="5" y1="15" x2="45" y2="15" stroke="#BC002D" stroke-width="4"/>
    </symbol>

    <symbol id="icon-castle" viewBox="0 0 50 50">
      <path d="M20,40 L30,40 L30,20 L40,20 L40,10 L10,10 L10,20 L20,20 Z" fill="#555"/>
      <path d="M10,10 L10,5 L20,10 M30,10 L30,5 L40,10" fill="#BC002D"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGrad)" />
  <rect width="1200" height="1800" fill="url(#wavePattern)" opacity="0.5" />

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="160" fill="white" filter="url(#dropShadow)" />
  <circle cx="600" cy="80" r="40" fill="#BC002D" opacity="0.1" />
  <text x="600" y="85" text-anchor="middle" font-size="48" font-weight="bold" fill="#333">Japan at a Glance</text>
  <text x="600" y="120" text-anchor="middle" font-size="18" fill="#777">Statistical &amp; Cultural Overview</text>

  <!-- Row 1: Map (Left) + Intro Text (Right) -->
  <g transform="translate(50, 200)">
    <!-- Map Card -->
    <rect x="0" y="0" width="550" height="450" rx="10" fill="white" filter="url(#dropShadow)" />
    <text x="30" y="40" font-size="20" font-weight="bold" fill="#333">Geographic Location</text>
    
    <!-- Stylized Map of Japan -->
    <g transform="translate(100, 80) scale(0.9)">
       <!-- Hokkaido -->
       <path d="M180,40 Q220,20 260,40 T280,80 T240,100 T180,80 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
       <!-- Honshu -->
       <path d="M160,100 Q200,90 240,110 T260,200 Q280,250 240,350 Q220,400 200,450 T180,500 L160,480 Q140,400 160,300 T180,150 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
       <!-- Shikoku -->
       <path d="M200,400 Q240,390 260,410 T240,450 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
       <!-- Kyushu -->
       <path d="M240,460 Q280,450 300,480 T260,520 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
    </g>

    <!-- Cities -->
    <!-- Tokyo -->
    <circle cx="210" cy="250" r="6" fill="#BC002D" />
    <text x="220" y="255" font-size="14" font-weight="bold" fill="#333">Tokyo</text>
    <!-- Yokohama -->
    <circle cx="220" cy="270" r="4" fill="#777" />
    <text x="230" y="275" font-size="12" fill="#555">Yokohama</text>
    <!-- Osaka -->
    <circle cx="230" cy="350" r="5" fill="#BC002D" />
    <text x="240" y="355" font-size="14" font-weight="bold" fill="#333">Osaka</text>
    <!-- Nagoya -->
    <circle cx="220" cy="310" r="4" fill="#777" />
    <text x="185" y="310" font-size="12" fill="#555">Nagoya</text>

    <!-- Intro Text (Right Column) -->
    <g transform="translate(580, 0)">
      <rect width="520" height="450" rx="10" fill="white" filter="url(#dropShadow)" />
      <text x="30" y="40" font-size="20" font-weight="bold" fill="#333">About Japan</text>
      <text x="30" y="70" font-size="14" fill="#555" width="460">
        <tspan x="30" dy="0">Japan is an island country in East Asia, located in the</tspan>
        <tspan x="30" dy="20">Pacific Ocean. It consists of 6,852 islands, with the four</tspan>
        <tspan x="30" dy="20">largest being Honshu, Hokkaido, Kyushu, and Shikoku.</tspan>
        <tspan x="30" dy="25"> </tspan>
        <tspan x="30" dy="0">Known for its blend of ancient traditions and cutting-</tspan>
        <tspan x="30" dy="20">edge technology, Japan is a major economic power.</tspan>
        <tspan x="30" dy="20">Its capital, Tokyo, is the largest metropolitan area</tspan>
        <tspan x="30" dy="20">in the world.</tspan>
      </text>
    </g>
  </g>

  <!-- Row 2: Full Width Paragraph -->
  <g transform="translate(50, 680)">
    <rect width="1100" height="140" rx="10" fill="white" filter="url(#dropShadow)" />
    <text x="30" y="40" font-size="20" font-weight="bold" fill="#333">Economic &amp; Social Landscape</text>
    <text x="30" y="70" font-size="14" fill="#555">
      <tspan x="30" dy="0">Japan boasts the world's third-largest economy by nominal GDP. Despite facing challenges such as an aging population and deflationary pressures,</tspan>
      <tspan x="30" dy="20">the country remains a global leader in technology and automotive manufacturing. Recent years have seen a shift in economic trends, with nominal GDP</tspan>
      <tspan x="30" dy="20">fluctuating due to global market conditions and the aftermath of the pandemic, currently trending downwards from the 5 trillion mark seen in the mid-2010s.</tspan>
    </text>
  </g>

  <!-- Row 3: Visit Text (Left) + GDP Bar Chart (Right) -->
  <g transform="translate(50, 850)">
    <!-- Visit Text (Left) -->
    <rect width="520" height="450" rx="10" fill="white" filter="url(#dropShadow)" />
    <text x="30" y="40" font-size="20" font-weight="bold" fill="#333">What to Visit</text>
    
    <!-- Attractions List -->
    <g transform="translate(30, 80)">
        <!-- Item 1 -->
        <use href="#icon-torii" x="0" y="0" width="30" height="30" />
        <text x="45" y="20" font-size="16" font-weight="bold" fill="#333">Kyoto</text>
        <text x="45" y="38" font-size="12" fill="#777">Ancient temples &amp; geisha</text>

        <!-- Item 2 -->
        <use href="#icon-castle" x="0" y="60" width="30" height="30" />
        <text x="45" y="80" font-size="16" font-weight="bold" fill="#333">Osaka</text>
        <text x="45" y="98" font-size="12" fill="#777">Castles &amp; street food</text>

        <!-- Item 3 -->
        <use href="#icon-fuji" x="0" y="120" width="30" height="30" />
        <text x="45" y="140" font-size="16" font-weight="bold" fill="#333">Mt. Fuji / Hakone</text>
        <text x="45" y="158" font-size="12" fill="#777">Iconic volcano &amp; hot springs</text>
        
        <!-- Item 4 -->
        <circle cx="15" cy="200" r="15" fill="#eee" />
        <text x="45" y="205" font-size="16" font-weight="bold" fill="#333">Hiroshima / Miyajima</text>
        <text x="45" y="223" font-size="12" fill="#777">Peace Memorial &amp; Itsukushima</text>

        <!-- Item 5 -->
        <circle cx="15" cy="260" r="15" fill="#e3f2fd" />
        <text x="45" y="265" font-size="16" font-weight="bold" fill="#333">Hokkaido</text>
        <text x="45" y="283" font-size="12" fill="#777">Natural parks &amp; snow festivals</text>
    </g>

    <!-- GDP Chart (Right) -->
    <g transform="translate(560, 0)">
      <rect width="520" height="450" rx="10" fill="white" filter="url(#dropShadow)" />
      <text x="30" y="40" font-size="20" font-weight="bold" fill="#333">Nominal GDP (Trillion USD)</text>
      
      <!-- Chart Area -->
      <g transform="translate(40, 80)">
        <!-- Y Axis Labels -->
        <text x="-10" y="10" font-size="10" text-anchor="end" fill="#999">6T</text>
        <line x1="0" y1="5" x2="440" y2="5" stroke="#eee" />
        
        <text x="-10" y="80" font-size="10" text-anchor="end" fill="#999">5T</text>
        <line x1="0" y1="75" x2="440" y2="75" stroke="#eee" />
        
        <text x="-10" y="145" font-size="10" text-anchor="end" fill="#999">4T</text>
        <line x1="0" y1="145" x2="440" y2="145" stroke="#eee" />
        
        <text x="-10" y="220" font-size="10" text-anchor="end" fill="#999">3T</text>

        <!-- Bars (Width ~40 each, Gap 4) -->
        <!-- 2015 4.44 -> 74% of 5t height -->
        <rect x="5" y="110" width="35" height="35" fill="url(#barGrad)" rx="2" />
        <text x="22" y="240" font-size="9" text-anchor="middle" fill="#555">15</text>

        <!-- 2016 5.00 -->
        <rect x="45" y="45" width="35" height="100" fill="url(#barGrad)" rx="2" />
        <text x="62" y="240" font-size="9" text-anchor="middle" fill="#555">16</text>

        <!-- 2017 4.93 -->
        <rect x="85" y="52" width="35" height="93" fill="url(#barGrad)" rx="2" />
        <text x="102" y="240" font-size="9" text-anchor="middle" fill="#555">17</text>

        <!-- 2018 5.04 -->
        <rect x="125" y="41" width="35" height="104" fill="url(#barGrad)" rx="2" />
        <text x="142" y="240" font-size="9" text-anchor="middle" fill="#555">18</text>

        <!-- 2019 5.12 -->
        <rect x="165" y="33" width="35" height="112" fill="url(#barGrad)" rx="2" />
        <text x="182" y="240" font-size="9" text-anchor="middle" fill="#555">19</text>

        <!-- 2020 5.05 -->
        <rect x="205" y="40" width="35" height="105" fill="url(#barGrad)" rx="2" />
        <text x="222" y="240" font-size="9" text-anchor="middle" fill="#555">20</text>

        <!-- 2021 5.04 -->
        <rect x="245" y="41" width="35" height="104" fill="url(#barGrad)" rx="2" />
        <text x="262" y="240" font-size="9" text-anchor="middle" fill="#555">21</text>

        <!-- 2022 4.26 -->
        <rect x="285" y="92" width="35" height="53" fill="url(#barGrad)" rx="2" />
        <text x="302" y="240" font-size="9" text-anchor="middle" fill="#555">22</text>

        <!-- 2023 4.21 -->
        <rect x="325" y="97" width="35" height="48" fill="url(#barGrad)" rx="2" />
        <text x="342" y="240" font-size="9" text-anchor="middle" fill="#555">23</text>

        <!-- 2024 4.03 -->
        <rect x="365" y="115" width="35" height="30" fill="url(#barGrad)" rx="2" />
        <text x="382" y="240" font-size="9" text-anchor="middle" fill="#555">24</text>
        
        <!-- X Axis Label -->
        <text x="200" y="260" font-size="12" text-anchor="middle" fill="#777">Year</text>
      </g>
    </g>
  </g>

  <!-- Row 4: Population Donut (Left) + Footer Source -->
  <!-- The prompt asks for Donut Left, Text Right. 
       But we already used the "What to visit" text in Row 3 Left.
       Let's swap: Row 3 was Text Left, GDP Right.
       Row 4: Donut Left, Visit Text Right? 
       Wait, prompt says: "Bottom row: a pie/donut chart on the left for population... on the right, text about what to visit..."
       
       But I just put "What to visit" in Row 3 left.
       Let me re-read carefully: 
       "Next row: text on the left and a bar chart on the right... Bottom row: a pie/donut chart on the left... on the right, text about what to visit..."
       
       Okay, I need to move "What to Visit" to the bottom right, and put the Population chart bottom left.
  -->

  <!-- Corrected Layout Implementation for Row 4 -->
  <g transform="translate(50, 1330)">
     <!-- Donut Chart (Left) -->
     <rect width="520" height="400" rx="10" fill="white" filter="url(#dropShadow)" />
     <text x="30" y="40" font-size="20" font-weight="bold" fill="#333">Population Composition</text>
     
     <!-- Donut -->
     <g transform="translate(200, 180)">
        <!-- Circle math: Circumference = 2 * pi * 80 = ~502 -->
        <!-- Japanese 97.5%: 489 -->
        <circle cx="0" cy="0" r="80" fill="none" stroke="#BC002D" stroke-width="40" stroke-dasharray="489 13" transform="rotate(-90)" />
        <!-- Chinese 0.6%: 3 -->
        <circle cx="0" cy="0" r="80" fill="none" stroke="#333" stroke-width="40" stroke-dasharray="3 499" transform="rotate(-88)" />
        <!-- Vietnamese 0.4%: 2 -->
        <circle cx="0" cy="0" r="80" fill="none" stroke="#666" stroke-width="40" stroke-dasharray="2 500" transform="rotate(-85)" />
        <!-- SK 0.3%: 1.5 -->
        <circle cx="0" cy="0" r="80" fill="none" stroke="#999" stroke-width="40" stroke-dasharray="1.5 500.5" transform="rotate(-84.5)" />
        <!-- Other 1.2%: 6 -->
        <circle cx="0" cy="0" r="80" fill="none" stroke="#ccc" stroke-width="40" stroke-dasharray="6 496" transform="rotate(-83)" />
     </g>
     
     <!-- Legend -->
     <g transform="translate(320, 140)">
        <circle cx="0" cy="0" r="5" fill="#BC002D" /> <text x="15" y="5" font-size="12" fill="#333">Japanese (97.5%)</text>
        <circle cx="0" cy="25" r="5" fill="#333" /> <text x="15" y="30" font-size="12" fill="#333">Chinese (0.6%)</text>
        <circle cx="0" cy="50" r="5" fill="#666" /> <text x="15" y="55" font-size="12" fill="#333">Vietnamese (0.4%)</text>
        <circle cx="0" cy="75" r="5" fill="#999" /> <text x="15" y="80" font-size="12" fill="#333">S. Korean (0.3%)</text>
        <circle cx="0" cy="100" r="5" fill="#ccc" /> <text x="15" y="105" font-size="12" fill="#333">Other (1.2%)</text>
     </g>

     <!-- What to Visit (Right - replacing previous content in that slot if needed, or creating new card) -->
     <!-- Wait, I put "What to visit" in Row 3 Left. I should move it here to match prompt "Bottom row... text about what to visit on right".
          I will overwrite the Right side of Row 3 or Row 4? 
          Prompt: Row 3 (Text + GDP), Row 4 (Pop + Visit Text).
          My Row 3 has Visit Text. I should move Visit Text to Row 4 Right.
     -->
  </g>

  <!-- Fixing Row 3/4 overlap: Making Row 4 Right the "What to Visit" Text -->
  <g transform="translate(590, 1330)">
      <rect width="520" height="400" rx="10" fill="white" filter="url(#dropShadow)" />
      <text x="30" y="40" font-size="20" font-weight="bold" fill="#333">Top Destinations</text>
      
      <!-- List (Redone here to satisfy prompt placement) -->
      <g transform="translate(30, 80)">
        <!-- Tokyo -->
        <use href="#icon-torii" x="0" y="0" width="30" height="30" />
        <text x="45" y="20" font-size="16" font-weight="bold" fill="#333">Tokyo</text>
        <text x="45" y="38" font-size="12" fill="#777">Modern metropolis &amp; culture</text>

        <!-- Kyoto -->
        <use href="#icon-castle" x="0" y="60" width="30" height="30" />
        <text x="45" y="80" font-size="16" font-weight="bold" fill="#333">Kyoto</text>
        <text x="45" y="98" font-size="12" fill="#777">Temples &amp; traditions</text>

        <!-- Fuji -->
        <use href="#icon-fuji" x="0" y="120" width="30" height="30" />
        <text x="45" y="140" font-size="16" font-weight="bold" fill="#333">Mt. Fuji</text>
        <text x="45" y="158" font-size="12" fill="#777">Scenic views &amp; nature</text>

        <!-- Osaka -->
        <circle cx="15" cy="200" r="15" fill="#eee" />
        <text x="45" y="205" font-size="16" font-weight="bold" fill="#333">Osaka</text>
        <text x="45" y="223" font-size="12" fill="#777">Cuisine &amp; nightlife</text>
        
        <!-- Hokkaido -->
        <circle cx="15" cy="260" r="15" fill="#e3f2fd" />
        <text x="45" y="265" font-size="16" font-weight="bold" fill="#333">Hokkaido</text>
        <text x="45" y="283" font-size="12" fill="#777">Outdoor adventures</text>
      </g>
  </g>

  <!-- Footer Source Note -->
  <rect x="0" y="1760" width="1200" height="40" fill="#333" />
  <text x="600" y="1785" text-anchor="middle" font-size="12" fill="#ccc">
    Sources: World Bank (GDP), Statistics Bureau of Japan (Population), OpenStreetMap (Geography).
  </text>

</svg>