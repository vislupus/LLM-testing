    <text class="h2" x="0" y="48">Four islands, countless contrasts</text>
    <text class="body" x="0" y="96">
      <tspan x="0" dy="0">Japan stretches along the Pacific Rim,</tspan>
      <tspan x="0" dy="29">with most people living in a highly</tspan>
      <tspan x="0" dy="29">connected urban belt on Honshu.</tspan>
    </text>


