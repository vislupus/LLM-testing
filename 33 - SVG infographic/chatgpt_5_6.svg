<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Japan at a glance</title>
  <desc id="desc">A modern editorial infographic about Japan with a stylized map, GDP bar chart, population composition donut chart, and travel highlights.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f5ef"/>
      <stop offset="42%" stop-color="#eef5f4"/>
      <stop offset="100%" stop-color="#f3eaf0"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#133c55"/>
      <stop offset="100%" stop-color="#2f6f73"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f47c74"/>
      <stop offset="100%" stop-color="#d64d65"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2f6f73"/>
      <stop offset="100%" stop-color="#79b9aa"/>
    </linearGradient>
    <linearGradient id="barHighlight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d64d65"/>
      <stop offset="100%" stop-color="#f49a83"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcf7a"/>
      <stop offset="100%" stop-color="#f47c74"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity="0.08"/>
    </filter>
    <clipPath id="roundMap">
      <rect x="70" y="260" width="560" height="430" rx="30"/>
    </clipPath>
    <style>
      .title { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 72px; font-weight: 800; letter-spacing: -2px; fill: #143247; }
      .kicker { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 3px; fill: #d64d65; }
      .h2 { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #143247; }
      .h3 { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #143247; }
      .body { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 450; line-height: 1.5; fill: #425b68; }
      .small { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #6e818a; }
      .tiny { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 650; fill: #6e818a; }
      .label { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #143247; }
      .number { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #143247; }
      .white { fill: #ffffff; }
      .card { fill: rgba(255,255,255,0.88); stroke: rgba(20,50,71,0.08); stroke-width: 1.5; }
      .rule { stroke: #d9e3e1; stroke-width: 1.5; }
      .axis { stroke: #b8c8c5; stroke-width: 1.5; }
      .grid { stroke: #dce6e4; stroke-width: 1; stroke-dasharray: 5 7; }
      .cityLine { stroke: #143247; stroke-width: 1.5; opacity: 0.55; }
    </style>
  </defs>

