    <circle cx="22" cy="22" r="22" fill="url(#sunGrad)"/>
    <path d="M11,25 C22,12 33,12 39,25 C30,21 20,21 11,25 Z" fill="#ffffff"/>
    <text class="body" x="66" y="3">
      <tspan x="66" dy="0">Japan’s identity is shaped by a long relationship with seasonality and place—from cherry blossoms and autumn foliage</tspan>
      <tspan x="66" dy="30">to snow country, subtropical islands and dense megacities. Efficient rail links make it possible to move quickly between</tspan>
      <tspan x="66" dy="30">quiet temple districts, contemporary architecture, regional food cultures and dramatic natural scenery.</tspan>
    </text>
  </g>

