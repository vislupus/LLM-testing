    <text class="body" x="0" y="96">
      <tspan x="0" dy="0">Japan remains one of the world’s</tspan>
      <tspan x="0" dy="29">largest national economies, with</tspan>
      <tspan x="0" dy="29">strength in advanced manufacturing,</tspan>
      <tspan x="0" dy="29">automotive, electronics, services</tspan>
      <tspan x="0" dy="29">and globally recognized brands.</tspan>
    </text>


