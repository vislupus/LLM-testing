<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFAFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDEBED;stop-opacity:1" />
    </linearGradient>
    
    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>

    <!-- Chart Gradient -->
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGradient)" />
  
  <!-- Decorative Sun Motif (Subtle) -->
  <circle cx="1000" cy="200" r="400" fill="#D32F2F" opacity="0.05" />

  <!-- Title -->
  <text x="60" y="100" font-size="64" font-weight="bold" fill="#2D2D2D" letter-spacing="-1">Japan at a glance</text>
  <line x1="60" y1="120" x2="200" y2="120" stroke="#D32F2F" stroke-width="6" />

  <!-- Row 1: Map + Intro -->
  <!-- Map Card -->
  <g transform="translate(60, 180)" filter="url(#cardShadow)">
    <rect width="500" height="500" rx="4" fill="#FFFFFF" />
    <!-- Stylized Map -->
    <svg x="50" y="50" width="400" height="400" viewBox="0 0 500 500">
       <!-- Sea -->
       <rect width="500" height="500" fill="#E3F2FD"/>
       <!-- Hokkaido -->
       <path d="M150,80 Q220,60 280,90 Q320,140 280,180 L240,180 Q200,150 150,180 Q100,150 150,80 Z" fill="#FFFFFF" stroke="#90A4AE" stroke-width="2"/>
       <!-- Honshu -->
       <path d="M240,180 Q260,180 280,200 Q350,250 380,300 Q400,350 350,400 L320,420 Q300,380 300,350 L300,320 L280,300 Q250,250 240,220 L220,200 Z" fill="#FFFFFF" stroke="#90A4AE" stroke-width="2"/>
       <!-- Shikoku -->
       <path d="M280,400 Q320,400 330,430 Q320,460 290,450 Z" fill="#FFFFFF" stroke="#90A4AE" stroke-width="2"/>
       <!-- Kyushu -->
       <path d="M180,440 Q240,430 260,470 Q240,510 180,490 Q140,460 180,440 Z" fill="#FFFFFF" stroke="#90A4AE" stroke-width="2"/>
       
       <!-- Cities -->
       <!-- Tokyo (approx 320, 280) -->
       <circle cx="320" cy="280" r="6" fill="#D32F2F" />
       <text x="330" y="285" font-size="14" font-weight="bold" fill="#2D2D2D">Tokyo</text>
       
       <!-- Yokohama (approx 315, 295) -->
       <circle cx="315" cy="295" r="4" fill="#D32F2F" />
       <text x="325" y="300" font-size="12" fill="#555">Yokohama</text>

       <!-- Nagoya (approx 300, 330) -->
       <circle cx="300" cy="330" r="4" fill="#D32F2F" />
       <text x="260" y="335" font-size="12" fill="#555">Nagoya</text>

       <!-- Osaka (approx 280, 360) -->
       <circle cx="280" cy="360" r="4" fill="#D32F2F" />
       <text x="240" y="365" font-size="12" fill="#555">Osaka</text>
    </svg>
    <text x="20" y="40" font-size="18" font-weight="bold" fill="#2D2D2D">Map &amp; Location</text>
  </g>

  <!-- Intro Text Card -->
  <g transform="translate(580, 180)" filter="url(#cardShadow)">
    <rect width="560" height="500" rx="4" fill="#FFFFFF" />
    <text x="40" y="50" font-size="18" font-weight="bold" fill="#2D2D2D">About the Country</text>
    <text x="40" y="90" font-size="16" fill="#444" line-height="1.5">
      <tspan x="40" dy="0">Japan is an island country in East Asia, located in the</tspan>
      <tspan x="40" dy="24">Pacific Ocean. It is known for its blend of ancient</tspan>
      <tspan x="40" dy="24">traditions and cutting-edge technology.</tspan>
      <tspan x="40" dy="36"> </tspan>
      <tspan x="40" dy="0">The capital, Tokyo, is one of the world's most populous</tspan>
      <tspan x="40" dy="24">metropolitan areas. Japanese culture is a rich tapestry</tspan>
      <tspan x="40" dy="24">shaped by its deep history, featuring everything from</tspan>
      <tspan x="40" dy="24">Buddhist temples to neon-lit skyscrapers.</tspan>
    </text>
  </g>

  <!-- Row 2: Paragraph -->
  <g transform="translate(60, 700)" filter="url(#cardShadow)">
    <rect width="1080" height="160" rx="4" fill="#FFFFFF" />
    <text x="40" y="50" font-size="18" font-weight="bold" fill="#2D2D2D">Economic Overview</text>
    <text x="40" y="90" font-size="15" fill="#555" line-height="1.5">
      <tspan x="40" dy="0">Japan has the world's third-largest economy by nominal GDP. Despite facing challenges such as</tspan>
      <tspan x="40" dy="22">an aging population and deflationary pressures, it remains a global leader in technology and</tspan>
      <tspan x="40" dy="22">manufacturing. The "Abenomics" policies aimed to stimulate growth, though recent years have seen</tspan>
      <tspan x="40" dy="22">fluctuations due to global market conditions and the impact of the global pandemic.</tspan>
    </text>
  </g>

  <!-- Row 3: Text + GDP Chart -->
  <!-- Text -->
  <g transform="translate(60, 880)" filter="url(#cardShadow)">
    <rect width="300" height="380" rx="4" fill="#FFFFFF" />
    <text x="40" y="50" font-size="18" font-weight="bold" fill="#2D2D2D">Economic Context</text>
    <text x="40" y="90" font-size="14" fill="#555" line-height="1.5">
      <tspan x="40" dy="0">Japan's economy saw significant growth in 2016,</tspan>
      <tspan x="40" dy="20">reaching a peak of $5.0 Trillion. However,</tspan>
      <tspan x="40" dy="20">post-pandemic recovery has been challenging,</tspan>
      <tspan x="40" dy="20">with a notable dip in 2022 and 2023.</tspan>
      <tspan x="40" dy="40"> </tspan>
      <tspan x="40" dy="0">The forecast for 2024 suggests a stabilization</tspan>
      <tspan x="40" dy="20">around $4.0 Trillion.</tspan>
    </text>
  </g>

  <!-- GDP Chart -->
  <g transform="translate(380, 880)" filter="url(#cardShadow)">
    <rect width="760" height="380" rx="4" fill="#FFFFFF" />
    <text x="40" y="50" font-size="18" font-weight="bold" fill="#2D2D2D">Nominal GDP (2015-2024)</text>
    <!-- Chart Area: 600x250 -->
    <g transform="translate(80, 80)">
      <!-- Grid Lines -->
      <line x1="0" y1="200" x2="680" y2="200" stroke="#EEE" stroke-width="1" />
      <line x1="0" y1="150" x2="680" y2="150" stroke="#EEE" stroke-width="1" />
      <line x1="0" y1="100" x2="680" y2="100" stroke="#EEE" stroke-width="1" />
      <line x1="0" y1="50" x2="680" y2="50" stroke="#EEE" stroke-width="1" />
      <line x1="0" y1="0" x2="680" y2="0" stroke="#EEE" stroke-width="1" />
      
      <!-- Y Labels -->
      <text x="-10" y="205" font-size="12" fill="#999" text-anchor="end">0</text>
      <text x="-10" y="155" font-size="12" fill="#999" text-anchor="end">2</text>
      <text x="-10" y="105" font-size="12" fill="#999" text-anchor="end">4</text>
      <text x="-10" y="55" font-size="12" fill="#999" text-anchor="end">6</text>
      <text x="-10" y="5" font-size="12" fill="#999" text-anchor="end">8</text>

      <!-- Bars (Scale: 0 to 6t. 1t = 33.3px. Bar height = value * 33.3) -->
      <!-- 2015: 4.44 -> 148px -->
      <rect x="10" y="152" width="45" height="148" fill="url(#barGradient)" />
      <text x="32" y="165" font-size="11" fill="#FFF" text-anchor="middle">4.44</text>
      <text x="32" y="220" font-size="11" fill="#555" text-anchor="middle">2015</text>

      <!-- 2016: 5.00 -> 166.6px -->
      <rect x="75" y="133" width="45" height="167" fill="url(#barGradient)" />
      <text x="97" y="146" font-size="11" fill="#FFF" text-anchor="middle">5.00</text>
      <text x="97" y="220" font-size="11" fill="#555" text-anchor="middle">2016</text>

      <!-- 2017: 4.93 -> 164.3px -->
      <rect x="140" y="135" width="45" height="164" fill="url(#barGradient)" />
      <text x="162" y="148" font-size="11" fill="#FFF" text-anchor="middle">4.93</text>
      <text x="162" y="220" font-size="11" fill="#555" text-anchor="middle">2017</text>

      <!-- 2018: 5.04 -> 168px -->
      <rect x="205" y="132" width="45" height="168" fill="url(#barGradient)" />
      <text x="227" y="145" font-size="11" fill="#FFF" text-anchor="middle">5.04</text>
      <text x="227" y="220" font-size="11" fill="#555" text-anchor="middle">2018</text>

      <!-- 2019: 5.12 -> 170.6px -->
      <rect x="270" y="129" width="45" height="171" fill="url(#barGradient)" />
      <text x="292" y="142" font-size="11" fill="#FFF" text-anchor="middle">5.12</text>
      <text x="292" y="220" font-size="11" fill="#555" text-anchor="middle">2019</text>

      <!-- 2020: 5.05 -> 168.3px -->
      <rect x="335" y="131" width="45" height="168" fill="url(#barGradient)" />
      <text x="357" y="144" font-size="11" fill="#FFF" text-anchor="middle">5.05</text>
      <text x="357" y="220" font-size="11" fill="#555" text-anchor="middle">2020</text>

      <!-- 2021: 5.04 -> 168px -->
      <rect x="400" y="132" width="45" height="168" fill="url(#barGradient)" />
      <text x="422" y="145" font-size="11" fill="#FFF" text-anchor="middle">5.04</text>
      <text x="422" y="220" font-size="11" fill="#555" text-anchor="middle">2021</text>

      <!-- 2022: 4.26 -> 142px -->
      <rect x="465" y="158" width="45" height="142" fill="url(#barGradient)" />
      <text x="487" y="171" font-size="11" fill="#FFF" text-anchor="middle">4.26</text>
      <text x="487" y="220" font-size="11" fill="#555" text-anchor="middle">2022</text>

      <!-- 2023: 4.21 -> 140.3px -->
      <rect x="530" y="159" width="45" height="140" fill="url(#barGradient)" />
      <text x="552" y="172" font-size="11" fill="#FFF" text-anchor="middle">4.21</text>
      <text x="552" y="220" font-size="11" fill="#555" text-anchor="middle">2023</text>

      <!-- 2024: 4.03 -> 134.3px -->
      <rect x="595" y="165" width="45" height="134" fill="url(#barGradient)" />
      <text x="617" y="178" font-size="11" fill="#FFF" text-anchor="middle">4.03</text>
      <text x="617" y="220" font-size="11" fill="#555" text-anchor="middle">2024</text>
      
      <!-- Trillion Label -->
      <text x="0" y="-10" font-size="12" fill="#999" font-weight="bold">US$ Trillions</text>
    </g>
  </g>

  <!-- Row 4: Pie Chart + Visit Text -->
  <!-- Population Chart -->
  <g transform="translate(60, 1280)" filter="url(#cardShadow)">
    <rect width="350" height="380" rx="4" fill="#FFFFFF" />
    <text x="20" y="40" font-size="18" font-weight="bold" fill="#2D2D2D">Population Composition</text>
    
    <!-- Donut Chart (Radius 80, Stroke 30, Center 175, 200) -->
    <!-- Circumference ~502 -->
    <g transform="translate(175, 200) rotate(-90)">
        <!-- Japanese: 97.5% -> 489.27 dash -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#D32F2F" stroke-width="30" stroke-dasharray="489.27 12.73" />
        <!-- Chinese: 0.6% -> 3.01 dash -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#FBC02D" stroke-width="30" stroke-dasharray="3.01 498.99" stroke-dashoffset="-489.27" />
        <!-- Vietnamese: 0.4% -> 2.01 dash -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#43A047" stroke-width="30" stroke-dasharray="2.01 499.99" stroke-dashoffset="-492.28" />
        <!-- South Korean: 0.3% -> 1.51 dash -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#1E88E5" stroke-width="30" stroke-dasharray="1.51 500.49" stroke-dashoffset="-494.29" />
        <!-- Other: 1.2% -> 6.02 dash -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#757575" stroke-width="30" stroke-dasharray="6.02 495.98" stroke-dashoffset="-495.8" />
    </g>
    
    <!-- Legend -->
    <g transform="translate(40, 310)">
        <circle r="6" fill="#D32F2F" /> <text x="15" y="5" font-size="14" fill="#333">Japanese (97.5%)</text>
        <circle r="6" cy="25" fill="#FBC02D" /> <text x="15" y="30" font-size="14" fill="#333">Chinese (0.6%)</text>
        <circle r="6" cy="50" fill="#43A047" /> <text x="15" y="55" font-size="14" fill="#333">Vietnamese (0.4%)</text>
        <circle r="6" cy="75" fill="#1E88E5" /> <text x="15" y="80" font-size="14" fill="#333">S. Korean (0.3%)</text>
        <circle r="6" cy="100" fill="#757575" /> <text x="15" y="105" font-size="14" fill="#333">Other (1.2%)</text>
    </g>
  </g>

  <!-- Visit Text -->
  <g transform="translate(430, 1280)" filter="url(#cardShadow)">
    <rect width="710" height="380" rx="4" fill="#FFFFFF" />
    <text x="40" y="50" font-size="18" font-weight="bold" fill="#2D2D2D">What to Visit</text>
    
    <g transform="translate(40, 90)">
        <!-- Item 1 -->
        <circle cx="10" cy="10" r="6" fill="#D32F2F" />
        <text x="30" y="15" font-size="16" font-weight="bold" fill="#333">Tokyo</text>
        <text x="30" y="35" font-size="14" fill="#666">The bustling capital mixing ultra-modern with traditional.</text>

        <!-- Item 2 -->
        <circle cx="10" cy="80" r="6" fill="#D32F2F" />
        <text x="30" y="85" font-size="16" font-weight="bold" fill="#333">Kyoto</text>
        <text x="30" y="105" font-size="14" fill="#666">Famous for its classical Buddhist temples and gardens.</text>

        <!-- Item 3 -->
        <circle cx="10" cy="150" r="6" fill="#D32F2F" />
        <text x="30" y="155" font-size="16" font-weight="bold" fill="#333">Osaka</text>
        <text x="30" y="175" font-size="14" fill="#666">Known for its modern architecture and street food.</text>

        <!-- Item 4 -->
        <circle cx="10" cy="220" r="6" fill="#D32F2F" />
        <text x="30" y="225" font-size="16" font-weight="bold" fill="#333">Hiroshima / Miyajima</text>
        <text x="30" y="245" font-size="14" fill="#666">Historic sites of peace and the iconic floating torii gate.</text>
        
        <!-- Item 5 -->
        <circle cx="10" cy="290" r="6" fill="#D32F2F" />
        <text x="30" y="295" font-size="16" font-weight="bold" fill="#333">Mount Fuji / Hakone</text>
        <text x="30" y="315" font-size="14" fill="#666">Japan's iconic symbol and the scenic hot springs region.</text>
        
        <!-- Item 6 -->
        <circle cx="360" cy="10" r="6" fill="#D32F2F" />
        <text x="380" y="15" font-size="16" font-weight="bold" fill="#333">Hokkaido</text>
        <text x="380" y="35" font-size="14" fill="#666">Famous for volcanoes, hot springs, and natural beauty.</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="60" y="1770" font-size="12" fill="#999">Sources: World Bank, IMF, Statistics Bureau of Japan. Data for GDP is estimated for 2024.</text>

</svg>