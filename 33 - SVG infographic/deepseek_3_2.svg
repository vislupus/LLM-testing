<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9ff"/>
      <stop offset="50%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8eeff"/>
    </linearGradient>
    
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff00"/>
      <stop offset="50%" stop-color="#ffffff30"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fcfdff"/>
    </linearGradient>
    
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    
    <radialGradient id="pieGradient1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
    
    <radialGradient id="pieGradient2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    
    <radialGradient id="pieGradient3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    
    <radialGradient id="pieGradient4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    
    <radialGradient id="pieGradient5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    
    <!-- Map marker symbol -->
    <symbol id="mapMarker" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </symbol>
    
    <!-- GDP icon -->
    <symbol id="gdpIcon" viewBox="0 0 24 24">
      <path fill="currentColor" d="M11 8v5l4.25 2.52.77-1.28-3.52-2.09V8H11zm10 2V3l-2.64 2.64A8.937 8.937 0 0 0 12 3a9 9 0 1 0 9 9h-2c0 3.86-3.14 7-7 7s-7-3.14-7-7 3.14-7 7-7c1.93 0 3.68.79 4.95 2.05L14 10h7z"/>
    </symbol>
    
    <!-- Population icon -->
    <symbol id="populationIcon" viewBox="0 0 24 24">
      <path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
    </symbol>
    
    <!-- Tourism icon -->
    <symbol id="tourismIcon" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
    </symbol>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGradient)"/>
  
  <!-- Decorative waves -->
  <path d="M0,180 Q300,130 600,180 T1200,130" fill="none" stroke="url(#waveGradient)" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  <path d="M0,380 Q400,330 800,380 T1200,330" fill="none" stroke="url(#waveGradient)" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <path d="M0,680 Q350,630 700,680 T1200,630" fill="none" stroke="url(#waveGradient)" stroke-width="6" stroke-linecap="round" opacity="0.2"/>
  
  <!-- Title -->
  <rect x="100" y="40" width="1000" height="100" rx="12" fill="white" fill-opacity="0.95" stroke="#e5e7eb" stroke-width="1"/>
  <text x="600" y="105" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="42" font-weight="bold" fill="#1a1a2e">Japan at a glance</text>
  
  <!-- First row: Map and intro -->
  <!-- Map card -->
  <rect x="100" y="180" width="480" height="320" rx="12" fill="url(#cardGradient)" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Simplified Japan map outline -->
  <path d="M180,280 L210,330 L250,320 L290,360 L330,340 L370,380 L410,360 L450,400 L490,380 L530,420 L570,400 L610,440 L570,480 L530,460 L490,500 L450,480 L410,520 L370,500 L330,540 L290,520 L250,560 L210,540 L180,590 L150,540 L170,490 L190,440 L170,390 Z" 
        fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Map markers -->
  <g fill="#dc2626">
    <!-- Tokyo -->
    <use xlink:href="#mapMarker" x="350" y="360" width="28" height="28"/>
    <text x="380" y="350" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#111827">Tokyo</text>
    
    <!-- Yokohama -->
    <use xlink:href="#mapMarker" x="330" y="400" width="22" height="22"/>
    <text x="355" y="395" font-family="'Segoe UI', sans-serif" font-size="12" fill="#374151">Yokohama</text>
    
    <!-- Osaka -->
    <use xlink:href="#mapMarker" x="210" y="460" width="22" height="22"/>
    <text x="235" y="455" font-family="'Segoe UI', sans-serif" font-size="12" fill="#374151">Osaka</text>
    
    <!-- Nagoya -->
    <use xlink:href="#mapMarker" x="270" y="420" width="22" height="22"/>
    <text x="295" y="415" font-family="'Segoe UI', sans-serif" font-size="12" fill="#374151">Nagoya</text>
  </g>
  
  <text x="340" y="500" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#6b7280">Four largest cities of Japan</text>
  
  <!-- Intro text card -->
  <rect x="620" y="180" width="480" height="320" rx="12" fill="url(#cardGradient)" stroke="#e5e7eb" stroke-width="1"/>
  
  <text x="640" y="230" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#1a1a2e">The Land of the Rising Sun</text>
  
  <text x="640" y="270" font-family="'Segoe UI', sans-serif" font-size="15" fill="#4b5563" style="white-space: pre">
Japan is an archipelago of over 6,800 islands
in East Asia, with a population of approximately
125 million. The country blends ancient traditions
with cutting-edge modernity, known for its
cherry blossoms, samurai heritage, and technological
innovation. As a constitutional monarchy with
Tokyo as its capital, Japan maintains a unique
cultural identity while being a global economic
powerhouse.</text>
  
  <!-- Full-width paragraph -->
  <rect x="100" y="530" width="1000" height="100" rx="12" fill="url(#cardGradient)" stroke="#e5e7eb" stroke-width="1"/>
  
  <text x="120" y="570" font-family="'Segoe UI', sans-serif" font-size="15" fill="#4b5563" style="white-space: pre">
Japan's history spans from the Jōmon period (14,000–300 BCE) through the feudal era of shoguns and samurai to its rapid modernization during
the Meiji Restoration. Today, it stands as a leader in robotics, automotive manufacturing, and electronics, while preserving arts like
tea ceremony, calligraphy, and kabuki theater. The country experiences four distinct seasons, each celebrated with traditional festivals.</text>
  
  <!-- Second row: GDP section -->
  <!-- GDP text -->
  <rect x="100" y="670" width="480" height="280" rx="12" fill="url(#cardGradient)" stroke="#e5e7eb" stroke-width="1"/>
  
  <use xlink:href="#gdpIcon" x="120" y="700" width="28" height="28" fill="#4f46e5"/>
  <text x="160" y="725" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#1a1a2e">Economic Overview</text>
  
  <text x="120" y="770" font-family="'Segoe UI', sans-serif" font-size="14" fill="#4b5563" style="white-space: pre">
Japan has the world's third-largest economy
by nominal GDP, following the United States
and China. Despite decades of economic
stagnation, it remains a global leader in:

• Automotive manufacturing
• Electronics and robotics
• High-speed rail technology
• Scientific research
• Video game industry

The Japanese yen is the third-most traded
currency in the foreign exchange market.</text>
  
  <!-- GDP bar chart -->
  <rect x="620" y="670" width="480" height="280" rx="12" fill="url(#cardGradient)" stroke="#e5e7eb" stroke-width="1"/>
  
  <text x="860" y="710" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1a1a2e">Japan's Nominal GDP (US$ Trillions)</text>
  <text x="860" y="740" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#6b7280">2015–2024, current dollars</text>
  
  <!-- Bar chart -->
  <g transform="translate(680, 800)">
    <!-- X-axis -->
    <line x1="0" y1="120" x2="400" y2="120" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="120" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Y-axis labels -->
    <text x="-10" y="0" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">5.5</text>
    <text x="-10" y="24" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">5.0</text>
    <text x="-10" y="48" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">4.5</text>
    <text x="-10" y="72" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">4.0</text>
    <text x="-10" y="96" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">3.5</text>
    <text x="-10" y="120" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">3.0</text>
    
    <!-- Bars -->
    <!-- GDP data: 2015 4.44, 2016 5.00, 2017 4.93, 2018 5.04, 2019 5.12, 2020 5.05, 2021 5.04, 2022 4.26, 2023 4.21, 2024 4.03 -->
    <g transform="translate(30, 0)">
      <!-- 2015 -->
      <rect x="0" y="50.4" width="32" height="69.6" fill="url(#barGradient)" rx="3"/>
      <text x="16" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'15</text>
      <text x="16" y="45" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">4.44</text>
      
      <!-- 2016 -->
      <rect x="40" y="24" width="32" height="96" fill="url(#barGradient)" rx="3"/>
      <text x="56" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'16</text>
      <text x="56" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">5.00</text>
      
      <!-- 2017 -->
      <rect x="80" y="28.8" width="32" height="91.2" fill="url(#barGradient)" rx="3"/>
      <text x="96" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'17</text>
      <text x="96" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">4.93</text>
      
      <!-- 2018 -->
      <rect x="120" y="24" width="32" height="96" fill="url(#barGradient)" rx="3"/>
      <text x="136" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'18</text>
      <text x="136" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">5.04</text>
      
      <!-- 2019 -->
      <rect x="160" y="14.4" width="32" height="105.6" fill="url(#barGradient)" rx="3"/>
      <text x="176" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'19</text>
      <text x="176" y="9" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">5.12</text>
      
      <!-- 2020 -->
      <rect x="200" y="26.4" width="32" height="93.6" fill="url(#barGradient)" rx="3"/>
      <text x="216" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'20</text>
      <text x="216" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">5.05</text>
      
      <!-- 2021 -->
      <rect x="240" y="24" width="32" height="96" fill="url(#barGradient)" rx="3"/>
      <text x="256" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'21</text>
      <text x="256" y="19" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">5.04</text>
      
      <!-- 2022 -->
      <rect x="280" y="67.2" width="32" height="52.8" fill="url(#barGradient)" rx="3"/>
      <text x="296" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'22</text>
      <text x="296" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">4.26</text>
      
      <!-- 2023 -->
      <rect x="320" y="71.4" width="32" height="48.6" fill="url(#barGradient)" rx="3"/>
      <text x="336" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'23</text>
      <text x="336" y="66" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">4.21</text>
      
      <!-- 2024 -->
      <rect x="360" y="74.4" width="32" height="45.6" fill="url(#barGradient)" rx="3"/>
      <text x="376" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">'24</text>
      <text x="376" y="69" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#111827" font-weight="500">4.03</text>
    </g>
  </g>
  
  <!-- Third row: Population and tourism -->
  <!-- Population pie chart -->
  <rect x="100" y="990" width="480" height="280" rx="12" fill="url(#cardGradient)" stroke="#e5e7eb" stroke-width="1"/>
  
  <use xlink:href="#populationIcon" x="120" y="1020" width="28" height="28" fill="#4f46e5"/>
  <text x="160" y="1045" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#1a1a2e">Population Composition</text>
  
  <!-- Pie chart -->
  <g transform="translate(250, 1140)">
    <!-- Donut hole -->
    <circle cx="0" cy="0" r="50" fill="white"/>
    
    <!-- Pie segments -->
    <!-- Japanese 97.5% -->
    <path d="M0,-80 A80,80 0 0,1 79.6,-7.92 L49.75,-4.95 A50,50 0 0,0 0,-50 Z" fill="url(#pieGradient1)"/>
    
    <!-- Chinese 0.6% -->
    <path d="M79.6,-7.92 A80,80 0 0,1 80.48,-6.64 L50.3,-4.15 A50,50 0 0,0 49.75,-4.95 Z" fill="url(#pieGradient2)"/>
    
    <!-- Vietnamese 0.4% -->
    <path d="M80.48,-6.64 A80,80 0 0,1 80.8,-5.6 L50.5,-3.5 A50,50 0 0,0 50.3,-4.15 Z" fill="url(#pieGradient3)"/>
    
    <!-- South Korean 0.3% -->
    <path d="M80.8,-5.6 A80,80 0 0,1 81.04,-4.56 L50.65,-2.85 A50,50 0 0,0 50.5,-3.5 Z" fill="url(#pieGradient4)"/>
    
    <!-- Other 1.2% -->
    <path d="M81.04,-4.56 A80,80 0 0,1 80,0 L50,0 A50,50 0 0,0 50.65,-2.85 Z" fill="url(#pieGradient5)"/>
    
    <!-- Center text -->
    <text x="0" y="-5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1f2937">125M</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">Total Pop.</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(350, 1080)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#pieGradient1)"/>
    <text x="20" y="11" font-family="'Segoe UI', sans-serif" font-size="12" fill="#374151">Japanese (97.5%)</text>
    
    <rect x="0" y="25" width="12" height="12" rx="2" fill="url(#pieGradient2)"/>
    <text x="20" y="36" font-family="'Segoe UI', sans-serif" font-size="12" fill="#374151">Chinese (0.6%)</text>
    
    <rect x="0" y="50" width="12" height="12" rx="2" fill="url(#pieGradient3)"/>
    <text x="20" y="61" font-family="'Segoe UI', sans-serif" font-size="12" fill="#374151">Vietnamese (0.4%)</text>
    
    <rect x="0" y="75" width="12" height="12" rx="2" fill="url(#pieGradient4)"/>
    <text x="20" y="86" font-family="'Segoe UI', sans-serif" font-size="12" fill="#374151">South Korean (0.3%)</text>
    
    <rect x="0" y="100" width="12" height="12" rx="2" fill="url(#pieGradient5)"/>
    <text x="20" y="111" font-family="'Segoe UI', sans-serif" font-size="12" fill="#374151">Other (1.2%)</text>
  </g>
  
  <!-- Tourism section -->
  <rect x="620" y="990" width="480" height="280" rx="12" fill="url(#cardGradient)" stroke="#e5e7eb" stroke-width="1"/>
  
  <use xlink:href="#tourismIcon" x="640" y="1020" width="28" height="28" fill="#4f46e5"/>
  <text x="680" y="1045" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#1a1a2e">Top Destinations</text>
  
  <text x="640" y="1090" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">Must-visit places in Japan:</text>
  
  <g font-family="'Segoe UI', sans-serif" font-size="14" fill="#4b5563">
    <!-- Tokyo -->
    <circle cx="660" cy="1125" r="5" fill="#3b82f6"/>
    <text x="680" y="1130">Tokyo - World's largest metropolis, blending ultramodern with traditional</text>
    
    <!-- Kyoto -->
    <circle cx="660" cy="1155" r="5" fill="#10b981"/>
    <text x="680" y="1160">Kyoto - Ancient capital with 2,000+ temples, shrines, and gardens</text>
    
    <!-- Osaka -->
    <circle cx="660" cy="1185" r="5" fill="#f59e0b"/>
    <text x="680" y="1190">Osaka - Food paradise known as "Japan's kitchen" with vibrant nightlife</text>
    
    <!-- Hiroshima -->
    <circle cx="660" cy="1215" r="5" fill="#ef4444"/>
    <text x="680" y="1220">Hiroshima/Miyajima - Peace memorial & iconic floating torii gate</text>
    
    <!-- Mount Fuji -->
    <circle cx="660" cy="1245" r="5" fill="#8b5cf6"/>
    <text x="680" y="1250">Mount Fuji/Hakone - Iconic volcano views and hot spring resorts</text>
    
    <!-- Hokkaido -->
    <circle cx="660" cy="1275" r="5" fill="#ec4899"/>
    <text x="680" y="1280">Hokkaido - Northern wilderness with skiing, wildlife, and seafood</text>
  </g>
  
  <!-- Source note -->
  <rect x="100" y="1310" width="1000" height="50" rx="8" fill="white" fill-opacity="0.9" stroke="#e5e7eb" stroke-width="1"/>
  
  <text x="600" y="1340" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#6b7280">
    Sources: IMF World Economic Outlook (GDP), Statistics Japan (Population), Japan National Tourism Organization • Data as of 2024
  </text>
  
  <!-- Border -->
  <rect x="50" y="30" width="1100" height="1740" rx="20" fill="none" stroke="#e5e7eb" stroke-width="2"/>
</svg>
