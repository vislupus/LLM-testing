<svg viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions: Gradients, Patterns, and Shadows -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdfbfb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ebedee;stop-opacity:1" />
    </linearGradient>
    
    <pattern id="wavePattern" x="0" y="0" width="100" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 25 C 20 5, 30 5, 50 25 C 70 45, 80 45, 100 25" fill="none" stroke="#d1d1d1" stroke-width="1" opacity="0.3"/>
      <path d="M0 35 C 20 15, 30 15, 50 35 C 70 55, 80 55, 100 35" fill="none" stroke="#d1d1d1" stroke-width="1" opacity="0.2"/>
    </pattern>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BC002D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a0021;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="1800" fill="url(#bgGradient)" />
  <rect width="1200" height="1800" fill="url(#wavePattern)" />

  <!-- Header Section -->
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#1B1B3A" letter-spacing="2">JAPAN AT A GLANCE</text>
  <line x1="550" y1="120" x2="650" y2="120" stroke="#BC002D" stroke-width="4"/>

  <!-- Row 1: Map and Intro Text -->
  <g transform="translate(80, 180)">
    <!-- Card Background -->
    <rect width="1040" height="420" rx="20" fill="white" filter="url(#cardShadow)"/>
    
    <!-- Stylized Map of Japan -->
    <g transform="translate(50, 40) scale(1.1)">
      <!-- Silhouette -->
      <path d="M320,20 L335,40 L350,80 L340,120 L320,150 L350,180 L380,100 L410,50 L420,20 Z" fill="#e0e0e0" /> <!-- Hokkaido -->
      <path d="M310,160 L280,180 L250,220 L220,240 L180,270 L140,290 L110,320 L130,340 L170,330 L230,300 L280,250 L330,190 Z" fill="#d0d0d0" /> <!-- Honshu -->
      <path d="M120,310 L90,330 L100,350 L130,340 Z" fill="#d0d0d0" /> <!-- Shikoku -->
      <path d="M80,320 L60,340 L70,370 L100,360 L100,330 Z" fill="#d0d0d0" /> <!-- Kyushu -->
      
      <!-- Cities -->
      <!-- Tokyo -->
      <circle cx="215" cy="285" r="6" fill="#BC002D" />
      <text x="225" y="280" font-family="Arial" font-size="14" font-weight="bold">Tokyo</text>
      <!-- Yokohama -->
      <circle cx="210" cy="295" r="4" fill="#1B1B3A" />
      <text x="220" y="305" font-family="Arial" font-size="12">Yokohama</text>
      <!-- Nagoya -->
      <circle cx="185" cy="300" r="5" fill="#1B1B3A" />
      <text x="165" y="318" font-family="Arial" font-size="12" text-anchor="middle">Nagoya</text>
      <!-- Osaka -->
      <circle cx="160" cy="310" r="5" fill="#1B1B3A" />
      <text x="140" y="325" font-family="Arial" font-size="12" text-anchor="middle">Osaka</text>
    </g>

    <!-- Intro Text Container -->
    <foreignObject x="500" y="60" width="480" height="300">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; color: #444; line-height: 1.6;">
        <h3 style="color: #1B1B3A; margin-top: 0;">The Land of the Rising Sun</h3>
        <p>Japan is an island country in East Asia, located in the northwest Pacific Ocean. It is bordered by the Sea of Japan to the west and extends from the Sea of Okhotsk in the north to the East China Sea and Taiwan in the south.</p>
        <p>A global leader in technology and culture, Japan blends ancient traditions with extraordinary modern advancements, offering a unique landscape of bustling metropolises and serene natural beauty.</p>
      </div>
    </foreignObject>
  </g>

  <!-- Transition Paragraph -->
  <g transform="translate(80, 630)">
    <rect width="1040" height="100" rx="15" fill="#1B1B3A"/>
    <text x="520" y="58" text-anchor="middle" font-family="Arial" font-size="20" fill="white" font-style="italic">
      "Japan remains the world's fourth-largest economy, driven by innovation, high-tech manufacturing, and a resilient service sector."
    </text>
  </g>

  <!-- Row 2: GDP Text and Bar Chart -->
  <g transform="translate(80, 760)">
    <rect width="1040" height="480" rx="20" fill="white" filter="url(#cardShadow)"/>
    
    <!-- GDP Text -->
    <foreignObject x="40" y="80" width="300" height="350">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Arial; font-size: 16px; color: #555; line-height: 1.6;">
        <h3 style="color: #BC002D;">Economic Outlook</h3>
        <p>Japan's GDP has seen significant fluctuations over the last decade, influenced by global trade dynamics and currency valuation against the US Dollar.</p>
        <p>While nominal figures in USD show a recent decline due to a weaker Yen, the core industrial output remains robust across the automotive and robotics sectors.</p>
      </div>
    </foreignObject>

    <!-- Bar Chart -->
    <g transform="translate(420, 50)">
      <text x="280" y="10" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1B1B3A">Nominal GDP (2015–2024)</text>
      <text x="280" y="30" text-anchor="middle" font-family="Arial" font-size="12" fill="#888">In Current US$ Trillions</text>
      
      <!-- Axes -->
      <line x1="50" y1="350" x2="560" y2="350" stroke="#ccc" stroke-width="1"/>
      <line x1="50" y1="50" x2="50" y2="350" stroke="#ccc" stroke-width="1"/>
      
      <!-- Data Bars (2015-2024) -->
      <!-- Max value 5.12 Trillion mapped to 280px height -->
      <!-- 2015: 4.44 --> <rect x="70" y="107" width="35" height="243" fill="url(#barGrad)" rx="3"/> <text x="87" y="370" text-anchor="middle" font-size="11" fill="#666">2015</text> <text x="87" y="100" text-anchor="middle" font-size="10" font-weight="bold">4.4</text>
      <!-- 2016: 5.00 --> <rect x="120" y="77" width="35" height="273" fill="url(#barGrad)" rx="3"/> <text x="137" y="370" text-anchor="middle" font-size="11" fill="#666">2016</text> <text x="137" y="70" text-anchor="middle" font-size="10" font-weight="bold">5.0</text>
      <!-- 2017: 4.93 --> <rect x="170" y="81" width="35" height="269" fill="url(#barGrad)" rx="3"/> <text x="187" y="370" text-anchor="middle" font-size="11" fill="#666">2017</text> <text x="187" y="74" text-anchor="middle" font-size="10" font-weight="bold">4.9</text>
      <!-- 2018: 5.04 --> <rect x="220" y="75" width="35" height="275" fill="url(#barGrad)" rx="3"/> <text x="237" y="370" text-anchor="middle" font-size="11" fill="#666">2018</text> <text x="237" y="68" text-anchor="middle" font-size="10" font-weight="bold">5.0</text>
      <!-- 2019: 5.12 --> <rect x="270" y="70" width="35" height="280" fill="url(#barGrad)" rx="3"/> <text x="287" y="370" text-anchor="middle" font-size="11" fill="#666">2019</text> <text x="287" y="63" text-anchor="middle" font-size="10" font-weight="bold">5.1</text>
      <!-- 2020: 5.05 --> <rect x="320" y="74" width="35" height="276" fill="url(#barGrad)" rx="3"/> <text x="337" y="370" text-anchor="middle" font-size="11" fill="#666">2020</text> <text x="337" y="67" text-anchor="middle" font-size="10" font-weight="bold">5.0</text>
      <!-- 2021: 5.04 --> <rect x="370" y="75" width="35" height="275" fill="url(#barGrad)" rx="3"/> <text x="387" y="370" text-anchor="middle" font-size="11" fill="#666">2021</text> <text x="387" y="68" text-anchor="middle" font-size="10" font-weight="bold">5.0</text>
      <!-- 2022: 4.26 --> <rect x="420" y="117" width="35" height="233" fill="#666" rx="3" opacity="0.6"/> <text x="437" y="370" text-anchor="middle" font-size="11" fill="#666">2022</text> <text x="437" y="110" text-anchor="middle" font-size="10" font-weight="bold">4.2</text>
      <!-- 2023: 4.21 --> <rect x="470" y="120" width="35" height="230" fill="#666" rx="3" opacity="0.6"/> <text x="487" y="370" text-anchor="middle" font-size="11" fill="#666">2023</text> <text x="487" y="113" text-anchor="middle" font-size="10" font-weight="bold">4.2</text>
      <!-- 2024: 4.03 --> <rect x="520" y="130" width="35" height="220" fill="#666" rx="3" opacity="0.6"/> <text x="537" y="370" text-anchor="middle" font-size="11" fill="#666">2024*</text> <text x="537" y="123" text-anchor="middle" font-size="10" font-weight="bold">4.0</text>
    </g>
  </g>

  <!-- Row 3: Demographics and Travel -->
  <g transform="translate(80, 1270)">
    <rect width="1040" height="420" rx="20" fill="white" filter="url(#cardShadow)"/>
    
    <!-- Population Donut Chart -->
    <g transform="translate(200, 210)">
      <text x="0" y="-140" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1B1B3A">Demographics</text>
      
      <!-- Base Circle (Japanese 97.5%) -->
      <circle r="100" fill="none" stroke="#BC002D" stroke-width="40" />
      
      <!-- Small sliver for "Others" (approx 2.5% combined visible gap) -->
      <circle r="100" fill="none" stroke="#1B1B3A" stroke-width="40" stroke-dasharray="15 628" stroke-dashoffset="157" />
      
      <text x="0" y="10" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#1B1B3A">97.5%</text>
      <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Japanese</text>

      <!-- Legend -->
      <g transform="translate(-150, 120)">
        <rect x="0" y="0" width="12" height="12" fill="#BC002D"/> <text x="20" y="11" font-size="12">Japanese (97.5%)</text>
        <rect x="160" y="0" width="12" height="12" fill="#1B1B3A"/> <text x="180" y="11" font-size="12">Chinese (0.6%)</text>
        <rect x="0" y="25" width="12" height="12" fill="#4a4a4a"/> <text x="20" y="36" font-size="12">Vietnamese (0.4%)</text>
        <rect x="160" y="25" width="12" height="12" fill="#888"/> <text x="180" y="36" font-size="12">Korean &amp; Other (1.5%)</text>
      </g>
    </g>

    <!-- Travel Destinations -->
    <g transform="translate(550, 50)">
      <text x="0" y="30" font-family="Arial" font-size="22" font-weight="bold" fill="#1B1B3A">Must-Visit Destinations</text>
      
      <g transform="translate(0, 70)" font-family="Arial" font-size="16" fill="#444">
        <circle cx="10" cy="5" r="4" fill="#BC002D" /> <text x="25" y="10" font-weight="bold">Tokyo</text>
        <text x="25" y="30" font-size="14" fill="#777">Neon skylines, Harajuku fashion, and world-class dining.</text>
        
        <circle cx="10" cy="65" r="4" fill="#BC002D" /> <text x="25" y="70" font-weight="bold">Kyoto</text>
        <text x="25" y="90" font-size="14" fill="#777">The heart of traditional Japan: temples, tea houses, and geishas.</text>
        
        <circle cx="10" cy="125" r="4" fill="#BC002D" /> <text x="25" y="130" font-weight="bold">Osaka</text>
        <text x="25" y="150" font-size="14" fill="#777">"Japan's Kitchen" – famous for street food and Dotonbori nightlife.</text>
        
        <circle cx="10" cy="185" r="4" fill="#BC002D" /> <text x="25" y="190" font-weight="bold">Hiroshima &amp; Miyajima</text>
        <text x="25" y="210" font-size="14" fill="#777">Peace Memorial Park and the iconic "floating" Torii gate.</text>
        
        <circle cx="10" cy="245" r="4" fill="#BC002D" /> <text x="25" y="250" font-weight="bold">Mount Fuji &amp; Hakone</text>
        <text x="25" y="270" font-size="14" fill="#777">Soak in hot springs (onsen) with views of the sacred peak.</text>
        
        <circle cx="10" cy="305" r="4" fill="#BC002D" /> <text x="25" y="310" font-weight="bold">Hokkaido</text>
        <text x="25" y="330" font-size="14" fill="#777">Wild nature, volcanoes, and world-class powder snow.</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="1750" text-anchor="middle" font-family="Arial" font-size="14" fill="#888">Source: IMF World Economic Outlook (GDP), Statistics Bureau of Japan (Demographics). *2024 Data estimated.</text>
</svg>