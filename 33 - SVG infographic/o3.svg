<?xml version="1.0" encoding="UTF-8" standalone="no"?>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" style="font-family: Helvetica, Arial, sans-serif;">

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4f9ff"/>
    <stop offset="100%" stop-color="#d6e4f5"/>
  </linearGradient>

  <linearGradient id="islandGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#B7D5F4"/>
    <stop offset="100%" stop-color="#5A8BC2"/>
  </linearGradient>

  <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff7b7b"/>
    <stop offset="100%" stop-color="#ffae7b"/>
  </linearGradient>

  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
  </filter>
</defs>

<rect x="0" y="0" width="1200" height="1800" fill="url(#bgGrad)"/>
<path d="M0 120 Q300 180 600 120 T1200 120 L1200 0 0 0Z" fill="#ffffff" opacity="0.3"/>
<path d="M0 220 Q300 280 600 220 T1200 220 L1200 120 0 120Z" fill="#ffffff" opacity="0.2"/>

<text x="600" y="100" text-anchor="middle" font-size="48" font-weight="bold" fill="#1d3557">Japan at a glance</text>

<!-- First row -->

<rect x="60" y="150" width="1080" height="380" rx="20" fill="#ffffff" filter="url(#softShadow)" />

<g id="mapGroup">
  <path d="M100 400 L120 320 L140 280 L160 240 L190 200 L230 160 L260 120 L280 100 L300 80 L320 60 L340 50 L360 56 L380 80 L400 120 L420 160 L430 200 L420 240 L410 280 L390 320 L360 360 L330 400 L300 440 L270 480 L240 510 L210 530 L180 550 L150 560 L130 555 L110 520 Z" fill="url(#islandGrad)" stroke="#1d3557" stroke-width="2"/>
  <circle cx="330" cy="160" r="25" fill="url(#islandGrad)" stroke="#1d3557" stroke-width="2"/>
  <circle cx="200" cy="600" r="35" fill="url(#islandGrad)" stroke="#1d3557" stroke-width="2"/>
  <circle cx="270" cy="500" r="20" fill="url(#islandGrad)" stroke="#1d3557" stroke-width="2"/>

  <circle cx="380" cy="260" r="6" fill="#e63946" />
  <text x="392" y="250" font-size="18" fill="#1d3557">Tokyo</text>

  <circle cx="370" cy="275" r="6" fill="#e63946" />
  <text x="382" y="265" font-size="18" fill="#1d3557">Yokohama</text>

  <circle cx="250" cy="450" r="6" fill="#e63946" />
  <text x="262" y="440" font-size="18" fill="#1d3557">Osaka</text>

  <circle cx="300" cy="360" r="6" fill="#e63946" />
  <text x="312" y="350" font-size="18" fill="#1d3557">Nagoya</text>
</g>

<text x="660" y="220" font-size="22" fill="#333">
  <tspan x="660" dy="0">Japan (日本, Nihon or Nippon) is an island country</tspan>
  <tspan x="660" dy="26">in East Asia, known for its rich culture,</tspan>
  <tspan x="660" dy="26">advanced technology, and scenic landscapes.</tspan>
  <tspan x="660" dy="26">It consists of four main islands—Honshu,</tspan>
  <tspan x="660" dy="26">Hokkaido, Kyushu, and Shikoku—plus over</tspan>
  <tspan x="660" dy="26">6,800 smaller islands.</tspan>
</text>

<foreignObject x="100" y="560" width="1000" height="120">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.4; color:#1d3557;">
    Japan blends centuries-old traditions with cutting-edge modernity. From the serene temples and tea houses of Kyoto to the neon-lit skyscrapers and pop-culture districts of Tokyo, visitors experience a dynamic range of history, cuisine, craftsmanship, and natural beauty.
  </div>
</foreignObject>

<!-- Second row -->

<rect x="60" y="700" width="1080" height="450" rx="20" fill="#ffffff" filter="url(#softShadow)" />

<foreignObject x="80" y="730" width="420" height="400">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:22px; line-height:1.5; color:#333;">
    Japan has one of the world’s largest economies. Despite modest growth and recent currency fluctuations, its nominal GDP remains substantial.
  </div>
</foreignObject>

<g id="gdpChart">
  <line x1="690" y1="780" x2="690" y2="1100" stroke="#457b9d" stroke-width="1"/>
  <line x1="690" y1="1100" x2="1120" y2="1100" stroke="#457b9d" stroke-width="1"/>
  <text x="900" y="760" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3557">Nominal GDP (US$ trillions)</text>

  <rect x="700" y="833.6" width="25" height="266.4" fill="url(#barGrad)" />
  <text x="712.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2015</text>
  <text x="712.5" y="825.6" text-anchor="middle" font-size="12" fill="#1d3557">4.44</text>

  <rect x="740" y="800.0" width="25" height="300.0" fill="url(#barGrad)" />
  <text x="752.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2016</text>
  <text x="752.5" y="792.0" text-anchor="middle" font-size="12" fill="#1d3557">5.00</text>

  <rect x="780" y="804.2" width="25" height="295.8" fill="url(#barGrad)" />
  <text x="792.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2017</text>
  <text x="792.5" y="796.2" text-anchor="middle" font-size="12" fill="#1d3557">4.93</text>

  <rect x="820" y="797.6" width="25" height="302.4" fill="url(#barGrad)" />
  <text x="832.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2018</text>
  <text x="832.5" y="789.6" text-anchor="middle" font-size="12" fill="#1d3557">5.04</text>

  <rect x="860" y="792.8" width="25" height="307.2" fill="url(#barGrad)" />
  <text x="872.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2019</text>
  <text x="872.5" y="784.8" text-anchor="middle" font-size="12" fill="#1d3557">5.12</text>

  <rect x="900" y="797.0" width="25" height="303.0" fill="url(#barGrad)" />
  <text x="912.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2020</text>
  <text x="912.5" y="789.0" text-anchor="middle" font-size="12" fill="#1d3557">5.05</text>

  <rect x="940" y="797.6" width="25" height="302.4" fill="url(#barGrad)" />
  <text x="952.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2021</text>
  <text x="952.5" y="789.6" text-anchor="middle" font-size="12" fill="#1d3557">5.04</text>

  <rect x="980" y="844.4" width="25" height="255.6" fill="url(#barGrad)" />
  <text x="992.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2022</text>
  <text x="992.5" y="836.4" text-anchor="middle" font-size="12" fill="#1d3557">4.26</text>

  <rect x="1020" y="847.4" width="25" height="252.6" fill="url(#barGrad)" />
  <text x="1032.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2023</text>
  <text x="1032.5" y="839.4" text-anchor="middle" font-size="12" fill="#1d3557">4.21</text>

  <rect x="1060" y="858.2" width="25" height="241.8" fill="url(#barGrad)" />
  <text x="1072.5" y="1120" text-anchor="middle" font-size="12" fill="#1d3557">2024</text>
  <text x="1072.5" y="850.2" text-anchor="middle" font-size="12" fill="#1d3557">4.03</text>
</g>

<!-- Bottom row -->

<rect x="60" y="1180" width="1080" height="520" rx="20" fill="#ffffff" filter="url(#softShadow)" />

<g id="popChart" fill-opacity="0.9" stroke="#ffffff" stroke-width="2">
  <path d="M250.00,1350.00 A150,150 0 1,1 226.53,1351.85 L239.05,1430.86 A70,70 0 1,0 250.00,1430.00 Z" fill="#e63946"/>
  <path d="M226.53,1351.85 A150,150 0 0,1 232.14,1351.07 L241.66,1430.50 A70,70 0 0,0 239.05,1430.86 Z" fill="#f1faee"/>
  <path d="M232.14,1351.07 A150,150 0 0,1 235.88,1350.67 L243.41,1430.31 A70,70 0 0,0 241.66,1430.50 Z" fill="#a8dadc"/>
  <path d="M235.88,1350.67 A150,150 0 0,1 238.70,1350.43 L244.73,1430.20 A70,70 0 0,0 243.41,1430.31 Z" fill="#457b9d"/>
  <path d="M238.70,1350.43 A150,150 0 0,1 250.00,1350.00 L250.00,1430.00 A70,70 0 0,0 244.73,1430.20 Z" fill="#1d3557"/>
</g>

<text x="250" y="1300" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3557">Population composition (%)</text>

<rect x="420" y="1355" width="22" height="22" fill="#e63946"/>
<text x="452" y="1370" font-size="18" fill="#1d3557">Japanese</text>

<rect x="420" y="1385" width="22" height="22" fill="#f1faee"/>
<text x="452" y="1400" font-size="18" fill="#1d3557">Chinese</text>

<rect x="420" y="1415" width="22" height="22" fill="#a8dadc"/>
<text x="452" y="1430" font-size="18" fill="#1d3557">Vietnamese</text>

<rect x="420" y="1445" width="22" height="22" fill="#457b9d"/>
<text x="452" y="1460" font-size="18" fill="#1d3557">South Korean</text>

<rect x="420" y="1475" width="22" height="22" fill="#1d3557"/>
<text x="452" y="1490" font-size="18" fill="#1d3557">Other</text>

<foreignObject x="650" y="1200" width="460" height="400">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:22px; line-height:1.5; color:#333;">
    Must-see destinations include Tokyo’s urban sprawl, the classical shrines and geisha districts of Kyoto, Osaka’s vibrant food scene, the poignant peace memorials of Hiroshima and nearby Miyajima, the sacred profile of Mount Fuji viewed from Hakone, and the wild national parks and powder snow of Hokkaido.
  </div>
</foreignObject>

<text x="1100" y="1760" text-anchor="end" font-size="12" fill="#1d3557">Sources: World Bank, Japan Statistics Bureau (2025 estimates)</text>

</svg>
