<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <rect width="1200" height="1800" fill="url(#bgGradient)"/>
  
  <!-- Subtle waves background -->
  <path d="M0 300 Q300 280 600 300 T1200 300 L1200 400 Q900 380 600 400 T0 400 Z" fill="url(#waveGradient1)" opacity="0.5"/>
  <path d="M0 600 Q400 580 800 600 T1200 600 L1200 700 Q800 680 400 700 T0 700 Z" fill="url(#waveGradient2)" opacity="0.4"/>
  <path d="M0 1000 Q300 980 600 1000 T1200 1000 L1200 1100 Q900 1080 600 1100 T0 1100 Z" fill="url(#waveGradient1)" opacity="0.3"/>
  
  <!-- Title -->
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#212529">Japan at a Glance</text>
  <text x="600" y="110" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#6c757d">An infographic overview of Japan</text>
  
  <!-- Card container for first row -->
  <rect x="50" y="140" width="1100" height="380" rx="12" fill="white" filter="url(#shadow)"/>
  
  <!-- Map of Japan -->
  <g transform="translate(80, 200)">
    <path d="M100 100 C120 80, 150 70, 180 75 C210 80, 240 100, 260 120 C280 140, 300 150, 320 160 C340 170, 360 175, 380 180 C400 185, 420 190, 440 195 C460 200, 480 205, 500 210 C520 215, 540 220, 560 225 C580 230, 600 235, 620 240 C640 245, 660 250, 680 255 C700 260, 720 265, 740 270 C760 275, 780 280, 800 285" 
          fill="none" stroke="#4285f4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 100 C120 120, 140 140, 160 150 C180 160, 200 165, 220 170 C240 175, 260 180, 280 185 C300 190, 320 195, 340 200 C360 205, 380 210, 400 215 C420 220, 440 225, 460 230 C480 235, 500 240, 520 245 C540 250, 560 255, 580 260 C600 265, 620 270, 640 275 C660 280, 680 285, 700 290 C720 295, 740 300, 760 305 C780 310, 800 315, 820 320" 
          fill="none" stroke="#4285f4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 100 C120 140, 140 180, 160 210 C180 240, 200 260, 220 280 C240 300, 260 320, 280 340 C300 360, 320 380, 340 400 C360 420, 380 440, 400 460 C420 480, 440 500, 460 520 C480 540, 500 560, 520 580 C540 600, 560 620, 580 640 C600 660, 620 680, 640 700 C660 720, 680 740, 700 760 C720 780, 740 800, 760 820 C780 840, 800 860, 820 880" 
          fill="#4285f4" fill-opacity="0.1" stroke="none"/>
    
    <!-- City markers -->
    <circle cx="680" cy="260" r="6" fill="#dc3545"/>
    <text x="695" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc3545">Tokyo</text>
    
    <circle cx="650" cy="280" r="5" fill="#28a745"/>
    <text x="665" y="285" font-family="Arial, sans-serif" font-size="12" fill="#28a745">Yokohama</text>
    
    <circle cx="480" cy="320" r="5" fill="#ffc107"/>
    <text x="495" y="325" font-family="Arial, sans-serif" font-size="12" fill="#ffc107">Osaka</text>
    
    <circle cx="420" cy="340" r="4" fill="#17a2b8"/>
    <text x="435" y="345" font-family="Arial, sans-serif" font-size="11" fill="#17a2b8">Nagoya</text>
  </g>
  
  <!-- Explanatory text -->
  <text x="680" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Japan</text>
  <text x="680" y="245" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">An island nation in East Asia</text>
  <text x="680" y="270" font-family="Arial, sans-serif" font-size="13" fill="#495057" line-height="1.5">
    Japan is an archipelago of 6,852 islands. The four largest islands are Honshu, Hokkaido, Kyushu, and Shikoku, 
    which together comprise about 97% of Japan's land area. Tokyo, the capital, is the world's most populous 
    metropolitan area with over 37 million people. Japan is known for its unique culture, technological 
    innovation, and rich history spanning thousands of years.
  </text>
  
  <!-- Full-width paragraph -->
  <rect x="50" y="540" width="1100" height="120" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="70" y="570" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#212529">Key Facts About Japan</text>
  <text x="70" y="600" font-family="Arial, sans-serif" font-size="13" fill="#495057" line-height="1.5">
    Japan has a population of approximately 125 million people and covers an area of 377,975 square kilometers. 
    The country has a constitutional monarchy with Emperor Naruhito as the head of state and Fumio Kishida as Prime Minister. 
    Japan is the world's third-largest economy by nominal GDP and a leader in technology, automotive, and robotics industries. 
    The official language is Japanese, and the currency is the Japanese Yen (¥).
  </text>
  
  <!-- GDP Chart Row -->
  <rect x="50" y="680" width="1100" height="380" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="70" y="710" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Japan's Nominal GDP (US$ Trillions)</text>
  <text x="70" y="735" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">2015-2024</text>
  
  <!-- Bar Chart -->
  <g transform="translate(70, 760)">
    <!-- Chart grid -->
    <line x1="0" y1="0" x2="500" y2="0" stroke="#e9ecef" stroke-width="1"/>
    <line x1="0" y1="30" x2="500" y2="30" stroke="#e9ecef" stroke-width="1"/>
    <line x1="0" y1="60" x2="500" y2="60" stroke="#e9ecef" stroke-width="1"/>
    <line x1="0" y1="90" x2="500" y2="90" stroke="#e9ecef" stroke-width="1"/>
    <line x1="0" y1="120" x2="500" y2="120" stroke="#e9ecef" stroke-width="1"/>
    <line x1="0" y1="150" x2="500" y2="150" stroke="#e9ecef" stroke-width="1"/>
    
    <!-- Y-axis labels -->
    <text x="-10" y="5" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6c757d">6.0</text>
    <text x="-10" y="35" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6c757d">5.5</text>
    <text x="-10" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6c757d">5.0</text>
    <text x="-10" y="95" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6c757d">4.5</text>
    <text x="-10" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6c757d">4.0</text>
    <text x="-10" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#6c757d">3.5</text>
    
    <!-- Bars -->
    <rect x="20" y="60" width="35" height="90" fill="#4285f4" opacity="0.8"/>
    <text x="37" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2015</text>
    
    <rect x="65" y="45" width="35" height="105" fill="#4285f4" opacity="0.8"/>
    <text x="82" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2016</text>
    
    <rect x="110" y="52" width="35" height="98" fill="#4285f4" opacity="0.8"/>
    <text x="127" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2017</text>
    
    <rect x="155" y="43" width="35" height="107" fill="#4285f4" opacity="0.8"/>
    <text x="172" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2018</text>
    
    <rect x="200" y="40" width="35" height="110" fill="#4285f4" opacity="0.8"/>
    <text x="217" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2019</text>
    
    <rect x="245" y="45" width="35" height="105" fill="#4285f4" opacity="0.8"/>
    <text x="262" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2020</text>
    
    <rect x="290" y="45" width="35" height="105" fill="#4285f4" opacity="0.8"/>
    <text x="307" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2021</text>
    
    <rect x="335" y="85" width="35" height="65" fill="#dc3545" opacity="0.8"/>
    <text x="352" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2022</text>
    
    <rect x="380" y="88" width="35" height="62" fill="#dc3545" opacity="0.8"/>
    <text x="397" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2023</text>
    
    <rect x="425" y="95" width="35" height="55" fill="#dc3545" opacity="0.8"/>
    <text x="442" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">2024</text>
  </g>
  
  <!-- Population Chart Row -->
  <rect x="50" y="1080" width="1100" height="380" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="70" y="1110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Population Composition by Nationality</text>
  <text x="70" y="1135" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">Ethnic Groups in Japan</text>
  
  <!-- Donut Chart -->
  <g transform="translate(200, 1220)">
    <!-- Donut segments -->
    <circle cx="80" cy="80" r="70" fill="none" stroke="#4285f4" stroke-width="30" stroke-dasharray="431.97 431.97" stroke-dashoffset="0"/>
    <circle cx="80" cy="80" r="70" fill="none" stroke="#dc3545" stroke-width="30" stroke-dasharray="2.64 431.97" stroke-dashoffset="-431.97"/>
    <circle cx="80" cy="80" r="70" fill="none" stroke="#ffc107" stroke-width="30" stroke-dasharray="1.76 431.97" stroke-dashoffset="-434.61"/>
    <circle cx="80" cy="80" r="70" fill="none" stroke="#28a745" stroke-width="30" stroke-dasharray="1.32 431.97" stroke-dashoffset="-436.37"/>
    <circle cx="80" cy="80" r="70" fill="none" stroke="#6c757d" stroke-width="30" stroke-dasharray="5.28 431.97" stroke-dashoffset="-437.69"/>
    
    <!-- Center circle -->
    <circle cx="80" cy="80" r="40" fill="white"/>
    <text x="80" y="85" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#212529">100%</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(200, 1320)">
    <rect x="0" y="0" width="15" height="15" fill="#4285f4"/>
    <text x="25" y="12" font-family="Arial, sans-serif" font-size="13" fill="#495057">Japanese 97.5%</text>
    
    <rect x="0" y="25" width="15" height="15" fill="#dc3545"/>
    <text x="25" y="37" font-family="Arial, sans-serif" font-size="13" fill="#495057">Chinese 0.6%</text>
    
    <rect x="0" y="50" width="15" height="15" fill="#ffc107"/>
    <text x="25" y="62" font-family="Arial, sans-serif" font-size="13" fill="#495057">Vietnamese 0.4%</text>
    
    <rect x="0" y="75" width="15" height="15" fill="#28a745"/>
    <text x="25" y="87" font-family="Arial, sans-serif" font-size="13" fill="#495057">South Korean 0.3%</text>
    
    <rect x="0" y="100" width="15" height="15" fill="#6c757d"/>
    <text x="25" y="112" font-family="Arial, sans-serif" font-size="13" fill="#495057">Other 1.2%</text>
  </g>
  
  <!-- Places to Visit -->
  <text x="680" y="1220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Must-Visit Destinations</text>
  <text x="680" y="1245" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">Popular tourist attractions in Japan</text>
  <text x="680" y="1270" font-family="Arial, sans-serif" font-size="14" fill="#212529">•</text>
  <text x="695" y="1270" font-family="Arial, sans-serif" font-size="14" fill="#495057">Tokyo - Modern capital with traditional temples</text>
  <text x="680" y="1295" font-family="Arial, sans-serif" font-size="14" fill="#212529">•</text>
  <text x="695" y="1295" font-family="Arial, sans-serif" font-size="14" fill="#495057">Kyoto - Ancient imperial capital with 1,600 temples</text>
  <text x="680" y="1320" font-family="Arial, sans-serif" font-size="14" fill="#212529">•</text>
  <text x="695" y="1320" font-family="Arial, sans-serif" font-size="14" fill="#495057">Osaka - Culinary capital with vibrant nightlife</text>
  <text x="680" y="1345" font-family="Arial, sans-serif" font-size="14" fill="#212529">•</text>
  <text x="695" y="1345" font-family="Arial, sans-serif" font-size="14" fill="#495057">Hiroshima/Miyajima - Peace memorial and floating torii</text>
  <text x="680" y="1370" font-family="Arial, sans-serif" font-size="14" fill="#212529">•</text>
  <text x="695" y="1370" font-family="Arial, sans-serif" font-size="14" fill="#495057">Mount Fuji/Hakone - Iconic volcano and hot springs</text>
  <text x="680" y="1395" font-family="Arial, sans-serif" font-size="14" fill="#212529">•</text>
  <text x="695" y="1395" font-family="Arial, sans-serif" font-size="14" fill="#495057">Hokkaido - Northern wilderness and winter wonderland</text>
  
  <!-- Source Note -->
  <text x="600" y="1750" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c757d">Source: World Bank, IMF, and national statistics (2024)</text>
</svg>
