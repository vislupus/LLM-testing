<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f7f9fc"/>
<stop offset="100%" stop-color="#eef3fb"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#f8fafc"/>
</linearGradient>
<linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#334155"/>
</linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.06"/>
</filter>
<style>
<![CDATA[
.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:56px;font-weight:800;fill:url(#titleGrad);letter-spacing:-1px}
.h1{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}
.body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:16px;fill:#334155;line-height:1.5}
.small{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:#64748b}
.caption{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:12px;fill:#94a3b8}
.label{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;fill:#1e293b}
.city{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:700;fill:#0f172a}
.legend{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:12px;fill:#334155}
]]>
</style>
</defs>

<rect width="1200" height="1800" fill="url(#bg)"/>
<path d="M0 300 Q300 260 600 300 T1200 280 L1200 1800 L0 1800 Z" fill="#dbeafe" opacity="0.35"/>
<path d="M0 500 Q400 460 800 500 T1200 480 L1200 1800 L0 1800 Z" fill="#c7e2ff" opacity="0.25"/>

<text x="60" y="80" class="title">Japan at a glance</text>

<!-- First row -->
<rect x="60" y="140" width="460" height="380" rx="24" fill="url(#card)" stroke="#e2e8f0" filter="url(#soft)"/>
<rect x="560" y="140" width="580" height="380" rx="24" fill="url(#card)" stroke="#e2e8f0" filter="url(#soft)"/>

<g transform="translate(100,200)">
<text x="20" y="-20" class="h1">Stylized map</text>
<path d="M200 300 L280 280 L340 320 L380 380 L360 460 L300 520 L220 540 L180 500 L160 420 L170 340 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
<path d="M240 420 L270 430 L280 470 L250 480 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
<path d="M260 520 L300 540 L320 580 L280 590 L240 570 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
<path d="M200 300 L280 280 L340 320 L380 380 L360 460 L300 520 L220 540 L180 500 L160 420 L170 340 Z" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="340" cy="320" r="4" fill="#ef4444"/>
<text x="350" y="325" class="city">Tokyo</text>
<circle cx="360" cy="340" r="4" fill="#ef4444"/>
<text x="370" y="345" class="city">Yokohama</text>
<circle cx="280" cy="460" r="4" fill="#ef4444"/>
<text x="290" y="465" class="city">Osaka</text>
<circle cx="250" y="380" r="4" fill="#ef4444"/>
<text x="260" y="385" class="city">Nagoya</text>
</g>

<g transform="translate(600,200)">
<text x="30" y="20" class="h1">Overview</text>
<text x="30" y="60" class="body">Japan is an island nation in East Asia comprising Honshu, Hokkaido, Kyushu and Shikoku.</text>
<text x="30" y="90" class="body">It is one of the world’s largest economies, with a highly developed industrial base, advanced technology and a distinctive culture.</text>
<text x="30" y="120" class="body">Four main islands host dense urban corridors, mountainous interiors and a long coastline.</text>
<text x="30" y="170" class="small">Map is schematic. City positions are approximate.</text>
</g>

<!-- Full width paragraph -->
<rect x="60" y="560" width="1080" height="100" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft)"/>
<text x="80" y="610" class="body">Japan blends tradition and innovation: from historic temples and tea ceremonies to robotics, anime and a global food culture. The archipelago’s geography shapes climate, transport and settlement patterns, while a strong civic identity underpins stable institutions and high living standards.</text>

<!-- Second row -->
<rect x="60" y="720" width="500" height="320" rx="24" fill="url(#card)" stroke="#e2e8f0" filter="url(#soft)"/>
<rect x="600" y="720" width="540" height="320" rx="24" fill="url(#card)" stroke="#e2e8f0" filter="url(#soft)"/>

<g transform="translate(80,770)">
<text class="h1">Nominal GDP, US$ trillions</text>
<text y="40" class="body">Japan remains Asia’s second-largest economy. After a peak around 2019, nominal GDP moderated with currency and price effects.</text>
<text y="70" class="small">2015–2024, current prices.</text>
</g>

<g transform="translate(620,770)">
<text x="20" y="20" class="h1">GDP 2015–2024</text>
<!-- axes -->
<line x1="40" y1="60" x2="40" y2="240" stroke="#cbd5e1" stroke-width="2"/>
<line x1="40" y1="240" x2="500" y2="240" stroke="#cbd5e1" stroke-width="2"/>
<g class="caption">
<text x="40" y="260">0</text>
<text x="40" y="200">3</text>
<text x="40" y="140">4.5</text>
<text x="40" y="80">6</text>
</g>
<!-- bars -->
<g fill="#0ea5e9">
<rect x="60" y=" -? " width="30" height="256" y="?"/>
</g>
</g>

<!-- bars computed -->
<g transform="translate(620,770)">
<rect x="40" y="60" width="460" height="200" fill="none"/>
<rect x="70" y=" -? " width="30" height="256"/>
</g>

<!-- Simpler bar drawing -->
<g transform="translate(640,800)">
<rect x="0" y="0" width="30" height="256" fill="#0ea5e9" rx="4"/>
<rect x="55" y="0" width="30" height="288" fill="#0ea5e9" rx="4"/>
<rect x="110" y="0" width="30" height="284" fill="#0ea5e9" rx="4"/>
<rect x="165" y="0" width="30" height="291" fill="#0ea5e9" rx="4"/>
<rect x="220" y="0" width="30" height="295" fill="#0ea5e9" rx="4"/>
<rect x="275" y="0" width="30" height="291" fill="#0ea5e9" rx="4"/>
<rect x="330" y="0" width="30" height="291" fill="#0ea5e9" rx="4"/>
<rect x="385" y="0" width="30" height="246" fill="#0ea5e9" rx="4"/>
<rect x="440" y="0" width="30" height="243" fill="#0ea5e9" rx="4"/>
<rect x="495" y="0" width="30" height="233" fill="#0ea5e9" rx="4"/>
</g>
<g transform="translate(640,1040)" class="caption">
<text x="10" y="0">2015</text>
<text x="65" y="0">2016</text>
<text x="120" y="0">2017</text>
<text x="175" y="0">2018</text>
<text x="230" y="0">2019</text>
<text x="285" y="0">2020</text>
<text x="340" y="0">2021</text>
<text x="395" y="0">2022</text>
<text x="450" y="0">2023</text>
<text x="505" y="0">2024</text>
</g>
<text x="640" y="760" class="caption">Values: 4.44, 5.00, 4.93, 5.04, 5.12, 5.05, 5.04, 4.26, 4.21, 4.03</text>

<!-- Bottom row -->
<rect x="60" y="1100" width="500" height="380" rx="24" fill="url(#card)" stroke="#e2e8f0" filter="url(#soft)"/>
<rect x="600" y="1100" width="540" height="380" rx="24" fill="url(#card)" stroke="#e2e8f0" filter="url(#soft)"/>

<g transform="translate(120,1150)">
<text class="h1">Population composition</text>
<!-- pie -->
<g transform="translate(220,200)">
<circle cx="0" cy="0" r="140" fill="#f1f5f9"/>
<path d="M0 0 L0 -140 A140 140 0 1 1 -21.9 111.7 Z" fill="#1e3a8a"/>
<path d="M0 0 L -21.9 111.7 A140 140 0 0 1 -16.7 111.0 Z" fill="#2563eb"/>
<path d="M0 0 L -16.7 111.0 A140 140 0 0 1 -13.2 110.6 Z" fill="#3b82f6"/>
<path d="M0 0 L -13.2 110.6 A140 140 0 0 1 -10.5 110.4 Z" fill="#60a5fa"/>
<path d="M0 0 L -10.5 110.4 A140 140 0 0 1 0 -140 Z" fill="#93c5fd"/>
<circle cx="0" cy="0" r="90" fill="#ffffff"/>
<text x="-40" y="-5" class="label">97.5%</text>
</g>
<g transform="translate(380,180)" class="legend">
<rect x="0" y="0" width="14" height="14" fill="#1e3a8a"/>
<text x="24" y="12">Japanese 97.5%</text>
<rect x="0" y="28" width="14" height="14" fill="#2563eb"/>
<text x="24" y="40">Chinese 0.6%</text>
<rect x="0" y="56" width="14" height="14" fill="#3b82f6"/>
<text x="24" y="68">Vietnamese 0.4%</text>
<rect x="0" y="84" width="14" height="14" fill="#60a5fa"/>
<text x="24" y="96">South Korean 0.3%</text>
<rect x="0" y="112" width="14" height="14" fill="#93c5fd"/>
<text x="24" y="124">Other 1.2%</text>
</g>
<text x="20" y="360" class="caption">Nationality / ethnic grouping. Donut shows dominance of Japanese population.</text>
</g>

<g transform="translate(640,1150)">
<text class="h1">What to visit</text>
<text x="20" y="60" class="body">Tokyo – neon, temples, museums and food.</text>
<text x="20" y="90" class="body">Kyoto – historic shrines, gardens and geisha districts.</text>
<text x="20" y="120" class="body">Osaka – street food, castles and vibrant nightlife.</text>
<text x="20" y="150" class="body">Hiroshima / Miyajima – peace memorial and iconic torii.</text>
<text x="20" y="180" class="body">Mount Fuji / Hakone – lakes, hot springs and views.</text>
<text x="20" y="210" class="body">Hokkaido – nature, skiing and fresh seafood.</text>
<rect x="20" y="240" width="500" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="270" class="small">Seasonal highlights: cherry blossoms in spring, clear air in autumn, festivals year-round.</text>
</g>

<text x="60" y="1760" class="caption">Source note: GDP nominal US$ trillions 2015–2024, World Bank / IMF estimates; population composition illustrative. Map schematic.</text>
</svg>