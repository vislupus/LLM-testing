<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7faff"/>
    <stop offset="100%" stop-color="#eef3ff"/>
  </linearGradient>

  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f3f6ff"/>
  </linearGradient>

  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5b7cff"/>
    <stop offset="100%" stop-color="#2f4fe0"/>
  </linearGradient>

  <style>
    .title {font:700 56px sans-serif; fill:#1a1f36;}
    .h2 {font:600 26px sans-serif; fill:#1a1f36;}
    .body {font:400 18px sans-serif; fill:#2c3553;}
    .small {font:400 14px sans-serif; fill:#5b6480;}
    .label {font:600 15px sans-serif; fill:#2c3553;}
  </style>
</defs>

<!-- Background -->
<rect width="1200" height="1800" fill="url(#bg)"/>
<path d="M0 100 Q300 200 600 120 T1200 120 V0 H0 Z" fill="#ffffff" opacity="0.6"/>
<path d="M0 1700 Q300 1600 600 1680 T1200 1650 V1800 H0 Z" fill="#ffffff" opacity="0.6"/>

<!-- Title -->
<text x="600" y="90" text-anchor="middle" class="title">Japan at a glance</text>

<!-- Row 1 -->
<rect x="60" y="140" width="500" height="400" rx="20" fill="url(#card)"/>
<rect x="640" y="140" width="500" height="400" rx="20" fill="url(#card)"/>

<!-- Map -->
<g transform="translate(90,170)">
  <text class="h2">Geography</text>

  <!-- Simplified islands -->
  <path d="M250 30 L310 10 L350 40 L330 90 L270 80 Z" fill="#cfe0ff"/>
  <path d="M200 120 L300 90 L360 140 L330 240 L260 270 L200 230 Z" fill="#cfe0ff"/>
  <path d="M190 280 L260 270 L280 310 L230 340 Z" fill="#cfe0ff"/>
  <path d="M120 300 L190 280 L210 320 L160 360 Z" fill="#cfe0ff"/>

  <!-- Cities -->
  <circle cx="310" cy="120" r="6" fill="#ff4b4b"/>
  <circle cx="300" cy="135" r="6" fill="#ff4b4b"/>
  <circle cx="260" cy="200" r="6" fill="#ff4b4b"/>
  <circle cx="230" cy="250" r="6" fill="#ff4b4b"/>

  <text x="320" y="120" class="label">Tokyo</text>
  <text x="310" y="145" class="label">Yokohama</text>
  <text x="270" y="205" class="label">Nagoya</text>
  <text x="240" y="260" class="label">Osaka</text>
</g>

<!-- Intro text -->
<g transform="translate(660,170)">
  <text class="h2">Overview</text>
  <text y="40" class="body">
    Japan is an island nation in East Asia known for blending ancient traditions with
    cutting-edge technology. Its economy is one of the largest globally, while its
    culture—from cuisine to design—has worldwide influence.
  </text>
</g>

<!-- Full paragraph -->
<rect x="60" y="570" width="1080" height="100" rx="16" fill="url(#card)"/>
<text x="80" y="620" class="body">
  Japan stretches across a diverse landscape, from snowy mountains to coastal plains.
  Its efficient transport, strong cultural identity, and seasonal beauty make it one of
  the most distinctive and accessible travel destinations in the world.
</text>

<!-- Row 2 -->
<rect x="60" y="700" width="500" height="420" rx="20" fill="url(#card)"/>
<rect x="640" y="700" width="500" height="420" rx="20" fill="url(#card)"/>

<!-- Economy text -->
<g transform="translate(80,740)">
  <text class="h2">Economy</text>
  <text y="40" class="body">
    Japan’s GDP has remained stable around 4–5 trillion USD over the past decade.
    While growth is moderate, it remains a global leader in manufacturing,
    technology, and exports.
  </text>
</g>

<!-- Bar chart -->
<g transform="translate(660,740)">
  <text class="h2">GDP (US$ trillions)</text>

  <!-- axis -->
  <line x1="0" y1="320" x2="460" y2="320" stroke="#333"/>

  <!-- bars -->
  <g fill="url(#bar)">
    <rect x="0" y="120" width="30" height="200"/>
    <rect x="45" y="100" width="30" height="220"/>
    <rect x="90" y="105" width="30" height="215"/>
    <rect x="135" y="98" width="30" height="222"/>
    <rect x="180" y="95" width="30" height="225"/>
    <rect x="225" y="100" width="30" height="220"/>
    <rect x="270" y="98" width="30" height="222"/>
    <rect x="315" y="130" width="30" height="190"/>
    <rect x="360" y="135" width="30" height="185"/>
    <rect x="405" y="145" width="30" height="175"/>
  </g>

  <!-- labels -->
  <g class="small">
    <text x="0" y="340">15</text>
    <text x="45" y="340">16</text>
    <text x="90" y="340">17</text>
    <text x="135" y="340">18</text>
    <text x="180" y="340">19</text>
    <text x="225" y="340">20</text>
    <text x="270" y="340">21</text>
    <text x="315" y="340">22</text>
    <text x="360" y="340">23</text>
    <text x="405" y="340">24</text>
  </g>
</g>

<!-- Row 3 -->
<rect x="60" y="1150" width="500" height="420" rx="20" fill="url(#card)"/>
<rect x="640" y="1150" width="500" height="420" rx="20" fill="url(#card)"/>

<!-- Donut -->
<g transform="translate(310,1360)">
  <text class="h2" text-anchor="middle" y="-200">Population</text>

  <circle r="120" fill="none" stroke="#eee" stroke-width="40"/>
  <circle r="120" fill="none" stroke="#ff4b4b" stroke-width="40"
          stroke-dasharray="736 20" transform="rotate(-90)"/>
</g>

<!-- Legend -->
<g transform="translate(120,1420)" class="small">
  <rect width="14" height="14" fill="#ff4b4b"/><text x="20" y="12">Japanese 97.5%</text>
  <rect y="20" width="14" height="14" fill="#ffd166"/><text x="20" y="32">Chinese 0.6%</text>
  <rect y="40" width="14" height="14" fill="#06d6a0"/><text x="20" y="52">Vietnamese 0.4%</text>
  <rect y="60" width="14" height="14" fill="#118ab2"/><text x="20" y="72">South Korean 0.3%</text>
  <rect y="80" width="14" height="14" fill="#888"/><text x="20" y="92">Other 1.2%</text>
</g>

<!-- Travel text -->
<g transform="translate(660,1190)">
  <text class="h2">Top destinations</text>
  <text y="40" class="body">
    Tokyo offers vibrant city life; Kyoto preserves traditional culture; Osaka is famous for food;
    Hiroshima and Miyajima provide history and scenery; Mount Fuji and Hakone offer iconic landscapes;
    and Hokkaido features nature and winter sports.
  </text>
</g>

<!-- Source -->
<text x="60" y="1750" class="small">
  Source: IMF (GDP), national statistics (population)
</text>

</svg>