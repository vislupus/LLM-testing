<text x="620" y="1200" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2c3e50">What to Visit</text>
<line x1="620" y1="1210" x2="780" y2="1210" stroke="#c0392b" stroke-width="2"/>
<circle cx="628" cy="1245" r="5" fill="#c0392b"/>
<text x="642" y="1249" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3e50">Tokyo</text>
<text x="642" y="1267" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">A dazzling metropolis blending ultramodern neon districts</text>
<text x="642" y="1285" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">with historic temples and world-class cuisine.</text>
<circle cx="628" cy="1310" r="5" fill="#c0392b"/>
<text x="642" y="1314" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3e50">Kyoto</text>
<text x="642" y="1332" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">The cultural heart of Japan, home to over 2,000 temples,</text>
<text x="642" y="1350" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">shrines, and stunning traditional gardens.</text>
<circle cx="628" cy="1375" r="5" fill="#c0392b"/>
<text x="642" y="1379" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3e50">Osaka</text>
<text x="642" y="1397" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">Known as Japan's kitchen, famous for street food, vibrant</text>
<text x="642" y="1415" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">nightlife, and the majestic Osaka Castle.</text>
<circle cx="628" cy="1440" r="5" fill="#c0392b"/>
<text x="642" y="1444" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3e50">Hiroshima / Miyajima</text>
<text x="642" y="1462" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">A place of profound peace memorials and the iconic floating</text>
<text x="642" y="1480" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">torii gate on a sacred island.</text>
<circle cx="628" cy="1505" r="5" fill="#c0392b"/>
<text x="642" y="1509" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3e50">Mount Fuji / Hakone</text>
<text x="642" y="1527" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">Japan's iconic stratovolcano surrounded by hot springs,</text>
<text x="642" y="1545" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">lakes, and breathtaking natural scenery.</text>
<circle cx="628" cy="1570" r="5" fill="#c0392b"/>
<text x="642" y="1574" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3e50">Hokkaido</text>
<text x="642" y="1592" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">A northern paradise of vast wilderness, ski resorts,</text>
<text x="642" y="1610" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">lavender fields, and fresh seafood.</text>
<text x="600" y="1770" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#95a5a6">Sources: World Bank (GDP data), Statistics Bureau of Japan (population data), Japan National Tourism Organization (JNTO)</text>
