<text x="350" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d" font-style="italic">Major cities of Japan</text>
<text x="640" y="200" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">Japan is an island nation in East Asia, located in</text>
<text x="640" y="226" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">the Pacific Ocean. It consists of four main islands—</text>
<text x="640" y="252" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">Honshu, Hokkaido, Kyushu, and Shikoku—along</text>
<text x="640" y="278" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">with nearly 7,000 smaller islands. Covering</text>
<text x="640" y="304" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">approximately 377,975 km², it is the 62nd largest</text>
<text x="640" y="330" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">country in the world. Japan is known for its unique</text>
<text x="640" y="356" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">blend of ancient traditions and cutting-edge</text>
<text x="640" y="382" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">modernity, from serene temples and tea ceremonies</text>
<text x="640" y="408" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">to bustling neon-lit cities and advanced robotics.</text>
<text x="640" y="434" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">With a population of about 123 million, it is one</text>
<text x="640" y="460" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">of the most densely populated and urbanized</text>
<text x="640" y="486" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="400">countries globally.</text>
<text x="100" y="600" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">Japan operates under a constitutional monarchy with a parliamentary government. The Emperor serves as the ceremonial head of</text>
<text x="100" y="626" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">state, while the Prime Minister holds executive power. The country is a global leader in technology, automotive</text>
<text x="100" y="652" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">manufacturing, and electronics, with brands like Toyota, Sony, and Nintendo recognized worldwide. Japan also boasts one of</text>
<text x="100" y="678" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">the highest life expectancies and literacy rates globally.</text>
<rect x="50" y="740" width="1100" height="380" rx="16" fill="#ffffff" filter="url(#shadow)"/>
<text x="100" y="800" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2c3e50">Economic Overview</text>
<line x1="100" y1="810" x2="280" y2="810" stroke="#c0392b" stroke-width="2"/>
<text x="100" y="845" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">Japan has the third-largest economy in the</text>
<text x="100" y="869" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">world by nominal GDP. Despite decades of</text>
<text x="100" y="893" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">stagnation and deflation, it remains a global</text>
<text x="100" y="917" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">economic powerhouse driven by manufacturing,</text>
<text x="100" y="941" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">technology, and services. The yen is one of the</text>
<text x="100" y="965" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">most traded currencies worldwide. In recent</text>
<text x="100" y="989" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">years, Japan has faced demographic challenges</text>
<text x="100" y="1013" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">including an aging population and declining</text>
<text x="100" y="1037" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">birth rates, which continue to shape its</text>
<text x="100" y="1061" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">economic trajectory and policy decisions.</text>
<text x="840" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2c3e50">Nominal GDP (Current US$ Trillions)</text>
