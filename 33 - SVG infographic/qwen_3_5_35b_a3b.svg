<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" style="font-family: system-ui, -apple-system, sans-serif;">
  <!-- DEFS -->
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#e60000"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave Pattern Filter -->
    <pattern id="waves" x="0" y="0" width="100" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q25 35 50 20 T100 20" stroke="#f0f4f8" stroke-width="2" fill="none"/>
    </pattern>
    
    <!-- Fonts -->
    <style>
      .title { font-size: 60px; font-weight: 800; letter-spacing: -1px; fill: #1a1a1a; }
      .subtitle { font-size: 24px; font-weight: 600; color: #4a4a4a; text-transform: uppercase; letter-spacing: 1px; }
      .body-text { font-size: 18px; line-height: 1.6; color: #444; }
      .caption { font-size: 14px; fill: #888; }
      .gdp-label { font-size: 12px; font-weight: 600; fill: #fff; }
      .data-point { font-size: 16px; font-weight: bold; fill: #333; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgTop)"/>
  <!-- Decorative Waves -->
  <rect width="1200" height="1800" fill="url(#waves)" opacity="0.6"/>

  <!-- HEADER ROW -->
  
  <!-- Top Line -->
  <line x1="100" y1="100" x2="1100" y2="100" stroke="#eee" stroke-width="2"/>

  <!-- Main Title -->
  <text x="100" y="150" class="title">JAPAN AT A GLANCE</text>
  <text x="100" y="185" class="subtitle">Geography • Economy • Demographics</text>

  <!-- SECTION 1: MAP & INTRO -->
  
  <!-- Card Container for Section 1 -->
  <g transform="translate(0, 220)">
    <!-- Intro Text Card -->
    <rect x="650" y="0" width="500" height="280" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="750" y="40" class="subtitle">The Land of the Rising Sun</text>
    <text x="750" y="75" class="body-text">
      Located in East Asia, Japan is a sprawling archipelago of over 6,800 islands. Known for blending ancient traditions with cutting-edge technology, it features iconic landmarks like Mount Fuji, cherry blossoms (Sakura), and vibrant cyber-culture. As the world's fourth-largest economy by nominal GDP, Japan is a global hub for innovation, automotive manufacturing, and electronics. Its society is known for its high safety standards, exceptional service (Omotenashi), and rich culinary heritage recognized globally.
    </text>

    <!-- Stylized Map Card -->
    <rect x="0" y="40" width="500" height="200" rx="12" fill="#F9FAFB"/>
    <!-- Map Group -->
    <g transform="translate(250, 140)" id="mapGroup">
       <!-- Simple Abstract Japan Silhouette -->
       <path d="M-60,-140 L-30,-120 Q-10,-130 10,-110 L30,-60 L60,-20 L40,10 L30,40 Q10,50 -10,60 L-30,50 Z" fill="#e6eaf0" stroke="#cbd5e0" stroke-width="2"/>
       
       <!-- Hokkaido -->
       <path d="M-80,-180 Q-60,-190 -40,-170 L-30,-130 L-70,-120 Z" fill="#e6eaf0" stroke="#cbd5e0" stroke-width="1.5"/>
       
       <!-- Honshu main body refinement -->
       <path d="M-30,-130 L-60,-20 Q-30,40 10,50 L40,-40 Z" fill="transparent" stroke="none"/> <!-- Path overlay for logic, mainly decorative lines used below -->
       
       <!-- Cities as Points -->
       <circle cx="-15" cy="-110" r="3" fill="#e60000"/>
       <text x="-40" y="-115" class="caption" style="font-weight:600;">Tokyo</text>
       
       <circle cx="-10" cy="-60" r="3" fill="#e60000"/>
       <text x="-35" y="-65" class="caption" style="font-weight:600;">Osaka/Kyoto</text>
       
       <circle cx="35" cy="-50" r="3" fill="#e60000"/>
       <text x="55" y="-55" class="caption" style="font-weight:600;">Nagoya</text>
       
       <!-- Hokkaido City -->
       <circle cx="-40" cy="-160" r="3" fill="#e60000"/>
       <text x="-65" y="-165" class="caption" style="font-weight:600;">Sapporo</text>
    </g>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="50" y1="530" x2="1150" y2="530" stroke="#ddd" stroke-width="4" stroke-linecap="round"/>

  <!-- SECTION 2: ECONOMY & GROWTH -->
  <g transform="translate(0, 570)">
    
    <!-- Full Width Text Block -->
    <text x="100" y="0" class="subtitle" transform="rotate(-90 100,0)"></text> <!-- Spacer -->
    <text x="0" y="50" class="body-text" width="1200">
      Japan has faced economic stagnation known as the "Lost Decades," characterized by deflation and low growth. However, despite slowing expansion compared to emerging Asian markets, it remains a financial powerhouse. The Bank of Japan utilizes unconventional monetary policies to combat deflationary pressure. Recent years show a slight recovery in tourism exports post-pandemic, though domestic consumption remains sluggish due to an aging population and rising inflation costs.
    </text>

    <!-- Split Layout: Description (Left) + GDP Chart (Right) -->
    
    <!-- Left Text -->
    <g transform="translate(0, 100)">
       <text x="0" y="40" class="subtitle">Economic Performance (Nominal GDP)</text>
       <text x="0" y="70" class="caption">Measured in Trillions of US Dollars.</text>
       <rect x="0" y="100" width="300" height="20" fill="#f0f4f8" rx="4" opacity="0.5"/>
       <text x="0" y="115" class="caption" style="fill:#1a1a1a">GDP has remained relatively stable around $4-5 trillion, showing resilience against global shifts.</text>
    </g>

    <!-- Right Chart Area -->
    <g transform="translate(550, 100)">
       <!-- Chart Box -->
       <rect x="0" y="0" width="600" height="300" rx="8" fill="url(#cardGrad)" stroke="#eee" filter="url(#shadow)"/>
       
       <!-- Chart Title -->
       <text x="300" y="30" text-anchor="middle" font-weight="bold" fill="#333">Nominal GDP Trends (2015–2024)</text>
       
       <!-- Bars (Max Value 5.2) -->
       <!-- 2015: 4.44 -->
       <rect x="20" y="230" width="40" height="100" fill="#3b82f6"/> 
       <text x="40" y="245" text-anchor="middle" font-size="11" fill="#555">2015</text>
       <text x="40" y="295" text-anchor="middle" font-size="10" fill="#555">$4.44T</text>
       
       <!-- 2016: 5.00 -->
       <rect x="80" y="200" width="40" height="130" fill="#3b82f6"/>
       <text x="100" y="245" text-anchor="middle" font-size="11" fill="#555">2016</text>
       <text x="100" y="295" text-anchor="middle" font-size="10" fill="#555">$5.00T</text>

       <!-- 2017: 4.93 -->
       <rect x="140" y="205" width="40" height="125" fill="#3b82f6"/>
       <text x="160" y="245" text-anchor="middle" font-size="11" fill="#555">2017</text>
       <text x="160" y="295" text-anchor="middle" font-size="10" fill="#555">$4.93T</text>

       <!-- 2018: 5.04 -->
       <rect x="200" y="198" width="40" height="132" fill="#3b82f6"/>
       <text x="220" y="245" text-anchor="middle" font-size="11" fill="#555">2018</text>
       <text x="220" y="295" text-anchor="middle" font-size="10" fill="#555">$5.04T</text>

       <!-- 2019: 5.12 -->
       <rect x="260" y="192" width="40" height="138" fill="#ef4444"/> <!-- Peak color -->
       <text x="280" y="245" text-anchor="middle" font-size="11" fill="#555">2019</text>
       <text x="280" y="295" text-anchor="middle" font-size="10" fill="#555">$5.12T</text>

       <!-- 2020: 5.05 -->
       <rect x="320" y="200" width="40" height="130" fill="#fbbf24"/>
       <text x="340" y="245" text-anchor="middle" font-size="11" fill="#555">2020</text>
       <text x="340" y="295" text-anchor="middle" font-size="10" fill="#555">$5.05T</text>

       <!-- 2021: 5.04 -->
       <rect x="380" y="198" width="40" height="132" fill="#fbbf24"/>
       <text x="400" y="245" text-anchor="middle" font-size="11" fill="#555">2021</text>
       <text x="400" y="295" text-anchor="middle" font-size="10" fill="#555">$5.04T</text>

       <!-- 2022: 4.26 -->
       <rect x="440" y="252" width="40" height="78" fill="#10b981"/> <!-- Dip -->
       <text x="460" y="245" text-anchor="middle" font-size="11" fill="#555">2022</text>
       <text x="460" y="295" text-anchor="middle" font-size="10" fill="#555">$4.26T</text>

       <!-- 2023: 4.21 -->
       <rect x="500" y="255" width="40" height="75" fill="#10b981"/>
       <text x="520" y="245" text-anchor="middle" font-size="11" fill="#555">2023</text>
       <text x="520" y="295" text-anchor="middle" font-size="10" fill="#555">$4.21T</text>

       <!-- 2024: 4.03 -->
       <rect x="560" y="270" width="40" height="60" fill="#6b7280"/>
       <text x="580" y="245" text-anchor="middle" font-size="11" fill="#555">2024</text>
       <text x="580" y="295" text-anchor="middle" font-size="10" fill="#555">$4.03T</text>
       
       <!-- Axis Y labels -->
       <text x="10" y="200" font-size="10" fill="#aaa" transform="rotate(-90 10,200)">Yen Devaluation</text>
    </g>
  </g>

  <!-- FOOTER SECTION -->
  <g transform="translate(0, 920)">
    
    <!-- Bottom Horizontal Bar -->
    <rect x="0" y="0" width="1200" height="5" fill="#e60000"/>

    <!-- SECTION 3: POPULATION & DESTINATIONS -->
    
    <!-- Pop Chart (Left) -->
    <g transform="translate(50, 60)">
      <text x="300" y="0" class="subtitle">Population Breakdown</text>
      
      <!-- Donut Chart Centered at 300, 100 -->
      <g transform="translate(300, 100)">
         <!-- Outer Circle (White background) -->
         <circle r="80" fill="#ffffff" stroke="#f3f4f6" stroke-width="40"/>
         
         <!-- Slices -->
         <!-- Japanese 97.5% - Blue -->
         <path d="M0,0 L0,-80 A80,80 0 1,1 -6,-80 Z" fill="#1e3a8a" transform="rotate(0)">
            <animate attributeName="stroke-dasharray" values="990,2; 700,10" dur="1s" fill="freeze"/>
         </path>
         
         <!-- Other 1.2% - Light Grey -->
         <path d="M0,0 L-6,-80 A80,80 0 1,1 10,79 Z" fill="#9ca3af"/>
         
         <!-- South Korean 0.3% - Yellow -->
         <path d="M0,0 L10,79 A80,80 0 1,1 35,68 Z" fill="#facc15"/>
         
         <!-- Vietnamese 0.4% - Orange -->
         <path d="M0,0 L35,68 A80,80 0 1,1 48,60 Z" fill="#fb923c"/>
         
         <!-- Chinese 0.6% - Pink/Red -->
         <path d="M0,0 L48,60 A80,80 0 1,1 65,50 Z" fill="#ec4899"/>
         
         <!-- Inner White Circle for Donut -->
         <circle r="45" fill="#ffffff"/>
         
         <!-- Center Label -->
         <text x="0" y="-50" text-anchor="middle" font-weight="bold" fill="#333">Mainly</text>
         <text x="0" y="-35" text-anchor="middle" font-weight="bold" fill="#e60000" font-size="18">Japanese</text>
      </g>
      
      <!-- Legend -->
      <g transform="translate(0, 200)">
         <line x1="0" y1="10" x2="50" y2="10" stroke="#1e3a8a"/>
         <text x="55" y="15" font-size="14">Japanese (97.5%)</text>
         
         <line x1="0" y1="40" x2="50" y2="40" stroke="#ec4899"/>
         <text x="55" y="45" font-size="14">Chinese (0.6%)</text>
         
         <line x1="0" y1="70" x2="50" y2="70" stroke="#fb923c"/>
         <text x="55" y="75" font-size="14">Vietnamese (0.4%)</text>
         
         <line x1="0" y1="100" x2="50" y2="100" stroke="#facc15"/>
         <text x="55" y="105" font-size="14">South Korean (0.3%)</text>
         
         <line x1="0" y1="130" x2="50" y2="130" stroke="#9ca3af"/>
         <text x="55" y="135" font-size="14">Other (1.2%)</text>
      </g>
    </g>

    <!-- Destinations (Right) -->
    <g transform="translate(750, 60)">
      <text x="300" y="0" class="subtitle">Must Visit Spots</text>
      
      <!-- List Items -->
      <g transform="translate(0, 30)">
        <!-- Tokyo -->
        <circle cx="0" cy="0" r="4" fill="#e60000"/>
        <text x="15" y="5" font-size="16" font-weight="bold">Tokyo</text>
        <text x="15" y="25" font-size="14" fill="#555">Metropolis of neon lights, shopping, and deep cultural sites like Senso-ji Temple.</text>
        
        <!-- Kyoto -->
        <circle cx="0" cy="50" r="4" fill="#e60000"/>
        <text x="15" y="55" font-size="16" font-weight="bold">Kyoto</text>
        <text x="15" y="75" font-size="14" fill="#555">Ancient capital with thousands of temples, traditional tea ceremonies, and geisha culture.</text>
        
        <!-- Osaka -->
        <circle cx="0" cy="100" r="4" fill="#e60000"/>
        <text x="15" y="105" font-size="16" font-weight="bold">Osaka</text>
        <text x="15" y="125" font-size="14" fill="#555">Known for street food (Takoyaki), nightlife in Dotonbori, and the massive Osaka Castle.</text>
        
        <!-- Miyajima/Hiroshima -->
        <circle cx="0" cy="150" r="4" fill="#e60000"/>
        <text x="15" y="155" font-size="16" font-weight="bold">Hiroshima/Miyajima</text>
        <text x="15" y="175" font-size="14" fill="#555">Site of the Peace Memorial Park and the floating Torii gate of Itsukushima Shrine.</text>
        
        <!-- Mt. Fuji/Hakone -->
        <circle cx="0" cy="200" r="4" fill="#e60000"/>
        <text x="15" y="205" font-size="16" font-weight="bold">Mount Fuji/Hakone</text>
        <text x="15" y="225" font-size="14" fill="#555">Iconic mountain views, hot springs (Onsen), and scenic landscapes perfect for hikers.</text>
        
        <!-- Hokkaido -->
        <circle cx="0" cy="250" r="4" fill="#e60000"/>
        <text x="15" y="255" font-size="16" font-weight="bold">Hokkaido</text>
        <text x="15" y="275" font-size="14" fill="#555">Northern island famous for winter snow festivals, dairy products, and pristine nature.</text>
      </g>
    </g>
    
    <!-- Footer Note -->
    <rect x="0" y="350" width="1200" height="50" fill="#f9fafb"/>
    <text x="600" y="380" text-anchor="middle" font-size="12" fill="#888" font-style="italic">Data Source: World Bank, CIA World Factbook (Nominal GDP Estimates). Graphics generated by AI.</text>
  </g>
</svg>