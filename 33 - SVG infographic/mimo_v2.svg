<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGrad)"/>
  <path d="M0,1700 Q300,1650 600,1750 T1200,1700 L1200,1800 L0,1800 Z" fill="#e1e8ed" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="100" font-family="sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="#2c3e50">JAPAN AT A GLANCE</text>

  <!-- Row 1: Map and Intro -->
  <rect x="50" y="200" width="550" height="400" rx="10" fill="white" filter="url(#shadow)"/>
  <!-- Simplified Japan Map Shape -->
  <path d="M200,250 C220,280 230,350 250,400 C270,450 300,500 350,550" stroke="#34495e" stroke-width="20" fill="none" stroke-linecap="round"/>
  <circle cx="280" cy="380" r="8" fill="#e74c3c"/><text x="295" y="385" font-size="16">Tokyo</text>
  <circle cx="275" cy="400" r="6" fill="#3498db"/><text x="290" y="405" font-size="16">Yokohama</text>
  <circle cx="240" cy="460" r="6" fill="#3498db"/><text x="255" y="465" font-size="16">Osaka</text>
  <circle cx="260" cy="430" r="6" fill="#3498db"/><text x="275" y="435" font-size="16">Nagoya</text>

  <text x="650" y="250" font-family="sans-serif" font-size="24" fill="#34495e" style="line-height:30px">
    <tspan x="650" dy="0">Japan is an island nation in East Asia, located in the northwest Pacific Ocean.</tspan>
    <tspan x="650" dy="40">Known for its unique blend of ancient traditions and cutting-edge</tspan>
    <tspan x="650" dy="40">technology, it remains one of the world's most influential economies.</tspan>
  </text>

  <!-- Full width paragraph -->
  <text x="50" y="650" font-family="sans-serif" font-size="22" fill="#555" style="line-height:35px">
    <tspan x="50" dy="0">Japan is a stratovolcanic archipelago consisting of about 6,852 islands. The country is known for its high quality of life,</tspan>
    <tspan x="50" dy="35">world-class culinary scene, and deeply rooted cultural heritage, ranging from serene shrines and temples to vibrant</tspan>
    <tspan x="50" dy="35">metropolitan hubs. It faces challenges of an aging population but maintains a robust industrial and service sector.</tspan>
  </text>

  <!-- Row 2: GDP Chart -->
  <rect x="50" y="750" width="1100" height="450" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="70" y="800" font-size="28" font-weight="bold">GDP (Trillion USD) 2015–2024</text>
  <!-- Bar Chart simplified representation -->
  <g transform="translate(100, 850)">
    <rect x="0" y="250" width="80" height="44" fill="#3498db"/> <text x="10" y="240" font-size="12">4.44</text><text x="10" y="300" font-size="12">2015</text>
    <rect x="100" y="200" width="80" height="94" fill="#3498db"/> <text x="110" y="190" font-size="12">5.00</text><text x="110" y="300" font-size="12">2016</text>
    <rect x="200" y="207" width="80" height="87" fill="#3498db"/> <text x="210" y="197" font-size="12">4.93</text><text x="210" y="300" font-size="12">2017</text>
    <rect x="300" y="196" width="80" height="98" fill="#3498db"/> <text x="310" y="186" font-size="12">5.04</text><text x="310" y="300" font-size="12">2018</text>
    <rect x="400" y="188" width="80" height="106" fill="#3498db"/> <text x="410" y="178" font-size="12">5.12</text><text x="410" y="300" font-size="12">2019</text>
    <rect x="500" y="195" width="80" height="99" fill="#3498db"/> <text x="510" y="185" font-size="12">5.05</text><text x="510" y="300" font-size="12">2020</text>
    <rect x="600" y="196" width="80" height="98" fill="#3498db"/> <text x="610" y="186" font-size="12">5.04</text><text x="610" y="300" font-size="12">2021</text>
    <rect x="700" y="274" width="80" height="20" fill="#3498db"/> <text x="710" y="264" font-size="12">4.26</text><text x="710" y="300" font-size="12">2022</text>
    <rect x="800" y="279" width="80" height="15" fill="#3498db"/> <text x="810" y="269" font-size="12">4.21</text><text x="810" y="300" font-size="12">2023</text>
    <rect x="900" y="297" width="80" height="12" fill="#3498db"/> <text x="910" y="287" font-size="12">4.03</text><text x="910" y="300" font-size="12">2024</text>
  </g>

  <!-- Row 3: Demographics & Tourism -->
  <rect x="50" y="1250" width="500" height="400" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="70" y="1300" font-weight="bold" font-size="24">Population Composition</text>
  <circle cx="200" cy="1450" r="80" fill="none" stroke="#2ecc71" stroke-width="40" stroke-dasharray="480 500"/>
  <text x="320" y="1400" font-size="18">97.5% Japanese</text>
  <text x="320" y="1430" font-size="18">0.6% Chinese</text>
  <text x="320" y="1460" font-size="18">0.4% Vietnamese</text>
  <text x="320" y="1490" font-size="18">1.5% Other</text>

  <rect x="600" y="1250" width="550" height="400" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="630" y="1300" font-weight="bold" font-size="24">Top Destinations to Visit</text>
  <text x="630" y="1350" font-size="20" fill="#444">
    <tspan x="630" dy="30">• Tokyo (Modern Metropolis)</tspan>
    <tspan x="630" dy="30">• Kyoto (Traditional Temples)</tspan>
    <tspan x="630" dy="30">• Osaka (Food Capital)</tspan>
    <tspan x="630" dy="30">• Hiroshima / Miyajima</tspan>
    <tspan x="630" dy="30">• Mount Fuji / Hakone</tspan>
    <tspan x="630" dy="30">• Hokkaido (Nature &amp; Skiing)</tspan>
  </text>

  <!-- Source -->
  <text x="50" y="1750" font-size="14" fill="#999">Source: World Bank data, national census estimates, 2024. Static infographic.</text>
</svg>