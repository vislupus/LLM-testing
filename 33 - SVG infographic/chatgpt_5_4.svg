  <path d="M0,1640 C180,1595 340,1710 520,1665 C700,1620 825,1555 1010,1608 C1088,1630 1148,1655 1200,1672 L1200,1800 L0,1800 Z" fill="#ffffff" fill-opacity="0.66"/>
