<?xml version="1.0" encoding="UTF-8"?>

<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Japan at a glance</title>
  <desc id="desc">A single-page editorial infographic about Japan with a stylized map, GDP bar chart, population donut chart, explanatory text, travel recommendations, legends, captions, and source note.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#f6f2ff"/>
    </linearGradient>


<radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#ffd7dd" stop-opacity="0.9"/>
  <stop offset="100%" stop-color="#ffd7dd" stop-opacity="0"/>
</radialGradient>

<linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
  <stop offset="100%" stop-color="#f3f7ff" stop-opacity="0.95"/>
</linearGradient>

<linearGradient id="mapFill" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#d7e6ff"/>
  <stop offset="100%" stop-color="#b9d2ff"/>
</linearGradient>

<linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#5f82ff"/>
  <stop offset="100%" stop-color="#2f57e8"/>
</linearGradient>

<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
  <feOffset dx="0" dy="10" in="SourceAlpha" result="off"/>
  <feGaussianBlur in="off" stdDeviation="12" result="blur"/>
  <feColorMatrix in="blur" type="matrix"
    values="0 0 0 0 0.14
            0 0 0 0 0.23
            0 0 0 0 0.40
            0 0 0 0.12 0" result="shadowColor"/>
  <feBlend in="SourceGraphic" in2="shadowColor" mode="normal"/>
</filter>

<style><![CDATA[
  .title { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 64px; font-weight: 800; fill: #172033; letter-spacing: -1px; }
  .subtitle { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #58657a; }
  .kicker { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.7px; text-transform: uppercase; fill: #6e7d93; }
  .h2 { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #172033; }
  .body { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #2e3b50; }
  .bodySm { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #2e3b50; }
  .label { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #243247; }
  .small { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #66748a; }
  .tiny { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #7a879b; letter-spacing: 0.4px; }
  .axis { stroke: #a8b5cb; stroke-width: 1; }
  .grid { stroke: #d9e3f2; stroke-width: 1; }
  .cardStroke { stroke: #d7e1f0; stroke-width: 1; }
]]></style>


