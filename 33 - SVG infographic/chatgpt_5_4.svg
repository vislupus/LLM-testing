  <!-- Row 1 right: overview -->

  <g transform="translate(660,184)">
    <text x="0" y="0" class="kicker">Overview</text>
    <text x="0" y="36" class="h2">A nation of islands, craft and innovation</text>


<g transform="translate(0,62)">
  <circle cx="418" cy="38" r="54" fill="#edf3ff"/>
  <path d="M410,16 L422,40 L448,44 L428,60 L434,86 L410,72 L386,86 L392,60 L372,44 L398,40 Z" fill="#ffcf5c"/>
</g>

<text x="0" y="98" class="body">
  <tspan x="0" dy="0">Japan is an island country in East Asia made up of four main</tspan>
  <tspan x="0" dy="30">islands and thousands of smaller ones. It combines dense</tspan>
  <tspan x="0" dy="30">megacities, highly efficient infrastructure and deep cultural</tspan>
  <tspan x="0" dy="30">continuity, from Shinto shrines and tea rituals to robotics,</tspan>
  <tspan x="0" dy="30">advanced manufacturing and global design influence.</tspan>
  <tspan x="0" dy="30">Mountainous terrain shapes both settlement and travel, while</tspan>
  <tspan x="0" dy="30">the surrounding seas have long linked Japan to trade, fishing</tspan>
  <tspan x="0" dy="30">and a distinct maritime identity.</tspan>
</text>

<g transform="translate(0,334)">
  <rect x="0" y="0" width="194" height="34" rx="17" fill="#eef4ff" stroke="#d7e3fb"/>
  <text x="18" y="22" class="small">Capital: Tokyo</text>
  <rect x="208" y="0" width="242" height="34" rx="17" fill="#fff3f5" stroke="#ffe0e7"/>
  <text x="226" y="22" class="small">Modern economy, historic culture</text>
</g>


  </g>

  <!-- Full-width paragraph -->

  <g transform="translate(84,620)">
    <text x="0" y="0" class="body">
      <tspan x="0" dy="0">From the snowy peaks and ski towns of Hokkaido to the temple districts of Kyoto and the subtropical edges of the south, Japan offers dramatic regional variety within a compact, highly connected territory.</tspan>
      <tspan x="0" dy="31">Fast rail, meticulous urban design and seasonal traditions such as cherry blossom viewing and autumn foliage make the country especially legible to travelers: efficient to move through, yet rich in local detail and atmosphere.</tspan>
    </text>
  </g>

  <!-- Row 2 left: economy text -->

  <g transform="translate(90,764)">
    <text x="0" y="0" class="kicker">Economy</text>
    <text x="0" y="36" class="h2">A large economy with a flatter recent decade</text>


<text x="0" y="96" class="body">
  <tspan x="0" dy="0">In the supplied series, Japan’s nominal GDP remains above</tspan>
  <tspan x="0" dy="30">US$4 trillion throughout 2015–2024, peaking at US$5.12 trillion</tspan>
  <tspan x="0" dy="30">in 2019. The chart shows a relatively narrow band around the</tspan>
  <tspan x="0" dy="30">US$5 trillion mark through 2021, followed by a lower run from</tspan>
  <tspan x="0" dy="30">2022 to 2024.</tspan>
  <tspan x="0" dy="42">That pattern reflects a mature, diversified economy anchored</tspan>
  <tspan x="0" dy="30">by advanced manufacturing, autos, electronics, machinery,</tspan>
  <tspan x="0" dy="30">services and cultural exports. Even when growth is modest,</tspan>
  <tspan x="0" dy="30">Japan remains central to global supply chains and regional</tspan>
  <tspan x="0" dy="30">finance in Asia.</tspan>
</text>

<g transform="translate(0,342)">
