<!-- destination list -->
<g transform="translate(0,88)">
  <circle cx="8" cy="8" r="6" fill="#ef475d"/>
  <text x="26" y="13" class="bodySm">Tokyo — high-rise energy, museums, neighborhoods and late-night food culture.</text>

  <circle cx="8" cy="68" r="6" fill="#ffcf5c"/>
  <text x="26" y="73" class="bodySm">Kyoto — temples, gardens, tea houses, traditional streets and seasonal beauty.</text>

  <circle cx="8" cy="128" r="6" fill="#4fd2b0"/>
  <text x="26" y="133" class="bodySm">Osaka — a playful urban counterpoint known for street food and easy access to Kansai.</text>

  <circle cx="8" cy="188" r="6" fill="#3fa7d6"/>
  <text x="26" y="193" class="bodySm">Hiroshima / Miyajima — a moving peace memorial and the iconic floating torii gate.</text>

  <circle cx="8" cy="248" r="6" fill="#8c97aa"/>
  <text x="26" y="253" class="bodySm">Mount Fuji / Hakone — volcanic scenery, lake views, ryokan stays and hot springs.</text>

  <circle cx="8" cy="308" r="6" fill="#7a74ff"/>
  <text x="26" y="313" class="bodySm">Hokkaido — powder snow, national parks, seafood and flower-filled summers.</text>
