<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Japan at a glance infographic">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="mapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#334155" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGrad)" />
  <path d="M0,160 C320,90 640,240 960,160 S1200,60 1200,160 V360 H0 Z" fill="#ffffff" opacity="0.32" />
  <path d="M0,1540 C320,1480 640,1620 960,1560 S1200,1460 1200,1560 V1800 H0 Z" fill="#e0f2fe" opacity="0.45" />

  <!-- Header -->
  <circle cx="1070" cy="88" r="42" fill="#ef4444" opacity="0.92" />
  <rect x="1044" y="62" width="52" height="52" rx="26" fill="#ffffff" opacity="0.18" />
  <text x="60" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#1e293b">Japan at a glance</text>
  <line x1="60" y1="118" x2="250" y2="118" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />

  <!-- Map card -->
  <g filter="url(#shadow)">
    <rect x="60" y="160" width="540" height="520" rx="22" fill="#ffffff" />
  </g>
  <g transform="translate(70,193)">
    <path d="M0,-6 C3,-6 6,-3 6,0 C6,5 0,11 0,11 C0,11 -6,5 -6,0 C-6,-3 -3,-6 0,-6 Z" fill="#ef4444" />
  </g>
  <text x="90" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#475569">Map &amp; major cities</text>

  <g transform="translate(90,230)">
    <!-- Stylized Japan -->
    <path d="M220,20 C260,5 310,5 340,25 C355,40 345,70 315,78 C285,85 245,78 215,60 C205,45 210,30 220,20 Z" fill="url(#mapGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M285,78 C305,85 300,110 290,130 C285,170 280,210 270,250 C260,300 240,350 200,380 C170,405 130,415 95,400 C70,385 65,355 75,325 C90,285 115,250 145,220 C180,185 220,155 255,120 C270,100 280,88 285,78 Z" fill="url(#mapGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M100,360 C120,350 145,360 150,380 C145,395 115,400 95,390 C85,375 90,365 100,360 Z" fill="url(#mapGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M50,370 C80,360 100,375 95,395 C85,410 55,412 35,400 C25,385 35,375 50,370 Z" fill="url(#mapGrad)" stroke="#60a5fa" stroke-width="1.5" />

    <!-- Cities -->
    <circle cx="275" cy="180" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <line x1="275" y1="180" x2="290" y2="184" stroke="#94a3b8" stroke-width="1.2" />
    <text x="295" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Tokyo</text>

    <circle cx="265" cy="205" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <line x1="265" y1="205" x2="280" y2="218" stroke="#94a3b8" stroke-width="1.2" />
    <text x="285" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Yokohama</text>

    <circle cx="225" cy="255" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <line x1="225" y1="255" x2="240" y2="260" stroke="#94a3b8" stroke-width="1.2" />
    <text x="245" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Nagoya</text>

    <circle cx="175" cy="305" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <line x1="175" y1="305" x2="165" y2="310" stroke="#94a3b8" stroke-width="1.2" />
    <text x="160" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#334155">Osaka</text>
  </g>

  <!-- About Japan card -->
  <g filter="url(#shadow)">
    <rect x="640" y="160" width="500" height="520" rx="22" fill="#ffffff" />
  </g>
  <text x="670" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#475569">About Japan</text>
  <text x="670" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#334155" line-height="24">
    <tspan x="670" dy="0">Japan is an island nation in East Asia, stretching across about</tspan>
    <tspan x="670" dy="26">377,975 km² of mountainous islands in the Pacific Ring of Fire.</tspan>
    <tspan x="670" dy="26">With roughly 124 million people, it is the world’s 11th most</tspan>
    <tspan x="670" dy="26">populous country. A constitutional monarchy, Japan is led by</tspan>
    <tspan x="670" dy="26">an Emperor as ceremonial head of state and a Prime Minister</tspan>
    <tspan x="670" dy="26">as head of government. Tokyo anchors one of the planet’s</tspan>
    <tspan x="670" dy="26">largest metropolitan economies and serves as the political,</tspan>
    <tspan x="670" dy="26">cultural, and technological heart of the country.</tspan>
  </text>

  <!-- Full-width paragraph card -->
  <g filter="url(#shadow)">
    <rect x="60" y="700" width="1080" height="110" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  </g>
  <text x="90" y="745" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#334155">
    <tspan x="90" dy="0">Renowned for its refined cuisine, seasonal festivals, and meticulous craftsmanship,</tspan>
    <tspan x="90" dy="27">Japan balances bullet trains and robotics with tea ceremonies, onsen baths, and temple</tspan>
    <tspan x="90" dy="27">gardens. It remains a global leader in manufacturing, digital innovation, and pop culture.</tspan>
  </text>

  <!-- GDP text card -->
  <g filter="url(#shadow)">
    <rect x="60" y="840" width="400" height="400" rx="22" fill="#ffffff" />
  </g>
  <text x="90" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#475569">Economic scale</text>
  <text x="90" y="935" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#334155">
    <tspan x="90" dy="0">Japan’s nominal GDP has fluctuated between roughly</tspan>
    <tspan x="90" dy="26">US$4 and US$5 trillion over the past decade. Movements</tspan>
    <tspan x="90" dy="26">reflect exchange-rate swings, an aging society, the 2020</tspan>
    <tspan x="90" dy="26">pandemic shock, and rising global competition.</tspan>
  </text>

  <!-- GDP bar chart card -->
  <g filter="url(#shadow)">
    <rect x="500" y="840" width="640" height="400" rx="22" fill="#ffffff" />
  </g>
  <g transform="translate(525,873)">
    <rect x="0" y="0" width="5" height="12" fill="#60a5fa" />
    <rect x="9" y="-4" width="5" height="16" fill="#3b82f6" />
    <rect x="18" y="2" width="5" height="10" fill="#2563eb" />
  </g>
  <text x="560" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#475569">Nominal GDP (current US$ trillions)</text>
  <text x="560" y="1240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748b">Source: World Bank, 2015–2024</text>

  <g transform="translate(560,940)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- axes -->
    <line x1="0" y1="300" x2="540" y2="300" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="0" y1="0" x2="0" y2="300" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="0" y1="200" x2="540" y2="200" stroke="#e2e8f0" stroke-width="1" />
    <line x1="0" y1="100" x2="540" y2="100" stroke="#e2e8f0" stroke-width="1" />

    <text x="-10" y="305" font-size="12" fill="#64748b" text-anchor="end">0</text>
    <text x="-10" y="205" font-size="12" fill="#64748b" text-anchor="end">2</text>
    <text x="-10" y="105" font-size="12" fill="#64748b" text-anchor="end">4</text>
    <text x="-10" y="5" font-size="12" fill="#64748b" text-anchor="end">6</text>

    <!-- Bars -->
    <rect x="7" y="57.8" width="40" height="242.2" rx="4" fill="url(#barGrad)" />
    <rect x="61" y="50" width="40" height="250" rx="4" fill="url(#barGrad)" />
    <rect x="115" y="53.5" width="40" height="246.5" rx="4" fill="url(#barGrad)" />
    <rect x="169" y="48" width="40" height="252" rx="4" fill="url(#barGrad)" />
    <rect x="223" y="44" width="40" height="256" rx="4" fill="url(#barGrad)" />
    <rect x="277" y="47.5" width="40" height="252.5" rx="4" fill="url(#barGrad)" />
    <rect x="331" y="48" width="40" height="252" rx="4" fill="url(#barGrad)" />
    <rect x="385" y="87" width="40" height="213" rx="4" fill="url(#barGrad)" />
    <rect x="439" y="89.5" width="40" height="210.5" rx="4" fill="url(#barGrad)" />
    <rect x="493" y="98.5" width="40" height="201.5" rx="4" fill="url(#barGrad)" />

    <!-- Value labels -->
    <text x="27" y="51" font-size="10" fill="#334155" text-anchor="middle">4.44</text>
    <text x="81" y="43" font-size="10" fill="#334155" text-anchor="middle">5.00</text>
    <text x="135" y="46.5" font-size="10" fill="#334155" text-anchor="middle">4.93</text>
    <text x="189" y="41" font-size="10" fill="#334155" text-anchor="middle">5.04</text>
    <text x="243" y="37" font-size="10" fill="#334155" text-anchor="middle">5.12</text>
    <text x="297" y="40.5" font-size="10" fill="#334155" text-anchor="middle">5.05</text>
    <text x="351" y="41" font-size="10" fill="#334155" text-anchor="middle">5.04</text>
    <text x="405" y="80" font-size="10" fill="#334155" text-anchor="middle">4.26</text>
    <text x="459" y="82.5" font-size="10" fill="#334155" text-anchor="middle">4.21</text>
    <text x="513" y="91.5" font-size="10" fill="#334155" text-anchor="middle">4.03</text>

    <!-- Year labels -->
    <text x="27" y="320" font-size="11" fill="#64748b" text-anchor="middle">2015</text>
    <text x="81" y="320" font-size="11" fill="#64748b" text-anchor="middle">2016</text>
    <text x="135" y="320" font-size="11" fill="#64748b" text-anchor="middle">2017</text>
    <text x="189" y="320" font-size="11" fill="#64748b" text-anchor="middle">2018</text>
    <text x="243" y="320" font-size="11" fill="#64748b" text-anchor="middle">2019</text>
    <text x="297" y="320" font-size="11" fill="#64748b" text-anchor="middle">2020</text>
    <text x="351" y="320" font-size="11" fill="#64748b" text-anchor="middle">2021</text>
    <text x="405" y="320" font-size="11" fill="#64748b" text-anchor="middle">2022</text>
    <text x="459" y="320" font-size="11" fill="#64748b" text-anchor="middle">2023</text>
    <text x="513" y="320" font-size="11" fill="#64748b" text-anchor="middle">2024</text>
  </g>

  <!-- Population donut card -->
  <g filter="url(#shadow)">
    <rect x="60" y="1280" width="540" height="380" rx="22" fill="#ffffff" />
  </g>
  <g transform="translate(70,1310)">
    <circle cx="8" cy="8" r="8" fill="#60a5fa" />
    <circle cx="8" cy="8" r="4" fill="#ffffff" />
  </g>
  <text x="90" y="1325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#475569">Population composition</text>

  <g transform="translate(300,1460)">
    <!-- Donut segments -->
    <path d="M 0,-77.5 A 77.5 77.5 0 1 1 -12.12,-76.55" stroke="#60a5fa" stroke-width="45" fill="none" />
    <path d="M -12.12,-76.55 A 77.5 77.5 0 0 1 -9.29,-76.94" stroke="#f472b6" stroke-width="45" fill="none" />
    <path d="M -9.29,-76.94 A 77.5 77.5 0 0 1 -7.42,-77.14" stroke="#a78bfa" stroke-width="45" fill="none" />
    <path d="M -7.42,-77.14 A 77.5 77.5 0 0 1 -5.81,-77.28" stroke="#34d399" stroke-width="45" fill="none" />
    <path d="M -5.81,-77.28 A 77.5 77.5 0 0 1 0,-77.5" stroke="#94a3b8" stroke-width="45" fill="none" />

    <circle cx="0" cy="0" r="55" fill="#ffffff" />
    <text x="0" y="-6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Population</text>
    <text x="0" y="12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">by group</text>
  </g>

  <!-- Legend -->
  <g transform="translate(430,1380)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#60a5fa" />
    <text x="24" y="12" font-size="14" fill="#334155">Japanese 97.5%</text>

    <rect x="0" y="34" width="14" height="14" rx="3" fill="#f472b6" />
    <text x="24" y="46" font-size="14" fill="#334155">Chinese 0.6%</text>

    <rect x="0" y="68" width="14" height="14" rx="3" fill="#a78bfa" />
    <text x="24" y="80" font-size="14" fill="#334155">Vietnamese 0.4%</text>

    <rect x="0" y="102" width="14" height="14" rx="3" fill="#34d399" />
    <text x="24" y="114" font-size="14" fill="#334155">South Korean 0.3%</text>

    <rect x="0" y="136" width="14" height="14" rx="3" fill="#94a3b8" />
    <text x="24" y="148" font-size="14" fill="#334155">Other 1.2%</text>
  </g>

  <text x="90" y="1615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b">Foreign-nationality shares are approximate.</text>

  <!-- What to visit card -->
  <g filter="url(#shadow)">
    <rect x="640" y="1280" width="500" height="380" rx="22" fill="#ffffff" />
  </g>
  <g transform="translate(650,1306)">
    <path d="M0,14 H26 M4,14 V24 M22,14 V24 M-2,10 H30 M2,6 C8,2 20,2 26,6" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  <text x="670" y="1325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#475569">What to visit</text>
  <text x="670" y="1365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#334155">
    <tspan x="670" dy="0">• Tokyo - neon-lit Shibuya, historic Asakusa, world-class museums</tspan>
    <tspan x="670" dy="26">• Kyoto - classical temples, geisha districts, and bamboo groves</tspan>
    <tspan x="670" dy="26">• Osaka - street food, Osaka Castle, and lively entertainment</tspan>
    <tspan x="670" dy="26">• Hiroshima &amp; Miyajima - peace memorial and floating torii gate</tspan>
    <tspan x="670" dy="26">• Mount Fuji &amp; Hakone - iconic volcano, onsen, and lake views</tspan>
    <tspan x="670" dy="26">• Hokkaido - national parks, ski resorts, and fresh seafood</tspan>
  </text>

  <!-- Source note -->
  <text x="60" y="1700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94a3b8">
    Sources: World Bank Open Data (GDP); Statistics Bureau of Japan / CIA World Factbook (population); Japan National Tourism Organization (travel highlights).
  </text>
</svg>
