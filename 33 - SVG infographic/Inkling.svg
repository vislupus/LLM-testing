    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="100%" height="100%" aria-label="Japan infographic" role="img" style="font-family:'Inter',system-ui,sans-serif;">
      <defs>
        <!-- Subtle cream texture -->
        <pattern id="grain" width="200" height="200" patternUnits="userSpaceOnUse">
          <rect width="200" height="200" fill="#F6F4F0"/>
          <circle cx="40" cy="60" r="0.8" fill="#E8E6E1"/>
          <circle cx="160" cy="140" r="0.6" fill="#E2E0DB"/>
          <circle cx="100" cy="20" r="0.9" fill="#EAE8E3"/>
          <circle cx="170" cy="80" r="0.5" fill="#E2E0DB"/>
        </pattern>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#16162A" flood-opacity="0.06"/>
        </filter>
      </defs>

      <!-- Background -->
      <rect x="0" y="0" width="1200" height="1800" fill="url(#grain)"/>

      <!-- ============ HEADER ============ -->
      <g>
        <text x="600" y="160" text-anchor="middle" font-size="72" font-weight="300" fill="#16162A" letter-spacing="12" font-family="'Cormorant Garamond',serif">JAPAN</text>
        <text x="600" y="205" text-anchor="middle" font-size="28" font-weight="300" fill="#D94E3A" letter-spacing="22" font-family="'Cormorant Garamond',serif">at a glance</text>
        <line x1="480" y1="235" x2="720" y2="235" stroke="#C8A96E" stroke-width="1.5"/>
        <text x="600" y="270" text-anchor="middle" font-size="14" fill="#9A958C" letter-spacing="4" font-family="'Inter',sans-serif">A STATISTICAL and CULTURAL SKETCH</text>
      </g>

      <!-- ============ MAP SECTION ============ -->
      <g>
        <!-- Section label -->
        <text x="60" y="360" font-size="14" fill="#243055" letter-spacing="6" font-weight="600">GEOGRAPHY</text>
        <line x1="60" y1="372" x2="300" y2="372" stroke="#D94E3A" stroke-width="2"/>

        <!-- Stylized Japan archipelago -->
        <g transform="translate(520,460)">
          <!-- Honshu -->
          <path d="M 90 60 
                   Q 140 20 180 50 
                   Q 220 30 260 80 
                   Q 280 110 250 150 
                   Q 200 180 160 140 
                   Q 100 150 70 110 
                   Q 50 90 90 60 Z" 
                fill="#F0EBE0" stroke="#243055" stroke-width="1.5"/>
          <!-- Hokkaido -->
          <path d="M 160 -30 
                   Q 200 -50 240 -30 
                   Q 260 -10 230 20 
                   Q 180 10 150 0 
                   Q 140 -20 160 -30 Z" 
                fill="#F0EBE0" stroke="#243055" stroke-width="1"/>
          <!-- Kyushu -->
          <path d="M 240 140 
                   Q 270 160 240 200 
                   Q 200 190 180 160 
                   Q 210 140 240 140 Z" 
                fill="#F0EBE0" stroke="#243055" stroke-width="1"/>
          <!-- Shikoku -->
          <path d="M 220 100 
                   Q 250 110 240 140 
                   Q 210 130 200 110 
                   Q 220 100 220 100 Z" 
                fill="#F0EBE0" stroke="#243055" stroke-width="1"/>
          
          <!-- City markers -->
          <g fill="#D94E3A">
            <!-- Tokyo -->
            <circle cx="140" cy="75" r="4"/>
            <text x="140" y="65" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">TOKYO</text>
            <!-- Yokohama -->
            <circle cx="170" cy="90" r="3"/>
            <text x="180" y="85" text-anchor="start" font-size="9" fill="#16162A">Yokohama</text>
            <!-- Osaka -->
            <circle cx="200" cy="130" r="3.5"/>
            <text x="205" y="125" text-anchor="start" font-size="9" fill="#16162A">Osaka</text>
            <!-- Nagoya -->
            <circle cx="170" cy="110" r="3"/>
            <text x="178" y="105" text-anchor="start" font-size="9" fill="#16162A">Nagoya</text>
          </g>
          
          <!-- Legend dots -->
          <g transform="translate(-30, 150)">
            <circle cx="0" cy="0" r="4" fill="#D94E3A"/>
            <text x="12" y="4" font-size="9" fill="#16162A">Metropolitan area</text>
            <line x1="-8" y1="15" x2="8" y2="15" stroke="#243055" stroke-width="0.8"/>
            <text x="12" y="19" font-size="8" fill="#9A958C">Pacific coast</text>
          </g>
        </g>

        <!-- Map caption -->
        <text x="60" y="720" font-size="12" fill="#9A958C" letter-spacing="1">Simplified archipelago with major urban centers. Scale is approximate.</text>
      </g>

      <!-- ============ KEY STATS ============ -->
      <g>
        <text x="60" y="800" font-size="14" fill="#243055" letter-spacing="6" font-weight="600">KEY FIGURES</text>
        <line x1="60" y1="812" x2="300" y2="812" stroke="#D94E3A" stroke-width="2"/>

        <!-- Three stat cards -->
        <g>
          <rect x="60" y="840" width="300" height="120" fill="#F0EBE0" rx="8" filter="url(#softShadow)"/>
          <text x="80" y="885" font-size="48" fill="#16162A" font-weight="300" font-family="'Cormorant Garamond',serif">125.7M</text>
          <text x="80" y="910" font-size="13" fill="#D94E3A" font-weight="600" letter-spacing="2">POPULATION</text>
          <text x="80" y="940" font-size="12" fill="#5A5568" line-height="1.4">Highly urbanized, aging rapidly.<br/>Tokyo metro exceeds 37 million.</text>
        </g>

        <g>
          <rect x="440" y="840" width="300" height="120" fill="#F0EBE0" rx="8" filter="url(#softShadow)"/>
          <text x="460" y="885" font-size="48" fill="#16162A" font-weight="300" font-family="'Cormorant Garamond',serif">4.2T</text>
          <text x="460" y="910" font-size="13" fill="#243055" font-weight="600" letter-spacing="2">NOMINAL GDP (USD)</text>
          <text x="460" y="940" font-size="12" fill="#5A5568" line-height="1.4">Fourth-largest economy globally.<br/>Industry, services, and exports drive growth.</text>
        </g>

        <g>
          <rect x="820" y="840" width="300" height="120" fill="#F0EBE0" rx="8" filter="url(#softShadow)"/>
          <text x="840" y="885" font-size="48" fill="#16162A" font-weight="300" font-family="'Cormorant Garamond',serif">377K</text>
          <text x="840" y="910" font-size="13" fill="#C8A96E" font-weight="600" letter-spacing="2">AREA (KM²)</text>
          <text x="840" y="940" font-size="12" fill="#5A5568" line-height="1.4">Mountainous terrain covers ~73%.<br/>Coastline extends over 29,000 km.</text>
        </g>
      </g>

      <!-- Divider -->
      <line x1="60" y1="1000" x2="1140" y2="1000" stroke="#C8A96E" stroke-width="0.5"/>

      <!-- ============ BAR CHART: GDP 2015-2024 ============ -->
      <g>
        <text x="60" y="1050" font-size="14" fill="#243055" letter-spacing="6" font-weight="600">NOMINAL GDP</text>
        <text x="160" y="1050" font-size="22" fill="#D94E3A" font-weight="600" letter-spacing="1" font-family="'Cormorant Garamond',serif">2015 — 2024</text>
        <text x="700" y="1050" font-size="10" fill="#9A958C" letter-spacing="1">TRILLIONS USD</text>

        <!-- Axes -->
        <line x1="120" y1="1360" x2="1080" y2="1360" stroke="#16162A" stroke-width="1"/>
        <line x1="120" y1="1080" x2="120" y2="1360" stroke="#16162A" stroke-width="1"/>

        <!-- Bars -->
        <g>
          <!-- 2015 -->
          <rect x="150" y="1240" width="50" height="120" fill="#2A3D5C"/>
          <text x="175" y="1215" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">4.4</text>
          <text x="175" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2015</text>

          <!-- 2016 -->
          <rect x="240" y="1170" width="50" height="190" fill="#2A3D5C"/>
          <text x="265" y="1145" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">4.9</text>
          <text x="265" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2016</text>

          <!-- 2017 -->
          <rect x="330" y="1170" width="50" height="190" fill="#2A3D5C"/>
          <text x="355" y="1145" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">4.9</text>
          <text x="355" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2017</text>

          <!-- 2018 -->
          <rect x="420" y="1155" width="50" height="205" fill="#243055"/>
          <text x="445" y="1130" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">5.0</text>
          <text x="445" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2018</text>

          <!-- 2019 -->
          <rect x="510" y="1140" width="50" height="220" fill="#243055"/>
          <text x="535" y="1115" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">5.1</text>
          <text x="535" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2019</text>

          <!-- 2020 -->
          <rect x="600" y="1155" width="50" height="205" fill="#2A3D5C"/>
          <text x="625" y="1130" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">5.0</text>
          <text x="625" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2020</text>

          <!-- 2021 -->
          <rect x="690" y="1155" width="50" height="205" fill="#2A3D5C"/>
          <text x="715" y="1130" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">5.0</text>
          <text x="715" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2021</text>

          <!-- 2022 -->
          <rect x="780" y="1215" width="50" height="145" fill="#D94E3A"/>
          <text x="805" y="1190" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">4.3</text>
          <text x="805" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2022</text>

          <!-- 2023 -->
          <rect x="870" y="1225" width="50" height="135" fill="#D94E3A"/>
          <text x="895" y="1200" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">4.2</text>
          <text x="895" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2023</text>

          <!-- 2024 -->
          <rect x="960" y="1225" width="50" height="135" fill="#D94E3A"/>
          <text x="985" y="1200" text-anchor="middle" font-size="10" fill="#16162A" font-weight="600">4.2</text>
          <text x="985" y="1380" text-anchor="middle" font-size="9" fill="#9A958C">2024</text>
        </g>

        <!-- Caption -->
        <text x="600" y="1420" text-anchor="middle" font-size="11" fill="#9A958C" letter-spacing="1">Nominal GDP reflects currency fluctuations. Source: IMF / Cabinet Office of Japan.</text>
      </g>

      <!-- Divider -->
      <line x1="60" y1="1450" x2="1140" y2="1450" stroke="#C8A96E" stroke-width="0.5"/>

      <!-- ============ DONUT CHART: POPULATION ============ -->
      <g>
        <text x="60" y="1500" font-size="14" fill="#243055" letter-spacing="6" font-weight="600">POPULATION</text>
        <text x="60" y="1525" font-size="12" fill="#9A958C">Age composition (2024 estimates)</text>

        <!-- Donut -->
        <g transform="translate(300, 1640)">
          <!-- 0-14: 12% -->
          <path d="M 0 -100 
                   A 100 100 0 1 1 -25 -97 L -20 -78 A 80 80 0 0 0 0 -80 Z" 
                fill="#2A3D5C" stroke="#16162A" stroke-width="1"/>
          
          <!-- 15-64: 59% -->
          <path d="M 0 -100 
                   A 100 100 0 0 1 85 -50 L 68 -40 A 80 80 0 0 0 0 -80 Z" 
                fill="#C8A96E" stroke="#16162A" stroke-width="1"/>
          
          <!-- 65+: 29% -->
          <path d="M 85 -50 
                   A 100 100 0 0 1 -25 -97 L -20 -78 A 80 80 0 0 0 68 -40 Z" 
                fill="#D94E3A" stroke="#16162A" stroke-width="1"/>

          <!-- Center label -->
          <text x="0" y="-5" text-anchor="middle" font-size="22" fill="#16162A" font-weight="600" font-family="'Cormorant Garamond',serif">125.7M</text>
          <text x="0" y="10" text-anchor="middle" font-size="9" fill="#9A958C">TOTAL</text>
        </g>

        <!-- Legend -->
        <g transform="translate(480, 1540)">
          <rect x="0" y="0" width="14" height="14" fill="#2A3D5C" rx="2"/>
          <text x="22" y="12" font-size="13" fill="#16162A" font-weight="500">0-14 years</text>
          <text x="130" y="12" font-size="14" fill="#16162A" font-weight="600">12%</text>

          <rect x="0" y="35" width="14" height="14" fill="#C8A96E" rx="2"/>
          <text x="22" y="47" font-size="13" fill="#16162A" font-weight="500">15-64 years</text>
          <text x="130" y="47" font-size="14" fill="#16162A" font-weight="600">59%</text>

          <rect x="0" y="70" width="14" height="14" fill="#D94E3A" rx="2"/>
          <text x="22" y="82" font-size="13" fill="#16162A" font-weight="500">65+ years</text>
          <text x="130" y="82" font-size="14" fill="#16162A" font-weight="600">29%</text>
        </g>
      </g>

      <!-- Divider -->
      <line x1="60" y1="1720" x2="1140" y2="1720" stroke="#C8A96E" stroke-width="0.5"/>

      <!-- ============ WHAT TO VISIT ============ -->
      <g>
        <text x="60" y="1760" font-size="14" fill="#243055" letter-spacing="6" font-weight="600">WHAT TO VISIT</text>
        <line x1="60" y1="1772" x2="300" y2="1772" stroke="#D94E3A" stroke-width="2"/>

        <g>
          <!-- Tokyo -->
          <rect x="60" y="1780" width="100" height="60" fill="#243055" rx="4"/>
          <text x="80" y="1805" font-size="14" fill="#F6F4F0" font-weight="600">TOKYO</text>
          <text x="80" y="1825" font-size="9" fill="#C8A96E">Capital · Modern architecture</text>

          <!-- Kyoto -->
          <rect x="180" y="1780" width="100" height="60" fill="#D94E3A" rx="4"/>
          <text x="200" y="1805" font-size="14" fill="#F6F4F0" font-weight="600">KYOTO</text>
          <text x="200" y="1825" font-size="9" fill="#F6F4F0">Temples · Gardens · Tradition</text>

          <!-- Mount Fuji -->
          <rect x="300" y="1780" width="140" height="60" fill="#C8A96E" rx="4"/>
          <text x="320" y="1805" font-size="14" fill="#16162A" font-weight="600">MT. FUJI</text>
          <text x="320" y="1825" font-size="9" fill="#16162A">Symbol · Scenic · Sacred</text>

          <!-- Osaka -->
          <rect x="460" y="1780" width="100" height="60" fill="#243055" rx="4"/>
          <text x="480" y="1805" font-size="14" fill="#F6F4F0" font-weight="600">OSAKA</text>
          <text x="480" y="1825" font-size="9" fill="#C8A96E">Food · Commerce · Nightlife</text>

          <!-- Hokkaido -->
          <rect x="580" y="1780" width="140" height="60" fill="#D94E3A" rx="4"/>
          <text x="600" y="1805" font-size="14" fill="#F6F4F0" font-weight="600">HOKKAIDO</text>
          <text x="600" y="1825" font-size="9" fill="#F6F4F0">Nature · Winter sports</text>
        </g>
      </g>

      <!-- ============ SOURCE / FOOTER ============ -->
      <g>
        <line x1="60" y1="1760" x2="1140" y2="1760" stroke="#C8A96E" stroke-width="0.5"/>
        <text x="60" y="1730" font-size="10" fill="#9A958C" letter-spacing="1">Sources: IMF World Economic Outlook (GDP), Cabinet Office of Japan (Population), Statistical Handbook of Japan. Design: Editorial infographic, 2024.</text>
      </g>

    </svg>