<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800" role="img" aria-label="Japan at a glance — editorial infographic">
  <title>Japan at a glance</title>
  <desc>A static SVG infographic about Japan: a stylized map with major cities, GDP bar chart 2015–2024, and a population-composition donut chart.</desc>

  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .ink { fill:#1f2a44; }
      .muted { fill:#6b7589; }
      .red { fill:#d6332e; }
      .kicker { fill:#9aa3b2; letter-spacing:3px; font-size:14px; font-weight:600; }
      .h1 { font-size:54px; font-weight:700; fill:#1f2a44; }
      .sub { font-size:20px; fill:#6b7589; }
      .h2 { font-size:24px; font-weight:700; fill:#1f2a44; }
      .h3 { font-size:17px; font-weight:700; fill:#1f2a44; }
      .body { font-size:15px; fill:#3a4660; }
      .small { font-size:13px; fill:#6b7589; }
      .cap { font-size:12px; fill:#8a93a3; }
      .val { font-size:10px; fill:#6b7589; }
      .city { font-size:14px; font-weight:700; fill:#1f2a44; paint-order:stroke; stroke:#eef4fb; stroke-width:3px; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="0.55" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#e6edf5"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.82" cy="0.06" r="0.5">
      <stop offset="0" stop-color="#ffe9d2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9d2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sun" cx="0.4" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#e8554e"/>
      <stop offset="1" stop-color="#c62f29"/>
    </radialGradient>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ecf3"/>
      <stop offset="1" stop-color="#bcdce8"/>
    </linearGradient>

    <linearGradient id="barI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6aa0"/>
      <stop offset="1" stop-color="#33507a"/>
    </linearGradient>
    <linearGradient id="barR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e34f49"/>
      <stop offset="1" stop-color="#c62f29"/>
    </linearGradient>

    <pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 20 A20 20 0 0 1 40 20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.30"/>
      <path d="M-20 20 A20 20 0 0 1 20 20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.30"/>
      <path d="M20 20 A20 20 0 0 1 60 20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.30"/>
    </pattern>

    <pattern id="waves" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M-10 30 Q10 14 30 30 Q50 46 70 30 Q90 14 110 30" fill="none" stroke="#cdd9e6" stroke-width="2"/>
      <path d="M-10 14 Q10 -2 30 14 Q50 30 70 14 Q90 -2 110 14" fill="none" stroke="#dde6f0" stroke-width="1.5"/>
    </pattern>

    <filter id="soft" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1f2a44" flood-opacity="0.12"/>
    </filter>
    <filter id="softsm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2a44" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect x="0" y="0" width="1200" height="1800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="1800" fill="url(#glow)"/>
  <rect x="0" y="1520" width="1200" height="280" fill="url(#waves)" opacity="0.5"/>

  <!-- ===================== HEADER ===================== -->
  <text x="80" y="66" class="kicker">EAST ASIA · INFOGRAPHIC</text>
  <rect x="80" y="78" width="44" height="3" fill="#d6332e"/>
  <text x="78" y="132" class="h1 serif">Japan at a glance</text>
  <text x="82" y="162" class="sub">An editorial infographic — geography, economy and travel.</text>

  <circle cx="1085" cy="92" r="46" fill="url(#sun)" filter="url(#softsm)"/>
  <circle cx="1085" cy="92" r="46" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#d9e0ea" stroke-width="1.5"/>

  <!-- ===================== ROW 1 : MAP + ABOUT ===================== -->
  <!-- Map card -->
  <rect x="60" y="195" width="520" height="370" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <g transform="translate(100,222)">
    <path d="M0 0 A9 9 0 1 0 0 0.1 M0 -9 L0 6" fill="none" stroke="#d6332e" stroke-width="3"/>
    <circle cx="0" cy="-3" r="4" fill="#d6332e"/>
  </g>
  <text x="138" y="228" class="h2">The Japanese archipelago</text>

  <!-- sea -->
  <rect x="84" y="252" width="472" height="292" rx="14" fill="url(#sea)"/>
  <rect x="84" y="252" width="472" height="292" rx="14" fill="url(#seigaiha)"/>
  <rect x="84" y="252" width="472" height="292" rx="14" fill="none" stroke="#9cc3d2" stroke-width="1.5"/>

  <!-- islands -->
  <g>
    <ellipse cx="205" cy="290" rx="62" ry="38" transform="rotate(-8 205 290)" fill="#a9c98a" stroke="#5e8a4a" stroke-width="2"/>
    <path d="M250 320 C295 334 330 350 360 364 C392 380 412 392 432 410 C452 432 460 452 462 472"
          fill="none" stroke="#a9c98a" stroke-width="44" stroke-linecap="round"/>
    <path d="M250 320 C295 334 330 350 360 364 C392 380 412 392 432 410 C452 432 460 452 462 472"
          fill="none" stroke="#5e8a4a" stroke-width="46" stroke-linecap="round" opacity="0.18"/>
    <ellipse cx="452" cy="495" rx="22" ry="12" transform="rotate(-12 452 495)" fill="#a9c98a" stroke="#5e8a4a" stroke-width="2"/>
    <ellipse cx="473" cy="512" rx="28" ry="38" transform="rotate(16 473 512)" fill="#a9c98a" stroke="#5e8a4a" stroke-width="2"/>
    <!-- Tsugaru strait hint -->
    <line x1="235" y1="318" x2="225" y2="316" stroke="#9cc3d2" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- cities -->
  <g>
    <circle cx="350" cy="358" r="5" fill="#d6332e" stroke="#fff" stroke-width="1.5"/>
    <circle cx="405" cy="388" r="6" fill="#d6332e" stroke="#fff" stroke-width="1.5"/>
    <circle cx="414" cy="404" r="4.5" fill="#d6332e" stroke="#fff" stroke-width="1.5"/>
    <circle cx="452" cy="460" r="5" fill="#d6332e" stroke="#fff" stroke-width="1.5"/>

    <line x1="350" y1="358" x2="300" y2="346" stroke="#9aa3b2" stroke-width="1"/>
    <text x="296" y="343" text-anchor="end" class="city">Nagoya</text>

    <line x1="405" y1="388" x2="432" y2="380" stroke="#9aa3b2" stroke-width="1"/>
    <text x="436" y="384" class="city">Tokyo</text>

    <line x1="414" y1="404" x2="440" y2="420" stroke="#9aa3b2" stroke-width="1"/>
    <text x="444" y="424" class="city">Yokohama</text>

    <line x1="452" y1="460" x2="480" y2="458" stroke="#9aa3b2" stroke-width="1"/>
    <text x="484" y="462" class="city">Osaka</text>
  </g>

  <!-- compass + note -->
  <g transform="translate(108,300)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#9aa3b2" stroke-width="1.5"/>
    <path d="M0 -10 L4 4 L0 0 L-4 4 Z" fill="#d6332e"/>
    <text x="0" y="-18" text-anchor="middle" class="small" font-weight="700">N</text>
  </g>
  <text x="320" y="552" text-anchor="middle" class="cap">Stylized — not to scale</text>

  <!-- About card -->
  <rect x="600" y="195" width="540" height="370" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <g transform="translate(636,228)">
    <circle cx="0" cy="-4" r="9" fill="none" stroke="#33507a" stroke-width="3"/>
    <path d="M-9 6 A9 9 0 0 0 9 6" fill="none" stroke="#33507a" stroke-width="3"/>
    <line x1="0" y1="-13" x2="0" y2="-4" stroke="#33507a" stroke-width="3"/>
  </g>
  <text x="666" y="228" class="h2">An island nation</text>

  <text class="body">
    <tspan x="624" y="280">Japan is an East Asian archipelago of nearly 14,000</tspan>
    <tspan x="624" y="304">islands, stretching some 3,000 km along the Pacific.</tspan>
    <tspan x="624" y="328">Its four main islands — Hokkaido, Honshu,</tspan>
    <tspan x="624" y="352">Shikoku and Kyushu — form a curved chain.</tspan>
  </text>
  <text class="body">
    <tspan x="624" y="400">A constitutional monarchy and parliamentary</tspan>
    <tspan x="624" y="424">democracy, Japan blends ancient tradition with</tspan>
    <tspan x="624" y="448">frontier technology. It is the world's 11th-most</tspan>
    <tspan x="624" y="472">populous nation and a leader in manufacturing,</tspan>
    <tspan x="624" y="496">robotics &amp; culture.</tspan>
  </text>

  <!-- ===================== FULL-WIDTH PARAGRAPH ===================== -->
  <rect x="60" y="590" width="1080" height="150" rx="16" fill="#1f2a44" filter="url(#soft)"/>
  <text x="92" y="624" class="cap" fill="#aeb8cc" letter-spacing="2">A LAND OF CONTRAST</text>
  <text fill="#eaf0f8" font-size="17">
    <tspan x="92" y="658">From the neon skyline of Tokyo to the temple trails of Kyoto, Japan balances dense modern cities with</tspan>
    <tspan x="92" y="686">pristine nature. The country lies on the Pacific Ring of Fire, blessing it with hot springs, volcanic</tspan>
    <tspan x="92" y="714">peaks such as Mount Fuji, and frequent earthquakes. Four distinct seasons shape its festivals, cuisine</tspan>
    <tspan x="92" y="742">and landscapes — making it one of the world's most culturally distinctive destinations.</tspan>
  </text>

  <!-- ===================== ROW 2 : ECONOMY + GDP CHART ===================== -->
  <!-- Economy text card -->
  <rect x="60" y="760" width="520" height="340" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <g transform="translate(96,800)">
    <rect x="-9" y="-13" width="6" height="20" fill="#33507a"/>
    <rect x="-1" y="-7" width="6" height="14" fill="#d6332e"/>
    <rect x="7" y="-13" width="6" height="20" fill="#33507a"/>
  </g>
  <text x="126" y="800" class="h2">The economy</text>

  <text class="body">
    <tspan x="84" y="845">Japan has the world's third-largest economy by</tspan>
    <tspan x="84" y="868">nominal GDP. After rapid postwar growth made it</tspan>
    <tspan x="84" y="891">an industrial powerhouse, it entered a long period</tspan>
    <tspan x="84" y="914">of slower expansion and mild deflation from the</tspan>
    <tspan x="84" y="937">1990s onward.</tspan>
  </text>
  <text class="body">
    <tspan x="84" y="975">In recent years the exchange rate has dominated</tspan>
    <tspan x="84" y="998">the headline figure: a stronger yen lifted nominal</tspan>
    <tspan x="84" y="1021">GDP above US$5 trillion in the late 2010s, while a</tspan>
    <tspan x="84" y="1044">weaker yen pulled it back toward US$4 trillion by</tspan>
    <tspan x="84" y="1067">2024. Services, manufacturing &amp; exports remain</tspan>
    <tspan x="84" y="1090">the core drivers.</tspan>
  </text>

  <!-- GDP bar chart card -->
  <rect x="600" y="760" width="540" height="340" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <g transform="translate(636,800)">
    <path d="M-10 6 L10 6 M-10 0 L10 0 M-10 -6 L10 -6" stroke="#33507a" stroke-width="3"/>
    <path d="M0 8 L0 -8" stroke="#d6332e" stroke-width="3"/>
  </g>
  <text x="666" y="800" class="h2">Nominal GDP</text>
  <text x="666" y="822" class="small">Current US$ trillions · 2015–2024</text>

  <!-- gridlines + axes -->
  <g stroke="#e3e8f0" stroke-width="1">
    <line x1="664" y1="1075" x2="1108" y2="1075"/>
    <line x1="664" y1="1033.2" x2="1108" y2="1033.2"/>
    <line x1="664" y1="991.4" x2="1108" y2="991.4"/>
    <line x1="664" y1="949.5" x2="1108" y2="949.5"/>
    <line x1="664" y1="907.7" x2="1108" y2="907.7"/>
    <line x1="664" y1="865.9" x2="1108" y2="865.9"/>
  </g>
  <g class="val" text-anchor="end">
    <text x="654" y="1079">0</text>
    <text x="654" y="1037">1</text>
    <text x="654" y="995">2</text>
    <text x="654" y="953">3</text>
    <text x="654" y="911">4</text>
    <text x="654" y="869">5</text>
  </g>

  <!-- bars -->
  <g>
    <rect x="671.5" y="889.3"  width="30" height="185.7" fill="url(#barR)"/>
    <rect x="716.5" y="865.9"  width="30" height="209.1" fill="url(#barI)"/>
    <rect x="761.5" y="868.8"  width="30" height="206.2" fill="url(#barR)"/>
    <rect x="806.5" y="864.2"  width="30" height="210.8" fill="url(#barI)"/>
    <rect x="851.5" y="861.0"  width="30" height="214.0" fill="url(#barI)"/>
    <rect x="896.5" y="863.8"  width="30" height="211.2" fill="url(#barI)"/>
    <rect x="941.5" y="864.2"  width="30" height="210.8" fill="url(#barI)"/>
    <rect x="986.5" y="896.8"  width="30" height="178.2" fill="url(#barR)"/>
    <rect x="1031.5" y="898.9" width="30" height="176.1" fill="url(#barR)"/>
    <rect x="1076.5" y="906.5" width="30" height="168.5" fill="url(#barR)"/>
  </g>

  <!-- value labels -->
  <g class="val" text-anchor="middle">
    <text x="686.5"  y="884">4.4</text>
    <text x="731.5"  y="860">5.0</text>
    <text x="776.5"  y="863">4.9</text>
    <text x="821.5"  y="859">5.0</text>
    <text x="866.5"  y="856">5.1</text>
    <text x="911.5"  y="858">5.0</text>
    <text x="956.5"  y="859">5.0</text>
    <text x="1001.5" y="891">4.3</text>
    <text x="1046.5" y="893">4.2</text>
    <text x="1091.5" y="901">4.0</text>
  </g>

  <!-- year labels -->
  <g class="val" text-anchor="middle">
    <text x="686.5"  y="1092">'15</text>
    <text x="731.5"  y="1092">'16</text>
    <text x="776.5"  y="1092">'17</text>
    <text x="821.5"  y="1092">'18</text>
    <text x="866.5"  y="1092">'19</text>
    <text x="911.5"  y="1092">'20</text>
    <text x="956.5"  y="1092">'21</text>
    <text x="1001.5" y="1092">'22</text>
    <text x="1046.5" y="1092">'23</text>
    <text x="1091.5" y="1092">'24</text>
  </g>
  <text x="664" y="1110" class="cap">Bars above US$5T in indigo, below in red.</text>

  <!-- ===================== ROW 3 : POPULATION DONUT + VISIT ===================== -->
  <!-- Donut card -->
  <rect x="60" y="1120" width="520" height="380" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <g transform="translate(96,1158)">
    <circle cx="0" cy="-4" r="9" fill="none" stroke="#33507a" stroke-width="3"/>
    <circle cx="-7" cy="6" r="4" fill="#33507a"/>
    <circle cx="7" cy="6" r="4" fill="#33507a"/>
    <path d="M-9 10 L-4 4 M9 10 L4 4" stroke="#33507a" stroke-width="2"/>
  </g>
  <text x="126" y="1158" class="h2">Population by nationality</text>
  <text x="126" y="1180" class="small">Share of total population (%)</text>

  <!-- donut -->
  <g>
    <path d="M320 1192 A108 108 0 1 1 303.11 1193.33 L309.99 1236.79 A64 64 0 1 0 320 1236 Z" fill="#d6332e"/>
    <path d="M303.11 1193.33 A108 108 0 0 1 307.13 1192.77 L312.37 1236.46 A64 64 0 0 0 309.99 1236.79 Z" fill="#33507a"/>
    <path d="M307.13 1192.77 A108 108 0 0 1 309.84 1192.48 L313.98 1236.28 A64 64 0 0 0 312.37 1236.46 Z" fill="#2e8b8b"/>
    <path d="M309.84 1192.48 A108 108 0 0 1 311.88 1192.30 L315.18 1236.18 A64 64 0 0 0 313.98 1236.28 Z" fill="#d99a2b"/>
    <path d="M311.88 1192.30 A108 108 0 0 1 320 1192 L320 1236 A64 64 0 0 0 315.18 1236.18 Z" fill="#7c8794"/>
  </g>
  <text x="320" y="1298" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2a44">97.5%</text>
  <text x="320" y="1322" text-anchor="middle" class="small">Japanese</text>
  <text x="320" y="1420" text-anchor="middle" class="cap">Minority groups shown at the top of the ring.</text>

  <!-- legend -->
  <g font-size="14" fill="#3a4660">
    <rect x="100" y="1442" width="14" height="14" rx="3" fill="#d6332e"/><text x="122" y="1453">Japanese 97.5%</text>
    <rect x="100" y="1468" width="14" height="14" rx="3" fill="#33507a"/><text x="122" y="1479">Chinese 0.6%</text>
    <rect x="100" y="1494" width="14" height="14" rx="3" fill="#2e8b8b"/><text x="122" y="1505">Vietnamese 0.4%</text>

    <rect x="330" y="1442" width="14" height="14" rx="3" fill="#d99a2b"/><text x="352" y="1453">South Korean 0.3%</text>
    <rect x="330" y="1468" width="14" height="14" rx="3" fill="#7c8794"/><text x="352" y="1479">Other 1.2%</text>
  </g>

  <!-- Visit card -->
  <rect x="600" y="1120" width="540" height="380" rx="16" fill="#ffffff" filter="url(#soft)"/>
  <g transform="translate(636,1158)">
    <path d="M-12 8 L-3 -6 L4 4 L9 -2 L14 8 Z" fill="none" stroke="#33507a" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="2" cy="-8" r="3" fill="#d6332e"/>
  </g>
  <text x="666" y="1158" class="h2">What to visit</text>

  <g>
    <!-- item 1 -->
    <circle cx="640" cy="1208" r="14" fill="#33507a"/><text x="640" y="1213" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="666" y="1205" class="h3">Tokyo</text>
    <text x="666" y="1226" class="small">Capital megacity of neon, food &amp; pop culture</text>
    <!-- item 2 -->
    <circle cx="640" cy="1255" r="14" fill="#33507a"/><text x="640" y="1260" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="666" y="1252" class="h3">Kyoto</text>
    <text x="666" y="1273" class="small">Imperial capital with 1,600+ temples &amp; gardens</text>
    <!-- item 3 -->
    <circle cx="640" cy="1302" r="14" fill="#33507a"/><text x="640" y="1307" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="666" y="1299" class="h3">Osaka</text>
    <text x="666" y="1320" class="small">Street food, castles &amp; famously friendly locals</text>
    <!-- item 4 -->
    <circle cx="640" cy="1349" r="14" fill="#33507a"/><text x="640" y="1354" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="666" y="1346" class="h3">Hiroshima &amp; Miyajima</text>
    <text x="666" y="1367" class="small">Peace memorials &amp; a floating torii gate</text>
    <!-- item 5 -->
    <circle cx="640" cy="1396" r="14" fill="#33507a"/><text x="640" y="1401" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="666" y="1393" class="h3">Mount Fuji &amp; Hakone</text>
    <text x="666" y="1414" class="small">Japan's icon &amp; hot-spring towns</text>
    <!-- item 6 -->
    <circle cx="640" cy="1443" r="14" fill="#33507a"/><text x="640" y="1448" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
    <text x="666" y="1440" class="h3">Hokkaido</text>
    <text x="666" y="1461" class="small">Wilderness, ski resorts &amp; summer lavender</text>
  </g>

  <!-- ===================== FOOTER / SOURCES ===================== -->
  <line x1="80" y1="1545" x2="1120" y2="1545" stroke="#d9e0ea" stroke-width="1.5"/>
  <circle cx="92" cy="1585" r="20" fill="url(#sun)"/>
  <text x="124" y="1582" class="h3">Japan</text>
  <text x="124" y="1602" class="cap">Static SVG infographic — no external assets or scripts</text>

  <text class="small" fill="#6b7589">
    <tspan x="600" y="1572">Sources: World Bank — nominal GDP (current US$), 2015–2024;</tspan>
    <tspan x="600" y="1594">Japan e-Stat / census — population by nationality (latest available).</tspan>
    <tspan x="600" y="1616">Values are illustrative and rounded for display.</tspan>
  </text>
</svg>