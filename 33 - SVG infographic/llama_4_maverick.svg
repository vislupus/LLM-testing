<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800">
  <!-- Background with subtle waves -->
  <rect x="0" y="0" width="1200" height="1800" fill="#f7f7f7"/>
  <path d="M0,200 Q300,250 600,200 T1200,200 V1800 H0 Z" fill="#e7e7e7" opacity="0.5"/>
  <path d="M0,400 Q300,450 600,400 T1200,400 V1800 H0 Z" fill="#e7e7e7" opacity="0.3"/>

  <!-- Title -->
  <text x="600" y="50" font-size="36" text-anchor="middle" font-family="Arial">Japan at a glance</text>

  <!-- First Row: Map and Intro Text -->
  <g transform="translate(50, 100)">
    <!-- Stylized Map of Japan -->
    <g>
      <path d="M100,50 L150,100 L100,150 L50,100 Z" fill="#ccccff" transform="scale(2)"/>
      <text x="120" y="80" font-size="14">Tokyo</text>
      <text x="140" y="120" font-size="14">Yokohama</text>
      <text x="80" y="180" font-size="14">Nagoya</text>
      <text x="60" y="220" font-size="14">Osaka</text>
    </g>
  </g>
  <g transform="translate(400, 100)">
    <!-- Intro Text -->
    <text x="0" y="0" font-size="18" width="400">Japan is an island country in East Asia...</text>
    <text x="0" y="30" font-size="18" width="400">Known for its vibrant culture, rich history, and cutting-edge technology.</text>
  </g>

  <!-- Full-width Paragraph -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" font-size="18" width="1100">Japan, with its unique blend of traditional and modern culture, attracts millions of visitors each year. From bustling cities to serene landscapes, Japan offers a diverse range of experiences.</text>
  </g>

  <!-- Second Row: Text and Bar Chart -->
  <g transform="translate(50, 400)">
    <!-- Text -->
    <text x="0" y="0" font-size="18" width="500">Japan's economy is one of the world's largest...</text>
    <text x="0" y="30" font-size="18" width="500">Nominal GDP has seen fluctuations over the years.</text>
  </g>
  <g transform="translate(600, 350)">
    <!-- Bar Chart for Nominal GDP -->
    <g>
      <rect x="0" y="150" width="20" height="100" fill="#ccccff"/><text x="10" y="260" font-size="12" text-anchor="middle">2015</text><text x="10" y="140" font-size="12" text-anchor="middle">4.44</text>
      <rect x="30" y="120" width="20" height="130" fill="#ccccff"/><text x="40" y="260" font-size="12" text-anchor="middle">2016</text><text x="40" y="110" font-size="12" text-anchor="middle">5.00</text>
      <rect x="60" y="125" width="20" height="125" fill="#ccccff"/><text x="70" y="260" font-size="12" text-anchor="middle">2017</text><text x="70" y="115" font-size="12" text-anchor="middle">4.93</text>
      <rect x="90" y="120" width="20" height="130" fill="#ccccff"/><text x="100" y="260" font-size="12" text-anchor="middle">2018</text><text x="100" y="110" font-size="12" text-anchor="middle">5.04</text>
      <rect x="120" y="115" width="20" height="135" fill="#ccccff"/><text x="130" y="260" font-size="12" text-anchor="middle">2019</text><text x="130" y="105" font-size="12" text-anchor="middle">5.12</text>
      <rect x="150" y="120" width="20" height="130" fill="#ccccff"/><text x="160" y="260" font-size="12" text-anchor="middle">2020</text><text x="160" y="110" font-size="12" text-anchor="middle">5.05</text>
      <rect x="180" y="120" width="20" height="130" fill="#ccccff"/><text x="190" y="260" font-size="12" text-anchor="middle">2021</text><text x="190" y="110" font-size="12" text-anchor="middle">5.04</text>
      <rect x="210" y="170" width="20" height="80" fill="#ccccff"/><text x="220" y="260" font-size="12" text-anchor="middle">2022</text><text x="220" y="160" font-size="12" text-anchor="middle">4.26</text>
      <rect x="240" y="170" width="20" height="80" fill="#ccccff"/><text x="250" y="260" font-size="12" text-anchor="middle">2023</text><text x="250" y="160" font-size="12" text-anchor="middle">4.21</text>
      <rect x="270" y="180" width="20" height="70" fill="#ccccff"/><text x="280" y="260" font-size="12" text-anchor="middle">2024</text><text x="280" y="170" font-size="12" text-anchor="middle">4.03</text>
    </g>
    <text x="0" y="280" font-size="14">Nominal GDP (Trillions USD)</text>
  </g>

  <!-- Third Row: Pie Chart and Places to Visit -->
  <g transform="translate(50, 700)">
    <!-- Pie/Donut Chart for Population Composition -->
    <g>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#ccccff" stroke-width="20"/>
      <path d="M100,20 L180,100 A80,80 0 0,1 100,180 Z" fill="#ffcccc"/><text x="150" y="50" font-size="12">Japanese 97.5%</text>
      <path d="M100,180 L120,100 A80,80 0 0,1 180,100 Z" fill="#ccffcc"/><text x="120" y="220" font-size="12">Chinese 0.6%</text>
      <path d="M180,100 L100,20 A80,80 0 0,1 140,60 Z" fill="#ccccff"/><text x="220" y="100" font-size="12">Other 1.9%</text>
    </g>
    <text x="0" y="250" font-size="14">Population Composition</text>
  </g>
  <g transform="translate(400, 700)">
    <!-- Places to Visit -->
    <text x="0" y="0" font-size="18">Places to visit in Japan:</text>
    <text x="0" y="30" font-size="16">- Tokyo</text>
    <text x="0" y="60" font-size="16">- Kyoto</text>
    <text x="0" y="90" font-size="16">- Osaka</text>
    <text x="0" y="120" font-size="16">- Hiroshima/Miyajima</text>
    <text x="0" y="150" font-size="16">- Mount Fuji/Hakone</text>
    <text x="0" y="180" font-size="16">- Hokkaido</text>
  </g>

  <!-- Source Note -->
  <g transform="translate(50, 1700)">
    <text x="0" y="0" font-size="10">Source: Various public datasets and statistics.</text>
  </g>
</svg>
