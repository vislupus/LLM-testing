<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3ee"/>
      <stop offset="0.55" stop-color="#f3f1f6"/>
      <stop offset="1" stop-color="#eaeff7"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f47d6c"/>
      <stop offset="1" stop-color="#d23f3f"/>
    </radialGradient>
    <linearGradient id="landGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a8d1"/>
      <stop offset="1" stop-color="#566da4"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ed7d65"/>
      <stop offset="1" stop-color="#cc3f3f"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcfe"/>
    </linearGradient>
    <pattern id="wavePat" width="80" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q 20 2 40 12 T 80 12" fill="none" stroke="#5b6fa6" stroke-width="2" stroke-opacity="0.14"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1f2a44" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: 'Helvetica Neue', Arial, sans-serif; }
      .h1 { font-size:56px; font-weight:800; fill:#1f2a44; letter-spacing:0.5px; }
      .sub { font-size:21px; fill:#5a6478; }
      .eyebrow { font-size:13px; letter-spacing:2.6px; font-weight:700; fill:#b04a3a; }
      .ctitle { font-size:23px; font-weight:700; fill:#1f2a44; }
      .body { font-size:16px; fill:#3c4660; }
      .bodyb { font-size:16px; font-weight:700; fill:#1f2a44; }
      .small { font-size:12.5px; fill:#7a8398; }
      .legend { font-size:15px; fill:#3c4660; }
      .legendb { font-size:15px; font-weight:700; fill:#1f2a44; }
      .axis { font-size:12px; fill:#7a8398; }
      .val { font-size:11px; font-weight:600; fill:#1f2a44; }
      .yr { font-size:11px; fill:#5a6478; }
      .card { fill:url(#cardGrad); stroke:#e7eaf1; stroke-width:1; filter:url(#softShadow); }
      .cap { fill:#1f2a44; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="1800" fill="url(#bgGrad)"/>

  <!-- ============ HEADER ============ -->
  <!-- Torii icon -->
  <g fill="#d94f4f">
    <rect x="64" y="54" width="56" height="9" rx="3"/>
    <rect x="70" y="70" width="44" height="6" rx="2"/>
    <rect x="78" y="58" width="8" height="42"/>
    <rect x="98" y="58" width="8" height="42"/>
  </g>
  <!-- Rising sun disc -->
  <circle cx="1138" cy="82" r="25" fill="url(#sunGrad)" opacity="0.92"/>
  <circle cx="1138" cy="82" r="36" fill="none" stroke="#d23f3f" stroke-width="1.5" opacity="0.25"/>

  <text x="600" y="96" text-anchor="middle" class="h1">Japan at a glance</text>
  <rect x="535" y="110" width="130" height="5" rx="2.5" fill="#d94f4f"/>
  <text x="600" y="146" text-anchor="middle" class="sub">Geography, economy &amp; culture of an East Asian island nation</text>
  <rect x="440" y="160" width="320" height="16" fill="url(#wavePat)"/>

  <!-- ============ ROW 1 : MAP + ABOUT ============ -->
  <!-- Map card -->
  <rect x="60" y="180" width="520" height="360" rx="18" class="card"/>
  <text x="90" y="222" class="eyebrow">GEOGRAPHY</text>
  <text x="90" y="250" class="ctitle">The four largest cities</text>

  <!-- ocean waves behind islands -->
  <g opacity="0.30" stroke="#8fb4d6" stroke-width="2" fill="none">
    <path d="M110 486 Q 140 478 170 486 T 230 486 T 290 486 T 350 486 T 410 486 T 470 486"/>
    <path d="M120 500 Q 150 492 180 500 T 240 500 T 300 500 T 360 500 T 420 500 T 480 500"/>
  </g>

  <!-- Hokkaido -->
  <path d="M442 220 C 462 210 488 214 492 234 C 496 252 484 266 466 268 C 448 270 432 260 430 242 C 429 230 432 225 442 220 Z" fill="url(#landGrad)"/>
  <!-- Honshu (main island) -->
  <path d="M408 270 C 442 288 436 332 404 368 C 378 396 346 416 312 434 C 280 450 246 462 214 476 C 198 483 178 476 182 456 C 186 436 206 428 228 420 C 262 408 296 392 326 366 C 356 340 372 312 380 288 C 385 272 396 262 408 270 Z" fill="url(#landGrad)"/>
  <!-- Shikoku -->
  <path d="M232 460 C 248 462 252 472 242 478 C 230 484 214 480 212 470 C 211 462 220 458 232 460 Z" fill="url(#landGrad)"/>
  <!-- Kyushu -->
  <path d="M188 455 C 205 458 210 475 200 488 C 192 498 176 496 168 484 C 160 472 168 458 188 455 Z" fill="url(#landGrad)"/>

  <text x="468" y="500" text-anchor="end" class="small" letter-spacing="2" opacity="0.55" fill="#5b6fa6">PACIFIC OCEAN</text>

  <!-- City labels: white halo (stroke copy) under navy fill copy -->
  <g font-size="15" font-weight="700">
    <g fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linejoin="round">
      <text x="400" y="344">Tokyo</text>
      <text x="386" y="380">Yokohama</text>
      <text x="334" y="406">Nagoya</text>
      <text x="248" y="434" text-anchor="end">Osaka</text>
    </g>
    <g fill="#1f2a44">
      <text x="400" y="344">Tokyo</text>
      <text x="386" y="380">Yokohama</text>
      <text x="334" y="406">Nagoya</text>
      <text x="248" y="434" text-anchor="end">Osaka</text>
    </g>
  </g>
  <!-- dots drawn over labels' halos -->
  <g>
    <circle cx="382" cy="348" r="7.5" fill="#d94f4f" stroke="#ffffff" stroke-width="2"/>
    <circle cx="382" cy="348" r="2.6" fill="#ffffff"/>
    <circle cx="372" cy="366" r="5.5" fill="#d94f4f" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="318" cy="402" r="5.5" fill="#d94f4f" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="262" cy="430" r="5.5" fill="#d94f4f" stroke="#ffffff" stroke-width="1.8"/>
  </g>
  <text x="90" y="526" class="small">★ Tokyo is the capital · stylized map, not to scale</text>

  <!-- About card -->
  <rect x="600" y="180" width="540" height="360" rx="18" class="card"/>
  <text x="632" y="222" class="eyebrow">OVERVIEW</text>
  <text x="632" y="250" class="ctitle">About Japan</text>
  <text x="632" y="288" class="body">
    <tspan x="632" dy="0">Japan is an island nation in East Asia, set in the</tspan>
    <tspan x="632" dy="23">northwest Pacific Ocean. Its archipelago of nearly</tspan>
    <tspan x="632" dy="23">14,000 islands is dominated by four main islands —</tspan>
    <tspan x="632" dy="23">Honshu, Hokkaido, Kyushu and Shikoku.</tspan>
    <tspan x="632" dy="30">Home to about 124 million people, it ranks among</tspan>
    <tspan x="632" dy="23">the world's most urbanised nations, anchored by</tspan>
    <tspan x="632" dy="23">the vast Greater Tokyo metropolitan area — the</tspan>
    <tspan x="632" dy="23">largest urban region on Earth.</tspan>
  </text>

  <!-- ============ FULL-WIDTH PARAGRAPH ============ -->
  <rect x="60" y="560" width="1080" height="130" rx="18" class="card"/>
  <text x="90" y="596" class="eyebrow">CULTURE &amp; LANDSCAPE</text>
  <text x="90" y="624" class="body">
    <tspan x="90" dy="0">Japan blends deep-rooted tradition with cutting-edge technology: ancient temples, tea ceremonies and time-honoured craft</tspan>
    <tspan x="90" dy="23">coexist with bullet trains, robotics and a globally influential pop culture. Its mountainous, volcanic terrain shapes daily life</tspan>
    <tspan x="90" dy="23">across the islands — from the snow country of the north to the warm, subtropical beaches of the far south.</tspan>
  </text>

  <!-- ============ ROW 2 : ECONOMY TEXT + BAR CHART ============ -->
  <!-- Economy text card -->
  <rect x="60" y="710" width="440" height="380" rx="18" class="card"/>
  <text x="90" y="750" class="eyebrow">ECONOMY</text>
  <text x="90" y="778" class="ctitle">A top-tier economy</text>
  <text x="90" y="812" class="body">
    <tspan x="90" dy="0">Japan has long ranked among the</tspan>
    <tspan x="90" dy="23">world's largest economies. In current</tspan>
    <tspan x="90" dy="23">US dollars, nominal GDP peaked near</tspan>
    <tspan x="90" dy="23">$5.1 trillion in 2019, then eased</tspan>
    <tspan x="90" dy="23">back through the early 2020s.</tspan>
    <tspan x="90" dy="30">Much of that dollar-term dip reflects</tspan>
    <tspan x="90" dy="23">a weaker yen; in local-currency terms</tspan>
    <tspan x="90" dy="23">the trend is far steadier.</tspan>
  </text>
  <text x="90" y="1040" font-size="30" font-weight="800" fill="#cc3f3f">$5.12T</text>
  <text x="90" y="1062" class="small">Peak nominal GDP · 2019</text>

  <!-- Bar chart card -->
  <rect x="520" y="710" width="620" height="380" rx="18" class="card"/>
  <text x="548" y="746" class="ctitle" font-size="20">Nominal GDP — current US$ (trillions)</text>
  <text x="548" y="768" class="small">Annual, 2015–2024 · World Bank / IMF</text>

  <!-- gridlines + y labels -->
  <g>
    <line x1="560" y1="1030" x2="1110" y2="1030" stroke="#cfd6e2" stroke-width="1.3"/>
    <line x1="560" y1="986.4" x2="1110" y2="986.4" stroke="#edf0f5" stroke-width="1"/>
    <line x1="560" y1="942.7" x2="1110" y2="942.7" stroke="#edf0f5" stroke-width="1"/>
    <line x1="560" y1="899.1" x2="1110" y2="899.1" stroke="#edf0f5" stroke-width="1"/>
    <line x1="560" y1="855.5" x2="1110" y2="855.5" stroke="#edf0f5" stroke-width="1"/>
    <line x1="560" y1="811.8" x2="1110" y2="811.8" stroke="#edf0f5" stroke-width="1"/>
    <line x1="560" y1="790" x2="560" y2="1030" stroke="#cfd6e2" stroke-width="1.3"/>
    <g class="axis" text-anchor="end">
      <text x="552" y="1034">0</text>
      <text x="552" y="990.4">1</text>
      <text x="552" y="946.7">2</text>
      <text x="552" y="903.1">3</text>
      <text x="552" y="859.5">4</text>
      <text x="552" y="815.8">5</text>
    </g>
  </g>

  <!-- bars (width 32) -->
  <g fill="url(#barGrad)">
    <rect x="579" y="836.3" width="32" height="193.7" rx="4"/>
    <rect x="633" y="811.8" width="32" height="218.2" rx="4"/>
    <rect x="687" y="814.9" width="32" height="215.1" rx="4"/>
    <rect x="741" y="810.1" width="32" height="219.9" rx="4"/>
    <rect x="795" y="806.6" width="32" height="223.4" rx="4"/>
    <rect x="849" y="809.6" width="32" height="220.4" rx="4"/>
    <rect x="903" y="810.1" width="32" height="219.9" rx="4"/>
    <rect x="957" y="844.1" width="32" height="185.9" rx="4"/>
    <rect x="1011" y="846.3" width="32" height="183.7" rx="4"/>
    <rect x="1065" y="854.1" width="32" height="175.9" rx="4"/>
  </g>
  <!-- value labels -->
  <g class="val" text-anchor="middle">
    <text x="595" y="829.3">4.44</text>
    <text x="649" y="804.8">5.00</text>
    <text x="703" y="807.9">4.93</text>
    <text x="757" y="803.1">5.04</text>
    <text x="811" y="799.6">5.12</text>
    <text x="865" y="802.6">5.05</text>
    <text x="919" y="803.1">5.04</text>
    <text x="973" y="837.1">4.26</text>
    <text x="1027" y="839.3">4.21</text>
    <text x="1081" y="847.1">4.03</text>
  </g>
  <!-- year labels -->
  <g class="yr" text-anchor="middle">
    <text x="595" y="1051">2015</text>
    <text x="649" y="1051">2016</text>
    <text x="703" y="1051">2017</text>
    <text x="757" y="1051">2018</text>
    <text x="811" y="1051">2019</text>
    <text x="865" y="1051">2020</text>
    <text x="919" y="1051">2021</text>
    <text x="973" y="1051">2022</text>
    <text x="1027" y="1051">2023</text>
    <text x="1081" y="1051">2024</text>
  </g>
  <text x="1110" y="1078" text-anchor="end" class="small">Figures in current US$; FX swings affect dollar totals.</text>

  <!-- ============ ROW 3 : DONUT + WHERE TO GO ============ -->
  <!-- Donut card -->
  <rect x="60" y="1110" width="480" height="500" rx="18" class="card"/>
  <text x="90" y="1148" class="eyebrow">DEMOGRAPHICS</text>
  <text x="90" y="1176" class="ctitle">Population by background</text>

  <!-- donut segments : center (290,1300) R=115 r=70 -->
  <path d="M 290 1185 A 115 115 0 1 1 272.01 1186.42 L 279.05 1230.86 A 70 70 0 1 0 290 1230 Z" fill="#d94f4f"/>
  <path d="M 272.01 1186.42 A 115 115 0 0 1 276.31 1185.82 L 281.66 1230.50 A 70 70 0 0 0 279.05 1230.86 Z" fill="#3a6ea5"/>
  <path d="M 276.31 1185.82 A 115 115 0 0 1 279.18 1185.51 L 283.41 1230.31 A 70 70 0 0 0 281.66 1230.50 Z" fill="#e0a458"/>
  <path d="M 279.18 1185.51 A 115 115 0 0 1 281.33 1185.33 L 284.73 1230.20 A 70 70 0 0 0 283.41 1230.31 Z" fill="#6aa67f"/>
  <path d="M 281.33 1185.33 A 115 115 0 0 1 290 1185 L 290 1230 A 70 70 0 0 0 284.73 1230.20 Z" fill="#9b8bb4"/>
  <!-- thin white ring separators for the small slivers area -->
  <circle cx="290" cy="1300" r="115" fill="none" stroke="#ffffff" stroke-width="0"/>

  <text x="290" y="1296" text-anchor="middle" font-size="32" font-weight="800" fill="#1f2a44">97.5%</text>
  <text x="290" y="1320" text-anchor="middle" font-size="14" fill="#5a6478">Japanese</text>

  <!-- donut legend -->
  <g>
    <rect x="100" y="1428" width="15" height="15" rx="3" fill="#d94f4f"/>
    <text x="124" y="1440" class="legendb">Japanese</text>
    <text x="510" y="1440" text-anchor="end" class="legend">97.5%</text>

    <rect x="100" y="1458" width="15" height="15" rx="3" fill="#3a6ea5"/>
    <text x="124" y="1470" class="legend">Chinese</text>
    <text x="510" y="1470" text-anchor="end" class="legend">0.6%</text>

    <rect x="100" y="1488" width="15" height="15" rx="3" fill="#e0a458"/>
    <text x="124" y="1500" class="legend">Vietnamese</text>
    <text x="510" y="1500" text-anchor="end" class="legend">0.4%</text>

    <rect x="100" y="1518" width="15" height="15" rx="3" fill="#6aa67f"/>
    <text x="124" y="1530" class="legend">South Korean</text>
    <text x="510" y="1530" text-anchor="end" class="legend">0.3%</text>

    <rect x="100" y="1548" width="15" height="15" rx="3" fill="#9b8bb4"/>
    <text x="124" y="1560" class="legend">Other</text>
    <text x="510" y="1560" text-anchor="end" class="legend">1.2%</text>
  </g>
  <text x="100" y="1590" class="small">Shares are approximate and illustrative.</text>

  <!-- Where to go card -->
  <rect x="560" y="1110" width="580" height="500" rx="18" class="card"/>
  <text x="590" y="1148" class="eyebrow">TRAVEL</text>
  <text x="590" y="1176" class="ctitle">Where to go</text>

  <g>
    <!-- 1 Tokyo -->
    <circle cx="602" cy="1232" r="13" fill="#d94f4f"/>
    <text x="602" y="1237" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="626" y="1227" class="bodyb">Tokyo</text>
    <text x="626" y="1247" class="body" font-size="14.5">Neon districts, world-class museums and endless food.</text>

    <!-- 2 Kyoto -->
    <circle cx="602" cy="1284" r="13" fill="#d94f4f"/>
    <text x="602" y="1289" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
    <text x="626" y="1279" class="bodyb">Kyoto</text>
    <text x="626" y="1299" class="body" font-size="14.5">Historic temples, shrines and traditional geisha quarters.</text>

    <!-- 3 Osaka -->
    <circle cx="602" cy="1336" r="13" fill="#d94f4f"/>
    <text x="602" y="1341" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <text x="626" y="1331" class="bodyb">Osaka</text>
    <text x="626" y="1351" class="body" font-size="14.5">Japan's street-food capital, with lively nightlife.</text>

    <!-- 4 Hiroshima & Miyajima -->
    <circle cx="602" cy="1388" r="13" fill="#d94f4f"/>
    <text x="602" y="1393" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
    <text x="626" y="1383" class="bodyb">Hiroshima &amp; Miyajima</text>
    <text x="626" y="1403" class="body" font-size="14.5">Peace Memorial Park and the famous floating torii gate.</text>

    <!-- 5 Mount Fuji & Hakone -->
    <circle cx="602" cy="1440" r="13" fill="#d94f4f"/>
    <text x="602" y="1445" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
    <text x="626" y="1435" class="bodyb">Mount Fuji &amp; Hakone</text>
    <text x="626" y="1455" class="body" font-size="14.5">The iconic peak, hot-spring resorts and serene lake views.</text>

    <!-- 6 Hokkaido -->
    <circle cx="602" cy="1492" r="13" fill="#d94f4f"/>
    <text x="602" y="1497" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
    <text x="626" y="1487" class="bodyb">Hokkaido</text>
    <text x="626" y="1507" class="body" font-size="14.5">World-class skiing, wild nature and superb fresh seafood.</text>
  </g>
  <text x="590" y="1556" class="small">Six regions that capture Japan's range — city, history and nature.</text>

  <!-- ============ FOOTER / MT FUJI ============ -->
  <g opacity="0.07">
    <path d="M440 1772 Q 560 1690 600 1656 Q 640 1690 760 1772 Z" fill="#5b6fa6"/>
  </g>
  <g opacity="0.5">
    <path d="M578 1690 Q 600 1672 622 1690 L 612 1700 Q 600 1693 588 1700 Z" fill="#ffffff" opacity="0.18"/>
  </g>

  <line x1="60" y1="1652" x2="1140" y2="1652" stroke="#d9dee8" stroke-width="1.2"/>
  <text x="60" y="1684" class="small">Sources — GDP: World Bank / IMF, nominal GDP in current US$, 2015–2024. Population shares: approximate national estimates by background.</text>
  <text x="60" y="1704" class="small">Map is stylised and not drawn to scale. Infographic compiled June 2026.</text>
  <text x="1140" y="1694" text-anchor="end" class="small" fill="#b04a3a" font-weight="700">JAPAN · AT A GLANCE</text>
</svg>
