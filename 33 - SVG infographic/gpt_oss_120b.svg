<?xml version="1.0" encoding="UTF-8"?>
<!--
  Japan at a glance – static infographic
  Size: 1200 × 1800 px
  No JS, no external assets, no raster images.
  All icons, charts and background are built with pure SVG elements.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="1800"
     viewBox="0 0 1200 1800"
     font-family="Helvetica,Arial,sans-serif">

  <!-- ==============================================================
       DEFINITIONS (gradients, filters, patterns)
       ============================================================== -->
  <defs>
    <!-- Soft vertical background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#e0f5ff"/>
      <stop offset="100%" stop-color="#c4e6ff"/>
    </linearGradient>

    <!-- Subtle wave pattern (repeating cubic Bézier) -->
    <pattern id="wavePat" width="200" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 40 Q50 0 100 40 T200 40"
            stroke="#a0cde8" stroke-width="12" fill="none" opacity="0.35"/>
    </pattern>

    <!-- Drop‑shadow filter (soft) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <!-- Bar chart colour gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>

    <!-- Donut chart colour palette -->
    <g id="palette">
      <stop offset="0%" stop-color="#4a90e2"/>   <!-- Japanese -->
      <stop offset="20%" stop-color="#f5a623"/>  <!-- Chinese -->
      <stop offset="40%" stop-color="#7ed321"/>  <!-- Vietnamese -->
      <stop offset="60%" stop-color="#d0021b"/>  <!-- South Korean -->
      <stop offset="80%" stop-color="#9b9b9b"/>  <!-- Other -->
    </g>
  </defs>

  <!-- ==============================================================
       BACKGROUND
       ============================================================== -->
  <rect width="1200" height="1800" fill="url(#bgGrad)"/>
  <!-- light wave overlay -->
  <rect width="1200" height="1800" fill="url(#wavePat)"/>

  <!-- ==============================================================
       TITLE
       ============================================================== -->
  <text x="600" y="90" text-anchor="middle"
        font-size="48" font-weight="bold" fill="#003366">Japan at a glance</text>

  <!-- ==============================================================
       FIRST ROW – MAP + Intro text
       ============================================================== -->
  <!-- MAP CARD -->
  <g filter="url(#shadow)">
    <rect x="70" y="130" width="500" height="460" rx="12" ry="12" fill="#ffffffcc"/>
  </g>
  <!-- MAP (stylised simple outline) -->
  <g transform="translate(120,180) scale(0.8)">
    <path d="M70,0
             C55,-10 45,-30 30,-20
             C15,-10 0,0 0,20
             C0,40 20,60 25,80
             C30,100 20,120 0,130
             C-20,140 -25,165 -10,180
             C5,195 30,185 45,190
             C60,195 70,210 80,210
             C90,210 110,190 120,180
             C130,170 150,165 160,150
             C170,135 160,115 150,100
             C140,85 125,80 120,65
             C115,50 125,35 140,30
             C155,25 170,30 180,45
             C190,60 200,80 210,95
             C220,110 210,130 200,145
             C190,160 180,175 170,190
             C160,205 150,220 140,230
             C130,240 120,250 110,260
             C100,270 90,270 80,260
             C70,250 60,240 50,230
             C40,220 30,210 20,200
             C10,190 0,180 -5,165
             C-10,150 -5,130 0,115
             C5,100 15,90 20,75
             C25,60 30,45 35,30
             C40,15 45,5 55,0
             Z"
          fill="#c2e0ff" stroke="#0066cc" stroke-width="2"/>
    <!-- City markers -->
    <g font-size="14" font-weight="600" fill="#004080" text-anchor="middle">
      <!-- Tokyo (approx bottom‑right) -->
      <circle cx="170" cy="210" r="6" fill="#ff8c00"/>
      <text x="170" y="228">Tokyo</text>
      <!-- Yokohama (slightly left of Tokyo) -->
      <circle cx="160" cy="225" r="5" fill="#ff8c00"/>
      <text x="160" y="242">Yokohama</text>
      <!-- Osaka (center‑left) -->
      <circle cx="80" cy="150" r="5" fill="#ff8c00"/>
      <text x="80" y="168">Osaka</text>
      <!-- Nagoya (mid‑right) -->
      <circle cx="115" cy="145" r="5" fill="#ff8c00"/>
      <text x="115" y="163">Nagoya</text>
    </g>
  </g>

  <!-- Explanatory text card (right side) -->
  <g filter="url(#shadow)">
    <rect x="590" y="130" width="500" height="460" rx="12" ry="12" fill="#ffffffcc"/>
  </g>
  <foreignObject x="610" y="150" width="460" height="420">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px; line-height:1.5; color:#333;">
      <p>
        Japan, an island nation in East Asia, blends ancient traditions with cutting‑edge
        technology. Its economy ranks among the world’s largest, and its cultural heritage
        draws millions of visitors each year. The country is composed of four main islands
        (Honshu, Hokkaido, Kyushu and Shikoku) and thousands of smaller ones.
      </p>
    </div>
  </foreignObject>

  <!-- Full‑width paragraph under first row -->
  <g filter="url(#shadow)">
    <rect x="70" y="620" width="1020" height="100" rx="12" ry="12" fill="#ffffffcc"/>
  </g>
  <foreignObject x="90" y="640" width="980" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.4; color:#333;">
      Japan’s population is rapidly ageing while its economy remains a global powerhouse, known
      for automotive, electronics, robotics, and a vibrant pop‑culture that influences the world.
    </div>
  </foreignObject>

  <!-- ==============================================================
       SECOND ROW – Text + Bar chart (GDP)
       ============================================================== -->
  <!-- Text column (left) -->
  <g filter="url(#shadow)">
    <rect x="70" y="750" width="540" height="300" rx="12" ry="12" fill="#ffffffcc"/>
  </g>
  <foreignObject x="90" y="770" width="500" height="260">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.6; color:#333;">
      <p><strong>Nominal GDP (US$ trillions)</strong> – Japan’s gross domestic product has
      fluctuated over the past decade, peaking around 5 trillion in 2018‑2019 before a gradual
      decline due to demographic challenges and global economic conditions.</p>
    </div>
  </foreignObject>

  <!-- Bar‑chart column (right) -->
  <g filter="url(#shadow)">
    <rect x="640" y="750" width="470" height="300" rx="12" ry="12" fill="#ffffffcc"/>
  </g>

  <!-- Bar chart axes -->
  <g transform="translate(680,1030)" font-size="12" fill="#333">
    <!-- Y‑axis ticks -->
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#999" stroke-width="1"/>
    <text x="-10" y="-200" text-anchor="end">5.0</text>
    <text x="-10" y="-150" text-anchor="end">4.0</text>
    <text x="-10" y="-100" text-anchor="end">3.0</text>
    <text x="-10" y="-50"  text-anchor="end">2.0</text>
    <text x="-10" y="0"   text-anchor="end">0</text>
    <!-- X‑axis labels -->
    <g transform="translate(0,5)">
      <text x="0"   y="15" text-anchor="middle">2015</text>
      <text x="45"  y="15" text-anchor="middle">2016</text>
      <text x="90"  y="15" text-anchor="middle">2017</text>
      <text x="135" y="15" text-anchor="middle">2018</text>
      <text x="180" y="15" text-anchor="middle">2019</text>
      <text x="225" y="15" text-anchor="middle">2020</text>
      <text x="270" y="15" text-anchor="middle">2021</text>
      <text x="315" y="15" text-anchor="middle">2022</text>
      <text x="360" y="15" text-anchor="middle">2023</text>
      <text x="405" y="15" text-anchor="middle">2024</text>
    </g>
  </g>

  <!-- Bars (height = value / 5.0 * 200) -->
  <g fill="url(#barGrad)" transform="translate(680,1030) scale(1,-1)">
    <rect x="-12" y="0" width="24" height="177.6" transform="translate(0,0)"/>   <!-- 4.44 -->
    <rect x="33"  y="0" width="24" height="200"   transform="translate(0,0)"/>   <!-- 5.00 -->
    <rect x="78"  y="0" width="24" height="197.2" transform="translate(0,0)"/>   <!-- 4.93 -->
    <rect x="123" y="0" width="24" height="201.6" transform="translate(0,0)"/>   <!-- 5.04 -->
    <rect x="168" y="0" width="24" height="204.8" transform="translate(0,0)"/>   <!-- 5.12 -->
    <rect x="213" y="0" width="24" height="202"   transform="translate(0,0)"/>   <!-- 5.05 -->
    <rect x="258" y="0" width="24" height="201.6" transform="translate(0,0)"/>   <!-- 5.04 -->
    <rect x="303" y="0" width="24" height="170.4" transform="translate(0,0)"/>   <!-- 4.26 -->
    <rect x="348" y="0" width="24" height="168.4" transform="translate(0,0)"/>   <!-- 4.21 -->
    <rect x="393" y="0" width="24" height="161.2" transform="translate(0,0)"/>   <!-- 4.03 -->
  </g>

  <!-- Bar‑chart caption -->
  <text x="880" y="1080" font-size="14" fill="#555">Nominal GDP (US$ trillions)</text>

  <!-- ==============================================================
       THIRD ROW – Donut chart + Travel text
       ============================================================== -->
  <!-- Donut chart (left) -->
  <g filter="url(#shadow)">
    <rect x="70" y="1080" width="540" height="360" rx="12" ry="12" fill="#ffffffcc"/>
  </g>

  <!-- Donut drawing -->
  <g transform="translate(340,1260)">
    <!-- background circle -->
    <circle r="150" fill="#f0f0f0"/>
    <!-- slices -->
    <path d="M0,-150 A150,150 0 0,1 147.45,-38.55 L0,0 Z" fill="#4a90e2"/> <!-- 97.5% Japanese -->
    <path d="M147.45,-38.55 A150,150 0 0,1 111.6,114.42 L0,0 Z" fill="#f5a623"/> <!-- 0.6% Chinese -->
    <path d="M111.6,114.42 A150,150 0 0,1 -111.6,114.42 L0,0 Z" fill="#7ed321"/> <!-- 0.4% Vietnamese -->
    <path d="M-111.6,114.42 A150,150 0 0,1 -147.45,-38.55 L0,0 Z" fill="#d0021b"/> <!-- 0.3% South Korean -->
    <path d="M-147.45,-38.55 A150,150 0 0,1 0,-150 L0,0 Z" fill="#9b9b9b"/> <!-- 1.2% Other -->
    <!-- inner hole -->
    <circle r="80" fill="#ffffffcc"/>
    <!-- centre label -->
    <text y="6" text-anchor="middle" font-size="18" fill="#333">Population</text>
  </g>

  <!-- Legend for donut -->
  <g font-size="13" fill="#333">
    <g transform="translate(480,1160)">
      <rect width="15" height="15" fill="#4a90e2"/>
      <text x="22" y="12">Japanese 97.5 %</text>
    </g>
    <g transform="translate(480,1195)">
      <rect width="15" height="15" fill="#f5a623"/>
      <text x="22" y="12">Chinese 0.6 %</text>
    </g>
    <g transform="translate(480,1230)">
      <rect width="15" height="15" fill="#7ed321"/>
      <text x="22" y="12">Vietnamese 0.4 %</text>
    </g>
    <g transform="translate(480,1265)">
      <rect width="15" height="15" fill="#d0021b"/>
      <text x="22" y="12">South Korean 0.3 %</text>
    </g>
    <g transform="translate(480,1300)">
      <rect width="15" height="15" fill="#9b9b9b"/>
      <text x="22" y="12">Other 1.2 %</text>
    </g>
  </g>

  <!-- Travel text (right side) -->
  <g filter="url(#shadow)">
    <rect x="640" y="1080" width="470" height="360" rx="12" ry="12" fill="#ffffffcc"/>
  </g>
  <foreignObject x="660" y="1100" width="430" height="320">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.6; color:#333;">
      <p><strong>Must‑visit destinations</strong></p>
      <ul style="margin:0;padding-left:20px;">
        <li>Tokyo – neon, sushi, historic temples</li>
        <li>Kyoto – classical shrines, geisha districts</li>
        <li>Osaka – street food, vibrant nightlife</li>
        <li>Hiroshima &amp; Miyajima – Peace Memorial, Itsukushima torii</li>
        <li>Mount Fuji &amp; Hakone – iconic peak, onsen</li>
        <li>Hokkaido – winter snowscapes, lavender fields</li>
      </ul>
    </div>
  </foreignObject>

  <!-- ==============================================================
       FOOTER – source note
       ============================================================== -->
  <text x="600" y="1760" text-anchor="middle" font-size="12" fill="#666">
    Sources: World Bank (GDP), Statistics Bureau of Japan (population), Travel guide 2024
  </text>

</svg>