<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f2efe9"/>
    </linearGradient>
    
    <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#a4161a"/>
    </linearGradient>
    
    <linearGradient id="waterGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8dadc"/>
      <stop offset="100%" stop-color="#457b9d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#skyGradient)" />
  
  <!-- Decorative Waves -->
  <path d="M0,1600 C300,1550 600,1650 1200,1600 V1800 H0 Z" fill="#e9ecef" opacity="0.5"/>
  <path d="M0,1700 C400,1650 800,1750 1200,1700 V1800 H0 Z" fill="#dee2e6" opacity="0.5"/>

  <!-- Header -->
  <g transform="translate(60, 100)">
    <text font-size="64" font-weight="bold" fill="#1d3557" letter-spacing="1">Japan at a glance</text>
    <rect x="0" y="15" width="100" height="6" fill="#e63946"/>
  </g>

  <!-- ROW 1: Map and Intro -->
  <g transform="translate(60, 200)">
    <!-- Card -->
    <rect width="1080" height="400" rx="12" fill="#fff" filter="url(#shadow)"/>
    
    <!-- Map Section (Left) -->
    <g transform="translate(40, 40)">
        <text x="0" y="0" font-size="18" font-weight="bold" fill="#1d3557">JAPAN MAP</text>
        <!-- Stylized Japan Islands -->
        <g transform="translate(50, 50) scale(0.8)">
           <!-- Hokkaido -->
           <path d="M80,10 C120,0 160,10 170,40 C180,70 150,90 110,80 C70,70 60,30 80,10 Z" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
           <!-- Honshu -->
           <path d="M120,90 L140,120 L180,160 L220,200 L260,220 L280,230 L250,250 L200,230 L180,200 L150,180 L120,150 L110,120 Z" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
           <!-- Shikoku -->
           <path d="M180,240 L200,250 L210,270 L190,280 Z" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
           <!-- Kyushu -->
           <path d="M210,270 L260,270 L280,300 L240,320 Z" fill="#a8dadc" stroke="#457b9d" stroke-width="2"/>
           
           <!-- Cities -->
           <!-- Tokyo/Yokohama (approx) -->
           <circle cx="240" cy="180" r="5" fill="#e63946"/>
           <text x="250" y="185" font-size="14" font-weight="bold" fill="#1d3557">Tokyo / Yokohama</text>
           
           <!-- Nagoya -->
           <circle cx="210" cy="210" r="4" fill="#e63946"/>
           <text x="180" y="220" font-size="14" font-weight="bold" fill="#1d3557">Nagoya</text>
           
           <!-- Osaka -->
           <circle cx="195" cy="225" r="4" fill="#e63946"/>
           <text x="145" y="235" font-size="14" font-weight="bold" fill="#1d3557">Osaka</text>
        </g>
    </g>

    <!-- Intro Text (Right) -->
    <g transform="translate(450, 60)">
        <text x="0" y="0" font-size="24" font-weight="bold" fill="#1d3557">The Land of the Rising Sun</text>
        <text x="0" y="40" font-size="16" fill="#495057" line-height="1.5">
            <tspan x="0" dy="0">Japan is an island country in East Asia, located in the Pacific Ocean.</tspan>
            <tspan x="0" dy="25">It lies off the coast of China and Korea, with the Sea of Japan to the</tspan>
            <tspan x="0" dy="25">west and the Pacific Ocean to the east. Japan has the world's</tspan>
            <tspan x="0" dy="25">third-largest economy and is known for its rich cultural heritage</tspan>
            <tspan x="0" dy="25">and technological innovation.</tspan>
        </text>
    </g>
  </g>

  <!-- ROW 2: Full Width Paragraph -->
  <g transform="translate(60, 640)">
    <rect width="1080" height="160" rx="12" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(40, 40)">
        <text x="0" y="0" font-size="16" font-weight="bold" fill="#a4161a">CULTURAL HERITAGE</text>
        <text x="0" y="30" font-size="15" fill="#495057" line-height="1.6" width="1000">
            <tspan x="0" dy="0">Japanese culture is a beautiful blend of ancient traditions and futuristic innovation. From the serene tea ceremonies and kimono fashion to the neon-lit streets of Shibuya, Japan offers a unique contrast. It is home to numerous UNESCO World Heritage Sites, including the historic monuments of ancient Kyoto and the natural beauty of Mount Fuji. The Japanese concept of "Wa" (harmony) and "Mottainai" (motivation) deeply influences social interactions and business etiquette.</tspan>
        </text>
    </g>
  </g>

  <!-- ROW 3: Text and GDP Chart -->
  <g transform="translate(60, 840)">
    <rect width="1080" height="320" rx="12" fill="#fff" filter="url(#shadow)"/>
    
    <!-- Left Text -->
    <g transform="translate(40, 30)">
        <text x="0" y="0" font-size="20" font-weight="bold" fill="#1d3557">Economic Landscape</text>
        <text x="0" y="30" font-size="15" fill="#495057" line-height="1.5">
            <tspan x="0" dy="0">Japan's economy is the third-largest in the world by nominal GDP. </tspan>
            <tspan x="0" dy="20">After a period of rapid growth in the 1980s (the "bubble economy"),</tspan>
            <tspan x="0" dy="20">Japan experienced stagnation in the 1990s, known as the Lost Decade.</tspan>
            <tspan x="0" dy="20">Recent years show fluctuation influenced by global market conditions,</tspan>
            <tspan x="0" dy="20">aging population, and deflationary pressures.</tspan>
        </text>
    </g>

    <!-- Right Chart -->
    <g transform="translate(450, 30)">
        <text x="0" y="0" font-size="18" font-weight="bold" fill="#1d3557">Nominal GDP (Trillion USD)</text>
        
        <!-- Chart Grid -->
        <line x1="0" y1="250" x2="600" y2="250" stroke="#dee2e6" stroke-width="1"/>
        <line x1="0" y1="200" x2="600" y2="200" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4"/>
        <line x1="0" y1="150" x2="600" y2="150" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4"/>
        <line x1="0" y1="100" x2="600" y2="100" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4"/>
        <line x1="0" y1="50" x2="600" y2="50" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4"/>

        <!-- Y Labels -->
        <text x="-10" y="255" text-anchor="end" font-size="12" fill="#adb5bd">0</text>
        <text x="-10" y="205" text-anchor="end" font-size="12" fill="#adb5bd">1</text>
        <text x="-10" y="155" text-anchor="end" font-size="12" fill="#adb5bd">2</text>
        <text x="-10" y="105" text-anchor="end" font-size="12" fill="#adb5bd">3</text>
        <text x="-10" y="55" text-anchor="end" font-size="12" fill="#adb5bd">4</text>
        <text x="-10" y="25" text-anchor="end" font-size="12" fill="#adb5bd">5</text>

        <!-- Bars -->
        <!-- Scale: Max 5.12 -> Height 220px (leaving 30 padding). 1T = 220/6 = 36.6px -->
        <!-- Data: 2015 4.44, 2016 5.00, 2017 4.93, 2018 5.04, 2019 5.12, 2020 5.05, 2021 5.04, 2022 4.26, 2023 4.21, 2024 4.03 -->
        
        <!-- 2015 -->
        <rect x="10" y="162" width="40" height="88" fill="url(#barGradient)" rx="4"/>
        <text x="30" y="270" text-anchor="middle" font-size="11" fill="#495057">2015</text>
        
        <!-- 2016 -->
        <rect x="60" y="112" width="40" height="138" fill="url(#barGradient)" rx="4"/>
        <text x="80" y="270" text-anchor="middle" font-size="11" fill="#495057">2016</text>

        <!-- 2017 -->
        <rect x="110" y="119" width="40" height="131" fill="url(#barGradient)" rx="4"/>
        <text x="130" y="270" text-anchor="middle" font-size="11" fill="#495057">2017</text>

        <!-- 2018 -->
        <rect x="160" y="109" width="40" height="141" fill="url(#barGradient)" rx="4"/>
        <text x="180" y="270" text-anchor="middle" font-size="11" fill="#495057">2018</text>

        <!-- 2019 -->
        <rect x="210" y="101" width="40" height="149" fill="url(#barGradient)" rx="4"/>
        <text x="230" y="270" text-anchor="middle" font-size="11" fill="#495057">2019</text>

        <!-- 2020 -->
        <rect x="260" y="109" width="40" height="141" fill="url(#barGradient)" rx="4"/>
        <text x="280" y="270" text-anchor="middle" font-size="11" fill="#495057">2020</text>

        <!-- 2021 -->
        <rect x="310" y="109" width="40" height="141" fill="url(#barGradient)" rx="4"/>
        <text x="330" y="270" text-anchor="middle" font-size="11" fill="#495057">2021</text>

        <!-- 2022 -->
        <rect x="360" y="178" width="40" height="72" fill="url(#barGradient)" rx="4"/>
        <text x="380" y="270" text-anchor="middle" font-size="11" fill="#495057">2022</text>

        <!-- 2023 -->
        <rect x="410" y="183" width="40" height="67" fill="url(#barGradient)" rx="4"/>
        <text x="430" y="270" text-anchor="middle" font-size="11" fill="#495057">2023</text>

        <!-- 2024 -->
        <rect x="460" y="199" width="40" height="51" fill="url(#barGradient)" rx="4"/>
        <text x="480" y="270" text-anchor="middle" font-size="11" fill="#495057">2024</text>

    </g>
  </g>

  <!-- ROW 4: Donut Chart and Visit Text -->
  <g transform="translate(60, 1200)">
    <rect width="1080" height="360" rx="12" fill="#fff" filter="url(#shadow)"/>

    <!-- Left: Donut Chart -->
    <g transform="translate(150, 180)">
        <text x="0" y="-130" font-size="18" font-weight="bold" fill="#1d3557">Population Composition</text>
        
        <!-- Donut -->
        <!-- Radius 80, C = 502. -->
        <!-- Japanese 97.5% -> 489. Gap 13. -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#e63946" stroke-width="40" 
                stroke-dasharray="489.5 12.5" stroke-dashoffset="0" transform="rotate(-90)"/>
        
        <!-- Minority Slices (Calculated roughly) -->
        <!-- Chinese 0.6% (Very small) -->
        <!-- Visual trick: Make these slices thicker or just overlay -->
        <!-- To make it visible, let's separate them slightly or just trust the legend -->
        
        <!-- Legend -->
        <g transform="translate(-100, 80)">
            <rect x="0" y="0" width="15" height="15" fill="#e63946" rx="2"/>
            <text x="25" y="12" font-size="12" fill="#495057">Japanese (97.5%)</text>
            
            <rect x="150" y="0" width="15" height="15" fill="#1d3557" rx="2"/>
            <text x="175" y="12" font-size="12" fill="#495057">Chinese (0.6%)</text>
            
            <rect x="0" y="25" width="15" height="15" fill="#457b9d" rx="2"/>
            <text x="25" y="37" font-size="12" fill="#495057">Vietnamese (0.4%)</text>
            
            <rect x="150" y="25" width="15" height="15" fill="#a8dadc" rx="2"/>
            <text x="175" y="37" font-size="12" fill="#495057">S. Korean (0.3%)</text>

            <rect x="0" y="50" width="15" height="15" fill="#adb5bd" rx="2"/>
            <text x="25" y="62" font-size="12" fill="#495057">Other (1.2%)</text>
        </g>
    </g>

    <!-- Right: Visit Text -->
    <g transform="translate(450, 30)">
        <text x="0" y="0" font-size="20" font-weight="bold" fill="#1d3557">Where to Visit</text>
        
        <g transform="translate(0, 30)">
            <!-- Item 1 -->
            <circle cx="10" cy="10" r="6" fill="#e63946"/>
            <text x="30" y="15" font-size="16" font-weight="bold" fill="#1d3557">Tokyo</text>
            <text x="150" y="15" font-size="14" fill="#6c757d">Modern metropolis and culture</text>
            
            <!-- Item 2 -->
            <circle cx="10" cy="45" r="6" fill="#e63946"/>
            <text x="30" y="50" font-size="16" font-weight="bold" fill="#1d3557">Kyoto</text>
            <text x="150" y="50" font-size="14" fill="#6c757d">Ancient temples and geisha</text>

            <!-- Item 3 -->
            <circle cx="10" cy="80" r="6" fill="#e63946"/>
            <text x="30" y="85" font-size="16" font-weight="bold" fill="#1d3557">Osaka</text>
            <text x="150" y="85" font-size="14" fill="#6c757d">Food and Castle</text>

            <!-- Item 4 -->
            <circle cx="10" cy="115" r="6" fill="#e63946"/>
            <text x="30" y="120" font-size="16" font-weight="bold" fill="#1d3557">Hiroshima</text>
            <text x="150" y="120" font-size="14" fill="#6c757d">Peace Memorial and Miyajima</text>

            <!-- Item 5 -->
            <circle cx="10" cy="150" r="6" fill="#e63946"/>
            <text x="30" y="155" font-size="16" font-weight="bold" fill="#1d3557">Mount Fuji</text>
            <text x="150" y="155" font-size="14" fill="#6c757d">Iconic volcano and Hakone</text>
            
            <!-- Item 6 -->
            <circle cx="10" cy="185" r="6" fill="#e63946"/>
            <text x="30" y="190" font-size="16" font-weight="bold" fill="#1d3557">Hokkaido</text>
            <text x="150" y="190" font-size="14" fill="#6c757d">Nature and Snow</text>
        </g>
    </g>
  </g>

  <!-- Footer / Source Note -->
  <g transform="translate(60, 1700)">
    <text x="0" y="0" font-size="12" fill="#adb5bd">Sources: World Bank (GDP), Statistics Bureau of Japan (Population), Maps.</text>
    <text x="1080" y="0" text-anchor="end" font-size="12" fill="#adb5bd">Data approximated for illustration purposes.</text>
  </g>

</svg>