<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" aria-labelledby="title desc" role="img">
  <title id="title">Japan at a Glance - Infographic</title>
  <desc id="desc">Modern editorial infographic about Japan featuring a stylized map, GDP bar chart (2015-2024), population donut chart, key facts, and top destinations.</desc>
  
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#B2E0F7"/>
    </linearGradient>
    
    <!-- Card background -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FBFF"/>
    </linearGradient>
    
    <!-- Title accent -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    
    <!-- Bar gradient -->
    <linearGradient id="barGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    
    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="4" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Wave pattern -->
    <pattern id="waves" x="0" y="0" width="280" height="60" patternUnits="userSpaceOnUse">
      <path d="M0,35 Q35,15 70,35 Q105,55 140,35 Q175,15 210,35 Q245,55 280,35" 
            fill="none" stroke="#81C4E7" stroke-width="9" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGradient)"/>
  <rect width="1200" height="1800" fill="url(#waves)" opacity="0.6"/>

  <!-- Header -->
  <rect x="80" y="55" width="1040" height="110" rx="25" fill="url(#cardGradient)" filter="url(#shadow)"/>
  <text x="600" y="115" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="68" font-weight="900" fill="#1A1A1A" letter-spacing="-2">JAPAN</text>
  <text x="600" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#C8102E" letter-spacing="6">AT A GLANCE</text>

  <!-- ROW 1: MAP -->
  <!-- Map Card -->
  <rect x="70" y="210" width="530" height="490" rx="22" fill="url(#cardGradient)" filter="url(#shadow)"/>
  
  <!-- Stylized Map of Japan -->
  <g transform="translate(110,260)">
    <!-- Sea background for map -->
    <rect x="0" y="0" width="460" height="400" rx="15" fill="#E0F0FA"/>
    
    <!-- Hokkaido -->
    <path d="M140,35 Q165,15 210,25 Q245,8 280,35 Q310,55 295,85 Q260,95 225,75 Q180,85 140,35 Z" 
          fill="#F4E9D8" stroke="#1A3C5E" stroke-width="11"/>
    
    <!-- Honshu (main island) -->
    <path d="M95,125 Q75,165 85,215 Q55,255 95,295 Q125,355 185,375 Q255,395 310,340 Q355,280 370,195 Q340,135 280,115 Q210,95 95,125 Z" 
          fill="#F4E9D8" stroke="#1A3C5E" stroke-width="11"/>
    
    <!-- Kyushu -->
    <path d="M85,310 Q55,340 45,375 Q65,410 105,395 Q135,375 125,345 Z" 
          fill="#F4E9D8" stroke="#1A3C5E" stroke-width="9"/>
    
    <!-- Shikoku -->
    <path d="M165,305 Q185,325 210,330 Q235,315 225,290 Q200,275 175,285 Z" 
          fill="#F4E9D8" stroke="#1A3C5E" stroke-width="8"/>
    
    <!-- Simplified smaller islands hint -->
    <ellipse cx="380" cy="165" rx="22" ry="18" transform="rotate(-25 380 165)" fill="#F4E9D8" stroke="#1A3C5E" stroke-width="6"/>
    
    <!-- City Markers -->
    <!-- Tokyo -->
    <circle cx="305" cy="175" r="9" fill="#C8102E"/>
    <circle cx="305" cy="175" r="4" fill="#FFFFFF"/>
    <text x="325" y="172" font-family="Arial" font-size="19" font-weight="700" fill="#1A1A1A">Tokyo</text>
    
    <!-- Yokohama -->
    <circle cx="295" cy="200" r="7" fill="#C8102E"/>
    <text x="315" y="205" font-family="Arial" font-size="15.5" font-weight="600" fill="#1A1A1A">Yokohama</text>
    
    <!-- Nagoya -->
    <circle cx="225" cy="205" r="7" fill="#C8102E"/>
    <text x="150" y="200" font-family="Arial" font-size="15.5" font-weight="600" fill="#1A1A1A">Nagoya</text>
    
    <!-- Osaka -->
    <circle cx="185" cy="255" r="7" fill="#C8102E"/>
    <text x="120" y="275" font-family="Arial" font-size="15.5" font-weight="600" fill="#1A1A1A">Osaka</text>
    
    <!-- Map label -->
    <text x="30" y="425" font-family="Arial" font-size="14" fill="#455A7F" font-style="italic">Stylized representation • Not to scale</text>
  </g>

  <!-- ROW 1: RIGHT TEXT CARD -->
  <rect x="640" y="210" width="490" height="490" rx="22" fill="url(#cardGradient)" filter="url(#shadow)"/>
  
  <text x="685" y="265" font-family="Arial Black, sans-serif" font-size="27" fill="#C8102E">AN ISLAND NATION</text>
  
  <text x="685" y="305" font-family="Arial, sans-serif" font-size="15.5" line-height="21" fill="#333">
    <tspan x="685" dy="0">Japan is an archipelago of over 14,000 islands in East Asia.</tspan>
    <tspan x="685" dy="23">Famous for its unique blend of ancient tradition and cutting-edge</tspan>
    <tspan x="685" dy="23">technology, it is home to Mount Fuji, bullet trains, and a rich</tspan>
    <tspan x="685" dy="23">cultural heritage including tea ceremonies, anime, and zen gardens.</tspan>
    <tspan x="685" dy="28">With a population of approximately 124 million, Japan remains a</tspan>
    <tspan x="685" dy="23">global leader in innovation, robotics, and high-speed rail.</tspan>
  </text>

  <!-- Full-width paragraph card -->
  <rect x="70" y="735" width="1060" height="155" rx="22" fill="url(#cardGradient)" filter="url(#shadow)"/>
  <text x="600" y="775" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="21" fill="#C8102E">A UNIQUE BLEND OF TRADITION AND INNOVATION</text>
  <text x="600" y="810" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2" fill="#333" style="max-width:920px">
    <tspan x="600" dy="0">From the neon streets of Tokyo to the tranquil temples of Kyoto, Japan offers a remarkable contrast between old and new. Despite limited natural resources,</tspan>
    <tspan x="600" dy="21">it has built one of the world's largest economies through technological excellence and disciplined craftsmanship. Its respect for nature, seasonal beauty, and</tspan>
    <tspan x="600" dy="21">deep cultural traditions continue to captivate the world.</tspan>
  </text>

  <!-- ROW 2: GDP SECTION -->
  <!-- Left: GDP Text -->
  <rect x="70" y="925" width="410" height="410" rx="22" fill="url(#cardGradient)" filter="url(#shadow)"/>
  <text x="120" y="975" font-family="Arial Black, sans-serif" font-size="26" fill="#1A3C5E">ECONOMY</text>
  <text x="120" y="1015" font-family="Arial, sans-serif" font-size="15.5" fill="#222" style="max-width:320px">
    Japan's nominal GDP has remained remarkably stable over the past decade, consistently ranking among the world's top economies. 
    Despite challenges from an aging population and global competition, Japan continues to lead in automotive, electronics, and advanced manufacturing.
  </text>
  <text x="120" y="1190" font-family="Arial" font-size="13" fill="#666">Values shown in trillions of current US dollars</text>

  <!-- Right: Bar Chart -->
  <rect x="510" y="925" width="620" height="410" rx="22" fill="url(#cardGradient)" filter="url(#shadow)"/>
  
  <!-- Chart Title -->
  <text x="570" y="970" font-family="Arial Black, sans-serif" font-size="26" fill="#1A3C5E">NOMINAL GDP (2015–2024)</text>
  
  <!-- Y Axis labels -->
  <text x="545" y="1025" font-size="13" font-family="Arial" fill="#555" text-anchor="end">6.0</text>
  <text x="545" y="1095" font-size="13" font-family="Arial" fill="#555" text-anchor="end">5.0</text>
  <text x="545" y="1165" font-size="13" font-family="Arial" fill="#555" text-anchor="end">4.0</text>
  <text x="545" y="1235" font-size="13" font-family="Arial" fill="#555" text-anchor="end">3.0</text>
  
  <!-- Grid lines -->
  <line x1="565" y1="1028" x2="1100" y2="1028" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="565" y1="1098" x2="1100" y2="1098" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="565" y1="1168" x2="1100" y2="1168" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Bars -->
  <!-- 2015: 4.44 -->
  <rect x="575" y="1138" width="38" height="92" rx="3" fill="url(#barGradient)"/>
  <text x="594" y="1125" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">4.44</text>
  <text x="594" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">15</text>
  
  <!-- 2016: 5.00 -->
  <rect x="625" y="1090" width="38" height="140" rx="3" fill="url(#barGradient)"/>
  <text x="644" y="1077" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">5.00</text>
  <text x="644" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">16</text>
  
  <!-- 2017: 4.93 -->
  <rect x="675" y="1096" width="38" height="134" rx="3" fill="url(#barGradient)"/>
  <text x="694" y="1083" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">4.93</text>
  <text x="694" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">17</text>
  
  <!-- 2018: 5.04 -->
  <rect x="725" y="1087" width="38" height="143" rx="3" fill="url(#barGradient)"/>
  <text x="744" y="1074" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">5.04</text>
  <text x="744" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">18</text>
  
  <!-- 2019: 5.12 -->
  <rect x="775" y="1080" width="38" height="150" rx="3" fill="url(#barGradient)"/>
  <text x="794" y="1067" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">5.12</text>
  <text x="794" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">19</text>
  
  <!-- 2020: 5.05 -->
  <rect x="825" y="1086" width="38" height="144" rx="3" fill="url(#barGradient)"/>
  <text x="844" y="1073" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">5.05</text>
  <text x="844" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">20</text>
  
  <!-- 2021: 5.04 -->
  <rect x="875" y="1087" width="38" height="143" rx="3" fill="url(#barGradient)"/>
  <text x="894" y="1074" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">5.04</text>
  <text x="894" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">21</text>
  
  <!-- 2022: 4.26 -->
  <rect x="925" y="1132" width="38" height="98" rx="3" fill="url(#barGradient)"/>
  <text x="944" y="1119" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">4.26</text>
  <text x="944" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">22</text>
  
  <!-- 2023: 4.21 -->
  <rect x="975" y="1136" width="38" height="94" rx="3" fill="url(#barGradient)"/>
  <text x="994" y="1123" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">4.21</text>
  <text x="994" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">23</text>
  
  <!-- 2024: 4.03 -->
  <rect x="1025" y="1151" width="38" height="79" rx="3" fill="url(#barGradient)"/>
  <text x="1044" y="1138" text-anchor="middle" font-size="11.5" font-family="Arial" fill="#222">4.03</text>
  <text x="1044" y="1258" text-anchor="middle" font-size="12" font-family="Arial" fill="#333">24</text>

  <!-- BOTTOM ROW: POPULATION COMPOSITION -->
  <!-- Donut Chart Card -->
  <rect x="70" y="1370" width="510" height="390" rx="22" fill="url(#cardGradient)" filter="url(#shadow)"/>
  <text x="145" y="1415" font-family="Arial Black, sans-serif" font-size="25" fill="#1A3C5E">POPULATION COMPOSITION</text>
  
  <!-- Donut Chart -->
  <g transform="translate(255,1670)">
    <!-- Background ring -->
    <circle r="105" fill="none" stroke="#EAEAEA" stroke-width="48"/>
    
    <!-- Japanese 97.5% - Red (angle: 0 to 351°) -->
    <circle r="105" fill="none" stroke="#C8102E" stroke-width="48" 
            stroke-dasharray="659.73 659.73" 
            stroke-dashoffset="0" transform="rotate(-90 0 0)"/>
    
    <!-- Chinese 0.6% - Orange (angle: 351° to ~353.2°) -->
    <circle r="105" fill="none" stroke="#FF8C42" stroke-width="48" 
            stroke-dasharray="4.0 659.73" 
            stroke-dashoffset="-655.73" transform="rotate(-90 0 0)"/>
    
    <!-- Vietnamese 0.4% -->
    <circle r="105" fill="none" stroke="#2A9D6E" stroke-width="48" 
            stroke-dasharray="2.64 659.73" 
            stroke-dashoffset="-651.73" transform="rotate(-90 0 0)"/>
    
    <!-- South Korean 0.3% -->
    <circle r="105" fill="none" stroke="#3B7CC4" stroke-width="48" 
            stroke-dasharray="1.98 659.73" 
            stroke-dashoffset="-649.1" transform="rotate(-90 0 0)"/>
    
    <!-- Other 1.2% -->
    <circle r="105" fill="none" stroke="#8A8A8A" stroke-width="48" 
            stroke-dasharray="7.92 659.73" 
            stroke-dashoffset="-647.1" transform="rotate(-90 0 0)"/>
    
    <!-- Center circle -->
    <circle r="68" fill="#FFFFFF"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="13" fill="#555">BY</text>
    <text x="0" y="26" text-anchor="middle" font-family="Arial Black" font-size="19" fill="#1A3C5E">ETHNICITY</text>
  </g>

  <!-- Legend for Donut -->
  <g font-family="Arial" font-size="13.5">
    <rect x="410" y="1480" width="18" height="18" fill="#C8102E" rx="2"/>
    <text x="440" y="1494" fill="#222">Japanese — 97.5%</text>
    
    <rect x="410" y="1510" width="18" height="18" fill="#FF8C42" rx="2"/>
    <text x="440" y="1524" fill="#222">Chinese — 0.6%</text>
    
    <rect x="410" y="1540" width="18" height="18" fill="#2A9D6E" rx="2"/>
    <text x="440" y="1554" fill="#222">Vietnamese — 0.4%</text>
    
    <rect x="410" y="1570" width="18" height="18" fill="#3B7CC4" rx="2"/>
    <text x="440" y="1584" fill="#222">South Korean — 0.3%</text>
    
    <rect x="410" y="1600" width="18" height="18" fill="#8A8A8A" rx="2"/>
    <text x="440" y="1614" fill="#222">Other — 1.2%</text>
  </g>

  <!-- RIGHT SIDE: TOP DESTINATIONS -->
  <rect x="620" y="1370" width="510" height="390" rx="22" fill="url(#cardGradient)" filter="url(#shadow)"/>
  
  <text x="670" y="1415" font-family="Arial Black, sans-serif" font-size="25" fill="#1A3C5E">MUST-VISIT DESTINATIONS</text>
  
  <g font-family="Arial, sans-serif" font-size="14.5" fill="#222">
    <text x="670" y="1470" font-weight="700" fill="#C8102E">• Tokyo</text>
    <text x="690" y="1492">Vibrant capital blending futuristic skyscrapers with historic temples</text>
    
    <text x="670" y="1530" font-weight="700" fill="#C8102E">• Kyoto</text>
    <text x="690" y="1552">Ancient capital with thousands of temples, shrines and traditional gardens</text>
    
    <text x="670" y="1590" font-weight="700" fill="#C8102E">• Osaka</text>
    <text x="690" y="1612">Food capital known for street food, nightlife and friendly locals</text>
    
    <text x="670" y="1650" font-weight="700" fill="#C8102E">• Hiroshima &amp; Miyajima</text>
    <text x="690" y="1672">Peace memorial and the iconic floating torii gate</text>
    
    <text x="670" y="1710" font-weight="700" fill="#C8102E">• Mount Fuji &amp; Hakone</text>
    <text x="690" y="1732">Japan’s sacred mountain and scenic hot springs</text>
    
    <text x="670" y="1770" font-weight="700" fill="#C8102E">• Hokkaido</text>
    <text x="690" y="1792">Rugged nature, lavender fields, and world-class skiing</text>
  </g>

  <!-- Footer -->
  <text x="600" y="1770" text-anchor="middle" font-family="Arial" font-size="11.5" fill="#666">
    Data sources: World Bank, IMF, Statistics Bureau of Japan (2024) • Created as pure SVG
  </text>

</svg>