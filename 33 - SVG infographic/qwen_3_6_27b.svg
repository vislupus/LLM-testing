<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F9FC"/>
      <stop offset="100%" stop-color="#EBEEF5"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#457B9D"/>
      <stop offset="100%" stop-color="#1D3557"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#C1121F"/>
    </linearGradient>
    <path id="waveTop" d="M0,80 Q300,40 600,80 T1200,80 V1800 H0 Z" fill="#FFFFFF" opacity="0.4"/>
    <path id="waveMid" d="M0,1020 Q300,980 600,1020 T1200,1020 V1800 H0 Z" fill="#FFFFFF" opacity="0.3"/>
    <clipPath id="mapClip">
      <rect x="60" y="150" width="580" height="320" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGrad)"/>
  <use href="#waveTop"/>
  <use href="#waveMid"/>
  
  <!-- Decorative subtle grid/dots -->
  <g fill="#1D3557" opacity="0.04">
    <circle cx="100" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="400" cy="200" r="2"/>
    <circle cx="100" cy="300" r="2"/><circle cx="200" cy="300" r="2"/><circle cx="300" cy="300" r="2"/><circle cx="400" cy="300" r="2"/>
    <circle cx="800" cy="600" r="2"/><circle cx="900" cy="600" r="2"/><circle cx="1000" cy="600" r="2"/><circle cx="1100" cy="600" r="2"/>
    <circle cx="800" cy="1100" r="2"/><circle cx="900" cy="1100" r="2"/><circle cx="1000" cy="1100" r="2"/><circle cx="1100" cy="1100" r="2"/>
  </g>

  <!-- Header -->
  <text x="60" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#1D3557" letter-spacing="-0.5">Japan at a glance</text>
  <rect x="60" y="95" width="72" height="6" rx="3" fill="url(#accentGrad)"/>
  <text x="60" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#4A4A6A">A comprehensive overview of geography, economy, and culture</text>

  <!-- Row 1: Map Card -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="150" width="580" height="320" rx="16" fill="#FFFFFF"/>
    <text x="90" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1D3557">Archipelago &amp; Major Cities</text>
    
    <!-- Stylized Japan Map -->
    <g clip-path="url(#mapClip)" fill="#A8DADC" stroke="#1D3557" stroke-width="2" stroke-linejoin="round">
      <!-- Hokkaido -->
      <path d="M420,180 C440,165 470,170 480,190 C490,210 475,230 455,225 C435,220 415,205 420,180 Z"/>
      <!-- Honshu -->
      <path d="M470,240 C500,225 520,255 510,285 C500,315 470,345 460,375 C450,405 420,435 400,455 C380,475 350,505 330,525 C310,545 280,575 260,595 C240,615 210,645 190,665 C170,685 140,715 120,735 C100,755 80,785 70,805 L85,815 C115,795 145,765 175,735 C205,705 235,675 265,645 C295,615 325,585 355,555 C385,525 415,495 445,465 C475,435 495,395 505,355 C515,315 525,275 495,255 C480,245 475,240 470,240 Z"/>
      <!-- Shikoku -->
      <path d="M280,580 C310,570 330,590 320,610 C310,630 280,640 260,620 C250,600 260,590 280,580 Z"/>
      <!-- Kyushu -->
      <path d="M160,680 C190,670 210,690 200,720 C190,750 160,760 140,740 C130,720 140,700 160,680 Z"/>
    </g>

    <!-- City Markers -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1D3557">
      <!-- Tokyo -->
      <circle cx="465" cy="365" r="6" fill="#E63946" stroke="#FFF" stroke-width="2"/>
      <text x="482" y="370">Tokyo</text>
      
      <!-- Yokohama -->
      <circle cx="455" cy="378" r="5" fill="#457B9D" stroke="#FFF" stroke-width="2"/>
      <text x="472" y="383">Yokohama</text>
      
      <!-- Nagoya -->
      <circle cx="400" cy="435" r="5" fill="#457B9D" stroke="#FFF" stroke-width="2"/>
      <text x="417" y="440">Nagoya</text>
      
      <!-- Osaka -->
      <circle cx="340" cy="495" r="5" fill="#457B9D" stroke="#FFF" stroke-width="2"/>
      <text x="357" y="500">Osaka</text>
    </g>
  </g>

  <!-- Row 1: Info Card -->
  <g filter="url(#cardShadow)">
    <rect x="680" y="150" width="460" height="320" rx="16" fill="#FFFFFF"/>
    <text x="720" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1D3557">An Island Nation of Contrasts</text>
    <rect x="720" y="210" width="40" height="4" rx="2" fill="#E63946"/>
    <text x="720" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#4A4A6A">
      <tspan x="720" dy="0">Japan is an archipelago of over 6,800 islands in East Asia,</tspan>
      <tspan x="720" dy="24">renowned for its unique blend of ancient traditions and</tspan>
      <tspan x="720" dy="24">cutting-edge technology. With a population of roughly</tspan>
      <tspan x="720" dy="24">125 million, it is the world’s third-largest economy and</tspan>
      <tspan x="720" dy="24">a global leader in manufacturing, robotics, and innovation.</tspan>
      <tspan x="720" dy="24">From bustling megacities to serene rural landscapes, Japan</tspan>
      <tspan x="720" dy="24">offers a culturally rich and geographically diverse experience.</tspan>
    </text>
  </g>

  <!-- Full-width Paragraph -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="500" width="1080" height="100" rx="16" fill="#FFFFFF"/>
    <text x="100" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#4A4A6A" font-weight="500">
      <tspan x="100" dy="0">Strategically positioned in the Pacific Ring of Fire, Japan experiences four distinct seasons, shaping its festivals, agriculture, and aesthetic sensibilities.</tspan>
      <tspan x="100" dy="28">The country’s complex logistics and high-speed rail network connect its mountainous terrain, facilitating a highly efficient society that balances rapid urbanization with deep respect for nature and craftsmanship.</tspan>
    </text>
  </g>

  <!-- Row 2: Economic Text -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="640" width="480" height="360" rx="16" fill="#FFFFFF"/>
    <text x="100" y="685" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1D3557">Economic Overview</text>
    <rect x="100" y="700" width="40" height="4" rx="2" fill="#457B9D"/>
    <text x="100" y="735" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#4A4A6A">
      <tspan x="100" dy="0">Japan’s nominal GDP has experienced fluctuations over the</tspan>
      <tspan x="100" dy="24">past decade, influenced by global market shifts, currency</tspan>
      <tspan x="100" dy="24">valuation, and domestic policy adjustments. After peaking</tspan>
      <tspan x="100" dy="24">around 2019, economic indicators have stabilized, reflecting</tspan>
      <tspan x="100" dy="24">structural reforms and adaptive fiscal strategies in response</tspan>
      <tspan x="100" dy="24">to demographic changes and international trade dynamics.</tspan>
      <tspan x="100" dy="48">The Bank of Japan continues to implement yield curve</tspan>
      <tspan x="100" dy="24">control and qualitative easing to support sustainable growth</tspan>
      <tspan x="100" dy="24">amid an aging population and evolving global supply chains.</tspan>
    </text>
  </g>

  <!-- Row 2: GDP Bar Chart -->
  <g filter="url(#cardShadow)">
    <rect x="580" y="640" width="560" height="360" rx="16" fill="#FFFFFF"/>
    <text x="620" y="685" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1D3557">Nominal GDP (2015–2024)</text>
    <text x="620" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6C757D">in current US$ trillions</text>

    <!-- Chart Area -->
    <g transform="translate(610, 730)">
      <!-- Grid Lines -->
      <g stroke="#E9ECEF" stroke-width="1" stroke-dasharray="4,4">
        <line x1="0" y1="0" x2="520" y2="0"/>
        <line x1="0" y1="43.6" x2="520" y2="43.6"/>
        <line x1="0" y1="87.3" x2="520" y2="87.3"/>
        <line x1="0" y1="131" x2="520" y2="131"/>
        <line x1="0" y1="174.5" x2="520" y2="174.5"/>
        <line x1="0" y1="218.2" x2="520" y2="218.2"/>
        <line x1="0" y1="240" x2="520" y2="240"/>
      </g>

      <!-- Y-Axis Labels -->
      <g font-family="system-ui, sans-serif" font-size="11" fill="#6C757D" text-anchor="end">
        <text x="-12" y="4">5.5</text>
        <text x="-12" y="47.6">4.5</text>
        <text x="-12" y="91.3">3.5</text>
        <text x="-12" y="135">2.5</text>
        <text x="-12" y="178.5">1.5</text>
        <text x="-12" y="222.2">0.5</text>
        <text x="-12" y="244">0.0</text>
      </g>

      <!-- Bars -->
      <g fill="url(#barGrad)">
        <rect x="11" y="46.3" width="30" height="193.7" rx="4"/>
        <rect x="63" y="21.9" width="30" height="218.1" rx="4"/>
        <rect x="115" y="24.9" width="30" height="215.1" rx="4"/>
        <rect x="167" y="20.1" width="30" height="219.9" rx="4"/>
        <rect x="219" y="16.6" width="30" height="223.4" rx="4"/>
        <rect x="271" y="19.7" width="30" height="220.3" rx="4"/>
        <rect x="323" y="20.1" width="30" height="219.9" rx="4"/>
        <rect x="375" y="54.1" width="30" height="185.9" rx="4"/>
        <rect x="427" y="56.3" width="30" height="183.7" rx="4"/>
        <rect x="479" y="64.2" width="30" height="175.8" rx="4"/>
      </g>

      <!-- Value Labels -->
      <g font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1D3557" text-anchor="middle">
        <text x="26" y="40">4.44</text>
        <text x="78" y="15">5.00</text>
        <text x="130" y="18">4.93</text>
        <text x="182" y="14">5.04</text>
        <text x="234" y="10">5.12</text>
        <text x="286" y="13">5.05</text>
        <text x="338" y="14">5.04</text>
        <text x="390" y="48">4.26</text>
        <text x="442" y="50">4.21</text>
        <text x="494" y="58">4.03</text>
      </g>

      <!-- X-Axis Labels -->
      <g font-family="system-ui, sans-serif" font-size="12" fill="#4A4A6A" text-anchor="middle">
        <text x="26" y="260">2015</text>
        <text x="78" y="260">2016</text>
        <text x="130" y="260">2017</text>
        <text x="182" y="260">2018</text>
        <text x="234" y="260">2019</text>
        <text x="286" y="260">2020</text>
        <text x="338" y="260">2021</text>
        <text x="390" y="260">2022</text>
        <text x="442" y="260">2023</text>
        <text x="494" y="260">2024</text>
      </g>
    </g>
  </g>

  <!-- Row 3: Donut Chart Card -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="1040" width="480" height="500" rx="16" fill="#FFFFFF"/>
    <text x="100" y="1085" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1D3557">Population Composition</text>
    <text x="100" y="1105" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6C757D">by nationality / ethnic grouping</text>

    <!-- Donut Chart -->
    <g transform="translate(300, 1330)">
      <!-- Japanese 97.5% -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#E63946" stroke-width="50" stroke-dasharray="643.24 16.49" stroke-dashoffset="0"/>
      <!-- Chinese 0.6% -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#457B9D" stroke-width="50" stroke-dasharray="3.96 662.77" stroke-dashoffset="-643.24"/>
      <!-- Vietnamese 0.4% -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#A8DADC" stroke-width="50" stroke-dasharray="2.64 664.09" stroke-dashoffset="-647.20"/>
      <!-- South Korean 0.3% -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#1D3557" stroke-width="50" stroke-dasharray="1.98 665.75" stroke-dashoffset="-649.84"/>
      <!-- Other 1.2% -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#F1FAEE" stroke-width="50" stroke-dasharray="7.92 659.81" stroke-dashoffset="-651.82"/>
      
      <!-- Center Label -->
      <text x="0" y="-8" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#1D3557" text-anchor="middle">125M</text>
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#6C757D" text-anchor="middle">Total Pop.</text>
    </g>

    <!-- Legend -->
    <g transform="translate(140, 1520)" font-family="system-ui, sans-serif" font-size="13" fill="#4A4A6A">
      <rect x="0" y="-8" width="12" height="12" rx="3" fill="#E63946"/>
      <text x="20" y="3">Japanese 97.5%</text>
      
      <rect x="0" y="20" width="12" height="12" rx="3" fill="#457B9D"/>
      <text x="20" y="31">Chinese 0.6%</text>
      
      <rect x="0" y="48" width="12" height="12" rx="3" fill="#A8DADC"/>
      <text x="20" y="59">Vietnamese 0.4%</text>
      
      <rect x="0" y="76" width="12" height="12" rx="3" fill="#1D3557"/>
      <text x="20" y="87">South Korean 0.3%</text>
      
      <rect x="0" y="104" width="12" height="12" rx="3" fill="#F1FAEE" stroke="#CBD5E1" stroke-width="1"/>
      <text x="20" y="115">Other 1.2%</text>
    </g>
  </g>

  <!-- Row 3: Tourism Text Card -->
  <g filter="url(#cardShadow)">
    <rect x="580" y="1040" width="560" height="500" rx="16" fill="#FFFFFF"/>
    <text x="620" y="1085" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1D3557">Iconic Destinations</text>
    <rect x="620" y="1100" width="40" height="4" rx="2" fill="#E63946"/>

    <g font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A4A6A">
      <!-- Tokyo -->
      <circle cx="620" cy="1145" r="5" fill="#E63946"/>
      <text x="640" y="1150" font-weight="700" fill="#1D3557">Tokyo</text>
      <text x="640" y="1168">Cultural heart, neon districts, ancient temples</text>

      <!-- Kyoto -->
      <circle cx="620" cy="1200" r="5" fill="#457B9D"/>
      <text x="640" y="1205" font-weight="700" fill="#1D3557">Kyoto</text>
      <text x="640" y="1223">Historic capital, bamboo groves, geisha districts</text>

      <!-- Osaka -->
      <circle cx="620" cy="1255" r="5" fill="#A8DADC"/>
      <text x="640" y="1260" font-weight="700" fill="#1D3557">Osaka</text>
      <text x="640" y="1278">Street food capital, vibrant nightlife, commerce hub</text>

      <!-- Hiroshima/Miyajima -->
      <circle cx="620" cy="1310" r="5" fill="#1D3557"/>
      <text x="640" y="1315" font-weight="700" fill="#1D3557">Hiroshima / Miyajima</text>
      <text x="640" y="1333">Peace memorial, floating torii gate, history</text>

      <!-- Mt Fuji/Hakone -->
      <circle cx="620" cy="1365" r="5" fill="#E63946"/>
      <text x="640" y="1370" font-weight="700" fill="#1D3557">Mount Fuji / Hakone</text>
      <text x="640" y="1388">Sacred peak, hot springs, lakeside views</text>

      <!-- Hokkaido -->
      <circle cx="620" cy="1420" r="5" fill="#457B9D"/>
      <text x="640" y="1425" font-weight="700" fill="#1D3557">Hokkaido</text>
      <text x="640" y="1443">Alpine terrain, skiing, lavender fields, wildlife</text>
    </g>
  </g>

  <!-- Footer / Source Note -->
  <rect x="60" y="1680" width="1080" height="1" fill="#E9ECEF"/>
  <text x="60" y="1710" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6C757D">
    <tspan font-weight="600">Source:</tspan> World Bank, CIA World Factbook, UN Population Division. | Data reflects nominal GDP and demographic estimates.
  </text>
  <text x="1140" y="1710" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6C757D" text-anchor="end">Designed for informational purposes.</text>
</svg>