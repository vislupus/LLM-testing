<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Roboto:wght@300;400;700&amp;display=swap');
      text { font-family: 'Roboto', sans-serif; }
      .title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 80px; fill: #bc002d; }
      .section-title { font-size: 24px; font-weight: 700; fill: #333; text-transform: uppercase; letter-spacing: 2px; }
      .label { font-size: 14px; fill: #666; }
      .data-label { font-size: 16px; font-weight: 700; fill: #333; text-anchor: middle; }
      .big-number { font-size: 36px; font-weight: 700; fill: #bc002d; }
      .source { font-size: 12px; fill: #999; font-style: italic; }
      .card-bg { fill: #ffffff; filter: url(#shadow); rx: 15; }
      .wave-bg { fill: #f0f4f8; }
    </style>

    <!-- Gradients & Filters -->
    <linearGradient id="gradBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bc002d" />
      <stop offset="100%" stop-color="#ff4d4d" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="#fcfcfc" />
  <path d="M0,1800 C300,1600 600,1850 1200,1700 V1800 H0 Z" class="wave-bg" />
  <path d="M0,0 C400,200 800,-100 1200,100 V0 H0 Z" class="wave-bg" opacity="0.5" />

  <!-- Header -->
  <g transform="translate(100, 100)">
    <!-- Rising Sun Motif -->
    <circle cx="60" cy="-20" r="120" fill="#bc002d" opacity="0.1" />
    <circle cx="60" cy="-20" r="60" fill="#bc002d" />
    
    <text x="150" y="50" class="title">Japan at a glance</text>
    <text x="155" y="100" font-size="20" fill="#666">An infographic overview of the Land of the Rising Sun</text>
  </g>

  <!-- ROW 1: Map & Intro -->
  <g transform="translate(80, 250)">
    <!-- Card 1: Map -->
    <rect x="0" y="0" width="500" height="400" class="card-bg" />
    
    <!-- Stylized Map of Japan -->
    <g transform="translate(250, 200) scale(1.2)">
       <!-- Rough approx of islands -->
       <!-- Hokkaido -->
       <path d="M-30,-120 Q0,-140 30,-120 Q40,-100 20,-90 L-10,-90 Z" fill="#ddd" stroke="#999" stroke-width="2"/>
       <!-- Honshu -->
       <path d="M-40,-80 Q-60,-50 -50,0 Q-55,50 -40,100 Q-20,120 10,110 Q40,100 50,50 Q60,0 30,-40 Q20,-70 -10,-80 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
       <!-- Shikoku/Kyushu -->
       <path d="M-20,100 Q0,120 20,110 Q50,120 40,80 Q20,60 0,80 Z" fill="#ddd" stroke="#999" stroke-width="2"/>
       
       <!-- Cities -->
       <!-- Tokyo -->
       <circle cx="10" cy="-20" r="5" fill="#bc002d" />
       <text x="15" y="-15" font-size="14" font-weight="bold" fill="#333">Tokyo</text>
       
       <!-- Yokohama -->
       <circle cx="15" cy="-10" r="4" fill="#bc002d" />
       <text x="20" y="-5" font-size="12" fill="#555">Yokohama</text>

       <!-- Nagoya -->
       <circle cx="0" cy="40" r="4" fill="#bc002d" />
       <text x="5" y="45" font-size="12" font-weight="bold" fill="#333">Nagoya</text>

       <!-- Osaka -->
       <circle cx="-10" cy="60" r="4" fill="#bc002d" />
       <text x="-10" y="80" font-size="12" font-weight="bold" fill="#333">Osaka</text>
    </g>
    <text x="20" y="40" class="section-title" fill="#bc002d">Location</text>

    <!-- Card 2: Intro Text -->
    <rect x="540" y="0" width="560" height="400" class="card-bg" />
    <text x="570" y="40" class="section-title" fill="#bc002d">Overview</text>
    <text x="570" y="80" font-size="18" fill="#444">
      <tspan x="570" dy="0">Japan is an island country in East Asia, located in the Pacific</tspan>
      <tspan x="570" dy="25">Ocean. It lies off the coast of mainland East Asia and stretches</tspan>
      <tspan x="570" dy="25">from the Sea of Okhotsk in the north to the East China Sea and</tspan>
      <tspan x="570" dy="25">the Philippine Sea in the south.</tspan>
    </text>
    <text x="570" y="200" font-size="16" fill="#666">
      <tspan x="570" dy="0">The capital is Tokyo. Japan has the world's</tspan>
      <tspan x="570" dy="20">third-largest economy by nominal GDP.</tspan>
    </text>
    <g transform="translate(570, 280)">
       <rect width="120" height="2" fill="#bc002d" />
       <text y="20" font-size="12" fill="#999">Key Fact</text>
    </g>
  </g>

  <!-- ROW 2: Full Width Paragraph -->
  <g transform="translate(80, 700)">
    <rect x="0" y="0" width="1040" height="180" class="card-bg" />
    <text x="40" y="40" class="section-title" fill="#bc002d">Culture &amp; History</text>
    <text x="40" y="80" font-size="16" fill="#444" width="960">
      <tspan x="40" dy="0">Japan's culture stretches back millennia, yet has been uniquely shaped by</tspan>
      <tspan x="40" dy="22">centuries of isolationism followed by rapid modernization. From the ancient</tspan>
      <tspan x="40" dy="22">rituals of Shinto and the refined aesthetics of Tea Ceremony to the neon-</tspan>
      <tspan x="40" dy="22">lit futuristic streets of Akihabara, Japan offers a striking contrast of tradition</tspan>
      <tspan x="40" dy="22">and innovation. Its culinary heritage, including Sushi and Sake, is recognized</tspan>
      <tspan x="40" dy="22">worldwide for its quality and artistry.</tspan>
    </text>
  </g>

  <!-- ROW 3: Text & GDP Chart -->
  <g transform="translate(80, 920)">
    <!-- Text Left -->
    <rect x="0" y="0" width="300" height="350" class="card-bg" />
    <text x="40" y="40" class="section-title" fill="#bc002d">Economy</text>
    <text x="40" y="80" font-size="16" fill="#555">
      <tspan x="40" dy="0">Japan's economy saw massive growth</tspan>
      <tspan x="40" dy="20">in the late 20th century but has faced</tspan>
      <tspan x="40" dy="20">challenges with stagnation in recent years.</tspan>
      <tspan x="40" dy="40">The chart shows the nation's Nominal</tspan>
      <tspan x="40" dy="20">GDP in Trillions of USD (2015-2024).</tspan>
    </text>
    <g transform="translate(40, 200)">
       <text class="big-number">$4.2T</text>
       <text y="40" font-size="14" fill="#888">Current GDP (2023)</text>
    </g>

    <!-- Chart Right -->
    <rect x="340" y="0" width="700" height="350" class="card-bg" />
    <text x="370" y="40" class="section-title" fill="#bc002d">Nominal GDP (Trillion USD)</text>
    
    <!-- Chart Area -->
    <g transform="translate(380, 80)">
       <!-- Y Axis -->
       <line x1="0" y1="0" x2="0" y2="250" stroke="#ddd" stroke-width="1" />
       <line x1="0" y1="250" x2="620" y2="250" stroke="#ddd" stroke-width="1" />
       
       <!-- Bars -->
       <!-- 2015: 4.44 (Height: 4.44/6 * 250 = 185) -->
       <rect x="10" y="250-185" width="40" height="185" fill="url(#gradBar)" />
       <text x="30" y="270" font-size="12" fill="#666">2015</text>
       <text x="30" y="250-190" font-size="11" fill="#333" text-anchor="middle">4.44</text>

       <!-- 2016: 5.00 (208) -->
       <rect x="70" y="250-208" width="40" height="208" fill="url(#gradBar)" />
       <text x="90" y="270" font-size="12" fill="#666">2016</text>
       <text x="90" y="250-213" font-size="11" fill="#333" text-anchor="middle">5.00</text>

       <!-- 2017: 4.93 (205) -->
       <rect x="130" y="250-205" width="40" height="205" fill="url(#gradBar)" />
       <text x="150" y="270" font-size="12" fill="#666">2017</text>
       <text x="150" y="250-210" font-size="11" fill="#333" text-anchor="middle">4.93</text>

       <!-- 2018: 5.04 (210) -->
       <rect x="190" y="250-210" width="40" height="210" fill="url(#gradBar)" />
       <text x="210" y="270" font-size="12" fill="#666">2018</text>
       <text x="210" y="250-215" font-size="11" fill="#333" text-anchor="middle">5.04</text>

       <!-- 2019: 5.12 (213) -->
       <rect x="250" y="250-213" width="40" height="213" fill="url(#gradBar)" />
       <text x="270" y="270" font-size="12" fill="#666">2019</text>
       <text x="270" y="250-218" font-size="11" fill="#333" text-anchor="middle">5.12</text>

       <!-- 2020: 5.05 (210) -->
       <rect x="310" y="250-210" width="40" height="210" fill="url(#gradBar)" />
       <text x="330" y="270" font-size="12" fill="#666">2020</text>
       <text x="330" y="250-215" font-size="11" fill="#333" text-anchor="middle">5.05</text>

       <!-- 2021: 5.04 (210) -->
       <rect x="370" y="250-210" width="40" height="210" fill="url(#gradBar)" />
       <text x="390" y="270" font-size="12" fill="#666">2021</text>
       <text x="390" y="250-215" font-size="11" fill="#333" text-anchor="middle">5.04</text>

       <!-- 2022: 4.26 (177) -->
       <rect x="430" y="250-177" width="40" height="177" fill="url(#gradBar)" />
       <text x="450" y="270" font-size="12" fill="#666">2022</text>
       <text x="450" y="250-182" font-size="11" fill="#333" text-anchor="middle">4.26</text>

       <!-- 2023: 4.21 (175) -->
       <rect x="490" y="250-175" width="40" height="175" fill="url(#gradBar)" />
       <text x="510" y="270" font-size="12" fill="#666">2023</text>
       <text x="510" y="250-180" font-size="11" fill="#333" text-anchor="middle">4.21</text>

       <!-- 2024: 4.03 (167) -->
       <rect x="550" y="250-167" width="40" height="167" fill="url(#gradBar)" />
       <text x="570" y="270" font-size="12" fill="#666">2024</text>
       <text x="570" y="250-172" font-size="11" fill="#333" text-anchor="middle">4.03</text>

       <!-- Grid lines -->
       <line x1="0" y1="166" x2="620" y2="166" stroke="#eee" stroke-width="1" stroke-dasharray="4"/>
       <line x1="0" y1="83" x2="620" y2="83" stroke="#eee" stroke-width="1" stroke-dasharray="4"/>
       <text x="-10" y="166" font-size="10" fill="#aaa" text-anchor="end">3T</text>
       <text x="-10" y="83" font-size="10" fill="#aaa" text-anchor="end">6T</text>
    </g>
  </g>

  <!-- ROW 4: Donut Chart & Travel -->
  <g transform="translate(80, 1310)">
    <!-- Donut Left -->
    <rect x="0" y="0" width="480" height="350" class="card-bg" />
    <text x="40" y="40" class="section-title" fill="#bc002d">Population Composition</text>
    
    <!-- Donut Chart Logic: Radius 80, Circumference ~502 -->
    <g transform="translate(240, 190)">
        <!-- Japanese 97.5% (Dash: 0.975 * 502 = 489) -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#bc002d" stroke-width="40" stroke-dasharray="489 502" transform="rotate(-90)"/>
        
        <!-- Chinese 0.6% (Dash: 0.006 * 502 = 3) - Needs offset to rotate correctly visually, simplified stack -->
        <!-- Stack offsets manually calculated for visual clarity -->
        
        <!-- Re-drawing for proper stacking segments -->
        <!-- Total 100%. Start at top. -->
        
        <!-- Japanese (97.5) -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#d63031" stroke-width="40" stroke-dasharray="489.4 502.6" />
        
        <!-- Chinese (0.6) -> 3.0 -> offset 489.4 -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#fdcb6e" stroke-width="40" stroke-dasharray="3.0 502.6" stroke-dashoffset="-489.4" />
        
        <!-- Vietnamese (0.4) -> 2.0 -> offset 492.4 -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#00b894" stroke-width="40" stroke-dasharray="2.0 502.6" stroke-dashoffset="-492.4" />
        
        <!-- South Korean (0.3) -> 1.5 -> offset 494.4 -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#0984e3" stroke-width="40" stroke-dasharray="1.5 502.6" stroke-dashoffset="-494.4" />
        
        <!-- Other (1.2) -> 6.0 -> offset 495.9 -->
        <circle r="80" cx="0" cy="0" fill="none" stroke="#636e72" stroke-width="40" stroke-dasharray="6.0 502.6" stroke-dashoffset="-495.9" />
        
        <!-- Center Text -->
        <text x="0" y="5" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">100%</text>
    </g>
    
    <!-- Legend -->
    <g transform="translate(40, 280)">
        <circle r="5" fill="#d63031" /> <text x="15" y="5" font-size="12">Japanese (97.5%)</text>
        <circle r="5" fill="#fdcb6e" cx="120" /> <text x="135" y="5" font-size="12">Chinese (0.6%)</text>
        <circle r="5" fill="#00b894" cx="220" /> <text x="235" y="5" font-size="12">Vietnamese (0.4%)</text>
        <circle r="5" fill="#0984e3" cx="340" /> <text x="355" y="5" font-size="12">Korean (0.3%)</text>
        <circle r="5" fill="#636e72" cx="430" /> <text x="445" y="5" font-size="12">Other (1.2%)</text>
    </g>

    <!-- Travel Right -->
    <rect x="520" y="0" width="520" height="350" class="card-bg" />
    <text x="550" y="40" class="section-title" fill="#bc002d">What to Visit</text>
    
    <g transform="translate(550, 80)">
        <!-- List items with simple icon graphics -->
        
        <!-- Tokyo -->
        <g transform="translate(0, 0)">
            <circle r="15" fill="#ff7675" />
            <text x="25" y="5" font-weight="bold" font-size="16">Tokyo</text>
            <text x="25" y="20" font-size="12" fill="#777">Modern metropolis &amp; culture</text>
        </g>
        
        <!-- Kyoto -->
        <g transform="translate(0, 60)">
            <circle r="15" fill="#fab1a0" />
            <text x="25" y="5" font-weight="bold" font-size="16">Kyoto</text>
            <text x="25" y="20" font-size="12" fill="#777">Ancient temples &amp; gardens</text>
        </g>
        
        <!-- Osaka -->
        <g transform="translate(0, 120)">
            <circle r="15" fill="#ffeaa7" />
            <text x="25" y="5" font-weight="bold" font-size="16">Osaka</text>
            <text x="25" y="20" font-size="12" fill="#777">Food &amp; Universal Studios</text>
        </g>

        <!-- Hiroshima -->
        <g transform="translate(0, 180)">
            <circle r="15" fill="#55efc4" />
            <text x="25" y="5" font-weight="bold" font-size="16">Hiroshima / Miyajima</text>
            <text x="25" y="20" font-size="12" fill="#777">History &amp; Itsukushima Shrine</text>
        </g>

        <!-- Fuji -->
        <g transform="translate(260, 0)">
            <circle r="15" fill="#74b9ff" />
            <text x="25" y="5" font-weight="bold" font-size="16">Mount Fuji</text>
            <text x="25" y="20" font-size="12" fill="#777">Iconic volcano &amp; Hakone</text>
        </g>

         <!-- Hokkaido -->
        <g transform="translate(260, 60)">
            <circle r="15" fill="#a29bfe" />
            <text x="25" y="5" font-weight="bold" font-size="16">Hokkaido</text>
            <text x="25" y="20" font-size="12" fill="#777">Nature &amp; Snow festivals</text>
        </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(100, 1760)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#eee" />
    <text x="0" y="20" class="source">Sources: World Bank, Japan Statistics Bureau, Japan National Tourism Organization.</text>
    <text x="1000" y="20" class="source" text-anchor="end">Generated with SVG</text>
  </g>

</svg>