<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1800">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#e4e8f0"/>
    </linearGradient>
    
    <!-- Donut chart gradient -->
    <style type="text/css">
      .popDonut { 
        fill: conic-gradient(from 0deg, #3498db 0%, #3498db 97.5%, #e74c3c 97.5%, #e74c3c 98.1%, #f1c40f 98.1%, #f1c40f 98.5%, #9b59b6 98.5%, #9b59b6 98.8%, #2c3e5d 98.8%, #2c3e5d 100%); 
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGrad)"/>
  
  <!-- Subtle bottom wave -->
  <path d="M0,1700 C300,1750 900,1720 1200,1760 L1200,1800 L0,1800 Z" fill="#d5dbdb"/>
  
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#2c3e50">
    Japan at a glance
  </text>
  
  /* -------------------------------------------------
     FIRST ROW: Map (left) + Explanatory text (right)
  ------------------------------------------------- -->
  <g transform="translate(0, 80)">
    <!-- Stylized map of Japan -->
    <g id="japanMap">
      <!-- Map outline (simplified) -->
      <path d="M100,200 C200,100 300,100 400,200 C500,300 550,400 500,500 C450,550 400,500 350,450 C300,400 200,350 150,300 C100,250 100,200 Z" fill="#a8d5e6" stroke="#156289" stroke-width="2"/>
      <!-- Tokyo -->
      <circle cx="350" cy="250" r="6" fill="#e74c3c"/>
      <text x="350" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50">Tokyo</text>
      <!-- Yokohama -->
      <circle cx="450" cy="200" r="6" fill="#e74c3c"/>
      <text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50">Yokohama</text>
      <!-- Osaka -->
      <circle cx="550" cy="400" r="6" fill="#e74c3c"/>
      <text x="550" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50">Osaka</text>
      <!-- Nagoya -->
      <circle cx="400" cy="480" r="6" fill="#e74c3c"/>
      <text x="400" y="460" text-anchor="middle" font-family="Arial" font-size="11" fill="#2c3e50">Nagoya</text>
    </g>
    
    <!-- Explanatory text right of map -->
    <g transform="translate(500, 0)">
      <text x="0" y="25" font-family="Arial" font-size="15" fill="#34495e">Japan is an island nation in East Asia, comprising four main islands (Honshu, Hokkaido, Kyushu, Shikoku) and numerous smaller islands. It blends ancient tradition with cutting‑edge technology, offering rich cultural heritage, scenic landscapes, and a major global economy.</text>
    </g>
  </g>
  
  /* -------------------------------------------------
     FULL‑WIDTH PARAGRAPH
  ------------------------------------------------- -->
  <g transform="translate(0, 440)">
    <text x="600" y="20" text-anchor="middle" font-family="Arial" font-size="14" fill="#5a6c7d" line-height="1.6">
      Located in the Pacific Ocean, Japan’s four main islands extend from the snowy north of Hokkaido to the subtropical south of Okinawa. The country is known for its cherry blossoms, hot springs, efficient rail network, and a cuisine celebrated worldwide. Urban areas pulse with neon and history, while rural regions preserve centuries‑old traditions and natural beauty.
    </text>
  </g>
  
  /* -------------------------------------------------
     SECOND ROW: Text (left) + Bar chart (right)
  ------------------------------------------------- -->
  <g transform="translate(0, 530)">
    <!-- Left text: economy overview -->
    <g transform="translate(50, 0)">
      <text x="0" y="20" font-family="Arial" font-size="14" fill="#34495e">
        Japan’s nominal GDP (current US$ trillions) has fluctuated over the last decade, reflecting global economic shifts, currency changes, and domestic growth patterns.
      </text>
    </g>
    
    <!-- Bar chart: Nominal GDP 2015‑2024 -->
    <g transform="translate(720, 0)">
      <g clip-path="url(#clipBar)">
        <rect x="700" y="550" width="470" height="300" fill="white" rx="3" ry="3"/>
      </g>
      <clipPath id="clipBar">
        <rect x="700" y="550" width="470" height="300"/>
      </clipPath>
      
      <!-- Axes and labels -->
      <!-- X-axis line -->
      <line x1="700" y1="850" x2="1170" y2="850" stroke="#bdc3c7" stroke-width="1"/>
      <!-- Y-axis line -->
      <line x1="700" y1="550" x2="700" y2="850" stroke="#bdc3c7" stroke-width="1"/>
      
      <!-- X-axis year labels -->
      <g font-family="Arial" font-size="10" fill="#5d6d7e">
        <text x="712" y="870" text-anchor="start">2015</text>
        <text x="762" y="870" text-anchor="start">2016</text>
        <text x="812" y="870" text-anchor="start">2017</text>
        <text x="862" y="870" text-anchor="start">2018</text>
        <text x="912" y="870" text-anchor="start">2019</text>
        <text x="962" y="870" text-anchor="start">2020</text>
        <text x="1012" y="870" text-anchor="start">2021</text>
        <text x="1062" y="870" text-anchor="start">2022</text>
        <text x="1112" y="870" text-anchor="start">2023</text>
        <text x="1162" y="870" text-anchor="start">2024</text>
      </g>
      
      <!-- Y-axis GDP range label -->
      <text x="680" y="700" text-anchor="end" font-family="Arial" font-size="11" fill="#5d6d7e">US$ trillions</text>
      <text x="680" y="560" text-anchor="end" font-family="Arial" font-size="11" fill="#5d6d7e">5.2</text>
      <text x="680" y="850" text-anchor="end" font-family="Arial" font-size="11" fill="#5d6d7e">4.0</text>
      
      <!-- Bars with data values -->
      <g font-family="Arial" font-size="10" fill="#2c3e50">
        <!-- 2015: 4.44 -->
        <rect x="712" y="740" width="25" height="110" fill="#3498db"/>
        <text x="720" y="725" text-anchor="middle">4.44</text>
        <!-- 2016: 5.00 -->
        <rect x="762" y="600" width="25" height="250" fill="#3498db"/>
        <text x="770" y="585" text-anchor="middle">5.00</text>
        <!-- 2017: 4.93 -->
        <rect x="812" y="618" width="25" height="233" fill="#3498db"/>
        <text x="820" y="603" text-anchor="middle">4.93</text>
        <!-- 2018: 5.04 -->
        <rect x="862" y="590" width="25" height="260" fill="#3498db"/>
        <text x="870" y="575" text-anchor="middle">5.04</text>
        <!-- 2019: 5.12 -->
        <rect x="912" y="570" width="25" height="280" fill="#3498db"/>
        <text x="920" y="555" text-anchor="middle">5.12</text>
        <!-- 2020: 5.05 -->
        <rect x="962" y="588" width="25" height="263" fill="#3498db"/>
        <text x="970" y="573" text-anchor="middle">5.05</text>
        <!-- 2021: 5.04 -->
        <rect x="1012" y="588" width="25" height="263" fill="#3498db"/>
        <text x="1020" y="573" text-anchor="middle">5.04</text>
        <!-- 2022: 4.26 -->
        <rect x="1062" y="785" width="25" height="65" fill="#e74c3c"/>
        <text x="1070" y="770" text-anchor="middle">4.26</text>
        <!-- 2023: 4.21 -->
        <rect x="1112" y="798" width="25" height="53" fill="#e74c3c"/>
        <text x="1120" y="783" text-anchor="middle">4.21</text>
        <!-- 2024: 4.03 -->
        <rect x="1162" y="843" width="25" height="7" fill="#e74c3c"/>
        <text x="1170" y="828" text-anchor="middle">4.03</text>
      </g>
    </g>
  </g>
  
  /* -------------------------------------------------
     BOTTOM ROW: Donut chart (left) + Visit text (right)
  ------------------------------------------------- -->
  <g transform="translate(0, 980)">
    <!-- Donut chart: population composition -->
    <g transform="rotate(-90 200 1500)">
      <!-- Outer circle -->
      <circle class="popDonut" cx="200" cy="1500" r="80"/>
      <!-- Inner circle (donut hole) -->
      <circle cx="200" cy="1500" r="40" fill="#fff"/>
      <!-- Center label -->
      <text x="200" y="1535" text-anchor="middle" font-family="Arial" font-size="12" fill="#2c3e50">Japan</text>
    </g>
    
    <!-- Visitor places text -->
    <g transform="translate(400, 0)">
      <text x="0" y="20" font-family="Arial" font-size="14" fill="#34495e">Top destinations to visit in Japan:</text>
      <tspan x="0" y="45" dx="0">• Tokyo – ultramodern metropolis, Shibuya Crossing, Tokyo Tower</tspan>
      <tspan x="0" y="70" dx="0">• Kyoto – historic temples, Fushimi Inari, Arashiyama bamboo grove</tspan>
      <tspan x="0" y="95" dx="0">• Osaka – street food, Osaka Castle, Universal Studios</tspan>
      <tspan x="0" y="120" dx="0">• Hiroshima / Miyajima – Peace Memorial, floating torii gate</tspan>
      <tspan x="0" y="145" dx="0">• Mount Fuji / Hakone – iconic volcano, hot springs, lake views</tspan>
      <tspan x="0" y="170" dx="0">• Hokkaido – pristine nature, ski resorts, lavender fields</tspan>
    </g>
  </g>
  
  /* -------------------------------------------------
     SOURCE NOTE (bottom)
  ------------------------------------------------- -->
  <g transform="translate(0, 1780)">
    <text x="600" y="20" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">
      Sources: World Bank – Nominal GDP (current US$), Statistics Bureau of Japan – Population estimates, UN Data.
    </text>
  </g>
</svg>
