<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F7F4"/>
      <stop offset="35%" stop-color="#F4F1EB"/>
      <stop offset="100%" stop-color="#EDE8E0"/>
    </linearGradient>
    
    <!-- Wave pattern -->
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E8E3D9"/>
      <stop offset="100%" stop-color="#E0D9CC"/>
    </linearGradient>
    
    <!-- Card shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    
    <!-- Map gradient -->
    <linearGradient id="mapGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C9B8A8"/>
      <stop offset="100%" stop-color="#B8A48F"/>
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C13C4C"/>
      <stop offset="100%" stop-color="#9F2E3E"/>
    </linearGradient>
    
    <!-- Bar gradient -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C13C4C"/>
      <stop offset="100%" stop-color="#9F2E3E"/>
    </linearGradient>
    
    <!-- Donut colors -->
    <linearGradient id="jpGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#C13C4C"/>
      <stop offset="100%" stop-color="#9F2E3E"/>
    </linearGradient>
    <linearGradient id="cnGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4A90A4"/>
      <stop offset="100%" stop-color="#3A7A8A"/>
    </linearGradient>
    <linearGradient id="vnGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#5FAD7B"/>
      <stop offset="100%" stop-color="#4A8C62"/>
    </linearGradient>
    <linearGradient id="krGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#B88C12"/>
    </linearGradient>
    <linearGradient id="otherGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7B6F63"/>
      <stop offset="100%" stop-color="#635A51"/>
    </linearGradient>
  </defs>
  
  <!-- Soft background -->
  <rect width="1200" height="1800" fill="url(#bgGrad)"/>
  
  <!-- Subtle wave elements -->
  <path d="M0 320 Q150 280 300 310 Q450 340 600 295 Q750 250 900 310 Q1050 370 1200 300" fill="none" stroke="#E0D9CC" stroke-width="38" opacity="0.35"/>
  <path d="M0 340 Q200 300 380 325 Q560 355 740 305 Q920 255 1200 315" fill="none" stroke="#D8D0C3" stroke-width="22" opacity="0.25"/>
  <path d="M0 1750 Q180 1720 360 1745 Q540 1770 720 1735 Q900 1700 1200 1740" fill="none" stroke="#D8D0C3" stroke-width="30" opacity="0.3"/>
  
  <!-- Title -->
  <text x="600" y="78" font-family="Georgia, serif" font-size="52" font-weight="600" fill="#2C2520" text-anchor="middle" letter-spacing="-1.2">Japan at a glance</text>
  <line x1="420" y1="100" x2="780" y2="100" stroke="#C13C4C" stroke-width="2.5" opacity="0.6"/>
  
  <!-- First row: Map + Text card -->
  <!-- Map card -->
  <g>
    <rect x="60" y="130" width="520" height="440" rx="16" ry="16" fill="#F9F6F0" filter="url(#cardShadow)"/>
    <text x="320" y="168" font-family="Georgia, serif" font-size="21" font-weight="600" fill="#2C2520" text-anchor="middle">Geographic Overview</text>
    
    <!-- Stylized Japan map (simplified islands) -->
    <!-- Honshu -->
    <path d="M195 195 Q215 210 255 205 Q300 195 325 220 Q350 255 365 310 Q355 355 330 380 Q295 395 255 375 Q220 350 205 305 Q195 250 195 195" fill="url(#mapGrad)" stroke="#8B7B6B" stroke-width="1.5"/>
    <!-- Hokkaido -->
    <path d="M290 175 Q325 170 355 182 Q365 205 345 222 Q310 225 285 205 Q280 185 290 175" fill="url(#mapGrad)" stroke="#8B7B6B" stroke-width="1.5"/>
    <!-- Kyushu -->
    <path d="M185 365 Q210 380 235 365 Q250 390 225 415 Q195 410 180 385 Q180 365 185 365" fill="url(#mapGrad)" stroke="#8B7B6B" stroke-width="1.5"/>
    <!-- Shikoku -->
    <path d="M255 355 Q285 360 300 375 Q280 395 255 380 Q250 360 255 355" fill="url(#mapGrad)" stroke="#8B7B6B" stroke-width="1.5"/>
    
    <!-- Cities -->
    <!-- Tokyo -->
    <circle cx="330" cy="265" r="7" fill="#C13C4C"/>
    <text x="345" y="262" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2C2520">Tokyo</text>
    <!-- Yokohama -->
    <circle cx="310" cy="282" r="5" fill="#C13C4C"/>
    <text x="322" y="297" font-family="system-ui, sans-serif" font-size="12" fill="#4A4038">Yokohama</text>
    <!-- Nagoya -->
    <circle cx="265" cy="295" r="5" fill="#C13C4C"/>
    <text x="215" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#4A4038">Nagoya</text>
    <!-- Osaka -->
    <circle cx="225" cy="345" r="5.5" fill="#C13C4C"/>
    <text x="185" y="348" font-family="system-ui, sans-serif" font-size="12" fill="#4A4038">Osaka</text>
    
    <text x="320" y="455" font-family="system-ui, sans-serif" font-size="11" fill="#6B6259" text-anchor="middle">Honshu • Kyushu • Shikoku • Hokkaido</text>
  </g>
  
  <!-- Text card -->
  <g>
    <rect x="610" y="130" width="530" height="440" rx="16" ry="16" fill="#F9F6F0" filter="url(#cardShadow)"/>
    <text x="875" y="175" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#2C2520" text-anchor="middle">An Island Nation</text>
    <text x="640" y="210" font-family="system-ui, sans-serif" font-size="13.5" fill="#4A4038" line-height="1.55">
      <tspan x="640" dy="0">Japan is an East Asian island country</tspan>
      <tspan x="640" dy="20">consisting of four main islands and</tspan>
      <tspan x="640" dy="20">nearly 14,000 smaller islands.</tspan>
      <tspan x="640" dy="28">With a population of approximately</tspan>
      <tspan x="640" dy="20">124 million, it is the world’s 11th</tspan>
      <tspan x="640" dy="20">most populous country. Japan has</tspan>
      <tspan x="640" dy="20">the third-largest economy by nominal</tspan>
      <tspan x="640" dy="20">GDP and maintains one of the most</tspan>
      <tspan x="640" dy="20">advanced technological and cultural</tspan>
      <tspan x="640" dy="20">landscapes in the world.</tspan>
    </text>
    <rect x="640" y="420" width="470" height="1.5" fill="#D4C8B8"/>
    <text x="875" y="450" font-family="system-ui, sans-serif" font-size="11" fill="#7B6F63" text-anchor="middle">Area: 377,975 km² • Capital: Tokyo</text>
  </g>
  
  <!-- Full-width paragraph -->
  <g>
    <rect x="60" y="595" width="1080" height="105" rx="12" ry="12" fill="#F9F6F0" filter="url(#cardShadow)"/>
    <text x="600" y="628" font-family="system-ui, sans-serif" font-size="14.5" fill="#4A4038" text-anchor="middle">
      Japan is renowned for its unique blend of ancient traditions and cutting-edge innovation. The country is home to 21 World Heritage Sites and
    </text>
    <text x="600" y="652" font-family="system-ui, sans-serif" font-size="14.5" fill="#4A4038" text-anchor="middle">
      consistently ranks among the safest, most efficient, and technologically advanced nations globally, with a deep cultural emphasis on harmony,
    </text>
    <text x="600" y="676" font-family="system-ui, sans-serif" font-size="14.5" fill="#4A4038" text-anchor="middle">
      craftsmanship, and seasonal appreciation.
    </text>
  </g>
  
  <!-- GDP Section -->
  <g>
    <!-- Left text panel -->
    <rect x="60" y="725" width="440" height="470" rx="16" ry="16" fill="#F9F6F0" filter="url(#cardShadow)"/>
    <text x="280" y="768" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#2C2520" text-anchor="middle">Economic Trajectory</text>
    <text x="95" y="805" font-family="system-ui, sans-serif" font-size="13.5" fill="#4A4038">
      <tspan x="95" dy="0">Japan remains one of the world’s</tspan>
      <tspan x="95" dy="19">largest economies. After a decade</tspan>
      <tspan x="95" dy="19">of relative stability, the economy</tspan>
      <tspan x="95" dy="19">experienced a notable contraction</tspan>
      <tspan x="95" dy="19">in 2022–2024, influenced by global</tspan>
      <tspan x="95" dy="19">inflation, currency fluctuations,</tspan>
      <tspan x="95" dy="19">and demographic shifts.</tspan>
    </text>
    <text x="280" y="950" font-family="system-ui, sans-serif" font-size="11.5" fill="#7B6F63" text-anchor="middle">Nominal GDP (US$ trillions)</text>
    <text x="280" y="975" font-family="system-ui, sans-serif" font-size="10" fill="#96897B" text-anchor="middle">Source: IMF World Economic Outlook</text>
  </g>
  
  <!-- Bar chart card -->
  <g>
    <rect x="530" y="725" width="610" height="470" rx="16" ry="16" fill="#F9F6F0" filter="url(#cardShadow)"/>
    
    <!-- Chart title -->
    <text x="835" y="768" font-family="Georgia, serif" font-size="17" font-weight="600" fill="#2C2520" text-anchor="middle">Nominal GDP 2015–2024</text>
    
    <!-- Bars -->
    <!-- 2015 -->
    <rect x="570" y="820" width="38" height="92" rx="3" fill="url(#barGrad)"/>
    <text x="589" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2015</text>
    <text x="589" y="815" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">4.44</text>
    
    <!-- 2016 -->
    <rect x="618" y="800" width="38" height="112" rx="3" fill="url(#barGrad)"/>
    <text x="637" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2016</text>
    <text x="637" y="795" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">5.00</text>
    
    <!-- 2017 -->
    <rect x="666" y="805" width="38" height="107" rx="3" fill="url(#barGrad)"/>
    <text x="685" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2017</text>
    <text x="685" y="800" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">4.93</text>
    
    <!-- 2018 -->
    <rect x="714" y="795" width="38" height="117" rx="3" fill="url(#barGrad)"/>
    <text x="733" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2018</text>
    <text x="733" y="790" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">5.04</text>
    
    <!-- 2019 -->
    <rect x="762" y="790" width="38" height="122" rx="3" fill="url(#barGrad)"/>
    <text x="781" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2019</text>
    <text x="781" y="785" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">5.12</text>
    
    <!-- 2020 -->
    <rect x="810" y="798" width="38" height="114" rx="3" fill="url(#barGrad)"/>
    <text x="829" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2020</text>
    <text x="829" y="793" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">5.05</text>
    
    <!-- 2021 -->
    <rect x="858" y="798" width="38" height="114" rx="3" fill="url(#barGrad)"/>
    <text x="877" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2021</text>
    <text x="877" y="793" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">5.04</text>
    
    <!-- 2022 -->
    <rect x="906" y="850" width="38" height="62" rx="3" fill="url(#barGrad)"/>
    <text x="925" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2022</text>
    <text x="925" y="845" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">4.26</text>
    
    <!-- 2023 -->
    <rect x="954" y="854" width="38" height="58" rx="3" fill="url(#barGrad)"/>
    <text x="973" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2023</text>
    <text x="973" y="849" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">4.21</text>
    
    <!-- 2024 -->
    <rect x="1002" y="863" width="38" height="49" rx="3" fill="url(#barGrad)"/>
    <text x="1021" y="928" font-family="system-ui, sans-serif" font-size="10" fill="#5C5249" text-anchor="middle">2024</text>
    <text x="1021" y="858" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C2520" text-anchor="middle">4.03</text>
    
    <!-- Y-axis reference -->
    <line x1="555" y1="790" x2="555" y2="920" stroke="#C9B8A8" stroke-width="1"/>
    <text x="545" y="795" font-family="system-ui, sans-serif" font-size="9" fill="#96897B" text-anchor="end">5.5</text>
    <text x="545" y="860" font-family="system-ui, sans-serif" font-size="9" fill="#96897B" text-anchor="end">4.5</text>
    <text x="545" y="920" font-family="system-ui, sans-serif" font-size="9" fill="#96897B" text-anchor="end">3.5</text>
  </g>
  
  <!-- Bottom row: Donut + Places -->
  <!-- Donut chart card -->
  <g>
    <rect x="60" y="1220" width="520" height="450" rx="16" ry="16" fill="#F9F6F0" filter="url(#cardShadow)"/>
    <text x="320" y="1263" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#2C2520" text-anchor="middle">Population Composition</text>
    
    <!-- Donut chart -->
    <g transform="translate(320, 1480)">
      <!-- Background circle -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="#EDE8E0" stroke-width="52"/>
      
      <!-- Segments (donut) -->
      <!-- Japanese 97.5% (351°) -->
      <path d="M0,-115 A115,115 0 1,1 -1.5,114.9" fill="none" stroke="url(#jpGrad)" stroke-width="52" stroke-dasharray="351 360"/>
      
      <!-- Chinese 0.6% -->
      <path d="M0,-115 A115,115 0 0,1 113.8,16" fill="none" stroke="url(#cnGrad)" stroke-width="52" stroke-dasharray="2.2 360"/>
      
      <!-- Vietnamese 0.4% -->
      <path d="M113.8,16 A115,115 0 0,1 109.2,35" fill="none" stroke="url(#vnGrad)" stroke-width="52" stroke-dasharray="1.4 360"/>
      
      <!-- South Korean 0.3% -->
      <path d="M109.2,35 A115,115 0 0,1 106,45" fill="none" stroke="url(#krGrad)" stroke-width="52" stroke-dasharray="1.1 360"/>
      
      <!-- Other 1.2% -->
      <path d="M106,45 A115,115 0 0,1 99,68" fill="none" stroke="url(#otherGrad)" stroke-width="52" stroke-dasharray="4.3 360"/>
      
      <!-- Center hole -->
      <circle cx="0" cy="0" r="68" fill="#F9F6F0"/>
      
      <!-- Center text -->
      <text x="0" y="-6" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#2C2520" text-anchor="middle">124M</text>
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#7B6F63" text-anchor="middle">residents</text>
    </g>
    
    <!-- Legend -->
    <g font-family="system-ui, sans-serif" font-size="12">
      <rect x="95" y="1335" width="14" height="14" rx="2" fill="url(#jpGrad)"/>
      <text x="118" y="1346" fill="#4A4038">Japanese 97.5%</text>
      
      <rect x="95" y="1358" width="14" height="14" rx="2" fill="url(#cnGrad)"/>
      <text x="118" y="1369" fill="#4A4038">Chinese 0.6%</text>
      
      <rect x="95" y="1381" width="14" height="14" rx="2" fill="url(#vnGrad)"/>
      <text x="118" y="1392" fill="#4A4038">Vietnamese 0.4%</text>
      
      <rect x="290" y="1335" width="14" height="14" rx="2" fill="url(#krGrad)"/>
      <text x="313" y="1346" fill="#4A4038">South Korean 0.3%</text>
      
      <rect x="290" y="1358" width="14" height="14" rx="2" fill="url(#otherGrad)"/>
      <text x="313" y="1369" fill="#4A4038">Other 1.2%</text>
    </g>
    <text x="320" y="1640" font-family="system-ui, sans-serif" font-size="10" fill="#96897B" text-anchor="middle">Source: Statistics Bureau of Japan, 2023</text>
  </g>
  
  <!-- Places to visit card -->
  <g>
    <rect x="610" y="1220" width="530" height="450" rx="16" ry="16" fill="#F9F6F0" filter="url(#cardShadow)"/>
    <text x="875" y="1263" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#2C2520" text-anchor="middle">Must-Visit Destinations</text>
    
    <g font-family="system-ui, sans-serif" font-size="13.5" fill="#4A4038">
      <text x="650" y="1315">• <tspan font-weight="600">Tokyo</tspan> — Modern metropolis &amp; culture</text>
      <text x="650" y="1345">• <tspan font-weight="600">Kyoto</tspan> — Ancient temples &amp; gardens</text>
      <text x="650" y="1375">• <tspan font-weight="600">Osaka</tspan> — Street food &amp; nightlife</text>
      <text x="650" y="1405">• <tspan font-weight="600">Hiroshima &amp; Miyajima</tspan> — Peace &amp; nature</text>
      <text x="650" y="1435">• <tspan font-weight="600">Mount Fuji &amp; Hakone</tspan> — Iconic landscapes</text>
      <text x="650" y="1465">• <tspan font-weight="600">Hokkaido</tspan> — Wilderness &amp; onsen</text>
    </g>
    
    <rect x="650" y="1500" width="450" height="1.5" fill="#D4C8B8"/>
    
    <text x="875" y="1545" font-family="system-ui, sans-serif" font-size="12.5" fill="#7B6F63" text-anchor="middle">A perfect blend of tradition,</text>
    <text x="875" y="1565" font-family="system-ui, sans-serif" font-size="12.5" fill="#7B6F63" text-anchor="middle">nature, and futuristic design.</text>
    
    <text x="875" y="1630" font-family="Georgia, serif" font-size="12" fill="#96897B" text-anchor="middle">— 2024 Travel Guide</text>
  </g>
  
  <!-- Footer source -->
  <text x="600" y="1740" font-family="system-ui, sans-serif" font-size="10" fill="#96897B" text-anchor="middle">Data sources: IMF, Statistics Bureau of Japan • Infographic created for editorial use</text>
</svg>