<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="100%" height="100%" font-family="'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif">
  <title>Japan at a Glance</title>
  <desc>A modern editorial infographic about Japan — map, economy, demographics, and travel highlights.</desc>

  <!-- =============== DEFS =============== -->
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#f1ead8"/>
    </linearGradient>
    <linearGradient id="headband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8363d"/>
      <stop offset="100%" stop-color="#e6555d"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5f9"/>
      <stop offset="100%" stop-color="#dde9f0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf8f1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8363d"/>
      <stop offset="100%" stop-color="#7a1e25"/>
    </linearGradient>
    <linearGradient id="barGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6555d"/>
      <stop offset="100%" stop-color="#b23a42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22305c"/>
      <stop offset="100%" stop-color="#3d5591"/>
    </linearGradient>
    <linearGradient id="mapFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0e6d2"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd7dd"/>
    </linearGradient>
    <linearGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd85c"/>
      <stop offset="100%" stop-color="#f08a3e"/>
    </linearGradient>

    <!-- Patterns -->
    <pattern id="wavePat" x="0" y="0" width="120" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 18 Q15 6 30 18 T60 18 T90 18 T120 18" fill="none" stroke="#d8e3eb" stroke-width="1"/>
      <path d="M0 28 Q15 16 30 28 T60 28 T90 28 T120 28" fill="none" stroke="#e3ebf1" stroke-width="0.7"/>
    </pattern>
    <pattern id="seigaiha" x="0" y="0" width="80" height="26" patternUnits="userSpaceOnUse">
      <path d="M-10 26 Q0 6 10 26 Q20 6 30 26 Q40 6 50 26 Q60 6 70 26 Q80 6 90 26" fill="none" stroke="#c6d3dd" stroke-width="0.8"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d4c7a9"/>
    </pattern>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Donut segment clip -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1140" height="400" rx="16"/>
    </clipPath>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <rect width="1200" height="1800" fill="url(#seigaiha)" opacity="0.25"/>

  <!-- Decorative rising sun circle behind title -->
  <g opacity="0.08">
    <circle cx="1050" cy="130" r="220" fill="url(#sunGrad)"/>
  </g>

  <!-- Top accent stripe -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#headband)"/>

  <!-- Envelope -->
  <g transform="translate(30 30)">

    <!-- =============== HEADER =============== -->
    <g id="header">
      <!-- small Japanese mark -->
      <g transform="translate(0 2)">
        <circle cx="18" cy="18" r="18" fill="url(#headband)"/>
        <rect x="14" y="6" width="8" height="24" fill="#fff"/>
        <rect x="6" y="14" width="24" height="8" fill="#fff"/>
      </g>
      <text x="48" y="20" font-size="12" fill="#22305c" letter-spacing="3" font-weight="700">INFOGRAPHIC · 2024 EDITION</text>
      <text x="0" y="72" font-size="56" font-weight="800" fill="#1a1a1a" letter-spacing="-1">Japan at a glance</text>
      <text x="0" y="102" font-size="18" fill="#5a5a5a">An island nation of 125 million people — economy, culture, and landscape on the Pacific Ring of Fire.</text>
      <rect x="0" y="118" width="1140" height="1" fill="#c8363d"/>
    </g>

    <!-- =============== ROW 1: MAP + INTRO CARD =============== -->
    <g id="row1" transform="translate(0 150)">
      <!-- LEFT: MAP CARD -->
      <g filter="url(#shadow)">
        <rect width="700" height="460" rx="14" fill="url(#card)" stroke="#e2d9c2"/>
        <rect width="700" height="40" rx="14" fill="url(#waterGrad)"/>
        <rect y="26" width="700" height="14" fill="#cfdce6"/>
        <text x="22" y="27" font-size="14" font-weight="700" fill="#22305c">MAP · THE JAPANESE ARCHIPELAGO</text>
        <text x="680" y="27" font-size="11" fill="#5a6a7a" text-anchor="end">北 · HOKKAIDO · 北海道</text>
      </g>

      <!-- Map area background water pattern -->
      <g transform="translate(20 52)">
        <rect width="660" height="386" fill="url(#waterGrad)" opacity="0.5"/>
        <rect width="660" height="386" fill="url(#wavePat)" opacity="0.6"/>

        <!-- Lat/lon graticule -->
        <g stroke="#c8d5e0" stroke-width="0.3" opacity="0.6">
          <line x1="0"   y1="70"  x2="660" y2="70"/>
          <line x1="0"   y1="190" x2="660" y2="190"/>
          <line x1="0"   y1="300" x2="660" y2="300"/>
          <line x1="220" y1="0"   x2="220" y2="386"/>
          <line x1="440" y1="0"   x2="440" y2="386"/>
        </g>

        <g transform="translate(0 10) scale(1.05 1.05)">
          <!-- Hokkaido (top) -->
          <path d="M430 30
                   C 490 20, 530 40, 555 60
                   C 585 80, 595 100, 585 120
                   C 560 135, 520 135, 490 125
                   C 460 118, 440 100, 430 80
                   C 425 55, 420 40, 430 30 Z"
                fill="url(#mapFill)" stroke="#8c7e5e" stroke-width="1.3"/>
          <!-- Hokkaido interior shading -->
          <path d="M475 50 C 515 55, 540 70, 555 90 C 540 100, 510 105, 480 95 C 460 80, 465 60, 475 50 Z"
                fill="#e9dfc8" opacity="0.7"/>
          <text x="500" y="80" font-size="10" fill="#4a4a4a" font-weight="600" text-anchor="middle" opacity="0.7">HOKKAIDO</text>

          <!-- Honshu main island -->
          <path d="M230 105
                   C 270 95, 330 100, 380 120
                   C 420 135, 450 155, 460 175
                   C 468 190, 460 205, 450 220
                   C 430 250, 400 275, 360 285
                   C 330 295, 300 292, 280 280
                   C 260 270, 240 240, 235 220
                   C 225 200, 215 185, 210 165
                   C 208 140, 215 120, 230 105 Z"
                fill="url(#mapFill)" stroke="#8c7e5e" stroke-width="1.4"/>
          <!-- Interior mountains (Japanese alps) -->
          <path d="M310 170 L 320 150 L 335 175 L 348 145 L 360 170 L 370 150 L 380 175 L 395 160 L 400 180
                   C 370 195, 320 195, 300 185 Z" fill="url(#mountainGrad)" opacity="0.8"/>
          <!-- Kanto plain -->
          <ellipse cx="385" cy="210" rx="40" ry="16" fill="#fff6df" opacity="0.7"/>
          <!-- Mt Fuji -->
          <g transform="translate(345 200)">
            <path d="M0 0 L -8 -18 L -2 -18 L 0 -26 L 2 -18 L 8 -18 Z" fill="#ffffff" stroke="#6b7a85" stroke-width="0.7"/>
            <text x="0" y="8" font-size="8" fill="#3a3a3a" text-anchor="middle" font-weight="700">Fuji</text>
          </g>

          <!-- Shikoku -->
          <path d="M285 295
                   C 315 290, 345 295, 360 308
                   C 350 320, 315 323, 290 315
                   C 278 308, 278 300, 285 295 Z"
                fill="url(#mapFill)" stroke="#8c7e5e" stroke-width="1.2"/>

          <!-- Kyushu -->
          <path d="M200 275
                   C 230 265, 258 270, 270 285
                   C 278 298, 272 315, 255 325
                   C 235 333, 210 325, 200 308
                   C 190 295, 188 283, 200 275 Z"
                fill="url(#mapFill)" stroke="#8c7e5e" stroke-width="1.2"/>

          <!-- Okinawa (small) -->
          <path d="M140 350 C 180 342, 210 348, 230 355 C 220 362, 180 365, 150 358 Z"
                fill="url(#mapFill)" stroke="#8c7e5e" stroke-width="1"/>

          <!-- Region labels -->
          <text x="300" y="160" font-size="9" fill="#7a6a48" font-style="italic" font-weight="600">HONSHU</text>
          <text x="225" y="303" font-size="8" fill="#7a6a48" font-style="italic" font-weight="600">KYUSHU</text>
          <text x="310" y="313" font-size="8" fill="#7a6a48" font-style="italic" font-weight="600">SHIKOKU</text>
          <text x="170" y="368" font-size="8" fill="#7a6a48" font-style="italic" font-weight="600">OKINAWA</text>
          <text x="500" y="60"  font-size="8" fill="#7a6a48" font-style="italic" font-weight="600">HOKKAIDO</text>

          <!-- Capital marker: Tokyo -->
          <g id="tokyo-marker" transform="translate(395 207)">
            <circle r="7" fill="#c8363d" opacity="0.25"/>
            <circle r="4" fill="#c8363d" stroke="#fff" stroke-width="1.5"/>
          </g>

          <!-- City dots & labels -->
          <g font-size="11" fill="#1a1a1a" font-weight="700">
            <!-- Tokyo -->
            <circle cx="395" cy="207" r="3" fill="#c8363d"/>
            <text x="408" y="204" font-size="13">Tokyo</text>
            <text x="408" y="218" font-size="9" font-weight="400" fill="#6a6a6a">首都 · Capital · 37.1M</text>

            <!-- Yokohama (just south of Tokyo) -->
            <circle cx="390" cy="222" r="2.5" fill="#22305c"/>
            <text x="399" y="225" font-size="11" font-weight="600">Yokohama</text>
            <text x="399" y="238" font-size="9" font-weight="400" fill="#6a6a6a">3.8M</text>

            <!-- Nagoya (central Honshu, south of alps) -->
            <circle cx="355" cy="235" r="2.5" fill="#22305c"/>
            <text x="363" y="239" font-size="11" font-weight="600">Nagoya</text>
            <text x="363" y="252" font-size="9" font-weight="400" fill="#6a6a6a">2.3M</text>

            <!-- Osaka (Kansai, west) -->
            <circle cx="300" cy="260" r="2.5" fill="#22305c"/>
            <text x="308" y="258" font-size="11" font-weight="600">Osaka</text>
            <text x="308" y="273" font-size="9" font-weight="400" fill="#6a6a6a">2.7M</text>
          </g>

          <!-- Compass rose -->
          <g transform="translate(610 340)" opacity="0.85">
            <circle r="22" fill="#fff" stroke="#22305c" stroke-width="0.8"/>
            <path d="M0 -18 L4 0 L0 18 L-4 0 Z" fill="#c8363d"/>
            <path d="M-18 0 L0 4 L18 0 L0 -4 Z" fill="#22305c"/>
            <text x="0" y="-25" text-anchor="middle" font-size="9" font-weight="700" fill="#22305c">N</text>
          </g>

          <!-- Mini scale bar -->
          <g transform="translate(30 355)">
            <line x1="0" y1="0" x2="80" y2="0" stroke="#22305c" stroke-width="1.2"/>
            <line x1="0" y1="-4" x2="0" y2="4" stroke="#22305c"/>
            <line x1="80" y1="-4" x2="80" y2="4" stroke="#22305c"/>
            <text x="40" y="-7" text-anchor="middle" font-size="9" fill="#22305c" font-weight="600">~200 km</text>
          </g>
        </g>
      </g>

      <!-- Map caption -->
      <text x="22" y="452" font-size="11" fill="#5a6a7a">The four largest metropolitan areas (by prefecture population) are highlighted.</text>

      <!-- RIGHT: INTRO CARD -->
      <g transform="translate(720 0)" filter="url(#shadow)">
        <rect width="420" height="460" rx="14" fill="url(#card)" stroke="#e2d9c2"/>
        <!-- Flag-like red square -->
        <rect x="24" y="26" width="24" height="16" fill="#fff" stroke="#cfc6b2"/>
        <circle cx="36" cy="34" r="5" fill="#c8363d"/>
        <text x="58" y="39" font-size="11" fill="#5a5a5a" font-weight="600" letter-spacing="1">JPN · NIPPON · 日本</text>
        <line x1="24" y1="58" x2="396" y2="58" stroke="#e2d9c2"/>
        <text x="24" y="85" font-size="24" font-weight="800" fill="#1a1a1a">An archipelago</text>
        <text x="24" y="110" font-size="24" font-weight="800" fill="#c8363d">of 14,125 islands.</text>

        <g font-size="13" fill="#3a3a3a" line-height="1.5">
          <text x="24" y="145">Japan stretches along the northeast</text>
          <text x="24" y="164">coast of Eurasia in the northwestern</text>
          <text x="24" y="183">Pacific. Four main islands — Hokkaido,</text>
          <text x="24" y="202">Honshu, Shikoku, and Kyushu — make up</text>
          <text x="24" y="221">about 97% of the land area.</text>

          <text x="24" y="253">A constitutional monarchy with one of</text>
          <text x="24" y="272">the world's most densely populated</text>
          <text x="24" y="291">and urbanised societies, Japan is a</text>
          <text x="24" y="310">leading global hub for technology,</text>
          <text x="24" y="329">automotive manufacturing, finance,</text>
          <text x="24" y="348">and pop culture.</text>
        </g>

        <!-- Key facts block -->
        <g transform="translate(24 370)">
          <g>
            <text x="0" y="0" font-size="10" fill="#8a8a8a" letter-spacing="1">CAPITAL</text>
            <text x="0" y="18" font-size="14" font-weight="700" fill="#22305c">Tokyo</text>
          </g>
          <g transform="translate(130 0)">
            <text x="0" y="0" font-size="10" fill="#8a8a8a" letter-spacing="1">LANGUAGE</text>
            <text x="0" y="18" font-size="14" font-weight="700" fill="#22305c">Japanese</text>
          </g>
          <g transform="translate(280 0)">
            <text x="0" y="0" font-size="10" fill="#8a8a8a" letter-spacing="1">CURRENCY</text>
            <text x="0" y="18" font-size="14" font-weight="700" fill="#22305c">Yen (¥/JPY)</text>
          </g>
        </g>
      </g>
    </g>

    <!-- =============== FULL-WIDTH PARAGRAPH =============== -->
    <g id="standfirst" transform="translate(0 640)">
      <rect width="1140" height="78" rx="8" fill="#22305c"/>
      <rect x="0" y="0" width="6" height="78" fill="#c8363d"/>
      <text x="28" y="32" font-size="16" fill="#fff6df" font-weight="700" letter-spacing="0.3">DID YOU KNOW?</text>
      <text x="28" y="58" font-size="13" fill="#e5e0cf">
        Japan has the world's <tspan font-weight="800" fill="#ffd85c">third-largest economy by nominal GDP</tspan>, the longest life expectancy, and more than 5.5 million
      </text>
      <text x="28" y="74" font-size="13" fill="#e5e0cf">
        vending machines. Its Shinkansen bullet-train network, launched in 1964, carries more than 10 billion passengers and holds a 60-year record of zero passenger fatalities from derailment or collision.
      </text>
    </g>

    <!-- =============== ROW 2: GDP TEXT + BAR CHART =============== -->
    <g id="row2" transform="translate(0 760)">
      <!-- LEFT: GDP intro -->
      <g transform="translate(0 0)" filter="url(#softShadow)">
        <rect width="380" height="420" rx="14" fill="url(#card)" stroke="#e2d9c2"/>
        <text x="22" y="42" font-size="12" fill="#22305c" letter-spacing="2" font-weight="700">ECONOMY · 経済</text>
        <text x="22" y="78" font-size="26" font-weight="800" fill="#1a1a1a">Nominal GDP,</text>
        <text x="22" y="108" font-size="26" font-weight="800" fill="#c8363d">2015 – 2024</text>
        <line x1="22" y1="126" x2="358" y2="126" stroke="#e2d9c2"/>
        <text x="22" y="152" font-size="12" fill="#3a3a3a">
          After decades as the world's second-
        </text>
        <text x="22" y="170" font-size="12" fill="#3a3a3a">
          largest economy, Japan's nominal GDP
        </text>
        <text x="22" y="188" font-size="12" fill="#3a3a3a">
          peaked near <tspan font-weight="700">US$ 5.1 trillion</tspan> in 2019,
        </text>
        <text x="22" y="206" font-size="12" fill="#3a3a3a">
          boosted by Abenomics-era monetary
        </text>
        <text x="22" y="224" font-size="12" fill="#3a3a3a">
          stimulus.
        </text>
        <text x="22" y="252" font-size="12" fill="#3a3a3a">
          A weakening yen, post-pandemic
        </text>
        <text x="22" y="270" font-size="12" fill="#3a3a3a">
          inflation, and demographic headwinds
        </text>
        <text x="22" y="288" font-size="12" fill="#3a3a3a">
          have since pulled the figure back to
        </text>
        <text x="22" y="306" font-size="12" fill="#3a3a3a">
          around <tspan font-weight="700">US$ 4.0 trillion</tspan> in 2024, placing
        </text>
        <text x="22" y="324" font-size="12" fill="#3a3a3a">
          Japan fourth globally.
        </text>

        <!-- mini KPI -->
        <g transform="translate(22 350)">
          <rect width="104" height="50" rx="8" fill="#fff" stroke="#e2d9c2"/>
          <text x="10" y="18" font-size="9" fill="#8a8a8a" letter-spacing="1">PEAK</text>
          <text x="10" y="38" font-size="17" font-weight="800" fill="#c8363d">$5.12T</text>
          <text x="60" y="38" font-size="10" fill="#8a8a8a">'19</text>
        </g>
        <g transform="translate(136 350)">
          <rect width="104" height="50" rx="8" fill="#fff" stroke="#e2d9c2"/>
          <text x="10" y="18" font-size="9" fill="#8a8a8a" letter-spacing="1">2024</text>
          <text x="10" y="38" font-size="17" font-weight="800" fill="#22305c">$4.03T</text>
        </g>
        <g transform="translate(250 350)">
          <rect width="104" height="50" rx="8" fill="#fff" stroke="#e2d9c2"/>
          <text x="10" y="18" font-size="9" fill="#8a8a8a" letter-spacing="1">DECADE Δ</text>
          <text x="10" y="38" font-size="17" font-weight="800" fill="#c8363d">−9%</text>
        </g>
      </g>

      <!-- RIGHT: BAR CHART CARD -->
      <g transform="translate(400 0)" filter="url(#softShadow)">
        <rect width="740" height="420" rx="14" fill="url(#card)" stroke="#e2d9c2"/>
        <text x="22" y="42" font-size="12" fill="#22305c" letter-spacing="2" font-weight="700">NOMINAL GDP · CURRENT US$ TRILLIONS</text>
        <text x="720" y="42" font-size="11" fill="#8a8a8a" text-anchor="end">Source: IMF World Economic Outlook, 2024</text>

        <!-- Chart area -->
        <g transform="translate(60 80)">
          <!-- axes area 660 x 290 -->
          <rect width="660" height="290" fill="#faf6ec" rx="6"/>
          <rect width="660" height="290" fill="url(#dots)" opacity="0.4" rx="6"/>

          <!-- y gridlines -->
          <g stroke="#e4dac0" stroke-width="0.6">
            <line x1="0" y1="290" x2="660" y2="290"/>
            <line x1="0" y1="232" x2="660" y2="232"/>
            <line x1="0" y1="174" x2="660" y2="174"/>
            <line x1="0" y1="116" x2="660" y2="116"/>
            <line x1="0" y1="58"  x2="660" y2="58"/>
            <line x1="0" y1="0"   x2="660" y2="0"/>
          </g>
          <!-- y axis labels -->
          <g font-size="10" fill="#8a8a8a" text-anchor="end">
            <text x="-8" y="293">$0T</text>
            <text x="-8" y="235">$1T</text>
            <text x="-8" y="177">$2T</text>
            <text x="-8" y="119">$3T</text>
            <text x="-8" y="61">$4T</text>
            <text x="-8" y="4">$5.5T</text>
          </g>

          <!-- Data -->
          <!-- scale: 5.5 trillion -> 290px, one unit = 290/5.5 px -->
          <!-- bars: 10 years, spacing 66px, bar width 36px -->
          <g id="bars">
            <!-- reuse helper via manual bars -->
            <g>
              <!-- 2015 4.44 h = 4.44*290/5.5 = 234.4 y = 290-h -->
              <rect x="15" y="56"  width="36" height="234" rx="3" fill="url(#barGrad)"/>
              <text x="33" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">4.44</text>
              <text x="33" y="305" text-anchor="middle" font-size="10" fill="#5a5a5a">2015</text>
            </g>
            <g>
              <!-- 2016 5.00 -->
              <rect x="81" y="26"  width="36" height="264" rx="3" fill="url(#barGrad)"/>
              <text x="99" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">5.00</text>
              <text x="99" y="305" text-anchor="middle" font-size="10" fill="#5a5a5a">2016</text>
            </g>
            <g>
              <rect x="147" y="30" width="36" height="260" rx="3" fill="url(#barGradLight)"/>
              <text x="165" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">4.93</text>
              <text x="165" y="305" text-anchor="middle" font-size="10" fill="#5a5a5a">2017</text>
            </g>
            <g>
              <rect x="213" y="24" width="36" height="266" rx="3" fill="url(#barGrad)"/>
              <text x="231" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">5.04</text>
              <text x="231" y="305" text-anchor="middle" font-size="10" fill="#5a5a5a">2018</text>
            </g>
            <g>
              <!-- peak 5.12 -->
              <rect x="279" y="20" width="36" height="270" rx="3" fill="#c8363d"/>
