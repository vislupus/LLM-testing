<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fcff"/>
      <stop offset="50%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <radialGradient id="donutGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </radialGradient>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="chartClip">
      <rect x="0" y="0" width="480" height="360"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#bgGrad)"/>
  <!-- Subtle waves -->
  <path d="M 0 250 Q 200 200 400 250 T 800 250 T 1200 250" fill="none" stroke="#bbdefb" stroke-width="1" opacity="0.4"/>
  <path d="M 0 450 Q 250 400 500 450 T 900 450 T 1200 450" fill="none" stroke="#90caf9" stroke-width="1.5" opacity="0.3"/>
  <path d="M 0 700 Q 150 650 300 700 T 600 700 T 1200 700" fill="none" stroke="#e3f2fd" stroke-width="1" opacity="0.5"/>
  <!-- Title -->
  <text x="600" y="110" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="64" font-weight="700" fill="#0d47a1" letter-spacing="1">Japan</text>
  <text x="600" y="170" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="64" font-weight="700" fill="#d32f2f">at a glance</text>
  <!-- First row: Map left -->
  <g transform="translate(60, 220)">
    <!-- Map card -->
    <rect x="0" y="0" width="540" height="380" rx="24" fill="url(#cardGrad)" stroke="#e0e7ff" stroke-width="1.5" filter="url(#dropShadow)"/>
    <!-- Hokkaido -->
    <path d="M 120,35 Q 170,15 215,40 T 285,60 Q 275,90 245,80 Q 205,95 165,75 Z" fill="#f0f4f8" stroke="#bdc3c7" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Honshu -->
    <path d="M 95,85 Q 100,175 125,205 Q 165,195 215,210 Q 265,195 315,210 Q 365,195 410,210 L 425,250 Q 410,285 390,290 Q 350,305 310,300 Q 270,315 230,310 Q 190,325 150,320 Q 110,335 95,300 L 85,260 Q 80,220 85,185 Z" fill="#f0f4f8" stroke="#bdc3c7" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Shikoku -->
    <path d="M 195,290 L 225,310 L 250,305 L 255,285 L 240,270 L 215,275 Z" fill="#f0f4f8" stroke="#bdc3c7" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Kyushu -->
    <path d="M 265,330 L 295,350 L 325,345 L 335,375 L 315,390 L 285,385 L 265,365 Z" fill="#f0f4f8" stroke="#bdc3c7" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Cities -->
    <g font-family="system-ui, Arial, sans-serif" font-size="14" font-weight="600" fill="#d32f2f">
      <!-- Tokyo -->
      <circle cx="220" cy="175" r="5" fill="#ff5722" stroke="#d32f2f" stroke-width="1.5"/>
      <text x="220" y="165" text-anchor="middle" font-size="13">Tokyo</text>
      <!-- Yokohama -->
      <circle cx="235" cy="210" r="4.5" fill="#ff5722" stroke="#d32f2f" stroke-width="1.5"/>
      <text x="235" y="202" text-anchor="middle" font-size="13">Yokohama</text>
      <!-- Nagoya -->
      <circle cx="190" cy="240" r="4.5" fill="#ff5722" stroke="#d32f2f" stroke-width="1.5"/>
      <text x="190" y="232" text-anchor="middle" font-size="13">Nagoya</text>
      <!-- Osaka -->
      <circle cx="155" cy="285" r="5" fill="#ff5722" stroke="#d32f2f" stroke-width="1.5"/>
      <text x="155" y="276" text-anchor="middle" font-size="13">Osaka</text>
    </g>
    <text x="20" y="30" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Stylized Map</text>
    <text x="20" y="52" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#6b7280">Four largest cities</text>
  </g>
  <!-- First row: Text right -->
  <g transform="translate(660, 220)">
    <rect x="0" y="0" width="500" height="380" rx="24" fill="url(#cardGrad)" stroke="#e0e7ff" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="25" y="45" font-family="system-ui, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">About Japan</text>
    <text x="25" y="85" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#374151" line-height="22">An island nation in East Asia with 14,125 islands. Population: 123.3 million (2023). Capital: Tokyo (metro 37M).</text>
    <text x="25" y="125" dy="0" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#374151">Known for blending ancient traditions (samurai, tea ceremonies) with modern innovation (Shinkansen, robotics, anime).</text>
    <text x="25" y="185" dy="0" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#374151">Geography: volcanoes (Mount Fuji), earthquakes, cherry blossoms.</text>
    <text x="25" y="245" dy="0" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#374151">Government: Constitutional monarchy. Currency: Yen (¥).</text>
  </g>
  <!-- Full-width paragraph -->
  <g transform="translate(60, 640)">
    <rect x="0" y="0" width="1080" height="90" rx="20" fill="url(#cardGrad)" stroke="#e0e7ff" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="40" y="45" font-family="system-ui, Arial, sans-serif" font-size="18" fill="#374151" font-weight="500">Japan, the world’s third-largest economy by nominal GDP, excels in automobiles (Toyota), electronics (Sony), and high-speed rail. Post-WWII, it rose from ashes to tech leader, now tackling aging population, debt, and natural disasters with resilience and innovation.</text>
  </g>
  <!-- GDP row: Left text -->
  <g transform="translate(60, 780)">
    <rect x="0" y="0" width="540" height="320" rx="24" fill="url(#cardGrad)" stroke="#e0e7ff" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="25" y="45" font-family="system-ui, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Economic Snapshot</text>
    <text x="25" y="85" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#374151">Japan’s nominal GDP has remained stable around $4-5T USD amid global shifts, yen fluctuations, and domestic policies like Abenomics.</text>
    <text x="25" y="125" dy="0" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#374151">Key sectors: manufacturing (30% GDP), services (70%). Exports: vehicles, machinery.</text>
    <text x="25" y="175" dy="0" font-family="system-ui, Arial, sans-serif" font-size="16" fill="#374151">Challenges: deflation, high public debt (250% GDP).</text>
  </g>
  <!-- GDP row: Bar chart right -->
  <g transform="translate(660, 780)">
    <rect x="0" y="0" width="500" height="320" rx="24" fill="url(#cardGrad)" stroke="#e0e7ff" stroke-width="1.5" filter="url(#dropShadow)"/>
    <g clip-path="url(#chartClip)">
      <g transform="translate(40, 40)">
        <!-- Axis -->
        <line x1="0" y1="300" x2="440" y2="300" stroke="#64748b" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="300" stroke="#64748b" stroke-width="2"/>
        <!-- Y ticks/labels -->
        <g font-family="system-ui, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="end">
          <text x="-8" y="300" dy="4">0</text>
          <text x="-8" y="231" dy="4">1</text>
          <text x="-8" y="162" dy="4">2</text>
          <text x="-8" y="93" dy="4">3</text>
          <text x="-8" y="24" dy="4">4</text>
          <line x1="0" y1="300" x2="-6" y2="300" stroke="#64748b" stroke-width="1"/>
          <line x1="0" y1="231" x2="-6" y2="231" stroke="#64748b" stroke-width="1"/>
          <line x1="0" y1="162" x2="-6" y2="162" stroke="#64748b" stroke-width="1"/>
          <line x1="0" y1="93" x2="-6" y2="93" stroke="#64748b" stroke-width="1"/>
          <line x1="0" y1="24" x2="-6" y2="24" stroke="#64748b" stroke-width="1"/>
        </g>
        <!-- Bars -->
        <g font-family="system-ui, Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">
          <g transform="translate(0,300)">
            <!-- Data: heights scaled by 350/5.2 ≈67.3 px/T -->
            <!-- 2015:4.44 h=299 -->
            <rect x="10" y="-299" width="34" height="299" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="27" y="315" dy="12">4.44</text>
            <!-- 2016:5.00 h=337 -->
            <rect x="59" y="-337" width="34" height="337" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="76" y="315" dy="12">5.00</text>
            <!-- 2017:4.93 h=332 -->
            <rect x="108" y="-332" width="34" height="332" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="125" y="315" dy="12">4.93</text>
            <!-- 2018:5.04 h=339 -->
            <rect x="157" y="-339" width="34" height="339" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="174" y="315" dy="12">5.04</text>
            <!-- 2019:5.12 h=344 -->
            <rect x="206" y="-344" width="34" height="344" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="223" y="315" dy="12">5.12</text>
            <!-- 2020:5.05 h=340 -->
            <rect x="255" y="-340" width="34" height="340" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="272" y="315" dy="12">5.05</text>
            <!-- 2021:5.04 h=339 -->
            <rect x="304" y="-339" width="34" height="339" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="321" y="315" dy="12">5.04</text>
            <!-- 2022:4.26 h=286 -->
            <rect x="353" y="-286" width="34" height="286" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="370" y="315" dy="12">4.26</text>
            <!-- 2023:4.21 h=283 -->
            <rect x="402" y="-283" width="34" height="283" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="419" y="315" dy="12">4.21</text>
            <!-- 2024:4.03 h=271 -->
            <rect x="451" y="-271" width="34" height="271" fill="url(#barGrad)" rx="4 4 0 0"/>
            <text x="468" y="315" dy="12">4.03</text>
          </g>
          <!-- X labels -->
          <text x="27" y="340" font-weight="600">’15</text>
          <text x="76" y="340" font-weight="600">’16</text>
          <text x="125" y="340" font-weight="600">’17</text>
          <text x="174" y="340" font-weight="600">’18</text>
          <text x="223" y="340" font-weight="600">’19</text>
          <text x="272" y="340" font-weight="600">’20</text>
          <text x="321" y="340" font-weight="600">’21</text>
          <text x="370" y="340" font-weight="600">’22</text>
          <text x="419" y="340" font-weight="600">’23</text>
          <text x="468" y="340" font-weight="600">’24</text>
        </g>
      </g>
    </g>
    <text x="30" y="310" font-family="system-ui, Arial, sans-serif" font-size="15" font-weight="600" fill="#1e293b">Nominal GDP (current US$ trillions), 2015–2024</text>
  </g>
  <!-- Bottom row: Donut left -->
  <g transform="translate(80, 1150)">
    <rect x="0" y="0" width="500" height="500" rx="24" fill="url(#cardGrad)" stroke="#e0e7ff" stroke-width="1.5" filter="url(#dropShadow)"/>
    <!-- Donut center 250,250 -->
    <!-- Hole -->
    <circle cx="250" cy="250" r="75" fill="url(#donutGrad)"/>
    <!-- Japanese 97.5% ~351° start from top (-90°) clockwise? SVG arc counterclockwise default. Use path for slices. -->
    <!-- Japanese: 0 to 351° (almost full, from 0° right, but start top: adjust start -90° -->
    <g font-family="system-ui, Arial, sans-serif">
      <!-- Japanese slice: large arc -->
      <path d="M 250 175 A 175 175 0 1 1 250 175 L 250 250 Z" fill="#ff6b6b" stroke="#ef5350" stroke-width="3" stroke-linejoin="round"/>
      <!-- Chinese 2.16° ~0.038 rad small at end -->
      <path d="M 250 175 L 360 250 A 175 175 0 0 1 362 252 L 250 250 Z" fill="#4ecdc4" stroke="#26c6da" stroke-width="2"/>
      <!-- Vietnamese 1.44° -->
      <path d="M 362 252 A 175 175 0 0 1 365 254 L 250 250 Z" fill="#45b7d1" stroke="#0288d1" stroke-width="2"/>
      <!-- S Korean 1.08° -->
      <path d="M 365 254 A 175 175 0 0 1 367 255 L 250 250 Z" fill="#96ceb4" stroke="#66bb6a" stroke-width="2"/>
      <!-- Other 4.32° back to start -->
      <path d="M 367 255 A 175 175 0 0 1 250 175 L 250 175 Z" fill="#ffeaa7" stroke="#fbc02d" stroke-width="2"/>
    </g>
    <text x="30" y="55" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Population by Ethnicity</text>
    <text x="30" y="82" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#6b7280">(2023 est., %)</text>
    <!-- Legend -->
    <g font-family="system-ui, Arial, sans-serif" font-size="14" fill="#374151">
      <circle cx="40" cy="120" r="8" fill="#ff6b6b"/>
      <text x="60" y="125" font-weight="600">Japanese 97.5%</text>
      <circle cx="40" cy="145" r="8" fill="#4ecdc4"/>
      <text x="60" y="150">Chinese 0.6%</text>
      <circle cx="40" cy="170" r="8" fill="#45b7d1"/>
      <text x="60" y="175">Vietnamese 0.4%</text>
      <circle cx="40" cy="195" r="8" fill="#96ceb4"/>
      <text x="60" y="200">S. Korean 0.3%</text>
      <circle cx="40" cy="220" r="8" fill="#ffeaa7"/>
      <text x="60" y="225">Other 1.2%</text>
    </g>
  </g>
  <!-- Bottom row: Visit right -->
  <g transform="translate(660, 1150)">
    <rect x="0" y="0" width="500" height="500" rx="24" fill="url(#cardGrad)" stroke="#e0e7ff" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text x="30" y="55" font-family="system-ui, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Must-Visit Places</text>
    <g font-family="system-ui, Arial, sans-serif" font-size="16" fill="#374151" font-weight="500" letter-spacing="0.3">
      <text x="45" y="105">• Tokyo: Shibuya Crossing, Tokyo Tower, Akihabara</text>
      <text x="45" y="135" dy="0">• Kyoto: Temples (Kinkaku-ji), geisha, bamboo grove</text>
      <text x="45" y="165" dy="0">• Osaka: Street food (takoyaki), Osaka Castle</text>
      <text x="45" y="195" dy="0">• Hiroshima/Miyajima: Peace Park, floating torii</text>
      <text x="45" y="225" dy="0">• Mt. Fuji/Hakone: Climb/hike, onsen hot springs</text>
      <text x="45" y="255" dy="0">• Hokkaido: Sapporo snow fest, lavender, wildlife</text>
    </g>
  </g>
  <!-- Source note -->
  <text x="600" y="1760" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="400">Sources: World Bank (GDP), CIA World Factbook (population/ethnicity), Statistics Bureau of Japan. 2024 GDP preliminary. Map stylized.</text>
</svg>
