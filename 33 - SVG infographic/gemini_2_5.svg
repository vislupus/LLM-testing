<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Infographic about Japan</title>
  <desc>A single-page static SVG infographic providing a glance at Japan's geography, economy, and demographics.</desc>

  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#111827" flood-opacity="0.05" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    
    <symbol id="icon-pin" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 20l-4.95-6.05a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="#F9FAFB"/>
  <path d="M0,1800 C300,1700 600,1800 900,1700 C1200,1600 1200,1800 1200,1800 L0,1800 Z" fill="#F3F4F6"/>
  <path d="M1200,0 C900,100 600,0 300,100 C0,200 0,0 0,0 L1200,0 Z" fill="#F3F4F6"/>

  <!-- Main Title -->
  <text x="600" y="100" font-size="48" font-weight="bold" text-anchor="middle" fill="#111827">Japan at a Glance</text>

  <!-- === ROW 1: MAP & INTRO === -->
  <g id="row1">
    <!-- Card 1: Map -->
    <g id="map-card" transform="translate(50, 160)">
      <rect width="530" height="380" rx="16" fill="white" filter="url(#cardShadow)"/>
      <text x="30" y="50" font-size="22" font-weight="600" fill="#1F2937">Map of Japan</text>
      <g id="japan-map" transform="translate(100, 80) scale(1.1)">
        <path d="M220,10 L235,15 L245,35 L225,50 L210,40 L215,20 Z" fill="url(#mapGradient)" stroke="#10B981" stroke-width="1.5"/>
        <text x="225" y="65" font-size="12" fill="#6B7280" text-anchor="middle">Hokkaido</text>
        
        <path d="M200,70 C190,90 180,110 160,130 C140,150 120,180 110,210 C100,240 110,260 130,270 C150,280 170,270 185,250 C200,230 210,200 215,170 C220,140 215,110 205,80 Z" fill="url(#mapGradient)" stroke="#10B981" stroke-width="1.5"/>
        <text x="165" y="180" font-size="12" fill="#6B7280" text-anchor="middle">Honshu</text>
        
        <path d="M110,280 C100,285 95,295 105,300 C115,305 125,295 120,285 Z" fill="url(#mapGradient)" stroke="#10B981" stroke-width="1.5"/>
        <text x="90" y="295" font-size="10" fill="#6B7280">Shikoku</text>
        
        <path d="M70,260 C60,270 50,290 60,310 C70,330 90,320 100,300 C90,280 80,270 70,260 Z" fill="url(#mapGradient)" stroke="#10B981" stroke-width="1.5"/>
        <text x="60" y="290" font-size="10" fill="#6B7280">Kyushu</text>
        
        <!-- Cities -->
        <g id="cities">
          <!-- Tokyo -->
          <circle cx="195" cy="155" r="4" fill="#EF4444"/>
          <line x1="195" y1="155" x2="230" y2="140" stroke="#6B7280" stroke-width="1"/>
          <text x="235" y="138" font-size="12" fill="#374151">Tokyo</text>
          <!-- Yokohama -->
          <circle cx="193" cy="160" r="3" fill="#F97316"/>
          <line x1="193" y1="160" x2="230" y2="170" stroke="#6B7280" stroke-width="1"/>
          <text x="235" y="174" font-size="12" fill="#374151">Yokohama</text>
          <!-- Nagoya -->
          <circle cx="170" cy="175" r="3" fill="#FBBF24"/>
          <line x1="170" y1="175" x2="170" y2="195" stroke="#6B7280" stroke-width="1"/>
          <text x="170" y="205" font-size="12" fill="#374151" text-anchor="middle">Nagoya</text>
          <!-- Osaka -->
          <circle cx="150" cy="190" r="4" fill="#8B5CF6"/>
          <line x1="150" y1="190" x2="120" y2="200" stroke="#6B7280" stroke-width="1"/>
          <text x="115" y="204" font-size="12" fill="#374151" text-anchor="end">Osaka</text>
        </g>
      </g>
    </g>

    <!-- Card 2: Intro Text -->
    <g id="intro-text-card" transform="translate(620, 160)">
      <rect width="530" height="380" rx="16" fill="white" filter="url(#cardShadow)"/>
      <text x="30" y="50" font-size="22" font-weight="600" fill="#1F2937">An Overview</text>
      <foreignObject x="30" y="80" width="470" height="280">
        <p xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px; color:#4B5563; line-height:1.6;">
          Japan is an island country in East Asia. Located in the Pacific Ocean, it lies off the eastern coast of the Asian continent and stretches from the Sea of Okhotsk in the north to the East China Sea and Taiwan in the south.
          <br/><br/>
          Comprising a stratovolcanic archipelago of about 6,852 islands, its five main islands are Hokkaido, Honshu (the "mainland"), Shikoku, Kyushu, and Okinawa. Tokyo is the nation's capital and largest city, followed by Yokohama, Osaka, and Nagoya.
        </p>
      </foreignObject>
    </g>
  </g>

  <!-- === FULL-WIDTH PARAGRAPH === -->
  <g id="full-width-paragraph" transform="translate(50, 570)">
    <rect width="1100" height="150" rx="16" fill="white" filter="url(#cardShadow)"/>
    <foreignObject x="30" y="20" width="1040" height="110">
      <p xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px; color:#4B5563; line-height:1.6;">
        Renowned for its unique blend of ancient traditions and cutting-edge technology, Japan offers a captivating experience. From serene temples and tranquil gardens to bustling cities with futuristic skylines, the country is a study in contrasts. Its rich cultural heritage, including disciplines like tea ceremony and martial arts, coexists with a dynamic pop culture of anime, manga, and video games that has achieved global influence.
      </p>
    </foreignObject>
  </g>

  <!-- === ROW 2: ECONOMY & GDP CHART === -->
  <g id="row2" transform="translate(50, 750)">
    <!-- Card 3: Economy Text -->
    <g id="economy-text-card">
      <rect width="530" height="440" rx="16" fill="white" filter="url(#cardShadow)"/>
      <text x="30" y="50" font-size="22" font-weight="600" fill="#1F2937">Economic Snapshot</text>
      <foreignObject x="30" y="80" width="470" height="320">
        <p xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px; color:#4B5563; line-height:1.6;">
          Japan has the fourth-largest nominal GDP in the world and is a global leader in automotive, electronics, and robotics industries. The Japanese yen is the third most-traded currency.
          <br/><br/>
          After a period of rapid post-war growth, the economy has faced relative stagnation since the 1990s. The chart opposite shows the fluctuating but generally stable nominal GDP in recent years, with a notable downturn post-2022 reflecting global economic shifts and currency depreciation.
        </p>
      </foreignObject>
    </g>
    
    <!-- Card 4: Bar Chart -->
    <g id="gdp-chart-card" transform="translate(570, 0)">
      <rect width="530" height="440" rx="16" fill="white" filter="url(#cardShadow)"/>
      <text x="30" y="50" font-size="22" font-weight="600" fill="#1F2937">Nominal GDP (Current US$ Trillions)</text>
      <g id="bar-chart" transform="translate(60, 380)">
        <!-- Axes -->
        <path d="M0,0 H440" stroke="#D1D5DB" stroke-width="1.5"/>
        <path d="M0,0 V-300" stroke="#D1D5DB" stroke-width="1.5"/>
        <g font-size="12" fill="#6B7280" text-anchor="middle">
          <text x="0" y="-293" dy="0.3em">6</text>
          <path d="M-3, -300 H440" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 4"/>
          <text x="0" y="-243" dy="0.3em">5</text>
          <path d="M-3, -250 H440" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 4"/>
          <text x="0" y="-193" dy="0.3em">4</text>
          <path d="M-3, -200 H440" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 4"/>
          <text x="0" y="-143" dy="0.3em">3</text>
          <path d="M-3, -150 H440" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 4"/>
          <text x="0" y="-93" dy="0.3em">2</text>
          <path d="M-3, -100 H440" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 4"/>
          <text x="0" y="-43" dy="0.3em">1</text>
          <path d="M-3, -50 H440" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 4"/>
        </g>
        
        <!-- Data and Bars -->
        <g id="bars" text-anchor="middle" font-size="10" fill="white" font-weight="500">
          <g transform="translate(22, 0)">
            <rect y="-185" width="30" height="185" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-188">$4.44</text><text x="15" y="15">'15</text>
          </g>
          <g transform="translate(66, 0)">
            <rect y="-208.3" width="30" height="208.3" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-211.3">$5.00</text><text x="15" y="15">'16</text>
          </g>
          <g transform="translate(110, 0)">
            <rect y="-205.4" width="30" height="205.4" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-208.4">$4.93</text><text x="15" y="15">'17</text>
          </g>
          <g transform="translate(154, 0)">
            <rect y="-210" width="30" height="210" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-213">$5.04</text><text x="15" y="15">'18</text>
          </g>
          <g transform="translate(198, 0)">
            <rect y="-213.3" width="30" height="213.3" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-216.3">$5.12</text><text x="15" y="15">'19</text>
          </g>
          <g transform="translate(242, 0)">
            <rect y="-210.4" width="30" height="210.4" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-213.4">$5.05</text><text x="15" y="15">'20</text>
          </g>
          <g transform="translate(286, 0)">
            <rect y="-210" width="30" height="210" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-213">$5.04</text><text x="15" y="15">'21</text>
          </g>
          <g transform="translate(330, 0)">
            <rect y="-177.5" width="30" height="177.5" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-180.5">$4.26</text><text x="15" y="15">'22</text>
          </g>
          <g transform="translate(374, 0)">
            <rect y="-175.4" width="30" height="175.4" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-178.4">$4.21</text><text x="15" y="15">'23</text>
          </g>
          <g transform="translate(418, 0)">
            <rect y="-167.9" width="30" height="167.9" fill="url(#barGradient)" rx="2"/>
            <text x="15" y="-170.9">$4.03</text><text x="15" y="15">'24</text>
          </g>
        </g>
      </g>
    </g>
  </g>
  
  <!-- === ROW 3: POPULATION & TOURISM === -->
  <g id="row3" transform="translate(50, 1220)">
    <!-- Card 5: Pie Chart -->
    <g id="population-chart-card">
      <rect width="530" height="440" rx="16" fill="white" filter="url(#cardShadow)"/>
      <text x="30" y="50" font-size="22" font-weight="600" fill="#1F2937">Population by Nationality</text>
      <g id="donut-chart" transform="translate(180, 240)">
        <circle cx="0" cy="0" r="100" fill="#2563EB"/> <!-- Japanese 97.5% -->
        <path d="M 0 -100 A 100 100 0 0 1 10.45 99.45" fill="#F97316"/> <!-- Other 1.2% -->
        <path d="M 10.45 99.45 A 100 100 0 0 1 20.9 97.78" fill="#10B981"/> <!-- S. Korean 0.3% -->
        <path d="M 20.9 97.78 A 100 100 0 0 1 29.8 95.45" fill="#FBBF24"/> <!-- Vietnamese 0.4% -->
        <path d="M 29.8 95.45 A 100 100 0 0 1 42.05 90.72" fill="#D946EF"/> <!-- Chinese 0.6% -->
        <circle cx="0" cy="0" r="60" fill="white"/>
        <text text-anchor="middle" font-size="28" font-weight="bold" fill="#1F2937" y="10">97.5%</text>
        <text text-anchor="middle" font-size="14" fill="#6B7280" y="30">Japanese</text>
      </g>
      <!-- Legend -->
      <g id="pie-legend" transform="translate(360, 140)" font-size="14" fill="#4B5563">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#2563EB"/>
        <text x="20" y="10">Japanese (97.5%)</text>
        <rect x="0" y="30" width="12" height="12" rx="2" fill="#D946EF"/>
        <text x="20" y="40">Chinese (0.6%)</text>
        <rect x="0" y="60" width="12" height="12" rx="2" fill="#FBBF24"/>
        <text x="20" y="70">Vietnamese (0.4%)</text>
        <rect x="0" y="90" width="12" height="12" rx="2" fill="#10B981"/>
        <text x="20" y="100">South Korean (0.3%)</text>
        <rect x="0" y="120" width="12" height="12" rx="2" fill="#F97316"/>
        <text x="20" y="130">Other (1.2%)</text>
      </g>
    </g>
    
    <!-- Card 6: Tourism -->
    <g id="tourism-card" transform="translate(570, 0)">
      <rect width="530" height="440" rx="16" fill="white" filter="url(#cardShadow)"/>
      <text x="30" y="50" font-size="22" font-weight="600" fill="#1F2937">Popular Destinations</text>
      <foreignObject x="30" y="80" width="470" height="50">
        <p xmlns="http://www.w3.org/1999/xhtml" style="font-size:16px; color:#4B5563; line-height:1.6;">
          Japan offers a diverse range of attractions. Explore these must-visit destinations:
        </p>
      </foreignObject>
      <g id="destinations-list" transform="translate(50, 150)" font-size="16" fill="#374151">
        <g transform="translate(0, 0)">
          <use href="#icon-pin" width="20" height="20" fill="#34D399"/>
          <text x="30" y="15">Tokyo: The bustling, ultramodern capital.</text>
        </g>
        <g transform="translate(0, 40)">
          <use href="#icon-pin" width="20" height="20" fill="#34D399"/>
          <text x="30" y="15">Kyoto: The heart of traditional Japan.</text>
        </g>
        <g transform="translate(0, 80)">
          <use href="#icon-pin" width="20" height="20" fill="#34D399"/>
          <text x="30" y="15">Osaka: Famous for its food, nightlife, and castle.</text>
        </g>
        <g transform="translate(0, 120)">
          <use href="#icon-pin" width="20" height="20" fill="#34D399"/>
          <text x="30" y="15">Hiroshima / Miyajima: History and scenic beauty.</text>
        </g>
        <g transform="translate(0, 160)">
          <use href="#icon-pin" width="20" height="20" fill="#34D399"/>
          <text x="30" y="15">Mount Fuji / Hakone: Iconic views and hot springs.</text>
        </g>
        <g transform="translate(0, 200)">
          <use href="#icon-pin" width="20" height="20" fill="#34D399"/>
          <text x="30" y="15">Hokkaido: Known for its wild nature and skiing.</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Source Note -->
  <text x="600" y="1750" text-anchor="middle" font-size="12" fill="#9CA3AF">
    Source: IMF World Economic Outlook (April 2024), Statistics Bureau of Japan (2023). Data is illustrative.
  </text>
</svg>