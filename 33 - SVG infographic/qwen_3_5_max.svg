<svg width="1200" height="1800" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f8ff" />
      <stop offset="100%" stop-color="#e6f7ff" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003366" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feFlood flood-color="rgba(0,0,0,0.1)" />
      <feComposite in2="offsetblur" operator="in" />
      <feComposite in="SourceGraphic" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Subtle waves -->
  <path d="M0,1200 Q300,1100 600,1200 T1200,1200 L1200,1800 L0,1800 Z" fill="#e6f7ff" opacity="0.7" />
  <path d="M0,1000 Q300,900 600,1000 T1200,1000 L1200,1800 L0,1800 Z" fill="#d4edff" opacity="0.5" />
  
  <!-- Title -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#titleGradient)">Japan at a Glance</text>
  
  <!-- First Row: Map and Text -->
  <g transform="translate(50, 120)">
    <!-- Map of Japan -->
    <g transform="translate(0, 0)">
      <path d="M200,200 C250,150 350,180 400,220 C450,260 500,350 450,400 C400,450 300,500 250,450 C200,400 180,300 200,200 Z" fill="#d4edff" stroke="#0066cc" stroke-width="2" />
      <path d="M500,300 C520,280 550,290 570,310 C590,330 600,370 580,400 C560,430 520,450 500,430 C480,410 480,360 500,300 Z" fill="#d4edff" stroke="#0066cc" stroke-width="2" />
      <path d="M600,400 C620,380 650,390 670,410 C690,430 700,470 680,500 C660,530 620,550 600,530 C580,510 580,460 600,400 Z" fill="#d4edff" stroke="#0066cc" stroke-width="2" />
      <path d="M300,550 C320,530 350,540 370,560 C390,580 400,620 380,650 C360,680 320,700 300,680 C280,660 280,610 300,550 Z" fill="#d4edff" stroke="#0066cc" stroke-width="2" />
      
      <!-- City markers -->
      <circle cx="450" cy="300" r="8" fill="#ff4757" />
      <text x="460" y="295" font-family="Arial, sans-serif" font-size="14" fill="#000">Tokyo</text>
      <circle cx="430" cy="320" r="8" fill="#ff4757" />
      <text x="440" y="315" font-family="Arial, sans-serif" font-size="14" fill="#000">Yokohama</text>
      <circle cx="350" cy="420" r="8" fill="#ff4757" />
      <text x="360" y="415" font-family="Arial, sans-serif" font-size="14" fill="#000">Osaka</text>
      <circle cx="400" cy="380" r="8" fill="#ff4757" />
      <text x="410" y="375" font-family="Arial, sans-serif" font-size="14" fill="#000">Nagoya</text>
    </g>
    
    <!-- Explanatory Text -->
    <text x="600" y="200" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="start" width="500">
      Japan, an island nation in East Asia, is renowned for its rich cultural heritage, technological innovation, and natural beauty. 
      With a population of approximately 125 million, it boasts a unique blend of ancient traditions and modern advancements. 
      The country is a global leader in automotive manufacturing, robotics, and electronics, while maintaining deep respect for its historical roots.
    </text>
  </g>
  
  <!-- Full-width Paragraph -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="20" fill="#222" text-anchor="middle" width="1000" style="text-align: center; line-height: 1.5">
    Japan's cultural identity is deeply rooted in Shinto and Buddhist traditions, reflected in its architecture, cuisine, and arts. 
    The country experiences four distinct seasons, each celebrated through festivals and seasonal foods. 
    Despite its high population density in urban areas, Japan maintains vast natural landscapes including mountains, forests, and coastlines. 
    Its transportation infrastructure, including the famous Shinkansen bullet trains, is among the most efficient in the world.
  </text>
  
  <!-- Second Row: Text and Bar Chart -->
  <g transform="translate(50, 570)">
    <!-- Economic Text -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="start" width="500">
      Japan has the world's third-largest economy by nominal GDP. While growth has been modest in recent years, 
      the country maintains a strong industrial base and high standard of living. 
      Key sectors include automotive, electronics, and advanced manufacturing. 
      Japan's aging population and low birth rate present significant economic challenges.
    </text>
    
    <!-- Bar Chart -->
    <g transform="translate(600, 0)">
      <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#003366">Nominal GDP (US$ Trillions)</text>
      
      <!-- Y-axis -->
      <line x1="50" y1="50" x2="50" y2="350" stroke="#666" stroke-width="1" />
      <text x="40" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#333">0</text>
      <text x="40" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#333">1.0</text>
      <text x="40" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#333">2.0</text>
      <text x="40" y="125" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#333">3.0</text>
      <text x="40" y="50" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#333">4.0</text>
      <text x="40" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#333">5.0</text>
      
      <!-- X-axis -->
      <line x1="50" y1="350" x2="550" y2="350" stroke="#666" stroke-width="1" />
      
      <!-- Bars -->
      <g>
        <rect x="70" y="115" width="40" height="235" fill="url(#barGradient)" rx="2" />
        <text x="90" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2015</text>
        <text x="90" y="100" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">4.44</text>
      </g>
      <g>
        <rect x="120" y="85" width="40" height="265" fill="url(#barGradient)" rx="2" />
        <text x="140" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2016</text>
        <text x="140" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">5.00</text>
      </g>
      <g>
        <rect x="170" y="90" width="40" height="260" fill="url(#barGradient)" rx="2" />
        <text x="190" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2017</text>
        <text x="190" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">4.93</text>
      </g>
      <g>
        <rect x="220" y="82" width="40" height="268" fill="url(#barGradient)" rx="2" />
        <text x="240" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2018</text>
        <text x="240" y="67" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">5.04</text>
      </g>
      <g>
        <rect x="270" y="75" width="40" height="275" fill="url(#barGradient)" rx="2" />
        <text x="290" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2019</text>
        <text x="290" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">5.12</text>
      </g>
      <g>
        <rect x="320" y="85" width="40" height="265" fill="url(#barGradient)" rx="2" />
        <text x="340" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2020</text>
        <text x="340" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">5.05</text>
      </g>
      <g>
        <rect x="370" y="85" width="40" height="265" fill="url(#barGradient)" rx="2" />
        <text x="390" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2021</text>
        <text x="390" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">5.04</text>
      </g>
      <g>
        <rect x="420" y="135" width="40" height="215" fill="url(#barGradient)" rx="2" />
        <text x="440" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2022</text>
        <text x="440" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">4.26</text>
      </g>
      <g>
        <rect x="470" y="145" width="40" height="205" fill="url(#barGradient)" rx="2" />
        <text x="490" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2023</text>
        <text x="490" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">4.21</text>
      </g>
      <g>
        <rect x="520" y="155" width="40" height="195" fill="url(#barGradient)" rx="2" />
        <text x="540" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2024</text>
        <text x="540" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">4.03</text>
      </g>
    </g>
  </g>
  
  <!-- Third Row: Pie Chart and Text -->
  <g transform="translate(50, 970)">
    <!-- Population Chart -->
    <g transform="translate(0, 0)">
      <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#003366">Population Composition</text>
      
      <!-- Donut Chart -->
      <g transform="translate(200, 200)">
        <circle cx="0" cy="0" r="150" fill="none" stroke="#0066cc" stroke-width="2" />
        <path d="M0,-150 A150,150 0 1,1 145.5,-37.5 L0,0 Z" fill="#4fc3f7" />
        <path d="M145.5,-37.5 A150,150 0 0,1 148.5,-15 L0,0 Z" fill="#00bcd4" />
        <path d="M148.5,-15 A150,150 0 0,1 149.5,-5 L0,0 Z" fill="#009688" />
        <path d="M149.5,-5 A150,150 0 0,1 150,0 L0,0 Z" fill="#006064" />
        <path d="M150,0 A150,150 0 0,1 0,0 Z" fill="#4fc3f7" opacity="0.3" />
        
        <!-- Legend -->
        <g transform="translate(150, 100)">
          <rect x="0" y="0" width="15" height="15" fill="#4fc3f7" />
          <text x="25" y="12" font-family="Arial, sans-serif" font-size="14" fill="#333">Japanese 97.5%</text>
          <rect x="0" y="25" width="15" height="15" fill="#00bcd4" />
          <text x="25" y="37" font-family="Arial, sans-serif" font-size="14" fill="#333">Chinese 0.6%</text>
          <rect x="0" y="50" width="15" height="15" fill="#009688" />
          <text x="25" y="62" font-family="Arial, sans-serif" font-size="14" fill="#333">Vietnamese 0.4%</text>
          <rect x="0" y="75" width="15" height="15" fill="#006064" />
          <text x="25" y="87" font-family="Arial, sans-serif" font-size="14" fill="#333">South Korean 0.3%</text>
          <rect x="0" y="100" width="15" height="15" fill="#4fc3f7" opacity="0.3" />
          <text x="25" y="112" font-family="Arial, sans-serif" font-size="14" fill="#333">Other 1.2%</text>
        </g>
      </g>
    </g>
    
    <!-- Travel Text -->
    <text x="500" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#003366">Top Destinations in Japan</text>
    <text x="500" y="150" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="start" width="500">
      • Tokyo: Modern skyscrapers, historic temples, and vibrant food scene
      • Kyoto: Ancient capital with 1,600+ Buddhist temples and traditional geisha districts
      • Osaka: Culinary capital known for street food and lively atmosphere
      • Hiroshima/Miyajima: Peace Memorial Park and the iconic "floating" Itsukushima Shrine
      • Mount Fuji/Hakone: Japan's highest peak and scenic hot spring region
      • Hokkaido: Natural beauty, winter sports, and unique cuisine
    </text>
  </g>
  
  <!-- Source Note -->
  <text x="600" y="1350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666" opacity="0.7">Source: World Bank, United Nations, Japan Statistics Bureau | Data as of 2024</text>
</svg>