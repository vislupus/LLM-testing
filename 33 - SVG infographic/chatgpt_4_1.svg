<svg width="1200" height="1800" viewBox="0 0 1200 1800" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- ===================== Background ===================== -->

  <defs>
    <!-- Soft gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#e5eef7"/>
    </linearGradient>
    <!-- Soft wave pattern -->
    <pattern id="waves" x="0" y="0" width="280" height="120" patternUnits="userSpaceOnUse">
      <path d="M0,60 Q70,0 140,60 T280,60" fill="none" stroke="#e2e9f0" stroke-width="7"/>
    </pattern>
    <!-- Button gradient -->
    <linearGradient id="btn" x1="0" y1="24" x2="60" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4863"/>
      <stop offset="1" stop-color="#F17623"/>
    </linearGradient>
    <!-- Title underline -->
    <linearGradient id="underline" x1="480" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4863" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F17623" stop-opacity="0.20"/>
    </linearGradient>
    <!-- Bar chart color -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8bb7e0"/>
      <stop offset="1" stop-color="#33577a"/>
    </linearGradient>
    <!-- GDP marker circle -->
    <linearGradient id="gdpCircle" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#33577a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8bb7e0" stop-opacity="0.93"/>
    </linearGradient>
    <!-- Donut slices -->
    <linearGradient id="sliceJP" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4863"/><stop offset="1" stop-color="#F17623"/>
    </linearGradient>
    <linearGradient id="sliceCN" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4479C4"/><stop offset="1" stop-color="#00A6D6"/>
    </linearGradient>
    <linearGradient id="sliceVN" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#008E56"/><stop offset="1" stop-color="#61C679"/>
    </linearGradient>
    <linearGradient id="sliceKR" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#901B0F"/><stop offset="1" stop-color="#EC4863"/>
    </linearGradient>
    <linearGradient id="sliceOT" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7BDC5"/><stop offset="1" stop-color="#797F86"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="1800" fill="url(#waves)" opacity="0.13"/>
  

  <!-- ===================== Top: Title ===================== -->
  <g>
    <text x="600" y="90" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="62" letter-spacing="2"
      fill="#24364d">Japan at a glance</text>
    <rect x="480" y="110" width="240" height="13" fill="url(#underline)" rx="7"/>
  </g>
  
  <!-- ===================== 1st Row: Map + Intro text ===================== -->
  <g>
    <rect x="120" y="180" width="430" height="380" rx="32" fill="#fff" fill-opacity="0.91" stroke="#e2e9f0" />
    <!-- Stylized Japan map -->
    <g transform="translate(155 220)">
      <!-- Main islands: Honshu, Hokkaido, Kyushu, Shikoku, Okinawa (very simplified) -->
      <path d="M145 25 Q140 18 132 25 Q121 34 126 48 Q132 65 148 65 Q170 68 200 54 Q217 44 228 27 Q246 0 236 38 Q230 65 254 96 Q263 110 240 110 Q204 109 190 134 Q179 152 210 175 Q232 192 255 194 Q254 207 268 215 Q264 236 284 245 Q293 257 311 258 Q316 249 309 238 Q300 224 303 216 Q308 202 292 198 Q307 186 301 167 Q291 142 270 131 Q247 118 256 100 Q263 86 258 58 Q271 72 288 72 Q309 70 284 48 Q270 37 255 28 Q239 16 251 7 Q264 -4 271 -10 Q280 -17 283 -28 Q275 -31 263 -30 Q248 -28 244 -18 Q235 -4 221 1 Q205 6 197 23 Q194 34 175 30 Q163 24 155 25 Z" fill="#B6D4EE" stroke="#33577a" stroke-width="2"/>
      <!-- Hokkaido -->
      <ellipse cx="145" cy="15" rx="19" ry="10" fill="#96C6EB" />
      <!-- Kyushu -->
      <ellipse cx="113" cy="175" rx="18" ry="10" fill="#89B6DD" />
      <!-- Shikoku -->
      <ellipse cx="180" cy="152" rx="12" ry="6" fill="#7EA9CE" />
      <!-- Okinawa -->
      <ellipse cx="160" cy="260" rx="10" ry="4" fill="#70A1B7" />
      <!-- Cities (approximate, for style rather than accuracy) -->
      <g>
        <!-- Tokyo -->
        <circle cx="214" cy="67" r="10" fill="#EC4863" filter="url(#shadowTokyo)" />
        <text x="232" y="72" font-family="sans-serif" font-size="21" fill="#334" font-weight="700">Tokyo</text>
        <!-- Yokohama -->
        <circle cx="205" cy="87" r="8" fill="#F17623"/>
        <text x="222" y="95" font-family="sans-serif" font-size="18" fill="#334" font-weight="600">Yokohama</text>
        <!-- Osaka -->
        <circle cx="167" cy="138" r="8" fill="#8bb7e0"/>
        <text x="180" y="143" font-family="sans-serif" font-size="18" fill="#334" font-weight="600">Osaka</text>
        <!-- Nagoya -->
        <circle cx="191" cy="106" r="8" fill="#00A6D6"/>
        <text x="206" y="114" font-family="sans-serif" font-size="18" fill="#334" font-weight="600">Nagoya</text>
      </g>
    </g>
    <!-- Japan info card -->
    <rect x="600" y="180" width="470" height="380" rx="32" fill="#fff" fill-opacity="0.91" stroke="#e2e9f0" />
    <g transform="translate(630 222)">
      <!-- Flag circle -->
      <circle cx="35" cy="35" r="34" fill="#fff" stroke="#e5e5e5"/>
      <circle cx="35" cy="35" r="18" fill="#EC4863"/>
      <!-- Basic info, title -->
      <text x="82" y="42" font-family="sans-serif" font-size="30" font-weight="bold" fill="#24364d">Japan</text>
      <text x="0" y="95" font-family="sans-serif" font-size="21" fill="#516386">Japan is an island nation in East<br/>Asia with a rich history, diverse <tspan x="0" dy="1.2em">culture,</tspan> and more than 125 million <tspan x="0" dy="1.2em">inhabitants.</tspan>
      <tspan x="0" dy="1.2em">Known for technology, pop culture,</tspan> <tspan x="0" dy="1.2em">traditions, and beautiful landscapes.</tspan>
      <tspan x="0" dy="1.2em">GDP 4th in the world.</tspan>
      </text>
    </g>
  </g>
  
  <!-- ===================== Full-width Paragraph ===================== -->
  <rect x="120" y="600" width="950" height="85" rx="20" fill="#fff" fill-opacity="0.93" stroke="#e2e9f0" />
  <text x="160" y="655" font-family="sans-serif" font-size="25" fill="#334A6D" font-weight="500">
    Japan blends ancient tradition and cutting-edge innovation, offering vibrant urban centers alongside scenic countryside, historic temples, and unique cuisine. It is a global economic powerhouse and a beloved destination for travelers.
  </text>
  
  <!-- ===================== Second Row: Text + Bar Chart ===================== -->
  <g>
    <rect x="120" y="730" width="475" height="360" rx="32" fill="#fff" fill-opacity="0.92" stroke="#e2e9f0" />
    <!-- Section label -->
    <text x="170" y="785" font-family="sans-serif" font-size="29" fill="#24364d" font-weight="700">Economy</text>
    <!-- Section description -->
    <text x="170" y="830" font-family="sans-serif" font-size="22" fill="#576B85">
Japan has one of the world's largest economies. Main exports include automobiles, electronics, and robotics. GDP fluctuates with currency rates, economic reforms, and global trends.
    </text>
    <!-- Icon: Yen symbol in a gradient button (top-right of this card) -->
    <circle cx="560" cy="790" r="28" fill="url(#btn)" filter="url(#btnShadow)"/>
    <text x="546" y="806" font-family="sans-serif" font-size="32" font-weight="bold" fill="#fff" opacity="0.93">¥</text>
    <!-- GDP bar chart -->
    <rect x="635" y="730" width="435" height="360" rx="32" fill="#fff" fill-opacity="0.92" stroke="#e2e9f0" />
    <g transform="translate(675 800)">
      <text x="0" y="-25" font-family="sans-serif" font-size="24" fill="#33577a" font-weight="700">Nominal GDP (US$T)</text>
      <!-- Y axis -->
      <text x="-23" y="20" font-size="15" fill="#6E8896" text-anchor="end">6</text>
      <line x1="9" y1="14" x2="385" y2="14" stroke="#e0e4eb" stroke-width="1.4"/>
      <text x="-23" y="54" font-size="15" fill="#6E8896" text-anchor="end">5</text>
      <line x1="9" y1="48" x2="385" y2="48" stroke="#e0e4eb" stroke-width="1.4"/>
      <text x="-23" y="88" font-size="15" fill="#6E8896" text-anchor="end">4</text>
      <line x1="9" y1="82" x2="385" y2="82" stroke="#e0e4eb" stroke-width="1.4"/>
      <!-- Bars
         Bar heights: (6 - value) * 34 -->
      <!-- 2015 4.44 -->
      <rect x="18" y="34" width="30" height="48" rx="8" fill="url(#bar)" />
      <!-- 2016 5.00 -->
      <rect x="60" y="17" width="30" height="65" rx="8" fill="url(#bar)" />
      <!-- 2017 4.93 -->
      <rect x="102" y="19" width="30" height="63" rx="8" fill="url(#bar)" />
      <!-- 2018 5.04 -->
      <rect x="144" y="16" width="30" height="66" rx="8" fill="url(#bar)" />
      <!-- 2019 5.12 -->
      <rect x="186" y="14" width="30" height="68" rx="8" fill="url(#bar)" />
      <!-- 2020 5.05 -->
      <rect x="228" y="16" width="30" height="66" rx="8" fill="url(#bar)" />
      <!-- 2021 5.04 -->
      <rect x="270" y="16" width="30" height="66" rx="8" fill="url(#bar)" />
      <!-- 2022 4.26 -->
      <rect x="312" y="47" width="30" height="35" rx="8" fill="url(#bar)" />
      <!-- 2023 4.21 -->
      <rect x="354" y="49" width="30" height="33" rx="8" fill="url(#bar)" />
      <!-- 2024 4.03 -->
      <rect x="396" y="55" width="30" height="27" rx="8" fill="url(#bar)" />
      <!-- Top value circles -->
      <circle cx="33" cy="34" r="8" fill="url(#gdpCircle)" />
      <circle cx="75" cy="17" r="8" fill="url(#gdpCircle)" />
      <circle cx="117" cy="19" r="8" fill="url(#gdpCircle)" />
      <circle cx="159" cy="16" r="8" fill="url(#gdpCircle)" />
      <circle cx="201" cy="14" r="8" fill="url(#gdpCircle)" />
      <circle cx="243" cy="16" r="8" fill="url(#gdpCircle)" />
      <circle cx="285" cy="16" r="8" fill="url(#gdpCircle)" />
      <circle cx="327" cy="47" r="8" fill="url(#gdpCircle)" />
      <circle cx="369" cy="49" r="8" fill="url(#gdpCircle)" />
      <circle cx="411" cy="55" r="8" fill="url(#gdpCircle)" />
      <!-- Years (X axis) -->
      <text x="33" y="110" font-size="14" fill="#767D85" text-anchor="middle">2015</text>
      <text x="75" y="110" font-size="14" fill="#767D85" text-anchor="middle">2016</text>
      <text x="117" y="110" font-size="14" fill="#767D85" text-anchor="middle">2017</text>
      <text x="159" y="110" font-size="14" fill="#767D85" text-anchor="middle">2018</text>
      <text x="201" y="110" font-size="14" fill="#767D85" text-anchor="middle">2019</text>
      <text x="243" y="110" font-size="14" fill="#767D85" text-anchor="middle">2020</text>
      <text x="285" y="110" font-size="14" fill="#767D85" text-anchor="middle">2021</text>
      <text x="327" y="110" font-size="14" fill="#767D85" text-anchor="middle">2022</text>
      <text x="369" y="110" font-size="14" fill="#767D85" text-anchor="middle">2023</text>
      <text x="411" y="110" font-size="14" fill="#767D85" text-anchor="middle">2024</text>
    </g>
    <!-- Caption -->
    <text x="920" y="1150" font-size="17" font-family="sans-serif" fill="#8690a8">IMF, annual data</text>
  </g>
  
  <!-- ===================== Third Row: Pie/Donut Chart + Visit text ===================== -->
  <g>
    <rect x="120" y="1180" width="470" height="390" rx="32" fill="#fff" fill-opacity="0.93" stroke="#e2e9f0" />
    <text x="160" y="1238" font-family="sans-serif" font-size="28" fill="#334A6F" font-weight="700">Population Composition</text>
    
    <!-- Pie chart (donut) -->
    <g transform="translate(350 1370)">
      <!-- Donut background -->
      <circle cx="0" cy="0" r="110" fill="#f5f9fc"/>
      <!-- Angles: JP=351°, CN=2.2°, VN=1.4°, KR=1.1°, Other=4.3° -->
      <!-- Starting at -90deg (12 o'clock), sweep arcs -->
      <!-- Japanese 97.5%: 0 to 351 -->
      <path d="M0,-110
                A110,110 0 1,1 100.9,40.9"
            fill="none" stroke="url(#sliceJP)" stroke-width="42"/>
      <!-- Chinese 0.6%: 351 to 353.2 -->
      <path d="M100.9,40.9
                A110,110 0 0,1 100.1,44.7"
            fill="none" stroke="url(#sliceCN)" stroke-width="42"/>
      <!-- Vietnamese 0.4%: 353.2 to 354.6 -->
      <path d="M100.1,44.7
                A110,110 0 0,1 98.6,47.7"
            fill="none" stroke="url(#sliceVN)" stroke-width="42"/>
      <!-- South Korean 0.3%: 354.6 to 355.7 -->
      <path d="M98.6,47.7
                A110,110 0 0,1 97.1,50.6"
            fill="none" stroke="url(#sliceKR)" stroke-width="42"/>
      <!-- Others 1.2%: 355.7 to 0 (completed circle) -->
      <path d="M97.1,50.6
                A110,110 0 0,1 0,-110"
            fill="none" stroke="url(#sliceOT)" stroke-width="42"/>
      <!-- Donut hole -->
      <circle cx="0" cy="0" r="62" fill="#fff"/>
      <!-- Legend titles -->
      <g font-family="sans-serif" font-size="15" font-weight="600" fill="#444" text-anchor="start">
        <rect x="125" y="-104" width="19" height="19" rx="5" fill="url(#sliceJP)"/><text x="151" y="-89">Japanese 97.5%</text>
        <rect x="125" y="-69" width="19" height="19" rx="5" fill="url(#sliceCN)"/><text x="151" y="-54">Chinese 0.6%</text>
        <rect x="125" y="-34" width="19" height="19" rx="5" fill="url(#sliceVN)"/><text x="151" y="-19">Vietnamese 0.4%</text>
        <rect x="125" y="1" width="19" height="19" rx="5" fill="url(#sliceKR)"/><text x="151" y="16">South Korean 0.3%</text>
        <rect x="125" y="36" width="19" height="19" rx="5" fill="url(#sliceOT)"/><text x="151" y="51">Other 1.2%</text>
      </g>
      <!-- Caption inside donut -->
      <text x="0" y="8" text-anchor="middle" font-size="32" font-family="sans-serif" font-weight="800" fill="#24364d">97.5%</text>
      <text x="0" y="31" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#889aaa">Japanese</text>
    </g>
    
    <!-- Places to visit Card -->
    <rect x="635" y="1180" width="435" height="390" rx="32" fill="#fff" fill-opacity="0.93" stroke="#e2e9f0" />
    <text x="680" y="1238" font-family="sans-serif" font-size="28" fill="#314A6F" font-weight="700">What to Visit</text>
    <g font-family="sans-serif" font-size="22" fill="#516386" font-weight="500">
      <!-- Icon: simple torii -->
      <g transform="translate(690 1265)">
        <rect x="0" y="6" width="38" height="7" fill="#EC4863" rx="3"/>
        <rect x="9" y="13" width="20" height="8" fill="#F17623" rx="2"/>
        <rect x="8" y="21" width="3" height="17" fill="#8bb7e0" rx="1.5"/>
        <rect x="27" y="21" width="3" height="17" fill="#8bb7e0" rx="1.5"/>
      </g>
      <!-- Visit places -->
      <text x="730" y="1292">Tokyo (city, shopping, dining)</text>
      <text x="730" y="1324">Kyoto (shrines, geisha quarters)</text>
      <text x="730" y="1356">Osaka (food, castle, nightlife)</text>
      <text x="730" y="1388">Hiroshima &amp; Miyajima (history, shrine)</text>
      <text x="730" y="1420">Mount Fuji &amp; Hakone (nature, onsen)</text>
      <text x="730" y="1452">Hokkaido (ski, wildlife, landscapes)</text>
    </g>
  </g>
  
  <!-- ===================== Sources Note (Footer) ===================== -->
  <g>
    <text x="96" y="1755" font-size="15" font-family="sans-serif" fill="#97a1b8">
      Sources: IMF, Stat.go.jp, Japan Tourism Agency (2024), Wikipedia. Infographic by OpenAI GPT-4.
    </text>
  </g>
  
  <!-- ===================== Shadows (filters) ===================== -->
  <defs>
    <filter id="shadowTokyo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f17623" flood-opacity="0.25"/>
    </filter>
    <filter id="btnShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ec4863" flood-opacity="0.18"/>
    </filter>
  </defs>
</svg>