<svg viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Card border gradients -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Bar chart gradient -->
    <linearGradient id="bar-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Subtle card shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#94a3b8" flood-opacity="0.15"/>
    </filter>

    <!-- Soft glow for map markers -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Subtle Background Waves -->
  <path d="M0,250 C300,200 600,300 900,220 C1050,180 1200,280 1200,280 L1200,0 L0,0 Z" fill="#f1f5f9" opacity="0.6"/>
  <path d="M0,900 C400,850 800,950 1200,880 L1200,1200 L0,1200 Z" fill="#f1f5f9" opacity="0.4"/>
  <path d="M0,1550 C500,1500 700,1600 1200,1520 L1200,1800 L0,1800 Z" fill="#e2e8f0" opacity="0.3"/>

  <!-- === TITLE SECTION === -->
  <g transform="translate(600, 70)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#1e293b" letter-spacing="-1.5">Japan at a Glance</text>
    <text text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" y="35" letter-spacing="4">THE LAND OF THE RISING SUN</text>
    <line x1="-40" y1="55" x2="40" y2="55" stroke="url(#border-grad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- === ROW 1: MAP & INTRO === -->
  
  <!-- Intro Text Card (Right Side - Rendered first visually as it sits behind nothing, but logically right) -->
  <g transform="translate(620, 110)">
    <rect width="540" height="420" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="2" y="2" width="536" height="416" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.5"/>
    
    <text x="40" y="60" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#1e293b">About Japan</text>
    
    <text x="40" y="105" font-family="system-ui, sans-serif" font-size="17" fill="#475569" line-height="1.6">
      <tspan x="40" dy="0">Japan is an island nation in East Asia located in</tspan>
      <tspan x="40" dy="30">the Pacific Ocean, east of the Sea of Japan.</tspan>
      <tspan x="40" dy="30">It comprises four main islands—Hokkaido,</tspan>
      <tspan x="40" dy="30">Honshu, Shikoku, and Kyushu—along with</tspan>
      <tspan x="40" dy="30">thousands of smaller islands. Known for its</tspan>
      <tspan x="40" dy="30">unique blend of ancient traditions and cutting-</tspan>
      <tspan x="40" dy="30">edge technology, Japan boasts a rich cultural</tspan>
      <tspan x="40" dy="30">heritage, distinctive cuisine, and breathtaking</tspan>
      <tspan x="40" dy="30">natural landscapes from snowy mountains to</tspan>
      <tspan x="40" dy="30">tropical beaches.</tspan>
    </text>
  </g>

  <!-- Map Card (Left Side) -->
  <g transform="translate(40, 110)">
    <rect width="560" height="420" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="2" y="2" width="556" height="416" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.5"/>
    
    <text x="30" y="50" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#1e293b">Major Cities</text>

    <!-- Stylized Japan Map -->
    <!-- Hokkaido -->
    <path d="M 380 30 Q 420 20 450 40 Q 470 60 460 90 Q 450 110 430 105 Q 400 100 380 80 Q 360 60 380 30 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <!-- Honshu (Main) -->
    <path d="M 430 105 Q 450 120 440 150 Q 430 180 420 200 Q 410 220 400 240 Q 390 260 380 270 Q 370 280 360 275 Q 350 270 360 250 Q 370 230 380 210 Q 390 190 400 170 Q 410 150 415 130 Q 420 110 430 105 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <path d="M 360 275 Q 350 290 340 285 Q 330 280 335 265 Q 340 250 350 260 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <!-- Kyushu -->
    <path d="M 330 290 Q 350 300 345 320 Q 340 340 320 335 Q 300 330 310 310 Q 320 290 330 290 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <!-- Shikoku -->
    <path d="M 360 295 Q 375 305 370 320 Q 360 330 350 325 Q 345 315 350 300 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />

    <!-- City Markers -->
    <!-- Tokyo -->
    <circle cx="415" cy="170" r="8" fill="#ef4444" filter="url(#glow)"/>
    <text x="430" y="160" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#1e293b">Tokyo</text>
    <text x="430" y="178" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Capital</text>

    <!-- Yokohama -->
    <circle cx="410" cy="185" r="6" fill="#f97316" />
    <text x="425" y="205" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#334155">Yokohama</text>

    <!-- Nagoya -->
    <circle cx="375" cy="225" r="6" fill="#f97316" />
    <text x="340" y="230" text-anchor="end" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#334155">Nagoya</text>

    <!-- Osaka -->
    <circle cx="355" cy="255" r="8" fill="#ef4444" filter="url(#glow)"/>
    <text x="370" y="265" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#1e293b">Osaka</text>
    <text x="370" y="280" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">2nd Largest</text>
  </g>

  <!-- === FULL WIDTH PARAGRAPH === -->
  <g transform="translate(40, 560)">
    <rect width="1120" height="130" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="2" y="2" width="1116" height="126" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.5"/>
    
    <text x="40" y="45" font-family="system-ui, sans-serif" font-weight="700" font-size="22" fill="#1e293b">Cultural &amp; Economic Overview</text>
    <text x="40" y="85" font-family="system-ui, sans-serif" font-size="17" fill="#475569" line-height="1.6">
      <tspan x="40" dy="0">Japan is the third-largest economy in the world. It is a global leader in automotive manufacturing, robotics,</tspan>
      <tspan x="40" dy="28">and electronics. Culturally, it is renowned for its art, cuisine, and pop culture, attracting millions of tourists annually.</tspan>
    </text>
  </g>

  <!-- === ROW 2: TEXT & GDP BAR CHART === -->
  
  <!-- GDP Text Card (Left Side) -->
  <g transform="translate(40, 720)">
    <rect width="560" height="460" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="2" y="2" width="556" height="456" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.5"/>

<text x="40" y="60" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#1e293b">Economic Powerhouse</text>

<text x="40" y="105" font-family="system-ui, sans-serif" font-size="17" fill="#475569">
<tspan x="40" dy="0">Japan has the world's third-largest</tspan>
<tspan x="40" dy="30">economy by nominal GDP. Despite</tspan>
<tspan x="40" dy="30">slowing growth since the 1990s, it</tspan>
<tspan x="40" dy="30">remains a global innovation hub with</tspan>
<tspan x="40" dy="30">high productivity and low</tspan>
<tspan x="40" dy="30">unemployment rates.</tspan>
</text>

<text x="40" y="300" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#1e293b">Key Industries:</text>
<text x="40" y="335" font-family="system-ui, sans-serif" font-size="16" fill="#475569">
<tspan x="40" dy="0">• Automotive &amp; Transportation</tspan>
<tspan x="40" dy="28">• Electronics &amp; Robotics</tspan>
<tspan x="40" dy="28">• Precision Machinery</tspan>
<tspan x="40" dy="28">• Chemical &amp; Steel Production</tspan>
</text>
</g>

<!-- GDP Bar Chart Card (Right Side) -->
<g transform="translate(620, 720)">
<rect width="540" height="460" rx="24" fill="#ffffff" filter="url(#shadow)"/>
<rect x="2" y="2" width="536" height="456" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.5"/>

<text x="40" y="50" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#1e293b">GDP by Sector</text>

<!-- Chart Container -->
<g transform="translate(60, 100)">
<!-- Y-axis grid lines -->
<line x1="0" y1="0" x2="0" y2="280" stroke="#e2e8f0" stroke-width="2"/>
<line x1="0" y1="280" x2="400" y2="280" stroke="#e2e8f0" stroke-width="2"/>

<!-- Grid lines -->
<line x1="0" y1="224" x2="400" y2="224" stroke="#f1f5f9" stroke-width="1"/>
<line x1="0" y1="168" x2="400" y2="168" stroke="#f1f5f9" stroke-width="1"/>
<line x1="0" y1="112" x2="400" y2="112" stroke="#f1f5f9" stroke-width="1"/>
<line x1="0" y1="56" x2="400" y2="56" stroke="#f1f5f9" stroke-width="1"/>

<!-- Bar 1: Services -->
<rect x="30" y="84" width="80" height="196" rx="4" fill="url(#bar-grad)"/>
<text x="70" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#1e293b">70%</text>
<text x="70" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Services</text>

<!-- Bar 2: Industry -->
<rect x="150" y="154" width="80" height="126" rx="4" fill="url(#bar-grad)" opacity="0.8"/>
<text x="190" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#1e293b">25%</text>
<text x="190" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Industry</text>

<!-- Bar 3: Agriculture -->
<rect x="270" y="266" width="80" height="14" rx="4" fill="url(#bar-grad)" opacity="0.6"/>
<text x="310" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#1e293b">5%</text>
<text x="310" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Agriculture</text>

<!-- Y-axis labels -->
<text x="-10" y="285" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">0%</text>
<text x="-10" y="225" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">20%</text>
<text x="-10" y="165" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">40%</text>
<text x="-10" y="105" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">60%</text>
<text x="-10" y="45" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">80%</text>
</g>

<text x="40" y="430" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-style="italic">Source: World Bank, 2023 estimates</text>
</g>

<!-- === ROW 3: CULTURE & TRADITIONS === -->

<!-- Left Card: Cultural Icons -->
<g transform="translate(40, 1210)">
<rect width="560" height="380" rx="24" fill="#ffffff" filter="url(#shadow)"/>
<rect x="2" y="2" width="556" height="376" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.5"/>

<text x="40" y="50" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#1e293b">Cultural Heritage</text>

<text x="40" y="90" font-family="system-ui, sans-serif" font-size="17" fill="#475569">
<tspan x="40" dy="0">Japan preserves ancient traditions while</tspan>
<tspan x="40" dy="28">embracing modernity. From tea ceremonies</tspan>
<tspan x="40" dy="28">and zen gardens to anime and J-pop, the</tspan>
<tspan x="40" dy="28">culture captivates millions worldwide.</tspan>
</text>

<!-- Icon Grid -->
<g transform="translate(40, 200)">
<!-- Cherry Blossom -->
<g transform="translate(0, 0)">
<circle cx="30" cy="30" r="30" fill="#fef3c7" opacity="0.5"/>
<path d="M30 15 Q35 25 30 35 Q25 25 30 15 M20 25 Q30 30 40 25 Q30 20 20 25 M22 38 Q30 32 38 38 Q30 44 22 38" fill="#f472b6" stroke="#db2777" stroke-width="1.5"/>
<circle cx="30" cy="30" r="4" fill="#fce7f3"/>
</g>
<text x="30" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Sakura</text>

<!-- Torii Gate -->
<g transform="translate(120, 0)">
<circle cx="30" cy="30" r="30" fill="#fee2e2" opacity="0.5"/>
<path d="M10 20 L50 20 L48 15 L12 15 Z" fill="#ef4444"/>
<rect x="15" y="20" width="4" height="30" fill="#dc2626"/>
<rect x="41" y="20" width="4" height="30" fill="#dc2626"/>
<rect x="10" y="35" width="40" height="3" fill="#dc2626"/>
<path d="M8 18 Q30 12 52 18" fill="none" stroke="#b91c1c" stroke-width="2"/>
</g>
<text x="150" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Torii</text>

<!-- Tea Ceremony -->
<g transform="translate(0, 100)">
<circle cx="30" cy="30" r="30" fill="#ecfdf5" opacity="0.5"/>
<path d="M15 25 Q15 45 30 45 Q45 45 45 25 Z" fill="#10b981"/>
<path d="M45 28 Q55 25 55 35 Q55 40 45 38" fill="none" stroke="#059669" stroke-width="2"/>
</g>
<text x="30" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Tea</text>

<!-- Mount Fuji -->
<g transform="translate(120, 100)">
<circle cx="30" cy="30" r="30" fill="#eff6ff" opacity="0.5"/>
<path d="M10 45 L25 15 L35 15 L50 45 Z" fill="#3b82f6"/>
<path d="M25 15 L30 25 L35 15" fill="#ffffff" opacity="0.9"/>
<line x1="10" y1="45" x2="50" y2="45" stroke="#1e40af" stroke-width="2"/>
</g>
<text x="150" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Fuji</text>
</g>
</g>

<!-- Right Card: Tourism Stats -->
<g transform="translate(620, 1210)">
<rect width="540" height="380" rx="24" fill="#ffffff" filter="url(#shadow)"/>
<rect x="2" y="2" width="536" height="376" rx="22" fill="none" stroke="url(#border-grad)" stroke-width="2" opacity="0.5"/>

<text x="40" y="50" font-family="system-ui, sans-serif" font-weight="700" font-size="24" fill="#1e293b">Tourism Highlights</text>

<text x="40" y="90" font-family="system-ui, sans-serif" font-size="17" fill="#475569">
<tspan x="40" dy="0">Japan welcomed over 25 million visitors</tspan>
<tspan x="40" dy="28">annually before the pandemic, with numbers</tspan>
<tspan x="40" dy="28">rapidly recovering. Key destinations include</tspan>
<tspan x="40" dy="28">Tokyo, Kyoto, Osaka, and Hokkaido.</tspan>
</text>

<text x="40" y="220" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#1e293b">Top Attractions:</text>
<text x="40" y="255" font-family="system-ui, sans-serif" font-size="16" fill="#475569">
<tspan x="40" dy="0">• Fushimi Inari Shrine (Kyoto)</tspan>
<tspan x="40" dy="28">• Senso-ji Temple (Tokyo)</tspan>
<tspan x="40" dy="28">• Mount Fuji &amp; Hakone</tspan>
<tspan x="40" dy="28">• Universal Studios Japan (Osaka)</tspan>
</text>

<text x="40" y="350" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-style="italic">Japan National Tourism Organization</text>
</g>

<!-- Footer -->
<g transform="translate(600, 1650)">
<text text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Designed with precision • Inspired by Japan</text>
</g>

</svg>