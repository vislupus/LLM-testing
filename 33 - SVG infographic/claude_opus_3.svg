<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FA"/>
      <stop offset="100%" stop-color="#D3E3F3"/>
    </linearGradient>
    <linearGradient id="label-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5F6D"/>
      <stop offset="100%" stop-color="#FFC371"/>
    </linearGradient>
    <linearGradient id="gdp-bar-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74B9FF"/>
      <stop offset="100%" stop-color="#0984E3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="1800" fill="url(#bg-gradient)"/>
<text x="600" y="100" text-anchor="middle" font-size="50" font-weight="700" fill="#2C3E50">Japan at a Glance</text>
  <g class="map">
    <path d="M150 200l50 50h60L330 200l80 50 30 80 40-10 10 40h-70l30 90-30 40 20 30 80-40 20 40-30 60-70-20-20 30 10 30h90v40l-80 40-60 10-30 40-10 70 60 30 50-30 100 70 40-30 90-10 20 40v40h-50l-20 40-50-10-40 20-40-20h-40l-30 40-50-10v50l-50 10-90-40-40 10-50-20-20-50-60 20-20-20-20-70-80-50-40-70-50-20-10-50h-40v50l-70-10-60-80v-40l40-30-30-80-60-30V400l30-70 70-10 40-60Z" fill="#74B9FF"/>
<g class="cities">
  <circle cx="225" cy="260" r="7" fill="#EA2027"/>
  <text x="240" y="267" font-size="16">Tokyo</text>
  
  <circle cx="195" cy="410" r="5" fill="#EA2027"/> 
  <text x="210" y="417" font-size="14">Yokohama</text>

  <circle cx="125" cy="625" r="5" fill="#EA2027"/>
  <text x="140" y="632" font-size="14">Osaka</text>

  <circle cx="185" cy="575" r="4" fill="#EA2027"/>
  <text x="200" y="582" font-size="12">Nagoya</text>
</g>
  </g>
  <foreignObject x="500" y="230" width="600" height="150">
    <p>Japan is an archipelago of 6,852 islands located in East Asia. It is the 4th largest island country in the world and the 11th most populous country with 126 million people. Japan is a highly developed country known for its unique culture, cutting-edge technology, efficient transportation, and bustling cities.</p>  
  </foreignObject>
  <foreignObject x="100" y="400" width="1000" height="80">
    <p>Japan has the 3rd largest economy in the world by nominal GDP and the 4th largest by purchasing power parity (PPP). Its major industries include automobiles, electronics, machinery, steel, and robotics.</p>
  </foreignObject>
<text x="150" y="550" font-size="22" font-weight="bold">Japan Nominal GDP (US$ Trillions)</text>
  <g class="gdp-bar-chart" transform="translate(500,500)">
    <g class="x-axis">
      <line x1="0" y1="300" x2="600" y2="300" stroke="#2C3E50"/>
      <g class="tick" transform="translate(40, 0)">
        <text y="320" dy=".71em" font-size="14" text-anchor="middle">2015</text>
      </g>
      <g class="tick" transform="translate(160, 0)">    
        <text y="320" dy=".71em" font-size="14" text-anchor="middle">2018</text>
      </g>
      <g class="tick" transform="translate(280, 0)">
        <text y="320" dy=".71em" font-size="14" text-anchor="middle">2021</text>
      </g>
      <g class="tick" transform="translate(400, 0)">
        <text y="320" dy=".71em" font-size="14" text-anchor="middle">2024</text>
      </g>
    </g>
    <g class="y-axis">
      <text x="-150" y="25" text-anchor="end" font-size="14">6</text>
      <text x="-150" y="125" text-anchor="end" font-size="14">4</text>
      <text x="-150" y="225" text-anchor="end" font-size="14">2</text>
      <text x="-150" y="305" text-anchor="end" font-size="14">0</text>
    </g>
    <g class="bars">
      <rect x="20" y="82" width="40" height="218" fill="url(#gdp-bar-gradient)"/>
      <rect x="80" y="34" width="40" height="266" fill="url(#gdp-bar-gradient)"/>
      <rect x="140" y="42" width="40" height="258" fill="url(#gdp-bar-gradient)"/>
      <rect x="200" y="24" width="40" height="276" fill="url(#gdp-bar-gradient)"/>
      <rect x="260" y="18" width="40" height="282" fill="url(#gdp-bar-gradient)"/>
      <rect x="320" y="24" width="40" height="276" fill="url(#gdp-bar-gradient)"/>
      <rect x="380" y="24" width="40" height="276" fill="url(#gdp-bar-gradient)"/>
      <rect x="440" y="158" width="40" height="142" fill="url(#gdp-bar-gradient)"/>
      <rect x="500" y="178" width="40" height="122" fill="url(#gdp-bar-gradient)"/>
      <rect x="560" y="194" width="40" height="106" fill="url(#gdp-bar-gradient)"/>
    </g>
  </g>
  <g class="pie-chart" transform="translate(150,1050)">
    <path d="M0 0v-200a200 200 0 0 1 37-110A200 200 0 0 1 110-163a200 200 0 0 1 147-20 200 200 0 0 1 123 91A200 200 0 0 1 382 80 200 200 0 0 1 200 200Z" fill="#55EFC4"/>
    <path d="M200 200A200 200 0 0 1 0 0Z" fill="#81ECEC"/>
    <path d="M382 80A200 200 0 0 1 350 133 200 200 0 0 1 200 200Z" fill="#74B9FF"/>
    <path d="M350 133A200 200 0 0 1 310 174 200 200 0 0 1 200 200Z" fill="#A29BFE"/>
    <path d="M310 174A200 200 0 0 1 200 200Z" fill="#FFC371"/>
    <circle cx="0" cy="0" r="90" fill="white"/>
  </g>
  <g class="pie-legend" transform="translate(460,1300)">
    <rect x="0" y="0" width="20" height="20" fill="#55EFC4"/>
    <text x="30" y="16">Japanese 97.5%</text>
    <rect x="0" y="30" width="20" height="20" fill="#81ECEC"/>
    <text x="30" y="46">Chinese 0.6%</text>
    <rect x="0" y="60" width="20" height="20" fill="#74B9FF"/>
    <text x="30" y="76">Vietnamese 0.4%</text>
    <rect x="0" y="90" width="20" height="20" fill="#A29BFE"/>
    <text x="30" y="106">South Korean 0.3%</text>
    <rect x="0" y="120" width="20" height="20" fill="#FFC371"/>  
    <text x="30" y="136">Other 1.2%</text>
  </g>
  <foreignObject x="600" y="1250" width="500" height="220">
    <p><b>What to Visit in Japan:</b></p>
    <ul>
      <li>Tokyo - Modern capital, pop culture</li>
      <li>Kyoto - Historic temples and shrines</li>  
      <li>Osaka - Vibrant food scene, Universal Studios</li>
      <li>Hiroshima/Miyajima - Peace Memorial, floating torii gate</li>
      <li>Mount Fuji/Hakone - Iconic mountain, hot springs</li>
      <li>Hokkaido - Skiing, natural beauty</li>
    </ul>
  </foreignObject>
<text x="100" y="1750" font-size="14">Source: World Bank, World Population Review, CEIC Data</text>
</svg>