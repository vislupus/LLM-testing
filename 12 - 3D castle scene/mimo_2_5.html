<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-family:'Segoe UI',sans-serif;text-align:center;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#ui h1{font-size:22px;font-weight:300;letter-spacing:2px;opacity:.85}
#ui p{font-size:11px;opacity:.5;margin-top:4px}
</style>
</head>
<body>
<div id="ui"><h1>Floating Island Diorama</h1><p>drag to orbit · scroll to zoom</p></div>
<canvas id="c"></canvas>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
/* ================================================================
   Helpers
   ================================================================ */
const R=Math.random, PI=Math.PI, TAU=PI*2, sin=Math.sin, cos=Math.cos,
      abs=Math.abs, min=Math.min, max=Math.max, sqrt=Math.sqrt,
      floor=Math.floor, round=Math.round, pow=Math.pow;

function rng(lo,hi){ return lo+(hi-lo)*R(); }
function rngi(lo,hi){ return floor(rng(lo,hi+1)); }
function pick(a){ return a[floor(R()*a.length)]; }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,lo,hi){ return max(lo,min(hi,v)); }

function v3(x,y,z){ return new BABYLON.Vector3(x,y,z); }
function c3(r,g,b){ return new BABYLON.Color3(r,g,b); }
function c4(r,g,b,a){ return new BABYLON.Color4(r,g,b,a); }

/* Simple 2D noise (value noise) */
const NOISE_SIZE=64;
const noiseTab=new Float32Array(NOISE_SIZE*NOISE_SIZE);
for(let i=0;i<noiseTab.length;i++) noiseTab[i]=R();
function noise2D(x,y){
  const px=((x%NOISE_SIZE)+NOISE_SIZE)%NOISE_SIZE;
  const py=((y%NOISE_SIZE)+NOISE_SIZE)%NOISE_SIZE;
  const ix=floor(px),iy=floor(py),fx=px-ix,fy=py-iy;
  const i00=noiseTab[(iy%NOISE_SIZE)*NOISE_SIZE+(ix%NOISE_SIZE)];
  const i10=noiseTab[(iy%NOISE_SIZE)*NOISE_SIZE+((ix+1)%NOISE_SIZE)];
  const i01=noiseTab[((iy+1)%NOISE_SIZE)*NOISE_SIZE+(ix%NOISE_SIZE)];
  const i11=noiseTab[((iy+1)%NOISE_SIZE)*NOISE_SIZE+((ix+1)%NOISE_SIZE)];
  const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
  return lerp(lerp(i00,i10,sx),lerp(i01,i11,sx),sy);
}
function fbm(x,y,oct=4){
  let v=0,a=.5,f=1;
  for(let i=0;i<oct;i++){ v+=a*noise2D(x*f,y*f); a*=.5; f*=2; }
  return v;
}

/* ================================================================
   Engine setup
   ================================================================ */
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=c4(.55,.72,.92,1);
scene.ambientColor=c3(.25,.25,.3);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=.004;
scene.fogColor=c3(.65,.78,.92);

const camera=new BABYLON.ArcRotateCamera('cam',-PI/4,PI/3.2,55,v3(0,2,0),scene);
camera.lowerRadiusLimit=20; camera.upperRadiusLimit=120;
camera.lowerBetaLimit=.2; camera.upperBetaLimit=PI/2.1;
camera.attachControl(canvas,true);
camera.wheelDeltaPercentage=.01;

/* ── Lights ─────────────────────────────────────── */
const hemi=new BABYLON.HemisphericLight('hemi',v3(0,1,0),scene);
hemi.intensity=.6; hemi.diffuse=c3(1,.95,.85); hemi.groundColor=c3(.3,.35,.5);

const sun=new BABYLON.DirectionalLight('sun',v3(-.4,-1,.3),scene);
sun.intensity=1.1; sun.diffuse=c3(1,.92,.78);
const shadowGen=new BABYLON.ShadowGenerator(1024,sun);
shadowGen.useBlurExponentialShadowMap=true; shadowGen.blurKernel=16;

/* ================================================================
   Materials
   ================================================================ */
function mat(name,diff,spec,em){
  const m=new BABYLON.StandardMaterial(name,scene);
  m.diffuseColor=diff||c3(1,1,1);
  if(spec) m.specularColor=spec; else m.specularColor=c3(.05,.05,.05);
  if(em) m.emissiveColor=em;
  return m;
}
const matGrass  =mat('grass',c3(.28,.62,.18));
const matGrass2 =mat('grass2',c3(.34,.68,.22));
const matDirt   =mat('dirt',c3(.52,.36,.2));
const matRock   =mat('rock',c3(.5,.48,.44));
const matRockDk =mat('rockDk',c3(.38,.36,.33));
const matStone  =mat('stone',c3(.68,.64,.58));
const matStoneDk=mat('stoneDk',c3(.55,.52,.47));
const matWood   =mat('wood',c3(.55,.38,.2));
const matWoodDk =mat('woodDk',c3(.42,.28,.15));
const matRoof   =mat('roof',c3(.65,.22,.12));
const matRoofB  =mat('roofB',c3(.35,.55,.3));
const matWater  =mat('water',c3(.18,.55,.72),c3(.3,.5,.6));
matWater.alpha=.72;
const matBridge =mat('bridge',c3(.5,.35,.18));
const matFabric =mat('fabric',c3(.8,.3,.25));
const matFabric2=mat('fabric2',c3(.25,.45,.7));
const matTorch  =mat('torch',c3(.9,.7,.3),null,c3(.4,.25,.05));
const matSnow   =mat('snow',c3(.92,.94,.96));
const matFlag   =mat('flag',c3(.8,.15,.1),null,c3(.1,.02,0));

/* ================================================================
   Shadow helpers
   ================================================================ */
function addShadow(mesh){
  shadowGen.addShadowCaster(mesh,true);
  mesh.receiveShadows=true;
  return mesh;
}
function addShadows(node){
  node.getChildMeshes().forEach(m=>addShadow(m));
  return node;
}

/* ================================================================
   ISLAND — procedural mesh
   ================================================================ */
function createIsland(){
  const seg=72, layers=18;
  const paths=[];

  /* Profile: radius at each height layer */
  for(let ly=0;ly<=layers;ly++){
    const t=ly/layers; // 0=top 1=bottom
    const path=[];
    for(let i=0;i<=seg;i++){
      const a=i/seg*TAU;
      /* base radius with noise */
      let R0=16+3*sin(a*2.1)+2.5*cos(a*3.4)+1.5*sin(a*5.7+1.3);
      R0+=fbm(cos(a)*3+10,sin(a)*3+10,2)*3;
      /* taper */
      let r,y;
      if(t<.25){
        r=R0; y=t/.25*1.2; /* top 25% is flat */
      } else if(t<.55){
        const s=(t-.25)/.3;
        r=R0*(1-s*.25); y=1.2+s*2;
      } else {
        const s=(t-.55)/.45;
        r=R0*.75*pow(1-s,.7); y=3.2+s*10;
      }
      /* terrain bumps on top */
      if(t<.15){
        const h=fbm(cos(a)*4+20,sin(a)*4+20,3)*1.2;
        y+=h*(1-t/.15);
      }
      r=max(r,.3);
      path.push(v3(cos(a)*r, -y+2, sin(a)*r));
    }
    paths.push(path);
  }

  const island=BABYLON.MeshBuilder.CreateRibbon('island',{pathArray:paths,closePath:true,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
  island.material=matRock;
  addShadow(island);

  /* Grass cap on top */
  const cap=BABYLON.MeshBuilder.CreateDisc('cap',{radius:16.5,tessellation:72},scene);
  cap.rotation.x=PI/2; cap.position.y=2.05;
  const verts=cap.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for(let i=0;i<verts.length;i+=3){
    const x=verts[i],z=verts[i+1];
    verts[i+2]=fbm(x*.25+5,z*.25+5,3)*.6;
  }
  cap.updateVerticesData(BABYLON.VertexBuffer.PositionKind,verts);
  cap.material=matGrass;
  addShadow(cap);

  return island;
}
createIsland();

/* ================================================================
   TERRAIN details on top — dirt patches
   ================================================================ */
function createTerrainDetail(){
  for(let i=0;i<6;i++){
    const a=R()*TAU, d=R()*10;
    const disc=BABYLON.MeshBuilder.CreateDisc('patch',{radius:rng(1,2.5),tessellation:16},scene);
    disc.rotation.x=PI/2; disc.position=v3(cos(a)*d,2.08,sin(a)*d);
    disc.material=R()>.5?matDirt:matGrass2;
  }
}
createTerrainDetail();

/* ================================================================
   CASTLE
   ================================================================ */
function createCastle(){
  const root=new BABYLON.TransformNode('castle',scene);
  root.position.y=2;

  /* Main keep */
  const keep=BABYLON.MeshBuilder.CreateBox('keep',{width:7,height:9,depth:7},scene);
  keep.position=v3(0,4.5,0); keep.material=matStone; keep.parent=root; addShadow(keep);

  /* Battlements on keep */
  for(let i=0;i<4;i++){
    for(let j=0;j<3;j++){
      const bx=-3+i*2, bz=-3+j*3;
      if(abs(bx)<2&&abs(bz)<2) continue;
      const b=BABYLON.MeshBuilder.CreateBox('bat',{width:1,height:1,depth:1},scene);
      b.position=v3(bx,9.5,bz); b.material=matStoneDk; b.parent=root;
    }
  }

  /* Corner towers */
  const tPos=[[-5,0,-5],[5,0,-5],[-5,0,5],[5,0,5]];
  tPos.forEach((p,idx)=>{
    const tower=BABYLON.MeshBuilder.CreateCylinder('twr'+idx,{height:13,diameter:3.5,tessellation:14},scene);
    tower.position=v3(p[0],6.5,p[2]); tower.material=matStone; tower.parent=root; addShadow(tower);

    /* Cone roof */
    const roof=BABYLON.MeshBuilder.CreateCylinder('troof'+idx,{height:4,diameterTop:0,diameterBottom:5,tessellation:14},scene);
    roof.position=v3(p[0],15,p[2]); roof.material=matRoof; roof.parent=root; addShadow(roof);

    /* Flag */
    const pole=BABYLON.MeshBuilder.CreateCylinder('pole'+idx,{height:3,diameter:.15,tessellation:6},scene);
    pole.position=v3(p[0],18.5,p[2]); pole.material=matWoodDk; pole.parent=root;
    const flag=BABYLON.MeshBuilder.CreatePlane('flag'+idx,{width:1.5,height:1},scene);
    flag.position=v3(p[0]+.8,19,p[2]); flag.material=matFlag; flag.parent=root;
  });

  /* Walls */
  const walls=[{p:v3(0,4.5,-5),s:{width:6,height:6,depth:1}},{p:v3(0,4.5,5),s:{width:6,height:6,depth:1}},
               {p:v3(-5,4.5,0),s:{width:1,height:6,depth:6}},{p:v3(5,4.5,0),s:{width:1,height:6,depth:6}}];
  walls.forEach((w,i)=>{
    const wall=BABYLON.MeshBuilder.CreateBox('wall'+i,w.s,scene);
    wall.position=w.p; wall.material=matStoneDk; wall.parent=root; addShadow(wall);
  });

  /* Gate */
  const gate=BABYLON.MeshBuilder.CreateBox('gate',{width:2.5,height:4,depth:1.2},scene);
  gate.position=v3(0,2,-5.5); gate.material=matWoodDk; gate.parent=root;

  /* Castle door arch */
  const arch=BABYLON.MeshBuilder.CreateCylinder('arch',{height:1.2,diameter:3,diameterTop:2.5,tessellation:12,arc:.5},scene);
  arch.rotation.z=PI/2; arch.rotation.y=PI; arch.position=v3(0,4,-5.3); arch.material=matStone; arch.parent=root;

  return root;
}
addShadows(createCastle());

/* ================================================================
   VILLAGE HOUSES
   ================================================================ */
function createHouse(x,z,w,d,h,roofMat,parent){
  const root=new BABYLON.TransformNode('house',scene);
  root.position=v3(x,2,z); root.parent=parent;

  const body=BABYLON.MeshBuilder.CreateBox('hbody',{width:w,height:h,depth:d},scene);
  body.position.y=h/2; body.material=matWood; body.parent=root; addShadow(body);

  /* Roof (prism via extrude) */
  const roofH=h*.6;
  const roofPath=[v3(-w/2-.4,0,-d/2-.4),v3(0,roofH,0),v3(w/2+.4,0,-d/2-.4)];
  // Simple box roof approximation
  const roof=BABYLON.MeshBuilder.CreateBox('hroof',{width:w+.8,height:.3,depth:d+.8},scene);
  roof.position.y=h+roofH/2; roof.material=roofMat||matRoof; roof.parent=root; addShadow(roof);

  /* peaked top */
  const peak=BABYLON.MeshBuilder.CreateCylinder('peak',{height:roofH*2,diameterTop:0,diameterBottom:max(w,d)+.6,tessellation:4},scene);
  peak.position.y=h+roofH; peak.rotation.y=PI/4; peak.material=roofMat||matRoof; peak.parent=root; addShadow(peak);

  /* Chimney */
  const chim=BABYLON.MeshBuilder.CreateBox('chim',{width:.4,height:1.5,depth:.4},scene);
  chim.position=v3(w/3,h+roofH+1,0); chim.material=matStoneDk; chim.parent=root;

  /* Window */
  const win=BABYLON.MeshBuilder.CreatePlane('win',{width:.5,height:.6},scene);
  win.position=v3(0,h*.6,-d/2-.01); win.material=matTorch; win.parent=root;

  return root;
}

function createVillage(){
  const village=new BABYLON.TransformNode('village',scene);
  /* Houses around the island */
  const spots=[
    {x:-9,z:-4,w:2.5,d:2,h:2.5},{x:-7,z:3,w:2,d:2.5,h:2},{x:-5,z:-8,w:3,d:2.5,h:2.8},
    {x:7,z:-6,w:2.5,d:2,h:2.3},{x:9,z:2,w:2,d:3,h:2.5},{x:4,z:8,w:2.5,d:2,h:2},
    {x:-3,z:7,w:2,d:2,h:2.2}
  ];
  spots.forEach((s,i)=>{
    createHouse(s.x,s.z,s.w,s.d,s.h,i%3===0?matRoofB:matRoof,village);
  });

  /* Tavern (larger building) */
  const tavern=new BABYLON.TransformNode('tavern',scene);
  tavern.position=v3(3,-8,2); tavern.parent=village;
  const tBody=BABYLON.MeshBuilder.CreateBox('tBody',{width:4,height:3,depth:3},scene);
  tBody.position.y=1.5; tBody.material=matWood; tBody.parent=tavern; addShadow(tBody);
  const tRoof=BABYLON.MeshBuilder.CreateCylinder('tRoof',{height:2.5,diameterTop:0,diameterBottom:6.5,tessellation:4},scene);
  tRoof.position.y=4.2; tRoof.rotation.y=PI/4; tRoof.material=matRoofB; tRoof.parent=tavern; addShadow(tRoof);
  /* Sign */
  const sign=BABYLON.MeshBuilder.CreatePlane('sign',{width:1.2,height:.6},scene);
  sign.position=v3(2.1,2.5,0); sign.material=matWoodDk; sign.parent=tavern;

  return village;
}
addShadows(createVillage());

/* ================================================================
   MARKET STALLS
   ================================================================ */
function createMarket(){
  const mkt=new BABYLON.TransformNode('market',scene);
  const stalls=[
    {x:-2,z:-3,c:matFabric},{x:1,z:-3,c:matFabric2},{x:4,z:-2,c:matFabric}
  ];
  stalls.forEach((s,i)=>{
    const st=new BABYLON.TransformNode('stall'+i,scene);
    st.position=v3(s.x,2,s.z); st.parent=mkt;

    /* counter */
    const counter=BABYLON.MeshBuilder.CreateBox('counter',{width:2,height:1,depth:1},scene);
    counter.position.y=.5; counter.material=matWood; counter.parent=st;

    /* cloth roof */
    const cloth=BABYLON.MeshBuilder.CreateBox('cloth',{width:2.4,height:.12,depth:1.5},scene);
    cloth.position.y=2; cloth.material=s.c; cloth.parent=st;

    /* poles */
    [[-1,0,-.6],[1,0,-.6],[-1,0,.6],[1,0,.6]].forEach((p,j)=>{
      const pole=BABYLON.MeshBuilder.CreateCylinder('spole'+j,{height:2,diameter:.08,tessellation:6},scene);
      pole.position=v3(p[0],1,p[2]); pole.material=matWoodDk; pole.parent=st;
    });

    /* goods (small colored boxes) */
    for(let g=0;g<3;g++){
      const good=BABYLON.MeshBuilder.CreateBox('good'+g,{width:.3,height:.25,depth:.3},scene);
      good.position=v3(-.5+g*.5,.65,0);
      good.material=mat('good'+g,c3(R()*.5+.5,R()*.5+.5,R()*.5+.5)); good.parent=st;
    }
  });
  return mkt;
}
createMarket();

/* ================================================================
   RIVER
   ================================================================ */
function createRiver(){
  /* River path winding across the island */
  const points=[];
  const n=40;
  for(let i=0;i<=n;i++){
    const t=i/n;
    const x=lerp(-14,14,t)+sin(t*PI*2.5)*4;
    const z=lerp(-6,8,t)+cos(t*PI*1.8)*3;
    points.push(v3(x,2.12,z));
  }
  const catmull=BABYLON.Curve3.CreateCatmullRomSpline(points,6);
  const curvePoints=catmull.getPoints();

  const tube=BABYLON.MeshBuilder.CreateTube('river',{path:curvePoints,radius:1.2,tessellation:12,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
  tube.material=matWater; tube.position.y=-.05;

  /* Second narrower river fork */
  const pts2=[];
  for(let i=0;i<=25;i++){
    const t=i/25;
    const x=lerp(-4,10,t)+sin(t*PI*3)*2;
    const z=lerp(-10,6,t);
    pts2.push(v3(x,2.12,z));
  }
  const cat2=BABYLON.Curve3.CreateCatmullRomSpline(pts2,4);
  const tube2=BABYLON.MeshBuilder.CreateTube('river2',{path:cat2.getPoints(),radius:.8,tessellation:10,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);
  tube2.material=matWater; tube2.position.y=-.05;

  return{main:tube, fork:tube2, path:curvePoints};
}
const river=createRiver();

/* ================================================================
   WATERFALLS — particles
   ================================================================ */
function createWaterfall(x,z){
  const ps=new BABYLON.ParticleSystem('wf',300,scene);
  ps.createPointEmitter(v3(-.3,-1,-.3),v3(.3,-1,.3));
  ps.emitter=v3(x,1.8,z);
  ps.minLifeTime=.6; ps.maxLifeTime=1.4;
  ps.emitRate=120;
  ps.minSize=.15; ps.maxSize=.4;
  ps.direction1=v3(-.5,-3,-.5);
  ps.direction2=v3(.5,-4,.5);
  ps.gravity=v3(0,-8,0);
  ps.color1=c4(.5,.85,1,.8);
  ps.color2=c4(.3,.65,.9,.5);
  ps.colorDead=c4(.2,.5,.8,0);
  ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  /* Use default circle texture generated from code */
  ps.particleTexture=createWFTexture();
  ps.start();
  return ps;
}
function createWFTexture(){
  const sz=64,dt=new Uint8Array(sz*sz*4);
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
    const dx=x-sz/2,dy=y-sz/2,d=sqrt(dx*dx+dy*dy)/(sz/2);
    const a=d<1?pow(1-d,1.5):0;
    const i=(y*sz+x)*4;
    dt[i]=255;dt[i+1]=255;dt[i+2]=255;dt[i+3]=round(a*255);
  }
  const raw=new BABYLON.RawTexture(dt,sz,sz,BABYLON.Engine.TEXTUREFORMAT_RGBA,scene,false,false,BABYLON.Texture.BILINEAR_SAMPLINGMODE);
  return raw;
}
createWaterfall(-11,-2);
createWaterfall(12,3);
createWaterfall(-8,9);

/* ================================================================
   BRIDGES
   ================================================================ */
function createBridge(x,z,angle,len){
  const br=new BABYLON.TransformNode('bridge',scene);
  br.position=v3(x,2.2,z); br.rotation.y=angle;
  const deck=BABYLON.MeshBuilder.CreateBox('bdeck',{width:len||3,height:.2,depth:1.2},scene);
  deck.material=matBridge; deck.parent=br; addShadow(deck);
  /* Railings */
  [-.55,.55].forEach((side,si)=>{
    for(let i=0;i<4;i++){
      const post=BABYLON.MeshBuilder.CreateCylinder('bpost'+si+'_'+i,{height:1,diameter:.08,tessellation:6},scene);
      post.position=v3(-(len||3)/2+i*((len||3)/3),.6,side);
      post.material=matWoodDk; post.parent=br;
    }
    const rail=BABYLON.MeshBuilder.CreateBox('brail'+si,{width:len||3,height:.06,depth:.06},scene);
    rail.position=v3(0,1.1,side); rail.material=matWoodDk; rail.parent=br;
  });
  return br;
}
createBridge(-5,1,0.3,3);
createBridge(6,-3,-0.2,2.5);
createBridge(-1,5,0.8,2.5);

/* ================================================================
   TREES — Pine & Deciduous
   ================================================================ */
function createPine(x,z,scale){
  const s=scale||1;
  const tree=new BABYLON.TransformNode('pine',scene);
  tree.position=v3(x,2,z);

  const trunk=BABYLON.MeshBuilder.CreateCylinder('trunk',{height:2.5*s,diameter:.3*s,tessellation:6},scene);
  trunk.position.y=1.25*s; trunk.material=matWoodDk; trunk.parent=tree; addShadow(trunk);

  for(let i=0;i<3;i++){
    const cone=BABYLON.MeshBuilder.CreateCylinder('leaf'+i,{height:2*s-i*.3,topRadius:0,bottomRadius:(1.5-i*.3)*s,tessellation:8},scene);
    cone.position.y=2.5*s+i*1.1*s; cone.material=i<2?matGrass:matGrass2; cone.parent=tree; addShadow(cone);
  }
  return tree;
}

function createDecid(x,z,scale){
  const s=scale||1;
  const tree=new BABYLON.TransformNode('decid',scene);
  tree.position=v3(x,2,z);

  const trunk=BABYLON.MeshBuilder.CreateCylinder('trunk',{height:2*s,diameter:.35*s,tessellation:6},scene);
  trunk.position.y=1*s; trunk.material=matWood; trunk.parent=tree; addShadow(trunk);

  const crown=BABYLON.MeshBuilder.CreateSphere('crown',{diameter:2.5*s,segments:8},scene);
  crown.position.y=3*s; crown.material=matGrass2; crown.parent=tree; addShadow(crown);
  return tree;
}

/* Place trees */
const treeSpots=[];
for(let i=0;i<55;i++){
  const a=R()*TAU, d=R()*13+2;
  const x=cos(a)*d, z=sin(a)*d;
  /* Avoid castle center */
  if(abs(x)<6&&abs(z)<6) continue;
  /* Avoid river area (rough check) */
  if(abs(z-x*.3)<2.5 && abs(x)<10) continue;
  treeSpots.push({x,z,type:R()>.4?'pine':'decid',s:rng(.7,1.3)});
}
treeSpots.forEach(t=>{
  if(t.type==='pine') createPine(t.x,t.z,t.s);
  else createDecid(t.x,t.z,t.s);
});

/* ================================================================
   RUINED WATCHTOWER
   ================================================================ */
function createRuins(){
  const root=new BABYLON.TransformNode('ruins',scene);
  root.position=v3(13,2,10);

  /* Broken tower base */
  const base=BABYLON.MeshBuilder.CreateCylinder('rbase',{height:5,diameter:3,tessellation:10,arc:.7},scene);
  base.position.y=2.5; base.material=matStoneDk; base.parent=root; addShadow(base);

  /* Broken wall segment */
  const wall=BABYLON.MeshBuilder.CreateBox('rwall',{width:2,height:3.5,depth:.6},scene);
  wall.position=v3(-.5,1.75,.8); wall.material=matStone; wall.parent=root;
  wall.rotation.y=.4; addShadow(wall);

  /* Scattered stones */
  for(let i=0;i<5;i++){
    const stone=BABYLON.MeshBuilder.CreateBox('rstone'+i,{width:rng(.3,.8),height:rng(.2,.5),depth:rng(.3,.7)},scene);
    stone.position=v3(rng(-2,2),rng(.1,.4),rng(-2,2));
    stone.rotation.y=R()*PI; stone.material=matRockDk; stone.parent=root;
  }
  return root;
}
addShadows(createRuins());

/* ================================================================
   DECORATIVE ELEMENTS
   ================================================================ */
/* Rocks scattered */
for(let i=0;i<15;i++){
  const a=R()*TAU, d=rng(2,14);
  const rock=BABYLON.MeshBuilder.CreateSphere('rock'+i,{diameter:rng(.3,1.2),segments:5},scene);
  rock.position=v3(cos(a)*d,2+R()*.2,sin(a)*d);
  rock.scaling.y=rng(.4,.8);
  rock.material=matRockDk; addShadow(rock);
}

/* Fence near village */
function createFence(x1,z1,x2,z2){
  const dx=x2-x1,dz=z2-z1,len=sqrt(dx*dx+dz*dz);
  const angle=atan2(dx,dz);
  const posts=floor(len/.8);
  for(let i=0;i<=posts;i++){
    const t=i/posts;
    const post=BABYLON.MeshBuilder.CreateCylinder('fpost'+i,{height:1.2,diameter:.1,tessellation:6},scene);
    post.position=v3(x1+dx*t,2.6,z1+dz*t); post.material=matWood; addShadow(post);
  }
  /* Rails */
  const rail=BABYLON.MeshBuilder.CreateBox('frail',{width:len,height:.06,depth:.06},scene);
  rail.position=v3((x1+x2)/2,3,(z1+z2)/2); rail.rotation.y=-angle; rail.material=matWoodDk;
}
function atan2(a,b){return Math.atan2(a,b);}
createFence(-9,-7,-5,-7);
createFence(6,-8,10,-5);

/* ================================================================
   GLOW & ATMOSPHERE
   ================================================================ */
/* Tiny glowing orbs for magic feel */
for(let i=0;i<8;i++){
  const a=R()*TAU, d=rng(3,12);
  const orb=BABYLON.MeshBuilder.CreateSphere('orb'+i,{diameter:.2,segments:6},scene);
  orb.position=v3(cos(a)*d,rng(3,8),sin(a)*d);
  const om=mat('orbMat',c3(0,0,0),null,c3(.3+R()*.4,.5+R()*.3,.8+R()*.2));
  om.alpha=.6; orb.material=om;
}

/* ================================================================
   ANIMATION
   ================================================================ */
let time=0;
scene.registerBeforeRender(()=>{
  time+=engine.getDeltaTime()*.001;

  /* Slow camera auto-rotate when idle */
  if(!scene.activeCamera._localDirection || scene.activeCamera._localDirection.length()<.01){
    camera.alpha+=.0003;
  }

  /* Animate water (scroll UV) */
  if(matWater._diffuseTexture){
    matWater._diffuseTexture.uOffset+=.002;
  }

  /* Animate orbs */
  scene.getMeshesByTags('orb',m=>{}); // no tags, iterate
  scene.meshes.forEach(m=>{
    if(m.name.startsWith('orb')){
      m.position.y+=sin(time*2+m.position.x)*.003;
    }
  });

  /* Flag waving via rotation */
  scene.meshes.forEach(m=>{
    if(m.name.startsWith('flag')){
      m.rotation.y=sin(time*3+m.position.x)*.2;
    }
  });
});

/* ================================================================
   Render loop
   ================================================================ */
engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
</script>
