<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Floating Medieval Island Diorama</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #info-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-radius: 10px;
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease-in-out 3s;
        }

        #info-overlay.hidden {
            opacity: 0;
        }
    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/postprocesses/babylon.defaultRenderingPipeline.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>
    <div id="info-overlay">
        <p><strong>Floating Medieval Island Diorama</strong></p>
        <span>Drag to rotate | Scroll to zoom</span>
    </div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.15, 0.25, 0.45, 1.0);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogDensity = 0.006;
            scene.fogColor = new BABYLON.Color3(0.15, 0.25, 0.45);

            // --- Camera ---
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2.5, Math.PI / 3, 150, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 300;
            camera.wheelPrecision = 20;

            // --- Lighting ---
            const light = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.9;
            light.diffuse = new BABYLON.Color3(1, 1, 1);
            light.specular = new BABYLON.Color3(0.5, 0.5, 0.5);
            light.groundColor = new BABYLON.Color3(0.5, 0.4, 0.3);

            // --- Materials ---
            const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
            grassMat.diffuseColor = new BABYLON.Color3.FromHexString("#4CAF50");

            const rockMat = new BABYLON.StandardMaterial("rockMat", scene);
            rockMat.diffuseColor = new BABYLON.Color3.FromHexString("#795548");

            const stoneMat = new BABYLON.StandardMaterial("stoneMat", scene);
            stoneMat.diffuseColor = new BABYLON.Color3.FromHexString("#BDBDBD");

            const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
            woodMat.diffuseColor = new BABYLON.Color3.FromHexString("#8D6E63");

            const roofMat = new BABYLON.StandardMaterial("roofMat", scene);
            roofMat.diffuseColor = new BABYLON.Color3.FromHexString("#A1887F");

            const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
            waterMat.diffuseColor = new BABYLON.Color3.FromHexString("#4DD0E1");
            waterMat.alpha = 0.75;

            // --- Island Base ---
            const islandParent = new BABYLON.TransformNode("islandParent", scene);
            const grassTop = BABYLON.MeshBuilder.CreateCylinder("grassTop", { height: 10, diameter: 100 }, scene);
            grassTop.material = grassMat;
            grassTop.parent = islandParent;

            const rockyBottom = BABYLON.MeshBuilder.CreateIcoSphere("rockyBottom", { radius: 60, subdivisions: 4 }, scene);
            rockyBottom.scaling.y = 1.2;
            rockyBottom.position.y = -40;
            rockyBottom.material = rockMat;
            rockyBottom.parent = islandParent;
            
            // Randomize rock vertices for a more natural look
            const positions = rockyBottom.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                const randomFactor = 1 + Math.random() * 0.1;
                positions[i] *= randomFactor;
                positions[i+1] *= randomFactor;
                positions[i+2] *= randomFactor;
            }
            rockyBottom.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
            rockyBottom.convertToFlatShadedMesh();


            // --- Helper Functions for Structures ---

            function createPineTree(position, height = 10, parent) {
                const tree = new BABYLON.TransformNode("tree", scene);
                tree.position = position;
                tree.parent = parent;

                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { height: height, diameter: 0.8 }, scene);
                trunk.material = woodMat;
                trunk.position.y = height / 2;
                trunk.parent = tree;

                for (let i = 0; i < 5; i++) {
                    const foliage = BABYLON.MeshBuilder.CreateCylinder("foliage", { height: height * 0.6, diameterTop: 0, diameterBottom: height * 0.7 - i * 2 }, scene);
                    foliage.material = grassMat;
                    foliage.position.y = height * 0.6 + i * 1.5;
                    foliage.parent = tree;
                }
                return tree;
            }

            function createHouse(position, rotationY, parent, isTavern = false) {
                const house = new BABYLON.TransformNode("house", scene);
                house.position = position;
                house.rotation.y = rotationY;
                house.parent = parent;

                const baseHeight = isTavern ? 4 : 3;
                const base = BABYLON.MeshBuilder.CreateBox("base", { width: 6, height: baseHeight, depth: 8 }, scene);
                base.material = woodMat;
                base.position.y = baseHeight / 2;
                base.parent = house;

                const roof = BABYLON.MeshBuilder.CreateCylinder("roof", { height: 8.5, diameter: 5.5, tessellation: 3 }, scene);
                roof.scaling.x = 1.2;
                roof.rotation.x = Math.PI / 2;
                roof.rotation.z = Math.PI / 2;
                roof.material = roofMat;
                roof.position.y = baseHeight + 1.5;
                roof.parent = house;
                
                if (isTavern) {
                    const extension = BABYLON.MeshBuilder.CreateBox("ext", { width: 4, height: baseHeight, depth: 4 }, scene);
                    extension.material = woodMat;
                    extension.position.y = baseHeight / 2;
                    extension.position.x = 5;
                    extension.parent = house;
                }
                
                return house;
            }

            function createMarketStall(position, rotationY, parent) {
                const stall = new BABYLON.TransformNode("stall", scene);
                stall.position = position;
                stall.rotation.y = rotationY;
                stall.parent = parent;

                const table = BABYLON.MeshBuilder.CreateBox("table", {width: 4, height: 1, depth: 2}, scene);
                table.material = woodMat;
                table.position.y = 1.5;
                table.parent = stall;
                
                const canopyMat = new BABYLON.StandardMaterial("canopyMat", scene);
                canopyMat.diffuseColor = BABYLON.Color3.White();
                const canopy = BABYLON.MeshBuilder.CreatePlane("canopy", {width: 4.5, height: 2.5}, scene);
                canopy.material = canopyMat;
                canopy.position.y = 3.5;
                canopy.rotation.x = 0.2;
                canopy.parent = stall;
                
                return stall;
            }

            function createCastle(position, parent) {
                const castle = new BABYLON.TransformNode("castle", scene);
                castle.position = position;
                castle.parent = parent;

                const wallSize = 25;
                const wallHeight = 10;
                
                const createTower = (pos, height) => {
                    const tower = BABYLON.MeshBuilder.CreateCylinder("tower", { diameter: 8, height: height }, scene);
                    tower.material = stoneMat;
                    tower.position = pos;
                    tower.position.y = height / 2;
                    tower.parent = castle;
                    for (let i = 0; i < 8; i++) {
                        const merlon = BABYLON.MeshBuilder.CreateBox("merlon", {size: 1.5}, scene);
                        merlon.material = stoneMat;
                        merlon.position.x = Math.sin(i * Math.PI/4) * 3.5;
                        merlon.position.z = Math.cos(i * Math.PI/4) * 3.5;
                        merlon.position.y = height/2 + 0.75;
                        merlon.parent = tower;
                    }
                    return tower;
                };

                const createWall = (start, end) => {
                    const diff = end.subtract(start);
                    const length = diff.length();
                    const wall = BABYLON.MeshBuilder.CreateBox("wall", { width: length, height: wallHeight, depth: 2 }, scene);
                    wall.material = stoneMat;
                    wall.position = start.add(diff.scale(0.5));
                    wall.position.y = wallHeight / 2;
                    wall.rotation.y = Math.atan2(diff.x, diff.z);
                    wall.parent = castle;
                    return wall;
                };

                // Towers
                const t1 = new BABYLON.Vector3(-wallSize, 0, -wallSize);
                const t2 = new BABYLON.Vector3(wallSize, 0, -wallSize);
                const t3 = new BABYLON.Vector3(wallSize, 0, wallSize);
                const t4 = new BABYLON.Vector3(-wallSize, 0, wallSize);
                createTower(t1, 15);
                createTower(t2, 15);
                createTower(t3, 15);
                createTower(t4, 15);

                // Walls
                createWall(t1, t2);
                createWall(t3, t4);
                createWall(t4, t1);
                
                // Gatehouse
                const gateLeft = new BABYLON.Vector3(wallSize, 0, 5);
                const gateRight = new BABYLON.Vector3(wallSize, 0, -5);
                createTower(gateLeft, 18);
                createTower(gateRight, 18);
                const gateLintel = BABYLON.MeshBuilder.CreateBox("lintel", {width: 10, height: 3, depth: 2}, scene);
                gateLintel.material = stoneMat;
                gateLintel.position = new BABYLON.Vector3(wallSize, 14, 0);
                gateLintel.parent = castle;
                
                // Keep
                createTower(new BABYLON.Vector3(0, 0, 0), 25);
            }
            
            function createWatchtower(position, parent) {
                const towerNode = new BABYLON.TransformNode("watchtower", scene);
                towerNode.position = position;
                towerNode.parent = parent;
                
                const tower = BABYLON.MeshBuilder.CreateCylinder("ruined_tower", {diameter: 10, height: 18, tessellation: 12}, scene);
                tower.material = stoneMat;
                tower.position.y = 9;
                tower.parent = towerNode;
                
                // Make it look ruined
                const positions = tower.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                for (let i = 0; i < positions.length; i += 3) {
                    if (positions[i+1] > 6) { // if vertex is near the top
                        positions[i+1] -= Math.random() * 5 * (positions[i+1] - 6)/3;
                    }
                }
                tower.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
                tower.convertToFlatShadedMesh();
            }

            // --- River ---
            const riverPath = [
                new BABYLON.Vector3(10, 5.1, 10),
                new BABYLON.Vector3(20, 5.1, 20),
                new BABYLON.Vector3(25, 5.1, 35),
                new BABYLON.Vector3(15, 5.1, 48),
                new BABYLON.Vector3(0, 5.1, 50),
                new BABYLON.Vector3(-15, 5.1, 48),
                new BABYLON.Vector3(-30, 5.1, 35),
                new BABYLON.Vector3(-45, 5.1, 20),
                new BABYLON.Vector3(-50, 5.1, 0)
            ];
            const river = BABYLON.MeshBuilder.CreateRibbon("river", { pathArray: [riverPath], width: 5, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
            river.material = waterMat;
            river.parent = islandParent;

            // Waterfall
            const waterfall = BABYLON.MeshBuilder.CreatePlane("waterfall", {width: 6, height: 60}, scene);
            waterfall.material = waterMat;
            waterfall.position = new BABYLON.Vector3(-50, -25, 0);
            waterfall.rotation.y = Math.PI/2;
            waterfall.parent = islandParent;

            // --- Scene Assembly ---
            
            // Castle
            createCastle(new BABYLON.Vector3(0, 5, -15), islandParent);
            
            // Village
            createHouse(new BABYLON.Vector3(28, 5, 25), Math.PI / 6, islandParent);
            createHouse(new BABYLON.Vector3(35, 5, 35), -Math.PI / 4, islandParent);
            createHouse(new BABYLON.Vector3(20, 5, 40), Math.PI / 2, islandParent, true); // Tavern
            
            createMarketStall(new BABYLON.Vector3(10, 5, 25), 0, islandParent);
            createMarketStall(new BABYLON.Vector3(15, 5, 25), 0, islandParent);
            
            // Water Mill
            const millHouse = createHouse(new BABYLON.Vector3(-38, 5, 28), Math.PI/1.5, islandParent);
            const waterWheel = BABYLON.MeshBuilder.CreateCylinder("waterWheel", {diameter: 8, height: 1, tessellation: 8}, scene);
            waterWheel.material = woodMat;
            waterWheel.parent = millHouse;
            waterWheel.position.x = -4;
            waterWheel.position.y = 2;
            waterWheel.rotation.z = Math.PI / 2;
            scene.registerBeforeRender(() => {
                waterWheel.rotation.x += 0.01;
            });
            
            // Watchtower
            createWatchtower(new BABYLON.Vector3(40, 5, -20), islandParent);

            // Trees and Scenery
            createPineTree(new BABYLON.Vector3(15, 5, 15), 12, islandParent);
            createPineTree(new BABYLON.Vector3(-10, 5, 15), 10, islandParent);
            createPineTree(new BABYLON.Vector3(-25, 5, -10), 15, islandParent);
            createPineTree(new BABYLON.Vector3(30, 5, 5), 11, islandParent);
            createPineTree(new BABYLON.Vector3(38, 5, 15), 13, islandParent);
            createPineTree(new BABYLON.Vector3(-40, 5, 40), 10, islandParent);
            createPineTree(new BABYLON.Vector3(-20, 5, 45), 12, islandParent);
            
            // Bridges
            const createBridge = (pos) => {
                const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {width: 3, height: 0.5, depth: 7}, scene);
                bridge.material = woodMat;
                bridge.position = pos;
                bridge.parent = islandParent;
            };
            createBridge(new BABYLON.Vector3(22.5, 5, 27.5));
            createBridge(new BABYLON.Vector3(-22.5, 5, 41.5));
            
            // --- Post-processing ---
            const pipeline = new BABYLON.DefaultRenderingPipeline("defaultPipeline", true, scene, [camera]);
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.8;
            pipeline.bloomWeight = 0.3;
            pipeline.bloomKernel = 64;
            pipeline.bloomScale = 0.5;

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener('resize', function () {
            engine.resize();
        });
        
        // Hide info overlay after a few seconds
        setTimeout(() => {
            document.getElementById('info-overlay').classList.add('hidden');
        }, 1000);

    </script>
</body>
</html>
