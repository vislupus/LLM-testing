<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e; /* Dark background to frame the bright island */
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            pointer-events: none;
        }
    </style>
    <!-- Load Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="loading">Crafting Diorama...</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.12, 0.2, 1); // Dark sky

            // --- CAMERA ---
            // Orbit camera set up for a tabletop/isometric feel
            const camera = new BABYLON.ArcRotateCamera("camera", 
                Math.PI / 4, 
                Math.PI / 3, 
                120, 
                new BABYLON.Vector3(0, 5, 0), 
                scene
            );
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 20;
            camera.minZ = 0.1;
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 250;

            // --- LIGHTING ---
            const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.4;
            ambientLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);

            const sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), scene);
            sunLight.position = new BABYLON.Vector3(50, 100, 50);
            sunLight.intensity = 1.2;

            // Shadows are crucial for the miniature look
            const shadowGen = new BABYLON.ShadowGenerator(2048, sunLight);
            shadowGen.useBlurExponentialShadowMap = true;
            shadowGen.useKernelBlur = true;
            shadowGen.blurKernel = 32;

            // --- MATERIALS PALETTE ---
            const mats = {
                grass: new BABYLON.StandardMaterial("grass", scene),
                rock: new BABYLON.StandardMaterial("rock", scene),
                stone: new BABYLON.StandardMaterial("stone", scene),
                wood: new BABYLON.StandardMaterial("wood", scene),
                roofRed: new BABYLON.StandardMaterial("roofRed", scene),
                roofBlue: new BABYLON.StandardMaterial("roofBlue", scene),
                water: new BABYLON.StandardMaterial("water", scene),
                waterfall: new BABYLON.StandardMaterial("waterfall", scene),
                pine: new BABYLON.StandardMaterial("pine", scene),
                trunk: new BABYLON.StandardMaterial("trunk", scene),
                cloth1: new BABYLON.StandardMaterial("cloth1", scene),
                cloth2: new BABYLON.StandardMaterial("cloth2", scene),
                dirt: new BABYLON.StandardMaterial("dirt", scene)
            };

            // Vibrant, stylized colors
            mats.grass.diffuseColor = BABYLON.Color3.FromHexString("#4CAF50");
            mats.grass.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            
            mats.rock.diffuseColor = BABYLON.Color3.FromHexString("#78909C");
            mats.rock.specularPower = 10;

            mats.stone.diffuseColor = BABYLON.Color3.FromHexString("#B0BEC5");
            mats.stone.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);

            mats.wood.diffuseColor = BABYLON.Color3.FromHexString("#5D4037");
            
            mats.roofRed.diffuseColor = BABYLON.Color3.FromHexString("#D32F2F");
            mats.roofBlue.diffuseColor = BABYLON.Color3.FromHexString("#1976D2");

            mats.pine.diffuseColor = BABYLON.Color3.FromHexString("#2E7D32");
            mats.trunk.diffuseColor = BABYLON.Color3.FromHexString("#4E342E");

            mats.cloth1.diffuseColor = BABYLON.Color3.FromHexString("#FFC107");
            mats.cloth2.diffuseColor = BABYLON.Color3.FromHexString("#E91E63");

            mats.dirt.diffuseColor = BABYLON.Color3.FromHexString("#8D6E63");

            // Turquoise Water
            mats.water.diffuseColor = BABYLON.Color3.FromHexString("#00BCD4");
            mats.water.alpha = 0.85;
            mats.water.specularPower = 64;
            mats.water.specularColor = new BABYLON.Color3(1, 1, 1);

            mats.waterfall.diffuseColor = BABYLON.Color3.FromHexString("#80DEEA");
            mats.waterfall.alpha = 0.7;
            mats.waterfall.emissiveColor = BABYLON.Color3.FromHexString("#00ACC1");

            // Helper to add meshes to scene and shadows
            function add(mesh, mat, receiveShadows = true) {
                if (mat) mesh.material = mat;
                if (receiveShadows) mesh.receiveShadows = true;
                shadowGen.addShadowCaster(mesh);
                return mesh;
            }

            // --- BUILDER FUNCTIONS ---

            function buildIslandBase() {
                // Main grassy plateau
                const ground = BABYLON.MeshBuilder.CreateCylinder("ground", { diameter: 70, height: 4, tessellation: 64 });
                ground.position.y = 0;
                add(ground, mats.grass);

                // Add some rolling hills
                const hill1 = BABYLON.MeshBuilder.CreateSphere("hill", { diameterX: 30, diameterZ: 20, diameterY: 8 });
                hill1.position = new BABYLON.Vector3(15, 0, 15);
                add(hill1, mats.grass);

                const hill2 = BABYLON.MeshBuilder.CreateSphere("hill", { diameterX: 20, diameterZ: 25, diameterY: 6 });
                hill2.position = new BABYLON.Vector3(-15, 0, -20);
                add(hill2, mats.grass);

                // Rocky underbelly (intersecting random polyhedrons)
                for (let i = 0; i < 25; i++) {
                    const size = 10 + Math.random() * 20;
                    const rock = BABYLON.MeshBuilder.CreatePolyhedron("rock", { type: Math.floor(Math.random() * 4), size: size/2 });
                    rock.position.x = (Math.random() - 0.5) * 50;
                    rock.position.z = (Math.random() - 0.5) * 50;
                    rock.position.y = -2 - (Math.random() * 15) - (20 - Math.sqrt(rock.position.x**2 + rock.position.z**2)); // Cone shape downward
                    rock.rotation.x = Math.random() * Math.PI;
                    rock.rotation.y = Math.random() * Math.PI;
                    add(rock, mats.rock);
                }

                // Steep cliffs at edges
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const cliff = BABYLON.MeshBuilder.CreateBox("cliff", { width: 15, depth: 10, height: 20 });
                    cliff.position.x = Math.cos(angle) * 32;
                    cliff.position.z = Math.sin(angle) * 32;
                    cliff.position.y = -8;
                    cliff.lookAt(new BABYLON.Vector3(0, -8, 0));
                    cliff.rotation.x += (Math.random() - 0.5) * 0.5;
                    add(cliff, mats.rock);
                }
            }

            function buildRiverAndWaterfalls() {
                // Create a recessed riverbed by placing grassy banks over a flat water plane
                const waterPlane = BABYLON.MeshBuilder.CreatePlane("water", { width: 80, height: 80 });
                waterPlane.rotation.x = Math.PI / 2;
                waterPlane.position.y = 1.8;
                add(waterPlane, mats.water, false);

                // Bank blocks to define the river path (winding from X:35 to X:-35 through Z:10)
                const bankLeft = BABYLON.MeshBuilder.CreateBox("bankL", { width: 80, depth: 30, height: 5 });
                bankLeft.position = new BABYLON.Vector3(0, 0.5, 30);
                add(bankLeft, mats.grass);

                const bankRight = BABYLON.MeshBuilder.CreateBox("bankR", { width: 80, depth: 30, height: 5 });
                bankRight.position = new BABYLON.Vector3(0, 0.5, -15);
                add(bankRight, mats.grass);

                // Island in the middle of the river
                const riverIsland = BABYLON.MeshBuilder.CreateCylinder("ri", { diameter: 12, height: 4 });
                riverIsland.position = new BABYLON.Vector3(15, 0.5, 10);
                add(riverIsland, mats.grass);

                // Waterfall Front
                const fallFront = BABYLON.MeshBuilder.CreatePlane("fall1", { width: 15, height: 25 });
                fallFront.position = new BABYLON.Vector3(-35, -8, 7.5);
                fallFront.rotation.y = -Math.PI / 2;
                add(fallFront, mats.waterfall, false);

                // Waterfall Back
                const fallBack = BABYLON.MeshBuilder.CreatePlane("fall2", { width: 15, height: 25 });
                fallBack.position = new BABYLON.Vector3(35, -8, 7.5);
                fallBack.rotation.y = Math.PI / 2;
                add(fallBack, mats.waterfall, false);
            }

            function buildBridge(x, z, rotY) {
                const bridge = new BABYLON.TransformNode("bridge");
                bridge.position = new BABYLON.Vector3(x, 2, z);
                bridge.rotation.y = rotY;

                const arch = BABYLON.MeshBuilder.CreateCylinder("arch", { diameter: 12, height: 4, tessellation: 16 });
                arch.rotation.z = Math.PI / 2;
                arch.position.y = -2;
                
                // Use a box to boolean cut the arch (simulated by just intersecting with water)
                add(arch, mats.wood);
                arch.parent = bridge;

                const deck = BABYLON.MeshBuilder.CreateBox("deck", { width: 14, depth: 4, height: 0.5 });
                deck.position.y = 4;
                add(deck, mats.wood);
                deck.parent = bridge;

                for(let i=-1; i<=1; i+=2) {
                    const railing = BABYLON.MeshBuilder.CreateBox("rail", { width: 14, depth: 0.2, height: 1 });
                    railing.position.y = 4.75;
                    railing.position.z = i * 1.9;
                    add(railing, mats.wood);
                    railing.parent = bridge;
                }
            }

            function buildCastle() {
                const group = new BABYLON.TransformNode("castle");
                group.position = new BABYLON.Vector3(0, 2, -5);

                // Main Keep
                const keep = BABYLON.MeshBuilder.CreateBox("keep", { width: 12, depth: 10, height: 15 });
                keep.position.y = 7.5;
                add(keep, mats.stone).parent = group;

                // Keep Roof
                const keepRoof = BABYLON.MeshBuilder.CreateCylinder("kroof", { diameter: 16, height: 6, tessellation: 4 });
                keepRoof.rotation.y = Math.PI / 4;
                keepRoof.position.y = 18;
                add(keepRoof, mats.roofBlue).parent = group;

                // Towers
                const towerPos = [[-6, -5], [6, -5], [-6, 5], [6, 5]];
                towerPos.forEach(pos => {
                    const tower = BABYLON.MeshBuilder.CreateCylinder("tower", { diameter: 4, height: 18 });
                    tower.position = new BABYLON.Vector3(pos[0], 9, pos[1]);
                    add(tower, mats.stone).parent = group;

                    const roof = BABYLON.MeshBuilder.CreateCylinder("troof", { diameter: 5, height: 5, tessellation: 8, diameterTop: 0 });
                    roof.position = new BABYLON.Vector3(pos[0], 20.5, pos[1]);
                    add(roof, mats.roofBlue).parent = group;
                });

                // Walls
                const wall1 = BABYLON.MeshBuilder.CreateBox("wall", { width: 12, depth: 2, height: 8 });
                wall1.position = new BABYLON.Vector3(0, 4, -5);
                add(wall1, mats.stone).parent = group;

                // Gatehouse
                const gate = BABYLON.MeshBuilder.CreateBox("gate", { width: 6, depth: 3, height: 10 });
                gate.position = new BABYLON.Vector3(0, 5, -6);
                add(gate, mats.stone).parent = group;
                
                const door = BABYLON.MeshBuilder.CreateBox("door", { width: 3, depth: 3.2, height: 4 });
                door.position = new BABYLON.Vector3(0, 2, -6);
                add(door, mats.wood).parent = group;
            }

            function buildHouse(x, z, rotY, size, matRoof, isTavern = false) {
                const group = new BABYLON.TransformNode("house");
                group.position = new BABYLON.Vector3(x, 2, z);
                group.rotation.y = rotY;

                const w = size;
                const d = size * 1.2;
                const h = size;

                // Base
                const base = BABYLON.MeshBuilder.CreateBox("base", { width: w, depth: d, height: h });
                base.position.y = h / 2;
                add(base, mats.wood).parent = group;

                // Plaster top floor
                const top = BABYLON.MeshBuilder.CreateBox("top", { width: w*1.1, depth: d*1.1, height: h*0.8 });
                top.position.y = h + (h*0.4);
                add(top, mats.stone).parent = group; // using stone mat as dirty plaster

                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("roof", { diameter: Math.max(w,d)*1.8, height: d*1.2, tessellation: 3 });
                roof.rotation.z = Math.PI / 2;
                roof.rotation.x = Math.PI / 2;
                roof.position.y = h * 2.2;
                add(roof, matRoof).parent = group;

                if (isTavern) {
                    const chimney = BABYLON.MeshBuilder.CreateBox("chimney", { width: 1, depth: 1, height: 4 });
                    chimney.position = new BABYLON.Vector3(w/2.5, h*2.5, 0);
                    add(chimney, mats.stone).parent = group;
                    
                    const sign = BABYLON.MeshBuilder.CreateBox("sign", { width: 0.2, depth: 1.5, height: 1.5 });
                    sign.position = new BABYLON.Vector3(-w/2 - 0.2, h, d/3);
                    add(sign, mats.cloth1).parent = group;
                }
            }

            function buildMill(x, z) {
                buildHouse(x, z, Math.PI/4, 4, mats.roofRed, false);
                
                // Waterwheel
                const wheel = BABYLON.MeshBuilder.CreateCylinder("wheel", { diameter: 8, height: 1, tessellation: 12 });
                wheel.rotation.x = Math.PI / 2;
                wheel.position = new BABYLON.Vector3(x - 3, 2, z + 3);
                add(wheel, mats.wood);

                // Animate wheel
                scene.onBeforeRenderObservable.add(() => {
                    wheel.rotation.y -= 0.01;
                });
            }

            function buildMarketStall(x, z, rotY, matCloth) {
                const group = new BABYLON.TransformNode("stall");
                group.position = new BABYLON.Vector3(x, 2, z);
                group.rotation.y = rotY;

                const table = BABYLON.MeshBuilder.CreateBox("table", { width: 3, depth: 1.5, height: 1 });
                table.position.y = 0.5;
                add(table, mats.wood).parent = group;

                const poles = [[-1.4, -0.6], [1.4, -0.6], [-1.4, 0.6], [1.4, 0.6]];
                poles.forEach(p => {
                    const pole = BABYLON.MeshBuilder.CreateCylinder("pole", { diameter: 0.2, height: 3 });
                    pole.position = new BABYLON.Vector3(p[0], 1.5, p[1]);
                    add(pole, mats.wood).parent = group;
                });

                const awning = BABYLON.MeshBuilder.CreatePlane("awning", { width: 3.2, height: 2.5 });
                awning.position = new BABYLON.Vector3(0, 3.2, 0.5);
                awning.rotation.x = -Math.PI / 4;
                add(awning, matCloth, false).parent = group; // Double sided via material if needed, but plane is single sided. Let's use a thin box.
                
                const awningBox = BABYLON.MeshBuilder.CreateBox("awningB", { width: 3.2, depth: 2.5, height: 0.1 });
                awningBox.position = new BABYLON.Vector3(0, 3.1, 0.2);
                awningBox.rotation.x = -Math.PI / 6;
                add(awningBox, matCloth).parent = group;
            }

            function buildPineTree(x, z, scale) {
                const group = new BABYLON.TransformNode("tree");
                group.position = new BABYLON.Vector3(x, 2, z);
                group.scaling = new BABYLON.Vector3(scale, scale, scale);

                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { diameter: 1, height: 3 });
                trunk.position.y = 1.5;
                add(trunk, mats.trunk).parent = group;

                for (let i = 0; i < 3; i++) {
                    const leaves = BABYLON.MeshBuilder.CreateCylinder("leaves", { 
                        diameterBottom: 4 - i, diameterTop: 0, height: 3.5 
                    });
                    leaves.position.y = 3 + (i * 1.8);
                    add(leaves, mats.pine).parent = group;
                }
            }

            function buildRuins(x, z) {
                const group = new BABYLON.TransformNode("ruins");
                group.position = new BABYLON.Vector3(x, 2, z);

                // Broken tower base
                const base = BABYLON.MeshBuilder.CreateCylinder("rbase", { diameter: 8, height: 6, tessellation: 8 });
                base.position.y = 3;
                add(base, mats.stone).parent = group;

                // Jagged broken top pieces
                for(let i=0; i<6; i++) {
                    const block = BABYLON.MeshBuilder.CreateBox("block", { width: 2, depth: 2, height: 2+Math.random()*4 });
                    block.position.y = 6 + block.scaling.y/2;
                    block.position.x = Math.cos(i) * 3;
                    block.position.z = Math.sin(i) * 3;
                    block.rotation.x = (Math.random()-0.5);
                    block.rotation.z = (Math.random()-0.5);
                    add(block, mats.stone).parent = group;
                }

                // Scatter
                for(let i=0; i<10; i++) {
                    const rubble = BABYLON.MeshBuilder.CreatePolyhedron("rubble", { type: 1, size: 0.5+Math.random() });
                    rubble.position = new BABYLON.Vector3((Math.random()-0.5)*15, 0.5, (Math.random()-0.5)*15);
                    rubble.rotation.y = Math.random() * Math.PI;
                    add(rubble, mats.rock).parent = group;
                }
            }

            // --- SCENE ASSEMBLY ---

            buildIslandBase();
            buildRiverAndWaterfalls();
            
            buildCastle();

            // Village around castle
            buildHouse(-12, -18, Math.PI/6, 3.5, mats.roofRed);
            buildHouse(-18, -12, -Math.PI/4, 3, mats.roofBlue);
            buildHouse(12, -15, -Math.PI/3, 4, mats.roofRed, true); // Tavern
            buildHouse(18, -8, Math.PI/2, 3.5, mats.roofBlue);

            // Market near tavern
            buildMarketStall(5, -18, 0, mats.cloth1);
            buildMarketStall(10, -22, Math.PI/8, mats.cloth2);
            buildMarketStall(0, -20, -Math.PI/6, mats.cloth1);

            // Riverside
            buildMill(-22, 5);
            buildBridge(0, 7.5, 0);

            // Wilderness (Trees)
            for(let i=0; i<30; i++) {
                const tx = 10 + Math.random() * 20;
                const tz = 10 + Math.random() * 20;
                buildPineTree(tx, tz, 0.6 + Math.random()*0.8);
            }
            for(let i=0; i<15; i++) {
                const tx = -20 - Math.random() * 10;
                const tz = -15 - Math.random() * 15;
                buildPineTree(tx, tz, 0.6 + Math.random()*0.8);
            }

            // Ruins on the back cliff
            buildRuins(-20, 20);

            // Add some dirt paths
            const path = BABYLON.MeshBuilder.CreateGround("path", {width: 40, height: 10});
            path.position = new BABYLON.Vector3(0, 2.1, -15);
            add(path, mats.dirt, false);


            // --- POST PROCESSING (The "Miniature Tabletop" Magic) ---
            const pipeline = new BABYLON.DefaultRenderingPipeline("default", true, scene, [camera]);
            
            // Anti-aliasing
            pipeline.samples = 4;
            pipeline.fxaaEnabled = true;

            // Ambient Occlusion for deep crevices
            pipeline.ssaoEnabled = true;
            pipeline.ssao.ratio = 1;
            pipeline.ssao.radius = 2;
            pipeline.ssao.totalStrength = 1.5;

            // Bloom for sunlight hitting water/roofs
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.8;
            pipeline.bloomWeight = 0.3;

            // Depth of Field (Tilt-Shift effect)
            pipeline.depthOfFieldEnabled = true;
            pipeline.depthOfField.focusDistance = 15000; // Tweaked for the specific camera distance
            pipeline.depthOfField.focalLength = 150;
            pipeline.depthOfField.fStop = 1.2;
            pipeline.depthOfFieldBlurLevel = BABYLON.DepthOfFieldEffectBlurLevel.High;

            // Auto-focus on center (Castle)
            scene.onBeforeRenderObservable.add(() => {
                const ray = new BABYLON.Ray(camera.position, camera.getTarget().subtract(camera.position).normalize());
                pipeline.depthOfField.focusDistance = BABYLON.Vector3.Distance(camera.position, BABYLON.Vector3.Zero()) * 100;
            });

            // Color grading (warm, saturated)
            pipeline.imageProcessingEnabled = true;
            pipeline.imageProcessing.contrast = 1.2;
            pipeline.imageProcessing.exposure = 1.1;

            return scene;
        };

        const scene = createScene();

        // Hide loading text once scene is ready
        scene.executeWhenReady(() => {
            document.getElementById("loading").style.display = "none";
        });

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
