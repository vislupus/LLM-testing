<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aldermere — a floating isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#26211a; --muted:#6f675a; --cream:rgba(250,246,235,.9);
    --line:rgba(72,58,38,.25); --pine:#35604a; --amber:#a8702e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#dfe9e4}
  body{font-family:'Fraunces',Georgia,serif;color:var(--ink)}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}

  .ui{position:fixed;inset:0;pointer-events:none;z-index:5;user-select:none}
  .card{pointer-events:auto;background:var(--cream);border:1px solid var(--line);
        border-radius:14px;box-shadow:0 10px 30px rgba(40,32,18,.14);backdrop-filter:blur(7px)}

  .title-card{position:absolute;top:18px;left:18px;padding:14px 18px 13px;max-width:280px}
  .overline{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .title-card h1{margin:3px 0 4px;font-size:27px;font-weight:600;letter-spacing:.01em;line-height:1}
  .title-card p{margin:0;font-size:12px;line-height:1.45;color:var(--muted);font-style:italic}

  .mood-btn{position:absolute;top:18px;right:18px;display:flex;align-items:center;gap:8px;
    padding:9px 14px;font:500 12.5px/1 'Fraunces',serif;color:var(--ink);cursor:pointer;transition:.15s}
  .mood-btn:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(40,32,18,.2)}
  .mood-btn svg{color:var(--amber)}
  .mood-btn .ico-moon{display:none}
  .mood-btn.dusk .ico-sun{display:none}
  .mood-btn.dusk .ico-moon{display:block}

  .nav{position:absolute;bottom:18px;right:18px;display:flex;padding:5px;gap:2px}
  .nav button{display:flex;align-items:center;gap:7px;padding:8px 12px;border:0;border-radius:10px;
    background:none;font:500 12.5px/1 'Fraunces',serif;color:var(--ink);cursor:pointer;transition:.13s}
  .nav button:hover{background:rgba(53,96,74,.09)}
  .nav button.active{background:var(--pine);color:#f6f2e6}
  .nav button svg{opacity:.85}

  .hint{position:absolute;bottom:18px;left:18px;padding:9px 13px;font-size:11.5px;color:var(--muted);
    line-height:1.5;pointer-events:none;border-radius:11px}
  .hint b{color:var(--ink);font-weight:600}
  .hint .tris{display:block;font-size:10.5px;opacity:.75;margin-top:2px;font-style:italic}

  .loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:linear-gradient(#f2ede0,#e4e7da);transition:opacity .7s}
  .loader.hide{opacity:0;pointer-events:none}
  .l-ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(72,58,38,.18);border-top-color:var(--pine);
    animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .l-title{font-size:26px;font-weight:600;letter-spacing:.02em}
  .l-sub{font-size:12px;font-style:italic;color:var(--muted)}

  @media (max-width:640px){
    .title-card{max-width:210px;padding:11px 14px}
    .title-card h1{font-size:22px}
    .title-card p{display:none}
    .hint{display:none}
    .nav button span{display:none}
    .nav button{padding:9px 11px}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="ui">
  <header class="card title-card">
    <div class="overline">Procedural tabletop diorama</div>
    <h1>Aldermere</h1>
    <p>a floating isle, grown entirely from code — no assets, no models.</p>
  </header>

  <button class="card mood-btn" id="moodBtn">
    <svg class="ico-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/></svg>
    <svg class="ico-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 13.5A8 8 0 0 1 10.5 4.5a8 8 0 1 0 9 9Z"/></svg>
    <span id="moodLabel">Golden hour</span>
  </button>

  <nav class="card nav" id="nav">
    <button data-v="overview" class="active"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m3 19 6-11 4 6 3-4 5 9Z"/></svg><span>Overview</span></button>
    <button data-v="castle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 21V8l-1.5-1V4H7v2h3V4h2v2h0V4h2v2h3V4h2.5v3L18 8v13"/><path d="M10 21v-4a2 2 0 0 1 4 0v4"/></svg><span>Castle</span></button>
    <button data-v="village"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m3 11 9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg><span>Village</span></button>
    <button data-v="falls"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M8.5 12c0 2.5 7 2.5 7 5"/><path d="M3 20c1.5-1.6 3-1.6 4.5 0 1.5 1.6 3 1.6 4.5 0 1.5-1.6 3-1.6 4.5 0 1.5 1.6 3 1.6 4.5 0"/></svg><span>The Falls</span></button>
  </nav>

  <div class="card hint" id="hint">
    <b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom &nbsp;·&nbsp; <b>right-drag</b> pan
    <span class="tris" id="tris"></span>
  </div>
</div>

<div class="loader" id="loader">
  <div class="l-ring"></div>
  <div class="l-title">Aldermere</div>
  <div class="l-sub" id="loadSub">shaping the isle…</div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js" onerror="window.__babFail=true"></script>
<script>
'use strict';
(function(){
const loader=$('loader')||document.getElementById('loader');
function $(id){return document.getElementById(id);}
if(window.__babFail||typeof BABYLON==='undefined'){
  $('loadSub').textContent='Babylon.js failed to load — please check your connection and reload.';
  return;
}

/* ================= utils ================= */
const V3=(x,y,z)=>new BABYLON.Vector3(x,y,z);
const C3=(r,g,b)=>new BABYLON.Color3(r,g,b);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function wrapPI(d){while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(20240607);

function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y,o=4){let s=0,amp=0.5,f=1;for(let i=0;i<o;i++){s+=amp*vnoise(x*f,y*f);f*=2.03;amp*=0.5;}return s;}

function hexC(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function mixC(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function shade(c,f){return[c[0]*f,c[1]*f,c[2]*f];}

function distToPolyline(pts,x,z){
  let best=1e9;
  for(let i=0;i<pts.length-1;i++){
    const ax=pts[i][0],az=pts[i][1],dx=pts[i+1][0]-ax,dz=pts[i+1][1]-az;
    const L2=dx*dx+dz*dz||1;
    let t=((x-ax)*dx+(z-az)*dz)/L2;t=clamp(t,0,1);
    const px=ax+dx*t-x,pz=az+dz*t-z,d=Math.sqrt(px*px+pz*pz);
    if(d<best)best=d;
  }
  return best;
}
function resample(pts,step){
  const out=[pts[0].slice()];
  for(let i=0;i<pts.length-1;i++){
    let ax=pts[i][0],az=pts[i][1];const bx=pts[i+1][0],bz=pts[i+1][1];
    let seg=Math.hypot(bx-ax,bz-az);
    while(seg>=step){
      const r=step/seg;ax+=(bx-ax)*r;az+=(bz-az)*r;seg-=step;
      out.push([ax,az]);
    }
  }
  out.push(pts[pts.length-1].slice());
  return out;
}

/* ================= terrain data ================= */
const R_EDGE=26, R_W=2.6, WATER_Y=-0.62;
function rimR(th){return R_EDGE*(1+0.07*Math.sin(th*3+0.8)+0.05*Math.sin(th*5+2.1)+0.035*Math.sin(th*8+4.0));}
const TH_EXIT=1.21;
const EXIT=[Math.cos(TH_EXIT)*(rimR(TH_EXIT)-0.6),Math.sin(TH_EXIT)*(rimR(TH_EXIT)-0.6)];
const RIVER=[[-9,-12],[-3,-11],[4,-9.5],[10,-6],[13,0],[13,6],[11,12],[7,17],EXIT];
const PATH_MAIN=[[0,5.8],[-2,8],[-6.5,8],[-10,7.5],[-13,7]];
const PATH_EAST=[[0,5.8],[3.5,3],[8,1],[12.6,0.8],[16.5,0.6],[19,2]];
const PATH_MILL=[[-10,7.5],[-4,8.6],[2,9],[6.2,8.4],[8.4,8.0]];
const PATH_FALLS=[[8.4,8.0],[8.9,9.4],[14.1,11.2],[13.6,14],[12.2,17.5],[10.5,20.5]];
const PATH_TOWER=[[-13,7],[-16,7.6],[-19,8.4],[-21.5,8.6]];
const PATHS=[PATH_MAIN,PATH_EAST,PATH_MILL,PATH_FALLS,PATH_TOWER];
const HOUSE_POS=[[-16.2,3.4],[-11,10.4],[-16.8,10.6],[-8.4,4.4],[-12.6,13.8],[8.2,7.5]];
const TOWER_TH=2.78;
const TOWER_POS=[-0.92*(rimR(TOWER_TH)-3.4),0.35*(rimR(TOWER_TH)-3.4)];

function groundH(x,z){
  const r=Math.sqrt(x*x+z*z);
  let h=(fbm(x*0.05+3,z*0.05+7)-0.45)*2.2;
  h+=(fbm(x*0.16,z*0.16)-0.5)*0.5;
  h+=Math.max(0,-z-4)*0.045;                       // rises toward the back spring
  h+=ss(0.82,1.0,r/R_EDGE)*0.7;                    // rim lip
  const dr=distToPolyline(RIVER,x,z);
  if(dr<R_W+2.4){const k=ss(R_W+2.4,R_W+0.6,dr);h=h*(1-k*0.85)-0.15*k;}
  h+=-1.7*ss(R_W+0.9,R_W-0.4,dr);                  // carve the river bed
  const dp=Math.sqrt((x+9)*(x+9)+(z+12)*(z+12));
  h+=-1.7*ss(3.4,2.0,dp);                          // spring pond
  return h;
}
const GRASS1=hexC('#5cae49'),GRASS2=hexC('#8ecb57'),GRASS_DRY=hexC('#a9c76a'),
      DIRT=hexC('#c9a06a'),DIRT2=hexC('#b98a58'),SAND=hexC('#dbc38d'),
      ROCK1=hexC('#93857a'),ROCK2=hexC('#6f635a'),ROCKD=hexC('#544b44'),MOSS=hexC('#6f9a52');
function mottle(c,x,y,z,amt,ox,oy){
  const n=fbm(x*2.1+ox,y*2.1+oy,z*2.1+ox,3);
  return shade(c,1-amt+2*amt*n);
}

/* ================= scene basics ================= */
const canvas=$('scene');
const engine=new BABYLON.Engine(canvas,true,{antialias:true});
engine.setHardwareScalingLevel(1/Math.min(window.devicePixelRatio||1,1.75));
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.87,0.92,0.9,1);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=0.0026;
scene.fogColor=new BABYLON.Color3(0.87,0.92,0.9);
scene.skipPointerMovePicking=true;

const camera=new BABYLON.ArcRotateCamera('cam',1.35,1.09,62,V3(0,0,1),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=14;camera.upperRadiusLimit=110;
camera.lowerBetaLimit=0.15;camera.upperBetaLimit=1.5;
camera.wheelDeltaPercentage=0.018;camera.pinchDeltaPercentage=0.01;
camera.minZ=0.4;camera.maxZ=800;camera.panningDistanceLimit=45;camera.panningSensibility=1100;

const hemi=new BABYLON.HemisphericLight('hemi',V3(0.3,1,0.2),scene);
hemi.diffuse=C3(0.72,0.87,0.9);hemi.groundColor=C3(0.72,0.65,0.52);hemi.intensity=0.6;
const sun=new BABYLON.DirectionalLight('sun',V3(-1,-1,1),scene);
sun.position=V3(34,46,-24);sun.direction=sun.position.scale(-1).normalize();
sun.diffuse=C3(1,0.94,0.82);sun.intensity=1.25;
const under=new BABYLON.PointLight('under',V3(0,-15,0),scene);
under.diffuse=C3(0.3,0.55,0.5);under.intensity=0.5;under.range=60;
const lampLight=new BABYLON.PointLight('lamp',V3(-14.6,3.4,5.6),scene);
lampLight.diffuse=C3(1,0.7,0.36);lampLight.intensity=0;lampLight.range=10;

const sg=new BABYLON.ShadowGenerator(2048,sun);
sg.useBlurExponentialShadowMap=true;sg.blurKernel=32;sg.setDarkness(0.45);sg.bias=0.0008;

const pipeline=new BABYLON.DefaultRenderingPipeline('pipe',true,scene,[camera]);
pipeline.fxaaEnabled=true;
pipeline.bloomEnabled=true;pipeline.bloomThreshold=0.85;pipeline.bloomWeight=0.25;pipeline.bloomKernel=48;
pipeline.imageProcessing.toneMappingEnabled=true;
pipeline.imageProcessing.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
pipeline.imageProcessing.exposure=1.12;pipeline.imageProcessing.contrast=1.12;
pipeline.imageProcessing.vignetteEnabled=true;pipeline.imageProcessing.vignetteWeight=1.1;
pipeline.imageProcessing.colorCurvesEnabled=true;
const cc=new BABYLON.ColorCurves();cc.globalSaturation=10;pipeline.imageProcessing.colorCurves=cc;

/* shared materials */
const matVC=new BABYLON.StandardMaterial('vc',scene);
matVC.diffuseColor=C3(1,1,1);matVC.specularColor=C3(0.04,0.04,0.04);
const matWater=new BABYLON.StandardMaterial('water',scene);
matWater.diffuseColor=C3(0.16,0.7,0.66);matWater.specularColor=C3(0.4,0.45,0.45);
matWater.specularPower=48;matWater.emissiveColor=C3(0.03,0.16,0.15);
const matGlow=new BABYLON.StandardMaterial('glow',scene);
matGlow.emissiveColor=C3(0.5,0.36,0.2);matGlow.disableLighting=true;
const matCloud=new BABYLON.StandardMaterial('cloud',scene);
matCloud.diffuseColor=C3(1,1,1);matCloud.specularColor=C3(0,0,0);
matCloud.emissiveColor=C3(0.78,0.8,0.82);matCloud.alpha=0.96;

/* ================= mesh helpers ================= */
let parts=[];
function paint(mesh,fn){
  const p=mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  const n=p.length/3,col=new Float32Array(n*4);
  for(let i=0;i<n;i++){const c=fn(p[3*i],p[3*i+1],p[3*i+2]);col[4*i]=c[0];col[4*i+1]=c[1];col[4*i+2]=c[2];col[4*i+3]=c[3]!==undefined?c[3]:1;}
  mesh.setVerticesData(BABYLON.VertexBuffer.ColorKind,col);
}
function solid(mesh,hex,ao){
  const p=mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  let mn=1e9,mx=-1e9;
  for(let i=1;i<p.length;i+=3){if(p[i]<mn)mn=p[i];if(p[i]>mx)mx=p[i];}
  const c=hexC(hex),h=(mx-mn)||1;
  paint(mesh,(x,y,z)=>shade(c,(0.74+0.3*(y-mn)/h)*(ao||1)));
}
function reg(m,hex,ao){m.material=matVC;m.removeVerticesData(BABYLON.VertexBuffer.UVKind);solid(m,hex,ao);parts.push(m);return m;}
function regF(m,fn){m.material=matVC;m.removeVerticesData(BABYLON.VertexBuffer.UVKind);paint(m,fn);parts.push(m);return m;}
function done(name){
  if(!parts.length)return null;
  const m=BABYLON.Mesh.MergeMeshes(parts,true,true,undefined,false,false);
  parts=[];m.name=name;m.hasVertexAlpha=false;return m;
}
let tf={x:0,y:0,z:0,c:1,s:0,yaw:0};
function setTF(x,y,z,yaw){tf={x,y,z,c:Math.cos(yaw||0),s:Math.sin(yaw||0),yaw:yaw||0};}
function T(lx,ly,lz){return[tf.x+lx*tf.c+lz*tf.s,tf.y+ly,tf.z-lx*tf.s+lz*tf.c];}
function addBox(w,h,d,lx,ly,lz,hex,rot,ao){
  const b=BABYLON.MeshBuilder.CreateBox('b',{width:w,height:h,depth:d},scene);
  const p=T(lx,ly,lz);b.position.set(p[0],p[1],p[2]);
  if(rot){b.rotation.x=rot.x||0;b.rotation.y=(rot.y||0)+tf.yaw;b.rotation.z=rot.z||0;}
  return reg(b,hex,ao);
}
function addCyl(dT,dB,h,lx,ly,lz,hex,tess,rot,ao){
  const c=BABYLON.MeshBuilder.CreateCylinder('c',{diameterTop:dT,diameterBottom:dB,height:h,tessellation:tess||20},scene);
  const p=T(lx,ly,lz);c.position.set(p[0],p[1],p[2]);
  if(rot){c.rotation.x=rot.x||0;c.rotation.y=(rot.y||0)+tf.yaw;c.rotation.z=rot.z||0;}
  return reg(c,hex,ao);
}

/* custom sheet mesh (double-sided, winding-proof) */
function makeSheet(name,pos,col,idx,uvs){
  const half=pos.length/3;
  const allP=pos.concat(pos),allC=col.concat(col),allU=uvs?uvs.concat(uvs):null;
  const idx2=new Array(idx.length);
  for(let i=0;i<idx.length;i+=3){idx2[i]=idx[i+2]+half;idx2[i+1]=idx[i+1]+half;idx2[i+2]=idx[i]+half;}
  const m=new BABYLON.Mesh(name,scene);
  const vd=new BABYLON.VertexData();
  vd.positions=allP;vd.colors=allC;vd.indices=idx.concat(idx2);if(allU)vd.uvs=allU;
  vd.applyToMesh(m,true);m.computeNormals();
  return m;
}
/* auto-fix winding so normals point up */
function fixUp(m){
  const nor=m.getVerticesData(BABYLON.VertexBuffer.NormalKind);
  let ay=0;for(let i=1;i<nor.length;i+=3)ay+=nor[i];
  if(ay<0){
    const idx=m.getIndices();
    for(let i=0;i<idx.length;i+=3){const t=idx[i+1];idx[i+1]=idx[i+2];idx[i+2]=t;}
    m.setIndices(idx);m.computeNormals();
  }
}

/* ================= sky, sun disc ================= */
const skyTex=new BABYLON.DynamicTexture('sky',{width:2,height:256},scene,true);
skyTex.wrapU=BABYLON.Texture.WRAP_ADDRESSMODE;skyTex.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;
const matSky=new BABYLON.StandardMaterial('skyM',scene);
matSky.backFaceCulling=false;matSky.disableLighting=true;matSky.emissiveColor=C3(1,1,1);
matSky.diffuseTexture=skyTex;matSky.fogEnabled=false;
let skyMesh;
(function(){
  const ROWS=30,SEG=48,R=320,pos=[],uv=[],idx=[];
  for(let r=0;r<=ROWS;r++){
    const phi=(r/ROWS)*Math.PI*0.62;             // a bit past the horizon
    for(let s=0;s<=SEG;s++){
      const th=s/SEG*TAU;
      pos.push(Math.sin(phi)*Math.cos(th)*R,Math.cos(phi)*R,Math.sin(phi)*Math.sin(th)*R);
      uv.push(s/SEG,1-r/ROWS);
    }
  }
  for(let r=0;r<ROWS;r++)for(let s=0;s<SEG;s++){
    const a=r*(SEG+1)+s,b=a+SEG+1;idx.push(a,b,a+1,a+1,b,b+1);
  }
  skyMesh=new BABYLON.Mesh('dome',scene);
  const vd=new BABYLON.VertexData();vd.positions=pos;vd.indices=idx;vd.uvs=uv;
  vd.applyToMesh(skyMesh);skyMesh.computeNormals();
  const nor=skyMesh.getVerticesData(BABYLON.VertexBuffer.NormalKind);
  for(let i=0;i<nor.length;i++)nor[i]*=-1;                 // normals face inward
  skyMesh.setVerticesData(BABYLON.VertexBuffer.NormalKind,nor);
  skyMesh.material=matSky;skyMesh.applyFog=false;skyMesh.isPickable=false;
})();

function buildTower(){
  const tx=TOWER_POS[0],tz=TOWER_POS[1];
  const mound=BABYLON.MeshBuilder.CreateSphere('mound',{diameter:6.2,segments:12},scene);
  mound.scaling.y=0.32;mound.position.set(tx,groundH(tx,tz)-0.4,tz);
  mound.bakeCurrentTransformIntoVertices();
  regF(mound,(x,y,z)=>{let c=mixC(ROCK1,ROCK2,fbm(x*0.8,z*0.8,3));c=mixC(c,MOSS,clamp(y*2+0.5,0,1)*0.5);return mottle(c,x,y,z,0.12,3,7);});
  const TE=20,pos=[],col=[],idx=[];
  const push=(r,y,a,inner)=>{
    pos.push(tx+Math.cos(a)*r,y,tz+Math.sin(a)*r);
    let c=inner?shade(ROCK2,0.6):mixC(ROCK1,ROCK2,0.5+0.5*Math.sin(y*2.2+a*2));
    if(!inner)c=mixC(c,MOSS,fbm(a*2,y*0.5,3)*0.5*ss(3.4,1.2,y));
    col.push(c[0],c[1],c[2],1);
  };
  const rowsY=[0,1.3,3.1];
  for(const[inR,outR]of[[1.22,1.22],[1.24,1.64],[1.2,1.6]]){
    for(const y of rowsY){
      for(let s=0;s<TE;s++){
        const a=s/TE*TAU;
        if(y<3)push(y<1?outR*0.98:outR,y,a,y>2.5&&false);
      }
    }
  }
  // build explicitly: outer rows with jagged top, inner rows
  pos.length=0;col.length=0;idx.length=0;
  function ring(r,y,inner,jag){
    const start=pos.length/3;
    for(let s=0;s<TE;s++){
      const a=s/TE*TAU;
      let yy=y;
      if(jag)yy=y+0.5+1.5*hash(s*3.7,9.1)-1.6*ss(-0.9,0.9,Math.cos(a-1.1));
      push(r,yy,a,inner);
    }
    return start;
  }
  const o0=ring(1.62,groundH(tx,tz)-0.3,false),o1=ring(1.6,1.3,false),o2=ring(1.58,3.1,false,true);
  const i2=ring(1.22,3.0,true,true),i1=ring(1.24,1.3,true),i0=ring(1.2,groundH(tx,tz)-0.3,true);
  const strip=(A,B)=>{for(let s=0;s<TE;s++){const s2=(s+1)%TE;idx.push(A+s,B+s,B+s2,A+s,B+s2,A+s2);}};
  strip(o0,o1);strip(o1,o2);strip(i2,i1);strip(i1,i0);
  for(let s=0;s<TE;s++){const s2=(s+1)%TE;idx.push(o2+s,i2+s,i2+s2,o2+s,i2+s2,o2+s2);}
  const tm=makeSheet('tower',pos,col,idx,null);
  // the tower has no uv — fixUp not needed since it's a closed-ish tube; normals exist
  const rub=[[2.4,0.5,0.7],[2.9,0.35,0.5],[-2.2,0.45,1.0],[1.6,0.3,-2.4],[-1.8,0.35,-2.0]];
  for(const r of rub){

    regF(rk,(x,y,z)=>shade(mottle(ROCK1,x,y,z,0.15,4,1),1-clamp((y-groundH(tx,tz)+1),0,2)*0.12));
  }
  const col1=BABYLON.MeshBuilder.CreateCylinder('c',{diameter:0.55,height:1.6,tessellation:12},scene);

  col1.bakeCurrentTransformIntoVertices();reg(col1,'#9b8f80');
  const all=[tm].concat(parts);parts=[];

function scatter(){

    tries++;
    const th=rng()*TAU,Re=rimR(th),r=4+Math.sqrt(rng())*(Re-3.0-4);
    const x=Math.cos(th)*r,z=Math.sin(th)*r;
    if(distToPolyline(RIVER,x,z)<4.4)continue;
    let bad=false;
    for(const P of PATHS)if(distToPolyline(P,x,z)<2.7){bad=true;break;}
    if(bad)continue;
    if(Math.hypot(x,z+2)<11.5)continue;
    for(const h of HOUSE_POS)if(Math.hypot(x-h[0],z-h[1])<3.8){bad=true;break;}
    if(bad)continue;
    if(Math.hypot(x+9,z+12)<4.6)continue;
    if(Math.hypot(x-TOWER_POS[0],z-TOWER_POS[1])<4.2)continue;
    if(Math.hypot(x-19,z-2)<3.2)continue;
    if(Math.hypot(x+13,z-7)<4.6)continue;
    const gy=groundH(x,z)-0.08,sc=0.75+rng()*0.75;
    if(rng()<0.86){
      buildPineParts(x,gy,z,sc,placed+Math.floor(rng()*3));
    }else{
      setTF(x,gy,z,rng()*TAU);
      addCyl(0.2*sc,0.3*sc,1.3*sc,0,0.6*sc,0,'#7a5238',8);
      const blobs=[[0,1.9,1.3],[0.55,1.55,0.95],[-0.5,1.6,0.9]];
      const cols=['#69b04a','#8cc95a','#5aa244'];
      for(let b=0;b<3;b++){
        const sp=BABYLON.MeshBuilder.CreateSphere('lb',{diameter:blobs[b][2]*sc*1.7,segments:12},scene);
        const p=T(blobs[b][0]*sc,blobs[b][1]*sc,blobs[b][2]*0*sc);
        sp.position.set(p[0],p[1],p[2]);sp.scaling.y=0.85;
        sp.bakeCurrentTransformIntoVertices();
        regF(sp,(x2,y2,z2)=>shade(mottle(hexC(cols[b]),x2,y2,z2,0.16,b,5),0.92+0.16*fbm(x2*2+3,y2*2,z2*2,2)));
      }
    }
    placed++;
  }
  // boulders + riverbank rocks
  for(let i=0;i<30;i++){
    const th=rng()*TAU,Re=rimR(th),r=5+rng()*(Re-3.5-5);
    const x=Math.cos(th)*r,z=Math.sin(th)*r;
    if(distToPolyline(RIVER,x,z)<3.4)continue;
    if(Math.hypot(x,z+2)<10.5)continue;
    buildRockParts(x,groundH(x,z)-0.15,0.35+rng()*0.85,i);
  }
  for(let i=2;i<RIVER.length-1;i+=1){
    for(const side of[-1,1]){
      const p=RIVER[i],q=RIVER[i+1];
      let dx=q[0]-p[0],dz=q[1]-p[1];const L=Math.hypot(dx,dz)||1;dx/=L;dz/=L;
      const off=(R_W+0.6+rng()*0.7)*side;
      const x=p[0]-dz*off,z=p[1]+dx*off;
      buildRockParts(x,groundH(x,z)-0.2,0.3+rng()*0.5,i*3+side);
    }
  }
  // grass tufts
  let tp=0,tt=0;
  while(tp<210&&tt<4000){
    tt++;
    const th=rng()*TAU,Re=rimR(th),r=Math.sqrt(rng())*(Re-2.6);
    const x=Math.cos(th)*r,z=Math.sin(th)*r;
    if(distToPolyline(RIVER,x,z)<R_W+0.9)continue;
    let bad=false;
    for(const P of PATHS)if(distToPolyline(P,x,z)<1.7){bad=true;break;}
    if(bad||Math.hypot(x,z+2)<8.5)continue;
    const gy=groundH(x,z);
    setTF(x,gy-0.03,z,rng()*TAU);
    for(let b=0;b<3;b++){
      const a=rng()*TAU,tl=(0.3+rng()*0.35);
      const cn=addCyl(0,0.09,tl,Math.cos(a)*0.12,tl/2,Math.sin(a)*0.12,'#ffffff',4);
      const tilt=0.25+rng()*0.3;
      cn.rotation.x=Math.sin(a)*tilt;cn.rotation.z=-Math.cos(a)*tilt;
      const c=mixC(GRASS2,hexC('#9ed26a'),rng());
      paint(cn,()=>shade(c,0.85+rng()*0.3));
    }
    tp++;
  }
}

/* ================= extras: boat, clouds, birds, fence, overlook ================= */
let boat;const fRocks=[],clouds=[],birds=[];
function buildExtras(){
  setTF(0,0,0,0);
  // rowboat on the pond
  const bp=[];
  function breg(m,hex){m.material=matVC;solid(m,hex);bp.push(m);}
  const hull=BABYLON.MeshBuilder.CreateBox('h',{width:1.5,height:0.3,depth:0.62},scene);
  hull.position.y=WATER_Y+0.05;breg(hull,'#8a6a45');
  for(const s of[-1,1]){
    const pl=BABYLON.MeshBuilder.CreateBox('p',{width:1.55,height:0.08,depth:0.16},scene);
    pl.position.set(0,WATER_Y+0.22,s*0.3);pl.rotation.x=s*0.3;
    pl.bakeCurrentTransformIntoVertices();breg(pl,'#6e4a2f');
  }
  const seat=BABYLON.MeshBuilder.CreateBox('s',{width:0.2,height:0.06,depth:0.5},scene);
  seat.position.y=WATER_Y+0.22;breg(seat,'#5b4632');
  boat=BABYLON.Mesh.MergeMeshes(bp,true,true);boat.hasVertexAlpha=false;
  boat.position.set(-9,0,-12);boat.rotation.y=0.7;boat.parent=world;
  // floating rocks
  const spots=[[18,-14,8,1.6],[-20,-11,-6,2.2],[6,-18,20,1.2],[-9,-23,14,1.8],[13.5,-11,28.5,1.4],[23,-7,15,1.0]];
  for(const s of spots){
    const rk=BABYLON.MeshBuilder.CreateSphere('fr',{diameter:s[3]*2,segments:8},scene);
    const p=rk.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    for(let i=0;i<p.length;i++)p[i]*=(0.75+hash(i*3.1,s[0])*0.55);
    rk.setVerticesData(BABYLON.VertexBuffer.PositionKind,p);
    rk.position.set(s[0],s[1],s[2]);rk.bakeCurrentTransformIntoVertices();
    regF(rk,(x,y,z)=>{
      let c=mixC(ROCK1,ROCK2,fbm(x*0.9,z*0.9,3));
      c=mixC(c,GRASS1,clamp(y*1.2,0,1)*0.55);
      return mottle(c,x,y,z,0.12,8,2);
    });
    const m=done('frock');m.parent=world;
    fRocks.push({m,y0:s[1],ph:rng()*TAU,sp:0.3+rng()*0.3});
  }
  // clouds below the isle
  for(let i=0;i<6;i++){
    const partsC=[];
    const n=4+Math.floor(rng()*3);
    for(let b=0;b<n;b++){
      const sp=BABYLON.MeshBuilder.CreateSphere('cs',{diameter:2.5+rng()*3.5,segments:10},scene);
      sp.position.set((rng()-0.5)*5,(rng()-0.5)*1.2,(rng()-0.5)*2.5);
      sp.scaling.y=0.5;sp.bakeCurrentTransformIntoVertices();
      sp.material=matCloud;partsC.push(sp);
    }
    const cm=BABYLON.Mesh.MergeMeshes(partsC,true,true);cm.material=matCloud;
    clouds.push({m:cm,a:rng()*TAU,r:24+rng()*18,y:-17-rng()*9,sp:0.006+rng()*0.007});
  }
  // birds
  for(let i=0;i<3;i++){
    const root=new BABYLON.TransformNode('bird',scene);root.parent=world;
    const wl=BABYLON.MeshBuilder.CreateBox('wl',{width:0.55,height:0.04,depth:0.16},scene);
    wl.material=matVC;solid(wl,'#3a3430');wl.position.x=-0.28;wl.parent=root;
    const wr=BABYLON.MeshBuilder.CreateBox('wr',{width:0.55,height:0.04,depth:0.16},scene);
    wr.material=matVC;solid(wr,'#3a3430');wr.position.x=0.28;wr.parent=root;
    birds.push({root,wl,wr,cx:(rng()-0.5)*16,cz:(rng()-0.5)*16,r:7+rng()*6,h:9+rng()*4,ph:rng()*TAU,sp:0.25+rng()*0.15});
  }
  // falls overlook: fence + bench + lamp
  for(let a=1.0;a<=1.34;a+=0.06){
    const th=a,rr=rimR(th)-1.15,x=Math.cos(th)*rr,z=Math.sin(th)*rr,gy=groundH(x,z);
    setTF(x,gy,z,0);
    addBox(0.12,0.8,0.12,0,0.4,0,'#6e4a2f');
  }
  const ths=[];for(let a=1.0;a<=1.341;a+=0.06)ths.push(a);
  for(let i=0;i<ths.length-1;i++){
    const a1=ths[i],a2=ths[i+1];
    const p1=[Math.cos(a1)*(rimR(a1)-1.15),Math.sin(a1)*(rimR(a1)-1.15)];
    const p2=[Math.cos(a2)*(rimR(a2)-1.15),Math.sin(a2)*(rimR(a2)-1.15)];
    const mx=(p1[0]+p2[0])/2,mz=(p1[1]+p2[1])/2,gy=groundH(mx,mz);
    const yaw=Math.atan2(-(p2[1]-p1[1]),p2[0]-p1[0]);
    setTF(mx,gy,mz,yaw);
    const len=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    addBox(len,0.07,0.07,0,0.66,0,'#6e4a2f');
    addBox(len,0.07,0.07,0,0.36,0,'#6e4a2f');
  }
  const bx=Math.cos(1.14)*(rimR(1.14)-2.2),bz=Math.sin(1.14)*(rimR(1.14)-2.2);
  setTF(bx,groundH(bx,bz),bz,Math.atan2(-(Math.sin(1.21)),Math.cos(1.21)));
  addBox(1.5,0.1,0.45,0,0.42,0,'#8a6a45');
  addBox(1.5,0.4,0.08,0,0.68,-0.2,'#8a6a45');
  addBox(0.12,0.42,0.4,-0.6,0.21,0,'#6e4a2f');
  addBox(0.12,0.42,0.4,0.6,0.21,0,'#6e4a2f');
  buildLamp(Math.cos(0.94)*(rimR(0.94)-2.2),Math.sin(0.94)*(rimR(0.94)-2.2));
}

/* ================= assemble the world ================= */
try{
  buildCastle();
  const castleM=done('castle');castleM.receiveShadows=true;castleM.parent=world;
  sg.addShadowCaster(castleM);
  buildVillage();
  const villageM=done('village');villageM.receiveShadows=true;villageM.parent=world;
  sg.addShadowCaster(villageM);
  buildMill();
  const millM=done('mill');millM.receiveShadows=true;millM.parent=world;
  sg.addShadowCaster(millM);
  bridge(12.95,0.8,-Math.PI/2,5.4,0.9);
  bridge(11.5,10.3,Math.atan2(-0.32,0.95),5.6,0.8);
  const bridgesM=done('bridges');bridgesM.receiveShadows=true;bridgesM.parent=world;
  sg.addShadowCaster(bridgesM);
  buildTower();sg.addShadowCaster(scene.getMeshByName('tower'));scene.getMeshByName('tower').parent=world;
  scatter();
  const treesM=done('trees');treesM.parent=world;sg.addShadowCaster(treesM);
  buildExtras();
  const glowM=glowParts.length?BABYLON.Mesh.MergeMeshes(glowParts,true,true):null;
  if(glowM){glowM.name='glow';glowM.parent=world;}
  for(const s of smokeSpots)makeSmoke(s);
}catch(err){
  $('loadSub').textContent='Something went wrong while growing the isle: '+err.message;
  throw err;
}

/* ================= mood (day / golden hour) ================= */
const MOODS={
  day:{sun:[34,46,-24],sunCol:[1,0.94,0.82],sunInt:1.25,hemiSky:[0.72,0.87,0.9],hemiGnd:[0.72,0.65,0.52],
       hemiInt:0.6,fog:[0.87,0.92,0.9],fogD:0.0026,expo:1.12,glow:[0.5,0.36,0.2],lamp:0,sunB:[1.25,1.12,0.9]},
  dusk:{sun:[-32,14,20],sunCol:[1,0.55,0.28],sunInt:1.05,hemiSky:[0.55,0.55,0.78],hemiGnd:[0.45,0.36,0.33],
        hemiInt:0.42,fog:[0.93,0.74,0.55],fogD:0.0038,expo:1.04,glow:[1.2,0.82,0.42],lamp:0.9,sunB:[1.6,0.8,0.42]}
};
let mood=0,moodTarget=0,lastSky=-1;
function applyMood(m){
  const L=(a,b)=>mixC(a,b,m);
  const d=MOODS.day,k=MOODS.dusk;
  sun.position.set(lerp(d.sun[0],k.sun[0],m),lerp(d.sun[1],k.sun[1],m),lerp(d.sun[2],k.sun[2],m));
  sun.direction=sun.position.scale(-1).normalize();
  sun.diffuse=C3(L(d.sunCol,k.sunCol)[0],L(d.sunCol,k.sunCol)[1],L(d.sunCol,k.sunCol)[2]);
  sun.intensity=lerp(d.sunInt,k.sunInt,m);
  hemi.diffuse=C3(L(d.hemiSky,k.hemiSky)[0],L(d.hemiSky,k.hemiSky)[1],L(d.hemiSky,k.hemiSky)[2]);
  hemi.groundColor=C3(L(d.hemiGnd,k.hemiGnd)[0],L(d.hemiGnd,k.hemiGnd)[1],L(d.hemiGnd,k.hemiGnd)[2]);
  hemi.intensity=lerp(d.hemiInt,k.hemiInt,m);
  const f=L(d.fog,k.fog);
  scene.fogColor=C3(f[0],f[1],f[2]);scene.clearColor=new BABYLON.Color4(f[0],f[1],f[2],1);
  scene.fogDensity=lerp(d.fogD,k.fogD,m);
  pipeline.imageProcessing.exposure=lerp(d.expo,k.expo,m);
  const g=L(d.glow,k.glow);matGlow.emissiveColor=C3(g[0],g[1],g[2]);
  lampLight.intensity=lerp(d.lamp,k.lamp,m);
  const sb=L(d.sunB,k.sunB);matSunB.emissiveColor=C3(sb[0],sb[1],sb[2]);
  sunBall.position=sun.position.normalize().scale(295);
  if(Math.abs(m-lastSky)>0.004){drawSky(m);lastSky=m;}
}
applyMood(0);

/* ================= UI wiring ================= */
const presets={
  overview:{a:1.35,b:1.09,r:62,t:V3(0,0,1)},
  castle:{a:0.5,b:1.1,r:27,t:V3(0,3.5,-2)},
  village:{a:2.6,b:1.15,r:24,t:V3(-13,2,7)},
  falls:{a:0.55,b:1.22,r:26,t:V3(8.5,2,22)}
};
let flying=false,lastInteract=performance.now()-1500;
function flyTo(p){
  flying=true;scene.stopAnimation(camera);
  const ease=new BABYLON.CubicEase();ease.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);
  let n=0;const doneOne=()=>{if(++n===4)flying=false;};
  function floatAnim(prop,to){
    let t=to;if(prop==='alpha')t=camera.alpha+wrapPI(to-camera.alpha);
    const a=new BABYLON.Animation('f'+prop,prop,60,BABYLON.Animation.ANIMATIONTYPE_FLOAT,BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
    a.setEasingFunction(ease);a.setKeys([{frame:0,value:camera[prop]},{frame:90,value:t}]);
    scene.beginDirectAnimation(camera,[a],0,90,false,1,doneOne);
  }
  floatAnim('alpha',p.a);floatAnim('beta',p.b);floatAnim('radius',p.r);
  const ta=new BABYLON.Animation('ft','target',60,BABYLON.Animation.ANIMATIONTYPE_VECTOR3,BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
  ta.setEasingFunction(ease);ta.setKeys([{frame:0,value:camera.target.clone()},{frame:90,value:p.t}]);
  scene.beginDirectAnimation(camera,[ta],0,90,false,1,doneOne);
}
const navBtns=[...document.querySelectorAll('#nav button')];
navBtns.forEach(b=>b.addEventListener('click',()=>{
  navBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');
  flyTo(presets[b.dataset.v]);lastInteract=performance.now();
}));
 $('moodBtn').addEventListener('click',function(){
  moodTarget=1-moodTarget;
  this.classList.toggle('dusk',moodTarget===1);
  $('moodLabel').textContent=moodTarget===1?'Daylight':'Golden hour';
});
canvas.addEventListener('pointerdown',()=>{
  lastInteract=performance.now();
  if(flying){scene.stopAnimation(camera);flying=false;}
});
canvas.addEventListener('wheel',()=>{lastInteract=performance.now();},{passive:true});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',()=>engine.resize());

/* tri count in the hint */
let tris=0;
for(const m of scene.meshes)if(m.isEnabled()&&m.isVisible&&m.getTotalIndices)tris+=m.getTotalIndices()/3;
 $('tris').textContent='≈'+Math.round(tris/1000)+'k triangles · every mesh grown from code';

/* ================= animation loop ================= */
let t=0;
scene.registerBeforeRender(function(){
  const dt=Math.min(engine.getDeltaTime()/1000,0.05);
  t+=dt;
  world.position.y=Math.sin(t*0.45)*0.14;
  // water bob (dash overlay is a child, rides along)
  const pp=water.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for(let i=0;i<pp.length;i+=3){
    pp[i+1]=waterBase[i+1]+Math.sin(t*1.6+waterBase[i]*0.5+waterBase[i+2]*0.35)*0.035;
  }
  water.updateVerticesData(BABYLON.VertexBuffer.PositionKind,pp);
  window.__dashTex.uOffset-=dt*0.22;
  fallA.getVerticesData&&0; // no-op guard
  fallA.material.diffuseTexture.vOffset-=dt*0.55;
  fallB.material.diffuseTexture.vOffset-=dt*0.85;
  foam.scaling.setAll(1+0.06*Math.sin(t*2.3));foam.rotation.y+=dt*0.25;
  if(wheel)wheel.rotation.z+=dt*0.7;
  // flags
  for(const f of flags){
    const p=f.m.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    for(let i=0;i<f.half;i++){
      const bx=f.base[3*i],by=f.base[3*i+1],k=(bx-f.base[0])/1.5;
      const wz=Math.sin(t*5.5+bx*2.4+by*3)*0.13*k;
      p[3*i+2]=wz;p[3*(i+f.half)+2]=wz;
    }
    f.m.updateVerticesData(BABYLON.VertexBuffer.PositionKind,p);
  }
  for(const r of fRocks){r.m.position.y=r.y0+Math.sin(t*r.sp+r.ph)*0.6;r.m.rotation.y+=dt*0.05;}
  for(const c of clouds){c.a+=dt*c.sp;c.m.position.set(Math.cos(c.a)*c.r,c.y+Math.sin(t*0.3+c.a*5)*0.5,Math.sin(c.a)*c.r);}
  for(const b of birds){
    const a=t*b.sp+b.ph;
    b.root.position.set(b.cx+Math.cos(a)*b.r,b.h+Math.sin(t*0.7+b.ph)*1.1,b.cz+Math.sin(a)*b.r);
    b.root.rotation.y=Math.atan2(Math.cos(a),-Math.sin(a));
    const fl=Math.sin(t*9+b.ph)*0.55;
    b.wl.rotation.z=fl;b.wr.rotation.z=-fl;
  }
  if(boat){boat.position.y=Math.sin(t*0.9)*0.04;boat.rotation.z=Math.sin(t*0.7)*0.035;}
  // mood transition
  if(Math.abs(mood-moodTarget)>0.0005){
    mood+=(moodTarget-mood)*Math.min(1,dt*2.2);
    applyMood(mood);
  }
  // idle auto-rotate
  if(!flying&&performance.now()-lastInteract>4000)camera.alpha+=dt*0.032;
});

let firstFrame=false;
engine.runRenderLoop(function(){
  scene.render();
  if(!firstFrame){firstFrame=true;document.getElementById('loader').classList.add('hide');
    setTimeout(()=>document.getElementById('loader').remove(),900);}
});
})();
