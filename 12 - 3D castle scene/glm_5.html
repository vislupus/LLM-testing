<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 Medieval Floating Island Diorama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        /* UI Overlay */
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        .title-card {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(20, 30, 50, 0.9), rgba(10, 20, 40, 0.95));
            border: 2px solid #c9a227;
            border-radius: 12px;
            padding: 15px 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .title-card h1 {
            color: #ffd700;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 5px;
        }

        .title-card p {
            color: #a0a0a0;
            font-size: 12px;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 30, 50, 0.8);
            border: 1px solid #4a6fa5;
            border-radius: 8px;
            padding: 10px 20px;
            color: #8b9dc3;
            font-size: 12px;
        }

        .controls-hint span {
            color: #4ecdc4;
            margin: 0 5px;
        }

        /* Loading screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loadingScreen p {
            color: #ffd700;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loader"></div>
        <p>Building the Kingdom...</p>
    </div>

    <!-- Canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- UI -->
    <div id="ui">
        <div class="title-card">
            <h1>🏰 Kingdom of Aethoria</h1>
            <p>A Tabletop Diorama</p>
        </div>
        <div class="controls-hint">
            <span>🖱️ Drag</span> Rotate
            <span>🔘 Scroll</span> Zoom
            <span>⌨️ WASD</span> Pan
        </div>
    </div>

    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>

    <script>
        /* ============================================
           MAIN SCENE CREATION
           ============================================ */
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { 
            preserveDrawingBuffer: true, 
            stencil: true 
        });

        // Color palette - vibrant stylized colors
        const COLORS = {
            // Stonework
            stone: new BABYLON.Color3(0.65, 0.62, 0.58),
            stoneDark: new BABYLON.Color3(0.45, 0.42, 0.38),
            stoneRoof: new BABYLON.Color3(0.35, 0.25, 0.2),
            
            // Wood
            wood: new BABYLON.Color3(0.55, 0.35, 0.2),
            woodDark: new BABYLON.Color3(0.35, 0.22, 0.12),
            woodLight: new BABYLON.Color3(0.7, 0.5, 0.3),
            
            // Nature
            grass: new BABYLON.Color3(0.35, 0.65, 0.3),
            grassLight: new BABYLON.Color3(0.5, 0.75, 0.35),
            pineTree: new BABYLON.Color3(0.15, 0.4, 0.2),
            pineDark: new BABYLON.Color3(0.1, 0.3, 0.15),
            rock: new BABYLON.Color3(0.5, 0.48, 0.45),
            rockDark: new BABYLON.Color3(0.3, 0.28, 0.25),
            
            // Water
            water: new BABYLON.Color3(0.2, 0.7, 0.75),
            waterDeep: new BABYLON.Color3(0.1, 0.5, 0.6),
            foam: new BABYLON.Color3(0.9, 0.95, 1),
            
            // Accents
            roofRed: new BABYLON.Color3(0.7, 0.25, 0.2),
            roofBlue: new BABYLON.Color3(0.3, 0.4, 0.65),
            thatch: new BABYLON.Color3(0.75, 0.65, 0.4),
            canvas: new BABYLON.Color3(0.9, 0.85, 0.75),
            
            // Details
            gold: new BABYLON.Color3(0.85, 0.7, 0.3),
            brick: new BABYLON.Color3(0.7, 0.4, 0.35),
            door: new BABYLON.Color3(0.4, 0.25, 0.15)
        };

        // Material cache
        const materials = {};

        function createMaterials(scene) {
            // Stone materials
            materials.stone = new BABYLON.StandardMaterial("matStone", scene);
            materials.stone.diffuseColor = COLORS.stone;
            materials.stone.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);

            materials.stoneDark = new BABYLON.StandardMaterial("matStoneDark", scene);
            materials.stoneDark.diffuseColor = COLORS.stoneDark;

            materials.stoneRoof = new BABYLON.StandardMaterial("matStoneRoof", scene);
            materials.stoneRoof.diffuseColor = COLORS.stoneRoof;

            // Wood materials
            materials.wood = new BABYLON.StandardMaterial("matWood", scene);
            materials.wood.diffuseColor = COLORS.wood;

            materials.woodDark = new BABYLON.StandardMaterial("matWoodDark", scene);
            materials.woodDark.diffuseColor = COLORS.woodDark;

            materials.woodLight = new BABYLON.StandardMaterial("matWoodLight", scene);
            materials.woodLight.diffuseColor = COLORS.woodLight;

            // Grass materials
            materials.grass = new BABYLON.StandardMaterial("matGrass", scene);
            materials.grass.diffuseColor = COLORS.grass;

            materials.grassLight = new BABYLON.StandardMaterial("matGrassLight", scene);
            materials.grassLight.diffuseColor = COLORS.grassLight;

            // Tree materials
            materials.pine = new BABYLON.StandardMaterial("matPine", scene);
            materials.pine.diffuseColor = COLORS.pineTree;

            materials.pineDark = new BABYLON.StandardMaterial("matPineDark", scene);
            materials.pineDark.diffuseColor = COLORS.pineDark;

            // Rock materials
            materials.rock = new BABYLON.StandardMaterial("matRock", scene);
            materials.rock.diffuseColor = COLORS.rock;

            materials.rockDark = new BABYLON.StandardMaterial("matRockDark", scene);
            materials.rockDark.diffuseColor = COLORS.rockDark;

            // Water material
            materials.water = new BABYLON.StandardMaterial("matWater", scene);
            materials.water.diffuseColor = COLORS.water;
            materials.water.specularColor = new BABYLON.Color3(0.8, 0.9, 1);
            materials.water.specularPower = 64;
            materials.water.alpha = 0.85;
            materials.water.backFaceCulling = false;

            // Roof materials
            materials.roofRed = new BABYLON.StandardMaterial("matRoofRed", scene);
            materials.roofRed.diffuseColor = COLORS.roofRed;

            materials.roofBlue = new BABYLON.StandardMaterial("matRoofBlue", scene);
            materials.roofBlue.diffuseColor = COLORS.roofBlue;

            materials.thatch = new BABYLON.StandardMaterial("matThatch", scene);
            materials.thatch.diffuseColor = COLORS.thatch;

            // Misc materials
            materials.canvas = new BABYLON.StandardMaterial("matCanvas", scene);
            materials.canvas.diffuseColor = COLORS.canvas;

            materials.gold = new BABYLON.StandardMaterial("matGold", scene);
            materials.gold.diffuseColor = COLORS.gold;
            materials.gold.specularColor = new BABYLON.Color3(1, 0.9, 0.5);
            materials.gold.specularPower = 32;

            materials.brick = new BABYLON.StandardMaterial("matBrick", scene);
            materials.brick.diffuseColor = COLORS.brick;

            materials.door = new BABYLON.StandardMaterial("matDoor", scene);
            materials.door.diffuseColor = COLORS.door;
        }

        /* ============================================
           ISLAND BASE
           ============================================ */
        function createFloatingIsland(scene) {
            const island = new BABYLON.TransformNode("island", scene);

            // Main island body - irregular shape using multiple merged elements
            const baseSegments = 24;
            const islandRadius = 45;
            
            // Create main landmass
            const landMass = BABYLON.MeshBuilder.CreateCylinder("landMass", {
                diameterTop: islandRadius * 1.8,
                diameterBottom: islandRadius * 1.2,
                height: 12,
                tessellation: baseSegments
            }, scene);
            landMass.material = materials.grass;
            landMass.position.y = 4;
            landMass.parent = island;

            // Top surface with varied terrain
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const radius = islandRadius * 0.5 + Math.random() * islandRadius * 0.3;
                const hill = BABYLON.MeshBuilder.CreateSphere("hill" + i, {
                    diameter: 8 + Math.random() * 10,
                    segments: 12
                }, scene);
                hill.scaling = new BABYLON.Vector3(1.5, 0.4, 1.5);
                hill.position.x = Math.cos(angle) * radius * 0.7;
                hill.position.z = Math.sin(angle) * radius * 0.7;
                hill.position.y = 9 + Math.random() * 2;
                hill.material = materials.grassLight;
                hill.parent = island;
            }

            // Rocky cliffs - underneath
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = islandRadius * 0.55 + Math.random() * islandRadius * 0.15;
                const height = 15 + Math.random() * 20;
                
                const rock = BABYLON.MeshBuilder.CreateCylinder("cliff" + i, {
                    diameterTop: 3 + Math.random() * 5,
                    diameterBottom: 5 + Math.random() * 8,
                    height: height,
                    tessellation: 6 + Math.floor(Math.random() * 4)
                }, scene);
                
                rock.position.x = Math.cos(angle) * radius;
                rock.position.z = Math.sin(angle) * radius;
                rock.position.y = -height / 2 - 2;
                rock.rotation.x = (Math.random() - 0.5) * 0.3;
                rock.rotation.z = (Math.random() - 0.5) * 0.3;
                rock.material = Math.random() > 0.5 ? materials.rock : materials.rockDark;
                rock.parent = island;
            }

            // Bottom point (floating island tip)
            const bottomPoint = BABYLON.MeshBuilder.CreateCylinder("bottomPoint", {
                diameterTop: islandRadius * 0.8,
                diameterBottom: 0,
                height: 35,
                tessellation: baseSegments
            }, scene);
            bottomPoint.position.y = -30;
            bottomPoint.material = materials.rockDark;
            bottomPoint.parent = island;

            // Add rocky outcrops
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = islandRadius * 0.6 + Math.random() * islandRadius * 0.3;
                
                const outcrop = BABYLON.MeshBuilder.CreateSphere("outcrop" + i, {
                    diameter: 4 + Math.random() * 6,
                    segments: 8
                }, scene);
                outcrop.scaling = new BABYLON.Vector3(1, 0.6, 1);
                outcrop.position.x = Math.cos(angle) * radius;
                outcrop.position.z = Math.sin(angle) * radius;
                outcrop.position.y = 8 + Math.random() * 3;
                outcrop.material = materials.rock;
                outcrop.parent = island;
            }

            return island;
        }

        /* ============================================
           CASTLE
           ============================================ */
        function createCastle(scene) {
            const castle = new BABYLON.TransformNode("castle", scene);

            // Main keep (central tower)
            const keep = BABYLON.MeshBuilder.CreateCylinder("keep", {
                diameter: 14,
                height: 25,
                tessellation: 8
            }, scene);
            keep.position.y = 23;
            keep.material = materials.stone;
            keep.parent = castle;

            // Keep roof (cone)
            const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", {
                diameterTop: 0,
                diameterBottom: 16,
                height: 10,
                tessellation: 8
            }, scene);
            keepRoof.position.y = 40;
            keepRoof.material = materials.stoneRoof;
            keepRoof.parent = castle;

            // Keep battlements
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const merlon = BABYLON.MeshBuilder.CreateBox("merlon" + i, {
                    width: 2,
                    height: 3,
                    depth: 1
                }, scene);
                merlon.position.x = Math.cos(angle) * 7;
                merlon.position.z = Math.sin(angle) * 7;
                merlon.position.y = 37;
                merlon.material = materials.stoneDark;
                merlon.parent = castle;
            }

            // Corner towers
            const towerPositions = [
                { x: -12, z: -12 },
                { x: 12, z: -12 },
                { x: -12, z: 12 },
                { x: 12, z: 12 }
            ];

            towerPositions.forEach((pos, i) => {
                // Tower base
                const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + i, {
                    diameter: 7,
                    height: 18,
                    tessellation: 8
                }, scene);
                tower.position.x = pos.x;
                tower.position.z = pos.z;
                tower.position.y = 17;
                tower.material = materials.stone;
                tower.parent = castle;

                // Tower roof
                const towerRoof = BABYLON.MeshBuilder.CreateCylinder("towerRoof" + i, {
                    diameterTop: 0,
                    diameterBottom: 9,
                    height: 7,
                    tessellation: 8
                }, scene);
                towerRoof.position.x = pos.x;
                towerRoof.position.z = pos.z;
                towerRoof.position.y = 29;
                towerRoof.material = materials.roofBlue;
                towerRoof.parent = castle;

                // Tower battlements
                for (let j = 0; j < 6; j++) {
                    const angle = (j / 6) * Math.PI * 2;
                    const merlon = BABYLON.MeshBuilder.CreateBox("tMerlon" + i + "_" + j, {
                        width: 1.5,
                        height: 2,
                        depth: 0.8
                    }, scene);
                    merlon.position.x = pos.x + Math.cos(angle) * 3.5;
                    merlon.position.z = pos.z + Math.sin(angle) * 3.5;
                    merlon.position.y = 27;
                    merlon.material = materials.stoneDark;
                    merlon.parent = castle;
                }
            });

            // Curtain walls
            const wallSegments = [
                { startX: -12, startZ: -12, endX: 12, endZ: -12 },
                { startX: 12, startZ: -12, endX: 12, endZ: 12 },
                { startX: 12, startZ: 12, endX: -12, endZ: 12 },
                { startX: -12, startZ: 12, endX: -12, endZ: -12 }
            ];

            wallSegments.forEach((seg, i) => {
                const length = Math.sqrt(
                    Math.pow(seg.endX - seg.startX, 2) + 
                    Math.pow(seg.endZ - seg.startZ, 2)
                );
                
                const wall = BABYLON.MeshBuilder.CreateBox("wall" + i, {
                    width: length,
                    height: 10,
                    depth: 2
                }, scene);
                
                wall.position.x = (seg.startX + seg.endX) / 2;
                wall.position.z = (seg.startZ + seg.endZ) / 2;
                wall.position.y = 13;
                
                const angle = Math.atan2(seg.endZ - seg.startZ, seg.endX - seg.startX);
                wall.rotation.y = -angle;
                
                wall.material = materials.stone;
                wall.parent = castle;

                // Wall battlements
                for (let j = 0; j < Math.floor(length / 3); j++) {
                    const merlon = BABYLON.MeshBuilder.CreateBox("wMerlon" + i + "_" + j, {
                        width: 1.5,
                        height: 2,
                        depth: 1
                    }, scene);
                    merlon.position.x = wall.position.x + Math.cos(angle + Math.PI/2) * (j - length/6) * 0.5;
                    merlon.position.z = wall.position.z + Math.sin(angle + Math.PI/2) * (j - length/6) * 0.5;
                    merlon.position.y = 19;
                    merlon.rotation.y = -angle;
                    merlon.material = materials.stoneDark;
                    merlon.parent = castle;
                }
            });

            // Main gate
            const gateArch = BABYLON.MeshBuilder.CreateBox("gate", {
                width: 5,
                height: 8,
                depth: 3
            }, scene);
            gateArch.position.z = -13;
            gateArch.position.y = 12;
            gateArch.material = materials.stoneDark;
            gateArch.parent = castle;

            // Gate opening
            const gateOpening = BABYLON.MeshBuilder.CreateBox("gateOpening", {
                width: 3,
                height: 6,
                depth: 4
            }, scene);
            gateOpening.position.z = -13;
            gateOpening.position.y = 11;
            gateOpening.material = materials.door;
            gateOpening.parent = castle;

            // Flag on main keep
            const flagPole = BABYLON.MeshBuilder.CreateCylinder("flagPole", {
                diameter: 0.3,
                height: 6
            }, scene);
            flagPole.position.y = 50;
            flagPole.material = materials.woodDark;
            flagPole.parent = castle;

            const flag = BABYLON.MeshBuilder.CreatePlane("flag", {
                width: 4,
                height: 2.5
            }, scene);
            flag.position.y = 50;
            flag.position.x = 2;
            flag.material = materials.roofRed;
            flag.parent = castle;

            return castle;
        }

        /* ============================================
           MEDIEVAL HOUSE
           ============================================ */
        function createHouse(variant = 0, scale = 1) {
            const house = new BABYLON.TransformNode("house", null);

            const roofTypes = [materials.roofRed, materials.thatch, materials.roofBlue];
            const roofMaterial = roofTypes[variant % 3];

            // Main building
            const width = (4 + variant * 0.5) * scale;
            const depth = (3 + variant * 0.3) * scale;
            const height = (3 + variant * 0.4) * scale;

            const walls = BABYLON.MeshBuilder.CreateBox("walls", {
                width: width,
                height: height,
                depth: depth
            }, null);
            walls.position.y = height / 2;
            walls.material = materials.woodLight;
            walls.parent = house;

            // Timber frame
            const timber1 = BABYLON.MeshBuilder.CreateBox("timber1", {
                width: 0.3,
                height: height,
                depth: depth + 0.1
            }, null);
            timber1.position.y = height / 2;
            timber1.material = materials.woodDark;
            timber1.parent = house;

            const timber2 = BABYLON.MeshBuilder.CreateBox("timber2", {
                width: width + 0.1,
                height: height,
                depth: 0.3
            }, null);
            timber2.position.y = height / 2;
            timber2.material = materials.woodDark;
            timber2.parent = house;

            // Roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {
                diameterTop: 0,
                diameterBottom: width + depth,
                height: 2.5 * scale,
                tessellation: 4
            }, null);
            roof.rotation.y = Math.PI / 4;
            roof.position.y = height + 1.25 * scale;
            roof.material = roofMaterial;
            roof.parent = house;

            // Door
            const door = BABYLON.MeshBuilder.CreateBox("door", {
                width: 0.8 * scale,
                height: 1.5 * scale,
                depth: 0.2
            }, null);
            door.position.z = depth / 2 + 0.05;
            door.position.y = 0.75 * scale;
            door.material = materials.door;
            door.parent = house;

            // Windows
            [-0.8, 0.8].forEach((xOff, i) => {
                const window = BABYLON.MeshBuilder.CreateBox("window" + i, {
                    width: 0.6 * scale,
                    height: 0.6 * scale,
                    depth: 0.2
                }, null);
                window.position.x = xOff * scale;
                window.position.y = 1.8 * scale;
                window.position.z = depth / 2 + 0.05;
                window.material = materials.canvas;
                window.parent = house;
            });

            // Chimney
            if (variant % 2 === 0) {
                const chimney = BABYLON.MeshBuilder.CreateCylinder("chimney", {
                    diameter: 0.6 * scale,
                    height: 2 * scale,
                    tessellation: 6
                }, null);
                chimney.position.x = width / 3;
                chimney.position.y = height + 2 * scale;
                chimney.material = materials.brick;
                chimney.parent = house;
            }

            return house;
        }

        /* ============================================
           TAVERN
           ============================================ */
        function createTavern(scene) {
            const tavern = new BABYLON.TransformNode("tavern", scene);

            // Main building (larger)
            const main = BABYLON.MeshBuilder.CreateBox("tavernMain", {
                width: 8,
                height: 4.5,
                depth: 6
            }, scene);
            main.position.y = 2.25;
            main.material = materials.woodLight;
            main.parent = tavern;

            // Second floor
            const second = BABYLON.MeshBuilder.CreateBox("tavernSecond", {
                width: 7,
                height: 3,
                depth: 5.5
            }, scene);
            second.position.y = 6;
            second.material = materials.woodLight;
            second.parent = tavern;

            // Roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", {
                diameterTop: 0,
                diameterBottom: 10,
                height: 4,
                tessellation: 4
            }, scene);
            roof.rotation.y = Math.PI / 4;
            roof.position.y = 9.5;
            roof.material = materials.roofRed;
            roof.parent = tavern;

            // Sign post
            const signPost = BABYLON.MeshBuilder.CreateCylinder("signPost", {
                diameter: 0.3,
                height: 4
            }, scene);
            signPost.position.x = 5;
            signPost.position.y = 2;
            signPost.material = materials.woodDark;
            signPost.parent = tavern;

            const sign = BABYLON.MeshBuilder.CreatePlane("sign", {
                width: 2,
                height: 1.5
            }, scene);
            sign.position.x = 5;
            sign.position.y = 3.5;
            sign.rotation.y = Math.PI / 2;
            sign.material = materials.wood;
            sign.parent = tavern;

            // Entrance
            const entrance = BABYLON.MeshBuilder.CreateBox("entrance", {
                width: 2,
                height: 2.5,
                depth: 0.3
            }, scene);
            entrance.position.z = 3.15;
            entrance.position.y = 1.25;
            entrance.material = materials.door;
            entrance.parent = tavern;

            return tavern;
        }

        /* ============================================
           MARKET STALLS
           ============================================ */
        function createMarketStall(variant = 0) {
            const stall = new BABYLON.TransformNode("stall", null);

            // Counter
            const counter = BABYLON.MeshBuilder.CreateBox("counter", {
                width: 3,
                height: 1,
                depth: 1.5
            }, null);
            counter.position.y = 0.5;
            counter.material = materials.wood;
            counter.parent = stall;

            // Canopy
            const canopy = BABYLON.MeshBuilder.CreateBox("canopy", {
                width: 3.5,
                height: 0.15,
                depth: 2
            }, null);
            canopy.position.y = 2.5;
            canopy.material = variant % 2 === 0 ? materials.roofRed : materials.canvas;
            canopy.parent = stall;

            // Support poles
            [[-1.3, 0.8], [1.3, 0.8], [-1.3, -0.8], [1.3, -0.8]].forEach((pos, i) => {
                const pole = BABYLON.MeshBuilder.CreateCylinder("pole" + i, {
                    diameter: 0.15,
                    height: 2.5
                }, null);
                pole.position.x = pos[0];
                pole.position.z = pos[1];
                pole.position.y = 1.25;
                pole.material = materials.woodDark;
                pole.parent = stall;
            });

            // Goods on counter
            for (let i = 0; i < 4; i++) {
                const good = BABYLON.MeshBuilder.CreateSphere("good" + i, {
                    diameter: 0.3 + Math.random() * 0.2,
                    segments: 8
                }, null);
                good.position.x = (i - 1.5) * 0.7;
                good.position.y = 1.15;
                good.position.z = Math.random() * 0.8 - 0.4;
                good.material = variant % 3 === 0 ? materials.gold : materials.canvas;
                good.parent = stall;
            }

            return stall;
        }

        /* ============================================
           RIVERSIDE MILL
           ============================================ */
        function createMill(scene) {
            const mill = new BABYLON.TransformNode("mill", scene);

            // Main building
            const main = BABYLON.MeshBuilder.CreateBox("millMain", {
                width: 5,
                height: 4,
                depth: 4
            }, scene);
            main.position.y = 2;
            main.material = materials.woodLight;
            main.parent = mill;

            // Roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {
                diameterTop: 0,
                diameterBottom: 7,
                height: 3,
                tessellation: 4
            }, scene);
            roof.rotation.y = Math.PI / 4;
            roof.position.y = 5.5;
            roof.material = materials.thatch;
            roof.parent = mill;

            // Water wheel
            const wheelCenter = BABYLON.MeshBuilder.CreateCylinder("wheelCenter", {
                diameter: 0.8,
                height: 1.2,
                tessellation: 12
            }, scene);
            wheelCenter.rotation.x = Math.PI / 2;
            wheelCenter.position.x = -2.8;
            wheelCenter.position.y = 2;
            wheelCenter.material = materials.woodDark;
            wheelCenter.parent = mill;

            // Wheel paddles
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const paddle = BABYLON.MeshBuilder.CreateBox("paddle" + i, {
                    width: 0.2,
                    height: 1.8,
                    depth: 0.8
                }, scene);
                paddle.position.x = -2.8;
                paddle.position.y = 2 + Math.sin(angle) * 1.3;
                paddle.position.z = Math.cos(angle) * 1.3;
                paddle.rotation.x = angle;
                paddle.material = materials.wood;
                paddle.parent = mill;
            }

            // Wheel outer ring
            const wheelRing = BABYLON.MeshBuilder.CreateTorus("wheelRing", {
                diameter: 3,
                thickness: 0.2,
                tessellation: 24
            }, scene);
            wheelRing.rotation.z = Math.PI / 2;
            wheelRing.position.x = -2.8;
            wheelRing.position.y = 2;
            wheelRing.material = materials.woodDark;
            wheelRing.parent = mill;

            return mill;
        }

        /* ============================================
           PINE TREE
           ============================================ */
        function createPineTree(scale = 1, variation = 0) {
            const tree = new BABYLON.TransformNode("tree", null);

            // Trunk
            const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
                diameterTop: 0.2 * scale,
                diameterBottom: 0.5 * scale,
                height: 2 * scale,
                tessellation: 6
            }, null);
            trunk.position.y = scale;
            trunk.material = materials.woodDark;
            trunk.parent = tree;

            // Foliage layers
            const layers = 4 + variation;
            for (let i = 0; i < layers; i++) {
                const layerScale = 1 - i * 0.15;
                const foliage = BABYLON.MeshBuilder.CreateCylinder("foliage" + i, {
                    diameterTop: 0,
                    diameterBottom: 2.5 * scale * layerScale,
                    height: 1.5 * scale,
                    tessellation: 8
                }, null);
                foliage.position.y = (1.5 + i * 0.9) * scale;
                foliage.material = i % 2 === 0 ? materials.pine : materials.pineDark;
                foliage.parent = tree;
            }

            return tree;
        }

        /* ============================================
           WOODEN BRIDGE
           ============================================ */
        function createBridge(length = 8) {
            const bridge = new BABYLON.TransformNode("bridge", null);

            // Deck
            const deck = BABYLON.MeshBuilder.CreateBox("deck", {
                width: length,
                height: 0.3,
                depth: 2.5
            }, null);
            deck.position.y = 1;
            deck.material = materials.wood;
            bridge.parent = bridge;

            // Railings
            [-1.1, 1.1].forEach((zOff, i) => {
                const rail = BABYLON.MeshBuilder.CreateBox("rail" + i, {
                    width: length,
                    height: 0.1,
                    depth: 0.15
                }, null);
                rail.position.y = 1.6;
                rail.position.z = zOff;
                rail.material = materials.woodDark;
                rail.parent = bridge;

                // Posts
                for (let j = 0; j < length / 2; j++) {
                    const post = BABYLON.MeshBuilder.CreateCylinder("post" + i + "_" + j, {
                        diameter: 0.15,
                        height: 0.7
                    }, null);
                    post.position.x = j * 2 - length / 2 + 1;
                    post.position.y = 1.3;
                    post.position.z = zOff;
                    post.material = materials.woodDark;
                    post.parent = bridge;
                }
            });

            // Support beams
            [-length / 3, length / 3].forEach((xPos, i) => {
                const beam = BABYLON.MeshBuilder.CreateBox("beam" + i, {
                    width: 0.4,
                    height: 2,
                    depth: 0.4
                }, null);
                beam.position.x = xPos;
                beam.position.y = 0;
                beam.material = materials.woodDark;
                beam.parent = bridge;
            });

            deck.parent = bridge;
            
            return bridge;
        }

        /* ============================================
           RUINED WATCHTOWER
           ============================================ */
        function createRuinedWatchtower(scene) {
            const tower = new BABYLON.TransformNode("ruinedTower", scene);

            // Base (mostly intact)
            const base = BABYLON.MeshBuilder.CreateCylinder("ruinedBase", {
                diameter: 6,
                height: 6,
                tessellation: 8
            }, scene);
            base.position.y = 3;
            base.material = materials.stoneDark;
            base.parent = tower;

            // Broken top section
            const brokenTop = BABYLON.MeshBuilder.CreateCylinder("brokenTop", {
                diameterTop: 4,
                diameterBottom: 5.5,
                height: 4,
                tessellation: 8,
                arc: 0.7
            }, scene);
            brokenTop.position.y = 8;
            brokenTop.rotation.y = Math.PI * 0.3;
            brokenTop.material = materials.stone;
            brokenTop.parent = tower;

            // Rubble around base
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 3 + Math.random() * 2;
                
                const rubble = BABYLON.MeshBuilder.CreateBox("rubble" + i, {
                    width: 0.5 + Math.random() * 1,
                    height: 0.3 + Math.random() * 0.5,
                    depth: 0.5 + Math.random() * 1
                }, scene);
                rubble.position.x = Math.cos(angle) * dist;
                rubble.position.z = Math.sin(angle) * dist;
                rubble.position.y = 0.3;
                rubble.rotation.y = Math.random() * Math.PI;
                rubble.material = materials.stoneDark;
                rubble.parent = tower;
            }

            // Remaining battlement pieces
            for (let i = 0; i < 3; i++) {
                const angle = (i / 6) * Math.PI * 2 + 0.5;
                const merlon = BABYLON.MeshBuilder.CreateBox("remMerlon" + i, {
                    width: 1,
                    height: 1.5,
                    depth: 0.6
                }, scene);
                merlon.position.x = Math.cos(angle) * 2.5;
                merlon.position.z = Math.sin(angle) * 2.5;
                merlon.position.y = 7;
                merlon.material = materials.stoneDark;
                merlon.parent = tower;
            }

            return tower;
        }

        /* ============================================
           WATER SYSTEM (River + Waterfalls)
           ============================================ */
        function createWaterSystem(scene) {
            const water = new BABYLON.TransformNode("water", scene);

            // Main river
            const riverPoints = [
                new BABYLON.Vector3(-50, 7, 15),
                new BABYLON.Vector3(-30, 7, 12),
                new BABYLON.Vector3(-10, 7, 8),
                new BABYLON.Vector3(10, 7, 5),
                new BABYLON.Vector3(30, 7, 8),
                new BABYLON.Vector3(50, 7, 12)
            ];

            // River surface
            const river = BABYLON.MeshBuilder.CreateGround("river", {
                width: 100,
                height: 8,
                subdivisions: 20
            }, scene);
            river.position.y = 6.8;
            river.position.z = 10;
            river.material = materials.water;
            river.parent = water;

            // River banks
            [-4, 4].forEach((zOff, i) => {
                const bank = BABYLON.MeshBuilder.CreateBox("bank" + i, {
                    width: 100,
                    height: 1.5,
                    depth: 2
                }, scene);
                bank.position.y = 7;
                bank.position.z = 10 + zOff + (i === 0 ? -2 : 2);
                bank.material = materials.grassLight;
                bank.parent = water;
            });

            // Waterfalls
            const waterfallPositions = [
                { x: -45, z: 10, height: 8 },
                { x: 45, z: 10, height: 8 }
            ];

            waterfallPositions.forEach((pos, i) => {
                // Waterfall cascade
                const cascade = BABYLON.MeshBuilder.CreatePlane("waterfall" + i, {
                    width: 6,
                    height: pos.height
                }, scene);
                cascade.position.x = pos.x;
                cascade.position.y = 6 + pos.height / 2;
                cascade.position.z = pos.z;
                cascade.rotation.y = i === 0 ? 0 : Math.PI;
                cascade.material = materials.water;
                cascade.parent = water;

                // Mist effect (simple planes)
                for (let j = 0; j < 3; j++) {
                    const mist = BABYLON.MeshBuilder.CreatePlane("mist" + i + "_" + j, {
                        width: 4,
                        height: 2
                    }, scene);
                    mist.position.x = pos.x + (i === 0 ? 2 : -2);
                    mist.position.y = 4 + j * 2;
                    mist.position.z = pos.z;
                    mist.rotation.y = Math.PI / 4 + j * 0.3;
                    mist.material = materials.water;
                    mist.parent = water;
                }
            });

            return water;
        }

        /* ============================================
           VILLAGE SETUP
           ============================================ */
        function createVillage(scene, island) {
            const village = new BABYLON.TransformNode("village", scene);
            village.parent = island;

            // Houses around the castle
            const housePositions = [
                { x: -25, z: 0, rot: 0.3, variant: 0 },
                { x: -22, z: 8, rot: -0.2, variant: 1 },
                { x: -18, z: -12, rot: 0.5, variant: 2 },
                { x: 25, z: -5, rot: Math.PI + 0.2, variant: 0 },
                { x: 22, z: -12, rot: Math.PI - 0.3, variant: 1 },
                { x: 18, z: 15, rot: Math.PI + 0.4, variant: 2 },
                { x: -8, z: 22, rot: Math.PI / 2, variant: 0 },
                { x: 10, z: 20, rot: -Math.PI / 2, variant: 1 },
                { x: -15, z: 18, rot: 0.1, variant: 2 },
                { x: 15, z: -20, rot: Math.PI, variant: 0 }
            ];

            housePositions.forEach((pos, i) => {
                const house = createHouse(pos.variant, 0.8 + Math.random() * 0.4);
                house.position.x = pos.x;
                house.position.z = pos.z;
                house.position.y = 10;
                house.rotation.y = pos.rot;
                house.parent = village;
            });

            // Tavern
            const tavern = createTavern(scene);
            tavern.position.x = -28;
            tavern.position.z = -8;
            tavern.position.y = 10;
            tavern.rotation.y = 0.8;
            tavern.parent = village;

            // Market stalls
            const marketPositions = [
                { x: -5, z: -25, rot: Math.PI / 4 },
                { x: 0, z: -26, rot: 0 },
                { x: 5, z: -25, rot: -Math.PI / 4 },
                { x: 8, z: -23, rot: -Math.PI / 6 }
            ];

            marketPositions.forEach((pos, i) => {
                const stall = createMarketStall(i);
                stall.position.x = pos.x;
                stall.position.z = pos.z;
                stall.position.y = 10;
                stall.rotation.y = pos.rot;
                stall.parent = village;
            });

            // Mill near river
            const mill = createMill(scene);
            mill.position.x = 20;
            mill.position.z = 6;
            mill.position.y = 10;
            mill.rotation.y = -Math.PI / 3;
            mill.parent = village;

            // Pine trees scattered around
            const treePositions = [];
            for (let i = 0; i < 35; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 20 + Math.random() * 20;
                treePositions.push({
                    x: Math.cos(angle) * radius,
                    z: Math.sin(angle) * radius,
                    scale: 0.6 + Math.random() * 0.8,
                    variation: Math.floor(Math.random() * 3)
                });
            }

            treePositions.forEach((pos, i) => {
                const tree = createPineTree(pos.scale, pos.variation);
                tree.position.x = pos.x;
                tree.position.z = pos.z;
                tree.position.y = 10;
                tree.parent = village;
            });

            // Bridges over river
            const bridge1 = createBridge(10);
            bridge1.position.x = -15;
            bridge1.position.z = 10;
            bridge1.position.y = 16;
            bridge1.rotation.y = Math.PI / 8;
            bridge1.parent = village;

            const bridge2 = createBridge(10);
            bridge2.position.x = 15;
            bridge2.position.z = 10;
            bridge2.position.y = 16;
            bridge2.rotation.y = -Math.PI / 8;
            bridge2.parent = village;

            return village;
        }

        /* ============================================
           ASSEMBLE COMPLETE SCENE
           ============================================ */
        function createScene() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.4, 0.55, 0.75, 1);

            // Create materials first
            createMaterials(scene);

            // Camera - orbit around the diorama
            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                Math.PI / 4,
                Math.PI / 3,
                80,
                new BABYLON.Vector3(0, 15, 0),
                scene
            );
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 40;
            camera.upperRadiusLimit = 150;
            camera.lowerBetaLimit = 0.2;
            camera.upperBetaLimit = Math.PI / 2.1;
            camera.wheelPrecision = 5;
            camera.panningSensibility = 100;

            // Lighting - soft, warm, miniaturesque
            const hemiLight = new BABYLON.HemisphericLight(
                "hemiLight",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            hemiLight.intensity = 0.9;
            hemiLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
            hemiLight.groundColor = new BABYLON.Color3(0.4, 0.5, 0.6);

            const sunLight = new BABYLON.DirectionalLight(
                "sunLight",
                new BABYLON.Vector3(-1, -2, -1),
                scene
            );
            sunLight.intensity = 0.6;
            sunLight.diffuse = new BABYLON.Color3(1, 0.9, 0.7);

            // Add slight ambient for miniature feel
            const ambientLight = new BABYLON.HemisphericLight(
                "ambientLight",
                new BABYLON.Vector3(0, -1, 0),
                scene
            );
            ambientLight.intensity = 0.3;
            ambientLight.diffuse = new BABYLON.Color3(0.6, 0.7, 0.8);

            // Fog for depth
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.003;
            scene.fogColor = new BABYLON.Color3(0.5, 0.6, 0.75);

            // Create island base
            const island = createFloatingIsland(scene);
            island.position.y = 0;

            // Create castle at center
            const castle = createCastle(scene);
            castle.parent = island;

            // Create village around castle
            const village = createVillage(scene, island);

            // Create river and waterfalls
            const waterSystem = createWaterSystem(scene);
            waterSystem.parent = island;

            // Create ruined watchtower at edge
            const ruinedTower = createRuinedWatchtower(scene);
            ruinedTower.position.x = 35;
            ruinedTower.position.z = -25;
            ruinedTower.position.y = 10;
            ruinedTower.parent = island;

            // Additional decorative rocks
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 30 + Math.random() * 15;
                
                const rock = BABYLON.MeshBuilder.CreateSphere("decorRock" + i, {
                    diameter: 1 + Math.random() * 2,
                    segments: 6
                }, scene);
                rock.scaling = new BABYLON.Vector3(1, 0.5 + Math.random() * 0.3, 1);
                rock.position.x = Math.cos(angle) * radius;
                rock.position.z = Math.sin(angle) * radius;
                rock.position.y = 10;
                rock.material = Math.random() > 0.5 ? materials.rock : materials.rockDark;
                rock.parent = island;
            }

            // Floating particles (dust motes for miniature effect)
            const particleSystem = new BABYLON.ParticleSystem("particles", 100, scene);
            particleSystem.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAGklEQVQYV2NkYGD4z4AHMP7//x+fNKM4QQAAjicF/2p+/UIAAAAASUVORK5CYII=", scene);
            particleSystem.emitter = new BABYLON.Vector3(0, 20, 0);
            particleSystem.minEmitBox = new BABYLON.Vector3(-40, -10, -40);
            particleSystem.maxEmitBox = new BABYLON.Vector3(40, 30, 40);
            particleSystem.color1 = new BABYLON.Color4(1, 1, 0.9, 0.3);
            particleSystem.color2 = new BABYLON.Color4(1, 0.9, 0.7, 0.1);
            particleSystem.minSize = 0.1;
            particleSystem.maxSize = 0.3;
            particleSystem.minLifeTime = 3;
            particleSystem.maxLifeTime = 6;
            particleSystem.emitRate = 10;
            particleSystem.gravity = new BABYLON.Vector3(0, 0.02, 0);
            particleSystem.direction1 = new BABYLON.Vector3(-0.1, 0.1, -0.1);
            particleSystem.direction2 = new BABYLON.Vector3(0.1, 0.2, 0.1);
            particleSystem.minEmitPower = 0.1;
            particleSystem.maxEmitPower = 0.3;
            particleSystem.start();

            // Keyboard controls for panning
            scene.onKeyboardObservable.add((kbInfo) => {
                const moveSpeed = 0.5;
                if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
                    switch (kbInfo.event.code) {
                        case 'KeyW':
                            camera.target.z -= moveSpeed;
                            break;
                        case 'KeyS':
                            camera.target.z += moveSpeed;
                            break;
                        case 'KeyA':
                            camera.target.x -= moveSpeed;
                            break;
                        case 'KeyD':
                            camera.target.x += moveSpeed;
                            break;
                    }
                }
            });

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 500);

            return scene;
        }

        // Create and run scene
        const scene = createScene();

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener('resize', () => {
            engine.resize();
        });
    </script>
</body>
</html>
