<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #e8d5b7; font-family: 'Georgia', serif; font-size: 1.4em; z-index: 999;
    flex-direction: column; gap: 20px; transition: opacity 0.8s;
  }
  #loading .spinner {
    width: 50px; height: 50px; border: 3px solid rgba(232,213,183,0.2);
    border-top-color: #e8d5b7; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #info {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #e8d5b7; font-family: 'Georgia', serif; font-size: 12px;
    background: rgba(0,0,0,0.5); padding: 6px 18px; border-radius: 20px;
    pointer-events: none; opacity: 0.7;
  }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>Building your floating realm...</div></div>
<div id="info">🏰 Click & drag to orbit · Scroll to zoom · Right-click to pan</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function() {
  const canvas = document.createElement('canvas');
  canvas.id = 'renderCanvas';
  document.body.appendChild(canvas);
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
  let scene, camera, floatingGroup;
  let waterMesh, waterOffset = 0;
  let waterfallParticles = [];

  createScene();

  engine.runRenderLoop(function() {
    if (scene && camera) {
      scene.render();
      waterOffset += 0.008;
      if (waterMesh) {
        waterMesh.position.y = -0.5 + Math.sin(waterOffset * 0.5) * 0.08;
      }
      if (floatingGroup) {
        floatingGroup.position.y = Math.sin(Date.now() * 0.0003) * 0.4;
      }
    }
  });

  window.addEventListener('resize', () => engine.resize());

  function createScene() {
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.12, 0.18, 0.35);
    scene.ambientColor = new BABYLON.Color3(0.25, 0.3, 0.4);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.003;
    scene.fogColor = new BABYLON.Color3(0.15, 0.22, 0.38);

    // Camera
    camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 3, Math.PI / 3.5, 65, new BABYLON.Vector3(0, 4, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 20;
    camera.upperRadiusLimit = 120;
    camera.lowerBetaLimit = 0.1;
    camera.upperBetaLimit = Math.PI / 2.1;
    camera.wheelPrecision = 30;
    camera.panningSensibility = 800;

    // Floating island group
    floatingGroup = new BABYLON.TransformNode("floatingIsland", scene);

    // Lights
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.6;
    hemi.diffuse = new BABYLON.Color3(0.9, 0.85, 0.75);
    hemi.groundColor = new BABYLON.Color3(0.3, 0.4, 0.3);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-2, -5, 3), scene);
    sun.position = new BABYLON.Vector3(30, 50, -20);
    sun.intensity = 1.2;
    sun.diffuse = new BABYLON.Color3(1, 0.95, 0.8);
    sun.shadowMinZ = 1;
    sun.shadowMaxZ = 100;

    const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
    shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.blurKernel = 16;

    const fillLight = new BABYLON.DirectionalLight("fill", new BABYLON.Vector3(3, 2, -2), scene);
    fillLight.intensity = 0.3;
    fillLight.diffuse = new BABYLON.Color3(0.4, 0.5, 0.7);

    // Create everything
    buildIslandBase();
    buildCastle(shadowGen);
    buildVillage(shadowGen);
    buildTavern(shadowGen);
    buildMarketStalls(shadowGen);
    buildMill(shadowGen);
    buildRiver();
    buildBridges(shadowGen);
    buildTrees(shadowGen);
    buildWatchtower(shadowGen);
    buildWaterfalls();
    buildGrass();
    buildClouds();
    buildRocks();
    buildParticles();
  }

  // ========== MATERIALS ==========
  function mat(color, opts = {}) {
    const m = new BABYLON.StandardMaterial(opts.name || "mat", scene);
    m.diffuseColor = new BABYLON.Color3(...color);
    m.specularColor = opts.specular ? new BABYLON.Color3(...opts.specular) : new BABYLON.Color3(0.1, 0.1, 0.1);
    m.specularPower = opts.specularPower || 32;
    if (opts.emissive) m.emissiveColor = new BABYLON.Color3(...opts.emissive);
    if (opts.alpha !== undefined) { m.alpha = opts.alpha; m.backFaceCulling = false; }
    if (opts.roughness) m.roughness = opts.roughness;
    return m;
  }

  const stoneMat = mat([0.55, 0.52, 0.48], { name: "stone", roughness: 0.9 });
  const darkStoneMat = mat([0.42, 0.38, 0.35], { name: "darkStone" });
  const castleStoneMat = mat([0.62, 0.58, 0.52], { name: "castleStone", roughness: 0.85 });
  const woodMat = mat([0.45, 0.28, 0.15], { name: "wood", roughness: 0.95 });
  const darkWoodMat = mat([0.3, 0.18, 0.1], { name: "darkWood" });
  const roofMat = mat([0.72, 0.25, 0.18], { name: "roof", roughness: 0.8 });
  const roofBlueMat = mat([0.2, 0.35, 0.65], { name: "roofBlue", roughness: 0.7 });
  const roofGreenMat = mat([0.2, 0.55, 0.25], { name: "roofGreen", roughness: 0.75 });
  const grassMat = mat([0.25, 0.6, 0.2], { name: "grass", roughness: 1 });
  const grassDarkMat = mat([0.18, 0.45, 0.15], { name: "grassDark" });
  const riverMat = mat([0.15, 0.6, 0.65], { name: "river", specular: [1, 1, 1], specularPower: 200, alpha: 0.8 });
  const cliffMat = mat([0.48, 0.42, 0.38], { name: "cliff", roughness: 0.95 });
  const pineMat = mat([0.12, 0.35, 0.15], { name: "pine" });
  const pineDarkMat = mat([0.08, 0.25, 0.1], { name: "pineDark" });
  const windowMat = mat([0.95, 0.8, 0.3], { name: "window", emissive: [0.4, 0.3, 0.05] });
  const pathMat = mat([0.55, 0.45, 0.35], { name: "path" });
  const waterWhiteMat = mat([0.85, 0.92, 0.95], { name: "waterWhite", alpha: 0.7, specular: [1,1,1], specularPower: 100 });
  const sandMat = mat([0.75, 0.65, 0.45], { name: "sand" });
  const flagMat = mat([0.85, 0.15, 0.15], { name: "flag", alpha: 0.9 });
  const flagBlueMat = mat([0.15, 0.25, 0.7], { name: "flagBlue", alpha: 0.9 });
  const goldMat = mat([0.85, 0.7, 0.2], { name: "gold", specular: [1,0.9,0.3], specularPower: 128 });
  const ruinStoneMat = mat([0.5, 0.46, 0.4], { name: "ruinStone" });

  // ========== HELPER FUNCTIONS ==========
  function box(w, h, d, pos, parent, matRef, castShadow = true, receiveShadow = true) {
    const m = BABYLON.MeshBuilder.CreateBox("b", { width: w, height: h, depth: d }, scene);
    m.position = pos.clone();
    m.parent = parent || floatingGroup;
    m.material = matRef || stoneMat;
    m.castShadow = castShadow;
    m.receiveShadow = receiveShadow;
    return m;
  }

  function cyl(rt, rb, h, seg, pos, parent, matRef) {
    const m = BABYLON.MeshBuilder.CreateCylinder("c", { height: h, diameterTop: rt, diameterBottom: rb, tessellation: seg || 12 }, scene);
    m.position = pos.clone();
    m.parent = parent || floatingGroup;
    m.material = matRef || stoneMat;
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  function cone(r, h, seg, pos, parent, matRef) {
    const m = BABYLON.MeshBuilder.CreateCylinder("cone", { height: h, diameterTop: 0, diameterBottom: r * 2, tessellation: seg || 8 }, scene);
    m.position = pos.clone();
    m.parent = parent || floatingGroup;
    m.material = matRef || pineMat;
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  function sphere(r, pos, parent, matRef, seg = 16) {
    const m = BABYLON.MeshBuilder.CreateSphere("s", { diameter: r * 2, segments: seg }, scene);
    m.position = pos.clone();
    m.parent = parent || floatingGroup;
    m.material = matRef || stoneMat;
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  // ========== ISLAND BASE ==========
  function buildIslandBase() {
    // Main island body - layered disc shape
    const layers = [
      { y: 0, radius: 28, thickness: 5 },
      { y: -1.5, radius: 30, thickness: 4 },
      { y: -3, radius: 32, thickness: 3.5 },
      { y: -4.5, radius: 34, thickness: 3 },
      { y: -6, radius: 33, thickness: 2.5 },
      { y: -7.5, radius: 30, thickness: 2 },
      { y: -8.5, radius: 25, thickness: 1.8 },
      { y: -9.5, radius: 18, thickness: 1.5 },
      { y: -10.5, radius: 12, thickness: 1.2 },
      { y: -11.5, radius: 6, thickness: 1 },
      { y: -12.2, radius: 2.5, thickness: 0.8 },
    ];

    layers.forEach((l, i) => {
      const mesh = BABYLON.MeshBuilder.CreateCylinder("islandLayer" + i, {
        height: l.thickness, diameterTop: l.radius * 2, diameterBottom: l.radius * 2, tessellation: 32
      }, scene);
      mesh.position.y = l.y - l.thickness / 2;
      mesh.parent = floatingGroup;

      // Vary the material for rock layers
      if (i < 3) mesh.material = grassMat;
      else if (i < 6) mesh.material = cliffMat;
      else mesh.material = darkStoneMat;

      mesh.receiveShadow = true;
      mesh.castShadow = true;

      // Slightly deform vertices for natural look
      const positions = mesh.getPositions();
      for (let j = 0; j < positions.length; j += 3) {
        const px = positions[j];
        const py = positions[j + 1];
        const pz = positions[j + 2];
        const dist = Math.sqrt(px * px + pz * pz);
        if (dist > l.radius * 0.8 && py < 0) {
          const noise = Math.sin(px * 3.7 + pz * 2.3) * 0.6 + Math.cos(px * 1.1 - pz * 4.2) * 0.4;
          positions[j] += noise * 0.3;
          positions[j + 2] += noise * 0.3;
        }
      }
      mesh.updatePositionData();
    });

    // Top surface - grass plateau
    const topSurface = BABYLON.MeshBuilder.CreateCylinder("topSurface", {
      height: 0.3, diameterTop: 27, diameterBottom: 28, tessellation: 48
    }, scene);
    topSurface.position.y = 0.15;
    topSurface.parent = floatingGroup;
    topSurface.material = grassMat;
    topSurface.receiveShadow = true;

    // Rocky bottom point
    const bottomRock = BABYLON.MeshBuilder.CreateSphere("bottomRock", { diameter: 3, segments: 12 }, scene);
    bottomRock.position.y = -12.8;
    bottomRock.parent = floatingGroup;
    bottomRock.material = darkStoneMat;
    bottomRock.scaling.z = 0.6;

    // Floating rocks underneath
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.5;
      const dist = 8 + Math.random() * 12;
      const rockSize = 0.5 + Math.random() * 1.5;
      const rock = BABYLON.MeshBuilder.CreatePolyhedron("fRock" + i, { size: rockSize, type: 1 }, scene);
      rock.position = new BABYLON.Vector3(
        Math.cos(angle) * dist,
        -8 - Math.random() * 4,
        Math.sin(angle) * dist
      );
      rock.parent = floatingGroup;
      rock.material = i % 2 === 0 ? cliffMat : darkStoneMat;
      rock.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());
      rock.castShadow = true;
    }

    // Cliff faces - jagged sides
    for (let i = 0; i < 20; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 26 + Math.random() * 6;
      const h = 2 + Math.random() * 6;
      const rock = BABYLON.MeshBuilder.CreatePolyhedron("cliff" + i, { size: 1 + Math.random() * 2, type: 2 }, scene);
      rock.position = new BABYLON.Vector3(
        Math.cos(angle) * dist,
        -2 - Math.random() * 5,
        Math.sin(angle) * dist
      );
      rock.parent = floatingGroup;
      rock.material = cliffMat;
      rock.rotation = new BABYLON.Vector3(Math.random() * 0.5, Math.random(), Math.random() * 0.5);
      rock.scaling.y = h / 2;
      rock.castShadow = true;
      rock.receiveShadow = true;
    }
  }

  // ========== CASTLE ==========
  function buildCastle(shadowGen) {
    const cg = new BABYLON.TransformNode("castle", floatingGroup);

    // Castle base platform
    box(16, 1.5, 14, new BABYLON.Vector3(0, 0.75, 0), cg, castleStoneMat);

    // Main walls
    // Front wall
    box(16, 8, 0.8, new BABYLON.Vector3(0, 5.5, 7), cg, castleStoneMat);
    // Back wall
    box(16, 8, 0.8, new BABYLON.Vector3(0, 5.5, -7), cg, castleStoneMat);
    // Left wall
    box(0.8, 8, 14, new BABYLON.Vector3(-7.6, 5.5, 0), cg, castleStoneMat);
    // Right wall
    box(0.8, 8, 14, new BABYLON.Vector3(7.6, 5.5, 0), cg, castleStoneMat);

    // Battlements
    for (let i = -7; i <= 7; i += 1.2) {
      box(0.8, 1.2, 0.8, new BABYLON.Vector3(i, 9.6, 7.4), cg, castleStoneMat);
      box(0.8, 1.2, 0.8, new BABYLON.Vector3(i, 9.6, -7.4), cg, castleStoneMat);
    }
    for (let i = -6; i <= 6; i += 1.2) {
      box(0.8, 1.2, 0.8, new BABYLON.Vector3(-7.8, 9.6, i), cg, castleStoneMat);
      box(0.8, 1.2, 0.8, new BABYLON.Vector3(7.8, 9.6, i), cg, castleStoneMat);
    }

    // Towers
    const towerPositions = [
      [-7.6, 7], [7.6, 7], [-7.6, -7], [7.6, -7]
    ];
    towerPositions.forEach((pos, i) => {
      // Tower base
      cyl(1.8, 2, 12, 12, new BABYLON.Vector3(pos[0], 6, pos[1]), cg, castleStoneMat);
      // Tower top
      cone(2.4, 3, 12, new BABYLON.Vector3(pos[0], 13.5, pos[1]), cg, roofBlueMat);

      // Tower windows
      for (let j = 0; j < 3; j++) {
        box(0.3, 0.8, 0.3, new BABYLON.Vector3(
          pos[0] + (pos[0] > 0 ? -2 : 2) * Math.sign(pos[0]),
          3 + j * 3,
          pos[1] + (pos[1] > 0 ? -2 : 2) * Math.sign(pos[1] || 1)
        ), cg, windowMat);
      }

      // Flag on towers
      const flagPole = cyl(0.05, 0.05, 2, 6, new BABYLON.Vector3(pos[0], 15.5, pos[1]), cg, darkWoodMat);
      const flag = box(0.8, 0.5, 0.05, new BABYLON.Vector3(pos[0] + 0.4, 15.8, pos[1]), cg, i % 2 === 0 ? flagMat : flagBlueMat);
    });

    // Keep (main building)
    box(6, 10, 6, new BABYLON.Vector3(0, 6.5, 0), cg, castleStoneMat);
    // Keep roof
    const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", { height: 4, diameterTop: 0, diameterBottom: 6, tessellation: 4 }, scene);
    keepRoof.position = new BABYLON.Vector3(0, 14, 0);
    keepRoof.parent = cg;
    keepRoof.material = roofBlueMat;

    // Keep windows
    for (let side = 0; side < 4; side++) {
      for (let w = 0; w < 2; w++) {
        const angle = (side * Math.PI / 2);
        const wx = Math.sin(angle) * 3.1;
        const wz = Math.cos(angle) * 3.1;
        const win = box(0.4, 0.8, 0.4, new BABYLON.Vector3(wx, 5 + w * 3, wz), cg, windowMat);
      }
    }

    // Gate
    box(3, 5, 1, new BABYLON.Vector3(0, 3.5, 7.5), cg, darkWoodMat);
    // Gate arch
    const arch = BABYLON.MeshBuilder.CreateTorus("gateArch", { diameter: 3, thickness: 0.4, tessellation: 12 }, scene);
    arch.position = new BABYLON.Vector3(0, 6, 7.5);
    arch.parent = cg;
    arch.material = castleStoneMat;
    arch.scaling.y = 0.7;

    // Gate towers
    cyl(1.2, 1.5, 4, 10, new BABYLON.Vector3(-2.5, 9, 7.5), cg, castleStoneMat);
    cyl(1.2, 1.5, 4, 10, new BABYLON.Vector3(2.5, 9, 7.5), cg, castleStoneMat);
    cone(1.8, 2, 10, new BABYLON.Vector3(-2.5, 12, 7.5), cg, roofMat);
    cone(1.8, 2, 10, new BABYLON.Vector3(2.5, 12, 7.5), cg, roofMat);

    // Interior courtyard ground
    box(13, 0.2, 11, new BABYLON.Vector3(0, 1.55, 0), cg, pathMat);

    // Courtyard well
    cyl(0.8, 1, 1.2, 12, new BABYLON.Vector3(0, 2.2, 0), cg, stoneMat);
    box(1.5, 0.1, 1.5, new BABYLON.Vector3(0, 2.9, 0), cg, darkWoodMat);
    cyl(0.05, 0.05, 1.5, 6, new BABYLON.Vector3(-0.5, 3.7, 0), cg, darkWoodMat);
    cyl(0.05, 0.05, 1.5, 6, new BABYLON.Vector3(0.5, 3.7, 0), cg, darkWoodMat);

    // Drawbridge path
    box(3, 0.2, 4, new BABYLON.Vector3(0, 1.5, 9.5), cg, woodMat);

    shadowGen.addShadowCaster(cg);
  }

  // ========== VILLAGE ==========
  function buildVillage(shadowGen) {
    const houses = [
      { pos: [-18, 0, 8], rot: 0.3, size: [4, 4.5, 3.5], roof: roofMat },
      { pos: [-15, 0, 13], rot: -0.2, size: [3.5, 4, 3], roof: roofGreenMat },
      { pos: [-20, 0, 3], rot: 0.5, size: [3.8, 5, 3.2], roof: roofMat },
      { pos: [-12, 0, 7], rot: -0.1, size: [3.2, 3.8, 3], roof: roofGreenMat },
      { pos: [-17, 0, -5], rot: 0.4, size: [4, 4.2, 3.5], roof: roofMat },
      { pos: [-22, 0, 0], rot: 0.6, size: [3.5, 4.5, 3], roof: roofBlueMat },
      { pos: [-14, 0, -8], rot: -0.3, size: [3.8, 4, 3.2], roof: roofMat },
      { pos: [-19, 0, 12], rot: 0.2, size: [3.2, 3.5, 2.8], roof: roofGreenMat },
    ];

    houses.forEach((h, i) => {
      const hg = new BABYLON.TransformNode("house" + i, floatingGroup);
      hg.position = new BABYLON.Vector3(...h.pos);
      hg.rotation.y = h.rot;

      // Main building
      box(h.size[0], h.size[1], h.size[2], new BABYLON.Vector3(0, h.size[1] / 2 + 0.15, 0), hg, woodMat);

      // Roof
      const roofHeight = 2.5;
      const roof = BABYLON.MeshBuilder.CreateCylinder("roof" + i, {
        height: roofHeight, diameterTop: 0.3, diameterBottom: h.size[0] + 1, tessellation: 4
      }, scene);
      roof.position.y = h.size[1] + roofHeight / 2 + 0.15;
      roof.parent = hg;
      roof.material = h.roof;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;

      // Door
      box(0.7, 1.4, 0.15, new BABYLON.Vector3(0, 0.85, h.size[2] / 2 + 0.08), hg, darkWoodMat);

      // Windows
      const winY = h.size[1] * 0.55;
      box(0.5, 0.5, 0.15, new BABYLON.Vector3(-h.size[0] / 2 - 0.08, winY, 0.5), hg, windowMat);
      box(0.5, 0.5, 0.15, new BABYLON.Vector3(h.size[0] / 2 + 0.08, winY, 0.5), hg, windowMat);
      if (h.size[2] > 3) {
        box(0.5, 0.5, 0.15, new BABYLON.Vector3(0, winY, h.size[2] / 2 + 0.08), hg, windowMat);
      }

      // Chimney
      box(0.5, 1.5, 0.5, new BABYLON.Vector3(h.size[0] / 4, h.size[1] + 1.5, -h.size[2] / 4), hg, stoneMat);

      shadowGen.addShadowCaster(hg);
    });
  }

  // ========== TAVERN ==========
  function buildTavern(shadowGen) {
    const tg = new BABYLON.TransformNode("tavern", floatingGroup);
    tg.position = new BABYLON.Vector3(-10, 0.15, 2);
    tg.rotation.y = 0.1;

    // Larger building
    box(6, 5.5, 5, new BABYLON.Vector3(0, 2.9, 0), tg, woodMat);

    // Thatched roof
    const thatchRoof = BABYLON.MeshBuilder.CreateCylinder("thatchRoof", {
      height: 3.5, diameterTop: 0.5, diameterBottom: 7.5, tessellation: 4
    }, scene);
    thatchRoof.position.y = 7;
    thatchRoof.parent = tg;
    thatchRoof.material = sandMat;
    thatchRoof.rotation.y = Math.PI / 4;
    thatchRoof.castShadow = true;

    // Sign post
    box(0.15, 2, 0.15, new BABYLON.Vector3(3.5, 3, 0), tg, darkWoodMat);
    const sign = box(1.5, 0.8, 0.1, new BABYLON.Vector3(4.5, 3.5, 0), tg, darkWoodMat);
    // Sign text area
    box(1.2, 0.5, 0.12, new BABYLON.Vector3(4.5, 3.5, 0), tg, woodMat);

    // Awning over entrance
    box(4, 0.1, 2, new BABYLON.Vector3(0, 3.5, 3.5), tg, roofMat);
    // Awning supports
    cyl(0.08, 0.08, 3.5, 6, new BABYLON.Vector3(-1.5, 1.75, 4), tg, darkWoodMat);
    cyl(0.08, 0.08, 3.5, 6, new BABYLON.Vector3(1.5, 1.75, 4), tg, darkWoodMat);

    // Windows with warm glow
    box(0.8, 0.8, 0.2, new BABYLON.Vector3(-2, 3, 2.55), tg, windowMat);
    box(0.8, 0.8, 0.2, new BABYLON.Vector3(2, 3, 2.55), tg, windowMat);
    box(0.8, 0.8, 0.2, new BABYLON.Vector3(-2, 3, -2.55), tg, windowMat);
    box(0.8, 0.8, 0.2, new BABYLON.Vector3(2, 3, -2.55), tg, windowMat);

    // Door
    box(1.2, 2.2, 0.15, new BABYLON.Vector3(0, 1.25, 2.58), tg, darkWoodMat);

    // Tavern light (point light)
    const tavernLight = new BABYLON.PointLight("tavernLight", new BABYLON.Vector3(0, 4, 3), tg);

    tavernLight.diffuse = new BABYLON.Color3(1, 0.8, 0.4);
    tavernLight.range = 15;

    shadowGen.addShadowCaster(tg);
  }

  // ========== MILL ==========
  function buildMill(shadowGen) {
    const mg = new BABYLON.TransformNode("mill", floatingGroup);
    mg.position = new BABYLON.Vector3(15, 0.15, -12);
    mg.rotation.y = -0.3;

    // Round mill building
    cyl(3, 3.5, 5, 16, new BABYLON.Vector3(0, 2.7, 0), mg, stoneMat);

    // Roof
    const millRoof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {
      height: 3, diameterTop: 0.3, diameterBottom: 4, tessellation: 16
    }, scene);
    millRoof.position.y = 6.5;
    millRoof.parent = mg;
    millRoof.material = roofGreenMat;
    millRoof.castShadow = true;

    // Door
    box(1, 2, 0.2, new BABYLON.Vector3(0, 1.2, 3.1), mg, darkWoodMat);

    // Windows
    box(0.5, 0.7, 0.2, new BABYLON.Vector3(1.5, 3, 2.5), mg, windowMat);
    box(0.5, 0.7, 0.2, new BABYLON.Vector3(-1.5, 3, 2.5), mg, windowMat);

    // Water wheel
    const wheelGroup = new BABYLON.TransformNode("waterWheel", mg);
    wheelGroup.position = new BABYLON.Vector3(3.5, 1.5, 0);

    // Wheel rim
    const wheelRim = BABYLON.MeshBuilder.CreateTorus("wheelRim", { diameter: 4, thickness: 0.25, tessellation: 16 }, scene);
    wheelRim.position.y = 0;
    wheelRim.parent = wheelGroup;
    wheelRim.material = darkWoodMat;
    wheelRim.castShadow = true;

    // Wheel spokes
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const spoke = box(0.12, 0.12, 1.8, new BABYLON.Vector3(
        Math.cos(angle) * 1.8,
        Math.sin(angle) * 1.8,
        0
      ), wheelGroup, darkWoodMat);
      spoke.rotation.z = angle;

      // Paddle
      const paddle = box(0.8, 0.2, 0.3, new BABYLON.Vector3(
        Math.cos(angle) * 1.9,
        Math.sin(angle) * 1.9,
        0
      ), wheelGroup, woodMat);
      paddle.rotation.z = angle;
    }

    // Animate wheel
    BABYLON.Animation.CreateAndStartAnimation("wheelSpin", wheelGroup, "rotation.z", 30, 120, 0, Math.PI * 2, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);

    // Small water channel to wheel
    const channel = BABYLON.MeshBuilder.CreateBox("channel", { width: 1.5, height: 0.3, depth: 4 }, scene);
    channel.position = new BABYLON.Vector3(3.5, 0.3, 0);
    channel.parent = mg;
    channel.material = stoneMat;

    shadowGen.addShadowCaster(mg);
  }

  // ========== RIVER ==========
  function buildRiver() {
    // River path as a curved series of boxes
    const riverPoints = [];
    for (let t = 0; t <= 1; t += 0.02) {
      const x = -30 + t * 60 + Math.sin(t * 4) * 3;
      const z = -20 + t * 40 + Math.cos(t * 3) * 4;
      const y = 0.2;
      riverPoints.push(new BABYLON.Vector3(x, y, z));
    }

    // Create river segments
    for (let i = 0; i < riverPoints.length - 1; i++) {
      const p1 = riverPoints[i];
      const p2 = riverPoints[i + 1];
      const mid = p1.clone().add(p2).scale(0.5);
      const dir = p2.subtract(p1);
      const len = dir.length();
      const angle = Math.atan2(dir.x, dir.z);

      const riverSeg = BABYLON.MeshBuilder.CreateBox("riverSeg" + i, {
        width: len + 0.3, height: 0.15, depth: 4.5
      }, scene);
      riverSeg.position = mid;
      riverSeg.rotation.y = angle;
      riverSeg.parent = floatingGroup;
      riverSeg.material = riverMat;
      riverSeg.receiveShadow = true;
    }

    // River bank stones
    for (let t = 0; t <= 1; t += 0.05) {
      const x = -30 + t * 60 + Math.sin(t * 4) * 3;
      const z = -20 + t * 40 + Math.cos(t * 3) * 4;

      [-2.5, 2.5].forEach(offset => {
        const stone = BABYLON.MeshBuilder.CreatePolyhedron("bankStone", { size: 0.3 + Math.random() * 0.4, type: 1 }, scene);
        stone.position = new BABYLON.Vector3(
          x + Math.cos(Math.atan2(Math.sin(t * 4), Math.cos(t * 3))) * offset,
          0.25,
          z + Math.sin(Math.atan2(Math.sin(t * 4), Math.cos(t * 3))) * offset
        );
        stone.parent = floatingGroup;
        stone.material = stoneMat;
        stone.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());
      });
    }

    // Water surface under the island edge (waterfall pool area)
    waterMesh = BABYLON.MeshBuilder.CreatePlane("waterPool", { width: 40, height: 30 }, scene);
    waterMesh.position = new BABYLON.Vector3(0, -0.3, 0);
    waterMesh.rotation.x = Math.PI / 2;
    waterMesh.parent = floatingGroup;
    waterMesh.material = riverMat;
  }

  // ========== BRIDGES ==========
  function buildBridges(shadowGen) {
    const bridgePositions = [
      { pos: [-5, 0, 5], rot: 0.4, w: 12 },
      { pos: [5, 0, -5], rot: -0.3, w: 10 },
    ];

    bridgePositions.forEach((b, i) => {
      const bg = new BABYLON.TransformNode("bridge" + i, floatingGroup);
      bg.position = new BABYLON.Vector3(...b.pos);
      bg.rotation.y = b.rot;

      // Deck
      box(2, 0.2, b.w, new BABYLON.Vector3(0, 1, 0), bg, woodMat);

      // Planks detail
      for (let j = -b.w / 2; j < b.w / 2; j += 0.8) {
        box(1.8, 0.05, 0.6, new BABYLON.Vector3(0, 1.12, j), bg, darkWoodMat);
      }

      // Rails
      box(0.1, 1.2, b.w, new BABYLON.Vector3(-0.9, 1.7, 0), bg, darkWoodMat);
      box(0.1, 1.2, b.w, new BABYLON.Vector3(0.9, 1.7, 0), bg, darkWoodMat);

      // Rail posts
      for (let j = -b.w / 2 + 1; j < b.w / 2; j += 2) {
        cyl(0.06, 0.06, 1.3, 6, new BABYLON.Vector3(-0.9, 1.7, j), bg, darkWoodMat);
        cyl(0.06, 0.06, 1.3, 6, new BABYLON.Vector3(0.9, 1.7, j), bg, darkWoodMat);
      }

      // Top rail
      box(0.15, 0.15, b.w, new BABYLON.Vector3(-0.9, 2.35, 0), bg, darkWoodMat);
      box(0.15, 0.15, b.w, new BABYLON.Vector3(0.9, 2.35, 0), bg, darkWoodMat);

      // Arch supports
      const archSegs = 8;
      for (let a = 0; a <= archSegs; a++) {
        const angle = (a / archSegs) * Math.PI;
        const ax = Math.cos(angle) * 3;
        const ay = Math.sin(angle) * 2;
        const post = cyl(0.08, 0.08, 1.2, 6, new BABYLON.Vector3(ax, ay + 0.6, 0), bg, darkWoodMat);
        post.rotation.z = angle + Math.PI / 2;
      }
    });
  }

  // ========== TREES ==========
  function buildTrees(shadowGen) {
    const treePositions = [];

    // Generate tree positions avoiding buildings
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 10 + Math.random() * 15;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;

      // Skip if too close to castle or village center
      if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;
      if (x < -12 && x > -24 && z < 15 && z > -10) continue;

      treePositions.push({ x, z, scale: 0.6 + Math.random() * 0.8 });
    }

    treePositions.forEach((t, i) => {
      const tg = new BABYLON.TransformNode("tree" + i, floatingGroup);
      tg.position = new BABYLON.Vector3(t.x, 0.15, t.z);
      tg.scaling = new BABYLON.Vector3(t.scale, t.scale, t.scale);

      // Trunk
      cyl(0.15, 0.25, 3, 8, new BABYLON.Vector3(0, 1.5, 0), tg, darkWoodMat);

      // Foliage layers
      const layers = 3 + Math.floor(Math.random() * 2);
      for (let j = 0; j < layers; j++) {
        const coneH = 2 - j * 0.3;
        const coneR = 2.2 - j * 0.4;
        cone(coneR, coneH, 8, new BABYLON.Vector3(0, 3 + j * 1.2, 0), tg, j % 2 === 0 ? pineMat : pineDarkMat);
      }

      shadowGen.addShadowCaster(tg);
    });

    // Some deciduous trees (sphere-based)
    for (let i = 0; i < 15; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 12 + Math.random() * 14;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      if (Math.abs(x) < 9 && Math.abs(z) < 9) continue;

      const tg = new BABYLON.TransformNode("decTree" + i, floatingGroup);
      tg.position = new BABYLON.Vector3(x, 0.15, z);
      const sc = 0.5 + Math.random() * 0.6;
      tg.scaling = new BABYLON.Vector3(sc, sc, sc);

      cyl(0.2, 0.3, 3.5, 8, new BABYLON.Vector3(0, 1.75, 0), tg, darkWoodMat);

      const foliageMat = mat([0.2 + Math.random() * 0.15, 0.5 + Math.random() * 0.2, 0.15], { name: "decFoliage" });
      sphere(2, new BABYLON.Vector3(0, 4.5, 0), tg, foliageMat, 10);
      sphere(1.5, new BABYLON.Vector3(0.8, 5, 0.5), tg, foliageMat, 10);
      sphere(1.5, new BABYLON.Vector3(-0.8, 5, -0.5), tg, foliageMat, 10);
    }
  }

  // ========== WATCHTOWER ==========
  function buildWatchtower(shadowGen) {
    const wt = new BABYLON.TransformNode("watchtower", floatingGroup);
    wt.position = new BABYLON.Vector3(22, 0.15, 15);

    // Ruined tower - partial walls
    // Base
    cyl(2, 2.5, 3, 10, new BABYLON.Vector3(0, 1.65, 0), wt, ruinStoneMat);

    // Partial upper wall
    const partialWall = BABYLON.MeshBuilder.CreateCylinder("partialWall", {
      height: 5, diameterTop: 1.8, diameterBottom: 2, tessellation: 10,
      cap: 3
    }, scene);
    partialWall.position.y = 5.5;
    partialWall.parent = wt;
    partialWall.material = ruinStoneMat;
    partialWall.scaling.z = 0.6;
    partialWall.rotation.y = 0.5;

    // Broken stones around base
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const dist = 2 + Math.random() * 2;
      const size = 0.3 + Math.random() * 0.6;
      const rock = BABYLON.MeshBuilder.CreatePolyhedron("wRock" + i, { size, type: 2 }, scene);
      rock.position = new BABYLON.Vector3(
        Math.cos(angle) * dist,
        Math.random() * 0.5,
        Math.sin(angle) * dist
      );
      rock.parent = wt;
      rock.material = ruinStoneMat;
      rock.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());
    }

    // Broken beam
    box(0.2, 0.2, 3, new BABYLON.Vector3(1.5, 4, 0), wt, darkWoodMat);
    const brokenBeam = box(0.2, 0.2, 1.5, new BABYLON.Vector3(2.5, 3.5, 0.5), wt, darkWoodMat);
    brokenBeam.rotation.z = 0.3;

    shadowGen.addShadowCaster(wt);
  }

  // ========== WATERFALLS ==========
  function buildWaterfalls() {
    // Waterfall streams off the edge
    const waterfallLocations = [
      { x: 28, z: 0 }, { x: -28, z: 5 }, { x: 0, z: -28 }, { x: 20, z: 20 }, { x: -20, z: -18 }
    ];

    waterfallLocations.forEach((loc, idx) => {
      const wfGroup = new BABYLON.TransformNode("waterfall" + idx, floatingGroup);
      wfGroup.position = new BABYLON.Vector3(loc.x, 0, loc.z);

      // Water sheet
      const sheet = BABYLON.MeshBuilder.CreatePlane("wfSheet" + idx, { width: 2, height: 10, subdivisions: 10 }, scene);
      sheet.position.y = -5;
      sheet.parent = wfGroup;
      sheet.material = waterWhiteMat;
      sheet.receiveShadow = false;

      // Animate vertices for flow effect
      const positions = sheet.getPositions();
      const originalPositions = positions.slice();
      const anim = new BABYLON.Animation("wfAnim" + idx, "positions", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
      const keys = [];
      for (let t = 0; t <= 60; t += 5) {
        const framePos = originalPositions.slice();
        for (let p = 0; p < framePos.length; p += 3) {
          const yNorm = (framePos[p + 1] + 5) / 10;
          framePos[p] = originalPositions[p] + Math.sin(t * 0.5 + yNorm * 4) * 0.3;
          framePos[p + 2] = originalPositions[p + 2] + Math.cos(t * 0.3 + yNorm * 3) * 0.2;
        }
        keys.push({ frame: t, value: framePos });
      }
      anim.setKeys(keys);
      sheet.animations = [anim];
      scene.beginAnimation(sheet, 0, 60, true);

      // Splash at bottom
      for (let s = 0; s < 5; s++) {
        const splash = sphere(0.3 + Math.random() * 0.3, new BABYLON.Vector3(
          (Math.random() - 0.5) * 1.5,
          -10.5,
          (Math.random() - 0.5) * 1.5
        ), wfGroup, waterWhiteMat, 6);
      }
    });
  }

  // ========== GRASS ==========
  function buildGrass() {
    // Grass patches as small planes
    for (let i = 0; i < 200; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 2 + Math.random() * 25;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;

      if (dist > 27) continue;

      const grass = BABYLON.MeshBuilder.CreatePlane("grass" + i, { width: 0.4, height: 0.8, subdivisions: 1 }, scene);
      grass.position = new BABYLON.Vector3(x, 0.55, z);
      grass.parent = floatingGroup;

      const gMat = mat([0.2 + Math.random() * 0.15, 0.5 + Math.random() * 0.25, 0.1 + Math.random() * 0.1], {
        name: "g" + i, alpha: 0.8, roughness: 1
      });
      grass.material = gMat;
      grass.rotation.y = Math.random() * Math.PI;
      grass.receiveShadow = false;

      // Slight tilt
      grass.rotation.z = (Math.random() - 0.5) * 0.3;
    }

    // Flower dots
    const flowerColors = [[1, 0.3, 0.3], [1, 0.8, 0.2], [1, 0.5, 0.8], [0.3, 0.5, 1], [1, 1, 0.6]];
    for (let i = 0; i < 80; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 5 + Math.random() * 20;
      if (dist > 25) continue;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;

      const fc = flowerColors[i % flowerColors.length];
      const flower = sphere(0.12, new BABYLON.Vector3(x, 0.3, z), floatingGroup, mat(fc, { name: "flower" + i, emissive: [fc[0] * 0.1, fc[1] * 0.1, fc[2] * 0.1] }), 4);
    }

    // Path from castle to village
    for (let i = 0; i < 15; i++) {
      const t = i / 14;
      const px = t * (-16);
      const pz = 8 + t * 3 + Math.sin(t * 3) * 1.5;
      const pathStone = BABYLON.MeshBuilder.CreateCylinder("pathStone" + i, {
        height: 0.08, diameterTop: 0.6 + Math.random() * 0.4, diameterBottom: 0.6 + Math.random() * 0.4, tessellation: 8
      }, scene);
      pathStone.position = new BABYLON.Vector3(px, 0.22, pz);
      pathStone.parent = floatingGroup;
      pathStone.material = pathMat;
      pathStone.receiveShadow = true;
    }

    // Path to river
    for (let i = 0; i < 12; i++) {
      const t = i / 11;
      const px = 5 + t * 10;
      const pz = -3 + t * -9 + Math.sin(t * 2) * 2;
      const pathStone = BABYLON.MeshBuilder.CreateCylinder("pathStoneR" + i, {
        height: 0.08, diameterTop: 0.5 + Math.random() * 0.3, diameterBottom: 0.5 + Math.random() * 0.3, tessellation: 8
      }, scene);
      pathStone.position = new BABYLON.Vector3(px, 0.22, pz);
      pathStone.parent = floatingGroup;
      pathStone.material = pathMat;
      pathStone.receiveShadow = true;
    }
  }

  // ========== ROCKS ==========
  function buildRocks() {
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 5 + Math.random() * 22;
      if (dist > 26) continue;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      const size = 0.3 + Math.random() * 1;

      const rock = BABYLON.MeshBuilder.CreatePolyhedron("rock" + i, { size, type: Math.floor(Math.random() * 4) }, scene);
      rock.position = new BABYLON.Vector3(x, size * 0.3, z);
      rock.parent = floatingGroup;
      rock.material = Math.random() > 0.5 ? stoneMat : darkStoneMat;
      rock.rotation = new BABYLON.Vector3(Math.random() * 0.5, Math.random() * Math.PI, Math.random() * 0.5);
      rock.receiveShadow = true;
      rock.castShadow = true;
    }
  }

  // ========== CLOUDS ==========
  function buildClouds() {
    for (let i = 0; i < 12; i++) {
      const cg = new BABYLON.TransformNode("cloud" + i, scene);
      const angle = (i / 12) * Math.PI * 2;
      const dist = 35 + Math.random() * 20;
      cg.position = new BABYLON.Vector3(
        Math.cos(angle) * dist,
        20 + Math.random() * 15,
        Math.sin(angle) * dist
      );

      const cloudMat = mat([0.95, 0.95, 0.98], { name: "cloud" + i, alpha: 0.6 });

      for (let j = 0; j < 5; j++) {
        const puff = sphere(2 + Math.random() * 3, new BABYLON.Vector3(
          (Math.random() - 0.5) * 6,
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 4
        ), cg, cloudMat, 8);
      }

      // Animate cloud orbit
      const anim = new BABYLON.Animation("cloudOrbit" + i, "position", 20, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
      const keys = [];
      for (let f = 0; f <= 360; f += 30) {
        const a = angle + (f / 360) * Math.PI * 2;
        keys.push({
          frame: f,
          value: new BABYLON.Vector3(
            Math.cos(a) * dist,
            cg.position.y,
            Math.sin(a) * dist
          )
        });
      }
      anim.setKeys(keys);
      cg.animations = [anim];
      scene.beginAnimation(cg, 0, 360, true);
    }
  }

    fireflies.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    fireflies.start();
  }

  // Hide loading screen
  setTimeout(() => {
    const loading = document.getElementById('loading');
    loading.style.opacity = '0';
    setTimeout(() => loading.style.display = 'none', 800);
  }, 1500);

})();
</script>
</body>
</html>
