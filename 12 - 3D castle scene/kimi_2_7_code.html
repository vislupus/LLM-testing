<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Island Diorama</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; background: #1a1815; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; }
        .hud-text { text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
    </style>
</head>
<body class="bg-stone-900 text-white font-sans select-none">

    <!-- UI Overlay -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-3xl font-bold tracking-widest uppercase hud-text text-amber-100">Floating Kingdom</h1>
                <p class="text-sm text-stone-300 hud-text mt-1">Orbit: drag • Zoom: scroll • Pan: right-drag</p>
            </div>
        </div>
        <div class="text-center text-stone-400 text-xs hud-text">
            Procedural tabletop diorama • Babylon.js
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        const createScene = () => {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.08, 0.10, 0.14);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.004;
            scene.fogColor = new BABYLON.Color3(0.12, 0.14, 0.18);

            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2.5, Math.PI / 3, 90, new BABYLON.Vector3(0, 4, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 35;
            camera.upperRadiusLimit = 220;
            camera.wheelPrecision = 35;
            camera.minZ = 0.5;

            // Lighting - soft stylized
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.3, 1, 0.2), scene);
            hemi.intensity = 0.65;
            hemi.diffuse = new BABYLON.Color3(0.95, 0.92, 0.85);
            hemi.groundColor = new BABYLON.Color3(0.25, 0.22, 0.30);

            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.6, -1, -0.4), scene);
            sun.intensity = 1.1;
            sun.diffuse = new BABYLON.Color3(1, 0.95, 0.80);
            sun.position = new BABYLON.Vector3(60, 120, 60);

            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, sun);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;
            shadowGenerator.bias = 0.0005;

            // Glow for stylized look
            const glow = new BABYLON.GlowLayer("glow", scene);
            glow.intensity = 0.35;

            return { scene, camera, shadowGenerator, glow };
        };

        const { scene, camera, shadowGenerator } = createScene();

        // ---------------------- Materials ----------------------
        const matGrass = new BABYLON.StandardMaterial("grass", scene);
        matGrass.diffuseColor = new BABYLON.Color3(0.22, 0.62, 0.22);
        matGrass.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

        const matDirt = new BABYLON.StandardMaterial("dirt", scene);
        matDirt.diffuseColor = new BABYLON.Color3(0.45, 0.32, 0.18);
        matDirt.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

        const matRock = new BABYLON.StandardMaterial("rock", scene);
        matRock.diffuseColor = new BABYLON.Color3(0.38, 0.35, 0.32);
        matRock.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);
        matRock.ambientColor = new BABYLON.Color3(0.15, 0.15, 0.15);

        const matStone = new BABYLON.StandardMaterial("stone", scene);
        matStone.diffuseColor = new BABYLON.Color3(0.65, 0.63, 0.58);
        matStone.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);

        const matRoof = new BABYLON.StandardMaterial("roof", scene);
        matRoof.diffuseColor = new BABYLON.Color3(0.65, 0.22, 0.16);
        matRoof.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

        const matWood = new BABYLON.StandardMaterial("wood", scene);
        matWood.diffuseColor = new BABYLON.Color3(0.48, 0.30, 0.16);
        matWood.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

        const matWoodDark = new BABYLON.StandardMaterial("woodDark", scene);
        matWoodDark.diffuseColor = new BABYLON.Color3(0.32, 0.20, 0.12);

        const matWater = new BABYLON.StandardMaterial("water", scene);
        matWater.diffuseColor = new BABYLON.Color3(0.15, 0.75, 0.85);
        matWater.emissiveColor = new BABYLON.Color3(0.05, 0.25, 0.30);
        matWater.alpha = 0.78;
        matWater.specularColor = new BABYLON.Color3(0.8, 0.9, 1);
        matWater.specularPower = 64;

        const matPine = new BABYLON.StandardMaterial("pine", scene);
        matPine.diffuseColor = new BABYLON.Color3(0.10, 0.38, 0.18);
        matPine.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

        const matTrunk = new BABYLON.StandardMaterial("trunk", scene);
        matTrunk.diffuseColor = new BABYLON.Color3(0.32, 0.22, 0.13);

        const matFlagBlue = new BABYLON.StandardMaterial("flagBlue", scene);
        matFlagBlue.diffuseColor = new BABYLON.Color3(0.15, 0.35, 0.75);
        matFlagBlue.emissiveColor = new BABYLON.Color3(0.05, 0.12, 0.25);

        const matFlagRed = new BABYLON.StandardMaterial("flagRed", scene);
        matFlagRed.diffuseColor = new BABYLON.Color3(0.75, 0.18, 0.15);
        matFlagRed.emissiveColor = new BABYLON.Color3(0.25, 0.06, 0.05);

        const matPath = new BABYLON.StandardMaterial("path", scene);
        matPath.diffuseColor = new BABYLON.Color3(0.55, 0.45, 0.30);

        const matTable = new BABYLON.StandardMaterial("table", scene);
        matTable.diffuseColor = new BABYLON.Color3(0.18, 0.12, 0.08);
        matTable.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

        const matCloth = new BABYLON.StandardMaterial("cloth", scene);
        matCloth.diffuseColor = new BABYLON.Color3(0.85, 0.70, 0.30);

        // ---------------------- Helpers ----------------------
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function addShadow(mesh) {
            if (mesh && mesh.getChildMeshes) {
                mesh.getChildMeshes().forEach(m => { if (m instanceof BABYLON.Mesh) shadowGenerator.addShadowCaster(m); });
            } else if (mesh instanceof BABYLON.Mesh) {
                shadowGenerator.addShadowCaster(mesh);
            }
        }

        function mergeGroup(meshes, name, material) {
            if (meshes.length === 0) return null;
            const merged = BABYLON.Mesh.MergeMeshes(meshes, true, true, undefined, false, true);
            if (merged) {
                merged.name = name;
                merged.material = material;
                merged.receiveShadows = true;
                shadowGenerator.addShadowCaster(merged);
            }
            return merged;
        }

        // ---------------------- Island Base ----------------------
        function createIsland() {
            const islandGroup = new BABYLON.TransformNode("islandGroup", scene);

            // Main grass top - irregular disk
            const topRadius = 42;
            const top = BABYLON.MeshBuilder.CreateCylinder("islandTop", {
                diameter: topRadius * 2,
                height: 4,
                tessellation: 48
            }, scene);
            top.position.y = -2;
            top.material = matGrass;
            top.receiveShadows = true;
            top.parent = islandGroup;

            // Perturb top vertices for irregular shape
            const positions = top.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const z = positions[i + 2];
                const dist = Math.sqrt(x * x + z * z);
                if (dist > topRadius * 0.3) {
                    const angle = Math.atan2(z, x);
                    const noise = Math.sin(angle * 5) * 2 + Math.cos(angle * 7) * 1.5 + Math.sin(angle * 11) * 0.8;
                    const factor = 1 + noise / topRadius;
                    positions[i] *= factor;
                    positions[i + 2] *= factor;
                }
                positions[i + 1] += rand(-0.4, 0.4);
            }
            top.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);

            // Rocky underside - main mass
            const underside = BABYLON.MeshBuilder.CreateSphere("underside", { diameter: 78, segments: 32 }, scene);
            underside.position.y = -22;
            underside.scaling.y = 0.55;
            underside.material = matDirt;
            underside.parent = islandGroup;
            underside.receiveShadows = true;
            shadowGenerator.addShadowCaster(underside);

            // Rocky cliffs around edge
            const cliffCount = 35;
            for (let i = 0; i < cliffCount; i++) {
                const angle = (i / cliffCount) * Math.PI * 2 + rand(-0.15, 0.15);
                const r = topRadius * rand(0.82, 1.05);
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const rock = BABYLON.MeshBuilder.CreatePolyhedron("rock", { type: 2, size: rand(3, 7) }, scene);
                rock.position.set(x, rand(-6, -14), z);
                rock.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
                rock.scaling.set(rand(0.8, 1.4), rand(1.2, 2.2), rand(0.8, 1.4));
                rock.material = matRock;
                rock.parent = islandGroup;
                shadowGenerator.addShadowCaster(rock);
            }

            // Scattered surface rocks
            for (let i = 0; i < 20; i++) {
                const angle = rand(0, Math.PI * 2);
                const r = rand(8, topRadius - 4);
                const rock = BABYLON.MeshBuilder.CreatePolyhedron("srock", { type: 1, size: rand(0.4, 1.2) }, scene);
                rock.position.set(Math.cos(angle) * r, 0.4, Math.sin(angle) * r);
                rock.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
                rock.material = matRock;
                rock.parent = islandGroup;
                shadowGenerator.addShadowCaster(rock);
            }

            // Display tabletop base
            const table = BABYLON.MeshBuilder.CreateCylinder("table", { diameter: 160, height: 4, tessellation: 64 }, scene);
            table.position.y = -48;
            table.material = matTable;
            table.receiveShadows = true;
            table.parent = islandGroup;

            return islandGroup;
        }

        // ---------------------- Castle ----------------------
        function createCastle() {
            const group = new BABYLON.TransformNode("castle", scene);
            group.position.set(0, 0, 0);

            const castleMeshes = [];

            // Central keep
            const keep = BABYLON.MeshBuilder.CreateBox("keep", { width: 10, height: 14, depth: 10 }, scene);
            keep.position.y = 7;
            keep.material = matStone;
            keep.parent = group;
            castleMeshes.push(keep);

            // Keep roof
            const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", { diameterTop: 0, diameterBottom: 12, height: 5, tessellation: 4 }, scene);
            keepRoof.position.y = 16.5;
            keepRoof.rotation.y = Math.PI / 4;
            keepRoof.material = matRoof;
            keepRoof.parent = group;
            castleMeshes.push(keepRoof);

            // Corner towers
            const towerOffset = 9;
            const towerPositions = [
                [towerOffset, towerOffset], [towerOffset, -towerOffset],
                [-towerOffset, towerOffset], [-towerOffset, -towerOffset]
            ];
            towerPositions.forEach((pos, idx) => {
                const tx = pos[0], tz = pos[1];
                const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + idx, { diameter: 4, height: 16, tessellation: 16 }, scene);
                tower.position.set(tx, 8, tz);
                tower.material = matStone;
                tower.parent = group;
                castleMeshes.push(tower);

                const tRoof = BABYLON.MeshBuilder.CreateCylinder("tRoof" + idx, { diameterTop: 0, diameterBottom: 5, height: 5, tessellation: 16 }, scene);
                tRoof.position.set(tx, 18.5, tz);
                tRoof.material = matRoof;
                tRoof.parent = group;
                castleMeshes.push(tRoof);

                // Flag
                const pole = BABYLON.MeshBuilder.CreateCylinder("pole" + idx, { diameter: 0.15, height: 5 }, scene);
                pole.position.set(tx, 22, tz);
                pole.material = matWoodDark;
                pole.parent = group;
                castleMeshes.push(pole);

                const flag = BABYLON.MeshBuilder.CreateBox("flag" + idx, { width: 2.2, height: 1.2, depth: 0.1 }, scene);
                flag.position.set(tx + 1.1, 23.5, tz);
                flag.material = idx % 2 === 0 ? matFlagBlue : matFlagRed;
                flag.parent = group;
                castleMeshes.push(flag);
            });

            // Walls
            const wallThickness = 1.5;
            const wallHeight = 8;
            const wallPositions = [
                { x: 0, z: towerOffset, w: 16, d: wallThickness },
                { x: 0, z: -towerOffset, w: 16, d: wallThickness },
                { x: towerOffset, z: 0, w: wallThickness, d: 16 },
                { x: -towerOffset, z: 0, w: wallThickness, d: 16 }
            ];
            wallPositions.forEach((w, idx) => {
                const wall = BABYLON.MeshBuilder.CreateBox("wall" + idx, { width: w.w, height: wallHeight, depth: w.d }, scene);
                wall.position.set(w.x, wallHeight / 2, w.z);
                wall.material = matStone;
                wall.parent = group;
                castleMeshes.push(wall);

                // Crenellations
                for (let c = -w.w / 2 + 1.2; c < w.w / 2; c += 2.4) {
                    const cren = BABYLON.MeshBuilder.CreateBox("cren", { width: 0.8, height: 1.2, depth: w.d + 0.4 }, scene);
                    cren.position.set(w.x + c, wallHeight + 0.6, w.z);
                    cren.material = matStone;
                    cren.parent = group;
                    castleMeshes.push(cren);
                }
                for (let c = -w.d / 2 + 1.2; c < w.d / 2; c += 2.4) {
                    const cren = BABYLON.MeshBuilder.CreateBox("cren", { width: w.w + 0.4, height: 1.2, depth: 0.8 }, scene);
                    cren.position.set(w.x, wallHeight + 0.6, w.z + c);
                    cren.material = matStone;
                    cren.parent = group;
                    castleMeshes.push(cren);
                }
            });

            // Gatehouse
            const gate = BABYLON.MeshBuilder.CreateBox("gate", { width: 6, height: 9, depth: 5 }, scene);
            gate.position.set(0, 4.5, towerOffset + 2.5);
            gate.material = matStone;
            gate.parent = group;
            castleMeshes.push(gate);

            const arch = BABYLON.MeshBuilder.CreateTorus("arch", { diameter: 3.5, thickness: 0.6, tessellation: 16 }, scene);
            arch.position.set(0, 3, towerOffset + 5.1);
            arch.scaling.z = 0.5;
            arch.material = matStone;
            arch.parent = group;
            castleMeshes.push(arch);

            // Gate doors
            const doorL = BABYLON.MeshBuilder.CreateBox("doorL", { width: 1.4, height: 3, depth: 0.3 }, scene);
            doorL.position.set(-0.8, 1.5, towerOffset + 5.2);
            doorL.material = matWoodDark;
            doorL.parent = group;
            castleMeshes.push(doorL);

            const doorR = BABYLON.MeshBuilder.CreateBox("doorR", { width: 1.4, height: 3, depth: 0.3 }, scene);
            doorR.position.set(0.8, 1.5, towerOffset + 5.2);
            doorR.material = matWoodDark;
            doorR.parent = group;
            castleMeshes.push(doorR);

            // Windows
            [[3, 9, 3], [-3, 9, 3], [3, 9, -3], [-3, 9, -3], [0, 10, 5]].forEach((p, i) => {
                const win = BABYLON.MeshBuilder.CreateBox("win" + i, { width: 1, height: 1.6, depth: 0.3 }, scene);
                win.position.set(p[0], p[1], p[2]);
                win.material = matWoodDark;
                win.parent = group;
                castleMeshes.push(win);
            });

            castleMeshes.forEach(m => { m.castShadow = true; m.receiveShadows = true; });
            return group;
        }

        // ---------------------- Houses ----------------------
        function createHouse(name, width, depth, height, pos, rotation = 0, isTavern = false) {
            const group = new BABYLON.TransformNode(name, scene);
            group.position = pos;
            group.rotation.y = rotation;

            const meshes = [];

            const body = BABYLON.MeshBuilder.CreateBox(name + "body", { width, height, depth }, scene);
            body.position.y = height / 2;
            body.material = isTavern ? matWood : matWood;
            body.parent = group;
            meshes.push(body);

            // Timber framing stripes
            for (let i = -width / 2 + 0.4; i < width / 2; i += width / 3) {
                const beam = BABYLON.MeshBuilder.CreateBox(name + "beam", { width: 0.25, height: height + 0.1, depth: depth + 0.15 }, scene);
                beam.position.set(i, height / 2, 0);
                beam.material = matWoodDark;
                beam.parent = group;
                meshes.push(beam);
            }

            // Roof
            const roofHeight = isTavern ? 4 : 3;
            const roof = BABYLON.MeshBuilder.CreateCylinder(name + "roof", {
                diameterTop: 0,
                diameterBottom: Math.max(width, depth) * 1.5,
                height: roofHeight,
                tessellation: 3
            }, scene);
            roof.position.y = height + roofHeight / 2 - 0.2;
            roof.rotation.z = Math.PI / 2;
            roof.rotation.y = Math.PI / 2;
            roof.scaling.z = 0.6;
            roof.material = matRoof;
            roof.parent = group;
            meshes.push(roof);

            // Door
            const door = BABYLON.MeshBuilder.CreateBox(name + "door", { width: 1.2, height: 2.2, depth: 0.2 }, scene);
            door.position.set(0, 1.1, depth / 2 + 0.1);
            door.material = matWoodDark;
            door.parent = group;
            meshes.push(door);

            // Windows
            const winX = width / 2 + 0.1;
            [-winX, winX].forEach(x => {
                const win = BABYLON.MeshBuilder.CreateBox(name + "win", { width: 0.15, height: 1.2, depth: 0.8 }, scene);
                win.position.set(x, height / 2 + 0.5, 0);
                win.material = matWoodDark;
                win.parent = group;
                meshes.push(win);
            });

            if (isTavern) {
                // Sign
                const signPole = BABYLON.MeshBuilder.CreateBox(name + "sp", { width: 0.15, height: 1.5, depth: 0.15 }, scene);
                signPole.position.set(width / 2 + 0.5, 3, depth / 2 - 0.5);
                signPole.material = matWoodDark;
                signPole.parent = group;
                meshes.push(signPole);

                const sign = BABYLON.MeshBuilder.CreateBox(name + "sign", { width: 1.8, height: 1.1, depth: 0.1 }, scene);
                sign.position.set(width / 2 + 0.5, 3.5, depth / 2 - 0.5);
                sign.material = matCloth;
                sign.parent = group;
                meshes.push(sign);

                // Chimney
                const chim = BABYLON.MeshBuilder.CreateBox(name + "chim", { width: 1, height: 3, depth: 1 }, scene);
                chim.position.set(-width / 3, height + 1.5, -depth / 4);
                chim.material = matStone;
                chim.parent = group;
                meshes.push(chim);
            }

            meshes.forEach(m => { m.castShadow = true; m.receiveShadows = true; });
            return group;
        }

        // ---------------------- Pine Tree ----------------------
        function createPineTree(pos, scale = 1) {
            const group = new BABYLON.TransformNode("pine", scene);
            group.position = pos;
            group.scaling.scaleInPlace(scale);

            const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { diameter: 0.6, height: 4, tessellation: 8 }, scene);
            trunk.position.y = 2;
            trunk.material = matTrunk;
            trunk.parent = group;
            trunk.castShadow = true;
            trunk.receiveShadows = true;

            const levels = 4;
            for (let i = 0; i < levels; i++) {
                const cone = BABYLON.MeshBuilder.CreateCylinder("foliage", {
                    diameterTop: 0,
                    diameterBottom: 3.5 - i * 0.5,
                    height: 2.5,
                    tessellation: 10
                }, scene);
                cone.position.y = 4 + i * 1.6;
                cone.material = matPine;
                cone.parent = group;
                cone.castShadow = true;
                cone.receiveShadows = true;
            }

            return group;
        }

        // ---------------------- Market Stall ----------------------
        function createStall(pos, rot) {
            const group = new BABYLON.TransformNode("stall", scene);
            group.position = pos;
            group.rotation.y = rot;

            const table = BABYLON.MeshBuilder.CreateBox("stallTable", { width: 3, height: 1, depth: 1.5 }, scene);
            table.position.y = 0.5;
            table.material = matWood;
            table.parent = group;
            table.castShadow = true;

            const leg1 = BABYLON.MeshBuilder.CreateBox("leg", { width: 0.2, height: 0.8, depth: 0.2 }, scene);
            leg1.position.set(-1.2, 0.4, 0.5); leg1.material = matWoodDark; leg1.parent = group;
            const leg2 = leg1.clone("leg2"); leg2.position.set(1.2, 0.4, 0.5); leg2.parent = group;
            const leg3 = leg1.clone("leg3"); leg3.position.set(-1.2, 0.4, -0.5); leg3.parent = group;
            const leg4 = leg1.clone("leg4"); leg4.position.set(1.2, 0.4, -0.5); leg4.parent = group;

            const roof = BABYLON.MeshBuilder.CreateBox("stallRoof", { width: 3.6, height: 0.15, depth: 2.2 }, scene);
            roof.position.y = 2.6;
            roof.material = matCloth;
            roof.parent = group;
            roof.castShadow = true;

            const post1 = BABYLON.MeshBuilder.CreateBox("post", { width: 0.15, height: 2.2, depth: 0.15 }, scene);
            post1.position.set(-1.5, 1.8, 0.8); post1.material = matWoodDark; post1.parent = group;
            const post2 = post1.clone("post2"); post2.position.set(1.5, 1.8, 0.8); post2.parent = group;
            const post3 = post1.clone("post3"); post3.position.set(-1.5, 1.8, -0.8); post3.parent = group;
            const post4 = post1.clone("post4"); post4.position.set(1.5, 1.8, -0.8); post4.parent = group;

            // Goods
            const goods = BABYLON.MeshBuilder.CreateBox("goods", { width: 2, height: 0.4, depth: 1 }, scene);
            goods.position.set(0, 1.2, 0);
            goods.material = new BABYLON.StandardMaterial("goodsMat", scene);
            goods.material.diffuseColor = new BABYLON.Color3(rand(0.5, 1), rand(0.3, 0.9), rand(0.2, 0.6));
            goods.parent = group;
            goods.castShadow = true;

            return group;
        }

        // ---------------------- Watermill ----------------------
        function createMill(pos, rot) {
            const group = new BABYLON.TransformNode("mill", scene);
            group.position = pos;
            group.rotation.y = rot;

            const house = createHouse("millHouse", 5, 5, 4.5, BABYLON.Vector3.Zero(), 0);
            house.parent = group;

            // Water wheel
            const wheelGroup = new BABYLON.TransformNode("wheel", scene);
            wheelGroup.parent = group;
            wheelGroup.position.set(-3.2, 2.2, 0);
            wheelGroup.rotation.y = Math.PI / 2;

            const rim = BABYLON.MeshBuilder.CreateTorus("wheelRim", { diameter: 4.5, thickness: 0.2, tessellation: 16 }, scene);
            rim.material = matWoodDark;
            rim.parent = wheelGroup;
            rim.castShadow = true;

            const hub = BABYLON.MeshBuilder.CreateCylinder("wheelHub", { diameter: 0.8, height: 0.6 }, scene);
            hub.rotation.x = Math.PI / 2;
            hub.material = matWoodDark;
            hub.parent = wheelGroup;

            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const spoke = BABYLON.MeshBuilder.CreateBox("spoke", { width: 0.15, height: 2.2, depth: 0.15 }, scene);
                spoke.position.set(Math.cos(angle) * 1.1, Math.sin(angle) * 1.1, 0);
                spoke.rotation.z = angle;
                spoke.material = matWoodDark;
                spoke.parent = wheelGroup;

                const paddle = BABYLON.MeshBuilder.CreateBox("paddle", { width: 0.8, height: 0.05, depth: 0.35 }, scene);
                paddle.position.set(Math.cos(angle) * 2.2, Math.sin(angle) * 2.2, 0.15);
                paddle.rotation.z = angle;
                paddle.material = matWood;
                paddle.parent = wheelGroup;
            }

            // Animate wheel
            scene.registerBeforeRender(() => {
                wheelGroup.rotation.z += 0.015;
            });

            return group;
        }

        // ---------------------- Bridge ----------------------
        function createBridge(start, end, width = 3) {
            const mid = BABYLON.Vector3.Center(start, end);
            const len = BABYLON.Vector3.Distance(start, end);
            const dir = end.subtract(start).normalize();
            const angle = Math.atan2(dir.x, dir.z);

            const group = new BABYLON.TransformNode("bridge", scene);
            group.position = mid;
            group.rotation.y = angle;

            const planks = 12;
            for (let i = 0; i < planks; i++) {
                const t = (i / (planks - 1)) - 0.5;
                const plank = BABYLON.MeshBuilder.CreateBox("plank", { width: width, height: 0.2, depth: len / planks * 0.85 }, scene);
                plank.position.z = t * len;
                plank.position.y = 0.2 + Math.cos(t * Math.PI) * 0.4;
                plank.material = matWood;
                plank.parent = group;
                plank.castShadow = true;
                plank.receiveShadows = true;
            }

            // Railings
            [-width / 2 + 0.2, width / 2 - 0.2].forEach(x => {
                const rail = BABYLON.MeshBuilder.CreateBox("rail", { width: 0.15, height: 0.9, depth: len }, scene);
                rail.position.set(x, 0.8, 0);
                rail.material = matWoodDark;
                rail.parent = group;
                rail.castShadow = true;
            });

            return group;
        }

        // ---------------------- Ruined Watchtower ----------------------
        function createWatchtower(pos) {
            const group = new BABYLON.TransformNode("watchtower", scene);
            group.position = pos;

            // Broken cylinder made of stacked stone rings
            for (let i = 0; i < 5; i++) {
                const ring = BABYLON.MeshBuilder.CreateTorus("ring" + i, { diameter: 5.5, thickness: 0.8, tessellation: 24 }, scene);
                ring.position.y = 0.8 + i * 1.3;
                ring.rotation.x = Math.PI / 2;
                ring.material = matStone;
                ring.parent = group;
                ring.castShadow = true;

                // Remove chunks by scaling sections? We'll just leave some gaps by rotating rings
                ring.rotation.z = i * 0.4;
            }

            // Rubble
            for (let i = 0; i < 12; i++) {
                const r = BABYLON.MeshBuilder.CreatePolyhedron("rubble", { type: 1, size: rand(0.4, 0.9) }, scene);
                const a = rand(0, Math.PI * 2);
                const d = rand(2, 5);
                r.position.set(Math.cos(a) * d, 0.4, Math.sin(a) * d);
                r.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
                r.material = matStone;
                r.parent = group;
                r.castShadow = true;
            }

            // Wooden platform remains
            const beam = BABYLON.MeshBuilder.CreateBox("beam", { width: 0.4, height: 5, depth: 0.4 }, scene);
            beam.position.set(0, 2.5, 0);
            beam.rotation.z = 0.15;
            beam.material = matWoodDark;
            beam.parent = group;
            beam.castShadow = true;

            return group;
        }

        // ---------------------- River & Waterfalls ----------------------
        let riverMeshes = [];
        function createRiver() {
            const riverGroup = new BABYLON.TransformNode("river", scene);

            // Main river channel - a curved path of flattened boxes
            const riverPoints = [
                new BABYLON.Vector3(-38, 0.05, 8),
                new BABYLON.Vector3(-20, 0.05, 5),
                new BABYLON.Vector3(-5, 0.05, 6),
                new BABYLON.Vector3(8, 0.05, -2),
                new BABYLON.Vector3(22, 0.05, -5),
                new BABYLON.Vector3(38, 0.05, -6)
            ];

            for (let i = 0; i < riverPoints.length - 1; i++) {
                const p1 = riverPoints[i];
                const p2 = riverPoints[i + 1];
                const mid = BABYLON.Vector3.Center(p1, p2);
                const len = BABYLON.Vector3.Distance(p1, p2);
                const dir = p2.subtract(p1).normalize();
                const angle = Math.atan2(dir.x, dir.z);

                const seg = BABYLON.MeshBuilder.CreateBox("riverSeg", { width: 7, height: 0.15, depth: len + 0.5 }, scene);
                seg.position = mid;
                seg.rotation.y = angle;
                seg.material = matWater;
                seg.parent = riverGroup;
                riverMeshes.push(seg);
            }

            // Bridges
            createBridge(new BABYLON.Vector3(-10, 0.7, 5.5), new BABYLON.Vector3(-10, 0.7, 9.5)).parent = riverGroup;
            createBridge(new BABYLON.Vector3(14, 0.7, -4), new BABYLON.Vector3(14, 0.7, -8)).parent = riverGroup;

            // Waterfalls at edges
            [-38, 38].forEach((x, idx) => {
                const z = idx === 0 ? 8 : -6;
                const fall = BABYLON.MeshBuilder.CreateBox("fall", { width: 6, height: 18, depth: 0.3 }, scene);
                fall.position.set(x, -9, z);
                fall.rotation.y = idx === 0 ? Math.PI / 2 : -Math.PI / 2;
                fall.material = matWater;
                fall.parent = riverGroup;
                riverMeshes.push(fall);

                // Mist particles
                const mist = new BABYLON.ParticleSystem("mist", 200, scene);
                mist.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                mist.emitter = new BABYLON.Vector3(x * 0.95, -2, z);
                mist.minEmitBox = new BABYLON.Vector3(-2, 0, -2);
                mist.maxEmitBox = new BABYLON.Vector3(2, 0, 2);
                mist.color1 = new BABYLON.Color4(0.6, 0.9, 1, 0.4);
                mist.color2 = new BABYLON.Color4(0.8, 1, 1, 0.2);
                mist.colorDead = new BABYLON.Color4(1, 1, 1, 0);
                mist.minSize = 0.5;
                mist.maxSize = 2;
                mist.minLifeTime = 0.8;
                mist.maxLifeTime = 2.2;
                mist.emitRate = 40;
                mist.minEmitPower = 0.5;
                mist.maxEmitPower = 2;
                mist.direction1 = new BABYLON.Vector3(0, 1, 0);
                mist.direction2 = new BABYLON.Vector3(0, 1.5, 0);
                mist.gravity = new BABYLON.Vector3(0, -0.5, 0);
                mist.updateSpeed = 0.02;
                mist.start();
            });

            return riverGroup;
        }

        // ---------------------- Grass Patches ----------------------
        function scatterGrass(count) {
            const grassMat = new BABYLON.StandardMaterial("grassBladeMat", scene);
            grassMat.diffuseColor = new BABYLON.Color3(0.22, 0.62, 0.18);
            grassMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

            const bladeMeshes = [];
            for (let i = 0; i < count; i++) {
                const angle = rand(0, Math.PI * 2);
                const r = rand(12, 36);
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;

                // Avoid river channel roughly
                if (x > -40 && x < 40 && z > -10 && z < 12) {
                    if (Math.abs(z - 6 + x * 0.08) < 5) continue;
                }

                const h = rand(0.35, 0.75);
                const blade = BABYLON.MeshBuilder.CreateBox("grass" + i, { width: 0.08, height: h, depth: 0.08 }, scene);
                blade.position.set(x, h / 2, z);
                blade.rotation.x = rand(-0.2, 0.2);
                blade.rotation.z = rand(-0.2, 0.2);
                blade.material = grassMat;
                blade.receiveShadows = true;
                bladeMeshes.push(blade);
            }

            // Merge into chunks for performance
            const chunkSize = 100;
            for (let i = 0; i < bladeMeshes.length; i += chunkSize) {
                const chunk = bladeMeshes.slice(i, i + chunkSize);
                if (chunk.length > 0) {
                    const merged = BABYLON.Mesh.MergeMeshes(chunk, true, true, undefined, false, false);
                    if (merged) {
                        merged.name = "grassChunk" + i;
                        merged.material = grassMat;
                        merged.receiveShadows = true;
                    }
                }
            }
        }

        // ---------------------- Paths ----------------------
        function createPaths() {
            const group = new BABYLON.TransformNode("paths", scene);
            const pathPoints = [
                new BABYLON.Vector3(0, 0.02, 14),
                new BABYLON.Vector3(0, 0.02, 25),
                new BABYLON.Vector3(-8, 0.02, 28),
                new BABYLON.Vector3(-18, 0.02, 22),
                new BABYLON.Vector3(-14, 0.02, 14),
                new BABYLON.Vector3(0, 0.02, 14),
                new BABYLON.Vector3(12, 0.02, 18),
                new BABYLON.Vector3(22, 0.02, 16),
                new BABYLON.Vector3(18, 0.02, 8),
                new BABYLON.Vector3(12, 0.02, 18)
            ];

            for (let i = 0; i < pathPoints.length - 1; i++) {
                const p1 = pathPoints[i];
                const p2 = pathPoints[i + 1];
                const mid = BABYLON.Vector3.Center(p1, p2);
                const len = BABYLON.Vector3.Distance(p1, p2);
                const dir = p2.subtract(p1).normalize();
                const angle = Math.atan2(dir.x, dir.z);

                const seg = BABYLON.MeshBuilder.CreateBox("pathSeg", { width: 2.2, height: 0.05, depth: len + 0.2 }, scene);
                seg.position = mid;
                seg.rotation.y = angle;
                seg.material = matPath;
                seg.parent = group;
                seg.receiveShadows = true;
            }
            return group;
        }

        // ---------------------- Build Scene ----------------------
        createIsland();
        createCastle();
        createRiver();
        createPaths();
        scatterGrass(1500);

        // Village
        createHouse("house1", 4, 4.5, 3.5, new BABYLON.Vector3(-18, 0, 20), 0.4);
        createHouse("house2", 3.5, 4, 3, new BABYLON.Vector3(-24, 0, 16), -0.3);
        createHouse("house3", 4.2, 4.2, 3.8, new BABYLON.Vector3(-12, 0, 26), 0.8);
        createHouse("house4", 3.8, 4.5, 3.2, new BABYLON.Vector3(18, 0, 18), -0.5);
        createHouse("tavern", 6, 5.5, 4.5, new BABYLON.Vector3(22, 0, 12), -0.8, true);

        // Market
        createStall(new BABYLON.Vector3(-6, 0, 24), 0.2);
        createStall(new BABYLON.Vector3(-3, 0, 26), -0.4);
        createStall(new BABYLON.Vector3(2, 0, 25), 0.5);

        // Mill
        createMill(new BABYLON.Vector3(28, 0, -5), Math.PI / 2);

        // Watchtower
        createWatchtower(new BABYLON.Vector3(-30, 0, -18));

        // Trees - clustered
        for (let i = 0; i < 35; i++) {
            const angle = rand(0, Math.PI * 2);
            const r = rand(14, 36);
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;

            // Avoid river and village/castle areas
            if (Math.abs(x) < 16 && Math.abs(z) < 16) continue;
            if (x > -40 && x < 40 && z > -10 && z < 12 && Math.abs(z - 6 + x * 0.08) < 6) continue;

            createPineTree(new BABYLON.Vector3(x, 0, z), rand(0.8, 1.4));
        }

        // Extra trees near watchtower
        for (let i = 0; i < 5; i++) {
            createPineTree(new BABYLON.Vector3(-30 + rand(-6, 6), 0, -24 + rand(-5, 5)), rand(0.9, 1.3));
        }

        // Ambient floating particles (pollen/fireflies)
        const ambient = new BABYLON.ParticleSystem("ambient", 300, scene);
        ambient.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
        ambient.emitter = new BABYLON.Vector3(0, 8, 0);
        ambient.minEmitBox = new BABYLON.Vector3(-40, 0, -40);
        ambient.maxEmitBox = new BABYLON.Vector3(40, 25, 40);
        ambient.color1 = new BABYLON.Color4(1, 0.95, 0.7, 0.3);
        ambient.color2 = new BABYLON.Color4(0.8, 1, 0.9, 0.2);
        ambient.colorDead = new BABYLON.Color4(1, 1, 1, 0);
        ambient.minSize = 0.05;
        ambient.maxSize = 0.15;
        ambient.minLifeTime = 2;
        ambient.maxLifeTime = 5;
        ambient.emitRate = 30;
        ambient.minEmitPower = 0.1;
        ambient.maxEmitPower = 0.4;
        ambient.gravity = new BABYLON.Vector3(0, 0.05, 0);
        ambient.updateSpeed = 0.02;
        ambient.start();

        // Water shimmer animation
        scene.registerBeforeRender(() => {
            riverMeshes.forEach((m, i) => {
                m.position.y = 0.05 + Math.sin(performance.now() * 0.002 + i * 1.5) * 0.03;
            });
        });

        // Initial camera target
        camera.target = new BABYLON.Vector3(0, 4, 0);

        window.addEventListener("resize", () => engine.resize());
        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
