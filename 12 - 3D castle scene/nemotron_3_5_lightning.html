<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Floating Island Diorama</title>
  <style>
    html,body { margin:0; padding:0; overflow:hidden; height:100%; background:#0a0a15; font-family:sans-serif; }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    // --- Setup ---
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const engine = new BABYLON.Engine(canvas, true, { antialias: true, preserveDrawingBuffer: false, stencil: false });
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.012, 0.012, 0.03, 1);

    // --- Camera (elevated, slightly orbiting) ---
    const camera = new BABYLON.ArcRotateCamera('cam', -0.6, 0.85, 28, BABYLON.Vector3.Zero());
    camera.upperBetaLimit = Math.PI / 2.1;
    camera.lowerBetaLimit = Math.PI / 3.2;
    camera.panningAxis = new BABYLON.Vector3(0, 1, 0);
    camera.attachControl(canvas, true);
    camera.speed = 0.08;

    // --- Lights (soft, tabletop-friendly) ---
    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector2(0, 1), scene);
    hemi.groundColor = new BABYLON.Color3(0.22, 0.38, 0.22);
    hemi.intensity = 0.7;

    const dir = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(1, -0.5, 0.5), scene);
    dir.intensity = 0.9;
    dir.shadowRadius = 4;
    dir.shadowSoftness = 0.7;
    dir.shadowNormalBias = 0.02;
    const shadowGen = new BABYLON.ShadowGenerator(1024, dir);
    shadowGen.useContactHardeningLightShadow = true;
    shadowGen.bias = 0.005;

    // --- Helper: stylized material ---
    const makeMat = (diffuse, ambient, specular, roughness, metal) => {
      const m = new BABYLON.StandardMaterial('', scene);
      m.diffuseColor = diffuse;
      m.ambientColor = ambient;
      m.specularColor = specular;
      m.roughness = roughness;
      m.metal = metal;
      return m;
    };

    // --- Floating Island ---
    // Base plateau
    const islandBase = BABYLON.MeshBuilder.CreateDisk('islandBase', { radius: 12, innerRadius: 0, tessellation: 32 }, scene);
    islandBase.position.y = 2.5;
    islandBase.material = makeMat(new BABYLON.Color3(0.52, 0.44, 0.35), new BABYLON.Color3(0.4, 0.34, 0.26), BABYLON.Color3.Black(), 0.7, 0.1);
    islandBase.rotation.x = -Math.PI / 2;

    // Grass ring (slightly larger, raised)
    const grassRing = BABYLON.MeshBuilder.CreateDisk('grassRing', { radius: 13, innerRadius: 10, tessellation: 32 }, scene);
    grassRing.position.y = 2.55;
    grassRing.material = makeMat(new BABYLON.Color3(0.34, 0.68, 0.22), new BABYLON.Color3(0.28, 0.55, 0.18), BABYLON.Color3.Black(), 0.9, 0.0);
    grassRing.rotation.x = -Math.PI / 2;

    // Rocky outcrops on island
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      const h = 1.5 + Math.random() * 2;
      const rock = BABYLON.MeshBuilder.CreateBox(`rock${i}`, { size: 1.8 + Math.random() * 1.2 }, scene);
      rock.position.set(Math.cos(angle) * (9 + Math.random() * 2), 2.5 + h / 2, Math.sin(angle) * (9 + Math.random() * 2));
      rock.material = makeMat(new BABYLON.Color3(0.45, 0.45, 0.48), new BABYLON.Color3(0.35, 0.35, 0.38), BABYLON.Color3.Black(), 0.5, 0.2);
      rock.scaling.y = 0.6 + Math.random() * 0.4;
    }

    // Cliff faces (steep rocks around island edge)
    const cliffMat = makeMat(new BABYLON.Color3(0.38, 0.38, 0.4), new BABYLON.Color3(0.28, 0.28, 0.32), BABYLON.Color3.Black(), 0.6, 0.15);
    const cliffs = [];
    const cliffPositions = [
      { x: 14, z: 0, rx: 0, rz: 0 },
      { x: 8, z: 12, rx: -0.4, rz: -0.1 },
      { x: 8, z: -12, rx: 0.4, rz: 0.1 },
      { x: 16, z: 5, rx: -0.2, rz: 0.05 },
      { x: 16, z: -5, rx: 0.2, rz: -0.05 }
    ];
    cliffPositions.forEach(p => {
      const c = BABYLON.MeshBuilder.CreateBox(`cliff_${cliffs.length}`, { size: 2.5 + Math.random() * 1.5, height: 6 + Math.random() * 4 }, scene);
      c.position.set(p.x, 3 + (p.height||0)/2, p.z);
      c.rotation.x = p.rx || 0;
      c.rotation.z = p.rz || 0;
      c.material = cliffMat;
      cliffs.push(c);
    });

    // --- Medieval Castle (center) ---
    const castlePos = new BABYLON.Vector3(0, 0, 0);
    // Keep base
    const keep = BABYLON.MeshBuilder.CreateBox('keep', { width: 9, height: 12, depth: 9 }, scene);
    keep.position.copyFrom(castlePos);
    keep.position.y = 6;
    keep.material = makeMat(new BABYLON.Color3(0.55, 0.55, 0.58), new BABYLON.Color3(0.44, 0.44, 0.47), BABYLON.Color3.Black(), 0.6, 0.15);
    // Towers
    [{-1, -1}, {1, -1}, {-1, 1}, {1, 1}].forEach(([ox, oz]) => {
      const tower = BABYLON.MeshBuilder.CreateCylinder('tower', { diameter: 5, height: 14, tessellation: 8 }, scene);
      tower.position.set(ox * 3.5, 7, oz * 3.5);
      tower.material = makeMat(new BABYLON.Color3(0.58, 0.58, 0.6), new BABYLON.Color3(0.46, 0.46, 0.49), BABYLON.Color3.Black(), 0.55, 0.12);
    });
    // Wall segments
    ['north', 'south', 'east', 'west'].forEach((side, i) => {
      const w = BABYLON.MeshBuilder.CreateBox(`wall_${side}`, { width: 11, height: 6, depth: 1 }, scene);
      const pos = { north: { x: 0, z: -4 }, south: { x: 0, z: 4 }, east: { x: 5, z: 0 }, west: { x: -5, z: 0 } }[side];
      w.position.set(pos.x, 3, pos.z);
      w.material = makeMat(new BABYLON.Color3(0.52, 0.52, 0.55), new BABYLON.Color3(0.42, 0.42, 0.45), BABYLON.Color3.Black(), 0.65, 0.14);
    });
    // Red roof tiles (simple planes)
    const roofMat = new BABYLON.StandardMaterial('roofMat', scene);
    roofMat.diffuseColor = new BABYLON.Color3(0.85, 0.12, 0.18);
    roofMat.backFaceCulling = false;
    ['north','south','east','west'].forEach(side => {
      const r = BABYLON.MeshBuilder.CreatePlane(`roof_${side}`, { size: 12, heightSegments: 1, widthSegments: 1 }, scene);
      r.position.set(side==='north'||side==='south'?0:side==='east'?5:-5, 12, side==='east'||side==='west'?0:side==='north'?-4:4);
      r.rotation.x = Math.PI / 2;
      r.rotation.z = side==='north'?0:side==='south'?Math.PI:side==='east'?Math.PI/2:-Math.PI/2;
      r.material = roofMat;
    });

    // --- Medieval Village ---
    const villageOffsets = [
      { x: -16, z: 8, rot: 0.15 },
      { x: -14, z: -6, rot: -0.1 },
      { x: -10, z: 14, rot: -0.05 },
      { x: -8, z: -10, rot: 0.2 }
    ];
    villageOffsets.forEach((v,i) => {
      const house = BABYLON.MeshBuilder.CreateBox(`house_${i}`, { width: 5 + Math.random()*2, height: 3.5 + Math.random()*1, depth: 4 + Math.random()*1.5 }, scene);
      house.position.set(v.x, 1.75, v.z);
      house.rotation.y = v.rot;
      house.material = makeMat(new BABYLON.Color3(0.65, 0.35, 0.12), new BABYLON.Color3(0.5, 0.25, 0.05), BABYLON.Color3.Black(), 0.8, 0.1);
      // Door
      const door = BABYLON.MeshBuilder.CreateBox(`door_${i}`, { width: 1.2, height: 1.8, depth: 0.3 }, scene);
      door.position.set(v.x, 0.85, v.z - (v.rot>0?2:2));
      door.rotation.y = v.rot;
      door.material = makeMat(new BABYLON.Color3(0.22, 0.14, 0.08), new BABYLON.Color3(0.18, 0.1, 0.04), BABYLON.Color3.Black(), 0.9, 0.2);
      // Window
      const win = BABYLON.MeshBuilder.CreateBox(`win_${i}`, { width: 0.9, height: 1.2, depth: 0.2 }, scene);
      win.position.set(v.x, 2.3, v.z + (v.rot>0?1:-1));
      win.rotation.y = v.rot;
      win.material = new BABYLON.StandardMaterial(`winMat_${i}`, scene);
      win.material.diffuseColor = new BABYLON.Color3(0.1, 0.4, 0.9);
      win.material.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.2);
    });

    // Tavern (larger)
    const tavern = BABYLON.MeshBuilder.CreateBox('tavern', { width: 9, height: 4, depth: 7 }, scene);
    tavern.position.set(-5, 2, -2);
    tavern.rotation.y = 0.15;
    tavern.material = makeMat(new BABYLON.Color3(0.68, 0.38, 0.15), new BABYLON.Color3(0.52, 0.28, 0.08), BABYLON.Color3.Black(), 0.78, 0.12);
    // Tavern sign
    const sign = BABYLON.MeshBuilder.CreatePlane('sign', { size: 1.2, heightSegments: 1 }, scene);
    sign.position.set(-5, 4.2, -2.5);
    sign.rotation.y = 0.15;
    sign.rotation.x = Math.PI / 2;
    sign.material = new BABYLON.StandardMaterial('signMat', scene);
    sign.material.diffuseColor = new BABYLON.Color3(0.2, 0.02, 0.02);
    sign.material.backFaceCulling = false;

    // Market stalls (3 small)
    for (let i = 0; i < 3; i++) {
      const stall = BABYLON.MeshBuilder.CreateBox(`stall_${i}`, { width: 3.5 + Math.random()*1.5, height: 2.5, depth: 3 + Math.random()*1 }, scene);
      const sx = -12 + i * 5 + Math.random()*2;
      const sz = (i===1)? 6 : (i===0)? -4 : -8;
      stall.position.set(sx, 1.25, sz);
      stall.material = makeMat(new BABYLON.Color3(0.48, 0.32, 0.2), new BABYLON.Color3(0.38, 0.22, 0.12), BABYLON.Color3.Black(), 0.85, 0.15);
    }

    // Riverside Mill
    const mill = BABYLON.MeshBuilder.CreateBox('mill', { width: 6, height: 8, depth: 5 }, scene);
    mill.position.set(8, 4, 0);
    mill.rotation.y = Math.PI / 6;
    mill.material = makeMat(new BABYLON.Color3(0.42, 0.35, 0.28), new BABYLON.Color3(0.32, 0.25, 0.18), BABYLON.Color3.Black(), 0.65, 0.1);
    // Water wheel
    const wheel = BABYLON.MeshBuilder.CreateCylinder('wheel', { diameter: 3, height: 0.6, tessellation: 12 }, scene);
    wheel.position.set(8, 0.3, -0.5);
    wheel.rotation.z = Math.PI / 2;
    wheel.material = makeMat(new BABYLON.Color3(0.25, 0.25, 0.25), new BABYLON.Color3(0.2, 0.2, 0.2), BABYLON.Color3.Black(), 0.9, 0.3);

    // --- River ---
    const river = BABYLON.MeshBuilder.CreateBox('river', { width: 28, height: 0.8, depth: 4 }, scene);
    river.position.set(0, 0.42, 0);
    river.rotation.x = -Math.PI / 30; // slight flow tilt
    const riverMat = new BABYLON.StandardMaterial('riverMat', scene);
    riverMat.diffuseColor = new BABYLON.Color3(0.05, 0.75, 0.85); // turquoise
    riverMat.specularColor = BABYLON.Color3.Zero();
    riverMat.emissiveColor = new BABYLON.Color3(0.02, 0.1, 0.15);
    riverMat.backFaceCulling = false;
    river.material = riverMat;

    // --- Waterfalls (two sides) ---
    const wfMat = new BABYLON.StandardMaterial('wfMat', scene);
    wfMat.diffuseColor = new BABYLON.Color3(0.1, 0.8, 0.95);
    wfMat.emissiveColor = new BABYLON.Color3(0.05, 0.4, 0.5);
    wfMat.backFaceCulling = false;

    const wfLeft = BABYLON.MeshBuilder.CreateBox('wfLeft', { width: 4, height: 6, depth: 2 }, scene);
    wfLeft.position.set(-13, 3, 9);
    wfLeft.rotation.z = -Math.PI / 6;
    wfLeft.material = wfMat;

    const wfRight = BABYLON.MeshBuilder.CreateBox('wfRight', { width: 4, height: 5.5, depth: 2 }, scene);
    wfRight.position.set(13, 2.8, -9);
    wfRight.rotation.z = Math.PI / 6;
    wfRight.material = wfMat;

    // --- Wooden Bridges ---
    const bridgeMat = new BABYLON.StandardMaterial('bridgeMat', scene);
    bridgeMat.diffuseColor = new BABYLON.Color3(0.55, 0.3, 0.08);
    bridgeMat.backFaceCulling = false;

    const bridge1 = BABYLON.MeshBuilder.CreateBox('bridge1', { width: 8, height: 0.4, depth: 1.2 }, scene);
    bridge1.position.set(0, 0.2, 11);
    bridge1.rotation.x = Math.PI / 12;
    bridge1.material = bridgeMat;

    const bridge2 = BABYLON.MeshBuilder.CreateBox('bridge2', { width: 6, height: 0.4, depth: 1.2 }, scene);
    bridge2.position.set(0, 0.2, -11);
    bridge2.rotation.x = -Math.PI / 12;
    bridge2.material = bridgeMat;

    // --- Pine Trees ---
    const pineTrunkMat = makeMat(new BABYLON.Color3(0.38, 0.22, 0.1), new BABYLON.Color3(0.3, 0.15, 0.05), BABYLON.Color3.Black(), 0.7, 0.2);
    const pineFoliageMat = makeMat(new BABYLON.Color3(0.18, 0.52, 0.24), new BABYLON.Color3(0.12, 0.42, 0.18), BABYLON.Color3.Black(), 0.95, 0.0);

    const pinePositions = [
      { x: -7, z: 10 }, { x: -9, z: -9 }, { x: 10, z: 7 }, { x: 12, z: -7 }, { x: 15, z: 0 }
    ];
    pinePositions.forEach(p => {
      // Trunk
      const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', { diameter: 0.7, height: 8, tessellation: 6 }, scene);
      trunk.position.set(p.x, 4, p.z);
      trunk.material = pineTrunkMat;
      // Foliage (scaled sphere)
      const foliage = BABYLON.MeshBuilder.CreateSphere('foliage', { diameter: 5, segments: 12 }, scene);
      foliage.position.set(p.x, 8.2, p.z);
      foliage.scaling.y = 0.5;
      foliage.material = pineFoliageMat;
    });

    // --- Ruined Watchtower (edge) ---
    const watch = BABYLON.MeshBuilder.CreateBox('watchtower', { width: 5, height: 9, depth: 4 }, scene);
    watch.position.set(0, 4.5, 16);
    watch.rotation.y = Math.PI / 4;
    watch.material = makeMat(new BABYLON.Color3(0.48, 0.48, 0.5), new BABYLON.Color3(0.35, 0.35, 0.38), BABYLON.Color3.Black(), 0.65, 0.1);
    // Ruin: missing center section
    const ruinHole = BABYLON.MeshBuilder.CreateBox('ruinHole', { width: 3, height: 4, depth: 1 }, scene);
    ruinHole.position.set(0, 2, 16.5);
    ruinHole.rotation.y = Math.PI / 4;
    ruinHole.material = watch.material; // same stone
    // Rubble piles
    for (let i = 0; i < 4; i++) {
      const rubble = BABYLON.MeshBuilder.CreateBox(`rubble_${i}`, { size: 1.5 + Math.random()*1 }, scene);
      const rx = (i%2===0?-1:1) * (5 + Math.random()*3);
      const rz = (i<2?16:14) + Math.random()*2;
      rubble.position.set(rx, 1.2, rz);
      rubble.material = makeMat(new BABYLON.Color3(0.4, 0.4, 0.42), new BABYLON.Color3(0.3, 0.3, 0.33), BABYLON.Color3.Black(), 0.5, 0.2);
    }

    // --- Lush Grass patches (scattered) ---
    const grassPatchMat = makeMat(new BABYLON.Color3(0.31, 0.62, 0.18), new BABYLON.Color3(0.24, 0.48, 0.12), BABYLON.Color3.Black(), 0.92, 0.0);
    ['-14 8','-10 -8','8 12','-6 -14','12 -12'].forEach(posStr => {
      const [xStr, zStr] = posStr.split(' ');
      const gp = BABYLON.MeshBuilder.CreateBox('grassPatch', { width: 3, height: 0.1, depth: 3 }, scene);
      gp.position.set(+xStr, 0.05, +zStr);
      gp.material = grassPatchMat;
    });

    // --- Sky / Background ---
    const skyColor = new BABYLON.Color3(0.55, 0.78, 0.92);
    scene.clearColor = new BABYLON.Color4(0.55/255, 0.78/255, 0.92/255, 1);
    const skybox = BABYLON.MeshBuilder.CreateBox('skybox', { size: 100 }, scene);
    skybox.infiniteDistance = true;
    skybox.position.y = 0;
    const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
    skyMat.backFaceCulling = false;
    skyMat.reflectionTexture = new BABYLON.CubeTexture(['data:texture;base64,....'], scene); // placeholder, skip for performance
    skybox.material = skyMat;

    // --- Animation (subtle water ripple & wind) ---
    let time = 0;
    scene.registerBeforeRender(() => {
      time += 0.016;
      // River surface shader uniform tweak (color shift)
      river.material.setFloat2('iResolution', canvas.width, canvas.height);
      // Waterfall mist particle-like color pulse
      const t = time;
      wfMat.setColor4('tint', new BABYLON.Color4(0.1 + 0.05*Math.sin(t), 0.8 - 0.05*Math.sin(t), 0.95 - 0.05*Math.cos(t), 1));
      // Bridge sway
      bridge1.rotation.y = 0.02 * Math.sin(t);
      bridge2.rotation.y = -0.02 * Math.sin(t);
    });

    // --- Resize & Render Loop ---
    engine.resize();
    engine.runRenderLoop(() => {
      scene.render();
    });
  </script>
</body>
</html>
