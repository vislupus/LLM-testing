<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Island Diorama</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; }
  #renderCanvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

const createScene = function () {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.6, 0.75, 0.9);

    // Camera
    const camera = new BABYLON.ArcRotateCamera("camera", 
        BABYLON.Tools.ToRadians(45), 
        BABYLON.Tools.ToRadians(55), 
        28, 
        new BABYLON.Vector3(0, 8, 0), 
        scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 12;
    camera.upperRadiusLimit = 45;
    camera.wheelDeltaPercentage = 0.01;

    // Lighting - soft diorama lighting
    const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.7;
    hemiLight.diffuse = new BABYLON.Color3(0.95, 0.9, 0.8);

    const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-0.5, -1, -0.3), scene);
    dirLight.intensity = 0.6;
    dirLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

    // Floating Island Base
    const island = BABYLON.MeshBuilder.CreateCylinder("island", {
        height: 6,
        diameterTop: 22,
        diameterBottom: 26,
        tessellation: 48,
        subdivisions: 4
    }, scene);
    island.position.y = 3;
    const islandMat = new BABYLON.StandardMaterial("islandMat", scene);
    islandMat.diffuseColor = new BABYLON.Color3(0.55, 0.45, 0.35);
    islandMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
    island.material = islandMat;

    // Cliff rocks (procedural)
    for (let i = 0; i < 18; i++) {
        const rock = BABYLON.MeshBuilder.CreateBox("rock" + i, {
            size: 2.5 + Math.random() * 2,
            height: 5 + Math.random() * 4
        }, scene);
        const angle = (i / 18) * Math.PI * 2;
        rock.position.x = Math.cos(angle) * (11 + Math.random() * 2);
        rock.position.z = Math.sin(angle) * (11 + Math.random() * 2);
        rock.position.y = 4 + Math.random() * 3;
        rock.rotation.y = Math.random() * Math.PI;
        rock.scaling.y = 0.8 + Math.random() * 0.6;
        
        const rockMat = new BABYLON.StandardMaterial("rockMat", scene);
        rockMat.diffuseColor = new BABYLON.Color3(0.4, 0.38, 0.35);
        rock.material = rockMat;
    }

    // Grass top
    const grass = BABYLON.MeshBuilder.CreateCylinder("grass", {
        height: 0.4,
        diameterTop: 20,
        diameterBottom: 21,
        tessellation: 48
    }, scene);
    grass.position.y = 6.1;
    const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
    grassMat.diffuseColor = new BABYLON.Color3(0.35, 0.65, 0.25);
    grass.material = grassMat;

    // === CASTLE (Center) ===
    const castleBase = BABYLON.MeshBuilder.CreateBox("castleBase", { width: 7, height: 4, depth: 6 }, scene);
    castleBase.position.set(0, 8.5, 0);
    const stoneMat = new BABYLON.StandardMaterial("stoneMat", scene);
    stoneMat.diffuseColor = new BABYLON.Color3(0.65, 0.6, 0.55);
    castleBase.material = stoneMat;

    // Towers
    const towerPositions = [[-3, 8.5, -2.5], [3, 8.5, -2.5], [-3, 8.5, 2.5], [3, 8.5, 2.5]];
    towerPositions.forEach((pos, i) => {
        const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + i, {
            height: 7, diameter: 2.2, tessellation: 16
        }, scene);
        tower.position.set(pos[0], 10, pos[2]);
        tower.material = stoneMat;
        
        // Tower roof
        const roof = BABYLON.MeshBuilder.CreateCylinder("roof" + i, {
            height: 2, diameterTop: 0, diameterBottom: 2.8, tessellation: 16
        }, scene);
        roof.position.set(pos[0], 14.5, pos[2]);
        const roofMat = new BABYLON.StandardMaterial("roofMat", scene);
        roofMat.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
        roof.material = roofMat;
    });

    // Castle walls
    const wallMat = new BABYLON.StandardMaterial("wallMat", scene);
    wallMat.diffuseColor = new BABYLON.Color3(0.6, 0.55, 0.5);
    
    const frontWall = BABYLON.MeshBuilder.CreateBox("frontWall", { width: 7, height: 3, depth: 0.8 }, scene);
    frontWall.position.set(0, 9.8, 3.4);
    frontWall.material = wallMat;

    // === VILLAGE ===
    function createHouse(x, z, w, d, h, roofColor) {
        const house = BABYLON.MeshBuilder.CreateBox("house", { width: w, height: h, depth: d }, scene);
        house.position.set(x, 7.5, z);
        const houseMat = new BABYLON.StandardMaterial("houseMat", scene);
        houseMat.diffuseColor = new BABYLON.Color3(0.6, 0.45, 0.3);
        house.material = houseMat;

        const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {
            height: 1.8, diameterTop: 0, diameterBottom: w + 0.6, tessellation: 4
        }, scene);
        roof.position.set(x, 7.5 + h / 2 + 0.9, z);
        roof.rotation.y = Math.PI / 4;
        const rMat = new BABYLON.StandardMaterial("rMat", scene);
        rMat.diffuseColor = roofColor;
        roof.material = rMat;
    }

    createHouse(-6, -4, 2.8, 2.2, 2.4, new BABYLON.Color3(0.5, 0.25, 0.15));
    createHouse(-8.5, 1, 2.4, 2.8, 2.2, new BABYLON.Color3(0.45, 0.3, 0.2));
    createHouse(7, -5, 2.6, 2.4, 2.5, new BABYLON.Color3(0.55, 0.2, 0.15));
    createHouse(5.5, 4, 2.2, 2.6, 2.1, new BABYLON.Color3(0.4, 0.3, 0.25));

    // Tavern (larger)
    const tavern = BABYLON.MeshBuilder.CreateBox("tavern", { width: 4, height: 2.8, depth: 3.2 }, scene);
    tavern.position.set(-4, 7.8, 5);
    tavern.material = new BABYLON.StandardMaterial("tavernMat", scene);
    tavern.material.diffuseColor = new BABYLON.Color3(0.5, 0.35, 0.25);

    // Market stalls
    for (let i = 0; i < 5; i++) {
        const stall = BABYLON.MeshBuilder.CreateBox("stall", { width: 1.4, height: 1.2, depth: 1.4 }, scene);
        stall.position.set(-2 + i * 1.8, 7.3, 7.5);
        stall.material = new BABYLON.StandardMaterial("stallMat", scene);
        stall.material.diffuseColor = new BABYLON.Color3(0.65, 0.5, 0.25);
    }

    // === RIVER ===
    const riverPath = [
        new BABYLON.Vector3(-10, 6.3, 0),
        new BABYLON.Vector3(-4, 6.3, 3),
        new BABYLON.Vector3(2, 6.3, 1),
        new BABYLON.Vector3(9, 6.3, 4)
    ];
    const river = BABYLON.MeshBuilder.CreateRibbon("river", {
        pathArray: [riverPath],
        width: 3.2,
        sideOrientation: BABYLON.Mesh.DOUBLESIDE
    }, scene);
    const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
    waterMat.diffuseColor = new BABYLON.Color3(0.2, 0.65, 0.75);
    waterMat.alpha = 0.85;
    waterMat.specularColor = new BABYLON.Color3(0.3, 0.6, 0.8);
    river.material = waterMat;

    // Wooden bridges
    function createBridge(x, z, rot) {
        const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 4.5, height: 0.3, depth: 1.8 }, scene);
        bridge.position.set(x, 7.1, z);
        bridge.rotation.y = rot;
        const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
        woodMat.diffuseColor = new BABYLON.Color3(0.45, 0.3, 0.2);
        bridge.material = woodMat;
    }
    createBridge(-5.5, 2.2, 0.6);
    createBridge(5, 3, -0.4);

    // === PINE TREES ===
    function createPine(x, z, scale = 1) {
        const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
            height: 2.5 * scale, diameter: 0.6 * scale, tessellation: 8
        }, scene);
        trunk.position.set(x, 7.2, z);
        trunk.material = new BABYLON.StandardMaterial("trunkMat", scene);
        trunk.material.diffuseColor = new BABYLON.Color3(0.35, 0.25, 0.15);

        const foliage = BABYLON.MeshBuilder.CreateCylinder("foliage", {
            height: 4 * scale, diameterTop: 0, diameterBottom: 3.5 * scale, tessellation: 8
        }, scene);
        foliage.position.set(x, 8.5 * scale + 1, z);
        const foliageMat = new BABYLON.StandardMaterial("foliageMat", scene);
        foliageMat.diffuseColor = new BABYLON.Color3(0.15, 0.45, 0.2);
        foliage.material = foliageMat;
    }

    for (let i = 0; i < 12; i++) {
        const angle = (i * 1.8) + Math.random();
        const radius = 8 + Math.random() * 5;
        createPine(Math.cos(angle) * radius, Math.sin(angle) * radius, 0.7 + Math.random() * 0.6);
    }

    // Ruined watchtower
    const watchtower = BABYLON.MeshBuilder.CreateCylinder("watchtower", {
        height: 5, diameter: 1.8, tessellation: 12
    }, scene);
    watchtower.position.set(9, 9, -7);
    watchtower.material = stoneMat;

    const ruinTop = BABYLON.MeshBuilder.CreateBox("ruinTop", { width: 2.2, height: 1.5, depth: 2.2 }, scene);
    ruinTop.position.set(9, 11.5, -7);
    ruinTop.rotation.z = 0.3;
    ruinTop.material = stoneMat;

    // Simple particle waterfall
    const waterfall = new BABYLON.ParticleSystem("waterfall", 800, scene);
    waterfall.particleTexture = new BABYLON.Texture("https://cdn.babylonjs.com/textures/flare.png", scene);
    waterfall.emitter = new BABYLON.Vector3(-1, 6.5, 6);
    waterfall.minEmitBox = new BABYLON.Vector3(-0.5, 0, 0);
    waterfall.maxEmitBox = new BABYLON.Vector3(0.5, 0, 0);
    waterfall.color1 = new BABYLON.Color4(0.4, 0.75, 0.9, 0.6);
    waterfall.color2 = new BABYLON.Color4(0.3, 0.65, 0.85, 0.4);
    waterfall.minSize = 0.15;
    waterfall.maxSize = 0.35;
    waterfall.minLifeTime = 1.2;
    waterfall.maxLifeTime = 2.2;
    waterfall.emitRate = 400;
    waterfall.direction1 = new BABYLON.Vector3(-0.3, -1, 0.1);
    waterfall.direction2 = new BABYLON.Vector3(0.3, -1, -0.1);
    waterfall.gravity = new BABYLON.Vector3(0, -9.8, 0);
    waterfall.start();

    // Soft ambient glow
    scene.ambientColor = new BABYLON.Color3(0.3, 0.35, 0.4);

    return scene;
};

const scene = createScene();

engine.runRenderLoop(() => {
    scene.render();
});

window.addEventListener("resize", () => {
    engine.resize();
});
</script>
</body>
</html>
