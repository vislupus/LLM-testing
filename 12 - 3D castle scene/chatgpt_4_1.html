<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Floating Island Diorama - Babylon.js Medieval Castle Scene</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#181825; }
    #renderCanvas { width:100vw; height:100vh; display:block; background:#292940; }
    #label {
      position: absolute; left:0; top:0; width:100vw; padding:18px; z-index:100; color:#f6f4ec; font-family: 'Segoe UI', sans-serif;
      font-size:1.3em; text-shadow:1px 2px 8px #222,a; pointer-events:none; user-select:none;
      letter-spacing:0.07em; font-weight:600; text-align:center;
      text-shadow: 0 2px 10px #2f2240,0 1px 6px #1e1420;
      opacity: 0.85;
    }
    @media (max-width:700px) {
      #label { font-size:.9em; padding:5px;}
    }
    .babylonjs-logo { position:absolute; right:10px; top:10px; width:78px; opacity:.28; }
  </style>
</head>
<body>
  <div id="label">Floating Island Diorama &mdash; Medieval Castle, Village, River &middot; <span style="font-size:.82em; opacity:.7">Babylon.js</span></div>
  <canvas id="renderCanvas"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true, stencil:true});

function randomRange(a,b){ return a + (b-a)*Math.random(); }
function degreeToRad(d){ return Math.PI*d/180; }

const palette = {
  ground:'#ABCE56',      // grass
  cliff:'#5D5A68',       // rock
  path:'#DEB988',        // path
  foliage:'#217C3B',     // pine needles
  bark:'#965634',
  water:'#36CAE5',
  riverShallow:'#60F7F2',
  house:'#C59263',
  thatch:'#FFD46F',
  roof:'#8F3337',
  window:'#E7F5FF',
  castle:'#C8D4DC',
  castleEdge:'#B7BED8',
  castleDark:'#8493A6',
  marketCloth:'#FE4A66',
  ruined:'#CBC3B8'
};

engine.displayLoadingUI();

const createScene = function () {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.10,0.10,0.20, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
  scene.fogDensity = 0.018;
  scene.fogColor = new BABYLON.Color3(.23,.3,.47);

  // Camera
  const camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2.22, Math.PI/2.12, 68, new BABYLON.Vector3(0,14,-2), scene);
  camera.wheelPrecision = 120;
  camera.lowerRadiusLimit = 32;
  camera.upperRadiusLimit = 88;
  camera.panningSensibility = 0;
  camera.attachControl(canvas,true);

  // Lighting
  const light1 = new BABYLON.HemisphericLight("h1", new BABYLON.Vector3(-0.2,1,0.7), scene);
  light1.intensity = 1;
  light1.groundColor = new BABYLON.Color3(.9,.87,1);
  // Additional warm spot for highlights
  const spot = new BABYLON.SpotLight("spot", new BABYLON.Vector3(-16,28,24), new BABYLON.Vector3(0,-1,-0.12), Math.PI/2.2, 2, scene);
  spot.intensity = 0.28;
  spot.diffuse = new BABYLON.Color3(1,.98,.93);

  // Shadow generator for sharp mini-tabletop look
  const shadowGen = new BABYLON.ShadowGenerator(1024, spot);
  shadowGen.useExponentialShadowMap = true;
  shadowGen.setDarkness(.12);

  // --- Tabletop base / island "slice"
  function createIslandBase() {
    // Create gentle cylinder for grass
    const mainGeo = BABYLON.MeshBuilder.CreateCylinder("islandtop",{
      diameterTop:36, diameterBottom:39, height:3.2, tessellation: 64 },scene
    );
    mainGeo.position.y = 3.4;
    mainGeo.material = new BABYLON.StandardMaterial("grass",scene);
    mainGeo.material.diffuseColor = BABYLON.Color3.FromHexString(palette.ground);
    mainGeo.material.specularPower = 18;
    mainGeo.material.specularColor = BABYLON.Color3.FromHexString("#d8fbb8").scale(0.6);

    // Create irregular polygonal mesh for cliff bottom
    const CLIF_VERTS = 48;
    let paths = [];
    for(let lvl=0; lvl<=3; ++lvl){
      let y = 3.2 - lvl*2.8;
      let pts = [];
      let offs = lvl*0.7;
      let dia = lvl==0?37:(lvl==1?23.5:9) + randomRange(-.4,.3)+offs;
      let nx = (lvl==0?1:randomRange(.89,.91));
      for(let i=0;i<CLIF_VERTS;++i){
        let ang = Math.PI*2*i/CLIF_VERTS;
        let rad = dia + Math.sin(ang*2+lvl)*randomRange(0.9,1.3)+(Math.sin(ang*5+lvl*.7)*lvl*0.2);
        pts.push( new BABYLON.Vector3( Math.cos(ang)*rad, y, Math.sin(ang)*rad ) );
      }
      paths.push(pts);
    }
    // Add tip points at base for hanging rock ends
    paths.push([
      new BABYLON.Vector3(-1,-5.9,0),new BABYLON.Vector3(0,-6.1,.1),new BABYLON.Vector3(0,-6.2,-1)
    ]);
    // Loft lathe sections
    const cliff = BABYLON.MeshBuilder.CreateRibbon("cliff",{
      pathArray: paths,
      closeArray:true, closePath:true
    },scene);
    cliff.position.y = .7;
    cliff.material = new BABYLON.StandardMaterial("cliffmat",scene);
    cliff.material.diffuseColor = BABYLON.Color3.FromHexString(palette.cliff).scale(.91);;
    cliff.material.specularColor = new BABYLON.Color3(.59,.59,.72);
    cliff.material.specularPower = 14;
    shadowGen.addShadowCaster(cliff);

    // Decorate random cracks (simple stripes)
    for(let i=0; i<6; ++i){
      const crack = BABYLON.MeshBuilder.CreateTube("crack"+i,{
        path: [new BABYLON.Vector3(randomRange(-17,17),3,randomRange(-17,17)),new BABYLON.Vector3(randomRange(-19,19),-4,randomRange(-19,19)) ],
        radius: randomRange(.13,.19),
        cap: BABYLON.Mesh.CAP_ALL,
      },scene);
      crack.material = new BABYLON.StandardMaterial("crackmat"+i,scene);
      crack.material.diffuseColor = BABYLON.Color3.FromHexString("#484560").scale(.71);
      crack.material.specularColor = BABYLON.Color3.Black();
      crack.material.emissiveColor = new BABYLON.Color3(.05,.04,.08);
    }
    // Tabletop "base"
    const base = BABYLON.MeshBuilder.CreateCylinder("base", {
      diameter:46,height:3.8,diameterTop:40,diameterBottom:41, tessellation:72
    },scene);
    base.position.y = -5.4;
    base.material = new BABYLON.StandardMaterial("basemat",scene);
    base.material.diffuseColor = new BABYLON.Color3(.35,.29,.22);
    base.material.specularColor = new BABYLON.Color3(.09,.07,.05);
    return [mainGeo,cliff,base];
  }
  createIslandBase();

  // --- WATER
  // River surface: shape river path using custom polygon with quad strips.
  function createRiverAndWaterfalls() {
    // Main river outline: define N path points
    // Visual: River curves from near village, loops before castle, goes over edge as waterfall.
    const riverPts = [
      new BABYLON.Vector3(-10,3.6,16),
      new BABYLON.Vector3(-9,3.6,9),  // From edge coming in
      new BABYLON.Vector3(-5,3.7,7),
      new BABYLON.Vector3(-1,3.85,5),
      new BABYLON.Vector3(3,3.8,4),
      new BABYLON.Vector3(8,3.85,4),
      new BABYLON.Vector3(12,3.9,6),
      new BABYLON.Vector3(17,3.7,12),
      new BABYLON.Vector3(14,3.6,19), // Out waterfall
      new BABYLON.Vector3(7,3.65,23)
    ];
    const width = 3.6;

    // create quad mesh along path
    let lefts = [], rights = [];
    for (let i = 0; i < riverPts.length; ++i) {
      let fwd = i<riverPts.length-1 ? riverPts[i+1].subtract(riverPts[i]) : riverPts[i].subtract(riverPts[i-1]);
      let perp = new BABYLON.Vector3(-fwd.z, 0, fwd.x).normalize().scale(width * (i==1||i==riverPts.length-2 ? 0.5 : 1));
      lefts.push(riverPts[i].add(perp));
      rights.push(riverPts[i].subtract(perp));
    }
    let riverPath = [];
    for(let i=0;i<lefts.length;++i) riverPath.push(lefts[i]);
    for(let i=rights.length-1;i>=0;--i) riverPath.push(rights[i]);
    const riverMesh = BABYLON.MeshBuilder.CreatePolygon("river", 
      {shape: riverPath.map(v=>new BABYLON.Vector3(v.x,v.y+0.01,v.z)), sideOrientation:BABYLON.Mesh.DOUBLESIDE}, scene);
    riverMesh.material = new BABYLON.StandardMaterial("rivmat",scene);
    riverMesh.material.diffuseColor = BABYLON.Color3.FromHexString(palette.riverShallow);
    riverMesh.material.alpha = 0.74;
    riverMesh.receiveShadows = true;
    riverMesh.material.specularColor = new BABYLON.Color3(.15,.38,.65).scale(.5);
    riverMesh.material.emissiveColor = new BABYLON.Color3(.19,.52,.39).scale(.11);

    // Simulate river banks (simple tubes)
    const bankMat = new BABYLON.StandardMaterial("bankmat", scene);
    bankMat.diffuseColor = new BABYLON.Color3(.94,.89,.47).scale(.49);
    for(let i=0; i<riverPts.length-1; ++i){
      let tube = BABYLON.MeshBuilder.CreateTube("rivbank"+i, {
        path:[lefts[i],lefts[i+1]], radius:.22},scene);
      tube.material = bankMat; tube.position.y += .025;
      let tube2 = BABYLON.MeshBuilder.CreateTube("rivbank"+i+"b", {
        path:[rights[i],rights[i+1]], radius:.24},scene);
      tube2.material = bankMat; tube2.position.y += .025;
    }

    // Waterfalls: at riverPts[8]
    for(let w=0;w<2;++w){
      const wfPath=[riverPts[8+w],riverPts[8+w].add(new BABYLON.Vector3(0,-3.2,2.1-w*4))];
      const wf = BABYLON.MeshBuilder.CreateTube("waterfall"+w,{path:wfPath,radius:1.07-.25*w,cap:2},scene);
      wf.material = new BABYLON.StandardMaterial("wfallmat",scene);
      wf.material.diffuseColor = BABYLON.Color3.FromHexString(palette.water).scale(.7);
      wf.material.alpha = 0.58;
      wf.material.specularColor = BABYLON.Color3.FromHexString("#b5fbe9").scale(.6);
      wf.material.emissiveColor = BABYLON.Color3.FromHexString("#b5fbe9").scale(.08);
      wf.material.freeze();
    }
    return riverMesh;
  }
  createRiverAndWaterfalls();

  // --- Paths
  function createVillagePaths(){
    const pathMat = new BABYLON.StandardMaterial("pathmat",scene);
    pathMat.diffuseColor = BABYLON.Color3.FromHexString(palette.path);
    pathMat.specularColor = new BABYLON.Color3(.12,.09,.07);
    // From market to castle
    let pts = [
      new BABYLON.Vector3(-5,3.2,8),
      new BABYLON.Vector3(-1.9,3.24,4),
      new BABYLON.Vector3(0,3.28,1.4),
      new BABYLON.Vector3(3,3.31,0)
    ];
    const p1 = BABYLON.MeshBuilder.CreateTube("pathtocastle",{path:pts, radius:0.9, cap:2},scene);
    p1.material = pathMat;
    // From houses to tavern
    let pts2 = [
      new BABYLON.Vector3(-5.5,3.22,10),
      new BABYLON.Vector3(-5,3.26,8),
      new BABYLON.Vector3(-6.2,3.22,6.3)
    ];
    const p2 = BABYLON.MeshBuilder.CreateTube("pathtotavern",{path:pts2, radius:0.65, cap:2},scene);
    p2.material = pathMat;
  }
  createVillagePaths();

  // --- BRIDGES over river
  function createSmallBridge(at){
    // Simple stylized bridges: planks+cylinder as arch, placed at two locations over river
    let arch = BABYLON.MeshBuilder.CreateCylinder("bridgearch",{diameter:2.2, height:.32, tessellation:20},scene);
    arch.scaling.x=1.8;
    arch.scaling.y=.18;
    arch.rotation.z = Math.PI/2.0;
    arch.position.copyFrom(at);
    arch.material = new BABYLON.StandardMaterial("bridgearchmat",scene);
    arch.material.diffuseColor = new BABYLON.Color3(.79,.59,.41);
    for (let k=-1;k<=1;++k) { // planks
      let plank = BABYLON.MeshBuilder.CreateBox("bridgeplank"+(at.x+100*k),{width:2.6,height:.18,depth:.24},scene);
      plank.position.copyFrom(at); plank.position.y += 0.17+k*0.2;
      plank.position.x += randomRange(-.11,.11);
      plank.material = arch.material;
    }
  }
  createSmallBridge(new BABYLON.Vector3(3.5,3.99,5));
  createSmallBridge(new BABYLON.Vector3(10,4.18,8.5));

  // --- Handcrafted pine trees
  function createPineTree(pos,scale=1.0){
    let trunk = BABYLON.MeshBuilder.CreateCylinder("treetrun",{
      diameterTop:0.22*scale, diameterBottom:0.32*scale, height:.86*scale
    },scene);
    trunk.position = pos.add(new BABYLON.Vector3(0, .43*scale, 0));
    trunk.material = new BABYLON.StandardMaterial("trunkmat",scene);
    trunk.material.diffuseColor = BABYLON.Color3.FromHexString(palette.bark);
    trunk.material.specularColor = new BABYLON.Color3(.05,.02,0);

    // 3 cone layers
    for(let i=0;i<3;++i){
      let cone = BABYLON.MeshBuilder.CreateCylinder("treecon"+i,{
        diameterTop:0.04*scale, diameterBottom:.7*scale*(1-i*0.08), height:1.18*scale*(.81-i*0.19),
        tessellation:14
      },scene);
      cone.position = pos.add(new BABYLON.Vector3(0,1.05*scale+(-i*.37*scale), 0));
      cone.material = new BABYLON.StandardMaterial("leafmat",scene);
      cone.material.diffuseColor = BABYLON.Color3.FromHexString(palette.foliage).scale(1 - i*0.13);
      cone.material.specularColor = new BABYLON.Color3(.11,.13,.09);
      cone.material.emissiveColor = new BABYLON.Color3(.08,.23,.09).scale(.12);
      if(i===0)
        shadowGen.addShadowCaster(cone);
    }
  }
  // Place pine trees around the cliffs, river edge, scattered
  for(let i=0;i<16;++i){
    let angle = degreeToRad(randomRange(10,350));
    let rad = randomRange(13.5,18.5);
    let x = Math.cos(angle)*rad;
    let z = Math.sin(angle)*rad;
    let y = 3.27+ Math.random()*.5 - (.8 * (z>9?1:0));
    createPineTree(new BABYLON.Vector3(x,y,z), randomRange(0.9,1.22));
  }
  for(let i=0;i<5;++i) // smaller trees towards center
    createPineTree( new BABYLON.Vector3(randomRange(4,11),3.21+Math.random()*.28,randomRange(-6,9)), randomRange(.67,.82));

  // --- CASTLE CENTERPIECE
  function createCastle(center){
    // Main keep: tall cylinder with battlements
    let keep = BABYLON.MeshBuilder.CreateCylinder("castlekeep",{diameterTop:5.8, diameterBottom:5.1, height:10.9},scene);
    keep.position = center.add(new BABYLON.Vector3(0,8.2,0));
    let keepmat = new BABYLON.StandardMaterial("keepmat",scene);
    keepmat.diffuseColor = BABYLON.Color3.FromHexString(palette.castle);
    keepmat.specularColor = BABYLON.Color3.FromHexString("#C1D2DF").scale(.51);
    keep.material = keepmat;
    shadowGen.addShadowCaster(keep);

    // Battlements
    for(let i=0;i<11;++i){
      let ang = i/11*Math.PI*2;
      let batt = BABYLON.MeshBuilder.CreateBox("battK"+i,{width:.58,height:.85,depth:1.24},scene);
      batt.position = keep.position.add(new BABYLON.Vector3(Math.cos(ang)*3.09,5.56,Math.sin(ang)*3.12));
      batt.material = keepmat; batt.material.diffuseColor = batt.material.diffuseColor.scale(.96);
      batt.material.emissiveColor = new BABYLON.Color3(.83,.89,.99).scale(.04);
      shadowGen.addShadowCaster(batt);
    }
    // Side towers
    for(let j=0;j<4;++j){
      let ang = [30,120,220,315][j]*Math.PI/180;
      let pos = center.add(new BABYLON.Vector3(Math.cos(ang)*4.8,3.2,Math.sin(ang)*4.9));
      let t = BABYLON.MeshBuilder.CreateCylinder("cstltwr"+j,{diameterTop:2.4,diameterBottom:2.18, height:8.2},scene);
      t.position = pos.add(new BABYLON.Vector3(0,5.3,0));
      let tmat = new BABYLON.StandardMaterial("cstlmat"+j,scene);
      tmat.diffuseColor = BABYLON.Color3.FromHexString(palette.castleEdge).scale(.97+j*.02);
      tmat.specularColor = keepmat.specularColor;
      tmat.emissiveColor = new BABYLON.Color3(.93,.98,.88).scale(.035);
      t.material = tmat;
      t.rotation.y=randomRange(-.11,.13);
      shadowGen.addShadowCaster(t);

      // Spires: pointy cones on towers
      let spire = BABYLON.MeshBuilder.CreateCylinder("cstltwrspire"+j,{
        diameterTop:.36, diameterBottom:1.03, height:1.67},scene);
      spire.position = t.position.add(new BABYLON.Vector3(0,4.1,0));
      spire.material = new BABYLON.StandardMaterial("spmat"+j,scene);
      spire.material.diffuseColor = BABYLON.Color3.FromHexString(palette.castleDark);
      spire.material.specularColor = new BABYLON.Color3(.71,.87,.99).scale(.16);
      spire.material.emissiveColor = new BABYLON.Color3(.93,.98,.88).scale(.025);
    }
    // Wall segments (arcs)
    for(let a=0;a<7;++a){
      let ang = Math.PI*2*a/7, ang2=Math.PI*2*(a+1)/7;
      let p1 = center.add(new BABYLON.Vector3(Math.cos(ang)*6.6,3.1,Math.sin(ang)*6.6));
      let p2 = center.add(new BABYLON.Vector3(Math.cos(ang2)*6.6,3.1,Math.sin(ang2)*6.6));
      let wall = BABYLON.MeshBuilder.CreateTube("castleWall"+a,{
        path:[p1.add(new BABYLON.Vector3(0,2.69,0)), p2.add(new BABYLON.Vector3(0,2.69,0))],
        radius:.79, cap:2
      },scene);
      wall.material = keepmat;
      shadowGen.addShadowCaster(wall);
      // Wall battlements
      for(let k=0;k<3;++k){
        let alpha = ang + (ang2-ang)*(k/2);
        let batt = BABYLON.MeshBuilder.CreateBox("wallbatt"+a+"_"+k,{width:.34,height:.68,depth:.69},scene);
        batt.position = center.add(new BABYLON.Vector3(Math.cos(alpha)*6.8,5.63,Math.sin(alpha)*6.7));
        batt.material = wall.material; shadowGen.addShadowCaster(batt);
      }
    }
    // Gatehouse entrance
    const gateh = BABYLON.MeshBuilder.CreateBox("castleGate",{width:2.4,height:3.4,depth:1},scene);
    gateh.position = center.add(new BABYLON.Vector3(0,4.64,7.3));
    let gmat = new BABYLON.StandardMaterial("gatemat",scene);
    gmat.diffuseColor = BABYLON.Color3.FromHexString(palette.castleDark);
    gmat.specularColor = new BABYLON.Color3(.33,.39,.25).scale(.11);
    gateh.material = gmat;
    // Draw-bridge
    const br = BABYLON.MeshBuilder.CreateBox("drawbridge",{width:2.28,height:.26,depth:1.22}, scene);
    br.position = center.add(new BABYLON.Vector3(0,3.46,8.49));
    br.rotation.x = degreeToRad(-11);
    br.material = new BABYLON.StandardMaterial("brmat",scene);
    br.material.diffuseColor = new BABYLON.Color3(.69,.44,.28).scale(.9);
    br.material.specularColor = new BABYLON.Color3(.23,.18,.08);

    // Windows: add stripes
    for(let s=0;s<7;++s){
      const win = BABYLON.MeshBuilder.CreateBox("cwin"+s,{width:.29,height:.7,depth:.12},scene);
      let ang = Math.PI*2*s/7;
      win.position = center.add(new BABYLON.Vector3(Math.cos(ang)*2.6,8+randomRange(-.98,.98),Math.sin(ang)*2.6));
      win.material = new BABYLON.StandardMaterial("windowmat",scene);
      win.material.diffuseColor = BABYLON.Color3.FromHexString(palette.window);
      win.material.emissiveColor = win.material.diffuseColor.scale(.11);
    }
  }
  createCastle(new BABYLON.Vector3(2,3.9,0));

  // --- Village: Small houses, tavern, market stalls, mill
  function createHouse(pos, rot=0, w=1, h=1, roofcol=palette.roof, windowlit=false) {
    // Body
    let house = BABYLON.MeshBuilder.CreateBox("villagehouse",{width:2.2*w,height:1.45*h,depth:1.08*w},scene);
    house.position = pos.add(new BABYLON.Vector3(0,0.7*h,0));
    house.rotation.y = rot;
    house.material = new BABYLON.StandardMaterial("housemat",scene);
    house.material.diffuseColor = BABYLON.Color3.FromHexString(palette.house).scale(randomRange(.92,.97));
    house.material.specularColor = new BABYLON.Color3(.95,.84,.77).scale(.17);

    // Roof, a triangular prism
    let roof = BABYLON.MeshBuilder.CreateBox("hroof",{width:2.34*w,height:.64*h,depth:1.13*w},scene);
    roof.position = house.position.add(new BABYLON.Vector3(0,.87*h,0));
    roof.material = new BABYLON.StandardMaterial("roofmat",scene);
    roof.material.diffuseColor = BABYLON.Color3.FromHexString(roofcol);
    roof.material.specularColor = BABYLON.Color3.FromHexString("#fae1bf").scale(.13);
    roof.scaling.y = 1.08;
    roof.rotation.x = degreeToRad(20+randomRange(-6,6));

    // Gable end triangles
    for(let s=0; s<2; ++s){
      let tri = BABYLON.MeshBuilder.CreateCylinder("gabl"+s, {
        diameterTop:0.01,diameterBottom:1.08*w, height:.47*h, tessellation:3},scene);
      tri.position = roof.position.add(new BABYLON.Vector3(0,s==0?.29*w:-.29*w,-.5*w+(s*1.08*w)));
      tri.material = roof.material;
      tri.rotation.z = Math.PI/2;
      tri.rotation.x = degreeToRad(20+randomRange(-6,6));
    }
    // Windows
    let wbox = BABYLON.MeshBuilder.CreateBox("hwin",{width:.32,height:.42,depth:.07},scene);
    wbox.position = house.position.add(new BABYLON.Vector3(.61*w,.32,.54*w));
    wbox.material = new BABYLON.StandardMaterial("wmat",scene);
    wbox.material.diffuseColor = BABYLON.Color3.FromHexString(palette.window).scale( windowlit ? 1.6 : 1.0 );
    wbox.material.emissiveColor = BABYLON.Color3.FromHexString("#f1f8e4").scale(windowlit?.18:.16);

    // Door
    let door = BABYLON.MeshBuilder.CreateBox("door",{width:.36,height:.66,depth:.075},scene);
    door.position = house.position.add(new BABYLON.Vector3(-.61*w,.03,.54*w));
    door.material = new BABYLON.StandardMaterial("doormat",scene);
    door.material.diffuseColor = new BABYLON.Color3(.49,.31,.17);
    door.material.emissiveColor = new BABYLON.Color3(.84,.72,.59).scale(.08);

    // Chimney
    if(Math.random() > .3){
      let chim = BABYLON.MeshBuilder.CreateBox("chim",{width:.16,height:.52*h,depth:.17},scene);
      chim.position = roof.position.add(new BABYLON.Vector3(randomRange(-.54,.44),.45*h,0));
      chim.material = new BABYLON.StandardMaterial("chimmat",scene);
      chim.material.diffuseColor = BABYLON.Color3.FromHexString("#BFA068");
      chim.material.specularColor = new BABYLON.Color3(.9,.9,.8).scale(.11);
    }
  }
  // Small cluster of houses
  [
    {pos:new BABYLON.Vector3(-6.2,3.21,9.1), rot:degreeToRad(-16),w:1,h:1,roof:palette.roof, lit:true},
    {pos:new BABYLON.Vector3(-8.1,3.19,8.0), rot:degreeToRad(-9),w:.96,h:1.09,roof:palette.roof, lit:false},
    {pos:new BABYLON.Vector3(-6.65,3.17,11), rot:degreeToRad(8),w:.94,h:.9,roof:palette.thatch, lit:true},
    {pos:new BABYLON.Vector3(-9.8,3.15,10.6), rot:degreeToRad(2),w:1.1,h:.91,roof:palette.roof, lit:false},
    {pos:new BABYLON.Vector3(-11,3.17,8.4), rot:degreeToRad(-11),w:.86,h:.99,roof:palette.thatch,lit:false},
  ].forEach(h=> createHouse(h.pos,h.rot,h.w,h.h,h.roof,h.lit));

  // Tavern (slightly bigger)
  createHouse(new BABYLON.Vector3(-8.2,3.29,6.2), degreeToRad(11),1.6,1.3, palette.roof,true);

  // Market stalls (red/cream cloths over posts)
  function createMarketStall(pos, dir, clothCol) {
    // Table
    let table = BABYLON.MeshBuilder.CreateBox("stalltbl",{width:1.3,height:.18,depth:.6},scene);
    table.position = pos.add(new BABYLON.Vector3(0,.18,0));
    table.rotation.y = dir;
    table.material = new BABYLON.StandardMaterial("tblmat",scene);
    table.material.diffuseColor = BABYLON.Color3.FromHexString("#baa595").scale(.88);
    // Cloth cover: a wavy box
    let cloth = BABYLON.MeshBuilder.CreateBox("cloth",{width:1.33,height:.1,depth:.73},scene);
    cloth.position = table.position.add(new BABYLON.Vector3(0,.23,0));
    cloth.rotation.y = dir;
    cloth.material = new BABYLON.StandardMaterial("clothmat",scene);
    cloth.material.diffuseColor = BABYLON.Color3.FromHexString(clothCol);
    cloth.material.emissiveColor = BABYLON.Color3.FromHexString(clothCol).scale(.08);
    // Corner wooden posts
    for(let s=0;s<4;++s){
      let x=((s%2)?.53:-.53), z=(s<2)?.32:-.32;
      let post = BABYLON.MeshBuilder.CreateBox("post"+s,{width:.065,height:.53,depth:.07},scene);
      post.position = table.position.add(new BABYLON.Vector3(x,.29,z));
      post.rotation.y = dir + randomRange(-.14,.14);
      post.material = new BABYLON.StandardMaterial("postmat",scene);
      post.material.diffuseColor = new BABYLON.Color3(.42,.25,.15);
    }
  }
  createMarketStall( new BABYLON.Vector3(-5.7,3.26,7.0), degreeToRad(13), palette.marketCloth );
  createMarketStall( new BABYLON.Vector3(-4.7,3.29,7.3), degreeToRad(21), palette.thatch );
  createMarketStall( new BABYLON.Vector3(-4.3,3.31,8.2), degreeToRad(7), palette.castleDark );

  // Mill (by river): fat round base, slanted roof, side paddle
  function createMill(pos){
    let base = BABYLON.MeshBuilder.CreateCylinder("millbase",{diameter:1.34, height:1.07},scene);
    base.position = pos.add(new BABYLON.Vector3(0,.53,0));
    base.material = new BABYLON.StandardMaterial("millmat",scene);
    base.material.diffuseColor = BABYLON.Color3.FromHexString("#E3BD7B").scale(.9);
    // Roof
    let roof = BABYLON.MeshBuilder.CreateCylinder("millr",{
      diameterTop:0.52, diameterBottom:1.4, height:.66, tessellation:12},scene);
    roof.position = base.position.add(new BABYLON.Vector3(0,.77,0));
    roof.material = new BABYLON.StandardMaterial("millrmat",scene);
    roof.material.diffuseColor = BABYLON.Color3.FromHexString(palette.roof);
    // Wheel
    let w = BABYLON.MeshBuilder.CreateTorus("wheeltorus",{diameter:.8, thickness:.14, tessellation:16},scene);
    w.position = base.position.add(new BABYLON.Vector3(.74,-.13,.11));
    w.rotation.z = degreeToRad(89);
    w.material = new BABYLON.StandardMaterial("wheelmat",scene);
    w.material.diffuseColor = new BABYLON.Color3(.66,.47,.18);
    // Paddles
    for(let p=0;p<6;++p){
      let paddle = BABYLON.MeshBuilder.CreateBox("paddle"+p,{width:.26,height:.08,depth:.38},scene);
      let ang = degreeToRad(p*60);
      paddle.position = w.position.add(new BABYLON.Vector3(Math.cos(ang)*.28,-.09,Math.sin(ang)*.45));
      paddle.rotation.z = ang + degreeToRad(90);
      paddle.material = w.material;
    }
    // Door
    let door = BABYLON.MeshBuilder.CreateBox("mdoor",{width:.19,height:.38,depth:.05},scene);
    door.position = base.position.add(new BABYLON.Vector3(.15,-.13,.65));
    door.material = new BABYLON.StandardMaterial("milldoormat",scene);
    door.material.diffuseColor = new BABYLON.Color3(.52,.30,.19);
  }
  createMill(new BABYLON.Vector3(11,3.34,5));

  // --- RUINED EDGE WATCHTOWER
  function createRuinedTower(pos){
    let tw = BABYLON.MeshBuilder.CreateCylinder("ruintw",{diameterTop:1.7,diameterBottom:2.09, height:4.19},scene);
    tw.position = pos.add(new BABYLON.Vector3(0,2.09,0));
    tw.material = new BABYLON.StandardMaterial("twmat",scene);
    tw.material.diffuseColor = BABYLON.Color3.FromHexString(palette.ruined);
    tw.material.specularColor = new BABYLON.Color3(.23,.23,.22).scale(.18);

    // Broken top battlements (just some blocks missing)
    for(let i=0;i<8;++i){
      if(i%3===0)continue;
      let ang=i*Math.PI/4;
      let batt = BABYLON.MeshBuilder.CreateBox("towerbatt"+i,{width:.26,height:.38,depth:.51},scene);
      batt.position = tw.position.add(new BABYLON.Vector3(Math.cos(ang)*.93,2.36,Math.sin(ang)*.93));
      batt.material = tw.material;
    }
    // Ruined stone debris (cubes scatter)
    for(let d=0;d<5;++d){
      let deb = BABYLON.MeshBuilder.CreateBox("rdebris"+d,{width:.15+Math.random()*.2,height:.12,depth:.17},scene);
      deb.position = pos.add(new BABYLON.Vector3(randomRange(-.7,.7),.03,randomRange(-.62,.68)));
      deb.material = tw.material;
      deb.rotation.y = randomRange(0,Math.PI*2);
    }
  }
  createRuinedTower(new BABYLON.Vector3(17.4,3.25,14.2));

  // Add a few more scatter objects (cart, barrels for vibes)
  function createBarrel(pos){
    let cyl = BABYLON.MeshBuilder.CreateCylinder("bcy",{diameterTop:.39,diameterBottom:.33, height:.53},scene);
    cyl.position = pos;
    cyl.material = new BABYLON.StandardMaterial("barrelmat",scene);
    cyl.material.diffuseColor = new BABYLON.Color3(.46,.27,.15);
    // Rim
    let rim = BABYLON.MeshBuilder.CreateTorus("brim",{diameter:.39, thickness:.047, tessellation:12},scene);
    rim.position = pos.add(new BABYLON.Vector3(0,.17,0));
    rim.material = cyl.material;
  }
  createBarrel(new BABYLON.Vector3(-7.3,3.25,6.4));
  createBarrel(new BABYLON.Vector3(-4.99,3.25,10.3));

  // Post-processing: add a slight glow for softness
  var gl = new BABYLON.GlowLayer("glow", scene,{blurKernelSize:16});
  gl.intensity = 0.20;

  engine.hideLoadingUI();
  return scene;
};

const scene=createScene();

engine.runRenderLoop(function () {
  scene.render();
});

window.addEventListener("resize", function () {
  engine.resize();
});
  </script>
</body>
</html>
