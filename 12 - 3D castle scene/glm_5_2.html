<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama - Babylon.js</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b1026;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
        outline: none;
    }
    .ui-overlay {
        position: absolute;
        top: 25px;
        left: 25px;
        color: #fff;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        pointer-events: none;
        z-index: 10;
    }
    .ui-overlay h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 3px;
        text-transform: uppercase;
    }
    .ui-overlay p {
        margin: 5px 0 0 0;
        font-size: 14px;
        opacity: 0.7;
        font-weight: 400;
        letter-spacing: 1px;
    }
    .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 24px;
        letter-spacing: 4px;
        z-index: 20;
        transition: opacity 0.5s;
    }
</style>
</head>
<body>
    <div class="ui-overlay">
        <h1>Aetheria</h1>
        <p>Tabletop Diorama · Drag to Orbit · Scroll to Zoom</p>
    </div>
    <div class="loader" id="loader">Generating World...</div>

    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', function() {
        
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, antialias: true });

        // Global array for animated objects
        const animatedWater = [];
        const dynamicShadows = [];

        const createScene = function() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.04, 0.05, 0.11, 1.0);

            // --- Camera Setup (Macro Lens Feel) ---
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2.2, Math.PI / 2.8, 110, new BABYLON.Vector3(0, 10, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 40;
            camera.upperRadiusLimit = 220;
            camera.upperBetaLimit = Math.PI / 2.1;
            camera.lowerBetaLimit = Math.PI / 4;
            camera.wheelDeltaPercentage = 0.01;
            camera.pinchDeltaPercentage = 0.01;
            camera.minZ = 0.1;
            camera.fov = 0.45; // Narrow FOV for miniature lens compression

            // --- Lighting (Soft Stylized) ---
            const ambientLight = new BABYLON.HemisphericLight("ambientLight", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.75;
            ambientLight.diffuse = new BABYLON.Color3(0.8, 0.85, 1.0);
            ambientLight.groundColor = new BABYLON.Color3(0.2, 0.15, 0.25);

            const sunLight = new BABYLON.DirectionalLight("sunLight", new BABYLON.Vector3(-0.5, -1, -0.8), scene);
            sunLight.position = new BABYLON.Vector3(60, 120, 80);
            sunLight.intensity = 1.1;
            sunLight.diffuse = new BABYLON.Color3(1.0, 0.95, 0.85);

            // Soft Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, sunLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;
            shadowGenerator.darkness = 0.35;
            shadowGenerator.bias = 0.0005;

            // --- Materials ---
            const matRock = new BABYLON.StandardMaterial("matRock", scene);
            matRock.diffuseColor = new BABYLON.Color3(0.35, 0.32, 0.38);
            matRock.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

            const matGrass = new BABYLON.StandardMaterial("matGrass", scene);
            matGrass.diffuseColor = new BABYLON.Color3(0.22, 0.55, 0.18);
            matGrass.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

            const matStone = new BABYLON.StandardMaterial("matStone", scene);
            matStone.diffuseColor = new BABYLON.Color3(0.75, 0.72, 0.68);
            matStone.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const matDarkStone = new BABYLON.StandardMaterial("matDarkStone", scene);
            matDarkStone.diffuseColor = new BABYLON.Color3(0.45, 0.42, 0.4);
            matDarkStone.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const matWood = new BABYLON.StandardMaterial("matWood", scene);
            matWood.diffuseColor = new BABYLON.Color3(0.45, 0.27, 0.15);
            matWood.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const matDarkWood = new BABYLON.StandardMaterial("matDarkWood", scene);
            matDarkWood.diffuseColor = new BABYLON.Color3(0.25, 0.15, 0.08);
            matDarkWood.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const matPlaster = new BABYLON.StandardMaterial("matPlaster", scene);
            matPlaster.diffuseColor = new BABYLON.Color3(0.85, 0.78, 0.65);
            matPlaster.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const matRoofRed = new BABYLON.StandardMaterial("matRoofRed", scene);
            matRoofRed.diffuseColor = new BABYLON.Color3(0.65, 0.2, 0.15);
            matRoofRed.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const matRoofBlue = new BABYLON.StandardMaterial("matRoofBlue", scene);
            matRoofBlue.diffuseColor = new BABYLON.Color3(0.15, 0.35, 0.55);
            matRoofBlue.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const matRoofPurple = new BABYLON.StandardMaterial("matRoofPurple", scene);
            matRoofPurple.diffuseColor = new BABYLON.Color3(0.4, 0.2, 0.5);
            matRoofPurple.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const matLeaf = new BABYLON.StandardMaterial("matLeaf", scene);
            matLeaf.diffuseColor = new BABYLON.Color3(0.12, 0.38, 0.15);
            matLeaf.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

            const matLeafDark = new BABYLON.StandardMaterial("matLeafDark", scene);
            matLeafDark.diffuseColor = new BABYLON.Color3(0.08, 0.28, 0.12);
            matLeafDark.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

            // Procedural Water Texture
            const waterTexture = new BABYLON.DynamicTexture("waterTex", {width: 512, height: 512}, scene, false);
            waterTexture.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
            waterTexture.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
            
            const matWater = new BABYLON.StandardMaterial("matWater", scene);
            matWater.diffuseTexture = waterTexture;
            matWater.diffuseColor = new BABYLON.Color3(0.1, 0.6, 0.7);
            matWater.emissiveColor = new BABYLON.Color3(0.05, 0.3, 0.35);
            matWater.specularColor = new BABYLON.Color3(0.8, 0.9, 1.0);
            matWater.specularPower = 64;
            matWater.alpha = 0.85;

            const matWaterFall = new BABYLON.StandardMaterial("matWaterFall", scene);
            matWaterFall.diffuseColor = new BABYLON.Color3(0.8, 0.95, 1.0);
            matWaterFall.emissiveColor = new BABYLON.Color3(0.4, 0.6, 0.7);
            matWaterFall.specularColor = new BABYLON.Color3(1.0, 1.0, 1.0);
            matWaterFall.alpha = 0.6;

            // --- Diorama Base ---
            // Top Grass Island
            const islandTop = BABYLON.MeshBuilder.CreateCylinder("islandTop", {diameterTop: 100, diameterBottom: 90, height: 8, tessellation: 24}, scene);
            islandTop.position.y = 0;
            islandTop.material = matGrass;
            islandTop.receiveShadows = true;

            // Grassy overhang
            const overhang = BABYLON.MeshBuilder.CreateCylinder("overhang", {diameterTop: 90, diameterBottom: 100, height: 3, tessellation: 24}, scene);
            overhang.position.y = -5;
            overhang.material = matGrass;
            overhang.receiveShadows = true;

            // Steep Rocky Cliff Bottom
            const cliff = BABYLON.MeshBuilder.CreateSphere("cliff", {diameter: 95, segments: 16, slice: 0.5}, scene);
            cliff.scaling.y = 1.5;
            cliff.position.y = -35;
            cliff.material = matRock;
            
            // Apply random vertex displacement for jagged rocks
            let positions = cliff.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                if (positions[i + 1] > -30) { // Only deform the lower parts
                    let rx = (Math.random() - 0.5) * 4;
                    let ry = (Math.random() - 0.5) * 4;
                    let rz = (Math.random() - 0.5) * 4;
                    positions[i] += rx;
                    positions[i + 1] += ry;
                    positions[i + 2] += rz;
                }
            }
            cliff.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
            cliff.convertToFlatShadedMesh(); // Crisp stylized facets

            // --- River System ---
            // The river is a curved ribbon mesh sitting on top of the island
            const riverPath = [
                new BABYLON.Vector3(-40, 0.1, 20),
                new BABYLON.Vector3(-20, 0.1, 25),
                new BABYLON.Vector3(0, 0.1, 10),
                new BABYLON.Vector3(15, 0.1, -15),
                new BABYLON.Vector3(35, 0.1, -25) // Edge of island
            ];
            const river = BABYLON.MeshBuilder.CreateRibbon("river", { 
                pathArray: [riverPath, riverPath.map(p => new BABYLON.Vector3(p.x, p.y - 1, p.z))], 
                widthArray: [8, 10, 9, 11, 8], 
                sideOrientation: BABYLON.Mesh.DOUBLESIDE 
            }, scene);
            river.material = matWater;
            
            // Waterfall flowing off the edge
            const waterfall = BABYLON.MeshBuilder.CreatePlane("waterfall", {width: 12, height: 40}, scene);
            waterfall.position.x = 36;
            waterfall.position.y = -20;
            waterfall.position.z = -26;
            waterfall.rotation.y = Math.PI / 4;
            waterfall.rotation.z = -0.1;
            waterfall.material = matWaterFall;
            animatedWater.push(waterfall); // Animate UVs later

            // --- Castle Generation ---
            function createCastle() {
                const castleRoot = new BABYLON.TransformNode("castle", scene);
                castleRoot.position = new BABYLON.Vector3(0, 4, -15);

                // Central Keep
                const keepBase = BABYLON.MeshBuilder.CreateBox("keepBase", {width: 14, height: 10, depth: 14}, scene);
                keepBase.position.y = 5;
                keepBase.material = matStone;
                keepBase.parent = castleRoot;
                shadowGenerator.addShadowCaster(keepBase);

                const keepMid = BABYLON.MeshBuilder.CreateBox("keepMid", {width: 12, height: 6, depth: 12}, scene);
                keepMid.position.y = 13;
                keepMid.material = matStone;
                keepMid.parent = castleRoot;
                shadowGenerator.addShadowCaster(keepMid);

                const keepTop = BABYLON.MeshBuilder.CreateBox("keepTop", {width: 14, height: 3, depth: 14}, scene);
                keepTop.position.y = 17.5;
                keepTop.material = matDarkStone;
                keepTop.parent = castleRoot;
                shadowGenerator.addShadowCaster(keepTop);

                // Keep Tower
                const keepTower = BABYLON.MeshBuilder.CreateCylinder("keepTower", {diameter: 8, height: 10, tessellation: 12}, scene);
                keepTower.position.y = 24;
                keepTower.material = matStone;
                keepTower.parent = castleRoot;
                shadowGenerator.addShadowCaster(keepTower);

                const keepTowerRoof = BABYLON.MeshBuilder.CreateCylinder("keepTowerRoof", {diameterTop: 0, diameterBottom: 9, height: 6, tessellation: 12}, scene);
                keepTowerRoof.position.y = 32;
                keepTowerRoof.material = matRoofBlue;
                keepTowerRoof.parent = castleRoot;
                shadowGenerator.addShadowCaster(keepTowerRoof);

                // Corner Towers
                const towerPositions = [
                    {x: -12, z: -12}, {x: 12, z: -12}, 
                    {x: -12, z: 12}, {x: 12, z: 12}
                ];

                towerPositions.forEach((pos, i) => {
                    const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + i, {diameter: 7, height: 14, tessellation: 12}, scene);
                    tower.position.x = pos.x;
                    tower.position.z = pos.z;
                    tower.position.y = 7;
                    tower.material = matStone;
                    tower.parent = castleRoot;
                    shadowGenerator.addShadowCaster(tower);

                    const towerTop = BABYLON.MeshBuilder.CreateCylinder("towerTop" + i, {diameter: 8, height: 2, tessellation: 12}, scene);
                    towerTop.position.x = pos.x;
                    towerTop.position.z = pos.z;
                    towerTop.position.y = 15;
                    towerTop.material = matDarkStone;
                    towerTop.parent = castleRoot;
                    shadowGenerator.addShadowCaster(towerTop);

                    const roof = BABYLON.MeshBuilder.CreateCylinder("roof" + i, {diameterTop: 0, diameterBottom: 8, height: 6, tessellation: 12}, scene);
                    roof.position.x = pos.x;
                    roof.position.z = pos.z;
                    roof.position.y = 19;
                    roof.material = matRoofPurple;
                    roof.parent = castleRoot;
                    shadowGenerator.addShadowCaster(roof);
                });

                // Connecting Walls
                const wallData = [
                    {p1: {x: -12, z: -12}, p2: {x: -12, z: 12}},
                    {p1: {x: 12, z: -12}, p2: {x: 12, z: 12}},
                    {p1: {x: -12, z: -12}, p2: {x: 12, z: -12}},
                    {p1: {x: -12, z: 12}, p2: {x: 12, z: 12}}
                ];

                wallData.forEach((w, i) => {
                    const dx = w.p2.x - w.p1.x;
                    const dz = w.p2.z - w.p1.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);
                    
                    const wall = BABYLON.MeshBuilder.CreateBox("wall" + i, {width: dist, height: 8, depth: 2}, scene);
                    wall.position.x = w.p1.x + dx/2;
                    wall.position.z = w.p1.z + dz/2;
                    wall.position.y = 4;
                    wall.rotation.y = Math.atan2(dz, dx) - Math.PI/2;
                    wall.material = matStone;
                    wall.parent = castleRoot;
                    shadowGenerator.addShadowCaster(wall);

                    const battlement = BABYLON.MeshBuilder.CreateBox("battlement" + i, {width: dist, height: 1.5, depth: 2.5}, scene);
                    battlement.position.x = w.p1.x + dx/2;
                    battlement.position.z = w.p1.z + dz/2;
                    battlement.position.y = 8.75;
                    battlement.rotation.y = Math.atan2(dz, dx) - Math.PI/2;
                    battlement.material = matDarkStone;
                    battlement.parent = castleRoot;
                    shadowGenerator.addShadowCaster(battlement);
                });

                // Flags
                function createFlag(x, y, z, color) {
                    const pole = BABYLON.MeshBuilder.CreateCylinder("pole", {diameter: 0.2, height: 4, tessellation: 6}, scene);
                    pole.position.set(x, y, z);
                    pole.material = matDarkWood;
                    pole.parent = castleRoot;
                    
                    const flag = BABYLON.MeshBuilder.CreatePlane("flag", {width: 2, height: 1.5}, scene);
                    flag.position.set(x + 1, y + 1.5, z);
                    flag.material = color;
                    flag.parent = castleRoot;
                }
                createFlag(0, 35, 0, matRoofRed);
                createFlag(-12, 21, -12, matRoofRed);
                createFlag(12, 21, -12, matRoofRed);

                return castleRoot;
            }
            createCastle();

            // --- Tree Generation ---
            function createTree(x, z, scale = 1, dark = false) {
                const treeRoot = new BABYLON.TransformNode("tree", scene);
                treeRoot.position = new BABYLON.Vector3(x, 4, z);
                treeRoot.scaling = new BABYLON.Vector3(scale, scale, scale);

                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {diameterTop: 0.5, diameterBottom: 0.8, height: 3, tessellation: 6}, scene);
                trunk.position.y = 1.5;
                trunk.material = matDarkWood;
                trunk.parent = treeRoot;
                shadowGenerator.addShadowCaster(trunk);
                dynamicShadows.push(trunk); // For slight wind sway

                const leafColor = dark ? matLeafDark : matLeaf;
                
                const c1 = BABYLON.MeshBuilder.CreateCylinder("c1", {diameterTop: 0, diameterBottom: 3, height: 3, tessellation: 8}, scene);
                c1.position.y = 3.5;
                c1.material = leafColor;
                c1.parent = treeRoot;
                shadowGenerator.addShadowCaster(c1);
                dynamicShadows.push(c1);

                const c2 = BABYLON.MeshBuilder.CreateCylinder("c2", {diameterTop: 0, diameterBottom: 2.5, height: 2.5, tessellation: 8}, scene);
                c2.position.y = 5.5;
                c2.material = leafColor;
                c2.parent = treeRoot;
                shadowGenerator.addShadowCaster(c2);
                dynamicShadows.push(c2);

                const c3 = BABYLON.MeshBuilder.CreateCylinder("c3", {diameterTop: 0, diameterBottom: 1.5, height: 2, tessellation: 8}, scene);
                c3.position.y = 7;
                c3.material = leafColor;
                c3.parent = treeRoot;
                shadowGenerator.addShadowCaster(c3);
                dynamicShadows.push(c3);
            }

            // Scatter trees
            const treePositions = [
                {x: -25, z: -35, s: 1.2, d: true}, {x: -15, z: -45, s: 1.0, d: false},
                {x: 25, z: -35, s: 1.1, d: true}, {x: 35, z: -45, s: 1.3, d: true},
                {x: -35, z: 0, s: 1.0, d: false}, {x: -40, z: 10, s: 0.9, d: true},
                {x: 35, z: 0, s: 1.2, d: false}, {x: 40, z: 10, s: 1.0, d: true},
                {x: -20, z: 40, s: 1.1, d: false}, {x: -10, z: 35, s: 0.8, d: true},
                {x: 10, z: 35, s: 1.0, d: false}, {x: 20, z: 40, s: 1.2, d: true},
                {x: 0, z: -45, s: 1.0, d: false}
            ];
            treePositions.forEach(t => createTree(t.x, t.z, t.s, t.d));

            // --- House Generation ---
            function createHouse(x, z, rotY, type = "wood") {
                const houseRoot = new BABYLON.TransformNode("house", scene);
                houseRoot.position = new BABYLON.Vector3(x, 4, z);
                houseRoot.rotation.y = rotY;

                const baseMat = type === "plaster" ? matPlaster : matWood;
                const roofMat = type === "plaster" ? matRoofRed : matRoofBlue;

                const base = BABYLON.MeshBuilder.CreateBox("houseBase", {width: 6, height: 4, depth: 6}, scene);
                base.position.y = 2;
                base.material = baseMat;
                base.parent = houseRoot;
                shadowGenerator.addShadowCaster(base);

                const roof = BABYLON.MeshBuilder.CreateCylinder("houseRoof", {diameterTop: 0, diameterBottom: 8.5, height: 4, tessellation: 4}, scene);
                roof.position.y = 6;
                roof.rotation.y = Math.PI / 4;
                roof.material = roofMat;
                roof.parent = houseRoot;
                shadowGenerator.addShadowCaster(roof);

                // Chimney
                const chim = BABYLON.MeshBuilder.CreateBox("chim", {width: 0.8, height: 2, depth: 0.8}, scene);
                chim.position.set(1.5, 6, 1.5);
                chim.material = matDarkStone;
                chim.parent = houseRoot;
                shadowGenerator.addShadowCaster(chim);

                // Window/Door
                const door = BABYLON.MeshBuilder.CreateBox("door", {width: 1, height: 2, depth: 0.1}, scene);
                door.position.set(0, 1, 3.05);
                door.material = matDarkWood;
                door.parent = houseRoot;

                const window1 = BABYLON.MeshBuilder.CreateBox("w1", {width: 1, height: 1, depth: 0.1}, scene);
                window1.position.set(-2, 2.5, 3.05);
                window1.material = matRoofBlue; // Acting as glowing glass
                window1.emissiveColor = new BABYLON.Color3(0.8, 0.7, 0.3); // Need standard mat instance for this, but for stylized look, just tinted is okay. 
                // Wait, standard materials need to be unique for emissive. Let's skip individual emissive to save perf, just use color.
                window1.material = matDarkWood;
                window1.parent = houseRoot;

                return houseRoot;
            }

            // Village Layout
            createHouse(-20, 10, -0.5, "plaster");
            createHouse(-10, 15, -0.2, "wood");
            createHouse(10, 20, 0.5, "plaster");
            createHouse(20, 10, 1.0, "wood");
            createHouse(-30, 5, 1.5, "plaster");
            createHouse(30, 15, 2.0, "wood");
            createHouse(-5, 25, Math.PI, "plaster"); // Tavern (slightly larger conceptually)

            // --- Riverside Mill ---
            function createMill() {
                const millRoot = new BABYLON.TransformNode("mill", scene);
                millRoot.position = new BABYLON.Vector3(-20, 4, 25); // By the river

                const base = BABYLON.MeshBuilder.CreateBox("millBase", {width: 7, height: 5, depth: 7}, scene);
                base.position.y = 2.5;
                base.material = matPlaster;
                base.parent = millRoot;
                shadowGenerator.addShadowCaster(base);

                const roof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {diameterTop: 0, diameterBottom: 9, height: 3, tessellation: 12}, scene);
                roof.position.y = 6.5;
                roof.material = matRoofRed;
                roof.parent = millRoot;
                shadowGenerator.addShadowCaster(roof);

                // Water Wheel
                const wheelParent = new BABYLON.TransformNode("wheelParent", scene);
                wheelParent.parent = millRoot;
                wheelRoot = wheelParent; // Global reference for animation
                wheelParent.position.set(0, 1.5, 4); // Outside the mill

                const wheelRing = BABYLON.MeshBuilder.CreateTorus("wheelRing", {diameter: 5, thickness: 0.3, tessellation: 16}, scene);
                wheelRing.parent = wheelParent;
                wheelRing.material = matDarkWood;
                shadowGenerator.addShadowCaster(wheelRing);

                const wheelHub = BABYLON.MeshBuilder.CreateCylinder("wheelHub", {diameter: 0.8, height: 1, tessellation: 8}, scene);
                wheelHub.parent = wheelParent;
                wheelHub.rotation.x = Math.PI / 2;
                wheelHub.material = matDarkWood;
                shadowGenerator.addShadowCaster(wheelHub);

                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const spoke = BABYLON.MeshBuilder.CreateBox("spoke", {width: 0.2, height: 4.5, depth: 0.2}, scene);
                    spoke.parent = wheelParent;
                    spoke.rotation.z = angle;
                    spoke.material = matDarkWood;
                    shadowGenerator.addShadowCaster(spoke);

                    const blade = BABYLON.MeshBuilder.CreateBox("blade", {width: 1.5, height: 0.8, depth: 0.1}, scene);
                    blade.parent = wheelParent;
                    blade.position.z = 0; // Center
                    blade.rotation.z = angle;
                    // Offset blade to end of spoke
                    blade.position.x = Math.cos(angle) * 2;
                    blade.position.y = Math.sin(angle) * 2;
                    blade.material = matWood;
                    shadowGenerator.addShadowCaster(blade);
                }
            }
            createMill();

            // --- Market Stalls ---
            function createStall(x, z, rotY, color) {
                const stallRoot = new BABYLON.TransformNode("stall", scene);
                stallRoot.position = new BABYLON.Vector3(x, 4, z);
                stallRoot.rotation.y = rotY;

                const post1 = BABYLON.MeshBuilder.CreateBox("p1", {width: 0.3, height: 3, depth: 0.3}, scene);
                post1.position.set(-1.5, 1.5, 0);
                post1.material = matDarkWood;
                post1.parent = stallRoot;
                shadowGenerator.addShadowCaster(post1);

                const post2 = post1.clone("p2");
                post2.position.x = 1.5;
                post2.parent = stallRoot;

                const post3 = post1.clone("p3");
                post3.position.z = -1.5;
                post3.parent = stallRoot;

                const post4 = post1.clone("p4");
                post4.position.set(1.5, 1.5, -1.5);
                post4.parent = stallRoot;

                const table = BABYLON.MeshBuilder.CreateBox("table", {width: 3.5, height: 0.3, depth: 2}, scene);
                table.position.y = 1.2;
                table.material = matWood;
                table.parent = stallRoot;
                shadowGenerator.addShadowCaster(table);

                const canvasMat = new BABYLON.StandardMaterial("canvasMat", scene);
                canvasMat.diffuseColor = color;
                canvasMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

                const roof = BABYLON.MeshBuilder.CreateBox("sroof", {width: 4, height: 0.1, depth: 2.5}, scene);
                roof.position.y = 3;
                roof.rotation.z = 0.1;
                roof.material = canvasMat;
                roof.parent = stallRoot;
                shadowGenerator.addShadowCaster(roof);
            }
            createStall(15, 10, 0, new BABYLON.Color3(0.8, 0.3, 0.3));
            createStall(20, 15, -0.5, new BABYLON.Color3(0.3, 0.6, 0.8));
            createStall(10, 5, 1.0, new BABYLON.Color3(0.8, 0.7, 0.3));

            // --- Wooden Bridges ---
            function createBridge(x, z, rotY, length = 10) {
                const bridgeRoot = new BABYLON.TransformNode("bridge", scene);
                bridgeRoot.position = new BABYLON.Vector3(x, 4.1, z);
                bridgeRoot.rotation.y = rotY;

                const planks = BABYLON.MeshBuilder.CreateBox("planks", {width: length, height: 0.3, depth: 3}, scene);
                planks.position.y = 0.5;
                planks.material = matWood;
                planks.parent = bridgeRoot;
                shadowGenerator.addShadowCaster(planks);

                // Railings
                for (let i = -1; i <= 1; i += 2) {
                    const railTop = BABYLON.MeshBuilder.CreateBox("railTop", {width: length, height: 0.2, depth: 0.2}, scene);
                    railTop.position.set(0, 1.5, i * 1.5);
                    railTop.material = matDarkWood;
                    railTop.parent = bridgeRoot;
                    shadowGenerator.addShadowCaster(railTop);

                    for(let j = 0; j < 5; j++) {
                        const post = BABYLON.MeshBuilder.CreateBox("rpost", {width: 0.15, height: 1.5, depth: 0.15}, scene);
                        post.position.set(-length/2 + 2 + j*(length/4), 0.75, i * 1.5);
                        post.material = matDarkWood;
                        post.parent = bridgeRoot;
                        shadowGenerator.addShadowCaster(post);
                    }
                }
            }
            // Bridges crossing the river
            createBridge(-20, 22, Math.PI / 2.5, 12);
            createBridge(10, -2, Math.PI / 2, 10);

            // --- Ruined Watchtower ---
            function createRuin() {
                const ruinRoot = new BABYLON.TransformNode("ruin", scene);
                ruinRoot.position = new BABYLON.Vector3(35, 4, 35);

                const base = BABYLON.MeshBuilder.CreateCylinder("ruinBase", {diameter: 8, height: 8, tessellation: 12}, scene);
                base.position.y = 4;
                base.material = matDarkStone;
                base.parent = ruinRoot;
                shadowGenerator.addShadowCaster(base);

                // Jagged broken top
                const broken1 = BABYLON.MeshBuilder.CreateCylinder("b1", {diameter: 8, height: 4, tessellation: 12}, scene);
                broken1.position.y = 10;
                broken1.position.x = 1;
                broken1.rotation.z = 0.2;
                broken1.material = matDarkStone;
                broken1.parent = ruinRoot;
                shadowGenerator.addShadowCaster(broken1);

                const broken2 = BABYLON.MeshBuilder.CreateCylinder("b2", {diameter: 6, height: 3, tessellation: 12}, scene);
                broken2.position.y = 12.5;
                broken2.position.x = -1;
                broken2.rotation.z = -0.3;
                broken2.material = matDarkStone;
                broken2.parent = ruinRoot;
                shadowGenerator.addShadowCaster(broken2);

                // Scattered debris
                const debris1 = BABYLON.MeshBuilder.CreateBox("d1", {width: 2, height: 2, depth: 2}, scene);
                debris1.position.set(4, 1, 2);
                debris1.rotation.y = 0.5;
                debris1.material = matDarkStone;
                debris1.parent = ruinRoot;
                shadowGenerator.addShadowCaster(debris1);

                const debris2 = BABYLON.MeshBuilder.CreateBox("d2", {width: 1.5, height: 1.5, depth: 1.5}, scene);
                debris2.position.set(-4, 0.75, -3);
                debris2.rotation.set(0.2, 0.8, 0.1);
                debris2.material = matDarkStone;
                debris2.parent = ruinRoot;
                shadowGenerator.addShadowCaster(debris2);
            }
            createRuin();

            // --- Post Processing (The "Miniature" Look) ---
            const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
            
            // Depth of Field
            pipeline.depthOfFieldEnabled = true;
            pipeline.depthOfFieldBlurLevel = BABYLON.DepthOfFieldEffectBlurLevel.High;
            pipeline.depthOfField.focalLength = 120; // mm
            pipeline.depthOfField.fStop = 1.4; // Very shallow DOF
            pipeline.depthOfField.focusDistance = 2000; // mm (distance to model)

            // Image Processing
            pipeline.imageProcessing.contrast = 1.4;
            pipeline.imageProcessing.exposure = 1.1;
            pipeline.imageProcessing.toneMappingEnabled = true;
            pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
            pipeline.imageProcessing.vignetteEnabled = true;
            pipeline.imageProcessing.vignetteWeight = 1.5;
            pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 0.5);

            // Bloom
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.7;
            pipeline.bloomWeight = 0.5;
            pipeline.bloomKernel = 64;
            pipeline.bloomScale = 0.5;

            // FXAA
            pipeline.fxaaEnabled = true;
            pipeline.samples = 4; // MSAA

            // --- Particle Systems ---
            // 1. Smoke from village chimneys
            const smokeSystem = new BABYLON.ParticleSystem("smoke", 200, scene);
            smokeSystem.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
            smokeSystem.emitter = new BABYLON.Vector3(-15, 12, 10); // Above a house
            smokeSystem.minEmitBox = new BABYLON.Vector3(-0.5, 0, -0.5);
            smokeSystem.maxEmitBox = new BABYLON.Vector3(0.5, 0, 0.5);
            smokeSystem.color1 = new BABYLON.Color4(0.5, 0.5, 0.5, 0.3);
            smokeSystem.color2 = new BABYLON.Color4(0.3, 0.3, 0.3, 0.2);
            smokeSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
            smokeSystem.minSize = 0.5;
            smokeSystem.maxSize = 3;
            smokeSystem.minLifeTime = 1.5;
            smokeSystem.maxLifeTime = 3;
            smokeSystem.emitRate = 20;
            smokeSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
            smokeSystem.gravity = new BABYLON.Vector3(0, 1, 0);
            smokeSystem.direction1 = new BABYLON.Vector3(-0.5, 1, -0.5);
            smokeSystem.direction2 = new BABYLON.Vector3(0.5, 1, 0.5);
            smokeSystem.minEmitPower = 0.5;
            smokeSystem.maxEmitPower = 1;
            smokeSystem.updateSpeed = 0.01;
            smokeSystem.start();

            // 2. Floating ambient dust/sparkles
            const dustSystem = new BABYLON.ParticleSystem("dust", 300, scene);
            dustSystem.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
            dustSystem.emitter = new BABYLON.Vector3(0, 0, 0); // Center of island
            dustSystem.minEmitBox = new BABYLON.Vector3(-50, 0, -50);
            dustSystem.maxEmitBox = new BABYLON.Vector3(50, 40, 50);
            dustSystem.color1 = new BABYLON.Color4(1, 0.9, 0.7, 0.1);
            dustSystem.color2 = new BABYLON.Color4(0.8, 0.8, 1, 0.1);
            dustSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
            dustSystem.minSize = 0.1;
            dustSystem.maxSize = 0.3;
            dustSystem.minLifeTime = 5;
            dustSystem.maxLifeTime = 10;
            dustSystem.emitRate = 50;
            dustSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
            dustSystem.gravity = new BABYLON.Vector3(0, 0.2, 0);
            dustSystem.direction1 = new BABYLON.Vector3(-0.5, 0.5, -0.5);
            dustSystem.direction2 = new BABYLON.Vector3(0.5, 0.5, 0.5);
            dustSystem.minEmitPower = 0.1;
            dustSystem.maxEmitPower = 0.3;
            dustSystem.updateSpeed = 0.01;
            dustSystem.start();

            // --- Animation Loop ---
            scene.onBeforeRenderObservable.add(() => {
                let time = performance.now() * 0.001;

                // Auto-rotate camera slightly
                if (camera) {
                    camera.alpha += 0.0005;
                }

                // Animate Waterwheel
                if (wheelRoot) {
                    wheelRoot.rotation.x += 0.02;
                }

                // Animate Waterfall UVs
                if (waterfall.material && waterfall.material.diffuseTexture) {
                    // Create texture if it doesn't exist, or just use the offset of the material's texture
                    // Since we used a solid color for waterfall, let's use a Dynamic Texture or just vertex animation
                }
                // Let's animate the waterfall mesh by scaling it slightly to look like flowing
                if (waterfall) {
                    waterfall.scaling.y = 1.0 + Math.sin(time * 5) * 0.02;
                }

                // Animate River Texture
                let ctx = waterTexture.getContext();
                ctx.clearRect(0, 0, 512, 512);
                ctx.fillStyle = "#1A99B0";
                ctx.fillRect(0, 0, 512, 512);
                
                ctx.fillStyle = "#33CCDD";
                for(let i=0; i<20; i++) {
                    let x = (i * 25 + time * 50) % 512;
                    let y = (i * 40 + time * 30) % 512;
                    ctx.beginPath();
                    ctx.ellipse(x, y, 15, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                waterTexture.update();

                // Animate tree wind sway
                dynamicShadows.forEach((mesh, index) => {
                    if (mesh.name.includes("c1") || mesh.name.includes("c2") || mesh.name.includes("c3")) {
                        mesh.rotation.z = Math.sin(time + index) * 0.01;
                    }
                });

                // Animate Flags (simple rotation)
                // (Omitted for brevity, but could rotate flag planes)
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            if (scene) {
                scene.render();
            }
        });

        window.addEventListener('resize', function () {
            engine.resize();
        });

        // Hide loader
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
        }, 500);

    });
    </script>
</body>
</html>
