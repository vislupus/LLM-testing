<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Babylon.js Floating Island Diorama</title>
    <!-- Import Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #87CEEB; /* Sky fallback */
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loadingUI {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; font-size: 24px; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="loadingUI">Generating World...</div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        
        // --- Configuration ---
        const PALETTE = {
            stoneDark: "#5a5a5e",
            stoneLight: "#9aa0a6",
            woodDark: "#5c4033",
            woodLight: "#8b5a2b",
            roofTile: "#a55b42",
            grass: "#6ab04c",
            water: "#48cae4",
            skyTop: "#bde0fe",
            skyBottom: "#caf0f8",
            leaves: "#4a7c59"
        };

        // --- Setup Engine and Scene ---
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            
            // Clean up loading screen
            document.getElementById("loadingUI").style.display = 'none';

            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3.5, 60, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 150;
            camera.wheelPrecision = 50;

            // Lights
            const hemiLight = new BABYLON.HemisphereLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;
            hemiLight.groundColor = new BABYLON.Color3(0.8, 0.8, 0.6);

            const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(20, 40, 20);
            dirLight.shadowEnabled = true;
            
            const shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            // Background/Fog
            scene.clearColor = new BABYLON.Color4(0.6, 0.8, 0.9, 1.0);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogDensity = 0.005;
            scene.backgroundGradientTop = BABYLON.Color3.Parse(PALETTE.skyTop);
            scene.backgroundGradientBottom = BABYLON.Color3.Parse(PALETTE.skyBottom);
            scene.backgroundGradientStartAngle = 0;
            scene.backgroundGradientEndAngle = 2 * Math.PI;
            scene.enableClouds = false;

            // Materials
            const matStone = new BABYLON.StandardMaterial("stoneMat", scene);
            matStone.diffuseColor = new BABYLON.Color3(0.35, 0.35, 0.38);
            matStone.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            
            const matGrass = new BABYLON.StandardMaterial("grassMat", scene);
            matGrass.diffuseColor = new BABYLON.Color3(0.4, 0.7, 0.3);
            
            const matWater = new BABYLON.StandardMaterial("waterMat", scene);
            matWater.diffuseColor = new BABYLON.Color3(0.15, 0.6, 0.75);
            matWater.specularColor = new BABYLON.Color3(0.3, 0.6, 0.8);
            matWater.alpha = 0.8;

            const matWood = new BABYLON.StandardMaterial("woodMat", scene);
            matWood.diffuseColor = new BABYLON.Color3(0.5, 0.35, 0.25);

            const matRoof = new BABYLON.StandardMaterial("roofMat", scene);
            matRoof.diffuseColor = new BABYLON.Color3(0.6, 0.3, 0.25);

            // --- Procedural Builder Helpers ---
            
            function createBlock(x, y, z, s, mat) {
                return BABYLON.MeshBuilder.CreateBox("blk", {width: s, height: s, depth: s}, scene);
            }

            function createTunnel(width, height, length) {
                 return BABYLON.MeshBuilder.CreateCylinder("tun", {diameter: width, height: length}, scene);
            }

            // --- 1. Terrain Generation (Island) ---
            const islandGroup = new BABYLON.TransformNode("island");
            islandGroup.parent = scene.rootContainer; // Free floating
            
            // We need noise-like terrain. Since we can't load an image texture heightmap easily without CORS,
            // we will build "chunks" of terrain.
            
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.3, 0.6, 0.2);
            groundMat.wireframe = false; // Set wireframe if debugging

            // Create a base rocky layer
            const rockCount = 40;
            const rocks = [];
            for(let i=0; i<rockCount; i++) {
                const size = Math.random() * 5 + 2;
                const mesh = BABYLON.MeshBuilder.CreateBox(`r${i}`, {height: size/2, width: size, depth: size}, scene);
                // Random placement in radius ~40
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 45;
                mesh.position = new BABYLON.Vector3(Math.cos(angle)*dist, -size/2, Math.sin(angle)*dist);
                mesh.material = matStone;
                rocks.push(mesh);
                shadowGenerator.getShadowMap().renderList.push(mesh);
            }

            // Add a layer of grass on top of center area
            const groundPlane = BABYLON.MeshBuilder.CreateGround("ground", {width: 60, height: 60}, scene);
            groundPlane.position.y = 2; 
            // Flatten the center slightly so buildings go on top? 
            // Actually, let's make the center a plateau by creating a cylinder
            const plateau = BABYLON.MeshBuilder.CreateCylinder("plateau", {height: 5, diameter: 40}, scene);
            plateau.position.y = 3.5;
            plateau.scaling.y *= 1.2;
            plateau.material = matGrass;
            plateau.receiveShadows = true;
            shadowGenerator.getShadowMap().renderList.push(plateau);

            // Scattered Rocks (Peaks)
            const mountainPositions = [
                {x: 10, z: 20}, {x: -15, z: 25}, {x: 20, z: -15}, {x: -25, z: -10}
            ];
            
            mountainPositions.forEach(pos => {
                const mtnHeight = Math.random() * 8 + 10;
                const mtn = BABYLON.MeshBuilder.CreateCylinder("mtn", {diameterTop: 0, diameterBottom: 12, height: mtnHeight}, scene);
                mtn.position = new BABYLON.Vector3(pos.x, mtnHeight/2, pos.z);
                mtn.rotation.z = Math.random(); // irregular shape
                mtn.rotation.y = Math.random();
                mtn.material = matStone;
                mtn.parent = islandGroup;
                shadowGenerator.getShadowMap().renderList.push(mtn);
            });

            // --- 2. River & Bridge ---
            const riverGroup = new BABYLON.TransformNode("river_group");
            
            // Main River Channel
            const riverPath = [];
            // Hardcoded winding path
            riverPath.push(new BABYLON.Vector3(10, -1, -20));
            riverPath.push(new BABYLON.Vector3(15, -1, 5));
            riverPath.push(new BABYLON.Vector3(5, -1, 15));
            riverPath.push(new BABYLON.Vector3(-10, -1, 10));
            riverPath.push(new BABYLON.Vector3(-15, -1, -15));

            // Visual River Mesh
            for (let i = 0; i < riverPath.length - 1; i++) {
                const start = riverPath[i];
                const end = riverPath[i+1];
                const len = start.distance(end);
                const angle = Math.atan2(end.z - start.z, end.x - start.x);
                
                const rivMesh = BABYLON.MeshBuilder.CreateBox("riv", {width: 4, height: 0.5, depth: len}, scene);
                rivMesh.position = new BABYLON.Vector3((start.x + end.x)/2, -0.7, (start.z + end.z)/2);
                rivMesh.rotation.y = angle;
                rivMesh.material = matWater;
                riverGroup.addChild(rivMesh);
            }

            // Wooden Bridges
            const bridgePoints = [{x: -5, z: -1}, {x: 10, z: 0}, {x: 0, z: 12}];
            bridgePoints.forEach(p => {
                const br = BABYLON.MeshBuilder.CreateBox("br", {width: 3, height: 0.2, depth: 12}, scene);
                br.position.set(p.x, -0.1, p.z);
                br.material = matWood;
                br.parent = islandGroup; // Or river group depending on view
                
                // Rails
                const rail1 = BABYLON.MeshBuilder.CreateCylinder("rail1", {diameter: 0.2, height: 2, tessellation: 4}, scene);
                rail1.position.set(p.x-1.5, 0.8, p.z);
                rail1.rotation.z = Math.PI/2;
                const rail2 = BABYLON.MeshBuilder.CreateCylinder("rail2", {diameter: 0.2, height: 2, tessellation: 4}, scene);
                rail2.position.set(p.x+1.5, 0.8, p.z);
                rail2.rotation.z = Math.PI/2;
                
                // Supports under bridge
                for(let k=-4; k<=4; k+=2) {
                    const sup = BABYLON.MeshBuilder.CreateCylinder("sup", {diameter: 0.3, height: 10}, scene);
                    sup.position.set(p.x + (k*0.5), -5.5, p.z);
                    sup.rotation.y = Math.PI; // Vertical upright
                    sup.material = matWood;
                }
            });

            // --- 3. The Castle (Central Keep) ---
            const castleGroup = new BABYLON.TransformNode("castle");
            castleGroup.position.set(5, 4, 5);
            
            // Platform
            const plat = BABYLON.MeshBuilder.CreateCylinder("plat", {diameter: 20, height: 2}, scene);
            plat.position.y = 4;
            plat.material = matStone;
            shadowGenerator.getShadowMap().renderList.push(plat);
            castleGroup.addChild(plat);

            // Main Tower (Keep)
            const mainTower = BABYLON.MeshBuilder.CreateCylinder("keep", {diameter: 8, height: 12, sides: 16}, scene);
            mainTower.position.y = 10;
            mainTower.material = matStone;
            mainTower.parent = castleGroup;
            shadowGenerator.getShadowMap().renderList.push(mainTower);

            // Turrets
            const turrets = [[6, 6], [-6, 6], [-6, -6], [6, -6]];
            turrets.forEach(p => {
                const t = BABYLON.MeshBuilder.CreateCylinder("turret", {diameter: 3, height: 8, sides: 12}, scene);
                const angle = Math.atan2(p[1], p[0]);
                const radius = 10;
                const x = p[0] > 0 ? radius : -radius; // Simplified corners
                const z = p[1] > 0 ? radius : -radius;
                t.position = new BABYLON.Vector3(x, 8, z);
                t.material = matStone;
                castleGroup.addChild(t);
                
                // Conical roofs for turrets
                const cR = BABYLON.MeshBuilder.CreateCylinder("cr", {diameter: 4, height: 3, throttle: 0.1, sides: 16}, scene);
                cR.parent = t;
                cR.material = matRoof;
            });

            // Battlements (Ziggurat tops)
            const battlementCount = 20;
            for(let i=0; i<battlementCount; i++) {
                const b = BABYLON.MeshBuilder.CreateBox("b", {width: 1.5, height: 1, depth: 2}, scene);
                const a = (Math.PI * 2 * i) / battlementCount;
                const r = 4.1; // Just outside the tower radius
                b.position = new BABYLON.Vector3(Math.cos(a)*r, 16, Math.sin(a)*r);
                b.rotation.y = -a; // Face inward
                b.material = matStone;
                castleGroup.addChild(b);
            }

            // Drawbridge
            const drawBridge = BABYLON.MeshBuilder.CreateBox("db", {width: 4, height: 0.5, depth: 6}, scene);
            drawBridge.position.set(8, 4, 0);
            drawBridge.parent = castleGroup;
            drawBridge.material = matWood;

            // --- 4. Village Houses ---
            const villageGroup = new BABYLON.TransformNode("village");
            
            // Simple house factory
            const housePos = [
                {x: -15, z: 10, rx: 0}, {x: -25, z: -5, rx: 1}, {x: -10, z: -20, rx: -1},
                {x: 10, z: -15, rx: 1}, {x: 20, z: -20, rx: -1}, {x: 0, z: 25, rx: 0}
            ];

            housePos.forEach(p => {
                const h = new BABYLON.TransformNode("house");
                h.position.set(p.x, 0, p.z);
                h.rotation.y = p.rx === 1 ? Math.PI/2 : (p.rx === -1 ? -Math.PI/2 : 0);

                // Body
                const body = BABYLON.MeshBuilder.CreateBox("hb", {width: 6, height: 4, depth: 6}, scene);
                body.position.y = 2;
                body.material = matWood;
                h.addChild(body);

                // Roof (Two prisms)
                const roofL = BABYLON.MeshBuilder.CreatePrism("rl", {width: 6, height: 4, depth: 4, thickness: 0.2, capEnabled: false}, scene);
                roofL.position.set(0, 4, 0);
                roofL.rotation.z = -Math.PI/2;
                roofL.material = matRoof;
                h.addChild(roofL);
                
                const roofR = BABYLON.MeshBuilder.CreatePrism("rr", {width: 6, height: 4, depth: 4, thickness: 0.2, capEnabled: false}, scene);
                roofR.position.set(0, 4, 0);
                roofR.rotation.z = -Math.PI/2;
                roofR.scaling.x = -1;
                roofR.material = matRoof;
                h.addChild(roofR);

                // Door
                const d = BABYLON.MeshBuilder.CreateBox("d", {width: 1, height: 2, depth: 0.2}, scene);
                d.position.set(0, 1, 3.05);
                d.material = matStone;
                h.addChild(d);

                villageGroup.addChild(h);
            });

            // Tavern Sign
            const sign = BABYLON.MeshBuilder.CreateBox("sign", {width: 2, height: 3}, scene);
            sign.position.set(-15, 4, 10);
            sign.material = matRoof;
            villageGroup.addChild(sign);

            // --- 5. Ruined Watchtower ---
            const watcherGroup = new BABYLON.TransformNode("watcher");
            watcherGroup.position.set(-20, 0, -10);
            // On the edge cliff
            const wBody = BABYLON.MeshBuilder.CreateBox("wb", {width: 3, height: 10, depth: 3}, scene);
            wBody.position.y = 5;
            wBody.material = matStone;
            watcherGroup.addChild(wBody);
            // Broken stairs
            const st = BABYLON.MeshBuilder.CreateBox("st", {width: 2, height: 0.5, depth: 2}, scene);
            st.position.set(0, -1, 0);
            st.parent = watcherGroup;
            
            // Make it look broken (rotate parts randomly?) - simplified here
            
            // --- 6. Nature Trees ---
            const treePos = [
                {x:-30, z:-30}, {x:-30, z:-10}, {x:30, z:30}, {x:30, z:-30}, 
                {x:10, z:-25}, {x:-10, z:30}, {x:-25, z:15}, {x:25, z:15}
            ];
            
            treePos.forEach(p => {
                const tr = new BABYLON.TransformNode("tree");
                tr.position.set(p.x, 0, p.z);
                
                // Trunk
                const trunk = BABYLON.MeshBuilder.CreateCylinder("tr", {diameter: 1, height: 3}, scene);
                trunk.position.y = 1.5;
                trunk.material = matWood;
                tr.addChild(trunk);

                // Leaves (Pine style cone stack)
                const leafL = BABYLON.MeshBuilder.CreateCylinder("lfL", {diameter: 4, diameterTop: 0.5, height: 4}, scene);
                leafL.position.y = 3;
                leafL.material = new BABYLON.StandardMaterial("lMat", scene);
                leafL.diffuseColor = PALETTE.leaves;
                leafL.parent = tr;

                const leafM = BABYLON.MeshBuilder.CreateCylinder("lfM", {diameter: 3, diameterTop: 1, height: 3}, scene);
                leafM.position.y = 5;
                leafM.material = leafL.material;
                leafM.parent = tr;

                const leafH = BABYLON.MeshBuilder.CreateCylinder("lfH", {diameter: 2, diameterTop: 1, height: 2}, scene);
                leafH.position.y = 7;
                leafH.material = leafL.material;
                leafH.parent = tr;

                tr.parent = islandGroup;
            });

            // --- 7. Particle System (Floating Dust/Magic) ---
            const particleSystem = new BABYLON.ParticleSystem("particles", 2000, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            particleSystem.emitter = new BABYLON.Vector3(0, 10, 0);
            particleSystem.minEmitBox = new BABYLON.Vector3(-30, 0, -30);
            particleSystem.maxEmitBox = new BABYLON.Vector3(30, 20, 30);
            particleSystem.color1 = new BABYLON.Color4(0.7, 0.8, 1.0, 1.0);
            particleSystem.color2 = new BABYLON.Color4(0.2, 0.5, 1.0, 1.0);
            particleSystem.colorDead = new BABYLON.Color4(0, 0, 0.2, 0.0);
            particleSystem.minSize = 0.1;
            particleSystem.maxSize = 0.5;
            particleSystem.minLifeTime = 10.0;
            particleSystem.maxLifeTime = 30.0;
            particleSystem.emitRate = 50;
            particleSystem.direction1 = new BABYLON.Vector3(-1, 0.5, 0.5);
            particleSystem.direction2 = new BABYLON.Vector3(1, 0.5, -0.5);
            particleSystem.start();

            // --- Animation Loop ---
            scene.registerBeforeRender(function(){
                // Animate particles automatically
                // Could rotate water slightly for shimmer effect, but simple is better for performance
            });

            return scene;
        };

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });

        // Start scene creation and handle async promise
        createScene().then(scene => {
            // If we wanted to access the scene later to change things...
            window.currentScene = scene;
        });
    </script>
</body>
</html>
