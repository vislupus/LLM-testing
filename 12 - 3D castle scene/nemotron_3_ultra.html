<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Island Diorama</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #info { position: fixed; top: 20px; left: 20px; color: #e8d5b7; z-index: 10; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #info h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
        #info p { font-size: 0.9rem; opacity: 0.8; line-height: 1.5; }
        .credit { position: fixed; bottom: 20px; right: 20px; color: #888; font-size: 0.75rem; z-index: 10; }
    </style>
</head>
<body>
    <div id="info">
        <h1>Floating Kingdom of Aelindor</h1>
        <p>High-poly tabletop diorama • Medieval castle, village, waterfalls & ancient ruins</p>
    </div>
    <div class="credit">Built with Babylon.js • Procedural geometry</div>
    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script>
        // ============================================
        // ENGINE & SCENE SETUP
        // ============================================
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color3(0.1, 0.1, 0.18);

        // Camera - slightly tilted for tabletop feel
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 3.2, 140, new BABYLON.Vector3(0, 15, 0), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 60;
        camera.upperRadiusLimit = 220;
        camera.lowerBetaLimit = 0.35;
        camera.upperBetaLimit = Math.PI / 2 - 0.05;
        camera.wheelPrecision = 40;

        // Lighting - soft, warm tabletop illumination
        const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.7;
        hemiLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
        hemiLight.specular = new BABYLON.Color3(0.3, 0.3, 0.3);
        hemiLight.groundColor = new BABYLON.Color3(0.2, 0.15, 0.1);

        const sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5, -1, -0.3), scene);
        sunLight.intensity = 0.9;
        sunLight.diffuse = new BABYLON.Color3(1, 0.98, 0.9);
        sunLight.specular = new BABYLON.Color3(0.6, 0.55, 0.45);
        sunLight.shadowEnabled = true;

        const shadowGenerator = new BABYLON.ShadowGenerator(2048, sunLight);
        shadowGenerator.useBlurExponentialShadowMap = true;
        shadowGenerator.blurScale = 2;
        shadowGenerator.setDarkness(0.35);

        // Ambient occlusion feel via extra fill lights
        const fillLight1 = new BABYLON.DirectionalLight("fill1", new BABYLON.Vector3(1, 0.5, 0.5), scene);
        fillLight1.intensity = 0.25;
        fillLight1.diffuse = new BABYLON.Color3(0.3, 0.4, 0.6);
        fillLight1.specular = BABYLON.Color3.Black();

        const fillLight2 = new BABYLON.DirectionalLight("fill2", new BABYLON.Vector3(0, 0.5, -1), scene);
        fillLight2.intensity = 0.15;
        fillLight2.diffuse = new BABYLON.Color3(0.6, 0.5, 0.3);
        fillLight2.specular = BABYLON.Color3.Black();

        // ============================================
        // MATERIAL LIBRARY - Vibrant stylized palette
        // ============================================
        const mats = {};

        function createMat(name, diffuse, roughness = 0.85, metallic = 0.0, emissive = null) {
            const mat = new BABYLON.PBRMaterial(name, scene);
            mat.albedoColor = diffuse;
            mat.roughness = roughness;
            mat.metallic = metallic;
            mat.subSurface.isRefractionEnabled = false;
            if (emissive) { mat.emissiveColor = emissive; }
            mat.disableLighting = false;
            return mat;
        }

        // Core palette
        mats.stoneDark = createMat("stoneDark", new BABYLON.Color3(0.32, 0.3, 0.28));
        mats.stoneMid = createMat("stoneMid", new BABYLON.Color3(0.45, 0.42, 0.38));
        mats.stoneLight = createMat("stoneLight", new BABYLON.Color3(0.58, 0.55, 0.5));
        mats.stoneWarm = createMat("stoneWarm", new BABYLON.Color3(0.5, 0.45, 0.38));
        mats.woodDark = createMat("woodDark", new BABYLON.Color3(0.35, 0.22, 0.12));
        mats.woodMid = createMat("woodMid", new BABYLON.Color3(0.55, 0.35, 0.18));
        mats.woodLight = createMat("woodLight", new BABYLON.Color3(0.7, 0.5, 0.3));
        mats.thatch = createMat("thatch", new BABYLON.Color3(0.4, 0.32, 0.2));
        mats.thatchDark = createMat("thatchDark", new BABYLON.Color3(0.28, 0.22, 0.14));
        mats.grass = createMat("grass", new BABYLON.Color3(0.25, 0.45, 0.18));
        mats.grassBright = createMat("grassBright", new BABYLON.Color3(0.35, 0.55, 0.22));
        mats.grassDark = createMat("grassDark", new BABYLON.Color3(0.18, 0.35, 0.12));
        mats.cliff = createMat("cliff", new BABYLON.Color3(0.38, 0.35, 0.32));
        mats.cliffDark = createMat("cliffDark", new BABYLON.Color3(0.25, 0.23, 0.2));
        mats.water = new BABYLON.PBRMaterial("water", scene);
        mats.water.albedoColor = new BABYLON.Color3(0.05, 0.15, 0.25);
        mats.water.metallic = 0.0;
        mats.water.roughness = 0.1;
        mats.water.environmentIntensity = 0.8;
        mats.water.directIntensity = 0.5;
        mats.water.emissiveColor = new BABYLON.Color3(0.02, 0.08, 0.15);
        mats.waterReflect = new BABYLON.PBRMaterial("waterReflect", scene);
        mats.waterReflect.albedoColor = new BABYLON.Color3(0.1, 0.3, 0.5);
        mats.waterReflect.metallic = 0.9;
        mats.waterReflect.roughness = 0.05;
        mats.roofRed = createMat("roofRed", new BABYLON.Color3(0.65, 0.2, 0.15));
        mats.roofBlue = createMat("roofBlue", new BABYLON.Color3(0.15, 0.25, 0.55));
        mats.roofGreen = createMat("roofGreen", new BABYLON.Color3(0.15, 0.45, 0.2));
        mats.roofBrown = createMat("roofBrown", new BABYLON.Color3(0.4, 0.25, 0.15));
        mats.plank = createMat("plank", new BABYLON.Color3(0.48, 0.32, 0.18));
        mats.leafPine = createMat("leafPine", new BABYLON.Color3(0.12, 0.3, 0.1));
        mats.leafPineBright = createMat("leafPineBright", new BABYLON.Color3(0.18, 0.4, 0.14));
        mats.trunk = createMat("trunk", new BABYLON.Color3(0.3, 0.2, 0.15));
        mats.ruinStone = createMat("ruinStone", new BABYLON.Color3(0.35, 0.33, 0.3));
        mats.cobble = createMat("cobble", new BABYLON.Color3(0.42, 0.4, 0.37));
        mats.path = createMat("path", new BABYLON.Color3(0.45, 0.4, 0.35));
        mats.tavernSign = createMat("tavernSign", new BABYLON.Color3(0.8, 0.3, 0.1), 0.6, 0.0, new BABYLON.Color3(0.15, 0.05, 0.0));
        mats.bannerRed = createMat("bannerRed", new BABYLON.Color3(0.7, 0.15, 0.1), 0.7, 0.0, new BABYLON.Color3(0.1, 0.02, 0.01));
        mats.bannerBlue = createMat("bannerBlue", new BABYLON.Color3(0.1, 0.2, 0.6), 0.7, 0.0, new BABYLON.Color3(0.02, 0.04, 0.12));
        mats.glowWarm = createMat("glowWarm", new BABYLON.Color3(0.2, 0.15, 0.1), 1.0, 0.0, new BABYLON.Color3(0.8, 0.4, 0.1));
        mats.glowCool = createMat("glowCool", new BABYLON.Color3(0.1, 0.15, 0.2), 1.0, 0.0, new BABYLON.Color3(0.1, 0.3, 0.6));

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function rand(min, max) { return Math.random() * (max - min) + min; }
        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function choose(arr) { return arr[randInt(0, arr.length - 1)]; }

        function addShadow(mesh) { shadowGenerator.addShadowCaster(mesh, true); mesh.receiveShadows = true; }
        function setPivot(mesh, x, y, z) { mesh.setPivotPoint(new BABYLON.Vector3(x, y, z), false); }

        // Create a box with optional tapering (for roof)
        function createTaperedBox(name, width, height, depth, topScale, mat, scene) {
            const mesh = BABYLON.MeshBuilder.CreateBox(name, { width, height, depth }, scene);
            const positions = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            if (positions) {
                for (let i = 0; i < positions.length; i += 3) {
                    const y = positions[i + 1];
                    if (y > 0) {
                        const factor = y / (height / 2);
                        positions[i] *= 1 - (1 - topScale) * factor;
                        positions[i + 2] *= 1 - (1 - topScale) * factor;
                    }
                }
                mesh.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
                BABYLON.VertexData.ComputeNormals(positions, mesh.getIndices(), mesh.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                mesh.setVerticesData(BABYLON.VertexBuffer.NormalKind, mesh.getVerticesData(BABYLON.VertexBuffer.NormalKind));
            }
            mesh.material = mat;
            return mesh;
        }

        // Merge meshes for performance
        function mergeMeshes(meshes, disposeSource = true) {
            if (meshes.length === 0) return null;
            if (meshes.length === 1) return meshes[0];
            return BABYLON.Mesh.MergeMeshes(meshes, disposeSource, true, undefined, false, true);
        }

        // ============================================
        // ISLAND BASE - Floating rocky mass with grass top
        // ============================================
        function createIslandBase() {
            const island = new BABYLON.TransformNode("islandRoot", scene);

            // Main rocky base - large cylinder with noise displacement
            const baseRadius = 65;
            const baseHeight = 28;
            const base = BABYLON.MeshBuilder.CreateCylinder("islandBase", {
                height: baseHeight,
                diameterTop: baseRadius * 0.85,
                diameterBottom: baseRadius * 1.15,
                tessellation: 48,
                subdivisions: 4
            }, scene);
            base.material = mats.cliff;
            base.position.y = baseHeight / 2 - 2;
            addShadow(base);
            base.parent = island;

            // Displace vertices for rocky look
            const positions = base.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            if (positions) {
                for (let i = 0; i < positions.length; i += 3) {
                    const x = positions[i], y = positions[i + 1], z = positions[i + 2];
                    const dist = Math.sqrt(x * x + z * z);
                    const angle = Math.atan2(z, x);
                    // Noise layers
                    let noise = 0;
                    noise += Math.sin(dist * 0.15 + angle * 3) * 1.8;
                    noise += Math.sin(dist * 0.08 - angle * 5) * 2.5;
                    noise += Math.sin(dist * 0.3 + angle * 7) * 0.8;
                    noise += (Math.random() - 0.5) * 0.6;
                    // Taper noise near top
                    const topFactor = Math.max(0, 1 - (y - (baseHeight / 2 - 2) - baseHeight * 0.5) / (baseHeight * 0.5));
                    const scale = 1 + noise * 0.015 * topFactor;
                    positions[i] *= scale;
                    positions[i + 2] *= scale;
                    // Vertical displacement for stratification
                    if (y < baseHeight * 0.2) positions[i + 1] += Math.sin(dist * 0.2) * 0.5;
                }
                base.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
                BABYLON.VertexData.ComputeNormals(positions, base.getIndices(), base.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                base.setVerticesData(BABYLON.VertexBuffer.NormalKind, base.getVerticesData(BABYLON.VertexBuffer.NormalKind));
            }

            // Cliff overhangs - additional rock layers
            for (let ring = 0; ring < 3; ring++) {
                const ringHeight = 4 + ring * 6;
                const ringRadius = baseRadius * (1.1 - ring * 0.08);
                const overhang = BABYLON.MeshBuilder.CreateCylinder(`overhang${ring}`, {
                    height: 3,
                    diameterTop: ringRadius * 0.95,
                    diameterBottom: ringRadius * 1.05,
                    tessellation: 36,
                    subdivisions: 1
                }, scene);
                overhang.material = choose([mats.cliff, mats.cliffDark, mats.stoneDark]);
                overhang.position.y = ringHeight;
                // Jitter vertices
                const opos = overhang.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                if (opos) {
                    for (let i = 0; i < opos.length; i += 3) {
                        opos[i] += (Math.random() - 0.5) * 1.2;
                        opos[i + 2] += (Math.random() - 0.5) * 1.2;
                        opos[i + 1] += (Math.random() - 0.5) * 0.4;
                    }
                    overhang.setVerticesData(BABYLON.VertexBuffer.PositionKind, opos);
                    BABYLON.VertexData.ComputeNormals(opos, overhang.getIndices(), overhang.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                    overhang.setVerticesData(BABYLON.VertexBuffer.NormalKind, overhang.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                }
                addShadow(overhang);
                overhang.parent = island;
            }

            // Grass top surface
            const grassTop = BABYLON.MeshBuilder.CreateCylinder("grassTop", {
                height: 1.2,
                diameterTop: baseRadius * 0.78,
                diameterBottom: baseRadius * 0.78,
                tessellation: 64
            }, scene);
            grassTop.material = mats.grass;
            grassTop.position.y = baseHeight - 0.5;
            addShadow(grassTop);
            grassTop.receiveShadows = true;
            grassTop.parent = island;

            // Grass vertex displacement for rolling hills
            const gpos = grassTop.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            if (gpos) {
                for (let i = 0; i < gpos.length; i += 3) {
                    const x = gpos[i], z = gpos[i + 2];
                    const d = Math.sqrt(x * x + z * z);
                    const a = Math.atan2(z, x);
                    let h = 0;
                    h += Math.sin(d * 0.08 + a * 4) * 0.6;
                    h += Math.sin(d * 0.15 - a * 3) * 0.4;
                    h += Math.sin(x * 0.2) * Math.cos(z * 0.2) * 0.5;
                    gpos[i + 1] += h;
                }
                grassTop.setVerticesData(BABYLON.VertexBuffer.PositionKind, gpos);
                BABYLON.VertexData.ComputeNormals(gpos, grassTop.getIndices(), grassTop.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                grassTop.setVerticesData(BABYLON.VertexBuffer.NormalKind, grassTop.getVerticesData(BABYLON.VertexBuffer.NormalKind));
            }

            // Grass color variation - vertex colors
            const grassColors = [];
            if (gpos) {
                for (let i = 0; i < gpos.length; i += 3) {
                    const y = gpos[i + 1];
                    const v = Math.max(0, Math.min(1, (y + 0.5) / 2.5));
                    const c = BABYLON.Color3.Lerp(mats.grassDark.albedoColor, mats.grassBright.albedoColor, v);
                    grassColors.push(c.r, c.g, c.b, 1);
                }
                grassTop.setVerticesData(BABYLON.VertexBuffer.ColorKind, grassColors);
                grassTop.hasVertexAlpha = true;
            }

            // Rocky protrusions on top
            for (let i = 0; i < 35; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = rand(5, baseRadius * 0.7);
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                const rock = BABYLON.MeshBuilder.CreateBox(`rock${i}`, {
                    width: rand(1.5, 4),
                    height: rand(0.8, 2.5),
                    depth: rand(1.5, 4)
                }, scene);
                rock.material = choose([mats.cliff, mats.cliffDark, mats.stoneDark, mats.stoneMid]);
                rock.position.set(x, baseHeight + rand(0, 1), z);
                rock.rotation.y = Math.random() * Math.PI;
                rock.scaling.set(rand(0.8, 1.2), rand(0.8, 1.2), rand(0.8, 1.2));
                addShadow(rock);
                rock.parent = island;
            }

            return island;
        }

        // ============================================
        // CASTLE - Central keep with towers, walls, battlements
        // ============================================
        function createCastle() {
            const castle = new BABYLON.TransformNode("castleRoot", scene);
            castle.position.y = 28; // On grass top

            // Materials
            const wallMat = mats.stoneMid;
            const towerMat = mats.stoneWarm;
            const roofMat = mats.roofRed;
            const battlementMat = mats.stoneDark;
            const windowMat = mats.glowWarm;

            // Central Keep - large rectangular tower
            const keep = BABYLON.MeshBuilder.CreateBox("keep", { width: 22, height: 32, depth: 18 }, scene);
            keep.material = wallMat;
            keep.position.y = 16;
            addShadow(keep);
            keep.parent = castle;

            // Keep corner turrets
            const turretPositions = [
                [-11, 30, -9], [11, 30, -9], [11, 30, 9], [-11, 30, 9]
            ];
            turretPositions.forEach((pos, i) => {
                const turret = BABYLON.MeshBuilder.CreateCylinder(`keepTurret${i}`, {
                    height: 12, diameterTop: 5.5, diameterBottom: 6.5, tessellation: 12
                }, scene);
                turret.material = towerMat;
                turret.position.set(pos[0], pos[1], pos[2]);
                addShadow(turret);
                turret.parent = castle;

                // Conical roof
                const troof = BABYLON.MeshBuilder.CreateCylinder(`troof${i}`, {
                    height: 6, diameterTop: 0.2, diameterBottom: 6.5, tessellation: 12
                }, scene);
                troof.material = roofMat;
                troof.position.set(pos[0], pos[1] + 9, pos[2]);
                addShadow(troof);
                troof.parent = castle;

                // Battlements on turret
                for (let b = 0; b < 12; b++) {
                    const ba = (b / 12) * Math.PI * 2;
                    const merlon = BABYLON.MeshBuilder.CreateBox(`merlon_t${i}_${b}`, { width: 0.6, height: 1.2, depth: 0.9 }, scene);
                    merlon.material = battlementMat;
                    merlon.position.set(pos[0] + Math.cos(ba) * 3.5, pos[1] + 5.5, pos[2] + Math.sin(ba) * 3.5);
                    merlon.rotation.y = ba + Math.PI / 2;
                    merlon.parent = castle;
                }
            });

            // Keep battlements
            for (let x = -10; x <= 10; x += 2.5) {
                for (let z = -8; z <= 8; z += 2.5) {
                    if (Math.abs(x) > 9 || Math.abs(z) > 7) {
                        const merlon = BABYLON.MeshBuilder.CreateBox(`merlon_k_${x}_${z}`, { width: 1.2, height: 1.5, depth: 1.2 }, scene);
                        merlon.material = battlementMat;
                        merlon.position.set(x, 32.5, z);
                        merlon.parent = castle;
                    }
                }
            }

            // Main Gate House
            const gateHouse = BABYLON.MeshBuilder.CreateBox("gateHouse", { width: 14, height: 18, depth: 10 }, scene);
            gateHouse.material = wallMat;
            gateHouse.position.set(0, 9, -18);
            addShadow(gateHouse);
            gateHouse.parent = castle;

            // Gate arch (subtractive - we'll add arch pieces)
            const archLeft = BABYLON.MeshBuilder.CreateBox("archLeft", { width: 3, height: 10, depth: 10 }, scene);
            archLeft.material = wallMat;
            archLeft.position.set(-4.5, 5, -18);
            archLeft.parent = castle;
            const archRight = BABYLON.MeshBuilder.CreateBox("archRight", { width: 3, height: 10, depth: 10 }, scene);
            archRight.material = wallMat;
            archRight.position.set(4.5, 5, -18);
            archRight.parent = castle;
            const archTop = BABYLON.MeshBuilder.CreateBox("archTop", { width: 11, height: 3, depth: 10 }, scene);
            archTop.material = wallMat;
            archTop.position.set(0, 13, -18);
            archTop.parent = castle;

            // Gate towers
            [-9, 9].forEach((gx, gi) => {
                const gt = BABYLON.MeshBuilder.CreateCylinder(`gateTower${gi}`, { height: 22, diameterTop: 6, diameterBottom: 7, tessellation: 12 }, scene);
                gt.material = towerMat;
                gt.position.set(gx, 11, -18);
                addShadow(gt);
                gt.parent = castle;
                const gr = BABYLON.MeshBuilder.CreateCylinder(`gateRoof${gi}`, { height: 7, diameterTop: 0.2, diameterBottom: 7, tessellation: 12 }, scene);
                gr.material = roofMat;
                gr.position.set(gx, 22.5, -18);
                addShadow(gr);
                gr.parent = castle;
            });

            // Curtain walls connecting to corner towers
            const cornerTowers = [
                { pos: [-30, 0, -30], name: "nw" },
                { pos: [30, 0, -30], name: "ne" },
                { pos: [30, 0, 30], name: "se" },
                { pos: [-30, 0, 30], name: "sw" }
            ];

            cornerTowers.forEach(ct => {
                const [cx, , cz] = ct.pos;
                // Tower
                const tower = BABYLON.MeshBuilder.CreateCylinder(`tower_${ct.name}`, { height: 28, diameterTop: 7, diameterBottom: 9, tessellation: 16 }, scene);
                tower.material = towerMat;
                tower.position.set(cx, 14, cz);
                addShadow(tower);
                tower.parent = castle;

                // Tower roof
                const troof = BABYLON.MeshBuilder.CreateCylinder(`troof_${ct.name}`, { height: 8, diameterTop: 0.3, diameterBottom: 8, tessellation: 16 }, scene);
                troof.material = choose([mats.roofRed, mats.roofBlue, mats.roofGreen]);
                troof.position.set(cx, 29, cz);
                addShadow(troof);
                troof.parent = castle;

                // Tower battlements
                for (let b = 0; b < 16; b++) {
                    const ba = (b / 16) * Math.PI * 2;
                    const merlon = BABYLON.MeshBuilder.CreateBox(`merlon_${ct.name}_${b}`, { width: 0.7, height: 1.4, depth: 1 }, scene);
                    merlon.material = battlementMat;
                    merlon.position.set(cx + Math.cos(ba) * 4.5, 27.5, cz + Math.sin(ba) * 4.5);
                    merlon.rotation.y = ba + Math.PI / 2;
                    merlon.parent = castle;
                }

                // Wall segments from keep to corner towers
                const wallLength = Math.sqrt(cx * cx + cz * cz) - 12;
                const wallAngle = Math.atan2(cz, cx);
                const wallCount = Math.ceil(wallLength / 4);
                for (let w = 0; w < wallCount; w++) {
                    const wx = Math.cos(wallAngle) * (12 + w * 4 + 2);
                    const wz = Math.sin(wallAngle) * (12 + w * 4 + 2);
                    const wall = BABYLON.MeshBuilder.CreateBox(`wall_${ct.name}_${w}`, { width: 4, height: 10, depth: 3 }, scene);
                    wall.material = wallMat;
                    wall.position.set(wx, 5, wz);
                    wall.rotation.y = wallAngle + Math.PI / 2;
                    addShadow(wall);
                    wall.parent = castle;

                    // Wall battlements
                    for (let bw = 0; bw < 2; bw++) {
                        const mb = BABYLON.MeshBuilder.CreateBox(`mwall_${ct.name}_${w}_${bw}`, { width: 1.2, height: 1.5, depth: 1.5 }, scene);
                        mb.material = battlementMat;
                        mb.position.set(wx + (bw - 0.5) * 2.5 * Math.cos(wallAngle), 10.5, wz + (bw - 0.5) * 2.5 * Math.sin(wallAngle));
                        mb.rotation.y = wallAngle + Math.PI / 2;
                        mb.parent = castle;
                    }
                }
            });

            // Inner bailey buildings
            const baileyBuildings = [
                { pos: [-18, 0, -5], size: [8, 10, 12], roof: mats.roofBlue },
                { pos: [18, 0, -5], size: [10, 12, 10], roof: mats.roofGreen },
                { pos: [0, 0, 15], size: [14, 8, 16], roof: mats.roofBrown },
                { pos: [-12, 0, 18], size: [6, 9, 8], roof: mats.roofRed },
                { pos: [12, 0, 18], size: [6, 9, 8], roof: mats.roofBlue }
            ];

            baileyBuildings.forEach((b, i) => {
                const [bx, , bz] = b.pos;
                const [bw, bh, bd] = b.size;
                const building = BABYLON.MeshBuilder.CreateBox(`bailey_${i}`, { width: bw, height: bh, depth: bd }, scene);
                building.material = mats.stoneWarm;
                building.position.set(bx, bh / 2, bz);
                addShadow(building);
                building.parent = castle;

                // Gabled roof
                const roof = createTaperedBox(`roof_${i}`, bw + 1, 4, bd + 1, 0.15, b.roof, scene);
                roof.position.set(bx, bh + 2, bz);
                addShadow(roof);
                roof.parent = castle;

                // Chimney
                if (Math.random() > 0.5) {
                    const chim = BABYLON.MeshBuilder.CreateBox(`chim_${i}`, { width: 1.2, height: 3, depth: 1.2 }, scene);
                    chim.material = mats.stoneDark;
                    chim.position.set(bx + rand(-bw/3, bw/3), bh + 5.5, bz + rand(-bd/3, bd/3));
                    chim.parent = castle;
                }
            });

            // Windows with warm glow
            function addWindow(x, y, z, parent, rotY = 0) {
                const win = BABYLON.MeshBuilder.CreatePlane("win", { width: 1.2, height: 1.8 }, scene);
                win.material = windowMat;
                win.position.set(x, y, z);
                win.rotation.y = rotY;
                win.parent = parent;
                win.billboardMode = BABYLON.Mesh.BILLBOARDMODE_Y;
            }

            // Keep windows
            for (let fy = 0; fy < 3; fy++) {
                for (let fx = -1; fx <= 1; fx += 2) {
                    addWindow(fx * 10, 8 + fy * 8, -9.2, castle); // front
                    addWindow(fx * 10, 8 + fy * 8, 9.2, castle, Math.PI); // back
                }
                addWindow(-11.2, 8 + fy * 8, 0, castle, -Math.PI/2); // left
                addWindow(11.2, 8 + fy * 8, 0, castle, Math.PI/2); // right
            }

            // Gate house window
            addWindow(0, 14, -23, castle);

            // Flags on towers
            function addFlag(x, y, z, colorMat) {
                const pole = BABYLON.MeshBuilder.CreateCylinder("pole", { height: 6, diameter: 0.15 }, scene);
                pole.material = mats.woodDark;
                pole.position.set(x, y, z);
                pole.parent = castle;
                const flag = BABYLON.MeshBuilder.CreatePlane("flag", { width: 3, height: 2 }, scene);
                flag.material = colorMat;
                flag.position.set(x + 1.5, y + 5, z);
                flag.rotation.y = -Math.PI / 4;
                flag.parent = castle;
            }

            addFlag(-11, 36, -9, mats.bannerRed);
            addFlag(11, 36, 9, mats.bannerBlue);
            addFlag(-30, 37, -30, mats.bannerRed);
            addFlag(30, 37, 30, mats.bannerBlue);

            return castle;
        }

        // ============================================
        // VILLAGE HOUSES - Timber-framed, thatched roofs
        // ============================================
        function createHouse(x, z, rotation, scale = 1, type = "house") {
            const group = new BABYLON.TransformNode(`house_${x}_${z}`, scene);
            group.position.set(x, 28.5, z);
            group.rotation.y = rotation;
            group.scaling.scaleInPlace(scale);

            const configs = {
                house: { w: 6, h: 5, d: 7, roofH: 3.5, floors: 1 },
                cottage: { w: 4.5, h: 4, d: 5, roofH: 3, floors: 1 },
                tavern: { w: 10, h: 6, d: 9, roofH: 4, floors: 2 },
                shop: { w: 5, h: 5, d: 6, roofH: 3.5, floors: 1 },
                mill: { w: 7, h: 7, d: 7, roofH: 3.5, floors: 2 }
            };
            const c = configs[type] || configs.house;

            // Foundation
            const foundation = BABYLON.MeshBuilder.CreateBox("found", { width: c.w + 0.4, height: 0.6, depth: c.d + 0.4 }, scene);
            foundation.material = mats.stoneDark;
            foundation.position.y = 0.3;
            addShadow(foundation);
            foundation.parent = group;

            // Ground floor walls - timber frame
            const wallMat = mats.woodMid;
            const infillMat = choose([mats.stoneLight, createMat("wattle", new BABYLON.Color3(0.6, 0.5, 0.4))]);

            // Create timber frame manually for detail
            function createTimberFrame(w, h, d, yOffset, parent) {
                const frame = new BABYLON.TransformNode("frame", scene);
                frame.parent = parent;
                frame.position.y = yOffset;

                // Posts
                const postPositions = [
                    [-w/2, 0, -d/2], [w/2, 0, -d/2], [w/2, 0, d/2], [-w/2, 0, d/2]
                ];
                postPositions.forEach((pp, pi) => {
                    const post = BABYLON.MeshBuilder.CreateBox(`post${pi}`, { width: 0.25, height: h, depth: 0.25 }, scene);
                    post.material = mats.woodDark;
                    post.position.set(pp[0], h/2, pp[2]);
                    post.parent = frame;
                });

                // Sills and plates
                [[-w/2, w/2, -d/2], [-w/2, w/2, d/2], [-w/2, -w/2, -d/2], [w/2, w/2, -d/2], [w/2, w/2, d/2], [-w/2, -w/2, d/2]].forEach((sp, si) => {
                    // Simplified: just horizontal beams
                });

                // Infill panels - simple planes
                const panelCountW = Math.floor(w / 1.5);
                const panelCountD = Math.floor(d / 1.5);
                for (let pw = 0; pw <= panelCountW; pw++) {
                    for (let ph = 0; ph < 2; ph++) {
                        for (let side = 0; side < 4; side++) {
                            let px, pz, ry;
                            const py = yOffset + 0.5 + ph * (h / 2);
                            if (side === 0) { px = -w/2 + pw * 1.5; pz = -d/2 - 0.05; ry = 0; }
                            else if (side === 1) { px = w/2 + 0.05; pz = -d/2 + pw * 1.5; ry = Math.PI/2; }
                            else if (side === 2) { px = w/2 - pw * 1.5; pz = d/2 + 0.05; ry = Math.PI; }
                            else { px = -w/2 - 0.05; pz = d/2 - pw * 1.5; ry = -Math.PI/2; }
                            if (px < -w/2 + 0.3 || px > w/2 - 0.3) continue;
                            if (pz < -d/2 + 0.3 || pz > d/2 - 0.3) continue;
                            const panel = BABYLON.MeshBuilder.CreatePlane(`panel_${side}_${pw}_${ph}`, { width: 1.3, height: h/2 - 0.2 }, scene);
                            panel.material = infillMat;
                            panel.position.set(px, py + (h/2 - 0.2)/2, pz);
                            panel.rotation.y = ry;
                            panel.parent = frame;
                        }
                    }
                }
                return frame;
            }

            // Ground floor
            createTimberFrame(c.w, c.h, c.d, c.h / 2, group);

            // Upper floor if 2 stories
            if (c.floors > 1) {
                // Jetty - upper floor overhangs
                const upper = new BABYLON.TransformNode("upper", scene);
                upper.parent = group;
                upper.position.y = c.h;

                // Overhang beams
                const overhang = 0.6;
                const beam = BABYLON.MeshBuilder.CreateBox("jettyBeam", { width: c.w + overhang*2, height: 0.3, depth: c.d + overhang*2 }, scene);
                beam.material = mats.woodDark;
                beam.position.y = 0.15;
                beam.parent = upper;

                createTimberFrame(c.w + overhang, c.h * 0.8, c.d + overhang, c.h + c.h * 0.4, group);
            }

            // Roof - thatched, gabled
            const roofW = c.w + 1.2;
            const roofD = c.d + 1.2;
            const roof = createTaperedBox("roof", roofW, c.roofH, roofD, 0.05, mats.thatch, scene);
            roof.position.y = c.h * c.floors + c.roofH / 2;
            addShadow(roof);
            roof.parent = group;

            // Roof ridge detail
            const ridge = BABYLON.MeshBuilder.CreateCylinder("ridge", { height: roofW + 0.5, diameter: 0.4, tessellation: 8 }, scene);
            ridge.material = mats.thatchDark;
            ridge.position.y = c.h * c.floors + c.roofH + 0.2;
            ridge.rotation.z = Math.PI / 2;
            ridge.parent = group;

            // Chimney
            const chim = BABYLON.MeshBuilder.CreateBox("chimney", { width: 1, height: 3, depth: 1 }, scene);
            chim.material = mats.stoneDark;
            chim.position.set(rand(-c.w/3, c.w/3), c.h * c.floors + c.roofH * 0.6, rand(-c.d/3, c.d/3));
            chim.parent = group;

            // Door
            const door = BABYLON.MeshBuilder.CreatePlane("door", { width: 1.2, height: 2.2 }, scene);
            door.material = mats.woodDark;
            door.position.set(0, 1.1, -c.d/2 - 0.06);
            door.parent = group;

            // Windows
            const winMat = mats.glowWarm;
            for (let wx = -1; wx <= 1; wx += 2) {
                const win = BABYLON.MeshBuilder.CreatePlane("win", { width: 1, height: 1.2 }, scene);
                win.material = winMat;
                win.position.set(wx * (c.w/2 - 1), c.h * 0.6, -c.d/2 - 0.05);
                win.parent = group;
            }

            // Tavern sign
            if (type === "tavern") {
                const signPost = BABYLON.MeshBuilder.CreateCylinder("signPost", { height: 5, diameter: 0.2 }, scene);
                signPost.material = mats.woodDark;
                signPost.position.set(-c.w/2 - 2, 2.5, -c.d/2 - 1);
                signPost.parent = group;
                const sign = BABYLON.MeshBuilder.CreatePlane("sign", { width: 3, height: 2 }, scene);
                sign.material = mats.tavernSign;
                sign.position.set(-c.w/2 - 2, 5, -c.d/2 - 1.5);
                sign.rotation.y = -0.3;
                sign.parent = group;
            }

            // Mill water wheel
            if (type === "mill") {
                const wheel = new BABYLON.TransformNode("wheel", scene);
                wheel.parent = group;
                wheel.position.set(c.w/2 + 1.5, c.h/2, 0);
                wheel.rotation.z = Math.PI / 2;

                const rim = BABYLON.MeshBuilder.CreateTorus("rim", { diameter: 4, thickness: 0.2, tessellation: 24 }, scene);
                rim.material = mats.woodMid;
                rim.parent = wheel;

                for (let sp = 0; sp < 8; sp++) {
                    const spoke = BABYLON.MeshBuilder.CreateBox(`spoke${sp}`, { width: 0.15, height: 1.9, depth: 0.15 }, scene);
                    spoke.material = mats.woodDark;
                    spoke.position.y = 1.9/2;
                    spoke.parent = wheel;
                    spoke.rotation.z = (sp / 8) * Math.PI * 2;
                }

                const paddles = new BABYLON.TransformNode("paddles", scene);
                paddles.parent = wheel;
                for (let pd = 0; pd < 8; pd++) {
                    const paddle = BABYLON.MeshBuilder.CreateBox(`paddle${pd}`, { width: 0.1, height: 1.5, depth: 0.6 }, scene);
                    paddle.material = mats.woodMid;
                    paddle.position.y = 0;
                    paddle.position.x = 2;
                    paddle.parent = paddles;
                    paddle.rotation.z = (pd / 8) * Math.PI * 2;
                }

                // Animate wheel
                scene.registerBeforeRender(() => {
                    wheel.rotation.x += 0.003;
                });
            }

            return group;
        }

        // ============================================
        // MARKET STALLS
        // ============================================
        function createMarketStall(x, z, rotation) {
            const stall = new BABYLON.TransformNode(`stall_${x}_${z}`, scene);
            stall.position.set(x, 28.5, z);
            stall.rotation.y = rotation;

            // Posts
            for (let px = -1.5; px <= 1.5; px += 3) {
                for (let pz = -1; pz <= 1; pz += 2) {
                    const post = BABYLON.MeshBuilder.CreateCylinder("post", { height: 3, diameter: 0.15 }, scene);
                    post.material = mats.woodDark;
                    post.position.set(px, 1.5, pz);
                    post.parent = stall;
                }
            }

            // Roof canopy
            const canopy = createTaperedBox("canopy", 4, 1.5, 3, 0.3, choose([mats.thatch, mats.roofRed, mats.roofBlue, mats.roofGreen]), scene);
            canopy.position.y = 3.5;
            addShadow(canopy);
            canopy.parent = stall;

            // Table
            const table = BABYLON.MeshBuilder.CreateBox("table", { width: 3, height: 0.1, depth: 1.5 }, scene);
            table.material = mats.woodMid;
            table.position.y = 0.9;
            table.parent = stall;

            // Goods (colorful boxes)
            const goodsColors = [
                new BABYLON.Color3(0.8, 0.3, 0.2), new BABYLON.Color3(0.9, 0.7, 0.2),
                new BABYLON.Color3(0.3, 0.7, 0.3), new BABYLON.Color3(0.7, 0.4, 0.8),
                new BABYLON.Color3(0.9, 0.5, 0.1), new BABYLON.Color3(0.4, 0.6, 0.9)
            ];
            for (let g = 0; g < 6; g++) {
                const good = BABYLON.MeshBuilder.CreateBox(`good${g}`, { width: 0.5, height: 0.4, depth: 0.5 }, scene);
                good.material = createMat(`goodMat${g}`, goodsColors[g], 0.7);
                good.position.set(rand(-1.2, 1.2), 1.1 + g * 0.15, rand(-0.6, 0.6));
                good.rotation.y = Math.random() * Math.PI;
                good.parent = stall;
            }

            return stall;
        }

        // ============================================
        // PINE TREES
        // ============================================
        const pineProto = new BABYLON.TransformNode("pineProto", scene);
        pineProto.setEnabled(false);

        const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { height: 2.5, diameterTop: 0.3, diameterBottom: 0.5, tessellation: 8 }, scene);
        trunk.material = mats.trunk;
        trunk.position.y = 1.25;
        trunk.parent = pineProto;
        addShadow(trunk);

        for (let tier = 0; tier < 4; tier++) {
            const foliage = BABYLON.MeshBuilder.CreateCylinder(`foliage${tier}`, {
                height: 2.5 - tier * 0.4,
                diameterTop: 0.5,
                diameterBottom: 2.5 - tier * 0.5,
                tessellation: 10
            }, scene);
            foliage.material = tier % 2 === 0 ? mats.leafPine : mats.leafPineBright;
            foliage.position.y = 2.5 + tier * 1.5;
            addShadow(foliage);
            foliage.parent = pineProto;
        }

        function createPine(x, z, scale = 1) {
            const pine = pineProto.clone(`pine_${x}_${z}`);
            pine.setEnabled(true);
            pine.position.set(x, 28.5, z);
            pine.scaling.scaleInPlace(scale * rand(0.8, 1.3));
            pine.rotation.y = Math.random() * Math.PI * 2;
            return pine;
        }

        // ============================================
        // RUINED WATCHTOWER
        // ============================================
        function createRuinedWatchtower(x, z) {
            const ruin = new BABYLON.TransformNode(`ruin_${x}_${z}`, scene);
            ruin.position.set(x, 28.5, z);
            ruin.rotation.y = rand(0, Math.PI * 2);

            // Base stump
            const base = BABYLON.MeshBuilder.CreateCylinder("base", { height: 4, diameterTop: 5, diameterBottom: 6, tessellation: 12 }, scene);
            base.material = mats.ruinStone;
            base.position.y = 2;
            // Damage vertices
            const bpos = base.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            if (bpos) {
                for (let i = 0; i < bpos.length; i += 3) {
                    bpos[i] += (Math.random() - 0.5) * 0.6;
                    bpos[i + 2] += (Math.random() - 0.5) * 0.6;
                    if (bpos[i + 1] > 3) bpos[i + 1] += (Math.random() - 0.3) * 0.8;
                }
                base.setVerticesData(BABYLON.VertexBuffer.PositionKind, bpos);
                BABYLON.VertexData.ComputeNormals(bpos, base.getIndices(), base.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                base.setVerticesData(BABYLON.VertexBuffer.NormalKind, base.getVerticesData(BABYLON.VertexBuffer.NormalKind));
            }
            addShadow(base);
            base.parent = ruin;

            // Broken tower shaft
            const shaft = BABYLON.MeshBuilder.CreateCylinder("shaft", { height: 10, diameterTop: 3.5, diameterBottom: 4.5, tessellation: 12 }, scene);
            shaft.material = mats.ruinStone;
            shaft.position.y = 8;
            const spos = shaft.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            if (spos) {
                for (let i = 0; i < spos.length; i += 3) {
                    if (spos[i + 1] > 8) { // Only upper part broken
                        spos[i] += (Math.random() - 0.5) * 1.2;
                        spos[i + 2] += (Math.random() - 0.5) * 1.2;
                    }
                }
                shaft.setVerticesData(BABYLON.VertexBuffer.PositionKind, spos);
                BABYLON.VertexData.ComputeNormals(spos, shaft.getIndices(), shaft.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                shaft.setVerticesData(BABYLON.VertexBuffer.NormalKind, shaft.getVerticesData(BABYLON.VertexBuffer.NormalKind));
            }
            addShadow(shaft);
            shaft.parent = ruin;

            // Debris around
            for (let d = 0; d < 12; d++) {
                const da = Math.random() * Math.PI * 2;
                const dd = rand(3, 7);
                const debris = BABYLON.MeshBuilder.CreateBox(`debris${d}`, {
                    width: rand(0.5, 1.5),
                    height: rand(0.3, 1),
                    depth: rand(0.5, 1.5)
                }, scene);
                debris.material = mats.ruinStone;
                debris.position.set(Math.cos(da) * dd, rand(0.2, 1.5), Math.sin(da) * dd);
                debris.rotation.set(rand(-0.5, 0.5), rand(0, Math.PI * 2), rand(-0.5, 0.5));
                debris.parent = ruin;
            }

            return ruin;
        }

        // ============================================
        // RIVER & WATERFALLS
        // ============================================
        function createRiver() {
            const riverRoot = new BABYLON.TransformNode("riverRoot", scene);

            // River path - spline from north to south-east, cascading off island
            const path = [
                new BABYLON.Vector3(0, 29, 40),
                new BABYLON.Vector3(-5, 29, 20),
                new BABYLON.Vector3(-10, 29, 5),
                new BABYLON.Vector3(-15, 28, -5),
                new BABYLON.Vector3(-25, 26, -15),
                new BABYLON.Vector3(-35, 22, -25),
                new BABYLON.Vector3(-45, 15, -35),
                new BABYLON.Vector3(-55, 5, -45)
            ];

            // River bed - tube along path
            const riverBed = BABYLON.MeshBuilder.CreateTube("riverBed", {
                path: path,
                radius: 5,
                tessellation: 24,
                cap: BABYLON.Mesh.CAP_ALL
            }, scene);
            riverBed.material = mats.stoneDark;
            riverBed.parent = riverRoot;

            // Water surface - ribbon along path
            const waterPath = path.map(p => new BABYLON.Vector3(p.x, p.y + 0.3, p.z));
            const water = BABYLON.MeshBuilder.CreateRibbon("water", {
                pathArray: [waterPath, waterPath.map(p => new BABYLON.Vector3(p.x + 4, p.y, p.z))],
                closeArray: false,
                sideOrientation: BABYLON.Mesh.DOUBLESIDE
            }, scene);
            water.material = mats.water;
            water.parent = riverRoot;

            // Animated water texture via vertex displacement
            const wpos = water.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            if (wpos) {
                const originalY = wpos.slice();
                scene.registerBeforeRender(() => {
                    const time = performance.now() * 0.001;
                    for (let i = 0; i < wpos.length; i += 3) {
                        const x = wpos[i], z = wpos[i + 2];
                        wpos[i + 1] = originalY[i + 1] + Math.sin(x * 0.5 + time * 2) * 0.15 + Math.cos(z * 0.5 + time * 1.5) * 0.1;
                    }
                    water.setVerticesData(BABYLON.VertexBuffer.PositionKind, wpos);
                    BABYLON.VertexData.ComputeNormals(wpos, water.getIndices(), water.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                    water.setVerticesData(BABYLON.VertexBuffer.NormalKind, water.getVerticesData(BABYLON.VertexBuffer.NormalKind));
                });
            }

            // Waterfalls - particle systems at drop points
            const falls = [
                { pos: new BABYLON.Vector3(-45, 15, -35), height: 15, width: 8 },
                { pos: new BABYLON.Vector3(-35, 22, -25), height: 7, width: 6 },
                { pos: new BABYLON.Vector3(-25, 26, -15), height: 5, width: 5 }
            ];

            falls.forEach((fall, fi) => {
                // Particle system for mist
                const ps = new BABYLON.ParticleSystem(`fallsMist${fi}`, 800, scene);
                ps.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==", scene);
                ps.emitter = fall.pos.clone();
                ps.emitBox = new BABYLON.Vector3(fall.width, 0.5, fall.width);
                ps.minEmitPower = 1;
                ps.maxEmitPower = 3;
                ps.addVelocityGradient(0, 2);
                ps.minSize = 0.3;
                ps.maxSize = 1.2;
                ps.minLifeTime = 0.5;
                ps.maxLifeTime = 2;
                ps.color1 = new BABYLON.Color4(0.6, 0.7, 0.9, 0.4);
                ps.color2 = new BABYLON.Color4(0.4, 0.6, 0.8, 0.1);
                ps.colorDead = new BABYLON.Color4(0.3, 0.5, 0.7, 0);
                ps.gravity = new BABYLON.Vector3(0, -9.8, 0);
                ps.direction1 = new BABYLON.Vector3(-0.5, -1, -0.5);
                ps.direction2 = new BABYLON.Vector3(0.5, -1, 0.5);
                ps.minAngularSpeed = -0.5;
                ps.maxAngularSpeed = 0.5;
                ps.start();

                // Water fall plane with animated texture
                const fallPlane = BABYLON.MeshBuilder.CreatePlane(`fallPlane${fi}`, { width: fall.width, height: fall.height }, scene);
                fallPlane.material = mats.waterReflect;
                fallPlane.position = fall.pos.clone();
                fallPlane.position.y -= fall.height / 2;
                fallPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_Y;
                fallPlane.parent = riverRoot;

                // Animate fall plane UV
                scene.registerBeforeRender(() => {
                    const time = performance.now() * 0.001;
                    fallPlane.material.albedoTexture = fallPlane.material.albedoTexture || new BABYLON.Texture("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==", scene);
                    if (fallPlane.material.albedoTexture) {
                        fallPlane.material.albedoTexture.uOffset = time * 0.5;
                        fallPlane.material.albedoTexture.vOffset = -time * 2;
                    }
                });
            });

            // Wooden bridges
            const bridges = [
                { pos: new BABYLON.Vector3(-5, 29.5, 20), rot: 0.3, len: 12 },
                { pos: new BABYLON.Vector3(-15, 29.5, -5), rot: -0.2, len: 10 },
                { pos: new BABYLON.Vector3(10, 29.5, 15), rot: 1.2, len: 10 }
            ];

            bridges.forEach((b, bi) => {
                const bridge = new BABYLON.TransformNode(`bridge${bi}`, scene);
                bridge.position = b.pos.clone();
                bridge.rotation.y = b.rot;
                bridge.parent = riverRoot;

                // Planks
                for (let p = -b.len/2; p < b.len/2; p += 0.4) {
                    const plank = BABYLON.MeshBuilder.CreateBox(`plank${bi}_${p}`, { width: 4, height: 0.15, depth: 0.4 }, scene);
                    plank.material = mats.plank;
                    plank.position.set(p, 0.07, 0);
                    plank.parent = bridge;
                    addShadow(plank);
                }
                // Railings
                for (let side = -1; side <= 1; side += 2) {
                    const rail = BABYLON.MeshBuilder.CreateBox(`rail${bi}_${side}`, { width: b.len, height: 0.1, depth: 0.1 }, scene);
                    rail.material = mats.woodDark;
                    rail.position.set(0, 0.8, side * 2);
                    rail.parent = bridge;
                    const postCount = Math.ceil(b.len / 1.5);
                    for (let pc = 0; pc <= postCount; pc++) {
                        const post = BABYLON.MeshBuilder.CreateCylinder(`bpost${bi}_${side}_${pc}`, { height: 1, diameter: 0.1 }, scene);
                        post.material = mats.woodDark;
                        post.position.set(-b.len/2 + pc * 1.5, 0.5, side * 2);
                        post.parent = bridge;
                    }
                }
            });

            return riverRoot;
        }

        // ============================================
        // POPULATE ISLAND
        // ============================================
        const island = createIslandBase();
        const castle = createCastle();
        const river = createRiver();

        // Village layout - organic clusters around castle
        const village = new BABYLON.TransformNode("villageRoot", scene);

        // Define building positions (x, z, rotation, scale, type)
        const buildingData = [
            // Inner ring near castle
            [-20, -10, 0.5, 1, "house"], [22, -8, -0.3, 1, "cottage"],
            [-15, 18, 1.2, 1, "shop"], [18, 15, -1, 1, "house"],
            // Market square south of castle
            [-8, -25, 0, 1, "tavern"], [8, -25, 0, 1, "shop"],
            // Market stalls
            [-12, -30, 0.2, 1, "stall"], [-4, -30, -0.1, 1, "stall"],
            [4, -30, 0.1, 1, "stall"], [12, -30, -0.2, 1, "stall"],
            // Outer ring
            [-30, -20, 0.8, 1, "house"], [-35, -5, 1.5, 1, "cottage"],
            [-32, 12, -0.5, 1, "house"], [-25, 28, 0.3, 1, "cottage"],
            [30, -15, -0.8, 1, "house"], [35, 5, 0.5, 1, "shop"],
            [32, 20, -1.2, 1, "house"], [25, 30, 0.7, 1, "cottage"],
            // Mill by river
            [-40, 10, 0.2, 1, "mill"],
            // More houses
            [-10, -40, 0, 0.9, "cottage"], [10, -40, 0, 0.9, "house"],
            [-20, 35, 0, 1, "house"], [20, 35, 0, 1, "cottage"],
            [0, 38, 0, 1, "shop"]
        ];

        buildingData.forEach(([x, z, rot, scale, type]) => {
            if (type === "stall") {
                const stall = createMarketStall(x, z, rot);
                stall.parent = village;
            } else {
                const house = createHouse(x, z, rot, scale, type);
                house.parent = village;
            }
        });

        // Pine trees - scattered naturally
        const trees = new BABYLON.TransformNode("treesRoot", scene);
        for (let i = 0; i < 80; i++) {
            // Avoid castle center and river path
            let x, z, valid = false;
            for (let attempt = 0; attempt < 20; attempt++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = rand(15, 60);
                x = Math.cos(angle) * dist;
                z = Math.sin(angle) * dist;
                // Check distance from castle center
                if (x*x + z*z < 400) continue;
                // Check distance from river path roughly
                let nearRiver = false;
                for (const rp of [[0,40],[-5,20],[-10,5],[-15,-5],[-25,-15],[-35,-25],[-45,-35],[-55,-45]]) {
                    if ((x-rp[0])**2 + (z-rp[1])**2 < 64) { nearRiver = true; break; }
                }
                if (nearRiver) continue;
                // Check buildings
                let nearBuilding = false;
                for (const bd of buildingData) {
                    if ((x-bd[0])**2 + (z-bd[1])**2 < 36) { nearBuilding = true; break; }
                }
                if (nearBuilding) continue;
                valid = true; break;
            }
            if (valid) {
                const pine = createPine(x, z, rand(0.7, 1.3));
                pine.parent = trees;
            }
        }

        // Ruined watchtower at edge
        const ruin = createRuinedWatchtower(-55, 30);
        ruin.parent = island;

        // ============================================
        // ATMOSPHERE & POST PROCESS
        // ============================================
        // Fog for depth
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
        scene.fogColor = new BABYLON.Color3(0.2, 0.18, 0.22);
        scene.fogDensity = 0.0035;

        // Glow layer for warm lights
        const glow = new BABYLON.GlowLayer("glow", scene, { mainTextureSamples: 4, blurKernelSize: 32 });
        glow.intensity = 0.6;

        // Default rendering pipeline for subtle color grading
        const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
        pipeline.imageProcessingEnabled = true;
        pipeline.imageProcessing.contrast = 1.1;
        pipeline.imageProcessing.exposure = 1.05;
        pipeline.imageProcessing.toneMappingEnabled = true;
        pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
        pipeline.imageProcessing.vignetteEnabled = true;
        pipeline.imageProcessing.vignetteWeight = 1.5;
        pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0.1, 0.08, 0.05, 1);

        // Subtle bloom on emissive materials
        pipeline.bloomEnabled = true;
        pipeline.bloomThreshold = 0.8;
        pipeline.bloomWeight = 0.4;
        pipeline.bloomKernel = 64;
        pipeline.bloomScale = 0.5;

        // ============================================
        // ANIMATION & INTERACTION
        // ============================================
        // Auto-rotate slowly for showcase
        let autoRotate = true;
        let userInteracting = false;
        let lastInteractionTime = 0;

        canvas.addEventListener("pointerdown", () => {
            userInteracting = true;
            autoRotate = false;
        });
        canvas.addEventListener("pointerup", () => {
            lastInteractionTime = performance.now();
        });
        canvas.addEventListener("wheel", () => {
            userInteracting = true;
            autoRotate = false;
        });

        scene.registerBeforeRender(() => {
            const now = performance.now();
            if (!userInteracting && now - lastInteractionTime > 3000) {
                autoRotate = true;
            }
            if (autoRotate) {
                camera.alpha += 0.00015;
            }
        });

        // Keyboard controls for light time of day
        let timeOfDay = 0.5; // 0-1
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") timeOfDay = (timeOfDay - 0.05 + 1) % 1;
            if (e.key === "ArrowRight") timeOfDay = (timeOfDay + 0.05) % 1;
            updateLighting(timeOfDay);
        });

        function updateLighting(t) {
            // t: 0 = midnight, 0.25 = dawn, 0.5 = noon, 0.75 = dusk
            const sunAngle = (t - 0.25) * Math.PI * 2;
            sunLight.direction = new BABYLON.Vector3(Math.cos(sunAngle), -Math.sin(sunAngle) * 0.8 - 0.5, Math.sin(sunAngle) * 0.5).normalize();

            const noonIntensity = Math.max(0, Math.sin((t - 0.25) * Math.PI * 2));
            sunLight.intensity = 0.4 + noonIntensity * 0.8;
            hemiLight.intensity = 0.4 + noonIntensity * 0.4;

            // Color temperature shift
            const warm = Math.sin((t - 0.25) * Math.PI * 2) * 0.5 + 0.5;
            sunLight.diffuse = BABYLON.Color3.Lerp(new BABYLON.Color3(0.6, 0.5, 0.4), new BABYLON.Color3(1, 0.95, 0.85), warm);
            hemiLight.diffuse = BABYLON.Color3.Lerp(new BABYLON.Color3(0.3, 0.3, 0.4), new BABYLON.Color3(1, 0.95, 0.85), warm * 0.7);
            hemiLight.groundColor = BABYLON.Color3.Lerp(new BABYLON.Color3(0.1, 0.1, 0.15), new BABYLON.Color3(0.3, 0.25, 0.2), warm * 0.5);

            // Sky color
            scene.clearColor = BABYLON.Color3.Lerp(new BABYLON.Color3(0.05, 0.05, 0.1), new BABYLON.Color3(0.4, 0.6, 0.8), Math.max(0, Math.sin((t - 0.25) * Math.PI * 2)));
            scene.fogColor = scene.clearColor.scale(0.5);

            // Window glow intensity
            mats.glowWarm.emissiveColor = new BABYLON.Color3(0.8, 0.4, 0.1).scale(1 - noonIntensity * 0.7);
            mats.glowCool.emissiveColor = new BABYLON.Color3(0.1, 0.3, 0.6).scale(1 - noonIntensity * 0.7);
            mats.tavernSign.emissiveColor = new BABYLON.Color3(0.15, 0.05, 0.0).scale(1 - noonIntensity * 0.5);
            mats.bannerRed.emissiveColor = new BABYLON.Color3(0.1, 0.02, 0.01).scale(1 - noonIntensity * 0.5);
            mats.bannerBlue.emissiveColor = new BABYLON.Color3(0.02, 0.04, 0.12).scale(1 - noonIntensity * 0.5);
        }
        updateLighting(timeOfDay);

        // ============================================
        // RESIZE & RENDER LOOP
        // ============================================
        window.addEventListener("resize", () => engine.resize());

        engine.runRenderLoop(() => {
            scene.render();
        });

        // ============================================
        // INITIAL CAMERA ANIMATION
        // ============================================
        const initialAlpha = camera.alpha;
        const initialBeta = camera.beta;
        const initialRadius = camera.radius;
        camera.alpha = initialAlpha + Math.PI;
        camera.beta = initialBeta + 0.3;
        camera.radius = initialRadius * 1.5;

        const animAlpha = new BABYLON.Animation("camAlpha", "alpha", 60, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
        animAlpha.setKeys([{ frame: 0, value: camera.alpha }, { frame: 180, value: initialAlpha }]);
        const animBeta = new BABYLON.Animation("camBeta", "beta", 60, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
        animBeta.setKeys([{ frame: 0, value: camera.beta }, { frame: 180, value: initialBeta }]);
        const animRadius = new BABYLON.Animation("camRadius", "radius", 60, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
        animRadius.setKeys([{ frame: 0, value: camera.radius }, { frame: 180, value: initialRadius }]);

        scene.beginDirectAnimation(camera, [animAlpha, animBeta, animRadius], 0, 180, false, 1);
    </script>
</body>
</html>
