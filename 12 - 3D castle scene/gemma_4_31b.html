<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Kingdom of Aetheria</h1>
        <p>Drag to rotate • Scroll to zoom</p>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.1, 0.1, 0.2);

            // --- Camera ---
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 40, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 15;
            camera.upperRadiusLimit = 80;
            camera.useAutoRotationBehavior = true;

            // --- Lighting ---
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(20, 40, 20);
            dirLight.intensity = 1.2;

            // --- Materials ---
            const matGrass = new BABYLON.StandardMaterial("matGrass", scene);
            matGrass.diffuseColor = new BABYLON.Color3(0.4, 0.8, 0.3);

            const matStone = new BABYLON.StandardMaterial("matStone", scene);
            matStone.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.6);

            const matWood = new BABYLON.StandardMaterial("matWood", scene);
            matWood.diffuseColor = new BABYLON.Color3(0.5, 0.3, 0.2);

            const matRoof = new BABYLON.StandardMaterial("matRoof", scene);
            matRoof.diffuseColor = new BABYLON.Color3(0.7, 0.2, 0.2);

            const matWater = new BABYLON.StandardMaterial("matWater", scene);
            matWater.diffuseColor = new BABYLON.Color3(0, 0.7, 0.8);
            matWater.alpha = 0.8;

            // --- Helper Functions ---
            const createHouse = (x, z, rot = 0) => {
                const house = new BABYLON.MeshBuilder.CreateBox("house", {size: 2}, scene);
                house.position = new BABYLON.Vector3(x, 1, z);
                house.rotation.y = rot;
                house.material = matWood;

                const roof = BABYLON.MeshBuilder.CreatePolyhedron("roof", {type: 1, size: 2.2}, scene);
                roof.position = new BABYLON.Vector3(x, 2.5, z);
                roof.rotation.y = rot;
                roof.material = matRoof;
                // Flatten roof slightly
                roof.scaling.y = 0.6;
            };

            const createTree = (x, z) => {
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {diameter: 0.4, height: 2}, scene);
                trunk.position = new BABYLON.Vector3(x, 1, z);
                trunk.material = matWood;

                const leaves = BABYLON.MeshBuilder.CreateCone("leaves", {diameter: 3, height: 4}, scene);
                leaves.position = new BABYLON.Vector3(x, 3, z);
                leaves.material = matGrass;
            };

            // --- The Floating Island ---
            const islandBase = BABYLON.MeshBuilder.CreateCylinder("islandBase", {diameter: 30, height: 10, tessellation: 16}, scene);
            islandBase.position.y = -5;
            islandBase.material = matStone;
            // Randomize shape slightly to look like a rock
            islandBase.scaling.x = 1;
            islandBase.scaling.z = 1.1;

            const islandTop = BABYLON.MeshBuilder.CreateCylinder("islandTop", {diameter: 32, height: 1}, scene);
            islandTop.position.y = 0;
            islandTop.material = matGrass;

            // --- The Castle ---
            const castleGroup = new BABYLON.TransformNode("castle");
            
            const keep = BABYLON.MeshBuilder.CreateBox("keep", {width: 6, height: 12, depth: 6}, scene);
            keep.position = new BABYLON.Vector3(0, 6, 0);
            keep.material = matStone;

            const spire = BABYLON.MeshBuilder.CreateCylinder("spire", {diameter: 3, height: 6}, scene);
            spire.position = new BABYLON.Vector3(0, 15, 0);
            spire.material = matStone;

            const coneTop = BABYLON.MeshBuilder.CreateCone("coneTop", {diameter: 4, height: 4}, scene);
            coneTop.position = new BABYLON.Vector3(0, 18, 0);
            coneTop.material = matRoof;

            // Castle Walls
            const wallParams = {width: 12, height: 4, depth: 2};
            const wall1 = BABYLON.MeshBuilder.CreateBox("wall1", wallParams, scene);
            wall1.position = new BABYLON.Vector3(0, 2, 6);
            wall1.material = matStone;

            const wall2 = BABYLON.MeshBuilder.CreateBox("wall2", wallParams, scene);
            wall2.position = new BABYLON.Vector3(0, 2, -6);
            wall2.material = matStone;

            const wall3 = BABYLON.MeshBuilder.CreateBox("wall3", wallParams, scene);
            wall3.position = new BABYLON.Vector3(6, 2, 0);
            wall3.rotation.y = Math.PI / 2;
            wall3.material = matStone;

            const wall4 = BABYLON.MeshBuilder.CreateBox("wall4", wallParams, scene);
            wall4.position = new BABYLON.Vector3(-6, 2, 0);
            wall4.rotation.y = Math.PI / 2;
            wall4.material = matStone;

            // Battlements
            for(let i = -6; i <= 6; i+=2) {
                const b = BABYLON.MeshBuilder.CreateBox("b", {size: 0.5}, scene);
                b.position = new BABYLON.Vector3(i, 4.25, 6);
                b.material = matStone;
            }

            // --- The Village ---
            createHouse(8, 8, Math.PI/4);
            createHouse(10, 4, 0);
            createHouse(7, 2, -Math.PI/6);
            createHouse(12, -2, Math.PI/2);
            
            // Market Stalls
            for(let i=0; i<3; i++) {
                const stall = BABYLON.MeshBuilder.CreateBox("stall", {width: 2, height: 1, depth: 1}, scene);
                stall.position = new BABYLON.Vector3(8 + i*2, 0.5, 6);
                stall.material = matWood;
                const roofS = BABYLON.MeshBuilder.CreateBox("roofS", {width: 2.2, height: 0.2, depth: 1.2}, scene);
                roofS.position = new BABYLON.Vector3(8 + i*2, 1.1, 6);
                roofS.material = matRoof;
            }

            // --- River & Waterfalls ---
            const river = BABYLON.MeshBuilder.CreatePlane("river", {size: 20}, scene);
            river.rotation.x = Math.PI / 2;
            river.position = new BABYLON.Vector3(-8, 0.01, 0);
            river.material = matWater;
            river.scaling.x = 0.4; // Make it a strip

            const waterfall = BABYLON.MeshBuilder.CreatePlane("waterfall", {width: 4, height: 10}, scene);
            waterfall.position = new BABYLON.Vector3(-8, -5, 10);
            waterfall.rotation.x = Math.PI / 2;
            waterfall.material = matWater;

            // --- Ruined Watchtower ---
            const ruins = BABYLON.MeshBuilder.CreateCylinder("ruins", {diameter: 3, height: 5}, scene);
            ruins.position = new BABYLON.Vector3(-10, 2.5, -10);
            ruins.rotation.z = 0.2;
            ruins.material = matStone;
            const ruinTop = BABYLON.MeshBuilder.CreateBox("ruinTop", {size: 3}, scene);
            ruinTop.position = new BABYLON.Vector3(-10, 5, -10);
            ruinTop.material = matStone;
            ruinTop.scaling.x = 0.7;

            // --- Environment Details ---
            for(let i=0; i<15; i++) {
                const rx = (Math.random() - 0.5) * 25;
                const rz = (Math.random() - 0.5) * 25;
                if(Math.abs(rx) > 5 || Math.abs(rz) > 5) {
                    createTree(rx, rz);
                }
            }

            // Bridge
            const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {width: 4, height: 0.4, depth: 2}, scene);
            bridge.position = new BABYLON.Vector3(-8, 0.3, 2);
            bridge.material = matWood;

            // Animation for Waterfall
            let time = 0;
            scene.registerBeforeRender(() => {
                time += 0.1;
                waterfall.position.y = -5 + Math.sin(time) * 0.1;
                river.material.diffuseColor.r = 0 + Math.sin(time * 0.5) * 0.05;
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
