<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Floating Island — Medieval Diorama</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@1,400&display=swap');
  :root{
    --bg:#0b0d12;
    --text:#f0e6d2;
    --accent:#c9a84c;
    --accent2:#7a9e6e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100vh;width:100vw;overflow:hidden;background:var(--bg);color:var(--text);font-family:'EB Garamond',serif;}
  canvas{display:block;outline:none;}
  #ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:32px;}
  #title{font-family:'Cinzel Decorative',cursive;font-size:2.4rem;letter-spacing:0.15em;text-transform:uppercase;text-align:center;text-shadow:0 0 40px rgba(201,168,76,0.35),0 4px 20px rgba(0,0,0,0.9);color:#fdf6e3;}
  #subtitle{font-size:0.95rem;color:#cdb88a;margin-top:6px;letter-spacing:0.12em;font-style:italic;}
  #overlay{position:absolute;top:20px;right:20px;background:rgba(11,13,18,0.75);backdrop-filter:blur(8px);border:1px solid rgba(201,168,76,0.15);border-radius:14px;padding:14px 22px;color:#eaddb0;font-size:0.82rem;pointer-events:none;}
  .label{font-family:'Cinzel Decorative',cursive;font-weight:700;color:var(--accent);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="overlay">
  <div class="label">Floating Island Diorama</div>
  <div>Medieval Castle & Village • Turquoise River • Waterfall • Watchtower</div>
  <div style="margin-top:6px;color:#bfa876;font-size:0.75rem;">Drag to orbit • Scroll to zoom</div>
</div>

<div id="ui">
  <h1 id="title">The Floating Kingdom</h1>
  <p id="subtitle">A handcrafted miniature realm suspended above the mist</p>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
  // ==========================================================
  // Scene Setup
  // ==========================================================
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: true });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color3(0.04, 0.06, 0.14);
  scene.ambientColor = new BABYLON.Color3(0.85, 0.82, 0.75);
  scene.shadowsEnabled = true;

  // Soft fog for depth
  scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
  scene.fogDensity = 0.008;
  scene.fogColor = new BABYLON.Color3(0.12, 0.18, 0.28);

  // ==========================================================
  // Camera — Orbit with soft tilt
  // ==========================================================
  const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2.6, 1.15, 42, new BABYLON.Vector3(0, 3, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 28;
  camera.upperRadiusLimit = 70;
  camera.lowerBetaLimit = 0.35;
  camera.upperBetaLimit = 1.25;
  camera.speed = 0.6;
  camera.inertia = 0.75;
  camera.angularSensibilityX = 1200;
  camera.angularSensibilityY = 1200;

  // ==========================================================
  // Lighting — Soft warm + cool fill + moon glow
  // ==========================================================
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.2, 1, -0.3), scene);
  hemi.intensity = 0.9;
  hemi.diffuse = new BABYLON.Color3(1.0, 0.92, 0.78);
  hemi.groundColor = new BABYLON.Color3(0.35, 0.42, 0.55);

  const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.6, -0.9, -0.4), scene);
  sun.position = new BABYLON.Vector3(-30, 30, -20);
  sun.intensity = 1.1;
  sun.diffuse = new BABYLON.Color3(1.0, 0.96, 0.88);
  sun.specular = new BABYLON.Color3(1.0, 0.9, 0.7);
  sun.shadowEnabled = true;
  sun.shadowFrustumSize = 55;

  const moon = new BABYLON.PointLight("moon", new BABYLON.Vector3(40, 35, -40), scene);
  moon.diffuse = new BABYLON.Color3(0.75, 0.82, 1.0);
  moon.intensity = 0.6;

  // ==========================================================
  // Sky Dome — Floating atmosphere
  // ==========================================================
  const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
  skyMat.disableLighting = true;
  skyMat.emissiveColor = new BABYLON.Color3(0.08, 0.12, 0.22);
  skyMat.backFaceCulling = false;
  const skyDome = BABYLON.MeshBuilder.CreateSphere("sky", { segments: 24, diameter: 500 }, scene);
  skyDome.position.set(0, 0, 0);
  skyDome.material = skyMat;

  // ==========================================================
  // Procedural Materials
  // ==========================================================
  // Grass
  const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
  grassMat.diffuseColor = new BABYLON.Color3(0.35, 0.55, 0.22);
  grassMat.specularColor = new BABYLON.Color3(0.1, 0.15, 0.08);
  grassMat.roughness = 0.95;

  // Stone / Castle
  const stoneMat = new BABYLON.StandardMaterial("stoneMat", scene);
  stoneMat.diffuseColor = new BABYLON.Color3(0.82, 0.75, 0.68);
  stoneMat.specularColor = new BABYLON.Color3(0.45, 0.4, 0.35);
  stoneMat.roughness = 0.7;

  const stoneDark = new BABYLON.StandardMaterial("stoneDark", scene);
  stoneDark.diffuseColor = new BABYLON.Color3(0.58, 0.52, 0.42);
  stoneDark.specularColor = new BABYLON.Color3(0.25, 0.22, 0.18);
  stoneDark.roughness = 0.85;

  // Wood
  const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
  woodMat.diffuseColor = new BABYLON.Color3(0.55, 0.32, 0.18);
  woodMat.specularColor = new BABYLON.Color3(0.2, 0.1, 0.05);
  woodMat.roughness = 0.9;

  // Turquoise River
  const riverMat = new BABYLON.StandardMaterial("riverMat", scene);
  riverMat.diffuseColor = new BABYLON.Color3(0.15, 0.65, 0.7);
  riverMat.emissiveColor = new BABYLON.Color3(0.05, 0.3, 0.35);
  riverMat.specularColor = new BABYLON.Color3(0.9, 1.0, 1.0);
  riverMat.alpha = 0.92;

  // Roof tiles
  const roofMat = new BABYLON.StandardMaterial("roofMat", scene);
  roofMat.diffuseColor = new BABYLON.Color3(0.6, 0.18, 0.15);
  roofMat.specularColor = new BABYLON.Color3(0.3, 0.1, 0.08);
  roofMat.roughness = 0.8;

  // Pine foliage
  const pineMat = new BABYLON.StandardMaterial("pineMat", scene);
  pineMat.diffuseColor = new BABYLON.Color3(0.12, 0.35, 0.18);
  pineMat.specularColor = new BABYLON.Color3(0.05, 0.15, 0.1);
  pineMat.roughness = 0.95;

  // ==========================================================
  // Ground Island Base
  // ==========================================================
  const islandBase = BABYLON.MeshBuilder.CreateCylinder("island", { diameter: 32, height: 2.5, tessellation: 64 }, scene);
  islandBase.position.set(0, -0.5, 0);
  islandBase.rotation.x = Math.PI / 2;
  islandBase.material = grassMat;

  // Grass patch on top
  const grassPatch = BABYLON.MeshBuilder.CreateCylinder("grassPatch", { diameter: 26, height: 0.4, tessellation: 64 }, scene);
  grassPatch.position.set(0, 0.7, 0);
  grassPatch.rotation.x = Math.PI / 2;
  grassPatch.material = new BABYLON.StandardMaterial("grassPatchMat", scene);
  grassPatch.material.diffuseColor = new BABYLON.Color3(0.42, 0.62, 0.28);
  grassPatch.material.specularColor = new BABYLON.Color3(0.15, 0.25, 0.1);

  // ==========================================================
  // Rocky Cliffs (around edge)
  // ==========================================================
  const cliffGroup = new BABYLON.Mesh("cliffGroup", scene); // not a real mesh, just for grouping via parent
  // We'll create scattered rock cylinders around perimeter
  const rockMat = new BABYLON.StandardMaterial("rockMat", scene);
  rockMat.diffuseColor = new BABYLON.Color3(0.5, 0.42, 0.32);
  rockMat.specularColor = new BABYLON.Color3(0.2, 0.15, 0.1);

  for (let i = 0; i < 36; i++) {
    const angle = (i / 36) * Math.PI * 2;
    const r = 13.5 + Math.random() * 2.5;
    const h = 2 + Math.random() * 2.5;
    const rock = BABYLON.MeshBuilder.CreateCylinder("rock_" + i, { diameter: 1.2 + Math.random() * 1.2, height: h, tessellation: 8 }, scene);
    rock.position.set(Math.cos(angle) * r, -0.3 + Math.random() * 0.8, Math.sin(angle) * r);
    rock.rotation.y = Math.random() * Math.PI;
    rock.rotation.z = (Math.random() - 0.5) * 0.3;
    rock.material = rockMat;
  }

  // ==========================================================
  // Turquoise River & Waterfall
  // ==========================================================
  // Main river body — curved plane
  const river = BABYLON.MeshBuilder.CreatePlane("river", { size: 18, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  river.rotation.x = Math.PI / 2;
  river.rotation.z = -0.15;
  river.position.set(6, 0.35, 4);
  river.scaling.set(2.2, 3.5, 1);
  river.material = riverMat;

  // Small stream branch
  const stream = BABYLON.MeshBuilder.CreatePlane("stream", { size: 8, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  stream.rotation.x = Math.PI / 2;
  stream.rotation.z = 0.8;
  stream.position.set(3, 0.35, -8);
  stream.scaling.set(1, 2, 1);
  stream.material = riverMat;

  // Waterfall — vertical plane with particle cascade
  const waterfallMesh = BABYLON.MeshBuilder.CreatePlane("waterfall", { size: 2, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  waterfallMesh.rotation.x = 0;
  waterfallMesh.rotation.y = -Math.PI / 4;
  waterfallMesh.position.set(10.5, 4.5, 10);
  waterfallMesh.scaling.set(0.6, 4, 1);
  waterfallMesh.material = new BABYLON.StandardMaterial("fallMat", scene);
  waterfallMesh.material.diffuseColor = new BABYLON.Color3(0.6, 0.9, 1.0);
  waterfallMesh.material.emissiveColor = new BABYLON.Color3(0.15, 0.35, 0.45);
  waterfallMesh.material.alpha = 0.5;

  // Particle cascade for waterfall
  const fallParticles = new BABYLON.ParticleSystem("fallParticles", 1200, scene);
  fallParticles.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/star.png", scene); // small white dot
  // Since external texture may fail, we generate one inline
  const texCanvas = document.createElement("canvas");
  texCanvas.width = 32; texCanvas.height = 32;
  const ctx = texCanvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(16, 16, 10, 0, Math.PI * 2);
  ctx.fill();
  const whiteTex = new BABYLON.Texture(texCanvas.toDataURL("image/png"), scene);
  fallParticles.particleTexture = whiteTex;

  fallParticles.color1 = new BABYLON.Color4(0.6, 0.85, 1.0, 0.9);
  fallParticles.color2 = new BABYLON.Color4(0.3, 0.6, 1.0, 0.5);
  fallParticles.minSize = 0.05;
  fallParticles.maxSize = 0.2;
  fallParticles.minLifeTime = 0.8;
  fallParticles.maxLifeTime = 1.6;
  fallParticles.emitRate = 600;
  fallParticles.minEmitBox = new BABYLON.Vector3(-0.2, 0, -0.2);
  fallParticles.maxEmitBox = new BABYLON.Vector3(0.2, 0, 0.2);
  fallParticles.direction1 = new BABYLON.Vector3(0, -1, 0);
  fallParticles.direction2 = new BABYLON.Vector3(0, -1.5, 0);
  fallParticles.minEmitPower = 1;
  fallParticles.maxEmitPower = 4;
  fallParticles.gravity = new BABYLON.Vector3(0, -2, 0);
  fallParticles.emitter = waterfallMesh;
  fallParticles.start();

  // ==========================================================
  // Medieval Stone Castle (Central)
  // ==========================================================
  const castleGroup = new BABYLON.Mesh("castleGroup", scene); // grouping node

  // Main keep (large central tower)
  const keep = BABYLON.MeshBuilder.CreateCylinder("keep", { diameter: 4.5, height: 7, tessellation: 12 }, scene);
  keep.position.set(0, 4.2, -2);
  keep.material = stoneMat;

  // Keep roof (cone)
  const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", { diameterTop: 0, diameterBottom: 5.2, height: 2.8, tessellation: 12 }, scene);
  keepRoof.position.set(0, 7.4, -2);
  keepRoof.material = stoneDark;

  // Walls (rectangular ring)
  const wallMat = stoneDark.clone("wallMat");
  // North wall
  const wallN = BABYLON.MeshBuilder.CreateBox("wallN", { width: 14, height: 3.5, depth: 0.8 }, scene);
  wallN.position.set(0, 2.3, -7);
  wallN.material = wallMat;
  // South wall
  const wallS = BABYLON.MeshBuilder.CreateBox("wallS", { width: 14, height: 3.5, depth: 0.8 }, scene);
  wallS.position.set(0, 2.3, 2);
  wallS.material = wallMat;
  // East wall
  const wallE = BABYLON.MeshBuilder.CreateBox("wallE", { width: 0.8, height: 3.5, depth: 10 }, scene);
  wallE.position.set(7.2, 2.3, -2.5);
  wallE.material = wallMat;
  // West wall
  const wallW = BABYLON.MeshBuilder.CreateBox("wallW", { width: 0.8, height: 3.5, depth: 10 }, scene);
  wallW.position.set(-7.2, 2.3, -2.5);
  wallW.material = wallMat;

  // Gatehouse (center of south wall)
  const gateHouse = BABYLON.MeshBuilder.CreateBox("gateHouse", { width: 3.5, height: 4.8, depth: 1.2 }, scene);
  gateHouse.position.set(0, 2.4, 3.2);
  gateHouse.material = stoneMat;
  // Gate arch (cutout shape using dark plane)
  const gateArch = BABYLON.MeshBuilder.CreateCylinder("gateArch", { diameterTop: 0, diameterBottom: 2.4, height: 3.8, tessellation: 16 }, scene);
  gateArch.rotation.x = Math.PI / 2;
  gateArch.rotation.y = Math.PI / 2;
  gateArch.position.set(0, 1.8, 3.2);
  gateArch.material = stoneDark;

  // Corner turrets
  const turretMat = stoneMat.clone("turretMat");
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI / 2;
    const tx = Math.sin(angle) * 6.8;
    const tz = Math.cos(angle) * 6.8;
    const turret = BABYLON.MeshBuilder.CreateCylinder("turret_" + i, { diameter: 2.2, height: 5, tessellation: 10 }, scene);
    turret.position.set(tx, 3.2, tz - 0.8);
    turret.material = turretMat;
    // Turret roof
    const roof = BABYLON.MeshBuilder.CreateCylinder("turretRoof_" + i, { diameterTop: 0, diameterBottom: 2.6, height: 1.8, tessellation: 10 }, scene);
    roof.position.set(tx, 5.1, tz - 0.8);
    roof.material = stoneDark;
  }

  // Small windows (tiny dark rectangles)
  for (let i = 0; i < 12; i++) {
    const win = BABYLON.MeshBuilder.CreateBox("win_" + i, { width: 0.35, height: 0.55, depth: 0.05 }, scene);
    const angle = (i / 12) * Math.PI * 2;
    const r = 2.2;
    win.position.set(Math.sin(angle) * r, 5.2, Math.cos(angle) * r - 2);
    win.rotation.y = angle + Math.PI / 2;
    win.material = new BABYLON.StandardMaterial("winMat", scene);
    win.material.diffuseColor = new BABYLON.Color3(0.1, 0.15, 0.25);
    win.material.emissiveColor = new BABYLON.Color3(0.02, 0.03, 0.05);
  }

  // ==========================================================
  // Medieval Village
  // ==========================================================
  // Small wooden house 1
  const house1 = BABYLON.MeshBuilder.CreateBox("house1_body", { width: 2, height: 2, depth: 2.2 }, scene);
  house1.position.set(-5, 1, 5);
  house1.material = woodMat;
  const h1Roof = BABYLON.MeshBuilder.CreateCylinder("h1Roof", { diameterTop: 0, diameterBottom: 2.6, height: 1.2, tessellation: 8 }, scene);
  h1Roof.position.set(-5, 2.6, 5);
  h1Roof.rotation.z = Math.PI / 6;
  h1Roof.material = roofMat;

  // Tavern (larger, with sign)
  const tavern = BABYLON.MeshBuilder.CreateBox("tavern", { width: 3, height: 2.4, depth: 2.8 }, scene);
  tavern.position.set(-8, 1.2, -6);
  tavern.material = woodMat;
  const tavernRoof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", { diameterTop: 0, diameterBottom: 3.4, height: 1.5, tessellation: 8 }, scene);
  tavernRoof.position.set(-8, 2.7, -6);
  tavernRoof.rotation.z = -Math.PI / 8;
  tavernRoof.material = roofMat;
  // Tavern sign (small hanging box)
  const sign = BABYLON.MeshBuilder.CreatePlane("sign", { width: 1.2, height: 0.5 }, scene);
  sign.position.set(-8, 2.4, -4.5);
  sign.rotation.y = Math.PI / 2;
  sign.material = new BABYLON.StandardMaterial("signMat", scene);
  sign.material.diffuseColor = new BABYLON.Color3(0.7, 0.55, 0.35);
  sign.material.emissiveColor = new BABYLON.Color3(0.1, 0.05, 0.02);

  // Market stalls (small boxes with colorful canopies)
  for (let i = 0; i < 3; i++) {
    const stall = BABYLON.MeshBuilder.CreateBox("stall_" + i, { width: 1.2, height: 1.2, depth: 1.2 }, scene);
    stall.position.set(-2 + i * 2, 0.6, 6);
    stall.material = woodMat;
    const canopy = BABYLON.MeshBuilder.CreateCylinder("canopy_" + i, { diameterTop: 0, diameterBottom: 1.6, height: 0.8, tessellation: 8 }, scene);
    canopy.position.set(-2 + i * 2, 1.4, 6);
    canopy.material = new BABYLON.StandardMaterial("canopy_" + i, scene);
    canopy.material.diffuseColor = new BABYLON.Color3(0.9, 0.5, 0.2 + i * 0.2);
    canopy.material.specularColor = new BABYLON.Color3(0.3, 0.15, 0.05);
  }

  // Riverside Mill (near river)
  const mill = BABYLON.MeshBuilder.CreateCylinder("mill", { diameter: 2.2, height: 3, tessellation: 12 }, scene);
  mill.position.set(9, 1.8, 2);
  mill.rotation.z = Math.PI / 2;
  mill.material = woodMat;
  const millWheel = BABYLON.MeshBuilder.CreateCylinder("millWheel", { diameter: 2.8, height: 0.4, tessellation: 16 }, scene);
  millWheel.position.set(10.2, 1.5, 2);
  millWheel.rotation.z = Math.PI / 2;
  millWheel.material = stoneDark;

  // ==========================================================
  // Wooden Bridges
  // ==========================================================
  const bridgeMat = woodMat.clone("bridgeMat");
  bridgeMat.diffuseColor = new BABYLON.Color3(0.7, 0.42, 0.22);
  for (let i = 0; i < 2; i++) {
    const bridge = BABYLON.MeshBuilder.CreateBox("bridge_" + i, { width: 3.5, height: 0.3, depth: 1.2 }, scene);
    bridge.position.set(2 + i * 2.5, 0.5, 0);
    bridge.rotation.y = i === 1 ? 0.2 : -0.15;
    bridge.material = bridgeMat;
    // Railings
    const railL = BABYLON.MeshBuilder.CreateBox("railL_" + i, { width: 0.1, height: 0.6, depth: 1.4 }, scene);
    railL.position.set((i === 1 ? (2 + i * 2.5) - 1.7 : 2 + i * 2.5 - 1.7), 0.8, 0);
    railL.material = woodMat;
    const railR = BABYLON.MeshBuilder.CreateBox("railR_" + i, { width: 0.1, height: 0.6, depth: 1.4 }, scene);
    railR.position.set((i === 1 ? (2 + i * 2.5) + 1.7 : 2 + i * 2.5 + 1.7), 0.8, 0);
    railR.material = woodMat;
  }

  // ==========================================================
  // Pine Trees
  // ==========================================================
  function createPine(x, z, scale = 1) {
    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk_" + x + "_" + z, { diameter: 0.5 * scale, height: 1.8 * scale, tessellation: 8 }, scene);
    trunk.position.set(x, 0.9 * scale, z);
    trunk.material = new BABYLON.StandardMaterial("trunkMat_" + x, scene);
    trunk.material.diffuseColor = new BABYLON.Color3(0.35, 0.22, 0.14);

    for (let tier = 0; tier < 3; tier++) {
      const foliage = BABYLON.MeshBuilder.CreateCylinder("fol_" + x + "_" + z + "_" + tier, { diameterTop: 0, diameterBottom: 1.4 * scale * (1 - tier * 0.2), height: 1.2 * scale, tessellation: 8 }, scene);
      foliage.position.set(x, 1.6 * scale + tier * 0.7 * scale, z);
      foliage.material = pineMat;
    }
  }

  // Cluster around village and cliff
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 8 + Math.random() * 12;
    createPine(Math.sin(angle) * r, Math.cos(angle) * r, 0.8 + Math.random() * 0.7);
  }

  // ==========================================================
  // Ruined Watchtower (Edge)
  // ==========================================================
  const towerBase = BABYLON.MeshBuilder.CreateCylinder("towerBase", { diameter: 2, height: 5, tessellation: 12 }, scene);
  towerBase.position.set(-13, 2.5, 10);
  towerBase.material = stoneDark;

  // Broken top (half cylinder missing)
  const brokenTop = BABYLON.MeshBuilder.CreateCylinder("brokenTop", { diameterTop: 0, diameterBottom: 2.6, height: 2.5, tessellation: 12 }, scene);
  brokenTop.position.set(-13, 6.25, 10.4);
  brokenTop.rotation.z = 0.3;
  brokenTop.scaling.z = 0.6; // flatten slightly to show break
  brokenTop.material = stoneMat;

  // Rubble at base
  for (let i = 0; i < 8; i++) {
    const rubble = BABYLON.MeshBuilder.CreateSphere("rubble_" + i, { diameter: 0.6 + Math.random() * 0.8, segments: 6 }, scene);
    rubble.position.set(-13 + (Math.random() - 0.5) * 2.5, 0.3, 10 + (Math.random() - 0.5) * 2.5);
    rubble.material = rockMat;
  }

  // ==========================================================
  // Extra Details — Lanterns, Flowers, Rocks
  // ==========================================================
  // Small lantern point lights near castle entrance
  const lantern1 = new BABYLON.PointLight("lantern1", new BABYLON.Vector3(1, 2.5, 3.8), scene);
  lantern1.intensity = 0.9;
  lantern1.diffuse = new BABYLON.Color3(1.0, 0.85, 0.4);
  lantern1.range = 4;

  const lantern2 = new BABYLON.PointLight("lantern2", new BABYLON.Vector3(-1, 2.5, 3.8), scene);
  lantern2.intensity = 0.9;
  lantern2.diffuse = new BABYLON.Color3(1.0, 0.85, 0.4);
  lantern2.range = 4;

  // Flower clusters (small spheres in bright colors)
  for (let i = 0; i < 15; i++) {
    const fl = BABYLON.MeshBuilder.CreateSphere("flower_" + i, { diameter: 0.15 + Math.random() * 0.2, segments: 4 }, scene);
    const angle = Math.random() * Math.PI * 2;
    const r = 6 + Math.random() * 6;
    fl.position.set(Math.sin(angle) * r, 0.85, Math.cos(angle) * r);
    fl.material = new BABYLON.StandardMaterial("flowerMat_" + i, scene);
    const colors = [new BABYLON.Color3(0.9, 0.25, 0.35), new BABYLON.Color3(1.0, 0.9, 0.2), new BABYLON.Color3(0.4, 0.2, 0.9)];
    fl.material.diffuseColor = colors[Math.floor(Math.random() * colors.length)];
    fl.material.emissiveColor = colors[Math.floor(Math.random() * colors.length)].scale(0.5);
  }

  // Additional scattered rocks
  for (let i = 0; i < 20; i++) {
    const r = BABYLON.MeshBuilder.CreateSphere("detailRock_" + i, { diameter: 0.4 + Math.random() * 0.6, segments: 4 }, scene);
    r.position.set((Math.random() - 0.5) * 14, 0.2, (Math.random() - 0.5) * 14);
    r.material = rockMat;
  }

  // ==========================================================
  // Soft Environment Glow (Point lights in village)
  // ==========================================================
  const glow1 = new BABYLON.PointLight("glow1", new BABYLON.Vector3(-8, 2.5, -6), scene);
  glow1.intensity = 0.5;
  glow1.diffuse = new BABYLON.Color3(1.0, 0.8, 0.55);

  // ==========================================================
  // Render Loop
  // ==========================================================
  engine.runRenderLoop(() => {
    scene.render();
  });

  window.addEventListener("resize", () => {
    engine.resize();
  });
</script>
</body>
</html>
