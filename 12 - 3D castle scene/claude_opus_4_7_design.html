<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island · Medieval Diorama</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1530; }
  #renderCanvas {
    width: 100%; height: 100%; display: block;
    touch-action: none; outline: none;
  }
  .ui {
    position: fixed; top: 16px; left: 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    background: rgba(15,15,30,0.6);
    backdrop-filter: blur(14px);
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    max-width: 280px;
    pointer-events: none;
    z-index: 10;
  }
  .ui h1 { font-size: 15px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
  .ui p { font-size: 11px; opacity: 0.75; line-height: 1.5; }
  .ui kbd {
    background: rgba(255,255,255,0.12);
    padding: 1px 6px; border-radius: 4px;
    font-size: 10px; font-family: inherit;
  }
  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, #2a2045 0%, #0c0720 100%);
    color: #fff; z-index: 100;
    font-family: -apple-system, sans-serif;
    font-size: 14px; letter-spacing: 2px;
    transition: opacity 0.6s;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #f5b94a;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-inner { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div class="ui">
  <h1>🏰 Floating Realm</h1>
  <p><kbd>drag</kbd> orbit · <kbd>wheel</kbd> zoom · <kbd>right-drag</kbd> pan</p>
</div>

<div class="loading" id="loading">
  <div class="loading-inner">
    <div class="spinner"></div>
    <div>BUILDING WORLD…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@6.49.0/babylon.js"></script>

<script>
/* ============================================================
   FLOATING ISLAND MEDIEVAL DIORAMA
   Babylon.js · handcrafted low-poly tabletop look
   ============================================================ */

const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, antialias: true });

const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.12, 0.10, 0.22, 1);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogColor = new BABYLON.Color3(0.55, 0.55, 0.75);
scene.fogDensity = 0.006;

/* ---------- CAMERA ---------- */
const camera = new BABYLON.ArcRotateCamera(
  'cam',
  -Math.PI / 2.3, Math.PI / 3.2, 55,
  new BABYLON.Vector3(0, 2, 0),
  scene
);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 20;
camera.upperRadiusLimit = 120;
camera.lowerBetaLimit = 0.2;
camera.upperBetaLimit = Math.PI / 2.1;
camera.wheelPrecision = 3;
camera.panningSensibility = 1000;

/* ---------- LIGHTING ---------- */
const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.3, 1, 0.2), scene);
hemi.intensity = 0.55;
hemi.groundColor = new BABYLON.Color3(0.28, 0.26, 0.42);
hemi.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.4, -0.9, -0.5), scene);
sun.intensity = 1.3;
sun.diffuse = new BABYLON.Color3(1, 0.85, 0.6);
sun.specular = new BABYLON.Color3(0.3, 0.25, 0.2);
sun.position = new BABYLON.Vector3(40, 60, 40);

// Shadows
const shadowGen = new BABYLON.ShadowGenerator(1024, sun);
shadowGen.useBlurExponentialShadowMap = true;
shadowGen.blurKernel = 32;
shadowGen.darkness = 0.35;

/* ---------- SKY (gradient dome) ---------- */
const sky = BABYLON.MeshBuilder.CreateSphere('sky', { diameter: 500, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
skyMat.backFaceCulling = false;
skyMat.disableLighting = true;
// Procedural gradient texture via dynamic canvas
const skyTex = new BABYLON.DynamicTexture('skyTex', { width: 512, height: 512 }, scene, false);
const skyCtx = skyTex.getContext();
const grad = skyCtx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0, '#f5c28c');
grad.addColorStop(0.3, '#e89b9a');
grad.addColorStop(0.55, '#b383c7');
grad.addColorStop(0.85, '#5c4d99');
grad.addColorStop(1, '#2e2458');
skyCtx.fillStyle = grad;
skyCtx.fillRect(0, 0, 512, 512);
skyTex.update();
skyMat.emissiveTexture = skyTex;
skyMat.disableLighting = true;
sky.material = skyMat;
sky.infiniteDistance = true;

/* ---------- MATERIALS ---------- */
function mat(name, r, g, b, opts = {}) {
  const m = new BABYLON.StandardMaterial(name, scene);
  m.diffuseColor = new BABYLON.Color3(r, g, b);
  m.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);
  if (opts.emissive) m.emissiveColor = new BABYLON.Color3(opts.emissive[0], opts.emissive[1], opts.emissive[2]);
  if (opts.alpha !== undefined) m.alpha = opts.alpha;
  return m;
}
const M = {
  grass:    mat('grass',    0.35, 0.62, 0.28),
  grassDark:mat('grassD',   0.25, 0.48, 0.22),
  dirt:     mat('dirt',     0.48, 0.36, 0.24),
  rock:     mat('rock',     0.42, 0.40, 0.42),
  rockDk:   mat('rockD',    0.28, 0.26, 0.30),
  stone:    mat('stone',    0.68, 0.66, 0.62),
  stoneDk:  mat('stoneD',   0.48, 0.46, 0.44),
  roofRed:  mat('roofR',    0.72, 0.28, 0.22),
  roofBlue: mat('roofB',    0.35, 0.45, 0.62),
  wood:     mat('wood',     0.55, 0.36, 0.22),
  woodDk:   mat('woodDk',   0.36, 0.22, 0.14),
  plaster:  mat('plaster',  0.94, 0.88, 0.74),
  water:    mat('water',    0.28, 0.78, 0.82, { alpha: 0.85 }),
  waterFoam:mat('foam',     0.92, 0.96, 0.98),
  pineDark: mat('pineD',    0.14, 0.36, 0.22),
  pineLight:mat('pineL',    0.22, 0.48, 0.28),
  windowW:  mat('winW',     1.0, 0.85, 0.45, { emissive: [0.7, 0.55, 0.2] }),
  gold:     mat('gold',     0.95, 0.78, 0.35, { emissive: [0.2, 0.15, 0.05] }),
  flag:     mat('flag',     0.85, 0.25, 0.30),
  pathStone:mat('path',     0.74, 0.70, 0.60),
};
M.water.specularColor = new BABYLON.Color3(0.9, 0.9, 1);
M.water.specularPower = 64;

/* ============================================================
   HELPERS
   ============================================================ */
function randRange(a, b) { return a + Math.random() * (b - a); }

function addShadowCaster(mesh) {
  shadowGen.addShadowCaster(mesh, true);
  mesh.receiveShadows = true;
}

/* ============================================================
   ISLAND BASE (steep cliff bottom + grass top)
   ============================================================ */
function buildIsland() {
  const islandGroup = new BABYLON.TransformNode('island', scene);

  // Top plateau — organic irregular shape
  const topPoints = [];
  const topRadius = 26;
  const segs = 24;
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const r = topRadius + Math.sin(a * 3) * 2.5 + Math.cos(a * 5) * 1.5;
    topPoints.push(new BABYLON.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
  }
  topPoints.push(topPoints[0].clone()); // close

  // Build top as polygon (using extruded polygon)
  const top = BABYLON.MeshBuilder.ExtrudePolygon('top', {
    shape: topPoints, depth: 2,
    sideOrientation: BABYLON.Mesh.DOUBLESIDE
  }, scene, window.earcut);
  top.material = M.grass;
  top.position.y = 2;
  top.receiveShadows = true;
  top.parent = islandGroup;

  // Dirt rim — slightly smaller, underneath
  const rimPoints = topPoints.map(p => p.scale(0.97));
  const rim = BABYLON.MeshBuilder.ExtrudePolygon('rim', {
    shape: rimPoints, depth: 1.5,
    sideOrientation: BABYLON.Mesh.DOUBLESIDE
  }, scene, window.earcut);
  rim.material = M.dirt;
  rim.position.y = 0.5;
  rim.parent = islandGroup;

  // Cliffs underneath — narrowing downward (stacked rings)
  const layers = 14;
  for (let i = 0; i < layers; i++) {
    const t = i / layers;
    const yPos = -i * 1.6;
    const shrink = 0.97 - t * 0.72;
    const jitter = 0.15 + t * 0.4;
    const ringPts = [];
    for (let j = 0; j < segs; j++) {
      const a = (j / segs) * Math.PI * 2;
      const r = (topRadius + Math.sin(a * 3) * 2.5 + Math.cos(a * 5) * 1.5) * shrink
              + (Math.sin(a * 7 + i) * jitter * 2);
      ringPts.push(new BABYLON.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
    }
    ringPts.push(ringPts[0].clone());
    const ring = BABYLON.MeshBuilder.ExtrudePolygon('cliff' + i, {
      shape: ringPts, depth: 1.7,
      sideOrientation: BABYLON.Mesh.DOUBLESIDE
    }, scene, window.earcut);
    const shade = i % 2 === 0 ? M.rock : M.rockDk;
    ring.material = shade;
    ring.position.y = yPos;
    ring.parent = islandGroup;
    ring.receiveShadows = true;
  }

  // Bottom jagged spike
  const spike = BABYLON.MeshBuilder.CreateCylinder('spike', {
    diameterTop: 5, diameterBottom: 0.5, height: 10, tessellation: 8
  }, scene);
  spike.material = M.rockDk;
  spike.position.y = -layers * 1.6 - 4;
  spike.parent = islandGroup;

  return islandGroup;
}

// earcut is loaded globally from CDN above

/* ============================================================
   CASTLE (center, on hill)
   ============================================================ */
function buildCastle() {
  const g = new BABYLON.TransformNode('castle', scene);
  g.position.set(0, 2, -2);

  // Hill base
  const hill = BABYLON.MeshBuilder.CreateCylinder('hill', {
    diameterTop: 10, diameterBottom: 14, height: 2.5, tessellation: 12
  }, scene);
  hill.material = M.grassDark;
  hill.position.y = 1.25;
  hill.parent = g;
  hill.receiveShadows = true;

  // Main keep
  const keep = BABYLON.MeshBuilder.CreateBox('keep', { width: 5, height: 7, depth: 5 }, scene);
  keep.material = M.stone;
  keep.position.y = 6;
  keep.parent = g;
  addShadowCaster(keep);

  // Keep roof
  const keepRoof = BABYLON.MeshBuilder.CreateCylinder('keepRoof', {
    diameterTop: 0, diameterBottom: 7, height: 3, tessellation: 4
  }, scene);
  keepRoof.material = M.roofBlue;
  keepRoof.position.y = 11;
  keepRoof.rotation.y = Math.PI / 4;
  keepRoof.parent = g;
  addShadowCaster(keepRoof);

  // Four corner towers
  const towerPositions = [
    { x:  3.5, z:  3.5 },
    { x: -3.5, z:  3.5 },
    { x:  3.5, z: -3.5 },
    { x: -3.5, z: -3.5 },
  ];
  towerPositions.forEach((p, i) => {
    const tower = BABYLON.MeshBuilder.CreateCylinder('tower' + i, {
      diameter: 2.2, height: 10, tessellation: 10
    }, scene);
    tower.material = M.stone;
    tower.position.set(p.x, 7.5, p.z);
    tower.parent = g;
    addShadowCaster(tower);

    // Crenellated top ring
    const crown = BABYLON.MeshBuilder.CreateCylinder('crown' + i, {
      diameter: 2.6, height: 0.6, tessellation: 10
    }, scene);
    crown.material = M.stoneDk;
    crown.position.set(p.x, 12.5, p.z);
    crown.parent = g;

    // Conical roof
    const cone = BABYLON.MeshBuilder.CreateCylinder('cone' + i, {
      diameterTop: 0, diameterBottom: 2.6, height: 3, tessellation: 10
    }, scene);
    cone.material = M.roofRed;
    cone.position.set(p.x, 14.3, p.z);
    cone.parent = g;
    addShadowCaster(cone);

    // Flag pole + flag
    const pole = BABYLON.MeshBuilder.CreateCylinder('pole' + i, {
      diameter: 0.08, height: 1.5, tessellation: 6
    }, scene);
    pole.material = M.woodDk;
    pole.position.set(p.x, 16.5, p.z);
    pole.parent = g;

    const flag = BABYLON.MeshBuilder.CreatePlane('flag' + i, { width: 0.8, height: 0.5 }, scene);
    flag.material = M.flag;
    flag.position.set(p.x + 0.4, 16.7, p.z);
    flag.parent = g;
  });

  // Curtain wall pieces (connecting towers)
  function wall(x1, z1, x2, z2) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    const w = BABYLON.MeshBuilder.CreateBox('wall', {
      width: len, height: 3, depth: 0.8
    }, scene);
    w.material = M.stoneDk;
    w.position.set((x1 + x2) / 2, 4, (z1 + z2) / 2);
    w.rotation.y = Math.atan2(dz, dx);
    w.parent = g;
    addShadowCaster(w);
  }
  wall( 3.5,  3.5, -3.5,  3.5);
  wall( 3.5, -3.5, -3.5, -3.5);
  wall( 3.5,  3.5,  3.5, -3.5);
  wall(-3.5,  3.5, -3.5, -3.5);

  // Gate (arch on front wall — dark hole)
  const gate = BABYLON.MeshBuilder.CreateBox('gate', { width: 1.5, height: 2, depth: 1 }, scene);
  gate.material = M.woodDk;
  gate.position.set(0, 3.5, 3.5);
  gate.parent = g;

  // Gold finial on keep
  const finial = BABYLON.MeshBuilder.CreateSphere('finial', { diameter: 0.5 }, scene);
  finial.material = M.gold;
  finial.position.y = 12.8;
  finial.parent = g;

  // Windows (emissive dots)
  for (let i = 0; i < 3; i++) {
    const w = BABYLON.MeshBuilder.CreatePlane('win' + i, { width: 0.4, height: 0.6 }, scene);
    w.material = M.windowW;
    w.position.set(-1 + i, 6, 2.52);
    w.parent = g;
  }
  for (let i = 0; i < 3; i++) {
    const w = BABYLON.MeshBuilder.CreatePlane('winB' + i, { width: 0.4, height: 0.6 }, scene);
    w.material = M.windowW;
    w.position.set(-1 + i, 6, -2.52);
    w.rotation.y = Math.PI;
    w.parent = g;
  }

  return g;
}

/* ============================================================
   MEDIEVAL HOUSE builder
   ============================================================ */
function buildHouse(x, z, opts = {}) {
  const g = new BABYLON.TransformNode('house', scene);
  g.position.set(x, 2, z);
  if (opts.rot) g.rotation.y = opts.rot;

  const w = opts.w || 2.2;
  const h = opts.h || 1.8;
  const d = opts.d || 2.2;
  const roofH = opts.roofH || 1.4;
  const roofMat = opts.roof || M.roofRed;
  const wallMat = opts.wall || M.plaster;

  // Base
  const base = BABYLON.MeshBuilder.CreateBox('hb', { width: w, height: h, depth: d }, scene);
  base.material = wallMat;
  base.position.y = h / 2;
  base.parent = g;
  addShadowCaster(base);

  // Wood beams (cross timber look) — thin strips on front/back
  const beam1 = BABYLON.MeshBuilder.CreateBox('bm1', { width: w * 1.02, height: 0.12, depth: 0.05 }, scene);
  beam1.material = M.woodDk;
  beam1.position.set(0, h * 0.5, d / 2 + 0.001);
  beam1.parent = g;
  const beam2 = beam1.clone('bm2');
  beam2.position.z = -(d / 2 + 0.001);

  // Vertical beams
  for (let i = -1; i <= 1; i++) {
    const vb = BABYLON.MeshBuilder.CreateBox('vb', { width: 0.12, height: h, depth: 0.05 }, scene);
    vb.material = M.woodDk;
    vb.position.set(i * (w / 2 - 0.1), h / 2, d / 2 + 0.002);
    vb.parent = g;
  }

  // Roof (prism using triangular extrusion)
  const roof = BABYLON.MeshBuilder.CreateBox('roof', { width: w + 0.2, height: roofH, depth: d + 0.2 }, scene);
  roof.scaling.x = 0.01;
  // Actually: build roof from two slanted boxes
  const rL = BABYLON.MeshBuilder.CreateBox('rL', { width: w + 0.2, height: 0.15, depth: Math.sqrt((d/2)**2 + roofH**2) + 0.2 }, scene);
  rL.material = roofMat;
  rL.position.set(0, h + roofH / 2, -d / 4);
  rL.rotation.x = -Math.atan2(roofH, d / 2);
  rL.parent = g;
  addShadowCaster(rL);
  const rR = rL.clone('rR');
  rR.position.z = d / 4;
  rR.rotation.x = Math.atan2(roofH, d / 2);
  roof.dispose();

  // Door
  const door = BABYLON.MeshBuilder.CreateBox('door', { width: 0.5, height: 0.9, depth: 0.05 }, scene);
  door.material = M.woodDk;
  door.position.set(0, 0.45, d / 2 + 0.03);
  door.parent = g;

  // Window
  const win = BABYLON.MeshBuilder.CreatePlane('win', { width: 0.3, height: 0.3 }, scene);
  win.material = M.windowW;
  win.position.set(-w / 3, h * 0.7, d / 2 + 0.04);
  win.parent = g;
  const win2 = win.clone('win2');
  win2.position.x = w / 3;

  // Chimney (sometimes)
  if (Math.random() > 0.5) {
    const chim = BABYLON.MeshBuilder.CreateBox('chim', { width: 0.3, height: 0.8, depth: 0.3 }, scene);
    chim.material = M.stoneDk;
    chim.position.set(w / 3, h + roofH * 0.5 + 0.3, 0);
    chim.parent = g;
  }

  return g;
}

/* ============================================================
   VILLAGE — cluster of houses, tavern, stalls
   ============================================================ */
function buildVillage() {
  const g = new BABYLON.TransformNode('village', scene);

  // Houses arranged around the castle in a village square
  const houseConfigs = [
    { x:  11, z:  8, rot: -0.3 },
    { x:  14, z:  3, rot:  0.2 },
    { x:  13, z: -2, rot:  0.6 },
    { x:  10, z: -6, rot:  1.2 },
    { x: -11, z:  9, rot:  0.3 },
    { x: -14, z:  4, rot: -0.2 },
    { x: -13, z: -2, rot: -0.5 },
    { x:  -8, z: 12, rot:  1.1, roof: M.roofBlue },
    { x:   7, z: 13, rot: -0.8 },
    { x:  -3, z: 14, rot:  0.0, roof: M.roofBlue },
  ];
  houseConfigs.forEach(c => {
    const h = buildHouse(c.x, c.z, {
      rot: c.rot, roof: c.roof,
      w: randRange(2, 2.8),
      h: randRange(1.6, 2.2),
      d: randRange(2, 2.8),
    });
    if (h) h.parent = g;
  });

  // Tavern (bigger building w/ sign)
  const tavern = buildHouse(-9, -1, { w: 3.5, h: 2.5, d: 3.5, roof: M.roofRed, rot: 0.15 });
  tavern.parent = g;

  // Tavern sign post
  const signPole = BABYLON.MeshBuilder.CreateCylinder('sp', { diameter: 0.1, height: 2, tessellation: 6 }, scene);
  signPole.material = M.woodDk;
  signPole.position.set(-6.8, 3, -0.5);
  signPole.parent = g;
  const sign = BABYLON.MeshBuilder.CreateBox('sign', { width: 0.8, height: 0.5, depth: 0.08 }, scene);
  sign.material = M.wood;
  sign.position.set(-6.8, 3.6, -0.5);
  sign.parent = g;

  // Market stalls — colored cloth canopies on posts
  const stallColors = [M.roofRed, M.roofBlue, M.flag];
  for (let i = 0; i < 4; i++) {
    const sg = new BABYLON.TransformNode('stall' + i, scene);
    const sx = -2 + i * 1.8;
    const sz = 6;
    sg.position.set(sx, 2, sz);
    sg.parent = g;

    // Canopy
    const canopy = BABYLON.MeshBuilder.CreateBox('can', { width: 1.4, height: 0.1, depth: 1.2 }, scene);
    canopy.material = stallColors[i % stallColors.length];
    canopy.position.y = 1.5;
    canopy.rotation.x = -0.2;
    canopy.parent = sg;

    // Posts
    for (let j = 0; j < 4; j++) {
      const post = BABYLON.MeshBuilder.CreateCylinder('p', { diameter: 0.08, height: 1.5, tessellation: 6 }, scene);
      post.material = M.woodDk;
      const px = (j % 2 ? 0.6 : -0.6);
      const pz = (j < 2 ? 0.5 : -0.5);
      post.position.set(px, 0.75, pz);
      post.parent = sg;
    }
    // Table
    const table = BABYLON.MeshBuilder.CreateBox('tbl', { width: 1.3, height: 0.1, depth: 1.1 }, scene);
    table.material = M.wood;
    table.position.y = 0.8;
    table.parent = sg;

    // Random produce box
    const box = BABYLON.MeshBuilder.CreateBox('bx', { width: 0.3, height: 0.25, depth: 0.3 }, scene);
    box.material = M.woodDk;
    box.position.set(0.3, 1, 0.2);
    box.parent = sg;
  }

  // Village well
  const well = BABYLON.MeshBuilder.CreateCylinder('well', { diameter: 1.2, height: 0.8, tessellation: 12 }, scene);
  well.material = M.stone;
  well.position.set(0, 2.4, 8);
  well.parent = g;
  const wellPost1 = BABYLON.MeshBuilder.CreateBox('wp', { width: 0.12, height: 1.3, depth: 0.12 }, scene);
  wellPost1.material = M.woodDk;
  wellPost1.position.set(-0.5, 3.45, 8);
  wellPost1.parent = g;
  const wellPost2 = wellPost1.clone('wp2');
  wellPost2.position.x = 0.5;
  const wellRoof = BABYLON.MeshBuilder.CreateBox('wr', { width: 1.3, height: 0.1, depth: 0.8 }, scene);
  wellRoof.material = M.roofRed;
  wellRoof.position.set(0, 4.1, 8);
  wellRoof.parent = g;

  return g;
}

/* ============================================================
   WINDMILL / RIVERSIDE MILL
   ============================================================ */
function buildMill() {
  const g = new BABYLON.TransformNode('mill', scene);
  g.position.set(16, 2, 10);

  // Tower base
  const base = BABYLON.MeshBuilder.CreateCylinder('mBase', {
    diameterTop: 2, diameterBottom: 2.6, height: 4, tessellation: 12
  }, scene);
  base.material = M.plaster;
  base.position.y = 2;
  base.parent = g;
  addShadowCaster(base);

  // Conical roof
  const cap = BABYLON.MeshBuilder.CreateCylinder('mCap', {
    diameterTop: 0.2, diameterBottom: 2.2, height: 1.6, tessellation: 12
  }, scene);
  cap.material = M.roofRed;
  cap.position.y = 4.8;
  cap.parent = g;

  // Windmill blades
  const hubPos = new BABYLON.Vector3(0, 4.5, 1.2);
  const hub = BABYLON.MeshBuilder.CreateCylinder('hub', { diameter: 0.3, height: 0.3, tessellation: 8 }, scene);
  hub.material = M.woodDk;
  hub.position.copyFrom(hubPos);
  hub.rotation.x = Math.PI / 2;
  hub.parent = g;

  const bladeGroup = new BABYLON.TransformNode('blades', scene);
  bladeGroup.position.copyFrom(hubPos);
  bladeGroup.parent = g;
  for (let i = 0; i < 4; i++) {
    const blade = BABYLON.MeshBuilder.CreateBox('blade' + i, { width: 0.15, height: 2.4, depth: 0.05 }, scene);
    blade.material = M.wood;
    blade.position.y = 1.3;
    blade.rotation.z = (i * Math.PI) / 2;
    const bp = new BABYLON.TransformNode('bp' + i, scene);
    bp.rotation.z = (i * Math.PI) / 2;
    blade.parent = bp;
    blade.position.set(0, 1.3, 0);
    bp.parent = bladeGroup;

    // Sail cloth
    const sail = BABYLON.MeshBuilder.CreatePlane('sail' + i, { width: 0.6, height: 2 }, scene);
    sail.material = M.plaster;
    sail.position.set(0.3, 1.3, 0);
    sail.parent = bp;
  }
  window.__millBlades = bladeGroup;

  return g;
}

/* ============================================================
   RIVER + BRIDGES + WATERFALL
   ============================================================ */
function buildRiver() {
  const g = new BABYLON.TransformNode('river', scene);

  // River as a winding plane (using ribbon)
  const pathA = [], pathB = [];
  const segs = 40;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const x = -20 + t * 40;
    const z = Math.sin(t * Math.PI * 1.5) * 6 + 4;
    pathA.push(new BABYLON.Vector3(x, 2.01, z - 1.2));
    pathB.push(new BABYLON.Vector3(x, 2.01, z + 1.2));
  }
  const river = BABYLON.MeshBuilder.CreateRibbon('riv', {
    pathArray: [pathA, pathB],
    sideOrientation: BABYLON.Mesh.DOUBLESIDE
  }, scene);
  river.material = M.water;
  river.parent = g;

  // Bridge 1
  function bridge(x, z, rot) {
    const bg = new BABYLON.TransformNode('br', scene);
    bg.position.set(x, 2.3, z);
    bg.rotation.y = rot;
    bg.parent = g;

    const deck = BABYLON.MeshBuilder.CreateBox('d', { width: 3.5, height: 0.2, depth: 1.2 }, scene);
    deck.material = M.wood;
    deck.parent = bg;

    // Rails
    for (const side of [-0.55, 0.55]) {
      for (let i = -1; i <= 1; i++) {
        const post = BABYLON.MeshBuilder.CreateBox('rp', { width: 0.08, height: 0.5, depth: 0.08 }, scene);
        post.material = M.woodDk;
        post.position.set(i * 1.3, 0.35, side);
        post.parent = bg;
      }
      const rail = BABYLON.MeshBuilder.CreateBox('rl', { width: 3.2, height: 0.06, depth: 0.06 }, scene);
      rail.material = M.woodDk;
      rail.position.set(0, 0.55, side);
      rail.parent = bg;
    }
    return bg;
  }
  bridge(-6, 3.5, 0.1);
  bridge(8, 6, -0.15);

  // Waterfall at island edge
  const fallX = 19, fallZ = 7;
  const fall = BABYLON.MeshBuilder.CreatePlane('fall', { width: 2, height: 14 }, scene);
  fall.material = M.water;
  fall.position.set(fallX, -5, fallZ);
  fall.rotation.y = -Math.PI / 2;
  fall.parent = g;
  window.__waterfall = fall;

  // Mist at fall base
  const mist = BABYLON.MeshBuilder.CreateSphere('mist', { diameter: 3, segments: 8 }, scene);
  const mistMat = new BABYLON.StandardMaterial('mistMat', scene);
  mistMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
  mistMat.alpha = 0.3;
  mistMat.emissiveColor = new BABYLON.Color3(0.8, 0.85, 0.9);
  mist.material = mistMat;
  mist.position.set(fallX, -11, fallZ);
  mist.parent = g;

  return g;
}

/* ============================================================
   PINE TREES
   ============================================================ */
function pine(x, z, scale = 1) {
  const g = new BABYLON.TransformNode('pine', scene);
  g.position.set(x, 2, z);
  g.scaling.setAll(scale);

  const trunk = BABYLON.MeshBuilder.CreateCylinder('tr', {
    diameterTop: 0.18, diameterBottom: 0.3, height: 1.2, tessellation: 6
  }, scene);
  trunk.material = M.woodDk;
  trunk.position.y = 0.6;
  trunk.parent = g;

  for (let i = 0; i < 3; i++) {
    const cone = BABYLON.MeshBuilder.CreateCylinder('c' + i, {
      diameterTop: 0, diameterBottom: 1.4 - i * 0.32, height: 1.3, tessellation: 8
    }, scene);
    cone.material = i % 2 === 0 ? M.pineDark : M.pineLight;
    cone.position.y = 1.2 + i * 0.7;
    cone.parent = g;
  }
  addShadowCaster(trunk);
  return g;
}

function buildForest() {
  const g = new BABYLON.TransformNode('forest', scene);
  const spots = [];
  // Clusters along edges avoiding castle/village
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = randRange(15, 24);
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    // Exclude area around river (z between 2 and 10)
    if (Math.abs(z - 4) < 3 && x > -12 && x < 12) continue;
    // Exclude house clusters
    if (Math.abs(x) > 6 && Math.abs(z) < 12 && Math.random() > 0.4) continue;
    spots.push({ x, z });
  }
  spots.forEach(s => {
    const p = pine(s.x, s.z, randRange(0.7, 1.3));
    p.parent = g;
  });

  // Bushes
  for (let i = 0; i < 25; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = randRange(5, 22);
    const bush = BABYLON.MeshBuilder.CreateSphere('bush', { diameter: randRange(0.6, 1.1), segments: 6 }, scene);
    bush.material = M.pineLight;
    bush.position.set(Math.cos(a) * r, 2.3, Math.sin(a) * r);
    bush.scaling.y = 0.7;
    bush.parent = g;
  }

  return g;
}

/* ============================================================
   RUINED WATCHTOWER (at edge)
   ============================================================ */
function buildRuin() {
  const g = new BABYLON.TransformNode('ruin', scene);
  g.position.set(-18, 2, -10);
  g.rotation.y = 0.4;

  // Broken tower base
  const base = BABYLON.MeshBuilder.CreateCylinder('rb', {
    diameter: 2.5, height: 3.5, tessellation: 10
  }, scene);
  base.material = M.stoneDk;
  base.position.y = 1.75;
  base.parent = g;
  addShadowCaster(base);

  // Broken jagged top ring
  const topR = BABYLON.MeshBuilder.CreateCylinder('rt', {
    diameter: 2.7, height: 0.7, tessellation: 10
  }, scene);
  topR.material = M.stoneDk;
  topR.position.y = 3.5;
  topR.scaling.y = 0.6;
  topR.parent = g;

  // Scatter rubble
  for (let i = 0; i < 8; i++) {
    const rock = BABYLON.MeshBuilder.CreateBox('rub', {
      width: randRange(0.3, 0.7),
      height: randRange(0.2, 0.5),
      depth: randRange(0.3, 0.7)
    }, scene);
    rock.material = i % 2 ? M.stone : M.stoneDk;
    const a = Math.random() * Math.PI * 2;
    const r = randRange(1.5, 3);
    rock.position.set(Math.cos(a) * r, 0.25, Math.sin(a) * r);
    rock.rotation.set(Math.random(), Math.random() * Math.PI, Math.random());
    rock.parent = g;
  }

  // Ivy hint (green patch)
  const ivy = BABYLON.MeshBuilder.CreatePlane('ivy', { width: 1, height: 1.5 }, scene);
  ivy.material = M.pineDark;
  ivy.position.set(0.9, 2, 0.9);
  ivy.rotation.y = Math.PI / 4;
  ivy.parent = g;

  return g;
}

/* ============================================================
   PATHS — simple stone paths connecting village to castle
   ============================================================ */
function buildPaths() {
  const g = new BABYLON.TransformNode('paths', scene);
  // Path segments as flat boxes
  const path = BABYLON.MeshBuilder.CreateGround('p1', { width: 3, height: 14, subdivisions: 1 }, scene);
  path.material = M.pathStone;
  path.position.set(0, 2.05, -8);
  path.parent = g;

  const path2 = BABYLON.MeshBuilder.CreateGround('p2', { width: 3, height: 10 }, scene);
  path2.material = M.pathStone;
  path2.position.set(6, 2.05, 5);
  path2.rotation.y = 0.5;
  path2.parent = g;

  const path3 = BABYLON.MeshBuilder.CreateGround('p3', { width: 3, height: 10 }, scene);
  path3.material = M.pathStone;
  path3.position.set(-6, 2.05, 5);
  path3.rotation.y = -0.5;
  path3.parent = g;

  return g;
}

/* ============================================================
   FLOATING ROCKS (orbiting small debris)
   ============================================================ */
function buildFloatingRocks() {
  const g = new BABYLON.TransformNode('orbRocks', scene);
  const rocks = [];
  for (let i = 0; i < 6; i++) {
    const r = BABYLON.MeshBuilder.CreatePolyhedron('or' + i, { type: i % 4, size: randRange(0.5, 1.2) }, scene);
    r.material = i % 2 ? M.rock : M.rockDk;
    const a = (i / 6) * Math.PI * 2;
    const dist = randRange(32, 40);
    r.position.set(Math.cos(a) * dist, randRange(-4, 6), Math.sin(a) * dist);
    r.rotation.set(Math.random(), Math.random(), Math.random());
    r.parent = g;
    rocks.push({ mesh: r, baseY: r.position.y, phase: Math.random() * Math.PI * 2, speed: randRange(0.2, 0.5) });
  }
  window.__orbRocks = rocks;
  return g;
}

/* ============================================================
   BUILD EVERYTHING
   ============================================================ */
buildIsland();
buildCastle();
buildVillage();
buildMill();
buildRiver();
buildForest();
buildRuin();
buildPaths();
buildFloatingRocks();

/* ============================================================
   PARTICLES — gentle clouds below
   ============================================================ */
const cloud = BABYLON.MeshBuilder.CreateSphere('cl', { diameter: 6, segments: 8 }, scene);
const cloudMat = new BABYLON.StandardMaterial('cm', scene);
cloudMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
cloudMat.alpha = 0.45;
cloudMat.emissiveColor = new BABYLON.Color3(0.9, 0.85, 0.95);
cloud.material = cloudMat;
cloud.position.set(0, -18, 5);
cloud.scaling.set(2, 0.5, 1.6);

for (let i = 0; i < 5; i++) {
  const c = cloud.clone('cc' + i);
  c.position.set(randRange(-20, 20), randRange(-22, -12), randRange(-20, 20));
  c.scaling.set(randRange(1.5, 3), randRange(0.3, 0.6), randRange(1.2, 2));
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
let t = 0;
scene.onBeforeRenderObservable.add(() => {
  t += engine.getDeltaTime() / 1000;

  // Windmill blades
  if (window.__millBlades) window.__millBlades.rotation.z = t * 0.6;

  // Water scroll (fake): shift river slightly
  // Waterfall animation
  if (window.__waterfall) {
    const wf = window.__waterfall;
    wf.position.y = -5 + Math.sin(t * 4) * 0.15;
  }

  // Orbiting rocks
  if (window.__orbRocks) {
    window.__orbRocks.forEach((r, i) => {
      r.mesh.position.y = r.baseY + Math.sin(t * r.speed + r.phase) * 0.8;
      r.mesh.rotation.y += 0.004;
      r.mesh.rotation.x += 0.002;
    });
  }

  // Gentle camera auto-rotation before user touch
  if (!scene.__userInteracted) {
    camera.alpha += 0.0015;
  }
});

// Mark interaction
canvas.addEventListener('pointerdown', () => scene.__userInteracted = true);
canvas.addEventListener('wheel', () => scene.__userInteracted = true);

/* ============================================================
   POST-PROCESSING — soft glow & vignette
   ============================================================ */
const pipeline = new BABYLON.DefaultRenderingPipeline('pipe', true, scene, [camera]);
pipeline.bloomEnabled = true;
pipeline.bloomThreshold = 0.7;
pipeline.bloomWeight = 0.5;
pipeline.bloomKernel = 48;
pipeline.imageProcessing.vignetteEnabled = true;
pipeline.imageProcessing.vignetteWeight = 1.8;
pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0.1, 0.05, 0.2, 0);
pipeline.imageProcessing.contrast = 1.15;
pipeline.imageProcessing.exposure = 1.0;
pipeline.fxaaEnabled = true;

/* ============================================================
   RUN
   ============================================================ */
engine.runRenderLoop(() => scene.render());
window.addEventListener('resize', () => engine.resize());

// Hide loading
scene.executeWhenReady(() => {
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 300);
});
</script>

</body>
</html>
