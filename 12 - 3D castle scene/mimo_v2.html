<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1e}
#c{width:100%;height:100%;display:block;outline:none}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#title{position:absolute;top:28px;left:50%;transform:translateX(-50%);
  font-family:Georgia,serif;font-size:clamp(18px,3.2vw,36px);color:#f0d888;
  text-shadow:0 0 25px rgba(240,216,136,.35),0 2px 10px rgba(0,0,0,.85);
  opacity:0;animation:fi 2.5s ease forwards .6s;letter-spacing:3px;white-space:nowrap}
#sub{position:absolute;top:68px;left:50%;transform:translateX(-50%);
  font-family:Georgia,serif;font-size:clamp(9px,1.4vw,14px);color:#a0b8d0;
  text-shadow:0 1px 4px rgba(0,0,0,.7);opacity:0;animation:fi 2s ease forwards 1.1s}
@keyframes fi{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:Georgia,serif;font-size:20px;color:#c8a848;opacity:0;animation:fi 1s ease forwards .1s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">🏰 Floating Island Diorama</div>
  <div id="sub">Orbit · Zoom · Drag to explore</div>
  <div id="loading">✨ Building the world...</div>
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  FLOATING ISLAND DIORAMA — Single File Babylon.js Scene
// ═══════════════════════════════════════════════════════════

// ═══ PERLIN NOISE ═══
const _pm=new Uint8Array(512);
(function(){const p=[];for(let i=0;i<256;i++)p[i]=i;
for(let i=255;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
for(let i=0;i<512;i++)_pm[i]=p[i&255]})();
function _f(t){return t*t*t*(t*(t*6-15)+10)}
function _g(h,x,y){const v=h&3;return((v&1)?-x:x)+((v&2)?-y:y)}
function pN(x,y){const X=Math.floor(x)&255,Y=Math.floor(y)&255;
x-=Math.floor(x);y-=Math.floor(y);const u=_f(x),v=_f(y);
const a=_pm[X]+Y,b=_pm[X+1]+Y;
return(1-v)*((1-u)*_g(_pm[a],x,y)+u*_g(_pm[b],x-1,y))+v*((1-u)*_g(_pm[a+1],x,y-1)+u*_g(_pm[b+1],x-1,y-1))}
function fBm(x,y,o){let v=0,a=.5,f=1;for(let i=0;i<(o||5);i++){v+=a*pN(x*f,y*f);a*=.5;f*=2}return v}

// ═══ TERRAIN FUNCTIONS ═══
function ss(e0,e1,x){const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t)}
const TAU=Math.PI*2;
function tsin(a,f){return Math.sin(a*f)*.5+.5}
function tcos(a,f){return Math.cos(a*f)*.5+.5}
function tpow(b,e){return Math.pow(Math.max(0,b),e)}

function islandTopH(r,a){
  const rm=r/18;
  let h=3.5*(1-tpow(rm,.45));
  h-=rm*rm*rm*5;
  h+=fBm(a*2+5.3,r*.15+7.7,4)*2.5*(1-rm);
  h+=tsin(a,2)*2*(1-tpow(rm,.3));
  h+=tsin(a*3+1.5,1)*1.2*(1-rm);
  const mx=tpow(tcos(a+2.2,3),4)*5*(1-rm*.5),mw=tpow(Math.max(0,1-Math.abs(r-10)/5),2);
  h+=mx*mw;
  h+=tpow(Math.max(0,1-Math.abs(r-5)/4),2)*2.5;
  h+=fBm(a*.5+10,r*.3+10,3)*1.5;
  if(r>14)h-=(r-14)*2.5;
  return Math.max(-.5,h);
}
function islandBtmH(r,a){
  const rm=r/18;let h=-3-Math.pow(rm,2)*10;
  h+=fBm(a*3+100,r*.2+100,5)*3*(.3+.7*rm);
  h+=tpow(tsin(a,5),5)*4*rm;
  h+=fBm(a*5+200,r*.4+200,3)*1.5*rm;
  h-=(1-rm)*6;return h;
}
function rivY(r,a){return ss(3.5,8.5,r)*(1-ss(10,13,r))*(1-tpow(tcos(a+2.2,3),4)*(1-ss(5,8,r)))*1.5}
function wtrX(a){return 9.5+fBm(a*4+300,0,3)*2.2}
function wtrZ(a){return 9.5+fBm(a*4+400,0,3)*2.2}
function sH(r,a){return islandTopH(r,a)-rivY(r,a)}

// ═══ SHADERS ═══
function regShader(vs,fs){
  const n='s'+(Math.random()*1e6|0);
  BABYLON.Effect.ShadersStore[n+'VertexShader']=vs;
  BABYLON.Effect.ShadersStore[n+'FragmentShader']=fs;
  return n;
}

const SSN=regShader(
`precision highp float;
attribute vec3 position;attribute vec3 normal;attribute vec2 uv;
uniform mat4 worldViewProjection;uniform mat4 world;uniform float uTime;
varying vec3 vN,vW;varying vec2 vUV;varying float vH;
void main(){
  vUV=uv;vW=(world*vec4(position,1.)).xyz;
  vN=normalize((world*vec4(normal,0.)).xyz);vH=position.y;
  gl_Position=worldViewProjection*vec4(position,1.);}`,
`precision highp float;
varying vec3 vN,vW;varying vec2 vUV;varying float vH;
uniform float uTime;uniform vec3 uSun;
vec3 h3(vec2 p){return fract(sin(vec3(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)),dot(p,vec2(419.2,371.9))))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h3(i).x,h3(i+vec2(1,0)).x,f.x),mix(h3(i+vec2(0,1)).x,h3(i+vec2(1,1)).x,f.x),f.y);}
float fb(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*vn(p);p*=2.03;a*=.49;}return v;}
void main(){
  vec3 n=normalize(vN),l=normalize(uSun);
  float d=max(dot(n,l),0.),s=pow(max(dot(reflect(-l,n),normalize(vec3(0,25,35)-vW)),0.),10.);
  vec3 gc=vec3(.3,.68,.12),gd=vec3(.25,.58,.1),dc=vec3(.48,.42,.2);
  float gx=fb(vW.xz*.45),gy=smoothstep(-.5,.8,vH);
  vec3 c=mix(dc,gc,gy);c=mix(c,gd,fb(vW.xz*1.5+uTime*.002)*.25);
  c=c*(.22+.72*d)+vec3(1,.95,.85)*s*.1;
  float e=smoothstep(.5,1.,1.-gy);c=mix(c,vec3(.5,.45,.32),e*.5);
  gl_FragColor=vec4(c,1.);}`);

const RSN=regShader(
`precision highp float;
attribute vec3 position;attribute vec3 normal;attribute vec2 uv;
uniform mat4 worldViewProjection;uniform mat4 world;uniform float uTime;
varying vec3 vN,vW;varying vec2 vUV;
void main(){vUV=uv;vW=(world*vec4(position,1.)).xyz;
  vN=normalize((world*vec4(normal,0.)).xyz);gl_Position=worldViewProjection*vec4(position,1.);}`,
`precision highp float;
varying vec3 vN,vW;varying vec2 vUV;uniform float uTime;
float fb(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);p*=2.03;a*=.49;}return v;}
void main(){
  vec3 n=normalize(vN),l=normalize(vec3(1,2,.5));
  float d=max(dot(n,l),0.);
  vec3 sc=vec3(.38,.34,.28),dc=vec3(.18,.15,.12),lc=vec3(.55,.48,.38);
  float rx=fb(vW.xz*1.2),ry=smoothstep(-20.,-2.,vW.y);
  vec3 c=mix(dc,sc,ry);c=mix(c,lc,fb(vW.xy*1.8+uTime*.008)*ry*.25);
  float fb2=fb(vW.xz*.6+uTime*.025)*fb(vW.xz*2.5+uTime*.05);
  c+=vec3(.55,.2,.04)*fb2*.25*ry;
  float sd=1.-smoothstep(-1.,0.,vW.y);c=mix(c,vec3(.1,.08,.06),sd*.3);
  c=c*(.28+.68*d);
  gl_FragColor=vec4(c,1.);}`);

const FSN=regShader(
`precision highp float;
attribute vec3 position;attribute vec3 normal;attribute vec2 uv;
uniform mat4 worldViewProjection;uniform float uTime;
varying vec3 vN;varying vec3 vW2;varying vec2 vUV;
void main(){vUV=uv;vN=normal;vW2=position;
  gl_Position=worldViewProjection*vec4(position,1.);}`,
`precision highp float;
varying vec3 vN,vW2;varying vec2 vUV;uniform float uTime;
float fb(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);p*=2.03;a*=.49;}return v;}
void main(){
  float mx=.5-abs(vUV.x-.5),ps=vUV.y,f=fb(vec2(vUV.x*12.,ps*4.-uTime*3.5));
  float al=smoothstep(0.,.06,mx)*smoothstep(0.,.04,ps)*smoothstep(1.,.93,ps)*.82;
  vec3 wc=vec3(.45,.88,.96),mc=vec3(.9,.96,1.);
  vec3 c=mix(wc,mc,f*.38);
  float mist=smoothstep(0.,.25,ps)*smoothstep(.45,.2,ps)*smoothstep(0.,.06,mx);
  c=mix(c,vec3(.95,.98,1.),mist*f*.45);
  gl_FragColor=vec4(c,al);}`);

const WSN=regShader(
`precision highp float;
attribute vec3 position;attribute vec2 uv;
uniform mat4 worldViewProjection;uniform float uTime;
varying vec2 vUV;varying float vW;
void main(){vUV=uv;
  float w=sin(position.x*.6+uTime*.8)*cos(position.z*.6+uTime*.6)*.18;
  vec3 p=position;p.y+=w;vW=w;
  gl_Position=worldViewProjection*vec4(p,1.);}`,
`precision highp float;
varying vec2 vUV;varying float vW;uniform float uTime;
void main(){
  vec3 d=vec3(0,.22,.52),m=vec3(.08,.62,.82),f=vec3(.3,.82,.94);
  float t=clamp(vW*2.5+.5,0.,1.);
  vec3 c=t<.5?mix(d,m,t*2.):mix(m,f,(t-.5)*2.);
  float sp=pow(max(0.,sin(vUV.x*28.+uTime*1.8)*sin(vUV.y*28.+uTime*1.2)),14.)*.1;
  c+=sp;gl_FragColor=vec4(c,.88);}`);

const GRN=regShader(
`precision highp float;
attribute vec3 position;attribute vec2 uv;
uniform mat4 worldViewProjection;uniform float uTime;
varying vec2 vUV;
void main(){vUV=uv;gl_Position=worldViewProjection*vec4(position,1.);}`,
`precision highp float;
varying vec2 vUV;uniform float uTime;
float fb(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);p*=2.03;a*=.49;}return v;}
void main(){
  vec2 p=vUV*8.;float d=length(p-4.);
  vec3 c1=vec3(.08,.06,.15),c2=vec3(.12,.09,.22),c3=vec3(.04,.03,.08);
  vec3 c=mix(c1,c2,sin(p.x*.8+uTime*.15)*.5+.5);
  c=mix(c,c3,fb(p*.3+uTime*.05)*.4);
  float gs=pow(max(0.,sin(p.x*12.)*sin(p.y*12.)),40.)*.08;
  c+=gs;gl_FragColor=vec4(c,1.);}`);

// ═══ SCENE ═══
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true,{antialias:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.22,.2,.42,1);
scene.ambientColor=new BABYLON.Color3(.25,.25,.32);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=.0018;
scene.fogColor=new BABYLON.Color3(.48,.52,.68);

const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-1,-2.5,-1.5).normalize(),scene);
sun.intensity=1.35;sun.diffuse=new BABYLON.Color3(1,.93,.82);
sun.specular=new BABYLON.Color3(1,.95,.85);
const sun2=new BABYLON.DirectionalLight('sun2',new BABYLON.Vector3(1,-1,1).normalize(),scene);
sun2.intensity=.28;sun2.diffuse=new BABYLON.Color3(.7,.75,.9);
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=.55;hemi.groundColor=new BABYLON.Color3(.25,.22,.18);

// Glow
const gl=new BABYLON.GlowLayer('glow',scene,{mainTextureSamples:4,blurKernelSize:32});
gl.intensity=.35;

const cam=new BABYLON.ArcRotateCamera('cam',-.45,1.05,95,new BABYLON.Vector3(0,3,0),scene);
cam.attachControl(canvas,true);
cam.lowerRadiusLimit=25;cam.upperRadiusLimit=180;
cam.lowerBetaLimit=.15;cam.upperBetaLimit=Math.PI/2.15;
cam.wheelDeltaPercentage=.008;cam.panningSensibility=200;

const uTime={v:0};

// ═══ HELPERS ═══
function cm(n,r,g,b,em){
  const m=new BABYLON.StandardMaterial(n,scene);
  m.diffuseColor=new BABYLON.Color3(r,g,b);
  if(em)m.emissiveColor=new BABYLON.Color3(r*.25,g*.25,b*.25);
  m.specularColor=new BABYLON.Color3(.08,.08,.08);return m;
}
function mb(n,w,h,d,p,r,c,p2){
  const bx=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);
  if(p)bx.position=p.clone();if(r)bx.rotation=r.clone();
  if(p2)bx.parent=p2;if(c)bx.material=c;
  return bx;
}
function mc(n,dt,db,h,p,r,c,p2,ts){
  const cy=BABYLON.MeshBuilder.CreateCylinder(n,{diameterTop:dt,diameterBottom:db,height:h,tessellation:ts||12},scene);
  if(p)cy.position=p.clone();if(r)cy.rotation=r.clone();
  if(p2)cy.parent=p2;if(c)cy.material=c;return cy;
}
function ms(n,d,p,c,p2){
  const sp=BABYLON.MeshBuilder.CreateSphere(n,{diameter:d,segments:8},scene);
  if(p)sp.position=p.clone();if(p2)sp.parent=p2;if(c)sp.material=c;return sp;
}
function sm(n,vs,fn){
  const m=new BABYLON.ShaderMaterial(n,scene,
    {vertexSource:BABYLON.Effect.ShadersStore[vs+'VertexShader'],
     fragmentSource:BABYLON.Effect.ShadersStore[fn+'FragmentShader']},
    {attributes:['position','normal','uv'],uniforms:['worldViewProjection','world','uTime']});
  m.backFaceCulling=false;return m;
}
function smb(n,vs,fn){
  const m=new BABYLON.ShaderMaterial(n,scene,
    {vertexSource:BABYLON.Effect.ShadersStore[vs+'VertexShader'],
     fragmentSource:BABYLON.Effect.ShadersStore[fn+'FragmentShader']},
    {attributes:['position','uv'],uniforms:['worldViewProjection','uTime']});
  m.backFaceCulling=false;return m;
}
function _l(r,a){const p=sH(r,a),x=Math.cos(a)*r,z=Math.sin(a)*r;return{x,z,y:p}}

// ═══ ISLAND ═══
function buildIsland(){
  const par=new BABYLON.TransformNode('island',scene);

  // Top surface
  const ts=BABYLON.MeshBuilder.CreateDisc('iTop',{radius:18,tessellation:72},scene);
  ts.rotation.x=Math.PI/2;
  const tpos=ts.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for(let i=0;i<tpos.length;i+=3){
    const x=tpos[i],z=tpos[i+2],r=Math.sqrt(x*x+z*z);
    tpos[i+1]=islandTopH(r,Math.atan2(z,x));
  }
  ts.updateVerticesData(BABYLON.VertexBuffer.PositionKind,tpos);
  ts.createNormals(true);
  ts.material=sm('sTop',SSN,SSN);
  ts.material.setVector3('uSun',sun.direction.scale(-1));
  ts.parent=par;

  // Bottom surface
  const bs=BABYLON.MeshBuilder.CreateDisc('iBtm',{radius:18,tessellation:72},scene);
  bs.rotation.x=-Math.PI/2;
  const bpos=bs.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for(let i=0;i<bpos.length;i+=3){
    const x=bpos[i],z=bpos[i+2],r=Math.sqrt(x*x+z*z);
    bpos[i+1]=islandBtmH(r,Math.atan2(z,x));
  }
  bs.updateVerticesData(BABYLON.VertexBuffer.PositionKind,bpos);
  bs.createNormals(true);
  bs.material=sm('sBtm',RSN,RSN);
  bs.parent=par;

  // Side ring
  const sg=72,sv=8,vts=[],ids=[];
  for(let i=0;i<=sg;i++){const a=(i/sg)*TAU;
    for(let j=0;j<=sv;j++){const t=j/sv;
      vts.push(Math.cos(a)*18,islandTopH(18,a)*(1-t)+islandBtmH(18,a)*t,Math.sin(a)*18);
  }}
  for(let i=0;i<sg;i++)for(let j=0;j<sv;j++){
    const a=i*(sv+1)+j,b=a+1,c=a+sv+1,d=c+1;
    ids.push(a,c,b,b,c,d);
  }
  const side=new BABYLON.Mesh('iSide',scene);
  side.setVerticesData(BABYLON.VertexBuffer.PositionKind,vts);
  side.setVerticesData(BABYLON.VertexBuffer.NormalKind,new Float32Array(vts.length),true);
  side.setVerticesData(BABYLON.VertexBuffer.UVKind,new Float32Array(vts.length/3*2),true);
  side.setIndices(ids);side.createNormals(true);
  side.material=sm('sSide',RSN,RSN);
  side.parent=par;

  // ═══ CASTLE ═══
  buildCastle(par);
  // ═══ VILLAGE ═══
  buildVillage(par);
  // ═══ TREES ═══
  buildForest(par);
  // ═══ ROCKS ═══
  buildRocks(par);
  // ═══ RIVER ═══
  buildRiver(par);
  // ═══ WATERFALL ═══
  buildWaterfall(par);
  // ═══ BRIDGES ═══
  buildBridges(par);
}

// ═══ CASTLE ═══
function buildCastle(par){
  const st=cm('st',.6,.58,.52),stD=cm('stD',.42,.4,.36),rf=cm('rf',.35,.22,.15),
    stE=cm('stE',.6,.58,.52,1),fl=cm('fl',.85,.1,.1,1),go=cm('go',.85,.68,.15);
  const cX=0,cZ=0,cY=sH(0,0)+.5;

  // Foundation
  mb('cBase',16,2.2,16,new BABYLON.Vector3(cX,cY+1.1,cZ),null,st,par);
  mb('cBase2',13,1.5,13,new BABYLON.Vector3(cX,cY+2.95,cZ),null,stD,par);

  // Towers
  const tp=[{x:7,z:7,h:19},{x:-7,z:7,h:16},{x:7,z:-7,h:17},{x:-7,z:-7,h:15}];
  for(const t of tp){
    const ty=cY+3.65;
    mc('ct'+t.x,t.d=t.d||3.2,3.4,t.h,new BABYLON.Vector3(cX+t.x,ty+t.h/2,cZ+t.z),null,st,par);
    mc('cr'+t.x,4.2,3.8,1.8,new BABYLON.Vector3(cX+t.x,ty+t.h+.9,cZ+t.z),null,rf,par);
    mc('cti'+t.x,1.2,.8,2.5,new BABYLON.Vector3(cX+t.x,ty+t.h+2.8,cZ+t.z),null,stE,par);
    // Flag
    mb('ff'+t.x,1.8,.9,.05,new BABYLON.Vector3(cX+t.x+.6,ty+t.h+4.4,cZ+t.z),
      new BABYLON.Vector3(0,0,.12),fl,par);
    mb('fp'+t.x,.12,1.8,.12,new BABYLON.Vector3(cX+t.x,ty+t.h+3.8,cZ+t.z),null,go,par);
  }

  // Walls
  const wH=8;
  for(const[wz,wx,wd] of [[0,7.5,15.2],[0,-7.5,15.2],[7.5,0,15.2],[-7.5,0,15.2]]){
    const isZ=Math.abs(wz)>Math.abs(wx);
    mb('cw'+wz+wx,isZ?wd:1.4,wH,isZ?1.4:wd,
      new BABYLON.Vector3(cX+wx,cY+3.65+wH/2,cZ+wz),isZ?new BABYLON.Vector3(0,Math.PI/2,0):null,st,par);
    // Battlements
    for(let b=0;b<6;b++){
      const bt=((b-2.5)/6)*(isZ?wd:wd)*.75;
      mb('cb'+wz+wx+b,.5,1.2,.5,
        new BABYLON.Vector3(cX+(isZ?0:wx)+bt*(isZ?0:1),cY+3.65+wH+.6,cZ+(isZ?wz:0)+bt*(isZ?1:0)),
        null,stD,par);
    }
  }

  // Keep (central tower)
  mc('ck',7,7.5,12,new BABYLON.Vector3(cX,cY+10,cZ),null,st,par);
  mc('ckr',9,8,2,new BABYLON.Vector3(cX,cY+17,cZ),null,rf,par);
  mc('ckt',2,1.5,4,new BABYLON.Vector3(cX,cY+20,cZ),null,stE,par);
  mb('ckf',2.5,1.2,.06,new BABYLON.Vector3(cX+.8,cY+22.6,cZ),new BABYLON.Vector3(0,0,.1),fl,par);
  mb('ckfp',.15,2.2,.15,new BABYLON.Vector3(cX,cY+21.3,cZ),null,go,par);
  // Windows
  for(let i=0;i<4;i++){
    const wa=i*Math.PI/2;
    mb('cw'+i,.5,1.2,.15,new BABYLON.Vector3(cX+Math.cos(wa)*3.8,cY+13,cZ+Math.sin(wa)*3.8),
      new BABYLON.Vector3(0,wa,0),cm('cw'+i,0,0,0),par);
  }

  // Gate
  mb('gate',3.5,5,.3,new BABYLON.Vector3(cX,cY+6.1,cZ+7.6),null,cm('gat',.3,.25,.18),par);
}

// ═══ VILLAGE ═══
function buildVillage(par){
  // Helper: wood house
  const wW=cm('wW',.58,.38,.18),wD=cm('wD',.38,.24,.1),rfB=cm('rfB',.55,.22,.14),
    rfG=cm('rfG',.32,.48,.2),da=cm('da',.2,.12,.05);

  function mkHouse(x,z,a,sc){
    sc=sc||1;
    const hy=sH(Math.sqrt(x*x+z*z),Math.atan2(z,x));
    const hu=new BABYLON.TransformNode('h_'+x+'_'+z,scene);hu.parent=par;
    hu.position=new BABYLON.Vector3(x,hy,z);hu.rotation.y=a;
    const W=3.8*sc,H=3*sc,D=4.2*sc,RH=2.2*sc;
    mb('hw',W,H,D,null,new BABYLON.Vector3(0,H/2,0),wW,hu);
    // Roof
    const rV=[],rI=[],rh=RH,rw=W/2+.4*sc,rd=D/2+.3*sc;
    rV.push(-rw,0,-rd, rw,0,-rd, rw,0,rd, -rw,0,rd, 0,rh,-rd, 0,rh,rd);
    rI.push(0,1,4,1,2,5,1,5,4,2,3,5,3,0,4,3,4,5);
    const rfM=new BABYLON.Mesh('rm_'+x+'_'+z,scene);
    rfM.setVerticesData(BABYLON.VertexBuffer.PositionKind,rV);
    rfM.setIndices(rI);rfM.createNormals(true);rfM.material=sc>.9?rfB:rfG;
    rfM.parent=hu;
    mb('dh',W*.25*sc,H*.6*sc,.05,null,new BABYLON.Vector3(0,H*.3,D/2+.03),null,da,hu);
    // Chimney
    mc('ch',.4*sc,.45*sc,H*.7,null,new BABYLON.Vector3(rw*.5*sc,rh+H*.25,0),null,wD,hu,6);
    // Window
    mb('wn',.5*sc,.5*sc,.06,null,new BABYLON.Vector3(-rw*.5,H*.6,D/2+.04),null,da,hu);
  }

  // Houses cluster (NW quadrant)
  mkHouse(-8,2,.3);mkHouse(-6.5,5,.7);mkHouse(-4.5,3.5,-.2);
  mkHouse(-9,5.5,.5);mkHouse(-7.5,8,.1);mkHouse(-5,7.5,-.4);
  mkHouse(-3,6,.8);mkHouse(-6,10,.2);

  // Tavern (SE quadrant)
  const tx=7,tz=4,ta=.6;
  const thy=sH(Math.sqrt(tx*tx+tz*tz),Math.atan2(tz,tx));
  const tav=new BABYLON.TransformNode('tav',scene);tav.parent=par;
  tav.position=new BABYLON.Vector3(tx,thy,tz);tav.rotation.y=ta;
  const tw=5.5,th=3.8,td=7,tRH=2.8;
  mb('tw',tw,th,td,null,new BABYLON.Vector3(0,th/2,0),wW,tav);
  // Big roof
  const rV=[],rI=[],rh=tRH,rw=tw/2+.6,rd=td/2+.4;
  rV.push(-rw,0,-rd,rw,0,-rd,rw,0,rd,-rw,0,rd,0,rh,-rd,0,rh,rd);
  rI.push(0,1,4,1,2,5,1,5,4,2,3,5,3,0,4,3,4,5);
  const trM=new BABYLON.Mesh('tr',scene);
  trM.setVerticesData(BABYLON.VertexBuffer.PositionKind,rV);trM.setIndices(rI);
  trM.createNormals(true);trM.material=rfB;trM.parent=tav;
  // Sign
  mb('ts',1.8,1.2,.1,null,new BABYLON.Vector3(0,th*.7,td/2+.2),null,da,tav);
  mb('tb',tw*.3,th*.75,.06,null,new BABYLON.Vector3(0,th*.38,td/2+.04),null,da,tav);
  // Smokestack
  mc('tsm',.5,.55,2.5,null,new BABYLON.Vector3(1.5,rh+th+.8,-2),null,wD,tav,6);

  // Market stalls (N area)
  const mst=cm('mst',.65,.5,.3),awl=cm('awl',.8,.2,.15);
  for(let i=0;i<4;i++){
    const mx=-1.5+i*2.2,mz=-7,mr=(i-1.5)*.3;
    const msy=sH(Math.sqrt(mx*mx+mz*mz),Math.atan2(mz,mx));
    const st=new BABYLON.TransformNode('ms'+i,scene);st.parent=par;
    st.position=new BABYLON.Vector3(mx,msy,mz);st.rotation.y=mr;
    mb('mt',1.8,.8,1.2,null,new BABYLON.Vector3(0,.4,0),mst,st);
    mc('mp',.12,.12,2,null,new BABYLON.Vector3(-.7,1,0),null,mst,st,6);
    mc('mp2',.12,.12,2,null,new BABYLON.Vector3(.7,1,0),null,mst,st,6);
    mb('ma',2,.08,1.4,null,new BABYLON.Vector3(0,2,0),null,awl,st);
    // Goods
    const gc=[cm('g'+i,.8,.3,.15),cm('g2'+i,.15,.6,.3),cm('g3'+i,.6,.5,.2)];
    for(let j=0;j<3;j++){
      ms('gd'+i+j,.25+Math.random()*.2,new BABYLON.Vector3(-.4+j*.4,.95+Math.random()*.15,.1*Math.random()),gc[j],st);
    }
  }

  // Windmill (SW)
  const wmx=-10,wmz=-5,wmy=sH(Math.sqrt(wmx*wmx+wmz*wmz),Math.atan2(wmz,wmx));
  const wm=new BABYLON.TransformNode('wm',scene);wm.parent=par;
  wm.position=new BABYLON.Vector3(wmx,wmy,wmz);wm.rotation.y=.8;
  mc('wmb',2.8,3.4,9,null,new BABYLON.Vector3(0,4.5,0),null,wW,wm,8);
  mc('wmr',4.2,3.6,1.5,null,new BABYLON.Vector3(0,9.75,0),null,rfB,wm,8);
  mc('wmst',.6,.6,.4,null,new BABYLON.Vector3(0,10.7,0),null,da,wm,6);
  // Sail frame
  for(let i=0;i<4;i++){
    const ang=i*Math.PI/2;
    mb('ws'+i,5.5,.18,.06,null,new BABYLON.Vector3(0,10.5,0),
      new BABYLON.Vector3(0,0,ang),da,wm);
    // Sail cloth
    mb('wcl'+i,2,.02,1.2,null,new BABYLON.Vector3(Math.cos(ang)*2,10.5+Math.sin(ang)*2,0),
      new BABYLON.Vector3(0,0,ang),cm('wcl'+i,.88,.82,.68),wm);
  }

  // Mill by river (E)
  const mmx=9,mmz=0,mmy=sH(9,0);
  const mill=new BABYLON.TransformNode('mill',scene);mill.parent=par;
  mill.position=new BABYLON.Vector3(mmx,mmy,mmz);mill.rotation.y=Math.PI*.75;
  mb('mmw',4,4,4.5,null,new BABYLON.Vector3(0,2,0),wW,mill);
  mc('mmr',5.2,4.4,2,null,new BABYLON.Vector3(0,5,0),null,rfG,mill,6);
  // Waterwheel
  mc('mwp',.3,.3,.5,null,new BABYLON.Vector3(0,1.5,2.8),new BABYLON.Vector3(Math.PI/2,0,0),da,mill,8);
  for(let i=0;i<8;i++){
    const wa=i*Math.PI/4;
    mb('mwv'+i,2.5,.15,.15,null,new BABYLON.Vector3(0,1.5,2.8),
      new BABYLON.Vector3(0,0,wa),da,mill);
  }
}

// ═══ FOREST ═══
function buildForest(par){
  const trk=cm('trk',.42,.28,.14),pv=cm('pv',.12,.48,.1),pd=cm('pd',.08,.32,.06);
  const spots=[
    [-4,-10],[-7,-9],[-11,-3],[-12,1],[-13,4],[-10,7],[-8,9],
    [-3,10],[1,11],[5,10],[9,-2],[10,-6],[8,-9],[5,-11],
    [1,-13],[-3,-12],[-10,-7],[-6,-11],[-13,-1],[11,3],[12,-4],
    [-9,-10],[-5,-13],[3,-12],[-11,8],[-8,11],[-2,13],[7,9],
    [10,7],[11,-7],[6,-13],[-14,0],[-11,-5],[4,12],[-7,12]
  ];
  for(const[sx,sz] of spots){
    const r=Math.sqrt(sx*sx+sz*sz);
    if(r>17.5||r<9.5)continue;
    const sa=Math.atan2(sz,sx);
    if(sH(r,sa)<.8)continue;
    const sy=sH(r,sa);
    const sc=.55+Math.random()*.7;
    const hu=new BABYLON.TransformNode('p_'+sx+'_'+sz,scene);hu.parent=par;
    hu.position=new BABYLON.Vector3(sx,sy,sz);
    mc('pt',.25*sc,.4*sc,3.5*sc,null,new BABYLON.Vector3(0,1.75*sc,0),null,trk,hu,5);
    for(let i=0;i<3;i++){
      const fs=3.2*sc-i*.65*sc,fy=3*sc+i*1.4*sc;
      mc('pf'+i,fs,fs*.15,2.2*sc,null,
        new BABYLON.Vector3((Math.random()-.5)*.3,fy,(Math.random()-.5)*.3),
        null,i%2?pv:pd,hu,7);
    }
  }
}

// ═══ ROCKS ═══
function buildRocks(par){
  const rc=cm('rc',.42,.38,.32);
  const spots=[
    [14,0],[13,5],[10,12],[-5,14],[-12,8],[-15,0],[-13,-4],[-10,-10],
    [-4,-14],[3,-14],[9,-11],[14,-3],[7,14],[-8,13],[-14,-8],[12,-8],
    [15,3],[-3,-15],[6,14],[-10,12],[13,8],[-14,5],[11,-12],[-7,-13],
    [0,-16],[16,0],[-16,0],[0,16],[-11,-12],[12,10]
  ];
  for(const[rx,rz] of spots){
    const rr=Math.sqrt(rx*rx+rz*rz);
    if(rr>17.2||rr<12.5)continue;
    const ra=Math.atan2(rz,rx);
    const ry=sH(rr,ra);
    const sc=.35+Math.random()*1.3;
    const hu=new BABYLON.TransformNode('r_'+rx+'_'+rz,scene);hu.parent=par;
    hu.position=new BABYLON.Vector3(rx,ry,rz);
    const nr=2+Math.floor(Math.random()*3);
    for(let i=0;i<nr;i++){
      ms('rs'+i,sc*(.4+Math.random()*.6),
        new BABYLON.Vector3((Math.random()-.5)*sc,sc*.25*Math.random(),(Math.random()-.5)*sc),
        rc,hu);
    }
  }
}

// ═══ RIVER ═══
function buildRiver(par){
  const pts=[],wds=[];
  for(let i=0;i<=28;i++){
    const a=2.5+(i/28)*Math.PI;
    pts.push(_l(wtrX(a),a));
    wds.push(1.4+Math.sin(i*.45)*.35);
  }
  for(let s=-1;s<=1;s+=2){
    const rv=[],ri=[];
    for(let i=0;i<=28;i++){
      const p=pts[i],wd=wds[i],perp={x:-Math.sin(Math.atan2(p.z,p.x))*wd*s,z:Math.cos(Math.atan2(p.z,p.x))*wd*s};
      rv.push(p.x+perp.x,p.y+.13,p.z+perp.z);
    }
    for(let i=0;i<28;i++)ri.push(i,i+1);
    const rm=new BABYLON.Mesh('rv'+s,scene);
    rm.setVerticesData(BABYLON.VertexBuffer.PositionKind,rv);rm.setIndices(ri);
    rm.createNormals(true);rm.material=smb('ws'+s,WSN,WSN);rm.parent=par;
  }
}

// ═══ WATERFALL ═══
function buildWaterfall(par){
  const wfY=-5,wfH=18,wfW=2;
  const wfV=[],wfI=[];
  for(let i=0;i<=10;i++){
    const y=(i/10)*wfH;
    wfV.push(-wfW/2,wfY-y,-.2, wfW/2,wfY-y,-.2);
  }
  for(let i=0;i<10;i++){
    const a=i*2,b=a+1,c=a+2,d=a+3;
    wfI.push(a,b,c,c,b,d);
  }
  const wf=new BABYLON.Mesh('wf',scene);
  wf.setVerticesData(BABYLON.VertexBuffer.PositionKind,wfV);wf.setIndices(wfI);
  wf.createNormals(true);
  wf.material=smb('wfS',FSN,FSN);
  wf.position.x=9.5;wf.position.z=9.5;
  wf.parent=par;

  // Mist particles
  const ps=new BABYLON.ParticleSystem('mist',60,scene);
  ps.createPointEmitter(new BABYLON.Vector3(-.4,-.2,-.3),new BABYLON.Vector3(.4,.1,.3));
  const pt=new BABYLON.DynamicTexture('ptx',64,scene,false);
  const ctx=pt.getContext();
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(220,240,255,.65)');g.addColorStop(1,'rgba(220,240,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64);pt.update();
  ps.particleTexture=pt;ps.emitter=new BABYLON.Vector3(9.5,-12,9.5);
  ps.minSize=.8;ps.maxSize=2;ps.minLifeTime=1.2;ps.maxLifeTime=2.5;
  ps.emitRate=35;ps.gravity=new BABYLON.Vector3(0,3,0);
  ps.minEmitPower=.3;ps.maxEmitPower=1;ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps.start();

  // Upper mist
  const ps2=new BABYLON.ParticleSystem('mist2',40,scene);
  ps2.createPointEmitter(new BABYLON.Vector3(-1,0,-1),new BABYLON.Vector3(1,.5,1));
  ps2.particleTexture=pt;ps2.emitter=new BABYLON.Vector3(9.5,-3,9.5);
  ps2.minSize=1.5;ps2.maxSize=3.5;ps2.minLifeTime=1.5;ps2.maxLifeTime=3;
  ps2.emitRate=18;ps2.gravity=new BABYLON.Vector3(0,1.5,0);
  ps2.minEmitPower=.2;ps2.maxEmitPower=.8;
  ps2.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  ps2.color1=new BABYLON.Color4(.8,.9,1,.3);ps2.color2=new BABYLON.Color4(.9,.95,1,.15);
  ps2.start();
}

// ═══ BRIDGES ═══
function buildBridges(par){
  const wM=cm('wM',.42,.28,.14),rM=cm('rM',.3,.18,.08);
  const bp=[[-1,-5.5],[2.5,-1],[-.5,6.5]];
  for(const[bx,bz] of bp){
    const by=sH(Math.sqrt(bx*bx+bz*bz),Math.atan2(bz,bx));
    const hu=new BABYLON.TransformNode('br_'+bx+'_'+bz,scene);hu.parent=par;
    hu.position=new BABYLON.Vector3(bx,by,bz);
    const a=Math.atan2(bz,bx);hu.rotation.y=a;
    mb('bpl',4.5,.14,.9,null,new BABYLON.Vector3(0,.05,0),null,wM,hu);
    mc('rp1',.07,.07,1.8,null,new BABYLON.Vector3(-1.4,.95,0),null,rM,hu,4);
    mc('rp2',.07,.07,1.8,null,new BABYLON.Vector3(1.4,.95,0),null,rM,hu,4);
    mb('rl',3.5,.06,.06,null,new BABYLON.Vector3(0,1.7,0),null,rM,hu);
    // Railings
    for(let side=-1;side<=1;side+=2){
      mb('rsg'+side,3.5,.06,.06,null,new BABYLON.Vector3(0,.4,side*.42),null,rM,hu);
      for(let s=0;s<5;s++){
        const sx=-1.4+s*.7;
        mb('rsp'+side+s,.05,.35,.05,null,new BABYLON.Vector3(sx,.22,side*.42),null,rM,hu);
      }
    }
  }
}

// ═══ BUILD SCENE ═══
function buildWorld(){
  buildIsland();

  // Ground
  const gr=BABYLON.MeshBuilder.CreateGround('gnd',{width:700,height:700},scene);
  gr.material=smb('gM',GRN,GRN);gr.position.y=-50;

  // Build particle texture for fireflies
  const fft=new BABYLON.DynamicTexture('fft',32,scene,false);
  const ffc=fft.getContext();
  const fg=ffc.createRadialGradient(16,16,0,16,16,16);
  fg.addColorStop(0,'rgba(255,240,150,.8)');fg.addColorStop(1,'rgba(255,240,150,0)');
  ffc.fillStyle=fg;ffc.fillRect(0,0,32,32);fft.update();

  // Ambient particles (floating motes)
  const aps=new BABYLON.ParticleSystem('ap',25,scene);
  aps.createPointEmitter(new BABYLON.Vector3(-12,0,-12),new BABYLON.Vector3(12,5,12));
  aps.particleTexture=fft;aps.emitter=new BABYLON.Vector3(0,8,0);
  aps.minSize=.08;aps.maxSize=.2;aps.minLifeTime=4;aps.maxLifeTime=7;
  aps.emitRate=4;aps.gravity=new BABYLON.Vector3(0,.08,0);
  aps.minEmitPower=.05;aps.maxEmitPower=.2;
  aps.blendMode=BABYLON.ParticleSystem.BLENDMODE_ADD;
  aps.color1=new BABYLON.Color4(1,.95,.7,.3);aps.color2=new BABYLON.Color4(1,.85,.5,.1);
  aps.start();

  // Hide loading
  const ld=document.getElementById('loading');
  if(ld)ld.style.display='none';
}

// ═══ ANIMATION ═══
scene.registerBeforeRender(()=>{
  uTime.v+=engine.getDeltaTime()/1000;
  const t=uTime.v;

  // Update shader time uniforms
  scene.meshes.forEach(m=>{
    if(m.material&&m.material.setFloat)try{m.material.setFloat('uTime',t)}catch(e){}
    if(m.material&&m.material.setVector3){
      try{m.material.setVector3('uSun',sun.direction.scale(-1))}catch(e){}
    }
  });

  // Gentle camera drift
  cam.alpha+=Math.sin(t*.08)*.0003;
});

// ═══ INIT ═══
buildWorld();
engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
</script>
