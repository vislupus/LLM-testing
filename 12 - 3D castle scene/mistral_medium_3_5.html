<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Medieval Floating Island Diorama</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.7);
            z-index: 100;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://cdn.babylonjs.com/postprocess/babylon.postProcess.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div class="loading">Loading Medieval Island...</div>

    <script>
        // Wait for Babylon.js to be ready
        window.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: true,
                stencil: true,
                disableWebGL2Support: false
            });

            // Hide loading screen when engine is ready
            engine.init().then(() => {
                document.querySelector('.loading').style.display = 'none';
            });

            // Create scene
            const createScene = function() {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color4(0.8, 0.85, 0.95, 1.0);
                scene.ambientColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
                scene.fogDensity = 0.01;
                scene.fogColor = new BABYLON.Color3(0.8, 0.85, 0.95);

                // Camera
                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2.5, Math.PI / 2.8, 180, BABYLON.Vector3.Zero(), scene);
                camera.attachControl(canvas, true);
                camera.lowerBetaLimit = 0.1;
                camera.upperBetaLimit = Math.PI / 2.2;
                camera.lowerRadiusLimit = 120;
                camera.upperRadiusLimit = 300;
                camera.panningSensibility = 0;
                camera.wheelPrecision = 50;
                camera.minZ = 10;

                // Lighting - Main directional light (sun)
                const sunLight = new BABYLON.DirectionalLight("sunLight", new BABYLON.Vector3(-0.5, -1, 0.3), scene);
                sunLight.intensity = 1.2;
                sunLight.diffuse = new BABYLON.Color3(0.95, 0.9, 0.8);
                sunLight.specular = new BABYLON.Color3(0.9, 0.85, 0.7);

                // Fill light
                const fillLight = new BABYLON.DirectionalLight("fillLight", new BABYLON.Vector3(0.5, -0.5, -0.3), scene);
                fillLight.intensity = 0.4;
                fillLight.diffuse = new BABYLON.Color3(0.7, 0.75, 0.85);

                // Hemispheric light for ambient
                const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
                hemiLight.intensity = 0.3;
                hemiLight.diffuse = new BABYLON.Color3(0.6, 0.65, 0.75);
                hemiLight.groundColor = new BABYLON.Color3(0.4, 0.45, 0.35);

                // Post-processing for toon shading effect
                const pipeline = new BABYLON.DefaultRenderingPipeline("default", true, scene, [camera]);
                pipeline.bloomEnabled = true;
                pipeline.bloomThreshold = 0.8;
                pipeline.bloomWeight = 0.3;
                pipeline.bloomKernel = 64;
                pipeline.bloomScale = 0.5;

                // Add a slight color grading for stylized look
                const colorCorrection = new BABYLON.ColorCorrectionPostProcess(
                    "colorCorrection",
                    new BABYLON.Color3(1.05, 1.0, 0.95),
                    1.0,
                    0.1,
                    camera
                );

                // Create materials
                const materials = createMaterials(scene);

                // Create the island
                createIsland(scene, materials);

                // Create the castle
                createCastle(scene, materials);

                // Create the village
                createVillage(scene, materials);

                // Create environment features
                createEnvironment(scene, materials);

                // Add some animated elements
                addAnimations(scene);

                // Skybox
                createSkybox(scene);

                return scene;
            };

            // Create all materials
            function createMaterials(scene) {
                const materials = {};

                // Stone material for castle
                materials.stone = new BABYLON.StandardMaterial("stoneMat", scene);
                materials.stone.diffuseColor = new BABYLON.Color3(0.6, 0.55, 0.5);
                materials.stone.specularColor = new BABYLON.Color3(0.3, 0.25, 0.2);
                materials.stone.specularPower = 30;
                materials.stone.roughness = 0.7;

                // Stone with more weathering
                materials.stoneOld = new BABYLON.StandardMaterial("stoneOldMat", scene);
                materials.stoneOld.diffuseColor = new BABYLON.Color3(0.5, 0.45, 0.4);
                materials.stoneOld.specularColor = new BABYLON.Color3(0.2, 0.15, 0.1);
                materials.stoneOld.specularPower = 20;
                materials.stoneOld.roughness = 0.85;

                // Wood material
                materials.wood = new BABYLON.StandardMaterial("woodMat", scene);
                materials.wood.diffuseColor = new BABYLON.Color3(0.55, 0.35, 0.2);
                materials.wood.specularColor = new BABYLON.Color3(0.2, 0.15, 0.1);
                materials.wood.specularPower = 20;
                materials.wood.roughness = 0.6;

                // Dark wood for roofs
                materials.woodDark = new BABYLON.StandardMaterial("woodDarkMat", scene);
                materials.woodDark.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);
                materials.woodDark.specularColor = new BABYLON.Color3(0.1, 0.05, 0.02);
                materials.woodDark.specularPower = 10;
                materials.woodDark.roughness = 0.8;

                // Grass material
                materials.grass = new BABYLON.StandardMaterial("grassMat", scene);
                materials.grass.diffuseColor = new BABYLON.Color3(0.3, 0.5, 0.2);
                materials.grass.specularColor = new BABYLON.Color3(0.1, 0.15, 0.1);
                materials.grass.specularPower = 5;
                materials.grass.roughness = 0.9;

                // Lush grass
                materials.grassLush = new BABYLON.StandardMaterial("grassLushMat", scene);
                materials.grassLush.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2);
                materials.grassLush.specularColor = new BABYLON.Color3(0.05, 0.1, 0.05);
                materials.grassLush.specularPower = 5;
                materials.grassLush.roughness = 0.95;

                // Water material
                materials.water = new BABYLON.StandardMaterial("waterMat", scene);
                materials.water.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.7);
                materials.water.specularColor = new BABYLON.Color3(0.8, 0.9, 1.0);
                materials.water.specularPower = 100;
                materials.water.roughness = 0.1;
                materials.water.emissiveColor = new BABYLON.Color3(0.1, 0.3, 0.4);

                // Rock material
                materials.rock = new BABYLON.StandardMaterial("rockMat", scene);
                materials.rock.diffuseColor = new BABYLON.Color3(0.4, 0.35, 0.3);
                materials.rock.specularColor = new BABYLON.Color3(0.1, 0.08, 0.05);
                materials.rock.specularPower = 15;
                materials.rock.roughness = 0.9;

                // Thatched roof
                materials.thatch = new BABYLON.StandardMaterial("thatchMat", scene);
                materials.thatch.diffuseColor = new BABYLON.Color3(0.6, 0.5, 0.3);
                materials.thatch.specularColor = new BABYLON.Color3(0.1, 0.08, 0.05);
                materials.thatch.specularPower = 5;
                materials.thatch.roughness = 0.95;

                // Cobblestone
                materials.cobblestone = new BABYLON.StandardMaterial("cobblestoneMat", scene);
                materials.cobblestone.diffuseColor = new BABYLON.Color3(0.5, 0.45, 0.4);
                materials.cobblestone.specularColor = new BABYLON.Color3(0.2, 0.15, 0.1);
                materials.cobblestone.specularPower = 25;
                materials.cobblestone.roughness = 0.6;

                // Market stall fabric
                materials.fabric = new BABYLON.StandardMaterial("fabricMat", scene);
                materials.fabric.diffuseColor = new BABYLON.Color3(0.7, 0.3, 0.2);
                materials.fabric.specularColor = new BABYLON.Color3(0.1, 0.05, 0.02);
                materials.fabric.specularPower = 5;
                materials.fabric.roughness = 0.9;

                // Wooden bridge
                materials.bridge = new BABYLON.StandardMaterial("bridgeMat", scene);
                materials.bridge.diffuseColor = new BABYLON.Color3(0.45, 0.3, 0.2);
                materials.bridge.specularColor = new BABYLON.Color3(0.15, 0.1, 0.05);
                materials.bridge.specularPower = 10;
                materials.bridge.roughness = 0.7;

                // Pine tree material
                materials.pine = new BABYLON.StandardMaterial("pineMat", scene);
                materials.pine.diffuseColor = new BABYLON.Color3(0.1, 0.3, 0.1);
                materials.pine.specularColor = new BABYLON.Color3(0.05, 0.1, 0.05);
                materials.pine.specularPower = 5;
                materials.pine.roughness = 0.9;

                // Ruined stone
                materials.ruin = new BABYLON.StandardMaterial("ruinMat", scene);
                materials.ruin.diffuseColor = new BABYLON.Color3(0.4, 0.35, 0.3);
                materials.ruin.specularColor = new BABYLON.Color3(0.1, 0.08, 0.05);
                materials.ruin.specularPower = 5;
                materials.ruin.roughness = 0.95;
                materials.ruin.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.08);

                return materials;
            }

            // Create the floating island base
            function createIsland(scene, materials) {
                // Main island base - irregular shape
                const island = BABYLON.MeshBuilder.CreateGroundFromHeightMap(
                    "island",  // name
                    "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAMAAAAp4XiDAAAAUVBMVEWFhYWDg4N3d3dtbW17e3t1dXVAAAAacXJUPEdrS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLcXJUPUBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBjY2NfY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2Nl5eXl5eXl5eXl5eXl5eXl5eXl5dg4NjAAAAH3RSTlMAAon9/f3+/v7+/v7+/v7+/v7+/v7+/v7+/v42NjYAAAFiS0dEAIgFHUgAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAHdElNRQfnBhIJGz4L5KJ5AAAAJ0lEQVQ4y+3UMUoDQRTG8Z8psJBUSQ60Qb20g7A0bRgQxv8YkLJBB4kQb1AEBAS4EiAQn4EJAwuIjAIvIHE6Y4BnYjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YgAnYjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YgAnYjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YgAnYjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YjAJ2oA7YgBNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgCNYgAAAAASUVORK5CYII=",  // heightMap URL
                    {
                        width: 400,
                        height: 400,
                        subdivisions: 200,
                        minHeight: 0,
                        maxHeight: 30,
                        onReady: (mesh) => {
                            mesh.material = materials.grass;
                            mesh.receiveShadows = true;
                            mesh.position.y = -20;

                            // Add variation to the terrain
                            const noise = new BABYLON.NoiseProceduralTexture("perlin", 512, scene, {
                                noiseType: BABYLON.NoiseProceduralTexture.PERLIN
                            });
                            noise.octaves = 4;
                            noise.persistence = 0.5;
                            noise.scale = 20;

                            const terrainMaterial = new BABYLON.ShaderMaterial(
                                "terrainShader",
                                scene,
                                {
                                    vertex: "terrainVertex",
                                    fragment: "terrainFragment"
                                },
                                {
                                    attributes: ["position", "normal", "uv"],
                                    uniforms: ["worldViewProjection", "world", "noiseSampler"]
                                }
                            );

                            terrainMaterial.setTexture("noiseSampler", noise);
                            terrainMaterial.backFaceCulling = false;

                            // For simplicity, we'll stick with standard material for now
                            // But we can add more detail later
                        }
                    },
                    scene
                );

                // Add cliffs around the edges
                createCliffs(scene, materials);

                // Add grass variation
                addGrassPatches(scene, materials);
            }

            // Create cliffs around the island
            function createCliffs(scene, materials) {
                // Create rocky outcrops
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const radius = 150 + Math.random() * 50;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const height = 10 + Math.random() * 20;
                    const width = 20 + Math.random() * 30;
                    const depth = 20 + Math.random() * 30;

                    const cliff = BABYLON.MeshBuilder.CreateBox("cliff" + i, {
                        width: width,
                        height: height,
                        depth: depth
                    }, scene);
                    cliff.position = new BABYLON.Vector3(x, height/2 - 15, z);
                    cliff.rotation.y = angle + Math.PI/2;
                    cliff.material = materials.rock;
                    cliff.receiveShadows = true;
                    cliff.checkCollisions = true;

                    // Add some variation to the shape
                    const noise = new BABYLON.NoiseProceduralTexture("cliffNoise" + i, 64, scene);
                    noise.octaves = 2;
                    noise.persistence = 0.7;

                    // Apply some scaling to make it more natural
                    cliff.scaling.x = 0.7 + Math.random() * 0.6;
                    cliff.scaling.z = 0.7 + Math.random() * 0.6;
                }

                // Add some larger cliff formations
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2 + Math.PI/4;
                    const radius = 180;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;

                    const cliff = BABYLON.MeshBuilder.CreateCylinder("largeCliff" + i, {
                        diameter: 60,
                        height: 40 + Math.random() * 20,
                        tessellation: 12
                    }, scene);
                    cliff.position = new BABYLON.Vector3(x, 20, z);
                    cliff.rotation.y = angle;
                    cliff.material = materials.rock;
                    cliff.receiveShadows = true;

                    // Add some boulders at the base
                    for (let j = 0; j < 5; j++) {
                        const boulder = BABYLON.MeshBuilder.CreateSphere("boulder" + i + j, {
                            diameter: 5 + Math.random() * 8,
                            segments: 8
                        }, scene);
                        const boulderAngle = Math.random() * Math.PI * 2;
                        const boulderRadius = 20 + Math.random() * 15;
                        boulder.position = new BABYLON.Vector3(
                            x + Math.cos(boulderAngle) * boulderRadius,
                            5 + Math.random() * 10,
                            z + Math.sin(boulderAngle) * boulderRadius
                        );
                        boulder.material = materials.rock;
                        boulder.receiveShadows = true;
                    }
                }
            }

            // Add grass patches for more variation
            function addGrassPatches(scene, materials) {
                for (let i = 0; i < 30; i++) {
                    const x = (Math.random() - 0.5) * 300;
                    const z = (Math.random() - 0.5) * 300;
                    const size = 10 + Math.random() * 30;

                    const grassPatch = BABYLON.MeshBuilder.CreateDisc("grassPatch" + i, {
                        radius: size,
                        tessellation: 16
                    }, scene);
                    grassPatch.position = new BABYLON.Vector3(x, -18, z);
                    grassPatch.rotation.x = Math.PI / 2;

                    // Use either lush or regular grass
                    grassPatch.material = Math.random() > 0.5 ? materials.grassLush : materials.grass;
                    grassPatch.receiveShadows = true;
                }
            }

            // Create the medieval castle
            function createCastle(scene, materials) {
                const castleGroup = new BABYLON.TransformNode("castleGroup", scene);

                // Main keep (central tower)
                const keep = BABYLON.MeshBuilder.CreateCylinder("keep", {
                    diameter: 40,
                    height: 60,
                    tessellation: 12
                }, scene);
                keep.position = new BABYLON.Vector3(0, 30, 0);
                keep.material = materials.stone;
                keep.receiveShadows = true;
                keep.parent = castleGroup;

                // Add battlements to the top of the keep
                addBattlements(scene, keep, 40, 60, materials.stone);

                // Add windows to the keep
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2;
                    for (let j = 0; j < 3; j++) {
                        const window = BABYLON.MeshBuilder.CreateBox("keepWindow" + i + j, {
                            width: 6,
                            height: 10,
                            depth: 2
                        }, scene);
                        window.position = new BABYLON.Vector3(
                            Math.cos(angle) * 18,
                            10 + j * 15,
                            Math.sin(angle) * 18
                        );
                        window.rotation.y = angle + Math.PI/2;
                        window.material = materials.stoneOld;
                        window.parent = keep;
                    }
                }

                // Add a conical roof
                const keepRoof = BABYLON.MeshBuilder.CreateCone("keepRoof", {
                    diameter: 45,
                    height: 20,
                    tessellation: 12
                }, scene);
                keepRoof.position = new BABYLON.Vector3(0, 80, 0);
                keepRoof.material = materials.woodDark;
                keepRoof.parent = castleGroup;

                // Add smaller towers
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2;
                    const radius = 60;

                    const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + i, {
                        diameter: 25,
                        height: 50,
                        tessellation: 10
                    }, scene);
                    tower.position = new BABYLON.Vector3(
                        Math.cos(angle) * radius,
                        25,
                        Math.sin(angle) * radius
                    );
                    tower.material = materials.stone;
                    tower.receiveShadows = true;
                    tower.parent = castleGroup;

                    // Add battlements
                    addBattlements(scene, tower, 25, 50, materials.stone);

                    // Add conical roof
                    const towerRoof = BABYLON.MeshBuilder.CreateCone("towerRoof" + i, {
                        diameter: 28,
                        height: 15,
                        tessellation: 10
                    }, scene);
                    towerRoof.position = new BABYLON.Vector3(
                        Math.cos(angle) * radius,
                        65,
                        Math.sin(angle) * radius
                    );
                    towerRoof.material = materials.woodDark;
                    towerRoof.parent = castleGroup;

                    // Connect to main keep with walls
                    const wall = BABYLON.MeshBuilder.CreateBox("wall" + i, {
                        width: radius - 10,
                        height: 20,
                        depth: 3
                    }, scene);
                    wall.position = new BABYLON.Vector3(
                        Math.cos(angle) * (radius / 2),
                        15,
                        Math.sin(angle) * (radius / 2)
                    );
                    wall.rotation.y = angle;
                    wall.material = materials.stone;
                    wall.parent = castleGroup;

                    // Add battlements to walls
                    addBattlements(scene, wall, radius - 10, 20, materials.stone, 0, 15);
                }

                // Add a main gate
                const gate = BABYLON.MeshBuilder.CreateBox("gate", {
                    width: 30,
                    height: 25,
                    depth: 5
                }, scene);
                gate.position = new BABYLON.Vector3(0, 12.5, -65);
                gate.material = materials.stone;
                gate.parent = castleGroup;

                // Add gate details
                const gateArch = BABYLON.MeshBuilder.CreateTorus("gateArch", {
                    diameter: 30,
                    thickness: 5,
                    tessellation: 16
                }, scene);
                gateArch.position = new BABYLON.Vector3(0, 25, -65);
                gateArch.rotation.x = Math.PI / 2;
                gateArch.rotation.z = Math.PI / 2;
                gateArch.material = materials.stoneOld;
                gateArch.parent = castleGroup;

                // Add courtyard ground
                const courtyard = BABYLON.MeshBuilder.CreateGround("courtyard", {
                    width: 120,
                    height: 120,
                    subdivisions: 4
                }, scene);
                courtyard.position = new BABYLON.Vector3(0, 0.1, 0);
                courtyard.material = materials.cobblestone;
                courtyard.parent = castleGroup;

                // Position the castle group
                castleGroup.position = new BABYLON.Vector3(0, 0, 0);

                return castleGroup;
            }

            // Add battlements to a mesh
            function addBattlements(scene, parent, diameter, height, material, offsetX = 0, offsetZ = 0) {
                const battlementGroup = new BABYLON.TransformNode("battlements", scene);
                battlementGroup.parent = parent;

                const numBattlements = 12;
                const battlementWidth = 5;
                const battlementHeight = 5;
                const gapWidth = 3;

                for (let i = 0; i < numBattlements; i++) {
                    const angle = (i / numBattlements) * Math.PI * 2;
                    const radius = diameter / 2 + 1;

                    // Merlon (the solid part)
                    const merlon = BABYLON.MeshBuilder.CreateBox("merlon" + i, {
                        width: battlementWidth,
                        height: battlementHeight,
                        depth: 2
                    }, scene);
                    merlon.position = new BABYLON.Vector3(
                        Math.cos(angle) * radius + offsetX,
                        height + battlementHeight/2,
                        Math.sin(angle) * radius + offsetZ
                    );
                    merlon.rotation.y = angle;
                    merlon.material = material;
                    merlon.parent = battlementGroup;

                    // Crenel (the gap) - we'll just skip these visually
                }

                return battlementGroup;
            }

            // Create the village
            function createVillage(scene, materials) {
                const villageGroup = new BABYLON.TransformNode("villageGroup", scene);

                // House positions - arranged in a semi-circle around the castle
                const housePositions = [
                    { x: 80, z: -20, angle: -Math.PI/4 },
                    { x: 100, z: 20, angle: -Math.PI/6 },
                    { x: 80, z: 60, angle: 0 },
                    { x: 50, z: 80, angle: Math.PI/6 },
                    { x: -20, z: 80, angle: Math.PI/4 },
                    { x: -50, z: 60, angle: Math.PI/3 },
                    { x: -80, z: 20, angle: Math.PI/2 },
                    { x: -100, z: -20, angle: 2*Math.PI/3 },
                    { x: -80, z: -60, angle: 3*Math.PI/4 },
                    { x: -50, z: -80, angle: Math.PI }
                ];

                // Create houses
                for (let i = 0; i < housePositions.length; i++) {
                    const pos = housePositions[i];
                    createHouse(scene, materials, villageGroup, pos.x, pos.z, pos.angle, i % 2 === 0 ? 1 : 2);
                }

                // Create tavern (larger building)
                createTavern(scene, materials, villageGroup, 60, -50, -Math.PI/3);

                // Create market stalls
                createMarketStalls(scene, materials, villageGroup);

                // Create mill
                createMill(scene, materials, villageGroup);

                // Position village relative to castle
                villageGroup.position = new BABYLON.Vector3(0, 0, 0);

                return villageGroup;
            }

            // Create a house
            function createHouse(scene, materials, parent, x, z, angle, type) {
                const houseGroup = new BABYLON.TransformNode("house" + x + z, scene);
                houseGroup.position = new BABYLON.Vector3(x, 0, z);
                houseGroup.rotation.y = angle;
                houseGroup.parent = parent;

                // House base
                const house = BABYLON.MeshBuilder.CreateBox("houseBase", {
                    width: 12 + type * 4,
                    height: 10,
                    depth: 15 + type * 5
                }, scene);
                house.position = new BABYLON.Vector3(0, 5, 0);
                house.material = materials.wood;
                house.parent = houseGroup;

                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("houseRoof", {
                    diameter: Math.sqrt((12 + type * 4)**2 + (15 + type * 5)**2) * 0.7,
                    height: 8,

            // Create the mill

                // Wheel paddles
                for (let i = 0; i < 12; i++) {
                    const paddle = BABYLON.MeshBuilder.CreateBox("paddle" + i, {
                        width: 2,

                    }, scene);
                    paddle.position = new BABYLON.Vector3(14, 7.5, 0);

            // Create environment features
            function createEnvironment(scene, materials) {
                // Create the river

                createTrees(scene, materials);

                // Create the ruined watchtower

            // Create the river
            function createRiver(scene, materials) {
                // Main river path - S-shaped
                const riverPoints = [
                    new BABYLON.Vector3(150, -18, 100),
                    new BABYLON.Vector3(120, -18, 80),
                    new BABYLON.Vector3(100, -18, 50),
                    new BABYLON.Vector3(80, -18, 20),
                    new BABYLON.Vector3(50, -18, -20),
                    new BABYLON.Vector3(20, -18, -50),
                    new BABYLON.Vector3(-20, -18, -80),
                    new BABYLON.Vector3(-50, -18, -100)
                ];

                // Create river mesh
                const river = BABYLON.MeshBuilder.CreateRibbon("river", {
                    pathArray: riverPoints,
                    width: 20,
                    sideOrientation: BABYLON.Mesh.DOUBLESIDE,
                    closePath: false,
                    closeArray: false
                }, scene);
                river.position.y = -17;
                river.material = materials.water;
                river.receiveShadows = true;

                // Add some variation to the river width
                for (let i = 0; i < riverPoints.length; i++) {
                    // Create river banks
                    const bankLeft = BABYLON.MeshBuilder.CreateRibbon("riverBankLeft" + i, {
                        pathArray: [
                            riverPoints[i],
                            riverPoints[i].add(new BABYLON.Vector3(-10, 0, 0))
                        ],
                        width: 5,
                        sideOrientation: BABYLON.Mesh.DOUBLESIDE
                    }, scene);
                    bankLeft.position.y = -16;
                    bankLeft.material = materials.grassLush;

                    const bankRight = BABYLON.MeshBuilder.CreateRibbon("riverBankRight" + i, {
                        pathArray: [
                            riverPoints[i],
                            riverPoints[i].add(new BABYLON.Vector3(10, 0, 0))
                        ],
                        width: 5,
                        sideOrientation: BABYLON.Mesh.DOUBLESIDE
                    }, scene);
                    bankRight.position.y = -16;
                    bankRight.material = materials.grassLush;
                }

                // Add some rocks in the river
                for (let i = 0; i < 15; i++) {
                    const rock = BABYLON.MeshBuilder.CreateSphere("riverRock" + i, {
                        diameter: 2 + Math.random() * 4,
                        segments: 8
                    }, scene);
                    const pos = riverPoints[Math.floor(Math.random() * riverPoints.length)];
                    rock.position = new BABYLON.Vector3(
                        pos.x + (Math.random() - 0.5) * 15,
                        -17 + Math.random() * 1,
                        pos.z + (Math.random() - 0.5) * 15
                    );
                    rock.material = materials.rock;
                }
            }

                    { x: -30, z: -40 },
                    { x: 40, z: -50 },
                    { x: 50, z: 40 },
                    { x: -40, z: 50 },
                    { x: -60, z: -20 },
                    { x: 30, z: 60 },

                    // Near the village
                    { x: 90, z: -10 },
                    { x: 110, z: 30 },
                    { x: 70, z: 70 },
                    { x: -70, z: 70 },
                    { x: -90, z: -10 },
                    { x: -110, z: 30 },

                    // Near the river
                    { x: 100, z: 100 },
                    { x: 80, z: -90 },
                    { x: -80, z: -90 },
                    { x: -100, z: 100 },

                    // Near the cliffs
                    { x: 150, z: 50 },
                    { x: 150, z: -50 },
                    { x: -150, z: 50 },

                for (let i = 0; i < treePositions.length; i++) {
                    const pos = treePositions[i];

                    treeGroup.position = new BABYLON.Vector3(pos.x, 0, pos.z);

                    // Trunk
                    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk" + i, {
                        diameter: 1 + Math.random() * 0.5,
                        height: 8 + Math.random() * 4,
                        tessellation: 8
                    }, scene);

                    trunk.material = materials.woodDark;
                    trunk.parent = treeGroup;

                    // Foliage - multiple cones for pine tree look
                    for (let j = 0; j < 3 + Math.floor(Math.random() * 3); j++) {
                        const foliage = BABYLON.MeshBuilder.CreateCone("foliage" + i + j, {
                            diameter: 6 + Math.random() * 4,
                            height: 10 + Math.random() * 5,

                            0,
                            8 + j * 4 + Math.random() * 2,
                            0
                        );
                        foliage.material = materials.pine;
                        foliage.parent = treeGroup;
                    }

                    // Add some variation to the trees
                    treeGroup.rotation.y = Math.random() * Math.PI * 2;
                }

                // Add some smaller trees and bushes
                for (let i = 0; i < 40; i++) {
                    const x = (Math.random() - 0.5) * 300;
                    const z = (Math.random() - 0.5) * 300;
                    const size = 0.5 + Math.random() * 1.5;

                    const bushGroup = new BABYLON.TransformNode("bush" + i, scene);
                    bushGroup.position = new BABYLON.Vector3(x, 0, z);

                    // Small trunk
                    const trunk = BABYLON.MeshBuilder.CreateCylinder("bushTrunk" + i, {
                        diameter: 0.3 * size,
                        height: 1 * size,
                        tessellation: 6
                    }, scene);
                    trunk.position = new BABYLON.Vector3(0, 0.5 * size, 0);
                    trunk.material = materials.woodDark;
                    trunk.parent = bushGroup;

                    // Foliage
                    const foliage = BABYLON.MeshBuilder.CreateSphere("bushFoliage" + i, {
                        diameter: 3 * size,
                        segments: 8
                    }, scene);
                    foliage.position = new BABYLON.Vector3(0, 1.5 * size, 0);
                    foliage.material = materials.pine;
                    foliage.parent = bushGroup;

                    bushGroup.rotation.y = Math.random() * Math.PI * 2;
                }
            }

            // Create ruined watchtower
            function createRuinedWatchtower(scene, materials) {
                const towerGroup = new BABYLON.TransformNode("ruinedTower", scene);
                towerGroup.position = new BABYLON.Vector3(-180, 0, -80);

                // Base of the tower
                const base = BABYLON.MeshBuilder.CreateCylinder("towerBase", {
                    diameter: 25,
                    height: 5,
                    tessellation: 12
                }, scene);
                base.position = new BABYLON.Vector3(0, 2.5, 0);
                base.material = materials.ruin;
                base.parent = towerGroup;

                // Broken walls
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2;
                    const wallHeight = 10 + Math.random() * 10;

                    const wall = BABYLON.MeshBuilder.CreateBox("towerWall" + i, {
                        width: 20,
                        height: wallHeight,
                        depth: 3
                    }, scene);
                    wall.position = new BABYLON.Vector3(
                        Math.cos(angle) * 10,
                        2.5 + wallHeight / 2,
                        Math.sin(angle) * 10
                    );
                    wall.rotation.y = angle;
                    wall.material = materials.ruin;
                    wall.parent = towerGroup;

                    // Add some damage to the walls
                    wall.scaling.x = 0.7 + Math.random() * 0.3;
                }

                // Some standing sections
                for (let i = 0; i < 2; i++) {
                    const angle = (i * 2 + 0.5) / 4 * Math.PI * 2;
                    const wallHeight = 15 + Math.random() * 5;

                    const wall = BABYLON.MeshBuilder.CreateBox("towerStandingWall" + i, {
                        width: 15,
                        height: wallHeight,
                        depth: 3
                    }, scene);
                    wall.position = new BABYLON.Vector3(
                        Math.cos(angle) * 10,
                        2.5 + wallHeight / 2,
                        Math.sin(angle) * 10
                    );
                    wall.rotation.y = angle;
                    wall.material = materials.ruin;
                    wall.parent = towerGroup;
                }

                // Broken battlements
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const radius = 12;

                    if (Math.random() > 0.5) {
                        const battlement = BABYLON.MeshBuilder.CreateBox("towerBattlement" + i, {
                            width: 3,
                            height: 2,
                            depth: 2
                        }, scene);
                        battlement.position = new BABYLON.Vector3(
                            Math.cos(angle) * radius,
                            12 + Math.random() * 3,
                            Math.sin(angle) * radius
                        );
                        battlement.rotation.y = angle;
                        battlement.material = materials.ruin;
                        battlement.parent = towerGroup;
                    }
                }

                // Some rubble at the base
                for (let i = 0; i < 10; i++) {
                    const rubble = BABYLON.MeshBuilder.CreateBox("towerRubble" + i, {
                        width: 2 + Math.random() * 3,
                        height: 1 + Math.random() * 2,
                        depth: 2 + Math.random() * 3
                    }, scene);
                    rubble.position = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 20,
                        1 + Math.random() * 2,
                        (Math.random() - 0.5) * 20
                    );
                    rubble.rotation.x = Math.random() * Math.PI;
                    rubble.rotation.y = Math.random() * Math.PI;
                    rubble.rotation.z = Math.random() * Math.PI;
                    rubble.material = materials.ruin;
                    rubble.parent = towerGroup;
                }

                return towerGroup;
            }

            // Create skybox
            function createSkybox(scene) {
                const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", {size: 500}, scene);
                const skyboxMaterial = new BABYLON.StandardMaterial("skyBoxMat", scene);
                skyboxMaterial.backFaceCulling = false;
                skyboxMaterial.diffuseColor = new BABYLON.Color3(0.8, 0.85, 0.95);
                skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
                skyboxMaterial.emissiveColor = new BABYLON.Color3(0.7, 0.75, 0.85);
                skybox.material = skyboxMaterial;
                skybox.infiniteDistance = true;
            }

            // Add animations
            function addAnimations(scene) {
                // Animate water in the river
                scene.registerBeforeRender(function() {
                    const time = scene.getEngine().getDeltaTime() / 1000;

                    // Animate water materials
                    const waterMaterials = scene.materials.filter(m => m.name.includes("water"));
                    waterMaterials.forEach(mat => {
                        if (mat instanceof BABYLON.StandardMaterial) {
                            // Create a simple wave effect
                            const wave = Math.sin(Date.now() / 500) * 0.02;
                            mat.diffuseColor = new BABYLON.Color3(
                                0.2 + wave * 0.1,
                                0.6 + wave * 0.05,
                                0.7 + wave * 0.05
                            );
                        }
                    });
                });

                // Animate waterfall particles
                scene.registerBeforeRender(function() {
                    const waterfalls = scene.transformNodes.filter(n => n.name.includes("waterfall"));
                    waterfalls.forEach(wf => {
                        wf.rotation.z += 0.001;
                    });
                });

                // Animate the water wheel
                scene.registerBeforeRender(function() {
                    const wheel = scene.getTransformNodeByName("wheel");
                    if (wheel) {
                        wheel.rotation.x += 0.01;
                    }
                });
            }

            const scene = createScene();

            // Handle window resize
            window.addEventListener('resize', function() {
                engine.resize();
            });

            // Run the render loop
            engine.runRenderLoop(function() {
                scene.render();
            });
        });
    </script>
</body>
</html>
