<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js - Floating Island Diorama</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1c2e 0%, #0c0d14 100%);
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #uiHint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="uiHint">Left Click + Drag to Orbit | Right Click to Pan | Scroll to Zoom</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        
        let scene, shadowGenerator;
        let animatedElements = [];

        // Global Palette for Vibrant Stylized Miniature Aesthetic
        const PALETTE = {
            stone: new BABYLON.Color3(0.48, 0.52, 0.58),
            stoneDark: new BABYLON.Color3(0.32, 0.35, 0.40),
            roof: new BABYLON.Color3(0.85, 0.25, 0.25),
            wood: new BABYLON.Color3(0.45, 0.30, 0.20),
            woodLight: new BABYLON.Color3(0.60, 0.42, 0.30),
            grass: new BABYLON.Color3(0.22, 0.65, 0.30),
            cliff: new BABYLON.Color3(0.38, 0.36, 0.38),
            water: new BABYLON.Color3(0.10, 0.75, 0.70),
            foam: new BABYLON.Color3(0.80, 0.98, 0.95),
            foliage: new BABYLON.Color3(0.18, 0.48, 0.25),
            thatch: new BABYLON.Color3(0.80, 0.65, 0.30),
            fabric: new BABYLON.Color3(0.85, 0.60, 0.15)
        };

        const createScene = function () {
            scene = new BABYLON.Scene(engine);
            
            // Soft atmospheric lighting setup
            scene.clearColor = new BABYLON.Color4(0.1, 0.11, 0.18, 1);
            scene.ambientColor = new BABYLON.Color3(0.3, 0.33, 0.45);

            // Tabletop Framing Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 3.2, 55, new BABYLON.Vector3(0, 1, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 90;
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = Math.PI / 2.1;

            // Lights
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1.5, -3, -1), scene);
            sun.position = new BABYLON.Vector3(20, 40, 15);
            sun.intensity = 1.6;
            sun.diffuse = new BABYLON.Color3(1.0, 0.92, 0.85);
            sun.specular = new BABYLON.Color3(0.5, 0.5, 0.5);

            const fillLight = new BABYLON.HemisphericLight("fill", new BABYLON.Vector3(0, 1, 0), scene);
            fillLight.intensity = 0.7;
            fillLight.diffuse = new BABYLON.Color3(0.6, 0.7, 0.9);

            const rimLight = new BABYLON.DirectionalLight("rim", new BABYLON.Vector3(1.5, 1, 1), scene);
            rimLight.intensity = 0.4;
            rimLight.diffuse = new BABYLON.Color3(0.4, 0.5, 0.8);

            // High-Quality Dynamic Shadow Mapping
            shadowGenerator = new BABYLON.ShadowGenerator(2048, sun);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;
            shadowGenerator.depthScale = 60;

            // Build Materials Utility
            const matCache = {};
            function getMat(name, color, roughness = 0.8, emissive = false) {
                if (matCache[name]) return matCache[name];
                const mat = new BABYLON.StandardMaterial(name, scene);
                mat.diffuseColor = color;
                mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                mat.specularPower = (1 - roughness) * 100;
                if (emissive) mat.emissiveColor = color.scale(0.15);
                matCache[name] = mat;
                return mat;
            }

            // --- BUILD GEOMETRY BOARDS ---

            // Main Island Base Mesh
            const islandContainer = new BABYLON.TransformNode("islandContainer", scene);
            
            // Stylized Hexagonal / Poly Cut Core Ground Layer
            const ground = BABYLON.MeshBuilder.CreateCylinder("ground", {
                diameterTop: 32, diameterBottom: 24, height: 5, tessellation: 24
            }, scene);
            ground.position.y = 0;
            ground.material = getMat("grassMat", PALETTE.grass);
            ground.parent = islandContainer;
            shadowGenerator.getShadowMap().renderList.push(ground);
            ground.receiveShadows = true;

            // Deep Rocky Cliffs Underneath (Handcrafted chunky geometry look)
            const cliffSubdivision = 16;
            for (let i = 0; i < cliffSubdivision; i++) {
                const angle = (i / cliffSubdivision) * Math.PI * 2;
                const r = 14 + Math.random() * 2.5;
                const h = 8 + Math.random() * 6;
                const rock = BABYLON.MeshBuilder.CreateCylinder("cliffRock", {
                    diameterTop: 2 + Math.random()*2, diameterBottom: 0.1, height: h, tessellation: 4 + Math.floor(Math.random()*3)
                }, scene);
                rock.position.set(Math.cos(angle) * r, -h/2 + 0.5, Math.sin(angle) * r);
                rock.rotation.set(Math.random()*0.3, angle, (Math.random()-0.5)*0.3);
                rock.material = getMat("cliffMat", PALETTE.cliff);
                rock.parent = islandContainer;
                shadowGenerator.getShadowMap().renderList.push(rock);
            }

            // --- THE RIVER & WATERFALL SYSTEMS ---
            
            // Sunken riverbed path mesh cuts across the island
            const river = BABYLON.MeshBuilder.CreateBox("river", { width: 4, height: 0.2, depth: 33 }, scene);
            river.position.set(6, 2.45, 0);
            river.rotation.y = 0.1;
            river.material = getMat("riverMat", PALETTE.water, 0.1);
            river.material.emissiveColor = PALETTE.water.scale(0.3);
            river.parent = islandContainer;

            // Waterfall pouring out from edge into the abyss
            const waterfall = BABYLON.MeshBuilder.CreateBox("waterfall", { width: 3.9, height: 10, depth: 0.2 }, scene);
            waterfall.position.set(7.6, -2.5, 16.2);
            waterfall.rotation.x = 0.05;
            waterfall.material = getMat("waterfallMat", PALETTE.water, 0.2);
            waterfall.parent = islandContainer;

            const foam = BABYLON.MeshBuilder.CreateBox("foam", { width: 4.2, height: 0.3, depth: 0.4 }, scene);
            foam.position.set(7.5, 2.4, 16.1);
            foam.material = getMat("foamMat", PALETTE.foam, 0.9);
            foam.parent = islandContainer;

            // --- CORE FEATURE: THE MEDIEVAL STONE CASTLE (CENTER) ---
            const castleGroup = new BABYLON.TransformNode("castle", scene);
            castleGroup.position.set(-3, 2.5, -2);
            castleGroup.parent = islandContainer;

            // Keep track of modular construction helpers
            function buildTower(x, z, height, radius, hasRoof = true) {
                const wall = BABYLON.MeshBuilder.CreateCylinder("towerWall", { diameter: radius*2, height: height, tessellation: 8 }, scene);
                wall.position.set(x, height/2, z);
                wall.material = getMat("castleStone", PALETTE.stone);
                wall.parent = castleGroup;
                shadowGenerator.getShadowMap().renderList.push(wall);
                wall.receiveShadows = true;

                // Crenellations/Battlements
                const count = 6;
                for(let i=0; i<count; i++) {
                    const ang = (i/count)*Math.PI*2;
                    const batt = BABYLON.MeshBuilder.CreateBox("battlement", {width: radius*0.5, height: 0.5, depth: 0.2}, scene);
                    batt.position.set(x + Math.cos(ang)*(radius-0.1), height + 0.25, z + Math.sin(ang)*(radius-0.1));
                    batt.rotation.y = -ang;
                    batt.material = getMat("castleStone", PALETTE.stone);
                    batt.parent = castleGroup;
                    shadowGenerator.getShadowMap().renderList.push(batt);
                }

                if(hasRoof) {
                    const roof = BABYLON.MeshBuilder.CreateCylinder("towerRoof", { diameterTop: 0, diameterBottom: (radius*2)+0.5, height: height*0.4, tessellation: 8 }, scene);
                    roof.position.set(x, height + (height*0.2) + 0.4, z);
                    roof.material = getMat("castleRoof", PALETTE.roof);
                    roof.parent = castleGroup;
                    shadowGenerator.getShadowMap().renderList.push(roof);
                }
            }

            // Main Keep Structure Blocks
            const keepBase = BABYLON.MeshBuilder.CreateBox("keepBase", { width: 7, height: 6, depth: 7 }, scene);
            keepBase.position.y = 3;
            keepBase.material = getMat("castleStone", PALETTE.stone);
            keepBase.parent = castleGroup;
            shadowGenerator.getShadowMap().renderList.push(keepBase);
            keepBase.receiveShadows = true;

            const keepUpper = BABYLON.MeshBuilder.CreateBox("keepUpper", { width: 5, height: 4, depth: 5 }, scene);
            keepUpper.position.y = 8;
            keepUpper.material = getMat("castleStone", PALETTE.stoneDark);
            keepUpper.parent = castleGroup;
            shadowGenerator.getShadowMap().renderList.push(keepUpper);

            // Build 4 Corner Defense Towers
            buildTower(-3.5, -3.5, 8, 1.2, true);
            buildTower(3.5, -3.5, 8, 1.2, true);
            buildTower(-3.5, 3.5, 11, 1.4, false); // Tall watch keep tower
            buildTower(3.5, 3.5, 8, 1.2, true);

            // Castle Main Gatehouse Entrance
            const gateWall = BABYLON.MeshBuilder.CreateBox("gateWall", { width: 4, height: 4.5, depth: 2 }, scene);
            gateWall.position.set(0, 2.25, -4.2);
            gateWall.material = getMat("castleStone", PALETTE.stone);
            gateWall.parent = castleGroup;
            shadowGenerator.getShadowMap().renderList.push(gateWall);

            const archway = BABYLON.MeshBuilder.CreateCylinder("archway", { diameter: 2.2, height: 2.5, tessellation: 8 }, scene);
            archway.position.set(0, 0.8, -4.2);
            archway.rotation.x = Math.PI / 2;
            archway.material = getMat("castleWood", PALETTE.wood);
            archway.parent = castleGroup;

            // --- MEDIEVAL VILLAGE QUARTER (LEFT SIDE) ---
            const villageGroup = new BABYLON.TransformNode("village", scene);
            villageGroup.position.set(-8, 2.5, 4);
            villageGroup.parent = islandContainer;

            function buildHouse(x, z, rotY, s, type = "normal") {
                const hNode = new BABYLON.TransformNode("house", scene);
                hNode.position.set(x, 0, z);
                hNode.rotation.y = rotY;
                hNode.scaling.setAll(s);
                hNode.parent = villageGroup;

                // Timber/Wood frame base body
                const body = BABYLON.MeshBuilder.CreateBox("houseBody", { width: 2.5, height: 2, depth: 2 }, scene);
                body.position.y = 1;
                body.material = (type === "tavern") ? getMat("stoneDark", PALETTE.stoneDark) : getMat("woodLight", PALETTE.woodLight);
                body.parent = hNode;
                shadowGenerator.getShadowMap().renderList.push(body);
                body.receiveShadows = true;

                // Roof geometries
                let roof;
                if(type === "tavern") {
                    roof = BABYLON.MeshBuilder.CreateCylinder("roof", { diameterTop: 0, diameterBottom: 3.5, height: 2.2, tessellation: 4 }, scene);
                    roof.position.y = 2.8;
                    roof.rotation.y = Math.PI/4;
                    roof.material = getMat("castleRoof", PALETTE.roof);
                } else {
                    roof = BABYLON.MeshBuilder.CreateCylinder("roof", { diameterTop: 0, diameterBottom: 3.2, height: 1.8, tessellation: 4 }, scene);
                    roof.position.y = 2.6;
                    roof.rotation.y = Math.PI/4;
                    roof.material = getMat("thatch", PALETTE.thatch);
                }
                roof.parent = hNode;
                shadowGenerator.getShadowMap().renderList.push(roof);
            }

            // Cluster unique houses forming cozy alleys
            buildHouse(0, 0, 0.2, 1.1, "normal");
            buildHouse(-3, -1, 0.8, 0.95, "normal");
            buildHouse(1, -3.5, -0.4, 1.0, "normal");
            buildHouse(-2, -4.5, 1.4, 1.3, "tavern"); // Large Tavern structure

            // Market Stalls Area
            function buildStall(x, z, rotY) {
                const stall = new BABYLON.TransformNode("stall", scene);
                stall.position.set(x, 0, z);
                stall.rotation.y = rotY;
                stall.parent = villageGroup;

                const counter = BABYLON.MeshBuilder.CreateBox("counter", { width: 1.4, height: 0.7, depth: 0.6 }, scene);
                counter.position.y = 0.35;
                counter.material = getMat("wood", PALETTE.wood);
                counter.parent = stall;

                const cloth = BABYLON.MeshBuilder.CreateBox("cloth", { width: 1.5, height: 0.1, depth: 0.8 }, scene);
                cloth.position.set(0, 1.5, 0);
                cloth.rotation.x = 0.2;
                cloth.material = getMat("fabric", PALETTE.fabric);
                cloth.parent = stall;

                const poleL = BABYLON.MeshBuilder.CreateCylinder("poleL", { diameter: 0.06, height: 1.5 }, scene);
                poleL.position.set(-0.6, 0.75, 0);
                poleL.material = getMat("wood", PALETTE.wood);
                poleL.parent = stall;

                const poleR = poleL.clone("poleR");
                poleR.position.x = 0.6;
                poleR.parent = stall;
            }
            buildStall(2, 0.5, -0.5);
            buildStall(3.5, -1.5, -1.2);

            // --- THE RIVERSIDE WATERMILL (RIGHT SIDE) ---
            const millGroup = new BABYLON.TransformNode("millGroup", scene);
            millGroup.position.set(3.5, 2.5, -4);
            millGroup.parent = islandContainer;

            const millMain = BABYLON.MeshBuilder.CreateBox("millMain", { width: 3, height: 3, depth: 3 }, scene);
            millMain.position.y = 1.5;
            millMain.material = getMat("woodLight", PALETTE.woodLight);
            millMain.parent = millGroup;
            shadowGenerator.getShadowMap().renderList.push(millMain);

            const millRoof = BABYLON.MeshBuilder.CreateCylinder("millRoof", { diameterTop: 0, diameterBottom: 4.2, height: 2, tessellation: 4 }, scene);
            millRoof.position.y = 3.8;
            millRoof.rotation.y = Math.PI/4;
            millRoof.material = getMat("thatch", PALETTE.thatch);
            millRoof.parent = millGroup;
            shadowGenerator.getShadowMap().renderList.push(millRoof);

            // Kinetic Waterwheel Module hanging over the riverbed
            const wheelPivot = new BABYLON.TransformNode("wheelPivot", scene);
            wheelPivot.position.set(2.2, 0.6, 0);
            wheelPivot.rotation.y = 0.1; // Parallel alignment to river system angle
            wheelPivot.parent = millGroup;

            const centerHub = BABYLON.MeshBuilder.CreateCylinder("hub", { diameter: 0.6, height: 0.8 }, scene);
            centerHub.rotation.z = Math.PI/2;
            centerHub.material = getMat("wood", PALETTE.wood);
            centerHub.parent = wheelPivot;

            const paddleCount = 8;
            for(let i=0; i<paddleCount; i++) {
                const ang = (i/paddleCount) * Math.PI * 2;
                const paddle = BABYLON.MeshBuilder.CreateBox("paddle", { width: 0.1, height: 1.8, depth: 0.6 }, scene);
                paddle.position.set(0, Math.sin(ang)*0.9, Math.cos(ang)*0.9);
                paddle.rotation.x = -ang;
                paddle.material = getMat("wood", PALETTE.wood);
                paddle.parent = wheelPivot;
            }
            // Bind wheel physics track to system ticks animation lists
            animatedElements.push({ node: wheelPivot, type: "rotation", axis: "x", speed: 0.8 });

            // --- CROSSING INFRASTRUCTURE: WOODEN BRIDGES ---
            function buildBridge(x, z, rotY) {
                const bridge = new BABYLON.TransformNode("bridge", scene);
                bridge.position.set(x, 2.5, z);
                bridge.rotation.y = rotY;
                bridge.parent = islandContainer;

                const plank = BABYLON.MeshBuilder.CreateBox("plank", { width: 2.2, height: 0.15, depth: 5 }, scene);
                plank.material = getMat("wood", PALETTE.wood);
                plank.parent = bridge;
                shadowGenerator.getShadowMap().renderList.push(plank);

                const railL = BABYLON.MeshBuilder.CreateBox("railL", { width: 0.1, height: 0.6, depth: 5 }, scene);
                railL.position.set(-1.0, 0.3, 0);
                railL.material = getMat("woodLight", PALETTE.woodLight);
                railL.parent = bridge;

                const railR = railL.clone("railR");
                railR.position.x = 1.0;
                railR.parent = bridge;
            }
            // Primary bridge infrastructure connects village vectors to castle keep
            buildBridge(5.6, 3, 0.1);
            buildBridge(4.6, -7, 0.1);

            // --- RUINED WATCHTOWER (PREDICTIVE EDGE PLACEMENT) ---
            const ruinGroup = new BABYLON.TransformNode("ruinWatchtower", scene);
            ruinGroup.position.set(11, 2.5, -9);
            ruinGroup.parent = islandContainer;

            const tRadius = 1.8;
            const blockLayerCount = 7;
            for (let layer = 0; layer < blockLayerCount; layer++) {
                const h = 0.8;
                const circumferenceBlocks = 8;
                for (let b = 0; b < circumferenceBlocks; b++) {
                    // Purposefully skipping arbitrary segments yields weathered battle-torn appearance
                    if(layer > 3 && (b === 2 || b === 3 || b === 6)) continue;
                    if(layer === 6 && b !== 0 && b !== 4) continue;

                    const ang = (b / circumferenceBlocks) * Math.PI * 2 + (layer * 0.2);
                    const block = BABYLON.MeshBuilder.CreateBox("ruinBlock", { width: 1.1, height: h, depth: 0.5 }, scene);
                    block.position.set(Math.cos(ang)*tRadius, (layer * h) + h/2, Math.sin(ang)*tRadius);
                    block.rotation.y = -ang;
                    block.material = getMat("castleStone", PALETTE.stoneDark);
                    block.parent = ruinGroup;
                    shadowGenerator.getShadowMap().renderList.push(block);
                }
            }

            // --- NATURE FLORA: VIBRANT STYLIZED PINE TREES ---
            const treeGroup = new BABYLON.TransformNode("trees", scene);
            treeGroup.parent = islandContainer;

            function buildPineTree(x, z, scale) {
                const tNode = new BABYLON.TransformNode("pineTree", scene);
                tNode.position.set(x, 2.5, z);
                tNode.scaling.setAll(scale);
                tNode.parent = treeGroup;

                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { diameterTop: 0.2, diameterBottom: 0.4, height: 1.5 }, scene);
                trunk.position.y = 0.75;
                trunk.material = getMat("wood", PALETTE.wood);
                trunk.parent = tNode;

                // High-poly tiered geometric foliage look
                const tiers = 3;
                for(let i=0; i<tiers; i++) {
                    const bRad = 1.6 - (i * 0.4);
                    const tHeight = 1.4;
                    const leaves = BABYLON.MeshBuilder.CreateCylinder("leaves", {
                        diameterTop: 0, diameterBottom: bRad, height: tHeight, tessellation: 6
                    }, scene);
                    leaves.position.y = 1.5 + (i * 0.9);
                    leaves.rotation.y = i * 0.4;
                    leaves.material = getMat("foliageMat", PALETTE.foliage);
                    leaves.parent = tNode;
                    shadowGenerator.getShadowMap().renderList.push(leaves);
                }
            }

            // Scatter forest layers across the island landscape
            buildPineTree(-11, -3, 1.2);
            buildPineTree(-10, -6, 0.9);
            buildPineTree(-6, -11, 1.4);
            buildPineTree(-1, -10, 1.1);
            
            buildPineTree(1, 9, 1.3);
            buildPineTree(-3, 11, 0.8);
            buildPineTree(-7, 10, 1.1);

            buildPineTree(12, 4, 1.0);
            buildPineTree(11, 8, 1.2);
            buildPineTree(13, -2, 0.95);

            // Gently glide whole island for floating animation
            animatedElements.push({ node: islandContainer, type: "float", speed: 0.8, amplitude: 0.4 });

            return scene;
        };

        scene = createScene();

        // High Performance Render Execution Loop
        let time = 0;
        engine.runRenderLoop(function () {
            if (scene) {
                const deltaTime = engine.getDeltaTime() / 1000;
                time += deltaTime;

                // Handle custom procedural runtime physics loops
                animatedElements.forEach(item => {
                    if (item.type === "rotation") {
                        if (item.axis === "x") item.node.rotation.x += item.speed * deltaTime;
                        if (item.axis === "y") item.node.rotation.y += item.speed * deltaTime;
                    } else if (item.type === "float") {
                        // Soft up-down drifting oscillation
                        item.node.position.y = Math.sin(time * item.speed) * item.amplitude;
                        // Subtle slow rotational hover drift
                        item.node.rotation.y = Math.sin(time * 0.1) * 0.04;
                    }
                });

                scene.render();
            }
        });

        // Handle viewport adjustments dynamically
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
