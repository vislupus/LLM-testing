<!DOCTYPE html>
<html>
<head>
    <title>Medieval Island Diorama</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script src="https://cdn.babylonjs.com/babylon.max.js"></script>
    <script>
        // Get the canvas element
        const canvas = document.getElementById('renderCanvas');
        // Generate the BABYLON 3D engine
        const engine = new BABYLON.Engine(canvas, true);

        // Create the scene
        const createScene = function() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.5, 0.7, 1); // Light blue sky

            // Camera
            const camera = new BABYLON.ArcRotateCamera("Camera", 1, 0.8, 10, new BABYLON.Vector3(0, 5, -10), scene);
            camera.setTarget(new BABYLON.Vector3(0, 2, 0));
            camera.upperBetaLimit = Math.PI / 2;
            camera.wheelPrecision = 50;
            camera.attachControl(canvas, true);

            // Lighting
            const light = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;
            light.specular = new BABYLON.Color3(0, 0, 0);

            // Island ground
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 20, height: 20, subdivisions: 2}, scene);
            const groundMaterial = new BABYLON.StandardMaterial("groundMaterial", scene);
            groundMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2); // Green
            ground.material = groundMaterial;

            // Medieval castle
            const castle = BABYLON.MeshBuilder.CreateBox("castle", {size: 2}, scene);
            castle.position = new BABYLON.Vector3(0, 1, 0);
            castle.scaling = new BABYLON.Vector3(4, 3, 4);
            const castleMaterial = new BABYLON.StandardMaterial("castleMaterial", scene);
            castleMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.6); // Gray
            castle.material = castleMaterial;

            // Village houses
            const house1 = BABYLON.MeshBuilder.CreateBox("house1", {size: 1}, scene);
            house1.position = new BABYLON.Vector3(-3, 0.5, 2);
            house1.scaling = new BABYLON.Vector3(1.5, 1, 1.5);
            const houseMaterial = new BABYLON.StandardMaterial("houseMaterial", scene);
            houseMaterial.diffuseColor = new BABYLON.Color3(0.8, 0.5, 0.2); // Brown
            house1.material = houseMaterial;

            const house2 = BABYLON.MeshBuilder.CreateBox("house2", {size: 1}, scene);
            house2.position = new BABYLON.Vector3(3, 0.5, 2);
            house2.scaling = new BABYLON.Vector3(1.5, 1, 1.5);
            house2.material = houseMaterial;

            // Tavern
            const tavern = BABYLON.MeshBuilder.CreateBox("tavern", {size: 1}, scene);
            tavern.position = new BABYLON.Vector3(0, 0.5, 3);
            tavern.scaling = new BABYLON.Vector3(2, 1.5, 2);
            const tavernMaterial = new BABYLON.StandardMaterial("tavernMaterial", scene);
            tavernMaterial.diffuseColor = new BABYLON.Color3(0.9, 0.7, 0.3); // Yellowish
            tavern.material = tavernMaterial;

            // Market stalls
            const stall1 = BABYLON.MeshBuilder.CreateBox("stall1", {size: 0.5}, scene);
            stall1.position = new BABYLON.Vector3(-2, 0.25, -2);
            stall1.scaling = new BABYLON.Vector3(1, 0.5, 1);
            stall1.material = houseMaterial;

            const stall2 = BABYLON.MeshBuilder.CreateBox("stall2", {size: 0.5}, scene);
            stall2.position = new BABYLON.Vector3(2, 0.25, -2);
            stall2.scaling = new BABYLON.Vector3(1, 0.5, 1);
            stall2.material = houseMaterial;

            // Riverside mill
            const mill = BABYLON.MeshBuilder.CreateBox("mill", {size: 1}, scene);
            mill.position = new BABYLON.Vector3(-4, 0.5, -3);
            mill.scaling = new BABYLON.Vector3(2, 1.5, 1.5);
            mill.material = houseMaterial;

            // River
            const river = BABYLON.MeshBuilder.CreateGround("river", {width: 8, height: 6, subdivisions: 2}, scene);
            river.position = new BABYLON.Vector3(0, 0.1, -3);
            const riverMaterial = new BABYLON.StandardMaterial("riverMaterial", scene);
            riverMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.7, 0.8); // Turquoise
            river.material = riverMaterial;

            // Cliffs
            const cliff1 = BABYLON.MeshBuilder.CreateBox("cliff1", {size: 2}, scene);
            cliff1.position = new BABYLON.Vector3(-6, 2, 0);
            cliff1.scaling = new BABYLON.Vector3(2, 4, 4);
            const cliffMaterial = new BABYLON.StandardMaterial("cliffMaterial", scene);
            cliffMaterial.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5); // Gray
            cliff1.material = cliffMaterial;

            const cliff2 = BABYLON.MeshBuilder.CreateBox("cliff2", {size: 2}, scene);
            cliff2.position = new BABYLON.Vector3(6, 2, 0);
            cliff2.scaling = new BABYLON.Vector3(2, 4, 4);
            cliff2.material = cliffMaterial;

            // Pine trees
            const tree1 = BABYLON.MeshBuilder.CreateSphere("tree1", {segments: 16, diameter: 1}, scene);
            tree1.position = new BABYLON.Vector3(-5, 1, 4);
            const treeMaterial = new BABYLON.StandardMaterial("treeMaterial", scene);
            treeMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.5, 0.1); // Green
            tree1.material = treeMaterial;

            const tree2 = BABYLON.MeshBuilder.CreateSphere("tree2", {segments: 16, diameter: 1}, scene);
            tree2.position = new BABYLON.Vector3(5, 1, 4);
            tree2.material = treeMaterial;

            // Wooden bridges
            const bridge1 = BABYLON.MeshBuilder.CreateBox("bridge1", {size: 0.5}, scene);
            bridge1.position = new BABYLON.Vector3(-1, 0.25, -4);
            bridge1.scaling = new BABYLON.Vector3(2, 0.1, 0.5);
            bridge1.material = houseMaterial;

            const bridge2 = BABYLON.MeshBuilder.CreateBox("bridge2", {size: 0.5}, scene);
            bridge2.position = new BABYLON.Vector3(1, 0.25, -4);
            bridge2.scaling = new BABYLON.Vector3(2, 0.1, 0.5);
            bridge2.material = houseMaterial;

            // Waterfalls
            const waterfall = BABYLON.MeshBuilder.CreatePlane("waterfall", {size: 1}, scene);
            waterfall.position = new BABYLON.Vector3(-5, 1, -5);
            waterfall.rotation = new BABYLON.Quaternion.RotationAxis(new BABYLON.Vector3(1, 0, 0), Math.PI / 4);
            const waterfallMaterial = new BABYLON.StandardMaterial("waterfallMaterial", scene);
            waterfallMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.7, 0.8); // Turquoise
            waterfall.material = waterfallMaterial;

            // Ruined watchtower
            const watchtower = BABYLON.MeshBuilder.CreateBox("watchtower", {size: 1}, scene);
            watchtower.position = new BABYLON.Vector3(7, 2, -5);
            watchtower.scaling = new BABYLON.Vector3(1, 2, 1);
            const watchtowerMaterial = new BABYLON.StandardMaterial("watchtowerMaterial", scene);
            watchtowerMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.6); // Gray
            watchtower.material = watchtowerMaterial;

            return scene;
        };

        // Create the scene
        const scene = createScene();

        // Register a render loop to repeatedly render the scene
        engine.runRenderLoop(() => {
            scene.render();
        });

        // Watch for browser/canvas resize events
        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
