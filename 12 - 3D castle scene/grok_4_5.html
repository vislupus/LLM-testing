<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Island Castle Diorama</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #87b8d8;
      font-family: "Segoe UI", Georgia, serif;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }
    #hud {
      position: absolute;
      top: 18px;
      left: 18px;
      color: #2a2418;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 0 rgba(255,255,255,0.45);
    }
    #hud h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    #hud p {
      margin: 0;
      font-size: 13px;
      opacity: 0.85;
    }
    #badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(255, 248, 230, 0.82);
      border: 2px solid rgba(90, 70, 40, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: #4a3a22;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(40, 30, 10, 0.15);
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    <h1>Isle of Stonehaven</h1>
    <p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
  </div>
  <div id="badge">Handcrafted floating diorama · Babylon.js</div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: true,
        stencil: true,
        adaptToDeviceRatio: true
      });

      // Palette — vibrant stylized miniature
      const C = {
        grass: new BABYLON.Color3(0.38, 0.72, 0.32),
        grassDark: new BABYLON.Color3(0.28, 0.55, 0.24),
        grassLight: new BABYLON.Color3(0.52, 0.82, 0.38),
        dirt: new BABYLON.Color3(0.55, 0.4, 0.25),
        rock: new BABYLON.Color3(0.55, 0.52, 0.48),
        rockDark: new BABYLON.Color3(0.38, 0.36, 0.34),
        rockLight: new BABYLON.Color3(0.68, 0.66, 0.62),
        stone: new BABYLON.Color3(0.62, 0.6, 0.58),
        stoneDark: new BABYLON.Color3(0.45, 0.43, 0.42),
        stoneWarm: new BABYLON.Color3(0.7, 0.64, 0.55),
        wood: new BABYLON.Color3(0.48, 0.3, 0.16),
        woodDark: new BABYLON.Color3(0.32, 0.2, 0.1),
        woodLight: new BABYLON.Color3(0.62, 0.42, 0.24),
        roofRed: new BABYLON.Color3(0.78, 0.28, 0.22),
        roofBlue: new BABYLON.Color3(0.28, 0.42, 0.7),
        roofGreen: new BABYLON.Color3(0.3, 0.55, 0.38),
        roofThatch: new BABYLON.Color3(0.72, 0.58, 0.28),
        water: new BABYLON.Color3(0.15, 0.72, 0.72),
        waterDeep: new BABYLON.Color3(0.08, 0.5, 0.58),
        pine: new BABYLON.Color3(0.18, 0.42, 0.22),
        pineLight: new BABYLON.Color3(0.28, 0.55, 0.28),
        leaf: new BABYLON.Color3(0.35, 0.65, 0.28),
        flower: new BABYLON.Color3(0.9, 0.35, 0.55),
        flowerY: new BABYLON.Color3(0.95, 0.8, 0.2),
        plaster: new BABYLON.Color3(0.9, 0.84, 0.72),
        banner: new BABYLON.Color3(0.75, 0.18, 0.2),
        path: new BABYLON.Color3(0.72, 0.62, 0.42),
        moss: new BABYLON.Color3(0.32, 0.5, 0.28),
        cloud: new BABYLON.Color3(0.95, 0.96, 0.98),
        gold: new BABYLON.Color3(0.9, 0.72, 0.25)
      };

      function mat(scene, name, color, opts) {
        opts = opts || {};
        const m = new BABYLON.StandardMaterial(name, scene);
        m.diffuseColor = color.clone();
        m.specularColor = opts.specular || new BABYLON.Color3(0.12, 0.12, 0.12);
        m.specularPower = opts.power || 32;
        if (opts.emissive) m.emissiveColor = opts.emissive;
        if (opts.alpha != null) {
          m.alpha = opts.alpha;
          m.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
        }
        m.ambientColor = color.scale(0.35);
        return m;
      }

      function parent(mesh, p) {
        mesh.parent = p;
        return mesh;
      }

      function box(name, w, h, d, scene, material, parentNode, pos, rot) {
        const m = BABYLON.MeshBuilder.CreateBox(name, { width: w, height: h, depth: d }, scene);
        m.material = material;
        if (parentNode) m.parent = parentNode;
        if (pos) m.position.copyFrom(pos);
        if (rot) m.rotation.copyFrom(rot);
        return m;
      }

      function cyl(name, h, dTop, dBot, tess, scene, material, parentNode, pos, rot) {
        const m = BABYLON.MeshBuilder.CreateCylinder(name, {
          height: h,
          diameterTop: dTop,
          diameterBottom: dBot,
          tessellation: tess
        }, scene);
        m.material = material;
        if (parentNode) m.parent = parentNode;
        if (pos) m.position.copyFrom(pos);
        if (rot) m.rotation.copyFrom(rot);
        return m;
      }

      function sphere(name, d, segs, scene, material, parentNode, pos, scale) {
        const m = BABYLON.MeshBuilder.CreateSphere(name, { diameter: d, segments: segs }, scene);
        m.material = material;
        if (parentNode) m.parent = parentNode;
        if (pos) m.position.copyFrom(pos);
        if (scale) m.scaling.copyFrom(scale);
        return m;
      }

      function cone(name, h, d, tess, scene, material, parentNode, pos) {
        return cyl(name, h, 0.01, d, tess, scene, material, parentNode, pos);
      }

      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.55, 0.75, 0.92, 1);
      scene.ambientColor = new BABYLON.Color3(0.45, 0.48, 0.55);
      scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
      scene.fogDensity = 0.006;
      scene.fogColor = new BABYLON.Color3(0.62, 0.78, 0.92);

      // Camera — orbit around diorama
      const camera = new BABYLON.ArcRotateCamera(
        "cam",
        -0.95,
        1.15,
        48,
        new BABYLON.Vector3(0, 3, 0),
        scene
      );
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 18;
      camera.upperRadiusLimit = 90;
      camera.lowerBetaLimit = 0.25;
      camera.upperBetaLimit = Math.PI / 2.05;
      camera.wheelPrecision = 25;
      camera.panningSensibility = 80;
      camera.inertia = 0.88;
      camera.minZ = 0.1;

      // Soft cinematic lighting
      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.3, 1, 0.2), scene);
      hemi.intensity = 0.72;
      hemi.groundColor = new BABYLON.Color3(0.35, 0.4, 0.3);
      hemi.diffuse = new BABYLON.Color3(1, 0.97, 0.92);

      const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.55, -0.85, 0.35), scene);
      sun.position = new BABYLON.Vector3(30, 40, -20);
      sun.intensity = 0.95;
      sun.diffuse = new BABYLON.Color3(1, 0.96, 0.88);
      sun.specular = new BABYLON.Color3(1, 0.95, 0.85);

      const fill = new BABYLON.DirectionalLight("fill", new BABYLON.Vector3(0.6, -0.3, -0.5), scene);
      fill.intensity = 0.28;
      fill.diffuse = new BABYLON.Color3(0.7, 0.8, 1);

      const rim = new BABYLON.DirectionalLight("rim", new BABYLON.Vector3(0.2, 0.1, 0.9), scene);
      rim.intensity = 0.18;
      rim.diffuse = new BABYLON.Color3(0.9, 0.85, 1);

      // Soft shadow generator (if supported)
      try {
        const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
        shadowGen.useBlurExponentialShadowMap = true;
        shadowGen.blurKernel = 32;
        shadowGen.setDarkness(0.28);
        shadowGen.bias = 0.0005;
        scene._shadowGen = shadowGen;
      } catch (e) {
        scene._shadowGen = null;
      }

      function castReceive(mesh, cast, receive) {
        mesh.receiveShadows = !!receive;
        if (cast && scene._shadowGen) scene._shadowGen.addShadowCaster(mesh);
      }

      // Materials
      const mats = {
        grass: mat(scene, "grass", C.grass, { specular: new BABYLON.Color3(0.05, 0.08, 0.04) }),
        grassDark: mat(scene, "grassD", C.grassDark),
        grassLight: mat(scene, "grassL", C.grassLight),
        dirt: mat(scene, "dirt", C.dirt),
        rock: mat(scene, "rock", C.rock, { power: 16 }),
        rockDark: mat(scene, "rockD", C.rockDark),
        rockLight: mat(scene, "rockL", C.rockLight),
        stone: mat(scene, "stone", C.stone, { power: 24 }),
        stoneDark: mat(scene, "stoneD", C.stoneDark),
        stoneWarm: mat(scene, "stoneW", C.stoneWarm),
        wood: mat(scene, "wood", C.wood),
        woodDark: mat(scene, "woodD", C.woodDark),
        woodLight: mat(scene, "woodL", C.woodLight),
        roofRed: mat(scene, "roofR", C.roofRed),
        roofBlue: mat(scene, "roofB", C.roofBlue),
        roofGreen: mat(scene, "roofG", C.roofGreen),
        roofThatch: mat(scene, "roofT", C.roofThatch),
        water: mat(scene, "water", C.water, {
          specular: new BABYLON.Color3(0.7, 0.9, 0.9),
          power: 64,
          alpha: 0.82,
          emissive: new BABYLON.Color3(0.04, 0.15, 0.16)
        }),
        waterDeep: mat(scene, "waterD", C.waterDeep, {
          specular: new BABYLON.Color3(0.5, 0.7, 0.8),
          power: 48,
          alpha: 0.9,
          emissive: new BABYLON.Color3(0.02, 0.1, 0.12)
        }),
        foam: mat(scene, "foam", new BABYLON.Color3(0.85, 0.95, 0.95), {
          emissive: new BABYLON.Color3(0.25, 0.35, 0.35),
          alpha: 0.55
        }),
        pine: mat(scene, "pine", C.pine),
        pineLight: mat(scene, "pineL", C.pineLight),
        leaf: mat(scene, "leaf", C.leaf),
        plaster: mat(scene, "plaster", C.plaster),
        banner: mat(scene, "banner", C.banner),
        path: mat(scene, "path", C.path),
        moss: mat(scene, "moss", C.moss),
        cloud: mat(scene, "cloud", C.cloud, {
          emissive: new BABYLON.Color3(0.15, 0.16, 0.18),
          specular: new BABYLON.Color3(0, 0, 0)
        }),
        gold: mat(scene, "gold", C.gold, {
          specular: new BABYLON.Color3(0.9, 0.8, 0.4),
          power: 64,
          emissive: new BABYLON.Color3(0.15, 0.1, 0.02)
        }),
        flower: mat(scene, "flower", C.flower),
        flowerY: mat(scene, "flowerY", C.flowerY),
        window: mat(scene, "window", new BABYLON.Color3(0.35, 0.55, 0.7), {
          emissive: new BABYLON.Color3(0.25, 0.35, 0.2),
          specular: new BABYLON.Color3(0.5, 0.6, 0.7),
          power: 80
        }),
        dark: mat(scene, "dark", new BABYLON.Color3(0.18, 0.15, 0.12))
      };

      const root = new BABYLON.TransformNode("diorama", scene);

      // ========== FLOATING ISLAND ==========
      function createIsland() {
        const island = new BABYLON.TransformNode("island", scene);
        island.parent = root;

        // Main grassy plateau (flattened sphere / ellipsoid)
        const top = BABYLON.MeshBuilder.CreateCylinder("plateau", {
          height: 2.2,
          diameterTop: 28,
          diameterBottom: 30,
          tessellation: 48
        }, scene);
        top.position.y = 0;
        top.material = mats.grass;
        top.parent = island;
        castReceive(top, true, true);

        // Slightly raised center hill under castle
        const hill = BABYLON.MeshBuilder.CreateCylinder("hill", {
          height: 1.4,
          diameterTop: 12,
          diameterBottom: 16,
          tessellation: 32
        }, scene);
        hill.position.y = 1.4;
        hill.material = mats.grassLight;
        hill.parent = island;
        castReceive(hill, true, true);

        // Dirt under-edge ring
        const dirtRim = BABYLON.MeshBuilder.CreateTorus("dirtRim", {
          diameter: 28.5,
          thickness: 1.2,
          tessellation: 48
        }, scene);
        dirtRim.position.y = -0.3;
        dirtRim.scaling.y = 0.6;
        dirtRim.material = mats.dirt;
        dirtRim.parent = island;
        castReceive(dirtRim, true, true);

        // Rocky underside tapering to floating root
        const layers = [
          { y: -1.8, dT: 26, dB: 22, h: 2.2, m: mats.rockLight },
          { y: -3.8, dT: 20, dB: 15, h: 2.4, m: mats.rock },
          { y: -6.0, dT: 14, dB: 9, h: 2.6, m: mats.rockDark },
          { y: -8.2, dT: 8, dB: 4.5, h: 2.4, m: mats.rock },
          { y: -10.2, dT: 4, dB: 1.8, h: 2.2, m: mats.rockDark },
          { y: -11.8, dT: 1.6, dB: 0.4, h: 1.6, m: mats.rock }
        ];
        layers.forEach((L, i) => {
          const rock = cyl("rockL" + i, L.h, L.dT, L.dB, 28, scene, L.m, island,
            new BABYLON.Vector3(0, L.y, 0));
          castReceive(rock, true, true);
        });

        // Cliff outcrops / rocky ledges
        const cliffs = [
          { p: [11, 0.2, 6], s: [4, 3.5, 3.2], r: 0.3 },
          { p: [-10, 0.1, 8], s: [3.5, 4.2, 3], r: -0.4 },
          { p: [8, -0.2, -10], s: [4, 3, 3.5], r: 0.6 },
          { p: [-9, 0, -9], s: [3.2, 3.8, 3], r: 1.1 },
          { p: [13, -1, 0], s: [2.5, 5, 4], r: 0.2 },
          { p: [-12, -0.8, -2], s: [2.8, 4.5, 3.5], r: -0.5 },
          { p: [3, -0.5, 13], s: [5, 3.2, 2.5], r: 0.1 },
          { p: [-2, -0.3, -13], s: [4.5, 3.5, 2.8], r: 0.8 }
        ];
        cliffs.forEach((c, i) => {
          const cliff = BABYLON.MeshBuilder.CreatePolyhedron("cliff" + i, {
            type: 1,
            size: 1
          }, scene);
          cliff.position.set(c.p[0], c.p[1], c.p[2]);
          cliff.scaling.set(c.s[0], c.s[1], c.s[2]);
          cliff.rotation.y = c.r;
          cliff.material = i % 2 === 0 ? mats.rock : mats.rockDark;
          cliff.parent = island;
          castReceive(cliff, true, true);
        });

        // Extra boulder details
        for (let i = 0; i < 18; i++) {
          const a = (i / 18) * Math.PI * 2 + Math.random() * 0.3;
          const r = 10 + Math.random() * 5;
          const b = sphere("boulder" + i, 0.8 + Math.random() * 1.2, 6, scene,
            Math.random() > 0.5 ? mats.rock : mats.rockLight, island,
            new BABYLON.Vector3(Math.cos(a) * r, -0.2 - Math.random() * 2, Math.sin(a) * r),
            new BABYLON.Vector3(1 + Math.random(), 0.7 + Math.random() * 0.8, 1 + Math.random() * 0.6));
          castReceive(b, true, true);
        }

        // Moss patches
        for (let i = 0; i < 12; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = 6 + Math.random() * 8;
          const patch = sphere("moss" + i, 1.2 + Math.random(), 5, scene, mats.moss, island,
            new BABYLON.Vector3(Math.cos(a) * r, 0.9 + Math.random() * 0.3, Math.sin(a) * r),
            new BABYLON.Vector3(1.4, 0.25, 1.2));
          castReceive(patch, false, true);
        }

        // Floating rock shards below
        for (let i = 0; i < 10; i++) {
          const shard = BABYLON.MeshBuilder.CreatePolyhedron("shard" + i, { type: 2, size: 0.35 + Math.random() * 0.5 }, scene);
          shard.position.set(
            (Math.random() - 0.5) * 10,
            -8 - Math.random() * 8,
            (Math.random() - 0.5) * 10
          );
          shard.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
          shard.material = mats.rockDark;
          shard.parent = island;
          castReceive(shard, true, false);
        }

        return island;
      }

      // ========== CASTLE ==========
      function createCastle() {
        const castle = new BABYLON.TransformNode("castle", scene);
        castle.parent = root;
        castle.position.set(0, 2.1, 0);

        // Keep base / curtain wall courtyard
        const courtyard = box("courtyard", 9, 0.5, 9, scene, mats.stone, castle,
          new BABYLON.Vector3(0, 0.25, 0));
        castReceive(courtyard, true, true);

        // Outer walls
        const wallH = 2.4;
        const wallSpecs = [
          { p: [0, wallH / 2, 4.6], s: [9.5, wallH, 0.7] },
          { p: [0, wallH / 2, -4.6], s: [9.5, wallH, 0.7] },
          { p: [4.6, wallH / 2, 0], s: [0.7, wallH, 8.5] },
          { p: [-4.6, wallH / 2, 0], s: [0.7, wallH, 8.5] }
        ];
        wallSpecs.forEach((w, i) => {
          const wall = box("wall" + i, w.s[0], w.s[1], w.s[2], scene, mats.stone, castle,
            new BABYLON.Vector3(w.p[0], w.p[1], w.p[2]));
          castReceive(wall, true, true);
        });

        // Gate opening (dark) + arch frame
        const gate = box("gate", 2.2, 2.4, 0.8, scene, mats.dark, castle,
          new BABYLON.Vector3(0, 1.1, 4.6));
        castReceive(gate, true, true);
        const gateArch = cyl("gateArch", 0.7, 2.3, 2.3, 16, scene, mats.stoneWarm, castle,
          new BABYLON.Vector3(0, 2.35, 4.6), new BABYLON.Vector3(0, 0, Math.PI / 2));
        gateArch.scaling.z = 0.5;
        castReceive(gateArch, true, true);

        // Wooden gate doors
        box("doorL", 0.9, 1.8, 0.2, scene, mats.woodDark, castle, new BABYLON.Vector3(-0.5, 0.95, 4.95));
        box("doorR", 0.9, 1.8, 0.2, scene, mats.woodDark, castle, new BABYLON.Vector3(0.5, 0.95, 4.95));

        // Battlements (merlons)
        for (let side = 0; side < 4; side++) {
          for (let i = 0; i < 7; i++) {
            if (side === 0 && i >= 2 && i <= 4) continue; // gap over gate
            let x = 0, z = 0;
            const t = (i / 6) * 9 - 4.5;
            if (side === 0) { x = t; z = 4.6; }
            if (side === 1) { x = t; z = -4.6; }
            if (side === 2) { x = 4.6; z = t; }
            if (side === 3) { x = -4.6; z = t; }
            const merlon = box("merlon" + side + "_" + i, 0.7, 0.7, 0.7, scene, mats.stoneDark, castle,
              new BABYLON.Vector3(x, wallH + 0.35, z));
            castReceive(merlon, true, true);
          }
        }

        // Corner towers
        const corners = [[4.6, 4.6], [4.6, -4.6], [-4.6, 4.6], [-4.6, -4.6]];
        corners.forEach((c, i) => {
          const tower = cyl("ctower" + i, 4.2, 2.0, 2.2, 12, scene, mats.stone, castle,
            new BABYLON.Vector3(c[0], 2.1, c[1]));
          castReceive(tower, true, true);
          const top = cyl("ctop" + i, 0.5, 2.4, 2.4, 12, scene, mats.stoneDark, castle,
            new BABYLON.Vector3(c[0], 4.3, c[1]));
          castReceive(top, true, true);
          // Merlons on tower
          for (let m = 0; m < 6; m++) {
            const ang = (m / 6) * Math.PI * 2;
            const mer = box("tm" + i + m, 0.45, 0.55, 0.45, scene, mats.stone, castle,
              new BABYLON.Vector3(c[0] + Math.cos(ang) * 1.0, 4.8, c[1] + Math.sin(ang) * 1.0));
            castReceive(mer, true, true);
          }
          // Conical roof on two towers
          if (i < 2) {
            const roof = cone("troof" + i, 1.8, 2.6, 10, scene, mats.roofBlue, castle,
              new BABYLON.Vector3(c[0], 5.5, c[1]));
            castReceive(roof, true, true);
            const finial = sphere("fin" + i, 0.25, 6, scene, mats.gold, castle,
              new BABYLON.Vector3(c[0], 6.5, c[1]));
            castReceive(finial, true, false);
          }
        });

        // Keep (central main tower — largest)
        const keep = box("keep", 4.5, 6.5, 4.5, scene, mats.stoneWarm, castle,
          new BABYLON.Vector3(0, 3.5, -0.5));
        castReceive(keep, true, true);
        // Keep upper section
        const keepTop = box("keepTop", 3.6, 2.2, 3.6, scene, mats.stone, castle,
          new BABYLON.Vector3(0, 7.8, -0.5));
        castReceive(keepTop, true, true);
        // Keep roof
        const keepRoof = cone("keepRoof", 2.8, 5.2, 4, scene, mats.roofRed, castle,
          new BABYLON.Vector3(0, 10.2, -0.5));
        keepRoof.rotation.y = Math.PI / 4;
        castReceive(keepRoof, true, true);
        sphere("keepFin", 0.35, 6, scene, mats.gold, castle, new BABYLON.Vector3(0, 11.7, -0.5));

        // Keep battlements
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          box("kmer" + i, 0.55, 0.6, 0.55, scene, mats.stoneDark, castle,
            new BABYLON.Vector3(Math.cos(a) * 2.0, 9.1, -0.5 + Math.sin(a) * 2.0));
        }

        // Keep windows
        [[-1.2, 4, 2.3], [1.2, 4, 2.3], [0, 5.5, 2.3], [0, 3, 2.3],
         [-1.2, 6.5, 1.9], [1.2, 6.5, 1.9]].forEach((w, i) => {
          box("kwin" + i, 0.55, 0.8, 0.15, scene, mats.window, castle,
            new BABYLON.Vector3(w[0], w[1], w[2] - 0.5));
        });

        // Side hall
        const hall = box("hall", 6, 2.8, 3.2, scene, mats.stone, castle,
          new BABYLON.Vector3(0, 1.6, 1.5));
        castReceive(hall, true, true);
        // Hall roof (prism)
        const hallRoof = box("hallRoof", 6.4, 1.4, 3.6, scene, mats.roofRed, castle,
          new BABYLON.Vector3(0, 3.6, 1.5));
        hallRoof.scaling.y = 0.6;
        hallRoof.rotation.z = 0;
        // Use a wedge via scaled box rotation
        const roofL = box("hrL", 6.5, 0.25, 2.2, scene, mats.roofRed, castle,
          new BABYLON.Vector3(0, 3.5, 1.5));
        roofL.rotation.x = 0.55;
        roofL.position.z = 1.5 + 0.7;
        roofL.position.y = 3.3;
        const roofR = box("hrR", 6.5, 0.25, 2.2, scene, mats.roofRed, castle,
          new BABYLON.Vector3(0, 3.3, 1.5 - 0.7));
        roofR.rotation.x = -0.55;
        castReceive(roofL, true, true);
        castReceive(roofR, true, true);

        // Banners
        [[-2.5, 3.5, 5], [2.5, 3.5, 5]].forEach((b, i) => {
          const pole = cyl("pole" + i, 2.2, 0.08, 0.08, 6, scene, mats.woodDark, castle,
            new BABYLON.Vector3(b[0], b[1], b[2]));
          const flag = box("flag" + i, 0.9, 1.1, 0.05, scene, mats.banner, castle,
            new BABYLON.Vector3(b[0] + 0.5, b[1] + 0.4, b[2]));
          castReceive(pole, true, false);
          castReceive(flag, true, false);
        });

        // Stairs to keep
        for (let i = 0; i < 5; i++) {
          box("stair" + i, 2.2 - i * 0.1, 0.28, 0.55, scene, mats.stoneDark, castle,
            new BABYLON.Vector3(0, 0.4 + i * 0.28, 3.2 - i * 0.35));
        }

        // Inner courtyard path
        box("cpath", 2.5, 0.08, 5, scene, mats.path, castle, new BABYLON.Vector3(0, 0.52, 1));

        return castle;
      }

      // ========== HOUSE / BUILDING HELPERS ==========
      function createHouse(scene, parentNode, pos, opts) {
        opts = opts || {};
        const w = opts.w || 2.2;
        const d = opts.d || 1.8;
        const h = opts.h || 1.6;
        const roofMat = opts.roof || mats.roofRed;
        const bodyMat = opts.body || mats.plaster;
        const rotY = opts.rotY || 0;

        const house = new BABYLON.TransformNode("house", scene);
        house.parent = parentNode;
        house.position.copyFrom(pos);
        house.rotation.y = rotY;

        const body = box("body", w, h, d, scene, bodyMat, house, new BABYLON.Vector3(0, h / 2, 0));
        castReceive(body, true, true);

        // Timber frame accents
        box("beamH", w + 0.05, 0.12, d + 0.05, scene, mats.woodDark, house, new BABYLON.Vector3(0, h * 0.55, 0));
        box("beamV1", 0.12, h, 0.12, scene, mats.woodDark, house, new BABYLON.Vector3(-w * 0.35, h / 2, d / 2 + 0.02));
        box("beamV2", 0.12, h, 0.12, scene, mats.woodDark, house, new BABYLON.Vector3(w * 0.35, h / 2, d / 2 + 0.02));

        // Roof — two slabs
        const roofH = opts.roofH || 1.1;
        const r1 = box("r1", w + 0.35, 0.15, d * 0.75, scene, roofMat, house,
          new BABYLON.Vector3(0, h + roofH * 0.35, d * 0.18));
        r1.rotation.x = 0.65;
        const r2 = box("r2", w + 0.35, 0.15, d * 0.75, scene, roofMat, house,
          new BABYLON.Vector3(0, h + roofH * 0.35, -d * 0.18));
        r2.rotation.x = -0.65;
        castReceive(r1, true, true);
        castReceive(r2, true, true);

        // Chimney
        if (opts.chimney !== false) {
          const ch = box("chim", 0.4, 1.0, 0.4, scene, mats.stoneDark, house,
            new BABYLON.Vector3(w * 0.3, h + 0.9, -d * 0.15));
          castReceive(ch, true, true);
        }

        // Door
        box("door", 0.45, 0.75, 0.08, scene, mats.wood, house,
          new BABYLON.Vector3(opts.doorX || 0, 0.4, d / 2 + 0.02));

        // Windows
        box("win1", 0.35, 0.35, 0.06, scene, mats.window, house,
          new BABYLON.Vector3(-w * 0.28, h * 0.55, d / 2 + 0.02));
        box("win2", 0.35, 0.35, 0.06, scene, mats.window, house,
          new BABYLON.Vector3(w * 0.28, h * 0.55, d / 2 + 0.02));

        return house;
      }

      function createTavern(scene, parentNode, pos) {
        const t = new BABYLON.TransformNode("tavern", scene);
        t.parent = parentNode;
        t.position.copyFrom(pos);

        // Larger body
        const body = box("tbody", 3.6, 2.2, 2.6, scene, mats.plaster, t, new BABYLON.Vector3(0, 1.1, 0));
        castReceive(body, true, true);
        // Upper timber story
        const upper = box("tupper", 3.7, 1.3, 2.7, scene, mats.woodLight, t, new BABYLON.Vector3(0, 2.7, 0));
        castReceive(upper, true, true);

        // Roof
        const r1 = box("tr1", 4.1, 0.18, 2.0, scene, mats.roofThatch, t, new BABYLON.Vector3(0, 3.7, 0.55));
        r1.rotation.x = 0.55;
        const r2 = box("tr2", 4.1, 0.18, 2.0, scene, mats.roofThatch, t, new BABYLON.Vector3(0, 3.7, -0.55));
        r2.rotation.x = -0.55;
        castReceive(r1, true, true);
        castReceive(r2, true, true);

        // Sign post
        cyl("signPole", 2.4, 0.1, 0.1, 6, scene, mats.woodDark, t, new BABYLON.Vector3(2.2, 1.2, 1.5));
        const sign = box("sign", 1.1, 0.7, 0.08, scene, mats.wood, t, new BABYLON.Vector3(2.2, 2.2, 1.5));
        // Barrel outside
        cyl("barrel1", 0.7, 0.55, 0.55, 10, scene, mats.wood, t, new BABYLON.Vector3(-1.6, 0.35, 1.5));
        cyl("barrel2", 0.55, 0.45, 0.45, 10, scene, mats.woodDark, t, new BABYLON.Vector3(-1.0, 0.28, 1.55));

        // Door + windows
        box("tdoor", 0.7, 1.2, 0.1, scene, mats.woodDark, t, new BABYLON.Vector3(0, 0.65, 1.35));
        box("twin1", 0.5, 0.5, 0.08, scene, mats.window, t, new BABYLON.Vector3(-1.1, 1.3, 1.35));
        box("twin2", 0.5, 0.5, 0.08, scene, mats.window, t, new BABYLON.Vector3(1.1, 1.3, 1.35));
        box("twin3", 0.4, 0.4, 0.08, scene, mats.window, t, new BABYLON.Vector3(-0.8, 2.7, 1.4));
        box("twin4", 0.4, 0.4, 0.08, scene, mats.window, t, new BABYLON.Vector3(0.8, 2.7, 1.4));

        // Warm glow light from tavern
        const glow = new BABYLON.PointLight("tavernGlow", new BABYLON.Vector3(0, 1.2, 1.6), scene);
        glow.parent = t;
        glow.diffuse = new BABYLON.Color3(1, 0.7, 0.35);
        glow.intensity = 0.45;
        glow.range = 8;

        return t;
      }

      function createMarketStall(scene, parentNode, pos, rotY, clothColor) {
        const stall = new BABYLON.TransformNode("stall", scene);
        stall.parent = parentNode;
        stall.position.copyFrom(pos);
        stall.rotation.y = rotY || 0;

        // Counter
        box("counter", 1.6, 0.7, 0.9, scene, mats.wood, stall, new BABYLON.Vector3(0, 0.35, 0));
        // Posts
        [[-0.7, 0.7], [0.7, 0.7], [-0.7, -0.35], [0.7, -0.35]].forEach((p, i) => {
          cyl("sp" + i, 1.5, 0.08, 0.08, 6, scene, mats.woodDark, stall,
            new BABYLON.Vector3(p[0], 0.75, p[1]));
        });
        // Awning
        const cloth = mat(scene, "cloth" + Math.random(), clothColor || C.roofRed);
        const awning = box("awning", 1.8, 0.08, 1.3, scene, cloth, stall, new BABYLON.Vector3(0, 1.55, 0.15));
        awning.rotation.x = -0.15;
        // Goods
        sphere("g1", 0.25, 5, scene, mats.flowerY, stall, new BABYLON.Vector3(-0.35, 0.85, 0.1));
        sphere("g2", 0.22, 5, scene, mats.flower, stall, new BABYLON.Vector3(0.1, 0.82, 0.15));
        box("crate", 0.4, 0.3, 0.35, scene, mats.woodLight, stall, new BABYLON.Vector3(0.45, 0.85, 0));

        return stall;
      }

      function createMill(scene, parentNode, pos) {
        const mill = new BABYLON.TransformNode("mill", scene);
        mill.parent = parentNode;
        mill.position.copyFrom(pos);

        // Building
        const body = box("mbody", 2.4, 2.4, 2.4, scene, mats.stoneWarm, mill, new BABYLON.Vector3(0, 1.2, 0));
        castReceive(body, true, true);
        const r1 = box("mr1", 2.8, 0.15, 1.7, scene, mats.roofGreen, mill, new BABYLON.Vector3(0, 2.8, 0.45));
        r1.rotation.x = 0.6;
        const r2 = box("mr2", 2.8, 0.15, 1.7, scene, mats.roofGreen, mill, new BABYLON.Vector3(0, 2.8, -0.45));
        r2.rotation.x = -0.6;

        // Water wheel
        const wheel = new BABYLON.TransformNode("wheel", scene);
        wheel.parent = mill;
        wheel.position.set(1.5, 1.1, 0);

        const hub = cyl("hub", 0.3, 0.35, 0.35, 10, scene, mats.woodDark, wheel,
          new BABYLON.Vector3(0, 0, 0), new BABYLON.Vector3(0, 0, Math.PI / 2));
        const rim = BABYLON.MeshBuilder.CreateTorus("rim", {
          diameter: 2.2,
          thickness: 0.15,
          tessellation: 20
        }, scene);
        rim.rotation.y = Math.PI / 2;
        rim.material = mats.wood;
        rim.parent = wheel;

        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          const blade = box("blade" + i, 0.12, 1.0, 0.35, scene, mats.woodLight, wheel,
            new BABYLON.Vector3(0, Math.sin(a) * 0.7, Math.cos(a) * 0.7));
          blade.rotation.x = a;
        }

        // Axle into building
        cyl("axle", 1.2, 0.12, 0.12, 6, scene, mats.woodDark, mill,
          new BABYLON.Vector3(0.9, 1.1, 0), new BABYLON.Vector3(0, 0, Math.PI / 2));

        // Door / window
        box("mdoor", 0.5, 0.9, 0.08, scene, mats.woodDark, mill, new BABYLON.Vector3(-0.5, 0.5, 1.25));
        box("mwin", 0.4, 0.4, 0.08, scene, mats.window, mill, new BABYLON.Vector3(0.5, 1.4, 1.25));

        mill._wheel = wheel;
        return mill;
      }

      function createBridge(scene, parentNode, pos, length, rotY) {
        const bridge = new BABYLON.TransformNode("bridge", scene);
        bridge.parent = parentNode;
        bridge.position.copyFrom(pos);
        bridge.rotation.y = rotY || 0;

        // Planks
        box("deck", length, 0.15, 1.4, scene, mats.wood, bridge, new BABYLON.Vector3(0, 0.4, 0));
        // Rails
        box("railL", length, 0.12, 0.1, scene, mats.woodDark, bridge, new BABYLON.Vector3(0, 0.85, 0.65));
        box("railR", length, 0.12, 0.1, scene, mats.woodDark, bridge, new BABYLON.Vector3(0, 0.85, -0.65));
        const posts = Math.floor(length);
        for (let i = 0; i <= posts; i++) {
          const x = -length / 2 + i * (length / posts);
          cyl("bpL" + i, 0.55, 0.08, 0.08, 5, scene, mats.woodDark, bridge, new BABYLON.Vector3(x, 0.65, 0.65));
          cyl("bpR" + i, 0.55, 0.08, 0.08, 5, scene, mats.woodDark, bridge, new BABYLON.Vector3(x, 0.65, -0.65));
        }
        // Support posts into water
        cyl("sup1", 1.2, 0.15, 0.18, 6, scene, mats.woodDark, bridge, new BABYLON.Vector3(-length * 0.3, -0.1, 0.4));
        cyl("sup2", 1.2, 0.15, 0.18, 6, scene, mats.woodDark, bridge, new BABYLON.Vector3(length * 0.3, -0.1, -0.4));

        return bridge;
      }

      function createWatchtowerRuin(scene, parentNode, pos) {
        const ruin = new BABYLON.TransformNode("ruin", scene);
        ruin.parent = parentNode;
        ruin.position.copyFrom(pos);

        // Broken tower cylinder
        const base = cyl("rbase", 3.5, 2.0, 2.4, 10, scene, mats.stoneDark, ruin, new BABYLON.Vector3(0, 1.5, 0));
        castReceive(base, true, true);

        // Crumbled top (jagged boxes)
        const bits = [
          [0.6, 3.5, 0.3, 0.8, 1.2, 0.7],
          [-0.5, 3.6, -0.4, 0.7, 1.0, 0.6],
          [0.2, 3.8, -0.7, 0.5, 0.7, 0.5],
          [-0.7, 3.3, 0.5, 0.6, 0.5, 0.6]
        ];
        bits.forEach((b, i) => {
          const piece = box("rbit" + i, b[3], b[4], b[5], scene, i % 2 ? mats.stone : mats.rock, ruin,
            new BABYLON.Vector3(b[0], b[1], b[2]));
          piece.rotation.z = (Math.random() - 0.5) * 0.4;
          piece.rotation.x = (Math.random() - 0.5) * 0.3;
          castReceive(piece, true, true);
        });

        // Fallen rubble
        for (let i = 0; i < 8; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = 1.5 + Math.random() * 1.5;
          const rub = box("rub" + i, 0.4 + Math.random() * 0.5, 0.25 + Math.random() * 0.3, 0.35 + Math.random() * 0.4,
            scene, mats.rock, ruin,
            new BABYLON.Vector3(Math.cos(a) * r, 0.15, Math.sin(a) * r));
          rub.rotation.y = Math.random() * 2;
          castReceive(rub, true, true);
        }

        // Ivy / moss
        sphere("ivy1", 1.2, 5, scene, mats.moss, ruin, new BABYLON.Vector3(0.9, 1.5, 0.5),
          new BABYLON.Vector3(0.6, 1.4, 0.5));
        sphere("ivy2", 1.0, 5, scene, mats.grassDark, ruin, new BABYLON.Vector3(-0.8, 2.2, -0.4),
          new BABYLON.Vector3(0.5, 1.2, 0.5));

        // Broken arch remnant
        const arch = cyl("arch", 0.5, 1.8, 1.8, 12, scene, mats.stone, ruin,
          new BABYLON.Vector3(1.8, 1.2, 0), new BABYLON.Vector3(0, 0, Math.PI / 2));
        arch.scaling.z = 0.35;
        castReceive(arch, true, true);

        return ruin;
      }

      // ========== TREES ==========
      function createPine(scene, parentNode, pos, scale) {
        scale = scale || 1;
        const tree = new BABYLON.TransformNode("pine", scene);
        tree.parent = parentNode;
        tree.position.copyFrom(pos);
        tree.scaling.setAll(scale);

        const trunk = cyl("trunk", 1.6, 0.22, 0.32, 7, scene, mats.woodDark, tree,
          new BABYLON.Vector3(0, 0.8, 0));
        castReceive(trunk, true, true);

        const layers = [
          { y: 1.6, d: 1.8, h: 1.3 },
          { y: 2.4, d: 1.4, h: 1.2 },
          { y: 3.15, d: 1.0, h: 1.1 },
          { y: 3.8, d: 0.55, h: 0.8 }
        ];
        layers.forEach((L, i) => {
          const foliage = cone("fol" + i, L.h, L.d, 8, scene, i % 2 ? mats.pineLight : mats.pine, tree,
            new BABYLON.Vector3(0, L.y, 0));
          castReceive(foliage, true, true);
        });
        return tree;
      }

      function createDeciduous(scene, parentNode, pos, scale) {
        scale = scale || 1;
        const tree = new BABYLON.TransformNode("tree", scene);
        tree.parent = parentNode;
        tree.position.copyFrom(pos);
        tree.scaling.setAll(scale);

        const trunk = cyl("dtrunk", 1.4, 0.2, 0.28, 7, scene, mats.wood, tree,
          new BABYLON.Vector3(0, 0.7, 0));
        castReceive(trunk, true, true);

        const canopy = sphere("canopy", 2.0, 7, scene, mats.leaf, tree,
          new BABYLON.Vector3(0, 2.1, 0), new BABYLON.Vector3(1.1, 0.9, 1.0));
        castReceive(canopy, true, true);
        sphere("can2", 1.4, 6, scene, mats.grassLight, tree, new BABYLON.Vector3(0.5, 2.0, 0.3));
        sphere("can3", 1.2, 6, scene, mats.pineLight, tree, new BABYLON.Vector3(-0.4, 2.2, -0.3));
        return tree;
      }

      // ========== RIVER & WATERFALLS ==========
      function createRiver(scene, parentNode) {
        const river = new BABYLON.TransformNode("river", scene);
        river.parent = parentNode;

        // Curving river approximated with segments
        const segments = [
          { p: [6, 0.95, 12], s: [4, 0.15, 3], r: 0.2 },
          { p: [4, 0.95, 8], s: [3.2, 0.15, 4], r: 0.5 },
          { p: [1.5, 0.95, 4], s: [2.8, 0.15, 4.5], r: 0.35 },
          { p: [-1, 0.95, 0], s: [2.6, 0.15, 4], r: 0.1 },
          { p: [-2.5, 0.95, -4], s: [2.8, 0.15, 4], r: -0.25 },
          { p: [-5, 0.95, -8], s: [3.2, 0.15, 4], r: -0.4 },
          { p: [-8, 0.95, -11], s: [4, 0.15, 3.5], r: -0.15 }
        ];

        segments.forEach((s, i) => {
          const water = box("water" + i, s.s[0], s.s[1], s.s[2], scene,
            i % 2 ? mats.water : mats.waterDeep, river,
            new BABYLON.Vector3(s.p[0], s.p[1], s.p[2]));
          water.rotation.y = s.r;
          water.receiveShadows = true;
        });

        // River banks (dirt strips)
        segments.forEach((s, i) => {
          const bank = box("bank" + i, s.s[0] + 1.2, 0.2, s.s[2] + 0.8, scene, mats.dirt, river,
            new BABYLON.Vector3(s.p[0], s.p[1] - 0.12, s.p[2]));
          bank.rotation.y = s.r;
          castReceive(bank, true, true);
        });

        // Waterfalls off cliffs
        createWaterfall(scene, river, new BABYLON.Vector3(8, 0.5, 13.5), 0.3);
        createWaterfall(scene, river, new BABYLON.Vector3(-10, 0.3, -12.5), -0.5);

        // Foam patches
        for (let i = 0; i < 8; i++) {
          const foam = sphere("foam" + i, 0.6 + Math.random() * 0.4, 5, scene, mats.foam, river,
            new BABYLON.Vector3(
              4 - i * 1.5 + Math.random(),
              1.05,
              10 - i * 2.8 + (Math.random() - 0.5)
            ),
            new BABYLON.Vector3(1.5, 0.15, 1.0));
        }

        return river;
      }

      function createWaterfall(scene, parentNode, pos, rotY) {
        const wf = new BABYLON.TransformNode("waterfall", scene);
        wf.parent = parentNode;
        wf.position.copyFrom(pos);
        wf.rotation.y = rotY || 0;

        // Falling water sheets
        for (let i = 0; i < 4; i++) {
          const sheet = box("sheet" + i, 1.4 - i * 0.1, 2.5, 0.25, scene, mats.water, wf,
            new BABYLON.Vector3((Math.random() - 0.5) * 0.3, -1.2 - i * 0.15, i * 0.15));
          sheet.material = mats.water;
        }
        // Mist at bottom
        const mist = sphere("mist", 2.2, 6, scene, mats.foam, wf,
          new BABYLON.Vector3(0, -3.2, 0.5), new BABYLON.Vector3(1.2, 0.5, 1.0));

        // Pool below
        const pool = cyl("pool", 0.3, 3.5, 3.5, 16, scene, mats.waterDeep, wf,
          new BABYLON.Vector3(0, -3.5, 0.8));
        pool.receiveShadows = true;

        // Splash particles (simple spheres animated later)
        wf._splashes = [];
        for (let i = 0; i < 12; i++) {
          const drop = sphere("drop" + i, 0.12 + Math.random() * 0.1, 4, scene, mats.foam, wf,
            new BABYLON.Vector3((Math.random() - 0.5) * 1.2, -Math.random() * 3, Math.random() * 0.5));
          wf._splashes.push({
            mesh: drop,
            speed: 1.5 + Math.random() * 2,
            offset: Math.random() * Math.PI * 2,
            x: (Math.random() - 0.5) * 1.2
          });
        }
        return wf;
      }

      // ========== PATHS & DETAILS ==========
      function createPaths(scene, parentNode) {
        const paths = new BABYLON.TransformNode("paths", scene);
        paths.parent = parentNode;

        // Path from village to castle gate
        const pathPts = [
          [0, 1.05, 8],
          [0, 1.05, 10],
          [2, 1.05, 11],
          [5, 1.05, 9],
          [7, 1.05, 5],
          [8, 1.05, 1]
        ];
        pathPts.forEach((p, i) => {
          const stone = box("path" + i, 1.4, 0.08, 1.6, scene, mats.path, paths,
            new BABYLON.Vector3(p[0], p[1], p[2]));
          stone.rotation.y = i * 0.15;
          castReceive(stone, false, true);
        });

        // Village square
        const square = cyl("square", 0.1, 5, 5, 16, scene, mats.path, paths,
          new BABYLON.Vector3(7.5, 1.02, 3));
        castReceive(square, false, true);

        // Well in square
        const well = cyl("well", 0.7, 1.1, 1.2, 12, scene, mats.stone, paths,
          new BABYLON.Vector3(7.5, 1.35, 3));
        castReceive(well, true, true);
        cyl("wellInner", 0.5, 0.7, 0.7, 10, scene, mats.dark, paths, new BABYLON.Vector3(7.5, 1.5, 3));
        // Well roof
        cyl("wellPost1", 1.3, 0.08, 0.08, 5, scene, mats.woodDark, paths, new BABYLON.Vector3(7.0, 2.0, 3));
        cyl("wellPost2", 1.3, 0.08, 0.08, 5, scene, mats.woodDark, paths, new BABYLON.Vector3(8.0, 2.0, 3));
        box("wellBeam", 1.3, 0.1, 0.1, scene, mats.wood, paths, new BABYLON.Vector3(7.5, 2.65, 3));
        const wellRoof = cone("wellRoof", 0.6, 1.6, 4, scene, mats.roofRed, paths,
          new BABYLON.Vector3(7.5, 3.0, 3));
        wellRoof.rotation.y = Math.PI / 4;

        return paths;
      }

      function createFlowers(scene, parentNode) {
        const group = new BABYLON.TransformNode("flowers", scene);
        group.parent = parentNode;
        for (let i = 0; i < 40; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = 4 + Math.random() * 11;
          // Avoid river-ish center strip roughly
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (Math.abs(x + z * 0.4) < 1.5 && Math.abs(z) < 10) continue;
          const stem = cyl("stem" + i, 0.25, 0.04, 0.04, 4, scene, mats.grassDark, group,
            new BABYLON.Vector3(x, 1.15, z));
          const blossom = sphere("bl" + i, 0.18, 4, scene,
            Math.random() > 0.5 ? mats.flower : mats.flowerY, group,
            new BABYLON.Vector3(x, 1.3, z));
        }
      }

      function createClouds(scene) {
        const clouds = new BABYLON.TransformNode("clouds", scene);
        const positions = [
          [-18, 14, -10], [20, 16, 8], [-8, 18, 16], [12, 15, -18],
          [-22, 12, 5], [5, 17, 22], [-15, 13, -20]
        ];
        positions.forEach((p, i) => {
          const cloud = new BABYLON.TransformNode("cloud" + i, scene);
          cloud.parent = clouds;
          cloud.position.set(p[0], p[1], p[2]);
          for (let j = 0; j < 5; j++) {
            const puff = sphere("puff" + i + j, 2 + Math.random() * 2, 6, scene, mats.cloud, cloud,
              new BABYLON.Vector3((j - 2) * 1.3 + Math.random(), Math.random() * 0.8, (Math.random() - 0.5) * 1.5),
              new BABYLON.Vector3(1.2 + Math.random() * 0.5, 0.7 + Math.random() * 0.3, 1 + Math.random() * 0.4));
          }
          cloud._drift = 0.15 + Math.random() * 0.2;
          cloud._baseX = p[0];
        });
        return clouds;
      }

      function createSkyDome(scene) {
        const dome = BABYLON.MeshBuilder.CreateSphere("sky", { diameter: 280, segments: 16 }, scene);
        const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
        skyMat.diffuseColor = new BABYLON.Color3(0.45, 0.7, 0.95);
        skyMat.emissiveColor = new BABYLON.Color3(0.35, 0.55, 0.8);
        skyMat.specularColor = BABYLON.Color3.Black();
        skyMat.backFaceCulling = false;
        skyMat.disableLighting = true;
        dome.material = skyMat;
        dome.infiniteDistance = true;

        // Soft ground fog plane far below
        const voidPlane = BABYLON.MeshBuilder.CreateDisc("void", { radius: 80, tessellation: 32 }, scene);
        voidPlane.rotation.x = Math.PI / 2;
        voidPlane.position.y = -22;
        const voidMat = mat(scene, "void", new BABYLON.Color3(0.55, 0.72, 0.88), {
          emissive: new BABYLON.Color3(0.2, 0.3, 0.4),
          alpha: 0.35,
          specular: BABYLON.Color3.Black()
        });
        voidPlane.material = voidMat;
      }

      // ========== ASSEMBLE SCENE ==========
      createSkyDome(scene);
      createIsland();
      createCastle();
      createRiver(scene, root);

      // Village cluster
      const village = new BABYLON.TransformNode("village", scene);
      village.parent = root;

      createHouse(scene, village, new BABYLON.Vector3(9, 1.05, 5), { w: 2.0, d: 1.7, roof: mats.roofRed, rotY: -0.4 });
      createHouse(scene, village, new BABYLON.Vector3(11, 1.05, 2.5), { w: 1.8, d: 1.6, roof: mats.roofBlue, rotY: 0.3 });
      createHouse(scene, village, new BABYLON.Vector3(10.5, 1.05, -0.5), { w: 2.3, d: 1.9, roof: mats.roofThatch, rotY: 0.1, h: 1.5 });
      createHouse(scene, village, new BABYLON.Vector3(6.5, 1.05, -1.5), { w: 1.9, d: 1.6, roof: mats.roofGreen, rotY: -0.6 });
      createHouse(scene, village, new BABYLON.Vector3(5.5, 1.05, 6.5), { w: 2.1, d: 1.7, roof: mats.roofRed, rotY: 0.5, body: mats.plaster });
      createHouse(scene, village, new BABYLON.Vector3(12.5, 1.0, 5.5), { w: 1.7, d: 1.5, roof: mats.roofBlue, rotY: -0.2, h: 1.4 });

      createTavern(scene, village, new BABYLON.Vector3(8.5, 1.05, -4));

      createMarketStall(scene, village, new BABYLON.Vector3(6.2, 1.05, 2.2), 0.4, C.roofRed);
      createMarketStall(scene, village, new BABYLON.Vector3(8.8, 1.05, 1.5), -0.3, C.roofBlue);
      createMarketStall(scene, village, new BABYLON.Vector3(7.2, 1.05, 4.5), 0.8, C.roofThatch);

      const mill = createMill(scene, village, new BABYLON.Vector3(-3.5, 1.0, 2.5));
      mill.rotation.y = 0.4;

      createBridge(scene, root, new BABYLON.Vector3(2.5, 0.7, 5.5), 4.5, 0.6);
      createBridge(scene, root, new BABYLON.Vector3(-3.5, 0.7, -5), 4.0, -0.5);

      createWatchtowerRuin(scene, root, new BABYLON.Vector3(-11, 1.0, 8));

      createPaths(scene, root);

      // Trees
      const treeGroup = new BABYLON.TransformNode("trees", scene);
      treeGroup.parent = root;
      const pineSpots = [
        [12, 1.0, -8], [10, 1.0, -10], [13, 1.0, -5],
        [-8, 1.0, 10], [-11, 1.0, 5], [-6, 1.0, 12],
        [-12, 1.0, -4], [-10, 1.0, -7], [4, 1.0, -12],
        [7, 1.0, -11], [-4, 1.0, -12], [14, 0.9, 2],
        [-13, 0.9, 1], [1, 1.0, 13], [-14, 0.85, -8]
      ];
      pineSpots.forEach((p, i) => {
        createPine(scene, treeGroup, new BABYLON.Vector3(p[0], p[1], p[2]), 0.75 + Math.random() * 0.45);
      });
      [[9, 1.0, 8], [3, 1.05, 9], [-7, 1.0, -2], [11, 1.0, -3], [-5, 1.0, 7]].forEach((p) => {
        createDeciduous(scene, treeGroup, new BABYLON.Vector3(p[0], p[1], p[2]), 0.7 + Math.random() * 0.35);
      });

      createFlowers(scene, root);
      const clouds = createClouds(scene);

      // Subtle platform base shadow disc under island
      const baseShadow = BABYLON.MeshBuilder.CreateDisc("baseShadow", { radius: 16, tessellation: 32 }, scene);
      baseShadow.rotation.x = Math.PI / 2;
      baseShadow.position.y = -14;
      const bsMat = mat(scene, "bs", new BABYLON.Color3(0.2, 0.25, 0.35), {
        alpha: 0.2,
        emissive: new BABYLON.Color3(0.05, 0.08, 0.12),
        specular: BABYLON.Color3.Black()
      });
      baseShadow.material = bsMat;

      // Gentle camera auto-orbit when idle
      let userInteracting = false;
      let idleTimer = 0;
      scene.onPointerObservable.add((pi) => {
        if (pi.type === BABYLON.PointerEventTypes.POINTERDOWN) {
          userInteracting = true;
          idleTimer = 0;
        }
        if (pi.type === BABYLON.PointerEventTypes.POINTERUP) {
          userInteracting = false;
        }
      });
      canvas.addEventListener("wheel", () => { idleTimer = 0; }, { passive: true });

      // Collect waterfall splash refs
      const waterfalls = [];
      scene.transformNodes.forEach((n) => {
        if (n.name === "waterfall" && n._splashes) waterfalls.push(n);
      });

      let t = 0;
      scene.onBeforeRenderObservable.add(() => {
        const dt = engine.getDeltaTime() / 1000;
        t += dt;

        // Water wheel spin
        if (mill && mill._wheel) {
          mill._wheel.rotation.x += dt * 1.2;
        }

        // Animate waterfall droplets
        waterfalls.forEach((wf) => {
          wf._splashes.forEach((s) => {
            const y = -((t * s.speed + s.offset) % 3.5);
            s.mesh.position.y = y;
            s.mesh.position.x = s.x + Math.sin(t * 3 + s.offset) * 0.1;
            s.mesh.scaling.setAll(0.6 + (1 + y / 3.5) * 0.5);
          });
        });

        // Cloud drift
        clouds.getChildren().forEach((c) => {
          if (c._drift != null) {
            c.position.x = c._baseX + Math.sin(t * c._drift + c._baseX) * 3;
            c.position.z += Math.sin(t * 0.05 + c._baseX) * 0.002;
          }
        });

        // Soft water shimmer via emissive pulse
        const shimmer = 0.04 + Math.sin(t * 2.5) * 0.02;
        mats.water.emissiveColor.set(0.04, 0.12 + shimmer, 0.14 + shimmer);
        mats.waterDeep.emissiveColor.set(0.02, 0.08 + shimmer * 0.5, 0.1 + shimmer * 0.5);

        // Auto orbit when idle
        if (!userInteracting) {
          idleTimer += dt;
          if (idleTimer > 1.5) {
            camera.alpha += dt * 0.08;
          }
        }

        // Floating bob of island (subtle miniature feel)
        root.position.y = Math.sin(t * 0.6) * 0.15;
        root.rotation.y = Math.sin(t * 0.15) * 0.01;
      });

      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
    })();
  </script>
</body>
</html>
