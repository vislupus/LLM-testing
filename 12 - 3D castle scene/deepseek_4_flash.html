<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Floating Island Diorama — Babylon.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .info {
            position: absolute;
            bottom: 18px;
            left: 18px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 10;
        }
        .info a {
            color: #b5e8ff;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">🏰 Floating Island Miniature — drag to orbit</div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const engine = new BABYLON.Engine(canvas, true);

            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.68, 0.85, 0.98);

            // ---------- Camera ----------
            const camera = new BABYLON.ArcRotateCamera('camera', -0.9, 1.15, 45, new BABYLON.Vector3(0, -1, 0), scene);
            camera.lowerRadiusLimit = 15;
            camera.upperRadiusLimit = 60;
            camera.wheelPrecision = 2;
            camera.attachControl(canvas, true);

            // ---------- Lighting ----------
            const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.2, 1, 0.2), scene);
            hemi.intensity = 0.6;
            hemi.diffuse = new BABYLON.Color3(1.1, 1.08, 0.95);
            hemi.specular = new BABYLON.Color3(0.2, 0.2, 0.2);

            const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.6, -0.75, -0.45), scene);
            sun.position = new BABYLON.Vector3(15, 25, 12);
            sun.diffuse = new BABYLON.Color3(1.05, 0.9, 0.7);
            sun.intensity = 0.8;

            const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
            shadowGen.useBlurExponentialShadowMap = true;
            shadowGen.blurKernel = 16;

            // ================================
            //          ISLAND BASE
            // ================================
            function buildIsland() {
                // grassy top
                const grass = BABYLON.MeshBuilder.CreateCylinder('grassTop', {
                    height: 1.6,
                    diameterTop: 21,
                    diameterBottom: 21,
                    tessellation: 64,
                    cap: 3
                }, scene);
                grass.position.y = 0.8;
                const grassMat = new BABYLON.StandardMaterial('grassMat', scene);
                grassMat.diffuseColor = new BABYLON.Color3(0.35, 0.55, 0.23);
                grassMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                grassMat.specularPower = 16;
                grass.material = grassMat;
                grass.receiveShadows = true;
                shadowGen.addShadowCaster(grass, true);

                // rock base
                const rockBase = BABYLON.MeshBuilder.CreateCylinder('rockBase', {
                    height: 9,
                    diameterTop: 19,
                    diameterBottom: 13,
                    tessellation: 64,
                    cap: 3
                }, scene);
                rockBase.position.y = 0.8 - 9 / 2 - 0.2;
                const rockMat = new BABYLON.StandardMaterial('rockMat', scene);
                rockMat.diffuseColor = new BABYLON.Color3(0.48, 0.42, 0.35);
                rockMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                rockMat.specularPower = 8;
                rockBase.material = rockMat;
                rockBase.receiveShadows = true;

                // jagged rocks around edges
                const edgeRockMat = new BABYLON.StandardMaterial('edgeRockMat', scene);
                edgeRockMat.diffuseColor = new BABYLON.Color3(0.56, 0.46, 0.38);
                edgeRockMat.specularColor = BABYLON.Color3.Black();

                const positions = [
                    [-9, 0.8, -7], [8.5, 0.9, 6], [-7, 0.7, 8], [11, 0.8, -2],
                    [6, 0.9, -11], [-3, 0.8, 12], [-12, 0.9, -4], [13, 0.8, 5]
                ];
                positions.forEach((p, i) => {
                    const boulder = BABYLON.MeshBuilder.CreateSphere('boulder' + i, {
                        diameter: 1.6 + Math.random() * 1.8,
                        segments: 8
                    }, scene);
                    boulder.position = new BABYLON.Vector3(p[0], p[1] - 0.1, p[2]);
                    boulder.scaling = new BABYLON.Vector3(1.2 + Math.random() * 0.8, 0.7, 1 + Math.random());
                    boulder.rotation.y = Math.random() * Math.PI;
                    boulder.material = edgeRockMat;
                    boulder.receiveShadows = true;
                    shadowGen.addShadowCaster(boulder, true);
                });

                // some grass tufts on top
                const tuftMat = new BABYLON.StandardMaterial('tuftMat', scene);
                tuftMat.diffuseColor = new BABYLON.Color3(0.5, 0.8, 0.3);
                for (let i = 0; i < 40; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const rad = 4 + Math.random() * 13;
                    const x = Math.cos(angle) * rad;
                    const z = Math.sin(angle) * rad;
                    const tuft = BABYLON.MeshBuilder.CreateCylinder('tuft' + i, {
                        height: 0.25,
                        diameterTop: 0.8,
                        diameterBottom: 0.4,
                        tessellation: 6
                    }, scene);
                    tuft.position = new BABYLON.Vector3(x, 1.65, z);
                    tuft.material = tuftMat;
                    tuft.receiveShadows = true;
                }
            }

            // ================================
            //          CASTLE
            // ================================
            function buildCastle() {
                const castleGroup = new BABYLON.TransformNode('castleGroup', scene);
                castleGroup.position = new BABYLON.Vector3(0, 1.25, -7);

                const stoneMat = new BABYLON.StandardMaterial('stoneMat', scene);
                stoneMat.diffuseColor = new BABYLON.Color3(0.72, 0.7, 0.66);
                stoneMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                stoneMat.specularPower = 8;

                const roofMat = new BABYLON.StandardMaterial('roofMat', scene);
                roofMat.diffuseColor = new BABYLON.Color3(0.55, 0.2, 0.22);

                const towerMat = new BABYLON.StandardMaterial('towerMat', scene);
                towerMat.diffuseColor = new BABYLON.Color3(0.65, 0.63, 0.6);
                towerMat.specularColor = BABYLON.Color3.Black();

                // central keep
                const keep = BABYLON.MeshBuilder.CreateCylinder('keep', {
                    height: 5.5,
                    diameterTop: 2.6,
                    diameterBottom: 3.2,
                    tessellation: 24
                }, scene);
                keep.position = new BABYLON.Vector3(0, 2.75, 0);
                keep.material = stoneMat;
                keep.parent = castleGroup;
                shadowGen.addShadowCaster(keep, true);

                const keepRoof = BABYLON.MeshBuilder.CreateCylinder('keepRoof', {
                    height: 2.2,
                    diameterTop: 0.1,
                    diameterBottom: 3.4,
                    tessellation: 24
                }, scene);
                keepRoof.position = new BABYLON.Vector3(0, 6.0, 0);
                keepRoof.material = roofMat;
                keepRoof.parent = castleGroup;
                shadowGen.addShadowCaster(keepRoof, true);

                // central tower accent
                const castleFlag = BABYLON.MeshBuilder.CreateBox('flag', {
                    width: 0.1,
                    height: 1.2,
                    depth: 0.1
                }, scene);
                castleFlag.position = new BABYLON.Vector3(0, 7.1, 0);
                castleFlag.material = new BABYLON.StandardMaterial('flagPole', scene);
                castleFlag.material.diffuseColor = new BABYLON.Color3(0.4, 0.35, 0.3);
                castleFlag.parent = castleGroup;

                // corner towers
                const towerPositions = [
                    [-3.2, 0, -2.8],
                    [3.2, 0, -2.8],
                    [-3.2, 0, 2.8],
                    [3.2, 0, 2.8]
                ];
                towerPositions.forEach((t, i) => {
                    const tower = BABYLON.MeshBuilder.CreateCylinder('tower' + i, {
                        height: 4.2,
                        diameterTop: 1.4,
                        diameterBottom: 1.8,
                        tessellation: 16
                    }, scene);
                    tower.position = new BABYLON.Vector3(t[0], 2.1, t[2]);
                    tower.material = towerMat;
                    tower.parent = castleGroup;
                    shadowGen.addShadowCaster(tower, true);

                    const towerRoof = BABYLON.MeshBuilder.CreateCylinder('towerRoof' + i, {
                        height: 1.3,
                        diameterTop: 0.05,
                        diameterBottom: 1.7,
                        tessellation: 16
                    }, scene);
                    towerRoof.position = new BABYLON.Vector3(t[0], 4.5, t[2]);
                    towerRoof.material = roofMat;
                    towerRoof.parent = castleGroup;
                    shadowGen.addShadowCaster(towerRoof, true);
                });

                // curtain walls between towers
                const wallPositions = [
                    { x: 0, len: 3.2, z: -2.8, rotY: 0 },
                    { x: 0, len: 3.2, z: 2.8, rotY: 0 },
                    { x: -3.2, len: 3.2, z: 0, rotY: Math.PI / 2 },
                    { x: 3.2, len: 3.2, z: 0, rotY: Math.PI / 2 }
                ];
                wallPositions.forEach((w, i) => {
                    const wall = BABYLON.MeshBuilder.CreateBox('wall' + i, {
                        width: w.len,
                        height: 2.2,
                        depth: 0.5
                    }, scene);
                    wall.position = new BABYLON.Vector3(w.x, 1.5, w.z);
                    wall.rotation.y = w.rotY;
                    wall.material = stoneMat;
                    wall.parent = castleGroup;
                    shadowGen.addShadowCaster(wall, true);
                });

                // path from castle to village
                const pathMat = new BABYLON.StandardMaterial('pathMat', scene);
                pathMat.diffuseColor = new BABYLON.Color3(0.66, 0.57, 0.44);
                for (let i = 0; i < 8; i++) {
                    const pathTile = BABYLON.MeshBuilder.CreateBox('pathTile' + i, {
                        width: 1.0,
                        height: 0.06,
                        depth: 1.4
                    }, scene);
                    pathTile.position = new BABYLON.Vector3(-0.5 + i * 0.3, 1.02, 0.8 - i * 1.5);
                    pathTile.material = pathMat;
                    pathTile.receiveShadows = true;
                }
            }

            // ================================
            //       VILLAGE + MARKET
            // ================================
            function buildVillage() {
                const villGroup = new BABYLON.TransformNode('villageGroup', scene);
                villGroup.position = new BABYLON.Vector3(0, 0, 0);

                function makeHouse(x, z, size, color, rotY = 0) {
                    const house = new BABYLON.TransformNode('house_' + x + '_' + z, scene);
                    house.position = new BABYLON.Vector3(x, 1.0, z);
                    house.rotation.y = rotY;

                    const base = BABYLON.MeshBuilder.CreateBox('base', {
                        width: size,
                        height: size * 0.9,
                        depth: size * 0.8
                    }, scene);
                    base.position.y = size * 0.45;
                    base.material = color;
                    base.parent = house;
                    base.receiveShadows = true;
                    shadowGen.addShadowCaster(base, true);

                    // roof (triangular prism via rotating cylinder)
                    const roof = BABYLON.MeshBuilder.CreateCylinder('roof', {
                        height: size * 0.8,
                        diameterTop: size * 1.1,
                        diameterBottom: size * 1.1,
                        tessellation: 3,
                        cap: 3
                    }, scene);
                    roof.rotation.x = Math.PI / 2;
                    roof.position.y = size * 0.9 + size * 0.2;
                    roof.scaling.z = size * 0.8 / (size * 0.8); // fits length
                    const roofMat = new BABYLON.StandardMaterial('roofMat_' + x, scene);
                    // mix warm browns
                    roofMat.diffuseColor = new BABYLON.Color3(0.6 + Math.random() * 0.2, 0.3 + Math.random() * 0.15, 0.25);
                    roof.mat = roof;
                    roof.material = roofMat;
                    roof.parent = house;
                    shadowGen.addShadowCaster(roof, true);

                    // door
                    const door = BABYLON.MeshBuilder.CreateBox('door', {
                        width: size * 0.25,
                        height: size * 0.4,
                        depth: 0.2
                    }, scene);
                    door.position = new BABYLON.Vector3(0, 0.2, size * 0.42);
                    door.material = new BABYLON.StandardMaterial('doorMat', scene);
                    door.material.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);
                    door.parent = house;

                    // windows
                    for (let side = -1; side <= 1; side += 2) {
                        const win = BABYLON.MeshBuilder.CreateBox('win', {
                            width: 0.25,
                            height: 0.25,
                            depth: 0.1
                        }, scene);
                        win.position = new BABYLON.Vector3(side * size * 0.3, 0.4, size * 0.2);
                        win.material = new BABYLON.StandardMaterial('winMat', scene);
                        win.material.diffuseColor = new BABYLON.Color3(0.9, 0.8, 0.3);
                        win.material.emissiveColor = new BABYLON.Color3(0.9, 0.7, 0.3);
                        win.parent = house;
                    }
                    return house;
                }

                // some medieval houses
                const warm = new BABYLON.StandardMaterial('warm', scene);
                warm.diffuseColor = new BABYLON.Color3(0.75, 0.55, 0.3);
                const timber = new BABYLON.StandardMaterial('timber', scene);
                timber.diffuseColor = new BABYLON.Color3(0.66, 0.45, 0.27);
                const clay = new BABYLON.StandardMaterial('clay', scene);
                clay.diffuseColor = new BABYLON.Color3(0.65, 0.3, 0.25);

                makeHouse(-5.5, 4.5, 1.7, warm, 0.2);
                makeHouse(-6.8, 2.8, 1.3, timber, -0.3);
                makeHouse(5.8, 3.8, 1.5, clay, -0.2);
                makeHouse(4.4, 6.0, 1.4, warm, 0.1);
                makeHouse(-3.5, 7.2, 1.4, timber, 0.4);

                // Tavern
                const tavernGroup = new BABYLON.TransformNode('tavern', scene);
                tavernGroup.position = new BABYLON.Vector3(-4.2, 1.1, 6.6);
                const tavernBase = BABYLON.MeshBuilder.CreateBox('tavernBase', {
                    width: 2.2,
                    height: 1.6,
                    depth: 2.0
                }, scene);
                tavernBase.position.y = 0.8;
                tavernBase.material = clay;
                tavernBase.parent = tavernGroup;
                shadowGen.addShadowCaster(tavernBase, true);

                const tavernRoof = BABYLON.MeshBuilder.CreateCylinder('tavernRoof', {
                    height: 2.0,
                    diameterTop: 2.4,
                    diameterBottom: 2.4,
                    tessellation: 3,
                    cap: 3
                }, scene);
                tavernRoof.rotation.x = Math.PI / 2;
                tavernRoof.position.y = 1.7;
                tavernRoof.material = new BABYLON.StandardMaterial('tavernRoofMat', scene);
                tavernRoof.material.diffuseColor = new BABYLON.Color3(0.6, 0.25, 0.2);
                tavernRoof.parent = tavernGroup;
                shadowGen.addShadowCaster(tavernRoof, true);

                // tavern sign
                const sign = BABYLON.MeshBuilder.CreateBox('sign', {
                    width: 0.6,
                    height: 0.4,
                    depth: 0.1
                }, scene);
                sign.position.y = 1.6;
                sign.position.x = 1.2;
                sign.rotation.y = 0.5;
                sign.material = new BABYLON.StandardMaterial('signMat', scene);
                sign.material.diffuseColor = new BABYLON.Color3(0.9, 0.7, 0.2);
                sign.parent = tavernGroup;

                // Market stalls
                for (let i = 0; i < 3; i++) {
                    const stall = new BABYLON.TransformNode('stall_' + i, scene);
                    const sx = -6.0 + i * 1.4;
                    const sz = 5.2 + (i % 2) * 0.5;
                    stall.position = new BABYLON.Vector3(sx, 1.2, sz);
                    stall.rotation.y = i * 0.3;

                    const table = BABYLON.MeshBuilder.CreateBox('stallTable', {
                        width: 0.9,
                        height: 0.8,
                        depth: 0.6
                    }, scene);
                    table.position.y = 0.4;
                    table.material = timber;
                    table.parent = stall;
                    shadowGen.addShadowCaster(table, true);

                    const canopy = BABYLON.MeshBuilder.CreateBox('canopy', {
                        width: 1.4,
                        height: 0.08,
                        depth: 1.0
                    }, scene);
                    canopy.position.y = 1.1;
                    canopy.material = new BABYLON.StandardMaterial('canopyMat', scene);
                    canopy.material.diffuseColor = new BABYLON.Color3(0.8, 0.2, 0.25);
                    canopy.parent = stall;
                }

                // barrels
                const barrelMat = new BABYLON.StandardMaterial('barrelMat', scene);
                barrelMat.diffuseColor = new BABYLON.Color3(0.55, 0.35, 0.2);
                for (let i = 0; i < 5; i++) {
                    const barrel = BABYLON.MeshBuilder.CreateCylinder('barrel' + i, {
                        height: 0.7,
                        diameterTop: 0.45,
                        diameterBottom: 0.45,
                        tessellation: 12
                    }, scene);
                    barrel.position = new BABYLON.Vector3(-2.5 + i * 0.6, 1.0, 8.5);
                    barrel.material = barrelMat;
                }
            }

            // ================================
            //         RIVER + WATERFALL
            // ================================
            function buildRiver() {
                const waterMat = new BABYLON.StandardMaterial('waterMat', scene);
                waterMat.diffuseColor = new BABYLON.Color3(0.0, 0.65, 0.75);
                waterMat.alpha = 0.92;
                waterMat.specularColor = new BABYLON.Color3(0.3, 0.5, 0.6);

                // river path as connected elongated boxes
                const points = [
                    { x: 6.5, z: 6.5, r: 0.4, len: 3.0 },
                    { x: 4.0, z: 7.0, r: 0.2, len: 3.2 },
                    { x: 1.0, z: 5.5, r: -0.1, len: 3.5 },
                    { x: -1.8, z: 3.2, r: -0.5, len: 3.5 },
                    { x: -4.0, z: 1.0, r: -0.8, len: 3.2 },
                    { x: -7.0, z: -0.5, r: -0.5, len: 3.5 },
                    { x: -10.0, z: -1.0, r: -0.2, len: 3.0 },
                    { x: -13.5, z: -0.8, r: 0.1, len: 3.2 },
                    { x: -16.0, z: -0.3, r: 0, len: 2.0 }
                ];

                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    const seg = BABYLON.MeshBuilder.CreateBox('riverSeg' + i, {
                        width: 2.2,
                        height: 0.15,
                        depth: p.len
                    }, scene);
                    seg.position = new BABYLON.Vector3(p.x, 1.65, p.z);
                    seg.rotation.y = p.r;
                    seg.material = waterMat;
                    seg.receiveShadows = true;

                    if (i < points.length - 1) {
                        const next = points[i + 1];
                        const dx = next.x - p.x;
                        const dz = next.z - p.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        if (dist > 0.1) {
                            const fill = BABYLON.MeshBuilder.CreateBox('riverFill' + i, {
                                width: 2.1,
                                height: 0.12,
                                depth: dist
                            }, scene);
                            fill.position = new BABYLON.Vector3((p.x + next.x) / 2, 1.66, (p.z + next.z) / 2);
                            fill.rotation.y = Math.atan2(dx, dz);
                            fill.material = waterMat;
                            fill.receiveShadows = true;
                        }
                    }
                }

                // Waterfall at the edge (west)
                const fall = BABYLON.MeshBuilder.CreatePlane('waterfall', {
                    width: 2.4,
                    height: 6.0,
                    sideOrientation: BABYLON.Mesh.DOUBLESIDE
                }, scene);
                fall.position = new BABYLON.Vector3(-17.8, -1.5, -0.4);
                fall.rotation.y = -0.2;
                const fallMat = new BABYLON.StandardMaterial('fallMat', scene);
                fallMat.diffuseColor = new BABYLON.Color3(0.4, 0.8, 0.9);
                fallMat.alpha = 0.55;
                fallMat.emissiveColor = new BABYLON.Color3(0.1, 0.5, 0.6);
                fall.material = fallMat;

                // splashes at bottom
                const splash = BABYLON.MeshBuilder.CreateSphere('splash', {
                    diameter: 1.8,
                    segments: 12
                }, scene);
                splash.position = new BABYLON.Vector3(-18.5, -8.5, -0.5);
                splash.scaling.y = 0.4;
                const splashMat = new BABYLON.StandardMaterial('splashMat', scene);
                splashMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.95);
                splashMat.alpha = 0.4;
                splash.material = splashMat;

                // wooden bridge across river at x=-2
                const bridgeGroup = new BABYLON.TransformNode('bridgeGroup', scene);
                bridgeGroup.position = new BABYLON.Vector3(-2.3, 1.8, 2.0);
                bridgeGroup.rotation.y = -0.5;
                const woodMat = new BABYLON.StandardMaterial('bridgeWood', scene);
                woodMat.diffuseColor = new BABYLON.Color3(0.5, 0.33, 0.2);
                // beams
                for (let s = -1; s <= 1; s += 2) {
                    const beam = BABYLON.MeshBuilder.CreateBox('beam' + s, {
                        width: 3.0,
                        height: 0.2,
                        depth: 0.3
                    }, scene);
                    beam.position.x = s * 0.7;
                    beam.material = woodMat;
                    beam.parent = bridgeGroup;
                }
                // planks
                for (let p = -5; p <= 5; p++) {
                    const plank = BABYLON.MeshBuilder.CreateBox('plank' + p, {
                        width: 0.5,
                        height: 0.1,
                        depth: 1.6
                    }, scene);
                    plank.position.x = p * 0.4;
                    plank.position.y = 0.15;
                    plank.material = woodMat;
                    plank.parent = bridgeGroup;
                }
                // railings
                for (let side = -1; side <= 1; side += 2) {
                    const rail = BABYLON.MeshBuilder.CreateBox('rail' + side, {
                        width: 3.2,
                        height: 0.5,
                        depth: 0.08
                    }, scene);
                    rail.position.x = 0;
                    rail.position.y = 0.55;
                    rail.position.z = side * 0.82;
                    rail.material = woodMat;
                    rail.parent = bridgeGroup;
                }
                shadowGen.addShadowCaster(bridgeGroup, true);
            }

            // ================================
            //          TREES / NATURE
            // ================================
            function buildForest() {
                // scattered pines
                const trunkMat = new BABYLON.StandardMaterial('trunkMat', scene);
                trunkMat.diffuseColor = new BABYLON.Color3(0.42, 0.27, 0.16);

                const foliageMat1 = new BABYLON.StandardMaterial('foliage1', scene);
                foliageMat1.diffuseColor = new BABYLON.Color3(0.2, 0.42, 0.22);
                const foliageMat2 = new BABYLON.StandardMaterial('foliage2', scene);
                foliageMat2.diffuseColor = new BABYLON.Color3(0.3, 0.52, 0.2);
                const foliageMat3 = new BABYLON.StandardMaterial('foliage3', scene);
                foliageMat3.diffuseColor = new BABYLON.Color3(0.15, 0.34, 0.18);

                const treePositions = [
                    [-8, 3.5], [-9.5, 1.5], [7.5, 6.5], [10, 3.0], [6, 0.5],
                    [-2, 9.0], [2.5, 9.5], [-11, -3], [11, -6], [8, -8.5],
                    [3.5, -10.5], [-4, -8.5], [-7, -7], [-13, 2], [14, -1],
                    [-14, -6], [13, 8], [5, 11], [-8, 11], [0, -12]
                ];

                treePositions.forEach((pos, i) => {
                    if (Math.abs(pos[0]) < 2.2 && Math.abs(pos[1] - 3) < 2) return; // keep river free
                    const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk' + i, {
                        height: 0.8 + Math.random() * 0.5,
                        diameterTop: 0.14,
                        diameterBottom: 0.25,
                        tessellation: 8
                    }, scene);
                    trunk.position = new BABYLON.Vector3(pos[0], 1.2 + 0.4, pos[1]);
                    trunk.material = trunkMat;
                    shadowGen.addShadowCaster(trunk, true);

                    const layers = 2 + Math.floor(Math.random() * 2);
                    let y = 1.4 + 0.8;
                    for (let l = 0; l < layers; l++) {
                        const cone = BABYLON.MeshBuilder.CreateCylinder('cone' + i + '_' + l, {
                            height: 1.2 + Math.random() * 0.6,
                            diameterTop: 0.05,
                            diameterBottom: 1.4 - l * 0.25,
                            tessellation: 10
                        }, scene);
                        cone.position = new BABYLON.Vector3(pos[0], y, pos[1]);
                        const mat = l % 2 === 0 ? (foliageMat1) : (foliageMat2);
                        cone.material = mat;
                        cone.parent = null;
                        shadowGen.addShadowCaster(cone, true);
                        y += 0.6 + Math.random() * 0.3;
                    }
                });

                // small rocks near cliffs
                const rockMat = new BABYLON.StandardMaterial('smallRock', scene);
                rockMat.diffuseColor = new BABYLON.Color3(0.6, 0.55, 0.5);
                for (let i = 0; i < 20; i++) {
                    const rock = BABYLON.MeshBuilder.CreateSphere('smallRock' + i, {
                        diameter: 0.3 + Math.random() * 0.5,
                        segments: 6
                    }, scene);
                    const randX = -16 + Math.random() * 32;
                    const randZ = -15 + Math.random() * 30;
                    if (Math.sqrt(randX * randX + randZ * randZ) < 13) continue;
                    rock.position = new BABYLON.Vector3(randX, 1.1 + Math.random() * 0.5, randZ);
                    rock.material = rockMat;
                    rock.scaling.y = 0.6;
                }
            }

            // ================================
            //       RUINED WATCHTOWER
            // ================================
            function buildRuins() {
                const ruinMat = new BABYLON.StandardMaterial('ruinMat', scene);
                ruinMat.diffuseColor = new BABYLON.Color3(0.58, 0.48, 0.42);

                const pos = new BABYLON.Vector3(9.0, 1.2, -12.5);
                // broken base
                const ruinBase = BABYLON.MeshBuilder.CreateCylinder('ruinBase', {
                    height: 1.5,
                    diameterTop: 1.8,
                    diameterBottom: 2.2,
                    tessellation: 10
                }, scene);
                ruinBase.position = pos;
                ruinBase.material = ruinMat;
                ruinBase.rotation.y = 0.8;
                shadowGen.addShadowCaster(ruinBase, true);

                // jagged broken wall
                const ruinWall = BABYLON.MeshBuilder.CreateBox('ruinWall', {
                    width: 1.6,
                    height: 1.9,
                    depth: 0.5
                }, scene);
                ruinWall.position = new BABYLON.Vector3(pos.x + 0.4, pos.y + 1.0, pos.z);
                ruinWall.rotation.y = -0.5;
                ruinWall.material = ruinMat;
                shadowGen.addShadowCaster(ruinWall, true);

                // rubble
                for (let i = 0; i < 4; i++) {
                    const rubble = BABYLON.MeshBuilder.CreateBox('rubble' + i, {
                        width: 0.4 + Math.random() * 0.3,
                        height: 0.2 + Math.random() * 0.3,
                        depth: 0.4 + Math.random() * 0.3
                    }, scene);
                    rubble.position = new BABYLON.Vector3(pos.x + Math.random() * 1.5 - 0.5, 1.2, pos.z + Math.random() * 1.5 - 0.5);
                    rubble.material = ruinMat;
                }
            }

            // ================================
            //          WATERMILL
            // ================================
            function buildMill() {
                const millGroup = new BABYLON.TransformNode('millGroup', scene);
                millGroup.position = new BABYLON.Vector3(3.8, 1.6, 8.5);
                const woodMat = new BABYLON.StandardMaterial('millWood', scene);
                woodMat.diffuseColor = new BABYLON.Color3(0.5, 0.33, 0.22);

                const house = BABYLON.MeshBuilder.CreateBox('millHouse', {
                    width: 1.8,
                    height: 1.7,
                    depth: 1.4
                }, scene);
                house.position.y = 0.85;
                house.material = woodMat;
                house.parent = millGroup;
                shadowGen.addShadowCaster(house, true);

                const wheel = BABYLON.MeshBuilder.CreateCylinder('waterWheel', {
                    height: 0.3,
                    diameterTop: 1.4,
                    diameterBottom: 1.4,
                    tessellation: 24
                }, scene);
                wheel.rotation.z = Math.PI / 2;
                wheel.position = new BABYLON.Vector3(0.1, 0.8, 0.9);
                const wheelMat = new BABYLON.StandardMaterial('wheelMat', scene);
                wheelMat.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);
                wheel.material = wheelMat;
                wheel.parent = millGroup;

                // paddles
                for (let i = 0; i < 8; i++) {
                    const paddle = BABYLON.MeshBuilder.CreateBox('paddle' + i, {
                        width: 0.1,
                        height: 0.8,
                        depth: 0.6
                    }, scene);
                    paddle.position.x = Math.cos(i / 8 * Math.PI * 2) * 0.7;
                    paddle.position.y = Math.sin(i / 8 * Math.PI * 2) * 0.7;
                    paddle.rotation.z = -i / 8 * Math.PI * 2;
                    paddle.material = wheelMat;
                    paddle.parent = wheel;
                }
            }

            // ================================
            //          FLOWERS / DETAILS
            // ================================
            function addFlowers() {
                const flowerMat = new BABYLON.StandardMaterial('flowerMat', scene);
                flowerMat.diffuseColor = new BABYLON.Color3(0.9, 0.8, 0.3);
                for (let i = 0; i < 55; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 2 + Math.random() * 16;
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    const flower = BABYLON.MeshBuilder.CreateSphere('flower' + i, {
                        diameter: 0.12,
                        segments: 4
                    }, scene);
                    flower.position = new BABYLON.Vector3(x, 1.7 + Math.random() * 0.1, z);
                    flower.material = flowerMat;
                    flower.scaling.y = 0.5;
                }
            }

            // ================================
            //          BUILD SCENE
            // ================================
            buildIsland();
            buildCastle();
            buildVillage();
            buildRiver();
            buildForest();
            buildRuins();
            buildMill();
            addFlowers();

            // extra grass decor
            const daisyMat = new BABYLON.StandardMaterial('daisyMat', scene);
            daisyMat.diffuseColor = new BABYLON.Color3(0.85, 0.6, 0.8);
            for (let i = 0; i < 20; i++) {
                const daisy = BABYLON.MeshBuilder.CreateSphere('daisy' + i, {
                    diameter: 0.12,
                    segments: 4
                }, scene);
                const angle = Math.random() * Math.PI * 2;
                const r = 5 + Math.random() * 10;
                daisy.position = new BABYLON.Vector3(Math.cos(angle) * r, 1.75, Math.sin(angle) * r);
                daisy.material = daisyMat;
            }

            // Animate slow rotation (attract mode)
            let rotating = true;
            scene.onBeforeRenderObservable.add(() => {
                if (rotating && !camera.radius) return;
                // optional slow auto-rotate if idle? For now keep manual.
            });

            // better ambient occlusion via light maps? no texture.

            // ---------- Engine loop ----------
            engine.runRenderLoop(() => {
                scene.render();
            });

            window.addEventListener('resize', () => {
                engine.resize();
            });

        })();
    </script>
</body>
</html>
