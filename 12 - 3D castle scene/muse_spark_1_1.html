<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Medieval Island Diorama</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#87c8ff;font-family:Inter,system-ui,sans-serif}
  #renderCanvas{width:100%;height:100%;display:block;outline:none}
  #ui{position:absolute;top:20px;left:20px;pointer-events:none;z-index:10}
 .glass{background:rgba(255,255,255,0.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.6);border-radius:18px;padding:14px 18px;box-shadow:0 12px 32px rgba(0,0,0,0.12)}
 .title{font-weight:800;font-size:16px;color:#1a1e26}
 .sub{font-size:11px;font-weight:600;letter-spacing:0.12em;color:#6b7280;margin-top:4px}
 .hint{margin-top:10px;display:flex;gap:6px}
 .pill{font-size:10px;font-weight:600;padding:5px 9px;border-radius:20px;background:#111827;color:#fff}
 .pill.light{background:#fff;border:1px solid #e5e7eb;color:#374151}
  #loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(80% 80% at 50% 30%, #cfe9ff 0%, #87c8ff 55%, #6aa9e0 100%);z-index:20;transition:opacity 0.8s}
  #loader.hidden{opacity:0;pointer-events:none}
 .spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,0.5);border-top-color:#1a1e26;border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<div id="loader"><div style="text-align:center"><div class="spinner"></div><div style="font-weight:700;color:#1a1e26">Carving floating island...</div></div>
<canvas id="renderCanvas"></canvas>
<div id="ui"><div class="glass"><div class="title">Floating Isle — Medieval Diorama</div><div class="sub">CASTLE • VILLAGE • MILL • RUIN • WATERFALLS</div><div class="hint"><span class="pill">drag to orbit</span><span class="pill light">scroll to zoom</span></div></div></div>
<script>
const canvas=document.getElementById("renderCanvas");
const engine=new BABYLON.Engine(canvas,true,{antialias:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.64,0.82,1,1);
const camera=new BABYLON.ArcRotateCamera("cam",-1,1.15,108,new BABYLON.Vector3(0,12,0),scene);
camera.lowerRadiusLimit=32;camera.upperRadiusLimit=190;camera.lowerBetaLimit=0.45;camera.upperBetaLimit=1.45;
camera.attachControl(canvas,true);
camera.useAutoRotationBehavior=true;camera.autoRotationBehavior.idleRotationSpeed=0.12;

const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(0,1,0),scene);hemi.intensity=0.72;
const sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-0.6,-1,-0.35),scene);sun.position=new BABYLON.Vector3(80,90,45);sun.intensity=1.1;
const shadowGen=new BABYLON.ShadowGenerator(2048,sun);shadowGen.usePercentageCloserFiltering=true;shadowGen.bias=0.0005;
const pipeline=new BABYLON.DefaultRenderingPipeline("pp",true,scene,[camera]);
pipeline.bloomEnabled=true;pipeline.bloomThreshold=0.78;pipeline.bloomWeight=0.38;pipeline.bloomKernel=64;pipeline.fxaaEnabled=true;
pipeline.imageProcessing.vignetteEnabled=true;pipeline.imageProcessing.vignetteWeight=0.35;

function pbr(n,c,r=0.9,m=0){const mat=new BABYLON.PBRMaterial(n,scene);mat.albedoColor=BABYLON.Color3.FromHexString(c);mat.roughness=r;mat.metallic=m;mat.environmentIntensity=0.35;return mat;}
function stoneTex(){const t=new BABYLON.DynamicTexture("st",256,scene,false);const ctx=t.getContext();ctx.fillStyle="#d8d5ce";ctx.fillRect(0,0,256,256);for(let i=0;i<4000;i++){ctx.fillStyle=Math.random()>0.5?"rgba(0,0,0,0.07)":"rgba(255,255,255,0.18)";ctx.fillRect(Math.random()*256,Math.random()*256,Math.random()*2,Math.random()*2);}ctx.strokeStyle="rgba(0,0,0,0.06)";for(let y=0;y<256;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(256,y);ctx.stroke();}t.update();return t;}

const islandRoot=new BABYLON.TransformNode("root",scene);islandRoot.position.y=-6;
const grassMat=pbr("grass","#7ec850",0.92);grassMat.albedoColor=new BABYLON.Color3(0.46,0.78,0.31);
const rockMat=pbr("rock","#8a7a6a",1);rockMat.albedoColor=new BABYLON.Color3(0.52,0.46,0.39);
const darkRock=pbr("drock","#6b5d4f",0.95);

const topMesh=BABYLON.MeshBuilder.CreateCylinder("top",{diameter:124,height:8.5,tessellation:80,subdivisions:4},scene);
topMesh.parent=islandRoot;topMesh.position.y=8;topMesh.material=grassMat;
let p=topMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
for(let i=0;i<p.length;i+=3){const x=p[i],z=p[i+2],r=Math.sqrt(x*x+z*z);if(r>48){const a=Math.atan2(z,x),n=Math.sin(a*7)*2.5+Math.cos(a*13)*1.5+(Math.random()-0.5)*1.2;p[i]=x*(r+n)/r;p[i+2]=z*(r+n)/r;}}
topMesh.setVerticesData(BABYLON.VertexBuffer.PositionKind,p);topMesh.refreshBoundingInfo();

const cliff=BABYLON.MeshBuilder.CreateCylinder("cliff",{diameterTop:128,diameterBottom:46,height:38,tessellation:80},scene);
cliff.parent=islandRoot;cliff.position.y=-13.5;cliff.material=rockMat;shadowGen.addShadowCaster(cliff);
let cp=cliff.getVerticesData(BABYLON.VertexBuffer.PositionKind);
for(let i=0;i<cp.length;i+=3){const x=cp[i],z=cp[i+2],y=cp[i+1],r=Math.sqrt(x*x+z*z);if(r>5){const a=Math.atan2(z,x),n=Math.sin(a*9+y*0.26)*1.8+Math.cos(a*17)*1.2+(Math.random()-0.5)*1.8;const d=1+n*0.02;cp[i]*=d;cp[i+2]*=d;}cp[i+1]+=(Math.random()-0.5)*0.6;}
cliff.setVerticesData(BABYLON.VertexBuffer.PositionKind,cp);cliff.refreshBoundingInfo();

const bottom=BABYLON.MeshBuilder.CreateCylinder("bottom",{diameterTop:46,diameterBottom:2,height:28,tessellation:32},scene);bottom.parent=islandRoot;bottom.position.y=-42;bottom.material=darkRock;
for(let i=0;i<6;i++){const ang=i/6*Math.PI*2,r=62+Math.random()*14,rock=BABYLON.MeshBuilder.CreatePolyhedron("r"+i,{type:1,size:2+Math.random()*2.5},scene);rock.position.set(Math.cos(ang)*r,-22-Math.random()*8,Math.sin(ang)*r);rock.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);rock.material=darkRock;rock.parent=islandRoot;shadowGen.addShadowCaster(rock);}

const riverPath=[new BABYLON.Vector3(-48,5.8,48),new BABYLON.Vector3(-32,5.8,28),new BABYLON.Vector3(-12,5.8,10),new BABYLON.Vector3(4,5.8,-4),new BABYLON.Vector3(18,5.8,-22),new BABYLON.Vector3(34,5.8,-38),new BABYLON.Vector3(52,5.8,-52)];
const river=BABYLON.MeshBuilder.CreateTube("river",{path:riverPath,radius:6.5,radiusFunction:(i)=>5+Math.sin(i*0.4)*1.2,tessellation:20,cap:BABYLON.Mesh.CAP_ALL},scene);
river.parent=islandRoot;const waterMat=pbr("water","#2ec4b6",0.25,0.1);waterMat.albedoColor=new BABYLON.Color3(0.18,0.76,0.82);waterMat.alpha=0.92;waterMat.emissiveColor=new BABYLON.Color3(0.05,0.22,0.26);river.material=waterMat;river.scaling.y=0.18;
const wt=new BABYLON.DynamicTexture("wt",256,scene,false);const wc=wt.getContext();wc.fillStyle="#3dd3c8";wc.fillRect(0,0,256,256);for(let i=0;i<600;i++){wc.fillStyle="rgba(255,255,255,0.18)";wc.fillRect(Math.random()*256,Math.random()*256,Math.random()*12,1.5);}wt.update();waterMat.albedoTexture=wt;waterMat.albedoTexture.uScale=3;

function bridge(at){const p1=riverPath[at],p2=riverPath[at+1],mid=BABYLON.Vector3.Lerp(p1,p2,0.5),dir=p2.subtract(p1).normalize(),root=new BABYLON.TransformNode("b"+at,scene);root.parent=islandRoot;root.position=mid.clone();root.position.y=6.8;root.rotation.y=-Math.atan2(dir.z,dir.x);const m=pbr("pl"+at,"#8b5a2b",0.85);for(let i=0;i<12;i++){const pl=BABYLON.MeshBuilder.CreateBox("pl",{width:11,height:0.4,depth:0.9},scene);pl.material=m;pl.position.set(0,0,(i-5.5)*0.95);pl.parent=root;shadowGen.addShadowCaster(pl);}}
bridge(1);bridge(3);

const sTex=stoneTex();const stoneMat=pbr("stone","#d8d5ce",0.9);stoneMat.albedoTexture=sTex;
const castleRoot=new BABYLON.TransformNode("castle",scene);castleRoot.parent=islandRoot;castleRoot.position.set(0,9,0);
const keep=BABYLON.MeshBuilder.CreateBox("keep",{width:14,height:18,depth:14},scene);keep.material=stoneMat;keep.position.y=9;keep.parent=castleRoot;shadowGen.addShadowCaster(keep);
const kRoof=BABYLON.MeshBuilder.CreateCylinder("kRoof",{diameterTop:0,diameterBottom:16,height:7,tessellation:4},scene);kRoof.material=pbr("kr","#4a3a2e",0.9);kRoof.position.y=21.5;kRoof.rotation.y=Math.PI/4;kRoof.parent=castleRoot;
const tPos=[[-9,-9],[9,-9],[9,9],[-9,9]];
tPos.forEach(tp=>{const tw=BABYLON.MeshBuilder.CreateCylinder("tw",{diameter:7.5,height:24,tessellation:16},scene);tw.material=stoneMat;tw.position.set(tp[0],12,tp[1]);tw.parent=castleRoot;shadowGen.addShadowCaster(tw);const tr=BABYLON.MeshBuilder.CreateCylinder("tr",{diameterTop:0,diameterBottom:9,height:6.5,tessellation:16},scene);tr.material=pbr("trm","#5a4a3f",0.8);tr.position.set(tp[0],26.5,tp[1]);tr.parent=castleRoot;for(let k=0;k<8;k++){const a=k/8*Math.PI*2,c=BABYLON.MeshBuilder.CreateBox("cr",{width:1.1,height:1.6,depth:1.1},scene);c.material=stoneMat;c.position.set(tp[0]+Math.cos(a)*3.2,24.6,tp[1]+Math.sin(a)*3.2);c.parent=castleRoot;}});
function wall(a,b,h=12){const mid=new BABYLON.Vector3((a[0]+b[0])/2,h/2+2,(a[1]+b[1])/2),dist=Math.hypot(a[0]-b[0],a[1]-b[1]),w=BABYLON.MeshBuilder.CreateBox("w",{width:dist,height:h,depth:2.2},scene);w.material=stoneMat;w.position.copyFrom(mid);w.parent=castleRoot;w.lookAt(new BABYLON.Vector3(b[0],mid.y,b[1]));w.rotate(BABYLON.Axis.Y,Math.PI/2);shadowGen.addShadowCaster(w);}
wall(tPos[0],tPos[1]);wall(tPos[1],tPos[2]);wall(tPos[2],tPos[3]);wall(tPos[3],tPos[0]);

const wood=pbr("wood","#8b5a2b",0.85),woodL=pbr("woodL","#c49a6c",0.85),thatch=pbr("th","#6b3a26",0.92),thatchD=pbr("thD","#4a2e1a",0.92);
function house(x,z,s=1,tav=false){const r=new BABYLON.TransformNode("hr",scene);r.parent=islandRoot;r.position.set(x,5.2,z);r.scaling.set(s,s,s);r.rotation.y=Math.random()*Math.PI*2;const b=BABYLON.MeshBuilder.CreateBox("hb",{width:6,height:4,depth:5.5},scene);b.material=Math.random()>0.5?wood:woodL;b.position.y=2;b.parent=r;shadowGen.addShadowCaster(b);const roof=BABYLON.MeshBuilder.CreateCylinder("hro",{diameter:7.2,height:6.6,tessellation:3},scene);roof.material=Math.random()>0.5?thatch:thatchD;roof.rotation.z=Math.PI/2;roof.rotation.x=Math.PI/2;roof.position.y=5.4;roof.scaling.z=0.72;roof.parent=r;shadowGen.addShadowCaster(roof);if(tav){const pl=new BABYLON.PointLight("tav",new BABYLON.Vector3(x,9,z),scene);pl.intensity=0.5;pl.diffuse=new BABYLON.Color3(1,0.6,0.25);pl.parent=islandRoot;}}
[[-22,-18,1.1],[-28,-8,0.9],[-18,-26,1],[-32,2,1],[-24,10,1],[18,-18,1],[26,-10,0.95],[22,-26,1.05],[28,6,1],[16,14,1.1],[-6,-32,0.9],[-10,22,1]].forEach(p=>{const hp=new BABYLON.Vector3(p[0],0,p[1]);let c=false;for(let rp of riverPath){if(BABYLON.Vector3.Distance(hp,new BABYLON.Vector3(rp.x,0,rp.z))<10)c=true;}if(!c)house(p[0],p[1],p[2]);});house(-26,-14,1.45,true);

function stall(x,z){const rt=new BABYLON.TransformNode("st",scene);rt.parent=islandRoot;rt.position.set(x,5.2,z);for(let px of [-1.5,1.5])for(let pz of [-1,1]){const po=BABYLON.MeshBuilder.CreateCylinder("po",{diameter:0.22,height:3,tessellation:6},scene);po.material=wood;po.position.set(px,1.5,pz);po.parent=rt;}const ca=BABYLON.MeshBuilder.CreateBox("ca",{width:3.6,height:0.2,depth:2.6},scene);ca.position.y=3.1;ca.parent=rt;const dt=new BABYLON.DynamicTexture("dt",128,scene);const ctx=dt.getContext();ctx.fillStyle="#f5e6c8";ctx.fillRect(0,0,128,128);ctx.fillStyle="#d33a3a";for(let i=0;i<128;i+=16)ctx.fillRect(i,0,8,128);dt.update();const cm=new BABYLON.StandardMaterial("cm",scene);cm.diffuseTexture=dt;ca.material=cm;}
stall(-20,-10);stall(-18,-12);stall(-22,-12);

const millRoot=new BABYLON.TransformNode("millR",scene);millRoot.parent=islandRoot;millRoot.position.set(24,5.2,-30);millRoot.rotation.y=-0.6;
const mBase=BABYLON.MeshBuilder.CreateBox("mB",{width:8,height:7,depth:7},scene);mBase.material=woodL;mBase.position.y=3.5;mBase.parent=millRoot;shadowGen.addShadowCaster(mBase);
const mRoof=BABYLON.MeshBuilder.CreateCylinder("mR",{diameter:9,height:8,tessellation:3},scene);mRoof.material=thatch;mRoof.rotation.z=Math.PI/2;mRoof.rotation.x=Math.PI/2;mRoof.position.y=8.2;mRoof.scaling.z=0.7;mRoof.parent=millRoot;
const wNode=new BABYLON.TransformNode("wN",scene);wNode.parent=millRoot;wNode.position.set(4.2,2.2,0);
const wheel=BABYLON.MeshBuilder.CreateCylinder("wheel",{diameter:5.5,height:1,tessellation:16},scene);wheel.material=wood;wheel.rotation.z=Math.PI/2;wheel.parent=wNode;
for(let i=0;i<8;i++){const pad=BABYLON.MeshBuilder.CreateBox("pad",{width:1.2,height:0.15,depth:1},scene);pad.material=wood;const a=i/8*Math.PI*2;pad.position.set(Math.cos(a)*2.5,Math.sin(a)*2.5,0);pad.rotation.z=a;pad.parent=wheel;}

function pine(x,z,s=1){const rt=new BABYLON.TransformNode("pine",scene);rt.parent=islandRoot;rt.position.set(x,5.2,z);rt.scaling.set(s,s,s);const tr=BABYLON.MeshBuilder.CreateCylinder("tr",{diameterTop:0.35,diameterBottom:0.6,height:3.2*s,tessellation:6},scene);tr.material=pbr("trM"+Math.random(),"#5c3a21",1);tr.position.y=1.6*s;tr.parent=rt;shadowGen.addShadowCaster(tr);const fMat=pbr("f"+Math.random(),"#2e7d32",0.9);fMat.albedoColor=new BABYLON.Color3(0.18+Math.random()*0.1,0.48+Math.random()*0.15,0.18);for(let i=0;i<3;i++){const co=BABYLON.MeshBuilder.CreateCylinder("co",{diameterTop:0,diameterBottom:2.8-i*0.5,height:2.6,tessellation:8},scene);co.material=fMat;co.position.y=3.2+i*1.4;co.parent=rt;shadowGen.addShadowCaster(co);}}
for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,r=18+Math.random()*42,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<14&&Math.abs(z)<14)continue;let cl=false;for(let rp of riverPath){if(BABYLON.Vector3.Distance(new BABYLON.Vector3(x,0,z),new BABYLON.Vector3(rp.x,0,rp.z))<8)cl=true;}if(cl)continue;pine(x,z,0.8+Math.random()*0.6);}

const ruinRoot=new BABYLON.TransformNode("ruin",scene);ruinRoot.parent=islandRoot;ruinRoot.position.set(52,5.2,-38);
const ruin=BABYLON.MeshBuilder.CreateCylinder("ruin",{diameter:6.8,height:14,tessellation:14},scene);ruin.material=stoneMat;ruin.position.y=7;ruin.parent=ruinRoot;shadowGen.addShadowCaster(ruin);
for(let i=0;i<14;i++){const a=i/14*Math.PI*2;if(Math.random()>0.55){const pc=BABYLON.MeshBuilder.CreateBox("rp",{width:0.9,height:1.8,depth:0.9},scene);pc.material=stoneMat;pc.position.set(Math.cos(a)*3.1,14.2+Math.random()*1.2,Math.sin(a)*3.1);pc.parent=ruinRoot;}}

function waterfall(x,z){const rt=new BABYLON.TransformNode("wf",scene);rt.parent=islandRoot;rt.position.set(x,-6,z);const pl=BABYLON.MeshBuilder.CreatePlane("wfP",{width:6,height:30},scene);pl.parent=rt;pl.position.set(0,2,0);const m=new BABYLON.StandardMaterial("wfm",scene);m.diffuseColor=new BABYLON.Color3(0.6,0.9,1);m.emissiveColor=new BABYLON.Color3(0.2,0.5,0.6);m.alpha=0.72;const dt=new BABYLON.DynamicTexture("wft",128,scene);const c=dt.getContext();c.fillStyle="rgba(180,230,255,0.3)";c.fillRect(0,0,128,256);for(let i=0;i<200;i++){c.fillStyle="rgba(255,255,255,"+(0.2+Math.random()*0.5)+")";c.fillRect(Math.random()*128,Math.random()*256,1,10+Math.random()*30);}dt.update();m.diffuseTexture=dt;m.diffuseTexture.vScale=2;pl.material=m;const ps=new BABYLON.ParticleSystem("ps"+Math.random(),600,scene);ps.particleTexture=new BABYLON.Texture("https://cdn.babylonjs.com/textures/flare.png",scene);ps.emitter=new BABYLON.Vector3(x,-4,z);ps.minEmitBox=new BABYLON.Vector3(-1,0,-0.5);ps.maxEmitBox=new BABYLON.Vector3(1,0,0.5);ps.color1=new BABYLON.Color4(0.7,0.85,1,0.6);ps.color2=new BABYLON.Color4(0.6,0.8,1,0.2);ps.minSize=0.8;ps.maxSize=2.2;ps.minLifeTime=1.2;ps.maxLifeTime=2.5;ps.emitRate=60;ps.direction1=new BABYLON.Vector3(0,-1,0);ps.direction2=new BABYLON.Vector3(0.3,-1,0.3);ps.minEmitPower=2;ps.maxEmitPower=5;ps.gravity=new BABYLON.Vector3(0,-9.8,0);ps.start();}
waterfall(52,-52);waterfall(-46,50);

let t=0;scene.registerBeforeRender(()=>{const dt=engine.getDeltaTime()*0.001;t+=dt;islandRoot.position.y=-6+Math.sin(t*0.35)*1.1;islandRoot.rotation.y=Math.sin(t*0.08)*0.12;if(waterMat.albedoTexture)waterMat.albedoTexture.vOffset-=dt*0.35;wNode.rotation.x+=dt*1.2;scene.meshes.forEach(m=>{if(m.name.includes("wfP")&&m.material&&m.material.diffuseTexture)m.material.diffuseTexture.vOffset+=dt*0.9;});});
engine.runRenderLoop(()=>scene.render());window.addEventListener("resize",()=>engine.resize());
setTimeout(()=>document.getElementById("loader").classList.add("hidden"),1200);
</script>
</body>
</html>
