<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'Georgia', serif;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Georgia', serif;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        
        #controls h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        #controls p {
            margin: 5px 0;
            opacity: 0.9;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="loading">Building the Floating Island...</div>
    <div id="controls">
        <h3>🏰 Medieval Island Controls</h3>
        <p>🖱️ Left Click + Drag: Rotate</p>
        <p>🖱️ Right Click + Drag: Pan</p>
        <p>🖱️ Scroll: Zoom</p>
        <p>⌨️ Space: Reset View</p>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        
        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.1, 0.15, 0.25);
            
            // Fog for depth
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogDensity = 0.008;
            scene.fogColor = new BABYLON.Color3(0.15, 0.2, 0.35);
            
            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 2.5, 80, new BABYLON.Vector3(0, 5, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 30;
            camera.upperRadiusLimit = 150;
            camera.wheelPrecision = 50;
            
            // Lighting
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;
            hemiLight.groundColor = new BABYLON.Color3(0.2, 0.15, 0.1);
            
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-0.5, -1, -0.5), scene);
            dirLight.intensity = 0.8;
            dirLight.diffuse = new BABYLON.Color3(1, 0.95, 0.8);
            
            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;
            
            // Materials
            const matGrass = new BABYLON.StandardMaterial("grass", scene);
            matGrass.diffuseColor = new BABYLON.Color3(0.3, 0.6, 0.25);
            matGrass.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            
            const matRock = new BABYLON.StandardMaterial("rock", scene);
            matRock.diffuseColor = new BABYLON.Color3(0.4, 0.35, 0.3);
            matRock.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            matRock.bumpTexture = new BABYLON.NoiseProceduralTexture("rockNoise", 256, scene);
            
            const matStone = new BABYLON.StandardMaterial("stone", scene);
            matStone.diffuseColor = new BABYLON.Color3(0.6, 0.58, 0.55);
            matStone.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            
            const matWood = new BABYLON.StandardMaterial("wood", scene);
            matWood.diffuseColor = new BABYLON.Color3(0.5, 0.35, 0.2);
            matWood.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            
            const matRoof = new BABYLON.StandardMaterial("roof", scene);
            matRoof.diffuseColor = new BABYLON.Color3(0.7, 0.3, 0.2);
            matRoof.specularColor = new BABYLON.Color3(0.1, 0.05, 0.05);
            
            const matWater = new BABYLON.StandardMaterial("water", scene);
            matWater.diffuseColor = new BABYLON.Color3(0.2, 0.7, 0.8);
            matWater.alpha = 0.7;
            matWater.specularColor = new BABYLON.Color3(0.8, 0.8, 0.9);
            matWater.emissiveColor = new BABYLON.Color3(0.05, 0.2, 0.25);
            
            const matTree = new BABYLON.StandardMaterial("tree", scene);
            matTree.diffuseColor = new BABYLON.Color3(0.15, 0.4, 0.2);
            
            const matLeaves = new BABYLON.StandardMaterial("leaves", scene);
            matLeaves.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.25);
            
            const matGold = new BABYLON.StandardMaterial("gold", scene);
            matGold.diffuseColor = new BABYLON.Color3(0.9, 0.75, 0.2);
            matGold.specularColor = new BABYLON.Color3(1, 0.9, 0.5);
            matGold.emissiveColor = new BABYLON.Color3(0.2, 0.15, 0.05);
            
            // === FLOATING ISLAND BASE ===
            const islandBase = BABYLON.MeshBuilder.CreateCylinder("island", {
                diameter: 50,
                height: 15,
                tessellation: 32
            }, scene);
            islandBase.position.y = -7;
            islandBase.material = matRock;
            shadowGenerator.addShadowCaster(islandBase);
            
            // Rocky bottom with noise
            const rockBottom = BABYLON.MeshBuilder.CreateSphere("rockBottom", {
                diameter: 45,
                segments: 16
            }, scene);
            rockBottom.position.y = -18;
            rockBottom.scaling = new BABYLON.Vector3(1, 0.6, 1);
            rockBottom.material = matRock;
            
            // Add rocky protrusions
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const rock = BABYLON.MeshBuilder.CreateSphere("rock" + i, { diameter: 8 + Math.random() * 6 }, scene);
                rock.position.x = Math.cos(angle) * 18;
                rock.position.z = Math.sin(angle) * 18;
                rock.position.y = -12 - Math.random() * 8;
                rock.scaling = new BABYLON.Vector3(1, 1.5 + Math.random(), 1);
                rock.material = matRock;
                shadowGenerator.addShadowCaster(rock);
            }
            
            // === GRASS TERRAIN ===
            const terrain = BABYLON.MeshBuilder.CreateGround("terrain", {
                width: 45,
                height: 45,
                subdivisions: 32
            }, scene);
            terrain.material = matGrass;
            terrain.receiveShadows = true;
            
            // Create height variations
            const positions = terrain.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const z = positions[i + 2];
                const dist = Math.sqrt(x * x + z * z);
                if (dist < 20) {
                    positions[i + 1] = Math.sin(x * 0.3) * Math.cos(z * 0.3) * 1.5 + Math.random() * 0.3;
                } else {
                    positions[i + 1] = -2 + Math.random() * 0.5; // Edge falls off
                }
            }
            terrain.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
            terrain.createNormals(true);
            
            // === CENTRAL CASTLE ===
            function createCastle() {
                const castleGroup = new BABYLON.TransformNode("castle", scene);
                
                // Main keep
                const keep = BABYLON.MeshBuilder.CreateBox("keep", { width: 8, height: 12, depth: 8 }, scene);
                keep.position.y = 6;
                keep.parent = castleGroup;
                keep.material = matStone;
                shadowGenerator.addShadowCaster(keep);
                
                // Keep roof
                const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", {
                    diameter: 10,
                    height: 4,
                    tessellation: 4
                }, scene);
                keepRoof.position.y = 14;
                keepRoof.rotation.y = Math.PI / 4;
                keepRoof.parent = castleGroup;
                keepRoof.material = matRoof;
                shadowGenerator.addShadowCaster(keepRoof);
                
                // Corner towers
                const towerPositions = [
                    [-4, -4], [4, -4], [-4, 4], [4, 4]
                ];
                
                towerPositions.forEach((pos, i) => {
                    const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + i, {
                        diameter: 3,
                        height: 10
                    }, scene);
                    tower.position.x = pos[0];
                    tower.position.z = pos[1];
                    tower.position.y = 5;
                    tower.parent = castleGroup;
                    tower.material = matStone;
                    shadowGenerator.addShadowCaster(tower);
                    
                    // Tower roof
                    const tRoof = BABYLON.MeshBuilder.CreateCylinder("tRoof" + i, {
                        diameter: 4,
                        height: 3,
                        tessellation: 4
                    }, scene);
                    tRoof.position.x = pos[0];
                    tRoof.position.z = pos[1];
                    tRoof.position.y = 11.5;
                    tRoof.parent = castleGroup;
                    tRoof.material = matRoof;
                    shadowGenerator.addShadowCaster(tRoof);
                    
                    // Tower windows
                    for (let j = 0; j < 3; j++) {
                        const window = BABYLON.MeshBuilder.CreateBox("win" + i + "_" + j, { width: 0.4, height: 0.8, depth: 0.2 }, scene);
                        window.position.x = pos[0] + (pos[0] > 0 ? 1.4 : -1.4);
                        window.position.z = pos[1];
                        window.position.y = 3 + j * 2.5;
                        window.parent = castleGroup;
                        window.material = matWood;
                    }
                });
                
                // Castle gate
                const gate = BABYLON.MeshBuilder.CreateBox("gate", { width: 3, height: 4, depth: 1 }, scene);
                gate.position.z = 4.5;
                gate.position.y = 2;
                gate.parent = castleGroup;
                gate.material = matWood;
                
                // Portcullis bars
                for (let i = 0; i < 5; i++) {
                    const bar = BABYLON.MeshBuilder.CreateBox("bar" + i, { width: 0.1, height: 3.5, depth: 0.8 }, scene);
                    bar.position.x = -1 + i * 0.5;
                    bar.position.z = 4.6;
                    bar.position.y = 2;
                    bar.parent = castleGroup;
                    bar.material = matGold;
                }
                
                // Walls connecting towers
                const wallPositions = [
                    { x: 0, z: -4, w: 5, d: 1, ry: 0 },
                    { x: 0, z: 4, w: 5, d: 1, ry: 0 },
                    { x: -4, z: 0, w: 1, d: 5, ry: 0 },
                    { x: 4, z: 0, w: 1, d: 5, ry: 0 }
                ];
                
                wallPositions.forEach((w, i) => {
                    const wall = BABYLON.MeshBuilder.CreateBox("wall" + i, {
                        width: w.w,
                        height: 7,
                        depth: w.d
                    }, scene);
                    wall.position.x = w.x;
                    wall.position.z = w.z;
                    wall.position.y = 3.5;
                    wall.rotation.y = w.ry;
                    wall.parent = castleGroup;
                    wall.material = matStone;
                    shadowGenerator.addShadowCaster(wall);
                    
                    // Crenellations
                    for (let c = 0; c < 4; c++) {
                        const cren = BABYLON.MeshBuilder.CreateBox("cren" + i + "_" + c, { width: 0.6, height: 0.8, depth: 0.6 }, scene);
                        cren.position.x = w.x + (w.w > w.d ? -1.5 + c : 0);
                        cren.position.z = w.z + (w.d > w.w ? -1.5 + c : 0);
                        cren.position.y = 7.4;
                        cren.parent = castleGroup;
                        cren.material = matStone;
                    }
                });
                
                // Flag on keep
                const flagPole = BABYLON.MeshBuilder.CreateCylinder("flagPole", { diameter: 0.1, height: 5 }, scene);
                flagPole.position.y = 16.5;
                flagPole.parent = castleGroup;
                flagPole.material = matWood;
                
                const flag = BABYLON.MeshBuilder.CreateBox("flag", { width: 2, height: 1.2, depth: 0.05 }, scene);
                flag.position.y = 18;
                flag.position.x = 1;
                flag.parent = castleGroup;
                flag.material = matRoof;
                
                // Animate flag
                scene.registerBeforeRender(() => {
                    flag.rotation.y = Math.sin(Date.now() * 0.003) * 0.3;
                });
                
                castleGroup.position = new BABYLON.Vector3(0, 1, -5);
                return castleGroup;
            }
            
            createCastle();
            
            // === VILLAGE HOUSES ===
            function createHouse(x, z, rotation, scale = 1) {
                const houseGroup = new BABYLON.TransformNode("house", scene);
                
                // Main building
                const house = BABYLON.MeshBuilder.CreateBox("houseBody", {
                    width: 3 * scale,
                    height: 2.5 * scale,
                    depth: 2.5 * scale
                }, scene);
                house.position.y = 1.25 * scale;
                house.parent = houseGroup;
                house.material = matWood;
                shadowGenerator.addShadowCaster(house);
                
                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {
                    diameter: 4 * scale,
                    height: 2 * scale,
                    tessellation: 3
                }, scene);
                roof.position.y = 3 * scale;
                roof.rotation.z = Math.PI / 2;
                roof.rotation.y = Math.PI / 2;
                roof.parent = houseGroup;
                roof.material = matRoof;
                shadowGenerator.addShadowCaster(roof);
                
                // Door
                const door = BABYLON.MeshBuilder.CreateBox("door", { width: 0.8 * scale, height: 1.5 * scale, depth: 0.1 * scale }, scene);
                door.position.z = 1.26 * scale;
                door.position.y = 0.75 * scale;
                door.parent = houseGroup;
                door.material = matWood;
                
                // Window
                const window = BABYLON.MeshBuilder.CreateBox("window", { width: 0.6 * scale, height: 0.6 * scale, depth: 0.1 * scale }, scene);
                window.position.z = 1.26 * scale;
                window.position.y = 1.8 * scale;
                window.position.x = 0.8 * scale;
                window.parent = houseGroup;
                window.material = matStone;
                
                // Chimney
                const chimney = BABYLON.MeshBuilder.CreateBox("chimney", { width: 0.5 * scale, height: 1.5 * scale, depth: 0.5 * scale }, scene);
                chimney.position.x = -0.8 * scale;
                chimney.position.z = -0.8 * scale;
                chimney.position.y = 3.5 * scale;
                chimney.parent = houseGroup;
                chimney.material = matStone;
                
                // Smoke particles
                const smoke = new BABYLON.ParticleSystem("smoke", 50, scene);
                smoke.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                smoke.emitter = new BABYLON.Vector3(x - 0.8 * scale, 4 * scale, z - 0.8 * scale);
                smoke.minEmitBox = new BABYLON.Vector3(-0.1, 0, -0.1);
                smoke.maxEmitBox = new BABYLON.Vector3(0.1, 0, 0.1);
                smoke.color1 = new BABYLON.Color4(0.8, 0.8, 0.8, 0.5);
                smoke.color2 = new BABYLON.Color4(0.6, 0.6, 0.6, 0.3);
                smoke.minSize = 0.1;
                smoke.maxSize = 0.4;
                smoke.minLifeTime = 1;
                smoke.maxLifeTime = 3;
                smoke.emitRate = 5;
                smoke.gravity = new BABYLON.Vector3(0, 0.5, 0);
                smoke.start();
                
                houseGroup.position = new BABYLON.Vector3(x, 0, z);
                houseGroup.rotation.y = rotation;
                
                return houseGroup;
            }
            
            // Create village houses
            createHouse(-12, 5, 0.3, 1.2);
            createHouse(-15, 10, -0.5, 1);
            createHouse(-8, 12, 0.8, 0.9);
            createHouse(-18, 2, 0.2, 1.1);
            createHouse(10, 8, -0.3, 1);
            createHouse(14, 12, 0.6, 0.95);
            
            // === TAVERN ===
            function createTavern() {
                const tavernGroup = new BABYLON.TransformNode("tavern", scene);
                
                // Main building - larger
                const tavern = BABYLON.MeshBuilder.CreateBox("tavernBody", { width: 5, height: 3, depth: 4 }, scene);
                tavern.position.y = 1.5;
                tavern.parent = tavernGroup;
                tavern.material = matWood;
                shadowGenerator.addShadowCaster(tavern);
                
                // Second floor overhang
                const upper = BABYLON.MeshBuilder.CreateBox("upper", { width: 6, height: 2, depth: 4.5 }, scene);
                upper.position.y = 4;
                upper.parent = tavernGroup;
                upper.material = matWood;
                shadowGenerator.addShadowCaster(upper);
                
                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", {
                    diameter: 7,
                    height: 2.5,
                    tessellation: 3
                }, scene);
                roof.position.y = 6;
                roof.rotation.z = Math.PI / 2;
                roof.parent = tavernGroup;
                roof.material = matRoof;
                shadowGenerator.addShadowCaster(roof);
                
                // Sign
                const signPost = BABYLON.MeshBuilder.CreateBox("signPost", { width: 0.2, height: 1.5, depth: 0.2 }, scene);
                signPost.position.x = 3;
                signPost.position.y = 3;
                signPost.parent = tavernGroup;
                signPost.material = matWood;
                
                const sign = BABYLON.MeshBuilder.CreateBox("sign", { width: 1.5, height: 1, depth: 0.1 }, scene);
                sign.position.x = 3.5;
                sign.position.y = 3.2;
                sign.rotation.y = Math.PI / 2;
                sign.parent = tavernGroup;
                sign.material = matGold;
                
                // Lanterns
                [-2, 2].forEach(x => {
                    const lantern = BABYLON.MeshBuilder.CreateSphere("lantern", { diameter: 0.4 }, scene);
                    lantern.position.x = x;
                    lantern.position.z = 2.3;
                    lantern.position.y = 2.5;
                    lantern.parent = tavernGroup;
                    lantern.material = matGold;
                    
                    const light = new BABYLON.PointLight("lanternLight" + x, new BABYLON.Vector3(0, 0, 0), scene);
                    light.parent = lantern;
                    light.diffuse = new BABYLON.Color3(1, 0.8, 0.4);
                    light.intensity = 0.5;
                    light.range = 5;
                });
                
                tavernGroup.position = new BABYLON.Vector3(-5, 0, 15);
                return tavernGroup;
            }
            
            createTavern();
            
            // === WATERMILL ===
            function createWatermill() {
                const millGroup = new BABYLON.TransformNode("mill", scene);
                
                // Mill building
                const mill = BABYLON.MeshBuilder.CreateBox("millBody", { width: 4, height: 4, depth: 3 }, scene);
                mill.position.y = 2;
                mill.parent = millGroup;
                mill.material = matWood;
                shadowGenerator.addShadowCaster(mill);
                
                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {
                    diameter: 5,
                    height: 2,
                    tessellation: 3
                }, scene);
                roof.position.y = 5;
                roof.rotation.z = Math.PI / 2;
                roof.parent = millGroup;
                roof.material = matRoof;
                
                // Water wheel
                const wheelGroup = new BABYLON.TransformNode("wheel", scene);
                wheelGroup.parent = millGroup;
                wheelGroup.position.x = -2.5;
                wheelGroup.position.y = 1;
                
                const wheelRim = BABYLON.MeshBuilder.CreateTorus("wheelRim", {
                    diameter: 3,
                    thickness: 0.2
                }, scene);
                wheelRim.parent = wheelGroup;
                wheelRim.material = matWood;
                
                // Wheel spokes and buckets
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const spoke = BABYLON.MeshBuilder.CreateBox("spoke" + i, { width: 0.1, height: 1.4, depth: 0.1 }, scene);
                    spoke.position.x = Math.cos(angle) * 0.7;
                    spoke.position.y = Math.sin(angle) * 0.7;
                    spoke.rotation.z = angle;
                    spoke.parent = wheelGroup;
                    spoke.material = matWood;
                    
                    const bucket = BABYLON.MeshBuilder.CreateBox("bucket" + i, { width: 0.4, height: 0.3, depth: 0.5 }, scene);
                    bucket.position.x = Math.cos(angle) * 1.4;
                    bucket.position.y = Math.sin(angle) * 1.4;
                    bucket.parent = wheelGroup;
                    bucket.material = matWood;
                }
                
                // Animate wheel
                scene.registerBeforeRender(() => {
                    wheelGroup.rotation.z += 0.01;
                });
                
                millGroup.position = new BABYLON.Vector3(15, 0, -5);
                millGroup.rotation.y = -Math.PI / 4;
                
                return millGroup;
            }
            
            createWatermill();
            
            // === RIVER ===
            function createRiver() {
                // Main river bed
                const river = BABYLON.MeshBuilder.CreateGround("river", {
                    width: 8,
                    height: 35
                }, scene);
                river.position.x = 8;
                river.position.z = 0;
                river.position.y = 0.1;
                river.material = matWater;
                
                // River animation
                const riverMaterial = matWater;
                scene.registerBeforeRender(() => {
                    riverMaterial.alpha = 0.6 + Math.sin(Date.now() * 0.001) * 0.1;
                });
                
                // Waterfall
                const waterfall = BABYLON.MeshBuilder.CreateGround("waterfall", {
                    width: 6,
                    height: 10
                }, scene);
                waterfall.position.x = 8;
                waterfall.position.z = -22;
                waterfall.position.y = -5;
                waterfall.rotation.x = Math.PI / 6;
                waterfall.material = matWater;
                
                // Waterfall particles
                const waterfallParticles = new BABYLON.ParticleSystem("waterfallParts", 200, scene);
                waterfallParticles.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                waterfallParticles.emitter = new BABYLON.Vector3(8, 0, -20);
                waterfallParticles.minEmitBox = new BABYLON.Vector3(-2, 0, 0);
                waterfallParticles.maxEmitBox = new BABYLON.Vector3(2, 0, 0);
                waterfallParticles.color1 = new BABYLON.Color4(0.3, 0.8, 0.9, 0.8);
                waterfallParticles.color2 = new BABYLON.Color4(0.2, 0.7, 0.8, 0.4);
                waterfallParticles.minSize = 0.2;
                waterfallParticles.maxSize = 0.6;
                waterfallParticles.minLifeTime = 1;
                waterfallParticles.maxLifeTime = 2;
                waterfallParticles.emitRate = 50;
                waterfallParticles.gravity = new BABYLON.Vector3(0, -5, -2);
                waterfallParticles.start();
                
                // Foam at base
                const foam = BABYLON.MeshBuilder.CreateGround("foam", {
                    width: 8,
                    height: 6
                }, scene);
                foam.position.x = 8;
                foam.position.z = -26;
                foam.position.y = -10;
                const matFoam = new BABYLON.StandardMaterial("foam", scene);
                matFoam.diffuseColor = new BABYLON.Color3(0.9, 0.95, 1);
                matFoam.alpha = 0.8;
                foam.material = matFoam;
            }
            
            createRiver();
            
            // === BRIDGES ===
            function createBridge(x, z, rotation) {
                const bridgeGroup = new BABYLON.TransformNode("bridge", scene);
                
                // Bridge deck
                const deck = BABYLON.MeshBuilder.CreateBox("deck", { width: 3, height: 0.3, depth: 6 }, scene);
                deck.position.y = 0.8;
                deck.parent = bridgeGroup;
                deck.material = matWood;
                
                // Railings
                [-1.3, 1.3].forEach(rx => {
                    const rail = BABYLON.MeshBuilder.CreateBox("rail", { width: 0.2, height: 0.8, depth: 6 }, scene);
                    rail.position.x = rx;
                    rail.position.y = 1.2;
                    rail.parent = bridgeGroup;
                    rail.material = matWood;
                    
                    // Posts
                    for (let i = 0; i < 4; i++) {
                        const post = BABYLON.MeshBuilder.CreateBox("post", { width: 0.25, height: 1.2, depth: 0.25 }, scene);
                        post.position.x = rx;
                        post.position.z = -2 + i * 1.3;
                        post.position.y = 0.6;
                        post.parent = bridgeGroup;
                        post.material = matWood;
                    }
                });
                
                bridgeGroup.position = new BABYLON.Vector3(x, 0, z);
                bridgeGroup.rotation.y = rotation;
            }
            
            createBridge(8, 5, 0);
            createBridge(8, -10, 0);
            
            // === MARKET STALLS ===
            function createMarketStall(x, z, rotation) {
                const stallGroup = new BABYLON.TransformNode("stall", scene);
                
                // Table
                const table = BABYLON.MeshBuilder.CreateBox("table", { width: 2, height: 0.1, depth: 1.2 }, scene);
                table.position.y = 0.8;
                table.parent = stallGroup;
                table.material = matWood;
                
                // Legs
                [[-0.9, -0.5], [0.9, -0.5], [-0.9, 0.5], [0.9, 0.5]].forEach(pos => {
                    const leg = BABYLON.MeshBuilder.CreateBox("leg", { width: 0.1, height: 0.8, depth: 0.1 }, scene);
                    leg.position.x = pos[0];
                    leg.position.z = pos[1];
                    leg.position.y = 0.4;
                    leg.parent = stallGroup;
                    leg.material = matWood;
                });
                
                // Awning
                const awning = BABYLON.MeshBuilder.CreateCylinder("awning", {
                    diameter: 3,
                    height: 1.5,
                    tessellation: 3
                }, scene);
                awning.position.y = 1.8;
                awning.rotation.z = Math.PI / 2;
                awning.parent = stallGroup;
                
                const matAwning = new BABYLON.StandardMaterial("awning", scene);
                matAwning.diffuseColor = new BABYLON.Color3(
                    0.5 + Math.random() * 0.5,
                    0.3 + Math.random() * 0.4,
                    0.3 + Math.random() * 0.3
                );
                awning.material = matAwning;
                
                // Poles
                [-1.2, 1.2].forEach(px => {
                    const pole = BABYLON.MeshBuilder.CreateCylinder("pole", { diameter: 0.08, height: 2 }, scene);
                    pole.position.x = px;
                    pole.position.z = 0;
                    pole.position.y = 1;
                    pole.parent = stallGroup;
                    pole.material = matWood;
                });
                
                // Goods
                const goods = BABYLON.MeshBuilder.CreateBox("goods", { width: 1.2, height: 0.3, depth: 0.8 }, scene);
                goods.position.y = 1.1;
                goods.parent = stallGroup;
                const matGoods = new BABYLON.StandardMaterial("goods", scene);
                matGoods.diffuseColor = new BABYLON.Color3(0.8, 0.6, 0.3);
                goods.material = matGoods;
                
                stallGroup.position = new BABYLON.Vector3(x, 0, z);
                stallGroup.rotation.y = rotation;
            }
            
            // Market area
            createMarketStall(-2, 18, 0.3);
            createMarketStall(1, 19, -0.2);
            createMarketStall(-5, 17, 0.5);
            
            // === RUINED WATCHTOWER ===
            function createRuinedTower() {
                const ruinGroup = new BABYLON.TransformNode("ruin", scene);
                
                // Broken walls
                for (let i = 0; i < 4; i++) {
                    if (i === 1) continue; // Missing section
                    
                    const angle = (i / 4) * Math.PI * 2;
                    const wall = BABYLON.MeshBuilder.CreateBox("rwall" + i, {
                        width: 2,
                        height: 3 + Math.random() * 2,
                        depth: 0.5
                    }, scene);
                    wall.position.x = Math.cos(angle) * 1.5;
                    wall.position.z = Math.sin(angle) * 1.5;
                    wall.position.y = wall.scaling.y * 1.5;
                    wall.rotation.y = angle;
                    wall.parent = ruinGroup;
                    wall.material = matStone;
                    shadowGenerator.addShadowCaster(wall);
                }
                
                // Rubble
                for (let i = 0; i < 8; i++) {
                    const rubble = BABYLON.MeshBuilder.CreatePolyhedron("rubble" + i, { type: 1, size: 0.3 + Math.random() * 0.4 }, scene);
                    rubble.position.x = (Math.random() - 0.5) * 4;
                    rubble.position.z = (Math.random() - 0.5) * 4;
                    rubble.position.y = 0.2;
                    rubble.rotation.x = Math.random() * Math.PI;
                    rubble.rotation.z = Math.random() * Math.PI;
                    rubble.parent = ruinGroup;
                    rubble.material = matStone;
                }
                
                // Overgrown vines
                const vine = BABYLON.MeshBuilder.CreateBox("vine", { width: 0.3, height: 2, depth: 0.1 }, scene);
                vine.position.x = 1.5;
                vine.position.y = 1;
                vine.parent = ruinGroup;
                const matVine = new BABYLON.StandardMaterial("vine", scene);
                matVine.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.15);
                vine.material = matVine;
                
                ruinGroup.position = new BABYLON.Vector3(18, 0, -12);
                ruinGroup.rotation.y = 0.5;
            }
            
            createRuinedTower();
            
            // === TREES ===
            function createPineTree(x, z, scale = 1) {
                const treeGroup = new BABYLON.TransformNode("tree", scene);
                
                // Trunk
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
                    diameterBottom: 0.4 * scale,
                    diameterTop: 0.25 * scale,
                    height: 2 * scale
                }, scene);
                trunk.position.y = 1 * scale;
                trunk.parent = treeGroup;
                trunk.material = matWood;
                shadowGenerator.addShadowCaster(trunk);
                
                // Foliage layers
                [1.5, 2.3, 3].forEach((y, i) => {
                    const foliage = BABYLON.MeshBuilder.CreateCylinder("foliage" + i, {
                        diameterBottom: 2.5 * scale - i * 0.5 * scale,
                        diameterTop: 0.1 * scale,
                        height: 1.5 * scale
                    }, scene);
                    foliage.position.y = y * scale;
                    foliage.parent = treeGroup;
                    foliage.material = matLeaves;
                    shadowGenerator.addShadowCaster(foliage);
                });
                
                treeGroup.position = new BABYLON.Vector3(x, 0, z);
                
                // Random rotation
                treeGroup.rotation.y = Math.random() * Math.PI * 2;
            }
            
            // Place trees
            const treePositions = [
                [-20, -5], [-22, 2], [-19, 8], [-16, -8],
                [20, 5], [22, -2], [18, 10], [16, -5],
                [-10, -15], [-5, -18], [5, -16], [12, -14],
                [-15, -12], [8, -18]
            ];
            
            treePositions.forEach(pos => {
                createPineTree(pos[0], pos[1], 0.8 + Math.random() * 0.4);
            });
            
            // === PATHS ===
            function createPath() {
                const pathPoints = [
                    new BABYLON.Vector3(0, 0.05, -1), // Castle gate
                    new BABYLON.Vector3(0, 0.05, 5),
                    new BABYLON.Vector3(-3, 0.05, 10),
                    new BABYLON.Vector3(-5, 0.05, 13), // Tavern
                    new BABYLON.Vector3(-2, 0.05, 16), // Market
                ];
                
                pathPoints.forEach((point, i) => {
                    if (i < pathPoints.length - 1) {
                        const next = pathPoints[i + 1];
                        const dist = BABYLON.Vector3.Distance(point, next);
                        const mid = BABYLON.Vector3.Center(point, next);
                        
                        const pathSegment = BABYLON.MeshBuilder.CreateBox("path" + i, {
                            width: 2,
                            height: 0.05,
                            depth: dist + 0.5
                        }, scene);
                        pathSegment.position = mid;
                        pathSegment.lookAt(next);
                        pathSegment.rotation.x = Math.PI / 2;
                        
                        const matPath = new BABYLON.StandardMaterial("path", scene);
                        matPath.diffuseColor = new BABYLON.Color3(0.55, 0.45, 0.35);
                        pathSegment.material = matPath;
                    }
                });
            }
            
            createPath();
            
            // === FLOATING PARTICLES ===
            const floatParticles = new BABYLON.ParticleSystem("floatParts", 100, scene);
            floatParticles.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            floatParticles.emitter = new BABYLON.Vector3(0, 10, 0);
            floatParticles.minEmitBox = new BABYLON.Vector3(-20, 0, -20);
            floatParticles.maxEmitBox = new BABYLON.Vector3(20, 5, 20);
            floatParticles.color1 = new BABYLON.Color4(1, 1, 0.8, 0.3);
            floatParticles.color2 = new BABYLON.Color4(0.8, 0.9, 1, 0.1);
            floatParticles.minSize = 0.05;
            floatParticles.maxSize = 0.2;
            floatParticles.minLifeTime = 3;
            floatParticles.maxLifeTime = 8;
            floatParticles.emitRate = 20;
            floatParticles.gravity = new BABYLON.Vector3(0, 0.2, 0);
            floatParticles.start();
            
            // === CLOUDS ===
            function createCloud(x, y, z, scale) {
                const cloudGroup = new BABYLON.TransformNode("cloud", scene);
                
                for (let i = 0; i < 5; i++) {
                    const puff = BABYLON.MeshBuilder.CreateSphere("puff" + i, {
                        diameter: 2 + Math.random()
                    }, scene);
                    puff.position.x = (Math.random() - 0.5) * 3;
                    puff.position.y = (Math.random() - 0.5) * 1;
                    puff.position.z = (Math.random() - 0.5) * 2;
                    puff.parent = cloudGroup;
                    
                    const matCloud = new BABYLON.StandardMaterial("cloud", scene);
                    matCloud.diffuseColor = new BABYLON.Color3(0.95, 0.95, 1);
                    matCloud.alpha = 0.7;
                    puff.material = matCloud;
                }
                
                cloudGroup.position = new BABYLON.Vector3(x, y, z);
                cloudGroup.scaling = new BABYLON.Vector3(scale, scale, scale);
                
                // Animate cloud
                scene.registerBeforeRender(() => {
                    cloudGroup.position.x += 0.01 * scale;
                    if (cloudGroup.position.x > 50) cloudGroup.position.x = -50;
                });
                
                return cloudGroup;
            }
            
            createCloud(-30, 25, -10, 2);
            createCloud(20, 30, 15, 1.5);
            createCloud(0, 35, -25, 1.8);
            
            // === AMBIENT ANIMATION ===
            // Gentle island bobbing
            scene.registerBeforeRender(() => {
                islandBase.position.y = -7 + Math.sin(Date.now() * 0.0005) * 0.3;
                rockBottom.position.y = -18 + Math.sin(Date.now() * 0.0005) * 0.3;
                terrain.position.y = Math.sin(Date.now() * 0.0005) * 0.3;
            });
            
            // Hide loading
            document.getElementById("loading").style.opacity = 0;
            
            // Space key to reset camera
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    camera.alpha = -Math.PI / 4;
                    camera.beta = Math.PI / 2.5;
                    camera.radius = 80;
                    camera.target = new BABYLON.Vector3(0, 5, 0);
                }
            });
            
            return scene;
        };
        
        const scene = createScene();
        
        engine.runRenderLoop(function () {
            scene.render();
        });
        
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
