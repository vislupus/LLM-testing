<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Medieval Island Diorama</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: opacity 0.5s;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
    </style>
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Babylon.js Post Processes -->
    <script src="https://cdn.babylonjs.com/postProcesses/babylonjs.postProcesses.min.js"></script>
</head>
<body>

    <div id="loading">Carving the Realm...</div>
    <div id="ui">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // --- Configuration ---
        const CONFIG = {
            islandRadius: 40,
            castleHeight: 25,
            treeCount: 60,
            houseCount: 12,
            colors: {
                sky: new BABYLON.Color3(0.6, 0.8, 1.0),
                grass: new BABYLON.Color3(0.2, 0.6, 0.2),
                grassDark: new BABYLON.Color3(0.15, 0.5, 0.15),
                stone: new BABYLON.Color3(0.65, 0.65, 0.7),
                stoneDark: new BABYLON.Color3(0.5, 0.5, 0.55),
                wood: new BABYLON.Color3(0.55, 0.35, 0.2),
                woodDark: new BABYLON.Color3(0.35, 0.2, 0.1),
                roof: new BABYLON.Color3(0.6, 0.3, 0.2),
                water: new BABYLON.Color3(0.2, 0.8, 0.9),
                waterfall: new BABYLON.Color3(0.9, 0.95, 1.0)
            }
        };

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = CONFIG.colors.sky;
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogDensity = 0.008;
            scene.fogColor = CONFIG.colors.sky;

            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 2.5, 120, new BABYLON.Vector3(0, 10, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 60;
            camera.upperRadiusLimit = 200;
            camera.wheelPrecision = 50;

            // Lighting (Soft, Studio-like)
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;
            hemiLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.15);

            const dirLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.intensity = 1.2;
            dirLight.position = new BABYLON.Vector3(50, 100, 50);

            // Post Processing for "Miniature/Handcrafted" Look
            const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.6;
            pipeline.bloomWeight = 0.4;
            pipeline.imageProcessing.toneMappingEnabled = true;
            pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
            pipeline.imageProcessing.exposure = 1.2;

            // --- Materials ---
            const createMat = (color, name, roughness = 0.8, specular = 0.1) => {
                const mat = new BABYLON.StandardMaterial(name, scene);
                mat.diffuseColor = color;
                mat.specularColor = new BABYLON.Color3(specular, specular, specular);
                mat.roughness = roughness;
                return mat;
            };

            const matGrass = createMat(CONFIG.colors.grass, "grass", 1.0, 0.0);
            const matStone = createMat(CONFIG.colors.stone, "stone", 0.9, 0.2);
            const matStoneDark = createMat(CONFIG.colors.stoneDark, "stoneDark", 0.9, 0.1);
            const matWood = createMat(CONFIG.colors.wood, "wood", 0.8, 0.1);
            const matRoof = createMat(CONFIG.colors.roof, "roof", 0.9, 0.1);
            const matWater = createMat(CONFIG.colors.water, "water", 0.2, 0.6);
            matWater.alpha = 0.9;
            const matWaterfall = createMat(CONFIG.colors.waterfall, "waterfall", 0.1, 0.8);

            // --- Island Base ---
            const islandGroup = new BABYLON.TransformNode("islandRoot");
            
            // Main Grass Top
            const ground = BABYLON.MeshBuilder.CreateCylinder("ground", {
                diameter: CONFIG.islandRadius * 2,
                height: 5,
                tessellation: 32
            }, scene);
            ground.material = matGrass;
            ground.parent = islandGroup;

            // Rocky Cliffs (Tapered Cylinder below)
            const cliffs = BABYLON.MeshBuilder.CreateCylinder("cliffs", {
                diameterTop: CONFIG.islandRadius * 1.8,
                diameterBottom: CONFIG.islandRadius * 0.8,
                height: 40,
                tessellation: 16,
                sideOrientation: BABYLON.Mesh.DOUBLESIDE
            }, scene);
            cliffs.position.y = -20;
            cliffs.material = matStoneDark;
            cliffs.parent = islandGroup;

            // Add some noise to cliffs using vertices (Simple procedural displacement)
            const positions = cliffs.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                // Only modify Y and radial distance slightly for rocky look
                if (positions[i+1] < 0) { // Below ground
                    const noise = Math.sin(positions[i] * 0.5) * Math.cos(positions[i+2] * 0.5) * 2;
                    positions[i] += noise;
                    positions[i+2] += noise;
                }
            }
            cliffs.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);

            // --- Central Castle ---
            const castleGroup = new BABYLON.TransformNode("castle");
            castleGroup.parent = islandGroup;

            // Keep (Main Tower)
            const keep = BABYLON.MeshBuilder.CreateCylinder("keep", {diameter: 12, height: CONFIG.castleHeight, tessellation: 8}, scene);
            keep.position.y = CONFIG.castleHeight / 2;
            keep.material = matStone;
            keep.parent = castleGroup;

            // Keep Roof
            const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", {diameterTop: 0, diameterBottom: 14, height: 8, tessellation: 8}, scene);
            keepRoof.position.y = CONFIG.castleHeight + 4;
            keepRoof.material = matRoof;
            keepRoof.parent = castleGroup;

            // Walls
            const wallRing = BABYLON.MeshBuilder.CreateTube("walls", {
                path: [new BABYLON.Vector3(0,0,0)], // Dummy path, we use cylinder logic manually or just a ring
                radius: 18,
                tubeRadius: 2,
                tessellation: 16
            }, scene);
            // Actually, let's use a torus or just place blocks for a ruined look
            const wallBase = BABYLON.MeshBuilder.CreateCylinder("wallBase", {diameter: 38, height: 8, tessellation: 16}, scene);
            // Cut out the middle
            const wallHole = BABYLON.MeshBuilder.CreateCylinder("wallHole", {diameter: 30, height: 9, tessellation: 16}, scene);
            // CSG is heavy, let's just make a ring of boxes
            for(let i=0; i<12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const x = Math.cos(angle) * 18;
                const z = Math.sin(angle) * 18;
                const tower = BABYLON.MeshBuilder.CreateCylinder("turret", {diameter: 5, height: 12, tessellation: 8}, scene);
                tower.position.set(x, 6, z);
                tower.material = matStone;
                tower.parent = castleGroup;
                
                // Connect walls
                if(i < 11) {
                    const nextAngle = ((i+1) / 12) * Math.PI * 2;
                    const nx = Math.cos(nextAngle) * 18;
                    const nz = Math.sin(nextAngle) * 18;
                    // Simple beam between towers would be complex, skipping for performance/style
                }
            }
            wallBase.setEnabled(false); 
            wallHole.setEnabled(false);

            // --- Village Houses ---
            const createHouse = (x, z, scale = 1) => {
                const houseGroup = new BABYLON.TransformNode("house");
                houseGroup.parent = islandGroup;
                houseGroup.position.set(x, 0, z);

                const body = BABYLON.MeshBuilder.CreateBox("body", {width: 4 * scale, height: 3 * scale, depth: 4 * scale}, scene);
                body.position.y = 1.5 * scale;
                body.material = matWood;
                body.parent = houseGroup;

                const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {diameterTop: 0, diameterBottom: 5 * scale, height: 2.5 * scale, tessellation: 4}, scene);
                roof.position.y = 4.2 * scale;
                roof.rotation.y = Math.PI / 4;
                roof.material = matRoof;
                roof.parent = houseGroup;
            };

            // Scatter houses
            for (let i = 0; i < CONFIG.houseCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 25 + Math.random() * 10;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                createHouse(x, z, 0.8 + Math.random() * 0.4);
            }

            // --- Nature (Trees) ---
            const createTree = (x, z) => {
                const treeGroup = new BABYLON.TransformNode("tree");
                treeGroup.parent = islandGroup;
                treeGroup.position.set(x, 0, z);

                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {diameterTop: 0.5, diameterBottom: 1, height: 3}, scene);
                trunk.position.y = 1.5;
                trunk.material = matWood;
                trunk.parent = treeGroup;

                const leaves = BABYLON.MeshBuilder.CreateCylinder("leaves", {diameterTop: 0, diameterBottom: 4, height: 6, tessellation: 6}, scene);
                leaves.position.y = 5;
                leaves.material = matGrassDark;
                leaves.parent = treeGroup;
            };

            for (let i = 0; i < CONFIG.treeCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 10 + Math.random() * 25;
                // Avoid castle area
                if (radius > 22) {
                    createTree(Math.cos(angle) * radius, Math.sin(angle) * radius);
                }
            }

            // --- River & Waterfall ---
            // Cut a river path using a long thin box rotated
            const river = BABYLON.MeshBuilder.CreateTube("river", {
                path: [
                    new BABYLON.Vector3(-30, 0.2, -30),
                    new BABYLON.Vector3(-10, 0.2, -10),
                    new BABYLON.Vector3(0, 0.2, 10),
                    new BABYLON.Vector3(20, 0.2, 30)
                ],
                radius: 3,
                tessellation: 8,
                sideOrientation: BABYLON.Mesh.DOUBLESIDE
            }, scene);
            river.material = matWater;
            river.parent = islandGroup;

            // Waterfall at the edge
            const waterfall = BABYLON.MeshBuilder.CreateCylinder("waterfall", {diameterTop: 4, diameterBottom: 2, height: 40}, scene);
            waterfall.position.set(20, -20, 30);
            waterfall.material = matWaterfall;
            waterfall.parent = islandGroup;

            // --- Ruined Watchtower ---
            const watchtower = BABYLON.MeshBuilder.CreateCylinder("watchtower", {diameter: 6, height: 15, tessellation: 6}, scene);
            watchtower.position.set(-35, 7.5, -35);
            watchtower.material = matStoneDark;
            watchtower.parent = islandGroup;
            // Make it look ruined by scaling top vertices (simplified by just making it shorter/broken visually via material or separate mesh)
            const ruinTop = BABYLON.MeshBuilder.CreateCylinder("ruinTop", {diameterTop: 4, diameterBottom: 6, height: 4, tessellation: 6}, scene);
            ruinTop.position.set(-35, 13, -35);
            ruinTop.rotation.z = 0.2; // Tilted
            ruinTop.material = matStoneDark;
            ruinTop.parent = islandGroup;

            // --- Bridges ---
            const createBridge = (x, z, rot) => {
                const bridgeGroup = new BABYLON.TransformNode("bridge");
                bridgeGroup.parent = islandGroup;
                bridgeGroup.position.set(x, 1, z);
                bridgeGroup.rotation.y = rot;

                const deck = BABYLON.MeshBuilder.CreateBox("deck", {width: 8, height: 0.5, depth: 3}, scene);
                deck.material = matWood;
                deck.parent = bridgeGroup;

                const railL = BABYLON.MeshBuilder.CreateBox("railL", {width: 8, height: 1, depth: 0.2}, scene);
                railL.position.set(0, 0.5, -1.4);
                railL.material = matWood;
                railL.parent = bridgeGroup;

                const railR = BABYLON.MeshBuilder.CreateBox("railR", {width: 8, height: 1, depth: 0.2}, scene);
                railR.position.set(0, 0.5, 1.4);
                railR.material = matWood;
                railR.parent = bridgeGroup;
            };

            createBridge(-10, -10, Math.PI / 4);
            createBridge(10, 20, -Math.PI / 4);

            // --- Animation ---
            let time = 0;
            scene.registerBeforeRender(() => {
                time += 0.005;
                // Gentle floating motion
                islandGroup.position.y = Math.sin(time) * 0.5;
                islandGroup.rotation.y = Math.cos(time * 0.5) * 0.05;
                
                // Water animation (scroll texture or move mesh)
                matWater.diffuseColor.r = 0.2 + Math.sin(time * 2) * 0.05;
            });

            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => document.getElementById('loading').style.display = 'none', 500);

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(function () {
                scene.render();
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
