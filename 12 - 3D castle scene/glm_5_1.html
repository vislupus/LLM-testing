<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Island Diorama</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue fallback */
            font-family: sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
    <!-- Load Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="loading">Crafting the Diorama...</div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

            const createScene = function() {
                // Scene Setup
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color4(0.6, 0.85, 1.0, 1.0); // Vibrant Sky Blue
                scene.ambientColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
                scene.fogDensity = 0.003;
                scene.fogColor = new BABYLON.Color3(0.7, 0.85, 1.0);

                // Camera - Orbiting around the island
                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 50, new BABYLON.Vector3(0, 5, 0), scene);
                camera.attachControl(canvas, true);
                camera.lowerRadiusLimit = 20;
                camera.upperRadiusLimit = 80;
                camera.wheelPrecision = 20;
                camera.panningSensibility = 0; // Lock panning to keep focus on diorama

                // Lighting - Soft, stylized tabletop lighting
                const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
                hemiLight.intensity = 0.7;
                hemiLight.diffuse = new BABYLON.Color3(1, 0.95, 0.9);
                hemiLight.groundColor = new BABYLON.Color3(0.3, 0.3, 0.5);

                const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, 1), scene);
                dirLight.position = new BABYLON.Vector3(20, 40, -20);
                dirLight.intensity = 1.2;
                dirLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

                // Shadows
                const shadowGenerator = new BABYLON.ShadowGenerator(2048, dirLight);
                shadowGenerator.useBlurExponentialShadowMap = true;
                shadowGenerator.blurKernel = 32;

                // --- MATERIALS (Vibrant, Matte, Stylized) ---
                const createMat = (name, color) => {
                    const mat = new BABYLON.StandardMaterial(name, scene);
                    mat.diffuseColor = color;
                    mat.specularColor = BABYLON.Color3.Black(); // Matte finish
                    return mat;
                };

                const grassMat = createMat("grass", new BABYLON.Color3(0.35, 0.75, 0.25));
                const dirtMat = createMat("dirt", new BABYLON.Color3(0.55, 0.4, 0.25));
                const rockMat = createMat("rock", new BABYLON.Color3(0.5, 0.45, 0.4));
                const darkRockMat = createMat("darkRock", new BABYLON.Color3(0.3, 0.28, 0.25));
                const woodMat = createMat("wood", new BABYLON.Color3(0.45, 0.25, 0.1));
                const stoneMat = createMat("stone", new BABYLON.Color3(0.75, 0.72, 0.68));
                const roofMat = createMat("roof", new BABYLON.Color3(0.7, 0.25, 0.2));
                const waterMat = createMat("water", new BABYLON.Color3(0.2, 0.8, 0.8));
                waterMat.alpha = 0.85;
                waterMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                waterMat.emissiveColor = new BABYLON.Color3(0.1, 0.3, 0.3);
                const pineMat = createMat("pine", new BABYLON.Color3(0.15, 0.45, 0.15));
                const snowMat = createMat("snow", new BABYLON.Color3(0.95, 0.98, 1.0));

                // --- ISLAND GENERATION ---
                const islandGroup = [];

                // Main Base (Inverted cone/cylinder)
                const base = BABYLON.MeshBuilder.CreateCylinder("base", { diameterTop: 32, diameterBottom: 12, height: 14, tessellation: 32 }, scene);
                base.position.y = -2;
                base.material = dirtMat;
                islandGroup.push(base);

                // Grass Top Layer
                const grassTop = BABYLON.MeshBuilder.CreateCylinder("grassTop", { diameterTop: 32, diameterBottom: 31.5, height: 1, tessellation: 32 }, scene);
                grassTop.position.y = 5;
                grassTop.material = grassMat;
                islandGroup.push(grassTop);

                // Rocky Cliffs (Scattered half-spheres and cones on the sides)
                for (let i = 0; i < 15; i++) {
                    const angle = (i / 15) * Math.PI * 2 + Math.random() * 0.4;
                    const r = 10 + Math.random() * 5;
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    const size = 2 + Math.random() * 4;
                    
                    const rock = BABYLON.MeshBuilder.CreateSphere("cliffRock" + i, { diameter: size, segments: 8 }, scene);
                    rock.position = new BABYLON.Vector3(x, -2 + Math.random() * 4, z);
                    rock.scaling.y = 0.6 + Math.random() * 0.8;
                    rock.material = Math.random() > 0.5 ? rockMat : darkRockMat;
                    islandGroup.push(rock);
                }

                // --- RIVER & WATERFALL ---
                // River path using a ribbon/tube on top of the island
                const riverPath = [
                    new BABYLON.Vector3(-12, 5.5, -4),
                    new BABYLON.Vector3(-8, 5.3, -2),
                    new BABYLON.Vector3(-4, 5.1, -4),
                    new BABYLON.Vector3(0, 5.2, -6),
                    new BABYLON.Vector3(6, 5.4, -4),
                    new BABYLON.Vector3(12, 5.5, -2),
                    new BABYLON.Vector3(15, 6, 0) // Edge point for waterfall
                ];
                
                const river = BABYLON.MeshBuilder.CreateTube("river", { path: riverPath, radius: 1.5, tessellation: 12, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
                river.material = waterMat;
                islandGroup.push(river);

                // Waterfall Particle System
                const waterfall = new BABYLON.ParticleSystem("waterfall", 2000, scene);
                waterfall.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
                waterfall.emitter = new BABYLON.Vector3(15, 6, 0); // Start at edge
                waterfall.minEmitBox = new BABYLON.Vector3(-0.5, 0, -0.5);
                waterfall.maxEmitBox = new BABYLON.Vector3(0.5, 0, 0.5);
                waterfall.direction1 = new BABYLON.Vector3(-0.5, -1, -0.5);
                waterfall.direction2 = new BABYLON.Vector3(0.5, -1, 0.5);
                waterfall.minEmitPower = 3;
                waterfall.maxEmitPower = 5;
                waterfall.updateSpeed = 0.01;
                waterfall.minLifeTime = 1.0;
                waterfall.maxLifeTime = 2.0;
                waterfall.emitRate = 500;
                waterfall.color1 = new BABYLON.Color4(0.6, 1, 1, 0.8);
                waterfall.color2 = new BABYLON.Color4(0.8, 1, 1, 0.9);
                waterfall.colorDead = new BABYLON.Color4(0.5, 0.8, 0.8, 0);
                waterfall.minSize = 0.1;
                waterfall.maxSize = 0.3;
                waterfall.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
                waterfall.gravity = new BABYLON.Vector3(0, -9.81, 0);
                waterfall.start();

                // Wooden Bridges
                const createBridge = (x, y, z, rotY) => {
                    const planks = BABYLON.MeshBuilder.CreateBox("bridge", { width: 3, height: 0.2, depth: 4 }, scene);
                    planks.position = new BABYLON.Vector3(x, y, z);
                    planks.rotation.y = rotY;
                    planks.material = woodMat;
                    
                    const rail1 = BABYLON.MeshBuilder.CreateCylinder("rail", { diameter: 0.15, height: 4 }, scene);
                    rail1.position = new BABYLON.Vector3(x - 1.4, y + 0.6, z);
                    rail1.rotation.z = Math.PI/2; rail1.rotation.y = rotY;
                    rail1.material = woodMat;
                    
                    const rail2 = rail1.clone("rail2");
                    rail2.position.x = x + 1.4;
                    
                    islandGroup.push(planks, rail1, rail2);
                };
                createBridge(-4, 5.4, -2, Math.PI/4);
                createBridge(6, 5.5, -4, -Math.PI/6);

                // --- VEGETATION (Pine Trees) ---
                const createPineTree = (x, y, z, scale) => {
                    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { diameterTop: 0.3, diameterBottom: 0.5, height: 2, tessellation: 8 }, scene);
                    trunk.position = new BABYLON.Vector3(x, y + 1, z);
                    trunk.material = woodMat;
                    
                    const leaves1 = BABYLON.MeshBuilder.CreateCylinder("l1", { diameterTop: 0, diameterBottom: 2.5, height: 3, tessellation: 8 }, scene);
                    leaves1.position = new BABYLON.Vector3(x, y + 3.5, z);
                    leaves1.material = pineMat;
                    
                    const leaves2 = BABYLON.MeshBuilder.CreateCylinder("l2", { diameterTop: 0, diameterBottom: 2, height: 2.5, tessellation: 8 }, scene);
                    leaves2.position = new BABYLON.Vector3(x, y + 5, z);
                    leaves2.material = pineMat;

                    const treeGroup = [trunk, leaves1, leaves2];
                    treeGroup.forEach(m => {
                        m.scaling = new BABYLON.Vector3(scale, scale, scale);
                        islandGroup.push(m);
                    });
                    return treeGroup;
                };

                // Forest edge
                for(let i=0; i<20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 10 + Math.random() * 4;
                    createPineTree(Math.cos(angle)*r, 5.2, Math.sin(angle)*r, 0.8 + Math.random()*0.5);
                }
                // Inner trees
                createPineTree(-3, 5.2, 5, 1.2);
                createPineTree(8, 5.2, 6, 1.1);

                // --- BUILDINGS ---

                // Helper: Create a House
                const createHouse = (x, y, z, width, height, rotY, hasChimney) => {
                    const body = BABYLON.MeshBuilder.CreateBox("houseBody", { width: width, height: height, depth: width*0.8 }, scene);
                    body.position = new BABYLON.Vector3(x, y + height/2, z);
                    body.rotation.y = rotY;
                    body.material = woodMat;

                    const roof = BABYLON.MeshBuilder.CreateCylinder("roof", { diameterTop: 0, diameterBottom: width*1.3, height: height*0.8, tessellation: 4 }, scene);
                    roof.position = new BABYLON.Vector3(x, y + height + height*0.4, z);
                    roof.rotation.y = rotY + Math.PI/4;
                    roof.material = roofMat;

                    const group = [body, roof];
                    
                    if(hasChimney) {
                        const chimney = BABYLON.MeshBuilder.CreateBox("chimney", { width: 0.5, height: 1.5, depth: 0.5 }, scene);
                        chimney.position = new BABYLON.Vector3(x + width*0.3, y + height + height*0.6, z - width*0.2);
                        chimney.rotation.y = rotY;
                        chimney.material = stoneMat;
                        group.push(chimney);
                    }
                    
                    group.forEach(m => islandGroup.push(m));
                };

                // Village Layout
                createHouse(-4, 5.2, 4, 2.5, 2, 0, true); // Tavern
                createHouse(-6, 5.2, 1, 1.5, 1.5, Math.PI/3, false);
                createHouse(4, 5.2, 5, 1.8, 1.8, -Math.PI/4, true);
                
                // Market Stalls
                const createStall = (x, y, z, rotY) => {
                    const pole1 = BABYLON.MeshBuilder.CreateCylinder("p1", { diameter: 0.15, height: 2 }, scene);
                    pole1.position = new BABYLON.Vector3(x-1, y+1, z-1);
                    pole1.material = woodMat;
                    const pole2 = pole1.clone("p2"); pole2.position.x = x+1;
                    const pole3 = pole1.clone("p3"); pole3.position.z = z+1;
                    const pole4 = pole1.clone("p4"); pole4.position.x = x-1; pole4.position.z = z+1;
                    
                    const top = BABYLON.MeshBuilder.CreateBox("stallTop", { width: 2.5, height: 0.1, depth: 2.5 }, scene);
                    top.position = new BABYLON.Vector3(x, y+2.1, z);
                    top.rotation.y = rotY;
                    top.material = createMat("stallFabric", new BABYLON.Color3(0.9, 0.8, 0.3)); // Yellow tent
                    
                    [pole1, pole2, pole3, pole4, top].forEach(m => islandGroup.push(m));
                };
                createStall(2, 5.2, 2, Math.PI/6);
                createStall(4, 5.2, 1, -Math.PI/4);

                // Riverside Mill
                const millBase = BABYLON.MeshBuilder.CreateCylinder("millBase", { diameter: 3, height: 4, tessellation: 12 }, scene);
                millBase.position = new BABYLON.Vector3(8, 7.2, -3);
                millBase.material = stoneMat;
                const millRoof = BABYLON.MeshBuilder.CreateCylinder("millRoof", { diameterTop: 0, diameterBottom: 3.5, height: 2, tessellation: 12 }, scene);
                millRoof.position = new BABYLON.Vector3(8, 9.2, -3);
                millRoof.material = roofMat;
                
                const millWheel = BABYLON.MeshBuilder.CreateTorus("millWheel", { diameter: 3, thickness: 0.3, tessellation: 16 }, scene);
                millWheel.position = new BABYLON.Vector3(6.5, 7.2, -3);
                millWheel.rotation.z = Math.PI/2;
                millWheel.material = woodMat;
                
                islandGroup.push(millBase, millRoof, millWheel);

                // --- CASTLE ---
                const castleCenter = new BABYLON.Vector3(0, 5.2, 0);
                
                // Keep
                const keep = BABYLON.MeshBuilder.CreateBox("keep", { width: 5, height: 10, depth: 5 }, scene);
                keep.position = castleCenter.add(new BABYLON.Vector3(0, 5, 0));
                keep.material = stoneMat;
                
                // Keep Tower
                const keepTower = BABYLON.MeshBuilder.CreateCylinder("keepTower", { diameterTop: 3, diameterBottom: 3.2, height: 14, tessellation: 8 }, scene);
                keepTower.position = castleCenter.add(new BABYLON.Vector3(0, 7, 0));
                keepTower.material = stoneMat;
                
                const keepTop = BABYLON.MeshBuilder.CreateCylinder("keepTop", { diameterTop: 0, diameterBottom: 4, height: 3, tessellation: 8 }, scene);
                keepTop.position = castleCenter.add(new BABYLON.Vector3(0, 14, 0));
                keepTop.material = roofMat;

                // Walls
                const wallFront = BABYLON.MeshBuilder.CreateBox("wF", { width: 12, height: 6, depth: 1 }, scene);
                wallFront.position = castleCenter.add(new BABYLON.Vector3(0, 3, 3));
                wallFront.material = stoneMat;
                
                const wallBack = wallFront.clone("wB");
                wallBack.position.z = -3;
                
                const wallLeft = BABYLON.MeshBuilder.CreateBox("wL", { width: 1, height: 6, depth: 6 }, scene);
                wallLeft.position = castleCenter.add(new BABYLON.Vector3(-3, 3, 0));
                wallLeft.material = stoneMat;
                
                const wallRight = wallLeft.clone("wR");
                wallRight.position.x = 3;

                // Corner Towers
                const createCornerTower = (x, z) => {
                    const t = BABYLON.MeshBuilder.CreateCylinder("cTow", { diameterTop: 2.5, diameterBottom: 3, height: 8, tessellation: 8 }, scene);
                    t.position = castleCenter.add(new BABYLON.Vector3(x, 4, z));
                    t.material = stoneMat;
                    const tTop = BABYLON.MeshBuilder.CreateCylinder("cTowTop", { diameterTop: 0, diameterBottom: 3.5, height: 2, tessellation: 8 }, scene);
                    tTop.position = castleCenter.add(new BABYLON.Vector3(x, 8, z));
                    tTop.material = roofMat;
                    islandGroup.push(t, tTop);
                };
                createCornerTower(-3, 3);
                createCornerTower(3, 3);
                createCornerTower(-3, -3);
                createCornerTower(3, -3);

                islandGroup.push(keep, keepTower, keepTop, wallFront, wallBack, wallLeft, wallRight);

                // --- RUINED WATCHTOWER ---
                const ruinBase = BABYLON.MeshBuilder.CreateCylinder("ruin", { diameterTop: 2, diameterBottom: 2.5, height: 6, tessellation: 8 }, scene);
                ruinBase.position = new BABYLON.Vector3(-14, 8.2, 0); // On the edge/ cliff
                ruinBase.material = darkRockMat;
                
                // Broken top (half cylinder)
                const ruinTop = BABYLON.MeshBuilder.CreateCylinder("ruinTop", { diameterTop: 2.2, diameterBottom: 2.2, height: 1, tessellation: 8, arc: Math.PI }, scene);
                ruinTop.position = new BABYLON.Vector3(-14, 11.2, 0);
                ruinTop.rotation.y = Math.PI/2;
                ruinTop.material = darkRockMat;

                islandGroup.push(ruinBase, ruinTop);

                // --- CLOUDS (To sell the floating island vibe) ---
                const createCloud = (x, y, z) => {
                    const cGroup = [];
                    const numSpheres = 3 + Math.floor(Math.random() * 3);
                    for(let i=0; i<numSpheres; i++) {
                        const s = BABYLON.MeshBuilder.CreateSphere("cloudS", { diameter: 2 + Math.random()*2, segments: 8 }, scene);
                        s.position = new BABYLON.Vector3(x + (i-1)*1.5, y + Math.random()*0.5, z + Math.random()*0.5);
                        s.material = snowMat; // Reusing white material
                        s.scaling.y = 0.5; // Flatten
                        cGroup.push(s);
                    }
                    return cGroup;
                };
                
                const clouds = [];
                clouds.push(...createCloud(-20, 8, 10));
                clouds.push(...createCloud(15, 12, -15));
                clouds.push(...createCloud(-5, -5, 20));

                // --- ADDING SHADOWS ---
                islandGroup.forEach(mesh => {
                    shadowGenerator.addShadowCaster(mesh);
                    mesh.receiveShadows = true;
                });
                
                // Ground doesn't exist, but ensure the island receives shadows on itself
                base.receiveShadows = true;
                grassTop.receiveShadows = true;

                // --- POST-PROCESSES (Miniature / Tilt-Shift Effect) ---
                const pipeline = new BABYLON.DefaultRenderingPipeline("default", true, scene, [camera]);
                pipeline.bloomEnabled = true;
                pipeline.bloomThreshold = 0.8;
                pipeline.bloomWeight = 0.3;
                pipeline.bloomKernel = 64;
                
                // Depth of Field for Tilt-Shift
                pipeline.depthOfFieldEnabled = true;
                pipeline.depthOfFieldBlurLevel = BABYLON.DepthOfFieldEffectBlurLevel.Low;
                pipeline.depthOfFieldFocalLength = 50; // Focus on the island
                pipeline.depthOfFieldFocusDistance = 5000; 
                pipeline.depthOfFieldAperture = 8; 

                // SSAO for crevice shadows
                const ssao = new BABYLON.SSAORenderingPipeline("ssao", scene, { ssaoRatio: 0.5, blurRatio: 0.5 });
                ssao.radius = 2;
                ssao.totalStrength = 0.5;
                ssao.base = 0.3;
                scene.postProcessManager.pipeline = ssao; // Basic attachment

                // --- ANIMATION LOOP ---
                let time = 0;
                scene.registerBeforeRender(function () {
                    time += engine.getDeltaTime() * 0.001;
                    
                    // Rotate mill wheel
                    millWheel.rotation.x += 0.02;

                    // Gentle floating animation for the island
                    base.position.y = -2 + Math.sin(time * 0.5) * 0.2;
                    grassTop.position.y = 5 + Math.sin(time * 0.5) * 0.2;
                    
                    // Floating ruins
                    ruinBase.position.y = 8.2 + Math.sin(time * 0.5) * 0.2;
                    ruinTop.position.y = 11.2 + Math.sin(time * 0.5) * 0.2;

                    // Clouds drift
                    clouds.forEach((c, i) => {
                        c.position.x += 0.005 * (i % 2 === 0 ? 1 : -1);
                        // Recycle clouds
                        if(c.position.x > 30) c.position.x = -30;
                        if(c.position.x < -30) c.position.x = 30;
                    });
                });

                // Hide loading text
                document.getElementById('loading').style.display = 'none';

                return scene;
            };

            const scene = createScene();

            engine.runRenderLoop(function () {
                scene.render();
            });

            window.addEventListener('resize', function () {
                engine.resize();
            });
        });
    </script>
</body>
</html>
