<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Medieval Floating Island Diorama</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Load Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <div id="loading">Crafting the diorama...</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.5, 0.7, 0.9); // Soft sky blue
            
            // --- Camera & Lighting ---
            // Isometric-style camera angle
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 3, 45, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 80;
            camera.wheelPrecision = 50;

            // Hemispheric light for ambient illumination
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;
            hemiLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.2);

            // Directional light for shadows
            const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(20, 40, 20);
            dirLight.intensity = 0.8;

            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;
            shadowGenerator.setDarkness(0.3);

            // --- Materials ---
            const createMat = (name, color, specular = 0.1) => {
                const mat = new BABYLON.StandardMaterial(name, scene);
                mat.diffuseColor = color;
                mat.specularColor = new BABYLON.Color3(specular, specular, specular);
                return mat;
            };

            const matGrass = createMat("grass", new BABYLON.Color3(0.3, 0.7, 0.3));
            const matRock = createMat("rock", new BABYLON.Color3(0.4, 0.4, 0.4));
            const matStone = createMat("stone", new BABYLON.Color3(0.6, 0.6, 0.65));
            const matWood = createMat("wood", new BABYLON.Color3(0.4, 0.25, 0.1));
            const matRoof = createMat("roof", new BABYLON.Color3(0.6, 0.2, 0.2));
            const matWater = createMat("water", new BABYLON.Color3(0.0, 0.8, 0.9));
            matWater.alpha = 0.7;
            matWater.specularPower = 128;

            // --- Helper Functions ---
            
            // Tree generator (Low poly pine)
            const createTree = (x, z, scale) => {
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height: 2 * scale, diameter: 0.5 * scale}, scene);
                trunk.position.set(x, 1 * scale, z);
                trunk.material = matWood;
                shadowGenerator.addShadowCaster(trunk);

                const leaves = BABYLON.MeshBuilder.CreateCylinder("leaves", {diameterTop: 0, diameterBottom: 2.5 * scale, height: 4 * scale, tessellation: 6}, scene);
                leaves.position.set(x, 3 * scale, z);
                leaves.material = matGrass; // Using grass mat for stylized foliage
                shadowGenerator.addShadowCaster(leaves);
                
                // Merge or parent
                leaves.setParent(trunk);
            };

            // House generator
            const createHouse = (x, z, rotation, scale = 1) => {
                const houseNode = new BABYLON.TransformNode("house", scene);
                
                // Base
                const base = BABYLON.MeshBuilder.CreateBox("base", {width: 2.5*scale, height: 2*scale, depth: 3*scale}, scene);
                base.position.y = 1 * scale;
                base.material = matWood;
                base.setParent(houseNode);
                shadowGenerator.addShadowCaster(base);

                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {diameter: 3.8*scale, height: 3.5*scale, tessellation: 3}, scene);
                roof.rotation.z = Math.PI / 2;
                roof.position.y = 2.8 * scale;
                roof.scaling.y = 0.5; // Flatten
                roof.material = matRoof;
                roof.setParent(houseNode);
                shadowGenerator.addShadowCaster(roof);

                // Door
                const door = BABYLON.MeshBuilder.CreateBox("door", {width: 0.6*scale, height: 1.2*scale, depth: 0.1}, scene);
                door.position.set(0, 0.6*scale, 1.51*scale);
                door.material = new BABYLON.StandardMaterial("doorMat", scene);
                door.material.diffuseColor = new BABYLON.Color3(0.2, 0.1, 0.0);
                door.setParent(houseNode);

                houseNode.position.set(x, 0, z);
                houseNode.rotation.y = rotation;
                
                return houseNode;
            };

            // --- The Island ---
            
            // Base shape (Ellipsoid-ish ground)
            const islandBase = BABYLON.MeshBuilder.CreateCylinder("island", {diameterTop: 30, diameterBottom: 10, height: 10, tessellation: 12}, scene);
            islandBase.scaling.y = 0.5;
            islandBase.position.y = -2;
            islandBase.material = matRock;
            islandBase.receiveShadows = true;

            // Grass top
            const grassTop = BABYLON.MeshBuilder.CreateCylinder("grass", {diameter: 30, height: 1, tessellation: 12}, scene);
            grassTop.position.y = 0.5;
            grassTop.material = matGrass;
            grassTop.receiveShadows = true;
            
            // Add some noise/bumps to grass (simple spheres merged visually)
            for(let i=0; i<15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const rad = Math.random() * 12;
                const bump = BABYLON.MeshBuilder.CreateSphere("bump", {diameter: 1 + Math.random()}, scene);
                bump.position.set(Math.cos(angle)*rad, 0.5, Math.sin(angle)*rad);
                bump.material = matGrass;
                bump.receiveShadows = true;
            }

            // --- The River ---
            // A ribbon cutting through
            const riverPath = [
                new BABYLON.Vector3(-15, 0.6, 10),
                new BABYLON.Vector3(-5, 0.6, 2),
                new BABYLON.Vector3(5, 0.6, -2),
                new BABYLON.Vector3(15, 0.6, -10)
            ];
            
            const river = BABYLON.MeshBuilder.CreateRibbon("river", {
                pathArray: [
                    riverPath.map(v => v.add(new BABYLON.Vector3(-2, 0, 0))),
                    riverPath.map(v => v.add(new BABYLON.Vector3(2, 0, 0)))
                ]
            }, scene);
            river.material = matWater;
            river.position.y = 0.1;

            // --- The Waterfall (Edge) ---
            // Find where river ends roughly at x=15
            const waterfallBase = new BABYLON.Vector3(15, 0, -10);
            
            // Particle system for water
            const particleSystem = new BABYLON.ParticleSystem("particles", 2000, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
            particleSystem.emitter = new BABYLON.Vector3(14, 0.5, -9); // Start of fall
            particleSystem.minEmitBox = new BABYLON.Vector3(-1, 0, -1);
            particleSystem.maxEmitBox = new BABYLON.Vector3(1, 0, 1);
            particleSystem.color1 = new BABYLON.Color4(0.7, 0.9, 1.0, 1.0);
            particleSystem.color2 = new BABYLON.Color4(0.2, 0.8, 1.0, 1.0);
            particleSystem.minSize = 0.1;
            particleSystem.maxSize = 0.3;
            particleSystem.minLifeTime = 0.5;
            particleSystem.maxLifeTime = 1.5;
            particleSystem.emitRate = 300;
            particleSystem.gravity = new BABYLON.Vector3(0, -9.8, -1); // Fall down and out
            particleSystem.direction1 = new BABYLON.Vector3(0, -1, 0);
            particleSystem.direction2 = new BABYLON.Vector3(0, -1, -0.5);
            particleSystem.start();

            // --- The Castle (Center) ---
            const castleNode = new BABYLON.TransformNode("castle", scene);
            
            // Main Keep
            const keep = BABYLON.MeshBuilder.CreateBox("keep", {width: 5, height: 8, depth: 5}, scene);
            keep.position.y = 4;
            keep.material = matStone;
            keep.setParent(castleNode);
            shadowGenerator.addShadowCaster(keep);

            // Towers
            const createTower = (x, z) => {
                const tower = BABYLON.MeshBuilder.CreateCylinder("tower", {diameter: 2.5, height: 10, tessellation: 8}, scene);
                tower.position.set(x, 5, z);
                tower.material = matStone;
                tower.setParent(castleNode);
                shadowGenerator.addShadowCaster(tower);
                
                const roof = BABYLON.MeshBuilder.CreateCylinder("towerr", {diameter: 2.8, height: 3, tessellation: 3}, scene);
                roof.position.set(x, 11.5, z);
                roof.rotation.z = Math.PI/2;
                roof.scaling.y = 0.5;
                roof.material = matRoof;
                roof.setParent(castleNode);
            };
            createTower(-3.5, 3.5);
            createTower(3.5, 3.5);

            // Walls
            const wall = BABYLON.MeshBuilder.CreateBox("wall", {width: 10, height: 4, depth: 1}, scene);
            wall.position.set(0, 2, 5);
            wall.material = matStone;
            wall.setParent(castleNode);
            shadowGenerator.addShadowCaster(wall);

            castleNode.position.set(0, 0.6, 0);

            // --- Village (Left side) ---
            createHouse(-8, 5, Math.PI / 4, 1.2);
            createHouse(-12, 2, -Math.PI / 6, 1.0);
            createHouse(-6, -4, Math.PI, 0.9);

            // Market Stall
            const stall = BABYLON.MeshBuilder.CreateBox("stall", {width: 2, height: 1.5, depth: 1.5}, scene);
            stall.position.set(-10, 0.75, -3);
            stall.material = matWood;
            shadowGenerator.addShadowCaster(stall);
            
            // Awning
            const awning = BABYLON.MeshBuilder.CreateBox("awning", {width: 2.5, height: 0.1, depth: 1}, scene);
            awning.position.set(-10, 1.5, -3);
            awning.rotation.x = 0.2;
            awning.material = new BABYLON.StandardMaterial("awningMat", scene);
            awning.material.diffuseColor = new BABYLON.Color3(0.8, 0.2, 0.2); // Red/White stripped usually, just red here
            awning.setParent(stall);

            // --- Riverside Mill ---
            const millNode = new BABYLON.TransformNode("mill", scene);
            const millBody = BABYLON.MeshBuilder.CreateBox("millb", {width: 3, height: 3, depth: 4}, scene);
            millBody.position.y = 1.5;
            millBody.material = matWood;
            millBody.setParent(millNode);
            shadowGenerator.addShadowCaster(millBody);

            const millRoof = BABYLON.MeshBuilder.CreateCylinder("millr", {diameter: 4.5, height: 3, tessellation: 3}, scene);
            millRoof.rotation.z = Math.PI / 2;
            millRoof.position.y = 3.5;
            millRoof.scaling.y = 0.6;
            millRoof.material = matRoof;
            millRoof.setParent(millNode);
            shadowGenerator.addShadowCaster(millRoof);

            // Water Wheel
            const wheel = BABYLON.MeshBuilder.CreateCylinder("wheel", {diameter: 2, height: 0.2, tessellation: 12}, scene);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(1.6, 1, 0);
            wheel.material = matWood;
            wheel.setParent(millNode);

            millNode.position.set(5, 0.6, 6);

            // --- Ruined Watchtower (Edge) ---
            const ruinNode = new BABYLON.TransformNode("ruin", scene);
            // Half tower
            const rTower = BABYLON.MeshBuilder.CreateCylinder("rt", {diameter: 2, height: 6, tessellation: 6, arc: 0.5}, scene);
            rTower.position.y = 3;
            rTower.material = matStone;
            rTower.setParent(ruinNode);
            shadowGenerator.addShadowCaster(rTower);

            // Battlements
            const batt = BABYLON.MeshBuilder.CreateBox("batt", {width: 2.2, height: 0.5, depth: 0.5}, scene);
            batt.position.set(0, 5.5, 0.5);
            batt.material = matStone;
            batt.setParent(ruinNode);

            ruinNode.position.set(10, 0.6, 10); // Edge of island
            ruinNode.rotation.y = -Math.PI / 4;

            // --- Vegetation (Pine Trees) ---
            // Clustered around edges and village
            const treePos = [
                [-14, -5], [-10, -8], [8, 8], [-5, 10], [12, 0], [14, 5], [-14, 8], [0, 12]
            ];
            
            treePos.forEach(pos => {
                createTree(pos[0], pos[1], 1 + Math.random() * 0.5);
            });

            // --- Bridges ---
            // Simple wooden plank bridge over river
            const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {width: 2, height: 0.2, depth: 6}, scene);
            bridge.position.set(0, 0.7, 0); // Crossing at x=0 roughly
            bridge.rotation.y = Math.PI / 2;
            bridge.material = matWood;
            shadowGenerator.addShadowCaster(bridge);

            // --- Post Processing (Vignette / Color Correction for Tabletop look) ---
            const pipeline = new BABYLON.DefaultRenderingPipeline(
                "defaultPipeline", 
                true, 
                scene, 
                [camera]
            );
            pipeline.samples = 4;
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.7;
            pipeline.bloomWeight = 0.4;
            pipeline.bloomKernel = 64;
            pipeline.bloomScale = 0.5;
            
            // Hide loading
            document.getElementById("loading").style.display = "none";

            // Animation loop
            scene.registerBeforeRender(() => {
                // Rotate Water Wheel
                wheel.rotation.x += 0.02;
                
                // Animate Water texture (fake flow)
                // Since we used a solid color, we can bob the mesh slightly or change texture offset if we had a texture.
                // For this procedural version, we'll just let the particles do the work.
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
