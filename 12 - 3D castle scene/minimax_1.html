<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 24px;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
    <!-- Load Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <div id="loading">Crafting the diorama...</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true);

            const createScene = function() {
                const scene = new BABYLON.Scene(engine);
                
                // 1. Setup Environment & Lighting (Tabletop Style)
                scene.clearColor = new BABYLON.Color3(0.7, 0.85, 0.9); // Soft Sky Blue
                scene.ambientColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                
                // Fog for depth
                scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
                scene.fogDensity = 0.005;
                scene.fogColor = new BABYLON.Color3(0.7, 0.85, 0.9);

                // Camera - ArcRotate for diorama view
                const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 3, 45, new BABYLON.Vector3(0, 2, 0), scene);
                camera.attachControl(canvas, true);
                camera.lowerRadiusLimit = 20;
                camera.upperRadiusLimit = 80;
                camera.wheelPrecision = 50;
                camera.useAutoRotationBehavior = true;
                camera.autoRotationBehavior.idleRotationSpeed = 0.05;

                // Lighting
                const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
                hemiLight.intensity = 0.6;
                hemiLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.2);

                const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
                dirLight.position = new BABYLON.Vector3(20, 40, 20);
                dirLight.intensity = 0.8;
                
                // Shadows
                const shadowGenerator = new BABYLON.ShadowGenerator(2048, dirLight);
                shadowGenerator.useBlurExponentialShadowMap = true;
                shadowGenerator.blurKernel = 32;
                shadowGenerator.setDarkness(0.3);

                // 2. Material Palette (Handcrafted Look)
                const matStone = new BABYLON.PBRMaterial("stone", scene);
                matStone.albedoColor = new BABYLON.Color3(0.5, 0.5, 0.55);
                matStone.roughness = 0.8;
                matStone.metallic = 0.1;

                const matWood = new BABYLON.PBRMaterial("wood", scene);
                matWood.albedoColor = new BABYLON.Color3(0.4, 0.25, 0.1);
                matWood.roughness = 0.9;

                const matRedWood = new BABYLON.PBRMaterial("redWood", scene);
                matRedWood.albedoColor = new BABYLON.Color3(0.6, 0.2, 0.1);
                matRedWood.roughness = 0.9;

                const matGrass = new BABYLON.PBRMaterial("grass", scene);
                matGrass.albedoColor = new BABYLON.Color3(0.3, 0.6, 0.2);
                matGrass.roughness = 1.0;

                const matWater = new BABYLON.PBRMaterial("water", scene);
                matWater.albedoColor = new BABYLON.Color3(0.1, 0.7, 0.8);
                matWater.alpha = 0.8;
                matWater.roughness = 0.1;
                matWater.metallic = 0.1;

                const matRoof = new BABYLON.PBRMaterial("roof", scene);
                matRoof.albedoColor = new BABYLON.Color3(0.3, 0.15, 0.1); // Thatch/Dark
                matRoof.roughness = 1.0;

                const matSand = new BABYLON.PBRMaterial("sand", scene);
                matSand.albedoColor = new BABYLON.Color3(0.76, 0.7, 0.5);
                matSand.roughness = 1.0;

                // 3. The Floating Island Base
                const islandGroup = new BABYLON.TransformNode("island", scene);
                
                // Main earth mass
                const mainIsland = BABYLON.MeshBuilder.CreateCylinder("mainIsland", {
                    height: 6, diameterTop: 34, diameterBottom: 20, tessellation: 12
                }, scene);
                mainIsland.position.y = -3;
                mainIsland.material = matGrass;
                mainIsland.receiveShadows = true;
                mainIsland.parent = islandGroup;

                // Underside rock (darker)
                const rockBase = BABYLON.MeshBuilder.CreateCylinder("rockBase", {
                    height: 8, diameterTop: 20, diameterBottom: 8, tessellation: 8
                }, scene);
                rockBase.position.y = -8;
                rockBase.material = matStone;
                rockBase.parent = islandGroup;

                // Add "Cliffs" - random rocks on the edge
                for(let i=0; i<20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 14 + Math.random() * 2;
                    const rock = BABYLON.MeshBuilder.CreatePolyhedron("rock"+i, {type: 1, size: 1 + Math.random()}, scene);
                    rock.position.x = Math.cos(angle) * radius;
                    rock.position.z = Math.sin(angle) * radius;
                    rock.position.y = -2 + Math.random() * 2;
                    rock.scaling = new BABYLON.Vector3(1, 2, 1);
                    rock.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());
                    rock.material = matStone;
                    rock.parent = islandGroup;
                    shadowGenerator.getShadowMap().renderList.push(rock);
                }

                // 4. The River
                const riverPath = [
                    new BABYLON.Vector3(-15, 0.1, 5),
                    new BABYLON.Vector3(-5, 0.1, 2),
                    new BABYLON.Vector3(5, 0.1, -2),
                    new BABYLON.Vector3(15, 0.1, -5)
                ];
                
                // Create a ribbon for the river
                const river = BABYLON.MeshBuilder.CreateRibbon("river", {
                    pathArray: [
                        riverPath.map(v => v.add(new BABYLON.Vector3(-2.5, 0, 0))),
                        riverPath.map(v => v.add(new BABYLON.Vector3(2.5, 0, 0)))
                    ],
                    sideOrientation: BABYLON.Mesh.DOUBLESIDE
                }, scene);
                river.material = matWater;
                river.parent = islandGroup;

                // 5. The Central Castle
                const castleGroup = new BABYLON.TransformNode("castle", scene);
                castleGroup.position.y = 1;
                castleGroup.parent = islandGroup;

                // Main Keep
                const keep = BABYLON.MeshBuilder.CreateBox("keep", {width: 6, height: 9, depth: 6}, scene);
                keep.position.y = 4.5;
                keep.material = matStone;
                shadowGenerator.getShadowMap().renderList.push(keep);
                keep.parent = castleGroup;

                // Towers
                const towerPositions = [
                    {x: 3.5, z: 3.5}, {x: -3.5, z: 3.5}, 
                    {x: 3.5, z: -3.5}, {x: -3.5, z: -3.5}
                ];
                
                towerPositions.forEach((pos, idx) => {
                    const tower = BABYLON.MeshBuilder.CreateCylinder("tower"+idx, {height: 8, diameter: 2.5}, scene);
                    tower.position = new BABYLON.Vector3(pos.x, 4, pos.z);
                    tower.material = matStone;
                    tower.parent = castleGroup;
                    shadowGenerator.getShadowMap().renderList.push(tower);
                    
                    // Battlements
                    const top = BABYLON.MeshBuilder.CreateCylinder("tTop"+idx, {height: 1, diameter: 3, tessellation: 8}, scene);
                    top.position = new BABYLON.Vector3(pos.x, 8.5, pos.z);
                    top.material = matStone;
                    top.parent = castleGroup;
                });

                // Walls
                const wallOpts = {width: 8, height: 4, depth: 0.5};
                const wall1 = BABYLON.MeshBuilder.CreateBox("wall1", wallOpts, scene);
                wall1.position = new BABYLON.Vector3(0, 2, 5.5);
                wall1.material = matStone;
                wall1.parent = castleGroup;

                const wall2 = wall1.clone("wall2");
                wall2.rotation.y = Math.PI/2;
                wall2.position = new BABYLON.Vector3(5.5, 2, 0);
                wall2.parent = castleGroup;

                const wall3 = wall1.clone("wall3");
                wall3.position = new BABYLON.Vector3(0, 2, -5.5);
                wall3.parent = castleGroup;

                const wall4 = wall1.clone("wall4");
                wall4.rotation.y = Math.PI/2;
                wall4.position = new BABYLON.Vector3(-5.5, 2, 0);
                wall4.parent = castleGroup;

                // Gate
                const gate = BABYLON.MeshBuilder.CreateBox("gate", {width: 2.5, height: 3, depth: 1}, scene);
                gate.position = new BABYLON.Vector3(0, 1.5, 5.5);
                gate.material = matWood;
                gate.parent = castleGroup;

                // 6. The Village (Wooden Houses)
                const createHouse = (pos, rotation, type) => {
                    const root = new BABYLON.TransformNode("houseRoot", scene);
                    root.position = pos;
                    root.rotation.y = rotation;
                    root.parent = islandGroup;

                    // Base
                    const w = type === 'large' ? 4 : 3;
                    const h = type === 'large' ? 3.5 : 2.5;
                    const d = type === 'large' ? 5 : 3.5;
                    
                    const base = BABYLON.MeshBuilder.CreateBox("houseBase", {width: w, height: h, depth: d}, scene);
                    base.position.y = h/2;
                    base.material = matWood;
                    base.parent = root;
                    shadowGenerator.getShadowMap().renderList.push(base);

                    // Roof
                    const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {diameter: Math.max(w,d) + 1.5, height: 2, tessellation: 3}, scene);
                    roof.rotation.z = Math.PI/2;
                    roof.position.y = h + 1;
                    roof.material = matRoof;
                    roof.parent = root;

                    // Door
                    const door = BABYLON.MeshBuilder.CreateBox("door", {width: 0.8, height: 1.5, depth: 0.1}, scene);
                    door.position = new BABYLON.Vector3(0, 0.75, d/2 + 0.05);
                    door.material = matRedWood;
                    door.parent = root;

                    return root;
                };

                // Village Layout
                createHouse(new BABYLON.Vector3(-8, 1, 8), 0.2, 'normal');
                createHouse(new BABYLON.Vector3(-12, 1, 6), -0.5, 'normal');
                
                // Tavern
                const tavern = createHouse(new BABYLON.Vector3(-10, 1, 10), 0, 'large');
                // Add a sign to tavern
                const sign = BABYLON.MeshBuilder.CreateBox("sign", {width: 1.5, height: 1, depth: 0.1}, scene);
                sign.position = new BABYLON.Vector3(-10, 3, 7.5); // Relative to world needs adjustment due to parent
                sign.position = new BABYLON.Vector3(-10, 3.5, 8); // Simplifying coords
                sign.rotation.y = 0;
                sign.material = matRedWood;
                sign.parent = islandGroup;
                shadowGenerator.getShadowMap().renderList.push(sign);

                // Market Stalls
                const stall = BABYLON.MeshBuilder.CreateBox("stall", {width: 2, height: 1.5, depth: 1.5}, scene);
                stall.position = new BABYLON.Vector3(-6, 0.75, 7);
                stall.material = matWood;
                stall.parent = islandGroup;
                shadowGenerator.getShadowMap().renderList.push(stall);
                
                // Stall Roof
                const stallRoof = BABYLON.MeshBuilder.CreateCylinder("sRoof", {diameter: 3, height: 0.2, tessellation: 4}, scene);
                stallRoof.position = new BABYLON.Vector3(-6, 2, 7);
                stallRoof.rotation.y = Math.PI/4;
                stallRoof.material = matRoof;
                stallRoof.parent = islandGroup;

                // 7. The Mill & Waterfall
                const millGroup = new BABYLON.TransformNode("mill", scene);
                millGroup.position = new BABYLON.Vector3(10, 1, -2);
                millGroup.parent = islandGroup;

                const millHouse = BABYLON.MeshBuilder.CreateBox("millHouse", {width: 4, height: 4, depth: 5}, scene);
                millHouse.position.y = 2;
                millHouse.material = matWood;
                millHouse.parent = millGroup;
                shadowGenerator.getShadowMap().renderList.push(millHouse);

                const millRoof = BABYLON.MeshBuilder.CreateCylinder("mRoof", {diameter: 6, height: 1.5, tessellation: 3}, scene);
                millRoof.rotation.z = Math.PI/2;
                millRoof.position.y = 4.5;
                millRoof.scaling.z = 1.5; // Lengthen
                millRoof.material = matRoof;
                millRoof.parent = millGroup;

                // Water Wheel
                const wheelHub = BABYLON.MeshBuilder.CreateCylinder("hub", {diameter: 0.5, height: 0.5}, scene);
                wheelHub.rotation.x = Math.PI/2;
                wheelHub.position = new BABYLON.Vector3(-2.2, 2, 0);
                wheelHub.material = matWood;
                wheelHub.parent = millGroup;

                const wheelRing = BABYLON.MeshBuilder.CreateTorus("ring", {diameter: 3, thickness: 0.3}, scene);
                wheelRing.rotation.x = Math.PI/2;
                wheelRing.position = new BABYLON.Vector3(-2.2, 2, 0);
                wheelRing.material = matWood;
                wheelHub.parent = millGroup;

                // Paddles
                for(let i=0; i<8; i++){
                    const paddle = BABYLON.MeshBuilder.CreateBox("paddle", {width: 0.4, height: 1.5, depth: 0.1}, scene);
                    paddle.rotation.z = (i * Math.PI) / 4;
                    paddle.position = new BABYLON.Vector3(-2.2, 2, 0);
                    // Transform to place on ring edge roughly
                    const matrix = BABYLON.Matrix.RotationZ((i * Math.PI) / 4);
                    const offset = new BABYLON.Vector3(0, 1.5/2 + 0.15, 0);
                    const finalPos = offset.applyMatrix(matrix);
                    paddle.position.addInPlace(finalPos);
                    paddle.rotation.x = Math.PI/2;
                    paddle.material = matWood;
                    paddle.parent = millGroup;
                }

                // Waterfall Particles
                const waterfallSystem = new BABYLON.ParticleSystem("particles", 2000, scene);
                waterfallSystem.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                waterfallSystem.emitter = new BABYLON.Vector3(14, 4, -2); // Edge of mill area
                waterfallSystem.minEmitBox = new BABYLON.Vector3(-0.5, 0, -0.5); 
                waterfallSystem.maxEmitBox = new BABYLON.Vector3(0.5, 0, 0.5);
                waterfallSystem.color1 = new BABYLON.Color4(0.7, 0.8, 1.0, 1.0);
                waterfallSystem.color2 = new BABYLON.Color4(0.2, 0.5, 1.0, 1.0);
                waterfallSystem.minSize = 0.1;
                waterfallSystem.maxSize = 0.3;
                waterfallSystem.minLifeTime = 0.5;
                waterfallSystem.maxLifeTime = 1.5;
                waterfallSystem.emitRate = 500;
                waterfallSystem.direction1 = new BABYLON.Vector3(0, -1, 0);
                waterfallSystem.direction2 = new BABYLON.Vector3(0.5, -1, 0.5);
                waterfallSystem.gravity = new BABYLON.Vector3(0, -9.81, 0);
                waterfallSystem.start();

                // 8. The Ruined Watchtower
                const towerRuins = new BABYLON.TransformNode("ruins", scene);
                towerRuins.position = new BABYLON.Vector3(-12, 1, -10);
                towerRuins.parent = islandGroup;

                const baseR = BABYLON.MeshBuilder.CreateCylinder("baseR", {height: 6, diameter: 3.5, tessellation: 8}, scene);
                baseR.material = matStone;
                baseR.parent = towerRuins;
                shadowGenerator.getShadowMap().renderList.push(baseR);

                // A broken piece
                const brokenPiece = BABYLON.MeshBuilder.CreateBox("broken", {width: 2, height: 3, depth: 2}, scene);
                brokenPiece.position = new BABYLON.Vector3(1, 2, 1);
                brokenPiece.rotation = new BABYLON.Vector3(0.2, 0.2, 0.1);
                brokenPiece.material = matStone;
                brokenPiece.parent = towerRuins;

                // 9. Vegetation (Trees & Bushes)
                const createTree = (pos) => {
                    const treeRoot = new BABYLON.TransformNode("tree", scene);
                    treeRoot.position = pos;
                    treeRoot.parent = islandGroup;

                    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height: 2, diameter: 0.5}, scene);
                    trunk.position.y = 1;
                    trunk.material = matWood;
                    trunk.parent = treeRoot;
                    shadowGenerator.getShadowMap().renderList.push(trunk);

                    const leaves = BABYLON.MeshBuilder.CreateCylinder("leaves", {diameterTop: 0, diameterBottom: 3, height: 5, tessellation: 8}, scene);
                    leaves.position.y = 3.5;
                    leaves.material = matGrass; // Darker green
                    leaves.parent = treeRoot;
                    shadowGenerator.getShadowMap().renderList.push(leaves);
                };

                // Place trees randomly
                const treePositions = [
                    {x: -14, z: -8}, {x: -10, z: -14}, {x: 0, z: -13}, 
                    {x: 12, z: 8}, {x: 14, z: -8}, {x: 8, z: 12}
                ];
                treePositions.forEach(p => createTree(new BABYLON.Vector3(p.x, 1, p.z)));

                // Wooden Bridges
                const createBridge = (start, end) => {
                    const path = [start, end];
                    const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {width: 2, height: 0.2, depth: 1}, scene);
                    // Simple placement, ideally uses LookAt
                    const mid = start.add(end).scale(0.5);
                    bridge.position = mid;
                    bridge.lookAt(end);
                    bridge.material = matWood;
                    bridge.parent = islandGroup;
                    shadowGenerator.getShadowMap().renderList.push(bridge);
                };
                
                // Bridge over river
                createBridge(new BABYLON.Vector3(-5, 0.5, 5), new BABYLON.Vector3(-5, 0.5, -1));

                // Small Clouds underneath (floating effect)
                const cloudMat = new BABYLON.StandardMaterial("cloud", scene);
                cloudMat.diffuseColor = new BABYLON.Color3(1,1,1);
                cloudMat.alpha = 0.6;
                
                for(let i=0; i<5; i++) {
                    const c = BABYLON.MeshBuilder.CreateSphere("c"+i, {diameter: 4 + Math.random()*3}, scene);
                    c.position = new BABYLON.Vector3((Math.random()-0.5)*40, -12 - Math.random()*5, (Math.random()-0.5)*40);
                    c.material = cloudMat;
                }

                // Animation: Rotate Wheel
                scene.registerBeforeRender(() => {
                    wheelHub.rotation.y += 0.02;
                });

                // Hide loading
                document.getElementById('loading').style.opacity = 0;

                return scene;
            };

            const scene = createScene();

            engine.runRenderLoop(function() {
                scene.render();
            });

            window.addEventListener('resize', function() {
                engine.resize();
            });
        });
    </script>
</body>
</html>
