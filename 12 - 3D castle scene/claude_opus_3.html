<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Floating Island Diorama</title>
    <style>
        html, body, canvas { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = () => {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.8, 0.9, 1);

            const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 4, 100, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            BABYLON.SceneLoader.ImportMesh("", "https://assets.babylonjs.com/meshes/", "Mediaeval_Fantasy_Book.glb", scene, (newMeshes) => {
                newMeshes[0].scaling = new BABYLON.Vector3(0.05, 0.05, 0.05);
            });

            const island = BABYLON.MeshBuilder.CreateGroundFromHeightMap("island", "https://assets.babylonjs.com/meshes/heightMap.png", {
                width: 100,
                height: 100,
                subdivisions: 250,
                minHeight: 0,
                maxHeight: 20
            }, scene, false);
            island.position.y = -10;
            const islandMaterial = new BABYLON.StandardMaterial("islandMaterial", scene);
            islandMaterial.diffuseColor = new BABYLON.Color3(0, 0.5, 0);
            islandMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            island.material = islandMaterial;

            const castle = BABYLON.MeshBuilder.CreateBox("castle", { size: 10 }, scene);
            castle.position = new BABYLON.Vector3(0, 12, 0);
            castle.material = new BABYLON.StandardMaterial("castleMaterial", scene);
            castle.material.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/cubehouse.png", scene);
            castle.material.diffuseTexture.uScale = 5;
            castle.material.diffuseTexture.vScale = 5;

            const village = BABYLON.MeshBuilder.CreateBox("village", { size: 6 }, scene);
            village.position = new BABYLON.Vector3(-10, 6, -10);
            village.material = new BABYLON.StandardMaterial("villageMaterial", scene);
            village.material.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/semihouse.png", scene);

            const tavern = BABYLON.MeshBuilder.CreateBox("tavern", { size: 4 }, scene);
            tavern.position = new BABYLON.Vector3(8, 5, 8);
            tavern.material = new BABYLON.StandardMaterial("tavernMaterial", scene);
            tavern.material.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/cubehouse.png", scene);

            const marketStalls = BABYLON.MeshBuilder.CreateBox("marketStalls", { size: 3 }, scene);
            marketStalls.position = new BABYLON.Vector3(-6, 4, 6);
            marketStalls.material = new BABYLON.StandardMaterial("marketStallsMaterial", scene);
            marketStalls.material.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/semihouse.png", scene);

            const millBase = BABYLON.MeshBuilder.CreateCylinder("millBase", { diameter: 3, height: 5 }, scene);
            millBase.position = new BABYLON.Vector3(15, 3, 0);
            millBase.material = new BABYLON.StandardMaterial("millBaseMaterial", scene);
            millBase.material.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/cubehouse.png", scene);

            const millWheel = BABYLON.MeshBuilder.CreateCylinder("millWheel", { diameter: 4, height: 0.5 }, scene);
            millWheel.position = new BABYLON.Vector3(18, 3, 0);
            millWheel.rotate(BABYLON.Axis.X, Math.PI / 2, BABYLON.Space.WORLD);
            millWheel.material = new BABYLON.StandardMaterial("millWheelMaterial", scene);
            millWheel.material.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/wood.jpg", scene);

            const watchtower = BABYLON.MeshBuilder.CreateCylinder("watchtower", { diameter: 3, height: 8 }, scene);
            watchtower.position = new BABYLON.Vector3(-20, 8, -15);
            watchtower.material = new BABYLON.StandardMaterial("watchtowerMaterial", scene);
            watchtower.material.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/semihouse.png", scene);

            const river = BABYLON.MeshBuilder.CreateGround("river", { width: 5, height: 50, subdivisions: 20 }, scene);
            river.position = new BABYLON.Vector3(20, 1, 0);
            const riverMaterial = new BABYLON.StandardMaterial("riverMaterial", scene);
            riverMaterial.diffuseColor = new BABYLON.Color3(0, 0.5, 0.8);
            riverMaterial.alpha = 0.8;
            river.material = riverMaterial;

            const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 5, height: 0.5, depth: 10 }, scene);
            bridge.position = new BABYLON.Vector3(20, 3, 0);
            bridge.material = new BABYLON.StandardMaterial("bridgeMaterial", scene);
            bridge.material.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/wood.jpg", scene);

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
