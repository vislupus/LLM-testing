<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Island Medieval Diorama - Babylon.js</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #cfe9ff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
      outline: none;
    }
    .overlay {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 10;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      color: #243447;
      max-width: 340px;
      line-height: 1.35;
      user-select: none;
    }
    .overlay h1 {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .overlay p {
      margin: 0;
      font-size: 13px;
      opacity: 0.9;
    }
    .overlay b { color: #143a67; }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Floating Island Medieval Diorama</h1>
    <p><b>Mouse / Touch:</b> orbit, zoom, pan. A handcrafted stylized floating island with a castle, village, mill, river, bridges, waterfalls, and ruins.</p>
  </div>
  <canvas id="renderCanvas"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
  (() => {
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.82, 0.92, 1.0, 1.0);
      scene.ambientColor = new BABYLON.Color3(0.45, 0.45, 0.48);
      scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
      scene.fogDensity = 0.0024;
      scene.fogColor = new BABYLON.Color3(0.82, 0.92, 1.0);

      const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2.8, 1.05, 125, new BABYLON.Vector3(0, 14, 0), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 55;
      camera.upperRadiusLimit = 240;
      camera.wheelDeltaPercentage = 0.01;
      camera.panningSensibility = 55;
      camera.useAutoRotationBehavior = true;
      camera.autoRotationBehavior.idleRotationSpeed = 0.08;
      camera.autoRotationBehavior.idleRotationWaitTime = 12000;
      camera.autoRotationBehavior.idleRotationSpinupTime = 2000;

      const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.2, 1, 0.1), scene);
      hemi.intensity = 0.95;
      hemi.groundColor = new BABYLON.Color3(0.48, 0.56, 0.62);

      const dir = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-0.5, -1, -0.25), scene);
      dir.position = new BABYLON.Vector3(70, 100, 40);
      dir.intensity = 1.35;
      dir.shadowMinZ = 1;
      dir.shadowMaxZ = 300;

      const fill = new BABYLON.PointLight('fill', new BABYLON.Vector3(-45, 45, -20), scene);
      fill.diffuse = new BABYLON.Color3(0.85, 0.92, 1.0);
      fill.intensity = 0.45;

      const shadowGen = new BABYLON.ShadowGenerator(2048, dir);
      shadowGen.useBlurExponentialShadowMap = true;
      shadowGen.blurKernel = 24;
      shadowGen.setDarkness(0.28);

      const glow = new BABYLON.GlowLayer('glow', scene, { blurKernelSize: 32 });
      glow.intensity = 0.35;

      function makeMat(name, diffuse, spec, rough, emissive) {
        const m = new BABYLON.StandardMaterial(name, scene);
        m.diffuseColor = diffuse;
        m.specularColor = spec || new BABYLON.Color3(0.16, 0.16, 0.16);
        m.ambientColor = diffuse.scale(0.35);
        if (typeof rough === 'number') {
          m.specularPower = Math.max(4, 128 * (1 - rough));
        }
        if (emissive) m.emissiveColor = emissive;
        return m;
      }

      const grassMat = makeMat('grass', new BABYLON.Color3(0.40, 0.74, 0.34), new BABYLON.Color3(0.12,0.12,0.12), 0.82);
      const dirtMat = makeMat('dirt', new BABYLON.Color3(0.55, 0.39, 0.24), new BABYLON.Color3(0.08,0.07,0.05), 0.92);
      const cliffMat = makeMat('cliff', new BABYLON.Color3(0.43, 0.44, 0.48), new BABYLON.Color3(0.10,0.10,0.10), 0.9);
      const stoneMat = makeMat('stone', new BABYLON.Color3(0.63, 0.64, 0.66), new BABYLON.Color3(0.22,0.22,0.22), 0.72);
      const darkStoneMat = makeMat('darkStone', new BABYLON.Color3(0.45, 0.47, 0.52), new BABYLON.Color3(0.16,0.16,0.16), 0.86);
      const woodMat = makeMat('wood', new BABYLON.Color3(0.59, 0.37, 0.19), new BABYLON.Color3(0.1,0.07,0.05), 0.92);
      const timberMat = makeMat('timber', new BABYLON.Color3(0.35, 0.20, 0.10), new BABYLON.Color3(0.08,0.05,0.03), 0.96);
      const roofRedMat = makeMat('roofRed', new BABYLON.Color3(0.74, 0.24, 0.20), new BABYLON.Color3(0.18,0.1,0.1), 0.85);
      const roofBlueMat = makeMat('roofBlue', new BABYLON.Color3(0.25, 0.39, 0.61), new BABYLON.Color3(0.14,0.18,0.25), 0.85);
      const roofBrownMat = makeMat('roofBrown', new BABYLON.Color3(0.40, 0.27, 0.18), new BABYLON.Color3(0.1,0.08,0.06), 0.9);
      const waterMat = makeMat('water', new BABYLON.Color3(0.16, 0.78, 0.82), new BABYLON.Color3(0.85,0.95,1.0), 0.12, new BABYLON.Color3(0.05, 0.14, 0.18));
      waterMat.alpha = 0.88;
      const foamMat = makeMat('foam', new BABYLON.Color3(0.88, 0.97, 1.0), new BABYLON.Color3(0.75,0.75,0.75), 0.32, new BABYLON.Color3(0.14,0.18,0.2));
      foamMat.alpha = 0.72;
      const foliageMat = makeMat('foliage', new BABYLON.Color3(0.19, 0.50, 0.23), new BABYLON.Color3(0.05,0.08,0.05), 0.95);
      const foliageLightMat = makeMat('foliageLight', new BABYLON.Color3(0.28, 0.64, 0.28), new BABYLON.Color3(0.05,0.08,0.05), 0.95);
      const sandMat = makeMat('sand', new BABYLON.Color3(0.75, 0.69, 0.50), new BABYLON.Color3(0.1,0.08,0.05), 0.98);
      const bannerRedMat = makeMat('bannerR', new BABYLON.Color3(0.80,0.18,0.18), new BABYLON.Color3(0.05,0.05,0.05), 0.95, new BABYLON.Color3(0.06,0.01,0.01));
      const bannerBlueMat = makeMat('bannerB', new BABYLON.Color3(0.18,0.30,0.76), new BABYLON.Color3(0.05,0.05,0.08), 0.95, new BABYLON.Color3(0.01,0.02,0.06));

      const world = new BABYLON.TransformNode('world', scene);
      const island = new BABYLON.TransformNode('island', scene);
      island.parent = world;

      // ---------- SKY ELEMENTS ----------
      function createSky() {
        const sky = BABYLON.MeshBuilder.CreateSphere('sky', { diameter: 900, segments: 32, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
        sky.isPickable = false;
        const dt = new BABYLON.DynamicTexture('skytex', { width: 2048, height: 1024 }, scene, false);
        const ctx = dt.getContext();
        const grad = ctx.createLinearGradient(0, 0, 0, 1024);
        grad.addColorStop(0, '#b5dbff');
        grad.addColorStop(0.5, '#d9efff');
        grad.addColorStop(1, '#f7fbff');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,2048,1024);

        function cloud(x, y, w, h, alpha) {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#ffffff';
          for (let i = 0; i < 6; i++) {
            const rx = x + (Math.random()-0.5) * w * 0.55;
            const ry = y + (Math.random()-0.5) * h * 0.35;
            const rw = w * (0.18 + Math.random() * 0.24);
            const rh = h * (0.18 + Math.random() * 0.28);
            ctx.beginPath();
            ctx.ellipse(rx, ry, rw, rh, 0, 0, Math.PI*2);
            ctx.fill();
          }
          ctx.restore();
        }

        for (let i = 0; i < 18; i++) {
          cloud(200 + Math.random()*1640, 180 + Math.random()*450, 240 + Math.random()*200, 90 + Math.random()*60, 0.16 + Math.random()*0.12);
        }
        dt.update();
        const mat = new BABYLON.StandardMaterial('skyMat', scene);
        mat.diffuseTexture = dt;
        mat.specularColor = BABYLON.Color3.Black();
        mat.backFaceCulling = false;
        mat.disableLighting = true;
        sky.material = mat;

        for (let i = 0; i < 18; i++) {
          const c = BABYLON.MeshBuilder.CreateDisc('cloudBill'+i, { radius: 10 + Math.random() * 15, tessellation: 32 }, scene);
          c.billboardMode = BABYLON.AbstractMesh.BILLBOARDMODE_ALL;
          c.position.set((Math.random()-0.5)*260, 34 + Math.random()*18, (Math.random()-0.5)*260);
          c.scaling.y = 0.45;
          const cm = new BABYLON.StandardMaterial('cm'+i, scene);
          cm.diffuseColor = new BABYLON.Color3(1,1,1);
          cm.emissiveColor = new BABYLON.Color3(0.95,0.97,1);
          cm.alpha = 0.18 + Math.random()*0.1;
          cm.specularColor = BABYLON.Color3.Black();
          c.material = cm;
          c.isPickable = false;
        }
      }
      createSky();

      // ---------- TERRAIN / ISLAND ----------
      const terrainSize = 88;
      const terrainSub = 72;
      const terrainData = [];
      const terrainMesh = BABYLON.MeshBuilder.CreateGround('terrain', {
        width: terrainSize,
        height: terrainSize,
        subdivisions: terrainSub
      }, scene);
      terrainMesh.parent = island;

      function ridgeNoise(x, z) {
        return Math.sin(x * 0.16 + z * 0.08) * 1.35 +
               Math.sin(z * 0.14 - x * 0.11) * 0.85 +
               Math.cos((x + z) * 0.09) * 0.65 +
               Math.sin(Math.sqrt(x*x + z*z) * 0.22) * 0.52;
      }

      function riverProfile(x, z) {
        const riverX = Math.sin((z + 12) * 0.09) * 5.8 + Math.sin(z * 0.17) * 1.8;
        const d = Math.abs(x - riverX);
        return Math.max(0, 1.0 - d / 5.8);
      }

      function terrainHeight(x, z) {
        const r = Math.sqrt(x*x + z*z);
        let plateau = 22 - Math.pow(r / 15, 1.55) * 1.8;
        plateau += ridgeNoise(x, z) * 0.6;
        let cliffs = -Math.pow(Math.max(0, r - 20) / 5.7, 1.55) * 2.9;
        let y = plateau + cliffs;

        // castle plateau in center, village terraces, river valley
        y += Math.exp(-((x*x) / 210 + (z*z) / 190)) * 8.5;
        y += Math.exp(-(((x+18)*(x+18)) / 140 + ((z-4)*(z-4)) / 70)) * 4.3;
        y += Math.exp(-(((x-18)*(x-18)) / 150 + ((z+6)*(z+6)) / 100)) * 3.2;
        const river = riverProfile(x, z + 8);
        y -= river * 5.9;
        y -= river * Math.max(0, 1 - Math.abs(z+8)/42) * 2.1;

        // sharpen island edges
        if (r > 31) y -= Math.pow((r - 31) / 4.3, 2.1) * 8.6;
        if (r > 38) y -= Math.pow((r - 38) / 3.0, 2.3) * 19.0;
        if (r > 44) y -= Math.pow((r - 44) / 2.0, 2.0) * 28.0;
        return y;
      }

      function computeTerrain() {
        const positions = terrainMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        for (let i = 0; i < positions.length; i += 3) {
          const x = positions[i];
          const z = positions[i + 2];
          const y = terrainHeight(x, z);
          positions[i + 1] = y;
          terrainData.push({ x, y, z });
        }
        terrainMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
        const normals = [];
        BABYLON.VertexData.ComputeNormals(positions, terrainMesh.getIndices(), normals);
        terrainMesh.updateVerticesData(BABYLON.VertexBuffer.NormalKind, normals);
        terrainMesh.material = grassMat;
        terrainMesh.receiveShadows = true;
        shadowGen.addShadowCaster(terrainMesh, false);
      }
      computeTerrain();

      // Vertex-colored grass / dirt / stone zones
      (() => {
        const positions = terrainMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        const colors = [];
        for (let i = 0; i < positions.length; i += 3) {
          const x = positions[i], y = positions[i+1], z = positions[i+2];
          const river = riverProfile(x, z + 8);
          let c;
          if (y < 5.5) c = new BABYLON.Color4(0.46, 0.39, 0.33, 1.0);
          else if (river > 0.5 && y < 17) c = new BABYLON.Color4(0.70, 0.77, 0.45, 1.0);
          else if (y > 24) c = new BABYLON.Color4(0.55, 0.78, 0.40, 1.0);
          else c = new BABYLON.Color4(0.40, 0.70, 0.34, 1.0);
          colors.push(c.r, c.g, c.b, c.a);
        }
        terrainMesh.setVerticesData(BABYLON.VertexBuffer.ColorKind, colors, true);
        terrainMesh.hasVertexAlpha = false;
        const vertexMat = new BABYLON.StandardMaterial('terrainVertex', scene);
        vertexMat.diffuseColor = BABYLON.Color3.White();
        vertexMat.specularColor = new BABYLON.Color3(0.08,0.08,0.08);
        vertexMat.useVertexColor = true;
        terrainMesh.material = vertexMat;
      })();

      // underside rock body
      const underside = BABYLON.MeshBuilder.CreateSphere('underside', { diameterX: 52, diameterY: 52, diameterZ: 52, segments: 14 }, scene);
      underside.parent = island;
      underside.position.y = -21;
      underside.scaling.set(1.2, 1.35, 1.08);
      underside.material = cliffMat;
      underside.receiveShadows = true;
      shadowGen.addShadowCaster(underside, true);

      // deform underside for hand-made rocky look
      (() => {
        const pos = underside.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        for (let i = 0; i < pos.length; i += 3) {
          const x = pos[i], y = pos[i+1], z = pos[i+2];
          const r = Math.sqrt(x*x + y*y + z*z) || 1;
          let scale = 1;
          if (y > 10) scale *= 0.78;
          if (y < 0) scale *= 0.82 + Math.sin(x*0.2 + z*0.17)*0.04 + Math.cos(y*0.16)*0.03;
          if (y < -8) scale *= 0.86;
          if (Math.abs(x) < 12 && Math.abs(z) < 12 && y > 0) scale *= 1.03;
          pos[i] = x * scale;
          pos[i+1] = y * scale;
          pos[i+2] = z * scale;
        }
        underside.updateVerticesData(BABYLON.VertexBuffer.PositionKind, pos);
        const normals = [];
        BABYLON.VertexData.ComputeNormals(pos, underside.getIndices(), normals);
        underside.updateVerticesData(BABYLON.VertexBuffer.NormalKind, normals);
      })();

      // ring of cliff shards
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * Math.PI * 2;
        const radius = 23 + Math.random() * 13;
        const rock = BABYLON.MeshBuilder.CreatePolyhedron('rock'+i, { type: 2, size: 3 + Math.random() * 3 }, scene);
        rock.parent = island;
        rock.position.set(Math.cos(a)*radius, -6 - Math.random()*12, Math.sin(a)*radius);
        rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
        const s = 0.7 + Math.random() * 1.6;
        rock.scaling.set(s*1.2, s*(1.0 + Math.random()*1.2), s);
        rock.material = cliffMat;
        shadowGen.addShadowCaster(rock, true);
      }

      // Supporting cloud puff layer underneath
      for (let i = 0; i < 16; i++) {
        const puff = BABYLON.MeshBuilder.CreateSphere('puff'+i, { diameter: 6 + Math.random()*8, segments: 10 }, scene);
        puff.parent = island;
        puff.position.set((Math.random()-0.5)*55, -28 + Math.random()*6, (Math.random()-0.5)*55);
        puff.scaling.y = 0.55;
        const pm = new BABYLON.StandardMaterial('pm'+i, scene);
        pm.diffuseColor = new BABYLON.Color3(1,1,1);
        pm.emissiveColor = new BABYLON.Color3(0.92,0.95,1.0);
        pm.alpha = 0.36;
        pm.specularColor = BABYLON.Color3.Black();
        puff.material = pm;
      }

      function getHeight(x, z) {
        return terrainHeight(x, z);
      }

      // ---------- PATHS / VILLAGE ----------
      function createPath(points, width = 1.6, colorMat = sandMat, yOffset = 0.08) {
        const path3d = points.map(p => new BABYLON.Vector3(p.x, getHeight(p.x, p.z) + yOffset, p.z));
        const ribbon = BABYLON.MeshBuilder.CreateTube('path'+Math.random(), {
          path: path3d,
          radius: width,
          tessellation: 10,
          cap: BABYLON.Mesh.NO_CAP,
          sideOrientation: BABYLON.Mesh.DOUBLESIDE
        }, scene);
        ribbon.material = colorMat;
        ribbon.parent = island;
        ribbon.receiveShadows = true;
        return ribbon;
      }

      createPath([
        {x:-1,z:-34},{x:2,z:-27},{x:4,z:-19},{x:3,z:-11},{x:0,z:-2},{x:-1,z:8},{x:-1,z:18},{x:0,z:28}
      ], 1.15, waterMat, 0.08);
      createPath([{x:-16,z:3},{x:-10,z:1},{x:-4,z:-1},{x:2,z:-2},{x:7,z:0},{x:12,z:5},{x:17,z:8}], 1.0, sandMat, 0.14);
      createPath([{x:-18,z:7},{x:-20,z:13},{x:-19,z:19},{x:-14,z:24}], 0.85, sandMat, 0.14);
      createPath([{x:10,z:-6},{x:18,z:-10},{x:23,z:-16},{x:25,z:-22}], 0.9, sandMat, 0.14);
      createPath([{x:8,z:8},{x:14,z:12},{x:19,z:16},{x:25,z:21}], 0.9, sandMat, 0.14);

      // waterfalls and river foam
      function createWaterfall(x, z, height, width, depthDir) {
        const y = getHeight(x, z);
        const fall = BABYLON.MeshBuilder.CreatePlane('fall'+x+z, { width: width, height: height, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
        fall.parent = island;
        fall.position.set(x, y - height*0.47, z);
        fall.rotation.y = depthDir;
        fall.material = waterMat;
        glow.addIncludedOnlyMesh(fall);

        const splash = BABYLON.MeshBuilder.CreateDisc('splash'+x+z, { radius: width*0.8, tessellation: 24 }, scene);
        splash.parent = island;
        splash.position.set(x, y - height + 0.1, z);
        splash.rotation.x = Math.PI/2;
        splash.material = foamMat;
      }

      createWaterfall(-0.4, -34, 24, 2.9, 0.0);
      createWaterfall(1.8, 28, 18, 2.3, Math.PI/8);

      // small river planes following the route
      const riverSections = [
        {x: 0, z: -26, w: 8, d: 8, ry: 0.1},
        {x: 2, z: -17, w: 8, d: 9, ry: -0.04},
        {x: 3, z: -8, w: 8, d: 8, ry: -0.14},
        {x: 0, z: 1, w: 7, d: 8, ry: 0.02},
        {x: -1, z: 11, w: 7, d: 8, ry: 0.08},
        {x: 0, z: 21, w: 8, d: 10, ry: -0.05},
      ];
      riverSections.forEach((r, idx) => {
        const p = BABYLON.MeshBuilder.CreateGround('river'+idx, { width: r.w, height: r.d, subdivisions: 1 }, scene);
        p.parent = island;
        p.position.set(r.x, getHeight(r.x, r.z) + 0.15, r.z);
        p.rotation.y = r.ry;
        p.material = waterMat;
        glow.addIncludedOnlyMesh(p);
      });

      // ---------- TREES ----------
      const trunkPrototype = BABYLON.MeshBuilder.CreateCylinder('trunkProto', { height: 2.4, diameterTop: 0.35, diameterBottom: 0.55, tessellation: 6 }, scene);
      trunkPrototype.material = timberMat;
      trunkPrototype.isVisible = false;
      const leafProtoA = BABYLON.MeshBuilder.CreateCylinder('leafA', { height: 2.4, diameterTop: 0.1, diameterBottom: 2.3, tessellation: 7 }, scene);
      leafProtoA.material = foliageMat;
      leafProtoA.isVisible = false;
      const leafProtoB = BABYLON.MeshBuilder.CreateCylinder('leafB', { height: 1.9, diameterTop: 0.1, diameterBottom: 1.7, tessellation: 7 }, scene);
      leafProtoB.material = foliageLightMat;
      leafProtoB.isVisible = false;

      function createPine(x, z, scale = 1) {
        const base = new BABYLON.TransformNode('pine'+x+z, scene);
        base.parent = island;
        const y = getHeight(x, z);
        base.position.set(x, y + 1.2*scale, z);
        base.rotation.y = Math.random() * Math.PI * 2;

        const trunk = trunkPrototype.createInstance('trunki');
        trunk.parent = base;
        trunk.scaling.set(scale, scale, scale);
        shadowGen.addShadowCaster(trunk, true);

        for (let i = 0; i < 3; i++) {
          const leaf = (i % 2 ? leafProtoB : leafProtoA).createInstance('leafi');
          leaf.parent = base;
          const s = scale * (1.25 - i*0.2);
          leaf.scaling.set(s, s, s);
          leaf.position.y = 0.8 + i * 1.02 * scale;
          shadowGen.addShadowCaster(leaf, true);
        }
        return base;
      }

      const treeZones = [];
      for (let i = 0; i < 72; i++) {
        let x = (Math.random()-0.5) * 70;
        let z = (Math.random()-0.5) * 70;
        const r = Math.sqrt(x*x + z*z);
        const y = getHeight(x, z);
        const river = riverProfile(x, z + 8);
        const tooVillage = (Math.abs(x + 14) < 14 && Math.abs(z - 8) < 13) || (Math.abs(x - 17) < 12 && Math.abs(z - 16) < 10) || (Math.abs(x) < 12 && Math.abs(z) < 10);
        if (r < 42 && y > 11 && river < 0.3 && !tooVillage) {
          treeZones.push({ x, z });
        }
      }
      treeZones.forEach(t => createPine(t.x, t.z, 0.8 + Math.random()*1.15));

      // ---------- BUILDINGS ----------
      function addLantern(parent, pos, color) {
        const glowSphere = BABYLON.MeshBuilder.CreateSphere('lantern', { diameter: 0.26, segments: 8 }, scene);
        glowSphere.parent = parent;
        glowSphere.position = pos.clone();
        const mat = makeMat('lanternMat'+Math.random(), color, new BABYLON.Color3(0.2,0.2,0.2), 0.3, color.scale(1.2));
        glowSphere.material = mat;
        glow.addIncludedOnlyMesh(glowSphere);
        const light = new BABYLON.PointLight('lanternLight', BABYLON.Vector3.Zero(), scene);
        light.parent = glowSphere;
        light.intensity = 0.38;
        light.range = 9;
        light.diffuse = color;
      }

      function createHouse(x, z, options = {}) {
        const root = new BABYLON.TransformNode('house', scene);
        root.parent = island;
        const y = getHeight(x, z);
        root.position.set(x, y + 0.15, z);
        root.rotation.y = options.rotation || Math.random() * Math.PI * 2;
        const baseW = options.width || (2.6 + Math.random() * 1.6);
        const baseD = options.depth || (2.3 + Math.random() * 1.4);
        const baseH = options.height || (2.2 + Math.random() * 1.2);

        const base = BABYLON.MeshBuilder.CreateBox('hb', { width: baseW, depth: baseD, height: baseH }, scene);
        base.parent = root;
        base.position.y = baseH/2;
        base.material = options.wallMat || woodMat;
        shadowGen.addShadowCaster(base, true);
        base.receiveShadows = true;

        // timber frame strips
        const trimThickness = 0.12;
        const trims = [];
        for (let sx of [-1, 1]) {
          const post = BABYLON.MeshBuilder.CreateBox('post', { width: trimThickness, depth: baseD+0.03, height: baseH+0.02 }, scene);
          post.parent = root;
          post.position.set(sx*(baseW/2 - trimThickness/2), baseH/2, 0);
          trims.push(post);
        }
        for (let sz of [-1, 1]) {
          const beam = BABYLON.MeshBuilder.CreateBox('beam', { width: baseW-0.14, depth: trimThickness, height: trimThickness }, scene);
          beam.parent = root;
          beam.position.set(0, baseH - 0.15, sz*(baseD/2 - trimThickness/2));
          trims.push(beam);
        }
        trims.forEach(t => { t.material = timberMat; shadowGen.addShadowCaster(t, true); });

        const roofH = options.roofHeight || (1.4 + Math.random()*0.6);
        const roof = BABYLON.MeshBuilder.CreateCylinder('roof', { height: baseD + 0.6, diameterTop: 0.2, diameterBottom: baseW + 0.8, tessellation: 3 }, scene);
        roof.parent = root;
        roof.rotation.z = Math.PI / 2;
        roof.rotation.y = Math.PI / 2;
        roof.position.y = baseH + roofH*0.46;
        roof.scaling.y = roofH;
        roof.material = options.roofMat || [roofRedMat, roofBlueMat, roofBrownMat][Math.floor(Math.random()*3)];
        shadowGen.addShadowCaster(roof, true);

        if (options.chimney !== false) {
          const ch = BABYLON.MeshBuilder.CreateBox('chim', { width: 0.38, depth: 0.38, height: 1.0 }, scene);
          ch.parent = root;
          ch.position.set(baseW*0.18, baseH + 0.85, 0.2);
          ch.material = stoneMat;
          shadowGen.addShadowCaster(ch, true);
        }

        if (options.lantern) addLantern(root, new BABYLON.Vector3(0.0, 1.3, baseD/2 + 0.2), new BABYLON.Color3(1.0, 0.76, 0.42));
        return root;
      }

      function createMarketStall(x, z, canopyMat) {
        const root = new BABYLON.TransformNode('stall', scene);
        root.parent = island;
        root.position.set(x, getHeight(x, z) + 0.05, z);
        root.rotation.y = Math.random() * Math.PI * 2;

        const top = BABYLON.MeshBuilder.CreateBox('counter', { width: 1.8, depth: 1.2, height: 0.35 }, scene);
        top.parent = root;
        top.position.y = 0.9;
        top.material = woodMat;
        shadowGen.addShadowCaster(top, true);

        for (let sx of [-0.75, 0.75]) for (let sz of [-0.45, 0.45]) {
          const leg = BABYLON.MeshBuilder.CreateBox('leg', { width: 0.12, depth: 0.12, height: 1.8 }, scene);
          leg.parent = root;
          leg.position.set(sx, 0.9, sz);
          leg.material = timberMat;
          shadowGen.addShadowCaster(leg, true);
        }
        const canopy = BABYLON.MeshBuilder.CreateBox('canopy', { width: 2.1, depth: 1.5, height: 0.15 }, scene);
        canopy.parent = root;
        canopy.position.y = 1.95;
        canopy.material = canopyMat;
        shadowGen.addShadowCaster(canopy, true);
        return root;
      }

      function createBridge(x, z, length, rotY) {
        const root = new BABYLON.TransformNode('bridge', scene);
        root.parent = island;
        root.position.set(x, getHeight(x, z)+0.3, z);
        root.rotation.y = rotY;
        const deck = BABYLON.MeshBuilder.CreateBox('deck', { width: length, depth: 1.4, height: 0.22 }, scene);
        deck.parent = root;
        deck.material = woodMat;
        shadowGen.addShadowCaster(deck, true);
        for (let i = -1; i <= 1; i += 2) {
          const rail = BABYLON.MeshBuilder.CreateBox('rail', { width: length, depth: 0.12, height: 0.18 }, scene);
          rail.parent = root;
          rail.position.set(0, 0.55, i*0.62);
          rail.material = timberMat;
          shadowGen.addShadowCaster(rail, true);
        }
        for (let i = 0; i < 4; i++) {
          const post = BABYLON.MeshBuilder.CreateBox('post', { width: 0.12, depth: 0.12, height: 0.8 }, scene);
          post.parent = root;
          post.position.set(-length/2 + 0.5 + i*(length-1)/3, 0.28, 0.62);
          post.material = timberMat;
          shadowGen.addShadowCaster(post, true);
          const post2 = post.clone('post2');
          post2.parent = root;
          post2.position.z = -0.62;
        }
        return root;
      }

      function createMill(x, z) {
        const root = new BABYLON.TransformNode('mill', scene);
        root.parent = island;
        const y = getHeight(x, z);
        root.position.set(x, y + 0.15, z);
        root.rotation.y = -0.5;

        const house = createHouse(0, 0, { width: 3.5, depth: 3.2, height: 2.8, roofMat: roofBrownMat, rotation: 0, wallMat: woodMat });
        house.parent = root;

        const wheelRoot = new BABYLON.TransformNode('wheelRoot', scene);
        wheelRoot.parent = root;
        wheelRoot.position.set(2.2, 1.5, -1.2);
        const wheel = BABYLON.MeshBuilder.CreateTorus('wheel', { diameter: 2.4, thickness: 0.18, tessellation: 16 }, scene);
        wheel.parent = wheelRoot;
        wheel.material = timberMat;
        wheel.rotation.y = Math.PI/2;
        shadowGen.addShadowCaster(wheel, true);
        for (let i = 0; i < 8; i++) {
          const spoke = BABYLON.MeshBuilder.CreateBox('spoke', { width: 2.1, height: 0.1, depth: 0.12 }, scene);
          spoke.parent = wheelRoot;
          spoke.material = woodMat;
          spoke.rotation.z = (Math.PI*2/8)*i;
          spoke.rotation.y = Math.PI/2;
          shadowGen.addShadowCaster(spoke, true);
        }
        scene.onBeforeRenderObservable.add(() => {
          wheelRoot.rotation.x += engine.getDeltaTime() * 0.00055;
        });
        return root;
      }

      function createCastle() {
        const root = new BABYLON.TransformNode('castle', scene);
        root.parent = island;
        root.position.set(0, getHeight(0,0) + 0.28, 0);

        const wallRadiusX = 12;
        const wallRadiusZ = 10;
        const keepHeight = 12;

        // base courtyard
        const keep = BABYLON.MeshBuilder.CreateBox('keep', { width: 8.5, depth: 8.5, height: keepHeight }, scene);
        keep.parent = root;
        keep.position.y = keepHeight / 2;
        keep.material = stoneMat;
        shadowGen.addShadowCaster(keep, true);

        const keepTop = BABYLON.MeshBuilder.CreateBox('keepTop', { width: 9.2, depth: 9.2, height: 1.0 }, scene);
        keepTop.parent = root;
        keepTop.position.y = keepHeight + 0.5;
        keepTop.material = darkStoneMat;
        shadowGen.addShadowCaster(keepTop, true);

        const merlonCount = 16;
        for (let i = 0; i < merlonCount; i++) {
          const m = BABYLON.MeshBuilder.CreateBox('merlon', { width: 0.7, depth: 0.7, height: 0.9 }, scene);
          m.parent = root;
          const side = i % 4;
          const t = (Math.floor(i/4) - 1.5) * 2.3;
          if (side === 0) m.position.set(t, keepHeight + 1.35, 4.6);
          if (side === 1) m.position.set(t, keepHeight + 1.35, -4.6);
          if (side === 2) m.position.set(4.6, keepHeight + 1.35, t);
          if (side === 3) m.position.set(-4.6, keepHeight + 1.35, t);
          m.material = darkStoneMat;
          shadowGen.addShadowCaster(m, true);
        }

        const wallSections = [
          { w: 23, d: 1.5, x: 0, z: wallRadiusZ },
          { w: 23, d: 1.5, x: 0, z: -wallRadiusZ },
          { w: 1.5, d: 19, x: wallRadiusX, z: 0 },
          { w: 1.5, d: 19, x: -wallRadiusX, z: 0 },
        ];
        wallSections.forEach((s, idx) => {
          const wall = BABYLON.MeshBuilder.CreateBox('wall'+idx, { width: s.w, depth: s.d, height: 6.4 }, scene);
          wall.parent = root;
          wall.position.set(s.x, 3.2, s.z);
          wall.material = stoneMat;
          shadowGen.addShadowCaster(wall, true);
          for (let j = 0; j < Math.floor((s.w > s.d ? s.w : s.d) / 2.1); j++) {
            const cren = BABYLON.MeshBuilder.CreateBox('cren', { width: s.w > s.d ? 0.9 : 1.35, depth: s.w > s.d ? 1.35 : 0.9, height: 0.7 }, scene);
            cren.parent = root;
            const t = -((s.w > s.d ? s.w : s.d) / 2) + 1 + j*2.1;
            cren.position.set(
              s.w > s.d ? t : s.x,
              6.75,
              s.w > s.d ? s.z : t
            );
            cren.material = darkStoneMat;
            shadowGen.addShadowCaster(cren, true);
          }
        });

        const towerPositions = [
          [-wallRadiusX, -wallRadiusZ], [wallRadiusX, -wallRadiusZ], [wallRadiusX, wallRadiusZ], [-wallRadiusX, wallRadiusZ]
        ];
        towerPositions.forEach((p, i) => {
          const tower = BABYLON.MeshBuilder.CreateCylinder('tower'+i, { height: 10.5, diameter: 4.6, tessellation: 8 }, scene);
          tower.parent = root;
          tower.position.set(p[0], 5.25, p[1]);
          tower.material = stoneMat;
          shadowGen.addShadowCaster(tower, true);
          const roof = BABYLON.MeshBuilder.CreateCylinder('towerRoof'+i, { height: 3.3, diameterTop: 0.5, diameterBottom: 5.5, tessellation: 8 }, scene);
          roof.parent = root;
          roof.position.set(p[0], 12.5, p[1]);
          roof.material = roofBlueMat;
          shadowGen.addShadowCaster(roof, true);
          const bannerPole = BABYLON.MeshBuilder.CreateCylinder('pole'+i, { height: 2.5, diameter: 0.08 }, scene);
          bannerPole.parent = root;
          bannerPole.position.set(p[0] + 0.6, 14.2, p[1]);
          bannerPole.material = darkStoneMat;
          const banner = BABYLON.MeshBuilder.CreatePlane('banner'+i, { width: 0.8, height: 1.4, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
          banner.parent = root;
          banner.position.set(p[0] + 1.05, 13.6, p[1]);
          banner.material = i % 2 ? bannerRedMat : bannerBlueMat;
          glow.addIncludedOnlyMesh(banner);
        });

        const gate = BABYLON.MeshBuilder.CreateBox('gate', { width: 3.8, depth: 1.7, height: 4.8 }, scene);
        gate.parent = root;
        gate.position.set(0, 2.4, 10.05);
        gate.material = timberMat;
        shadowGen.addShadowCaster(gate, true);

        createBridge(0, 10.8, 4.2, 0);
        return root;
      }

      createCastle();

      // Village cluster
      const village = [
        {x:-14, z:4, w:3.4, d:2.8, h:2.8, r:0.2},
        {x:-18, z:8, w:2.8, d:2.5, h:2.4, r:0.9},
        {x:-12, z:12, w:3.0, d:2.7, h:2.5, r:-0.3},
        {x:-20, z:16, w:3.6, d:3.0, h:2.8, r:0.4},
        {x:-15, z:20, w:2.7, d:2.2, h:2.3, r:-0.15},
        {x:-8, z:6, w:3.1, d:2.8, h:2.3, r:0.4},
        {x:13, z:-10, w:3.6, d:3.0, h:3.0, r:0.4},
        {x:18, z:-14, w:2.9, d:2.4, h:2.4, r:0.1},
        {x:22, z:-18, w:3.7, d:3.3, h:2.9, r:-0.25},
        {x:15, z:12, w:4.1, d:3.2, h:3.1, r:0.35},
        {x:21, z:17, w:3.2, d:2.7, h:2.6, r:-0.3},
      ];
      village.forEach((v, idx) => {
        const house = createHouse(v.x, v.z, { width: v.w, depth: v.d, height: v.h, rotation: v.r, lantern: idx % 3 === 0 });
        if (idx === 6) {
          // tavern sign
          const signPole = BABYLON.MeshBuilder.CreateBox('signPole', { width: 0.16, depth: 0.16, height: 1.9 }, scene);
          signPole.parent = house;
          signPole.position.set(-2.2, 1.0, 1.8);
          signPole.material = timberMat;
          const sign = BABYLON.MeshBuilder.CreateBox('sign', { width: 1.1, height: 0.7, depth: 0.08 }, scene);
          sign.parent = house;
          sign.position.set(-1.65, 1.65, 1.8);
          sign.material = roofRedMat;
          glow.addIncludedOnlyMesh(sign);
        }
      });

      // Market area
      createMarketStall(-11.2, 8.2, roofRedMat);
      createMarketStall(-9.1, 10.5, roofBlueMat);
      createMarketStall(-13.3, 11.4, roofBrownMat);
      createMarketStall(-10.8, 13.0, roofRedMat);

      // Riverside mill
      createMill(4.0, -13.2);
      createBridge(1.5, -3.6, 6.2, 0.2);
      createBridge(-0.4, 17.0, 6.0, -0.1);

      // Ruined watchtower
      (() => {
        const x = 30, z = 19;
        const root = new BABYLON.TransformNode('ruin', scene);
        root.parent = island;
        root.position.set(x, getHeight(x, z) + 0.25, z);
        root.rotation.y = -0.55;

        const parts = [
          {x:0,z:0,w:4.8,d:4.8,h:5.5},
          {x:-1.6,z:-1.7,w:1.2,d:1.2,h:8},
          {x:1.8,z:1.4,w:1.1,d:1.1,h:6.3},
          {x:-1.6,z:1.5,w:1.0,d:1.0,h:4.8},
        ];
        parts.forEach((p, i) => {
          const block = BABYLON.MeshBuilder.CreateBox('ruin'+i, { width: p.w, depth: p.d, height: p.h }, scene);
          block.parent = root;
          block.position.set(p.x, p.h/2, p.z);
          block.material = darkStoneMat;
          shadowGen.addShadowCaster(block, true);
        });
        const hole = BABYLON.MeshBuilder.CreateBox('hole', { width: 2.6, depth: 2.6, height: 2.8 }, scene);
        hole.parent = root;
        hole.position.set(0.7, 2.2, -0.3);
        hole.isVisible = false;

        for (let i = 0; i < 8; i++) {
          const rubble = BABYLON.MeshBuilder.CreatePolyhedron('rubble'+i, { type: 1, size: 0.6 + Math.random()*1.0 }, scene);
          rubble.parent = root;
          rubble.position.set((Math.random()-0.5)*5, 0.4 + Math.random()*0.6, (Math.random()-0.5)*5);
          rubble.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
          rubble.material = cliffMat;
          shadowGen.addShadowCaster(rubble, true);
        }
      })();

      // Props: fences, rocks, barrels
      function scatterProps() {
        for (let i = 0; i < 20; i++) {
          const x = -22 + Math.random()*48;
          const z = -18 + Math.random()*40;
          if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
          const y = getHeight(x, z);
          if (y < 8 || riverProfile(x, z+8) > 0.5) continue;
          const type = Math.random();
          if (type < 0.45) {
            const rock = BABYLON.MeshBuilder.CreatePolyhedron('propRock'+i, { type: 2, size: 0.45 + Math.random()*0.9 }, scene);
            rock.parent = island;
            rock.position.set(x, y + 0.3, z);
            rock.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
            rock.scaling.y = 0.7 + Math.random()*0.8;
            rock.material = cliffMat;
            shadowGen.addShadowCaster(rock, true);
          } else if (type < 0.8) {
            const barrel = BABYLON.MeshBuilder.CreateCylinder('barrel'+i, { height: 0.8, diameterTop: 0.5, diameterBottom: 0.58, tessellation: 10 }, scene);
            barrel.parent = island;
            barrel.position.set(x, y + 0.4, z);
            barrel.material = woodMat;
            shadowGen.addShadowCaster(barrel, true);
          } else {
            for (let j = 0; j < 3; j++) {
              const fence = BABYLON.MeshBuilder.CreateBox('fence'+i+j, { width: 1.0, height: 0.5, depth: 0.08 }, scene);
              fence.parent = island;
              fence.position.set(x + j*0.9, y + 0.45, z);
              fence.rotation.y = Math.random()*0.5;
              fence.material = timberMat;
              shadowGen.addShadowCaster(fence, true);
            }
          }
        }
      }
      scatterProps();

      // animated birds for life
      const birds = [];
      for (let i = 0; i < 8; i++) {
        const bird = BABYLON.MeshBuilder.CreatePlane('bird'+i, { width: 1.1, height: 0.35, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
        bird.material = makeMat('birdMat'+i, new BABYLON.Color3(0.22,0.22,0.25), BABYLON.Color3.Black(), 0.95, new BABYLON.Color3(0.01,0.01,0.01));
        bird.billboardMode = BABYLON.AbstractMesh.BILLBOARDMODE_NONE;
        bird.position.set((Math.random()-0.5)*60, 28 + Math.random()*10, (Math.random()-0.5)*60);
        birds.push({ mesh: bird, angle: Math.random()*Math.PI*2, radius: 20 + Math.random()*22, center: new BABYLON.Vector3((Math.random()-0.5)*20, 30 + Math.random()*8, (Math.random()-0.5)*20), speed: 0.0012 + Math.random()*0.0016, bob: Math.random()*Math.PI*2 });
      }

      // floating motion for miniature vibe
      let t = 0;
      scene.onBeforeRenderObservable.add(() => {
        const dt = engine.getDeltaTime();
        t += dt * 0.001;
        world.rotation.y = Math.sin(t * 0.17) * 0.035;
        island.position.y = Math.sin(t * 0.6) * 0.7;
        riverSections.forEach((_, idx) => {
          const m = scene.getMeshByName('river'+idx);
          if (m) {
            m.position.y = getHeight(m.position.x, m.position.z) + 0.12 + Math.sin(t*2 + idx) * 0.03;
          }
        });
        birds.forEach((b, i) => {
          b.angle += dt * b.speed;
          b.mesh.position.x = b.center.x + Math.cos(b.angle) * b.radius;
          b.mesh.position.z = b.center.z + Math.sin(b.angle) * b.radius * 0.65;
          b.mesh.position.y = b.center.y + Math.sin(b.angle*2 + b.bob) * 1.4;
          b.mesh.rotation.y = -b.angle + Math.PI/2;
          b.mesh.scaling.y = 0.6 + Math.abs(Math.sin(t*8 + i)) * 0.6;
        });
      });

      // subtle decorative rim light around island edges
      const rim = BABYLON.MeshBuilder.CreateTorus('rim', { diameter: 96, thickness: 0.4, tessellation: 48 }, scene);
      rim.parent = world;
      rim.position.y = -3.2;
      rim.rotation.x = Math.PI/2;
      const rimMat = makeMat('rimMat', new BABYLON.Color3(0.65,0.90,1.0), BABYLON.Color3.Black(), 0.9, new BABYLON.Color3(0.15,0.22,0.28));
      rimMat.alpha = 0.10;
      rim.material = rimMat;
      glow.addIncludedOnlyMesh(rim);

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => scene.render());
    window.addEventListener('resize', () => engine.resize());
  })();
  </script>
</body>
</html>
