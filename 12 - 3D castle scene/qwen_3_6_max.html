<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama – Medieval Castle & Village</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{overflow:hidden;background:#0a0e18}
  #renderCanvas{width:100vw;height:100vh;display:block}
  #ui{position:fixed;top:14px;left:14px;z-index:100;background:rgba(12,16,28,.88);
    backdrop-filter:blur(12px);border:1px solid rgba(140,180,220,.15);border-radius:14px;
    padding:16px 20px;color:#9ab;font:12px/1.6 'Segoe UI',sans-serif;max-width:240px;
    box-shadow:0 6px 28px rgba(0,0,0,.5)}
  #ui h2{font-size:14px;color:#7aafff;margin-bottom:6px;letter-spacing:.5px}
  #ui p{color:#6a7a8a;font-size:11px}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="ui">
  <h2>🏰 Floating Island Diorama</h2>
  <p>Orbit: left-click &nbsp;|&nbsp; Zoom: scroll &nbsp;|&nbsp; Pan: right-click</p>
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
const canvas=document.getElementById('renderCanvas');
const engine=new BABYLON.Engine(canvas,true,{stencil:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.06,.09,.16,1);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=.006;
scene.fogColor=new BABYLON.Color3(.12,.18,.28);
scene.ambientColor=new BABYLON.Color3(.15,.18,.22);

/* ── Camera ── */
const cam=new BABYLON.ArcRotateCamera('cam',-Math.PI/3,Math.PI/3.5,90,
  new BABYLON.Vector3(0,8,0),scene);
cam.attachControl(canvas,true);
cam.lowerRadiusLimit=20;cam.upperRadiusLimit=200;
cam.wheelPrecision=12;cam.panningSensibility=500;

/* ── Lights ── */
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=.45;hemi.diffuse=new BABYLON.Color3(.6,.7,.9);
hemi.groundColor=new BABYLON.Color3(.15,.2,.12);

const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.6,-1,.5),scene);
sun.position=new BABYLON.Vector3(40,80,-30);
sun.intensity=1.4;sun.diffuse=new BABYLON.Color3(1,.96,.85);
sun.specular=new BABYLON.Color3(.2,.2,.25);

const sg=new BABYLON.ShadowGenerator(2048,sun);
sg.useBlurExponentialShadowMap=true;sg.blurKernel=10;sg.darkness=.3;

const pt=new BABYLON.PointLight('pt',new BABYLON.Vector3(0,15,0),scene);
pt.intensity=.2;pt.diffuse=new BABYLON.Color3(.5,.6,.8);pt.range=60;

/* Glow */
const glow=new BABYLON.GlowLayer('glow',scene,{blurKernelSize:24,mainTextureFixedSize:512});
glow.intensity=.25;

/* Sky */
const skyMat=new BABYLON.StandardMaterial('skyMat',scene);
skyMat.backFaceCulling=false;skyMat.disableLighting=true;
skyMat.emissiveColor=new BABYLON.Color3(.15,.22,.42);
const sky=BABYLON.MeshBuilder.CreateBox('sky',{size:500},scene);
sky.material=skyMat;sky.infiniteDistance=true;

/* ── Materials ── */
function mat(name,diff,spec,emis,alp){
  const m=new BABYLON.StandardMaterial(name,scene);
  m.diffuseColor=diff||new BABYLON.Color3(.5,.5,.5);
  m.specularColor=spec||new BABYLON.Color3(.05,.05,.05);
  if(emis)m.emissiveColor=emis;
  if(alp!==undefined)m.alpha=alp;
  return m;
}
const M={
  grass:mat('grass',new BABYLON.Color3(.28,.55,.18),new BABYLON.Color3(.02,.02,.02)),
  darkGrass:mat('darkGrass',new BABYLON.Color3(.2,.42,.12),new BABYLON.Color3(.02,.02,.02)),
  rock:mat('rock',new BABYLON.Color3(.38,.34,.3),new BABYLON.Color3(.04,.04,.04)),
  darkRock:mat('darkRock',new BABYLON.Color3(.28,.25,.22),new BABYLON.Color3(.03,.03,.03)),
  stone:mat('stone',new BABYLON.Color3(.52,.48,.42),new BABYLON.Color3(.06,.06,.06)),
  darkStone:mat('darkStone',new BABYLON.Color3(.38,.35,.3),new BABYLON.Color3(.04,.04,.04)),
  wood:mat('wood',new BABYLON.Color3(.55,.35,.18),new BABYLON.Color3(.03,.03,.03)),
  darkWood:mat('darkWood',new BABYLON.Color3(.38,.24,.12),new BABYLON.Color3(.02,.02,.02)),
  roof:mat('roof',new BABYLON.Color3(.7,.35,.15),new BABYLON.Color3(.03,.03,.03)),
  roofGreen:mat('roofGreen',new BABYLON.Color3(.3,.5,.2),new BABYLON.Color3(.02,.02,.02)),
  roofBlue:mat('roofBlue',new BABYLON.Color3(.25,.35,.6),new BABYLON.Color3(.03,.03,.03)),
  water:mat('water',new BABYLON.Color3(.15,.55,.55),new BABYLON.Color3(.3,.3,.3),
    new BABYLON.Color3(.05,.15,.15),.75),
  waterfall:mat('waterfall',new BABYLON.Color3(.4,.75,.8),new BABYLON.Color3(.2,.2,.2),
    new BABYLON.Color3(.1,.2,.2),.6),
  pine:mat('pine',new BABYLON.Color3(.15,.38,.12),new BABYLON.Color3(.02,.02,.02)),
  pineDark:mat('pineDark',new BABYLON.Color3(.1,.28,.08),new BABYLON.Color3(.02,.02,.02)),
  trunk:mat('trunk',new BABYLON.Color3(.35,.22,.1),new BABYLON.Color3(.02,.02,.02)),
  door:mat('door',new BABYLON.Color3(.3,.18,.08),new BABYLON.Color3(.02,.02,.02)),
  window:mat('window',new BABYLON.Color3(.6,.75,.9),new BABYLON.Color3(.3,.3,.3),
    new BABYLON.Color3(.15,.2,.3)),
  windowLit:mat('windowLit',new BABYLON.Color3(.9,.8,.4),new BABYLON.Color3(.2,.2,.2),
    new BABYLON.Color3(.5,.4,.15)),
  flag:mat('flag',new BABYLON.Color3(.8,.15,.15),new BABYLON.Color3(.05,.05,.05),
    new BABYLON.Color3(.15,.03,.03)),
  flagBlue:mat('flagBlue',new BABYLON.Color3(.15,.3,.7),new BABYLON.Color3(.05,.05,.05),
    new BABYLON.Color3(.03,.08,.2)),
  metal:mat('metal',new BABYLON.Color3(.4,.4,.45),new BABYLON.Color3(.3,.3,.35)),
  cloth:mat('cloth',new BABYLON.Color3(.7,.5,.2),new BABYLON.Color3(.02,.02,.02)),
  clothRed:mat('clothRed',new BABYLON.Color3(.7,.2,.15),new BABYLON.Color3(.02,.02,.02)),
  clothBlue:mat('clothBlue',new BABYLON.Color3(.2,.35,.7),new BABYLON.Color3(.02,.02,.02)),
  path:mat('path',new BABYLON.Color3(.45,.38,.28),new BABYLON.Color3(.03,.03,.03)),
  bridge:mat('bridge',new BABYLON.Color3(.5,.32,.15),new BABYLON.Color3(.03,.03,.03)),
  ruin:mat('ruin',new BABYLON.Color3(.42,.38,.32),new BABYLON.Color3(.04,.04,.04)),
  crystal:mat('crystal',new BABYLON.Color3(.3,.6,.9),new BABYLON.Color3(.4,.4,.5),
    new BABYLON.Color3(.15,.3,.5),.7),
  glowOrb:mat('glowOrb',new BABYLON.Color3(.5,.8,1),new BABYLON.Color3(.3,.3,.3),
    new BABYLON.Color3(.3,.5,.7),.8),
};

/* ── Helpers ── */
function box(n,w,h,d,x,y,z,m){
  const b=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);
  b.position.set(x,y,z);b.material=m||M.stone;
  b.receiveShadows=true;sg.addShadowCaster(b);return b;
}
function cyl(n,h,dt,db,x,y,z,m,tess){
  const c=BABYLON.MeshBuilder.CreateCylinder(n,{height:h,diameterTop:dt,diameterBottom:db,
    tessellation:tess||8},scene);
  c.position.set(x,y,z);c.material=m||M.stone;
  c.receiveShadows=true;sg.addShadowCaster(c);return c;
}
function sphere(n,d,x,y,z,m,seg){
  const s=BABYLON.MeshBuilder.CreateSphere(n,{diameter:d,segments:seg||8},scene);
  s.position.set(x,y,z);s.material=m||M.stone;sg.addShadowCaster(s);return s;
}
function cone(n,h,d,x,y,z,m){
  const c=BABYLON.MeshBuilder.CreateCylinder(n,{height:h,diameterTop:0,diameterBottom:d,
    tessellation:6},scene);
  c.position.set(x,y,z);c.material=m||M.pine;sg.addShadowCaster(c);return c;
}
function roofPrism(n,w,h,d,x,y,z,m){
  // Create a triangular prism roof using a custom mesh
  const pts=[
    new BABYLON.Vector3(-w/2,0,-d/2),new BABYLON.Vector3(w/2,0,-d/2),
    new BABYLON.Vector3(0,h,0),
    new BABYLON.Vector3(-w/2,0,d/2),new BABYLON.Vector3(w/2,0,d/2),
    new BABYLON.Vector3(0,h,0)
  ];
  // Simpler: use a box scaled on Y and rotated, or a cylinder with 3 sides
  const r=BABYLON.MeshBuilder.CreateCylinder(n,{height:d,diameterTop:0,diameterBottom:w*1.15,
    tessellation:3},scene);
  r.rotation.z=Math.PI/2;r.rotation.y=Math.PI/2;
  r.position.set(x,y,z);r.scaling.y=h/(w*.5);
  r.material=m||M.roof;sg.addShadowCaster(r);return r;
}

/* ── Floating Island Base ── */
function createIsland(){
  // Main island body - inverted mountain shape
  const islandParts=[];

  // Bottom rock mass - large inverted cone
  const base=cyl('islandBase',18,2,38,0,-9,0,M.darkRock,16);
  islandParts.push(base);

  // Mid section
  const mid=cyl('islandMid',10,28,32,0,2,0,M.rock,16);
  islandParts.push(mid);

  // Top surface - flat cylinder
  const top=cyl('islandTop',3,36,36,0,8.5,0,M.grass,24);
  islandParts.push(top);

  // Rocky outcroppings around the sides
  const rockPositions=[
    [-14,-2,8,4,6,3],[-10,-4,14,3,5,4],[8,-3,15,5,7,3],
    [15,-1,6,3,4,4],[-6,-5,-12,4,5,3],[12,-4,-10,3,6,3],
    [-16,0,-4,3,4,4],[4,-6,-16,5,4,3],[0,-7,-18,4,5,4],
    [-8,-3,16,3,4,3],[16,-2,-2,4,5,3],[-14,-1,-10,3,4,4]
  ];
  rockPositions.forEach((r,i)=>{
    const rk=sphere('rock'+i,Math.random()*2+2,r[0],r[1],r[2],M.darkRock,6);
    rk.scaling.set(r[3]/3,r[4]/3,r[5]/3);
    islandParts.push(rk);
  });

  // Hanging vines/roots underneath
  for(let i=0;i<15;i++){
    const angle=Math.random()*Math.PI*2;
    const rad=8+Math.random()*12;
    const vx=Math.cos(angle)*rad;
    const vz=Math.sin(angle)*rad;
    const vy=-12-Math.random()*8;
    const vine=cyl('vine'+i,4+Math.random()*6,.15,.3,vx,vy,vz,M.darkWood,4);
    vine.rotation.z=(Math.random()-.5)*.3;
    vine.rotation.x=(Math.random()-.5)*.3;
    islandParts.push(vine);
  }

  // Floating crystals underneath
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2;
    const rad=5+Math.random()*15;
    const cx=Math.cos(angle)*rad;
    const cz=Math.sin(angle)*rad;
    const cy=-15-Math.random()*10;
    const crystal=cone('crystal'+i,2+Math.random()*3,.8+Math.random()*1,cx,cy,cz,M.crystal);
    crystal.rotation.z=(Math.random()-.5)*.5;
    crystal.rotation.x=(Math.random()-.5)*.5;
    islandParts.push(crystal);
  }

  // Glowing orbs floating around island
  for(let i=0;i<12;i++){
    const angle=Math.random()*Math.PI*2;
    const rad=10+Math.random()*20;
    const ox=Math.cos(angle)*rad;
    const oz=Math.sin(angle)*rad;
    const oy=-5+Math.random()*20;
    const orb=sphere('orb'+i,.3+Math.random()*.4,ox,oy,oz,M.glowOrb,4);
    // Animate floating
    const phase=Math.random()*Math.PI*2;
    const speed=.5+Math.random()*1;
    const amp=.5+Math.random()*1.5;
    scene.registerBeforeRender(()=>{
      const t=performance.now()/1000;
      orb.position.y=oy+Math.sin(t*speed+phase)*amp;
    });
  }

  return islandParts;
}

/* ── Terrain Surface ── */
function createTerrain(){
  // Grass surface with slight variations
  // Main grass area
  const grassTop=cyl('grassTop',.5,34,34,0,10.1,0,M.grass,32);
  grassTop.receiveShadows=true;

  // Path from castle to village
  createPath();

  // River
  createRiver();
}

function createPath(){
  // Winding stone path
  const pathPoints=[
    [0,10.15,0],[2,10.15,3],[4,10.15,5],[5,10.15,8],
    [4,10.15,11],[2,10.15,13],[-1,10.15,14],[-4,10.15,13],
    [-6,10.15,10],[-7,10.15,7]
  ];
  pathPoints.forEach((p,i)=>{
    const s=box('path'+i,1.5,.1,1.5,p[0],p[1],p[2],M.path);
    s.receiveShadows=true;
  });

  // Additional path segments
  const path2=[
    [-7,10.15,7],[-8,10.15,4],[-7,10.15,1],[-5,10.15,-2],
    [-3,10.15,-5],[-1,10.15,-7],[1,10.15,-9]
  ];
  path2.forEach((p,i)=>{
    box('path2_'+i,1.2,.1,1.2,p[0],p[1],p[2],M.path);
  });
}

function createRiver(){
  // Turquoise river cutting across the island
  const riverParts=[];

  // Main river body - curved shape made of segments
  const riverPoints=[
    [-15,10.05,12],[-12,10.05,10],[-8,10.05,9],[-4,10.05,10],
    [0,10.05,11],[4,10.05,10],[8,10.05,8],[11,10.05,5],
    [13,10.05,2],[14,10.05,-2],[13,10.05,-6],[11,10.05,-10],
    [8,10.05,-13],[4,10.05,-15]
  ];

  for(let i=0;i<riverPoints.length;i++){
    const p=riverPoints[i];
    const w=2.5+Math.sin(i*.8)*.8;
    const r=box('river'+i,w,.15,2.2,p[0],p[1],p[2],M.water);
    r.receiveShadows=true;
    riverParts.push(r);
  }

  // Waterfall at the edge
  createWaterfall(14,10,-2,0,-1,0);
  createWaterfall(-15,10,12,-.3,-1,.2);
}

function createWaterfall(x,y,z,dx,dy,dz){
  // Waterfall particle-like mesh
  const wfHeight=15;
  const wf=cyl('wf',wfHeight,.8,1.2,x+dx*3,y-wfHeight/2+2,z+dz*3,M.waterfall,6);
  wf.rotation.z=Math.atan2(dx,1)*.3;

  // Splash pool at bottom
  const splash=sphere('splash',2.5,x+dx*5,y-wfHeight+1,z+dz*5,M.waterfall,6);
  splash.scaling.y=.3;

  // Animated droplets
  for(let i=0;i<8;i++){
    const drop=sphere('drop'+x+i,.15+Math.random()*.15,x,y,z,M.glowOrb,4);
    const phase=Math.random()*Math.PI*2;
    const speed=1+Math.random()*2;
    const ox=(Math.random()-.5)*2;
    const oz=(Math.random()-.5)*2;
    scene.registerBeforeRender(()=>{
      const t=performance.now()/1000;
      const p=((t*speed+phase)%(Math.PI*2))/(Math.PI*2);
      drop.position.x=x+ox+dx*p*8;
      drop.position.y=y-p*wfHeight;
      drop.position.z=z+oz+dz*p*8;
      drop.material=M.waterfall;
      drop.scaling.setScalar(1-p*.5);
    });
  }
}

/* ── Castle ── */
function createCastle(){
  const cx=0,cz=0,baseY=10.2;

  // Castle foundation
  box('castleFound',16,.6,14,cx,baseY+.3,cz,M.darkStone);

  // Main keep
  box('keep',8,10,7,cx,baseY+5.6,cz,M.stone);

  // Keep roof
  const keepRoof=roofPrism('keepRoof',9,4,8,cx,baseY+12.5,cz,M.roofBlue);

  // Four corner towers
  const towerPositions=[[-6,0,-5],[6,0,-5],[-6,0,5],[6,0,5]];
  towerPositions.forEach((tp,i)=>{
    const tx=cx+tp[0],tz=cz+tp[2];
    cyl('tower'+i,12,2.5,2.8,tx,baseY+6.2,tz,M.stone,8);

    // Tower top (battlement)
    cyl('towerTop'+i,1.5,3.2,3.2,tx,baseY+12.8,tz,M.darkStone,8);

    // Tower roof (cone)
    cone('towerRoof'+i,4,3.5,tx,baseY+15,tz,M.roofBlue);

    // Tower windows
    for(let wy=0;wy<3;wy++){
      box('tw'+i+'_'+wy,.6,.8,.3,tx,baseY+4+wy*3,tz+1.5,M.window);
      box('tw2'+i+'_'+wy,.6,.8,.3,tx,baseY+4+wy*3,tz-1.5,M.window);
    }

    // Arrow slits
    for(let sy=0;sy<4;sy++){
      box('slit'+i+'_'+sy,.2,1.2,.3,tx+1.5,baseY+3+sy*2.5,tz,M.darkStone);
      box('slit2'+i+'_'+sy,.2,1.2,.3,tx-1.5,baseY+3+sy*2.5,tz,M.darkStone);
    }
  });

  // Castle walls connecting towers
  // Front wall
  box('wallFront',12,8,.8,cx,baseY+4.2,cz-5.5,M.stone);
  // Back wall
  box('wallBack',12,8,.8,cx,baseY+4.2,cz+5.5,M.stone);
  // Left wall
  box('wallLeft',.8,8,10,cx-6.5,baseY+4.2,cz,M.stone);
  // Right wall
  box('wallRight',.8,8,10,cx+6.5,baseY+4.2,cz,M.stone);

  // Battlements on walls
  for(let i=-5;i<=5;i+=1.5){
    box('batF'+i,.8,1.2,.8,i,baseY+8.8,cz-5.5,M.darkStone);
    box('batB'+i,.8,1.2,.8,i,baseY+8.8,cz+5.5,M.darkStone);
  }
  for(let i=-4;i<=4;i+=1.5){
    box('batL'+i,.8,1.2,.8,cx-6.5,baseY+8.8,i,M.darkStone);
    box('batR'+i,.8,1.2,.8,cx+6.5,baseY+8.8,i,M.darkStone);
  }

  // Gatehouse
  box('gateL',1.5,6,1.5,cx-1.5,baseY+3.2,cz-6,M.darkStone);
  box('gateR',1.5,6,1.5,cx+1.5,baseY+3.2,cz-6,M.darkStone);
  box('gateTop',4,1.5,1.5,cx,baseY+6.5,cz-6,M.darkStone);

  // Gate arch
  const arch=cyl('arch',.3,2,2,cx,baseY+5,cz-6,M.darkWood,3);
  arch.rotation.z=Math.PI/2;

  // Portcullis
  for(let i=-1;i<=1;i+=.4){
    box('port'+i,.1,4,.1,cx+i,baseY+3,cz-6.2,M.metal);
  }
  for(let j=1;j<=3;j+=.5){
    box('portH'+j,2.5,.1,.1,cx,baseY+1.5+j,cz-6.2,M.metal);
  }

  // Flags on towers
  towerPositions.forEach((tp,i)=>{
    const tx=cx+tp[0],tz=cz+tp[2];
    const pole=cyl('pole'+i,3,.08,.08,tx,baseY+17,tz,M.metal,4);
    const flag=box('flag'+i,1.5,.8,.05,tx+.8,baseY+18,tz,i%2===0?M.flag:M.flagBlue);
  });

  // Castle flag (main)
  const mainPole=cyl('mainPole',5,.1,.1,cx,baseY+17,cz,M.metal,4);
  const mainFlag=box('mainFlag',2,1.2,.05,cx+1.1,baseY+19,cz,M.flag);

  // Inner courtyard details
  // Well
  cyl('well',1.2,1.5,1.5,cx+2,baseY+.8,cz+2,M.darkStone,8);
  cyl('wellInner',1.2,1,1,cx+2,baseY+.8,cz+2,M.water,8);

  // Courtyard barrels
  for(let i=0;i<4;i++){
    cyl('barrel'+i,1,.6,.6,cx-3+i*1.5,baseY+.65,cz+3,M.wood,8);
  }
}

/* ── Village Houses ── */
function createHouse(x,z,baseY,w,h,d,roofColor,name){
  const group=[];

  // Main structure
  const walls=box('house_'+name,w,h,d,x,baseY+h/2,z,M.wood);
  group.push(walls);

  // Whitewash lower portion
  box('houseBase_'+name,w+.1,h*.4,d+.1,x,baseY+h*.2,z,M.stone);

  // Roof
  const roof=roofPrism('roof_'+name,w+1,h*.7,d+1,x,baseY+h+h*.35,z,roofColor||M.roof);
  group.push(roof);

  // Door
  box('door_'+name,.7,1.2,.15,x,baseY+.6,z-d/2-.05,M.door);

  // Windows
  box('win_'+name+'_1',.5,.5,.15,x-w/4,baseY+h*.6,z-d/2-.05,M.windowLit);
  box('win_'+name+'_2',.5,.5,.15,x+w/4,baseY+h*.6,z-d/2-.05,M.windowLit);

  // Chimney
  box('chimney_'+name,.5,1.5,.5,x+w/3,baseY+h+h*.5,z-d/4,M.darkStone);

  return group;
}

function createVillage(){
  const baseY=10.2;

  // Houses around the village area
  const houses=[
    {x:-8,z:8,w:3,h:3,d:2.5,roof:M.roof,name:'house1'},
    {x:-11,z:5,w:2.5,h:2.8,d:2.5,roof:M.roof,name:'house2'},
    {x:-5,z:11,w:3.5,h:3.2,d:3,roof:M.roofGreen,name:'house3'},
    {x:-9,z:12,w:2.8,h:2.5,d:2.2,roof:M.roof,name:'house4'},
    {x:-3,z:8,w:3,h:3.5,d:2.8,roof:M.roofGreen,name:'house5'},
    {x:-12,z:-3,w:3,h:3,d:2.5,roof:M.roof,name:'house6'},
    {x:-10,z:-7,w:2.5,h:2.8,d:2.5,roof:M.roof,name:'house7'},
    {x:-7,z:-10,w:3.2,h:3,d:2.8,roof:M.roofGreen,name:'house8'},
    {x:8,z:10,w:3,h:3,d:2.5,roof:M.roof,name:'house9'},
    {x:11,z:7,w:2.8,h:2.5,d:2.5,roof:M.roof,name:'house10'},
    {x:5,z:-10,w:3,h:3.2,d:2.5,roof:M.roof,name:'house11'},
    {x:9,z:-8,w:2.5,h:2.8,d:2.5,roof:M.roofGreen,name:'house12'},
  ];

  houses.forEach(h=>{
    createHouse(h.x,h.z,baseY,h.w,h.h,h.d,h.roof,h.name);
  });

  // Tavern (larger building)
  createTavern(-6,14,baseY);

  // Market stalls
  createMarket(-2,15,baseY);

  // Riverside mill
  createMill(10,8,baseY);
}

function createTavern(x,z,baseY){
  // Main building
  box('tavern',6,4,5,x,baseY+2,z,M.darkWood);
  box('tavernBase',6.1,1.5,5.1,x,baseY+.75,z,M.stone);

  // Roof
  roofPrism('tavernRoof',7,3,6,x,baseY+5.5,z,M.roof);

  // Sign
  box('tavernSign',2,.6,.1,x,baseY+3.5,z-2.6,M.wood);
  box('tavernSignPole',.1,1,.1,x,baseY+4.2,z-2.55,M.darkWood);

  // Large door
  box('tavernDoor',1.2,2,.2,x,baseY+1,z-2.6,M.door);

  // Large windows (lit)
  box('tWin1',.8,.6,.15,x-1.5,baseY+2.5,z-2.6,M.windowLit);
  box('tWin2',.8,.6,.15,x+1.5,baseY+2.5,z-2.6,M.windowLit);
  box('tWin3',.8,.6,.15,x-1.5,baseY+2.5,z+2.6,M.windowLit);
  box('tWin4',.8,.6,.15,x+1.5,baseY+2.5,z+2.6,M.windowLit);

  // Chimney
  box('tavernChimney',.8,2,.8,x+2,baseY+6,z-1,M.darkStone);

  // Barrel outside
  cyl('tavernBarrel',1.2,.8,.8,x+3.5,baseY+.6,z-1,M.wood,8);
  cyl('tavernBarrel2',1.2,.8,.8,x+3.5,baseY+.6,z+.5,M.wood,8);
}

function createMarket(x,z,baseY){
  // Market stalls with colorful canopies
  const stalls=[
    {sx:x-3,sz:z,canopy:M.clothRed,name:'stall1'},
    {sx:x,sz:z,canopy:M.cloth,name:'stall2'},
    {sx:x+3,sz:z,canopy:M.clothBlue,name:'stall3'},
    {sx:x-1.5,sz:z+3,canopy:M.cloth,name:'stall4'},
    {sx:x+1.5,sz:z+3,canopy:M.clothRed,name:'stall5'},
  ];

  stalls.forEach(s=>{
    // Stall base/table
    box(s.name+'_table',2,.6,1.5,s.sx,baseY+.3,s.sz,M.wood);

    // Posts
    cyl(s.name+'_p1',2.5,.08,.08,s.sx-.9,baseY+1.25,s.sz-.6,M.darkWood,4);
    cyl(s.name+'_p2',2.5,.08,.08,s.sx+.9,baseY+1.25,s.sz-.6,M.darkWood,4);
    cyl(s.name+'_p3',2.5,.08,.08,s.sx-.9,baseY+1.25,s.sz+.6,M.darkWood,4);
    cyl(s.name+'_p4',2.5,.08,.08,s.sx+.9,baseY+1.25,s.sz+.6,M.darkWood,4);

    // Canopy
    box(s.name+'_canopy',2.2,.08,1.7,s.sx,baseY+2.5,s.sz,s.canopy);

    // Goods on table
    sphere(s.name+'_g1',.3,s.sx-.4,baseY+.75,s.sz,M.clothRed,4);
    sphere(s.name+'_g2',.25,s.sx+.3,baseY+.72,s.sz+.2,M.clothBlue,4);
    box(s.name+'_g3',.4,.3,.4,s.sx+.5,baseY+.75,s.sz-.2,M.cloth);
  });

  // Market well/fountain
  cyl('marketFountain',1,2,2,x,baseY+.5,z+6,M.stone,8);
  cyl('marketWater',.8,1.6,1.6,x,baseY+.5,z+6,M.water,8);
}

function createMill(x,z,baseY){
  // Mill building
  box('mill',4,3.5,3.5,x,baseY+1.75,z,M.wood);
  box('millBase',4.1,1.2,3.6,x,baseY+.6,z,M.stone);
  roofPrism('millRoof',5,2.5,4.5,x,baseY+4.7,z,M.roofGreen);

  // Water wheel
  const wheelY=baseY+1.5;
  const wheelZ=z+2;
  cyl('millWheel',.4,2.5,2.5,x,wheelY,wheelZ,M.darkWood,12);

  // Wheel spokes
  for(let i=0;i<6;i++){
    const angle=i*Math.PI/3;
    const spoke=box('spoke'+i,.15,2.2,.15,
      x+Math.cos(angle)*0,wheelY+Math.sin(angle)*1.1,wheelZ,M.darkWood);
    spoke.rotation.x=angle;
  }

  // Wheel axle
  cyl('millAxle',3.5,.2,.2,x,wheelY,wheelZ,M.metal,6);

  // Mill door
  box('millDoor',.8,1.5,.15,x-1,baseY+.75,z-1.8,M.door);

  // Mill window
  box('millWin',.5,.5,.15,x+1,baseY+2.2,z-1.8,M.window);
}

/* ── Bridges ── */
function createBridges(){
  const baseY=10.2;

  // Bridge 1
  createBridge(-4,baseY,10,3);
  // Bridge 2
  createBridge(8,baseY,8,2.5);
}

function createBridge(x,baseY,z,width){
  // Bridge deck
  box('bridgeDeck_'+x+''+z,width,.2,3,x,baseY+.1,z,M.bridge);

  // Railings
  for(let i=-1;i<=1;i+=2){
    box('bridgeRail_'+x+''+z+i,.1,.8,3,x+i*width/2,baseY+.5,z,M.darkWood);
  }

  // Support posts
  for(let i=-1;i<=1;i+=2){
    cyl('bridgePost_'+x+''+z+i,1.5,.1,.1,x+i*width/2,baseY-.5,z-1.2,M.darkWood,4);
    cyl('bridgePost2_'+x+''+z+i,1.5,.1,.1,x+i*width/2,baseY-.5,z+1.2,M.darkWood,4);
  }
}

/* ── Pine Trees ── */
function createPineTree(x,z,baseY,height){
  const h=height||4+Math.random()*4;

  // Trunk
  cyl('trunk_'+x+''+z,h*.35,.15,.25,x,baseY+h*.175,z,M.trunk,6);

  // Foliage layers
  const layers=3+Math.floor(Math.random()*2);
  for(let i=0;i<layers;i++){
    const layerH=h*.25;
    const layerY=baseY+h*.3+i*layerH*.7;
    const layerD=h*.45*(1-i*.15);
    cone('pine_'+x+''+z+'_'+i,layerH,layerD,x,layerY+layerH/2,z,
      i%2===0?M.pine:M.pineDark);
  }
}

function createTrees(){
  const baseY=10.2;

  // Trees scattered around the island
  const treePositions=[
    [-14,6,5],[-13,8,4],[-15,4,6],[-12,10,3.5],
    [-14,-6,5.5],[-13,-8,4],[-15,-4,6],
    [14,6,5],[13,8,4.5],[15,4,5.5],[12,10,4],
    [14,-6,5],[13,-8,4.5],[15,-4,6],
    [-10,14,4.5],[-8,16,5],[-12,14,4],
    [10,-12,5],[8,-14,4.5],[12,-12,5.5],
    [-6,-14,4],[4,14,4.5],[6,16,5],
    [-16,0,4.5],[16,0,5],[-4,-16,4],[4,-16,4.5],
    [0,14,3.5],[2,16,4],[-2,16,4.5],
    [-16,10,5],[16,-10,4.5],[-16,-10,5],[16,10,4],
  ];

  treePositions.forEach(t=>{
    createPineTree(t[0],t[1],baseY,t[2]);
  });
}

/* ── Ruined Watchtower ── */
function createRuinedWatchtower(){
  const baseY=10.2;
  const rx=-14,rz=-14;

  // Broken tower base
  cyl('ruinBase',5,3,3.5,rx,baseY+2.5,rz,M.ruin,8);

  // Broken wall sections
  box('ruinWall1',.8,6,3,rx+1.8,baseY+3,rz,M.ruin);
  box('ruinWall2',3,4,.8,rx,baseY+2,rz+1.8,M.ruin);
  box('ruinWall3',.8,3,2.5,rx-1.5,baseY+1.5,rz-.5,M.ruin);

  // Rubble
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2;
    const dist=2+Math.random()*3;
    const bx=rx+Math.cos(angle)*dist;
    const bz=rz+Math.sin(angle)*dist;
    sphere('rubble'+i,.3+Math.random()*.5,bx,baseY+.15,bz,M.ruin,4);
  }

  // Broken staircase
  for(let i=0;i<4;i++){
    box('ruinStep'+i,1,.3,.8,rx-.5+i*.3,baseY+.5+i*.6,rz+2.5,M.darkStone);
  }

  // Tattered flag
  const rPole=cyl('ruinPole',3,.06,.06,rx,baseY+7,rz,M.metal,4);
  const rFlag=box('ruinFlag',.8,.5,.05,rx+.45,baseY+8.2,rz,M.flag);
  rFlag.rotation.z=.3;
}

/* ── Details ── */
function createDetails(){
  const baseY=10.2;

  // Fences around village
  const fencePosts=[
    [-9,10.2,6],[-7,10.2,6],[-5,10.2,7],[-3,10.2,7],
    [-1,10.2,8],[1,10.2,8],[3,10.2,7]
  ];
  fencePosts.forEach((fp,i)=>{
    cyl('fence'+i,1,.08,.08,fp[0],fp[1]+.5,fp[2],M.darkWood,4);
    if(i>0){
      const prev=fencePosts[i-1];
      const dx=fp[0]-prev[0],dz=fp[2]-prev[2];
      const len=Math.sqrt(dx*dx+dz*dz);
      const rail=box('fenceRail'+i,len,.06,.06,
        prev[0]+dx/2,prev[1]+.7,prev[2]+dz/2,M.darkWood);
      rail.rotation.y=Math.atan2(dx,dz);
    }
  });

  // Hay bales
  for(let i=0;i<5;i++){
    const angle=Math.random()*Math.PI*2;
    const dist=6+Math.random()*8;
    cyl('hay'+i,.8,.7,.7,Math.cos(angle)*dist,baseY+.4,Math.sin(angle)*dist,M.cloth,6);
  }

  // Lanterns along path
  const lanternPositions=[
    [2,10.2,3],[4,10.2,5],[-4,10.2,13],[-7,10.2,7],
    [-5,10.2,-2],[-1,10.2,-7]
  ];
  lanternPositions.forEach((lp,i)=>{
    cyl('lanternPole'+i,2,.05,.05,lp[0],lp[1]+1,lp[2],M.darkWood,4);
    const lantern=box('lantern'+i,.3,.4,.3,lp[0],lp[1]+2.2,lp[2],M.windowLit);
    // Point light for lantern
    const lLight=new BABYLON.PointLight('lLight'+i,
      new BABYLON.Vector3(lp[0],lp[1]+2.2,lp[2]),scene);
    lLight.diffuse=new BABYLON.Color3(1,.8,.4);
    lLight.intensity=.3;lLight.range=6;
  });

  // Benches
  box('bench1',1.5,.1,.5,-8,baseY+.4,10,M.wood);
  box('bench1Leg1',.1,.4,.4,-8.5,baseY+.2,10,M.darkWood);
  box('bench1Leg2',.1,.4,.4,-7.5,baseY+.2,10,M.darkWood);

  box('bench2',1.5,.1,.5,6,baseY+.4,12,M.wood);
  box('bench2Leg1',.1,.4,.4,5.5,baseY+.2,12,M.darkWood);
  box('bench2Leg2',.1,.4,.4,6.5,baseY+.2,12,M.darkWood);

  // Cart/wagon
  box('cart',2,.6,1.2,12,baseY+.4,-5,M.wood);
  cyl('cartWheel1',.1,.6,.6,12.7,baseY+.3,-5.7,M.darkWood,8);
  cyl('cartWheel2',.1,.6,.6,12.7,baseY+.3,-4.3,M.darkWood,8);
  cyl('cartWheel3',.1,.6,.6,11.3,baseY+.3,-5.7,M.darkWood,8);
  cyl('cartWheel4',.1,.6,.6,11.3,baseY+.3,-4.3,M.darkWood,8);

  // Crates
  box('crate1',.6,.6,.6,-3,baseY+.3,16,M.wood);
  box('crate2',.6,.6,.6,-2.5,baseY+.3,16.2,M.darkWood);
  box('crate3',.5,.5,.5,-3,baseY+.9,16,M.wood);

  // Flower patches
  const flowerColors=[
    new BABYLON.Color3(.9,.2,.3),new BABYLON.Color3(.9,.7,.2),
    new BABYLON.Color3(.3,.5,.9),new BABYLON.Color3(.9,.4,.8),
    new BABYLON.Color3(1,.9,.3)
  ];
  for(let i=0;i<20;i++){
    const angle=Math.random()*Math.PI*2;
    const dist=4+Math.random()*12;
    const fx=Math.cos(angle)*dist;
    const fz=Math.sin(angle)*dist;
    const fc=flowerColors[Math.floor(Math.random()*flowerColors.length)];
    const fm=mat('flower'+i,fc,new BABYLON.Color3(.05,.05,.05),fc.scale(.2));
    sphere('flower'+i,.2+Math.random()*.2,fx,baseY+.15,fz,fm,4);
  }

  // Mushrooms
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2;
    const dist=10+Math.random()*6;
    const mx=Math.cos(angle)*dist;
    const mz=Math.sin(angle)*dist;
    cyl('mushStem'+i,.3,.1,.12,mx,baseY+.15,mz,new BABYLON.Color3(.9,.85,.7),4);
    const mushMat=mat('mushCap'+i,new BABYLON.Color3(.8,.15,.1),
      new BABYLON.Color3(.05,.05,.05));
    sphere('mushCap'+i,.35,mx,baseY+.35,mz,mushMat,6);
  }
}

/* ── Build Everything ── */
createIsland();
createTerrain();
createCastle();
createVillage();
createBridges();
createTrees();
createRuinedWatchtower();
createDetails();

/* ── Animation Loop ── */
let time=0;
scene.registerBeforeRender(()=>{
  time+=engine.getDeltaTime()/1000;

  // Gentle water shimmer
  if(M.water.diffuseColor){
    M.water.diffuseColor.g=.55+Math.sin(time*2)*.05;
    M.water.diffuseColor.b=.55+Math.sin(time*2.3)*.05;
  }

  // Waterfall shimmer
  if(M.waterfall.alpha){
    M.waterfall.alpha=.55+Math.sin(time*3)*.1;
  }

  // Crystal pulse
  if(M.crystal.emissiveColor){
    M.crystal.emissiveColor.r=.15+Math.sin(time*1.5)*.1;
    M.crystal.emissiveColor.b=.5+Math.sin(time*1.8)*.2;
  }

  // Glow orb pulse
  if(M.glowOrb.emissiveColor){
    M.glowOrb.emissiveColor.g=.5+Math.sin(time*2)*.2;
  }
});

/* ── Render ── */
engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());

})();
</script>
</body>
</html>
