<!DOCTYPE html>
<html>
<head>
    <title>3D Floating Island Diorama</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        var canvas = document.createElement('canvas');
        document.body.appendChild(canvas);

        var engine = new BABYLON.Engine(canvas, true);
        var scene = new BABYLON.Scene(engine);

        // Camera
        var camera = new BABYLON.FreeCamera('camera', new BABYLON.Vector3(0, 50, -100), scene);
        camera.setTarget(BABYLON.Vector3.Zero());
        camera.attachControl(canvas, true);

        // Light
        var light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.7;

        // Materials
        var groundMaterial = new BABYLON.StandardMaterial('groundMaterial', scene);
        groundMaterial.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);

        // Ground
        var ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 100, height: 100 }, scene);
        ground.material = groundMaterial;

        // Castle
        var castle = BABYLON.MeshBuilder.CreateBox('castle', { size: 10 }, scene);
        castle.position.y = 5;

        // Village
        // Add more 3D models to create the village scene

        // Render loop
        engine.runRenderLoop(function () {
            scene.render();
        });

        // Resize
        window.addEventListener('resize', function () {
            engine.resize();
        });
    </script>
</body>
</html>
