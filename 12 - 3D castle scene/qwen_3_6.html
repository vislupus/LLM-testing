<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Island Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { width: 100vw; height: 100vh; outline: none; }
        #info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: #eee; padding: 8px 16px; border-radius: 20px;
            font-size: 13px; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">🖱️ Orbit: Left-click & drag | Zoom: Scroll | Pan: Right-click & drag</div>
    <script>
        const canvas = document.getElementById("canvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.65, 0.8, 0.95, 1);
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.003;
        scene.ambientColor = new BABYLON.Color3(0.35, 0.3, 0.25);

        // Camera
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 4, Math.PI / 3.2, 85, new BABYLON.Vector3(0, 8, 0), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 35;
        camera.upperRadiusLimit = 130;
        camera.lowerBetaLimit = 0.15;
        camera.upperBetaLimit = Math.PI / 2.05;
        camera.wheelPrecision = 30;
        camera.panningSensibility = 400;

        // Lights
        const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemi.intensity = 0.55;
        hemi.groundColor = new BABYLON.Color3(0.25, 0.35, 0.2);
        const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1.5, -2.5, -1), scene);
        sun.position = new BABYLON.Vector3(25, 50, 20);
        sun.intensity = 0.75;
        const fill = new BABYLON.PointLight("fill", new BABYLON.Vector3(-15, 10, -15), scene);
        fill.intensity = 0.15;
        fill.diffuse = new BABYLON.Color3(0.8, 0.9, 1.0);

        // Materials
        const mat = (color, name) => {
            const m = new BABYLON.StandardMaterial(name, scene);
            m.diffuseColor = color;
            m.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);
            m.specularPower = 16;
            return m;
        };
        const stoneMat = mat(new BABYLON.Color3(0.55, 0.52, 0.48), "stone");
        const darkStoneMat = mat(new BABYLON.Color3(0.42, 0.4, 0.38), "darkStone");
        const roofMat = mat(new BABYLON.Color3(0.55, 0.18, 0.15), "roof");
        const woodMat = mat(new BABYLON.Color3(0.45, 0.28, 0.15), "wood");
        const lightWoodMat = mat(new BABYLON.Color3(0.65, 0.48, 0.3), "lightWood");
        const grassMat = mat(new BABYLON.Color3(0.25, 0.62, 0.2), "grass");
        const darkGrassMat = mat(new BABYLON.Color3(0.18, 0.5, 0.15), "darkGrass");
        const cliffMat = mat(new BABYLON.Color3(0.45, 0.38, 0.3), "cliff");
        const rockMat = mat(new BABYLON.Color3(0.5, 0.45, 0.4), "rock");
        const turquoiseMat = mat(new BABYLON.Color3(0.2, 0.7, 0.75), "turquoise");
        turquoiseMat.alpha = 0.75;
        turquoiseMat.specularColor = new BABYLON.Color3(0.6, 0.6, 0.6);
        const pineMat = mat(new BABYLON.Color3(0.12, 0.38, 0.15), "pine");
        const darkPineMat = mat(new BABYLON.Color3(0.08, 0.3, 0.1), "darkPine");
        const pathMat = mat(new BABYLON.Color3(0.55, 0.48, 0.38), "path");
        const waterMat = mat(new BABYLON.Color3(0.15, 0.65, 0.7), "water");
        waterMat.alpha = 0.6;
        waterMat.specularColor = new BABYLON.Color3(0.7, 0.7, 0.7);
        const ruinMat = mat(new BABYLON.Color3(0.48, 0.45, 0.4), "ruin");
        ruinMat.diffuseColor = new BABYLON.Color3(0.52, 0.48, 0.42);
        const accentMat = mat(new BABYLON.Color3(0.75, 0.6, 0.25), "accent");

        // Helper functions
        const place = (mesh, x, y, z, sx=1, sy=1, sz=1) => {
            mesh.position.set(x, y, z);
            mesh.scaling.set(sx, sy, sz);
            return mesh;
        };
        const rot = (mesh, x, y, z) => {
            mesh.rotation.set(x, y, z);
            return mesh;
        };

        // ===== FLOATING ISLAND BASE =====
        const islandGroup = new BABYLON.TransformNode("island", scene);

        // Top surface (grass-covered plateau)
        const islandTop = BABYLON.MeshBuilder.CreateCylinder("islandTop", {
            height: 3, diameterTop: 55, diameterBottom: 48, tessellation: 32
        }, scene);
        place(islandTop, 0, 1.5, 0);
        islandTop.material = grassMat;
        islandTop.parent = islandGroup;

        // Island underside (rocky inverted cone)
        const islandBottom = BABYLON.MeshBuilder.CreateCylinder("islandBottom", {
            height: 25, diameterTop: 48, diameterBottom: 6, tessellation: 16
        }, scene);
        place(islandBottom, 0, -11, 0);
        islandBottom.material = cliffMat;
        islandBottom.parent = islandGroup;

        // Stalactite-like formations
        for (let i = 0; i < 15; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = 12 + Math.random() * 16;
            const h = 3 + Math.random() * 8;
            const stal = BABYLON.MeshBuilder.CreateCylinder("stal" + i, {
                height: h, diameterTop: 0.3 + Math.random() * 0.5, diameterBottom: 1.5 + Math.random() * 2, tessellation: 6
            }, scene);
            place(stal, Math.cos(a) * r, -22 - h/2, Math.sin(a) * r);
            stal.material = cliffMat;
            stal.rotation.z = (Math.random() - 0.5) * 0.3;
            stal.parent = islandGroup;
        }

        // Edge cliffs (rocky outcrops around perimeter)
        const cliffPositions = [
            {a: 0, r: 24, h: 4}, {a: 0.8, r: 22, h: 6}, {a: 1.5, r: 25, h: 5},
            {a: 2.3, r: 23, h: 7}, {a: 3.1, r: 24, h: 5}, {a: 3.8, r: 21, h: 6},
            {a: 4.5, r: 25, h: 4}, {a: 5.2, r: 23, h: 8}, {a: 5.8, r: 24, h: 5}
        ];
        cliffPositions.forEach((c, i) => {
            const cliff = BABYLON.MeshBuilder.CreateCylinder("cliff" + i, {
                height: c.h, diameterTop: 2 + Math.random() * 3, diameterBottom: 4 + Math.random() * 3, tessellation: 7
            }, scene);
            place(cliff, Math.cos(c.a) * c.r, c.h/2 - 1, Math.sin(c.a) * c.r);
            cliff.material = cliffMat;
            cliff.rotation.z = (Math.random() - 0.5) * 0.2;
            cliff.rotation.x = (Math.random() - 0.5) * 0.15;
            cliff.parent = islandGroup;
        });

        // ===== TERRAIN VARIATION =====
        // Small hills
        const hills = [
            {x: 12, z: 8, r: 5, h: 2.5}, {x: -10, z: 12, r: 4, h: 2},
            {x: -15, z: -8, r: 6, h: 3}, {x: 14, z: -12, r: 4.5, h: 2.2}
        ];
        hills.forEach((h, i) => {
            const hill = BABYLON.MeshBuilder.CreateSphere("hill" + i, {
                diameterX: h.r * 2, diameterY: h.h * 2, diameterZ: h.r * 2, segments: 10
            }, scene);
            place(hill, h.x, h.h - 1, h.z);
            hill.material = grassMat;
            hill.parent = islandGroup;
        });

        // ===== CASTLE (Center) =====
        const castleGroup = new BABYLON.TransformNode("castle", scene);

        // Main keep
        const keep = BABYLON.MeshBuilder.CreateBox("keep", {
            width: 10, height: 14, depth: 12
        }, scene);
        place(keep, 0, 5, 0);
        keep.material = stoneMat;
        keep.parent = castleGroup;

        // Keep roof
        const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", {
            height: 4, diameterTop: 0.5, diameterBottom: 13, tessellation: 4
        }, scene);
        place(keepRoof, 0, 14, 0);
        keepRoof.material = roofMat;
        rot(keepRoof, 0, Math.PI / 4, 0);
        keepRoof.parent = castleGroup;

        // Corner towers
        const towerPositions = [
            {x: -5, z: -5}, {x: 5, z: -5}, {x: -5, z: 5}, {x: 5, z: 5}
        ];
        towerPositions.forEach((t, i) => {
            const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + i, {
                height: 16, diameterTop: 2.5, diameterBottom: 3.2, tessellation: 8
            }, scene);
            place(tower, t.x, 6, t.z);
            tower.material = stoneMat;
            tower.parent = castleGroup;

            const towerRoof = BABYLON.MeshBuilder.CreateCylinder("towerRoof" + i, {
                height: 3.5, diameterTop: 0.2, diameterBottom: 3.8, tessellation: 8
            }, scene);
            place(towerRoof, t.x, 15.5, t.z);
            towerRoof.material = roofMat;
            towerRoof.parent = castleGroup;
        });

        // Castle walls
        const wallDefs = [
            {x: 0, z: -7, w: 14, d: 1.5}, {x: 0, z: 7, w: 14, d: 1.5},
            {x: -7, z: 0, w: 1.5, d: 14}, {x: 7, z: 0, w: 1.5, d: 14}
        ];
        wallDefs.forEach((w, i) => {
            const wall = BABYLON.MeshBuilder.CreateBox("wall" + i, {
                width: w.w, height: 6, depth: w.d
            }, scene);
            place(wall, w.x, 1.5, w.z);
            wall.material = stoneMat;
            wall.parent = castleGroup;

            // Battlements
            for (let b = 0; b < w.w; b += 1.2) {
                const bat = BABYLON.MeshBuilder.CreateBox("bat" + i + "_" + b, {
                    width: 0.8, height: 0.8, depth: w.d
                }, scene);
                place(bat, w.x + b - w.w/2 + 0.6, 4.8, w.z);
                bat.material = darkStoneMat;
                bat.parent = castleGroup;
            }
        });

        // Gatehouse
        const gateL = BABYLON.MeshBuilder.CreateBox("gateL", {
            width: 2.5, height: 8, depth: 2.5
        }, scene);
        place(gateL, -2.5, 2, -8);
        gateL.material = stoneMat;
        gateL.parent = castleGroup;

        const gateR = BABYLON.MeshBuilder.CreateBox("gateR", {
            width: 2.5, height: 8, depth: 2.5
        }, scene);
        place(gateR, 2.5, 2, -8);
        gateR.material = stoneMat;
        gateR.parent = castleGroup;

        const gateTop = BABYLON.MeshBuilder.CreateBox("gateTop", {
            width: 7.5, height: 2, depth: 3
        }, scene);
        place(gateTop, 0, 7, -8);
        gateTop.material = stoneMat;
        gateTop.parent = castleGroup;

        // Gate tower roofs
        [gateL, gateR].forEach((g, i) => {
            const gRoof = BABYLON.MeshBuilder.CreateCylinder("gRoof" + i, {
                height: 2.5, diameterTop: 0.3, diameterBottom: 3.5, tessellation: 8
            }, scene);
            place(gRoof, g.position.x, 9.5, g.position.z);
            gRoof.material = roofMat;
            gRoof.parent = castleGroup;
        });

        // ===== VILLAGE =====
        const villageGroup = new BABYLON.TransformNode("village", scene);

        function createHouse(x, z, rotY, scale=1) {
            const g = new BABYLON.TransformNode("house", scene);
            g.position.set(x, 0, z);
            g.rotation.y = rotY;
            g.parent = villageGroup;

            // Base
            const base = BABYLON.MeshBuilder.CreateBox("base", {
                width: 4, height: 3.5, depth: 3
            }, scene);
            place(base, 0, 1.75, 0);
            base.material = woodMat;
            base.scaling.setScalar(scale);
            base.parent = g;

            // Timber frame accents
            const beam1 = BABYLON.MeshBuilder.CreateBox("beam1", {
                width: 4.2, height: 0.2, depth: 3.2
            }, scene);
            place(beam1, 0, 3.5, 0);
            beam1.material = darkStoneMat;
            beam1.scaling.setScalar(scale);
            beam1.parent = g;

            const beam2 = BABYLON.MeshBuilder.CreateBox("beam2", {
                width: 4.2, height: 0.2, depth: 3.2
            }, scene);
            place(beam2, 0, 0.2, 0);
            beam2.material = darkStoneMat;
            beam2.scaling.setScalar(scale);
            beam2.parent = g;

            // Roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {
                height: 2.5, diameterTop: 0.2, diameterBottom: 5.2, tessellation: 3
            }, scene);
            place(roof, 0, 4.5, 0);
            roof.material = roofMat;
            rot(roof, 0, 0, 0);
            roof.scaling.setScalar(scale);
            roof.parent = g;

            // Door
            const door = BABYLON.MeshBuilder.CreateBox("door", {
                width: 0.8, height: 1.5, depth: 0.1
            }, scene);
            place(door, 0, 0.75, 1.55);
            door.material = darkStoneMat;
            door.scaling.setScalar(scale);
            door.parent = g;

            // Windows
            [-1.2, 1.2].forEach(wx => {
                const win = BABYLON.MeshBuilder.CreateBox("win", {
                    width: 0.6, height: 0.7, depth: 0.1
                }, scene);
                place(win, wx, 2, 1.55);
                win.material = accentMat;
                win.scaling.setScalar(scale);
                win.parent = g;
            });

            return g;
        }

        // Place houses
        createHouse(15, 5, -0.3, 0.9);
        createHouse(18, 2, 0.5, 0.8);
        createHouse(12, -2, 1.2, 1);
        createHouse(-15, 8, -0.8, 0.85);
        createHouse(-18, 4, 0.2, 0.9);
        createHouse(-12, -5, 2.0, 0.8);
        createHouse(8, 15, -0.5, 0.75);
        createHouse(-8, 16, 0.4, 0.8);
        createHouse(10, -10, 1.5, 0.85);
        createHouse(-10, -10, -1.2, 0.9);

        // ===== TAVERN =====
        const tavern = new BABYLON.TransformNode("tavern", scene);
        tavern.position.set(20, 0, 8);
        tavern.rotation.y = 0.4;
        tavern.parent = villageGroup;

        const tavernBase = BABYLON.MeshBuilder.CreateBox("tavernBase", {
            width: 6, height: 4, depth: 4
        }, scene);
        place(tavernBase, 0, 2, 0);
        tavernBase.material = woodMat;
        tavernBase.parent = tavern;

        const tavernRoof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", {
            height: 3, diameterTop: 0.3, diameterBottom: 7.5, tessellation: 3
        }, scene);
        place(tavernRoof, 0, 5.5, 0);
        tavernRoof.material = roofMat;
        tavernRoof.parent = tavern;

        // Tavern sign
        const signPost = BABYLON.MeshBuilder.CreateCylinder("signPost", {
            height: 2, diameter: 0.15
        }, scene);
        place(signPost, 3.5, 2, 0);
        signPost.material = darkStoneMat;
        signPost.parent = tavern;

        const sign = BABYLON.MeshBuilder.CreateBox("sign", {
            width: 1.8, height: 0.8, depth: 0.1
        }, scene);
        place(sign, 3.5, 3, 0.3);
        sign.material = accentMat;
        sign.parent = tavern;

        // ===== MARKET STALLS =====
        function createMarketStall(x, z, rotY) {
            const g = new BABYLON.TransformNode("stall", scene);
            g.position.set(x, 0, z);
            g.rotation.y = rotY;
            g.parent = villageGroup;

            // Posts
            [[-1.2, -1], [1.2, -1], [-1.2, 1], [1.2, 1]].forEach(([px, pz]) => {
                const post = BABYLON.MeshBuilder.CreateCylinder("post", {
                    height: 3, diameter: 0.2
                }, scene);
                place(post, px, 1.5, pz);
                post.material = woodMat;
                post.parent = g;
            });

            // Roof canopy
            const canopy = BABYLON.MeshBuilder.CreateBox("canopy", {
                width: 3.2, height: 0.2, depth: 2.8
            }, scene);
            place(canopy, 0, 3, 0);
            canopy.material = mat(new BABYLON.Color3(0.7, 0.25, 0.3), "canopy");
            canopy.parent = g;

            // Counter
            const counter = BABYLON.MeshBuilder.CreateBox("counter", {
                width: 2.5, height: 1, depth: 1.2
            }, scene);
            place(counter, 0, 0.5, 0.3);
            counter.material = lightWoodMat;
            counter.parent = g;

            // Goods on counter (small spheres)
            const colors = [new BABYLON.Color3(0.9, 0.2, 0.1), new BABYLON.Color3(0.9, 0.8, 0.1),
                           new BABYLON.Color3(0.3, 0.7, 0.2), new BABYLON.Color3(0.8, 0.4, 0.8)];
            colors.forEach((c, i) => {
                const good = BABYLON.MeshBuilder.CreateSphere("good" + i, {
                    diameter: 0.25
                }, scene);
                place(good, -0.8 + i * 0.5, 1.2, 0.5);
                good.material = mat(c, "good" + i);
                good.parent = g;
            });
        }

        createMarketStall(2, 12, 0);
        createMarketStall(-2, 13, 0.3);
        createMarketStall(6, 10, -0.2);

        // ===== RIVERSIDE MILL =====
        const millGroup = new BABYLON.TransformNode("mill", scene);
        millGroup.position.set(-20, 0, 15);
        millGroup.rotation.y = 0.6;
        millGroup.parent = villageGroup;

        // Mill house
        const millHouse = BABYLON.MeshBuilder.CreateBox("millHouse", {
            width: 5, height: 4.5, depth: 4
        }, scene);
        place(millHouse, 0, 2.25, 0);
        millHouse.material = stoneMat;
        millHouse.parent = millGroup;

        const millRoof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {
            height: 3, diameterTop: 0.2, diameterBottom: 6.5, tessellation: 3
        }, scene);
        place(millRoof, 0, 5.8, 0);
        millRoof.material = roofMat;
        millRoof.parent = millGroup;

        // Water wheel
        const wheelPivot = new BABYLON.TransformNode("wheelPivot", scene);
        wheelPivot.position.set(0, 2, 3);
        wheelPivot.parent = millGroup;

        const wheel = BABYLON.MeshBuilder.CreateTorus("wheel", {
            diameter: 3.5, thickness: 0.4, tessellation: 16
        }, scene);
        wheel.position.x = 1.5;
        wheel.material = woodMat;
        wheel.parent = wheelPivot;

        // Wheel spokes
        for (let i = 0; i < 8; i++) {
            const spoke = BABYLON.MeshBuilder.CreateBox("spoke" + i, {
                width: 0.15, height: 0.3, depth: 3.5
            }, scene);
            spoke.position.x = 1.5;
            spoke.rotation.x = (i / 8) * Math.PI;
            spoke.material = woodMat;
            spoke.parent = wheelPivot;
        }

        // Animate water wheel
        scene.registerBeforeRender(() => {
            wheelPivot.rotation.x += 0.015;
        });

        // Mill stream
        const millStream = BABYLON.MeshBuilder.CreateBox("millStream", {
            width: 1, height: 0.3, depth: 4
        }, scene);
        place(millStream, 1.5, 1.5, 4);
        millStream.material = waterMat;
        millStream.parent = millGroup;

        // ===== TURQUOISE RIVER =====
        const riverGroup = new BABYLON.TransformNode("river", scene);

        // Main river path (curved)
        const riverPoints = [
            new BABYLON.Vector3(-25, 0.5, 18),
            new BABYLON.Vector3(-15, 0.5, 12),
            new BABYLON.Vector3(-5, 0.5, 14),
            new BABYLON.Vector3(5, 0.5, 10),
            new BABYLON.Vector3(15, 0.5, 15),
            new BABYLON.Vector3(25, 0.5, 12)
        ];

        // Create river as series of connected boxes for simplicity
        for (let i = 0; i < riverPoints.length - 1; i++) {
            const p1 = riverPoints[i];
            const p2 = riverPoints[i + 1];
            const mid = p1.add(p2).scale(0.5);
            const len = BABYLON.Vector3.Distance(p1, p2);
            const angle = Math.atan2(p2.x - p1.x, p2.z - p1.z);

            const seg = BABYLON.MeshBuilder.CreateBox("riverSeg" + i, {
                width: 3 + Math.random(), height: 0.2, depth: len + 0.5
            }, scene);
            seg.position.copyFrom(mid);
            seg.position.y = 0.3;
            seg.rotation.y = angle;
            seg.material = turquoiseMat;
            seg.parent = riverGroup;
        }

        // River banks (subtle raised edges)
        for (let i = 0; i < riverPoints.length - 1; i++) {
            const p1 = riverPoints[i];
            const p2 = riverPoints[i + 1];
            const mid = p1.add(p2).scale(0.5);
            const len = BABYLON.Vector3.Distance(p1, p2);
            const angle = Math.atan2(p2.x - p1.x, p2.z - p1.z);

            [-1, 1].forEach(side => {
                const bank = BABYLON.MeshBuilder.CreateBox("bank" + i + "_" + side, {
                    width: 0.5, height: 0.6, depth: len
                }, scene);
                const offset = side * 2;
                bank.position.copyFrom(mid);
                bank.position.x += Math.cos(angle + Math.PI/2) * offset;
                bank.position.z += Math.sin(angle + Math.PI/2) * offset;
                bank.position.y = 0.3;
                bank.rotation.y = angle;
                bank.material = cliffMat;
                bank.parent = riverGroup;
            });
        }

        // ===== WATERFALL =====
        const waterfallGroup = new BABYLON.TransformNode("waterfall", scene);
        waterfallGroup.position.set(-18, 0, 10);
        waterfallGroup.parent = riverGroup;

        // Waterfall stream (falling water)
        const fall = BABYLON.MeshBuilder.CreateBox("fall", {
            width: 1.5, height: 12, depth: 0.5
        }, scene);
        place(fall, 0, -5, 0);
        fall.material = waterMat;
        fall.parent = waterfallGroup;

        // Mist particles
        const ps = new BABYLON.ParticleSystem("mist", 80, scene);
        ps.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
        ps.createPointEmitter(new BABYLON.Vector3(-0.5, 0, -0.5), new BABYLON.Vector3(0.5, 0.5, 0.5));
        ps.color1 = new BABYLON.Color4(0.7, 0.85, 0.9, 0.4);
        ps.color2 = new BABYLON.Color4(0.8, 0.9, 0.95, 0.2);
        ps.colorDead = new BABYLON.Color4(0.9, 0.95, 1, 0);
        ps.minSize = 0.3; ps.maxSize = 1.2;
        ps.minLifeTime = 0.8; ps.maxLifeTime = 2;
        ps.emitRate = 50;
        ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
        ps.minEmitPower = 0.5; ps.maxEmitPower = 2;
        ps.gravity = new BABYLON.Vector3(0, 0.5, 0);
        ps.updateSpeed = 0.015;
        ps.emitter = new BABYLON.Vector3(-18, -10.5, 10);
        ps.start();

        // ===== WOODEN BRIDGES =====
        function createBridge(x, z, rotY) {
            const g = new BABYLON.TransformNode("bridge", scene);
            g.position.set(x, 0.6, z);
            g.rotation.y = rotY;
            g.parent = villageGroup;

            // Bridge deck
            const deck = BABYLON.MeshBuilder.CreateBox("deck", {
                width: 6, height: 0.3, depth: 2.5
            }, scene);
            deck.position.y = 0.15;
            deck.material = lightWoodMat;
            deck.parent = g;

            // Planks detail
            for (let i = 0; i < 6; i++) {
                const plank = BABYLON.MeshBuilder.CreateBox("plank" + i, {
                    width: 0.08, height: 0.1, depth: 2.5
                }, scene);
                plank.position.set(-2.5 + i, 0.35, 0);
                plank.material = darkStoneMat;
                plank.parent = g;
            }

            // Railings
            [-1, 1].forEach(side => {
                const rail = BABYLON.MeshBuilder.CreateBox("rail" + side, {
                    width: 6, height: 0.15, depth: 0.15
                }, scene);
                rail.position.set(0, 0.8, side * 1.1);
                rail.material = woodMat;
                rail.parent = g;

                for (let p = 0; p < 4; p++) {
                    const post = BABYLON.MeshBuilder.CreateCylinder("rPost" + side + p, {
                        height: 1, diameter: 0.12
                    }, scene);
                    post.position.set(-2 + p * 1.3, 0.65, side * 1.1);
                    post.material = woodMat;
                    post.parent = g;
                }
            });
        }

        createBridge(-8, 12, 0.5);
        createBridge(12, 11, -0.3);

        // ===== PINE TREES =====
        function createPineTree(x, z, scale=1) {
            const g = new BABYLON.TransformNode("pine", scene);
            g.position.set(x, 0, z);
            g.parent = villageGroup;

            // Trunk
            const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
                height: 2.5 * scale, diameterTop: 0.25 * scale, diameterBottom: 0.5 * scale, tessellation: 6
            }, scene);
            place(trunk, 0, 1.25 * scale, 0);
            trunk.material = woodMat;
            trunk.parent = g;

            // Foliage layers
            const foliageLayers = [
                {y: 3, d: 3.5, h: 2}, {y: 4.5, d: 2.8, h: 1.8},
                {y: 5.8, d: 2, h: 1.5}, {y: 7, d: 1.2, h: 1.2}
            ];
            foliageLayers.forEach((f, i) => {
                const foliage = BABYLON.MeshBuilder.CreateCylinder("foliage" + i, {
                    height: f.h * scale, diameterTop: 0.15 * scale, diameterBottom: f.d * scale, tessellation: 8
                }, scene);
                place(foliage, 0, f.y * scale, 0);
                foliage.material = i % 2 === 0 ? pineMat : darkPineMat;
                foliage.parent = g;
            });
        }

        // Scatter pine trees
        const treePositions = [
            [-22, 5], [-25, -2], [-20, -8], [-24, 8], [-18, 12],
            [22, -3], [25, 5], [20, -10], [24, 10], [26, -5],
            [-12, 18], [-8, -15], [8, -18], [-15, -15],
            [15, 18], [-28, 3], [28, 2], [-5, -20], [10, -20]
        ];
        treePositions.forEach(([x, z], i) => {
            createPineTree(x, z, 0.7 + Math.random() * 0.5);
        });

        // ===== RUINED WATCHTOWER =====
        const ruinGroup = new BABYLON.TransformNode("ruin", scene);
        ruinGroup.position.set(25, 0, -18);
        ruinGroup.parent = villageGroup;

        // Broken tower base
        const ruinBase = BABYLON.MeshBuilder.CreateCylinder("ruinBase", {
            height: 8, diameterTop: 2.8, diameterBottom: 3.5, tessellation: 8
        }, scene);
        place(ruinBase, 0, 4, 0);
        ruinBase.material = ruinMat;
        ruinBase.parent = ruinGroup;

        // Jagged top (irregular pieces)
        const jaggedPieces = [
            {x: 0.5, y: 9, z: 0.5, s: 1.2}, {x: -0.8, y: 8.5, z: -0.3, s: 0.8},
            {x: 0.2, y: 9.2, z: -0.8, s: 0.6}, {x: -0.3, y: 8.8, z: 0.7, s: 1}
        ];
        jaggedPieces.forEach((p, i) => {
            const piece = BABYLON.MeshBuilder.CreateBox("jagged" + i, {
                width: p.s, height: p.s * 1.5, depth: p.s
            }, scene);
            place(piece, p.x, p.y, p.z);
            piece.rotation.z = (Math.random() - 0.5) * 0.4;
            piece.rotation.x = (Math.random() - 0.5) * 0.3;
            piece.material = ruinMat;
            piece.parent = ruinGroup;
        });

        // Crumbling wall section
        const ruinWall = BABYLON.MeshBuilder.CreateBox("ruinWall", {
            width: 4, height: 3.5, depth: 0.8
        }, scene);
        place(ruinWall, -4, 1.75, 0);
        ruinWall.rotation.z = 0.1;
        ruinWall.material = ruinMat;
        ruinWall.parent = ruinGroup;

        // Broken window opening
        const windowFrame = BABYLON.MeshBuilder.CreateBox("winFrame", {
            width: 0.8, height: 1.2, depth: 0.1
        }, scene);
        place(windowFrame, 0.5, 5, 2.1);
        windowFrame.material = darkStoneMat;
        windowFrame.parent = ruinGroup;

        // Fallen stones around base
        for (let i = 0; i < 8; i++) {
            const stone = BABYLON.MeshBuilder.CreateSphere("rStone" + i, {
                diameter: 0.4 + Math.random() * 0.6
            }, scene);
            const a = Math.random() * Math.PI * 2;
            const r = 4 + Math.random() * 3;
            place(stone, Math.cos(a) * r, -0.2, Math.sin(a) * r);
            stone.scaling.y = 0.5;
            stone.material = ruinMat;
            stone.parent = ruinGroup;
        }

        // ===== PATHS =====
        function createPath(points) {
            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i];
                const p2 = points[i + 1];
                const mid = p1.add(p2).scale(0.5);
                const len = BABYLON.Vector3.Distance(p1, p2);
                const angle = Math.atan2(p2.x - p1.x, p2.z - p1.z);

                const seg = BABYLON.MeshBuilder.CreateBox("pathSeg" + i, {
                    width: 1.5, height: 0.15, depth: len
                }, scene);
                seg.position.copyFrom(mid);
                seg.position.y = 3.1;
                seg.rotation.y = angle;
                seg.material = pathMat;
                seg.parent = villageGroup;
            }
        }

        createPath([
            new BABYLON.Vector3(0, 0, -9),
            new BABYLON.Vector3(5, 0, -5),
            new BABYLON.Vector3(12, 0, 5),
            new BABYLON.Vector3(18, 0, 8)
        ]);
        createPath([
            new BABYLON.Vector3(0, 0, -9),
            new BABYLON.Vector3(-5, 0, -3),
            new BABYLON.Vector3(-10, 0, 8),
            new BABYLON.Vector3(-20, 0, 15)
        ]);
        createPath([
            new BABYLON.Vector3(0, 0, 9),
            new BABYLON.Vector3(0, 0, 12),
            new BABYLON.Vector3(5, 0, 15),
            new BABYLON.Vector3(10, 0, 10)
        ]);

        // ===== GRASS PATCHES =====
        for (let i = 0; i < 40; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = 5 + Math.random() * 20;
            const x = Math.cos(a) * r;
            const z = Math.sin(a) * r;
            const patch = BABYLON.MeshBuilder.CreateSphere("gPatch" + i, {
                diameterX: 1 + Math.random() * 2, diameterY: 0.3 + Math.random() * 0.3, diameterZ: 1 + Math.random() * 2, segments: 5
            }, scene);
            place(patch, x, 3.1, z);
            patch.material = i % 3 === 0 ? darkGrassMat : grassMat;
            patch.parent = villageGroup;
        }

        // ===== WELL IN VILLAGE CENTER =====
        const well = BABYLON.MeshBuilder.CreateCylinder("well", {
            height: 1.5, diameterTop: 1.5, diameterBottom: 1.7, tessellation: 12
        }, scene);
        place(well, 2, 3.75, 8);
        well.material = stoneMat;
        well.parent = villageGroup;

        // Well interior (dark)
        const wellInner = BABYLON.MeshBuilder.CreateCylinder("wellInner", {
            height: 0.2, diameter: 1.2, tessellation: 12
        }, scene);
        place(wellInner, 2, 4.5, 8);
        wellInner.material = darkStoneMat;
        wellInner.parent = villageGroup;

        // Well roof posts
        [-0.8, 0.8].forEach(px => {
            const post = BABYLON.MeshBuilder.CreateCylinder("wPost", {
                height: 2.5, diameter: 0.15
            }, scene);
            place(post, 2 + px, 5.75, 8);
            post.material = woodMat;
            post.parent = villageGroup;
        });
        const wRoof = BABYLON.MeshBuilder.CreateBox("wRoof", {
            width: 2.5, height: 0.2, depth: 1.5
        }, scene);
        place(wRoof, 2, 7.1, 8);
        wRoof.material = woodMat;
        wRoof.parent = villageGroup;

        // ===== DECORATIVE ROCKS =====
        for (let i = 0; i < 20; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = 3 + Math.random() * 22;
            const rock = BABYLON.MeshBuilder.CreateSphere("dRock" + i, {
                diameter: 0.5 + Math.random() * 1.5, segments: 6
            }, scene);
            place(rock, Math.cos(a) * r, 3 + Math.random() * 0.5, Math.sin(a) * r);
            rock.scaling.y = 0.6 + Math.random() * 0.4;
            rock.rotation.z = (Math.random() - 0.5) * 0.3;
            rock.material = rockMat;
            rock.parent = villageGroup;
        }

        // ===== CLOUDS =====
        const cloudMat = new BABYLON.StandardMaterial("cloud", scene);
        cloudMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
        cloudMat.alpha = 0.7;

        function createCloud(x, y, z, scale) {
            const g = new BABYLON.TransformNode("cloud", scene);
            g.position.set(x, y, z);

            for (let i = 0; i < 4 + Math.floor(Math.random() * 3); i++) {
                const puff = BABYLON.MeshBuilder.CreateSphere("puff" + i, {
                    diameter: 3 + Math.random() * 4, segments: 8
                }, scene);
                puff.position.set((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 3);
                puff.scaling.y = 0.5;
                puff.material = cloudMat;
                puff.parent = g;
            }
            return g;
        }

        const clouds = [];
        clouds.push(createCloud(-40, 35, -20, 1));
        clouds.push(createCloud(35, 38, -10, 0.8));
        clouds.push(createCloud(0, 40, 30, 1.2));
        clouds.push(createCloud(-30, 32, 25, 0.7));
        clouds.push(createCloud(40, 36, 15, 0.9));

        // Animate clouds
        scene.registerBeforeRender(() => {
            clouds.forEach(c => {
                c.position.x += 0.02;
                if (c.position.x > 60) c.position.x = -60;
            });
        });

        // ===== FLOATING ISLANDS IN BACKGROUND =====
        function createMiniIsland(x, y, z, scale) {
            const g = new BABYLON.TransformNode("miniIsland", scene);
            g.position.set(x, y, z);

            const top = BABYLON.MeshBuilder.CreateCylinder("mTop", {
                height: 1.5 * scale, diameterTop: 5 * scale, diameterBottom: 4 * scale, tessellation: 8
            }, scene);
            top.material = grassMat;
            top.parent = g;

            const bot = BABYLON.MeshBuilder.CreateCylinder("mBot", {
                height: 4 * scale, diameterTop: 4 * scale, diameterBottom: 1.5 * scale, tessellation: 6
            }, scene);
            bot.position.y = -2.5 * scale;
            bot.material = cliffMat;
            bot.parent = g;

            // Tiny tree
            if (scale > 0.5) {
                const tTrunk = BABYLON.MeshBuilder.CreateCylinder("tTrunk", {
                    height: 2 * scale, diameter: 0.2 * scale, tessellation: 4
                }, scene);
                tTrunk.position.y = 2 * scale;
                tTrunk.material = woodMat;
                tTrunk.parent = g;

                const tFoliage = BABYLON.MeshBuilder.CreateCylinder("tFol", {
                    height: 2 * scale, diameterTop: 0.1 * scale, diameterBottom: 1.5 * scale, tessellation: 6
                }, scene);
                tFoliage.position.y = 3.5 * scale;
                tFoliage.material = pineMat;
                tFoliage.parent = g;
            }

            return g;
        }

        createMiniIsland(-50, 15, -40, 0.7);
        createMiniIsland(45, 20, -30, 0.5);
        createMiniIsland(-35, 25, 35, 0.8);

        // ===== SKY GRADIENT =====
        const skybox = BABYLON.MeshBuilder.CreateBox("skybox", {size: 300}, scene);
        const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
        skyMat.diffuseColor = new BABYLON.Color3(0.65, 0.8, 0.95);
        skyMat.specularColor = new BABYLON.Color3(0, 0, 0);
        skyMat.emissiveColor = new BABYLON.Color3(0.15, 0.2, 0.3);
        skybox.material = skyMat;

        // ===== ANIMATE GRASS SWAY =====
        scene.registerBeforeRender(() => {
            const t = performance.now() * 0.001;
            // Subtle water animation
            turquoiseMat.emissiveColor = new BABYLON.Color3(
                0.05 + Math.sin(t * 1.5) * 0.03,
                0.3 + Math.sin(t * 1.2) * 0.05,
                0.35 + Math.sin(t * 1.8) * 0.05
            );
        });

        // ===== RENDER LOOP =====
        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
