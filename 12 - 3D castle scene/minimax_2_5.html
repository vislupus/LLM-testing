<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease-out;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: #e8d5b7;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
            letter-spacing: 0.3em;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(232, 213, 183, 0.2);
            border-top-color: #e8d5b7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loading-title">FLOATING REALM</div>
        <div class="loading-spinner"></div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <script>
        // ============================================
        // MEDIEVAL FLOATING ISLAND DIORAMA
        // Handcrafted Tabletop-Miniature Look
        // ============================================

        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        // Color Palette - Vibrant Stylized
        const COLORS = {
            grass: new BABYLON.Color3(0.298, 0.686, 0.314),
            grassDark: new BABYLON.Color3(0.18, 0.49, 0.196),
            stone: new BABYLON.Color3(0.565, 0.647, 0.682),
            stoneDark: new BABYLON.Color3(0.329, 0.431, 0.478),
            wood: new BABYLON.Color3(0.553, 0.431, 0.388),
            woodDark: new BABYLON.Color3(0.392, 0.314, 0.259),
            water: new BABYLON.Color3(0, 0.737, 0.831),
            waterDeep: new BABYLON.Color3(0, 0.502, 0.6),
            roof: new BABYLON.Color3(0.827, 0.184, 0.184),
            roofDark: new BABYLON.Color3(0.6, 0.137, 0.137),
            roofBlue: new BABYLON.Color3(0.216, 0.278, 0.31),
            sand: new BABYLON.Color3(0.761, 0.698, 0.502),
            cliff: new BABYLON.Color3(0.4, 0.35, 0.3),
            cliffDark: new BABYLON.Color3(0.3, 0.25, 0.2),
            gold: new BABYLON.Color3(1, 0.835, 0.31),
            snow: new BABYLON.Color3(0.95, 0.95, 0.97)
        };

        // Shared Materials Cache
        const materials = {};

        function createMaterials(scene) {
            // Grass Material
            const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
            grassMat.diffuseColor = COLORS.grass;
            grassMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            materials.grass = grassMat;

            // Stone Material
            const stoneMat = new BABYLON.StandardMaterial("stoneMat", scene);
            stoneMat.diffuseColor = COLORS.stone;
            stoneMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            materials.stone = stoneMat;

            // Dark Stone Material
            const stoneDarkMat = new BABYLON.StandardMaterial("stoneDarkMat", scene);
            stoneDarkMat.diffuseColor = COLORS.stoneDark;
            stoneDarkMat.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
            materials.stoneDark = stoneDarkMat;

            // Wood Material
            const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
            woodMat.diffuseColor = COLORS.wood;
            woodMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            materials.wood = woodMat;

            // Water Material
            const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
            waterMat.diffuseColor = COLORS.water;
            waterMat.specularColor = new BABYLON.Color3(0.8, 0.8, 0.8);
            waterMat.specularPower = 64;
            waterMat.alpha = 0.75;
            waterMat.backFaceCulling = false;
            materials.water = waterMat;

            // Roof Material
            const roofMat = new BABYLON.StandardMaterial("roofMat", scene);
            roofMat.diffuseColor = COLORS.roof;
            roofMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            materials.roof = roofMat;

            // Roof Blue Material
            const roofBlueMat = new BABYLON.StandardMaterial("roofBlueMat", scene);
            roofBlueMat.diffuseColor = COLORS.roofBlue;
            roofBlueMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            materials.roofBlue = roofBlueMat;

            // Cliff Material
            const cliffMat = new BABYLON.StandardMaterial("cliffMat", scene);
            cliffMat.diffuseColor = COLORS.cliff;
            cliffMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            materials.cliff = cliffMat;

            // Sand/Bottom Material
            const sandMat = new BABYLON.StandardMaterial("sandMat", scene);
            sandMat.diffuseColor = COLORS.sand;
            sandMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            materials.sand = sandMat;

            // Tree Trunk Material
            const trunkMat = new BABYLON.StandardMaterial("trunkMat", scene);
            trunkMat.diffuseColor = COLORS.woodDark;
            trunkMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            materials.trunk = trunkMat;

            // Tree Foliage Material
            const foliageMat = new BABYLON.StandardMaterial("foliageMat", scene);
            foliageMat.diffuseColor = new BABYLON.Color3(0.15, 0.35, 0.2);
            foliageMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            materials.foliage = foliageMat;

            // Gold Material
            const goldMat = new BABYLON.StandardMaterial("goldMat", scene);
            goldMat.diffuseColor = COLORS.gold;
            goldMat.specularColor = new BABYLON.Color3(1, 0.9, 0.5);
            goldMat.specularPower = 32;
            materials.gold = goldMat;
        }

        // ============================================
        // BUILD FUNCTIONS
        // ============================================

        function createIsland(scene) {
            // Main island top
            const islandTop = BABYLON.MeshBuilder.CreateCylinder("islandTop", {
                height: 2,
                diameterTop: 28,
                diameterBottom: 24,
                tessellation: 64
            }, scene);
            islandTop.position.y = -1;
            islandTop.material = materials.grass;
            islandTop.receiveShadows = true;

            // Bottom rocky part (inverted cone with deformations)
            const islandBottom = BABYLON.MeshBuilder.CreateCylinder("islandBottom", {
                height: 8,
                diameterTop: 24,
                diameterBottom: 2,
                tessellation: 32
            }, scene);
            islandBottom.position.y = -6;
            islandBottom.material = materials.sand;
            islandBottom.receiveShadows = true;

            // Add rocky protrusions at bottom
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const rock = BABYLON.MeshBuilder.CreatePolyhedron("rock" + i, {
                    type: Math.floor(Math.random() * 3),
                    size: 0.8 + Math.random() * 1.2
                }, scene);
                rock.position.x = Math.cos(angle) * (6 + Math.random() * 3);
                rock.position.z = Math.sin(angle) * (6 + Math.random() * 3);
                rock.position.y = -4 - Math.random() * 3;
                rock.rotation = new BABYLON.Vector3(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                rock.material = materials.cliff;
                rock.receiveShadows = true;
            }

            return islandTop;
        }

        function createCastle(scene) {
            const castle = new BABYLON.TransformNode("castle", scene);

            // Main keep (central tower)
            const keep = BABYLON.MeshBuilder.CreateCylinder("keep", {
                height: 8,
                diameter: 5,
                tessellation: 8
            }, scene);
            keep.position.y = 4;
            keep.material = materials.stone;
            keep.parent = castle;
            keep.receiveShadows = true;

            // Keep roof (conical)
            const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", {
                height: 3,
                diameterTop: 0,
                diameterBottom: 6,
                tessellation: 8
            }, scene);
            keepRoof.position.y = 9.5;
            keepRoof.material = materials.roofBlue;
            keepRoof.parent = castle;

            // Keep flag pole
            const flagPole = BABYLON.MeshBuilder.CreateCylinder("flagPole", {
                height: 2,
                diameter: 0.15
            }, scene);
            flagPole.position.y = 11.5;
            flagPole.material = materials.trunk;
            flagPole.parent = castle;

            // Flag
            const flag = BABYLON.MeshBuilder.CreatePlane("flag", { width: 1.5, height: 1 }, scene);
            flag.position.y = 12;
            flag.position.x = 0.75;
            flag.rotation.y = Math.PI / 4;
            flag.material = materials.gold;
            flag.parent = castle;

            // Corner towers (4 around the keep)
            const towerPositions = [
                { x: -4, z: -4 },
                { x: 4, z: -4 },
                { x: -4, z: 4 },
                { x: 4, z: 4 }
            ];

            towerPositions.forEach((pos, i) => {
                // Tower base
                const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + i, {
                    height: 6,
                    diameter: 2,
                    tessellation: 8
                }, scene);
                tower.position = new BABYLON.Vector3(pos.x, 3, pos.z);
                tower.material = materials.stoneDark;
                tower.parent = castle;
                tower.receiveShadows = true;

                // Tower roof
                const towerRoof = BABYLON.MeshBuilder.CreateCylinder("towerRoof" + i, {
                    height: 2.5,
                    diameterTop: 0,
                    diameterBottom: 2.8,
                    tessellation: 8
                }, scene);
                towerRoof.position = new BABYLON.Vector3(pos.x, 7.25, pos.z);
                towerRoof.material = materials.roof;
                towerRoof.parent = castle;
            });

            // Walls connecting towers
            const wallPositions = [
                { x: 0, z: -4, width: 8, rot: 0 },
                { x: 0, z: 4, width: 8, rot: 0 },
                { x: -4, z: 0, width: 8, rot: Math.PI / 2 },
                { x: 4, z: 0, width: 8, rot: Math.PI / 2 }
            ];

            wallPositions.forEach((pos, i) => {
                const wall = BABYLON.MeshBuilder.CreateBox("wall" + i, {
                    width: pos.width,
                    height: 4,
                    depth: 1
                }, scene);
                wall.position = new BABYLON.Vector3(pos.x, 2, pos.z);
                wall.rotation.y = pos.rot;
                wall.material = materials.stone;
                wall.parent = castle;
                wall.receiveShadows = true;

                // Battlements on walls
                for (let j = -3; j <= 3; j += 1.5) {
                    if (Math.abs(j) < 0.5) continue;
                    const battlement = BABYLON.MeshBuilder.CreateBox("battlement" + i + "_" + j, {
                        width: 0.8,
                        height: 1,
                        depth: 1
                    }, scene);
                    if (pos.rot === 0) {
                        battlement.position = new BABYLON.Vector3(pos.x + j, 4.5, pos.z);
                    } else {
                        battlement.position = new BABYLON.Vector3(pos.x, 4.5, pos.z + j);
                    }
                    battlement.material = materials.stoneDark;
                    battlement.parent = castle;
                }
            });

            // Gatehouse
            const gatehouse = BABYLON.MeshBuilder.CreateBox("gatehouse", {
                width: 3,
                height: 5,
                depth: 2
            }, scene);
            gatehouse.position = new BABYLON.Vector3(0, 2.5, 6);
            gatehouse.material = materials.stoneDark;
            gatehouse.parent = castle;
            gatehouse.receiveShadows = true;

            // Gate door (arcade)
            const gateDoor = BABYLON.MeshBuilder.CreateBox("gateDoor", {
                width: 1.8,
                height: 3,
                depth: 0.3
            }, scene);
            gateDoor.position = new BABYLON.Vector3(0, 1.5, 7);
            gateDoor.material = materials.trunk;
            gateDoor.parent = castle;

            // Gate arch
            const gateArch = BABYLON.MeshBuilder.CreateTorus("gateArch", {
                diameter: 2.2,
                thickness: 0.4,
                tessellation: 16
            }, scene);
            gateArch.position = new BABYLON.Vector3(0, 3, 7);
            gateArch.rotation.x = Math.PI / 2;
            gateArch.scaling.y = 0.6;
            gateArch.material = materials.stoneDark;
            gateArch.parent = castle;

            return castle;
        }

        function createHouse(scene, x, z, rotation = 0, scale = 1) {
            const house = new BABYLON.TransformNode("house_" + x + "_" + z, scene);

            // Main body
            const body = BABYLON.MeshBuilder.CreateBox("houseBody", {
                width: 2 * scale,
                height: 1.8 * scale,
                depth: 2.5 * scale
            }, scene);
            body.position.y = 0.9 * scale;
            body.material = materials.wood;
            body.parent = house;
            body.receiveShadows = true;

            // Roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("houseRoof", {
                height: 3 * scale,
                diameterTop: 0,
                diameterBottom: 3.2 * scale,
                tessellation: 4
            }, scene);
            roof.position.y = 2.5 * scale;
            roof.rotation.y = Math.PI / 4;
            roof.material = materials.roof;
            roof.parent = house;

            // Door
            const door = BABYLON.MeshBuilder.CreateBox("door", {
                width: 0.5 * scale,
                height: 1 * scale,
                depth: 0.1 * scale
            }, scene);
            door.position = new BABYLON.Vector3(0, 0.5 * scale, 1.3 * scale);
            door.material = materials.trunk;
            door.parent = house;

            // Windows
            const windowMat = new BABYLON.StandardMaterial("windowMat", scene);
            windowMat.diffuseColor = new BABYLON.Color3(1, 0.9, 0.6);
            windowMat.emissiveColor = new BABYLON.Color3(0.3, 0.25, 0.1);

            for (let i = -1; i <= 1; i += 2) {
                const window1 = BABYLON.MeshBuilder.CreateBox("window", {
                    width: 0.4 * scale,
                    height: 0.4 * scale,
                    depth: 0.1 * scale
                }, scene);
                window1.position = new BABYLON.Vector3(i * 0.6 * scale, 1.2 * scale, 1.3 * scale);
                window1.material = windowMat;
                window1.parent = house;
            }

            house.position = new BABYLON.Vector3(x, 0, z);
            house.rotation.y = rotation;

            return house;
        }

        function createTavern(scene, x, z) {
            const tavern = new BABYLON.TransformNode("tavern", scene);

            // Main building (larger)
            const body = BABYLON.MeshBuilder.CreateBox("tavernBody", {
                width: 3.5,
                height: 2.5,
                depth: 4
            }, scene);
            body.position.y = 1.25;
            body.material = materials.wood;
            body.parent = tavern;
            body.receiveShadows = true;

            // Second floor overhang
            const overhang = BABYLON.MeshBuilder.CreateBox("overhang", {
                width: 4,
                height: 2,
                depth: 3
            }, scene);
            overhang.position = new BABYLON.Vector3(0, 3.5, 0.3);
            overhang.material = materials.wood;
            overhang.parent = tavern;
            overhang.receiveShadows = true;

            // Roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", {
                height: 5,
                diameterTop: 0,
                diameterBottom: 5.5,
                tessellation: 4
            }, scene);
            roof.position.y = 5;
            roof.rotation.y = Math.PI / 4;
            roof.material = materials.roof;
            roof.parent = tavern;

            // Sign board
            const signPost = BABYLON.MeshBuilder.CreateCylinder("signPost", {
                height: 1.5,
                diameter: 0.15
            }, scene);
            signPost.position = new BABYLON.Vector3(-2.2, 3, 1);
            signPost.material = materials.trunk;
            signPost.parent = tavern;

            const sign = BABYLON.MeshBuilder.CreateBox("sign", {
                width: 1,
                height: 0.6,
                depth: 0.1
            }, scene);
            sign.position = new BABYLON.Vector3(-2.2, 3.5, 1);
            sign.material = materials.roof;
            sign.parent = tavern;

            // Tavern door (larger)
            const door = BABYLON.MeshBuilder.CreateBox("tavernDoor", {
                width: 0.9,
                height: 1.5,
                depth: 0.15
            }, scene);
            door.position = new BABYLON.Vector3(0, 0.75, 2.1);
            door.material = materials.trunk;
            door.parent = tavern;

            // Windows with warm glow
            const windowMat = new BABYLON.StandardMaterial("tavernWindowMat", scene);
            windowMat.diffuseColor = new BABYLON.Color3(1, 0.8, 0.4);
            windowMat.emissiveColor = new BABYLON.Color3(0.4, 0.3, 0.1);

            for (let i = -1; i <= 1; i++) {
                const win = BABYLON.MeshBuilder.CreateBox("tavernWindow", {
                    width: 0.6,
                    height: 0.6,
                    depth: 0.1
                }, scene);
                win.position = new BABYLON.Vector3(i * 1.2, 1.5, 2.1);
                win.material = windowMat;
                win.parent = tavern;
            }

            // Balcony
            const balcony = BABYLON.MeshBuilder.CreateBox("balcony", {
                width: 3.5,
                height: 0.15,
                depth: 1
            }, scene);
            balcony.position = new BABYLON.Vector3(0, 2.6, 2);
            balcony.material = materials.trunk;
            balcony.parent = tavern;

            // Balcony rail
            const rail = BABYLON.MeshBuilder.CreateBox("rail", {
                width: 3.5,
                height: 0.5,
                depth: 0.1
            }, scene);
            rail.position = new BABYLON.Vector3(0, 2.9, 2.4);
            rail.material = materials.trunk;
            rail.parent = tavern;

            tavern.position = new BABYLON.Vector3(x, 0, z);

            return tavern;
        }

        function createMarketStall(scene, x, z, rotation = 0) {
            const stall = new BABYLON.TransformNode("stall", scene);

            // Counter
            const counter = BABYLON.MeshBuilder.CreateBox("counter", {
                width: 2,
                height: 1,
                depth: 1
            }, scene);
            counter.position.y = 0.5;
            counter.material = materials.trunk;
            counter.parent = stall;
            counter.receiveShadows = true;

            // Roof poles
            for (let i = -1; i <= 1; i += 2) {
                const pole = BABYLON.MeshBuilder.CreateCylinder("pole", {
                    height: 2.5,
                    diameter: 0.15
                }, scene);
                pole.position = new BABYLON.Vector3(i * 0.9, 1.25, -0.4);
                pole.material = materials.trunk;
                pole.parent = stall;
            }

            // Stall roof (angled)
            const stallRoof = BABYLON.MeshBuilder.CreateBox("stallRoof", {
                width: 2.5,
                height: 0.15,
                depth: 1.5
            }, scene);
            stallRoof.position = new BABYLON.Vector3(0, 2.5, -0.2);
            stallRoof.rotation.x = -0.2;
            stallRoof.material = materials.roof;
            stallRoof.parent = stall;

            // Merchandise boxes
            const boxMat = new BABYLON.StandardMaterial("boxMat", scene);
            boxMat.diffuseColor = new BABYLON.Color3(0.6, 0.4, 0.2);

            for (let i = 0; i < 3; i++) {
                const box = BABYLON.MeshBuilder.CreateBox("merchBox", {
                    width: 0.4,
                    height: 0.3,
                    depth: 0.4
                }, scene);
                box.position = new BABYLON.Vector3(-0.5 + i * 0.5, 1.15, 0);
                box.material = boxMat;
                box.parent = stall;
            }

            stall.position = new BABYLON.Vector3(x, 0, z);
            stall.rotation.y = rotation;

            return stall;
        }

        function createWindmill(scene, x, z) {
            const mill = new BABYLON.TransformNode("windmill", scene);

            // Mill body (tapered cylinder)
            const body = BABYLON.MeshBuilder.CreateCylinder("millBody", {
                height: 5,
                diameterTop: 2,
                diameterBottom: 3,
                tessellation: 8
            }, scene);
            body.position.y = 2.5;
            body.material = materials.stone;
            body.parent = mill;
            body.receiveShadows = true;

            // Mill roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {
                height: 2,
                diameterTop: 0,
                diameterBottom: 2.5,
                tessellation: 8
            }, scene);
            roof.position.y = 6;
            roof.material = materials.roof;
            roof.parent = mill;

            // Blade hub
            const hub = BABYLON.MeshBuilder.CreateCylinder("hub", {
                height: 0.5,
                diameter: 0.8
            }, scene);
            hub.position = new BABYLON.Vector3(0, 4.5, 1.8);
            hub.rotation.x = Math.PI / 2;
            hub.material = materials.trunk;
            hub.parent = mill;

            // Blades (4 blades)
            const blades = new BABYLON.TransformNode("blades", scene);
            blades.position = new BABYLON.Vector3(0, 4.5, 2);
            blades.parent = mill;

            for (let i = 0; i < 4; i++) {
                const blade = BABYLON.MeshBuilder.CreateBox("blade", {
                    width: 0.4,
                    height: 3,
                    depth: 0.1
                }, scene);
                blade.position.y = 1.5;
                blade.rotation.z = (i * Math.PI) / 2;
                blade.material = materials.wood;
                blade.parent = blades;
            }

            // Door
            const door = BABYLON.MeshBuilder.CreateBox("millDoor", {
                width: 0.8,
                height: 1.2,
                depth: 0.1
            }, scene);
            door.position = new BABYLON.Vector3(0, 0.6, 1.6);
            door.material = materials.trunk;
            door.parent = mill;

            mill.position = new BABYLON.Vector3(x, 0, z);

            // Animate blades
            scene.registerBeforeRender(() => {
                blades.rotation.z += 0.01;
            });

            return mill;
        }

        function createPineTree(scene, x, z, scale = 1) {
            const tree = new BABYLON.TransformNode("tree", scene);

            // Trunk
            const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
                height: 2 * scale,
                diameter: 0.4 * scale
            }, scene);
            trunk.position.y = 1 * scale;
            trunk.material = materials.trunk;
            trunk.parent = tree;
            trunk.receiveShadows = true;

            // Foliage layers (3 stacked cones)
            for (let i = 0; i < 3; i++) {
                const foliage = BABYLON.MeshBuilder.CreateCylinder("foliage" + i, {
                    height: (2.5 - i * 0.5) * scale,
                    diameterTop: 0,
                    diameterBottom: (2.5 - i * 0.3) * scale,
                    tessellation: 8
                }, scene);
                foliage.position.y = (2 + i * 1.2) * scale;
                foliage.material = materials.foliage;
                foliage.parent = tree;
                foliage.receiveShadows = true;
            }

            tree.position = new BABYLON.Vector3(x, 0, z);

            return tree;
        }

        function createRock(scene, x, z, scale = 1) {
            const rock = BABYLON.MeshBuilder.CreatePolyhedron("rock", {
                type: Math.floor(Math.random() * 4),
                size: scale
            }, scene);
            rock.position = new BABYLON.Vector3(x, scale * 0.3, z);
            rock.rotation = new BABYLON.Vector3(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            rock.material = materials.cliff;
            rock.receiveShadows = true;

            return rock;
        }

        function createBridge(scene, x1, z1, x2, z2) {
            const bridge = new BABYLON.TransformNode("bridge", scene);

            const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(z2 - z1, 2));
            const angle = Math.atan2(z2 - z1, x2 - x1);

            // Bridge deck
            const deck = BABYLON.MeshBuilder.CreateBox("bridgeDeck", {
                width: length,
                height: 0.3,
                depth: 2
            }, scene);
            deck.position.y = 0.5;
            deck.material = materials.trunk;
            deck.parent = bridge;
            deck.receiveShadows = true;

            // Railings
            for (let i = -1; i <= 1; i += 2) {
                const rail = BABYLON.MeshBuilder.CreateBox("bridgeRail", {
                    width: length,
                    height: 0.8,
                    depth: 0.15
                }, scene);
                rail.position = new BABYLON.Vector3(0, 1, i * 0.9);
                rail.material = materials.trunk;
                rail.parent = bridge;

                // Rail posts
                for (let j = 0; j < length; j += 1.5) {
                    const post = BABYLON.MeshBuilder.CreateBox("post", {
                        width: 0.15,
                        height: 0.8,
                        depth: 0.15
                    }, scene);
                    post.position = new BABYLON.Vector3(-length/2 + j + 0.75, 1, i * 0.9);
                    post.material = materials.trunk;
                    post.parent = bridge;
                }
            }

            bridge.position = new BABYLON.Vector3((x1 + x2) / 2, 0, (z1 + z2) / 2);
            bridge.rotation.y = -angle;

            return bridge;
        }

        function createWaterfall(scene, x, y, z) {
            const waterfall = new BABYLON.TransformNode("waterfall", scene);

            // Water plane
            const waterPlane = BABYLON.MeshBuilder.CreatePlane("waterPlane", {
                width: 2,
                height: 4
            }, scene);
            waterPlane.position = new BABYLON.Vector3(x, y - 2, z);
            waterPlane.material = materials.water;
            waterPlane.parent = waterfall;

            // Animated water texture
            const waterAnimMat = new BABYLON.StandardMaterial("waterAnimMat", scene);
            waterAnimMat.diffuseColor = new BABYLON.Color3(0.8, 0.95, 1);
            waterAnimMat.alpha = 0.6;
            waterAnimMat.emissiveColor = new BABYLON.Color3(0.1, 0.3, 0.4);

            // Splash particles
            const particleSystem = new BABYLON.ParticleSystem("particles", 100, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
            particleSystem.emitter = new BABYLON.Vector3(x, y - 4, z);
            particleSystem.minEmitBox = new BABYLON.Vector3(-0.5, 0, -0.5);
            particleSystem.maxEmitBox = new BABYLON.Vector3(0.5, 0, 0.5);
            particleSystem.color1 = new BABYLON.Color4(1, 1, 1, 0.8);
            particleSystem.color2 = new BABYLON.Color4(0.8, 0.9, 1, 0.6);
            particleSystem.colorDead = new BABYLON.Color4(0.5, 0.7, 1, 0);
            particleSystem.minSize = 0.1;
            particleSystem.maxSize = 0.3;
            particleSystem.minLifeTime = 0.3;
            particleSystem.maxLifeTime = 0.8;
            particleSystem.emitRate = 50;
            particleSystem.gravity = new BABYLON.Vector3(0, -5, 0);
            particleSystem.direction1 = new BABYLON.Vector3(-1, 1, -1);
            particleSystem.direction2 = new BABYLON.Vector3(1, 2, 1);
            particleSystem.minEmitPower = 1;
            particleSystem.maxEmitPower = 2;
            particleSystem.start();

            return waterfall;

        function createRiver(scene) {
            // Main river path (curved)
            const riverPath = [
                new BABYLON.Vector3(-10, 0.1, -8),
                new BABYLON.Vector3(-8, 0.1, -4),
                new BABYLON.Vector3(-6, 0.1, 0),
                new BABYLON.Vector3(-4, 0.1, 4),
                new BABYLON.Vector3(-2, 0.1, 7),
                new BABYLON.Vector3(2, 0.1, 9),
                new BABYLON.Vector3(6, 0.1, 10),
                new BABYLON.Vector3(10, 0.1, 10)
            ];

            // Create river segments
            for (let i = 0; i < riverPath.length - 1; i++) {
                const start = riverPath[i];
                const end = riverPath[i + 1];
                const length = BABYLON.Vector3.Distance(start, end);
                const angle = Math.atan2(end.z - start.z, end.x - start.x);

                const riverSegment = BABYLON.MeshBuilder.CreateBox("riverSegment" + i, {
                    width: length + 0.5,
                    height: 0.2,
                    depth: 2.5
                }, scene);
                riverSegment.position = new BABYLON.Vector3(
                    (start.x + end.x) / 2,
                    0.05,
                    (start.z + end.z) / 2

                riverSegment.rotation.y = -angle;
                riverSegment.material = materials.water;
            }

            return riverPath;

        function createWatchtower(scene, x, z) {
            const tower = new BABYLON.TransformNode("watchtower", scene);

            // Base (partially ruined)
            const baseHeight = 2 + Math.random() * 1.5;
            const base = BABYLON.MeshBuilder.CreateCylinder("watchBase", {
                height: baseHeight,
                diameter: 2.5,
                tessellation: 6
            }, scene);
            base.position.y = baseHeight / 2;
            base.material = materials.stoneDark;
            base.parent = tower;
            base.receiveShadows = true;

            // Ruined upper section (tilted)
            const ruinedSection = BABYLON.MeshBuilder.CreateCylinder("ruinedSection", {
                height: 2,
                diameter: 2.2,
                tessellation: 6
            }, scene);
            ruinedSection.position.y = baseHeight + 0.8;
            ruinedSection.position.x = 0.3;
            ruinedSection.position.z = 0.2;

            // Cracks and damage (extra rubble)
            for (let i = 0; i < 3; i++) {

                rubble.position = new BABYLON.Vector3(

                rubble.material = materials.cliff;

            tower.position = new BABYLON.Vector3(x, 0, z);

        function createCliffs(scene) {
            const cliffs = [];

            // Create cliff formations around the edge
            const cliffPositions = [
                { x: -10, z: -10, scale: 2.5 },
                { x: -11, z: -6, scale: 2 },
                { x: -12, z: 0, scale: 3 },

            cliffPositions.forEach((pos, i) => {
                // Main cliff face
                const cliff = BABYLON.MeshBuilder.CreateBox("cliff" + i, {
                    width: 3 * pos.scale,

                cliff.position = new BABYLON.Vector3(pos.x, -1, pos.z);
                cliff.material = materials.cliff;
                cliff.receiveShadows = true;
                cliffs.push(cliff);

                // Smaller rocks at base
                for (let j = 0; j < 3; j++) {
                    const rock = BABYLON.MeshBuilder.CreatePolyhedron("cliffRock" + i + "_" + j, {

                    }, scene);
                    rock.position = new BABYLON.Vector3(

                        pos.z + (Math.random() - 0.5) * 2
                    );
                    rock.rotation = new BABYLON.Vector3(
                        Math.random() * Math.PI,
                        Math.random() * Math.PI,
                        Math.random() * Math.PI

                    rock.material = materials.cliff;
                    cliffs.push(rock);

            // Create island base

                { x: 8, z: 7, rot: -0.6, scale: 0.9 }

            housePositions.forEach(pos => {

            const stall2 = createMarketStall(scene, 3, -6.5, -0.2);
            stall2.getChildMeshes().forEach(mesh => addShadowCaster(mesh));

            // Create windmill
            const windmill = createWindmill(scene, 8, -2);
            windmill.getChildMeshes().forEach(mesh => addShadowCaster(mesh));

            // Create river

            // Create bridges

            // Create waterfall

            watchtower.getChildMeshes().forEach(mesh => addShadowCaster(mesh));

            // Create cliffs

                { x: -9, z: -9, scale: 1.5 },
                { x: -10, z: -5, scale: 1.2 },
                { x: -11, z: 2, scale: 1.8 },
                { x: -9, z: 7, scale: 1.4 },
                { x: -10, z: 11, scale: 1.6 },
                { x: 10, z: -10, scale: 1.3 },
                { x: 11, z: -2, scale: 1.7 },
                { x: 10, z: 6, scale: 1.5 },
                { x: 9, z: 11, scale: 1.4 },
                { x: -4, z: 9, scale: 1.2 },
                { x: 4, z: 10, scale: 1.3 },
                { x: -8, z: -11, scale: 1.6 },
                { x: 0, z: -10, scale: 1.4 },
                { x: 5, z: -11, scale: 1.5 }
            ];

            treePositions.forEach(pos => {
                const tree = createPineTree(scene, pos.x, pos.z, pos.scale);
                tree.getChildMeshes().forEach(mesh => addShadowCaster(mesh));
            });

            // Create rocks
            const rockPositions = [
                { x: -2, z: -9, scale: 0.8 },
                { x: 1, z: -8, scale: 0.6 },
                { x: -5, z: 8, scale: 0.9 },
                { x: 2, z: 8, scale: 0.7 },
                { x: -9, z: 0, scale: 1 },
                { x: 9, z: 1, scale: 0.8 },
                { x: -3, z: -2, scale: 0.5 },
                { x: 4, z: -3, scale: 0.6 }
            ];

            rockPositions.forEach(pos => {
                const rock = createRock(scene, pos.x, pos.z, pos.scale);
                addShadowCaster(rock);
            });

            // Fog for atmosphere
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.008;
            scene.fogColor = new BABYLON.Color3(0.15, 0.18, 0.25);

            // Post-processing pipeline
            const pipeline = new BABYLON.DefaultRenderingPipeline(
                "defaultPipeline",
                true,
                scene,
                [camera]
            );

            // Bloom effect
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.7;
            pipeline.bloomWeight = 0.3;
            pipeline.bloomKernel = 64;
            pipeline.bloomScale = 0.5;

            pipeline.chromaticAberrationEnabled = true;

            pipeline.depthOfFieldEnabled = true;

            pipeline.depthOfField.focalLength = 150;
            pipeline.depthOfField.fStop = 2.8;

            // FXAA
            pipeline.fxaaEnabled = true;

            // Image processing
            pipeline.imageProcessingEnabled = true;
            pipeline.imageProcessing.contrast = 1.1;
            pipeline.imageProcessing.exposure = 1.1;
            pipeline.imageProcessing.toneMappingEnabled = true;
            pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
            pipeline.imageProcessing.vignetteEnabled = true;
            pipeline.imageProcessing.vignetteWeight = 2;
            pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 1);

            // Glow layer for magical feel
            const glowLayer = new BABYLON.GlowLayer("glow", scene);
            glowLayer.intensity = 0.4;

            return scene;
        }

        // Initialize
        const scene = createScene();

        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
        }, 1500);

        // Render loop
        engine.runRenderLoop(() => {
            scene.render();
        });

        // Resize handler
        window.addEventListener('resize', () => {
            engine.resize();
        });

  function getElementAttributes(element) {
    var attrs = {};
    for (var i = 0; i < element.attributes.length; i++) {
      var attr = element.attributes[i];
      attrs[attr.name] = attr.value;
    }
    return attrs;
  }

  // 鼠标悬停事件处理
  function handleMouseOver(e) {
    if (!highlightEnabled) return;
    var target = e.target;
    if (!target || target === overlay || target === highlightBox || target === tagLabel || target === selectedBox || target === selectedLabel) {
      return;
    }

    // 避免高亮 html 和 body 元素
    if (target === document.documentElement || target === document.body) {
      return;
    }

    // 如果是已选中的元素，不显示悬停高亮
    if (target === selectedElement) {
      highlightBox.style.display = "none";
      tagLabel.style.display = "none";
      return;
    }
    var rect = target.getBoundingClientRect();
    var selector = getElementSelector(target);
    var text = getElementText(target);
    var attributes = getElementAttributes(target);

    // 更新悬停高亮框位置
    highlightBox.style.display = "block";
    highlightBox.style.left = "".concat(rect.left - 2, "px");
    highlightBox.style.top = "".concat(rect.top - 2, "px");
    highlightBox.style.width = "".concat(rect.width + 4, "px");
    highlightBox.style.height = "".concat(rect.height + 4, "px");

    // 更新标签位置和内容
    tagLabel.style.display = "block";
    tagLabel.textContent = "<".concat(target.tagName.toLowerCase(), ">");

    // 计算标签位置，确保不超出视窗
    var labelTop = rect.top - 22;
    var labelLeft = rect.left;

    // 如果标签会超出顶部，显示在元素下方
    if (labelTop < 0) {
      labelTop = rect.bottom + 5;
    }

    // 如果标签会超出右侧，向左调整
    if (labelLeft + tagLabel.offsetWidth > window.innerWidth) {
      labelLeft = window.innerWidth - tagLabel.offsetWidth - 5;
    }
    tagLabel.style.left = "".concat(Math.max(0, labelLeft), "px");
    tagLabel.style.top = "".concat(labelTop, "px");

    // 发送消息到父窗口
    var elementInfo = {
      tagName: target.tagName.toLowerCase(),
      rect: {
        left: rect.left,
        top: rect.top,
        right: rect.right,
        bottom: rect.bottom,
        width: rect.width,
        height: rect.height,
        x: rect.x,
        y: rect.y
      },
      selector: selector,
      text: text,
      attributes: attributes,
      url: window.location.href,
      path: window.location.pathname,
      timestamp: Date.now()
    };
    try {
      window.parent.postMessage({
        type: "iframe-element-hover",
        data: elementInfo,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 鼠标离开事件处理
  function handleMouseOut(e) {
    if (!highlightEnabled) return;
    var relatedTarget = e.relatedTarget;

    // 如果鼠标移动到高亮相关元素上，不隐藏高亮
    if (relatedTarget && (relatedTarget === highlightBox || relatedTarget === tagLabel || relatedTarget === overlay || relatedTarget === selectedBox || relatedTarget === selectedLabel)) {
      return;
    }
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    try {
      window.parent.postMessage({
        type: "iframe-element-hover",
        data: null,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 点击事件处理
  function handleClick(e) {
    var target = e.target;
    if (!target || target === overlay || target === highlightBox || target === tagLabel || target === selectedBox || target === selectedLabel) {
      return;
    }

    // 避免处理 html 和 body 元素
    if (target === document.documentElement || target === document.body) {
      return;
    }

    // 检查是否是交互元素，这些元素需要保留默认行为
    var isInteractiveElement = ['input', 'textarea', 'select', 'button', 'a'].includes(target.tagName.toLowerCase());

    // 如果高亮功能启用，对于非交互元素阻止默认行为和事件传播
    if (highlightEnabled) {
      e.preventDefault();
      e.stopPropagation();
    }
    var rect = target.getBoundingClientRect();
    var selector = getElementSelector(target);
    var text = getElementText(target);
    var attributes = getElementAttributes(target);
    console.log("Element clicked:", {
      tagName: target.tagName,
      selector: selector,
      rect: rect
    });

    // 立即更新选中高亮
    updateSelectedHighlight(target);

    // 隐藏悬停高亮，因为现在是选中状态
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    var elementInfo = {
      tagName: target.tagName.toLowerCase(),
      rect: {
        left: rect.left,
        top: rect.top,
        right: rect.right,
        bottom: rect.bottom,
        width: rect.width,
        height: rect.height,
        x: rect.x,
        y: rect.y
      },
      selector: selector,
      text: text,
      attributes: attributes,
      url: window.location.href,
      path: window.location.pathname,
      timestamp: Date.now()
    };
    try {
      window.parent.postMessage({
        type: "iframe-element-click",
        data: elementInfo,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 监听来自父窗口的消息
  function handleParentMessage(event) {
    console.log("Received message from parent:", event.data);
    if (event.data.type === "iframe-highlight-toggle") {
      var enabled = event.data.enabled;
      console.log("Highlight toggle:", enabled);
      if (enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "enable-iframe-highlight") {
      console.log("Enable iframe highlight");
      enableHighlight();
    } else if (event.data.type === "disable-iframe-highlight") {
      console.log("Disable iframe highlight");
      disableHighlight();
    } else if (event.data.type === "toggle-iframe-highlight") {
      var _enabled = event.data.enabled !== undefined ? event.data.enabled : !highlightEnabled;
      console.log("Toggle iframe highlight to:", _enabled);
      if (_enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "update-selected-element") {
      var selector = event.data.selector;
      console.log("Update selected element with selector:", selector);
      if (selector) {
        try {
          var element = document.querySelector(selector);
          console.log("Found element by selector:", element);
          updateSelectedHighlight(element);
        } catch (error) {
          console.warn("Failed to select element:", error);
          updateSelectedHighlight(null);
        }
      } else {
        updateSelectedHighlight(null);
      }
    } else if (event.data.type === "clear-selected-element") {
      console.log("Clear selected element");
      updateSelectedHighlight(null);
    }
  }

  // 启用高亮功能
  function enableHighlight() {
    console.log("Enabling highlight");
    document.addEventListener("mouseover", handleMouseOver, true);
    document.addEventListener("mouseout", handleMouseOut, true);
    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
