<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aethelgard — Floating Island Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2a2016;
    --parch:#efe3c8;
    --parch-2:#e3d3ad;
    --gold:#b98b3e;
    --moss:#5f7a3c;
    --stone:#6a6256;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0c1220; }
  #stage{ position:fixed; inset:0; }
  #renderCanvas{ width:100%; height:100%; display:block; outline:none; touch-action:none; }

  /* ---- Title / control panel ---- */
  .panel{
    position:fixed; top:18px; left:18px; z-index:10;
    max-width:min(320px, 78vw);
    padding:16px 18px 15px;
    color:var(--ink);
    background:
      linear-gradient(180deg, rgba(247,238,218,.94), rgba(231,214,177,.92));
    border:1px solid rgba(120,92,44,.45);
    border-radius:14px;
    box-shadow:0 10px 30px rgba(20,12,4,.35), inset 0 1px 0 rgba(255,255,255,.5);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  .panel h1{
    font-family:"Cinzel", Georgia, serif;
    font-weight:700; font-size:23px; letter-spacing:.06em;
    margin:0; line-height:1.05;
    color:#3a2a15;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
  }
  .panel .rule{ height:1px; margin:9px 0 10px;
    background:linear-gradient(90deg, transparent, rgba(120,92,44,.55), transparent); }
  .panel p{
    font-family:"Spectral", Georgia, serif; font-style:italic;
    margin:0 0 12px; font-size:13.5px; line-height:1.4; color:#5b4a30;
  }
  .controls{ display:flex; flex-direction:column; gap:8px; }
  .ctl{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-family:"Spectral", Georgia, serif; font-size:13.5px; color:#43341f;
  }
  .ctl span{ user-select:none; }
  .switch{
    --w:42px; --h:22px;
    appearance:none; -webkit-appearance:none; cursor:pointer;
    width:var(--w); height:var(--h); border-radius:999px; position:relative;
    background:#c3b083; border:1px solid rgba(90,66,28,.5); flex:0 0 auto;
    transition:background .22s ease;
  }
  .switch:checked{ background:var(--moss); }
  .switch::after{
    content:""; position:absolute; top:2px; left:2px;
    width:calc(var(--h) - 6px); height:calc(var(--h) - 6px); border-radius:50%;
    background:#fdf7e8; box-shadow:0 1px 2px rgba(0,0,0,.35);
    transition:transform .22s ease;
  }
  .switch:checked::after{ transform:translateX(calc(var(--w) - var(--h))); }
  .switch:focus-visible{ outline:2px solid #6b4a12; outline-offset:2px; }

  .hint{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10;
    font-family:"Spectral", Georgia, serif; font-size:12.5px; letter-spacing:.02em;
    color:#f4ead2; padding:7px 15px; border-radius:999px;
    background:rgba(24,16,8,.42); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:.9; transition:opacity .6s ease; pointer-events:none; text-align:center;
  }
  .hint.fade{ opacity:0; }

  /* ---- Loading ---- */
  #loading{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px;
    background:radial-gradient(120% 120% at 50% 30%, #24314e 0%, #131a2c 60%, #0b111d 100%);
    color:#e9ddc2; transition:opacity .8s ease;
  }
  #loading.done{ opacity:0; pointer-events:none; }
  .spin{
    width:44px; height:44px; border-radius:50%;
    border:3px solid rgba(233,221,194,.22); border-top-color:#e6c169;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading .lt{ font-family:"Cinzel", Georgia, serif; letter-spacing:.14em; font-size:15px; opacity:.9; }
  #loading .ls{ font-family:"Spectral", Georgia, serif; font-style:italic; font-size:13px; opacity:.6; margin-top:-10px; }
  #err{ max-width:520px; font-family:"Spectral",Georgia,serif; font-size:13px; color:#ffb9a0; text-align:center; padding:0 24px; }

  @media (max-width:520px){
    .panel{ top:12px; left:12px; padding:13px 14px; }
    .panel h1{ font-size:19px; }
    .panel p{ font-size:12.5px; }
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="renderCanvas"></canvas></div>

  <div class="panel" id="panel" style="display:none">
    <h1>Aethelgard</h1>
    <div class="rule"></div>
    <p>A skybound holt — castle, hamlet &amp; falls, adrift above the clouds.</p>
    <div class="controls">
      <label class="ctl"><span>Slow orbit</span><input class="switch" type="checkbox" id="tglOrbit"></label>
      <label class="ctl"><span>Miniature focus</span><input class="switch" type="checkbox" id="tglDof"></label>
      <label class="ctl"><span>Dusk light</span><input class="switch" type="checkbox" id="tglMood"></label>
    </div>
  </div>

  <div class="hint" id="hint">drag to orbit · scroll to zoom · pinch on touch</div>

  <div id="loading">
    <div class="spin"></div>
    <div class="lt">RAISING THE ISLE</div>
    <div class="ls">stacking stone, planting pines, pouring the falls…</div>
    <div id="err"></div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
  "use strict";
  window.addEventListener("DOMContentLoaded", () => {
    const loadingEl = document.getElementById("loading");
    const errEl = document.getElementById("err");
    try {
      if (typeof BABYLON === "undefined") throw new Error("Babylon.js failed to load from CDN. Check your connection and reload.");
      boot(loadingEl);
    } catch (e) {
      console.error(e);
      errEl.textContent = "Could not start the scene: " + (e && e.message ? e.message : e);
    }
  });

  function boot(loadingEl) {
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, antialias: true });
    engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 2));

    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---------- tiny helpers ----------
    const V3 = (x,y,z) => new BABYLON.Vector3(x,y,z);
    const C3 = (hex) => BABYLON.Color3.FromHexString(hex);
    const DS = BABYLON.Mesh.DOUBLESIDE;
    const POS = BABYLON.VertexBuffer.PositionKind;
    const NRM = BABYLON.VertexBuffer.NormalKind;

    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
    const rng = mulberry32(0x51ac0d);
    const rr = (a,b)=> a + (b-a)*rng();
    const ri = (a,b)=> Math.floor(rr(a,b+1));
    const pick = (arr)=> arr[Math.floor(rng()*arr.length)];

    function shade(hex, amt){
      let c = hex.replace("#","");
      if (c.length===3) c = c.split("").map(x=>x+x).join("");
      let r = Math.min(255,Math.max(0, parseInt(c.slice(0,2),16)+amt));
      let g = Math.min(255,Math.max(0, parseInt(c.slice(2,4),16)+amt));
      let b = Math.min(255,Math.max(0, parseInt(c.slice(4,6),16)+amt));
      return `rgb(${r|0},${g|0},${b|0})`;
    }
    function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

    // ---------- scene / camera / lights ----------
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.66, 0.80, 0.96, 1);
    scene.ambientColor = new BABYLON.Color3(0.35,0.35,0.4);

    const camera = new BABYLON.ArcRotateCamera("cam", 2.15, 1.06, 66, V3(0, 3.2, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 34;
    camera.upperRadiusLimit = 118;
    camera.lowerBetaLimit = 0.32;
    camera.upperBetaLimit = 1.47;
    camera.wheelDeltaPercentage = 0.02;
    camera.pinchDeltaPercentage = 0.02;
    camera.useNaturalPinchZoom = true;
    camera.panningSensibility = 0; // keep the diorama centred
    camera.inertia = 0.82;

    const hemi = new BABYLON.HemisphericLight("hemi", V3(0.2, 1, 0.1), scene);
    const sun = new BABYLON.DirectionalLight("sun", V3(-0.55, -1.0, -0.45), scene);
    sun.position = V3(48, 74, 40);
    sun.autoCalcShadowZBounds = true;
    const fill = new BABYLON.DirectionalLight("fill", V3(0.6, -0.35, 0.55), scene);

    const shadow = new BABYLON.ShadowGenerator(1536, sun);
    shadow.usePercentageCloserFiltering = true;
    shadow.filteringQuality = BABYLON.ShadowGenerator.QUALITY_MEDIUM;
    shadow.bias = 0.012;
    shadow.normalBias = 0.02;
    shadow.transparencyShadow = false;
    const cast = (m) => { if (m) shadow.addShadowCaster(m, true); };

    // ---------- sky (screen-space gradient layer, two moods) ----------
    function skyTexture(stops){
      const t = new BABYLON.DynamicTexture("sky", { width: 32, height: 512 }, scene, true);
      const ctx = t.getContext();
      const g = ctx.createLinearGradient(0,0,0,512);
      stops.forEach(s => g.addColorStop(s[0], s[1]));
      ctx.fillStyle = g; ctx.fillRect(0,0,32,512);
      // soft sun bloom low on the horizon
      const sg = ctx.createRadialGradient(16, 372, 0, 16, 372, 300);
      sg.addColorStop(0, stops.glow || "rgba(255,244,214,.5)");
      sg.addColorStop(1, "rgba(255,244,214,0)");
      ctx.fillStyle = sg; ctx.fillRect(0,0,32,512);
      t.update();
      t.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
      t.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
      return t;
    }
    const skyDay  = skyTexture(Object.assign([[0,"#7fb6ff"],[0.5,"#bfe0ff"],[0.82,"#e8f2ff"],[1,"#ffe9c6"]], {glow:"rgba(255,245,214,.55)"}));
    const skyDusk = skyTexture(Object.assign([[0,"#3a2f66"],[0.45,"#8a5a92"],[0.72,"#e08a63"],[1,"#ffd39a"]], {glow:"rgba(255,190,120,.6)"}));
    const skyLayer = new BABYLON.Layer("skyLayer", null, scene, true);
    skyLayer.texture = skyDay;

    // ============================================================
    //  PROCEDURAL TEXTURES
    // ============================================================
    function dyn(size, draw){
      const t = new BABYLON.DynamicTexture("dt", size, scene, true);
      const ctx = t.getContext();
      const S = (typeof size === "number") ? size : size.width;
      const H = (typeof size === "number") ? size : size.height;
      draw(ctx, S, H);
      t.update();
      return t;
    }

    function grassTex(){
      return dyn(512, (ctx,S)=>{
        ctx.fillStyle = "#57b247"; ctx.fillRect(0,0,S,S);
        for (let i=0;i<220;i++){ ctx.fillStyle = `rgba(${30+Math.random()*30|0},${120+Math.random()*70|0},${40+Math.random()*30|0},.5)`;
          const x=Math.random()*S,y=Math.random()*S,r=8+Math.random()*30; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
        for (let i=0;i<1500;i++){ const x=Math.random()*S,y=Math.random()*S,len=4+Math.random()*8,a=-Math.PI/2+(Math.random()-.5)*.7;
          ctx.strokeStyle=`rgb(${40+Math.random()*30|0},${120+Math.random()*95|0},${40+Math.random()*30|0})`; ctx.lineWidth=1+Math.random();
          ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len); ctx.stroke(); }
        const fc=["#ffffff","#ffd84d","#ff7ba8","#c58bff"];
        for (let i=0;i<80;i++){ ctx.fillStyle=fc[Math.random()*fc.length|0]; const x=Math.random()*S,y=Math.random()*S,r=1.4+Math.random()*1.8; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
      });
    }
    function stoneTex(base, mortar){
      return dyn(512, (ctx,S)=>{
        ctx.fillStyle = base; ctx.fillRect(0,0,S,S);
        const bh=42, bw=74;
        for (let row=0,y=0; y<S+bh; row++, y+=bh){
          const off=(row%2)?bw/2:0;
          for (let x=-bw; x<S+bw; x+=bw){
            ctx.fillStyle = shade(base,(Math.random()*26-13)|0); ctx.fillRect(x+off+2,y+2,bw-4,bh-4);
            ctx.fillStyle = "rgba(0,0,0,.06)"; ctx.fillRect(x+off+2,y+bh-8,bw-4,6);
          }
        }
        ctx.strokeStyle = mortar; ctx.lineWidth=3;
        for (let row=0,y=0; y<S+bh; row++, y+=bh){
          ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke();
          const off=(row%2)?bw/2:0;
          for (let x=-bw; x<S+bw; x+=bw){ ctx.beginPath(); ctx.moveTo(x+off,y); ctx.lineTo(x+off,y+bh); ctx.stroke(); }
        }
        for (let i=0;i<450;i++){ ctx.fillStyle=`rgba(0,0,0,${Math.random()*.08})`; ctx.fillRect(Math.random()*S,Math.random()*S,2,2); }
      });
    }
    function woodTex(base){
      return dyn(512, (ctx,S)=>{
        ctx.fillStyle=base; ctx.fillRect(0,0,S,S);
        const pw=54;
        for (let x=0;x<S;x+=pw){
          ctx.fillStyle=shade(base,(Math.random()*20-10)|0); ctx.fillRect(x,0,pw,S);
          for (let g=0; g<9; g++){
            ctx.strokeStyle=shade(base,(Math.random()*30-20)|0); ctx.lineWidth=1+Math.random();
            let yy=Math.random()*S; ctx.beginPath(); ctx.moveTo(x+2,yy);
            for (let s=0;s<pw;s+=6){ yy+=(Math.random()-.5)*3; ctx.lineTo(x+2+s,yy); } ctx.stroke();
          }
          ctx.strokeStyle=shade(base,-46); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,S); ctx.stroke();
          if (Math.random()<.5){ ctx.strokeStyle=shade(base,-32); ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(x+pw/2,Math.random()*S,4,7,0,0,7); ctx.stroke(); }
        }
      });
    }
    function tudorTex(plaster, beam){
      return dyn(512, (ctx,S)=>{
        ctx.fillStyle=plaster; ctx.fillRect(0,0,S,S);
        for (let i=0;i<1500;i++){ ctx.fillStyle=`rgba(0,0,0,${Math.random()*.04})`; ctx.fillRect(Math.random()*S,Math.random()*S,2,2); }
        ctx.strokeStyle=beam; ctx.lineCap="square"; ctx.lineWidth=17;
        ctx.strokeRect(9,9,S-18,S-18);
        ctx.beginPath(); ctx.moveTo(9,S/2); ctx.lineTo(S-9,S/2); ctx.stroke();
        for (const vx of [S*0.34,S*0.66]){ ctx.beginPath(); ctx.moveTo(vx,9); ctx.lineTo(vx,S-9); ctx.stroke(); }
        ctx.lineWidth=12;
        ctx.beginPath(); ctx.moveTo(12,S/2); ctx.lineTo(S*0.34,12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(S*0.66,S-12); ctx.lineTo(S-12,S/2); ctx.stroke();
      });
    }
    function rockTex(base){
      return dyn(512, (ctx,S)=>{
        ctx.fillStyle=base; ctx.fillRect(0,0,S,S);
        for (let i=0;i<12;i++){ const y=Math.random()*S,h=6+Math.random()*22; ctx.fillStyle=`rgba(60,50,40,${.08+Math.random()*.13})`; ctx.fillRect(0,y,S,h); }
        for (let i=0;i<46;i++){ ctx.strokeStyle=`rgba(40,32,26,${.25+Math.random()*.3})`; ctx.lineWidth=1+Math.random()*2;
          let x=Math.random()*S,y=Math.random()*S; ctx.beginPath(); ctx.moveTo(x,y);
          for (let s=0;s<6;s++){ x+=(Math.random()-.5)*42; y+=(Math.random()-.3)*42; ctx.lineTo(x,y); } ctx.stroke(); }
        for (let i=0;i<1200;i++){ ctx.fillStyle=`rgba(255,255,255,${Math.random()*.05})`; ctx.fillRect(Math.random()*S,Math.random()*S,2,2); }
        for (let i=0;i<800;i++){ ctx.fillStyle=`rgba(0,0,0,${Math.random()*.06})`; ctx.fillRect(Math.random()*S,Math.random()*S,2,2); }
      });
    }
    function waterTex(){
      return dyn(512, (ctx,S)=>{
        ctx.fillStyle="#2fc4ca"; ctx.fillRect(0,0,S,S);
        for (let i=0;i<220;i++){ ctx.strokeStyle=`rgba(255,255,255,${.05+Math.random()*.12})`; ctx.lineWidth=1.5+Math.random()*2;
          const x=Math.random()*S,y=Math.random()*S,w=20+Math.random()*42; ctx.beginPath(); ctx.arc(x,y,w,Math.PI*.15,Math.PI*.55); ctx.stroke(); }
        for (let i=0;i<130;i++){ ctx.fillStyle=`rgba(185,255,255,${.05+Math.random()*.1})`; const x=Math.random()*S,y=Math.random()*S,r=2+Math.random()*4; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
      });
    }
    function fallTex(){
      return dyn({width:128,height:256}, (ctx,S,H)=>{
        ctx.fillStyle="#bfeef2"; ctx.fillRect(0,0,S,H);
        for (let i=0;i<90;i++){ ctx.strokeStyle=`rgba(255,255,255,${.25+Math.random()*.5})`; ctx.lineWidth=2+Math.random()*4;
          const x=Math.random()*S; ctx.beginPath(); ctx.moveTo(x,0); let y=0; while(y<H){ y+=18+Math.random()*22; ctx.lineTo(x+(Math.random()-.5)*6,y); } ctx.stroke(); }
        for (let i=0;i<40;i++){ ctx.fillStyle=`rgba(255,255,255,${.2+Math.random()*.4})`; ctx.beginPath(); ctx.arc(Math.random()*S,Math.random()*H,1+Math.random()*3,0,7); ctx.fill(); }
      });
    }
    function stripeTex(a,b){
      return dyn(256, (ctx,S)=>{ const w=S/8; for (let i=0;i<8;i++){ ctx.fillStyle=(i%2)?a:b; ctx.fillRect(i*w,0,w+1,S); } });
    }
    function softDot(){
      return dyn(128, (ctx,S)=>{ const g=ctx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
        g.addColorStop(0,"rgba(255,255,255,1)"); g.addColorStop(.4,"rgba(255,255,255,.7)"); g.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle=g; ctx.fillRect(0,0,S,S); });
    }

    // ============================================================
    //  MATERIALS
    // ============================================================
    function texMat(name, tex, uv, o){
      o = o || {};
      const m = new BABYLON.StandardMaterial(name, scene);
      m.diffuseTexture = tex; tex.uScale = uv[0]; tex.vScale = uv[1];
      m.diffuseColor = new BABYLON.Color3(1,1,1);
      const sp = o.spec==null?0.05:o.spec; m.specularColor = new BABYLON.Color3(sp,sp,sp);
      m.specularPower = o.specPower==null?44:o.specPower;
      const e = o.emis==null?0.10:o.emis; m.emissiveColor = new BABYLON.Color3(e,e,e);
      if (o.bfc===false) m.backFaceCulling = false;
      return m;
    }
    function colMat(name, hex, o){
      o = o || {};
      const m = new BABYLON.StandardMaterial(name, scene);
      m.diffuseColor = C3(hex);
      const sp = o.spec==null?0.05:o.spec; m.specularColor = new BABYLON.Color3(sp,sp,sp);
      m.specularPower = o.specPower==null?40:o.specPower;
      m.emissiveColor = C3(hex).scale(o.emis==null?0.14:o.emis);
      if (o.alpha!=null) m.alpha = o.alpha;
      if (o.bfc===false) m.backFaceCulling = false;
      if (o.emissiveHex) m.emissiveColor = C3(o.emissiveHex).scale(o.emisMul==null?1:o.emisMul);
      return m;
    }

    const MAT = {};
    MAT.grass   = texMat("grass", grassTex(), [7,7], { spec:0.02, emis:0.12 });
    MAT.stone   = texMat("stone", stoneTex("#b9b3a3","#7c766a"), [1.8,1.8], { spec:0.05, emis:0.11 });
    MAT.stoneD  = texMat("stoneD", stoneTex("#8f8a7d","#5f5a4f"), [1.6,1.6], { spec:0.04, emis:0.10 });
    MAT.wood    = texMat("wood", woodTex("#875530"), [1.6,1.6], { spec:0.04, emis:0.10 });
    MAT.woodL   = texMat("woodL", woodTex("#a9743c"), [1.6,1.6], { spec:0.04, emis:0.10 });
    MAT.tudor   = texMat("tudor", tudorTex("#efe3c4","#5b3a22"), [1,1], { spec:0.03, emis:0.12 });
    MAT.tudor2  = texMat("tudor2", tudorTex("#e7d0a8","#4a3320"), [1,1], { spec:0.03, emis:0.12 });
    MAT.rock    = texMat("rock", rockTex("#8c7f6b"), [6,3], { spec:0.03, emis:0.09 });
    MAT.rockD   = texMat("rockD", rockTex("#736753"), [3,3], { spec:0.03, emis:0.08 });
    MAT.moss    = colMat("moss", "#557a37", { emis:0.16, spec:0.02 });
    MAT.dirt    = colMat("dirt", "#8a6a44", { emis:0.12, spec:0.02 });
    MAT.door    = colMat("door", "#5a3b22", { emis:0.10 });
    MAT.window  = colMat("window", "#ffce7c", { emissiveHex:"#ffcf7a", emisMul:0.9, spec:0.0 });
    MAT.roofRed = colMat("roofRed", "#c0512e", { emis:0.16 });
    MAT.roofBlu = colMat("roofBlu", "#3f6db5", { emis:0.16 });
    MAT.roofGrn = colMat("roofGrn", "#4a7a52", { emis:0.16 });
    MAT.roofPur = colMat("roofPur", "#7b5aa6", { emis:0.16 });
    MAT.thatch  = colMat("thatch", "#d3ab4e", { emis:0.16 });
    MAT.thatch2 = colMat("thatch2", "#c69a43", { emis:0.16 });
    MAT.metal   = colMat("metal", "#8b8f96", { spec:0.35, specPower:64, emis:0.06 });
    MAT.cloud   = colMat("cloud", "#ffffff", { emis:0.34, spec:0.0 });
    MAT.bird    = colMat("bird", "#3b3b42", { emis:0.05 });
    MAT.leafA   = colMat("leafA", "#2f8a4a", { emis:0.14 });
    MAT.leafB   = colMat("leafB", "#3aa35a", { emis:0.14 });
    MAT.leafC   = colMat("leafC", "#277a44", { emis:0.14 });
    MAT.leafD   = colMat("leafD", "#5aa84a", { emis:0.14 });
    MAT.flagR   = colMat("flagR", "#d23b3b", { emis:0.22 });
    MAT.flagB   = colMat("flagB", "#3b6fd2", { emis:0.22 });
    MAT.flagG   = colMat("flagG", "#e0b23b", { emis:0.24 });
    MAT.flagP   = colMat("flagP", "#7d3bd2", { emis:0.22 });
    MAT.bannerR = colMat("bannerR", "#b5342f", { emis:0.20, bfc:false });
    MAT.bannerB = colMat("bannerB", "#2f5fb5", { emis:0.20, bfc:false });
    MAT.awnings = [
      texMat("aw0", stripeTex("#e2483d","#f6f0e6"), [1,1], { emis:0.16, bfc:false }),
      texMat("aw1", stripeTex("#2f7fb5","#f6f0e6"), [1,1], { emis:0.16, bfc:false }),
      texMat("aw2", stripeTex("#3f9455","#f6f0e6"), [1,1], { emis:0.16, bfc:false }),
      texMat("aw3", stripeTex("#e0a83b","#5b3a22"), [1,1], { emis:0.16, bfc:false }),
    ];
    MAT.water = (function(){
      const m = new BABYLON.StandardMaterial("water", scene);
      m.diffuseTexture = waterTex(); m.diffuseTexture.uScale = 3; m.diffuseTexture.vScale = 8;
      m.diffuseColor = new BABYLON.Color3(1,1,1);
      m.specularColor = new BABYLON.Color3(0.55,0.9,0.9); m.specularPower = 64;
      m.emissiveColor = new BABYLON.Color3(0.05,0.22,0.24);
      m.alpha = 0.84; m.backFaceCulling = false;
      return m;
    })();
    MAT.fall = (function(){
      const m = new BABYLON.StandardMaterial("fall", scene);
      m.diffuseTexture = fallTex(); m.diffuseTexture.uScale = 1; m.diffuseTexture.vScale = 2;
      m.diffuseColor = new BABYLON.Color3(1,1,1);
      m.emissiveColor = new BABYLON.Color3(0.35,0.5,0.52);
      m.specularColor = new BABYLON.Color3(0.4,0.6,0.6); m.specularPower = 80;
      m.alpha = 0.6; m.backFaceCulling = false;
      return m;
    })();
    const goodsMats = ["#c0392b","#e08a2f","#3f9455","#8a5a2b","#b5342f","#7d3bd2","#e0b23b"].map((h,i)=>colMat("good"+i,h,{emis:0.15}));

    const dotTex = softDot();

    // root that gently bobs
    const isle = new BABYLON.TransformNode("isle", scene);

    // ============================================================
    //  GEOMETRY BUILDERS
    // ============================================================
    // triangular-prism gable roof, base at y=0, ridge at y=h
    function gableRoof(name, w, d, h, mat){
      const hw=w/2, hd=d/2;
      const pos = [ -hw,0,hd,  hw,0,hd,  0,h,hd,   -hw,0,-hd,  hw,0,-hd,  0,h,-hd ];
      const uv  = [ 0,0, 1,0, 0.5,1,  0,0, 1,0, 0.5,1 ];
      const idx = [ 0,1,2, 3,5,4,  0,5,3, 0,2,5,  2,4,5, 2,1,4,  0,4,1, 0,3,4 ];
      const nrm = []; BABYLON.VertexData.ComputeNormals(pos, idx, nrm);
      const vd = new BABYLON.VertexData(); vd.positions=pos; vd.indices=idx; vd.normals=nrm; vd.uvs=uv;
      const m = new BABYLON.Mesh(name, scene); vd.applyToMesh(m); m.material = mat; return m;
    }

    function box(name, w, h, d, mat, x, baseY, z){
      const m = BABYLON.MeshBuilder.CreateBox(name, { width:w, height:h, depth:d }, scene);
      m.material = mat; m.position.set(x, baseY + h/2, z); return m;
    }
    function cyl(name, dTop, dBot, h, tess, mat, x, baseY, z){
      const m = BABYLON.MeshBuilder.CreateCylinder(name, { diameterTop:dTop, diameterBottom:dBot, height:h, tessellation:tess }, scene);
      m.material = mat; m.position.set(x, baseY + h/2, z); return m;
    }
    function cone(name, dia, h, tess, mat, x, baseY, z){
      const m = BABYLON.MeshBuilder.CreateCylinder(name, { diameterTop:0, diameterBottom:dia, height:h, tessellation:tess }, scene);
      m.material = mat; m.position.set(x, baseY + h/2, z); return m;
    }

    // ---- floating island base ----
    function buildIsland(){
      // craggy rock body
      const H = 21;
      const rock = BABYLON.MeshBuilder.CreateCylinder("rockBody", {
        height:H, diameterTop:46, diameterBottom:6, tessellation:76, subdivisions:18, cap:BABYLON.Mesh.CAP_ALL, updatable:true
      }, scene);
      rock.material = MAT.rock;
      rock.position.y = -0.2 - H/2; // top near y = -0.2
      const p = rock.getVerticesData(POS);
      const topY = H/2;
      for (let i=0;i<p.length;i+=3){
        const x=p[i], y=p[i+1], z=p[i+2];
        const rad=Math.hypot(x,z);
        if (rad>0.001){
          let t=(topY - y)/H; t=Math.min(1,Math.max(0,t));
          const ang=Math.atan2(z,x);
          const hf = Math.pow(Math.sin(t*Math.PI),0.75)*2.4 + 0.22;
          let n = Math.sin(ang*3 + y*0.5)*1.3 + Math.sin(ang*7 - y*0.8)*0.7 + Math.sin(ang*13 + y*1.2)*0.35 + Math.sin(ang*5 + y*2.0)*0.22;
          n *= hf;
          const s = (rad + n)/rad;
          p[i]=x*s; p[i+2]=z*s;
          p[i+1] = y + Math.sin(ang*9 + rad*0.6)*0.22*hf;
        }
      }
      const nrm=[]; BABYLON.VertexData.ComputeNormals(p, rock.getIndices(), nrm);
      rock.updateVerticesData(POS, p); rock.updateVerticesData(NRM, nrm, true);
      rock.receiveShadows = true; rock.parent = isle;

      // grassy top
      const grass = BABYLON.MeshBuilder.CreateCylinder("grassTop", { height:0.8, diameter:42, tessellation:72, cap:BABYLON.Mesh.CAP_ALL }, scene);
      grass.material = MAT.grass; grass.position.y = -0.4; grass.receiveShadows = true; grass.parent = isle;

      // mossy cliff-edge collar hiding the seam
      const collar = BABYLON.MeshBuilder.CreateCylinder("collar", { height:1.5, diameterTop:42.6, diameterBottom:45.6, tessellation:72 }, scene);
      collar.material = MAT.moss; collar.position.y = -0.65; collar.receiveShadows = true; collar.parent = isle;

      // hanging debris rocks below
      for (let i=0;i<6;i++){
        const s = rr(1.2,3.2);
        const chunk = BABYLON.MeshBuilder.CreateIcoSphere("chunk"+i, { radius:s, subdivisions:2, updatable:true }, scene);
        const cp = chunk.getVerticesData(POS);
        for (let j=0;j<cp.length;j+=3){ cp[j]*=rr(0.7,1.3); cp[j+1]*=rr(0.6,1.1); cp[j+2]*=rr(0.7,1.3); }
        const cn=[]; BABYLON.VertexData.ComputeNormals(cp, chunk.getIndices(), cn);
        chunk.updateVerticesData(POS,cp); chunk.updateVerticesData(NRM,cn,true);
        chunk.material = MAT.rockD;
        const a = rr(0,Math.PI*2), r = rr(2,12);
        chunk.position.set(Math.cos(a)*r, rr(-16,-8), Math.sin(a)*r);
        chunk.parent = isle; cast(chunk);
      }

      // stone courtyard disc under the castle
      const court = BABYLON.MeshBuilder.CreateCylinder("court", { height:0.4, diameter:16, tessellation:56, cap:BABYLON.Mesh.CAP_ALL }, scene);
      court.material = MAT.stone; court.position.y = 0.18; court.receiveShadows = true; court.parent = isle;
    }

    // ---- crenellations along a wall run ----
    function crenellate(group, from, to, topY, mat, size){
      const dx = to.x-from.x, dz = to.z-from.z; const len = Math.hypot(dx,dz);
      const n = Math.max(2, Math.round(len / (size*1.9)));
      for (let i=0;i<=n;i++){
        const tt = i/n; const x = from.x + dx*tt, z = from.z + dz*tt;
        const b = box("m", size, size*1.1, size, mat, x, topY, z);
        group.push(b);
      }
    }
    // ring of merlons for a round tower
    function crenellateRing(group, cx, cz, radius, topY, count, mat, size){
      for (let i=0;i<count;i++){ const a=(i/count)*Math.PI*2; const b=box("mr", size, size*1.1, size, mat, cx+Math.cos(a)*radius, topY, cz+Math.sin(a)*radius); group.push(b); }
    }

    // ---- flag on a pole (returned for animation) ----
    const flags = [];
    function flagPole(x, baseY, z, h, flagMat){
      const pole = cyl("pole", 0.12, 0.14, h, 8, MAT.wood, x, baseY, z);
      const fin = BABYLON.MeshBuilder.CreateSphere("fin",{diameter:0.34,segments:8},scene); fin.material=MAT.metal; fin.position.set(x, baseY+h+0.05, z);
      const flag = BABYLON.MeshBuilder.CreatePlane("flag", { width:1.5, height:0.85, sideOrientation:DS }, scene);
      flag.material = flagMat;
      const pivot = new BABYLON.TransformNode("flagpvt", scene); pivot.position.set(x, baseY+h-0.55, z); pivot.parent = isle;
      flag.parent = pivot; flag.position.set(0.75, 0, 0);
      pole.parent = isle; fin.parent = isle;
      flags.push({ pivot, phase: rr(0,6.28) });
      return [pole, fin];
    }

    // ---- the castle ----
    function buildCastle(){
      const stoneParts = [], roofParts = [], darkParts = [];
      const c = 6.5, tD = 3.2, tH = 12, wallH = 7.5, wallT = 1.2, m = 0.55;

      // corner towers + colored conical roofs + flags
      const corners = [[c,c],[c,-c],[-c,c],[-c,-c]];
      const roofCols = [MAT.roofBlu, MAT.roofRed, MAT.roofRed, MAT.roofBlu];
      const flagCols = [MAT.flagB, MAT.flagR, MAT.flagR, MAT.flagB];
      corners.forEach((pt,i)=>{
        stoneParts.push(cyl("ct", tD, tD*1.05, tH, 20, MAT.stone, pt[0], 0, pt[1]));
        // eave ring
        stoneParts.push(cyl("ceave", tD+0.5, tD+0.5, 0.5, 20, MAT.stone, pt[0], tH-0.25, pt[1]));
        const cr = cone("croof", tD+0.9, 4.4, 22, roofCols[i], pt[0], tH-0.2, pt[1]); cr.parent = isle; cast(cr);
        flagPole(pt[0], tH+4.0, pt[1], 1.9, flagCols[i]);
      });

      // curtain walls (N, E, W solid; S split for gatehouse)
      function wall(ax, az, bx, bz){
        const mx=(ax+bx)/2, mz=(az+bz)/2; const len=Math.hypot(bx-ax,bz-az);
        const horizontal = Math.abs(bx-ax) > Math.abs(bz-az);
        const w = horizontal ? len : wallT, d = horizontal ? wallT : len;
        stoneParts.push(box("wall", w, wallH, d, MAT.stone, mx, 0, mz));
        crenellate(stoneParts, V3(ax,0,az), V3(bx,0,bz), wallH, MAT.stone, m);
      }
      wall(-c, c,  c, c);   // north
      wall( c,-c,  c, c);   // east
      wall(-c,-c, -c, c);   // west
      // south wall split around a gate gap of width ~4
      wall(-c,-c, -2.1,-c);
      wall( 2.1,-c,  c,-c);

      // gatehouse: two square towers flanking + gate
      [-3.2, 3.2].forEach(gx=>{
        stoneParts.push(box("gt", 2.4, 9, 2.4, MAT.stone, gx, 0, -c));
        crenellate(stoneParts, V3(gx-1.0,0,-c), V3(gx+1.0,0,-c), 9, MAT.stone, 0.45);
        crenellate(stoneParts, V3(gx,0,-c-1.0), V3(gx,0,-c+1.0), 9, MAT.stone, 0.45);
      });
      // gate lintel + dark passage + wooden doors
      stoneParts.push(box("lintel", 4.6, 1.2, 2.4, MAT.stone, 0, wallH-0.6, -c));
      const gatehole = box("gatehole", 3.4, wallH-0.6, 1.6, MAT.door, 0, 0, -c); gatehole.parent = isle;
      box("doorL", 1.55, 4.6, 0.25, MAT.wood, -0.85, 0, -c-0.85).parent = isle;
      box("doorR", 1.55, 4.6, 0.25, MAT.wood,  0.85, 0, -c-0.85).parent = isle;
      // drawbridge plank leaning out + chains
      const bridge = box("drawbridge", 3.2, 0.25, 4.6, MAT.woodL, 0, 0, -c-2.6);
      bridge.rotation.x = -0.12; bridge.position.y = 0.35; bridge.parent = isle; cast(bridge);
      [-1.3,1.3].forEach(cx=>{ const ch = cyl("chain", 0.06,0.06, 4.4, 6, MAT.metal, cx, 0, -c-2.4); ch.rotation.x = Math.PI/2 - 0.5; ch.position.y = 2.4; ch.parent = isle; });

      // central keep (stepped) + windows + banner + spire flag
      stoneParts.push(box("keep", 6, 13, 6, MAT.stone, 0, 0, 0));
      crenellate(stoneParts, V3(-3,0, 3), V3(3,0, 3), 13, MAT.stone, 0.6);
      crenellate(stoneParts, V3(-3,0,-3), V3(3,0,-3), 13, MAT.stone, 0.6);
      crenellate(stoneParts, V3( 3,0,-3), V3(3,0, 3), 13, MAT.stone, 0.6);
      crenellate(stoneParts, V3(-3,0,-3), V3(-3,0,3), 13, MAT.stone, 0.6);
      stoneParts.push(box("keep2", 4, 4.5, 4, MAT.stone, 0, 13, 0));
      crenellateRing(stoneParts, 0,0, 2.6, 17.5, 10, MAT.stone, 0.45);
      // keep windows (warm-lit)
      [[0,0,3.02],[0,0,-3.02],[3.02,0,0],[-3.02,0,0]].forEach(w=>{
        [4,8].forEach(h=>{ const win = box("win", 0.9, 1.5, 0.5, MAT.window, w[0], h, w[2]); win.parent = isle; });
      });
      flagPole(0, 17.5, 0, 3.0, MAT.flagG);
      // hanging banners on the north wall
      const bn1 = BABYLON.MeshBuilder.CreatePlane("bn", {width:1.1,height:3.0,sideOrientation:DS}, scene); bn1.material=MAT.bannerR; bn1.position.set(-2.4, 3.4, c+0.02); bn1.parent=isle;
      const bn2 = BABYLON.MeshBuilder.CreatePlane("bn2",{width:1.1,height:3.0,sideOrientation:DS}, scene); bn2.material=MAT.bannerB; bn2.position.set( 2.4, 3.4, c+0.02); bn2.parent=isle;

      // merge static groups
      const stone = BABYLON.Mesh.MergeMeshes(stoneParts, true, true, undefined, false, false);
      if (stone){ stone.name="castleStone"; stone.parent = isle; stone.receiveShadows = true; cast(stone); }
      // corner roof cones and the gate passage are added directly above (they use their own materials)
    }

    // ---- generic cottage ----
    const smokers = [];
    function cottage(x, z, opt){
      opt = opt || {};
      const w = opt.w || rr(2.6,3.6), d = opt.d || rr(2.6,3.6), wh = opt.wh || rr(2.2,3.0);
      const wallMat = opt.wallMat || pick([MAT.tudor, MAT.tudor2, MAT.wood, MAT.woodL]);
      const roofMat = opt.roofMat || pick([MAT.roofRed, MAT.thatch, MAT.thatch2, MAT.roofBlu, MAT.roofGrn]);
      const rot = opt.rot!=null ? opt.rot : rr(0,Math.PI*2);
      const root = new BABYLON.TransformNode("cottage", scene); root.position.set(x,0,z); root.rotation.y = rot; root.parent = isle;

      const body = box("body", w, wh, d, wallMat, 0, 0, 0); body.parent = root; cast(body);
      const roofH = Math.max(w,d)*0.62;
      const roof = gableRoof("roof", w+0.5, d+0.5, roofH, roofMat); roof.position.y = wh; roof.parent = root; cast(roof);
      // door + windows
      const door = box("door", 0.7, 1.35, 0.12, MAT.door, 0, 0, d/2+0.02); door.parent = root;
      [-1,1].forEach(s=>{ if (w>2.8){ const win = box("win", 0.55, 0.6, 0.12, MAT.window, s*w*0.26, wh*0.55, d/2+0.02); win.parent = root; } });
      const winS = box("winS", 0.12, 0.55, 0.55, MAT.window, w/2+0.02, wh*0.55, 0); winS.parent = root;
      // chimney
      if (rng()<0.7){ const ch = box("chim", 0.5, wh*0.6+roofH*0.5, 0.5, MAT.stone, w*0.3, wh, 0); ch.parent = root; cast(ch);
        if (opt.smoke || rng()<0.3){ smokers.push(V3(x + Math.cos(rot)*(w*0.3) - Math.sin(rot)*0, wh+roofH*0.5+0.6, z + Math.sin(rot)*(w*0.3) + Math.cos(rot)*0)); }
      }
      return root;
    }

    // ---- tavern ----
    function tavern(x, z, rot){
      const root = new BABYLON.TransformNode("tavern", scene); root.position.set(x,0,z); root.rotation.y = rot; root.parent = isle;
      const w=4.6, d=3.8, wh=3.4;
      const lower = box("tlow", w, wh, d, MAT.tudor, 0, 0, 0); lower.parent=root; cast(lower);
      // jettied upper floor (slightly larger)
      const upper = box("tup", w+0.5, 1.6, d+0.5, MAT.tudor2, 0, wh, 0); upper.parent=root; cast(upper);
      const roof = gableRoof("troof", w+1.1, d+1.1, 3.0, MAT.roofRed); roof.position.y = wh+1.6; roof.parent=root; cast(roof);
      const door = box("tdoor", 1.0, 1.9, 0.14, MAT.door, 0, 0, d/2+0.02); door.parent=root;
      [-1,1].forEach(s=>{ const win=box("tw",0.7,0.8,0.12,MAT.window,s*1.4,wh*0.5,d/2+0.02); win.parent=root; });
      [-1,1].forEach(s=>{ const win=box("tw2",0.7,0.8,0.12,MAT.window,s*1.4,wh+0.8,d/2+0.28); win.parent=root; });
      // chimney w/ smoke
      const ch = box("tchim",0.6,2.6,0.6,MAT.stone, -w*0.32, wh+1.6, 0); ch.parent=root; cast(ch);
      // hanging sign
      const post = box("spost",0.16,2.6,0.16,MAT.wood, w/2+0.4, 0, d/2-0.4); post.parent=root;
      const arm = box("sarm",1.1,0.14,0.14,MAT.wood, w/2+0.9, 2.4, d/2-0.4); arm.parent=root;
      const signTex = dyn(128,(g,S)=>{ g.fillStyle="#e9d9b0"; g.fillRect(0,0,S,S); g.strokeStyle="#5b3a22"; g.lineWidth=8; g.strokeRect(6,6,S-12,S-12);
        g.fillStyle="#7a5a34"; g.beginPath(); g.ellipse(S*0.5,S*0.58,26,30,0,0,7); g.fill(); g.fillStyle="#efe3c4"; g.beginPath(); g.ellipse(S*0.5,S*0.4,24,12,0,0,7); g.fill(); });
      const signMat = colMat("signM","#ffffff",{emis:0.2,bfc:false}); signMat.diffuseTexture=signTex; signMat.diffuseColor=new BABYLON.Color3(1,1,1);
      const sign = BABYLON.MeshBuilder.CreatePlane("sign",{size:1.0,sideOrientation:DS},scene); sign.material=signMat; sign.position.set(w/2+1.3, 1.85, d/2-0.4); sign.parent=root;
      // barrels
      [[-w/2-0.6,0.5],[-w/2-0.6,1.4]].forEach(p=>{ const bl=cyl("barrel",0.55,0.65,0.9,12,MAT.wood, p[0], 0, p[1]); bl.parent=root; cast(bl); });
      // rotated smoke pos in world space
      const sx = x + Math.cos(rot)*(-w*0.32); const sz = z + Math.sin(rot)*(-w*0.32);
      smokers.push(V3(sx, wh+1.6+2.6+0.4, sz));
      return root;
    }

    // ---- market stall ----
    function stall(x, z, rot, awMat){
      const root = new BABYLON.TransformNode("stall", scene); root.position.set(x,0,z); root.rotation.y = rot; root.parent = isle;
      const legs = [[-0.7,-0.5],[0.7,-0.5],[-0.7,0.5],[0.7,0.5]];
      legs.forEach(l=>{ const p=box("leg",0.12,0.95,0.12,MAT.wood,l[0],0,l[1]); p.parent=root; });
      const top = box("stop", 1.7, 0.14, 1.25, MAT.woodL, 0, 0.95, 0); top.parent=root; cast(top);
      // posts + awning
      [[-0.85,-0.6],[0.85,-0.6]].forEach(l=>{ const p=box("post",0.12,2.1,0.12,MAT.wood,l[0],0,l[1]); p.parent=root; });
      const aw = box("awn", 2.1, 0.12, 1.7, awMat, 0, 2.0, 0.15); aw.rotation.x = -0.32; aw.parent=root; cast(aw);
      // goods
      for (let i=0;i<ri(4,7);i++){ const gm=pick(goodsMats); const s=rr(0.16,0.28);
        const g = BABYLON.MeshBuilder.CreateSphere("g",{diameter:s,segments:8},scene); g.material=gm; g.position.set(rr(-0.65,0.65),1.02+s/2,rr(-0.45,0.45)); g.parent=root; }
      const crate = box("crate",0.55,0.5,0.5,MAT.wood, rr(-0.5,0.5),1.02,rr(-0.4,0.4)); crate.parent=root;
      return root;
    }

    // ---- well ----
    function well(x,z){
      const root = new BABYLON.TransformNode("well", scene); root.position.set(x,0,z); root.parent=isle;
      const ring = cyl("wring", 1.5,1.6, 1.0, 20, MAT.stoneD, 0,0,0); ring.parent=root; cast(ring);
      const water = cyl("wwater", 1.1,1.1, 0.1, 16, MAT.water, 0, 0.75, 0); water.parent=root;
      [[-0.75,0],[0.75,0]].forEach(p=>{ const po=box("wpost",0.16,1.7,0.16,MAT.wood,p[0],1.0,p[1]); po.parent=root; });
      const roof = gableRoof("wroof", 2.1, 1.5, 0.9, MAT.roofBlu); roof.position.y=2.7; roof.rotation.y=Math.PI/2; roof.parent=root; cast(roof);
      const bucket = cyl("buck",0.3,0.35,0.4,10,MAT.wood, 0, 2.0, 0); bucket.parent=root;
      return root;
    }

    // ---- riverside mill (with animated wheel) ----
    const wheels = [];
    function mill(x, z, faceAngle, wheelPos){
      const root = new BABYLON.TransformNode("mill", scene); root.position.set(x,0,z); root.rotation.y = faceAngle; root.parent = isle;
      const w=4.0, d=3.4;
      const base = box("mbase", w, 1.6, d, MAT.stoneD, 0, 0, 0); base.parent=root; cast(base);
      const upper = box("mup", w-0.4, 2.4, d-0.4, MAT.wood, 0, 1.6, 0); upper.parent=root; cast(upper);
      const roof = gableRoof("mroof", w+0.6, d+0.6, 2.4, MAT.roofGrn); roof.position.y = 4.0; roof.parent=root; cast(roof);
      const door = box("mdoor",0.8,1.5,0.12,MAT.door,0,0,d/2+0.02); door.parent=root;
      const win = box("mwin",0.6,0.7,0.12,MAT.window, 1.1, 2.6, d/2+0.02); win.parent=root;

      // water wheel — vertical, axle along the wall face
      const wheel = new BABYLON.TransformNode("wheel", scene);
      const R = 1.7;
      const axle = cyl("axle", 0.22,0.22, 1.4, 10, MAT.wood, 0,0,0); axle.rotation.z = Math.PI/2; axle.parent = wheel;
      [-0.55,0.55].forEach(off=>{ const ring = BABYLON.MeshBuilder.CreateTorus("wr",{diameter:R*2, thickness:0.16, tessellation:26},scene);
        ring.material=MAT.woodL; ring.rotation.x=Math.PI/2; ring.position.x=off; ring.parent=wheel; });
      for (let i=0;i<9;i++){ const a=(i/9)*Math.PI*2;
        const spoke = box("spk",0.1, R*2-0.2, 0.1, MAT.wood, 0,0,0); spoke.rotation.x = a; spoke.parent=wheel;
        const paddle = box("pad", 1.15, 0.5, 0.14, MAT.woodL, 0,0,0); paddle.position.set(0, Math.cos(a)*R, Math.sin(a)*R); paddle.rotation.x = a; paddle.parent=wheel; }
      // place wheel at river edge, in world space, rotated to face the river tangent
      const dir = wheelPos.dir; // across-river axis (unit, XZ)
      wheel.position.set(wheelPos.x, 1.5, wheelPos.z);
      wheel.rotation.y = Math.atan2(dir.z, dir.x);
      wheel.parent = isle;
      wheels.push({ node: wheel, speed: 0.7 });
      return root;
    }

    // ---- pine tree ----
    function pine(x, z, scale){
      const leaf = pick([MAT.leafA, MAT.leafB, MAT.leafC, MAT.leafD]);
      const root = new BABYLON.TransformNode("pine", scene); root.position.set(x,0,z); root.rotation.y = rr(0,6.28);
      root.scaling.setAll(scale); root.parent = isle;
      const trunk = cyl("trunk", 0.25,0.42, 1.4, 8, MAT.wood, 0,0,0); trunk.parent=root; cast(trunk);
      const parts = [
        cone("c1", 2.7, 2.3, 14, leaf, 0, 1.0, 0),
        cone("c2", 2.05, 2.1, 14, leaf, 0, 2.3, 0),
        cone("c3", 1.35, 1.9, 14, leaf, 0, 3.5, 0),
      ];
      const foliage = BABYLON.Mesh.MergeMeshes(parts, true, true, undefined, false, false);
      if (foliage){ foliage.parent=root; cast(foliage); }
      return root;
    }

    // ---- scatter rock ----
    function scatterRock(x, y, z, s, mat){
      const r = BABYLON.MeshBuilder.CreateIcoSphere("r",{radius:s,subdivisions:1,updatable:true},scene);
      const p = r.getVerticesData(POS);
      for (let j=0;j<p.length;j+=3){ p[j]*=rr(0.7,1.3); p[j+1]*=rr(0.5,1.0); p[j+2]*=rr(0.7,1.3); }
      const n=[]; BABYLON.VertexData.ComputeNormals(p, r.getIndices(), n);
      r.updateVerticesData(POS,p); r.updateVerticesData(NRM,n,true);
      r.material = mat || MAT.rockD; r.position.set(x, y, z); r.rotation.y = rr(0,6.28); r.parent = isle; cast(r);
      return r;
    }

    // ---- ruined watchtower ----
    function ruin(x, z){
      const root = new BABYLON.TransformNode("ruin", scene); root.position.set(x,0,z); root.rotation.z = rr(-0.05,0.05); root.parent = isle;
      const parts = [];
      parts.push(cyl("rbody", 3.4,3.8, 5.0, 22, MAT.stoneD, 0,0,0));
      // jagged broken top — stubs at varying heights
      const count = 16;
      for (let i=0;i<count;i++){ const a=(i/count)*Math.PI*2; const h = rr(0.3,2.2);
        if (rng()<0.72){ const b = box("stub", 0.7, h, 0.7, MAT.stoneD, Math.cos(a)*1.6, 5.0, Math.sin(a)*1.6); b.rotation.y = a; parts.push(b); } }
      // broken doorway
      const dark = box("rdoor", 1.1, 2.2, 1.2, MAT.door, 0, 0, 1.7); dark.parent = root;
      const merged = BABYLON.Mesh.MergeMeshes(parts, true, true, undefined, false, false);
      if (merged){ merged.parent = root; merged.receiveShadows = true; cast(merged); }
      // rubble + a leaning fallen stone
      for (let i=0;i<7;i++){ const a=rr(0,6.28), r=rr(2.2,3.8); scatterRock(x+Math.cos(a)*r, 0.3, z+Math.sin(a)*r, rr(0.3,0.7), MAT.stoneD); }
      // ivy hints
      for (let i=0;i<5;i++){ const a=rr(0,6.28); const ivy = BABYLON.MeshBuilder.CreateSphere("ivy",{diameter:rr(0.6,1.1),segments:6},scene);
        ivy.material=MAT.leafC; ivy.scaling.y=0.4; ivy.position.set(x+Math.cos(a)*1.7, rr(1,4), z+Math.sin(a)*1.7); ivy.parent=isle; }
      return root;
    }

    // ---- wooden bridge across the river at a sampled point ----
    function bridge(center, across){
      const root = new BABYLON.TransformNode("bridge", scene);
      root.position.set(center.x, 0.55, center.z);
      root.rotation.y = Math.atan2(across.x, across.z);
      root.parent = isle;
      const span = 5.0;
      const deck = box("deck", span, 0.22, 1.7, MAT.woodL, 0, 0, 0); deck.parent=root; cast(deck);
      // plank lines
      for (let i=-1;i<=1;i+=2){ const rail = box("rail", span, 0.14, 0.14, MAT.wood, 0, 0.55, i*0.75); rail.parent=root; }
      for (let s=-span/2+0.4; s<=span/2-0.4; s+=0.9){ [-1,1].forEach(i=>{ const post=box("bpost",0.14,0.6,0.14,MAT.wood, s, 0.11, i*0.75); post.parent=root; }); }
      return root;
    }

    // ---- waterfall at a rim point (sheet + particles) ----
    function waterfall(edge, outward){
      // outward: unit XZ pointing away from island centre
      const yaw = Math.atan2(outward.x, outward.z);
      // falling sheets (a couple, slightly offset for volume)
      for (let k=0;k<2;k++){
        const sheet = BABYLON.MeshBuilder.CreatePlane("fallsheet", { width:3.0 - k*0.6, height:12, sideOrientation:DS }, scene);
        sheet.material = MAT.fall;
        sheet.rotation.y = yaw;
        sheet.rotation.x = 0.10; // lean outward as it falls
        sheet.position.set(edge.x + outward.x*(0.4 + k*0.3), -5.8 - k*0.4, edge.z + outward.z*(0.4 + k*0.3));
        sheet.parent = isle;
      }
      // foam at the lip
      const foam = cyl("foam", 3.0, 3.2, 0.2, 16, MAT.fall, edge.x + outward.x*0.3, 0.05, edge.z + outward.z*0.3);
      foam.material = colMat("foamM","#eafcff",{emis:0.4}); foam.parent = isle;

      // spray particles
      const ps = new BABYLON.ParticleSystem("spray", 900, scene);
      ps.particleTexture = dotTex;
      ps.emitter = V3(edge.x + outward.x*0.5, -0.2, edge.z + outward.z*0.5);
      ps.minEmitBox = V3(-1.4, 0, -1.4); ps.maxEmitBox = V3(1.4, 0.2, 1.4);
      ps.direction1 = V3(outward.x*0.4, -1.0, outward.z*0.4);
      ps.direction2 = V3(outward.x*0.9, -1.4, outward.z*0.9);
      ps.color1 = new BABYLON.Color4(0.8,1.0,1.0,0.9);
      ps.color2 = new BABYLON.Color4(0.6,0.95,1.0,0.7);
      ps.colorDead = new BABYLON.Color4(0.7,0.95,1.0,0.0);
      ps.minSize = 0.25; ps.maxSize = 0.7;
      ps.minLifeTime = 1.1; ps.maxLifeTime = 2.0;
      ps.emitRate = 320;
      ps.gravity = V3(0,-22,0);
      ps.minEmitPower = 3; ps.maxEmitPower = 7;
      ps.updateSpeed = 0.02;
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
      ps.start();

      // drifting mist lower down that fades
      const mist = new BABYLON.ParticleSystem("mist", 200, scene);
      mist.particleTexture = dotTex;
      mist.emitter = V3(edge.x + outward.x*1.2, -9.5, edge.z + outward.z*1.2);
      mist.minEmitBox = V3(-1.5,-0.5,-1.5); mist.maxEmitBox = V3(1.5,0.5,1.5);
      mist.direction1 = V3(-0.3,0.3,-0.3); mist.direction2 = V3(0.3,0.8,0.3);
      mist.color1 = new BABYLON.Color4(1,1,1,0.35); mist.color2 = new BABYLON.Color4(1,1,1,0.2);
      mist.colorDead = new BABYLON.Color4(1,1,1,0.0);
      mist.minSize=1.4; mist.maxSize=3.2; mist.minLifeTime=1.5; mist.maxLifeTime=2.8;
      mist.emitRate=40; mist.gravity=V3(0,1.5,0); mist.minEmitPower=0.5; mist.maxEmitPower=1.5;
      mist.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD; mist.start();
    }

    // ---- chimney smoke ----
    function makeSmoke(pos){
      const ps = new BABYLON.ParticleSystem("smoke", 120, scene);
      ps.particleTexture = dotTex;
      ps.emitter = pos;
      ps.minEmitBox = V3(-0.05,0,-0.05); ps.maxEmitBox = V3(0.05,0,0.05);
      ps.direction1 = V3(-0.15,1,-0.15); ps.direction2 = V3(0.2,1,0.2);
      ps.color1 = new BABYLON.Color4(0.9,0.9,0.9,0.5); ps.color2 = new BABYLON.Color4(0.8,0.8,0.82,0.35);
      ps.colorDead = new BABYLON.Color4(0.85,0.85,0.85,0.0);
      ps.minSize=0.5; ps.maxSize=1.6; ps.minLifeTime=2.2; ps.maxLifeTime=4.0;
      ps.emitRate=14; ps.gravity=V3(0.4,1.1,0); ps.minEmitPower=0.4; ps.maxEmitPower=1.0;
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD; ps.start();
    }

    // ---- clouds & birds (orbit independently, not on the bobbing isle) ----
    const cloudNodes = [], birdNodes = [];
    function makeClouds(){
      for (let i=0;i<7;i++){
        const pivot = new BABYLON.TransformNode("cloudPvt", scene);
        const puffs = [];
        const n = ri(4,6);
        for (let j=0;j<n;j++){ const s=rr(2.0,4.2); const sp=BABYLON.MeshBuilder.CreateSphere("p",{diameter:s,segments:10},scene);
          sp.position.set(rr(-3,3), rr(-0.6,0.6), rr(-2,2)); puffs.push(sp); }
        const cloud = BABYLON.Mesh.MergeMeshes(puffs, true, true, undefined, false, false);
        cloud.material = MAT.cloud; cloud.scaling.y = 0.6;
        const r = rr(28,42), a = rr(0,6.28), y = rr(-7,15);
        cloud.parent = pivot; cloud.position.set(r, y, 0); pivot.rotation.y = a;
        cloudNodes.push({ pivot, base: y, phase: rr(0,6.28), speed: rr(0.005,0.016) });
      }
    }
    function makeBirds(){
      for (let i=0;i<3;i++){
        const pivot = new BABYLON.TransformNode("birdPvt", scene);
        const body = new BABYLON.TransformNode("bird", scene); body.parent = pivot;
        const wingL = box("wl", 0.9, 0.06, 0.32, MAT.bird, 0,0,0); wingL.parent = body; wingL.position.x = -0.5;
        const wingR = box("wr", 0.9, 0.06, 0.32, MAT.bird, 0,0,0); wingR.parent = body; wingR.position.x = 0.5;
        const r = rr(18,26), y = rr(8,16), a = rr(0,6.28);
        body.position.set(r, y, 0); pivot.rotation.y = a;
        birdNodes.push({ pivot, body, wingL, wingR, base:y, phase:rr(0,6.28), speed:rr(0.12,0.22), flap:rr(6,9) });
      }
    }

    // ---- dirt path ribbon between two points ----
    function path(ax, az, bx, bz, width){
      const dx=bx-ax, dz=bz-az, len=Math.hypot(dx,dz); const nx=-dz/len, nz=dx/len;
      const steps=Math.max(6, Math.round(len/1.2));
      const a=[], b=[];
      for (let i=0;i<=steps;i++){ const t=i/steps; const x=ax+dx*t, z=az+dz*t; const wob=(Math.sin(t*7)*0.15);
        a.push(V3(x+nx*(width/2+wob), 0.05, z+nz*(width/2+wob)));
        b.push(V3(x-nx*(width/2-wob), 0.05, z-nz*(width/2-wob))); }
      const r = BABYLON.MeshBuilder.CreateRibbon("path",{pathArray:[a,b], sideOrientation:DS},scene);
      r.material = MAT.dirt; r.receiveShadows = true; r.parent = isle;
    }

    // ============================================================
    //  RIVER (curve → ribbons → bridges/waterfalls/mill hooks)
    // ============================================================
    let riverPts = [];
    let riverMeta = { millHook:null, endA:null, endB:null };
    function buildRiver(){
      const ctrl = [ V3(-20,0,10), V3(-12,0,12), V3(-3,0,12), V3(6,0,11), V3(12,0,6), V3(15,0,-2), V3(16,0,-12) ];
      const spline = BABYLON.Curve3.CreateCatmullRomSpline(ctrl, 14, false);
      riverPts = spline.getPoints();

      const halfW = 1.6, halfBank = 2.5;
      const L=[], R=[], BL=[], BR=[];
      for (let i=0;i<riverPts.length;i++){
        const p = riverPts[i];
        const pn = riverPts[Math.min(i+1, riverPts.length-1)];
        const pp = riverPts[Math.max(i-1, 0)];
        let dir = pn.subtract(pp); dir.y=0; if (dir.length()<1e-4) dir = V3(1,0,0); dir.normalize();
        const nrm = V3(-dir.z, 0, dir.x);
        L.push(V3(p.x+nrm.x*halfW, 0.10, p.z+nrm.z*halfW));
        R.push(V3(p.x-nrm.x*halfW, 0.10, p.z-nrm.z*halfW));
        BL.push(V3(p.x+nrm.x*halfBank, 0.05, p.z+nrm.z*halfBank));
        BR.push(V3(p.x-nrm.x*halfBank, 0.05, p.z-nrm.z*halfBank));
      }
      const bank = BABYLON.MeshBuilder.CreateRibbon("riverbank", { pathArray:[BL,BR], sideOrientation:DS }, scene);
      bank.material = MAT.dirt; bank.receiveShadows = true; bank.parent = isle;
      const water = BABYLON.MeshBuilder.CreateRibbon("river", { pathArray:[L,R], sideOrientation:DS }, scene);
      water.material = MAT.water; water.parent = isle;

      // little rocks & reeds along the banks
      for (let i=4;i<riverPts.length-4;i+=5){
        const p = riverPts[i];
        const pn = riverPts[i+1]||p; let dir=pn.subtract(p); dir.y=0; dir.normalize(); const nrm=V3(-dir.z,0,dir.x);
        const side = (rng()<0.5?1:-1);
        scatterRock(p.x+nrm.x*(halfBank+0.3)*side, 0.15, p.z+nrm.z*(halfBank+0.3)*side, rr(0.25,0.5), MAT.rockD);
      }

      // ends → waterfalls
      const a0 = riverPts[0], a1 = riverPts[riverPts.length-1];
      riverMeta.endA = a0; riverMeta.endB = a1;
      const outA = new BABYLON.Vector3(a0.x,0,a0.z).normalize();
      const outB = new BABYLON.Vector3(a1.x,0,a1.z).normalize();
      waterfall(a0, outA);
      waterfall(a1, outB);

      // bridges at ~0.4 and ~0.7 along the run
      [0.40, 0.72].forEach(frac=>{
        const idx = Math.round(frac*(riverPts.length-1));
        const p = riverPts[idx]; const pn = riverPts[Math.min(idx+1,riverPts.length-1)];
        let dir = pn.subtract(p); dir.y=0; dir.normalize(); const across = V3(-dir.z,0,dir.x);
        bridge(p, across);
      });

      // mill hook: east-most river point → wheel dips toward river, mill sits just outside
      let bestI = 0, bestX = -1e9;
      for (let i=3;i<riverPts.length-3;i++){ if (riverPts[i].x>bestX){ bestX=riverPts[i].x; bestI=i; } }
      const mp = riverPts[bestI]; const mpn = riverPts[Math.min(bestI+1,riverPts.length-1)];
      let mdir = mpn.subtract(mp); mdir.y=0; mdir.normalize(); const mnrm = V3(-mdir.z,0,mdir.x);
      const out = new BABYLON.Vector3(mp.x,0,mp.z).normalize();
      riverMeta.millHook = {
        building: { x: mp.x + out.x*3.4, z: mp.z + out.z*3.4, angle: Math.atan2(-out.z, -out.x) },
        wheel: { x: mp.x + out.x*1.1, z: mp.z + out.z*1.1, dir: mnrm }
      };
    }

    function distToRiver(x, z){
      let best = 1e9;
      for (let i=0;i<riverPts.length;i+=2){ const dx=riverPts[i].x-x, dz=riverPts[i].z-z; const d=dx*dx+dz*dz; if (d<best) best=d; }
      return Math.sqrt(best);
    }

    // ============================================================
    //  ASSEMBLE THE WORLD
    // ============================================================
    buildIsland();
    buildRiver();
    buildCastle();

    // key village buildings (hand-placed)
    tavern(-2.5, -13.5, 0.35);
    well(1.5, -12.5);
    // mill from river hook
    if (riverMeta.millHook){ mill(riverMeta.millHook.building.x, riverMeta.millHook.building.z, riverMeta.millHook.building.angle, riverMeta.millHook.wheel); }

    // market square (cluster of stalls)
    const stallSpots = [[4.5,-11.5],[6.2,-13.4],[3.4,-14.6],[6.8,-15.8],[1.8,-15.8],[8.6,-12.6]];
    stallSpots.forEach((s,i)=> stall(s[0], s[1], rr(0,6.28), MAT.awnings[i % MAT.awnings.length]));

    // scattered cottages — filtered against castle, river, spacing
    const placed = [];
    const cottageCandidates = [
      [-10,-9],[-13,-4],[-11.5,-13.5],[-6.5,-16],[0.5,-17],[9,-14],[11.5,-9],[-14,2],
      [-12,-9.5],[-8,-12.5],[3.5,-18.5],[12.5,-13.5],[-15.5,-2.5],[10,-16.5],[-9,-15],[13.5,-5.5]
    ];
    let houseCount = 0;
    for (const c of cottageCandidates){
      const d0 = Math.hypot(c[0], c[1]);
      if (d0 < 10.5 || d0 > 18.5) continue;
      if (distToRiver(c[0], c[1]) < 3.0) continue;
      let ok = true;
      for (const p of placed){ if (Math.hypot(p[0]-c[0], p[1]-c[1]) < 4.2){ ok=false; break; } }
      if (!ok) continue;
      cottage(c[0], c[1], { smoke: houseCount<3 }); placed.push(c); houseCount++;
      if (houseCount >= 14) break;
    }

    // paths tying gate → square, and square → east bridge area
    path(0, -8.9, 1.0, -12.5, 1.4);
    path(1.0, -12.5, 8.5, -11.0, 1.2);

    // ruined watchtower on the NE rim (overhanging)
    ruin(18.5, 8.5);

    // pine forest — ring scatter, filtered
    let treeCount = 0;
    for (let i=0;i<70 && treeCount<28;i++){
      const a = rr(0,6.28), r = rr(13.5, 19.5);
      const x = Math.cos(a)*r, z = Math.sin(a)*r;
      if (Math.hypot(x,z) > 19.8) continue;
      if (distToRiver(x,z) < 2.4) continue;
      // avoid buildings
      let ok = true;
      for (const p of placed){ if (Math.hypot(p[0]-x, p[1]-z) < 3.6){ ok=false; break; } }
      for (const s of stallSpots){ if (Math.hypot(s[0]-x, s[1]-z) < 3.2){ ok=false; break; } }
      if (Math.hypot(x-18.5, z-8.5) < 4.5) ok=false; // watchtower
      if (Math.hypot(x+2.5, z+13.5) < 4) ok=false;   // tavern
      if (!ok) continue;
      pine(x, z, rr(0.8, 1.35)); treeCount++;
    }
    // a few pines + rocks tucked near the centre-north grass and rim for depth
    scatterRock(-16, 0.2, -8, 0.8); scatterRock(14, 0.2, 12, 0.9); scatterRock(-6, 0.2, 16, 0.7);
    scatterRock(17, 0.2, -6, 0.7); scatterRock(-18, 0.2, 4, 1.0);
    pine(-16.5, 10, 1.0); pine(-14, 13, 0.9); pine(15.5, -14, 1.1);

    // smoke systems
    smokers.forEach(makeSmoke);
    makeClouds();
    makeBirds();

    // ============================================================
    //  POST-PROCESSING PIPELINE
    // ============================================================
    const pipe = new BABYLON.DefaultRenderingPipeline("pipe", true, scene, [camera]);
    pipe.samples = 4;
    pipe.fxaaEnabled = true;
    pipe.bloomEnabled = true;
    pipe.bloomThreshold = 0.80;
    pipe.bloomWeight = 0.30;
    pipe.bloomKernel = 64;
    pipe.bloomScale = 0.5;
    pipe.imageProcessingEnabled = true;
    pipe.imageProcessing.contrast = 1.18;
    pipe.imageProcessing.exposure = 1.06;
    pipe.imageProcessing.toneMappingEnabled = false;
    pipe.imageProcessing.vignetteEnabled = true;
    pipe.imageProcessing.vignetteWeight = 2.4;
    pipe.imageProcessing.vignetteColor = new BABYLON.Color4(0.05,0.03,0.02,0);
    // depth of field — the tilt-shift "miniature" hint
    pipe.depthOfFieldBlurLevel = BABYLON.DepthOfFieldEffectBlurLevel.Medium;
    pipe.depthOfField.focalLength = 42;
    pipe.depthOfField.fStop = 2.6;
    pipe.depthOfField.focusDistance = 66000;
    pipe.depthOfFieldEnabled = false; // toggled by UI

    // ============================================================
    //  LIGHTING MOODS
    // ============================================================
    function applyMood(dusk){
      if (!dusk){
        skyLayer.texture = skyDay;
        hemi.diffuse = C3("#ffe9c9"); hemi.groundColor = C3("#5a6b3f"); hemi.intensity = 0.62;
        sun.diffuse = C3("#fff2d6"); sun.specular = C3("#fff6e2"); sun.intensity = 1.28;
        sun.direction = V3(-0.55,-1.0,-0.45).normalize();
        fill.diffuse = C3("#bcd4ff"); fill.intensity = 0.35;
        MAT.window.emissiveColor = C3("#ffcf7a").scale(0.85);
        pipe.imageProcessing.exposure = 1.06;
      } else {
        skyLayer.texture = skyDusk;
        hemi.diffuse = C3("#d59a86"); hemi.groundColor = C3("#3c3a4f"); hemi.intensity = 0.42;
        sun.diffuse = C3("#ff9a5c"); sun.specular = C3("#ffb27a"); sun.intensity = 1.05;
        sun.direction = V3(-0.85,-0.5,-0.2).normalize();
        fill.diffuse = C3("#6a5aa0"); fill.intensity = 0.30;
        MAT.window.emissiveColor = C3("#ffbf60").scale(1.6);
        pipe.imageProcessing.exposure = 1.02;
      }
    }
    applyMood(false);

    // ============================================================
    //  ANIMATION LOOP
    // ============================================================
    const world = { autoOrbit: !reduced, dof: false, dusk: false };
    let interacting = false, lastInteract = 0;
    canvas.addEventListener("pointerdown", ()=>{ interacting = true; });
    window.addEventListener("pointerup", ()=>{ interacting = false; lastInteract = performance.now(); });
    canvas.addEventListener("wheel", ()=>{ lastInteract = performance.now(); }, { passive:true });

    let T = 0;
    scene.onBeforeRenderObservable.add(()=>{
      const dt = Math.min(0.05, engine.getDeltaTime()/1000);
      T += dt;

      // gentle float
      if (!reduced) isle.position.y = Math.sin(T*0.55)*0.16;

      // water flow
      MAT.water.diffuseTexture.uOffset += 0.03*dt;
      MAT.water.diffuseTexture.vOffset += 0.22*dt;
      MAT.fall.diffuseTexture.vOffset -= 0.9*dt;

      // wheels
      for (const w of wheels) w.node.rotation.x += w.speed*dt;

      // flags wave
      for (const f of flags){ f.pivot.rotation.y = Math.sin(T*3 + f.phase)*0.22; }

      // clouds drift + bob
      for (const c of cloudNodes){ c.pivot.rotation.y += c.speed*dt; }

      // birds orbit + flap
      for (const b of birdNodes){
        b.pivot.rotation.y += b.speed*dt;
        b.body.position.y = b.base + Math.sin(T*1.4 + b.phase)*0.8;
        const flap = Math.sin(T*b.flap + b.phase)*0.55;
        b.wingL.rotation.z = flap; b.wingR.rotation.z = -flap;
        b.body.rotation.y = Math.PI/2; // face travel direction
      }

      // auto-orbit when idle
      if (world.autoOrbit && !interacting && performance.now()-lastInteract > 1400){
        camera.alpha += 0.075*dt;
      }
      // keep miniature focus tracking the zoom
      if (world.dof){ pipe.depthOfField.focusDistance = camera.radius * 1000; }
    });

    engine.runRenderLoop(()=> scene.render());
    window.addEventListener("resize", ()=> engine.resize());

    // ============================================================
    //  UI WIRING
    // ============================================================
    const panel = document.getElementById("panel");
    const tglOrbit = document.getElementById("tglOrbit");
    const tglDof = document.getElementById("tglDof");
    const tglMood = document.getElementById("tglMood");
    tglOrbit.checked = world.autoOrbit;
    tglOrbit.addEventListener("change", e => { world.autoOrbit = e.target.checked; lastInteract = performance.now(); });
    tglDof.addEventListener("change", e => { world.dof = e.target.checked; pipe.depthOfFieldEnabled = world.dof; });
    tglMood.addEventListener("change", e => { world.dusk = e.target.checked; applyMood(world.dusk); });

    // fade the hint after a bit
    const hint = document.getElementById("hint");
    setTimeout(()=> hint.classList.add("fade"), 6500);

    // reveal panel + drop loading once ready
    scene.executeWhenReady(()=>{
      panel.style.display = "block";
      loadingEl.classList.add("done");
      setTimeout(()=>{ loadingEl.style.display = "none"; }, 850);
    });
    // safety fallback
    setTimeout(()=>{ if (!loadingEl.classList.contains("done")){ panel.style.display="block"; loadingEl.classList.add("done"); setTimeout(()=>loadingEl.style.display="none",850);} }, 9000);
  }
  </script>
</body>
</html>
