<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isle of Eldermere — Diorama</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap");
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0c1418; }
    #renderCanvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #hud {
      position: absolute; inset: 0; pointer-events: none;
      font-family: "Source Sans 3", system-ui, sans-serif; color: #f4efe4;
    }
    #title {
      position: absolute; left: 28px; top: 24px;
      text-shadow: 0 2px 12px rgba(0,0,0,.55);
    }
    #title h1 {
      font-family: Cinzel, serif; font-size: clamp(22px, 3vw, 34px);
      letter-spacing: .14em; margin: 0 0 4px; font-weight: 700;
    }
    #title p { margin: 0; opacity: .78; font-size: 13px; letter-spacing: .28em; text-transform: uppercase; }
    #hint {
      position: absolute; right: 24px; bottom: 22px;
      font-size: 12px; letter-spacing: .08em; opacity: .7;
      background: rgba(10,16,18,.35); padding: 8px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
    }
    #loader {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at 50% 40%, #1c3330 0%, #0b1214 70%);
      transition: opacity .6s ease;
      z-index: 5;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .ring {
      width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(232,210,140,.15);
      border-top-color: #e8d28c;
      animation: spin .9s linear infinite;
    }
    #loader span { font-family: Cinzel, serif; letter-spacing: .22em; font-size: 13px; color: #e8d28c; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    <div id="title">
      <h1>Isle of Eldermere</h1>
      <p>A tabletop diorama</p>
    </div>
    <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
  </div>
  <div id="loader"><div class="ring"></div><span>ASSEMBLING THE ISLE</span></div>

  <script>
  (function () {
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, {
      preserveDrawingBuffer: true,
      stencil: true,
      adaptToDeviceRatio: true
    });
    engine.setHardwareScalingLevel(1);

    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.42, 0.62, 0.78, 1);
    scene.ambientColor = new BABYLON.Color3(0.42, 0.4, 0.38);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.0065;
    scene.fogColor = new BABYLON.Color3(0.62, 0.76, 0.86);
    scene.imageProcessingConfiguration.toneMappingEnabled = true;
    scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
    scene.imageProcessingConfiguration.contrast = 1.12;
    scene.imageProcessingConfiguration.exposure = 1.05;
    scene.imageProcessingConfiguration.vignetteEnabled = true;
    scene.imageProcessingConfiguration.vignetteWeight = 2.4;
    scene.imageProcessingConfiguration.vignetteColor = new BABYLON.Color4(0.12, 0.08, 0.05, 1);
    scene.imageProcessingConfiguration.vignetteStretch = 0.15;

    const camera = new BABYLON.ArcRotateCamera("cam", -0.85, 1.12, 78, new BABYLON.Vector3(0, 6, 2), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 28;
    camera.upperRadiusLimit = 140;
    camera.lowerBetaLimit = 0.28;
    camera.upperBetaLimit = 1.38;
    camera.wheelPrecision = 40;
    camera.panningSensibility = 80;
    camera.useAutoRotationBehavior = true;
    camera.autoRotationBehavior.idleRotationSpeed = 0.085;
    camera.autoRotationBehavior.idleRotationWaitTime = 2500;
    camera.autoRotationBehavior.idleRotationSpinupTime = 1800;
    camera.minZ = 0.2;
    camera.maxZ = 500;

    /* ---------- seeded rng & math ---------- */
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(20250321);
    const rnd = (a, b) => a + rng() * (b - a);
    const irnd = (a, b) => (a + Math.floor(rng() * (b - a + 1)));
    const TAU = Math.PI * 2;

    function fbm(x, z) {
      return Math.sin(x * 0.11) * Math.cos(z * 0.09) * 2.15
        + Math.sin(x * 0.29 + 1.7) * Math.cos(z * 0.26 + 0.5) * 1.05
        + Math.sin(x * 0.67 + 3.1) * Math.sin(z * 0.61) * 0.42
        + Math.sin(x * 1.35 + 0.4) * Math.cos(z * 1.52) * 0.16;
    }

    const RIVER = [
      new BABYLON.Vector3(-31, 0, 4),
      new BABYLON.Vector3(-20, 0, 8),
      new BABYLON.Vector3(-8, 0, 11.5),
      new BABYLON.Vector3(2, 0, 13),
      new BABYLON.Vector3(12, 0, 11),
      new BABYLON.Vector3(20, 0, 7.5),
      new BABYLON.Vector3(30, 0, 2)
    ];

    function distToSeg(p, a, b) {
      const abx = b.x - a.x, abz = b.z - a.z;
      const apx = p.x - a.x, apz = p.z - a.z;
      const ab2 = abx * abx + abz * abz || 1;
      let t = (apx * abx + apz * abz) / ab2;
      t = Math.max(0, Math.min(1, t));
      const dx = apx - abx * t, dz = apz - abz * t;
      return Math.hypot(dx, dz);
    }
    function riverDist(x, z) {
      const p = { x, z };
      let d = 1e9;
      for (let i = 0; i < RIVER.length - 1; i++) d = Math.min(d, distToSeg(p, RIVER[i], RIVER[i + 1]));
      return d;
    }
    function riverPoint(t) {
      const n = RIVER.length - 1;
      const u = Math.max(0, Math.min(0.999, t)) * n;
      const i = Math.floor(u);
      const f = u - i;
      return BABYLON.Vector3.Lerp(RIVER[i], RIVER[i + 1], f);
    }

    const ISLE_R = 34;
    function heightAt(x, z) {
      const dist = Math.hypot(x, z);
      let h = 3.2 + fbm(x, z);
      h += Math.exp(-(x * x + (z + 3) * (z + 3)) / 78) * 6.2;
      h += Math.exp(-((x + 16) * (x + 16) + (z + 14) * (z + 14)) / 90) * 1.6;
      const rd = riverDist(x, z);
      if (rd < 4.4) {
        const k = 1 - rd / 4.4;
        h -= k * k * 2.35;
      }
      if (dist > ISLE_R - 7) {
        const t = (dist - (ISLE_R - 7)) / 7;
        h -= t * t * 9;
      }
      if (dist > ISLE_R) h -= (dist - ISLE_R) * 6;
      return h;
    }

    /* ---------- materials ---------- */
    function std(name, hex, opts) {
      const m = new BABYLON.StandardMaterial(name, scene);
      const c = BABYLON.Color3.FromHexString(hex);
      m.diffuseColor = c;
      m.specularColor = (opts && opts.spec) || new BABYLON.Color3(0.12, 0.12, 0.1);
      m.specularPower = (opts && opts.pow) || 24;
      m.ambientColor = c.scale(0.45);
      m.emissiveColor = (opts && opts.emis) || BABYLON.Color3.Black();
      if (opts && opts.alpha != null) { m.alpha = opts.alpha; m.transparencyMode = 2; }
      if (opts && opts.back) m.backFaceCulling = false;
      return m;
    }

    const mats = {
      grass: std("grass", "#4f9a45"),
      grassDeep: std("grassDeep", "#2f6b34"),
      dirt: std("dirt", "#8a6a45"),
      rock: std("rock", "#7a746a", { spec: new BABYLON.Color3(0.18, 0.18, 0.16), pow: 40 }),
      rockDark: std("rockDark", "#5a554e"),
      cliff: std("cliff", "#8d8173"),
      stone: std("stone", "#9a9388", { spec: new BABYLON.Color3(0.22, 0.21, 0.2), pow: 48 }),
      stoneDark: std("stoneDark", "#6e675e"),
      mortar: std("mortar", "#b7aea2"),
      wood: std("wood", "#7a4a2c"),
      woodDark: std("woodDark", "#5a321c"),
      woodLight: std("woodLight", "#a56a3d"),
      thatch: std("thatch", "#c4a15a"),
      roofRed: std("roofRed", "#a43b32"),
      roofRust: std("roofRust", "#8a3d28"),
      roofGreen: std("roofGreen", "#3d6b48"),
      plaster: std("plaster", "#e6d7b8"),
      plasterWarm: std("plasterWarm", "#edd4a8"),
      water: std("water", "#1fb8b0", { spec: new BABYLON.Color3(0.75, 0.95, 1), pow: 96, alpha: 0.78 }),
      foam: std("foam", "#d6fff6", { spec: new BABYLON.Color3(0.9, 1, 1), pow: 80, alpha: 0.55 }),
      pine: std("pine", "#1f6b3a"),
      pineDark: std("pineDark", "#164d2b"),
      pineLite: std("pineLite", "#3d8c4e"),
      bark: std("bark", "#4a3020"),
      gold: std("gold", "#e6c15a", { spec: new BABYLON.Color3(0.7, 0.6, 0.2), pow: 64, emis: new BABYLON.Color3(0.12, 0.08, 0.02) }),
      banner: std("banner", "#8b1e2d"),
      banner2: std("banner2", "#2a4d7a"),
      window: std("window", "#ffcf6b", { emis: new BABYLON.Color3(0.85, 0.55, 0.15), spec: new BABYLON.Color3(0.4, 0.3, 0.1) }),
      path: std("path", "#c2a574"),
      flowerR: std("flowerR", "#e85d4c"),
      flowerY: std("flowerY", "#f0c94d"),
      flowerP: std("flowerP", "#c86bc5"),
      flowerW: std("flowerW", "#f4f0e4"),
      iron: std("iron", "#3a3a3c", { spec: new BABYLON.Color3(0.4, 0.4, 0.42), pow: 80 }),
      moss: std("moss", "#5a8a3e"),
      skyBot: std("skyBot", "#f3c98a"),
      cloud: std("cloud", "#fff6ea", { alpha: 0.55 })
    };
    mats.cloud.backFaceCulling = false;
    mats.water.backFaceCulling = false;

    function vertexColorMat(name) {
      const m = new BABYLON.StandardMaterial(name, scene);
      m.diffuseColor = BABYLON.Color3.White();
      m.specularColor = new BABYLON.Color3(0.08, 0.08, 0.07);
      m.specularPower = 18;
      m.ambientColor = new BABYLON.Color3(0.5, 0.5, 0.48);
      return m;
    }

    /* ---------- lighting ---------- */
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.2, 1, 0.15), scene);
    hemi.intensity = 0.55;
    hemi.diffuse = new BABYLON.Color3(0.95, 0.93, 0.88);
    hemi.groundColor = new BABYLON.Color3(0.28, 0.32, 0.22);
    hemi.specular = new BABYLON.Color3(0.2, 0.2, 0.18);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.55, -1.05, 0.35), scene);
    sun.position = new BABYLON.Vector3(40, 70, -30);
    sun.intensity = 1.15;
    sun.diffuse = new BABYLON.Color3(1, 0.93, 0.78);
    sun.specular = new BABYLON.Color3(1, 0.95, 0.8);

    const fill = new BABYLON.DirectionalLight("fill", new BABYLON.Vector3(0.7, -0.4, -0.4), scene);
    fill.intensity = 0.22;
    fill.diffuse = new BABYLON.Color3(0.55, 0.7, 0.95);

    const rim = new BABYLON.DirectionalLight("rim", new BABYLON.Vector3(0.2, 0.15, 1), scene);
    rim.intensity = 0.18;
    rim.diffuse = new BABYLON.Color3(1, 0.75, 0.45);

    const glow = new BABYLON.GlowLayer("glow", scene, { blurKernelSize: 32 });
    glow.intensity = 0.45;

    /* ---------- sky dome ---------- */
    (function createSky() {
      const sky = BABYLON.MeshBuilder.CreateSphere("sky", {
        diameter: 420, segments: 20, sideOrientation: BABYLON.Mesh.BACKSIDE
      }, scene);
      const pos = sky.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const cols = [];
      const top = [0.38, 0.62, 0.86];
      const mid = [0.62, 0.78, 0.92];
      const hor = [0.96, 0.78, 0.52];
      const bot = [0.55, 0.48, 0.42];
      for (let i = 0; i < pos.length; i += 3) {
        const y = pos[i + 1] / 210;
        let r, g, b;
        if (y > 0.15) {
          const t = Math.min(1, (y - 0.15) / 0.85);
          r = mid[0] + (top[0] - mid[0]) * t;
          g = mid[1] + (top[1] - mid[1]) * t;
          b = mid[2] + (top[2] - mid[2]) * t;
        } else if (y > -0.05) {
          const t = (y + 0.05) / 0.2;
          r = hor[0] + (mid[0] - hor[0]) * t;
          g = hor[1] + (mid[1] - hor[1]) * t;
          b = hor[2] + (mid[2] - hor[2]) * t;
        } else {
          const t = Math.max(0, (y + 1) / 0.95);
          r = bot[0] + (hor[0] - bot[0]) * t;
          g = bot[1] + (hor[1] - bot[1]) * t;
          b = bot[2] + (hor[2] - bot[2]) * t;
        }
        cols.push(r, g, b, 1);
      }
      sky.setVerticesData(BABYLON.VertexBuffer.ColorKind, cols);
      sky.material = vertexColorMat("skyMat");
      sky.material.disableLighting = true;
      sky.infiniteDistance = true;
      sky.applyFog = false;
    })();

    /* ---------- particle texture ---------- */
    function softTex(size) {
      const dt = new BABYLON.DynamicTexture("pt" + size, { width: size, height: size }, scene, false);
      const ctx = dt.getContext();
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      g.addColorStop(0, "rgba(255,255,255,1)");
      g.addColorStop(0.35, "rgba(255,255,255,0.55)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      dt.update();
      return dt;
    }
    const ptex = softTex(64);

    /* ---------- helpers ---------- */
    function box(name, w, h, d, mat, parent) {
      const m = BABYLON.MeshBuilder.CreateBox(name, { width: w, height: h, depth: d }, scene);
      m.material = mat;
      if (parent) m.parent = parent;
      return m;
    }
    function cyl(name, h, dTop, dBot, tess, mat, parent) {
      const m = BABYLON.MeshBuilder.CreateCylinder(name, {
        height: h, diameterTop: dTop, diameterBottom: dBot, tessellation: tess
      }, scene);
      m.material = mat;
      if (parent) m.parent = parent;
      return m;
    }
    function cone(name, h, d, tess, mat, parent) {
      return cyl(name, h, 0.02, d, tess, mat, parent);
    }
    function sphere(name, d, seg, mat, parent) {
      const m = BABYLON.MeshBuilder.CreateSphere(name, { diameter: d, segments: seg }, scene);
      m.material = mat;
      if (parent) m.parent = parent;
      return m;
    }
    function ico(name, r, sub, mat, parent) {
      const m = BABYLON.MeshBuilder.CreateIcoSphere(name, { radius: r, subdivisions: sub }, scene);
      m.material = mat;
      if (parent) m.parent = parent;
      return m;
    }
    function placeOn(mesh, x, z, yOff) {
      mesh.position.x = x;
      mesh.position.z = z;
      mesh.position.y = heightAt(x, z) + (yOff || 0);
      return mesh;
    }
    function merge(list, name) {
      const ok = list.filter((m) => m);
      if (!ok.length) return null;
      const merged = BABYLON.Mesh.MergeMeshes(ok, true, true, undefined, false, true);
      if (merged) merged.name = name;
      return merged;
    }

    const shadowCasters = [];
    const root = new BABYLON.TransformNode("isleRoot", scene);

    /* ---------- island terrain ---------- */
    const island = BABYLON.MeshBuilder.CreateGround("island", {
      width: 80, height: 80, subdivisions: 96, updatable: true
    }, scene);
    island.parent = root;
    (function sculptIsland() {
      const pos = island.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const cols = [];
      const grassC = [0.32, 0.62, 0.28];
      const grassH = [0.45, 0.72, 0.32];
      const dirtC = [0.52, 0.4, 0.24];
      const rockC = [0.52, 0.48, 0.42];
      const mossC = [0.28, 0.42, 0.24];
      for (let i = 0; i < pos.length; i += 3) {
        const x = pos[i], z = pos[i + 2];
        const dist = Math.hypot(x, z);
        let y = heightAt(x, z);
        if (dist > ISLE_R + 1.5) {
          const pull = Math.min(1, (dist - ISLE_R) / 8);
          pos[i] *= 1 - pull * 0.15;
          pos[i + 2] *= 1 - pull * 0.15;
          y -= pull * 14;
        }
        pos[i + 1] = y;
        const rd = riverDist(x, z);
        const n = fbm(x * 1.7, z * 1.7);
        let r, g, b;
        if (rd < 2.1) {
          const t = rd / 2.1;
          r = dirtC[0] * (1 - t) + grassC[0] * t;
          g = dirtC[1] * (1 - t) + grassC[1] * t;
          b = dirtC[2] * (1 - t) + grassC[2] * t;
        } else if (dist > ISLE_R - 5.5) {
          const t = Math.min(1, (dist - (ISLE_R - 5.5)) / 5);
          r = grassC[0] * (1 - t) + rockC[0] * t;
          g = grassC[1] * (1 - t) + rockC[1] * t;
          b = grassC[2] * (1 - t) + rockC[2] * t;
        } else if (y > 8.2) {
          const t = Math.min(1, (y - 8.2) / 3);
          r = grassC[0] * (1 - t) + grassH[0] * t;
          g = grassC[1] * (1 - t) + grassH[1] * t;
          b = grassC[2] * (1 - t) + grassH[2] * t;
        } else {
          const t = (n + 1) * 0.5;
          r = grassC[0] * (1 - t) + mossC[0] * t;
          g = grassC[1] * (1 - t) + mossC[1] * t;
          b = grassC[2] * (1 - t) + mossC[2] * t;
        }
        const shade = 0.88 + n * 0.12;
        cols.push(r * shade, g * shade, b * shade, 1);
      }
      island.updateVerticesData(BABYLON.VertexBuffer.PositionKind, pos);
      island.setVerticesData(BABYLON.VertexBuffer.ColorKind, cols);
      island.refreshBoundingInfo();
      const norms = [];
      BABYLON.VertexData.ComputeNormals(pos, island.getIndices(), norms);
      island.updateVerticesData(BABYLON.VertexBuffer.NormalKind, norms);
    })();
    island.material = vertexColorMat("isleMat");
    island.receiveShadows = true;
    shadowCasters.push(island);

    /* underside / floating cliffs */
    (function underside() {
      const shape = [];
      for (let i = 0; i <= 22; i++) {
        const t = i / 22;
        const flare = 1 + Math.sin(t * Math.PI) * 0.04;
        const r = (ISLE_R - 0.6) * (1 - t * 0.22) * flare * (t < 0.82 ? 1 : Math.max(0.08, 1 - (t - 0.82) * 5.2));
        const y = -0.4 - t * 20 - Math.sin(t * 9) * 0.35;
        shape.push(new BABYLON.Vector3(r, y, 0));
      }
      const bottom = BABYLON.MeshBuilder.CreateLathe("underside", {
        shape, tessellation: 48, sideOrientation: BABYLON.Mesh.DOUBLESIDE
      }, scene);
      bottom.parent = root;
      const pos = bottom.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const cols = [];
      for (let i = 0; i < pos.length; i += 3) {
        const y = pos[i + 1];
        const n = fbm(pos[i] * 0.6, pos[i + 2] * 0.6);
        const k = Math.max(0, Math.min(1, (-y) / 20));
        const r = 0.48 + n * 0.04 - k * 0.12;
        const g = 0.44 + n * 0.03 - k * 0.12;
        const b = 0.38 - k * 0.1;
        cols.push(r, g, b, 1);
        pos[i] += Math.sin(pos[i + 1] * 1.3 + pos[i + 2] * 0.4) * 0.55;
        pos[i + 2] += Math.cos(pos[i + 1] * 1.1 + pos[i] * 0.35) * 0.55;
      }
      bottom.updateVerticesData(BABYLON.VertexBuffer.PositionKind, pos);
      bottom.setVerticesData(BABYLON.VertexBuffer.ColorKind, cols);
      const norms = [];
      BABYLON.VertexData.ComputeNormals(pos, bottom.getIndices(), norms);
      bottom.updateVerticesData(BABYLON.VertexBuffer.NormalKind, norms);
      bottom.material = vertexColorMat("underMat");
      bottom.receiveShadows = true;
      shadowCasters.push(bottom);

      const hang = [];
      for (let i = 0; i < 28; i++) {
        const a = rng() * TAU;
        const rr = rnd(6, 26);
        const s = ico("stal" + i, rnd(0.7, 1.8), 2, mats.rockDark, root);
        s.position.set(Math.cos(a) * rr, rnd(-6, -16), Math.sin(a) * rr);
        s.scaling.set(rnd(0.6, 1.3), rnd(1.6, 3.4), rnd(0.6, 1.3));
        s.rotation.set(rnd(0, 0.4), rng() * TAU, rnd(0, 0.4));
        hang.push(s);
      }
      merge(hang, "stalactites");
    })();

    /* scattered cliff rocks on rim */
    (function rimRocks() {
      const parts = [];
      for (let i = 0; i < 55; i++) {
        const a = rng() * TAU;
        const rr = rnd(ISLE_R - 4.5, ISLE_R - 0.4);
        const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
        const s = ico("rim" + i, rnd(0.6, 1.7), 2, rng() > 0.5 ? mats.rock : mats.cliff, root);
        s.position.set(x, heightAt(x, z) + rnd(-0.4, 0.5), z);
        s.scaling.set(rnd(0.8, 2.1), rnd(0.5, 1.6), rnd(0.8, 2.0));
        s.rotation.set(rng() * 1, rng() * TAU, rng() * 1);
        parts.push(s);
      }

        path.push(new BABYLON.Vector3(p.x, heightAt(p.x, p.z) + 0.18, p.z));

      const river = BABYLON.MeshBuilder.CreateTube("river", {

      river.material = mats.water;

      for (let i = 0; i <= 36; i++) {
        const t = i / 36;
        const p = riverPoint(t);
        const nxt = riverPoint(Math.min(1, t + 0.02));
        const dx = nxt.x - p.x, dz = nxt.z - p.z;
        const len = Math.hypot(dx, dz) || 1;
        const nx = -dz / len, nz = dx / len;
        for (const side of [-1, 1]) {
          const bx = p.x + nx * side * 1.85;
          const bz = p.z + nz * side * 1.85;
          const pebble = ico("bank" + i + side, rnd(0.18, 0.42), 1, mats.dirt, root);

          pebble.scaling.y = rnd(0.4, 0.8);
          banks.push(pebble);

      merge(banks, "banks");

        const p = box("pad" + i, 0.12, 0.7, 0.38, mats.woodLight, hubN);
        const a = (i / 10) * TAU;
        p.position.set(0, Math.sin(a) * 1.15, Math.cos(a) * 1.15);
        p.rotation.x = a;
        paddles.push(p);
      }
      return hubN;
    })();

    /* bridges */
    (function bridges() {
      const spots = [0.38, 0.62];
      spots.forEach((t, bi) => {
        const p = riverPoint(t);
        const nxt = riverPoint(t + 0.03);
        const ang = Math.atan2(nxt.x - p.x, nxt.z - p.z);
        const n = new BABYLON.TransformNode("br" + bi, scene);
        n.parent = root;
        n.position.set(p.x, heightAt(p.x, p.z) + 0.42, p.z);
        n.rotation.y = ang + Math.PI / 2;
        for (let i = 0; i < 9; i++) {
          const plank = box("pl" + i, 3.2, 0.1, 0.32, i % 2 ? mats.wood : mats.woodLight, n);
          plank.position.set(0, 0, -1.4 + i * 0.35);
          woodParts.push(plank);
        }
        for (const side of [-1.45, 1.45]) {
          const rail = box("rail", 0.08, 0.12, 3.1, mats.woodDark, n);
          rail.position.set(side, 0.55, 0);
          woodParts.push(rail);
          for (let k = 0; k < 5; k++) {
            const post = cyl("rp", 0.6, 0.08, 0.08, 5, mats.woodDark, n);
            post.position.set(side, 0.3, -1.2 + k * 0.6);
            woodParts.push(post);
          }
        }
      });
    })();

    /* ruined watchtower */
    (function watchtower() {
      const x = -23.5, z = -17.5;
      const n = new BABYLON.TransformNode("ruin", scene);
      n.parent = root;
      n.position.set(x, heightAt(x, z) - 0.2, z);
      const base = cyl("rb", 1.2, 3.4, 3.8, 10, mats.stoneDark, n);
      base.position.y = 0.6;
      darkParts.push(base);
      const mid = cyl("rm", 4.6, 2.7, 3.1, 10, mats.stone, n);
      mid.position.y = 3.4;
      stoneParts.push(mid);
      const broken = cyl("rbr", 2.2, 1.4, 2.5, 9, mats.stone, n);
      broken.position.set(0.25, 6.7, -0.15);
      broken.rotation.z = 0.18;
      broken.rotation.x = -0.08;
      stoneParts.push(broken);
      for (let i = 0; i < 9; i++) {
        const chunk = ico("rc" + i, rnd(0.25, 0.7), 1, mats.rock, n);
        const a = rng() * TAU;
        chunk.position.set(Math.cos(a) * rnd(1.6, 3.4), rnd(0.1, 0.5), Math.sin(a) * rnd(1.6, 3.4));
        chunk.scaling.set(rnd(0.8, 1.6), rnd(0.5, 1.1), rnd(0.8, 1.5));
        darkParts.push(chunk);
      }
      const ivy = cone("ivy", 2.4, 1.8, 6, mats.moss, n);
      ivy.position.set(0.9, 2.2, 0.7);
      ivy.rotation.z = 0.7;
      const pole = cyl("flagpole", 2.4, 0.07, 0.07, 5, mats.iron, n);
      pole.position.set(-0.2, 8.4, 0);
      darkParts.push(pole);
      const tatter = box("tat", 0.7, 0.45, 0.04, mats.banner, n);
      tatter.position.set(0.2, 9.2, 0);
      tatter.rotation.z = 0.4;
    })();

    /* path stones from village to gate */
    (function path() {
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const t = i / 24;
        const x = Math.sin(t * 1.2) * 1.5;
        const z = 20 - t * 12.4;
        pts.push({ x, z });
      }
      const stones = [];
      pts.forEach((p, i) => {
        const s = box("ps" + i, rnd(0.55, 0.95), 0.08, rnd(0.4, 0.7), mats.path, root);
        s.position.set(p.x + rnd(-0.3, 0.3), heightAt(p.x, p.z) + 0.04, p.z + rnd(-0.15, 0.15));
        s.rotation.y = rng() * TAU;
        stones.push(s);
      });
      merge(stones, "path");
    })();

    /* fences */
    (function fences() {
      const segs = [];
      for (let i = 0; i < 14; i++) {
        const t = i / 13;
        const x = -16 + t * 10;
        const z = 22.5 + Math.sin(t * 4) * 0.4;
        const post = cyl("fp" + i, 0.85, 0.08, 0.1, 5, mats.woodDark, root);
        post.position.set(x, heightAt(x, z) + 0.4, z);
        segs.push(post);
        if (i < 13) {
          const rail = box("fr" + i, 0.85, 0.07, 0.06, mats.wood, root);
          rail.position.set(x + 0.4, heightAt(x, z) + 0.55, z);
          segs.push(rail);
        }
      }
      merge(segs, "fence");
    })();

    /* pine trees via thin instances */
    (function pines() {
      function makePineProto(tag, pineMat) {
        const trunk = cyl("trk" + tag, 1.5, 0.22, 0.32, 6, mats.bark);
        trunk.position.y = 0.75;
        const c1 = cone("c1" + tag, 2.4, 2.5, 7, pineMat);
        c1.position.y = 2.0;
        const c2 = cone("c2" + tag, 2.0, 1.9, 7, pineMat);
        c2.position.y = 3.15;
        const c3 = cone("c3" + tag, 1.6, 1.25, 7, pineMat);
        c3.position.y = 4.15;
        const proto = merge([trunk, c1, c2, c3], "pineProto" + tag);
        proto.isVisible = false;
        proto.setParent(root);
        return proto;
      }
      const protoA = makePineProto("A", mats.pine);
      const protoB = makePineProto("B", mats.pineDark);
      const protoC = makePineProto("C", mats.pineLite);

      const sites = [];
      for (let i = 0; i < 70; i++) {
        const a = rng() * TAU;
        const rr = rnd(10, ISLE_R - 3);
        const x = Math.cos(a) * rr;
        const z = Math.sin(a) * rr;
        if (riverDist(x, z) < 3.2) continue;
        if (Math.hypot(x - CX, z - CZ) < 13) continue;
        if (z > 12 && Math.abs(x) < 16) continue;
        if (Math.hypot(x + 23.5, z + 17.5) < 4) continue;
        sites.push({ x, z, s: rnd(0.75, 1.45), y: rng() * TAU, proto: i % 3 });
      }
      // extra grove north
      for (let i = 0; i < 18; i++) {
        const x = rnd(-18, 14);
        const z = rnd(-28, -12);
        if (Math.hypot(x, z) > ISLE_R - 3) continue;
        if (Math.hypot(x - CX, z - CZ) < 13) continue;
        sites.push({ x, z, s: rnd(0.9, 1.6), y: rng() * TAU, proto: i % 3 });
      }
      const groups = [[], [], []];
      sites.forEach((s) => groups[s.proto].push(s));
      [protoA, protoB, protoC].forEach((proto, gi) => {
        const buf = new Float32Array(groups[gi].length * 16);
        const tmp = BABYLON.Matrix.Identity();
        groups[gi].forEach((s, i) => {
          const y = heightAt(s.x, s.z);
          BABYLON.Matrix.ComposeToRef(
            new BABYLON.Vector3(s.s, s.s, s.s),
            BABYLON.Quaternion.FromEulerAngles(0, s.y, 0),
            new BABYLON.Vector3(s.x, y, s.z),
            tmp
          );
          tmp.copyToArray(buf, i * 16);
        });
        proto.thinInstanceSetBuffer("matrix", buf, 16, true);
        proto.isVisible = true;
        proto.thinInstanceEnablePicking = false;
        shadowCasters.push(proto);
      });
    })();

    /* bushes + flowers */
    (function flora() {
      const bushes = [];
      for (let i = 0; i < 40; i++) {
        const x = rnd(-22, 22), z = rnd(8, 24);
        if (riverDist(x, z) < 2.4) continue;
        if (Math.hypot(x, z) > ISLE_R - 4) continue;
        const b = ico("bush" + i, rnd(0.35, 0.7), 1, rng() > 0.5 ? mats.pine : mats.moss, root);
        b.position.set(x, heightAt(x, z) + 0.2, z);
        b.scaling.set(rnd(0.8, 1.5), rnd(0.5, 1.0), rnd(0.8, 1.5));
        bushes.push(b);
      }
      merge(bushes, "bushes");

      const blooms = [];
      const fmats = [mats.flowerR, mats.flowerY, mats.flowerP, mats.flowerW];
      for (let i = 0; i < 90; i++) {
        const x = rnd(-20, 18), z = rnd(10, 24);
        if (riverDist(x, z) < 2) continue;
        const f = sphere("fl" + i, rnd(0.08, 0.16), 4, fmats[i % 4], root);
        f.position.set(x, heightAt(x, z) + 0.12, z);
        blooms.push(f);
      }
      // don't merge mixed materials — group by mat
      fmats.forEach((m, mi) => {
        merge(blooms.filter((b) => b.material === m), "blooms" + mi);
      });
    })();

    /* floating satellite rocks */
    const floaters = [];
    (function satellites() {
      const defs = [
        { x: -38, y: 2, z: 10, s: 2.4 },
        { x: 36, y: -1, z: -8, s: 1.8 },
        { x: 22, y: 8, z: -34, s: 1.4 },
        { x: -18, y: 6, z: 36, s: 1.2 },
        { x: 40, y: 4, z: 16, s: 0.9 }
      ];
      defs.forEach((d, i) => {
        const n = new BABYLON.TransformNode("sat" + i, scene);
        const rock = ico("satR" + i, d.s, 2, mats.cliff, n);
        rock.scaling.set(1.2, 0.7, 1);
        const cap = ico("satG" + i, d.s * 0.85, 2, mats.grass, n);
        cap.position.y = d.s * 0.35;
        cap.scaling.set(1.05, 0.35, 0.9);
        if (i < 3) {
          const t = cone("satT" + i, 1.6, 1.3, 6, mats.pine, n);
          t.position.y = d.s * 0.5 + 0.9;
          t.scaling.set(0.7, 0.7, 0.7);
        }
        n.position.set(d.x, d.y, d.z);
        n.metadata = { base: d.y, phase: rng() * TAU, amp: rnd(0.25, 0.6) };
        floaters.push(n);
      });
    })();

    /* clouds */
    const clouds = [];
    (function makeClouds() {
      for (let i = 0; i < 8; i++) {
        const n = new BABYLON.TransformNode("cloud" + i, scene);
        const bits = irnd(3, 5);
        for (let k = 0; k < bits; k++) {
          const s = sphere("cb", rnd(3.5, 6.5), 6, mats.cloud, n);
          s.position.set(rnd(-4, 4), rnd(-0.6, 0.6), rnd(-2, 2));
          s.scaling.y = rnd(0.4, 0.7);
        }
        n.position.set(rnd(-70, 70), rnd(22, 38), rnd(-70, 70));
        n.metadata = { speed: rnd(0.15, 0.4) * (rng() > 0.5 ? 1 : -1) };
        clouds.push(n);
      }
    })();

    /* chimney smoke */
    function chimneySmoke(pos) {
      const ps = new BABYLON.ParticleSystem("smoke" + pos.x, 40, scene);
      ps.particleTexture = ptex;
      ps.emitter = pos;
      ps.minEmitBox = new BABYLON.Vector3(-0.05, 0, -0.05);
      ps.maxEmitBox = new BABYLON.Vector3(0.05, 0.1, 0.05);
      ps.color1 = new BABYLON.Color4(0.75, 0.75, 0.75, 0.25);
      ps.color2 = new BABYLON.Color4(0.55, 0.55, 0.55, 0.12);
      ps.colorDead = new BABYLON.Color4(0.6, 0.6, 0.6, 0);
      ps.minSize = 0.25;
      ps.maxSize = 0.8;
      ps.minLifeTime = 1.6;
      ps.maxLifeTime = 3.2;
      ps.emitRate = 10;
      ps.direction1 = new BABYLON.Vector3(-0.15, 1, -0.1);
      ps.direction2 = new BABYLON.Vector3(0.2, 1.2, 0.15);
      ps.minEmitPower = 0.3;
      ps.maxEmitPower = 0.6;
      ps.gravity = new BABYLON.Vector3(0.15, 0.05, 0);
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
      ps.start();
    }
    chimneySmoke(new BABYLON.Vector3(6.8, heightAt(6.2, 14.2) + 3.9, 14.2));
    chimneySmoke(new BABYLON.Vector3(-8.0, heightAt(-8.5, 17.5) + 3.2, 17.5));
    chimneySmoke(new BABYLON.Vector3(15.0, heightAt(15.4, 8.6) + 3.6, 8.6));

    /* merge leftover architectural groups that are still independent */
    function flattenMerge(arr, name) {
      const world = [];
      arr.forEach((m) => {
        if (!m || m.isDisposed()) return;
        m.computeWorldMatrix(true);
        world.push(m);
      });
      if (world.length < 2) return;
      const merged = BABYLON.Mesh.MergeMeshes(world, true, true, undefined, false, true);
      if (merged) {
        merged.name = name;
        merged.parent = root;
        merged.receiveShadows = true;
        shadowCasters.push(merged);
      }
    }
    flattenMerge(stoneParts, "stoneAll");
    flattenMerge(darkParts, "darkAll");
    flattenMerge(woodParts, "woodAll");
    flattenMerge(roofParts, "roofAll");
    flattenMerge(goldParts, "goldAll");
    flattenMerge(winParts, "winAll");

    /* shadows */
    const sg = new BABYLON.ShadowGenerator(1536, sun);
    sg.usePercentageCloserFiltering = true;
    sg.filteringQuality = BABYLON.ShadowGenerator.QUALITY_MEDIUM;
    sg.darkness = 0.35;
    sg.bias = 0.001;
    sg.normalBias = 0.02;
    shadowCasters.forEach((m) => {
      try { sg.addShadowCaster(m, true); } catch (e) {}
    });
    island.receiveShadows = true;

    /* water vertex animation */
    const waterPos0 = waterMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind).slice();
    const waterPos = waterMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);

    /* floating island bob */
    scene.registerBeforeRender(() => {
      const t = performance.now() * 0.001;
      root.position.y = Math.sin(t * 0.35) * 0.18;
      root.rotation.z = Math.sin(t * 0.22) * 0.008;
      root.rotation.x = Math.cos(t * 0.18) * 0.006;
      wheel.rotation.x = t * 1.4;
      floaters.forEach((f) => {
        f.position.y = f.metadata.base + Math.sin(t * 0.6 + f.metadata.phase) * f.metadata.amp;
        f.rotation.y = t * 0.08 + f.metadata.phase;
      });
      clouds.forEach((c) => {
        c.position.x += c.metadata.speed * scene.getEngine().getDeltaTime() * 0.01;
        if (c.position.x > 90) c.position.x = -90;
        if (c.position.x < -90) c.position.x = 90;
      });
      for (let i = 0; i < waterPos.length; i += 3) {
        const x = waterPos0[i], z = waterPos0[i + 2];
        waterPos[i + 1] = waterPos0[i + 1] + Math.sin(t * 2.2 + x * 1.3 + z * 0.9) * 0.07
          + Math.sin(t * 3.1 + x * 2.4) * 0.035;
      }
      waterMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, waterPos);
    });

    /* camera intro */
    camera.radius = 120;
    camera.alpha = -1.6;
    const intro = { r: 120 };
    scene.onBeforeRenderObservable.add(() => {
      if (intro.r > 78) {
        intro.r += (76 - intro.r) * 0.018;
        camera.radius = intro.r;
      }
    });

    scene.executeWhenReady(() => {
      document.getElementById("loader").classList.add("hide");
    });

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  })();
  </script>
</body>
</html>
