<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Floating Island Diorama</title>
<style>
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<!-- Babylon.js CDN -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

const createScene = () => {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color3(0.85, 0.92, 1);

  // Camera
  const camera = new BABYLON.ArcRotateCamera("cam",
    Math.PI/4, Math.PI/3, 60,
    new BABYLON.Vector3(0, 5, 0),
    scene
  );
  camera.attachControl(canvas, true);

  // Lighting
  const light = new BABYLON.HemisphericLight("light",
    new BABYLON.Vector3(1, 1, 0), scene);
  light.intensity = 0.9;

  const sun = new BABYLON.DirectionalLight("sun",
    new BABYLON.Vector3(-1, -2, -1), scene);
  sun.position = new BABYLON.Vector3(20, 40, 20);

  // Materials
  const grassMat = new BABYLON.StandardMaterial("grass", scene);
  grassMat.diffuseColor = new BABYLON.Color3(0.3, 0.8, 0.4);

  const rockMat = new BABYLON.StandardMaterial("rock", scene);
  rockMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.55);

  const woodMat = new BABYLON.StandardMaterial("wood", scene);
  woodMat.diffuseColor = new BABYLON.Color3(0.5, 0.3, 0.15);

  const waterMat = new BABYLON.StandardMaterial("water", scene);
  waterMat.diffuseColor = new BABYLON.Color3(0.2, 0.7, 0.8);
  waterMat.alpha = 0.8;

  const stoneMat = new BABYLON.StandardMaterial("stone", scene);
  stoneMat.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.75);

  // FLOATING ISLAND BASE
  const island = BABYLON.MeshBuilder.CreateCylinder("island", {
    diameterTop: 30,
    diameterBottom: 10,
    height: 12,
    tessellation: 32
  }, scene);
  island.position.y = -6;
  island.material = rockMat;

  const top = BABYLON.MeshBuilder.CreateDisc("top", {
    radius: 15,
    tessellation: 64
  }, scene);
  top.rotation.x = Math.PI/2;
  top.position.y = 0;
  top.material = grassMat;

  // CLIFF DETAILS
  for (let i = 0; i < 30; i++) {
    const rock = BABYLON.MeshBuilder.CreateSphere("r"+i, {
      diameter: Math.random()*2 + 1
    }, scene);
    rock.position = new BABYLON.Vector3(
      (Math.random()-0.5)*20,
      -Math.random()*6,
      (Math.random()-0.5)*20
    );
    rock.material = rockMat;
  }

  // CASTLE
  const keep = BABYLON.MeshBuilder.CreateBox("keep", {
    width: 6, depth: 6, height: 8
  }, scene);
  keep.position.y = 4;
  keep.material = stoneMat;

  for (let i = 0; i < 4; i++) {
    const tower = BABYLON.MeshBuilder.CreateCylinder("tower", {
      diameter: 3,
      height: 10
    }, scene);
    tower.position = new BABYLON.Vector3(
      (i<2?-4:4),
      5,
      (i%2?-4:4)
    );
    tower.material = stoneMat;
  }

  // VILLAGE HOUSES
  for (let i = 0; i < 12; i++) {
    const house = BABYLON.MeshBuilder.CreateBox("house", {
      width: 2, depth: 2, height: 2
    }, scene);
    house.position = new BABYLON.Vector3(
      (Math.random()-0.5)*20,
      1,
      (Math.random()-0.5)*20
    );
    house.material = woodMat;

    const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {
      diameterTop: 0,
      diameterBottom: 2.5,
      height: 2,
      tessellation: 4
    }, scene);
    roof.position = house.position.add(new BABYLON.Vector3(0,1.5,0));
    roof.rotation.y = Math.PI/4;
    roof.material = new BABYLON.StandardMaterial("roofMat", scene);
    roof.material.diffuseColor = new BABYLON.Color3(0.6,0.1,0.1);
  }

  // TREES
  for (let i = 0; i < 40; i++) {
    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
      diameter: 0.3, height: 2
    }, scene);
    trunk.position = new BABYLON.Vector3(
      (Math.random()-0.5)*25,
      1,
      (Math.random()-0.5)*25
    );
    trunk.material = woodMat;

    const leaves = BABYLON.MeshBuilder.CreateSphere("leaves", {
      diameter: 2
    }, scene);
    leaves.position = trunk.position.add(new BABYLON.Vector3(0,1.5,0));
    leaves.material = new BABYLON.StandardMaterial("leaf", scene);
    leaves.material.diffuseColor = new BABYLON.Color3(0.2,0.6,0.3);
  }

  // RIVER
  const river = BABYLON.MeshBuilder.CreateGround("river", {
    width: 4, height: 20
  }, scene);
  river.position.y = 0.1;
  river.material = waterMat;

  // BRIDGES
  for (let i = 0; i < 3; i++) {
    const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {
      width: 5, height: 0.3, depth: 1
    }, scene);
    bridge.position = new BABYLON.Vector3(0, 1, i*6-6);
    bridge.material = woodMat;
  }

  // WATERFALL
  const waterfall = BABYLON.MeshBuilder.CreatePlane("waterfall", {
    width: 4, height: 6
  }, scene);
  waterfall.position = new BABYLON.Vector3(0, -2, -10);
  waterfall.rotation.y = Math.PI;
  waterfall.material = waterMat;

  // WINDMILL (riverside mill)
  const mill = BABYLON.MeshBuilder.CreateCylinder("mill", {
    diameter: 3, height: 4
  }, scene);
  mill.position = new BABYLON.Vector3(-6, 2, 6);
  mill.material = stoneMat;

  const blade = BABYLON.MeshBuilder.CreateBox("blade", {
    width: 0.2, height: 4, depth: 0.5
  }, scene);
  blade.parent = mill;
  blade.position = new BABYLON.Vector3(0,2,2);

  scene.registerBeforeRender(()=>{
    blade.rotation.z += 0.05;
  });

  // RUINED WATCHTOWER
  const ruin = BABYLON.MeshBuilder.CreateCylinder("ruin", {
    diameter: 3, height: 6
  }, scene);
  ruin.position = new BABYLON.Vector3(10, 3, -10);
  ruin.material = stoneMat;

  return scene;
};

const scene = createScene();

engine.runRenderLoop(()=>{
  scene.render();
});

window.addEventListener("resize", ()=>{
  engine.resize();
});
</script>
</body>
</html>
