<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  #renderCanvas { width: 100vw; height: 100vh; display: block; }
  #ui { position: absolute; top: 20px; left: 20px; z-index: 10; color: #fff; font-size: 14px; text-shadow: 1px 1px 2px #000; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; font-size: 24px; color: #4a90d9; background: rgba(0,0,20,0.9); padding: 30px 50px; border-radius: 12px; border: 2px solid #4a90d9; }
</style>
</head>
<body>
<div id="loading">Loading Floating Island Diorama...</div>
<canvas id="renderCanvas"></canvas>
<div id="ui">Floating Island Diorama • Medieval Castle & Village</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
let canvas, engine, scene, camera;

function init() {
  canvas = document.getElementById("renderCanvas");
  engine = new BABYLON.Engine(canvas, true);
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.5, 0.7, 0.95, 1);

  // Camera
  camera = new BABYLON.ArcRotateCamera("cam", 0.5, 0.8, 120, new BABYLON.Vector3(0, 10, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 40;
  camera.upperRadiusLimit = 200;
  camera.lowerAlphaLimit = 0.2;
  camera.upperAlphaLimit = Math.PI - 0.2;

  // Lighting
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.8;
  hemi.specular = new BABYLON.Color3(0.1, 0.1, 0.2);
  hemi.groundColor = new BABYLON.Color3(0.3, 0.4, 0.5);

  const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), scene);
  sun.intensity = 0.9;
  sun.shadowsEnabled = true;

  const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
  shadowGen.useBlurCloseFilter = true;

  // Ground / floating island base
  createIsland(shadowGen);

  // Castle
  createCastle(shadowGen);

  // Village
  createVillage(shadowGen);

  // River & waterfalls
  createRiver(shadowGen);

  // Trees & vegetation
  createVegetation(shadowGen);

  // Ruined watchtower
  createWatchtower(shadowGen);

  // Sky
  createSky();

  // Hide loading
  document.getElementById("loading").style.display = "none";

  engine.runRenderLoop(() => {
    scene.render();
  });

  window.addEventListener("resize", () => engine.resize());
}

function createIsland(shadowGen) {
  // Main floating island - large ellipse with cliffs
  const islandMat = new BABYLON.StandardMaterial("islandMat", scene);
  islandMat.diffuseColor = new BABYLON.Color3(0.4, 0.7, 0.3);
  islandMat.emissiveColor = new BABYLON.Color3(0.1, 0.2, 0.1);
  islandMat.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/ground_bump.png", scene);
  islandMat.bumpLevel = 0.5;

  const islandShape = BABYLON.Curve3.CreateHermiteSpline(
    [new BABYLON.Vector3(0, 0, 0), new BABYLON.Vector3(0, 0, 0)],
    [new BABYLON.Vector3(50, 0, 0), new BABYLON.Vector3(0, 0, 0)],
    50
  );

  // Use a large disc with displacement
  const island = BABYLON.MeshBuilder.CreateDisc("island", { radius: 60, tessellation: 64 }, scene);
  island.rotation.x = Math.PI / 2;
  island.position.y = -5;
  island.scaling = new BABYLON.Vector3(1, 1, 0.7);
  island.material = islandMat;
  shadowGen.addShadowCaster(island);
  island.receiveShadows = true;

  // Cliff edges - use multiple cylinders with rock texture
  const rockMat = new BABYLON.StandardMaterial("rockMat", scene);
  rockMat.diffuseColor = new BABYLON.Color3(0.6, 0.55, 0.5);
  rockMat.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/rock_bump.png", scene);
  rockMat.bumpLevel = 0.3;

  // Create cliff ring
  for (let i = 0; i < 32; i++) {
    const angle = (i / 32) * Math.PI * 2;
    const cx = Math.cos(angle) * 55;
    const cz = Math.sin(angle) * 55;
    const cliff = BABYLON.MeshBuilder.CreateCylinder("cliff", {
      height: 15,
      diameterTop: 8,
      diameterBottom: 12,
      tessellation: 6
    }, scene);
    cliff.position.set(cx, -5, cz);
    cliff.rotation.y = angle;
    cliff.material = rockMat;
    shadowGen.addShadowCaster(cliff);
  }

  // Grass patches
  const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
  grassMat.diffuseColor = new BABYLON.Color3(0.3, 0.7, 0.25);
  grassMat.emissiveColor = new BABYLON.Color3(0.05, 0.15, 0.05);

  for (let i = 0; i < 50; i++) {
    const patch = BABYLON.MeshBuilder.CreateDisc("grass", { radius: 3 + Math.random() * 2, tessellation: 8 }, scene);
    patch.rotation.x = -Math.PI / 2;
    patch.position.set(
      (Math.random() - 0.5) * 100,
      -3 + Math.random() * 2,
      (Math.random() - 0.5) * 100
    );
    patch.material = grassMat;
  }
}

function createCastle(shadowGen) {
  const stoneMat = new BABYLON.StandardMaterial("stoneMat", scene);
  stoneMat.diffuseColor = new BABYLON.Color3(0.85, 0.85, 0.85);
  stoneMat.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/stone_bump.png", scene);
  stoneMat.bumpLevel = 0.2;
  stoneMat.specularColor = new BABYLON.Color3(0.9, 0.9, 0.9);

  const roofMat = new BABYLON.StandardMaterial("roofMat", scene);
  roofMat.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.1);
  roofMat.emissiveColor = new BABYLON.Color3(0.2, 0.05, 0.02);

  // Main keep
  const keep = BABYLON.MeshBuilder.CreateBox("keep", { size: 20 }, scene);
  keep.position.y = 5;
  keep.material = stoneMat;
  shadowGen.addShadowCaster(keep);

  // Towers
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2;
    const tower = BABYLON.MeshBuilder.CreateCylinder("tower", {
      height: 30,
      diameter: 10,
      tessellation: 16
    }, scene);
    tower.position.set(
      Math.cos(angle) * 18,
      15,
      Math.sin(angle) * 18
    );
    tower.material = stoneMat;
    shadowGen.addShadowCaster(tower);

    // Tower roofs
    const roof = BABYLON.MeshBuilder.CreateCylinder("towerRoof", {
      height: 8,
      diameterTop: 0,
      diameterBottom: 12,
      tessellation: 16
    }, scene);
    roof.position.y = 26;
    roof.material = roofMat;
    shadowGen.addShadowCaster(roof);
  }

  // Main roof
  const mainRoof = BABYLON.MeshBuilder.CreateCylinder("mainRoof", {
    height: 12,
    diameterTop: 0,
    diameterBottom: 25,
    tessellation: 8
  }, scene);
  mainRoof.position.y = 16;
  mainRoof.material = roofMat;
  shadowGen.addShadowCaster(mainRoof);

  // Battlements
  for (let i = 0; i < 8; i++) {
    const battlement = BABYLON.MeshBuilder.CreateBox("battlement", { size: 3 }, scene);
    battlement.position.set(
      Math.cos(i / 8 * Math.PI * 2) * 16,
      22,
      Math.sin(i / 8 * Math.PI * 2) * 16
    );
    battlement.material = stoneMat;
    shadowGen.addShadowCaster(battlement);
  }

  // Bridge to castle
  const bridgeMat = new BABYLON.StandardMaterial("bridgeMat", scene);
  bridgeMat.diffuseColor = new BABYLON.Color3(0.5, 0.3, 0.15);

  const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 3, height: 1, depth: 20 }, scene);
  bridge.position.set(0, 0, -25);
  bridge.material = bridgeMat;
  shadowGen.addShadowCaster(bridge);
}

function createVillage(shadowGen) {
  const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
  woodMat.diffuseColor = new BABYLON.Color3(0.6, 0.35, 0.15);
  woodMat.emissiveColor = new BABYLON.Color3(0.1, 0.05, 0.02);

  const thatchMat = new BABYLON.StandardMaterial("thatchMat", scene);
  thatchMat.diffuseColor = new BABYLON.Color3(0.8, 0.7, 0.3);
  thatchMat.emissiveColor = new BABYLON.Color3(0.2, 0.15, 0.05);

  // Houses
  const housePositions = [
    { pos: new BABYLON.Vector3(-35, 0, 10), size: 8 },
    { pos: new BABYLON.Vector3(-30, 0, 20), size: 6 },
    { pos: new BABYLON.Vector3(-40, 0, 25), size: 7 },
    { pos: new BABYLON.Vector3(35, 0, -15), size: 8 },
    { pos: new BABYLON.Vector3(30, 0, -25), size: 6 },
    { pos: new BABYLON.Vector3(40, 0, -20), size: 7 },
    { pos: new BABYLON.Vector3(15, 0, 35), size: 6 },
    { pos: new BABYLON.Vector3(20, 0, 40), size: 7 },
    { pos: new BABYLON.Vector3(-15, 0, -35), size: 8 },
    { pos: new BABYLON.Vector3(-20, 0, -40), size: 6 },
  ];

  for (const hp of housePositions) {
    const house = BABYLON.MeshBuilder.CreateBox("house", { size: hp.size }, scene);
    house.position = hp.pos;
    house.material = woodMat;
    shadowGen.addShadowCaster(house);

    // Roof
    const roof = BABYLON.MeshBuilder.CreateCylinder("houseRoof", {
      height: hp.size * 0.8,
      diameterTop: 0,
      diameterBottom: hp.size * 1.4,
      tessellation: 4
    }, scene);
    roof.position.y = hp.size * 0.9;
    roof.rotation.y = Math.PI / 4;
    roof.position.x += hp.pos.x;
    roof.position.z += hp.pos.z;
    roof.material = thatchMat;
    shadowGen.addShadowCaster(roof);
  }

  // Tavern (larger building)
  const tavern = BABYLON.MeshBuilder.CreateBox("tavern", { width: 12, height: 10, depth: 12 }, scene);
  tavern.position.set(-50, 5, 30);
  tavern.material = woodMat;
  shadowGen.addShadowCaster(tavern);

  const tavernRoof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", {
    height: 10,
    diameterTop: 0,
    diameterBottom: 18,
    tessellation: 6
  }, scene);
  tavernRoof.position.set(-50, 15, 30);
  tavernRoof.material = thatchMat;
  shadowGen.addShadowCaster(tavernRoof);

  // Market stalls
  const stallMat = new BABYLON.StandardMaterial("stallMat", scene);
  stallMat.diffuseColor = new BABYLON.Color3(0.8, 0.5, 0.2);

  for (let i = 0; i < 6; i++) {
    const stall = BABYLON.MeshBuilder.CreateBox("stall", { width: 4, height: 3, depth: 3 }, scene);
    stall.position.set(
      -45 + i * 5,
      1.5,
      10
    );
    stall.material = stallMat;
    shadowGen.addShadowCaster(stall);

    // Canopy
    const canopy = BABYLON.MeshBuilder.CreatePlane("canopy", { width: 5, height: 3 }, scene);
    canopy.position.set(stall.position.x, 4, stall.position.z);
    canopy.rotation.x = Math.PI / 2;
    canopy.material = thatchMat;
  }

  // Riverside mill
  const mill = BABYLON.MeshBuilder.CreateBox("mill", { width: 10, height: 12, depth: 8 }, scene);
  mill.position.set(25, 2, -45);
  mill.material = woodMat;
  shadowGen.addShadowCaster(mill);

  // Mill wheel
  const wheel = BABYLON.MeshBuilder.CreateCylinder("wheel", {
    height: 2,
    diameter: 12,
    tessellation: 16
  }, scene);
  wheel.position.set(25, 8, -45);
  wheel.rotation.z = Math.PI / 2;
  wheel.material = woodMat;
  shadowGen.addShadowCaster(wheel);

  // Mill wheel spokes
  for (let i = 0; i < 8; i++) {
    const spoke = BABYLON.MeshBuilder.CreateBox("spoke", { width: 1, height: 1, depth: 12 }, scene);
    spoke.position.set(25, 8, -45);
    spoke.rotation.z = (i / 8) * Math.PI * 2;
    spoke.material = woodMat;
  }

  // Mill roof
  const millRoof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {
    height: 8,
    diameterTop: 0,
    diameterBottom: 14,
    tessellation: 6
  }, scene);
  millRoof.position.set(25, 16, -45);
  millRoof.material = roofMat;
  shadowGen.addShadowCaster(millRoof);
}

function createRiver(shadowGen) {
  const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
  waterMat.diffuseColor = new BABYLON.Color3(0.1, 0.5, 0.9);
  waterMat.emissiveColor = new BABYLON.Color3(0.2, 0.6, 1.0);
  waterMat.alpha = 0.7;
  waterMat.specularColor = new BABYLON.Color3(0.8, 0.9, 1.0);
  waterMat.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/waterbump.png", scene);
  waterMat.bumpLevel = 0.1;

  // Main river
  const river = BABYLON.MeshBuilder.CreateGround("river", { width: 20, height: 120, subdivisions: 1 }, scene);
  river.position.set(0, -2, 0);
  river.rotation.x = Math.PI / 2;
  river.material = waterMat;

  // Waterfall
  const waterfall = BABYLON.MeshBuilder.CreateGround("waterfall", { width: 30, height: 40, subdivisions: 1 }, scene);
  waterfall.position.set(0, 5, 40);
  waterfall.rotation.x = Math.PI / 2;
  waterfall.material = waterMat;

  // Water splash particles at base of waterfall
  const splash = new BABYLON.ParticleSystem("splash", 500, scene);
  splash.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
  splash.emitter = new BABYLON.Vector3(0, -5, 40);
  splash.minEmitBox = new BABYLON.Vector3(-5, 0, -5);
  splash.maxEmitBox = new BABYLON.Vector3(5, 0, 5);
  splash.color1 = new BABYLON.Color4(0.5, 0.7, 1.0, 0.8);
  splash.color2 = new BABYLON.Color4(0.3, 0.5, 0.8, 0.5);
  splash.colorDead = new BABYLON.Color4(0.1, 0.3, 0.6, 0);
  splash.minSize = 0.5;
  splash.maxSize = 2;
  splash.minLifeTime = 0.5;
  splash.maxLifeTime = 1.5;
  splash.emitRate = 200;
  splash.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  splash.direction1 = new BABYLON.Vector3(-2, -5, -2);
  splash.direction2 = new BABYLON.Vector3(2, -5, 2);
  splash.minEmitPower = 2;
  splash.maxEmitPower = 5;
  splash.updateSpeed = 0.02;
  splash.start();

  // Bridges
  const bridgeMat = new BABYLON.StandardMaterial("bridgeMat2", scene);
  bridgeMat.diffuseColor = new BABYLON.Color3(0.5, 0.3, 0.15);

  for (let i = 0; i < 3; i++) {
    const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 8, height: 1, depth: 2 }, scene);
    bridge.position.set(i * 15 - 15, -1, 10);
    bridge.material = bridgeMat;
    shadowGen.addShadowCaster(bridge);
  }
}

function createVegetation(shadowGen) {
  // Pine trees
  const pineNeedleMat = new BABYLON.StandardMaterial("pineNeedleMat", scene);
  pineNeedleMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2);
  pineNeedleMat.emissiveColor = new BABYLON.Color3(0.05, 0.15, 0.05);

  const trunkMat = new BABYLON.StandardMaterial("trunkMat", scene);
  trunkMat.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);

  for (let i = 0; i < 30; i++) {
    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
      height: 3 + Math.random() * 2,
      diameter: 1 + Math.random() * 0.5
    }, scene);
    trunk.position.set(
      (Math.random() - 0.5) * 140,
      -2,
      (Math.random() - 0.5) * 140
    );
    trunk.material = trunkMat;
    shadowGen.addShadowCaster(trunk);

    // Pine layers
    for (let j = 0; j < 4; j++) {
      const layer = BABYLON.MeshBuilder.CreateSphere("pineLayer", {
        diameter: 8 - j * 2,
        segments: 8
      }, scene);
      layer.position.set(trunk.position.x, trunk.position.y + 1 + j * 2, trunk.position.z);
      layer.material = pineNeedleMat;
      shadowGen.addShadowCaster(layer);
    }
  }

  // Flower patches
  const flowerMat = new BABYLON.StandardMaterial("flowerMat", scene);
  flowerMat.diffuseColor = new BABYLON.Color3(0.9, 0.3, 0.5);
  flowerMat.emissiveColor = new BABYLON.Color3(0.2, 0.05, 0.1);

  for (let i = 0; i < 40; i++) {
    const flower = BABYLON.MeshBuilder.CreateSphere("flower", { diameter: 1, segments: 6 }, scene);
    flower.position.set(
      (Math.random() - 0.5) * 120,
      -2,
      (Math.random() - 0.5) * 120
    );
    flower.material = flowerMat;
  }
}

function createWatchtower(shadowGen) {
  const stoneMat = new BABYLON.StandardMaterial("watchtowerStone", scene);
  stoneMat.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.7);

  // Base
  const base = BABYLON.MeshBuilder.CreateBox("wtBase", { width: 6, height: 10, depth: 6 }, scene);
  base.position.set(55, 0, 55);
  base.material = stoneMat;
  shadowGen.addShadowCaster(base);

  // Ruined top
  const ruin1 = BABYLON.MeshBuilder.CreateBox("wtRuin1", { width: 4, height: 3, depth: 4 }, scene);
  ruin1.position.set(55, 8, 55);
  ruin1.material = stoneMat;
  shadowGen.addShadowCaster(ruin1);

  const ruin2 = BABYLON.MeshBuilder.CreateBox("wtRuin2", { width: 3, height: 2, depth: 3 }, scene);
  ruin2.position.set(58, 11, 55);
  ruin2.rotation.y = 0.3;
  ruin2.material = stoneMat;
  shadowGen.addShadowCaster(ruin2);

  // Chain hanging from tower
  const chainMat = new BABYLON.StandardMaterial("chainMat", scene);
  chainMat.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.6);

  for (let i = 0; i < 5; i++) {
    const link = BABYLON.MeshBuilder.CreateTorus("chainLink", { diameter: 1.5, tubeSize: 0.3 }, scene);
    link.position.set(55, 7 - i * 1.5, 55);
    link.rotation.x = Math.PI / 2;
    link.material = chainMat;
  }
}

function createSky() {
  const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
  skyMat.diffuseColor = new BABYLON.Color3(0.4, 0.6, 0.9);
  skyMat.emissiveColor = new BABYLON.Color3(0.1, 0.2, 0.4);
  skyMat.backFaceCulling = false;

  const sky = BABYLON.MeshBuilder.CreateSphere("sky", { diameter: 900, segments: 32 }, scene);
  sky.material = skyMat;
  sky.scaling = new BABYLON.Vector3(1, 0.5, 1);
}

window.addEventListener("load", init);
</script>
</body>
</html>
