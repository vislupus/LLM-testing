<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 16px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            max-width: 300px;
        }
        #info h3 { margin-bottom: 6px; font-weight: 600; }
        #info p { font-size: 12px; opacity: 0.9; line-height: 1.4; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="info">
        <h3>Medieval Floating Island</h3>
        <p>🖱️ Drag to rotate • Scroll to zoom • Shift+drag to pan</p>
    </div>

    <script>
        // ============================================
        // MEDIEVAL FLOATING ISLAND DIORAMA
        // Built with Babylon.js
        // ============================================

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, {
            preserveDrawingBuffer: true,
            stencil: true,
            antialias: true
        }, true);

        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.62, 0.80, 0.92, 1); // Soft sky blue
        scene.imageProcessingConfiguration.contrast = 1.15;
        scene.imageProcessingConfiguration.exposure = 1.05;

        // Camera setup
        const camera = new BABYLON.ArcRotateCamera("Camera",
            -Math.PI / 2.2, Math.PI / 3.2, 380,
            new BABYLON.Vector3(0, -20, 0), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 100;
        camera.upperRadiusLimit = 800;
        camera.wheelPrecision = 2;
        camera.panningSensibility = 800;
        camera.minZ = 0.1;
        camera.useBouncingBehavior = false;
        camera.useAutoRotationBehavior = true;
        camera.autoRotationBehavior.idleRotationSpeed = 0.15;
        camera.autoRotationBehavior.idleRotationWaitTime = 4000;
        camera.autoRotationBehavior.idleRotationSpinupTime = 3000;

        // Lighting
        const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.55;
        hemiLight.diffuse = new BABYLON.Color3(1, 0.96, 0.88);
        hemiLight.groundColor = new BABYLON.Color3(0.45, 0.65, 0.5);
        hemiLight.specular = new BABYLON.Color3(0.2, 0.2, 0.2);

        const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -3, 2.5), scene);
        dirLight.position = new BABYLON.Vector3(120, 180, -80);
        dirLight.intensity = 0.85;
        dirLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
        dirLight.specular = new BABYLON.Color3(0.4, 0.4, 0.4);

        // Shadow generator
        const shadow = new BABYLON.ShadowGenerator(2048, dirLight);
        shadow.useBlurExponentialShadowMap = true;
        shadow.blurScale = 2;
        shadow.blurKernel = 16;
        shadow.darkness = 0.65;

        // ============================================
        // MATERIALS
        // ============================================
        function createMaterials(scene) {
            const mats = {};

            // Stone (castle)
            mats.stone = new BABYLON.StandardMaterial("stone", scene);
            mats.stone.diffuseColor = new BABYLON.Color3(0.65, 0.62, 0.58);
            mats.stone.specularColor = new BABYLON.Color3(0.1, 0.1, 0.09);
            mats.stone.specularPower = 32;
            mats.stone.ambientColor = new BABYLON.Color3(0.5, 0.48, 0.45);

            // Dark stone (watchtower ruins)
            mats.darkStone = new BABYLON.StandardMaterial("darkStone", scene);
            mats.darkStone.diffuseColor = new BABYLON.Color3(0.45, 0.43, 0.40);
            mats.darkStone.specularColor = new BABYLON.Color3(0.06, 0.06, 0.06);
            mats.darkStone.specularPower = 24;

            // Wood (houses)
            mats.wood = new BABYLON.StandardMaterial("wood", scene);
            mats.wood.diffuseColor = new BABYLON.Color3(0.55, 0.35, 0.2);
            mats.wood.specularColor = new BABYLON.Color3(0.1, 0.06, 0.03);
            mats.wood.specularPower = 16;

            // Dark wood (tavern, mill)
            mats.darkWood = new BABYLON.StandardMaterial("darkWood", scene);
            mats.darkWood.diffuseColor = new BABYLON.Color3(0.4, 0.22, 0.1);
            mats.darkWood.specularColor = new BABYLON.Color3(0.06, 0.03, 0.02);
            mats.darkWood.specularPower = 12;

            // Roof colors
            mats.roofRed = new BABYLON.StandardMaterial("roofRed", scene);
            mats.roofRed.diffuseColor = new BABYLON.Color3(0.75, 0.25, 0.15);
            mats.roofRed.specularColor = new BABYLON.Color3(0.05, 0.02, 0.01);
            mats.roofRed.specularPower = 20;

            mats.roofBlue = new BABYLON.StandardMaterial("roofBlue", scene);
            mats.roofBlue.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.55);
            mats.roofBlue.specularColor = new BABYLON.Color3(0.05, 0.06, 0.1);
            mats.roofBlue.specularPower = 20;

            mats.roofGreen = new BABYLON.StandardMaterial("roofGreen", scene);
            mats.roofGreen.diffuseColor = new BABYLON.Color3(0.25, 0.5, 0.2);
            mats.roofGreen.specularColor = new BABYLON.Color3(0.03, 0.06, 0.02);
            mats.roofGreen.specularPower = 20;

            // Grass
            mats.grass = new BABYLON.StandardMaterial("grass", scene);
            mats.grass.diffuseColor = new BABYLON.Color3(0.35, 0.65, 0.25);
            mats.grass.specularColor = new BABYLON.Color3(0.02, 0.04, 0.01);
            mats.grass.specularPower = 8;

            // Dirt (cliff sides)
            mats.dirt = new BABYLON.StandardMaterial("dirt", scene);
            mats.dirt.diffuseColor = new BABYLON.Color3(0.48, 0.36, 0.24);
            mats.dirt.specularColor = new BABYLON.Color3(0.03, 0.02, 0.01);
            mats.dirt.specularPower = 10;

            // Rock (cliff bases)
            mats.rock = new BABYLON.StandardMaterial("rock", scene);
            mats.rock.diffuseColor = new BABYLON.Color3(0.40, 0.38, 0.35);
            mats.rock.specularColor = new BABYLON.Color3(0.04, 0.04, 0.04);
            mats.rock.specularPower = 14;

            // Water (river)
            mats.water = new BABYLON.StandardMaterial("water", scene);
            mats.water.diffuseColor = new BABYLON.Color3(0.25, 0.6, 0.75);
            mats.water.specularColor = new BABYLON.Color3(0.3, 0.35, 0.3);
            mats.water.specularPower = 48;
            mats.water.alpha = 0.78;
            mats.water.ambientColor = new BABYLON.Color3(0.2, 0.4, 0.5);

            // Waterfall
            mats.waterfall = new BABYLON.StandardMaterial("waterfall", scene);
            mats.waterfall.diffuseColor = new BABYLON.Color3(0.45, 0.75, 0.85);
            mats.waterfall.emissiveColor = new BABYLON.Color3(0.15, 0.25, 0.25);
            mats.waterfall.alpha = 0.65;

            // Market canopy
            mats.canopy1 = new BABYLON.StandardMaterial("canopy1", scene);
            mats.canopy1.diffuseColor = new BABYLON.Color3(0.8, 0.4, 0.2);
            mats.canopy1.specularColor = new BABYLON.Color3(0.06, 0.03, 0.02);

            mats.canopy2 = new BABYLON.StandardMaterial("canopy2", scene);
            mats.canopy2.diffuseColor = new BABYLON.Color3(0.85, 0.2, 0.25);
            mats.canopy2.specularColor = new BABYLON.Color3(0.07, 0.02, 0.02);

            mats.canopy3 = new BABYLON.StandardMaterial("canopy3", scene);
            mats.canopy3.diffuseColor = new BABYLON.Color3(0.2, 0.55, 0.7);
            mats.canopy3.specularColor = new BABYLON.Color3(0.03, 0.06, 0.07);

            return mats;
        }

        const materials = createMaterials(scene);

        // ============================================
        // UTILITY: Add mesh to shadow
        // ============================================
        function meshWithShadow(mesh, shadowGenerator) {
            shadowGenerator.addShadowCaster(mesh);
            mesh.receiveShadows = true;
            if (mesh.material) {
                mesh.material.ambientColor = new BABYLON.Color3(1, 1, 1);
            }
            return mesh;
        }

        // ============================================
        // ISLAND BASE
        // ============================================
        function createIsland(scene) {
            const islandGroup = new BABYLON.TransformNode("island", scene);

            // Main island body - cylinder with displacement for rocky look
            const islandRadius = 95;
            const islandHeight = 55;
            const islandTessellation = 80;
            const island = BABYLON.MeshBuilder.CreateCylinder("islandBody", {
                height: islandHeight,
                diameterTop: islandRadius * 2.2,
                diameterBottom: islandRadius * 2.8,
                tessellation: islandTessellation
            }, scene);

            // Add noise displacement for rocky appearance
            const positions = island.getVerticesData(BABYLON.VertexBuffer.PositionVertex);
            const normals = island.getVerticesData(BABYLON.VertexBuffer.NormalVertex);
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                const z = positions[i + 2];
                const dist = Math.sqrt(x * x + z * z);
                const angle = Math.atan2(z, x);

                // Create rocky cliff edges
                let displacement = 0;
                const noiseScale = 0.15;
                const ridgeFreq = 5;
                const ridgeHeight = 6 * Math.max(0, (dist - islandRadius * 0.6) / islandRadius);
                const baseNoise = Math.sin(angle * ridgeFreq + dist * noiseScale) * 3 +
                                  Math.cos(angle * ridgeFreq * 2.3 + dist * noiseScale * 1.5) * 2 +
                                  Math.sin(angle * ridgeFreq * 0.7 + dist * noiseScale * 0.8) * 4;

                if (dist > islandRadius * 0.65) {
                    // Cliff area - more aggressive displacement
                    displacement = ridgeHeight + baseNoise * 2.5;
                    // Taper bottom outward
                    if (y < 0) {
                        const taper = 1 + (Math.abs(y) / islandHeight) * 0.7;
                        displacement *= taper;
                    }
                }

                // Add some random roughness everywhere
                const rough = Math.sin(angle * 12 + dist * 0.3) * 1.2 +
                              Math.cos(angle * 18 + dist * 0.5) * 0.8;
                displacement += rough * 0.8;

                if (displacement !== 0) {
                    positions[i] += normals[i] * displacement;
                    positions[i + 1] += normals[i + 1] * displacement * 0.7;
                    positions[i + 2] += normals[i + 2] * displacement;
                }
            }

            island.updateVerticesData(BABYLON.VertexBuffer.PositionVertex, positions);
            island.createNormals(true);
            island.convertToFlatShadedMesh();

            // Layer the island with different materials for top and bottom
            // Top part: grass
            const islandTop = BABYLON.MeshBuilder.CreateCylinder("islandTop", {
                height: 12,
                diameter: islandRadius * 2.2 + 6,
                tessellation: islandTessellation
            }, scene);
            islandTop.position.y = islandHeight / 2 - 6;
            islandTop.position.y += 1; // Slight overlap

            // Bottom part: rock/dirt
            const islandBottom = island;
            islandBottom.material = materials.rock;
            islandBottom.position.y = 0;

            islandTop.material = materials.grass;
            islandTop.parent = islandGroup;
            islandBottom.parent = islandGroup;

            islandTop.receiveShadows = true;
            islandBottom.receiveShadows = true;

            // Create some cliff layer rings
            for (let i = 0; i < 3; i++) {
                const cliffRing = BABYLON.MeshBuilder.CreateTorus("cliff" + i, {
                    diameter: islandRadius * 1.9 - i * 12,
                    thickness: 5,
                    tessellation: 64
                }, scene);
                cliffRing.position.y = islandHeight / 2 - 22 - i * 14;
                cliffRing.material = materials.dirt;
                cliffRing.scaling.y = 0.8;
                cliffRing.receiveShadows = true;
                cliffRing.parent = islandGroup;
            }

            islandGroup.position.y = -30;
            return islandGroup;
        }

        // ============================================
        // CASTLE
        // ============================================
        function createCastle(scene, centerX = 0, centerZ = 0) {
            const castleGroup = new BABYLON.TransformNode("castle", scene);

            // Main keep (central tower)
            const keepBase = BABYLON.MeshBuilder.CreateCylinder("keepBase", {
                height: 32,
                diameterTop: 14,
                diameterBottom: 16,
                tessellation: 16
            }, scene);
            keepBase.position.y = 16;
            keepBase.material = materials.stone;
            keepBase.receiveShadows = true;
            meshWithShadow(keepBase, shadow);

            // Keep battlements
            for (let i = 0; i < 8; i++) {
                const merlon = BABYLON.MeshBuilder.CreateBox("merlon" + i, {
                    width: 3, height: 4, depth: 2.5
                }, scene);
                const angle = (i / 8) * Math.PI * 2;
                merlon.position.x = Math.cos(angle) * 7.5;
                merlon.position.z = Math.sin(angle) * 7.5;
                merlon.position.y = 33;
                merlon.material = materials.stone;
                meshWithShadow(merlon, shadow);
                merlon.parent = castleGroup;
            }

            keepBase.parent = castleGroup;

            // Corner towers
            const towerPositions = [
                { x: -18, z: -18 }, { x: 18, z: -18 },
                { x: -18, z: 18 }, { x: 18, z: 18 },
                { x: -22, z: 0 }, { x: 22, z: 0 },
                { x: 0, z: -22 }, { x: 0, z: 22 }
            ];

            towerPositions.forEach((pos, idx) => {
                // Tower body
                const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + idx, {
                    height: 28,
                    diameter: 9,
                    tessellation: 12
                }, scene);
                tower.position.x = pos.x;
                tower.position.z = pos.z;
                tower.position.y = 14;
                tower.material = materials.stone;
                meshWithShadow(tower, shadow);
                tower.parent = castleGroup;

                // Tower roof (cone)
                const roof = BABYLON.MeshBuilder.CreateCylinder("towerRoof" + idx, {
                    height: 10,
                    diameterTop: 0.5,
                    diameterBottom: 10,
                    tessellation: 12
                }, scene);
                roof.position.x = pos.x;
                roof.position.z = pos.z;
                roof.position.y = 32;
                roof.material = materials.roofRed;
                meshWithShadow(roof, shadow);
                roof.parent = castleGroup;

                // Tower battlements
                for (let i = 0; i < 6; i++) {
                    const merlon = BABYLON.MeshBuilder.CreateBox("tMerlon" + idx + i, {
                        width: 1.8, height: 3, depth: 1.2
                    }, scene);
                    const angle = (i / 6) * Math.PI * 2;
                    merlon.position.x = pos.x + Math.cos(angle) * 4.8;
                    merlon.position.z = pos.z + Math.sin(angle) * 4.8;
                    merlon.position.y = 30;
                    merlon.material = materials.stone;
                    meshWithShadow(merlon, shadow);
                    merlon.parent = castleGroup;
                }
            });

            // Curtain walls connecting towers
            const wallSegments = [
                { x: 0, z: -22, rot: 0, len: 44 },
                { x: 0, z: 22, rot: 0, len: 44 },
                { x: -22, z: 0, rot: Math.PI / 2, len: 44 },
                { x: 22, z: 0, rot: Math.PI / 2, len: 44 }
            ];

            wallSegments.forEach(seg => {
                const wall = BABYLON.MeshBuilder.CreateBox("wall", {
                    width: seg.len, height: 18, depth: 3
                }, scene);
                wall.position.x = seg.x;
                wall.position.z = seg.z;
                wall.position.y = 9;
                wall.rotation.y = seg.rot;
                wall.material = materials.stone;
                meshWithShadow(wall, shadow);
                wall.parent = castleGroup;

                // Wall battlements
                const merlonCount = Math.floor(seg.len / 3.5);
                for (let i = 0; i < merlonCount; i++) {
                    const offset = -seg.len / 2 + i * 3.8 + 2;
                    const merlon = BABYLON.MeshBuilder.CreateBox("wMerlon", {
                        width: 1.5, height: 3, depth: 1.2
                    }, scene);
                    if (seg.rot === 0) {
                        merlon.position.x = seg.x + offset;
                        merlon.position.z = seg.z + 2.5;
                    } else {
                        merlon.position.x = seg.x + 2.5;
                        merlon.position.z = seg.z + offset;
                    }
                    merlon.position.y = 19;
                    merlon.material = materials.stone;
                    meshWithShadow(merlon, shadow);
                    merlon.parent = castleGroup;
                }
            });

            castleGroup.position = new BABYLON.Vector3(centerX, -30, centerZ);
            return castleGroup;
        }

        // ============================================
        // VILLAGE HOUSE GENERATOR
        // ============================================
        function createHouse(scene, x, z, rot, style = 0) {
            const houseGroup = new BABYLON.TransformNode("house", scene);

            // Base structure
            const base = BABYLON.MeshBuilder.CreateBox("houseBase", {
                width: 7 + (style % 2) * 2,
                height: 6,
                depth: 6 + ((style >> 1) % 2) * 2
            }, scene);
            base.position.y = 3;
            base.material = style < 2 ? materials.wood : materials.darkWood;
            meshWithShadow(base, shadow);
            base.parent = houseGroup;

            // Pitched roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("houseRoof", {
                height: 5,
                diameterTop: 0.2,
                diameterBottom: 8 + (style % 2) * 1.5,
                tessellation: 4
            }, scene);
            roof.rotation.y = Math.PI / 4;
            roof.position.y = 7;

            // Color variations
            const roofMat = style % 3 === 0 ? materials.roofRed :
                           style % 3 === 1 ? materials.roofBlue : materials.roofGreen;
            roof.material = roofMat;
            meshWithShadow(roof, shadow);
            roof.parent = houseGroup;

            // Door
            const door = BABYLON.MeshBuilder.CreateBox("door", {
                width: 1.5, height: 3, depth: 0.4
            }, scene);
            door.position.y = 1.5;
            door.position.z = 3.6;
            door.material = materials.darkWood;
            meshWithShadow(door, shadow);
            door.parent = houseGroup;

            // Windows
            for (let i = 0; i < 2; i++) {
                const win = BABYLON.MeshBuilder.CreateBox("win", {
                    width: 1.4, height: 1.4, depth: 0.4
                }, scene);
                win.position.y = 4.2;
                win.position.x = -2.2 + i * 4.4;
                win.position.z = 3.6;
                win.material = materials.darkWood;
                meshWithShadow(win, shadow);
                win.parent = houseGroup;
            }

            houseGroup.position = new BABYLON.Vector3(x, -30, z);
            houseGroup.rotation.y = rot;
            return houseGroup;
        }

        // ============================================
        // TAVERN
        // ============================================
        function createTavern(scene, x, z) {
            const tavern = new BABYLON.TransformNode("tavern", scene);

            // Main building
            const main = BABYLON.MeshBuilder.CreateBox("tavernMain", {
                width: 10, height: 8, depth: 8
            }, scene);
            main.position.y = 4;
            main.material = materials.darkWood;
            meshWithShadow(main, shadow);
            main.parent = tavern;

            // Pitched roof
            const roof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", {
                height: 6,
                diameterTop: 0.2,
                diameterBottom: 12,
                tessellation: 4
            }, scene);
            roof.rotation.y = Math.PI / 4;
            roof.position.y = 9;
            roof.material = materials.roofRed;
            meshWithShadow(roof, shadow);
            roof.parent = tavern;

            // Chimney
            const chimney = BABYLON.MeshBuilder.CreateCylinder("chimney", {
                height: 5,
                diameter: 1.2,
                tessellation: 8
            }, scene);
            chimney.position.set(3.5, 11, 2);
            chimney.material = materials.stone;
            meshWithShadow(chimney, shadow);
            chimney.parent = tavern;

            // Sign
            const sign = BABYLON.MeshBuilder.CreateBox("sign", {
                width: 4, height: 2, depth: 0.4
            }, scene);
            sign.position.set(0, 9.5, 4.5);
            sign.material = materials.darkWood;
            meshWithShadow(sign, shadow);
            sign.parent = tavern;

            tavern.position = new BABYLON.Vector3(x, -30, z);
            tavern.rotation.y = Math.PI / 6;
            return tavern;
        }

        // ============================================
        // MARKET STALLS
        // ============================================
        function createMarketStall(scene, x, z, rot, colorMat) {
            const stall = new BABYLON.TransformNode("stall", scene);

            // Counter
            const counter = BABYLON.MeshBuilder.CreateBox("counter", {
                width: 5, height: 1.5, depth: 2.5
            }, scene);
            counter.position.y = 2.5;
            counter.material = materials.wood;
            meshWithShadow(counter, shadow);
            counter.parent = stall;

            // Canopy poles
            for (let i = 0; i < 4; i++) {
                const pole = BABYLON.MeshBuilder.CreateCylinder("pole" + i, {
                    height: 5,
                    diameter: 0.4,
                    tessellation: 6
                }, scene);
                const px = -2.2 + (i % 2) * 4.4;
                const pz = -1 + Math.floor(i / 2) * 2;
                pole.position.set(px, 2.5, pz);
                pole.material = materials.wood;
                meshWithShadow(pole, shadow);
                pole.parent = stall;
            }

            // Canopy top
            const canopy = BABYLON.MeshBuilder.CreateBox("canopy", {
                width: 6, height: 0.3, depth: 3.5
            }, scene);
            canopy.position.y = 5.2;
            canopy.material = colorMat;
            meshWithShadow(canopy, shadow);
            canopy.parent = stall;

            stall.position = new BABYLON.Vector3(x, -30, z);
            stall.rotation.y = rot;
            return stall;
        }

        // ============================================
            // RIVERSIDE MILL
        // ============================================
        function createMill(scene, x, z) {
            const mill = new BABYLON.TransformNode("mill", scene);

            // Main building
            const main = BABYLON.MeshBuilder.CreateBox("millMain", {
                width: 8, height: 7, depth: 8
            }, scene);
            main.position.y = 3.5;
            main.material = materials.darkWood;
            meshWithShadow(main, shadow);
            main.parent = mill;

            // Water wheel
            const wheel = BABYLON.MeshBuilder.CreateCylinder("wheel", {
                height: 0.6,
                diameter: 6,
                tessellation: 16
            }, scene);
            wheel.rotation.x = Math.PI / 2;
            wheel.position.set(4.5, 1.5, 0);
            wheel.material = materials.wood;
            meshWithShadow(wheel, shadow);
            wheel.parent = mill;

            // Wheel paddles
            for (let i = 0; i < 12; i++) {
                const paddle = BABYLON.MeshBuilder.CreateBox("paddle" + i, {
                    width: 2.5, height: 0.3, depth: 1
                }, scene);
                const angle = (i / 12) * Math.PI * 2;
                paddle.position.set(
                    4.5 + Math.cos(angle) * 3,
                    1.5 + Math.sin(angle) * 3,
                    0
                );
                paddle.rotation.z = angle;
                paddle.material = materials.wood;
                meshWithShadow(paddle, shadow);
                paddle.parent = mill;
            }

            mill.position = new BABYLON.Vector3(x, -30, z);
            mill.rotation.y = -Math.PI / 8;
            return mill;
        }

        // ============================================
        // PINE TREE GENERATOR
        // ============================================
        function createPineTree(scene, x, z, scale = 1) {
            const tree = new BABYLON.TransformNode("tree", scene);

            // Trunk
            const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
                height: 4 * scale,
                diameterTop: 0.5,
                diameterBottom: 1,
                tessellation: 8
            }, scene);
            trunk.position.y = 2 * scale;
            trunk.material = materials.darkWood;
            meshWithShadow(trunk, shadow);
            trunk.parent = tree;

            // Foliage layers (stacked cones)
            const layers = 4;
            for (let i = 0; i < layers; i++) {
                const coneHeight = 3 * scale - i * 0.4;
                const coneDiameter = (5 - i * 1.2) * scale;
                const cone = BABYLON.MeshBuilder.CreateCylinder("foliage" + i, {
                    height: coneHeight,
                    diameterTop: 0.2,
                    diameterBottom: coneDiameter,
                    tessellation: 12
                }, scene);
                cone.position.y = (4 + i * 2.5) * scale;
                cone.scaling.y = 1;
                cone.material = materials.grass;
                meshWithShadow(cone, shadow);
                cone.parent = tree;
            }

            tree.position = new BABYLON.Vector3(x, -30, z);
            return tree;
        }

        // ============================================
        // RUINED WATCHTOWER
        // ============================================
        function createWatchtower(scene, x, z) {
            const tower = new BABYLON.TransformNode("watchtower", scene);

            // Base cylinder with broken top
            const base = BABYLON.MeshBuilder.CreateCylinder("towerBase", {
                height: 18,
                diameter: 7,
                tessellation: 16
            }, scene);
            base.position.y = 9;
            base.material = materials.darkStone;
            meshWithShadow(base, shadow);
            base.parent = tower;

            // Broken battlements (only some remain)
            for (let i = 0; i < 12; i++) {
                if (i % 3 !== 0) {
                    const merlon = BABYLON.MeshBuilder.CreateBox("rMerlon" + i, {
                        width: 1.5, height: 3, depth: 1
                    }, scene);
                    const angle = (i / 12) * Math.PI * 2;
                    merlon.position.x = Math.cos(angle) * 3.8;
                    merlon.position.z = Math.sin(angle) * 3.8;
                    merlon.position.y = 18 + (i % 2) * 0.5; // Irregular top
                    merlon.material = materials.darkStone;
                    meshWithShadow(merlon, shadow);
                    merlon.parent = tower;
                }
            }

            // Some fallen rocks
            for (let i = 0; i < 5; i++) {
                const rock = BABYLON.MeshBuilder.CreatePolyhedron("rock" + i, {
                    size: 0.7 + Math.random() * 1.2,
                    type: Math.floor(Math.random() * 3)
                }, scene);
                const angle = Math.random() * Math.PI * 2;
                const dist = 5 + Math.random() * 5;
                rock.position.x = Math.cos(angle) * dist;
                rock.position.z = Math.sin(angle) * dist;
                rock.position.y = 1 + Math.random() * 2;
                rock.material = materials.darkStone;
                meshWithShadow(rock, shadow);
                rock.parent = tower;
            }

            tower.position = new BABYLON.Vector3(x, -30, z);
            tower.rotation.y = Math.random() * Math.PI * 2;
            return tower;
        }

        // ============================================
        // RIVER & BRIDGES
        // ============================================
        function createRiver(scene) {
            const riverGroup = new BABYLON.TransformNode("river", scene);

            // Create a winding river path
            const riverPath = [
                new BABYLON.Vector3(60, -28, -40),
                new BABYLON.Vector3(30, -28, -20),
                new BABYLON.Vector3(-10, -28, -15),
                new BABYLON.Vector3(-40, -28, 5),
                new BABYLON.Vector3(-55, -28, 35),
                new BABYLON.Vector3(-45, -28, 55)
            ];

            // River surface using ribbon
            const riverWidth = 14;
            const riverPoints = [];
            for (let i = 0; i < 100; i++) {
                const t = i / 99;
                const point = BABYLON.Vector3.CatmullRom(riverPath, t);
                const tangent = BABYLON.Vector3.CatmullRom(
                    riverPath,
                    t + 0.001
                ).subtract(point).normalize();
                const up = new BABYLON.Vector3(0, 1, 0);
                const side = BABYLON.Vector3.Cross(tangent, up).normalize();
                point.subtractInPlace(side.scale(riverWidth / 2));
                riverPoints.push(point);
                point.addInPlace(side.scale(riverWidth));
                riverPoints.push(point);
            }

            // Extrude river mesh
            const riverMesh = new BABYLON.Mesh("riverMesh", scene);
            const riverVertexData = new BABYLON.VertexData();
            const positions = [];
            const indices = [];
            const normals = [];
            const uvs = [];

            const segments = 100;
            const pathCount = riverPath.length;

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const point = BABYLON.Vector3.CatmullRom(riverPath, t);
                const tangent = BABYLON.Vector3.CatmullRom(
                    riverPath,
                    Math.min(t + 0.01, 1)
                ).subtract(point).normalize();
                const up = new BABYLON.Vector3(0, 1, 0);
                const side = BABYLON.Vector3.Cross(tangent, up).normalize();

                const left = point.subtract(side.scale(riverWidth / 2));
                const right = point.add(side.scale(riverWidth / 2));

                positions.push(left.x, left.y, left.z);
                positions.push(right.x, right.y, right.z);
                normals.push(0, 1, 0, 0, 1, 0);
                uvs.push(0, t * 8, 1, t * 8);

                if (i < segments) {
                    const idx = i * 2;
                    indices.push(idx, idx + 1, idx + 2);
                    indices.push(idx + 1, idx + 3, idx + 2);
                }
            }

            riverVertexData.positions = positions;
            riverVertexData.indices = indices;
            riverVertexData.normals = normals;
            riverVertexData.uvs = uvs;
            riverVertexData.applyToMesh(riverMesh);
            riverMesh.material = materials.water;
            riverMesh.receiveShadows = true;
            riverMesh.parent = riverGroup;

            // Bridges
            const bridgePositions = [
                { pos: new BABYLON.Vector3(40, -28, -30), rot: Math.PI / 5 },
                { pos: new BABYLON.Vector3(-25, -28, -5), rot: -Math.PI / 3 },
                { pos: new BABYLON.Vector3(-50, -28, 45), rot: Math.PI / 6 }
            ];

            bridgePositions.forEach((b, idx) => {
                const bridgeGroup = new BABYLON.TransformNode("bridge" + idx, scene);

                // Bridge deck (arched)
                const plankCount = 9;
                for (let i = 0; i < plankCount; i++) {
                    const t = (i / (plankCount - 1)) * 2 - 1;
                    const plank = BABYLON.MeshBuilder.CreateBox("plank" + i, {
                        width: 8, height: 0.4, depth: 1.8
                    }, scene);
                    plank.position.x = t * 4;
                    plank.position.y = -Math.abs(t) * 1.2;
                    plank.position.z = 0;
                    plank.material = materials.wood;
                    meshWithShadow(plank, shadow);
                    plank.parent = bridgeGroup;
                }

                // Railings
                for (let i = 0; i < 2; i++) {
                    const rail = BABYLON.MeshBuilder.CreateCylinder("rail" + i, {
                        height: 9,
                        diameter: 0.3,
                        tessellation: 6
                    }, scene);
                    rail.position.y = 1.8;
                    rail.position.x = -4 + i * 8;
                    rail.material = materials.darkWood;
                    meshWithShadow(rail, shadow);
                    rail.parent = bridgeGroup;
                }

                bridgeGroup.position.copyFrom(b.pos);
                bridgeGroup.position.y += 0.5;
                bridgeGroup.rotation.y = b.rot;
                bridgeGroup.parent = riverGroup;
            });

            return riverGroup;
        }

        // ============================================
        // WATERFALLS
        // ============================================
        function createWaterfalls(scene) {
            const fallsGroup = new BABYLON.TransformNode("waterfalls", scene);

            // Locations near island edge
            const fallLocations = [
                { x: -45, z: -25, height: 28, rot: Math.PI / 4 },
                { x: 30, z: 50, height: 32, rot: -Math.PI / 3 },
                { x: -58, z: 10, height: 24, rot: Math.PI / 2 }
            ];

            fallLocations.forEach((loc, idx) => {
                // Waterfall stream
                const waterfall = BABYLON.MeshBuilder.CreateBox("waterfall" + idx, {
                    width: 6,
                    height: loc.height,
                    depth: 1.5
                }, scene);
                waterfall.position.set(
                    loc.x,
                    -30 + loc.height / 2,
                    loc.z
                );
                waterfall.rotation.y = loc.rot;
                waterfall.material = materials.waterfall;
                waterfall.parent = fallsGroup;

                // Mist at bottom (particle-like boxes)
                for (let i = 0; i < 5; i++) {
                    const mist = BABYLON.MeshBuilder.CreateSphere("mist" + idx + i, {
                        diameter: 3 + Math.random() * 4,
                        segments: 8
                    }, scene);
                    mist.position.set(
                        loc.x + (Math.random() - 0.5) * 8,
                        -28,
                        loc.z + (Math.random() - 0.5) * 8
                    );
                    mist.material = materials.waterfall;
                    mist.scaling.y = 0.25;
                    mist.parent = fallsGroup;
                }

                // Rock at top
                const rock = BABYLON.MeshBuilder.CreatePolyhedron("fallRock" + idx, {
                    size: 4 + Math.random() * 3,
                    type: Math.floor(Math.random() * 3)
                }, scene);
                rock.position.set(loc.x, -30 + loc.height + 1, loc.z);
                rock.scaling.y = 0.5;
                rock.material = materials.rock;
                meshWithShadow(rock, shadow);
                rock.parent = fallsGroup;
            });

            return fallsGroup;
        }

        // ============================================
        // BUILD THE FULL DIORAMA
        // ============================================
        function buildDiorama() {
            // Create island
            const island = createIsland(scene);
            island.position.y = -20;

            // Castle at center
            const castle = createCastle(scene, 0, 0);

            // Village houses arranged around castle
            const housePositions = [
                { x: -35, z: -25, rot: 0 },
                { x: -40, z: 5, rot: Math.PI / 5 },
                { x: -30, z: 25, rot: -Math.PI / 4 },
                { x: 30, z: -30, rot: Math.PI / 3 },
                { x: 40, z: 10, rot: -Math.PI / 6 },
                { x: 35, z: 35, rot: Math.PI / 2 },
                { x: -15, z: -35, rot: Math.PI / 8 },
                { x: 15, z: -25, rot: -Math.PI / 7 },
                { x: -20, z: 30, rot: Math.PI / 6 },
                { x: 20, z: 20, rot: -Math.PI / 5 },
                { x: -38, z: -10, rot: Math.PI / 4 }
            ];

            housePositions.forEach((pos, idx) => {
                createHouse(scene, pos.x, pos.z, pos.rot, idx % 4);
            });

            // Tavern
            createTavern(scene, 25, -15);

            // Market stalls
            createMarketStall(scene, -20, 28, Math.PI / 5, materials.canopy1);
            createMarketStall(scene, -25, 22, -Math.PI / 6, materials.canopy2);
            createMarketStall(scene, -28, 15, Math.PI / 8, materials.canopy3);

            // Riverside mill
            createMill(scene, 45, -35);

            // Pine trees scattered around
            const treePositions = [
                { x: -50, z: -30, scale: 1.3 },
                { x: 50, z: -20, scale: 1.1 },
                { x: -45, z: 40, scale: 1.4 },
                { x: 55, z: 25, scale: 1.2 },
                { x: -10, z: -45, scale: 1.0 },
                { x: 10, z: -40, scale: 1.1 },
                { x: -55, z: -15, scale: 1.3 },
                { x: 48, z: -10, scale: 1.15 },
                { x: -30, z: 45, scale: 1.25 },
                { x: 35, z: 48, scale: 1.1 },
                { x: -40, z: -38, scale: 1.2 }
            ];

            treePositions.forEach(pos => {
                createPineTree(scene, pos.x, pos.z, pos.scale);
            });

            // Ruined watchtower at edge
            createWatchtower(scene, -55, 48);

            // River and bridges
            const river = createRiver(scene);
            river.position.y = 0;

            // Waterfalls
            const waterfalls = createWaterfalls(scene);
            waterfalls.position.y = 0;

            // Apply subtle ambient occlusion to key meshes
            scene.meshes.forEach(mesh => {
                if (mesh.material && mesh.material.ambientColor) {
                    mesh.material.ambientColor = new BABYLON.Color3(0.7, 0.7, 0.7);
                }
            });
        }

        // ============================================
        // POST PROCESSING & FINAL SETUP
        // ============================================
        const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
        pipeline.fxaaEnabled = true;
        pipeline.samples = 4;

        pipeline.bloomEnabled = true;
        pipeline.bloomThreshold = 0.6;
        pipeline.bloomWeight = 0.3;
        pipeline.bloomKernel = 64;
        pipeline.bloomScale = 0.4;

        pipeline.imageProcessingEnabled = true;
        pipeline.imageProcessing.contrast = 1.1;
        pipeline.imageProcessing.exposure = 1.0;
        pipeline.imageProcessing.toneMappingEnabled = true;
        pipeline.imageProcessing.vignetteEnabled = true;
        pipeline.imageProcessing.vignetteWeight = 0.4;
        pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 0);
        pipeline.imageProcessing.vignetteStretch = 0.5;

        // Build everything
        buildDiorama();

        // Hide auto-rotation message after first interaction
        let hasInteracted = false;
        canvas.addEventListener('pointerdown', () => {
            if (!hasInteracted) {
                camera.useAutoRotationBehavior = false;
                hasInteracted = true;
            }
        }, { once: true });

        // Render loop
        engine.runRenderLoop(() => {
            scene.render();

            // Animate water slightly
            scene.meshes.forEach(mesh => {
                if (mesh.name.includes("river") || mesh.name.includes("waterfall")) {
                    mesh.material.alpha = 0.7 + Math.sin(Date.now() * 0.002) * 0.08;
                }
            });
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            engine.resize();
        });

        // Hide loading
        window.addEventListener('load', () => {
            const loader = document.getElementById('loading');
            if (loader) loader.style.display = 'none';
        });
    </script>
</body>
