<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aldermere — Floating Isle Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3ee;font-family:'Nunito',sans-serif}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #cv:active{cursor:grabbing}
  #vig{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 55%, rgba(28,14,40,.22) 100%)}
  .plaque{position:fixed;top:18px;left:18px;z-index:10;pointer-events:none;
    padding:12px 22px 13px;border-radius:10px;
    background:linear-gradient(165deg,#5a4130 0%,#4a3323 55%,#3e2a1c 100%);
    border:1px solid #d9a441;
    box-shadow:0 0 0 3px #3a281a,0 0 0 4px rgba(217,164,65,.5),0 14px 34px rgba(30,15,5,.35),
      inset 0 1px 0 rgba(255,235,200,.18)}
  .plaque h1{font-family:'MedievalSharp',cursive;font-weight:400;font-size:30px;margin:0;
    color:#ffdf9e;letter-spacing:.5px;text-shadow:0 2px 0 rgba(40,20,0,.55),0 0 18px rgba(255,190,80,.25)}
  .plaque .rule{height:2px;margin:7px 0 5px;background:linear-gradient(90deg,rgba(217,164,65,.95),rgba(217,164,65,0))}
  .plaque .sub{margin:0;font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#e8c99a;opacity:.85}
  #toolbar{position:fixed;right:18px;bottom:18px;z-index:10;display:flex;flex-wrap:wrap;gap:8px;
    justify-content:flex-end;max-width:min(560px,calc(100vw - 36px))}
  #toolbar .sep{width:1px;background:linear-gradient(#0000,#d9a44188 30%,#d9a44188 70%,#0000);margin:2px 3px}
  .btn{cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.09em;
    text-transform:uppercase;color:#ffe9c2;padding:9px 13px;border-radius:8px;border:1px solid #a87f3e;
    background:linear-gradient(180deg,#6b4a30,#4e3320);
    box-shadow:0 3px 0 #2e1d10,0 8px 16px rgba(25,12,3,.35),inset 0 1px 0 rgba(255,225,170,.25);
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s,background .15s}
  .btn:hover{transform:translateY(-2px);border-color:#e9b95c;
    box-shadow:0 5px 0 #2e1d10,0 12px 22px rgba(25,12,3,.4),inset 0 1px 0 rgba(255,225,170,.35)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 #2e1d10}
  .btn.on{background:linear-gradient(180deg,#8a6a2f,#6d4f20);color:#fff3d6;border-color:#ffd87a;
    box-shadow:0 3px 0 #2e1d10,0 0 14px rgba(255,190,80,.35),inset 0 1px 0 rgba(255,235,180,.4)}
  #hints{position:fixed;left:18px;bottom:18px;z-index:10;pointer-events:none;
    font-size:12px;font-weight:700;letter-spacing:.05em;color:#ffe9c2;
    background:rgba(34,21,10,.58);border:1px solid rgba(217,164,65,.4);border-radius:20px;padding:7px 14px}
  #veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;background:linear-gradient(180deg,#8fd0ea,#cfeef2 60%,#f6e7cf);transition:opacity .9s ease}
  #veil h2{font-family:'MedievalSharp',cursive;font-weight:400;font-size:46px;color:#33566b;margin:0;
    text-shadow:0 2px 0 rgba(255,255,255,.6)}
  #veil p{color:#4a6b80;font-weight:800;letter-spacing:.22em;text-transform:uppercase;font-size:11.5px;margin:0}
  #veil .bar{width:190px;height:4px;border-radius:2px;background:rgba(60,90,110,.22);overflow:hidden;margin-top:16px}
  #veil .bar i{display:block;height:100%;width:40%;background:#3f7d9e;animation:load 1.1s ease-in-out infinite alternate}
  @keyframes load{from{transform:translateX(-30%)}to{transform:translateX(250%)}}
  #veil.hide{opacity:0;pointer-events:none}
  @media(max-width:640px){.plaque h1{font-size:22px}.plaque{padding:9px 14px 10px}
    #hints{display:none}.btn{padding:8px 10px;font-size:10.5px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div class="plaque"><h1>Aldermere</h1><div class="rule"></div>
  <p class="sub">a floating-island diorama &middot; babylon.js</p></div>
<div id="toolbar">
  <button class="btn" data-preset="keep">Keep</button>
  <button class="btn" data-preset="village">Village</button>
  <button class="btn" data-preset="mill">Mill</button>
  <button class="btn" data-preset="falls">Waterfall</button>
  <button class="btn" data-preset="watch">Watchtower</button>
  <button class="btn" data-preset="top">Overhead</button>
  <span class="sep"></span>
  <button class="btn" id="moodBtn">&#9790; Day</button>
  <button class="btn on" id="orbitBtn">Orbit &middot; On</button>
</div>
<div id="hints">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
<div id="veil"><h2>Aldermere</h2><p id="veilmsg">raising the island…</p><div class="bar"><i></i></div></div>

<script src="https://cdn.babylonjs.com/babylon.js"
        onerror="document.getElementById('veilmsg').textContent='could not reach the Babylon.js CDN — check your connection'"></script>
<script>
"use strict";
if(!window.BABYLON){ throw new Error('Babylon.js missing'); }
const B = BABYLON;

/* ============================ utils ============================ */
const clamp01 = v => v<0?0:v>1?1:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = (a,b,x)=>{const t=clamp01((x-a)/(b-a));return t*t*(3-2*t);};
const hex3 = h => new B.Color3(((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255);
const hexA = h => [((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255];
const C4 = (r,g,b,a)=>new B.Color4(r,g,b,a);
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
function hash3(x,y,z,s){const n=Math.sin(x*127.1+y*311.7+z*74.7+s*19.19)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y,z,s){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const c000=hash3(xi,yi,zi,s),c100=hash3(xi+1,yi,zi,s),c010=hash3(xi,yi+1,zi,s),c110=hash3(xi+1,yi+1,zi,s);
  const c001=hash3(xi,yi,zi+1,s),c101=hash3(xi+1,yi,zi+1,s),c011=hash3(xi,yi+1,zi+1,s),c111=hash3(xi+1,yi+1,zi+1,s);
  const x00=c000+(c100-c000)*u,x10=c010+(c110-c010)*u,x01=c001+(c101-c001)*u,x11=c011+(c111-c011)*u;
  const y0=x00+(x10-x00)*v,y1=x01+(x11-x01)*v;
  return y0+(y1-y0)*w;
}
function fbm(x,y,z,oct,s){let a=0,amp=.5,f=1;for(let i=0;i<oct;i++){a+=amp*vnoise(x*f,y*f,z*f,s+i*31);amp*=.5;f*=2.03;}return a;}
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function catmull(pts,sub){
  const P=[pts[0],...pts,pts[pts.length-1]],out=[];
  for(let i=0;i<P.length-3;i++){
    const [p0,p1,p2,p3]=[P[i],P[i+1],P[i+2],P[i+3]];
    for(let j=0;j<sub;j++){
      const u=j/sub,u2=u*u,u3=u2*u;
      const f=(a,b,c,d)=>.5*(2*b+(-a+c)*u+(2*a-5*b+4*c-d)*u2+(-a+3*b-3*c+d)*u3);
      out.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]);
    }
  }
  out.push([...pts[pts.length-1]]);return out;
}

/* ============================ engine / scene ============================ */
const canvas=document.getElementById('cv');
const engine=new B.Engine(canvas,true,{antialias:true,stencil:true,powerPreference:'high-performance'});
const scene=new B.Scene(engine);
scene.clearColor=new B.Color3(.85,.93,.95);
scene.fogMode=B.Scene.FOGMODE_EXP2; scene.fogDensity=.0032; scene.fogColor=new B.Color3(.85,.93,.95);

const camera=new B.ArcRotateCamera('cam',0.7,1.26,58,new B.Vector3(0,2.5,0),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=13;camera.upperRadiusLimit=100;
camera.lowerBetaLimit=0.12;camera.upperBetaLimit=2.75;
camera.inertia=0.85;
let autoOrbit=true,lastUser=0,flying=null;
canvas.addEventListener('pointerdown',()=>lastUser=performance.now());
canvas.addEventListener('wheel',()=>lastUser=performance.now(),{passive:true});

const hemi=new B.HemisphereLight('hemi',new B.Vector3(0,-1,0),new B.Color3(.36,.30,.24),.55,scene);
const sun=new B.DirectionalLight('sun',new B.Vector3(-.6,-1,-.38),scene);
sun.position=new B.Vector3(30,45,22);
sun.intensity=1.25; sun.diffuse=hex3(0xfff2d8);
sun.orthographicLeft=-50;sun.orthographicRight=50;sun.orthographicTop=50;sun.orthographicBottom=-50;
sun.orthographicNear=5;sun.orthographicFar=180;
const sg=new B.ShadowGenerator(2048,sun);
sg.usePercentageCloserFiltering=true; sg.setDarkness(0.45); sg.bias=.0004; sg.autoUse2xBias=true;

/* ============================ materials ============================ */
function stdMat(name,hex,o={}){
  const m=new B.StandardMaterial(name,scene);
  m.diffuse=hex3(hex);
  m.specular=hex3(o.spec!==undefined?o.spec:0x222222);
  if(o.emissive!==undefined)m.emissive=hex3(o.emissive);
  if(o.alpha!==undefined)m.alpha=o.alpha;
  if(o.double)m.backFaceCulling=false;
  return m;
}
const MAT={
  stone:stdMat('stone',0xd9cdb8,{spec:0x1a1a14}),
  stoneDbl:stdMat('stoneD',0xd2c5ae,{spec:0x1a1a14,double:true}),
  stoneVil:stdMat('stoneV',0xcfc2a4,{spec:0x181812}),
  plaster:stdMat('plaster',0xefe4c8,{spec:0x1c1c14}),
  wood:stdMat('wood',0xb5834f,{spec:0x1c1408}),
  woodL:stdMat('woodL',0xd9a86c,{spec:0x20160a}),
  woodD:stdMat('woodD',0x7a5432,{spec:0x100c06}),
  roofBlue:stdMat('roofB',0x3d5cae,{spec:0x2a2a30}),
  roofRed:stdMat('roofR',0xb04a56,{spec:0x2a1414}),
  roofSlate:stdMat('roofS',0x55688c,{spec:0x1e2430}),
  dark:stdMat('dark',0x35302b,{spec:0x0a0a08}),
  chain:stdMat('chain',0x555049,{spec:0x3a3a3a}),
  gold:stdMat('gold',0xe8b64c,{spec:0x665522,emissive:0x332408}),
  banner:stdMat('banner',0xc04254,{double:true}),
  glow:stdMat('glow',0x40444e,{emissive:0xffd98c,spec:0x222222}),
  ember:stdMat('ember',0x4a2410,{emissive:0xff8a3c}),
  leaf:stdMat('leaf',0x2e8f5c,{spec:0x0d1a10}),
  trunk:stdMat('trunk',0x7a4f2e,{spec:0x100b06}),
  tuft:stdMat('tuft',0x58c162,{spec:0x0e1a0e}),
  stem:stdMat('stem',0x3f9e50,{spec:0x0a140a}),
  head:stdMat('head',0xffffff,{spec:0x333333}),
  rockI:stdMat('rockI',0x8b8177,{spec:0x141410}),
  path:stdMat('path',0xa99a85,{spec:0x151512}),
  cloud:stdMat('cloud',0xffffff,{emissive:0x2c2e34,spec:0x111111}),
  bird:stdMat('bird',0x2b2b33,{spec:0x0a0a0a}),
  crystal:stdMat('crys',0x9fe8e0,{emissive:0x2fd8c8,spec:0x446666}),
  water:stdMat('water',0x41d6c8,{spec:0xffffff,alpha:.85,emissive:0x0d6e68}),
  cascade:stdMat('casc',0xcfeef2,{emissive:0x6fd0ca,alpha:.55,spec:0x88aabb}),
  grassC:stdMat('grassC',0x4fae5b,{spec:0x14200f}),
};
const rockVC=new B.StandardMaterial('rockVC',scene);
rockVC.vertexColors=true;rockVC.specular=hex3(0x111111);rockVC.backFaceCulling=false;
const groundVC=new B.StandardMaterial('groundVC',scene);
groundVC.vertexColors=true;groundVC.specular=hex3(0x171710);groundVC.backFaceCulling=false;

/* soft particle texture */
const softTex=new B.DynamicTexture('soft',{width:64,height:64},scene,false);
{const cv=softTex.getContext(),g=cv.createRadialGradient(32,32,2,32,32,30);
 g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');
 cv.fillStyle=g;cv.fillRect(0,0,64,64);softTex.update();}

/* ============================ sky dome ============================ */
const sky=B.MeshBuilder.CreateSphere('sky',{diameter:420,segments:24},scene);
const skyMat=new B.StandardMaterial('skyM',scene);
skyMat.disableLighting=true;skyMat.backFaceCulling=false;skyMat.fogEnabled=false;skyMat.vertexColors=true;
sky.material=skyMat;sky.castShadow=false;sky.receiveShadows=false;sky.isPickable=false;
const skyPos=sky.getVerticesData(B.VertexBuffer.PositionKind);
const skyTts=new Float32Array(skyPos.length/3);
{const cols=new Float32Array(skyPos.length);
 for(let i=0;i<skyPos.length;i+=3){const tt=clamp01(skyPos[i+1]/210*.5+.5);skyTts[i/3]=tt;}
 skyBaseCols=cols;}
let skyBaseCols;
{const c=hexA(0x5fb2ec),b=hexA(0xe3f2ec);
 for(let i=0;i<skyTts.length;i++){const t=skyTts[i],k=i*3;skyBaseCols[k]=lerp(b[0],c[0],t);skyBaseCols[k+1]=lerp(b[1],c[1],t);skyBaseCols[k+2]=lerp(b[2],c[2],t);}}
sky.setVerticesData(B.VertexBuffer.ColorKind,skyBaseCols);

/* ============================ terrain ============================ */
const R=26;
const RIVER=[[22,10],[18,13.5],[12,16.5],[7,18],[2,18.5],[-3.5,17],[-8.5,19.5],[-12.5,23.5],[-16,29]];
const riverPts=catmull(RIVER,10);
function distRiver(x,z){
  let m=1e18;
  for(let i=0;i<riverPts.length-1;i++){
    const ax=riverPts[i][0],az=riverPts[i][1],bx=riverPts[i+1][0],bz=riverPts[i+1][1];
    const dx=bx-ax,dz=bz-az;let t=((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz);t=clamp01(t);
    const px=ax+dx*t-x,pz=az+dz*t-z;const d2=px*px+pz*pz;if(d2<m)m=d2;
  }
  return Math.sqrt(m);
}
function hTop(x,z){
  const r=Math.hypot(x,z);
  const n=fbm(x*.055+13.2,7.7,z*.055+41.3,4,17);
  const hill=.8+1.6*n;
  const fall=smooth(R*.78,R*.955,r);
  let h=hill*(1-fall);
  const c=Math.max(0,1-r/(R*.4));h+=c*c*1.6;
  const d=distRiver(x,z);
  if(d<3.4){const t=1-d/3.4;h-=t*t*1.7+.12;}
  return h;
}
const ground=B.MeshBuilder.CreateGround('isle',{width:R*2,height:R*2,subdivisions:160},scene);
{
  const pos=ground.getVerticesData(B.VertexBuffer.PositionKind);
  for(let i=0;i<pos.length;i+=3)pos[i+1]=hTop(pos[i],pos[i+2]);
  ground.updateVerticesData(B.VertexBuffer.PositionKind,pos);
  ground.createNormals(true);
  const n=161,cols=new Float32Array(pos.length);
  const G1=hexA(0x3fa34d),G2=hexA(0x74cd5e),G3=hexA(0x8fd355),DIRT=hexA(0x8a6a48),ROCKD=hexA(0x5c534a),BANK=hexA(0x7c5f43);
  const cell=R*2/160;
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    const k=(j*n+i)*3;
    const xl=i>0?k-3:k,xr=i<n-1?k+3:k,yd=j>0?k-n*3:k,yu=j<n-1?k+n*3:k;
    const g=Math.hypot(pos[xr+1]-pos[xl+1],pos[yu+1]-pos[yd+1])/(2*cell);
    const x=pos[k],z=pos[k+2];
    const nv=fbm(x*.11+5.2,2.2,z*.11+9.1,3,3);
    let c=mix3(mix3(G1,G2,nv),G3,Math.max(0,nv-.55)*1.6);
    c=mix3(c,DIRT,smooth(.35,.95,g));
    c=mix3(c,ROCKD,smooth(.85,1.5,g));
    const r=Math.hypot(x,z),d=distRiver(x,z);
    if(d<5)c=mix3(c,BANK,(1-d/5)*.85);
    c=mix3(c,ROCKD,clamp01((r/R-.86)*4)*.5);
    cols[k]=c[0];cols[k+1]=c[1];cols[k+2]=c[2];
  }
  ground.setVerticesData(B.VertexBuffer.ColorKind,cols);
}
ground.material=groundVC;ground.castShadow=false;

/* jagged rock cone (island belly + chunks) */
function rockColor(x,y,z,seed){
  const n=fbm(x*.2+seed,y*.25,z*.2,3,seed+5);
  let c=mix3(hexA(0x7d6c60),hexA(0x564a42),clamp01(n*1.2));
  const band=.5+.5*Math.sin(y*1.4+n*5);
  return mix3(c,hexA(0x494039),band*.35);
}
function rockCone(name,dTop,dBot,h,y,seed){
  const m=B.MeshBuilder.CreateCylinder(name,{diameterTop:dTop,diameterBottom:dBot,height:h,tessellation:56},scene);
  m.position.y=y;
  const pos=m.getVerticesData(B.VertexBuffer.PositionKind),cols=new Float32Array(pos.length);
  for(let i=0;i<pos.length;i+=3){
    if(Math.abs(pos[i+1])<h/2-1e-3){
      const n1=fbm(pos[i]*.14+seed,pos[i+1]*.22,pos[i+2]*.14,3,seed);
      const s=1+(n1-.5)*.85;pos[i]*=s;pos[i+2]*=s;
    }
    const c=rockColor(pos[i],pos[i+1],pos[i+2],seed);
    cols[i]=c[0];cols[i+1]=c[1];cols[i+2]=c[2];
  }
  m.updateVerticesData(B.VertexBuffer.PositionKind,pos);
  m.setVerticesData(B.VertexBuffer.ColorKind,cols);
  m.createNormals(true);m.material=rockVC;m.castShadow=false;
  return m;
}
rockCone('under',R*1.92,5,15.5,-7.75,73);

/* hanging crystals */
for(let k=0;k<6;k++){
  const a=rand(0,6.28),rr=rand(5,15),s=rand(.7,1.6);
  const cr=B.MeshBuilder.CreateCone('cr',{diameter:1.1*s,height:2.6*s,tessellation:6},scene);
  cr.position.set(Math.cos(a)*rr,-rand(7.5,10.5),Math.sin(a)*rr);
  cr.rotation.z=Math.PI;cr.material=MAT.crystal;
}

/* ============================ river water + waterfalls ============================ */
const waterSamples=[];
{let end=riverPts.length;
 for(let i=0;i<riverPts.length;i++){if(Math.hypot(riverPts[i][0],riverPts[i][1])>R*.955){end=i;break;}}
 for(let i=0;i<end;i++){
   const [x,z]=riverPts[i];
   const [px,pz]=riverPts[Math.max(0,i-1)],[qx,qz]=riverPts[Math.min(end-1,i+1)];
   let tx=qx-px,tz=qz-pz;const tl=Math.hypot(tx,tz)||1;tx/=tl;tz/=tl;
   waterSamples.push({x,z,y:hTop(x,z)+.3,nx:-tz,nz:tx,w:2.3+.9*fbm(i*.35,3.3,7.7,2,8)});
 }}
function nearestWater(x,z){let b=waterSamples[0],bd=1e18;
  for(const s of waterSamples){const d=(s.x-x)**2+(s.z-z)**2;if(d<bd){bd=d;b=s;}}return b;}
const waterBase=waterSamples.flatMap(s=>[
  s.x+s.nx*s.w/2,s.y,s.z+s.nz*s.w/2, s.x-s.nx*s.w/2,s.y,s.z-s.nz*s.w/2]);
const waterMesh=new B.Mesh('river',scene);
{const P=waterBase.slice(),N=new Float32Array(waterSamples.length*6),U=[],I=[];
 waterSamples.forEach((s,i)=>{N.set([0,1,0,0,1,0],i*6);U.push(i*.35,0,i*.35,1);
   if(i<waterSamples.length-1){const a=i*2;I.push(a,a+2,a+1,a+1,a+2,b+2= a+3? a+2:0);}});
 waterMesh.setVerticesData(B.VertexBuffer.PositionKind,new Float32Array(P));
 waterMesh.setVerticesData(B.VertexBuffer.NormalKind,N);
 waterMesh.setVerticesData(B.VertexBuffer.UVKind,new Float32Array(U));
 waterMesh.setIndices(I);}
waterMesh.material=MAT.water;waterMesh.disableDepthWrite=true;
waterMesh.castShadow=false;waterMesh.receiveShfalls=false;waterMesh.receiveShadows=false;waterMesh.isPickable=false;
function updateWater(t){const p=waterMesh.getVerticesData(B.VertexBuffer.PositionKind);
  for(let i=0;i<p.length;i+=3)p[i+1]=waterBase[i+1]+.028*Math.sin(t*2.1+waterBase[i]*.55+waterBase[i+2]*.35);
  waterMesh.updateVerticesData(B.VertexBuffer.PositionKind,p);}

function cascade(cx,cz,dx,dz,topY,width,length){
  const rows=8,nx=-dz,nz=dx,P=[],N=[],U=[],I=[];

    if(i<rows){const a=i*2;I.push(a,a+2,a+1,a+1,a+2,a+3);}}

function pathSegDist(x,z){let m=1e18;
  for(const poly of PATHS)for(let i=0;i<poly.length-1;i++){
    const ax=poly[i][0],az=poly[i][1],bx=poly[i+1][0],bz=poly[i+1][1];
    const dx=bx-ax,dz=bz-az;let t=((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz);t=clamp01(t);
    const px=ax+dx*t-x,pz=az+dz*t-z;const d2=px*px+pz*pz;if(d2<m)m=d2;}
  return Math.sqrt(m);}

function buildBridge(x,z){
  const s=nearestWater(x,z);

  const baseY=s.y+.5,L=s.w+1.8,H=.85;
  const a=Math.atan2(-nz,nx),T3=new B.Vector3(tx,0,tz);
  const rotY=B.Quaternion.RotationAxis(B.Vector3.Up(),a);
  const n=11,seg=L/(n-1);
  for(let i=0;i<n;i++){
    const f=i/(n-1),off=(f-.5)*L;
    const y=baseY+H*.5*(1-Math.cos(2*Math.PI*f));
    const phi=Math.atan(H*Math.PI*Math.sin(2*Math.PI*f)/L);
    const p=B.MeshBuilder.CreateBox('pl',{width:seg*.94,height:.1,depth:2.4},scene);
    p.position.set(x+nx*off,y,z+nz*off);

    p.material=pick([MAT.wood,MAT.woodD]);
  }
  [-.95,.95].forEach(off=>{
    const t=B.MeshBuilder.CreateTorus('rail',{diameter:L,thickness:.09,tessellation:26,arc:Math.PI},scene);
    t.quaternion=rotY;t.position.set(x+tx*off,baseY+.18,z+tz*off);t.material=MAT.woodD;
    [[1,0],[1,1],[0,0],[0,1]].forEach(()=>{});
  });
  [1,-1].forEach(sd=>{
    const px=x+nx*sd*L*.55,py0=hTop(px,z+nz*sd*L*.55),pz=z+nz*sd*L*.55;
    const post=B.MeshBuilder.CreateCylinder('bp',{diameter:.22,height:baseY+0.55-py0,tessellation:8},scene);
    post.position.set(px,(baseY+0.55+py0)/2,pz);post.material=MAT.woodD;

  });
}

function localToWorld(g,lx,ly,lz){
  const c=Math.cos(g.rotation.y),s=Math.sin(g.rotation.y);
  return new B.Vector3(g.position.x+lx*c+lz*s,g.position.y+ly,g.position.z-lx*s+lz*c);}
function gable(w,rh,mat){
  const rc=w/Math.sqrt(3);
  const p=B.MeshBuilder.CreatePolygon('g',{sides:3,radius:rc},scene);
  const pos=p.getVerticesData(B.VertexBuffer.PositionKind);
  let maxY=-1e9;for(let i=1;i<pos.length;i+=3)maxY=Math.max(maxY,pos[i]);
  if(maxY<.1)p.rotation.z=Math.PI;
  p.material=mat;return p;
}

function inst(proto,poses,shadow=true){
  if(!poses.length)return null;
  const im=B.Mesh.CreateTransformedMeshes(proto.name+'_i',poses.map(p=>B.Matrix.Compose(p.p,p.q,p.s)),proto);
  if(poses[0].c)im.instanceColors=poses.map(p=>p.c);
  proto.setEnabled(false);im.castShadow=shadow;return im;
}
function findSpots(count,filter){
  const out=[];let guard=0;
  while(out.length<count&&guard++<count*60){
    const a=rand(0,6.28),rr=Math.sqrt(Math.random())*R*.96;
    const x=Math.cos(a)*rr,z=Math.sin(a)*rr;
    if(!filter(x,z))continue;
    out.push([x,z]);
  }
  return out;
}

    c:hex3(0xffffff).scale(rand(.8,1.05))})));
}

/* ============================ floating chunks / clouds / birds ============================ */
const chunks=[];
function makeChunk(x,y,z,s,tree){
  const g=new B.TransformNode('chunk');g.position.set(x,y,z);
  const top=B.MeshBuilder.CreateCylinder('ct',{diameter:6.2*s,height:1.2*s,tessellation:22},scene);
  top.parent=g;top.material=MAT.grassC;
  const body=rockCone('cb',6*s,1.4*s,6.5*s,-3.7*s,s*11+5);body.parent=g;
  if(tree)buildPine(1.1*s,0.6*s,.8*s,.9*s);
  chunks.push({node:g,baseY:y,phase:rand(0,6.28),rot0:rand(0,6.28)});
  return g;
}
makeChunk(-36,3,14,1.1,true);
makeChunk(30,-9,26,.75,false);
makeChunk(-13,-14,33,.55,false);
{ /* mini cascade on chunk A */
  cascade(-34.4,12.6,-.55,.84,-.4,.8,3.2);
  droplets(-34.4,12.6,-.4,3.2,.8,25);
}
const cloudRoot=new B.TransformNode('clouds');
for(let i=0;i<5;i++){
  const a=rand(0,6.28),rr=rand(46,72),cy=rand(13,24);
  const g=new B.TransformNode('cl');g.position.set(Math.cos(a)*rr,cy,Math.sin(a)*rr);g.parent=cloudRoot;
  const n=4+(Math.random()*3|0);
  for(let k=0;k<n;k++){
    const s2=B.MeshBuilder.CreateSphere('clb',{diameter:rand(2.6,5.6),segments:8},scene);
    s2.position.set(rand(-2.4,2.4),rand(-.6,.8),rand(-1.2,1.2));
    s2.scaling.y=.62;s2.material=MAT.cloud;s2.castShadow=false;s2.receiveShadows=false;s2.parent=g;
  }
}
const birds=[];
for(let i=0;i<3;i++){
  const g=new B.TransformNode('bird');
  const body=B.MeshBuilder.CreateSphere('bb',{diameter:.34,segments:6},scene);
  body.scaling.set(1.6,.8,1);body.material=MAT.bird;body.castShadow=false;body.parent=g;
  const wL=B.MeshBuilder.CreateBox('wl',{width:.07,height:.03,depth:.62},scene);
  wL.position.x=-.3;wL.material=MAT.bird;wL.castShadow=false;wL.parent=g;
  const wR=B.MeshBuilder.CreateBox('wr',{width:.07,height:.03,depth:.62},scene);
  wR.position.x=.3;wR.material=MAT.bird;wR.castShadow=false;wR.parent=g;
  birds.push({g,wL,wR,rr:rand(24,34),y:rand(15,20),speed:rand(.12,.2)*(Math.random()<.5?-1:1),phase:rand(0,6.28)});
}
/* waving keep-flag */
function makeFlag(width,height,mat){
  const cols=10,rows=3,P=new Float32Array((cols+1)*(rows+1)*3),N=new Float32Array(P.length),I=[],U=[];
  for(let r=0;r<=rows;r++)for(let c=0;c<=cols;c++){
    const k=r*(cols+1)+c;
    P[k*3+1]=-height*r/rows;P[k*3+2]=width*c/cols;N[k*3]=1;U.push(c/cols,r/rows);}
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const a2=r*(cols+1)+c;I.push(a2,a2+1,a2+cols+1,a2+1,a2+cols+2,a2+cols+1);}
  const m=new B.Mesh('flag',scene);
  m.setVerticesData(B.VertexBuffer.PositionKind,P);
  m.setVerticesData(B.VertexBuffer.NormalKind,N);
  m.setVerticesData(B.VertexBuffer.UVKind,new Float32Array(U));m.setIndices(I);
  m.material=mat;m.backFaceCulling=false;m.castShadow=false;m.isPickable=false;
  const base=new Float32Array(P);
  return {mesh:m,update(t){
    for(let r=0;r<=rows;r++)for(let c=0;c<=cols;c++){
      const k=r*(cols+1)+c,f=c/cols;
      P[k*3]=Math.sin(t*3.6-c*.85)*.16*f;
      P[k*3+1]=base[k*3+1]+Math.sin(t*2.8+c*.5)*.03*f;}
    m.updateVerticesData(B.VertexBuffer.PositionKind,P);}};
}
const keepFlag=makeFlag(1.7,.9,MAT.banner);
keepFlag.mesh.position.set(CASTLE.cx+.05,CASTLE.baseY+18.35,CASTLE.cz);

/* ============================ mood (day / dusk) ============================ */
const MOOD={
  day:{sun:hex3(0xfff2d8),sunI:1.25,hemI:.55,hemS:hex3(0xdceeff),fog:hex3(0xcfe9ee),fogD:.0032,
    skyT:hex3(0x5fb2ec),skyB:hex3(0xe3f2ec),water:hex3(0x41d6c8),waterE:hex3(0x0d6e68),
    glow:.12,crys:.5,cloud:hex3(0xffffff),dir:new B.Vector3(-.6,-1,-.38)},
  dusk:{sun:hex3(0xff9a55),sunI:.82,hemI:.32,hemS:hex3(0xb795c9),fog:hex3(0xf0b18c),fogD:.0038,
    skyT:hex3(0x443470),skyB:hex3(0xff9e63),water:hex3(0x6f8fd8),waterE:hex3(0x2a3f7e),
    glow:1.1,crys:1.3,cloud:hex3(0xffd3b8),dir:new B.Vector3(-.85,-.5,-.35)}};
let moodCur=0,moodTarget=0;
function applyMood(m){
  const D=MOOD.day,U=MOOD.dusk;
  sun.diffuse=B.Color3.Lerp(D.sun,U.sun,m);
  sun.intensity=lerp(D.sunI,U.sunI,m);
  sun.direction=B.Vector3.Lerp(D.dir,U.dir,m).normalize();
  hemi.intensity=lerp(D.hemI,U.hemI,m);
  hemi.groundColor=B.Color3.Lerp(hex3(0x5c4a3a),hex3(0x42304a),m);
  const fog=B.Color3.Lerp(D.fog,U.fog,m);
  scene.fogColor=fog;scene.clearColor=fog;scene.fogDensity=lerp(D.fogD,U.fogD,m);
  const sk=new Float32Array(skyTts.length*3);
  for(let i=0;i<skyTts.length;i++){
    const tt=skyTts[i],k=i*3;
    const db=[lerp(D.skyB.r,D.skyT.r,tt),lerp(D.skyB.g,D.skyT.g,tt),lerp(D.skyB.b,D.skyT.b,tt)];
    const ub=[lerp(U.skyB.r,U.skyT.r,tt),lerp(U.skyB.g,U.skyT.g,tt),lerp(U.skyB.b,U.skyT.b,tt)];
    sk[k]=lerp(db[0],ub[0],m);sk[k+1]=lerp(db[1],ub[1],m);sk[k+2]=lerp(db[2],ub[2],m);}
  sky.setVerticesData(B.VertexBuffer.ColorKind,sk);
  MAT.water.diffuse=B.Color3.Lerp(D.water,U.water,m);
  MAT.water.emissive=B.Color3.Lerp(D.waterE,U.waterE,m);
  MAT.glow.emissive=hex3(0xffd98c).scale(lerp(D.glow,U.glow,m));
  MAT.crystal.emissive=hex3(0x2fd8c8).scale(lerp(D.crys,U.crys,m));
  MAT.cloud.diffuse=B.Color3.Lerp(D.cloud,U.cloud,m);
  MAT.ember.emissive=hex3(0xff7a2e).scale(lerp(.7,1.6,m));
}
applyMood(0);

/* ============================ camera presets & UI ============================ */
const PRESETS={
  keep:{pos:[16,12,24],t:[0,6,-2]},
  village:{pos:[10,7,27],t:[1,3,12]},
  mill:{pos:[24,7,1],t:[14,3,12]},
  falls:{pos:[-26,8,10],t:[-12,2,20]},
  watch:{pos:[-27,10,-8],t:[-15,4,-19]},
  top:{pos:[6,46,10],t:[0,0,0]}};
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(name){
  const pr=PRESETS[name];if(!pr)return;
  const dv=new B.Vector3(pr.pos[0]-pr.t[0],pr.pos[1]-pr.t[1],pr.pos[2]-pr.t[2]);
  const r1=dv.length(),b1=Math.acos(B.Scalar.Clamp(dv.y/r1,-1,1));
  let da=Math.atan2(dv.x,dv.z)-camera.alpha;
  da=((da+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  flying={t0:performance.now(),dur:1500,a0:camera.alpha,da,b0:camera.beta,b1,r0:camera.radius,r1,
    tA:camera.target.clone(),tB:new B.Vector3(pr.t[0],pr.t[1],pr.t[2])};
  lastUser=performance.now();
}
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>flyTo(b.dataset.preset)));
const moodBtn=document.getElementById('moodBtn');
moodBtn.addEventListener('click',()=>{
  moodTarget=moodTarget>.5?0:1;
  moodBtn.textContent=moodTarget>.5?'☀ Day':'☾ Dusk';
  moodBtn.classList.toggle('on',moodTarget>.5);});
const orbitBtn=document.getElementById('orbitBtn');
orbitBtn.addEventListener('click',()=>{
  autoOrbit=!autoOrbit;
  orbitBtn.textContent='Orbit · '+(autoOrbit?'On':'Off');
  orbitBtn.classList.toggle('on',autoOrbit);});

/* ============================ render loop ============================ */
let lastT=performance.now();
engine.runRenderLoop(()=>{
  const now=performance.now(),dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const t=now/1000;
  if(autoOrbit&&!flying&&now-lastUser>4000)camera.alpha+=dt*.045;
  if(flying){
    const f=clamp01((now-flying.t0)/flying.dur),e=easeIO(f);
    camera.alpha=flying.a0+flying.da*e;
    camera.beta=lerp(flying.b0,flying.b1,e);
    camera.radius=lerp(flying.r0,flying.r1,e);
    camera.target=B.Vector3.Lerp(flying.tA,flying.tB,e);
    if(f>=1)flying=null;
  }
  wheelSpins.forEach(w=>w.node.rotation.y=w.base+t*w.speed);
  keepFlag.update(t);
  if(tavernSign)tavernSign.rotation.z=Math.sin(t*1.7)*.12;
  birds.forEach(b=>{
    const a=t*b.speed+b.phase;
    b.g.position.set(Math.cos(a)*b.rr,b.y+Math.sin(t*.7+b.phase)*1.4,Math.sin(a)*b.rr);
    b.g.rotation.y=-a+Math.PI/2;
    const f2=Math.sin(t*9+b.phase);
    b.wL.rotation.x=f2;b.wR.rotation.x=-f2;});
  updateWater(t);
  chunks.forEach(c=>{c.node.position.y=c.baseY+Math.sin(t*.45+c.phase)*.3;
    c.node.rotation.y=c.rot0+Math.sin(t*.12+c.phase)*.05;});
  cloudRoot.rotation.y+=dt*.004;
  MAT.ember.emissive=hex3(0xff8a3c).scale((.85+.25*Math.sin(t*11)+.15*Math.sin(t*23+1.7))*(moodTarget>.5?1.4:1));
  if(Math.abs(moodCur-moodTarget)>.0005){
    moodCur+=(moodTarget-moodCur)*Math.min(1,dt*2.5);
    applyMood(moodCur);}
  scene.render();
});
engine.onFirstRenderObservable.add(()=>setTimeout(()=>document.getElementById('veil').classList.add('hide'),350));
window.addEventListener('resize',()=>engine.resize());
</script>
