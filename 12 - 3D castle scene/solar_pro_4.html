<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Georgia', serif; }
canvas { display: block; width: 100vw; height: 100vh; }
#title {
  position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
  color: #f0e6d3; text-align: center; pointer-events: none;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  z-index: 10;
}
#title h1 {
  font-size: 22px; font-weight: 400; letter-spacing: 4px;
  margin-bottom: 4px; color: #f5e6c8;
}
#title p {
  font-size: 12px; letter-spacing: 2px; opacity: 0.7; color: #c4b59a;
}
#controls {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(240,230,211,0.5); font-size: 11px; letter-spacing: 1px;
  pointer-events: none; z-index: 10; text-align: center;
}
</style>
</head>
<body>
<div id="title">
  <h1>✦ FLOATING ISLAND DIORAMA ✦</h1>
  <p>Medieval Realm in the Clouds</p>
</div>
<canvas id="renderCanvas"></canvas>
<div id="controls">Drag to orbit · Scroll to zoom</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(() => {
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true, { antialias: true, preserveDrawingBuffer: true });

  const createScene = () => {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.35, 0.55, 0.78);
    scene.ambientColor = new BABYLON.Color3(0.4, 0.4, 0.45);

    // ─── Camera ───
    const camera = new BABYLON.ArcRotateCamera("camera", -0.65, 0.58, 22, new BABYLON.Vector3(0, 3.2, 0), scene);
    camera.lowerRadiusLimit = 12;
    camera.upperRadiusLimit = 45;
    camera.panningSensibility = 0;
    camera.wheelPrecision = 20;
    camera.attachControl(canvas, true);
    camera.keysUp = [38, 87];
    camera.keysDown = [40, 83];
    camera.keysLeft = [37, 65];
    camera.keysRight = [39, 68];
    camera.inertia = 0.9;
    camera.angularInertia = 0.9;

    // ─── Lights ───
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.2, 1, 0.3), scene);
    hemi.intensity = 0.55;
    hemi.diffuse = new BABYLON.Color3(0.85, 0.88, 0.95);
    hemi.groundColor = new BABYLON.Color3(0.25, 0.20, 0.15);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.8, -1.5, 0.6), scene);
    sun.position = new BABYLON.Vector3(-15, 25, 12);
    sun.intensity = 1.1;

    const fill = new BABYLON.DirectionalLight("fill", new BABYLON.Vector3(0.6, 0.3, -0.8), scene);
    fill.intensity = 0.35;
    fill.position = new BABYLON.Vector3(10, 8, -15);

    // ─── Shadows ───
    const shadowGen = new BABYLON.ShadowGenerator(1024, sun);
    shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.blurKernel = 20;
    shadowGen.setDarkness(0.35);

    // ─── Fog ───
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.008;
    scene.fogColor = new BABYLON.Color3(0.35, 0.55, 0.78);

    // ═══════════════════════════════════════
    // MATERIALS
    // ═══════════════════════════════════════

    const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
    grassMat.diffuseColor = new BABYLON.Color3(0.28, 0.58, 0.22);
    grassMat.specularColor = new BABYLON.Color3(0, 0, 0);
    grassMat.roughness = 0.9;

    const grassDarkMat = new BABYLON.StandardMaterial("grassDarkMat", scene);
    grassDarkMat.diffuseColor = new BABYLON.Color3(0.22, 0.48, 0.18);
    grassDarkMat.specularColor = new BABYLON.Color3(0, 0, 0);
    grassDarkMat.roughness = 0.9;

    const stoneMat = new BABYLON.StandardMaterial("stoneMat", scene);
    stoneMat.diffuseColor = new BABYLON.Color3(0.52, 0.48, 0.42);
    stoneMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
    stoneMat.roughness = 0.85;

    const stoneDarkMat = new BABYLON.StandardMaterial("stoneDarkMat", scene);
    stoneDarkMat.diffuseColor = new BABYLON.Color3(0.40, 0.37, 0.33);
    stoneDarkMat.specularColor = new BABYLON.Color3(0.03, 0.03, 0.03);
    stoneDarkMat.roughness = 0.9;

    const cliffMat = new BABYLON.StandardMaterial("cliffMat", scene);
    cliffMat.diffuseColor = new BABYLON.Color3(0.45, 0.40, 0.35);
    cliffMat.specularColor = new BABYLON.Color3(0.04, 0.04, 0.04);
    cliffMat.roughness = 0.9;

    const rockMat = new BABYLON.StandardMaterial("rockMat", scene);
    rockMat.diffuseColor = new BABYLON.Color3(0.38, 0.35, 0.30);
    rockMat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);
    rockMat.roughness = 0.95;

    const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
    woodMat.diffuseColor = new BABYLON.Color3(0.55, 0.34, 0.18);
    woodMat.specularColor = new BABYLON.Color3(0.03, 0.03, 0.02);
    woodMat.roughness = 0.8;

    const woodLightMat = new BABYLON.StandardMaterial("woodLightMat", scene);
    woodLightMat.diffuseColor = new BABYLON.Color3(0.62, 0.42, 0.25);
    woodLightMat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.01);
    woodLightMat.roughness = 0.8;

    const roofRedMat = new BABYLON.StandardMaterial("roofRedMat", scene);
    roofRedMat.diffuseColor = new BABYLON.Color3(0.62, 0.28, 0.20);
    roofRedMat.specularColor = new BABYLON.Color3(0, 0, 0);
    roofRedMat.roughness = 0.7;

    const roofBrownMat = new BABYLON.StandardMaterial("roofBrownMat", scene);
    roofBrownMat.diffuseColor = new BABYLON.Color3(0.38, 0.24, 0.14);
    roofBrownMat.specularColor = new BABYLON.Color3(0, 0, 0);
    roofBrownMat.roughness = 0.7;

    const roofGrayMat = new BABYLON.StandardMaterial("roofGrayMat", scene);
    roofGrayMat.diffuseColor = new BABYLON.Color3(0.42, 0.40, 0.38);
    roofGrayMat.specularColor = new BABYLON.Color3(0, 0, 0);
    roofGrayMat.roughness = 0.6;

    const riverMat = new BABYLON.StandardMaterial("riverMat", scene);
    riverMat.diffuseColor = new BABYLON.Color3(0.15, 0.72, 0.62);
    riverMat.specularColor = new BABYLON.Color3(0.3, 0.5, 0.5);
    riverMat.roughness = 0.2;
    riverMat.specularPower = 64;
    riverMat.alpha = 0.85;

    const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
    waterMat.diffuseColor = new BABYLON.Color3(0.12, 0.65, 0.55);
    waterMat.specularColor = new BABYLON.Color3(0.4, 0.6, 0.6);
    waterMat.roughness = 0.15;
    waterMat.specularPower = 128;
    waterMat.alpha = 0.7;

    const towerRoofMat = new BABYLON.StandardMaterial("towerRoofMat", scene);
    towerRoofMat.diffuseColor = new BABYLON.Color3(0.32, 0.30, 0.28);
    towerRoofMat.specularColor = new BABYLON.Color3(0, 0, 0);
    towerRoofMat.roughness = 0.6;

    const tavernSignMat = new BABYLON.StandardMaterial("tavernSignMat", scene);
    tavernSignMat.diffuseColor = new BABYLON.Color3(0.75, 0.20, 0.15);
    tavernSignMat.specularColor = new BABYLON.Color3(0, 0, 0);
    tavernSignMat.roughness = 0.5;

    const clothMat = new BABYLON.StandardMaterial("clothMat", scene);
    clothMat.diffuseColor = new BABYLON.Color3(0.82, 0.55, 0.25);
    clothMat.specularColor = new BABYLON.Color3(0, 0, 0);
    clothMat.roughness = 0.95;

    const clothBlueMat = new BABYLON.StandardMaterial("clothBlueMat", scene);
    clothBlueMat.diffuseColor = new BABYLON.Color3(0.20, 0.40, 0.70);
    clothBlueMat.specularColor = new BABYLON.Color3(0, 0, 0);
    clothBlueMat.roughness = 0.95;

    const foliageMat = new BABYLON.StandardMaterial("foliageMat", scene);
    foliageMat.diffuseColor = new BABYLON.Color3(0.12, 0.38, 0.10);
    foliageMat.specularColor = new BABYLON.Color3(0, 0, 0);
    foliageMat.roughness = 0.8;

    const foliageLightMat = new BABYLON.StandardMaterial("foliageLightMat", scene);
    foliageLightMat.diffuseColor = new BABYLON.Color3(0.18, 0.48, 0.14);
    foliageLightMat.specularColor = new BABYLON.Color3(0, 0, 0);
    foliageLightMat.roughness = 0.8;

    const trunkMat = new BABYLON.StandardMaterial("trunkMat", scene);
    trunkMat.diffuseColor = new BABYLON.Color3(0.32, 0.20, 0.10);
    trunkMat.specularColor = new BABYLON.Color3(0, 0, 0);
    trunkMat.roughness = 0.9;

    const sandMat = new BABYLON.StandardMaterial("sandMat", scene);
    sandMat.diffuseColor = new BABYLON.Color3(0.50, 0.42, 0.30);
    sandMat.specularColor = new BABYLON.Color3(0, 0, 0);
    sandMat.roughness = 0.95;

    const metalMat = new BABYLON.StandardMaterial("metalMat", scene);
    metalMat.diffuseColor = new BABYLON.Color3(0.28, 0.26, 0.24);
    metalMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
    metalMat.roughness = 0.4;
    metalMat.specularPower = 32;

    // ═══════════════════════════════════════
    // ISLAND
    // ═══════════════════════════════════════

    const ISLAND_RADIUS_TOP = 7.0;
    const ISLAND_RADIUS_BOTTOM = 8.8;
    const ISLAND_HEIGHT = 6.5;

    // Main island body
    const islandBody = BABYLON.MeshBuilder.CreateCylinder("islandBody", {
      height: ISLAND_HEIGHT,
      diameterTop: ISLAND_RADIUS_TOP * 2,
      diameterBottom: ISLAND_RADIUS_BOTTOM * 2,
      tessellation: 72,
    }, scene);
    islandBody.position.y = 0;
    islandBody.material = cliffMat;
    islandBody.receiveShadows = true;
    shadowGen.addShadowCaster(islandBody);

    // Stone base ring at bottom
    const baseRing = BABYLON.MeshBuilder.CreateCylinder("baseRing", {
      height: 0.8,
      diameterTop: ISLAND_RADIUS_BOTTOM * 2,
      diameterBottom: ISLAND_RADIUS_BOTTOM * 2.4,
      tessellation: 48,
    }, scene);
    baseRing.position.y = -ISLAND_HEIGHT / 2 - 0.4;
    baseRing.material = rockMat;
    baseRing.receiveShadows = true;
    shadowGen.addShadowCaster(baseRing);

    // Grass top - multiple layered discs for depth
    const grassTop = BABYLON.MeshBuilder.CreateDisc("grassTop", {
      radius: ISLAND_RADIUS_TOP - 0.05,
      tessellation: 72,
      side: BABYLON.Mesh.DOUBLESIDE,
    }, scene);
    grassTop.position.y = ISLAND_HEIGHT / 2;
    grassTop.rotation.x = Math.PI / 2;
    grassTop.material = grassMat;
    grassTop.receiveShadows = true;

    // Slight irregular grass ring
    const grassRing = BABYLON.MeshBuilder.CreateDisc("grassRing", {
      radius: ISLAND_RADIUS_TOP - 0.3,
      tessellation: 48,
      side: BABYLON.Mesh.DOUBLESIDE,
    }, scene);
    grassRing.position.y = ISLAND_HEIGHT / 2 + 0.02;
    grassRing.rotation.x = Math.PI / 2;
    grassRing.material = grassDarkMat;

    // Central grass mound (slight elevation at center)
    const centralMound = BABYLON.MeshBuilder.CreateSphere("centralMound", {
      diameterX: 3.5,
      diameterY: 0.6,
      diameterZ: 3.5,
      segments: 16,
    }, scene);
    centralMound.position.y = ISLAND_HEIGHT / 2 + 0.15;
    centralMound.scaling.y = 0.3;
    centralMound.material = grassMat;
    centralMound.receiveShadows = true;

    // Cliff edge detail - stone blocks around perimeter
    for (let i = 0; i < 28; i++) {
      const angle = (i / 28) * Math.PI * 2 + Math.random() * 0.08;
      const r = ISLAND_RADIUS_TOP + 0.1 + Math.random() * 0.3;
      const block = BABYLON.MeshBuilder.CreateBox("cliffBlock" + i, {
        width: 0.25 + Math.random() * 0.2,
        height: 0.3 + Math.random() * 0.4,
        depth: 0.25 + Math.random() * 0.2,
      }, scene);
      block.position = new BABYLON.Vector3(
        Math.cos(angle) * r,
        ISLAND_HEIGHT / 2 - 0.1 - Math.random() * 0.2,
        Math.sin(angle) * r
      );
      block.rotation.y = Math.random() * Math.PI;
      block.material = stoneDarkMat;
      block.receiveShadows = true;
      shadowGen.addShadowCaster(block);
    }

    // ═══════════════════════════════════════
    // CASTLE
    // ═══════════════════════════════════════

    const castleGroup = new BABYLON.Mesh("castleGroup", scene);
    castleGroup.position.y = ISLAND_HEIGHT / 2;

    // Grounds inside castle (stone courtyard)
    const courtyard = BABYLON.MeshBuilder.CreateDisc("courtyard", {
      radius: 3.8,
      tessellation: 32,
      side: BABYLON.Mesh.DOUBLESIDE,
    }, scene);
    courtyard.position.y = 0.02;
    courtyard.rotation.x = Math.PI / 2;
    courtyard.material = stoneDarkMat;

    // Main keep
    const keep = BABYLON.MeshBuilder.CreateBox("keep", {
      width: 3.2,
      height: 3.8,
      depth: 3.2,
    }, scene);
    keep.position = new BABYLON.Vector3(0, 1.9, 0);
    keep.material = stoneMat;
    keep.receiveShadows = true;
    shadowGen.addShadowCaster(keep);

    // Keep top crenellations (at corners and edges of the 3.2x3.2 keep)
    const keepMerlonData = [];
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const rad = 1.65;
      keepMerlonData.push({
        x: Math.cos(angle) * rad,
        z: Math.sin(angle) * rad,
        angle: angle,
      });
    }
    keepMerlonData.forEach((md, i) => {
      const merlon = BABYLON.MeshBuilder.CreateBox("merlonKeep" + i, {
        width: 0.22,
        height: 0.35,
        depth: 0.22,
      }, scene);
      merlon.position = new BABYLON.Vector3(md.x, 3.8 + 0.17, md.z);
      merlon.material = stoneMat;
      merlon.receiveShadows = true;
      shadowGen.addShadowCaster(merlon);
    });

    // Keep windows
    const windowPositions = [
      { x: 0, z: 1.65, ry: 0 },
      { x: 0, z: -1.65, ry: 0 },
      { x: 1.65, z: 0, ry: Math.PI / 2 },
      { x: -1.65, z: 0, ry: Math.PI / 2 },
    ];
    windowPositions.forEach((wp, idx) => {
      const win = BABYLON.MeshBuilder.CreateBox("winKeep" + idx, {
        width: 0.35,
        height: 0.5,
        depth: 0.08,
      }, scene);
      win.position = new BABYLON.Vector3(wp.x, 2.2, wp.z);
      win.material = new BABYLON.StandardMaterial("winMatK" + idx, scene);
      win.material.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.1);
      win.material.specularColor = new BABYLON.Color3(0, 0, 0);
      // Window frame
      const frame = BABYLON.MeshBuilder.CreateBox("frameK" + idx, {
        width: 0.45,
        height: 0.6,
        depth: 0.10,
      }, scene);
      frame.position = new BABYLON.Vector3(wp.x, 2.2, wp.z);
      frame.material = stoneDarkMat;
    });

    // Corner towers
    const towerPositions = [
      { x: 2.6, z: 2.6 },
      { x: -2.6, z: 2.6 },
      { x: -2.6, z: -2.6 },
      { x: 2.6, z: -2.6 },
    ];

    towerPositions.forEach((tp, idx) => {
      const tower = BABYLON.MeshBuilder.CreateBox("tower" + idx, {
        width: 1.1,
        height: 4.2,
        depth: 1.1,
      }, scene);
      tower.position = new BABYLON.Vector3(tp.x, 2.1, tp.z);
      tower.material = stoneMat;
      tower.receiveShadows = true;
      shadowGen.addShadowCaster(tower);

      // Tower crenellations (corners of 1.1x1.1 tower)
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2 + idx * 0.2;
        const rad = 0.6;
        const merlon = BABYLON.MeshBuilder.CreateBox("merlonT" + idx + "_" + i, {
          width: 0.18,
          height: 0.3,
          depth: 0.18,
        }, scene);
        merlon.position = new BABYLON.Vector3(
          tp.x + Math.cos(angle) * rad,
          4.2 + 0.15,
          tp.z + Math.sin(angle) * rad
        );
        merlon.material = stoneMat;
        merlon.receiveShadows = true;
        shadowGen.addShadowCaster(merlon);
      }

      // Tower roof (cone)
      const towerRoof = BABYLON.MeshBuilder.CreateCylinder("towerRoof" + idx, {
        height: 1.0,
        diameterTop: 0.05,
        diameterBottom: 1.3,
        tessellation: 12,
      }, scene);
      towerRoof.position = new BABYLON.Vector3(tp.x, 4.7, tp.z);
      towerRoof.material = towerRoofMat;
      towerRoof.receiveShadows = true;
      shadowGen.addShadowCaster(towerRoof);

      // Tower spike
      const spike = BABYLON.MeshBuilder.CreateCylinder("spike" + idx, {
        height: 0.6,
        diameterTop: 0.02,
        diameterBottom: 0.04,
        tessellation: 6,
      }, scene);
      spike.position = new BABYLON.Vector3(tp.x, 5.2, tp.z);
      spike.material = metalMat;

      // Tower door
      const door = BABYLON.MeshBuilder.CreateBox("doorT" + idx, {
        width: 0.4,
        height: 0.7,
        depth: 0.06,
      }, scene);
      door.position = new BABYLON.Vector3(tp.x, 0.35, tp.z + (idx < 2 ? 0.55 : -0.55));
      door.material = new BABYLON.StandardMaterial("doorMatT" + idx, scene);
      door.material.diffuseColor = new BABYLON.Color3(0.12, 0.08, 0.04);
      door.material.specularColor = new BABYLON.Color3(0, 0, 0);

      // Tower window
      const tw = BABYLON.MeshBuilder.CreateBox("twT" + idx, {
        width: 0.2,
        height: 0.3,
        depth: 0.05,
      }, scene);
      tw.position = new BABYLON.Vector3(tp.x, 2.8, tp.z + (idx < 2 ? 0.55 : -0.55));
      tw.material = new BABYLON.StandardMaterial("twMatT" + idx, scene);
      tw.material.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.1);
    });

    // Connecting walls
    const wallPairs = [
      { from: towerPositions[0], to: towerPositions[1] },
      { from: towerPositions[1], to: towerPositions[2] },
      { from: towerPositions[2], to: towerPositions[3] },
      { from: towerPositions[3], to: towerPositions[0] },
    ];

    wallPairs.forEach((wp, idx) => {
      const dx = wp.to.x - wp.from.x;
      const dz = wp.to.z - wp.from.z;
      const length = Math.sqrt(dx * dx + dz * dz);
      const wall = BABYLON.MeshBuilder.CreateBox("wall" + idx, {
        width: length,
        height: 2.2,
        depth: 0.5,
      }, scene);
      wall.position = new BABYLON.Vector3(
        (wp.from.x + wp.to.x) / 2,
        1.1,
        (wp.from.z + wp.to.z) / 2
      );
      wall.rotation.y = Math.atan2(dx, dz);
      wall.material = stoneMat;
      wall.receiveShadows = true;
      shadowGen.addShadowCaster(wall);

      // Wall crenellations (centered on wall edge, offset outward)
      const numMerlons = Math.floor(length / 0.55);
      const perpX = dx / length;
      const perpZ = dz / length;
      for (let i = 0; i < numMerlons; i++) {
        const t = (i + 0.5) / numMerlons;
        const merlon = BABYLON.MeshBuilder.CreateBox("merlonW" + idx + "_" + i, {
          width: 0.18,
          height: 0.3,
          depth: 0.18,
        }, scene);
        const mx = wp.from.x + dx * t;
        const mz = wp.from.z + dz * t;
        // Offset outward from wall center (wall depth is 0.5, so offset 0.3)
        merlon.position = new BABYLON.Vector3(
          mx + perpX * 0.3,
          2.2 + 0.15,
          mz + perpZ * 0.3
        );
        merlon.material = stoneMat;
        merlon.receiveShadows = true;
        shadowGen.addShadowCaster(merlon);
      }
    });

    // Gatehouse (between front towers)
    const gateWall = BABYLON.MeshBuilder.CreateBox("gateWall", {
      width: 1.8,
      height: 2.4,
      depth: 0.5,
    }, scene);
    gateWall.position = new BABYLON.Vector3(0, 1.2, 2.6);
    gateWall.material = stoneMat;
    gateWall.receiveShadows = true;
    shadowGen.addShadowCaster(gateWall);

    // Gate arch (dark opening)
    const gateArch = BABYLON.MeshBuilder.CreateBox("gateArch", {
      width: 0.7,
      height: 1.0,
      depth: 0.1,
    }, scene);
    gateArch.position = new BABYLON.Vector3(0, 0.5, 2.86);
    gateArch.material = new BABYLON.StandardMaterial("gateArchMat", scene);
    gateArch.material.diffuseColor = new BABYLON.Color3(0.03, 0.03, 0.05);
    gateArch.material.specularColor = new BABYLON.Color3(0, 0, 0);

    // Gate roof (small gable)
    const gateRoof = BABYLON.MeshBuilder.CreateBox("gateRoof", {
      width: 2.2,
      height: 0.4,
      depth: 0.6,
    }, scene);
    gateRoof.position = new BABYLON.Vector3(0, 2.45, 2.6);
    gateRoof.rotation.x = Math.PI / 2;
    // Actually let me use a triangular prism for the gate roof
    gateRoof.dispose();
    const gateRoof2 = BABYLON.MeshBuilder.CreateRibbon("gateRoof2", {
      path: [
        new BABYLON.Vector3(-1.1, 0, 0),
        new BABYLON.Vector3(0, 0.5, 0),
        new BABYLON.Vector3(1.1, 0, 0),
      ],
      width: 0.6,
      tessellation: 2,
      sideOrientation: BABYLON.Mesh.DOUBLESIDE,
    }, scene);
    gateRoof2.position = new BABYLON.Vector3(0, 2.4, 2.6);
    gateRoof2.material = stoneMat;

    // Castle flags on towers
    const flagMeshes = [];
    towerPositions.forEach((tp, idx) => {
      const pole = BABYLON.MeshBuilder.CreateCylinder("pole" + idx, {
        height: 0.8,
        diameterTop: 0.02,
        diameterBottom: 0.02,
      }, scene);
      pole.position = new BABYLON.Vector3(tp.x, 5.5, tp.z);
      pole.material = metalMat;

        // Railing posts
        for (let p = 0; p < 5; p++) {
          const post = BABYLON.MeshBuilder.CreateBox("post", {
            width: 0.02,
            height: 0.25,
            depth: 0.02,
          }, scene);
          post.position = new BABYLON.Vector3(
            x + (p - 2) * 0.25,
            ISLAND_HEIGHT / 2 + 0.125,
            z + rp
          );
          post.rotation.y = angle;
          post.material = woodMat;
        }
      });

      return group;
    }

    createBridge(-2.8, 2.1, 0.2);
    createBridge(2.0, -0.8, -0.3);

    // ═══════════════════════════════════════
    // WATERFALLS
    // ═══════════════════════════════════════

    // Main waterfall at river exit
    const wf1Pos = new BABYLON.Vector3(5.5, ISLAND_HEIGHT / 2, -5.5);
    const waterfall1 = new BABYLON.ParticleSystem("waterfall1", 3000, scene);
    waterfall1.emitter = wf1Pos;
    waterfall1.direction1 = new BABYLON.Vector3(-0.15, -1, -0.2);
    waterfall1.direction2 = new BABYLON.Vector3(0.15, -1, 0.1);
    waterfall1.minEmitBox = new BABYLON.Vector3(-0.35, 0, -0.35);
    waterfall1.maxEmitBox = new BABYLON.Vector3(0.35, 0, 0.35);
    waterfall1.color1 = new BABYLON.Color4(0.6, 0.8, 0.9, 0.7);
    waterfall1.color2 = new BABYLON.Color4(0.4, 0.65, 0.8, 0.5);
    waterfall1.colorDead = new BABYLON.Color4(0.2, 0.35, 0.45, 0);
    waterfall1.minSize = 0.08;
    waterfall1.maxSize = 0.25;
    waterfall1.minLifeTime = 0.8;
    waterfall1.maxLifeTime = 1.5;
    waterfall1.emitRate = 400;
    waterfall1.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    waterfall1.gravity = new BABYLON.Vector3(0, -0.8, 0);
    waterfall1.start();

    // Second smaller waterfall
    const wf2Pos = new BABYLON.Vector3(-6.0, ISLAND_HEIGHT / 2, 4.5);
    const waterfall2 = new BABYLON.ParticleSystem("waterfall2", 800, scene);
    waterfall2.emitter = wf2Pos;
    waterfall2.direction1 = new BABYLON.Vector3(-0.1, -1, 0.1);
    waterfall2.direction2 = new BABYLON.Vector3(0.1, -1, -0.1);
    waterfall2.minEmitBox = new BABYLON.Vector3(-0.2, 0, -0.2);
    waterfall2.maxEmitBox = new BABYLON.Vector3(0.2, 0, 0.2);
    waterfall2.color1 = new BABYLON.Color4(0.5, 0.75, 0.85, 0.6);
    waterfall2.color2 = new BABYLON.Color4(0.3, 0.55, 0.7, 0.4);
    waterfall2.colorDead = new BABYLON.Color4(0.1, 0.25, 0.35, 0);
    waterfall2.minSize = 0.06;
    waterfall2.maxSize = 0.18;
    waterfall2.minLifeTime = 0.6;
    waterfall2.maxLifeTime = 1.2;
    waterfall2.emitRate = 150;
    waterfall2.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    waterfall2.gravity = new BABYLON.Vector3(0, -0.7, 0);
    waterfall2.start();

    // Third tiny waterfall
    const wf3Pos = new BABYLON.Vector3(6.2, ISLAND_HEIGHT / 2, 3.5);
    const waterfall3 = new BABYLON.ParticleSystem("waterfall3", 500, scene);
    waterfall3.emitter = wf3Pos;
    waterfall3.direction1 = new BABYLON.Vector3(0.1, -1, 0.15);
    waterfall3.direction2 = new BABYLON.Vector3(-0.1, -1, -0.15);
    waterfall3.minEmitBox = new BABYLON.Vector3(-0.15, 0, -0.15);
    waterfall3.maxEmitBox = new BABYLON.Vector3(0.15, 0, 0.15);
    waterfall3.color1 = new BABYLON.Color4(0.5, 0.78, 0.88, 0.6);
    waterfall3.color2 = new BABYLON.Color4(0.3, 0.58, 0.72, 0.4);
    waterfall3.colorDead = new BABYLON.Color4(0.1, 0.28, 0.38, 0);
    waterfall3.minSize = 0.05;
    waterfall3.maxSize = 0.15;
    waterfall3.minLifeTime = 0.5;
    waterfall3.maxLifeTime = 1.0;
    waterfall3.emitRate = 100;
    waterfall3.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    waterfall3.gravity = new BABYLON.Vector3(0, -0.6, 0);
    waterfall3.start();

    // ═══════════════════════════════════════
    // PINE TREES
    // ═══════════════════════════════════════

    function createPineTree(x, z, scale, variant) {
      const yBase = ISLAND_HEIGHT / 2;
      const group = new BABYLON.Mesh("treeGroup", scene);

      // Trunk
      const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
        height: 0.6 * scale,
        diameterTop: 0.06 * scale,
        diameterBottom: 0.10 * scale,
        tessellation: 6,
      }, scene);
      trunk.position = new BABYLON.Vector3(x, yBase + 0.3 * scale, z);
      trunk.material = trunkMat;
      trunk.receiveShadows = true;
      shadowGen.addShadowCaster(trunk);

      const mat1 = variant ? foliageLightMat : foliageMat;
      const mat2 = variant ? foliageMat : foliageLightMat;

      // Foliage layer 1 (bottom, largest)
      const fol1 = BABYLON.MeshBuilder.CreateCylinder("fol1", {
        height: 1.0 * scale,
        diameterTop: 0.02 * scale,
        diameterBottom: 1.1 * scale,
        tessellation: 8,
      }, scene);
      fol1.position = new BABYLON.Vector3(x, yBase + 0.6 * scale + 0.5 * scale, z);
      fol1.material = mat1;
      fol1.receiveShadows = true;
      shadowGen.addShadowCaster(fol1);

      // Foliage layer 2 (middle)
      const fol2 = BABYLON.MeshBuilder.CreateCylinder("fol2", {
        height: 0.9 * scale,
        diameterTop: 0.02 * scale,
        diameterBottom: 0.85 * scale,
        tessellation: 8,
      }, scene);
      fol2.position = new BABYLON.Vector3(x, yBase + 0.6 * scale + 1.0 * scale, z);
      fol2.material = mat2;
      fol2.receiveShadows = true;
      shadowGen.addShadowCaster(fol2);

      // Foliage layer 3 (top, smallest)
      const fol3 = BABYLON.MeshBuilder.CreateCylinder("fol3", {
        height: 0.7 * scale,
        diameterTop: 0.02 * scale,
        diameterBottom: 0.55 * scale,
        tessellation: 8,
      }, scene);
      fol3.position = new BABYLON.Vector3(x, yBase + 0.6 * scale + 1.5 * scale, z);
      fol3.material = mat1;
      fol3.receiveShadows = true;
      shadowGen.addShadowCaster(fol3);

      return group;
    }

    // Scatter trees around the island
    const treePositions = [
      // Around village
      { x: -6.0, z: 3.0, s: 1.0, v: false },
      { x: -6.2, z: 1.5, s: 0.8, v: true },
      { x: -5.5, z: 5.0, s: 0.9, v: false },
      { x: -4.0, z: 5.5, s: 0.7, v: true },
      { x: 5.5, z: 4.0, s: 1.0, v: false },
      { x: 6.0, z: 2.5, s: 0.8, v: true },
      { x: 4.5, z: 5.0, s: 0.9, v: false },
      // Around mill
      { x: 5.8, z: -3.5, s: 0.8, v: true },
      { x: 6.2, z: -5.0, s: 1.0, v: false },
      { x: 4.0, z: -5.5, s: 0.7, v: true },
      // Island edges
      { x: -3.0, z: 6.0, s: 1.1, v: false },
      { x: -1.0, z: 6.2, s: 0.8, v: true },
      { x: 1.5, z: 6.0, s: 0.9, v: false },
      { x: 3.0, z: 5.8, s: 0.7, v: true },
      { x: 5.0, z: 5.5, s: 1.0, v: false },
      { x: 6.2, z: 4.8, s: 0.8, v: true },
      { x: -6.0, z: -1.0, s: 0.9, v: false },
      { x: -5.5, z: -2.5, s: 0.7, v: true },
      { x: -4.0, z: -4.5, s: 1.0, v: false },
      { x: -2.0, z: -5.5, s: 0.8, v: true },
      { x: 0.0, z: -6.0, s: 0.9, v: false },
      { x: 2.0, z: -5.8, s: 0.7, v: true },
      { x: 4.5, z: -5.5, s: 1.0, v: false },
      { x: 6.0, z: -4.5, s: 0.8, v: true },
      // Near castle (smaller, respectful distance)
      { x: -3.5, z: -2.0, s: 0.6, v: true },
      { x: 3.5, z: -2.0, s: 0.6, v: false },
      { x: -3.0, z: 2.0, s: 0.5, v: true },
      { x: 3.0, z: 2.0, s: 0.5, v: false },
    ];

    treePositions.forEach(t => createPineTree(t.x, t.z, t.s, t.v));

    // ═══════════════════════════════════════
    // RUINED WATCHTOWER
    // ═══════════════════════════════════════

    const wtX = -6.5, wtZ = -3.5;
    const wtY = ISLAND_HEIGHT / 2;

    // Tower base (partially standing)
    const wtBase = BABYLON.MeshBuilder.CreateBox("wtBase", {
      width: 0.8,
      height: 1.2,
      depth: 0.8,
    }, scene);
    wtBase.position = new BABYLON.Vector3(wtX, wtY + 0.6, wtZ);
    wtBase.material = stoneDarkMat;
    wtBase.receiveShadows = true;
    shadowGen.addShadowCaster(wtBase);

    // Tower partial wall (leaning/collapsed look)
    const wtWall = BABYLON.MeshBuilder.CreateBox("wtWall", {
      width: 0.8,
      height: 0.6,
      depth: 0.2,
    }, scene);
    wtWall.position = new BABYLON.Vector3(wtX, wtY + 1.2 + 0.3, wtZ + 0.3);
    wtWall.rotation.z = 0.15;
    wtWall.rotation.x = -0.1;
    wtWall.material = stoneDarkMat;
    wtWall.receiveShadows = true;
    shadowGen.addShadowCaster(wtWall);

    // Tower top (collapsed)
    const wtTop = BABYLON.MeshBuilder.CreateBox("wtTop", {
      width: 0.6,
      height: 0.4,
      depth: 0.6,
    }, scene);
    wtTop.position = new BABYLON.Vector3(wtX + 0.15, wtY + 1.5 + 0.2, wtZ - 0.1);
    wtTop.rotation.z = 0.3;
    wtTop.rotation.x = 0.2;
    wtTop.material = stoneDarkMat;
    wtTop.receiveShadows = true;
    shadowGen.addShadowCaster(wtTop);

    // Scattered rubble
    for (let i = 0; i < 8; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 0.3 + Math.random() * 0.8;
      const rubble = BABYLON.MeshBuilder.CreateBox("rubble" + i, {
        width: 0.1 + Math.random() * 0.15,
        height: 0.05 + Math.random() * 0.1,
        depth: 0.08 + Math.random() * 0.12,
      }, scene);
      rubble.position = new BABYLON.Vector3(
        wtX + Math.cos(angle) * dist,
        wtY + 0.05 + Math.random() * 0.05,
        wtZ + Math.sin(angle) * dist
      );
      rubble.rotation.x = Math.random() * Math.PI;
      rubble.rotation.y = Math.random() * Math.PI;
      rubble.material = stoneDarkMat;
      rubble.receiveShadows = true;
    }

    // Broken beam
    const beam = BABYLON.MeshBuilder.CreateBox("brokenBeam", {
      width: 0.08,
      height: 0.08,
      depth: 0.5,
    }, scene);
    beam.position = new BABYLON.Vector3(wtX + 0.3, wtY + 0.3, wtZ + 0.2);
    beam.rotation.x = 0.5;
    beam.rotation.z = 0.3;
    beam.material = woodMat;
    beam.receiveShadows = true;

    // ═══════════════════════════════════════
    // SCATTERED ROCKS & DETAILS
    // ═══════════════════════════════════════

    for (let i = 0; i < 25; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 1.5 + Math.random() * (ISLAND_RADIUS_TOP - 1.5);
      const rock = BABYLON.MeshBuilder.CreateSphere("rock" + i, {
        diameter: 0.08 + Math.random() * 0.15,
        segments: 4,
      }, scene);
      rock.position = new BABYLON.Vector3(
        Math.cos(angle) * dist,
        ISLAND_HEIGHT / 2 + 0.02 + Math.random() * 0.02,
        Math.sin(angle) * dist
      );
      rock.rotation.x = Math.random() * Math.PI;
      rock.rotation.y = Math.random() * Math.PI;
      rock.material = rockMat;
      rock.receiveShadows = true;
    }

    // Small flowers/grass tufts
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 1.0 + Math.random() * (ISLAND_RADIUS_TOP - 1.5);
      const tuft = BABYLON.MeshBuilder.CreateSphere("tuft" + i, {
        diameter: 0.04 + Math.random() * 0.04,
        segments: 3,
      }, scene);
      tuft.position = new BABYLON.Vector3(
        Math.cos(angle) * dist,
        ISLAND_HEIGHT / 2 + 0.04,
        Math.sin(angle) * dist
      );
      tuft.material = new BABYLON.StandardMaterial("tuftMat" + i, scene);
      const greenVar = 0.3 + Math.random() * 0.25;
      tuft.material.diffuseColor = new BABYLON.Color3(0.15 + Math.random() * 0.1, greenVar, 0.1 + Math.random() * 0.08);
      tuft.material.specularColor = new BABYLON.Color3(0, 0, 0);
    }

    // ═══════════════════════════════════════
    // ATMOSPHERE - Floating mist particles
    // ═══════════════════════════════════════

    const mistSystem = new BABYLON.ParticleSystem("mist", 500, scene);
    mistSystem.emitter = new BABYLON.Vector3(0, 5, 0);
    mistSystem.direction1 = new BABYLON.Vector3(-0.3, -0.1, -0.3);
    mistSystem.direction2 = new BABYLON.Vector3(0.3, 0.1, 0.3);
    mistSystem.minEmitBox = new BABYLON.Vector3(-8, 0, -8);
    mistSystem.maxEmitBox = new BABYLON.Vector3(8, 4, 8);
    mistSystem.color1 = new BABYLON.Color4(0.7, 0.8, 0.9, 0.08);
    mistSystem.color2 = new BABYLON.Color4(0.6, 0.75, 0.85, 0.05);
    mistSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
    mistSystem.minSize = 0.5;
    mistSystem.maxSize = 1.5;
    mistSystem.minLifeTime = 3;
    mistSystem.maxLifeTime = 6;
    mistSystem.emitRate = 30;
    mistSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
    mistSystem.gravity = new BABYLON.Vector3(0, 0.02, 0);
    mistSystem.start();

    // ═══════════════════════════════════════
    // CLOUDS
    // ═══════════════════════════════════════

    function createCloud(x, y, z, scale) {
      const group = new BABYLON.Mesh("cloudGroup", scene);
      const cloudMat = new BABYLON.StandardMaterial("cloudMat", scene);
      cloudMat.diffuseColor = new BABYLON.Color3(0.85, 0.9, 0.95);
      cloudMat.specularColor = new BABYLON.Color3(0, 0, 0);
      cloudMat.alpha = 0.7;
      cloudMat.roughness = 1;

      const numPuffs = 5 + Math.floor(Math.random() * 4);
      for (let i = 0; i < numPuffs; i++) {
        const puff = BABYLON.MeshBuilder.CreateSphere("puff" + i, {
          diameter: 0.6 + Math.random() * 0.5,
          segments: 8,
        }, scene);
        puff.position = new BABYLON.Vector3(
          (Math.random() - 0.5) * 1.5 * scale,
          (Math.random() - 0.5) * 0.3 * scale,
          (Math.random() - 0.5) * 0.8 * scale
        );
        puff.material = cloudMat;
        puff.scaling.y = 0.5 + Math.random() * 0.3;
        puff.parent = group;
      }
      group.position = new BABYLON.Vector3(x, y, z);
      group.scaling = new BABYLON.Vector3(scale, scale, scale);
      return group;
    }

    const clouds = [
      createCloud(-12, 12, -8, 2.5),
      createCloud(-8, 14, -12, 3.0),
      createCloud(5, 13, -10, 2.0),
      createCloud(12, 11, 5, 2.8),
      createCloud(15, 14, -3, 2.2),
      createCloud(-5, 15, 10, 2.6),
      createCloud(8, 12, 12, 2.4),
    ];

    // Animate clouds slowly
    scene.registerBeforeRender(() => {
      const t = Date.now() * 0.00003;
      clouds.forEach((c, i) => {
        c.position.x += Math.sin(t + i * 1.5) * 0.001;
        c.position.z += Math.cos(t * 0.7 + i * 2.0) * 0.001;
      });
    });

    // ═══════════════════════════════════════
    // GROUNDING SHADOW (soft shadow under island)
    // ═══════════════════════════════════════

    const shadowDisc = BABYLON.MeshBuilder.CreateDisc("shadowDisc", {
      radius: 12,
      tessellation: 32,
      side: BABYLON.Mesh.DOUBLESIDE,
    }, scene);
    shadowDisc.position.y = -ISLAND_HEIGHT / 2 - 0.5;
    shadowDisc.rotation.x = Math.PI / 2;
    const shadowDiscMat = new BABYLON.StandardMaterial("shadowDiscMat", scene);
    shadowDiscMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
    shadowDiscMat.alpha = 0.12;
    shadowDiscMat.specularColor = new BABYLON.Color3(0, 0, 0);
    shadowDiscMat.roughness = 1;
    shadowDisc.material = shadowDiscMat;

    // ═══════════════════════════════════════
    // ENVIRONMENT - Distant mountains (stylized)
    // ═══════════════════════════════════════

    function createDistantMountain(x, z, height, width) {
      const peak = BABYLON.MeshBuilder.CreateCylinder("dmPeak", {
        height: height,
        diameterTop: 0.05,
        diameterBottom: width,
        tessellation: 12,
      }, scene);
      peak.position = new BABYLON.Vector3(x, -ISLAND_HEIGHT / 2 - height / 2 + 0.5, z);
      const mtMat = new BABYLON.StandardMaterial("dmMat", scene);
      const hue = 0.55 + Math.random() * 0.08;
      mtMat.diffuseColor = new BABYLON.Color3(
        0.25 + Math.random() * 0.1,
        0.3 + Math.random() * 0.1,
        0.35 + Math.random() * 0.1
      );
      mtMat.specularColor = new BABYLON.Color3(0, 0, 0);
      mtMat.roughness = 1;
      peak.material = mtMat;
      return peak;
    }

    const mountains = [
      createDistantMountain(-20, -18, 3.5, 6),
      createDistantMountain(-15, -22, 4.0, 7),
      createDistantMountain(-25, -15, 2.8, 5),
      createDistantMountain(20, -20, 3.2, 6),
      createDistantMountain(25, -16, 4.5, 8),
      createDistantMountain(18, -24, 3.0, 5),
      createDistantMountain(-18, 20, 3.8, 7),
      createDistantMountain(-22, 24, 2.5, 5),
      createDistantMountain(22, 22, 3.5, 6),
      createDistantMountain(16, 25, 4.2, 7),
    ];

    // ═══════════════════════════════════════
    // WATER SURFACE BELOW (infinite misty water)
    // ═══════════════════════════════════════

    const belowWater = BABYLON.MeshBuilder.CreatePlane("belowWater", {
      size: 200,
    }, scene);
    belowWater.position.y = -ISLAND_HEIGHT / 2 - 2;
    belowWater.rotation.x = Math.PI / 2;
    const belowWaterMat = new BABYLON.StandardMaterial("belowWaterMat", scene);
    belowWaterMat.diffuseColor = new BABYLON.Color3(0.1, 0.25, 0.35);
    belowWaterMat.specularColor = new BABYLON.Color3(0.1, 0.3, 0.35);
    belowWaterMat.roughness = 0.3;
    belowWaterMat.specularPower = 32;
    belowWaterMat.alpha = 0.6;
    belowWater.material = belowWaterMat;

    // ═══════════════════════════════════════
    // FINAL SETUP
    // ═══════════════════════════════════════

    // Subtle ambient animation - trees sway slightly
    scene.registerBeforeRender(() => {
      const t = Date.now() * 0.001;
      // We'd need references to trees for swaying - skip for performance
    });

    return scene;
  };

  const scene = createScene();

  engine.runRenderLoop(() => {
    scene.render();
  });

  window.addEventListener("resize", () => {
    engine.resize();
  });
})();
</script>
</body>
</html>
