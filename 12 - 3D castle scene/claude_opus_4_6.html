<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Island Diorama</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.3.2/babylon.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1520}
canvas#c{width:100%;height:100%;display:block;touch-action:none}
#label{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:'Georgia','Times New Roman',serif;font-size:13px;letter-spacing:6px;color:rgba(230,220,200,0.35);text-transform:uppercase;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,0.5)}
#hint{position:absolute;top:14px;right:18px;font-family:'Georgia',serif;font-size:10px;color:rgba(230,220,200,0.2);pointer-events:none;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">Floating Island Diorama</div>
<div id="hint">click &amp; drag to orbit · scroll to zoom</div>
<script>
// ═══════════════════════════════════════════════════════════════
//  FLOATING ISLAND DIORAMA — Procedural Medieval World
//  Every mesh is built from Babylon.js primitives.
//  Aesthetic: handcrafted tabletop miniature, vibrant stylized.
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, true, {stencil:true});
const scene  = new BABYLON.Scene(engine);

// ┌────────────────────────────┐
// │  COLOR PALETTE             │
// └────────────────────────────┘
const C = {
  // Terrain
  grass:      [0.32, 0.58, 0.22],
  grassDark:  [0.24, 0.48, 0.16],
  grassLight: [0.42, 0.68, 0.28],
  dirt:       [0.52, 0.38, 0.22],
  rock:       [0.48, 0.44, 0.40],
  rockDark:   [0.34, 0.30, 0.28],
  rockLight:  [0.58, 0.54, 0.50],
  cliff:      [0.40, 0.36, 0.30],
  sand:       [0.78, 0.72, 0.55],
  // Castle
  stone:      [0.62, 0.58, 0.52],
  stoneDark:  [0.48, 0.44, 0.40],
  stoneLight: [0.72, 0.68, 0.62],
  roofSlate:  [0.35, 0.38, 0.45],
  roofRed:    [0.68, 0.28, 0.22],
  // Village
  wood:       [0.55, 0.35, 0.18],
  woodDark:   [0.40, 0.25, 0.12],
  woodLight:  [0.65, 0.48, 0.28],
  plaster:    [0.82, 0.78, 0.68],
  plasterWarm:[0.85, 0.75, 0.62],
  thatch:     [0.72, 0.62, 0.35],
  thatchDark: [0.58, 0.48, 0.25],
  // Nature
  pine:       [0.18, 0.42, 0.18],
  pineDark:   [0.12, 0.32, 0.12],
  pineLight:  [0.25, 0.52, 0.22],
  trunk:      [0.38, 0.25, 0.15],
  // Water
  water:      [0.15, 0.62, 0.65],
  waterDeep:  [0.08, 0.45, 0.52],
  waterFoam:  [0.75, 0.88, 0.85],
  // Misc
  fabric1:    [0.75, 0.22, 0.18],
  fabric2:    [0.22, 0.35, 0.65],
  fabric3:    [0.72, 0.58, 0.15],
  door:       [0.35, 0.22, 0.12],
  flag:       [0.72, 0.15, 0.12],
  gold:       [0.82, 0.68, 0.22],
};

function col3(c) { return new BABYLON.Color3(c[0], c[1], c[2]); }

function mat(name, diffuse, spec, specPow) {
  const m = new BABYLON.StandardMaterial(name, scene);
  m.diffuseColor = col3(diffuse);
  m.specularColor = spec ? col3(spec) : new BABYLON.Color3(0.06,0.06,0.06);
  m.specularPower = specPow || 8;
  return m;
}

// Variation helper — slightly randomize a color
function vary(c, amount) {
  const a = amount || 0.04;
  return [c[0]+rr(-a,a), c[1]+rr(-a,a), c[2]+rr(-a,a)];
}

const rr = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rr(a,b+1));
const TAU = Math.PI * 2;

// ┌────────────────────────────┐
// │  SCENE SETUP               │
// └────────────────────────────┘
scene.clearColor = new BABYLON.Color4(0.55, 0.68, 0.82, 1);
scene.ambientColor = new BABYLON.Color3(0.25, 0.28, 0.32);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogColor = new BABYLON.Color3(0.58, 0.70, 0.82);
scene.fogDensity = 0.004;

// Camera — orbit with slow auto-rotation
const camera = new BABYLON.ArcRotateCamera('cam', -Math.PI*0.6, Math.PI/3.2, 65, new BABYLON.Vector3(0,4,0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 25;
camera.upperRadiusLimit = 130;
camera.lowerBetaLimit = 0.2;
camera.upperBetaLimit = Math.PI/2.15;
camera.wheelPrecision = 5;
camera.panningSensibility = 0;
camera.useAutoRotationBehavior = true;
camera.autoRotationBehavior.idleRotationSpeed = 0.06;
camera.autoRotationBehavior.idleRotationWaitTime = 3000;

// ── Lighting ──
// Warm golden sun from upper-left
const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.45, -0.85, 0.35).normalize(), scene);
sun.intensity = 1.4;
sun.diffuse  = new BABYLON.Color3(1.0, 0.92, 0.78);
sun.specular = new BABYLON.Color3(0.6, 0.55, 0.45);

// Cool fill from opposite
const fill = new BABYLON.DirectionalLight('fill', new BABYLON.Vector3(0.5, -0.3, -0.6).normalize(), scene);
fill.intensity = 0.35;
fill.diffuse = new BABYLON.Color3(0.55, 0.65, 0.82);

// Hemisphere for ambient wrap
const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0,1,0), scene);
hemi.intensity = 0.55;
hemi.diffuse = new BABYLON.Color3(0.65, 0.72, 0.85);
hemi.groundColor = new BABYLON.Color3(0.28, 0.22, 0.18);

// Shadows from sun
const shGen = new BABYLON.ShadowGenerator(2048, sun);
shGen.useBlurExponentialShadowMap = true;
shGen.blurKernel = 24;
shGen.darkness = 0.35;

function shadow(mesh) { shGen.addShadowCaster(mesh, true); }
function receive(mesh) { mesh.receiveShadows = true; }

// ┌────────────────────────────┐
// │  SKY GRADIENT              │
// └────────────────────────────┘
const skybox = BABYLON.MeshBuilder.CreateSphere('sky', {diameter:400, segments:16, sideOrientation:BABYLON.Mesh.BACKSIDE}, scene);
const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
skyMat.emissiveColor = new BABYLON.Color3(0.55, 0.68, 0.82);
skyMat.diffuseColor  = BABYLON.Color3.Black();
skyMat.specularColor = BABYLON.Color3.Black();
skyMat.disableLighting = true;
skybox.material = skyMat;

// ═══════════════════════════════════════════════════════════════
//  SECTION 1: FLOATING ISLAND BASE
// ═══════════════════════════════════════════════════════════════

// ── Top terrain surface (flattened sphere for organic shape) ──
const terrain = BABYLON.MeshBuilder.CreateSphere('terrain', {diameter:52, segments:24}, scene);
terrain.scaling = new BABYLON.Vector3(1.1, 0.12, 1.0);
terrain.position.y = 0;
terrain.material = mat('grassMat', C.grass);
receive(terrain);

// Second grass layer slightly different shade for depth
const terrainB = BABYLON.MeshBuilder.CreateSphere('terrainB', {diameter:48, segments:16}, scene);
terrainB.scaling = new BABYLON.Vector3(1.0, 0.14, 0.95);
terrainB.position.y = 0.15;
terrainB.material = mat('grassMatB', C.grassDark);
receive(terrainB);

// ── Rocky underside ──
const underside = BABYLON.MeshBuilder.CreateSphere('under', {diameter:42, segments:16}, scene);
underside.scaling = new BABYLON.Vector3(1.0, 0.45, 0.9);
underside.position.y = -5.5;
underside.material = mat('cliffMat', C.cliff);
shadow(underside);

// Jagged rocks hanging below
for (let i = 0; i < 20; i++) {
  const angle = rr(0, TAU);
  const rad = rr(3, 18);
  const h = rr(3, 10);
  const w = rr(0.8, 2.5);
  const rock = BABYLON.MeshBuilder.CreateCylinder('urock'+i, {
    diameterTop: 0, diameterBottom: w, height: h, tessellation: ri(5,8)
  }, scene);
  rock.position.set(Math.cos(angle)*rad, -6 - h/2 - rr(0,3), Math.sin(angle)*rad);
  rock.rotation.x = rr(-0.15, 0.15);
  rock.rotation.z = rr(-0.15, 0.15);
  rock.material = mat('urockMat'+i, vary(C.rockDark, 0.06));
  shadow(rock);
}

// Stalactites (thin pointy cones)
for (let i = 0; i < 12; i++) {
  const a = rr(0, TAU);
  const r = rr(1, 12);
  const st = BABYLON.MeshBuilder.CreateCylinder('stal'+i, {
    diameterTop: 0, diameterBottom: rr(0.3, 0.8), height: rr(2, 5), tessellation: 5
  }, scene);
  st.position.set(Math.cos(a)*r, -9 - rr(0,5), Math.sin(a)*r);
  st.material = mat('stalMat'+i, vary(C.rockLight, 0.05));
}

// ── Cliff edges around the island rim ──
for (let i = 0; i < 32; i++) {
  const a = (i/32)*TAU + rr(-0.08, 0.08);
  const rad = 22 + rr(-2, 3);
  const w = rr(1.5, 4);
  const h = rr(2, 5);
  const d = rr(2, 5);
  const cliff = BABYLON.MeshBuilder.CreateBox('cliff'+i, {width:w, height:h, depth:d}, scene);
  cliff.position.set(Math.cos(a)*rad, -h/2 + rr(-1, 0.5), Math.sin(a)*rad);
  cliff.rotation.y = a + rr(-0.3, 0.3);
  cliff.rotation.x = rr(-0.15, 0.15);
  cliff.material = mat('cliffMat'+i, vary(C.rock, 0.06));
  shadow(cliff);
  receive(cliff);
}

// ── Dirt paths (flattened boxes on terrain) ──
function path(x, z, w, d, rot) {
  const p = BABYLON.MeshBuilder.CreateBox('path', {width:w, height:0.08, depth:d}, scene);
  p.position.set(x, 0.75, z);
  p.rotation.y = rot || 0;
  p.material = mat('dirtMat', vary(C.dirt, 0.03));
  receive(p);
}

path(0, -3, 2.2, 14, 0);
path(-5, -8, 12, 2, 0.15);
path(6, -6, 2, 8, 0.4);
path(-8, 0, 2, 10, -0.3);
path(8, 3, 2.5, 8, 0.2);

// ═══════════════════════════════════════════════════════════════
//  SECTION 2: MEDIEVAL CASTLE (center)
// ═══════════════════════════════════════════════════════════════

const castleY = 1.0; // Base height

// ── Castle Keep (main building) ──
const keep = BABYLON.MeshBuilder.CreateBox('keep', {width:8, height:7, depth:7}, scene);
keep.position.set(0, castleY + 3.5, 3);
keep.material = mat('stoneMat', C.stone);
shadow(keep); receive(keep);

// Keep roof (flat with crenellations simulated by small boxes)
const keepRoof = BABYLON.MeshBuilder.CreateBox('keepRoof', {width:8.5, height:0.4, depth:7.5}, scene);
keepRoof.position.set(0, castleY + 7.2, 3);
keepRoof.material = mat('stoneRoofMat', C.stoneDark);
shadow(keepRoof);

// Crenellations (merlons) on keep
for (let i = 0; i < 12; i++) {
  const merlon = BABYLON.MeshBuilder.CreateBox('merlon'+i, {width:0.7, height:0.8, depth:0.7}, scene);
  let mx, mz;
  if (i < 4) { mx = -3.5 + i * 2.3; mz = 3 - 3.2; }
  else if (i < 8) { mx = -3.5 + (i-4) * 2.3; mz = 3 + 3.2; }
  else if (i < 10) { mx = -3.8; mz = 3 - 1.5 + (i-8) * 3; }
  else { mx = 3.8; mz = 3 - 1.5 + (i-10) * 3; }
  merlon.position.set(mx, castleY + 7.8, mz);
  merlon.material = keep.material;
  shadow(merlon);
}

// Keep windows (dark insets)
const windowMat = mat('windowMat', [0.12, 0.10, 0.08]);
for (let r = 0; r < 2; r++) {
  for (let c = 0; c < 3; c++) {
    const win = BABYLON.MeshBuilder.CreateBox('kwin', {width:0.6, height:1.0, depth:0.15}, scene);
    win.position.set(-2 + c * 2, castleY + 3 + r * 2.5, 3 - 3.55);
    win.material = windowMat;
  }
}

// Keep door
const keepDoor = BABYLON.MeshBuilder.CreateBox('kdoor', {width:1.8, height:2.8, depth:0.2}, scene);
keepDoor.position.set(0, castleY + 1.4, 3 - 3.55);
keepDoor.material = mat('doorMat', C.door);

// ── Corner Towers (4) ──
function castleTower(x, z, height, roofColor) {
  const h = height || 9;
  const tower = BABYLON.MeshBuilder.CreateCylinder('tower', {diameter:3.5, height:h, tessellation:10}, scene);
  tower.position.set(x, castleY + h/2, z);
  tower.material = mat('towerMat', vary(C.stone, 0.03));
  shadow(tower); receive(tower);

  // Cone roof
  const roof = BABYLON.MeshBuilder.CreateCylinder('troof', {diameterTop:0, diameterBottom:4.5, height:3, tessellation:10}, scene);
  roof.position.set(x, castleY + h + 1.5, z);
  roof.material = mat('troofMat', roofColor || C.roofSlate);
  shadow(roof);

  // Tower crenellations
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*TAU;
    const m = BABYLON.MeshBuilder.CreateBox('tmerl', {width:0.5, height:0.7, depth:0.5}, scene);
    m.position.set(x + Math.cos(a)*1.9, castleY + h + 0.35, z + Math.sin(a)*1.9);
    m.material = tower.material;
  }

  // Slit windows
  for (let j = 0; j < 3; j++) {
    const a = (j/3)*TAU + 0.3;
    const sw = BABYLON.MeshBuilder.CreateBox('swin', {width:0.25, height:0.9, depth:0.15}, scene);
    sw.position.set(x + Math.cos(a)*1.8, castleY + h*0.5 + j*0.3, z + Math.sin(a)*1.8);
    sw.rotation.y = a;
    sw.material = windowMat;
  }
}

castleTower(-5, -0.5, 10, C.roofSlate);
castleTower(5, -0.5, 9, C.roofSlate);
castleTower(-5, 6.5, 9.5, C.roofSlate);
castleTower(5, 6.5, 11, C.roofSlate);  // Tallest tower

// ── Curtain Walls connecting towers ──
function wall(x1, z1, x2, z2, height) {
  const dx = x2-x1, dz = z2-z1;
  const len = Math.sqrt(dx*dx + dz*dz);
  const h = height || 5;
  const w = BABYLON.MeshBuilder.CreateBox('wall', {width:1.0, height:h, depth:len}, scene);
  w.position.set((x1+x2)/2, castleY + h/2, (z1+z2)/2);
  w.rotation.y = Math.atan2(dx, dz);
  w.material = mat('wallMat', vary(C.stone, 0.02));
  shadow(w); receive(w);

  // Wall-top walkway
  const top = BABYLON.MeshBuilder.CreateBox('wtop', {width:1.4, height:0.2, depth:len+0.5}, scene);
  top.position.set((x1+x2)/2, castleY + h + 0.1, (z1+z2)/2);
  top.rotation.y = w.rotation.y;
  top.material = mat('wtopMat', C.stoneDark);
  shadow(top);
}

wall(-5, -0.5, 5, -0.5, 5);   // Front wall
wall(-5, 6.5, 5, 6.5, 5);     // Back wall
wall(-5, -0.5, -5, 6.5, 5);   // Left wall
wall(5, -0.5, 5, 6.5, 5);     // Right wall

// ── Gate / Portcullis ──
const gateArch = BABYLON.MeshBuilder.CreateBox('gate', {width:2.5, height:3.5, depth:1.2}, scene);
gateArch.position.set(0, castleY + 1.75, -0.5);
gateArch.material = mat('gateMat', C.stoneDark);
shadow(gateArch);

const gateHole = BABYLON.MeshBuilder.CreateBox('gateHole', {width:1.6, height:2.8, depth:1.3}, scene);
gateHole.position.set(0, castleY + 1.4, -0.5);
gateHole.material = mat('gateHoleMat', [0.08, 0.06, 0.05]);

// Flag on tallest tower
const flagPole = BABYLON.MeshBuilder.CreateCylinder('fpole', {diameter:0.1, height:3}, scene);
flagPole.position.set(5, castleY + 13.5, 6.5);
flagPole.material = mat('fpoleMat', C.woodDark);

const flag = BABYLON.MeshBuilder.CreateBox('flag', {width:2, height:1.2, depth:0.05}, scene);
flag.position.set(6, castleY + 14.5, 6.5);
flag.material = mat('flagMat', C.flag);
shadow(flag);

// ═══════════════════════════════════════════════════════════════
//  SECTION 3: VILLAGE BUILDINGS
// ═══════════════════════════════════════════════════════════════

// ── Generic House Builder ──
function house(x, z, w, d, h, rot, wallColor, roofColor, hasDoor, hasChimney) {
  const parent = new BABYLON.TransformNode('house', scene);
  const by = 0.85;

  // Walls
  const walls = BABYLON.MeshBuilder.CreateBox('hw', {width:w, height:h, depth:d}, scene);
  walls.position.set(0, by + h/2, 0);
  walls.material = mat('hwMat', wallColor || C.plaster);
  walls.parent = parent;
  shadow(walls); receive(walls);

  // Timber frame beams (horizontal and vertical lines)
  const bMat = mat('beamMat', vary(C.woodDark, 0.04));
  // Corner beams
  for (const sx of [-1,1]) {
    for (const sz of [-1,1]) {
      const beam = BABYLON.MeshBuilder.CreateBox('beam', {width:0.12, height:h+0.1, depth:0.12}, scene);
      beam.position.set(sx*(w/2-0.05), by+h/2, sz*(d/2-0.05));
      beam.material = bMat;
      beam.parent = parent;
    }
  }
  // Horizontal beam
  const hbeam = BABYLON.MeshBuilder.CreateBox('hbeam', {width:w+0.1, height:0.12, depth:0.12}, scene);
  hbeam.position.set(0, by+h*0.55, -d/2+0.05);
  hbeam.material = bMat;
  hbeam.parent = parent;

  // Roof (triangular prism via scaled rotated box — two slanted planes)
  const roofH = h * 0.55;
  const roofW = w + 0.8;
  for (const side of [-1, 1]) {
    const roofPanel = BABYLON.MeshBuilder.CreateBox('roof', {width:roofW/1.7, height:0.15, depth:d+0.6}, scene);
    roofPanel.position.set(side * roofW * 0.22, by + h + roofH * 0.45, 0);
    roofPanel.rotation.z = side * 0.62;
    roofPanel.material = mat('roofMat', roofColor || C.thatch);
    roofPanel.parent = parent;
    shadow(roofPanel);
  }
  // Roof ridge
  const ridge = BABYLON.MeshBuilder.CreateBox('ridge', {width:0.2, height:0.15, depth:d+0.7}, scene);
  ridge.position.set(0, by + h + roofH * 0.72, 0);
  ridge.material = mat('ridgeMat', vary(roofColor || C.thatchDark, 0.03));
  ridge.parent = parent;

  // Gable ends (triangles approximated as thin wedge)
  for (const sz of [-1,1]) {
    const gable = BABYLON.MeshBuilder.CreateCylinder('gable', {
      diameterTop:0, diameterBottom:w*0.85, height:roofH*0.7, tessellation:3
    }, scene);
    gable.position.set(0, by + h + roofH*0.3, sz*(d/2+0.05));
    gable.rotation.y = Math.PI/6;
    gable.scaling.z = 0.05;
    gable.material = walls.material;
    gable.parent = parent;
  }

  // Door
  if (hasDoor !== false) {
    const door = BABYLON.MeshBuilder.CreateBox('door', {width:0.7, height:1.4, depth:0.08}, scene);
    door.position.set(0, by + 0.7, -d/2 - 0.01);
    door.material = mat('doorMat', C.door);
    door.parent = parent;
  }

  // Windows
  for (const sx of [-0.3, 0.3]) {
    const win = BABYLON.MeshBuilder.CreateBox('win', {width:0.45, height:0.45, depth:0.08}, scene);
    win.position.set(sx * w * 0.7, by + h * 0.6, -d/2 - 0.01);
    win.material = mat('winMat', [0.55, 0.72, 0.82]);
    win.parent = parent;
  }

  // Chimney
  if (hasChimney) {
    const ch = BABYLON.MeshBuilder.CreateBox('chimney', {width:0.6, height:1.8, depth:0.6}, scene);
    ch.position.set(w*0.3, by + h + 0.9, d*0.2);
    ch.material = mat('chMat', C.stoneDark);
    ch.parent = parent;
    shadow(ch);
  }

  parent.position.set(x, 0, z);
  parent.rotation.y = rot || 0;
  return parent;
}

// Place village houses around the castle
house(-10, -4, 3.2, 2.8, 2.5, 0.3, C.plaster, C.thatch, true, true);
house(-12, -1, 2.8, 2.5, 2.2, -0.2, C.plasterWarm, C.thatchDark, true, false);
house(-9, 2, 3.0, 2.6, 2.8, 0.5, C.plaster, C.roofRed, true, true);
house(9, -5, 2.6, 2.4, 2.3, -0.4, C.plasterWarm, C.thatch, true, false);
house(11, -2, 3.4, 3.0, 2.6, 0.1, C.plaster, C.thatchDark, true, true);
house(10, 2, 2.5, 2.2, 2.0, -0.6, vary(C.plaster, 0.04), C.roofRed, true, false);

// ── TAVERN (larger building with distinctive roof) ──
const tavern = house(-11, -7, 4.5, 3.5, 3.2, 0.15, C.plasterWarm, C.roofRed, true, true);

// Tavern sign (hanging board)
const signPole = BABYLON.MeshBuilder.CreateBox('spole', {width:0.1, height:1.5, depth:0.1}, scene);
signPole.position.set(-10.2, 2.8, -8.8);
signPole.material = mat('spoleMat', C.wood);
const signBoard = BABYLON.MeshBuilder.CreateBox('sign', {width:1.0, height:0.6, depth:0.08}, scene);
signBoard.position.set(-10.2, 2.2, -9.2);
signBoard.material = mat('signMat', C.woodDark);

// Tavern barrels
for (let i = 0; i < 3; i++) {
  const barrel = BABYLON.MeshBuilder.CreateCylinder('barrel'+i, {diameter:0.6, height:0.8, tessellation:10}, scene);
  barrel.position.set(-12.8 + i*0.7, 1.25, -7.5);
  barrel.rotation.x = Math.PI/2;
  barrel.material = mat('barrelMat', vary(C.wood, 0.05));
  shadow(barrel);
}

// ── MARKET STALLS ──
function marketStall(x, z, rot, fabricColor) {
  const parent = new BABYLON.TransformNode('stall', scene);

  // Posts
  for (const sx of [-1,1]) {
    for (const sz of [-1,1]) {
      const post = BABYLON.MeshBuilder.CreateCylinder('post', {diameter:0.12, height:2.5, tessellation:6}, scene);
      post.position.set(sx*1.1, 2.1, sz*0.8);
      post.material = mat('postMat', C.wood);
      post.parent = parent;
      shadow(post);
    }
  }

  // Canopy (angled flat box)
  const canopy = BABYLON.MeshBuilder.CreateBox('canopy', {width:2.8, height:0.06, depth:2.0}, scene);
  canopy.position.set(0, 3.3, 0);
  canopy.rotation.x = 0.15;
  canopy.material = mat('canopyMat', fabricColor);
  canopy.parent = parent;
  shadow(canopy);

  // Counter table
  const counter = BABYLON.MeshBuilder.CreateBox('counter', {width:2.2, height:0.12, depth:1.4}, scene);
  counter.position.set(0, 1.7, 0);
  counter.material = mat('counterMat', C.woodLight);
  counter.parent = parent;

  // Wares (small spheres/boxes on counter)
  for (let i = 0; i < 4; i++) {
    const ware = BABYLON.MeshBuilder.CreateSphere('ware', {diameter:0.25+rr(0,0.15), segments:5}, scene);
    ware.position.set(-0.6 + i*0.4, 1.9, rr(-0.3,0.3));
    ware.material = mat('wareMat', [rr(0.3,0.9), rr(0.2,0.7), rr(0.1,0.5)]);
    ware.parent = parent;
  }

  parent.position.set(x, 0, z);
  parent.rotation.y = rot || 0;
}

// ── Wooden Bridges ──
function bridge(x, z, rot, length) {
  const parent = new BABYLON.TransformNode('bridge', scene);
  const l = length || 5;

  // Planks
  const planks = BABYLON.MeshBuilder.CreateBox('planks', {width:l, height:0.15, depth:2.2}, scene);
  planks.position.y = 1.2;
  planks.material = mat('plankMat', C.woodLight);
  planks.parent = parent;
  shadow(planks); receive(planks);

  // Individual plank lines
  for (let i = 0; i < 6; i++) {
    const line = BABYLON.MeshBuilder.CreateBox('pline', {width:l-0.2, height:0.02, depth:0.04}, scene);
    line.position.set(0, 1.3, -0.8 + i * 0.32);
    line.material = mat('plineMat', C.woodDark);
    line.parent = parent;
  }

  // Railings
  for (const side of [-1,1]) {
    const rail = BABYLON.MeshBuilder.CreateBox('rail', {width:l, height:0.08, depth:0.08}, scene);
    rail.position.set(0, 1.9, side * 1.15);
    rail.material = mat('railMat', C.wood);
    rail.parent = parent;

    // Posts
    for (let i = 0; i < 4; i++) {
      const post = BABYLON.MeshBuilder.CreateCylinder('bpost', {diameter:0.1, height:0.8, tessellation:6}, scene);
      post.position.set(-l/2 + 0.5 + i * (l-1)/3, 1.55, side * 1.15);
      post.material = rail.material;
      post.parent = parent;
    }
  }

  parent.position.set(x, 0, z);
  parent.rotation.y = rot || 0;
}

function pineTree(x, z, scale) {
  const s = scale || 1;

  // Trunk
  const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', {
    diameterTop: 0.15*s, diameterBottom: 0.35*s, height: 2*s, tessellation: 6
  }, scene);
  trunk.position.set(x, 0.85 + s, z);
  trunk.material = mat('trunkMat', vary(C.trunk, 0.04));
  shadow(trunk);

  // Foliage tiers (3-4 stacked cones)
  const tiers = 3 + (s > 1.2 ? 1 : 0);
  for (let t = 0; t < tiers; t++) {
    const tierH = 1.8 * s - t * 0.15;
    const tierD = (3 - t * 0.55) * s;
    const cone = BABYLON.MeshBuilder.CreateCylinder('pine'+t, {
      diameterTop: 0, diameterBottom: tierD, height: tierH, tessellation: 8
    }, scene);
    cone.position.set(x, 0.85 + 1.8*s + t * 1.1 * s, z);
    cone.material = mat('pineMat', vary(t%2===0 ? C.pine : C.pineDark, 0.05));
    shadow(cone);
  }
}

// ── Fence sections near village ──
function fence(x1, z1, x2, z2) {
  const dx = x2-x1, dz = z2-z1;
  const len = Math.sqrt(dx*dx+dz*dz);
  const fMat = mat('fenceMat', C.wood);

  // Rail
  const rail = BABYLON.MeshBuilder.CreateBox('frail', {width:0.06, height:0.06, depth:len}, scene);
  rail.position.set((x1+x2)/2, 1.45, (z1+z2)/2);
  rail.rotation.y = Math.atan2(dx, dz);
  rail.material = fMat;

  // Lower rail
  const rail2 = rail.clone('frail2');
  rail2.position.y = 1.15;

  // Posts
  const posts = Math.ceil(len / 1.5);
  for (let i = 0; i <= posts; i++) {
    const t = i / posts;
    const post = BABYLON.MeshBuilder.CreateCylinder('fpost', {diameter:0.08, height:0.9, tessellation:5}, scene);
    post.position.set(x1 + dx*t, 1.3, z1 + dz*t);
    post.material = fMat;
    shadow(post);
  }
}

//  SECTION 10: FLOATING PARTICLES & CLOUDS
// ═══════════════════════════════════════════════════════════════

// Clouds drifting around (low-poly translucent spheres)
const clouds = [];
for (let i = 0; i < 12; i++) {
  const a = rr(0, TAU);
  const r = rr(30, 60);
  const cloudGroup = new BABYLON.TransformNode('cloud'+i, scene);
  cloudGroup.position.set(Math.cos(a)*r, rr(8, 22), Math.sin(a)*r);

  // Each cloud = 3-5 merged puffy spheres
  const numPuffs = ri(3, 5);
  for (let j = 0; j < numPuffs; j++) {
    const puff = BABYLON.MeshBuilder.CreateSphere('puff'+i+'_'+j, {
      diameter: rr(3, 7), segments: 6
    }, scene);
    puff.position.set(rr(-2, 2), rr(-0.5, 0.5), rr(-1.5, 1.5));
    puff.scaling.y = rr(0.3, 0.5);
    const pMat = mat('cloudMat'+i+'_'+j, [0.92, 0.94, 0.96]);
    pMat.alpha = rr(0.35, 0.55);
    pMat.specularColor = BABYLON.Color3.Black();
    pMat.disableLighting = true;
    pMat.emissiveColor = new BABYLON.Color3(0.88, 0.9, 0.94);
    puff.material = pMat;
    puff.parent = cloudGroup;
  }

  clouds.push({ node: cloudGroup, speed: rr(0.008, 0.02), angle: a, radius: r });
}

// ═══════════════════════════════════════════════════════════════
//  SECTION 11: ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════

let time = 0;

scene.registerBeforeRender(() => {
  const dt = engine.getDeltaTime() / 1000;
  time += dt;

  // ── Rotate water wheel ──
  wheelParent.rotation.x = time * 0.8;

  // ── Animate clouds drifting ──
  for (const c of clouds) {
    c.angle += c.speed * dt;
    c.node.position.x = Math.cos(c.angle) * c.radius;
    c.node.position.z = Math.sin(c.angle) * c.radius;
  }

  // ── Flag waving ──
  flag.rotation.z = Math.sin(time * 3) * 0.12;
  flag.rotation.x = Math.sin(time * 2.3) * 0.06;

  // ── Gentle waterfall shimmer ──
  waterMat_r.diffuseColor = new BABYLON.Color3(
    0.15 + Math.sin(time * 1.5) * 0.03,
    0.62 + Math.sin(time * 2.0) * 0.04,
    0.65 + Math.cos(time * 1.8) * 0.03
  );

  // ── Gentle island bob — the whole world floating ──
  terrain.position.y = Math.sin(time * 0.4) * 0.15;
  terrainB.position.y = 0.15 + Math.sin(time * 0.4) * 0.15;
});

// ── Render loop ──
engine.runRenderLoop(() => scene.render());
window.addEventListener('resize', () => engine.resize());
