<script>
"use strict";
/* -------------------------------------------------------------
   Floating Isle diorama — Babylon.js (single file)
----------------------------------------------------------------*/
const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, true, { stencil: true });
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05, 0.07, 0.14, 1.0);
scene.ambientColor = new BABYLON.Color3(0.25, 0.28, 0.4);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = 0.0045;
scene.fogColor = new BABYLON.Color3(0.45, 0.55, 0.7);

camera.attachControl(canvas, true);

camera.upperBetaLimit = Math.PI*0.49;
camera.lowerBetaLimit = 0.1;
camera.fov = 0.7;

// Warm key light (sun)

sun.intensity = 1.1;
sun.diffuse = new BABYLON.Color3(1.0, 0.9, 0.78);
// Soft cool bounce from above

// Warm rim

rim.diffuse = new BABYLON.Color3(1, 0.65, 0.4);

/* -------------- Skybox: soft gradient --------------- */
(function sky(){

  skyMat.useSunPosition = true;
  skyMat.sunPosition = new BABYLON.Vector3(-0.4, 0.3, -0.6);
  skyMat.turbidity = 7;

  skyMat.cameraOffset.y = -100;
  const sky = BABYLON.MeshBuilder.CreateBox("sky", { size: 1800 }, scene);
  sky.material = skyMat;
  sky.infiniteDistance = true;
})();

/* ---------- Clouds: a few drifting sprites ---------- */
const clouds = [];
(function makeClouds(){
  const cloudMat = new BABYLON.StandardMaterial("cm", scene);
  cloudMat.disableLighting = true;
  cloudMat.emissiveColor = new BABYLON.Color3(1,1,1);
  cloudMat.alpha = 0.6;
  for (let i=0;i<20;i++){
    const cloud = BABYLON.MeshBuilder.CreateSphere("c"+i, { diameterX:40+Math.random()*40, diameterY:8+Math.random()*4, diameterZ:18+Math.random()*22, segments:6 }, scene);
    cloud.material = cloudMat;
    const a = Math.random()*Math.PI*2;
    const r = 220 + Math.random()*220;
    cloud.position.set(Math.cos(a)*r, 90 + Math.random()*70, Math.sin(a)*r);
    cloud.rotation.y = Math.random()*0.3;
    clouds.push({ m:cloud, sp:2+Math.random()*2.5 });
  }
})();

/* ===================== MATERIALS ===================== */
function mat(name, hex, opts={}) {
  const m = new BABYLON.StandardMaterial(name, scene);
  m.diffuseColor = BABYLON.Color3.FromHexString(hex);
  m.specularColor = opts.spec === false ? BABYLON.Color3.Black() : new BABYLON.Color3(0.12, 0.1, 0.08);
  if (opts.emissive) m.emissiveColor = BABYLON.Color3.FromHexString(opts.emissive);
  if (opts.rough) m.specularPower = 8;
  return m;
}
const stoneMat   = mat("stone",  "#8c8478", { rough:true });
const stoneDark = mat("stoneD", "#5b564d");
const wallMat   = mat("wall",   "#b0a28a", { rough:true });
const roofMat   = mat("roof",   "#8b352c");
const roofMat2  = mat("roofD",  "#5e231d");
const woodMat   = mat("wood",   "#6a3f22");
const woodDk    = mat("woodD",  "#3d2413");
const plaster   = mat("plast",  "#e5d6b1");
const grassMat  = mat("grass",  "#4e823a");
const grassDk   = mat("grassD", "#2f5b24");
const dirtMat   = mat("dirt",   "#6d5135");
const rockMat   = mat("rock",   "#665d50");
const rockDark  = mat("rockD",  "#3a342d");
const waterMat  = new BABYLON.StandardMaterial("water", scene);
waterMat.diffuseColor = new BABYLON.Color3(0.25, 0.75, 0.9);
waterMat.specularColor = new BABYLON.Color3(0.4, 0.8, 1);
waterMat.specularPower = 128;
waterMat.emissiveColor = new BABYLON.Color3(0.05, 0.2, 0.3);
waterMat.alpha = 0.85;
waterMat.bumpTexture = null;
const glassMat = new BABYLON.StandardMaterial("glass", scene);
glassMat.diffuseColor = new BABYLON.Color3(0.5, 0.7, 0.9);
glassMat.alpha = 0.5;
glassMat.specularColor = new BABYLON.Color3(1,1,1);
const goldMat = new BABYLON.StandardMaterial("gold", scene);
goldMat.diffuseColor = BABYLON.Color3.FromHexString("#e0b75a");
goldMat.emissiveColor = BABYLON.Color3.FromHexString("#3a2a0e");
goldMat.specularColor = new BABYLON.Color3(0.9, 0.8, 0.4);
const treeDark = mat("treet", "#244a2a");
const treeMid  = mat("treem", "#3b7338");

/* ===================== VERTEX-COLORED LOW-POLY TERRAIN =====================
   Build an irregular, roughly circular island with cliffs down to a rocky
   bottom, using a heightmap and baking normals.
------------------------------------------------------------------------ */
const ISLAND_R = 78;
const GRID = 96;
const rng = (function(){ let s = 1234; return function() { s = (s*1664525 + 1013904223)|0; return ((s>>>0)/4294967296); }; })();

function hash(x, y){
  const n = Math.sin(x*12.9898 + y*78.233 + 43.4) * 43758.5453;
  return n - Math.floor(n);
}
function smooth(t){ return t*t*(3-2*t); }
function vnoise(x, y){
  let xi = Math.floor(x), yi = Math.floor(y);
  let xf = x-xi, yf = y-yi;
  const a = hash(xi,yi), b = hash(xi+1, yi), c = hash(xi, yi+1), d = hash(xi+1, yi+1);
  const u = smooth(xf), v = smooth(yf);
  return (a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v);
}
function fbm(x, y){
  let amp=1, f=1, sum=0, n=0;
  for (let i=0;i<5;i++){ sum += amp*vnoise(x*f, y*f); n += amp; amp*=0.5; f*=2.0; }
  return sum/n;
}

function getHeight(x, z) {
  const r = Math.sqrt(x*x + z*z);
  if (r > ISLAND_R - 1) return -40;
  // Island falls off steeply near the rim
  const edge = 1 - Math.min(1, Math.max(0, (r - (ISLAND_R-18))/18));
  const edgeE = Math.pow(edge, 1.6);
  // Base rolling terrain
  let h = fbm(x*0.035 + 4, z*0.035 + 11) * 10;
  // Central hill for the castle
  const dxc = x - 5;
  const dzc = z + 2;
  const dc = Math.sqrt(dxc*dxc + dzc*dzc);
  h += Math.max(0, 1 - dc/32) * 28;
  // River valley carved by the diagonal stream
  const riverT = (x - z) * 0.55;
  const riverW = 16;
  const river = Math.exp(-(riverT*riverT)/(riverW*riverW)) * 9;
  h -= river;
  // Cliffs / bottom taper — negative values make the underside
  const base = -22 + edgeE * 50;
  h = Math.max(base, h * edgeE + 6);
  // Add a gentle rim lip (so edges look like cliffs)
  if (r > ISLAND_R - 10) h = Math.min(h, -2);
  return h;
}

function buildIsland() {
  const positions = [];
  const indices = [];
  const colors = [];
  const normals = [];
  const uv = [];
  const step = 2;
  const W = GRID;
  const hs = new Float32Array((W+1)*(W+1));
  const cx = 0;
  // Sample heights
  for (let j=0;j<=W;j++){
    for (let i=0;i<=W;i++){
      const x = -ISLAND_R + i*(ISLAND_R*2)/W;
      const z = -ISLAND_R + j*(ISLAND_R*2)/W;
      let h = getHeight(x, z);
      // tiny jitter for low-poly look
      h += (hash(i,j) - 0.5) * 0.3;
      hs[j*(W+1)+i] = h;
    }
  }
  for (let j=0;j<=W;j++){
    for (let i=0;i<=W;i++){
      const x = -ISLAND_R + i*(ISLAND_R*2)/W;
      const z = -ISLAND_R + j*(ISLAND_R*2)/W;
      const h = hs[j*(W+1)+i];
      positions.push(x, h, z);
      uv.push(i/8, j/8);
      // color by height / slope
      let col;
      if (h < 1.5) col = [0.4, 0.35, 0.28]; // dirt/rock
      else if (h < 6) col = [0.36, 0.62, 0.27]; // grass
      else if (h < 12) col = [0.30, 0.52, 0.22]; // dark grass
      else col = [0.35, 0.31, 0.27]; // rock summit
      // cliff undersides: grey-brown
      const r = Math.sqrt(x*x + z*z);
      if (r > ISLAND_R - 12 || h < -12) col = [0.36, 0.32, 0.28];
      // variation
      const v = 0.85 + hash(i,j)*0.3;
      colors.push(col[0]*v, col[1]*v, col[2]*v, 1);
    }
  }
  // Bottom "dirt" cap for underside (just use same grid with h = -26 and darker color)
  const bottomStart = positions.length/3;
  for (let j=0;j<=W;j++){
    for (let i=0;i<=W;i++){
      const x = -ISLAND_R + i*(ISLAND_R*2)/W;
      const z = -ISLAND_R + j*(ISLAND_R*2)/W;
      positions.push(x, -32, z);
      uv.push(i/8, j/8);
      colors.push(0.30, 0.26, 0.22, 1);
    }
  }
  // Top indices
  function idx(i,j, base=0){ return base + j*(W+1) + i; }
  for (let j=0;j<W;j++){
    for (let i=0;i<W;i++){
      const i0 = idx(i,j), i1 = idx(i+1,j), i2 = idx(i,j+1), i3 = idx(i+1,j+1);
      const h0 = hs[j*(W+1)+i], h1 = hs[j*(W+1)+i+1], h2 = hs[(j+1)*(W+1)+i], h3 = hs[(j+1)*(W+1)+i+1];
      if (Math.min(h0,h1,h2,h3) < -25) continue;
      indices.push(i0, i2, i1, i1, i2, i3);
    }
  }
  // Bottom indices (flipped winding)
  for (let j=0;j<W;j++){
    for (let i=0;i<W;i++){
      const i0 = idx(i,j,bottomStart), i1 = idx(i+1,j,bottomStart), i2 = idx(i,j+1,bottomStart), i3 = idx(i+1,j+1,bottomStart);
      indices.push(i0, i1, i2, i1, i3, i2);
    }
  }
  // Side walls (stitching top rim to bottom rim, only where top edge was clipped)
  for (let j=0;j<=W;j++){
    for (let i=0;i<=W;i++){
      const x = -ISLAND_R + i*(ISLAND_R*2)/W;
      const z = -ISLAND_R + j*(ISLAND_R*2)/W;
      const r = Math.sqrt(x*x + z*z);
      if (r > ISLAND_R-13) {
        // add vertical "skirt" quads
        const ti = j*(W+1)+i;
        const bi = bottomStart + ti;
        // vertical column already exists? we'll add wall quads only at edge cells
      }
    }
  }
  const vd = new BABYLON.VertexData();
  vd.positions = positions;
  vd.indices = indices;
  vd.colors = colors;
  vd.uvs = uv;
  // compute normals
  BABYLON.VertexData.ComputeNormals(positions, indices, normals);
  vd.normals = normals;
  const mesh = new BABYLON.Mesh("island", scene);
  vd.applyToMesh(mesh, true);
  const mat = new BABYLON.StandardMaterial("islandMat", scene);
  mat.specularColor = new BABYLON.Color3(0.05,0.05,0.04);
  mat.specularPower = 6;
  mesh.material = mat;
  mesh.useVertexColors = true;
  return mesh;
}
const island = buildIsland();

/* ===================== RIVER / WATER ===================== */
/* The river runs along the carved valley, then drops off the edge
   as a waterfall. Build a ribbon mesh, then a small pool/lake near
   the mill, plus falling water sheets.                                       */
function buildRiver() {
  // Define river path in local x,z — from castle moat, through village, off SW edge
  const pts = [
    new BABYLON.Vector3(-5, 0,  6),
    new BABYLON.Vector3(-14,0, 14),
    new BABYLON.Vector3(-22,0, 22),
    new BABYLON.Vector3(-30,0, 30),
    new BABYLON.Vector3(-38,0, 40),
    new BABYLON.Vector3(-55,0, 52),
  ];
  // Sample y from terrain
  const mat = waterMat;
  // Catmull-Rom smoothing & then generate ribbon
  function catmull(p0, p1, p2, p3, t){
    const t2 = t*t, t3 = t2*t;
    return new BABYLON.Vector3(
      0.5*(2*p1.x + (-p0.x+p2.x)*t + (2*p0.x-5*p1.x+4*p2.x-p3.x)*t2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
      0,
      0.5*(2*p1.z + (-p0.z+p2.z)*t + (2*p0.z-5*p1.z+4*p2.z-p3.z)*t2 + (-p0.z+3*p1.z-3*p2.z+p3.z)*t3)
    );
  }
  const smooth = [];
  for (let i=0;i<pts.length-1;i++){
    const p0 = pts[Math.max(0,i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1,i+2)];
    for (let s=0; s<14; s++){
      const t = s/14;
      const p = catmull(p0,p1,p2,p3,t);
      // compute y as getHeight(x,z) + 0.5
      p.y = getHeight(p.x, p.z) + 0.3;
      smooth.push(p);
    }
  }
  // Build ribbon (two sides, width ~3)
  const positions = [];
  const indices = [];
  const uvs = [];
  const widths = [];
  // compute tangents & perpendiculars
  for (let i=0;i<smooth.length;i++){
    const p = smooth[i];
    const pp = smooth[Math.max(0,i-1)];
    const pn = smooth[Math.min(smooth.length-1,i+1)];
    const tx = pn.x - pp.x, tz = pn.z - pp.z;
    const tl = Math.hypot(tx, tz) || 1;
    // perpendicular in XZ plane (rotate 90)
    let nx = -tz/tl, nz = tx/tl;
    const w = i < 8 ? 2.2 : (i > smooth.length-8 ? 3.8 : 3.0);
    widths.push(w);
    positions.push(p.x - nx*w, p.y, p.z - nz*w, p.x + nx*w, p.y, p.z + nz*w);
    uvs.push(i/smooth.length, 0, i/smooth.length, 1);
  }
  for (let i=0;i<smooth.length-1;i++){
    const a = i*2, b = i*2+1, c = i*2+2, d = i*2+3;
    indices.push(a,b,d, a,d,c);
  }
  const vd = new BABYLON.VertexData();
  vd.positions = positions;
  vd.indices = indices;
  vd.uvs = uvs;
  const n = [];
  BABYLON.VertexData.ComputeNormals(positions, indices, n);
  vd.normals = n;
  const mesh = new BABYLON.Mesh("river", scene);
  vd.applyToMesh(mesh, true);
  mesh.material = mat;

  // Waterfall at the end (a tapered flat sheet)
  const wf = positions;
  const end = smooth[smooth.length-1];
  const fend = new BABYLON.Vector3(end.x - 16, -14, end.z + 10);
  const fallPositions = [];
  const fallIndices = [];
  const segs = 12;
  const w = widths[widths.length-1];
  for (let i=0;i<=segs;i++){
    const t = i/segs;
    const y = end.y - t*28;
    const x = BABYLON.Scalar.Lerp(end.x, fend.x, t);
    const z = BABYLON.Scalar.Lerp(end.z, fend.z, t);
    const nw = w * (1-t*0.4);
    const tan = new BABYLON.Vector3(fend.x-end.x,0,fend.z-end.z).normalize();
    const nx = -tan.z*nw, nz = tan.x*nw;
    fallPositions.push(x-nx, y, z-nz, x+nx, y, z+nz);
  }
  for (let i=0;i<segs;i++){
    const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3;
    fallIndices.push(a,b,d,a,d,c);
  }
  const fvd = new BABYLON.VertexData();
  fvd.positions = fallPositions;
  fvd.indices = fallIndices;
  const fn=[];
  BABYLON.VertexData.ComputeNormals(fallPositions, fallIndices, fn);
  fvd.normals = fn;
  const fall = new BABYLON.Mesh("waterfall", scene);
  fvd.applyToMesh(fall, true);
  fall.material = mat;
  return { mesh, fall, smooth, widths };
}
const river = buildRiver();

/* ---------- Procedural water ripples (uv offset) ---------- */
const waterStart = performance.now();
scene.registerBeforeRender(() => {
  const t = (performance.now() - waterStart)/1000;
  const m = waterMat as any;
  (waterMat as any).diffuseColor.b; // noop just make sure
  river.mesh.position.y = Math.sin(t*1.2)*0.05;
  river.fall.position.y = Math.sin(t*1.5)*0.1;
});

/* ===================== PROPS / BUILDINGS ===================== */
const castleGroup = new BABYLON.TransformNode("castle", scene);
const villageGroup = new BABYLON.TransformNode("village", scene);
const treesGroup = new BABYLON.TransformNode("trees", scene);
const rocksGroup = new BABYLON.TransformNode("rocks", scene);

// Helpers
function box(parent, w, h, d, mat, x,y,z, opts={}) {
  const m = BABYLON.MeshBuilder.CreateBox("b", { width:w, height:h, depth:d }, scene);
  m.parent = parent;
  m.position.set(x,y,z);
  m.material = mat;
  if (opts.ry) m.rotation.y = opts.ry;
  return m;
}
function cyl(parent, h, radiusT, radiusB, tess, mat, x,y,z, opts={}) {
  const m = BABYLON.MeshBuilder.CreateCylinder("c", { height:h, diameterTop: radiusT*2, diameterBottom: radiusB*2, tessellation: tess }, scene);
  m.parent = parent;
  m.position.set(x,y,z);
  m.material = mat;
  if (opts.ry) m.rotation.y = opts.ry;
  return m;
}
function cone(parent, h, r, tess, mat, x,y,z) {
  const m = BABYLON.MeshBuilder.CreateCone("co", { height:h, diameterBottom: r*2, tessellation: tess }, scene);
  m.parent = parent;
  m.position.set(x,y,z);
  m.material = mat;
  return m;
}

/* ================ CASTLE ================ */
(function buildCastle(){
  // Base plateau
  box(castleGroup, 24, 3, 24, stoneDark, 0, 1.5, 0);
  box(castleGroup, 20, 3, 20, stoneMat, 0, 4.5, 0);
  // Outer walls
  const wallY = 9, wallT = 1.6, wallH = 8;
  // 4 walls around
  box(castleGroup, 24, wallH, wallT, wallMat, 0, wallY, -10);
  box(castleGroup, 24, wallH, wallT, wallMat, 0, wallY, 10);
  box(castleGroup, wallT, wallH, 24, wallMat, -12, wallY, 0);
  box(castleGroup, wallT, wallH, 24, wallMat, 12, wallY, 0);
  // Crenellations
  for (let side=0; side<4; side++){
    const n = 10;
    for (let i=0;i<n;i++){
      if (i%2===1) continue;
      const f = (i - n/2 + 0.5) * 2.2;
      if (side < 2) box(castleGroup, 1.2, 1.4, 1.6, wallMat, f, wallY+wallH/2+0.7, side===0?-10:10);
      else         box(castleGroup, 1.6, 1.4, 1.2, wallMat, side===2?-12:12, wallY+wallH/2+0.7, f);
    }
  }
  // 4 corner towers
  const tpos = [[-12,10],[12,10],[-12,-10],[12,-10]];
  for (const [tx,tz] of tpos){
    cyl(castleGroup, 14, 3.2, 3.6, 8, stoneMat, tx, 7, tz);
    cone(castleGroup, 4.5, 3.6, 8, roofMat, tx, 16, tz);
    // little turret window
    cyl(castleGroup, 0.6, 0.3, 0.3, 6, stoneDark, tx, 12, tz+3.7);
  }
  // Gatehouse with gate
  box(castleGroup, 5, 10, 3.6, wallMat, 0, wallY, -10);
  box(castleGroup, 3.4, 5.5, 0.4, woodDk, 0, wallY-2, -12.2);
  // Gatehouse roof
  cone(castleGroup, 3.5, 4.2, 4, roofMat, 0, wallY+6.5, -10);
  // Inner keep
  box(castleGroup, 8, 16, 8, plaster, 0, 15, 0);
  // Keep roof pyramid
  cone(castleGroup, 6.5, 5.8, 4, roofMat, 0, 25, 0);
  // Windows on keep
  for (let yy=0; yy<3; yy++){
    for (let s=0;s<4;s++){
      const ang = s*Math.PI/2;
      const wx = Math.round(Math.cos(ang)*4.1);
      const wz = Math.round(Math.sin(ang)*4.1);
      box(castleGroup, 0.6, 1.2, 0.1, glassMat, wx, 11+yy*4, wz, { ry: -ang });
    }
  }
  // Flag pole
  cyl(castleGroup, 8, 0.15, 0.15, 6, woodDk, 0, 32, 0);
  // Flag (cone + box)
  const flag = BABYLON.MeshBuilder.CreateDisc("fl", { radius: 2, tessellation: 3, arc: 0.5, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  flag.parent = castleGroup;
  flag.rotation.z = Math.PI/2;
  flag.position.set(1.1, 35, 0);
  const fmat = mat("flag", "#b83a3a");
  flag.material = fmat;
  // Smaller side tower inside
  box(castleGroup, 3, 12, 3, stoneMat, 7, 10, 7);
  cone(castleGroup, 4, 2.5, 6, roofMat, 7, 18, 7);

  // Terrace & stairs down
  for (let i=0;i<4;i++){
    box(castleGroup, 8-i*1.2, 0.8, 3, stoneMat, 0, 0.8 - i*0.8, -12 - i*1.3);
  }
})();

/* ============== Village houses ============== */
function makeCottage(x,z, opts = {}) {
  const g = new BABYLON.TransformNode("h", villageGroup);
  g.position.set(x, getHeight(x,z)+0.3, z);
  const w = opts.w || (3.5 + rng()*2);
  const d = opts.d || (3.5 + rng()*2);
  const h = 2.2 + rng()*1.2;
  const rot = opts.ry || (rng()*0.6 - 0.3);
  // stone/wood base
  box(g, w, 0.6, d, opts.stone?stoneMat:woodMat, 0, 0.3, 0, {ry:rot});
  // plaster walls
  box(g, w-0.2, h, d-0.2, plaster, 0, 0.6+h/2, 0, {ry:rot});
  // Roof as two box planes (low-poly A-frame)
  const roofH = 2.2;
  const roof = new BABYLON.TransformNode("roof", g);
  roof.rotation.y = rot;
  const r1 = box(roof, w*1.05, 0.2, d*0.6, opts.darkRoof?roofMat2:roofMat, 0, h+roofH*0.5, d*0.3);
  r1.rotation.x = -0.5;
  const r2 = box(roof, w*1.05, 0.2, d*0.6, opts.darkRoof?roofMat2:roofMat, 0, h+roofH*0.5, -d*0.3);
  r2.rotation.x = 0.5;
  // chimney
  if (opts.chimney!==false && rng() > 0.4){
    box(g, 0.6, 2.2, 0.6, stoneMat, w*0.25, h + 1.3, -d*0.1, {ry:rot});
    box(g, 0.8, 0.4, 0.8, stoneDark, w*0.25, h + 2.6, -d*0.1, {ry:rot});
  }
  // door
  box(g, 0.9, 1.6, 0.1, woodDk, 0, 0.8+0.8, d/2-0.2, {ry:rot});
  // windows
  for (let s of [-1, 1]){
    box(g, 0.5, 0.6, 0.08, glassMat, s*(w/2-0.2), 1.8, 0, {ry:rot});
  }
  return g;
}
function makeMarketStall(x, z) {
  const g = new BABYLON.TransformNode("stall", villageGroup);
  g.position.set(x, getHeight(x,z)+0.3, z);
  const rot = rng()*Math.PI;
  box(g, 3.5, 0.2, 2.4, woodDk, 0, 0.8, 0, {ry:rot});
  // posts
  for (const [px,pz] of [[-1.5,-1],[1.5,-1],[-1.5,1],[1.5,1]]){
    box(g, 0.18, 2, 0.18, woodMat, px, 1.8, pz, {ry:rot});
  }
  // roof (stretched cone/plane)
  const canvas = BABYLON.MeshBuilder.CreateBox("ro", { width:4, height:0.1, depth:3 }, scene);
  canvas.parent = g;
  canvas.rotation.x = -0.35;
  canvas.position.y = 3.1;
  canvas.material = roofMat;
  // barrel
  cyl(g, 0.9, 0.45, 0.5, 8, woodMat, -1.2, 0.8, 0.8, {ry:rot});
  // apples/produce: small spheres
  for (let i=0; i<6; i++){
    const a = BABYLON.MeshBuilder.CreateSphere("a", { diameter:0.32 }, scene);
    a.parent = g;
    a.position.set(-0.8 + rng()*1.6, 1.0, -0.8 + rng()*1.6);
    a.material = rng()<0.5 ? mat("app", "#b83a3a") : mat("orc", "#d9831f");
  }
}
function makeMill(x,z) {
  const g = new BABYLON.TransformNode("mill", villageGroup);
  g.position.set(x, getHeight(x,z)+0.3, z);
  const rot = 0.2;
  // stone base
  box(g, 5, 1, 5, stoneDark, 0, 0.5, 0, {ry:rot});
  // tapered body
  const body = BABYLON.MeshBuilder.CreateCylinder("b", { diameterTop: 3.6, diameterBottom: 4.6, height: 7, tessellation: 12 }, scene);
  body.parent = g; body.position.y = 4.5; body.material = plaster;
  // conical roof
  cone(g, 3, 3, 12, roofMat, 0, 9.5, 0);
  // water wheel on river side
  const wheel = BABYLON.MeshBuilder.CreateTorus("t", { diameter: 6, thickness: 0.6, tessellation: 12 }, scene);
  wheel.parent = g;
  wheel.rotation.z = Math.PI/2;
  wheel.position.set(-3.8, 1.2, -2.5);
  wheel.material = woodMat;
  // paddles
  for (let i=0;i<10;i++){
    const p = box(g, 0.2, 2.2, 0.8, woodDk, 0,0,0);
    p.parent = wheel;
    const a = (i/10)*Math.PI*2;
    p.position.set(Math.cos(a)*3, Math.sin(a)*3, 0);
    p.rotation.z = a;
  }
  // wheel spins
  g.metadata = { wheel };
  // door
  box(g, 1.0, 1.8, 0.1, woodDk, 0, 1.4, 2.4, {ry:rot});
}
function makeTavern(x,z){
  const g = makeCottage(x, z, { w:7, d:5, stone:true, chimney:true, darkRoof:true });
  // sign
  const sign = box(g, 1.2, 0.8, 0.08, mat("sign","#e6d07a"), 0, 3.0, 2.7);
}
function makeWell(x, z){
  const g = new BABYLON.TransformNode("well", villageGroup);
  g.position.set(x, getHeight(x,z)+0.3, z);
  cyl(g, 0.8, 0.9, 1.1, 10, stoneDark, 0, 0.6, 0);
  box(g, 2.4, 0.2, 0.2, woodMat, 0, 2.2, -1);
  box(g, 2.4, 0.2, 0.2, woodMat, 0, 2.2, 1);
  box(g, 0.2, 2.4, 0.2, woodMat, -1.1, 1.2, 0);
  box(g, 0.2, 2.4, 0.2, woodMat, 1.1, 1.2, 0);
  // small roof
  const r = box(g, 3, 0.15, 2, roofMat2, 0, 3.0, 0);
  r.rotation.x = -0.2;
}
function makeBridge(x, z, rot){
  const g = new BABYLON.TransformNode("bridge", villageGroup);
  g.position.set(x, getHeight(x,z)+0.3, z);
  g.rotation.y = rot;
  // arch (simple planked bridge over river)
  box(g, 8, 0.6, 2.8, woodMat, 0, 0.3, 0);
  box(g, 8, 0.2, 3.2, woodDk, 0, 0.7, 0);
  // railings
  for (let s=-1; s<=1; s+=2){
    for (let i=-3;i<=3;i+=1){
      box(g, 0.2, 1.3, 0.2, woodMat, i*1.1, 1.5, s*1.3);
    }
    box(g, 8, 0.15, 0.15, woodDk, 0, 2.2, s*1.3);
  }
}
function makeWatchtower(x, z, isRuin=false){
  const g = new BABYLON.TransformNode(isRuin?"ruin":"tower", villageGroup);
  g.position.set(x, getHeight(x,z)+0.3, z);
  const h = isRuin? 6 : 12;
  cyl(g, h, 2.4, 2.8, 8, isRuin?rockDark:stoneMat, 0, h/2, 0);
  if (!isRuin) {
    cone(g, 4, 2.8, 8, roofMat2, 0, h+2, 0);
    // battlement
    for (let i=0;i<8;i++){
      const a = (i/8)*Math.PI*2;
      box(g, 0.6, 1, 0.6, stoneDark, Math.cos(a)*2.6, h+0.4, Math.sin(a)*2.6);
    }
  } else {
    // broken crenellations
    for (let i=0;i<5;i++){
      const a = (i/8)*Math.PI*2;
      box(g, 0.7, 0.4+rng()*0.7, 0.7, rockDark, Math.cos(a)*2.6, h - 0.2 + rng()*0.5, Math.sin(a)*2.6);
    }
    // missing chunk
    const chunk = BABYLON.MeshBuilder.CreateBox("ch", {width:1.6, height:0.8, depth:1.6}, scene);
    chunk.parent = g;
    chunk.position.set(0, h+0.3, 0);
    chunk.material = rockDark;
    chunk.isVisible = false;
  }
  return g;
}
function pine(x,z, s=1){
  const g = new BABYLON.TransformNode("pine", treesGroup);
  g.position.set(x, getHeight(x,z)+0.2, z);
  g.scaling.setAll(s);
  cyl(g, 2.2, 0.35, 0.45, 6, woodDk, 0, 1.1, 0);
  cone(g, 3, 1.9, 6, treeMid, 0, 4, 0);
  cone(g, 2.6, 1.5, 6, treeDark, 0, 5.6, 0);
  cone(g, 2.0, 1.1, 6, treeDark, 0, 7.0, 0);
  return g;
}
function rock(x, z, s){
  const m = BABYLON.MeshBuilder.CreatePolyhedron("rk", { type: 1, size: s }, scene);
  m.parent = rocksGroup;
  m.position.set(x, getHeight(x,z)+s*0.4, z);
  m.rotation.set(rng()*6, rng()*6, rng()*6);
  m.material = rng()<0.5 ? rockMat : rockDark;
  return m;
}

// ---- place castle (already centered)
castleGroup.position.set(0, 0, 0);

// ---- village along the river and around the mill
makeMill(-38, 38);
makeTavern(-25, 18);
makeWell(-22, 25);
makeBridge(-38, 34, Math.atan2(-38- -55, 34-52));
makeMarketStall(-20, 12);
makeMarketStall(-30, 22);
makeMarketStall(-15, 24);
// Cottages
const cottagePositions = [
  [-18, 8, {}], [-24, 0, {}], [-30, 10, {stone:true}], [-14, -4, {}], [-38, 28, {darkRoof:true}],
  [-42, 46, {}], [-48, 38, {w:3,d:3}], [-55, 48, {}], [-52, 60, {stone:true}],
  [-60, 44, {}], [-66, 60, {w:3,d:3}], [-32, -6, {}], [-8, 22, {stone:true}],
];
for (const [x,z,o] of cottagePositions) makeCottage(x,z,o);

// Ruined watchtower near edge
makeWatchtower(55, -20, true);
// intact watchtower opposite
makeWatchtower(-38, -50, false);

// ---- scattered pines
const treePositions = [
  [-20,-30,1.1], [5,-38,0.9], [-50,-24,1.0], [30,-28,1.2], [-8, 30, 0.8], [20, 20, 1.0],
  [40, 10, 0.9], [34, -10, 0.7], [-55, 0, 1.1], [22, 30, 1.0], [-60, 30, 0.8],
  [50, -50, 1.1], [-30, -60, 1.0], [60, 30, 0.9], [58, 2, 1.2], [-46, 64, 0.8],
  [-68, 54, 1.0], [-70, 10, 1.0], [-10, -60, 0.85], [30, 44, 0.7]
];
for (const [x,z,s] of treePositions) pine(x,z,s);

// Rocks (near cliffs especially)
for (let i=0;i<70;i++){
  const a = rng()*Math.PI*2;
  const r = 45 + rng()*35;
  const x = Math.cos(a)*r, z = Math.sin(a)*r;
  if (Math.hypot(x,z) > ISLAND_R-10) rock(x, z, 0.8 + rng()*1.8);
  else if (rng() < 0.3) rock(x + (rng()-0.5)*10, z + (rng()-0.5)*10, 0.6 + rng()*1.3);
}
// Ruin stones near broken tower
for (let i=0;i<10;i++) rock(55 + (rng()-0.5)*8, -20 + (rng()-0.5)*8, 0.8 + rng()*1.2);

// ---- Watermill wheel rotation
scene.registerBeforeRender(() => {
  const dt = engine.getDeltaTime()/1000;
  villageGroup.getChildren(undefined, true).forEach((node: any) => {
    if (node.metadata && node.metadata.wheel) {
      node.metadata.wheel.rotation.z += dt * 0.6;
    }
  });
});

/* ---------- Tiny warm windows glow at night? Here fake emissive dots ---------- */
(function lanterns(){
  const lmat = new BABYLON.StandardMaterial("lan", scene);
  lmat.disableLighting = true;
  lmat.emissiveColor = new BABYLON.Color3(1.2, 0.8, 0.3);
  for (const [x,y,z] of [
    [0, 7.5, -10], [-12, 12, 10], [12, 12, 10],
    [-25, 4, 18], [-38, 6, 40], [-55, 4, 48], [22, 4, 0]
  ]){
    const s = BABYLON.MeshBuilder.CreateSphere("l", { diameter: 0.6 }, scene);
    s.parent = castleGroup;
    s.position.set(x,y,z);
    s.material = lmat;
  }
})();

/* Soft floating dust motes via SPS */
(function dust(){
  const sps = new BABYLON.SolidParticleSystem("dust", scene);
  const p = BABYLON.MeshBuilder.CreateSphere("p", { diameter: 0.3 }, scene);
  sps.addShape(p, 220);
  sps.buildMesh();
  const dmat = new BABYLON.StandardMaterial("dm", scene);
  dmat.disableLighting = true;
  dmat.emissiveColor = new BABYLON.Color3(1,0.9,0.7);
  dmat.alpha = 0.5;
  sps.mesh.material = dmat;
  sps.initParticles = function(){};
  for (const pa of sps.particles) {
    pa.position.set((Math.random()-0.5)*200, 10 + Math.random()*80, (Math.random()-0.5)*200);
    pa.scaling.setAll(0.3 + Math.random()*0.7);
    pa.color = new BABYLON.Color4(1, 0.9, 0.7, 0.3);
    (pa as any).vy = 0.3 + Math.random()*0.6;
  }
  sps.setParticles();
  scene.registerBeforeRender(() => {
    for (const pa of sps.particles) {
      pa.position.y += (pa as any).vy * engine.getDeltaTime()/1000;
      if (pa.position.y > 140) pa.position.y = -5;
    }
    sps.setParticles();
  });
})();

/* Birds */
(function birds(){
  const mat = new BABYLON.StandardMaterial("bm", scene);
  mat.disableLighting = true;
  mat.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.12);
  const shape = BABYLON.MeshBuilder.CreateDisc("b", { radius: 0.4, tessellation: 3 }, scene);
  const sps = new BABYLON.SolidParticleSystem("bsps", scene);
  sps.addShape(shape, 24);
  sps.buildMesh();
  sps.mesh.material = mat;
  for (const p of sps.particles){
    p.position.set((Math.random()-0.5)*280, 80 + Math.random()*60, (Math.random()-0.5)*280);
    p.scaling.setAll(0.6 + Math.random());
    (p as any).ang = Math.random()*Math.PI*2;
    (p as any).spd = 0.3 + Math.random()*0.4;
  }
  scene.registerBeforeRender(() => {
    const t = performance.now()/1000;
    for (const p of sps.particles){
      p.position.x += Math.cos((p as any).ang) * (p as any).spd * engine.getDeltaTime()/1000;
      p.position.z += Math.sin((p as any).ang) * (p as any).spd * engine.getDeltaTime()/1000;
      p.rotation.z = Math.sin(t*6 + (p as any).ang)*0.6;
      if (p.position.length() > 250){ p.position.scaleInPlace(-0.9); (p as any).ang += Math.PI; }
    }
    sps.setParticles();
  });
})();

/* Cloud drift already defined */
scene.registerBeforeRender(() => {
  const dt = engine.getDeltaTime()/1000;
  for (const c of clouds){
    c.m.position.x += c.sp*dt*0.2;
    if (c.m.position.x > 500) c.m.position.x = -500;
  }
});

// Slow auto-orbit when idle? Keep user-controlled but gentle constant camera spin disabled (interferes).
// Shadow casting
sun.shadowEnabled = true;
const shadGen = new BABYLON.ShadowGenerator(1024, sun);
shadGen.useBlurExponentialShadowMap = true;
shadGen.blurKernel = 32;
shadGen.setDarkness(0.35);
function recurseAdd(n){
  if (n.getChildren){ n.getChildMeshes(false).forEach(recurseAdd); shadGen.addShadowCaster(n); }
}
recurseAdd(castleGroup);
recurseAdd(villageGroup);
recurseAdd(treesGroup);
recurseAdd(rocksGroup);
shadGen.addShadowCaster(island);
island.receiveShadows = true;
[castleGroup, villageGroup, treesGroup, rocksGroup].forEach(g => {
  g.getChildMeshes(false).forEach(m => {
    m.receiveShadows = true;
    shadGen.addShadowCaster(m);
  });
});

// Render
document.getElementById('loading').style.display = 'none';
engine.runRenderLoop(() => { scene.render(); });
window.addEventListener('resize', () => engine.resize());
</script>
