<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { margin: 0; font-size: 24px; color: #ffd700; }
        p { margin: 5px 0; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Medieval Diorama</h1>
        <p>Floating Island Estate</p>
    </div>
    <div class="controls">
        Rotate: Left Mouse | Pan: Right Mouse | Zoom: Scroll
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.2, 1);

            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 3, 50, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 100;
            camera.useAutoRotationBehavior = true;
            camera.autoRotationBehavior.idleRotationSpeed = 0.05;

            // Lights
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;
            light.groundColor = new BABYLON.Color3(0.2, 0.2, 0.3);

            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(20, 40, 20);
            dirLight.intensity = 0.8;

            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            // Materials
            const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
            grassMat.diffuseColor = new BABYLON.Color3(0.37, 0.71, 0.2);
            grassMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const rockMat = new BABYLON.StandardMaterial("rockMat", scene);
            rockMat.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.45);
            rockMat.specularColor = new BABYLON.Color3(0, 0, 0);

            const waterMat = new BABYLON.StandardMaterial("waterMat", scene);
            waterMat.diffuseColor = new BABYLON.Color3(0.25, 0.88, 0.82);
            waterMat.alpha = 0.7;
            waterMat.specularColor = new BABYLON.Color3(1, 1, 1);

            const woodMat = new BABYLON.StandardMaterial("woodMat", scene);
            woodMat.diffuseColor = new BABYLON.Color3(0.4, 0.26, 0.13);

            const stoneMat = new BABYLON.StandardMaterial("stoneMat", scene);
            stoneMat.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.6);

            const roofMat = new BABYLON.StandardMaterial("roofMat", scene);
            roofMat.diffuseColor = new BABYLON.Color3(0.65, 0.16, 0.16);

            // --- Floating Island Base ---
            const islandBase = BABYLON.MeshBuilder.CreateSphere("islandBase", {
                diameterX: 30, diameterY: 15, diameterZ: 30, segments: 4
            }, scene);
            islandBase.position.y = -7;
            islandBase.material = rockMat;
            // Distort base for rocky look
            const positions = islandBase.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                positions[i] += (Math.random() - 0.5) * 2;
                positions[i+1] += (Math.random() - 0.5) * 2;
                positions[i+2] += (Math.random() - 0.5) * 2;
            }
            islandBase.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
            islandBase.receiveShadows = true;

            const islandTop = BABYLON.MeshBuilder.CreateCylinder("islandTop", {
                diameter: 30, height: 1, tessellation: 8
            }, scene);
            islandTop.material = grassMat;
            islandTop.receiveShadows = true;
            shadowGenerator.addShadowCaster(islandTop);

            // --- River ---
            const river = BABYLON.MeshBuilder.CreateBox("river", {
                width: 6, height: 0.1, depth: 32
            }, scene);
            river.position.y = 0.51;
            river.position.x = 8;
            river.rotation.y = 0.2;
            river.material = waterMat;

            // --- Castle (Central) ---
            const castleRoot = new BABYLON.TransformNode("castleRoot");
            
            const createTower = (x, z, h, r) => {
                const tower = BABYLON.MeshBuilder.CreateCylinder("tower", { diameter: r*2, height: h }, scene);
                tower.position.set(x, h/2, z);
                tower.material = stoneMat;
                tower.parent = castleRoot;
                shadowGenerator.addShadowCaster(tower);

                const roof = BABYLON.MeshBuilder.CreateCylinder("towerRoof", { diameterTop: 0, diameterBottom: r*2.4, height: h*0.4, tessellation: 8 }, scene);
                roof.position.set(x, h + (h*0.2), z);
                roof.material = roofMat;
                roof.parent = castleRoot;
                shadowGenerator.addShadowCaster(roof);
            };

            // Central Keep
            const keep = BABYLON.MeshBuilder.CreateBox("keep", { width: 6, height: 8, depth: 6 }, scene);
            keep.position.y = 4;
            keep.material = stoneMat;
            keep.parent = castleRoot;
            shadowGenerator.addShadowCaster(keep);

            createTower(-3, -3, 10, 1.5);
            createTower(3, -3, 10, 1.5);
            createTower(3, 3, 10, 1.5);
            createTower(-3, 3, 10, 1.5);

            castleRoot.position.set(-2, 0.5, -2);

            // --- Village ---
            const createHouse = (x, z, rot, color) => {
                const house = new BABYLON.TransformNode("house");
                
                const body = BABYLON.MeshBuilder.CreateBox("houseBody", { width: 2, height: 2, depth: 3 }, scene);
                body.position.y = 1;
                body.material = woodMat;
                body.parent = house;
                shadowGenerator.addShadowCaster(body);

                const roof = BABYLON.MeshBuilder.CreateCylinder("houseRoof", { 
                    diameterTop: 0, diameterBottom: 3.5, height: 2, tessellation: 4 
                }, scene);
                roof.position.y = 2.5;
                roof.rotation.y = Math.PI / 4;
                roof.scaling.x = 0.8;
                roof.material = new BABYLON.StandardMaterial("roofColor", scene);
                roof.material.diffuseColor = color || new BABYLON.Color3(0.5, 0.3, 0.2);
                roof.parent = house;
                shadowGenerator.addShadowCaster(roof);

                house.position.set(x, 0.5, z);
                house.rotation.y = rot;
                return house;
            };

            // Village Layout
            createHouse(-8, 5, 0.5, new BABYLON.Color3(0.6, 0.2, 0.2));
            createHouse(-10, 2, 1.2, new BABYLON.Color3(0.2, 0.4, 0.6));
            createHouse(-7, -4, -0.5, new BABYLON.Color3(0.3, 0.5, 0.3));
            createHouse(-11, -8, 0.8, new BABYLON.Color3(0.5, 0.5, 0.2));

            // Tavern (Larger)
            const tavern = createHouse(5, -8, -0.8, new BABYLON.Color3(0.4, 0.2, 0.1));
            tavern.scaling.set(1.5, 1.2, 1.5);

            // Market Stalls
            const createStall = (x, z, rot) => {
                const stall = BABYLON.MeshBuilder.CreateBox("stall", { width: 1.5, height: 1, depth: 1 }, scene);
                stall.position.set(x, 1, z);
                stall.rotation.y = rot;
                stall.material = woodMat;
                
                const canvas = BABYLON.MeshBuilder.CreateBox("stallCanvas", { width: 1.6, height: 0.1, depth: 1.2 }, scene);
                canvas.position.set(x, 1.6, z);
                canvas.rotation.y = rot;
                canvas.rotation.x = 0.2;
                canvas.material = new BABYLON.StandardMaterial("stallMat", scene);
                canvas.material.diffuseColor = new BABYLON.Color3(1, 0.9, 0.7);
                
                shadowGenerator.addShadowCaster(stall);
                shadowGenerator.addShadowCaster(canvas);
            };
            createStall(-4, -10, 0.2);
            createStall(-1, -11, -0.3);

            // Riverside Mill
            const mill = createHouse(10, 8, -Math.PI/2, new BABYLON.Color3(0.4, 0.3, 0.2));
            const wheel = BABYLON.MeshBuilder.CreateCylinder("millWheel", { diameter: 3, height: 0.5, tessellation: 8 }, scene);
            wheel.position.set(12, 1.5, 8);
            wheel.rotation.z = Math.PI / 2;
            wheel.material = woodMat;
            scene.onBeforeRenderObservable.add(() => {
                wheel.rotation.x += 0.02;
            });

            // --- Bridges ---
            const createBridge = (x, z, rot) => {
                const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 3, height: 0.3, depth: 8 }, scene);
                bridge.position.set(x, 0.8, z);
                bridge.rotation.y = rot;
                bridge.material = woodMat;
                shadowGenerator.addShadowCaster(bridge);
            };
            createBridge(8, 0, 0.2);

            // --- Nature ---
            const createTree = (x, z) => {
                const tree = new BABYLON.TransformNode("tree");
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { diameter: 0.3, height: 1.5 }, scene);
                trunk.position.y = 0.75;
                trunk.material = woodMat;
                trunk.parent = tree;

                const foliage = BABYLON.MeshBuilder.CreateCylinder("foliage", { 
                    diameterTop: 0, diameterBottom: 2, height: 3, tessellation: 6 
                }, scene);
                foliage.position.y = 2.5;
                foliage.material = new BABYLON.StandardMaterial("foliageMat", scene);
                foliage.material.diffuseColor = new BABYLON.Color3(0.2, 0.4 + Math.random()*0.2, 0.2);
                foliage.parent = tree;

                tree.position.set(x, 0.5, z);
                tree.scaling.set(0.8 + Math.random()*0.5, 0.8 + Math.random()*0.5, 0.8 + Math.random()*0.5);
                
                shadowGenerator.addShadowCaster(foliage);
                return tree;
            };

            for(let i=0; i<20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 10 + Math.random() * 4;
                createTree(Math.cos(angle)*radius, Math.sin(angle)*radius);
            }

            // Rocks
            const createRock = (x, z, s) => {
                const rock = BABYLON.MeshBuilder.CreateSphere("rock", { segments: 1, diameter: 1 }, scene);
                rock.position.set(x, 0.8, z);
                rock.scaling.set(s, s*0.6, s);
                rock.material = rockMat;
                shadowGenerator.addShadowCaster(rock);
            };
            createRock(12, -5, 2);
            createRock(13, -3, 1.5);
            createRock(-12, 10, 3);

            // --- Ruined Watchtower ---
            const createRuinedTower = (x, z) => {
                const root = new BABYLON.TransformNode("ruin");
                const tower = BABYLON.MeshBuilder.CreateCylinder("tower", { diameter: 3, height: 6, tessellation: 8 }, scene);
                tower.position.set(x, 3.5, z);
                tower.material = stoneMat;
                tower.parent = root;

                // "Ruined" effect: add some loose blocks
                for(let i=0; i<5; i++) {
                    const block = BABYLON.MeshBuilder.CreateBox("block", { size: 0.8 }, scene);
                    block.position.set(x + Math.random()*2-1, 0.8, z + Math.random()*2-1);
                    block.rotation.set(Math.random(), Math.random(), Math.random());
                    block.material = stoneMat;
                    shadowGenerator.addShadowCaster(block);
                }
                shadowGenerator.addShadowCaster(tower);
            };
            createRuinedTower(11, -11);

            // --- Waterfalls ---
            const createWaterfall = (x, z, rot) => {
                const waterfall = BABYLON.MeshBuilder.CreatePlane("waterfall", { width: 5.5, height: 12 }, scene);
                waterfall.position.set(x, -5, z);
                waterfall.rotation.y = rot;
                waterfall.rotation.x = 0.1;
                waterfall.material = waterMat;

                // Particle effect for splash
                const particleSystem = new BABYLON.ParticleSystem("particles", 500, scene);
                particleSystem.particleTexture = new BABYLON.Texture("https://www.babylonjs-playground.com/textures/flare.png", scene);
                particleSystem.emitter = new BABYLON.Vector3(x, -11, z);
                particleSystem.minEmitBox = new BABYLON.Vector3(-2, 0, -2);
                particleSystem.maxEmitBox = new BABYLON.Vector3(2, 0, 2);
                particleSystem.color1 = new BABYLON.Color4(0.7, 0.8, 1, 1.0);
                particleSystem.color2 = new BABYLON.Color4(0.2, 0.5, 1, 1.0);
                particleSystem.minSize = 0.1;
                particleSystem.maxSize = 0.5;
                particleSystem.minLifeTime = 0.3;
                particleSystem.maxLifeTime = 1.5;
                particleSystem.emitRate = 100;
                particleSystem.gravity = new BABYLON.Vector3(0, -9.81, 0);
                particleSystem.direction1 = new BABYLON.Vector3(-1, 8, 1);
                particleSystem.direction2 = new BABYLON.Vector3(1, 8, -1);
                particleSystem.start();
            };
            createWaterfall(12, 11, -0.9);
            createWaterfall(7, -18, 0.2);

            // Post Processing
            const pipeline = new BABYLON.DefaultRenderingPipeline("default", true, scene, [camera]);
            pipeline.samples = 4;
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.8;
            pipeline.bloomWeight = 0.3;
            pipeline.bloomKernel = 64;
            pipeline.sharpenEnabled = true;

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
