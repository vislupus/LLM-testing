<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skyreach Keep — Floating Island Diorama</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #b0c8e0; font-family: 'Helvetica Neue', Arial, sans-serif; color: #fff; user-select: none; }
  #renderCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  #title {
    position: absolute; top: 20px; left: 24px; z-index: 10; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #title h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 1px; }
  #title p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; letter-spacing: 2px; }
  #legend {
    position: absolute; bottom: 16px; left: 24px; z-index: 10; pointer-events: none;
    background: rgba(20,15,25,0.55); backdrop-filter: blur(6px);
    padding: 12px 16px; border-radius: 10px; font-size: 12px; line-height: 1.7;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #legend strong { display: block; font-size: 11px; letter-spacing: 2px; opacity: 0.7; margin-bottom: 4px; }
  #help {
    position: absolute; bottom: 16px; right: 24px; z-index: 10; pointer-events: none;
    background: rgba(20,15,25,0.55); padding: 8px 14px; border-radius: 18px;
    font-size: 11px; letter-spacing: 1px; opacity: 0.8;
  }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="title">
  <h1>🏰 Skyreach Keep</h1>
  <p>A FLOATING ISLAND DIORAMA</p>
</div>
<div id="legend">
  <strong>FEATURES</strong>
  Stone keep · Village · Riverside mill · Watchtower<br>
  Turquoise river · Waterfalls · Pine forest
</div>
<div id="help">🖱 Drag to orbit · Scroll to zoom</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function () {
  'use strict';

  // ============================================================
  // ENGINE & SCENE
  // ============================================================
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { antialias: true, preserveDrawingBuffer: true });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.72, 0.82, 0.92, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogColor = new BABYLON.Color3(0.78, 0.85, 0.95);
  scene.fogDensity = 0.0045;
  scene.imageProcessingConfiguration.toneMappingEnabled = true;
  scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
  scene.imageProcessingConfiguration.exposure = 1.05;
  scene.imageProcessingConfiguration.contrast = 1.1;

  // ============================================================
  // CAMERA
  // ============================================================
  const camera = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2.6, Math.PI / 3.1, 65, new BABYLON.Vector3(0, 2, 0), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 30;
  camera.upperRadiusLimit = 130;
  camera.lowerBetaLimit = 0.15;
  camera.upperBetaLimit = Math.PI / 2.05;
  camera.wheelDeltaPercentage = 0.01;
  camera.panningSensibility = 0;
  camera.minZ = 0.1;
  camera.maxZ = 500;
  camera.inertia = 0.85;
  camera.useAutoRotationBehavior = false;

  // ============================================================
  // LIGHTING
  // ============================================================
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.3, 1, 0.2), scene);
  hemi.intensity = 0.65;
  hemi.diffuse = new BABYLON.Color3(1, 0.95, 0.88);
  hemi.groundColor = new BABYLON.Color3(0.35, 0.40, 0.30);
  hemi.specular = new BABYLON.Color3(0.2, 0.2, 0.15);

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.4, -0.75, 0.45), scene);
  sun.position = new BABYLON.Vector3(40, 60, -30);
  sun.intensity = 0.85;
  sun.diffuse = new BABYLON.Color3(1, 0.92, 0.78);
  sun.specular = new BABYLON.Color3(1, 0.95, 0.85);

  const rim = new BABYLON.DirectionalLight('rim', new BABYLON.Vector3(0.5, -0.2, -0.7), scene);
  rim.intensity = 0.25;
  rim.diffuse = new BABYLON.Color3(0.7, 0.85, 1);
  rim.specular = new BABYLON.Color3(0, 0, 0);

  // ============================================================
  // SHADOWS
  // ============================================================
  const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
  shadowGen.useExponentialShadowMap = true;
  shadowGen.darkness = 0.4;
  shadowGen.bias = 0.0005;
  shadowGen.normalBias = 0.02;

  // ============================================================
  // MATERIAL FACTORY
  // ============================================================
  function mat(name, r, g, b, opts) {
    opts = opts || {};
    const m = new BABYLON.StandardMaterial(name, scene);
    m.diffuseColor = new BABYLON.Color3(r, g, b);
    const s = opts.spec !== undefined ? opts.spec : 0.05;
    m.specularColor = new BABYLON.Color3(s, s, s);
    if (opts.specPower) m.specularPower = opts.specPower;
    if (opts.emissive) m.emissiveColor = new BABYLON.Color3(opts.emissive.r, opts.emissive.g, opts.emissive.b);
    if (opts.alpha !== undefined) m.alpha = opts.alpha;
    if (opts.backFace) m.backFaceCulling = false;
    if (opts.unlit) {
      m.disableLighting = true;
      m.emissiveColor = new BABYLON.Color3(r, g, b);
    }
    return m;
  }

  // ============================================================
  // MATERIALS
  // ============================================================
  const grassMat       = mat('grass',       0.46, 0.68, 0.30);
  const grassDarkMat   = mat('grassDark',   0.34, 0.55, 0.22);
  const grassLightMat  = mat('grassLight',  0.58, 0.78, 0.38);
  const rockMat        = mat('rock',        0.55, 0.50, 0.45);
  const rockDarkMat    = mat('rockDark',    0.38, 0.34, 0.30);
  const rockLightMat   = mat('rockLight',   0.72, 0.66, 0.58);
  const rockReddishMat = mat('rockRed',     0.62, 0.42, 0.34);
  const woodMat        = mat('wood',        0.42, 0.27, 0.16);
  const woodDarkMat    = mat('woodDark',    0.28, 0.18, 0.10);
  const woodLightMat   = mat('woodLight',   0.62, 0.44, 0.26);
  const thatchMat      = mat('thatch',      0.85, 0.62, 0.34);
  const roofRedMat     = mat('roofRed',     0.68, 0.22, 0.20);
  const roofBlueMat    = mat('roofBlue',    0.28, 0.42, 0.68);
  const roofGreenMat   = mat('roofGreen',   0.32, 0.55, 0.35);
  const pineMat        = mat('pine',        0.18, 0.46, 0.20);
  const pineDarkMat    = mat('pineDark',    0.12, 0.32, 0.14);
  const waterMat       = mat('water',       0.28, 0.78, 0.80, { emissive: { r: 0.10, g: 0.35, b: 0.36 }, spec: 0.7, specPower: 96 });
  waterMat.alpha = 0.88;
  const stoneWallMat   = mat('stoneWall',   0.68, 0.62, 0.54);
  const stoneWallDarkMat = mat('stoneDark', 0.48, 0.43, 0.38);
  const stoneWallLightMat = mat('stoneLight', 0.82, 0.76, 0.66);
  const dirtMat        = mat('dirt',        0.55, 0.42, 0.28);
  const bushMat        = mat('bush',        0.32, 0.58, 0.28);
  const mossMat        = mat('moss',        0.42, 0.65, 0.32);
  const cloudMat       = mat('cloud',       1, 1, 1, { unlit: true, alpha: 0.85 });

  // ============================================================
  // HELPERS
  // ============================================================

  // Returns a TransformNode that groups an object's meshes, all positioned/rotated.
  function attachShadows(meshes) {
    if (!Array.isArray(meshes)) meshes = [meshes];
    for (const m of meshes) {
      shadowGen.addShadowCaster(m, true);
      m.receiveShadows = true;
    }
  }

  // Cylinder with axis vertical by default. Set axis='z' to lay along Z.
  function cyl(name, opts) {
    return BABYLON.MeshBuilder.CreateCylinder(name, Object.assign({
      height: 1, diameter: 1, tessellation: 16
    }, opts), scene);
  }

  // Pine tree (high-poly with multiple cone layers)
  function createPine(x, y, z, scale, sway) {
    scale = scale || 1;
    sway = sway || 0;
    const root = new BABYLON.TransformNode('pine', scene);
    root.position.set(x, y, z);
    root.rotation.y = Math.random() * Math.PI * 2;
    root.scaling.setAll(scale);

    // Trunk
    const trunk = cyl('trunk', {
      height: 1.0, diameterTop: 0.16, diameterBottom: 0.30, tessellation: 8
    });
    trunk.position.y = 0.5;
    trunk.parent = root;
    trunk.material = woodDarkMat;
    trunk.receiveShadows = true;
    shadowGen.addShadowCaster(trunk);

    // 4 cone layers for fuller foliage
    const layerSizes = [
      { y: 1.1, h: 0.9, d: 1.5 },
      { y: 1.6, h: 0.8, d: 1.2 },
      { y: 2.05, h: 0.7, d: 0.95 },
      { y: 2.45, h: 0.55, d: 0.65 }
    ];
    for (const ls of layerSizes) {
      const cone = cyl('cone', {
        height: ls.h, diameterTop: 0, diameterBottom: ls.d, tessellation: 12
      });
      cone.position.y = ls.y;
      cone.parent = root;
      cone.material = Math.random() > 0.5 ? pineMat : pineDarkMat;
      cone.receiveShadows = true;
      shadowGen.addShadowCaster(cone);
    }

    return root;
  }

  // Bushy round tree
  function createBushTree(x, y, z, scale) {
    scale = scale || 1;
    const root = new BABYLON.TransformNode('bushtree', scene);
    root.position.set(x, y, z);
    root.rotation.y = Math.random() * Math.PI * 2;

    const trunk = cyl('bt_trunk', { height: 0.6, diameterTop: 0.12, diameterBottom: 0.18, tessellation: 6 });
    trunk.position.y = 0.3;
    trunk.parent = root;
    trunk.material = woodDarkMat;

    const cluster = new BABYLON.TransformNode('bt_cluster', scene);
    cluster.parent = root;
    cluster.position.y = 0.85;

    for (let i = 0; i < 5; i++) {
      const blob = BABYLON.MeshBuilder.CreateSphere('bt_blob', { diameter: 0.7 + Math.random() * 0.3, segments: 8 }, scene);
      blob.position.set(
        (Math.random() - 0.5) * 0.5,
        (Math.random() - 0.5) * 0.4,
        (Math.random() - 0.5) * 0.5
      );
      blob.parent = cluster;
      blob.material = i % 2 === 0 ? bushMat : mossMat;
      shadowGen.addShadowCaster(blob);
    }
    return root;
  }

  // Random scattered rock
  function createRock(x, y, z, scale, type) {
    type = type || Math.floor(Math.random() * 3);
    const r = BABYLON.MeshBuilder.CreatePolyhedron('rock', {
      type: type, size: scale || 0.5
    }, scene);
    r.position.set(x, y, z);
    r.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    r.scaling.set(1, 0.7 + Math.random() * 0.5, 1);
    r.material = Math.random() > 0.5 ? rockMat : rockDarkMat;
    r.receiveShadows = true;
    shadowGen.addShadowCaster(r);
    return r;
  }

  // Bush (low decorative shrub)
  function createBush(x, y, z, scale) {
    scale = scale || 1;
    const b = BABYLON.MeshBuilder.CreateSphere('bush', { diameter: 0.5 + Math.random() * 0.4, segments: 8 }, scene);
    b.position.set(x, y, z);
    b.scaling.set(scale, scale * 0.7, scale);
    b.material = Math.random() > 0.5 ? bushMat : mossMat;
    shadowGen.addShadowCaster(b);
    return b;
  }

  // ============================================================
  // ISLAND BASE
  // ============================================================
  const ISLAND_Y = 0; // top surface reference

  // Top grass surface (flattened, slightly irregular using vertex jitter)
  const topDiameter = 56;
  const islandTop = BABYLON.MeshBuilder.CreateCylinder('islandTop', {
    height: 1.6, diameterTop: topDiameter, diameterBottom: topDiameter - 1, tessellation: 64
  }, scene);
  islandTop.position.y = ISLAND_Y - 0.6;
  islandTop.material = grassMat;
  islandTop.receiveShadows = true;

  // Add slight vertex jitter for natural look
  const positions = islandTop.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for (let i = 0; i < positions.length; i += 3) {
    const x = positions[i], z = positions[i + 2];
    const dist = Math.sqrt(x*x + z*z);
    if (dist > topDiameter/2 - 1) {
      positions[i + 1] += (Math.random() - 0.5) * 0.4;
    }
  }
  islandTop.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);

  // Slight darker grass ring near edges
  const grassEdge = BABYLON.MeshBuilder.CreateTorus('grassEdge', {
    diameter: topDiameter - 2, thickness: 1.2, tessellation: 64
  }, scene);
  grassEdge.position.y = ISLAND_Y - 0.18;
  grassEdge.material = grassDarkMat;
  grassEdge.receiveShadows = true;

  // Rocky underside - cone going down
  const islandBottom = BABYLON.MeshBuilder.CreateCylinder('islandBottom', {
    height: 22, diameterTop: 42, diameterBottom: 3, tessellation: 24
  }, scene);
  islandBottom.position.y = ISLAND_Y - 12;
  islandBottom.material = rockMat;
  islandBottom.receiveShadows = true;

  // Add jaggedness to underside
  const bottomPos = islandBottom.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for (let i = 0; i < bottomPos.length; i += 3) {
    const y = bottomPos[i + 1];
    if (y < -10) {
      const r = Math.random();
      if (r > 0.6) {
        bottomPos[i] += (Math.random() - 0.5) * 2.5;
        bottomPos[i + 2] += (Math.random() - 0.5) * 2.5;
      }
    }
  }
  islandBottom.updateVerticesData(BABYLON.VertexBuffer.PositionKind, bottomPos);
  islandBottom.createNormals(true);

  // Rocky skirt at the rim - small rocks scattered around the bottom edge
  for (let i = 0; i < 28; i++) {
    const angle = (i / 28) * Math.PI * 2 + Math.random() * 0.2;
    const dist = 18 + Math.random() * 5;
    const y = -3 - Math.random() * 9;
    const rock = createRock(Math.cos(angle) * dist, y, Math.sin(angle) * dist, 0.6 + Math.random() * 1.5, Math.floor(Math.random() * 3));
  }

  // Small floating chunks below
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 22 + Math.random() * 18;
    const y = -22 - Math.random() * 18;
    const chunk = createRock(Math.cos(angle) * dist, y, Math.sin(angle) * dist, 0.5 + Math.random() * 1.2, Math.floor(Math.random() * 3));
    chunk.material = Math.random() > 0.4 ? rockDarkMat : rockMat;
  }

  // ============================================================
  // CASTLE — at center (0, ISLAND_Y + 0.2, 0)
  // ============================================================
  const CASTLE_BASE_Y = ISLAND_Y + 0.2;

  // Castle ground platform (raised slightly)
  const castleGround = BABYLON.MeshBuilder.CreateCylinder('castleGround', {
    height: 0.3, diameterTop: 22, diameterBottom: 22.5, tessellation: 48
  }, scene);
  castleGround.position.y = CASTLE_BASE_Y;
  castleGround.material = stoneWallLightMat;
  castleGround.receiveShadows = true;

  // Central keep (tall square tower)
  const keep = new BABYLON.TransformNode('keep', scene);
  keep.position.y = CASTLE_BASE_Y;

  const keepSize = 5;
  const keepHeight = 9;
  const keepBody = BABYLON.MeshBuilder.CreateBox('keepBody', {
    width: keepSize, height: keepHeight, depth: keepSize
  }, scene);
  keepBody.position.y = keepHeight / 2;
  keepBody.parent = keep;
  keepBody.material = stoneWallMat;
  shadowGen.addShadowCaster(keepBody);
  keepBody.receiveShadows = true;

  // Keep windows (small dark rectangles)
  for (let floor = 0; floor < 3; floor++) {
    for (let side = 0; side < 4; side++) {
      const win = BABYLON.MeshBuilder.CreateBox('keepWin', {
        width: 0.5, height: 1.0, depth: 0.1
      }, scene);
      const angle = side * Math.PI / 2;
      win.position.set(
        Math.sin(angle) * (keepSize/2 + 0.05),
        1.5 + floor * 2.5,
        Math.cos(angle) * (keepSize/2 + 0.05)
      );
      win.rotation.y = angle;
      win.parent = keep;
      win.material = mat('darkwin', 0.1, 0.1, 0.12, { unlit: true });
    }
  }

  // Keep crenellations (top)
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 4; j++) {
      const cren = BABYLON.MeshBuilder.CreateBox('cren', {
        width: 0.8, height: 0.7, depth: 0.8
      }, scene);
      cren.position.set(
        -keepSize/2 + 0.6 + i * (keepSize - 1.2) / 3,
        keepHeight + 0.35,
        -keepSize/2 + 0.6 + j * (keepSize - 1.2) / 3
      );
      cren.parent = keep;
      cren.material = stoneWallLightMat;
      shadowGen.addShadowCaster(cren);
    }
  }

  // Keep pyramidal roof
  const keepRoof = BABYLON.MeshBuilder.CreateCylinder('keepRoof', {
    height: 3, diameterTop: 0, diameterBottom: keepSize + 0.4, tessellation: 4
  }, scene);
  keepRoof.position.y = keepHeight + 0.7 + 1.5;
  keepRoof.rotation.y = Math.PI / 4;
  keepRoof.parent = keep;
  keepRoof.material = roofRedMat;
  shadowGen.addShadowCaster(keepRoof);

  // Flag pole and banner
  const flagPole = cyl('flagPole', { height: 2, diameter: 0.1, tessellation: 6 });
  flagPole.position.y = keepHeight + 0.7 + 3 + 1;
  flagPole.parent = keep;
  flagPole.material = woodDarkMat;

  const flag = BABYLON.MeshBuilder.CreateBox('flag', { width: 1.2, height: 0.7, depth: 0.05 }, scene);
  flag.position.set(0.6, keepHeight + 0.7 + 3 + 1.5, 0);
  flag.parent = keep;
  flag.material = mat('flagRed', 0.85, 0.15, 0.15);

  // 4 corner towers (cylindrical)
  const towerPositions = [
    { x: 9, z: 9 },
    { x: -9, z: 9 },
    { x: 9, z: -9 },
    { x: -9, z: -9 }
  ];
  const towerHeight = 7.5;
  const towerRadius = 1.6;

  for (const tp of towerPositions) {
    const tower = new BABYLON.TransformNode('tower', scene);
    tower.position.set(tp.x, CASTLE_BASE_Y, tp.z);

    const body = cyl('tBody', {
      height: towerHeight, diameterTop: towerRadius * 1.8, diameterBottom: towerRadius * 2, tessellation: 16
    });
    body.position.y = towerHeight / 2;
    body.parent = tower;
    body.material = stoneWallMat;
    shadowGen.addShadowCaster(body);
    body.receiveShadows = true;

    // Tower windows (vertical slits)
    for (let h = 0; h < 4; h++) {
      for (let side = 0; side < 4; side++) {
        const slit = BABYLON.MeshBuilder.CreateBox('slit', {
          width: 0.2, height: 0.8, depth: 0.1
        }, scene);
        slit.position.set(
          Math.sin(side * Math.PI/2) * (towerRadius * 0.95),
          1.2 + h * 1.5,
          Math.cos(side * Math.PI/2) * (towerRadius * 0.95)
        );
        slit.rotation.y = side * Math.PI / 2;
        slit.parent = tower;
        slit.material = mat('darkwin', 0.08, 0.08, 0.1, { unlit: true });
      }
    }

    // Crenellations ring on top
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const cren = BABYLON.MeshBuilder.CreateBox('tCren', {
        width: 0.45, height: 0.55, depth: 0.4
      }, scene);
      cren.position.set(
        Math.cos(angle) * (towerRadius * 0.95),
        towerHeight + 0.3,
        Math.sin(angle) * (towerRadius * 0.95)
      );
      cren.rotation.y = -angle + Math.PI/2;
      cren.parent = tower;
      cren.material = stoneWallLightMat;
      shadowGen.addShadowCaster(cren);
    }

    // Conical roof
    const roof = BABYLON.MeshBuilder.CreateCylinder('tRoof', {
      height: 2.5, diameterTop: 0, diameterBottom: towerRadius * 2.4, tessellation: 16
    }, scene);
    roof.position.y = towerHeight + 0.55 + 1.25;
    roof.parent = tower;
    roof.material = i % 2 === 0 ? roofBlueMat : roofRedMat;
    shadowGen.addShadowCaster(roof);

    // Small banner
    const pole = cyl('p', { height: 0.8, diameter: 0.05, tessellation: 4 });
    pole.position.y = towerHeight + 0.55 + 2.5 + 0.4;
    pole.parent = tower;
    pole.material = woodDarkMat;

    const bnr = BABYLON.MeshBuilder.CreateBox('bnr', { width: 0.4, height: 0.3, depth: 0.03 }, scene);
    bnr.position.set(0.2, towerHeight + 0.55 + 2.5 + 0.5, 0);
    bnr.parent = tower;
    bnr.material = mat('bnrC', 0.85, 0.7, 0.2);
  }

  // Castle walls connecting towers (4 walls)
  const wallLen = 18 - towerRadius * 2; // distance between tower centers minus tower radius
  const wallPositions = [
    { x: 0, z: 9, rot: 0 },   // front (south)
    { x: 0, z: -9, rot: 0 },  // back (north)
    { x: 9, z: 0, rot: Math.PI/2 },  // right (east)
    { x: -9, z: 0, rot: Math.PI/2 }  // left (west)
  ];
  const wallHeight = 4.5;
  const wallThickness = 0.7;
  for (let i = 0; i < wallPositions.length; i++) {
    const wp = wallPositions[i];
    const wall = BABYLON.MeshBuilder.CreateBox('wall', {
      width: wallLen, height: wallHeight, depth: wallThickness
    }, scene);
    wall.position.set(wp.x, CASTLE_BASE_Y + wallHeight/2, wp.z);
    wall.rotation.y = wp.rot;
    wall.material = stoneWallMat;
    shadowGen.addShadowCaster(wall);
    wall.receiveShadows = true;

    // Crenellations on top of wall
    const numCren = 12;
    for (let c = 0; c < numCren; c++) {
      const cren = BABYLON.MeshBuilder.CreateBox('wCren', {
        width: 0.8, height: 0.6, depth: wallThickness + 0.1
      }, scene);
      const offset = -wallLen/2 + (c + 0.5) * (wallLen / numCren);
      cren.position.set(
        wp.x + Math.cos(wp.rot) * offset,
        CASTLE_BASE_Y + wallHeight + 0.3,
        wp.z + Math.sin(wp.rot) * offset
      );
      cren.rotation.y = wp.rot;
      cren.material = stoneWallLightMat;
      shadowGen.addShadowCaster(cren);
    }

    // Arrow slits on walls
    for (let a = 0; a < 4; a++) {
      const slit = BABYLON.MeshBuilder.CreateBox('wslit', {
        width: 0.15, height: 0.6, depth: 0.1
      }, scene);
      const offset = -wallLen/2 + 2 + a * (wallLen - 4) / 3;
      slit.position.set(
        wp.x + Math.cos(wp.rot) * offset,
        CASTLE_BASE_Y + 1.5,
        wp.z + Math.sin(wp.rot) * offset
      );
      slit.rotation.y = wp.rot;
      slit.material = mat('darkwin', 0.05, 0.05, 0.07, { unlit: true });
    }
  }

  // Gatehouse (south wall, protruding)
  const gatehouse = new BABYLON.TransformNode('gatehouse', scene);
  gatehouse.position.set(0, CASTLE_BASE_Y, 9 + wallThickness/2);

  const ghBody = BABYLON.MeshBuilder.CreateBox('ghBody', {
    width: 4, height: 5, depth: 2.5
  }, scene);
  ghBody.position.y = 2.5;
  ghBody.parent = gatehouse;
  ghBody.material = stoneWallMat;
  shadowGen.addShadowCaster(ghBody);

  // Gate arch (dark opening)
  const gateOpening = BABYLON.MeshBuilder.CreateBox('gateOpen', {
    width: 1.5, height: 2.5, depth: 2.6
  }, scene);
  gateOpening.position.y = 1.5;
  gateOpening.parent = gatehouse;
  gateOpening.material = mat('gateOpen', 0.08, 0.05, 0.04, { unlit: true });

  // Portcullis (wooden grid)
  for (let b = 0; b < 4; b++) {
    const bar = BABYLON.MeshBuilder.CreateBox('bar', {
      width: 1.6, height: 0.1, depth: 0.05
    }, scene);
    bar.position.set(0, 0.4 + b * 0.7, 0.3);
    bar.parent = gatehouse;
    bar.material = woodDarkMat;
  }
  for (let b = 0; b < 3; b++) {
    const bar = BABYLON.MeshBuilder.CreateBox('bar', {
      width: 0.1, height: 2.4, depth: 0.05
    }, scene);
    bar.position.set(-0.6 + b * 0.6, 1.4, 0.3);
    bar.parent = gatehouse;
    bar.material = woodDarkMat;
  }

  // Gatehouse roof (triangular)
  const ghRoof = BABYLON.MeshBuilder.CreateCylinder('ghRoof', {
    height: 4.5, diameterTop: 0, diameterBottom: 4.5, tessellation: 3
  }, scene);
  ghRoof.position.y = 5 + 1.5;
  ghRoof.rotation.y = Math.PI / 6;
  ghRoof.parent = gatehouse;
  ghRoof.material = roofBlueMat;
  shadowGen.addShadowCaster(ghRoof);

  // Gatehouse side windows
  for (let side = -1; side <= 1; side += 2) {
    const win = BABYLON.MeshBuilder.CreateBox('ghWin', {
      width: 0.1, height: 0.8, depth: 0.5
    }, scene);
    win.position.set(side * 1.7, 3.5, 0);
    win.parent = gatehouse;
    win.material = mat('darkwin', 0.05, 0.05, 0.07, { unlit: true });
  }

  // ============================================================
  // VILLAGE — houses around the castle
  // ============================================================
  // Helper: build a generic house
  function createHouse(x, z, opts) {
    opts = opts || {};
    const scale = opts.scale || 1;
    const w = (opts.w || 2.2) * scale;
    const h = (opts.h || 1.8) * scale;
    const d = (opts.d || 1.8) * scale;
    const roofColor = opts.roofColor || thatchMat;
    const wallColor = opts.wallColor || woodMat;

    const root = new BABYLON.TransformNode('house', scene);
    root.position.set(x, CASTLE_BASE_Y, z);
    root.rotation.y = opts.rot || (Math.random() - 0.5) * 0.5;

    // Main walls
    const walls = BABYLON.MeshBuilder.CreateBox('walls', {
      width: w, height: h, depth: d
    }, scene);
    walls.position.y = h / 2;
    walls.parent = root;
    walls.material = wallColor;
    shadowGen.addShadowCaster(walls);
    walls.receiveShadows = true;

    // Roof — pyramid/hipped (cylinder with 4 sides)
    const roof = BABYLON.MeshBuilder.CreateCylinder('roof', {
      height: w * 0.55, diameterTop: 0, diameterBottom: w * 1.05, tessellation: 4
    }, scene);
    roof.position.y = h + w * 0.275;
    roof.rotation.y = Math.PI / 4;
    roof.parent = root;
    roof.material = roofColor;
    shadowGen.addShadowCaster(roof);

    // Door
    const door = BABYLON.MeshBuilder.CreateBox('door', {
      width: 0.4, height: 0.9, depth: 0.05
    }, scene);
    door.position.set(0, 0.45, d/2 + 0.01);
    door.parent = root;
    door.material = woodDarkMat;

    // Window
    if (opts.window) {
      const win = BABYLON.MeshBuilder.CreateBox('win', {
        width: 0.45, height: 0.45, depth: 0.05
      }, scene);
      win.position.set(w * 0.25, h * 0.55, d/2 + 0.01);
      win.parent = root;
      win.material = mat('window', 0.7, 0.85, 0.9, { emissive: { r: 0.4, g: 0.5, b: 0.4 } });

      const winFrame = BABYLON.MeshBuilder.CreateBox('winF', {
        width: 0.5, height: 0.5, depth: 0.06
      }, scene);
      winFrame.position.set(w * 0.25, h * 0.55, d/2 + 0.005);
      winFrame.parent = root;
      winFrame.material = woodDarkMat;
    }

    // Chimney
    if (opts.chimney) {
      const chimney = BABYLON.MeshBuilder.CreateBox('chim', {
        width: 0.3, height: 0.7, depth: 0.3
      }, scene);
      chimney.position.set(w * 0.3, h + w * 0.4, 0);
      chimney.parent = root;
      chimney.material = stoneWallDarkMat;
      shadowGen.addShadowCaster(chimney);
    }

    // Foundation stones (small darker rectangle base)
    const foundation = BABYLON.MeshBuilder.CreateBox('found', {
      width: w + 0.2, height: 0.15, depth: d + 0.2
    }, scene);
    foundation.position.y = 0.075;
    foundation.parent = root;
    foundation.material = stoneWallDarkMat;

    return root;
  }

  // Helper: tavern (larger house with sign)
  function createTavern(x, z) {
    const root = createHouse(x, z, {
      scale: 1.3, w: 2.6, h: 2.2, d: 2.0,
      roofColor: roofRedMat, wallColor: woodLightMat,
      rot: 0.2, window: true, chimney: true
    });
    // Sign post
    const post = cyl('signPost', { height: 2.2, diameter: 0.1, tessellation: 6 });
    post.position.set(1.5, 1.1, 1.5);
    post.parent = root;
    post.material = woodDarkMat;

    const sign = BABYLON.MeshBuilder.CreateBox('sign', { width: 1, height: 0.5, depth: 0.08 }, scene);
    sign.position.set(1.5, 1.7, 1.5);
    sign.parent = root;
    sign.material = mat('sign', 0.6, 0.4, 0.18);

    // Mug on sign
    const mug = BABYLON.MeshBuilder.CreateCylinder('mug', { height: 0.2, diameter: 0.15, tessellation: 8 }, scene);
    mug.position.set(1.5, 1.75, 1.55);
    mug.parent = root;
    mug.material = mat('mug', 0.85, 0.65, 0.25);

    return root;
  }

  // Helper: market stall
  function createMarketStall(x, z, rot, awningColor) {
    const root = new BABYLON.TransformNode('stall', scene);
    root.position.set(x, CASTLE_BASE_Y, z);
    root.rotation.y = rot || 0;

    // Counter
    const counter = BABYLON.MeshBuilder.CreateBox('counter', {
      width: 1.4, height: 0.5, depth: 0.6
    }, scene);
    counter.position.y = 0.4;
    counter.parent = root;
    counter.material = woodMat;
    shadowGen.addShadowCaster(counter);

    // Table top
    const top = BABYLON.MeshBuilder.CreateBox('top', {
      width: 1.5, height: 0.06, depth: 0.7
    }, scene);
    top.position.y = 0.7;
    top.parent = root;
    top.material = woodLightMat;

    // Posts
    for (let side of [-1, 1]) {
      const post = cyl('post', { height: 1.4, diameter: 0.08, tessellation: 6 });
      post.position.set(side * 0.6, 1.0, 0);
      post.parent = root;
      post.material = woodDarkMat;
    }

    // Awning (fabric)
    const awning = BABYLON.MeshBuilder.CreateBox('awning', {
      width: 1.5, height: 0.05, depth: 0.8
    }, scene);
    awning.position.y = 1.55;
    awning.rotation.z = -0.1;
    awning.parent = root;
    awning.material = awningColor || mat('awning', 0.85, 0.4, 0.35);
    shadowGen.addShadowCaster(awning);

    // Goods on counter (small spheres/cubes)
    const goodColors = [
      mat('apple', 0.85, 0.25, 0.25),
      mat('orange', 0.95, 0.65, 0.25),
      mat('grape', 0.5, 0.3, 0.7),
      mat('bread', 0.85, 0.65, 0.4)
    ];
    for (let i = 0; i < 5; i++) {
      const good = BABYLON.MeshBuilder.CreateSphere('good', { diameter: 0.15, segments: 6 }, scene);
      good.position.set(-0.5 + i * 0.25, 0.8, 0);
      good.parent = root;
      good.material = goodColors[i % goodColors.length];
    }

    return root;
  }

  // Helper: mill (riverside)
  function createMill(x, z) {
    const root = new BABYLON.TransformNode('mill', scene);
    root.position.set(x, CASTLE_BASE_Y, z);
    root.rotation.y = 0.5;

    // Main body
    const body = BABYLON.MeshBuilder.CreateBox('mBody', {
      width: 2.5, height: 2.5, depth: 2.2
    }, scene);
    body.position.y = 1.4;
    body.parent = root;
    body.material = woodLightMat;
    shadowGen.addShadowCaster(body);
    body.receiveShadows = true;

    // Lower stone base
    const base = BABYLON.MeshBuilder.CreateBox('mBase', {
      width: 2.7, height: 0.8, depth: 2.4
    }, scene);
    base.position.y = 0.4;
    base.parent = root;
    base.material = stoneWallDarkMat;

    // Roof (cone)
    const roof = BABYLON.MeshBuilder.CreateCylinder('mRoof', {
      height: 2, diameterTop: 0, diameterBottom: 3, tessellation: 16
    }, scene);
    roof.position.y = 2.5 + 1.0;
    roof.parent = root;
    roof.material = roofRedMat;
    shadowGen.addShadowCaster(roof);

    // Door
    const door = BABYLON.MeshBuilder.CreateBox('mDoor', {
      width: 0.6, height: 1.2, depth: 0.05
    }, scene);
    door.position.set(0, 0.7, 1.13);
    door.parent = root;
    door.material = woodDarkMat;

    // Window
    const win = BABYLON.MeshBuilder.CreateBox('mWin', {
      width: 0.6, height: 0.6, depth: 0.05
    }, scene);
    win.position.set(0.8, 1.7, 1.13);
    win.parent = root;
    win.material = mat('millwin', 0.7, 0.85, 0.9, { emissive: { r: 0.3, g: 0.4, b: 0.4 } });

    // Water wheel
    const wheel = new BABYLON.TransformNode('wheel', scene);
    wheel.parent = root;
    wheel.position.set(0, 1.2, 1.3);

    const wheelRim = BABYLON.MeshBuilder.CreateTorus('wheelRim', {
      diameter: 1.6, thickness: 0.1, tessellation: 24
    }, scene);
    wheelRim.rotation.x = Math.PI / 2;
    wheelRim.parent = wheel;
    wheelRim.material = woodDarkMat;

    // Wheel spokes
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const spoke = BABYLON.MeshBuilder.CreateBox('spoke', {
        width: 0.06, height: 1.5, depth: 0.06
      }, scene);
      spoke.rotation.z = angle;
      spoke.parent = wheel;
      spoke.material = woodDarkMat;

      // Paddle
      const paddle = BABYLON.MeshBuilder.CreateBox('paddle', {
        width: 0.3, height: 0.08, depth: 0.04
      }, scene);
      paddle.position.set(Math.cos(angle + Math.PI/2) * 0.75, Math.sin(angle + Math.PI/2) * 0.75, 0);
      paddle.parent = wheel;
      paddle.material = woodMat;
    }

    // Center hub
    const hub = cyl('hub', { height: 0.2, diameter: 0.25, tessellation: 12 });
    hub.rotation.x = Math.PI / 2;
    hub.parent = wheel;
    hub.material = woodDarkMat;

    return { root, wheel };
  }

  // ================== BUILD VILLAGE ==================

  // Tavern (central village area)
  createTavern(0, 16);

  // Houses (around castle, varied)
  const housePositions = [
    { x: -14, z: 12, opts: { scale: 1.0, window: true, chimney: true, rot: 0.4 }},
    { x: -10, z: 18, opts: { scale: 0.9, window: true, roofColor: thatchMat, chimney: true, rot: 0.8 }},
    { x: -16, z: 18, opts: { scale: 1.1, window: true, roofColor: roofGreenMat, chimney: true, rot: -0.5 }},
    { x: 10, z: 18, opts: { scale: 0.95, window: true, roofColor: roofRedMat, chimney: true, rot: -0.6 }},
    { x: 14, z: 14, opts: { scale: 1.05, window: true, chimney: true, rot: 0.7 }},
    { x: 18, z: 8, opts: { scale: 0.85, window: true, roofColor: thatchMat, chimney: true, rot: 1.2 }},
    { x: 16, z: -6, opts: { scale: 1.0, window: true, roofColor: roofGreenMat, chimney: true, rot: 1.5 }},
    { x: -17, z: 4, opts: { scale: 1.0, window: true, chimney: true, rot: -0.9 }},
    { x: -18, z: -8, opts: { scale: 0.9, window: true, roofColor: thatchMat, chimney: true, rot: -1.2 }},
    { x: -14, z: -16, opts: { scale: 1.1, window: true, roofColor: roofBlueMat, chimney: true, rot: -1.6 }},
    { x: 12, z: -18, opts: { scale: 0.95, window: true, chimney: true, rot: -2.0 }},
    { x: 4, z: -18, opts: { scale: 1.0, window: true, roofColor: thatchMat, chimney: true, rot: -2.4 }}
  ];

  for (const hp of housePositions) {
    createHouse(hp.x, hp.z, hp.opts);
  }

  // Market stalls (village square area)
  createMarketStall(-3, 13, 0.3, mat('awning1', 0.85, 0.35, 0.30));
  createMarketStall(3, 13, -0.3, mat('awning2', 0.95, 0.65, 0.25));
  createMarketStall(0, 11.5, 0, mat('awning3', 0.4, 0.65, 0.85));

  // Mill (riverside, will be near river)
  const millData = createMill(-15, 0);

  // ============================================================
  // RIVER — winding turquoise river with bridges and waterfall
  // ============================================================
  const riverPath = [
    { x: -25, y: CASTLE_BASE_Y + 0.15, z: 18, w: 3.5 },
    { x: -20, y: CASTLE_BASE_Y + 0.15, z: 12, w: 3 },
    { x: -16, y: CASTLE_BASE_Y + 0.15, z: 4,  w: 2.8 },
    { x: -14, y: CASTLE_BASE_Y + 0.15, z: -4, w: 2.6 },
    { x: -10, y: CASTLE_BASE_Y + 0.12, z: -12, w: 2.6 },
    { x: -4,  y: CASTLE_BASE_Y + 0.10, z: -18, w: 2.8 },
    { x: 4,   y: CASTLE_BASE_Y + 0.08, z: -22, w: 3 },
    { x: 12,  y: CASTLE_BASE_Y + 0.05, z: -25, w: 3.2 },
    { x: 22,  y: CASTLE_BASE_Y + 0.02, z: -26, w: 3.5 } // waterfall off edge
  ];

  const riverSegments = [];
  for (let i = 0; i < riverPath.length - 1; i++) {
    const p1 = riverPath[i];
    const p2 = riverPath[i + 1];
    const dx = p2.x - p1.x;
    const dz = p2.z - p1.z;
    const len = Math.sqrt(dx*dx + dz*dz);
    const angle = Math.atan2(dx, dz);
    const seg = BABYLON.MeshBuilder.CreateBox('river' + i, {
      width: len, height: 0.1, depth: p1.w
    }, scene);
    seg.position.set((p1.x + p2.x)/2, p1.y, (p1.z + p2.z)/2);
    seg.rotation.y = angle;
    seg.material = waterMat;
    seg.receiveShadows = true;
    riverSegments.push(seg);
  }

  // Waterfall sheet (vertical) — at the end of the river (off-edge)
  const waterfallY = CASTLE_BASE_Y + 0.02;
  const waterfallStart = riverPath[riverPath.length - 1];
  const waterfall = BABYLON.MeshBuilder.CreateBox('waterfall', {
    width: 3.5, height: 18, depth: 0.15
  }, scene);
  waterfall.position.set(waterfallStart.x, waterfallY - 9, waterfallStart.z);
  waterfall.rotation.y = Math.PI / 4; // align with island edge roughly
  waterfall.material = waterMat;
  waterfall.alpha = 0.65;

  // Waterfall mist particle system
  const mist = new BABYLON.ParticleSystem('mist', 200, scene);
  mist.particleTexture = new BABYLON.DynamicTexture('mistTex', { width: 64, height: 64 }, scene, false);
  {
    const ctx = mist.particleTexture.getContext();
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.5, 'rgba(200,230,240,0.6)');
    grad.addColorStop(1, 'rgba(200,230,240,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);
    mist.particleTexture.hasAlpha = true;
    mist.particleTexture.update();
  }
  mist.emitter = new BABYLON.Vector3(waterfallStart.x + 1, waterfallY - 17, waterfallStart.z);
  mist.minEmitBox = new BABYLON.Vector3(-2, 0, -1);
  mist.maxEmitBox = new BABYLON.Vector3(2, 0, 1);
  mist.color1 = new BABYLON.Color4(0.9, 0.95, 1, 0.6);
  mist.color2 = new BABYLON.Color4(0.8, 0.9, 0.95, 0.4);
  mist.colorDead = new BABYLON.Color4(0.7, 0.85, 0.9, 0);
  mist.minSize = 1.5;
  mist.maxSize = 3;
  mist.minLifeTime = 1.5;
  mist.maxLifeTime = 3;
  mist.emitRate = 60;
  mist.direction1 = new BABYLON.Vector3(-3, -1, -3);
  mist.direction2 = new BABYLON.Vector3(3, 1, 3);
  mist.minEmitPower = 2;
  mist.maxEmitPower = 5;
  mist.updateSpeed = 0.02;
  mist.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  mist.start();

  // Smaller waterfall / pond on the north side
  const pond = BABYLON.MeshBuilder.CreateCylinder('pond', {
    height: 0.1, diameterTop: 6, diameterBottom: 6, tessellation: 32
  }, scene);
  pond.position.set(-22, CASTLE_BASE_Y + 0.18, 19);
  pond.material = waterMat;
  pond.receiveShadows = true;

  // Wooden bridges across the river
  function createBridge(x, z, rot, length) {
    length = length || 3;
    const root = new BABYLON.TransformNode('bridge', scene);
    root.position.set(x, CASTLE_BASE_Y + 0.05, z);
    root.rotation.y = rot || 0;

    // Main planks
    const planks = BABYLON.MeshBuilder.CreateBox('planks', {
      width: length, height: 0.15, depth: 2.4
    }, scene);
    planks.position.y = 0.25;
    planks.parent = root;
    planks.material = woodMat;
    shadowGen.addShadowCaster(planks);

    // Rails
    for (let side of [-1, 1]) {
      const rail = BABYLON.MeshBuilder.CreateBox('rail', {
        width: length + 0.2, height: 0.1, depth: 0.1
      }, scene);
      rail.position.set(0, 0.7, side * 1.1);
      rail.parent = root;
      rail.material = woodDarkMat;
    }

    // Posts
    for (let i = 0; i < 3; i++) {
      for (let side of [-1, 1]) {
        const post = BABYLON.MeshBuilder.CreateBox('post', {
          width: 0.1, height: 0.7, depth: 0.1
        }, scene);
        post.position.set(-length/2 + 0.3 + i * (length - 0.6) / 2, 0.35, side * 1.1);
        post.parent = root;
        post.material = woodDarkMat;
      }
    }

    // Support pillars in water
    for (let i = 0; i < 2; i++) {
      const pillar = BABYLON.MeshBuilder.CreateBox('pillar', {
        width: 0.25, height: 0.3, depth: 0.25
      }, scene);
      pillar.position.set(-length/2 + 0.7 + i * (length - 1.4), 0.05, 0);
      pillar.parent = root;
      pillar.material = woodDarkMat;
    }
  }

  createBridge(-12, -8, -0.4, 3.5);
  createBridge(-1, -19, -Math.PI/2.5, 3.5);

  // ============================================================
  // TREES, ROCKS, BUSHES — scatter across the island
  // ============================================================

  // Pine clusters (around edges, especially north/back)
  const pineSpots = [
    [-22, -14], [-20, -10], [-18, -18], [-23, -2], [-21, 6], [-24, 12],
    [22, -18], [20, -22], [18, -12], [23, -4], [21, 4], [24, 10], [22, 16],
    [-22, 22], [22, 22], [-15, -22], [15, -22], [-5, -24], [5, -24]
  ];
  for (const [px, pz] of pineSpots) {
    const s = 0.8 + Math.random() * 0.6;
    createPine(px, CASTLE_BASE_Y + 0.2, pz, s);
  }

  // A few bushy trees (in village area)
  for (let i = 0; i < 6; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 20 + Math.random() * 5;
    createBushTree(Math.cos(angle) * r, CASTLE_BASE_Y + 0.2, Math.sin(angle) * r, 0.7 + Math.random() * 0.5);
  }

  // Scattered rocks
  for (let i = 0; i < 25; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 5 + Math.random() * 22;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    if (Math.abs(x) < 5 && Math.abs(z) < 5) continue; // skip castle area
    createRock(x, CASTLE_BASE_Y + 0.05 + Math.random() * 0.1, z, 0.3 + Math.random() * 0.8, Math.floor(Math.random() * 3));
  }

  // Edge rocks (along the rim)
  for (let i = 0; i < 32; i++) {
    const angle = (i / 32) * Math.PI * 2 + Math.random() * 0.1;
    const r = 26 + Math.random() * 2;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    createRock(x, CASTLE_BASE_Y + 0.1, z, 0.4 + Math.random() * 1.0, Math.floor(Math.random() * 3));
  }

  // Bushes scattered
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 6 + Math.random() * 18;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    if (Math.abs(x) < 7 && Math.abs(z) < 7) continue;
    createBush(x, CASTLE_BASE_Y + 0.15, z, 0.8 + Math.random() * 0.6);
  }

  // Path stones from castle gate to outer areas
  function addPath(waypoints, w) {
    w = w || 1.0;
    for (let i = 0; i < waypoints.length - 1; i++) {
      const p1 = waypoints[i], p2 = waypoints[i + 1];
      const dx = p2.x - p1.x, dz = p2.z - p1.z;
      const len = Math.sqrt(dx*dx + dz*dz);
      const angle = Math.atan2(dx, dz);
      const steps = Math.ceil(len);
      for (let s = 0; s < steps; s++) {
        const t = (s + 0.5) / steps;
        const px = p1.x + dx * t;
        const pz = p1.z + dz * t;
        const stone = createRock(px, CASTLE_BASE_Y + 0.1, pz, 0.25 + Math.random() * 0.2, Math.floor(Math.random() * 3));
        stone.material = Math.random() > 0.5 ? stoneWallLightMat : dirtMat;
      }
    }
  }
  addPath([{x:0,z:12}, {x:-1,z:16}, {x:-2,z:21}]);
  addPath([{x:2,z:11}, {x:8,z:13}, {x:14,z:14}]);
  addPath([{x:-2,z:10}, {x:-7,z:14}, {x:-12,z:14}]);

  // ============================================================
  // RUINED WATCHTOWER at the edge
  // ============================================================
  const watchtower = new BABYLON.TransformNode('watchtower', scene);
  watchtower.position.set(24, CASTLE_BASE_Y + 0.1, -22);
  watchtower.rotation.y = 0.3;

  // Base (square)
  const wtBase = BABYLON.MeshBuilder.CreateBox('wtBase', {
    width: 3, height: 2.5, depth: 3
  }, scene);
  wtBase.position.y = 1.25;
  wtBase.parent = watchtower;
  wtBase.material = stoneWallDarkMat;
  shadowGen.addShadowCaster(wtBase);
  wtBase.receiveShadows = true;

  // Top section (ruined - one wall missing, jagged top)
  const wtTop = BABYLON.MeshBuilder.CreateBox('wtTop', {
    width: 2.4, height: 2.2, depth: 2.4
  }, scene);
  wtTop.position.y = 3.6;
  wtTop.parent = watchtower;
  wtTop.material = stoneWallMat;
  shadowGen.addShadowCaster(wtTop);

  // Crumbled corner (using a box rotated, hanging over)
  const crumble = BABYLON.MeshBuilder.CreateBox('crumble', {
    width: 1.4, height: 0.8, depth: 0.8
  }, scene);
  crumble.position.set(-1.1, 2.7, -1.1);
  crumble.rotation.z = 0.3;
  crumble.parent = watchtower;
  crumble.material = stoneWallMat;
  shadowGen.addShadowCaster(crumble);

  // Window opening (dark)
  const wtWin = BABYLON.MeshBuilder.CreateBox('wtWin', {
    width: 0.6, height: 1.0, depth: 2.6
  }, scene);
  wtWin.position.set(0, 3.6, 0);
  wtWin.parent = watchtower;
  wtWin.material = mat('wtDark', 0.05, 0.05, 0.06, { unlit: true });

  // Crumbled battlements (irregular boxes on top, some leaning)
  for (let i = 0; i < 6; i++) {
    if (i === 1 || i === 4) continue; // missing
    const angle = (i / 6) * Math.PI * 2;
    const cren = BABYLON.MeshBuilder.CreateBox('wtCren', {
      width: 0.6, height: 0.5 + Math.random() * 0.3, depth: 0.5
    }, scene);
    cren.position.set(
      Math.cos(angle) * 1.2,
      4.7 + Math.random() * 0.3,
      Math.sin(angle) * 1.2
    );
    cren.rotation.set(
      (Math.random() - 0.5) * 0.3,
      -angle,
      (Math.random() - 0.5) * 0.4
    );
    cren.parent = watchtower;
    cren.material = stoneWallDarkMat;
    shadowGen.addShadowCaster(cren);
  }

  // Broken flag pole
  const brokenPole = cyl('brokenPole', { height: 1.8, diameter: 0.08, tessellation: 6 });
  brokenPole.position.set(0.5, 5.4, 0.5);
  brokenPole.rotation.z = 0.4;
  brokenPole.parent = watchtower;
  brokenPole.material = woodDarkMat;

  // Tattered flag
  const tatter = BABYLON.MeshBuilder.CreateBox('tatter', { width: 0.7, height: 0.4, depth: 0.03 }, scene);
  tatter.position.set(1.0, 5.7, 0.7);
  tatter.rotation.z = 0.4;
  tatter.parent = watchtower;
  tatter.material = mat('tatter', 0.6, 0.25, 0.18);

  // Rubble around watchtower base
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 1.5 + Math.random() * 1.5;
    createRock(Math.cos(angle) * r, 0.3, Math.sin(angle) * r, 0.3 + Math.random() * 0.5, Math.floor(Math.random() * 3));
  }

  // ============================================================
  // CHIMNEY SMOKE (a few houses)
  // ============================================================
  // Pick a couple of house positions for smoke (use approximate world positions)
  const smokeHouses = [
    { x: -14, z: 12 },
    { x: 14, z: 14 },
    { x: -16, z: -8 }
  ];
  const smokeEmitters = [];
  for (const sh of smokeHouses) {
    const ps = new BABYLON.ParticleSystem('smoke', 60, scene);
    ps.particleTexture = (() => {
      const t = new BABYLON.DynamicTexture('stex', { width: 64, height: 64 }, scene, false);
      const ctx = t.getContext();
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(0.5, 'rgba(200,200,200,0.5)');
      grad.addColorStop(1, 'rgba(200,200,200,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      t.hasAlpha = true;
      t.update();
      return t;
    })();
    ps.emitter = new BABYLON.Vector3(sh.x, CASTLE_BASE_Y + 3.2, sh.z);
    ps.minEmitBox = new BABYLON.Vector3(-0.1, 0, -0.1);
    ps.maxEmitBox = new BABYLON.Vector3(0.1, 0, 0.1);
    ps.color1 = new BABYLON.Color4(0.95, 0.95, 0.9, 0.6);
    ps.color2 = new BABYLON.Color4(0.85, 0.85, 0.85, 0.4);
    ps.colorDead = new BABYLON.Color4(0.7, 0.7, 0.7, 0);
    ps.minSize = 0.4;
    ps.maxSize = 1.2;
    ps.minLifeTime = 2;
    ps.maxLifeTime = 4;
    ps.emitRate = 8;
    ps.direction1 = new BABYLON.Vector3(-0.5, 1, -0.5);
    ps.direction2 = new BABYLON.Vector3(0.5, 2, 0.5);
    ps.minEmitPower = 0.5;
    ps.maxEmitPower = 1.2;
    ps.updateSpeed = 0.015;
    ps.gravity = new BABYLON.Vector3(0, 0.3, 0);
    ps.start();
    smokeEmitters.push(ps);
  }

  // ============================================================
  // DISTANT CLOUDS (billboard sprites)
  // ============================================================
  function createCloud(x, y, z, scale) {
    const cloud = new BABYLON.TransformNode('cloud', scene);
    cloud.position.set(x, y, z);
    cloud.scaling.setAll(scale || 1);

    for (let i = 0; i < 5; i++) {
      const blob = BABYLON.MeshBuilder.CreateSphere('cblob', { diameter: 2 + Math.random() * 2, segments: 8 }, scene);
      blob.position.set(
        (Math.random() - 0.5) * 4,
        (Math.random() - 0.5) * 0.5,
        (Math.random() - 0.5) * 2
      );
      blob.parent = cloud;
      blob.material = cloudMat;
    }
    return cloud;
  }

  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 40;
    const y = 5 + Math.random() * 30;
    createCloud(Math.cos(angle) * dist, y, Math.sin(angle) * dist, 0.6 + Math.random() * 0.8);
  }

  // ============================================================
  // WATER RIPPLE ANIMATION
  // ============================================================
  // Animate the river segments to give a subtle wave effect
  const riverAnimTime = { v: 0 };

  // ============================================================
  // RENDER LOOP
  // ============================================================
  const clock = { v: 0 };
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
    clock.v += dt;

    // Animate mill water wheel
    if (millData && millData.wheel) {
      millData.wheel.rotation.z -= dt * 1.5;
    }

    // Animate river surface (subtle sine wave on Y)
    for (let i = 0; i < riverSegments.length; i++) {
      const seg = riverSegments[i];
      const phase = i * 0.7 + clock.v * 2;
      seg.position.y += Math.sin(phase) * 0.002;
      // Slight color shift for shimmer
      if (seg.material === waterMat) {
        // Material is shared, so we don't change it
      }
    }

    // Animate waterfall mist slightly
    // (already animated via particle system)

    // Animate flag waving
    scene.meshes.filter(m => m.name === 'flag').forEach(f => {
      f.rotation.y = Math.sin(clock.v * 2) * 0.1;
    });
    scene.meshes.filter(m => m.name === 'bnr').forEach(b => {
      b.rotation.y = Math.sin(clock.v * 2 + 1) * 0.15;
    });

    // Slow camera auto-rotation around target (optional, very subtle)
    // Skipping to let user control
  });

  // ============================================================
  // RENDER
  // ============================================================
  engine.runRenderLoop(() => {
    scene.render();
  });

  window.addEventListener('resize', () => engine.resize());
})();
</script>
</body>
</html>
