<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            pointer-events: none;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.5));
        }
        .title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            letter-spacing: 1px;
        }
        .instructions {
            font-size: 1.2rem;
            max-width: 80%;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Medieval Floating Island Diorama</h1>
        <div class="instructions">
            A high-poly 3D floating island with medieval castle and village. 
            Drag to rotate, scroll to zoom, and right-click to pan. 
            Experience the handcrafted tabletop miniature aesthetic with vibrant colors and soft lighting.
        </div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <!-- Load Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.min.js"></script>
    <script src="https://cdn.babylonjs.com/serializers/babylon.serializers.min.js"></script>
    <script src="https://cdn.babylonjs.com/postProcesses/babylon.postProcess.min.js"></script>
    <script src="https://cdn.babylonjs.com/particles/babylon.particles.min.js"></script>

    <script>
        // Initialize Babylon.js scene
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        // Create scene
        const createScene = function() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.2, 0.4, 1.0);
            
            // Add lights
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.8;
            hemiLight.groundColor = new BABYLON.Color3(0.1, 0.2, 0.4);
            
            const directionalLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -1, -1), scene);
            directionalLight.position = new BABYLON.Vector3(10, 30, 10);
            directionalLight.intensity = 0.7;
            
            // Create camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 50, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.minZ = 0.1;
            camera.maxZ = 1000;
            camera.speed = 0.05;
            
            // Create floating island platform
            const island = BABYLON.MeshBuilder.CreateGround("island", {width: 40, height: 40, subdivisions: 50}, scene);
            island.position.y = 0;
            
            // Create terrain displacement using heightmap
            const heightMap = BABYLON.Texture.CreateFromBase64String(
                "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAA5klEQVRYV+2Y0QqCQBCGv1NlqVh2qXhJlqL1C9qK0GZb0ZpQYhRqE6J0V6V1YVQm9hXm8jIz88z88xP0j8dF5xhJ0lBk8kQ0jG8d0Rlq5JxL6a8Jqkq0lqX5QJc1XQ1RqjRdZjRjJ55Jc7c6Yq4XhVY4VQ6qQp2j1k5K0QjQ0qB6xjR4D2Q4qX6d36eQ3Q7qR9k5qQ5Y6q9VJ4y5V1c5jPdJcV4Xxj2j6P4PQdFZaJ7qY0ZlLJQ6Qq0QJ1Q56pZqXhQd4YjJc86hQjQd6dQ9a9qYdKQYd4QdX4Xq3c86d2Qa3aXq56R4x5RqQYqj6Zx55l1c75j6f1JcNQpLj5rYc6hJ2j5R3dV6d+4eVZc2c2x9q0p7T1cXh7ZxZJd3dXJd8d7q5J6d0Zl5d3cX65P27hP03xYd5e2cRnZj0XZc7X6n2Ld1cV4VJX8B398Q8jRv55kAAAAASUVORK5CYII=",
                "heightMap",
                scene
            );
            
            // Create a height map texture for terrain
            const heightMapTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/heightMap.png", scene);
            
            // Apply displacement to the island
            const displacement = new BABYLON.DisplacementMapMaterial("displacement", scene);
            displacement.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/wood.jpg", scene);
            displacement.displacementTexture = heightMapTexture;
            displacement.displacementHeight = 10;
            displacement.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.1);
            displacement.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            displacement.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            displacement.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/wood.jpg", scene);
            displacement.bumpLevel = 0.5;
            island.material = displacement;
            
            // Create castle
            const castle = BABYLON.MeshBuilder.CreateBox("castle", {width: 15, height: 30, depth: 15}, scene);
            castle.position.y = 15;
            
            // Create castle tower
            const tower = BABYLON.MeshBuilder.CreateBox("tower", {width: 8, height: 20, depth: 8}, scene);
            tower.position.y = 25;
            tower.parent = castle;
            
            // Create castle details
            const createCastleDetails = function() {
                // Add windows
                for (let i = 0; i < 5; i++) {
                    const window = BABYLON.MeshBuilder.CreateBox("window", {width: 0.8, height: 2, depth: 0.8}, scene);
                    window.position.y = 5 + i * 4;
                    window.position.x = 5;
                    window.position.z = 5;
                    window.parent = castle;
                    window.material = new BABYLON.StandardMaterial("windowMat", scene);
                    window.material.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.3);
                }
                
                // Add roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {diameter: 16, height: 3, tessellation: 12}, scene);
                roof.position.y = 30;
                roof.parent = castle;
                roof.rotation.x = Math.PI / 2;
                
                // Create roof tiles with displacement
                const roofTiles = BABYLON.MeshBuilder.CreateCylinder("roofTiles", {diameter: 16, height: 3, tessellation: 12}, scene);
                roofTiles.position.y = 30;
                roofTiles.parent = castle;
                roofTiles.rotation.x = Math.PI / 2;
                
                const roofMaterial = new BABYLON.StandardMaterial("roofMat", scene);
                roofMaterial.diffuseColor = new BABYLON.Color3(0.8, 0.2, 0.1);
                roofMaterial.emissiveColor = new BABYLON.Color3(0.9, 0.3, 0.2);
                roofTiles.material = roofMaterial;
            };
            
            createCastleDetails();
            
            // Create village elements
            const createVillage = function() {
                // Create houses
                for (let i = 0; i < 8; i++) {
                    const house = BABYLON.MeshBuilder.CreateBox("house" + i, {width: 4, height: 6, depth: 4}, scene);
                    house.position.x = -10 + i * 3;
                    house.position.z = 10 + i * 2;
                    house.position.y = 2;
                    
                    // Add roof
                    const houseRoof = BABYLON.MeshBuilder.CreateCylinder("houseRoof" + i, {diameter: 5, height: 2, tessellation: 12}, scene);
                    houseRoof.position.y = 6;
                    houseRoof.parent = house;
                    houseRoof.rotation.x = Math.PI / 2;
                    
                    // Add windows
                    const window1 = BABYLON.MeshBuilder.CreateBox("window1" + i, {width: 0.5, height: 1, depth: 0.5}, scene);
                    window1.position.x = 1.5;
                    window1.position.y = 3.5;
                    window1.position.z = 1.5;
                    window1.parent = house;
                    
                    const window2 = BABYLON.MeshBuilder.CreateBox("window2" + i, {width: 0.5, height: 1, depth: 0.5}, scene);
                    window2.position.x = -1.5;
                    window2.position.y = 3.5;
                    window2.position.z = 1.5;
                    window2.parent = house;
                    
                    // Add door
                    const door = BABYLON.MeshBuilder.CreateBox("door" + i, {width: 0.8, height: 2, depth: 0.2}, scene);
                    door.position.x = 0;
                    door.position.y = 1;
                    door.position.z = 2;
                    door.parent = house;
                    
                    // Add materials
                    const houseMaterial = new BABYLON.StandardMaterial("houseMat" + i, scene);
                    houseMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.3);
                    houseMaterial.emissiveColor = new BABYLON.Color3(0.6, 0.4, 0.2);
                    house.material = houseMaterial;
                    
                    const roofMaterial = new BABYLON.StandardMaterial("roofMat" + i, scene);
                    roofMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.1);
                    roofMaterial.emissiveColor = new BABYLON.Color3(0.7, 0.3, 0.2);
                    houseRoof.material = roofMaterial;
                }
                
                // Create tavern
                const tavern = BABYLON.MeshBuilder.CreateBox("tavern", {width: 6, height: 8, depth: 6}, scene);
                tavern.position.x = -15;
                tavern.position.z = -10;
                tavern.position.y = 2;
                
                // Add tavern roof
                const tavernRoof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", {diameter: 7, height: 3, tessellation: 12}, scene);
                tavernRoof.position.y = 8;
                tavernRoof.parent = tavern;
                tavernRoof.rotation.x = Math.PI / 2;
                
                // Add tavern details
                const tavernMaterial = new BABYLON.StandardMaterial("tavernMat", scene);
                tavernMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.3);
                tavernMaterial.emissiveColor = new BABYLON.Color3(0.6, 0.4, 0.2);
                tavern.material = tavernMaterial;
                
                const tavernRoofMaterial = new BABYLON.StandardMaterial("tavernRoofMat", scene);
                tavernRoofMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.1);
                tavernRoofMaterial.emissiveColor = new BABYLON.Color3(0.7, 0.3, 0.2);
                tavernRoof.material = tavernRoofMaterial;
                
                // Create mill
                const mill = BABYLON.MeshBuilder.CreateCylinder("mill", {diameter: 4, height: 10, tessellation: 12}, scene);
                mill.position.x = 10;
                mill.position.z = -10;
                mill.position.y = 2;
                mill.rotation.x = Math.PI / 2;
                
                // Add mill roof
                const millRoof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {diameter: 5, height: 3, tessellation: 12}, scene);
                millRoof.position.y = 10;
                millRoof.parent = mill;
                millRoof.rotation.x = Math.PI / 2;
                
                // Add mill details
                const millMaterial = new BABYLON.StandardMaterial("millMat", scene);
                millMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.3);
                millMaterial.emissiveColor = new BABYLON.Color3(0.6, 0.4, 0.2);
                mill.material = millMaterial;
                
                const millRoofMaterial = new BABYLON.StandardMaterial("millRoofMat", scene);
                millRoofMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.1);
                millRoofMaterial.emissiveColor = new BABYLON.Color3(0.7, 0.3, 0.2);
                millRoof.material = millRoofMaterial;
                
                // Create market stalls
                for (let i = 0; i < 5; i++) {
                    const stall = BABYLON.MeshBuilder.CreateBox("stall" + i, {width: 3, height: 2, depth: 3}, scene);
                    stall.position.x = 5 + i * 3;
                    stall.position.z = -15;
                    stall.position.y = 2;
                    
                    // Add stall roof
                    const stallRoof = BABYLON.MeshBuilder.CreateCylinder("stallRoof" + i, {diameter: 4, height: 1, tessellation: 12}, scene);
                    stallRoof.position.y = 2.5;
                    stallRoof.parent = stall;
                    stallRoof.rotation.x = Math.PI / 2;
                    
                    // Add stall details
                    const stallMaterial = new BABYLON.StandardMaterial("stallMat" + i, scene);
                    stallMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.3);
                    stallMaterial.emissiveColor = new BABYLON.Color3(0.6, 0.4, 0.2);
                    stall.material = stallMaterial;
                    
                    const stallRoofMaterial = new BABYLON.StandardMaterial("stallRoofMat" + i, scene);
                    stallRoofMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.1);
                    stallRoofMaterial.emissiveColor = new BABYLON.Color3(0.7, 0.3, 0.2);
                    stallRoof.material = stallRoofMaterial;
                }
            };
            
            createVillage();
            
            // Create natural elements
            const createNaturalElements = function() {
                // Create cliffs
                for (let i = 0; i < 4; i++) {
                    const cliff = BABYLON.MeshBuilder.CreateBox("cliff" + i, {width: 5, height: 10, depth: 5}, scene);
                    cliff.position.x = (i % 2 === 0 ? -20 : 20);
                    cliff.position.z = (i < 2 ? -20 : 20);
                    cliff.position.y = 5;
                    
                    // Add rock texture
                    const cliffMaterial = new BABYLON.StandardMaterial("cliffMat" + i, scene);
                    cliffMaterial.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/rock.jpg", scene);
                    cliffMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                    cliffMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                    cliffMaterial.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/rock.jpg", scene);
                    cliffMaterial.bumpLevel = 0.5;
                    cliff.material = cliffMaterial;
                }
                
                // Create grass
                const grass = BABYLON.MeshBuilder.CreateGround("grass", {width: 40, height: 40, subdivisions: 100}, scene);
                grass.position.y = 0.1;
                grass.material = new BABYLON.StandardMaterial("grassMat", scene);
                grass.material.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2);
                grass.material.backFaceCulling = false;
                
                // Create trees
                for (let i = 0; i < 15; i++) {
                    const tree = BABYLON.MeshBuilder.CreateCylinder("tree" + i, {diameter: 1, height: 5, tessellation: 8}, scene);
                    tree.position.x = -15 + Math.random() * 30;
                    tree.position.z = -15 + Math.random() * 30;
                    tree.position.y = 2.5;
                    
                    // Add tree details
                    const treeMaterial = new BABYLON.StandardMaterial("treeMat" + i, scene);
                    treeMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);
                    treeMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                    tree.material = treeMaterial;
                    
                    // Add tree top
                    const treeTop = BABYLON.MeshBuilder.CreateCone("treeTop" + i, {diameter: 3, height: 4, tessellation: 8}, scene);
                    treeTop.position.y = 5;
                    treeTop.parent = tree;
                    
                    const treeTopMaterial = new BABYLON.StandardMaterial("treeTopMat" + i, scene);
                    treeTopMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.5, 0.1);
                    treeTopMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                    treeTop.material = treeTopMaterial;
                }
                
                // Create river
                const river = BABYLON.MeshBuilder.CreateGround("river", {width: 30, height: 30, subdivisions: 50}, scene);
                river.position.y = 0;
                river.position.x = 0;
                river.position.z = 0;
                
                // Create a water shader for the river
                const waterMaterial = new BABYLON.WaterMaterial("water", scene);
                waterMaterial.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/waterBump.jpg", scene);
                waterMaterial.bumpTexture.hasAlpha = true;
                waterMaterial.bumpTexture.uScale = 10;
                waterMaterial.bumpTexture.vScale = 10;
                waterMaterial.windForce = 0.2;
                waterMaterial.waveHeight = 0.1;
                waterMaterial.waterColor = new BABYLON.Color4(0.1, 0.4, 0.8, 0.9);
                waterMaterial.colorBlend = new BABYLON.Color4(0.4, 0.9, 1.0, 0.9);
                waterMaterial.alpha = 0.8;
                waterMaterial.windDirection = new BABYLON.Vector2(0.5, 0.5);
                waterMaterial.reflectionTexture = new BABYLON.CubeTexture("https://assets.babylonjs.com/textures/skybox", scene);
                waterMaterial.refractionTexture = new BABYLON.CubeTexture("https://assets.babylonjs.com/textures/skybox", scene);
                
                // Apply the water material to the river
                river.material = waterMaterial;
                
                // Create river bridges
                for (let i = 0; i < 3; i++) {
                    const bridge = BABYLON.MeshBuilder.CreateBox("bridge" + i, {width: 3, height: 0.5, depth: 10}, scene);
                    bridge.position.x = -10 + i * 10;
                    bridge.position.z = -10;
                    bridge.position.y = 0.25;
                    
                    // Add bridge details
                    const bridgeMaterial = new BABYLON.StandardMaterial("bridgeMat" + i, scene);
                    bridgeMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.4, 0.2);
                    bridgeMaterial.specularColor = new BABYLON.Color3(0.3, 0.2, 0.1);
                    bridgeMaterial.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/wood.jpg", scene);
                    bridgeMaterial.bumpLevel = 0.5;
                    bridge.material = bridgeMaterial;
                }
                
                // Create waterfalls
                for (let i = 0; i < 2; i++) {
                    const waterfall = BABYLON.MeshBuilder.CreateBox("waterfall" + i, {width: 1, height: 5, depth: 1}, scene);
                    waterfall.position.x = -15 + i * 30;
                    waterfall.position.z = 10;
                    waterfall.position.y = 5;
                    
                    // Create particle system for water effect
                    const waterfallParticles = new BABYLON.ParticleSystem("waterfallParticles" + i, 5000, scene);
                    waterfallParticles.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/white.png", scene);
                    
                    // Set particle system properties
                    waterfallParticles.emitter = waterfall;
                    waterfallParticles.minEmitBox = new BABYLON.Vector3(-0.5, -0.5, -0.5);
                    waterfallParticles.maxEmitBox = new BABYLON.Vector3(0.5, -0.5, 0.5);
                    waterfallParticles.color1 = new BABYLON.Color4(0.5, 0.8, 1.0, 1.0);
                    waterfallParticles.color2 = new BABYLON.Color4(0.2, 0.5, 0.8, 1.0);
                    waterfallParticles.colorDead = new BABYLON.Color4(0, 0, 0, 0.0);
                    waterfallParticles.minSize = 0.1;
                    waterfallParticles.maxSize = 0.3;
                    waterfallParticles.minLifeTime = 1.0;
                    waterfallParticles.maxLifeTime = 2.0;
                    waterfallParticles.emitRate = 500;
                    waterfallParticles.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
                    
                    // Add gravity to particles
                    waterfallParticles.direction1 = new BABYLON.Vector3(0, -1, 0);
                    waterfallParticles.direction2 = new BABYLON.Vector3(0, -1, 0);
                    waterfallParticles.minAngularSpeed = 0;
                    waterfallParticles.maxAngularSpeed = Math.PI;
                    waterfallParticles.minEmitPower = 1;
                    waterfallParticles.maxEmitPower = 2;
                    waterfallParticles.updateSpeed = 0.01;
                    waterfallParticles.start();
                }
                
                // Create ruined watchtower
                const watchtower = BABYLON.MeshBuilder.CreateBox("watchtower", {width: 5, height: 15, depth: 5}, scene);
                watchtower.position.x = 20;
                watchtower.position.z = 20;
                watchtower.position.y = 7.5;
                
                // Add watchtower details
                const watchtowerMaterial = new BABYLON.StandardMaterial("watchtowerMat", scene);
                watchtowerMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                watchtowerMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                watchtowerMaterial.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/stone.jpg", scene);
                watchtowerMaterial.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/stone.jpg", scene);
                watchtowerMaterial.bumpLevel = 0.5;
                watchtower.material = watchtowerMaterial;
                
                // Create tower roof
                const watchtowerRoof = BABYLON.MeshBuilder.CreateCylinder("watchtowerRoof", {diameter: 6, height: 3, tessellation: 12}, scene);
                watchtowerRoof.position.y = 15;
                watchtowerRoof.parent = watchtower;
                watchtowerRoof.rotation.x = Math.PI / 2;
                
                // Add roof details
                const watchtowerRoofMaterial = new BABYLON.StandardMaterial("watchtowerRoofMat", scene);
                watchtowerRoofMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.1);
                watchtowerRoofMaterial.emissiveColor = new BABYLON.Color3(0.7, 0.3, 0.2);
                watchtowerRoof.material = watchtowerRoofMaterial;
                
                // Add ruin details
                const ruin = BABYLON.MeshBuilder.CreateBox("ruin", {width: 1, height: 5, depth: 1}, scene);
                ruin.position.x = 18;
                ruin.position.z = 18;
                ruin.position.y = 12;
                ruin.rotation.y = Math.PI / 4;
                ruin.parent = watchtower;
                
                const ruinMaterial = new BABYLON.StandardMaterial("ruinMat", scene);
                ruinMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                ruinMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                ruinMaterial.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/stone.jpg", scene);
                ruinMaterial.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/stone.jpg", scene);
                ruinMaterial.bumpLevel = 0.5;
                ruin.material = ruinMaterial;
            };
            
            createNaturalElements();
            
            // Add mist effect with particles
            const createMist = function() {
                const mist = new BABYLON.ParticleSystem("mist", 5000, scene);
                mist.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/smoke.png", scene);
                
                mist.emitter = new BABYLON.Vector3(0, 5, 0);
                mist.minEmitBox = new BABYLON.Vector3(-20, 0, -20);
                mist.maxEmitBox = new BABYLON.Vector3(20, 10, 20);
                mist.color1 = new BABYLON.Color4(0.8, 0.9, 1.0, 0.3);
                mist.color2 = new BABYLON.Color4(0.6, 0.7, 0.8, 0.2);
                mist.colorDead = new BABYLON.Color4(0, 0, 0, 0.0);
                mist.minSize = 0.5;
                mist.maxSize = 2.0;
                mist.minLifeTime = 5.0;
                mist.maxLifeTime = 10.0;
                mist.emitRate = 100;
                mist.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
                
                // Add gravity to particles
                mist.direction1 = new BABYLON.Vector3(0, -0.1, 0);
                mist.direction2 = new BABYLON.Vector3(0, -0.1, 0);
                mist.minAngularSpeed = 0;
                mist.maxAngularSpeed = Math.PI;
                mist.minEmitPower = 0.1;
                mist.maxEmitPower = 0.5;
                mist.updateSpeed = 0.01;
                mist.start();
            };
            
            createMist();
            
            // Add soft lighting
            const ambientLight = new BABYLON.AmbientLight("ambient", new BABYLON.Color3(0.3, 0.3, 0.3), scene);
            ambientLight.intensity = 0.5;
            
            // Add post-processing for soft look
            const postProcess = new BABYLON.FxaaPostProcess("fxaa", 1.0, camera, 1.0, scene);
            
            // Add fog
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogColor = new BABYLON.Color3(0.8, 0.9, 1.0);
            scene.fogDensity = 0.01;
            
            // Add a skybox
            const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", {size: 1000.0}, scene);
            const skyboxMaterial = new BABYLON.StandardMaterial("skyBox", scene);
            skyboxMaterial.backFaceCulling = false;
            skyboxMaterial.reflectionTexture = new BABYLON.CubeTexture("https://assets.babylonjs.com/textures/skybox", scene);
            skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
            skyboxMaterial.diffuseColor = new BABYLON.Color3(0, 0, 0);
            skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
            skybox.material = skyboxMaterial;
            
            // Create stylized water shader for the river
            const createStylizedWater = function() {
                const water = BABYLON.MeshBuilder.CreateGround("water", {width: 30, height: 30, subdivisions: 50}, scene);
                water.position.y = 0;
                
                // Create a simple water shader using the WaterMaterial class
                const waterMaterial = new BABYLON.WaterMaterial("waterMat", scene);
                waterMaterial.bumpTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/waterBump.jpg", scene);
                waterMaterial.bumpTexture.hasAlpha = true;
                waterMaterial.bumpTexture.uScale = 10;
                waterMaterial.bumpTexture.vScale = 10;
                waterMaterial.windForce = 0.2;
                waterMaterial.waveHeight = 0.1;
                waterMaterial.waterColor = new BABYLON.Color4(0.1, 0.4, 0.8, 0.9);
                waterMaterial.colorBlend = new BABYLON.Color4(0.4, 0.9, 1.0, 0.9);
                waterMaterial.alpha = 0.8;
                waterMaterial.windDirection = new BABYLON.Vector2(0.5, 0.5);
                waterMaterial.reflectionTexture = new BABYLON.CubeTexture("https://assets.babylonjs.com/textures/skybox", scene);
                waterMaterial.refractionTexture = new BABYLON.CubeTexture("https://assets.babylonjs.com/textures/skybox", scene);
                
                water.material = waterMaterial;
                
                // This is a simple implementation of a stylized water shader that mimics the effect described in the search results [[71]]
            };
            
            createStylizedWater();
            
            // Add some clouds
            const createClouds = function() {
                for (let i = 0; i < 5; i++) {
                    const cloud = BABYLON.MeshBuilder.CreateSphere("cloud" + i, {diameter: 2, segments: 16}, scene);
                    cloud.position.x = -20 + Math.random() * 40;
                    cloud.position.y = 20 + Math.random() * 10;
                    cloud.position.z = -20 + Math.random() * 40;
                    
                    const cloudMaterial = new BABYLON.StandardMaterial("cloudMat" + i, scene);
                    cloudMaterial.diffuseColor = new BABYLON.Color3(1.0, 1.0, 1.0);
                    cloudMaterial.alpha = 0.8;
                    cloudMaterial.specularColor = new BABYLON.Color3(0.8, 0.8, 0.8);
                    cloudMaterial.backFaceCulling = false;
                    cloud.material = cloudMaterial;
                }
            };
            
            createClouds();
            
            // Add camera animation for a more dynamic view
            scene.registerBeforeRender(function() {
                camera.alpha += 0.001;
                camera.beta = Math.PI / 2.5 + Math.sin(Date.now() / 5000) * 0.1;
                camera.radius = 40 + Math.sin(Date.now() / 3000) * 5;
            });
            
            // Add scene optimization
            scene.optimize();
            
            // Add a small info text
            const info = BABYLON.MeshBuilder.CreateTextPlane("info", {text: "Medieval Floating Island", size: 2, color: "white"}, scene);
            info.position.y = 25;
            info.rotation.x = Math.PI / 2;
            
            return scene;
        };
        
        // Create and run the scene
        const scene = createScene();
        
        // Add a simple animation for the scene
        engine.runRenderLoop(function() {
            scene.render();
        });
        
        // Handle window resize
        window.addEventListener("resize", function() {
            engine.resize();
        });
    </script>
</body>
</html>
