<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Floating Island Kingdom - 3D Diorama</title>
    <!-- Babylon.js Core & Addons -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
        }
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: #11141a;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            color: #f0f3f8;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
        /* Top & Bottom Glassmorphic UI */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .glass-panel {
            background: rgba(18, 22, 32, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 12px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffe082, #ffb74d, #ffa726);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-sub {
            font-size: 11px;
            color: #a0aec0;
            letter-spacing: 0.5px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            color: #fff;
        }
        .btn.active {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border-color: #ffb74d;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
        }
        .bottom-bar {
            align-self: center;
            margin-bottom: 8px;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 183, 77, 0.2);
            border-top: 3px solid #ffb74d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            #ui-container { padding: 10px; }
            .glass-panel { padding: 8px 14px; }
            .header-title { font-size: 14px; }
            .btn { padding: 6px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: 600; letter-spacing: 2px; color: #ffb74d;">CRAFTING DIORAMA...</div>
        <div style="font-size: 12px; color: #718096; margin-top: 6px;">Sculpting Cliffs & Hand-Painting Timber</div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <div id="ui-container">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div class="glass-panel">
                <div>
                    <div class="header-title">Floating Island Kingdom</div>
                    <div class="header-sub">Handcrafted 3D Tabletop Diorama</div>
                </div>
            </div>

            <div class="glass-panel btn-group">
                <button class="btn active" id="btn-day">☀️ Day</button>
                <button class="btn" id="btn-sunset">🌅 Sunset</button>
                <button class="btn" id="btn-night">🌙 Night</button>
            </div>
        </div>

        <div class="glass-panel bottom-bar btn-group">
            <button class="btn active" id="cam-overview">🏰 Overview</button>
            <button class="btn" id="cam-castle">👑 Castle Keep</button>
            <button class="btn" id="cam-village">🏡 Village & Market</button>
            <button class="btn" id="cam-mill">🌊 Watermill</button>
            <button class="btn" id="cam-tower">⚔️ Ruined Watchtower</button>
            <button class="btn" id="btn-rotate">🔄 Auto-Rotate</button>
        </div>
    </div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    
    let scene, camera, shadowGen, glowLayer;
    let sunLight, hemiLight, moonLight;
    let timeOfDay = 'day'; // 'day', 'sunset', 'night'
    let autoRotate = true;
    let animatedMeshes = [];
    let villageLanterns = [];
    let chimneySmokeParticles = [];

    // --- PROCEDURAL TEXTURE GENERATORS (Ensures 100% self-contained, zero missing CDN textures) ---
    function generateCanvasTexture(width, height, drawFn) {
        const pCanvas = document.createElement('canvas');
        pCanvas.width = width;
        pCanvas.height = height;
        const ctx = pCanvas.getContext('2d');
        drawFn(ctx, width, height);
        return new BABYLON.Texture(pCanvas.toDataURL(), scene);
    }

    // Stylized Cobblestone & Pavement
    function createCobbleTexture() {
        return generateCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#6b7280';
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#474d58';
            ctx.lineWidth = 4;
            const rows = 16, cols = 16;
            const rw = w / cols, rh = h / rows;
            for (let r = 0; r < rows; r++) {
                const offset = (r % 2) * (rw / 2);
                for (let c = -1; c <= cols + 1; c++) {
                    const x = c * rw + offset + (Math.random() * 4 - 2);
                    const y = r * rh + (Math.random() * 4 - 2);
                    const tone = Math.floor(100 + Math.random() * 40);
                    ctx.fillStyle = `rgb(${tone+10}, ${tone+12}, ${tone+15})`;
                    ctx.beginPath();
                    ctx.roundRect ? ctx.roundRect(x+2, y+2, rw-4, rh-4, 4) : ctx.rect(x+2, y+2, rw-4, rh-4);
                    ctx.fill();
                    ctx.stroke();
                }
            }
        });
    }

    // Hand-painted Stylized Wood Planks
    function createWoodTexture() {
        return generateCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#5c3826';
            ctx.fillRect(0, 0, w, h);
            const planks = 8;
            const ph = h / planks;
            for (let i = 0; i < planks; i++) {
                const y = i * ph;
                ctx.fillStyle = (i % 2 === 0) ? '#6e432e' : '#5a3421';
                ctx.fillRect(0, y + 2, w, ph - 4);
                // Wood grain streaks
                ctx.strokeStyle = '#442516';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let j = 0; j < 6; j++) {
                    const gy = y + 5 + Math.random() * (ph - 10);
                    ctx.moveTo(0, gy);
                    ctx.bezierCurveTo(w * 0.3, gy + Math.random()*8-4, w * 0.7, gy + Math.random()*8-4, w, gy);
                }
                ctx.stroke();
                // Nails
                ctx.fillStyle = '#26170d';
                ctx.beginPath();
                ctx.arc(15, y + ph/2, 3, 0, Math.PI*2);
                ctx.arc(w - 15, y + ph/2, 3, 0, Math.PI*2);
                ctx.fill();
            }
        });
    }

    // Striped Canopy Cloth
    function createStripeTexture(color1, color2) {
        return generateCanvasTexture(256, 256, (ctx, w, h) => {
            const stripes = 8;
            const sw = w / stripes;
            for (let i = 0; i < stripes; i++) {
                ctx.fillStyle = (i % 2 === 0) ? color1 : color2;
                ctx.fillRect(i * sw, 0, sw, h);
            }
        });
    }

    // Roof Shingles
    function createRoofTileTexture(baseColor, darkColor) {
        return generateCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = darkColor;
            ctx.fillRect(0, 0, w, h);
            const rows = 16, cols = 8;
            const rw = w / cols, rh = h / rows;
            for (let r = 0; r < rows; r++) {
                const offset = (r % 2) * (rw / 2);
                for (let c = -1; c <= cols + 1; c++) {
                    const x = c * rw + offset;
                    const y = r * rh;
                    ctx.fillStyle = baseColor;
                    ctx.beginPath();
                    ctx.arc(x + rw / 2, y + rh * 0.8, rw * 0.46, Math.PI, 0, false);
                    ctx.lineTo(x + rw, y);
                    ctx.lineTo(x, y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = darkColor;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
        });
    }

    // Soft Cloud Particle Texture
    function createCloudTexture() {
        return generateCanvasTexture(128, 128, (ctx, w, h) => {
            const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.5)');
            grad.addColorStop(0.8, 'rgba(255, 255, 255, 0.15)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        });
    }

    // --- MATERIAL PALETTE DICTIONARY ---
    let mats = {};
    function initMaterials() {
        // 1. Lush Stylized Grass
        mats.grass = new BABYLON.StandardMaterial("matGrass", scene);
        mats.grass.diffuseColor = new BABYLON.Color3(0.35, 0.68, 0.28);
        mats.grass.specularColor = new BABYLON.Color3(0.05, 0.1, 0.05);

        // 2. High Cliff Rock (Layered Strata)
        mats.cliffRock = new BABYLON.StandardMaterial("matCliff", scene);
        mats.cliffRock.diffuseColor = new BABYLON.Color3(0.42, 0.38, 0.35);
        mats.cliffRock.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

        // 3. Castle Cut Stone
        mats.castleStone = new BABYLON.StandardMaterial("matCastleStone", scene);
        mats.castleStone.diffuseTexture = createCobbleTexture();
        mats.castleStone.diffuseTexture.uScale = 4;
        mats.castleStone.diffuseTexture.vScale = 4;
        mats.castleStone.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);

        // 4. Village Half-Timber Plaster
        mats.plaster = new BABYLON.StandardMaterial("matPlaster", scene);
        mats.plaster.diffuseColor = new BABYLON.Color3(0.92, 0.88, 0.80);
        mats.plaster.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

        // 5. Rich Wood / Beams
        mats.wood = new BABYLON.StandardMaterial("matWood", scene);
        mats.wood.diffuseTexture = createWoodTexture();
        mats.wood.specularColor = new BABYLON.Color3(0.1, 0.08, 0.05);

        // 6. Roof Tiles (Burgundy & Royal Blue)
        mats.roofRed = new BABYLON.StandardMaterial("matRoofRed", scene);
        mats.roofRed.diffuseTexture = createRoofTileTexture('#b83a28', '#5c170d');
        mats.roofRed.diffuseTexture.uScale = 3;
        mats.roofRed.diffuseTexture.vScale = 3;

        mats.roofBlue = new BABYLON.StandardMaterial("matRoofBlue", scene);
        mats.roofBlue.diffuseTexture = createRoofTileTexture('#2d5d88', '#112940');
        mats.roofBlue.diffuseTexture.uScale = 3;
        mats.roofBlue.diffuseTexture.vScale = 3;

        // 7. Golden Thatch Roof
        mats.thatch = new BABYLON.StandardMaterial("matThatch", scene);
        mats.thatch.diffuseColor = new BABYLON.Color3(0.82, 0.65, 0.32);
        mats.thatch.specularColor = new BABYLON.Color3(0.05, 0.05, 0.02);

        // 8. Water & Foam
        mats.water = new BABYLON.StandardMaterial("matWater", scene);
        mats.water.diffuseColor = new BABYLON.Color3(0.08, 0.65, 0.78);
        mats.water.specularColor = new BABYLON.Color3(0.8, 0.95, 1.0);
        mats.water.specularPower = 64;
        mats.water.alpha = 0.85;

        mats.waterfall = new BABYLON.StandardMaterial("matWaterfall", scene);
        mats.waterfall.diffuseColor = new BABYLON.Color3(0.7, 0.95, 1.0);
        mats.waterfall.emissiveColor = new BABYLON.Color3(0.3, 0.6, 0.8);
        mats.waterfall.alpha = 0.88;

        // 9. Foliage Greens (Pine & Broadleaf)
        mats.pineDark = new BABYLON.StandardMaterial("matPineDark", scene);
        mats.pineDark.diffuseColor = new BABYLON.Color3(0.12, 0.38, 0.2);
        mats.pineDark.specularColor = new BABYLON.Color3(0.05, 0.1, 0.05);

        mats.pineLight = new BABYLON.StandardMaterial("matPineLight", scene);
        mats.pineLight.diffuseColor = new BABYLON.Color3(0.22, 0.52, 0.28);

        mats.foliageBush = new BABYLON.StandardMaterial("matBush", scene);
        mats.foliageBush.diffuseColor = new BABYLON.Color3(0.42, 0.72, 0.26);

        // 10. Lantern Glow & Windows
        mats.lanternGlow = new BABYLON.StandardMaterial("matLantern", scene);
        mats.lanternGlow.emissiveColor = new BABYLON.Color3(1.0, 0.75, 0.3);
        mats.lanternGlow.diffuseColor = new BABYLON.Color3(1.0, 0.85, 0.4);

        // 11. Market Canopies
        mats.tentRed = new BABYLON.StandardMaterial("matTentRed", scene);
        mats.tentRed.diffuseTexture = createStripeTexture('#c62828', '#ffffff');

        mats.tentBlue = new BABYLON.StandardMaterial("matTentBlue", scene);
        mats.tentBlue.diffuseTexture = createStripeTexture('#1565c0', '#ffe082');

        mats.tentGreen = new BABYLON.StandardMaterial("matTentGreen", scene);
        mats.tentGreen.diffuseTexture = createStripeTexture('#2e7d32', '#ffffff');

        // 12. Gold & Steel Accents
        mats.gold = new BABYLON.StandardMaterial("matGold", scene);
        mats.gold.diffuseColor = new BABYLON.Color3(0.9, 0.75, 0.2);
        mats.gold.specularColor = new BABYLON.Color3(1, 0.9, 0.5);

        mats.iron = new BABYLON.StandardMaterial("matIron", scene);
        mats.iron.diffuseColor = new BABYLON.Color3(0.2, 0.22, 0.25);
    }

    // --- MAIN SCENE SETUP ---
    function createScene() {
        scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.07, 0.09, 0.14, 1.0);

        // Cinematic ArcRotateCamera with smooth elasticity
        camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2.2, Math.PI / 3.2, 95, new BABYLON.Vector3(0, 4, 0), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 25;
        camera.upperRadiusLimit = 160;
        camera.upperBetaLimit = Math.PI / 2.05; // Prevent flipping below island
        camera.wheelPrecision = 20;
        camera.panningSensibility = 60;
        camera.useAutoRotationBehavior = false;

        // Glow Layer for lanterns, windows, and magical sparkles
        glowLayer = new BABYLON.GlowLayer("glow", scene, { mainTextureRatio: 0.5, blurKernelSize: 24 });
        glowLayer.intensity = 0.85;

        // --- LIGHTING RIG ---
        hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.65;
        hemiLight.groundColor = new BABYLON.Color3(0.18, 0.22, 0.28);
        hemiLight.diffuse = new BABYLON.Color3(0.85, 0.92, 1.0);

        sunLight = new BABYLON.DirectionalLight("sunLight", new BABYLON.Vector3(-0.7, -1.0, 0.65).normalize(), scene);
        sunLight.position = new BABYLON.Vector3(45, 65, -40);
        sunLight.intensity = 1.6;
        sunLight.diffuse = new BABYLON.Color3(1.0, 0.95, 0.82);

        // Soft Shadow Mapping
        shadowGen = new BABYLON.ShadowGenerator(2048, sunLight);
        shadowGen.useBlurExponentialShadowMap = true;
        shadowGen.blurKernel = 32;
        shadowGen.darkness = 0.45;

        initMaterials();

        // Build All Diorama Sections
        buildFloatingTerrain();
        buildCastleComplex();
        buildMedievalVillage();
        buildWatermill();
        buildRuinedWatchtower();
        buildRiverAndWaterfalls();
        buildFoliageAndVegetation();
        buildMarketStallsAndDetails();
        buildAtmosphericEffects();

        return scene;
    }

    // --- PROCEDURAL HIGH-POLY FLOATING ISLAND BASE ---
    function buildFloatingTerrain() {
        const islandRoot = new BABYLON.TransformNode("islandRoot", scene);

        // Top Lush Green Terraced Surface
        const ground = BABYLON.MeshBuilder.CreateGround("islandTop", {
            width: 58,
            height: 58,
            subdivisions: 45
        }, scene);
        ground.parent = islandRoot;
        ground.receiveShadows = true;

        // Sculpt realistic natural topography with castle hill, river depression, and village flats
        const positions = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const z = positions[i + 2];
            const dist = Math.sqrt(x * x + z * z);

            // Castle hill at (+5, -4)
            const castleDist = Math.hypot(x - 6, z + 6);
            let h = Math.max(0, 7.5 - castleDist * 0.48);

            // Village gentle slope
            const villageDist = Math.hypot(x + 12, z - 8);
            h += Math.max(0, 2.5 - villageDist * 0.2);

            // Watchtower crag at (+19, +17)
            const cragDist = Math.hypot(x - 19, z - 17);
            h += Math.max(0, 5.0 - cragDist * 0.55);

            // Carve winding riverbed from Castle mountain through village to east cliff
            // River spline approximation: z ~ 0.5 * x - 2
            const riverDist = Math.abs(z - (0.45 * x - 3));
            if (riverDist < 5.5 && x > -22 && x < 26) {
                h -= (1.0 - riverDist / 5.5) * 2.8;
            }

            // Natural noisy rim drop-off
            if (dist > 20) {
                const drop = (dist - 20) * 0.45 + (Math.sin(x * 0.5) * Math.cos(z * 0.5) * 0.8);
                h -= drop;
            }

            // Organic subtle micro bumps
            h += Math.sin(x * 0.8) * Math.cos(z * 0.8) * 0.35;
            positions[i + 1] = Math.max(-2.5, h);
        }
        ground.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
        BABYLON.VertexData.ComputeNormals(positions, ground.getIndices(), ground.getVerticesData(BABYLON.VertexBuffer.NormalKind));
        ground.material = mats.grass;
        shadowGen.addShadowCaster(ground);

        // Craggy Inverted Bottom Cliff Geometry (Floating Keel)
        const cliffBase = BABYLON.MeshBuilder.CreateCylinder("cliffBase", {
            height: 24,
            diameterTop: 54,
            diameterBottom: 1.5,
            tessellation: 28,
            subdivisions: 12
        }, scene);
        cliffBase.position.y = -12;
        cliffBase.parent = islandRoot;

        // Displace cliff vertices for craggy rocky stalactite feel
        const cPos = cliffBase.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        for (let i = 0; i < cPos.length; i += 3) {
            const y = cPos[i + 1];
            const noise = (Math.sin(cPos[i] * 0.6) + Math.cos(cPos[i + 2] * 0.6) + Math.sin(y * 0.8)) * 1.6;
            cPos[i] += noise * (1.0 - Math.abs(y + 12) / 16);
            cPos[i + 2] += noise * (1.0 - Math.abs(y + 12) / 16);
        }
        cliffBase.setVerticesData(BABYLON.VertexBuffer.PositionKind, cPos);
        BABYLON.VertexData.ComputeNormals(cPos, cliffBase.getIndices(), cliffBase.getVerticesData(BABYLON.VertexBuffer.NormalKind));
        cliffBase.material = mats.cliffRock;
        shadowGen.addShadowCaster(cliffBase);

        // 3 Floating Satellite Sub-Islands around the perimeter
        createMiniIsland(new BABYLON.Vector3(-32, -3, 14), 7.5, 9);
        createMiniIsland(new BABYLON.Vector3(28, -6, -22), 6.0, 7);
        createMiniIsland(new BABYLON.Vector3(26, -4, 26), 5.0, 6);
    }

    function createMiniIsland(pos, radius, depth) {
        const mini = BABYLON.MeshBuilder.CreateCylinder("miniIsland", {
            height: depth,
            diameterTop: radius * 2,
            diameterBottom: 0.8,
            tessellation: 12
        }, scene);
        mini.position.copyFrom(pos);
        mini.material = mats.cliffRock;
        shadowGen.addShadowCaster(mini);

        // Top grass cap
        const cap = BABYLON.MeshBuilder.CreateCylinder("miniCap", {
            height: 0.8,
            diameter: radius * 2.05,
            tessellation: 12
        }, scene);
        cap.position.set(pos.x, pos.y + depth / 2, pos.z);
        cap.material = mats.grass;
        cap.receiveShadows = true;

        // Add 1-2 small pine trees on satellite island
        createPineTree(new BABYLON.Vector3(pos.x + 0.5, pos.y + depth / 2 + 0.4, pos.z - 0.5), 0.75);
    }

    // --- THE GRAND MEDIEVAL CASTLE ---
    function buildCastleComplex() {
        const castleRoot = new BABYLON.TransformNode("castleRoot", scene);
        castleRoot.position.set(6, 6.8, -6);

        // Main Central Keep (Donjon)
        const keepBase = BABYLON.MeshBuilder.CreateBox("keepBase", { width: 9, height: 11, depth: 9 }, scene);
        keepBase.position.y = 5.5;
        keepBase.material = mats.castleStone;
        keepBase.parent = castleRoot;
        shadowGen.addShadowCaster(keepBase);

        // Upper Tier of Keep
        const keepTop = BABYLON.MeshBuilder.CreateBox("keepTop", { width: 10.2, height: 2.2, depth: 10.2 }, scene);
        keepTop.position.y = 11.2;
        keepTop.material = mats.castleStone;
        keepTop.parent = castleRoot;
        shadowGen.addShadowCaster(keepTop);

        // Grand Royal Spire / Tower
        const spireTower = BABYLON.MeshBuilder.CreateCylinder("spireTower", { height: 16, diameter: 4.8, tessellation: 16 }, scene);
        spireTower.position.set(0, 13, 0);
        spireTower.material = mats.castleStone;
        spireTower.parent = castleRoot;

    // Modular Tudor/Timber House Builder
    function buildTimberHouse(cfg) {
        const hGroup = new BABYLON.TransformNode("house", scene);
        hGroup.parent = cfg.root;
        hGroup.position.copyFrom(cfg.pos);
        hGroup.rotation.y = cfg.rotY || 0;

        const w = cfg.size.w, h = cfg.size.h, d = cfg.size.d;

        // Ground Stone Foundation
        const found = BABYLON.MeshBuilder.CreateBox("hFound", { width: w, height: 1.2, depth: d }, scene);
        found.position.y = 0.6;
        found.material = mats.castleStone;
        found.parent = hGroup;
        shadowGen.addShadowCaster(found);

        // Half-Timber Plaster Walls
        const walls = BABYLON.MeshBuilder.CreateBox("hWalls", { width: w * 0.94, height: h - 1.2, depth: d * 0.94 }, scene);
        walls.position.y = 1.2 + (h - 1.2) / 2;
        walls.material = mats.plaster;
        walls.parent = hGroup;
        shadowGen.addShadowCaster(walls);

        // Dark Timber Beams (Corner posts)
        const postSize = 0.35;
        const corners = [
            { x: -w/2 * 0.94, z: -d/2 * 0.94 },
            { x:  w/2 * 0.94, z: -d/2 * 0.94 },
            { x: -w/2 * 0.94, z:  d/2 * 0.94 },
            { x:  w/2 * 0.94, z:  d/2 * 0.94 }
        ];
        corners.forEach(c => {
            const post = BABYLON.MeshBuilder.CreateBox("hPost", { width: postSize, height: h, depth: postSize }, scene);
            post.position.set(c.x, h / 2 + 0.6, c.z);
            post.material = mats.wood;
            post.parent = hGroup;
            shadowGen.addShadowCaster(post);
        });

        // Pitch Roof (Prism)
        const roof = BABYLON.MeshBuilder.CreateCylinder("hRoof", {
            diameter: Math.max(w, d) * 1.25,
            height: w * 1.15,
            tessellation: 3
        }, scene);
        roof.rotation.z = Math.PI / 2;
        roof.rotation.y = Math.PI / 2;
        roof.scaling.set(0.65, 1, 1.2);
        roof.position.set(0, h + 1.2, 0);
        roof.material = cfg.roofMat;
        roof.parent = hGroup;
        shadowGen.addShadowCaster(roof);

        // Stone Chimney with Smoke Particles
        if (cfg.hasChimney) {
            const chim = BABYLON.MeshBuilder.CreateBox("hChim", { width: 0.9, height: h * 0.85, depth: 0.9 }, scene);
            chim.position.set(w * 0.3, h + 1.0, d * 0.2);
            chim.material = mats.castleStone;
            chim.parent = hGroup;
            shadowGen.addShadowCaster(chim);

            // Chimney Smoke System
            createChimneySmoke(new BABYLON.Vector3(
                cfg.root.position.x + cfg.pos.x + chim.position.x,
                cfg.root.position.y + cfg.pos.y + chim.position.y + 1.8,
                cfg.root.position.z + cfg.pos.z + chim.position.z
            ));
        }

        // Wooden Door & Window with Warm Glow
        const door = BABYLON.MeshBuilder.CreateBox("hDoor", { width: 1.1, height: 2.0, depth: 0.2 }, scene);
        door.position.set(0, 1.4, d / 2 * 0.96);
        door.material = mats.wood;
        door.parent = hGroup;

        const win = BABYLON.MeshBuilder.CreatePlane("hWin", { width: 0.9, height: 0.9 }, scene);
        win.position.set(w * 0.25, 2.2, d / 2 * 0.97);
        win.material = mats.lanternGlow;
        win.parent = hGroup;

        // Street / Door Lantern Light
        createLantern(new BABYLON.Vector3(
            cfg.root.position.x + cfg.pos.x + 1.0,
            cfg.root.position.y + cfg.pos.y + 2.2,
            cfg.root.position.z + cfg.pos.z + d / 2 + 0.4
        ));

        // Optional Tavern Porch
        if (cfg.hasPorch) {
            const porchFloor = BABYLON.MeshBuilder.CreateBox("porch", { width: w * 0.8, height: 0.25, depth: 2.2 }, scene);
            porchFloor.position.set(0, 0.4, d/2 + 1.1);
            porchFloor.material = mats.wood;
            porchFloor.parent = hGroup;

            // Barrels on porch
            createBarrel(new BABYLON.Vector3(
                cfg.root.position.x + cfg.pos.x - 1.5,
                cfg.root.position.y + cfg.pos.y + 0.9,
                cfg.root.position.z + cfg.pos.z + d/2 + 1.0
            ));
        }

        // Optional Fishing Pier & Boat
        if (cfg.hasPier) {
            const pier = BABYLON.MeshBuilder.CreateBox("pier", { width: 1.6, height: 0.3, depth: 4.5 }, scene);
            pier.position.set(0, 0.2, d/2 + 2.2);
            pier.material = mats.wood;
            pier.parent = hGroup;
            shadowGen.addShadowCaster(pier);
        }
    }

    // --- RIVERSIDE WATERMILL & SPINNING WHEEL ---
    function buildWatermill() {
        const millRoot = new BABYLON.TransformNode("millRoot", scene);
        millRoot.position.set(-1, 2.4, 2);

        // Mill Building
        const millHouse = BABYLON.MeshBuilder.CreateBox("millHouse", { width: 5.5, height: 5.0, depth: 5.5 }, scene);

        shadowGen.addShadowCaster(millHouse);

        const millRoof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {
            diameter: 6.8,
            height: 6.2,
            tessellation: 3
        }, scene);
        millRoof.rotation.z = Math.PI / 2;
        millRoof.rotation.y = Math.PI / 2;
        millRoof.scaling.set(0.7, 1, 1.2);
        millRoof.position.set(0, 6.2, 0);
        millRoof.material = mats.roofRed;
        millRoof.parent = millRoot;
        shadowGen.addShadowCaster(millRoof);

        // Spinning Waterwheel over the river canal
        const wheelGroup = new BABYLON.TransformNode("waterWheel", scene);
        wheelGroup.position.set(3.2, 1.2, 0);
        wheelGroup.parent = millRoot;

        const axle = BABYLON.MeshBuilder.CreateCylinder("wheelAxle", { diameter: 0.6, height: 1.5 }, scene);
        axle.rotation.z = Math.PI / 2;
        axle.material = mats.wood;
        axle.parent = wheelGroup;

        const rim1 = BABYLON.MeshBuilder.CreateTorus("wheelRim1", { diameter: 4.6, thickness: 0.22, tessellation: 24 }, scene);
        rim1.rotation.z = Math.PI / 2;
        rim1.position.x = 0.4;
        rim1.material = mats.wood;
        rim1.parent = wheelGroup;

        const rim2 = rim1.clone("wheelRim2", wheelGroup);
        rim2.position.x = -0.4;

        // Wheel Paddles / Blades
        const bladeCount = 10;
        for (let i = 0; i < bladeCount; i++) {
            const angle = (i / bladeCount) * Math.PI * 2;
            const paddle = BABYLON.MeshBuilder.CreateBox(`paddle_${i}`, { width: 0.9, height: 0.15, depth: 1.1 }, scene);
            paddle.position.set(0, Math.sin(angle) * 1.9, Math.cos(angle) * 1.9);
            paddle.rotation.x = angle;
            paddle.material = mats.wood;
            paddle.parent = wheelGroup;
            shadowGen.addShadowCaster(paddle);

        // Register Wheel Animation
        animatedMeshes.push({
            mesh: wheelGroup,

                wheelGroup.rotation.x -= dt * 1.8;

        // River Footbridge alongside Mill
        const bridge = BABYLON.MeshBuilder.CreateBox("millBridge", { width: 3.2, height: 0.4, depth: 7.5 }, scene);
        bridge.position.set(0.5, 0.4, 6.8);
        bridge.material = mats.wood;
        bridge.parent = millRoot;
        shadowGen.addShadowCaster(bridge);

        // Bridge Rails
        const railL = BABYLON.MeshBuilder.CreateBox("railL", { width: 0.2, height: 0.9, depth: 7.5 }, scene);
        railL.position.set(-1.4, 0.9, 6.8);
        railL.material = mats.wood;
        railL.parent = millRoot;

        const railR = railL.clone("railR", millRoot);
        railR.position.x = 1.4;
    }

    function createWaterfallSheet(pos, width, height, rotY) {
        const sheet = BABYLON.MeshBuilder.CreatePlane("fallSheet", { width: width, height: height }, scene);
        sheet.position.copyFrom(pos);
        sheet.position.y -= height / 2;
        sheet.rotation.y = rotY;
        sheet.material = mats.waterfall;

        // Waterfall Foam Edge Bar
        const foam = BABYLON.MeshBuilder.CreateBox("fallFoam", { width: width * 1.05, height: 0.6, depth: 0.6 }, scene);
        foam.position.set(pos.x, pos.y, pos.z);
        foam.rotation.y = rotY;
        foam.material = mats.waterfall;

        // Mist Particle Generator at bottom of waterfall
        createWaterfallMist(new BABYLON.Vector3(pos.x, pos.y - height + 1, pos.z));
    }

    function createWaterfallMist(pos) {
        const mist = new BABYLON.ParticleSystem("mistParticles", 60, scene);
        mist.particleTexture = createCloudTexture();
        mist.emitter = pos;
        mist.minEmitBox = new BABYLON.Vector3(-2, -1, -2);
        mist.maxEmitBox = new BABYLON.Vector3(2, 1, 2);
        mist.color1 = new BABYLON.Color4(0.8, 0.95, 1.0, 0.6);
        mist.color2 = new BABYLON.Color4(0.9, 1.0, 1.0, 0.2);
        mist.colorDead = new BABYLON.Color4(1, 1, 1, 0.0);
        mist.minSize = 3.0;
        mist.maxSize = 7.0;
        mist.minLifeTime = 1.0;
        mist.maxLifeTime = 2.2;
        mist.emitRate = 25;
        mist.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
        mist.gravity = new BABYLON.Vector3(0, -0.5, 0);
        mist.direction1 = new BABYLON.Vector3(-1, 0.5, -1);
        mist.direction2 = new BABYLON.Vector3(1, 1.5, 1);
        mist.minEmitPower = 1;
        mist.maxEmitPower = 3;
        mist.start();
    }

    // High-Poly Tiered Stylized Pine
    function createPineTree(pos, scale = 1.0, parent = null) {
        const pGroup = new BABYLON.TransformNode("pineTree", scene);
        pGroup.position.copyFrom(pos);
        pGroup.scaling.set(scale, scale, scale);
        if (parent) pGroup.parent = parent;

        // Trunk
        const trunk = BABYLON.MeshBuilder.CreateCylinder("pTrunk", { diameter: 0.6, height: 2.5 }, scene);
        trunk.position.y = 1.25;
        trunk.material = mats.wood;
        trunk.parent = pGroup;
        shadowGen.addShadowCaster(trunk);

        // 3 Layered Needle Cones
        const tiers = [
            { y: 2.6, d: 3.8, h: 2.4, mat: mats.pineDark },
            { y: 4.0, d: 3.0, h: 2.2, mat: mats.pineLight },
            { y: 5.3, d: 2.0, h: 2.0, mat: mats.pineDark }
        ];

        tiers.forEach((t, i) => {
            const cone = BABYLON.MeshBuilder.CreateCylinder(`pCone_${i}`, {
                diameterTop: 0.1,
                diameterBottom: t.d,
                height: t.h,
                tessellation: 8
            }, scene);
            cone.position.y = t.y;
            cone.material = t.mat;
            cone.parent = pGroup;
            shadowGen.addShadowCaster(cone);
        });
    }

    // Fluffy Tabletop Broadleaf Tree
    function createLeafyTree(pos, scale = 1.0, parent = null) {
        const lGroup = new BABYLON.TransformNode("leafyTree", scene);
        lGroup.position.copyFrom(pos);
        lGroup.scaling.set(scale, scale, scale);
        if (parent) lGroup.parent = parent;

        // Trunk
        const trunk = BABYLON.MeshBuilder.CreateCylinder("lTrunk", { diameterTop: 0.5, diameterBottom: 0.9, height: 3.0 }, scene);
        trunk.position.y = 1.5;
        trunk.material = mats.wood;
        trunk.parent = lGroup;
        shadowGen.addShadowCaster(trunk);

        // Clustered Cloud Spheres for Foliage
        const spheres = [
            { x: 0, y: 3.8, z: 0, s: 2.8 },
            { x: -0.8, y: 3.4, z: 0.6, s: 2.0 },
            { x: 0.8, y: 3.5, z: -0.6, s: 2.2 },
            { x: 0.4, y: 4.6, z: 0.4, s: 1.8 }
        ];

        spheres.forEach((sp, i) => {
            const puff = BABYLON.MeshBuilder.CreateSphere(`puff_${i}`, { diameter: sp.s, segments: 6 }, scene);
            puff.position.set(sp.x, sp.y, sp.z);
            puff.material = mats.foliageBush;
            puff.parent = lGroup;
            shadowGen.addShadowCaster(puff);
        });
    }

    // --- MARKET STALLS & TABLETOP DETAILS ---
    function buildMarketStallsAndDetails() {
        const marketRoot = new BABYLON.TransformNode("marketRoot", scene);
        marketRoot.position.set(-8, 2.1, -4);

        // Market Stall 1 (Red/White Canopy - Bakery & Bread)
        createMarketStall(new BABYLON.Vector3(-2, 0, 0), mats.tentRed, 0.4, marketRoot);

        // Market Stall 2 (Blue/Gold Canopy - Potions & Magic)
        createMarketStall(new BABYLON.Vector3(1.5, 0, -2), mats.tentBlue, -0.2, marketRoot);

        // Market Stall 3 (Green/White Canopy - Fresh Produce)
        createMarketStall(new BABYLON.Vector3(2.5, 0, 2.5), mats.tentGreen, 1.2, marketRoot);

        // Wooden Signpost
        const post = BABYLON.MeshBuilder.CreateCylinder("signPost", { diameter: 0.18, height: 2.4 }, scene);
        post.position.set(-4.5, 1.2, 0.5);
        post.material = mats.wood;
        post.parent = marketRoot;

        const sign = BABYLON.MeshBuilder.CreateBox("signBoard", { width: 1.2, height: 0.35, depth: 0.08 }, scene);
        sign.position.set(-4.5, 2.1, 0.5);
        sign.rotation.y = 0.6;
        sign.material = mats.wood;
        sign.parent = marketRoot;
    }

    function createMarketStall(pos, canopyMat, rotY, parent) {
        const stall = new BABYLON.TransformNode("stall", scene);
        stall.position.copyFrom(pos);
        stall.rotation.y = rotY;
        stall.parent = parent;

        // Table
        const table = BABYLON.MeshBuilder.CreateBox("sTable", { width: 2.6, height: 0.9, depth: 1.4 }, scene);
        table.position.y = 0.45;
        table.material = mats.wood;
        table.parent = stall;
        shadowGen.addShadowCaster(table);

        // 4 Canopy Corner Poles
        const poles = [
            { x: -1.2, z: -0.6 },
            { x:  1.2, z: -0.6 },
            { x: -1.2, z:  0.6 },
            { x:  1.2, z:  0.6 }
        ];
        poles.forEach(p => {
            const pole = BABYLON.MeshBuilder.CreateCylinder("pole", { diameter: 0.1, height: 2.6 }, scene);
            pole.position.set(p.x, 1.3, p.z);
            pole.material = mats.wood;
            pole.parent = stall;
        });

        // Striped Awning Canopy
        const roof = BABYLON.MeshBuilder.CreateCylinder("awning", {
            diameter: 2.2,
            height: 2.8,
            tessellation: 3
        }, scene);
        roof.rotation.z = Math.PI / 2;
        roof.rotation.y = Math.PI / 2;
        roof.scaling.set(0.45, 1, 1.1);
        roof.position.set(0, 2.5, 0);
        roof.material = canopyMat;
        roof.parent = stall;
        shadowGen.addShadowCaster(roof);

        // Crates on table
        const crate = BABYLON.MeshBuilder.CreateBox("crate", { width: 0.6, height: 0.4, depth: 0.5 }, scene);
        crate.position.set(-0.6, 1.1, 0);
        crate.material = mats.wood;
        crate.parent = stall;
    }

    function createBarrel(pos) {
        const barrel = BABYLON.MeshBuilder.CreateCylinder("barrel", { diameter: 0.9, height: 1.2, tessellation: 10 }, scene);
        barrel.position.copyFrom(pos);
        barrel.material = mats.wood;
        shadowGen.addShadowCaster(barrel);
    }

    // Warm Village Lantern with Dynamic Point Light
    function createLantern(pos, intensity = 1.2, hexColor = '#ffb74d') {
        const lanternMesh = BABYLON.MeshBuilder.CreateSphere("lanternMesh", { diameter: 0.4 }, scene);
        lanternMesh.position.copyFrom(pos);
        lanternMesh.material = mats.lanternGlow;

        const light = new BABYLON.PointLight("lanternLight", pos, scene);
        light.diffuse = BABYLON.Color3.FromHexString(hexColor);
        light.intensity = intensity;
        light.range = 8.0;

        villageLanterns.push({ light: light, baseIntensity: intensity });
    }

    // Chimney Smoke Particles
    function createChimneySmoke(pos) {
        const smoke = new BABYLON.ParticleSystem("chimneySmoke", 30, scene);
        smoke.particleTexture = createCloudTexture();
        smoke.emitter = pos;
        smoke.minEmitBox = new BABYLON.Vector3(-0.1, 0, -0.1);
        smoke.maxEmitBox = new BABYLON.Vector3(0.1, 0.2, 0.1);
        smoke.color1 = new BABYLON.Color4(0.85, 0.85, 0.9, 0.45);
        smoke.color2 = new BABYLON.Color4(0.65, 0.65, 0.7, 0.2);
        smoke.colorDead = new BABYLON.Color4(0.4, 0.4, 0.4, 0.0);
        smoke.minSize = 0.8;
        smoke.maxSize = 2.2;
        smoke.minLifeTime = 1.5;
        smoke.maxLifeTime = 3.0;
        smoke.emitRate = 8;
        smoke.gravity = new BABYLON.Vector3(0.2, 1.2, 0);
        smoke.direction1 = new BABYLON.Vector3(-0.2, 0.8, -0.2);
        smoke.direction2 = new BABYLON.Vector3(0.4, 1.5, 0.4);
        smoke.minEmitPower = 0.5;
        smoke.maxEmitPower = 1.2;
        smoke.start();
        chimneySmokeParticles.push(smoke);
    }

    // --- FLOATING ATMOSPHERIC CLOUDS & DUST MOTES ---
    function buildAtmosphericEffects() {
        // Ring of Soft Low-Poly Floating Fluffy Clouds
        const cloudRoot = new BABYLON.TransformNode("cloudRoot", scene);
        const cloudCount = 14;
        for (let i = 0; i < cloudCount; i++) {
            const angle = (i / cloudCount) * Math.PI * 2;
            const dist = 36 + Math.random() * 12;
            const cGroup = new BABYLON.TransformNode(`cloud_${i}`, scene);
            cGroup.position.set(Math.sin(angle) * dist, -4 + (Math.random() * 8 - 4), Math.cos(angle) * dist);
            cGroup.parent = cloudRoot;

            // Clustered cloud blobs
            const blobs = 4 + Math.floor(Math.random() * 3);
            for (let b = 0; b < blobs; b++) {
                const puff = BABYLON.MeshBuilder.CreateSphere(`cPuff_${i}_${b}`, { diameter: 4 + Math.random() * 4, segments: 6 }, scene);
                puff.position.set(b * 2.2 - 3, Math.random() * 1.5, Math.random() * 2);
                puff.material = mats.plaster;
                puff.parent = cGroup;
            }
        }

        // Slow Cloud Ring Orbit
        animatedMeshes.push({
            mesh: cloudRoot,
            update: (t, dt) => {
                cloudRoot.rotation.y += dt * 0.03;
            }
        });

        // Golden Sun Dust Motes
        const motes = new BABYLON.ParticleSystem("dustMotes", 120, scene);
        motes.particleTexture = createCloudTexture();
        motes.emitter = new BABYLON.Vector3(0, 8, 0);
        motes.minEmitBox = new BABYLON.Vector3(-30, -5, -30);
        motes.maxEmitBox = new BABYLON.Vector3(30, 20, 30);
        motes.color1 = new BABYLON.Color4(1.0, 0.9, 0.6, 0.5);
        motes.color2 = new BABYLON.Color4(1.0, 0.75, 0.3, 0.2);
        motes.colorDead = new BABYLON.Color4(1, 1, 1, 0);
        motes.minSize = 0.3;
        motes.maxSize = 0.8;
        motes.minLifeTime = 3.0;
        motes.maxLifeTime = 6.0;
        motes.emitRate = 25;
        motes.gravity = new BABYLON.Vector3(0, 0.05, 0);
        motes.direction1 = new BABYLON.Vector3(-0.5, -0.2, -0.5);
        motes.direction2 = new BABYLON.Vector3(0.5, 0.4, 0.5);
        motes.minEmitPower = 0.2;
        motes.maxEmitPower = 0.8;
        motes.start();
    }

    // --- TIME OF DAY SYSTEM (DAY / SUNSET / NIGHT) ---
    function setTimeOfDay(mode) {
        timeOfDay = mode;
        const duration = 1.0; // Smooth transitions

        document.getElementById('btn-day').classList.toggle('active', mode === 'day');
        document.getElementById('btn-sunset').classList.toggle('active', mode === 'sunset');
        document.getElementById('btn-night').classList.toggle('active', mode === 'night');

        if (mode === 'day') {
            scene.clearColor = new BABYLON.Color4(0.55, 0.78, 0.95, 1.0);
            sunLight.diffuse = new BABYLON.Color3(1.0, 0.95, 0.85);
            sunLight.intensity = 1.6;
            hemiLight.diffuse = new BABYLON.Color3(0.85, 0.92, 1.0);
            hemiLight.groundColor = new BABYLON.Color3(0.2, 0.25, 0.22);
            hemiLight.intensity = 0.65;
            villageLanterns.forEach(l => l.light.intensity = l.baseIntensity * 0.4);
            glowLayer.intensity = 0.5;
        } else if (mode === 'sunset') {
            scene.clearColor = new BABYLON.Color4(0.85, 0.45, 0.32, 1.0);
            sunLight.diffuse = new BABYLON.Color3(1.0, 0.55, 0.25);
            sunLight.intensity = 1.8;
            hemiLight.diffuse = new BABYLON.Color3(0.95, 0.6, 0.4);
            hemiLight.groundColor = new BABYLON.Color3(0.3, 0.15, 0.12);
            hemiLight.intensity = 0.5;
            villageLanterns.forEach(l => l.light.intensity = l.baseIntensity * 1.2);
            glowLayer.intensity = 1.1;
        } else if (mode === 'night') {
            scene.clearColor = new BABYLON.Color4(0.04, 0.06, 0.10, 1.0);
            sunLight.diffuse = new BABYLON.Color3(0.2, 0.3, 0.55);
            sunLight.intensity = 0.45;
            hemiLight.diffuse = new BABYLON.Color3(0.15, 0.2, 0.35);
            hemiLight.groundColor = new BABYLON.Color3(0.02, 0.03, 0.05);
            hemiLight.intensity = 0.3;
            villageLanterns.forEach(l => l.light.intensity = l.baseIntensity * 2.4);
            glowLayer.intensity = 1.6;
        }
    }

    // --- CAMERA PRESET ANIMATIONS ---
    function easeCameraTo(targetAlpha, targetBeta, targetRadius, targetTarget) {
        const animAlpha = new BABYLON.Animation("camA", "alpha", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
        const animBeta  = new BABYLON.Animation("camB", "beta", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
        const animRad   = new BABYLON.Animation("camR", "radius", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
        const animTgt   = new BABYLON.Animation("camT", "target", 30, BABYLON.Animation.ANIMATIONTYPE_VECTOR3, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);

        const ease = new BABYLON.CubicEase();
        ease.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);

        animAlpha.setEasingFunction(ease);
        animBeta.setEasingFunction(ease);
        animRad.setEasingFunction(ease);
        animTgt.setEasingFunction(ease);

        animAlpha.setKeys([{ frame: 0, value: camera.alpha }, { frame: 30, value: targetAlpha }]);
        animBeta.setKeys([{ frame: 0, value: camera.beta }, { frame: 30, value: targetBeta }]);
        animRad.setKeys([{ frame: 0, value: camera.radius }, { frame: 30, value: targetRadius }]);
        animTgt.setKeys([{ frame: 0, value: camera.target.clone() }, { frame: 30, value: targetTarget }]);

        camera.animations = [animAlpha, animBeta, animRad, animTgt];
        scene.beginAnimation(camera, 0, 30, false, 1.2);
    }

    // --- INITIALIZATION & EVENT LISTENERS ---
    createScene();
    setTimeOfDay('day');

    // Remove loading screen
    setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 800);
    }, 600);

    // Render & Animation Loop
    let totalTime = 0;
    engine.runRenderLoop(() => {
        const dt = engine.getDeltaTime() / 1000;
        totalTime += dt;

        // Auto rotation
        if (autoRotate && camera) {
            camera.alpha += dt * 0.12;
        }

        // Update animated objects (waterwheel, clouds, flags)
        for (let item of animatedMeshes) {
            item.update(totalTime, dt);
        }

        scene.render();
    });

    window.addEventListener('resize', () => engine.resize());

    // --- UI BUTTON INTERACTION ---
    document.getElementById('btn-day').addEventListener('click', () => setTimeOfDay('day'));
    document.getElementById('btn-sunset').addEventListener('click', () => setTimeOfDay('sunset'));
    document.getElementById('btn-night').addEventListener('click', () => setTimeOfDay('night'));

    function setActiveCamBtn(btnId) {
        ['cam-overview', 'cam-castle', 'cam-village', 'cam-mill', 'cam-tower'].forEach(id => {
            document.getElementById(id).classList.toggle('active', id === btnId);
        });
    }

    document.getElementById('cam-overview').addEventListener('click', () => {
        setActiveCamBtn('cam-overview');
        easeCameraTo(-Math.PI / 2.2, Math.PI / 3.2, 95, new BABYLON.Vector3(0, 4, 0));
    });

    document.getElementById('cam-castle').addEventListener('click', () => {
        setActiveCamBtn('cam-castle');
        easeCameraTo(-0.8, 1.15, 48, new BABYLON.Vector3(6, 12, -6));
    });

    document.getElementById('cam-village').addEventListener('click', () => {
        setActiveCamBtn('cam-village');
        easeCameraTo(-2.1, 1.2, 42, new BABYLON.Vector3(-10, 4, -3));
    });

    document.getElementById('cam-mill').addEventListener('click', () => {
        setActiveCamBtn('cam-mill');
        easeCameraTo(-1.35, 1.25, 34, new BABYLON.Vector3(0, 3, 3));
    });

    document.getElementById('cam-tower').addEventListener('click', () => {
        setActiveCamBtn('cam-tower');
        easeCameraTo(0.65, 1.2, 38, new BABYLON.Vector3(18, 7, 16));
    });

    const btnRotate = document.getElementById('btn-rotate');
    btnRotate.classList.add('active');
    btnRotate.addEventListener('click', () => {
        autoRotate = !autoRotate;
        btnRotate.classList.toggle('active', autoRotate);
    });

    // Pause auto-rotate when user drags
    scene.onPointerDown = () => { autoRotate = false; btnRotate.classList.remove('active'); };
});
</script>
</body>
</html>
