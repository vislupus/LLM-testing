<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Haven • Medieval Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Press+Start+2P&display=swap');
        body { margin:0; overflow:hidden; background:#0b0e1a; font-family:'Press Start 2P', sans-serif; }
        canvas { display:block; }
        #overlay {
            position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none;
            color:#ffdd88; text-align:center; text-shadow:0 2px 10px #000;
        }
        #title {
            font-family:'Creepster', cursive; font-size:42px; margin-top:30px; letter-spacing:4px;
        }
        #info {
            position:absolute; bottom:25px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.6); padding:10px 30px; border-radius:12px; font-size:13px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="overlay">
        <div id="title">FLOATING HAVEN</div>
        <div id="info">DRAG TO ORBIT • SCROLL TO ZOOM • A beautiful medieval floating island</div>
    </div>

    <script>
        // ================================================
        // FLOATING HAVEN - High-detail medieval island diorama
        // Single HTML file • Babylon.js from CDN
        // Stylized tabletop miniature aesthetic
        // ================================================

        const canvas = document.getElementById("canvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        function createScene() {
            const scene = new BABYLON.Scene(engine);
            
            // Camera - perfect orbiting view
            const camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/3.5, 240, new BABYLON.Vector3(0, 35, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 80;
            camera.upperRadiusLimit = 420;
            camera.lowerBetaLimit = 0.2;
            camera.upperBetaLimit = 1.45;
            
            // Soft fantasy lighting
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.6, 1, -0.4), scene);
            hemi.intensity = 0.75;
            hemi.groundColor = new BABYLON.Color3(0.3, 0.6, 0.9);
            
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.7, -0.9, -0.6), scene);
            sun.intensity = 1.4;
            sun.shadowEnabled = false;
            
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogColor = new BABYLON.Color3(0.75, 0.85, 1);
            scene.fogDensity = 0.0018;
            
            // Floating parent for the entire island
            const islandGroup = new BABYLON.TransformNode("islandGroup", scene);
            
            // === ISLAND BASE ===
            // Main rocky platform
            const base = BABYLON.MeshBuilder.CreateCylinder("base", {
                height: 18, diameterTop: 195, diameterBottom: 245, tessellation: 48
            }, scene);
            base.position.y = 4;
            base.parent = islandGroup;
            const baseMat = new BABYLON.StandardMaterial("baseMat", scene);
            baseMat.diffuseColor = new BABYLON.Color3(0.48, 0.38, 0.32);
            base.material = baseMat;
            
            // Grass top layer
            const grassTop = BABYLON.MeshBuilder.CreateCylinder("grass", {
                height: 4, diameterTop: 182, diameterBottom: 182, tessellation: 48
            }, scene);
            grassTop.position.y = 14;
            grassTop.parent = islandGroup;
            const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
            grassMat.diffuseColor = new BABYLON.Color3(0.18, 0.68, 0.22);
            grassMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            grassTop.material = grassMat;
            
            // Rocky cliffs around the edge
            function addCliff(x, z, rot, scale = 1) {
                const cliff = BABYLON.MeshBuilder.CreateBox("cliff", {
                    width: 38*scale, height: 32*scale, depth: 22*scale
                }, scene);
                cliff.position.set(x, 10, z);
                cliff.rotation.y = rot;
                cliff.parent = islandGroup;
                const mat = new BABYLON.StandardMaterial("", scene);
                mat.diffuseColor = new BABYLON.Color3(0.42, 0.36, 0.31);
                cliff.material = mat;
            }
            addCliff(92, 38, 0.8, 1.3);
            addCliff(-95, 45, -1.2, 1.1);
            addCliff(78, -72, 2.1, 1.4);
            addCliff(-85, -55, -0.6, 1.05);
            addCliff(45, 95, 1.6, 0.9);
            
            // === CASTLE ===
            const castleGroup = new BABYLON.TransformNode("castle", scene);
            castleGroup.parent = islandGroup;
            castleGroup.position.y = 18;
            
            // Main keep
            const keep = BABYLON.MeshBuilder.CreateBox("keep", {width:32, height:48, depth:32}, scene);
            keep.position.set(0, 24, 0);
            keep.parent = castleGroup;
            const stoneMat = new BABYLON.StandardMaterial("stone", scene);
            stoneMat.diffuseColor = new BABYLON.Color3(0.62, 0.62, 0.68);
            keep.material = stoneMat;
            
            // 4 towers
            function createTower(x, z) {
                const tower = BABYLON.MeshBuilder.CreateCylinder("tower", {height:52, diameter:18, tessellation:24}, scene);
                tower.position.set(x, 28, z);
                tower.parent = castleGroup;
                tower.material = stoneMat;
                
                // Conical roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {height:14, diameterTop:0, diameterBottom:21}, scene);
                roof.position.set(x, 58, z);
                roof.parent = castleGroup;
                const roofMat = new BABYLON.StandardMaterial("", scene);
                roofMat.diffuseColor = new BABYLON.Color3(0.65, 0.12, 0.12);
                roof.material = roofMat;
            }
            createTower(24, 24);
            createTower(24, -24);
            createTower(-24, 24);
            createTower(-24, -24);
            
            // Battlements on keep
            const battlement = BABYLON.MeshBuilder.CreateBox("battle", {width:36, height:8, depth:36}, scene);
            battlement.position.set(0, 48, 0);
            battlement.parent = castleGroup;
            battlement.material = stoneMat;
            
            // === VILLAGE ===
            function createHouse(x, z, rot, roofColor = new BABYLON.Color3(0.7,0.15,0.1)) {
                const group = new BABYLON.TransformNode("house", scene);
                group.position.set(x, 14, z);
                group.rotation.y = rot;
                group.parent = islandGroup;
                
                // Walls
                const walls = BABYLON.MeshBuilder.CreateBox("walls", {width:14, height:16, depth:18}, scene);
                walls.parent = group;
                const woodMat = new BABYLON.StandardMaterial("", scene);
                woodMat.diffuseColor = new BABYLON.Color3(0.55, 0.38, 0.22);
                walls.material = woodMat;
                
                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder("roof", {height:4, diameterTop:0, diameterBottom:22}, scene);
                roof.rotation.x = Math.PI/2;
                roof.position.set(0, 18, 0);
                roof.parent = group;
                const roofMat = new BABYLON.StandardMaterial("", scene);
                roofMat.diffuseColor = roofColor;
                roof.material = roofMat;
            }
            
            // Village houses
            createHouse(-48, 32, 0.6);
            createHouse(-62, 18, -1.1);
            createHouse(-38, -48, 2.3);
            createHouse(52, -35, -0.4);
            createHouse(38, 52, 1.8);
            
            // Tavern (larger)
            createHouse(-55, -22, 0.3, new BABYLON.Color3(0.55,0.08,0.08));
            
            // Market stalls (simple awnings)
            function createStall(x, z) {
                const stall = BABYLON.MeshBuilder.CreateBox("stall", {width:12, height:9, depth:12}, scene);
                stall.position.set(x, 13, z);
                stall.parent = islandGroup;
                stall.material = new BABYLON.StandardMaterial("", scene);
                stall.material.diffuseColor = new BABYLON.Color3(0.65, 0.45, 0.25);
                
                const awning = BABYLON.MeshBuilder.CreatePlane("awning", {width:16, height:8}, scene);
                awning.position.set(x, 19, z);
                awning.rotation.x = Math.PI/2;
                awning.parent = islandGroup;
                const aMat = new BABYLON.StandardMaterial("", scene);
                aMat.diffuseColor = new BABYLON.Color3(0.9, 0.2, 0.2);
                awning.material = aMat;
            }
            createStall(-18, 48);
            createStall(22, 58);
            
            // === RIVERSIDE MILL ===
            const millGroup = new BABYLON.TransformNode("mill", scene);
            millGroup.position.set(-72, 13, 8);
            millGroup.parent = islandGroup;
            
            // Mill building
            const millHouse = BABYLON.MeshBuilder.CreateBox("millhouse", {width:16, height:22, depth:14}, scene);
            millHouse.parent = millGroup;
            millHouse.material = woodMat;
            
            // Water wheel
            const wheel = BABYLON.MeshBuilder.CreateTorus("wheel", {diameter:26, thickness:5, tessellation:32}, scene);
            wheel.position.set(-8, 8, 0);
            wheel.rotation.z = Math.PI/2;
            wheel.parent = millGroup;
            const wheelMat = new BABYLON.StandardMaterial("", scene);
            wheelMat.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
            wheel.material = wheelMat;
            
            // === RIVER ===
            const river = BABYLON.MeshBuilder.CreateRibbon("river", {
                path: [
                    new BABYLON.Vector3(-95, 6.5, 35),
                    new BABYLON.Vector3(-65, 6.2, 55),
                    new BABYLON.Vector3(-35, 6.8, 42),
                    new BABYLON.Vector3(10, 7, 65),
                    new BABYLON.Vector3(45, 6.5, 35),
                    new BABYLON.Vector3(75, 7.2, -20)
                ],
                closePath: false,
                sideOrientation: BABYLON.Mesh.DOUBLESIDE
            }, scene);
            river.parent = islandGroup;
            const riverMat = new BABYLON.StandardMaterial("riverMat", scene);
            riverMat.diffuseColor = new BABYLON.Color3(0.1, 0.65, 0.85);
            riverMat.specularColor = new BABYLON.Color3(1,1,1);
            riverMat.specularPower = 64;
            river.material = riverMat;
            
            // Waterfalls (simple animated planes)
            function createWaterfall(x, z) {
                const fall = BABYLON.MeshBuilder.CreatePlane("fall", {width:8, height:28}, scene);
                fall.position.set(x, 18, z);
                fall.rotation.x = Math.PI/2;
                fall.parent = islandGroup;
                const fMat = new BABYLON.StandardMaterial("", scene);
                fMat.diffuseColor = new BABYLON.Color3(0.6, 0.85, 1);
                fMat.alpha = 0.65;
                fall.material = fMat;
            }
            createWaterfall(-78, 52);
            createWaterfall(82, -45);
            
            // === RUINED WATCHTOWER ===
            const towerBase = BABYLON.MeshBuilder.CreateCylinder("ruin", {height:26, diameter:11, tessellation:16}, scene);
            towerBase.position.set(95, 18, -38);
            towerBase.parent = islandGroup;
            towerBase.material = stoneMat;
            
            // Broken top
            const brokenTop = BABYLON.MeshBuilder.CreateCylinder("broken", {height:9, diameterTop:0, diameterBottom:13}, scene);
            brokenTop.position.set(95, 34, -38);
            brokenTop.parent = islandGroup;
            brokenTop.material = stoneMat;
            
            // === PINE TREES ===
            function createPine(x, z) {
                const group = new BABYLON.TransformNode("pine", scene);
                group.position.set(x, 14, z);
                group.parent = islandGroup;
                
                // Trunk
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height:14, diameter:2.8}, scene);
                trunk.parent = group;
                trunk.material = new BABYLON.StandardMaterial("", scene);
                trunk.material.diffuseColor = new BABYLON.Color3(0.45, 0.28, 0.15);
                
                // Foliage layers
                for (let i = 0; i < 4; i++) {
                    const foliage = BABYLON.MeshBuilder.CreateCylinder("foliage", {
                        height: 8, diameterTop: 0, diameterBottom: 18 - i*3
                    }, scene);
                    foliage.position.y = 12 + i*6;
                    foliage.parent = group;
                    foliage.material = new BABYLON.StandardMaterial("", scene);
                    foliage.material.diffuseColor = new BABYLON.Color3(0.08, 0.45, 0.15);
                }
            }
            
            // Place many pines
            createPine(65, 68);
            createPine(-68, 72);
            createPine(82, -65);
            createPine(-45, -78);
            createPine(25, -85);
            createPine(-85, 12);
            createPine(48, 85);
            
            // Gentle island floating animation
            let time = 0;
            scene.registerBeforeRender(() => {
                time += 0.008;
                islandGroup.position.y = Math.sin(time) * 1.8;
                
                // Slow water wheel rotation
                if (wheel) wheel.rotation.x = time * 1.6;
            });
            
            // Click to select a house (just for fun)
            scene.onPointerDown = (evt) => {
                if (evt.button === 0) {
                    const pick = scene.pick(scene.pointerX, scene.pointerY);
                    if (pick.hit) {
                        if (pick.pickedMesh.name.includes("house")) {
                            pick.pickedMesh.scaling.set(1.15, 1.15, 1.15);
                            setTimeout(() => pick.pickedMesh.scaling.set(1,1,1), 280);
                        }
                    }
                }
            };
            
            return scene;
        }
        
        window.onload = () => {
            const scene = createScene();
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            window.addEventListener("resize", () => engine.resize());
        };
    </script>
</body>
</html>
