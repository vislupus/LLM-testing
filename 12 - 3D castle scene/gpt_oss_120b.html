<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Island – Babylon.js Mini‑Diorama</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;}
  #renderCanvas{width:100%;height:100%;touch-action:none;}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<!-- Babylon.js from CDN (core only) -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>
/* --------------------------------------------------------------
   BASIC ENGINE / SCENE SETUP
   -------------------------------------------------------------- */
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true});
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.07, 0.13, 0.22, 1); // twilight‑blue sky

/* Camera – orbit, constrain zoom */
const camera = new BABYLON.ArcRotateCamera('Cam', Math.PI/2, Math.PI/2.7, 150,
                                          new BABYLON.Vector3(0,20,0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 50;
camera.upperRadiusLimit = 300;
camera.wheelDeltaPercentage = 0.02;

/* Lights – soft sun + ambient */
const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.5), scene);
sun.position = new BABYLON.Vector3(200,200,200);
sun.intensity = 1.2;
const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0,1,0), scene);
hemi.intensity = 0.4;

/* --------------------------------------------------------------
   MATERIAL LIBRARY
   -------------------------------------------------------------- */
const mat = {};
mat.grass = new BABYLON.StandardMaterial('grass', scene);
mat.grass.diffuseColor = new BABYLON.Color3(0.1,0.6,0.2);
mat.grass.specularColor = new BABYLON.Color3(0,0,0);

mat.stone = new BABYLON.StandardMaterial('stone', scene);
mat.stone.diffuseColor = new BABYLON.Color3(0.6,0.6,0.6);
mat.stone.specularColor = new BABYLON.Color3(0.2,0.2,0.2);

mat.wood = new BABYLON.StandardMaterial('wood', scene);
mat.wood.diffuseColor = new BABYLON.Color3(0.54,0.27,0.07);
mat.wood.specularColor = new BABYLON.Color3(0.2,0.2,0.2);

mat.turquoise = new BABYLON.StandardMaterial('turquoise', scene);
mat.turquoise.diffuseColor = new BABYLON.Color3(0.2,0.75,0.9);
mat.turquoise.specularColor = new BABYLON.Color3(0.2,0.6,0.8);
mat.turquoise.emissiveColor = new BABYLON.Color3(0,0.04,0.08);
mat.turquoise.backFaceCulling = false; //visible from below

mat.roof = new BABYLON.StandardMaterial('roof', scene);
mat.roof.diffuseColor = new BABYLON.Color3(0.55,0.15,0.15);
mat.roof.specularColor = new BABYLON.Color3(0.1,0.05,0.05);

/* --------------------------------------------------------------
   1️⃣ FLOATING ISLAND (base terrain)
   -------------------------------------------------------------- */
function makeIsland(){
  // simple disc with many subdivisions – then displace vertices with noise
  const island = BABYLON.MeshBuilder.CreateDisc('islandDisc',
        {radius:70, tessellation:120, sideOrientation:BABYLON.Mesh.DOUBLESIDE},
        scene);
  island.position.y = 30;          // floating height
  island.rotation.x = Math.PI/2;   // lay flat
  island.material = mat.grass;

  // cheap jitter (pseudo‑perlin) – just a random displacement
  const vertices = island.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for(let i=0;i<vertices.length;i+=3){
    const dx = (Math.random()-0.5)*0.8;
    const dz = (Math.random()-0.5)*0.8;
    const dy = Math.random()*0.4;    // tiny bumps
    vertices[i]   += dx;
    vertices[i+1] += dy;
    vertices[i+2] += dz;
  }
  island.updateVerticesData(BABYLON.VertexBuffer.PositionKind, vertices);
}
makeIsland();

/* --------------------------------------------------------------
   2️⃣ CENTRAL CASTLE (stone keep + towers + walls)
   -------------------------------------------------------------- */
function makeCastle(){
  // central keep
  const keep = BABYLON.MeshBuilder.CreateBox('keep',
        {width:20, depth:20, height:30}, scene);
  keep.position = new BABYLON.Vector3(0,45,0);
  keep.material = mat.stone;

  // four corner towers
  const towerRadius = 4;
  const towerHeight = 35;
  const towerPositions = [
    [ -12, -12 ],
    [  12, -12 ],
    [ -12,  12 ],
    [  12,  12 ]
  ];
  towerPositions.forEach(p=>{
    const tower = BABYLON.MeshBuilder.CreateCylinder('tower',
          {diameter:towerRadius*2, height:towerHeight, tessellation:12}, scene);
    tower.position = new BABYLON.Vector3(p[0],45+towerHeight/2-5,p[1]);
    tower.material = mat.stone;
    // battlements (simple boxes)
    const batt = BABYLON.MeshBuilder.CreateBox('batt','',scene);
    batt.scaling = new BABYLON.Vector3(1,0.5,1);
    batt.position.y = towerHeight/2+0.25;
    batt.parent = tower;
  });

  // surrounding wall (continuous box ring)
  const wallThickness = 2;
  const wallHeight = 12;
  const wallLengths = [
    {width:40, depth:wallThickness},
    {width:wallThickness, depth:40}
  ];
  // north wall
  const north = BABYLON.MeshBuilder.CreateBox('wallN',
        {width:wallLengths[0].width, depth:wallLengths[0].depth, height:wallHeight},
        scene);
  north.position = new BABYLON.Vector3(0,45+wallHeight/2, -20);
  north.material = mat.stone;
  // south wall
  const south = north.clone('wallS');
  south.position.z = 20;
  // west wall
  const west = BABYLON.MeshBuilder.CreateBox('wallW',
        {width:wallLengths[1].width, depth:wallLengths[1].depth, height:wallHeight},
        scene);
  west.position = new BABYLON.Vector3(-20,45+wallHeight/2,0);
  west.material = mat.stone;
  // east wall
  const east = west.clone('wallE');
  east.position.x = 20;

  // main entrance gate (just a gap)
  const gateWidth = 8;
  const gateDepth = wallThickness+0.1;
  const gate = BABYLON.MeshBuilder.CreateBox('gate',
        {width:gateWidth, depth:gateDepth, height:wallHeight}, scene);
  gate.position = new BABYLON.Vector3(0,45+wallHeight/2, -20);
  gate.material = mat.wood;
}
makeCastle();

/* --------------------------------------------------------------
   3️⃣ VILLAGE – wooden houses, tavern, market stalls
   -------------------------------------------------------------- */
function makeVillage(){
  const houses = 12;
  for(let i=0;i<houses;i++){
    const angle = Math.random()*Math.PI*2;
    const radius = 38 + Math.random()*5;
    const x = Math.cos(angle)*radius;
    const z = Math.sin(angle)*radius;

    const house = BABYLON.MeshBuilder.CreateBox('house',
          {width:6, depth:6, height:5}, scene);
    house.position = new BABYLON.Vector3(x,30,z);
    house.material = mat.wood;

    // roof – simple tilted prism (two boxes rotated)
    const roof = BABYLON.MeshBuilder.CreateBox('roof',
          {width:6.5, depth:6.5, height:2}, scene);
    roof.position.y = 6.5;
    roof.rotation.x = Math.PI/4;
    roof.material = mat.roof;
    roof.parent = house;
  }

  // tavern (a larger building)
  const tavern = BABYLON.MeshBuilder.CreateBox('tavern',
        {width:12, depth:8, height:7}, scene);
  tavern.position = new BABYLON.Vector3(-30,30,-20);
  tavern.material = mat.wood;
  const tavernRoof = BABYLON.MeshBuilder.CreateCylinder('tavernRoof',
        {diameter:12.5, height:3, tessellation:4}, scene);
  tavernRoof.rotation.x = Math.PI/2;
  tavernRoof.position = new BABYLON.Vector3(-30,34, -20);
  tavernRoof.material = mat.roof;
  tavernRoof.parent = tavern;

  // market stalls – a row of small awnings
  for(let i=0;i<4;i++){
    const stall = BABYLON.MeshBuilder.CreateBox('stall',
          {width:3, depth:3, height:2.5}, scene);
    stall.position = new BABYLON.Vector3(-20 + i*5,30, -30);
    stall.material = mat.wood;
    const awning = BABYLON.MeshBuilder.CreatePlane('awning',
          {size:3.5}, scene);
    awning.position.y = 4;
    awning.rotation.x = Math.PI/2;
    awning.material = new BABYLON.StandardMaterial('awn',scene);
    awning.material.diffuseColor = new BABYLON.Color3(0.9,0.6,0.2);
    awning.parent = stall;
  }
}
makeVillage();

/* --------------------------------------------------------------
   4️⃣ RIVER + WATERFALLS
   -------------------------------------------------------------- */
function makeRiver(){
  // river as a thin ribbon following a set of points
  const riverPath = [
    new BABYLON.Vector3(70,30,0),
    new BABYLON.Vector3(55,29,-5),
    new BABYLON.Vector3(40,28,-10),
    new BABYLON.Vector3(20,27,-12),
    new BABYLON.Vector3(0,26,-15),
    new BABYLON.Vector3(-20,25,-15),
    new BABYLON.Vector3(-40,24,-12),
    new BABYLON.Vector3(-55,23,-5),
    new BABYLON.Vector3(-70,22,0)
  ];
  const width = 4;
  const river = BABYLON.MeshBuilder.CreateRibbon('river',
        {pathArray:riverPath.map(p=>[p.add(new BABYLON.Vector3(-width,0,0)),
                                    p.add(new BABYLON.Vector3(width,0,0))],
         sideOrientation:BABYLON.Mesh.DOUBLESIDE},
        scene);
  river.position.y = 31; // just above ground
  river.material = mat.turquoise;

  // Simple waterfall at the southern tip (two particle systems)
  const waterfall = new BABYLON.ParticleSystem('waterfall',2000,scene);
  waterfall.particleTexture = new BABYLON.Texture('https://playground.babylonjs.com/textures/flare.png',scene);
  waterfall.emitter = new BABYLON.Vector3(-70,31,0);
  waterfall.minEmitBox = new BABYLON.Vector3(-1,0,-1);
  waterfall.maxEmitBox = new BABYLON.Vector3(1,0,1);
  waterfall.direction1 = new BABYLON.Vector3(0,-1,0);
  waterfall.direction2 = new BABYLON.Vector3(0,-1,0);
  waterfall.minSize = 0.1; waterfall.maxSize = 0.3;
  waterfall.minLifeTime = 0.6; waterfall.maxLifeTime = 1.2;
  waterfall.emitRate = 1500;
  waterfall.gravity = new BABYLON.Vector3(0,-9.81,0);
  waterfall.color1 = new BABYLON.Color4(0.4,0.7,0.95,0.8);
  waterfall.color2 = new BABYLON.Color4(0.2,0.4,0.9,0.6);
  waterfall.start();
}
makeRiver();

/* --------------------------------------------------------------
   5️⃣ ROCKY CLIFFS (steep stone walls around the island edge)
   -------------------------------------------------------------- */
function makeCliffs(){
  const cliffMat = new BABYLON.StandardMaterial('cliff',scene);
  cliffMat.diffuseColor = new BABYLON.Color3(0.5,0.5,0.55);
  const positions = [
    // North‑west edge
    {center:new BABYLON.Vector3(-60,30, -60), width:30, depth:10, height:25, rotY:Math.PI/4},
    // North‑east edge
    {center:new BABYLON.Vector3( 60,30, -60), width:30, depth:10, height:25, rotY:-Math.PI/4},
    // South‑west edge
    {center:new BABYLON.Vector3(-60,30, 60), width:30, depth:10, height:25, rotY:-Math.PI/4},
    // South‑east edge
    {center:new BABYLON.Vector3( 60,30, 60), width:30, depth:10, height:25, rotY:Math.PI/4}
  ];
  positions.forEach(p=>{
    const cliff = BABYLON.MeshBuilder.CreateBox('cliff',
          {width:p.width, depth:p.depth, height:p.height}, scene);
    cliff.position = p.center;
    cliff.rotation.y = p.rotY;
    cliff.material = cliffMat;
  });
}
makeCliffs();

/* --------------------------------------------------------------
   6️⃣ TREES (pine cones)
   -------------------------------------------------------------- */
function makeTrees(){
  const pineMat = new BABYLON.StandardMaterial('pine',scene);
  pineMat.diffuseColor = new BABYLON.Color3(0.1,0.3,0.1);

  for(let i=0;i<30;i++){
    const angle = Math.random()*Math.PI*2;
    const radius = 30 + Math.random()*25;
    const x = Math.cos(angle)*radius;
    const z = Math.sin(angle)*radius;
    const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk',
          {diameter:0.8, height:6, tessellation:6}, scene);
    trunk.position = new BABYLON.Vector3(x,33,z);
    trunk.material = mat.wood;
    const foliage = BABYLON.MeshBuilder.CreateCone('foliage',
          {diameterTop:0, diameterBottom:5, height:12, tessellation:8}, scene);
    foliage.position = new BABYLON.Vector3(x,38,z);
    foliage.material = pineMat;
  }
}
makeTrees();

/* --------------------------------------------------------------
   7️⃣ BRIDGES (simple wooden planks)
   -------------------------------------------------------------- */
function makeBridges(){
  const bridgeMat = mat.wood.clone('bridgeMat');
  bridgeMat.diffuseColor = new BABYLON.Color3(0.55,0.35,0.2);

  // a bridge crossing the river
  const bridge = BABYLON.MeshBuilder.CreateBox('bridge',
        {width:40, depth:2, height:0.5}, scene);
  bridge.position = new BABYLON.Vector3(0,31.5, -5);
  bridge.material = bridgeMat;
}
makeBridges();

/* --------------------------------------------------------------
   8️⃣ RUINED WATCH‑TOWER (at far west cliff)
   -------------------------------------------------------------- */
function makeWatchtower(){
  const base = BABYLON.MeshBuilder.CreateCylinder('watchBase',
        {diameter:6, height:12, tessellation:12}, scene);
  base.position = new BABYLON.Vector3(-65,38,0);
  base.material = mat.stone;

  const top = BABYLON.MeshBuilder.CreateCylinder('watchTop',
        {diameter:4, height:8, tessellation:12}, scene);
  top.position.y = 22;
  top.position.x = -65;
  top.position.z = 0;
  top.material = mat.stone;
}
makeWatchtower();

/* --------------------------------------------------------------
   9️⃣ SKY + SIMPLE CLOUDS (plane with translucent texture)
   -------------------------------------------------------------- */
function makeSky(){
  const sky = BABYLON.MeshBuilder.CreateGround('sky',
        {width:600, height:600, subdivisions:2}, scene);
  sky.position.y = 250;
  const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
  skyMat.diffuseColor = new BABYLON.Color3(0.7,0.85,1);
  skyMat.backFaceCulling = false;
  skyMat.disableLighting = true;
  sky.material = skyMat;
}
makeSky();

/* --------------------------------------------------------------
   RENDER LOOP
   -------------------------------------------------------------- */
engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
</script>
</body>
</html>
