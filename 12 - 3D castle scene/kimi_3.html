<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Floating Castle Isle — Babylon.js Diorama</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#cfe8f2;
    font-family: Georgia, 'Times New Roman', serif; }
  #renderCanvas { width:100%; height:100%; display:block; touch-action:none; outline:none; }
  #vignette { position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(30,40,60,0.28) 100%); }
  #title { position:fixed; top:22px; left:26px; pointer-events:none; color:#2c3a2e;
    text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  #title h1 { margin:0; font-size:26px; letter-spacing:1px; font-weight:600; }
  #title p { margin:4px 0 0 2px; font-size:13px; opacity:.75; font-style:italic; }
  #hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); pointer-events:none;
    color:#33424f; font-size:12.5px; letter-spacing:.4px; background:rgba(255,255,255,.45);
    padding:6px 14px; border-radius:20px; backdrop-filter: blur(4px); }
  #loader { position:fixed; inset:0; background:#cfe8f2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; transition:opacity .8s ease; }
  #loader.done { opacity:0; pointer-events:none; }
  .spinner { width:44px; height:44px; border-radius:50%; border:4px solid rgba(60,90,120,.25);
    border-top-color:#3c6e9e; animation: spin 1s linear infinite; }
  #loader p { color:#3c5a74; font-style:italic; margin-top:14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="vignette"></div>
<div id="title"><h1>⚑ Floating Castle Isle</h1><p>a handcrafted tabletop diorama</p></div>
<div id="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-drag to pan</div>
<div id="loader"><div class="spinner"></div><p>Raising the island…</p></div>

<script>
"use strict";
/* ============================================================
   Floating Castle Isle — high-poly stylized diorama
   Babylon.js, single file. Everything is procedural.
   ============================================================ */
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { antialias:true, stencil:true, preserveDrawingBuffer:true });
const scene  = new BABYLON.Scene(engine);

const R       = 26;      // island radius
const WATER_Y = 1.15;    // river water level

/* ---------- sky, fog, camera, lights ---------- */
const SKY = new BABYLON.Color4(0.812, 0.910, 0.949, 1.0);
scene.clearColor = SKY;
scene.fogMode    = BABYLON.Scene.FOGMODE_LINEAR;
scene.fogColor   = new BABYLON.Color3(SKY.r, SKY.g, SKY.b);
scene.fogStart   = 95;
scene.fogEnd     = 230;

const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2.6, 1.08, 62, new BABYLON.Vector3(0, 2.0, 0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 18;
camera.upperRadiusLimit = 130;
camera.lowerBetaLimit   = 0.18;
camera.upperBetaLimit   = 1.52;
camera.wheelDeltaPercentage = 0.012;
camera.pinchDeltaPercentage = 0.012;
camera.minZ = 0.5;
camera.useAutoRotationBehavior = true;
camera.autoRotationBehavior.idleRotationSpeed = 0.10;
camera.autoRotationBehavior.idleRotationWaitTime = 4000;
camera.autoRotationBehavior.idleRotationSpinupTime = 2500;
// debug/view params: ?alpha=-1.2&beta=1.3&radius=70&norot=1
(function(){ const q = new URLSearchParams(location.search);
  if (q.has("alpha")) camera.alpha = parseFloat(q.get("alpha"));
  if (q.has("beta"))  camera.beta  = parseFloat(q.get("beta"));
  if (q.has("radius"))camera.radius= parseFloat(q.get("radius"));
  if (q.has("norot")) camera.useAutoRotationBehavior = false; })();

const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.25, 1, 0.35), scene);
hemi.intensity = 0.85;
hemi.groundColor = new BABYLON.Color3(0.55, 0.50, 0.42);

const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.55, -1.0, 0.42), scene);
sun.position = new BABYLON.Vector3(60, 80, -45);
sun.intensity = 1.15;
sun.diffuse = new BABYLON.Color3(1.0, 0.96, 0.88);
sun.autoCalcShadowZBounds = true;

const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
shadowGen.useBlurExponentialShadowMap = true;
shadowGen.blurKernel = 24;
shadowGen.darkness = 0.35;

scene.imageProcessingConfiguration.toneMappingEnabled = true;
scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
scene.imageProcessingConfiguration.exposure = 1.28;
scene.imageProcessingConfiguration.contrast = 1.12;

/* sky dome with painted gradient */
(function buildSky(){
  const dt = new BABYLON.DynamicTexture("skyTex", { width:16, height:512 }, scene, true);
  const ctx = dt.getContext();
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, "#3f7ec2");
  g.addColorStop(0.45, "#7fb6dd");
  g.addColorStop(0.72, "#cfe8f2");
  g.addColorStop(1.00, "#cfe8f2");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 512);
  dt.update();
  const mat = new BABYLON.StandardMaterial("skyMat", scene);
  mat.emissiveTexture = dt; mat.disableLighting = true;
  mat.backFaceCulling = false; mat.diffuseColor = BABYLON.Color3.Black();
  const dome = BABYLON.MeshBuilder.CreateSphere("sky", { diameter: 420, segments: 24, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
  dome.material = mat; dome.infiniteDistance = true; dome.applyFog = false; dome.isPickable = false;
})();

/* ---------- small math helpers ---------- */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const sstep = (e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){ return vnoise(x,y)*0.60 + vnoise(x*2.13+5.2, y*2.13+1.3)*0.28 + vnoise(x*4.71+9.1, y*4.71+3.7)*0.12; }
const rnd = (a,b)=>a+Math.random()*(b-a);

/* ---------- terrain shaping ---------- */
function riverX(z){ return 3.5*Math.sin(z*0.18) + 2.0*Math.sin(z*0.07 + 1.0) - 10.0*Math.exp(-(z*z)/64); }
function riverDepth(x,z){ return sstep(4.4, 1.1, Math.abs(x - riverX(z))); }   // 1 mid-channel → 0 on banks
function terrainHeight(x,z){
  const r  = Math.hypot(x, z);
  let h = 2.7 + (fbm(x*0.055, z*0.055)*2 - 1) * 1.05;
  h -= riverDepth(x, z) * 3.1;                                         // river channel
  h = lerp(h, 3.15, sstep(10.5, 7.0, r));                              // castle plateau (overrides carve)
  h = lerp(h, 2.90, 0.85 * sstep(9.0, 5.0, Math.hypot(x-12.5, z-9.5)));// village terrace
  h = lerp(1.75, h, sstep(R-1.2, R-4.5, r));                           // cliff lip
  return h;
}

/* ---------- root node (whole island gently floats) ---------- */
const ISLAND = new BABYLON.TransformNode("island", scene);
function P(m){ m.parent = ISLAND; return m; }
function addShadow(m){ if (m){ shadowGen.addShadowCaster(m); m.receiveShadows = true; } return m; }

/* ---------- materials ---------- */
function mat(name, r,g,b, opts={}){
  const m = new BABYLON.StandardMaterial(name, scene);
  m.diffuseColor  = new BABYLON.Color3(r,g,b);
  m.specularColor = new BABYLON.Color3(0.04,0.04,0.04);
  if (opts.emissive){ m.emissiveColor = new BABYLON.Color3(...opts.emissive); }
  if (opts.alpha !== undefined){ m.alpha = opts.alpha; }
  if (opts.noCull){ m.backFaceCulling = false; }
  if (opts.unlit){ m.disableLighting = true; }
  return m;
}
const M = {
  stone:     mat("stone",     0.66, 0.63, 0.60),
  stoneDark: mat("stoneDark", 0.46, 0.44, 0.43),
  rock:      mat("rock",      0.50, 0.46, 0.42),
  rockVert:  mat("rockVert",  1,1,1),                 // vertex-colored
  grassVert: mat("grassVert", 1,1,1),                 // vertex-colored
  wood:      mat("wood",      0.55, 0.38, 0.22),
  woodDark:  mat("woodDark",  0.36, 0.24, 0.14),
  plank:     mat("plank",     0.62, 0.45, 0.28),
  plaster:   mat("plaster",   0.92, 0.85, 0.70),
  roofRed:   mat("roofRed",   0.70, 0.28, 0.20, { noCull:true }),
  roofSlate: mat("roofSlate", 0.38, 0.47, 0.60, { noCull:true }),
  roofMoss:  mat("roofMoss",  0.38, 0.48, 0.28, { noCull:true }),
  leafA:     mat("leafA",     0.16, 0.42, 0.20),
  leafB:     mat("leafB",     0.25, 0.55, 0.26),
  sand:      mat("sand",      0.84, 0.74, 0.52, { noCull:true }),
  water:     mat("water",     0.16, 0.72, 0.78),
  gold:      mat("gold",      0.90, 0.68, 0.22, { emissive:[0.35,0.24,0.06] }),
  banner:    mat("banner",    0.72, 0.16, 0.16, { noCull:true }),
  window:    mat("window",    0.45, 0.30, 0.10, { emissive:[1.0, 0.72, 0.30] }),
  foam:      mat("foam",      0.95, 0.99, 1.00, { emissive:[0.55,0.62,0.65], alpha:0.92 }),
  cloud:     mat("cloud",     1,1,1, { unlit:true, alpha:0.96, emissive:[1,1,1] }),
  door:      mat("door",      0.30, 0.20, 0.11),
};
M.water.alpha = 0.88;
M.water.specularColor = new BABYLON.Color3(0.55, 0.65, 0.65);
M.water.specularPower = 64;

/* animated streak texture (river flow + waterfalls) */
function makeStreakTex(w,h,count,baseGray){
  // luminance = alpha (getAlphaFromRGB): dark bg = transparent, white streaks = opaque
  const dt = new BABYLON.DynamicTexture("streaks", { width:w, height:h }, scene, true);
  const ctx = dt.getContext();
  ctx.fillStyle = "rgb(" + baseGray + "," + baseGray + "," + baseGray + ")";
  ctx.fillRect(0,0,w,h);
  for (let i=0;i<count;i++){
    const sw = rnd(1.5,4), sh = rnd(h*0.05, h*0.22);
    const v = Math.floor(rnd(200,255));
    ctx.fillStyle = "rgb(" + v + "," + v + "," + v + ")";
    ctx.globalAlpha = rnd(0.5, 1.0);
    ctx.beginPath();
    ctx.ellipse(rnd(0,w), rnd(0,h), sw, sh, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  dt.update();
  dt.getAlphaFromRGB = true;
  dt.wrapU = dt.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
  return dt;
}
const riverStreaks = makeStreakTex(128, 512, 60, 0);
const fallStreaks  = makeStreakTex(128, 256, 45, 120);
/* ============================================================
   ISLAND TOP — polar grid with vertex-coloured grass
   ============================================================ */
(function buildIslandTop(){
  const SEG = 128, RINGS = 48;
  const positions = [], indices = [], colors = [], normals = [];
  const gA = [0.30, 0.58, 0.25], gB = [0.42, 0.68, 0.30], gDry = [0.58, 0.66, 0.32];
  for (let i=0; i<=RINGS; i++){
    const t = i/RINGS * R;
    for (let j=0; j<=SEG; j++){
      const th = j/SEG * Math.PI*2;
      const x = t*Math.cos(th), z = t*Math.sin(th);
      const y = terrainHeight(x, z);
      positions.push(x, y, z);
      normals.push(0,1,0);
      const n = fbm(x*0.14+9.7, z*0.14+3.1);
      let c = [ lerp(gA[0],gB[0],n), lerp(gA[1],gB[1],n), lerp(gA[2],gB[2],n) ];
      c = [ lerp(c[0],gDry[0], sstep(0.72,0.95,fbm(x*0.09+4,z*0.09+7))*0.6),
            lerp(c[1],gDry[1], sstep(0.72,0.95,fbm(x*0.09+4,z*0.09+7))*0.6),
            lerp(c[2],gDry[2], sstep(0.72,0.95,fbm(x*0.09+4,z*0.09+7))*0.6) ];
      const bank = riverDepth(x, z);                                  // sandy banks
      c = [ lerp(c[0],0.84,bank*0.9), lerp(c[1],0.74,bank*0.9), lerp(c[2],0.52,bank*0.9) ];
      const lip = sstep(R-5.5, R-1.0, t);                             // dry rim near cliff
      c = [ lerp(c[0],0.62,lip*0.35), lerp(c[1],0.60,lip*0.35), lerp(c[2],0.34,lip*0.35) ];
      colors.push(c[0], c[1], c[2], 1);
    }
  }
  for (let i=0; i<RINGS; i++) for (let j=0; j<SEG; j++){
    const a=i*(SEG+1)+j, b=a+SEG+1;
    indices.push(a, b, a+1, a+1, b, b+1);
  }
  const vd = new BABYLON.VertexData();
  BABYLON.VertexData.ComputeNormals(positions, indices, normals);
  vd.positions = positions; vd.indices = indices; vd.normals = normals; vd.colors = colors;
  const ground = new BABYLON.Mesh("ground", scene);
  vd.applyToMesh(ground, true);
  ground.material = M.grassVert;
  ground.receiveShadows = true;
  P(ground);
})();

/* ============================================================
   CLIFF RING + ROCKY UNDERSIDE
   ============================================================ */
function rockColor(y, seed){
  const band = 0.5 + 0.5*Math.sin(y*0.9 + seed);
  const n = 0.92 + 0.22*fbm(seed*3.1, y*0.35);
  return [ (0.56+0.13*band)*n, (0.50+0.11*band)*n, (0.44+0.10*band)*n ];
}
(function buildCliff(){
  const SEG = 128;
  const rows = [
    { r:R+0.25,  y: 1.72 },   // grass lip
    { r:R-0.10,  y: 0.20 },
    { r:R-1.60,  y:-2.40 },
    { r:R-2.90,  y:-5.60 },
  ];
  const positions=[], normals=[], colors=[], indices=[];
  for (let i=0;i<rows.length;i++){
    for (let j=0;j<=SEG;j++){
      const th = j/SEG*Math.PI*2;
      const jit = (fbm(Math.cos(th)*3+10, Math.sin(th)*3 + i*7.3)-0.5)*1.6;
      const rr = rows[i].r + jit;
      const x=rr*Math.cos(th), z=rr*Math.sin(th);
      const y=rows[i].y + (fbm(th*4.1, i*3.3)-0.5)*0.8;
      positions.push(x,y,z);
      const nl = Math.hypot(x, 0.35*8, z);
      normals.push(x/nl, 0.35, z/nl);
      colors.push(...rockColor(y, th*2.0), 1);
    }
  }
  for (let i=0;i<rows.length-1;i++) for (let j=0;j<SEG;j++){
    const a=i*(SEG+1)+j, b=a+SEG+1;
    indices.push(a, a+1, b, a+1, b+1, b);
  }
  const vd=new BABYLON.VertexData();
  vd.positions=positions; vd.indices=indices; vd.normals=normals; vd.colors=colors;
  const cliff=new BABYLON.Mesh("cliff", scene);
  vd.applyToMesh(cliff, true);
  cliff.material = M.rockVert;
  cliff.receiveShadows = true;
  P(cliff);
})();
(function buildUnderside(){
  // hand-built ring mesh (same grid pattern as the cliff) tapering to a rocky root
  const SEG = 96;
  const rows = [
    { r:R-2.9,  y:-5.6 },
    { r:R-6.5,  y:-8.6 },
    { r:R-11.0, y:-11.8 },
    { r:R-15.5, y:-15.2 },
    { r:R-20.0, y:-18.4 },
    { r:2.2,    y:-21.0 },
    { r:0.15,   y:-24.5 },
  ];
  const positions=[], normals=[], colors=[], indices=[];
  for (let i=0;i<rows.length;i++){
    for (let j=0;j<=SEG;j++){
      const th = j/SEG*Math.PI*2;
      const jit = 1 + (fbm(Math.cos(th)*2.4+i*13.7, Math.sin(th)*2.4+i*5.1)-0.5)*0.35;
      const rr = Math.max(rows[i].r*jit, 0.1);
      const x=rr*Math.cos(th), z=rr*Math.sin(th);
      const y=rows[i].y + (fbm(th*3.7, i*4.3+2)-0.5)*1.6*(i?1:0.3);
      positions.push(x,y,z);
      normals.push(0,0,0);
      colors.push(...rockColor(y*0.8, th*1.7), 1);
    }
  }
  for (let i=0;i<rows.length-1;i++) for (let j=0;j<SEG;j++){
    const a=i*(SEG+1)+j, b=a+SEG+1;
    indices.push(a, a+1, b, a+1, b+1, b);
  }
  const vd=new BABYLON.VertexData();
  vd.positions=positions; vd.indices=indices; vd.colors=colors;
  BABYLON.VertexData.ComputeNormals(positions, indices, normals);
  vd.normals=normals;
  const under=new BABYLON.Mesh("under", scene);
  vd.applyToMesh(under, true);
  under.material = M.rockVert;
  P(under);
})();

/* ============================================================
   RIVER, WATERFALLS, BRIDGES, PATHS
   ============================================================ */
const animated = [];   // {update(dt,t)}
(function buildRiver(){
  const left=[], right=[];
  for (let z=-24.2; z<=24.2; z+=0.8){
    const cx = riverX(z);
    const dx = (riverX(z+0.4)-riverX(z-0.4))/0.8;
    const nx = 1/Math.hypot(1,dx), nz = -dx/Math.hypot(1,dx);
    const w = 3.4;
    left.push (new BABYLON.Vector3(cx-nx*w, WATER_Y, z-nz*w));
    right.push(new BABYLON.Vector3(cx+nx*w, WATER_Y, z+nz*w));
  }
  const river = BABYLON.MeshBuilder.CreateRibbon("river", { pathArray:[left,right] }, scene);
  river.material = M.water; P(river);
  // sparkling flow layer
  const sMat = mat("flow", 1,1,1, { unlit:true, noCull:true });
  sMat.opacityTexture = riverStreaks; sMat.alpha = 0.85; sMat.emissiveColor = new BABYLON.Color3(0.9,1,1);
  const flow = BABYLON.MeshBuilder.CreateRibbon("flow", { pathArray:[
    left.map(v=>new BABYLON.Vector3(v.x, WATER_Y+0.05, v.z)),
    right.map(v=>new BABYLON.Vector3(v.x, WATER_Y+0.05, v.z)) ] }, scene);
  flow.material = sMat; P(flow);
  animated.push({ update:(dt)=>{ riverStreaks.vOffset -= dt*0.45; } });
})();

function buildWaterfall(zEnd, flip){
  const cx = riverX(zEnd);
  const w = 6.2, h = 11.5;
  const fMat = mat("fall", 0.75, 0.93, 0.97, { unlit:true, noCull:true, alpha:0.9 });
  fMat.emissiveColor = new BABYLON.Color3(0.82, 0.94, 1.0);
  fMat.opacityTexture = fallStreaks;
  const fall = BABYLON.MeshBuilder.CreatePlane("fall", { width:w, height:h, sideOrientation:BABYLON.Mesh.DOUBLESIDE }, scene);
  fall.position.set(cx, WATER_Y - h/2 + 0.9, zEnd + (flip? -0.6 : 0.6));
  if (flip) fall.rotation.y = Math.PI;
  fall.material = fMat; P(fall);
  // lip foam
  const lip = BABYLON.MeshBuilder.CreateDisc("lip", { radius:w*0.42, tessellation:24 }, scene);
  lip.rotation.x = Math.PI/2;
  lip.position.set(cx, WATER_Y+0.06, zEnd); lip.scaling.z = 0.55;
  lip.material = M.foam; P(lip);
  // misty base blobs
  for (let i=0;i<4;i++){
    const puff = BABYLON.MeshBuilder.CreateSphere("puff", { diameter:rnd(2.2,3.8), segments:10 }, scene);
    puff.scaling.y = 0.55;
    puff.position.set(cx+rnd(-2.2,2.2), WATER_Y-h+rnd(0.4,1.6), zEnd+(flip?-1:1)*rnd(0.5,1.8));
    puff.material = M.foam; P(puff);
    const ph = rnd(0,6), sp = rnd(0.8,1.4), base = puff.position.y;
    animated.push({ update:(dt,t)=>{ puff.position.y = base + Math.sin(t*sp+ph)*0.25; } });
  }
  animated.push({ update:(dt)=>{ fallStreaks.vOffset -= dt*2.2; } });
}
buildWaterfall( 24.2, false);
buildWaterfall(-24.2, true);

function buildBridge(cx, cz){
  const g = [];
  const shape = [ new BABYLON.Vector3(-1.3,0,0), new BABYLON.Vector3(1.3,0,0),
                  new BABYLON.Vector3(1.3,-0.3,0), new BABYLON.Vector3(-1.3,-0.3,0) ];
  const path=[], railL=[], railR=[];
  for (let i=0;i<=12;i++){
    const t=i/12*2-1, y=2.05+0.95*(1-t*t);
    path.push (new BABYLON.Vector3(cx+t*4.6, y, cz));
    railL.push(new BABYLON.Vector3(cx+t*4.6, y+0.85, cz-1.18));
    railR.push(new BABYLON.Vector3(cx+t*4.6, y+0.85, cz+1.18));
  }
  const deck = BABYLON.MeshBuilder.ExtrudeShape("deck", { shape, path, cap:BABYLON.Mesh.CAP_ALL, sideOrientation:BABYLON.Mesh.DOUBLESIDE }, scene);
  deck.material = M.plank; P(addShadow(deck)); g.push(deck);
  const railShape = [ new BABYLON.Vector3(-0.09,0,0), new BABYLON.Vector3(0.09,0,0),
                      new BABYLON.Vector3(0.09,-0.14,0), new BABYLON.Vector3(-0.09,-0.14,0) ];
  [railL, railR].forEach(rp=>{

function buildPath(pts, width){
  const left=[], right=[];
  for (let i=0;i<pts.length;i++){
    const p=pts[i];
    const q=pts[Math.min(i+1,pts.length-1)], q0=pts[Math.max(i-1,0)];
    let dx=q[0]-q0[0], dz=q[1]-q0[1];
    const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    const y=terrainHeight(p[0],p[1])+0.07;
    left.push (new BABYLON.Vector3(p[0]-dz*width, y, p[1]+dx*width));
    right.push(new BABYLON.Vector3(p[0]+dz*width, y, p[1]-dx*width));
  }
  const path = BABYLON.MeshBuilder.CreateRibbon("path", { pathArray:[left,right] }, scene);
  path.material = M.sand; path.receiveShadows = true; P(path);
}

function battlementsRect(cx, cz, w, d, y, boxes){
  const step=1.15, s=0.62;
  for (let x=-w/2+s/2; x<=w/2-s/2+0.001; x+=step){
    boxes.push([cx+x, y, cz-d/2, s,0.65,s], [cx+x, y, cz+d/2, s,0.65,s]);
  }
  for (let z=-d/2+step; z<=d/2-step+0.001; z+=step){
    boxes.push([cx-w/2, y, cx? cz+z : z, s,0.65,s], [cx+w/2, y, cz+z, s,0.65,s]);
  }
}

function gableRoof(w, d, h, matl){
  const shape = [ new BABYLON.Vector3(-w/2,0,0), new BABYLON.Vector3(w/2,0,0), new BABYLON.Vector3(0,h,0) ];
  const path  = [ new BABYLON.Vector3(0,0,-d/2), new BABYLON.Vector3(0,0,d/2) ];

  roof.material = matl;
  return roof;
}

const keepOut = [
  { x:0,    z:0,    r:9.8 },   // castle
  { x:12.5, z:9.5,  r:9.0 },   // village
  { x:-18.5,z:-12.5,r:4.5 },   // watchtower
];
const bridgesAt = [ [riverX(-8),-8], [riverX(13),13] ];
function spotFree(x,z){
  const r = Math.hypot(x,z);
  if (r > R-2.6) return false;
  if (Math.abs(x - riverX(z)) < 4.6) return false;
  for (const k of keepOut) if (Math.hypot(x-k.x, z-k.z) < k.r) return false;
  for (const b of bridgesAt) if (Math.hypot(x-b[0], z-b[1]) < 5.0) return false;
  return true;
}
(function buildTrees(){
  const trunks=[], conesA=[], conesB=[];
  const pine = (x,z,s)=>{
    const y = terrainHeight(x,z)-0.1;
    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { height:1.3*s, diameter:0.34*s, tessellation:7 }, scene);
    trunk.position.set(x, y+0.65*s, z); trunk.material = M.woodDark;
    trunk.bakeCurrentTransformIntoVertices(); trunks.push(trunk);
    const tiers = [ [2.3,1.5,1.15], [1.75,1.35,1.95], [1.2,1.25,2.75] ];
    tiers.forEach(([diam,h,cy],i)=>{
      const c = BABYLON.MeshBuilder.CreateCylinder("cone", { height:h*s, diameterTop:0.03, diameterBottom:diam*s, tessellation:9 }, scene);
      c.position.set(x + (i? rnd(-0.06,0.06):0), y+cy*s, z + (i? rnd(-0.06,0.06):0));
      c.material = Math.random()<0.5 ? M.leafA : M.leafB;
      c.rotation.y = rnd(0,3);
      c.bakeCurrentTransformIntoVertices();
      (c.material===M.leafA ? conesA : conesB).push(c);
    });
  };
  let placed=0, tries=0;
  while (placed<80 && tries<2500){
    tries++;
    const a=rnd(0,Math.PI*2), rr=Math.sqrt(Math.random())*(R-3);
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    if (!spotFree(x,z)) continue;
    pine(x, z, rnd(0.7,1.5));
    placed++;
  }
  // a few pines hug the castle walls and tower
  pine(8.7, -2.8, 1.1); pine(8.9, 3.6, 0.9); pine(-16.6, -11.4, 1.2); pine(-20.3, -14.6, 0.85);
  [trunks, conesA, conesB].forEach(list=>{
    if (!list.length) return;
    const m = BABYLON.Mesh.MergeMeshes(list, true, true);
    P(addShadow(m));
  });
})();
(function buildRocksAndFlowers(){
  const rocks=[];
  for (let i=0;i<26;i++){
    const a=rnd(0,Math.PI*2), rr=Math.sqrt(Math.random())*(R-2.5);
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    if (!spotFree(x,z)) continue;
    const s=rnd(0.3,1.1);
    const rock = BABYLON.MeshBuilder.CreateSphere("rock", { diameter:s*2, segments:7 }, scene);
    rock.scaling.set(1, rnd(0.55,0.8), rnd(0.7,1));
    rock.rotation.y = rnd(0,3);
    rock.position.set(x, terrainHeight(x,z)+s*0.28, z);
    rock.material = M.rock;
    rock.bakeCurrentTransformIntoVertices(); rocks.push(rock);
  }
  const merged = BABYLON.Mesh.MergeMeshes(rocks, true, true);
  if (merged){ merged.receiveShadows = true; shadowGen.addShadowCaster(merged); P(merged); }
  // wildflowers
  const petalMats = [ mat("flR",0.9,0.35,0.4,{emissive:[0.35,0.1,0.12]}),
                      mat("flY",0.95,0.8,0.25,{emissive:[0.4,0.32,0.06]}),
                      mat("flW",0.97,0.97,0.92,{emissive:[0.3,0.3,0.28]}) ];
  const byMat = [[],[],[]];
  for (let i=0;i<110;i++){
    const a=rnd(0,Math.PI*2), rr=Math.sqrt(Math.random())*(R-3.2);
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    if (!spotFree(x,z) || Math.hypot(x,z)<9) continue;
    const f = BABYLON.MeshBuilder.CreateBox("fl", { width:0.16, height:0.16, depth:0.16 }, scene);
    f.position.set(x, terrainHeight(x,z)+0.12, z);
    const k = Math.floor(rnd(0,3)); f.material = petalMats[k];
    f.bakeCurrentTransformIntoVertices(); byMat[k].push(f);
  }
  byMat.forEach(list=>{ if (list.length) P(BABYLON.Mesh.MergeMeshes(list, true, true)); });
  // bushes
  const bushes=[];
  for (let i=0;i<22;i++){
    const a=rnd(0,Math.PI*2), rr=Math.sqrt(Math.random())*(R-3);
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    if (!spotFree(x,z)) continue;
    const b = BABYLON.MeshBuilder.CreateSphere("bush", { diameter:rnd(0.7,1.3), segments:8 }, scene);
    b.scaling.y = 0.6; b.position.set(x, terrainHeight(x,z)+0.2, z);
    b.material = M.leafB; b.bakeCurrentTransformIntoVertices(); bushes.push(b);
  }
  const bm = BABYLON.Mesh.MergeMeshes(bushes, true, true);
  if (bm){ bm.receiveShadows = true; P(bm); }
})();

/* ============================================================
   RUINED WATCHTOWER at the island's edge
   ============================================================ */
(function buildWatchtower(){
  const x=-18.5, z=-12.5, y=terrainHeight(x,z);
  const root = new BABYLON.TransformNode("ruin", scene);
  root.position.set(x, y-0.15, z); root.rotation.y = 0.7; root.parent = ISLAND;
  const mk=(m)=>{ m.parent=root; addShadow(m); return m; };
  // broken ring wall — partial cylinder, jagged crown
  const wall = BABYLON.MeshBuilder.CreateCylinder("ruinWall", {
    height:4.6, diameter:4.2, tessellation:36, arc:0.72, cap:BABYLON.Mesh.NO_CAP, sideOrientation:BABYLON.Mesh.DOUBLESIDE
  }, scene);
  wall.position.y = 2.3; wall.material = M.stone; mk(wall);
  // inner dark
  const inner = BABYLON.MeshBuilder.CreateCylinder("ruinInner", {
    height:4.4, diameter:3.4, tessellation:36, arc:0.72, cap:BABYLON.Mesh.NO_CAP, sideOrientation:BABYLON.Mesh.BACKSIDE
  }, scene);
  inner.position.y = 2.3; inner.material = M.stoneDark; mk(inner);
  // jagged crown stones
  for (let i=0;i<11;i++){
    const a = (i/11)*Math.PI*2*0.72 - 0.5;
    const c = BABYLON.MeshBuilder.CreateBox("crown", { width:0.6, height:rnd(0.3,1.1), depth:0.5 }, scene);
    c.position.set(Math.cos(a)*1.9, 4.6 + c.scaling.y*0, Math.sin(a)*1.9);
    c.position.y = 4.55 + rnd(0,0.25);
    c.rotation.y = -a; c.material = Math.random()<0.5 ? M.stone : M.stoneDark; mk(c);
  }
  // doorway
  const door = BABYLON.MeshBuilder.CreateBox("ruinDoor", { width:1.0, height:1.7, depth:0.5 }, scene);
  door.position.set(0, 0.85, 2.05); door.material = M.door; mk(door);
  // tattered banner on a crooked pole
  const pole = BABYLON.MeshBuilder.CreateCylinder("rPole", { height:2.6, diameter:0.09, tessellation:6 }, scene);
  pole.position.set(1.2, 5.6, 0.4); pole.rotation.z = 0.12; pole.material = M.woodDark; mk(pole);
  // rubble
  for (let i=0;i<7;i++){
    const a=rnd(0,Math.PI*2), rr=rnd(2.4,4.2);
    const rb = BABYLON.MeshBuilder.CreateBox("rubble", { width:rnd(0.4,1.0), height:rnd(0.3,0.7), depth:rnd(0.4,0.9) }, scene);
    rb.position.set(Math.cos(a)*rr, 0.2, Math.sin(a)*rr);
    rb.rotation.y = rnd(0,3); rb.material = Math.random()<0.5 ? M.stone : M.stoneDark; mk(rb);
  }
  // fallen wall chunk
  const fallChunk = BABYLON.MeshBuilder.CreateBox("chunk", { width:2.4, height:1.1, depth:1.0 }, scene);
  fallChunk.position.set(3.6, 0.4, 2.4); fallChunk.rotation.set(0.15, 0.8, 0.1);
  fallChunk.material = M.stone; mk(fallChunk);
})();

/* ============================================================
   CLOUDS + SMALL FLOATING SHARDS
   ============================================================ */
const clouds = [];
(function buildClouds(){
  for (let i=0;i<7;i++){
    const root = new BABYLON.TransformNode("cloud", scene);
    const n = Math.floor(rnd(3,6));
    const parts=[];
    for (let k=0;k<n;k++){
      const s = rnd(2.5,5.5);
      const p = BABYLON.MeshBuilder.CreateSphere("cp", { diameter:s, segments:10 }, scene);
      p.scaling.y = 0.45;
      p.position.set(rnd(-3.5,3.5), rnd(-0.5,0.8), rnd(-2,2));
      p.material = M.cloud;
      p.bakeCurrentTransformIntoVertices(); parts.push(p);
    }
    const cloud = BABYLON.MeshBuilder ? BABYLON.Mesh.MergeMeshes(parts, true, true) : null;
    if (cloud){ cloud.parent = root; cloud.material = M.cloud; }
    const ang = rnd(0,Math.PI*2), rad = rnd(38,75), y = rnd(16,30);
    clouds.push({ root, ang, rad, y, speed: rnd(0.008,0.02) * (Math.random()<0.5?1:-1) });
    root.position.set(Math.cos(ang)*rad, y, Math.sin(ang)*rad);
  }
})();
const shards = [];
(function buildShards(){
  for (let i=0;i<5;i++){
    const root = new BABYLON.TransformNode("shard", scene);
    const a = rnd(0,Math.PI*2), rad = rnd(33,46), y = rnd(-9,4);
    root.position.set(Math.cos(a)*rad, y, Math.sin(a)*rad);
    const s = rnd(1.6,3.2);
    const top = BABYLON.MeshBuilder.CreateCylinder("shardTop", { height:0.8, diameter:s*2.2, tessellation:10 }, scene);
    top.material = M.grassVert;   // plain grass green via vertex-less mat is white → tint below
    top.material = M.leafB;
    top.parent = root;
    const bottom = BABYLON.MeshBuilder.CreateCylinder("shardBot", { height:s*2.4, diameterTop:s*2.1, diameterBottom:0.1, tessellation:10 }, scene);
    bottom.position.y = -0.4 - s*1.2; bottom.material = M.rock; bottom.parent = root;
    if (Math.random()<0.7){
      const c = BABYLON.MeshBuilder.CreateCylinder("miniPine", { height:s*0.9, diameterTop:0.02, diameterBottom:s*0.8, tessellation:7 }, scene);
      c.position.set(rnd(-0.4,0.4), 0.4+s*0.45, rnd(-0.4,0.4)); c.material = M.leafA; c.parent = root;
    }
    shards.push({ root, base:y, ph:rnd(0,6), sp:rnd(0.4,0.8) });
  }
})();

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
let T = 0;
scene.registerBeforeRender(()=>{
  const dt = Math.min(engine.getDeltaTime()/1000, 0.05);
  T += dt;
  ISLAND.position.y = Math.sin(T*0.45)*0.35;
  for (const a of animated) a.update(dt, T);
  for (const f of flagCloths){
    const pos = f.mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    for (let i=0;i<pos.length;i+=3){
      const bx = f.base[i], by = f.base[i+1];
      const k = (bx + f.w/2)/f.w;                    // 0 at pole → 1 at free edge
      pos[i+2] = Math.sin(bx*2.6 - T*6.0)*0.16*k + Math.sin(by*3.0 - T*4.2)*0.05*k;
    }
    f.mesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, pos);
  }
  for (const c of clouds){
    c.ang += c.speed*dt;
    c.root.position.set(Math.cos(c.ang)*c.rad, c.y + Math.sin(T*0.3 + c.rad)*0.6, Math.sin(c.ang)*c.rad);
  }
  for (const s of shards){
    s.root.position.y = s.base + Math.sin(T*s.sp + s.ph)*0.55;
    s.root.rotation.y += dt*0.05;
  }
});

scene.executeWhenReady(()=>{
  document.getElementById("loader").classList.add("done");
});
engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize", ()=>engine.resize());
</script>
