<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Medieval Floating Island Diorama</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1a1a2e;
        }

        #canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: Arial, sans-serif;
        }

        #loading-text {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #progress-container {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #4a6baf;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading-screen">
        <div id="loading-text">Creating Medieval Floating Island...</div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script>
        // Wait for the page to load
        document.addEventListener('DOMContentLoaded', function() {
            // Get the canvas element
            const canvas = document.getElementById("canvas");

            // Initialize the Babylon.js engine
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: true,
                stencil: true
            });

            // Update progress bar
            function updateProgress(percentage) {
                const progressBar = document.getElementById('progress-bar');
                progressBar.style.width = `${percentage}%`;
            }

            // Create the scene
            const createScene = async function() {
                // Create a basic Babylon scene
                const scene = new BABYLON.Scene(engine);

                // Add a camera
                const camera = new BABYLON.ArcRotateCamera(
                    "camera",
                    -Math.PI / 2,
                    Math.PI / 2.5,
                    50,
                    new BABYLON.Vector3(0, 5, 0),
                    scene
                );
                camera.attachControl(canvas, true);
                camera.wheelPrecision = 50;
                camera.lowerRadiusLimit = 10;
                camera.upperRadiusLimit = 100;
                camera.panningSensibility = 50;

                // Add lights
                const hemiLight = new BABYLON.HemisphericLight(
                    "hemiLight",
                    new BABYLON.Vector3(0, 1, 0),
                    scene
                );
                hemiLight.intensity = 0.6;
                hemiLight.diffuse = new BABYLON.Color3(0.9, 0.85, 0.8);
                hemiLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.3);

                const dirLight = new BABYLON.DirectionalLight(
                    "dirLight",
                    new BABYLON.Vector3(-1, -2, -1),
                    scene
                );
                dirLight.intensity = 0.8;
                dirLight.diffuse = new BABYLON.Color3(1, 0.95, 0.9);
                dirLight.specular = new BABYLON.Color3(0.5, 0.5, 0.6);

                // Enable shadows
                dirLight.shadowEnabled = true;
                dirLight.shadowMinZ = 1;
                dirLight.shadowMaxZ = 50;

                // Create the floating island
                updateProgress(10);
                await createFloatingIsland(scene);

                // Create the castle
                updateProgress(30);
                await createCastle(scene);

                // Create the village
                updateProgress(50);
                await createVillage(scene);

                // Create the environment
                updateProgress(70);
                await createEnvironment(scene);

                // Add post-processing
                updateProgress(80);
                addPostProcessing(scene, camera);

                // Finalize
                updateProgress(100);
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 500);

                return scene;
            };

            // Create the floating island
            async function createFloatingIsland(scene) {
                // Island base
                const island = BABYLON.MeshBuilder.CreateDisc(
                    "island",
                    { radius: 30, tessellation: 64, sideOrientation: BABYLON.Mesh.DOUBLESIDE },
                    scene
                );
                island.rotation.x = Math.PI / 2;

                // Island material
                const islandMat = new BABYLON.StandardMaterial("islandMat", scene);
                islandMat.diffuseColor = new BABYLON.Color3(0.3, 0.4, 0.2);
                islandMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                island.material = islandMat;

                // Island edges (cliffs)
                const cliff = BABYLON.MeshBuilder.CreateCylinder(
                    "cliff",
                    { height: 15, diameterTop: 30, diameterBottom: 28, tessellation: 64 },
                    scene
                );
                cliff.position.y = -7.5;
                cliff.material = islandMat;

                // Add some rocks to the cliffs
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 14 + Math.random() * 1;
                    const height = -5 + Math.random() * 5;
                    const size = 0.5 + Math.random() * 1.5;

                    const rock = BABYLON.MeshBuilder.CreateSphere(
                        `rock${i}`,
                        { diameter: size, segments: 8 },
                        scene
                    );
                    rock.position = new BABYLON.Vector3(
                        Math.cos(angle) * distance,
                        height,
                        Math.sin(angle) * distance
                    );
                    rock.rotation = new BABYLON.Vector3(
                        Math.random() * Math.PI,
                        Math.random() * Math.PI,
                        Math.random() * Math.PI
                    );

                    const rockMat = new BABYLON.StandardMaterial(`rockMat${i}`, scene);
                    rockMat.diffuseColor = new BABYLON.Color3(
                        0.3 + Math.random() * 0.1,
                        0.3 + Math.random() * 0.1,
                        0.3 + Math.random() * 0.1
                    );
                    rockMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                    rock.material = rockMat;

                    // Add some moss
                    if (Math.random() > 0.5) {
                        const moss = BABYLON.MeshBuilder.CreateSphere(
                            `moss${i}`,
                            { diameter: size * 0.8, segments: 4 },
                            scene
                        );
                        moss.position = rock.position.clone();
                        moss.position.y += size * 0.3;

                        const mossMat = new BABYLON.StandardMaterial(`mossMat${i}`, scene);
                        mossMat.diffuseColor = new BABYLON.Color3(
                            0.2 + Math.random() * 0.1,
                            0.4 + Math.random() * 0.1,
                            0.1 + Math.random() * 0.1
                        );
                        mossMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                        moss.material = mossMat;
                    }
                }

                // Add grass
                const grassSystem = new BABYLON.GrassProceduralTexture(
                    "grassSystem",
                    256,
                    scene
                );
                grassSystem.grassColors = [
                    new BABYLON.Color3(0.2, 0.5, 0.1),
                    new BABYLON.Color3(0.3, 0.6, 0.15),
                    new BABYLON.Color3(0.25, 0.55, 0.12)
                ];
                grassSystem.grassDensity = 0.5;
                grassSystem.grassLength = 0.5;
                grassSystem.grassWidth = 0.05;

                const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
                grassMat.diffuseTexture = grassSystem;
                grassMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                // Create ground mesh with grass
                const ground = BABYLON.MeshBuilder.CreateGround(
                    "ground",
                    { width: 60, height: 60, subdivisions: 32 },
                    scene
                );
                ground.material = grassMat;

                // Add some height variation to the ground
                const groundVertices = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                const groundNormals = ground.getVerticesData(BABYLON.VertexBuffer.NormalKind);
                const newVertices = [];

                for (let i = 0; i < groundVertices.length; i += 3) {
                    const x = groundVertices[i];
                    const z = groundVertices[i + 2];

                    // Calculate distance from center
                    const distance = Math.sqrt(x * x + z * z);

                    // Add some noise to create hills
                    const noise = Math.sin(x * 0.2) * Math.cos(z * 0.2) * 0.5;
                    const height = noise * (1 - distance / 30) * 2;

                    newVertices.push(x, height, z);
                }

                ground.setVerticesData(BABYLON.VertexBuffer.PositionKind, newVertices);
                ground.setVerticesData(BABYLON.VertexBuffer.NormalKind, groundNormals, true);

                // Add some flowers
                for (let i = 0; i < 100; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 12;
                    const x = Math.cos(angle) * distance;
                    const z = Math.sin(angle) * distance;

                    // Get height at this position
                    const ray = new BABYLON.Ray(
                        new BABYLON.Vector3(x, 10, z),
                        new BABYLON.Vector3(0, -1, 0),
                        20
                    );
                    const pick = scene.pickWithRay(ray, (mesh) => mesh === ground);

                    if (pick.hit) {
                        const flower = BABYLON.MeshBuilder.CreateCylinder(
                            `flower${i}`,
                            { height: 0.3, diameterTop: 0.1, diameterBottom: 0.05, tessellation: 8 },
                            scene
                        );
                        flower.position = pick.pickedPoint.clone();
                        flower.position.y += 0.15;

                        const flowerMat = new BABYLON.StandardMaterial(`flowerMat${i}`, scene);
                        flowerMat.diffuseColor = new BABYLON.Color3(
                            0.8 + Math.random() * 0.2,
                            0.2 + Math.random() * 0.3,
                            0.1 + Math.random() * 0.2
                        );
                        flowerMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                        flower.material = flowerMat;

                        // Add flower head
                        const head = BABYLON.MeshBuilder.CreateSphere(
                            `flowerHead${i}`,
                            { diameter: 0.15, segments: 8 },
                            scene
                        );
                        head.position = flower.position.clone();
                        head.position.y += 0.15;

                        const headMat = new BABYLON.StandardMaterial(`headMat${i}`, scene);
                        headMat.diffuseColor = new BABYLON.Color3(
                            0.9 + Math.random() * 0.1,
                            0.5 + Math.random() * 0.3,
                            0.1 + Math.random() * 0.2
                        );
                        head.material = headMat;
                    }
                }

                return island;
            }

            // Create the castle
            async function createCastle(scene) {
                // Castle base
                const castleBase = BABYLON.MeshBuilder.CreateBox(
                    "castleBase",
                    { width: 12, height: 4, depth: 12 },
                    scene
                );
                castleBase.position.y = 2;

                const castleMat = new BABYLON.StandardMaterial("castleMat", scene);
                castleMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                castleMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                castleBase.material = castleMat;

                // Castle keep
                const keep = BABYLON.MeshBuilder.CreateBox(
                    "keep",
                    { width: 8, height: 12, depth: 8 },
                    scene
                );
                keep.position.y = 8;

                // Castle towers
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI) / 2;
                    const x = Math.cos(angle) * 6;
                    const z = Math.sin(angle) * 6;

                    const tower = BABYLON.MeshBuilder.CreateCylinder(
                        `tower${i}`,
                        { height: 10, diameter: 2.5, tessellation: 16 },
                        scene
                    );
                    tower.position = new BABYLON.Vector3(x, 5, z);

                    // Tower roof
                    const roof = BABYLON.MeshBuilder.CreateCylinder(
                        `roof${i}`,
                        { height: 2, diameterTop: 0, diameterBottom: 3, tessellation: 16 },
                        scene
                    );
                    roof.position = new BABYLON.Vector3(x, 10, z);
                }

                // Castle walls
                const wallMat = new BABYLON.StandardMaterial("wallMat", scene);
                wallMat.diffuseColor = new BABYLON.Color3(0.45, 0.45, 0.45);
                wallMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                for (let i = 0; i < 4; i++) {
                    const angle1 = (i * Math.PI) / 2;
                    const angle2 = ((i + 1) * Math.PI) / 2;

                    const x1 = Math.cos(angle1) * 6;
                    const z1 = Math.sin(angle1) * 6;
                    const x2 = Math.cos(angle2) * 6;
                    const z2 = Math.sin(angle2) * 6;

                    const wall = BABYLON.MeshBuilder.CreateBox(
                        `wall${i}`,
                        { width: 8, height: 6, depth: 0.5 },
                        scene
                    );
                    wall.position = new BABYLON.Vector3(
                        (x1 + x2) / 2,
                        3,
                        (z1 + z2) / 2
                    );
                    wall.rotation.y = angle1 + Math.PI / 4;
                    wall.material = wallMat;

                    // Add battlements
                    for (let j = 0; j < 8; j++) {
                        const battlement = BABYLON.MeshBuilder.CreateBox(
                            `battlement${i}-${j}`,
                            { width: 0.8, height: 1, depth: 0.6 },
                            scene
                        );
                        battlement.position = new BABYLON.Vector3(
                            x1 + (x2 - x1) * (j + 0.5) / 8,
                            6,
                            z1 + (z2 - z1) * (j + 0.5) / 8
                        );
                        battlement.rotation.y = angle1 + Math.PI / 4;
                    }
                }

                // Castle gate
                const gate = BABYLON.MeshBuilder.CreateBox(
                    "gate",
                    { width: 3, height: 4, depth: 1 },
                    scene
                );
                gate.position = new BABYLON.Vector3(6, 2, 0);
                gate.material = wallMat;

                // Castle roof
                const roof = BABYLON.MeshBuilder.CreateCylinder(
                    "roof",
                    { height: 2, diameterTop: 0, diameterBottom: 10, tessellation: 16 },
                    scene
                );
                roof.position.y = 14;
                roof.material = new BABYLON.StandardMaterial("roofMat", scene);
                roof.material.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);
                roof.material.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                // Add some details to the castle
                addCastleDetails(scene);

                // Add shadows
                castleBase.receiveShadows = true;
                keep.receiveShadows = true;
                roof.receiveShadows = true;
                gate.receiveShadows = true;

                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(castleBase);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(keep);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(roof);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(gate);

                for (let i = 0; i < 4; i++) {
                    const tower = scene.getMeshByName(`tower${i}`);
                    const roof = scene.getMeshByName(`roof${i}`);
                    const wall = scene.getMeshByName(`wall${i}`);

                    if (tower) {
                        tower.receiveShadows = true;
                        scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(tower);
                    }

                    if (roof) {
                        roof.receiveShadows = true;
                        scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(roof);
                    }

                    if (wall) {
                        wall.receiveShadows = true;
                        scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(wall);
                    }
                }
            }

            function addCastleDetails(scene) {
                // Windows
                const windowMat = new BABYLON.StandardMaterial("windowMat", scene);
                windowMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.2);
                windowMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.6);
                windowMat.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.4);

                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4;
                    const x = Math.cos(angle) * 4;
                    const z = Math.sin(angle) * 4;

                    const window = BABYLON.MeshBuilder.CreateBox(
                        `window${i}`,
                        { width: 0.5, height: 0.8, depth: 0.2 },
                        scene
                    );
                    window.position = new BABYLON.Vector3(x, 8, z);
                    window.material = windowMat;
                }

                // Flags
                const flagPoleMat = new BABYLON.StandardMaterial("flagPoleMat", scene);
                flagPoleMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);

                const flagMat = new BABYLON.StandardMaterial("flagMat", scene);
                flagMat.diffuseColor = new BABYLON.Color3(0.8, 0.2, 0.2);

                for (let i = 0; i < 2; i++) {
                    const angle = (i * Math.PI);
                    const x = Math.cos(angle) * 3;
                    const z = Math.sin(angle) * 3;

                    const pole = BABYLON.MeshBuilder.CreateCylinder(
                        `flagPole${i}`,
                        { height: 3, diameter: 0.1, tessellation: 8 },
                        scene
                    );
                    pole.position = new BABYLON.Vector3(x, 13, z);
                    pole.material = flagPoleMat;

                    const flag = BABYLON.MeshBuilder.CreatePlane(
                        `flag${i}`,
                        { width: 1.5, height: 1 },
                        scene
                    );
                    flag.position = new BABYLON.Vector3(x, 12, z);
                    flag.rotation.y = angle + Math.PI / 2;
                    flag.material = flagMat;
                }

                // Castle entrance
                const entranceMat = new BABYLON.StandardMaterial("entranceMat", scene);
                entranceMat.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);

                const entrance = BABYLON.MeshBuilder.CreateBox(
                    "entrance",
                    { width: 2.5, height: 3, depth: 0.5 },
                    scene
                );
                entrance.position = new BABYLON.Vector3(6, 1.5, 0);
                entrance.material = entranceMat;

                // Drawbridge
                const drawbridge = BABYLON.MeshBuilder.CreateBox(
                    "drawbridge",
                    { width: 3, height: 0.2, depth: 2 },
                    scene
                );
                drawbridge.position = new BABYLON.Vector3(7.5, 0.1, 0);
                drawbridge.rotation.x = -0.2;
                drawbridge.material = entranceMat;
            }

            // Create the village
            async function createVillage(scene) {
                // Village center
                const villageCenter = new BABYLON.Vector3(15, 0, 0);

                // Create houses
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI * 2) / 8;
                    const distance = 8 + Math.random() * 4;
                    const x = villageCenter.x + Math.cos(angle) * distance;
                    const z = villageCenter.z + Math.sin(angle) * distance;

                    createHouse(scene, x, z, i);
                }

                // Create tavern
                createTavern(scene, villageCenter.x + 10, villageCenter.z);

                // Create market stalls
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI * 2) / 4 + Math.PI / 4;
                    const distance = 6;
                    const x = villageCenter.x + Math.cos(angle) * distance;
                    const z = villageCenter.z + Math.sin(angle) * distance;

                    createMarketStall(scene, x, z, i);
                }

                // Create mill
                createMill(scene, villageCenter.x, villageCenter.z - 12);
            }

            function createHouse(scene, x, z, index) {
                // House base
                const house = BABYLON.MeshBuilder.CreateBox(
                    `house${index}`,
                    { width: 3 + Math.random() * 2, height: 2.5 + Math.random() * 1, depth: 3 + Math.random() * 2 },
                    scene
                );
                house.position = new BABYLON.Vector3(x, 1.25, z);

                const houseMat = new BABYLON.StandardMaterial(`houseMat${index}`, scene);
                houseMat.diffuseColor = new BABYLON.Color3(
                    0.5 + Math.random() * 0.2,
                    0.3 + Math.random() * 0.2,
                    0.1 + Math.random() * 0.1
                );
                houseMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                house.material = houseMat;

                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder(
                    `roof${index}`,
                    { height: 0.5, diameterTop: 0, diameterBottom: 4 + Math.random() * 2, tessellation: 4 },
                    scene
                );
                roof.position = new BABYLON.Vector3(x, 2.5 + Math.random() * 0.5, z);
                roof.rotation.y = Math.random() * Math.PI * 2;

                const roofMat = new BABYLON.StandardMaterial(`roofMat${index}`, scene);
                roofMat.diffuseColor = new BABYLON.Color3(
                    0.3 + Math.random() * 0.1,
                    0.1 + Math.random() * 0.1,
                    0.05 + Math.random() * 0.05
                );
                roofMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                roof.material = roofMat;

                // Door
                const door = BABYLON.MeshBuilder.CreateBox(
                    `door${index}`,
                    { width: 0.8, height: 1.5, depth: 0.2 },
                    scene
                );
                door.position = new BABYLON.Vector3(x, 0.75, z + (house.scaling.z / 2 + 0.1));
                door.material = new BABYLON.StandardMaterial(`doorMat${index}`, scene);
                door.material.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);

                // Windows
                for (let i = 0; i < 2; i++) {
                    const window = BABYLON.MeshBuilder.CreateBox(
                        `window${index}-${i}`,
                        { width: 0.6, height: 0.6, depth: 0.2 },
                        scene
                    );
                    window.position = new BABYLON.Vector3(
                        x + (i === 0 ? -1 : 1) * (house.scaling.x / 2 - 0.5),
                        1.5,
                        z + (Math.random() > 0.5 ? 1 : -1) * (house.scaling.z / 2 - 0.3)
                    );
                    window.material = new BABYLON.StandardMaterial(`windowMat${index}-${i}`, scene);
                    window.material.diffuseColor = new BABYLON.Color3(0.7, 0.8, 0.9);
                    window.material.specularColor = new BABYLON.Color3(0.5, 0.5, 0.6);
                    window.material.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.4);
                }

                // Chimney
                if (Math.random() > 0.3) {
                    const chimney = BABYLON.MeshBuilder.CreateBox(
                        `chimney${index}`,
                        { width: 0.4, height: 1, depth: 0.4 },
                        scene
                    );
                    chimney.position = new BABYLON.Vector3(
                        x + (Math.random() > 0.5 ? -1 : 1) * (house.scaling.x / 2 - 0.5),
                        3,
                        z + (Math.random() > 0.5 ? -1 : 1) * (house.scaling.z / 2 - 0.5)
                    );
                    chimney.material = new BABYLON.StandardMaterial(`chimneyMat${index}`, scene);
                    chimney.material.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.4);
                }

                // Add shadows
                house.receiveShadows = true;
                roof.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(house);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(roof);
            }

            function createTavern(scene, x, z) {
                // Tavern base
                const tavern = BABYLON.MeshBuilder.CreateBox(
                    "tavern",
                    { width: 6, height: 3, depth: 5 },
                    scene
                );
                tavern.position = new BABYLON.Vector3(x, 1.5, z);

                const tavernMat = new BABYLON.StandardMaterial("tavernMat", scene);
                tavernMat.diffuseColor = new BABYLON.Color3(0.6, 0.4, 0.2);
                tavernMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                tavern.material = tavernMat;

                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder(
                    "tavernRoof",
                    { height: 0.5, diameterTop: 0, diameterBottom: 7, tessellation: 4 },
                    scene
                );
                roof.position = new BABYLON.Vector3(x, 3.25, z);
                roof.rotation.y = Math.PI / 4;

                const roofMat = new BABYLON.StandardMaterial("tavernRoofMat", scene);
                roofMat.diffuseColor = new BABYLON.Color3(0.3, 0.15, 0.1);
                roofMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                roof.material = roofMat;

                // Sign
                const signPole = BABYLON.MeshBuilder.CreateCylinder(
                    "signPole",
                    { height: 2, diameter: 0.1, tessellation: 8 },
                    scene
                );
                signPole.position = new BABYLON.Vector3(x + 3, 2.5, z);

                const sign = BABYLON.MeshBuilder.CreateBox(
                    "sign",
                    { width: 2, height: 1, depth: 0.1 },
                    scene
                );
                sign.position = new BABYLON.Vector3(x + 3, 3.5, z);
                sign.rotation.y = Math.PI / 2;

                const signMat = new BABYLON.StandardMaterial("signMat", scene);
                signMat.diffuseColor = new BABYLON.Color3(0.8, 0.7, 0.5);
                signMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                sign.material = signMat;

                // Windows
                for (let i = 0; i < 3; i++) {
                    const window = BABYLON.MeshBuilder.CreateBox(
                        `tavernWindow${i}`,
                        { width: 0.8, height: 0.8, depth: 0.2 },
                        scene
                    );
                    window.position = new BABYLON.Vector3(
                        x + (i - 1) * 2,
                        2,
                        z + (tavern.scaling.z / 2 + 0.1)
                    );
                    window.material = new BABYLON.StandardMaterial(`tavernWindowMat${i}`, scene);
                    window.material.diffuseColor = new BABYLON.Color3(0.7, 0.8, 0.9);
                    window.material.specularColor = new BABYLON.Color3(0.5, 0.5, 0.6);
                    window.material.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.4);
                }

                // Door
                const door = BABYLON.MeshBuilder.CreateBox(
                    "tavernDoor",
                    { width: 1.2, height: 2, depth: 0.2 },
                    scene
                );
                door.position = new BABYLON.Vector3(x, 1, z + (tavern.scaling.z / 2 + 0.1));
                door.material = new BABYLON.StandardMaterial("tavernDoorMat", scene);
                door.material.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);

                // Add shadows
                tavern.receiveShadows = true;
                roof.receiveShadows = true;
                signPole.receiveShadows = true;
                sign.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(tavern);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(roof);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(signPole);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(sign);
            }

            function createMarketStall(scene, x, z, index) {
                // Stall base
                const stall = BABYLON.MeshBuilder.CreateBox(
                    `stall${index}`,
                    { width: 2, height: 0.1, depth: 2 },
                    scene
                );
                stall.position = new BABYLON.Vector3(x, 0.05, z);

                const stallMat = new BABYLON.StandardMaterial(`stallMat${index}`, scene);
                stallMat.diffuseColor = new BABYLON.Color3(0.6, 0.5, 0.3);
                stallMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                stall.material = stallMat;

                // Roof
                const roof = BABYLON.MeshBuilder.CreateCylinder(
                    `stallRoof${index}`,
                    { height: 0.1, diameterTop: 0, diameterBottom: 3, tessellation: 4 },
                    scene
                );
                roof.position = new BABYLON.Vector3(x, 2, z);
                roof.rotation.y = Math.PI / 4;

                const roofMat = new BABYLON.StandardMaterial(`stallRoofMat${index}`, scene);
                roofMat.diffuseColor = new BABYLON.Color3(
                    0.8 + Math.random() * 0.2,
                    0.2 + Math.random() * 0.2,
                    0.1 + Math.random() * 0.1
                );
                roofMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                roof.material = roofMat;

                // Posts
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI) / 2;
                    const postX = x + Math.cos(angle) * 0.8;
                    const postZ = z + Math.sin(angle) * 0.8;

                    const post = BABYLON.MeshBuilder.CreateCylinder(
                        `stallPost${index}-${i}`,
                        { height: 2, diameter: 0.05, tessellation: 8 },
                        scene
                    );
                    post.position = new BABYLON.Vector3(postX, 1, postZ);
                }

                // Add some goods
                const goods = BABYLON.MeshBuilder.CreateBox(
                    `goods${index}`,
                    { width: 1.5, height: 0.3, depth: 1.5 },
                    scene
                );
                goods.position = new BABYLON.Vector3(x, 0.2, z);

                const goodsMat = new BABYLON.StandardMaterial(`goodsMat${index}`, scene);
                goodsMat.diffuseColor = new BABYLON.Color3(
                    0.3 + Math.random() * 0.3,
                    0.2 + Math.random() * 0.3,
                    0.1 + Math.random() * 0.2
                );
                goodsMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                goods.material = goodsMat;

                // Add shadows
                stall.receiveShadows = true;
                roof.receiveShadows = true;
                goods.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(stall);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(roof);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(goods);
            }

            function createMill(scene, x, z) {
                // Mill building
                const mill = BABYLON.MeshBuilder.CreateBox(
                    "mill",
                    { width: 4, height: 3, depth: 4 },
                    scene
                );
                mill.position = new BABYLON.Vector3(x, 1.5, z);

                const millMat = new BABYLON.StandardMaterial("millMat", scene);
                millMat.diffuseColor = new BABYLON.Color3(0.6, 0.5, 0.4);
                millMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                mill.material = millMat;

                // Mill roof
                const roof = BABYLON.MeshBuilder.CreateCylinder(
                    "millRoof",
                    { height: 0.5, diameterTop: 0, diameterBottom: 5, tessellation: 4 },
                    scene
                );
                roof.position = new BABYLON.Vector3(x, 3.25, z);
                roof.rotation.y = Math.PI / 4;

                const roofMat = new BABYLON.StandardMaterial("millRoofMat", scene);
                roofMat.diffuseColor = new BABYLON.Color3(0.3, 0.15, 0.1);
                roofMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                roof.material = roofMat;

                // Water wheel
                const wheel = BABYLON.MeshBuilder.CreateCylinder(
                    "wheel",
                    { height: 0.5, diameter: 3, tessellation: 32 },
                    scene
                );
                wheel.position = new BABYLON.Vector3(x - 3, 1, z);
                wheel.rotation.z = Math.PI / 2;

                const wheelMat = new BABYLON.StandardMaterial("wheelMat", scene);
                wheelMat.diffuseColor = new BABYLON.Color3(0.4, 0.3, 0.2);
                wheelMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                wheel.material = wheelMat;

                // Wheel paddles
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI) / 4;
                    const paddle = BABYLON.MeshBuilder.CreateBox(
                        `paddle${i}`,
                        { width: 0.2, height: 1, depth: 0.1 },
                        scene
                    );
                    paddle.position = new BABYLON.Vector3(
                        x - 3 + Math.cos(angle) * 1.5,
                        Math.sin(angle) * 1.5,
                        z
                    );
                    paddle.rotation.z = angle;
                }

                // Mill stream
                const stream = BABYLON.MeshBuilder.CreateBox(
                    "stream",
                    { width: 2, height: 0.2, depth: 8 },
                    scene
                );
                stream.position = new BABYLON.Vector3(x - 3, 0.1, z);

                const streamMat = new BABYLON.StandardMaterial("streamMat", scene);
                streamMat.diffuseColor = new BABYLON.Color3(0.4, 0.6, 0.8);
                streamMat.specularColor = new BABYLON.Color3(0.5, 0.7, 0.9);
                streamMat.emissiveColor = new BABYLON.Color3(0.2, 0.3, 0.4);
                stream.material = streamMat;

                // Add animation to the water wheel
                scene.registerBeforeRender(function() {
                    wheel.rotation.x += 0.01;
                });

                // Add shadows
                mill.receiveShadows = true;
                roof.receiveShadows = true;
                wheel.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(mill);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(roof);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(wheel);
            }

            // Create the environment
            async function createEnvironment(scene) {
                // Create the river
                const river = BABYLON.MeshBuilder.CreateGround(
                    "river",
                    { width: 60, height: 60, subdivisions: 32 },
                    scene
                );

                const riverMat = new BABYLON.StandardMaterial("riverMat", scene);
                riverMat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.7);
                riverMat.specularColor = new BABYLON.Color3(0.5, 0.7, 0.9);
                riverMat.emissiveColor = new BABYLON.Color3(0.1, 0.25, 0.35);
                riverMat.alpha = 0.8;
                river.material = riverMat;

                // Create river shape with noise
                const riverVertices = river.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                const riverNormals = river.getVerticesData(BABYLON.VertexBuffer.NormalKind);
                const newVertices = [];

                for (let i = 0; i < riverVertices.length; i += 3) {
                    const x = riverVertices[i];
                    const z = riverVertices[i + 2];

                    // Create a river path
                    const riverPath = Math.sin(x * 0.1) * 5 + Math.cos(z * 0.05) * 3;
                    const distanceToPath = Math.abs(z - riverPath);

                    // Set height based on distance to river path
                    const height = -0.5 - Math.exp(-distanceToPath * 0.2) * 2;

                    newVertices.push(x, height, z);
                }

                river.setVerticesData(BABYLON.VertexBuffer.PositionKind, newVertices);
                river.setVerticesData(BABYLON.VertexBuffer.NormalKind, riverNormals, true);

                // Create waterfalls
                for (let i = 0; i < 3; i++) {
                    const angle = (i * Math.PI * 2) / 3 + Math.PI / 2;
                    const distance = 25;
                    const x = Math.cos(angle) * distance;
                    const z = Math.sin(angle) * distance;

                    createWaterfall(scene, x, z, i);
                }

                // Create bridges
                createBridge(scene, 10, -15, 0);
                createBridge(scene, -10, 15, 1);

                // Create trees
                for (let i = 0; i < 50; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 15 + Math.random() * 15;
                    const x = Math.cos(angle) * distance;
                    const z = Math.sin(angle) * distance;

                    // Make sure trees are not on the river
                    const riverPath = Math.sin(x * 0.1) * 5 + Math.cos(z * 0.05) * 3;
                    if (Math.abs(z - riverPath) < 3) continue;

                    createTree(scene, x, z, i);
                }

                // Create ruined watchtower
                createRuinedTower(scene, -25, 0);

                // Create some rocks
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 20 + Math.random() * 10;
                    const x = Math.cos(angle) * distance;
                    const z = Math.sin(angle) * distance;

                    createRock(scene, x, z, i);
                }
            }

            function createWaterfall(scene, x, z, index) {
                // Waterfall base
                const waterfall = BABYLON.MeshBuilder.CreateBox(
                    `waterfall${index}`,
                    { width: 3, height: 0.5, depth: 1 },
                    scene
                );
                waterfall.position = new BABYLON.Vector3(x, -2, z);

                const waterfallMat = new BABYLON.StandardMaterial(`waterfallMat${index}`, scene);
                waterfallMat.diffuseColor = new BABYLON.Color3(0.4, 0.6, 0.8);
                waterfallMat.specularColor = new BABYLON.Color3(0.5, 0.7, 0.9);
                waterfallMat.emissiveColor = new BABYLON.Color3(0.2, 0.3, 0.4);
                waterfallMat.alpha = 0.7;
                waterfall.material = waterfallMat;

                // Waterfall particles
                const particleSystem = new BABYLON.ParticleSystem(`particles${index}`, 500, scene);
                particleSystem.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
                particleSystem.emitter = new BABYLON.Vector3(x, 5, z);
                particleSystem.minEmitBox = new BABYLON.Vector3(-1, 0, -0.5);
                particleSystem.maxEmitBox = new BABYLON.Vector3(1, 0, 0.5);
                particleSystem.color1 = new BABYLON.Color4(0.4, 0.6, 0.8, 0.8);
                particleSystem.color2 = new BABYLON.Color4(0.2, 0.4, 0.6, 0.8);
                particleSystem.colorDead = new BABYLON.Color4(0.1, 0.2, 0.3, 0);
                particleSystem.minSize = 0.1;
                particleSystem.maxSize = 0.3;
                particleSystem.minLifeTime = 1;
                particleSystem.maxLifeTime = 2;
                particleSystem.emitRate = 200;
                particleSystem.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
                particleSystem.gravity = new BABYLON.Vector3(0, -9.81, 0);
                particleSystem.direction1 = new BABYLON.Vector3(0.2, -1, 0.1);
                particleSystem.direction2 = new BABYLON.Vector3(-0.2, -1, -0.1);
                particleSystem.minAngularSpeed = 0;
                particleSystem.maxAngularSpeed = Math.PI;
                particleSystem.minEmitPower = 1;
                particleSystem.maxEmitPower = 3;
                particleSystem.updateSpeed = 0.01;

                particleSystem.start();
            }

            function createBridge(scene, x, z, index) {
                // Bridge base
                const bridge = BABYLON.MeshBuilder.CreateBox(
                    `bridge${index}`,
                    { width: 8, height: 0.3, depth: 3 },
                    scene
                );
                bridge.position = new BABYLON.Vector3(x, 0.15, z);

                const bridgeMat = new BABYLON.StandardMaterial(`bridgeMat${index}`, scene);
                bridgeMat.diffuseColor = new BABYLON.Color3(0.5, 0.4, 0.3);
                bridgeMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                bridge.material = bridgeMat;

                // Bridge supports
                for (let i = 0; i < 2; i++) {
                    const support = BABYLON.MeshBuilder.CreateBox(
                        `bridgeSupport${index}-${i}`,
                        { width: 0.5, height: 2, depth: 3.5 },
                        scene
                    );
                    support.position = new BABYLON.Vector3(
                        x + (i === 0 ? -3.75 : 3.75),
                        -1,
                        z
                    );
                }

                // Bridge railings
                for (let i = 0; i < 2; i++) {
                    const railing = BABYLON.MeshBuilder.CreateBox(
                        `bridgeRailing${index}-${i}`,
                        { width: 8, height: 0.5, depth: 0.2 },
                        scene
                    );
                    railing.position = new BABYLON.Vector3(x, 0.4, z + (i === 0 ? -1.5 : 1.5));
                }

                // Add some posts
                for (let i = 0; i < 5; i++) {
                    const post = BABYLON.MeshBuilder.CreateCylinder(
                        `bridgePost${index}-${i}`,
                        { height: 0.8, diameter: 0.1, tessellation: 8 },
                        scene
                    );
                    post.position = new BABYLON.Vector3(
                        x + (i - 2) * 1.6,
                        0.4,
                        z + (Math.random() > 0.5 ? -1.5 : 1.5)
                    );
                }

                // Add shadows
                bridge.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(bridge);
            }

            function createTree(scene, x, z, index) {
                // Tree trunk
                const trunk = BABYLON.MeshBuilder.CreateCylinder(
                    `trunk${index}`,
                    { height: 2 + Math.random() * 2, diameter: 0.3 + Math.random() * 0.2, tessellation: 8 },
                    scene
                );
                trunk.position = new BABYLON.Vector3(x, 1 + Math.random(), z);

                const trunkMat = new BABYLON.StandardMaterial(`trunkMat${index}`, scene);
                trunkMat.diffuseColor = new BABYLON.Color3(
                    0.3 + Math.random() * 0.1,
                    0.2 + Math.random() * 0.1,
                    0.1 + Math.random() * 0.1
                );
                trunkMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                trunk.material = trunkMat;

                // Tree leaves
                const leaves = BABYLON.MeshBuilder.CreateSphere(
                    `leaves${index}`,
                    { diameter: 2 + Math.random() * 2, segments: 8 },
                    scene
                );
                leaves.position = new BABYLON.Vector3(x, 3 + Math.random() * 2, z);

                const leavesMat = new BABYLON.StandardMaterial(`leavesMat${index}`, scene);
                leavesMat.diffuseColor = new BABYLON.Color3(
                    0.1 + Math.random() * 0.1,
                    0.4 + Math.random() * 0.2,
                    0.1 + Math.random() * 0.1
                );
                leavesMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                leaves.material = leavesMat;

                // Add shadows
                trunk.receiveShadows = true;
                leaves.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(trunk);
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(leaves);
            }

            function createRuinedTower(scene, x, z) {
                // Tower base
                const tower = BABYLON.MeshBuilder.CreateCylinder(
                    "ruinedTower",
                    { height: 8, diameter: 4, tessellation: 16 },
                    scene
                );
                tower.position = new BABYLON.Vector3(x, 4, z);

                const towerMat = new BABYLON.StandardMaterial("towerMat", scene);
                towerMat.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.4);
                towerMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                tower.material = towerMat;

                // Make it look ruined
                const positions = tower.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                const indices = tower.getIndices();
                const normals = tower.getVerticesData(BABYLON.VertexBuffer.NormalKind);

                // Remove some vertices to create a ruined look
                const newPositions = [];
                const newIndices = [];
                const newNormals = [];

                // Keep only about 70% of the vertices
                const vertexMap = {};
                for (let i = 0; i < indices.length; i++) {
                    if (Math.random() > 0.3) {
                        const index = indices[i];
                        if (!vertexMap[index]) {
                            vertexMap[index] = newPositions.length / 3;
                            for (let j = 0; j < 3; j++) {
                                newPositions.push(positions[index * 3 + j]);
                                newNormals.push(normals[index * 3 + j]);
                            }
                        }
                        newIndices.push(vertexMap[index]);
                    }
                }

                tower.setVerticesData(BABYLON.VertexBuffer.PositionKind, newPositions);
                tower.setVerticesData(BABYLON.VertexBuffer.NormalKind, newNormals);
                tower.setIndices(newIndices);

                // Add some debris
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 3;
                    const height = Math.random() * 2;
                    const size = 0.2 + Math.random() * 0.5;

                    const debris = BABYLON.MeshBuilder.CreateSphere(
                        `debris${i}`,
                        { diameter: size, segments: 4 },
                        scene
                    );
                    debris.position = new BABYLON.Vector3(
                        x + Math.cos(angle) * distance,
                        height,
                        z + Math.sin(angle) * distance
                    );
                    debris.rotation = new BABYLON.Vector3(
                        Math.random() * Math.PI,
                        Math.random() * Math.PI,
                        Math.random() * Math.PI
                    );

                    const debrisMat = new BABYLON.StandardMaterial(`debrisMat${i}`, scene);
                    debrisMat.diffuseColor = new BABYLON.Color3(
                        0.3 + Math.random() * 0.1,
                        0.3 + Math.random() * 0.1,
                        0.3 + Math.random() * 0.1
                    );
                    debrisMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                    debris.material = debrisMat;
                }

                // Add shadows
                tower.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(tower);
            }

            function createRock(scene, x, z, index) {
                const rock = BABYLON.MeshBuilder.CreateSphere(
                    `rock${index}`,
                    { diameter: 0.5 + Math.random() * 1.5, segments: 8 },
                    scene
                );
                rock.position = new BABYLON.Vector3(x, 0, z);

                // Get ground height at this position
                const ray = new BABYLON.Ray(
                    new BABYLON.Vector3(x, 10, z),
                    new BABYLON.Vector3(0, -1, 0),
                    20
                );
                const pick = scene.pickWithRay(ray, (mesh) => mesh.name === "ground");

                if (pick.hit) {
                    rock.position.y = pick.pickedPoint.y + rock.scaling.y * 0.5;
                }

                // Make it look more like a rock
                const positions = rock.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                const newPositions = [];

                for (let i = 0; i < positions.length; i += 3) {
                    const x = positions[i];
                    const y = positions[i + 1];
                    const z = positions[i + 2];

                    // Add some noise to create a more natural shape
                    const noise = Math.sin(x * 5) * Math.cos(z * 5) * 0.1;
                    newPositions.push(
                        x + (Math.random() - 0.5) * 0.2,
                        y + noise + (Math.random() - 0.5) * 0.2,
                        z + (Math.random() - 0.5) * 0.2
                    );
                }

                rock.setVerticesData(BABYLON.VertexBuffer.PositionKind, newPositions);
                rock.setVerticesData(BABYLON.VertexBuffer.NormalKind, null, true);

                const rockMat = new BABYLON.StandardMaterial(`rockMat${index}`, scene);
                rockMat.diffuseColor = new BABYLON.Color3(
                    0.3 + Math.random() * 0.1,
                    0.3 + Math.random() * 0.1,
                    0.3 + Math.random() * 0.1
                );
                rockMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                rock.material = rockMat;

                // Add shadows
                rock.receiveShadows = true;
                scene.getLightByName("dirLight").getShadowGenerator().addShadowCaster(rock);
            }

            // Add post-processing
            function addPostProcessing(scene, camera) {
                // Bloom effect
                const bloomEffect = new BABYLON.PostProcessRenderPipeline(
                    engine,
                    "bloom",
                    ["Bloom"]
                );

                const bloom = new BABYLON.BloomEffect(
                    scene,
                    1.0, // bloom threshold
                    0.5, // bloom weight
                    1.0, // kernel size
                    256  // texture size
                );

                bloomEffect.addEffect(bloom);
                scene.postProcessRenderPipelineManager.addPipeline(bloomEffect);
                scene.postProcessRenderPipelineManager.attachCamerasToRenderPipeline(
                    "bloom",
                    camera
                );

                // SSAO (Screen Space Ambient Occlusion)
                const ssaoRatio = {
                    ssaoRatio: 0.5,
                    combineRatio: 1.0
                };

                const ssao = new BABYLON.SSAO2RenderingPipeline(
                    "ssao",
                    scene,
                    ssaoRatio,
                    [camera]
                );
                ssao.radius = 2.0;
                ssao.totalStrength = 1.0;
                ssao.base = 0.5;

                // Depth of field
                const depthOfField = new BABYLON.DepthOfFieldEffect(
                    scene,
                    camera,
                    {
                        focalLength: 150,
                        fStop: 1.4,
                        focusDistance: 2000,
                        lensSize: 50
                    }
                );

                // Tone mapping
                scene.imageProcessingConfiguration.toneMappingEnabled = true;
                scene.imageProcessingConfiguration.toneMappingType =
                    BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
                scene.imageProcessingConfiguration.exposure = 1.0;
            }

            // Create the scene
            createScene().then((scene) => {
                // Run the render loop
                engine.runRenderLoop(() => {
                    scene.render();
                });

                // Handle browser resize
                window.addEventListener("resize", () => {
                    engine.resize();
                });
            });
        });
    </script>
</body>
