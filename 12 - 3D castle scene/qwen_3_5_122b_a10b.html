<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island Diorama</title>
    <!-- Babylon.js Loaders -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1c2c; /* Deep purple/blue fog base */
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        p { margin: 5px 0; opacity: 0.8; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Medieval Floating Island</h1>
        <p>Built procedurally with Babylon.js</p>
        <p>Left Click: Rotate | Right Click: Pan | Scroll: Zoom</p>
    </div>
    <canvas id="renderCanvas"></canvas>

<script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = function () {
        const scene = new BABYLON.Scene(engine);
        
        // --- 1. Camera & Lighting ---
        const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 4, Math.PI / 2.5, 25, new BABYLON.Vector3(0, 2, 0), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 15;
        camera.upperRadiusLimit = 50;
        camera.wheelPrecision = 50;

        // Soft Sun Light
        const light = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), scene);
        light.intensity = 1.2;
        light.position = new BABYLON.Vector3(20, 40, 20);
        
        // Ambient Light
        const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.6;
        hemiLight.groundColor = new BABYLON.Color3(0.2, 0.1, 0.3); // Purple ground bounce

        // Shadows
        const shadowGenerator = new BABYLON.ShadowGenerator(1024, light);
        shadowGenerator.useBlurExponentialShadowMap = true;

        // Fog for depth
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.02;
        scene.fogColor = new BABYLON.Color3(0.4, 0.4, 0.6);

        // --- 2. Materials (Procedural/PBR Styles) ---
        
        // Helper to create clay-like PBR material
        const createMat = (name, color, metallic = 0, roughness = 0.7, alpha = 1.0) => {
            const mat = new BABYLON.PBRMaterial(name, scene);
            mat.albedoColor = color;
            mat.metallic = metallic;
            mat.roughness = roughness;
            mat.alpha = alpha;
            return mat;
        };

        const matStone = createMat("stone", new BABYLON.Color3(0.55, 0.55, 0.6), 0.05, 0.8);
        const matWoodDark = createMat("woodDark", new BABYLON.Color3(0.35, 0.2, 0.1), 0.2, 0.5);
        const matWoodLight = createMat("woodLight", new BABYLON.Color3(0.6, 0.45, 0.25), 0.1, 0.4);
        const matRoof = createMat("roof", new BABYLON.Color3(0.7, 0.2, 0.2), 0.0, 0.3);
        const matGrass = createMat("grass", new BABYLON.Color3(0.2, 0.6, 0.15), 0.0, 0.8);
        const matWater = createMat("water", new BABYLON.Color3(0.1, 0.5, 0.8), 0.1, 0.1);
        matWater.transparent = true;
        
        // Texture animation helper for water
        const waterTexture = new BABYLON.CubeTexture("", scene); // Placeholder
        matWater.opacityTexture = waterTexture; // We will use a simple vertex color trick or alpha instead of complex textures for simplicity
        
        // --- 3. The Island Group ---
        const islandRoot = new BABYLON.TransformNode("islandRoot");
        islandRoot.rotation.y = -Math.PI / 4; // Start rotated slightly

        // Create Base Rock (Stylized)
        // We build a torus knot-ish shape or a modified sphere for a cool silhouette
        let rockMesh = BABYLON.MeshBuilder.CreateTorusKnot("rockBase", {
            radius: 8, tube: 1.5, radialSegments: 64, tubularSegments: 200,
            p: 2, q: 3
        }, scene);
        
        // Deform the rock to make it flatter on top and spiky below
        const vertices = rockMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        for(let i = 0; i < vertices.length; i+=3) {
            const y = vertices[i+1];
            if(y > 0) {
                // Flatten top slightly
                vertices[i] *= (1 - Math.abs(y)*0.1); 
                vertices[i+2] *= (1 - Math.abs(y)*0.1);
            } else {
                // Spike bottom
                vertices[i] *= 0.6;
                vertices[i+2] *= 0.6;
            }
            // Raise middle platform area
            if(Math.abs(vertices[i]) < 3 && Math.abs(vertices[i+2]) < 3) {
                vertices[i+1] += 0.5;
            }
        }
        rockMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, vertices);
        rockMesh.computeFrenetFrames();
        rockMesh.convertToFlatShadedMesh(); // Give it a low-poly sharp look initially
        rockMesh.material = matStone;
        rockMesh.parent = islandRoot;
        shadowGenerator.addShadowCaster(rockMesh);

        // Grass Top Layer (Masked roughly)
        const grassTop = BABYLON.MeshBuilder.CreateGroundFromPoints(
            rockMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind)
                .map((_, idx, arr) => {
                    const x = arr[idx], y = arr[idx+1], z = arr[idx+2];
                    if (y > -1 && x*x + z*z < 35) return new BABYLON.Vector3(x, y+0.1, z);
                    return null;
                }).filter(v => v !== null)
        , scene);
        grassTop.material = matGrass;
        grassTop.parent = islandRoot;
        grassTop.receiveShadows = true;


        // --- 4. Modeling Functions ---

        const createWall = (w, h, d, x, z, rotY) => {
            const m = BABYLON.MeshBuilder.CreateBox("wall", {width:w, height:h, depth:d}, scene);
            m.position = new BABYLON.Vector3(x, h/2 + 1, z);
            m.rotation.y = rotY;
            m.material = matStone;
            m.parent = islandRoot;
            shadowGenerator.addShadowCaster(m);
            
            // Battlements
            if(w > 1) {
                const steps = Math.floor(w/1.2);
                for(let i=0; i<steps; i++) {
                    const step = BABYLON.MeshBuilder.CreateBox("step", {width:0.8, height:0.4, depth: d}, scene);
                    step.position = new BABYLON.Vector3(-w/2 + 0.8 + i*1.2, h/2 + 0.2, z);
                    step.rotation.y = rotY;
                    step.material = matStone;
                    step.parent = m; // Child relative
                }
            }
        };

        const createTurret = (x, z) => {
            const tower = BABYLON.MeshBuilder.CreateCylinder("turret", {height: 6, diameter: 1.5}, scene);
            tower.position = new BABYLON.Vector3(x, 3, z);
            tower.material = matStone;
            tower.parent = islandRoot;
            shadowGenerator.addShadowCaster(tower);

            const roof = BABYLON.MeshBuilder.CreateCylinder("coneroof", {diameterBottom: 1.6, diameterTop: 0, height: 3, tessellation: 6}, scene);
            roof.position.y = 2; // relative to parent
            roof.scaling.y = 1; // reset scale inherited from conversion logic sometimes
            roof.material = matRoof;
            roof.parent = tower;
        };

        const createHouse = (x, z, type = "std") => {
            const group = new BABYLON.TransformNode("houseGroup");
            group.position = new BABYLON.Vector3(x, 1, z);

            // Walls
            const w = BABYLON.MeshBuilder.CreateBox("walls", {width:2, height:2.5, depth:3}, scene);
            w.material = matWoodLight;
            w.parent = group;

            // Timber framing (fake with stripes)
            const woodBeam = BABYLON.MeshBuilder.CreateBox("beam", {width:2.2, height:0.2, depth:3.2}, scene);
            woodBeam.material = matWoodDark;
            woodBeam.position.y = 0.8;
            woodBeam.parent = group;
            
            const beam2 = BABYLON.MeshBuilder.CreateBox("beam2", {width:2.2, height:0.2, depth:3.2}, scene);
            beam2.material = matWoodDark;
            beam2.position.y = -0.8;
            beam2.parent = group;

            // Roof
            const r = BABYLON.MeshBuilder.CreateCylinder("roof", {diameterTop: 0, diameterBottom: 3.5, height: 4, tessellation: 4}, scene);
            r.rotation.z = Math.PI / 2;
            r.rotation.y = Math.PI / 4;
            r.scaling.x = 1.5;
            r.position.y = 1.5;
            r.material = matRoof;
            r.parent = group;

            group.parent = islandRoot;
        };

        const createTree = (x, z) => {
            const group = new BABYLON.TransformNode("tree");
            group.position = new BABYLON.Vector3(x, 1, z);

            // Trunk
            const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {height: 2, diameterBottom: 0.4, diameterTop: 0.25}, scene);
            trunk.position.y = 1;
            trunk.material = matWoodDark;
            trunk.parent = group;

            // Leaves (Low poly pine cone look)
            const leaves = BABYLON.MeshBuilder.CreateCylinder("leaves", {diameterTop: 0.5, diameterBottom: 2, height: 3}, scene);
            leaves.position.y = 2.5;
            leaves.material = createMat("pine", new BABYLON.Color3(0.1, 0.5, 0.1), 0, 0.8);
            leaves.parent = group;

            // Randomize scale slightly
            const s = 0.8 + Math.random() * 0.4;
            group.scaling = new BABYLON.Vector3(s, s, s);

            group.parent = islandRoot;
        };

        const createBridge = (start, end) => {
             // Simple plank bridge
             const length = start.distanceTo(end);
             const angle = Math.atan2(end.x - start.x, end.z - start.z);
             
             const bridge = BABYLON.MeshBuilder.CreateBox("bridge", {width: 1, height: 0.1, depth: length}, scene);
             bridge.position = start.clone().lerp(end, 0.5);
             bridge.position.y += 0.5; // Height
             bridge.rotation.y = angle;
             bridge.material = matWoodLight;
             bridge.parent = islandRoot;
             shadowGenerator.addShadowCaster(bridge);
        };


        // --- 5. Build The World ---

        // Main Castle (Center)
        const mainKeep = BABYLON.MeshBuilder.CreateBox("keep", {width:5, height:8, depth:5}, scene);
        mainKeep.position = new BABYLON.Vector3(0, 4, 0);
        mainKeep.material = matStone;
        mainKeep.parent = islandRoot;
        shadowGenerator.addShadowCaster(mainKeep);

        // Wall Rings
        createWall(12, 3, 0.5, 0, -6.5, 0);
        createWall(12, 3, 0.5, 0, 6.5, 0);
        createWall(0.5, 3, 12, -6.5, 0, 0);
        createWall(0.5, 3, 12, 6.5, 0, 0);

        // Gate
        const gate = BABYLON.MeshBuilder.CreatePlane("gateDoor", {width:2, height:3}, scene);
        gate.position = new BABYLON.Vector3(0, 1.5, 6.5);
        gate.material = matWoodDark;
        gate.parent = islandRoot;
        // Draw bars
        for(let i=-0.8; i<=0.8; i+=0.4) {
            const bar = BABYLON.MeshBuilder.CreateBox("bar", {width:0.1, height:3, depth:0.1}, scene);
            bar.position = new BABYLON.Vector3(i, 1.5, 6.51);
            bar.material = matWoodDark;
            bar.parent = islandRoot;
        }

        // Corner Turrets
        createTurret(-4, -4);
        createTurret(4, -4);
        createTurret(-4, 4);
        createTurret(4, 4);

        // Village (Random scattering near castle)
        const villageCoords = [
            {x: -9, z: -2}, {x: -10, z: 4}, {x: 9, z: -2}, {x: 8, z: 3},
            {x: -2, z: 9}, {x: 5, z: 8}
        ];
        villageCoords.forEach(p => createHouse(p.x, p.z));

        // Market Stalls
        const marketPost = BABYLON.MeshBuilder.CreateCylinder("post", {diameter:0.1, height:2}, scene);
        marketPost.position = new BABYLON.Vector3(-5, 1, 8);
        marketPost.material = matWoodDark;
        marketPost.parent = islandRoot;
        
        const marketTop = BABYLON.MeshBuilder.CreateBox("marketRoof", {width:2, height:0.2, depth:2}, scene);
        marketTop.position = new BABYLON.Vector3(-5, 2, 8);
        marketTop.material = new BABYLON.StandardMaterial("matRedStripes", scene);
        marketTop.material.diffuseColor = new BABYLON.Color3(0.8, 0.1, 0.1);
        // Make stripes manually? Let's skip complex textures for stability
        marketTop.parent = islandRoot;


        // Riverside Mill
        const millGroup = new BABYLON.TransformNode("mill", {position: new BABYLON.Vector3(10, 2, -5)});
        millGroup.parent = islandRoot;
        createHouse(0,0); // Base house at origin of group
        
        // Wheel
        const wheel = BABYLON.MeshBuilder.CreateCylinder("wheel", {diameter:4, tessellation: 16}, scene);
        wheel.rotation.y = Math.PI/2;
        wheel.rotation.z = Math.PI/2;
        wheel.position = new BABYLON.Vector3(0.5, -1, 0.5);
        wheel.material = matWoodDark;
        wheel.parent = millGroup;
        
        // Wheel Spokes
        for(let i=0; i<4; i++) {
            const spoke = BABYLON.MeshBuilder.CreateBox("spoke", {width: 0.1, height: 4, depth:0.1}, scene);
            spoke.position.y = 2; // offset from center of cylinder because of rotation
            spoke.parent = wheel;
            wheel.rotation.z = Math.PI / 4; // Reset local rotation for next loop
        }

        // Animate Mill Wheel
        millGroup.registerBeforeRender(() => {
           wheel.rotation.z -= 0.05;
        });


        // Ruins at edge
        const ruinPos = [-12, 8]; // x,z pairs? no array of vec3
        [[-10, 9], [9, -10], [-9, -9]].forEach(p => {
            const ruin = BABYLON.MeshBuilder.CreateBox("ruin", {width:2, height:4, depth:2}, scene);
            ruin.position = new BABYLON.Vector3(p[0], 2, p[1]);
            ruin.rotation.y = Math.random();
            ruin.material = matStone;
            ruin.parent = islandRoot;
            
            // Debris
            const debris = BABYLON.MeshBuilder.CreatePolyhedron("debris", {type: 1, size:0.5}, scene);
            debris.position = new BABYLON.Vector3(p[0]+1, 0.5, p[1]+1);
            debris.material = matStone;
            debris.parent = islandRoot;
        });


        // Vegetation
        for(let i=0; i<30; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 5;
            // Check distance from castle
            if(radius > 6) {
                createTree(Math.cos(angle)*radius, Math.sin(angle)*radius);
            }
        }

        // Trees on cliffs (underneath)
        for(let i=0; i<10; i++) {
             const angle = Math.random() * Math.PI * 2;
             const radius = 7;
             const treeDown = BABYLON.MeshBuilder.CreateCylinder("tinyTree", {diameterTop:0.1, diameterBottom:0.5, height:1}, scene);
             treeDown.position = new BABYLON.Vector3(Math.cos(angle)*radius, -1.5, Math.sin(angle)*radius);
             treeDown.scaling.y = -1; // Flip
             treeDown.material = matWoodDark;
             treeDown.parent = islandRoot;
        }


        // --- 6. River System ---
        
        // Create a winding ribbon for the river
        const riverPath = [];
        // Starts at top right, winds down to left
        for(let t=0; t<=1; t+=0.05) {
            const x = 10 - t*20;
            // Bezier-ish curve calculation
            const z = Math.sin(t * Math.PI * 2) * 8;
            // Lower elevation as we go
            const y = 2 - t*2.5; 
            riverPath.push(new BABYLON.Vector3(x, y, z));
        }
        
        // Close the loop underwater to make a volume? Or just use a ribbon mesh
        const ribbon = BABYLON.MeshBuilder.CreateRibbon("ribbon", {pathArray: [riverPath]}, scene);
        ribbon.material = matWater;
        ribbon.position.y += 0.5;
        ribbon.parent = islandRoot;

        // Bridges crossing river
        createBridge(new BABYLON.Vector3(5, 2, 2), new BABYLON.Vector3(5, 2, -2));
        createBridge(new BABYLON.Vector3(-5, 0, 6), new BABYLON.Vector3(-5, 0, -6));


        // --- 7. Final touches & Animations ---

        // Float animation
        let time = 0;
        scene.registerBeforeRender(() => {
            time += 0.01;
            islandRoot.position.y = Math.sin(time) * 0.5;
        });

        return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(function () {
        scene.render();
    });

    window.addEventListener("resize", function () {
        engine.resize();
    });
</script>
</body>
</html>
