<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Island Diorama - Medieval Castle & Village</title>
    <style>
        :root {
            --bg: #1a1a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        .info-overlay {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ccc;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 0.03em;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: opacity 1.5s;
        }
        @media (max-width: 700px) {
            .info-overlay {
                font-size: 10px;
                padding: 6px 14px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div class="info-overlay" id="infoTip">🖱️ Drag to orbit &bull; Scroll to zoom &bull; Right-drag to pan &bull; Press R to reset view</div>

    <script src="https://cdn.babylonjs.com/babylon.js">
    </script>
    <script>
        (function() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: false,
                stencil: true,
                antialias: true
            });
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.52, 0.68, 0.85, 1.0);
            scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
            scene.fogColor = new BABYLON.Color3(0.58, 0.72, 0.88);
            scene.fogStart = 40;
            scene.fogEnd = 110;

            // ────────────────────────────────────
            // CAMERA
            // ────────────────────────────────────
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 3, Math.PI / 3.8, 48, new BABYLON.Vector3(
                0, 6, 0), scene);
            camera.lowerRadiusLimit = 22;
            camera.upperRadiusLimit = 95;
            camera.lowerBetaLimit = 0.25;
            camera.upperBetaLimit = 1.35;
            camera.panningSensibility = 600;
            camera.wheelPrecision = 35;
            camera.attachControl(canvas, true);
            camera.target = new BABYLON.Vector3(0, 7, 0);

            // ────────────────────────────────────
            // LIGHTING
            // ────────────────────────────────────
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.4, 1.0, 0.25), scene);
            hemiLight.intensity = 0.7;
            hemiLight.diffuse = new BABYLON.Color3(1.0, 0.95, 0.82);
            hemiLight.groundColor = new BABYLON.Color3(0.28, 0.32, 0.38);

            const sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.55, -0.85, -0.35), scene);
            sunLight.intensity = 0.9;
            sunLight.diffuse = new BABYLON.Color3(1.0, 0.93, 0.78);

            const warmLight = new BABYLON.PointLight("warmFill", new BABYLON.Vector3(3, 12, -5), scene);
            warmLight.intensity = 0.35;
            warmLight.diffuse = new BABYLON.Color3(1.0, 0.8, 0.55);
            warmLight.range = 35;

            // ────────────────────────────────────
            // MATERIALS
            // ────────────────────────────────────
            function createMat(name, diffuseHex, roughness = 0.75, specHex = "#222222") {
                const mat = new BABYLON.StandardMaterial(name, scene);
                mat.diffuseColor = BABYLON.Color3.FromHexString(diffuseHex);
                mat.specularColor = BABYLON.Color3.FromHexString(specHex);
                mat.roughness = roughness;
                return mat;
            }

            const grassMat = createMat("grass", "#5a8c3e", 0.9, "#111111");
            const cliffMat = createMat("cliff", "#7a6b5c", 0.85, "#1a1a1a");
            const cliffDarkMat = createMat("cliffDark", "#5c4b3b", 0.9, "#0f0f0f");
            const stoneMat = createMat("stone", "#9b8b7b", 0.7, "#2a2a2a");
            const stoneDarkMat = createMat("stoneDark", "#7b6b5b", 0.75, "#1a1a1a");
            const woodMat = createMat("wood", "#8b6914", 0.8, "#1a1a1a");
            const woodDarkMat = createMat("woodDark", "#5c3a1e", 0.85, "#0f0f0f");
            const roofMat = createMat("roof", "#6b2a1a", 0.75, "#1a0a0a");
            const roofRedMat = createMat("roofRed", "#8b3a2a", 0.7, "#1a0a0a");
            const waterMat = new BABYLON.StandardMaterial("water", scene);
            waterMat.diffuseColor = new BABYLON.Color3(0.15, 0.65, 0.7);
            waterMat.specularColor = new BABYLON.Color3(0.6, 0.7, 0.7);
            waterMat.roughness = 0.18;
            waterMat.alpha = 0.78;
            waterMat.emissiveColor = new BABYLON.Color3(0.02, 0.2, 0.22);
            const waterfallMat = new BABYLON.StandardMaterial("waterfall", scene);
            waterfallMat.diffuseColor = new BABYLON.Color3(0.35, 0.85, 0.9);
            waterfallMat.specularColor = new BABYLON.Color3(0.7, 0.8, 0.8);
            waterfallMat.roughness = 0.1;
            waterfallMat.alpha = 0.7;
            waterfallMat.emissiveColor = new BABYLON.Color3(0.1, 0.35, 0.4);
            const canopyMat1 = createMat("canopy1", "#c41e3a", 0.6, "#331111");
            const canopyMat2 = createMat("canopy2", "#daa520", 0.6, "#332211");
            const canopyMat3 = createMat("canopy3", "#2e8b57", 0.6, "#112211");
            const trunkMat = createMat("trunk", "#5c3a1e", 0.9, "#0f0f0f");
            const foliageMat = createMat("foliage", "#2d5016", 0.9, "#0a1a05");
            const foliageMat2 = createMat("foliage2", "#3a6b1e", 0.88, "#0a1a05");

            // ────────────────────────────────────
            // TERRAIN HEIGHT FUNCTION
            // ────────────────────────────────────
            const islandMaxRadius = 27;
            const islandCenter = new BABYLON.Vector3(0, 0, 0);

            function simpleNoise(x, z) {
                const n = Math.sin(x * 1.37 + z * 0.73) * Math.cos(z * 1.13 - x * 0.67) * 0.5 +
                    Math.sin(x * 2.51 + z * 2.17) * Math.cos(z * 2.31 - x * 1.89) * 0.3 +
                    Math.sin(x * 5.1 - z * 4.7) * 0.2 +
                    Math.cos(x * 7.3 + z * 6.1) * 0.15;
                return n;
            }

            function getTerrainHeight(x, z) {
                const dist = Math.sqrt(x * x + z * z);
                const maxR = islandMaxRadius;
                if (dist > maxR + 0.5) return -10;
                const cliffFactor = Math.min(1, Math.max(0, (maxR - dist) / 2.5));
                const baseHeight = 8.5 * Math.pow(Math.max(0, (maxR - dist) / maxR), 1.6);
                const noiseVal = simpleNoise(x, z) * 2.5 * cliffFactor;
                let h = baseHeight + noiseVal + 2.5;
                h = Math.max(0.5, h);
                const angle = Math.atan2(z, x);
                const riverCenterAngle = 0.45;
                const angleDiff = Math.abs(angle - riverCenterAngle);
                const angleDiffNorm = Math.min(angleDiff, Math.PI * 2 - angleDiff);
                const riverWidth = 0.32;
                const riverDistFactor = Math.max(0, 1 - angleDiffNorm / riverWidth);
                const distAlongRiver = dist / maxR;
                const riverDepth = riverDistFactor * (5.5 + distAlongRiver * 2.5) * Math.min(1, dist / 8);
                h -= riverDepth;
                h = Math.max(0.2, h);
                if (dist > maxR - 1.5 && h < 3.5) h = Math.max(h, 3.0 - (maxR - dist) * 2.5);
                return h;
            }

            // ────────────────────────────────────
            // ISLAND BODY (cylinder without top cap)
            // ────────────────────────────────────
            const islandBody = BABYLON.MeshBuilder.CreateCylinder("islandBody", {
                diameterTop: islandMaxRadius * 2,
                diameterBottom: 36,
                height: 20,
                tessellation: 72,
                faceColors: [new BABYLON.Color4(0.48, 0.4, 0.35, 1), new BABYLON.Color4(0.35, 0.28, 0.24, 1)],
            }, scene);
            islandBody.position.y = -1;
            islandBody.material = cliffMat;
            islandBody.receiveShadows = true;

            // Remove top cap from island body (we'll add custom terrain top)
            const bodyVertexData = islandBody.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            const bodyIndices = islandBody.getIndices();
            if (bodyVertexData && bodyIndices) {
                const topY = 9;
                const threshold = 8.5;
                const newIndices = [];
                for (let i = 0; i < bodyIndices.length; i += 3) {
                    const i0 = bodyIndices[i] * 3;
                    const i1 = bodyIndices[i + 1] * 3;
                    const i2 = bodyIndices[i + 2] * 3;
                    const y0 = bodyVertexData[i0 + 1];
                    const y1 = bodyVertexData[i1 + 1];
                    const y2 = bodyVertexData[i2 + 1];
                    const avgY = (y0 + y1 + y2) / 3;
                    if (avgY < threshold) {
                        newIndices.push(bodyIndices[i], bodyIndices[i + 1], bodyIndices[i + 2]);
                    }
                }
                const newVertexData = new BABYLON.VertexData();
                newVertexData.positions = bodyVertexData;
                newVertexData.indices = newIndices;
                const uvs = islandBody.getVerticesData(BABYLON.VertexBuffer.UVKind);
                const norms = islandBody.getVerticesData(BABYLON.VertexBuffer.NormalKind);
                if (uvs) newVertexData.uvs = uvs;
                if (norms) newVertexData.normals = norms;
                newVertexData.applyToMesh(islandBody, true);
            }

            // ────────────────────────────────────
            // CUSTOM TERRAIN TOP SURFACE
            // ────────────────────────────────────
            const terrainTop = new BABYLON.Mesh("terrainTop", scene);
            const topTessellation = 72;
            const topRadius = islandMaxRadius;
            const topVertices = [];
            const topIndices = [];
            const topUVs = [];
            const centerIdx = 0;
            topVertices.push(0, getTerrainHeight(0, 0) + 9, 0);
            topUVs.push(0.5, 0.5);

            for (let i = 0; i < topTessellation; i++) {
                const angle = (i / topTessellation) * Math.PI * 2;
                const x = Math.cos(angle) * topRadius;
                const z = Math.sin(angle) * topRadius;
                const h = getTerrainHeight(x, z) + 9;
                topVertices.push(x, h, z);
                topUVs.push(0.5 + Math.cos(angle) * 0.5, 0.5 + Math.sin(angle) * 0.5);
            }
            for (let i = 0; i < topTessellation; i++) {
                const next = (i + 1) % topTessellation;
                topIndices.push(centerIdx, i + 1, next + 1);
            }
            const topVertexData = new BABYLON.VertexData();
            topVertexData.positions = topVertices;
            topVertexData.indices = topIndices;
            topVertexData.uvs = topUVs;
            BABYLON.VertexData.ComputeNormals(topVertices, topIndices, topVertexData.normals || []);
            topVertexData.applyToMesh(terrainTop, true);
            terrainTop.material = grassMat;
            terrainTop.receiveShadows = true;
            terrainTop.position.y = 0;

            // ────────────────────────────────────
            // BOTTOM CAP (underside of island)
            // ────────────────────────────────────
            const bottomCap = BABYLON.MeshBuilder.CreateCylinder("bottomCap", {
                diameterTop: 36,
                diameterBottom: 36,
                height: 0.3,
                tessellation: 72,
            }, scene);
            bottomCap.position.y = -11;
            bottomCap.material = cliffDarkMat;
            bottomCap.receiveShadows = true;

            // ────────────────────────────────────
            // RIVER WATER SURFACE
            // ────────────────────────────────────
            const riverPathPoints = [];
            const numRiverPoints = 40;
            for (let i = 0; i < numRiverPoints; i++) {
                const t = i / (numRiverPoints - 1);
                const dist = t * islandMaxRadius;
                const angle = 0.45 + (t - 0.5) * 0.15;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                const h = getTerrainHeight(x, z) + 9 + 0.25;
                riverPathPoints.push(new BABYLON.Vector3(x, h, z));
            }
            const riverRibbon = BABYLON.MeshBuilder.CreateRibbon("riverWater", {
                pathArray: [
                    riverPathPoints.map(p => new BABYLON.Vector3(p.x - 0.7, p.y, p.z)),
                    riverPathPoints.map(p => new BABYLON.Vector3(p.x + 0.7, p.y, p.z)),
                ],
                closeArray: false,
                sideOrientation: BABYLON.Mesh.DOUBLESIDE,
            }, scene);
            riverRibbon.material = waterMat;
            riverRibbon.position.y = 0;

            // ────────────────────────────────────
            // WATERFALL
            // ────────────────────────────────────
            const waterfallEdge = riverPathPoints[riverPathPoints.length - 1].clone();
            const waterfallBottom = waterfallEdge.clone();
            waterfallBottom.y = -10.5;
            const waterfallRibbon = BABYLON.MeshBuilder.CreateRibbon("waterfall", {
                pathArray: [
                    [new BABYLON.Vector3(waterfallEdge.x - 0.6, waterfallEdge.y, waterfallEdge.z),
                        new BABYLON.Vector3(waterfallEdge.x + 0.6, waterfallEdge.y, waterfallEdge.z)
                    ],
                    [new BABYLON.Vector3(waterfallBottom.x - 0.5, waterfallBottom.y, waterfallBottom.z),
                        new BABYLON.Vector3(waterfallBottom.x + 0.5, waterfallBottom.y, waterfallBottom.z)
                    ],
                ],
                closeArray: false,
                sideOrientation: BABYLON.Mesh.DOUBLESIDE,
            }, scene);
            waterfallRibbon.material = waterfallMat;

            // ────────────────────────────────────
            // HELPER: place object at terrain height
            // ────────────────────────────────────
            function placeOnTerrain(mesh, x, z, yOffset = 0) {
                const h = getTerrainHeight(x, z) + 9 + yOffset;
                mesh.position.set(x, h, z);
                return h;
            }

            // ────────────────────────────────────
            // BUILDING HELPERS
            // ────────────────────────────────────
            function createHouse(x, z, scale = 1, bodyMat = woodMat, roofMatLocal = roofMat) {
                const group = new BABYLON.TransformNode("houseGroup", scene);
                const body = BABYLON.MeshBuilder.CreateBox("houseBody", {
                    width: 1.6 * scale,
                    height: 1.8 * scale,
                    depth: 1.2 * scale,
                }, scene);
                body.parent = group;
                body.position.y = 0.9 * scale;
                body.material = bodyMat;
                body.receiveShadows = true;
                const roof = BABYLON.MeshBuilder.CreateCylinder("houseRoof", {
                    diameterTop: 0,
                    diameterBottom: 2.0 * scale,
                    height: 1.4 * scale,
                    tessellation: 4,
                }, scene);
                roof.parent = group;
                roof.position.y = 1.8 * scale + 0.7 * scale;
                roof.rotation.y = Math.PI / 4;
                roof.material = roofMatLocal;
                roof.receiveShadows = true;
                const chimney = BABYLON.MeshBuilder.CreateBox("chimney", {
                    width: 0.3 * scale,
                    height: 0.9 * scale,
                    depth: 0.3 * scale,
                }, scene);
                chimney.parent = group;
                chimney.position.set(0.35 * scale, 2.0 * scale, 0.2 * scale);
                chimney.material = stoneDarkMat;
                chimney.receiveShadows = true;
                placeOnTerrain(group, x, z, 0);
                return group;
            }

            function createTavern(x, z) {
                const group = new BABYLON.TransformNode("tavernGroup", scene);
                const body = BABYLON.MeshBuilder.CreateBox("tavernBody", {
                    width: 3.0,
                    height: 2.4,
                    depth: 2.2,
                }, scene);
                body.parent = group;
                body.position.y = 1.2;
                body.material = createMat("tavernBody", "#d4c5a9", 0.7, "#222222");
                body.receiveShadows = true;
                const roof = BABYLON.MeshBuilder.CreateCylinder("tavernRoof", {
                    diameterTop: 0,
                    diameterBottom: 3.5,
                    height: 2.0,
                    tessellation: 4,
                }, scene);
                roof.parent = group;
                roof.position.y = 2.4 + 1.0;
                roof.rotation.y = Math.PI / 4;
                roof.material = roofRedMat;
                roof.receiveShadows = true;
                const signPost = BABYLON.MeshBuilder.CreateCylinder("signPost", {
                    diameterTop: 0.15,
                    diameterBottom: 0.15,
                    height: 3.5,
                }, scene);
                signPost.parent = group;
                signPost.position.set(1.6, 1.8, 0);
                signPost.material = woodDarkMat;
                const signBoard = BABYLON.MeshBuilder.CreateBox("signBoard", {
                    width: 1.8,
                    height: 0.6,
                    depth: 0.15,
                }, scene);
                signBoard.parent = group;
                signBoard.position.set(2.5, 3.2, 0);
                signBoard.material = createMat("signMat", "#f5deb3", 0.6, "#333333");
                placeOnTerrain(group, x, z, 0);
                return group;
            }

            function createMarketStall(x, z, canopyMat) {
                const group = new BABYLON.TransformNode("stallGroup", scene);
                for (let p = 0; p < 4; p++) {
                    const post = BABYLON.MeshBuilder.CreateCylinder("post", {
                        diameterTop: 0.1,
                        diameterBottom: 0.1,
                        height: 1.8,
                    }, scene);
                    post.parent = group;
                    post.position.set((p < 2 ? -0.7 : 0.7), 0.9, (p % 2 === 0 ? -0.5 : 0.5));
                    post.material = woodDarkMat;
                }
                const canopy = BABYLON.MeshBuilder.CreateBox("canopy", {
                    width: 1.8,
                    height: 0.12,
                    depth: 1.4,
                }, scene);
                canopy.parent = group;
                canopy.position.y = 1.85;
                canopy.material = canopyMat;
                canopy.receiveShadows = true;
                const table = BABYLON.MeshBuilder.CreateBox("table", {
                    width: 1.2,
                    height: 0.25,
                    depth: 0.8,
                }, scene);
                table.parent = group;
                table.position.y = 0.7;
                table.material = woodMat;
                placeOnTerrain(group, x, z, 0);
                return group;
            }

            function createPineTree(x, z, scale = 1) {
                const group = new BABYLON.TransformNode("treeGroup", scene);
                const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
                    diameterTop: 0.18 * scale,
                    diameterBottom: 0.3 * scale,
                    height: 2.2 * scale,
                }, scene);
                trunk.parent = group;
                trunk.position.y = 1.1 * scale;
                trunk.material = trunkMat;
                trunk.receiveShadows = true;
                for (let t = 0; t < 3; t++) {
                    const cone = BABYLON.MeshBuilder.CreateCylinder("cone", {
                        diameterTop: 0,
                        diameterBottom: (2.2 - t * 0.5) * scale,
                        height: (1.8 - t * 0.3) * scale,
                        tessellation: 10,
                    }, scene);
                    cone.parent = group;
                    cone.position.y = (1.6 + t * 1.2) * scale;
                    cone.material = t === 0 ? foliageMat2 : foliageMat;
                    cone.receiveShadows = true;
                }
                placeOnTerrain(group, x, z, 0);
                return group;
            }

            function createWatchtowerRuin(x, z) {
                const group = new BABYLON.TransformNode("ruinGroup", scene);
                const tower = BABYLON.MeshBuilder.CreateCylinder("ruinTower", {
                    diameterTop: 2.8,
                    diameterBottom: 3.2,
                    height: 4.5,
                    tessellation: 16,
                }, scene);
                tower.parent = group;
                tower.position.y = 2.25;
                tower.material = stoneDarkMat;
                tower.receiveShadows = true;
                // Broken top
                const brokenTop = BABYLON.MeshBuilder.CreateCylinder("brokenTop", {
                    diameterTop: 3.0,
                    diameterBottom: 2.8,
                    height: 1.2,
                    tessellation: 14,
                }, scene);
                brokenTop.parent = group;
                brokenTop.position.y = 4.5;
                brokenTop.rotation.z = 0.25;
                brokenTop.rotation.x = 0.2;
                brokenTop.material = stoneMat;
                // Rubble
                for (let r = 0; r < 6; r++) {
                    const rubble = BABYLON.MeshBuilder.CreateBox("rubble", {
                        width: 0.5 + Math.random() * 0.7,
                        height: 0.3 + Math.random() * 0.4,
                        depth: 0.4 + Math.random() * 0.6,
                    }, scene);
                    rubble.parent = group;
                    rubble.position.set((Math.random() - 0.5) * 3.5, 0.2, (Math.random() - 0.5) * 3.5);
                    rubble.rotation.set(Math.random() * 0.8, Math.random() * Math.PI, Math.random() * 0.8);
                    rubble.material = stoneDarkMat;
                }
                placeOnTerrain(group, x, z, 0);
                return group;
            }

            function createMill(x, z, riverX, riverZ) {
                const group = new BABYLON.TransformNode("millGroup", scene);
                const body = BABYLON.MeshBuilder.CreateBox("millBody", {
                    width: 2.0,
                    height: 2.4,
                    depth: 1.8,
                }, scene);
                body.parent = group;
                body.position.y = 1.2;
                body.material = createMat("millBody", "#c4b59a", 0.7, "#222222");
                body.receiveShadows = true;
                const roof = BABYLON.MeshBuilder.CreateCylinder("millRoof", {
                    diameterTop: 0,
                    diameterBottom: 2.5,
                    height: 1.6,
                    tessellation: 4,
                }, scene);
                roof.parent = group;
                roof.position.y = 2.4 + 0.8;
                roof.rotation.y = Math.PI / 4;
                roof.material = roofRedMat;
                roof.receiveShadows = true;
                // Water wheel
                const wheelGroup = new BABYLON.TransformNode("wheelGroup", scene);
                wheelGroup.parent = group;
                const wheelRim = BABYLON.MeshBuilder.CreateTorus("wheelRim", {
                    diameter: 2.8,
                    thickness: 0.2,
                    tessellation: 20,
                }, scene);
                wheelRim.parent = wheelGroup;
                wheelRim.material = woodDarkMat;
                for (let s = 0; s < 8; s++) {
                    const spoke = BABYLON.MeshBuilder.CreateBox("spoke", {
                        width: 0.1,
                        height: 2.6,
                        depth: 0.1,
                    }, scene);
                    spoke.parent = wheelGroup;
                    spoke.rotation.z = (s / 8) * Math.PI * 2;
                    spoke.material = woodMat;
                }
                wheelGroup.position.set(1.1, 1.4, -1.2);
                wheelGroup.rotation.x = Math.PI / 2;
                placeOnTerrain(group, x, z, 0);
                group._wheelGroup = wheelGroup;
                return group;
            }

            function createBridge(x, z, angle) {
                const group = new BABYLON.TransformNode("bridgeGroup", scene);
                const deck = BABYLON.MeshBuilder.CreateBox("deck", {
                    width: 3.5,
                    height: 0.2,
                    depth: 2.0,
                }, scene);
                deck.parent = group;
                deck.position.y = 0.6;
                deck.material = woodMat;
                deck.receiveShadows = true;
                for (let s = 0; s < 2; s++) {
                    const rail = BABYLON.MeshBuilder.CreateBox("rail", {
                        width: 3.6,
                        height: 0.15,
                        depth: 0.15,
                    }, scene);
                    rail.parent = group;
                    rail.position.set(0, 1.1, s === 0 ? -0.9 : 0.9);
                    rail.material = woodDarkMat;
                }
                for (let p = 0; p < 4; p++) {
                    const post = BABYLON.MeshBuilder.CreateCylinder("post", {
                        diameterTop: 0.12,
                        diameterBottom: 0.12,
                        height: 1.1,
                    }, scene);
                    post.parent = group;
                    post.position.set((p < 2 ? -1.6 : 1.6), 0.55, (p % 2 === 0 ? -0.85 : 0.85));
                    post.material = woodDarkMat;
                }
                placeOnTerrain(group, x, z, 0.5);
                group.rotation.y = angle;
                return group;
            }

            // ────────────────────────────────────
            // CASTLE CONSTRUCTION
            // ────────────────────────────────────
            function createCastle(castleX, castleZ) {
                const group = new BABYLON.TransformNode("castleGroup", scene);
                const baseH = getTerrainHeight(castleX, castleZ) + 9;

                // Central keep
                const keep = BABYLON.MeshBuilder.CreateBox("keep", {
                    width: 5.5,
                    height: 7,
                    depth: 5.5,
                }, scene);
                keep.parent = group;
                keep.position.y = 3.5;
                keep.material = stoneMat;
                keep.receiveShadows = true;

                // Keep roof
                const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", {
                    diameterTop: 0,
                    diameterBottom: 6.5,
                    height: 3.5,
                    tessellation: 8,
                }, scene);
                keepRoof.parent = group;
                keepRoof.position.y = 7 + 1.75;
                keepRoof.material = roofRedMat;
                keepRoof.receiveShadows = true;

                // Crenellations on keep
                for (let c = 0; c < 20; c++) {
                    const angle = (c / 20) * Math.PI * 2;
                    const cx = Math.cos(angle) * 2.9;
                    const cz = Math.sin(angle) * 2.9;
                    const cren = BABYLON.MeshBuilder.CreateBox("cren", {
                        width: 0.5,
                        height: 0.8,
                        depth: 0.5,
                    }, scene);
                    cren.parent = group;
                    cren.position.set(cx, 7.4, cz);
                    cren.material = stoneMat;
                }

                // Corner towers
                const towerPositions = [
                    [-3.2, -3.2],
                    [3.2, -3.2],
                    [-3.2, 3.2],
                    [3.2, 3.2]
                ];
                const towers = [];
                towerPositions.forEach(([tx, tz]) => {
                    const tower = BABYLON.MeshBuilder.CreateCylinder("tower", {
                        diameterTop: 2.2,
                        diameterBottom: 2.6,
                        height: 9,
                        tessellation: 16,
                    }, scene);
                    tower.parent = group;
                    tower.position.set(tx, 4.5, tz);
                    tower.material = stoneMat;
                    tower.receiveShadows = true;
                    const towerRoof = BABYLON.MeshBuilder.CreateCylinder("towerRoof", {
                        diameterTop: 0,
                        diameterBottom: 3.0,
                        height: 3.0,
                        tessellation: 12,
                    }, scene);
                    towerRoof.parent = group;
                    towerRoof.position.set(tx, 9 + 1.5, tz);
                    towerRoof.material = roofRedMat;
                    towerRoof.receiveShadows = true;
                    towers.push({ tower, roof: towerRoof, x: tx, z: tz });
                });

                // Walls connecting towers
                for (let w = 0; w < 4; w++) {
                    const t1 = towers[w];
                    const t2 = towers[(w + 1) % 4];
                    const midX = (t1.x + t2.x) / 2;
                    const midZ = (t1.z + t2.z) / 2;
                    const dx = t2.x - t1.x;
                    const dz = t2.z - t1.z;
                    const wallLen = Math.sqrt(dx * dx + dz * dz);
                    const wallAngle = Math.atan2(dx, dz);
                    const wall = BABYLON.MeshBuilder.CreateBox("wall", {
                        width: wallLen,
                        height: 5,
                        depth: 1.2,
                    }, scene);
                    wall.parent = group;
                    wall.position.set(midX, 2.5, midZ);
                    wall.rotation.y = wallAngle;
                    wall.material = stoneDarkMat;
                    wall.receiveShadows = true;
                }

                // Gatehouse
                const gatehouse = BABYLON.MeshBuilder.CreateBox("gatehouse", {
                    width: 3.5,
                    height: 5.5,
                    depth: 2.5,
                }, scene);
                gatehouse.parent = group;
                gatehouse.position.set(0, 2.75, -3.8);
                gatehouse.material = stoneMat;
                gatehouse.receiveShadows = true;
                const gateArch = BABYLON.MeshBuilder.CreateCylinder("gateArch", {
                    diameterTop: 2.0,
                    diameterBottom: 2.0,
                    height: 3,
                    tessellation: 16,
                }, scene);
                gateArch.parent = group;
                gateArch.position.set(0, 2.0, -2.5);
                gateArch.rotation.x = Math.PI / 2;
                gateArch.material = stoneDarkMat;

                group.position.set(castleX, baseH, castleZ);
                return group;
            }

            // ────────────────────────────────────
            // PLACE ALL ELEMENTS
            // ────────────────────────────────────
            const castleGroup = createCastle(0, 0);

            // Village houses
            const villageCenterX = -8;
            const villageCenterZ = -4;
            const houseDefs = [
                [villageCenterX - 2, villageCenterZ - 2, 0.9, woodMat, roofMat],
                [villageCenterX + 1.5, villageCenterZ - 2.5, 1.0, woodMat, roofMat],
                [villageCenterX - 0.5, villageCenterZ + 2, 0.85, woodMat, roofRedMat],
                [villageCenterX + 2.5, villageCenterZ + 1, 0.95, woodMat, roofMat],
                [villageCenterX - 3, villageCenterZ + 3.5, 0.8, woodMat, roofMat],
            ];
            houseDefs.forEach(([hx, hz, sc, bm, rm]) => createHouse(hx, hz, sc, bm, rm));

            // Tavern
            createTavern(villageCenterX + 0.5, villageCenterZ - 0.5);

            // Market stalls
            createMarketStall(villageCenterX - 1.5, villageCenterZ + 4.5, canopyMat1);
            createMarketStall(villageCenterX + 1, villageCenterZ + 5, canopyMat2);
            createMarketStall(villageCenterX + 3, villageCenterZ + 3.5, canopyMat3);

            // Mill near river
            const millGroup = createMill(9, 3, 10, 5);

            // Bridges
            createBridge(4, -2, 0.5);
            createBridge(14, 8, 0.55);

            // Watchtower ruin
            createWatchtowerRuin(-18, 14);

            // Trees
            const treePositions = [];
            const occupiedAreas = [
                { x: 0, z: 0, r: 6 },
                { x: -8, z: -4, r: 5 },
                { x: 9, z: 3, r: 3 },
                { x: -18, z: 14, r: 3 },
            ];

            function isOccupied(x, z) {
                for (const area of occupiedAreas) {
                    const dx = x - area.x;
                    const dz = z - area.z;
                    if (Math.sqrt(dx * dx + dz * dz) < area.r) return true;
                }
                const dist = Math.sqrt(x * x + z * z);
                if (dist > islandMaxRadius - 1.2) return true;
                const riverAngle = 0.45;
                const angle = Math.atan2(z, x);
                const angleDiff = Math.min(Math.abs(angle - riverAngle), Math.PI * 2 - Math.abs(angle - riverAngle));
                if (angleDiff < 0.22 && dist < islandMaxRadius - 0.5) return true;
                return false;
            }

            for (let i = 0; i < 65; i++) {
                let tx, tz;
                let attempts = 0;
                do {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 3 + Math.random() * (islandMaxRadius - 4);
                    tx = Math.cos(angle) * dist;
                    tz = Math.sin(angle) * dist;
                    attempts++;
                } while (isOccupied(tx, tz) && attempts < 30);
                if (attempts < 30) {
                    const scale = 0.6 + Math.random() * 1.3;
                    treePositions.push({ x: tx, z: tz, scale });
                }
            }
            treePositions.forEach(t => createPineTree(t.x, t.z, t.scale));

            // ────────────────────────────────────
            // DECORATIVE ELEMENTS
            // ────────────────────────────────────
            // Small stone walls near village
            function createStoneWallSegment(x, z, length, angle) {
                const wall = BABYLON.MeshBuilder.CreateBox("stoneWall", {
                    width: length,
                    height: 0.7,
                    depth: 0.35,
                }, scene);
                wall.material = stoneDarkMat;
                wall.receiveShadows = true;
                placeOnTerrain(wall, x, z, 0.35);
                wall.rotation.y = angle;
                return wall;
            }
            createStoneWallSegment(villageCenterX - 4, villageCenterZ + 6, 5, 0.3);
            createStoneWallSegment(villageCenterX + 3.5, villageCenterZ + 6.5, 4, -0.2);
            createStoneWallSegment(villageCenterX - 4.5, villageCenterZ - 3, 3.5, 0.7);

            // Flower patches (small colored spheres)
            const flowerColors = ["#e8c547", "#e8734a", "#f0a0c0", "#ffdd44", "#ff9955", "#ff6688"];
            for (let f = 0; f < 40; f++) {
                const fx = villageCenterX + (Math.random() - 0.5) * 10;
                const fz = villageCenterZ + (Math.random() - 0.5) * 10;
                if (!isOccupied(fx, fz) && Math.sqrt(fx * fx + fz * fz) < islandMaxRadius - 1) {
                    const flower = BABYLON.MeshBuilder.CreateSphere("flower", {
                        diameter: 0.18 + Math.random() * 0.2,
                    }, scene);
                    const fh = getTerrainHeight(fx, fz) + 9;
                    flower.position.set(fx, fh + 0.15, fz);
                    const fMat = new BABYLON.StandardMaterial("flowerMat", scene);
                    fMat.diffuseColor = BABYLON.Color3.FromHexString(flowerColors[Math.floor(Math.random() *
                        flowerColors.length)]);
                    fMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                    fMat.roughness = 0.5;
                    flower.material = fMat;
                }
            }

            // Small bushes
            for (let b = 0; b < 25; b++) {
                const bx = (Math.random() - 0.5) * islandMaxRadius * 1.6;
                const bz = (Math.random() - 0.5) * islandMaxRadius * 1.6;
                const dist = Math.sqrt(bx * bx + bz * bz);
                if (dist < islandMaxRadius - 1.5 && !isOccupied(bx, bz)) {
                    const bush = BABYLON.MeshBuilder.CreateSphere("bush", {
                        diameter: 0.5 + Math.random() * 0.8,
                    }, scene);
                    const bh = getTerrainHeight(bx, bz) + 9;
                    bush.position.set(bx, bh + 0.25, bz);
                    bush.scaling.y = 0.6;
                    bush.material = Math.random() < 0.5 ? foliageMat : foliageMat2;
                    bush.receiveShadows = true;
                }
            }

            // ────────────────────────────────────
            // ANIMATION LOOP
            // ────────────────────────────────────
            let time = 0;
            scene.registerBeforeRender(() => {
                time += engine.getDeltaTime() / 1000;
                // Rotate water wheel
                if (millGroup && millGroup._wheelGroup) {
                    millGroup._wheelGroup.rotation.z += 0.025;
                }
                // Subtle waterfall shimmer
                waterfallRibbon.position.y = Math.sin(time * 3) * 0.15;
                // Gentle camera sway
                const sway = Math.sin(time * 0.2) * 0.4;
                camera.target.x = sway;
                camera.target.z = Math.cos(time * 0.22) * 0.35;
                camera.target.y = 7 + Math.sin(time * 0.18) * 0.5;
            });

            // ────────────────────────────────────
            // RENDER LOOP
            // ────────────────────────────────────
            engine.runRenderLoop(() => {
                scene.render();
            });

            // ────────────────────────────────────
            // RESIZE & KEYBOARD
            // ────────────────────────────────────
            window.addEventListener("resize", () => engine.resize());
            window.addEventListener("keydown", (e) => {
                if (e.key === "r" || e.key === "R") {
                    camera.alpha = -Math.PI / 3;
                    camera.beta = Math.PI / 3.8;
                    camera.radius = 48;
                    camera.target.set(0, 7, 0);
                }
            });

            // Hide info tip after a while
            const infoTip = document.getElementById('infoTip');
            setTimeout(() => {
                infoTip.style.opacity = '0';
                setTimeout(() => infoTip.remove(), 1500);
            }, 15000);
            canvas.addEventListener('pointerdown', () => {
                infoTip.style.opacity = '0';
                setTimeout(() => infoTip.remove(), 1500);
            }, { once: true });

            console.log('🏰 Floating Island Diorama Ready!');
            console.log('   🖱️ Drag to orbit | Scroll to zoom | Right-drag to pan | R to reset');
            console.log('   🏰 Medieval castle · 🏘️ Village · 🌊 River & waterfall · 🏚️ Ruined watchtower');
        })();
    </script>
</body>
</html>
