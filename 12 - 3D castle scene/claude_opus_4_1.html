<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Floating Island - 3D Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            touch-action: none;
        }

        .info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 280px;
            z-index: 10;
        }

        .info-panel h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-item {
            margin: 10px 0;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }

        .control-key {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .fps-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div class="info-panel">
        <h2>🏰 Medieval Island</h2>
        <div class="info-item">
            A magical floating island with a grand castle, cozy village, and mystical waterfalls
        </div>
        <div class="controls">
            <div class="control-item">
                <span>Rotate Camera</span>
                <span class="control-key">Mouse Drag</span>
            </div>
            <div class="control-item">
                <span>Zoom</span>
                <span class="control-key">Scroll</span>
            </div>
            <div class="control-item">
                <span>Auto Rotate</span>
                <span class="control-key">R</span>
            </div>
        </div>
    </div>

    <div class="fps-counter" id="fps">FPS: 60</div>
    <div class="loading" id="loading">Creating magical world...</div>

    <script>
        let scene, engine, camera;
        let autoRotate = false;
        let island, castle;
        let waterMaterial;

        // Initialize Babylon.js
        function initBabylon() {
            const canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: true,
                stencil: true
            });
            
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.85, 0.9, 0.95);
            
            // Enable fog for atmosphere
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.01;
            scene.fogColor = new BABYLON.Color3(0.8, 0.85, 0.9);
            
            createCamera();
            createLighting();
            createSkybox();
            createFloatingIsland();
            createCastle();
            createVillage();
            createNature();
            createWaterFeatures();
            createRuinedWatchtower();
            addMagicalEffects();
            
            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 2000);
            
            // Start render loop
            engine.runRenderLoop(() => {
                scene.render();
                updateFPS();
                
                if (autoRotate) {
                    camera.alpha += 0.002;
                }
            });
            
            // Handle resize
            window.addEventListener('resize', () => {
                engine.resize();
            });
            
            // Keyboard controls
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'r') {
                    autoRotate = !autoRotate;
                }
            });
        }

        // Create camera
        function createCamera() {
            camera = new BABYLON.ArcRotateCamera('camera', 
                -Math.PI / 2, Math.PI / 3, 80, 
                new BABYLON.Vector3(0, 0, 0), scene);
            
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 40;
            camera.upperRadiusLimit = 150;
            camera.lowerBetaLimit = 0.5;
            camera.upperBetaLimit = Math.PI / 2.2;
            camera.wheelPrecision = 50;
            camera.panningSensibility = 0;
            
            // Smooth camera animations
            camera.inertia = 0.9;
            camera.speed = 0.5;
        }

        // Create lighting
        function createLighting() {
            // Warm hemispheric light
            const hemiLight = new BABYLON.HemisphericLight('hemiLight',
                new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.8;
            hemiLight.diffuse = new BABYLON.Color3(1, 0.95, 0.8);
            hemiLight.specular = new BABYLON.Color3(1, 0.9, 0.7);
            hemiLight.groundColor = new BABYLON.Color3(0.4, 0.3, 0.2);
            
            // Main directional light (sun)
            const sunLight = new BABYLON.DirectionalLight('sunLight',
                new BABYLON.Vector3(-1, -2, -1), scene);
            sunLight.intensity = 1.2;
            sunLight.diffuse = new BABYLON.Color3(1, 0.9, 0.7);
            sunLight.specular = new BABYLON.Color3(1, 0.95, 0.8);
            
            // Shadow generator for sun
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, sunLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;
            shadowGenerator.setDarkness(0.3);
            
            return shadowGenerator;
        }

        // Create skybox
        function createSkybox() {
            const skybox = BABYLON.MeshBuilder.CreateBox('skybox', {size: 500}, scene);
            const skyboxMaterial = new BABYLON.StandardMaterial('skyboxMat', scene);
            skyboxMaterial.backFaceCulling = false;
            skyboxMaterial.disableLighting = true;
            skyboxMaterial.emissiveColor = new BABYLON.Color3(0.8, 0.85, 0.95);
            
            // Create gradient effect
            const vertexData = skybox.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            const colors = [];
            for (let i = 0; i < vertexData.length; i += 3) {
                const y = vertexData[i + 1];
                const gradient = (y + 250) / 500;
                colors.push(0.6 + gradient * 0.3, 0.7 + gradient * 0.2, 0.85 + gradient * 0.15, 1);
            }
            skybox.setVerticesData(BABYLON.VertexBuffer.ColorKind, colors);
            skyboxMaterial.vertexColorEnabled = true;
            
            skybox.material = skyboxMaterial;
            skybox.infiniteDistance = true;
        }

        // Create floating island base
        function createFloatingIsland() {
            // Main island body
            island = BABYLON.MeshBuilder.CreateCylinder('island', {
                diameterTop: 45,
                diameterBottom: 20,
                height: 15,
                tessellation: 32
            }, scene);
            island.position.y = -5;
            
            // Deform for more natural look
            const positions = island.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                const z = positions[i + 2];
                const distance = Math.sqrt(x * x + z * z);
                
                // Add noise for natural terrain
                positions[i + 1] += Math.sin(x * 0.3) * Math.cos(z * 0.3) * 1.5;
                
                // Create cliff edges
                if (distance > 18 && y > -5) {
                    positions[i + 1] -= (distance - 18) * 0.3;
                }
            }
            island.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
            island.convertToFlatShadedMesh();
            
            // Island materials
            const islandMat = new BABYLON.StandardMaterial('islandMat', scene);
            islandMat.diffuseColor = new BABYLON.Color3(0.45, 0.3, 0.2);
            islandMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            island.material = islandMat;
            
            // Grass top layer
            const grassTop = BABYLON.MeshBuilder.CreateCylinder('grassTop', {
                diameterTop: 44,
                diameterBottom: 44,
                height: 0.5,
                tessellation: 32
            }, scene);
            grassTop.position.y = 3;
            
            const grassMat = new BABYLON.StandardMaterial('grassMat', scene);
            grassMat.diffuseColor = new BABYLON.Color3(0.3, 0.65, 0.2);
            grassMat.specularColor = new BABYLON.Color3(0.1, 0.2, 0.1);
            grassTop.material = grassMat;
            
            // Add rocky outcrops
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                const distance = 20 + Math.random() * 5;
                
                const rock = BABYLON.MeshBuilder.CreateBox('rock' + i, {
                    width: 3 + Math.random() * 3,
                    height: 4 + Math.random() * 4,
                    depth: 3 + Math.random() * 3
                }, scene);
                
                rock.position.x = Math.cos(angle) * distance;
                rock.position.z = Math.sin(angle) * distance;
                rock.position.y = -2 + Math.random() * 2;
                rock.rotation.y = Math.random() * Math.PI;
                rock.rotation.x = Math.random() * 0.3;
                
                const rockMat = new BABYLON.StandardMaterial('rockMat' + i, scene);
                rockMat.diffuseColor = new BABYLON.Color3(
                    0.4 + Math.random() * 0.1,
                    0.35 + Math.random() * 0.1,
                    0.3
                );
                rock.material = rockMat;
                rock.parent = island;
            }
            
            // Floating rocks beneath
            for (let i = 0; i < 5; i++) {
                const floatingRock = BABYLON.MeshBuilder.CreateSphere('floatRock' + i, {
                    diameter: 2 + Math.random() * 2,
                    segments: 8
                }, scene);
                
                floatingRock.position.x = (Math.random() - 0.5) * 30;
                floatingRock.position.y = -15 - Math.random() * 10;
                floatingRock.position.z = (Math.random() - 0.5) * 30;
                floatingRock.material = islandMat;
                
                // Gentle floating animation
                scene.registerBeforeRender(() => {
                    floatingRock.position.y += Math.sin(Date.now() * 0.001 + i) * 0.01;
                    floatingRock.rotation.y += 0.001;
                });
            }
        }

        // Create medieval castle
        function createCastle() {
            castle = new BABYLON.Mesh('castle', scene);
            castle.position.y = 3;
            
            // Castle base
            const castleBase = BABYLON.MeshBuilder.CreateBox('castleBase', {
                width: 12,
                height: 3,
                depth: 12
            }, scene);
            castleBase.position.y = 1.5;
            
            // Main keep
            const keep = BABYLON.MeshBuilder.CreateBox('keep', {
                width: 8,
                height: 10,
                depth: 8
            }, scene);
            keep.position.y = 6;
            
            // Castle towers
            const towerPositions = [
                {x: -5, z: -5},
                {x: 5, z: -5},
                {x: 5, z: 5},
                {x: -5, z: 5}
            ];
            
            towerPositions.forEach((pos, i) => {
                // Tower cylinder
                const tower = BABYLON.MeshBuilder.CreateCylinder('tower' + i, {
                    diameter: 3.5,
                    height: 12,
                    tessellation: 12
                }, scene);
                tower.position.x = pos.x;
                tower.position.z = pos.z;
                tower.position.y = 6;
                tower.parent = castle;
                
                // Tower roof (cone)
                const roof = BABYLON.MeshBuilder.CreateCylinder('towerRoof' + i, {
                    diameterTop: 0,
                    diameterBottom: 4.5,
                    height: 4,
                    tessellation: 12
                }, scene);
                roof.position.y = 14;
                roof.position.x = pos.x;
                roof.position.z = pos.z;
                roof.parent = castle;
                
                // Roof material
                const roofMat = new BABYLON.StandardMaterial('roofMat' + i, scene);
                roofMat.diffuseColor = new BABYLON.Color3(0.6, 0.2, 0.1);
                roofMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                roof.material = roofMat;
            });
            
            // Castle walls
            const wallPositions = [
                {x: 0, z: -5, width: 10, depth: 0.5},
                {x: 0, z: 5, width: 10, depth: 0.5},
                {x: -5, z: 0, width: 0.5, depth: 10},
                {x: 5, z: 0, width: 0.5, depth: 10}
            ];
            
            wallPositions.forEach((wall, i) => {
                const castleWall = BABYLON.MeshBuilder.CreateBox('wall' + i, {
                    width: wall.width,
                    height: 6,
                    depth: wall.depth
                }, scene);
                castleWall.position.x = wall.x;
                castleWall.position.z = wall.z;
                castleWall.position.y = 3;
                castleWall.parent = castle;
                
                // Battlements
                for (let j = 0; j < 5; j++) {
                    const battlement = BABYLON.MeshBuilder.CreateBox('battlement' + i + '_' + j, {
                        width: wall.width > 1 ? 1.5 : 0.5,
                        height: 1,
                        depth: wall.depth > 1 ? 0.5 : 1.5
                    }, scene);
                    
                    if (wall.width > 1) {
                        battlement.position.x = -4 + j * 2;
                        battlement.position.z = wall.z;
                    } else {
                        battlement.position.x = wall.x;
                        battlement.position.z = -4 + j * 2;
                    }
                    battlement.position.y = 6.5;
                    battlement.parent = castle;
                }
            });
            
            // Castle materials
            const stoneMat = new BABYLON.StandardMaterial('stoneMat', scene);
            stoneMat.diffuseColor = new BABYLON.Color3(0.6, 0.55, 0.5);
            stoneMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            stoneMat.bumpTexture = createProceduralTexture('stone');
            
            castle.getChildren().forEach(child => {
                if (!child.material) {
                    child.material = stoneMat;
                }
            });
            
            // Add flags on towers
            towerPositions.forEach((pos, i) => {
                const flagPole = BABYLON.MeshBuilder.CreateCylinder('flagPole' + i, {
                    diameter: 0.1,
                    height: 3
                }, scene);
                flagPole.position.x = pos.x;
                flagPole.position.z = pos.z;
                flagPole.position.y = 16.5;
                flagPole.parent = castle;
                
                const flag = BABYLON.MeshBuilder.CreatePlane('flag' + i, {
                    width: 1.5,
                    height: 1
                }, scene);
                flag.position.x = pos.x + 0.75;
                flag.position.z = pos.z;
                flag.position.y = 17.5;
                flag.parent = castle;
                
                const flagMat = new BABYLON.StandardMaterial('flagMat' + i, scene);
                flagMat.diffuseColor = new BABYLON.Color3(0.8, 0.1, 0.1);
                flagMat.backFaceCulling = false;
                flagMat.emissiveColor = new BABYLON.Color3(0.2, 0, 0);
                flag.material = flagMat;
                
                // Animate flag
                scene.registerBeforeRender(() => {
                    flag.rotation.y = Math.sin(Date.now() * 0.002 + i) * 0.2;
                });
            });
        }

        // Create medieval village
        function createVillage() {
            const village = new BABYLON.Mesh('village', scene);
            
            // House positions around castle
            const houseData = [
                {x: -15, z: 8, rot: 0.3, type: 'house'},
                {x: -12, z: -10, rot: -0.5, type: 'house'},
                {x: 15, z: -5, rot: 1.2, type: 'tavern'},
                {x: 10, z: 10, rot: -1, type: 'house'},
                {x: -8, z: 15, rot: 0.7, type: 'house'},
                {x: 18, z: 5, rot: -0.3, type: 'market'}
            ];
            
            houseData.forEach((data, i) => {
                const house = createBuilding(data.type, i);
                house.position.x = data.x;
                house.position.z = data.z;
                house.position.y = 3;
                house.rotation.y = data.rot;
                house.parent = village;
            });
            
            // Create mill by river
            const mill = createMill();
            mill.position.x = -18;
            mill.position.z = -5;
            mill.position.y = 3;
            mill.parent = village;
            
            // Add market stalls
            for (let i = 0; i < 3; i++) {
                const stall = createMarketStall(i);
                stall.position.x = 15 + i * 3;
                stall.position.z = 0;
                stall.position.y = 3;
                stall.rotation.y = Math.PI / 2;
                stall.parent = village;
            }
        }

        // Create building helper
        function createBuilding(type, index) {
            const building = new BABYLON.Mesh('building' + index, scene);
            
            // Base structure
            const width = type === 'tavern' ? 6 : 4;
            const depth = type === 'tavern' ? 5 : 4;
            const height = type === 'tavern' ? 4 : 3;
            
            const base = BABYLON.MeshBuilder.CreateBox('buildingBase' + index, {
                width: width,
                height: height,
                depth: depth
            }, scene);
            base.position.y = height / 2;
            base.parent = building;
            
            // Wooden material
            const woodMat = new BABYLON.StandardMaterial('woodMat' + index, scene);
            woodMat.diffuseColor = new BABYLON.Color3(0.5, 0.3, 0.2);
            woodMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            base.material = woodMat;
            
            // Roof
            const roof = BABYLON.MeshBuilder.CreateCylinder('roof' + index, {
                diameterTop: 0,
                diameterBottom: Math.max(width, depth) + 1,
                height: 2.5,
                tessellation: 4
            }, scene);
            roof.position.y = height + 1.25;
            roof.rotation.y = Math.PI / 4;
            roof.parent = building;
            
            const roofMat = new BABYLON.StandardMaterial('houseRoofMat' + index, scene);
            roofMat.diffuseColor = new BABYLON.Color3(0.4, 0.2, 0.1);
            roof.material = roofMat;
            
            // Add chimney
            const chimney = BABYLON.MeshBuilder.CreateBox('chimney' + index, {
                width: 0.5,
                height: 2,
                depth: 0.5
            }, scene);
            chimney.position.x = width / 3;
            chimney.position.y = height + 1;
            chimney.position.z = 0;
            chimney.parent = building;
            
            const chimneyMat = new BABYLON.StandardMaterial('chimneyMat' + index, scene);
            chimneyMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            chimney.material = chimneyMat;
            
            // Windows
            for (let i = 0; i < 2; i++) {
                const window = BABYLON.MeshBuilder.CreatePlane('window' + index + '_' + i, {
                    width: 0.8,
                    height: 1
                }, scene);
                window.position.x = width / 2 + 0.01;
                window.position.y = height / 2;
                window.position.z = -1 + i * 2;
                window.rotation.y = Math.PI / 2;
                window.parent = building;
                
                const windowMat = new BABYLON.StandardMaterial('windowMat' + index + '_' + i, scene);
                windowMat.diffuseColor = new BABYLON.Color3(0.8, 0.7, 0.4);
                windowMat.emissiveColor = new BABYLON.Color3(0.4, 0.3, 0.1);
                window.material = windowMat;
            }
            
            // Door
            const door = BABYLON.MeshBuilder.CreatePlane('door' + index, {
                width: 1,
                height: 1.8
            }, scene);
            door.position.z = depth / 2 + 0.01;
            door.position.y = 0.9;
            door.parent = building;
            
            const doorMat = new BABYLON.StandardMaterial('doorMat' + index, scene);
            doorMat.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);
            door.material = doorMat;
            
            // Tavern sign
            if (type === 'tavern') {
                const signPost = BABYLON.MeshBuilder.CreateCylinder('signPost' + index, {
                    diameter: 0.1,
                    height: 3
                }, scene);
                signPost.position.x = width / 2 + 1;
                signPost.position.y = 2;
                signPost.position.z = 0;
                signPost.parent = building;
                
                const sign = BABYLON.MeshBuilder.CreateBox('sign' + index, {
                    width: 1.5,
                    height: 1,
                    depth: 0.1
                }, scene);
                sign.position.x = width / 2 + 1.5;
                sign.position.y = 3;
                sign.parent = building;
                
                const signMat = new BABYLON.StandardMaterial('signMat' + index, scene);
                signMat.diffuseColor = new BABYLON.Color3(0.6, 0.4, 0.2);
                sign.material = signMat;
                
                // Animate sign
                scene.registerBeforeRender(() => {
                    sign.rotation.z = Math.sin(Date.now() * 0.001) * 0.05;
                });
            }
            
            return building;
        }

        // Create water mill
        function createMill() {
            const mill = new BABYLON.Mesh('mill', scene);
            
            // Mill building
            const millBase = BABYLON.MeshBuilder.CreateCylinder('millBase', {
                diameter: 5,
                height: 6,
                tessellation: 8
            }, scene);
            millBase.position.y = 3;
            millBase.parent = mill;
            
            const millMat = new BABYLON.StandardMaterial('millMat', scene);
            millMat.diffuseColor = new BABYLON.Color3(0.7, 0.65, 0.6);
            millBase.material = millMat;
            
            // Mill roof
            const millRoof = BABYLON.MeshBuilder.CreateCylinder('millRoof', {
                diameterTop: 0,
                diameterBottom: 6,
                height: 3,
                tessellation: 8
            }, scene);
            millRoof.position.y = 7.5;
            millRoof.parent = mill;
            
            const millRoofMat = new BABYLON.StandardMaterial('millRoofMat', scene);
            millRoofMat.diffuseColor = new BABYLON.Color3(0.5, 0.25, 0.15);
            millRoof.material = millRoofMat;
            
            // Water wheel
            const wheel = BABYLON.MeshBuilder.CreateCylinder('wheel', {
                diameter: 6,
                height: 0.5,
                tessellation: 16
            }, scene);
            wheel.position.x = -2.5;
            wheel.position.y = 1;
            wheel.rotation.z = Math.PI / 2;
            wheel.parent = mill;
            
            const wheelMat = new BABYLON.StandardMaterial('wheelMat', scene);
            wheelMat.diffuseColor = new BABYLON.Color3(0.4, 0.3, 0.2);
            wheel.material = wheelMat;
            
            // Wheel paddles
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                const paddle = BABYLON.MeshBuilder.CreateBox('paddle' + i, {
                    width: 1.5,
                    height: 0.1,
                    depth: 0.4
                }, scene);
                paddle.position.x = Math.cos(angle) * 2.5;
                paddle.position.y = Math.sin(angle) * 2.5;
                paddle.rotation.z = angle;
                paddle.parent = wheel;
                paddle.material = wheelMat;
            }
            
            // Animate water wheel
            scene.registerBeforeRender(() => {
                wheel.rotation.y += 0.01;
            });
            
            return mill;
        }

        // Create market stall
        function createMarketStall(index) {
            const stall = new BABYLON.Mesh('stall' + index, scene);
            
            // Stall frame
            const frame = BABYLON.MeshBuilder.CreateBox('stallFrame' + index, {
                width: 2,
                height: 0.1,
                depth: 1.5
            }, scene);
            frame.position.y = 1.5;
            frame.parent = stall;
            
            // Support posts
            for (let i = 0; i < 4; i++) {
                const post = BABYLON.MeshBuilder.CreateCylinder('post' + index + '_' + i, {
                    diameter: 0.1,
                    height: 1.5
                }, scene);
                post.position.x = (i < 2 ? -0.9 : 0.9);
                post.position.z = (i % 2 === 0 ? -0.65 : 0.65);
                post.position.y = 0.75;
                post.parent = stall;
            }
            
            // Canopy
            const canopy = BABYLON.MeshBuilder.CreatePlane('canopy' + index, {
                width: 2.2,
                height: 1.7
            }, scene);
            canopy.position.y = 1.6;
            canopy.rotation.x = -Math.PI / 6;
            canopy.parent = stall;
            
            const canopyMat = new BABYLON.StandardMaterial('canopyMat' + index, scene);
            const colors = [
                new BABYLON.Color3(0.8, 0.2, 0.2),
                new BABYLON.Color3(0.2, 0.5, 0.8),
                new BABYLON.Color3(0.8, 0.8, 0.2)
            ];
            canopyMat.diffuseColor = colors[index % 3];
            canopyMat.backFaceCulling = false;
            canopy.material = canopyMat;
            
            // Counter
            const counter = BABYLON.MeshBuilder.CreateBox('counter' + index, {
                width: 1.8,
                height: 0.8,
                depth: 0.3
            }, scene);
            counter.position.y = 0.4;
            counter.position.z = -0.5;
            counter.parent = stall;
            
            const woodMat = new BABYLON.StandardMaterial('stallWoodMat' + index, scene);
            woodMat.diffuseColor = new BABYLON.Color3(0.5, 0.3, 0.2);
            
            frame.material = woodMat;
            stall.getChildren().forEach(child => {
                if (!child.material && child !== canopy) {
                    child.material = woodMat;
                }
            });
            
            return stall;
        }

        // Create nature elements
        function createNature() {
            // Pine trees
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 12 + Math.random() * 10;
                
                const tree = createPineTree(i);
                tree.position.x = Math.cos(angle) * distance;
                tree.position.z = Math.sin(angle) * distance;
                tree.position.y = 3;
                tree.scaling.setAll(0.8 + Math.random() * 0.4);
                tree.rotation.y = Math.random() * Math.PI * 2;
            }
            
            // Bushes
            for (let i = 0; i < 15; i++) {
                const bush = BABYLON.MeshBuilder.CreateSphere('bush' + i, {
                    diameter: 1.5,
                    segments: 8
                }, scene);
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 8 + Math.random() * 15;
                
                bush.position.x = Math.cos(angle) * distance;
                bush.position.z = Math.sin(angle) * distance;
                bush.position.y = 3.5;
                bush.scaling.y = 0.7;
                
                const bushMat = new BABYLON.StandardMaterial('bushMat' + i, scene);
                bushMat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.1);
                bush.material = bushMat;
            }
        }

        // Create pine tree
        function createPineTree(index) {
            const tree = new BABYLON.Mesh('tree' + index, scene);
            
            // Trunk
            const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk' + index, {
                diameterBottom: 0.5,
                diameterTop: 0.3,
                height: 2,
                tessellation: 8
            }, scene);
            trunk.position.y = 1;
            trunk.parent = tree;
            
            const trunkMat = new BABYLON.StandardMaterial('trunkMat' + index, scene);
            trunkMat.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.1);
            trunk.material = trunkMat;
            
            // Tree layers
            const layers = 3;
            for (let i = 0; i < layers; i++) {
                const layer = BABYLON.MeshBuilder.CreateCylinder('treeLayer' + index + '_' + i, {
                    diameterTop: 0,
                    diameterBottom: 3 - i * 0.7,
                    height: 2,
                    tessellation: 8
                }, scene);
                layer.position.y = 2 + i * 1.2;
                layer.parent = tree;
                
                const layerMat = new BABYLON.StandardMaterial('layerMat' + index + '_' + i, scene);
                layerMat.diffuseColor = new BABYLON.Color3(0.1, 0.4 + i * 0.1, 0.1);
                layer.material = layerMat;
            }
            
            return tree;
        }

        // Create water features
        function createWaterFeatures() {
            // River
            const river = BABYLON.MeshBuilder.CreateGround('river', {
                width: 4,
                height: 60,
                subdivisions: 32
            }, scene);
            river.position.x = -10;
            river.position.y = 2.8;
            river.rotation.y = Math.PI / 8;
            
            // Water material
            waterMaterial = new BABYLON.StandardMaterial('waterMat', scene);
            waterMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.4, 0.6);
            waterMaterial.specularColor = new BABYLON.Color3(0.5, 0.7, 0.9);
            waterMaterial.emissiveColor = new BABYLON.Color3(0.05, 0.15, 0.25);
            waterMaterial.alpha = 0.7;
            river.material = waterMaterial;
            
            // Wooden bridges
            for (let i = 0; i < 2; i++) {
                const bridge = createBridge(i);
                bridge.position.x = -10;
                bridge.position.z = -10 + i * 20;
                bridge.position.y = 3.2;
                bridge.rotation.y = Math.PI / 8;
            }
            
            // Waterfall
            const waterfall = BABYLON.MeshBuilder.CreatePlane('waterfall', {
                width: 3,
                height: 8
            }, scene);
            waterfall.position.x = -22;
            waterfall.position.z = 0;
            waterfall.position.y = -1;
            waterfall.rotation.y = Math.PI / 2;
            
            const waterfallMat = new BABYLON.StandardMaterial('waterfallMat', scene);
            waterfallMat.diffuseColor = new BABYLON.Color3(0.7, 0.85, 0.95);
            waterfallMat.alpha = 0.6;
            waterfallMat.emissiveColor = new BABYLON.Color3(0.3, 0.5, 0.6);
            waterfallMat.backFaceCulling = false;
            waterfall.material = waterfallMat;
            
            // Animate waterfall
            scene.registerBeforeRender(() => {
                waterfallMat.emissiveColor.b = 0.6 + Math.sin(Date.now() * 0.003) * 0.1;
            });
            
            // Add foam particles at base
            createFoamParticles(-22, -5, 0);
        }

        // Create bridge
        function createBridge(index) {
            const bridge = new BABYLON.Mesh('bridge' + index, scene);
            
            // Bridge planks
            const plank = BABYLON.MeshBuilder.CreateBox('bridgePlank' + index, {
                width: 6,
                height: 0.2,
                depth: 3
            }, scene);
            plank.parent = bridge;
            
            const plankMat = new BABYLON.StandardMaterial('bridgePlankMat' + index, scene);
            plankMat.diffuseColor = new BABYLON.Color3(0.4, 0.3, 0.2);
            plank.material = plankMat;
            
            // Bridge rails
            for (let side = -1; side <= 1; side += 2) {
                const rail = BABYLON.MeshBuilder.CreateBox('rail' + index + '_' + side, {
                    width: 0.2,
                    height: 1,
                    depth: 3
                }, scene);
                rail.position.x = side * 2.9;
                rail.position.y = 0.5;
                rail.parent = bridge;
                rail.material = plankMat;
                
                // Rail posts
                for (let i = 0; i < 3; i++) {
                    const post = BABYLON.MeshBuilder.CreateCylinder('post' + index + '_' + side + '_' + i, {
                        diameter: 0.15,
                        height: 1
                    }, scene);
                    post.position.x = side * 2.9;
                    post.position.z = -1 + i;
                    post.position.y = 0.5;
                    post.parent = bridge;
                    post.material = plankMat;
                }
            }
            
            return bridge;
        }

        // Create ruined watchtower
        function createRuinedWatchtower() {
            const tower = new BABYLON.Mesh('ruinedTower', scene);
            tower.position.x = 20;
            tower.position.z = -8;
            tower.position.y = 3;
            
            // Broken tower base
            const towerBase = BABYLON.MeshBuilder.CreateCylinder('ruinedBase', {
                diameter: 5,
                height: 4,
                tessellation: 12
            }, scene);
            towerBase.position.y = 2;
            towerBase.parent = tower;
            
            // Deform to look ruined
            const positions = towerBase.getVerticesData(BABYLON.VertexBuffer.PositionKind);
            for (let i = 0; i < positions.length; i += 3) {
                if (positions[i + 1] > 2) {
                    positions[i + 1] -= Math.random() * 1.5;
                }
            }
            towerBase.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
            
            const oldStoneMat = new BABYLON.StandardMaterial('oldStoneMat', scene);
            oldStoneMat.diffuseColor = new BABYLON.Color3(0.5, 0.45, 0.4);
            towerBase.material = oldStoneMat;
            
            // Broken walls
            for (let i = 0; i < 4; i++) {
                const angle = (Math.PI * 2 * i) / 4;
                const wallFragment = BABYLON.MeshBuilder.CreateBox('wallFragment' + i, {
                    width: 1,
                    height: 2 + Math.random() * 2,
                    depth: 0.5
                }, scene);
                wallFragment.position.x = Math.cos(angle) * 2;
                wallFragment.position.z = Math.sin(angle) * 2;
                wallFragment.position.y = wallFragment.scaling.y;
                wallFragment.rotation.y = angle;
                wallFragment.parent = tower;
                wallFragment.material = oldStoneMat;
            }
            
            // Scattered rubble
            for (let i = 0; i < 8; i++) {
                const rubble = BABYLON.MeshBuilder.CreateBox('rubble' + i, {
                    width: 0.5 + Math.random() * 0.5,
                    height: 0.3 + Math.random() * 0.3,
                    depth: 0.5 + Math.random() * 0.5
                }, scene);
                rubble.position.x = (Math.random() - 0.5) * 6;
                rubble.position.z = (Math.random() - 0.5) * 6;
                rubble.position.y = 0.2;
                rubble.rotation.x = Math.random() * Math.PI;
                rubble.rotation.y = Math.random() * Math.PI;
                rubble.parent = tower;
                rubble.material = oldStoneMat;
            }
        }

        // Add magical particle effects
        function createFoamParticles(x, y, z) {
            const particleSystem = new BABYLON.ParticleSystem('foam', 200, scene);
            
            particleSystem.particleTexture = new BABYLON.Texture.CreateFromBase64String(
                "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==",
                "particle", scene
            );
            
            particleSystem.emitter = new BABYLON.Vector3(x, y, z);
            particleSystem.minEmitBox = new BABYLON.Vector3(-1, 0, -1);
            particleSystem.maxEmitBox = new BABYLON.Vector3(1, 0, 1);
            
            particleSystem.color1 = new BABYLON.Color4(1, 1, 1, 0.8);
            particleSystem.color2 = new BABYLON.Color4(0.8, 0.9, 1, 0.5);
            particleSystem.colorDead = new BABYLON.Color4(1, 1, 1, 0);
            
            particleSystem.minSize = 0.1;
            particleSystem.maxSize = 0.3;
            
            particleSystem.minLifeTime = 1;
            particleSystem.maxLifeTime = 2;
            
            particleSystem.emitRate = 50;
            
            particleSystem.gravity = new BABYLON.Vector3(0, -2, 0);
            
            particleSystem.direction1 = new BABYLON.Vector3(-0.5, 1, -0.5);
            particleSystem.direction2 = new BABYLON.Vector3(0.5, 2, 0.5);
            
            particleSystem.minAngularSpeed = 0;
            particleSystem.maxAngularSpeed = Math.PI;
            
            particleSystem.minEmitPower = 0.5;
            particleSystem.maxEmitPower = 1.5;
            
            particleSystem.start();
        }

        // Add magical floating particles
        function addMagicalEffects() {
            // Floating light orbs
            for (let i = 0; i < 5; i++) {
                const orb = BABYLON.MeshBuilder.CreateSphere('orb' + i, {
                    diameter: 0.3,
                    segments: 8
                }, scene);
                
                const orbMat = new BABYLON.StandardMaterial('orbMat' + i, scene);
                orbMat.emissiveColor = new BABYLON.Color3(0.5, 0.8, 1);
                orbMat.diffuseColor = new BABYLON.Color3(0.5, 0.8, 1);
                orb.material = orbMat;
                
                // Random orbit
                const radius = 15 + Math.random() * 10;
                const speed = 0.001 + Math.random() * 0.002;
                const height = 5 + Math.random() * 5;
                const phase = Math.random() * Math.PI * 2;
                
                scene.registerBeforeRender(() => {
                    const time = Date.now() * speed + phase;
                    orb.position.x = Math.cos(time) * radius;
                    orb.position.z = Math.sin(time) * radius;
                    orb.position.y = height + Math.sin(time * 2) * 2;
                    
                    orbMat.emissiveColor.r = 0.5 + Math.sin(time * 3) * 0.2;
                    orbMat.emissiveColor.g = 0.8 + Math.sin(time * 2) * 0.1;
                });
            }
        }

        // Create procedural texture
        function createProceduralTexture(type) {
            const texture = new BABYLON.DynamicTexture('procTexture_' + type, 256, scene);
            const context = texture.getContext();
            
            if (type === 'stone') {
                // Create stone pattern
                for (let i = 0; i < 256; i += 32) {
                    for (let j = 0; j < 256; j += 32) {
                        const gray = 100 + Math.random() * 50;
                        context.fillStyle = `rgb(${gray}, ${gray}, ${gray})`;
                        context.fillRect(i, j, 30, 30);
                    }
                }
            }
            
            texture.update();
            return texture;
        }

        // Update FPS counter
        function updateFPS() {
            const fps = engine.getFps().toFixed();
            document.getElementById('fps').textContent = `FPS: ${fps}`;
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', initBabylon);
    </script>
</body>
</html>
