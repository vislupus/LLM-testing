<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Floating Island Diorama – Babylon.js</title>
<!-- Babylon.js CDN -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<!-- Optional helpers (GUI, loaders, etc.) -->
<script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
<style>
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#222; }
    #renderCanvas { width:100%; height:100%; touch-action:none; }
    /* quick-reset for GUI if you add one later */
    .babylonJS .panel { background:rgba(0,0,0,.4); }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<script>
/* -------------------------------------------------
   1. Basic engine / scene scaffolding
---------------------------------------------------*/
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { stencil: true });

const createScene = function () {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.55, 0.8, 1.0, 1); // sky-blue BG

    /* camera */
    const camera = new BABYLON.ArcRotateCamera("cam",
        BABYLON.Tools.ToRadians(135),
        BABYLON.Tools.ToRadians(65),
        60,
        new BABYLON.Vector3(0, 10, 0),
        scene);
    camera.lowerRadiusLimit = 25;
    camera.upperRadiusLimit = 100;
    camera.wheelPrecision = 30;
    camera.attachControl(canvas, true);

    /* lighting */
    const sun = new BABYLON.DirectionalLight("sun",
        new BABYLON.Vector3(-0.6, -1, -0.3),
        scene);
    sun.position = new BABYLON.Vector3(60, 120, 20);
    sun.intensity = 2.2;

    const hdr = new BABYLON.HemisphericLight("hemi",
        new BABYLON.Vector3(0, 1, 0), scene);
    hdr.intensity = 0.4;

    /* shadow generator */
    const shadowGen = new BABYLON.ShadowGenerator(4096, sun);
    shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.blurKernel = 48;

    /* handy palette */
    const palette = {
        stone:  new BABYLON.Color3.FromHexString("#9d9fa8"),
        wood:   new BABYLON.Color3.FromHexString("#7b5135"),
        roof:   new BABYLON.Color3.FromHexString("#c23c3d"),
        grass:  new BABYLON.Color3.FromHexString("#4ba84b"),
        water:  new BABYLON.Color3.FromHexString("#2ecdd3"),
        rock:   new BABYLON.Color3.FromHexString("#6b6e78")
    };

    /* -------------------------------------------------
       2. Materials
    ---------------------------------------------------*/
    function matte(name, col) {
        const m = new BABYLON.StandardMaterial(name, scene);
        m.diffuseColor = col;
        m.specularColor = BABYLON.Color3.Black();
        return m;
    }
    const matStone = matte("stone", palette.stone);
    const matWood  = matte("wood",  palette.wood);
    const matRoof  = matte("roof",  palette.roof);
    const matGrass = matte("grass", palette.grass);
    const matRock  = matte("rock",  palette.rock);

    /* Slight sheen on water */
    const matWater = new BABYLON.StandardMaterial("water", scene);
    matWater.diffuseColor  = palette.water;
    matWater.alpha = 0.88;
    matWater.specularPower = 96;
    matWater.specularColor = BABYLON.Color3.White();

    /* -------------------------------------------------
       3. Terrain: island base + grass top
    ---------------------------------------------------*/
    const islandBase = BABYLON.MeshBuilder.CreateCylinder("island", {
        diameterTop: 55,
        diameterBottom: 25,
        height: 24,
        tessellation: 64
    }, scene);
    islandBase.material = matRock;
    islandBase.receiveShadows = true;

    const grassTop = BABYLON.MeshBuilder.CreateDisc("grass", {
        radius: 27, tessellation: 64, sideOrientation: BABYLON.Mesh.DOUBLESIDE
    }, scene);
    grassTop.material = matGrass;
    grassTop.position.y = islandBase.height / 2 + 0.05;
    grassTop.receiveShadows = true;

    /* cliffs variation (noise-edged ring) */
    const cliffRing = BABYLON.MeshBuilder.CreateTorusKnot("cliff", {
        radius: 22, tube: 5, radialSegments: 128, tubularSegments: 32,
        p: 2, q: 3
    }, scene);
    cliffRing.scaling = new BABYLON.Vector3(1.1, 0.28, 1.1);
    cliffRing.rotation.x = Math.PI / 2;
    cliffRing.material = matRock;
    cliffRing.position.y = 4;
    cliffRing.receiveShadows = true;

    /* -------------------------------------------------
       4. River & waterfalls
    ---------------------------------------------------*/
    const river = BABYLON.MeshBuilder.CreateGround("river", {
        width: 28, height: 6, subdivisions: 2
    }, scene);
    river.material = matWater;
    river.position.y = grassTop.position.y + 0.05;
    river.rotation.y = BABYLON.Tools.ToRadians(25);

    function makeWaterfall(side) {
        const wf = BABYLON.MeshBuilder.CreatePlane("wf"+side, {
            width: 4, height: 10, sideOrientation: BABYLON.Mesh.DOUBLESIDE
        }, scene);
        wf.material = matWater;
        wf.position = new BABYLON.Vector3(
            Math.cos(side) * 13,
            river.position.y - 4,
            Math.sin(side) * 13
        );
        wf.rotation.x = BABYLON.Tools.ToRadians(-90);
        wf.rotation.y = side + BABYLON.Tools.ToRadians(25);
    }
    makeWaterfall(0);
    makeWaterfall(Math.PI);

    /* -------------------------------------------------
       5. Castle (keep + four corner towers + walls)
    ---------------------------------------------------*/
    const keep = BABYLON.MeshBuilder.CreateCylinder("keep", {
        diameterTop: 8, diameterBottom: 8, height: 12, tessellation: 6
    }, scene);
    keep.material = matStone;
    keep.position.y = grassTop.position.y + 6;
    keep.receiveShadows = true; shadowGen.addShadowCaster(keep);

    const towerPositions = [
        [ 6,  6], [ 6, -6], [-6, 6], [-6,-6]
    ];
    towerPositions.forEach((p,i)=>{
        const t = BABYLON.MeshBuilder.CreateCylinder("tower"+i, {
            diameterTop: 4, diameterBottom: 4, height: 10, tessellation: 6
        }, scene);
        t.material = matStone;
        t.position.set(p[0], keep.position.y, p[1]);
        shadowGen.addShadowCaster(t);
    });

    /* walls */
    const wall = BABYLON.MeshBuilder.CreateBox("wall", {
        width: 12, height: 5, depth: 1
    }, scene);
    wall.material = matStone; wall.position.y = keep.position.y;
    wall.position.z = -6;
    const wall2 = wall.clone("wall2"); wall2.position.z = 6;
    const wall3 = wall.clone("wall3"); wall3.rotation.y = Math.PI/2; wall3.position.x = -6; wall3.position.z = 0;
    const wall4 = wall3.clone("wall4"); wall4.position.x = 6;

    /* -------------------------------------------------
       6. Village (simple stylised houses) 
    ---------------------------------------------------*/
    function makeHouse(name, x, z, scale=1) {
        const base = BABYLON.MeshBuilder.CreateBox(name+"_base", {size:3}, scene);
        base.scaling = new BABYLON.Vector3(1.6, 1.2, 1.6).scale(scale);
        base.material = matWood;

        const roof = BABYLON.MeshBuilder.CreateCylinder(name+"_roof", {
            diameterTop: 0, diameterBottom: 3.2, height:2.2,
            tessellation: 4, enclose: true
        }, scene);
        roof.position.y = 2*scale;
        roof.rotation.z = Math.PI/4;
        roof.material = matRoof;

        const house = BABYLON.Mesh.MergeMeshes([base, roof], true);
        house.position.set(x, grassTop.position.y + 0.6*scale, z);
        house.receiveShadows = true; shadowGen.addShadowCaster(house);
    }

    /* scatter some houses & market stalls */
    const rng = () => (Math.random()*0.8+0.6)*(Math.random()<0.5?1:-1);
    for (let i=0;i<8;i++){
        makeHouse("house"+i, rng()*12, rng()*12, Math.random()*0.4+0.8);
    }

    /* Mill (house + wheel) */
    makeHouse("mill", -14, 2, 1.2);
    const wheel = BABYLON.MeshBuilder.CreateTorus("wheel", {
        diameter: 4, thickness: 0.4, tessellation: 24
    }, scene);
    wheel.position.set(-14, grassTop.position.y+1.2, 3.4);
    wheel.rotation.z = Math.PI/2;
    wheel.material = matWood;
    shadowGen.addShadowCaster(wheel);

    /* -------------------------------------------------
       7. Ruined watch-tower at island rim
    ---------------------------------------------------*/
    const ruin = BABYLON.MeshBuilder.CreateCylinder("ruin", {
        diameterTop: 2.5, diameterBottom: 2.8, height: 6, tessellation: 6
    }, scene);
    ruin.material = matStone;
    ruin.position.set(18, grassTop.position.y+3, -16);
    ruin.rotation.x = BABYLON.Tools.ToRadians(3);
    shadowGen.addShadowCaster(ruin);

    /* crumble (a few boxes) */
    for(let i=0;i<4;i++){
        const rubble = BABYLON.MeshBuilder.CreateBox("rubble"+i, {size:1.2}, scene);
        rubble.material = matStone;
        rubble.position = ruin.position.add(new BABYLON.Vector3(
            (Math.random()-0.5)*2,
            -3.5 + Math.random(),
            (Math.random()-0.5)*2
        ));
        shadowGen.addShadowCaster(rubble);
    }

    /* -------------------------------------------------
       8. Pine trees
    ---------------------------------------------------*/
    function makePine(x,z,scale=1){
        const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {
            diameterTop: 0.5, diameterBottom: 0.8, height: 2*scale, tessellation: 8
        }, scene);
        trunk.material = matWood;

        const foliage = [];
        const layers = 3;
        for(let i=0;i<layers;i++){
            const cone = BABYLON.MeshBuilder.CreateCylinder("cone"+i,{ 
                diameterTop: 0, diameterBottom: 2.4 - i*0.6, height:2.2,
                tessellation: 8
            }, scene);
            cone.material = matGrass;
            cone.position.y = (i*1) + 1*scale;
            foliage.push(cone);
        }
        const tree = BABYLON.Mesh.MergeMeshes([trunk, ...foliage], true);
        tree.position.set(x, grassTop.position.y + 1*scale, z);
        tree.scaling.scaleInPlace(scale);
        tree.receiveShadows = true; shadowGen.addShadowCaster(tree);
    }
    for(let i=0;i<15;i++){
        makePine(rng()*20, rng()*20, Math.random()*0.5+0.8);
    }

    /* -------------------------------------------------
       9. Animated extras (optional)
    ---------------------------------------------------*/
    scene.registerBeforeRender(()=> wheel.rotate(BABYLON.Axis.X, 0.03, BABYLON.Space.LOCAL));

    /* enable shadows on terrain elements */
    [grassTop, cliffRing, islandBase].forEach(m=>m.receiveShadows=true);

    return scene;
};

const scene = createScene();
engine.runRenderLoop(()=> scene.render() );
window.addEventListener("resize", ()=> engine.resize());
</script>
</body>
</html>
