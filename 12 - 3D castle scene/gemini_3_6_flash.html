<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floating Island Diorama - Babylon.js</title>
    <!-- Babylon.js & GUI CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111420;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<script>
window.addEventListener('DOMContentLoaded', function () {
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

    const createScene = function () {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.06, 0.08, 0.14, 1.0);

        // --- Orbit Camera ---
        const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 3, Math.PI / 3.2, 85, new BABYLON.Vector3(0, 0, 0), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 20;
        camera.upperRadiusLimit = 150;
        camera.lowerBetaLimit = 0.1;
        camera.upperBetaLimit = Math.PI / 2 - 0.05;
        camera.useAutoRotationBehavior = true;
        camera.autoRotationBehavior.idleRotationSpeed = 0.08;

        // --- Soft Tabletop Lighting ---
        const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
        hemiLight.intensity = 0.6;
        hemiLight.groundColor = new BABYLON.Color3(0.2, 0.15, 0.25);
        hemiLight.diffuse = new BABYLON.Color3(1.0, 0.95, 0.85);

        const sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5, -1, -0.6), scene);
        sunLight.position = new BABYLON.Vector3(30, 60, 30);
        sunLight.intensity = 1.2;
        sunLight.diffuse = new BABYLON.Color3(1.0, 0.9, 0.75);

        // Shadows
        const shadowGenerator = new BABYLON.ShadowGenerator(2048, sunLight);
        shadowGenerator.useBlurExponentialShadowMap = true;
        shadowGenerator.blurKernel = 32;

        // --- Materials ---
        const matGrass = new BABYLON.StandardMaterial("grass", scene);
        matGrass.diffuseColor = new BABYLON.Color3(0.35, 0.65, 0.25);
        matGrass.specularColor = new BABYLON.Color3(0.05, 0.1, 0.05);

        const matRock = new BABYLON.StandardMaterial("rock", scene);
        matRock.diffuseColor = new BABYLON.Color3(0.38, 0.35, 0.38);
        matRock.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

        const matCastleStone = new BABYLON.StandardMaterial("castleStone", scene);
        matCastleStone.diffuseColor = new BABYLON.Color3(0.6, 0.58, 0.62);

        const matRoofRed = new BABYLON.StandardMaterial("roofRed", scene);
        matRoofRed.diffuseColor = new BABYLON.Color3(0.75, 0.25, 0.18);

        const matRoofBlue = new BABYLON.StandardMaterial("roofBlue", scene);
        matRoofBlue.diffuseColor = new BABYLON.Color3(0.2, 0.35, 0.65);

        const matWood = new BABYLON.StandardMaterial("wood", scene);
        matWood.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);

        const matRiver = new BABYLON.StandardMaterial("river", scene);
        matRiver.diffuseColor = new BABYLON.Color3(0.1, 0.7, 0.75);
        matRiver.specularColor = new BABYLON.Color3(0.8, 1.0, 1.0);
        matRiver.alpha = 0.85;

        const matFoliage = new BABYLON.StandardMaterial("foliage", scene);
        matFoliage.diffuseColor = new BABYLON.Color3(0.15, 0.45, 0.2);

        // --- Floating Island Base ---
        const islandTop = BABYLON.MeshBuilder.CreateCylinder("islandTop", { diameter: 60, height: 4, tessellation: 12 }, scene);
        islandTop.position.y = 0;
        islandTop.material = matGrass;
        islandTop.receiveShadows = true;

        const islandBottom = BABYLON.MeshBuilder.CreateCone("islandBottom", { diameterTop: 60, diameterBottom: 2, height: 35, tessellation: 12 }, scene);
        islandBottom.position.y = -19.5;
        islandBottom.material = matRock;

        // Sub-rocky details underneath
        for (let i = 0; i < 16; i++) {
            const angle = (i / 16) * Math.PI * 2;
            const r = 18 + Math.random() * 8;
            const rock = BABYLON.MeshBuilder.CreatePolyhedron("rockDetail", { type: 1, size: 3 + Math.random() * 4 }, scene);
            rock.position = new BABYLON.Vector3(Math.cos(angle) * r, -4 - Math.random() * 10, Math.sin(angle) * r);
            rock.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());
            rock.material = matRock;
        }

        // --- River & Waterfall ---
        const riverPath = [
            new BABYLON.Vector3(-2, 2.05, 28),
            new BABYLON.Vector3(-3, 2.05, 15),
            new BABYLON.Vector3(-8, 2.05, 0),
            new BABYLON.Vector3(-18, 2.05, -12),
            new BABYLON.Vector3(-28, 2.05, -18)
        ];

        const river = BABYLON.MeshBuilder.CreateRibbon("river", {
            pathArray: [
                riverPath.map(p => p.add(new BABYLON.Vector3(-2.5, 0, 2.5))),
                riverPath.map(p => p.add(new BABYLON.Vector3(2.5, 0, -2.5)))
            ]
        }, scene);
        river.material = matRiver;

        // Waterfall edge mesh
        const waterfall = BABYLON.MeshBuilder.CreatePlane("waterfall", { width: 5, height: 18 }, scene);
        waterfall.position = new BABYLON.Vector3(-28.5, -7, -18.5);
        waterfall.rotation.y = Math.PI / 4;
        waterfall.material = matRiver;

        // --- Central Medieval Castle ---
        const castleGroup = new BABYLON.TransformNode("castle", scene);
        castleGroup.position = new BABYLON.Vector3(0, 2, 0);

        // Keep
        const keep = BABYLON.MeshBuilder.CreateBox("keep", { width: 12, height: 14, depth: 10 }, scene);
        keep.position.y = 7;
        keep.material = matCastleStone;
        keep.parent = castleGroup;
        shadowGenerator.addShadowCaster(keep);

        const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", { diameterTop: 0, diameterBottom: 14, height: 6, tessellation: 4 }, scene);
        keepRoof.position.y = 17;
        keepRoof.rotation.y = Math.PI / 4;
        keepRoof.material = matRoofBlue;
        keepRoof.parent = castleGroup;

        // Corner Towers
        const towerPos = [
            { x: -7, z: -6 }, { x: 7, z: -6 },
            { x: -7, z: 6 }, { x: 7, z: 6 }
        ];

        towerPos.forEach((pos, idx) => {
            const tower = BABYLON.MeshBuilder.CreateCylinder("tower" + idx, { diameter: 4.5, height: 16, tessellation: 12 }, scene);
            tower.position = new BABYLON.Vector3(pos.x, 8, pos.z);
            tower.material = matCastleStone;
            tower.parent = castleGroup;
            shadowGenerator.addShadowCaster(tower);

            const roof = BABYLON.MeshBuilder.CreateCone("towerRoof" + idx, { diameter: 5.5, height: 5, tessellation: 12 }, scene);
            roof.position = new BABYLON.Vector3(pos.x, 18.5, pos.z);
            roof.material = matRoofBlue;
            roof.parent = castleGroup;
        });

        // Gatehouse
        const gate = BABYLON.MeshBuilder.CreateBox("gate", { width: 6, height: 7, depth: 4 }, scene);
        gate.position = new BABYLON.Vector3(0, 3.5, 6);
        gate.material = matCastleStone;
        gate.parent = castleGroup;

        const arch = BABYLON.MeshBuilder.CreateBox("arch", { width: 2.5, height: 4, depth: 4.2 }, scene);
        arch.position = new BABYLON.Vector3(0, 2, 6);
        const archMat = new BABYLON.StandardMaterial("archMat", scene);
        archMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
        arch.material = archMat;
        arch.parent = castleGroup;

        // --- Medieval Village ---
        function createHouse(x, z, rot, isTavern = false) {
            const house = new BABYLON.TransformNode("house", scene);
            house.position = new BABYLON.Vector3(x, 2, z);
            house.rotation.y = rot;

            const scale = isTavern ? 1.4 : 1.0;

            const body = BABYLON.MeshBuilder.CreateBox("hBody", { width: 3 * scale, height: 3 * scale, depth: 4 * scale }, scene);
            body.position.y = (1.5) * scale;
            body.material = matWood;
            body.parent = house;
            shadowGenerator.addShadowCaster(body);

            const roof = BABYLON.MeshBuilder.CreateCylinder("hRoof", { diameterTop: 0, diameterBottom: 4.5 * scale, height: 2.5 * scale, tessellation: 4 }, scene);
            roof.position.y = (3 + 1.25) * scale;
            roof.rotation.y = Math.PI / 4;
            roof.scaling.z = 1.1;
            roof.material = isTavern ? matRoofBlue : matRoofRed;
            roof.parent = house;

            return house;
        }

        // Houses around village square
        createHouse(14, 8, -0.4);
        createHouse(18, 2, -1.2);
        createHouse(12, -8, 0.5);
        createHouse(18, -10, 0.8);
        createHouse(8, 14, 2.1, true); // Tavern

        // Market Stalls
        for (let i = 0; i < 3; i++) {
            const stall = BABYLON.MeshBuilder.CreateBox("stall", { width: 2, height: 1.2, depth: 1.5 }, scene);
            stall.position = new BABYLON.Vector3(12 + i * 2.5, 2.6, -2 + i * 2);
            stall.material = matWood;

            const cloth = BABYLON.MeshBuilder.CreateBox("cloth", { width: 2.2, height: 0.2, depth: 1.7 }, scene);
            cloth.position = new BABYLON.Vector3(12 + i * 2.5, 3.8, -2 + i * 2);
            const clothMat = new BABYLON.StandardMaterial("clothMat", scene);
            clothMat.diffuseColor = i % 2 === 0 ? new BABYLON.Color3(0.8, 0.2, 0.2) : new BABYLON.Color3(0.8, 0.7, 0.2);
            cloth.material = clothMat;
        }

        // --- Riverside Mill ---
        const millGroup = new BABYLON.TransformNode("mill", scene);
        millGroup.position = new BABYLON.Vector3(-12, 2, -10);

        const millBody = BABYLON.MeshBuilder.CreateCylinder("millBody", { diameter: 4.5, height: 6, tessellation: 8 }, scene);
        millBody.position.y = 3;
        millBody.material = matCastleStone;
        millGroup.addChild(millBody);

        const millRoof = BABYLON.MeshBuilder.CreateCone("millRoof", { diameter: 5.5, height: 3, tessellation: 8 }, scene);
        millRoof.position.y = 7.5;
        millRoof.material = matRoofRed;
        millGroup.addChild(millRoof);

        // Water wheel
        const wheel = BABYLON.MeshBuilder.CreateCylinder("wheel", { diameter: 4, height: 0.6, tessellation: 12 }, scene);
        wheel.position = new BABYLON.Vector3(-2.6, 2, 0);
        wheel.rotation.z = Math.PI / 2;
        wheel.material = matWood;
        wheel.parent = millGroup;

        // --- Wooden Bridges ---
        function createBridge(x, z, rot) {
            const bridge = BABYLON.MeshBuilder.CreateBox("bridge", { width: 3.5, height: 0.4, depth: 6 }, scene);
            bridge.position = new BABYLON.Vector3(x, 2.3, z);
            bridge.rotation.y = rot;
            bridge.material = matWood;
            shadowGenerator.addShadowCaster(bridge);
        }

        createBridge(-5, 8, 0.6);
        createBridge(-22, -15, -0.8);

        // --- Ruined Watchtower ---
        const watchtower = new BABYLON.TransformNode("watchtower", scene);
        watchtower.position = new BABYLON.Vector3(-22, 2, 16);

        const tBase = BABYLON.MeshBuilder.CreateCylinder("wtBase", { diameter: 5, height: 10, tessellation: 8 }, scene);
        tBase.position.y = 5;
        tBase.material = matCastleStone;
        tBase.parent = watchtower;

        // Ruined top blocks
        for (let i = 0; i < 5; i++) {
            const rubble = BABYLON.MeshBuilder.CreateBox("rubble", { size: 1.2 }, scene);
            rubble.position = new BABYLON.Vector3(-22 + (Math.random() - 0.5) * 3, 2.5, 16 + (Math.random() - 0.5) * 3);
            rubble.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());
            rubble.material = matCastleStone;
        }

        // --- Pine Trees & Vegetation ---
        function createPineTree(x, z, scale = 1) {
            const tree = new BABYLON.TransformNode("tree", scene);
            tree.position = new BABYLON.Vector3(x, 2, z);

            const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { diameter: 0.6 * scale, height: 2 * scale }, scene);
            trunk.position.y = 1 * scale;
            trunk.material = matWood;
            trunk.parent = tree;

            for (let i = 0; i < 3; i++) {
                const foliage = BABYLON.MeshBuilder.CreateCone("foliage", { diameter: (3.5 - i * 0.8) * scale, height: (2.5 - i * 0.4) * scale, tessellation: 7 }, scene);
                foliage.position.y = (2 + i * 1.4) * scale;
                foliage.material = matFoliage;
                foliage.parent = tree;
                shadowGenerator.addShadowCaster(foliage);
            }
        }

        // Scatter trees
        const treeLocations = [
            { x: -15, z: 20 }, { x: -20, z: 22 }, { x: -10, z: 24 },
            { x: -24, z: 5 }, { x: -22, z: -4 }, { x: -15, z: -22 },
            { x: 5, z: -22 }, { x: 12, z: -20 }, { x: 22, z: -18 },
            { x: 22, z: 12 }, { x: 25, z: 2 }, { x: 18, z: 20 }
        ];

        treeLocations.forEach(loc => {
            createPineTree(loc.x, loc.z, 0.8 + Math.random() * 0.5);
        });

        // --- Waterfall Mist Particles ---
        const particleSystem = new BABYLON.ParticleSystem("particles", 500, scene);
        particleSystem.particleTexture = createMistTexture(scene);
        particleSystem.emitter = new BABYLON.Vector3(-28.5, -15, -18.5);
        particleSystem.minEmitBox = new BABYLON.Vector3(-2, 0, -2);
        particleSystem.maxEmitBox = new BABYLON.Vector3(2, 0, 2);

        particleSystem.color1 = new BABYLON.Color4(0.8, 0.95, 1.0, 0.4);
        particleSystem.color2 = new BABYLON.Color4(0.9, 1.0, 1.0, 0.2);
        particleSystem.colorDead = new BABYLON.Color4(1.0, 1.0, 1.0, 0.0);

        particleSystem.minSize = 1.5;
        particleSystem.maxSize = 3.5;
        particleSystem.minLifeTime = 1.0;
        particleSystem.maxLifeTime = 2.0;
        particleSystem.emitRate = 80;
        particleSystem.gravity = new BABYLON.Vector3(0, 0.5, 0);
        particleSystem.direction1 = new BABYLON.Vector3(-1, 1, -1);
        particleSystem.direction2 = new BABYLON.Vector3(1, 1.5, 1);
        particleSystem.minAngularSpeed = 0;
        particleSystem.maxAngularSpeed = Math.PI;
        particleSystem.start();

        // Procedural soft mist texture generator
        function createMistTexture(scene) {
            const dt = new BABYLON.DynamicTexture("dt", 64, scene, true);
            const ctx = dt.getContext();
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,0.8)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            dt.update();
            return dt;
        }

        // --- Animations ---
        scene.onBeforeRenderObservable.add(() => {
            const dt = engine.getDeltaTime() / 1000;
            // Rotate water wheel smoothly
            wheel.rotation.x += dt * 1.2;
        });

        return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(function () {
        scene.render();
    });

    window.addEventListener("resize", function () {
        engine.resize();
    });
});
</script>

</body>
</html>
