<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Island Diorama</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,Segoe UI,sans-serif; }
  #renderCanvas { width:100%; height:100%; touch-action:none; display:block; }
  #info {
    position:absolute; top:14px; left:14px; color:#fff;
    background:rgba(20,25,40,.55); backdrop-filter: blur(8px);
    padding:10px 14px; border-radius:10px; font-size:12px; line-height:1.5;
    pointer-events:none; border:1px solid rgba(255,255,255,.1);
  }
  #info b { color:#ffd27a; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="info">
  <b>◆ Floating Isle — Diorama</b><br>
  Drag to rotate • Wheel to zoom • Right-drag to pan
</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true, { stencil:true, preserveDrawingBuffer:true, antialias:true });

  const createScene = () => {
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.58, 0.76, 0.92, 1.0);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.008;
    scene.fogColor = new BABYLON.Color3(0.72, 0.82, 0.93);
    scene.ambientColor = new BABYLON.Color3(0.35, 0.38, 0.45);

    // ---------- Camera ----------
    const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI/2.2, Math.PI/3.2, 55, new BABYLON.Vector3(0, 4, 0), scene);
    cam.lowerRadiusLimit = 22;
    cam.upperRadiusLimit = 90;
    cam.lowerBetaLimit = 0.2;
    cam.upperBetaLimit = Math.PI/2.05;
    cam.attachControl(canvas, true);
    cam.wheelPrecision = 40;
    cam.panningSensibility = 200;

    // Slow auto-rotate when idle
    let idleTime = 0;
    scene.onPointerObservable.add(() => idleTime = 0);
    scene.registerBeforeRender(() => {
      idleTime += engine.getDeltaTime() / 1000;
      if (idleTime > 2.5) cam.alpha += 0.0006;
    });

    // ---------- Lighting ----------
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.2, 1, 0.2), scene);
    hemi.intensity = 0.85;
    hemi.diffuse = new BABYLON.Color3(1.0, 0.96, 0.9);
    hemi.groundColor = new BABYLON.Color3(0.3, 0.35, 0.5);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.6, -1, 0.3), scene);
    sun.position = new BABYLON.Vector3(30, 50, -15);
    sun.intensity = 1.1;
    sun.diffuse = new BABYLON.Color3(1.0, 0.92, 0.78);

    // Warm fill from opposite side
    const fill = new BABYLON.DirectionalLight("fill", new BABYLON.Vector3(0.7, -0.4, -0.5), scene);
    fill.intensity = 0.35;
    fill.diffuse = new BABYLON.Color3(1.0, 0.75, 0.55);

    // Shadows
    const sg = new BABYLON.ShadowGenerator(2048, sun);
    sg.useBlurExponentialShadowMap = true;
    sg.blurKernel = 24;
    sg.darkness = 0.35;

    // ---------- Helpers ----------
    const mat = (name, color, spec=0.15, rough=0.8) => {
      const m = new BABYLON.StandardMaterial(name, scene);
      m.diffuseColor = color;
      m.specularColor = new BABYLON.Color3(spec, spec, spec);
      m.specularPower = 16;
      m.freeze();
      return m;
    };
    const M = {
      stone:    mat("stone",    new BABYLON.Color3(0.58, 0.56, 0.52), 0.2),
      stoneD:   mat("stoneD",   new BABYLON.Color3(0.42, 0.40, 0.38), 0.1),
      stoneR:   mat("stoneR",   new BABYLON.Color3(0.72, 0.66, 0.55), 0.25), // roof tiles
      wood:     mat("wood",     new BABYLON.Color3(0.55, 0.38, 0.22), 0.1),
      woodD:    mat("woodD",    new BABYLON.Color3(0.38, 0.24, 0.14), 0.1),
      timber:   mat("timber",   new BABYLON.Color3(0.30, 0.20, 0.13), 0.1),
      plaster:  mat("plaster",  new BABYLON.Color3(0.92, 0.88, 0.78), 0.1),
      plasterB: mat("plasterB", new BABYLON.Color3(0.85, 0.78, 0.62), 0.1),
      grass:    mat("grass",    new BABYLON.Color3(0.35, 0.55, 0.22), 0.05),
      grassB:   mat("grassB",   new BABYLON.Color3(0.28, 0.48, 0.18), 0.05),
      dirt:     mat("dirt",     new BABYLON.Color3(0.45, 0.34, 0.22), 0.05),
      rock:     mat("rock",     new BABYLON.Color3(0.48, 0.45, 0.42), 0.15),
      rockD:    mat("rockD",    new BABYLON.Color3(0.32, 0.30, 0.28), 0.15),
      water:    mat("water",    new BABYLON.Color3(0.22, 0.78, 0.85), 0.6),
      pine:     mat("pine",     new BABYLON.Color3(0.18, 0.42, 0.22), 0.05),
      pineB:    mat("pineB",    new BABYLON.Color3(0.12, 0.34, 0.18), 0.05),
      red:      mat("red",      new BABYLON.Color3(0.75, 0.22, 0.20), 0.3),
      gold:     mat("gold",     new BABYLON.Color3(0.90, 0.75, 0.25), 0.7),
      window:   mat("window",   new BABYLON.Color3(1.0, 0.85, 0.45), 0.1),
      path:     mat("path",     new BABYLON.Color3(0.62, 0.55, 0.42), 0.05),
      fabric:   mat("fabric",   new BABYLON.Color3(0.65, 0.20, 0.30), 0.1),
      fabricG:  mat("fabricG",  new BABYLON.Color3(0.25, 0.45, 0.28), 0.1),
      fabricY:  mat("fabricY",  new BABYLON.Color3(0.85, 0.72, 0.22), 0.1),
      fruit:    mat("fruit",    new BABYLON.Color3(0.80, 0.25, 0.20), 0.2),
      veg:      mat("veg",      new BABYLON.Color3(0.40, 0.58, 0.20), 0.2),
      metal:    mat("metal",    new BABYLON.Color3(0.30, 0.30, 0.32), 0.7),
    };

    // emissive warm windows
    M.window.emissiveColor = new BABYLON.Color3(0.8, 0.55, 0.15);

    const addShadow = (m) => { sg.addShadowCaster(m, true); };

    // ---------- Floating Island Base ----------
    // Top grassy plateau + conical rocky underside
    const island = new BABYLON.Mesh("island", scene);

    // Grassy top (irregular cylinder with subdivisions)
    const topGeo = BABYLON.MeshBuilder.CreateCylinder("top", {
      diameterTop: 48, diameterBottom: 48, height: 2, tessellation: 72
    }, scene);
    topGeo.material = M.grass;
    topGeo.position.y = 1;
    addShadow(topGeo);
    topGeo.parent = island;

    // Underside rocky cone (inverted)
    const underside = BABYLON.MeshBuilder.CreateCylinder("under", {
      diameterTop: 48, diameterBottom: 6, height: 22, tessellation: 48
    }, scene);
    underside.material = M.rock;
    underside.position.y = -11;
    addShadow(underside);
    underside.parent = island;

    // Add rocky lumps underneath
    for (let i = 0; i < 28; i++) {
      const r = 8 + Math.random() * 14;
      const a = Math.random() * Math.PI * 2;
      const y = -2 - Math.random() * 18;
      const size = 1.5 + Math.random() * 3.5;
      const lump = BABYLON.MeshBuilder.CreateSphere("lump", { diameter: size, segments: 8 }, scene);
      lump.material = Math.random() > 0.5 ? M.rock : M.rockD;
      lump.position = new BABYLON.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
      lump.scaling = new BABYLON.Vector3(1 + Math.random()*0.6, 0.6 + Math.random()*0.8, 1 + Math.random()*0.6);
      lump.parent = island;
    }

    // Grass tufts around plateau rim
    for (let i = 0; i < 80; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 22 + Math.random() * 4;
      const tuft = BABYLON.MeshBuilder.CreateCylinder("tuft", {
        diameterTop: 0.1, diameterBottom: 0.6, height: 0.6, tessellation: 6
      }, scene);
      tuft.material = Math.random() > 0.4 ? M.grass : M.grassB;
      tuft.position = new BABYLON.Vector3(Math.cos(a)*r, 2.2, Math.sin(a)*r);
      tuft.parent = island;
    }

    // River carving through island (turquoise strip)
    const riverPath = [];
    for (let t = -1; t <= 1; t += 0.05) {
      const x = t * 22;
      const z = Math.sin(t * 2.2) * 3 + 4;
      riverPath.push(new BABYLON.Vector3(x, 0, z));
    }
    // Create river as a ribbon following path
    const riverWidth = 3.5;
    const ribbonPath = [];
    for (let i = 0; i < riverPath.length; i++) {
      const p = riverPath[i];
      const next = riverPath[Math.min(i+1, riverPath.length-1)];
      const dir = next.subtract(p).normalize();
      const perp = new BABYLON.Vector3(-dir.z, 0, dir.x).scale(riverWidth/2);
      ribbonPath.push([p.subtract(perp), p.add(perp)]);
    }
    const river = BABYLON.MeshBuilder.CreateRibbon("river", { pathArray: ribbonPath, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
    river.material = M.water;
    river.position.y = 2.05;
    river.parent = island;

    // Waterfall from river edge
    const waterfall = BABYLON.MeshBuilder.CreatePlane("wf", { width: 4, height: 14 }, scene);
    waterfall.material = M.water;
    waterfall.position = new BABYLON.Vector3(22, -4, 4);
    waterfall.rotation.y = Math.PI/2;
    waterfall.parent = island;

    const wf2 = BABYLON.MeshBuilder.CreatePlane("wf2", { width: 3, height: 10 }, scene);
    wf2.material = M.water;
    wf2.position = new BABYLON.Vector3(-21, -3, 5);
    wf2.rotation.y = -Math.PI/2;
    wf2.parent = island;

    // Animate waterfalls (scroll UV)
    scene.registerBeforeRender(() => {
      const t = performance.now() * 0.0006;
      if (waterfall.material.getTexture) {}
      // simple: tint pulsing via emissive
      waterfall.material.emissiveColor = new BABYLON.Color3(0.15 + Math.sin(t)*0.05, 0.35 + Math.sin(t)*0.05, 0.45);
      wf2.material.emissiveColor = new BABYLON.Color3(0.15 + Math.cos(t)*0.05, 0.35 + Math.cos(t)*0.05, 0.45);
    });

    // Waterfall splash particles at bottom (simple small spheres)
    for (let i = 0; i < 12; i++) {
      const s = BABYLON.MeshBuilder.CreateSphere("splash", { diameter: 0.6 + Math.random()*0.5, segments:6 }, scene);
      s.material = M.water;
      s.position = new BABYLON.Vector3(22 + (Math.random()-0.5)*2, -10 - Math.random()*2, 4 + (Math.random()-0.5)*2);
      s.parent = island;
    }

    // Steep cliffs along edges (rocky walls)
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2 + Math.random() * 0.2;
      const r = 22 + Math.random() * 1.5;
      const cliff = BABYLON.MeshBuilder.CreateBox("cliff", { width: 4 + Math.random()*3, depth: 2 + Math.random()*1.5, height: 4 + Math.random()*3 }, scene);
      cliff.material = Math.random() > 0.5 ? M.rock : M.rockD;
      cliff.position = new BABYLON.Vector3(Math.cos(a)*r, 1.5 + Math.random(), Math.sin(a)*r);
      cliff.rotation.y = a + Math.PI/2;
      addShadow(cliff);
      cliff.parent = island;
    }

    // ---------- Castle (center) ----------
    const castle = new BABYLON.TransformNode("castle", scene);
    castle.parent = island;
    castle.position = new BABYLON.Vector3(-3, 2, -6);

    // Keep (main tower)
    const keep = BABYLON.MeshBuilder.CreateBox("keep", { width: 8, depth: 8, height: 10 }, scene);
    keep.material = M.stone;
    keep.position.y = 7;
    addShadow(keep); keep.parent = castle;

    // Keep roof (pyramid)
    const keepRoof = BABYLON.MeshBuilder.CreateCylinder("keepRoof", {
      diameterTop: 0, diameterBottom: 11, height: 5, tessellation: 4
    }, scene);
    keepRoof.material = M.stoneR;
    keepRoof.position.y = 14.5;
    keepRoof.rotation.y = Math.PI/4;
    addShadow(keepRoof); keepRoof.parent = castle;

    // Flag pole on keep
    const pole = BABYLON.MeshBuilder.CreateCylinder("pole", { diameter: 0.2, height: 3 }, scene);
    pole.material = M.woodD;
    pole.position.y = 17.5;
    pole.parent = castle;
    const flag = BABYLON.MeshBuilder.CreatePlane("flag", { width: 2, height: 1.2 }, scene);
    flag.material = M.red;
    flag.position = new BABYLON.Vector3(1, 18, 0);
    flag.parent = castle;

    // 4 corner towers
    const towerPositions = [[-5,-5],[5,-5],[-5,5],[5,5]];
    towerPositions.forEach(([x,z]) => {
      const tower = BABYLON.MeshBuilder.CreateCylinder("tower", { diameter: 3.2, height: 9, tessellation: 16 }, scene);
      tower.material = M.stone;
      tower.position = new BABYLON.Vector3(x, 6.5, z);
      addShadow(tower); tower.parent = castle;

      const roof = BABYLON.MeshBuilder.CreateCylinder("tRoof", {
        diameterTop: 0, diameterBottom: 3.8, height: 4, tessellation: 16
      }, scene);
      roof.material = M.stoneR;
      roof.position = new BABYLON.Vector3(x, 13, z);
      addShadow(roof); roof.parent = castle;

      // Battlements
      for (let i = 0; i < 6; i++) {
        const ang = (i/6) * Math.PI * 2;
        const merlon = BABYLON.MeshBuilder.CreateBox("merlon", { width: 0.5, depth: 0.5, height: 0.7 }, scene);
        merlon.material = M.stoneD;
        merlon.position = new BABYLON.Vector3(x + Math.cos(ang)*1.6, 11.3, z + Math.sin(ang)*1.6);
        merlon.parent = castle;
      }
    });

    // Walls connecting towers
    const wallSeg = (x1,z1,x2,z2) => {
      const dx = x2-x1, dz = z2-z1;
      const len = Math.sqrt(dx*dx + dz*dz);
      const wall = BABYLON.MeshBuilder.CreateBox("wall", { width: len, depth: 1, height: 6 }, scene);
      wall.material = M.stone;
      wall.position = new BABYLON.Vector3((x1+x2)/2, 5, (z1+z2)/2);
      wall.rotation.y = Math.atan2(dz, dx);
      addShadow(wall); wall.parent = castle;
    };
    wallSeg(-5,-5, 5,-5);
    wallSeg(5,-5, 5,5);
    wallSeg(-5,5, 5,5);
    wallSeg(-5,-5, -5,5);

    // Gatehouse
    const gate = BABYLON.MeshBuilder.CreateBox("gate", { width: 4, depth: 2, height: 7 }, scene);
    gate.material = M.stoneD;
    gate.position = new BABYLON.Vector3(0, 5.5, -5);
    addShadow(gate); gate.parent = castle;
    const gateArch = BABYLON.MeshBuilder.CreateBox("gateArch", { width: 2, depth: 2.2, height: 3.5 }, scene);
    gateArch.material = M.woodD;
    gateArch.position = new BABYLON.Vector3(0, 3.7, -5);
    gateArch.parent = castle;

    // Castle windows (warm glowing)
    for (let y = 0; y < 3; y++) {
      for (let side = 0; side < 4; side++) {
        const w = BABYLON.MeshBuilder.CreatePlane("cw", { width: 0.4, height: 0.8 }, scene);
        w.material = M.window;
        const angle = (side/4) * Math.PI * 2;
        w.position = new BABYLON.Vector3(Math.cos(angle)*4.05, 5 + y*2.5, Math.sin(angle)*4.05);
        w.rotation.y = angle + Math.PI;
        w.parent = castle;
      }
    }

    // Courtyard path
    const court = BABYLON.MeshBuilder.CreateDisc("court", { radius: 6, tessellation: 24 }, scene);
    court.material = M.path;
    court.rotation.x = Math.PI/2;
    court.position.y = 2.02;
    court.parent = castle;

    // ---------- Village Houses ----------
    function makeHouse(x, z, rotY, scale=1, variant=0) {
      const house = new BABYLON.TransformNode("house", scene);
      house.parent = island;
      house.position = new BABYLON.Vector3(x, 2, z);
      house.rotation.y = rotY;
      house.scaling = new BABYLON.Vector3(scale, scale, scale);

      const plaster = variant === 1 ? M.plasterB : M.plaster;
      const base = BABYLON.MeshBuilder.CreateBox("hbase", { width: 3, depth: 2.5, height: 2.2 }, scene);
      base.material = plaster;
      base.position.y = 1.1;
      addShadow(base); base.parent = house;

      // Timber beams
      const beams = [
        [0, 1.1, 1.26, 3.1, 0.08, 0.08],
        [0, 2.2, 1.26, 3.1, 0.08, 0.08],
        [-1.51, 1.1, 0, 0.08, 2.2, 0.08],
        [1.51, 1.1, 0, 0.08, 2.2, 0.08],
        [0, 1.1, 0, 3.1, 0.08, 0.08]
      ];
      beams.forEach(([px,py,pz,w,h,d]) => {
        const b = BABYLON.MeshBuilder.CreateBox("beam", { width: w, height: h, depth: d }, scene);
        b.material = M.timber;
        b.position = new BABYLON.Vector3(px, py, pz);
        b.parent = house;
      });

      // Peaked roof (prism using two planes or a cone)
      const roof = BABYLON.MeshBuilder.CreateCylinder("hroof", {
        diameterTop: 0, diameterBottom: 4.2, height: 1.8, tessellation: 4
      }, scene);
      roof.material = variant === 0 ? M.stoneR : M.woodD;
      roof.position.y = 3.1;
      roof.rotation.y = Math.PI/4;
      addShadow(roof); roof.parent = house;

      // Door
      const door = BABYLON.MeshBuilder.CreatePlane("door", { width: 0.5, height: 0.9 }, scene);
      door.material = M.woodD;
      door.position = new BABYLON.Vector3(0, 0.45, 1.26);
      door.parent = house;

      // Window (glowing)
      const win = BABYLON.MeshBuilder.CreatePlane("win", { width: 0.4, height: 0.4 }, scene);
      win.material = M.window;
      win.position = new BABYLON.Vector3(0.8, 1.4, 1.26);
      win.parent = house;

      // Chimney
      const chimney = BABYLON.MeshBuilder.CreateBox("chim", { width: 0.4, depth: 0.4, height: 1.2 }, scene);
      chimney.material = M.stoneD;
      chimney.position = new BABYLON.Vector3(-0.9, 3.5, -0.5);
      addShadow(chimney); chimney.parent = house;
    }

    // Place village around castle
    const houseSpots = [
      [8, -4, -0.3, 1, 0],
      [10, -1, -0.5, 1, 1],
      [9, 2, -0.2, 0.95, 0],
      [12, 1, -0.4, 1.05, 1],
      [6, 0, 0.2, 0.9, 0],
      [-10, -8, 0.3, 1, 1],
      [-13, -6, 0.1, 1.05, 0],
      [-9, -12, 0.4, 0.95, 1],
      [-5, 10, 0.8, 1, 0],
      [-8, 12, 0.6, 1, 1],
      [4, 10, 1.2, 0.95, 1],
      [0, 12, 1.0, 1.05, 0]
    ];
    houseSpots.forEach(h => makeHouse(h[0], h[1], h[2], h[3], h[4]));

    // Tavern (larger building with sign)
    const tavern = new BABYLON.TransformNode("tavern", scene);
    tavern.parent = island;
    tavern.position = new BABYLON.Vector3(7, 2, -8);
    tavern.rotation.y = 0.2;
    const tvBase = BABYLON.MeshBuilder.CreateBox("tvbase", { width: 5, depth: 4, height: 3 }, scene);
    tvBase.material = M.plaster;
    tvBase.position.y = 1.5;
    addShadow(tvBase); tvBase.parent = tavern;
    // Second floor
    const tv2 = BABYLON.MeshBuilder.CreateBox("tv2", { width: 5.2, depth: 4.2, height: 2.5 }, scene);
    tv2.material = M.plasterB;
    tv2.position.y = 4.25;
    addShadow(tv2); tv2.parent = tavern;
    const tvRoof = BABYLON.MeshBuilder.CreateCylinder("tvroof", {
      diameterTop: 0, diameterBottom: 6.5, height: 2.5, tessellation: 4
    }, scene);
    tvRoof.material = M.woodD;
    tvRoof.position.y = 6.75;
    tvRoof.rotation.y = Math.PI/4;
    addShadow(tvRoof); tvRoof.parent = tavern;
    // Sign post
    const signPost = BABYLON.MeshBuilder.CreateCylinder("sp", { diameter: 0.2, height: 2.5 }, scene);
    signPost.material = M.woodD;
    signPost.position = new BABYLON.Vector3(3, 1.25, 2.1);
    signPost.parent = tavern;
    const sign = BABYLON.MeshBuilder.CreateBox("sign", { width: 1.2, height: 0.7, depth: 0.08 }, scene);
    sign.material = M.wood;
    sign.position = new BABYLON.Vector3(3, 2.5, 2.1);
    sign.parent = tavern;
    // Tavern windows
    for (let i = 0; i < 3; i++) {
      const w = BABYLON.MeshBuilder.CreatePlane("tw", { width: 0.5, height: 0.5 }, scene);
      w.material = M.window;
      w.position = new BABYLON.Vector3(-1.5 + i*1.5, 4.2, 2.05);
      w.parent = tavern;
    }

    // Market stalls
    function makeStall(x, z, rotY, fabric) {
      const stall = new BABYLON.TransformNode("stall", scene);
      stall.parent = island;
      stall.position = new BABYLON.Vector3(x, 2, z);
      stall.rotation.y = rotY;
      // Posts
      for (let px of [-0.8, 0.8]) {
        for (let pz of [-0.6, 0.6]) {
          const p = BABYLON.MeshBuilder.CreateCylinder("p", { diameter: 0.12, height: 1.8 }, scene);
          p.material = M.woodD;
          p.position = new BABYLON.Vector3(px, 0.9, pz);
          p.parent = stall;
        }
      }
      // Counter
      const counter = BABYLON.MeshBuilder.CreateBox("c", { width: 1.8, depth: 1.2, height: 0.2 }, scene);
      counter.material = M.wood;
      counter.position.y = 0.9;
      addShadow(counter); counter.parent = stall;
      // Awning
      const awn = BABYLON.MeshBuilder.CreateBox("a", { width: 2.2, depth: 1.6, height: 0.1 }, scene);
      awn.material = fabric;
      awn.position = new BABYLON.Vector3(0, 1.9, -0.2);
      awn.rotation.x = 0.15;
      addShadow(awn); awn.parent = stall;
      // Goods
      for (let i = 0; i < 5; i++) {
        const g = BABYLON.MeshBuilder.CreateSphere("g", { diameter: 0.25, segments: 6 }, scene);
        g.material = fabric === M.fabric ? M.fruit : M.veg;
        g.position = new BABYLON.Vector3(-0.6 + i*0.3, 1.1, 0);
        g.parent = stall;
      }
    }
    makeStall(-2, 5, 0.3, M.fabric);
    makeStall(1, 7, 0.1, M.fabricG);
    makeStall(4, 6, -0.2, M.fabricY);
    makeStall(-5, 7, 0.5, M.fabric);

    // Riverside Mill
    const mill = new BABYLON.TransformNode("mill", scene);
    mill.parent = island;
    mill.position = new BABYLON.Vector3(-10, 2, 4);
    mill.rotation.y = -0.3;
    const millBody = BABYLON.MeshBuilder.CreateBox("mb", { width: 3.5, depth: 3, height: 3.5 }, scene);
    millBody.material = M.stone;
    millBody.position.y = 1.75;
    addShadow(millBody); millBody.parent = mill;
    const millRoof = BABYLON.MeshBuilder.CreateCylinder("mr", {
      diameterTop: 0, diameterBottom: 4.5, height: 2, tessellation: 4
    }, scene);
    millRoof.material = M.woodD;
    millRoof.position.y = 4.5;
    millRoof.rotation.y = Math.PI/4;
    addShadow(millRoof); millRoof.parent = mill;

    // Waterwheel
    const wheel = new BABYLON.TransformNode("wheel", scene);
    wheel.parent = mill;
    wheel.position = new BABYLON.Vector3(-1.8, 1.2, 0);
    wheel.rotation.z = Math.PI/2;
    const hub = BABYLON.MeshBuilder.CreateTorus("hub", { diameter: 2.5, thickness: 0.25, tessellation: 32 }, scene);
    hub.material = M.woodD;
    hub.parent = wheel;
    const hub2 = BABYLON.MeshBuilder.CreateTorus("hub2", { diameter: 2, thickness: 0.2, tessellation: 32 }, scene);
    hub2.material = M.wood;
    hub2.parent = wheel;
    // Spokes
    for (let i = 0; i < 8; i++) {
      const ang = (i/8) * Math.PI * 2;
      const spoke = BABYLON.MeshBuilder.CreateBox("sp", { width: 0.15, height: 2.4, depth: 0.15 }, scene);
      spoke.material = M.woodD;
      spoke.rotation.z = ang;
      spoke.parent = wheel;
    }
    // Paddles
    for (let i = 0; i < 12; i++) {
      const ang = (i/12) * Math.PI * 2;
      const pad = BABYLON.MeshBuilder.CreateBox("pd", { width: 0.5, height: 0.08, depth: 0.3 }, scene);
      pad.material = M.wood;
      pad.position = new BABYLON.Vector3(Math.cos(ang)*1.25, Math.sin(ang)*1.25, 0);
      pad.rotation.z = ang;
      pad.parent = wheel;
    }
    scene.registerBeforeRender(() => {
      wheel.rotation.y += 0.015;
    });

    // ---------- Wooden Bridges ----------
    function makeBridge(x, z, rotY) {
      const bridge = new BABYLON.TransformNode("bridge", scene);
      bridge.parent = island;
      bridge.position = new BABYLON.Vector3(x, 2.2, z);
      bridge.rotation.y = rotY;
      const deck = BABYLON.MeshBuilder.CreateBox("deck", { width: 5, depth: 1.5, height: 0.2 }, scene);
      deck.material = M.wood;
      addShadow(deck); deck.parent = bridge;
      // Planks
      for (let i = 0; i < 8; i++) {
        const plank = BABYLON.MeshBuilder.CreateBox("pl", { width: 0.5, depth: 1.45, height: 0.05 }, scene);
        plank.material = M.woodD;
        plank.position = new BABYLON.Vector3(-2.1 + i*0.6, 0.11, 0);
        plank.parent = bridge;
      }
      // Rails
      for (let s of [-1, 1]) {
        const post = BABYLON.MeshBuilder.CreateCylinder("rp", { diameter: 0.15, height: 1 }, scene);
        post.material = M.woodD;
        post.position = new BABYLON.Vector3(2, 0.6, s*0.7);
        post.parent = bridge;
        const post2 = BABYLON.MeshBuilder.CreateCylinder("rp2", { diameter: 0.15, height: 1 }, scene);
        post2.material = M.woodD;
        post2.position = new BABYLON.Vector3(-2, 0.6, s*0.7);
        post2.parent = bridge;
        const rail = BABYLON.MeshBuilder.CreateBox("rail", { width: 5, depth: 0.08, height: 0.08 }, scene);
        rail.material = M.woodD;
        rail.position = new BABYLON.Vector3(0, 1.05, s*0.7);
        rail.parent = bridge;
      }
    }
    makeBridge(-5, 4.5, 0);
    makeBridge(10, 3, 0.1);

    // ---------- Pine Trees ----------
    function makeTree(x, z, scale=1) {
      const tree = new BABYLON.TransformNode("tree", scene);
      tree.parent = island;
      tree.position = new BABYLON.Vector3(x, 2, z);
      tree.scaling = new BABYLON.Vector3(scale, scale, scale);
      const trunk = BABYLON.MeshBuilder.CreateCylinder("tr", { diameter: 0.4, height: 2, tessellation: 8 }, scene);
      trunk.material = M.woodD;
      trunk.position.y = 1;
      addShadow(trunk); trunk.parent = tree;
      const layers = [
        { y: 2.2, d: 2.8, h: 1.8 },
        { y: 3.2, d: 2.2, h: 1.6 },
        { y: 4.1, d: 1.6, h: 1.4 },
        { y: 4.9, d: 1.0, h: 1.2 }
      ];
      layers.forEach(l => {
        const cone = BABYLON.MeshBuilder.CreateCylinder("cn", {
          diameterTop: 0, diameterBottom: l.d, height: l.h, tessellation: 12
        }, scene);
        cone.material = Math.random() > 0.5 ? M.pine : M.pineB;
        cone.position.y = l.y;
        addShadow(cone); cone.parent = tree;
      });
    }

    // Scatter trees avoiding castle & river
    const treeSpots = [
      [-18, -12], [-16, -10], [-20, -8], [-15, -15],
      [15, 8], [18, 6], [16, 12], [14, 14],
      [-14, 8], [-17, 10], [-19, 14],
      [18, -12], [16, -14], [20, -10],
      [-6, -14], [-2, -15], [3, -14], [8, -15],
      [-18, 0], [-16, 4], [-20, -4],
      [12, -8], [14, -6]
    ];
    treeSpots.forEach(s => makeTree(s[0], s[1], 0.8 + Math.random()*0.6));

    // Small bushes
    for (let i = 0; i < 30; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 6 + Math.random() * 16;
      const x = Math.cos(a)*r, z = Math.sin(a)*r;
      // avoid river line roughly
      if (Math.abs(z - (Math.sin((x/22)*2.2)*3 + 4)) < 3 && Math.abs(x) < 22) continue;
      const bush = BABYLON.MeshBuilder.CreateSphere("bush", { diameter: 0.8 + Math.random()*0.6, segments: 8 }, scene);
      bush.material = Math.random() > 0.5 ? M.pine : M.grassB;
      bush.position = new BABYLON.Vector3(x, 2.2, z);
      bush.scaling.y = 0.7;
      addShadow(bush); bush.parent = island;
    }

    // ---------- Ruined Watchtower at edge ----------
    const tower = new BABYLON.TransformNode("ruin", scene);
    tower.parent = island;
    tower.position = new BABYLON.Vector3(20, 2, -12);
    const tBody = BABYLON.MeshBuilder.CreateCylinder("tb", {
      diameterTop: 2.2, diameterBottom: 2.8, height: 7, tessellation: 12
    }, scene);
    tBody.material = M.stoneD;
    tBody.position.y = 3.5;
    addShadow(tBody); tBody.parent = tower;
    // Broken top
    const tTop = BABYLON.MeshBuilder.CreateCylinder("tt", {
      diameterTop: 2.0, diameterBottom: 2.2, height: 1, tessellation: 12
    }, scene);
    tTop.material = M.stone;
    tTop.position.y = 7.5;
    tTop.scaling.y = 0.6;
    addShadow(tTop); tTop.parent = tower;
    // Rubble around base
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 2 + Math.random() * 1.5;
      const rb = BABYLON.MeshBuilder.CreateBox("rb", {
        width: 0.3 + Math.random()*0.5,
        height: 0.3 + Math.random()*0.4,
        depth: 0.3 + Math.random()*0.5
      }, scene);
      rb.material = M.stoneD;
      rb.position = new BABYLON.Vector3(Math.cos(a)*r, 0.2, Math.sin(a)*r);
      rb.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());
      rb.parent = tower;
    }
    // Arrow slits
    for (let i = 0; i < 3; i++) {
      const slit = BABYLON.MeshBuilder.CreatePlane("sl", { width: 0.15, height: 0.6 }, scene);
      slit.material = M.timber;
      const ang = (i/3) * Math.PI * 2;
      slit.position = new BABYLON.Vector3(Math.cos(ang)*1.45, 4 + i*0.8, Math.sin(ang)*1.45);
      slit.rotation.y = ang + Math.PI;
      slit.parent = tower;
    }

    // ---------- Stone path from castle gate ----------
    for (let i = 0; i < 10; i++) {
      const stone = BABYLON.MeshBuilder.CreateCylinder("st", {
        diameter: 0.9 + Math.random()*0.4, height: 0.15, tessellation: 8
      }, scene);
      stone.material = M.path;
      stone.position = new BABYLON.Vector3(-3 + (Math.random()-0.5)*1.2, 2.08, -12 - i*1.2);
      stone.parent = island;
    }

    // ---------- Clouds (drifting) ----------
    const clouds = [];
    for (let i = 0; i < 6; i++) {
      const cloud = new BABYLON.TransformNode("cloud", scene);
      for (let j = 0; j < 5; j++) {
        const puff = BABYLON.MeshBuilder.CreateSphere("puff", {
          diameter: 3 + Math.random()*3, segments: 10
        }, scene);
        const m = new BABYLON.StandardMaterial("cm", scene);
        m.diffuseColor = new BABYLON.Color3(1, 1, 1);
        m.emissiveColor = new BABYLON.Color3(0.4, 0.4, 0.45);
        m.specularColor = new BABYLON.Color3(0,0,0);
        puff.material = m;
        puff.position = new BABYLON.Vector3((j-2)*2.5 + Math.random(), Math.random()*1.5, Math.random()*1.5);
        puff.parent = cloud;
      }
      cloud.position = new BABYLON.Vector3(
        (Math.random()-0.5)*120,
        18 + Math.random()*8,
        (Math.random()-0.5)*120
      );
      clouds.push({ node: cloud, speed: 0.3 + Math.random()*0.5, dir: Math.random() > 0.5 ? 1 : -1 });
    }
    scene.registerBeforeRender(() => {
      clouds.forEach(c => {
        c.node.position.x += c.speed * c.dir * 0.01;
        if (Math.abs(c.node.position.x) > 80) c.dir *= -1;
      });
    });

    // Gentle island float animation
    let t0 = 0;
    scene.registerBeforeRender(() => {
      t0 += engine.getDeltaTime() / 1000;
      island.position.y = Math.sin(t0 * 0.4) * 0.3;
      island.rotation.y = Math.sin(t0 * 0.1) * 0.02;
    });

    // ---------- Glow post-process ----------
    const gl = new BABYLON.GlowLayer("glow", scene, { mainTextureFixedSize: 512, blurKernelSize: 32 });
    gl.intensity = 0.6;

    return scene;
  };

  const scene = createScene();

  engine.runRenderLoop(() => scene.render());
  window.addEventListener("resize", () => engine.resize());
})();
</script>
</body>
</html>
