<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Island Diorama</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d0d14;
    }
    #renderCanvas {
      width: 100%; height: 100%;
      touch-action: none;
      outline: none;
      display: block;
    }
    #ui {
      position: absolute;
      top: 14px; left: 14px;
      background: rgba(12, 16, 28, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(120, 180, 255, 0.12);
      border-radius: 12px;
      padding: 16px 20px;
      color: #c8d4e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      pointer-events: none;
      user-select: none;
      max-width: 240px;
      line-height: 1.6;
    }
    #ui h1 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #7ec0ee;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    #ui p { margin: 0; color: #8a9aaa; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <h1>Floating Island Diorama</h1>
    <p>Left-drag to orbit &middot; Scroll to zoom<br>Right-drag to pan</p>
  </div>

  <script>
    // ============================================================
    //  FLOATING ISLAND MEDIEVAL DIORAMA
    // ============================================================
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

    // --- Texture Generators -------------------------------------------
    function createParticleTex() {
      const c = document.createElement("canvas");
      c.width = 64; c.height = 64;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, "rgba(255,255,255,1)");
      g.addColorStop(0.4, "rgba(255,255,255,0.5)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return c.toDataURL();
    }

    function createStoneTex() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#8a8a8a";
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 16) {
        const off = ((y / 16) | 0) % 2 === 0 ? 0 : 8;
        for (let x = -8; x < 256; x += 16) {
          const v = 120 + Math.random() * 40;
          ctx.fillStyle = `rgb(${v},${v},${v})`;
          ctx.fillRect(x + off + 1, y + 1, 14, 14);
          ctx.strokeStyle = "#666";
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x + off + 0.5, y + 0.5, 15, 15);
        }
      }
      return c.toDataURL();
    }

    function createWoodTex() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#7a4e2a";
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 1) {
        ctx.strokeStyle = Math.random() > 0.5 ? "#5a3a1a" : "#9a6a3a";
        ctx.globalAlpha = 0.15 + Math.random() * 0.15;
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x < 256; x += 8) {
          ctx.lineTo(x, y + Math.sin((y + x) * 0.05) * 2 + (Math.random() - 0.5));
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      return c.toDataURL();
    }

    function createRoofTex() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#a03020";
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 12) {
        const off = ((y / 12) | 0) % 2 === 0 ? 0 : 6;
        for (let x = -6; x < 256; x += 12) {
          const r = 140 + Math.random() * 30;
          ctx.fillStyle = `rgb(${r},${r * 0.25 | 0},${r * 0.15 | 0})`;
          ctx.fillRect(x + off + 0.5, y + 0.5, 11, 10);
        }
      }
      return c.toDataURL();
    }

    function createGrassTex() {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#4a8c3a";
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 4000; i++) {
        const v = 50 + Math.random() * 40;
        ctx.fillStyle = Math.random() > 0.5 ? `rgb(${v * 0.6 | 0},${v},${v * 0.4 | 0})` : `rgb(${v * 0.5 | 0},${v + 20},${v * 0.3 | 0})`;
        ctx.globalAlpha = 0.25;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      ctx.globalAlpha = 1;
      return c.toDataURL();
    }

    function createDirtTex() {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#6b5a3e";
      ctx.fillRect(0, 0, 128, 128);
      for (let i = 0; i < 800; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? "#5a4a30" : "#7c6a4e";
        ctx.globalAlpha = 0.3;
        ctx.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
      }
      ctx.globalAlpha = 1;
      return c.toDataURL();
    }

    // --- Scene --------------------------------------------------------
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.06, 0.07, 0.11);
    scene.ambientColor = new BABYLON.Color3(0.3, 0.32, 0.38);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.008;
    scene.fogColor = new BABYLON.Color3(0.10, 0.12, 0.18);

    // Camera
    const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2.2, Math.PI / 2.7, 90, new BABYLON.Vector3(0, 8, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 25;
    camera.upperRadiusLimit = 180;
    camera.wheelPrecision = 45;
    camera.panningSensibility = 70;
    camera.lowerBetaLimit = 0.2;
    camera.upperBetaLimit = Math.PI / 2.05;

    // Lights
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0.3), scene);
    hemi.intensity = 0.45;
    hemi.groundColor = new BABYLON.Color3(0.14, 0.12, 0.10);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1.2, -2.2, -0.8), scene);
    sun.position = new BABYLON.Vector3(60, 100, 60);
    sun.intensity = 1.05;
    sun.diffuse = new BABYLON.Color3(1.0, 0.92, 0.78);

    const fill = new BABYLON.DirectionalLight("fill", new BABYLON.Vector3(0.8, -0.6, 0.6), scene);
    fill.position = new BABYLON.Vector3(-40, 50, -40);
    fill.intensity = 0.35;
    fill.diffuse = new BABYLON.Color3(0.7, 0.8, 0.95);

    // Shadows
    const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
    shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.blurKernel = 28;
    shadowGen.darkness = 0.5;

    // Materials
    const stoneMat = new BABYLON.StandardMaterial("stone", scene);
    stoneMat.diffuseTexture = new BABYLON.Texture(createStoneTex(), scene);
    stoneMat.diffuseTexture.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
    stoneMat.diffuseTexture.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    stoneMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
    stoneMat.ambientColor = new BABYLON.Color3(0.4, 0.4, 0.45);

    const woodMat = new BABYLON.StandardMaterial("wood", scene);
    woodMat.diffuseTexture = new BABYLON.Texture(createWoodTex(), scene);
    woodMat.diffuseTexture.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
    woodMat.diffuseTexture.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    woodMat.specularColor = new BABYLON.Color3(0.08, 0.06, 0.04);
    woodMat.ambientColor = new BABYLON.Color3(0.35, 0.25, 0.15);

    const roofMat = new BABYLON.StandardMaterial("roof", scene);
    roofMat.diffuseTexture = new BABYLON.Texture(createRoofTex(), scene);
    roofMat.diffuseTexture.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
    roofMat.diffuseTexture.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    roofMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

    const grassMat = new BABYLON.StandardMaterial("grass", scene);
    grassMat.diffuseTexture = new BABYLON.Texture(createGrassTex(), scene);
    grassMat.diffuseTexture.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
    grassMat.diffuseTexture.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    grassMat.specularColor = new BABYLON.Color3(0.02, 0.05, 0.02);
    grassMat.ambientColor = new BABYLON.Color3(0.3, 0.45, 0.25);

    const dirtMat = new BABYLON.StandardMaterial("dirt", scene);
    dirtMat.diffuseTexture = new BABYLON.Texture(createDirtTex(), scene);
    dirtMat.diffuseTexture.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
    dirtMat.diffuseTexture.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    dirtMat.specularColor = new BABYLON.Color3(0, 0, 0);

    const waterMat = new BABYLON.StandardMaterial("water", scene);
    waterMat.diffuseColor = new BABYLON.Color3(0.15, 0.65, 0.72);
    waterMat.specularColor = new BABYLON.Color3(0.6, 0.8, 0.9);
    waterMat.specularPower = 64;
    waterMat.alpha = 0.82;
    waterMat.backFaceCulling = false;

    const darkMat = new BABYLON.StandardMaterial("dark", scene);
    darkMat.diffuseColor = new BABYLON.Color3(0.12, 0.12, 0.14);
    darkMat.specularColor = new BABYLON.Color3(0, 0, 0);

    const glowMat = new BABYLON.StandardMaterial("glow", scene);
    glowMat.emissiveColor = new BABYLON.Color3(0.95, 0.75, 0.35);
    glowMat.diffuseColor = new BABYLON.Color3(0, 0, 0);

    // Root node for floating animation
    const islandRoot = new BABYLON.TransformNode("islandRoot", scene);

    // ============================================================
    //  ISLAND MESH
    // ============================================================
    const island = BABYLON.MeshBuilder.CreateSphere("island", {diameter: 52, segments: 80}, scene);
    island.parent = islandRoot;
    const pos = island.getVerticesData(BABYLON.VertexBuffer.PositionKind);

    for (let i = 0; i < pos.length; i += 3) {
      let x = pos[i], y = pos[i+1], z = pos[i+2];
      const dist = Math.sqrt(x*x + z*z);

      // Flatten top
      if (y > 0) y *= 0.12;
      else y *= 0.55;

      // Organic terrain noise
      y += Math.sin(x * 0.35) * Math.cos(z * 0.35) * 1.8;
      y += Math.sin(x * 0.8 + 1.5) * Math.sin(z * 0.6 + 0.5) * 0.6;
      y += Math.sin(x * 1.8) * Math.cos(z * 1.5) * 0.25;

      // Cliff drop
      if (dist > 14 && dist < 22) {
        const t = (dist - 14) / 8;
        y -= t * t * 10;
      } else if (dist >= 22) {
        y -= 10 + (dist - 22) * 0.4;
      }

      // Taper bottom
      if (y < -10) {
        const taper = Math.max(0, 1 - (-y - 10) / 12);
        x *= 0.4 + taper * 0.6;
        z *= 0.4 + taper * 0.6;
      }

      // Flatten building areas
      if (y > 2 && dist < 12) {
        y = 2 + (y - 2) * 0.35;
      }

      pos[i] = x; pos[i+1] = y; pos[i+2] = z;
    }
    island.updateVerticesData(BABYLON.VertexBuffer.PositionKind, pos);
    island.createNormals(true);
    island.material = grassMat;
    island.receiveShadows = true;
    shadowGen.addShadowCaster(island);

    // Rocky underbelly (extra detail)
    const underbelly = BABYLON.MeshBuilder.CreateSphere("under", {diameter: 48, segments: 48}, scene);
    underbelly.parent = islandRoot;
    const upos = underbelly.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    for (let i = 0; i < upos.length; i += 3) {
      let x = upos[i], y = upos[i+1], z = upos[i+2];
      const dist = Math.sqrt(x*x + z*z);
      if (y > -2) y = -2 - Math.random() * 2;
      y += Math.sin(x * 0.5) * Math.cos(z * 0.5) * 2;
      if (dist > 18) {
        const t = (dist - 18) / 8;
        y -= t * t * 6;
      }
      if (y < -12) {
        const taper = Math.max(0, 1 - (-y - 12) / 10);
        x *= taper; z *= taper;
      }
      upos[i] = x; upos[i+1] = y; upos[i+2] = z;
    }
    underbelly.updateVerticesData(BABYLON.VertexBuffer.PositionKind, upos);
    underbelly.createNormals(true);
    underbelly.material = darkMat;
    underbelly.receiveShadows = true;

    // Floating rocks around
    for (let i = 0; i < 6; i++) {
      const rock = BABYLON.MeshBuilder.CreatePolyhedron("fr" + i, {type: 1, size: 0.8 + Math.random() * 1.8}, scene);
      const a = Math.random() * Math.PI * 2;
      const d = 32 + Math.random() * 14;
      rock.position = new BABYLON.Vector3(Math.cos(a) * d, -8 + Math.random() * 14, Math.sin(a) * d);
      rock.rotation = new BABYLON.Vector3(Math.random() * 3, Math.random() * 3, Math.random() * 3);
      rock.parent = islandRoot;
      const rm = new BABYLON.StandardMaterial("rm" + i, scene);
      rm.diffuseColor = new BABYLON.Color3(0.3 + Math.random() * 0.1, 0.3 + Math.random() * 0.08, 0.35);
      rock.material = rm;
      shadowGen.addShadowCaster(rock);
    }

    // ============================================================
    //  HELPER FUNCTIONS
    // ============================================================
    function createPineTree(px, pz, sc) {
      const node = new BABYLON.TransformNode("tree", scene);
      node.position = new BABYLON.Vector3(px, 2.2, pz);
      node.scaling = new BABYLON.Vector3(sc, sc, sc);
      node.parent = islandRoot;

      const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", {diameterTop: 0.25, diameterBottom: 0.45, height: 3, tessellation: 8}, scene);
      trunk.position.y = 1.5;
      trunk.parent = node;
      const tm = new BABYLON.StandardMaterial("tm", scene);
      tm.diffuseColor = new BABYLON.Color3(0.35, 0.22, 0.12);
      trunk.material = tm;
      shadowGen.addShadowCaster(trunk);

      const fm = new BABYLON.StandardMaterial("fm", scene);
      fm.diffuseColor = new BABYLON.Color3(0.12 + Math.random() * 0.06, 0.38 + Math.random() * 0.08, 0.14 + Math.random() * 0.06);
      fm.specularColor = new BABYLON.Color3(0.02, 0.04, 0.02);

      for (let i = 0; i < 3; i++) {
        const cone = BABYLON.MeshBuilder.CreateCylinder("foliage", {
          diameterTop: 0, diameterBottom: 2.4 - i * 0.35, height: 2.2, tessellation: 8
        }, scene);
        cone.position.y = 3 + i * 1.4;
        cone.parent = node;
        cone.material = fm;
        shadowGen.addShadowCaster(cone);
      }
      return node;
    }

    function createHouse(px, pz, rot, type) {
      const node = new BABYLON.TransformNode("house", scene);
      node.position = new BABYLON.Vector3(px, 2.2, pz);
      node.rotation.y = rot;
      node.parent = islandRoot;

      let w = 3, d = 3, h = 3.5;
      if (type === "medium") { w = 4; d = 4; h = 4.5; }
      else if (type === "tavern") { w = 6; d = 5.5; h = 5.5; }
      else if (type === "mill") { w = 5; d = 4.5; h = 5; }

      const body = BABYLON.MeshBuilder.CreateBox("hb", {width: w, height: h, depth: d}, scene);
      body.position.y = h / 2;
      body.parent = node;
      body.material = woodMat;
      shadowGen.addShadowCaster(body);

      const rh = type === "tavern" ? 3.2 : 2.2;
      const roof = BABYLON.MeshBuilder.CreateCylinder("hr", {
        diameterTop: 0, diameterBottom: Math.max(w, d) * 1.45, height: rh, tessellation: 4
      }, scene);
      roof.position.y = h + rh / 2;
      roof.rotation.y = Math.PI / 4;
      roof.parent = node;
      roof.material = roofMat;
      shadowGen.addShadowCaster(roof);

      // Door
      const door = BABYLON.MeshBuilder.CreatePlane("door", {width: 1.1, height: 2.1}, scene);
      door.position = new BABYLON.Vector3(0, 1.05, d / 2 + 0.02);
      door.parent = node;
      const dm = new BABYLON.StandardMaterial("dm", scene);
      dm.diffuseColor = new BABYLON.Color3(0.3, 0.18, 0.08);
      door.material = dm;

      // Window
      const win = BABYLON.MeshBuilder.CreatePlane("win", {width: 0.7, height: 0.7}, scene);
      win.position = new BABYLON.Vector3(w / 3.5, h / 2 + 0.4, d / 2 + 0.02);
      win.parent = node;
      win.material = glowMat;

      // Chimney
      if (Math.random() > 0.3) {
        const chim = BABYLON.MeshBuilder.CreateBox("chim", {width: 0.5, height: 1.8, depth: 0.5}, scene);
        chim.position = new BABYLON.Vector3(w / 3.5, h + rh - 0.5, d / 4);
        chim.parent = node;
        chim.material = stoneMat;
        shadowGen.addShadowCaster(chim);

        // Smoke
        const ps = new BABYLON.ParticleSystem("smoke" + px + pz, 80, scene);
        ps.particleTexture = new BABYLON.Texture(createParticleTex(), scene);
        ps.emitter = new BABYLON.Vector3(px + w / 3.5 * Math.cos(rot), 2.2 + h + rh + 0.5, pz + w / 3.5 * Math.sin(rot));
        ps.minEmitBox = new BABYLON.Vector3(-0.1, 0, -0.1);
        ps.maxEmitBox = new BABYLON.Vector3(0.1, 0, 0.1);
        ps.color1 = new BABYLON.Color4(0.7, 0.7, 0.7, 0.35);
        ps.color2 = new BABYLON.Color4(0.5, 0.5, 0.5, 0.2);
        ps.colorDead = new BABYLON.Color4(0.3, 0.3, 0.3, 0);
        ps.minSize = 0.15; ps.maxSize = 0.5;
        ps.minLifeTime = 2; ps.maxLifeTime = 5;
        ps.emitRate = 15;
        ps.gravity = new BABYLON.Vector3(0, 0.4, 0);
        ps.direction1 = new BABYLON.Vector3(-0.2, 1, -0.2);
        ps.direction2 = new BABYLON.Vector3(0.2, 1.2, 0.2);
        ps.minEmitPower = 0.3; ps.maxEmitPower = 0.8;
        ps.updateSpeed = 0.01;
        ps.start();
      }

      return node;
    }

    function createMarketStall(px, pz, rot) {
      const node = new BABYLON.TransformNode("stall", scene);
      node.position = new BABYLON.Vector3(px, 2.2, pz);
      node.rotation.y = rot;
      node.parent = islandRoot;

      const table = BABYLON.MeshBuilder.CreateBox("tbl", {width: 2.2, height: 0.1, depth: 1.3}, scene);
      table.position.y = 1.2;
      table.parent = node;
      table.material = woodMat;
      shadowGen.addShadowCaster(table);

      for (let lx of [-0.9, 0.9]) {
        for (let lz of [-0.5, 0.5]) {
          const leg = BABYLON.MeshBuilder.CreateCylinder("leg", {diameter: 0.1, height: 1.2}, scene);
          leg.position = new BABYLON.Vector3(lx, 0.6, lz);
          leg.parent = node;
          leg.material = woodMat;
        }
      }

      const awning = BABYLON.MeshBuilder.CreateBox("awn", {width: 2.6, height: 0.06, depth: 1.6}, scene);
      awning.position.y = 2.4;
      awning.rotation.x = 0.12;
      awning.parent = node;
      const am = new BABYLON.StandardMaterial("am", scene);
      const hues = [
        new BABYLON.Color3(0.9, 0.5, 0.15),
        new BABYLON.Color3(0.15, 0.5, 0.7),
        new BABYLON.Color3(0.7, 0.2, 0.3),
        new BABYLON.Color3(0.5, 0.7, 0.2)
      ];
      am.diffuseColor = hues[Math.floor(Math.random() * hues.length)];
      awning.material = am;
      shadowGen.addShadowCaster(awning);

      for (let lx of [-1.2, 1.2]) {
        const pole = BABYLON.MeshBuilder.CreateCylinder("pole", {diameter: 0.07, height: 2.4}, scene);
        pole.position = new BABYLON.Vector3(lx, 1.2, 0.7);
        pole.parent = node;
        pole.material = woodMat;
      }

      // Goods
      const goods = BABYLON.MeshBuilder.CreateBox("goods", {width: 0.5, height: 0.35, depth: 0.4}, scene);
      goods.position = new BABYLON.Vector3(-0.4, 1.42, 0);
      goods.parent = node;
      const gm = new BABYLON.StandardMaterial("gm", scene);
      gm.diffuseColor = new BABYLON.Color3(0.2 + Math.random() * 0.3, 0.4 + Math.random() * 0.3, 0.2 + Math.random() * 0.2);
      goods.material = gm;

      return node;
    }

    function createBridge(px, pz, rot) {
      const node = new BABYLON.TransformNode("bridge", scene);
      node.position = new BABYLON.Vector3(px, 2.2, pz);
      node.rotation.y = rot;
      node.parent = islandRoot;

      const deck = BABYLON.MeshBuilder.CreateBox("deck", {width: 4.5, height: 0.25, depth: 2.2}, scene);
      deck.position.y = 2.7;
      deck.parent = node;
      deck.material = woodMat;
      shadowGen.addShadowCaster(deck);

      for (let z of [-1, 1]) {
        const rail = BABYLON.MeshBuilder.CreateBox("rail", {width: 4.5, height: 0.7, depth: 0.12}, scene);
        rail.position = new BABYLON.Vector3(0, 3.15, z * 1.0);
        rail.parent = node;
        rail.material = woodMat;
        shadowGen.addShadowCaster(rail);
        for (let x of [-2, 0, 2]) {
          const post = BABYLON.MeshBuilder.CreateCylinder("post", {diameter: 0.1, height: 1.0}, scene);
          post.position = new BABYLON.Vector3(x, 3.0, z * 1.0);
          post.parent = node;
          post.material = woodMat;
        }
      }

      for (let x of [-1.3, 1.3]) {
        const beam = BABYLON.MeshBuilder.CreateBox("beam", {width: 0.25, height: 1.8, depth: 1.8}, scene);
        beam.position = new BABYLON.Vector3(x, 1.9, 0);
        beam.parent = node;
        beam.material = woodMat;
      }
      return node;
    }

    function createRuinedTower(px, pz) {
      const node = new BABYLON.TransformNode("ruin", scene);
      node.position = new BABYLON.Vector3(px, 2.2, pz);
      node.parent = islandRoot;

      const tower = BABYLON.MeshBuilder.CreateCylinder("rt", {diameter: 5, height: 7, tessellation: 14}, scene);
      tower.position.y = 3.5;
      tower.parent = node;
      tower.material = stoneMat;
      shadowGen.addShadowCaster(tower);

      // Missing chunk
      const gap = BABYLON.MeshBuilder.CreateBox("gap", {width: 2.2, height: 3.5, depth: 1.2}, scene);
      gap.position = new BABYLON.Vector3(1.6, 2.5, 2.2);
      gap.parent = node;
      const gapm = new BABYLON.StandardMaterial("gapm", scene);
      gapm.diffuseColor = new BABYLON.Color3(0.12, 0.12, 0.14);
      gap.material = gapm;

      // Rubble
      for (let i = 0; i < 14; i++) {
        const r = BABYLON.MeshBuilder.CreatePolyhedron("rb" + i, {type: 1, size: 0.25 + Math.random() * 0.35}, scene);
        const a = Math.random() * Math.PI * 2;
        const d = 2.5 + Math.random() * 2.5;
        r.position = new BABYLON.Vector3(Math.cos(a) * d, 0.15 + Math.random() * 0.3, Math.sin(a) * d);
        r.rotation = new BABYLON.Vector3(Math.random(), Math.random(), Math.random());
        r.parent = node;
        r.material = stoneMat;
        shadowGen.addShadowCaster(r);
      }

      // Jagged top
      for (let i = 0; i < 7; i++) {
        const edge = BABYLON.MeshBuilder.CreateBox("edge", {width: 0.7, height: 0.6 + Math.random() * 0.8, depth: 0.7}, scene);
        const a = (i / 7) * Math.PI * 2;
        edge.position = new BABYLON.Vector3(Math.cos(a) * 2.3, 7.2, Math.sin(a) * 2.3);
        edge.parent = node;
        edge.material = stoneMat;
        shadowGen.addShadowCaster(edge);
      }
      return node;
    }

    // ============================================================
    //  CASTLE
    // ============================================================
    const castleNode = new BABYLON.TransformNode("castle", scene);
    castleNode.position = new BABYLON.Vector3(0, 2.2, 0);
    castleNode.parent = islandRoot;

    // Keep
    const keep = BABYLON.MeshBuilder.CreateBox("keep", {width: 7, height: 13, depth: 7}, scene);
    keep.position.y = 6.5;
    keep.parent = castleNode;
    keep.material = stoneMat;
    shadowGen.addShadowCaster(keep);

    // Keep crenellations
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 4; j++) {
        if ((i + j) % 2 === 0) {
          const cren = BABYLON.MeshBuilder.CreateBox("ck", {width: 1.0, height: 0.9, depth: 1.0}, scene);
          cren.position = new BABYLON.Vector3(-2.5 + i * 1.67, 13.45, -2.5 + j * 1.67);
          cren.parent = castleNode;
          cren.material = stoneMat;
        }
      }
    }

    // Corner towers
    const tPos = [{x:-9,z:-9},{x:9,z:-9},{x:-9,z:9},{x:9,z:9}];
    for (let tp of tPos) {
      const tower = BABYLON.MeshBuilder.CreateCylinder("ct", {diameter: 3.5, height: 15, tessellation: 16}, scene);
      tower.position = new BABYLON.Vector3(tp.x, 7.5, tp.z);
      tower.parent = castleNode;
      tower.material = stoneMat;
      shadowGen.addShadowCaster(tower);

      const roof = BABYLON.MeshBuilder.CreateCylinder("cr", {diameterTop: 0, diameterBottom: 4.5, height: 3.5, tessellation: 16}, scene);
      roof.position = new BABYLON.Vector3(tp.x, 17.5, tp.z);
      roof.parent = castleNode;
      roof.material = roofMat;
      shadowGen.addShadowCaster(roof);

      // Window glow
      const win = BABYLON.MeshBuilder.CreatePlane("cw", {width: 0.7, height: 1.2}, scene);
      win.position = new BABYLON.Vector3(tp.x + 1.76, 9, tp.z);
      win.rotation.y = Math.PI / 2;
      win.parent = castleNode;
      win.material = glowMat;
    }

    // Walls
    const walls = [
      {w: 18, h: 9, d: 1.2, x: 0, y: 4.5, z: -9},
      {w: 18, h: 9, d: 1.2, x: 0, y: 4.5, z: 9},
      {w: 1.2, h: 9, d: 18, x: -9, y: 4.5, z: 0},
      {w: 1.2, h: 9, d: 18, x: 9, y: 4.5, z: 0}
    ];
    for (let w of walls) {
      const wall = BABYLON.MeshBuilder.CreateBox("wall", {width: w.w, height: w.h, depth: w.d}, scene);
      wall.position = new BABYLON.Vector3(w.x, w.y, w.z);
      wall.parent = castleNode;
      wall.material = stoneMat;
      shadowGen.addShadowCaster(wall);
    }

    // Gatehouse
    const gate = BABYLON.MeshBuilder.CreateBox("gate", {width: 4.5, height: 10, depth: 2.5}, scene);
    gate.position = new BABYLON.Vector3(0, 5, -9);
    gate.parent = castleNode;
    gate.material = stoneMat;
    shadowGen.addShadowCaster(gate);

    const arch = BABYLON.MeshBuilder.CreatePlane("arch", {width: 2.2, height: 3.5}, scene);
    arch.position = new BABYLON.Vector3(0, 1.75, -10.26);
    arch.parent = castleNode;
    arch.material = darkMat;

    const gateRoof = BABYLON.MeshBuilder.CreateCylinder("gr", {diameterTop: 0, diameterBottom: 5.5, height: 2.5, tessellation: 3}, scene);
    gateRoof.position = new BABYLON.Vector3(0, 12.25, -9);
    gateRoof.rotation.z = Math.PI;
    gateRoof.parent = castleNode;
    gateRoof.material = roofMat;

    // Flag
    const pole = BABYLON.MeshBuilder.CreateCylinder("pole", {diameter: 0.12, height: 5}, scene);
    pole.position = new BABYLON.Vector3(0, 15.5, 0);
    pole.parent = castleNode;
    const pm = new BABYLON.StandardMaterial("pm", scene);
    pm.diffuseColor = new BABYLON.Color3(0.4, 0.3, 0.2);
    pole.material = pm;

    const flag = BABYLON.MeshBuilder.CreatePlane("flag", {width: 2.8, height: 1.8}, scene);
    flag.position = new BABYLON.Vector3(1.4, 17.5, 0);
    flag.parent = castleNode;
    const fm = new BABYLON.StandardMaterial("fm", scene);
    fm.diffuseColor = new BABYLON.Color3(0.85, 0.12, 0.12);
    fm.backFaceCulling = false;
    flag.material = fm;

    // ============================================================
    //  VILLAGE
    // ============================================================
    // Houses scattered around
    createHouse(-7, -5, 0.3, "small");
    createHouse(-9, -2, -0.4, "medium");
    createHouse(-6, 2, 0.8, "small");
    createHouse(-10, 4, -0.2, "small");
    createHouse(7, -4, -0.6, "medium");
    createHouse(9, 1, 0.5, "small");
    createHouse(6, 5, -0.8, "small");
    createHouse(-4, 7, 1.2, "medium");

    // Tavern
    const tavern = createHouse(10, 7, -0.3, "tavern");
    // Tavern sign
    const sign = BABYLON.MeshBuilder.CreateBox("sign", {width: 2.2, height: 0.7, depth: 0.08}, scene);
    sign.position = new BABYLON.Vector3(10, 5.8, 10.3);
    sign.rotation.y = -0.3;
    sign.parent = islandRoot;
    const sm = new BABYLON.StandardMaterial("sm", scene);
    sm.diffuseColor = new BABYLON.Color3(0.9, 0.8, 0.6);
    sign.material = sm;

    // Tavern warm light
    const tavernLight = new BABYLON.PointLight("tl", new BABYLON.Vector3(10, 6, 7), scene);
    tavernLight.diffuse = new BABYLON.Color3(1.0, 0.65, 0.25);
    tavernLight.intensity = 0.9;
    tavernLight.range = 12;
    tavernLight.parent = islandRoot;

    // Market stalls
    createMarketStall(5, 8, 0.4);
    createMarketStall(7, 9, -0.2);
    createMarketStall(4, 10, 0.9);

    // Mill
    const mill = createHouse(12, -2, 0.2, "mill");
    // Water wheel
    const wheelNode = new BABYLON.TransformNode("wheel", scene);
    wheelNode.position = new BABYLON.Vector3(12, 3.5, 0.5);
    wheelNode.rotation.y = 0.2;
    wheelNode.parent = islandRoot;

    const wheel = BABYLON.MeshBuilder.CreateTorus("wheel", {diameter: 2.8, thickness: 0.25, tessellation: 16}, scene);
    wheel.parent = wheelNode;
    const wm = new BABYLON.StandardMaterial("wm", scene);
    wm.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.1);
    wheel.material = wm;
    shadowGen.addShadowCaster(wheel);

    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const spoke = BABYLON.MeshBuilder.CreateBox("spoke", {width: 0.12, height: 1.2, depth: 0.12}, scene);
      spoke.position = new BABYLON.Vector3(Math.cos(a) * 0.6, Math.sin(a) * 0.6, 0);
      spoke.rotation.z = a;
      spoke.parent = wheelNode;
      spoke.material = wm;

      const bucket = BABYLON.MeshBuilder.CreateBox("bucket", {width: 0.35, height: 0.2, depth: 0.25}, scene);
      bucket.position = new BABYLON.Vector3(Math.cos(a) * 1.3, Math.sin(a) * 1.3, 0);
      bucket.parent = wheelNode;
      bucket.material = wm;
    }

    const axle = BABYLON.MeshBuilder.CreateCylinder("axle", {diameter: 0.18, height: 0.8}, scene);
    axle.rotation.x = Math.PI / 2;
    axle.parent = wheelNode;
    axle.material = woodMat;

    // ============================================================
    //  RIVER & BRIDGES
    // ============================================================
    const riverPathL = [];
    const riverPathR = [];
    const numRP = 50;
    for (let i = 0; i < numRP; i++) {
      const t = i / (numRP - 1);
      const cx = -18 + t * 38;
      const cz = Math.sin(t * Math.PI * 2.2) * 4 + Math.cos(t * Math.PI * 3.5) * 1.5;
      const cy = 2.15;
      const w = 1.6 + Math.sin(t * Math.PI * 4) * 0.3;
      const ang = Math.atan2(Math.cos(t * Math.PI * 2.2) * 4 * Math.PI * 2.2 / 38, 1);
      riverPathL.push(new BABYLON.Vector3(cx - Math.sin(ang) * w, cy, cz + Math.cos(ang) * w));
      riverPathR.push(new BABYLON.Vector3(cx + Math.sin(ang) * w, cy, cz - Math.cos(ang) * w));
    }

    const river = BABYLON.MeshBuilder.CreateRibbon("river", {
      pathArray: [riverPathL, riverPathR],
      sideOrientation: BABYLON.Mesh.DOUBLESIDE,
      updatable: true
    }, scene);
    river.material = waterMat;
    river.parent = islandRoot;

    // Bridges
    createBridge(-5, 1.5, 0.3);
    createBridge(8, -2, -0.4);

    // Waterfall at river end
    const wfPos = new BABYLON.Vector3(20, 2.2, riverPathL[riverPathL.length - 1].z);
    const wfPS = new BABYLON.ParticleSystem("wf", 1500, scene);
    wfPS.particleTexture = new BABYLON.Texture(createParticleTex(), scene);
    wfPS.emitter = wfPos;
    wfPS.minEmitBox = new BABYLON.Vector3(-0.8, 0, -0.3);
    wfPS.maxEmitBox = new BABYLON.Vector3(0.8, 0, 0.3);
    wfPS.color1 = new BABYLON.Color4(0.3, 0.8, 0.9, 0.7);
    wfPS.color2 = new BABYLON.Color4(0.2, 0.7, 0.85, 0.5);
    wfPS.colorDead = new BABYLON.Color4(0.1, 0.5, 0.7, 0);
    wfPS.minSize = 0.1; wfPS.maxSize = 0.5;
    wfPS.minLifeTime = 0.8; wfPS.maxLifeTime = 2.2;
    wfPS.emitRate = 400;
    wfPS.gravity = new BABYLON.Vector3(0, -12, 0);
    wfPS.direction1 = new BABYLON.Vector3(-0.3, -1, -0.3);
    wfPS.direction2 = new BABYLON.Vector3(0.3, -1, 0.3);
    wfPS.minEmitPower = 3; wfPS.maxEmitPower = 7;
    wfPS.updateSpeed = 0.015;
    wfPS.start();

    // ============================================================
    //  RUINED WATCHTOWER
    // ============================================================
    createRuinedTower(-14, 6);

    // ============================================================
    //  TREES
    // ============================================================
    const treeSpots = [
      [-12,-8],[14,-7],[-13,0],[15,3],[-11,5],[13,8],
      [-8,-10],[10,-9],[-5,-11],[7,-10],[-14,-3],[16,0],
      [-6,10],[8,11],[12,5],[-10,9],[14,-3],[-15,-6],
      [5,-7],[-3,-9],[11,10],[-7,11],[16,6],[-13,-9]
    ];
    for (let spot of treeSpots) {
      const dist = Math.sqrt(spot[0]*spot[0] + spot[1]*spot[1]);
      if (dist > 8 && dist < 17) {
        createPineTree(spot[0], spot[1], 0.7 + Math.random() * 0.5);
      }
    }

    // ============================================================
    //  GRASS PATCHES & PATHS
    // ============================================================
    for (let i = 0; i < 30; i++) {
      const gx = (Math.random() - 0.5) * 26;
      const gz = (Math.random() - 0.5) * 26;
      const dist = Math.sqrt(gx*gx + gz*gz);
      if (dist > 5 && dist < 14) {
        const patch = new BABYLON.TransformNode("patch", scene);
        patch.position = new BABYLON.Vector3(gx, 2.25, gz);
        patch.parent = islandRoot;
        for (let j = 0; j < 6; j++) {
          const blade = BABYLON.MeshBuilder.CreatePlane("blade", {width: 0.12, height: 0.35 + Math.random() * 0.25}, scene);
          blade.position = new BABYLON.Vector3((Math.random()-0.5)*1.2, 0.15, (Math.random()-0.5)*1.2);
          blade.rotation.y = Math.random() * Math.PI;
          blade.parent = patch;
          const bm = new BABYLON.StandardMaterial("bm", scene);
          bm.diffuseColor = new BABYLON.Color3(0.2 + Math.random()*0.15, 0.5 + Math.random()*0.2, 0.1 + Math.random()*0.1);
          bm.backFaceCulling = false;
          blade.material = bm;
        }
      }
    }

    // Dirt paths
    const pathPoints = [
      new BABYLON.Vector3(-7, 2.22, -5),
      new BABYLON.Vector3(-4, 2.22, -2),
      new BABYLON.Vector3(0, 2.22, 0),
      new BABYLON.Vector3(4, 2.22, 2),
      new BABYLON.Vector3(8, 2.22, 5)
    ];
    for (let i = 0; i < pathPoints.length - 1; i++) {
      const p1 = pathPoints[i];
      const p2 = pathPoints[i+1];
      const mid = BABYLON.Vector3.Center(p1, p2);
      const dist = BABYLON.Vector3.Distance(p1, p2);
      const pathSeg = BABYLON.MeshBuilder.CreateBox("path", {width: dist, height: 0.04, depth: 1.2}, scene);
      pathSeg.position = mid;
      pathSeg.lookAt(p2);
      pathSeg.parent = islandRoot;
      pathSeg.material = dirtMat;
    }

    // ============================================================
    //  TABLE SURFACE (tabletop look)
    // ============================================================
    const table = BABYLON.MeshBuilder.CreateGround("table", {width: 300, height: 300}, scene);
    table.position.y = -38;
    const tableMat = new BABYLON.StandardMaterial("tableMat", scene);
    tableMat.diffuseColor = new BABYLON.Color3(0.18, 0.13, 0.08);
    tableMat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);
    table.material = tableMat;
    table.receiveShadows = true;

    // ============================================================
    //  ATMOSPHERE PARTICLES
    // ============================================================
    const atmPS = new BABYLON.ParticleSystem("atm", 300, scene);
    atmPS.particleTexture = new BABYLON.Texture(createParticleTex(), scene);
    atmPS.emitter = new BABYLON.Vector3(0, 10, 0);
    atmPS.minEmitBox = new BABYLON.Vector3(-20, 0, -20);
    atmPS.maxEmitBox = new BABYLON.Vector3(20, 12, 20);
    atmPS.color1 = new BABYLON.Color4(1, 0.95, 0.7, 0.15);
    atmPS.color2 = new BABYLON.Color4(0.8, 0.9, 1, 0.1);
    atmPS.colorDead = new BABYLON.Color4(0.6, 0.7, 0.8, 0);
    atmPS.minSize = 0.03; atmPS.maxSize = 0.12;
    atmPS.minLifeTime = 4; atmPS.maxLifeTime = 10;
    atmPS.emitRate = 25;
    atmPS.gravity = new BABYLON.Vector3(0, 0.08, 0);
    atmPS.direction1 = new BABYLON.Vector3(-0.3, 0.5, -0.3);
    atmPS.direction2 = new BABYLON.Vector3(0.3, 1, 0.3);
    atmPS.minEmitPower = 0.1; atmPS.maxEmitPower = 0.4;
    atmPS.updateSpeed = 0.008;
    atmPS.start();

    // ============================================================
    //  ANIMATION LOOP
    // ============================================================
    let time = 0;
    scene.registerBeforeRender(() => {
      const dt = engine.getDeltaTime() / 1000;
      time += dt;

      // Gentle floating
      islandRoot.position.y = Math.sin(time * 0.4) * 0.6;
      islandRoot.rotation.y = Math.sin(time * 0.08) * 0.015;

      // Water wheel
      wheelNode.rotation.x += 1.5 * dt;

      // Flag wave
      flag.rotation.z = Math.sin(time * 3) * 0.08;

      // River shimmer (subtle vertex wobble)
      // (Optional: could animate texture offset)
    });

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
