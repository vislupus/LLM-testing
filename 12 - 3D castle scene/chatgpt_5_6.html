<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floating Castle Diorama — Babylon.js</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#9fc8df; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #renderCanvas { width:100%; height:100%; display:block; touch-action:none; outline:none; }
    #hud { position:fixed; inset:0; pointer-events:none; color:#f7fbff; text-shadow:0 2px 8px rgba(20,35,45,.55); }
    .title { position:absolute; left:26px; top:22px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; font-size:13px; opacity:.92; }
    .subtitle { display:block; margin-top:8px; letter-spacing:.02em; text-transform:none; font-weight:500; font-size:12px; opacity:.8; }
    .panel { position:absolute; right:22px; top:20px; padding:12px 14px; border:1px solid rgba(255,255,255,.32); border-radius:14px; background:linear-gradient(135deg,rgba(20,45,58,.34),rgba(20,45,58,.12)); backdrop-filter:blur(10px); box-shadow:0 12px 40px rgba(32,59,72,.18); font-size:12px; line-height:1.7; }
    .panel b { color:#ffe4a3; }
    .badge { position:absolute; left:26px; bottom:24px; padding:9px 12px; border-radius:999px; background:rgba(26,54,68,.28); border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(8px); font-size:11px; letter-spacing:.04em; }
    #loading { position:fixed; inset:0; display:grid; place-items:center; background:radial-gradient(circle at 50% 42%,#cfe5ee 0,#90bdd2 45%,#6c9eb8 100%); color:#17384a; z-index:10; transition:opacity .7s ease; }
    #loading.hidden { opacity:0; pointer-events:none; }
    #loading div { text-align:center; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    #loading span { display:block; font-weight:500; text-transform:none; letter-spacing:.02em; margin-top:9px; opacity:.72; font-size:12px; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    <div class="title">The Skyhold of Alderfall<span class="subtitle">A handcrafted floating-island fantasy diorama</span></div>
    <div class="panel"><b>Drag</b> orbit · <b>Wheel</b> zoom<br><b>Right drag</b> pan · <b>R</b> reset view<br><b>C</b> cinematic orbit · <b>F</b> fullscreen</div>
    <div class="badge">Procedural geometry · no external models or textures</div>
  </div>
  <div id="loading"><div>Building the island<span>Carving cliffs, raising towers, planting pines…</span></div></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, antialias: true });
    engine.setHardwareScalingLevel(Math.min(1.35, window.devicePixelRatio || 1));

    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.63, 0.79, 0.88, 1);
    scene.ambientColor = new BABYLON.Color3(0.42, 0.46, 0.5);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.0065;
    scene.fogColor = new BABYLON.Color3(0.69, 0.82, 0.88);

    const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI * 0.62, 1.05, 92, new BABYLON.Vector3(0, 5, 0), scene);
    camera.lowerRadiusLimit = 35;
    camera.upperRadiusLimit = 150;
    camera.lowerBetaLimit = 0.38;
    camera.upperBetaLimit = 1.48;
    camera.wheelDeltaPercentage = 0.012;
    camera.panningSensibility = 110;
    camera.angularSensibilityX = 850;
    camera.angularSensibilityY = 850;
    camera.attachControl(canvas, true);

    // Palette
    const C = {
      stone: '#8f9ca2', stoneDark: '#5e6b71', stoneLight: '#b8c1c3', mortar: '#738087',
      wood: '#7a452c', woodDark: '#4b2b22', roof: '#33555a', roof2: '#6a3035',
      grass: '#65985b', grassLight: '#83b86d', grassDark: '#3f7145', earth: '#725943',
      cliff: '#6c6864', cliffDark: '#454548', cliffLight: '#958b7d',
      water: '#28aeb3', waterLight: '#74e2d2', gold: '#e6b95d', red: '#a33c3a',
      cream: '#e8ddc2', pine: '#2f6550', pineLight: '#4b8463', flower: '#e9728f'
    };

    const materials = {};
    function mat(name, color, opts = {}) {
      const m = new BABYLON.StandardMaterial(name, scene);
      m.diffuseColor = BABYLON.Color3.FromHexString(color);
      m.specularColor = new BABYLON.Color3(opts.specular ?? 0.08, opts.specular ?? 0.08, opts.specular ?? 0.08);
      if (opts.emissive) m.emissiveColor = BABYLON.Color3.FromHexString(opts.emissive);
      if (opts.alpha != null) m.alpha = opts.alpha;
      if (opts.backFaceCulling === false) m.backFaceCulling = false;
      if (opts.disableLighting) m.disableLighting = true;
      return m;
    }
    materials.stone = mat('stone', C.stone, {specular:.04});
    materials.stoneDark = mat('stoneDark', C.stoneDark, {specular:.03});
    materials.stoneLight = mat('stoneLight', C.stoneLight, {specular:.05});
    materials.wood = mat('wood', C.wood, {specular:.03});
    materials.woodDark = mat('woodDark', C.woodDark, {specular:.02});
    materials.roof = mat('roof', C.roof, {specular:.11});
    materials.roof2 = mat('roof2', C.roof2, {specular:.08});
    materials.grass = mat('grass', C.grass, {specular:.02});
    materials.grassLight = mat('grassLight', C.grassLight, {specular:.02});
    materials.grassDark = mat('grassDark', C.grassDark, {specular:.02});
    materials.earth = mat('earth', C.earth, {specular:.01});
    materials.cliff = mat('cliff', C.cliff, {specular:.02});
    materials.cliffDark = mat('cliffDark', C.cliffDark, {specular:.02});
    materials.cliffLight = mat('cliffLight', C.cliffLight, {specular:.03});
    materials.gold = mat('gold', C.gold, {specular:.65, emissive:'#5d4312'});
    materials.red = mat('red', C.red, {specular:.08});
    materials.cream = mat('cream', C.cream, {specular:.02});
    materials.pine = mat('pine', C.pine, {specular:.02});
    materials.pineLight = mat('pineLight', C.pineLight, {specular:.02});
    materials.flower = mat('flower', C.flower, {specular:.04, emissive:'#38121d'});
    materials.window = mat('window', '#ffd680', {emissive:'#ffad3b', specular:.15});
    materials.water = mat('water', C.water, {alpha:.78, specular:.55, emissive:'#073f45', backFaceCulling:false});
    materials.waterLight = mat('waterLight', C.waterLight, {alpha:.48, specular:.4, emissive:'#0e4d50', backFaceCulling:false});
    materials.cloud = mat('cloud', '#f4fbff', {alpha:.72, specular:0, emissive:'#20313a'});

    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(-0.3, 1, 0.2), scene);
    hemi.intensity = 0.82;
    hemi.diffuse = new BABYLON.Color3(0.82, 0.92, 1.0);
    hemi.groundColor = new BABYLON.Color3(0.29, 0.23, 0.20);

    const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.55, -1, 0.38), scene);
    sun.position = new BABYLON.Vector3(45, 70, -40);
    sun.intensity = 2.0;
    sun.diffuse = new BABYLON.Color3(1.0, 0.88, 0.72);

    const shadow = new BABYLON.ShadowGenerator(2048, sun);
    shadow.useBlurExponentialShadowMap = true;
    shadow.blurKernel = 32;
    shadow.bias = 0.0007;
    shadow.normalBias = 0.025;

    const casterMeshes = [];
    function cast(mesh) { shadow.addShadowCaster(mesh); mesh.receiveShadows = true; casterMeshes.push(mesh); return mesh; }

    function box(name, size, pos, material, rot = BABYLON.Vector3.Zero()) {
      const mesh = BABYLON.MeshBuilder.CreateBox(name, { width:size.x, height:size.y, depth:size.z }, scene);
      mesh.position.copyFrom(pos); mesh.rotation.copyFrom(rot); mesh.material = material; return cast(mesh);
    }
    function cyl(name, diameter, height, pos, material, tess = 16, rot = BABYLON.Vector3.Zero()) {
      const mesh = BABYLON.MeshBuilder.CreateCylinder(name, { diameter, height, tessellation:tess }, scene);
      mesh.position.copyFrom(pos); mesh.rotation.copyFrom(rot); mesh.material = material; return cast(mesh);
    }
    function sphere(name, diameter, pos, material, seg = 12) {
      const mesh = BABYLON.MeshBuilder.CreateSphere(name, { diameter, segments:seg }, scene);
      mesh.position.copyFrom(pos); mesh.material = material; return cast(mesh);
    }

    // Floating island: concentric irregular rings form a sculpted top and tapered rocky underside.
    function createIsland() {
      const mesh = new BABYLON.Mesh('floatingIsland', scene);
      const radialSegments = 112, topRings = 14;
      const positions = [], indices = [], colors = [];
      const ringOffsets = [];
      function radiusNoise(a, seed) {
        return Math.sin(a*3+seed)*1.35 + Math.sin(a*7-seed*.4)*0.72 + Math.sin(a*13+seed)*0.28;
      }
      // Top surface rings
      for (let r=0; r<=topRings; r++) {
        ringOffsets.push(positions.length/3);
        const t = r/topRings;
        for (let i=0; i<radialSegments; i++) {
          const a = i/radialSegments*Math.PI*2;
          const rad = t*(39 + radiusNoise(a, 1.7)*t);
          const x = Math.cos(a)*rad;
          const z = Math.sin(a)*rad*0.82;
          const hill = 6.4*Math.exp(-(x*x+z*z)/470) + 2.0*Math.exp(-((x+12)*(x+12)+(z-7)*(z-7))/160);
          const rip = Math.sin(x*.22)*Math.cos(z*.18)*.34 + Math.sin((x+z)*.14)*.2;
          const edgeDrop = -Math.pow(t,7)*2.6;
          const y = 2.8 + hill + rip + edgeDrop;
          positions.push(x,y,z);
          const blend = Math.max(0, Math.min(1, 0.58 + rip*.08 + hill*.02));
          colors.push(0.25+blend*.18, 0.43+blend*.22, 0.24+blend*.15, 1);
        }
      }
      for (let r=0; r<topRings; r++) {
        const a0=ringOffsets[r], a1=ringOffsets[r+1];
        for (let i=0; i<radialSegments; i++) {
          const n=(i+1)%radialSegments;
          indices.push(a0+i,a1+i,a1+n, a0+i,a1+n,a0+n);
        }
      }
      // Cliff and underside rings
      let prevOffset = ringOffsets[ringOffsets.length-1];
      const lower = [
        {y:-2.5, scale:.98}, {y:-10, scale:.82}, {y:-19, scale:.55}, {y:-27, scale:.25}, {y:-33, scale:.05}
      ];
      lower.forEach((layer, li) => {
        const off = positions.length/3;
        for (let i=0; i<radialSegments; i++) {
          const a=i/radialSegments*Math.PI*2;
          const topRad = 39 + radiusNoise(a,1.7);
          const jag = radiusNoise(a, 5.3+li)*(.45 + li*.25);
          const rad = Math.max(.5, topRad*layer.scale + jag);
          positions.push(Math.cos(a)*rad, layer.y + Math.sin(a*5+li)*.45, Math.sin(a)*rad*.82);
          const shade = .40 - li*.045 + (Math.sin(a*9)+1)*.018;
          colors.push(shade,shade*.96,shade*.91,1);
        }
        for (let i=0;i<radialSegments;i++) {
          const n=(i+1)%radialSegments;
          indices.push(prevOffset+i,off+i,off+n, prevOffset+i,off+n,prevOffset+n);
        }
        prevOffset=off;
      });
      const normals=[];
      BABYLON.VertexData.ComputeNormals(positions,indices,normals);
      const vd=new BABYLON.VertexData();
      vd.positions=positions; vd.indices=indices; vd.normals=normals; vd.colors=colors;
      vd.applyToMesh(mesh);
      const m=new BABYLON.StandardMaterial('islandMat',scene);
      m.diffuseColor=new BABYLON.Color3(1,1,1); m.specularColor=new BABYLON.Color3(.02,.02,.02);
      m.vertexColorUseAlpha=false; mesh.material=m; mesh.receiveShadows=true;
      return mesh;
    }
    createIsland();

    // Underside rock plates for stronger tabletop silhouette.
    for (let i=0;i<28;i++) {
      const a=i/28*Math.PI*2, r=29+Math.sin(i*2.1)*5;
      const rock=cyl('cliffPlate'+i, 5+Math.random()*5, 11+Math.random()*10,
        new BABYLON.Vector3(Math.cos(a)*r, -7-Math.random()*8, Math.sin(a)*r*.82),
        i%3===0?materials.cliffLight:(i%2?materials.cliff:materials.cliffDark), 6,
        new BABYLON.Vector3((Math.random()-.5)*.35,0,(Math.random()-.5)*.35));
      rock.scaling.x=.7+Math.random()*.7;
    }

    // Castle hill terraces
    cyl('castleHill0', 34, 4.2, new BABYLON.Vector3(0,8.2,0), materials.grassDark, 48);
    cyl('castleHill1', 28, 3.2, new BABYLON.Vector3(0,11.1,0), materials.grass, 48);
    cyl('castleHill2', 22, 2.2, new BABYLON.Vector3(0,13.4,0), materials.grassLight, 48);
    for (let i=0;i<44;i++) {
      const a=i/44*Math.PI*2; box('terraceStone'+i,new BABYLON.Vector3(2.2,1.4,1.15),new BABYLON.Vector3(Math.cos(a)*16.6,9.2,Math.sin(a)*16.6),materials.stoneDark,new BABYLON.Vector3(0,-a,0));
    }

    function battlementsAroundRect(cx,cy,cz,w,d,spacing=2.15) {
      for(let x=-w/2;x<=w/2;x+=spacing){
        box('merlon',new BABYLON.Vector3(1.15,1.15,1.0),new BABYLON.Vector3(cx+x,cy,cz-d/2),materials.stoneLight);
        box('merlon',new BABYLON.Vector3(1.15,1.15,1.0),new BABYLON.Vector3(cx+x,cy,cz+d/2),materials.stoneLight);
      }
      for(let z=-d/2+spacing;z<=d/2-spacing;z+=spacing){
        box('merlon',new BABYLON.Vector3(1.0,1.15,1.15),new BABYLON.Vector3(cx-w/2,cy,cz+z),materials.stoneLight);
        box('merlon',new BABYLON.Vector3(1.0,1.15,1.15),new BABYLON.Vector3(cx+w/2,cy,cz+z),materials.stoneLight);
      }
    }
    function crenellateTower(x,y,z,r,count=12) {
      for(let i=0;i<count;i++){
        const a=i/count*Math.PI*2;
        box('towerMerlon',new BABYLON.Vector3(1.15,1.3,1.15),new BABYLON.Vector3(x+Math.cos(a)*(r-.2),y,z+Math.sin(a)*(r-.2)),materials.stoneLight,new BABYLON.Vector3(0,-a,0));
      }
    }
    function flag(x,y,z,colorMat,phase=0) {
      cyl('flagPole',.13,6,new BABYLON.Vector3(x,y+3,z),materials.gold,8);
      const cloth=box('flag',new BABYLON.Vector3(3.1,1.45,.08),new BABYLON.Vector3(x+1.55,y+5.1,z),colorMat);
      cloth.metadata={phase}; cloth.rotation.z=.08;
      return cloth;
    }

    // Castle outer walls and gate.
    const castleY=16.1;
    box('northWall',new BABYLON.Vector3(29,5.4,2),new BABYLON.Vector3(0,castleY+2.7,-13),materials.stone);
    box('southWallL',new BABYLON.Vector3(10.5,5.4,2),new BABYLON.Vector3(-9.25,castleY+2.7,13),materials.stone);
    box('southWallR',new BABYLON.Vector3(10.5,5.4,2),new BABYLON.Vector3(9.25,castleY+2.7,13),materials.stone);
    box('westWall',new BABYLON.Vector3(2,5.4,24),new BABYLON.Vector3(-14.5,castleY+2.7,0),materials.stone);
    box('eastWall',new BABYLON.Vector3(2,5.4,24),new BABYLON.Vector3(14.5,castleY+2.7,0),materials.stone);
    battlementsAroundRect(0,castleY+6,0,29,26,2.4);

    // Gatehouse
    box('gatehouse',new BABYLON.Vector3(9,8,4.8),new BABYLON.Vector3(0,castleY+4.0,12),materials.stoneDark);
    box('gateOpening',new BABYLON.Vector3(3.8,5.8,.65),new BABYLON.Vector3(0,castleY+2.3,14.45),materials.woodDark);
    for(let i=-1;i<=1;i+=2) {
      cyl('gateTower',5.4,10,new BABYLON.Vector3(i*5.3,castleY+5,11.5),materials.stone,18);
      crenellateTower(i*5.3,castleY+10.6,11.5,2.5,10);
    }
    for(let i=-2;i<=2;i++) box('portcullis',new BABYLON.Vector3(.18,5.2,.25),new BABYLON.Vector3(i*.72,castleY+2.4,14.85),materials.gold);
    for(let j=0;j<4;j++) box('portcullisH',new BABYLON.Vector3(3.8,.16,.25),new BABYLON.Vector3(0,castleY+.5+j*1.35,14.85),materials.gold);

    // Corner towers
    [[-14,-12],[14,-12],[-14,12],[14,12]].forEach((p,i)=>{
      cyl('cornerTower'+i,7.1,12,new BABYLON.Vector3(p[0],castleY+6,p[1]),materials.stone,20);
      crenellateTower(p[0],castleY+12.7,p[1],3.25,12);
      for(let k=0;k<4;k++){
        const a=k*Math.PI/2;
        box('towerWindow',new BABYLON.Vector3(.55,1.4,.18),new BABYLON.Vector3(p[0]+Math.sin(a)*3.56,castleY+7.2,p[1]+Math.cos(a)*3.56),materials.window,new BABYLON.Vector3(0,a,0));
      }
    });

    // Keep and chapel
    box('keep',new BABYLON.Vector3(12,14,11),new BABYLON.Vector3(0,castleY+7.1,-1.2),materials.stoneLight);
    battlementsAroundRect(0,castleY+14.65,-1.2,12,11,1.95);
    box('keepDoor',new BABYLON.Vector3(2.2,4,.25),new BABYLON.Vector3(0,castleY+2.2,4.36),materials.woodDark);
    for(let floor=0;floor<3;floor++) for(let side=-1;side<=1;side+=2) {
      box('keepWindow',new BABYLON.Vector3(.8,1.5,.2),new BABYLON.Vector3(side*3.5,castleY+5+floor*3,4.38),materials.window);
      box('keepWindow',new BABYLON.Vector3(.8,1.5,.2),new BABYLON.Vector3(side*3.5,castleY+5+floor*3,-6.78),materials.window);
    }
    // Keep roof pavilion
    cyl('keepRoof',16,3.2,new BABYLON.Vector3(0,castleY+17.1,-1.2),materials.roof2,4,new BABYLON.Vector3(0,Math.PI/4,0));
    cyl('roofFinial',.5,4,new BABYLON.Vector3(0,castleY+20,-1.2),materials.gold,10);
    sphere('finialBall',.95,new BABYLON.Vector3(0,castleY+22,-1.2),materials.gold,10);
    flag(0,castleY+18,-1.2,materials.red,0);

    box('chapel',new BABYLON.Vector3(7,7,10),new BABYLON.Vector3(-8.7,castleY+3.5,-3),materials.cream);
    // chapel roof
    const roofL=box('chapelRoofL',new BABYLON.Vector3(5.8,.65,11),new BABYLON.Vector3(-10.25,castleY+7.5,-3),materials.roof,new BABYLON.Vector3(0,0,-.62));
    const roofR=box('chapelRoofR',new BABYLON.Vector3(5.8,.65,11),new BABYLON.Vector3(-7.15,castleY+7.5,-3),materials.roof,new BABYLON.Vector3(0,0,.62));
    box('chapelDoor',new BABYLON.Vector3(1.6,3.4,.2),new BABYLON.Vector3(-8.7,castleY+1.8,2.05),materials.woodDark);
    for(let i=0;i<3;i++) box('chapelWindow',new BABYLON.Vector3(.55,1.55,.2),new BABYLON.Vector3(-11.4+i*2.7,castleY+4.4,2.1),materials.window);

    // Courtyard details and flags
    for(let i=-2;i<=2;i++) box('courtyardTile',new BABYLON.Vector3(2.2,.16,8),new BABYLON.Vector3(i*2.4,castleY+.18,7.1),i%2?materials.stoneDark:materials.stoneLight);
    cyl('fountainBase',4.4,.7,new BABYLON.Vector3(7,castleY+.5,5.5),materials.stoneDark,24);
    cyl('fountainBowl',2.8,.5,new BABYLON.Vector3(7,castleY+1.2,5.5),materials.water,24);
    cyl('fountainStem',.55,2.4,new BABYLON.Vector3(7,castleY+2.0,5.5),materials.stoneLight,16);
    flag(-14,castleY+12.5,-12,materials.red,1.1);
    flag(14,castleY+12.5,-12,materials.red,2.2);

    // Castle road and bridge approach.
    for(let i=0;i<18;i++) box('roadStone',new BABYLON.Vector3(2.2,.22,2.3),new BABYLON.Vector3(Math.sin(i*.45)*.7,12.7-i*.18,15+i*1.5),i%3===0?materials.stoneLight:materials.stoneDark,new BABYLON.Vector3(0,Math.sin(i*.3)*.04,0));

    function house(x,y,z,s=1,roofMat=materials.roof,rot=0,detail=true) {
      const root=new BABYLON.TransformNode('houseRoot',scene); root.position.set(x,y,z); root.rotation.y=rot;
      const body=box('houseBody',new BABYLON.Vector3(5.2*s,3.8*s,4.5*s),new BABYLON.Vector3(0,1.9*s,0),materials.cream); body.parent=root;
      // timber frame
      const beams=[];
      [[-2.25,0],[2.25,0]].forEach(p=>{ const b=box('beam',new BABYLON.Vector3(.34*s,3.9*s,.18*s),new BABYLON.Vector3(p[0]*s,2*s,2.29*s),materials.woodDark); b.parent=root; beams.push(b); });
      const topBeam=box('beamTop',new BABYLON.Vector3(5*s,.3*s,.18*s),new BABYLON.Vector3(0,3.3*s,2.29*s),materials.woodDark); topBeam.parent=root;
      const cross1=box('crossBeam1',new BABYLON.Vector3(3.2*s,.25*s,.16*s),new BABYLON.Vector3(-1*s,2.2*s,2.31*s),materials.woodDark,new BABYLON.Vector3(0,0,.55)); cross1.parent=root;
      const cross2=box('crossBeam2',new BABYLON.Vector3(3.2*s,.25*s,.16*s),new BABYLON.Vector3(1*s,2.2*s,2.31*s),materials.woodDark,new BABYLON.Vector3(0,0,-.55)); cross2.parent=root;
      const left=box('roofL',new BABYLON.Vector3(3.8*s,.5*s,5.4*s),new BABYLON.Vector3(-1.5*s,4.15*s,0),roofMat,new BABYLON.Vector3(0,0,-.62)); left.parent=root;
      const right=box('roofR',new BABYLON.Vector3(3.8*s,.5*s,5.4*s),new BABYLON.Vector3(1.5*s,4.15*s,0),roofMat,new BABYLON.Vector3(0,0,.62)); right.parent=root;
      const door=box('door',new BABYLON.Vector3(1.15*s,2.25*s,.2*s),new BABYLON.Vector3(0,1.15*s,2.35*s),materials.wood); door.parent=root;
      const window1=box('window',new BABYLON.Vector3(.8*s,.9*s,.18*s),new BABYLON.Vector3(-1.55*s,2.15*s,2.36*s),materials.window); window1.parent=root;
      const window2=box('window',new BABYLON.Vector3(.8*s,.9*s,.18*s),new BABYLON.Vector3(1.55*s,2.15*s,2.36*s),materials.window); window2.parent=root;
      if(detail){
        const chimney=box('chimney',new BABYLON.Vector3(.65*s,2.1*s,.65*s),new BABYLON.Vector3(1.35*s,5.35*s,-.9*s),materials.stoneDark); chimney.parent=root;
        const planter=box('planter',new BABYLON.Vector3(1.3*s,.3*s,.45*s),new BABYLON.Vector3(-1.55*s,1.5*s,2.55*s),materials.wood); planter.parent=root;
        for(let i=0;i<4;i++){ const f=sphere('flower',.28*s,new BABYLON.Vector3(-2.0*s+i*.32*s,1.85*s,2.54*s),materials.flower,7); f.parent=root; }
      }
      return root;
    }

    // Village crescent
    const homes=[
      [-23,8.1,13,1.0,.25],[-28,6.6,7,.9,.48],[-29,5.5,-1,.85,.65],[-25,5.5,-10,1.05,.9],[-18,7.1,-15,.95,1.0],
      [18,8.0,15,.9,-.3],[24,6.8,10,1.05,-.5],[28,5.8,3,.86,-.8],[26,5.5,-7,.96,-1.0],[20,6.5,-14,1.0,-1.1],
      [-12,8.3,21,.78,.08],[11,8.4,22,.8,-.08]
    ];
    homes.forEach((h,i)=>house(h[0],h[1],h[2],h[3],i%3===0?materials.roof2:materials.roof,h[4],true));

    // Tavern
    const tavern=house(-18,7.9,4,1.35,materials.roof2,.38,true);
    box('tavernSignPole',new BABYLON.Vector3(.22,3,.22),new BABYLON.Vector3(-14.8,10.2,7),materials.woodDark);
    const sign=box('tavernSign',new BABYLON.Vector3(2.4,1.25,.22),new BABYLON.Vector3(-13.7,10.6,7),materials.wood);
    box('signMug',new BABYLON.Vector3(.7,.55,.15),new BABYLON.Vector3(-13.7,10.6,6.86),materials.gold);

    // Market square
    for(let i=0;i<3;i++){
      const x=-6+i*6;
      box('stallCounter',new BABYLON.Vector3(4,.9,2.1),new BABYLON.Vector3(x,11.3,20),materials.wood);
      for(let j=-1;j<=1;j+=2) box('stallPole',new BABYLON.Vector3(.18,2.7,.18),new BABYLON.Vector3(x+j*1.7,12.8,20),materials.woodDark);
      const canopy=box('stallCanopy',new BABYLON.Vector3(4.5,.25,2.8),new BABYLON.Vector3(x,14.0,20),i%2?materials.red:materials.roof2,new BABYLON.Vector3(0,0,i%2?.08:-.08));
      for(let k=0;k<5;k++) sphere('marketGoods',.45,new BABYLON.Vector3(x-1.2+k*.6,12,19.6),k%2?materials.gold:materials.flower,8);
    }
    cyl('marketWell',3.1,1.2,new BABYLON.Vector3(8,11.6,17.5),materials.stoneDark,18);
    cyl('wellWater',2.35,.16,new BABYLON.Vector3(8,12.25,17.5),materials.water,18);
    for(let i=-1;i<=1;i+=2) box('wellPost',new BABYLON.Vector3(.25,3,.25),new BABYLON.Vector3(8+i*1.5,13.1,17.5),materials.woodDark);
    cyl('wellBeam',.25,3.2,new BABYLON.Vector3(8,14.4,17.5),materials.woodDark,8,new BABYLON.Vector3(0,0,Math.PI/2));

    // River ribbons through the island.
    const centerPath=[]; for(let i=0;i<=42;i++){ const z=-31+i*1.48; const x=8*Math.sin((z+9)*.095)-4; centerPath.push(new BABYLON.Vector3(x,6.6+Math.sin(z*.13)*.08,z)); }
    const left=[],right=[];
    for(let i=0;i<centerPath.length;i++){
      const p=centerPath[i]; const p0=centerPath[Math.max(0,i-1)], p1=centerPath[Math.min(centerPath.length-1,i+1)];
      const dir=p1.subtract(p0).normalize(); const side=new BABYLON.Vector3(-dir.z,0,dir.x);
      const width=3.5+Math.sin(i*.42)*.45;
      left.push(p.add(side.scale(width))); right.push(p.subtract(side.scale(width)));
    }
    const river=BABYLON.MeshBuilder.CreateRibbon('river',{pathArray:[left,right],closeArray:false,closePath:false,sideOrientation:BABYLON.Mesh.DOUBLESIDE,updatable:false},scene);
    river.material=materials.water; river.receiveShadows=true;
    // animated highlight ribbons
    const glints=[];
    for(let g=0;g<13;g++){
      const idx=2+g*3;
      const gl=BABYLON.MeshBuilder.CreateLines('riverGlint',{points:[left[idx].add(new BABYLON.Vector3(1,0.08,0)),right[idx].add(new BABYLON.Vector3(-1,0.08,0))]},scene);
      gl.color=new BABYLON.Color3(.65,1,.94); gl.alpha=.55; glints.push(gl);
    }

    // River banks and stepping stones
    for(let i=2;i<centerPath.length-2;i+=2){
      const p=centerPath[i];
      const p0=centerPath[i-1],p1=centerPath[i+1],dir=p1.subtract(p0).normalize(),side=new BABYLON.Vector3(-dir.z,0,dir.x);
      for(let s=-1;s<=1;s+=2){
        const rb=cyl('bankRock',1.2+Math.random()*1.4,.8+Math.random()*.9,p.add(side.scale((3.8+Math.random()*.8)*s)).add(new BABYLON.Vector3(0,-.1,0)),i%4?materials.cliff:materials.cliffLight,7,new BABYLON.Vector3((Math.random()-.5)*.2,0,(Math.random()-.5)*.2));
        rb.scaling.x=1.4;
      }
    }

    function bridgeAt(idx,width=10,angleAdjust=0) {
      const p=centerPath[idx], p0=centerPath[idx-1], p1=centerPath[idx+1];
      const dir=p1.subtract(p0).normalize(), angle=Math.atan2(dir.x,dir.z)+Math.PI/2+angleAdjust;
      const root=new BABYLON.TransformNode('bridgeRoot',scene); root.position.copyFrom(p); root.rotation.y=angle;
      for(let i=-5;i<=5;i++){
        const plank=box('bridgePlank',new BABYLON.Vector3(.75,.28,width),new BABYLON.Vector3(i*.78,0.45+Math.cos(i*.24)*.25,0),materials.wood); plank.parent=root;
      }
      for(let side=-1;side<=1;side+=2){
        for(let i=-5;i<=5;i+=2){ const post=box('bridgePost',new BABYLON.Vector3(.2,1.4,.2),new BABYLON.Vector3(i*.78,1.1,side*(width/2-.35)),materials.woodDark); post.parent=root; }
        const rail=box('bridgeRail',new BABYLON.Vector3(8.4,.18,.18),new BABYLON.Vector3(0,1.65,side*(width/2-.35)),materials.woodDark); rail.parent=root;
      }
    }
    bridgeAt(18,9); bridgeAt(31,10);

    // Riverside mill
    house(9,7.1,-14,1.25,materials.roof2,-.25,true);
    const millWheelRoot=new BABYLON.TransformNode('millWheelRoot',scene);
    millWheelRoot.position.set(5.8,7.2,-12.8);
    const wheel=cyl('millWheel',5.7,.55,BABYLON.Vector3.Zero(),materials.woodDark,24,new BABYLON.Vector3(Math.PI/2,0,0)); wheel.parent=millWheelRoot;
    const hub=cyl('wheelHub',.9,.85,BABYLON.Vector3.Zero(),materials.gold,16,new BABYLON.Vector3(Math.PI/2,0,0)); hub.parent=millWheelRoot;
    for(let i=0;i<10;i++){
      const a=i/10*Math.PI*2;
      const spoke=box('wheelSpoke',new BABYLON.Vector3(.22,4.8,.22),BABYLON.Vector3.Zero(),materials.wood,new BABYLON.Vector3(0,0,a));
      spoke.parent=millWheelRoot;
    }

    // Waterfalls spilling from both river ends.
    function waterfall(name,p,zSign){
      const pathA=[],pathB=[];
      for(let i=0;i<18;i++){
        const t=i/17; const y=p.y-1-t*25; const z=p.z+zSign*t*6; const x=p.x+Math.sin(t*8)*.25;
        pathA.push(new BABYLON.Vector3(x-2.7,y,z)); pathB.push(new BABYLON.Vector3(x+2.7,y,z));
      }
      const fall=BABYLON.MeshBuilder.CreateRibbon(name,{pathArray:[pathA,pathB],sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene); fall.material=materials.waterLight;
      for(let i=0;i<18;i++) sphere(name+'foam',.7+Math.random()*.65,new BABYLON.Vector3(p.x+(Math.random()-.5)*5.2,p.y-1.0+(Math.random()-.5)*.5,p.z+zSign*(Math.random()*1.4)),materials.waterLight,8);
      return fall;
    }
    waterfall('northWaterfall',centerPath[0],-1); waterfall('southWaterfall',centerPath[centerPath.length-1],1);

    function pine(x,y,z,s=1) {
      const root=new BABYLON.TransformNode('pineRoot',scene); root.position.set(x,y,z);
      const trunk=cyl('pineTrunk',.55*s,4.5*s,new BABYLON.Vector3(0,2.25*s,0),materials.woodDark,8); trunk.parent=root;
      for(let i=0;i<4;i++){
        const cone=BABYLON.MeshBuilder.CreateCylinder('pineTier',{diameterTop:0,diameterBottom:(4.6-i*.75)*s,height:3.6*s,tessellation:10},scene);
        cone.position.set(0,(4.0+i*1.65)*s,0); cone.material=i%2?materials.pine:materials.pineLight; cone.parent=root; cast(cone);
      }
      return root;
    }
    const treeSpots=[];
    for(let i=0;i<48;i++){
      const a=(i/48)*Math.PI*2 + Math.sin(i)*.2; const r=22+Math.random()*13;
      const x=Math.cos(a)*r, z=Math.sin(a)*r*.82;
      if(Math.abs(x)<9 && z>12) continue;
      if(Math.abs(x-(8*Math.sin((z+9)*.095)-4))<6) continue;
      treeSpots.push([x,4.9+6.4*Math.exp(-(x*x+z*z)/470),z,.72+Math.random()*.75]);
    }
    treeSpots.forEach(t=>pine(...t));

    // Bamboo grove
    for(let i=0;i<22;i++){
      const x=27+(Math.random()-.5)*7,z=-18+(Math.random()-.5)*9,s=.7+Math.random()*.7;
      const stem=cyl('bamboo',.22*s,7*s,new BABYLON.Vector3(x,8.2,z),materials.grassDark,8,new BABYLON.Vector3((Math.random()-.5)*.08,0,(Math.random()-.5)*.08));
      for(let j=0;j<4;j++) box('bambooLeaf',new BABYLON.Vector3(1.9*s,.08,.45*s),new BABYLON.Vector3(x+(Math.random()-.5)*.5,7+j*1.3,z+(Math.random()-.5)*.5),materials.grassLight,new BABYLON.Vector3((Math.random()-.5)*.5,Math.random()*Math.PI,(Math.random()-.5)*.5));
    }

    // Ruined watchtower at island edge.
    const wx=-32,wz=-17,wy=4.0;
    cyl('ruinTower',7.5,9,new BABYLON.Vector3(wx,wy+4.5,wz),materials.stoneDark,14);
    for(let i=0;i<14;i++) if(i!==2 && i!==3 && i!==9){
      const a=i/14*Math.PI*2; box('ruinMerlon',new BABYLON.Vector3(1.25,1.7,1.2),new BABYLON.Vector3(wx+Math.cos(a)*3.45,wy+9.7+(i%3===0?.7:0),wz+Math.sin(a)*3.45),materials.stoneLight,new BABYLON.Vector3(0,-a,0));
    }
    box('ruinBreak',new BABYLON.Vector3(3.2,6.2,1.1),new BABYLON.Vector3(wx+2.9,wy+6,wz+1.4),materials.cliffDark,new BABYLON.Vector3(.2,.4,.15));
    for(let i=0;i<11;i++) cyl('ruinRock',1+Math.random()*1.5,.7+Math.random()*1.2,new BABYLON.Vector3(wx+(Math.random()-.5)*9,wy+.4,wz+(Math.random()-.5)*8),i%2?materials.stoneDark:materials.stoneLight,6);

    // Rocks, flowers, fences and path details.
    for(let i=0;i<48;i++){
      const a=Math.random()*Math.PI*2,r=15+Math.random()*22,x=Math.cos(a)*r,z=Math.sin(a)*r*.82;
      if(Math.abs(x)<6 && Math.abs(z)<16) continue;
      const rr=cyl('landRock',.7+Math.random()*2.1,.5+Math.random()*1.4,new BABYLON.Vector3(x,5.1+6.4*Math.exp(-(x*x+z*z)/470),z),i%3?materials.cliff:materials.cliffLight,6,new BABYLON.Vector3(Math.random()*.5,Math.random()*Math.PI,Math.random()*.5)); rr.scaling.x=1.2+Math.random()*.8;
    }
    for(let i=0;i<90;i++){
      const a=Math.random()*Math.PI*2,r=14+Math.random()*23,x=Math.cos(a)*r,z=Math.sin(a)*r*.82;
      if(Math.random()<.55 && Math.abs(x)<12 && z>10) continue;
      sphere('tinyFlower',.18+Math.random()*.18,new BABYLON.Vector3(x,5.4+6.4*Math.exp(-(x*x+z*z)/470),z),i%4===0?materials.gold:materials.flower,6);
    }
    for(let i=0;i<12;i++){
      box('fencePost',new BABYLON.Vector3(.18,1.5,.18),new BABYLON.Vector3(17+i*1.3,8.0,-22),materials.woodDark);
      if(i<11) box('fenceRail',new BABYLON.Vector3(1.35,.14,.14),new BABYLON.Vector3(17.65+i*1.3,8.3,-22),materials.wood);
    }

    // Mist rings beneath and around the island.
    for(let i=0;i<9;i++){
      const tor=BABYLON.MeshBuilder.CreateTorus('mistRing',{diameter:72+i*4,thickness:.24,tessellation:128},scene);
      tor.position.y=-5-i*2.2; tor.scaling.z=.78; tor.material=materials.cloud; tor.visibility=.12; tor.rotation.x=(Math.random()-.5)*.08;
    }

    // Soft procedural clouds.
    const clouds=[];
    function cloud(x,y,z,s=1) {
      const root=new BABYLON.TransformNode('cloudRoot',scene); root.position.set(x,y,z); root.scaling.setAll(s);
      [[0,0,0,5],[4,1,0,4.5],[-4,.6,0,4.2],[1.5,1.8,1.2,3.8],[-1.8,1.4,-1.1,3.4]].forEach((p)=>{ const q=sphere('cloudPuff',p[3],new BABYLON.Vector3(p[0],p[1],p[2]),materials.cloud,10); q.parent=root; q.receiveShadows=false; });
      clouds.push(root); return root;
    }
    cloud(-45,34,-28,1.25); cloud(42,30,-8,.9); cloud(0,42,45,1.1); cloud(55,24,30,.75);

    // Warm lantern points in village and castle.
    const lanternSpots=[[-23,11,15],[-18,12,6],[-6,13,21],[6,13,21],[24,10,12],[27,9,-5],[0,22,13],[7,20,5]];
    lanternSpots.forEach((p,i)=>{
      sphere('lanternGlow',.45,new BABYLON.Vector3(...p),materials.window,8);
      if(i<5){ const l=new BABYLON.PointLight('lanternLight'+i,new BABYLON.Vector3(...p),scene); l.diffuse=new BABYLON.Color3(1,.52,.19); l.intensity=2.1; l.range=8; }
    });

    // Ambient birds.
    const birds=[];
    for(let i=0;i<9;i++){
      const root=new BABYLON.TransformNode('bird',scene);
      const l=box('birdWingL',new BABYLON.Vector3(1.3,.08,.38),new BABYLON.Vector3(-.55,0,0),materials.cliffDark,new BABYLON.Vector3(0,0,-.25));
      const r=box('birdWingR',new BABYLON.Vector3(1.3,.08,.38),new BABYLON.Vector3(.55,0,0),materials.cliffDark,new BABYLON.Vector3(0,0,.25));
      l.parent=root;r.parent=root; root.metadata={radius:42+i*1.8,speed:.035+i*.002,phase:i*.7,height:20+Math.sin(i)*5,l,r}; birds.push(root);
    }

    // Post processing.
    const pipeline=new BABYLON.DefaultRenderingPipeline('pipeline',true,scene,[camera]);
    pipeline.fxaaEnabled=true;
    pipeline.samples=4;
    pipeline.bloomEnabled=true;
    pipeline.bloomThreshold=.82;
    pipeline.bloomWeight=.18;
    pipeline.bloomKernel=48;
    pipeline.imageProcessingEnabled=true;
    pipeline.imageProcessing.contrast=1.13;
    pipeline.imageProcessing.exposure=1.05;
    pipeline.imageProcessing.toneMappingEnabled=true;
    pipeline.imageProcessing.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
    pipeline.imageProcessing.vignetteEnabled=true;
    pipeline.imageProcessing.vignetteWeight=1.1;
    pipeline.imageProcessing.vignetteStretch=.25;
    pipeline.imageProcessing.vignetteColor=new BABYLON.Color4(.08,.13,.16,1);

    // Animation
    let cinematic=true, time=0;
    scene.onBeforeRenderObservable.add(()=>{
      const dt=engine.getDeltaTime()/1000; time+=dt;
      millWheelRoot.rotation.z += dt*.55;
      glints.forEach((g,i)=>g.visibility=.22+.22*Math.sin(time*2.5+i*.8));
      clouds.forEach((c,i)=>{ c.position.x += dt*(.18+i*.02); if(c.position.x>70)c.position.x=-70; });
      scene.meshes.forEach(m=>{ if(m.name==='flag' && m.metadata){ const wave=Math.sin(time*3+m.metadata.phase); m.rotation.y=wave*.12; m.scaling.x=1+wave*.035; } });
      birds.forEach((b,i)=>{
        const a=time*b.metadata.speed*60+b.metadata.phase;
        b.position.set(Math.cos(a)*b.metadata.radius,b.metadata.height+Math.sin(a*2)*1.8,Math.sin(a)*b.metadata.radius*.75);
        b.rotation.y=-a+Math.PI/2;
        b.metadata.l.rotation.z=-.25+Math.sin(time*6+i)*.28;
        b.metadata.r.rotation.z=.25-Math.sin(time*6+i)*.28;
      });
      if(cinematic){ camera.alpha += dt*.028; camera.radius=86+Math.sin(time*.18)*5; camera.beta=1.02+Math.sin(time*.12)*.04; }
    });

    window.addEventListener('keydown',(e)=>{
      if(e.key.toLowerCase()==='r'){ camera.setPosition(new BABYLON.Vector3(58,52,-58)); camera.setTarget(new BABYLON.Vector3(0,7,0)); }
      if(e.key.toLowerCase()==='c') cinematic=!cinematic;
      if(e.key.toLowerCase()==='f') { if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
    });
    canvas.addEventListener('pointerdown',()=>{ cinematic=false; });
    window.addEventListener('resize',()=>engine.resize());

    // Initial framing
    camera.setPosition(new BABYLON.Vector3(62,54,-62));
    camera.setTarget(new BABYLON.Vector3(0,7,0));
    scene.executeWhenReady(()=>{
      document.getElementById('loading').classList.add('hidden');
      setTimeout(()=>document.getElementById('loading')?.remove(),900);
    });

    engine.runRenderLoop(()=>scene.render());
  })();
  </script>
</body>
</html>
