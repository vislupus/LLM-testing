<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Fantasy Floating Island Diorama</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0f1a}
#c{width:100%;height:100%;display:block}
#ui{position:fixed;top:12px;left:12px;color:#e8f0ff;font:14px/1.4 system-ui,Segoe UI,Roboto;background:rgba(10,15,26,.55);padding:10px 12px;border-radius:10px;backdrop-filter:blur(6px)}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">Floating Island • ArcRotate drag to orbit • Wheel to zoom</div>
<script>
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true);
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.05,0.08,0.15,1);

const camera=new BABYLON.ArcRotateCamera('cam',1.2,1.05,420,new BABYLON.Vector3(0,30,0),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=80;camera.upperRadiusLimit=800;

const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=0.9;
const dir=new BABYLON.DirectionalLight('dir',new BABYLON.Vector3(-0.4,-1,-0.3),scene);
dir.intensity=1.1;

const glow=new BABYLON.GlowLayer('glow',scene);
glow.intensity=0.55;

function mat(color,emissive=0){
  const m=new BABYLON.StandardMaterial('m',scene);
  m.diffuseColor=color;
  m.emissiveColor=color.scale(emissive);
  return m;
}

// Island
const island=BABYLON.MeshBuilder.CreateGround('island',{width:320,height:320,subdivisions:64},scene);
const islandMat=mat(new BABYLON.Color3(0.45,0.78,0.48),0.05);
island.material=islandMat;
const verts=island.getVerticesData(BABYLON.VertexBuffer.PositionKind);
for(let i=0;i<verts.length;i+=3){
  const x=verts[i], z=verts[i+2];
  const d=Math.sqrt(x*x+z*z);
  const h=18*Math.exp(-d*d/11000)+4*Math.sin(x*0.04)*Math.cos(z*0.04);
  verts[i+1]=Math.max(0,h);
}
island.updateVerticesData(BABYLON.VertexBuffer.PositionKind,verts);
island.position.y=0;

// Cliffs ring
for(let i=0;i<48;i++){
  const a=i/48*Math.PI*2;
  const r=150+Math.random()*20;
  const b=BABYLON.MeshBuilder.CreateBox('r'+i,{width:8,height:12+Math.random()*8,depth:8},scene);
  b.position.set(Math.cos(a)*r,6,Math.sin(a)*r);
  b.material=mat(new BABYLON.Color3(0.55,0.58,0.62));
  b.parent=island;
}

// River
const river=BABYLON.MeshBuilder.CreateGround('river',{width:140,height:40,subdivisions:1},scene);
river.position.set(0,0.2,90);
river.rotation.x=Math.PI/2.2;
const riverMat=mat(new BABYLON.Color3(0.2,0.75,0.85),0.1);
riverMat.alpha=0.85;
river.material=riverMat;

// Bridges
for(let k=-1;k<=1;k++){
  const br=BABYLON.MeshBuilder.CreateBox('br'+k,{width:10,height:1.2,depth:4},scene);
  br.position.set(0,0.8,90+k*12);
  br.material=mat(new BABYLON.Color3(0.65,0.45,0.3));
}

// Castle
const castleY=22;
const stone=mat(new BABYLON.Color3(0.75,0.75,0.78));
const roofRed=mat(new BABYLON.Color3(0.75,0.25,0.25),0.08);
const wood=mat(new BABYLON.Color3(0.72,0.52,0.34));

// base
const base=BABYLON.MeshBuilder.CreateBox('base',{width:56,height:8,depth:56},scene);
base.position.y=castleY+4;
base.material=stone;

// keep
const keep=BABYLON.MeshBuilder.CreateBox('keep',{width:16,height:34,depth:16},scene);
keep.position.y=castleY+25;
keep.material=stone;
const keepRoof=BABYLON.MeshBuilder.CreateCylinder('kroof',{diameterTop:0,diameterBottom:20,height:16,tessellation:6},scene);
keepRoof.position.y=castleY+47;
keepRoof.material=roofRed;
keepRoof.rotation.z=Math.PI/2;

// curtain walls
for(const [x,z] of [[28,0],[-28,0],[0,28],[0,-28]]){
  const w=BABYLON.MeshBuilder.CreateBox('w',{width:50,height:12,depth:6},scene);
  w.position.set(x,castleY+10,z);
  w.material=stone;
}

// battlements
for(let i=-1;i<=1;i+=2)for(let j=-1;j<=1;j+=2){
  const b=BABYLON.MeshBuilder.CreateBox('b',{width:5,height:4,depth:5},scene);
  b.position.set(i*20,castleY+18,j*20);
  b.material=stone;
}

// Village
function house(x,z,s=1,woodCol=true){
  const h=BABYLON.MeshBuilder.CreateBox('h',{width:7*s,height:5*s,depth:7*s},scene);
  h.position.set(x,castleY+2.5*s,z);
  h.material=wood;
  const r=BABYLON.MeshBuilder.CreateCylinder('r',{diameterTop:0,diameterBottom:9*s,height:6*s,tessellation:4},scene);
  r.position.set(x,castleY+6*s,z);
  r.material=roofRed;
}
const villagePos=[
 [-60,70],[-40,80],[-70,50],[ -30, -70],[ 45,-65],[70,-45],[80,30],[60,60],
 [-85, -30],[-50,-45],[35,75],[55,85]
];
villagePos.forEach(([x,z],i)=>house(x,z,1+i%2?1:0.8));

// Tavern
const tavern=BABYLON.MeshBuilder.CreateBox('tav',{width:12,height:7,depth:10},scene);
tavern.position.set(-45,castleY+3.5,40);
tavern.material=wood;
const tavRoof=BABYLON.MeshBuilder.CreateCylinder('tr',{diameterTop:0,diameterBottom:16,height:10,tessellation:4},scene);
tavRoof.position.set(-45,castleY+9,40);
tavRoof.material=roofRed;

// Market stalls
for(let i=0;i<6;i++){
  const s=BABYLON.MeshBuilder.CreateBox('s'+i,{width:3,height:2.5,depth:3},scene);
  const a=i*1.2;
  s.position.set(Math.cos(a)*70,castleY+1.25,Math.sin(a)*70);
  s.material=mat(new BABYLON.Color3(0.85,0.65,0.4));
}

// Riverside mill
const mill=BABYLON.MeshBuilder.CreateBox('mill',{width:8,height:10,depth:8},scene);
mill.position.set(80,castleY+5,100);
mill.material=wood;
const wheel=BABYLON.MeshBuilder.CreateCylinder('wheel',{diameter:6,height:1.2,tessellation:12},scene);
wheel.position.set(80,castleY+7,106);
wheel.rotation.z=Math.PI/2;
wheel.material=mat(new BABYLON.Color3(0.6,0.42,0.28));

// Ruined watchtower
const wt=BABYLON.MeshBuilder.CreateCylinder('wt',{diameter:10,height:26,tessellation:8},scene);
wt.position.set(130,castleY+13,-120);
wt.material=mat(new BABYLON.Color3(0.6,0.6,0.64));
wt.material.alpha=0.9;

// Trees
function pine(x,z){
  const g=new BABYLON.TransformNode('g',scene);
  g.position.set(x,castleY,z);
  const trunk=BABYLON.MeshBuilder.CreateCylinder('tr',{diameter:1.2,height:6},scene);
  trunk.position.y=3;trunk.parent=g;trunk.material=mat(new BABYLON.Color3(0.55,0.38,0.25));
  for(let i=0;i<3;i++){
    const c=BABYLON.MeshBuilder.CreateCylinder('c',{diameterTop:0,diameterBottom:7,height:8,tessellation:6},scene);
    c.position.y=7+i*6;c.parent=g;c.material=mat(new BABYLON.Color3(0.25,0.55,0.32),0.03);
  }
}
[[ -120, -80],[ 110,-90],[ -90,110],[ 120, 60],[ -70,-110],[ 100, -30]].forEach(p=>pine(p[0],p[1]));

// Flowers
for(let i=0;i<80;i++){
  const f=BABYLON.MeshBuilder.CreateSphere('f',{diameter:0.6},scene);
  f.position.set((Math.random()-0.5)*280,0.3,(Math.random()-0.5)*280);
  f.material=mat(new BABYLON.Color3(Math.random()*0.3+0.7,Math.random()*0.3+0.2,Math.random()*0.3+0.2),0.2);
}

// Waterfall particles
const ps=new BABYLON.ParticleSystem('water',2000,scene);
ps.particleTexture=new BABYLON.Texture('https://playground.babylonjs.com/textures/flare.png',scene);
ps.emitter=new BABYLON.Vector3(0,castleY+40, -150);
ps.minEmitBox=new BABYLON.Vector3(-2,0,0);ps.maxEmitBox=new BABYLON.Vector3(2,0,0);
ps.color1=new BABYLON.Color4(0.5,0.8,1,0.9);ps.color2=new BABYLON.Color4(0.3,0.6,0.9,0.6);
ps.minSize=0.2;ps.maxSize=0.6;ps.minLifeTime=2;ps.maxLifeTime=3.5;
ps.emitRate=400;ps.gravity=new BABYLON.Vector3(0,-9.8,0);ps.direction1=new BABYLON.Vector3(-1,-1,-0.2);ps.direction2=new BABYLON.Vector3(1,-1,0.2);
ps.start();

// Mist
const mist=new BABYLON.ParticleSystem('mist',800,scene);
mist.particleTexture=new BABYLON.Texture('https://playground.babylonjs.com/textures/flare.png',scene);
mist.emitter=new BABYLON.Vector3(0,castleY+30,0);
mist.minEmitBox=new BABYLON.Vector3(-60,0,-60);mist.maxEmitBox=new BABYLON.Vector3(60,0,60);
mist.color1=new BABYLON.Color4(1,1,1,0.03);mist.color2=new BABYLON.Color4(1,1,1,0.02);
mist.minSize=30;mist.maxSize=60;mist.minLifeTime=8;mist.maxLifeTime=12;
mist.emitRate=30;mist.gravity=new BABYLON.Vector3(0,0,0);mist.direction1=new BABYLON.Vector3(0,0.1,0);mist.direction2=new BABYLON.Vector3(0,0.2,0);
mist.start();

engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
</script>
</body>
</html>
