<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skyhold — a floating island diorama</title>
<style>
  :root{
    --ink:#0d1a20;
    --parchment:#efe3cc;
    --brass:#d9a441;
    --teal:#1f7f83;
    --deep:#08131a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--deep);}
  body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  #renderCanvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none;display:block;}

  /* ---- placard ---- */
  #placard{
    position:fixed;left:22px;bottom:22px;z-index:5;
    padding:14px 18px 13px 16px;
    border-left:2px solid var(--brass);
    background:linear-gradient(100deg,rgba(8,19,26,.62),rgba(8,19,26,.28));
    backdrop-filter:blur(9px) saturate(120%);
    -webkit-backdrop-filter:blur(9px) saturate(120%);
    color:var(--parchment);
    max-width:min(78vw,340px);
    opacity:0;transform:translateY(10px);
    transition:opacity .9s ease,transform .9s ease;
  }
  #placard.in{opacity:1;transform:none}
  .eyebrow{
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--brass);font-weight:600;margin-bottom:6px;
  }
  #placard h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-weight:500;font-size:26px;line-height:1;letter-spacing:.01em;margin-bottom:7px;
  }
  #placard p{font-size:12.5px;line-height:1.5;opacity:.78;}

  /* ---- controls ---- */
  #ctrls{
    position:fixed;right:20px;bottom:22px;z-index:5;display:flex;gap:8px;
    opacity:0;transition:opacity .9s ease .2s;
  }
  #ctrls.in{opacity:1}
  .btn{
    font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
    color:var(--parchment);background:rgba(8,19,26,.5);
    border:1px solid rgba(217,164,65,.35);border-radius:2px;
    padding:9px 13px;cursor:pointer;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:background .2s,border-color .2s,color .2s;
  }
  .btn:hover{background:rgba(217,164,65,.18);border-color:var(--brass)}
  .btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .btn[aria-pressed="true"]{color:var(--brass);border-color:rgba(217,164,65,.7)}

  #hint{
    position:fixed;top:20px;right:22px;z-index:5;
    font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(239,227,204,.55);text-align:right;line-height:1.9;
    opacity:0;transition:opacity 1s ease .4s;pointer-events:none;
  }
  #hint.in{opacity:1}

  /* ---- loader ---- */
  #loader{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(120% 90% at 50% 45%,#123244 0%,#08131a 70%);
    transition:opacity .8s ease;
  }
  #loader.out{opacity:0;pointer-events:none}
  .ring{width:44px;height:44px;border-radius:50%;border:1px solid rgba(239,227,204,.18);
    border-top-color:var(--brass);animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #stage{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(239,227,204,.7)}
  @media (prefers-reduced-motion:reduce){
    .ring{animation-duration:3s}
    #placard,#ctrls,#hint{transition:none}
  }
  @media (max-width:640px){
    #placard{left:14px;bottom:14px;padding:11px 14px}
    #placard h1{font-size:21px}
    #ctrls{right:14px;bottom:auto;top:14px}
    #hint{display:none}
  }
</style>
</head>
<body>
<canvas id="renderCanvas" aria-label="Interactive 3D floating island scene"></canvas>

<div id="placard">
  <div class="eyebrow">Diorama · Scale 1:120</div>
  <h1>Skyhold</h1>
  <p>A castle, its village and a river that runs out of world — held aloft on a single broken root of stone.</p>
</div>

<div id="ctrls">
  <button class="btn" id="btnSpin" aria-pressed="true">Drift</button>
  <button class="btn" id="btnView">Recenter</button>
</div>

<div id="hint">Drag to orbit<br>Scroll to zoom</div>

<div id="loader"><div class="ring"></div><div id="stage">waking the engine</div></div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
"use strict";
/* =========================================================================
   SKYHOLD — floating island diorama, Babylon.js, procedurally generated.
   ========================================================================= */

const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: true, disableWebGL2Support: false }, false);
engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 1.8));
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05, 0.10, 0.15, 1);

/* ---------------------------------------------------------------- math -- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0x5B15A9);
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[(rand() * arr.length) | 0];

function hash2(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return n - Math.floor(n); }
function vnoise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm2(x, y, oct) {
  oct = oct || 4; let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vnoise2(x * f, y * f); f *= 2; a *= 0.5; }
  return s;
}
function hash3(x, y, z) { const n = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return n - Math.floor(n); }
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = hash3(xi, yi, zi), c100 = hash3(xi + 1, yi, zi), c010 = hash3(xi, yi + 1, zi), c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1), c101 = hash3(xi + 1, yi, zi + 1), c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  return lerp(lerp(lerp(c000, c100, u), lerp(c010, c110, u), v), lerp(lerp(c001, c101, u), lerp(c011, c111, u), v), w);
}
function fbm3(x, y, z, oct) {
  oct = oct || 3; let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vnoise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
  return s;
}

/* ------------------------------------------------------------- palette -- */
const C = h => BABYLON.Color3.FromHexString(h);
const PAL = {
  grassA: C('#5CB143'), grassB: C('#84CE5C'), grassDark: C('#3B8437'), moss: C('#4F8F3E'),
  rock: C('#8E8D96'), rockDark: C('#5A5760'), rockWarm: C('#7E7160'), rockDeep: C('#413E48'),
  dirt: C('#A8804F'), sand: C('#DCC38C'),
  stone: C('#C5C0B2'), stoneDark: C('#9C9689'), stoneCool: C('#AFB2AE'),
  wood: C('#96683D'), woodDark: C('#563824'), plank: C('#B98A55'), plankPale: C('#CFA875'),
  plaster: C('#F3E7D2'), plasterWarm: C('#EAD6B4'),
  roofRed: C('#C0503F'), roofBlue: C('#4A6C95'), roofGreen: C('#4C7A5B'), thatch: C('#D2A75C'),
  leaf: C('#2E7A47'), leafB: C('#3D9757'), leafDark: C('#22593A'), leafGold: C('#8FA83C'),
  cloth: C('#CB4A44'), clothB: C('#3F62B6'), gold: C('#E8BB3E'), cream: C('#EFE3CC'),
  metal: C('#6E7378'), water: C('#2CC6C6'), foam: C('#DFF7F5'),
};

/* ----------------------------------------------------------- materials -- */
const matBase = new BABYLON.StandardMaterial("base", scene);
matBase.diffuseColor = new BABYLON.Color3(1, 1, 1);
matBase.specularColor = new BABYLON.Color3(0.05, 0.05, 0.06);
matBase.specularPower = 24;
matBase.ambientColor = new BABYLON.Color3(1, 1, 1);
matBase.backFaceCulling = true;

const matBaseTwo = new BABYLON.StandardMaterial("base2", scene);
matBaseTwo.diffuseColor = new BABYLON.Color3(1, 1, 1);
matBaseTwo.specularColor = new BABYLON.Color3(0.05, 0.05, 0.06);
matBaseTwo.backFaceCulling = false;
matBaseTwo.twoSidedLighting = true;

const matGlow = new BABYLON.StandardMaterial("glow", scene);
matGlow.diffuseColor = new BABYLON.Color3(0.9, 0.75, 0.45);
matGlow.emissiveColor = new BABYLON.Color3(1.0, 0.72, 0.30);
matGlow.specularColor = new BABYLON.Color3(0, 0, 0);

/* ------------------------------------------------- geometry collectors -- */
const STATICS = [], GLOWS = [];
let PARENT = null, TARGET = null;

function tint(m, col, ao, jit) {
  ao = ao === undefined ? 0.22 : ao;
  jit = jit === undefined ? 0.04 : jit;
  const p = m.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  const n = p.length / 3;
  const c = new Float32Array(n * 4);
  let miny = 1e9, maxy = -1e9;
  for (let i = 0; i < n; i++) { const y = p[i * 3 + 1]; if (y < miny) miny = y; if (y > maxy) maxy = y; }
  const span = Math.max(1e-3, maxy - miny);
  for (let i = 0; i < n; i++) {
    const t = (p[i * 3 + 1] - miny) / span;
    const f = (1 - ao) + ao * t + (rand() - 0.5) * jit;
    c[i * 4] = clamp(col.r * f, 0, 1);
    c[i * 4 + 1] = clamp(col.g * f, 0, 1);
    c[i * 4 + 2] = clamp(col.b * f, 0, 1);
    c[i * 4 + 3] = 1;
  }
  m.setVerticesData(BABYLON.VertexBuffer.ColorKind, c);
  return m;
}
function add(m, col, o) {
  o = o || {};
  tint(m, col, o.ao, o.jit);
  m.material = o.glow ? matGlow : (o.two ? matBaseTwo : matBase);
  m.isPickable = false;
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (PARENT) m.parent = PARENT;
  (TARGET || (o.glow ? GLOWS : STATICS)).push(m);
  return m;
}
function B(w, h, d, x, y, z, col, o) {
  const m = BABYLON.MeshBuilder.CreateBox("b", { width: w, height: h, depth: d }, scene);
  m.position.set(x, y, z); return add(m, col, o);
}
function CY(h, dt, db, x, y, z, col, o) {
  o = o || {};
  const m = BABYLON.MeshBuilder.CreateCylinder("c", { height: h, diameterTop: dt, diameterBottom: db, tessellation: o.tes || 12 }, scene);
  m.position.set(x, y, z); return add(m, col, o);
}
function SP(d, x, y, z, col, o) {
  o = o || {};
  const m = BABYLON.MeshBuilder.CreateSphere("s", { diameter: d, segments: o.seg || 8 }, scene);
  m.position.set(x, y, z);
  if (o.sx || o.sy || o.sz) m.scaling.set(o.sx || 1, o.sy || 1, o.sz || 1);
  return add(m, col, o);
}
function TO(d, th, x, y, z, col, o) {
  o = o || {};
  const m = BABYLON.MeshBuilder.CreateTorus("t", { diameter: d, thickness: th, tessellation: o.tes || 16 }, scene);
  m.position.set(x, y, z); return add(m, col, o);
}
/* triangular plate, points CCW in XY, extruded along Z */
function PR(pts, thick, x, y, z, col, o) {
  const t = thick / 2, pos = [];
  for (const s of [-t, t]) for (const q of pts) pos.push(q[0], q[1], s);
  const idx = [0, 2, 1, 3, 4, 5];
  for (let i = 0; i < 3; i++) { const a = i, b = (i + 1) % 3; idx.push(a, b, b + 3, a, b + 3, a + 3); }
  const nor = []; BABYLON.VertexData.ComputeNormals(pos, idx, nor);
  const vd = new BABYLON.VertexData();
  vd.positions = pos; vd.indices = idx; vd.normals = nor; vd.uvs = new Array(12).fill(0);
  const m = new BABYLON.Mesh("pr", scene); vd.applyToMesh(m);
  m.position.set(x, y, z); return add(m, col, o);
}

/* ====================================================== LAYOUT / TERRAIN */
const RIVER_CTRL = [[12.5, -12], [10.8, -8], [9.8, -3.5], [9.5, 1], [8.6, 5.5], [5.6, 10], [0.5, 13.5], [-4.5, 16.2], [-9.5, 19], [-13, 22], [-16, 25]];
function catmull(ctrl, seg) {
  const n = ctrl.length, P = i => ctrl[clamp(i, 0, n - 1)], out = [];
  for (let i = 0; i < n - 1; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let s = 0; s < seg; s++) {
      const t = s / seg, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  out.push([ctrl[n - 1][0], ctrl[n - 1][1]]);
  return out;
}
const RIVER = catmull(RIVER_CTRL, 26);
const RT = (() => {
  const len = [0];
  for (let i = 1; i < RIVER.length; i++) len[i] = len[i - 1] + Math.hypot(RIVER[i][0] - RIVER[i - 1][0], RIVER[i][1] - RIVER[i - 1][1]);
  const tot = len[len.length - 1];
  return len.map(l => l / tot);
})();
function nearestRiver(x, z) {
  let best = 1e9, bi = 0;
  for (let i = 0; i < RIVER.length; i++) {
    const dx = x - RIVER[i][0], dz = z - RIVER[i][1], d = dx * dx + dz * dz;
    if (d < best) { best = d; bi = i; }
  }
  return { d: Math.sqrt(best), t: RT[bi], i: bi };
}
function riverTangent(i) {
  const a = RIVER[Math.max(0, i - 1)], b = RIVER[Math.min(RIVER.length - 1, i + 1)];
  const dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz) || 1;
  return [dx / l, dz / l];
}
function riverSide(x, z) {
  const nr = nearestRiver(x, z), t = riverTangent(nr.i), p = RIVER[nr.i];
  return Math.sign(t[0] * (z - p[1]) - t[1] * (x - p[0])) || 1;
}
const waterY = t => 0.95 - 1.55 * Math.pow(clamp(t, 0, 1), 1.1);
const riverWidth = t => 2.0 + 1.7 * t;
const LAKE = { x: 12.5, z: -12, r: 3.2, y: waterY(0) };

function rimRadius(a) {
  return 21.0 + 2.3 * (fbm2(Math.cos(a) * 1.6 + 31.7, Math.sin(a) * 1.6 + 17.3, 4) - 0.47) * 2;
}
const PADS = [];
function terrainH(x, z) {
  const r = Math.hypot(x, z);
  let h = (fbm2(x * 0.075 + 11, z * 0.075 + 3, 4) - 0.47) * 2.4;
  h += (fbm2(x * 0.22 + 40, z * 0.22 + 7, 2) - 0.5) * 0.45;
  h -= z * 0.045 - x * 0.02;                                  /* gentle tilt toward the falls */
  h += 1.9 * Math.exp(-(((x - 12.5) * (x - 12.5) + (z + 12) * (z + 12)) / 150)); /* source highland */
  h -= smoothstep(16.5, 22.5, r) * 1.5;                        /* edge lip */
  const mound = smoothstep(10.2, 6.4, r);
  const flatTop = 2.1 + (fbm2(x * 0.3, z * 0.3, 2) - 0.5) * 0.4 * (1 - smoothstep(8.0, 6.2, r));
  h = lerp(h, flatTop, mound);
  const nr = nearestRiver(x, z), wy = waterY(nr.t);
  h = lerp(h, Math.max(h, wy + 0.75), smoothstep(9.0, 3.6, nr.d));
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
  h = lerp(h, Math.max(h, LAKE.y + 0.5), smoothstep(LAKE.r + 4.5, LAKE.r + 1.0, dl));
  h = lerp(h, LAKE.y - 1.15, smoothstep(LAKE.r + 1.6, LAKE.r - 0.6, dl));
  /* the channel is cut last so nothing can dam the river */
  h = lerp(h, wy - 0.66, smoothstep(3.6, 2.1, nr.d));
  /* levelled pads cut for buildings, set during layout */
  for (let i = 0; i < PADS.length; i++) {
    const p = PADS[i], d = Math.hypot(x - p.x, z - p.z);
    if (d < p.r) h = lerp(h, p.h, smoothstep(p.r, p.r * 0.5, d));
  }
  return h;
}

function slopeAt(x, z) {
  const e = 0.7;
  const dx = terrainH(x + e, z) - terrainH(x - e, z);
  const dz = terrainH(x, z + e) - terrainH(x, z - e);
  return Math.hypot(dx, dz) / (2 * e);
}

/* ------------------------------------------------ village + path layout -- */
const SPOTS = [];
let T_NEAR = { x: 12, z: 4 }, T_FAR = { x: -6, z: 13 }, BR1 = null, BR2 = null, PATH = [];
let MARKET = { x: 12, z: 6 };
const GATE = { x: Math.sin(0.30) * 5.6, z: Math.cos(0.30) * 5.6 };
const RUIN = { x: Math.cos(3.85) * 16.4, z: Math.sin(3.85) * 16.4 };
const MILL_T = 0.60;

function idxAtT(t) {
  let bi = 0, bd = 9;
  for (let i = 0; i < RIVER.length; i++) { const d = Math.abs(RT[i] - t); if (d < bd) { bd = d; bi = i; } }
  return bi;
}
/* a point offset from the river centreline; k > 0 = inner (castle) bank */
function offPt(t, k) {
  const i = idxAtT(t), p = RIVER[i], tg = riverTangent(i);
  return [p[0] - tg[1] * k, p[1] + tg[0] * k];
}
/* how far the ground runs from the bank before the rim (or the castle mound) */
function bandAt(t, sgn) {
  const i = idxAtT(t), p = RIVER[i], tg = riverTangent(i);
  const px = -tg[1] * sgn, pz = tg[0] * sgn;
  for (let k = 2.5; k < 18; k += 0.5) {
    const x = p[0] + px * k, z = p[1] + pz * k, r = Math.hypot(x, z);
    if (r > rimRadius(Math.atan2(z, x)) - 2.6) return k;
    if (sgn > 0 && r < 10.6) return k;
  }
  return 18;
}
function roadOff(t) { return clamp(bandAt(t, -1) * 0.68, 4.6, 7.0); }

function placeVillage() {
  const blocked = [];
  /* market square, set back from the street mid-town */
  const mk = offPt(0.30, -roadOff(0.30));
  MARKET = { x: mk[0], z: mk[1] };
  /* the mill footprint is claimed before any cottage can take it */
  const mp = offPt(MILL_T, -(riverWidth(MILL_T) * 0.5 + 1.85));
  blocked.push({ x: mp[0], z: mp[1], r: 4.4 });

  function tryPlace(x, z, side) {
    const r = Math.hypot(x, z);
    if (r < 10.2 || r > rimRadius(Math.atan2(z, x)) - 2.5) return;
    if (nearestRiver(x, z).d < 2.8) return;
    if (distPath(x, z) < 1.4) return;
    if (slopeAt(x, z) > 0.72) return;
    if (Math.hypot(x - RUIN.x, z - RUIN.z) < 8) return;
    for (const b of blocked) if (Math.hypot(b.x - x, b.z - z) < b.r) return;
    for (const s of SPOTS) if (Math.hypot(s.x - x, s.z - z) < 3.3) return;
    SPOTS.push({ x: x, z: z, side: side, rt: nearestRiver(x, z).t });
    PADS.push({ x: x, z: z, r: 3.1, h: terrainH(x, z) });
  }
  /* plots alternate between the two sides of the riverside street */
  let si = 0;
  for (let t = 0.055; t <= 0.53; t += 0.045, si++) {
    const band = bandAt(t, -1), ro = roadOff(t), opts = [];
    const rowA = Math.max(ro - 2.3, 4.3);
    if (ro - rowA >= 1.6) opts.push(rowA);
    if (ro + 2.4 <= band - 0.2) opts.push(ro + 2.4);
    if (!opts.length) continue;
    const k = opts.length > 1 ? opts[si & 1] : opts[0];
    const p = offPt(t, -(k + rr(-0.18, 0.18)));
    tryPlace(p[0], p[1], -1);
  }
  /* a small hamlet on the castle bank, downstream towards the falls */
  for (let t = 0.62; t <= 0.83; t += 0.026) {
    const band = bandAt(t, 1);
    if (band < 4.2) continue;
    const p = offPt(t + rr(-0.01, 0.01), clamp(rr(3.3, band - 0.7), 3.1, 7.5));
    tryPlace(p[0], p[1], 1);
  }
  /* outlying farmsteads on the quiet side of the island */
  for (let deg = 194; deg <= 344; deg += 7) {
    const a = (deg + rr(-3, 3)) * Math.PI / 180, r = rr(11.2, 16.5);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (slopeAt(x, z) > 0.55) continue;
    let clear = true;
    for (const s of SPOTS) if (s.farm && Math.hypot(s.x - x, s.z - z) < 6.6) { clear = false; break; }
    if (!clear) continue;
    const before = SPOTS.length;
    tryPlace(x, z, 2);
    if (SPOTS.length > before) SPOTS[SPOTS.length - 1].farm = true;
  }
}
function centroid(list, fb) {
  if (!list.length) return fb;
  let x = 0, z = 0; for (const s of list) { x += s.x; z += s.z; }
  return { x: x / list.length, z: z / list.length };
}

/* bridges */
function bridgeAt(t) {
  let bi = 0, bd = 9;
  for (let i = 0; i < RIVER.length; i++) { const d = Math.abs(RT[i] - t); if (d < bd) { bd = d; bi = i; } }
  const p = RIVER[bi], tg = riverTangent(bi);
  const perp = [-tg[1], tg[0]];
  const half = riverWidth(RT[bi]) * 0.5 + 2.3;
  return {
    i: bi, x: p[0], z: p[1], perp: perp, half: half,
    a: [p[0] + perp[0] * half, p[1] + perp[1] * half],
    b: [p[0] - perp[0] * half, p[1] - perp[1] * half]
  };
}
function layout() {
  BR1 = bridgeAt(0.66);          /* the road crossing below the castle */
  BR2 = bridgeAt(0.08);          /* woodland footbridge by the spring */
  const ctrl = [
    [GATE.x, GATE.z],
    [GATE.x * 1.55, GATE.z * 1.5],
    [BR1.a[0], BR1.a[1]],
    [BR1.b[0], BR1.b[1]]
  ];
  for (const t of [0.60, 0.52, 0.44, 0.36, 0.28, 0.20, 0.13, 0.07]) ctrl.push(offPt(t, -roadOff(t)));
  PATH = catmull(ctrl, 14);
  placeVillage();
  T_NEAR = centroid(SPOTS.filter(s => s.side < 0), T_NEAR);
  T_FAR = centroid(SPOTS.filter(s => s.side > 0), T_FAR);
}
/* the road point nearest a spot, so buildings can turn to face the street */
function nearPath(x, z) {
  let bi = 0, bd = 1e9;
  for (let i = 0; i < PATH.length; i++) {
    const dx = x - PATH[i][0], dz = z - PATH[i][1], d = dx * dx + dz * dz;
    if (d < bd) { bd = d; bi = i; }
  }
  return PATH[bi];
}
function distPath(x, z) {
  let best = 1e9;
  for (let i = 0; i < PATH.length; i++) {
    const dx = x - PATH[i][0], dz = z - PATH[i][1], d = dx * dx + dz * dz;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

/* ====================================================== ISLAND GEOMETRY */
const NA = 208, NR = 74, NK = 44;
const ANG = [], RIMR = [], RIMY = [];
for (let j = 0; j < NA; j++) {
  const a = j / NA * Math.PI * 2;
  ANG.push(a); RIMR.push(rimRadius(a));
}
let ISLAND_TOP = null, ISLAND_CLIFF = null;

const _c = [0, 0, 0];
function mixC(col, t) { _c[0] += (col.r - _c[0]) * t; _c[1] += (col.g - _c[1]) * t; _c[2] += (col.b - _c[2]) * t; }

function topColor(x, z, y, ny) {
  const r = Math.hypot(x, z);
  const nr = nearestRiver(x, z), wy = waterY(nr.t);
  const n1 = clamp(fbm2(x * 0.21 + 5, z * 0.21 + 9, 3) * 1.4 - 0.15, 0, 1);
  _c[0] = PAL.grassA.r; _c[1] = PAL.grassA.g; _c[2] = PAL.grassA.b;
  mixC(PAL.grassB, n1);
  mixC(PAL.grassDark, smoothstep(0.38, 0.78, fbm2(x * 0.09 + 21, z * 0.09 + 2, 2)) * 0.55);
  const slope = 1 - ny;
  mixC(PAL.rockWarm, smoothstep(0.20, 0.52, slope));
  mixC(PAL.rock, smoothstep(0.48, 0.86, slope) * 0.85);
  mixC(PAL.dirt, smoothstep(10.4, 6.6, r) * 0.55);
  mixC(PAL.stoneCool, smoothstep(7.4, 6.0, r) * 0.8);
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
  const bch = Math.max(smoothstep(3.3, 1.4, nr.d), smoothstep(LAKE.r + 1.4, LAKE.r - 0.2, dl));
  mixC(PAL.sand, bch * 0.8 * smoothstep(1.9, 0.4, Math.abs(y - wy)));
  mixC(PAL.dirt, smoothstep(1.7, 0.7, distPath(x, z)) * 0.9);
  const sub = smoothstep(0, -1.0, y - wy);
  mixC(PAL.rockWarm, sub * 0.55);
  mixC(PAL.leafDark, sub * 0.22);
  const j = (rand() - 0.5) * 0.05;
  return [clamp(_c[0] + j, 0, 1), clamp(_c[1] + j, 0, 1), clamp(_c[2] + j, 0, 1)];
}

function buildIslandTop() {
  const pos = [], ind = [], uv = [];
  pos.push(0, terrainH(0, 0), 0); uv.push(0.5, 0.5);
  for (let i = 1; i <= NR; i++) {
    const u = i / NR;
    for (let j = 0; j < NA; j++) {
      const rad = RIMR[j] * Math.pow(u, 1.03);
      const x = Math.cos(ANG[j]) * rad, z = Math.sin(ANG[j]) * rad;
      const y = terrainH(x, z);
      pos.push(x, y, z); uv.push(x * 0.06, z * 0.06);
      if (i === NR) RIMY[j] = y;
    }
  }
  const vi = (i, j) => 1 + (i - 1) * NA + (j % NA);
  for (let j = 0; j < NA; j++) ind.push(0, vi(1, j), vi(1, j + 1));
  for (let i = 1; i < NR; i++) for (let j = 0; j < NA; j++) {
    const a = vi(i, j), b = vi(i, j + 1), c = vi(i + 1, j + 1), d = vi(i + 1, j);
    ind.push(a, d, b, b, d, c);
  }
  const nor = []; BABYLON.VertexData.ComputeNormals(pos, ind, nor);
  const n = pos.length / 3, col = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) {
    const c = topColor(pos[i * 3], pos[i * 3 + 2], pos[i * 3 + 1], nor[i * 3 + 1]);
    col[i * 4] = c[0]; col[i * 4 + 1] = c[1]; col[i * 4 + 2] = c[2]; col[i * 4 + 3] = 1;
  }
  const vd = new BABYLON.VertexData();
  vd.positions = pos; vd.indices = ind; vd.normals = nor; vd.uvs = uv; vd.colors = col;
  const m = new BABYLON.Mesh("islandTop", scene);
  vd.applyToMesh(m, false);
  m.material = matBase; m.receiveShadows = true; m.isPickable = false;
  return m;
}

function cliffProfile(u) {
  return (1 + 0.085 * Math.sin(u * Math.PI * 0.85)) * Math.pow(Math.max(0, 1 - Math.pow(u, 1.75)), 0.6);
}
function buildIslandCliff() {
  const pos = [], ind = [], uv = [], colArr = [];
  const DEPTH = 15.5;
  for (let k = 0; k <= NK; k++) {
    const u = k / NK;
    for (let j = 0; j < NA; j++) {
      const a = ANG[j], ca = Math.cos(a), sa = Math.sin(a);
      let rad = RIMR[j] * cliffProfile(u);
      const yBase = RIMY[j] - DEPTH * (0.13 * u + 0.87 * u * u);
      if (k > 0) {
        const nz = fbm3(ca * 2.6, yBase * 0.16, sa * 2.6, 3) - 0.5;
        const nz2 = fbm3(ca * 6.5 + 3, yBase * 0.42, sa * 6.5 + 3, 2) - 0.5;
        rad *= 1 + nz * 0.30 * (1 - u * 0.55) + nz2 * 0.11 * (1 - u * 0.8);
      }
      const x = ca * rad, z = sa * rad;
      const y = yBase + (k > 0 ? (fbm3(ca * 3.1 + 9, yBase * 0.2, sa * 3.1 + 9, 2) - 0.5) * 1.5 * (1 - u) : 0);
      pos.push(x, y, z); uv.push(a * 2, y * 0.05);
      /* colour */
      _c[0] = PAL.rockWarm.r; _c[1] = PAL.rockWarm.g; _c[2] = PAL.rockWarm.b;
      mixC(PAL.rock, fbm3(ca * 3.4, y * 0.55, sa * 3.4, 2));
      mixC(PAL.rockDark, smoothstep(0.15, 0.72, u));
      mixC(PAL.rockDeep, smoothstep(0.6, 1.0, u) * 0.75);
      mixC(PAL.rockWarm, smoothstep(0.55, 0.15, Math.abs(fbm2(a * 5.5, y * 0.9, 2) - 0.5)) * 0.35);
      mixC(PAL.moss, smoothstep(0.10, 0.0, u) * 0.75);
      mixC(PAL.grassDark, smoothstep(0.035, 0.0, u) * 0.85);
      const jt = (rand() - 0.5) * 0.05;
      colArr.push(clamp(_c[0] + jt, 0, 1), clamp(_c[1] + jt, 0, 1), clamp(_c[2] + jt, 0, 1), 1);
    }
  }
  const tipIdx = pos.length / 3;
  let tipY = 0; for (let j = 0; j < NA; j++) tipY += RIMY[j];
  tipY = tipY / NA - DEPTH - 1.6;
  pos.push(0.4, tipY, -0.3); uv.push(0.5, 0.5);
  colArr.push(PAL.rockDeep.r, PAL.rockDeep.g, PAL.rockDeep.b, 1);
  const ci = (k, j) => k * NA + (j % NA);
  for (let k = 0; k < NK; k++) for (let j = 0; j < NA; j++) {
    const A = ci(k, j), Bv = ci(k, j + 1), Cv = ci(k + 1, j + 1), D = ci(k + 1, j);
    ind.push(A, D, Bv, Bv, D, Cv);
  }
  for (let j = 0; j < NA; j++) ind.push(tipIdx, ci(NK, j + 1), ci(NK, j));
  const nor = []; BABYLON.VertexData.ComputeNormals(pos, ind, nor);
  const vd = new BABYLON.VertexData();
  vd.positions = pos; vd.indices = ind; vd.normals = nor; vd.uvs = uv; vd.colors = colArr;
  const m = new BABYLON.Mesh("islandCliff", scene);
  vd.applyToMesh(m, false);
  m.material = matBase; m.receiveShadows = true; m.isPickable = false;
  return m;
}

/* ============================================================ BUILDINGS */
function node(x, z, ry, dy) {
  const n = new BABYLON.TransformNode("n", scene);
  n.position.set(x, terrainH(x, z) + (dy || 0), z);
  n.rotation.y = ry;
  return n;
}
function facing(x, z, tx, tz) { return Math.atan2(tx - x, tz - z); }

/* --- generic cottage ------------------------------------------------ */
function cottage(x, z, ry, opt) {
  opt = opt || {};
  const n = node(x, z, ry, -0.25); PARENT = n;
  const w = opt.w || rr(2.5, 3.1), d = opt.d || rr(2.1, 2.6), h = opt.h || rr(2.0, 2.5);
  const rh = opt.rh || h * 0.62, over = 0.34;
  const roof = opt.roof || pick([PAL.roofRed, PAL.roofRed, PAL.roofBlue, PAL.thatch, PAL.roofGreen]);
  const wall = opt.wall || pick([PAL.plaster, PAL.plaster, PAL.plasterWarm]);
  const two = opt.two;

  B(w + 0.45, 0.6, d + 0.45, 0, 0.3, 0, PAL.stoneDark, { ao: 0.35 });
  B(w, h, d, 0, 0.55 + h / 2, 0, wall, { ao: 0.26 });
  /* timber frame */
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    B(0.19, h, 0.19, sx * (w / 2 - 0.09), 0.55 + h / 2, sz * (d / 2 - 0.09), PAL.woodDark, { ao: 0.2 });
  B(w + 0.05, 0.17, d + 0.05, 0, 0.55 + h * 0.52, 0, PAL.woodDark, { ao: 0.1 });
  B(w + 0.05, 0.15, d + 0.05, 0, 0.55 + h - 0.06, 0, PAL.woodDark, { ao: 0.1 });
  for (const s of [-1, 1]) {
    B(0.13, h * 0.44, 0.07, s * w * 0.28, 0.55 + h * 0.26, d / 2 + 0.02, PAL.woodDark, { rz: s * 0.45, ao: 0 });
    B(0.13, h * 0.44, 0.07, s * w * 0.28, 0.55 + h * 0.26, -d / 2 - 0.02, PAL.woodDark, { rz: s * 0.45, ao: 0 });
  }
  let top = 0.55 + h;
  if (two) {
    const w2 = w + 0.34, d2 = d + 0.34, h2 = h * 0.72;
    B(w2, h2, d2, 0, top + h2 / 2, 0, wall, { ao: 0.24 });
    for (const sx of [-1, 1]) for (const sz of [-1, 1])
      B(0.17, h2, 0.17, sx * (w2 / 2 - 0.08), top + h2 / 2, sz * (d2 / 2 - 0.08), PAL.woodDark, { ao: 0.2 });
    B(w2 + 0.05, 0.15, d2 + 0.05, 0, top + 0.05, 0, PAL.woodDark, { ao: 0 });
    /* corbels */
    for (const s of [-1, 1]) B(0.14, 0.4, 0.5, s * (w / 2 - 0.1), top - 0.05, 0, PAL.woodDark, { rz: s * 0.5, ao: 0 });
    top += h2;
  }
  const bw = (two ? w + 0.34 : w);
  const bd = (two ? d + 0.34 : d);
  const hw = bw / 2 + over, slope = Math.atan2(rh, hw), len = Math.hypot(hw, rh);
  for (const s of [-1, 1])
    B(len, 0.18, bd + over * 2, s * hw / 2, top + rh / 2, 0, roof, { rz: -s * slope, ao: 0.16 });
  B(0.24, 0.2, bd + over * 2 + 0.08, 0, top + rh + 0.03, 0, roof, { ao: 0 });
  for (const s of [-1, 1])
    PR([[-bw / 2, 0], [bw / 2, 0], [0, rh]], 0.14, 0, top, s * bd / 2, wall, { ao: 0.2 });
  /* door + windows */
  B(0.92, 1.5, 0.14, 0, 0.55 + 0.75, bd / 2 + 0.03, PAL.woodDark, { ao: 0.25 });
  B(1.06, 0.16, 0.22, 0, 0.55 + 1.56, bd / 2 + 0.05, PAL.wood, { ao: 0 });
  const wy0 = 0.55 + h * 0.62;
  for (const s of [-1, 1]) {
    B(0.62, 0.62, 0.1, s * w * 0.31, wy0, d / 2 + 0.04, PAL.wood, { ao: 0.1 });
    B(0.48, 0.48, 0.08, s * w * 0.31, wy0, d / 2 + 0.09, PAL.cream, { glow: true, ao: 0 });
    /* flower box */
    B(0.6, 0.16, 0.18, s * w * 0.31, wy0 - 0.4, d / 2 + 0.12, PAL.wood, { ao: 0 });
    for (let f = 0; f < 3; f++)
      SP(0.15, s * w * 0.31 + (f - 1) * 0.19, wy0 - 0.3, d / 2 + 0.12, pick([PAL.cloth, PAL.gold, PAL.clothB]), { seg: 5, ao: 0 });
  }
  if (two) {
    for (const s of [-1, 1]) {
      B(0.5, 0.55, 0.08, s * w * 0.26, top - h * 0.36, bd / 2 + 0.03, PAL.wood, { ao: 0.1 });
      B(0.38, 0.42, 0.06, s * w * 0.26, top - h * 0.36, bd / 2 + 0.07, PAL.cream, { glow: true, ao: 0 });
    }
  }
  /* chimney */
  const cxp = (rand() < 0.5 ? -1 : 1) * bw * 0.28;
  const chY = top + rh * (1 - Math.abs(cxp) / hw) * 0.9;
  B(0.5, chY - top + 1.0, 0.5, cxp, top + (chY - top + 1.0) / 2 - 0.1, -bd * 0.14, PAL.stoneDark, { ao: 0.3 });
  B(0.62, 0.16, 0.62, cxp, chY + 0.92, -bd * 0.14, PAL.stoneDark, { ao: 0 });
  PARENT = null;
  return { node: n, chimney: new BABYLON.Vector3(cxp, chY + 1.0, -bd * 0.14), top: top + rh };
}

/* --- tavern ---------------------------------------------------------- */
function tavern(x, z, ry) {

  const n = res.node; PARENT = n;

  for (let i = 0; i < 4; i++) {
    const bx = -3.2 + rr(-0.5, 0.6), bz = -1.6 + i * 1.1;
    CY(0.95, 0.72, 0.8, bx, 0.72, bz, PAL.wood, { tes: 10, ao: 0.3 });

  }
  for (let i = 0; i < 2; i++) {
    const tx = 1.0 + i * 2.2, tz = 3.6;

    for (const sz of [-1, 1]) {
      B(1.5, 0.12, 0.36, tx, 0.55, tz + sz * 0.85, PAL.plank, { ao: 0 });
      for (const sx of [-1, 1]) B(0.1, 0.55, 0.1, tx + sx * 0.55, 0.3, tz + sz * 0.85, PAL.woodDark, { ao: 0.3 });
    }
  }
  PARENT = null;
  return res;
}

/* --- chapel ---------------------------------------------------------- */
function chapel(x, z, ry) {
  const n = node(x, z, ry, -0.25); PARENT = n;
  const w = 3.2, d = 5.4, h = 3.0, rh = 1.9;
  B(w + 0.5, 0.6, d + 0.5, 0, 0.3, 0, PAL.stoneDark, { ao: 0.35 });
  B(w, h, d, 0, 0.55 + h / 2, 0, PAL.stone, { ao: 0.28 });
  const hw = w / 2 + 0.3, slope = Math.atan2(rh, hw), len = Math.hypot(hw, rh);
  for (const s of [-1, 1]) B(len, 0.18, d + 0.6, s * hw / 2, 0.55 + h + rh / 2, 0, PAL.roofBlue, { rz: -s * slope, ao: 0.16 });
  for (const s of [-1, 1]) PR([[-w / 2, 0], [w / 2, 0], [0, rh]], 0.16, 0, 0.55 + h, s * d / 2, PAL.stone, { ao: 0.2 });
  /* buttresses */
  for (const sx of [-1, 1]) for (let i = -1; i <= 1; i++)
    B(0.4, h * 0.8, 0.4, sx * (w / 2 + 0.1), 0.55 + h * 0.4, i * 1.7, PAL.stoneDark, { ao: 0.35 });
  /* tower */
  const tw = 1.9, th = 6.4;
  B(tw, th, tw, 0, 0.55 + th / 2, d / 2 - 0.5, PAL.stone, { ao: 0.3 });
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    B(0.42, 0.5, 0.42, Math.cos(a) * 0.72, 0.55 + th + 0.2, d / 2 - 0.5 + Math.sin(a) * 0.72, PAL.stone, { ao: 0 });
  }
  CY(2.4, 0, 2.5, 0, 0.55 + th + 1.4, d / 2 - 0.5, PAL.roofBlue, { tes: 8, ao: 0.15 });
  SP(0.26, 0, 0.55 + th + 2.75, d / 2 - 0.5, PAL.gold, { seg: 6, ao: 0 });
  /* arched windows */
  for (const sx of [-1, 1]) for (let i = -1; i <= 1; i++) {
    B(0.36, 1.0, 0.1, sx * (w / 2 + 0.01), 0.55 + h * 0.6, i * 1.7 + 0.85, PAL.cream, { glow: true, ao: 0 });
  }
  B(0.5, 0.9, 0.1, 0, 0.55 + th * 0.72, d / 2 - 0.5 + tw / 2, PAL.cream, { glow: true, ao: 0 });
  B(1.0, 1.7, 0.14, 0, 1.4, -d / 2 - 0.03, PAL.woodDark, { ao: 0.2 });

/* --- market stall ----------------------------------------------------- */
function stall(x, z, ry) {
  const n = node(x, z, ry, -0.1); PARENT = n;
  const w = 2.4, d = 1.6, ph = 2.0;
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    B(0.13, ph, 0.13, sx * w / 2, ph / 2, sz * d / 2, PAL.woodDark, { ao: 0.3 });
  B(w + 0.3, 0.16, d + 0.1, 0, 1.0, -d / 2 + 0.1, PAL.plank, { ao: 0 });
  B(w + 0.3, 0.9, 0.14, 0, 0.55, -d / 2 - 0.02, PAL.wood, { ao: 0.3 });
  /* striped awning */
  const cA = pick([PAL.cloth, PAL.clothB, PAL.roofGreen]), cB = PAL.cream;
  const seg = 8, sw = (w + 0.7) / seg, rise = 0.55, hd = (d + 0.5) / 2;
  const sl = Math.atan2(rise, hd), sll = Math.hypot(hd, rise);
  for (let s = -1; s <= 1; s += 2) for (let i = 0; i < seg; i++) {
    B(sw, 0.08, sll, -(w + 0.7) / 2 + sw * (i + 0.5), ph + rise / 2, s * hd / 2, (i % 2 ? cA : cB), { rx: s * sl, ao: 0 });
  }
  B(w + 0.8, 0.12, 0.12, 0, ph + rise + 0.02, 0, PAL.woodDark, { ao: 0 });
  /* wares */
  for (let i = 0; i < 7; i++) {
    const c = pick([PAL.cloth, PAL.gold, PAL.leafB, PAL.roofRed, PAL.leafGold]);
    SP(rr(0.18, 0.3), rr(-w / 2 + 0.2, w / 2 - 0.2), 1.14, rr(-d / 2 + 0.25, -0.05), c, { seg: 6, ao: 0.1 });
  }
  B(0.7, 0.6, 0.55, -w / 2 - 0.35, 0.3, d / 2 - 0.2, PAL.plank, { ao: 0.3 });
  B(0.72, 0.08, 0.57, -w / 2 - 0.35, 0.62, d / 2 - 0.2, PAL.wood, { ao: 0 });
  PARENT = null;
  return n;
}

/* --- water mill ------------------------------------------------------- */
const ANIM = { wheels: [], flags: [], clouds: [], birds: [] };
function mill(idx, sd) {
  const p = RIVER[idx], tg = riverTangent(idx), perp = [-tg[1] * sd, tg[0] * sd];
  const off = riverWidth(RT[idx]) * 0.5 + 1.85;
  const bx = p[0] + perp[0] * off, bz = p[1] + perp[1] * off;
  const ry = Math.atan2(-perp[0], -perp[1]);         /* front faces the river */
  const n = node(bx, bz, ry, -0.3); PARENT = n;
  const w = 4.2, d = 3.6, h = 3.2, rh = 2.0;
  B(w + 0.5, 0.7, d + 0.5, 0, 0.35, 0, PAL.stoneDark, { ao: 0.35 });
  B(w, 1.5, d, 0, 0.6 + 0.75, 0, PAL.stone, { ao: 0.3 });
  B(w - 0.1, h - 1.5, d - 0.1, 0, 0.6 + 1.5 + (h - 1.5) / 2, 0, PAL.plasterWarm, { ao: 0.26 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    B(0.2, h, 0.2, sx * (w / 2 - 0.12), 0.6 + h / 2, sz * (d / 2 - 0.12), PAL.woodDark, { ao: 0.2 });
  B(w + 0.06, 0.16, d + 0.06, 0, 0.6 + 1.55, 0, PAL.woodDark, { ao: 0 });
  const hw = w / 2 + 0.4, slope = Math.atan2(rh, hw), len = Math.hypot(hw, rh);
  for (const s of [-1, 1]) B(len, 0.2, d + 0.8, s * hw / 2, 0.6 + h + rh / 2, 0, PAL.thatch, { rz: -s * slope, ao: 0.18 });
  for (const s of [-1, 1]) PR([[-w / 2, 0], [w / 2, 0], [0, rh]], 0.15, 0, 0.6 + h, s * d / 2, PAL.plasterWarm, { ao: 0.2 });
  B(0.9, 0.8, 0.1, 0, 2.5, d / 2 + 0.05, PAL.cream, { glow: true, ao: 0 });
  B(1.0, 1.6, 0.14, -1.3, 1.4, d / 2 + 0.04, PAL.woodDark, { ao: 0.2 });
  /* axle housing */
  B(0.5, 0.5, 1.2, w / 2 + 0.1, 1.8, 0, PAL.woodDark, { ao: 0.2 });
  /* sacks & crates */
  for (let i = 0; i < 3; i++) SP(0.7, -w / 2 - 0.7 + rr(-0.2, 0.2), 0.45, -1 + i * 0.9, PAL.plasterWarm, { seg: 6, sy: 0.8, ao: 0.25 });
  PARENT = null;

  /* wheel (animated, built at origin then parented) */
  const R = 1.85;
  TARGET = [];
  const parts = TARGET;
  for (const sx of [-1, 1]) TO(R * 2, 0.16, sx * 0.42, 0, 0, PAL.wood, { rz: Math.PI / 2, tes: 24, ao: 0 });
  CY(1.1, 0.34, 0.34, 0, 0, 0, PAL.woodDark, { rz: Math.PI / 2, tes: 10, ao: 0 });
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    B(0.9, 0.62, 0.12, 0, Math.cos(a) * R, Math.sin(a) * R, PAL.plank, { rx: a, ao: 0 });
    B(0.07, R, 0.07, 0, Math.cos(a) * R / 2, Math.sin(a) * R / 2, PAL.wood, { rx: a, ao: 0 });
  }
  TARGET = null;
  const wheel = BABYLON.Mesh.MergeMeshes(parts, true, true);
  wheel.material = matBase;
  const wheelNode = new BABYLON.TransformNode("wheelN", scene);
  const wx = p[0] + perp[0] * (riverWidth(RT[idx]) * 0.5 - 0.15);
  const wz = p[1] + perp[1] * (riverWidth(RT[idx]) * 0.5 - 0.15);
  wheelNode.position.set(wx, waterY(RT[idx]) + R * 0.62, wz);
  wheelNode.rotation.y = Math.atan2(tg[0], tg[1]);
  wheel.parent = wheelNode;
  ANIM.wheels.push(wheel);

  /* sluice */
  PARENT = wheelNode;
  B(1.3, 0.12, 3.0, 0, R + 0.5, -1.9, PAL.plank, { rx: -0.22, ao: 0 });
  for (const sx of [-1, 1]) B(0.1, 0.4, 3.0, sx * 0.65, R + 0.68, -1.9, PAL.plank, { rx: -0.22, ao: 0 });
  PARENT = null;
  return n;
}

/* --- bridge ----------------------------------------------------------- */
function bridge(br) {
  const ya = terrainH(br.a[0], br.a[1]), yb = terrainH(br.b[0], br.b[1]);
  const base = Math.max(ya, yb) + 0.1;
  const span = br.half * 2;
  const ry = Math.atan2(br.perp[0], br.perp[1]);
  const n = new BABYLON.TransformNode("bridge", scene);
  n.position.set(br.x, base, br.z); n.rotation.y = ry + Math.PI / 2;
  PARENT = n;
  const N = 20, rise = 1.0, deckW = 2.2;
  const arc = u => rise * Math.sin(u * Math.PI);
  const slopeAtU = u => Math.atan2(rise * Math.PI * Math.cos(u * Math.PI) / span, 1);
  for (let i = 0; i < N; i++) {
    const u = (i + 0.5) / N, lx = (u - 0.5) * span;
    B(span / N + 0.05, 0.16, deckW, lx, arc(u), 0, i % 3 === 0 ? PAL.plank : PAL.plankPale, { rz: slopeAtU(u), ao: 0 });
  }
  /* stringers */
  for (const s of [-1, 1]) for (let i = 0; i < N; i++) {
    const u = (i + 0.5) / N, lx = (u - 0.5) * span;
    B(span / N + 0.05, 0.2, 0.16, lx, arc(u) - 0.16, s * (deckW / 2 - 0.08), PAL.woodDark, { rz: slopeAtU(u), ao: 0.1 });
  }
  /* railings */
  const posts = 7;
  for (const s of [-1, 1]) {
    for (let i = 0; i <= posts; i++) {
      const u = i / posts, lx = (u - 0.5) * span;
      B(0.14, 0.95, 0.14, lx, arc(u) + 0.48, s * deckW / 2, PAL.woodDark, { ao: 0.25 });
    }
    for (let i = 0; i < posts; i++) {
      const u0 = i / posts, u1 = (i + 1) / posts;
      const x0 = (u0 - 0.5) * span, x1 = (u1 - 0.5) * span;
      const y0 = arc(u0) + 0.85, y1 = arc(u1) + 0.85;
      const l = Math.hypot(x1 - x0, y1 - y0);
      B(l, 0.12, 0.12, (x0 + x1) / 2, (y0 + y1) / 2, s * deckW / 2, PAL.wood, { rz: Math.atan2(y1 - y0, x1 - x0), ao: 0 });
      B(l, 0.1, 0.1, (x0 + x1) / 2, (y0 + y1) / 2 - 0.4, s * deckW / 2, PAL.wood, { rz: Math.atan2(y1 - y0, x1 - x0), ao: 0 });
    }
  }
  /* abutments */
  for (const s of [-1, 1]) B(1.3, 2.4, deckW + 0.7, s * (span / 2 - 0.3), -1.0, 0, PAL.stoneDark, { ao: 0.4 });
  PARENT = null;
  return n;
}

/* --- castle ----------------------------------------------------------- */
function castle() {
  const gy = terrainH(0, 0);
  const n = new BABYLON.TransformNode("castle", scene);
  n.position.set(0, gy, 0); n.rotation.y = 0.30;
  PARENT = n;
  const S = PAL.stone, SD = PAL.stoneDark;
  const W = 4.2, WH = 3.0, WT = 0.8;

  /* terrace */
  CY(0.8, 13.2, 13.9, 0, -1.15, 0, SD, { tes: 30, ao: 0.4 });
  CY(0.9, 12.2, 12.8, 0, -0.45, 0, S, { tes: 30, ao: 0.32 });
  for (let i = 0; i < 30; i++) {
    const a = i / 30 * Math.PI * 2;
    B(1.3, 0.34, 0.5, Math.cos(a) * 6.05, 0.15, Math.sin(a) * 6.05, SD, { ry: -a, ao: 0.1 });
  }

  function wallSeg(x1, z1, x2, z2) {
    const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz), a = Math.atan2(dx, dz);
    const mx = (x1 + x2) / 2, mz = (z1 + z2) / 2;
    B(WT, WH, len, mx, WH / 2, mz, S, { ry: a, ao: 0.3 });
    B(WT + 0.34, 0.26, len, mx, WH + 0.13, mz, S, { ry: a, ao: 0.08 });
    B(WT - 0.28, 0.3, len, mx, WH + 0.4, mz, SD, { ry: a, ao: 0 });
    const cnt = Math.max(3, Math.round(len / 0.95));
    for (let i = 0; i < cnt; i++) {
      if (i % 2) continue;
      const t = (i + 0.5) / cnt, px = x1 + dx * t, pz = z1 + dz * t;
      B(WT + 0.3, 0.52, 0.55, px, WH + 0.5, pz, S, { ry: a, ao: 0.05 });
    }
  }
  wallSeg(-W, -W, W, -W);
  wallSeg(W, -W, W, W);
  wallSeg(-W, W, -W, -W);
  wallSeg(-W, W, -2.05, W);
  wallSeg(2.05, W, W, W);

  /* corner towers */
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const tx = sx * W, tz = sz * W;
    CY(1.1, 3.0, 3.6, tx, 0.35, tz, SD, { tes: 16, ao: 0.4 });
    CY(4.8, 2.6, 2.9, tx, 2.4, tz, S, { tes: 16, ao: 0.3 });
    CY(0.34, 3.3, 3.0, tx, 4.9, tz, S, { tes: 16, ao: 0.05 });
    if (sx * sz > 0) {
      CY(2.4, 0, 3.6, tx, 6.2, tz, PAL.roofBlue, { tes: 16, ao: 0.18 });
      B(0.09, 1.5, 0.09, tx, 7.9, tz, PAL.woodDark, { ao: 0 });
      SP(0.22, tx, 8.6, tz, PAL.gold, { seg: 6, ao: 0 });
      flag(n, tx + 0.05, 7.9, tz, 0.95, 0.62, PAL.clothB);
    } else {
      for (let i = 0; i < 12; i++) {
        if (i % 2) continue;
        const a = i / 12 * Math.PI * 2;
        B(0.5, 0.55, 0.5, tx + Math.cos(a) * 1.28, 5.35, tz + Math.sin(a) * 1.28, S, { ry: -a, ao: 0.05 });
      }
      CY(0.16, 2.4, 2.4, tx, 5.13, tz, SD, { tes: 16, ao: 0 });
    }
    for (let i = 0; i < 3; i++)
      B(0.22, 0.75, 0.22, tx + Math.cos(i * 2.1 + 0.4) * 1.32, 2.6 + i * 0.9, tz + Math.sin(i * 2.1 + 0.4) * 1.32, PAL.cream, { glow: true, ao: 0 });
  }

  /* gatehouse */
  for (const s of [-1, 1]) {
    CY(5.0, 1.7, 2.0, s * 2.55, 2.5, W + 0.3, S, { tes: 14, ao: 0.3 });
    CY(0.28, 2.3, 2.1, s * 2.55, 5.1, W + 0.3, S, { tes: 14, ao: 0 });
    CY(2.0, 0, 2.5, s * 2.55, 6.2, W + 0.3, PAL.roofRed, { tes: 14, ao: 0.18 });
    for (let i = 0; i < 10; i++) {
      if (i % 2) continue;
      const a = i / 10 * Math.PI * 2;
      B(0.4, 0.42, 0.4, s * 2.55 + Math.cos(a) * 0.95, 5.4, W + 0.3 + Math.sin(a) * 0.95, S, { ry: -a, ao: 0 });
    }
  }
  for (const s of [-1, 1]) B(1.1, 3.9, 1.6, s * 1.5, 1.95, W + 0.25, S, { ao: 0.3 });
  B(4.2, 1.3, 1.6, 0, 4.05, W + 0.25, S, { ao: 0.2 });
  B(4.6, 0.28, 1.9, 0, 4.8, W + 0.25, S, { ao: 0.05 });
  for (let i = 0; i < 5; i++) {
    if (i % 2) continue;
    B(0.6, 0.5, 0.6, -1.6 + i * 0.8, 5.15, W + 0.25, S, { ao: 0 });
  }
  for (let i = 0; i < 9; i++) {
    const a = Math.PI * (i + 0.5) / 9;
    B(0.36, 0.52, 1.66, Math.cos(a) * 1.15, 2.45 + Math.sin(a) * 1.05, W + 0.25, SD, { rz: a - Math.PI / 2, ao: 0 });
  }
  /* gate doors + portcullis */
  for (const s of [-1, 1]) B(0.9, 2.4, 0.16, s * 0.48, 1.2, W - 0.42, PAL.woodDark, { ao: 0.25 });
  for (let i = 0; i < 5; i++) B(0.07, 2.6, 0.07, -0.8 + i * 0.4, 1.3, W - 0.15, PAL.metal, { ao: 0.1 });
  for (let i = 0; i < 4; i++) B(1.9, 0.07, 0.07, 0, 0.4 + i * 0.66, W - 0.15, PAL.metal, { ao: 0.1 });
  /* banners */
  for (const s of [-1, 1]) {
    B(0.8, 2.0, 0.07, s * 1.5, 2.4, W + 1.07, PAL.cloth, { ao: 0.15, two: true });
    B(0.8, 0.24, 0.075, s * 1.5, 3.3, W + 1.08, PAL.gold, { ao: 0, two: true });
    PR([[-0.4, 0], [0.4, 0], [0, -0.42]], 0.06, s * 1.5, 1.4, W + 1.07, PAL.cloth, { ao: 0 });
  }
  /* torches at the gate */
  for (const s of [-1, 1]) {
    B(0.12, 0.7, 0.12, s * 1.15, 2.5, W + 1.1, PAL.woodDark, { rz: -s * 0.4, ao: 0 });
    SP(0.3, s * 1.32, 2.85, W + 1.14, PAL.gold, { seg: 6, glow: true, ao: 0 });
  }

  /* keep */
  const kx = -0.6, kz = -0.9;
  B(5.6, 6.6, 4.8, kx, 3.3, kz, S, { ao: 0.3 });
  B(6.0, 0.3, 5.2, kx, 6.75, kz, S, { ao: 0.05 });
  for (let i = 0; i < 14; i++) {
    const per = 14, u = i / per;
    let px, pz;
    if (i < 4) { px = kx - 2.7 + (i + 0.5) * 1.35; pz = kz + 2.5; }
    else if (i < 7) { px = kx + 2.7; pz = kz + 2.5 - (i - 3.5) * 1.4; }
    else if (i < 11) { px = kx + 2.7 - (i - 6.5) * 1.35; pz = kz - 2.5; }
    else { px = kx - 2.7; pz = kz - 2.5 + (i - 10.5) * 1.4; }
    if (i % 2 === 0) B(0.55, 0.55, 0.55, px, 7.15, pz, S, { ao: 0 });
  }
  /* keep roof over the inner half */
  const krh = 2.0, khw = 2.5;
  const ks = Math.atan2(krh, khw), kl = Math.hypot(khw, krh);
  for (const s of [-1, 1]) B(kl, 0.2, 5.4, kx + s * khw / 2, 7.0 + krh / 2, kz, PAL.roofRed, { rz: -s * ks, ao: 0.18 });
  for (const s of [-1, 1]) PR([[-2.3, 0], [2.3, 0], [0, krh]], 0.16, kx, 7.0, kz + s * 2.5, S, { ao: 0.2 });
  /* great tower */
  const tx = 2.1, tz = 1.0;
  CY(11.0, 3.0, 3.6, tx, 5.5, tz, S, { tes: 18, ao: 0.32 });
  CY(0.4, 4.0, 3.4, tx, 11.2, tz, S, { tes: 18, ao: 0.05 });
  for (let i = 0; i < 14; i++) {
    if (i % 2) continue;
    const a = i / 14 * Math.PI * 2;
    B(0.55, 0.6, 0.5, tx + Math.cos(a) * 1.62, 11.7, tz + Math.sin(a) * 1.62, S, { ry: -a, ao: 0 });
  }
  CY(3.4, 0, 3.7, tx, 13.6, tz, PAL.roofBlue, { tes: 18, ao: 0.2 });
  B(0.11, 2.2, 0.11, tx, 16.2, tz, PAL.woodDark, { ao: 0 });
  SP(0.3, tx, 17.3, tz, PAL.gold, { seg: 8, ao: 0 });
  flag(n, tx + 0.06, 16.3, tz, 1.6, 1.0, PAL.cloth);
  for (let i = 0; i < 5; i++) {
    const a = i * 1.3;
    B(0.26, 0.9, 0.26, tx + Math.cos(a) * 1.55, 2.6 + i * 1.7, tz + Math.sin(a) * 1.55, PAL.cream, { glow: true, ao: 0 });
  }
  for (let i = 0; i < 6; i++) {
    const px = kx - 2.0 + (i % 3) * 2.0, py = 1.9 + Math.floor(i / 3) * 2.3;
    B(0.45, 1.0, 0.16, px, py, kz + 2.42, PAL.cream, { glow: true, ao: 0 });
  }
  /* courtyard: well, crates, stair */
  CY(1.0, 2.0, 2.2, -2.6, 0.5, 2.2, SD, { tes: 14, ao: 0.3 });
  for (const s of [-1, 1]) B(0.16, 1.5, 0.16, -2.6 + s * 0.85, 1.7, 2.2, PAL.woodDark, { ao: 0.2 });
  B(2.2, 0.16, 1.0, -2.6, 2.5, 2.2, PAL.roofRed, { ao: 0 });
  for (let i = 0; i < 5; i++) B(1.6 - i * 0.05, 0.34, 0.6, 3.2, 0.17 + i * 0.34, -3.0 + i * 0.6, SD, { ao: 0.2 });
  for (let i = 0; i < 3; i++) B(0.8, 0.8, 0.8, -3.4 + i * 0.95, 0.4, -2.6 + rr(-0.3, 0.3), PAL.plank, { ry: rr(0, 3), ao: 0.3 });
  CY(1.0, 0.75, 0.85, 3.0, 0.5, 3.2, PAL.wood, { tes: 10, ao: 0.3 });
  PARENT = null;
  return n;
}

/* --- animated flag ---------------------------------------------------- */
function flag(parent, x, y, z, w, h, col) {
  const NX = 9, NY = 5, pos = [], idx = [], uvs = [], cols = [];
  for (let j = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) {
    pos.push(i / NX * w, -(j / NY) * h, 0);
    uvs.push(i / NX, j / NY);
    const f = 0.78 + 0.22 * (1 - j / NY);
    cols.push(col.r * f, col.g * f, col.b * f, 1);
  }
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const nor = []; BABYLON.VertexData.ComputeNormals(pos, idx, nor);
  const vd = new BABYLON.VertexData();
  vd.positions = pos; vd.indices = idx; vd.normals = nor; vd.uvs = uvs; vd.colors = cols;
  const m = new BABYLON.Mesh("flag", scene);
  vd.applyToMesh(m, true);
  m.material = matBaseTwo; m.isPickable = false;
  m.parent = parent; m.position.set(x, y, z);
  ANIM.flags.push({ mesh: m, base: pos.slice(), w: w, phase: rand() * 6.28 });
  return m;
}

/* --- ruined watchtower ------------------------------------------------ */
function ruin(x, z) {
  const n = node(x, z, rr(0, 6.28), -0.4); PARENT = n;
  const R = 2.5, per = 20, rings = 17, bh = 0.62;
  CY(1.0, 5.6, 6.6, 0, 0.1, 0, PAL.stoneDark, { tes: 20, ao: 0.4 });
  for (let ring = 0; ring < rings; ring++) {
    const y = 0.55 + ring * bh;
    for (let k = 0; k < per; k++) {
      const a = (k + (ring % 2) * 0.5) / per * Math.PI * 2;
      const nz = vnoise2(Math.cos(a) * 2.5 + 3, Math.sin(a) * 2.5 + 7);
      const maxRing = 3.5 + 13.5 * Math.pow(clamp(0.5 + 0.5 * Math.sin(a * 1.0 + 2.1) + (nz - 0.5) * 0.5, 0, 1), 1.3);
      if (ring > maxRing) continue;
      if (ring > 2 && rand() < 0.055) continue;
      if (ring < 3 && Math.abs(((a - 0.8 + Math.PI) % 6.283) - Math.PI) < 0.28) continue; /* doorway */
      const wob = (ring > maxRing - 1.6) ? rr(-0.14, 0.14) : rr(-0.05, 0.05);
      B(0.78, bh * 0.94, 0.55, Math.cos(a) * (R + wob), y + rr(-0.03, 0.03), Math.sin(a) * (R + wob),
        rand() < 0.14 ? PAL.stoneDark : PAL.stone, { ry: -a + rr(-0.06, 0.06), ao: 0.3 });
    }
  }
  /* broken floor beams */
  for (let i = 0; i < 5; i++) {
    const a = rr(0, 6.28);
    B(rr(2.2, 4.4), 0.2, 0.24, 0, 4.4 + rr(-0.5, 2.5), 0, PAL.woodDark, { ry: a, rz: rr(-0.06, 0.06), ao: 0.2 });
  }
  B(2.4, 0.18, 2.0, 0.4, 6.9, -0.2, PAL.woodDark, { ry: 0.4, rz: 0.07, ao: 0.15 });
  /* rubble */
  for (let i = 0; i < 22; i++) {
    const a = rr(0, 6.28), rd = rr(2.9, 6.2);
    B(rr(0.5, 0.85), rr(0.35, 0.6), rr(0.4, 0.62), Math.cos(a) * rd, 0.2 + rr(0, 0.2), Math.sin(a) * rd,
      rand() < 0.3 ? PAL.stoneDark : PAL.stone, { ry: rr(0, 3.1), rz: rr(-0.3, 0.3), ao: 0.3 });
  }
  /* ivy */
  for (let i = 0; i < 26; i++) {
    const a = rr(0, 6.28), yy = rr(0.6, 6.0);
    SP(rr(0.4, 0.85), Math.cos(a) * R * 1.02, yy, Math.sin(a) * R * 1.02, rand() < 0.5 ? PAL.leaf : PAL.leafDark, { seg: 5, sy: 0.55, ao: 0.3 });
  }
  PARENT = null;
  return n;
}

/* --- nature ----------------------------------------------------------- */
function pine(x, z, s) {
  const n = node(x, z, rr(0, 6.28), -0.15);
  n.scaling.setAll(s);
  n.rotation.x = rr(-0.05, 0.05); n.rotation.z = rr(-0.05, 0.05);
  PARENT = n;

    B(0.14, 1.15, 0.14, px, terrainH(px, pz) + 0.45, pz, PAL.woodDark, { ry: rr(0, 3), ao: 0.35 });
  }
  for (let i = 0; i < steps; i++) {

    const x0 = x1 + dx * t0, z0 = z1 + dz * t0, xa = x1 + dx * t1, za = z1 + dz * t1;
    const y0 = terrainH(x0, z0) + 0.45, y1 = terrainH(xa, za) + 0.45;

    for (const off of [0.22, -0.12]) {

}

function radialTex(name, inner, outer) {
  const dt = new BABYLON.DynamicTexture(name, 128, scene, true);
  const ctx = dt.getContext();
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, inner); g.addColorStop(0.45, inner.replace(/[\d.]+\)$/, '0.55)'));
  g.addColorStop(1, outer);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  dt.update(); dt.hasAlpha = true;
  return dt;
}
function waterNormalTex() {
  const S = 192;
  const dt = new BABYLON.DynamicTexture("wn", S, scene, true);
  const ctx = dt.getContext();
  const img = ctx.createImageData(S, S);
  const TP = 2 * Math.PI / S;
  const H = (x, y) => 0.55 * Math.sin(TP * (3 * x + 2 * y)) + 0.32 * Math.sin(TP * (5 * x - 4 * y) + 1.1)
    + 0.18 * Math.sin(TP * (9 * x + 7 * y) + 2.2) + 0.1 * Math.sin(TP * (13 * x - 11 * y));
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let nx = (H(x - 1, y) - H(x + 1, y)) * 1.6;
    let ny = (H(x, y - 1) - H(x, y + 1)) * 1.6;
    const l = Math.hypot(nx, ny, 1);
    const i = (y * S + x) * 4;
    img.data[i] = (nx / l * 0.5 + 0.5) * 255;
    img.data[i + 1] = (ny / l * 0.5 + 0.5) * 255;
    img.data[i + 2] = (1 / l * 0.5 + 0.5) * 255;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  dt.update(false);
  return dt;
}
const SKY_STOPS = [
  [0.00, C('#4E6E86')], [0.34, C('#9FB7C4')], [0.46, C('#F6C79A')],
  [0.52, C('#FFE3BE')], [0.60, C('#A9D8F3')], [0.80, C('#3E86D2')], [1.00, C('#1B4A96')]

function skyColor(t) {
  for (let i = 1; i < SKY_STOPS.length; i++) {
    if (t <= SKY_STOPS[i][0] || i === SKY_STOPS.length - 1) {
      const a = SKY_STOPS[i - 1], b = SKY_STOPS[i];
      const u = clamp((t - a[0]) / (b[0] - a[0]), 0, 1);
      return [lerp(a[1].r, b[1].r, u), lerp(a[1].g, b[1].g, u), lerp(a[1].b, b[1].b, u)];
    }
  }
  return [0, 0, 0];
}

const stageEl = document.getElementById("stage");

async function stage(txt) { stageEl.textContent = txt; await nextFrame(); await nextFrame(); }

let sun, shadowGen, camera, waterMesh, waterBase = null, fallMesh, fallBase = null;

async function build() {

  /* ---------------- lights & camera ---------------- */
  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.15, 1, 0.1), scene);
  hemi.intensity = 0.62;

  hemi.specular = new BABYLON.Color3(0, 0, 0);

    shadowGen.usePercentageCloserFiltering = true;
    shadowGen.filteringQuality = BABYLON.ShadowGenerator.QUALITY_MEDIUM;
  } else {
    shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.blurKernel = 24; shadowGen.depthScale = 40;

  camera = new BABYLON.ArcRotateCamera("cam", -2.05, 1.06, 66, new BABYLON.Vector3(0, 1.5, 1), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 26; camera.upperRadiusLimit = 130;
  camera.lowerBetaLimit = 0.12; camera.upperBetaLimit = 2.72;
  camera.wheelDeltaPercentage = 0.014;
  camera.pinchDeltaPercentage = 0.014;
  camera.panningSensibility = 0;
  camera.minZ = 0.5; camera.maxZ = 4000;
  camera.useAutoRotationBehavior = true;
  camera.autoRotationBehavior.idleRotationSpeed = 0.055;
  camera.autoRotationBehavior.idleRotationWaitTime = 1800;
  camera.autoRotationBehavior.idleRotationSpinupTime = 2600;
  camera.useBouncingBehavior = false;

  await stage("surveying the ground");
  layout();

  await stage("raising the island");
  ISLAND_TOP = buildIslandTop();
  await nextFrame();
  ISLAND_CLIFF = buildIslandCliff();

  await stage("building the castle");
  castle();
  /* road slabs down the mound */
  for (let i = 0; i < PATH.length; i += 3) {
    const p = PATH[i], r = Math.hypot(p[0], p[1]);
    if (r > 11.5 || r < 5.4) continue;
    const q = PATH[Math.min(PATH.length - 1, i + 3)];
    const a = Math.atan2(q[0] - p[0], q[1] - p[1]);
    B(2.6, 0.22, 1.2, p[0], terrainH(p[0], p[1]) + 0.04, p[1], PAL.stoneCool, { ry: a, ao: 0.15 });
  }

  await stage("raising the village");
  /* pick special plots */
  const millIdx = idxAtT(MILL_T);
  mill(millIdx, -1);

  const used = [];
  function takeSpot(target) {
    let bi = -1, bd = 1e9;
    for (let i = 0; i < SPOTS.length; i++) {
      if (used.indexOf(i) >= 0 || SPOTS[i].farm) continue;
      const d = Math.hypot(SPOTS[i].x - target.x, SPOTS[i].z - target.z);
      if (d < bd) { bd = d; bi = i; }
    }
    if (bi < 0) return null;
    used.push(bi); return SPOTS[bi];
  }
  /* everything in the village turns to face the street */
  function streetFacing(x, z) {
    const p = nearPath(x, z);
    return facing(x, z, p[0], p[1]);
  }
  const tv = takeSpot({ x: MARKET.x, z: MARKET.z });
  if (tv) tavern(tv.x, tv.z, streetFacing(tv.x, tv.z) + rr(-0.14, 0.14));
  const ch = takeSpot({ x: T_FAR.x, z: T_FAR.z });
  if (ch) chapel(ch.x, ch.z, streetFacing(ch.x, ch.z) + rr(-0.14, 0.14));

  const cottages = [];
  for (let i = 0; i < SPOTS.length; i++) {
    if (used.indexOf(i) >= 0) continue;
    const s = SPOTS[i];
    if (s.farm) {
      /* outlying farm: cottage turned towards the castle, with a paddock */
      const ry = facing(s.x, s.z, 0, 0) + rr(-0.3, 0.3);
      cottages.push(cottage(s.x, s.z, ry, { two: false, roof: PAL.thatch }));
      const fa = ry + Math.PI / 2, cx = s.x + Math.sin(ry) * -4.2, cz = s.z + Math.cos(ry) * -4.2;
      const ux = Math.cos(fa), uz = -Math.sin(fa), w = rr(2.4, 3.2);
      const c1 = [cx + ux * w, cz + uz * w], c2 = [cx - ux * w, cz - uz * w];
      const vx = -uz * w * 0.8, vz = ux * w * 0.8;
      if (Math.hypot(cx, cz) < rimRadius(Math.atan2(cz, cx)) - 2.0) {
        fence(c1[0] + vx, c1[1] + vz, c2[0] + vx, c2[1] + vz);
        fence(c2[0] + vx, c2[1] + vz, c2[0] - vx, c2[1] - vz);
        fence(c2[0] - vx, c2[1] - vz, c1[0] - vx, c1[1] - vz);
      }
      if (rand() < 0.6) cart(s.x + rr(-3, 3), s.z + rr(-3, 3), rr(0, 6.28));
      continue;
    }
    cottages.push(cottage(s.x, s.z, streetFacing(s.x, s.z) + rr(-0.22, 0.22), { two: rand() < 0.4 }));
  }

  /* street market: stalls fill the gaps along the road through town */
  const mkx = MARKET.x, mkz = MARKET.z;
  let mki = 0, mkd = 1e9;
  for (let i = 0; i < PATH.length; i++) {
    const d = Math.hypot(PATH[i][0] - mkx, PATH[i][1] - mkz);
    if (d < mkd) { mkd = d; mki = i; }
  }
  function clearOfPlots(x, z, m) {
    for (const s of SPOTS) if (Math.hypot(s.x - x, s.z - z) < m) return false;
    return true;
  }
  let stalls = 0, lamps = 0;
  for (let k = -26; k <= 26 && stalls < 6; k += 2) {
    const i = clamp(mki + k, 1, PATH.length - 2);
    const p = PATH[i], q = PATH[i + 1];
    const dx = q[0] - p[0], dz = q[1] - p[1], l = Math.hypot(dx, dz) || 1;
    const off = 1.95 * ((k & 3) ? 1 : -1);
    const sx = p[0] - dz / l * off, sz = p[1] + dx / l * off;
    if (!clearOfPlots(sx, sz, 3.0)) continue;
    if (nearestRiver(sx, sz).d < 2.5) continue;
    if (Math.hypot(sx, sz) > rimRadius(Math.atan2(sz, sx)) - 1.4) continue;
    stall(sx, sz, facing(sx, sz, p[0], p[1]));
    stalls++; k += 2;
  }
  for (let k = -30; k <= 30 && lamps < 5; k += 7) {
    const i = clamp(mki + k, 1, PATH.length - 2);
    const p = PATH[i], q = PATH[i + 1];
    const dx = q[0] - p[0], dz = q[1] - p[1], l = Math.hypot(dx, dz) || 1;
    const off = 1.7 * ((k & 1) ? -1 : 1);
    const lx = p[0] - dz / l * off, lz = p[1] + dx / l * off;
    if (!clearOfPlots(lx, lz, 2.2)) continue;
    if (nearestRiver(lx, lz).d < 2.3) continue;
    if (Math.hypot(lx, lz) > rimRadius(Math.atan2(lz, lx)) - 1.2) continue;
    lantern(lx, lz); lamps++;
  }
  {
    const i = clamp(mki + 9, 0, PATH.length - 2), p = PATH[i], q = PATH[i + 1];
    const dx = q[0] - p[0], dz = q[1] - p[1], l = Math.hypot(dx, dz) || 1;
    const cx = p[0] - dz / l * 1.9, cz = p[1] + dx / l * 1.9;
    if (clearOfPlots(cx, cz, 2.4)) cart(cx, cz, Math.atan2(dx, dz));
  }

  await stage("crossing the river");
  bridge(BR1); bridge(BR2);
  /* jetty + boat upstream of the mill */
  const ji = Math.max(0, millIdx - 12);
  const jp = RIVER[ji], jt = riverTangent(ji), jperp = [-jt[1], jt[0]];
  const joff = riverWidth(RT[ji]) * 0.5, jy = waterY(RT[ji]);
  for (let i = 0; i < 5; i++) {
    const jx = jp[0] - jperp[0] * (joff - 0.4 - i * 0.55), jz = jp[1] - jperp[1] * (joff - 0.4 - i * 0.55);
    B(1.6, 0.12, 0.7, jx, jy + 0.35, jz, PAL.plank, { ry: Math.atan2(jperp[0], jperp[1]), ao: 0 });
    B(0.12, 1.2, 0.12, jx, jy - 0.25, jz, PAL.woodDark, { ao: 0.4 });
  }
  boat(jp[0] - jperp[0] * (joff - 0.9), jp[1] - jperp[1] * (joff - 0.9), Math.atan2(jt[0], jt[1]), jy - 0.05);

  await stage("planting the forest");
  const trees = [];
  for (let att = 0; att < 26000 && trees.length < 118; att++) {
    const a = rr(0, Math.PI * 2), rd = Math.sqrt(rr(0.09, 1)) * 20.5;
    const x = Math.cos(a) * rd, z = Math.sin(a) * rd;
    if (rd > rimRadius(a) - 1.2 || rd < 8.5) continue;
    const village = (a > 0.4 && a < 2.8);
    if (village && rand() < 0.72) continue;
    if (nearestRiver(x, z).d < 2.9) continue;
    if (distPath(x, z) < 2.6) continue;
    if (slopeAt(x, z) > 0.85) continue;
    if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 1.4) continue;
    let ok = true;
    for (const s of SPOTS) if (Math.hypot(s.x - x, s.z - z) < 4.2) { ok = false; break; }
    if (!ok) continue;
    for (const t of trees) if (Math.hypot(t[0] - x, t[1] - z) < 2.3) { ok = false; break; }
    if (!ok) continue;
    if (Math.hypot(x - RUIN.x, z - RUIN.z) < 7.5) continue;
    trees.push([x, z]);
    if (rand() < 0.78) pine(x, z, rr(0.75, 1.35));

  }
  for (let i = 0; i < 46; i++) {
    const a = rr(0, 6.28), rd = rr(9, 20);
    const x = Math.cos(a) * rd, z = Math.sin(a) * rd;
    if (rd > rimRadius(a) - 1.0 || nearestRiver(x, z).d < 2.2 || distPath(x, z) < 1.8) continue;
    bush(x, z, rr(0.7, 1.3));

  await stage("scattering stones");
  ruin(RUIN.x, RUIN.z);
  for (let i = 0; i < 150; i++) {
    const a = rr(0, 6.28), rd = rr(6, 21.5);
    const x = Math.cos(a) * rd, z = Math.sin(a) * rd;
    if (rd > rimRadius(a) - 0.4) continue;
    if (distPath(x, z) < 1.4) continue;
    const nr = nearestRiver(x, z);
    const y = terrainH(x, z);
    if (nr.d < 2.4 && rand() < 0.55) {
      rock(x, waterY(nr.t) - 0.15 + rr(0, 0.35), z, rr(0.5, 1.3), PAL.rockDark);
    } else {
      if (slopeAt(x, z) < 0.18 && rand() < 0.6) continue;
      rock(x, y + rr(-0.1, 0.15), z, rr(0.5, 1.9));

  }
  /* rim boulders + overhanging spurs */
  for (let i = 0; i < 40; i++) {
    const a = rr(0, 6.28), rd = rimRadius(a) * rr(0.9, 1.0);
    const x = Math.cos(a) * rd, z = Math.sin(a) * rd;
    rock(x, terrainH(x, z) - rr(0.2, 1.4), z, rr(1.0, 2.6), rand() < 0.5 ? PAL.rockWarm : PAL.rock);
  }
  for (let i = 0; i < 26; i++) {
    const a = rr(0, 6.28), u = rr(0.12, 0.7);
    const rd = rimRadius(a) * cliffProfile(u) * rr(0.9, 1.02);
    const yy = lerp(terrainH(Math.cos(a) * rd, Math.sin(a) * rd), -14, u * 0.9);
    rock(Math.cos(a) * rd, -0.8 - u * 12, Math.sin(a) * rd, rr(1.2, 3.0), PAL.rockDark);
  }

  await stage("dressing the fields");
  for (let i = 0; i < 190; i++) {
    const a = rr(0, 6.28), rd = rr(7, 20.5);
    const x = Math.cos(a) * rd, z = Math.sin(a) * rd;
    if (rd > rimRadius(a) - 0.8) continue;
    if (nearestRiver(x, z).d < 2.0) continue;
    if (slopeAt(x, z) > 0.6) continue;
    tuft(x, z);
  }
  for (let i = 0; i < 110; i++) {
    const a = rr(0, 6.28), rd = rr(7, 20);
    const x = Math.cos(a) * rd, z = Math.sin(a) * rd;
    if (rd > rimRadius(a) - 1.0 || nearestRiver(x, z).d < 2.2 || slopeAt(x, z) > 0.5) continue;
    flower(x, z);
  }
  /* fences along part of the road */
  for (let i = 6; i < PATH.length - 10; i += 14) {
    const p = PATH[i], q = PATH[i + 8];
    if (!q) break;
    if (Math.hypot(p[0], p[1]) < 9) continue;
    if (nearestRiver(p[0], p[1]).d < 3.2) continue;
    const dx = q[0] - p[0], dz = q[1] - p[1], l = Math.hypot(dx, dz);
    const px = -dz / l * 1.9, pz = dx / l * 1.9;
    fence(p[0] + px, p[1] + pz, q[0] + px, q[1] + pz);
    if (rand() < 0.6) fence(p[0] - px, p[1] - pz, q[0] - px, q[1] - pz);
  }
  for (let i = 12; i < PATH.length - 6; i += 26) {
    const p = PATH[i];
    if (nearestRiver(p[0], p[1]).d < 3.0) continue;
    lantern(p[0] + 1.6, p[1] + 0.6);
  }

  await stage("merging the world");
  await nextFrame();
  const world = BABYLON.Mesh.MergeMeshes(STATICS, true, true, undefined, false, false);
  world.material = matBase; world.receiveShadows = true; world.isPickable = false;
  const glow = GLOWS.length ? BABYLON.Mesh.MergeMeshes(GLOWS, true, true, undefined, false, false) : null;
  if (glow) { glow.material = matGlow; glow.isPickable = false; glow.freezeWorldMatrix(); }
  shadowGen.addShadowCaster(world);
  shadowGen.addShadowCaster(ISLAND_TOP);
  shadowGen.addShadowCaster(ISLAND_CLIFF);
  for (const w of ANIM.wheels) shadowGen.addShadowCaster(w);
  world.freezeWorldMatrix();
  ISLAND_TOP.freezeWorldMatrix(); ISLAND_CLIFF.freezeWorldMatrix();

  await stage("letting in the water");
  buildWater();
  buildSkyAndAir();

  await stage("lighting the lanterns");
  const gl = new BABYLON.GlowLayer("gl", scene, { blurKernelSize: 24 });
  gl.intensity = 0.55;

  const pipe = new BABYLON.DefaultRenderingPipeline("dp", true, scene, [camera]);
  pipe.samples = 4;
  pipe.fxaaEnabled = true;
  pipe.bloomEnabled = true;
  pipe.bloomThreshold = 0.78;
  pipe.bloomWeight = 0.34;
  pipe.bloomKernel = 48;
  pipe.bloomScale = 0.5;
  pipe.imageProcessingEnabled = true;
  pipe.imageProcessing.toneMappingEnabled = true;
  pipe.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
  pipe.imageProcessing.exposure = 1.28;
  pipe.imageProcessing.contrast = 1.16;
  pipe.imageProcessing.vignetteEnabled = true;
  pipe.imageProcessing.vignetteWeight = 2.4;
  pipe.imageProcessing.vignetteColor = new BABYLON.Color4(0.02, 0.05, 0.09, 0);
  pipe.imageProcessing.vignetteCameraFov = 0.9;

  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogColor = C('#A8C8DE');
  scene.fogDensity = 0.0034;
  ISLAND_TOP.applyFog = true;

  animate();
}

/* ================================================================ WATER */
function buildWater() {
  /* find the lip where the river leaves the island */
  let lip = RIVER.length - 1;
  for (let i = 0; i < RIVER.length; i++) {
    const p = RIVER[i], r = Math.hypot(p[0], p[1]);
    if (r > rimRadius(Math.atan2(p[1], p[0])) - 0.35) { lip = i; break; }
  }
  const left = [], right = [];
  for (let i = 0; i <= lip; i++) {
    const p = RIVER[i], t = riverTangent(i), perp = [-t[1], t[0]];
    let w = riverWidth(RT[i]);
    const dl = Math.hypot(p[0] - LAKE.x, p[1] - LAKE.z);
    w += smoothstep(LAKE.r + 1.5, 0, dl) * 3.6;
    const y = waterY(RT[i]) + 0.02;
    left.push(new BABYLON.Vector3(p[0] + perp[0] * w / 2, y, p[1] + perp[1] * w / 2));
    right.push(new BABYLON.Vector3(p[0] - perp[0] * w / 2, y, p[1] - perp[1] * w / 2));
  }
  const matWater = new BABYLON.StandardMaterial("water", scene);
  matWater.diffuseColor = PAL.water.scale(0.95);
  matWater.emissiveColor = PAL.water.scale(0.18);
  matWater.specularColor = new BABYLON.Color3(1, 1, 1);
  matWater.specularPower = 86;
  matWater.alpha = 0.86;
  matWater.backFaceCulling = false;
  matWater.twoSidedLighting = true;
  const nrmTex = waterNormalTex();
  nrmTex.uScale = 3; nrmTex.vScale = 14;
  matWater.bumpTexture = nrmTex;
  matWater.bumpTexture.level = 0.85;

  waterMesh = BABYLON.MeshBuilder.CreateRibbon("river", { pathArray: [left, right], updatable: true }, scene);
  waterMesh.material = matWater; waterMesh.isPickable = false;
  waterBase = Array.prototype.slice.call(waterMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind));

  /* source lake */
  const lake = BABYLON.MeshBuilder.CreateDisc("lake", { radius: LAKE.r + 1.1, tessellation: 40 }, scene);
  lake.rotation.x = Math.PI / 2;
  lake.position.set(LAKE.x, LAKE.y + 0.02, LAKE.z);
  lake.material = matWater; lake.isPickable = false;

  /* --------- waterfall sheet --------- */
  const lp = RIVER[lip], lt = riverTangent(lip), perp = [-lt[1], lt[0]];
  const lipY = waterY(RT[lip]);
  const K = 34, FALL = 12.5;
  const fl = [], fr = [];
  for (let k = 0; k <= K; k++) {
    const u = k / K;
    const drop = FALL * (0.22 * u + 0.78 * u * u);
    const out = 2.6 * (1 - Math.exp(-u * 2.6));
    const w = riverWidth(RT[lip]) * (1 + 0.55 * u);
    const cx = lp[0] + lt[0] * out, cz = lp[1] + lt[1] * out;
    const y = lipY + 0.1 - drop;
    fl.push(new BABYLON.Vector3(cx + perp[0] * w / 2, y, cz + perp[1] * w / 2));
    fr.push(new BABYLON.Vector3(cx - perp[0] * w / 2, y, cz - perp[1] * w / 2));
  }
  const matFall = new BABYLON.StandardMaterial("fall", scene);
  matFall.diffuseColor = new BABYLON.Color3(0.85, 1, 1);
  matFall.emissiveColor = new BABYLON.Color3(0.32, 0.58, 0.6);
  matFall.specularColor = new BABYLON.Color3(0.6, 0.6, 0.6);
  matFall.backFaceCulling = false;
  matFall.twoSidedLighting = true;
  matFall.alpha = 0.92;
  const ft = waterNormalTex(); ft.uScale = 2; ft.vScale = 6;
  matFall.bumpTexture = ft; matFall.bumpTexture.level = 0.6;

  fallMesh = BABYLON.MeshBuilder.CreateRibbon("fall", { pathArray: [fl, fr], updatable: true }, scene);
  fallMesh.material = matFall; fallMesh.isPickable = false;
  fallMesh.hasVertexAlpha = true;
  {
    const p = fallMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    const n = p.length / 3, cols = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) {
      const u = clamp((lipY - p[i * 3 + 1]) / FALL, 0, 1);
      const f = lerp(0.72, 1.0, u);
      cols[i * 4] = PAL.water.r * (1 - u) + f * u;
      cols[i * 4 + 1] = PAL.water.g * (1 - u * 0.6) + f * u * 0.6;
      cols[i * 4 + 2] = PAL.water.b * (1 - u * 0.5) + f * u * 0.5;
      cols[i * 4 + 3] = 1 - smoothstep(0.55, 1.0, u) * 0.95;
    }
    fallMesh.setVerticesData(BABYLON.VertexBuffer.ColorKind, cols);
    fallBase = Array.prototype.slice.call(p);
  }
  fallMesh.metadata = { lipY: lipY, fall: FALL };

  /* secondary cliff spring on the far side */
  const sa = 3.0, sr = rimRadius(sa) * 0.99;
  const sx = Math.cos(sa) * sr, sz = Math.sin(sa) * sr;
  const sy = terrainH(sx, sz);
  const sl = [], sr2 = [];
  for (let k = 0; k <= 22; k++) {
    const u = k / 22, drop = 9 * (0.2 * u + 0.8 * u * u);
    const w = 0.9 + u * 0.9;
    const px = sx * (1 + 0.02 * u), pz = sz * (1 + 0.02 * u);
    const per = [-Math.sin(sa), Math.cos(sa)];
    sl.push(new BABYLON.Vector3(px + per[0] * w / 2, sy - 0.2 - drop, pz + per[1] * w / 2));
    sr2.push(new BABYLON.Vector3(px - per[0] * w / 2, sy - 0.2 - drop, pz - per[1] * w / 2));
  }
  const s2 = BABYLON.MeshBuilder.CreateRibbon("fall2", { pathArray: [sl, sr2] }, scene);
  s2.material = matFall; s2.isPickable = false;

  /* --------- particles --------- */
  const soft = radialTex("soft", "rgba(255,255,255,1)", "rgba(255,255,255,0)");
  const lipPos = new BABYLON.Vector3(lp[0] + lt[0] * 0.6, lipY, lp[1] + lt[1] * 0.6);

  const spray = new BABYLON.ParticleSystem("spray", 1400, scene);
  spray.particleTexture = soft;
  spray.emitter = lipPos;
  spray.minEmitBox = new BABYLON.Vector3(-perp[0] * 2 - 0.4, -0.1, -perp[1] * 2 - 0.4);
  spray.maxEmitBox = new BABYLON.Vector3(perp[0] * 2 + 0.4, 0.2, perp[1] * 2 + 0.4);
  spray.color1 = new BABYLON.Color4(0.85, 1, 1, 0.75);
  spray.color2 = new BABYLON.Color4(0.6, 0.95, 0.98, 0.5);
  spray.colorDead = new BABYLON.Color4(0.8, 0.95, 1, 0);
  spray.minSize = 0.12; spray.maxSize = 0.55;
  spray.minLifeTime = 1.1; spray.maxLifeTime = 2.4;
  spray.emitRate = 260;
  spray.gravity = new BABYLON.Vector3(0, -11, 0);
  spray.direction1 = new BABYLON.Vector3(lt[0] * 1.6 - 0.4, 0.2, lt[1] * 1.6 - 0.4);
  spray.direction2 = new BABYLON.Vector3(lt[0] * 2.4 + 0.4, -0.6, lt[1] * 2.4 + 0.4);
  spray.blendMode = BABYLON.ParticleSystem.BLENDMODE_STANDARD;
  spray.start();

  const mist = new BABYLON.ParticleSystem("mist", 420, scene);
  mist.particleTexture = soft;
  mist.emitter = new BABYLON.Vector3(lp[0] + lt[0] * 2.6, lipY - FALL * 0.86, lp[1] + lt[1] * 2.6);
  mist.minEmitBox = new BABYLON.Vector3(-2.6, -1.4, -2.6);
  mist.maxEmitBox = new BABYLON.Vector3(2.6, 1.4, 2.6);
  mist.color1 = new BABYLON.Color4(0.92, 1, 1, 0.30);
  mist.color2 = new BABYLON.Color4(0.75, 0.92, 1, 0.20);
  mist.colorDead = new BABYLON.Color4(1, 1, 1, 0);
  mist.minSize = 2.0; mist.maxSize = 5.5;
  mist.minLifeTime = 2.5; mist.maxLifeTime = 5.0;
  mist.emitRate = 42;
  mist.gravity = new BABYLON.Vector3(0, 0.5, 0);
  mist.direction1 = new BABYLON.Vector3(-0.5, 0.6, -0.5);
  mist.direction2 = new BABYLON.Vector3(0.5, 1.4, 0.5);
  mist.start();

  const motes = new BABYLON.ParticleSystem("motes", 320, scene);
  motes.particleTexture = soft;
  motes.emitter = new BABYLON.Vector3(0, -2, 0);
  motes.minEmitBox = new BABYLON.Vector3(-20, -6, -20);
  motes.maxEmitBox = new BABYLON.Vector3(20, 6, 20);
  motes.color1 = new BABYLON.Color4(1, 0.86, 0.5, 0.7);
  motes.color2 = new BABYLON.Color4(0.7, 1, 0.9, 0.5);
  motes.colorDead = new BABYLON.Color4(1, 1, 1, 0);
  motes.minSize = 0.07; motes.maxSize = 0.2;
  motes.minLifeTime = 4; motes.maxLifeTime = 9;
  motes.emitRate = 34;
  motes.gravity = new BABYLON.Vector3(0, 0.35, 0);
  motes.direction1 = new BABYLON.Vector3(-0.25, 0.2, -0.25);
  motes.direction2 = new BABYLON.Vector3(0.25, 0.7, 0.25);
  motes.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
  motes.start();

  /* chimney smoke over a couple of roofs */
  const smokeSpots = [];
  for (const s of SPOTS.slice(0, 3)) smokeSpots.push(new BABYLON.Vector3(s.x, terrainH(s.x, s.z) + 5.4, s.z));
  for (const pos of smokeSpots) {
    const sm = new BABYLON.ParticleSystem("smoke", 140, scene);
    sm.particleTexture = soft;
    sm.emitter = pos;
    sm.minEmitBox = new BABYLON.Vector3(-0.1, 0, -0.1);
    sm.maxEmitBox = new BABYLON.Vector3(0.1, 0, 0.1);
    sm.color1 = new BABYLON.Color4(0.85, 0.85, 0.88, 0.30);
    sm.color2 = new BABYLON.Color4(0.7, 0.72, 0.78, 0.22);
    sm.colorDead = new BABYLON.Color4(0.8, 0.8, 0.85, 0);
    sm.minSize = 0.5; sm.maxSize = 2.2;
    sm.minLifeTime = 2.4; sm.maxLifeTime = 4.6;
    sm.emitRate = 16;
    sm.gravity = new BABYLON.Vector3(0.4, 1.2, 0.1);
    sm.direction1 = new BABYLON.Vector3(-0.15, 0.5, -0.15);
    sm.direction2 = new BABYLON.Vector3(0.35, 1.0, 0.25);
    sm.start();
  }
}

/* ============================================================ SKY / AIR */
function buildSkyAndAir() {
  const SKYR = 1200;
  const sky = BABYLON.MeshBuilder.CreateSphere("sky", { diameter: SKYR * 2, segments: 32, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
  {
    const p = sky.getVerticesData(BABYLON.VertexBuffer.PositionKind);
    const n = p.length / 3, cols = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) {
      const c = skyColor(clamp(p[i * 3 + 1] / SKYR * 0.5 + 0.5, 0, 1));
      cols[i * 4] = c[0]; cols[i * 4 + 1] = c[1]; cols[i * 4 + 2] = c[2]; cols[i * 4 + 3] = 1;
    }
    sky.setVerticesData(BABYLON.VertexBuffer.ColorKind, cols);
  }
  const ms = new BABYLON.StandardMaterial("skyM", scene);
  ms.disableLighting = true;
  ms.emissiveColor = new BABYLON.Color3(1, 1, 1);
  ms.diffuseColor = new BABYLON.Color3(0, 0, 0);
  ms.specularColor = new BABYLON.Color3(0, 0, 0);
  ms.backFaceCulling = false;
  sky.material = ms;
  sky.infiniteDistance = true;
  sky.applyFog = false;
  sky.isPickable = false;
  sky.renderingGroupId = 0;

  /* sun disc */
  const glowT = radialTex("sunG", "rgba(255,244,214,1)", "rgba(255,190,120,0)");
  const sd = BABYLON.MeshBuilder.CreatePlane("sunD", { size: 260 }, scene);
  const sm = new BABYLON.StandardMaterial("sunM", scene);
  sm.disableLighting = true;
  sm.emissiveTexture = glowT;
  sm.opacityTexture = glowT;
  sm.diffuseColor = new BABYLON.Color3(0, 0, 0);
  sm.specularColor = new BABYLON.Color3(0, 0, 0);
  sm.alphaMode = BABYLON.Engine.ALPHA_ADD;
  sm.backFaceCulling = false;
  sd.material = sm;
  sd.position = sun.direction.normalizeToNew().scale(-900);
  sd.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
  sd.infiniteDistance = true;
  sd.applyFog = false; sd.isPickable = false;
  sd.renderingGroupId = 0;

  /* clouds */
  const matCloud = new BABYLON.StandardMaterial("cloud", scene);
  matCloud.diffuseColor = new BABYLON.Color3(1, 1, 1);
  matCloud.emissiveColor = new BABYLON.Color3(0.28, 0.31, 0.36);
  matCloud.specularColor = new BABYLON.Color3(0, 0, 0);
  matCloud.alpha = 0.94;
  for (let i = 0; i < 11; i++) {
    TARGET = [];
    const parts = TARGET;
    const puffs = 4 + ((rand() * 4) | 0);
    for (let p = 0; p < puffs; p++) {
      SP(rr(4, 8), rr(-5, 5), rr(-0.8, 0.8), rr(-3.5, 3.5), new BABYLON.Color3(1, 1, 1), { seg: 8, sy: rr(0.5, 0.72), ao: 0.42 });
    }
    TARGET = null;
    const cl = BABYLON.Mesh.MergeMeshes(parts, true, true);
    cl.material = matCloud;
    cl.isPickable = false; cl.applyFog = true;
    const ang = rr(0, 6.28), rad = rr(30, 62), yy = rr(-10, 8);
    cl.position.set(Math.cos(ang) * rad, yy, Math.sin(ang) * rad);
    cl.scaling.setAll(rr(0.7, 1.5));
    ANIM.clouds.push({ mesh: cl, a: ang, r: rad, y: yy, s: rr(0.006, 0.017) * (rand() < 0.5 ? -1 : 1) });
  }

  /* birds */
  const matBird = new BABYLON.StandardMaterial("bird", scene);
  matBird.diffuseColor = C('#3A4450');
  matBird.emissiveColor = C('#151C24');
  matBird.specularColor = new BABYLON.Color3(0, 0, 0);
  matBird.backFaceCulling = false;
  for (let i = 0; i < 7; i++) {
    const root = new BABYLON.TransformNode("bird", scene);
    const body = BABYLON.MeshBuilder.CreateBox("bd", { width: 0.22, height: 0.14, depth: 0.7 }, scene);
    body.material = matBird; body.parent = root; body.isPickable = false;
    const wings = [];
    for (const s of [-1, 1]) {
      const w = BABYLON.MeshBuilder.CreateBox("wg", { width: 1.1, height: 0.06, depth: 0.42 }, scene);
      w.material = matBird; w.parent = root; w.isPickable = false;
      w.position.x = s * 0.6;
      w.setPivotPoint(new BABYLON.Vector3(-s * 0.55, 0, 0));
      wings.push({ mesh: w, s: s });
    }
    ANIM.birds.push({ root: root, wings: wings, a: rr(0, 6.28), r: rr(24, 40), y: rr(6, 16), s: rr(0.10, 0.20), ph: rr(0, 6.28) });
  }
}

/* =============================================================== ANIMATE */
function animate() {
  let time = 0;
  scene.registerBeforeRender(() => {
    const dt = Math.min(0.05, engine.getDeltaTime() / 1000);
    time += dt;

    /* water ripples */
    if (waterMesh && waterBase) {
      const p = waterMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      for (let i = 0; i < p.length; i += 3) {
        const x = waterBase[i], z = waterBase[i + 2];
        p[i + 1] = waterBase[i + 1] + 0.055 * Math.sin(x * 1.5 + time * 2.6) * Math.cos(z * 1.35 - time * 2.1)
          + 0.03 * Math.sin(z * 3.1 + time * 4.0);
      }
      waterMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, p);
      const mat = waterMesh.material;
      if (mat.bumpTexture) { mat.bumpTexture.vOffset -= dt * 0.5; mat.bumpTexture.uOffset += dt * 0.04; }
    }
    if (fallMesh && fallBase) {
      const p = fallMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      for (let i = 0; i < p.length; i += 3) {
        const y = fallBase[i + 1];
        const w = 0.06 * Math.sin(y * 2.2 + time * 7.0);
        p[i] = fallBase[i] + w;
        p[i + 2] = fallBase[i + 2] + w * 0.6;
      }
      fallMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, p);
      const fm = fallMesh.material;
      if (fm.bumpTexture) fm.bumpTexture.vOffset -= dt * 2.6;
    }

    /* mill wheels */
    for (const w of ANIM.wheels) w.rotation.x += dt * 0.55;

    /* flags */
    for (const f of ANIM.flags) {
      const p = f.mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const b = f.base;
      for (let i = 0; i < p.length; i += 3) {
        const u = b[i] / f.w;
        p[i + 2] = Math.sin(u * 7.0 - time * 5.5 + f.phase) * 0.14 * u * f.w;
        p[i + 1] = b[i + 1] + Math.sin(u * 5.0 - time * 5.5 + f.phase) * 0.05 * u;
      }
      f.mesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, p);
    }

    /* clouds */
    for (const c of ANIM.clouds) {
      c.a += c.s * dt;
      c.mesh.position.x = Math.cos(c.a) * c.r;
      c.mesh.position.z = Math.sin(c.a) * c.r;
      c.mesh.position.y = c.y + Math.sin(time * 0.3 + c.a) * 0.5;
    }

    /* birds */
    for (const b of ANIM.birds) {
      b.a += b.s * dt;
      const x = Math.cos(b.a) * b.r, z = Math.sin(b.a) * b.r;
      b.root.position.set(x, b.y + Math.sin(time * 0.6 + b.ph) * 1.4, z);
      b.root.rotation.y = -b.a + Math.PI / 2;
      const flap = Math.sin(time * 7 + b.ph) * 0.55;
      for (const w of b.wings) w.mesh.rotation.z = -w.s * flap;
    }
  });
}

btnSpin.addEventListener("click", () => {
  const on = btnSpin.getAttribute("aria-pressed") === "true";
  btnSpin.setAttribute("aria-pressed", String(!on));
  camera.useAutoRotationBehavior = !on;
  if (!on && camera.autoRotationBehavior) camera.autoRotationBehavior.idleRotationSpeed = 0.055;
});
btnView.addEventListener("click", () => {
  const M = BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT;
  const ease = new BABYLON.CubicEase();
  ease.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);
  let a = camera.alpha % (Math.PI * 2);
  if (a > Math.PI) a -= Math.PI * 2; else if (a < -Math.PI) a += Math.PI * 2;
  camera.alpha = a;
  BABYLON.Animation.CreateAndStartAnimation("ra", camera, "radius", 60, 45, camera.radius, 66, M, ease);
  BABYLON.Animation.CreateAndStartAnimation("be", camera, "beta", 60, 45, camera.beta, 1.06, M, ease);
  BABYLON.Animation.CreateAndStartAnimation("al", camera, "alpha", 60, 45, a, -2.05, M, ease);
});

window.addEventListener("resize", () => engine.resize());

engine.runRenderLoop(() => { if (scene.activeCamera) scene.render(); });

build().then(() => {
  scene.executeWhenReady(() => {
    setTimeout(() => {
      loader.classList.add("out");
      document.getElementById("placard").classList.add("in");
      document.getElementById("ctrls").classList.add("in");
      document.getElementById("hint").classList.add("in");
      setTimeout(() => loader.remove(), 900);
    }, 350);
  });
}).catch(err => {
  document.getElementById("stage").textContent = "the island refused to rise — " + err.message;
  console.error(err);
});
</script>
</body>
</html>
