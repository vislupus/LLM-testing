<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diffusion-Limited Aggregation</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f2ee;--panel:rgba(32,30,28,0.94);--border:rgba(255,255,255,0.06);
  --text:#d4d0c8;--text2:#7a756a;--accent:#c8a050;--accent2:#a08040;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'JetBrains Mono',monospace;color:var(--text)}

#wrap{display:flex;align-items:center;justify-content:center;height:100%;gap:0;position:relative}
canvas{display:block;border-radius:4px;box-shadow:0 2px 24px rgba(0,0,0,0.08)}

/* ═══ Control Panel ═══ */
#panel{position:absolute;top:14px;right:14px;width:220px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 15px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:10px;z-index:10}

.sec-title{font-family:'Outfit',sans-serif;font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);padding-bottom:3px;border-bottom:1px solid var(--border)}
.ctrl{display:flex;flex-direction:column;gap:2px}
.ctrl-head{display:flex;justify-content:space-between;align-items:center}
.ctrl-label{font-size:9px;color:var(--text2);letter-spacing:.5px}
.ctrl-val{font-size:9.5px;font-weight:600;color:var(--text)}

input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.06);outline:none;margin:2px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #1a1816}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #1a1816}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stat{background:rgba(255,255,255,.03);border-radius:4px;padding:5px 7px}
.stat-label{font-size:7.5px;color:var(--text2);letter-spacing:1px;text-transform:uppercase}
.stat-val{font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;color:var(--text);margin-top:1px}

.btn-row{display:flex;gap:5px}
.btn{flex:1;padding:6px 0;text-align:center;font-size:8.5px;font-weight:500;letter-spacing:1px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:5px;color:var(--text2);cursor:pointer;transition:.15s;font-family:'JetBrains Mono',monospace}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:rgba(200,160,80,.1);border-color:var(--accent);color:var(--accent)}

/* ═══ Title ═══ */
#title{position:absolute;top:14px;left:14px;z-index:10}
.t1{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;color:#2a2824;letter-spacing:.5px}
.t2{font-size:8.5px;color:#8a8478;letter-spacing:1.5px;margin-top:2px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
</div>

<div id="title">
  <div class="t1">Diffusion-Limited Aggregation</div>
  <div class="t2">Fractal Crystal Growth Simulation</div>
</div>

<div id="panel">
  <div class="sec-title">Parameters</div>

  <div class="ctrl">
    <div class="ctrl-head"><span class="ctrl-label">Active Particles</span><span class="ctrl-val" id="v-count">100</span></div>
    <input type="range" min="20" max="500" value="100" id="s-count">
  </div>
  <div class="ctrl">
    <div class="ctrl-head"><span class="ctrl-label">Movement Speed</span><span class="ctrl-val" id="v-speed">3</span></div>
    <input type="range" min="1" max="8" value="3" id="s-speed">
  </div>
  <div class="ctrl">
    <div class="ctrl-head"><span class="ctrl-label">Inward Bias</span><span class="ctrl-val" id="v-bias">0.15</span></div>
    <input type="range" min="0" max="60" value="15" id="s-bias">
  </div>
  <div class="ctrl">
    <div class="ctrl-head"><span class="ctrl-label">Steps / Frame</span><span class="ctrl-val" id="v-steps">12</span></div>
    <input type="range" min="1" max="60" value="12" id="s-steps">
  </div>
  <div class="ctrl">
    <div class="ctrl-head"><span class="ctrl-label">Particle Size</span><span class="ctrl-val" id="v-size">2</span></div>
    <input type="range" min="1" max="5" value="2" id="s-size">
  </div>

  <div class="sec-title" style="margin-top:2px">Statistics</div>
  <div class="stat-grid">
    <div class="stat"><div class="stat-label">Fixed</div><div class="stat-val" id="st-fixed">1</div></div>
    <div class="stat"><div class="stat-label">Active</div><div class="stat-val" id="st-active">0</div></div>
    <div class="stat"><div class="stat-label">Radius</div><div class="stat-val" id="st-radius">0</div></div>
    <div class="stat"><div class="stat-label">FPS</div><div class="stat-val" id="st-fps">60</div></div>
  </div>

  <div class="sec-title" style="margin-top:2px">Color Mode</div>
  <div class="btn-row">
    <div class="btn on" id="cm-age" onclick="setColorMode('age')">Age</div>
    <div class="btn" id="cm-dist" onclick="setColorMode('distance')">Distance</div>
    <div class="btn" id="cm-branch" onclick="setColorMode('branch')">Branch</div>
  </div>

  <div class="btn-row" style="margin-top:2px">
    <div class="btn" onclick="togglePause();" id="btn-pause">⏸ Pause</div>
    <div class="btn" onclick="restart()">↺ Restart</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  DIFFUSION-LIMITED AGGREGATION
//  High-performance simulation with grid-based collision detection
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ─── Canvas Sizing ───────────────────────────────────────────
const SIZE = Math.min(window.innerWidth - 260, window.innerHeight - 28, 800);
canvas.width = SIZE;
canvas.height = SIZE;
const CX = SIZE / 2;
const CY = SIZE / 2;
const EDGE_MARGIN = 50; // Stop growth at this distance from edge
const MAX_RADIUS = CX - EDGE_MARGIN;

// ─── Parameters (controlled by sliders) ──────────────────────
let paramCount    = 100;
let paramSpeed    = 3;
let paramBias     = 0.15;
let paramSteps    = 12;
let paramSize     = 2;
let colorMode     = 'age';
let paused        = false;

// ─── State ───────────────────────────────────────────────────
let fixedParticles  = [];  // { x, y, order, branchId }
let activeParticles = [];  // { x, y }
let grid;                  // Spatial lookup grid
let gridCellSize;
let gridCols, gridRows;
let clusterRadius   = 0;  // Current max radius of the cluster
let spawnRadius     = 0;  // Where new particles appear
let totalFixed      = 0;
let growthComplete  = false;
let branchCounter   = 0;

// ─── Offscreen buffer for fixed crystal ──────────────────────
// Drawing thousands of fixed particles every frame is wasteful.
// We draw each fixed particle ONCE onto an offscreen canvas,
// then composite it each frame. Only active particles are redrawn.
let fixedBuffer;
let fixedCtx;

// ─── Spatial Grid ────────────────────────────────────────────
// Grid cells store whether a fixed particle occupies that cell.
// Collision check: look at the 8 neighboring cells + own cell.
// This gives O(1) per-particle collision detection.

function initGrid() {
  gridCellSize = Math.max(paramSize * 2, 3);
  gridCols = Math.ceil(SIZE / gridCellSize);
  gridRows = Math.ceil(SIZE / gridCellSize);
  grid = new Uint8Array(gridCols * gridRows); // 0 = empty, 1 = occupied
}

function gridIdx(x, y) {
  const col = Math.floor(x / gridCellSize);
  const row = Math.floor(y / gridCellSize);
  if (col < 0 || col >= gridCols || row < 0 || row >= gridRows) return -1;
  return row * gridCols + col;
}

function markGrid(x, y) {
  const idx = gridIdx(x, y);
  if (idx >= 0) grid[idx] = 1;
}

function hasFixedNeighbor(x, y) {
  const col = Math.floor(x / gridCellSize);
  const row = Math.floor(y / gridCellSize);
  // Check 5×5 neighborhood for safety with larger particle sizes
  const range = Math.ceil(paramSize * 2 / gridCellSize) + 1;
  for (let dr = -range; dr <= range; dr++) {
    for (let dc = -range; dc <= range; dc++) {
      const c = col + dc;
      const r = row + dr;
      if (c < 0 || c >= gridCols || r < 0 || r >= gridRows) continue;
      if (grid[r * gridCols + c] === 1) {
        return true;
      }
    }
  }
  return false;
}

// More precise check against actual fixed particle positions in vicinity
function touchesFixed(x, y) {
  const stickDist = paramSize * 2.2; // Slightly larger than 2r for reliable sticking
  const stickDistSq = stickDist * stickDist;

  // Quick grid pre-check
  if (!hasFixedNeighbor(x, y)) return false;

  // Fine check: scan nearby fixed particles
  // Use grid to find candidates
  const col = Math.floor(x / gridCellSize);
  const row = Math.floor(y / gridCellSize);
  const range = Math.ceil(stickDist / gridCellSize) + 1;

  for (let i = fixedParticles.length - 1; i >= Math.max(0, fixedParticles.length - 5000); i--) {
    const fp = fixedParticles[i];
    const dx = fp.x - x;
    const dy = fp.y - y;
    if (dx * dx + dy * dy < stickDistSq) {
      return true;
    }
  }

  // Also check all particles if cluster is small
  if (fixedParticles.length <= 5000) return false;

  // For very large clusters, the grid check + recent particles is sufficient
  return false;
}

// Optimized: use grid-only fast check for large clusters
function touchesFixedFast(x, y) {
  const stickDist = paramSize * 2.2;
  const stickDistSq = stickDist * stickDist;

  if (!hasFixedNeighbor(x, y)) return false;

  // Check recent fixed particles (most likely to be on the boundary)
  const checkCount = Math.min(fixedParticles.length, 3000);
  for (let i = fixedParticles.length - 1; i >= fixedParticles.length - checkCount; i--) {
    const fp = fixedParticles[i];
    const dx = fp.x - x;
    const dy = fp.y - y;
    if (dx * dx + dy * dy < stickDistSq) return true;
  }
  return false;
}

// ─── Color Computation ───────────────────────────────────────

function particleColor(fp) {
  if (colorMode === 'age') {
    // Warm palette: dark amber → gold → cream by attachment order
    const t = fp.order / Math.max(totalFixed, 1);
    const r = Math.floor(40 + t * 180);
    const g = Math.floor(25 + t * 140);
    const b = Math.floor(15 + t * 60);
    return `rgb(${r},${g},${b})`;
  }
  if (colorMode === 'distance') {
    // Distance from center: deep brown → terracotta → sand
    const dx = fp.x - CX, dy = fp.y - CY;
    const d = Math.sqrt(dx * dx + dy * dy);
    const t = Math.min(d / MAX_RADIUS, 1);
    const r = Math.floor(50 + t * 170);
    const g = Math.floor(30 + t * 120);
    const b = Math.floor(20 + t * 50);
    return `rgb(${r},${g},${b})`;
  }
  if (colorMode === 'branch') {
    // Each branch gets a distinct hue
    const hue = (fp.branchId * 47) % 360;
    const sat = 45 + (fp.branchId * 13) % 30;
    const lgt = 30 + (fp.order / Math.max(totalFixed, 1)) * 35;
    return `hsl(${hue},${sat}%,${lgt}%)`;
  }
  return '#8a7a5a';
}

// ─── Initialization ──────────────────────────────────────────

function init() {
  fixedParticles = [];
  activeParticles = [];
  totalFixed = 0;
  clusterRadius = 0;
  growthComplete = false;
  branchCounter = 0;

  // Offscreen buffer
  fixedBuffer = document.createElement('canvas');
  fixedBuffer.width = SIZE;
  fixedBuffer.height = SIZE;
  fixedCtx = fixedBuffer.getContext('2d');
  fixedCtx.fillStyle = '#f4f2ee';
  fixedCtx.fillRect(0, 0, SIZE, SIZE);

  initGrid();

  // Seed: single particle at center
  const seed = { x: CX, y: CY, order: 0, branchId: 0 };
  fixedParticles.push(seed);
  markGrid(CX, CY);
  drawFixedParticle(seed);
  totalFixed = 1;

  // Spawn initial active particles
  spawnRadius = 30;
  for (let i = 0; i < paramCount; i++) {
    spawnParticle();
  }
}

function spawnParticle() {
  // Spawn on a circle around the cluster, with some randomness
  const r = spawnRadius + Math.random() * 20;
  const angle = Math.random() * Math.PI * 2;
  const x = CX + r * Math.cos(angle);
  const y = CY + r * Math.sin(angle);

  // Ensure within canvas bounds
  const cx = Math.max(paramSize, Math.min(SIZE - paramSize, x));
  const cy = Math.max(paramSize, Math.min(SIZE - paramSize, y));

  activeParticles.push({ x: cx, y: cy });
}

function drawFixedParticle(fp) {
  fixedCtx.fillStyle = particleColor(fp);
  fixedCtx.beginPath();
  fixedCtx.arc(fp.x, fp.y, paramSize, 0, Math.PI * 2);
  fixedCtx.fill();
}

// ─── Redraw all fixed particles (when color mode changes) ────
function redrawAllFixed() {
  fixedCtx.fillStyle = '#f4f2ee';
  fixedCtx.fillRect(0, 0, SIZE, SIZE);
  for (const fp of fixedParticles) {
    drawFixedParticle(fp);
  }
}

// ─── Simulation Step ─────────────────────────────────────────

function simStep() {
  if (growthComplete) return;

  const speed = paramSpeed;
  const bias = paramBias;
  const killRadius = spawnRadius + 80; // Despawn if too far

  for (let i = activeParticles.length - 1; i >= 0; i--) {
    const p = activeParticles[i];

    // Random walk + inward bias
    const angle = Math.random() * Math.PI * 2;
    let dx = Math.cos(angle) * speed;
    let dy = Math.sin(angle) * speed;

    // Inward bias toward center
    const toCenterX = CX - p.x;
    const toCenterY = CY - p.y;
    const dist = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
    if (dist > 1) {
      dx += (toCenterX / dist) * bias * speed;
      dy += (toCenterY / dist) * bias * speed;
    }

    p.x += dx;
    p.y += dy;

    // Clamp to canvas
    p.x = Math.max(paramSize, Math.min(SIZE - paramSize, p.x));
    p.y = Math.max(paramSize, Math.min(SIZE - paramSize, p.y));

    // Check if touches fixed structure
    if (touchesFixedFast(p.x, p.y)) {
      // Fix this particle
      branchCounter++;
      const fp = {
        x: p.x, y: p.y,
        order: totalFixed,
        branchId: branchCounter % 60,
      };
      fixedParticles.push(fp);
      markGrid(p.x, p.y);
      drawFixedParticle(fp);
      totalFixed++;

      // Update cluster radius
      const r = Math.sqrt((p.x - CX) ** 2 + (p.y - CY) ** 2);
      if (r > clusterRadius) clusterRadius = r;

      // Update spawn radius to stay ahead of cluster
      spawnRadius = Math.max(spawnRadius, clusterRadius + 25);

      // Check growth limit
      if (clusterRadius >= MAX_RADIUS) {
        growthComplete = true;
      }

      // Remove from active and spawn replacement
      activeParticles.splice(i, 1);
      if (!growthComplete) spawnParticle();
      continue;
    }

    // Despawn if too far from cluster (respawn closer)
    const dFromCenter = Math.sqrt((p.x - CX) ** 2 + (p.y - CY) ** 2);
    if (dFromCenter > killRadius) {
      activeParticles.splice(i, 1);
      if (!growthComplete) spawnParticle();
    }
  }

  // Maintain target active count
  while (activeParticles.length < paramCount && !growthComplete) {
    spawnParticle();
  }
}

// ─── Render ──────────────────────────────────────────────────

let lastFrameTime = performance.now();
let fps = 60;

function render() {
  // FPS tracking
  const now = performance.now();
  const dt = now - lastFrameTime;
  lastFrameTime = now;
  fps = fps * 0.95 + (1000 / Math.max(dt, 1)) * 0.05;

  if (!paused) {
    for (let s = 0; s < paramSteps; s++) {
      simStep();
    }
  }

  // Clear and draw fixed buffer
  ctx.drawImage(fixedBuffer, 0, 0);

  // Draw active particles (wandering dots)
  ctx.fillStyle = 'rgba(160, 140, 100, 0.45)';
  for (const p of activeParticles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, paramSize * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // Center seed highlight
  ctx.fillStyle = 'rgba(200, 170, 80, 0.6)';
  ctx.beginPath();
  ctx.arc(CX, CY, paramSize + 1, 0, Math.PI * 2);
  ctx.fill();

  // Growth boundary ring
  if (!growthComplete) {
    ctx.strokeStyle = 'rgba(0,0,0,0.04)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(CX, CY, MAX_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Completion indicator
  if (growthComplete) {
    ctx.fillStyle = 'rgba(32,30,28,0.6)';
    ctx.font = '500 13px Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Growth Complete — ' + totalFixed.toLocaleString() + ' particles', CX, SIZE - 18);
  }

  updateStats();
  requestAnimationFrame(render);
}

// ─── Stats Update ────────────────────────────────────────────

let statsTimer = 0;
function updateStats() {
  statsTimer++;
  if (statsTimer % 10 !== 0) return;
  document.getElementById('st-fixed').textContent = totalFixed.toLocaleString();
  document.getElementById('st-active').textContent = activeParticles.length;
  document.getElementById('st-radius').textContent = Math.round(clusterRadius) + 'px';
  document.getElementById('st-fps').textContent = Math.round(fps);
}

// ─── Slider Bindings ─────────────────────────────────────────

function bindSlider(sliderId, valueId, formatter, setter) {
  const sl = document.getElementById(sliderId);
  const vl = document.getElementById(valueId);
  sl.addEventListener('input', () => {
    const v = parseFloat(sl.value);
    vl.textContent = formatter(v);
    setter(v);
  });
}

bindSlider('s-count', 'v-count', v => v, v => { paramCount = v; });
bindSlider('s-speed', 'v-speed', v => v, v => { paramSpeed = v; });
bindSlider('s-bias', 'v-bias', v => (v / 100).toFixed(2), v => { paramBias = v / 100; });
bindSlider('s-steps', 'v-steps', v => v, v => { paramSteps = v; });
bindSlider('s-size', 'v-size', v => v, v => { paramSize = v; initGrid(); });

function setColorMode(mode) {
  colorMode = mode;
  document.getElementById('cm-age').classList.toggle('on', mode === 'age');
  document.getElementById('cm-dist').classList.toggle('on', mode === 'distance');
  document.getElementById('cm-branch').classList.toggle('on', mode === 'branch');
  redrawAllFixed();
}

function togglePause() {
  paused = !paused;
  const b = document.getElementById('btn-pause');
  b.textContent = paused ? '▶ Resume' : '⏸ Pause';
  b.classList.toggle('on', paused);
}

function restart() {
  init();
}

// ─── Start ───────────────────────────────────────────────────
init();
requestAnimationFrame(render);
</script>
</body>
</html>
