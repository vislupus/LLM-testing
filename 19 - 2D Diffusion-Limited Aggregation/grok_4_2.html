<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLA • Diffusion-Limited Aggregation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            margin: 0;
            background: #111;
            font-family: 'Inter', system-ui;
            overflow: hidden;
        }
        canvas {
            display: block;
            margin: 0 auto;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20,20,30,0.95);
            padding: 18px 22px;
            border-radius: 14px;
            color: #ddd;
            width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            user-select: none;
        }
        h1 {
            margin: 0 0 18px 0;
            font-size: 18px;
            color: #6cf;
        }
        .slider {
            margin: 14px 0;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #6cf;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #6cf;
        }
        .value {
            float: right;
            font-family: monospace;
            color: #6cf;
        }
        button {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: #6cf;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h1>DIFFUSION-LIMITED AGGREGATION</h1>
        
        <div class="slider">
            <label>Active Particles <span id="countVal" class="value">120</span></label>
            <input type="range" id="countSlider" min="40" max="300" value="120">
        </div>
        
        <div class="slider">
            <label>Movement Speed <span id="speedVal" class="value">3.2</span></label>
            <input type="range" id="speedSlider" min="1" max="8" value="3.2" step="0.2">
        </div>
        
        <div class="slider">
            <label>Inward Bias <span id="biasVal" class="value">0.28</span></label>
            <input type="range" id="biasSlider" min="0" max="0.8" value="0.28" step="0.02">
        </div>
        
        <button onclick="resetSimulation()">RESET SIMULATION</button>
    </div>

    <script>
        // ================================================
        // DLA — Diffusion-Limited Aggregation
        // 2D real-time simulation • 100% standalone HTML
        // Particles spawn around cluster • Random walk + inward bias
        // Sticks on contact • Growth stops at edge
        // Smooth animation • Adjustable parameters
        // ================================================

        let fixed = [];
        let moving = [];
        let maxRadius = 0;
        let running = true;

        let maxActive = 120;
        let moveSpeed = 3.2;
        let biasStrength = 0.28;

        let canvasSize = 800;
        let centerX, centerY;

        class Particle {
            constructor(x, y, isFixed = false) {
                this.x = x;
                this.y = y;
                this.fixed = isFixed;
                this.radius = isFixed ? 2.8 : 3.2;
            }
        }

        function setup() {
            createCanvas(canvasSize, canvasSize);
            centerX = width / 2;
            centerY = height / 2;
            resetSimulation();
        }

        function resetSimulation() {
            fixed = [];
            moving = [];
            maxRadius = 0;
            running = true;
            
            // Central seed
            fixed.push(new Particle(centerX, centerY, true));
            
            // Initial 100 moving particles
            for (let i = 0; i < 100; i++) {
                spawnMovingParticle();
            }
        }

        function spawnMovingParticle() {
            if (moving.length >= maxActive || !running) return;
            
            // Spawn on a large circle around the cluster
            let angle = random(TWO_PI);
            let dist = maxRadius + 80 + random(60);
            let x = centerX + cos(angle) * dist;
            let y = centerY + sin(angle) * dist;
            
            moving.push(new Particle(x, y, false));
        }

        function draw() {
            background(220);
            
            // Draw fixed particles
            fill(30, 40, 70);
            noStroke();
            for (let p of fixed) {
                circle(p.x, p.y, p.radius * 2);
            }
            
            // Draw moving particles
            fill(255, 90, 40);
            for (let p of moving) {
                circle(p.x, p.y, p.radius * 2);
            }
            
            if (!running) return;
            
            // Update moving particles
            for (let i = moving.length - 1; i >= 0; i--) {
                let p = moving[i];
                
                // Random walk
                let dx = random(-moveSpeed, moveSpeed);
                let dy = random(-moveSpeed, moveSpeed);
                
                // Inward bias toward center of mass (approximated by current max radius center)
                let toCenterX = centerX - p.x;
                let toCenterY = centerY - p.y;
                let distToCenter = sqrt(toCenterX*toCenterX + toCenterY*toCenterY);
                if (distToCenter > 10) {
                    dx += toCenterX / distToCenter * biasStrength * moveSpeed * 0.8;
                    dy += toCenterY / distToCenter * biasStrength * moveSpeed * 0.8;
                }
                
                p.x += dx;
                p.y += dy;
                
                // Check collision with fixed particles
                let stuck = false;
                for (let j = 0; j < fixed.length; j++) {
                    let f = fixed[j];
                    let dx = p.x - f.x;
                    let dy = p.y - f.y;
                    if (dx*dx + dy*dy < 36) { // distance < 6
                        fixed.push(new Particle(p.x, p.y, true));
                        moving.splice(i, 1);
                        stuck = true;
                        
                        // Update max radius
                        let r = dist(p.x, p.y, centerX, centerY);
                        if (r > maxRadius) maxRadius = r;
                        
                        // Spawn replacement
                        spawnMovingParticle();
                        
                        break;
                    }
                }
                
                // Stop spawning if cluster reaches edge
                if (maxRadius > width/2 - 50) {
                    running = false;
                }
            }
            
            // Keep at least some moving particles
            while (moving.length < 30 && running) {
                spawnMovingParticle();
            }
        }

        // UI controls
        window.onload = () => {
            const countSlider = document.getElementById('countSlider');
            const speedSlider = document.getElementById('speedSlider');
            const biasSlider = document.getElementById('biasSlider');
            
            countSlider.oninput = () => {
                maxActive = parseInt(countSlider.value);
                document.getElementById('countVal').textContent = maxActive;
            };
            
            speedSlider.oninput = () => {
                moveSpeed = parseFloat(speedSlider.value);
                document.getElementById('speedVal').textContent = moveSpeed.toFixed(1);
            };
            
            biasSlider.oninput = () => {
                biasStrength = parseFloat(biasSlider.value);
                document.getElementById('biasVal').textContent = biasStrength.toFixed(2);
            };
        };
    </script>
</body>
</html>
