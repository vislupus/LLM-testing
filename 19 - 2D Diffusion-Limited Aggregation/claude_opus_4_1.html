<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion-Limited Aggregation Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            max-width: 280px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        #controls h3 {
            margin: 0 0 10px 0;
            color: #4fc3f7;
        }
        
        .control-group {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .control-group label {
            flex: 1;
            margin-right: 10px;
        }
        
        .control-group input {
            width: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 3px;
            border-radius: 3px;
        }
        
        .control-group span {
            width: 40px;
            text-align: right;
            color: #4fc3f7;
        }
        
        button {
            background: #4fc3f7;
            color: black;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            font-weight: bold;
        }
        
        button:hover {
            background: #29b6f6;
        }
        
        #stats {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
        }
        
        #colorMode {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>DLA Simulation Controls</h3>
        
        <div class="control-group">
            <label for="particleCount">Particles:</label>
            <input type="range" id="particleCount" min="10" max="500" value="100">
            <span id="particleCountVal">100</span>
        </div>
        
        <div class="control-group">
            <label for="moveSpeed">Speed:</label>
            <input type="range" id="moveSpeed" min="1" max="20" value="5">
            <span id="moveSpeedVal">5</span>
        </div>
        
        <div class="control-group">
            <label for="biasStrength">Inward Bias:</label>
            <input type="range" id="biasStrength" min="0" max="100" value="20">
            <span id="biasStrengthVal">20%</span>
        </div>
        
        <div class="control-group">
            <label for="stickDistance">Stick Distance:</label>
            <input type="range" id="stickDistance" min="1" max="5" value="2">
            <span id="stickDistanceVal">2</span>
        </div>
        
        <div class="control-group">
            <label for="colorMode">Color Mode:</label>
            <select id="colorMode" style="width: 100px;">
                <option value="age">Age</option>
                <option value="distance">Distance</option>
                <option value="branch">Branch</option>
                <option value="white">White</option>
            </select>
        </div>
        
        <div>
            <button onclick="resetSimulation()">Reset</button>
            <button onclick="togglePause()">Pause/Resume</button>
        </div>
        
        <div id="stats">
            <div>Fixed Particles: <span id="fixedCount">1</span></div>
            <div>Max Radius: <span id="maxRadius">0</span> px</div>
            <div>Growth Rate: <span id="growthRate">0</span>/sec</div>
            <div>Status: <span id="status">Growing</span></div>
        </div>
    </div>

    <script>
        class Particle {
            constructor(x, y, id) {
                this.pos = createVector(x, y);
                this.fixed = false;
                this.id = id;
                this.age = 0;
                this.distanceFromCenter = 0;
                this.branch = 0;
                this.color = color(255);
            }
            
            move(biasStrength, speed) {
                if (this.fixed) return;
                
                // Random walk with optional bias toward center
                let step = p5.Vector.random2D();
                step.mult(speed);
                
                // Add inward bias
                if (biasStrength > 0 && random() < biasStrength) {
                    let toCenter = createVector(width/2 - this.pos.x, height/2 - this.pos.y);
                    toCenter.normalize();
                    toCenter.mult(speed * 0.5);
                    step.add(toCenter);
                }
                
                this.pos.add(step);
                
                // Wrap around edges or bounce
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.y < 0) this.pos.y = height;
                if (this.pos.y > height) this.pos.y = 0;
            }
            
            checkSticking(grid, stickDist) {
                if (this.fixed) return false;
                
                let gridX = Math.floor(this.pos.x);
                let gridY = Math.floor(this.pos.y);
                
                // Check neighboring cells
                for (let dx = -stickDist; dx <= stickDist; dx++) {
                    for (let dy = -stickDist; dy <= stickDist; dy++) {
                        let nx = gridX + dx;
                        let ny = gridY + dy;
                        
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                            if (grid[nx][ny]) {
                                let dist = sqrt(dx * dx + dy * dy);
                                if (dist <= stickDist) {
                                    return true;
                                }
                            }
                        }
                    }
                }
                return false;
            }
            
            fix(grid, fixedParticles) {
                this.fixed = true;
                let gridX = Math.floor(this.pos.x);
                let gridY = Math.floor(this.pos.y);
                
                if (gridX >= 0 && gridX < width && gridY >= 0 && gridY < height) {
                    grid[gridX][gridY] = true;
                }
                
                this.age = fixedParticles;
                this.distanceFromCenter = dist(this.pos.x, this.pos.y, width/2, height/2);
                
                // Determine branch based on angle
                let angle = atan2(this.pos.y - height/2, this.pos.x - width/2);
                this.branch = Math.floor((angle + PI) / (TWO_PI / 8));
            }
            
            display(colorMode) {
                if (!this.fixed) {
                    // Moving particles
                    stroke(100, 200, 255, 150);
                    strokeWeight(2);
                    point(this.pos.x, this.pos.y);
                } else {
                    // Fixed particles with color based on mode
                    noStroke();
                    
                    switch(colorMode) {
                        case 'age':
                            let hue = map(this.age, 0, 5000, 0, 280);
                            colorMode(HSB);
                            fill(hue, 80, 100);
                            colorMode(RGB);
                            break;
                        case 'distance':
                            let brightness = map(this.distanceFromCenter, 0, width/2, 255, 50);
                            fill(brightness, brightness * 0.7, brightness);
                            break;
                        case 'branch':
                            let colors = [
                                color(255, 100, 100), color(100, 255, 100),
                                color(100, 100, 255), color(255, 255, 100),
                                color(255, 100, 255), color(100, 255, 255),
                                color(255, 200, 100), color(200, 100, 255)
                            ];
                            fill(colors[this.branch % 8]);
                            break;
                        default:
                            fill(255);
                    }
                    
                    ellipse(this.pos.x, this.pos.y, 3, 3);
                }
            }
        }
        
        let particles = [];
        let grid;
        let particleCount = 100;
        let moveSpeed = 5;
        let biasStrength = 0.2;
        let stickDistance = 2;
        let isPaused = false;
        let maxRadius = 0;
        let fixedCount = 0;
        let lastFixedTime = 0;
        let growthStopped = false;
        let colorModeValue = 'age';
        let edgeBuffer = 50;
        let nextId = 0;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            
            // Initialize grid for efficient collision detection
            grid = new Array(width);
            for (let i = 0; i < width; i++) {
                grid[i] = new Array(height).fill(false);
            }
            
            // Create initial seed at center
            let seed = new Particle(width/2, height/2, nextId++);
            seed.fix(grid, 0);
            particles.push(seed);
            fixedCount = 1;
            
            // Create initial particles
            spawnParticles(particleCount);
            
            // Setup controls
            setupControls();
        }
        
        function draw() {
            background(20);
            
            if (!isPaused && !growthStopped) {
                // Move and check particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    
                    if (!p.fixed) {
                        p.move(biasStrength, moveSpeed);
                        
                        if (p.checkSticking(grid, stickDistance)) {
                            p.fix(grid, fixedCount);
                            fixedCount++;
                            
                            // Update max radius
                            let dist = p.distanceFromCenter;
                            if (dist > maxRadius) {
                                maxRadius = dist;
                                
                                // Check if we've reached the edge
                                if (maxRadius > min(width, height) / 2 - edgeBuffer) {
                                    growthStopped = true;
                                }
                            }
                            
                            // Spawn replacement particle
                            if (!growthStopped) {
                                spawnParticles(1);
                            }
                            
                            // Track growth rate
                            lastFixedTime = millis();
                        }
                    }
                }
            }
            
            // Display all particles
            for (let p of particles) {
                p.display(colorModeValue);
            }
            
            // Draw boundary circle
            noFill();
            stroke(100, 100, 100, 50);
            strokeWeight(1);
            let maxSize = min(width, height) - edgeBuffer * 2;
            ellipse(width/2, height/2, maxSize, maxSize);
            
            // Update stats
            updateStats();
        }
        
        function spawnParticles(count) {
            for (let i = 0; i < count; i++) {
                // Spawn particles in a ring around the current cluster
                let spawnRadius = max(maxRadius + 100, 150);
                let angle = random(TWO_PI);
                let x = width/2 + cos(angle) * spawnRadius;
                let y = height/2 + sin(angle) * spawnRadius;
                
                // Add some randomness
                x += random(-50, 50);
                y += random(-50, 50);
                
                // Constrain to canvas
                x = constrain(x, 10, width - 10);
                y = constrain(y, 10, height - 10);
                
                particles.push(new Particle(x, y, nextId++));
            }
        }
        
        function setupControls() {
            // Particle count slider
            document.getElementById('particleCount').addEventListener('input', function(e) {
                particleCount = parseInt(e.target.value);
                document.getElementById('particleCountVal').textContent = particleCount;
                
                // Adjust current particle count
                let currentMoving = particles.filter(p => !p.fixed).length;
                let diff = particleCount - currentMoving;
                if (diff > 0) {
                    spawnParticles(diff);
                } else if (diff < 0) {
                    // Remove excess moving particles
                    for (let i = particles.length - 1; i >= 0 && diff < 0; i--) {
                        if (!particles[i].fixed) {
                            particles.splice(i, 1);
                            diff++;
                        }
                    }
                }
            });
            
            // Speed slider
            document.getElementById('moveSpeed').addEventListener('input', function(e) {
                moveSpeed = parseInt(e.target.value);
                document.getElementById('moveSpeedVal').textContent = moveSpeed;
            });
            
            // Bias strength slider
            document.getElementById('biasStrength').addEventListener('input', function(e) {
                biasStrength = parseInt(e.target.value) / 100;
                document.getElementById('biasStrengthVal').textContent = e.target.value + '%';
            });
            
            // Stick distance slider
            document.getElementById('stickDistance').addEventListener('input', function(e) {
                stickDistance = parseInt(e.target.value);
                document.getElementById('stickDistanceVal').textContent = stickDistance;
            });
            
            // Color mode selector
            document.getElementById('colorMode').addEventListener('change', function(e) {
                colorModeValue = e.target.value;
            });
        }
        
        function updateStats() {
            document.getElementById('fixedCount').textContent = fixedCount;
            document.getElementById('maxRadius').textContent = Math.round(maxRadius);
            
            // Calculate growth rate
            let growthRate = 0;
            if (lastFixedTime > 0) {
                let timeSinceFixed = (millis() - lastFixedTime) / 1000;
                if (timeSinceFixed < 5) {
                    growthRate = 1 / timeSinceFixed;
                }
            }
            document.getElementById('growthRate').textContent = growthRate.toFixed(1);
            
            // Update status
            let status = growthStopped ? 'Stopped (edge reached)' : 
                        isPaused ? 'Paused' : 'Growing';
            document.getElementById('status').textContent = status;
        }
        
        function resetSimulation() {
            particles = [];
            fixedCount = 0;
            maxRadius = 0;
            growthStopped = false;
            nextId = 0;
            
            // Clear grid
            for (let i = 0; i < width; i++) {
                for (let j = 0; j < height; j++) {
                    grid[i][j] = false;
                }
            }
            
            // Create new seed
            let seed = new Particle(width/2, height/2, nextId++);
            seed.fix(grid, 0);
            particles.push(seed);
            fixedCount = 1;
            
            // Spawn initial particles
            spawnParticles(particleCount);
        }
        
        function togglePause() {
            isPaused = !isPaused;
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            resetSimulation();
        }
    </script>
</body>
</html>
