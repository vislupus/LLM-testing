<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion-Limited Aggregation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        #ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            color: #e0e0e0;
            min-width: 280px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #ui-panel h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #64b5f6, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        #ui-panel .subtitle {
            font-size: 11px;
            color: #666;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 600;
            color: #64ffda;
        }

        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .control-group label span {
            font-family: 'JetBrains Mono', monospace;
            color: #64ffda;
            font-size: 11px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #64b5f6, #a78bfa);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(100, 181, 246, 0.4);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #resetBtn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        #resetBtn:hover {
            background: rgba(239, 68, 68, 0.35);
            transform: translateY(-2px);
        }

        #pauseBtn {
            background: rgba(100, 255, 218, 0.15);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.25);
        }

        #pauseBtn:hover {
            background: rgba(100, 255, 218, 0.25);
            transform: translateY(-2px);
        }

        #pauseBtn.paused {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24: rgba(251;
            border-color, 191, 36, 0.3);
        }

        .status {
            margin-top: 16px;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
        }

        .status.running {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.2);
        }

        .status.paused {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .status.complete {
            background: rgba(167, 139, 250, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="ui-panel">
        <h1>DIFFUSION-LIMITED AGGREGATION</h1>
        <div class="subtitle">Real-time fractal growth simulation</div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="particleCount">1</div>
                <div class="stat-label">Particles</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="clusterRadius">0</div>
                <div class="stat-label">Radius (px)</div>
            </div>
        </div>

        <div class="control-group">
            <label>Walker Count <span id="walkerVal">100</span></label>
            <input type="range" id="walkerCount" min="1" max="300" value="100">
        </div>

        <div class="control-group">
            <label>Movement Speed <span id="speedVal">3</span></label>
            <input type="range" id="speed" min="1" max="20" value="3">
        </div>

        <div class="control-group">
            <label>Inward Bias <span id="biasVal">0.15</span></label>
            <input type="range" id="bias" min="0" max="100" value="15">
        </div>

        <div class="control-group">
            <label>Particle Size <span id="sizeVal">2</span>px</label>
            <input type="range" id="particleSize" min="1" max="5" value="2">
        </div>

        <div class="buttons">
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="status running" id="status">Growing...</div>
    </div>

    <script>
        // ============================================
        // DLA SIMULATION ENGINE
        // ============================================

        class DLASimulation {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');

                // Simulation parameters
                this.walkerCount = 100;
                this.speed = 3;
                this.bias = 0.15;
                this.particleSize = 2;

                // State
                this.particles = [];          // Fixed particles
                this.walkers = [];            // Active moving particles
                this.spatialGrid = null;      // Collision detection grid
                this.gridResolution = 2;      // 1 grid cell = 2 pixels
                this.clusterRadius = 0;
                this.isRunning = true;
                this.isComplete = false;

                // Colors
                this.centerColor = { r: 6, g: 182, b: 212 };   // Cyan
                this.edgeColor = { r: 236, g: 72, b: 153 };    // Pink

                this.resize();
                this.init();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.centerX = this.canvas.width / 2;
                this.centerY = this.canvas.height / 2;
                this.maxRadius = Math.min(this.canvas.width, this.canvas.height) / 2 - 50;

                // Recreate spatial grid
                this.gridWidth = Math.ceil(this.canvas.width / this.gridResolution);
                this.gridHeight = Math.ceil(this.canvas.height / this.gridResolution);
            }

            init() {
                this.particles = [];
                this.walkers = [];
                this.clusterRadius = 0;
                this.isRunning = true;
                this.isComplete = false;

                // Clear spatial grid
                this.spatialGrid = new Uint8Array(this.gridWidth * this.gridHeight);

                // Place seed particle at center
                const seed = {
                    x: this.centerX,
                    y: this.centerY,
                    fixed: true,
                    color: this.getColor(0)
                };
                this.particles.push(seed);
                this.markOccupied(seed.x, seed.y);

                // Spawn initial walkers
                this.spawnWalkers(this.walkerCount);

                // Initial draw
                this.draw();
                this.updateStats();
            }

            spawnWalkers(count) {
                const spawnRadius = Math.max(50, this.clusterRadius + 30);

                for (let i = 0; i < count; i++) {
                    this.spawnWalker(spawnRadius);
                }
            }

            spawnWalker(spawnRadius) {
                const angle = Math.random() * Math.PI * 2;
                const radius = spawnRadius + Math.random() * 20;

                const walker = {
                    x: this.centerX + Math.cos(angle) * radius,
                    y: this.centerY + Math.sin(angle) * radius,
                    fixed: false
                };

                // Keep walkers within bounds
                if (walker.x < 0) walker.x = 0;
                if (walker.x > this.canvas.width) walker.x = this.canvas.width;
                if (walker.y < 0) walker.y = 0;
                if (walker.y > this.canvas.height) walker.y = this.canvas.height;

                this.walkers.push(walker);
            }

            markOccupied(x, y) {
                const gx = Math.floor(x / this.gridResolution);
                const gy = Math.floor(y / this.gridResolution);

                if (gx >= 0 && gx < this.gridWidth && gy >= 0 && gy < this.gridHeight) {
                    this.spatialGrid[gy * this.gridWidth + gx] = 1;
                }
            }

            checkCollision(x, y) {
                const gx = Math.floor(x / this.gridResolution);
                const gy = Math.floor(y / this.gridResolution);

                // Check surrounding cells
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        const nx = gx + dx;
                        const ny = gy + dy;

                        if (nx >= 0 && nx < this.gridWidth && ny >= 0 && ny < this.gridHeight) {
                            if (this.spatialGrid[ny * this.gridWidth + nx]) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            update() {
                if (!this.isRunning || this.isComplete) return;

                const stepsPerFrame = this.speed;
                const biasStrength = this.bias;

                for (let step = 0; step < stepsPerFrame; step++) {
                    // Update each walker
                    for (let i = this.walkers.length - 1; i >= 0; i--) {
                        const walker = this.walkers[i];

                        // Random walk
                        let dx = (Math.random() - 0.5) * 2;
                        let dy = (Math.random() - 0.5) * 2;

                        // Inward bias
                        const toCenterX = this.centerX - walker.x;
                        const toCenterY = this.centerY - walker.y;
                        const distToCenter = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);

                        if (distToCenter > 0) {
                            dx += (toCenterX / distToCenter) * biasStrength;
                            dy += (toCenterY / distToCenter) * biasStrength;
                        }

                        // Normalize
                        const len = Math.sqrt(dx * dx + dy * dy);
                        if (len > 0) {
                            dx /= len;
                            dy /= len;
                        }

                        // Move
                        walker.x += dx;
                        walker.y += dy;

                        // Keep in bounds
                        if (walker.x < 0) walker.x = 0;
                        if (walker.x > this.canvas.width) walker.x = this.canvas.width;
                        if (walker.y < 0) walker.y = 0;
                        if (walker.y > this.canvas.height) walker.y = this.canvas.height;

                        // Check collision with fixed particles
                        if (this.checkCollision(walker.x, walker.y)) {
                            // Stick!
                            const distFromCenter = Math.sqrt(
                                (walker.x - this.centerX) ** 2 +
                                (walker.y - this.centerY) ** 2
                            );

                            const newParticle = {
                                x: walker.x,
                                y: walker.y,
                                fixed: true,
                                dist: distFromCenter,
                                color: this.getColor(distFromCenter)
                            };

                            this.particles.push(newParticle);
                            this.markOccupied(walker.x, walker.y);

                            // Update cluster radius
                            this.clusterRadius = Math.max(this.clusterRadius, distFromCenter);

                            // Remove walker and spawn new one
                            this.walkers.splice(i, 1);

                            // Spawn replacement walker
                            if (!this.isComplete) {
                                this.spawnWalker(Math.max(50, this.clusterRadius + 30));
                            }

                            // Check completion
                            if (this.clusterRadius >= this.maxRadius) {
                                this.isComplete = true;
                                this.isRunning = false;
                                this.updateStatus('complete');
                            }
                        }

                        // Respawn if too far
                        const currentDist = Math.sqrt(
                            (walker.x - this.centerX) ** 2 +
                            (walker.y - this.centerY) ** 2
                        );

                        if (currentDist > this.clusterRadius + 100) {
                            this.spawnWalker(Math.max(50, this.clusterRadius + 30));
                            this.walkers.splice(i, 1);
                        }
                    }
                }

                // Update walker count to match setting
                while (this.walkers.length < this.walkerCount && !this.isComplete) {
                    this.spawnWalker(Math.max(50, this.clusterRadius + 30));
                }
            }

            getColor(distFromCenter) {
                const t = Math.min(1, distFromCenter / this.maxRadius);

                return {
                    r: Math.floor(this.centerColor.r + (this.edgeColor.r - this.centerColor.r) * t),
                    g: Math.floor(this.centerColor.g + (this.edgeColor.g - this.centerColor.g) * t),
                    b: Math.floor(this.centerColor.b + (this.edgeColor.b - this.centerColor.b) * t)
                };
            }

            draw() {
                // Clear canvas
                this.ctx.fillStyle = '#0a0a0f';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw boundary indicator
                this.ctx.strokeStyle = 'rgba(100, 255, 218, 0.1)';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.arc(this.centerX, this.centerY, this.maxRadius, 0, Math.PI * 2);
                this.ctx.stroke();

                // Draw fixed particles
                const size = this.particleSize;

                for (const p of this.particles) {
                    const { r, g, b } = p.color;
                    this.ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                // Draw walkers
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (const walker of this.walkers) {
                    this.ctx.beginPath();
                    this.ctx.arc(walker.x, walker.y, size * 0.7, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            updateStats() {
                document.getElementById('particleCount').textContent = this.particles.length;
                document.getElementById('clusterRadius').textContent = Math.round(this.clusterRadius);
            }

            updateStatus(state) {
                const statusEl = document.getElementById('status');
                statusEl.className = 'status ' + state;

                if (state === 'running') {
                    statusEl.textContent = 'Growing...';
                } else if (state === 'paused') {
                    statusEl.textContent = 'Paused';
                } else if (state === 'complete') {
                    statusEl.textContent = 'Complete!';
                }
            }

            setWalkerCount(count) {
                this.walkerCount = count;
            }

            setSpeed(speed) {
                this.speed = speed;
            }

            setBias(bias) {
                this.bias = bias;
            }

            setParticleSize(size) {
                this.particleSize = size;
            }

            toggle() {
                if (this.isComplete) return;

                this.isRunning = !this.isRunning;
                this.updateStatus(this.isRunning ? 'running' : 'paused');

                const btn = document.getElementById('pauseBtn');
                btn.textContent = this.isRunning ? 'Pause' : 'Resume';
                btn.classList.toggle('paused', !this.isRunning);
            }

            reset() {
                this.init();

                const btn = document.getElementById('pauseBtn');
                btn.textContent = 'Pause';
                btn.classList.remove('paused');
                this.updateStatus('running');
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        const canvas = document.getElementById('mainCanvas');
        const sim = new DLASimulation(canvas);

        // UI Controls
        const walkerCountSlider = document.getElementById('walkerCount');
        const speedSlider = document.getElementById('speed');
        const biasSlider = document.getElementById('bias');
        const particleSizeSlider = document.getElementById('particleSize');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        walkerCountSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('walkerVal').textContent = val;
            sim.setWalkerCount(val);
        });

        speedSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('speedVal').textContent = val;
            sim.setSpeed(val);
        });

        biasSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value) / 100;
            document.getElementById('biasVal').textContent = val.toFixed(2);
            sim.setBias(val);
        });

        particleSizeSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('sizeVal').textContent = val;
            sim.setParticleSize(val);
        });

        pauseBtn.addEventListener('click', () => sim.toggle());
        resetBtn.addEventListener('click', () => sim.reset());

        window.addEventListener('resize', () => {
            sim.resize();
            sim.draw();
        });

        // Animation loop
        function animate() {
            sim.update();
            sim.draw();
            sim.updateStats();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
