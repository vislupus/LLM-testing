<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diffusion-Limited Aggregation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #c0c8d8;
    overflow: hidden;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    padding: 12px 0 4px;
    background: linear-gradient(90deg, #4fc3f7, #ab47bc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
  }
  #subtitle {
    font-size: 11px;
    color: #556;
    margin-bottom: 8px;
  }
  #canvasWrap {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(79,195,247,.08), 0 0 80px rgba(171,71,188,.05);
    border: 1px solid rgba(255,255,255,.06);
  }
  canvas { display: block; }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-top: 10px;
    padding: 10px 18px;
    background: rgba(255,255,255,.03);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.05);
    max-width: 720px;
  }
  .ctrl-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 110px;
  }
  .ctrl-group label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #667;
    margin-bottom: 4px;
  }
  .ctrl-group .val {
    font-size: 13px;
    font-weight: 700;
    color: #4fc3f7;
    margin-bottom: 2px;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 110px;
    height: 4px;
    border-radius: 2px;
    background: rgba(79,195,247,.15);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #4fc3f7;
    box-shadow: 0 0 6px rgba(79,195,247,.5);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #4fc3f7;
    border: none;
    box-shadow: 0 0 6px rgba(79,195,247,.5);
    cursor: pointer;
  }
  #stats {
    display: flex;
    gap: 20px;
    margin-top: 6px;
    font-size: 11px;
    color: #556;
  }
  #stats span { color: #4fc3f7; font-weight: 700; }
  button {
    background: linear-gradient(135deg, rgba(79,195,247,.2), rgba(171,71,188,.2));
    border: 1px solid rgba(79,195,247,.3);
    color: #4fc3f7;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    align-self: center;
  }
  button:hover {
    background: linear-gradient(135deg, rgba(79,195,247,.35), rgba(171,71,188,.35));
    box-shadow: 0 0 12px rgba(79,195,247,.2);
  }
</style>
</head>
<body>

<h1>Diffusion-Limited Aggregation</h1>
<div id="subtitle">Particles diffuse randomly and aggregate into fractal branching structures</div>

<div id="canvasWrap">
  <canvas id="c"></canvas>
</div>

<div id="controls">
  <div class="ctrl-group">
    <label>Active Particles</label>
    <div class="val" id="vCount">100</div>
    <input type="range" id="sCount" min="10" max="500" value="100" step="10">
  </div>
  <div class="ctrl-group">
    <label>Step Speed</label>
    <div class="val" id="vSpeed">2.0</div>
    <input type="range" id="sSpeed" min="5" max="50" value="20" step="1">
  </div>
  <div class="ctrl-group">
    <label>Inward Bias</label>
    <div class="val" id="vBias">0.020</div>
    <input type="range" id="sBias" min="0" max="80" value="20" step="1">
  </div>
  <div class="ctrl-group">
    <label>Stick Distance</label>
    <div class="val" id="vStick">2</div>
    <input type="range" id="sStick" min="1" max="6" value="2" step="1">
  </div>
  <button id="btnReset">↻ Restart</button>
</div>

<div id="stats">
  Fixed: <span id="stFixed">0</span> &nbsp;|&nbsp;
  Active: <span id="stActive">0</span> &nbsp;|&nbsp;
  Radius: <span id="stRadius">0</span> &nbsp;|&nbsp;
  FPS: <span id="stFps">0</span>
</div>

<script>
(function() {
  "use strict";

  /* ── Canvas Setup ── */
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = Math.min(720, window.innerWidth - 20);
  const H = Math.min(720, window.innerHeight - 180);
  canvas.width = W;
  canvas.height = H;

  const CX = W >> 1;          // center x
  const CY = H >> 1;          // center y
  const EDGE_MARGIN = 50;     // stop growth this many px from edge
  const MAX_RADIUS = Math.min(CX, CY) - EDGE_MARGIN;

  /* ── Offscreen buffer for the fixed cluster ── */
  const clusterCanvas = document.createElement('canvas');
  clusterCanvas.width = W;
  clusterCanvas.height = H;
  const clusterCtx = clusterCanvas.getContext('2d');

  /* ── Collision grid: 1 byte per pixel ── */
  const grid = new Uint8Array(W * H);

  /* ── Settings (read from sliders) ── */
  let targetCount  = 100;   // active wandering particles
  let stepSpeed    = 2.0;   // max pixel displacement per sub-step
  let inwardBias   = 0.020; // bias strength toward center
  let stickDist    = 2;     // adjacency distance for sticking

  /* ── Simulation State ── */
  let particles = [];        // active wandering particles
  let fixedCount = 0;
  let clusterRadius = 0;     // current max distance from center
  let stopped = false;
  let hueOffset = 0;         // color cycling over time

  /* ── FPS tracking ── */
  let fpsFrames = 0, fpsTime = 0, fpsDisplay = 0;

  /* ── Slider bindings ── */
  const sCount = document.getElementById('sCount');
  const sSpeed = document.getElementById('sSpeed');
  const sBias  = document.getElementById('sBias');
  const sStick = document.getElementById('sStick');

  function readSliders() {
    targetCount = +sCount.value;
    stepSpeed   = +sSpeed.value / 10;
    inwardBias  = +sBias.value / 1000;
    stickDist   = +sStick.value;
    document.getElementById('vCount').textContent = targetCount;
    document.getElementById('vSpeed').textContent = stepSpeed.toFixed(1);
    document.getElementById('vBias').textContent = inwardBias.toFixed(3);
    document.getElementById('vStick').textContent = stickDist;
  }
  sCount.addEventListener('input', readSliders);
  sSpeed.addEventListener('input', readSliders);
  sBias.addEventListener('input', readSliders);
  sStick.addEventListener('input', readSliders);
  readSliders();

  document.getElementById('btnReset').addEventListener('click', init);

  /* ── Helper: check if pixel is in grid bounds ── */
  function inBounds(x, y) {
    return x >= 0 && x < W && y >= 0 && y < H;
  }

  /* ── Helper: check if any neighbor within stickDist is occupied ── */
  function isAdjacent(px, py) {
    const d = stickDist;
    for (let dy = -d; dy <= d; dy++) {
      for (let dx = -d; dx <= d; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = (px + dx) | 0;
        const ny = (py + dy) | 0;
        if (inBounds(nx, ny) && grid[ny * W + nx]) return true;
      }
    }
    return false;
  }

  /* ── Helper: mark a pixel as fixed in the grid ── */
  function markFixed(px, py) {
    if (inBounds(px, py)) grid[py * W + px] = 1;
  }

  /* ── Helper: draw a fixed pixel to the cluster buffer ── */
  function drawFixed(px, py, hue) {
    clusterCtx.fillStyle = `hsl(${hue}, 85%, 65%)`;
    clusterCtx.fillRect(px, py, 1, 1);
    /* Slight glow for larger structures */
    clusterCtx.fillStyle = `hsla(${hue}, 90%, 75%, 0.3)`;
    clusterCtx.fillRect(px - 1, py, 1, 1);
    clusterCtx.fillRect(px + 1, py, 1, 1);
    clusterCtx.fillRect(px, py - 1, 1, 1);
    clusterCtx.fillRect(px, py + 1, 1, 1);
  }

  /* ── Spawn a single wandering particle on a ring around the cluster ── */
  function spawnParticle() {
    const spawnR = clusterRadius + 30 + Math.random() * 20;
    const angle  = Math.random() * Math.PI * 2;
    return {
      x: CX + Math.cos(angle) * spawnR,
      y: CY + Math.sin(angle) * spawnR,
      hue: (hueOffset + fixedCount * 0.3) % 360,
      age: 0
    };
  }

  /* ── Initialize / Reset ── */
  function init() {
    /* Clear everything */
    ctx.clearRect(0, 0, W, H);
    clusterCtx.clearRect(0, 0, W, H);
    grid.fill(0);
    particles = [];
    fixedCount = 0;
    clusterRadius = 0;
    stopped = false;
    hueOffset = Math.random() * 360;

    /* Place the seed at the center */
    markFixed(CX, CY);
    drawFixed(CX, CY, hueOffset);
    fixedCount = 1;

    /* Place a few more seeds nearby for faster initial growth */
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const sx = CX + Math.round(Math.cos(a) * 2);
      const sy = CY + Math.round(Math.sin(a) * 2);
      markFixed(sx, sy);
      drawFixed(sx, sy, hueOffset);
      fixedCount++;
    }

    /* Spawn initial active particles */
    for (let i = 0; i < targetCount; i++) {
      particles.push(spawnParticle());
    }
  }

  /* ── Main animation loop ── */
  let lastTime = 0;

  function frame(timestamp) {
    requestAnimationFrame(frame);

    /* FPS */
    fpsFrames++;
    if (timestamp - fpsTime >= 1000) {
      fpsDisplay = fpsFrames;
      fpsFrames = 0;
      fpsTime = timestamp;
    }

    if (stopped) {
      /* Just redraw and return */
      render();
      return;
    }

    readSliders();

    /* ── Physics sub-steps ── */
    const subSteps = 3;  // multiple sub-steps per frame for smoother motion

    for (let s = 0; s < subSteps; s++) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age++;

        /* Random walk step */
        const angle = Math.random() * Math.PI * 2;
        const step = stepSpeed * (0.5 + Math.random() * 0.5);
        p.x += Math.cos(angle) * step;
        p.y += Math.sin(angle) * step;

        /* Inward bias: slight drift toward center */
        const dx = CX - p.x;
        const dy = CY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        p.x += (dx / dist) * inwardBias * stepSpeed * 10;
        p.y += (dy / dist) * inwardBias * stepSpeed * 10;

        /* Check if particle wandered too far — respawn */
        if (dist > clusterRadius + 120) {
          particles[i] = spawnParticle();
          continue;
        }

        /* Check adjacency to fixed cluster */
        const px = Math.round(p.x);
        const py = Math.round(p.y);

        if (isAdjacent(px, py)) {
          /* Particle sticks! */
          const clampedX = Math.max(0, Math.min(W - 1, px));
          const clampedY = Math.max(0, Math.min(H - 1, py));
          markFixed(clampedX, clampedY);
          drawFixed(clampedX, clampedY, p.hue);
          fixedCount++;

          /* Update cluster radius */
          const r = Math.sqrt((clampedX - CX) ** 2 + (clampedY - CY) ** 2);
          if (r > clusterRadius) clusterRadius = r;

          /* Check if we've reached the edge margin */
          if (clusterRadius >= MAX_RADIUS) {
            stopped = true;
          }

          /* Replace with a new particle */
          if (!stopped) {
            particles[i] = spawnParticle();
          } else {
            particles.splice(i, 1);
          }
        }
      }
    }

    /* Maintain particle count */
    if (!stopped) {
      while (particles.length < targetCount) {
        particles.push(spawnParticle());
      }
      while (particles.length > targetCount) {
        particles.pop();
      }
    }

    render();
  }

  /* ── Render ── */
  function render() {
    /* Dark background */
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    /* Draw the fixed cluster from the offscreen buffer */
    ctx.drawImage(clusterCanvas, 0, 0);

    /* Draw active wandering particles */
    for (const p of particles) {
      const alpha = Math.min(1, 0.4 + p.age * 0.01);
      ctx.fillStyle = `hsla(${p.hue}, 80%, 70%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    /* Draw a subtle circle showing the growth boundary */
    ctx.strokeStyle = 'rgba(79,195,247,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(CX, CY, MAX_RADIUS, 0, Math.PI * 2);
    ctx.stroke();

    /* Stopped overlay */
    if (stopped) {
      ctx.fillStyle = 'rgba(10,10,15,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#4fc3f7';
      ctx.font = '600 20px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Growth Complete', CX, CY - 10);
      ctx.font = '14px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#889';
      ctx.fillText(`${fixedCount} particles fixed · Click Restart to begin again`, CX, CY + 16);
      ctx.textAlign = 'start';
    }

    /* Update stats */
    document.getElementById('stFixed').textContent = fixedCount;
    document.getElementById('stActive').textContent = particles.length;
    document.getElementById('stRadius').textContent = Math.round(clusterRadius);
    document.getElementById('stFps').textContent = fpsDisplay;
  }

  /* ── Start ── */
  init();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
