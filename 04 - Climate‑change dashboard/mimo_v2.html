<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofia Climate Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f1117;color:#c9d1d9;min-height:100vh}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#0d1b2a 0%,#1b2838 100%);padding:28px 32px;
  border-bottom:1px solid rgba(255,255,255,.06);text-align:center}
.hdr h1{font-size:26px;font-weight:700;color:#e6edf3;margin-bottom:4px}
.hdr h1 span{color:#58a6ff}
.hdr p{color:#8b949e;font-size:13px}

/* ── LOADING / ERROR ── */
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:60vh;gap:12px;font-size:15px;color:#8b949e}
#loading .spinner{width:36px;height:36px;border:3px solid rgba(88,166,255,.15);
  border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#error{display:none;background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.25);
  border-radius:8px;padding:20px;margin:20px auto;max-width:700px;color:#f85149;font-size:13px;line-height:1.6}
#error code{background:rgba(248,81,73,.1);padding:2px 6px;border-radius:3px;font-size:12px}

/* ── CONTROLS ── */
.ctrls{background:#161b22;padding:16px 32px;display:flex;align-items:center;
  gap:16px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.06)}
.ctrls label{font-size:12px;color:#8b949e}
.ctrls select,.ctrls input[type=range]{background:#21262d;color:#c9d1d9;border:1px solid #30363d;
  border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
.ctrls select:focus{border-color:#58a6ff;outline:none}
.ctrls .cr{display:flex;align-items:center;gap:6px}
.ctrls .btn{background:rgba(88,166,255,.12);color:#58a6ff;border:1px solid rgba(88,166,255,.25);
  border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:600;transition:all .15s}
.ctrls .btn:hover{background:rgba(88,166,255,.22)}
.ctrls .sep{width:1px;height:24px;background:#30363d}
#yr-display{font-size:13px;color:#58a6ff;font-weight:600;min-width:100px;text-align:center}

/* ── STATS CARDS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;
  padding:16px 32px}
.stat{background:#161b22;border:1px solid rgba(255,255,255,.06);border-radius:8px;
  padding:14px 16px;text-align:center}
.stat .sv{font-size:24px;font-weight:700;color:#e6edf3;margin:4px 0}
.stat .sl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.stat.warm .sv{color:#f0883e}
.stat.cold .sv{color:#58a6ff}
.stat.hot .sv{color:#f85149}
.stat.trend .sv{color:#3fb950}

/* ── CHART GRID ── */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 32px 24px}
.chart-card{background:#161b22;border:1px solid rgba(255,255,255,.06);border-radius:8px;
  padding:14px;position:relative}
.chart-card.full{grid-column:1/-1}
.chart-card h3{font-size:13px;font-weight:600;color:#8b949e;margin-bottom:8px}
.chart-card canvas{width:100%!important}

/* ── TABLE ── */
.tbl-wrap{grid-column:1/-1;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#21262d;color:#8b949e;padding:8px 10px;text-align:right;font-weight:600;
  border-bottom:2px solid #30363d;position:sticky;top:0}
th:first-child{text-align:left}
td{padding:6px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04)}
td:first-child{text-align:left;font-weight:600;color:#58a6ff}
tr:hover td{background:rgba(88,166,255,.04)}

/* ── FOOTER ── */
.ftr{text-align:center;padding:16px;color:#484f58;font-size:11px;
  border-top:1px solid rgba(255,255,255,.04)}

/* ── RESPONSIVE ── */
@media(max-width:800px){.charts{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0f1117}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
</style>
</head>
<body>

<div class="hdr">
  <h1>🌡️ <span>Sofia</span> Climate Dashboard</h1>
  <p>Historical temperature analysis · Data source: Open-Meteo / NOAA GHCNd</p>
</div>

<!-- Loading -->
<div id="loading"><div class="spinner"></div>Loading climate data…</div>

<!-- Error -->
<div id="error"></div>

<!-- Controls -->
<div class="ctrls" id="ctrls" style="display:none">
  <div class="cr">
    <label>Start Year</label>
    <select id="sel-start"></select>
  </div>
  <div class="sep"></div>
  <div class="cr">
    <label>End Year</label>
    <select id="sel-end"></select>
  </div>
  <div class="sep"></div>
  <div class="cr">
    <button class="btn" onclick="applyRange()">Apply</button>
    <button class="btn" onclick="resetRange()">All Years</button>
  </div>
  <div class="sep"></div>
  <div id="yr-display"></div>
  <div class="sep"></div>
  <div class="cr">
    <label>Show</label>
    <select id="sel-chart-mode" onchange="updateAll()">
      <option value="all">All Charts</option>
      <option value="annual">Annual Temps Only</option>
      <option value="monthly">Monthly Only</option>
      <option value="extremes">Extremes Only</option>
    </select>
  </div>
</div>

<!-- Stats -->
<div class="stats" id="stats" style="display:none"></div>

<!-- Charts -->
<div class="charts" id="charts" style="display:none"></div>

<!-- Footer -->
<div class="ftr" id="ftr" style="display:none">
  Data: temperature_Sofia_280794_1952-01-01 - 2021-11-28.csv · Visualization: Chart.js 4.4
</div>

<script>
/* ══════════════════════════════════════
   STATE
   ══════════════════════════════════════ */
var rawRows=[];     // {date:Date, tavg:number|null, tmax:number|null, tmin:number|null}
var allYears=[];
var startYear,endYear;
var charts={};

/* ══════════════════════════════════════
   LOAD CSV
   ══════════════════════════════════════ */
function loadCSV(){
  var candidates=[
    'temperature_Sofia_280794_1952-01-01 - 2021-11-28.csv',
    'temperature_Sofia_2809794_1952-01-01 - 2021-11-28.csv',
    'temperature_Sofia.csv',
    'data.csv'
  ];
  tryFetch(candidates,0);
}

function tryFetch(list,idx){
  if(idx>=list.length){
    showError('Could not find CSV file.<br><br>Make sure one of these files is in the same folder as this HTML:<br><code>'+list.join('</code><br><code>')+'</code><br><br>Download it from <a href="https://open-meteo.com/en/docs/historical-weather-api" style="color:#58a6ff" target="_blank">Open-Meteo</a> (station 280794, Sofia)');
    return;
  }
  fetch(list[idx]).then(function(resp){
    if(!resp.ok) throw new Error(resp.status);
    return resp.text();
  }).then(function(text){
    parseCSV(text);
  }).catch(function(){
    tryFetch(list,idx+1);
  });
}

function showError(msg){
  document.getElementById('loading').style.display='none';
  var e=document.getElementById('error');
  e.style.display='block';
  e.innerHTML='<strong>⚠️ Could not load data</strong><br><br>'+msg;
}

/* ══════════════════════════════════════
   PARSE CSV
   ══════════════════════════════════════ */
function parseCSV(text){
  var lines=text.trim().split(/\r?\n/);
  if(lines.length<2){showError('CSV has no data rows.');return;}

  // Find header
  var headerLine=lines[0].toLowerCase();
  var hasHeader=headerLine.indexOf('date')>=0||headerLine.indexOf('tavg')>=0;
  var startIdx=hasHeader?1:0;

  // Detect columns
  var hdrCols=parseCSVLine(lines[0]);
  var colMap={};
  hdrCols.forEach(function(h,i){
    var hl=h.trim().toLowerCase();
    if(hl==='date'||hl.indexOf('date')===0)colMap.date=i;
    else if(hl==='tavg')colMap.tavg=i;
    else if(hl==='tmax')colMap.tmax=i;
    else if(hl==='tmin')colMap.tmin=i;
  });

  // Fallback: assume date,tavg,tmax,tmin order
  if(colMap.date===undefined)colMap.date=0;
  if(colMap.tavg===undefined&&hdrCols.length>1)colMap.tavg=1;
  if(colMap.tmax===undefined&&hdrCols.length>2)colMap.tmax=2;
  if(colMap.tmin===undefined&&hdrCols.length>3)colMap.tmin=3;

  rawRows=[];
  for(var i=startIdx;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    var cols=parseCSVLine(line);
    var dateStr=(cols[colMap.date]||'').trim();
    if(!dateStr)continue;

    var d=new Date(dateStr+'T00:00:00');
    if(isNaN(d.getTime()))continue;

    function toC(v){
      if(v===undefined||v===null||v==='')return null;
      var n=parseFloat(v);
      if(isNaN(n))return null;
      return n/10; // tenths → °C
    }

    rawRows.push({
      date:d,
      year:d.getFullYear(),
      month:d.getMonth()+1,
      tavg:toC(cols[colMap.tavg]),
      tmax:toC(cols[colMap.tmax]),
      tmin:toC(cols[colMap.tmin])
    });
  }

  if(rawRows.length===0){showError('No valid data rows found in CSV.');return;}

  rawRows.sort(function(a,b){return a.date-b.date;});

  // Extract year range
  var minY=rawRows[0].year,maxY=rawRows[rawRows.length-1].year;
  allYears=[];
  for(var y=minY;y<=maxY;y++)allYears.push(y);
  startYear=minY;endYear=maxY;

  // Populate selectors
  populateSelects(minY,maxY);

  // Hide loading, show dashboard
  document.getElementById('loading').style.display='none';
  document.getElementById('ctrls').style.display='flex';
  document.getElementById('stats').style.display='grid';
  document.getElementById('charts').style.display='grid';
  document.getElementById('ftr').style.display='block';

  updateAll();
}

function parseCSVLine(line){
  var result=[],current='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(inQ){
      if(c==='"'&&line[i+1]==='"'){current+='"';i++;}
      else if(c==='"'){inQ=false;}
      else current+=c;
    }else{
      if(c==='"'){inQ=true;}
      else if(c===','){result.push(current);current='';}
      else current+=c;
    }
  }
  result.push(current);
  return result;
}

function populateSelects(minY,maxY){
  var ss=document.getElementById('sel-start'),se=document.getElementById('sel-end');
  ss.innerHTML='';se.innerHTML='';
  for(var y=minY;y<=maxY;y++){
    ss.innerHTML+='<option value="'+y+'">'+y+'</option>';
    se.innerHTML+='<option value="'+y+'">'+y+'</option>';
  }
  ss.value=minY;se.value=maxY;
}

function applyRange(){
  startYear=parseInt(document.getElementById('sel-start').value);
  endYear=parseInt(document.getElementById('sel-end').value);
  if(startYear>endYear){var t=startYear;startYear=endYear;endYear=t;}
  updateAll();
}
function resetRange(){
  startYear=allYears[0];endYear=allYears[allYears.length-1];
  document.getElementById('sel-start').value=startYear;
  document.getElementById('sel-end').value=endYear;
  updateAll();
}

/* ══════════════════════════════════════
   AGGREGATE COMPUTATION
   ══════════════════════════════════════ */
function getFiltered(){
  return rawRows.filter(function(r){return r.year>=startYear&&r.year<=endYear;});
}

function computeYearly(rows){
  var byY={};
  rows.forEach(function(r){
    if(!byY[r.year])byY[r.year]={tavg:[],tmax:[],tmin:[]};
    if(r.tavg!==null)byY[r.year].tavg.push(r.tavg);
    if(r.tmax!==null)byY[r.year].tmax.push(r.tmax);
    if(r.tmin!==null)byY[r.year].tmin.push(r.tmin);
  });
  var result=[];
  Object.keys(byY).sort().forEach(function(y){
    var d=byY[y];
    function avg(a){return a.length?a.reduce(function(s,v){return s+v;},0)/a.length:null;}
    result.push({
      year:+y,
      meanT:avg(d.tavg),
      maxT:d.tmax.length?Math.max.apply(null,d.tmax):null,
      minT:d.tmin.length?Math.min.apply(null,d.tmin):null,
      hotDays:d.tmax.filter(function(v){return v>=30;}).length,
      coldDays:d.tmin.filter(function(v){return v<=-10;}).length,
      dataDays:d.tavg.length
    });
  });
  return result;
}

function computeMonthly(rows){
  var byM={};
  for(var m=1;m<=12;m++) byM[m]=[];
  rows.forEach(function(r){
    if(r.tavg!==null) byM[r.month].push(r.tavg);
  });
  var result=[];
  var names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for(var m=1;m<=12;m++){
    var a=byM[m];
    var mean=a.length?a.reduce(function(s,v){return s+v;},0)/a.length:null;
    result.push({month:m,name:names[m-1],mean:mean,count:a.length});
  }
  return result;
}

function linearTrend(years,values){
  var n=0,sx=0,sy=0,sxx=0,sxy=0;
  for(var i=0;i<years.length;i++){
    if(values[i]===null||values[i]===undefined)continue;
    n++;sx+=years[i];sy+=values[i];sxx+=years[i]*years[i];sxy+=years[i]*values[i];
  }
  if(n<2)return{slope:0,intercept:0,r2:0};
  var slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  var intercept=(sy-slope*sx)/n;
  var meanY=sy/n,sst=0,ssr=0;
  for(var i=0;i<years.length;i++){
    if(values[i]===null||values[i]===undefined)continue;
    sst+=(values[i]-meanY)*(values[i]-meanY);
    var pred=slope*years[i]+intercept;
    ssr+=(pred-meanY)*(pred-meanY);
  }
  var r2=sst>0?ssr/sst:0;
  return{slope:slope,intercept:intercept,r2:r2};
}

/* ══════════════════════════════════════
   UPDATE EVERYTHING
   ══════════════════════════════════════ */
function updateAll(){
  var rows=getFiltered();
  if(!rows.length)return;

  var yearly=computeYearly(rows);
  var monthly=computeMonthly(rows);

  // Trend
  var years=yearly.map(function(y){return y.year;});
  var means=yearly.map(function(y){return y.meanT;});
  var trend=linearTrend(years,means);

  // Stats
  var allMeans=means.filter(function(v){return v!==null;});
  var overallMean=allMeans.length?allMeans.reduce(function(s,v){return s+v;},0)/allMeans.length:0;
  var maxYear=yearly.reduce(function(a,b){return(a.maxT||-999)>(b.maxT||-999)?a:b;});
  var minYear=yearly.reduce(function(a,b){return(a.minT||999)<(b.minT||999)?a:b;});
  var totalHot=yearly.reduce(function(s,y){return s+y.hotDays;},0);
  var totalCold=yearly.reduce(function(s,y){return s+y.coldDays;},0);

  document.getElementById('yr-display').textContent=startYear+' – '+endYear+' ('+yearly.length+' yrs)';

  // Render stats cards
  renderStats(overallMean,trend,maxYear,minYear,totalHot,totalCold,yearly.length);

  // Render charts
  var mode=document.getElementById('sel-chart-mode').value;
  destroyCharts();
  document.getElementById('charts').innerHTML='';

  if(mode==='all'||mode==='annual'){
    addChart('Annual Mean Temperature','c-annual',function(canvas){
      chartAnnual(canvas,yearly,trend);
    });
  }
  if(mode==='all'||mode==='monthly'){
    addChart('Monthly Temperature Averages','c-monthly',function(canvas){
      chartMonthly(canvas,monthly);
    });
  }
  if(mode==='all'||mode==='extremes'){
    addChart('Annual Temperature Extremes','c-extremes',function(canvas){
      chartExtremes(canvas,yearly);
    });
  }
  if(mode==='all'){
    addChart('Hot Days (TMAX ≥ 30°C) & Cold Days (TMIN ≤ −10°C)','c-days',function(canvas){
      chartHotCold(canvas,yearly);
    });
  }
  if(mode==='all'){
    addChart('Yearly Summary Table','c-table',function(canvas){
      renderTable(canvas,yearly,trend);
    });
  }
}

/* ══════════════════════════════════════
   STATS CARDS
   ══════════════════════════════════════ */
function renderStats(mean,trend,maxYr,minYr,hot,cold,yrs){
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="sl">Overall Mean Temp</div><div class="sv">'+mean.toFixed(1)+'°C</div></div>'+
    '<div class="stat trend"><div class="sl">Warming Trend</div><div class="sv">'+(trend.slope>0?'+':'')+trend.slope.toFixed(3)+'°C/yr</div></div>'+
    '<div class="stat trend"><div class="sl">Per Decade</div><div class="sv">'+(trend.slope>0?'+':'')+(trend.slope*10).toFixed(2)+'°C</div></div>'+
    '<div class="stat warm"><div class="sl">Hottest Year</div><div class="sv">'+maxYr.year+' ('+maxYr.maxT.toFixed(1)+'°C)</div></div>'+
    '<div class="stat cold"><div class="sl">Coldest Year</div><div class="sv">'+minYr.year+' ('+minYr.minT.toFixed(1)+'°C)</div></div>'+
    '<div class="stat hot"><div class="sl">Total Hot Days (≥30°C)</div><div class="sv">'+hot.toLocaleString()+'</div></div>'+
    '<div class="stat cold"><div class="sl">Total Cold Days (≤−10°C)</div><div class="sv">'+cold.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="sl">Years Covered</div><div class="sv">'+yrs+'</div></div>';
}

/* ══════════════════════════════════════
   CHART HELPERS
   ══════════════════════════════════════ */
function destroyCharts(){
  Object.keys(charts).forEach(function(k){charts[k].destroy();});
  charts={};
}

function addChart(title,id,renderFn){
  var div=document.createElement('div');
  if(id==='c-table')div.className='chart-card tbl-wrap';
  else if(id==='c-annual'||id==='c-extremes')div.className='chart-card full';
  else div.className='chart-card';
  div.innerHTML='<h3>'+title+'</h3>';
  if(id==='c-table'){
    var wrap=document.createElement('div');
    div.appendChild(wrap);
    renderFn(wrap);
  } else {
    var canvas=document.createElement('canvas');
    canvas.height=0;
    div.appendChild(canvas);
    renderFn(canvas);
  }
  document.getElementById('charts').appendChild(div);
}

var chartDefaults={
  responsive:true,
  maintainAspectRatio:false,
  plugins:{legend:{labels:{color:'#8b949e',font:{size:11}}},tooltip:{mode:'index',intersect:false}},
  scales:{x:{ticks:{color:'#8b949e',maxRotation:0,autoSkip:true,maxTicksLimit:20},grid:{color:'rgba(255,255,255,.04)'}},
          y:{ticks:{color:'#8b949e'},grid:{color:'rgba(255,255,255,.06)'}}}
};

/* ══════════════════════════════════════
   CHART: Annual Mean Temp + Trend
   ══════════════════════════════════════ */
function chartAnnual(canvas,yearly,trend){
  var labels=yearly.map(function(y){return y.year;});
  var means=yearly.map(function(y){return y.meanT;});
  var trendLine=yearly.map(function(y){return trend.slope*y.year+trend.intercept;});

  canvas.parentElement.style.height='340px';
  canvas.height=340;

  charts['annual']=new Chart(canvas,{
    type:'line',
    data:{
      labels:labels,
      datasets:[
        {label:'Annual Mean (°C)',data:means,borderColor:'#58a6ff',backgroundColor:'rgba(88,166,255,.08)',
         borderWidth:1.5,pointRadius:0,pointHitRadius:6,fill:true,tension:.3},
        {label:'Trend ('+(trend.slope>0?'+':'')+trend.slope.toFixed(3)+'°C/yr)',
         data:trendLine,borderColor:'#f0883e',borderWidth:2,pointRadius:0,borderDash:[6,3],fill:false}
      ]
    },
    options:Object.assign({},chartDefaults,{
      plugins:{
        legend:{labels:{color:'#8b949e',font:{size:11}}},
        tooltip:{
          callbacks:{
            label:function(c){return c.dataset.label+': '+(c.parsed.y!==null?c.parsed.y.toFixed(1)+'°C':'N/A');}
          }
        }
      },
      scales:{
        x:{ticks:{color:'#8b949e',maxRotation:0,autoSkip:true,maxTicksLimit:20},grid:{color:'rgba(255,255,255,.04)'}},
        y:{ticks:{color:'#8b949e',callback:function(v){return v.toFixed(0)+'°C';}},grid:{color:'rgba(255,255,255,.06)'},
           title:{display:true,text:'Temperature (°C)',color:'#8b949e'}}
      }
    })
  });
}

/* ══════════════════════════════════════
   CHART: Monthly Means
   ══════════════════════════════════════ */
function chartMonthly(canvas,monthly){
  canvas.parentElement.style.height='280px';
  canvas.height=280;

  var labels=monthly.map(function(m){return m.name;});
  var vals=monthly.map(function(m){return m.mean;});
  var colors=monthly.map(function(m){
    var v=m.mean;
    if(v===null)return'#484f58';
    if(v<0)return'#58a6ff';
    if(v<10)return'#3fb950';
    if(v<20)return'#f0883e';
    return'#f85149';
  });

  charts['monthly']=new Chart(canvas,{
    type:'bar',
    data:{
      labels:labels,
      datasets:[{
        label:'Monthly Mean (°C)',
        data:vals,
        backgroundColor:colors.map(function(c){return c+'55';}),
        borderColor:colors,
        borderWidth:1,
        borderRadius:4
      }]
    },
    options:Object.assign({},chartDefaults,{
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(c){return c.parsed.y!==null?c.parsed.y.toFixed(1)+'°C':'N/A';}}}
      },
      scales:{
        x:{ticks:{color:'#8b949e'},grid:{display:false}},
        y:{ticks:{color:'#8b949e',callback:function(v){return v.toFixed(0)+'°C';}},grid:{color:'rgba(255,255,255,.06)'},
           title:{display:true,text:'Temperature (°C)',color:'#8b949e'}}
      }
    })
  });
}

/* ══════════════════════════════════════
   CHART: Extremes
   ══════════════════════════════════════ */
function chartExtremes(canvas,yearly){
  canvas.parentElement.style.height='320px';
  canvas.height=320;

  var labels=yearly.map(function(y){return y.year;});
  var maxT=yearly.map(function(y){return y.maxT;});
  var minT=yearly.map(function(y){return y.minT;});
  var range=maxT.map(function(mx,i){
    var mn=minT[i];
    if(mx===null||mn===null)return null;
    return mx-mn;
  });

  charts['extremes']=new Chart(canvas,{
    type:'line',
    data:{
      labels:labels,
      datasets:[
        {label:'Yearly MAX (°C)',data:maxT,borderColor:'#f85149',backgroundColor:'rgba(248,81,73,.06)',
         borderWidth:1.5,pointRadius:0,fill:true,tension:.3},
        {label:'Yearly MIN (°C)',data:minT,borderColor:'#58a6ff',backgroundColor:'rgba(88,166,255,.06)',
         borderWidth:1.5,pointRadius:0,fill:true,tension:.3},
        {label:'Range (°C)',data:range,borderColor:'#3fb950',backgroundColor:'rgba(63,185,80,.06)',
         borderWidth:1,pointRadius:0,borderDash:[4,2],fill:false,tension:.3,yAxisID:'y2'}
      ]
    },
    options:Object.assign({},chartDefaults,{
      plugins:{
        legend:{labels:{color:'#8b949e',font:{size:11}}},
        tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+(c.parsed.y!==null?c.parsed.y.toFixed(1)+'°C':'N/A');}}}
      },
      scales:{
        x:{ticks:{color:'#8b949e',maxRotation:0,autoSkip:true,maxTicksLimit:20},grid:{color:'rgba(255,255,255,.04)'}},
        y:{ticks:{color:'#8b949e',callback:function(v){return v.toFixed(0)+'°C';}},grid:{color:'rgba(255,255,255,.06)'},
           title:{display:true,text:'Max / Min (°C)',color:'#8b949e'}},
        y2:{position:'right',ticks:{color:'#3fb950',callback:function(v){return v.toFixed(0)+'°C';}},
            grid:{display:false},title:{display:true,text:'Range (°C)',color:'#3fb950'}}
      }
    })
  });
}

/* ══════════════════════════════════════
   CHART: Hot & Cold Days
   ══════════════════════════════════════ */
function chartHotCold(canvas,yearly){
  canvas.parentElement.style.height='280px';
  canvas.height=280;

  var labels=yearly.map(function(y){return y.year;});
  var hot=yearly.map(function(y){return y.hotDays;});
  var cold=yearly.map(function(y){return y.coldDays;});

  charts['days']=new Chart(canvas,{
    type:'bar',
    data:{
      labels:labels,
      datasets:[
        {label:'Hot Days (≥30°C)',data:hot,backgroundColor:'rgba(248,81,73,.6)',borderColor:'#f85149',borderWidth:1,borderRadius:2},
        {label:'Cold Days (≤−10°C)',data:cold,backgroundColor:'rgba(88,166,255,.6)',borderColor:'#58a6ff',borderWidth:1,borderRadius:2}
      ]
    },
    options:Object.assign({},chartDefaults,{
      plugins:{
        legend:{labels:{color:'#8b949e',font:{size:11}}},
        tooltip:{mode:'index'}
      },
      scales:{
        x:{ticks:{color:'#8b949e',maxRotation:0,autoSkip:true,maxTicksLimit:20},grid:{display:false},stacked:true},
        y:{ticks:{color:'#8b949e'},grid:{color:'rgba(255,255,255,.06)'},stacked:true,
           title:{display:true,text:'Days',color:'#8b949e'}}
      }
    })
  });
}

/* ══════════════════════════════════════
   TABLE: Yearly Summary
   ══════════════════════════════════════ */
function renderTable(container,yearly,trend){
  var html='<table><thead><tr><th>Year</th><th>Mean °C</th><th>Max °C</th><th>Min °C</th><th>Range °C</th><th>Hot Days</th><th>Cold Days</th><th>Trend °C</th><th>Data Days</th></tr></thead><tbody>';
  yearly.forEach(function(y){
    var tr=(trend.slope*y.year+trend.intercept);
    html+='<tr><td>'+y.year+'</td><td>'+(y.meanT!==null?y.meanT.toFixed(1):'—')+'</td><td>'+(y.maxT!==null?y.maxT.toFixed(1):'—')+'</td><td>'+(y.minT!==null?y.minT.toFixed(1):'—')+'</td><td>'+((y.maxT!==null&&y.minT!==null)?(y.maxT-y.minT).toFixed(1):'—')+'</td><td>'+y.hotDays+'</td><td>'+y.coldDays+'</td><td>'+tr.toFixed(2)+'</td><td>'+y.dataDays+'</td></tr>';
  });
  html+='</tbody></table>';
  container.innerHTML=html;
}
