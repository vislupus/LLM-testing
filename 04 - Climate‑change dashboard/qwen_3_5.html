<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofia Climate Dashboard</title>
    <!-- Load Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        h1 { margin: 0; color: var(--primary); }
        p.subtitle { color: #666; margin-top: 5px; }

        /* Controls */
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label { font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        
        input[type="number"], select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            padding: 9px 20px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover { background-color: #2980b9; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
        }

        .stat-label { font-size: 0.9rem; color: #777; }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
            height: 400px;
        }

        .full-width { grid-column: 1 / -1; }

        #error-msg {
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Sofia Climate Dashboard</h1>
        <p class="subtitle">Analysis of Temperature Data (1952 - 2021)</p>
    </header>

    <div id="error-msg"></div>

    <div class="controls">
        <div class="control-group">
            <label for="startYear">Start Year</label>
            <input type="number" id="startYear" value="1952" min="1952" max="2021">
        </div>
        <div class="control-group">
            <label for="endYear">End Year</label>
            <input type="number" id="endYear" value="2021" min="1952" max="2021">
        </div>
        <button onclick="updateDashboard()">Update Dashboard</button>
    </div>

    <!-- Summary Statistics -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Overall Mean Temp</div>
            <div class="stat-value" id="stat-overall-mean">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Warming Trend</div>
            <div class="stat-value" id="stat-trend">--</div>
            <div style="font-size: 0.8rem; color: #666;">(°C per decade)</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Hottest Year Avg</div>
            <div class="stat-value" id="stat-hottest-year">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Hot Days (≥30°C)</div>
            <div class="stat-value" id="stat-hot-days">--</div>
        </div>
    </div>

    <!-- Charts -->
    <div class="charts-grid">
        <div class="chart-container">
            <canvas id="chartAnnual"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="chartExtremes"></canvas>
        </div>
        <div class="chart-container full-width">
            <canvas id="chartHotCold"></canvas>
        </div>
        <div class="chart-container full-width">
            <canvas id="chartMonthly"></canvas>
        </div>
    </div>
</div>

<script>
    // --- Configuration ---
    const CSV_FILE = 'temperature_Sofia_2809794_1952-01-01 - 2021-11-28.csv';
    
    // Global State
    let rawData = [];
    let charts = {};

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
    });

    // --- Data Loading & Parsing ---
    async function loadData() {
        try {
            const response = await fetch(CSV_FILE);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const text = await response.text();
            parseCSV(text);
            updateDashboard();
        } catch (error) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = `<strong>Error loading data:</strong> ${error.message}. <br>Ensure the CSV file is in the same folder as this HTML file.`;
            console.error(error);
        }
    }

    function parseCSV(text) {
        const lines = text.split('\n').filter(line => line.trim() !== '');
        const headers = lines[0].split(',').map(h => h.trim());
        
        // Find column indices dynamically to be safe
        const idxDate = headers.findIndex(h => h === 'DATE');
        const idxTavg = headers.findIndex(h => h === 'TAVG');
        const idxTmax = headers.findIndex(h => h === 'TMAX');
        const idxTmin = headers.findIndex(h => h === 'TMIN');

        if (idxDate === -1 || idxTavg === -1) {
            throw new Error("CSV columns DATE, TAVG, TMAX, TMIN not found.");
        }

        rawData = [];
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length < 4) continue;

            const dateStr = cols[idxDate].trim();
            // Parse Date (Assuming YYYY-MM-DD based on filename hint)
            const dateObj = new Date(dateStr);
            const year = dateObj.getFullYear();
            const month = dateObj.getMonth(); // 0-11

            // Convert tenths of degrees to Celsius
            // Handle potential missing data (often -9999 or empty)
            const tavg = parseFloat(cols[idxTavg]) / 10;
            const tmax = parseFloat(cols[idxTmax]) / 10;
            const tmin = parseFloat(cols[idxTmin]) / 10;

            if (!isNaN(tavg) && !isNaN(tmax) && !isNaN(tmin)) {
                rawData.push({
                    date: dateObj,
                    year: year,
                    month: month,
                    tavg: tavg,
                    tmax: tmax,
                    tmin: tmin
                });
            }
        }
        
        // Set default UI range based on data
        const years = rawData.map(d => d.year);
        const minYear = Math.min(...years);
        const maxYear = Math.max(...years);
        
        document.getElementById('startYear').value = minYear;
        document.getElementById('endYear').value = maxYear;
        document.getElementById('startYear').min = minYear;
        document.getElementById('startYear').max = maxYear;
        document.getElementById('endYear').min = minYear;
        document.getElementById('endYear').max = maxYear;
    }

    // --- Aggregation Logic ---
    function aggregateData(startYear, endYear) {
        const filtered = rawData.filter(d => d.year >= startYear && d.year <= endYear);

        // 1. Yearly Means
        const yearlyMeans = {};
        const yearlyMax = {};
        const yearlyMin = {};
        const yearlyHotDays = {};
        const yearlyColdDays = {};

        filtered.forEach(d => {
            if (!yearlyMeans[d.year]) {
                yearlyMeans[d.year] = { sum: 0, count: 0, max: -Infinity, min: Infinity, hot: 0, cold: 0 };
            }
            yearlyMeans[d.year].sum += d.tavg;
            yearlyMeans[d.year].count++;
            if (d.tmax > yearlyMeans[d.year].max) yearlyMeans[d.year].max = d.tmax;
            if (d.tmin < yearlyMeans[d.year].min) yearlyMeans[d.year].min = d.tmin;
            if (d.tmax >= 30) yearlyMeans[d.year].hot++;
            if (d.tmin <= -10) yearlyMeans[d.year].cold++;
        });

        const annualData = Object.keys(yearlyMeans).sort().map(year => {
            const y = parseInt(year);
            const data = yearlyMeans[y];
            return {
                year: y,
                mean: data.sum / data.count,
                max: data.max,
                min: data.min,
                hotDays: data.hot,
                coldDays: data.cold
            };
        });

        // 2. Monthly Means (Average across all selected years for each month)
        const monthlySums = new Array(12).fill(0);
        const monthlyCounts = new Array(12).fill(0);
        filtered.forEach(d => {
            monthlySums[d.month] += d.tavg;
            monthlyCounts[d.month]++;
        });
        const monthlyData = monthlySums.map((sum, i) => sum / monthlyCounts[i]);

        // 3. Overall Stats
        const allTemps = filtered.map(d => d.tavg);
        const overallMean = allTemps.reduce((a, b) => a + b, 0) / allTemps.length;
        
        // Linear Regression for Trend (°C per decade)
        const trend = calculateTrend(annualData);
        
        // Total Hot/Cold Days in range
        const totalHot = annualData.reduce((acc, curr) => acc + curr.hotDays, 0);
        const totalCold = annualData.reduce((acc, curr) => acc + curr.coldDays, 0);

        return { annualData, monthlyData, overallMean, trend, totalHot, totalCold };
    }

    function calculateTrend(data) {
        if (data.length < 2) return 0;
        const n = data.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        
        // Normalize X to decades from start to avoid large numbers
        const startX = data[0].year;
        
        data.forEach(d => {
            const x = (d.year - startX) / 10; // decades
            const y = d.mean;
            sumX += x;
            sumY += y;
            sumXY += (x * y);
            sumXX += (x * x);
        });

        const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
        return slope;
    }

    // --- UI Updates & Charting ---
    function updateDashboard() {
        const startYear = parseInt(document.getElementById('startYear').value);
        const endYear = parseInt(document.getElementById('endYear').value);

        if (startYear > endYear) {
            alert("Start year cannot be greater than end year.");
            return;
        }

        const agg = aggregateData(startYear, endYear);

        // Update Stats Cards
        document.getElementById('stat-overall-mean').textContent = agg.overallMean.toFixed(1) + '°C';
        document.getElementById('stat-trend').textContent = (agg.trend > 0 ? '+' : '') + agg.trend.toFixed(2) + '°C';
        document.getElementById('stat-trend').style.color = agg.trend > 0 ? '#e74c3c' : '#3498db';
        
        const hottest = agg.annualData.reduce((prev, current) => (prev.mean > current.mean) ? prev : current);
        document.getElementById('stat-hottest-year').textContent = `${hottest.year} (${hottest.mean.toFixed(1)}°C)`;
        document.getElementById('stat-hot-days').textContent = agg.totalHot;

        // Render Charts
        renderAnnualChart(agg.annualData);
        renderExtremesChart(agg.annualData);
        renderHotColdChart(agg.annualData);
        renderMonthlyChart(agg.monthlyData);
    }

    function renderAnnualChart(data) {
        const ctx = document.getElementById('chartAnnual').getContext('2d');
        if (charts.annual) charts.annual.destroy();

        charts.annual = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.year),
                datasets: [{
                    label: 'Annual Mean Temperature (°C)',
                    data: data.map(d => d.mean),
                    borderColor: '#3498db',
                    backgroundColor: 'rgba(52, 152, 219, 0.2)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'Annual Mean Temperature Trend' } },
                scales: { y: { beginAtZero: false, title: { display: true, text: 'Temperature (°C)' } } }
            }
        });
    }

    function renderExtremesChart(data) {
        const ctx = document.getElementById('chartExtremes').getContext('2d');
        if (charts.extremes) charts.extremes.destroy();

        charts.extremes = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.year),
                datasets: [
                    {
                        label: 'Yearly Max Temp',
                        data: data.map(d => d.max),
                        borderColor: '#e74c3c',
                        borderWidth: 1,
                        pointRadius: 0
                    },
                    {
                        label: 'Yearly Min Temp',
                        data: data.map(d => d.min),
                        borderColor: '#3498db',
                        borderWidth: 1,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'Yearly Temperature Extremes' } },
                interaction: { mode: 'index', intersect: false }
            }
        });
    }

    function renderHotColdChart(data) {
        const ctx = document.getElementById('chartHotCold').getContext('2d');
        if (charts.hotCold) charts.hotCold.destroy();

        charts.hotCold = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map(d => d.year),
                datasets: [
                    {
                        label: 'Hot Days (≥30°C)',
                        data: data.map(d => d.hotDays),
                        backgroundColor: '#e67e22'
                    },
                    {
                        label: 'Cold Days (≤-10°C)',
                        data: data.map(d => d.coldDays),
                        backgroundColor: '#3498db'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'Frequency of Extreme Temperature Days' } },
                scales: { y: { beginAtZero: true, title: { display: true, text: 'Count of Days' } } }
            }
        });
    }

    function renderMonthlyChart(data) {
        const ctx = document.getElementById('chartMonthly').getContext('2d');
        if (charts.monthly) charts.monthly.destroy();

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        charts.monthly = new Chart(ctx, {
            type: 'line',
            data: {
                labels: months,
                datasets: [{
                    label: 'Average Monthly Temperature (°C)',
                    data: data,
                    borderColor: '#2ecc71',
                    backgroundColor: 'rgba(46, 204, 113, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'Seasonal Cycle (Average across selected years)' } },
                scales: { y: { title: { display: true, text: 'Temperature (°C)' } } }
            }
        });
    }
</script>

</body>
</html>
