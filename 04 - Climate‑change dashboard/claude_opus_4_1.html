<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofia Climate Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.30.0/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-statistics@7.8.3/dist/simple-statistics.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 1.1rem;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #4a5568;
        }

        select, input[type="number"] {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            color: #2d3748;
            min-width: 100px;
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .trend-positive {
            color: #f56565;
        }

        .trend-negative {
            color: #4299e1;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .chart-canvas {
            position: relative;
            height: 300px;
        }

        .large-chart {
            grid-column: 1 / -1;
        }

        .large-chart .chart-canvas {
            height: 400px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .error {
            background: #fed7d7;
            color: #9b2c2c;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .file-input-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .file-input-label {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
        }

        #fileInput {
            display: none;
        }

        .info-box {
            background: #e6fffa;
            border-left: 4px solid #319795;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            color: #4a5568;
        }

        .legend-color {
            width: 20px;
            height: 12px;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .control-group {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡️ Sofia Climate Dashboard</h1>
            <div class="subtitle">Historical Temperature Analysis (1952-2021)</div>
        </div>

        <div class="file-input-container">
            <label for="fileInput" class="file-input-label">
                📁 Load Temperature Data (CSV)
            </label>
            <input type="file" id="fileInput" accept=".csv">
            <div class="info-box">
                <strong>Expected file:</strong> temperature_Sofia_2809794_1952-01-01 - 2021-11-28.csv<br>
                <small>The file should contain DATE, TAVG, TMAX, and TMIN columns</small>
            </div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label for="startYear">Start Year:</label>
                <input type="number" id="startYear" min="1952" max="2021" value="1952">
            </div>
            <div class="control-group">
                <label for="endYear">End Year:</label>
                <input type="number" id="endYear" min="1952" max="2021" value="2021">
            </div>
            <button onclick="updateDashboard()">Update Dashboard</button>
            <button onclick="resetRange()">Reset Range</button>
        </div>

        <div id="errorContainer"></div>

        <div id="statsContainer" class="stats-grid" style="display: none;"></div>

        <div id="chartsContainer" class="charts-grid" style="display: none;"></div>

        <div id="loadingContainer" class="loading">
            Please load the temperature data CSV file to begin analysis.
        </div>
    </div>

    <script>
        let rawData = [];
        let processedData = null;
        let charts = {};

        // File loading
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loadingContainer').innerHTML = 'Loading and processing data...';

            try {
                const text = await file.text();
                rawData = parseCSV(text);
                
                if (rawData.length === 0) {
                    throw new Error('No data found in CSV file');
                }

                processedData = processData(rawData);
                initializeDashboard();
                updateDashboard();

                document.getElementById('controls').style.display = 'flex';
                document.getElementById('statsContainer').style.display = 'grid';
                document.getElementById('chartsContainer').style.display = 'grid';
                document.getElementById('loadingContainer').style.display = 'none';
            } catch (error) {
                showError(`Error loading file: ${error.message}`);
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            const dateIndex = headers.indexOf('DATE');
            const tavgIndex = headers.indexOf('TAVG');
            const tmaxIndex = headers.indexOf('TMAX');
            const tminIndex = headers.indexOf('TMIN');

            if (dateIndex === -1 || tavgIndex === -1 || tmaxIndex === -1 || tminIndex === -1) {
                throw new Error('Required columns (DATE, TAVG, TMAX, TMIN) not found');
            }

            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                
                if (values.length > dateIndex) {
                    const date = new Date(values[dateIndex]);
                    const tavg = parseFloat(values[tavgIndex]) / 10; // Convert from tenths to degrees
                    const tmax = parseFloat(values[tmaxIndex]) / 10;
                    const tmin = parseFloat(values[tminIndex]) / 10;

                    if (!isNaN(date.getTime())) {
                        data.push({
                            date: date,
                            year: date.getFullYear(),
                            month: date.getMonth(),
                            day: date.getDate(),
                            tavg: isNaN(tavg) ? null : tavg,
                            tmax: isNaN(tmax) ? null : tmax,
                            tmin: isNaN(tmin) ? null : tmin
                        });
                    }
                }
            }

            return data;
        }

        function processData(data) {
            const years = [...new Set(data.map(d => d.year))].sort();
            
            return {
                data: data,
                years: years,
                minYear: Math.min(...years),
                maxYear: Math.max(...years)
            };
        }

        function initializeDashboard() {
            document.getElementById('startYear').min = processedData.minYear;
            document.getElementById('startYear').max = processedData.maxYear;
            document.getElementById('startYear').value = processedData.minYear;
            
            document.getElementById('endYear').min = processedData.minYear;
            document.getElementById('endYear').max = processedData.maxYear;
            document.getElementById('endYear').value = processedData.maxYear;

            // Clear existing content
            document.getElementById('statsContainer').innerHTML = '';
            document.getElementById('chartsContainer').innerHTML = '';
        }

        function updateDashboard() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);

            if (startYear > endYear) {
                showError('Start year must be less than or equal to end year');
                return;
            }

            const filteredData = processedData.data.filter(d => d.year >= startYear && d.year <= endYear);
            
            updateStatistics(filteredData, startYear, endYear);
            updateCharts(filteredData, startYear, endYear);
            
            clearError();
        }

        function updateStatistics(data, startYear, endYear) {
            const statsContainer = document.getElementById('statsContainer');
            statsContainer.innerHTML = '';

            // Calculate overall statistics
            const validTavg = data.filter(d => d.tavg !== null).map(d => d.tavg);
            const validTmax = data.filter(d => d.tmax !== null).map(d => d.tmax);
            const validTmin = data.filter(d => d.tmin !== null).map(d => d.tmin);

            const overallMean = validTavg.length > 0 ? validTavg.reduce((a, b) => a + b, 0) / validTavg.length : 0;
            const maxTemp = validTmax.length > 0 ? Math.max(...validTmax) : 0;
            const minTemp = validTmin.length > 0 ? Math.min(...validTmin) : 0;

            // Count extreme days
            const hotDays = data.filter(d => d.tmax !== null && d.tmax >= 30).length;
            const veryHotDays = data.filter(d => d.tmax !== null && d.tmax >= 35).length;
            const coldDays = data.filter(d => d.tmin !== null && d.tmin <= -10).length;
            const veryColdDays = data.filter(d => d.tmin !== null && d.tmin <= -15).length;

            // Calculate warming trend
            const yearlyAverages = calculateYearlyAverages(data);
            const trend = calculateTrend(yearlyAverages);

            // Create stat cards
            const stats = [
                { label: 'Period', value: `${startYear}-${endYear}`, trend: null },
                { label: 'Mean Temp', value: `${overallMean.toFixed(1)}°C`, trend: null },
                { label: 'Max Recorded', value: `${maxTemp.toFixed(1)}°C`, trend: null },
                { label: 'Min Recorded', value: `${minTemp.toFixed(1)}°C`, trend: null },
                { label: 'Hot Days (≥30°C)', value: hotDays, trend: null },
                { label: 'Very Hot (≥35°C)', value: veryHotDays, trend: null },
                { label: 'Cold Days (≤-10°C)', value: coldDays, trend: null },
                { label: 'Very Cold (≤-15°C)', value: veryColdDays, trend: null },
                { label: 'Warming Trend', value: `${trend > 0 ? '+' : ''}${(trend * 10).toFixed(2)}°C/decade`, trend: trend > 0 ? 'positive' : 'negative' }
            ];

            stats.forEach(stat => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                
                const valueClass = stat.trend ? `trend-${stat.trend}` : '';
                
                card.innerHTML = `
                    <div class="stat-value ${valueClass}">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                `;
                
                statsContainer.appendChild(card);
            });
        }

        function calculateYearlyAverages(data) {
            const yearlyData = {};
            
            data.forEach(d => {
                if (!yearlyData[d.year]) {
                    yearlyData[d.year] = {
                        tavg: [],
                        tmax: [],
                        tmin: []
                    };
                }
                
                if (d.tavg !== null) yearlyData[d.year].tavg.push(d.tavg);
                if (d.tmax !== null) yearlyData[d.year].tmax.push(d.tmax);
                if (d.tmin !== null) yearlyData[d.year].tmin.push(d.tmin);
            });

            const yearlyAverages = [];
            for (const year in yearlyData) {
                const yearData = yearlyData[year];
                yearlyAverages.push({
                    year: parseInt(year),
                    tavg: yearData.tavg.length > 0 ? yearData.tavg.reduce((a, b) => a + b, 0) / yearData.tavg.length : null,
                    tmax: yearData.tmax.length > 0 ? yearData.tmax.reduce((a, b) => a + b, 0) / yearData.tmax.length : null,
                    tmin: yearData.tmin.length > 0 ? yearData.tmin.reduce((a, b) => a + b, 0) / yearData.tmin.length : null
                });
            }

            return yearlyAverages.sort((a, b) => a.year - b.year);
        }

        function calculateTrend(yearlyAverages) {
            const validData = yearlyAverages.filter(d => d.tavg !== null);
            if (validData.length < 2) return 0;

            const x = validData.map(d => d.year);
            const y = validData.map(d => d.tavg);

            // Simple linear regression
            const n = x.length;
            const sumX = x.reduce((a, b) => a + b, 0);
            const sumY = y.reduce((a, b) => a + b, 0);
            const sumXY = x.map((xi, i) => xi * y[i]).reduce((a, b) => a + b, 0);
            const sumX2 = x.map(xi => xi * xi).reduce((a, b) => a + b, 0);

            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            return slope; // Degrees per year
        }

        function updateCharts(data, startYear, endYear) {
            const chartsContainer = document.getElementById('chartsContainer');
            chartsContainer.innerHTML = '';

            // Destroy existing charts
            Object.values(charts).forEach(chart => chart.destroy());
            charts = {};

            // 1. Annual Temperature Trends
            createAnnualTrendsChart(data, chartsContainer);

            // 2. Monthly Temperature Patterns
            createMonthlyPatternsChart(data, chartsContainer);

            // 3. Temperature Distribution
            createTemperatureDistributionChart(data, chartsContainer);

            // 4. Extreme Days by Year
            createExtremeDaysChart(data, chartsContainer);

            // 5. Seasonal Comparison
            createSeasonalChart(data, chartsContainer);

            // 6. Heat Map Calendar (last 5 years)
            createHeatMapChart(data, chartsContainer, Math.max(startYear, endYear - 4), endYear);
        }

        function createAnnualTrendsChart(data, container) {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-container large-chart';
            chartDiv.innerHTML = `
                <div class="chart-title">Annual Temperature Trends</div>
                <div class="chart-canvas">
                    <canvas id="annualTrendsChart"></canvas>
                </div>
            `;
            container.appendChild(chartDiv);

            const yearlyAverages = calculateYearlyAverages(data);

            const ctx = document.getElementById('annualTrendsChart').getContext('2d');
            charts.annualTrends = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: yearlyAverages.map(d => d.year),
                    datasets: [
                        {
                            label: 'Average Temperature',
                            data: yearlyAverages.map(d => d.tavg),
                            borderColor: 'rgb(75, 192, 192)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            tension: 0.1
                        },
                        {
                            label: 'Maximum Temperature',
                            data: yearlyAverages.map(d => d.tmax),
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            tension: 0.1
                        },
                        {
                            label: 'Minimum Temperature',
                            data: yearlyAverages.map(d => d.tmin),
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Temperature (°C)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Year'
                            }
                        }
                    }
                }
            });
        }

        function createMonthlyPatternsChart(data, container) {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-container';
            chartDiv.innerHTML = `
                <div class="chart-title">Monthly Temperature Patterns</div>
                <div class="chart-canvas">
                    <canvas id="monthlyPatternsChart"></canvas>
                </div>
            `;
            container.appendChild(chartDiv);

            const monthlyData = {};
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            for (let i = 0; i < 12; i++) {
                monthlyData[i] = { tavg: [], tmax: [], tmin: [] };
            }

            data.forEach(d => {
                if (d.tavg !== null) monthlyData[d.month].tavg.push(d.tavg);
                if (d.tmax !== null) monthlyData[d.month].tmax.push(d.tmax);
                if (d.tmin !== null) monthlyData[d.month].tmin.push(d.tmin);
            });

            const monthlyAverages = Object.keys(monthlyData).map(month => ({
                tavg: monthlyData[month].tavg.length > 0 ? monthlyData[month].tavg.reduce((a, b) => a + b, 0) / monthlyData[month].tavg.length : 0,
                tmax: monthlyData[month].tmax.length > 0 ? monthlyData[month].tmax.reduce((a, b) => a + b, 0) / monthlyData[month].tmax.length : 0,
                tmin: monthlyData[month].tmin.length > 0 ? monthlyData[month].tmin.reduce((a, b) => a + b, 0) / monthlyData[month].tmin.length : 0
            }));

            const ctx = document.getElementById('monthlyPatternsChart').getContext('2d');
            charts.monthlyPatterns = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthNames,
                    datasets: [
                        {
                            label: 'Average',
                            data: monthlyAverages.map(d => d.tavg.toFixed(1)),
                            backgroundColor: 'rgba(75, 192, 192, 0.6)'
                        },
                        {
                            label: 'Max',
                            data: monthlyAverages.map(d => d.tmax.toFixed(1)),
                            backgroundColor: 'rgba(255, 99, 132, 0.6)'
                        },
                        {
                            label: 'Min',
                            data: monthlyAverages.map(d => d.tmin.toFixed(1)),
                            backgroundColor: 'rgba(54, 162, 235, 0.6)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Temperature (°C)'
                            }
                        }
                    }
                }
            });
        }

        function createTemperatureDistributionChart(data, container) {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-container';
            chartDiv.innerHTML = `
                <div class="chart-title">Temperature Distribution</div>
                <div class="chart-canvas">
                    <canvas id="distributionChart"></canvas>
                </div>
            `;
            container.appendChild(chartDiv);

            // Create temperature bins
            const bins = [];
            const binSize = 5;
            for (let i = -20; i <= 45; i += binSize) {
                bins.push({
                    min: i,
                    max: i + binSize,
                    label: `${i} to ${i + binSize}°C`,
                    count: 0
                });
            }

            data.forEach(d => {
                if (d.tavg !== null) {
                    const bin = bins.find(b => d.tavg >= b.min && d.tavg < b.max);
                    if (bin) bin.count++;
                }
            });

            const ctx = document.getElementById('distributionChart').getContext('2d');
            charts.distribution = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: bins.map(b => b.label),
                    datasets: [{
                        label: 'Days',
                        data: bins.map(b => b.count),
                        backgroundColor: bins.map(b => {
                            if (b.min < 0) return 'rgba(54, 162, 235, 0.6)';
                            if (b.min < 20) return 'rgba(75, 192, 192, 0.6)';
                            return 'rgba(255, 99, 132, 0.6)';
                        })
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Number of Days'
                            }
                        },
                        x: {
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }

        function createExtremeDaysChart(data, container) {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-container';
            chartDiv.innerHTML = `
                <div class="chart-title">Extreme Temperature Days by Year</div>
                <div class="chart-canvas">
                    <canvas id="extremeDaysChart"></canvas>
                </div>
            `;
            container.appendChild(chartDiv);

            const yearlyExtremes = {};
            data.forEach(d => {
                if (!yearlyExtremes[d.year]) {
                    yearlyExtremes[d.year] = {
                        hot: 0,
                        veryHot: 0,
                        cold: 0,
                        veryCold: 0
                    };
                }
                
                if (d.tmax !== null && d.tmax >= 30) yearlyExtremes[d.year].hot++;
                if (d.tmax !== null && d.tmax >= 35) yearlyExtremes[d.year].veryHot++;
                if (d.tmin !== null && d.tmin <= -10) yearlyExtremes[d.year].cold++;
                if (d.tmin !== null && d.tmin <= -15) yearlyExtremes[d.year].veryCold++;
            });

            const years = Object.keys(yearlyExtremes).sort();

            const ctx = document.getElementById('extremeDaysChart').getContext('2d');
            charts.extremeDays = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [
                        {
                            label: 'Hot Days (≥30°C)',
                            data: years.map(y => yearlyExtremes[y].hot),
                            borderColor: 'rgb(255, 159, 64)',
                            backgroundColor: 'rgba(255, 159, 64, 0.2)',
                            tension: 0.1
                        },
                        {
                            label: 'Very Hot Days (≥35°C)',
                            data: years.map(y => yearlyExtremes[y].veryHot),
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            tension: 0.1
                        },
                        {
                            label: 'Cold Days (≤-10°C)',
                            data: years.map(y => yearlyExtremes[y].cold),
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            tension: 0.1
                        },
                        {
                            label: 'Very Cold Days (≤-15°C)',
                            data: years.map(y => yearlyExtremes[y].veryCold),
                            borderColor: 'rgb(75, 192, 192)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Number of Days'
                            }
                        }
                    }
                }
            });
        }

        function createSeasonalChart(data, container) {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-container';
            chartDiv.innerHTML = `
                <div class="chart-title">Seasonal Temperature Comparison</div>
                <div class="chart-canvas">
                    <canvas id="seasonalChart"></canvas>
                </div>
            `;
            container.appendChild(chartDiv);

            const seasons = {
                'Winter': [11, 0, 1],  // Dec, Jan, Feb
                'Spring': [2, 3, 4],   // Mar, Apr, May
                'Summer': [5, 6, 7],   // Jun, Jul, Aug
                'Autumn': [8, 9, 10]   // Sep, Oct, Nov
            };

            const seasonalData = {};
            Object.keys(seasons).forEach(season => {
                seasonalData[season] = { tavg: [], tmax: [], tmin: [] };
            });

            data.forEach(d => {
                const season = Object.keys(seasons).find(s => seasons[s].includes(d.month));
                if (season) {
                    if (d.tavg !== null) seasonalData[season].tavg.push(d.tavg);
                    if (d.tmax !== null) seasonalData[season].tmax.push(d.tmax);
                    if (d.tmin !== null) seasonalData[season].tmin.push(d.tmin);
                }
            });

            const seasonalAverages = Object.keys(seasonalData).map(season => ({
                season,
                tavg: seasonalData[season].tavg.length > 0 ? seasonalData[season].tavg.reduce((a, b) => a + b, 0) / seasonalData[season].tavg.length : 0,
                tmax: seasonalData[season].tmax.length > 0 ? Math.max(...seasonalData[season].tmax) : 0,
                tmin: seasonalData[season].tmin.length > 0 ? Math.min(...seasonalData[season].tmin) : 0
            }));

            const ctx = document.getElementById('seasonalChart').getContext('2d');
            charts.seasonal = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: seasonalAverages.map(d => d.season),
                    datasets: [
                        {
                            label: 'Average Temperature',
                            data: seasonalAverages.map(d => d.tavg.toFixed(1)),
                            borderColor: 'rgb(75, 192, 192)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)'
                        },
                        {
                            label: 'Max Temperature',
                            data: seasonalAverages.map(d => d.tmax.toFixed(1)),
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)'
                        },
                        {
                            label: 'Min Temperature',
                            data: seasonalAverages.map(d => d.tmin.toFixed(1)),
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Temperature (°C)'
                            }
                        }
                    }
                }
            });
        }

        function createHeatMapChart(data, container, startYear, endYear) {
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-container large-chart';
            chartDiv.innerHTML = `
                <div class="chart-title">Daily Temperature Heat Map (${startYear}-${endYear})</div>
                <div class="chart-canvas">
                    <canvas id="heatMapChart"></canvas>
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #2166ac;"></div>
                        <span>< 0°C</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #67a9cf;"></div>
                        <span>0-10°C</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #f7f7f7;"></div>
                        <span>10-20°C</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #fddbc7;"></div>
                        <span>20-30°C</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ef8a62;"></div>
                        <span>30-35°C</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #b2182b;"></div>
                        <span>> 35°C</span>
                    </div>
                </div>
            `;
            container.appendChild(chartDiv);

            // Prepare data for heat map
            const filteredData = data.filter(d => d.year >= startYear && d.year <= endYear);
            const heatMapData = [];

            filteredData.forEach(d => {
                if (d.tavg !== null) {
                    const dayOfYear = getDayOfYear(d.date);
                    heatMapData.push({
                        x: dayOfYear,
                        y: d.year - startYear,
                        v: d.tavg
                    });
                }
            });

            // Create a scatter plot that looks like a heat map
            const ctx = document.getElementById('heatMapChart').getContext('2d');
            charts.heatMap = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'Temperature',
                        data: heatMapData,
                        backgroundColor: heatMapData.map(d => {
                            if (d.v < 0) return '#2166ac';
                            if (d.v < 10) return '#67a9cf';
                            if (d.v < 20) return '#f7f7f7';
                            if (d.v < 30) return '#fddbc7';
                            if (d.v < 35) return '#ef8a62';
                            return '#b2182b';
                        }),
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const year = startYear + context.parsed.y;
                                    const dayOfYear = context.parsed.x;
                                    const date = getDateFromDayOfYear(year, dayOfYear);
                                    return `${date}: ${context.raw.v.toFixed(1)}°C`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Day of Year'
                            },
                            min: 1,
                            max: 365
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Year'
                            },
                            ticks: {
                                callback: function(value) {
                                    return startYear + value;
                                }
                            }
                        }
                    }
                }
            });
        }

        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        function getDateFromDayOfYear(year, dayOfYear) {
            const date = new Date(year, 0);
            date.setDate(dayOfYear);
            return date.toLocaleDateString();
        }

        function resetRange() {
            document.getElementById('startYear').value = processedData.minYear;
            document.getElementById('endYear').value = processedData.maxYear;
            updateDashboard();
        }

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        function clearError() {
            document.getElementById('errorContainer').innerHTML = '';
        }

        // Auto-load if the expected file exists
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('temperature_Sofia_2809794_1952-01-01 - 2021-11-28.csv');
                if (response.ok) {
                    const text = await response.text();
                    rawData = parseCSV(text);
                    
                    if (rawData.length > 0) {
                        processedData = processData(rawData);
                        initializeDashboard();
                        updateDashboard();

                        document.getElementById('controls').style.display = 'flex';
                        document.getElementById('statsContainer').style.display = 'grid';
                        document.getElementById('chartsContainer').style.display = 'grid';
                        document.getElementById('loadingContainer').style.display = 'none';
                        document.getElementById('fileInput').parentElement.style.display = 'none';
                    }
                }
            } catch (error) {
                console.log('Auto-load failed, manual file selection required');
            }
        });
    </script>
</body>
</html>
