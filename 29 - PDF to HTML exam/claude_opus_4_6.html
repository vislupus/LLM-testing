<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДЗИ по Физика и Астрономия — 23 май 2018</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-hover: #f0f2f8;
  --border: #e2e5ef;
  --border-focus: #6366f1;
  --text: #1e1e2e;
  --text-secondary: #6b7084;
  --primary: #6366f1;
  --primary-light: #eef0ff;
  --primary-dark: #4f46e5;
  --success: #10b981;
  --success-light: #ecfdf5;
  --success-border: #a7f3d0;
  --error: #ef4444;
  --error-light: #fef2f2;
  --error-border: #fecaca;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --info: #3b82f6;
  --info-light: #eff6ff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
  --transition: 0.2s ease;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== START SCREEN ===== */
.start-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  animation: gradientShift 8s ease infinite alternate;
  background-size: 200% 200%;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.start-card {
  background: white;
  border-radius: 20px;
  padding: 48px 40px;
  max-width: 520px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  animation: slideUp 0.6s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.start-card .emblem {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, var(--primary), #a855f7);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px;
  font-size: 2rem;
}

.start-card h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
}

.start-card .subtitle {
  font-size: 1.05rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.start-card .meta {
  font-size: 0.88rem;
  color: var(--text-secondary);
  margin-bottom: 28px;
}

.start-card .info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 32px;
}

.start-card .info-item {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 14px;
  text-align: center;
}

.start-card .info-item .num {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--primary);
}

.start-card .info-item .label {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 600;
  padding: 14px 36px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: 0 4px 14px rgba(99,102,241,0.35);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(99,102,241,0.45);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 600;
  padding: 10px 22px;
  border: 1px solid var(--border);
  border-radius: 50px;
  cursor: pointer;
  transition: all var(--transition);
}

.btn-secondary:hover { background: var(--bg); border-color: var(--primary); color: var(--primary); }

.btn-small {
  font-size: 0.82rem;
  padding: 7px 16px;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  cursor: pointer;
  font-family: var(--font);
  font-weight: 600;
  transition: all var(--transition);
}

.btn-small:hover { border-color: var(--primary); color: var(--primary); }

/* ===== EXAM LAYOUT ===== */
.exam-screen { display: none; }
.exam-screen.active { display: block; }

.exam-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}

.exam-header .inner {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.exam-header .title-area h2 {
  font-size: 0.92rem;
  font-weight: 700;
}

.exam-header .title-area span {
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.progress-wrap {
  flex: 1;
  max-width: 280px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #a855f7);
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}

.progress-text {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-secondary);
  white-space: nowrap;
}

/* ===== QUESTION AREA ===== */
.exam-body {
  max-width: 800px;
  margin: 0 auto;
  padding: 24px 20px 120px;
}

.module-divider {
  text-align: center;
  margin: 40px 0 32px;
  position: relative;
}

.module-divider::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 1px;
  background: var(--border);
}

.module-divider span {
  position: relative;
  background: var(--bg);
  padding: 0 20px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Question card */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  transition: border-color var(--transition), box-shadow var(--transition);
  animation: cardIn 0.3s ease;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.q-card:hover { box-shadow: var(--shadow-lg); }
.q-card.answered-correct { border-color: var(--success); }
.q-card.answered-wrong { border-color: var(--error); }

.q-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary);
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 12px;
  flex-shrink: 0;
}

.q-points {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg);
  padding: 2px 10px;
  border-radius: 10px;
  margin-left: 8px;
  vertical-align: middle;
}

.q-text {
  font-size: 0.98rem;
  font-weight: 500;
  margin-bottom: 18px;
  line-height: 1.7;
}

/* MC options */
.mc-options { display: flex; flex-direction: column; gap: 8px; }

.mc-opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 0.92rem;
  line-height: 1.5;
}

.mc-opt:hover { border-color: var(--border-focus); background: var(--primary-light); }

.mc-opt .radio {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all var(--transition);
  display: flex; align-items: center; justify-content: center;
}

.mc-opt.selected { border-color: var(--primary); background: var(--primary-light); }
.mc-opt.selected .radio { border-color: var(--primary); background: var(--primary); }
.mc-opt.selected .radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: white; }

.mc-opt.correct-opt { border-color: var(--success); background: var(--success-light); }
.mc-opt.correct-opt .radio { border-color: var(--success); background: var(--success); }
.mc-opt.correct-opt .radio::after { content: '✓'; color: white; font-size: 11px; font-weight: 700; }

.mc-opt.wrong-opt { border-color: var(--error); background: var(--error-light); }
.mc-opt.wrong-opt .radio { border-color: var(--error); background: var(--error); }
.mc-opt.wrong-opt .radio::after { content: '✗'; color: white; font-size: 11px; font-weight: 700; }

.mc-opt.locked { pointer-events: none; }

/* Free-response */
.fr-part { margin-bottom: 18px; }
.fr-part label {
  display: block;
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.fr-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 0.92rem;
  color: var(--text);
  background: var(--surface);
  transition: border-color var(--transition);
  outline: none;
}

.fr-input:focus { border-color: var(--border-focus); }
.fr-input.correct-input { border-color: var(--success); background: var(--success-light); }
.fr-input.wrong-input { border-color: var(--error); background: var(--error-light); }

.fr-hint {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 4px;
  font-style: italic;
}

/* Feedback */
.q-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 500;
  display: none;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.q-feedback.show { display: block; }
.q-feedback.correct { background: var(--success-light); color: #065f46; border: 1px solid var(--success-border); }
.q-feedback.wrong { background: var(--error-light); color: #991b1b; border: 1px solid var(--error-border); }
.q-feedback.info { background: var(--info-light); color: #1e40af; border: 1px solid #bfdbfe; }

/* Check button per card */
.q-check-btn {
  margin-top: 14px;
  padding: 9px 20px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 50px;
  font-family: var(--font);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}

.q-check-btn:hover { background: var(--primary-dark); }
.q-check-btn:disabled { opacity: 0.4; cursor: default; }

/* Explanation toggle */
.explanation-toggle {
  margin-top: 10px;
  font-size: 0.82rem;
  color: var(--primary);
  cursor: pointer;
  font-weight: 600;
  background: none;
  border: none;
  font-family: var(--font);
  padding: 0;
}

.explanation-toggle:hover { text-decoration: underline; }

.explanation-body {
  display: none;
  margin-top: 8px;
  padding: 12px 16px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.7;
}

.explanation-body.show { display: block; }

/* ===== BOTTOM BAR ===== */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 50;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 12px 20px;
}

.bottom-bar .inner {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.score-display {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.score-display .pts { color: var(--primary); font-size: 1.05rem; }

/* ===== RESULTS SCREEN ===== */
.results-screen { display: none; }
.results-screen.active { display: block; min-height: 100vh; padding: 40px 20px; }

.results-card {
  max-width: 600px;
  margin: 0 auto;
  background: var(--surface);
  border-radius: 20px;
  padding: 40px;
  box-shadow: var(--shadow-lg);
  text-align: center;
  animation: slideUp 0.6s ease;
}

.results-card .big-score {
  font-size: 3.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.results-card .grade {
  font-size: 1.2rem;
  font-weight: 700;
  margin: 8px 0 4px;
}

.results-card .grade-sub {
  font-size: 0.9rem;
  color: var(--text-secondary);
  margin-bottom: 28px;
}

.results-breakdown {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}

.results-breakdown .rb-item {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 16px 8px;
}

.results-breakdown .rb-num { font-size: 1.6rem; font-weight: 800; }
.results-breakdown .rb-label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }

.rb-correct .rb-num { color: var(--success); }
.rb-wrong .rb-num { color: var(--error); }
.rb-skipped .rb-num { color: var(--warning); }

.results-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ===== NAV GRID ===== */
.nav-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;
  margin-bottom: 20px;
}

.nav-dot {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}

.nav-dot:hover { border-color: var(--primary); color: var(--primary); }
.nav-dot.dot-correct { background: var(--success-light); border-color: var(--success); color: var(--success); }
.nav-dot.dot-wrong { background: var(--error-light); border-color: var(--error); color: var(--error); }
.nav-dot.dot-selected { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .start-card { padding: 32px 24px; }
  .start-card h1 { font-size: 1.25rem; }
  .q-card { padding: 20px; }
  .exam-header .title-area h2 { font-size: 0.82rem; }
  .results-card { padding: 28px 20px; }
  .results-card .big-score { font-size: 2.8rem; }
  .nav-grid { grid-template-columns: repeat(8, 1fr); }
  .results-breakdown { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bottom-bar .inner { flex-wrap: wrap; justify-content: center; }
}

/* ===== FORMULA STYLING ===== */
.formula {
  font-family: 'Cambria Math', 'Times New Roman', serif;
  font-style: italic;
  background: var(--bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.95em;
}

.katex-like {
  font-family: 'Cambria Math', 'Times New Roman', serif;
}

sup { font-size: 0.7em; vertical-align: super; }
sub { font-size: 0.7em; vertical-align: sub; }
</style>
</head>
<body>

<!-- ==================== START SCREEN ==================== -->
<div class="start-screen" id="startScreen">
  <div class="start-card">
    <div class="emblem">⚛️</div>
    <h1>Физика и Астрономия</h1>
    <p class="subtitle">Държавен зрелостен изпит</p>
    <p class="meta">23 май 2018 г. — Вариант 1</p>
    <div class="info-grid">
      <div class="info-item"><div class="num">50</div><div class="label">Въпроса</div></div>
      <div class="info-item"><div class="num">100</div><div class="label">Точки</div></div>
      <div class="info-item"><div class="num">I + II</div><div class="label">Модула</div></div>
      <div class="info-item"><div class="num">240</div><div class="label">Минути</div></div>
    </div>
    <button class="btn-primary" onclick="startExam()">Започни изпита →</button>
  </div>
</div>

<!-- ==================== EXAM SCREEN ==================== -->
<div class="exam-screen" id="examScreen">
  <div class="exam-header">
    <div class="inner">
      <div class="title-area">
        <h2>ДЗИ Физика 2018</h2>
        <span id="moduleLabel">Модул I</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0/50</div>
      </div>
      <button class="btn-small" onclick="finishExam()">Предай</button>
    </div>
  </div>

  <div class="exam-body" id="examBody">
    <!-- Questions injected by JS -->
  </div>

  <div class="bottom-bar">
    <div class="inner">
      <div class="score-display">Точки: <span class="pts" id="liveScore">0</span> / 100</div>
      <div style="display:flex;gap:8px">
        <button class="btn-small" onclick="scrollToUnanswered()">Следващ ↓</button>
        <button class="btn-small" onclick="finishExam()">Предай</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== RESULTS SCREEN ==================== -->
<div class="results-screen" id="resultsScreen">
  <div class="results-card">
    <div style="font-size:2.5rem;margin-bottom:12px">📊</div>
    <div class="big-score" id="finalScore">0</div>
    <div class="grade" id="gradeText">точки от 100</div>
    <div class="grade-sub" id="gradeSub"></div>

    <div class="results-breakdown">
      <div class="rb-item rb-correct">
        <div class="rb-num" id="resCorrect">0</div>
        <div class="rb-label">Верни</div>
      </div>
      <div class="rb-item rb-wrong">
        <div class="rb-num" id="resWrong">0</div>
        <div class="rb-label">Грешни</div>
      </div>
      <div class="rb-item rb-skipped">
        <div class="rb-num" id="resSkipped">0</div>
        <div class="rb-label">Без отговор</div>
      </div>
    </div>

    <div id="navGridResults"></div>

    <div class="results-actions">
      <button class="btn-primary" onclick="reviewExam()">Прегледай отговорите</button>
      <button class="btn-secondary" onclick="restartExam()">🔄 Започни отново</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// DATA: All 50 questions from the 2018 Physics & Astronomy exam
// ============================================================
const questions = [
  // ---- MODULE I: Questions 1-30 (1.5 pts each = 45 pts) ----
  {
    id: 1, module: 1, points: 1.5, type: 'mc',
    text: 'Два електрични точкови заряда се намират във вакуум на разстояние <em>r</em> един от друг. Как ще се промени силата <em>F</em> на тяхното взаимодействие, ако разстоянието между тях се увеличи два пъти?',
    options: ['ще намалее два пъти', 'ще намалее четири пъти', 'ще намалее осем пъти', 'ще се увеличи два пъти'],
    correct: 1,
    explanation: 'По закона на Кулон F = k·q₁q₂/r². Ако r → 2r, тогава F → F/4. Силата намалява 4 пъти.'
  },
  {
    id: 2, module: 1, points: 1.5, type: 'mc',
    text: 'На коя фигура са показани силовите линии на електростатично поле, създадено от положителен точков заряд <em>q</em>?',
    options: ['Лъчи, излизащи радиално навън от заряда (→)', 'Затворени кръгове около заряда', 'Лъчи, влизащи радиално навътре към заряда (←)', 'Кръстчета (×) около заряда'],
    correct: 0,
    explanation: 'Силовите линии на положителен точков заряд излизат радиално от заряда навън.'
  },
  {
    id: 3, module: 1, points: 1.5, type: 'mc',

      { label: 'Б) Време за 16× намаление (денонощия):', answer: '15.2', unit: 'денонощия', hint: '16 = 2⁴ → n = 4, t = 4 × 3,8' }
    ],
    explanation: 'n = 19/3,8 = 5 полуживота. N = N₀/2⁵ = N₀/32.\n16 = 2⁴ → 4 полуживота → t = 4 × 3,8 = 15,2 денонощия.'

// ============================================================
// STATE
// ============================================================
let answers = {};       // { questionId: selectedIndex (mc) or { partIdx: value } (fr) }
let checked = {};       // { questionId: true } — already checked
let results = {};       // { questionId: 'correct'|'wrong'|'partial' }
let totalPoints = 0;

// ============================================================
// RENDER
// ============================================================
function startExam() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('examScreen').classList.add('active');
  renderQuestions();
}

function renderQuestions() {
  const body = document.getElementById('examBody');
  let html = '';

  questions.forEach((q, idx) => {
    if (q.id === 1) {
      html += `<div class="module-divider"><span>Първи модул — Въпроси 1–30</span></div>`;
    } else if (q.id === 31) {
      html += `<div class="module-divider"><span>Втори модул — Въпроси 31–40</span></div>`;
    } else if (q.id === 41) {
      html += `<div class="module-divider"><span>Втори модул — Задачи 41–50</span></div>`;
    }

    html += `<div class="q-card" id="qcard-${q.id}" data-qid="${q.id}">`;
    html += `<span class="q-number">${q.id}</span><span class="q-points">${q.points} т.</span>`;
    html += `<div class="q-text">${q.text}</div>`;

    if (q.type === 'mc') {
      html += `<div class="mc-options" id="opts-${q.id}">`;
      const letters = ['А', 'Б', 'В', 'Г'];
      q.options.forEach((opt, oi) => {
        html += `<div class="mc-opt" data-qid="${q.id}" data-oi="${oi}" onclick="selectOption(${q.id},${oi})">
          <div class="radio"></div><div>${letters[oi]}) ${opt}</div>
        </div>`;
      });
      html += `</div>`;
    } else if (q.type === 'fr') {
      q.parts.forEach((part, pi) => {
        html += `<div class="fr-part">
          <label>${part.label}</label>
          <input class="fr-input" id="fr-${q.id}-${pi}" type="text" placeholder="Вашият отговор" oninput="saveFR(${q.id},${pi},this.value)">
          <div class="fr-hint">${part.hint}</div>
        </div>`;
      });
    }

    html += `<button class="q-check-btn" id="check-${q.id}" onclick="checkQuestion(${q.id})">Провери</button>`;
    html += `<div class="q-feedback" id="fb-${q.id}"></div>`;

    if (q.explanation) {
      html += `<button class="explanation-toggle" id="exptoggle-${q.id}" style="display:none" onclick="toggleExplanation(${q.id})">📖 Обяснение</button>`;
      html += `<div class="explanation-body" id="exp-${q.id}">${q.explanation.replace(/\n/g, '<br>')}</div>`;
    }

    html += `</div>`;
  });

  // Remove duplicate module dividers
  body.innerHTML = html;
}

// ============================================================
// INTERACTIONS
// ============================================================
function selectOption(qid, oi) {
  if (checked[qid]) return;
  answers[qid] = oi;
  const opts = document.querySelectorAll(`#opts-${qid} .mc-opt`);
  opts.forEach(o => o.classList.remove('selected'));
  opts[oi].classList.add('selected');
}

function saveFR(qid, pi, val) {
  if (!answers[qid]) answers[qid] = {};
  answers[qid][pi] = val.trim();
}

function checkQuestion(qid) {
  if (checked[qid]) return;
  const q = questions.find(x => x.id === qid);
  const fb = document.getElementById(`fb-${qid}`);
  const card = document.getElementById(`qcard-${qid}`);
  const btn = document.getElementById(`check-${qid}`);

  if (q.type === 'mc') {
    if (answers[qid] === undefined) {
      fb.className = 'q-feedback show wrong';
      fb.textContent = 'Моля, изберете отговор.';
      return;
    }
    checked[qid] = true;
    const opts = document.querySelectorAll(`#opts-${qid} .mc-opt`);
    opts.forEach(o => o.classList.add('locked'));

    if (answers[qid] === q.correct) {
      opts[q.correct].classList.add('correct-opt');
      fb.className = 'q-feedback show correct';
      fb.textContent = `✅ Верен отговор! (+${q.points} т.)`;
      card.classList.add('answered-correct');
      results[qid] = 'correct';
      totalPoints += q.points;
    } else {
      opts[answers[qid]].classList.add('wrong-opt');
      opts[q.correct].classList.add('correct-opt');
      fb.className = 'q-feedback show wrong';
      const letters = ['А', 'Б', 'В', 'Г'];
      fb.textContent = `❌ Грешен. Верен отговор: ${letters[q.correct]}) ${q.options[q.correct]}`;
      card.classList.add('answered-wrong');
      results[qid] = 'wrong';
    }
  } else if (q.type === 'fr') {
    if (!answers[qid] || Object.keys(answers[qid]).length === 0) {
      fb.className = 'q-feedback show wrong';
      fb.textContent = 'Моля, попълнете поне един отговор.';
      return;
    }
    checked[qid] = true;
    let correctCount = 0;
    q.parts.forEach((part, pi) => {
      const input = document.getElementById(`fr-${qid}-${pi}`);
      const userVal = (answers[qid][pi] || '').toLowerCase().replace(/\s/g, '').replace(',', '.');
      const correctVal = part.answer.toLowerCase().replace(/\s/g, '').replace(',', '.');
      if (userVal === correctVal) {
        input.classList.add('correct-input');
        correctCount++;
      } else {
        input.classList.add('wrong-input');
      }
      input.readOnly = true;
    });
    const partPts = q.points / q.parts.length;
    const earned = Math.round(correctCount * partPts * 100) / 100;
    totalPoints += earned;
    if (correctCount === q.parts.length) {
      fb.className = 'q-feedback show correct';
      fb.textContent = `✅ Всички отговори са верни! (+${earned} т.)`;
      card.classList.add('answered-correct');
      results[qid] = 'correct';
    } else if (correctCount > 0) {
      fb.className = 'q-feedback show info';
      fb.textContent = `⚡ ${correctCount}/${q.parts.length} верни. (+${earned} т.)`;
      card.classList.add('answered-wrong');
      results[qid] = 'partial';
    } else {
      fb.className = 'q-feedback show wrong';
      fb.textContent = `❌ Нито един верен отговор.`;
      card.classList.add('answered-wrong');
      results[qid] = 'wrong';
    }
  }

  btn.disabled = true;
  btn.textContent = 'Проверено ✓';

  // Show explanation toggle
  const exptog = document.getElementById(`exptoggle-${qid}`);
  if (exptog) exptog.style.display = 'inline-block';

  updateProgress();
}

function toggleExplanation(qid) {
  const exp = document.getElementById(`exp-${qid}`);
  exp.classList.toggle('show');
  const btn = document.getElementById(`exptoggle-${qid}`);
  btn.textContent = exp.classList.contains('show') ? '📖 Скрий обяснение' : '📖 Обяснение';
}

function updateProgress() {
  const answered = Object.keys(checked).length;
  const pct = (answered / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${answered}/${questions.length}`;
  document.getElementById('liveScore').textContent = Math.round(totalPoints * 10) / 10;
}

function scrollToUnanswered() {
  for (const q of questions) {
    if (!checked[q.id]) {
      document.getElementById(`qcard-${q.id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  }
  // All answered
  finishExam();
}

// ============================================================
// FINISH & RESULTS
// ============================================================
function finishExam() {
  if (!confirm('Сигурни ли сте, че искате да предадете изпита?')) return;

  // Auto-check unchecked questions
  questions.forEach(q => {
    if (!checked[q.id]) {
      checked[q.id] = true;
      const fb = document.getElementById(`fb-${q.id}`);
      const card = document.getElementById(`qcard-${q.id}`);
      const btn = document.getElementById(`check-${q.id}`);

      if (q.type === 'mc') {
        const opts = document.querySelectorAll(`#opts-${q.id} .mc-opt`);
        opts.forEach(o => o.classList.add('locked'));
        opts[q.correct].classList.add('correct-opt');
        if (answers[q.id] !== undefined) {
          if (answers[q.id] === q.correct) {
            results[q.id] = 'correct';
            totalPoints += q.points;
            opts[q.correct].classList.add('correct-opt');
            fb.className = 'q-feedback show correct';
            fb.textContent = `✅ Верен отговор! (+${q.points} т.)`;
            card.classList.add('answered-correct');
          } else {
            results[q.id] = 'wrong';
            opts[answers[q.id]].classList.add('wrong-opt');
            const letters = ['А', 'Б', 'В', 'Г'];
            fb.className = 'q-feedback show wrong';
            fb.textContent = `❌ Верен: ${letters[q.correct]})`;
            card.classList.add('answered-wrong');
          }
        } else {
          results[q.id] = 'skipped';
          fb.className = 'q-feedback show wrong';
          fb.textContent = `⏭ Без отговор. Верен: ${['А','Б','В','Г'][q.correct]})`;
          card.classList.add('answered-wrong');
        }
      } else {
        // FR — mark as skipped if empty
        let correctCount = 0;
        q.parts.forEach((part, pi) => {
          const input = document.getElementById(`fr-${q.id}-${pi}`);
          const userVal = (answers[q.id]?.[pi] || '').toLowerCase().replace(/\s/g,'').replace(',','.');
          const correctVal = part.answer.toLowerCase().replace(/\s/g,'').replace(',','.');
          if (userVal === correctVal) { input.classList.add('correct-input'); correctCount++; }
          else { input.classList.add('wrong-input'); }
          input.readOnly = true;
        });
        const partPts = q.points / q.parts.length;
        const earned = Math.round(correctCount * partPts * 100) / 100;
        totalPoints += earned;
        results[q.id] = correctCount === q.parts.length ? 'correct' : (correctCount > 0 ? 'partial' : (answers[q.id] ? 'wrong' : 'skipped'));
        fb.className = 'q-feedback show ' + (correctCount === q.parts.length ? 'correct' : 'wrong');
        fb.textContent = correctCount > 0 ? `${correctCount}/${q.parts.length} верни (+${earned} т.)` : 'Без верен отговор.';
        card.classList.add(correctCount === q.parts.length ? 'answered-correct' : 'answered-wrong');
      }

      btn.disabled = true;
      btn.textContent = 'Проверено ✓';
      const exptog = document.getElementById(`exptoggle-${q.id}`);
      if (exptog) exptog.style.display = 'inline-block';
    }
  });

  updateProgress();
  showResults();
}

function showResults() {
  document.getElementById('examScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');

  const final = Math.round(totalPoints * 10) / 10;
  document.getElementById('finalScore').textContent = final;

  let correctCount = 0, wrongCount = 0, skippedCount = 0;
  questions.forEach(q => {
    const r = results[q.id];
    if (r === 'correct') correctCount++;
    else if (r === 'skipped') skippedCount++;
    else wrongCount++;
  });

  document.getElementById('resCorrect').textContent = correctCount;
  document.getElementById('resWrong').textContent = wrongCount;
  document.getElementById('resSkipped').textContent = skippedCount;

  // Grade
  const pct = final / 100 * 100;
  let grade = '';
  if (pct >= 90) grade = '🏆 Отличен (6)';
  else if (pct >= 75) grade = '🎯 Много добър (5)';
  else if (pct >= 60) grade = '👍 Добър (4)';
  else if (pct >= 50) grade = '📝 Среден (3)';
  else grade = '📕 Слаб (2)';

  document.getElementById('gradeText').textContent = `${final} точки от 100`;
  document.getElementById('gradeSub').textContent = grade;

  // Nav grid
  let navHtml = '<div class="nav-grid">';
  questions.forEach(q => {
    const r = results[q.id] || '';
    let cls = '';
    if (r === 'correct') cls = 'dot-correct';
    else if (r === 'wrong' || r === 'partial') cls = 'dot-wrong';
    else cls = '';
    navHtml += `<div class="nav-dot ${cls}" onclick="reviewAndScroll(${q.id})">${q.id}</div>`;
  });
  navHtml += '</div>';
  document.getElementById('navGridResults').innerHTML = navHtml;
}

function reviewExam() {
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('examScreen').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reviewAndScroll(qid) {
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('examScreen').classList.add('active');
  setTimeout(() => {
    document.getElementById(`qcard-${qid}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function restartExam() {
  if (!confirm('Наистина ли искате да започнете отново?')) return;
  answers = {};
  checked = {};
  results = {};
  totalPoints = 0;
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('examScreen').classList.remove('active');
  document.getElementById('startScreen').style.display = 'flex';
  document.getElementById('examBody').innerHTML = '';
  updateProgress();
}

// Remove duplicate module dividers on render
document.addEventListener('DOMContentLoaded', () => {
  // Ready
});
</script>
