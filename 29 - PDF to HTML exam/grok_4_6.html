<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#1f4b45"/>
  <title>Матура Физика 2018</title>
  <style>
:root {
  --bg: #f3efe6;
  --bg-sunken: #e7e0d2;
  --surface: #fffcf6;
  --surface-2: #f6f0e4;
  --ink: #1c1915;
  --ink-soft: #3f3a33;
  --muted: #6f675c;
  --faint: #9a9286;
  --line: #ddd4c6;
  --line-strong: #c9bdaa;
  --pine: #1f4b45;
  --pine-hover: #173b36;
  --pine-fg: #f4f1ea;
  --pine-tint: #e4eeec;
  --correct: #1f6b45;
  --correct-bg: #e4f2ea;
  --wrong: #a32d2d;
  --wrong-bg: #f8e7e5;
  --warn: #8a5a12;
  --warn-bg: #f4ead3;
  --radius: 14px;
  --shadow: 0 0 0 1px rgba(28,25,21,.05), 0 1px 2px rgba(28,25,21,.04), 0 12px 28px -16px rgba(28,25,21,.18);
  --ease: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100dvh; }
body {
  font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 12% -10%, rgba(31,75,69,.06), transparent 55%),
    radial-gradient(900px 420px at 110% 0%, rgba(138,90,18,.05), transparent 50%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3 { font-family: "Fraunces", "Iowan Old Style", "Times New Roman", serif; text-wrap: balance; margin: 0; }
button { font: inherit; }
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 80px; }
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
}
.kicker {
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--pine); font-weight: 600;
}
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
.grid2 { display: grid; gap: 10px; }
@media (min-width: 640px) { .grid2.cols { grid-template-columns: 1fr 1fr; } }
.choice, .seg, .btn, .iconbtn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 12px;
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  transition: transform .15s var(--ease), background .15s, border-color .15s, box-shadow .15s;
}
.choice:hover, .seg:hover, .iconbtn:hover { border-color: var(--line-strong); }
.choice:disabled { cursor: default; }
.choice.selected { border-color: var(--pine); background: var(--pine-tint); box-shadow: 0 0 0 1px var(--pine); }
.choice.ok { border-color: var(--correct); background: var(--correct-bg); }
.choice.bad { border-color: var(--wrong); background: var(--wrong-bg); }
.choice.miss { border-color: var(--correct); background: var(--correct-bg); outline: 2px dashed var(--correct); }
.seg.on { background: var(--pine); color: var(--pine-fg); border-color: var(--pine); }
.btn.primary { background: var(--pine); color: var(--pine-fg); border-color: var(--pine); font-weight: 600; }
.btn.primary:hover { background: var(--pine-hover); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.letter {
  display: inline-flex; width: 26px; height: 26px; border-radius: 8px;
  align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
  background: var(--surface-2); margin-right: 10px; flex-shrink: 0;
}
.choice.selected .letter { background: var(--pine); color: var(--pine-fg); }
.choice.ok .letter { background: var(--correct); color: #fff; }
.choice.bad .letter { background: var(--wrong); color: #fff; }
header.bar {
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid var(--line);
}
.bar-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
.progress { height: 4px; background: var(--bg-sunken); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--pine); width: 0; transition: width .3s var(--ease); }
.qnav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
@media (min-width: 900px) { .qnav { grid-template-columns: repeat(10, 1fr); } }
.qnav button {
  height: 36px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer;
}
.qnav button.cur { outline: 2px solid var(--pine); background: var(--pine-tint); }
.qnav button.done { background: var(--pine); color: var(--pine-fg); border-color: var(--pine); }
.qnav button.flag { box-shadow: inset 0 -3px 0 var(--warn); }
.qnav button.ok { background: var(--correct); color: #fff; border-color: var(--correct); }
.qnav button.bad { background: var(--wrong); color: #fff; border-color: var(--wrong); }
.figure { background: var(--surface-2); border-radius: 12px; padding: 8px; overflow: hidden; }
.figure svg { width: 100%; height: auto; display: block; }
.explain { background: var(--warn-bg); color: var(--ink-soft); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
.explain.ok { background: var(--correct-bg); }
.explain.bad { background: var(--wrong-bg); }
.part { padding: 12px 0; border-top: 1px solid var(--line); }
.part:first-child { border-top: 0; padding-top: 0; }
input[type=text], select {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font: inherit; color: inherit;
}
input[type=text]:focus, select:focus { outline: 2px solid var(--pine); border-color: var(--pine); }
.unit { color: var(--muted); font-size: 13px; margin-left: 8px; }
.foot {
  position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 10px 16px; display: flex; gap: 10px; align-items: center;
}
.modal {
  position: fixed; inset: 0; background: rgba(28,25,21,.38);
  display: grid; place-items: center; padding: 16px; z-index: 50;
}
.modal .card { max-width: 420px; width: 100%; }
.grade {
  font-family: "Fraunces", serif; font-size: 64px; line-height: 1; color: var(--pine);
}
.hidden { display: none !important; }
.fade { animation: fade .28s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.switch {
  width: 44px; height: 26px; border-radius: 99px; background: var(--line-strong);
  border: 0; position: relative; cursor: pointer; padding: 0;
}
.switch i {
  position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; transition: left .2s var(--ease);
}
.switch.on { background: var(--pine); }
.switch.on i { left: 21px; }
sup { font-size: .7em; }
sub { font-size: .75em; }
.math { font-family: "Iowan Old Style", "Times New Roman", serif; font-style: italic; }
.scorepill { font-size: 13px; color: var(--muted); }
.topic { font-size: 12px; color: var(--pine); font-weight: 600; }
.hero { padding-top: 28px; }
.hero h1 { font-size: clamp(28px, 5vw, 42px); margin: 8px 0 10px; }
.optgrid { display: grid; gap: 8px; }
@media (min-width: 560px) { .optgrid.two { grid-template-columns: 1fr 1fr; } }
.listq { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.listq button {
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
  width: 100%;
}
.kbd { font-size: 11px; color: var(--faint); }
@media (max-width: 640px) {
  .hide-sm { display: none !important; }
  .choice { padding: 10px 12px; }
}

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
const QUESTIONS = [{"id":1,"module":1,"kind":"mcq","points":1.5,"topic":"Електростатика","stem":"Два електрични точкови заряда се намират във вакуум на разстояние $r$ един от друг. Как ще се промени силата $F$ на тяхното взаимодействие, ако разстоянието между тях се увеличи два пъти?","choices":[{"id":"A","text":"ще намалее два пъти"},{"id":"B","text":"ще намалее четири пъти"},{"id":"C","text":"ще намалее осем пъти"},{"id":"D","text":"ще се увеличи два пъти"}],"correct":"B","explanation":"Закон на Кулон: $F = k\\frac{q_1 q_2}{r^2}$. Ако разстоянието стане $2r$, знаменателят нараства 4 пъти и силата намалява 4 пъти."},{"id":2,"module":1,"kind":"mcq","points":1.5,"topic":"Електростатика","stem":"На коя фигура са показани силовите линии на електростатично поле, създадено от положителен точков заряд $q$?","choices":[{"id":"A","figure":"q2a"},{"id":"B","figure":"q2b"},{"id":"C","figure":"q2c"},{"id":"D","figure":"q2d"}],"correct":"A","explanation":"Силовите линии на положителен точков заряд започват от заряда и са радиални лъчи навън. Концентричните окръжности са еквипотенциални линии, а успоредните линии описват хомогенно поле."},{"id":3,"module":1,"kind":"mcq","points":1.5,"topic":"Електростатика","stem":"Електростатично поле е създадено от заряд $Q$. Сравнете интензитета $E$ на полето в точките $A$, $B$ и $C$ от фигурата.","figure":"q3","choices":[{"id":"A","text":"$E_A > E_B = E_C$"},{"id":"B","text":"$E_A < E_B = E_C$"},{"id":"C","text":"$E_A = E_B > E_C$"},{"id":"D","text":"$E_A > E_B > E_C$"}],"correct":"C","explanation":"Интензитетът на полето на точков заряд е $E = k\\frac{Q}{r^2}$ и зависи само от разстоянието до $Q$. Точки $A$ и $B$ лежат на една окръжност (еднакво $r$), а $C$ е по-далеч, затова $E_A = E_B > E_C$."},{"id":4,"module":1,"kind":"mcq","points":1.5,"topic":"Електростатика","stem":"Точков заряд $q$ се намира в електростатично поле. Ако знаем големината $q$ на заряда и интензитета $E$ на полето в точката, в която се намира зарядът, можем да намерим:","choices":[{"id":"A","text":"скоростта $v$ на заряда, с която той преминава през тази точка"},{"id":"B","text":"големината на силата $F$, с която полето действа на заряда"},{"id":"C","text":"кинетичната енергия на заряда в тази точка"},{"id":"D","text":"потенциалната енергия на заряда в тази точка"}],"correct":"B","explanation":"По определение $F = qE$. Скоростта, кинетичната и потенциалната енергия изискват допълнителни данни (маса, потенциал, история на движението)."},{"id":5,"module":1,"kind":"mcq","points":1.5,"topic":"Електростатика","stem":"С явлението електростатична индукция се обяснява:","choices":[{"id":"A","text":"полярното сияние"},{"id":"B","text":"небесната дъга"},{"id":"C","text":"привличането на железни стружки от магнит"},{"id":"D","text":"електростатичното екраниране"}],"correct":"D","explanation":"При електростатична индукция свободните заряди в проводник се преразпределят. Във вътрешността на кух проводник полето се компенсира — това е електростатичното екраниране. Полярното сияние е свързано с магнитосферата, дъгата — с дисперсия, а железните стружки — с магнетизъм."},{"id":6,"module":1,"kind":"mcq","points":1.5,"topic":"Електричен ток","stem":"Зарядите, които се придвижват свободно в металите, са:","choices":[{"id":"A","text":"електрони"},{"id":"B","text":"дупки"},{"id":"C","text":"положителни йони"},{"id":"D","text":"отрицателни йони"}],"correct":"A","explanation":"В металната кристална решетка валентните електрони са делокализирани и образуват електронен газ. Йоните на решетката са почти неподвижни; дупките са носители в полупроводници."},{"id":7,"module":1,"kind":"mcq","points":1.5,"topic":"Електричен ток","stem":"Коя от посочените измерителни единици е за електричен ток?","choices":[{"id":"A","text":"kV"},{"id":"B","text":"MΩ"},{"id":"C","text":"mA"},{"id":"D","text":"W"}],"correct":"C","explanation":"Амперът (A) е единицата за ток; mA е производна. kV е напрежение, MΩ — съпротивление, W — мощност."},{"id":8,"module":1,"kind":"mcq","points":1.5,"topic":"Електричен ток","stem":"Меден проводник има два пъти по-малка дължина и два пъти по-голям диаметър на кръговото си сечение от друг меден проводник. Кое от твърденията е вярно?","choices":[{"id":"A","text":"Двата проводника имат едно и също специфично съпротивление."},{"id":"B","text":"Двата проводника имат едно и също съпротивление."},{"id":"C","text":"Двата проводника имат един и същ обем."},{"id":"D","text":"Двата проводника имат една и съща маса."}],"correct":"A","explanation":"Специфичното съпротивление $\\rho$ е свойство на веществото (мед) и не зависи от размерите. Съпротивлението $R = \\rho L/S$ се променя: $L$ намалява 2 пъти, а сечението нараства 4 пъти, затова $R$ намалява 8 пъти. Обемът и масата също се променят."},{"id":9,"module":1,"kind":"mcq","points":1.5,"topic":"Електричен ток","stem":"Върху резистор със съпротивление $R = 100\\,\\Omega$ се подава напрежение $U = 5\\,\\mathrm{V}$ в продължение на време $t = 4\\,\\mathrm{h}$. Колко джаула е консумираната от него електрична енергия за това време?","choices":[{"id":"A","text":"1 J"},{"id":"B","text":"1800 J"},{"id":"C","text":"2000 J"},{"id":"D","text":"3,6 kJ"}],"correct":"D","explanation":"$W = \\frac{U^2}{R}t = \\frac{25}{100}\\cdot 4\\cdot 3600 = 0{,}25\\cdot 14\\,400 = 3600\\,\\mathrm{J} = 3{,}6\\,\\mathrm{kJ}$."},{"id":10,"module":1,"kind":"mcq","points":1.5,"topic":"Електричен ток","stem":"По време на „запалване“ на двигател на автомобил през стартера му тече ток $I = 400\\,\\mathrm{A}$. Напрежението на акумулатора му е $U = 12\\,\\mathrm{V}$. Колко е съпротивлението на веригата, съставена от акумулатора и стартера?","choices":[{"id":"A","text":"0,003 Ω"},{"id":"B","text":"0,03 Ω"},{"id":"C","text":"3,33 Ω"},{"id":"D","text":"33,3 Ω"}],"correct":"B","explanation":"От закона на Ом $R = U/I = 12/400 = 0{,}03\\,\\Omega$."},{"id":11,"module":1,"kind":"mcq","points":1.5,"topic":"Електричен ток","stem":"Посочете приложението, което **НЕ** се отнася за явлението електролиза.","choices":[{"id":"A","text":"получаване на чисти метали"},{"id":"B","text":"нанасяне на метални покрития върху предмети"},{"id":"C","text":"изработване на копия на грамофонни плочи, скулптури и др."},{"id":"D","text":"получаване на електричен ток от слънчеви батерии"}],"correct":"D","explanation":"Електролизата е разлагане на вещество под действие на ток (получаване на метали, галванопластика, копия). Слънчевите батерии използват фотоволтаичния ефект, не електролиза."},{"id":12,"module":1,"kind":"mcq","points":1.5,"topic":"Магнетизъм","stem":"Кой от изброените обекти е източник на магнитно поле?","choices":[{"id":"A","text":"неподвижен точков заряд"},{"id":"B","text":"литиево-йонна батерия"},{"id":"C","text":"меден проводник с формата на подкова"},{"id":"D","text":"кръгов проводник, по който тече електричен ток"}],"correct":"D","explanation":"Магнитно поле създават движещи се заряди (токове) и постоянни магнити. Неподвижен заряд и изключена батерия не създават магнитно поле; медната подкова без ток също не е магнит."},{"id":13,"module":1,"kind":"mcq","points":1.5,"topic":"Магнетизъм","stem":"По хоризонтален проводник тече електричен ток, насочен надясно (виж фигурата). Проводникът се намира в еднородно магнитно поле, чиито силови линии са вертикални и насочени нагоре. Определете посоката на максималната сила, с която магнитното поле действа на проводника.","figure":"q13","choices":[{"id":"A","text":"от чертежа към вас (⊙)"},{"id":"B","text":"от вас към чертежа (⊗)"},{"id":"C","text":"нагоре ↑"},{"id":"D","text":"надолу ↓"}],"correct":"A","explanation":"Силата е $\\vec F = I\\,\\vec l \\times \\vec B$. С правилото на дясната ръка: пръстите от $\\vec I$ (надясно) към $\\vec B$ (нагоре) — палецът сочи към нас, извън чертежа."},{"id":14,"module":1,"kind":"mcq","points":1.5,"topic":"Магнетизъм","stem":"Силата $F$, с която еднородно (хомогенно) магнитно поле с индукция $B$ действа на праволинеен проводник с дължина $l$, по който тече ток $I$, и който е перпендикулярен на магнитните силови линии на полето, се пресмята по формулата:","choices":[{"id":"A","text":"$F = B \\cdot l \\cdot I$"},{"id":"B","text":"$F = I^2 \\cdot B \\cdot l$"},{"id":"C","text":"$F = \\frac{I \\cdot l}{B}$"},{"id":"D","text":"$F = I \\cdot B^2 \\cdot l$"}],"correct":"A","explanation":"За $\\vec l \\perp \\vec B$ формулата е $F = IBl$."},{"id":15,"module":1,"kind":"mcq","points":1.5,"topic":"Електромагнитна индукция","stem":"При кой от опитите **НЕ** се индуцира ток в металния пръстен?","choices":[{"id":"A","text":"магнитът се движи към металния пръстен","figure":"q15a"},{"id":"B","text":"металният пръстен се движи към магнита","figure":"q15b"},{"id":"C","text":"металният пръстен навлиза в областта на еднородно магнитно поле, така че равнината му е перпендикулярна на магнитните индукционни линии","figure":"q15c"},{"id":"D","text":"металният пръстен се движи в еднородно магнитно поле","figure":"q15d"}],"correct":"D","explanation":"Индуциран ток има само при промяна на магнитния поток през пръстена. В еднородно поле при движение на пръстена (без въртене и без промяна на площта) потокът $\\Phi = BS$ е постоянен. В А–В магнитът/пръстенът сближават полето; във В пръстенът навлиза в полето и потокът расте."},{"id":16,"module":1,"kind":"mcq","points":1.5,"topic":"Променлив ток","stem":"Колко секунди е периодът на променлив ток с честота $\\nu = 50\\,\\mathrm{Hz}$?","choices":[{"id":"A","text":"0,002 s"},{"id":"B","text":"0,02 s"},{"id":"C","text":"0,2 s"},{"id":"D","text":"50 s"}],"correct":"B","explanation":"$T = 1/\\nu = 1/50 = 0{,}02\\,\\mathrm{s}$."},{"id":17,"module":1,"kind":"mcq","points":1.5,"topic":"Променлив ток","stem":"Електрически предпазител трябва да ограничава консумацията на електрична мощност в една кухня до $4400\\,\\mathrm{W}$. Напрежението е с ефективна стойност $U_{еф} = 220\\,\\mathrm{V}$. При каква ефективна стойност на тока $I_{еф}$, протичащ през предпазителя, се прекъсва веригата?","choices":[{"id":"A","text":"20 C"},{"id":"B","text":"20 A"},{"id":"C","text":"20 J"},{"id":"D","text":"10 A"}],"correct":"B","explanation":"$P = U_{еф} I_{еф}$ $\\Rightarrow$ $I_{еф} = P/U_{еф} = 4400/220 = 20\\,\\mathrm{A}$. Единицата за ток е ампер, не кулон или джаул."},{"id":18,"module":1,"kind":"mcq","points":1.5,"topic":"Трептения","stem":"Периодът на хармонично трептене на математично махало **НЕ** зависи от:","choices":[{"id":"A","text":"дължината на нишката"},{"id":"B","text":"земното ускорение"},{"id":"C","text":"масата на тялото, закачено за нишката"},{"id":"D","text":"отношението на дължината на нишката и земното ускорение"}],"correct":"C","explanation":"$T = 2\\pi\\sqrt{l/g}$. Периодът зависи от $l$ и $g$ (и от $l/g$), но не и от масата $m$."},{"id":19,"module":1,"kind":"mcq","points":1.5,"topic":"Трептения","stem":"На фигурата е показана графика на зависимостта на положението $x$ на тяло, извършващо хармонично трептене, от времето $t$. Кое от твърденията за това трептене е вярно?","figure":"q19","choices":[{"id":"A","text":"Честотата му е 0,2 Hz."},{"id":"B","text":"Периодът му е 1,25 s."},{"id":"C","text":"Амплитудата му е 8 cm."},{"id":"D","text":"Равновесното положение на тялото е при $x = 5\\,\\mathrm{cm}$."}],"correct":"D","explanation":"Графиката осцилира между 2 cm и 8 cm, следователно равновесието е по средата: $x_0 = 5\\,\\mathrm{cm}$, амплитудата е 3 cm. Един пълен цикъл е около 3 s, честотата $\\approx 0{,}33\\,\\mathrm{Hz}$ — не 0,2 Hz."},{"id":20,"module":1,"kind":"mcq","points":1.5,"topic":"Трептения","stem":"Механичен резонанс може да се наблюдава, когато на дадено трептящо тяло действа периодична външна сила с:","choices":[{"id":"A","text":"много голяма честота"},{"id":"B","text":"много малка честота"},{"id":"C","text":"честота, близка или равна на собствената честота на тялото"},{"id":"D","text":"голяма амплитуда"}],"correct":"C","explanation":"Резонанс настъпва, когато честотата на външната сила е близка или равна на собствената честота. Тогава амплитудата нараства силно."},{"id":21,"module":1,"kind":"mcq","points":1.5,"topic":"Вълни","stem":"Коя от изброените характеристики **НЕ** се отнася за хармонична вълна?","choices":[{"id":"A","text":"период"},{"id":"B","text":"скорост на разпространение"},{"id":"C","text":"дължина на вълната"},{"id":"D","text":"спектър на вълната"}],"correct":"D","explanation":"Хармоничната вълна е монохроматична — описва се с период, честота, дължина и скорост. Спектър се въвежда за сложни (нехармонични) вълни като разложение по хармоници."},{"id":22,"module":1,"kind":"mcq","points":1.5,"topic":"Звук","stem":"Подредете средите по нарастването на скоростта на звука в тях (от най-малка към най-голяма скорост).","choices":[{"id":"A","text":"въздух, вода, стомана"},{"id":"B","text":"стомана, вода, въздух"},{"id":"C","text":"вода, въздух, стомана"},{"id":"D","text":"вода, стомана, въздух"}],"correct":"A","explanation":"Звукът е най-бавен в газове, по-бърз в течности и най-бърз в твърди тела: въздух (~340 m/s) < вода (~1500 m/s) < стомана (~5000 m/s)."},{"id":23,"module":1,"kind":"mcq","points":1.5,"topic":"Звук","stem":"За разбиване на камъни в бъбреците в медицината се използват:","choices":[{"id":"A","text":"инфразвукови вълни"},{"id":"B","text":"ултразвукови вълни"},{"id":"C","text":"радиовълни"},{"id":"D","text":"рентгенови лъчи"}],"correct":"B","explanation":"Литотрипсията използва фокусиран ултразвук. Инфразвукът не се прилага така; рентгенът е за образна диагностика, радиовълните — за връзка и ЯМР."},{"id":24,"module":1,"kind":"mcq","points":1.5,"topic":"Вълни","stem":"Кои вълни **НЕ** могат да се разпространяват във вакуум?","choices":[{"id":"A","text":"гама лъчите"},{"id":"B","text":"рентгеновите лъчи"},{"id":"C","text":"инфразвукови вълни"},{"id":"D","text":"микровълните"}],"correct":"C","explanation":"Инфразвукът е механична вълна и се нуждае от среда. Гама, рентген и микровълни са електромагнитни и се разпространяват във вакуум."},{"id":25,"module":1,"kind":"mcq","points":1.5,"topic":"Оптика","stem":"Светлинен лъч пада върху плоскопаралелна стъклена пластина, намираща се във въздух, и излиза от противоположната ѝ страна. Кой от изобразените лъчи от 1 до 4 е начертан правилно?","figure":"q25","choices":[{"id":"A","text":"1"},{"id":"B","text":"2"},{"id":"C","text":"3"},{"id":"D","text":"4"}],"correct":"A","explanation":"При преминаване през плоскопаралелна пластина лъчът се измества успоредно на първоначалната си посока (не се пречупва към нормалата на изхода така, че да се отклони като 2–4). Изходният лъч е успореден на падащия — лъч 1."},{"id":26,"module":1,"kind":"mcq","points":1.5,"topic":"Оптика","stem":"Светлинна вълна преминава от въздух (1) в диамант (2). Посочете правилното съотношение между показателите на пречупване и скоростите на разпространение в двете среди.","choices":[{"id":"A","text":"$n_1 > n_2$  ;  $u_1 > u_2$"},{"id":"B","text":"$n_1 > n_2$  ;  $u_1 < u_2$"},{"id":"C","text":"$n_1 < n_2$  ;  $u_1 = u_2$"},{"id":"D","text":"$n_1 < n_2$  ;  $u_1 > u_2$"}],"correct":"D","explanation":"Диамантът е оптично по-плътен: $n_2 > n_1$. Тъй като $n = c/u$, по-големият показател означава по-малка скорост: $u_2 < u_1$."},{"id":27,"module":1,"kind":"mcq","points":1.5,"topic":"Оптика","stem":"Светлинен лъч пада под ъгъл $\\alpha$ на границата между вода и въздух. С $\\alpha_{гр}$ е означен граничният ъгъл за тези две среди. За да се наблюдава пълно вътрешно отражение е необходимо да е изпълнено:","choices":[{"id":"A","text":"$\\alpha < \\alpha_{гр}$"},{"id":"B","text":"$\\alpha \\le \\alpha_{гр}$"},{"id":"C","text":"$\\alpha > \\alpha_{гр}$"},{"id":"D","text":"$\\alpha = \\alpha_{гр}$"}],"correct":"C","explanation":"Пълно вътрешно отражение настъпва при падане от оптично по-плътна към по-рядка среда и ъгъл на падане **по-голям** от граничния. При $\\alpha = \\alpha_{гр}$ пречупеният лъч се плъзга по границата."},{"id":28,"module":1,"kind":"mcq","points":1.5,"topic":"Оптика","stem":"Кое явление **НЕ** се обяснява с дисперсия на светлината?","choices":[{"id":"A","text":"появата на небесна дъга след дъжд"},{"id":"B","text":"разлагане на бяла светлина, преминаваща през стъклена призма"},{"id":"C","text":"наблюдаването на цветни ивици по компакт-диск от страната на записа"},{"id":"D","text":"наблюдаване на цветни отблясъци от кристален полилей или шлифован диамант"}],"correct":"C","explanation":"Цветовете върху CD са резултат от дифракция/интерференция върху периодичната структура на записа, не от дисперсия. Дъгата, призмата и блясъкът на кристал се дължат на зависимостта $n(\\lambda)$."},{"id":29,"module":1,"kind":"mcq","points":1.5,"topic":"Електромагнитен спектър","stem":"Посочете вярното твърдение.","choices":[{"id":"A","text":"Слънцето не излъчва ултравиолетови лъчи."},{"id":"B","text":"Инфрачервените лъчи имат по-малка дължина на вълната от ултравиолетовите лъчи."},{"id":"C","text":"Човек не усеща падащите върху тялото му инфрачервени лъчи."},{"id":"D","text":"Ултравиолетовите лъчи се поглъщат силно от озоновия слой в атмосферата на Земята."}],"correct":"D","explanation":"Озоновият слой поглъща голяма част от слънчевия UV. Слънцето излъчва UV; ИЧ имат по-голяма $\\lambda$ от UV; ИЧ се усещат като топлина."},{"id":30,"module":1,"kind":"mcq","points":1.5,"topic":"Топлинно излъчване","stem":"Коя формула изразява закон, описващ излъчването на абсолютно черно тяло?","choices":[{"id":"A","text":"$c = \\lambda\\nu$"},{"id":"B","text":"$h\\nu = A + \\frac{1}{2}mv_{max}^2$"},{"id":"C","text":"$P = \\sigma S T^4$"},{"id":"D","text":"$\\lambda_B = \\frac{h}{mv}$"}],"correct":"C","explanation":"Закон на Стефан–Болцман: мощността на излъчване на абсолютно черно тяло е $P = \\sigma S T^4$. А е връзката $c=\\lambda\\nu$, Б — уравнението на Айнщайн за фотоефекта, Г — дължина на вълната на дьо Бройл."},{"id":31,"module":2,"kind":"mcq","points":1.5,"topic":"Квантова физика","stem":"Кой проблем в историята на физиката е довел до хипотезата на Планк, че светлината се излъчва на кванти?","choices":[{"id":"A","text":"обясняването на спектъра на излъчване на абсолютно черно тяло"},{"id":"B","text":"обясняването на електромагнитната природа на светлината"},{"id":"C","text":"обясняването на явлението електромагнитна индукция"},{"id":"D","text":"обясняването на законите на фотоефекта"}],"correct":"A","explanation":"Класическата физика дава „ултравиолетовата катастрофа“ за спектъра на абсолютното черно тяло. Планк въвежда квантите на енергията $E = h\\nu$, за да възпроизведе експерименталната крива. Законите на фотоефекта са обяснени по-късно от Айнщайн."},{"id":32,"module":2,"kind":"mcq","points":1.5,"topic":"Атомна физика","stem":"При кой преход на електрон във водороден атом излъченият фотон има най-голяма дължина на вълната?","figure":"q32","choices":[{"id":"A","text":"от ниво $n = 2$ на ниво $n = 1$"},{"id":"B","text":"от ниво $n = 4$ на ниво $n = 3$"},{"id":"C","text":"от ниво $n = 4$ на ниво $n = 2$"},{"id":"D","text":"от ниво $n = 3$ на ниво $n = 1$"}],"correct":"B","explanation":"Енергията на фотона е $\\Delta E = |E_n - E_m|$, а $\\lambda = hc/\\Delta E$. Най-малката енергетична разлика е между близки високи нива — преходът $4 \\to 3$. Преходите към $n=1$ са в UV (серия на Лайман) и имат къса $\\lambda$."},{"id":33,"module":2,"kind":"mcq","points":1.5,"topic":"Атомна физика","stem":"Водородният атом има преходи:","choices":[{"id":"A","text":"в ултравиолетовата и видимата, но не и в инфрачервената област на оптичния спектър"},{"id":"B","text":"в ултравиолетовата, видимата и инфрачервената област на оптичния спектър"},{"id":"C","text":"във видимата, но не и в инфрачервената и ултравиолетовата област на оптичния спектър"},{"id":"D","text":"във видимата и инфрачервената, но не и в ултравиолетовата област на оптичния спектър"}],"correct":"B","explanation":"Серия на Лайман — UV ($n \\to 1$), на Балмер — видима ($n \\to 2$), на Пашен и следващите — инфрачервена ($n \\to 3,4,\\ldots$)."},{"id":34,"module":2,"kind":"mcq","points":1.5,"topic":"Ядрена физика","stem":"С коя формула се изразява зависимостта между енергията на връзката на едно ядро $\\Delta E$ и масовия му дефект $\\Delta m$?","choices":[{"id":"A","text":"$\\Delta E = \\frac{\\Delta m}{c^2}$"},{"id":"B","text":"$\\Delta E = \\Delta m c$"},{"id":"C","text":"$\\Delta E = \\frac{\\Delta m}{c}$"},{"id":"D","text":"$\\Delta E = \\Delta m c^2$"}],"correct":"D","explanation":"Еквивалентност на маса и енергия: $\\Delta E = \\Delta m c^2$. Масовият дефект се превръща в енергия на връзката на нуклоните в ядрото."},{"id":35,"module":2,"kind":"mcq","points":1.5,"topic":"Ядрена физика","stem":"Коя от посочените реакции е алфа-разпадане?","choices":[{"id":"A","text":"$n + ^{235}_{92}U \\to ^{144}_{56}Ba + ^{89}_{36}Kr + 3n$"},{"id":"B","text":"$^{218}_{86}Rn \\to ^{214}_{84}Po + ^{4}_{2}He$"},{"id":"C","text":"$^{208}_{81}Tl \\to ^{208}_{82}Pb + e^- + \\bar{\\nu}_e$"},{"id":"D","text":"$^{23}_{12}Mg \\to ^{23}_{12}Mg + \\gamma$"}],"correct":"B","explanation":"Алфа-разпадането е излъчване на ядро $^{4}_{2}He$. А е делене, В е бета-разпадане, Г е гама-излъчване."},{"id":36,"module":2,"kind":"mcq","points":1.5,"topic":"Ядрена физика","stem":"Какво представляват бета-лъчите?","choices":[{"id":"A","text":"поток от електрони"},{"id":"B","text":"поток от протони"},{"id":"C","text":"фотони"},{"id":"D","text":"поток от неутрони"}],"correct":"A","explanation":"β⁻-лъчите са поток от електрони (при β⁺ — позитрони). Фотоните са γ-лъчи; протоните и неутроните не образуват класическите β-лъчи."},{"id":37,"module":2,"kind":"mcq","points":1.5,"topic":"Елементарни частици","stem":"Коя от изброените елементарни частици е изградена от кварки?","choices":[{"id":"A","text":"фотон"},{"id":"B","text":"електрон"},{"id":"C","text":"неутрино"},{"id":"D","text":"неутрон"}],"correct":"D","explanation":"Неутронът е адрон (udd кварки). Фотонът, електронът и неутриното са лептони/калибровъчни бозони и не са съставени от кварки."},{"id":38,"module":2,"kind":"mcq","points":1.5,"topic":"Астрономия","stem":"Звездите с най-малки маси в края на еволюцията си се превръщат в:","choices":[{"id":"A","text":"неутронни звезди"},{"id":"B","text":"черни дупки"},{"id":"C","text":"бели джуджета"},{"id":"D","text":"свръхнови"}],"correct":"C","explanation":"Звезди с маса като Слънцето (и по-малки) завършват като бели джуджета. Неутронни звезди и черни дупки се образуват от много по-масивни звезди след свръхнова."},{"id":39,"module":2,"kind":"mcq","points":1.5,"topic":"Астрономия","stem":"Кои от изброените звезди имат ниска температура и голяма светимост?","figure":"q39","choices":[{"id":"A","text":"белите джуджета"},{"id":"B","text":"неутронни звезди"},{"id":"C","text":"червените гиганти"},{"id":"D","text":"звездите като нашето Слънце"}],"correct":"C","explanation":"На диаграмата на Херцшпрунг–Ръсел червените гиганти са горе вдясно: ниска температура (червен цвят) и висока светимост заради огромния радиус. Белите джуджета са горещи, но слаби."},{"id":40,"module":2,"kind":"mcq","points":1.5,"topic":"Астрономия","stem":"Ако галактиката $A$ се отдалечава от нас два пъти по-бързо от галактиката $B$, според закона на Хъбъл най-вероятно:","choices":[{"id":"A","text":"галактиката $A$ има два пъти по-голяма маса в сравнение с галактиката $B$"},{"id":"B","text":"галактиката $A$ е два пъти по-далече от нас, отколкото галактиката $B$"},{"id":"C","text":"галактиката $A$ има два пъти по-голям диаметър в сравнение с галактиката $B$"},{"id":"D","text":"галактиката $A$ е два пъти по-стара от галактиката $B$"}],"correct":"B","explanation":"Закон на Хъбъл: $v = H_0 d$. Двойна скорост на отдалечаване означава двойно разстояние. Масата, размерът и възрастта не влизат в закона."},{"id":41,"module":2,"kind":"open","points":4,"topic":"Електростатика","stem":"Йон с електричен заряд $q_1 = 3{,}2 \\cdot 10^{-19}\\,\\mathrm{C}$ се намира в еднородно (хомогенно) електростатично поле и му действа електрична сила $F_1 = 1{,}6 \\cdot 10^{-15}\\,\\mathrm{N}$.","parts":[{"id":"a","label":"А","prompt":"Намерете интензитета $E$ на електростатичното поле.","kind":"numeric","points":2,"unit":"N/C","placeholder":"напр. 5000","answer":5000,"absTol":1},{"id":"b","label":"Б","prompt":"Каква по големина сила $F_2$ ще действа на заряд $q_2 = 1{,}6 \\cdot 10^{-18}\\,\\mathrm{C}$, поставен в същото поле?","kind":"numeric","points":2,"unit":"N","placeholder":"напр. 8e-15","answer":8e-15,"relTol":0.03}],"explanation":"А) $E = F_1/q_1 = (1{,}6 \\cdot 10^{-15})/(3{,}2 \\cdot 10^{-19}) = 5000\\,\\mathrm{N/C}$.\nБ) $F_2 = q_2 E = 1{,}6 \\cdot 10^{-18} \\cdot 5000 = 8{,}0 \\cdot 10^{-15}\\,\\mathrm{N}$."},{"id":42,"module":2,"kind":"open","points":4,"topic":"Електростатика","stem":"Когато кондензатор с капацитет $C$ е зареден до напрежение $U_1 = 200\\,\\mathrm{V}$, неговият заряд е $q_1$. Когато същият кондензатор е зареден до напрежение $U_2 = 500\\,\\mathrm{V}$, зарядът му е $q_2$.","parts":[{"id":"a","label":"А","prompt":"Изберете формулата, свързваща заряд, напрежение и капацитет.","kind":"select","points":1,"accepted":["qcu"],"options":[{"id":"qcu","text":"$q = C \\cdot U$"},{"id":"qcu2","text":"$q = C / U$"},{"id":"qcu3","text":"$q = U / C$"},{"id":"qcu4","text":"$C = q \\cdot U$"}]},{"id":"b","label":"Б","prompt":"Намерете отношението $q_1/q_2$ между зарядите на кондензатора.","kind":"numeric","points":2,"placeholder":"напр. 0.4 или 2/5","answer":0.4,"absTol":0.01},{"id":"c","label":"В","prompt":"Как се променя зарядът при увеличаване на напрежението от 200 V на 500 V?","kind":"select","points":1,"accepted":["up25"],"options":[{"id":"up25","text":"увеличава се 2,5 пъти"},{"id":"up2","text":"увеличава се 2 пъти"},{"id":"down25","text":"намалява 2,5 пъти"},{"id":"same","text":"остава същият, защото $C$ е константа"}]}],"explanation":"А) $q = CU$ (или еквивалентно $C = q/U$, $U = q/C$).\nБ) $q_1/q_2 = U_1/U_2 = 200/500 = 0{,}4 = 2/5$.\nВ) $q_2 = 2{,}5\\,q_1$ — зарядът се увеличава 2,5 пъти."},{"id":43,"module":2,"kind":"open","points":4,"topic":"Електричен ток","stem":"Разполагате с три резистора съответно със съпротивления $R_1 = 1\\,\\Omega$, $R_2 = 2\\,\\Omega$, $R_3 = 6\\,\\Omega$.","parts":[{"id":"a","label":"А","prompt":"Пресметнете еквивалентното съпротивление при последователно свързване.","kind":"numeric","points":2,"unit":"Ω","placeholder":"напр. 9","answer":9,"absTol":0.01},{"id":"b","label":"Б","prompt":"Коя схема показва успоредно свързване на трите резистора?","kind":"select","points":2,"accepted":["par"],"options":[{"id":"ser","figure":"circuitSeries"},{"id":"par","figure":"circuitParallel"},{"id":"mix","figure":"circuitMixed"}]}],"explanation":"А) При последователно свързване $R_{екв} = R_1 + R_2 + R_3 = 1 + 2 + 6 = 9\\,\\Omega$.\nБ) Успоредното свързване има общ вход и общ изход за всеки резистор (три клона един до друг)."},{"id":44,"module":2,"kind":"open","points":4,"topic":"Електричен ток","stem":"На фигурата графично са представени стойностите на тока през един резистор при различни стойности на напрежението, приложено в краищата му.","figure":"q44","parts":[{"id":"a","label":"А","prompt":"Пресметнете съпротивлението на резистора.","kind":"numeric","points":2,"unit":"Ω","placeholder":"напр. 200","answer":200,"absTol":2},{"id":"b","label":"Б","prompt":"Какъв ток ще протече през този резистор, ако се свърже към източник с напрежение 3 V? (в mA)","kind":"numeric","points":2,"unit":"mA","placeholder":"напр. 15","answer":15,"absTol":0.2}],"explanation":"Графиката е линейна — закон на Ом. При $U = 20\\,\\mathrm{V}$ токът е $I = 100\\,\\mathrm{mA} = 0{,}100\\,\\mathrm{A}$.\nА) $R = U/I = 20/0{,}100 = 200\\,\\Omega$.\nБ) $I = U/R = 3/200 = 0{,}015\\,\\mathrm{A} = 15\\,\\mathrm{mA}$."},{"id":45,"module":2,"kind":"open","points":4,"topic":"Трептения","stem":"Пружинно махало, състоящо се от пружина с коефициент на еластичност $k$ и тяло с маса $m = 4\\,\\mathrm{kg}$, има период $T = 6\\,\\mathrm{s}$. (Приемете $\\pi^2 \\approx 10$.)","parts":[{"id":"a","label":"А","prompt":"Намерете коефициента на еластичност $k$ на пружината.","kind":"numeric","points":2,"unit":"N/m","placeholder":"напр. 4.44","answer":4.44,"absTol":0.08,"relTol":0.04},{"id":"b","label":"Б","prompt":"Колко ще е новият период $T_1$, ако тялото се подмени с друго, което има 4 пъти по-малка маса?","kind":"numeric","points":2,"unit":"s","placeholder":"напр. 3","answer":3,"absTol":0.05}],"explanation":"А) $T = 2\\pi\\sqrt{m/k}$ $\\Rightarrow$ $k = 4\\pi^2 m / T^2 \\approx 4\\cdot 10 \\cdot 4 / 36 = 160/36 \\approx 4{,}44\\,\\mathrm{N/m}$.\nБ) $T \\propto \\sqrt{m}$. При $m/4$ периодът намалява 2 пъти: $T_1 = 3\\,\\mathrm{s}$."},{"id":46,"module":2,"kind":"open","points":4,"topic":"Звук","stem":"Кит издава кратък звук с честота $\\nu = 20\\,\\mathrm{Hz}$. Скоростта на звука във водата е $u = 1500\\,\\mathrm{m/s}$.","parts":[{"id":"a","label":"А","prompt":"Колко е дължината на вълната $\\lambda$ на този звук?","kind":"numeric","points":2,"unit":"m","placeholder":"напр. 75","answer":75,"absTol":0.5},{"id":"b","label":"Б","prompt":"Втори кит, намиращ се на разстояние $s = 120\\,\\mathrm{km}$ от първия, след като чува звука, веднага му отговаря. След колко време $t$ първият кит ще чуе отговора?","kind":"numeric","points":2,"unit":"s","placeholder":"напр. 160","answer":160,"absTol":1}],"explanation":"А) $\\lambda = u/\\nu = 1500/20 = 75\\,\\mathrm{m}$.\nБ) Звукът изминава пътя отиване и връщане: $t = 2s/u = 2\\cdot 120\\,\\mathrm{km} / 1{,}5\\,\\mathrm{km/s} = 160\\,\\mathrm{s}$."},{"id":47,"module":2,"kind":"open","points":4,"topic":"Оптика","stem":"Светлинен лъч пада от въздух с показател на пречупване $n_1$ върху стъклена пластина с показател на пречупване $n_2$.","figure":"q47","parts":[{"id":"a","label":"А","prompt":"Определете ъгъла на падане, ако ъгълът между отразения и пречупения лъч е $\\theta = 90^\\circ$, а ъгълът на пречупване е $\\beta = 30^\\circ$.","kind":"numeric","points":2,"unit":"°","placeholder":"напр. 60","answer":60,"absTol":0.5},{"id":"b","label":"Б","prompt":"Сравнете показателите на пречупване $n_1$ и $n_2$.","kind":"select","points":2,"accepted":["lt"],"options":[{"id":"gt","text":"$n_1 > n_2$"},{"id":"eq","text":"$n_1 = n_2$"},{"id":"lt","text":"$n_1 < n_2$"}]}],"explanation":"А) Ъгълът между отразения лъч и нормалата е равен на ъгъла на падане $\\alpha$. От геометрията $\\alpha + \\theta + \\beta = 180^\\circ$ $\\Rightarrow$ $\\alpha = 180^\\circ - 90^\\circ - 30^\\circ = 60^\\circ$. (Тъй като ъгълът на отражение = ъгъл на падане.)\nБ) $\\alpha > \\beta$, лъчът се пречупва към нормалата, следователно $n_1 < n_2$."},{"id":48,"module":2,"kind":"open","points":4,"topic":"Електромагнитен спектър","stem":"В таблицата е дадена дължината на вълната за лъчения от три диапазона на електромагнитния спектър.\nВидима светлина: $\\lambda_1 = 660\\,\\mathrm{nm}$. Инфрачервени лъчи: $\\lambda_2 = 33\\,\\mu\\mathrm{m}$. Рентгенови лъчи: $\\lambda_3 = 0{,}15 \\cdot 10^{-10}\\,\\mathrm{m}$.","parts":[{"id":"a1","label":"А1","prompt":"Изразете $\\lambda_1$ в метри.","kind":"numeric","points":0.5,"unit":"m","placeholder":"напр. 6.6e-7","answer":6.6e-7,"relTol":0.02},{"id":"a2","label":"А2","prompt":"Изразете $\\lambda_2$ в метри.","kind":"numeric","points":0.5,"unit":"m","placeholder":"напр. 3.3e-5","answer":0.000033,"relTol":0.02},{"id":"b","label":"Б","prompt":"Подредете лъченията по нарастване на тяхната честота.","kind":"select","points":1,"accepted":["ir-vis-x"],"options":[{"id":"vis-ir-x","text":"видима, инфрачервени, рентгенови"},{"id":"ir-vis-x","text":"инфрачервени, видима, рентгенови"},{"id":"x-vis-ir","text":"рентгенови, видима, инфрачервени"},{"id":"ir-x-vis","text":"инфрачервени, рентгенови, видима"}]},{"id":"c","label":"В","prompt":"Пресметнете честотата $\\nu$ на лъчението с най-голяма енергия на квантите. ($c = 3 \\cdot 10^8\\,\\mathrm{m/s}$)","kind":"numeric","points":2,"unit":"Hz","placeholder":"напр. 2e19","answer":20000000000000000000,"relTol":0.05}],"explanation":"А) $\\lambda_1 = 660\\,\\mathrm{nm} = 6{,}6 \\cdot 10^{-7}\\,\\mathrm{m}$; $\\lambda_2 = 33\\,\\mu\\mathrm{m} = 3{,}3 \\cdot 10^{-5}\\,\\mathrm{m}$.\nБ) $\\nu = c/\\lambda$ расте при намаляване на $\\lambda$: ИЧ → видима → рентген.\nВ) Най-енергетични са рентгеновите лъчи. $\\lambda_3 = 0{,}15 \\cdot 10^{-10} = 1{,}5 \\cdot 10^{-11}\\,\\mathrm{m}$, $\\nu = c/\\lambda_3 = 3 \\cdot 10^8 / 1{,}5 \\cdot 10^{-11} = 2 \\cdot 10^{19}\\,\\mathrm{Hz}$."},{"id":49,"module":2,"kind":"open","points":4,"topic":"Фотоефект","stem":"Фотоклетка има катод, направен от метала калий. При облъчването ѝ с монохроматична светлина с енергия на фотоните $E = 2{,}90\\,\\mathrm{eV}$ е установено, че максималната кинетична енергия на фотоелектроните е $E_{k,max} = 0{,}61\\,\\mathrm{eV}$.","parts":[{"id":"a","label":"А","prompt":"Определете отделителната работа на метала калий (в eV).","kind":"numeric","points":2,"unit":"eV","placeholder":"напр. 2.29","answer":2.29,"absTol":0.02},{"id":"b","label":"Б","prompt":"При какво условие през фотоклетката ще протича ток? („Червената граница“ е $\\nu_{min}$ / $\\lambda_{max}$.)","kind":"select","points":2,"accepted":["cond"],"options":[{"id":"cond","text":"$\\nu \\ge \\nu_{min}$  (или $\\lambda \\le \\lambda_{max}$, или $E \\ge A$)"},{"id":"wrong1","text":"$\\nu < \\nu_{min}$"},{"id":"wrong2","text":"само ако интензитетът на светлината е достатъчно голям, независимо от $\\nu$"},{"id":"wrong3","text":"$\\lambda > \\lambda_{max}$"}]}],"explanation":"А) Уравнение на Айнщайн: $E = A + E_{k,max}$ $\\Rightarrow$ $A = 2{,}90 - 0{,}61 = 2{,}29\\,\\mathrm{eV}$.\nБ) Фотоефект има при $E \\ge A$, т.е. $\\nu \\ge \\nu_{min}$ или $\\lambda \\le \\lambda_{max}$. Интензитетът влияе на броя електрони, не на прага."},{"id":50,"module":2,"kind":"open","points":4,"topic":"Ядрена физика","stem":"Периодът на полуразпадане $T_{1/2}$ на радиоактивния изотоп радон-222 е 3,8 денонощия.","parts":[{"id":"a","label":"А","prompt":"Кое е определението за период на полуразпадане?","kind":"select","points":1,"accepted":["def"],"options":[{"id":"def","text":"интервалът от време, за което се разпада половината от началния брой радиоактивни ядра"},{"id":"w1","text":"времето, за което се разпадат всички ядра"},{"id":"w2","text":"времето за един пълен оборот на електрона около ядрото"},{"id":"w3","text":"средното време между два последователни α-разпада в природата"}]},{"id":"b","label":"Б","prompt":"Ако в даден момент броят на ядрата е $N_0$, колко ще бъде броят им след 19 денонощия?","kind":"select","points":2,"accepted":["n32"],"options":[{"id":"n2","text":"$N_0 / 2$"},{"id":"n8","text":"$N_0 / 8$"},{"id":"n16","text":"$N_0 / 16$"},{"id":"n32","text":"$N_0 / 32$"}]},{"id":"c","label":"В","prompt":"За колко време броят на ядрата на този изотоп намалява 16 пъти?","kind":"numeric","points":1,"unit":"денонощия","placeholder":"напр. 15.2","answer":15.2,"absTol":0.15}],"explanation":"А) $T_{1/2}$ е времето, за което се разпада половината от началния брой ядра.\nБ) $n = t/T_{1/2} = 19/3{,}8 = 5$ периода $\\Rightarrow$ $N = N_0 / 2^5 = N_0/32$.\nВ) $N/N_0 = 1/16 = (1/2)^4$ $\\Rightarrow$ $t = 4 \\cdot 3{,}8 = 15{,}2$ денонощия."}];

}
function scoreQuestion(q, ans) {
  if (q.kind === "mcq") {
    const ok = ans?.choice != null && ans.choice === q.correct;
    return { earned: ok ? q.points : 0, max: q.points, correct: ok };
  }
  const partResults = {};
  let earned = 0, max = 0;
  for (const p of q.parts || []) {
    max += p.points;
    const ok = gradePart(p, ans?.parts?.[p.id]);
    partResults[p.id] = ok;
    if (ok) earned += p.points;
  }
  return { earned, max, correct: earned === max && max > 0, partResults };
}
function isAnswered(q, ans) {
  if (!ans) return false;
  if (q.kind === "mcq") return ans.choice != null;
  return (q.parts || []).some((p) => (ans.parts?.[p.id] || "").trim() !== "");
}
function formatPoints(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
}
function bulgarianGrade(percent) {
  if (percent < 24) return { mark: 2, label: "Слаб" };
  if (percent < 50) return { mark: 3, label: "Среден" };
  if (percent < 70) return { mark: 4, label: "Добър" };
  if (percent < 90) return { mark: 5, label: "Много добър" };
  return { mark: 6, label: "Отличен" };
}
function durationMinutes(scope) {
  return scope === "m1" ? 90 : scope === "m2" ? 150 : 240;
}
function questionsFor(scope) {
  if (scope === "m1") return QUESTIONS.filter((q) => q.module === 1);
  if (scope === "m2") return QUESTIONS.filter((q) => q.module === 2);
  return QUESTIONS;
}

const empty = () => ({
  phase: "start",
  mode: "practice",
  scope: "all",
  timerOn: false,
  startedAt: null,
  currentIndex: 0,
  answers: {},
  submitted: false,
  review: false,
});
let S = empty();
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && saved.phase) S = { ...empty(), ...saved };
} catch {}
function save() {
  localStorage.setItem(KEY, JSON.stringify(S));
}
function ans(id) {
  return S.answers[id] || (S.answers[id] = {});
}

const root = document.getElementById("app");
let tick = 0;
setInterval(() => {
  if (S.phase === "quiz" && S.timerOn && S.startedAt && !S.submitted) {
    tick++;
    const el = document.getElementById("timer");
    if (el) el.textContent = timerText();
    if (remainingMs() <= 0) submit();
  }
}, 1000);

function remainingMs() {
  if (!S.timerOn || !S.startedAt) return null;
  return durationMinutes(S.scope) * 60 * 1000 - (Date.now() - S.startedAt);
}
function timerText() {
  const ms = remainingMs();
  if (ms == null) return "";
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

function qs() {
  return questionsFor(S.scope);
}

function start(opts) {
  S = {
    ...empty(),
    phase: "quiz",
    mode: opts.mode,
    scope: opts.scope,
    timerOn: opts.timerOn,
    startedAt: Date.now(),
  };
  save();
  render();
}
function submit() {
  S.submitted = true;
  S.phase = "results";
  S.review = false;
  save();
  render();
}
function restart() {
  S = empty();
  save();
  render();
}

function render() {
  if (S.phase === "results") renderResults();
  else if (S.phase === "quiz") renderQuiz();
  else renderStart();
}

function renderStart() {
  const n = questionsFor(S.scope).length;
  const mins = durationMinutes(S.scope);
  const canResume = S.phase === "quiz" || (localStorage.getItem(KEY) && JSON.parse(localStorage.getItem(KEY) || "{}").phase === "quiz");
  root.innerHTML = `
    <div class="wrap hero fade">
      <p class="kicker">Държавен зрелостен изпит</p>
      <h1>Физика и астрономия</h1>
      <p class="muted">23 май 2018 · Вариант 1 · 50 задачи · 100 точки</p>
      <div class="card" style="margin-top:22px">
        <h2 style="font-size:18px;margin-bottom:12px">Настройки</h2>
        <div class="optgrid two">
          <button class="seg ${S.mode === "practice" ? "on" : ""}" data-act="mode" data-v="practice"><strong>Практика</strong><div class="muted" style="font-size:13px">Проверка и обяснения след всяка задача</div></button>
          <button class="seg ${S.mode === "exam" ? "on" : ""}" data-act="mode" data-v="exam"><strong>Изпит</strong><div class="muted" style="font-size:13px">Оценяване едва след предаване</div></button>
        </div>
        <div class="optgrid" style="margin-top:10px;grid-template-columns:repeat(3,1fr)">
          <button class="seg ${S.scope === "all" ? "on" : ""}" data-act="scope" data-v="all">Цял изпит<br><span class="faint">1–50</span></button>
          <button class="seg ${S.scope === "m1" ? "on" : ""}" data-act="scope" data-v="m1">Модул 1<br><span class="faint">1–30</span></button>
          <button class="seg ${S.scope === "m2" ? "on" : ""}" data-act="scope" data-v="m2">Модул 2<br><span class="faint">31–50</span></button>
        </div>
        <div class="row" style="margin-top:14px;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:10px 12px">
          <div>Таймер (${mins} мин за ${n} задачи)</div>
          <button class="switch ${S.timerOn ? "on" : ""}" data-act="timer" role="switch" aria-checked="${S.timerOn}"><i></i></button>
        </div>
        <button class="btn primary" data-act="go" style="width:100%;margin-top:16px;text-align:center">Започни ${n} задачи</button>
      </div>
    </div>`;
  root.onclick = (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    if (act === "mode") S.mode = b.dataset.v;
    if (act === "scope") S.scope = b.dataset.v;
    if (act === "timer") S.timerOn = !S.timerOn;
    if (act === "go") return start({ mode: S.mode, scope: S.scope, timerOn: S.timerOn });
    save();
    renderStart();
  };
}

function renderQuiz() {
  const list = qs();
  const i = Math.min(S.currentIndex, list.length - 1);
  const q = list[i];
  const a = ans(q.id);
  const showKey = S.review || (S.mode === "practice" && a.checked);
  const unanswered = list.filter((item) => !isAnswered(item, S.answers[item.id])).length;
  const pct = ((i + 1) / list.length) * 100;
  const sc = showKey ? scoreQuestion(q, a) : null;

  root.innerHTML = `
    <header class="bar">
      <div class="bar-inner">
        <div class="grow">
          <div class="kicker">${S.review ? "Преглед" : S.mode === "practice" ? "Практика" : "Изпит"} · № ${q.id} / ${list[0].id}–${list[list.length - 1].id}</div>
          <div class="progress" style="margin-top:6px"><i style="width:${pct}%"></i></div>
        </div>
        ${S.timerOn && !S.review ? `<div id="timer" class="scorepill">${timerText()}</div>` : ""}
        ${!S.review ? `<button class="btn ghost" data-act="home">Начало</button>` : `<button class="btn ghost" data-act="to-results">Резултат</button>`}
        <button class="btn ghost" data-act="map">Карта</button>
        ${!S.review ? `<button class="btn primary" data-act="submit">Предай</button>` : ""}
      </div>
    </header>
    <div class="wrap fade" style="max-width:820px">
      <div class="card">
        <div class="row" style="margin-bottom:8px">
          <span class="topic">${esc(q.topic)} · ${formatPoints(q.points)} т.</span>
          <span class="grow"></span>
          <button class="btn ghost" data-act="flag">${a.flagged ? "★ Маркирана" : "Маркирай"}</button>
        </div>
        <h2 style="font-size:clamp(18px,2.4vw,22px);line-height:1.35">${rich(q.stem)}</h2>
        ${q.figure ? fig(q.figure) : ""}
        <div style="margin-top:16px">${q.kind === "mcq" ? renderMcq(q, a, showKey) : renderOpen(q, a, showKey)}</div>
        ${showKey ? `<div class="explain ${sc.correct ? "ok" : "bad"}"><strong>${sc.correct ? "Вярно" : "Решение"} · ${formatPoints(sc.earned)} / ${formatPoints(sc.max)} т.</strong><div style="margin-top:8px">${rich(q.explanation).replace(/\n/g, "<br>")}</div></div>` : ""}
      </div>
    </div>
    <div class="foot">
      <span class="scorepill">${unanswered} без отговор</span>
      <span class="grow"></span>
      <button class="btn" data-act="prev" ${i === 0 ? "disabled" : ""}>Назад</button>
      ${S.mode === "practice" && !S.review ? `<button class="btn" data-act="check">Провери</button>` : ""}
      <button class="btn primary" data-act="next" ${i === list.length - 1 ? "disabled" : ""}>Напред</button>
    </div>
    <div id="overlay"></div>`;

  root.onclick = onQuizClick;
  bindInputs(q);
}

function navGrid(list, i, reveal) {
  return `<div class="qnav">${list
    .map((item, idx) => {
      const a = S.answers[item.id] || {};
      const sc = reveal ? scoreQuestion(item, a) : null;
      const cls = [
        idx === i ? "cur" : "",
        isAnswered(item, a) ? "done" : "",
        a.flagged ? "flag" : "",
        sc && isAnswered(item, a) ? (sc.correct ? "ok" : "bad") : "",
      ].filter(Boolean).join(" ");
      return `<button class="${cls}" data-act="goto" data-i="${idx}">${item.id}</button>`;
    })
    .join("")}</div>`;
}

function renderMcq(q, a, showKey) {
  const figChoices = q.choices.some((c) => c.figure);
  return `<div class="optgrid ${figChoices ? "two" : ""}">${q.choices
    .map((c) => {
      let cls = "choice";
      if (a.choice === c.id) cls += " selected";
      if (showKey && c.id === q.correct) cls += " ok";
      else if (showKey && a.choice === c.id && c.id !== q.correct) cls += " bad";
      return `<button class="${cls}" data-act="pick" data-id="${c.id}" ${S.review ? "disabled" : ""}>
        <span class="letter">${c.id === "A" ? "А" : c.id === "B" ? "Б" : c.id === "C" ? "В" : "Г"}</span>
        ${c.figure ? fig(c.figure) : `<span>${rich(c.text || "")}</span>`}
        ${c.text && c.figure ? `<div class="muted" style="margin-top:6px;font-size:13px">${rich(c.text)}</div>` : ""}
      </button>`;
    })
    .join("")}</div>`;
}

function renderOpen(q, a, showKey) {
  return (q.parts || [])
    .map((p) => {
      const val = a.parts?.[p.id] || "";
      const ok = showKey ? gradePart(p, val) : null;
      let body = "";
      if (p.kind === "select") {
        const figOpts = (p.options || []).some((o) => o.figure);
        body = `<div class="optgrid ${figOpts ? "two" : ""}">${(p.options || [])
          .map((o) => {
            let cls = "choice";
            if (val === o.id) cls += " selected";
            if (showKey && (p.accepted || []).includes(o.id)) cls += " ok";
            else if (showKey && val === o.id) cls += " bad";
            return `<button class="${cls}" data-act="part-pick" data-pid="${p.id}" data-id="${o.id}" ${S.review ? "disabled" : ""}>
              ${o.figure ? fig(o.figure) : `<span>${rich(o.text || "")}</span>`}
            </button>`;
          })
          .join("")}</div>`;
      } else {
        body = `<div class="row"><input type="text" data-pid="${p.id}" value="${esc(val)}" placeholder="${esc(p.placeholder || "")}" ${S.review ? "disabled" : ""}>${p.unit ? `<span class="unit">${esc(p.unit)}</span>` : ""}</div>`;
      }
      return `<div class="part"><div class="topic" style="margin-bottom:6px">${esc(p.label)} · ${formatPoints(p.points)} т. ${ok === true ? "✓" : ok === false ? "✗" : ""}</div><div style="margin-bottom:8px">${rich(p.prompt)}</div>${body}</div>`;
    })
    .join("");
}

function bindInputs(q) {
  root.querySelectorAll("input[data-pid]").forEach((inp) => {
    inp.addEventListener("input", () => {
      const A = ans(q.id);
      A.parts = A.parts || {};
      A.parts[inp.dataset.pid] = inp.value;
      A.checked = false;
      save();
    });
  });
}

function onQuizClick(e) {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const list = qs();
  const q = list[S.currentIndex];
  const act = b.dataset.act;
  if (act === "pick") {
    if (S.review) return;
    ans(q.id).choice = b.dataset.id;
    ans(q.id).checked = false;
    save();
    renderQuiz();
  } else if (act === "part-pick") {
    if (S.review) return;
    const A = ans(q.id);
    A.parts = A.parts || {};
    A.parts[b.dataset.pid] = b.dataset.id;
    A.checked = false;
    save();
    renderQuiz();
  } else if (act === "flag") {
    ans(q.id).flagged = !ans(q.id).flagged;
    save();
    renderQuiz();
  } else if (act === "check") {
    ans(q.id).checked = true;
    save();
    renderQuiz();
  } else if (act === "next") {
    S.currentIndex = Math.min(list.length - 1, S.currentIndex + 1);
    save();
    renderQuiz();
  } else if (act === "prev") {
    S.currentIndex = Math.max(0, S.currentIndex - 1);
    save();
    renderQuiz();
  } else if (act === "goto") {
    S.currentIndex = Number(b.dataset.i);
    save();
    closeMap();
    renderQuiz();
  } else if (act === "home") {
    S.phase = "start";
    save();
    render();
  } else if (act === "to-results") {
    S.phase = "results";
    save();
    render();
  } else if (act === "submit") {
    openSubmit();
  } else if (act === "map") {
    openMap();
  } else if (act === "close-map") closeMap();
  else if (act === "do-submit") submit();
  else if (act === "cancel-submit") closeMap();
}

function openMap() {
  const list = qs();
  const ov = document.getElementById("overlay");
  ov.innerHTML = `<div class="modal"><div class="card"><h3>Карта на задачите</h3><div style="margin:14px 0">${navGrid(list, S.currentIndex, S.review)}</div><button class="btn" data-act="close-map" style="width:100%;text-align:center">Затвори</button></div></div>`;
}
function closeMap() {
  const ov = document.getElementById("overlay");
  if (ov) ov.innerHTML = "";
}
function openSubmit() {
  const list = qs();
  const unanswered = list.filter((item) => !isAnswered(item, S.answers[item.id])).length;
  const ov = document.getElementById("overlay");
  ov.innerHTML = `<div class="modal"><div class="card"><h3>Предаване на изпита</h3><p class="muted" style="margin:10px 0 16px">${unanswered ? `Имате ${unanswered} задачи без отговор.` : "Всички задачи имат отговор."} След предаване ще видите резултата и решенията.</p><div class="row"><button class="btn grow" data-act="cancel-submit" style="text-align:center">Назад</button><button class="btn primary grow" data-act="do-submit" style="text-align:center">Предай и виж резултата</button></div></div></div>`;
}

function renderResults() {
  const list = qs();
  let earned = 0, max = 0, nOk = 0;
  const byTopic = {};
  for (const q of list) {
    const sc = scoreQuestion(q, S.answers[q.id]);
    earned += sc.earned;
    max += sc.max;
    if (sc.correct) nOk++;
    byTopic[q.topic] = byTopic[q.topic] || { earned: 0, max: 0 };
    byTopic[q.topic].earned += sc.earned;
    byTopic[q.topic].max += sc.max;
  }
  const pct = max ? (100 * earned) / max : 0;
  const g = bulgarianGrade(pct);
  const topics = Object.entries(byTopic)
    .map(([t, v]) => `<div class="row" style="margin:6px 0"><span class="grow">${esc(t)}</span><span class="scorepill">${formatPoints(v.earned)} / ${formatPoints(v.max)}</span></div>`)
    .join("");
  const items = list
    .map((q) => {
      const sc = scoreQuestion(q, S.answers[q.id]);
      return `<button class="choice" data-act="review-q" data-id="${q.id}"><span><strong>${q.id}</strong> ${esc(q.topic)}</span><span class="scorepill">${formatPoints(sc.earned)}/${formatPoints(sc.max)}</span></button>`;
    })
    .join("");
  root.innerHTML = `
    <div class="wrap fade">
      <p class="kicker">Резултат</p>
      <h1>Изпитът е предаден</h1>
      <div class="card" style="margin-top:18px;display:grid;gap:18px;grid-template-columns:1fr;align-items:center">
        <div>
          <div class="grade">${g.mark}</div>
          <div class="muted">${g.label} · ${Math.round(pct)}% · ${formatPoints(earned)} / ${formatPoints(max)} т. · ${nOk} / ${list.length} верни</div>
        </div>
        <div class="row">
          <button class="btn primary" data-act="review">Преглед с решения</button>
          <button class="btn" data-act="restart">Нов опит</button>
        </div>
      </div>
      <div class="card" style="margin-top:16px"><h2 style="font-size:18px;margin-bottom:8px">По теми</h2>${topics}</div>
      <div class="card" style="margin-top:16px"><h2 style="font-size:18px;margin-bottom:8px">Задачи</h2><div class="listq">${items}</div></div>
    </div>`;
  root.onclick = (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    if (b.dataset.act === "restart") restart();
    if (b.dataset.act === "review") {
      S.phase = "quiz";
      S.review = true;
      S.currentIndex = 0;
      save();
      render();
    }
    if (b.dataset.act === "review-q") {
      const list2 = qs();
      S.currentIndex = Math.max(0, list2.findIndex((x) => x.id === Number(b.dataset.id)));
      S.phase = "quiz";
      S.review = true;
      save();
      render();
    }
  };
}

document.addEventListener("keydown", (e) => {
  if (S.phase !== "quiz") return;
  const list = qs();
  const q = list[S.currentIndex];
  if (!q) return;
  if (e.key === "ArrowRight") {
    S.currentIndex = Math.min(list.length - 1, S.currentIndex + 1);
    save();
    renderQuiz();
  } else if (e.key === "ArrowLeft") {
    S.currentIndex = Math.max(0, S.currentIndex - 1);
    save();
    renderQuiz();
  } else if (!S.review && q.kind === "mcq" && ["a", "b", "c", "d", "A", "B", "C", "D"].includes(e.key) && document.activeElement.tagName !== "INPUT") {
    ans(q.id).choice = e.key.toUpperCase();
    ans(q.id).checked = false;
    save();
    renderQuiz();
  }
});

render();

  </script>
</body>
</html>
