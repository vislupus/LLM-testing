<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics & Astronomy Matriculation Exam 2018 - Interactive</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #64748b;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        /* --- Start Screen --- */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #start-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
            padding: 0 20px;
        }

        #start-screen p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            text-align: center;
            max-width: 600px;
            padding: 0 20px;
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: white;
            color: var(--primary);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        /* --- Main Layout --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .progress-container {
            flex-grow: 1;
            margin: 0 20px;
            background: var(--bg);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* --- Question Card --- */
        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: var(--secondary);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .figure-placeholder {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            color: #64748b;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
            border-radius: 8px;
            font-style: italic;
        }

        /* --- Options --- */
        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .option-label:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-label input {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .option-label.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
            font-weight: 600;
        }

        /* Feedback States */
        .option-label.correct {
            border-color: var(--success);
            background-color: #dcfce7;
            color: #14532d;
        }

        .option-label.incorrect {
            border-color: var(--error);
            background-color: #fee2e2;
            color: #7f1d1d;
        }

        /* --- Open Ended Questions --- */
        .open-ended-box {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 20px;
            margin-top: 20px;
            border-radius: 4px;
        }
        
        .solution-toggle {
            margin-top: 15px;
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
            padding: 0;
        }

        .solution-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            color: var(--secondary);
            font-size: 0.95rem;
        }

        .solution-content.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* --- Navigation --- */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn-prev {
            background: var(--secondary);
            color: white;
        }

        .btn-next {
            background: var(--primary);
            color: white;
        }

        .btn-submit {
            background: var(--success);
            color: white;
            display: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- Results Modal --- */
        #results-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .results-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        .btn-restart {
            background: var(--text);
            color: white;
            margin-top: 20px;
        }

        /* Math helpers */
        sub { vertical-align: sub; font-size: smaller; }
        sup { vertical-align: super; font-size: smaller; }
        .math-block { font-family: 'Times New Roman', serif; font-style: italic; }

        @media (max-width: 600px) {
            #start-screen h1 { font-size: 1.8rem; }
            .question-card { padding: 20px; }
            .nav-buttons { flex-direction: column-reverse; gap: 10px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1>Physics & Astronomy<br>Matriculation Exam 2018</h1>
        <p>Interactive Practice Test based on Variant 1 (May 23, 2018).<br>50 Questions. Two Modules.</p>
        <button class="btn-start" onclick="startExam()">Start Exam</button>
    </div>

    <!-- Main App -->
    <div class="container" id="app" style="display: none;">
        <header>
            <div>Module <span id="module-indicator">1</span></div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div>Q <span id="current-q-num">1</span>/50</div>
        </header>

        <div id="question-container">
            <!-- Questions injected here -->
        </div>

        <div class="nav-buttons">
            <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()" disabled>Previous</button>
            <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">Next</button>
            <button class="btn btn-submit" id="btn-submit" onclick="finishExam()">Submit Exam</button>
        </div>
    </div>

    <!-- Results Modal -->
    <div id="results-modal">
        <div class="results-content">
            <h2>Exam Completed!</h2>
            <p style="margin: 10px 0; color: var(--secondary);">Here is your performance summary</p>
            <div class="score-circle" id="final-score">0%</div>
            <p id="score-text"></p>
            <button class="btn btn-restart" onclick="location.reload()">Restart Exam</button>
        </div>
    </div>

    <script>
        // --- Data Structure ---
        // Extracted from PDF. 
        // Types: 'mcq' (Multiple Choice), 'open' (Open Ended/Calculation)
        
        const examData = [
            // MODULE 1
            {
                id: 1,
                type: 'mcq',
                text: "Two electric point charges are in a vacuum at a distance r from each other. How will the force F of their interaction change if the distance between them is doubled?",
                options: ["Decrease 2 times", "Decrease 4 times", "Decrease 8 times", "Increase 2 times"],
                correct: 1, // Index B
                explanation: "According to Coulomb's Law, Force is inversely proportional to the square of the distance (F ~ 1/r²). If r becomes 2r, F becomes 1/(2²) = 1/4."
            },
            {
                id: 2,
                type: 'mcq',
                text: "Which figure shows the field lines of an electrostatic field created by a positive point charge q?",
                figure: "[Diagram: Radial lines pointing OUTWARD from a central point]",
                options: ["Lines radiating outward", "Lines radiating inward", "Parallel lines", "Concentric circles"],
                correct: 0, // Index A
                explanation: "Field lines originate from positive charges and terminate on negative charges. Thus, they point outward."
            },
            {
                id: 3,
                type: 'mcq',
                text: "An electrostatic field is created by charge Q. Compare the field intensity E at points A, B, and C (where A is closest to Q, B and C are further away at equal distances).",
                options: ["E_A > E_B = E_C", "E_A < E_B = E_C", "E_A = E_B > E_C", "E_A > E_B > E_C"],
                correct: 0, // Index A
                explanation: "Field intensity decreases with distance. Point A is closest (strongest). Points B and C are equidistant (equal intensity)."
            },
            {
                id: 4,
                type: 'mcq',
                text: "A point charge q is in an electrostatic field. If we know the magnitude q and the field intensity E at that point, we can find:",
                options: ["The velocity v", "The magnitude of the force F", "The kinetic energy", "The potential energy"],
                correct: 1, // Index B
                explanation: "The electric force is defined as F = qE."
            },
            {
                id: 5,
                type: 'mcq',
                text: "The phenomenon of electrostatic induction explains:",
                options: ["Aurora borealis", "Rainbow", "Attraction of iron filings by a magnet", "Electrostatic shielding"],
                correct: 3, // Index G (D in English list)
                explanation: "Electrostatic induction is the redistribution of electric charge in an object, caused by the influence of nearby charges, which is the principle behind shielding (Faraday cage)."
            },
            {
                id: 6,
                type: 'mcq',
                text: "The charges that move freely in metals are:",
                options: ["Electrons", "Holes", "Positive ions", "Negative ions"],
                correct: 0, // Index A
                explanation: "In metallic conductors, free electrons are the charge carriers."
            },
            {
                id: 7,
                type: 'mcq',
                text: "Which of the listed units is for electric current?",
                options: ["kV", "MΩ", "mA", "W"],
                correct: 2, // Index V (C)
                explanation: "mA (milliampere) is a unit of current. kV is voltage, MΩ is resistance, W is power."
            },
            {
                id: 8,
                type: 'mcq',
                text: "A copper wire has half the length and twice the diameter of another copper wire. Which statement is true?",
                options: ["Same specific resistance", "Same resistance", "Same volume", "Same mass"],
                correct: 0, // Index A
                explanation: "Specific resistance (resistivity) is a material property. Since both are copper, their specific resistance is identical regardless of dimensions."
            },
            {
                id: 9,
                type: 'mcq',
                text: "Voltage U=5V is applied to a resistor R=100Ω for t=4h. How much energy is consumed?",
                options: ["1 J", "1800 J", "2000 J", "3.6 kJ"],
                correct: 3, // Index G (D)
                explanation: "Power P = U²/R = 25/100 = 0.25 W. Energy E = P * t = 0.25 W * (4 * 3600 s) = 3600 J = 3.6 kJ."
            },
            {
                id: 10,
                type: 'mcq',
                text: "During engine start, current I=400A flows. Battery voltage U=12V. What is the resistance?",
                options: ["0.003 Ω", "0.03 Ω", "3.33 Ω", "33.3 Ω"],
                correct: 1, // Index B
                explanation: "Ohm's Law: R = U/I = 12/400 = 0.03 Ω."
            },
            {
                id: 11,
                type: 'mcq',
                text: "Which application does NOT relate to electrolysis?",
                options: ["Obtaining pure metals", "Metal plating", "Making copies of sculptures", "Generating current from solar batteries"],
                correct: 3, // Index G (D)
                explanation: "Solar batteries use the photovoltaic effect, not electrolysis."
            },
            {
                id: 12,
                type: 'mcq',
                text: "Which object is a source of a magnetic field?",
                options: ["Stationary point charge", "Li-ion battery", "Horseshoe copper wire", "Circular wire with current"],
                correct: 3, // Index G (D)
                explanation: "Moving charges (current) create magnetic fields. A stationary charge or a battery without a circuit does not."
            },
            {
                id: 13,
                type: 'mcq',
                text: "Current flows right in a horizontal wire. Magnetic field lines are vertical and point up. Direction of Ampere force?",
                options: ["Out of page (towards you)", "Into page", "Up", "Down"],
                correct: 0, // Index A
                explanation: "Left-Hand Rule: Field (Index) Up, Current (Middle) Right -> Thumb points Out of page."
            },
            {
                id: 14,
                type: 'mcq',
                text: "Formula for Force F on a wire of length l with current I in field B (perpendicular)?",
                options: ["F = B.I.l", "F = I².B.l", "F = I.l/B", "F = I.B².l"],
                correct: 0, // Index A
                explanation: "The standard formula for magnetic force on a straight wire is F = BIl sin(θ). Since perpendicular, sin(90)=1, so F=BIl."
            },
            {
                id: 15,
                type: 'mcq',
                text: "In which experiment is current NOT induced in the metal ring?",
                options: ["Magnet moves towards ring", "Ring moves towards magnet", "Ring enters uniform field", "Ring moves inside uniform field"],
                correct: 3, // Index G (D)
                explanation: "Induction requires a change in magnetic flux. Moving entirely within a uniform field causes no change in flux."
            },
            {
                id: 16,
                type: 'mcq',
                text: "Period of AC with frequency ν=50Hz?",
                options: ["0.002 s", "0.02 s", "0.2 s", "50 s"],
                correct: 1, // Index B
                explanation: "T = 1/f = 1/50 = 0.02 s."
            },
            {
                id: 17,
                type: 'mcq',
                text: "Fuse limits power to 4400W. Voltage U=220V. At what current does it blow?",
                options: ["20 C", "20 A", "20 J", "10 A"],
                correct: 1, // Index B
                explanation: "P = U*I => I = P/U = 4400/220 = 20 A."
            },
            {
                id: 18,
                type: 'mcq',
                text: "Period of a mathematical pendulum does NOT depend on:",
                options: ["Length of string", "Gravity", "Mass of the body", "Ratio of length/gravity"],
                correct: 2, // Index V (C)
                explanation: "T = 2π√(L/g). Mass is not in the formula."
            },
            {
                id: 19,
                type: 'mcq',
                text: "Graph of harmonic oscillation x(t). Which is true? (Assuming standard sine wave starting at 0, peak at 5cm, period 1s based on typical exam patterns, but let's look at options).",

                correct: 0, // Based on Key: A (0.2Hz implies T=5s). *Note: Without seeing the graph, I rely on the key provided in PDF which says A.*
                explanation: "According to the answer key, the frequency is 0.2 Hz."
            },
            {
                id: 20,
                type: 'mcq',
                text: "Mechanical resonance occurs when external force frequency is:",
                options: ["Very high", "Very low", "Close to natural frequency", "High amplitude"],
                correct: 2, // Index V (C)
                explanation: "Resonance happens when driving frequency matches natural frequency."
            },
            {
                id: 21,
                type: 'mcq',
                text: "Which characteristic does NOT apply to a harmonic wave?",
                options: ["Period", "Propagation speed", "Wavelength", "Wave spectrum"],
                correct: 3, // Index G (D)
                explanation: "A single harmonic wave has a single frequency, not a spectrum (which implies multiple frequencies)."
            },
            {
                id: 22,
                type: 'mcq',
                text: "Order media by increasing speed of sound:",
                options: ["Air, Water, Steel", "Steel, Water, Air", "Water, Air, Steel", "Water, Steel, Air"],
                correct: 0, // Index A
                explanation: "Sound travels slowest in gases (Air), faster in liquids (Water), fastest in solids (Steel)."
            },
            {
                id: 23,
                type: 'mcq',
                text: "Used for breaking kidney stones:",
                options: ["Infrasound", "Ultrasound", "Radio waves", "X-rays"],
                correct: 1, // Index B
                explanation: "Lithotripsy uses shock waves (ultrasound)."
            },
            {
                id: 24,
                type: 'mcq',
                text: "Which waves CANNOT propagate in vacuum?",
                options: ["Gamma rays", "X-rays", "Infrasound", "Microwaves"],
                correct: 2, // Index V (C)
                explanation: "Sound waves (including infrasound) require a medium. EM waves (Gamma, X, Micro) do not."
            },
            {
                id: 25,
                type: 'mcq',
                text: "Light ray through glass plate. Which ray (1-4) is correct?",
                figure: "[Diagram: Ray enters glass, bends towards normal, exits parallel to original]",
                options: ["Ray 1", "Ray 2", "Ray 3", "Ray 4"],
                correct: 0, // Index A (Based on Key)
                explanation: "In a parallel-sided slab, the emerging ray is parallel to the incident ray but laterally displaced."
            },
            {
                id: 26,
                type: 'mcq',
                text: "Light goes from Air (1) to Diamond (2). Relation of n and v?",
                options: ["n1 > n2; v1 > v2", "n1 > n2; v1 < v2", "n1 < n2; v1 = v2", "n1 < n2; v1 > v2"],
                correct: 3, // Index G (D)

            {
                id: 27,
                type: 'mcq',
                text: "Condition for Total Internal Reflection (Water to Air)?",
                options: ["α < α_crit", "α ≤ α_crit", "α > α_crit", "α = α_crit"],

            {
                id: 28,
                type: 'mcq',
                text: "Which is NOT explained by dispersion?",

            {
                id: 29,
                type: 'mcq',

            },
            {
                id: 30,
                type: 'mcq',

            // MODULE 2
            {
                id: 31,
                type: 'mcq',
                text: "What problem led to Planck's hypothesis of light quanta?",

            {

            // OPEN ENDED (Self-Check Format)
            {
                id: 41,
                type: 'open',
                text: "Ion charge q1 = 3.2·10⁻¹⁹ C in field E experiences force F1 = 1.6·10⁻¹⁵ N.<br>A) Find E.<br>B) Find force F2 on charge q2 = 1.6·10⁻¹⁸ C in same field.",
                solution: "A) E = F1/q1 = (1.6·10⁻¹⁵) / (3.2·10⁻¹⁹) = 5000 N/C.<br>B) F2 = q2·E = (1.6·10⁻¹⁸) * 5000 = 8.0·10⁻¹⁵ N."
            },
            {
                id: 42,
                type: 'open',
                text: "Capacitor C charged to U1=200V has charge q1. Charged to U2=500V has charge q2.<br>A) Formula relating q, U, C.<br>B) Ratio q1/q2.<br>C) How does charge change?",
                solution: "A) q = C·U.<br>B) q1/q2 = (C·U1)/(C·U2) = U1/U2 = 200/500 = 0.4.<br>C) Charge increases 2.5 times (500/200)."
            },
            {
                id: 43,
                type: 'open',
                text: "Resistors R1=1Ω, R2=2Ω, R3=6Ω.<br>A) Equivalent resistance in series.<br>B) Draw parallel scheme (Describe).",
                solution: "A) R_eq = R1+R2+R3 = 1+2+6 = 9Ω.<br>B) In parallel: All three resistors connected across the same two nodes."
            },
            {
                id: 44,
                type: 'open',
                text: "Graph shows I vs U for a resistor. At U=20V, I=0.1A.<br>A) Calculate R.<br>B) Current at U=3V?",
                solution: "A) R = U/I = 20/0.1 = 200Ω.<br>B) I = U/R = 3/200 = 0.015 A = 15 mA."
            },
            {
                id: 45,
                type: 'open',
                text: "Spring pendulum: k=?, m=4kg, T=6s. (π²≈10).<br>A) Find k.<br>B) New T if mass is 4x smaller.",
                solution: "A) T = 2π√(m/k) → k = 4π²m/T² ≈ 4(10)(4)/36 = 160/36 ≈ 4.44 N/m.<br>B) T_new = 2π√((m/4)/k) = (1/2)T_old = 3s."
            },
            {
                id: 46,
                type: 'open',
                text: "Whale sound: ν=20Hz, v=1500m/s.<br>A) Wavelength λ.<br>B) Time for echo from 120km away.",
                solution: "A) λ = v/ν = 1500/20 = 75m.<br>B) Distance total = 2 * 120km = 240km = 240,000m. t = d/v = 240000/1500 = 160s."
            },
            {
                id: 47,
                type: 'open',
                text: "Light Air(n1) -> Glass(n2). Angle between reflected and refracted ray θ=90°. Refraction angle β=30°.<br>A) Incidence angle α.<br>B) Compare n1, n2.",
                solution: "A) α + θ + β = 180° → α + 90 + 30 = 180 → α = 60°.<br>B) Since α (60°) > β (30°), light bends towards normal, so n2 > n1."
            },
            {
                id: 48,
                type: 'open',
                text: "Wavelengths: Visible λ1=660nm, IR λ2=33μm, X-ray λ3=0.15·10⁻¹⁰m.<br>A) Convert to meters.<br>B) Order by frequency.<br>C) Frequency of highest energy.",
                solution: "A) λ1=6.6·10⁻⁷m, λ2=3.3·10⁻⁵m.<br>B) Frequency ∝ 1/λ. Order: IR < Visible < X-ray.<br>C) Highest energy is X-ray. ν = c/λ3 = 3·10⁸ / (0.15·10⁻¹⁰) = 2·10¹⁹ Hz."
            },
            {
                id: 49,
                type: 'open',
                text: "Photoelectric effect on Potassium. Photon E=2.90eV, Ek_max=0.61eV.<br>A) Work Function A.<br>B) Condition for current.",
                solution: "A) A = E - Ek_max = 2.90 - 0.61 = 2.29 eV.<br>B) Condition: ν ≥ ν_min (or E_photon ≥ A)."
            },
            {
                id: 50,
                type: 'open',
                text: "Radon-222 half-life T=3.8 days.<br>A) Define half-life.<br>B) Remaining nuclei after 19 days (start N0).<br>C) Time to reduce 16x.",
                solution: "A) Time for half the nuclei to decay.<br>B) n = 19/3.8 = 5 half-lives. N = N0 * (1/2)⁵ = N0/32.<br>C) 16 = 2⁴, so 4 half-lives. t = 4 * 3.8 = 15.2 days."
            }
        ];

        // --- State Management ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(examData.length).fill(null);
        let isExamFinished = false;

        // --- DOM Elements ---
        const startScreen = document.getElementById('start-screen');
        const appContainer = document.getElementById('app');
        const questionContainer = document.getElementById('question-container');
        const progressBar = document.getElementById('progress-bar');
        const currentQNum = document.getElementById('current-q-num');
        const moduleIndicator = document.getElementById('module-indicator');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnSubmit = document.getElementById('btn-submit');
        const resultsModal = document.getElementById('results-modal');

        // --- Functions ---

        function startExam() {
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                appContainer.style.display = 'block';
                renderQuestion();
            }, 500);
        }

        function renderQuestion() {
            const q = examData[currentQuestionIndex];
            
            // Update Header
            currentQNum.textContent = q.id;
            moduleIndicator.textContent = q.id <= 30 ? "1" : "2";
            progressBar.style.width = `${((currentQuestionIndex + 1) / examData.length) * 100}%`;

            // Update Buttons
            btnPrev.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === examData.length - 1) {
                btnNext.style.display = 'none';
                btnSubmit.style.display = 'block';
            } else {
                btnNext.style.display = 'block';
                btnSubmit.style.display = 'none';
            }

            // Build HTML
            let html = `
                <div class="question-card">
                    <div class="question-header">
                        <span>Question ${q.id}</span>
                        <span>${q.type === 'mcq' ? 'Multiple Choice' : 'Problem Solving'}</span>
                    </div>
                    <div class="question-text">${q.text}</div>
            `;

            if (q.figure) {
                html += `<div class="figure-placeholder">${q.figure}</div>`;
            }

            if (q.type === 'mcq') {
                html += `<div class="options-grid">`;
                q.options.forEach((opt, idx) => {
                    const isSelected = userAnswers[currentQuestionIndex] === idx;
                    const isFinished = isExamFinished;
                    let className = 'option-label';
                    if (isSelected) className += ' selected';
                    
                    // If finished, show correctness
                    if (isFinished) {
                        if (idx === q.correct) className += ' correct';
                        else if (isSelected && idx !== q.correct) className += ' incorrect';
                    }

                    html += `
                        <label class="${className}" onclick="selectOption(${idx})">
                            <input type="radio" name="q${q.id}" ${isSelected ? 'checked' : ''} ${isFinished ? 'disabled' : ''}>
                            ${String.fromCharCode(65 + idx)}) ${opt}
                        </label>
                    `;
                });
                html += `</div>`;

                // Show explanation if finished
                if (isExamFinished) {
                    html += `
                        <div class="open-ended-box" style="border-left-color: var(--primary); margin-top:20px;">
                            <strong>Explanation:</strong><br>
                            ${q.explanation}
                        </div>
                    `;
                }

            } else {
                // Open Ended
                html += `
                    <div class="open-ended-box">
                        <p>Solve this problem on paper, then check your solution below.</p>
                        <button class="solution-toggle" onclick="toggleSolution(${q.id})">Show Correct Solution</button>
                        <div id="sol-${q.id}" class="solution-content">
                            ${q.solution}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            questionContainer.innerHTML = html;
            
            // Scroll to top
            window.scrollTo(0, 0);
        }

        function selectOption(optionIndex) {
            if (isExamFinished) return;
            userAnswers[currentQuestionIndex] = optionIndex;
            renderQuestion(); // Re-render to show selection state
        }

        function toggleSolution(id) {
            const el = document.getElementById(`sol-${id}`);
            el.classList.toggle('show');
        }

        function nextQuestion() {
            if (currentQuestionIndex < examData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function finishExam() {
            if (!confirm("Are you sure you want to submit the exam?")) return;
            
            isExamFinished = true;
            
            // Calculate Score (MCQ only for auto-scoring)
            let score = 0;
            let totalMCQ = 0;
            
            examData.forEach((q, idx) => {
                if (q.type === 'mcq') {
                    totalMCQ++;
                    if (userAnswers[idx] === q.correct) {
                        score++;
                    }
                }
            });

            const percentage = Math.round((score / totalMCQ) * 100);
            
            // Show Results
            document.getElementById('final-score').textContent = `${percentage}%`;
            document.getElementById('score-text').textContent = `You got ${score} out of ${totalMCQ} Multiple Choice questions correct.`;
            
            resultsModal.style.display = 'flex';
            
            // Re-render current question to show explanations
            renderQuestion();
        }

    </script>
</body>
</html>
