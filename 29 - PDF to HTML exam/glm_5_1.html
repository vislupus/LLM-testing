<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДЗИ Физика и Астрономия 2018 - Вариант 1</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --error: #ef4444;
            --error-bg: #fef2f2;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Screens */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Start Screen */
        .start-card {
            background: var(--card);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            margin-top: 10vh;
        }

        .start-card h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .start-card p {
            color: var(--muted);
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #fff;
            padding: 12px 32px;
            border-radius: 8px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
        }
        .btn-outline:hover { background-color: rgba(79, 70, 229, 0.05); }
        .btn-sm { padding: 8px 16px; font-size: 0.9rem; }

        /* Exam Screen */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .progress-text { font-weight: 600; color: var(--muted); font-size: 0.9rem; }
        .score-text { font-weight: 700; color: var(--primary); font-size: 0.9rem; }

        .question-card {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .question-meta {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: flex-start;
        }

        .option:hover:not(.disabled) {
            border-color: var(--primary);
            background-color: rgba(79, 70, 229, 0.05);
        }

        .option.selected {
            border-color: var(--primary);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .option.correct {
            border-color: var(--success);
            background-color: var(--success-bg);
            color: #065f46;
        }

        .option.wrong {
            border-color: var(--error);
            background-color: var(--error-bg);
            color: #991b1b;
        }

        .option.disabled { cursor: default; pointer-events: none; }
        .option-prefix { margin-right: 12px; font-weight: 700; }

        /* Open Answer Styles */
        .open-solution {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid var(--primary);
            display: none; /* Shown on action */
        }
        .open-solution h4 { margin-bottom: 10px; color: var(--primary); }
        .self-grade-btns { display: flex; gap: 10px; margin-top: 15px; }
        
        /* Feedback */
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }
        .feedback.correct-fb { background: var(--success-bg); color: #065f46; border: 1px solid #a7f3d0; }
        .feedback.wrong-fb { background: var(--error-bg); color: #991b1b; border: 1px solid #fecaca; }

        /* Navigation */
        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .question-nav {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .nav-dot {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-dot:hover { background: #cbd5e1; }
        .nav-dot.active { background: var(--primary); color: #fff; }
        .nav-dot.answered { background: #c7d2fe; color: #4338ca; }
        .nav-dot.answered.active { background: var(--primary); color: #fff; }

        /* Result Screen */
        .result-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--success) 0%, var(--success) var(--pct), #e2e8f0 var(--pct), #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
        }
        .result-circle::before {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            background: var(--card);
            border-radius: 50%;
        }
        .result-score {
            position: relative;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text);
        }

        @media (max-width: 600px) {
            .question-nav { grid-template-columns: repeat(5, 1fr); }
            .question-card { padding: 20px; }
            .start-card { padding: 25px; margin-top: 5vh; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <div class="start-card">
            <h1>ДЗИ Физика 2018</h1>
            <p>Вариант 1 - Първи и Втори модул<br>40 задачи с избираем отговор + 10 задачи със свободен отговор</p>
            <p style="font-size: 0.9rem; color: #94a3b8;">Общ брой точки: 100</p>
            <button class="btn" onclick="startExam()">Започни Изпита</button>
        </div>
    </div>

    <!-- Exam Screen -->
    <div id="exam-screen" class="screen">
        <div class="header">
            <div class="progress-text" id="progress-text">Въпрос 1/50</div>
            <div class="score-text" id="score-text">Точки: 0/100</div>
        </div>
        
        <div class="question-nav" id="question-nav"></div>

        <div class="question-card" id="question-card">
            <!-- Content injected by JS -->
        </div>

        <div class="nav-footer">
            <button class="btn btn-outline btn-sm" id="prev-btn" onclick="navigate(-1)">← Назад</button>
            <button class="btn btn-sm" id="next-btn" onclick="navigate(1)">Напред →</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
        <div class="start-card">
            <h2>Резултат</h2>
            <div class="result-circle" id="result-circle">
                <div class="result-score" id="result-score">0</div>
            </div>
            <p id="result-msg" style="margin-bottom: 20px; font-weight: 600;"></p>
            <button class="btn" onclick="restartExam()">Започни Отново</button>
        </div>
    </div>
</div>

<script>
// --- Data Extraction ---
const questions = [
    // --- MODULE 1 ---
    { id: 1, module: 1, text: "Два електрични точкови заряда се намират във вакуум на разстояние r един от друг. Как ще се промени силата F на тяхното взаимодействие, ако разстоянието между тях се увеличи два пъти?", options: ["ще намалее два пъти", "ще намалее четири пъти", "ще намалее осем пъти", "ще се увеличи два пъти"], correct: 1, points: 1.5 },
    { id: 2, module: 1, text: "На коя фигура са показани силовите линии на електростатично поле, създадено от положителен точков заряд q? [Фигури не са включени]", options: ["А", "Б", "В", "Г"], correct: 0, points: 1.5 },
    { id: 3, module: 1, text: "Електростатично поле е създадено от заряд Q. Сравнете интензитета E на полето в точките А, B и C от фигурата.", options: ["EA > EB = EС", "EA < EB = EС", "EA = EB > EС", "EA > EB > EС"], correct: 2, points: 1.5 },
    { id: 4, module: 1, text: "Точков заряд q се намира в електростатично поле. Ако знаем големината q на заряда и интензитета E на полето в точката, в която се намира заряда, можем да намерим:", options: ["скоростта v на заряда", "големината на силата F, с която полето действа на заряда", "кинетичната енергия на заряда", "потенциалната енергия на заряда"], correct: 1, points: 1.5 },
    { id: 5, module: 1, text: "С явлението електростатична индукция се обяснява:", options: ["полярното сияние", "небесната дъга", "привличането на железни стружки от магнит", "електростатичното екраниране"], correct: 3, points: 1.5 },
    { id: 6, module: 1, text: "Зарядите, които се придвижват свободно в металите, са:", options: ["електрони", "дупки", "положителни йони", "отрицателни йони"], correct: 0, points: 1.5 },
    { id: 7, module: 1, text: "Коя от посочените измерителни единици е за електричен ток?", options: ["kV", "MΩ", "mA", "W"], correct: 2, points: 1.5 },
    { id: 8, module: 1, text: "Меден проводник има два пъти по-малка дължина и два пъти по-голям диаметър на кръговото си сечение от друг меден проводник. Кое от твърденията е вярно?", options: ["Двата проводника имат едно и също специфично съпротивление.", "Двата проводника имат едно и също съпротивление.", "Двата проводника имат един и същ обем.", "Двата проводника имат една и съща маса."], correct: 0, points: 1.5 },
    { id: 9, module: 1, text: "Върху резистор със съпротивление R = 100 Ω се подава напрежение U = 5 V в продължение на време t = 4 h. Колко джаула е консумираната от него електрична енергия за това време?", options: ["1 J", "1800 J", "2000 J", "3,6 kJ"], correct: 3, points: 1.5 },
    { id: 10, module: 1, text: "По време на „запалване“ на двигател на автомобил през стартера му тече ток I = 400 A. Напрежението на акумулатора му е U = 12 V. Колко е съпротивлението на веригата?", options: ["0,003 Ω", "0,03 Ω", "3,33 Ω", "33,3 Ω"], correct: 1, points: 1.5 },
    { id: 11, module: 1, text: "Посочете приложението, което НЕ се отнася за явлението електролиза.", options: ["получаване на чисти метали", "нанасяне на метални покрития", "изработване на копия на грамофонни плочи", "получаване на електричен ток от слънчеви батерии"], correct: 3, points: 1.5 },
    { id: 12, module: 1, text: "Кой от изброените обекти е източник на магнитно поле?", options: ["неподвижен точков заряд", "литиево-йонна батерия", "меден проводник с формата на подкова", "кръгов проводник, по който тече електричен ток"], correct: 3, points: 1.5 },
    { id: 13, module: 1, text: "По хоризонтален проводник тече ток надясно. Проводникът се намира в еднородно магнитно поле с вертикални силови линии нагоре. Определете посоката на максималната сила.", options: ["от чертежа към вас", "от вас към чертежа", "нагоре", "надолу"], correct: 0, points: 1.5 },
    { id: 14, module: 1, text: "Силата F, с която еднородно магнитно поле с индукция B действа на праволинеен проводник с дължина l, по който тече ток I, и който е перпендикулярен на магнитните силови линии, се пресмята по формулата:", options: ["F = B.I.l", "F = I².B.l", "F = (I.l)/B", "F = I.B².l"], correct: 0, points: 1.5 },
    { id: 15, module: 1, text: "При кой от опитите НЕ се индуцира ток в металния пръстен?", options: ["магнитът се движи към пръстена", "пръстенът се движи към магнита", "пръстенът навлиза перпендикулярно в магнитно поле", "пръстенът се движи в еднородно магнитно поле"], correct: 3, points: 1.5 },
    { id: 16, module: 1, text: "Колко секунди е периодът на променлив ток с честота ν = 50 Hz?", options: ["0,002 s", "0,02 s", "0,2 s", "50 s"], correct: 1, points: 1.5 },
    { id: 17, module: 1, text: "Електрически предпазител трябва да ограничава консумацията на мощност до 4400 W при напрежение Uеф = 220 V. При каква ефективна стойност на тока се прекъсва веригата?", options: ["20 C", "20 A", "20 J", "10 A"], correct: 1, points: 1.5 },
    { id: 18, module: 1, text: "Периодът на хармонично трептене на математично махало НЕ зависи от:", options: ["дължината на нишката", "земното ускорение", "масата на тялото", "отношението дължина/ускорение"], correct: 2, points: 1.5 },
    { id: 19, module: 1, text: "На фигурата е показана графика на хармонично трептене. Кое твърдение е вярно? [Графика не е включена]", options: ["Честотата е 0,2 Hz.", "Периодът е 1,25 s.", "Амплитудата е 8 cm.", "Равновесното положение е при x = 5 cm."], correct: 3, points: 1.5 },
    { id: 20, module: 1, text: "Механичен резонанс може да се наблюдава, когато на дадено трептящо тяло действа периодична външна сила с:", options: ["много голяма честота", "много малка честота", "честота, близка или равна на собствената честота", "голяма амплитуда"], correct: 2, points: 1.5 },
    { id: 21, module: 1, text: "Коя от изброените характеристики НЕ се отнася за хармонична вълна?", options: ["период", "скорост на разпространение", "дължина на вълната", "спектър на вълната"], correct: 3, points: 1.5 },
    { id: 22, module: 1, text: "Подредете средите по нарастване на скоростта на звука в тях.", options: ["въздух, вода, стомана", "стомана, вода, въздух", "вода, въздух, стомана", "вода, стомана, въздух"], correct: 0, points: 1.5 },
    { id: 23, module: 1, text: "За разбиване на камъни в бъбреците се използват:", options: ["инфразвукови вълни", "ултразвукови вълни", "радиовълни", "рентгенови лъчи"], correct: 1, points: 1.5 },
    { id: 24, module: 1, text: "Кои вълни НЕ могат да се разпространяват във вакуум?", options: ["гама лъчите", "рентгеновите лъчи", "инфразвукови вълни", "микровълните"], correct: 2, points: 1.5 },
    { id: 25, module: 1, text: "Светлинен лъч пада върху плоскопаралелна стъклена пластина. Кой лъч е начертан правилно? [Фигури не са включени]", options: ["1", "2", "3", "4"], correct: 0, points: 1.5 },
    { id: 26, module: 1, text: "Светлинна вълна преминава от въздух (1) в диамант (2). Посочете правилното съотношение.", options: ["n1 > n2 ; u1 > u2", "n1 > n2 ; u1 < u2", "n1 < n2 ; u1 = u2", "n1 < n2 ; u1 > u2"], correct: 3, points: 1.5 },
    { id: 27, module: 1, text: "За да се наблюдава пълно вътрешно отражение е необходимо:", options: ["α < αгр", "α ≤ αгр", "α > αгр", "α = αгр"], correct: 2, points: 1.5 },
    { id: 28, module: 1, text: "Кое явление НЕ се обяснява с дисперсия на светлината?", options: ["небесна дъга", "разлагане през призма", "цветни ивици по CD", "цветни отблясъци от полилей"], correct: 2, points: 1.5 },
    { id: 29, module: 1, text: "Посочете вярното твърдение.", options: ["Слънцето не излъчва UV лъчи.", "ИЧ лъчите имат по-малка дължина на вълната от UV.", "Човек не усеща ИЧ лъчите.", "UV лъчите се поглъщат силно от озоновия слой."], correct: 3, points: 1.5 },

    // --- MODULE 2 (Multiple Choice) ---

    { id: 32, module: 2, text: "При кой преход излъченият фотон има най-голяма дължина на вълната?", options: ["n=2 → n=1", "n=4 → n=3", "n=4 → n=2", "n=3 → n=1"], correct: 1, points: 1.5 },

    { id: 35, module: 2, text: "Коя от реакциите е алфа-разпадане?", options: ["n + U → Ba + Kr + 3n", "Rn → Po + He", "Tl → Pb + e⁻ + ν̄e", "Mg → Mg + γ"], correct: 1, points: 1.5 },
    { id: 36, module: 2, text: "Какво представляват бета-лъчите?", options: ["поток от електрони", "поток от протони", "фотони", "поток от неутрони"], correct: 0, points: 1.5 },
    { id: 37, module: 2, text: "Коя от изброените елементарни частици е изградена от кварки?", options: ["фотон", "електрон", "неутрино", "неутрон"], correct: 3, points: 1.5 },

    { id: 39, module: 2, text: "Кои звезди имат ниска температура и голяма светимост?", options: ["белите джуджета", "неутронните звезди", "червените гиганти", "звездите като Слънцето"], correct: 2, points: 1.5 },

    { id: 43, module: 2, text: "Разполагате с три резистора: R₁ = 1 Ω, R₂ = 2 Ω, R₃ = 6 Ω.<br>А) Пресметнете еквивалентното съпротивление при последователно свързване.<br>Б) Начертайте схема на успоредно свързване.", type: "open", solution: "<b>Решение:</b><br>А) Rекв = R₁ + R₂ + R₃ = 1 + 2 + 6 = 9 Ω<br>Б) [Схема: Три резистора свързани успоредно между два възела]", points: 4 },
    { id: 44, module: 2, text: "На фигурата графично са представени стойностите на тока през резистор при различни напрежения.<br>А) Пресметнете съпротивлението R.<br>Б) Какъв ток ще протече при напрежение 3 V?", type: "open", solution: "<b>Решение:</b> (Предполагаме характерни точки от графиката, обикновено U=20V, I=0.1A)<br>А) R = U/I = 20 V / 0,100 A = 200 Ω<br>Б) I = U/R = 3,0 V / 200 Ω = 0,015 A = 15 mA", points: 4 },
    { id: 45, module: 2, text: "Пружинно махало с тяло маса m = 4 kg има период T = 6 s. (π²≈10)<br>А) Намерете коефициента на еластичност k.<br>Б) Колко е новият период T₁, ако масата стане 4 пъти по-малка?", type: "open", solution: "<b>Решение:</b><br>А) T = 2π√(m/k) ⇒ k = 4π²m/T² = 4.10.4 / 36 ≈ 4,44 N/m<br>Б) T₁ = 2π√(m/4k) = T/2 = 6/2 = 3 s", points: 4 },

];

// --- State ---
let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null); // Index of selected option for MCQ, or 'correct'/'wrong' for open
let userScores = new Array(questions.length).fill(0);
let examSubmitted = false;

// --- DOM Elements ---
const startScreen = document.getElementById('start-screen');
const examScreen = document.getElementById('exam-screen');
const resultScreen = document.getElementById('result-screen');
const questionCard = document.getElementById('question-card');
const questionNav = document.getElementById('question-nav');
const progressText = document.getElementById('progress-text');
const scoreText = document.getElementById('score-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

// --- Functions ---
function startExam() {
    startScreen.classList.remove('active');
    examScreen.classList.add('active');
    buildNav();
    loadQuestion(0);
}

function restartExam() {
    userAnswers.fill(null);
    userScores.fill(0);
    examSubmitted = false;
    currentIndex = 0;
    resultScreen.classList.remove('active');
    startScreen.classList.add('active');
}

function buildNav() {
    questionNav.innerHTML = '';
    questions.forEach((q, i) => {
        const dot = document.createElement('div');
        dot.className = 'nav-dot';
        dot.innerText = q.id;
        dot.onclick = () => loadQuestion(i);
        questionNav.appendChild(dot);
    });
}

function updateNav() {
    const dots = questionNav.children;
    for(let i=0; i<dots.length; i++) {
        dots[i].className = 'nav-dot';
        if(i === currentIndex) dots[i].classList.add('active');
        if(userAnswers[i] !== null) dots[i].classList.add('answered');
    }
}

function loadQuestion(index) {
    if(index < 0 || index >= questions.length) return;
    currentIndex = index;
    const q = questions[index];
    
    progressText.innerText = `Въпрос ${q.id}/50`;
    updateNav();
    updateButtons();
    
    let html = `
        <div class="question-meta">
            <span>Модул ${q.module} | Въпрос ${q.id}</span>
            <span>${q.points} т.</span>
        </div>
        <div class="question-text">${q.text}</div>
    `;

    if(q.type === 'open') {
        html += `
            <button class="btn btn-sm" onclick="toggleSolution(${index})" style="margin-bottom: 15px;">Покажи Решение</button>
            <div class="open-solution" id="sol-${index}">
                ${q.solution}
                <div style="margin-top: 15px; font-size: 0.9rem; color: var(--muted);">Оценете себе си:</div>
                <div class="self-grade-btns">
                    <button class="btn btn-sm" onclick="selfGrade(${index}, true)" style="background-color: var(--success);">Правилно (${q.points} т.)</button>
                    <button class="btn btn-sm" onclick="selfGrade(${index}, false)" style="background-color: var(--error);">Грешно (0 т.)</button>
                </div>
            </div>
        `;
    } else {
        html += `<div class="options-container">`;
        const prefixes = ["А", "Б", "В", "Г"];
        q.options.forEach((opt, i) => {
            let optClass = "option";
            // Restore state if already answered
            if(userAnswers[index] !== null) {
                optClass += " disabled";
                if(i === q.correct) optClass += " correct";
                if(userAnswers[index] === i && i !== q.correct) optClass += " wrong";
            }
            html += `
                <div class="${optClass}" onclick="selectOption(${index}, ${i})">
                    <span class="option-prefix">${prefixes[i]}</span>
                    <span>${opt}</span>
                </div>
            `;
        });
        html += `</div>`;
        
        // Feedback
        if(userAnswers[index] !== null) {
            const isCorrect = userAnswers[index] === q.correct;
            html += `
                <div class="feedback ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
                    ${isCorrect ? '✓ Правилен отговор!' : '✗ Грешен отговор! Правилният е: ' + prefixes[q.correct]}
                </div>
            `;
        }
    }
    
    questionCard.innerHTML = html;
}

function selectOption(qIndex, optIndex) {
    if(userAnswers[qIndex] !== null) return; // Already answered
    
    userAnswers[qIndex] = optIndex;
    const q = questions[qIndex];
    
    if(optIndex === q.correct) {
        userScores[qIndex] = q.points;
    } else {
        userScores[qIndex] = 0;
    }
    
    updateScore();
    loadQuestion(qIndex); // Reload to show feedback and disable options
    updateNav();
}

function toggleSolution(qIndex) {
    const sol = document.getElementById(`sol-${qIndex}`);
    sol.style.display = sol.style.display === 'block' ? 'none' : 'block';
}

function selfGrade(qIndex, isCorrect) {
    const q = questions[qIndex];
    userAnswers[qIndex] = isCorrect ? 'correct' : 'wrong';
    userScores[qIndex] = isCorrect ? q.points : 0;
    updateScore();
    updateNav();
    
    // Disable buttons after grading
    const btns = document.querySelectorAll(`#sol-${qIndex} .self-grade-btns button`);
    btns.forEach(b => b.disabled = true);
}

function updateScore() {
    const total = userScores.reduce((a, b) => a + b, 0);
    scoreText.innerText = `Точки: ${total}/100`;
}

function navigate(dir) {
    loadQuestion(currentIndex + dir);
}

function updateButtons() {
    prevBtn.disabled = currentIndex === 0;
    if(currentIndex === questions.length - 1) {
        nextBtn.innerText = 'Приключи';
        nextBtn.onclick = showResults;
    } else {
        nextBtn.innerText = 'Напред →';
        nextBtn.onclick = () => navigate(1);
    }
}

function showResults() {
    examScreen.classList.remove('active');
    resultScreen.classList.add('active');
    
    const total = userScores.reduce((a, b) => a + b, 0);
    const pct = total; // out of 100
    
    document.getElementById('result-score').innerText = total;
    document.getElementById('result-circle').style.setProperty('--pct', pct + '%');
    
    let msg = "";
    if(pct >= 90) msg = "Отличен резултат!";
    else if(pct >= 70) msg = "Много добър резултат!";
    else if(pct >= 50) msg = "Добър резултат.";
    else msg = "Има още какво да учим!";
    
    document.getElementById('result-msg').innerText = msg + ` (${total}/100 точки)`;
}

// Initialize Nav
buildNav();
</script>

</body>
</html>
