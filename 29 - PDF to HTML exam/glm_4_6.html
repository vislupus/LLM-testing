<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Exam System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #06b6d4;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .exam-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .exam-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px;
            text-align: center;
        }

        .exam-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .exam-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .exam-body {
            padding: 30px;
            min-height: 400px;
        }

        .start-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .start-screen h2 {
            font-size: 1.8rem;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .start-screen p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .exam-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .info-card {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .info-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .info-card .label {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-success {
            background: var(--success-color);
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: var(--warning-color);
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .question-container {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .question-number {
            background: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .question-type {
            background: var(--bg-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: var(--text-primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option:hover {
            border-color: var(--primary-color);
            background: white;
            transform: translateX(5px);
        }

        .option.selected {
            border-color: var(--primary-color);
            background: rgba(79, 70, 229, 0.1);
        }

        .option.correct {
            border-color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
        }

        .option.incorrect {
            border-color: var(--error-color);
            background: rgba(239, 68, 68, 0.1);
        }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-color);
        }

        .option-label {
            flex: 1;
            font-size: 1.05rem;
        }

        .option-letter {
            width: 30px;
            height: 30px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .fill-blank-input {
            width: 200px;
            padding: 10px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            margin: 0 5px;
            transition: var(--transition);
        }

        .fill-blank-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
        }

        .progress-bar {
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
            transition: width 0.5s ease-out;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .feedback.incorrect {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .feedback-explanation {
            margin-top: 10px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .results-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            margin: 30px auto;
            position: relative;
        }

        .score-circle svg {
            transform: rotate(-90deg);
        }

        .score-circle-bg {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 10;
        }

        .score-circle-fill {
            fill: none;
            stroke: var(--success-color);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease-out;
        }

        .score-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .results-message {
            font-size: 1.5rem;
            margin: 20px 0;
            color: var(--text-primary);
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .stat-card {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .question-review {
            text-align: left;
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
        }

        .review-item {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .review-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .review-icon.correct {
            background: var(--success-color);
            color: white;
        }

        .review-icon.incorrect {
            background: var(--error-color);
            color: white;
        }

        .review-text {
            flex: 1;
            font-size: 0.95rem;
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .timer.warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .timer.danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @media (max-width: 768px) {
            .exam-header h1 {
                font-size: 1.5rem;
            }

            .exam-body {
                padding: 20px;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .navigation {
                flex-direction: column;
                gap: 15px;
            }

            .navigation .btn {
                width: 100%;
            }

            .fill-blank-input {
                width: 100%;
                max-width: 200px;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="exam-container">
        <header class="exam-header">
            <h1>📚 Interactive Exam System</h1>
            <p>Test your knowledge with our comprehensive exam</p>
        </header>

        <main class="exam-body" id="examBody">
            <!-- Content will be dynamically inserted here -->
        </main>
    </div>

    <script>
        // Exam data structure - easily modifiable when PDF content is available
        const examData = {
            title: "General Knowledge Exam",
            duration: 1800, // 30 minutes in seconds
            passingScore: 70,
            questions: [
                {
                    id: 1,
                    type: "multiple-choice",
                    question: "What is the capital of France?",
                    options: ["London", "Berlin", "Paris", "Madrid"],
                    correct: 2,
                    explanation: "Paris has been the capital of France since 987 AD."
                },
                {
                    id: 2,
                    type: "multiple-choice",
                    question: "Which planet is known as the Red Planet?",
                    options: ["Venus", "Mars", "Jupiter", "Saturn"],
                    correct: 1,
                    explanation: "Mars appears red due to iron oxide on its surface."
                },
                {
                    id: 3,
                    type: "true-false",
                    question: "The Great Wall of China is visible from space with the naked eye.",
                    options: ["True", "False"],
                    correct: 1,
                    explanation: "This is a common myth. The Great Wall is not visible from space without aid."
                },
                {
                    id: 4,
                    type: "multiple-choice",
                    question: "Who painted the Mona Lisa?",
                    options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Michelangelo"],
                    correct: 2,
                    explanation: "Leonardo da Vinci painted the Mona Lisa between 1503 and 1519."
                },
                {
                    id: 5,
                    type: "fill-blank",
                    question: "The largest ocean on Earth is the ______ Ocean.",
                    correct: ["Pacific", "pacific"],
                    explanation: "The Pacific Ocean covers about 46% of Earth's water surface."
                },
                {
                    id: 6,
                    type: "multiple-choice",
                    question: "What is the chemical symbol for gold?",
                    options: ["Go", "Gd", "Au", "Ag"],
                    correct: 2,
                    explanation: "Au comes from the Latin word for gold, 'aurum'."
                },
                {
                    id: 7,
                    type: "multiple-choice",
                    question: "In which year did World War II end?",
                    options: ["1943", "1944", "1945", "1946"],
                    correct: 2,
                    explanation: "World War II ended in 1945 with the surrender of Japan."
                },
                {
                    id: 8,
                    type: "multiple-choice",
                    question: "What is the smallest prime number?",
                    options: ["0", "1", "2", "3"],
                    correct: 2,
                    explanation: "2 is the smallest and only even prime number."
                },
                {
                    id: 9,
                    type: "multiple-choice",
                    question: "Which programming language is known as the 'language of the web'?",
                    options: ["Python", "JavaScript", "Java", "C++"],
                    correct: 1,
                    explanation: "JavaScript is essential for web development and runs in all browsers."
                },
                {
                    id: 10,
                    type: "true-false",
                    question: "Mount Everest is the tallest mountain in the world when measured from sea level.",
                    options: ["True", "False"],
                    correct: 0,
                    explanation: "Mount Everest's peak is 8,848 meters above sea level, making it the tallest."
                }
            ]
        };

        // Exam state management
        let examState = {
            currentQuestion: 0,
            answers: [],
            startTime: null,
            endTime: null,
            timerInterval: null,
            timeRemaining: examData.duration,
            isSubmitted: false
        };

        // Initialize exam
        function initExam() {
            showStartScreen();
        }

        // Show start screen
        function showStartScreen() {
            const examBody = document.getElementById('examBody');
            examBody.innerHTML = `
                <div class="start-screen">
                    <h2>Welcome to the Exam!</h2>
                    <p>This exam contains ${examData.questions.length} questions covering various topics. 
                    You have ${Math.floor(examData.duration / 60)} minutes to complete it. 
                    You need ${examData.passingScore}% to pass.</p>
                    
                    <div class="exam-info">
                        <div class="info-card">
                            <div class="number">${examData.questions.length}</div>
                            <div class="label">Questions</div>
                        </div>
                        <div class="info-card">
                            <div class="number">${Math.floor(examData.duration / 60)}</div>
                            <div class="label">Minutes</div>
                        </div>
                        <div class="info-card">
                            <div class="number">${examData.passingScore}%</div>
                            <div class="label">Passing Score</div>
                        </div>
                    </div>
                    
                    <button class="btn" onclick="startExam()">
                        <span>🚀</span> Start Exam
                    </button>
                </div>
            `;
        }

        // Start exam
        function startExam() {
            examState.currentQuestion = 0;
            examState.answers = new Array(examData.questions.length).fill(null);
            examState.startTime = new Date();
            examState.timeRemaining = examData.duration;
            examState.isSubmitted = false;
            
            startTimer();
            showQuestion();
        }

        // Timer functionality
        function startTimer() {
            examState.timerInterval = setInterval(() => {
                examState.timeRemaining--;
                updateTimerDisplay();
                
                if (examState.timeRemaining <= 0) {
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerElement = document.getElementById('timer');
            if (!timerElement) return;
            
            const minutes = Math.floor(examState.timeRemaining / 60);
            const seconds = examState.timeRemaining % 60;
            const timeString = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            timerElement.innerHTML = `<span>⏱️</span> ${timeString}`;
            
            // Add warning classes
            timerElement.classList.remove('warning', 'danger');
            if (examState.timeRemaining <= 300) { // 5 minutes
                timerElement.classList.add('danger');
            } else if (examState.timeRemaining <= 600) { // 10 minutes
                timerElement.classList.add('warning');
            }
        }

        function stopTimer() {
            if (examState.timerInterval) {
                clearInterval(examState.timerInterval);
                examState.timerInterval = null;
            }
        }

        // Show current question
        function showQuestion() {
            const question = examData.questions[examState.currentQuestion];
            const examBody = document.getElementById('examBody');
            
            let questionContent = '';
            
            if (question.type === 'multiple-choice' || question.type === 'true-false') {
                questionContent = `
                    <div class="options-container">
                        ${question.options.map((option, index) => `
                            <label class="option ${examState.answers[examState.currentQuestion] === index ? 'selected' : ''}">
                                <input type="radio" name="q${question.id}" value="${index}" 
                                    ${examState.answers[examState.currentQuestion] === index ? 'checked' : ''}
                                    onchange="selectAnswer(${index})">
                                <span class="option-letter">${String.fromCharCode(65 + index)}</span>
                                <span class="option-label">${option}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
            } else if (question.type === 'fill-blank') {
                const currentAnswer = examState.answers[examState.currentQuestion] || '';
                questionContent = `
                    <div class="options-container">
                        <div style="font-size: 1.1rem; line-height: 1.8;">
                            ${question.question.replace('_____', `
                                <input type="text" class="fill-blank-input" 
                                    value="${currentAnswer}"
                                    placeholder="Type your answer..."
                                    oninput="selectAnswer(this.value)">
                            `)}
                        </div>
                    </div>
                `;
            }
            
            examBody.innerHTML = `
                <div class="question-container">
                    <div class="question-header">
                        <span class="question-number">Question ${examState.currentQuestion + 1} of ${examData.questions.length}</span>
                        <span class="question-type">${question.type.replace('-', ' ')}</span>
                        <div class="timer" id="timer">
                            <span>⏱️</span> ${Math.floor(examState.timeRemaining / 60)}:${(examState.timeRemaining % 60).toString().padStart(2, '0')}
                        </div>
                    </div>
                    
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${((examState.currentQuestion + 1) / examData.questions.length) * 100}%"></div>
                    </div>
                    
                    <div class="question-text">${question.question}</div>
                    
                    ${questionContent}
                    
                    <div class="feedback" id="feedback"></div>
                    
                    <div class="navigation">
                        <button class="btn btn-secondary" onclick="previousQuestion()" 
                            ${examState.currentQuestion === 0 ? 'style="visibility: hidden;"' : ''}>
                            ← Previous
                        </button>
                        
                        <button class="btn" onclick="checkAnswer()">
                            <span>✓</span> Check Answer
                        </button>
                        
                        ${examState.currentQuestion === examData.questions.length - 1 ? 
                            `<button class="btn btn-success" onclick="submitExam()">
                                <span>📝</span> Submit Exam
                            </button>` :
                            `<button class="btn" onclick="nextQuestion()">
                                Next →
                            </button>`
                        }
                    </div>
                </div>
            `;
            
            updateTimerDisplay();
        }

        // Handle answer selection
        function selectAnswer(answer) {
            examState.answers[examState.currentQuestion] = answer;
            
            // Update UI for visual feedback
            if (typeof answer === 'number') {
                document.querySelectorAll('.option').forEach((opt, index) => {
                    opt.classList.toggle('selected', index === answer);
                });
            }
        }

        // Check answer with feedback
        function checkAnswer() {
            const question = examData.questions[examState.currentQuestion];
            const feedback = document.getElementById('feedback');
            const userAnswer = examState.answers[examState.currentQuestion];
            
            if (userAnswer === null || userAnswer === '') {
                feedback.className = 'feedback incorrect show';
                feedback.innerHTML = `
                    <div class="feedback-title">⚠️ Please select an answer first</div>
                `;
                return;
            }
            
            let isCorrect = false;
            
            if (question.type === 'fill-blank') {
                isCorrect = question.correct.includes(userAnswer.toLowerCase().trim());
            } else {
                isCorrect = userAnswer === question.correct;
            }
            
            if (isCorrect) {
                feedback.className = 'feedback correct show';
                feedback.innerHTML = `
                    <div class="feedback-title">✅ Correct!</div>
                    ${question.explanation ? `<div class="feedback-explanation">${question.explanation}</div>` : ''}
                `;
            } else {
                feedback.className = 'feedback incorrect show';
                feedback.innerHTML = `
                    <div class="feedback-title">❌ Incorrect</div>
                    ${question.explanation ? `<div class="feedback-explanation">${question.explanation}</div>` : ''}
                `;
            }
            
            // Highlight correct/incorrect options
            if (question.type === 'multiple-choice' || question.type === 'true-false') {
                document.querySelectorAll('.option').forEach((opt, index) => {
                    if (index === question.correct) {
                        opt.classList.add('correct');
                    } else if (index === userAnswer && !isCorrect) {
                        opt.classList.add('incorrect');
                    }
                });
            }
        }

        // Navigation functions
        function previousQuestion() {
            if (examState.currentQuestion > 0) {
                examState.currentQuestion--;
                showQuestion();
            }
        }

        function nextQuestion() {
            if (examState.currentQuestion < examData.questions.length - 1) {
                examState.currentQuestion++;
                showQuestion();
            }
        }

        // Submit exam
        function submitExam() {
            if (examState.isSubmitted) return;
            
            examState.isSubmitted = true;
            examState.endTime = new Date();
            stopTimer();
            
            const score = calculateScore();
            const percentage = Math.round((score / examData.questions.length) * 100);
            const passed = percentage >= examData.passingScore;
            const timeTaken = examData.duration - examState.timeRemaining;
            
            const examBody = document.getElementById('examBody');
            examBody.innerHTML = `
                <div class="results-screen">
                    <h2>${passed ? '🎉 Congratulations!' : '📊 Exam Results'}</h2>
                    
                    <div class="score-circle">
                        <svg width="150" height="150">
                            <circle class="score-circle-bg" cx="75" cy="75" r="65"></circle>
                            <circle class="score-circle-fill" cx="75" cy="75" r="65"
                                stroke-dasharray="${2 * Math.PI * 65}"
                                stroke-dashoffset="${2 * Math.PI * 65 * (1 - percentage / 100)}">
                            </circle>
                        </svg>
                        <div class="score-text">${percentage}%</div>
                    </div>
                    
                    <div class="results-message">
                        ${passed ? 'You passed the exam!' : `You need ${examData.passingScore}% to pass. Keep practicing!`}
                    </div>
                    
                    <div class="results-stats">
                        <div class="stat-card">
                            <div class="stat-value">${score}/${examData.questions.length}</div>
                            <div class="stat-label">Correct Answers</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${Math.floor(timeTaken / 60)}:${(timeTaken % 60).toString().padStart(2, '0')}</div>
                            <div class="stat-label">Time Taken</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${percentage}%</div>
                            <div class="stat-label">Score</div>
                        </div>
                    </div>
                    
                    <div class="question-review">
                        <h3 style="margin-bottom: 15px;">Question Review</h3>
                        ${examData.questions.map((q, index) => {
                            const userAnswer = examState.answers[index];
                            const isCorrect = q.type === 'fill-blank' ? 
                                (userAnswer && q.correct.includes(userAnswer.toLowerCase().trim())) :
                                userAnswer === q.correct;
                            
                            return `
                                <div class="review-item">
                                    <div class="review-icon ${isCorrect ? 'correct' : 'incorrect'}">
                                        ${isCorrect ? '✓' : '✗'}
                                    </div>
                                    <div class="review-text">
                                        Question ${index + 1}: ${q.question.substring(0, 50)}...
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <div style="margin-top: 30px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                        <button class="btn" onclick="retakeExam()">
                            <span>🔄</span> Retake Exam
                        </button>
                        <button class="btn btn-secondary" onclick="showStartScreen()">
                            <span>🏠</span> Back to Home
                        </button>
                    </div>
                </div>
            `;
        }

        // Calculate score
        function calculateScore() {
            let score = 0;
            examData.questions.forEach((question, index) => {
                const userAnswer = examState.answers[index];
                if (userAnswer === null || userAnswer === '') return;
                
                if (question.type === 'fill-blank') {
                    if (question.correct.includes(userAnswer.toLowerCase().trim())) {
                        score++;
                    }
                } else {
                    if (userAnswer === question.correct) {
                        score++;
                    }
                }
            });
            return score;
        }

        // Retake exam
        function retakeExam() {
            examState = {
                currentQuestion: 0,
                answers: [],
                startTime: null,
                endTime: null,
                timerInterval: null,
                timeRemaining: examData.duration,
                isSubmitted: false
            };
            startExam();
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initExam);

        // Prevent accidental page refresh during exam
        window.addEventListener('beforeunload', (e) => {
            if (examState.startTime && !examState.isSubmitted) {
                e.preventDefault();
                e.returnValue = 'You have an exam in progress. Are you sure you want to leave?';
            }
        });
    </script>
</body>
</html>
