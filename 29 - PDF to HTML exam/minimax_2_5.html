<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Държавен зрелостен изпит по физика и астрономия 2018</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .start-screen h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .start-screen .subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .exam-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .exam-info-item {
            background: #f1f5f9;
            padding: 15px 25px;
            border-radius: 10px;
        }

        .exam-info-item .label {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .exam-info-item .value {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
        }

        .start-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        /* Header */
        .exam-header {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .exam-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }

        .exam-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .stat-icon {
            width: 20px;
            height: 20px;
        }

        .progress-bar {
            width: 120px;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .question-card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-number {
            background: var(--primary);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .question-status {
            display: flex;
            gap: 8px;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .status-answered {
            background: #dbeafe;
            color: var(--primary);
        }

        .status-correct {
            background: #dcfce7;
            color: var(--success);
        }

        .status-wrong {
            background: #fee2e2;
            color: var(--error);
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: var(--text);
        }

        .question-formula {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1rem;
            overflow-x: auto;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 15px 18px;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover:not(.disabled) {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .option.selected {
            border-color: var(--primary);
            background: #dbeafe;
        }

        .option.correct {
            border-color: var(--success);
            background: #dcfce7;
        }

        .option.incorrect {
            border-color: var(--error);
            background: #fee2e2;
        }

        .option.disabled {
            cursor: default;
            opacity: 0.8;
        }

        .option-marker {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option.selected .option-marker {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .option.correct .option-marker {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .option.incorrect .option-marker {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }

        .option-text {
            flex: 1;
            padding-top: 3px;
        }

        /* Feedback */
        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #dcfce7;
            border: 1px solid var(--success);
            color: #166534;
        }

        .feedback.incorrect {
            background: #fee2e2;
            border: 1px solid var(--error);
            color: #991b1b;
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Navigation */
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .nav-btn:disabled {
            background: var(--border);
            color: var(--text-light);
            cursor: not-allowed;
        }

        .nav-btn.secondary {
            background: #f1f5f9;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .nav-btn.secondary:hover:not(:disabled) {
            background: #e2e8f0;
        }

        .check-btn {
            background: var(--success);
        }

        .check-btn:hover:not(:disabled) {
            background: #16a34a !important;
        }

        /* Question Navigator */
        .question-navigator {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }

        .navigator-title {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 12px;
        }

        .navigator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
        }

        .nav-item {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: #f1f5f9;
            color: var(--text);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item:hover {
            background: #e2e8f0;
        }

        .nav-item.current {
            background: var(--primary);
            color: white;
        }

        .nav-item.answered {
            background: #dbeafe;
            color: var(--primary);
        }

        .nav-item.correct {
            background: var(--success);
            color: white;
        }

        .nav-item.wrong {
            background: var(--error);
            color: white;
        }

        /* Results Screen */
        .results-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }

        .results-screen.show {
            display: block;
        }

        .results-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .results-icon.excellent {
            background: #dcfce7;
        }

        .results-icon.good {
            background: #dbeafe;
        }

        .results-icon.needs-work {
            background: #fee2e2;
        }

        .results-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--text);
        }

        .results-subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .results-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .results-stat {
            text-align: center;
        }

        .results-stat .value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .results-stat .label {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .results-breakdown {
            text-align: left;
            max-width: 500px;
            margin: 0 auto 30px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .breakdown-row:last-child {
            border-bottom: none;
        }

        .breakdown-label {
            color: var(--text-light);
        }

        .breakdown-value {
            font-weight: 600;
        }

        .breakdown-value.correct {
            color: var(--success);
        }

        .breakdown-value.wrong {
            color: var(--error);
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .question-card {
                padding: 20px 15px;
            }

            .exam-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .navigation {
                flex-wrap: wrap;
            }

            .nav-btn {
                flex: 1;
                justify-content: center;
            }

            .option {
                padding: 12px 15px;
            }

            .start-screen h1 {
                font-size: 1.5rem;
            }

            .exam-info {
                flex-direction: column;
                gap: 15px;
            }
        }

        /* Hidden utility */
        .hidden {
            display: none !important;
        }

        /* Question types styling */
        .question-type {
            display: inline-block;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 4px;
            margin-left: 10px;
            background: #e0e7ff;
            color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h1>Държавен зрелостен изпит</h1>
            <h2>по физика и астрономия</h2>
            <p class="subtitle">23 май 2018 г. – Вариант 1</p>

            <div class="exam-info">
                <div class="exam-info-item">
                    <div class="label">Брой въпроси</div>
                    <div class="value">50</div>
                </div>
                <div class="exam-info-item">
                    <div class="label">Време</div>
                    <div class="value">240 мин</div>
                </div>
                <div class="exam-info-item">
                    <div class="label">Макс. точки</div>
                    <div class="value">100</div>
                </div>
            </div>

            <button class="start-btn" onclick="startExam()">Започни изпита</button>
        </div>

        <!-- Exam Header -->
        <div class="exam-header hidden" id="examHeader">
            <div class="exam-title">ДЗИ по физика и астрономия 2018</div>
            <div class="exam-stats">
                <div class="stat">
                    <span>Въпрос</span>
                    <span id="currentQuestion">1</span>
                    <span>/</span>
                    <span id="totalQuestions">50</span>
                </div>
                <div class="stat">
                    <span>Точки:</span>
                    <span id="currentScore">0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Question Navigator -->
        <div class="question-navigator hidden" id="questionNavigator">
            <div class="navigator-title">Навигация по въпросите</div>
            <div class="navigator-grid" id="navigatorGrid"></div>
        </div>

        <!-- Question Card -->
        <div class="question-card" id="questionCard">
            <div class="question-header">
                <div class="question-number" id="questionNumber">Въпрос 1</div>
                <div class="question-status" id="questionStatus"></div>
            </div>

            <div class="question-text" id="questionText"></div>

            <div class="question-formula hidden" id="questionFormula"></div>

            <div class="options-list" id="optionsList"></div>

            <div class="feedback" id="feedback">
                <div class="feedback-title" id="feedbackTitle"></div>
                <div id="feedbackText"></div>
            </div>

            <div class="navigation">
                <button class="nav-btn secondary" id="prevBtn" onclick="prevQuestion()">
                    ← Предишен
                </button>
                <button class="nav-btn" id="checkBtn" onclick="checkAnswer()">
                    Провери
                </button>
                <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">
                    Следващ →
                </button>
            </div>
        </div>

        <!-- Results Screen -->
        <div class="results-screen" id="resultsScreen">
            <div class="results-icon" id="resultsIcon">🎉</div>
            <h2 class="results-title" id="resultsTitle">Изпитът завърши!</h2>
            <p class="results-subtitle" id="resultsSubtitle">Ето как се справихте:</p>

            <div class="results-stats">
                <div class="results-stat">
                    <div class="value" id="finalScore">0</div>
                    <div class="label">Точки</div>
                </div>
                <div class="results-stat">
                    <div class="value" id="finalPercent">0%</div>
                    <div class="label">Успех</div>
                </div>
            </div>

            <div class="results-breakdown" id="resultsBreakdown">
                <!-- Filled by JS -->
            </div>

            <button class="restart-btn" onclick="restartExam()">Нов опит</button>
        </div>
    </div>

    <script>
        // Exam Data - Questions 1-40 (Multiple Choice with Answers)
        const examData = [
            {
                id: 1,
                text: "Два електрични точкови заряда се намират във вакуум на разстояние r един от друг. Как ще се промени силата F на тяхното взаимодействие, ако разстоянието между тях се увеличи два пъти?",
                options: ["A) ще намалее два пъти", "Б) ще намалее четири пъти", "B) ще намалее осем пъти", "Г) ще се увеличи два пъти"],
                correct: 1, // Б
                explanation: "Според закона на Кулон, силата на взаимодействие между два точкови заряда е обратно пропорционална на квадрата на разстоянието: F ~ 1/r². Ако разстоянието се увеличи 2 пъти, силата ще намалее 2² = 4 пъти."
            },
            {
                id: 2,
                text: "На коя фигура са показани силовите линии на електростатично поле, създадено от положителен точков заряд q?",
                options: ["A)radiating outward", "Б) converging inward", "B) parallel lines", "Г) circular pattern"],
                correct: 0, // A
                explanation: "Силовите линии на електростатично поле, създадено от положителен точков заряд, излизат радиално от заряда."
            },
            {
                id: 3,
                text: "Електростатично поле е създадено от заряд Q. Сравнете интензитета E на полето в точките A, B и C от фигурата.",
                options: ["A) E_A > E_B = E_C", "Б) E_A < E_B = E_C", "B) E_A = E_B > E_C", "Г) E_A > E_B > E_C"],
                correct: 1, // Б
                explanation: "Интензитетът на електричното поле намалява с разстоянието от заряда. Тъй като точка A е най-близо до заряда Q, а B и C са на едно и също разстояние, следва: E_A < E_B = E_C."
            },
            {
                id: 4,
                text: "Точков заряд q се намира в електростатично поле. Ако знаем големината q на заряда и интензитета E на полето в точката, в която се намира заряда, можем да намерим:",
                options: ["A) скоростта v на заряда, с която той преминава през тази точка", "Б) големината на силата F, с която полето действа на заряда", "B) кинетичната енергия на заряда в тази точка", "Г) потенциалната енергия на заряда в тази точка"],
                correct: 1, // Б
                explanation: "Силата, която електричното поле упражнява върху заряд, се определя от формулата F = qE. Следователно, ако знаем q и E, можем да намерим F."
            },
            {
                id: 5,
                text: "С явлението електростатична индукция се обяснява:",
                options: ["A) полярното сияние", "Б) небесната дъга", "B) привличането на железни стружки от магнит", "Г) електростатичното екраниране"],
                correct: 3, // Г
                explanation: "Електростатичната индукция е явление, при което електрически заряди се преразпределят в проводник под влияние на външно електрическо поле. Това е основата на електростатичното екраниране."
            },
            {
                id: 6,
                text: "Зарядите, които се придвижват свободно в металите, са:",
                options: ["A) електрони", "Б) дупки", "B) положителни йони", "Г) отрицателни йони"],
                correct: 0, // A
                explanation: "В металите свободните носители на заряд са електроните на проводимостта."
            },
            {
                id: 7,
                text: "Коя от посочените измерителни единици е за електричен ток?",
                options: ["A) kV (киловолт)", "Б) MΩ (мегаом)", "B) mA (милиампер)", "Г) W (ват)"],
                correct: 2, // B - mA
                explanation: "Ампер (A) е единицата за електричен ток. Милиампер (mA) е 1/1000 от ампер."
            },
            {
                id: 8,
                text: "Меден проводник има два пъти по-малка дължина и два пъти по-голям диаметър на кръговото си сечение от друг меден проводник. Кое от твърденията е вярно?",
                options: ["A) Двата проводника имат едно и също специфично съпротивление", "Б) Двата проводника имат едно и също съпротивление", "B) Двата проводника имат един и същ обем", "Г) Двата проводника имат една и съща маса"],
                correct: 0, // A
                explanation: "Специфичното съпротивление ρ е материална константа и не зависи от размерите на проводника. Тъй като и двата са медни, те имат едно и също ρ."
            },
            {

                answer: "A) R = R₁ + R₂ + R₃ = 1 + 2 + 6 = 9 Ω\nБ) При успоредно свързване: 1/R = 1/R₁ + 1/R₂ + 1/R₃"
            },
            {
                id: 44,
                text: "На графиката са представени стойностите на тока през един резистор при различни стойности на напрежението, приложено в краищата му.",
                subQuestions: [
                    "A) Пресметнете съпротивлението на резистора.",
                    "Б) Какъв ток ще протече през този резистор, когато се свърже към източник с напрежение 3 V?"
                ],
                answer: "A) R = U/I = 20V/0.1A = 200 Ω\nБ) I = U/R = 3V/200Ω = 0.015 A = 15 mA"
            },
            {
                id: 45,
                text: "Пружинно махало, състоящо се от пружина с коефициент на еластичност k и тяло с маса m = 4 kg, има период T = 6 s. (Приемете π² ≈ 10)",
                subQuestions: [
                    "A) Намерете коефициента на еластичност k на пружината.",
                    "Б) Колко ще е новият период на трептене T₁, ако тялото се замени с друго, което има 4 пъти по-малка маса?"
                ],
                answer: "A) T = 2π√(m/k), k = 4π²m/T² = 4·10·4/36 = 40/9 ≈ 4.44 N/m\nБ) T₁ = T/2 = 3 s"
            }
        ];

        // State
        let currentQuestionIndex = 0;
        let score = 0;
        let answers = {};
        let results = {};

        // Initialize
        function init() {
            createNavigator();
            showQuestion(0);
        }

        function createNavigator() {
            const grid = document.getElementById('navigatorGrid');
            grid.innerHTML = '';

            for (let i = 0; i < examData.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'nav-item';
                btn.textContent = i + 1;
                btn.onclick = () => goToQuestion(i);
                grid.appendChild(btn);
            }
        }

        function updateNavigator() {
            const items = document.querySelectorAll('.nav-item');
            items.forEach((item, index) => {
                item.classList.remove('current', 'answered', 'correct', 'wrong');

                if (index === currentQuestionIndex) {
                    item.classList.add('current');
                } else if (answers[index] !== undefined) {
                    item.classList.add('answered');
                    if (results[index]) {
                        item.classList.add('correct');
                    } else {
                        item.classList.add('wrong');
                    }
                }
            });
        }

        function showQuestion(index) {
            currentQuestionIndex = index;
            const question = examData[index];

            document.getElementById('currentQuestion').textContent = index + 1;
            document.getElementById('questionNumber').textContent = `Въпрос ${index + 1}`;
            document.getElementById('questionText').textContent = question.text;

            // Show/hide formula area
            const formulaEl = document.getElementById('questionFormula');
            if (question.formula) {
                formulaEl.textContent = question.formula;
                formulaEl.classList.remove('hidden');
            } else {
                formulaEl.classList.add('hidden');
            }

            // Render options
            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            question.options.forEach((opt, i) => {
                const option = document.createElement('div');
                option.className = 'option';
                option.onclick = () => selectOption(i);

                const marker = document.createElement('div');
                marker.className = 'option-marker';
                marker.textContent = String.fromCharCode(65 + i); // A, B, C, D

                const text = document.createElement('div');
                text.className = 'option-text';
                text.textContent = opt;

                option.appendChild(marker);
                option.appendChild(text);
                optionsList.appendChild(option);
            });

            // Update button states
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === examData.length - 1;

            // Show check button only if not answered
            const checkBtn = document.getElementById('checkBtn');
            if (answers[index] !== undefined) {
                checkBtn.style.display = 'none';
                showFeedback(index);
            } else {
                checkBtn.style.display = 'block';
                document.getElementById('feedback').classList.remove('show');
            }

            // Update progress
            const answered = Object.keys(answers).length;
            document.getElementById('progressFill').style.width = `${(answered / examData.length) * 100}%`;

            updateNavigator();
        }

        function selectOption(index) {
            if (answers[currentQuestionIndex] !== undefined) return;

            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                if (i === index) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }

        function checkAnswer() {
            const selected = document.querySelector('.option.selected');
            if (!selected) return;

            const selectedIndex = Array.from(document.querySelectorAll('.option')).indexOf(selected);
            const question = examData[currentQuestionIndex];

            answers[currentQuestionIndex] = selectedIndex;

            const isCorrect = selectedIndex === question.correct;
            results[currentQuestionIndex] = isCorrect;

            if (isCorrect) {
                score += 1.5; // 1.5 points per question
            }

            // Show correct/incorrect
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === question.correct) {
                    opt.classList.add('correct');
                } else if (i === selectedIndex && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            // Update score display
            document.getElementById('currentScore').textContent = score.toFixed(1);

            showFeedback(currentQuestionIndex);
            document.getElementById('checkBtn').style.display = 'none';

            updateNavigator();
        }

        function showFeedback(index) {
            const question = examData[index];
            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackText = document.getElementById('feedbackText');

            if (results[index]) {
                feedback.className = 'feedback show correct';
                feedbackTitle.textContent = '✓ Вярно!';
                feedbackTitle.innerHTML = '✓ Вярно!';
            } else {
                feedback.className = 'feedback show incorrect';
                feedbackTitle.innerHTML = '✗ Неправилно';
            }

            feedbackText.textContent = question.explanation;
        }

        function nextQuestion() {
            if (currentQuestionIndex < examData.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        }

        function goToQuestion(index) {
            showQuestion(index);
        }

        function startExam() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('examHeader').classList.remove('hidden');
            document.getElementById('questionNavigator').classList.remove('hidden');
            document.getElementById('questionCard').classList.add('active');
            init();
        }

        function showResults() {
            const correctCount = Object.values(results).filter(r => r).length;
            const wrongCount = examData.length - correctCount;
            const percent = (correctCount / examData.length) * 100;

            document.getElementById('questionCard').classList.remove('active');
            document.getElementById('examHeader').classList.add('hidden');
            document.getElementById('questionNavigator').classList.add('hidden');
            document.getElementById('resultsScreen').classList.add('show');

            document.getElementById('finalScore').textContent = score.toFixed(1);
            document.getElementById('finalPercent').textContent = `${percent.toFixed(0)}%`;

            // Set icon and title based on score
            const icon = document.getElementById('resultsIcon');
            const title = document.getElementById('resultsTitle');

            if (percent >= 80) {
                icon.className = 'results-icon excellent';
                icon.textContent = '🏆';
                title.textContent = 'Отлично представяне!';
            } else if (percent >= 60) {
                icon.className = 'results-icon good';
                icon.textContent = '👍';
                title.textContent = 'Добро представяне!';
            } else {
                icon.className = 'results-icon needs-work';
                icon.textContent = '📚';
                title.textContent = 'Има още какво да се учи!';
            }

            // Breakdown
            const breakdown = document.getElementById('resultsBreakdown');
            breakdown.innerHTML = `
                <div class="breakdown-row">
                    <span class="breakdown-label">Правилни отговори</span>
                    <span class="breakdown-value correct">${correctCount}</span>
                </div>
                <div class="breakdown-row">
                    <span class="breakdown-label">Неправилни отговори</span>
                    <span class="breakdown-value wrong">${wrongCount}</span>
                </div>
                <div class="breakdown-row">
                    <span class="breakdown-label">Общо точки</span>
                    <span class="breakdown-value">${score.toFixed(1)} / ${examData.length * 1.5}</span>
                </div>
            `;

            // Add finish button
            const nav = document.querySelector('.navigation');
            if (nav) {
                nav.style.display = 'none';
            }

            // Add final navigation for results
            const resultsNav = document.createElement('div');
            resultsNav.className = 'navigation';
            resultsNav.style.justifyContent = 'center';
            resultsNav.innerHTML = `
                <button class="nav-btn" onclick="restartExam()">Нов опит</button>
            `;
            document.getElementById('resultsScreen').appendChild(resultsNav);
        }

        function restartExam() {
            score = 0;
            answers = {};
            results = {};
            currentQuestionIndex = 0;

            document.getElementById('currentScore').textContent = '0';
            document.getElementById('resultsScreen').classList.remove('show');
            document.getElementById('examHeader').classList.remove('hidden');
            document.getElementById('questionNavigator').classList.remove('hidden');
            document.getElementById('questionCard').classList.add('active');

            init();
        }

        // Modify next button to show results on last question
        const originalNextQuestion = nextQuestion;
        nextQuestion = function() {
            if (currentQuestionIndex < examData.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            } else {
                showResults();
            }
        };

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('totalQuestions').textContent = examData.length;
        });
    </script>
</body>
</html>
