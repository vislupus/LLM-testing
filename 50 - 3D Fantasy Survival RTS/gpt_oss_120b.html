<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realm of Ember – Mini‑RTS</title>
<style>
    body,html{margin:0;padding:0;overflow:hidden;width:100%;height:100%;font-family:sans-serif;background:#222}
    #ui{
        position:absolute;top:10px;left:10px;color:#fff;z-index:10;
        font-size:14px;pointer-events:none;
        text-shadow:0 0 3px #000;
    }
    .button{
        display:inline-block;margin:5px;padding:5px 10px;
        background:#333;background:rgba(0,0,0,.6);
        border:1px solid #555;cursor:pointer;pointer-events:auto;
    }
    #log{
        position:absolute;bottom:10px;left:10px;width:300px;height:120px;
        overflow-y:auto;background:rgba(0,0,0,.7);color:#eee;padding:5px;
        font-size:13px;border:1px solid #444;
    }
</style>
</head>
<body>
<div id="ui">
    <div>Gold: <span id="gold">0</span> | Wood: <span id="wood">0</span> | Pop: <span id="pop">0</span>/<span id="popCap">10</span></div>
    <div class="button" id="buildTown">Build Town Hall (200G, 100W)</div>
    <div class="button" id="trainWorker">Train Worker (50G, 20W)</div>
    <div class="button" id="trainSoldier">Train Soldier (80G, 40W)</div>
    <div class="button" id="trainHero">Train Hero (300G, 150W)</div>
</div>
<div id="log"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/controls/OrbitControls.js';

// ----------------------------------------------------------
// BASIC SETTINGS & GLOBALS
// ----------------------------------------------------------
const MAP_SIZE = 200;
const TILE_SIZE = 10;
const DAY_LENGTH = 60; // seconds for full day/night cycle

let resources = {gold:0, wood:0};
let population = {current:0, max:10};

const UI = {
    gold: document.getElementById('gold'),
    wood: document.getElementById('wood'),
    pop:  document.getElementById('pop'),
    popCap:document.getElementById('popCap'),
    log:   document.getElementById('log')
};

function log(msg){ UI.log.innerHTML += `<div>${msg}</div>`; UI.log.scrollTop = UI.log.scrollHeight; }

// ----------------------------------------------------------
// THREE.JS SETUP
// ----------------------------------------------------------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x001020, 0.015); // simple fog for “fog‑of‑war”

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,120,120);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,0,0);
controls.enablePan = false;
controls.minDistance = 80;
controls.maxDistance = 200;

// LIGHTING (day/night)
const hemiLight = new THREE.HemisphereLight(0x88ccee, 0x223344, 0.8);
scene.add(hemiLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(0,100,0);
scene.add(dirLight);

// GROUND
const groundGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 64, 64);
groundGeo.rotateX(-Math.PI/2);
const groundMat = new THREE.MeshLambertMaterial({color:0x447733});
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

// ----------------------------------------------------------
// SIMPLE OBJECT PROTOTYPES (no external models)
// ----------------------------------------------------------
function makeBox(w,h,d,color){
    const geo = new THREE.BoxGeometry(w,h,d);
    const mat = new THREE.MeshLambertMaterial({color});
    return new THREE.Mesh(geo,mat);
}
function makeCone(r,h,color){
    const geo = new THREE.ConeGeometry(r,h,6);
    const mat = new THREE.MeshLambertMaterial({color});
    return new THREE.Mesh(geo,mat);
}
function makeSphere(r,color){
    const geo = new THREE.SphereGeometry(r,8,8);
    const mat = new THREE.MeshLambertMaterial({color});
    return new THREE.Mesh(geo,mat);
}

// ----------------------------------------------------------
// ENTITIES
// ----------------------------------------------------------
class Entity{
    constructor(mesh){
        this.mesh = mesh;
        scene.add(mesh);
        this.alive = true;
        this.health = 100;
    }
    update(dt){}
    destroy(){
        scene.remove(this.mesh);
        this.alive = false;
    }
}
class Building extends Entity{
    constructor(type,pos){
        let mesh;
        switch(type){
            case 'TownHall': mesh = makeBox(12,8,12,0x8b4513); break;
            case 'LumberMill': mesh = makeBox(10,8,10,0x654321); break;
            case 'GoldMine': mesh = makeCone(6,12,0xd4af37); break;
        }
        mesh.position.copy(pos);
        super(mesh);
        this.type=type;
        this.pos=pos.clone();
    }
}
class ResourceNode extends Entity{
    constructor(type,pos){
        let mesh;
        const clr = (type==='Gold')?0xd4af37:0x8b4513;
        mesh = makeSphere(4,clr);
        mesh.position.copy(pos);
        super(mesh);
        this.type=type;
        this.amount = 500; // finite, but large enough
    }
}
class Unit extends Entity{
    constructor(type,pos,owner){
        let mesh;
        const colors = {
            'Worker':[0xeeeeee,0x555555],
            'Soldier':[0x5555ff,0x111166],
            'Hero':[0xffaa00,0x883300],
            'Enemy':[0xff5555,0x660000]
        };
        const [c1,c2] = colors[type];
        switch(type){
            case 'Worker': mesh = makeBox(2,4,2,c1); break;
            case 'Soldier': mesh = makeBox(3,6,3,c1); break;
            case 'Hero': mesh = makeBox(4,8,4,c1); break;
            case 'Enemy': mesh = makeBox(3,6,3,c1); break;
        }
        mesh.position.copy(pos);
        super(mesh);
        this.type=type;
        this.owner=owner; // 'player' or 'ai'
        this.speed = (type==='Worker')?15:(type==='Soldier' || type==='Enemy')?20:25;
        this.target = null; // THREE.Vector3
        this.path = []; // simple straight line
        this.carry = 0; // for workers
        this.maxHealth = (type==='Hero')?250:100;
        this.health = this.maxHealth;
    }
    moveTo(pos){
        this.target = pos.clone();
    }
    update(dt){
        if(!this.target) return;
        const dir = this.target.clone().sub(this.mesh.position);
        const dist = dir.length();
        if(dist<0.5){
            this.mesh.position.copy(this.target);
            this.target = null;
            this.onArrive();
        }else{
            dir.normalize();
            this.mesh.position.addScaledVector(dir, this.speed*dt);
        }
    }
    onArrive(){
        // overridden in subclasses
    }
}

// ----------------------------------------------------------
// GAME STATE
// ----------------------------------------------------------
const game = {
    buildings:[],
    resources:[],
    units:[],
    enemyBases:[],
    time:0,
    dayPhase:0 // 0..1   0 = midnight, 0.5 = noon
};

// ----------------------------------------------------------
// MAP SETUP
// ----------------------------------------------------------
function initMap(){
    // static resource nodes
    const goldPos = new THREE.Vector3(-50,2,-30);
    const woodPos = new THREE.Vector3(40,2,45);
    game.resources.push( new ResourceNode('Gold', goldPos ) );
    game.resources.push( new ResourceNode('Wood', woodPos ) );

    // player starting town hall
    const tlPos = new THREE.Vector3(0,4,0);
    const townHall = new Building('TownHall', tlPos);
    game.buildings.push(townHall);
    population.max = 10;
    log('Town Hall built at the heart of the realm.');

    // enemy base (simple)
    const enemyPos = new THREE.Vector3(80,4,80);
    const enemyBase = new Building('TownHall', enemyPos);
    enemyBase.owner='ai';
    game.enemyBases.push(enemyBase);
}
initMap();

// ----------------------------------------------------------
// UI HANDLERS
// ----------------------------------------------------------
document.getElementById('buildTown').onclick = ()=>{
    if(resources.gold>=200 && resources.wood>=100 && population.max+5<=30){
        resources.gold-=200; resources.wood-=100;
        const pos = new THREE.Vector3(
            (Math.random()-0.5)*MAP_SIZE*0.6,
            4,
            (Math.random()-0.5)*MAP_SIZE*0.6
        );
        const b = new Building('TownHall',pos);
        game.buildings.push(b);
        population.max+=5;
        log('New Town Hall erected.');
    }else log('Not enough resources or pop‑cap reached.');
};
document.getElementById('trainWorker').onclick = ()=>{
    if(resources.gold>=50 && resources.wood>=20 && population.current+1<=population.max){
        resources.gold-=50; resources.wood-=20;
        const pos = new THREE.Vector3(0,4,0);
        const w = new Unit('Worker', pos, 'player');
        w.onArrive = function(){
            // idle, look for nearest resource
            const nearest = game.resources.reduce((best,n)=> {
                const d = n.mesh.position.distanceTo(this.mesh.position);
                return (!best || d<best.d) ? {node:n,d:d} : best;
            },null);
            if(nearest && nearest.node.amount>0){
                this.targetResource = nearest.node;
                this.moveTo(nearest.node.mesh.position);
            }
        };
        game.units.push(w);
        population.current++;
        log('Worker recruited.');
    }else log('Not enough resources or pop‑cap reached.');
};
document.getElementById('trainSoldier').onclick = ()=>{
    if(resources.gold>=80 && resources.wood>=40 && population.current+1<=population.max){
        resources.gold-=80; resources.wood-=40;
        const s = new Unit('Soldier', new THREE.Vector3(0,4,0), 'player');
        s.onArrive = function(){
            // after move, stand patrolling around base
        };
        game.units.push(s);
        population.current++;
        log('Soldier trained.');
    }else log('Not enough resources or pop‑cap reached.');
};
document.getElementById('trainHero').onclick = ()=>{
    if(resources.gold>=300 && resources.wood>=150 && population.current+1<=population.max){
        resources.gold-=300; resources.wood-=150;
        const h = new Unit('Hero', new THREE.Vector3(0,4,0), 'player');
        h.onArrive = function(){};
        h.maxHealth = 250;
        h.health = h.maxHealth;
        game.units.push(h);
        population.current++;
        log('Hero entered the battlefield.');
    }else log('Not enough resources or pop‑cap reached.');
};

// ----------------------------------------------------------
// CORE LOGIC (economy, AI, combat)
// ----------------------------------------------------------
function updateEconomy(dt){
    // workers gathering
    game.units.forEach(u=>{
        if(u.type!=='Worker' || !u.alive) return;
        if(u.targetResource && !u.carry){
            // arriving at resource node
            if(u.mesh.position.distanceTo(u.targetResource.mesh.position)<1){
                // take some gold/wood
                const take = Math.min(10, u.targetResource.amount);
                u.carry = take;
                u.targetResource.amount -= take;
                // return to nearest town hall
                const town = game.buildings.find(b=>b.type==='TownHall');
                if(town) u.moveTo(town.mesh.position);
            }
        }else if(u.carry){
            // arrived back at base
            const base = game.buildings.find(b=>b.type==='TownHall');
            if(base && u.mesh.position.distanceTo(base.mesh.position)<1){
                if(u.targetResource.type==='Gold') resources.gold+=u.carry;
                else resources.wood+=u.carry;
                u.carry = 0;
                // go for more
                u.targetResource = null;
                u.onArrive(); // trigger search again
            }
        }
    });
}
let aiSpawnTimer = 0;
function updateAI(dt){
    // simple AI: spawn a soldier every 8‑12 seconds, send to player base
    aiSpawnTimer -= dt;
    if(aiSpawnTimer<=0){
        aiSpawnTimer = 8 + Math.random()*4;
        const spawnPos = game.enemyBases[0].mesh.position.clone();
        const soldier = new Unit('Enemy', spawnPos, 'ai');
        const playerBase = game.buildings.find(b=>b.type==='TownHall' && b.owner!=='ai');
        if(playerBase){
            soldier.moveTo(playerBase.mesh.position);
        }
        game.units.push(soldier);
        log('Enemy soldier spawned.');
    }
    // enemy soldiers attack
    game.units.filter(u=>u.owner==='ai' && u.alive).forEach(enemy=>{
        // find nearest player unit/building
        let target = null;
        let bestDist = Infinity;
        game.units.filter(p=>p.owner==='player' && p.alive).forEach(p=>{
            const d = p.mesh.position.distanceTo(enemy.mesh.position);
            if(d<bestDist){bestDist=d;target=p;}
        });
        game.buildings.filter(b=>b.owner!=='ai' && b.alive).forEach(b=>{
            const d = b.mesh.position.distanceTo(enemy.mesh.position);
            if(d<bestDist){bestDist=d;target=b;}
        });
        if(target){
            enemy.moveTo(target.mesh.position);
            // if close enough, deal damage
            if(bestDist<2){
                target.health-=30*dt; // damage per second
                // visual cue (brief red flash)
                target.mesh.material.color.setHex(0xff0000);
                setTimeout(()=>target.mesh.material.color.setHex(target instanceof Unit?0xffffff:0x8b4513),100);
                if(target.health<=0){
                    target.destroy();
                    log(`${target.type||'Building'} destroyed!`);
                    if(target instanceof Unit && target.owner==='player'){
                        population.current--;
                    }
                }
            }
        }
    });
}

// ----------------------------------------------------------
// DAY/NIGHT CYCLE
// ----------------------------------------------------------
function updateDayNight(dt){
    game.time += dt;
    const phase = (game.time % DAY_LENGTH) / DAY_LENGTH; // 0‑1
    // simple sinusoidal light intensity
    const intensity = 0.2 + 0.8*Math.max(0, Math.sin(phase*Math.PI*2));
    dirLight.intensity = intensity;
    hemiLight.intensity = 0.5*intensity + 0.2;
    // optional color shift
    const nightColor = new THREE.Color(0x001030);
    const dayColor   = new THREE.Color(0xaaddff);
    const col = nightColor.clone().lerp(dayColor, intensity);
    scene.background = col;
}

// ----------------------------------------------------------
// MAIN LOOP
// ----------------------------------------------------------
function animate(){
    const dt = clock.getDelta();
    // update systems
    updateEconomy(dt);
    updateAI(dt);
    updateDayNight(dt);
    // update all entities
    game.units.concat(game.buildings).forEach(e=> e.alive && e.update(dt));
    // UI
    UI.gold.textContent = Math.floor(resources.gold);
    UI.wood.textContent = Math.floor(resources.wood);
    UI.pop.textContent  = population.current;
    UI.popCap.textContent = population.max;
    // render
    renderer.render(scene,camera);
    requestAnimationFrame(animate);
}
const clock = new THREE.Clock();
animate();

// ----------------------------------------------------------
// BASIC RESIZE HANDLER
// ----------------------------------------------------------
window.addEventListener('resize',()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
