<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crownfall: The Eldoria Chronicles</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=IM+Fell+English+SC&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&display=swap');
    body { margin: 0; overflow: hidden; background: #0d0a12; font-family: 'Crimson Text', serif; color: #e8dcc8; }
    #game-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    .ui-layer { position: fixed; z-index: 10; pointer-events: none; }
    .glass-panel {
      background: rgba(20, 14, 30, 0.75);
      backdrop-filter: blur(12px) saturate(120%);
      border: 1px solid rgba(212, 183, 140, 0.15);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(212,183,140,0.05);
    }
    .gold-btn {
      background: linear-gradient(180deg, #c9a84c 0%, #8a6d2f 100%);
      border: 1px solid #e8c070;
      box-shadow: 0 4px 16px rgba(201,168,76,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: all 0.2s ease;
    }
    .gold-btn:hover { filter: brightness(1.15); box-shadow: 0 6px 20px rgba(201,168,76,0.4); }
    .gold-btn:active { transform: translateY(1px); }
    .unit-card { transition: all 0.2s ease; cursor: pointer; }
    .unit-card:hover { background: rgba(201,168,76,0.15); border-color: rgba(201,168,76,0.5); transform: translateY(-2px); }
    .resource-bar { background: linear-gradient(90deg, #8a6d2f 0%, #c9a84c 100%); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(212,183,140,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(212,183,140,0.5); }
    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    .shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); background-size: 200% auto; animation: shimmer 3s infinite linear; }
    @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 10px rgba(201,168,76,0.3); } 50% { box-shadow: 0 0 25px rgba(201,168,76,0.6); } }
    .alert-glow { animation: pulse-glow 1.5s infinite; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div class="ui-layer pointer-events-auto w-full h-full flex flex-col justify-between px-4 py-4">

    <!-- Header -->
    <header class="glass-panel p-3 flex items-center justify-between w-full max-w-5xl mx-auto">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-600 to-amber-900 flex items-center justify-center border border-amber-400/30 shadow-lg shadow-amber-900/20">
          <span class="text-amber-200 text-xl font-black font-['Cinzel'] leading-none">C</span>
        </div>
        <div>
          <h1 class="text-xl font-['Cinzel'] font-black text-amber-100 leading-tight tracking-wide drop-shadow-lg">Crownfall</h1>
          <p class="text-[10px] text-amber-200/60 tracking-[0.2em] uppercase">Eldoria Chronicles</p>
        </div>
      </div>

      <div class="flex items-center gap-6 text-sm">
        <div class="text-center">
          <div class="text-[10px] text-amber-200/50 uppercase tracking-wider">Day</div>
          <div class="text-lg font-['Cinzel'] font-bold text-amber-100" id="day-display">1</div>
        </div>
        <div class="w-px h-8 bg-amber-200/10"></div>
        <div class="flex gap-4">
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-300 shadow-[0_0_6px_#f0c040]"></span>
            <span class="text-xs font-bold text-amber-100" id="res-wood">120</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-stone-300 shadow-[0_0_6px_#c8b898]"></span>
            <span class="text-xs font-bold text-stone-100" id="res-stone">80</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-rose-300 shadow-[0_0_6px_#e0a0a0]"></span>
            <span class="text-xs font-bold text-rose-100" id="res-food">200</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_6px_#f0c040]"></span>
            <span class="text-xs font-bold text-amber-200" id="res-gold">60</span>
          </div>
        </div>
        <div class="w-px h-8 bg-amber-200/10"></div>
        <div class="text-center">
          <div class="text-[10px] text-amber-200/50 uppercase tracking-wider">Pop</div>
          <div class="text-lg font-['Cinzel'] font-bold text-amber-100" id="pop-display">12/30</div>
        </div>
      </div>
    </header>

    <!-- Main Area -->
    <div class="flex-1 relative overflow-hidden pointer-events-none">
      <!-- Center overlay: selection info -->
      <div id="selection-panel" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 glass-panel p-4 hidden pointer-events-auto min-w-[260px]">
        <h3 class="font-['Cinzel'] text-amber-100 text-lg mb-2">Selection</h3>
        <p class="text-sm text-amber-100/70 mb-3" id="sel-desc">Nothing selected</p>
        <div class="flex gap-2">
          <button onclick="game.debugSelect()" class="gold-btn px-3 py-1.5 rounded-lg text-xs font-bold text-amber-950 pointer-events-auto">Info</button>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <footer class="glass-panel p-4 max-w-5xl mx-auto w-full">
      <div class="flex gap-3 overflow-x-auto pb-1">
        <div class="shrink-0">
          <h4 class="text-[10px] uppercase tracking-[0.2em] text-amber-300/60 mb-1.5 font-['Cinzel']">Buildings</h4>
          <div class="flex gap-2">
            <button onclick="game.buildType='mill'" class="unit-card glass-panel px-3 py-2 rounded-lg text-xs font-bold text-amber-100 hover:text-amber-200">
              <span class="block text-lg">🌾</span>Mill
            </button>
            <button onclick="game.buildType='mine'" class="unit-card glass-panel px-3 py-2 rounded-lg text-xs font-bold text-amber-100 hover:text-amber-200">
              <span class="block text-lg">⛏</span>Mine
            </button>
            <button onclick="game.buildType='barracks'" class="unit-card glass-panel px-3 py-2 rounded-lg text-xs font-bold text-amber-100 hover:text-amber-200">
              <span class="block text-lg">⚔</span>Barracks
            </button>
            <button onclick="game.buildType='tower'" class="unit-card glass-panel px-3 py-2 rounded-lg text-xs font-bold text-amber-100 hover:text-amber-200">
              <span class="block text-lg">🏰</span>Tower
            </button>
          </div>
        </div>
        <div class="w-px bg-amber-200/10 shrink-0"></div>
        <div class="shrink-0">
          <h4 class="text-[10px] uppercase tracking-[0.2em] text-amber-300/60 mb-1.5 font-['Cinzel']">Units</h4>
          <div class="flex gap-2">
            <button onclick="game.recruit('spearman')" class="unit-card glass-panel px-3 py-2 rounded-lg text-xs font-bold text-amber-100 hover:text-amber-200">
              <span class="block text-lg">🛡</span>Guard
            </button>
            <button onclick="game.recruit('archer')" class="unit-card glass-panel px-3 py-2 rounded-lg text-xs font-bold text-amber-100 hover:text-amber-200">
              <span class="block text-lg">🏹</span>Archer
            </button>
            <button onclick="game.recruit('cavalier')" class="unit-card glass-panel px-3 py-2 rounded-lg text-xs font-bold text-amber-100 hover:text-amber-200">
              <span class="block text-lg">🐎</span>Rider
            </button>
          </div>
        </div>
        <div class="w-px bg-amber-200/10 shrink-0"></div>
        <div class="flex-1 min-w-[200px]">
          <h4 class="text-[10px] uppercase tracking-[0.2em] text-amber-300/60 mb-1.5 font-['Cinzel']">Status</h4>
          <div class="flex gap-3 text-xs text-amber-100/70">
            <span><span class="font-bold text-amber-200">Phase:</span> <span id="phase-label">Expansion</span></span>
            <span><span class="font-bold text-amber-200">Threat:</span> <span id="threat-label">Low</span></span>
            <span><span class="font-bold text-amber-200">Next Wave:</span> <span id="wave-timer">45s</span></span>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Victory Screen -->
  <div id="victory-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/70 backdrop-blur-md">
    <div class="glass-panel p-8 text-center max-w-md mx-4">
      <h2 class="text-4xl font-['Cinzel'] font-black text-amber-200 mb-2">Victory</h2>
      <p class="text-amber-100/60 mb-6">The kingdom of Eldoria stands eternal. The shadow has been pushed back beyond the northern ridge.</p>
      <button onclick="location.reload()" class="gold-btn px-8 py-3 rounded-xl font-['Cinzel'] font-bold text-amber-950">New Chronicles</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    // --- Game State ---
    const GAME = {
      resources: { wood: 120, stone: 80, food: 200, gold: 60 },
      population: 12, maxPop: 30,
      day: 1,
      phase: 'expansion',
      threat: 0,
      enemyBases: 3,
      buildings: [],
      units: [],
      selected: null,
      buildType: 'mill',
      time: 0,
      dayCycle: 0,
      waveTimer: 45,
      gameOver: false,
      won: false
    };

    // --- Scene Setup ---
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0a12);
    scene.fog = new THREE.FogExp2(0x1a1220, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(12, 18, 12);
    camera.lookAt(0, 0, -2);

    // Lights
    const ambient = new THREE.AmbientLight(0x3a2a4a, 0.6);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffeedd, 1.4);
    sun.position.set(20, 30, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    const moon = new THREE.DirectionalLight(0xaabbdd, 0.4);
    moon.position.set(-20, 10, -15);
    scene.add(moon);

    // --- Stylized Ground ---
    const groundGeo = new THREE.CircleGeometry(25, 48);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x2a1f3a,
      roughness: 0.9,
      metalness: 0.05,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- Procedural Terrain / Trees ---
    const treeGeo = new THREE.ConeGeometry(0.4, 1.2, 8);
    const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 0.5, 6);
    const treeMat = new THREE.MeshStandardMaterial({ color: 0x2d5a3f, roughness: 0.8, metalness: 0.1 });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 1 });

    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = 6 + Math.random() * 16;
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 0.25;
      trunk.castShadow = true;
      tree.add(trunk);
      const crown = new THREE.Mesh(treeGeo, treeMat);
      crown.position.y = 0.9;
      crown.castShadow = true;
      tree.add(crown);
      tree.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
      tree.rotation.y = Math.random() * Math.PI * 2;
      scene.add(tree);
    }

    // --- Center Castle ---
    const castleGeo = new THREE.BoxGeometry(2, 3, 2);
    const castleMat = new THREE.MeshStandardMaterial({ color: 0x8a7a6f, roughness: 0.6, metalness: 0.2 });
    const castle = new THREE.Mesh(castleGeo, castleMat);
    castle.position.set(0, 1.5, 0);
    castle.castShadow = true;
    scene.add(castle);

    // --- Buildings System ---
    function createBuilding(type, x, z) {
      const g = new THREE.BoxGeometry(1, 0.8, 1);
      const mat = new THREE.MeshStandardMaterial({ color: type === 'mill' ? 0xc0a050 : type === 'mine' ? 0x8090a0 : type === 'tower' ? 0x708070 : 0xa07050, roughness: 0.7 });
      const mesh = new THREE.Mesh(g, mat);
      mesh.position.set(x, 0.4, z);
      mesh.castShadow = true;
      scene.add(mesh);
      GAME.buildings.push({ type, x, z, mesh, level: 1, workers: 0 });
      return mesh;
    }

    // --- Units ---
    function spawnUnit(type, x, z, owner='player') {
      const geo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
      const mat = new THREE.MeshStandardMaterial({ color: owner === 'player' ? (type === 'spearman' ? 0x4a6fa5 : type === 'archer' ? 0x5a8a4a : 0x7a5a2a) : 0x8a2020, roughness: 0.3, metalness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.45, z);
      mesh.castShadow = true;
      scene.add(mesh);
      GAME.units.push({ type, owner, x, z, mesh, hp: 100, target: null, moving: false });
      return mesh;
    }

    // --- Interactions ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(scene.children);
      if (hits.length > 0) {
        const hit = hits[0];
        const obj = hit.object;
        // Simple selection logic
        if (GAME.buildings.find(b => b.mesh === obj)) {
          GAME.selected = obj;
          document.getElementById('selection-panel').classList.remove('hidden');
          document.getElementById('sel-desc').textContent = 'Building - Click to manage';
        } else if (GAME.units.find(u => u.mesh === obj)) {
          GAME.selected = obj;
          document.getElementById('selection-panel').classList.remove('hidden');
          document.getElementById('sel-desc').textContent = 'Unit selected';
        }
      }
    });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Game Loop ---
    const clock = new THREE.Clock();

    function updateUI() {
      document.getElementById('day-display').textContent = GAME.day;
      document.getElementById('res-wood').textContent = GAME.resources.wood;
      document.getElementById('res-stone').textContent = GAME.resources.stone;
      document.getElementById('res-food').textContent = GAME.resources.food;
      document.getElementById('res-gold').textContent = GAME.resources.gold;
      document.getElementById('pop-display').textContent = `${GAME.population}/${GAME.maxPop}`;
      document.getElementById('phase-label').textContent = GAME.phase;
      document.getElementById('threat-label').textContent = GAME.threat < 50 ? 'Low' : GAME.threat < 100 ? 'Medium' : 'High';
      document.getElementById('wave-timer').textContent = Math.ceil(GAME.waveTimer) + 's';
    }

    function spawnWave() {
      if (GAME.gameOver) return;
      const count = 3 + GAME.day * 2 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = 20 + Math.random() * 4;
        spawnUnit('spearman', Math.cos(angle) * r, Math.sin(angle) * r, 'enemy');
      }
      GAME.threat += count * 10;
    }

    function tick() {
      const dt = clock.getDelta();
      GAME.time += dt;
      GAME.dayCycle += dt * 0.05;
      GAME.waveTimer -= dt;
      if (GAME.waveTimer <= 0) {
        spawnWave();
        GAME.waveTimer = 40 + Math.random() * 30;
      }
      // Gather resources
      GAME.buildings.forEach(b => {
        if (b.type === 'mill') GAME.resources.food += 1 * dt;
        if (b.type === 'mine') GAME.resources.stone += 0.8 * dt;
      });
      GAME.resources.food = Math.min(GAME.resources.food, 500);
      GAME.resources.wood = Math.min(GAME.resources.wood, 500);
      GAME.resources.stone = Math.min(GAME.resources.stone, 500);
      GAME.resources.gold = Math.min(GAME.resources.gold, 500);

      if (GAME.enemyBases <= 0 && GAME.units.filter(u => u.owner === 'enemy').length === 0 && !GAME.gameOver && !GAME.won) {
        GAME.won = true;
        document.getElementById('victory-modal').classList.remove('hidden');
      }

      // Day cycle lighting
      const sunAngle = Math.PI * 0.3 + GAME.dayCycle % (Math.PI * 2);
      sun.position.set(Math.cos(sunAngle) * 30, Math.sin(sunAngle) * 30 + 5, 20);
      sun.color.setHSL(0.1, 0.8, 0.3 + 0.5 * Math.sin(sunAngle));
      sun.intensity = 0.5 + 0.9 * Math.sin(sunAngle);

      // Rotate camera slowly for cinematic feel
      const cx = 12 + Math.sin(GAME.time * 0.05) * 2;
      camera.position.set(cx, 18, 12);
      camera.lookAt(0, 0, -2);

      updateUI();
    }

    // Expose to HTML
    window.game = GAME;
    GAME.buildType = 'mill';
    GAME.recruit = (t) => {
      if (GAME.resources.food >= 30) {
        GAME.resources.food -= 30;
        spawnUnit(t, 2, 2);
      }
    };
    GAME.debugSelect = () => {
      alert('Building / Unit info - Manage via bottom panel');
    };

    // Animation loop
    renderer.setAnimationLoop(() => {
      tick();
      renderer.render(scene, camera);
    });

    // Init
    updateUI();
  </script>
</body>
</html>
