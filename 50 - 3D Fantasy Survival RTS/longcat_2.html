<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherhaven: Kingdom's Fall</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      user-select: none;
    }
    
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    #ui {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    
    #resource-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      background: rgba(20, 20, 40, 0.9);
      padding: 12px 24px;
      border-radius: 12px;
      border: 2px solid rgba(255, 215, 0, 0.5);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: auto;
    }
    
    .resource-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffd700;
      font-weight: bold;
      font-size: 16px;
    }
    
    .resource-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      box-shadow: 0 0 8px currentColor;
    }
    
    #build-menu {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(20, 20, 40, 0.95);
      padding: 15px;
      border-radius: 12px;
      border: 2px solid rgba(100, 200, 255, 0.5);
      pointer-events: auto;
      max-height: 60vh;
      overflow-y: auto;
      min-width: 200px;
    }
    
    .build-btn {
      display: block;
      width: 100%;
      padding: 10px 15px;
      margin: 5px 0;
      background: linear-gradient(135deg, #2a4a7f, #1a3a5f);
      border: 1px solid #4a7ab0;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      text-align: left;
    }
    
    .build-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #3a6a9f, #2a5a8f);
      transform: translateX(-5px);
      box-shadow: 0 0 15px rgba(100, 200, 255, 0.4);
    }
    
    .build-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #minimap {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 200px;
      height: 200px;
      background: rgba(0,0,0,0.7);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      pointer-events: auto;
    }
    
    #selection-info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(20, 20, 40, 0.95);
      padding: 15px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.2);
      color: #fff;
      pointer-events: auto;
      min-width: 250px;
    }
    
    #wave-timer {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(80, 20, 20, 0.9);
      padding: 8px 20px;
      border-radius: 20px;
      color: #ff6b6b;
      font-weight: bold;
      border: 2px solid #ff4444;
      pointer-events: auto;
    }
    
    #game-over {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 200;
      pointer-events: auto;
    }
    
    #game-over h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px currentColor;
    }
    
    .btn {
      padding: 15px 40px;
      font-size: 18px;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      border: none;
      border-radius: 8px;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
      transition: all 0.2s;
    }
    
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }
    
    #difficulty-select {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e, #2a2a4e);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 300;
      pointer-events: auto;
    }
    
    #difficulty-select h1 {
      font-size: 56px;
      color: #ffd700;
      margin-bottom: 40px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }
    
    .difficulty-btn {
      padding: 20px 60px;
      font-size: 24px;
      margin: 15px;
      background: linear-gradient(135deg, #2a4a7f, #1a3a5f);
      border: 2px solid #4a7ab0;
      color: #fff;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 250px;
    }
    
    .difficulty-btn:hover {
      background: linear-gradient(135deg, #3a6a9f, #2a5a8f);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 400;
      color: #ffd700;
      font-size: 24px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 215, 0, 0.3);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .health-bar {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }
    
    .health-fill {
      height: 100%;
      background: #00ff00;
      border-radius: 2px;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  
  <div id="loading">
    <div class="spinner"></div>
    <div>Forging the Kingdom...</div>
  </div>
  
  <div id="difficulty-select">
    <h1>⚔️ Aetherhaven: Kingdom's Fall ⚔️</h1>
    <button class="difficulty-btn" onclick="startGame('easy')">🌱 Easy - Peaceful Realm</button>
    <button class="difficulty-btn" onclick="startGame('medium')">⚔️ Medium - Balanced Challenge</button>
    <button class="difficulty-btn" onclick="startGame('hard')">💀 Hard - Brutal Onslaught</button>
  </div>
  
  <div id="game-over">
    <h1 id="game-over-title">Victory!</h1>
    <p id="game-over-message"></p>
    <button class="btn" onclick="restartGame()">⚔️ Play Again</button>
  </div>
  
  <div id="ui">
    <div id="resource-bar">
      <div class="resource-item">
        <div class="resource-icon" style="background: #ffd700; color: #ffd700;"></div>
        <span id="gold-count">0</span>
      </div>
      <div class="resource-item">
        <div class="resource-icon" style="background: #8b4513; color: #8b4513;"></div>
        <span id="wood-count">0</span>
      </div>
      <div class="resource-item">
        <div class="resource-icon" style="background: #808080; color: #808080;"></div>
        <span id="stone-count">0</span>
      </div>
      <div class="resource-item">
        <div class="resource-icon" style="background: #9b59b6; color: #9b59b6;"></div>
        <span id="crystal-count">0</span>
      </div>
      <div class="resource-item">
        <div class="resource-icon" style="background: #3498db; color: #3498db;"></div>
        <span id="pop-count">0/20</span>
      </div>
    </div>
    
    <div id="wave-timer">
      ⏰ Next Wave: <span id="wave-time">180</s>
    </div>
    
    <div id="minimap">
      <canvas id="minimap-canvas" width="200" height="200"></canvas>
    </div>
    
    <div id="selection-info">
      <h3 id="selection-title">Select a Unit</h3>
      <p id="selection-stats"></p>
      <div id="selection-abilities"></div>
    </div>
    
    <div id="build-menu">
      <h3>🏗️ Build</h3>
      <button class="build-btn" onclick="enterBuildMode('house')">🏠 House (+5 pop) - 100🪵80</button>
      <button class="build-btn" onclick="enterBuildMode('lumber_mill')">🪵 Lumber Mill - 150🪨50</button>
      <button class="build-btn" onclick="enterBuildMode('quarry')">🪨 Quarry - 150🪵50</button>
      <button class="build-btn" onclick="enterBuildMode('mine')">⛏️ Mine - 200🪵100🪨100</button>
      <button class="build-btn" onclick="enterBuildMode('barracks')">🏛️ Barracks - 200🪵150🪨100</button>
      <button class="build-btn" onclick="enterBuildMode('archery')">🏹 Archery - 180🪵120🪨50💎20</button>
      <button class="build-btn" onclick="enterBuildMode('stable')">🐴 Stable - 300🪵200🪨150💎30</button>
      <button class="build-btn" onclick="enterBuildMode('wall')">🧱 Wall - 50🪵20🪨80</button>
      <button class="build-btn" onclick="enterBuildMode('tower')">🗼 Tower - 150🪵50🪨150💎30</button>
      <button class="build-btn" onclick="enterBuildMode('research')">📚 Research Center - 400🪵100🪨100💎100</button>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ==================== CONFIGURATION ====================
    const CONFIG = {
      mapSize: 80,
      tileSize: 2,
      populationCap: 50,
      startingResources: { gold: 500, wood: 300, stone: 200, crystal: 100 },
      waveInterval: 180,
      difficulty: 'medium',
      dayLength: 120,
      maxUnits: 100,
    };
    
    // ==================== GAME STATE ====================
    let gameState = {
      resources: { ...CONFIG.startingResources },
      population: { current: 5, max: 20 },
      wave: 1,
      waveTimer: CONFIG.waveInterval,
      dayTime: 0,
      isNight: false,
      isPaused: false,
      buildMode: null,
      selectedEntities: [],
      playerUnits: [],
      enemyUnits: [],
      buildings: [],
      resourceNodes: [],
      particles: [],
      projectiles: [],
      gameOver: false,
      victory: false,
      research: {
        attack: 0,
        armor: 0,
        gathering: 0,
      }
    };
    
    // ==================== THREE.JS SETUP ====================
    let scene, camera, renderer, clock;
    let terrain, water;
    let raycaster, mouse;
    let enemyBase = null;
    let enemyBuildings = [];
    
    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 60, 250);
      
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.position.set(40, 60, 40);
      camera.lookAt(0, 0, 0);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById('game-container').appendChild(renderer.domElement);
      
      clock = new THREE.Clock();
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();
      
      // Lighting
      const ambient = new THREE.AmbientLight(0x6688cc, 0.6);
      scene.add(ambient);
      
      const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
      sun.position.set(50, 100, 50);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 2048;
      sun.shadow.mapSize.height = 2048;
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far = 500;
      sun.shadow.camera.left = -100;
      sun.shadow.camera.right = 100;
      sun.shadow.camera.top = 100;
      sun.shadow.camera.bottom = -100;
      scene.add(sun);
      
      const hemi = new THREE.HemisphereLight(0x87ceeb, 0x362907, 0.4);
      scene.add(hemi);
    }
    
    // ==================== TERRAIN GENERATION ====================
    function createTerrain() {
      const size = CONFIG.mapSize * CONFIG.tileSize;
      const segments = CONFIG.mapSize;
      
      const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
      geometry.rotateX(-Math.PI / 2);
      
      const positions = geometry.attributes.position;
      const colors = [];
      const color = new THREE.Color();
      
      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const z = positions.getZ(i);
        
        let height = getTerrainHeight(x, z);
        positions.setY(i, height);
        
        // Color based on height
        if (height < 0.5) {
          color.setHex(0x8b7355);
        } else if (height < 3) {
          color.setHex(0x4a7c2e);
        } else if (height < 6) {
          color.setHex(0x3d6b2e);
        } else if (height < 8) {
          color.setHex(0x6b6b6b);
        } else {
          color.setHex(0xffffff);
        }
        
        const variation = (Math.sin(x * 0.1) + Math.cos(z * 0.1)) * 0.05;
        color.r += variation;
        color.g += variation;
        color.b += variation;
        
        colors.push(color.r, color.g, color.b);
      }
      
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      
      const material = new THREE.MeshLambertMaterial({
        vertexColors: true,
        flatShading: true,
      });
      
      terrain = new THREE.Mesh(geometry, material);
      terrain.receiveShadow = true;
      scene.add(terrain);
      
      // Water
      const waterGeo = new THREE.PlaneGeometry(size * 2, size * 2);
      waterGeo.rotateX(-Math.PI / 2);
      const waterMat = new THREE.MeshLambertMaterial({
        color: 0x3498db,
        transparent: true,
        opacity: 0.6,
      });
      water = new THREE.Mesh(waterGeo, waterMat);
      water.position.y = -0.5;
      scene.add(water);
    }
    
    function getTerrainHeight(x, z) {
      const dist = Math.sqrt(x * x + z * z);
      if (dist < 15) return 0;
      
      const noise = (x, z, scale) => {
        const sx = x * scale;
        const sz = z * scale;
        const ix = Math.floor(sx);
        const iz = Math.floor(sz);
        const fx = sx - ix;
        const fz = sz - iz;
        
        const n = (x, z) => {
          const val = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
          return val - Math.floor(val);
        };
        
        const ux = fx * fx * (3 - 2 * fx);
        const uz = fz * fz * (3 - 2 * fz);
        
        return (
          n(ix, iz) * (1 - ux) * (1 - uz) +
          n(ix + 1, iz) * ux * (1 - uz) +
          n(ix, iz + 1) * (1 - ux) * uz +
          n(ix + 1, iz + 1) * ux * uz
        );
      };
      
      let height = 0;
      height += noise(x, z, 0.05) * 8;
      height += noise(x, z, 0.1) * 4;
      height += noise(x, z, 0.2) * 2;
      height += noise(x, z, 0.4) * 1;
      
      if (dist < 15) {
        height *= dist / 15;
      }
      
      return height;
    }
    
    // ==================== ENTITY CREATION ====================
    function createUnit(type, x, z, owner = 'player') {
      const group = new THREE.Group();
      group.userData = {
        type,
        owner,
        hp: 100,
        maxHp: 100,
        damage: 10,
        range: 2,
        speed: 5,
        attackCooldown: 1,
        lastAttack: 0,
        target: null,
        state: 'idle',
        carryingResource: null,
        isHero: false,
        formationOffset: { x: 0, z: 0 },
      };
      
      let bodyColor, headColor;
      if (owner === 'player') {
        bodyColor = type === 'worker' ? 0x3498db : type === 'warrior' ? 0xe74c3c : type === 'archer' ? 0x2ecc71 : type === 'knight' ? 0x9b59b6 : 0xf39c12;
        headColor = 0xf5cba7;
      } else {
        bodyColor = type === 'worker' ? 0x4a4a4a : type === 'warrior' ? 0x8b0000 : type === 'archer' ? 0x2d5a27 : type === 'knight' ? 0x4a235a : 0xf39c12;
        headColor = 0xd5d5d5;
      }
      
      // Body
      const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.6);
      const bodyMat = new THREE.MeshLambertMaterial({ color: bodyColor });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.6;
      body.castShadow = true;
      group.add(body);
      
      // Head
      const headGeo = new THREE.SphereGeometry(0.35, 8, 6);
      const headMat = new THREE.MeshLambertMaterial({ color: headColor });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.5;
      head.castShadow = true;
      group.add(head);
      
      // Weapon
      if (type !== 'worker') {
        const weaponGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.5);
        const weaponMat = new THREE.MeshLambertMaterial({ color: 0x8b7355 });
        const weapon = new THREE.Mesh(weaponGeo, weaponMat);
        weapon.position.set(0.5, 0.8, 0);
        weapon.rotation.z = Math.PI / 4;
        weapon.castShadow = true;
        group.add(weapon);
      }
      
      // Worker tools
      if (type === 'worker') {
        const toolGeo = new THREE.ConeGeometry(0.1, 0.5, 4);
        const toolMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
        const tool = new THREE.Mesh(toolGeo, toolMat);
        tool.position.set(0.4, 0.7, 0);
        tool.rotation.z = Math.PI / 3;
        group.add(tool);
      }
      
      // Hero glow
      if (type === 'hero') {
        group.userData.isHero = true;
        const haloGeo = new THREE.RingGeometry(0.5, 0.6, 16);
        const haloMat = new THREE.MeshBasicMaterial({ 
          color: 0xffd700, 
          transparent: true, 
          opacity: 0.6,
          side: THREE.DoubleSide,
        });
        const halo = new THREE.Mesh(haloGeo, haloMat);
        halo.position.y = 2.2;
        halo.rotation.x = Math.PI / 2;
        group.add(halo);
      }
      
      // Health bar
      const healthBar = document.createElement('div');
      healthBar.className = 'health-bar';
      const healthFill = document.createElement('div');
      healthFill.className = 'health-fill';
      healthFill.style.width = '100%';
      healthBar.appendChild(healthFill);
      group.userData.healthBar = healthBar;
      group.userData.healthFill = healthFill;
      document.body.appendChild(healthBar);
      
      group.position.set(x, getTerrainHeight(x, z), z);
      scene.add(group);
      
      // Set stats
      switch(type) {
        case 'worker':
          group.userData.maxHp = 60;
          group.userData.hp = 60;
          group.userData.damage = 5;
          group.userData.range = 1.5;
          group.userData.speed = 4;
          break;
        case 'warrior':
          group.userData.maxHp = 120;
          group.userData.hp = 120;
          group.userData.damage = 25;
          group.userData.range = 1.5;
          group.userData.speed = 3.5;
          break;
        case 'archer':
          group.userData.maxHp = 70;
          group.userData.hp = 70;
          group.userData.damage = 15;
          group.userData.range = 8;
          group.userData.speed = 4;
          group.userData.attackCooldown = 0.8;
          break;
        case 'knight':
          group.userData.maxHp = 200;
          group.userData.hp = 200;
          group.userData.damage = 35;
          group.userData.range = 1.8;
          group.userData.speed = 5;
          group.userData.attackCooldown = 1.2;
          break;
        case 'hero':
          group.userData.maxHp = 350;
          group.userData.hp = 350;
          group.userData.damage = 50;
          group.userData.range = 2;
          group.userData.speed = 4.5;
          group.userData.attackCooldown = 0.8;
          break;
      }
      
      return group;
    }
    
    function createBuilding(type, x, z, owner = 'player') {
      const group = new THREE.Group();
      group.userData = {
        type,
        owner,
        hp: 500,
        maxHp: 500,
        isBuilt: false,
        buildProgress: 0,
        buildTime: 10,
      };
      
      let width, height, depth;
      let color;
      
      switch(type) {
        case 'town_hall':
          width = 4; height = 3; depth = 4;
          color = 0xf5cba7;
          group.userData.maxHp = 1000;
          group.userData.hp = 1000;
          break;
        case 'house':
          width = 2; height = 2; depth = 2;
          color = 0xd4a574;
          group.userData.maxHp = 300;
          group.userData.hp = 300;
          group.userData.buildTime = 5;
          break;
        case 'barracks':
          width = 3; height = 2.5; depth = 3;
          color = 0x8b4513;
          group.userData.maxHp = 600;
          group.userData.hp = 600;
          group.userData.buildTime = 15;
          break;
        case 'archery':
          width = 2.5; height = 2.5; depth = 2.5;
          color = 0x2ecc71;
          group.userData.maxHp = 500;
          group.userData.hp = 500;
          group.userData.buildTime = 12;
          break;
        case 'stable':
          width = 3; height = 2; depth = 4;
          color = 0x9b59b6;
          group.userData.maxHp = 600;
          group.userData.hp = 600;
          group.userData.buildTime = 18;
          break;
        case 'wall':
          width = 2; height = 3; depth = 0.5;
          color = 0x696969;
          group.userData.maxHp = 400;
          group.userData.hp = 400;
          group.userData.buildTime = 3;
          break;
        case 'tower':
          width = 1.5; height = 5; depth = 1.5;
          color = 0x4a4a4a;
          group.userData.maxHp = 800;
          group.userData.hp = 800;
          group.userData.buildTime = 10;
          break;
        case 'research':
          width = 2.5; height = 3; depth = 2.5;
          color = 0x3498db;
          group.userData.maxHp = 500;
          group.userData.hp = 500;
          group.userData.buildTime = 20;
          break;
        default:
          width = 2; height = 2; depth = 2;
          color = 0xcccccc;
      }
      
      // Main structure
      const mainGeo = new THREE.BoxGeometry(width, height, depth);
      const mainMat = new THREE.MeshLambertMaterial({ 
        color,
        transparent: true,
        opacity: group.userData.isBuilt ? 1 : 0.6,
      });
      const main = new THREE.Mesh(mainGeo, mainMat);
      main.position.y = height / 2;
      main.castShadow = true;
      main.receiveShadow = true;
      group.add(main);
      
      // Roof

      const roofMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = height + 0.5;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      group.add(roof);

      if (type === 'town_hall') {
        const flagPoleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3);
        const flagPoleMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
        const flagPole = new THREE.Mesh(flagPoleGeo, flagPoleMat);
        flagPole.position.set(width/2, height + 1.5, depth/2);
        group.add(flagPole);
        
        const flagGeo = new THREE.PlaneGeometry(1, 0.6);
        const flagMat = new THREE.MeshBasicMaterial({ 
          color: owner === 'player' ? 0x3498db : 0xe74c3c, 
          side: THREE.DoubleSide 
        });
        const flag = new THREE.Mesh(flagGeo, flagMat);
        flag.position.set(width/2 + 0.5, height + 2.3, depth/2);
        group.add(flag);

      // Health bar
      const healthBar = document.createElement('div');
      healthBar.className = 'health-bar';
      const healthFill = document.createElement('div');

      healthBar.appendChild(healthFill);
      group.userData.healthBar = healthBar;
      group.userData.healthFill = healthFill;
      document.body.appendChild(healthBar);
      
      group.position.set(x, getTerrainHeight(x, z), z);
      scene.add(group);
      
      return group;

    function createResourceNode(type, x, z) {
      const group = new THREE.Group();
      group.userData = {
        type: 'resource',
        resourceType: type,
        amount: 1000,
        maxAmount: 1000,
      };
      
      let color;
      switch(type) {
        case 'gold': color = 0xffd700; break;
        case 'wood': color = 0x8b4513; break;
        case 'stone': color = 0x808080; break;
        case 'crystal': color = 0x9b59b6; break;
      }
      
      if (type === 'wood') {
        const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2);
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x654321 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 1;
        trunk.castShadow = true;
        group.add(trunk);
        
        const leavesGeo = new THREE.ConeGeometry(1.5, 3, 8);
        const leavesMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 3;
        leaves.castShadow = true;
        group.add(leaves);
      } else {
        const geo = new THREE.DodecahedronGeometry(1.2, 0);
        const mat = new THREE.MeshLambertMaterial({ 
          color,
          flatShading: true,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 0.6;
        mesh.castShadow = true;
        group.add(mesh);
        
        if (type === 'crystal' || type === 'gold') {
          const sparkleGeo = new THREE.OctahedronGeometry(0.2);
          const sparkleMat = new THREE.MeshBasicMaterial({ 
            color: type === 'gold' ? 0xffd700 : 0xd8bfd8,
            transparent: true,
            opacity: 0.8,
          });
          for (let i = 0; i < 5; i++) {
            const sparkle = new THREE.Mesh(sparkleGeo, sparkleMat);
            sparkle.position.set(
              (Math.random() - 0.5) * 2,
              Math.random() * 1.5,
              (Math.random() - 0.5) * 2
            );
            sparkle.userData.floatOffset = Math.random() * Math.PI * 2;
            group.add(sparkle);
          }
        }
      }
      
      group.position.set(x, getTerrainHeight(x, z), z);
      scene.add(group);
      return group;
    }
    
    // ==================== UTILITY FUNCTIONS ====================
    function distance(a, b) {
      const dx = a.x - b.x;
      const dz = a.z - b.z;
      return Math.sqrt(dx * dx + dz * dz);
    }
    
    function findNearestResource(unit, resourceType) {
      let nearest = null;
      let nearestDist = Infinity;
      
      for (const node of gameState.resourceNodes) {
        if (node.userData.resourceType === resourceType && node.userData.amount > 0) {
          const dist = distance(unit.position, node.position);
          if (dist < nearestDist) {
            nearestDist = dist;
            nearest = node;
          }
        }
      }
      
      return nearest;
    }
    
    function findNearestEnemy(unit) {
      const enemies = unit.userData.owner === 'player' ? gameState.enemyUnits : gameState.playerUnits;
      let nearest = null;
      let nearestDist = Infinity;
      
      for (const enemy of enemies) {
        if (enemy.userData.hp > 0) {
          const dist = distance(unit.position, enemy.position);
          if (dist < nearestDist) {
            nearestDist = dist;
            nearest = enemy;
          }
        }
      }
      
      return { enemy: nearest, distance: nearestDist };
    }
    
    function findNearestDropoff(unit, resourceType) {
      const dropoffs = ['town_hall', 'lumber_mill', 'quarry', 'mine'];
      let nearest = null;
      let nearestDist = Infinity;
      
      for (const building of gameState.buildings) {
        if (building.userData.owner === unit.userData.owner && 
            dropoffs.includes(building.userData.type) &&
            building.userData.isBuilt) {
          const dist = distance(unit.position, building.position);
          if (dist < nearestDist) {
            nearestDist = dist;
            nearest = building;
          }
        }
      }
      
      return nearest;
    }
    
    // ==================== INPUT HANDLING ====================
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let selectionBox = null;
    
    function setupInput() {
      const canvas = renderer.domElement;
      
      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
          isDragging = true;
          dragStart = { x: e.clientX, y: e.clientY };
          selectionBox = document.createElement('div');
          selectionBox.style.cssText = `
            position: fixed;
            border: 2px solid #ffd700;
            background: rgba(255, 215, 0, 0.2);
            pointer-events: none;
            z-index: 1000;
          `;
          document.body.appendChild(selectionBox);
        }
      });
      
      canvas.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        
        if (isDragging && selectionBox) {
          const width = e.clientX - dragStart.x;
          const height = e.clientY - dragStart.y;
          
          selectionBox.style.left = `${width < 0 ? e.clientX : dragStart.x}px`;
          selectionBox.style.top = `${height < 0 ? e.clientY : dragStart.y}px`;
          selectionBox.style.width = `${Math.abs(width)}px`;
          selectionBox.style.height = `${Math.abs(height)}px`;
        }
        
        if (e.buttons === 2) {
          const panSpeed = 0.5;
          camera.position.x -= e.movementX * panSpeed;
          camera.position.z -= e.movementY * panSpeed;
        }
      });
      
      canvas.addEventListener('mouseup', (e) => {
        if (e.button === 0 && isDragging) {
          isDragging = false;
          if (selectionBox) {
            selectionBox.remove();
            selectionBox = null;
          }
          
          const dragDist = Math.sqrt(
            (e.clientX - dragStart.x) ** 2 + 
            (e.clientY - dragStart.y) ** 2
          );
          
          if (dragDist < 5) {
            handleClick(e);
          } else {
            handleDragSelect(dragStart, { x: e.clientX, y: e.clientY });
          }
        }
      });
      
      canvas.addEventListener('wheel', (e) => {
        const zoomSpeed = 0.1;
        const zoom = e.deltaY > 0 ? 1 + zoomSpeed : 1 - zoomSpeed;
        camera.position.y *= zoom;
        camera.position.y = Math.max(10, Math.min(150, camera.position.y));
      });
      
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      
      window.addEventListener('keydown', (e) => {
        const panSpeed = 1;
        switch(e.key.toLowerCase()) {
          case 'w': camera.position.z -= panSpeed; break;
          case 's': camera.position.z += panSpeed; break;
          case 'a': camera.position.x -= panSpeed; break;
          case 'd': camera.position.x += panSpeed; break;
          case 'q': camera.rotation.y += 0.05; break;
          case 'e': camera.rotation.y -= 0.05; break;
        }
      });
    }
    
    function handleClick(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      
      const selectableObjects = [
        ...gameState.playerUnits,
        ...gameState.enemyUnits,
        ...gameState.buildings,
      ];
      
      const intersects = raycaster.intersectObjects(selectableObjects, true);
      
      if (gameState.buildMode) {
        if (intersects.length > 0) {
          const point = intersects[0].point;
          if (canPlaceBuilding(point.x, point.z)) {
            placeBuilding(point.x, point.z);
          }
        }
      } else if (intersects.length > 0) {
        let selected = intersects[0].object;
        while (selected.parent && !selected.userData.type) {
          selected = selected.parent;
        }
        
        if (selected.userData.type) {
          gameState.selectedEntities = [selected];
          updateSelectionInfo();
        }
      } else {
        gameState.selectedEntities = [];
        updateSelectionInfo();
      }
    }
    
    function handleDragSelect(start, end) {
      const left = Math.min(start.x, end.x);
      const right = Math.max(start.x, end.x);
      const top = Math.min(start.y, end.y);
      const bottom = Math.max(start.y, end.y);
      
      gameState.selectedEntities = [];
      
      for (const unit of gameState.playerUnits) {
        if (unit.userData.hp <= 0) continue;
        
        const screenPos = unit.position.clone();
        screenPos.y += 2;
        screenPos.project(camera);
        
        const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
        
        if (x >= left && x <= right && y >= top && y <= bottom) {
          gameState.selectedEntities.push(unit);
        }
      }
      
      updateSelectionInfo();
    }
    
    // ==================== BUILDING SYSTEM ====================
    const buildingCosts = {
      house: { gold: 100, wood: 80, stone: 0, crystal: 0 },
      lumber_mill: { gold: 150, wood: 0, stone: 50, crystal: 0 },
      quarry: { gold: 150, wood: 50, stone: 0, crystal: 0 },
      mine: { gold: 200, wood: 100, stone: 100, crystal: 0 },
      barracks: { gold: 200, wood: 150, stone: 100, crystal: 0 },
      archery: { gold: 180, wood: 120, stone: 50, crystal: 20 },
      stable: { gold: 300, wood: 200, stone: 150, crystal: 30 },
      wall: { gold: 50, wood: 20, stone: 80, crystal: 0 },
      tower: { gold: 150, wood: 50, stone: 150, crystal: 30 },
      research: { gold: 400, wood: 100, stone: 100, crystal: 100 },
    };
    
    const buildingRequirements = {
      barracks: ['lumber_mill'],
      archery: ['lumber_mill'],
      stable: ['barracks'],
      research: ['barracks', 'archery'],
    };
    
    function canPlaceBuilding(x, z) {
      const height = getTerrainHeight(x, z);
      if (height < 0 || height > 10) return false;
      
      for (const b of gameState.buildings) {
        if (distance({x, z}, b.position) < 5) return false;
      }
      
      for (const r of gameState.resourceNodes) {
        if (distance({x, z}, r.position) < 3) return false;
      }
      
      return true;
    }
    
    function enterBuildMode(buildingType) {
      const cost = buildingCosts[buildingType];
      
      if (gameState.resources.gold >= cost.gold &&
          gameState.resources.wood >= cost.wood &&
          gameState.resources.stone >= cost.stone &&
          gameState.resources.crystal >= cost.crystal) {
        
        const reqs = buildingRequirements[buildingType] || [];
        for (const req of reqs) {
          if (!gameState.buildings.some(b => b.userData.type === req && b.userData.isBuilt)) {
            alert(`Requires ${req} first!`);
            return;
          }
        }
        
        gameState.buildMode = buildingType;
        renderer.domElement.style.cursor = 'crosshair';
      } else {
        alert('Not enough resources!');
      }
    }
    
    function placeBuilding(x, z) {
      const type = gameState.buildMode;
      const cost = buildingCosts[type];
      
      gameState.resources.gold -= cost.gold;
      gameState.resources.wood -= cost.wood;
      gameState.resources.stone -= cost.stone;
      gameState.resources.crystal -= cost.crystal;
      
      const building = createBuilding(type, x, z, 'player');
      gameState.buildings.push(building);
      
      const worker = gameState.playerUnits.find(u => u.userData.type === 'worker' && u.userData.state === 'idle');
      if (worker) {
        worker.userData.state = 'building';
        worker.userData.target = building;
      }
      
      gameState.buildMode = null;
      renderer.domElement.style.cursor = 'default';
      updateUI();
    }
    
    // ==================== UNIT TRAINING ====================
    const unitCosts = {
      worker: { gold: 50, wood: 0, stone: 0, crystal: 0, pop: 1, time: 5, building: 'town_hall' },
      warrior: { gold: 80, wood: 20, stone: 0, crystal: 0, pop: 2, time: 8, building: 'barracks' },
      archer: { gold: 70, wood: 30, stone: 0, crystal: 10, pop: 2, time: 10, building: 'archery' },
      knight: { gold: 150, wood: 50, stone: 20, crystal: 20, pop: 3, time: 15, building: 'stable' },
    };
    
    function trainUnit(unitType) {
      const cost = unitCosts[unitType];
      
      if (gameState.resources.gold < cost.gold ||
          gameState.resources.wood < cost.wood ||
          gameState.resources.stone < cost.stone ||
          gameState.resources.crystal < cost.crystal) {
        alert('Not enough resources!');
        return;
      }
      
      if (gameState.population.current + cost.pop > gameState.population.max) {
        alert('Population cap reached! Build more houses.');
        return;
      }
      
      const building = gameState.buildings.find(b => 
        b.userData.type === cost.building && b.userData.isBuilt && b.userData.owner === 'player'
      );
      
      if (!building) {
        alert(`Requires ${cost.building}!`);
        return;
      }
      
      gameState.resources.gold -= cost.gold;
      gameState.resources.wood -= cost.wood;
      gameState.resources.stone -= cost.stone;
      gameState.resources.crystal -= cost.crystal;
      
      setTimeout(() => {
        const spawnPos = building.position.clone();
        spawnPos.x += (Math.random() - 0.5) * 3;
        spawnPos.z += (Math.random() - 0.5) * 3;
        spawnPos.y = getTerrainHeight(spawnPos.x, spawnPos.z);
        
        const unit = createUnit(unitType, spawnPos.x, spawnPos.z, 'player');
        gameState.playerUnits.push(unit);
        gameState.population.current += cost.pop;
        updateUI();
      }, cost.time * 1000);
      
      updateUI();
    }
    
    // ==================== COMBAT SYSTEM ====================
    function updateCombat(delta) {
      const allUnits = [...gameState.playerUnits, ...gameState.enemyUnits];
      
      for (const unit of allUnits) {
        if (unit.userData.hp <= 0) continue;
        
        const { enemy, distance: dist } = findNearestEnemy(unit);
        
        if (enemy) {
          unit.userData.target = enemy;
          
          if (dist <= unit.userData.range) {
            unit.userData.state = 'attacking';
            unit.userData.lastAttack += delta;
            
            if (unit.userData.lastAttack >= unit.userData.attackCooldown) {
              enemy.userData.hp -= unit.userData.damage * (1 + gameState.research.attack * 0.1);
              unit.userData.lastAttack = 0;
              
              createProjectile(unit, enemy);
              
              if (enemy.userData.hp <= 0) {
                killUnit(enemy);
              }
            }
          } else {
            unit.userData.state = 'moving';
            const direction = new THREE.Vector3();
            direction.subVectors(enemy.position, unit.position).normalize();
            unit.position.x += direction.x * unit.userData.speed * delta;
            unit.position.z += direction.z * unit.userData.speed * delta;
            unit.position.y = getTerrainHeight(unit.position.x, unit.position.z);
            
            unit.lookAt(new THREE.Vector3(enemy.position.x, unit.position.y, enemy.position.z));
          }
        }
      }
    }
    
    function createProjectile(from, to) {
      const points = [from.position, to.position];
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ 
        color: from.userData.owner === 'player' ? 0xffd700 : 0xff4444,
        linewidth: 2,
      });
      const line = new THREE.Line(geometry, material);
      
      setTimeout(() => {
        scene.remove(line);
        geometry.dispose();
        material.dispose();
      }, 100);
    }
    
    function killUnit(unit) {
      const startScale = unit.scale.clone();
      const duration = 500;
      const start = performance.now();
      
      function animateDeath() {
        const elapsed = performance.now() - start;
        const t = elapsed / duration;
        
        if (t < 1) {
          const scale = 1 - t;
          unit.scale.set(scale, scale, scale);
          unit.rotation.y += 0.2;
          requestAnimationFrame(animateDeath);
        } else {
          scene.remove(unit);
          if (unit.userData.healthBar) unit.userData.healthBar.remove();
          
          if (unit.userData.owner === 'player') {
            const idx = gameState.playerUnits.indexOf(unit);
            if (idx !== -1) gameState.playerUnits.splice(idx, 1);
            gameState.population.current -= getPopCost(unit.userData.type);
          } else {
            const idx = gameState.enemyUnits.indexOf(unit);
            if (idx !== -1) gameState.enemyUnits.splice(idx, 1);
          }
          
          if (unit.userData.type === 'worker' && unit.userData.carryingResource) {
            // Drop resources
          }
        }
      }
      
      animateDeath();
    }
    
    function getPopCost(unitType) {
      return unitCosts[unitType]?.pop || 1;
    }
    
    // ==================== RESOURCE SYSTEM ====================
    function updateEconomy(delta) {
      for (const worker of gameState.playerUnits) {
        if (worker.userData.type !== 'worker' || worker.userData.hp <= 0) continue;
        
        switch(worker.userData.state) {
          case 'idle':
            const gold = findNearestResource(worker, 'gold');
            const wood = findNearestResource(worker, 'wood');
            const stone = findNearestResource(worker, 'stone');
            const crystal = findNearestResource(worker, 'crystal');
            
            let target = null;
            let minDist = Infinity;
            
            for (const r of [gold, wood, stone, crystal]) {
              if (r) {
                const dist = distance(worker.position, r.position);
                if (dist < minDist) {
                  minDist = dist;
                  target = r;
                }
              }
            }
            
            if (target) {
              worker.userData.target = target;
              worker.userData.state = 'moving_to_resource';
            }
            break;
            
          case 'moving_to_resource':
            if (worker.userData.target && worker.userData.target.userData.amount > 0) {
              const dist = distance(worker.position, worker.userData.target.position);
              
              if (dist < 2) {
                worker.userData.state = 'gathering';
                worker.userData.gatherProgress = 0;
              } else {
                const direction = new THREE.Vector3();
                direction.subVectors(worker.userData.target.position, worker.position).normalize();
                worker.position.x += direction.x * worker.userData.speed * delta;
                worker.position.z += direction.z * worker.userData.speed * delta;
                worker.position.y = getTerrainHeight(worker.position.x, worker.position.z);
              }
            } else {
              worker.userData.state = 'idle';
              worker.userData.target = null;
            }
            break;
            
          case 'gathering':
            worker.userData.gatherProgress += delta;
            
            if (worker.userData.gatherProgress >= 2) {
              const amount = 10 * (1 + gameState.research.gathering * 0.2);
              worker.userData.carryingResource = {
                type: worker.userData.target.userData.resourceType,
                amount: amount,
              };
              worker.userData.target.userData.amount -= amount;
              
              const dropoff = findNearestDropoff(worker, worker.userData.carryingResource.type);
              if (dropoff) {
                worker.userData.target = dropoff;
                worker.userData.state = 'moving_to_dropoff';
              } else {
                worker.userData.state = 'idle';
              }
              
              worker.userData.gatherProgress = 0;
            }
            break;
            
          case 'moving_to_dropoff':
            if (worker.userData.target) {
              const dist = distance(worker.position, worker.userData.target.position);
              
              if (dist < 2) {
                const resource = worker.userData.carryingResource;
                gameState.resources[resource.type] += resource.amount;
                worker.userData.carryingResource = null;
                
                const resourceNode = findNearestResource(worker, resource.type);
                if (resourceNode) {
                  worker.userData.target = resourceNode;
                  worker.userData.state = 'moving_to_resource';
                } else {
                  worker.userData.state = 'idle';
                }
              } else {
                const direction = new THREE.Vector3();
                direction.subVectors(worker.userData.target.position, worker.position).normalize();
                worker.position.x += direction.x * worker.userData.speed * delta;
                worker.position.z += direction.z * worker.userData.speed * delta;
                worker.position.y = getTerrainHeight(worker.position.x, worker.position.z);
              }
            } else {
              worker.userData.state = 'idle';
            }
            break;
            
          case 'building':
            if (worker.userData.target && !worker.userData.target.userData.isBuilt) {
              const building = worker.userData.target;
              building.userData.buildProgress += delta;
              
              const progress = building.userData.buildProgress / building.userData.buildTime;
              building.children.forEach(child => {
                if (child.material && child.material.opacity !== undefined) {
                  child.material.opacity = 0.6 + progress * 0.4;
                }
              });
              
              if (building.userData.buildProgress >= building.userData.buildTime) {
                building.userData.isBuilt = true;
                building.userData.state = 'idle';
                
                if (building.userData.type === 'house') {
                  gameState.population.max += 5;
                }
                
                building.children.forEach(child => {
                  if (child.material && child.material.opacity !== undefined) {
                    child.material.opacity = 1;
                  }
                });
                
                worker.userData.state = 'idle';
                worker.userData.target = null;
              } else {
                const dist = distance(worker.position, building.position);
                if (dist > 3) {
                  const direction = new THREE.Vector3();
                  direction.subVectors(building.position, worker.position).normalize();
                  worker.position.x += direction.x * worker.userData.speed * delta;
                  worker.position.z += direction.z * worker.userData.speed * delta;
                  worker.position.y = getTerrainHeight(worker.position.x, worker.position.z);
                }
              }
            } else {
              worker.userData.state = 'idle';
            }
            break;
        }
      }
    }
    
    // ==================== ENEMY AI ====================
    function initEnemyBase() {
      const enemyX = -30;
      const enemyZ = -30;
      
      enemyBase = createBuilding('town_hall', enemyX, enemyZ, 'enemy');
      enemyBase.userData.isBuilt = true;
      enemyBase.children.forEach(child => {
        if (child.material) child.material.opacity = 1;
      });
      scene.add(enemyBase);
      
      enemyBuildings.push(createBuilding('barracks', enemyX + 8, enemyZ, 'enemy'));
      enemyBuildings.push(createBuilding('archery', enemyX - 8, enemyZ, 'enemy'));
      enemyBuildings.push(createBuilding('stable', enemyX, enemyZ + 8, 'enemy'));
      
      for (const b of enemyBuildings) {
        b.userData.isBuilt = true;
        b.children.forEach(child => {
          if (child.material) child.material.opacity = 1;
        });
        scene.add(b);
      }
      
      for (let i = 0; i < 5; i++) {
        const unit = createUnit('warrior', enemyX + (Math.random() - 0.5) * 10, enemyZ + (Math.random() - 0.5) * 10, 'enemy');
        gameState.enemyUnits.push(unit);
      }
    }
    
    function updateEnemyAI(delta) {
      if (gameState.gameOver) return;
      
      if (Math.random() < 0.01 * CONFIG.difficulty) {
        const unitTypes = ['warrior', 'archer', 'knight'];
        const type = unitTypes[Math.floor(Math.random() * Math.min(gameState.wave, 3))];
        
        const barracks = enemyBuildings.find(b => b.userData.type === 'barracks' || b.userData.type === 'archery' || b.userData.type === 'stable');
        if (barracks) {
          const spawnPos = barracks.position.clone();
          spawnPos.x += (Math.random() - 0.5) * 3;
          spawnPos.z += (Math.random() - 0.5) * 3;
          spawnPos.y = getTerrainHeight(spawnPos.x, spawnPos.z);
          
          const unit = createUnit(type, spawnPos.x, spawnPos.z, 'enemy');
          gameState.enemyUnits.push(unit);
        }
      }
      
      if (gameState.waveTimer <= 0) {
        sendAttackWave();
        gameState.waveTimer = CONFIG.waveInterval;
        gameState.wave++;
      }
    }
    
    function sendAttackWave() {
      const base = gameState.buildings.find(b => b.userData.type === 'town_hall');
      if (!base) return;
      
      const waveSize = 3 + gameState.wave * 2;
      const unitTypes = ['warrior', 'archer'];
      
      if (gameState.wave >= 5) unitTypes.push('knight');
      if (gameState.wave >= 10) unitTypes.push('hero');
      
      for (let i = 0; i < waveSize; i++) {
        const type = unitTypes[Math.floor(Math.random() * unitTypes.length)];
        const spawnX = enemyBase.position.x + (Math.random() - 0.5) * 10;
        const spawnZ = enemyBase.position.z + (Math.random() - 0.5) * 10;
        
        const unit = createUnit(type, spawnX, spawnZ, 'enemy');
        unit.userData.target = base;
        unit.userData.state = 'moving';
        gameState.enemyUnits.push(unit);
      }
      
      showWaveWarning();
    }
    
    function showWaveWarning() {
      const warning = document.createElement('div');
      warning.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(139, 0, 0, 0.9);
        color: #fff;
        padding: 20px 40px;
        border-radius: 12px;
        font-size: 24px;
        font-weight: bold;
        border: 2px solid #ff4444;
        z-index: 150;
        animation: pulse 0.5s ease-in-out infinite;
      `;
      warning.textContent = `⚠️ Wave ${gameState.wave} Incoming! ⚠️`;
      document.body.appendChild(warning);
      
      setTimeout(() => warning.remove(), 3000);
    }
    
    // ==================== DAY/NIGHT CYCLE ====================
    function updateDayNight(delta) {
      gameState.dayTime += delta;
      
      if (gameState.dayTime >= CONFIG.dayLength) {
        gameState.dayTime = 0;
        gameState.isNight = !gameState.isNight;
        
        if (gameState.isNight) {
          scene.background = new THREE.Color(0x0a0a1a);
          scene.fog.color.setHex(0x0a0a1a);
          scene.children.forEach(child => {
            if (child.isLight) {
              if (child.isDirectionalLight) {
                child.intensity = 0.3;
              } else if (child.isAmbientLight) {
                child.intensity = 0.2;
              }
            }
          });
        } else {
          scene.background = new THREE.Color(0x87ceeb);
          scene.fog.color.setHex(0x87ceeb);
          scene.children.forEach(child => {
            if (child.isLight) {
              if (child.isDirectionalLight) {
                child.intensity = 1.2;
              } else if (child.isAmbientLight) {
                child.intensity = 0.6;
              }
            }
          });
        }
      }
    }
    
    // ==================== PARTICLES ====================
    function createParticle(x, y, z, color, count = 10) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const velocities = [];
      
      for (let i = 0; i < count; i++) {
        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;
        
        velocities.push({
          x: (Math.random() - 0.5) * 5,
          y: Math.random() * 5,
          z: (Math.random() - 0.5) * 5,
        });
      }
      
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      const material = new THREE.PointsMaterial({
        color,
        size: 0.3,
        transparent: true,
        opacity: 1,
      });
      
      const particles = new THREE.Points(geometry, material);
      particles.userData = { velocities, life: 1 };
      scene.add(particles);
      gameState.particles.push(particles);
    }
    
    function updateParticles(delta) {
      for (let i = gameState.particles.length - 1; i >= 0; i--) {
        const particles = gameState.particles[i];
        particles.userData.life -= delta;
        
        if (particles.userData.life <= 0) {
          scene.remove(particles);
          particles.geometry.dispose();
          particles.material.dispose();
          gameState.particles.splice(i, 1);
        } else {
          const positions = particles.geometry.attributes.position.array;
          const velocities = particles.userData.velocities;
          
          for (let j = 0; j < velocities.length; j++) {
            positions[j * 3] += velocities[j].x * delta;
            positions[j * 3 + 1] += velocities[j].y * delta;
            positions[j * 3 + 2] += velocities[j].z * delta;
            velocities[j].y -= 9.8 * delta;
          }
          
          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = particles.userData.life;
        }
      }
    }
    
    // ==================== UI UPDATES ====================
    function updateUI() {
      document.getElementById('gold-count').textContent = Math.floor(gameState.resources.gold);
      document.getElementById('wood-count').textContent = Math.floor(gameState.resources.wood);
      document.getElementById('stone-count').textContent = Math.floor(gameState.resources.stone);
      document.getElementById('crystal-count').textContent = Math.floor(gameState.resources.crystal);
      document.getElementById('pop-count').textContent = `${gameState.population.current}/${gameState.population.max}`;
      document.getElementById('wave-time').textContent = Math.floor(gameState.waveTimer);
    }
    
    function updateSelectionInfo() {
      const container = document.getElementById('selection-info');
      const title = document.getElementById('selection-title');
      const stats = document.getElementById('selection-stats');
      const abilities = document.getElementById('selection-abilities');
      
      if (gameState.selectedEntities.length === 0) {
        title.textContent = 'Select a Unit';
        stats.textContent = '';
        abilities.innerHTML = '';
        return;
      }
      
      const entity = gameState.selectedEntities[0];
      const data = entity.userData;
      
      title.textContent = `${data.owner === 'player' ? '🟣' : '🔴'} ${data.type.charAt(0).toUpperCase() + data.type.slice(1)}`;
      
      stats.innerHTML = `
        <div>HP: ${Math.floor(data.hp)}/${data.maxHp}</div>
        <div>Damage: ${data.damage}</div>
        <div>Range: ${data.range}</div>
        <div>Speed: ${data.speed}</div>
        <div>State: ${data.state}</div>
      `;
      
      abilities.innerHTML = '';
      
      if (data.type === 'worker' && data.owner === 'player') {
        const buildBtn = document.createElement('button');
        buildBtn.className = 'build-btn';
        buildBtn.textContent = '🔨 Build';
        buildBtn.onclick = () => {
          document.getElementById('build-menu').scrollIntoView();
        };
        abilities.appendChild(buildBtn);
      }
      
      if (data.type === 'town_hall' && data.owner === 'player') {
        const trainBtn = document.createElement('button');
        trainBtn.className = 'build-btn';
        trainBtn.textContent = '👷 Train Worker';
        trainBtn.onclick = () => trainUnit('worker');
        abilities.appendChild(trainBtn);
      }
      
      if (data.type === 'barracks' && data.owner === 'player') {
        const trainBtn = document.createElement('button');
        trainBtn.className = 'build-btn';
        trainBtn.textContent = '⚔️ Train Warrior';
        trainBtn.onclick = () => trainUnit('warrior');
        abilities.appendChild(trainBtn);
      }
      
      if (data.type === 'archery' && data.owner === 'player') {
        const trainBtn = document.createElement('button');
        trainBtn.className = 'build-btn';
        trainBtn.textContent = '🏹 Train Archer';
        trainBtn.onclick = () => trainUnit('archer');
        abilities.appendChild(trainBtn);
      }
      
      if (data.type === 'stable' && data.owner === 'player') {
        const trainBtn = document.createElement('button');
        trainBtn.className = 'build-btn';
        trainBtn.textContent = '🐴 Train Knight';
        trainBtn.onclick = () => trainUnit('knight');
        abilities.appendChild(trainBtn);
      }
    }
    
    // ==================== MINIMAP ====================
    function updateMinimap() {
      const canvas = document.getElementById('minimap-canvas');
      const ctx = canvas.getContext('2d');
      const size = 200;
      const scale = size / (CONFIG.mapSize * CONFIG.tileSize);
      
      ctx.fillStyle = '#1a3a1a';
      ctx.fillRect(0, 0, size, size);
      
      ctx.fillStyle = '#3a5a3a';
      for (let i = 0; i < 50; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      
      for (const node of gameState.resourceNodes) {
        const x = (node.position.x + CONFIG.mapSize) * scale;
        const y = (node.position.z + CONFIG.mapSize) * scale;
        
        switch(node.userData.resourceType) {
          case 'gold': ctx.fillStyle = '#ffd700'; break;
          case 'wood': ctx.fillStyle = '#8b4513'; break;
          case 'stone': ctx.fillStyle = '#808080'; break;
          case 'crystal': ctx.fillStyle = '#9b59b6'; break;
        }
        
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      
      ctx.fillStyle = '#3498db';
      for (const b of gameState.buildings) {
        if (b.userData.owner === 'player') {
          const x = (b.position.x + CONFIG.mapSize) * scale;
          const y = (b.position.z + CONFIG.mapSize) * scale;
          ctx.fillRect(x - 3, y - 3, 6, 6);
        }
      }
      
      ctx.fillStyle = '#e74c3c';
      for (const b of enemyBuildings) {
        const x = (b.position.x + CONFIG.mapSize) * scale;
        const y = (b.position.z + CONFIG.mapSize) * scale;
        ctx.fillRect(x - 3, y - 3, 6, 6);
      }
      
      ctx.fillStyle = '#00ff00';
      for (const u of gameState.playerUnits) {
        if (u.userData.hp > 0) {
          const x = (u.position.x + CONFIG.mapSize) * scale;
          const y = (u.position.z + CONFIG.mapSize) * scale;
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      ctx.fillStyle = '#ff0000';
      for (const u of gameState.enemyUnits) {
        if (u.userData.hp > 0) {
          const x = (u.position.x + CONFIG.mapSize) * scale;
          const y = (u.position.z + CONFIG.mapSize) * scale;
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      const viewSize = 20;
      ctx.rect(
        size/2 - viewSize/2,
        size/2 - viewSize/2,
        viewSize,
        viewSize
      );
      ctx.stroke();
    }
    
    // ==================== GAME LOOP ====================
    function gameLoop() {
      requestAnimationFrame(gameLoop);
      
      const delta = Math.min(clock.getDelta(), 0.1);
      
      if (gameState.isPaused || gameState.gameOver) {
        renderer.render(scene, camera);
        return;
      }
      
      updateDayNight(delta);
      updateEconomy(delta);
      updateCombat(delta);
      updateEnemyAI(delta);
      updateParticles(delta);
      
      gameState.waveTimer -= delta;
      if (gameState.waveTimer < 0) gameState.waveTimer = 0;
      
      checkGameEnd();
      updateUI();
      updateMinimap();
      
      renderer.render(scene, camera);
    }
    
    function checkGameEnd() {
      const townHall = gameState.buildings.find(b => b.userData.type === 'town_hall' && b.userData.owner === 'player');
      if (!townHall || townHall.userData.hp <= 0) {
        gameState.gameOver = true;
        gameState.victory = false;
        showGameOver(false);
        return;
      }
      
      if (gameState.wave >= 10 && enemyBase.userData.hp <= 0) {
        gameState.gameOver = true;
        gameState.victory = true;
        showGameOver(true);
        return;
      }
    }
    
    function showGameOver(victory) {
      const overlay = document.getElementById('game-over');
      const title = document.getElementById('game-over-title');
      const message = document.getElementById('game-over-message');
      
      overlay.style.display = 'flex';
      
      if (victory) {
        title.textContent = '🏆 Victory! 🏆';
        title.style.color = '#ffd700';
        message.textContent = `You defended Aetherhaven through ${gameState.wave} waves!`;
      } else {
        title.textContent = '💀 Defeat 💀';
        title.style.color = '#ff4444';
        message.textContent = 'Your kingdom has fallen...';
      }
    }
    
    // ==================== INITIALIZATION ====================
    function initGame() {
      document.getElementById('loading').style.display = 'none';
      
      initThree();
      createTerrain();
      
      const playerBase = createBuilding('town_hall', 0, 0, 'player');
      playerBase.userData.isBuilt = true;
      playerBase.children.forEach(child => {
        if (child.material) child.material.opacity = 1;
      });
      gameState.buildings.push(playerBase);
      
      for (let i = 0; i < 5; i++) {
        const worker = createUnit('worker', (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5, 'player');
        gameState.playerUnits.push(worker);
      }
      
      const resourceTypes = ['gold', 'wood', 'stone', 'crystal'];
      for (let i = 0; i < 30; i++) {
        const type = resourceTypes[Math.floor(Math.random() * resourceTypes.length)];
        const x = (Math.random() - 0.5) * CONFIG.mapSize * CONFIG.tileSize * 0.8;
        const z = (Math.random() - 0.5) * CONFIG.mapSize * CONFIG.tileSize * 0.8;
        
        if (Math.sqrt(x * x + z * z) < 15) continue;
        
        const node = createResourceNode(type, x, z);
        gameState.resourceNodes.push(node);
      }
      
      initEnemyBase();
      setupInput();
      gameLoop();
    }
    
    function startGame(difficulty) {
      CONFIG.difficulty = difficulty;
      
      switch(difficulty) {
        case 'easy':
          CONFIG.waveInterval = 240;
          CONFIG.startingResources = { gold: 800, wood: 500, stone: 300, crystal: 200 };
          break;
        case 'medium':
          CONFIG.waveInterval = 180;
          CONFIG.startingResources = { gold: 500, wood: 300, stone: 200, crystal: 100 };
          break;
        case 'hard':
          CONFIG.waveInterval = 120;
          CONFIG.startingResources = { gold: 300, wood: 200, stone: 100, crystal: 50 };
          break;
      }
      
      gameState.resources = { ...CONFIG.startingResources };
      
      document.getElementById('difficulty-select').style.display = 'none';
      initGame();
    }
    
    function restartGame() {
      gameState = {
        resources: { ...CONFIG.startingResources },
        population: { current: 5, max: 20 },
        wave: 1,
        waveTimer: CONFIG.waveInterval,
        dayTime: 0,
        isNight: false,
        isPaused: false,
        buildMode: null,
        selectedEntities: [],
        playerUnits: [],
        enemyUnits: [],
        buildings: [],
        resourceNodes: [],
        particles: [],
        projectiles: [],
        gameOver: false,
        victory: false,
        research: {
          attack: 0,
          armor: 0,
          gathering: 0,
        }
      };
      
      while (scene.children.length > 0) {
        const obj = scene.children[0];
        scene.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) {
            obj.material.forEach(m => m.dispose());
          } else {
            obj.material.dispose();
          }
        }
      }
      
      document.getElementById('game-over').style.display = 'none';
      initGame();
    }
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 1000);
    });
  </script>
</body>
