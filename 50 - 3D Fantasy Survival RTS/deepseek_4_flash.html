<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eldoria: Kingdom of Light</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(180deg, rgba(20, 30, 50, .92), rgba(20, 30, 50, .7));
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 100;
            border-bottom: 2px solid rgba(255, 200, 100, .3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
        }
        .resource {
            display: flex;
            align-items: center;
            margin-right: 20px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, .5);
            background: rgba(0, 0, 0, .3);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .resource-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 6px;
            display: inline-block;
        }
        .gold-icon {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            box-shadow: 0 0 8px #ffd700;
        }
        .wood-icon {
            background: linear-gradient(135deg, #8b6914, #5c3a1e);
            box-shadow: 0 0 8px #8b6914;
        }
        .stone-icon {
            background: linear-gradient(135deg, #a0a0a0, #606060);
            box-shadow: 0 0 8px #a0a0a0;
        }
        .pop-icon {
            background: linear-gradient(135deg, #4ecdc4, #2e8b8b);
            box-shadow: 0 0 8px #4ecdc4;
        }
        #time-display {
            margin-left: auto;
            color: #fff;
            font-size: 13px;
            background: rgba(0, 0, 0, .3);
            padding: 4px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
        }
        #ui-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 160px;
            background: linear-gradient(0deg, rgba(15, 20, 40, .95), rgba(15, 20, 40, .6));
            display: flex;
            padding: 10px;
            z-index: 100;
            border-top: 2px solid rgba(255, 200, 100, .3);
        }
        #selection-panel {
            width: 200px;
            background: rgba(0, 0, 0, .4);
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, .1);
        }
        #selection-panel h3 {
            font-size: 14px;
            margin-bottom: 5px;
            color: #ffd700;
        }
        #selection-panel p {
            font-size: 12px;
            color: #aaa;
            margin: 2px 0;
        }
        #build-menu {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 5px 15px;
            align-content: flex-start;
            overflow-y: auto;
            max-height: 150px;
        }
        .build-btn {
            background: linear-gradient(135deg, #2a3a5c, #1a2a3c);
            border: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            text-align: center;
        }
        .build-btn:hover {
            background: linear-gradient(135deg, #3a4a6c, #2a3a5c);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, .3);
        }
        .build-btn.disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .build-btn .cost {
            font-size: 10px;
            color: #ffd700;
            margin-top: 3px;
        }
        #info-panel {
            position: fixed;
            right: 10px;
            top: 60px;
            background: rgba(15, 20, 40, .85);
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, .15);
            max-width: 220px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
        }
        #info-panel h4 {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, .2);
            padding-bottom: 4px;
        }
        #info-panel p {
            font-size: 12px;
            color: #ccc;
            margin: 3px 0;
            line-height: 1.5;
        }
        #wave-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(200, 50, 50, .9);
            color: #fff;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: 700;
            z-index: 200;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
            animation: waveAnim 2s ease-out;
            opacity: 0;
            transition: opacity .5s;
        }
        @keyframes waveAnim {
            0% {
                transform: translate(-50%, -50%) scale(.5);
                opacity: 0;
            }
            20% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
            80% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        #gameover-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, .8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
            flex-direction: column;
        }
        #gameover-overlay h2 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, .5);
        }
        #gameover-overlay p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 30px;
        }
        #gameover-overlay button {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            color: #1a1a2e;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
        }
        #gameover-overlay button:hover {
            transform: scale(1.05);
        }
        .minimap {
            position: fixed;
            bottom: 180px;
            right: 10px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, .5);
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, .2);
            z-index: 100;
        }
        .minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="ui-top">
        <div class="resource"><span class="resource-icon gold-icon"></span><span id="gold-text">100</span></div>
        <div class="resource"><span class="resource-icon wood-icon"></span><span id="wood-text">50</span></div>
        <div class="resource"><span class="resource-icon stone-icon"></span><span id="stone-text">0</span></div>
        <div class="resource"><span class="resource-icon pop-icon"></span><span id="pop-text">0/10</span></div>
        <div id="time-display"><span id="day-night-icon">☀️</span> <span id="time-text">Day 1</span></div>
    </div>
    <div id="ui-bottom">
        <div id="selection-panel">
            <h3>No Selection</h3>
            <p>Select a unit or building</p>
        </div>
        <div id="build-menu"></div>
    </div>
    <div id="info-panel">
        <h4>Eldoria</h4>
        <p>Build your kingdom. Survive the waves.</p>
        <p>Left-click: Select</p>
        <p>Right-click: Move/Attack</p>
        <p>WASD: Pan camera</p>
    </div>
    <div id="wave-banner"></div>
    <div id="gameover-overlay">
        <h2 id="gameover-title">Victory!</h2>
        <p id="gameover-message"></p>
        <button onclick="restartGame()">Play Again</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script>
        // ==================== GAME STATE ====================
        const game = {
            resources: { gold: 100, wood: 50, stone: 0 },
            population: 0,
            populationCap: 10,
            selectedUnits: [],
            units: [],
            buildings: [],
            enemies: [],
            projectiles: [],
            particles: [],
            dayTime: 0,
            dayLength: 120,
            waveNumber: 0,
            nextWaveTime: 60,
            gameOver: false,
            victory: false,
            time: 0,
            cameraTarget: new THREE.Vector3(0, 0, 0),
            isPlacing: false,
            placeBuildingType: null,
            enemyBase: null,
            workerCount: 0,
        };

        // ==================== THREE.JS SETUP ====================
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(30, 35, 40);
        camera.lookAt(0, 0, 0);

        // ==================== LIGHTING ====================
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(20, 30, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        sunLight.shadow.camera.left = -40;
        sunLight.shadow.camera.right = 40;
        sunLight.shadow.camera.top = 40;
        sunLight.shadow.camera.bottom = -40;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 100;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        // ==================== TERRAIN ====================
        function generateTerrain() {
            const geo = new THREE.PlaneGeometry(80, 80, 40, 40);
            const verts = geo.attributes.position;
            for (let i = 0; i < verts.count; i++) {
                const x = verts.getX(i);
                const y = verts.getY(i);
                const h = Math.sin(x * 0.3) * Math.cos(y * 0.3) * 1.5 +
                    Math.sin(x * 0.7 + y * 0.5) * 0.5;
                verts.setZ(i, h);
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshPhongMaterial({
                color: 0x4a7c3f,
                flatShading: true,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // Add some decorative grass patches
            for (let i = 0; i < 100; i++) {
                const x = (Math.random() - 0.5) * 70;
                const z = (Math.random() - 0.5) * 70;
                const grass = new THREE.Mesh(
                    new THREE.ConeGeometry(0.3, 0.8, 4),
                    new THREE.MeshPhongMaterial({ color: 0x3a6c2f, flatShading: true })
                );
                grass.position.set(x, 0.4, z);
                grass.castShadow = true;
                scene.add(grass);
            }
        }

        // ==================== RESOURCE NODES ====================
        const resourceNodes = [];

        function createResourceNodes() {
            // Trees (wood)
            for (let i = 0; i < 30; i++) {
                const x = (Math.random() - 0.5) * 60;
                const z = (Math.random() - 0.5) * 60;
                if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
                const tree = createTree();
                tree.position.set(x, 0, z);
                scene.add(tree);
                resourceNodes.push({
                    mesh: tree,
                    type: 'wood',
                    amount: 50,
                    x,
                    z
                });
            }
            // Gold deposits
            for (let i = 0; i < 8; i++) {
                const x = (Math.random() - 0.5) * 50;
                const z = (Math.random() - 0.5) * 50;
                if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
                const gold = createGoldDeposit();
                gold.position.set(x, 0, z);
                scene.add(gold);
                resourceNodes.push({
                    mesh: gold,
                    type: 'gold',
                    amount: 100,
                    x,
                    z
                });
            }
            // Stone deposits
            for (let i = 0; i < 5; i++) {
                const x = (Math.random() - 0.5) * 45;
                const z = (Math.random() - 0.5) * 45;
                if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
                const stone = createStoneDeposit();
                stone.position.set(x, 0, z);
                scene.add(stone);
                resourceNodes.push({
                    mesh: stone,
                    type: 'stone',
                    amount: 80,
                    x,
                    z
                });
            }
        }

        function createTree() {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.4, 1.5),
                new THREE.MeshPhongMaterial({ color: 0x5c3a1e, flatShading: true })
            );
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            group.add(trunk);
            const leaves = new THREE.Mesh(
                new THREE.ConeGeometry(0.8, 1.5, 6),
                new THREE.MeshPhongMaterial({ color: 0x2d6a2e, flatShading: true })
            );
            leaves.position.y = 2;
            leaves.castShadow = true;
            group.add(leaves);
            return group;
        }

        function createGoldDeposit() {
            const group = new THREE.Group();
            const rock = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.8, 0),
                new THREE.MeshPhongMaterial({ color: 0x808080, flatShading: true })
            );
            rock.position.y = 0.4;
            rock.castShadow = true;
            group.add(rock);
            const goldNugget = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 8, 8),
                new THREE.MeshPhongMaterial({ color: 0xffd700, flatShading: true, emissive: 0x332200 })
            );
            goldNugget.position.y = 0.7;
            group.add(goldNugget);
            return group;
        }

        function createStoneDeposit() {
            const group = new THREE.Group();
            const rock = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.7, 0),
                new THREE.MeshPhongMaterial({ color: 0x909090, flatShading: true })
            );
            rock.position.y = 0.4;
            rock.castShadow = true;
            group.add(rock);
            const rock2 = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.4, 0),
                new THREE.MeshPhongMaterial({ color: 0x707070, flatShading: true })
            );
            rock2.position.set(0.4, 0.3, 0.2);
            group.add(rock2);
            return group;
        }

        // ==================== BUILDINGS ====================
        const buildingDefinitions = {
            townhall: {
                name: 'Town Hall',
                cost: { gold: 50, wood: 20, stone: 0 },
                hp: 500,
                size: 2.5,
                buildTime: 5,
                icon: '🏰'
            },
            barracks: {
                name: 'Barracks',
                cost: { gold: 80, wood: 40, stone: 0 },
                hp: 300,
                size: 2,
                buildTime: 8,
                icon: '⚔️'
            },
            lumbermill: {
                name: 'Lumber Mill',
                cost: { gold: 60, wood: 10, stone: 0 },
                hp: 200,
                size: 1.8,
                buildTime: 5,
                icon: '🪵'
            },
            goldmine: {
                name: 'Gold Mine',
                cost: { gold: 30, wood: 30, stone: 0 },
                hp: 200,
                size: 1.8,
                buildTime: 5,
                icon: '⛏️'
            },
            tower: {
                name: 'Guard Tower',
                cost: { gold: 100, wood: 50, stone: 20 },
                hp: 250,
                size: 1.5,
                buildTime: 10,
                icon: '🏯'
            },
            farm: {
                name: 'Farm',
                cost: { gold: 40, wood: 20, stone: 0 },
                hp: 150,
                size: 1.8,
                buildTime: 4,
                icon: '🌾'
            },
        };

        function createBuildingMesh(type) {
            const group = new THREE.Group();
            const def = buildingDefinitions[type];
            if (type === 'townhall') {
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(2.5, 1.5, 2),
                    new THREE.MeshPhongMaterial({ color: 0x8B7355, flatShading: true })
                );
                base.position.y = 0.75;
                base.castShadow = true;
                group.add(base);
                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(1.8, 1, 4),
                    new THREE.MeshPhongMaterial({ color: 0x6B3A2A, flatShading: true })
                );
                roof.position.y = 2.2;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);
                const tower = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.6, 2, 6),
                    new THREE.MeshPhongMaterial({ color: 0x9B8B6B, flatShading: true })
                );
                tower.position.set(0.8, 1.5, 0.8);
                tower.castShadow = true;
                group.add(tower);
            } else if (type === 'barracks') {
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 1.2, 1.5),
                    new THREE.MeshPhongMaterial({ color: 0x8B3A3A, flatShading: true })
                );
                base.position.y = 0.6;
                base.castShadow = true;
                group.add(base);
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(2.2, 0.4, 1.7),
                    new THREE.MeshPhongMaterial({ color: 0x5C2A2A, flatShading: true })
                );
                roof.position.y = 1.4;
                roof.castShadow = true;
                group.add(roof);
            } else if (type === 'lumbermill') {
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(1.8, 1, 1.5),
                    new THREE.MeshPhongMaterial({ color: 0x8B6B4A, flatShading: true })
                );
                base.position.y = 0.5;
                base.castShadow = true;
                group.add(base);
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 0.3, 1.7),
                    new THREE.MeshPhongMaterial({ color: 0x4A3A2A, flatShading: true })
                );
                roof.position.y = 1.3;
                roof.castShadow = true;
                group.add(roof);
            } else if (type === 'goldmine') {
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(1.8, 0.8, 1.5),
                    new THREE.MeshPhongMaterial({ color: 0x7A6A5A, flatShading: true })
                );
                base.position.y = 0.4;
                base.castShadow = true;
                group.add(base);
                const gold = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 8, 8),
                    new THREE.MeshPhongMaterial({ color: 0xffd700, flatShading: true, emissive: 0x221100 })
                );
                gold.position.y = 0.8;
                gold.castShadow = true;
                group.add(gold);
            } else if (type === 'tower') {
                const base = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.8, 1, 2.5, 6),
                    new THREE.MeshPhongMaterial({ color: 0x8B8B7A, flatShading: true })
                );
                base.position.y = 1.25;
                base.castShadow = true;
                group.add(base);
                const top = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.6, 0.7, 0.8, 6),
                    new THREE.MeshPhongMaterial({ color: 0x6B6B5A, flatShading: true })
                );
                top.position.y = 2.8;
                top.castShadow = true;
                group.add(top);
            } else if (type === 'farm') {
                const field = new THREE.Mesh(
                    new THREE.BoxGeometry(1.8, 0.4, 1.5),
                    new THREE.MeshPhongMaterial({ color: 0x5A8A3A, flatShading: true })
                );
                field.position.y = 0.2;
                field.castShadow = true;
                group.add(field);
                const crops = new THREE.Mesh(
                    new THREE.BoxGeometry(1.4, 0.5, 1),
                    new THREE.MeshPhongMaterial({ color: 0x7A6A2A, flatShading: true })
                );
                crops.position.y = 0.5;
                group.add(crops);
            }
            return group;
        }

        // ==================== UNITS ====================
        const unitDefinitions = {
            worker: {
                name: 'Worker',
                cost: { gold: 20, wood: 0, stone: 0 },
                hp: 50,
                damage: 2,
                range: 1,
                speed: 4,
                buildTime: 3,
                icon: '👷'
            },
            swordsman: {
                name: 'Swordsman',
                cost: { gold: 40, wood: 10, stone: 0 },
                hp: 120,
                damage: 12,
                range: 1.5,
                speed: 3.5,
                buildTime: 5,
                icon: '⚔️'
            },
            archer: {
                name: 'Archer',
                cost: { gold: 50, wood: 20, stone: 0 },
                hp: 70,
                damage: 8,
                range: 8,
                speed: 3,
                buildTime: 4,
                icon: '🏹'
            },
            mage: {
                name: 'Mage',
                cost: { gold: 80, wood: 30, stone: 10 },
                hp: 60,
                damage: 20,
                range: 7,
                speed: 2.5,
                buildTime: 6,
                icon: '🔮'
            },
            knight: {
                name: 'Knight',
                cost: { gold: 100, wood: 20, stone: 20 },
                hp: 200,
                damage: 18,
                range: 2,
                speed: 4.5,
                buildTime: 8,
                icon: '🐴'
            },
        };

        function createUnitMesh(type, team) {
            const group = new THREE.Group();
            const colors = team === 'player' ? {
                body: 0x4A90D9,
                accent: 0xFFD700
            } : {
                body: 0x8B2A2A,
                accent: 0xFF4444
            };
            if (type === 'worker') {
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.8, 0.4),
                    new THREE.MeshPhongMaterial({ color: colors.body, flatShading: true })
                );
                body.position.y = 0.4;
                body.castShadow = true;
                group.add(body);
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.25, 8, 8),
                    new THREE.MeshPhongMaterial({ color: 0xFFB07A, flatShading: true })
                );
                head.position.y = 1;
                group.add(head);
            } else if (type === 'swordsman') {
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.7, 1, 0.5),
                    new THREE.MeshPhongMaterial({ color: colors.body, flatShading: true })
                );
                body.position.y = 0.5;

        // ==================== GAME OBJECTS ====================
        const unitList = [];
        const buildingList = [];
        const enemyList = [];
        const projectileList = [];

        // ==================== BUILDING PLACEMENT ====================
        function placeBuilding(type, x, z) {
            const def = buildingDefinitions[type];
            if (!def) return;
            // Check cost
            if (game.resources.gold < def.cost.gold ||
                game.resources.wood < def.cost.wood ||
                game.resources.stone < def.cost.stone) {
                showInfo('Not enough resources!');
                return;
            }
            // Deduct cost
            game.resources.gold -= def.cost.gold;
            game.resources.wood -= def.cost.wood;
            game.resources.stone -= def.cost.stone;

            const mesh = createBuildingMesh(type);
            mesh.position.set(x, 0, z);
            scene.add(mesh);

            const building = {
                type,
                mesh,
                x,
                z,
                hp: def.hp,
                maxHp: def.hp,
                team: 'player',
                isBuilding: true,
                buildProgress: 0,
                buildTime: def.buildTime
            };

            buildingList.push(building);

            // Update population cap for farm
            if (type === 'farm') {
                game.populationCap += 5;
            }
            if (type === 'townhall') {
                game.populationCap += 10;
            }

            updateUI();
            return building;
        }

        // ==================== UNIT SPAWNING ====================
        function spawnUnit(type, x, z, team) {
            const def = unitDefinitions[type];
            if (!def) return null;

            if (team === 'player') {
                if (game.resources.gold < def.cost.gold ||
                    game.resources.wood < def.cost.wood ||
                    game.resources.stone < def.cost.stone) {
                    showInfo('Not enough resources!');
                    return null;
                }
                if (game.population >= game.populationCap) {
                    showInfo('Population limit reached!');
                    return null;
                }
                game.resources.gold -= def.cost.gold;
                game.resources.wood -= def.cost.wood;
                game.resources.stone -= def.cost.stone;
                game.population++;
            }

            const mesh = createUnitMesh(type, team);
            mesh.position.set(x, 0, z);
            scene.add(mesh);

            const unit = {
                type,
                mesh,
                x,
                z,
                hp: def.hp,
                maxHp: def.hp,
                damage: def.damage,
                range: def.range,
                speed: def.speed,
                team,
                target: null,
                attackCooldown: 0,
                moveTarget: null,
                isGathering: false,
                gatherTarget: null,
                selected: false
            };

            if (team === 'player') {
                unitList.push(unit);
            } else {
                enemyList.push(unit);
            }

            return unit;
        }

        // ==================== INPUT HANDLING ====================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let leftMouseDown = false;
        let rightMouseDown = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let isDragging = false;

        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        canvas.addEventListener('wheel', onWheel);

        const keys = {};
        document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

        function onMouseDown(e) {
            if (e.button === 0) {
                leftMouseDown = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                isDragging = false;
                // Check if placing building
                if (game.isPlacing) {
                    const point = getGroundPoint(e);
                    if (point) {
                        placeBuilding(game.placeBuildingType, point.x, point.z);
                        game.isPlacing = false;
                        game.placeBuildingType = null;
                        updateBuildMenu();
                    }
                    return;
                }
            }
            if (e.button === 2) {
                rightMouseDown = true;
                const point = getGroundPoint(e);
                if (point) {
                    // Command selected units
                    const selected = unitList.filter(u => u.selected);
                    selected.forEach(unit => {
                        unit.moveTarget = point;
                        unit.target = null;
                        unit.isGathering = false;
                    });
                }
            }
        }

        function onMouseUp(e) {
            if (e.button === 0) {
                leftMouseDown = false;
                if (!isDragging) {
                    // Click selection
                    selectUnits(e);
                }
                isDragging = false;
            }
            if (e.button === 2) {
                rightMouseDown = false;
            }
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (leftMouseDown) {
                const dx = Math.abs(e.clientX - dragStartX);
                const dy = Math.abs(e.clientY - dragStartY);
                if (dx > 5 || dy > 5) {
                    isDragging = true;
                }
            }

            // Update camera pan with WASD
            const cameraSpeed = 0.3;
            if (keys['w']) {
                game.cameraTarget.z -= cameraSpeed;
            }
            if (keys['s']) {
                game.cameraTarget.z += cameraSpeed;
            }
            if (keys['a']) {
                game.cameraTarget.x -= cameraSpeed;
            }
            if (keys['d']) {
                game.cameraTarget.x += cameraSpeed;
            }
        }

        function onWheel(e) {
            camera.position.y += e.deltaY * 0.05;
            camera.position.y = Math.max(10, Math.min(80, camera.position.y));
        }

        function getGroundPoint(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const my = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(new THREE.Vector2(mx, my), camera);
            const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersection = new THREE.Vector3();
            raycaster.ray.intersectPlane(groundPlane, intersection);
            return intersection;
        }

        function selectUnits(e) {
            // Deselect all
            unitList.forEach(u => {
                u.selected = false;
                if (u.mesh) u.mesh.traverse(c => { if (c.material) c.material.emissive && c.material.emissive.set(0x000000); });
            });

            const point = getGroundPoint(e);
            if (!point) return;

            // Find units near click
            let closest = null;
            let closestDist = 3;
            unitList.forEach(unit => {
                const dist = Math.sqrt((unit.x - point.x) ** 2 + (unit.z - point.z) ** 2);
                if (dist < closestDist) {
                    closest = unit;
                    closestDist = dist;
                }
            });

            if (closest) {
                closest.selected = true;
                game.selectedUnits = [closest];
                updateSelectionPanel(closest);
            } else {
                // Check buildings
                let closestBuilding = null;
                let closestBDist = 4;
                buildingList.forEach(b => {
                    const dist = Math.sqrt((b.x - point.x) ** 2 + (b.z - point.z) ** 2);
                    if (dist < closestBDist) {
                        closestBuilding = b;
                        closestBDist = dist;
                    }
                });
                if (closestBuilding) {
                    updateSelectionPanel(closestBuilding);
                } else {
                    updateSelectionPanel(null);
                }
            }
        }

        // ==================== COMBAT SYSTEM ====================
        function updateCombat(dt) {
            // Player units attack enemies
            unitList.forEach(unit => {
                if (unit.attackCooldown > 0) {
                    unit.attackCooldown -= dt;
                }
                // Find enemy in range
                if (!unit.target || unit.target.hp <= 0) {
                    let nearestEnemy = null;
                    let nearestDist = unit.range;
                    enemyList.forEach(enemy => {
                        const dist = Math.sqrt((unit.x - enemy.x) ** 2 + (unit.z - enemy.z) ** 2);
                        if (dist < nearestDist) {
                            nearestEnemy = enemy;
                            nearestDist = dist;
                        }
                    });
                    unit.target = nearestEnemy;
                }

                // Move towards target if out of range
                if (unit.target) {
                    const dist = Math.sqrt((unit.x - unit.target.x) ** 2 + (unit.z - unit.target.z) ** 2);
                    if (dist > unit.range) {
                        // Move towards target
                        const dx = unit.target.x - unit.x;
                        const dz = unit.target.z - unit.z;
                        const len = Math.sqrt(dx * dx + dz * dz);
                        if (len > 0) {
                            unit.x += (dx / len) * unit.speed * dt;
                            unit.z += (dz / len) * unit.speed * dt;
                            unit.mesh.position.set(unit.x, 0, unit.z);
                        }
                    } else {
                        // Attack
                        if (unit.attackCooldown <= 0) {
                            unit.attackCooldown = 1;
                            unit.target.hp -= unit.damage;
                            // Spawn attack particle
                            spawnAttackParticle(unit.x, unit.z, unit.target.x, unit.target.z);
                            if (unit.target.hp <= 0) {
                                // Kill enemy
                                scene.remove(unit.target.mesh);
                                const idx = enemyList.indexOf(unit.target);
                                if (idx > -1) enemyList.splice(idx, 1);
                                unit.target = null;
                            }
                        }
                    }
                } else if (unit.moveTarget) {
                    // Move towards move target
                    const dx = unit.moveTarget.x - unit.x;
                    const dz = unit.moveTarget.z - unit.z;
                    const len = Math.sqrt(dx * dx + dz * dz);
                    if (len > 0.5) {
                        unit.x += (dx / len) * unit.speed * dt;
                        unit.z += (dz / len) * unit.speed * dt;
                        unit.mesh.position.set(unit.x, 0, unit.z);
                    } else {
                        unit.moveTarget = null;
                    }
                }
            });

            // Enemy units attack player
            enemyList.forEach(enemy => {
                if (enemy.attackCooldown > 0) {
                    enemy.attackCooldown -= dt;
                }
                // Find player unit or building in range
                let nearestTarget = null;
                let nearestDist = enemy.range;
                unitList.forEach(unit => {
                    const dist = Math.sqrt((enemy.x - unit.x) ** 2 + (enemy.z - unit.z) ** 2);
                    if (dist < nearestDist) {
                        nearestTarget = unit;
                        nearestDist = dist;
                    }
                });
                // Also check buildings
                buildingList.forEach(b => {
                    if (b.team !== 'player') return;
                    const dist = Math.sqrt((enemy.x - b.x) ** 2 + (enemy.z - b.z) ** 2);
                    if (dist < nearestDist) {
                        nearestTarget = b;
                        nearestDist = dist;
                    }
                });

                if (nearestTarget) {
                    const dist = Math.sqrt((enemy.x - nearestTarget.x) ** 2 + (enemy.z - nearestTarget.z) ** 2);
                    if (dist > enemy.range) {
                        const dx = nearestTarget.x - enemy.x;
                        const dz = nearestTarget.z - enemy.z;
                        const len = Math.sqrt(dx * dx + dz * dz);
                        if (len > 0) {
                            enemy.x += (dx / len) * enemy.speed * dt;
                            enemy.z += (dz / len) * enemy.speed * dt;
                            enemy.mesh.position.set(enemy.x, 0, enemy.z);
                        }
                    } else {
                        if (enemy.attackCooldown <= 0) {
                            enemy.attackCooldown = 1;
                            nearestTarget.hp -= enemy.damage;
                            spawnAttackParticle(enemy.x, enemy.z, nearestTarget.x, nearestTarget.z);
                            if (nearestTarget.hp <= 0) {
                                if (nearestTarget.team === 'player') {
                                    // Kill player unit
                                    scene.remove(nearestTarget.mesh);
                                    const idx = unitList.indexOf(nearestTarget);
                                    if (idx > -1) unitList.splice(idx, 1);
                                    game.population--;
                                } else {
                                    // Destroy building
                                    scene.remove(nearestTarget.mesh);
                                    const idx = buildingList.indexOf(nearestTarget);
                                    if (idx > -1) buildingList.splice(idx, 1);
                                }
                            }
                        }
                    }
                }
            });
        }

        // ==================== PARTICLES ====================
        function spawnAttackParticle(x1, z1, x2, z2) {
            const particle = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 4, 4),
                new THREE.MeshBasicMaterial({ color: 0xFFAA00, transparent: true, opacity: 0.8 })
            );
            particle.position.set((x1 + x2) / 2, 1, (z1 + z2) / 2);
            scene.add(particle);
            projectileList.push({
                mesh: particle,
                life: 0.3,
                vx: (x2 - x1) * 3,
                vz: (z2 - z1) * 3,
                vy: 3
            });
        }

        function updateParticles(dt) {
            for (let i = projectileList.length - 1; i >= 0; i--) {
                const p = projectileList[i];
                p.life -= dt;
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;
                p.vy -= 9.8 * dt;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    projectileList.splice(i, 1);
                }
            }
        }

        // ==================== ENEMY WAVES ====================
        function spawnEnemyWave() {
            game.waveNumber++;
            const waveSize = Math.min(5 + game.waveNumber * 2, 30);
            const enemyTypes = ['swordsman', 'swordsman', 'archer', 'swordsman', 'knight'];
            const spawnAngel = Math.random() * Math.PI * 2;
            const spawnRadius = 35;

            for (let i = 0; i < waveSize; i++) {
                const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                const x = Math.cos(spawnAngel) * spawnRadius + (Math.random() - 0.5) * 5;
                const z = Math.sin(spawnAngel) * spawnRadius + (Math.random() - 0.5) * 5;
                const enemy = spawnUnit(type, x, z, 'enemy');
                if (enemy) {
                    // Set enemy to attack player base
                    enemy.moveTarget = new THREE.Vector3(0, 0, 0);
                }
            }

            // Show wave banner
            const banner = document.getElementById('wave-banner');
            banner.textContent = `Wave ${game.waveNumber} Incoming!`;
            banner.style.opacity = 1;
            banner.style.animation = 'none';
            banner.offsetHeight;
            banner.style.animation = 'waveAnim 2s ease-out';
            setTimeout(() => { banner.style.opacity = 0; }, 2000);

            // Schedule next wave
            game.nextWaveTime = Math.max(30, 60 - game.waveNumber * 2);
        }

        // ==================== RESOURCE GATHERING ====================
        function updateResourceGathering(dt) {
            // Workers auto-gather nearby resources
            unitList.forEach(unit => {
                if (unit.type !== 'worker') return;

                // Find nearest resource node
                let nearestNode = null;
                let nearestDist = 10;
                resourceNodes.forEach(node => {
                    if (node.amount <= 0) return;
                    const dist = Math.sqrt((unit.x - node.x) ** 2 + (unit.z - node.z) ** 2);
                    if (dist < nearestDist) {
                        nearestNode = node;
                        nearestDist = dist;
                    }
                });

                if (nearestNode) {
                    // Move to node
                    const dist = Math.sqrt((unit.x - nearestNode.x) ** 2 + (unit.z - nearestNode.z) ** 2);
                    if (dist > 1.5) {
                        const dx = nearestNode.x - unit.x;
                        const dz = nearestNode.z - unit.z;
                        const len = Math.sqrt(dx * dx + dz * dz);
                        unit.x += (dx / len) * unit.speed * dt;
                        unit.z += (dz / len) * unit.speed * dt;
                        unit.mesh.position.set(unit.x, 0, unit.z);
                    } else {
                        // Gather
                        unit.gatherTimer = (unit.gatherTimer || 0) + dt;
                        if (unit.gatherTimer > 1) {
                            unit.gatherTimer = 0;
                            const amount = Math.min(5, nearestNode.amount);
                            nearestNode.amount -= amount;
                            if (nearestNode.type === 'wood') {
                                game.resources.wood += amount;
                            } else if (nearestNode.type === 'gold') {
                                game.resources.gold += amount;
                            } else if (nearestNode.type === 'stone') {
                                game.resources.stone += amount;
                            }
                            updateUI();
                            // Visual feedback
                            const particle = new THREE.Mesh(
                                new THREE.SphereGeometry(0.1, 4, 4),
                                new THREE.MeshBasicMaterial({ color: 0xFFFF00, transparent: true, opacity: 0.8 })
                            );
                            particle.position.set(unit.x, 1, unit.z);
                            scene.add(particle);
                            projectileList.push({ mesh: particle, life: 0.5, vx: 0, vy: 2, vz: 0 });
                        }
                    }
                }
            });
        }

        // ==================== DAY/NIGHT CYCLE ====================
        function updateDayNight(dt) {
            game.dayTime += dt / game.dayLength;
            if (game.dayTime >= 1) {
                game.dayTime = 0;
                // New day - spawn wave
                spawnEnemyWave();
            }

            // Update sun position
            const angle = game.dayTime * Math.PI * 2;
            sunLight.position.set(Math.cos(angle) * 30, Math.sin(angle) * 30, 10);
            sunLight.intensity = Math.max(0.3, Math.sin(angle) * 1.2);

            // Update sky color
            const dayFactor = Math.max(0, Math.sin(angle));
            const nightColor = new THREE.Color(0x1a1a3a);
            const dayColor = new THREE.Color(0x87CEEB);
            scene.background.copy(nightColor).lerp(dayColor, dayFactor);
            scene.fog.color.copy(scene.background);

            // Update UI
            const dayNum = Math.floor(game.time / game.dayLength) + 1;
            document.getElementById('time-text').textContent = `Day ${dayNum}`;
            document.getElementById('day-night-icon').textContent = dayFactor > 0.3 ? '☀️' : '🌙';
        }

        // ==================== BUILDING PRODUCTION ====================
        function updateBuildingProduction(dt) {
            buildingList.forEach(building => {
                // Passive resource generation
                if (building.type === 'lumbermill') {
                    game.resources.wood += 0.5 * dt;
                }
                if (building.type === 'goldmine') {
                    game.resources.gold += 0.3 * dt;
                }
                // Building completion
                if (building.buildTime > 0) {
                    building.buildProgress += dt;
                    if (building.buildProgress >= building.buildTime) {
                        building.buildTime = 0;
                    }
                }
            });
            updateUI();
        }

        // ==================== UI ====================
        function updateUI() {
            document.getElementById('gold-text').textContent = Math.floor(game.resources.gold);
            document.getElementById('wood-text').textContent = Math.floor(game.resources.wood);
            document.getElementById('stone-text').textContent = Math.floor(game.resources.stone);
            document.getElementById('pop-text').textContent = `${game.population}/${game.populationCap}`;
        }

        function updateSelectionPanel(selected) {
            const panel = document.getElementById('selection-panel');
            if (!selected) {
                panel.innerHTML = '<h3>No Selection</h3><p>Select a unit or building</p>';
                return;
            }
            if (selected.type && buildingDefinitions[selected.type]) {
                // Building
                panel.innerHTML = `
                    <h3>${buildingDefinitions[selected.type].name}</h3>
                    <p>HP: ${Math.floor(selected.hp)}/${selected.maxHp}</p>
                    <p>Type: Building</p>
                `;
                if (selected.type === 'barracks') {
                    panel.innerHTML += `
                        <p style="margin-top:8px;font-size:12px;">Train units:</p>
                        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">
                            <button class="build-btn" onclick="trainUnit('swordsman')" style="min-width:70px;font-size:10px;">⚔️ Swordsman<br><span class="cost">40g 10w</span></button>
                            <button class="build-btn" onclick="trainUnit('archer')" style="min-width:70px;font-size:10px;">🏹 Archer<br><span class="cost">50g 20w</span></button>
                            <button class="build-btn" onclick="trainUnit('mage')" style="min-width:70px;font-size:10px;">🔮 Mage<br><span class="cost">80g 30w 10s</span></button>
                            <button class="build-btn" onclick="trainUnit('knight')" style="min-width:70px;font-size:10px;">🐴 Knight<br><span class="cost">100g 20w 20s</span></button>
                        </div>
                    `;
                }
            } else if (selected.type && unitDefinitions[selected.type]) {
                // Unit
                panel.innerHTML = `
                    <h3>${unitDefinitions[selected.type].name}</h3>
                    <p>HP: ${Math.floor(selected.hp)}/${selected.maxHp}</p>
                    <p>Damage: ${selected.damage}</p>
                    <p>Range: ${selected.range}</p>
                `;
            }
        }

        function updateBuildMenu() {
            const menu = document.getElementById('build-menu');
            if (game.isPlacing) {
                menu.innerHTML = `
                    <div style="color:#ffd700;font-size:14px;padding:10px;">Placing ${buildingDefinitions[game.placeBuildingType].name}...</div>
                    <button class="build-btn" onclick="cancelPlacement()">Cancel</button>
                `;
                return;
            }
            menu.innerHTML = '';
            Object.entries(buildingDefinitions).forEach(([type, def]) => {
                const btn = document.createElement('button');
                btn.className = 'build-btn';
                btn.innerHTML = `${def.icon} ${def.name}<br><span class="cost">${def.cost.gold}g ${def.cost.wood}w ${def.cost.stone}s</span>`;
                btn.onclick = () => {
                    if (game.resources.gold >= def.cost.gold &&
                        game.resources.wood >= def.cost.wood &&
                        game.resources.stone >= def.cost.stone) {
                        game.isPlacing = true;
                        game.placeBuildingType = type;
                        updateBuildMenu();
                    } else {
                        showInfo('Not enough resources!');
                    }
                };
                menu.appendChild(btn);
            });
        }

        function showInfo(msg) {
            const info = document.getElementById('info-panel');
            info.innerHTML = `<h4>Info</h4><p>${msg}</p>`;
            setTimeout(() => {
                info.innerHTML = '<h4>Eldoria</h4><p>Build your kingdom. Survive the waves.</p><p>Left-click: Select</p><p>Right-click: Move/Attack</p><p>WASD: Pan camera</p>';
            }, 2000);
        }

        function cancelPlacement() {
            game.isPlacing = false;
            game.placeBuildingType = null;
            updateBuildMenu();
        }

        function trainUnit(type) {
            // Find a barracks
            const barracks = buildingList.find(b => b.type === 'barracks' && b.team === 'player');
            if (!barracks) return;
            const unit = spawnUnit(type, barracks.x + 1, barracks.z + 1, 'player');
            if (unit) {
                // Set unit to move to a position near the barracks
                unit.moveTarget = new THREE.Vector3(barracks.x + 2 + Math.random() * 2, 0, barracks.z + 2 + Math.random() * 2);
            }
            updateUI();
        }

        // ==================== GAME LOOP ====================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            game.time += dt;

            if (game.gameOver) {
                renderer.render(scene, camera);
                return;
            }

            // Update camera
            camera.position.x = game.cameraTarget.x + 20;
            camera.position.z = game.cameraTarget.z + 25;
            camera.lookAt(game.cameraTarget.x, 0, game.cameraTarget.z);

            // Update systems
            updateCombat(dt);
            updateResourceGathering(dt);
            updateDayNight(dt);
            updateBuildingProduction(dt);
            updateParticles(dt);

            // Check victory/defeat
            checkGameOver();

            // Render
            renderer.render(scene, camera);
        }

        function checkGameOver() {
            // Defeat: All buildings destroyed and no units
            const playerBuildings = buildingList.filter(b => b.team === 'player');
            const playerUnits = unitList.filter(u => u.team === 'player');
            if (playerBuildings.length === 0 && playerUnits.length === 0) {
                game.gameOver = true;
                document.getElementById('gameover-overlay').style.display = 'flex';
                document.getElementById('gameover-title').textContent = 'Defeat!';
                document.getElementById('gameover-message').textContent = 'Your kingdom has fallen.';
            }

            // Victory: Destroy all enemies
            if (enemyList.length === 0 && game.waveNumber >= 3) {
                game.gameOver = true;
                document.getElementById('gameover-overlay').style.display = 'flex';
                document.getElementById('gameover-title').textContent = 'Victory!';
                document.getElementById('gameover-message').textContent = `You survived ${game.waveNumber} waves!`;
            }
        }

        function restartGame() {
            // Clear all units, buildings, enemies
            unitList.forEach(u => scene.remove(u.mesh));
            buildingList.forEach(b => scene.remove(b.mesh));
            enemyList.forEach(e => scene.remove(e.mesh));
            projectileList.forEach(p => scene.remove(p.mesh));

            unitList.length = 0;
            buildingList.length = 0;
            enemyList.length = 0;
            projectileList.length = 0;

            // Reset game state
            game.resources = { gold: 100, wood: 50, stone: 0 };
            game.population = 0;
            game.populationCap = 10;
            game.selectedUnits = [];
            game.dayTime = 0;
            game.waveNumber = 0;
            game.nextWaveTime = 60;
            game.gameOver = false;
            game.victory = false;
            game.time = 0;
            game.isPlacing = false;
            game.placeBuildingType = null;

            // Rebuild initial base
            const townhall = placeBuilding('townhall', 0, 0);
            if (townhall) {
                townhall.buildTime = 0;
                townhall.buildProgress = 0;
            }

            // Spawn initial workers
            for (let i = 0; i < 3; i++) {
                const worker = spawnUnit('worker', 2 + i * 1.5, 2, 'player');
                if (worker) {
                    worker.moveTarget = new THREE.Vector3(2 + i * 2, 0, 2);
                }
            }

            // Hide game over
            document.getElementById('gameover-overlay').style.display = 'none';

            updateUI();
            updateBuildMenu();
        }

        // ==================== INITIALIZATION ====================
        function init() {
            // Generate terrain
            generateTerrain();

            // Create resource nodes
            createResourceNodes();

            // Place initial buildings
            const townhall = placeBuilding('townhall', 0, 0);
            if (townhall) {
                townhall.buildTime = 0;
                townhall.buildProgress = 0;
            }

            // Spawn initial workers
            for (let i = 0; i < 3; i++) {
                const worker = spawnUnit('worker', 2 + i * 1.5, 2, 'player');
                if (worker) {
                    worker.moveTarget = new THREE.Vector3(2 + i * 2, 0, 2);
                }
            }

            // Update UI
            updateUI();
            updateBuildMenu();

            // Start game loop
            animate();
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        init();
    </script>
</body>
</html>
