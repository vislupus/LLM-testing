<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm of Aethel - Fantasy Survival RTS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: linear-gradient(180deg, #1a0a2e 0%, #0d0515 100%); 
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        canvas { display: block; }
        #hud {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(20,12,30,0.85); border: 1px solid #4a2c6a;
            border-radius: 8px; padding: 12px 20px; color: #ffd7a0;
            z-index: 100; backdrop-filter: blur(8px);
        }
        #hud #resources { font-size: 14px; margin-bottom: 8px; }
        #hud #resources span { display: block; margin: 4px 0; }
        #hud #controls { margin-top: 10px; }
        #hud button {
            background: #5a3a6e; color: #fff; border: none;
            padding: 6px 12px; margin: 2px; border-radius: 4px;
            cursor: pointer; font-size: 12px; transition: background 0.2s;
        }
        #hud button:hover { background: #7a4a8e; }
        #minimap {
            position: fixed; bottom: 10px; left: 10px;
            width: 180px; height: 180px; background: rgba(20,12,30,0.9);
            border: 1px solid #4a2c6a; border-radius: 6px; padding: 8px;
            z-index: 100; backdrop-filter: blur(8px); color: #fff;
            font-size: 11px; line-height: 1.4;
        }
        #minimap .fog { position: absolute; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.8) 0%, rgba(0,0,0,1) 45%);
            pointer-events: none; }
        #minimap .explored { position: absolute; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,215,0,0.3) 0%, transparent 45%);
            pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="resources">Wood: 0 | Gold: 0 | Population: 0/20</div>
        <div id="controls">
            <button onclick="GameUI.build('barracks')">Barracks</button>
            <button onclick="GameUI.build('wall')">Wall</button>
            <button onclick="GameUI.research('armor')">Armor Tech</button>
        </div>
    </div>
    <div id="minimap"><div class="fog"></div><div class="explored"></div></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.js"></script>
    <script>
        //========================================
        // GAME STATE & CONFIG
        //========================================
        const Game = {
            config: {
                terrainSize: 50,
                cellSize: 2,
                resourceRespawnTime: 15000,
                waveInterval: 20000,
                maxWaves: 50,
                popCap: 20,
                unitSpeed: 4,
                viewDistance: 12
            },
            selectedUnit: null,
            selectedBuildings: [],
            exploredRadius: new Set(),
            waveCount: 0,
            minutesSurvived: 0,
            lastWaveTime: 0,
            isNight: false,
            timeScale: 1
        };

        //========================================
        // THREE.js CORE
        //========================================
        let scene, camera, renderer, clock, ambientLight, directionalLight;

        function initThree() {
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0515);
            
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(80, 60, 80);
            camera.lookAt(0, 0, 0);
            
            clock = new THREE.Clock();
            
            // Ambient light for stylized fill
            ambientLight = new THREE.AmbientLight(0x2a1a4a, 0.6);
            scene.add(ambientLight);
            
            // Directional light for toon shading & day/night
            directionalLight = new THREE.DirectionalLight(0xffe0c0, 1.2);
            directionalLight.position.set(100, 100, 100);
            scene.add(directionalLight);
            
            // Shadow map
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.getElementById('gameCanvas').addEventListener('click', onCanvasClick);
            document.getElementById('gameCanvas').addEventListener('mousemove', onCanvasMouseMove);
            
            // Start game loop
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        //========================================
        // TERRAIN & TERRAIN FEATURES
        //========================================
        let terrainMesh, terrainCells = [];

        function createTerrain() {
            const geometry = new THREE.PlaneGeometry(Game.config.terrainSize * Game.config.cellSize, 
                                                  Game.config.terrainSize * Game.config.cellSize, 
                                                  Game.config.terrainSize - 1, Game.config.terrainSize - 1);
            
            const vertices = geometry.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                const y = vertices[i + 1];
                vertices[i + 1] = y + (Math.random() * 4 - 2); // gentle height variation
            }
            
            // Toon shader material
            const terrainMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uGrassColor: { value: new THREE.Color(0x4a6a3a) },
                    uStoneColor: { value: new THREE.Color(0x8b7355) }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vWorldPos;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    varying vec3 vWorldPos;
                    uniform float uTime;
                    uniform vec3 uGrassColor;
                    uniform vec3 uStoneColor;
                    
                    // Toon shading steps
                    const float step1 = 0.3;
                    const float step2 = 0.65;
                    
                    void main() {
                        float lightDot = dot(vNormal, vec3(0.0, 1.0, 0.0));
                        
                        // Simulate directional light from above-left
                        float n = lightDot; // height-based shading
                        
                        // Three tone levels
                        vec3 color;
                        if (n > step2) color = mix(uStoneColor, uGrassColor, 0.3);
                        else if (n > step1) color = mix(uStoneColor, uGrassColor, 0.6);
                        else color = uStoneColor;
                        
                        // Add subtle banding for stylized look
                        float band = step(step1, n) + step(step2, n);
                        color = mix(color, vec3(0.1, 0.05, 0.15), band * 0.1);
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.DoubleSide,
                transparent: false
            });
            
            terrainMesh = new THREE.Mesh(geometry, terrainMaterial);
            terrainMesh.rotation.x = -Math.PI / 2;
            terrainMesh.receiveShadow = true;
            scene.add(terrainMesh);
            
            // Store cell data for pathfinding & building placement
            const cellCount = Game.config.terrainSize;
            for (let z = 0; z < cellCount; z++) {
                terrainCells[z] = [];
                for (let x = 0; x < cellCount; x++) {
                    terrainCells[z][x] = { x, z, height: 0, explored: false, resource: null, building: null };
                }
            }
        }

        //========================================
        // RESOURCE NODES
        //========================================
        let resources = [];

        function createResources() {
            const types = ['wood', 'gold'];
            const count = 30;
            for (let i = 0; i < count; i++) {
                const type = types[i % 2];
                let x, z;
                do {
                    x = Math.floor(Math.random() * Game.config.terrainSize);
                    z = Math.floor(Math.random() * Game.config.terrainSize);
                } while (terrainCells[z][x].building !== null);
                
                terrainCells[z][x].resource = { type, amount: 100, collected: 0 };
                
                const mat = new THREE.MeshStandardMaterial({
                    color: type === 'wood' ? 0x6b8e23 : 0xd4a500,
                    roughness: 0.6, metalness: 0.0
                });
                
                const size = type === 'wood' ? 1.2 : 1.0;
                const geom = new THREE.CylinderGeometry(size, size, 0.4, 12);
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(
                    (x - Game.config.terrainSize / 2 + 0.5) * Game.config.cellSize,
                    mesh.position.y,
                    (z - Game.config.terrainSize / 2 + 0.5) * Game.config.cellSize
                );
                mesh.receiveShadow = true;
                scene.add(mesh);
                
                // Add glowing top
                const geo = new THREE.SphereGeometry(size, 12, 12);
                const glow = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: type === 'wood' ? 0x8fa040 : 0xf0c040, transparent: true, opacity: 0.5 }));
                glow.position.y = 0.3;
                mesh.add(glow);
                
                resources.push({ mesh, data: terrainCells[z][x], type, max: 100 });
            }
        }

        //========================================
        // BUILDINGS
        //========================================
        let buildings = [];

        function createBuildings() {
            // Town Hall - starting structure
            const townHall = createBuilding('townHall', 0, 0);
            buildings.push(townHall);
            
            // Resource depots
            for (let i = 0; i < 2; i++) {
                const rx = (Math.random() - 0.5) * 20;
                const rz = (Math.random() - 0.5) * 20;
                const dep = createBuilding('resourceDepot', rx, rz);
                buildings.push(dep);
            }
        }

        function createBuilding(type, x, z) {
            const size = type === 'townHall' ? 4 : 2;
            const posX = (x + Game.config.terrainSize / 2 - 1) * Game.config.cellSize;
            const posZ = (z + Game.config.terrainSize / 2 - 1) * Game.config.cellSize;
            
            let geometry, material, color;
            
            if (type === 'townHall') {
                geometry = new THREE.CylinderGeometry(size, size * 1.3, size * 2, 12);
                material = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.4 });
                color = 0xdaa520;
            } else if (type === 'barracks') {
                geometry = new THREE.BoxGeometry(size * 2, size * 2, size * 3);
                material = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.5 });
                color = 0x8b5a2b;
            } else if (type === 'wall') {
                geometry = new THREE.BoxGeometry(size * 2, size * 1.5, size);
                material = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.7 });
                color = 0x34495e;
            } else { // resourceDepot
                geometry = new THREE.CylinderGeometry(size * 1.2, size * 1.2, size * 1.5, 12);
                material = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.5 });
                color = 0x7a6a5a;
            }
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(posX, mesh.position.y / 2, posZ); // adjust for base height
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // Add name/label top
            const labelGeo = new THREE.PlaneGeometry(size * 1.8, size * 0.4);
            const labelMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
            const label = new THREE.Mesh(labelGeo, labelMat);
            label.position.y = (type === 'townHall' ? size * 2 : size * 1.2) + 0.1;
            mesh.add(label);
            
            // Store footprint for placement validation
            mesh.type = type;
            mesh.buildFootprint = { x1: x, x2: x + (type === 'townHall' ? 4 : 1), z1: z, z2: z + (type === 'townHall' ? 4 : 1) };
            mesh.level = 1;
            mesh.maxLevel = type === 'townHall' ? 3 : type === 'barracks' ? 3 : type === 'wall' ? 5 : 2;
            
            // Building-specific data
            if (type === 'townHall') {
                mesh.populationCapacity = 20;
                mesh.populationUsed = 0;
                mesh.productionRate = 0.5; // workers per second
                mesh.upgradeCost = { wood: 200, gold: 150 };
            } else if (type === 'barracks') {
                mesh.unitTrainingTime = 3; // seconds per unit
                mesh.trainedUnits = 0;
                mesh.upgradeCost = { wood: 150, gold: 100 };
            } else if (type === 'wall') {
                mesh.health = 50 + mesh.level * 20;
                mesh.maxHealth = mesh.health;
                mesh.damageRadius = 1;
            } else if (type === 'resourceDepot') {
                mesh.capacity = 500;
                mesh.stored = 0;
            }
            
            scene.add(mesh);
            return mesh;
        }

        //========================================
        // UNITS
        //========================================
        let units = [];
        let nextUnitId = 1;

        function createUnit(type, x, z, isPlayer = true) {
            const size = 0.8;
            const color = isPlayer ? 0xffd700 : 0xc0392b;
            
            let geometry, material;
            
            if (type === 'worker') {
                geometry = new THREE.SphereGeometry(size, 12, 12);
                material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.1 });
                mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { type, speed: Game.config.unitSpeed, carry: 0, capacity: 15, workTarget: null };
                mesh.type = 'unit';
                mesh.id = nextUnitId++;
            } else if (type === 'soldier') {
                geometry = new THREE.OctahedronGeometry(size, 0);
                material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
                mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { type, speed: Game.config.unitSpeed * 0.9, attack: 8, health: 30, maxHealth: 30 };
                mesh.type = 'unit';
                mesh.id = nextUnitId++;
                mesh.castShadow = true;
            } else if (type === 'ranger') {
                geometry = new THREE.SphereGeometry(size, 12, 12);
                material = new THREE.MeshStandardMaterial({ color: new THREE.Color(0xda70d6), roughness: 0.35 });
                mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { type, speed: Game.config.unitSpeed * 0.95, range: 6, attack: 5, health: 20, maxHealth: 20 };
                mesh.type = 'unit';
                mesh.id = nextUnitId++;
                mesh.castShadow = true;
            } else if (type === 'hero') {
                geometry = new THREE.DodecahedronGeometry(size * 1.2, 0);
                material = new THREE.MeshStandardMaterial({ color: new THREE.Color(0xff69b4), emissive: new THREE.Color(0xff1493), emissiveIntensity: 0.4 });
                mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { type, speed: Game.config.unitSpeed, auraRange: 6, attack: 15, health: 80, maxHealth: 80, abilityCooldown: 0 };
                mesh.type = 'unit';
                mesh.id = nextUnitId++;
                mesh.castShadow = true;
                // Addalo halo
                const haloGeo = new THREE.SphereGeometry(size * 1.5, 12, 12);
                const haloMat = new THREE.MeshBasicMaterial({ color: 0xff69b4, transparent: true, opacity: 0.3 });
                const halo = new THREE.Mesh(haloGeo, haloMat);
                halo.position.y = 0.3;
                mesh.add(halo);
            } else if (type === 'siege') {
                geometry = new THREE.BoxGeometry(size * 1.5, size * 1.5, size * 3);
                material = new THREE.MeshStandardMaterial({ color: new THREE.Color(0xb8860b), roughness: 0.5 });
                mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { type, speed: Game.config.unitSpeed * 0.7, damage: 20, health: 50, maxHealth: 50 };
                mesh.type = 'unit';
                mesh.id = nextUnitId++;
                mesh.castShadow = true;
            }
            
            mesh.position.set(
                (x + 0.5) * Game.config.cellSize,
                mesh.position.y,
                (z + 0.5) * Game.config.cellSize
            );
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);
            
            // Add above-ground indicator for selection
            const selGeo = new THREE.PlaneGeometry(size * 1.4, size * 1.4);
            const selMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
            const selMesh = new THREE.Mesh(selGeo, selMat);
            selMesh.position.y = mesh.position.y - 0.1;
            mesh.selMesh = selMesh;
            mesh.add(selMesh);
            
            units.push(mesh);
            return mesh;
        }

        //========================================
        // WORKER AI & ECONOMY
        //========================================
        function updateWorkers() {
            units.filter(u => u.userData.type === 'worker').forEach(worker => {
                const data = worker.userData.data;
                
                // If carrying resources, return to town hall
                if (worker.userData.carry > 0) {
                    const th = buildings.find(b => b.type === 'townHall');
                    if (th) {
                        const dist = worker.position.distanceTo(th.position);
                        if (dist < 3) {
                            th.userData.stored = Math.min(th.userData.capacity, th.userData.stored + worker.userData.carry);
                            worker.userData.carry = 0;
                            worker.userData.data = null; // dropped off
                        } else {
                            // Simple path toward town hall
                            const dir = new THREE.Vector3().subVectors(th.position, worker.position).normalize();
                            worker.position.addScaledVector(dir, worker.userData.speed * 0.016);
                        }
                    }
                    worker.userData.selMesh.position.copy(worker.position).add(new THREE.Vector3(0, -0.1, 0));
                    return;
                }
                
                // Find nearest resource node
                if (!worker.userData.workTarget) {
                    let bestNode = null;
                    let bestDist = Infinity;
                    
                    resources.forEach(node => {
                        if (node.data.amount - node.data.collected > 0) {
                            const dist = worker.position.distanceTo(node.mesh.position);
                            if (dist < bestDist) {
                                bestDist = dist;
                                bestNode = node;
                            }
                        }
                    });
                    
                    if (bestNode) {
                        worker.userData.workTarget = bestNode;
                        worker.userData.data = bestNode.data;
                    }
                }
                
                if (worker.userData.workTarget && worker.userData.data) {
                    const target = worker.userData.workTarget;
                    const dist = worker.position.distanceTo(target.mesh.position);
                    
                    if (dist > 0.5) {
                        const dir = new THREE.Vector3().subVectors(target.mesh.position, worker.position).normalize();
                        worker.position.addScaledVector(dir, worker.userData.speed * 0.016);
                    } else {
                        // Gather
                        if (target.data.amount > target.data.collected) {
                            target.data.collected += 0.3 * Game.timeScale;
                            worker.userData.carry += 0.3 * Game.timeScale;
                            target.data.amount = Math.max(0, target.data.amount - 0.3 * Game.timeScale);
                            
                            // Visual depletion
                            const scale = target.data.collected / target.data.max;
                            target.mesh.scale.set(scale, scale, scale);
                        } else {
                            worker.userData.workTarget = null;
                            worker.userData.data = null;
                        }
                    }
                    worker.userData.selMesh.position.copy(worker.position).add(new THREE.Vector3(0, -0.1, 0));
                }
            });
        }

        //========================================
        // ENEMY AI & WAVES
        //========================================
        let enemyUnits = [];
        let enemyWaypoints = [];

        function initEnemyBase() {
            // Enemy town hall at opposite corner
            const ex = Game.config.terrainSize - 1;
            const ez = Game.config.terrainSize - 1;
            createBuilding('townHall', ex, ez); // will be stored but we'll track it separately
            Game.enemyTownHall = scene.children.find(c => c.type === 'townHall' && c.userData && c.userData.type === 'townHall' && c.position.z > 0);
            
            // Define wave path (simple straight line toward player base)
            const playerBaseCenter = new THREE.Vector3(0, 0, 0);
            const enemyBasePos = new THREE.Vector3(
                (ex + 0.5) * Game.config.cellSize,
                0,
                (ez + 0.5) * Game.config.cellSize
            );
            
            // Path: start from enemy base, go toward player
            const pathLength = 30;
            enemyWaypoints = [];
            for (let i = 0; i <= pathLength; i++) {
                const t = i / pathLength;
                const x = enemyBasePos.x + (playerBaseCenter.x - enemyBasePos.x) * t / 80;
                const z = enemyBasePos.z + (playerBaseCenter.z - enemyBasePos.z) * t / 80;
                enemyWaypoints.push(new THREE.Vector3(x, 0, z));
            }
        }

        function spawnEnemyWave() {
            if (Game.waveCount >= Game.config.maxWaves) return;
            
            Game.waveCount++;
            Game.lastWaveTime = Date.now();
            
            // Scale wave size with difficulty
            const baseCount = 5 + Math.floor(Game.minutesSurvived / 2);
            const count = Math.min(baseCount + Game.waveCount, 30);
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const wpIndex = Math.floor(Math.random() * (enemyWaypoints.length - 1));
                    const type = i % 3 === 0 ? 'soldier' : (i % 3 === 1 ? 'ranger' : 'worker'); // mix
                    const unit = createUnit(type, enemyWaypoints[wpIndex].x / Game.config.cellSize - 0.5, 
                                            enemyWaypoints[wpIndex].z / Game.config.cellSize - 0.5, false);
                    unit.userData.isEnemy = true;
                    unit.userData.targetBase = true;
                    unit.userDataWaypoints = [...enemyWaypoints];
                    unit.userDataWaypointIndex = wpIndex;
                    enemyUnits.push(unit);
                }, i * 200); // stagger spawn
            }
            
            // Schedule next wave
            setTimeout(() => spawnEnemyWave(), Game.config.waveInterval - Game.waveCount * 200);
        }

        function updateEnemyAI() {
            enemyUnits.forEach((unit, ui) => {
                if (!unit.parent) return; // removed
                
                const waypoints = unit.userDataWaypoints;
                const wpIdx = unit.userDataWaypointIndex;
                
                // If at last waypoint, attack town hall or move randomly
                if (wpIdx >= waypoints.length - 1) {
                    // Try to find and attack player town hall
                    const th = buildings.find(b => b.type === 'townHall');
                    if (th) {
                        const dist = unit.position.distanceTo(th.position);
                        if (dist < 8) {
                            // Attack
                            unit.userData.health -= 0.1 * Game.timeScale;
                            th.userData.health -= unit.userData.attack * 0.01 * Game.timeScale;
                            if (unit.userData.health <= 0) {
                                scene.remove(unit);
                                enemyUnits.splice(ui, 1);
                            }
                            return;
                        }
                    }
                }
                
                // Move toward next waypoint
                const target = waypoints[wpIdx];
                const dist = unit.position.distanceTo(target);
                
                if (dist > 1) {
                    const dir = new THREE.Vector3().subVectors(target, unit.position).normalize();
                    unit.position.addScaledVector(dir, unit.userData.speed * 0.016);
                    unit.userDataWaypointIndex = wpIdx + (dist < 0.5 ? 1 : 0);
                } else if (wpIdx < waypoints.length - 1) {
                    unit.userDataWaypointIndex = wpIdx + 1;
                }
                
                // Update selection mesh
                if (unit.selMesh) unit.selMesh.position.copy(unit.position).add(new THREE.Vector3(0, -0.1, 0));
                
                // Health visual
                if (unit.userData.healthBar) {
                    unit.userData.healthBar.scale.x = unit.userData.health / unit.userData.maxHealth;
                }
            });
        }

        //========================================
        // DAY/NIGHT CYCLE
        //========================================
        function updateDayNight() {
            Game.isNight = Game.minutesSurvived % 2 > 1; // simple alternating
            
            const progress = Game.minutesSurvived * 0.1;
            const x = Math.cos(progress) * 50;
            const z = Math.sin(progress) * 50;
            directionalLight.position.set(x, 30 + (Game.isNight ? 10 : 60), z);
            
            const nightColor = new THREE.Color(0x050515);
            const dayColor = new THREE.Color(0x1a1a3a);
            scene.background.lerpDays = true;
            scene.background = Game.isNight ? nightColor : dayColor;
            
            ambientLight.intensity = Game.isNight ? 0.4 : 0.6;
            ambientLight.color.set(Game.isNight ? 0x150a25 : 0x2a1a4a);
            
            // Affect unit visibility/performance slightly
            units.forEach(u => {
                if (u.selMesh) u.selMesh.visible = !Game.isNight || Math.random() > 0.1;
            });
        }

        //========================================
        // VICTORY/DEFEAT
        //========================================
        function checkGameEnd() {
            // Check player town hall
            const playerTh = buildings.find(b => b.type === 'townHall');
            if (playerTh && playerTh.userData.health <= 0) {
                endGame('defeat');
                return;
            }
            
            // Check enemy town hall
            const enemyTh = buildings.find(b => b.type === 'townHall' && b !== playerTh);
            if (enemyTh && enemyTh.userData.health <= 0) {
                endGame('victory');
            }
        }

        function endGame(result) {
            alert(`Game Over: ${result.toUpperCase()}\nSurvived ${Game.minutesSurvived.toFixed(1)} minutes\nWaves: ${Game.waveCount}`);
            // Reset or reload
            location.reload();
        }

        //========================================
        // INPUT HANDLING
        //========================================
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let selectionBox = new THREE.Object3D();
        scene.add(selectionBox);

        function onCanvasClick(event) {
            const rect = event.target.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects([terrainMesh, ...buildings, ...units, ...resources.map(r => r.mesh)]);
            
            if (intersects.length > 0) {
                const intersected = intersects[0].object;
                
                // If clicked a unit
                if (intersected.userData && intersected.userData.type && 
                    (intersected.userData.type === 'worker' || intersected.userData.type === 'soldier' || 
                     intersected.userData.type === 'ranger' || intersected.userData.type === 'hero' || 
                     intersected.userData.type === 'siege')) {
                    
                    // Toggle selection
                    if (Game.selectedUnit === intersected) {
                        Game.selectedUnit = null;
                        intersected.selMesh.visible = false;
                    } else {
                        // Deselect previously
                        if (Game.selectedUnit) Game.selectedUnit.selMesh.visible = false;
                        Game.selectedUnit = intersected;
                        intersected.selMesh.visible = true;
                    }
                    return;
                }
                
                // If clicked ground/terrain - move selected unit(s)
                if (Game.selectedUnit) {
                    moveUnitTo(Game.selectedUnit, intersected.position);
                } else if (Game.selectedBuildings.length > 0) {
                    // Could place building preview or issue move command from selected building
                }
            }
        }

        function onCanvasMouseMove(event) {
            const rect = event.target.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObject(terrainMesh);
            if (intersects.length > 0) {
                // Could show preview, but keeping it simple
            }
        }

        function moveUnitTo(unit, targetPos) {
            // Simple pathfinding - move toward target, avoid terrain
            const dir = new THREE.Vector3().subVectors(targetPos, unit.position).normalize();
            unit.position.addScaledVector(dir, unit.userData.speed * 0.1);
            unit.userData.selMesh.position.copy(unit.position).add(new THREE.Vector3(0, -0.1, 0));
            
            // Check if reached
            if (unit.position.distanceTo(targetPos) < 1) {
                // If target is a resource, start gathering if worker
                if (unit.userData.type === 'worker') {
                    const nearestRes = resources.find(r => r.data && r.data.amount > 0);
                    if (nearestRes && nearestRes.data) {
                        unit.userData.workTarget = { mesh: nearestRes.mesh, data: nearestRes.data };
                        unit.userData.data = nearestRes.data;
                    }
                }
            }
        }

        //========================================
        // BUILDING UI & PLACEMENT
        //========================================
        GameUI = {
            build: function(type) {
                // Show placement preview - simplified: just try to place at valid spot
                const validCells = [];
                
                // Find valid cells based on building footprint
                // For demo, place near town hall if possible
                const th = buildings.find(b => b.type === 'townHall');
                if (th) {
                    const startX = Math.max(0, th.position.x / Game.config.cellSize - 2);
                    const startZ = Math.max(0, th.position.z / Game.config.cellSize - 2);
                    const endX = Math.min(Game.config.terrainSize - 1, startX + 4);
                    const endZ = Math.min(Game.config.terrainSize - 1, startZ + 4);
                    
                    for (let z = startZ; z <= endZ; z++) {
                        for (let x = startX; x <= endX; x++) {
                            if (!terrainCells[z][x].building) {
                                validCells.push({ x, z });
                            }
                        }
                    }
                }
                
                if (validCells.length > 0) {
                    const cell = validCells[0];
                    const b = createBuilding(type, cell.x, cell.z);
                    buildings.push(b);
                    terrainCells[cell.z][cell.x].building = b;
                    
        // Apply costs & population
                    if (type === 'barracks') {
                        if (playerTh.userData.wood >= 150 && playerTh.userData.gold >= 100) {
                            playerTh.userData.wood -= 150;
                            playerTh.userData.gold -= 100;
                            updateHUD();
                        } else {
                            alert('Not enough resources!');
                            scene.remove(b);
                            buildings.pop();
                        }
                    }
                    updateHUD();
                }
            },
            research: function(type) {
                // Simple research - just grant ability or buff
                if (type === 'armor') {
                    // Increase unit health regen or reduce damage taken
                    alert('Armor researched! Units take 20% less damage.');
                    // In full game: modify unit materials, add shield meshes, etc.
                }
            }
        };

        //========================================
        // HUD UPDATE
        //========================================
        function updateHUD() {
            const th = buildings.find(b => b.type === 'townHall');
            if (th) {
                document.getElementById('resources').innerHTML = 
                    `Wood: ${Math.floor(th.userData.wood)} | Gold: ${Math.floor(th.userData.gold)} | Population: ${Math.floor(th.userData.populationUsed)}/${th.userData.populationCapacity}`;
            }
        }

        //========================================
        // ANIMATION LOOP
        //========================================
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            Game.timeScale = delta;
            
            // Update time
            Game.minutesSurvived += delta / 60;
            
            // Update day/night
            updateDayNight();
            
            // Update workers
            updateWorkers();
            
            // Update enemy AI
            updateEnemyAI();
            
            // Resource depletion check
            resources.forEach(r => {
                if (r.data.amount <= 0) {
                    // Remove visual, mark as empty
                    r.mesh.visible = false;
                }
            });
            
            // Update building health visuals
            buildings.forEach(b => {
                if (b.userData && b.userData.health !== undefined) {
                    if (b.userData.healthBar) {
                        b.userData.healthBar.scale.x = b.userData.health / b.userData.maxHealth;
                        b.userData.healthBar.position.x = -b.geometry.parameters.width / 2 + 0.1;
                    }
                }
            });
            
            // Check win/lose
            checkGameEnd();
            
            // Rotate toon shader uniform
            if (terrainMesh && terrainMesh.material.uniforms.uTime) {
                terrainMesh.material.uniforms.uTime.value = time;
            }
            
            // Render
            renderer.render(scene, camera);
        }

        //========================================
        // INITIALIZATION
        //========================================
        function initGame() {
            initThree();
            createTerrain();
            createResources();
            createBuildings();
            initEnemyBase();
            
            // Create player units - select few workers start
            for (let i = 0; i < 5; i++) {
                const wx = Math.floor(Math.random() * 10) + 5;
                const wz = Math.floor(Math.random() * 10) + 5;
                const worker = createUnit('worker', wx, wz, true);
                worker.position.y = 0.5;
                // Assign initial resource node
                const nearbyRes = resources.find(r => r.data && !r.data.assignedWorker);
                if (nearbyRes) {
                    nearbyRes.data.assignedWorker = worker;
                    worker.userData.workTarget = { mesh: nearbyRes.mesh, data: nearbyRes.data };
                    worker.userData.data = nearbyRes.data;
                }
            }
            
            // Spawn first enemy wave after delay
            setTimeout(spawnEnemyWave, 3000);
            
            // Initial HUD
            updateHUD();
        }

        window.addEventListener('load', initGame);

        // Helper: assign worker data structure properly
        resources.forEach(r => {
            r.data = { type: r.type, amount: r.data.max, collected: 0, assignedWorker: null };
        });
    </script>
</body>
