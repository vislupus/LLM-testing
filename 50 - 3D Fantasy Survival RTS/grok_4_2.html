<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELYSARA • RIFTWATCH</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        :root {
            --font-pixel: 'Press Start 2P', system-ui;
        }
        
        body {
            font-family: var(--font-pixel);
        }
        
        canvas {
            display: block;
        }
        
        .game-container {
            position: relative;
            overflow: hidden;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .ui-overlay > * {
            pointer-events: auto;
        }
        
        .terrain {
            filter: contrast(1.1) saturate(1.3);
        }
        
        .health-bar {
            height: 4px;
            background: linear-gradient(90deg, #22c55e, #86efac);
            transition: width 0.2s linear;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-hidden">
    <div class="flex h-screen game-container">
        <!-- 3D Canvas -->
        <canvas id="canvas" class="flex-1"></canvas>
        
        <!-- UI Overlay -->

                        <div onclick="toggleResourceDetail()" class="flex items-center gap-x-2 bg-zinc-900 px-4 py-2 rounded-2xl border border-blue-300/30 hover:border-blue-300 cursor-pointer">
                            <div class="w-3 h-3 bg-blue-400 rounded-full"></div>
                            <span id="stone-count" class="tabular-nums font-bold text-blue-200">180</span>
                            <span class="text-blue-400/70 text-[10px]">STONE</span>
                        </div>
                        <div onclick="toggleResourceDetail()" class="flex items-center gap-x-2 bg-zinc-900 px-4 py-2 rounded-2xl border border-purple-300/30 hover:border-purple-300 cursor-pointer">
                            <div class="w-3 h-3 bg-purple-400 rounded-full animate-pulse"></div>
                            <span id="mana-count" class="tabular-nums font-bold text-purple-200">65</span>
                            <span class="text-purple-400/70 text-[10px]">MANA</span>
                        </div>
                    </div>
                    
                    <!-- Day / Wave -->
                    <div class="bg-zinc-900 px-5 py-1.5 rounded-3xl border border-white/10 flex items-center gap-x-3 text-sm">
                        <div class="flex items-center gap-x-1.5">
                            <div id="day-indicator" 
                                 class="px-3 py-0.5 bg-emerald-400 text-emerald-950 text-[10px] font-bold rounded-2xl flex items-center justify-center w-5 h-5">1</div>
                            <div>
                                <div class="text-emerald-400 text-xs leading-none">DAY</div>
                                <div id="wave-status" class="text-[17px] leading-none font-bold text-white tracking-tighter">1 / 12</div>
                            </div>
                        </div>
                        <div class="h-8 w-px bg-white/10"></div>
                        <div id="time-of-day" 
                             class="flex items-center gap-x-2 text-amber-300 text-xs font-medium">

                            <span>DAWN</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-2">
                    <div onclick="togglePause()" 
                         class="w-8 h-8 flex items-center justify-center bg-white/10 hover:bg-white/20 rounded-2xl text-lg cursor-pointer transition-colors">⏸</div>
                    <div class="text-right">
                        <div class="text-[10px] text-white/40 tracking-[1px]">ELYSARA</div>
                        <div class="text-lg font-bold text-white tracking-tighter leading-none">RIFTWATCH</div>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-4">
                    <!-- Population -->
                    <div class="bg-zinc-900 rounded-3xl px-5 py-2 text-xs flex items-center gap-x-2 border border-rose-400/20">
                        <div class="text-rose-400">👤</div>
                        <div>
                            <span id="pop-current" class="font-bold text-rose-100">12</span>
                            <span class="text-rose-400/40"> / </span>
                            <span id="pop-max" class="font-bold text-rose-100/70">35</span>
                        </div>
                    </div>
                    
                    <!-- Hero -->

                        <div class="font-medium">SER ALARIC</div>
                    </div>
                </div>
            </div>
            
            <!-- Left Sidebar - Build Menu -->
            <div id="build-panel" 
                 class="absolute left-6 top-24 w-56 bg-zinc-900/95 border border-amber-400/30 rounded-3xl p-4 shadow-2xl">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div class="uppercase text-xs tracking-widest text-amber-300">Construct</div>
                    <div onclick="toggleBuildPanel()" class="text-3xl leading-none text-white/30 cursor-pointer">×</div>

                    <!-- populated by JS -->

            </div>
            
            <!-- Right Sidebar - Selected Info -->

                 class="absolute right-6 top-24 w-72 bg-zinc-900/95 border border-white/10 rounded-3xl overflow-hidden shadow-2xl hidden">
                <div class="p-4 border-b border-white/10 flex items-center justify-between bg-black/40">
                    <div id="selected-name" class="font-bold text-lg">Lumber Camp</div>
                    <div onclick="deselectAll()" class="text-white/30 hover:text-white cursor-pointer">✕</div>
                </div>
                
                <div class="p-5 space-y-6">

            <!-- Bottom Bar -->

                <div onclick="selectUnitType(2)" id="unit-btn-2"

                <div onclick="selectUnitType(3)" id="unit-btn-3"
                     class="w-11 h-11 flex items-center justify-center bg-white/5 hover:bg-white/10 rounded-2xl text-3xl transition-all cursor-pointer border border-transparent hover:border-amber-400">🔮</div>

                </div>
            </div>
            
            <!-- Minimap -->
            <div onclick="clickMinimap(event)" 
                 class="absolute bottom-6 right-6 w-36 h-36 bg-emerald-950 border-2 border-emerald-400/60 rounded-3xl overflow-hidden shadow-inner cursor-crosshair">
                <canvas id="minimap" width="144" height="144" class="w-full h-full"></canvas>
                <div id="minimap-viewport" 
                     class="absolute border border-white/60 w-10 h-10 rounded-xl pointer-events-none"
                     style="left: 40%; top: 40%; transform: translate(-50%, -50%)"></div>
            </div>
            
            <!-- Command bar -->
            <div class="absolute bottom-28 left-1/2 -translate-x-1/2 flex items-center gap-x-2 text-xs bg-black/60 px-4 py-2 rounded-3xl">
                <div onclick="setFormation(0)" class="px-5 py-2 hover:bg-white/10 rounded-3xl cursor-pointer">LINE</div>
                <div onclick="setFormation(1)" class="px-5 py-2 hover:bg-white/10 rounded-3xl cursor-pointer">WEDGE</div>
                <div onclick="setFormation(2)" class="px-5 py-2 hover:bg-white/10 rounded-3xl cursor-pointer bg-white/10">CIRCLE</div>

                <div onclick="holdPosition()" class="px-4 py-1 text-amber-300 flex items-center gap-x-2 hover:bg-white/10 rounded-3xl cursor-pointer">
                    <span class="text-lg">🛡️</span>

                </div>
            </div>
            
            <!-- Center notification area -->
            <div id="notification" 
                 class="absolute top-1/3 left-1/2 -translate-x-1/2 bg-black/80 text-amber-300 text-sm px-8 py-4 rounded-3xl hidden flex items-center gap-x-3 shadow-2xl">
                <span id="notif-text"></span>
            </div>
            
            <!-- Game over / victory -->
            <div id="end-screen" class="absolute inset-0 bg-black/90 hidden flex items-center justify-center">

                    <div id="end-title" class="text-7xl font-bold mb-3 text-transparent bg-clip-text bg-gradient-to-b from-amber-200 to-yellow-400">VICTORY</div>
                    <div id="end-subtitle" class="text-xl text-white/60 mb-12">The rift is sealed</div>
                    
                    <div class="flex justify-center gap-x-6">
                        <button onclick="restartGame()" 
                                class="px-10 py-6 bg-white text-black rounded-3xl font-bold text-sm tracking-widest">PLAY AGAIN</button>
                        <button onclick="location.reload()" 
                                class="px-10 py-6 border border-white/30 hover:border-white/60 rounded-3xl font-bold text-sm tracking-widest">MENU</button>
                    </div>
                </div>

            <!-- Tooltip -->

                 class="absolute hidden bg-zinc-900 border border-white/20 text-xs px-4 py-3 rounded-2xl pointer-events-none shadow-xl max-w-[180px]">
            </div>
        </div>
        
        <!-- Help hint -->

             class="absolute bottom-40 left-8 text-[10px] bg-black/60 px-5 py-3 rounded-3xl flex items-center gap-x-3 text-white/70">
            <div class="w-2 h-2 bg-sky-400 animate-ping rounded-full"></div>
            <span id="hint-text">WASD / DRAG to pan • RIGHT CLICK to command</span>
        </div>
    </div>
    
    <script>
        // Tailwind script run
        function initializeTailwind() {
            // Already initialized via CDN
        }
        
        // THREE.JS GAME CODE STARTS HERE
        let scene, camera, renderer
        let terrainMesh, sunLight
        let entities = []
        let selectedEntities = []
        let mouse = { x: 0, y: 0 }
        let isDragging = false
        let dragStart = { x: 0, y: 0 }
        let raycaster = new THREE.Raycaster()
        let gameTime = 0
        let day = 1
        let wave = 1
        let isNight = false
        let paused = false
        let gameOver = false
        let victory = false
        
        // Resources
        let resources = {
            wood: 320,
            stone: 210,
            mana: 95
        }
        
        let population = {
            current: 8,
            max: 32
        }
        
        // Game objects definitions
        const BUILDING_TYPES = [
            {
                id: 'keep',
                name: 'LUNAR KEEP',
                icon: '🏰',
                cost: { wood: 0, stone: 0, mana: 0 },
                size: 6,
                color: 0x334155,
                health: 800,
                isMain: true
            },
            {
                id: 'lumber',
                name: 'LUMBER GROVE',
                icon: '🌲',
                cost: { wood: 60, stone: 20, mana: 0 },
                size: 3,
                color: 0x166534,
                health: 220
            },
            {
                id: 'quarry',
                name: 'CRYSTAL QUARRY',
                icon: '⛰️',
                cost: { wood: 30, stone: 80, mana: 10 },
                size: 3,
                color: 0x475569,
                health: 260
            },
            {
                id: 'barracks',
                name: 'IRON BARRACKS',
                icon: '🛡️',
                cost: { wood: 120, stone: 80, mana: 0 },
                size: 4,
                color: 0x7f1d1d,
                health: 340
            },
            {
                id: 'tower',
                name: 'STARLIGHT TOWER',
                icon: '🏹',
                cost: { wood: 80, stone: 140, mana: 30 },
                size: 2.5,
                color: 0x4338ca,
                health: 180,
                isDefense: true
            }
        ]
        
        let buildings = []
        let units = []
        let enemies = []
        let particles = []
        
        // Unit classes
        const UNIT_CLASSES = [
            { id: 0, name: 'Forager', icon: '🪓', color: 0x4ade80, cost: {wood: 25, stone: 0, mana: 0}, speed: 0.035, damage: 4, range: 1.8, health: 55, type: 'worker' },
            { id: 1, name: 'Swordsman', icon: '⚔️', color: 0xf43f5e, cost: {wood: 45, stone: 30, mana: 0}, speed: 0.042, damage: 18, range: 3.5, health: 110, type: 'melee' },
            { id: 2, name: 'Ranger', icon: '🏹', color: 0x22d3ee, cost: {wood: 35, stone: 10, mana: 15}, speed: 0.038, damage: 13, range: 14, health: 65, type: 'ranged' },
            { id: 3, name: 'Astral Mage', icon: '🔮', color: 0xa78bfa, cost: {wood: 30, stone: 30, mana: 45}, speed: 0.03, damage: 26, range: 11, health: 50, type: 'mage' }
        ]
        
        let selectedRecruitType = 1
        
        // Camera controls
        let cameraAngle = 0.8
        let cameraDistance = 65
        let cameraTarget = new THREE.Vector3(0, 0, 0)
        
        // Input
        let keys = {}
        let lastMouseX = 0
        let lastMouseY = 0
        let isPanning = false
        
        // Minimap
        let minimapCtx
        
        function initThree() {
            const canvas = document.getElementById("canvas")
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                antialias: true,
                alpha: false
            })
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
            renderer.setSize(window.innerWidth, window.innerHeight)
            renderer.shadowMap.enabled = true
            renderer.shadowMap.type = THREE.PCFSoftShadowMap
            
            scene = new THREE.Scene()
            scene.fog = new THREE.Fog(0x0a0a0a, 55, 135)
            
            camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 1, 200)
            updateCameraPosition()
            
            // LIGHTING
            const ambient = new THREE.AmbientLight(0x99bbdd, 0.6)
            scene.add(ambient)
            
            sunLight = new THREE.DirectionalLight(0xffeecc, 1.4)
            sunLight.position.set(35, 65, 25)
            sunLight.castShadow = true
            sunLight.shadow.mapSize.width = 2048
            sunLight.shadow.mapSize.height = 2048
            sunLight.shadow.camera.near = 1
            sunLight.shadow.camera.far = 180
            sunLight.shadow.camera.left = -45
            sunLight.shadow.camera.right = 45
            sunLight.shadow.camera.top = 45
            sunLight.shadow.camera.bottom = -45
            scene.add(sunLight)
            
            const hemi = new THREE.HemisphereLight(0xaaccff, 0x112233, 0.5)
            scene.add(hemi)
            
            // TERRAIN
            createTerrain()
            
            // Some trees and rocks
            createEnvironment()
            
            // Starting keep
            createStartingKeep()
            
            // Initial units
            for (let i = 0; i < 4; i++) {
                createUnit(0, -12 + Math.random() * 8, 12 + Math.random() * 6)
            }
            createUnit(1, -18, 4)
            createUnit(2, -15, 18)
            
            // Add some enemies far away
            for (let i = 0; i < 6; i++) {
                createEnemy(38 + Math.random() * 12, -18 + Math.random() * 30)
            }
            
            // Some resource nodes
            createResourceNodes()
            
            // Event listeners
            window.addEventListener('resize', onResize)
            canvas.addEventListener('mousedown', onMouseDown)
            canvas.addEventListener('mousemove', onMouseMove)
            canvas.addEventListener('mouseup', onMouseUp)
            canvas.addEventListener('contextmenu', onRightClick)
            window.addEventListener('keydown', onKeyDown)
            window.addEventListener('keyup', onKeyUp)
            
            // Touch support minimal
            canvas.addEventListener('touchstart', (e) => e.preventDefault())
            
            // Populate build grid
            populateBuildMenu()
            
            // Start game loop
            animate()
            
            // Game tick every 220ms
            setInterval(gameTick, 220)
            
            // Wave spawner
            setTimeout(spawnWave, 8000)
            
            // Show starting notification
            showNotification("The Rift has opened. Defend Elysara!", 3200)
            
            // Update UI
            updateUI()
        }
        
        function createTerrain() {
            const size = 120
            const geometry = new THREE.PlaneGeometry(size, size, 60, 60)
            geometry.rotateX(-Math.PI / 2)
            
            // Add some hills
            const vertices = geometry.attributes.position.array
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i]
                const z = vertices[i + 2]
                const dist = Math.sqrt(x * x + z * z)
                vertices[i + 1] = Math.sin(dist / 9) * 1.8 + 
                                  Math.cos(x / 7) * 1.2 + 
                                  Math.random() * 0.6
            }
            geometry.computeVertexNormals()
            
            const material = new THREE.MeshLambertMaterial({
                color: 0x0f2c1a,
                flatShading: true
            })
            
            terrainMesh = new THREE.Mesh(geometry, material)
            terrainMesh.receiveShadow = true
            scene.add(terrainMesh)
            
            // Add a grid helper but stylized
            const grid = new THREE.GridHelper(110, 32, 0x22aa66, 0x22aa66)
            grid.position.y = 0.1
            grid.material.opacity = 0.1
            grid.material.transparent = true
            scene.add(grid)
        }
        
        function createEnvironment() {
            // Trees
            for (let i = 0; i < 55; i++) {
                const x = (Math.random() - 0.5) * 105
                const z = (Math.random() - 0.5) * 105
                
                // Avoid center area
                if (Math.abs(x) < 22 && Math.abs(z) < 22) continue
                
                const treeGroup = new THREE.Group()
                
                // Trunk
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.6, 0.9, 5.5, 5),
                    new THREE.MeshLambertMaterial({ color: 0x2c1808, flatShading: true })
                )
                trunk.castShadow = true
                trunk.position.y = 3
                treeGroup.add(trunk)
                
                // Foliage
                const foliage = new THREE.Mesh(
                    new THREE.ConeGeometry(4.5, 9, 5),
                    new THREE.MeshLambertMaterial({ 
                        color: i % 3 === 0 ? 0x14532d : 0x166534, 
                        flatShading: true 
                    })
                )
                foliage.castShadow = true
                foliage.position.y = 9
                treeGroup.add(foliage)
                
                const foliage2 = foliage.clone()
                foliage2.scale.set(0.7, 0.7, 0.7)
                foliage2.position.y = 12.5
                treeGroup.add(foliage2)
                
                treeGroup.position.set(x, 0, z)
                treeGroup.rotation.y = Math.random() * Math.PI
                scene.add(treeGroup)
                
                // Store as static entity for collision
                entities.push({
                    type: 'tree',
                    mesh: treeGroup,
                    x: x,
                    z: z,
                    radius: 3.5
                })
            }
            
            // Rocks
            for (let i = 0; i < 22; i++) {
                const x = (Math.random() - 0.5) * 95
                const z = (Math.random() - 0.5) * 95
                if (Math.abs(x) < 15 && Math.abs(z) < 15) continue
                
                const rock = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(2.5 + Math.random() * 2, 1),
                    new THREE.MeshLambertMaterial({ 
                        color: 0x475569, 
                        flatShading: true 
                    })
                )
                rock.castShadow = true
                rock.receiveShadow = true
                rock.position.set(x, 1.8, z)
                rock.rotation.set(Math.random(), Math.random() * 2, Math.random())
                scene.add(rock)
                
                entities.push({
                    type: 'rock',
                    mesh: rock,
                    x: x,
                    z: z,
                    radius: 3
                })
            }
        }
        
        function createStartingKeep() {
            const keep = {
                id: Date.now(),
                type: 'building',
                subtype: 'keep',
                x: -3,
                z: -8,
                size: 7,
                health: 800,
                maxHealth: 800,
                mesh: null,
                name: 'LUNAR KEEP'
            }
            
            const group = new THREE.Group()
            
            // Main structure
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(12, 7, 12),
                new THREE.MeshLambertMaterial({ color: 0x1e2937, flatShading: true })
            )
            base.castShadow = true
            base.receiveShadow = true
            group.add(base)
            
            // Roof
            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(8, 6, 4),
                new THREE.MeshLambertMaterial({ color: 0x334155, flatShading: true })
            )
            roof.position.y = 7
            roof.rotation.y = Math.PI / 4
            group.add(roof)
            
            // Flag
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.2, 8, 8),
                new THREE.MeshLambertMaterial({ color: 0x111111 })
            )
            pole.position.set(0, 10, 0)
            group.add(pole)
            
            const flag = new THREE.Mesh(
                new THREE.PlaneGeometry(4, 3),
                new THREE.MeshLambertMaterial({ color: 0x854d0e, side: THREE.DoubleSide })
            )
            flag.position.set(2.2, 13, 0)
            flag.rotation.y = Math.PI / 3
            group.add(flag)
            
            group.position.set(keep.x, 0, keep.z)
            scene.add(group)
            keep.mesh = group
            
            buildings.push(keep)
            entities.push(keep)
        }
        
        function createUnit(typeId, x, z) {
            const unitClass = UNIT_CLASSES[typeId]
            
            const unit = {
                id: Date.now() + Math.random(),
                type: 'unit',
                subtype: unitClass.id,
                x: x,
                z: z,
                health: unitClass.health,
                maxHealth: unitClass.health,
                mesh: null,
                targetX: x,
                targetZ: z,
                velocityX: 0,
                velocityZ: 0,
                attackCooldown: 0,
                isSelected: false,
                lastAttack: 0,
                class: unitClass

        let placingBuilding = null
        
        function startBuildingPlacement(building) {
            placingBuilding = building
            showNotification(`Placing ${building.name}...`, 1200)
        }
        
        function placeBuilding(x, z) {
            if (!placingBuilding) return false
            
            // Check cost
            if (resources.wood < placingBuilding.cost.wood || 
                resources.stone < placingBuilding.cost.stone || 
                resources.mana < placingBuilding.cost.mana) {
                showNotification("NOT ENOUGH RESOURCES", 900)
                return false
            }
            
            // Check overlap (simplified)
            for (let b of buildings) {
                const dx = b.x - x
                const dz = b.z - z
                if (Math.sqrt(dx*dx + dz*dz) < b.size + placingBuilding.size + 4) {
                    showNotification("TOO CLOSE TO OTHER BUILDING", 1100)
                    return false
                }
            }
            
            // Pay
            resources.wood -= placingBuilding.cost.wood || 0
            resources.stone -= placingBuilding.cost.stone || 0
            resources.mana -= placingBuilding.cost.mana || 0
            updateUI()
            
            const newBuilding = {
                id: Date.now(),
                type: 'building',
                subtype: placingBuilding.id,
                x: x,
                z: z,
                size: placingBuilding.size,
                health: placingBuilding.health || 200,
                maxHealth: placingBuilding.health || 200,
                mesh: null,
                name: placingBuilding.name,
                isDefense: placingBuilding.isDefense || false
            }
            
            const group = new THREE.Group()
            
            if (placingBuilding.id === 'lumber') {
                // Simple house like
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(6, 4, 6),
                    new THREE.MeshLambertMaterial({color: 0x365314})
                )
                group.add(base)
                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(4.5, 4, 4),
                    new THREE.MeshLambertMaterial({color: 0x052e16})
                )
                roof.position.y = 4
                group.add(roof)
            } else if (placingBuilding.id === 'quarry') {
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(7, 3.5, 7),
                    new THREE.MeshLambertMaterial({color: 0x334155})
                )
                group.add(base)
            } else if (placingBuilding.id === 'barracks') {
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(8, 5, 8),
                    new THREE.MeshLambertMaterial({color: 0x450a0a})
                )
                group.add(base)
            } else if (placingBuilding.id === 'tower') {
                const base = new THREE.Mesh(
                    new THREE.CylinderGeometry(2.5, 3.5, 11, 6),
                    new THREE.MeshLambertMaterial({color: 0x312e81})
                )
                base.castShadow = true
                group.add(base)
                
                const top = new THREE.Mesh(
                    new THREE.ConeGeometry(3.8, 4, 5),
                    new THREE.MeshLambertMaterial({color: 0x6366f1})
                )
                top.position.y = 8
                group.add(top)
            }
            
            group.position.set(x, 0, z)
            scene.add(group)
            newBuilding.mesh = group
            buildings.push(newBuilding)
            entities.push(newBuilding)
            
            placingBuilding = null
            updateUI()
            
            showNotification("BUILDING CONSTRUCTED", 1400)
            return true
        }
        
        function updateCameraPosition() {
            const x = Math.sin(cameraAngle) * cameraDistance
            const z = Math.cos(cameraAngle) * cameraDistance * 0.6
            camera.position.set(x + cameraTarget.x, cameraDistance * 0.7, z + cameraTarget.z)
            camera.lookAt(cameraTarget.x, 8, cameraTarget.z)
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight
            camera.updateProjectionMatrix()
            renderer.setSize(window.innerWidth, window.innerHeight)
        }
        
        function onMouseDown(e) {
            if (e.button === 0) {
                isDragging = true
                dragStart.x = e.clientX
                dragStart.y = e.clientY
                
                // Try select
                const rect = renderer.domElement.getBoundingClientRect()
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1
                
                raycaster.setFromCamera(mouse, camera)
                const intersects = raycaster.intersectObjects(scene.children, true)
                
                if (intersects.length > 0) {
                    const obj = intersects[0].object
                    if (obj.userData && obj.userData.entity) {
                        const entity = obj.userData.entity
                        if (entity.type === 'unit') {
                            if (!keys['Shift']) deselectAll()
                            selectEntity(entity)
                            return
                        }
                    }
                }
                
                // Otherwise, check for click on buildings or ground
                if (intersects.length > 0) {
                    const point = intersects[0].point
                    if (placingBuilding) {
                        placeBuilding(point.x, point.z)
                    } else {
                        // deselect if not holding shift
                        if (!keys['Shift']) deselectAll()
                    }
                }
            } else if (e.button === 2) {
                // handled in contextmenu
            }
        }
        
        function onMouseMove(e) {
            const rect = renderer.domElement.getBoundingClientRect()
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1
            
            if (isDragging && Math.abs(e.clientX - dragStart.x) > 8) {
                // could implement box select but skipped for simplicity
            }
            
            if (isPanning) {
                const dx = (e.clientX - lastMouseX) * 0.15
                cameraAngle -= dx * 0.008
                updateCameraPosition()
            }
            
            lastMouseX = e.clientX
            lastMouseY = e.clientY
        }
        
        function onMouseUp(e) {
            isDragging = false
        }
        
        function onRightClick(e) {
            e.preventDefault()
            
            const rect = renderer.domElement.getBoundingClientRect()
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1
            
            raycaster.setFromCamera(mouse, camera)
            const intersects = raycaster.intersectObject(terrainMesh)
            
            if (intersects.length > 0) {
                const point = intersects[0].point
                
                // Command selected units to move there
                if (selectedEntities.length > 0) {
                    const spread = 6
                    
                    selectedEntities.forEach((unit, i) => {
                        if (unit.type !== 'unit') return
                        
                        const angle = (i / selectedEntities.length) * Math.PI * 2
                        unit.targetX = point.x + Math.cos(angle) * spread
                        unit.targetZ = point.z + Math.sin(angle) * spread
                    })
                    
                    createMoveMarker(point.x, point.z)
                }
            }
        }
        
        function createMoveMarker(x, z) {
            const marker = new THREE.Mesh(
                new THREE.RingGeometry(3, 4.5, 32),
                new THREE.MeshBasicMaterial({
                    color: 0x67e8f9,
                    side: THREE.DoubleSide
                })
            )
            marker.rotation.x = -Math.PI / 2
            marker.position.set(x, 0.3, z)
            scene.add(marker)
            
            let life = 28
            const int = setInterval(() => {
                life--
                marker.scale.setScalar(1 + life / 28)
                marker.material.opacity = life / 28
                if (life <= 0) {
                    clearInterval(int)
                    scene.remove(marker)
                }
            }, 16)
        }
        
        function onKeyDown(e) {
            keys[e.key] = true
            
            if (e.key === "Escape" && placingBuilding) {
                placingBuilding = null
                showNotification("Placement cancelled", 800)
            }
            
            if (e.key === "h" || e.key === "H") {
                focusHero()
            }
            
            if (e.key === " ") {
                togglePause()
            }
        }
        
        function onKeyUp(e) {
            keys[e.key] = false
        }
        
        function selectEntity(entity) {
            if (selectedEntities.indexOf(entity) === -1) {
                selectedEntities.push(entity)
                entity.isSelected = true
                
                // Highlight
                if (entity.mesh && entity.mesh.children && entity.mesh.children.length > 0) {
                    entity.mesh.children.forEach(child => {
                        if (child.material && child.material.emissive) {
                            child.material.emissive = new THREE.Color(0x442211)
                        }
                    })
                }
            }
            updateSelectionPanel()
        }
        
        function deselectAll() {
            selectedEntities.forEach(entity => {
                entity.isSelected = false
                // reset emissive
                if (entity.mesh) {
                    entity.mesh.children.forEach(c => {
                        if (c.material) c.material.emissive = new THREE.Color(0x000000)
                    })
                }
            })
            selectedEntities = []
            document.getElementById("selection-panel").classList.add("hidden")
        }
        
        function updateSelectionPanel() {
            const panel = document.getElementById("selection-panel")
            if (selectedEntities.length === 0) {
                panel.classList.add("hidden")
                return
            }
            
            panel.classList.remove("hidden")
            
            const first = selectedEntities[0]
            document.getElementById("selected-name").textContent = first.name || first.class ? first.class.name : "UNIT"
            
            let html = `<div class="text-xs text-white/40">HEALTH</div>`
            html += `<div class="h-2 bg-zinc-800 rounded-3xl overflow-hidden mt-3 mb-6">`
            html += `<div class="h-2 w-[${Math.round(first.health / first.maxHealth * 100)}%] bg-gradient-to-r from-emerald-400 to-cyan-400"></div>`
            html += `</div>`
            
            if (selectedEntities.length > 1) {
                html += `<div class="text-center text-xs py-6 text-white/30">${selectedEntities.length} units selected</div>`
            } else if (first.class) {
                html += `
                <div class="flex justify-between text-xs">
                    <div>DAMAGE</div>
                    <div class="font-mono">${first.class.damage}</div>
                </div>
                <div class="flex justify-between text-xs">
                    <div>RANGE</div>
                    <div class="font-mono">${first.class.range}</div>
                </div>
                `
            }
            
            document.getElementById("selected-content").innerHTML = html
        }
        
        function gameTick() {
            if (paused || gameOver) return
            gameTime++
            
            // Update day / night
            const progress = (gameTime % 240) / 240
            isNight = progress > 0.6
            
            if (isNight) {
                sunLight.color.setHex(0x6688aa)
                sunLight.intensity = 0.6
                scene.fog.color.setHex(0x111827)
            } else {
                sunLight.color.setHex(0xffeecc)
                sunLight.intensity = 1.4
                scene.fog.color.setHex(0x0a0a0a)
            }
            
            // Update time UI
            const timeEl = document.getElementById("time-of-day")
            if (progress < 0.2) timeEl.innerHTML = `<span class="text-xl">🌅</span><span>DAWN</span>`
            else if (progress < 0.6) timeEl.innerHTML = `<span class="text-xl">☀️</span><span>DAY</span>`
            else timeEl.innerHTML = `<span class="text-xl">🌙</span><span>NIGHT</span>`
            
            // Resource trickle
            if (gameTime % 7 === 0) {
                resources.wood += 3
                if (buildings.some(b => b.subtype === 'lumber')) resources.wood += 6
                if (buildings.some(b => b.subtype === 'quarry')) resources.stone += 4
                resources.mana = Math.min(resources.mana + 2, 180)
                updateUI()
            }
            
            // Unit AI
            units.forEach(unit => {
                if (!unit.mesh) return
                
                const dx = unit.targetX - unit.x
                const dz = unit.targetZ - unit.z
                const dist = Math.sqrt(dx*dx + dz*dz)
                
                if (dist > 2) {
                    unit.x += (dx / dist) * unit.class.speed * 1.6
                    unit.z += (dz / dist) * unit.class.speed * 1.6
                    
                    unit.mesh.position.x = unit.x
                    unit.mesh.position.z = unit.z
                    
                    // Face target
                    const angle = Math.atan2(dx, dz)
                    unit.mesh.rotation.y = angle
                }
                
                // Attack nearby enemies
                if (unit.attackCooldown <= 0) {
                    let closestEnemy = null
                    let closestDist = unit.class.range * 1.8
                    
                    enemies.forEach(enemy => {
                        const ex = enemy.x - unit.x
                        const ez = enemy.z - unit.z
                        const d = Math.sqrt(ex*ex + ez*ez)
                        
                        if (d < closestDist) {
                            closestDist = d
                            closestEnemy = enemy
                        }
                    })
                    
                    if (closestEnemy) {
                        attack(unit, closestEnemy)
                        unit.attackCooldown = unit.class.type === 'ranged' ? 26 : 18
                    }
                } else {
                    unit.attackCooldown--
                }
                
                // Workers gather automatically
                if (unit.class.type === 'worker' && unit.attackCooldown < -80) {
                    // find nearest resource and simulate
                    unit.attackCooldown = -20
                }
            })
            
            // Enemy AI
            enemies.forEach((enemy, index) => {
                if (!enemy.mesh) return
                
                // Simple path towards base
                const dx = -6 - enemy.x
                const dz = -12 - enemy.z
                const distToBase = Math.sqrt(dx*dx + dz*dz)
                
                if (distToBase > 5) {
                    enemy.x += (dx / distToBase) * enemy.speed
                    enemy.z += (dz / distToBase) * enemy.speed
                }
                
                enemy.mesh.position.x = enemy.x
                enemy.mesh.position.z = enemy.z
                
                // Attack any unit in range
                if (enemy.attackCooldown <= 0) {
                    units.forEach(unit => {
                        const dxu = unit.x - enemy.x
                        const dzu = unit.z - enemy.z
                        const d = Math.sqrt(dxu*dxu + dzu*dzu)
                        
                        if (d < 7) {
                            attackEnemy(enemy, unit)
                            enemy.attackCooldown = 22
                        }
                    })
                } else {
                    enemy.attackCooldown--
                }
                
                // If close to keep, damage it
                if (distToBase < 12 && gameTime % 12 === 0) {
                    const keep = buildings.find(b => b.subtype === 'keep')
                    if (keep) {
                        keep.health -= 8
                        createHitParticle(enemy.x, 5, enemy.z)
                        if (keep.health <= 0) {
                            endGame(false)
                        }
                    }
                }
                
                // Cleanup dead
                if (enemy.health <= 0) {
                    scene.remove(enemy.mesh)
                    enemies.splice(index, 1)
                }
            })
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]
                p.life--
                p.mesh.position.y += 0.3
                p.mesh.scale.setScalar(p.life / 22)
                if (p.life <= 0) {
                    scene.remove(p.mesh)
                    particles.splice(i, 1)
                }
            }
            
            // Random enemy spawn on edges
            if (Math.random() < 0.03 && enemies.length < 18 + wave * 4) {
                const side = Math.random()
                let x, z
                if (side < 0.5) {
                    x = 55
                    z = -30 + Math.random() * 70
                } else {
                    x = -55 + Math.random() * 30
                    z = 55
                }
                createEnemy(x, z)
            }
            
            // Win condition
            if (wave > 12 && enemies.length === 0) {
                endGame(true)
            }
            
            updateMinimap()
            updateUI()
        }
        
        function attack(attacker, target) {
            // Create projectile if ranged
            if (attacker.class && (attacker.class.type === 'ranged' || attacker.class.type === 'mage')) {
                const proj = new THREE.Mesh(
                    new THREE.SphereGeometry(0.8, 5, 5),
                    new THREE.MeshBasicMaterial({ color: attacker.class.color })
                )
                proj.position.set(attacker.x, 6, attacker.z)
                scene.add(proj)
                
                let life = 16
                const dx = target.x - attacker.x
                const dz = target.z - attacker.z
                const len = Math.sqrt(dx*dx + dz*dz) || 1
                
                const interval = setInterval(() => {
                    life--
                    proj.position.x = attacker.x + dx * (1 - life / 16)
                    proj.position.z = attacker.z + dz * (1 - life / 16)
                    proj.position.y = 6 + Math.sin(life) * 2
                    
                    if (life <= 0) {
                        clearInterval(interval)
                        scene.remove(proj)
                        
                        target.health -= attacker.class.damage
                        createHitParticle(target.x, 5, target.z)
                        
                        if (target.health <= 0) {
                            destroyEntity(target)
                        }
                    }
                }, 18)
            } else {
                // Melee
                target.health -= attacker.class ? attacker.class.damage : 18
                createHitParticle(target.x + Math.random() * 3 - 1.5, 5, target.z)
                
                if (target.health <= 0) destroyEntity(target)
            }
        }
        
        function attackEnemy(enemy, target) {
            target.health -= enemy.damage || 14
            createHitParticle(target.x, 6, target.z)
            
            if (target.health <= 0) {
                destroyEntity(target)
            }
        }
        
        function createHitParticle(x, y, z) {
            const particleCount = 7
            for (let i = 0; i < particleCount; i++) {
                const p = new THREE.Mesh(
                    new THREE.SphereGeometry(0.6, 3, 3),
                    new THREE.MeshBasicMaterial({
                        color: Math.random() > 0.5 ? 0xf59e0b : 0xf43f5e
                    })
                )
                p.position.set(x, y, z)
                scene.add(p)
                
                const vx = Math.random() * 2.5 - 1.2
                const vz = Math.random() * 2.5 - 1.2
                
                particles.push({
                    mesh: p,
                    life: 13 + Math.random() * 13,
                    vx: vx,
                    vz: vz
                })
            }
        }
        
        function destroyEntity(entity) {
            if (entity.mesh) {
                scene.remove(entity.mesh)
            }
            
            if (entity.type === 'unit') {
                const idx = units.indexOf(entity)
                if (idx > -1) units.splice(idx, 1)
            } else if (entity.type === 'enemy') {
                const idx = enemies.indexOf(entity)
                if (idx > -1) enemies.splice(idx, 1)
            }
            
            const eIdx = entities.indexOf(entity)
            if (eIdx > -1) entities.splice(eIdx, 1)
            
            // Chance to drop resources
            if (Math.random() > 0.6) {
                resources.wood += 12
                updateUI()
            }
        }
        
        function spawnWave() {
            if (paused || gameOver) return
            
            wave++
            document.getElementById("wave-status").textContent = `${wave} / 12`
            
            showNotification(`WAVE ${wave} INCOMING`, 2000)
            
            const count = 4 + wave * 3
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    if (!gameOver) {
                        const angle = Math.random() * Math.PI * 2
                        const dist = 55 + Math.random() * 18
                        const x = Math.cos(angle) * dist
                        const z = Math.sin(angle) * dist
                        createEnemy(x, z)
                    }
                }, i * 120)
            }
            
            if (wave < 13) {
                setTimeout(spawnWave, 14000 + wave * 800)
            }
        }
        
        function updateUI() {
            document.getElementById("wood-count").textContent = Math.floor(resources.wood)
            document.getElementById("stone-count").textContent = Math.floor(resources.stone)
            document.getElementById("mana-count").textContent = Math.floor(resources.mana)
            
            document.getElementById("pop-current").textContent = units.length
            document.getElementById("pop-max").textContent = population.max
            document.getElementById("day-indicator").textContent = day
        }
        
        function updateMinimap() {
            if (!minimapCtx) return
            
            const c = minimapCtx
            c.clearRect(0, 0, 144, 144)
            
            // background terrain
            c.fillStyle = "#052e16"
            c.fillRect(0, 0, 144, 144)
            
            // grid
            c.strokeStyle = "#14532d"
            c.lineWidth = 1
            for (let i = 0; i < 7; i++) {
                const p = i * 144 / 6
                c.beginPath()
                c.moveTo(p, 0)
                c.lineTo(p, 144)
                c.stroke()
                c.beginPath()
                c.moveTo(0, p)
                c.lineTo(144, p)
                c.stroke()
            }
            
            // buildings
            c.fillStyle = "#64748b"
            buildings.forEach(b => {
                const sx = (b.x + 60) / 120 * 144
                const sz = (b.z + 60) / 120 * 144
                c.fillRect(sx - 4, sz - 4, 9, 9)
            })
            
            // player units
            c.fillStyle = "#67e8f9"
            units.forEach(u => {
                const sx = (u.x + 60) / 120 * 144
                const sz = (u.z + 60) / 120 * 144
                c.fillRect(sx - 2, sz - 2, 4, 4)
            })
            
            // enemies
            c.fillStyle = "#c026d3"
            enemies.forEach(e => {
                const sx = (e.x + 60) / 120 * 144
                const sz = (e.z + 60) / 120 * 144
                c.fillRect(sx - 2.5, sz - 2.5, 5, 5)
            })
            
            // viewport indicator
            const vp = document.getElementById("minimap-viewport")
            // static for demo
        }
        
        function animate() {
            requestAnimationFrame(animate)
            
            if (!paused && !gameOver) {
                // gentle unit bob
                units.forEach((unit, i) => {
                    if (unit.mesh) {
                        unit.mesh.position.y = Math.sin(gameTime * 0.1 + i) * 0.3
                    }
                })
                
                enemies.forEach((enemy, i) => {
                    if (enemy.mesh) {
                        enemy.mesh.position.y = Math.sin(gameTime * 0.13 + i) * 0.6 + 1
                        enemy.mesh.rotation.y = Math.sin(gameTime * 0.05) * 0.1
                    }
                })
            }
            
            renderer.render(scene, camera)
        }
        
        function showNotification(text, timeout = 2200) {
            const notif = document.getElementById("notification")
            const textEl = document.getElementById("notif-text")
            textEl.textContent = text
            notif.classList.remove("hidden")
            notif.style.opacity = 1
            
            setTimeout(() => {
                notif.style.transitionDuration = '800ms'
                notif.style.opacity = 0
                setTimeout(() => {
                    notif.classList.add("hidden")
                    notif.style.transitionDuration = ''
                }, 800)
            }, timeout)
        }
        
        function togglePause() {
            paused = !paused
            const hint = document.getElementById("help-hint")
            if (paused) {
                hint.innerHTML = `<span class="text-amber-400">PAUSED</span>`
            } else {
                hint.innerHTML = `WASD / DRAG to pan • RIGHT CLICK to command`
            }
        }
        
        function endGame(didWin) {
            gameOver = true
            victory = didWin
            
            const screen = document.getElementById("end-screen")
            screen.classList.remove("hidden")
            
            const title = document.getElementById("end-title")
            const subtitle = document.getElementById("end-subtitle")
            
            if (didWin) {
                title.textContent = "THE RIFT IS SEALED"
                title.style.backgroundImage = "linear-gradient(to bottom, #a5f3fc, #67e8f9)"
                subtitle.textContent = "Elysara stands eternal"
            } else {
                title.textContent = "THE KEEP HAS FALLEN"
                title.style.backgroundImage = "linear-gradient(to bottom, #fda4af, #e11d48)"
                subtitle.textContent = "The shadow legion prevails"
            }
        }
        
        function restartGame() {
            location.reload()
        }
        
        function toggleBuildPanel() {
            const panel = document.getElementById("build-panel")
            if (panel.style.transform === 'translateY(-120%)') {
                panel.style.transform = 'translateY(0)'
            } else {
                panel.style.transform = 'translateY(-120%)'
            }
        }
        
        function selectUnitType(n) {
            selectedRecruitType = n
            const costs = UNIT_CLASSES[n].cost
            let costText = ""
            if (costs.wood) costText += `${costs.wood}w `
            if (costs.stone) costText += `${costs.stone}s `
            if (costs.mana) costText += `${costs.mana}m`
            document.getElementById("recruit-cost").textContent = costText.trim()
            
            // Highlight button
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`unit-btn-${i}`)
                if (i === n) {
                    btn.style.borderColor = "#eab308"
                    btn.style.transform = "scale(1.15)"
                } else {
                    btn.style.borderColor = "transparent"
                    btn.style.transform = ""
                }
            }
        }
        
        function recruitSelectedType() {
            const uc = UNIT_CLASSES[selectedRecruitType]
            if (resources.wood < uc.cost.wood || resources.stone < uc.cost.stone || resources.mana < uc.cost.mana) {
                showNotification("INSUFFICIENT RESOURCES", 1100)
                return
            }
            
            resources.wood -= uc.cost.wood || 0
            resources.stone -= uc.cost.stone || 0
            resources.mana -= uc.cost.mana || 0
            
            // Find a good place near keep
            const spawnX = -18 + Math.random() * 12
            const spawnZ = -22 + Math.random() * 14
            const newUnit = createUnit(selectedRecruitType, spawnX, spawnZ)
            
            // Give initial target
            newUnit.targetX = -3
            newUnit.targetZ = -3
            
            updateUI()
            showNotification(`+1 ${uc.name.toUpperCase()}`, 1200)
        }
        
        function focusHero() {
            // The hero is the first swordsman
            if (units.length > 0) {
                cameraTarget.x = units[1] ? units[1].x : -12
                cameraTarget.z = units[1] ? units[1].z : 8
                updateCameraPosition()
                showNotification("SER ALARIC FOCUSED", 1600)
            }
        }
        
        function setFormation(n) {
            showNotification(["LINE", "WEDGE", "PHALANX"][n] + " FORMATION", 1100)
            // Would rearrange selected units in real implementation
        }
        
        function holdPosition() {
            selectedEntities.forEach(entity => {
                if (entity.type === 'unit') {
                    entity.targetX = entity.x
                    entity.targetZ = entity.z
                }
            })
            showNotification("HOLDING POSITION", 900)
        }
        
        function toggleResourceDetail() {
            showNotification("ECONOMY BALANCED • 12 VILLAGERS GATHERING", 1700)
        }
        
        function clickMinimap(e) {
            const rect = e.currentTarget.getBoundingClientRect()
            const mx = (e.clientX - rect.left) / rect.width
            const mz = (e.clientY - rect.top) / rect.height
            
            cameraTarget.x = (mx - 0.5) * 110
            cameraTarget.z = (mz - 0.5) * 110
            updateCameraPosition()
        }
        
        function runGame() {
            // Initialize Tailwind
            initializeTailwind()
            
            // Setup minimap canvas
            const minimapCanvas = document.getElementById("minimap")
            minimapCtx = minimapCanvas.getContext("2d")
            
            // Boot the game
            initThree()
            
            // Select default recruit type
            setTimeout(() => {
                selectUnitType(1)
            }, 120)
            
            // Keyboard hint fades out
            setTimeout(() => {
                const hint = document.getElementById("help-hint")
                hint.style.transitionDuration = "1200ms"
                hint.style.opacity = "0.1"
            }, 6500)
        }
        
        window.onload = runGame
    </script>
</body>
</html>
