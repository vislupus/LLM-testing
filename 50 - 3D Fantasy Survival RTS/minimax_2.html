<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherheim - Fantasy Kingdom RTS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quicksand:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: #1a1a2e;
        }
        
        #gameCanvas {
            display: block;
        }
        
        .ui-overlay {
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-overlay > * {
            pointer-events: auto;
        }
        
        .resource-panel {
            background: linear-gradient(135deg, rgba(30, 30, 50, 0.95), rgba(20, 20, 40, 0.9));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .resource-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .gold-icon { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .wood-icon { background: linear-gradient(135deg, #8B4513, #A0522D); }
        .stone-icon { background: linear-gradient(135deg, #808080, #A9A9A9); }
        .pop-icon { background: linear-gradient(135deg, #4169E1, #6495ED); }
        
        .btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .btn:hover {
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 100%);
            border-color: rgba(255, 215, 0, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-building {
            background: linear-gradient(180deg, rgba(100, 200, 100, 0.3) 0%, rgba(80, 150, 80, 0.2) 100%);
            border-color: rgba(100, 255, 150, 0.4);
        }
        
        .btn-unit {
            background: linear-gradient(180deg, rgba(100, 150, 255, 0.3) 0%, rgba(80, 100, 200, 0.2) 100%);
            border-color: rgba(150, 180, 255, 0.4);
        }
        
        .btn-research {
            background: linear-gradient(180deg, rgba(180, 100, 255, 0.3) 0%, rgba(150, 80, 200, 0.2) 100%);
            border-color: rgba(200, 150, 255, 0.4);
        }
        
        .minimap {
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        .health-bar {
            height: 4px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
        
        .tooltip {
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #ddd;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 1000;
        }
        
        .unit-card {
            background: linear-gradient(135deg, rgba(40, 40, 70, 0.9), rgba(30, 30, 50, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        
        .unit-card:hover {
            border-color: rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
        }
        
        .unit-card.selected {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        
        .formation-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(50, 50, 80, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .formation-btn:hover, .formation-btn.active {
            background: rgba(255, 215, 0, 0.3);
            border-color: #FFD700;
        }
        
        .notification {
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        .day-night-indicator {
            transition: all 1s ease;
        }
        
        .game-title {
            font-family: 'Cinzel', serif;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 4px 8px rgba(0,0,0,0.8);
        }
        
        .panel-title {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            color: #FFD700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.4);
            border-radius: 3px;
        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-bar {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <h1 class="game-title text-4xl text-yellow-400 mb-4">Aetherheim</h1>
        <p class="text-gray-400">Preparing your kingdom...</p>
        <div class="loading-bar">

        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

            </div>

                </div>
                <button class="btn px-4 py-2" onclick="togglePause()">

            </div>
        </div>
    </div>
    
    <!-- Left Panel - Buildings & Units -->

            </div>
            
            <!-- Units Section -->

                <div class="grid grid-cols-2 gap-2" id="unitPanel">
                    <!-- Populated by JS -->
                </div>
            </div>
            
            <!-- Research Section -->
            <div>
                <h3 class="text-gray-400 text-sm mb-2 font-semibold">Research</h3>
                <div class="space-y-2" id="researchPanel">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Right Panel - Selected Unit/Building Info -->
    <div class="ui-overlay top-32 right-4 w-72">
        <div class="resource-panel p-4" id="selectionPanel">
            <h2 class="panel-title text-lg mb-3">👆 Selection</h2>
            <div id="selectionContent" class="text-gray-400 text-sm">
                Click on a unit or building to see details
            </div>
        </div>
        
        <!-- Army Control -->
        <div class="resource-panel p-4 mt-4">
            <h2 class="panel-title text-lg mb-3">⚔️ Army Control</h2>
            <div class="flex gap-2 mb-3">
                <button class="formation-btn active" data-formation="line" title="Line Formation">📏</button>
                <button class="formation-btn" data-formation="wedge" title="Wedge Formation">🔺</button>
                <button class="formation-btn" data-formation="circle" title="Circle Formation">⭕</button>
                <button class="formation-btn" data-formation="scatter" title="Scatter">💨</button>
            </div>
            <div class="flex gap-2">
                <button class="btn flex-1 py-2" onclick="attackMove()">⚔️ Attack Move</button>
                <button class="btn flex-1 py-2" onclick="holdPosition()">🛡️ Hold</button>
            </div>
            <div class="flex gap-2 mt-2">
                <button class="btn flex-1 py-2" onclick="selectAllArmy()">Select All Army</button>
            </div>
        </div>
    </div>
    
    <!-- Bottom Panel - Minimap & Status -->
    <div class="ui-overlay bottom-4 left-4 right-4">
        <div class="flex items-end justify-between">
            <!-- Notifications -->
            <div class="space-y-2" id="notificationArea" style="max-width: 400px;"></div>
            
            <!-- Minimap -->
            <div class="minimap">
                <canvas id="minimapCanvas" width="200" height="200"></canvas>
            </div>
            
            <!-- Wave Info -->
            <div class="resource-panel p-4" style="min-width: 200px;">
                <h3 class="panel-title mb-2">🌊 Enemy Wave</h3>
                <div class="text-sm">
                    <div class="flex justify-between mb-1">
                        <span class="text-gray-400">Wave:</span>
                        <span class="text-red-400 font-semibold" id="waveNumber">1</span>
                    </div>
                    <div class="flex justify-between mb-1">
                        <span class="text-gray-400">Enemies:</span>
                        <span class="text-red-400" id="enemyCount">0</span>
                    </div>
                    <div class="health-bar mt-2">
                        <div class="health-fill bg-red-500" id="waveProgress" style="width: 0%"></div>
                    </div>
                    <p class="text-xs text-gray-500 mt-1" id="waveTimer">Next wave in: 3:00</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Tooltip -->
    <div id="tooltip" class="tooltip hidden"></div>
    
    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
        <div class="resource-panel p-8 text-center max-w-md">
            <h1 id="gameOverTitle" class="game-title text-4xl mb-4">Victory!</h1>
            <p id="gameOverText" class="text-gray-300 mb-6">You have defended your kingdom!</p>
            <button class="btn px-8 py-3 text-lg" onclick="restartGame()">🔄 Play Again</button>

    </div>

        // Initialize Three.js

            const canvas = document.getElementById('gameCanvas');

        function setupLighting() {
            // Ambient light
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);
            
            // Main directional light (sun)
            const sunLight = new THREE.DirectionalLight(0xfff4e6, 1);
            sunLight.position.set(50, 80, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 200;
            sunLight.shadow.camera.left = -60;
            sunLight.shadow.camera.right = 60;
            sunLight.shadow.camera.top = 60;
            sunLight.shadow.camera.bottom = -60;
            sunLight.shadow.bias = -0.0001;
            scene.add(sunLight);
            
            // Fill light
            const fillLight = new THREE.DirectionalLight(0x8ec8ff, 0.3);
            fillLight.position.set(-30, 40, -30);
            scene.add(fillLight);
            
            // Hemisphere light for sky/ground color blending
            const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x8B4513, 0.4);
            scene.add(hemiLight);
        }
        
        function createGround() {
            // Create terrain with height variation
            const geometry = new THREE.PlaneGeometry(CONFIG.MAP_SIZE * CONFIG.TILE_SIZE, CONFIG.MAP_SIZE * CONFIG.TILE_SIZE, 64, 64);
            
            // Add some height variation
            const vertices = geometry.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const y = vertices[i + 1];
                const dist = Math.sqrt(x * x + y * y);
                vertices[i + 2] = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 1.5 + 
                                  (dist > 30 ? (dist - 30) * 0.3 : 0);
            }
            geometry.computeVertexNormals();
            
            // Grass material
            const material = new THREE.MeshStandardMaterial({
                color: 0x4a7c3f,
                roughness: 0.9,
                metalness: 0.0,
                flatShading: true
            });
            
            groundMesh = new THREE.Mesh(geometry, material);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);
            
            // Ground plane for raycasting
            groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            
            // Add some decorative elements
            addTerrainDetails();
        }
        
        function addTerrainDetails() {
            // Add some rocks and trees
            const rockGeometry = new THREE.DodecahedronGeometry(0.5, 0);
            const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, flatShading: true });
            
            for (let i = 0; i < 50; i++) {
                const rock = new THREE.Mesh(rockGeometry, rockMaterial);
                const x = (Math.random() - 0.5) * CONFIG.MAP_SIZE * CONFIG.TILE_SIZE * 0.9;
                const z = (Math.random() - 0.5) * CONFIG.MAP_SIZE * CONFIG.TILE_SIZE * 0.9;
                if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
                rock.position.set(x, 0.3, z);
                rock.scale.setScalar(0.3 + Math.random() * 0.5);
                rock.rotation.y = Math.random() * Math.PI;
                rock.castShadow = true;
                scene.add(rock);
            }
            
            // Trees
            const treePositions = [];
            for (let i = 0; i < 80; i++) {
                const x = (Math.random() - 0.5) * CONFIG.MAP_SIZE * CONFIG.TILE_SIZE * 0.9;
                const z = (Math.random() - 0.5) * CONFIG.MAP_SIZE * CONFIG.TILE_SIZE * 0.9;
                if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;
                if (Math.abs(x - CONFIG.ENEMY_BASE_POSITION.x * CONFIG.TILE_SIZE) < 20 && 
                    Math.abs(z - CONFIG.ENEMY_BASE_POSITION.z * CONFIG.TILE_SIZE) < 20) continue;
                treePositions.push({ x, z });
            }
            
            treePositions.forEach(pos => createTree(pos.x, pos.z));
        }
        
        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            
            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.4, 2, 6);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x5D4037, flatShading: true });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);
            
            // Foliage
            const foliageGeometry = new THREE.ConeGeometry(1.5, 3, 6);
            const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x2E7D32, flatShading: true });
            const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
            foliage.position.y = 3;
            foliage.castShadow = true;
            treeGroup.add(foliage);
            
            treeGroup.position.set(x, 0, z);
            treeGroup.scale.setScalar(0.8 + Math.random() * 0.6);
            scene.add(treeGroup);
        }
        
        function createWater() {
            const geometry = new THREE.PlaneGeometry(200, 200);
            const material = new THREE.MeshStandardMaterial({
                color: 0x1E88E5,
                transparent: true,
                opacity: 0.7,
                roughness: 0.1,
                metalness: 0.3
            });
            
            waterMesh = new THREE.Mesh(geometry, material);

        function createResourceNodes() {
            const nodeTypes = ['gold', 'wood', 'stone'];
            
            for (let i = 0; i < CONFIG.RESOURCE_NODES; i++) {
                const type = nodeTypes[Math.floor(Math.random() * nodeTypes.length)];
                let x, z;
                
                // Place nodes in a ring around the player base
                const angle = (i / CONFIG.RESOURCE_NODES) * Math.PI * 2;
                const radius = 15 + Math.random() * 10;
                x = Math.cos(angle) * radius - 35;
                z = Math.sin(angle) * radius - 35;
                
                const node = {
                    id: i,
                    type: type,
                    x: x,
                    z: z,
                    amount: type === 'gold' ? 500 : type === 'wood' ? 300 : 200,
                    maxAmount: type === 'gold' ? 500 : type === 'wood' ? 300 : 200
                };
                
                gameState.resourceNodes.push(node);
                createResourceNodeMesh(node);
            }
        }
        
        function createResourceNodeMesh(node) {
            let geometry, material, color;
            
            switch (node.type) {
                case 'gold':
                    geometry = new THREE.OctahedronGeometry(0.8, 0);
                    color = 0xFFD700;
                    break;
                case 'wood':
                    geometry = new THREE.CylinderGeometry(0.3, 0.4, 1.5, 6);
                    color = 0x8B4513;
                    break;
                case 'stone':
                    geometry = new THREE.DodecahedronGeometry(0.6, 0);
                    color = 0x808080;
                    break;
            }
            
            material = new THREE.MeshStandardMaterial({ 
                color: color, 
                emissive: color,
                emissiveIntensity: 0.2,
                flatShading: true 
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(node.x, 1, node.z);
            mesh.castShadow = true;
            mesh.userData = { type: 'resourceNode', node: node };
            scene.add(mesh);
            nodeMeshes.push(mesh);
        }

        function createBuildingMesh(building) {
            const config = CONFIG.BUILDINGS[building.type];
            const buildingGroup = new THREE.Group();
            
            let color;
            switch (building.type) {
                case 'TOWN_HALL': color = 0xDAA520; break;
                case 'HOUSE': color = 0xCD853F; break;
                case 'LUMBER_MILL': color = 0x8B4513; break;

                case 'BARRACKS': color = 0xB22222; break;

                case 'MAGE_TOWER': color = 0x4B0082; break;
                case 'WALL': color = 0x696969; break;
                case 'TOWER': color = 0x4A4A4A; break;
                case 'BARRICADE': color = 0x8B4513; break;
                default: color = 0x888888;
            }
            
            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                flatShading: true,
                roughness: 0.8
            });
            
            // Main structure
            let geometry;
            const size = config.size || 2;
            
            if (building.type === 'TOWER') {
                geometry = new THREE.CylinderGeometry(1, 1.5, 6, 8);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.y = 3;
                mesh.castShadow = true;
                buildingGroup.add(mesh);
            } else if (building.type === 'WALL') {
                geometry = new THREE.BoxGeometry(size * 1.5, 2, 0.8);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.y = 1;
                mesh.castShadow = true;
                buildingGroup.add(mesh);
            } else if (building.type === 'MAGE_TOWER') {
                geometry = new THREE.CylinderGeometry(1, 1.5, 5, 8);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.y = 2.5;
                mesh.castShadow = true;
                buildingGroup.add(mesh);
                
                // Crystal on top

                const crystalMat = new THREE.MeshStandardMaterial({ 
                    color: 0x9400D3,

                    emissiveIntensity: 0.4,
                    flatShading: true 
                });
                const crystal = new THREE.Mesh(crystalGeo, crystalMat);
                crystal.position.y = 5.5;
                buildingGroup.add(crystal);
            } else {
                geometry = new THREE.BoxGeometry(size, size * 0.7, size);

        function createHealthBar(parent, maxHealth, id) {
            const barGroup = new THREE.Group();
            
            const bgGeometry = new THREE.PlaneGeometry(2, 0.2);
            const bgMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5 });
            const bg = new THREE.Mesh(bgGeometry, bgMaterial);
            barGroup.add(bg);
            
            const fillGeometry = new THREE.PlaneGeometry(1.9, 0.15);
            const fillMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const fill = new THREE.Mesh(fillGeometry, fillMaterial);
            fill.position.x = -0.95;
            fill.scale.x = maxHealth / maxHealth;
            barGroup.userData = { fill, maxHealth, id };
            barGroup.add(fill);
            
            barGroup.position.y = 4;
            parent.add(barGroup);
        }
        
        function updateHealthBar(id, currentHealth, maxHealth) {
            scene.traverse(obj => {
                if (obj.userData && obj.userData.id === id) {
                    const fill = obj.userData.fill;
                    if (fill) {
                        const percentage = Math.max(0, currentHealth / maxHealth);
                        fill.scale.x = percentage;
                        fill.position.x = -0.95 + (percentage * 0.95);
                        
                        if (percentage > 0.6) {
                            fill.material.color.setHex(0x00ff00);
                        } else if (percentage > 0.3) {
                            fill.material.color.setHex(0xffff00);
                        } else {
                            fill.material.color.setHex(0xff0000);
                        }
                    }
                }
            });
        }
        
        // ==================== CAMERA CONTROLS ====================
        let cameraTarget = new THREE.Vector3(0, 0, 0);
        let cameraAngle = Math.PI / 4;
        let cameraDistance = 50;
        let cameraHeight = 30;
        let isDragging = false;
        let lastMouseX, lastMouseY;
        
        function setupCameraControls() {
            const canvas = document.getElementById('gameCanvas');
            
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 2 || e.button === 1) {
                    isDragging = true;
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                }
            });
            
            canvas.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - lastMouseX;
                    const deltaY = e.clientY - lastMouseY;
                    
                    cameraAngle -= deltaX * 0.01;
                    cameraHeight = Math.max(10, Math.min(60, cameraHeight - deltaY * 0.2));
                    
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                }
            });
            
            canvas.addEventListener('wheel', (e) => {
                cameraDistance = Math.max(20, Math.min(100, cameraDistance + e.deltaY * 0.05));
                e.preventDefault();
            });
        }
        
        function updateCamera() {
            camera.position.x = cameraTarget.x + Math.cos(cameraAngle) * cameraDistance;
            camera.position.z = cameraTarget.z + Math.sin(cameraAngle) * cameraDistance;
            camera.position.y = cameraHeight;
            camera.lookAt(cameraTarget);
        }
        
        // ==================== INPUT HANDLING ====================
        function onCanvasClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Check for unit/building selection
            const allMeshes = [...unitMeshes, ...buildingMeshes, ...enemyMeshes];
            const intersects = raycaster.intersectObjects(allMeshes, true);
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.type) {
                    obj = obj.parent;
                }
                
                if (obj.userData.type === 'unit') {
                    selectUnit(obj.userData.unit);
                } else if (obj.userData.type === 'building') {
                    selectBuilding(obj.userData.building);
                } else if (obj.userData.type === 'enemy') {
                    // Select enemy for targeting
                    if (gameState.selectedUnits.length > 0) {
                        gameState.selectedUnits.forEach(u => {
                            u.target = obj.userData.unit;
                        });
                    }
                }
            } else {
                // Deselect
                clearSelection();
            }
        }

            // Update cursor position for tooltips
        }
        
        function onRightClick(event) {
            event.preventDefault();
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersectPoint = new THREE.Vector3();

        function updateUnitSelectionVisuals() {
            unitMeshes.forEach(mesh => {
                if (mesh.userData.unit && gameState.selectedUnits.includes(mesh.userData.unit)) {
                    // Add selection indicator (glow)
                    mesh.traverse(child => {
                        if (child.material) {
                            child.userData.originalEmissive = child.material.emissive?.getHex() || 0;
                            child.material.emissive = new THREE.Color(0xFFFF00);
                            child.material.emissiveIntensity = 0.3;
                        }
                    });
                } else if (mesh.userData.unit) {
                    // Remove selection indicator
                    mesh.traverse(child => {
                        if (child.material && child.userData.originalEmissive !== undefined) {
                            child.material.emissive = new THREE.Color(child.userData.originalEmissive);
                            child.material.emissiveIntensity = child.userData.originalEmissive > 0 ? 0.2 : 0;
                        }
                    });
                }
            });

        function moveSelectedUnits(x, z) {
            const units = gameState.selectedUnits.filter(u => u.config && u.config.combat);
            if (units.length === 0) return;
            
            // Formation movement
            const formation = gameState.formation;
            const count = units.length;
            let positions = [];
            
            if (formation === 'line') {
                const rows = Math.ceil(Math.sqrt(count));
                for (let i = 0; i < count; i++) {
                    const row = Math.floor(i / rows);
                    const col = i % rows;
                    positions.push({
                        x: x + (col - rows/2) * 2,
                        z: z + row * 2
                    });
                }
            } else if (formation === 'wedge') {
                for (let i = 0; i < count; i++) {
                    const row = Math.floor(Math.sqrt(i + 1));
                    const offset = (i - row * (row - 1) / 2) - (row - 1) / 2;
                    positions.push({
                        x: x + offset * 2,
                        z: z + row * 1.5
                    });
                }
            } else if (formation === 'circle') {
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const radius = Math.ceil(Math.sqrt(count)) * 1.5;
                    positions.push({
                        x: x + Math.cos(angle) * radius,
                        z: z + Math.sin(angle) * radius
                    });
                }
            } else {
                // Scatter
                for (let i = 0; i < count; i++) {
                    positions.push({
                        x: x + (Math.random() - 0.5) * 10,
                        z: z + (Math.random() - 0.5) * 10
                    });
                }
            }
            
            units.forEach((unit, i) => {
                unit.targetX = positions[i]?.x || x;
                unit.targetZ = positions[i]?.z || z;
                unit.holding = false;
            });
            
            showNotification('Units moved', 'info');
        }

        function formatCost(cost) {
            const parts = [];
            if (cost.gold) parts.push(`💰${cost.gold}`);
            if (cost.wood) parts.push(`🪵${cost.wood}`);
            if (cost.stone) parts.push(`🪨${cost.stone}`);
            return parts.join(' ');
        }
        
        function canAffordBuilding(type) {
            const cost = CONFIG.BUILDINGS[type].cost;
            return gameState.resources.gold >= cost.gold && 
                   gameState.resources.wood >= cost.wood && 
                   gameState.resources.stone >= cost.stone;
        }
        
        function canAffordUnit(type) {
            const cost = CONFIG.UNITS[type].cost;
            return gameState.resources.gold >= cost.gold && 
                   gameState.resources.wood >= cost.wood && 
                   gameState.resources.stone >= cost.stone;
        }
        
        function canAffordResearch(type) {
            const cost = CONFIG.RESEARCH[type].cost;
            return gameState.resources.gold >= cost.gold && 
                   gameState.resources.wood >= cost.wood && 
                   gameState.resources.stone >= cost.stone;
        }
        
        let placementMode = null;
        
        function startBuildingPlacement(type) {
            if (!canAffordBuilding(type)) {
                showNotification('Not enough resources!', 'error');
                return;
            }
            
            placementMode = type;
            showNotification(`Click on the map to place ${CONFIG.BUILDINGS[type].name}`, 'info');
            
            document.addEventListener('click', handleBuildingPlacement, { once: true });
        }
        
        function handleBuildingPlacement(event) {
            if (!placementMode) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(groundPlane, intersectPoint);
            
            if (intersectPoint) {
                const cost = CONFIG.BUILDINGS[placementMode].cost;
                gameState.resources.gold -= cost.gold;
                gameState.resources.wood -= cost.wood;
                gameState.resources.stone -= cost.stone;
                
                const building = {
                    id: gameState.buildings.length,
                    type: placementMode,
                    x: intersectPoint.x,
                    z: intersectPoint.z,
                    health: CONFIG.BUILDINGS[placementMode].health,
                    maxHealth: CONFIG.BUILDINGS[placementMode].health,
                    level: 1
                };
                
                // Apply research bonuses
                if (gameState.researchCompleted.includes('FORTIFICATION')) {
                    building.maxHealth *= 1.3;
                    building.health = building.maxHealth;
                }
                
                gameState.buildings.push(building);
                createBuildingMesh(building);
                
                // Update population
                if (CONFIG.BUILDINGS[placementMode].providesPop) {
                    gameState.maxPopulation += CONFIG.BUILDINGS[placementMode].providesPop;
                }
                
                showNotification(`Built ${CONFIG.BUILDINGS[placementMode].name}!`, 'success');
                updateResourceDisplay();
            }
            
            placementMode = null;
        }
        
        function recruitUnit(type) {
            if (!canAffordUnit(type)) {
                showNotification('Not enough resources!', 'error');
                return;
            }
            
            const unitConfig = CONFIG.UNITS[type];
            
            // Check population
            if (gameState.population + unitConfig.population > gameState.maxPopulation) {
                showNotification('Not enough population space! Build more houses.', 'error');
                return;
            }
            
            const cost = unitConfig.cost;
            gameState.resources.gold -= cost.gold;
            gameState.resources.wood -= cost.wood;
            gameState.resources.stone -= cost.stone;
            
            // Find spawn point near a production building
            let spawnX = gameState.spawnPoint.x + 5;
            let spawnZ = gameState.spawnPoint.z + 5;
            
            // Find nearest building that produces this unit
            const producerBuilding = gameState.buildings.find(b => {
                const config = CONFIG.BUILDINGS[b.type];
                return config.producesUnits && config.producesUnits.includes(type);
            });
            
            if (producerBuilding) {
                spawnX = producerBuilding.x + (Math.random() - 0.5) * 5;
                spawnZ = producerBuilding.z + 5;
            }
            
            const unit = {
                id: Date.now() + Math.random(),
                type: type,
                config: unitConfig,
                x: spawnX,
                z: spawnZ,
                health: unitConfig.health,
                state: 'idle'
            };
            
            // Apply research bonuses
            if (gameState.researchCompleted.includes('WAR_TRAINING')) {
                unit.health *= 1.2;
            }
            
            if (unitConfig.canGather) {
                gameState.workers.push(unit);
            }
            if (unitConfig.combat) {
                gameState.soldiers.push(unit);
            }
            
            gameState.population += unitConfig.population;
            
            createUnitMesh(unit);
            showNotification(`Recruited ${unitConfig.name}!`, 'success');
            updateResourceDisplay();
        }
        
        function doResearch(key) {
            if (!canAffordResearch(key)) {
                showNotification('Not enough resources!', 'error');
                return;

            const research = CONFIG.RESEARCH[key];
            const cost = research.cost;
            gameState.resources.gold -= cost.gold;
            gameState.resources.wood -= cost.wood;
            gameState.resources.stone = (gameState.resources.stone || 0) - (cost.stone || 0);
            
            gameState.researchCompleted.push(key);
            
            showNotification(`Researched ${research.name}!`, 'success');
            updateResourceDisplay();
        }

        // ==================== MINIMAP ====================
        let minimapCtx;
        
        function initMinimap() {
            const canvas = document.getElementById('minimapCanvas');
            minimapCtx = canvas.getContext('2d');
        }
        
        function updateMinimap() {
            const canvas = document.getElementById('minimapCanvas');
            const ctx = minimapCtx;
            const scale = canvas.width / (CONFIG.MAP_SIZE * CONFIG.TILE_SIZE);
            
            // Clear
            ctx.fillStyle = '#1a2a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Resource nodes
            gameState.resourceNodes.forEach(node => {
                let color = '#888';
                if (node.type === 'gold') color = '#FFD700';
                if (node.type === 'wood') color = '#8B4513';
                if (node.type === 'stone') color = '#808080';
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(
                    (node.x + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale,
                    (node.z + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale,
                    3, 0, Math.PI * 2
                );
                ctx.fill();
            });
            
            // Buildings
            gameState.buildings.forEach(building => {
                ctx.fillStyle = '#4169E1';
                const x = (building.x + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
                const z = (building.z + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
                ctx.fillRect(x - 3, z - 3, 6, 6);
            });
            
            // Player units
            ctx.fillStyle = '#00FF00';
            [...gameState.workers, ...gameState.soldiers].forEach(unit => {
                const x = (unit.x + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
                const z = (unit.z + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
                ctx.beginPath();
                ctx.arc(x, z, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Enemies
            ctx.fillStyle = '#FF0000';
            gameState.enemies.forEach(enemy => {
                const x = (enemy.x + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
                const z = (enemy.z + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
                ctx.beginPath();
                ctx.arc(x, z, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Enemy base
            ctx.fillStyle = '#8B0000';
            const baseX = (CONFIG.ENEMY_BASE_POSITION.x * CONFIG.TILE_SIZE + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
            const baseZ = (CONFIG.ENEMY_BASE_POSITION.z * CONFIG.TILE_SIZE + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
            ctx.fillRect(baseX - 6, baseZ - 6, 12, 12);
            
            // Camera view
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1;
            const camX = (cameraTarget.x + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
            const camZ = (cameraTarget.z + CONFIG.MAP_SIZE * CONFIG.TILE_SIZE / 2) * scale;
            ctx.strokeRect(camX - 15, camZ - 10, 30, 20);
        }
        
        // ==================== GAME LOGIC ====================
        function updateGameLogic(deltaTime) {
            if (gameState.paused || gameState.victory || gameState.defeat) return;
            
            gameState.gameTime += deltaTime;
            
            // Day/night cycle
            gameState.timeOfDay = gameState.gameTime % CONFIG.DAY_LENGTH;
            if (gameState.timeOfDay < deltaTime && gameState.gameTime > deltaTime) {
                gameState.dayNumber++;
                showNotification(`Day ${gameState.dayNumber} begins!`, 'info');
            }
            
            // Passive resource generation
            const goldMultiplier = gameState.researchCompleted.includes('FARMING') ? 1.5 : 1;
            const stoneMultiplier = gameState.researchCompleted.includes('MINING') ? 1.5 : 1;
            
            gameState.buildings.forEach(building => {
                const config = CONFIG.BUILDINGS[building.type];
                if (config.produces && config.produces.gold) {
                    gameState.resources.gold += config.produces.gold * goldMultiplier * deltaTime;
                }
            });
            
            // Worker logic
            gameState.workers.forEach(worker => {
                if (!worker.targetNode && !worker.assignedBuilding) {
                    // Find nearest resource node
                    let nearest = null;
                    let nearestDist = Infinity;
                    
                    gameState.resourceNodes.forEach(node => {
                        if (node.amount > 0) {
                            const dist = Math.hypot(worker.x - node.x, worker.z - node.z);
                            if (dist < nearestDist) {
                                nearestDist = dist;
                                nearest = node;
                            }
                        }
                    });
                    
                    if (nearest) {
                        worker.targetNode = nearest;
                        worker.state = 'moving_to_node';
                    }
                }
                
                if (worker.targetNode) {
                    const dist = Math.hypot(worker.x - worker.targetNode.x, worker.z - worker.targetNode.z);
                    
                    if (dist > 1.5) {
                        // Move towards node
                        const speed = worker.config.speed * deltaTime;
                        const angle = Math.atan2(worker.targetNode.z - worker.z, worker.targetNode.x - worker.x);
                        worker.x += Math.cos(angle) * speed;
                        worker.z += Math.sin(angle) * speed;
                        worker.state = 'moving_to_node';
                    } else {
                        // Gather
                        const gatherRate = worker.config.gatherRate * deltaTime;
                        const nodeType = worker.targetNode.type;
                        
                        if (worker.targetNode.amount > 0) {
                            const actualGather = Math.min(gatherRate, worker.targetNode.amount);
                            worker.targetNode.amount -= actualGather;
                            
                            if (nodeType === 'gold') {
                                gameState.resources.gold += actualGather * goldMultiplier;
                            } else if (nodeType === 'wood') {
                                gameState.resources.wood += actualGather;
                            } else if (nodeType === 'stone') {
                                gameState.resources.stone += actualGather * stoneMultiplier;
                            }
                            
                            worker.state = 'gathering';
                        }
                        
                        // Find new node if depleted
                        if (worker.targetNode.amount <= 0) {
                            worker.targetNode = null;
                            worker.state = 'idle';
                        }
                    }
                }
                
                // Update mesh position
                const mesh = unitMeshes.find(m => m.userData.unit === worker);
                if (mesh) {
                    mesh.position.x = worker.x;
                    mesh.position.z = worker.z;
                }
            });
            
            // Combat unit logic
            gameState.soldiers.forEach(unit => {
                if (unit.holding) {
                    unit.state = 'holding';
                    return;
                }
                
                // Find nearest enemy
                let nearestEnemy = null;
                let nearestDist = Infinity;
                
                gameState.enemies.forEach(enemy => {
                    const dist = Math.hypot(unit.x - enemy.x, unit.z - enemy.z);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestEnemy = enemy;
                    }
                });
                
                const attackRange = unit.config.range || 1;
                
                if (nearestEnemy && nearestDist < attackRange * 2) {
                    // Attack enemy
                    if (nearestDist > attackRange) {
                        // Move towards enemy
                        const speed = unit.config.speed * deltaTime;
                        const angle = Math.atan2(nearestEnemy.z - unit.z, nearestEnemy.x - unit.x);
                        unit.x += Math.cos(angle) * speed;
                        unit.z += Math.sin(angle) * speed;
                        unit.state = 'attacking';
                    } else {
                        // Attack
                        if (!unit.attackCooldown) unit.attackCooldown = 0;
                        unit.attackCooldown -= deltaTime;
                        
                        if (unit.attackCooldown <= 0) {
                            const damage = unit.config.damage * (gameState.researchCompleted.includes('BLACKSMITH') ? 1.2 : 1);
                            nearestEnemy.health -= damage;
                            unit.attackCooldown = 1;
                            
                            // Visual feedback
                            createProjectile(unit, nearestEnemy, damage);
                        }
                        unit.state = 'fighting';
                    }
                    
                    unit.target = nearestEnemy;
                } else if (unit.targetX !== undefined && unit.targetZ !== undefined) {
                    // Move to target position
                    const dist = Math.hypot(unit.x - unit.targetX, unit.z - unit.targetZ);
                    
                    if (dist > 1) {
                        const speed = unit.config.speed * deltaTime;
                        const angle = Math.atan2(unit.targetZ - unit.z, unit.targetX - unit.x);
                        unit.x += Math.cos(angle) * speed;
                        unit.z += Math.sin(angle) * speed;
                        unit.state = 'moving';
                    } else {
                        unit.targetX = undefined;
                        unit.targetZ = undefined;
                        unit.state = 'idle';
                    }
                } else {
                    unit.state = 'idle';
                }
                
                // Update mesh
                const mesh = unitMeshes.find(m => m.userData.unit === unit);
                if (mesh) {
                    mesh.position.x = unit.x;
                    mesh.position.z = unit.z;
                    
                    // Face movement direction
                    if (unit.target) {
                        mesh.lookAt(unit.target.x, 0, unit.target.z);
                    } else if (unit.targetX !== undefined) {
                        mesh.lookAt(unit.targetX, 0, unit.targetZ);
                    }
                }
            });
            
            // Enemy logic
            gameState.enemies.forEach((enemy, index) => {
                // Find nearest player unit or building
                let target = null;
                let nearestDist = Infinity;
                
                // Check player units
                [...gameState.soldiers, ...gameState.workers].forEach(unit => {
                    const dist = Math.hypot(enemy.x - unit.x, enemy.z - unit.z);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        target = unit;
                    }
                });
                
                // Check buildings
                gameState.buildings.forEach(building => {
                    const dist = Math.hypot(enemy.x - building.x, enemy.z - building.z);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        target = building;
                    }
                });
                
                if (target) {
                    const attackRange = enemy.range || 1;
                    
                    if (nearestDist < attackRange * 1.5) {
                        // Attack
                        if (!enemy.attackCooldown) enemy.attackCooldown = 0;
                        enemy.attackCooldown -= deltaTime;
                        
                        if (enemy.attackCooldown <= 0) {
                            if (target.health !== undefined) {
                                target.health -= enemy.damage;
                                enemy.attackCooldown = 1;
                            }
                        }
                    } else {
                        // Move towards target
                        const speed = enemy.speed * deltaTime;
                        const angle = Math.atan2(target.z - enemy.z, target.x - enemy.x);
                        enemy.x += Math.cos(angle) * speed;
                        enemy.z += Math.sin(angle) * speed;
                    }
                } else {
                    // Move towards player base
                    const targetX = gameState.spawnPoint.x;
                    const targetZ = gameState.spawnPoint.z;
                    const angle = Math.atan2(targetZ - enemy.z, targetX - enemy.x);
                    enemy.x += Math.cos(angle) * enemy.speed * deltaTime;
                    enemy.z += Math.sin(angle) * enemy.speed * deltaTime;
                }
                
                // Update mesh
                const mesh = enemyMeshes.find(m => m.userData.unit === enemy);
                if (mesh) {
                    mesh.position.x = enemy.x;
                    mesh.position.z = enemy.z;
                    mesh.lookAt(target ? target.x : gameState.spawnPoint.x, 0, target ? target.z : gameState.spawnPoint.z);
                }
            });
            
            // Remove dead enemies
            gameState.enemies = gameState.enemies.filter(enemy => {
                if (enemy.health <= 0) {
                    // Give rewards
                    const rewards = CONFIG.ENEMIES[enemy.type.toUpperCase()]?.reward || { gold: 10 };
                    gameState.resources.gold += rewards.gold || 0;
                    gameState.resources.wood += rewards.wood || 0;
                    gameState.resources.stone += rewards.stone || 0;
                    
                    // Remove mesh
                    const meshIndex = enemyMeshes.findIndex(m => m.userData.unit === enemy);
                    if (meshIndex !== -1) {
                        scene.remove(enemyMeshes[meshIndex]);
                        enemyMeshes.splice(meshIndex, 1);
                    }
                    
                    showNotification(`Enemy ${enemy.name} defeated! +${rewards.gold || 0} gold`, 'success');
                    return false;
                }
                return true;
            });
            
            // Check for player unit deaths
            gameState.soldiers = gameState.soldiers.filter(unit => {
                if (unit.health <= 0) {
                    gameState.population -= unit.config.population;
                    
                    const meshIndex = unitMeshes.findIndex(m => m.userData.unit === unit);
                    if (meshIndex !== -1) {
                        scene.remove(unitMeshes[meshIndex]);
                        unitMeshes.splice(meshIndex, 1);
                    }
                    
                    // Remove from selection
                    const selIndex = gameState.selectedUnits.indexOf(unit);
                    if (selIndex !== -1) {
                        gameState.selectedUnits.splice(selIndex, 1);
                    }
                    
                    return false;
                }
                return true;
            });
            
            // Check for building destruction
            gameState.buildings = gameState.buildings.filter(building => {
                if (building.health <= 0) {
                    const meshIndex = buildingMeshes.findIndex(m => m.userData.building === building);
                    if (meshIndex !== -1) {
                        scene.remove(buildingMeshes[meshIndex]);
                        buildingMeshes.splice(meshIndex, 1);
                    }
                    
                    if (building.type === 'TOWN_HALL') {
                        endGame(false);
                    }
                    
                    showNotification(`${CONFIG.BUILDINGS[building.type].name} destroyed!`, 'error');
                    return false;
                }
                return true;
            });
            
            // Spawn waves
            const timeSinceLastWave = gameState.gameTime % CONFIG.WAVE_INTERVAL;
            if (timeSinceLastWave < deltaTime && gameState.gameTime > deltaTime) {
                spawnWave();
            }
            
            // Check victory (defeat all enemies in final wave and destroy enemy base)
            if (gameState.enemyBase && gameState.enemyBase.health <= 0) {
                endGame(true);
            }
            
            // Check defeat
            if (gameState.buildings.length === 0) {
                endGame(false);
            }
        }
        
        function spawnWave() {
            gameState.waveNumber++;
            const waveIndex = Math.min(gameState.waveNumber - 1, CONFIG.WAVES.length - 1);
            const wave = CONFIG.WAVES[waveIndex] || CONFIG.WAVES[CONFIG.WAVES.length - 1];
            
            showNotification(`Wave ${gameState.waveNumber} incoming!`, 'error');
            
            const baseX = CONFIG.ENEMY_BASE_POSITION.x * CONFIG.TILE_SIZE;
            const baseZ = CONFIG.ENEMY_BASE_POSITION.z * CONFIG.TILE_SIZE;
            
            // Spawn enemies
            let delay = 0;
            Object.entries(wave).forEach(([type, count]) => {
                const enemyType = type.toUpperCase();
                const enemyConfig = CONFIG.ENEMIES[enemyType];
                
                if (enemyConfig) {
                    for (let i = 0; i < count; i++) {
                        setTimeout(() => {
                            const angle = Math.random() * Math.PI * 2;
                            const radius = 5 + Math.random() * 10;
                            
                            const enemy = {
                                id: Date.now() + Math.random(),
                                type: enemyType.toLowerCase(),
                                name: enemyConfig.name,
                                x: baseX + Math.cos(angle) * radius,
                                z: baseZ + Math.sin(angle) * radius,
                                health: enemyConfig.health,
                                maxHealth: enemyConfig.health,
                                damage: enemyConfig.damage,
                                speed: enemyConfig.speed,
                                range: 1
                            };
                            
                            gameState.enemies.push(enemy);
                            createUnitMesh(enemy, true);
                        }, delay * 500);
                        delay++;
                    }
                }
            });
        }
        
        function createProjectile(source, target, damage) {
            // Simple visual - just a flash
            const flash = new THREE.PointLight(0xFFFF00, 1, 5);
            flash.position.set(target.x, 2, target.z);
            scene.add(flash);
            
            setTimeout(() => {
                scene.remove(flash);
            }, 100);
        }
        
        function endGame(victory) {
            if (gameState.victory || gameState.defeat) return;
            
            if (victory) {
                gameState.victory = true;
                document.getElementById('gameOverTitle').textContent = 'Victory!';
                document.getElementById('gameOverTitle').className = 'game-title text-4xl mb-4 text-yellow-400';
                document.getElementById('gameOverText').textContent = `You defended Aetherheim for ${gameState.dayNumber} days!`;
            } else {
                gameState.defeat = true;
                document.getElementById('gameOverTitle').textContent = 'Defeat';
                document.getElementById('gameOverTitle').className = 'game-title text-4xl mb-4 text-red-400';
                document.getElementById('gameOverText').textContent = 'Your kingdom has fallen...';
            }
            
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }
        
        function restartGame() {
            location.reload();
        }
        
        // ==================== FORMATION BUTTONS ====================
        document.querySelectorAll('.formation-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.formation-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameState.formation = btn.dataset.formation;
            });
        });
        
        // ==================== WINDOW RESIZE ====================
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // ==================== ANIMATION LOOP ====================
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min(clock.getDelta(), 0.1);
            
            updateGameLogic(deltaTime);
            updateCamera();
            updateResourceDisplay();
            updateDayNightDisplay();
            updateWaveDisplay();
            updateMinimap();
            
            // Update UI panels
            populateBuildingPanel();
            populateUnitPanel();
            populateResearchPanel();
            
            // Animate resource nodes
            const time = clock.getElapsedTime();
            nodeMeshes.forEach((mesh, i) => {
                mesh.rotation.y = time * 0.5;
                mesh.position.y = 1 + Math.sin(time * 2 + i) * 0.2;
            });
            
            // Animate water
            if (waterMesh) {
                waterMesh.position.y = -1 + Math.sin(time * 0.5) * 0.1;
            }
            
            renderer.render(scene, camera);
        }
        
        // ==================== INITIALIZATION ====================
        function init() {
            // Update loading progress
            const progress = document.getElementById('loadingProgress');
            progress.style.width = '20%';
            
            setTimeout(() => {
                progress.style.width = '50%';
                initThreeJS();
                
                setTimeout(() => {
                    progress.style.width = '80%';
                    initMinimap();
                    
                    setTimeout(() => {
                        progress.style.width = '100%';
                        setTimeout(() => {
                            document.getElementById('loadingScreen').style.display = 'none';
                            animate();
                        }, 300);
                    }, 200);
                }, 200);
            }, 200);
        }
        
        // Start game when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
