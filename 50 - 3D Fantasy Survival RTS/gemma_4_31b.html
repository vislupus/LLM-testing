<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria: The Last Bastion</title>
    <style>
        :root {
            --primary: #ffd700;
            --accent: #ff4500;
            --bg-dark: #1a1a2e;
            --ui-panel: rgba(26, 26, 46, 0.85);
            --text-light: #e0e0e0;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #000; font-family: var(--font-main);
            user-select: none;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; color: var(--text-light);
        }

        .panel {
            position: absolute; pointer-events: auto;
            background: var(--ui-panel);
            border: 2px solid var(--primary);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #resource-bar {
            top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 25px; padding: 10px 30px;
            font-weight: bold; font-size: 1.2rem; align-items: center;
        }

        .res-item { display: flex; align-items: center; gap: 8px; }
        .res-gold { color: #ffd700; }
        .res-essence { color: #00f2ff; }
        .res-wood { color: #a0522d; }

        #build-menu {
            bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; padding: 15px;
        }

        .build-btn {
            width: 70px; height: 70px; background: #2d2d44;
            border: 2px solid #444; border-radius: 8px;
            cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 0.7rem; color: white;
            text-align: center;
        }
        .build-btn:hover { background: #3d3d5c; border-color: var(--primary); transform: translateY(-5px); }
        .build-btn.active { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .build-btn img { width: 30px; height: 30px; margin-bottom: 5px; }

        #game-info {
            top: 20px; right: 20px; text-align: right;
            padding: 10px 20px; pointer-events: none;
        }

        #day-night-cycle {
            font-size: 1.5rem; font-weight: bold; text-transform: uppercase;
            letter-spacing: 2px; color: var(--primary);
        }

        #notification {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            font-size: 1.8rem; font-weight: bold; color: white;
            text-shadow: 0 0 10px rgba(0,0,0,1); opacity: 0; transition: 0.5s;
        }

        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; pointer-events: auto;
        }

        .btn-restart {
            padding: 15px 40px; font-size: 1.5rem; background: var(--primary);
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        #tutorial {
            position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 5px 20px; border-radius: 20px;
            font-size: 0.9rem; color: #ccc;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="resource-bar" class="panel">
            <div class="res-item res-gold">Gold: <span id="gold-val">500</span></div>
            <div class="res-item res-essence">Essence: <span id="essence-val">0</span></div>
            <div class="res-item res-wood">Wood: <span id="wood-val">200</span></div>
            <div style="margin-left: 20px; color: #fff;">Pop: <span id="pop-val">0/20</span></div>
        </div>

        <div id="game-info">
            <div id="day-night-cycle">Day 1 - Dawn</div>
            <div id="wave-timer">Next Wave: 60s</div>
        </div>

        <div id="tutorial">Left Click: Select/Build | Right Click: Move Units</div>

        <div id="build-menu" class="panel">
            <div class="build-btn" onclick="setBuildMode('worker')" title="Worker (50G)">
                <div style="font-size:20px">👷</div>Worker<br>50G
            </div>
            <div class="build-btn" onclick="setBuildMode('militia')" title="Militia (100G)">
                <div style="font-size:20px">⚔️</div>Militia<br>100G
            </div>
            <div class="build-btn" onclick="setBuildMode('archer')" title="Archer (150G)">
                <div style="font-size:20px">🏹</div>Archer<br>150G
            </div>
            <div class="build-btn" onclick="setBuildMode('tower')" title="Watchtower (200W, 100G)">
                <div style="font-size:20px">🏰</div>Tower<br>200W
            </div>
            <div class="build-btn" onclick="setBuildMode('mine')" title="Essence Mine (150W)">
                <div style="font-size:20px">💎</div>Mine<br>150W
            </div>
        </div>

        <div id="notification">WAVE APPROACHING!</div>

        <div id="game-over">
            <h1 style="font-size: 4rem; color: var(--accent);">KINGDOM FALLEN</h1>
            <p style="font-size: 1.5rem; margin-bottom: 30px;">The void has consumed your bastion.</p>
            <button class="btn-restart" onclick="location.reload()">RECLAIM THE LAND</button>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

    <script>
        /** 
         * GAME CONFIGURATION 
         */
        const CONFIG = {
            MAP_SIZE: 100,
            DAY_DURATION: 30, // seconds
            NIGHT_DURATION: 45,
            STARTING_RESOURCES: { gold: 500, essence: 0, wood: 300 },
            BUILDINGS: {
                core: { health: 2000, color: 0xffd700 },
                tower: { costG: 100, costW: 200, health: 500, damage: 15, range: 15, color: 0x888888 },
                mine: { costG: 0, costW: 150, health: 300, color: 0x00f2ff },
            },
            UNITS: {
                worker: { costG: 50, health: 50, damage: 2, range: 1, speed: 0.15, color: 0xdeb887 },
                militia: { costG: 100, health: 150, damage: 10, range: 1.5, speed: 0.12, color: 0x3498db },
                archer: { costG: 150, health: 80, damage: 8, range: 12, speed: 0.1, color: 0x2ecc71 },
                enemy: { health: 100, damage: 5, range: 1.2, speed: 0.08, color: 0x8e44ad }
            }
        };

        /**
         * GLOBAL STATE
         */
        let state = {
            resources: { ...CONFIG.STARTING_RESOURCES },
            population: 0,
            maxPop: 20,
            day: 1,
            isDay: true,
            timer: CONFIG.DAY_DURATION,
            buildMode: null,
            selectedUnits: [],
            entities: [],
            enemies: [],
            buildings: [],
            gameActive: true
        };

        /**
         * THREE.JS SETUP
         */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(60, 60, 60);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -70;
        sunLight.shadow.camera.right = 70;
        sunLight.shadow.camera.top = 70;
        sunLight.shadow.camera.bottom = -70;
        scene.add(sunLight);

        /**
         * PROCEDURAL ASSETS
         */
        const createStylizedCube = (w, h, d, color) => {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            return new THREE.Mesh(geo, mat);
        };

        const createUnitMesh = (color) => {
            const group = new THREE.Group();
            const body = createStylizedCube(0.8, 1.2, 0.8, color);
            body.position.y = 0.6;
            body.castShadow = true;
            group.add(body);
            
            const head = createStylizedCube(0.5, 0.5, 0.5, 0xffdbac);
            head.position.y = 1.4;
            group.add(head);
            
            return group;
        };

        /**
         * TERRAIN
         */
        const createTerrain = () => {
            const geo = new THREE.PlaneGeometry(CONFIG.MAP_SIZE, CONFIG.MAP_SIZE, 32, 32);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                // Create some low-poly organic feel
                const z = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 2;
                pos.setZ(i, z);
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: 0x7cfc00, flatShading: true });
            const terrain = new THREE.Mesh(geo, mat);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);

            // Water around the island
            const waterGeo = new THREE.PlaneGeometry(200, 200);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x0077be, transparent: true, opacity: 0.6 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -1;
            scene.add(water);
        };
        createTerrain();

        /**
         * GAME ENTITY CLASSES
         */
        class Entity {
            constructor(x, z, type, data) {
                this.type = type;
                this.hp = data.health;
                this.maxHp = data.health;
                this.damage = data.damage || 0;
                this.range = data.range || 0;
                this.speed = data.speed || 0;
                this.target = null;
                this.lastAttack = 0;

                this.mesh = createUnitMesh(data.color);
                this.mesh.position.set(x, 0, z);
                scene.add(this.mesh);
            }

            update(delta) {
                if (this.target) {
                    const dist = this.mesh.position.distanceTo(this.target.mesh.position);
                    if (dist > this.range) {
                        const dir = new THREE.Vector3().subVectors(this.target.mesh.position, this.mesh.position).normalize();
                        this.mesh.position.add(dir.multiplyScalar(this.speed));
                        this.mesh.lookAt(this.target.mesh.position);
                    } else {
                        this.attack();
                    }
                }
            }

            attack() {
                const now = Date.now();
                if (now - this.lastAttack > 1000) {
                    this.target.takeDamage(this.damage);
                    this.lastAttack = now;
                    spawnHitParticle(this.target.mesh.position);
                }
            }

            takeDamage(amt) {
                this.hp -= amt;
                if (this.hp <= 0) this.die();
            }

            die() {
                scene.remove(this.mesh);
                state.entities = state.entities.filter(e => e !== this);
                if (this.type === 'enemy') state.enemies = state.enemies.filter(e => e !== this);
                if (this.type === 'worker' || this.type === 'militia' || this.type === 'archer') {
                    state.population--;
                    updateUI();
                }
            }
        }

        class Building {
            constructor(x, z, type, data) {
                this.type = type;
                this.hp = data.health;
                this.maxHp = data.health;
                this.damage = data.damage || 0;
                this.range = data.range || 0;
                this.lastAttack = 0;

                this.mesh = createStylizedCube(3, 3, 3, data.color);
                this.mesh.position.set(x, 1.5, z);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                scene.add(this.mesh);
            }

            update() {
                if (this.damage > 0) {
                    const target = this.findNearestEnemy();
                    if (target && this.mesh.position.distanceTo(target.mesh.position) < this.range) {
                        const now = Date.now();
                        if (now - this.lastAttack > 1000) {
                            target.takeDamage(this.damage);
                            this.lastAttack = now;
                            spawnHitParticle(target.mesh.position);
                        }
                    }
                }
            }

            findNearestEnemy() {
                let nearest = null;
                let minDist = Infinity;
                state.enemies.forEach(e => {
                    const d = this.mesh.position.distanceTo(e.mesh.position);
                    if (d < minDist) {
                        minDist = d;
                        nearest = e;
                    }
                });
                return nearest;
            }

            takeDamage(amt) {
                this.hp -= amt;
                if (this.hp <= 0) {
                    if (this.type === 'core') endGame();
                    scene.remove(this.mesh);
                    state.buildings = state.buildings.filter(b => b !== this);
                }
            }
        }

        /**
         * CORE GAME LOGIC
         */
        const coreBuilding = new Building(0, 0, 'core', CONFIG.BUILDINGS.core);
        state.buildings.push(coreBuilding);

        function setBuildMode(mode) {
            state.buildMode = mode;
            document.querySelectorAll('.build-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function spawnHitParticle(pos) {
            const pGeo = new THREE.SphereGeometry(0.2, 4, 4);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const p = new THREE.Mesh(pGeo, pMat);
            p.position.copy(pos);
            p.position.y += 1;
            scene.add(p);
            setTimeout(() => scene.remove(p), 200);
        }

        function spawnUnit(type, x, z) {
            const data = CONFIG.UNITS[type];
            if (state.resources.gold < data.costG) return;
            if (state.population >= state.maxPop) return;

            state.resources.gold -= data.costG;
            state.population++;
            const unit = new Entity(x, z, type, data);
            state.entities.push(unit);
            updateUI();
        }

        function spawnBuilding(type, x, z) {
            const data = CONFIG.BUILDINGS[type];
            if (state.resources.gold < (data.costG || 0) || state.resources.wood < (data.costW || 0)) return;

            state.resources.gold -= (data.costG || 0);
            state.resources.wood -= (data.costW || 0);
            const b = new Building(x, z, type, data);
            state.buildings.push(b);
            updateUI();
        }

        function spawnEnemyWave() {
            const count = 5 + (state.day * 3);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 60;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                const enemy = new Entity(x, z, 'enemy', CONFIG.UNITS.enemy);
                enemy.target = coreBuilding;
                state.enemies.push(enemy);
                state.entities.push(enemy);
            }
            showNotification("THE VOID HAS ARRIVED!");
        }

        function updateUI() {
            document.getElementById('gold-val').innerText = Math.floor(state.resources.gold);
            document.getElementById('essence-val').innerText = Math.floor(state.resources.essence);
            document.getElementById('wood-val').innerText = Math.floor(state.resources.wood);
            document.getElementById('pop-val').innerText = `${state.population}/${state.maxPop}`;
        }

        function showNotification(text) {
            const el = document.getElementById('notification');
            el.innerText = text;
            el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 3000);
        }

        function endGame() {
            state.gameActive = false;
            document.getElementById('game-over').style.display = 'flex';
        }

        /**
         * INTERACTION
         */
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', (e) => {
            if (!state.gameActive) return;
            
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                const pt = intersects[0].point;

                if (e.button === 0) { // Left Click
                    if (state.buildMode) {
                        if (state.buildMode === 'worker' || state.buildMode === 'militia' || state.buildMode === 'archer') {
                            spawnUnit(state.buildMode, pt.x, pt.z);
                        } else {
                            spawnBuilding(state.buildMode, pt.x, pt.z);
                        }
                        state.buildMode = null;
                        document.querySelectorAll('.build-btn').forEach(btn => btn.classList.remove('active'));
                    } else {
                        // Selection logic
                        state.selectedUnits = [];
                        state.entities.forEach(ent => {
                            if (ent.type !== 'enemy' && ent.mesh.position.distanceTo(pt) < 3) {
                                state.selectedUnits.push(ent);
                            }
                        });
                    }
                } else if (e.button === 2) { // Right Click
                    state.selectedUnits.forEach(unit => {
                        unit.target = null; // Move to position
                        const targetPos = { mesh: { position: new THREE.Vector3(pt.x, 0, pt.z) } };
                        unit.target = targetPos;
                    });
                }
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        /**
         * MAIN GAME LOOP
         */
        function gameLoop() {
            if (!state.gameActive) return;
            requestAnimationFrame(gameLoop);

            const delta = 0.1;
            
            // Day/Night Logic
            state.timer -= 1/60;
            if (state.timer <= 0) {
                state.isDay = !state.isDay;
                state.timer = state.isDay ? CONFIG.DAY_DURATION : CONFIG.NIGHT_DURATION;
                if (!state.isDay) spawnEnemyWave();
                if (state.isDay) state.day++;
                
                // Lighting Shift
                const lightColor = state.isDay ? 0x87ceeb : 0x1a1a2e;
                scene.background.set(lightColor);
                sunLight.intensity = state.isDay ? 1.0 : 0.2;
                document.getElementById('day-night-cycle').innerText = `${state.isDay ? 'Day' : 'Night'} ${state.day}`;
            }
            document.getElementById('wave-timer').innerText = `Next Phase: ${Math.ceil(state.timer)}s`;

            // Resource Gen
            if (state.isDay) {
                state.resources.gold += 0.05;
                state.resources.wood += 0.02;
                state.buildings.forEach(b => {
                    if (b.type === 'mine') state.resources.essence += 0.01;
                });
                updateUI();
            }

            // Update Entities
            state.entities.forEach(ent => {
                // AI for enemies: attack nearest building or unit
                if (ent.type === 'enemy') {
                    let nearest = coreBuilding;
                    let minDist = ent.mesh.position.distanceTo(coreBuilding.mesh.position);
                    
                    state.buildings.forEach(b => {
                        const d = ent.mesh.position.distanceTo(b.mesh.position);
                        if (d < minDist) { minDist = d; nearest = b; }
                    });
                    
                    state.entities.forEach(u => {
                        if (u.type !== 'enemy') {
                            const d = ent.mesh.position.distanceTo(u.mesh.position);
                            if (d < minDist) { minDist = d; nearest = u; }
                        }
                    });
                    ent.target = nearest;
                }
                ent.update(delta);
            });

            // Units that aren't targeted by enemies but are militia/archers should search for enemies
            state.entities.forEach(u => {
                if (u.type === 'militia' || u.type === 'archer') {
                    if (!u.target || u.target.type === 'position') {
                        let nearestEnemy = null;
                        let minDist = 20;
                        state.enemies.forEach(e => {
                            const d = u.mesh.position.distanceTo(e.mesh.position);
                            if (d < minDist) { minDist = d; nearestEnemy = e; }
                        });
                        if (nearestEnemy) u.target = nearestEnemy;
                    }
                }
            });

            state.buildings.forEach(b => b.update());

            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        createTerrain();
        updateUI();
        gameLoop();

    </script>
</body>
</html>
