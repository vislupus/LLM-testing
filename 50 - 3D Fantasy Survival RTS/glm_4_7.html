<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kingdom of Shadows: Survival RTS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap');

        :root {
            --color-ui-bg: rgba(20, 25, 30, 0.85);
            --color-ui-border: #b8860b;
            --color-ui-text: #e0e0e0;
            --color-highlight: #ffd700;
            --color-danger: #ff4d4d;
            --color-success: #4dff88;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Lato', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas where needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: auto;
        }

        .resource-group {
            display: flex;
            gap: 20px;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-ui-text);
            font-size: 18px;
            font-weight: 700;
            text-shadow: 1px 1px 2px black;
        }

        .resource-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .game-info {
            text-align: right;
        }

        .day-counter {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--color-ui-text);
        }

        /* Bottom Action Bar */
        .action-bar {
            pointer-events: auto;
            background: var(--color-ui-bg);
            border-top: 2px solid var(--color-ui-border);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #555;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }

        .action-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--color-highlight);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-btn .cost {
            font-size: 10px;
            color: #ccc;
        }

        .action-btn .name {
            font-size: 12px;
            font-weight: bold;
        }

        .action-btn.selected {
            background: rgba(184, 134, 11, 0.3);
            border-color: var(--color-highlight);
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.4);
        }

        /* Notification Area */
        #notifications {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: none;
        }

        .toast {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #666;
            animation: fadeOut 3s forwards;
            font-family: 'Cinzel', serif;
        }

        @keyframes fadeOut {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* Menus */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 64px;
            color: var(--color-highlight);
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .btn-primary {
            background: linear-gradient(180deg, #444, #222);
            color: white;
            border: 2px solid var(--color-highlight);
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-primary:hover {
            background: linear-gradient(180deg, #555, #333);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.6);
        }

        .instructions {
            color: #aaa;
            margin-top: 20px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }

        /* Selection Ring */
        #selection-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="selection-ring"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="resource-group">
                <div class="resource-item" style="color: #ffd700;">
                    <div class="resource-icon" style="background: #ffd700;"></div>
                    <span id="res-gold">0</span>
                </div>
                <div class="resource-item" style="color: #8b4513;">
                    <div class="resource-icon" style="background: #8b4513;"></div>
                    <span id="res-wood">0</span>
                </div>
                <div class="resource-item" style="color: #ffffff;">
                    <div class="resource-icon" style="background: white;"></div>
                    <span id="res-pop">0/10</span>
                </div>
            </div>
            <div class="game-info">
                <div class="day-counter">Day <span id="day-count">1</span></div>
                <div style="font-size: 12px; color: #888;">Wave: <span id="wave-count">1</span></div>
            </div>
        </div>

        <div id="notifications"></div>

        <div class="action-bar" id="action-bar">
            <div class="action-btn" id="btn-worker" onclick="game.spawnWorker()">
                <span class="name">Worker</span>
                <span class="cost">50g</span>
            </div>
            <div class="action-btn" id="btn-sword" onclick="game.spawnUnit('melee')">
                <span class="name">Guard</span>
                <span class="cost">80g</span>
            </div>
            <div class="action-btn" id="btn-archer" onclick="game.spawnUnit('archer')">
                <span class="name">Archer</span>
                <span class="cost">120g</span>
            </div>
            <div class="action-btn" id="btn-barracks" onclick="game.startBuilding('barracks')">
                <span class="name">Barracks</span>
                <span class="cost">150g 50w</span>
            </div>
            <div class="action-btn" id="btn-tower" onclick="game.startBuilding('tower')">
                <span class="name">Tower</span>
                <span class="cost">200g 100w</span>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="modal">
        <h1>Kingdom of Shadows</h1>
        <button class="btn-primary" onclick="startGame()">Enter the Realm</button>
        <div class="instructions">
            <p>Defend your territory against the Shadow Horde.</p>
            <p>Click <b>Units</b> to select them. Right-click to move or attack.</p>
            <p>Build Barracks and Towers to defend. Gather Gold and Wood.</p>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="modal hidden">
        <h1 id="game-over-title">Victory!</h1>
        <p id="game-over-msg" style="color:white; font-size: 20px; margin-bottom: 30px;"></p>
        <button class="btn-primary" onclick="location.reload()">Play Again</button>
    </div>

    <!-- Scripts -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Game Constants & Config ---
        const COLORS = {
            grass: 0x2d4c1e,
            grassDark: 0x1e3212,
            water: 0x3b82f6,
            player: 0x4a90e2,
            playerDark: 0x1e3c72,
            enemy: 0xff3333,
            enemyDark: 0x7a0000,
            gold: 0xffd700,
            wood: 0x8b4513,
            selection: 0xffffff
        };

        const CONFIG = {
            worldSize: 200,
            unitSpeed: 0.15,
            gatherDistance: 3,
            baseRadius: 12,
            visionRadius: 60,
            dayDuration: 120 // frames (approx 2 seconds at 60fps)
        };

        // --- Helper Functions ---
        const showToast = (msg) => {
            const container = document.getElementById('notifications');
            const el = document.createElement('div');
            el.className = 'toast';
            el.innerText = msg;
            container.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        };

        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Classes ---

        class Particle {
            constructor(scene, pos, color, speed, life) {
                this.mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.3, 0.3),
                    new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1, side: THREE.DoubleSide })
                );
                this.mesh.position.copy(pos);
                this.mesh.position.y += 0.5;
                this.mesh.rotation.x = -Math.PI / 2;
                
                this.velocity = new THREE.Vector3(rand(-1,1), rand(0,1), rand(-1,1)).normalize().multiplyScalar(speed);
                this.life = life;
                this.scene = scene;
                scene.add(this.mesh);
            }

            update() {
                this.mesh.position.add(this.velocity);
                this.mesh.material.opacity -= 0.02;
                this.mesh.scale.multiplyScalar(0.95);
                this.life--;
                return this.life > 0;
            }

            dispose() {
                this.scene.remove(this.mesh);
                this.mesh.geometry.dispose();
                this.mesh.material.dispose();
            }
        }

        class Entity {
            constructor(scene, type, team) {
                this.scene = scene;
                this.type = type;
                this.team = team; // 'player' or 'enemy'
                this.id = Math.random().toString(36).substr(2, 9);
                this.selected = false;
                this.dead = false;
                this.health = 100;
                this.maxHealth = 100;
                this.mesh = null;
                this.glow = null;
                this.range = 2;
                this.attackDmg = 5;
                this.attackSpeed = 30; // frames
                this.attackTimer = 0;
                this.target = null;
                this.targetPos = new THREE.Vector3();
                this.state = 'idle'; // idle, move, gather, attack
                this.carryResource = null; // { type: 'gold', amount: 0 }
                
                this.createMesh();
                this.updateGlow();
            }

            createMesh() {
                // To be overridden
            }

            updateGlow() {
                if (this.glow) this.scene.remove(this.glow);
                if (this.team === 'player') {
                    this.glow = new THREE.Mesh(
                        new THREE.SphereGeometry(this.range + 0.5, 16, 16),
                        new THREE.MeshBasicMaterial({ color: 0x4a90e2, transparent: true, opacity: 0.2, wireframe: true })
                    );
                } else {
                    this.glow = new THREE.Mesh(
                        new THREE.SphereGeometry(this.range + 0.5, 16, 16),
                        new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.2, wireframe: true })
                    );
                }
                this.glow.visible = false;
                this.scene.add(this.glow);
            }

            moveTo(target, range = 0) {
                this.targetPos.copy(target);
                this.targetPos.y = 0; // Keep on ground
                this.range = range;
                this.state = 'move';
                this.target = null;
            }

            takeDamage(amount) {
                this.health -= amount;
                if (this.health <= 0 && !this.dead) {
                    this.die();
                }
            }

            die() {
                this.dead = true;
                this.scene.remove(this.mesh);
                if (this.glow) this.scene.remove(this.glow);
                // Spawn particles
                for(let i=0; i<8; i++) {
                    game.particles.push(new Particle(game.scene, this.mesh.position, this.team === 'player' ? COLORS.player : COLORS.enemy, 0.1, 30));
                }
            }

            updateAI() {
                // To be overridden
            }

            update(dt) {
                if (this.dead) return;

                // Update Attack Timer
                if (this.attackTimer > 0) this.attackTimer--;

                // Visual Selection Glow
                this.glow.visible = this.selected;
                this.glow.position.copy(this.mesh.position);
                if (this.glow) this.glow.position.y = 1;

                // State Machine
                if (this.state === 'move') {
                    const dist = this.mesh.position.distanceTo(this.targetPos);
                    if (dist < 0.1) {
                        this.state = 'idle';
                    } else {
                        this.moveTowards(this.targetPos);
                    }
                } else if (this.state === 'attack') {
                    if (!this.target || this.target.dead) {
                        this.state = 'idle';
                        this.target = null;
                    } else {
                        const dist = this.mesh.position.distanceTo(this.target.mesh.position);
                        if (dist > this.range) {
                            this.moveTowards(this.target.mesh.position);
                        } else {
                            // Attack logic
                            if (this.attackTimer <= 0) {
                                this.performAttack(this.target);
                                this.attackTimer = this.attackSpeed;
                            }
                        }
                    }
                } else if (this.state === 'gather') {
                    if (!this.target || this.target.dead) {
                        this.state = 'idle';
                        this.target = null;
                    } else {
                        const dist = this.mesh.position.distanceTo(this.target.mesh.position);
                        if (dist > CONFIG.gatherDistance) {
                            this.moveTowards(this.target.mesh.position);
                        } else {
                            if (this.attackTimer <= 0) {
                                this.performGather();
                                this.attackTimer = this.attackSpeed;
                            }
                        }
                    }
                }
            }

            moveTowards(pos) {
                const dir = new THREE.Vector3().subVectors(pos, this.mesh.position).normalize();
                dir.y = 0;
                this.mesh.position.add(dir.multiplyScalar(CONFIG.unitSpeed));
                
                // Simple rotation
                const targetAngle = Math.atan2(dir.x, dir.z);
                const currentAngle = this.mesh.rotation.y;
                // Smooth rotation
                let diff = targetAngle - currentAngle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.mesh.rotation.y += diff * 0.1;
            }

            performAttack(targetEntity) {
                targetEntity.takeDamage(this.attackDmg);
                // Visual recoil
                this.mesh.position.z += 0.2;
                setTimeout(() => { if(!this.dead) this.mesh.position.z -= 0.2; }, 100);
            }

            performGather() {
                if (this.carryResource && this.carryResource.amount >= 10) {
                    // Return to base
                    const base = game.buildings.find(b => b.type === 'town_center' && b.team === this.team);
                    if (base) {
                        this.carryResource.amount = 0;
                        this.moveTo(base.mesh.position);
                        this.state = 'move';
                    }
                } else if (this.target && this.target.resourceAmount > 0) {
                    const gatherAmount = 2; // Amount per hit
                    this.target.resourceAmount -= gatherAmount;
                    this.carryResource = { type: this.target.resourceType, amount: (this.carryResource ? this.carryResource.amount : 0) + gatherAmount };
                    showToast(`+${gatherAmount} ${this.target.resourceType}`);
                }
            }
        }

        class Unit extends Entity {
            createMesh() {
                const group = new THREE.Group();
                
                // Body
                const bodyGeo = new THREE.BoxGeometry(0.8, 1, 0.8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: this.team === 'player' ? COLORS.player : COLORS.enemy });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.5;
                group.add(body);

                // Head
                const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const headMat = new THREE.MeshStandardMaterial({ color: this.team === 'player' ? 0xffccaa : 0x555555 }); // Skin tone or armor
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 1.2;
                group.add(head);

                // Weapon/Tool visual
                if (this.type === 'melee') {
                    const sword = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 0.1), new THREE.MeshStandardMaterial({color: 0xaaaaaa}));
                    sword.position.set(0.5, 1.0, 0);
                    group.add(sword);
                } else if (this.type === 'archer') {
                    const bow = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.5, 8), new THREE.MeshStandardMaterial({color: 0x8B4513}));
                    bow.rotation.x = Math.PI / 2;
                    bow.position.set(0.6, 0.8, 0);
                    group.add(bow);
                } else if (this.type === 'worker') {
                    const pick = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), new THREE.MeshStandardMaterial({color: 0x888888}));
                    pick.position.set(0.5, 0.5, 0);
                    group.add(pick);
                }

                this.mesh = group;
                this.mesh.position.set(rand(-50, 50), 0, rand(-50, 50));
                this.mesh.rotation.y = rand(0, Math.PI * 2);
                this.scene.add(this.mesh);
            }

            updateAI() {
                // Simple AI: if idle and no target, find one
                if (this.state === 'idle' && this.team === 'enemy') {
                    if (this.carryResource) {
                        // Return Gold
                        const base = game.buildings.find(b => b.type === 'town_center' && b.team === 'enemy');
                        if (base) this.moveTo(base.mesh.position);
                        else this.carryResource = null; // No base, drop it?
                    } else {
                        // Find nearest resource or enemy
                        let target = null;
                        let minDist = 9999;

                        // Check resources
                        game.resources.forEach(r => {
                            if (r.team !== this.team && r.resourceAmount > 0) {
                                const d = this.mesh.position.distanceTo(r.mesh.position);
                                if (d < minDist) { minDist = d; target = r; }
                            }
                        });

                        // Check enemies if no resource found
                        if (!target) {
                            game.entities.forEach(e => {
                                if (e.team !== this.team && !e.dead) {
                                    const d = this.mesh.position.distanceTo(e.mesh.position);
                                    if (d < minDist) { minDist = d; target = e; }
                                }
                            });
                        }

                        if (target) {
                            this.target = target;
                            if (target.resourceType) {
                                this.state = 'gather';
                            } else {
                                this.state = 'attack';
                            }
                        } else {
                            // Wander
                            if (Math.random() < 0.02) {
                                this.moveTo(new THREE.Vector3(rand(-40, 40), 0, rand(-40, 40)));
                            }
                        }
                    }
                }
            }
        }

        class Building extends Entity {
            createMesh() {
                const group = new THREE.Group();
                let height = 2;
                let width = 2;

                if (this.type === 'town_center') {
                    height = 4;
                    width = 3;
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(width, width, height, 6), new THREE.MeshStandardMaterial({color: 0x555555}));
                    base.position.y = height/2;
                    group.add(base);
                    
                    const roof = new THREE.Mesh(new THREE.ConeGeometry(width + 1, 2, 6), new THREE.MeshStandardMaterial({color: 0x8b4513}));
                    roof.position.y = height + 1;
                    group.add(roof);
                } else if (this.type === 'barracks') {
                    height = 2.5;
                    width = 2;
                    const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, width), new THREE.MeshStandardMaterial({color: 0x666666}));
                    body.position.y = height/2;
                    group.add(body);
                    
                    const roof = new THREE.Mesh(new THREE.BoxGeometry(width+0.5, 0.5, width+0.5), new THREE.MeshStandardMaterial({color: 0x5a3a2b}));
                    roof.position.y = height + 0.25;
                    group.add(roof);
                } else if (this.type === 'tower') {
                    height = 5;
                    width = 1.5;
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(width, width*0.8, height, 8), new THREE.MeshStandardMaterial({color: 0x444444}));
                    body.position.y = height/2;
                    group.add(body);
                    
                    const top = new THREE.Mesh(new THREE.CylinderGeometry(width+0.5, width+0.5, 0.5, 8), new THREE.MeshStandardMaterial({color: 0x333333}));
                    top.position.y = height;
                    group.add(top);
                }

                this.mesh = group;
                this.mesh.position.set(rand(-50, 50), 0, rand(-50, 50));
                this.scene.add(this.mesh);
                
                // Add range indicator if tower
                if (this.type === 'tower') {
                    this.range = 15;
                    this.attackDmg = 10;
                    this.attackSpeed = 45;
                }
            }

            updateAI() {
                // Towers auto-attack
                if (this.state === 'idle' && this.type === 'tower') {
                    let target = null;
                    let minDist = this.range;
                    
                    game.entities.forEach(e => {
                        if (e.team !== this.team && !e.dead) {
                            const d = this.mesh.position.distanceTo(e.mesh.position);
                            if (d <= this.range && d < minDist) {
                                minDist = d;
                                target = e;
                            }
                        }
                    });

                    if (target) {
                        this.target = target;
                        this.state = 'attack';
                    }
                }
            }
        }

        // --- Main Game Class ---

        class Game {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x1a1a1a);
                this.scene.fog = new THREE.FogExp2(0x1a1a1a, 0.015);

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 80, 80);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('game-container').appendChild(this.renderer.domElement);

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.maxPolarAngle = Math.PI / 2.2;
                this.controls.minDistance = 20;
                this.controls.maxDistance = 150;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
                this.scene.add(ambientLight);

                this.sunLight = new THREE.DirectionalLight(0xffffff, 1);
                this.sunLight.position.set(50, 100, 50);
                this.sunLight.castShadow = true;
                this.sunLight.shadow.mapSize.width = 2048;
                this.sunLight.shadow.mapSize.height = 2048;
                this.sunLight.shadow.camera.left = -100;
                this.sunLight.shadow.camera.right = 100;
                this.sunLight.shadow.camera.top = 100;
                this.sunLight.shadow.camera.bottom = -100;
                this.scene.add(this.sunLight);

                // Game State
                this.isRunning = false;
                this.day = 1;
                this.time = 0;
                this.dayDuration = 120;
                this.wave = 1;
                this.resources = {
                    gold: 150,
                    wood: 100,
                    pop: 0,
                    maxPop: 5
                };
                this.entities = [];
                this.buildings = [];
                this.resourcesNodes = [];
                this.particles = [];
                this.selectedUnits = [];
                this.buildQueue = null;

                // Terrain
                this.createTerrain();
                
                // Player Base
                this.spawnBuilding('town_center', 'player', new THREE.Vector3(-30, 0, -30));

                // Enemy Base
                this.spawnBuilding('town_center', 'enemy', new THREE.Vector3(30, 0, 30));

                // Input
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                
                window.addEventListener('resize', () => this.onResize());
                window.addEventListener('pointerdown', (e) => this.onPointerDown(e));
                window.addEventListener('pointermove', (e) => this.onPointerMove(e));
                window.addEventListener('contextmenu', (e) => this.onRightClick(e));

                this.animate();
            }

            createTerrain() {
                // Ground
                const geometry = new THREE.CircleGeometry(150, 64);
                const material = new THREE.MeshStandardMaterial({ 
                    color: COLORS.grass, 
                    roughness: 0.8,
                    side: THREE.DoubleSide
                });
                const ground = new THREE.Mesh(geometry, material);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Grid Lines (Stylized)
                const gridHelper = new THREE.GridHelper(150, 60, 0x000000, 0x000000);
                gridHelper.position.y = 0.1;
                gridHelper.material.opacity = 0.1;
                gridHelper.material.transparent = true;
                this.scene.add(gridHelper);
            }

            spawnBuilding(type, team, pos) {
                const building = new Building(this.scene, type, team);
                building.mesh.position.copy(pos);
                building.health = 500;
                building.maxHealth = 500;
                if (type === 'town_center') {
                    building.range = 0; // Not used for gathering directly
                    if (team === 'player') {
                        this.resources.maxPop = 10;
                        this.resources.gold = 200; // Starting bonus
                    }
                }
                this.buildings.push(building);
                this.updatePop();
                return building;
            }

            spawnUnit(type, team, pos) {
                if (this.resources.gold < 50 && type === 'worker') return;
                if (this.resources.gold < 80 && type === 'melee') return;
                if (this.resources.gold < 120 && type === 'archer') return;

                if (this.resources.pop >= this.resources.maxPop) {
                    showToast("Population Limit Reached!");
                    return;
                }

                const unit = new Unit(this.scene, type, team);
                unit.health = 100;
                unit.maxHealth = 100;
                if (type === 'melee') { unit.attackDmg = 8; unit.range = 1; }
                if (type === 'archer') { unit.attackDmg = 5; unit.range = 8; }
                
                if (pos) {
                    unit.mesh.position.copy(pos);
                } else {
                    // Spawn at nearest town center
                    const base = this.buildings.find(b => b.type === 'town_center' && b.team === team);
                    if (base) {
                        const angle = Math.random() * Math.PI * 2;
                        const r = 5;
                        unit.mesh.position.set(base.mesh.position.x + Math.cos(angle)*r, 0, base.mesh.position.z + Math.sin(angle)*r);
                    } else {
                        // Fallback
                        unit.mesh.position.set(0,0,0);
                    }
                }

                this.entities.push(unit);
                this.updatePop();

                // Cost
                if (type === 'worker') this.resources.gold -= 50;
                if (type === 'melee') this.resources.gold -= 80;
                if (type === 'archer') this.resources.gold -= 120;
                
                this.updateUI();
            }

            spawnWorker() {
                if (this.resources.gold >= 50) {
                    this.spawnUnit('worker', 'player');
                } else {
                    showToast("Not enough Gold!");
                }
            }

            spawnUnit(type) {
                this.spawnUnit(type, 'player');
            }

            startBuilding(type) {
                const costs = { 'barracks': {g:150, w:50}, 'tower': {g:200, w:100} };
                const cost = costs[type];
                
                if (this.resources.gold >= cost.g && this.resources.wood >= cost.w) {
                    this.buildQueue = { type: type, cost: cost, timer: 0 };
                    showToast("Building...");
                } else {
                    showToast("Resources insufficient!");
                }
            }

            updatePop() {
                const count = this.entities.filter(e => e.team === 'player').length;
                this.resources.pop = count;
                document.getElementById('res-pop').innerText = `${count}/${this.resources.maxPop}`;
            }

            createResourceNode(type, team, pos) {
                const group = new THREE.Group();
                let geometry, material;
                
                if (type === 'gold') {
                    geometry = new THREE.DodecahedronGeometry(1.5);
                    material = new THREE.MeshStandardMaterial({ color: COLORS.gold, emissive: 0xaa8800, emissiveIntensity: 0.2 });
                    group.add(new THREE.Mesh(geometry, material));
                } else {
                    // Tree
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2), new THREE.MeshStandardMaterial({color: COLORS.wood}));
                    trunk.position.y = 1;
                    trunk.castShadow = true;
                    group.add(trunk);
                    
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), new THREE.MeshStandardMaterial({color: 0x228b22}));
                    leaves.position.y = 3;
                    leaves.castShadow = true;
                    group.add(leaves);
                }

                group.position.copy(pos);
                this.scene.add(group);

                this.resourcesNodes.push({
                    mesh: group,
                    resourceType: type,
                    resourceAmount: type === 'gold' ? 200 : 100,
                    team: team,
                    type: type
                });
            }

            // --- Interaction ---

            onPointerDown(e) {
                if (e.button !== 0) return; // Only left click
                this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                this.raycaster.setFromCamera(this.mouse, this.camera);
                
                // Check intersections with entities
                const intersects = this.raycaster.intersectObjects(this.scene.children, true);
                
                let hitUnit = null;
                let hitBuilding = null;

                for (let i = 0; i < intersects.length; i++) {
                    // Traverse up to find the entity group
                    let obj = intersects[i].object;
                    while(obj.parent && obj.parent !== this.scene) {
                        obj = obj.parent;
                    }
                    
                    // Find entity
                    if (obj.userData && obj.userData.entity) {
                        const entity = obj.userData.entity;
                        if (entity.team === 'player') {
                            hitUnit = entity;
                            break;
                        }
                    }
                    // Check if hit building mesh (simple check via position for now as mesh is group)
                    const building = this.buildings.find(b => b.mesh === obj || b.mesh === obj.parent);
                    if (building && building.team === 'player') {
                        hitBuilding = building;
                        break;
                    }
                }

                this.selectedUnits = [];
                document.getElementById('selection-ring').style.display = 'none';

                if (hitUnit) {
                    this.selectedUnits.push(hitUnit);
                    this.showSelectionRing(hitUnit.mesh.position);
                } else if (hitBuilding) {
                    // Select building (maybe show build menu here)
                    this.selectedUnits.push(hitBuilding);
                    this.showSelectionRing(hitBuilding.mesh.position);
                }
                
                // If clicking ground and not holding a build queue
                if (!hitUnit && !hitBuilding && intersects.length > 0 && intersects[0].object.geometry.type !== 'CircleGeometry') {
                    // Could select all units in area, but for simplicity just deselect
                    this.selectedUnits = [];
                    document.getElementById('selection-ring').style.display = 'none';
                }

                this.updateUI();
            }

            showSelectionRing(pos) {
                const ring = document.getElementById('selection-ring');
                ring.style.display = 'block';
                // Convert 3D pos to screen pos
                const vector = pos.clone();
                vector.project(this.camera);
                const x = (vector.x * .5 + .5) * window.innerWidth;
                const y = (-(vector.y * .5) + .5) * window.innerHeight;
                ring.style.left = `${x}px`;
                ring.style.top = `${y}px`;
            }

            onRightClick(e) {
                e.preventDefault();
                this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                this.raycaster.setFromCamera(this.mouse, this.camera);
                
                const intersects = this.raycaster.intersectObjects(this.scene.children, true);
                
                if (intersects.length > 0) {
                    let targetPos = intersects[0].point;
                    // Snap to ground y=0
                    targetPos.y = 0;

                    // Check for resources or enemies to target
                    let target = null;
                    
                    // Resources
                    this.resourcesNodes.forEach(r => {
                        if (r.mesh === intersects[0].object || r.mesh === intersects[0].object.parent) {
                            target = r;
                        }
                    });

                    // Enemies
                    this.entities.forEach(e => {
                        if (e.team === 'enemy' && !e.dead) {
                            if (e.mesh === intersects[0].object || e.mesh === intersects[0].object.parent) {
                                target = e;
                            }
                        }
                    });

                    // Buildings (Enemy)
                    this.buildings.forEach(b => {
                        if (b.team === 'enemy' && !b.dead) {
                            if (b.mesh === intersects[0].object || b.mesh === intersects[0].object.parent) {
                                target = b;
                            }
                        }
                    });

                    if (target) {
                        this.selectedUnits.forEach(unit => {
                            unit.moveTo(target.mesh.position, unit.range);
                            if (target.resourceType) unit.state = 'gather';
                            else unit.state = 'attack';
                            unit.target = target;
                        });
                    } else {
                        // Move command
                        this.selectedUnits.forEach(unit => {
                            unit.moveTo(targetPos);
                            unit.target = null;
                            unit.state = 'move';
                        });
                    }
                }
            }

            onPointerMove(e) {
                // For highlighting or hover effects if needed
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // --- Logic ---

            updateEntities() {
                // Clean up dead
                this.entities = this.entities.filter(e => !e.dead);
                this.buildings = this.buildings.filter(e => !e.dead);
                this.resourcesNodes = this.resourcesNodes.filter(e => e.resourceAmount > 0);
                
                // Update All
                this.entities.forEach(e => e.updateAI());
                this.entities.forEach(e => e.update());
                this.buildings.forEach(e => e.updateAI());
                this.buildings.forEach(e => e.update());

                // Resource Auto-gain (Economy)
                if (this.time % 300 === 0) { // Every 5 seconds
                    this.resources.gold += 5; // Passive gold
                    this.buildings.forEach(b => {
                        if (b.type === 'town_center') b.health += 1; // Heal slowly
                    });
                    this.updateUI();
                }

                // Resource Node Regen
                if (this.time % 600 === 0) {
                    this.resourcesNodes.forEach(r => {
                        if (r.resourceAmount < (r.type === 'gold' ? 200 : 100)) {
                            r.resourceAmount += 10;
                        }
                    });
                }
            }

            updateParticles() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    if (!this.particles[i].update()) {
                        this.particles[i].dispose();
                        this.particles.splice(i, 1);
                    }
                }
            }

            updateDayNight() {
                this.time++;
                if (this.time >= this.dayDuration) {
                    this.time = 0;
                    this.day++;
                    this.wave = Math.floor(this.day / 2);
                    showToast(`Day ${this.day} - Wave ${this.wave} incoming!`);
                    this.spawnWave();
                }

                // Day/Night Cycle
                const t = this.time / this.dayDuration; // 0 to 1
                const intensity = Math.sin(t * Math.PI); // 0 to 1 to 0
                
                // Lerp colors
                const dayColor = new THREE.Color(0x87CEEB);
                const nightColor = new THREE.Color(0x0a0a20);
                
                this.sunLight.intensity = 0.5 + (intensity * 0.8);
                this.scene.background.lerpColors(nightColor, dayColor, intensity);
                this.scene.fog.color.copy(this.scene.background);
            }

            spawnWave() {
                const count = 3 + (this.wave * 2);
                showToast(`Enemy Army Approaching!`);
                
                for(let i=0; i<count; i++) {
                    setTimeout(() => {
                        this.spawnUnit('melee', 'enemy');
                    }, i * 800);
                }
            }

            updateFogOfWar() {
                // Simple distance check for player visibility
                // In a full game, this would be a shader. Here we dim entities outside range.
                const playerBase = this.buildings.find(b => b.type === 'town_center' && b.team === 'player');
                if (!playerBase) return;

                this.entities.forEach(e => {
                    if (e.team === 'player') {
                        e.mesh.visible = true;
                        e.glow.visible = true;
                    } else {
                        const dist = e.mesh.position.distanceTo(playerBase.mesh.position);
                        e.mesh.visible = dist < CONFIG.visionRadius;
                        e.glow.visible = e.mesh.visible;
                    }
                });
                
                this.buildings.forEach(b => {
                    if (b.team === 'player') {
                        b.mesh.visible = true;
                        b.glow.visible = true;
                    } else {
                        const dist = b.mesh.position.distanceTo(playerBase.mesh.position);
                        b.mesh.visible = dist < CONFIG.visionRadius;
                        b.glow.visible = b.mesh.visible;
                    }
                });

                this.resourcesNodes.forEach(r => {
                    const dist = r.mesh.position.distanceTo(playerBase.mesh.position);
                    r.mesh.visible = dist < CONFIG.visionRadius;
                });
            }

            checkWinCondition() {
                const playerBase = this.buildings.find(b => b.type === 'town_center' && b.team === 'player');
                const enemyBase = this.buildings.find(b => b.type === 'town_center' && b.team === 'enemy');

                if (!playerBase) {
                    this.gameOver(false);
                } else if (!enemyBase) {
                    this.gameOver(true);
                }
            }

            gameOver(win) {
                this.isRunning = false;
                const screen = document.getElementById('game-over-screen');
                const title = document.getElementById('game-over-title');
                const msg = document.getElementById('game-over-msg');
                
                screen.classList.remove('hidden');
                if (win) {
                    title.innerText = "Kingdom Saved!";
                    title.style.color = "var(--color-highlight)";
                    msg.innerText = `You survived Day ${this.day} and crushed the Shadow Horde.`;
                } else {
                    title.innerText = "Defeated";
                    title.style.color = "var(--color-danger)";
                    msg.innerText = "Your kingdom has fallen to the shadows...";
                }
            }

            updateUI() {
                document.getElementById('res-gold').innerText = Math.floor(this.resources.gold);
                document.getElementById('res-wood').innerText = Math.floor(this.resources.wood);
                document.getElementById('res-pop').innerText = `${this.resources.pop}/${this.resources.maxPop}`;
                document.getElementById('day-count').innerText = this.day;
                document.getElementById('wave-count').innerText = this.wave;

                // Update buttons availability
                const buttons = [
                    { id: 'btn-worker', cost: 50 },
                    { id: 'btn-sword', cost: 80 },
                    { id: 'btn-archer', cost: 120 },
                    { id: 'btn-barracks', cost: 150 },
                    { id: 'btn-tower', cost: 200 }
                ];

                buttons.forEach(btn => {
                    const el = document.getElementById(btn.id);
                    // Simple check for gold, wood is ignored for simplicity in button state
                    if (this.resources.gold < btn.cost) el.disabled = true;
                    else el.disabled = false;
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                if (this.isRunning) {
                    this.controls.update();
                    this.updateDayNight();
                    this.updateEntities();
                    this.updateParticles();
                    this.updateFogOfWar();
                    this.checkWinCondition();

                    // Building Construction Progress
                    if (this.buildQueue) {
                        if (this.resources.wood >= this.buildQueue.cost.w && this.resources.gold >= this.buildQueue.cost.g) {
                            this.buildQueue.timer++;
                            const progress = Math.min(this.buildQueue.timer / 100, 1); // 100 frames to build
                            // Visual feedback could go here
                            if (this.buildQueue.timer >= 100) {
                                // Spawn Building
                                const base = this.buildings.find(b => b.type === 'town_center' && b.team === 'player');
                                let pos;
                                if (base) {
                                    // Find position near base
                                    const angle = Math.random() * Math.PI * 2;
                                    pos = base.mesh.position.clone().add(new THREE.Vector3(Math.cos(angle)*8, 0, Math.sin(angle)*8));
                                } else {
                                    pos = new THREE.Vector3(0,0,0);
                                }
                                
                                this.spawnBuilding(this.buildQueue.type, 'player', pos);
                                
                                // Deduct costs
                                this.resources.wood -= this.buildQueue.cost.w;
                                this.resources.gold -= this.buildQueue.cost.g;
                                
                                this.buildQueue = null;
                                showToast("Construction Complete!");
                                this.updateUI();
                            }
                        } else {
                            // Cancel if resources lost (rare)
                            this.buildQueue = null;
                        }
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize Game
        let game;
        
        window.startGame = () => {
            document.getElementById('start-screen').classList.add('hidden');
            game = new Game();
            game.isRunning = true;
            
            // Spawn initial resources
            for(let i=0; i<5; i++) {
                game.createResourceNode('gold', 'neutral', new THREE.Vector3(rand(-40, 40), 0, rand(-40, 40)));
            }
            for(let i=0; i<10; i++) {
                game.createResourceNode('wood', 'neutral', new THREE.Vector3(rand(-40, 40), 0, rand(-40, 40)));
            }
        };

    </script>
</body>
</html>
