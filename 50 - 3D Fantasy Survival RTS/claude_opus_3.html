<html> <head> <title>Luminous Lands</title> <style> body { margin: 0; } canvas { width: 100%; height: 100% } #ui { position: absolute; top: 0; left: 0; padding: 10px; color: white; } </style> </head> <body> <div id="ui"> <div>Resources: <span id="resources">0</span></div> <div>Population: <span id="population">0</span>/<span id="maxPop">5</span></div> <button id="houseBtn">Build House</button> <button id="workerBtn">Train Worker</button> <button id="soldierBtn">Train Soldier</button> <button id="towerBtn">Build Tower</button> </div> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script> // Game setup 
const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(30, 20, 30); camera.lookAt(0, 0, 0); const renderer = new THREE.WebGLRenderer(); renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement); const sunlight = new THREE.DirectionalLight(0xFFFFFF, 1.0); sunlight.position.set(20, 50, 20); scene.add(sunlight); const resources = { amount: 200, gain: 0 }; let population = 0; let maxPop = 5; const ui = { resources: document.getElementById("resources"), population: document.getElementById("population"), maxPop: document.getElementById("maxPop"), houseBtn: document.getElementById("houseBtn"), workerBtn: document.getElementById("workerBtn"), soldierBtn: document.getElementById("soldierBtn"), towerBtn: document.getElementById("towerBtn") } ui.houseBtn.onclick = () => spawnBuilding("house"); ui.workerBtn.onclick = () => spawnUnit("worker"); ui.soldierBtn.onclick = () => spawnUnit("soldier"); ui.towerBtn.onclick = () => spawnBuilding("tower"); // Terrain 
const terrainSize = 100; const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, 64, 64); const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }); for (let i = 0; i < terrainGeo.attributes.position.count; i++) { const x = terrainGeo.attributes.position.getX(i); const z = terrainGeo.attributes.position.getY(i); const height = Math.random() * 3; const color = new THREE.Color(0, height / 3, 0); terrainGeo.attributes.position.setZ(i, height); terrainGeo.attributes.color.setXYZ(i, color.r, color.g, color.b); } terrainGeo.rotateX(Math.PI * -0.5); const terrain = new THREE.Mesh(terrainGeo, terrainMat); scene.add(terrain); // Buildings 
const buildingMaterials = { house: new THREE.MeshLambertMaterial({ color: 0x8B4513 }), tower: new THREE.MeshLambertMaterial({ color: 0x696969 }) }; const buildings = new THREE.Group(); scene.add(buildings); function spawnBuilding(type) { if (type === "house") { if (resources.amount < 50) return; resources.amount -= 50; maxPop += 5; } else if (type === "tower") { if (resources.amount < 100) return; resources.amount -= 100; } const geo = new THREE.BoxGeometry(2, 2, 2); const mesh = new THREE.Mesh(geo, buildingMaterials[type]); mesh.position.set( (Math.random() - 0.5) * terrainSize * 0.5, 1, (Math.random() - 0.5) * terrainSize * 0.5 ); buildings.add(mesh); } // Units 
const unitMaterials = { worker: new THREE.MeshLambertMaterial({ color: 0xFFD700 }), soldier: new THREE.MeshLambertMaterial({ color: 0xA52A2A }) }; const units = new THREE.Group(); scene.add(units); function spawnUnit(type) { if (population >= maxPop) return; if (type === "worker") { if (resources.amount < 25) return; resources.amount -= 25; resources.gain += 0.5; } else if (type === "soldier") { if (resources.amount < 50) return; resources.amount -= 50; } population++; const geo = new THREE.ConeGeometry(0.5, 1.5, 4); const mesh = new THREE.Mesh(geo, unitMaterials[type]); mesh.position.set( (Math.random() - 0.5) * terrainSize * 0.5, 0.75, (Math.random() - 0.5) * terrainSize * 0.5 ); units.add(mesh); } // Game loop 
function animate() { requestAnimationFrame(animate); // Update resources 
resources.amount += resources.gain; ui.resources.innerText = Math.floor(resources.amount); ui.population.innerText = population; ui.maxPop.innerText = maxPop; // Simple day/night cycle 
const time = Date.now() * 0.0005; const daylight = Math.sin(time) * 0.5 + 0.5; scene.background = new THREE.Color(`hsl(${time * 360 % 360}, 100%, ${daylight * 50}%)`); sunlight.intensity = daylight; renderer.render(scene, camera); } animate(); </script> </body> </html>
