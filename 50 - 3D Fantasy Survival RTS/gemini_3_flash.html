<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldoria: Eternal Stand</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; color: white; }
        canvas { display: block; }
        .game-ui { pointer-events: none; position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
        .pointer-events-auto { pointer-events: auto; }
        .pixel-corners { border: 3px solid #3d3d4d; background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(10px); }
        .btn-action { transition: all 0.2s; border: 2px solid #5d5d7d; background: #2d2d3d; cursor: pointer; }
        .btn-action:hover { background: #4d4d6d; transform: translateY(-2px); border-color: #7d7d9d; }
        .btn-action:active { transform: translateY(0); }
        .hidden { display: none; }
        #selection-box { border: 1.5px solid #00ffcc; background: rgba(0, 255, 204, 0.15); position: absolute; pointer-events: none; display: none; }
        .map-dot { transform: translate(-50%, -50%); }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .wave-warning { animation: pulse 1s infinite; }
        .resource-val { font-variant-numeric: tabular-nums; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="selection-box"></div>
    
    <div class="game-ui">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="pixel-corners p-3 flex gap-6 text-sm">
                <div><span class="text-yellow-400">Gold:</span> <span id="res-gold" class="resource-val">0</span></div>
                <div><span class="text-amber-600">Wood:</span> <span id="res-wood" class="resource-val">0</span></div>
                <div><span class="text-slate-400">Stone:</span> <span id="res-stone" class="resource-val">0</span></div>
                <div><span class="text-red-400">Pop:</span> <span id="res-pop" class="resource-val">0/0</span></div>
            </div>
            
            <div class="text-center">
                <div class="pixel-corners p-2 px-6">
                    <div id="day-cycle" class="text-[10px] uppercase tracking-widest text-blue-300">Day 1 - Peaceful</div>
                    <div id="wave-timer" class="text-2xl font-black tabular-nums">1:00</div>
                </div>
            </div>
            
            <div class="pixel-corners p-2 flex gap-2">
                <button class="btn-action w-8 h-8 rounded flex items-center justify-center" onclick="location.reload()">🔄</button>
            </div>
        </div>

        <div class="flex flex-col items-center pointer-events-none">
            <div id="alert-msg" class="text-lg font-bold bg-black/60 px-6 py-2 rounded-full border border-white/10 opacity-0 transition-opacity duration-300">Alert</div>
        </div>

        <div class="flex justify-between items-end pointer-events-auto">
            <div class="w-64 pixel-corners p-4 min-h-[140px] flex flex-col gap-2">
                <h3 class="text-xs uppercase tracking-tighter text-gray-400 border-b border-white/10 pb-1">Kingdom Ledger</h3>
                <div id="selection-details" class="text-sm">Select units or buildings</div>
                <div id="unit-menu" class="flex gap-2 mt-auto hidden"></div>
            </div>
            
            <div class="flex gap-2 p-2 bg-black/40 rounded-t-xl border-x border-t border-white/10 backdrop-blur-md">
                <div id="build-menu" class="flex gap-2"></div>
            </div>

            <div class="w-64 pixel-corners p-1 overflow-hidden">
                <div id="mini-map" class="w-full aspect-square bg-black/80 relative rounded-sm overflow-hidden border border-white/5">
                </div>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 pointer-events-auto">
        <div class="pixel-corners p-12 text-center max-w-md border-red-900/50">
            <h1 id="game-over-title" class="text-6xl font-black text-red-600 mb-2">FALLEN</h1>
            <p id="game-over-text" class="mb-10 text-gray-400 text-lg uppercase tracking-widest">Your legacy ends here.</p>
            <button onclick="location.reload()" class="btn-action px-12 py-4 rounded-lg font-bold text-xl hover:bg-red-900 transition-colors">RECLAIM THE THRONE</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            TILE_SIZE: 2, MAP_SIZE: 60,
            STARTING: { gold: 600, wood: 400, stone: 200, pop: 0, maxPop: 15 },
            BUILDINGS: {
                house: { name: 'Cottage', cost: { gold: 60, wood: 60 }, hp: 300, pop: 5, color: 0x8b4513, roof: 0x5d2906 },
                lumberyard: { name: 'Lumberyard', cost: { gold: 120, wood: 40 }, hp: 400, color: 0x556b2f, roof: 0x2f4f4f },
                quarry: { name: 'Quarry', cost: { gold: 180, wood: 100 }, hp: 500, color: 0x708090, roof: 0x333333 },
                barracks: { name: 'Barracks', cost: { gold: 300, wood: 200, stone: 100 }, hp: 800, color: 0x8b0000, roof: 0x4a0000 },
                tower: { name: 'Tower', cost: { gold: 250, stone: 300 }, hp: 1000, color: 0x483d8b, range: 28, damage: 35 }
            },
            UNITS: {
                worker: { name: 'Worker', cost: { gold: 50 }, hp: 80, speed: 0.2, color: 0xeedd82 },
                soldier: { name: 'Footman', cost: { gold: 120, wood: 30 }, hp: 200, speed: 0.14, damage: 30, color: 0x4682b4 },
                archer: { name: 'Archer', cost: { gold: 150, wood: 80 }, hp: 120, speed: 0.16, damage: 25, range: 20, color: 0x32cd32 }
            }
        };

        class Game {
            constructor() {
                this.state = {
                    res: { ...CONFIG.STARTING }, units: [], buildings: [], nodes: [], enemies: [], particles: [],
                    selected: [], ghost: null, gameOver: false, time: 0, day: 1, isDay: true, 
                    waveTimer: 150, waveMax: 150, minimapTick: 0
                };
                this.initEngine();
                this.createWorld();
                this.spawnInitial();
                this.bindUI();
                this.loop();
            }

            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0a14);
                this.scene.fog = new THREE.FogExp2(0x0a0a14, 0.012);

                this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
                this.camera.position.set(70, 70, 70);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('game-container').appendChild(this.renderer.domElement);

                this.sun = new THREE.DirectionalLight(0xfff5e6, 1.2);
                this.sun.position.set(50, 100, 50);
                this.sun.castShadow = true;
                this.sun.shadow.mapSize.set(2048, 2048);
                this.sun.shadow.camera.left = -80; this.sun.shadow.camera.right = 80;
                this.sun.shadow.camera.top = 80; this.sun.shadow.camera.bottom = -80;
                this.scene.add(this.sun);
                this.scene.add(new THREE.AmbientLight(0x404060, 0.5));

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.maxPolarAngle = Math.PI / 2.2;
                this.controls.minDistance = 30; this.controls.maxDistance = 200;
                this.controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.PAN };

                this.ray = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.selBox = { start: new THREE.Vector2(), active: false };

                window.addEventListener('mousedown', e => this.onMouseDown(e));
                window.addEventListener('mousemove', e => this.onMouseMove(e));
                window.addEventListener('mouseup', e => this.onMouseUp(e));
                window.addEventListener('contextmenu', e => { e.preventDefault(); this.onRightClick(e); });
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            createWorld() {
                const s = CONFIG.MAP_SIZE * CONFIG.TILE_SIZE;
                const water = new THREE.Mesh(new THREE.PlaneGeometry(s*3, s*3), new THREE.MeshStandardMaterial({ color: 0x1a3c5e, opacity: 0.8, transparent: true }));
                water.rotation.x = -Math.PI/2; water.position.y = -2;
                this.scene.add(water);

                const geo = new THREE.PlaneGeometry(s, s, 100, 100);
                geo.rotateX(-Math.PI/2);
                const pos = geo.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    const x = pos[i], z = pos[i + 2], d = Math.sqrt(x*x + z*z);
                    const mask = Math.max(0, 1 - (d / (s/2)));
                    pos[i+1] = ((Math.sin(x*0.1) * Math.cos(z*0.1) * 2.5) + 0.5) * mask;
                    if (mask < 0.05) pos[i+1] = -5;
                }
                geo.computeVertexNormals();
                this.terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x3d5e3a, flatShading: true }));
                this.terrain.receiveShadow = true;
                this.scene.add(this.terrain);

                const grid = new THREE.GridHelper(s, CONFIG.MAP_SIZE, 0x000000, 0x223322);
                grid.position.y = 0.05; grid.material.opacity = 0.1; grid.material.transparent = true;
                this.scene.add(grid);

                for (let i = 0; i < 120; i++) {
                    const a = Math.random()*Math.PI*2, d = 20 + Math.random()*40;
                    const x = Math.cos(a)*d, z = Math.sin(a)*d;
                    const type = Math.random()>0.4 ? 'wood' : (Math.random()>0.5 ? 'stone' : 'gold');
                    const color = type==='wood' ? 0x228b22 : (type==='stone' ? 0x808080 : 0xffd700);
                    const m = new THREE.Mesh(type==='wood' ? new THREE.ConeGeometry(0.6, 2.5, 6) : new THREE.DodecahedronGeometry(0.6), new THREE.MeshStandardMaterial({ color, flatShading: true }));
                    m.position.set(x, type==='wood' ? 1.25 : 0.4, z); m.castShadow = true;
                    this.scene.add(m);
                    this.state.nodes.push({ type, mesh: m, amount: 600, max: 600 });
                }
            }

            spawnInitial() {
                this.placeBuilding('keep', 0, 0);
                for(let i=0; i<4; i++) this.spawnUnit('worker', (i-1.5)*5, 8);
                this.updateUI();
            }

            bindUI() {
                const bMenu = document.getElementById('build-menu');
                Object.keys(CONFIG.BUILDINGS).forEach(type => {
                    const b = CONFIG.BUILDINGS[type];
                    const btn = document.createElement('button');
                    btn.className = 'btn-action p-2 rounded text-[10px] font-bold w-20 flex flex-col items-center';
                    btn.innerHTML = `<span>${b.name}</span><span class="text-yellow-400">${b.cost.gold}G</span>`;
                    btn.onclick = () => {
                        if (this.state.ghost) this.scene.remove(this.state.ghost.mesh);
                        const m = new THREE.Mesh(new THREE.BoxGeometry(2, type==='tower'?4:2, 2), new THREE.MeshStandardMaterial({ color: b.color, transparent: true, opacity: 0.5 }));
                        this.state.ghost = { type, mesh: m };
                        this.scene.add(m);
                    };
                    bMenu.appendChild(btn);
                });
            }

            placeBuilding(type, x, z) {
                const c = CONFIG.BUILDINGS[type];
                const group = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, type==='tower'?4.5:2.2, 2.2), new THREE.MeshStandardMaterial({ color: c.color }));
                body.position.y = type==='tower' ? 2.25 : 1.1; group.add(body);
                if (c.roof) {
                    const roof = new THREE.Mesh(new THREE.ConeGeometry(2, 1.5, 4), new THREE.MeshStandardMaterial({ color: c.roof }));
                    roof.position.y = type==='tower' ? 5.25 : 2.75; roof.rotation.y = Math.PI/4; group.add(roof);
                }
                group.position.set(x, 0, z); group.castShadow = group.receiveShadow = true;
                const b = { type, mesh: group, hp: c.hp, maxHp: c.hp, id: Math.random().toString(36).substr(2,9) };
                this.state.buildings.push(b); this.scene.add(group);
                return b;
            }

            spawnUnit(type, x, z, isEnemy = false) {
                const c = isEnemy ? { color: 0x8b0000, hp: 100 + this.state.day*30, speed: 0.08 + Math.random()*0.02, damage: 20+this.state.day*5 } : CONFIG.UNITS[type];
                const g = new THREE.Group();
                const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.7, 4, 8), new THREE.MeshStandardMaterial({ color: c.color }));
                body.position.y = 0.7; g.add(body);
                if (type==='soldier') {
                    const s = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x777777 }));
                    s.position.set(0.45, 0.7, 0.2); g.add(s);
                }
                g.position.set(x, 0, z); g.castShadow = true;
                const u = { type: isEnemy?'enemy':type, mesh: g, hp: c.hp, maxHp: c.hp, speed: c.speed, isEnemy, target: null, task: null, id: Math.random().toString(36).substr(2,9) };
                if (isEnemy) this.state.enemies.push(u); else this.state.units.push(u);
                this.scene.add(g);
                return u;
            }

            onMouseDown(e) {
                if (e.button === 0) {
                    if (this.state.ghost) {
                        const b = CONFIG.BUILDINGS[this.state.ghost.type];
                        if (this.afford(b.cost)) {
                            this.deduct(b.cost);
                            this.placeBuilding(this.state.ghost.type, this.state.ghost.mesh.position.x, this.state.ghost.mesh.position.z);
                            if (b.pop) this.state.res.maxPop += b.pop;
                            this.scene.remove(this.state.ghost.mesh); this.state.ghost = null;
                            this.updateUI();
                        } else this.showAlert("Resources required!");
                        return;
                    }
                    this.selBox.active = true; this.selBox.start.set(e.clientX, e.clientY);
                    const el = document.getElementById('selection-box');
                    el.style.display = 'block'; el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px';
                    el.style.width = '0px'; el.style.height = '0px';
                }
            }

            onMouseMove(e) {
                this.mouse.set((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
                if (this.selBox.active) {
                    const el = document.getElementById('selection-box'), w = e.clientX-this.selBox.start.x, h = e.clientY-this.selBox.start.y;
                    el.style.width = Math.abs(w)+'px'; el.style.height = Math.abs(h)+'px';
                    el.style.left = (w>0 ? this.selBox.start.x : e.clientX)+'px'; el.style.top = (h>0 ? this.selBox.start.y : e.clientY)+'px';
                }
            }

            onMouseUp(e) {
                if (e.button === 0 && this.selBox.active) {
                    this.selBox.active = false; document.getElementById('selection-box').style.display = 'none';
                    if (this.selBox.start.distanceTo(new THREE.Vector2(e.clientX, e.clientY)) > 10) this.rectSel(this.selBox.start, new THREE.Vector2(e.clientX, e.clientY));
                    else this.pointSel();
                }
            }

            onRightClick(e) {
                if (this.state.selected.length === 0) return;
                this.ray.setFromCamera(this.mouse, this.camera);
                const hits = this.ray.intersectObjects([this.terrain, ...this.state.nodes.map(n=>n.mesh), ...this.state.enemies.map(en=>en.mesh)]);
                if (hits.length > 0) {
                    const hit = hits[0], node = this.state.nodes.find(n=>n.mesh===hit.object), enemy = this.state.enemies.find(en=>en.mesh===hit.object);
                    this.state.selected.forEach(u => {
                        if (u.isEnemy) return;
                        if (enemy) { u.task = { type: 'attack', target: enemy }; u.target = null; }
                        else if (u.type==='worker' && node) { u.task = { type:'harvest', node }; u.target = node.mesh.position.clone(); }
                        else { u.task = null; u.target = hit.point.clone(); }
                    });
                }
            }

            pointSel() {
                this.ray.setFromCamera(this.mouse, this.camera);
                const hits = this.ray.intersectObjects([...this.state.units.map(u=>u.mesh), ...this.state.buildings.map(b=>b.mesh)], true);
                this.state.selected = [];
                if (hits.length > 0) {
                    const obj = hits[0].object;
                    const found = this.state.units.find(u=>u.mesh===obj || u.mesh.children.includes(obj)) || this.state.buildings.find(b=>b.mesh===obj || b.mesh.children.includes(obj));
                    if (found) this.state.selected = [found];
                }
                this.updateUI();
            }

            rectSel(s, e) {
                const minX = Math.min(s.x, e.x), maxX = Math.max(s.x, e.x), minY = Math.min(s.y, e.y), maxY = Math.max(s.y, e.y);
                this.state.selected = this.state.units.filter(u => {
                    const v = u.mesh.position.clone().project(this.camera);
                    const px = (v.x+1)*window.innerWidth/2, py = -(v.y-1)*window.innerHeight/2;
                    return px>=minX && px<=maxX && py>=minY && py<=maxY;
                });
                this.updateUI();
            }

            loop() {
                requestAnimationFrame(() => this.loop());
                if (this.state.gameOver) return;
                const dt = 0.016; this.state.time += dt; this.state.waveTimer -= dt;
                this.controls.update();
                
                const mins = Math.floor(Math.max(0, this.state.waveTimer)/60), secs = Math.floor(Math.max(0, this.state.waveTimer)%60);
                document.getElementById('wave-timer').innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
                if (this.state.waveTimer <= 0) this.spawnWave();

                const cycle = this.state.time*0.05, sY = Math.sin(cycle);
                this.sun.position.set(Math.cos(cycle)*80, sY*100, Math.sin(cycle*0.5)*40);
                this.sun.intensity = Math.max(0.1, sY)*1.2;
                if (this.state.isDay !== (sY > 0)) {
                    this.state.isDay = sY > 0;
                    const dc = document.getElementById('day-cycle');
                    dc.innerText = this.state.isDay ? `Day ${this.state.day} - Peaceful` : `Night ${this.state.day} - Wave Incoming`;
                    dc.className = this.state.isDay ? 'text-[10px] uppercase tracking-widest text-blue-300' : 'text-[10px] uppercase tracking-widest text-red-500 font-bold wave-warning';
                }

                this.updateUnits(dt); this.updateEnemies(dt); this.updateBuildings(dt); this.updateParticles(dt);
                if (this.state.minimapTick++ % 60 === 0) this.updateMinimap();

                if (this.state.ghost) {
                    this.ray.setFromCamera(this.mouse, this.camera);
                    const hit = this.ray.intersectObject(this.terrain);
                    if (hit.length > 0) this.state.ghost.mesh.position.set(Math.round(hit[0].point.x/2)*2, hit[0].point.y+(this.state.ghost.type==='tower'?0:0.5), Math.round(hit[0].point.z/2)*2);
                }
                this.renderer.render(this.scene, this.camera);
            }

            updateUnits(dt) {
                this.state.units.forEach(u => {
                    if (u.task?.type==='attack') {
                        const t = u.task.target; if (t.hp<=0) { u.task = null; return; }
                        const d = u.mesh.position.distanceTo(t.mesh.position), r = (CONFIG.UNITS[u.type]?.range || 2.5);
                        if (d > r) u.target = t.mesh.position.clone();
                        else { u.target = null; this.hit(u, t, dt); }
                    }
                    if (u.target) {
                        const d = u.mesh.position.distanceTo(u.target);
                        if (d > 0.6) {
                            const dir = new THREE.Vector3().subVectors(u.target, u.mesh.position).normalize();
                            u.mesh.position.addScaledVector(dir, u.speed); u.mesh.lookAt(u.target.x, u.mesh.position.y, u.target.z);
                        } else { u.target = null; if (u.task?.type==='harvest') this.harvest(u); }
                    }
                });
            }

            updateEnemies(dt) {
                this.state.enemies = this.state.enemies.filter(e => {
                    if (e.hp <= 0) { this.scene.remove(e.mesh); return false; }
                    const t = this.findNear(e.mesh.position, [...this.state.units, ...this.state.buildings], 1000);
                    if (t) {
                        const d = e.mesh.position.distanceTo(t.mesh.position);
                        if (d > 2.5) {
                            const dir = new THREE.Vector3().subVectors(t.mesh.position, e.mesh.position).normalize();
                            e.mesh.position.addScaledVector(dir, e.speed); e.mesh.lookAt(t.mesh.position.x, e.mesh.position.y, t.mesh.position.z);
                        } else this.hit(e, t, dt);
                    }
                    return true;
                });
            }

            updateBuildings(dt) {
                this.state.buildings = this.state.buildings.filter(b => {
                    if (b.hp <= 0) { this.scene.remove(b.mesh); if (b.type==='keep') this.endGame(false); return false; }
                    if (b.type==='tower') {
                        const e = this.findNear(b.mesh.position, this.state.enemies, CONFIG.BUILDINGS.tower.range);
                        if (e) this.hit(b, e, dt);
                    }
                    return true;
                });
            }

            hit(a, t, dt) {
                const dmg = (a.isEnemy ? (20+this.state.day*5) : (CONFIG.UNITS[a.type]?.damage || CONFIG.BUILDINGS[a.type]?.damage || 25)) * dt;
                t.hp -= dmg; if (Math.random()<0.1) this.part(t.mesh.position, 0xff4444, 2);
                if (t.hp <= 0) {
                    this.part(t.mesh.position, 0x555555, 12);
                    if (this.state.selected.includes(t)) { this.state.selected = this.state.selected.filter(s=>s!==t); this.updateUI(); }
                }
            }

            harvest(u) {
                const n = u.task.node; if (n.amount > 0) {
                    const amt = 0.8; n.amount -= amt; this.state.res[n.type] += amt;
                    if (Math.random()<0.1) this.part(n.mesh.position, n.type==='wood'?0xdeb887:0xffd700, 1);
                    n.mesh.scale.setScalar(0.4 + (n.amount/n.max)*0.6);
                    if (n.amount<=0) { this.scene.remove(n.mesh); this.state.nodes = this.state.nodes.filter(node=>node!==n); u.task = null; }
                    this.updateUI();
                }
            }

            spawnWave() {
                this.state.day++; this.state.waveTimer = this.state.waveMax; this.showAlert(`Wave ${this.state.day} incoming!`);
                const c = 5 + (this.state.day*4);
                for(let i=0; i<c; i++) {
                    const a = Math.random()*Math.PI*2, d = 70+Math.random()*15;
                    this.spawnUnit(null, Math.cos(a)*d, Math.sin(a)*d, true);
                }
            }

            findNear(p, l, m) {
                let n = null, min = m;
                l.forEach(i => { const d = p.distanceTo(i.mesh.position); if (d<min) { min=d; n=i; } });
                return n;
            }

            part(p, c, count) {
                for (let i=0; i<count; i++) {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.15), new THREE.MeshBasicMaterial({ color:c }));
                    m.position.copy(p); const v = new THREE.Vector3((Math.random()-0.5)*0.3, Math.random()*0.3, (Math.random()-0.5)*0.3);
                    this.state.particles.push({ mesh:m, vel:v, life:1.0 }); this.scene.add(m);
                }
            }

            updateParticles(dt) {
                this.state.particles = this.state.particles.filter(p => {
                    p.mesh.position.add(p.vel); p.vel.y -= 0.012; p.life -= dt*1.8;
                    p.mesh.scale.setScalar(p.life); if (p.life<=0) { this.scene.remove(p.mesh); return false; }
                    return true;
                });
            }

            updateMinimap() {
                const map = document.getElementById('mini-map'), size = CONFIG.MAP_SIZE*CONFIG.TILE_SIZE;
                map.innerHTML = '';
                const draw = (u, color) => {
                    const d = document.createElement('div');
                    d.className = 'map-dot absolute w-1 h-1 rounded-full'; d.style.background = color;
                    d.style.left = ((u.mesh.position.x/size)+0.5)*100+'%'; d.style.top = ((u.mesh.position.z/size)+0.5)*100+'%';
                    map.appendChild(d);
                };
                this.state.units.forEach(u => draw(u, '#4444ff'));
                this.state.enemies.forEach(e => draw(e, '#ff4444'));
                this.state.buildings.forEach(b => draw(b, '#ffffff'));
            }

            updateUI() {
                ['gold','wood','stone'].forEach(r => document.getElementById(`res-${r}`).innerText = Math.floor(this.state.res[r]));
                document.getElementById('res-pop').innerText = `${this.state.res.pop}/${this.state.res.maxPop}`;
                const det = document.getElementById('selection-details'), menu = document.getElementById('unit-menu');
                menu.innerHTML = ''; menu.classList.add('hidden');
                if (this.state.selected.length > 0) {
                    const m = this.state.selected[0];
                    det.innerHTML = `<div class="font-bold text-lg">${(m.type||'Enemy').toUpperCase()}</div><div class="text-xs text-gray-400">HP: ${Math.ceil(m.hp)}/${Math.ceil(m.maxHp||100)}</div>`;
                    if (['barracks','keep'].includes(m.type)) {
                        menu.classList.remove('hidden');
                        (m.type==='keep' ? ['worker'] : ['soldier','archer']).forEach(t => {
                            const b = document.createElement('button');
                            b.className = 'btn-action p-2 rounded text-[10px] font-bold w-20';
                            b.innerHTML = `${CONFIG.UNITS[t].name}<br><span class="text-yellow-400">${CONFIG.UNITS[t].cost.gold}G</span>`;
                            b.onclick = () => this.train(t, m); menu.appendChild(b);
                        });
                    }
                } else det.innerHTML = "Select units or buildings";
            }

            train(t, b) {
                if (this.state.res.pop >= this.state.res.maxPop) { this.showAlert("Pop capped!"); return; }
                const c = CONFIG.UNITS[t].cost;
                if (this.afford(c)) { this.deduct(c); this.state.res.pop++; this.spawnUnit(t, b.mesh.position.x, b.mesh.position.z+4); this.updateUI(); }
                else this.showAlert("Not enough gold!");
            }

            afford(c) { return Object.keys(c).every(r => this.state.res[r] >= c[r]); }
            deduct(c) { Object.keys(c).forEach(r => this.state.res[r] -= c[r]); }
            showAlert(m) {
                const el = document.getElementById('alert-msg'); el.innerText = m; el.style.opacity = 1;
                setTimeout(() => el.style.opacity = 0, 2500);
            }

            endGame(v) { this.state.gameOver = true; document.getElementById('game-over-modal').classList.remove('hidden'); document.getElementById('game-over-title').innerText = v ? "VICTORY" : "FALLEN"; }
        }

        window.onload = () => new Game();
    </script>
</body>
</html>
