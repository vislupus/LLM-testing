<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aethergaard: Last Light</title>
<style>
:root{--bg:#0d0f14;--fg:#e8e4dc;--muted:#8b8680;--accent:#d4a843;--accent2:#4ec9b0;--danger:#e04f4f;--panel:#16191f;--panel2:#1e222a;--line:#2a2f3a;--glow:#d4a84340}
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans',system-ui,sans-serif}
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
html,body,#app{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg)}
canvas{display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#ui > *{pointer-events:auto}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 32px #0008,inset 0 1px 0 #fff2}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent);background:var(--panel);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,#2d2410,#1a1408);border-color:var(--accent);color:var(--accent)}
.btn.primary:hover{box-shadow:0 0 16px var(--glow)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.small{padding:5px 10px;font-size:11px}
.btn.icon{padding:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-label{min-width:70px;font-size:12px;color:var(--muted)}
.slider-value{min-width:36px;text-align:right;font-weight:600;color:var(--accent)}
.resource-bar{display:flex;gap:10px;flex-wrap:wrap}
.res-item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel2);border-radius:6px;border:1px solid var(--line);font-size:12px}
.res-icon{width:18px;height:18px;border-radius:4px;flex-shrink:0}
.res-name{color:var(--muted);font-size:11px}
.res-amount{font-weight:600;color:var(--fg)}
.res-rate{color:var(--accent2);font-size:11px}
.build-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.build-btn{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:all .15s;font-size:11px;text-align:center}
.build-btn:hover:not(.locked){border-color:var(--accent);background:var(--panel);transform:scale(1.05)}
.build-btn.locked{opacity:.4;cursor:not-allowed}
.build-btn .icon{font-size:20px;line-height:1}
.build-btn .cost{color:var(--muted);font-size:10px}
.build-btn .name{font-weight:500}
.unit-card{display:flex;align-items:center;gap:10px;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:all .15s}
.unit-card:hover{border-color:var(--accent);background:var(--panel)}
.unit-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.unit-card .portrait{width:40px;height:40px;border-radius:6px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:20px}
.unit-card .info{flex:1}
.unit-card .name{font-weight:600;font-size:13px}
.unit-card .stats{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.unit-card .cost{color:var(--accent);font-size:11px;font-weight:500}
.minimap{width:200px;height:200px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#0a0c10;position:relative}
.minimap canvas{width:100%;height:100%;display:block}
.minimap-viewport{position:absolute;border:2px solid var(--accent);box-shadow:0 0 8px var(--accent);pointer-events:none}
.log-panel{height:160px;overflow-y:auto;padding:10px;display:flex;flex-direction:column-reverse;gap:4px}
.log-entry{font-size:11px;line-height:1.4;padding:4px 8px;border-radius:4px;animation:slideIn .3s ease}
.log-entry.info{color:var(--fg)}
.log-entry.warn{color:var(--accent);background:var(--glow)}
.log-entry.danger{color:var(--danger);background:#e04f4f20}
.log-entry.success{color:var(--accent2);background:#4ec9b020}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tooltip{position:fixed;background:var(--panel);border:1px solid var(--accent);padding:10px 12px;border-radius:6px;font-size:12px;line-height:1.5;max-width:260px;pointer-events:none;z-index:100;box-shadow:0 8px 32px #000c,0 0 16px var(--glow);opacity:0;transition:opacity .1s}
.tooltip.visible{opacity:1}
.tooltip-title{font-weight:600;color:var(--accent);margin-bottom:4px}
.tooltip-stats{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.tooltip-desc{margin-top:6px;font-size:11px;color:var(--fg);opacity:.9}
.selection-box{position:absolute;border:2px dashed var(--accent);background:var(--glow);pointer-events:none;z-index:5}
.rally-flag{position:absolute;width:24px;height:24px;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23d4a843"><path d="M12 2L4 8v12l8 6 8-6V8L12 2zm0 2.5l6 3.5v9l-6 4.5-6-4.5v-9L12 4.5z"/></svg>') center/contain no-repeat;transform:translate(-50%,-100%);pointer-events:none;z-index:6;animation:flagWave 1.5s ease-in-out infinite}
@keyframes flagWave{0%,100%{transform:translate(-50%,-100%) rotate(-5deg)}50%{transform:translate(-50%,-100%) rotate(5deg)}}
.hero-portrait{width:56px;height:56px;border-radius:8px;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all .15s}
.hero-portrait:hover{border-color:var(--accent);transform:scale(1.05)}
.hero-portrait.active{border-color:var(--accent);box-shadow:0 0 16px var(--glow)}
.research-tree{display:flex;flex-direction:column;gap:8px}
.research-row{display:flex;gap:8px;flex-wrap:wrap}
.research-node{width:80px;height:80px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;cursor:pointer;position:relative;transition:all .15s}
.research-node:hover:not(.locked):not(.done){border-color:var(--accent2);background:var(--panel)}
.research-node.locked{opacity:.35;cursor:not-allowed}
.research-node.done{border-color:var(--accent2);background:linear-gradient(180deg,#0d1a16,#0a1410)}
.research-node .icon{font-size:24px}
.research-node .name{font-size:10px;font-weight:500;text-align:center}
.research-node .cost{font-size:10px;color:var(--accent)}
.research-node .req{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center}
.wave-bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.wave-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .5s ease;position:relative}
.wave-marker{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--danger);box-shadow:0 0 4px var(--danger)}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.time-display{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--accent)}
.difficulty-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.difficulty-badge.easy{border-color:#4ec9b0;color:#4ec9b0}
.difficulty-badge.normal{border-color:var(--accent);color:var(--accent)}
.difficulty-badge.hard{border-color:var(--danger);color:var(--danger)}
.difficulty-badge.brutal{border-color:#c0392b;color:#c0392b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #c0392b40}50%{box-shadow:0 0 0 8px #c0392b00}}
@media(max-width:1200px){.build-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.build-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div class="top-bar">
    <div class="resource-bar" id="resourceBar"></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="time-display" id="timeDisplay">Day 1 - 06:00</div>
      <div class="difficulty-badge normal" id="difficultyBadge">Normal</div>
      <button class="btn" id="pauseBtn" title="Pause (Space)">⏸</button>
      <button class="btn" id="speedBtn" title="Speed (1/2/3)">1×</button>
    </div>
  </div>
  
  <div style="position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:20">
    <div class="panel" style="padding:12px;min-width:280px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:600;color:var(--accent)">Construction</div>
        <button class="btn small" id="buildTabBtn">Buildings</button>
      </div>
      <div class="build-grid" id="buildGrid"></div>
    </div>
    <div class="panel" style="padding:12px;min-width:280px;display:none" id="unitPanel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:600;color:var(--accent)">Unit Production</div>
        <button class="btn small" id="unitTabBtn">Units</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px" id="unitList"></div>
    </div>
    <div class="panel" style="padding:12px;min-width:280px;display:none" id="researchPanel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:600;color:var(--accent2)">Research</div>
        <button class="btn small" id="researchTabBtn">Research</button>
      </div>
      <div class="research-tree" id="researchTree"></div>
    </div>
  </div>

  <div style="position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:20">
    <div class="panel minimap" id="minimapContainer">
      <canvas id="minimap"></canvas>
      <div class="minimap-viewport" id="minimapViewport"></div>
    </div>
    <div class="panel" style="padding:10px;display:flex;flex-direction:column;gap:6px;min-width:180px">
      <div style="font-weight:600;color:var(--accent)">Heroes</div>
      <div style="display:flex;gap:6px" id="heroPortraits"></div>
      <div class="wave-bar" style="width:100%">
        <div class="wave-fill" id="waveFill" style="width:0%">
          <div class="wave-marker" id="waveMarker" style="left:0%"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">
        <span>Next Wave</span>
        <span id="waveTimer">--:--</span>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:20">
    <div class="panel" style="padding:8px 16px;display:flex;align-items:center;gap:16px;white-space:nowrap">
      <div style="font-weight:600;color:var(--accent)">Population</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:120px;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)">
          <div id="popBar" style="width:0%;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s"></div>
        </div>
        <span id="popText" style="font-variant-numeric:tabular-nums">0 / 0</span>
      </div>
      <div style="font-weight:600;color:var(--accent2)">Army</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:100px;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)">
          <div id="armyBar" style="width:0%;height:100%;background:linear-gradient(90deg,var(--danger),#ff6b6b);transition:width .3s"></div>
        </div>
        <span id="armyText" style="font-variant-numeric:tabular-nums">0 / 0</span>
      </div>
      <div style="font-weight:600;color:var(--danger)">Threat</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:100px;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)">
          <div id="threatBar" style="width:0%;height:100%;background:linear-gradient(90deg,#ff3333,#ff9933);transition:width .3s"></div>
        </div>
        <span id="threatText" style="font-variant-numeric:tabular-nums">0%</span>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:16px;top:80px;width:320px;max-height:300px;z-index:15" id="selectionPanel"></div>

  <div class="panel log-panel" id="logPanel" style="position:absolute;left:16px;top:400px;width:320px;max-height:200px;z-index:15"></div>

  <div class="tooltip" id="tooltip"></div>
  <div class="selection-box" id="selectionBox"></div>
  <div class="rally-flag" id="rallyFlag" style="display:none"></div>
</div>

<script type="importmap">
{

    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>

const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (x1, z1, x2, z2) => (x1 - x2) ** 2 + (z1 - z2) ** 2;
const dist = (x1, z1, x2, z2) => Math.sqrt(dist2(x1, z1, x2, z2));
const hash = (x, z) => {
  let h = x * 374761393 + z * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) / 4294967296;
};
const noise2D = (x, z, scale = 1) => {
  const X = Math.floor(x * scale), Z = Math.floor(z * scale);
  const xf = x * scale - X, zf = z * scale - Z;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return lerp(lerp(hash(X, Z), hash(X + 1, Z), u), lerp(hash(X, Z + 1), hash(X + 1, Z + 1), u), v);
};
const fbm = (x, z, octaves = 4, lacunarity = 2, gain = 0.5) => {
  let amp = 1, freq = 1, sum = 0, max = 0;
  for (let i = 0; i < octaves; i++) {
    sum += noise2D(x * freq, z * freq) * amp;
    max += amp;
    amp *= gain; freq *= lacunarity;
  }
  return sum / max;
};
