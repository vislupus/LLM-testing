<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldermere: Fantasy Survival RTS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/utils/BufferGeometryUtils.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .tooltip {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
        }
        #minimap {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="game-ui">
            <!-- Resources -->
            <div class="absolute top-0 left-0 p-4 text-white text-lg font-bold">
                <div class="flex space-x-4">
                    <div class="flex items-center">
                        <span class="mr-2">💰</span>
                        <span id="resource-gold">100</span>
                    </div>
                    <div class="flex items-center">
                        <span class="mr-2">🪵</span>
                        <span id="resource-lumber">50</span>
                    </div>
                    <div class="flex items-center">
                        <span class="mr-2">⛰️</span>
                        <span id="resource-stone">30</span>
                    </div>
                    <div class="flex items-center">
                        <span class="mr-2">🍗</span>
                        <span id="resource-food">20</span>
                    </div>
                    <div class="flex items-center">
                        <span class="mr-2">👥</span>
                        <span id="resource-population">5/20</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div id="action-panel" class="absolute bottom-4 left-4 bg-black bg-opacity-50 p-2 rounded-lg">
                <div class="grid grid-cols-4 gap-2">
                    <button id="btn-build-lumber-mill" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded">Lumber Mill</button>
                    <button id="btn-build-quarry" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded">Quarry</button>
                    <button id="btn-build-farm" class="bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-2 rounded">Farm</button>
                    <button id="btn-build-barracks" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded">Barracks</button>
                    <button id="btn-build-archery-range" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded">Archery Range</button>
                    <button id="btn-build-stables" class="bg-orange-600 hover:bg-orange-700 text-white px-3 py-2 rounded">Stables</button>
                    <button id="btn-build-workshop" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded">Workshop</button>
                    <button id="btn-build-wall" class="bg-gray-800 hover:bg-gray-900 text-white px-3 py-2 rounded">Wall</button>
                </div>
            </div>

            <!-- Selected Unit/Building Info -->
            <div id="selection-panel" class="absolute bottom-32 left-4 bg-black bg-opacity-50 p-2 rounded-lg text-white">
                <div id="selection-name" class="font-bold">No Selection</div>
                <div id="selection-health" class="text-sm">Health: -</div>
                <div id="selection-actions" class="mt-2"></div>
            </div>

            <!-- Minimap -->
            <div id="minimap"></div>

            <!-- Tooltip -->
            <div id="tooltip" class="tooltip"></div>
        </div>
    </div>

    <script>
        // Game state
        const gameState = {
            resources: {
                gold: 100,
                lumber: 50,
                stone: 30,
                food: 20,
                population: 5,
                maxPopulation: 20
            },
            buildings: [],
            units: [],
            selected: null,
            enemy: {
                buildings: [],
                units: []
            },
            dayNightCycle: 0,
            difficulty: "medium"
        };

        // Initialize Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("game-canvas"), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Camera controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.screenSpacePanning = false;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        camera.position.set(20, 20, 20);
        controls.update();

        // Terrain
        const terrainGeometry = new THREE.PlaneGeometry(200, 200, 100, 100);
        const terrainMaterial = new THREE.MeshStandardMaterial({
            color: 0x3a5f0b,
            wireframe: false,
            flatShading: true
        });
        const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
        terrain.rotation.x = -Math.PI / 2;
        terrain.receiveShadow = true;
        scene.add(terrain);

        // Generate terrain height
        const position = terrainGeometry.attributes.position;
        for (let i = 0; i < position.count; i++) {
            const x = position.getX(i);
            const y = position.getY(i);
            const noise = Math.random() * 0.5 + 0.5;
            position.setZ(i, noise * 2);
        }
        terrainGeometry.computeVertexNormals();

        // Building types
        const buildingTypes = {
            townHall: {
                name: "Town Hall",
                cost: { gold: 0, lumber: 20, stone: 10 },
                size: { width: 4, height: 4 },
                health: 1000,
                model: null
            },
            lumberMill: {
                name: "Lumber Mill",
                cost: { gold: 30, lumber: 50, stone: 0 },
                size: { width: 3, height: 3 },
                health: 500,
                model: null
            },
            quarry: {
                name: "Quarry",
                cost: { gold: 50, lumber: 30, stone: 20 },
                size: { width: 3, height: 3 },
                health: 500,
                model: null
            },
            farm: {
                name: "Farm",
                cost: { gold: 20, lumber: 40, stone: 0 },
                size: { width: 3, height: 3 },
                health: 300,
                model: null
            },
            barracks: {
                name: "Barracks",
                cost: { gold: 50, lumber: 60, stone: 20 },
                size: { width: 4, height: 4 },
                health: 600,
                model: null
            }
        };

        // Create a building model
        function createBuildingModel(type) {
            const building = buildingTypes[type];
            const group = new THREE.Group();

            // Base
            const baseGeometry = new THREE.BoxGeometry(building.size.width, 1, building.size.height);
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: type === "townHall" ? 0x8B4513 : type === "lumberMill" ? 0x228B22 : type === "quarry" ? 0x708090 : type === "farm" ? 0xDAA520 : 0x800000
            });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.5;
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);

            // Main structure
            const structureGeometry = new THREE.BoxGeometry(building.size.width * 0.8, 3, building.size.height * 0.8);
            const structureMaterial = new THREE.MeshStandardMaterial({
                color: type === "townHall" ? 0xA0522D : type === "lumberMill" ? 0x32CD32 : type === "quarry" ? 0x696969 : type === "farm" ? 0xF4A460 : 0xB22222
            });
            const structure = new THREE.Mesh(structureGeometry, structureMaterial);
            structure.position.y = 2.5;
            structure.castShadow = true;
            structure.receiveShadow = true;
            group.add(structure);

            // Roof
            const roofGeometry = new THREE.ConeGeometry(Math.max(building.size.width, building.size.height) * 0.7, 2, 4);
            const roofMaterial = new THREE.MeshStandardMaterial({
                color: type === "townHall" ? 0x654321 : type === "lumberMill" ? 0x006400 : type === "quarry" ? 0x2F4F4F : type === "farm" ? 0xCD853F : 0x8B0000
            });
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.y = 4.5;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            roof.receiveShadow = true;
            group.add(roof);

            building.model = group;
            return group;
        }

        // Place a building
        function placeBuilding(type, x, z) {
            const building = buildingTypes[type];
            if (!building) return;

            // Check resources
            if (gameState.resources.gold < building.cost.gold || 
                gameState.resources.lumber < building.cost.lumber ||
                gameState.resources.stone < building.cost.stone) {
                alert("Not enough resources!");
                return;
            }

            // Deduct resources
            gameState.resources.gold -= building.cost.gold;
            gameState.resources.lumber -= building.cost.lumber;
            gameState.resources.stone -= building.cost.stone;
            updateResources();

            // Create building
            const model = createBuildingModel(type);
            model.position.set(x, 0, z);
            scene.add(model);

            // Add to game state
            gameState.buildings.push({
                type,
                x,
                z,
                health: building.health,
                model
            });
        }

        // Unit types
        const unitTypes = {
            peasant: {
                name: "Peasant",
                cost: { gold: 10, food: 5 },
                health: 50,
                speed: 2,
                model: null,
                gathering: { lumber: 1, stone: 1, food: 1 }
            },
            militia: {
                name: "Militia",
                cost: { gold: 20, food: 10 },
                health: 100,
                speed: 1.5,
                model: null,
                attack: { damage: 5, range: 1 }
            }
        };

        // Create a unit model
        function createUnitModel(type) {
            const unit = unitTypes[type];
            const group = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.CapsuleGeometry(0.5, 0.5, 4, 8);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: type === "peasant" ? 0x8B4513 : 0x800000
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Head
            const headGeometry = new THREE.SphereGeometry(0.3, 8, 8);
            const headMaterial = new THREE.MeshStandardMaterial({
                color: 0xFFD700
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 2;
            head.castShadow = true;
            group.add(head);

            // Tool (for peasants)
            if (type === "peasant") {
                const toolGeometry = new THREE.BoxGeometry(0.2, 0.2, 1);
                const toolMaterial = new THREE.MeshStandardMaterial({
                    color: 0x8B4513
                });
                const tool = new THREE.Mesh(toolGeometry, toolMaterial);
                tool.position.set(0.5, 1.5, 0);
                tool.castShadow = true;
                group.add(tool);
            }

            unit.model = group;
            return group;
        }

        // Spawn a unit
        function spawnUnit(type, x, z, playerControlled = true) {
            const unit = unitTypes[type];
            if (!unit) return;

            // Check resources and population
            if (playerControlled) {
                if (gameState.resources.gold < unit.cost.gold || 
                    gameState.resources.food < unit.cost.food) {
                    alert("Not enough resources!");
                    return;
                }
                if (gameState.resources.population >= gameState.resources.maxPopulation) {
                    alert("Population limit reached!");
                    return;
                }
                gameState.resources.gold -= unit.cost.gold;
                gameState.resources.food -= unit.cost.food;
                gameState.resources.population += 1;
                updateResources();
            }

            // Create unit
            const model = createUnitModel(type);
            model.position.set(x, 0, z);
            scene.add(model);

            // Add to game state
            const unitData = {
                type,
                x,
                z,
                health: unit.health,
                target: null,
                gathering: null,
                model,
                playerControlled
            };
            if (playerControlled) {
                gameState.units.push(unitData);
            } else {
                gameState.enemy.units.push(unitData);
            }
        }

        // Resource nodes
        const resourceNodes = [];

        // Create a resource node
        function createResourceNode(type, x, z) {
            const group = new THREE.Group();
            let geometry, material, color;

            if (type === "lumber") {
                color = 0x228B22;
                geometry = new THREE.ConeGeometry(1, 3, 8);
                material = new THREE.MeshStandardMaterial({ color });
                const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 8);
                const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 0.5;
                group.add(trunk);
            } else if (type === "stone") {
                color = 0x708090;
                geometry = new THREE.BoxGeometry(2, 2, 2);
                material = new THREE.MeshStandardMaterial({ color });
            } else if (type === "food") {
                color = 0xDAA520;
                geometry = new THREE.CylinderGeometry(0, 1, 2, 8);
                material = new THREE.MeshStandardMaterial({ color });
            }

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = type === "lumber" ? 2 : 1;
            mesh.castShadow = true;
            group.add(mesh);
            group.position.set(x, 0, z);
            scene.add(group);

            resourceNodes.push({
                type,
                x,
                z,
                amount: 100,
                model: group
            });
        }

        // Place resource nodes
        for (let i = 0; i < 10; i++) {
            createResourceNode("lumber", Math.random() * 40 - 20, Math.random() * 40 - 20);
            createResourceNode("stone", Math.random() * 40 - 20, Math.random() * 40 - 20);
            createResourceNode("food", Math.random() * 40 - 20, Math.random() * 40 - 20);
        }

        // Gathering system
        function assignGathering(unit, resourceType) {
            if (unit.type !== "peasant") return;

            // Find nearest resource node
            let nearestNode = null;
            let nearestDistance = Infinity;

            for (const node of resourceNodes) {
                if (node.type === resourceType && node.amount > 0) {
                    const distance = Math.sqrt(Math.pow(unit.x - node.x, 2) + Math.pow(unit.z - node.z, 2));
                    if (distance < nearestDistance) {
                        nearestDistance = distance;
                        nearestNode = node;
                    }
                }
            }

            if (nearestNode) {
                unit.gathering = nearestNode;
                unit.target = { x: nearestNode.x, z: nearestNode.z };
            }
        }

        // Update unit gathering
        function updateGathering() {
            for (const unit of gameState.units) {
                if (unit.gathering && unit.gathering.amount > 0) {
                    const distance = Math.sqrt(Math.pow(unit.x - unit.gathering.x, 2) + Math.pow(unit.z - unit.gathering.z, 2));
                    if (distance < 2) {
                        // Gather resource
                        unit.gathering.amount -= 1;
                        if (unit.gathering.type === "lumber") gameState.resources.lumber += 1;
                        if (unit.gathering.type === "stone") gameState.resources.stone += 1;
                        if (unit.gathering.type === "food") gameState.resources.food += 1;
                        updateResources();

                        // Deplete node
                        if (unit.gathering.amount <= 0) {
                            scene.remove(unit.gathering.model);
                            resourceNodes.splice(resourceNodes.indexOf(unit.gathering), 1);
                            unit.gathering = null;
                        }
                    }
                }
            }
        }

        // Movement system
        function updateMovement() {
            for (const unit of gameState.units) {
                if (unit.target) {
                    const dx = unit.target.x - unit.x;
                    const dz = unit.target.z - unit.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);

                    if (distance > 0.1) {
                        unit.x += (dx / distance) * unitTypes[unit.type].speed * 0.01;
                        unit.z += (dz / distance) * unitTypes[unit.type].speed * 0.01;
                        unit.model.position.set(unit.x, 0, unit.z);
                    } else {
                        unit.target = null;
                    }
                }
            }
        }

        // Spawn initial peasant
        spawnUnit("peasant", 2, 2);

        // Fog of War
        const fogOfWar = {
            size: 200,
            gridSize: 10,
            visibility: {}
        };

        // Initialize fog of war
        function initFogOfWar() {
            const gridCount = fogOfWar.size / fogOfWar.gridSize;
            for (let x = 0; x < gridCount; x++) {
                for (let z = 0; z < gridCount; z++) {
                    fogOfWar.visibility[`${x},${z}`] = false;
                }
            }
        }

        // Update fog of war
        function updateFogOfWar() {
            for (const unit of gameState.units) {
                const gridX = Math.floor((unit.x + fogOfWar.size / 2) / fogOfWar.gridSize);
                const gridZ = Math.floor((unit.z + fogOfWar.size / 2) / fogOfWar.gridSize);
                fogOfWar.visibility[`${gridX},${gridZ}`] = true;
            }
        }

        // Enemy AI
        function spawnEnemyBase() {
            placeBuilding("townHall", -30, -30);
            for (let i = 0; i < 5; i++) {
                spawnUnit("militia", -30 + Math.random() * 5, -30 + Math.random() * 5, false);
            }
        }

        // Spawn enemy raids
        function spawnEnemyRaid() {
            for (let i = 0; i < 3; i++) {
                spawnUnit("militia", 20 + Math.random() * 10, 20 + Math.random() * 10, false);
            }
        }

        // Combat system
        function updateCombat() {
            for (const unit of gameState.units) {
                if (unitTypes[unit.type].attack) {
                    for (const enemy of gameState.enemy.units) {
                        const distance = Math.sqrt(Math.pow(unit.x - enemy.x, 2) + Math.pow(unit.z - enemy.z, 2));
                        if (distance < unitTypes[unit.type].attack.range) {
                            enemy.health -= unitTypes[unit.type].attack.damage;
                            if (enemy.health <= 0) {
                                scene.remove(enemy.model);
                                gameState.enemy.units.splice(gameState.enemy.units.indexOf(enemy), 1);
                            }
                        }
                    }
                }
            }
        }

        // Day/Night Cycle
        function updateDayNightCycle() {
            gameState.dayNightCycle = (gameState.dayNightCycle + 0.005) % 1;
            const dayColor = new THREE.Color(0x87CEEB);
            const nightColor = new THREE.Color(0x000033);
            scene.background = dayColor.lerp(nightColor, gameState.dayNightCycle);

            // Spawn raids at night
            if (gameState.dayNightCycle > 0.7 && Math.random() > 0.99) {
                spawnEnemyRaid();
            }
        }

        // Initialize fog of war
        initFogOfWar();

        // Spawn enemy base
        spawnEnemyBase();

        // Building placement mode
        let placementMode = null;
        let placementPreview = null;

        // Create placement preview
        function createPlacementPreview(type) {
            if (placementPreview) {
                scene.remove(placementPreview);
            }

            const building = buildingTypes[type];
            const geometry = new THREE.BoxGeometry(building.size.width, 0.1, building.size.height);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00FF00,
                transparent: true,
                opacity: 0.5
            });
            placementPreview = new THREE.Mesh(geometry, material);
            placementPreview.position.y = 0.05;
            scene.add(placementPreview);
        }

        // Update placement preview
        function updatePlacementPreview(x, z) {
            if (!placementPreview) return;

            // Snap to grid
            const snappedX = Math.round(x / 5) * 5;
            const snappedZ = Math.round(z / 5) * 5;
            placementPreview.position.set(snappedX, 0.05, snappedZ);

            // Check for collisions
            let valid = true;
            for (const building of gameState.buildings) {
                if (Math.abs(building.x - snappedX) < 5 && Math.abs(building.z - snappedZ) < 5) {
                    valid = false;
                    break;
                }
            }

            placementPreview.material.color.set(valid ? 0x00FF00 : 0xFF0000);
        }

        // Place building on click
        function onPlacementClick(x, z) {
            if (!placementMode || !placementPreview) return;

            const snappedX = Math.round(x / 5) * 5;
            const snappedZ = Math.round(z / 5) * 5;

            // Check for collisions
            for (const building of gameState.buildings) {
                if (Math.abs(building.x - snappedX) < 5 && Math.abs(building.z - snappedZ) < 5) {
                    alert("Cannot place building here!");
                    return;
                }
            }

            placeBuilding(placementMode, snappedX, snappedZ);
            scene.remove(placementPreview);
            placementPreview = null;
            placementMode = null;
        }

        // Handle building buttons
        document.getElementById("btn-build-lumber-mill")?.addEventListener("click", () => {
            placementMode = "lumberMill";
            createPlacementPreview("lumberMill");
        });

        document.getElementById("btn-build-quarry")?.addEventListener("click", () => {
            placementMode = "quarry";
            createPlacementPreview("quarry");
        });

        document.getElementById("btn-build-farm")?.addEventListener("click", () => {
            placementMode = "farm";
            createPlacementPreview("farm");
        });

        document.getElementById("btn-build-barracks")?.addEventListener("click", () => {
            placementMode = "barracks";
            createPlacementPreview("barracks");
        });

        // Handle clicks for placement
        window.addEventListener("click", (event) => {
            if (placementMode) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(terrain);
                if (intersects.length > 0) {
                    const point = intersects[0].point;
                    onPlacementClick(point.x, point.z);
                }
            } else {
                onMouseClick(event);
            }
        });

        // Handle mouse move for placement preview
        window.addEventListener("mousemove", (event) => {
            if (placementMode) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(terrain);
                if (intersects.length > 0) {
                    const point = intersects[0].point;
                    updatePlacementPreview(point.x, point.z);
                }
            }
        });

        // Unit recruitment
        function recruitUnit(type) {
            if (!selectedUnit || !selectedUnit.playerControlled) return;

            const building = gameState.buildings.find(b => b.type === "barracks");
            if (!building) return;

            const unit = unitTypes[type];
            if (!unit) return;

            if (gameState.resources.gold < unit.cost.gold || 
                gameState.resources.food < unit.cost.food) {
                alert("Not enough resources!");
                return;
            }

            if (gameState.resources.population >= gameState.resources.maxPopulation) {
                alert("Population limit reached!");
                return;
            }

            gameState.resources.gold -= unit.cost.gold;
            gameState.resources.food -= unit.cost.food;
            gameState.resources.population += 1;
            updateResources();

            spawnUnit(type, building.x + 3, building.z + 3);
        }

        // Add recruitment buttons to selection panel
        function updateSelectionPanel(unit) {
            document.getElementById("selection-name").textContent = unitTypes[unit.type].name;
            document.getElementById("selection-health").textContent = `Health: ${unit.health}`;
            document.getElementById("selection-actions").innerHTML = `
                <button id="btn-move" class="bg-blue-500 hover:bg-blue-700 text-white px-2 py-1 rounded">Move</button>
                ${unit.type === "peasant" ? `<button id="btn-gather-lumber" class="bg-green-500 hover:bg-green-700 text-white px-2 py-1 rounded">Gather Lumber</button>` : ""}
                ${unit.type === "barracks" ? `<button id="btn-recruit-militia" class="bg-red-500 hover:bg-red-700 text-white px-2 py-1 rounded">Recruit Militia</button>` : ""}
            `;

            document.getElementById("btn-recruit-militia")?.addEventListener("click", () => {
                recruitUnit("militia");
            });
        }

        // Override selection system to use updated panel
        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            for (const intersect of intersects) {
                for (const unit of gameState.units) {
                    if (intersect.object === unit.model || unit.model.children.includes(intersect.object)) {
                        selectedUnit = unit;
                        updateSelectionPanel(unit);
                        return;
                    }
                }
                for (const building of gameState.buildings) {
                    if (intersect.object === building.model || building.model.children.includes(intersect.object)) {
                        selectedUnit = building;
                        updateSelectionPanel(building);
                        return;
                    }
                }
            }

            selectedUnit = null;
            document.getElementById("selection-name").textContent = "No Selection";
            document.getElementById("selection-health").textContent = "Health: -";
            document.getElementById("selection-actions").innerHTML = "";
        }

        // Minimap
        const minimapCanvas = document.createElement("canvas");
        minimapCanvas.width = 200;
        minimapCanvas.height = 200;
        minimapCanvas.style.position = "absolute";
        minimapCanvas.style.bottom = "10px";
        minimapCanvas.style.right = "10px";
        minimapCanvas.style.border = "2px solid rgba(255, 255, 255, 0.8)";
        minimapCanvas.style.background = "rgba(0, 0, 0, 0.5)";
        minimapCanvas.style.pointerEvents = "none";
        document.getElementById("game-ui").appendChild(minimapCanvas);
        const minimapCtx = minimapCanvas.getContext("2d");

        function updateMinimap() {
            minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            minimapCtx.fillStyle = "#3a5f0b";
            minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            // Draw buildings
            for (const building of gameState.buildings) {
                minimapCtx.fillStyle = building.type === "townHall" ? "#8B4513" : "#A0522D";
                minimapCtx.fillRect(
                    (building.x + fogOfWar.size / 2) / fogOfWar.size * minimapCanvas.width - 2,
                    (building.z + fogOfWar.size / 2) / fogOfWar.size * minimapCanvas.height - 2,
                    4, 4
                );
            }

            // Draw units
            for (const unit of gameState.units) {
                minimapCtx.fillStyle = "#00FF00";
                minimapCtx.fillRect(
                    (unit.x + fogOfWar.size / 2) / fogOfWar.size * minimapCanvas.width - 1,
                    (unit.z + fogOfWar.size / 2) / fogOfWar.size * minimapCanvas.height - 1,
                    2, 2
                );
            }

            // Draw enemy units
            for (const unit of gameState.enemy.units) {
                minimapCtx.fillStyle = "#FF0000";
                minimapCtx.fillRect(
                    (unit.x + fogOfWar.size / 2) / fogOfWar.size * minimapCanvas.width - 1,
                    (unit.z + fogOfWar.size / 2) / fogOfWar.size * minimapCanvas.height - 1,
                    2, 2
                );
            }
        }

        // Victory/Defeat conditions
        function checkVictoryDefeat() {
            const playerTownHall = gameState.buildings.find(b => b.type === "townHall");
            const enemyTownHall = gameState.enemy.buildings.find(b => b.type === "townHall");

            if (!playerTownHall) {
                alert("Defeat! Your Town Hall has been destroyed.");
                document.location.reload();
            }

            if (!enemyTownHall) {
                alert("Victory! You have destroyed the enemy Town Hall.");
                document.location.reload();
            }
        }

        // Override game loop
        function animate() {
            requestAnimationFrame(animate);
            updateMovement();
            updateGathering();
            updateFogOfWar();
            updateCombat();
            updateDayNightCycle();
            updateMinimap();
            checkVictoryDefeat();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Selection system
        let selectedUnit = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onMouseClick(event) {
            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update the raycaster
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            // Check for unit selection
            for (const intersect of intersects) {
                for (const unit of gameState.units) {
                    if (intersect.object === unit.model || unit.model.children.includes(intersect.object)) {
                        selectedUnit = unit;
                        document.getElementById("selection-name").textContent = unitTypes[unit.type].name;
                        document.getElementById("selection-health").textContent = `Health: ${unit.health}`;
                        document.getElementById("selection-actions").innerHTML = `
                            <button id="btn-move" class="bg-blue-500 hover:bg-blue-700 text-white px-2 py-1 rounded">Move</button>
                            ${unit.type === "peasant" ? `<button id="btn-gather-lumber" class="bg-green-500 hover:bg-green-700 text-white px-2 py-1 rounded">Gather Lumber</button>` : ""}
                        `;
                        return;
                    }
                }
            }

            // Deselect if clicked on empty space
            selectedUnit = null;
            document.getElementById("selection-name").textContent = "No Selection";
            document.getElementById("selection-health").textContent = "Health: -";
            document.getElementById("selection-actions").innerHTML = "";
        }

        window.addEventListener("click", onMouseClick);

        // Place initial Town Hall
        placeBuilding("townHall", 0, 0);

        // Game loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Update resources UI
        function updateResources() {
            document.getElementById("resource-gold").textContent = gameState.resources.gold;
            document.getElementById("resource-lumber").textContent = gameState.resources.lumber;
            document.getElementById("resource-stone").textContent = gameState.resources.stone;
            document.getElementById("resource-food").textContent = gameState.resources.food;
            document.getElementById("resource-population").textContent = `${gameState.resources.population}/${gameState.resources.maxPopulation}`;
        }

        // Initialize game
        updateResources();
    </script>
</body>
</html>
