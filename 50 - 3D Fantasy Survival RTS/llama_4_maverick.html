<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy RTS</title>
    <style>
        body { margin: 0; }
        #game-container { width: 100%; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="game-container"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuration
        const config = {
            resourceTypes: ['gold', 'wood', 'stone'],
            unitTypes: ['archer', 'warrior', 'mage'],
            buildingTypes: ['barracks', 'farm', 'lumbermill', 'stonemason'],
            difficulty: 'medium',
        };

        // Game state
        let state = {
            resources: { gold: 100, wood: 100, stone: 100 },
            population: { current: 5, max: 10 },
            units: [],
            buildings: [],
            enemyUnits: [],
            dayNightCycle: 0,
        };

        // Initialize scene, camera, and renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('game-container'),
            antialias: true,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Add some basic terrain
        const terrainGeometry = new THREE.PlaneGeometry(100, 100);
        const terrainMaterial = new THREE.MeshBasicMaterial({ color: 0x964B00 });
        const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
        terrain.rotation.x = -Math.PI / 2;
        scene.add(terrain);

        // Add a directional light
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);

        // Camera controls
        camera.position.set(0, 10, 20);
        camera.lookAt(0, 0, 0);

        // Simple game loop
        function animate() {
            requestAnimationFrame(animate);

            // Update day/night cycle
            state.dayNightCycle += 0.001;
            light.intensity = Math.sin(state.dayNightCycle) + 1;

            // Render scene
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Simple UI for resource display
        const resourceDisplay = document.createElement('div');
        resourceDisplay.style.position = 'absolute';
        resourceDisplay.style.top = '10px';
        resourceDisplay.style.left = '10px';
        resourceDisplay.style.color = 'white';
        document.body.appendChild(resourceDisplay);

        // Update resource display
        function updateResourceDisplay() {
            resourceDisplay.innerText = `Gold: ${state.resources.gold}, Wood: ${state.resources.wood}, Stone: ${state.resources.stone}`;
        }
        updateResourceDisplay();

        // Basic game logic
        function updateGameState() {
            // Update resource gathering
            state.resources.gold += 0.1;
            state.resources.wood += 0.1;
            state.resources.stone += 0.1;

            // Update enemy units
            if (Math.random() < 0.01) {
                const enemyUnit = { type: 'archer', position: { x: Math.random() * 10, z: Math.random() * 10 } };
                state.enemyUnits.push(enemyUnit);
            }

            // Update UI
            updateResourceDisplay();
        }
        setInterval(updateGameState, 1000);

        // Handle user input (very basic)
        document.addEventListener('click', (event) => {
            // Raycast to detect clicks on terrain or units
            const raycaster = new THREE.Raycaster();
            const mousePosition = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1,
            );
            raycaster.setFromCamera(mousePosition, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            if (intersects.length > 0) {
                // Handle click on terrain or unit
                console.log('Clicked on:', intersects[0]);
            }
        });
    </script>
</body>
</html>
