<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurelion: Last Stand</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
canvas { display: block; }

#ui-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#ui-overlay > * { pointer-events: auto; }

#top-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 50px;
  background: linear-gradient(180deg, rgba(20,15,10,0.95) 0%, rgba(20,15,10,0.7) 100%);
  display: flex; align-items: center; padding: 0 15px; gap: 15px;
  border-bottom: 2px solid #c8a45a; z-index: 20;
}
.resource-item {
  display: flex; align-items: center; gap: 6px; color: #e8d5a3;
  font-size: 13px; font-weight: 600; min-width: 90px;
}
.resource-icon {
  width: 22px; height: 22px; border-radius: 4px; display: flex;
  align-items: center; justify-content: center; font-size: 14px;
}
.res-wood .resource-icon { background: #4a7a3a; }
.res-stone .resource-icon { background: #7a7a8a; }
.res-food .resource-icon { background: #c8a030; }
.res-gold .resource-icon { background: #d4a017; }
.res-pop .resource-icon { background: #5a8abf; }
.resource-val { color: #fff; }

#time-display {
  margin-left: auto; color: #e8d5a3; font-size: 13px;
  display: flex; align-items: center; gap: 8px;
}
#day-icon { font-size: 18px; }
#day-night-bar {
  width: 80px; height: 6px; background: #333; border-radius: 3px; overflow: hidden;
}
#day-night-fill { height: 100%; border-radius: 3px; transition: width 0.5s, background 0.5s; }

#bottom-panel {
  position: fixed; bottom: 0; left: 0; right: 0; height: 130px;
  background: linear-gradient(0deg, rgba(20,15,10,0.95) 0%, rgba(20,15,10,0.8) 100%);
  border-top: 2px solid #c8a45a; display: flex; padding: 8px 15px; gap: 12px;
  z-index: 20;
}

#selection-info {
  width: 200px; min-width: 200px; display: flex; flex-direction: column; gap: 6px;
}
#selection-name { color: #f0d878; font-size: 15px; font-weight: 700; }
#selection-desc { color: #b8a880; font-size: 11px; line-height: 1.3; }
#selection-stats { color: #d4c4a0; font-size: 11px; line-height: 1.5; }

#action-buttons {
  flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start;
  overflow-y: auto; max-height: 115px;
}
.action-btn {
  background: linear-gradient(180deg, #3a3020 0%, #2a2018 100%);
  border: 1px solid #8a7a5a; border-radius: 6px; color: #e8d5a3;
  padding: 6px 12px; font-size: 11px; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 2px; min-width: 100px;
  transition: all 0.15s;
}
.action-btn:hover { background: linear-gradient(180deg, #5a4a30 0%, #3a3020 100%); border-color: #c8a45a; }
.action-btn:active { transform: scale(0.97); }
.action-btn.disabled { opacity: 0.4; pointer-events: none; }
.action-btn .btn-name { font-weight: 600; font-size: 12px; color: #f0d878; }
.action-btn .btn-cost { font-size: 10px; color: #a89870; }
.action-btn .btn-key { font-size: 9px; color: #888; }

#minimap-container {
  width: 160px; height: 130px; position: relative;
}
#minimap { width: 160px; height: 130px; border: 2px solid #c8a45a; border-radius: 4px; }

#build-menu {
  position: fixed; top: 60px; right: 10px; width: 280px;
  background: rgba(20,15,10,0.95); border: 2px solid #c8a45a; border-radius: 8px;
  padding: 10px; display: none; z-index: 25; max-height: 400px; overflow-y: auto;
}
#build-menu h3 { color: #f0d878; font-size: 14px; margin-bottom: 8px; text-align: center; }
.build-item {
  display: flex; align-items: center; gap: 8px; padding: 8px;
  background: rgba(60,50,30,0.5); border: 1px solid #5a4a30; border-radius: 4px;
  margin-bottom: 4px; cursor: pointer; transition: all 0.15s;
}
.build-item:hover { background: rgba(80,65,35,0.7); border-color: #c8a45a; }
.build-item.disabled { opacity: 0.4; pointer-events: none; }
.build-item .bi-icon { width: 36px; height: 36px; background: #3a3020; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.build-item .bi-info { flex: 1; }
.build-item .bi-name { color: #f0d878; font-size: 12px; font-weight: 600; }
.build-item .bi-cost { color: #a89870; font-size: 10px; }
.build-item .bi-desc { color: #8a7a60; font-size: 10px; }

#message-area {
  position: fixed; top: 55px; left: 50%; transform: translateX(-50%);
  text-align: center; z-index: 30; pointer-events: none;
}
.game-message {
  color: #f0d878; font-size: 18px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  animation: msgFade 3s forwards;
}
@keyframes msgFade { 0% { opacity: 0; transform: translateY(10px); } 10% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; } }

#game-over-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); display: none; z-index: 100;
  flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
#game-over-screen h1 { font-size: 48px; font-weight: 900; }
#game-over-screen .subtitle { color: #b8a880; font-size: 16px; }
#game-over-screen button {
  background: linear-gradient(180deg, #5a4a20 0%, #3a3010 100%);
  border: 2px solid #c8a45a; border-radius: 8px; color: #f0d878;
  padding: 12px 40px; font-size: 18px; cursor: pointer; font-weight: 700;
}
#game-over-screen button:hover { background: linear-gradient(180deg, #7a6a30 0%, #5a4a20 100%); }

#start-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at center, #1a1520 0%, #0a0810 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
  z-index: 200;
}
#start-screen h1 {
  font-size: 52px; font-weight: 900; color: #f0d878;
  text-shadow: 0 0 30px rgba(240,216,120,0.3);
}
#start-screen .tagline { color: #8a7a60; font-size: 16px; margin-bottom: 10px; }
#start-screen .diff-select { display: flex; gap: 10px; margin: 10px 0; }
#start-screen .diff-btn {
  background: rgba(60,50,30,0.5); border: 2px solid #5a4a30; border-radius: 8px;
  color: #d4c4a0; padding: 10px 25px; font-size: 14px; cursor: pointer;
  transition: all 0.2s;
}
#start-screen .diff-btn:hover { border-color: #c8a45a; background: rgba(80,65,35,0.7); }
#start-screen .diff-btn.selected { border-color: #f0d878; color: #f0d878; background: rgba(100,80,30,0.5); }
#start-screen .start-btn {
  background: linear-gradient(180deg, #6a5a20 0%, #4a3a10 100%);
  border: 2px solid #c8a45a; border-radius: 8px; color: #f0d878;
  padding: 14px 50px; font-size: 20px; cursor: pointer; font-weight: 700;
  margin-top: 15px;
}
#start-screen .start-btn:hover { background: linear-gradient(180deg, #8a7a30 0%, #6a5a20 100%); }
#start-screen .controls { color: #6a5a40; font-size: 11px; margin-top: 10px; line-height: 1.8; text-align: center; }

#wave-banner {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #ff4444; font-size: 32px; font-weight: 900; text-shadow: 0 0 20px rgba(255,0,0,0.5);
  z-index: 30; pointer-events: none; display: none;
  animation: wavePulse 2s forwards;
}
@keyframes wavePulse { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); } 30% { transform: translate(-50%,-50%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }

#tooltip {
  position: fixed; background: rgba(20,15,10,0.95); border: 1px solid #c8a45a;
  border-radius: 4px; padding: 8px; color: #e8d5a3; font-size: 11px;
  pointer-events: none; display: none; z-index: 50; max-width: 200px;
}
</style>
</head>
<body>

<div id="start-screen">
  <h1>⚔ AURELION ⚔</h1>
  <div class="tagline">The Last Stand of the Golden Kingdom</div>
  <div class="diff-select">
    <button class="diff-btn" data-diff="0">Cruel</button>
    <button class="diff-btn selected" data-diff="1">Standard</button>
    <button class="diff-btn" data-diff="2">Merciful</button>
  </div>
  <button class="start-btn" id="startBtn">⚔ Begin the Siege ⚔</button>
  <div class="controls">
    Left Click: Select / Command &nbsp;|&nbsp; Right Click: Move / Attack<br>
    Scroll: Zoom &nbsp;|&nbsp; B: Build Menu &nbsp;|&nbsp; WASD: Camera Move &nbsp;|&nbsp; Space: Deselect
  </div>
</div>

<div id="ui-overlay">
  <div id="top-bar">
    <div class="resource-item res-wood"><div class="resource-icon">🌲</div><span class="resource-val" id="res-wood">0</span></div>
    <div class="resource-item res-stone"><div class="resource-icon">🪨</div><span class="resource-val" id="res-stone">0</span></div>
    <div class="resource-item res-food"><div class="resource-icon">🌾</div><span class="resource-val" id="res-food">0</span></div>
    <div class="resource-item res-gold"><div class="resource-icon">💰</div><span class="resource-val" id="res-gold">0</span></div>
    <div class="resource-item res-pop"><div class="resource-icon">👥</div><span class="resource-val" id="res-pop">0/0</span></div>
    <div id="time-display">
      <span id="day-icon">☀️</span>
      <div id="day-night-bar"><div id="day-night-fill" style="width:100%;background:#ffd700;"></div></div>
      <span id="day-label">Day 1</span>
    </div>
  </div>

  <div id="bottom-panel">
    <div id="selection-info">
      <div id="selection-name">No Selection</div>
      <div id="selection-desc"></div>
      <div id="selection-stats"></div>
    </div>
    <div id="action-buttons"></div>
    <div id="minimap-container">
      <canvas id="minimap" width="160" height="130"></canvas>
    </div>
  </div>
</div>

<div id="build-menu">
  <h3>🔨 Build Menu</h3>
  <div id="build-list"></div>
</div>

<div id="message-area"></div>
<div id="wave-banner"></div>
<div id="tooltip"></div>

<div id="game-over-screen">
  <h1 id="go-title">DEFEAT</h1>
  <div class="subtitle" id="go-subtitle">The Umbral Horde has consumed Aurelion.</div>
  <div class="subtitle" id="go-stats"></div>
  <button onclick="location.reload()">Play Again</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// AURELION: LAST STAND - Complete Fantasy Survival RTS
// ============================================================

// --- Difficulty ---
const DIFFICULTY = [
  { name: 'Cruel', enemyMult: 1.8, waveInterval: 45, spawnMult: 1.6, econMult: 0.7 },
  { name: 'Standard', enemyMult: 1.0, waveInterval: 60, spawnMult: 1.0, econMult: 1.0 },
  { name: 'Merciful', enemyMult: 0.6, waveInterval: 80, spawnMult: 0.6, econMult: 1.4 }
];
let difficulty = DIFFICULTY[1];

// --- Game Constants ---
const MAP_SIZE = 200;
const TILE_SIZE = 4;
const TILE_MAP = 50;
const FOW_RADIUS = 45;
const GATHER_RADIUS = 6;
const GATHER_RATE = 2;
const BUILD_COSTS = {
  barracks: { wood: 60, stone: 40, food: 0, gold: 0 },
  archeryRange: { wood: 80, stone: 20, food: 0, gold: 0 },
  stable: { wood: 100, stone: 60, food: 50, gold: 0 },
  farm: { wood: 30, stone: 0, food: 0, gold: 0 },
  quarry: { wood: 20, stone: 0, food: 0, gold: 0 },
  lumberCamp: { wood: 0, stone: 20, food: 0, gold: 0 },
  tower: { wood: 50, stone: 80, food: 0, gold: 20 },
  wall: { wood: 10, stone: 30, food: 0, gold: 0 },
  mageTower: { wood: 120, stone: 80, food: 50, gold: 100 }
};
const UNIT_COSTS = {
  worker: { food: 15, gold: 5 },
  swordsman: { food: 25, gold: 15 },
  archer: { food: 20, gold: 20 },
  knight: { food: 40, gold: 35 },
  battleMage: { food: 50, gold: 60 }
};
const UNIT_STATS = {
  worker: { hp: 40, attack: 4, speed: 3.5, range: 1.5, damageType: 'melee', popCost: 1 },
  swordsman: { hp: 80, attack: 10, speed: 3, range: 2, damageType: 'melee', popCost: 1 },
  archer: { hp: 50, attack: 8, speed: 3, range: 12, damageType: 'ranged', popCost: 1 },
  knight: { hp: 140, attack: 16, speed: 4.5, range: 2, damageType: 'melee', popCost: 2 },
  battleMage: { hp: 70, attack: 18, speed: 2.5, range: 10, damageType: 'magic', popCost: 2 },
  // Enemy units
  shadow: { hp: 30, attack: 6, speed: 2.5, range: 1.5, damageType: 'melee', popCost: 0 },
  wraith: { hp: 50, attack: 10, speed: 3, range: 8, damageType: 'ranged', popCost: 0 },
  beast: { hp: 100, attack: 14, speed: 3.5, range: 2, damageType: 'melee', popCost: 0 },
  dreadKnight: { hp: 180, attack: 22, speed: 4, range: 2, damageType: 'melee', popCost: 0 },
  darkMage: { hp: 60, attack: 20, speed: 2, range: 12, damageType: 'magic', popCost: 0 },
  heroCommander: { hp: 300, attack: 30, speed: 4, range: 2.5, damageType: 'melee', popCost: 0 },
  // Buildings
  citadel: { hp: 800, attack: 0, speed: 0, range: 0 },
  barracks: { hp: 400, attack: 0, speed: 0, range: 0 },
  archeryRange: { hp: 300, attack: 0, speed: 0, range: 0 },
  stable: { hp: 350, attack: 0, speed: 0, range: 0 },
  farm: { hp: 200, attack: 0, speed: 0, range: 0 },
  quarry: { hp: 250, attack: 0, speed: 0, range: 0 },
  lumberCamp: { hp: 200, attack: 0, speed: 0, range: 0 },
  tower: { hp: 350, attack: 12, speed: 0, range: 14 },
  wall: { hp: 500, attack: 0, speed: 0, range: 0 },
  mageTower: { hp: 400, attack: 20, speed: 0, range: 16 },
  enemyCitadel: { hp: 1200, attack: 0, speed: 0, range: 0 }
};

// --- Global State ---
let gameStarted = false;
let gameOver = false;
let gameTime = 0;
let dayTime = 0;
let dayCount = 1;
let isNight = false;
let waveNumber = 0;
let nextWaveTime = 0;
let waveActive = false;

const resources = { wood: 150, stone: 100, food: 200, gold: 80 };
const popCap = { current: 0, max: 20 };

// --- Three.js Setup ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x88aacc, 0.006);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 500);
camera.position.set(0, 60, 50);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0x6688aa, 0.5);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
sunLight.position.set(50, 80, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -100;
sunLight.shadow.camera.right = 100;
sunLight.shadow.camera.top = 100;
sunLight.shadow.camera.bottom = -100;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 200;
scene.add(sunLight);

const moonLight = new THREE.DirectionalLight(0x4466aa, 0.3);
moonLight.position.set(-30, 60, -40);
scene.add(moonLight);

const hemiLight = new THREE.HemisphereLight(0x88bbdd, 0x445522, 0.4);
scene.add(hemiLight);

// --- Materials ---
const matGrass = new THREE.MeshLambertMaterial({ color: 0x5a8a3a });
const matGrassDark = new THREE.MeshLambertMaterial({ color: 0x4a7a2a });
const matDirt = new THREE.MeshLambertMaterial({ color: 0x8a7a5a });
const matWater = new THREE.MeshLambertMaterial({ color: 0x3388bb, transparent: true, opacity: 0.7 });
const matStone = new THREE.MeshLambertMaterial({ color: 0x8a8a8a });
const matWood = new THREE.MeshLambertMaterial({ color: 0x8a6a3a });
const matRoof = new THREE.MeshLambertMaterial({ color: 0xaa4444 });
const matRoofBlue = new THREE.MeshLambertMaterial({ color: 0x3355aa });
const matRoofGold = new THREE.MeshLambertMaterial({ color: 0xccaa33 });
const matWall = new THREE.MeshLambertMaterial({ color: 0x9a9a9a });
const matWallDark = new THREE.MeshLambertMaterial({ color: 0x6a6a6a });
const matGold = new THREE.MeshLambertMaterial({ color: 0xddaa22 });
const matCrystal = new THREE.MeshLambertMaterial({ color: 0x88ccff, transparent: true, opacity: 0.8 });
const matEnemy = new THREE.MeshLambertMaterial({ color: 0x3a1a3a });
const matEnemyDark = new THREE.MeshLambertMaterial({ color: 0x2a0a2a });
const matPlayerUnit = new THREE.MeshLambertMaterial({ color: 0x4488cc });
const matPlayerUnitAlt = new THREE.MeshLambertMaterial({ color: 0x3366aa });
const matArcherUnit = new THREE.MeshLambertMaterial({ color: 0x44aa66 });
const matKnightUnit = new THREE.MeshLambertMaterial({ color: 0xcc8833 });
const matMageUnit = new THREE.MeshLambertMaterial({ color: 0xaa44cc });
const matSelection = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5, wireframe: true });

// --- Terrain Generation ---
const terrainGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, TILE_MAP, TILE_MAP);
terrainGeo.rotateX(-Math.PI / 2);
const vertices = terrainGeo.attributes.position.array;
const heights = [];

for (let i = 0; i < vertices.length; i += 3) {
  const x = vertices[i];
  const z = vertices[i + 2];
  let h = 0;
  h += Math.sin(x * 0.03) * Math.cos(z * 0.03) * 3;
  h += Math.sin(x * 0.07 + 1) * Math.cos(z * 0.05 + 2) * 2;
  h += Math.sin(x * 0.15) * Math.cos(z * 0.12) * 0.8;
  // Flatten center area
  const distFromCenter = Math.sqrt(x * x + z * z);
  if (distFromCenter < 30) h *= distFromCenter / 30;
  // Create a slight depression near citadel
  if (distFromCenter < 10) h *= 0.3;
  vertices[i + 1] = h;
  heights.push(h);
}
terrainGeo.computeVertexNormals();

const terrain = new THREE.Mesh(terrainGeo, matGrass);
terrain.receiveShadow = true;
scene.add(terrain);

// Water plane
const waterGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, matWater);
water.position.y = -0.5;
scene.add(water);

// --- Helper Functions ---
function getHeightAt(x, z) {
  let h = 0;
  h += Math.sin(x * 0.03) * Math.cos(z * 0.03) * 3;
  h += Math.sin(x * 0.07 + 1) * Math.cos(z * 0.05 + 2) * 2;
  h += Math.sin(x * 0.15) * Math.cos(z * 0.12) * 0.8;
  const d = Math.sqrt(x * x + z * z);
  if (d < 30) h *= d / 30;
  if (d < 10) h *= 0.3;
  return h;
}

function dist3d(a, b) { return Math.sqrt((a.x - b.x) ** 2 + (a.z - b.z) ** 2); }
function dist2d(ax, az, bx, bz) { return Math.sqrt((ax - bx) ** 2 + (az - bz) ** 2); }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

// --- Game Objects ---
const allBuildings = [];
const allUnits = [];
const resourceNodes = [];
const projectiles = [];
const particles = [];
const trees = [];

// --- Selection ---
let selectedObjects = [];
let hoveredObject = null;

// --- Camera ---
let camTarget = new THREE.Vector3(0, 0, 0);
let camDist = 70;
let camAngle = Math.PI * 0.75;
let camHeight = 60;
let camMoving = { x: 0, z: 0 };
let keysDown = {};

// --- Input ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let mouseWorld = new THREE.Vector3();

// --- Particle System ---
class Particle {
  constructor(pos, color, life, size, vel) {
    this.pos = pos.clone();
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = size;
    this.vel = vel || new THREE.Vector3(0, 0.05, 0);
    this.mesh = new THREE.Mesh(
      new THREE.SphereGeometry(size, 4, 4),
      new THREE.MeshBasicMaterial({ color, transparent: true })
    );
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);
  }
  update(dt) {
    this.life -= dt;
    this.pos.add(this.vel.clone().multiplyScalar(dt));
    this.vel.y += 0.02 * dt;
    this.mesh.position.copy(this.pos);
    const t = this.life / this.maxLife;
    this.mesh.material.opacity = t;
    this.mesh.scale.setScalar(t);
    if (this.life <= 0) {
      scene.remove(this.mesh);
      this.mesh.geometry.dispose();
      this.mesh.material.dispose();
      return false;
    }
    return true;
  }
}

function spawnParticles(pos, color, count, life, size) {
  for (let i = 0; i < count; i++) {
    const vel = new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      Math.random() * 2,
      (Math.random() - 0.5) * 2
    );
    particles.push(new Particle(pos, color, life || 1, size || 0.3, vel));
  }
}

// --- Projectile ---
class Projectile {
  constructor(from, to, damage, color, speed, isMagic) {
    this.pos = from.clone();
    this.target = to.clone();
    this.damage = damage;
    this.speed = speed;
    this.isMagic = isMagic || false;
    this.alive = true;
    const geo = isMagic ? new THREE.SphereGeometry(0.4, 6, 6) : new THREE.SphereGeometry(0.25, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);
    this.dir = this.target.clone().sub(this.pos).normalize();
    this.travelTime = this.pos.distanceTo(this.target) / speed;
    this.age = 0;
  }
  update(dt) {
    this.age += dt;
    const t = Math.min(this.age / this.travelTime, 1);
    this.pos.lerpVectors(this.pos.clone(), this.target, dt * this.speed / Math.max(this.pos.distanceTo(this.target), 0.1));
    this.mesh.position.copy(this.pos);
    if (t >= 1) {
      this.alive = false;
      scene.remove(this.mesh);
      this.mesh.geometry.dispose();
      this.mesh.material.dispose();
    }
    return this.alive;
  }
}

// --- Building Class ---
class Building {
  constructor(type, x, z, owner) {
    this.type = type;
    this.x = x;
    this.z = z;
    this.owner = owner; // 'player' or 'enemy'
    this.y = getHeightAt(x, z);
    this.stats = UNIT_STATS[type] || { hp: 100, attack: 0, speed: 0, range: 0 };
    this.hp = this.stats.hp;
    this.maxHp = this.stats.hp;
    this.mesh = this.createMesh();
    this.mesh.position.set(x, this.y, z);
    this.mesh.userData = { building: this };
    this.lastAttackTime = 0;
    this.productionQueue = [];
    this.productionTime = 0;
    this.productionTotal = 0;
    this.research = {};
    scene.add(this.mesh);
    allBuildings.push(this);
  }

  createMesh() {
    const group = new THREE.Group();
    const s = 1;
    let geo, mat;

    if (this.type === 'citadel' || this.type === 'enemyCitadel') {
      // Main citadel - large structure
      const base = new THREE.Mesh(new THREE.BoxGeometry(8 * s, 5 * s, 8 * s), matWall);
      base.position.y = 2.5;
      base.castShadow = true;
      group.add(base);

      const roof = new THREE.Mesh(new THREE.ConeGeometry(5 * s, 4 * s, 4), this.owner === 'player' ? matRoofGold : matEnemy);
      roof.position.y = 7;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      group.add(roof);

      // Towers
      for (let i = 0; i < 4; i++) {
        const tx = (i % 2 === 0 ? -3 : 3) * s;
        const tz = (i < 2 ? -3 : 3) * s;
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.8 * s, 1 * s, 7 * s, 8), matWall);
        tower.position.set(tx, 3.5, tz);
        tower.castShadow = true;
        group.add(tower);
        const tTop = new THREE.Mesh(new THREE.ConeGeometry(1.2 * s, 2 * s, 8), this.owner === 'player' ? matRoofGold : matEnemy);
        tTop.position.set(tx, 8, tz);
        group.add(tTop);
      }

      // Flag
      const flagPole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3, 4), matWood);
      flagPole.position.y = 10;
      group.add(flagPole);
      const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1), new THREE.MeshLambertMaterial({
        color: this.owner === 'player' ? 0xffcc00 : 0x880088, side: THREE.DoubleSide
      }));
      flag.position.set(0.75, 10.5, 0);
      group.add(flag);

    } else if (this.type === 'barracks') {
      const base = new THREE.Mesh(new THREE.BoxGeometry(5 * s, 3.5 * s, 4 * s), matWood);
      base.position.y = 1.75;
      base.castShadow = true;
      group.add(base);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(3.5 * s, 2.5 * s, 4), matRoof);
      roof.position.y = 4.75;
      roof.rotation.y = Math.PI / 4;
      group.add(roof);
      // Anvil
      const anvil = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 0.6), matStone);
      anvil.position.set(2, 0.4, 2.5);
      group.add(anvil);

    } else if (this.type === 'archeryRange') {
      const base = new THREE.Mesh(new THREE.BoxGeometry(4 * s, 3 * s, 3 * s), matWood);
      base.position.y = 1.5;
      base.castShadow = true;
      group.add(base);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(3 * s, 2 * s, 4), matRoofBlue);
      roof.position.y = 4;
      roof.rotation.y = Math.PI / 4;
      group.add(roof);
      // Target dummies
      for (let i = -1; i <= 1; i++) {
        const target = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5, 8), matWood);
        target.position.set(i * 1.5, 0.75, 2.5);
        group.add(target);
      }

    } else if (this.type === 'stable') {
      const base = new THREE.Mesh(new THREE.BoxGeometry(5 * s, 3 * s, 4 * s), matWood);
      base.position.y = 1.5;
      base.castShadow = true;
      group.add(base);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(3.5 * s, 2 * s, 4), matRoof);
      roof.position.y = 4;
      roof.rotation.y = Math.PI / 4;
      group.add(roof);
      // Fence posts
      for (let i = -2; i <= 2; i++) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 4), matWood);
        post.position.set(i * 1.2, 0.75, 2.5);
        group.add(post);
      }

    } else if (this.type === 'farm') {
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          const crop = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.2, 6), new THREE.MeshLambertMaterial({ color: 0x88aa44 }));
          crop.position.set((i - 1) * 1.2, 0.6, (j - 1) * 1.2);
          group.add(crop);
        }
      }
      const fence = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 5), matWood);
      fence.position.y = 0.25;
      group.add(fence);

    } else if (this.type === 'quarry') {
      const pit = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 3, 1.5, 8), matStone);
      pit.position.y = 0.75;
      group.add(pit);
      const pile = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), matStone);
      pile.position.set(2, 0.75, 0);
      group.add(pile);

    } else if (this.type === 'lumberCamp') {
      const platform = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, 4), matWood);
      platform.position.y = 0.25;
      group.add(platform);
      // Logs
      for (let i = 0; i < 4; i++) {
        const log = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2, 8), matWood);
        log.rotation.z = Math.PI / 2;
        log.position.set(-1 + i * 0.8, 1, 0);
        group.add(log);
      }

    } else if (this.type === 'tower') {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 8, 8), matWall);
      base.position.y = 4;
      base.castShadow = true;
      group.add(base);
      const top = new THREE.Mesh(new THREE.ConeGeometry(1.8, 3, 8), this.owner === 'player' ? matRoof : matEnemy);
      top.position.y = 9.5;
      group.add(top);
      // Battlements
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const b = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.4), matWall);
        b.position.set(Math.cos(angle) * 1.3, 8.2, Math.sin(angle) * 1.3);
        group.add(b);
      }

    } else if (this.type === 'wall') {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 1), matWall);
      wall.position.y = 1.5;
      wall.castShadow = true;
      group.add(wall);
      // Battlements
      for (let i = -2; i <= 2; i += 1) {
        const b = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.2), matWall);
        b.position.set(i, 3.3, 0);
        group.add(b);
      }

    } else if (this.type === 'mageTower') {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 10, 8), matWallDark);
      base.position.y = 5;
      base.castShadow = true;
      group.add(base);
      const dome = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2), matCrystal);
      dome.position.y = 10;
      group.add(dome);
      // Crystal on top
      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.8), matCrystal);
      crystal.position.y = 12;
      crystal.rotation.y = 0;
      group.add(crystal);
      this.crystalMesh = crystal;

    } else {
      geo = new THREE.BoxGeometry(3 * s, 3 * s, 3 * s);
      mat = matStone;
      const m = new THREE.Mesh(geo, mat);
      m.position.y = 1.5;
      group.add(m);
    }

    // HP bar (hidden by default)
    const hpBarBg = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.3), new THREE.MeshBasicMaterial({ color: 0x330000 }));
    hpBarBg.position.y = 12;
    hpBarBg.rotation.x = -Math.PI / 2;
    group.add(hpBarBg);
    this.hpBarBg = hpBarBg;

    const hpBar = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.3), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
    hpBar.position.y = 12.05;
    hpBar.rotation.x = -Math.PI / 2;
    group.add(hpBar);
    this.hpBar = hpBar;

    // Selection ring
    const ringGeo = new THREE.RingGeometry(4, 4.3, 32);
    ringGeo.rotateX(-Math.PI / 2);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0, side: THREE.DoubleSide }));
    ring.position.y = 0.1;
    group.add(ring);
    this.selectionRing = ring;

    group.castShadow = true;
    return group;
  }

  takeDamage(amount) {
    this.hp -= amount;
    if (this.hp <= 0) {
      this.destroy();
      return true;
    }
    this.updateHPBar();
    return false;
  }

  updateHPBar() {
    if (this.hpBar) {
      const ratio = Math.max(0, this.hp / this.maxHp);
      this.hpBar.scale.x = ratio;
      this.hpBar.position.x = -1.5 * (1 - ratio);
      const r = ratio > 0.5 ? 0 : 1;
      const g = ratio > 0.3 ? 1 : 0.5;
      this.hpBar.material.color.setRGB(r, g, 0);
      if (this.hpBarBg) this.hpBarBg.visible = this.hp < this.maxHp;
      if (this.hpBar) this.hpBar.visible = this.hp < this.maxHp;
    }
  }

  destroy() {
    scene.remove(this.mesh);
    spawnParticles(this.mesh.position, 0x888888, 20, 1.5, 0.4);
    const idx = allBuildings.indexOf(this);
    if (idx >= 0) allBuildings.splice(idx, 1);
    // Remove from selection
    selectedObjects = selectedObjects.filter(o => o !== this);
  }

  update(dt) {
    // Tower attack
    if (this.stats.attack > 0 && this.stats.range > 0) {
      const now = gameTime;
      if (now - this.lastAttackTime > 1.5) {
        const target = this.findTarget(this.stats.range);
        if (target) {
          this.lastAttackTime = now;
          this.attackTarget(target);
        }
      }
    }

    // Production
    if (this.productionQueue.length > 0) {
      this.productionTime += dt;
      if (this.productionTime >= this.productionTotal) {
        this.productionTime = 0;
        const unitType = this.productionQueue.shift();
        this.spawnUnit(unitType);
        updateSelectionUI();
      }
    }

    // Mage tower crystal rotation
    if (this.crystalMesh) {
      this.crystalMesh.rotation.y += dt * 2;
      this.crystalMesh.position.y = 12 + Math.sin(gameTime * 3) * 0.3;
    }

    // Selection ring
    if (this.selectionRing) {
      this.selectionRing.material.opacity = selectedObjects.includes(this) ? 0.6 : 0;
    }

    // Make HP bar face camera
    if (this.hpBar) {
      this.hpBar.lookAt(camera.position);
      if (this.hpBarBg) this.hpBarBg.lookAt(camera.position);
    }
  }

  findTarget(range) {
    let closest = null;
    let closestDist = range;
    const enemies = this.owner === 'player' ? allUnits.filter(u => u.owner === 'enemy') : allUnits.filter(u => u.owner === 'player');
    for (const e of enemies) {
      const d = dist2d(this.x, this.z, e.x, e.z);
      if (d < closestDist) {
        closestDist = d;
        closest = e;
      }
    }
    // Also check buildings
    const enemyBuildings = this.owner === 'player' ? allBuildings.filter(b => b.owner === 'enemy') : allBuildings.filter(b => b.owner === 'player');
    for (const b of enemyBuildings) {
      const d = dist2d(this.x, this.z, b.x, b.z);
      if (d < closestDist) {
        closestDist = d;
        closest = b;
      }
    }
    return closest;
  }

  attackTarget(target) {
    const color = this.type === 'mageTower' ? 0xaa44ff : 0xffaa44;
    const isMagic = this.type === 'mageTower';
    const from = new THREE.Vector3(this.x, this.y + 6, this.z);
    const to = new THREE.Vector3(target.x || target.mesh.position.x, target.y || 1, target.z || target.mesh.position.z);
    projectiles.push(new Projectile(from, to, this.stats.attack, color, 25, isMagic));
  }

  queueUnit(type) {
    const cost = UNIT_COSTS[type];
    if (!cost) return false;
    if (resources.wood < (cost.wood || 0) || resources.stone < (cost.stone || 0) ||
        resources.food < (cost.food || 0) || resources.gold < (cost.gold || 0)) return false;
    resources.wood -= (cost.wood || 0);
    resources.stone -= (cost.stone || 0);
    resources.food -= (cost.food || 0);
    resources.gold -= (cost.gold || 0);
    this.productionQueue.push(type);
    this.productionTotal = 8;
    this.productionTime = 0;
    showMessage(`Training ${type}...`);
    return true;
  }

  spawnUnit(type) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 4 + Math.random() * 2;
    const ux = this.x + Math.cos(angle) * dist;
    const uz = this.z + Math.sin(angle) * dist;
    new Unit(type, ux, uz, this.owner);
  }
}

// --- Unit Class ---
class Unit {
  constructor(type, x, z, owner) {
    this.type = type;
    this.x = x;
    this.z = z;
    this.y = getHeightAt(x, z);
    this.owner = owner;
    this.stats = UNIT_STATS[type] || { hp: 50, attack: 5, speed: 3, range: 2, damageType: 'melee' };
    this.hp = this.stats.hp;
    this.maxHp = this.stats.hp;
    this.targetPos = null;
    this.targetUnit = null;
    this.gathering = null;
    this.returning = false;
    this.carryAmount = 0;
    this.lastAttackTime = 0;
    this.attackCooldown = 1;
    this.state = 'idle';
    this.mesh = this.createMesh();
    this.mesh.position.set(x, this.y, z);
    this.mesh.userData = { unit: this };
    this.facing = 0;
    this.walkCycle = Math.random() * Math.PI * 2;
    scene.add(this.mesh);
    allUnits.push(this);
    if (owner === 'player') {
      popCap.current += (this.stats.popCost || 1);
    }
  }

  createMesh() {
    const group = new THREE.Group();
    const isPlayer = this.owner === 'player';
    const s = 0.8;

    let bodyMat, accentMat;
    if (this.type === 'worker') { bodyMat = matPlayerUnitAlt; accentMat = matWood; }
    else if (this.type === 'swordsman') { bodyMat = matPlayerUnit; accentMat = matStone; }
    else if (this.type === 'archer') { bodyMat = matArcherUnit; accentMat = matWood; }
    else if (this.type === 'knight') { bodyMat = matKnightUnit; accentMat = matGold; }
    else if (this.type === 'battleMage') { bodyMat = matMageUnit; accentMat = matCrystal; }
    else if (this.type === 'shadow') { bodyMat = matEnemy; accentMat = matEnemyDark; }
    else if (this.type === 'wraith') { bodyMat = matEnemy; accentMat = new THREE.MeshLambertMaterial({ color: 0x663399 }); }
    else if (this.type === 'beast') { bodyMat = matEnemyDark; accentMat = new THREE.MeshLambertMaterial({ color: 0x553333 }); }
    else if (this.type === 'dreadKnight') { bodyMat = matEnemyDark; accentMat = matEnemy; }
    else if (this.type === 'darkMage') { bodyMat = matEnemy; accentMat = new THREE.MeshLambertMaterial({ color: 0x4400aa }); }
    else if (this.type === 'heroCommander') { bodyMat = matEnemyDark; accentMat = new THREE.MeshLambertMaterial({ color: 0xff4444 }); }
    else { bodyMat = matStone; accentMat = matWood; }

    // Body
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * s, 0.5 * s, 1.4 * s, 8), bodyMat);
    body.position.y = 0.7;
    body.castShadow = true;
    group.add(body);
    this.bodyMesh = body;

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35 * s, 8, 8), bodyMat);
    head.position.y = 1.6;
    head.castShadow = true;
    group.add(head);
    this.headMesh = head;

    // Weapon/feature
    if (this.type === 'swordsman' || this.type === 'shadow' || this.type === 'dreadKnight' || this.type === 'heroCommander') {
      const sword = new THREE.Mesh(new THREE.BoxGeometry(0.15 * s, 1.2 * s, 0.1 * s), accentMat);
      sword.position.set(0.5, 1, 0.2);
      sword.rotation.z = -0.2;
      group.add(sword);
    }
    if (this.type === 'archer' || this.type === 'wraith') {
      const bow = new THREE.Mesh(new THREE.TorusGeometry(0.4 * s, 0.05, 4, 8, Math.PI), accentMat);
      bow.position.set(0.5, 1.2, 0);
      bow.rotation.z = Math.PI / 2;
      group.add(bow);
    }
    if (this.type === 'knight') {
      // Shield
      const shield = new THREE.Mesh(new THREE.BoxGeometry(0.6 * s, 0.8 * s, 0.15 * s), accentMat);
      shield.position.set(-0.5, 0.9, 0.3);
      group.add(shield);
      // Lance
      const lance = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.5, 4), matWood);
      lance.position.set(0.4, 1.2, 0.5);
      lance.rotation.x = Math.PI / 3;
      group.add(lance);
    }
    if (this.type === 'battleMage' || this.type === 'darkMage') {
      const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2, 4), accentMat);
      staff.position.set(0.5, 1, -0.3);
      group.add(staff);
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 6), new THREE.MeshBasicMaterial({ color: isPlayer ? 0x8844ff : 0xff2222 }));
      orb.position.set(0.5, 2.1, -0.3);
      group.add(orb);
      this.staffOrb = orb;
    }
    if (this.type === 'beast') {
      // Horns
      for (let side = -1; side <= 1; side += 2) {
        const horn = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.5, 4), accentMat);
        horn.position.set(side * 0.3, 2, 0);
        horn.rotation.z = side * -0.3;
        group.add(horn);
      }
    }
    if (this.type === 'heroCommander') {
      // Crown
      const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.3, 6), matGold);
      crown.position.y = 2;
      group.add(crown);
      // Cape
      const cape = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.1), new THREE.MeshLambertMaterial({ color: 0x880000 }));
      cape.position.set(0, 0.8, -0.4);
      group.add(cape);
    }

    // Selection ring
    const ringGeo = new THREE.RingGeometry(0.8, 1.0, 16);
    ringGeo.rotateX(-Math.PI / 2);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0, side: THREE.DoubleSide }));
    ring.position.y = 0.05;
    group.add(ring);
    this.selectionRing = ring;

    // HP bar
    const hpBarBg = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.15), new THREE.MeshBasicMaterial({ color: 0x330000 }));
    hpBarBg.position.y = 2.3;
    hpBarBg.rotation.x = -Math.PI / 2;
    group.add(hpBarBg);
    this.hpBarBg = hpBarBg;

    const hpBar = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.15), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
    hpBar.position.y = 2.35;
    hpBar.rotation.x = -Math.PI / 2;
    group.add(hpBar);
    this.hpBar = hpBar;

    return group;
  }

  takeDamage(amount, attacker) {
    this.hp -= amount;
    if (this.hp <= 0) {
      this.destroy();
      return true;
    }
    this.updateHPBar();
    spawnParticles(this.mesh.position, 0xff4444, 3, 0.5, 0.2);
    // Target the attacker if melee
    if (attacker && this.stats.range <= 3) {
      this.targetUnit = attacker;
    }
    return false;
  }

  updateHPBar() {
    if (this.hpBar) {
      const ratio = Math.max(0, this.hp / this.maxHp);
      this.hpBar.scale.x = ratio;
      this.hpBar.position.x = -0.6 * (1 - ratio);
      const r = ratio > 0.5 ? 0 : 1;
      const g = ratio > 0.3 ? 1 : 0.5;
      this.hpBar.material.color.setRGB(r, g, 0);
      this.hpBar.visible = this.hp < this.maxHp;
      this.hpBarBg.visible = this.hp < this.maxHp;
    }
  }

  destroy() {
    scene.remove(this.mesh);
    spawnParticles(this.mesh.position, this.owner === 'player' ? 0x4488cc : 0x663366, 10, 1, 0.3);
    const idx = allUnits.indexOf(this);
    if (idx >= 0) allUnits.splice(idx, 1);
    selectedObjects = selectedObjects.filter(o => o !== this);
    if (this.owner === 'player') {
      popCap.current -= (this.stats.popCost || 1);
    }
  }

  update(dt) {
    this.y = getHeightAt(this.x, this.z);
    this.mesh.position.y = this.y;

    // Selection ring
    if (this.selectionRing) {
      this.selectionRing.material.opacity = selectedObjects.includes(this) ? 0.6 : 0;
    }

    // HP bar face camera
    if (this.hpBar) {
      this.hpBar.lookAt(camera.position);
      if (this.hpBarBg) this.hpBarBg.lookAt(camera.position);
    }

    // Staff orb animation
    if (this.staffOrb) {
      this.staffOrb.position.y = 2.1 + Math.sin(gameTime * 4) * 0.2;
    }

    // State machine
    if (this.gathering) {
      this.updateGathering(dt);
    } else if (this.targetUnit && this.targetUnit.hp > 0) {
      this.updateCombat(dt);
    } else if (this.targetPos) {
      this.updateMovement(dt);
    }

    // Walk animation
    if (this.targetPos || (this.targetUnit && this.targetUnit.hp > 0) || this.gathering) {
      this.walkCycle += dt * 8;
      this.bodyMesh.position.y = 0.7 + Math.abs(Math.sin(this.walkCycle)) * 0.15;
      this.headMesh.position.y = 1.6 + Math.abs(Math.sin(this.walkCycle)) * 0.1;
    }

    // Auto-attack nearby enemies
    if (!this.targetUnit && this.stats.attack > 0) {
      const enemies = this.owner === 'player' ?
        [...allUnits.filter(u => u.owner === 'enemy'), ...allBuildings.filter(b => b.owner === 'enemy')] :
        [...allUnits.filter(u => u.owner === 'player'), ...allBuildings.filter(b => b.owner === 'player')];
      for (const e of enemies) {
        const d = dist2d(this.x, this.z, e.x || e.mesh.position.x, e.z || e.mesh.position.z);
        if (d < this.stats.range + 1) {
          this.targetUnit = e;
          break;
        }
      }
    }
  }

  updateMovement(dt) {
    const tx = this.targetPos.x;
    const tz = this.targetPos.z;
    const dx = tx - this.x;
    const dz = tz - this.z;
    const dist = Math.sqrt(dx * dx + dz * dz);

    if (dist < 0.5) {
      this.targetPos = null;
      return;
    }

    const speed = this.stats.speed * dt;
    const nx = dx / dist;
    const nz = dz / dist;
    this.x += nx * Math.min(speed, dist);
    this.z += nz * Math.min(speed, dist);
    this.facing = Math.atan2(nx, nz);
    this.mesh.rotation.y = this.facing;

    // Separation
    const allies = allUnits.filter(u => u !== this && u.owner === this.owner);
    for (const a of allies) {
      const ad = dist2d(this.x, this.z, a.x, a.z);
      if (ad < 1.5) {
        const push = (1.5 - ad) / 1.5 * 0.5;
        const pdx = this.x - a.x;
        const pdz = this.z - a.z;
        const pd = Math.sqrt(pdx * pdx + pdz * pdz) || 1;
        this.x += (pdx / pd) * push * dt;
        this.z += (pdz / pd) * push * dt;
      }
    }
  }

  updateGathering(dt) {
    const node = this.gathering;
    if (!node || !node.mesh) {
      this.gathering = null;
      this.carryAmount = 0;
      return;
    }

    if (this.returning) {
      // Find citadel
      const citadel = allBuildings.find(b => (b.type === 'citadel' && b.owner === 'player') || (b.type === 'enemyCitadel' && b.owner === 'enemy'));
      if (!citadel) { this.returning = false; this.gathering = null; return; }
      const dx = citadel.x - this.x;
      const dz = citadel.z - this.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < 3) {
        // Deposit
        if (this.owner === 'player') {
          resources[node.resourceType] += this.carryAmount;
        }
        this.carryAmount = 0;
        this.returning = false;
        this.gathering = node;
      } else {
        const speed = this.stats.speed * dt;
        this.x += (dx / dist) * Math.min(speed, dist);
        this.z += (dz / dist) * Math.min(speed, dist);
        this.facing = Math.atan2(dx / dist, dz / dist);
        this.mesh.rotation.y = this.facing;
      }
    } else {
      // Move toward node
      const dx = node.x - this.x;
      const dz = node.z - this.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist > GATHER_RADIUS) {
        const speed = this.stats.speed * dt;
        this.x += (dx / dist) * Math.min(speed, dist);
        this.z += (dz / dist) * Math.min(speed, dist);
        this.facing = Math.atan2(dx / dist, dz / dist);
        this.mesh.rotation.y = this.facing;
      } else {
        // Gather
        this.carryAmount += GATHER_RATE * dt * difficulty.econMult;
        if (this.carryAmount >= node.maxCarry || node.amount <= 0) {
          this.returning = true;
        }
        node.amount -= GATHER_RATE * dt * difficulty.econMult;
        if (node.amount <= 0) {
          node.amount = 0;
          this.gathering = null;
          this.carryAmount = 0;
          if (node.deplete) node.deplete();
        }
      }
    }
  }

  updateCombat(dt) {
    const target = this.targetUnit;
    const tx = target.x || target.mesh.position.x;
    const tz = target.z || target.mesh.position.z;
    const dx = tx - this.x;
    const dz = tz - this.z;
    const dist = Math.sqrt(dx * dx + dz * dz);

    if (dist > this.stats.range) {
      // Move toward target
      const speed = this.stats.speed * dt;
      this.x += (dx / dist) * Math.min(speed, dist);
      this.z += (dz / dist) * Math.min(speed, dist);
      this.facing = Math.atan2(dx / dist, dz / dist);
      this.mesh.rotation.y = this.facing;
    } else {
      // Attack
      if (gameTime - this.lastAttackTime > this.attackCooldown) {
        this.lastAttackTime = gameTime;
        if (this.stats.range > 3) {
          // Ranged attack
          const from = new THREE.Vector3(this.x, this.y + 1.5, this.z);
          const to = new THREE.Vector3(tx, (target.y || 1) + 1, tz);
          const color = this.stats.damageType === 'magic' ? 0xaa44ff :
                        this.stats.damageType === 'ranged                         this.stats.damageType === 'melee' ? 0xffaa44 : 0xffffff;
          projectiles.push(new Projectile(from, to, this.stats.attack, color, 20, this.stats.damageType === 'magic'));
          spawnParticles(to, color, 3, 0.3, 0.2);
        } else {
          // Melee attack
          const destroyed = target.takeDamage(this.stats.attack, this);
          if (destroyed && target.destroy) {
            // Target already destroyed
          }
          spawnParticles(this.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xffaa44, 5, 0.4, 0.15);
        }
      }
      this.facing = Math.atan2(dx / dist, dz / dist);
      this.mesh.rotation.y = this.facing;
    }
  }

  moveTarget(x, z) {
    this.targetPos = { x, z };
    this.targetUnit = null;
    this.gathering = null;
    this.returning = false;
    this.carryAmount = 0;
  }

  attackTarget(unit) {
    this.targetUnit = unit;
    this.targetPos = null;
    this.gathering = null;
    this.returning = false;
    this.carryAmount = 0;
  }

  gatherNode(node) {
    this.gathering = node;
    this.targetPos = null;
    this.targetUnit = null;
    this.returning = false;
    this.carryAmount = 0;
  }
}

// --- Resource Node Class ---
class ResourceNode {
  constructor(type, x, z, amount) {
    this.type = type;
    this.x = x;
    this.z = z;
    this.y = getHeightAt(x, z);
    this.amount = amount;
    this.maxCarry = 20;
    this.resourceType = type;
    this.mesh = this.createMesh();
    this.mesh.position.set(x, this.y, z);
    this.mesh.userData = { resourceNode: this };
    scene.add(this.mesh);
    resourceNodes.push(this);
  }

  createMesh() {
    const group = new THREE.Group();

    if (this.type === 'wood') {
      // Tree
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3, 6), matWood);
      trunk.position.y = 1.5;
      trunk.castShadow = true;
      group.add(trunk);
      const foliage = new THREE.Mesh(new THREE.SphereGeometry(1.8, 8, 6), new THREE.MeshLambertMaterial({ color: 0x3a7a2a }));
      foliage.position.y = 4;
      foliage.castShadow = true;
      group.add(foliage);
      const foliage2 = new THREE.Mesh(new THREE.SphereGeometry(1.3, 8, 6), new THREE.MeshLambertMaterial({ color: 0x4a8a3a }));
      foliage2.position.set(0.5, 4.5, 0.3);
      foliage2.castShadow = true;
      group.add(foliage2);
      trees.push(group);
    } else if (this.type === 'stone') {
      // Rock cluster
      for (let i = 0; i < 5; i++) {
        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.5 + Math.random() * 0.5, 1),
          matStone
        );
        rock.position.set(
          (Math.random() - 0.5) * 2,
          0.4 + Math.random() * 0.3,
          (Math.random() - 0.5) * 2
        );
        rock.rotation.set(Math.random(), Math.random(), Math.random());
        rock.castShadow = true;
        group.add(rock);
      }
    } else if (this.type === 'food') {
      // Berry bushes
      for (let i = 0; i < 4; i++) {
        const bush = new THREE.Mesh(
          new THREE.SphereGeometry(0.6, 6, 6),
          new THREE.MeshLambertMaterial({ color: 0x558833 })
        );
        bush.position.set(
          (Math.random() - 0.5) * 2,
          0.4,
          (Math.random() - 0.5) * 2
        );
        bush.castShadow = true;
        group.add(bush);
        // Berries
        for (let j = 0; j < 5; j++) {
          const berry = new THREE.Mesh(
            new THREE.SphereGeometry(0.1, 4, 4),
            new THREE.MeshLambertMaterial({ color: 0xcc2222 })
          );
          berry.position.set(
            bush.position.x + (Math.random() - 0.5) * 0.6,
            bush.position.y + 0.3 + Math.random() * 0.3,
            bush.position.z + (Math.random() - 0.5) * 0.6
          );
          group.add(berry);
        }
      }
    } else if (this.type === 'gold') {
      // Gold deposit
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(2, 0.8, 2),
        matStone
      );
      base.position.y = 0.4;
      group.add(base);
      const gold = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.5, 1.5),
        matGold
      );
      gold.position.y = 0.9;
      gold.castShadow = true;
      group.add(gold);
      // Sparkle
      const sparkle = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.3),
        new THREE.MeshBasicMaterial({ color: 0xffee44, transparent: true, opacity: 0.6 })
      );
      sparkle.position.y = 1.5;
      group.add(sparkle);
      this.sparkleMesh = sparkle;
    }

    // Amount indicator
    const amountGeo = new THREE.TextGeometry ? null : null;
    // Simple floating indicator using a small plane with color
    const indicator = new THREE.Mesh(
      new THREE.PlaneGeometry(0.8, 0.8),
      new THREE.MeshBasicMaterial({
        color: this.type === 'wood' ? 0x3a7a2a :
               this.type === 'stone' ? 0x8a8a8a :
               this.type === 'food' ? 0xcc2222 : 0xddaa22,
        transparent: true, opacity: 0.7, side: THREE.DoubleSide
      })
    );
    indicator.position.y = 5.5;
    indicator.rotation.x = -Math.PI / 2;
    group.add(indicator);
    this.indicator = indicator;

    // Selection ring
    const ringGeo = new THREE.RingGeometry(2, 2.3, 16);
    ringGeo.rotateX(-Math.PI / 2);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0, side: THREE.DoubleSide }));
    ring.position.y = 0.1;
    group.add(ring);
    this.selectionRing = ring;

    return group;
  }

  deplete() {
    scene.remove(this.mesh);
    const idx = resourceNodes.indexOf(this);
    if (idx >= 0) resourceNodes.splice(idx, 1);
  }

  update(dt) {
    if (this.sparkleMesh) {
      this.sparkleMesh.rotation.y += dt * 3;
      this.sparkleMesh.position.y = 1.5 + Math.sin(gameTime * 2) * 0.3;
    }
    if (this.indicator) {
      this.indicator.lookAt(camera.position);
      const ratio = Math.max(0, this.amount / (this.type === 'wood' ? 200 : this.type === 'stone' ? 150 : this.type === 'food' ? 100 : 80));
      this.indicator.material.opacity = 0.3 + ratio * 0.5;
    }
    if (this.selectionRing) {
      this.selectionRing.material.opacity = selectedObjects.includes(this) ? 0.6 : 0;
    }
  }
}

// --- Fog of War ---
const fowGrid = {};
const FOW_CELL = 8;

function getFowKey(x, z) {
  return `${Math.floor(x / FOW_CELL)},${Math.floor(z / FOW_CELL)}`;
}

function updateFogOfWar() {
  // Clear revealed cells
  for (const key in fowGrid) {
    if (fowGrid[key].timer) fowGrid[key].timer -= 1;
    if (fowGrid[key].timer <= 0) delete fowGrid[key];
  }

  // Reveal around player buildings and units
  const playerVisionSources = [
    ...allBuildings.filter(b => b.owner === 'player'),
    ...allUnits.filter(u => u.owner === 'player')
  ];
  for (const src of playerVisionSources) {
    const sx = src.x || src.mesh.position.x;
    const sz = src.z || src.mesh.position.z;
    const radius = src instanceof Building ? 30 : 25;
    for (let dx = -radius; dx <= radius; dx += FOW_CELL) {
      for (let dz = -radius; dz <= radius; dz += FOW_CELL) {
        const wx = sx + dx;
        const wz = sz + dz;
        if (dist2d(wx, wz, sx, sz) <= radius) {
          const key = getFowKey(wx, wz);
          if (!fowGrid[key]) fowGrid[key] = { timer: 0 };
          fowGrid[key].timer = 2;
        }
      }
    }
  }
}

function isRevealed(x, z) {
  const key = getFowKey(x, z);
  return fowGrid[key] !== undefined;
}

// --- Terrain Decoration ---
function addTerrainDecorations() {
  // Add decorative rocks
  for (let i = 0; i < 80; i++) {
    const x = (Math.random() - 0.5) * MAP_SIZE * 0.85;
    const z = (Math.random() - 0.5) * MAP_SIZE * 0.85;
    const d = Math.sqrt(x * x + z * z);
    if (d < 15) continue;
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.7, 0),
      matStone
    );
    rock.position.set(x, getHeightAt(x, z) + 0.2, z);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    scene.add(rock);
  }

  // Add decorative flowers
  for (let i = 0; i < 60; i++) {
    const x = (Math.random() - 0.5) * MAP_SIZE * 0.8;
    const z = (Math.random() - 0.5) * MAP_SIZE * 0.8;
    const d = Math.sqrt(x * x + z * z);
    if (d < 12) continue;
    const flower = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 4, 4),
      new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0xffaa44 : 0xff66aa })
    );
    flower.position.set(x, getHeightAt(x, z) + 0.3, z);
    scene.add(flower);
  }

  // Add small bushes
  for (let i = 0; i < 50; i++) {
    const x = (Math.random() - 0.5) * MAP_SIZE * 0.85;
    const z = (Math.random() - 0.5) * MAP_SIZE * 0.85;
    const d = Math.sqrt(x * x + z * z);
    if (d < 15) continue;
    const bush = new THREE.Mesh(
      new THREE.SphereGeometry(0.4 + Math.random() * 0.4, 6, 6),
      new THREE.MeshLambertMaterial({ color: 0x4a7a2a })
    );
    bush.position.set(x, getHeightAt(x, z) + 0.3, z);
    bush.castShadow = true;
    scene.add(bush);
  }
}

// --- Initial Map Setup ---
function initMap() {
  // Player citadel at origin
  new Building('citadel', 0, 0, 'player');

  // Enemy citadel
  const enemyX = MAP_SIZE * 0.35;
  const enemyZ = -MAP_SIZE * 0.15;
  new Building('enemyCitadel', enemyX, enemyZ, 'enemy');

  // Player starting buildings
  new Building('barracks', -8, -6, 'player');
  new Building('archeryRange', 8, -6, 'player');
  new Building('farm', -8, 8, 'player');

  // Enemy starting buildings
  new Building('barracks', enemyX - 8, enemyZ - 6, 'enemy');
  new Building('archeryRange', enemyX + 8, enemyZ - 6, 'enemy');

  // Resource nodes - wood
  const woodPositions = [
    [-25, -15], [-30, 10], [-20, 25], [-35, -5], [-28, 20],
    [15, -30], [-15, -35], [-40, 15], [-22, -28], [-38, -20]
  ];
  for (const pos of woodPositions) {
    new ResourceNode('wood', pos[0], pos[1], 200);
  }

  // Resource nodes - stone
  const stonePositions = [
    [25, -10], [30, 15], [20, 30], [35, 5], [28, -25],
    [-5, 35], [10, 40], [40, 20], [22, 12], [32, -5]
  ];
  for (const pos of stonePositions) {
    new ResourceNode('stone', pos[0], pos[1], 150);
  }

  // Resource nodes - food
  const foodPositions = [
    [-15, -25], [20, 20], [-30, -30], [35, -20], [10, -15],
    [-10, 20], [25, 35], [-20, 30], [5, 15], [30, 25]
  ];
  for (const pos of foodPositions) {
    new ResourceNode('food', pos[0], pos[1], 100);
  }

  // Resource nodes - gold
  const goldPositions = [
    [40, 10], [-45, -10], [15, 45], [-35, 35], [45, -35]
  ];
  for (const pos of goldPositions) {
    new ResourceNode('gold', pos[0], pos[1], 80);
  }

  // Starting workers
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const u = new Unit('worker', Math.cos(angle) * 5, Math.sin(angle) * 5, 'player');
    // Assign to nearest resource
    const sorted = resourceNodes.sort((a, b) => dist2d(u.x, u.z, a.x, a.z) - dist2d(u.x, u.z, b.x, b.z));
    if (sorted.length > 0) u.gatherNode(sorted[0]);
  }

  // Starting military units
  for (let i = 0; i < 3; i++) {
    new Unit('swordsman', -3 + i * 2, 5, 'player');
  }
  for (let i = 0; i < 2; i++) {
    new Unit('archer', -3 + i * 3, 8, 'player');
  }

  addTerrainDecorations();
}

// --- Enemy AI ---
let aiResources = { wood: 200, stone: 150, food: 150, gold: 100 };
let aiBuildQueue = [];
let aiUnitQueue = [];
let aiWaveUnits = [];
let aiGatherers = [];

function updateAI(dt) {
  const aiBuildings = allBuildings.filter(b => b.owner === 'enemy');
  const aiUnits = allUnits.filter(u => u.owner === 'enemy');
  const playerBuildings = allBuildings.filter(b => b.owner === 'player');
  const playerUnits = allUnits.filter(u => u.owner === 'player');

  const citadel = aiBuildings.find(b => b.type === 'enemyCitadel');
  if (!citadel) return;

  // Build economy buildings
  if (aiResources.wood >= 30 && !aiBuildings.find(b => b.type === 'farm' && b.owner === 'enemy')) {
    const pos = { x: citadel.x + 10 + Math.random() * 5, z: citadel.z + 10 + Math.random() * 5 };
    aiResources.wood -= 30;
    new Building('farm', pos.x, pos.z, 'enemy');
  }

  // Build military buildings
  const aiBarracks = aiBuildings.find(b => b.type === 'barracks');
  const aiArcheryRange = aiBuildings.find(b => b.type === 'archeryRange');

  // Train units
  if (aiBarracks && aiResources.food >= 25 && aiResources.gold >= 15) {
    aiResources.food -= 25;
    aiResources.gold -= 15;
    aiBarracks.queueUnit('shadow');
  }
  if (aiArcheryRange && aiResources.food >= 20 && aiResources.gold >= 20) {
    aiResources.food -= 20;
    aiResources.gold -= 20;
    aiArcheryRange.queueUnit('wraith');
  }

  // AI gatherers
  const aiCitadel = aiBuildings.find(b => b.type === 'enemyCitadel');
  if (aiCitadel) {
    // Create gatherers if needed
    const aiWorkers = aiUnits.filter(u => u.type === 'shadow' && u.gathering);
    if (aiWorkers.length < 3 && aiResources.food >= 15) {
      aiResources.food -= 15;
      const u = new Unit('shadow', citadel.x + Math.random() * 5, citadel.z + Math.random() * 5, 'enemy');
      const sorted = resourceNodes.sort((a, b) => dist2d(u.x, u.z, a.x, a.z) - dist2d(u.x, u.z, b.x, b.z));
      if (sorted.length > 0) {
        u.gatherNode(sorted[0]);
        aiGatherers.push(u);
      }
    }

    // AI gatherers bring resources back
    for (const w of aiGatherers) {
      if (w.carryAmount >= w.maxCarry) {
        const resType = w.gathering ? w.gathering.resourceType : 'food';
        aiResources[resType] = (aiResources[resType] || 0) + w.carryAmount;
        w.carryAmount = 0;
        w.returning = true;
      }
      if (w.returning && dist2d(w.x, w.z, citadel.x, citadel.z) < 5) {
        const resType = w.gathering ? w.gathering.resourceType : 'food';
        aiResources[resType] = (aiResources[resType] || 0) + w.carryAmount;
        w.carryAmount = 0;
        w.returning = false;
        if (w.gathering && w.gathering.amount > 0) {
          w.gatherNode(w.gathering);
        }
      }
    }
  }

  // AI attacks
  if (!waveActive && gameTime > nextWaveTime) {
    triggerWave();
  }

  // AI unit behavior
  for (const u of aiUnits) {
    if (u.type === 'shadow' && !u.gathering && !u.targetUnit) {
      // Move toward player
      const target = playerBuildings.length > 0 ? playerBuildings[0] :
                     playerUnits.length > 0 ? playerUnits[0] :
                     { x: 0, z: 0 };
      if (u.targetPos) {
        const d = dist2d(u.x, u.z, u.targetPos.x, u.targetPos.z);
        if (d > 2) {
          continue; // Let updateMovement handle it
        }
      }
      u.moveTarget(target.x + (Math.random() - 0.5) * 5, target.z + (Math.random() - 0.5) * 5);
    }
  }
}

// --- Wave System ---
function triggerWave() {
  waveNumber++;
  waveActive = true;
  nextWaveTime = gameTime + difficulty.waveInterval;

  const multiplier = difficulty.spawnMult;
  const waveMultiplier = 1 + (waveNumber - 1) * 0.25;

  const enemyCitadel = allBuildings.find(b => b.type === 'enemyCitadel');
  if (!enemyCitadel) return;

  // Show wave banner
  const banner = document.getElementById('wave-banner');
  banner.textContent = `⚠ Wave ${waveNumber} ⚠`;
  banner.style.display = 'block';
  banner.style.animation = 'none';
  banner.offsetHeight;
  banner.style.animation = 'wavePulse 2s forwards';
  setTimeout(() => banner.style.display = 'none', 2000);

  showMessage(`Enemy Wave ${waveNumber} incoming!`);

  // Determine unit composition based on wave number
  const unitsToSpawn = [];
  const baseCount = Math.floor(3 + waveNumber * 1.5) * multiplier;

  if (waveNumber <= 2) {
    // Light units
    for (let i = 0; i < baseCount; i++) unitsToSpawn.push('shadow');
  } else if (waveNumber <= 4) {
    // Mixed light
    for (let i = 0; i < baseCount * 0.6; i++) unitsToSpawn.push('shadow');
    for (let i = 0; i < baseCount * 0.4; i++) unitsToSpawn.push('wraith');
  } else if (waveNumber <= 7) {
    // Heavier units
    for (let i = 0; i < baseCount * 0.3; i++) unitsToSpawn.push('shadow');
    for (let i = 0; i < baseCount * 0.3; i++) unitsToSpawn.push('wraith');
    for (let i = 0; i < baseCount * 0.3; i++) unitsToSpawn.push('beast');
    for (let i = 0; i < Math.floor(baseCount * 0.1); i++) unitsToSpawn.push('dreadKnight');
  } else if (waveNumber <= 10) {
    // Elite units
    for (let i = 0; i < baseCount * 0.2; i++) unitsToSpawn.push('shadow');
    for (let i = 0; i < baseCount * 0.2; i++) unitsToSpawn.push('wraith');
    for (let i = 0; i < baseCount * 0.3; i++) unitsToSpawn.push('beast');
    for (let i = 0; i < baseCount * 0.2; i++) unitsToSpawn.push('dreadKnight');
    for (let i = 0; i < Math.floor(baseCount * 0.1); i++) unitsToSpawn.push('darkMage');
  } else {
    // Boss waves
    for (let i = 0; i < baseCount * 0.3; i++) unitsToSpawn.push('shadow');
    for (let i = 0; i < baseCount * 0.2; i++) unitsToSpawn.push('wraith');
    for (let i = 0; i < baseCount * 0.25; i++) unitsToSpawn.push('beast');
    for (let i = 0; i < baseCount * 0.15; i++) unitsToSpawn.push('dreadKnight');
    for (let i = 0; i < Math.floor(baseCount * 0.1); i++) unitsToSpawn.push('darkMage');
    if (waveNumber % 5 === 0) {
      unitsToSpawn.push('heroCommander');
      showMessage('⚠ The Umbral Commander approaches! ⚠');
    }
  }

  // Spawn units with delays
  let spawnIndex = 0;
  const spawnInterval = setInterval(() => {
    if (spawnIndex >= unitsToSpawn.length || gameOver) {
      clearInterval(spawnInterval);
      return;
    }
    const type = unitsToSpawn[spawnIndex];
    const angle = Math.random() * Math.PI * 2;
    const dist = 8 + Math.random() * 5;
    const u = new Unit(type, enemyCitadel.x + Math.cos(angle) * dist, enemyCitadel.z + Math.sin(angle) * dist, 'enemy');

    // Apply wave scaling
    u.maxHp = Math.floor(u.maxHp * waveMultiplier);
    u.hp = u.maxHp;
    u.stats.hp = u.maxHp;
    u.stats.attack = Math.floor(u.stats.attack * (1 + waveNumber * 0.05));

    // Attack nearest player building or unit
    const playerTargets = [
      ...allBuildings.filter(b => b.owner === 'player'),
      ...allUnits.filter(u => u.owner === 'player')
    ];
    if (playerTargets.length > 0) {
      const target = playerTargets.reduce((closest, t) => {
        const d = dist2d(u.x, u.z, t.x || t.mesh.position.x, t.z || t.mesh.position.z);
        const cd = dist2d(u.x, u.z, closest.x || closest.mesh.position.x, closest.z || closest.mesh.position.z);
        return d < cd ? t : closest;
      });
      u.attackTarget(target);
    }

    spawnIndex++;
  }, 400);

  // After all units spawn, mark wave as complete
  setTimeout(() => {
    if (spawnIndex >= unitsToSpawn.length) {
      waveActive = false;
      // Check victory condition
      checkVictoryConditions();
    }
  }, spawnIndex * 400 + 1000);
}

function checkVictoryConditions() {
  const playerCitadel = allBuildings.find(b => b.type === 'citadel' && b.owner === 'player');
  const enemyCitadel = allBuildings.find(b => b.type === 'enemyCitadel' && b.owner === 'enemy');

  if (!playerCitadel) {
    endGame(false);
    return;
  }
  if (!enemyCitadel) {
    endGame(true);
    return;
  }
}

function endGame(victory) {
  gameOver = true;
  const screen = document.getElementById('game-over-screen');
  screen.style.display = 'flex';
  const title = document.getElementById('go-title');
  const subtitle = document.getElementById('go-subtitle');
  const stats = document.getElementById('go-stats');

  if (victory) {
    title.textContent = '⚔ VICTORY ⚔';
    title.style.color = '#ffd700';
    subtitle.textContent = 'The Umbral Horde has been vanquished! Aurelion stands triumphant!';
  } else {
    title.textContent = '💀 DEFEAT 💀';
    title.style.color = '#cc4444';
    subtitle.textContent = 'The Umbral Horde has consumed Aurelion. The kingdom falls to darkness.';
  }
  stats.textContent = `Survived ${dayCount} days · ${waveNumber} waves repelled · ${Math.floor(gameTime / 60)} minutes`;
}

function updateSelectionUI() {
  const nameEl = document.getElementById('selection-name');
  const descEl = document.getElementById('selection-desc');

  if (selectedObjects.length === 0) {

    descEl.textContent = 'Click to select units or buildings';
    statsEl.textContent = '';
    btnsEl.innerHTML = '';
    return;
  }

  const obj = selectedObjects[0];

  if (obj instanceof Building) {
    nameEl.textContent = obj.type.charAt(0).toUpperCase() + obj.type.slice(1).replace(/([A-Z])/g, ' $1');
    descEl.textContent = `${obj.owner === 'player' ? 'Friendly' : 'Enemy'} ${obj.type}`;
    statsEl.innerHTML = `HP: ${Math.floor(obj.hp)}/${obj.maxHp}`;

    btnsEl.innerHTML = '';
    if (obj.owner === 'player') {
      if (obj.type === 'barracks') {
        addActionButton(btnsEl, 'Train Swordsman', 'food:25 gold:15', () => obj.queueUnit('swordsman'));
        addActionButton(btnsEl, 'Train Knight', 'food:40 gold:35', () => obj.queueUnit('knight'));
      } else if (obj.type === 'archeryRange') {
        addActionButton(btnsEl, 'Train Archer', 'food:20 gold:20', () => obj.queueUnit('archer'));
      } else if (obj.type === 'stable') {
        addActionButton(btnsEl, 'Train Knight', 'food:40 gold:35', () => obj.queueUnit('knight'));
      } else if (obj.type === 'citadel') {
        addActionButton(btnsEl, 'Train Worker', 'food:15 gold:5', () => obj.queueUnit('worker'));
        addActionButton(btnsEl, 'Train Swordsman', 'food:25 gold:15', () => obj.queueUnit('swordsman'));
      } else if (obj.type === 'mageTower') {
        addActionButton(btnsEl, 'Train Battle Mage', 'food:50 gold:60', () => obj.queueUnit('battleMage'));
      }

      // Show production queue
      if (obj.productionQueue.length > 0) {
        const queueInfo = document.createElement('div');
        queueInfo.style.cssText = 'color:#f0d878;font-size:11px;padding:4px;width:100%;';
        queueInfo.textContent = `Queue: ${obj.productionQueue.join(', ')} (${Math.floor(obj.productionTime / obj.productionTotal * 100)}%)`;
        btnsEl.appendChild(queueInfo);
      }
    }
  } else if (obj instanceof Unit) {
    nameEl.textContent = obj.type.charAt(0).toUpperCase() + obj.type.slice(1);
    descEl.textContent = `${obj.owner === 'player' ? 'Friendly' : 'Enemy'} ${obj.type}`;
    statsEl.innerHTML = `HP: ${Math.floor(obj.hp)}/${obj.maxHp} · ATK: ${obj.stats.attack} · SPD: ${obj.stats.speed}`;

    btnsEl.innerHTML = '';
    if (obj.owner === 'player') {
      if (obj.type === 'worker') {
        addActionButton(btnsEl, '⛏ Gather Wood', 'Assign to nearest tree', () => {
          const sorted = resourceNodes.filter(r => r.type === 'wood').sort((a, b) => dist2d(obj.x, obj.z, a.x, a.z) - dist2d(obj.x, obj.z, b.x, b.z));
          if (sorted.length > 0) selectedObjects.forEach(o => { if (o instanceof Unit && o.type === 'worker') o.gatherNode(sorted[0]); });
        });
        addActionButton(btnsEl, '⛏ Gather Stone', 'Assign to nearest quarry', () => {
          const sorted = resourceNodes.filter(r => r.type === 'stone').sort((a, b) => dist2d(obj.x, obj.z, a.x, a.z) - dist2d(obj.x, obj.z, b.x, b.z));
          if (sorted.length > 0) selectedObjects.forEach(o => { if (o instanceof Unit && o.type === 'worker') o.gatherNode(sorted[0]); });
        });
        addActionButton(btnsEl, '🌾 Gather Food', 'Assign to nearest bush', () => {
          const sorted = resourceNodes.filter(r => r.type === 'food').sort((a, b) => dist2d(obj.x, obj.z, a.x, a.z) - dist2d(obj.x, obj.z, b.x, b.z));
          if (sorted.length > 0) selectedObjects.forEach(o => { if (o instanceof Unit && o.type === 'worker') o.gatherNode(sorted[0]); });
        });
        addActionButton(btnsEl, '💰 Gather Gold', 'Assign to nearest gold', () => {
          const sorted = resourceNodes.filter(r => r.type === 'gold').sort((a, b) => dist2d(obj.x, obj.z, a.x, a.z) - dist2d(obj.x, obj.z, b.x, b.z));
          if (sorted.length > 0) selectedObjects.forEach(o => { if (o instanceof Unit && o.type === 'worker') o.gatherNode(sorted[0]); });
        });
      }
    }
  } else if (obj instanceof ResourceNode) {
    nameEl.textContent = `${obj.type.charAt(0).toUpperCase() + obj.type.slice(1)} Node`;
    descEl.textContent = `Amount: ${Math.floor(obj.amount)}`;

  }
}

    const costStr = [];
    if (b.cost.wood) costStr.push(`🌲${b.cost.wood}`);
    if (b.cost.stone) costStr.push(`🪨${b.cost.stone}`);
    if (b.cost.food) costStr.push(`🌾${b.cost.food}`);
