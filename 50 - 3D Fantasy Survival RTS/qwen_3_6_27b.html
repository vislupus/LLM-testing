        showMessage(`Built ${b.name}!`);
        menu.style.display = 'none';
        updateSelectionUI();
      }
    };
    list.appendChild(item);
  }
}

// --- Minimap ---
function updateMinimap() {
  const canvas = document.getElementById('minimap');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 160, 130);

  // Background
  ctx.fillStyle = '#2a4a2a';
  ctx.fillRect(0, 0, 160, 130);

  // Fog of war
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, 160, 130);

  // Revealed areas
  ctx.fillStyle = '#3a5a3a';
  for (const key in fowGrid) {
    if (fowGrid[key].timer > 0) {
      const [cx, cz] = key.split(',').map(Number);
      const mx = (cx * FOW_CELL / MAP_SIZE) * 160 + 80;
      const my = (cz * FOW_CELL / MAP_SIZE) * 130 + 65;
      ctx.fillRect(mx - FOW_CELL * 160 / MAP_SIZE / 2, my - FOW_CELL * 130 / MAP_SIZE / 2,
                   FOW_CELL * 160 / MAP_SIZE, FOW_CELL * 130 / MAP_SIZE);
    }
  }

  // Resource nodes
  for (const node of resourceNodes) {
    const mx = (node.x / MAP_SIZE) * 160 + 80;
    const my = (node.z / MAP_SIZE) * 130 + 65;
    if (!isRevealed(node.x, node.z)) continue;
    ctx.fillStyle = node.type === 'wood' ? '#2a6a1a' : node.type === 'stone' ? '#7a7a7a' :
                    node.type === 'food' ? '#aa3333' : '#ddaa22';
    ctx.fillRect(mx - 2, my - 2, 4, 4);
  }

  // Buildings
  for (const b of allBuildings) {
    const mx = (b.x / MAP_SIZE) * 160 + 80;
    const my = (b.z / MAP_SIZE) * 130 + 65;
    if (!isRevealed(b.x, b.z)) continue;
    ctx.fillStyle = b.owner === 'player' ? '#4488cc' : '#aa4444';
    ctx.fillRect(mx - 3, my - 3, 6, 6);
  }

  // Units
  for (const u of allUnits) {
    if (!isRevealed(u.x, u.z)) continue;
    const mx = (u.x / MAP_SIZE) * 160 + 80;
    const my = (u.z / MAP_SIZE) * 130 + 65;
    ctx.fillStyle = u.owner === 'player' ? '#66aaff' : '#ff6666';
    ctx.fillRect(mx - 1, my - 1, 2, 2);
  }

  // Camera view
  const camMx = (camTarget.x / MAP_SIZE) * 160 + 80;
  const camMy = (camTarget.z / MAP_SIZE) * 130 + 65;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.strokeRect(camMx - 8, camMy - 6, 16, 12);
}

// --- Day/Night Cycle ---
function updateDayNight(dt) {
  dayTime += dt;
  const dayLength = 90; // seconds per full cycle
  const cycle = (dayTime % (dayLength * 2)) / dayLength;

  if (cycle < 1) {
    // Day
    isNight = false;
    const brightness = cycle < 0.2 ? cycle / 0.2 : cycle > 0.8 ? (1 - cycle) / 0.2 : 1;
    sunLight.intensity = 0.3 + brightness * 0.9;
    ambientLight.intensity = 0.2 + brightness * 0.4;
    scene.fog.color.setRGB(0.53 * brightness + 0.1, 0.67 * brightness + 0.1, 0.8 * brightness + 0.1);
    renderer.toneMappingExposure = 0.4 + brightness * 0.6;
    document.getElementById('day-icon').textContent = '☀️';
    document.getElementById('day-night-fill').style.width = `${brightness * 100}%`;
    document.getElementById('day-night-fill').style.background = '#ffd700';
  } else {
    // Night
    isNight = true;
    const nightProgress = (cycle - 1);
    const darkness = nightProgress < 0.2 ? nightProgress / 0.2 : nightProgress > 0.8 ? (1 - nightProgress) / 0.2 : 1;
    sunLight.intensity = 0.15 - darkness * 0.1;
    ambientLight.intensity = 0.15 - darkness * 0.05;
    moonLight.intensity = 0.2 + darkness * 0.3;
    scene.fog.color.setRGB(0.1, 0.1, 0.15 + darkness * 0.05);
    renderer.toneMappingExposure = 0.3 - darkness * 0.15;
    document.getElementById('day-icon').textContent = '🌙';
    document.getElementById('day-night-fill').style.width = `${(1 - darkness) * 100}%`;
    document.getElementById('day-night-fill').style.background = '#4466aa';
  }

  if (cycle >= 1.95) {
    dayCount++;
    document.getElementById('day-label').textContent = `Day ${dayCount}`;
    // Day transition bonus
    resources.food += 10;
  }

  // Enemy waves come faster at night
  if (isNight) {
    nextWaveTime = Math.min(nextWaveTime, gameTime + difficulty.waveInterval * 0.5);
  }

  // Passive income from production buildings
  const playerFarms = allBuildings.filter(b => b.type === 'farm' && b.owner === 'player');
  const playerQuarries = allBuildings.filter(b => b.type === 'quarry' && b.owner === 'player');
  const playerLumber = allBuildings.filter(b => b.type === 'lumberCamp' && b.owner === 'player');

  resources.food += playerFarms.length * 0.5 * dt * difficulty.econMult;
  resources.stone += playerQuarries.length * 0.4 * dt * difficulty.econMult;
  resources.wood += playerLumber.length * 0.4 * dt * difficulty.econMult;
  resources.gold += (allBuildings.filter(b => b.owner === 'player').length) * 0.05 * dt * difficulty.econMult;

  // Pop cap from citadel and buildings
  popCap.max = 20 + allBuildings.filter(b => b.type === 'citadel' && b.owner === 'player').length * 10 +
               allBuildings.filter(b => (b.type === 'barracks' || b.type === 'archeryRange' || b.type === 'stable') && b.owner === 'player').length * 5;

  // Worker cost scaling
  // Food consumption
  const workerCount = allUnits.filter(u => u.owner === 'player' && u.type === 'worker').length;
  resources.food -= workerCount * 0.02 * dt;
}

// --- Camera Controls ---
function updateCamera(dt) {
  // WASD movement
  const moveSpeed = 30 * dt;
  if (keysDown['w'] || keysDown['arrowup']) camTarget.z -= moveSpeed;
  if (keysDown['s'] || keysDown['arrowdown']) camTarget.z += moveSpeed;
  if (keysDown['a'] || keysDown['arrowleft']) camTarget.x -= moveSpeed;
  if (keysDown['d'] || keysDown['arrowright']) camTarget.x += moveSpeed;

  // Clamp camera
  camTarget.x = clamp(camTarget.x, -MAP_SIZE / 2, MAP_SIZE / 2);
  camTarget.z = clamp(camTarget.z, -MAP_SIZE / 2, MAP_SIZE / 2);

  // Calculate camera position
  const cx = camTarget.x + Math.sin(camAngle) * camDist;
  const cz = camTarget.z + Math.cos(camAngle) * camDist;
  const cy = camHeight;

  camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.1);
  camera.lookAt(camTarget.x, 0, camTarget.z);

  // Update sun position relative to camera
  sunLight.position.set(camTarget.x + 50, 80, camTarget.z + 30);
  sunLight.target.position.set(camTarget.x, 0, camTarget.z);
  sunLight.target.updateMatrixWorld();
}

// --- Input Handling ---
function onMouseDown(e) {
  if (!gameStarted || gameOver) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const allMeshes = [];
  for (const b of allBuildings) {
    b.mesh.traverse(child => { if (child.isMesh) allMeshes.push(child); });
  }
  for (const u of allUnits) {
    u.mesh.traverse(child => { if (child.isMesh) allMeshes.push(child); });
  }
  for (const r of resourceNodes) {
    r.mesh.traverse(child => { if (child.isMesh) allMeshes.push(child); });
  }

  const intersects = raycaster.intersectObjects(allMeshes, false);

  if (e.button === 0) {
    // Left click - select
    if (intersects.length > 0) {
      let obj = intersects[0].object;
      // Walk up to find parent with userData
      while (obj && !obj.userData.building && !obj.userData.unit && !obj.userData.resourceNode) {
        obj = obj.parent;
      }

      if (obj.userData.building) {
        if (e.shiftKey) {
          if (selectedObjects.includes(obj.userData.building)) {
            selectedObjects = selectedObjects.filter(o => o !== obj.userData.building);
          } else {
            selectedObjects = [obj.userData.building];
          }
        } else {
          selectedObjects = [obj.userData.building];
        }
        updateSelectionUI();
      } else if (obj.userData.unit) {
        if (e.shiftKey) {
          if (selectedObjects.includes(obj.userData.unit)) {
            selectedObjects = selectedObjects.filter(o => o !== obj.userData.unit);
          } else {
            selectedObjects.push(obj.userData.unit);
          }
        } else {
          // Box select same type
          selectedObjects = allUnits.filter(u => u.owner === 'player' && u.type === obj.userData.unit.type);
        }
        updateSelectionUI();
      } else if (obj.userData.resourceNode) {
        selectedObjects = [obj.userData.resourceNode];
        updateSelectionUI();
      }
    } else {
      if (!e.shiftKey) {
        selectedObjects = [];
        updateSelectionUI();
      }
    }
  } else if (e.button === 2) {
    // Right click - command
    if (selectedObjects.length > 0) {
      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.building && !obj.userData.unit && !obj.userData.resourceNode) {
          obj = obj.parent;
        }

        if (obj.userData.unit || obj.userData.building) {
          // Attack target
          const target = obj.userData.unit || obj.userData.building;
          for (const s of selectedObjects) {
            if (s instanceof Unit) {
              s.attackTarget(target);
            }
          }
          spawnParticles(intersects[0].point, 0xff0000, 5, 0.5, 0.2);
        } else if (obj.userData.resourceNode) {
          // Workers gather
          for (const s of selectedObjects) {
            if (s instanceof Unit && s.type === 'worker') {
              s.gatherNode(obj.userData.resourceNode);
            }
          }
        }
      } else {
        // Move to ground
        const groundIntersects = raycaster.intersectObject(terrain);
        if (groundIntersects.length > 0) {
          const pos = groundIntersects[0].point;
          for (const s of selectedObjects) {
            if (s instanceof Unit) {
              s.moveTarget(pos.x, pos.z);
            }
          }
          // Move marker
          spawnParticles(pos, 0x44ff44, 3, 0.5, 0.3);
        }
      }
    }
  }
}

function onKeyDown(e) {
  keysDown[e.key.toLowerCase()] = true;
  if (e.key === 'b' || e.key === 'B') showBuildMenu();
  if (e.key === ' ') { e.preventDefault(); selectedObjects = []; updateSelectionUI(); }
}

function onKeyUp(e) {
  keysDown[e.key.toLowerCase()] = false;
}

function onMouseWheel(e) {
  camDist = clamp(camDist + e.deltaY * 0.05, 20, 150);
  camHeight = camDist * 0.85;
}

function onContextMenu(e) {
  e.preventDefault();
}

window.addEventListener('mousedown', onMouseDown);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('wheel', onMouseWheel);
window.addEventListener('contextmenu', onContextMenu);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    difficulty = DIFFICULTY[parseInt(btn.dataset.diff)];
  });
});

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  gameStarted = true;
  initMap();
  nextWaveTime = gameTime + 15; // First wave after 15 seconds
  showMessage('Build your defenses and train your army!');
});

// --- Main Game Loop ---
let lastTime = performance.now();
let uiUpdateTimer = 0;
let fowUpdateTimer = 0;
let minimapUpdateTimer = 0;

function gameLoop(currentTime) {
  requestAnimationFrame(gameLoop);

  if (!gameStarted || gameOver) {
    renderer.render(scene, camera);
    return;
  }

  const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
  lastTime = currentTime;
  gameTime += dt;

  // Update day/night
  updateDayNight(dt);

  // Update buildings
  for (const b of [...allBuildings]) b.update(dt);

  // Update units
  for (const u of [...allUnits]) u.update(dt);

  // Update resource nodes
  for (const r of [...resourceNodes]) r.update(dt);

  // Update projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    if (!projectiles[i].update(dt)) {
      projectiles.splice(i, 1);
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    if (!particles[i].update(dt)) {
      particles.splice(i, 1);
    }
  }

  // Update camera
  updateCamera(dt);

  // Update AI
  updateAI(dt);

  // Update fog of war
  fowUpdateTimer += dt;
  if (fowUpdateTimer > 0.5) {
    fowUpdateTimer = 0;
    updateFogOfWar();
  }

  // Update UI
  uiUpdateTimer += dt;
  if (uiUpdateTimer > 0.25) {
    uiUpdateTimer = 0;
    updateResourceUI();
    updateSelectionUI();
  }

  // Update minimap
  minimapUpdateTimer += dt;
  if (minimapUpdateTimer > 0.5) {
    minimapUpdateTimer = 0;
    updateMinimap();
  }

  // Check victory conditions periodically
  if (Math.floor(gameTime * 2) !== Math.floor((gameTime - dt) * 2)) {
    checkVictoryConditions();
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(gameLoop);
</script>
