<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminara: Fall of the Dawn</title>
<style>
    :root {
        --bg: #1a1a2e; --fg: #eaeaea; --accent: #f9a825; --danger: #e53935;
        --lux: #f9a825; --timber: #8d6e63; --rations: #66bb6a; --pop: #42a5f5;
        --panel: rgba(20, 20, 40, 0.85); --border: rgba(255,255,255,0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--fg); }
    #gameCanvas { width: 100vw; height: 100vh; display: block; }
    
    /* UI Overlay */
    #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .ui-panel { pointer-events: auto; background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(5px); border-radius: 8px; }
    
    /* Top Bar */
    #top-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; padding: 8px 20px; align-items: center; }
    .res-item { display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 14px; }
    .res-icon { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    
    /* Bottom Bar */
    #bottom-bar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px; }
    .action-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--fg); padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: center; min-width: 70px; }
    .action-btn:hover { background: rgba(255,255,255,0.2); border-color: var(--accent); }
    .action-btn.active { background: rgba(249, 168, 37, 0.3); border-color: var(--accent); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    
    /* Info Panel */
    #info-panel { position: absolute; bottom: 10px; right: 10px; width: 200px; padding: 10px; display: none; }
    #info-title { font-weight: bold; color: var(--accent); margin-bottom: 5px; font-size: 14px; }
    #info-details { font-size: 12px; line-height: 1.4; }
    
    /* Notification */
    #notification { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); padding: 8px 16px; background: var(--danger); border-radius: 4px; font-weight: bold; display: none; pointer-events: none; animation: fadeOut 3s forwards; }
    @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }

    /* Crosshair */
    #cursor-mode { position: absolute; top: 10px; left: 10px; padding: 5px 10px; font-size: 12px; display: none; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-overlay">
    <div id="top-bar" class="ui-panel">
        <div class="res-item"><span class="res-icon" style="background:var(--lux)"></span> Lux: <span id="res-lux">0</span></div>
        <div class="res-item"><span class="res-icon" style="background:var(--timber)"></span> Timber: <span id="res-timber">0</span></div>
        <div class="res-item"><span class="res-icon" style="background:var(--rations)"></span> Rations: <span id="res-rations">0</span></div>
        <div class="res-item">|</div>
        <div class="res-item">Pop: <span id="res-pop">0</span>/<span id="res-pop-max">0</span></div>
        <div class="res-item">|</div>
        <div class="res-item">Day: <span id="res-day">1</span></div>
        <div class="res-item">Wave: <span id="res-wave">1</span></div>
    </div>
    
    <div id="cursor-mode" class="ui-panel">Placing: <span id="cursor-name"></span></div>
    <div id="notification"></div>
    
    <div id="info-panel" class="ui-panel">
        <div id="info-title"></div>
        <div id="info-details"></div>
    </div>

    <div id="bottom-bar" class="ui-panel">
        <button class="action-btn" onclick="game.enterBuildMode('sunforge')">Sunforge<br>(Lux)</button>
        <button class="action-btn" onclick="game.enterBuildMode('lumbermill')">Lumber Mill<br>(Timber)</button>
        <button class="action-btn" onclick="game.enterBuildMode('farm')">Farm<br>(Rations)</button>
        <button class="action-btn" onclick="game.enterBuildMode('barracks')">Barracks<br>(Military)</button>
        <button class="action-btn" onclick="game.enterBuildMode('wall')">Aegis Wall<br>(Defense)</button>
        <button class="action-btn" onclick="game.recruitUnit('warden')">Warden<br>(Melee)</button>
        <button class="action-btn" onclick="game.recruitUnit('sparkbow')">Sparkbow<br>(Ranged)</button>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- CONFIG & DATA ---
const CFG = {
    MAP_SIZE: 80, TILE_SIZE: 2, GRID_SIZE: 40,
    DAY_LENGTH: 60, WAVE_BASE_TIME: 45, WAVE_SCALE: 1.15,
    FOG_RADIUS: 30, START_LUX: 100, START_TIMBER: 100, START_RATIONS: 50
};

const BLDG_DATA = {
    sunforge:   { name:"Sunforge", cost:{lux:0, timber:50, rations:0}, hp:200, pop:0, prod:{lux:5}, color:0xf9a825 },
    lumbermill: { name:"Lumber Mill", cost:{lux:20, timber:0, rations:0}, hp:200, pop:0, prod:{timber:4}, color:0x8d6e63 },
    farm:       { name:"Farm", cost:{lux:10, timber:20, rations:0}, hp:150, pop:0, prod:{rations:5}, color:0x66bb6a },
    barracks:   { name:"Barracks", cost:{lux:50, timber:80, rations:20}, hp:300, pop:10, prod:{}, color:0xef5350 },
    wall:       { name:"Aegis Wall", cost:{lux:10, timber:30, rations:0}, hp:400, pop:0, prod:{}, color:0xb0bec5 },
    base:       { name:"Dawn Citadel", hp:500, pop:5, prod:{lux:2, timber:2, rations:2}, color:0xffffff }
};

const UNIT_DATA = {
    warden:   { name:"Warden", cost:{lux:20, timber:0, rations:10}, hp:100, dmg:10, range:1.5, speed:4, color:0x42a5f5 },
    sparkbow: { name:"Sparkbow", cost:{lux:30, timber:10, rations:10}, hp:60, dmg:15, range:10, speed:3.5, color:0xffca28 },
    // Enemy Units
    shade:    { name:"Shade", hp:40, dmg:5, range:1.5, speed:5, color:0x6a1b9a },
    brute:    { name:"Brute", hp:200, dmg:20, range:2, speed:2.5, color:0x4a148c }
};

// --- CORE ENGINE ---
class Game {
    constructor() {
        this.clock = new THREE.Clock();
        this.res = { lux: CFG.START_LUX, timber: CFG.START_TIMBER, rations: CFG.START_RATIONS };
        this.pop = 0; this.maxPop = 0;
        this.dayTime = 0; this.dayCount = 1; this.nightAlpha = 0;
        this.waveTimer = CFG.WAVE_BASE_TIME; this.waveCount = 1;
        
        this.buildings = []; this.units = []; this.projectiles = [];
        this.terrain = null; this.grid = [];
        
        this.selected = []; this.buildMode = null;
        this.ghostMesh = null;

        this.initRenderer();
        this.initWorld();
        this.initInput();
        this.spawnBase();
        
        this.updateUI();
    }

    initRenderer() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x87ceeb);
        this.scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        this.camera = new THREE.OrthographicCamera(-40, 40, 25, -25, 0.1, 200);
        this.camera.position.set(40, 50, 40);
        this.camera.lookAt(0, 0, 0);

        this.renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true; this.controls.dampingFactor = 0.1;
        this.controls.maxPolarAngle = Math.PI / 3; this.controls.minZoom = 0.5; this.controls.maxZoom = 3;

        this.ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(this.ambientLight);

        this.sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        this.sunLight.position.set(20, 40, 20);
        this.sunLight.castShadow = true;
        this.sunLight.shadow.mapSize.set(2048, 2048);
        this.sunLight.shadow.camera.left = -40; this.sunLight.shadow.camera.right = 40;
        this.sunLight.shadow.camera.top = 40; this.sunLight.shadow.camera.bottom = -40;
        this.scene.add(this.sunLight);

        window.addEventListener('resize', () => {
            const w = window.innerWidth, h = window.innerHeight;
            this.camera.left = -40 * (w/h); this.camera.right = 40 * (w/h);
            this.camera.top = 25; this.camera.bottom = -25;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(w, h);
        });
    }

    initWorld() {
        // Grid
        for(let x=0; x<CFG.GRID_SIZE; x++) {
            this.grid[x] = [];
            for(let z=0; z<CFG.GRID_SIZE; z++) this.grid[x][z] = 0;
        }

        // Terrain
        const geo = new THREE.PlaneGeometry(CFG.MAP_SIZE, CFG.MAP_SIZE, CFG.GRID_SIZE-1, CFG.GRID_SIZE-1);
        const pos = geo.attributes.position;
        for(let i=0; i<pos.count; i++) {
            let x = pos.getX(i), y = pos.getY(i);
            let h = Math.sin(x*0.2)*Math.cos(y*0.2)*1.5 + Math.sin(x*0.05+y*0.05)*3;
            pos.setZ(i, h);
        }
        geo.rotateX(-Math.PI/2);
        geo.computeVertexNormals();
        
        const mat = new THREE.MeshStandardMaterial({ color: 0x4caf50, flatShading: true, roughness: 0.8 });
        this.terrain = new THREE.Mesh(geo, mat);
        this.terrain.receiveShadow = true;
        this.scene.add(this.terrain);

        // Water
        const waterGeo = new THREE.PlaneGeometry(200, 200);
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x0d47a1, transparent: true, opacity: 0.7, roughness: 0.1 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI/2; water.position.y = -1.5;
        this.scene.add(water);

        // Resource Nodes (Visuals only for now, economy tied to buildings for simplicity)
        for(let i=0; i<20; i++) {
            const g = new THREE.Group();
            const cr = new THREE.Mesh(new THREE.OctahedronGeometry(0.8, 0), new THREE.MeshStandardMaterial({color:0xf9a825, emissive:0xf9a825, emissiveIntensity:0.3}));
            cr.position.y = 1.5; cr.castShadow = true;
            g.add(cr);
            g.position.set((Math.random()-0.5)*60, 0, (Math.random()-0.5)*60);
            g.position.y = this.getTerrainHeight(g.position.x, g.position.z);
            this.scene.add(g);
        }
    }

    initInput() {
        const canvas = this.renderer.domElement;
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();
        this.frustum = new THREE.Frustum();
        this.projScreenMatrix = new THREE.Matrix4();

        canvas.addEventListener('mousemove', (e) => {
            this.mouse.x = ( e.clientX / window.innerWidth ) * 2 - 1;
            this.mouse.y = - ( e.clientY / window.innerHeight ) * 2 + 1;
            if(this.buildMode) this.updateGhost();
        });

        canvas.addEventListener('click', (e) => {
            if(e.button !== 0) return;
            
            if(this.buildMode) {
                this.placeBuilding();
                return;
            }

            // Selection
            this.raycaster.setFromCamera(this.mouse, this.camera);
            const selectable = this.units.map(u => u.mesh).concat(this.buildings.map(b => b.mesh));
            const intersects = this.raycaster.intersectObjects(selectable, true);
            
            if(intersects.length > 0) {
                let obj = intersects[0].object;
                while(obj.parent && !obj.userData.isEntity) obj = obj.parent;
                if(obj.userData.isEntity) {
                    this.selected = [obj.userData.entityRef];
                    this.showInfoPanel();
                }
            } else {
                this.selected = [];
                document.getElementById('info-panel').style.display = 'none';
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if(this.selected.length > 0 && !this.buildMode) {
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
                const target = new THREE.Vector3();
                this.raycaster.ray.intersectPlane(plane, target);
                if(target) {
                    // Formation logic
                    const center = target.clone();
                    const shape = this.selected.length > 1 ? new THREE.CircleGeometry(2, this.selected.length) : null;
                    this.selected.forEach((u, i) => {
                        let t = center.clone();
                        if(shape) {
                            t.x += shape.attributes.position.getX(i+1);
                            t.z += shape.attributes.position.getY(i+1); // Y is Z in 2D shape
                        }
                        u.setTarget(t);
                    });
                }
            }
        });
        
        window.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') {
                this.exitBuildMode();
                this.selected = [];
                document.getElementById('info-panel').style.display = 'none';
            }
        });
    }

    getTerrainHeight(x, z) {
        // Simple approximation to avoid raycasting every frame
        return Math.sin(x*0.2)*Math.cos(z*0.2)*1.5 + Math.sin(x*0.05+z*0.05)*3;
    }

    worldToGrid(pos) {
        return {
            x: Math.round((pos.x + CFG.MAP_SIZE/2) / CFG.TILE_SIZE),
            z: Math.round((pos.z + CFG.MAP_SIZE/2) / CFG.TILE_SIZE)
        };
    }

    gridToWorld(gx, gz) {
        return new THREE.Vector3(
            gx * CFG.TILE_SIZE - CFG.MAP_SIZE/2,
            0,
            gz * CFG.TILE_SIZE - CFG.MAP_SIZE/2
        );
    }

    spawnBase() {
        const w = this.gridToWorld(CFG.GRID_SIZE/2, CFG.GRID_SIZE/2);
        this.createBuilding('base', w.x, w.z, true);
    }

    // --- BUILD SYSTEM ---
    enterBuildMode(type) {
        if(this.buildMode === type) { this.exitBuildMode(); return; }
        const data = BLDG_DATA[type];
        if(!this.canAfford(data.cost)) { this.notify("Not enough resources!"); return; }
        
        this.exitBuildMode();
        this.buildMode = type;
        document.getElementById('cursor-mode').style.display = 'block';
        document.getElementById('cursor-name').innerText = data.name;

        // Create Ghost
        const geo = this.createBuildingGeo(type);
        const mat = new THREE.MeshStandardMaterial({ color: data.color, transparent: true, opacity: 0.5 });
        this.ghostMesh = new THREE.Mesh(geo, mat);
        this.ghostMesh.position.y = 5;
        this.scene.add(this.ghostMesh);
    }

    exitBuildMode() {
        this.buildMode = null;
        if(this.ghostMesh) { this.scene.remove(this.ghostMesh); this.ghostMesh = null; }
        document.getElementById('cursor-mode').style.display = 'none';
    }

    updateGhost() {
        this.raycaster.setFromCamera(this.mouse, this.camera);
        const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
        const target = new THREE.Vector3();
        this.raycaster.ray.intersectPlane(plane, target);
        if(target && this.ghostMesh) {
            const gx = Math.round(target.x / CFG.TILE_SIZE) * CFG.TILE_SIZE;
            const gz = Math.round(target.z / CFG.TILE_SIZE) * CFG.TILE_SIZE;
            this.ghostMesh.position.set(gx, this.getTerrainHeight(gx, gz), gz);
            
            const g = this.worldToGrid(this.ghostMesh.position);
            const valid = g.x >= 0 && g.x < CFG.GRID_SIZE && g.z >= 0 && g.z < CFG.GRID_SIZE && this.grid[g.x][g.z] === 0;
            this.ghostMesh.material.color.set(valid ? 0x00ff00 : 0xff0000);
        }
    }

    placeBuilding() {
        if(!this.ghostMesh || this.ghostMesh.material.color.getHex() !== 0x00ff00) return;
        const p = this.ghostMesh.position;
        const type = this.buildMode;
        const data = BLDG_DATA[type];
        
        if(!this.spendRes(data.cost)) return;
        
        this.createBuilding(type, p.x, p.z, false);
        this.exitBuildMode();
    }

    createBuildingGeo(type) {
        if(type === 'wall') return new THREE.BoxGeometry(2, 3, 2);
        if(type === 'farm') return new THREE.CylinderGeometry(1.5, 1.5, 0.5, 6);
        const base = new THREE.BoxGeometry(2, 2, 2);
        if(type === 'barracks') return new THREE.BufferGeometry().copy(base); // Simplified
        const roof = new THREE.ConeGeometry(1.8, 2, 4);
        roof.translate(0, 2, 0);
        return THREE.BufferGeometryUtils ? base : base; // Keep simple for performance
    }

    createBuilding(type, x, z, isBase) {
        const data = BLDG_DATA[type];
        const g = new THREE.Group();
        
        // Stylized visual generation
        if(type === 'base') {
            const s = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), new THREE.MeshStandardMaterial({color:0xffffff, flatShading:true}));
            s.castShadow = true; s.position.y = 2; g.add(s);
            const r = new THREE.Mesh(new THREE.ConeGeometry(3.5, 3, 4), new THREE.MeshStandardMaterial({color:0xf9a825, flatShading:true}));
            r.castShadow = true; r.position.y = 5.5; r.rotation.y = Math.PI/4; g.add(r);
        } else if(type === 'wall') {
            const s = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), new THREE.MeshStandardMaterial({color:0xb0bec5, flatShading:true}));
            s.castShadow = true; s.position.y = 1.5; g.add(s);
        } else {
            const s = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({color:data.color, flatShading:true}));
            s.castShadow = true; s.position.y = 1; g.add(s);
            const r = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.5, 4), new THREE.MeshStandardMaterial({color:0xe0e0e0, flatShading:true}));
            r.castShadow = true; r.position.y = 2.75; r.rotation.y = Math.PI/4; g.add(r);
        }

        const h = this.getTerrainHeight(x, z);
        g.position.set(x, h, z);
        
        const gridPos = this.worldToGrid(g.position);
        if(gridPos.x >= 0 && gridPos.x < CFG.GRID_SIZE && gridPos.z >= 0 && gridPos.z < CFG.GRID_SIZE) {
            this.grid[gridPos.x][gridPos.z] = 1; // Occupy grid
        }

        g.userData.isEntity = true;
        const b = { type, data, mesh: g, hp: data.hp, maxHp: data.hp, pos: g.position, prodTimer: 0 };
        g.userData.entityRef = b;
        this.buildings.push(b);
        this.scene.add(g);

        this.maxPop += (data.pop || 0);
        this.updateUI();
    }

    // --- UNIT SYSTEM ---
    recruitUnit(type) {
        const data = UNIT_DATA[type];
        if(!data) return;
        if(!this.canAfford(data.cost)) { this.notify("Not enough resources!"); return; }
        if(this.pop >= this.maxPop) { this.notify("Need more housing (Barracks)!"); return; }
        
        const barracks = this.buildings.find(b => b.type === 'barracks');
        if(!barracks) { this.notify("Build a Barracks first!"); return; }

        this.spendRes(data.cost);
        this.spawnUnit(type, barracks.pos.x + (Math.random()-0.5)*4, barracks.pos.z + (Math.random()-0.5)*4, 'player');
    }

    spawnUnit(type, x, z, team) {
        const data = UNIT_DATA[type];
        const g = new THREE.Group();
        
        // Stylized Unit Visuals
        const bodyMat = new THREE.MeshStandardMaterial({color: data.color, flatShading:true});
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1, 6), bodyMat);
        body.position.y = 0.5; body.castShadow = true; g.add(body);
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 6), new THREE.MeshStandardMaterial({color:0xffccbc, flatShading:true}));
        head.position.y = 1.2; head.castShadow = true; g.add(head);

        if(type === 'sparkbow') {
            const bow = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 4, 8, Math.PI), bodyMat);
            bow.position.set(0.4, 1.0, 0); bow.rotation.z = Math.PI/2; g.add(bow);
        } else if(type === 'brute') {
            body.scale.set(1.5, 1.2, 1.5); head.scale.set(1.2,1.2,1.2); head.position.y = 1.4;
        }

        const h = this.getTerrainHeight(x, z);
        g.position.set(x, h, z);

        g.userData.isEntity = true;
        const u = {
            type, data, mesh: g, hp: data.hp, maxHp: data.hp, team,
            pos: g.position, vel: new THREE.Vector3(), targetPos: null, targetEnemy: null,
            attackCd: 0, state: 'idle'
        };
        g.userData.entityRef = u;
        this.units.push(u);
        this.scene.add(g);

        if(team === 'player') this.pop++;
        this.updateUI();
    }

    // --- ECONOMY & AI ---
    canAfford(cost) {
        return (cost.lux || 0) <= this.res.lux && (cost.timber || 0) <= this.res.timber && (cost.rations || 0) <= this.res.rations;
    }

    spendRes(cost) {
        this.res.lux -= (cost.lux || 0); this.res.timber -= (cost.timber || 0); this.res.rations -= (cost.rations || 0);
        this.updateUI(); return true;
    }

    updateEconomy(dt) {
        this.buildings.forEach(b => {
            if(b.data.prod) {
                b.prodTimer += dt;
                if(b.prodTimer >= 1) { // 1 sec tick
                    b.prodTimer = 0;
                    if(b.data.prod.lux) this.res.lux += b.data.prod.lux;
                    if(b.data.prod.timber) this.res.timber += b.data.prod.timber;
                    if(b.data.prod.rations) this.res.rations += b.data.prod.rations;
                }
            }
        });
    }

    updateDayNight(dt) {
        this.dayTime += dt;
        if(this.dayTime >= CFG.DAY_LENGTH) {
            this.dayTime = 0; this.dayCount++;
        }
        
        // Night calculation (0 to 1)
        const halfDay = CFG.DAY_LENGTH / 2;
        const nightStart = halfDay - 10;
        const nightEnd = halfDay + 10;
        if(this.dayTime > nightStart && this.dayTime < nightEnd) {
            this.nightAlpha = Math.sin((this.dayTime - nightStart) / (nightEnd - nightStart) * Math.PI);
        } else {
            this.nightAlpha = 0;
        }

        const dayCol = new THREE.Color(0x87ceeb);
        const nightCol = new THREE.Color(0x0d1b2a);
        this.scene.background.copy(dayCol).lerp(nightCol, this.nightAlpha);
        this.scene.fog.color.copy(this.scene.background);
        this.sunLight.intensity = 1.0 - this.nightAlpha * 0.7;
        this.ambientLight.intensity = 0.4 - this.nightAlpha * 0.2;
    }

    updateWaves(dt) {
        if(this.nightAlpha > 0.5) { // Night is falling
            this.waveTimer -= dt;
            if(this.waveTimer <= 0) {
                this.spawnWave();
                this.waveCount++;
                this.waveTimer = CFG.WAVE_BASE_TIME / (this.waveCount * CFG.WAVE_SCALE);
            }
        }
    }

    spawnWave() {
        const count = 5 + this.waveCount * 3;
        this.notify(`Wave ${this.waveCount} Incoming! (${count} hostiles)`);
        
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 35 + Math.random() * 5;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;
            const type = (i % 5 === 0 && this.waveCount > 2) ? 'brute' : 'shade';
            this.spawnUnit(type, x, z, 'enemy');
        }
    }

    // --- COMBAT & MOVEMENT ---
    updateUnits(dt) {
        const enemyUnits = this.units.filter(u => u.team === 'enemy');
        const playerUnits = this.units.filter(u => u.team === 'player');

        for(let i = this.units.length - 1; i >= 0; i--) {
            const u = this.units[i];
            if(u.hp <= 0) {
                this.scene.remove(u.mesh);
                this.units.splice(i, 1);
                if(u.team === 'player') { this.pop--; this.updateUI(); }
                if(this.selected.includes(u)) this.selected = this.selected.filter(s => s !== u);
                continue;
            }

            // AI Targeting
            if(u.team === 'enemy' && (!u.targetEnemy || u.targetEnemy.hp <= 0)) {
                // Target nearest player building or unit
                let closest = null, minDist = Infinity;
                const targets = [...this.buildings.map(b => ({pos:b.pos, hp:b.hp, ref:b})), ...playerUnits.map(p => ({pos:p.pos, hp:p.hp, ref:p}))];
                targets.forEach(t => {
                    if(t.hp <= 0) return;
                    const d = u.pos.distanceTo(t.pos);
                    if(d < minDist) { minDist = d; closest = t.ref; }
                });
                if(closest) u.targetEnemy = closest;
            } else if(u.team === 'player' && (!u.targetEnemy || u.targetEnemy.hp <= 0)) {
                if(!u.targetPos) u.state = 'idle'; // Wait for orders if no target
                let closest = null, minDist = u.data.range * 1.5;
                enemyUnits.forEach(e => {
                    const d = u.pos.distanceTo(e.pos);
                    if(d < minDist) { minDist = d; closest = e; }
                });
                if(closest) u.targetEnemy = closest;
            }

            // Combat Logic
            if(u.targetEnemy && u.targetEnemy.hp > 0) {
                const dist = u.pos.distanceTo(u.targetEnemy.pos);
                if(dist <= u.data.range) {
                    u.state = 'attack';
                    u.attackCd -= dt;
                    if(u.attackCd <= 0) {
                        u.attackCd = 1.0; // 1 sec attack speed
                        u.targetEnemy.hp -= u.data.dmg;
                        
                        // Ranged Projectile visual
                        if(u.data.range > 5) {
                            this.spawnProjectile(u.pos, u.targetEnemy.pos, u.data.color);
                        }
                    }
                } else {
                    u.targetPos = u.targetEnemy.pos.clone(); // Move towards target
                }
            }

            // Movement Logic
            if(u.targetPos && u.state !== 'attack') {
                u.state = 'move';
                const dir = new THREE.Vector3().subVectors(u.targetPos, u.pos);
                dir.y = 0;
                if(dir.length() > 0.5) {
                    dir.normalize().multiplyScalar(u.data.speed * dt);
                    u.pos.add(dir);
                    u.mesh.lookAt(u.targetPos.x, u.pos.y, u.targetPos.z);
                } else {
                    u.targetPos = null;
                    u.state = 'idle';
                }
            }

            // Apply Terrain Height & Animation
            u.pos.y = this.getTerrainHeight(u.pos.x, u.pos.z);
            
            // Simple walk animation (bobbing)
            if(u.state === 'move') {
                u.mesh.position.y = u.pos.y + Math.abs(Math.sin(this.clock.elapsedTime * 8)) * 0.2;
            } else {
                u.mesh.position.y = u.pos.y;
            }
        }
    }

    spawnProjectile(start, end, color) {
        const geo = new THREE.SphereGeometry(0.2, 4, 4);
        const mat = new THREE.MeshBasicMaterial({color: color});
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(start); p.position.y += 1;
        this.scene.add(p);
        this.projectiles.push({mesh: p, target: end.clone(), life: 1.0});
    }

    updateProjectiles(dt) {
        for(let i = this.projectiles.length - 1; i >= 0; i--) {
            const p = this.projectiles[i];
            p.mesh.position.lerp(p.target, dt * 10);
            p.life -= dt;
            if(p.life <= 0 || p.mesh.position.distanceTo(p.target) < 0.5) {
                this.scene.remove(p.mesh);
                this.projectiles.splice(i, 1);
            }
        }
    }

    // --- UI ---
    notify(msg) {
        const el = document.getElementById('notification');
        el.innerText = msg; el.style.display = 'block';
        el.style.animation = 'none'; el.offsetHeight; el.style.animation = 'fadeOut 3s forwards';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    updateUI() {
        document.getElementById('res-lux').innerText = Math.floor(this.res.lux);
        document.getElementById('res-timber').innerText = Math.floor(this.res.timber);
        document.getElementById('res-rations').innerText = Math.floor(this.res.rations);
        document.getElementById('res-pop').innerText = this.pop;
        document.getElementById('res-pop-max').innerText = this.maxPop;
        document.getElementById('res-day').innerText = this.dayCount;
        document.getElementById('res-wave').innerText = this.waveCount;
    }

    showInfoPanel() {
        const panel = document.getElementById('info-panel');
        panel.style.display = 'block';
        if(this.selected.length > 0) {
            const s = this.selected[0];
            document.getElementById('info-title').innerText = s.data.name;
            document.getElementById('info-details').innerText = `HP: ${Math.floor(s.hp)} / ${s.maxHp}\nState: ${s.state}`;
        }
    }

    // --- MAIN LOOP ---
    update() {
        requestAnimationFrame(() => this.update());
        const dt = Math.min(this.clock.getDelta(), 0.1);

        this.controls.update();
        this.updateDayNight(dt);
        this.updateEconomy(dt);
        this.updateWaves(dt);
        this.updateUnits(dt);
        this.updateProjectiles(dt);
        this.updateUI();

        if(this.selected.length > 0) this.showInfoPanel();

        this.renderer.render(this.scene, this.camera);
    }
}

// --- INIT ---
const game = new Game();
game.update();

</script>
