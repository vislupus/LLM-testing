<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eldermere: Fantasy Survival RTS</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/geometries/DecalGeometry.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/math/ImprovedNoise.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      background: #0a0a1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container { 
      width: 100vw; 
      height: 100vh; 
      position: relative; 
    }
    #game-canvas { display: block; }
    
    /* UI Styles */
    #ui { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      pointer-events: none;
    }
    
    .ui-panel { 
      pointer-events: auto; 
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(100, 149, 237, 0.3);
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    
    .ui-panel-header { 
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    
    .resource-display { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      display: flex; 
      gap: 15px;
      font-size: 14px;
    }
    
    .resource { 
      display: flex; 
      align-items: center; 
      gap: 5px; 
      color: #e0f2fe;
    }
    
    .resource-icon { 
      width: 20px; 
      height: 20px;
      border-radius: 3px;
    }
    
    .resource-value { 
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    }
    
    #selection-panel { 
      position: absolute; 
      bottom: 20px; 
      left: 20px; 
      width: 280px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    #build-panel { 
      position: absolute; 
      bottom: 20px; 
      right: 20px; 
      width: 200px;
    }
    
    #minimap { 
      position: absolute; 
      bottom: 20px; 
      right: 230px; 
      width: 150px; 
      height: 150px;
      background: rgba(0,0,0,0.7);
      border: 2px solid #3b82f6;
    }
    
    #minimap canvas { 
      width: 100%; 
      height: 100%; 
    }
    
    #wave-timer { 
      position: absolute; 
      top: 10px; 
      right: 10px;
      font-size: 16px;
      color: #fbbf24;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    
    #day-night { 
      position: absolute; 
      top: 10px; 
      right: 200px;
      width: 120px;
      height: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      overflow: hidden;
    }
    
    #day-night-indicator { 
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      transition: width 0.1s, background 0.5s;
      position: relative;
    }
    
    #day-night-indicator::after { 
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, #1e40af, #0c4a6e);
    }
    
    .button { 
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border: none;
      padding: 6px 12px;
      margin: 4px 0;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .button:hover { 
      background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    
    .button:disabled { 
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .button-danger { 
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }
    
    .button-danger:hover { 
      background: linear-gradient(135deg, #f87171 0%, #b91c1c 100%);
    }
    
    .progress-bar { 
      width: 100%; 
      height: 6px; 
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    
    .progress-fill { 
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.2s;
    }
    
    .health-bar { 
      height: 4px; 
      background: rgba(0,0,0,0.5);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .health-fill { 
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.2s;
    }
    
    .health-fill.damage { 
      background: linear-gradient(90deg, #ef4444, #dc2626);
    }
    
    #game-over { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000;
    }
    
    #game-over h1 { 
      font-size: 48px; 
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    #game-over p { 
      font-size: 18px; 
      margin-bottom: 30px;
      color: #cbd5e1;
    }
    
    #game-over button { 
      padding: 12px 30px; 
      font-size: 18px; 
      margin: 10px;
    }
    
    .tooltip { 
      position: absolute;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #e0f2fe;
      pointer-events: none;
      z-index: 100;
      display: none;
    }
    
    /* Selection indicator */
    .selection-ring { 
      position: absolute;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse { 
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    
    /* Building placement preview */
    #placement-preview { 
      position: absolute;
      pointer-events: none;
      display: none;
    }
    
    #placement-preview.valid { 
      border: 2px solid #10b981;
    }
    
    #placement-preview.invalid { 
      border: 2px solid #ef4444;
    }
    
    /* Loading screen */
    #loading { 
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a1a 0%, #1e1b4b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 2000;
    }
    
    #loading h1 { font-size: 36px; margin-bottom: 20px; }
    #loading .loader { 
      width: 60px; 
      height: 60px; 
      border: 4px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Unit info panel */
    #unit-info { 
      position: absolute;
      bottom: 240px;
      left: 20px;
      width: 280px;
      display: none;
    }
    
    .stat-row { 
      display: flex;
      justify-content: space-between;
      padding: 4px 8px;
      color: #cbd5e1;
      font-size: 12px;
    }
    
    .stat-row:nth-child(even) { 
      background: rgba(255,255,255,0.05);
    }
    
    /* Notification system */
    #notifications { 
      position: absolute;
      top: 50px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    
    .notification { 
      background: rgba(15, 23, 42, 0.95);
      border-left: 3px solid #3b82f6;
      padding: 8px 12px;
      border-radius: 0 4px 4px 0;
      font-size: 13px;
      animation: slideIn 0.3s ease-out;
      opacity: 0;
    }
    
    .notification.show { opacity: 1; }
    
    @keyframes slideIn { 
      from { transform: translateX(50px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    /* Difficulty selector */
    #difficulty-selector { 
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.98);
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 30px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 1000;
    }
    
    #difficulty-selector h2 { 
      font-size: 24px;
      color: #f1f5f9;
      margin-bottom: 10px;
    }
    
    #difficulty-selector p { 
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      max-width: 300px;
    }
    
    .difficulty-option { 
      padding: 12px 24px;
      font-size: 16px;
      min-width: 120px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="loading">
      <h1>ELDERMERE</h1>
      <div class="loader"></div>
      <p>Building the realm...</p>
    </div>
    
    <div id="difficulty-selector">
      <h2>Choose Your Challenge</h2>
      <p>The darkness approaches. How long can your kingdom endure?</p>
      <button class="button difficulty-option" onclick="selectDifficulty('easy')">Apprentice</button>
      <button class="button difficulty-option" onclick="selectDifficulty('normal')">Warlord</button>
      <button class="button difficulty-option" onclick="selectDifficulty('hard')">Legend</button>
    </div>
    
    <div id="ui">
      <div class="resource-display">
        <div class="resource">
          <div class="resource-icon" style="background: linear-gradient(135deg, #fbbf24, #f59e0b);"></div>
          <span>Gold:</span>
          <span class="resource-value" id="gold-value">0</span>
        </div>
        <div class="resource">
          <div class="resource-icon" style="background: linear-gradient(135deg, #16a34a, #15803d);"></div>
          <span>Wood:</span>
          <span class="resource-value" id="wood-value">0</span>
        </div>
        <div class="resource">
          <div class="resource-icon" style="background: linear-gradient(135deg, #6b7280, #4b5563);"></div>
          <span>Stone:</span>
          <span class="resource-value" id="stone-value">0</span>
        </div>
        <div class="resource">
          <div class="resource-icon" style="background: linear-gradient(135deg, #ef4444, #dc2626);"></div>
          <span>Food:</span>
          <span class="resource-value" id="food-value">0</span>
        </div>
        <div class="resource">
          <div class="resource-icon" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);"></div>
          <span>Mana:</span>
          <span class="resource-value" id="mana-value">0</span>
        </div>
        <div class="resource">
          <div class="resource-icon" style="background: linear-gradient(135deg, #06b6d4, #0891b2);"></div>
          <span>Pop:</span>
          <span class="resource-value" id="population-value">0/0</span>
        </div>
      </div>
      
      <div id="wave-timer">Wave: 1/∞ | Next: 60s</div>
      <div id="day-night"><div id="day-night-indicator"></div></div>
      
      <div id="notifications"></div>
      
      <div id="minimap"><canvas id="minimap-canvas"></canvas></div>
      
      <div id="selection-panel" class="ui-panel">
        <div class="ui-panel-header" id="selection-title">No Selection</div>
        <div id="selection-content" style="padding: 10px;"></div>
      </div>
      
      <div id="build-panel" class="ui-panel">
        <div class="ui-panel-header">Build</div>
        <div style="padding: 10px;">
          <button class="button" onclick="setBuildMode('town-hall')" id="build-town-hall">
            <span>🏰 Town Hall</span>
            <span style="margin-left: auto;">100G 50W</span>
          </button>
          <button class="button" onclick="setBuildMode('barracks')" id="build-barracks">
            <span>⚔️ Barracks</span>
            <span style="margin-left: auto;">80G 30W</span>
          </button>
          <button class="button" onclick="setBuildMode('farm')" id="build-farm">
            <span>🌾 Farm</span>
            <span style="margin-left: auto;">50G 20W</span>
          </button>
          <button class="button" onclick="setBuildMode('lumber-mill')" id="build-lumber-mill">
            <span>🪵 Lumber Mill</span>
            <span style="margin-left: auto;">60G 20W</span>
          </button>
          <button class="button" onclick="setBuildMode('mine')" id="build-mine">
            <span>⛏️ Mine</span>
            <span style="margin-left: auto;">70G 20W</span>
          </button>
          <button class="button" onclick="setBuildMode('tower')" id="build-tower">
            <span>🗼 Tower</span>
            <span style="margin-left: auto;">120G 40S</span>
          </button>
          <button class="button" onclick="setBuildMode('academy')" id="build-academy">
            <span>📚 Academy</span>
            <span style="margin-left: auto;">150G 50W</span>
          </button>
          <button class="button" onclick="setBuildMode('wall')" id="build-wall">
            <span>🧱 Wall</span>
            <span style="margin-left: auto;">30S</span>
          </button>
          <button class="button button-danger" onclick="cancelBuildMode()">Cancel</button>
        </div>
      </div>
      
      <div id="unit-info" class="ui-panel">
        <div class="ui-panel-header" id="unit-info-title">Unit Info</div>
        <div id="unit-info-content" style="padding: 10px;"></div>
      </div>
      
      <div id="game-over">
        <h1 id="game-over-title">DEFEAT</h1>
        <p id="game-over-message">Your kingdom has fallen to the darkness.</p>
        <button class="button" onclick="restartGame()">Try Again</button>
        <button class="button" onclick="showDifficultySelector()">Change Difficulty</button>
      </div>
    </div>
    
    <div id="placement-preview"></div>
  </div>

        CONFIG.CAMERA_DISTANCE, 
        CONFIG.CAMERA_HEIGHT,

      );
      camera.lookAt(0, 0, 0);
      
      // Renderer
      renderer = new THREE.WebGLRenderer({ 
        canvas: document.getElementById('game-canvas'),

      directionalLight.shadow.camera.far = 500;

      directionalLight.shadow.camera.right = 200;

    function createSkyGradient() {
      const canvas = document.createElement('canvas');
      canvas.width = 2;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      
      const gradient = ctx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, '#0a0a1a');
      gradient.addColorStop(0.3, '#1e1b4b');
      gradient.addColorStop(0.5, '#3b82f6');
      gradient.addColorStop(0.7, '#1e3a8a');
      gradient.addColorStop(1, '#0a0a1a');
      
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 2, 512);
      
      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.LinearFilter;
      
      const geometry = new THREE.SphereGeometry(1000, 32, 32);
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.BackSide
      });
      
      const sky = new THREE.Mesh(geometry, material);
      scene.add(sky);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ============================================
    // Terrain Generation
    // ============================================

    let terrainGeometry, terrainMaterial, terrainMesh;
    let noise = new THREE.ImprovedNoise();

    function generateTerrain() {
      const size = CONFIG.TERRAIN_SIZE;
      const segments = CONFIG.TERRAIN_SEGMENTS;
      
      terrainGeometry = new THREE.PlaneGeometry(size, size, segments, segments);
      
      // Create height data
      const position = terrainGeometry.attributes.position;
      const heightData = [];
      
      for (let i = 0; i < position.count; i++) {
        const x = position.getX(i);
        const z = position.getZ(i);
        
        // Multiple octaves of noise for natural terrain
        let height = 0;
        let amplitude = 20;
        let frequency = 0.05;
        
        for (let o = 0; o < 4; o++) {
          height += noise.noise(x * frequency, z * frequency, 0) * amplitude;
          amplitude *= 0.5;
          frequency *= 2;
        }
        
        // Add some hills and mountains
        const centerDist = Math.sqrt(x * x + z * z) / (size / 2);
        height += Math.pow(1 - centerDist, 2) * 15;
        
        // Clamp height
        height = Math.max(-5, Math.min(40, height));
        
        position.setY(i, height);
        heightData[i] = height;
      }
      
      terrainGeometry.computeVertexNormals();
      
      // Create vertex colors for biome variation
      const color = new THREE.Color();
      const colors = [];
      
      for (let i = 0; i < position.count; i++) {
        const x = position.getX(i);
        const z = position.getZ(i);
        const height = position.getY(i);
        
        // Determine biome based on height and position
        let r, g, b;
        
        if (height < 5) {
          // Water/beach
          const waterDepth = Math.max(0, (5 - height) / 5);
          r = 0.1 + waterDepth * 0.2;
          g = 0.3 + waterDepth * 0.3;
          b = 0.5 + waterDepth * 0.3;
        } else if (height < 15) {
          // Grassland
          const grassVariation = noise.noise(x * 0.1, z * 0.1, 0) * 0.2;
          r = 0.2 + grassVariation;
          g = 0.5 + grassVariation;
          b = 0.2 + grassVariation * 0.5;
        } else if (height < 25) {
          // Forest
          const forestVariation = noise.noise(x * 0.1, z * 0.1, 0) * 0.15;
          r = 0.15 + forestVariation;
          g = 0.4 + forestVariation;
          b = 0.15 + forestVariation * 0.3;
        } else {
          // Mountain
          const mountainVariation = noise.noise(x * 0.1, z * 0.1, 0) * 0.1;
          r = 0.4 + mountainVariation;
          g = 0.4 + mountainVariation;
          b = 0.4 + mountainVariation;
        }
        
        // Add some random variation
        r += Math.random() * 0.05;
        g += Math.random() * 0.05;
        b += Math.random() * 0.05;
        
        color.setRGB(r, g, b);
        colors.push(color.r, color.g, color.b);
      }
      
      terrainGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      
      // Create custom shader material for stylized look
      terrainMaterial = new THREE.ShaderMaterial({
        uniforms: {
          time: { value: 0 },
          lightDirection: { value: new THREE.Vector3(0.5, 1, 0.5).normalize() },
          dayFactor: { value: 0.5 }
        },
        vertexShader: `
          varying vec3 vPosition;
          varying vec3 vNormal;
          varying vec3 vColor;
          
          void main() {
            vPosition = position;
            vNormal = normal;
            vColor = color;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float time;
          uniform vec3 lightDirection;
          uniform float dayFactor;
          varying vec3 vPosition;
          varying vec3 vNormal;
          varying vec3 vColor;
          
          void main() {
            // Cel shading
            vec3 normal = normalize(vNormal);
            float light = max(dot(normal, lightDirection), 0.0);
            
            // Add ambient light
            float ambient = 0.4 + dayFactor * 0.2;
            
            // Combine lighting
            float lighting = ambient + light * 0.6;
            
            // Apply to base color
            vec3 baseColor = vColor;
            
            // Add some edge detection
            vec3 edgeColor = vec3(0.2, 0.2, 0.3);
            float edge = 1.0 - smoothstep(0.0, 0.5, abs(dot(normal, vec3(0.0, 1.0, 0.0))));
            
            // Final color
            vec3 finalColor = mix(baseColor, edgeColor, edge * 0.3);
            finalColor = mix(finalColor, vec3(0.1, 0.1, 0.2), 1.0 - lighting);
            
            // Add subtle noise for texture
            float noise = fract(sin(vPosition.x * 10.0 + time) * 1000.0) * 0.02;
            finalColor += noise;
            
            // Day/night tint
            vec3 dayTint = mix(vec3(0.8, 0.9, 1.0), vec3(1.0, 1.0, 1.0), dayFactor);
            vec3 nightTint = mix(vec3(0.3, 0.4, 0.6), vec3(0.1, 0.15, 0.3), 1.0 - dayFactor);
            finalColor *= mix(nightTint, dayTint, dayFactor);
            
            gl_FragColor = vec4(finalColor, 1.0);
          }
        `,
        vertexColors: true
      });
      
      terrainMesh = new THREE.Mesh(terrainGeometry, terrainMaterial);
      terrainMesh.receiveShadow = true;
      terrainMesh.castShadow = true;
      terrainMesh.rotation.x = -Math.PI / 2;
      scene.add(terrainMesh);
      
      state.terrain = {
        mesh: terrainMesh,
        geometry: terrainGeometry,
        size: size,
        heightData: heightData
      };
    }

    // ============================================
    // Procedural Models
    // ============================================

    function createBuildingMesh(type, size = 1) {
      const building = CONFIG.BUILDINGS[type];
      const group = new THREE.Group();
      const baseSize = size * (building.size || 2);
      
      // Base
      const baseGeometry = new THREE.BoxGeometry(baseSize, 0.5 * size, baseSize);
      const baseMaterial = new THREE.MeshStandardMaterial({
        color: building.color,
        roughness: 0.7,
        metalness: 0.2
      });
      const base = new THREE.Mesh(baseGeometry, baseMaterial);
      base.castShadow = true;
      base.receiveShadow = true;
      group.add(base);
      
      // Walls/Structure
      let structureHeight = 3 * size;
      let structureGeometry, structureMaterial;
      
      if (type === 'town-hall') {
        // Town Hall: Large central building
        structureGeometry = new THREE.BoxGeometry(baseSize * 0.8, structureHeight, baseSize * 0.8);
        structureMaterial = new THREE.MeshStandardMaterial({
          color: building.color,
          roughness: 0.6,
          metalness: 0.1
        });
        const structure = new THREE.Mesh(structureGeometry, structureMaterial);
        structure.position.y = 0.25 * size + structureHeight / 2;
        structure.castShadow = true;
        group.add(structure);
        
        // Roof
        const roofGeometry = new THREE.ConeGeometry(baseSize * 0.9, 1.5 * size, 8);
        const roofMaterial = new THREE.MeshStandardMaterial({
          color: 0x1e3a8a,
          roughness: 0.8,
          metalness: 0.1
        });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.position.y = 0.25 * size + structureHeight + 0.75 * size;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
        
        // Towers
        for (let i = 0; i < 4; i++) {
          const angle = (i / 4) * Math.PI * 2;
          const towerGeometry = new THREE.CylinderGeometry(0.5 * size, 0.3 * size, 4 * size, 6);
          const tower = new THREE.Mesh(towerGeometry, structureMaterial);
          tower.position.x = Math.cos(angle) * baseSize * 0.4;
          tower.position.z = Math.sin(angle) * baseSize * 0.4;
          tower.position.y = 0.25 * size + 2 * size;
          tower.castShadow = true;
          group.add(tower);
        }
        
      } else if (type === 'barracks') {
        // Barracks: Long building
        structureGeometry = new THREE.BoxGeometry(baseSize * 1.5, structureHeight, baseSize * 0.6);
        structureMaterial = new THREE.MeshStandardMaterial({
          color: building.color,
          roughness: 0.6,
          metalness: 0.15
        });
        const structure = new THREE.Mesh(structureGeometry, structureMaterial);
        structure.position.y = 0.25 * size + structureHeight / 2;
        structure.castShadow = true;
        group.add(structure);
        
        // Roof
        const roofGeometry = new THREE.BoxGeometry(baseSize * 1.6, 0.3 * size, baseSize * 0.7);
        const roof = new THREE.Mesh(roofGeometry, new THREE.MeshStandardMaterial({
          color: 0x1f2937,
          roughness: 0.9
        }));
        roof.position.y = 0.25 * size + structureHeight + 0.15 * size;
        roof.castShadow = true;
        group.add(roof);
        
      } else if (type === 'farm') {
        // Farm: Simple structure with fields
        structureGeometry = new THREE.BoxGeometry(baseSize * 0.8, structureHeight * 0.7, baseSize * 0.8);
        structureMaterial = new THREE.MeshStandardMaterial({
          color: building.color,
          roughness: 0.8,
          metalness: 0.05
        });
        const structure = new THREE.Mesh(structureGeometry, structureMaterial);
        structure.position.y = 0.25 * size + structureHeight * 0.35;
        structure.castShadow = true;
        group.add(structure);
        
        // Fields (decorative)
        for (let i = 0; i < 4; i++) {
          for (let j = 0; j < 4; j++) {
            const fieldGeometry = new THREE.BoxGeometry(0.4 * size, 0.1 * size, 0.4 * size);
            const field = new THREE.Mesh(fieldGeometry, new THREE.MeshStandardMaterial({
              color: 0x22c55e,
              roughness: 0.9
            }));
            field.position.x = (i - 1.5) * 0.5 * size;
            field.position.z = (j - 1.5) * 0.5 * size;
            field.position.y = 0.1 * size;
            field.castShadow = true;
            group.add(field);
          }
        }
        
      } else if (type === 'lumber-mill') {
        // Lumber Mill
        structureGeometry = new THREE.BoxGeometry(baseSize * 1.2, structureHeight, baseSize * 0.8);
        structureMaterial = new THREE.MeshStandardMaterial({
          color: building.color,
          roughness: 0.7,
          metalness: 0.1
        });
        const structure = new THREE.Mesh(structureGeometry, structureMaterial);
        structure.position.y = 0.25 * size + structureHeight / 2;
        structure.castShadow = true;
        group.add(structure);
        
        // Log piles
        for (let i = 0; i < 3; i++) {
          const logGeometry = new THREE.CylinderGeometry(0.3 * size, 0.3 * size, 1 * size, 8);
          const log = new THREE.Mesh(logGeometry, new THREE.MeshStandardMaterial({
            color: 0x65a30d,
            roughness: 0.8
          }));
          log.position.x = (i - 1) * 1 * size;
          log.position.z = 0.6 * size;
          log.position.y = 0.15 * size + 0.5 * size;
          log.rotation.x = Math.PI / 2;
          log.castShadow = true;
          group.add(log);
        }
        
      } else if (type === 'mine') {
        // Mine
        structureGeometry = new THREE.BoxGeometry(baseSize * 0.8, structureHeight * 0.6, baseSize * 0.8);
        structureMaterial = new THREE.MeshStandardMaterial({
          color: building.color,
          roughness: 0.6,
          metalness: 0.3

        const structure = new THREE.Mesh(structureGeometry, structureMaterial);
        structure.position.y = 0.25 * size + structureHeight * 0.3;
        structure.castShadow = true;
        group.add(structure);
        
        // Mine entrance
        const entranceGeometry = new THREE.BoxGeometry(baseSize * 0.4, structureHeight * 0.4, 0.2 * size);
        const entrance = new THREE.Mesh(entranceGeometry, new THREE.MeshStandardMaterial({
          color: 0x1f2937,
          roughness: 0.9
        }));
        entrance.position.y = 0.25 * size + structureHeight * 0.3;
        entrance.castShadow = true;
        group.add(entrance);
        
      } else if (type === 'tower') {

        case 'wood':

    // ============================================
    // Entity Classes
    // ============================================

    class Entity {
      constructor(mesh, position, type, team = 'player') {
        this.mesh = mesh;
        this.position = position.clone();
        this.type = type;
        this.team = team;
        this.target = null;
        this.health = 100;
        this.maxHealth = 100;
        this.isDead = false;
        this.mesh.position.copy(position);
        
        // Add to scene
        scene.add(this.mesh);
        
        // Add to appropriate array
        if (type === 'building') {
          state.buildings.push(this);
        } else if (team === 'player') {
          state.units.push(this);
        } else {
          state.enemyUnits.push(this);
        }
      }
      
      update(deltaTime) {
        // To be overridden
      }
      
      takeDamage(amount, damageType = 'normal') {
        if (this.isDead) return;
        
        // Apply armor reduction
        const armor = this.armor || 0;
        const damageReduction = armor / (armor + 10);
        const actualDamage = amount * (1 - damageReduction);
        
        this.health -= actualDamage;
        
        if (this.health <= 0) {
          this.die();
        } else {
          // Visual feedback
          this.showDamageIndicator(Math.round(actualDamage));
          
          // Update health bar
          if (this.mesh.userData.healthBar) {
            const healthPercent = this.health / this.maxHealth;
            this.mesh.userData.healthBar.scale.x = healthPercent;
            this.mesh.userData.healthBar.material.color.setHex(
              healthPercent > 0.5 ? 0x10b981 : healthPercent > 0.25 ? 0xf59e0b : 0xef4444
            );
          }
        }
      }
      
      showDamageIndicator(amount) {
        // Create floating damage text
        const damageText = document.createElement('div');
        damageText.className = 'damage-text';
        damageText.textContent = `-${amount}`;
        damageText.style.cssText = `
          position: absolute;
          color: #ef4444;
          font-size: 14px;
          font-weight: bold;
          text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
          pointer-events: none;
          z-index: 100;
          animation: floatUp 1s ease-out forwards;
        `;
        
        // Convert world position to screen position
        const worldPosition = this.mesh.position.clone();
        worldPosition.y += this.mesh.userData.type === 'building' ? 5 : 2;
        const screenPosition = worldPosition.clone().project(camera);
        
        const x = (screenPosition.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(screenPosition.y * 0.5) + 0.5) * window.innerHeight;
        
        damageText.style.left = `${x}px`;
        damageText.style.top = `${y}px`;
        
        document.body.appendChild(damageText);
        
        setTimeout(() => {
          damageText.remove();
        }, 1000);
      }
      
      die() {
        this.isDead = true;
        
        // Remove from arrays
        if (this.type === 'building') {
          const index = state.buildings.indexOf(this);
          if (index > -1) state.buildings.splice(index, 1);
        } else if (this.team === 'player') {
          const index = state.units.indexOf(this);
          if (index > -1) state.units.splice(index, 1);
        } else {
          const index = state.enemyUnits.indexOf(this);
          if (index > -1) state.enemyUnits.splice(index, 1);
        }
        
        // Remove from selection
        const selectionIndex = state.selectedEntities.indexOf(this);
        if (selectionIndex > -1) {
          state.selectedEntities.splice(selectionIndex, 1);
          updateSelectionPanel();
        }
        
        // Create death particles
        createDeathParticles(this.mesh.position, this.team);
        
        // Remove mesh
        scene.remove(this.mesh);
        
        // If building is town hall, game over
        if (this.type === 'building' && this.buildingType === 'town-hall' && this.team === 'player') {
          endGame(false);
        }
        
        // If enemy, add bounty
        if (this.team === 'enemy' && this.bounty) {
          for (const resource in this.bounty) {
            state.resources[resource] += this.bounty[resource];
          }
          updateResourceDisplay();
        }
      }
      
      setSelected(selected) {
        if (this.mesh.userData.selectionRing) {
          this.mesh.userData.selectionRing.visible = selected;
        }
        if (this.mesh.userData.glow) {
          this.mesh.userData.glow.visible = selected;
        }
        if (this.mesh.userData.healthBarBg) {
          this.mesh.userData.healthBarBg.visible = selected;
        }
        if (this.mesh.userData.healthBar) {
          this.mesh.userData.healthBar.visible = selected;
        }
      }
    }

    class Building extends Entity {
      constructor(type, position) {
        const config = CONFIG.BUILDINGS[type];
        const mesh = createBuildingMesh(type);
        
        super(mesh, position, 'building');
        
        this.buildingType = type;
        this.name = config.name;
        this.description = config.description;
        this.icon = config.icon;
        this.color = config.color;
        this.glowColor = config.glowColor;
        this.health = config.health;
        this.maxHealth = config.health;
        this.armor = config.armor || 0;
        this.size = config.size || 2;
        this.population = config.population || 0;
        this.production = config.production || {};
        this.canProduce = config.canProduce || [];
        this.unlocks = config.unlocks || [];
        this.requires = config.requires || [];
        this.attack = config.attack;
        this.isWall = config.isWall || false;
        
        this.buildProgress = 1.0; // 1 = complete
        this.isBuilding = false;
        this.productionTimer = 0;
        this.attackTimer = 0;
        this.attackTarget = null;
        
        // Update health bar
        if (this.mesh.userData.healthBar) {
          this.mesh.userData.healthBar.scale.x = 1;
        }
        
        // Add to world objects
        state.worldObjects.push(this);
      }
      
      update(deltaTime) {
        if (this.isDead) return;
        
        // Building construction
        if (this.isBuilding) {
          this.buildProgress += deltaTime / this.buildTime;
          if (this.buildProgress >= 1.0) {
            this.buildProgress = 1.0;
            this.isBuilding = false;
            
            // Building complete
            if (this.team === 'player') {
              addNotification(`✅ ${this.name} complete!`);
            }
          }
          
          // Visual feedback for construction
          const alpha = Math.sin(this.buildProgress * Math.PI) * 0.5 + 0.5;
          if (this.mesh.userData.glow) {
            this.mesh.userData.glow.material.opacity = alpha * 0.3;
          }
        }
        
        // Resource production
        if (!this.isBuilding && this.buildProgress >= 1.0) {
          this.productionTimer += deltaTime;
          if (this.productionTimer >= 5) { // Produce every 5 seconds
            this.productionTimer = 0;
            
            for (const resource in this.production) {
              state.resources[resource] += this.production[resource];
              
              // Visual feedback
              createResourceParticle(this.mesh.position, resource);
            }
            
            updateResourceDisplay();
          }
        }
        
        // Attack logic for towers
        if (this.attack && !this.isBuilding) {
          this.attackTimer += deltaTime;
          
          // Find target
          if (!this.attackTarget || this.attackTarget.isDead) {
            this.findTarget();
          }
          
          // Attack if target in range
          if (this.attackTarget && !this.attackTarget.isDead) {
            const distance = this.mesh.position.distanceTo(this.attackTarget.mesh.position);
            
            if (distance <= this.attack.range) {
              if (this.attackTimer >= this.attack.cooldown) {
                this.attackTimer = 0;
                this.attackTarget.takeDamage(
                  this.attack.damage * (1 + (state.research['magic-studies'] && this.attack.type === 'magic' ? 0.25 : 0)),
                  this.attack.type
                );
                
                // Create projectile
                createProjectile(
                  this.mesh.position.clone(),
                  this.attackTarget.mesh.position.clone(),
                  this.attack.type === 'magic' ? 'magic' : 'normal',
                  this.team
                );
                
                // Visual feedback
                if (this.mesh.userData.glow) {
                  this.mesh.userData.glow.material.emissiveIntensity = 0.5;
                  setTimeout(() => {
                    if (this.mesh.userData.glow) {
                      this.mesh.userData.glow.material.emissiveIntensity = 0.2;
                    }
                  }, 200);
                }
              }
            }
          }
        }
        
        // Animate particles
        if (this.mesh.userData.particles) {
          this.mesh.userData.particles.forEach(particle => {
            particle.position.y = particle.userData.offsetY + 
              Math.sin(state.gameTime * particle.userData.speed) * 0.1;
          });
        }
      }
      
      findTarget() {
        if (!this.attack) return;
        
        const enemies = this.team === 'player' ? state.enemyUnits : state.units;
        let closestDistance = Infinity;
        let closestEnemy = null;
        
        for (const enemy of enemies) {
          if (enemy.isDead) continue;
          
          const distance = this.mesh.position.distanceTo(enemy.mesh.position);
          if (distance < closestDistance && distance <= this.attack.range * 1.5) {
            closestDistance = distance;
            closestEnemy = enemy;
          }
        }
        
        this.attackTarget = closestEnemy;
      }
    }

    class Unit extends Entity {
      constructor(type, position, team = 'player') {
        const config = team === 'player' ? CONFIG.UNITS[type] : CONFIG.ENEMY_UNITS[type];
        const mesh = createUnitMesh(type, team);
        
        super(mesh, position, 'unit', team);
        
        this.unitType = type;
        this.name = config.name;
        this.description = config.description;
        this.icon = config.icon;
        this.color = config.color;
        this.health = config.health;
        this.maxHealth = config.health;
        this.armor = config.armor || 0;
        this.speed = config.speed;
        this.attack = config.attack;
        this.attackTimer = 0;
        this.gatherRate = config.gatherRate || 0;
        this.carryCapacity = config.carryCapacity || 0;
        this.buildSpeed = config.buildSpeed || 0;
        this.isWorker = config.isWorker || false;
        this.isHero = config.isHero || false;
        this.aura = config.aura;
        this.requires = config.requires || [];
        this.bounty = config.bounty || null;
        this.populationCost = config.population || 1;
        
        this.targetPosition = null;
        this.targetEntity = null;
        this.targetResource = null;
        this.targetBuilding = null;
        this.isMoving = false;
        this.isAttacking = false;
        this.isGathering = false;
        this.isBuilding = false;
        this.carriedResources = {};
        this.carriedAmount = 0;
        
        // Navigation
        this.path = [];
        this.currentPathIndex = 0;
        
        // Formation
        this.formation = null;
        this.formationPosition = null;
        
        // Update health bar
        if (this.mesh.userData.healthBar) {
          this.mesh.userData.healthBar.scale.x = 1;
        }
        
        // Add to world objects
        state.worldObjects.push(this);
        
        // Apply research bonuses
        if (team === 'player') {
          if (state.research['combat-training'] && this.attack && this.attack.type === 'normal') {
            this.attack.damage *= 1.15;
          }
          if (state.research['archery'] && this.attack && this.attack.type === 'piercing') {
            this.attack.damage *= 1.20;
          }
          if (state.research['armor-forging']) {
            this.armor += 2;
          }
        }
      }
      
      update(deltaTime) {
        if (this.isDead) return;
        
        // Apply healing from research
        if (state.team === 'player' && state.research['healing'] && this.health < this.maxHealth) {
          this.health = Math.min(this.maxHealth, this.health + 0.5 * deltaTime);
          if (this.mesh.userData.healthBar) {
            this.mesh.userData.healthBar.scale.x = this.health / this.maxHealth;
          }
        }
        
        // Aura effect for hero
        if (this.aura && this.team === 'player') {
          for (const unit of state.units) {
            if (unit === this) continue;
            const distance = this.mesh.position.distanceTo(unit.mesh.position);
            if (distance <= this.aura.range) {
              if (this.aura.bonus.damage) {
                unit.attack.damage *= (1 + this.aura.bonus.damage);
              }
              if (this.aura.bonus.armor) {
                unit.armor += this.aura.bonus.armor;
              }
            }
          }
        }
        
        // Movement
        if (this.targetPosition) {
          this.moveTowards(this.targetPosition, deltaTime);
        } else if (this.path.length > 0) {
          this.followPath(deltaTime);
        } else if (this.targetEntity && !this.targetEntity.isDead) {
          // Move towards entity
          this.moveTowards(this.targetEntity.mesh.position, deltaTime);
        } else if (this.targetResource && !this.targetResource.isDead) {
          this.moveTowards(this.targetResource.mesh.position, deltaTime);
        } else if (this.targetBuilding && !this.targetBuilding.isDead) {
          this.moveTowards(this.targetBuilding.mesh.position, deltaTime);
        }
        
        // Formation movement
        if (this.formation && this.formationPosition) {
          const formationTarget = this.formation.targetPosition || this.formation.mesh.position;
          const targetPos = new THREE.Vector3(
            formationTarget.x + this.formationPosition.x,
            0,
            formationTarget.z + this.formationPosition.z
          );
          this.moveTowards(targetPos, deltaTime);
        }
        
        // Attack logic
        if (this.attack) {
          this.attackTimer += deltaTime;
          
          // Find target if not already targeting
          if (!this.targetEntity || this.targetEntity.isDead) {
            this.findTarget();
          }
          
          // Attack if target in range
          if (this.targetEntity && !this.targetEntity.isDead) {
            const distance = this.mesh.position.distanceTo(this.targetEntity.mesh.position);
            
            if (distance <= this.attack.range) {
              if (this.attackTimer >= this.attack.cooldown) {
                this.attackTimer = 0;
                
                // Face target
                this.faceTarget(this.targetEntity.mesh.position);
                
                // Deal damage
                this.targetEntity.takeDamage(
                  this.attack.damage * (1 + (state.research['magic-studies'] && this.attack.type === 'magic' ? 0.25 : 0)),
                  this.attack.type
                );
                
                // Create projectile for ranged attacks
                if (this.attack.range > 2) {
                  createProjectile(
                    this.mesh.position.clone(),
                    this.targetEntity.mesh.position.clone(),
                    this.attack.type === 'magic' ? 'magic' : 'normal',
                    this.team
                  );
                }
                
                // Visual feedback
                if (this.mesh.userData.glow) {
                  this.mesh.userData.glow.material.emissiveIntensity = 0.5;
                  setTimeout(() => {
                    if (this.mesh.userData.glow) {
                      this.mesh.userData.glow.material.emissiveIntensity = 0.1;
                    }
                  }, 200);
                }
              }
            } else {
              // Move towards target
              this.moveTowards(this.targetEntity.mesh.position, deltaTime);
            }
          }
        }
        
        // Gathering logic
        if (this.isGathering && this.targetResource && !this.targetResource.isDead) {
          const distance = this.mesh.position.distanceTo(this.targetResource.mesh.position);
          
          if (distance < 2) {
            // Start gathering
            this.gatherTimer = (this.gatherTimer || 0) + deltaTime;
            
            if (this.gatherTimer >= 2) { // Gather every 2 seconds
              this.gatherTimer = 0;
              
              const resourceType = this.targetResource.resourceType;
              const amount = Math.min(
                this.gatherRate,
                this.carryCapacity - this.carriedAmount,
                this.targetResource.amount
              );
              
              if (amount > 0) {
                this.carriedResources[resourceType] = (this.carriedResources[resourceType] || 0) + amount;
                this.carriedAmount += amount;
                this.targetResource.amount -= amount;
                
                // Visual feedback
                createGatherParticle(this.mesh.position, resourceType);
                
                // Return to base if full
                if (this.carriedAmount >= this.carryCapacity) {
                  this.returnToBase();
                }
              }
            }
          } else {
            this.gatherTimer = 0;
          }
        }
        
        // Building logic
        if (this.isBuilding && this.targetBuilding && !this.targetBuilding.isDead) {
          const distance = this.mesh.position.distanceTo(this.targetBuilding.mesh.position);
          
          if (distance < 3) {
            this.buildTimer = (this.buildTimer || 0) + deltaTime;
            
            if (this.buildTimer >= 1) { // Build progress every second
              this.buildTimer = 0;
              this.targetBuilding.buildProgress = Math.min(
                1.0,
                this.targetBuilding.buildProgress + (this.buildSpeed * deltaTime)
              );
              
              // Check if building is complete
              if (this.targetBuilding.buildProgress >= 1.0) {
                this.targetBuilding.buildProgress = 1.0;
                this.targetBuilding.isBuilding = false;
                this.isBuilding = false;
                this.targetBuilding = null;
              }
            }
          } else {
            this.buildTimer = 0;
          }
        }
        
        // Animate particles
        if (this.mesh.userData.particles) {
          this.mesh.userData.particles.forEach(particle => {
            particle.position.y = particle.userData.offsetY + 
              Math.sin(state.gameTime * particle.userData.speed) * 0.1;
          });
        }
        
        // Update mesh rotation based on movement
        if (this.isMoving || (this.path.length > 0)) {
          // Calculate direction
          let targetPos = this.targetPosition || 
            (this.path.length > 0 ? this.path[this.currentPathIndex] : null);
          
          if (targetPos) {
            const direction = new THREE.Vector3(
              targetPos.x - this.mesh.position.x,
              0,
              targetPos.z - this.mesh.position.z
            ).normalize();
            
            if (direction.length() > 0) {
              this.mesh.rotation.y = Math.atan2(direction.x, direction.z);
            }
          }
        }
      }
      
      moveTowards(target, deltaTime) {
        const direction = new THREE.Vector3(
          target.x - this.mesh.position.x,
          0,
          target.z - this.mesh.position.z
        ).normalize();
        
        const distance = this.mesh.position.distanceTo(target);
        const moveDistance = Math.min(distance, this.speed * deltaTime);
        
        if (distance > 0.5) {
          this.mesh.position.add(direction.multiplyScalar(moveDistance));
          this.isMoving = true;
          
          // Update terrain height
          updateTerrainHeight(this.mesh);
        } else {
          this.mesh.position.copy(target);
          this.isMoving = false;
          this.targetPosition = null;
        }
      }
      
      followPath(deltaTime) {
        if (this.path.length === 0) {
          this.isMoving = false;
          return;
        }
        
        const target = this.path[this.currentPathIndex];
        const distance = this.mesh.position.distanceTo(target);
        
        if (distance < 1) {
          this.currentPathIndex++;
          if (this.currentPathIndex >= this.path.length) {
            this.path = [];
            this.currentPathIndex = 0;
            this.isMoving = false;
            return;
          }
        }
        
        this.moveTowards(target, deltaTime);
      }
      
      findTarget() {
        if (!this.attack) return;
        
        const enemies = this.team === 'player' ? state.enemyUnits : state.units;
        const buildings = this.team === 'player' ? state.enemyBuildings || [] : state.buildings;
        const allTargets = [...enemies, ...buildings];
        
        let closestDistance = Infinity;
        let closestTarget = null;
        
        for (const target of allTargets) {
          if (target.isDead) continue;
          
          const distance = this.mesh.position.distanceTo(target.mesh.position);
          if (distance < closestDistance && distance <= this.attack.range * 2) {
            closestDistance = distance;
            closestTarget = target;
          }
        }
        
        this.targetEntity = closestTarget;
      }
      
      faceTarget(targetPosition) {
        const direction = new THREE.Vector3(
          targetPosition.x - this.mesh.position.x,
          0,
          targetPosition.z - this.mesh.position.z
        ).normalize();
        
        if (direction.length() > 0) {
          this.mesh.rotation.y = Math.atan2(direction.x, direction.z);
        }
      }
      
      returnToBase() {
        // Find nearest friendly building that accepts resources
        const friendlyBuildings = state.buildings.filter(b => 
          b.team === this.team && !b.isDead && b.buildingType === 'town-hall'
        );
        
        if (friendlyBuildings.length > 0) {
          const nearestBuilding = friendlyBuildings.reduce((nearest, building) => {
            const distance = this.mesh.position.distanceTo(building.mesh.position);
            return distance < this.mesh.position.distanceTo(nearest.mesh.position) ? building : nearest;
          }, friendlyBuildings[0]);
          
          this.targetBuilding = nearestBuilding;
          this.targetPosition = nearestBuilding.mesh.position.clone();
          this.isGathering = false;
          this.targetResource = null;
        }
      }
      
      deliverResources() {
        if (this.targetBuilding && !this.targetBuilding.isDead && this.carriedAmount > 0) {
          for (const resource in this.carriedResources) {
            state.resources[resource] += this.carriedResources[resource];
          }
          
          this.carriedResources = {};
          this.carriedAmount = 0;
          updateResourceDisplay();
          
          // Return to gathering
          if (this.targetResource && !this.targetResource.isDead) {
            this.targetPosition = this.targetResource.mesh.position.clone();
            this.isGathering = true;
          }
        }
      }
    }

    class ResourceNode extends Entity {
      constructor(type, position, amount = 100) {
        const mesh = createResourceNodeMesh(type);
        
        super(mesh, position, 'resource-node');
        
        this.resourceType = type;

        this.maxAmount = amount;
        this.respawnTimer = 0;
        this.isActive = true;
        
        // Add to world objects and resource nodes
        state.worldObjects.push(this);
        state.resourceNodes.push(this);
      }
      
      update(deltaTime) {
        if (this.isDead) return;
        
        // Respawn logic
        if (this.amount <= 0) {
          this.respawnTimer += deltaTime;
          
          if (this.respawnTimer >= CONFIG.RESOURCE_NODES[this.resourceType].respawnTime) {
            this.amount = this.maxAmount;
            this.respawnTimer = 0;
            this.mesh.visible = true;
            
            // Show respawn particle
            createRespawnParticle(this.mesh.position, this.resourceType);
          } else {
            this.mesh.visible = false;
          }
        }
        
        // Animate particles
        if (this.mesh.userData.particles) {
          this.mesh.userData.particles.forEach(particle => {
            particle.position.y = particle.userData.offsetY + 
              Math.sin(state.gameTime * particle.userData.speed) * 0.1;
          });
        }
        
        // Animate glow
        if (this.mesh.userData.glow) {
          this.mesh.userData.glow.material.emissiveIntensity = 
            0.2 + Math.sin(state.gameTime * 2) * 0.1;
        }
      }
    }

    // ============================================
    // Projectile System
    // ============================================

    function createProjectile(start, end, type = 'normal', team = 'player') {
      const mesh = type === 'magic' ? createMagicProjectileMesh() : createProjectileMesh();
      
      const projectile = {
        mesh: mesh,
        start: start.clone(),
        end: end.clone(),
        position: start.clone(),
        target: null,
        speed: type === 'magic' ? 30 : 40,
        damage: type === 'magic' ? 25 : 15,
        damageType: type,
        team: team,
        lifetime: 2,
        isDead: false,
        type: type
      };
      
      // Find target entity at end position
      for (const unit of [...state.units, ...state.enemyUnits]) {
        if (unit.mesh.position.distanceTo(end) < 1) {
          projectile.target = unit;
          break;
        }
      }
      
      scene.add(mesh);
      mesh.position.copy(start);
      state.projectiles.push(projectile);
      
      return projectile;
    }

    function updateProjectiles(deltaTime) {
      for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const projectile = state.projectiles[i];
        
        if (projectile.isDead) {
          scene.remove(projectile.mesh);
          state.projectiles.splice(i, 1);
          continue;
        }
        
        projectile.lifetime -= deltaTime;
        
        if (projectile.lifetime <= 0) {
          projectile.isDead = true;
          continue;
        }
        
        // Move towards target
        let targetPosition = projectile.end;
        
        if (projectile.target && !projectile.target.isDead) {
          targetPosition = projectile.target.mesh.position;
        }
        
        const direction = new THREE.Vector3(
          targetPosition.x - projectile.position.x,
          targetPosition.y - projectile.position.y + 0.5,
          targetPosition.z - projectile.position.z
        ).normalize();
        
        const moveDistance = projectile.speed * deltaTime;
        projectile.position.add(direction.multiplyScalar(moveDistance));
        projectile.mesh.position.copy(projectile.position);
        
        // Check for collision
        if (projectile.target && !projectile.target.isDead) {
          const distance = projectile.position.distanceTo(projectile.target.mesh.position);
          
          if (distance < 0.5) {
            // Hit target
            projectile.target.takeDamage(projectile.damage, projectile.damageType);
            
            // Create impact particles
            createImpactParticles(projectile.position, projectile.damageType);
            
            projectile.isDead = true;
          }
        } else {
          // Check distance to end position
          const distance = projectile.position.distanceTo(projectile.end);
          if (distance < 0.5 || distance > 100) {
            // Missed or out of range
            createImpactParticles(projectile.position, projectile.damageType);
            projectile.isDead = true;
          }
        }
        
        // Rotate projectile
        if (projectile.mesh.userData.trail) {
          projectile.mesh.rotation.x = Math.atan2(
            direction.y,
            Math.sqrt(direction.x * direction.x + direction.z * direction.z)
          );
          projectile.mesh.rotation.z = Math.atan2(direction.x, direction.z);
        }
      }
    }

    // ============================================
    // Particle System
    // ============================================

    function createDeathParticles(position, team) {
      const color = team === 'player' ? 0x3b82f6 : 0xef4444;
      
      for (let i = 0; i < 10; i++) {
        const geometry = new THREE.SphereGeometry(0.1, 8, 8);
        const material = new THREE.MeshStandardMaterial({
          color: color,
          transparent: true,
          opacity: 0.8
        });
        const particle = new THREE.Mesh(geometry, material);
        
        particle.position.copy(position);
        particle.position.y += Math.random() * 2;
        
        particle.userData = {
          type: 'death-particle',
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 5,
            Math.random() * 3,
            (Math.random() - 0.5) * 5
          ),
          lifetime: 1,
          maxLifetime: 1
        };
        
        scene.add(particle);
        state.particles.push(particle);
      }
    }

    function createResourceParticle(position, resourceType) {
      const colors = {

    function updateParticles(deltaTime) {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const particle = state.particles[i];
        
        particle.userData.lifetime -= deltaTime;
        
        if (particle.userData.lifetime <= 0) {
          scene.remove(particle);
          state.particles.splice(i, 1);
          continue;
        }
        
        // Update position
        particle.position.add(
          particle.userData.velocity.clone().multiplyScalar(deltaTime)
        );
        
        // Apply gravity
        if (particle.userData.velocity.y > -5) {
          particle.userData.velocity.y -= 5 * deltaTime;
        }
        
        // Update opacity based on lifetime
        const opacity = particle.userData.lifetime / particle.userData.maxLifetime;
        particle.material.opacity = opacity;
        
        // Update size for some effects
        if (particle.userData.type === 'death-particle') {
          particle.scale.setScalar(opacity * 0.5 + 0.5);
        }
      }
    }

    // Pathfinding
    // ============================================

    function findPath(start, end) {
      // Simple direct path for now
      // In a full implementation, this would use A* or flow fields
      
      const path = [];
      const steps = 10;
      
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        path.push(new THREE.Vector3(
          start.x + (end.x - start.x) * t,
          0,
          start.z + (end.z - start.z) * t
        ));
      }
      
      return path;
    }

    function updateTerrainHeight(entity) {
      // Raycast to terrain to update Y position
      const raycaster = new THREE.Raycaster(
        new THREE.Vector3(entity.position.x, 100, entity.position.z),
        new THREE.Vector3(0, -1, 0),
        0,
        200
      );
      
      const intersects = raycaster.intersectObject(state.terrain.mesh);
      
      if (intersects.length > 0) {
        const height = intersects[0].point.y;
        
        // Smooth transition
        entity.position.y = height + (entity.userData.type === 'unit' ? 0.5 : 0);
      }
    }

    let enemyBase = null;
    let enemyBuildings = [];

    function initAI() {
      // Create enemy base at opposite corner
      const basePosition = new THREE.Vector3(
        CONFIG.TERRAIN_SIZE / 2 - 50,
        0,
        CONFIG.TERRAIN_SIZE / 2 - 50
      );
      
      // Create enemy town hall
      enemyBase = new Building('town-hall', basePosition);
      enemyBase.team = 'enemy';
      enemyBase.mesh.userData.team = 'enemy';
      enemyBase.health *= 2;
      enemyBase.maxHealth *= 2;
      
      // Add to enemy buildings
      enemyBuildings.push(enemyBase);
      state.enemyBuildings = enemyBuildings;
      
      // Create some initial enemy units
      for (let i = 0; i < 3; i++) {
        const spawnPos = new THREE.Vector3(
          basePosition.x + (Math.random() - 0.5) * 10,
          0,
          basePosition.z + (Math.random() - 0.5) * 10
        );
        new Unit('scout', spawnPos, 'enemy');
      }
    }

    function updateAI(deltaTime) {
      if (state.gameOver) return;
      
      // Update enemy buildings
      for (const building of enemyBuildings) {
        if (building.isDead) continue;
        
        // Produce units
        if (building.canProduce && building.canProduce.length > 0) {
          building.productionTimer += deltaTime;
          
          if (building.productionTimer >= 10) { // Produce every 10 seconds
            building.productionTimer = 0;
            
            const unitType = building.canProduce[Math.floor(Math.random() * building.canProduce.length)];
            
            // Find spawn position near building
            const spawnPos = new THREE.Vector3(
              building.mesh.position.x + (Math.random() - 0.5) * 5,
              0,
              building.mesh.position.z + (Math.random() - 0.5) * 5
            );
            
            new Unit(unitType, spawnPos, 'enemy');
          }
        }
        
        // Tower attack logic
        if (building.attack) {
          building.findTarget();
        }
      }
      
      // Update enemy units
      for (const unit of state.enemyUnits) {
        if (unit.isDead) continue;
        
        // Simple AI: Attack nearest player unit or building
        if (!unit.targetEntity || unit.targetEntity.isDead) {
          unit.findTarget();
        }
        
        // If no target, move towards player base
        if (!unit.targetEntity || unit.targetEntity.isDead) {
          const playerBuildings = state.buildings.filter(b => b.team === 'player' && !b.isDead);
          if (playerBuildings.length > 0) {
            const nearestBuilding = playerBuildings.reduce((nearest, building) => {
              const distance = unit.mesh.position.distanceTo(building.mesh.position);
              return distance < unit.mesh.position.distanceTo(nearest.mesh.position) ? building : nearest;
            }, playerBuildings[0]);
            
            unit.targetEntity = nearestBuilding;
          }
        }
      }
      
      // Wave system
      updateWaves(deltaTime);
    }

    function updateWaves(deltaTime) {
      if (state.waves.length === 0 && state.currentWave < CONFIG.WAVES.length) {
        // Start next wave
        state.waveTimer += deltaTime;
        
        if (state.waveTimer >= state.waveDelay) {
          startNextWave();
        }
      }
      
      // Update active waves
      for (let i = state.waves.length - 1; i >= 0; i--) {
        const wave = state.waves[i];
        wave.timer += deltaTime;
        
        if (wave.timer >= wave.spawnDelay && wave.spawnIndex < wave.enemies.length) {
          const enemyDef = wave.enemies[wave.spawnIndex];
          
          for (let j = 0; j < enemyDef.count; j++) {
            // Find spawn position
            const spawnPos = new THREE.Vector3(
              CONFIG.TERRAIN_SIZE / 2 - 50 + (Math.random() - 0.5) * 20,
              0,
              CONFIG.TERRAIN_SIZE / 2 - 50 + (Math.random() - 0.5) * 20
            );
            
            new Unit(enemyDef.type, spawnPos, 'enemy');
          }
          
          wave.spawnIndex++;
          wave.timer = 0;
          wave.spawnDelay = wave.delay / wave.enemies.length;
        }
        
        if (wave.spawnIndex >= wave.enemies.length) {
          state.waves.splice(i, 1);
        }
      }
    }

    function startNextWave() {
      if (state.currentWave >= CONFIG.WAVES.length) {
        // Generate endless wave
        const waveIndex = state.currentWave - CONFIG.WAVES.length;
        const difficulty = CONFIG.DIFFICULTY[state.difficulty];
        
        const wave = {
          enemies: generateEndlessWave(waveIndex),
          delay: Math.max(30, 60 - waveIndex * CONFIG.WAVE_SCALING.delayReduction),
          goldBonus: Math.floor(100 * Math.pow(1.1, waveIndex)),
          timer: 0,
          spawnDelay: 0.5,
          spawnIndex: 0
        };
        
        state.waves.push(wave);
        state.currentWave++;
        state.waveTimer = 0;
        state.waveDelay = wave.delay;
        
        addNotification(`🌊 Wave ${state.currentWave} - Endless Onslaught!`);
        updateWaveTimer();
        
      } else {
        // Use predefined wave
        const waveDef = CONFIG.WAVES[state.currentWave];
        const difficulty = CONFIG.DIFFICULTY[state.difficulty];
        
        const wave = {
          enemies: waveDef.enemies.map(e => ({
            type: e.type,
            count: Math.floor(e.count * difficulty.enemyCountMultiplier)
          })),
          delay: waveDef.delay * difficulty.waveDelayMultiplier,
          goldBonus: waveDef.goldBonus,
          timer: 0,
          spawnDelay: waveDef.delay / waveDef.enemies.length * 0.5,
          spawnIndex: 0
        };
        
        state.waves.push(wave);
        state.currentWave++;
        state.waveTimer = 0;
        state.waveDelay = wave.delay;
        
        addNotification(`🌊 Wave ${state.currentWave} approaching!`);
        updateWaveTimer();
      }
    }

    function generateEndlessWave(index) {
      const types = ['scout', 'raider', 'archer', 'brute', 'necromancer'];
      const baseCount = 5 + Math.floor(index * 0.5);
      const difficulty = CONFIG.DIFFICULTY[state.difficulty];
      
      // Add behemoth every 5 waves
      if (index % 5 === 0) {
        types.push('behemoth');
      }
      
      const enemies = [];
      const numGroups = 2 + Math.floor(index / 3);
      
      for (let i = 0; i < numGroups; i++) {
        const type = types[Math.floor(Math.random() * types.length)];
        const count = Math.floor(baseCount * (0.8 + Math.random() * 0.4) * difficulty.enemyCountMultiplier);
        enemies.push({ type, count });
      }
      
      return enemies;
    }

    function initFogOfWar() {
      // Create a full-screen quad for fog of war
      const geometry = new THREE.PlaneGeometry(CONFIG.TERRAIN_SIZE * 2, CONFIG.TERRAIN_SIZE * 2);
      
      fogOfWarTexture = new THREE.TextureLoader().load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==');
      
      fogOfWarMaterial = new THREE.MeshBasicMaterial({
        map: fogOfWarTexture,
        transparent: true,
        opacity: 0.8,
        color: 0x000000
      });
      
      fogOfWarMesh = new THREE.Mesh(geometry, fogOfWarMaterial);
      fogOfWarMesh.position.y = 1;
      fogOfWarMesh.rotation.x = Math.PI / 2;
      scene.add(fogOfWarMesh);
      
      // Create render target for visibility
      const renderTarget = new THREE.WebGLRenderTarget(
        CONFIG.TERRAIN_SIZE,
        CONFIG.TERRAIN_SIZE,
        { minFilter: THREE.LinearFilter, magFilter: THREE.NearestFilter }
      );
      
      state.fogOfWar = {
        mesh: fogOfWarMesh,
        texture: fogOfWarTexture,
        renderTarget: renderTarget
      };
    }

    function updateFogOfWar() {
      if (!state.fogOfWar) return;
      
      // Simple implementation: reveal area around friendly units and buildings
      // In a full implementation, this would use a more sophisticated technique
      
      const visibilityMap = new Uint8Array(CONFIG.TERRAIN_SIZE * CONFIG.TERRAIN_SIZE);
      
      // Mark visible areas
      for (const entity of [...state.units, ...state.buildings]) {
        if (entity.team !== 'player' || entity.isDead) continue;
        
        const pos = entity.mesh.position;
        const radius = entity.type === 'building' ? 15 : 8;
        
        for (let x = Math.max(0, pos.x - radius); x < Math.min(CONFIG.TERRAIN_SIZE, pos.x + radius); x++) {
          for (let z = Math.max(0, pos.z - radius); z < Math.min(CONFIG.TERRAIN_SIZE, pos.z + radius); z++) {
            const dist = Math.sqrt(
              Math.pow(x - pos.x, 2) + Math.pow(z - pos.z, 2)
            );
            if (dist <= radius) {
              const index = Math.floor(x) + Math.floor(z) * CONFIG.TERRAIN_SIZE;
              visibilityMap[index] = 255;
            }
          }
        }
      }
      
      // Update fog of war texture (simplified)
      // This is a placeholder - a real implementation would use a canvas or render target
    }

    function updateDayNight() {
      const indicator = document.getElementById('day-night-indicator');
      const time = state.dayTime % CONFIG.DAY_DURATION;
      const dayFactor = Math.min(1, Math.max(0, 1 - Math.abs(time - CONFIG.DAY_DURATION / 2) / (CONFIG.DAY_DURATION / 2)));
      
      state.isDay = dayFactor > 0.5;
      
      // Update lighting
      const lightIntensity = 0.5 + dayFactor * 0.5;
      directionalLight.intensity = lightIntensity;
      hemisphereLight.intensity = 0.3 + dayFactor * 0.3;
      ambientLight.intensity = 0.3 + dayFactor * 0.2;
      
      // Update terrain shader
      if (terrainMaterial) {
        terrainMaterial.uniforms.dayFactor.value = dayFactor;
      }
      
      // Update indicator
      const percent = (time / CONFIG.DAY_DURATION) * 100;
      indicator.style.width = `${percent}%`;
      
      // Update colors based on time of day
      if (dayFactor > 0.7) {
        // Day
        indicator.style.background = 'linear-gradient(90deg, #fbbf24, #f59e0b)';
      } else if (dayFactor > 0.3) {
        // Dusk/Dawn
        indicator.style.background = 'linear-gradient(90deg, #8b5cf6, #6366f1)';
      } else {
        // Night
        indicator.style.background = 'linear-gradient(90deg, #1e40af, #0c4a6e)';
      }
    }
