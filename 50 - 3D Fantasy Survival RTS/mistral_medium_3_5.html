          unitInfoTitle.textContent = `${buildings.length} Buildings Selected`;
          unitInfoContent.innerHTML = `
            <button class="button button-danger" onclick="sellSelected()">
              Sell (50% refund)
            </button>
          `;
        }
      } else {
        document.getElementById('unit-info').style.display = 'none';
      }
    }

    function addNotification(message) {
      const container = document.getElementById('notifications');
      
      const notification = document.createElement('div');
      notification.className = 'notification';
      notification.textContent = message;
      
      container.appendChild(notification);
      
      // Show with animation
      setTimeout(() => {
        notification.classList.add('show');
      }, 10);
      
      // Remove after delay
      setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease-out forwards';
        setTimeout(() => {
          notification.remove();
        }, 300);
      }, 5000);
      
      // Keep only last 5 notifications
      while (container.children.length > 5) {
        container.removeChild(container.children[0]);
      }
    }

    function formatCost(cost) {
      return Object.entries(cost).map(([k, v]) => `${v}${k[0]}`).join(' ');
    }

    // ============================================
    // Input Handling
    // ============================================

    function initInput() {
      // Mouse events
      document.getElementById('game-canvas').addEventListener('mousedown', onMouseDown);
      document.getElementById('game-canvas').addEventListener('mousemove', onMouseMove);
      document.getElementById('game-canvas').addEventListener('mouseup', onMouseUp);
      document.getElementById('game-canvas').addEventListener('contextmenu', (e) => e.preventDefault());
      
      // Keyboard events
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      
      // Touch events for mobile
      document.getElementById('game-canvas').addEventListener('touchstart', onTouchStart);
      document.getElementById('game-canvas').addEventListener('touchmove', onTouchMove);
      document.getElementById('game-canvas').addEventListener('touchend', onTouchEnd);
    }

    function onMouseDown(event) {
      state.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      state.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      state.mouse.down = event.button === 0;
      state.mouse.rightDown = event.button === 2;
      
      if (event.button === 0) {
        handleLeftClick(event);
      } else if (event.button === 2) {
        handleRightClick(event);
      }
    }

    function onMouseMove(event) {
      state.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      state.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      
      if (state.mouse.down) {
        // Box selection
        updateSelectionBox(event);
      }
      
      // Update build preview
      if (state.buildMode) {
        updateBuildPreview(event);
      }
    }

    function onMouseUp(event) {
      state.mouse.down = false;
      state.mouse.rightDown = false;
      
      if (event.button === 0 && state.buildMode) {
        attemptPlaceBuilding(event);
      }
      
      // Clear selection box
      clearSelectionBox();
    }

    function onTouchStart(event) {
      event.preventDefault();
      const touch = event.touches[0];
      state.mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
      state.mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
      state.mouse.down = true;
      
      handleLeftClick(event);
    }

    function onTouchMove(event) {
      event.preventDefault();
      const touch = event.touches[0];
      state.mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
      state.mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
      
      if (state.mouse.down && state.buildMode) {
        updateBuildPreview(event);
      }
    }

    function onTouchEnd(event) {
      event.preventDefault();
      state.mouse.down = false;
      
      if (state.buildMode) {
        attemptPlaceBuilding(event);
      }
      
      clearSelectionBox();
    }

    function onKeyDown(event) {
      state.keyboard[event.code] = true;
      
      // Handle hotkeys
      if (event.code === 'Escape') {
        cancelBuildMode();
        clearSelection();
      }
      
      // Camera movement with WASD
      if (event.code === 'KeyW') {
        camera.position.z -= 10;
      }
      if (event.code === 'KeyS') {
        camera.position.z += 10;
      }
      if (event.code === 'KeyA') {
        camera.position.x -= 10;
      }
      if (event.code === 'KeyD') {
        camera.position.x += 10;
      }
      
      // Selection hotkeys
      if (event.code === 'KeyT') {
        selectAllUnits('worker');
      }
      if (event.code === 'KeyM') {
        selectAllUnits('warrior');
      }
      if (event.code === 'KeyA') {
        selectAllUnits('archer');
      }
      
      // Stop command
      if (event.code === 'KeyS' && !state.mouse.rightDown) {
        commandStopAll();
      }
      
      // Attack command
      if (event.code === 'KeyA' && state.selectedEntities.length > 0) {
        commandAllAttack();
      }
    }

    function onKeyUp(event) {
      state.keyboard[event.code] = false;
    }

    let selectionBox = null;
    let selectionStart = null;

    function handleLeftClick(event) {
      if (state.buildMode) {
        return; // Handled in mouseup
      }
      
      // Start selection box
      selectionStart = { x: event.clientX, y: event.clientY };
      
      // Check if we clicked on an entity
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );
      
      raycaster.setFromCamera(mouse, camera);
      
      const intersects = raycaster.intersectObjects(
        state.worldObjects.map(e => e.mesh),
        true
      );
      
      if (intersects.length > 0) {
        const entity = findEntityByMesh(intersects[0].object);
        if (entity) {
          // Check if it's an enemy
          if (entity.team === 'enemy' && state.selectedEntities.length > 0) {
            // Attack enemy
            for (const selected of state.selectedEntities) {
              if (selected.attack && selected.type === 'unit') {
                selected.targetEntity = entity;
              }
            }
          } else if (entity.team === 'player') {
            // Select entity
            if (event.ctrlKey || event.metaKey) {
              // Multi-select
              toggleSelection(entity);
            } else {
              // Single select
              selectEntity(entity);
            }
          }
        }
      } else {
        // Clear selection if clicking empty space without ctrl
        if (!event.ctrlKey && !event.metaKey) {
          clearSelection();
        }
      }
    }

    function handleRightClick(event) {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );
      
      raycaster.setFromCamera(mouse, camera);
      
      // Raycast to terrain
      const terrainIntersects = raycaster.intersectObject(state.terrain.mesh);
      
      if (terrainIntersects.length > 0) {
        const targetPosition = terrainIntersects[0].point;
        
        // Check if we clicked on an entity
        const entityIntersects = raycaster.intersectObjects(
          state.worldObjects.map(e => e.mesh),
          true
        );
        
        if (entityIntersects.length > 0) {
          const entity = findEntityByMesh(entityIntersects[0].object);
          
          if (entity) {
            // If it's a resource node, send workers to gather
            if (entity.type === 'resource-node' && state.selectedEntities.length > 0) {
              for (const selected of state.selectedEntities) {
                if (selected.isWorker && selected.type === 'unit') {
                  selected.targetResource = entity;
                  selected.isGathering = true;
                } else if (selected.attack && selected.type === 'unit') {
                  selected.targetEntity = entity.team === 'enemy' ? entity : null;
                }
              }
            } else if (entity.team === 'enemy' && state.selectedEntities.length > 0) {
              // Attack enemy
              for (const selected of state.selectedEntities) {
                if (selected.attack && selected.type === 'unit') {
                  selected.targetEntity = entity;
                }
              }
            } else if (entity.team === 'player' && entity.type === 'building' && 
                       entity.isBuilding && state.selectedEntities.length > 0) {
              // Send workers to build
              for (const selected of state.selectedEntities) {
                if (selected.isWorker && selected.type === 'unit') {
                  selected.targetBuilding = entity;
                  selected.isBuilding = true;
                }
              }
            }
          }
        }
        
        // Move selected units to position
        if (state.selectedEntities.length > 0) {
          for (const selected of state.selectedEntities) {
            if (selected.type === 'unit') {
              selected.targetPosition = targetPosition.clone();
              selected.path = findPath(selected.mesh.position, targetPosition);
              selected.currentPathIndex = 0;
            }
          }
        }
      }
    }

    function updateSelectionBox(event) {
      if (!selectionStart) return;
      
      if (!selectionBox) {
        selectionBox = document.createElement('div');
        selectionBox.style.cssText = `
          position: absolute;
          border: 2px dashed #3b82f6;
          background: rgba(59, 130, 246, 0.1);
          pointer-events: none;
          z-index: 50;
        `;
        document.getElementById('game-container').appendChild(selectionBox);
      }
      
      const x = Math.min(selectionStart.x, event.clientX);
      const y = Math.min(selectionStart.y, event.clientY);
      const width = Math.abs(selectionStart.x - event.clientX);
      const height = Math.abs(selectionStart.y - event.clientY);
      
      selectionBox.style.left = `${x}px`;
      selectionBox.style.top = `${y}px`;
      selectionBox.style.width = `${width}px`;
      selectionBox.style.height = `${height}px`;
    }

    function clearSelectionBox() {
      if (selectionBox) {
        selectionBox.remove();
        selectionBox = null;
      }
      selectionStart = null;
    }

    function attemptPlaceBuilding(event) {
      if (!state.buildMode || !state.placementValid) return;
      
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(state.terrain.mesh);
      
      if (intersects.length > 0) {
        const position = intersects[0].point;
        
        // Check if position is valid
        if (isValidBuildPosition(position, state.buildMode)) {
          placeBuilding(position);
        }
      }
      
      cancelBuildMode();
    }

    function updateBuildPreview(event) {
      if (!state.buildMode) return;
      
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(state.terrain.mesh);
      
      if (intersects.length > 0) {
        const position = intersects[0].point;
        
        // Check validity
        const valid = isValidBuildPosition(position, state.buildMode);
        state.placementValid = valid;
        
        // Update preview
        if (!state.buildPreview) {
          state.buildPreview = createBuildingMesh(state.buildMode, 0.8);
          state.buildPreview.position.copy(position);
          scene.add(state.buildPreview);
        } else {
          state.buildPreview.position.copy(position);
        }
        
        // Color preview based on validity
        state.buildPreview.children.forEach(child => {
          if (child.material) {
            child.material.color.setHex(valid ? 0x10b981 : 0xef4444);
            child.material.transparent = true;
            child.material.opacity = 0.7;
          }
        });
      }
    }

    function isValidBuildPosition(position, buildingType) {
      const config = CONFIG.BUILDINGS[buildingType];
      const size = (config.size || 2) * 0.5;
      
      // Check if position is on valid terrain
      const raycaster = new THREE.Raycaster(
        new THREE.Vector3(position.x, 100, position.z),
        new THREE.Vector3(0, -1, 0),
        0,
        200
      );
      
      const intersects = raycaster.intersectObject(state.terrain.mesh);
      if (intersects.length === 0) return false;
      
      const terrainHeight = intersects[0].point.y;
      
      // Check if too close to other buildings
      for (const entity of [...state.buildings, ...enemyBuildings]) {
        if (entity.isDead) continue;
        
        const distance = position.distanceTo(entity.mesh.position);
        if (distance < size + (entity.size || 2) * 0.5 + 2) {
          return false;
        }
      }
      
      // Check if too close to resource nodes
      for (const node of state.resourceNodes) {
        if (node.isDead) continue;
        
        const distance = position.distanceTo(node.mesh.position);
        if (distance < size + 1 + 2) {
          return false;
        }
      }
      
      // Check if we have enough resources
      const cost = config.cost;
      for (const resource in cost) {
        if (state.resources[resource] < cost[resource]) {
          return false;
        }
      }
      
      // Check if we have population
      if (state.population + (config.population || 0) > state.maxPopulation) {
        return false;
      }
      
      // Check requirements
      if (config.requires && config.requires.length > 0) {
        for (const req of config.requires) {
          if (!state.buildings.some(b => b.buildingType === req && !b.isDead)) {
            return false;
          }
        }
      }
      
      return true;
    }

    function placeBuilding(position) {
      const buildingType = state.buildMode;
      const config = CONFIG.BUILDINGS[buildingType];
      
      // Deduct resources
      for (const resource in config.cost) {
        state.resources[resource] -= config.cost[resource];
      }
      
      // Deduct population
      if (config.population) {
        state.maxPopulation += config.population;
      }
      
      // Create building
      const building = new Building(buildingType, position);
      building.team = 'player';
      building.mesh.userData.team = 'player';
      building.buildProgress = 0;
      building.isBuilding = true;
      building.buildTime = config.buildTime || 5;
      
      // Select the new building
      selectEntity(building);
      
      updateResourceDisplay();
      addNotification(`🏗️ Building ${config.name}`);
    }

    function findEntityByMesh(mesh) {
      for (const entity of [...state.buildings, ...state.units, ...state.enemyUnits, ...state.resourceNodes]) {
        if (entity.mesh === mesh || entity.mesh.children.includes(mesh)) {
          return entity;
        }
      }
      return null;
    }

    // ============================================
    // Game Commands
    // ============================================

    function selectEntity(entity) {
      // Deselect all
      for (const e of state.selectedEntities) {
        e.setSelected(false);
      }
      
      state.selectedEntities = [entity];
      entity.setSelected(true);
      
      updateSelectionPanel();
    }

    function toggleSelection(entity) {
      const index = state.selectedEntities.indexOf(entity);
      
      if (index > -1) {
        // Deselect
        entity.setSelected(false);
        state.selectedEntities.splice(index, 1);
      } else {
        // Select
        entity.setSelected(true);
        state.selectedEntities.push(entity);
      }
      
      updateSelectionPanel();
    }

    function clearSelection() {
      for (const entity of state.selectedEntities) {
        entity.setSelected(false);
      }
      state.selectedEntities = [];
      updateSelectionPanel();
    }

    function selectAllUnits(type) {
      clearSelection();
      
      for (const unit of state.units) {
        if (unit.isDead) continue;
        
        if (!type || unit.unitType === type) {
          unit.setSelected(true);
          state.selectedEntities.push(unit);
        }
      }
      
      updateSelectionPanel();
    }

    function setBuildMode(buildingType) {
      if (state.buildMode) {
        cancelBuildMode();
      }
      
      state.buildMode = buildingType;
      
      // Show build panel
      document.getElementById('build-panel').style.display = 'block';
      
      addNotification(`Building mode: ${CONFIG.BUILDINGS[buildingType].name}`);
    }

    function cancelBuildMode() {
      state.buildMode = null;
      
      if (state.buildPreview) {
        scene.remove(state.buildPreview);
        state.buildPreview = null;
      }
      
      document.getElementById('build-panel').style.display = 'none';
    }

    function trainUnit(unitType, buildingType) {
      const unitConfig = CONFIG.UNITS[unitType];
      const building = state.buildings.find(b => b.buildingType === buildingType && !b.isDead);
      
      if (!building) return;
      
      // Check requirements
      if (unitConfig.requires && unitConfig.requires.length > 0) {
        for (const req of unitConfig.requires) {
          if (!state.buildings.some(b => b.buildingType === req && !b.isDead)) {
            addNotification(`⚠️ Requires ${CONFIG.BUILDINGS[req].name}`);
            return;
          }
        }
      }
      
      // Check resources
      for (const resource in unitConfig.cost) {
        if (state.resources[resource] < unitConfig.cost[resource]) {
          addNotification(`⚠️ Not enough ${resource}`);
          return;
        }
      }
      
      // Check population
      if (state.population + unitConfig.population > state.maxPopulation) {
        addNotification(`⚠️ Not enough population (${state.population}/${state.maxPopulation})`);
        return;
      }
      
      // Deduct resources
      for (const resource in unitConfig.cost) {
        state.resources[resource] -= unitConfig.cost[resource];
      }
      
      // Deduct population
      state.population += unitConfig.population;
      
      // Create unit near building
      const spawnPos = new THREE.Vector3(
        building.mesh.position.x + (Math.random() - 0.5) * 3,
        0,
        building.mesh.position.z + (Math.random() - 0.5) * 3
      );
      
      new Unit(unitType, spawnPos, 'player');
      
      updateResourceDisplay();
      addNotification(`✅ ${unitConfig.name} trained!`);
    }

    function commandAllAttack() {
      if (state.selectedEntities.length === 0) return;
      
      // Find nearest enemy
      const allEnemies = [...state.enemyUnits, ...(state.enemyBuildings || [])];
      if (allEnemies.length === 0) return;
      
      const nearestEnemy = allEnemies.reduce((nearest, enemy) => {
        if (enemy.isDead) return nearest;
        
        const firstSelected = state.selectedEntities[0];
        const distance = firstSelected.mesh.position.distanceTo(enemy.mesh.position);
        const nearestDistance = firstSelected.mesh.position.distanceTo(nearest.mesh.position);
        
        return distance < nearestDistance ? enemy : nearest;
      }, allEnemies[0]);
      
      for (const entity of state.selectedEntities) {
        if (entity.type === 'unit' && entity.attack) {
          entity.targetEntity = nearestEnemy;
        }
      }
    }

    }

    function setFormation(type) {
      if (state.selectedEntities.length < 2) return;
      
      const units = state.selectedEntities.filter(e => e.type === 'unit');
      if (units.length < 2) return;
      
      const center = new THREE.Vector3();
      for (const unit of units) {
        center.add(unit.mesh.position);
      }
      center.divideScalar(units.length);
      
      if (type === 'line') {
        // Line formation
        for (let i = 0; i < units.length; i++) {
          units[i].formation = { type: 'line', targetPosition: center };
          units[i].formationPosition = new THREE.Vector3(
            (i - (units.length - 1) / 2) * 2,
            0,
            0
          );
        }
      } else if (type === 'box') {
        // Box formation
        const size = Math.ceil(Math.sqrt(units.length));
        for (let i = 0; i < units.length; i++) {
          const row = Math.floor(i / size);
          const col = i % size;
          units[i].formation = { type: 'box', targetPosition: center };
          units[i].formationPosition = new THREE.Vector3(
            (col - (size - 1) / 2) * 2,
            0,
            (row - (size - 1) / 2) * 2
          );
        }
      }
      
      addNotification(`🎯 Formation: ${type}`);
    }

    function setWorkerMode(mode) {
      if (state.selectedEntities.length === 0) return;
      
      for (const entity of state.selectedEntities) {
        if (entity.isWorker) {
          entity.workerMode = mode;
        }
      }
      
      addNotification(`👷 Worker mode: ${mode}`);
    }

    function sellSelected() {
      if (state.selectedEntities.length === 0) return;
      
      for (const entity of state.selectedEntities) {
        if (entity.type === 'building' && entity.team === 'player') {
          // Refund 50% of cost
          const config = CONFIG.BUILDINGS[entity.buildingType];
          for (const resource in config.cost) {
            state.resources[resource] += Math.floor(config.cost[resource] * 0.5);
          }
          
          // Remove population bonus
          if (config.population) {
            state.maxPopulation -= config.population;
          }
          
          // Kill the building
          entity.die();
        }
      }
      
      updateResourceDisplay();
      clearSelection();
      addNotification(`💰 Sold ${state.selectedEntities.length} building(s)`);
    }

    function initGame() {
      // Initialize systems
      initThreeJS();
      generateTerrain();
      initInput();
      initAI();
      
      // Create resource nodes
      createResourceNodes();
      
      // Create starting buildings
      createStartingBuildings();
      
      // Create starting units
      createStartingUnits();
      
      // Initialize fog of war
      initFogOfWar();
      
      // Initialize minimap
      initMinimap();
      
      // Set difficulty
      selectDifficulty(state.difficulty);
      
      // Hide loading screen
      document.getElementById('loading').style.display = 'none';
      
      // Show difficulty selector
      showDifficultySelector();
    }

    function createResourceNodes() {
      const types = ['gold', 'wood', 'stone', 'food'];
      
      for (const type of types) {
        const config = CONFIG.RESOURCE_NODES[type];
        
        for (let i = 0; i < config.count; i++) {
          const position = new THREE.Vector3(
            Math.random() * (CONFIG.TERRAIN_SIZE - 40) + 20,
            0,
            Math.random() * (CONFIG.TERRAIN_SIZE - 40) + 20
          );
          
          // Avoid placing near player start area
          const playerStart = new THREE.Vector3(CONFIG.TERRAIN_SIZE / 2, 0, CONFIG.TERRAIN_SIZE / 2);
          if (position.distanceTo(playerStart) < 30) {
            position.x += 30;
            position.z += 30;
          }
          
          new ResourceNode(type, position, config.baseValue * 2);
        }
      }
    }

    function createStartingBuildings() {
      const startPos = new THREE.Vector3(
        CONFIG.TERRAIN_SIZE / 2,
        0,
        CONFIG.TERRAIN_SIZE / 2
      );
      
      // Town Hall
      new Building('town-hall', startPos);
      
      // Add some starting buildings
      new Building('farm', new THREE.Vector3(startPos.x + 8, 0, startPos.z + 8));
      new Building('lumber-mill', new THREE.Vector3(startPos.x - 8, 0, startPos.z + 8));
      new Building('mine', new THREE.Vector3(startPos.x + 8, 0, startPos.z - 8));
    }

    function createStartingUnits() {
      const startPos = new THREE.Vector3(
        CONFIG.TERRAIN_SIZE / 2,
        0,
        CONFIG.TERRAIN_SIZE / 2
      );
      
      // Workers
      for (let i = 0; i < 5; i++) {
        new Unit('worker', new THREE.Vector3(
          startPos.x + (Math.random() - 0.5) * 10,
          0,
          startPos.z + (Math.random() - 0.5) * 10
        ), 'player');
      }
      
      // Warriors
      for (let i = 0; i < 3; i++) {
        new Unit('warrior', new THREE.Vector3(
          startPos.x + (Math.random() - 0.5) * 10,
          0,
          startPos.z + (Math.random() - 0.5) * 10
        ), 'player');
      }
      
      // Archers
      for (let i = 0; i < 2; i++) {
        new Unit('archer', new THREE.Vector3(
          startPos.x + (Math.random() - 0.5) * 10,
          0,
          startPos.z + (Math.random() - 0.5) * 10
        ), 'player');
      }
      
      // Update population
      state.population = 5 + 3 + 2; // workers + warriors + archers
    }

    function initMinimap() {
      const canvas = document.getElementById('minimap-canvas');
      const ctx = canvas.getContext('2d');
      
      function updateMinimap() {
        const size = 150;
        canvas.width = size;
        canvas.height = size;
        
        // Clear
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, size, size);
        
        // Draw terrain
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(0, 0, size, size);
        
        // Draw entities
        const scale = size / CONFIG.TERRAIN_SIZE;
        
        // Player buildings
        ctx.fillStyle = '#3b82f6';
        for (const building of state.buildings) {
          if (building.isDead) continue;
          const x = (building.mesh.position.x / CONFIG.TERRAIN_SIZE) * size;
          const y = (building.mesh.position.z / CONFIG.TERRAIN_SIZE) * size;
          ctx.fillRect(x - 2, y - 2, 4, 4);
        }
        
        // Player units
        ctx.fillStyle = '#60a5fa';
        for (const unit of state.units) {
          if (unit.isDead) continue;
          const x = (unit.mesh.position.x / CONFIG.TERRAIN_SIZE) * size;
          const y = (unit.mesh.position.z / CONFIG.TERRAIN_SIZE) * size;
          ctx.fillRect(x - 1, y - 1, 2, 2);
        }
        
        // Enemy buildings
        ctx.fillStyle = '#ef4444';
        for (const building of enemyBuildings) {
          if (building.isDead) continue;
          const x = (building.mesh.position.x / CONFIG.TERRAIN_SIZE) * size;
          const y = (building.mesh.position.z / CONFIG.TERRAIN_SIZE) * size;
          ctx.fillRect(x - 2, y - 2, 4, 4);
        }
        
        // Enemy units
        ctx.fillStyle = '#f87171';
        for (const unit of state.enemyUnits) {
          if (unit.isDead) continue;
          const x = (unit.mesh.position.x / CONFIG.TERRAIN_SIZE) * size;
          const y = (unit.mesh.position.z / CONFIG.TERRAIN_SIZE) * size;
          ctx.fillRect(x - 1, y - 1, 2, 2);
        }
        
        // Camera viewport
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        const cameraX = (camera.position.x / CONFIG.TERRAIN_SIZE) * size;
        const cameraY = (camera.position.z / CONFIG.TERRAIN_SIZE) * size;
        const cameraWidth = (camera.far * Math.tan(camera.fov * Math.PI / 180) * camera.aspect / CONFIG.TERRAIN_SIZE) * size;
        const cameraHeight = (camera.far * Math.tan(camera.fov * Math.PI / 180) / CONFIG.TERRAIN_SIZE) * size;
        ctx.strokeRect(
          cameraX - cameraWidth / 2,
          cameraY - cameraHeight / 2,
          cameraWidth,
          cameraHeight
        );
        
        requestAnimationFrame(updateMinimap);
      }
      
      updateMinimap();
    }

    function selectDifficulty(diff) {
      state.difficulty = diff;
      
      const difficulty = CONFIG.DIFFICULTY[diff];
      
      // Apply difficulty modifiers
      state.resources = { ...difficulty.startResources };
      state.maxPopulation = difficulty.startPopulation;
      state.population = 0;
      
      // Clear existing entities
      for (const entity of [...state.buildings, ...state.units, ...state.enemyUnits, ...state.resourceNodes]) {
        if (entity.mesh) {
          scene.remove(entity.mesh);
        }
      }
      
      state.buildings = [];
      state.units = [];
      state.enemyUnits = [];
      state.resourceNodes = [];
      state.worldObjects = [];
      enemyBuildings = [];
      
      // Hide difficulty selector
      document.getElementById('difficulty-selector').style.display = 'none';
      
      // Recreate game with selected difficulty
      createResourceNodes();
      createStartingBuildings();
      createStartingUnits();
      initAI();
      
      updateResourceDisplay();
      addNotification(`🎮 Difficulty: ${diff.charAt(0).toUpperCase() + diff.slice(1)}`);
      
      // Start first wave after delay
      state.currentWave = 0;
      state.waveTimer = 0;
      state.waveDelay = 60;
      state.waves = [];
      
      // Start game
      state.gameStarted = true;
      state.gameOver = false;
      
      // Start game loop
      requestAnimationFrame(animate);
    }

    function showDifficultySelector() {
      document.getElementById('difficulty-selector').style.display = 'flex';
    }

    function restartGame() {
      // Reset game state
      state.gameOver = false;
      state.victory = false;
      state.gameStarted = false;
      
      // Clear entities
      for (const entity of [...state.buildings, ...state.units, ...state.enemyUnits, ...state.resourceNodes, ...state.projectiles, ...state.particles]) {
        if (entity.mesh) {
          scene.remove(entity.mesh);
        }
      }
      
      state.buildings = [];
      state.units = [];
      state.enemyUnits = [];
      state.resourceNodes = [];
      state.projectiles = [];
      state.particles = [];
      state.worldObjects = [];
      enemyBuildings = [];
      
      // Reset resources
      state.resources = { gold: 0, wood: 0, stone: 0, food: 0, mana: 0 };
      state.population = 0;
      state.maxPopulation = CONFIG.START_POPULATION;
      
      // Reset waves
      state.currentWave = 0;
      state.waveTimer = 0;
      state.waveDelay = 60;
      state.waves = [];
      
      // Reset selection
      clearSelection();
      
      // Reset time
      state.dayTime = 0;
      state.gameTime = 0;
      
      // Reset research
      state.research = {};
      state.researchQueue = [];
      
      // Hide game over screen
      document.getElementById('game-over').style.display = 'none';
      
      // Show difficulty selector
      showDifficultySelector();
    }

    function endGame(victory) {
      state.gameOver = true;
      state.victory = victory;
      
      const title = document.getElementById('game-over-title');
      const message = document.getElementById('game-over-message');
      
      if (victory) {
        title.textContent = 'VICTORY';
        message.textContent = `You have defended Eldermere against the darkness for ${Math.floor(state.gameTime / 60)} minutes.`;
      } else {
        title.textContent = 'DEFEAT';
        message.textContent = `Your kingdom has fallen after ${Math.floor(state.gameTime / 60)} minutes of resistance.`;
      }
      
      document.getElementById('game-over').style.display = 'flex';
    }

    // ============================================
    // Main Game Loop
    // ============================================

    function animate(timestamp) {
      if (!state.gameStarted) {
        requestAnimationFrame(animate);
        return;
      }
      
      state.deltaTime = Math.min(0.1, clock.getDelta());
      state.gameTime += state.deltaTime;
      state.dayTime += state.deltaTime;
      
      // Update systems
      updateDayNight();
      updateAI(state.deltaTime);
      updateProjectiles(state.deltaTime);
      updateParticles(state.deltaTime);
      updateFogOfWar();
      updateWaveTimer();
      
      // Update entities
      for (const entity of [...state.buildings, ...state.units, ...state.enemyUnits, ...state.resourceNodes]) {
        if (!entity.isDead) {
          entity.update(state.deltaTime);
        }
      }
      
      // Update controls
      controls.update();
      
      // Render
      renderer.render(scene, camera);
      
      // Continue loop
      if (!state.gameOver) {
        requestAnimationFrame(animate);
      }
    }

    // ============================================
    // Start the Game
    // ============================================

    // Initialize game
    initGame();
    
    // Add CSS for damage text animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-50px); opacity: 0; }
      }
      @keyframes slideOut {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(50px); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
    
    // Global functions for UI
    window.selectDifficulty = selectDifficulty;
    window.restartGame = restartGame;
    window.showDifficultySelector = showDifficultySelector;
    window.setBuildMode = setBuildMode;
    window.cancelBuildMode = cancelBuildMode;
    window.trainUnit = trainUnit;
    window.commandMove = commandMove;
    window.commandAttack = commandAttack;
    window.commandStop = commandStop;
    window.commandAllAttack = commandAllAttack;
    window.commandAllMove = commandAllMove;
    window.commandAllStop = commandAllStop;
    window.setFormation = setFormation;
    window.setWorkerMode = setWorkerMode;
    window.sellSelected = sellSelected;
    window.selectAllUnits = selectAllUnits;
    window.clearSelection = clearSelection;
    
    // Add unique IDs to entities for selection
    let entityIdCounter = 0;
    const originalEntityConstructor = Entity;
    Entity = function(mesh, position, type, team) {
      originalEntityConstructor.call(this, mesh, position, type, team);
      this.id = `entity-${entityIdCounter++}`;
    };
    Entity.prototype = originalEntityConstructor.prototype;
    
    // Fix for Unit and Building inheritance
    Building.prototype = Object.create(Entity.prototype);
    Unit.prototype = Object.create(Entity.prototype);
    ResourceNode.prototype = Object.create(Entity.prototype);
  </script>
</body>
</html>
