<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aetheria Defense: Miniature Kingdom</title>
    <style>
        :root { --ui-bg: rgba(20, 24, 40, 0.9); --ui-border: #ffd700; --text-col: #fff; --accent: #4facfe; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background: #000; }
        
        /* --- UI Layout --- */
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; }
        
        #hud-top { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .resource-pill { background: var(--ui-bg); border: 2px solid var(--ui-border); border-radius: 20px; padding: 8px 20px; color: var(--text-col); font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: auto;}
        .res-icon { color: #ffd700; }
        
        #hud-bottom { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px; background: var(--ui-bg); border-radius: 12px; border: 1px solid #444; pointer-events: auto; transition: all 0.2s; opacity: 0; transform: translateX(-50%) translateY(20px); }
        #hud-bottom.active { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .action-btn { width: 70px; height: 70px; background: #2a3b55; border: 2px solid #444; border-radius: 8px; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.1s; color: white; font-size: 12px; text-align: center; }
        .action-btn:hover { background: #3e547a; border-color: var(--accent); transform: scale(1.05); }
        .action-btn.selected { background: #4facfe; border-color: #fff; box-shadow: 0 0 15px var(--accent); }
        .cost-label { position: absolute; bottom: -2px; right: -2px; background: #d32f2f; color: white; font-size: 10px; padding: 2px 5px; border-radius: 4px; border: 1px solid #fff; }
        .key-hint { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #aaa; font-style: italic; }
        
        #wave-info { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 15px; color: white; font-weight: bold; pointer-events: none; border: 1px solid #ff5555; }
        
        #screens { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 20; pointer-events: none; }
        .modal { background: rgba(15, 18, 30, 0.95); border: 2px solid var(--ui-border); padding: 40px; border-radius: 10px; text-align: center; color: white; max-width: 500px; pointer-events: auto; box-shadow: 0 0 50px rgba(0,0,0,0.8); display: none; }
        .modal h1 { color: var(--accent); margin-top: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 36px; text-shadow: 0 2px 0 #000; }
        .btn-large { background: linear-gradient(to bottom, #ffd700, #ffaa00); border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; color: #333; border-radius: 5px; cursor: pointer; margin-top: 20px; text-transform: uppercase; box-shadow: 0 5px 0 #b8860b; transition: transform 0.1s; }
        .btn-large:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }

        #notification-area { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; border-left: 4px solid var(--accent); animation: slideIn 0.3s ease-out forwards; opacity: 0; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(-10px); } }

        /* Selection Ring Indicator */
        #selection-indicator { position: absolute; width: 40px; height: 40px; border: 2px solid #0f0; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 5; box-shadow: 0 0 10px #0f0; transition: top 0.1s, left 0.1s; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud-top">
        <div class="resource-pill"><span class="res-icon">☀️</span> <span id="res-gold">0</span></div>
        <div id="wave-info">WAVE 1 / DAY 1</div>
        <div class="resource-pill"><span class="res-icon">💠</span> <span id="res-pop">0</span></div>
    </div>

    <div id="hud-bottom">
        <!-- Dynamic Buttons injected by JS -->
    </div>

    <div id="screens">
        <div id="start-screen" class="modal" style="display:block;">
            <h1>Aetheria Defense</h1>
            <p>Defend your crystalline core from the Shadow Legion.</p>
            <p>Assign Workers. Build Walls. Recruit Armies.</p>
            <p>The sun sets soon...</p>
            <button class="btn-large" onclick="startGame()">Start Campaign</button>
        </div>
        <div id="victory-screen" class="modal">
            <h1 style="color:#4caf50">Victory!</h1>
            <p>The Shadow has been purged from Aetheria.</p>
            <p>Score: <span id="score-val"></span></p>
            <button class="btn-large" onclick="location.reload()">Play Again</button>
        </div>
        <div id="defeat-screen" class="modal">
            <h1 style="color:#f44336">Ruined</h1>
            <p>Your Core has crumbled to dust.</p>
            <p>You survived until Wave <span id="death-wave"></span>.</p>
            <button class="btn-large" onclick="location.reload()">Try Again</button>
        </div>
    </div>

    <div id="notification-area"></div>
    <div id="selection-indicator"></div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/**
 * GAME CONFIGURATION & STATE
 */
const CONFIG = {
    gridSize: 40, // 40x40 grid
    tileSize: 2,
    baseHP: 1000,
    tickRate: 1000, // Game loop 10 times a sec logic
    goldPerTick: 0, // Computed
    dayLength: 3000, // Seconds before night
};

const BUILDINGS = {
    TOWER: { name: "Sentinel Tower", cost: 50, hp: 200, range: 8, dmg: 15, reload: 60, type: 'turret', color: 0x4facfe, symbol: '🗼' },
    WALL:  { name: "Stone Wall", cost: 25, hp: 300, range: 0, dmg: 0, type: 'wall', color: 0x7f8c8d, symbol: '🧱' },
    BARRACKS: { name: "Barracks", cost: 150, hp: 150, range: 0, spawnRate: 200, unitType: 'melee', symbol: '⚔️' },
    ARCHERY: { name: "Archery Range", cost: 200, hp: 120, range: 0, spawnRate: 240, unitType: 'range', symbol: '🏹' },
    BLACKSMITH: { name: "Forge", cost: 100, hp: 100, upgrade: true, bonus: "Melee DPS", symbol: '🔨' }
};

const UNITS = {
    worker: { speed: 0.08, range: 1.5, hp: 20, damage: 5, color: 0xffd700, cost: 0 },
    melee:  { speed: 0.06, range: 1.8, hp: 80, damage: 25, color: 0x2ecc71, cost: 75 },
    range:  { speed: 0.05, range: 7,   hp: 40, damage: 15, color: 0xe67e22, cost: 100 },
    hero:   { speed: 0.07, range: 2.5, hp: 300, damage: 60, color: 0xc0392b, cost: 500 } // Summoned
};

let state = {
    running: false,
    gold: 150,
    wave: 1,
    time: 0, // 0 to 1 (0=noon, 0.5=sunset)
    entities: [], // All objects
    buildings: [],
    enemies: [],
    projectiles: [],
    particles: [],
    lastTime: 0,
    fogIntensity: 0,
    cameraYOffset: 0
};

// Assets
let scene, camera, renderer, raycaster, mouse;
let terrainGroup, decorationGroup;
let cursorMesh;
let groundPlane;

// Audio Placeholder (Browser policy requires interaction first, so we omit audio files to keep it clean, 
// but visual cues replace sound)

function init() {
    // Scene Setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaaccff);
    scene.fog = new THREE.FogExp2(0xaaccff, 0.03);

    // Camera: Isometric look
    const aspect = window.innerWidth / window.innerHeight;
    const d = 25;
    camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    camera.position.set(40, 40, 40);
    camera.lookAt(scene.position);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('game-container').appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 80, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -50;
    dirLight.shadow.camera.right = 50;
    dirLight.shadow.camera.top = 50;
    dirLight.shadow.camera.bottom = -50;
    scene.add(dirLight);

    // World Groups
    terrainGroup = new THREE.Group();
    scene.add(terrainGroup);
    
    decorationGroup = new THREE.Group();
    scene.add(decorationGroup);

    // Cursor
    const geo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 8);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
    cursorMesh = new THREE.Mesh(geo, mat);
    cursorMesh.visible = false;
    scene.add(cursorMesh);

    // Interaction
    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();
    window.addEventListener('resize', onWindowResize, false);
    window.addEventListener('mousemove', onMouseMove, false);
    window.addEventListener('mousedown', onMouseDown, false);

    generateTerrain();
    animate(0);
}

function generateTerrain() {
    const geometry = new THREE.PlaneGeometry(CONFIG.gridSize * CONFIG.tileSize, CONFIG.gridSize * CONFIG.tileSize, 40, 40);
    geometry.rotateX(-Math.PI / 2);
    
    const vertices = geometry.attributes.position.array;
    // Procedural Noise (Simple Sines)
    for (let i = 0; i < vertices.length; i += 3) {
        let x = vertices[i];
        let y = vertices[i+1]; // This is Z in 2D space
        // Create valleys and hills
        let z = (Math.sin(x * 0.05) * 2) + (Math.cos(y * 0.05) * 2) + (Math.random() * 0.2);
        // Flatten center for gameplay
        const distFromCenter = Math.sqrt(x*x + y*y);
        if(distFromCenter < 15) z *= 0.2; 
        
        vertices[i + 2] = z;
    }
    geometry.computeVertexNormals();

    const material = new THREE.MeshToonMaterial({ color: 0x5da669, flatShading: true });
    const terrain = new THREE.Mesh(geometry, material);
    terrain.receiveShadow = true;
    terrainGroup.add(terrain);

    // Add Grid Helper (Stylized)
    const gridHelper = new THREE.GridHelper(CONFIG.gridSize * CONFIG.tileSize, CONFIG.gridSize, 0xffffff, 0x4a8554);
    gridHelper.position.y = 0.1;
    terrainGroup.add(gridHelper);

    // Decorations (Procedural Trees/Rocks)
    for(let i=0; i<150; i++) {
        const x = (Math.random() - 0.5) * CONFIG.gridSize * CONFIG.tileSize;
        const z = (Math.random() - 0.5) * CONFIG.gridSize * CONFIG.tileSize;
        // Don't place in center
        if(Math.abs(x) < 10 && Math.abs(z) < 10) continue;

        const type = Math.random() > 0.5 ? 'tree' : 'rock';
        const mesh = type === 'tree' ? createTree() : createRock();
        mesh.position.set(x, 1, z);
        
        // Randomize height slightly to match ground
        mesh.userData.isDecoration = true;
        decorationGroup.add(mesh);
    }
    
    groundPlane = terrain;
}

// --- Factory Functions for Stylized Primitives ---

function createBase(isPlayer, x, z) {
    const geo = new THREE.ConeGeometry(3, 4, 4); // Pyramidal
    const mat = new THREE.MeshToonMaterial({ color: isPlayer ? 0x3498db : 0xc0392b });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 3, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    
    const data = {
        type: 'base',
        isPlayer: isPlayer,
        hp: CONFIG.baseHP,
        maxHp: CONFIG.baseHP,
        size: 3
    };
    mesh.userData = data;
    scene.add(mesh);
    state.entities.push(data);
    if(isPlayer) state.buildings.push(data);
    return data;
}

function createBuilding(bTypeKey, x, z) {
    const def = BUILDINGS[bTypeKey];
    let mesh;
    
    if(def.type === 'turret') {
        mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), new THREE.MeshToonMaterial({color: def.color}));
        const turret = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1), new THREE.MeshToonMaterial({color: 0x333}));
        turret.position.y = 1.5;
        mesh.add(turret);
    } else if (def.type === 'wall') {
        mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), new THREE.MeshToonMaterial({color: def.color}));
    } else {
        // Generic complex building
        const bGeo = new THREE.BoxGeometry(3, 2.5, 3);
        mesh = new THREE.Mesh(bGeo, new THREE.MeshToonMaterial({color: def.color}));
        const roofGeo = new THREE.ConeGeometry(2.5, 1.5, 4);
        const roof = new THREE.Mesh(roofGeo, new THREE.MeshToonMaterial({color: 0x8e44ad}));
        roof.position.y = 2.5;
        roof.rotation.y = Math.PI/4;
        mesh.add(roof);
    }

    mesh.position.set(x, 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const obj = {
        type: 'building',
        subType: bTypeKey,
        hp: def.hp,
        maxHp: def.hp,
        range: def.range || 0,
        damage: def.dmg || 0,
        reload: def.reload || 0,
        cooldown: 0,
        spawnRate: def.spawnRate || 0,
        unitSpawnTimer: 0,
        color: def.color
    };
    mesh.userData = obj;
    scene.add(mesh);
    state.buildings.push(obj);
    state.entities.push(obj);
    playSound('place');
    return obj;
}

function createUnit(defName, x, z, isEnemy = false) {
    const def = UNITS[defName];
    let color = def.color;
    if(isEnemy) color = 0x222222; // Dark grey/black for enemies

    // Mesh
    let geo;
    if(defName === 'hero') geo = new THREE.CylinderGeometry(0.8, 1, 2.5, 8);
    else if(defName === 'worker') geo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
    else geo = new THREE.BoxGeometry(1, 1.5, 1);
    
    const mesh = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ color: color }));
    
    // Weapon
    if (!isEnemy) {
        const weapon = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), new THREE.MeshStandardMaterial({color: 0xcccccc}));
        weapon.position.set(0.6, 0.5, 0.4);
        weapon.rotation.x = Math.PI/2;
        mesh.add(weapon);
    }

    mesh.position.set(x, 1.5, z);
    mesh.castShadow = true;

    const obj = {
        type: 'unit',
        isEnemy: isEnemy,
        hp: def.hp,
        maxHp: def.hp,
        speed: def.speed,
        range: def.range,
        damage: def.damage,
        reload: 60, // frames approx
        cooldown: 0,
        target: null,
        color: color,
        animFrame: 0
    };
    
    mesh.userData = obj;
    scene.add(mesh);
    state.entities.push(obj);
    if(!isEnemy) {
        // Only add non-enemies to tracked lists if necessary, but here we iterate all entities
    } else {
        state.enemies.push(obj);
    }
    return obj;
}

function createProjectiles(startPos, endPos, color) {
    const geo = new THREE.SphereGeometry(0.3);
    const mat = new THREE.MeshBasicMaterial({ color: color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(startPos);
    mesh.position.y += 1;
    
    const targetMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({color: color, transparent:true, opacity:0.5}));
    targetMesh.position.copy(endPos);
    targetMesh.position.y += 1;
    
    const obj = {
        type: 'projectile',
        startPos: startPos,
        targetPos: targetMesh.position,
        speed: 0.8,
        damage: 15 // Default archer/tower dmg
    };
    mesh.userData = obj;
    scene.add(mesh);
    scene.add(targetMesh); // Visual guide (optional polish)
    state.projectiles.push(obj);
}

function createParticles(pos, color, count) {
    for(let i=0; i<count; i++) {
        const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const mat = new THREE.MeshBasicMaterial({ color: color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.position.x += (Math.random()-0.5);
        mesh.position.z += (Math.random()-0.5);
        
        const obj = {
            type: 'particle',
            vel: new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.3, (Math.random()-0.5)*0.2),
            life: 1.0
        };
        mesh.userData = obj;
        scene.add(mesh);
        state.particles.push(obj);
    }
}

function createTree() {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 2), new THREE.MeshToonMaterial({color:0x8B4513}));
    trunk.position.y = 1;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 4, 6), new THREE.MeshToonMaterial({color:0x228B22}));
    leaves.position.y = 3.5;
    group.add(trunk);
    group.add(leaves);
    return group;
}

function createRock() {
    const geo = new THREE.DodecahedronGeometry(Math.random()*1.5 + 0.5);
    return new THREE.Mesh(geo, new THREE.MeshToonMaterial({color:0x7f8c8d}));
}

// --- Gameplay Systems ---

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    state.running = true;
    
    // Create bases
    createBase(true, 0, 0);
    createBase(false, 0, CONFIG.gridSize * CONFIG.tileSize / 1.5); // Enemy far away
    
    updateHUD();
    showNotification("Welcome Commander! Select a Building below.");
    
    // Start Spawning Logic
    setInterval(gameLogicLoop, 1000/30); // High freq updates needed for smoothness? 
    // No, separate visual loop and logic loop. But for simplicity in one file, we mix them mostly.
    
    // Game Timer / Wave Logic
    setTimeout(waveSpawner, 5000);
    
    requestAnimationFrame(animate);
}

function spawnEnemyWave(waveNum) {
    const count = 3 + Math.floor(waveNum * 1.5);
    const startX = (Math.random() - 0.5) * (CONFIG.gridSize * CONFIG.tileSize);
    const startZ = CONFIG.gridSize * CONFIG.tileSize / 1.8; // Top edge roughly
    
    for(let i=0; i<count; i++) {
        const tier = Math.random() > 0.8 ? 'melee' : 'melee'; // Keep it simple for V1
        // Elite logic could go here
        
        // Offset spawn points
        const ox = startX + (i * 4) % 20 - 10; 
        setTimeout(() => {
            createUnit('melee', ox, startZ, true);
            createParticle({x:ox, y:1.5, z:startZ}, 0xff0000, 1); // Spawn effect
        }, i * 200);
    }
    
    state.wave++;
    updateHUD();
    showNotification(`Wave ${state.wave} Incoming!`);
    playSound('wave');
    
    scheduleNextWave();
}

function scheduleNextWave() {
    // Exponential increase in wait time reduction
    const delay = Math.max(5000, 20000 - (state.wave * 1000));
    setTimeout(spawnEnemyWave, delay);
}

// --- Input & Controls ---

let selectionBoxData = { x:0, z:0, active: false };

function onMouseMove(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(groundPlane);

    if (intersects.length > 0) {
        const hit = intersects[0];
        
        // Snap to grid
        const snappedX = Math.round(hit.point.x);
        const snappedZ = Math.round(hit.point.z);
        
        cursorMesh.position.set(snappedX, 0.5, snappedZ);
        cursorMesh.visible = true;
        
        if(selectionBoxData.active) {
            // Show preview
            const def = BUILDINGS[selectionBoxData.type];
            cursorMesh.material.color.setHex(def.color);
            // Check validity (collision, cost) could go here
        } else {
            cursorMesh.material.color.setHex(0x00ff00);
        }
    } else {
        cursorMesh.visible = false;
    }
}

function onMouseDown(event) {
    if(!state.running) return;
    
    // UI clicks handled by HTML elements naturally
    // Check if clicking on grid
    if(event.target.tagName !== 'DIV') {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(groundPlane);
        
        if (intersects.length > 0) {
            const hit = intersects[0];
            
            if (selectionBoxData.active) {
                placeBuilding(selectionBoxData.type, hit.point.x, hit.point.z);
                cancelSelection();
            } else {
                // Check if clicking existing building
                const found = state.buildings.find(b => {
                    return b.mesh && b.mesh.parent === scene; // Check valid
                }); // Simplistic collision check
                
                // Better: Raycast against all meshes
                const entities = [...state.buildings].reverse().slice(0, 5); // Look at top few
                // In ThreeJS, raycaster can check multiple objects
                // For now, rely on proximity to mouse
                const px = Math.round(hit.point.x);
                const pz = Math.round(hit.point.z);
                
                const targetBuilding = state.buildings.find(b => {
                    const bx = Math.round(b.mesh.position.x);
                    const bz = Math.round(b.mesh.position.z);
                    return Math.abs(bx - px) < 1 && Math.abs(bz - pz) < 1;
                });
                
                if(targetBuilding) {
                    showBuildingStats(targetBuilding);
                }
            }
        }
    }
}

function handleUI(key) {
    const type = key.toUpperCase();
    if(BUILDINGS[type]) {
        if(state.gold >= BUILDINGS[type].cost) {
            selectionBoxData.active = true;
            selectionBoxData.type = type;
            cursorMesh.material.color.setHex(BUILDINGS[type].color);
            
            // Highlight button
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(`btn-${type}`).classList.add('selected');
        } else {
            showNotification("Not enough gold!");
            playSound('error');
        }
    }
}

function placeBuilding(type, x, z) {
    const def = BUILDINGS[type];
    if(state.gold >= def.cost) {
        // Collision check
        const collide = state.buildings.some(b => Math.abs(b.mesh.position.x - x) < 2 && Math.abs(b.mesh.position.z - z) < 2);
        if(!collide) {
            state.gold -= def.cost;
            createBuilding(type, x, z);
            updateHUD();
            playSound('build');
        } else {
            showNotification("Space occupied");
            playSound('error');
        }
    } else {
        showNotification("Need more gold");
        playSound('error');
    }
}

function cancelSelection() {
    selectionBoxData.active = false;
    document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('selected'));
}

function onKeyDown(e) {
    if(state.running) handleUI(e.key);
}
window.addEventListener('keydown', onKeyDown);


// --- Core Logic Loop ---

let buildMenuGenerated = false;
function generateBuildMenu() {
    const container = document.getElementById('hud-bottom');
    Object.keys(BUILDINGS).forEach(key => {
        const b = BUILDINGS[key];
        const btn = document.createElement('div');
        btn.className = 'action-btn';
        btn.id = `btn-${key}`;
        btn.innerHTML = `<div>${b.symbol}</div><span>${b.name}</span>`;
        if(key !== 'BLACKSMITH') { // Workspaces for recruits
             btn.innerHTML += `<div class="cost-label">${b.cost}</div>`;
        } else {
             btn.innerHTML += `<div class="cost-label">UPG</div>`;
        }
        
        btn.onclick = () => handleUI(key);
        container.appendChild(btn);
    });
    container.classList.add('active');
    buildMenuGenerated = true;
}

function updateHUD() {
    if(!buildMenuGenerated) generateBuildMenu();
    document.getElementById('res-gold').innerText = Math.floor(state.gold);
    document.getElementById('wave-info').innerText = `WAVE ${state.wave}`;
}

function showNotification(msg) {
    const area = document.getElementById('notification-area');
    const div = document.createElement('div');
    div.className = 'toast';
    div.innerText = msg;
    area.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}

function showBuildingStats(building) {
    // Find closest unit to click for control
    // Or simply display info
    console.log(building);
}

// --- Physics & Combat ---

function updatePhysics() {
    const dt = 1; // Simplified delta

    // Projectiles
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const p = state.projectiles[i];
        const vec = new THREE.Vector3().copy(p.targetPos).sub(p.startPos).normalize();
        p.startPos.add(vec.multiplyScalar(p.speed));
        
        if(p.startPos.distanceTo(p.targetPos) < 0.5) {
            // Hit logic
            createParticles(p.targetPos, 0xffff00, 3);
            applyDamage(new THREE.Vector3(p.targetPos.x, 0, p.targetPos.z), p.damage);
            scene.remove(state.projectiles[i].userData.mesh); // We didn't store mesh ref cleanly, simplifying cleanup
            state.projectiles.splice(i, 1);
        }
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.life -= 0.05;
        p.vel.y -= 0.01; // Gravity
        p.userData.mesh.position.add(p.vel);
        p.userData.mesh.scale.setScalar(p.life);
        if(p.life <= 0) {
            scene.remove(p.userData.mesh);
            state.particles.splice(i, 1);
        }
    }

    // Buildings Attack
    state.buildings.forEach(b => {
        if(b.cooldown > 0) b.cooldown--;
        
        if(b.type === 'building' && b.subType === 'TOWER' && b.range > 0 && b.cooldown <= 0) {
            // Find nearest enemy
            let nearest = null;
            let minDist = Infinity;
            state.enemies.forEach(e => {
                const d = b.mesh.position.distanceTo(e.mesh.position);
                if(d < b.range && d < minDist) {
                    minDist = d;
                    nearest = e;
                }
            });

            if(nearest) {
                // Shoot projectile
                createProjectiles(b.mesh.position, nearest.mesh.position, 0x00ffff);
                b.cooldown = b.reload;
            }
        }
        
        // Barracks Spawning
        if(b.type === 'building' && b.unitSpawnTimer > 0) b.unitSpawnTimer--;
        if(b.spawnRate && b.unitSpawnTimer <= 0) {
             // Spawn friendly unit
             const offset = (Math.random()-0.5)*2;
             createUnit(b.unitType, b.mesh.position.x + offset, b.mesh.position.z - 2, false);
             b.unitSpawnTimer = b.spawnRate;
        }
    });

    // Unit Logic (Friendly & Enemies)
    const allUnits = [ ...state.enemies ];
    // Friendly units aren't explicitly stored in array, they are in entity list filtered
    state.entities.forEach(e => {
        if(e.type === 'unit' && !e.isEnemy) allUnits.push(e);
    });

    allUnits.forEach(u => {
        if(u.cooldown > 0) u.cooldown--;

        // Target Acquisition
        let target = null;
        let minDist = Infinity;
        
        // Find enemies
        const targets = u.isEnemy ? state.entities.filter(e => e.type === 'unit' && !e.isEnemy || e.type === 'base' && e.isPlayer) 
                                  : state.enemies; // Players target enemies

        // Also target base specifically
        const playerBase = state.entities.find(e => e.type === 'base' && e.isPlayer);
        if(playerBase) targets.push(playerBase);

        targets.forEach(t => {
            if(!t.mesh) return; // Dead
            const d = u.mesh.position.distanceTo(t.mesh.position);
            if(d < minDist && d < 20) { // Aggro range
                minDist = d;
                target = t;
            }
        });

        // Move or Attack
        if(target) {
            const dist = u.mesh.position.distanceTo(target.mesh.position);
            if(dist > u.range) {
                // Move
                const dir = new THREE.Vector3().subVectors(target.mesh.position, u.mesh.position).normalize();
                dir.y = 0; // Flat movement
                u.mesh.position.add(dir.multiplyScalar(u.speed));
                u.mesh.lookAt(target.mesh.position);
                
                // Soft Collision avoidance (jitter)
                state.entities.forEach(o => {
                    if(o.type === 'unit' && o !== u) {
                        const dd = u.mesh.position.distanceTo(o.mesh.position);
                        if(dd < 1.2) {
                            const push = new THREE.Vector3().subVectors(u.mesh.position, o.mesh.position).normalize();
                            u.mesh.position.add(push.multiplyScalar(0.05));
                        }
                    }
                });
            } else {
                // Attack
                if(u.cooldown <= 0) {
                    u.cooldown = 60; // ~1 sec
                    if(u.range > 3) {
                         // Ranged attack simulation (instant line)
                         createProjectiles(u.mesh.position, target.mesh.position, u.color);
                    } else {
                         // Melee swing
                         createParticles(u.mesh.position.clone().add(new THREE.Vector3(0,1,0)), u.color, 5);
                         applyDamage(target.mesh.position, u.damage);
                    }
                }
            }
        } else {
            // Idle wander (enemy specific behavior fallback)
            if(u.isEnemy && minDist > 20) {
                 // Move to player base roughly
                 const playerBase = state.entities.find(e => e.type === 'base' && e.isPlayer);
                 if(playerBase) {
                    const dir = new THREE.Vector3().subVectors(playerBase.mesh.position, u.mesh.position).normalize();
                    dir.y = 0;
                    u.mesh.position.add(dir.multiplyScalar(u.speed));
                 }
            }
        }
    });
}

function applyDamage(pos, amount) {
    // Determine what hit based on position is hard without strict AABB
    // Simplified: check entities near pos
    const hitZone = 1.5;
    
    [...state.entities, ...state.enemies].forEach(e => {
        if(!e.mesh) return;
        if(e.mesh.position.distanceTo(pos) < hitZone) {
            e.hp -= amount;
            
            // Blood/Hit effect
            createParticles(pos, 0xff0000, 2);

            if(e.hp <= 0) {
                killEntity(e);
            }
        }
    });
}

function killEntity(e) {
    if(!e.mesh) return;
    scene.remove(e.mesh);
    e.dead = true;
    
    // Cleanup arrays
    if(e.isEnemy) {
        state.enemies = state.enemies.filter(x => x !== e);
    } else {
        state.buildings = state.buildings.filter(x => x !== e);
        state.entities = state.entities.filter(x => x !== e);
        
        if(e.type === 'base') {
            gameOver(false);
        }
    }
}

function playSound(type) {
    // Synthesize simple beep/noise to avoid external assets
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    const now = ctx.currentTime;
    if(type === 'build') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'shoot') {
         osc.type = 'triangle';
         osc.frequency.setValueAtTime(600, now);
         gain.gain.setValueAtTime(0.1, now);
         gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
         osc.start(now);
         osc.stop(now + 0.05);
    }
}

function gameOver(victory) {
    state.running = false;
    if(victory) {
        document.getElementById('victory-screen').style.display = 'block';
        document.getElementById('score-val').innerText = state.gold + (state.wave * 100);
    } else {
        document.getElementById('death-wave').innerText = state.wave;
        document.getElementById('defeat-screen').style.display = 'block';
    }
}

function waveSpawner() {
    spawnEnemyWave(state.wave);
}

// --- Main Render Loop ---

function animate(time) {
    requestAnimationFrame(animate);
    
    const delta = (time - state.lastTime) / 1000;
    state.lastTime = time;

    if(state.running) {
        state.time += delta;
        
        // Day/Night Cycle
        const cycleSpeed = 0.0002;
        const t = state.time * cycleSpeed;
        const sunY = Math.sin(t) * 50;
        const sunX = Math.cos(t) * 50;
        
        scene.children.find(c => c.type === 'DirectionalLight')?.position.set(sunX, Math.max(sunY, 10), 30);
        
        // Sky color interpolate
        const dayColor = new THREE.Color(0xaaccff);
        const nightColor = new THREE.Color(0x000011);
        const skyMix = Math.pow(Math.sin(t), 2); // 0 to 1
        scene.background.lerpColors(nightColor, dayColor, skyMix);
        scene.fog.color.copy(scene.background);
        
        // Intensity
        scene.children.find(c => c.type === 'AmbientLight').intensity = 0.2 + (skyMix * 0.6);

        updatePhysics();
    }

    renderer.render(scene, camera);
}

function onWindowResize() {
    const aspect = window.innerWidth / window.innerHeight;
    const d = 25;
    camera.left = -d * aspect;
    camera.right = d * aspect;
    camera.top = d;
    camera.bottom = -d;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// Init
init();

</script>
