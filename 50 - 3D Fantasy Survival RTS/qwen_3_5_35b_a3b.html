<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aethelgard: Kingdom Defense</title>
    <style>
        :root { --primary: #ffaa00; --secondary: #3d4c6b; --bg-dark: #1a1b26; --ui-bg: rgba(20, 25, 30, 0.9); }
        body { margin: 0; overflow: hidden; background-color: var(--bg-dark); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        /* --- UI LAYOUT --- */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .pointer-catcher { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        
        /* TOP BAR */
        #top-bar { padding: 15px; display: flex; gap: 20px; color: white; text-shadow: 0 2px 4px black; justify-content: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .stat-box { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: bold; }
        .res-icon { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.5); }
        .gold-icon { background: radial-gradient(circle, #ffd700 30%, #b8860b 100%); }
        .wood-icon { background: radial-gradient(circle, #8fbc8f 30%, #2e8b57 100%); }
        
        /* BOTTOM COMMAND BAR */
        #bottom-bar { pointer-events: auto; padding: 15px; display: flex; justify-content: center; gap: 10px; background: linear-gradient(to top, var(--bg-dark) 80%, transparent); }
        .btn { 
            width: 60px; height: 60px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%233d4c6b" rx="8"/><path d="M20,20 L80,80 M80,20 L20,80" stroke="%23aaa" stroke-width="5"/></svg>') no-repeat center / contain; 
            background-color: var(--secondary); border: 2px solid #556; cursor: pointer; position: relative; transition: transform 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:active { transform: scale(0.95); }
        .btn.disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
        .btn-label { font-size: 10px; margin-top: 2px; text-align: center; line-height: 1.1; }
        .cost-overlay { position: absolute; top: 2px; right: 2px; font-size: 10px; color: #fff; text-shadow: 0 0 2px black; }
        
        /* CONTEXT MENU (Right click style simulation) */
        #context-menu { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 20px; color: #ccc; font-size: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        
        /* NOTIFICATIONS */
        #notifications { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        .notify-msg { background: rgba(0,0,0,0.7); color: white; padding: 5px 15px; border-radius: 4px; animation: fadeOut 4s forwards; font-weight: bold; font-size: 14px; }
        
        @keyframes fadeOut { 0% {opacity: 0; transform: translateY(-20px);} 10% {opacity: 1; transform: translateY(0);} 80% {opacity: 1;} 100% {opacity: 0; transform: translateY(-10px);} }

        /* VICTORY/DEFEAT SCREEN */
        #end-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
            color: white; font-size: 40px; display: none; 
        }
        #end-screen button { font-size: 24px; padding: 15px 30px; cursor: pointer; margin-top: 20px; }
    </style>
    <!-- THREE.JS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-ui">
        <div id="top-bar">
            <div class="stat-box"><div class="res-icon gold-icon"></div> <span id="gold-disp">0</span></div>
            <div class="stat-box"><div class="res-icon wood-icon"></div> <span id="wood-disp">0</span></div>
            <div class="stat-box">Day <span id="day-disp">1</span></div>
            <div class="stat-box">Health <span id="hp-disp">100%</span></div>
        </div>
        
        <div id="notifications"></div>

        <div id="context-menu">Ready</div>

        <div id="bottom-bar">
            <button class="btn" onclick="game.setMode('build_wall')">
                <span class="btn-label">Wall</span>
                <span class="cost-overlay">30 G</span>
            </button>
            <button class="btn" onclick="game.setMode('build_tower')">
                <span class="btn-label">Tower</span>
                <span class="cost-overlay">100 G</span>
            </button>
            <button class="btn" onclick="game.setMode('recruit_sword')">
                <span class="btn-label">Grunt</span>
                <span class="cost-overlay">40 G</span>
            </button>
            <button class="btn" onclick="game.setMode('recruit_archer')">
                <span class="btn-label">Archer</span>
                <span class="cost-overlay">60 G</span>
            </button>
            <button class="btn disabled" onclick="alert('Hero Unlocked at Day 5!')">
                <span class="btn-label">Hero</span>
                <span class="cost-overlay">200 G</span>
            </button>
             <button class="btn" onclick="game.togglePause()">
                <span class="btn-label">Pause</span>
            </button>
        </div>
    </div>

    <div id="end-screen">
        <div id="end-title">VICTORY</div>
        <div id="end-desc" style="font-size: 20px; margin-bottom: 20px;">The Kingdom is safe.</div>
        <button onclick="location.reload()">Play Again</button>
    </div>

<script>
/**
 * MINISTRY DEFENSE - Core Engine
 * Author: AI Assistant
 * Framework: Vanilla JS + Three.js
 */

// --- CONSTANTS ---
const COLORS = {
    ground: 0x8da649, // Grass green
    wall: 0x556B2F,   // Stone/Green
    tower: 0x444444,  // Dark Grey
    gold: 0xFFD700,
    wood: 0x8B4513,
    tree: 0x0f552c,
    enemy_base: 0x8B0000, // Dark Red
    player_base: 0x008B8B, // Teal
    fog: 0xffffff,
    selection: 0xffff00
};

// GRID SYSTEM
const GRID_SIZE = 100;
const TILE_SIZE = 4;
const UNIT_RADIUS = 1.0;
const COMBAT_RANGE_SWORD = 1.5;
const COMBAT_RANGE_ARCHER = 8;
const COMBAT_RANGE_TOWER = 12;
const VIEWPORT_DIST = 25; // Fog of war radius

// --- UTILS ---
class Vector2 {
    constructor(x, z) { this.x = x; this.z = z; }
    copy(v) { this.x = v.x; this.z = v.z; return this; }
    equals(v) { return Math.abs(this.x - v.x) < 0.1 && Math.abs(this.z - v.z) < 0.1; }
}

function lerp(a, b, t) { return a + (b - a) * t; }
function distSq(v1, v2) { return (v1.x - v2.x)**2 + (v1.z - v2.z)**2; }
function getTileCoord(x, z) {
    const gx = Math.round(x / TILE_SIZE);
    const gz = Math.round(z / TILE_SIZE);
    return new Vector2(gx * TILE_SIZE, gz * TILE_SIZE);
}

// --- ASSET GENERATION (Procedural Models) ---
const MeshCache = {};
function getAsset(name) {
    if (MeshCache[name]) return MeshCache[name];
    
    const geom = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });

    // Generic Cube Builder
    const addBox = (w, h, d, offX, offY, offZ, color=mat) => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), color);
        mesh.position.set(offX, offY, offZ);
        geom.add(mesh);
    };

    if (name === 'player_core') {
        addBox(6, 4, 6, 0, 2, 0, new THREE.MeshLambertMaterial({color: 0x2ca0de}));
        addBox(5, 5, 5, 0, 2.5, 0, new THREE.MeshLambertMaterial({color: 0x0070b0})); // Top spire detail
        // Flag
        const pole = new THREE.Mesh(new THREE.BoxGeometry(0.2, 8, 0.2), darkMat);
        pole.position.y = 6;
        const flag = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 0.2), new THREE.MeshBasicMaterial({color:0xffaa00}));
        flag.position.set(1.1, 6, 0);
        geom.add(pole, flag);
    } else if (name === 'enemy_core') {
         addBox(6, 4, 6, 0, 2, 0, new THREE.MeshLambertMaterial({color: 0xde2c2c}));
         addBox(5, 5, 5, 0, 2.5, 0, new THREE.MeshLambertMaterial({color: 0xb00000}));
    } else if (name === 'wall') {
        addBox(TILE_SIZE, 1.5, TILE_SIZE, 0, 0.75, 0, darkMat);
        addBox(TILE_SIZE*0.8, 1.6, TILE_SIZE*0.8, 0, 0.8, 0, mat);
    } else if (name === 'tower') {
        addBox(3.5, 4, 3.5, 0, 2, 0, darkMat); // Base
        addBox(2.8, 1, 2.8, 0, 4, 0, new THREE.MeshLambertMaterial({color:0x555555})); // Platform
        addBox(1.5, 2, 1.5, 0, 5, 0, new THREE.MeshLambertMaterial({color:0xaaaaaa})); // Tower body
    } else if (name === 'tree') {
        addBox(0.5, 3, 0.5, 0, 1.5, 0, new THREE.MeshLambertMaterial({color:0x5c4033})); // Trunk
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 4), new THREE.MeshLambertMaterial({color:0x2d5a27}));
        leaves.position.y = 3;
        geom.add(leaves);
    } else if (name === 'worker_gold') {
        // Small robot/block figure
        addBox(0.8, 1.2, 0.8, 0, 0.6, 0, new THREE.MeshLambertMaterial({color:0xcccccc})); 
        addBox(0.6, 0.4, 0.6, 0, 0.2, 0, new THREE.MeshLambertMaterial({color:0xffff00}));
        // Tool
        const tool = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 0.1), darkMat);
        tool.rotation.x = Math.PI/3;
        tool.position.set(0.6, 0.8, 0.3);
        geom.add(tool);
    } else if (name === 'worker_wood') {
         addBox(0.8, 1.2, 0.8, 0, 0.6, 0, new THREE.MeshLambertMaterial({color:0xeeeeee}));
         // Axe
         const axeHead = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.3), new THREE.MeshLambertMaterial({color:0xaaaaaa}));
         axeHead.position.set(0.5, 0.8, 0.5);
         axeHead.rotation.z = Math.PI/4;
         const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.8), new THREE.MeshLambertMaterial({color:0x5c4033}));
         handle.position.set(0.5, 0.8, 0.5);
         handle.rotation.x = -Math.PI/2;
         handle.rotation.z = Math.PI/4;
         geom.add(axeHead, handle);
    } else if (name === 'soldier_grunt') {
        // Heavy infantry block
        addBox(0.8, 1.8, 0.8, 0, 0.9, 0, new THREE.MeshLambertMaterial({color:0x4444aa})); // Body
        addBox(0.6, 0.6, 0.6, 0, 1.9, 0, new THREE.MeshLambertMaterial({color:0x8888ff})); // Helmet
        // Shield
        const shield = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.1), new THREE.MeshLambertMaterial({color:0xdddddd}));
        shield.position.set(0.6, 1, 0);
        // Sword
        const sword = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.8, 0.1), new THREE.MeshLambertMaterial({color:0xaaaaff}));
        sword.position.set(0.6, 0.7, -0.2);
        geom.add(shield, sword);
    } else if (name === 'soldier_archer') {
        addBox(0.7, 1.7, 0.7, 0, 0.85, 0, new THREE.MeshLambertMaterial({color:0x44aa44}));
        addBox(0.5, 0.5, 0.5, 0, 1.85, 0, new THREE.MeshLambertMaterial({color:0x88ff88}));
        // Bow
        const bow = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.05, 8, 4), new THREE.MeshLambertMaterial({color:0x8B4513}));
        bow.rotation.z = Math.PI/2;
        bow.position.set(-0.4, 1.2, 0.2);
        // Arrow (simplified as line)
        geom.add(bow);
    }

    // Compile
    const cacheKey = name;
    const renderer = new THREE.WebGLRenderer({ antialias: true }); // dummy init
    // Convert Group to Compiled Geometry for merging benefits? No, just keep as Group for simplicity/speed in this scope.
    MeshCache[cacheKey] = geom;
    return geom;
}


// --- ENGINE CLASSES ---

class GameState {
    constructor() {
        this.gold = 150;
        this.wood = 150;
        this.day = 1;
        this.paused = false;
        this.selectedEntity = null;
        this.mode = null; // 'idle', 'build_x', 'recruit_x'
        this.playerUnits = [];
        this.enemyUnits = [];
        this.buildings = []; // Player buildings
        this.enemyBuildings = [];
        this.bases = []; // Both sides
        this.fogRadius = 12;
        this.gameOver = false;
        
        this.spawnTimer = 0;
        this.enemySpawnRate = 2000;
    }

    reset() {
        this.gold = 200; this.wood = 200; this.day = 1; this.paused = false;
        this.playerUnits = []; this.enemyUnits = [];
        this.buildings = []; this.enemyBuildings = []; this.bases = [];
        this.fogRadius = 12;
        this.gameOver = false;
        this.mode = null;
        this.spawnTimer = 0;
        this.enemySpawnRate = 3000;
        document.getElementById('end-screen').style.display = 'none';
    }
}

class Renderer {
    constructor(game) {
        this.game = game;
        
        // Scene Setup
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0xaaccff); // Sky blue
        this.scene.fog = new THREE.FogExp2(0xaaccff, 0.005);

        // Camera
        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);
        this.camera.position.set(-40, 50, 40);
        this.camera.lookAt(0, 0, 0);

        // Renderer
        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(this.renderer.domElement);

        // Lighting
        this.lightDir = new THREE.DirectionalLight(0xffffff, 1.2);
        this.lightDir.position.set(-50, 80, 50);
        this.lightDir.castShadow = true;
        this.lightDir.shadow.mapSize.width = 2048;
        this.lightDir.shadow.mapSize.height = 2048;
        this.scene.add(this.lightDir);
        
        this.lightAmb = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(this.lightAmb);

        // Ground Plane
        this.geometryGround = new THREE.PlaneGeometry(GRID_SIZE*TILE_SIZE+50, GRID_SIZE*TILE_SIZE+50);
        this.materialGround = new THREE.MeshStandardMaterial({ color: COLORS.ground, roughness: 1.0 });
        this.ground = new THREE.Mesh(this.geometryGround, this.materialGround);
        this.ground.rotation.x = -Math.PI / 2;
        this.ground.receiveShadow = true;
        this.scene.add(this.ground);

        // Decor: Trees
        this.trees = [];
        const treeModel = getAsset('tree');
        for(let i=0; i<40; i++) {
            const mesh = new THREE.Mesh(treeModel.scale(0.5, 0.5, 0.5), treeModel.children[1].material); // Get leaf material
            mesh.position.set((Math.random()-0.5)*800, 0, (Math.random()-0.5)*800);
            
            // Simple exclusion zone around bases
            if(Math.abs(mesh.position.x) < 15 || Math.abs(mesh.position.z) < 15) continue;
            
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            this.scene.add(mesh);
            this.trees.push(mesh);
        }

        // Selection Ring
        const ringGeo = new THREE.RingGeometry(1.2, 1.5, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
        this.selectionRing = new THREE.Mesh(ringGeo, ringMat);
        this.selectionRing.rotation.x = -Math.PI/2;
        this.selectionRing.visible = false;
        this.scene.add(this.selectionRing);

        // Pointer Events
        window.addEventListener('resize', () => this.onResize());
        this.canvas = this.renderer.domElement;
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();

        // Input Handling
        this.canvas.addEventListener('mousemove', e => {
            this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        this.canvas.addEventListener('mousedown', e => this.handleClick(e));

        // Animation Loop
        this.clock = new THREE.Clock();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
    }

    onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }

    getGridPosition(event) {
        this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        this.raycaster.setFromCamera(this.mouse, this.camera);
        
        const intersects = this.raycaster.intersectObject(this.ground);
        if (intersects.length > 0) {
            const pt = intersects[0].point;
            return { x: pt.x, z: pt.z };
        }
        return null;
    }

    handleClick(e) {
        if(this.game.paused) return;
        if(e.button === 2) return; // Ignore right click for command (handled by CSS/UI logic mostly)

        const pos = this.getGridPosition(e);
        if(!pos) return;

        // Check selected entity first for Movement
        if (this.game.selectedEntity && this.game.selectedEntity.type !== 'base') {
            const action = (e.ctrlKey || e.metaKey) ? 'attack_move' : 'move';
            this.game.selectedEntity.order(action, new Vector2(pos.x, pos.z));
        }

        // Update UI Context based on what was clicked
        let clickedObj = null;
        // Check Units
        [...this.game.playerUnits, ...this.game.enemyUnits].forEach(u => {
            if(distSq(u.pos, new Vector2(pos.x, pos.z)) < 25) clickedObj = u;
        });
        // Check Buildings
        [...this.game.buildings, ...this.game.enemyBuildings].forEach(b => {
            if(distSq(b.pos, new Vector2(pos.x, pos.z)) < 10) clickedObj = b;
        });
        if(clickedObj === null) [this.game.bases[0], this.game.bases[1]].forEach(b => {
            if(distSq(b.pos, new Vector2(pos.x, pos.z)) < 20) clickedObj = b;
        });

        this.game.selectEntity(clickedObj);
    }

    animate() {
        requestAnimationFrame(this.animate);
        
        const dt = this.clock.getDelta();
        if(!this.game.paused && !this.game.gameOver) {
            this.game.update(dt);
        }

        // Smooth Camera Follow Base if idle-ish
        // Not implemented for strict RTS controls to avoid confusion, but kept optional.

        this.renderer.render(this.scene, this.camera);
    }
}

class Entity {
    constructor(scene, type, faction, pos) {
        this.id = Math.random().toString(36).substr(2, 9);
        this.scene = scene;
        this.type = type; // 'core', 'building', 'unit'
        this.faction = faction; // 'player', 'enemy'
        this.pos = pos;
        this.targetPos = null;
        this.state = 'idle'; // idle, move, gather, attack, build
        this.targetEntity = null;
        
        // Stats
        this.maxHp = 100;
        this.hp = 100;
        this.speed = 3;
        this.radius = 1;
        
        // Assets
        this.meshGroup = getAsset(type);
        this.meshGroup.traverse(c => { if(c.isMesh) c.castShadow = true; });
        this.meshGroup.userData = { owner: this };
        this.meshGroup.position.copy(pos);
        this.scene.add(this.meshGroup);

        // Specific Overrides
        if(type === 'ground_unit') this.setupUnitProps();
        if(type === 'building') this.setupBuildingProps();
    }

    setupUnitProps() {} // Overridden
    setupBuildingProps() {} // Overridden

    takeDamage(amount) {
        this.hp -= amount;
        // Damage flash could happen here
        if(this.hp <= 0) this.destroy();
    }

    destroy() {
        // Remove from lists handled by caller
        this.scene.remove(this.meshGroup);
    }

    moveTo(pos) {
        this.state = 'move';
        this.targetPos = pos;
    }

    update(dt) {
        // Physics / Movement Interpolation
        if(this.targetPos && this.state === 'move') {
            const dir = new THREE.Vector2(this.targetPos.x - this.pos.x, this.targetPos.z - this.pos.z);
            const dist = dir.length();
            
            if(dist < 0.2) {
                this.pos.copy(this.targetPos);
                this.targetPos = null;
                this.state = 'idle';
            } else {
                dir.normalize();
                dir.multiplyScalar(this.speed * dt);
                this.pos.add(dir);
                this.meshGroup.position.copy(this.pos);
                
                // Face direction
                const angle = Math.atan2(this.pos.x - this.targetPos.x, this.pos.z - this.targetPos.z);
                this.meshGroup.rotation.y = angle;
            }
        }
    }
}

class Base extends Entity {
    constructor(scene, faction, pos) {
        super(scene, faction==='player'?'player_core':'enemy_core', faction, pos);
        this.type = 'base';
        this.radius = 5;
        this.maxHp = 1000;
        this.hp = 1000;
        this.minePos = null;
        this.lumberPos = null;
        
        // Assign Resources nearby
        if(faction === 'player') {
            this.minePos = new Vector2(60, 0);
            this.lumberPos = new Vector2(-60, 0);
        } else {
            this.minePos = new Vector2(-60, 0);
            this.lumberPos = new Vector2(60, 0);
        }

        // Create visual marker for resources
        const resGeo = new THREE.CircleGeometry(2, 16);
        const color = faction==='player'?COLORS.gold:COLORS.tree;
        const resMat = new THREE.MeshBasicMaterial({color: color});
        
        const mMesh = new THREE.Mesh(resGeo, resMat);
        mMesh.position.set(this.minePos.x, 0.5, this.minePos.z);
        scene.add(mMesh);
        mMesh.userData = { owner: this, type: 'gold' };

        const wMesh = new THREE.Mesh(resGeo, resMat);
        wMesh.position.set(this.lumberPos.x, 0.5, this.lumberPos.z);
        wMesh.material.color.setHex(COLORS.tree); // Override
        scene.add(wMesh);
        wMesh.userData = { owner: this, type: 'wood' };
    }

    update(dt) {
        if (this.state === 'gather_gold' || this.state === 'gather_wood') {
             // If no worker assigned, don't do anything visually unless we want animated idle
        }
        // Keep mesh synced
        this.meshGroup.position.copy(this.pos);
    }
}

class Structure extends Entity {
    constructor(scene, faction, pos, subtype) {
        super(scene, subtype==='wall'?'wall':'tower', faction, pos);
        this.subtype = subtype;
        this.type = 'structure';
        this.health = subtype==='wall'?50:150;
        this.maxHp = this.health;
        this.radius = 1.5;

        if(subtype === 'tower') {
            this.range = COMBAT_RANGE_TOWER;
            this.dps = 2;
            this.attackCd = 0.5;
        } else {
            this.range = 0;
            this.dps = 0;
        }
    }

    update(dt) {
        this.meshGroup.position.copy(this.pos);
        
        if(this.subtype === 'tower') {
            // Check for enemies
            const enemies = this.game.enemyUnits.filter(e => distSq(this.pos, e.pos) < this.range**2);
            if(enemies.length > 0) {
                const target = enemies[0];
                this.attackCooldown -= dt;
                if(this.attackCooldown <= 0) {
                    this.shoot(target);
                    this.attackCooldown = 1.0 / (this.dps / 2); // Scaled DPS
                }
            }
        }
    }

    shoot(target) {
        // Projectile visual
        const geo = new THREE.SphereGeometry(0.2);
        const mat = new THREE.MeshBasicMaterial({color:0xff0000});
        const proj = new THREE.Mesh(geo, mat);
        proj.position.copy(this.pos);
        proj.position.y += 1;
        this.scene.add(proj);
        
        // Animate projectile
        let progress = 0;
        const speed = 20;
        const start = this.pos.clone();
        const end = target.pos.clone();
        const vec = new THREE.Vector3(end.x-start.x, 2, end.z-start.z).normalize();
        
        const animProj = () => {
            progress += speed * 0.016;
            proj.position.x += vec.x;
            proj.position.z += vec.z;
            if(progress < 1) {
                requestAnimationFrame(animProj);
            } else {
                this.scene.remove(proj);
                target.takeDamage(5); // Damage dealt
            }
        };
        animProj();
    }
}

class Unit extends Entity {
    constructor(scene, faction, subtype) {
        const assetName = faction === 'player' ? 
            (subtype==='grunt'?'soldier_grunt':subtype==='archer'?'soldier_archer':'worker_gold')
            : 'soldier_grunt'; // Enemy looks like grunts for now
        
        super(scene, 'ground_unit', faction, new Vector2(0,0));
        this.type = 'unit';
        this.subtype = subtype;
        this.role = faction === 'enemy' ? 'enemy' : (subtype==='miner'?'miner':'combat');
        
        // Reset Position based on faction
        if(faction === 'player') {
            this.meshGroup.position.set(8,0,-8);
            this.pos.set(8, -8);
        } else {
            this.meshGroup.position.set(-8,0,8);
            this.pos.set(-8, 8);
        }
        this.targetPos = null;

        // Stats
        if(subtype === 'miner') {
            this.maxHp = 30; this.hp = 30; this.speed = 2.5;
            this.radius = 0.6;
            this.role = 'miner';
        } else if (subtype === 'grunt') {
            this.maxHp = 100; this.hp = 100; this.speed = 3.0;
            this.radius = 0.7; this.role = 'combat';
            this.meleeRange = COMBAT_RANGE_SWORD;
            this.damage = 5;
        } else if (subtype === 'archer') {
            this.maxHp = 60; this.hp = 60; this.speed = 2.5;
            this.radius = 0.7; this.role = 'combat';
            this.rangedRange = COMBAT_RANGE_ARCHER;
            this.damage = 4;
        } else if (subtype === 'hero') {
            this.maxHp = 400; this.hp = 400; this.speed = 3.2;
            this.radius = 1.2; this.role = 'combat';
            this.damage = 20;
        }
        
        // Asset override
        this.meshGroup = getAsset(assetName);
        this.meshGroup.traverse(c => { if(c.isMesh) c.castShadow = true; });
        this.meshGroup.position.copy(this.pos);
        // Scale slightly
        this.meshGroup.scale.set(0.8, 0.8, 0.8);
        
        this.attackCd = 0;
    }

    update(dt) {
        // Priority Order: Move, Gather, Attack
        if(this.state === 'move') {
            // Standard move logic in Entity.update
            this.moveTo(this.targetPos);
            // Just calling parent method isn't enough because we need to handle stopping if in range
            // We manually update movement here for finer control
            
            if(this.targetPos && distSq(this.pos, this.targetPos) > 1) {
                 const dir = new THREE.Vector2(this.targetPos.x - this.pos.x, this.targetPos.z - this.pos.z);
                 const dist = dir.length();
                 dir.normalize();
                 dir.multiplyScalar(this.speed * dt);
                 
                 // Collision Avoidance (Simple repulsion)
                 const others = this.game.playerUnits.concat(this.game.enemyUnits);
                 for(let o of others) {
                     if(o === this) continue;
                     const d = distSq(this.pos, o.pos);
                     if(d < 4) { // Too close
                         dir.divideScalar(2); // Back off
                     }
                 }

                 this.pos.add(dir);
                 this.meshGroup.position.copy(this.pos);
                 const angle = Math.atan2(this.pos.x - this.targetPos.x, this.pos.z - this.targetPos.z);
                 this.meshGroup.rotation.y = angle;
            } else {
                this.state = 'idle';
                this.targetPos = null;
                
                // If arrived at gather point or base, start working
                if(this.role === 'miner') {
                   this.work();
                }
            }
            return; 
        }

        // Combat Logic
        if(this.state === 'combat') {
            this.attackCd -= dt;
            if(this.attackCd <= 0 && this.targetEntity) {
                if(!this.targetEntity.meshGroup.parent) return; // Gone
                
                // Distance check
                const d = distSq(this.pos, this.targetEntity.pos);
                
                // Range check
                let canHit = false;
                if(this.subtype === 'grunt' || this.subtype === 'hero') {
                    if(d <= this.meleeRange**2) canHit = true;
                } else if (this.subtype === 'archer') {
                    if(d <= this.rangedRange**2) canHit = true;
                }

                if(canHit) {
                    this.attack();
                    this.attackCd = 1.2; // Cooldown
                } else {
                    // Move closer
                    const dir = new Vector2(this.targetEntity.pos.x - this.pos.x, this.targetEntity.pos.z - this.pos.z);
                    dir.normalize();
                    dir.multiplyScalar(this.speed * dt);
                    this.pos.add(dir);
                    this.meshGroup.position.copy(this.pos);
                    const angle = Math.atan2(this.pos.x - this.targetEntity.pos.x, this.pos.z - this.targetEntity.pos.z);
                    this.meshGroup.rotation.y = angle;
                }
            }
        } else if (this.state === 'work_gather') {
            // Mining Animation Effect
            this.attackCd -= dt;
            if(this.attackCd <= 0) {
                this.attack(); // Reuse attack function for mining effect
                this.attackCd = 1.5;
            }
        }
    }

    work() {
        // Go to mine/lumber
        if(this.role === 'miner') {
            const base = this.game.bases.find(b => b.faction === this.faction);
            // Randomize between mine and lumber
            const job = Math.random() > 0.5 ? 'gold' : 'wood';
            
            let targetPos = job==='gold'?base.minePos:base.lumberPos;
            
            // Add slight offset so they cluster differently
            const jitter = (Math.random()-0.5)*4;
            
            this.moveTo(new Vector2(targetPos.x + jitter, targetPos.z + jitter));
            this.state = 'work_gather'; // Wait for 'arrive' in update
        }
    }

    attack() {
        // Visual
        const damageText = document.createElement('div');
        damageText.style.position = 'absolute';
        damageText.style.color = '#ff5555';
        damageText.style.fontWeight = 'bold';
        damageText.style.pointerEvents = 'none';
        document.body.appendChild(damageText);

        if(this.role === 'miner') {
            // Give resources
            if(this.faction === 'player') {
                this.game.gold += 0.5;
                this.game.wood += 0.5;
            }
            // Hide DOM element immediately (simple hack)
            setTimeout(() => damageText.remove(), 200);
            return;
        }

        // Deal damage to Target
        if(this.targetEntity) {
            const dmgStr = this.subtype==='archer'?this.damage+"!":(this.subtype==='hero'?this.damage*"2":"!");
            this.targetEntity.takeDamage(this.damage);
            
            // Floating Text
            const rect = this.scene.domElement.getBoundingClientRect();
            damageText.innerText = dmgStr;
            damageText.style.left = (rect.left + this.meshGroup.position.x + 20) + 'px';
            damageText.style.top = (rect.top + this.meshGroup.position.y - 50) + 'px';
            setTimeout(() => damageText.remove(), 1000);
        }
    }
}

class Game {
    constructor() {
        this.state = new GameState();
        this.renderer = new Renderer(this);
        
        this.initLevel();
        
        // Init UI events
        document.addEventListener('contextmenu', event => event.preventDefault());
    }

    initLevel() {
        this.bases = [];
        this.bases.push(new Base(this.renderer.scene, 'player', new Vector2(-10, -10)));
        this.bases.push(new Base(this.renderer.scene, 'enemy', new Vector2(10, 10)));

        // Initial Workers
        this.spawnMiner('player');
        this.spawnMiner('player');
        this.spawnMiner('player');
    }

    update(dt) {
        // Economy Tick (every frame adds small amounts)
        if(this.state.day % 10 === 0) {
             this.notify(`Day ${this.state.day}`);
             this.state.enemySpawnRate *= 0.9; // Scaling difficulty
        }

        // Spawn Enemy Units
        this.state.spawnTimer += dt * 1000;
        if(this.state.spawnTimer > this.state.enemySpawnRate) {
            this.spawnEnemyWave();
            this.state.spawnTimer = 0;
        }

        // Update Entities
        [...this.state.playerUnits, ...this.state.enemyUnits].forEach(u => u.update(dt));
        [...this.state.buildings, ...this.state.enemyBuildings].forEach(b => b.update(dt));
        
        // Sync Viewport
        this.renderer.fogDist = this.state.fogRadius; // Not used yet but good placeholder
        this.updateUI();

        // Victory / Defeat
        const playerBase = this.bases[0];
        const enemyBase = this.bases[1];
        
        if(enemyBase.hp <= 0) this.endGame(true);
        if(playerBase.hp <= 0) this.endGame(false);
    }

    spawnMiner(faction) {
        this.state.playerUnits.push(new Unit(this.renderer.scene, faction, 'miner'));
    }

    spawnEnemyWave() {
        // Spawn logic based on day
        const count = Math.ceil(this.state.day / 2);
        for(let i=0; i<count; i++) {
            const type = Math.random() > 0.7 ? 'archer' : 'grunt';
            const u = new Unit(this.renderer.scene, 'enemy', type);
            
            // Randomly place them near their base, then send towards us
            const offset = new Vector2(
                (Math.random()-0.5)*15, 
                (Math.random()-0.5)*15
            );
            u.pos.add(offset);
            u.targetPos = this.bases[0].pos; // Target player core
            u.state = 'move';
            this.state.enemyUnits.push(u);
        }
    }

    spawnBuilding(faction, type, pos) {
        if(type === 'wall') {
            const b = new Structure(this.renderer.scene, faction, pos, 'wall');
            this.state.buildings.push(b);
        } else if (type === 'tower') {
            const b = new Structure(this.renderer.scene, faction, pos, 'tower');
            this.state.buildings.push(b);
        }
    }

    selectEntity(entity) {
        if(entity === this.state.selectedEntity) return;
        
        if(this.state.selectedEntity) {
            this.renderer.selectionRing.visible = false;
        }
        
        this.state.selectedEntity = entity;
        if(entity) {
            this.renderer.selectionRing.visible = true;
            this.renderer.selectionRing.position.set(entity.pos.x, 0.1, entity.pos.z);
            this.updateContext(entity);
        }
    }

    updateContext(entity) {
        const menu = document.getElementById('context-menu');
        if(!entity) {
            menu.innerText = "Click empty area";
            menu.style.opacity = 1;
            return;
        }
        if(entity.type === 'unit') {
            menu.innerText = `${entity.subtype.toUpperCase()} | HP:${Math.floor(entity.hp)}`;
        } else if (entity.type === 'base') {
            menu.innerText = `CORE | HP:${Math.floor(entity.hp)}`;
        }
        menu.style.opacity = 1;
    }

    setMode(mode) {
        // Mode handling: build or recruit
        const costs = {
            'build_wall': {g:30, w:0},
            'build_tower': {g:100, w:0},
            'recruit_sword': {g:40, w:0},
            'recruit_archer': {g:60, w:0}
        };
        
        const cost = costs[mode];
        if(this.state.gold >= cost.g) {
            this.state.gold -= cost.g;
            this.state.mode = mode;
            this.renderer.selectionRing.visible = false; // Clear selection for placement
            this.state.selectedEntity = null;
            this.notify("Select location");
        } else {
            this.notify("Not enough Gold!");
        }
    }

    notify(msg) {
        const el = document.createElement('div');
        el.className = 'notify-msg';
        el.innerText = msg;
        document.getElementById('notifications').appendChild(el);
        setTimeout(() => el.remove(), 4000);
    }

    updateUI() {
        document.getElementById('gold-disp').innerText = Math.floor(this.state.gold);
        document.getElementById('wood-disp').innerText = Math.floor(this.state.wood);
        document.getElementById('day-disp').innerText = Math.ceil(this.state.day);
        const pBase = this.bases[0];
        const hpPct = Math.max(0, Math.floor(pBase.hp/pBase.maxHp*100));
        document.getElementById('hp-disp').innerText = hpPct + "%";
        
        // Buttons
        document.querySelectorAll('.btn').forEach(btn => {
            // Could disable based on resources here
        });
    }

    togglePause() {
        this.state.paused = !this.state.paused;
    }

    endGame(win) {
        this.state.gameOver = true;
        const screen = document.getElementById('end-screen');
        const title = document.getElementById('end-title');
        screen.style.display = 'flex';
        if(win) {
            title.innerText = "VICTORY";
            title.style.color = "#44ff44";
        } else {
            title.innerText = "DEFEAT";
            title.style.color = "#ff4444";
        }
    }
}

// Start Game
window.onload = () => {
    window.game = new Game();
};
