                document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('selected'));
                updateSelectionPanel();
            }
            
            // Number keys for quick actions
            // Can be expanded
        });

        // ============ GAME FLOW ============
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            
            // Reset state
            const diffConfig = CONFIG.DIFFICULTY[gameState.difficulty];
            gameState = {
                ...gameState,
                running: true,
                resources: { gold: 150, wood: 100, food: 80, crystal: 0 },
                population: { current: 3, max: 10 },
                time: { day: 1, progress: 0.25, isNight: false },
                waves: { current: 0, maxWaves: diffConfig.waveCount, timer: 0, attackInProgress: false },
                kills: 0,
                selectedBuildMode: null,
                selectedUnits: [],
                buildings: [],
                playerUnits: [],
                enemyUnits: [],
                projectiles: [],
                particles: [],
                heroAbilities: { rally: 0, heal: 0, blaze: 0 }
            };
            
            // Spawn initial town hall
            const townHall = createBuilding('townhall', 0, 0, true);
            gameState.buildings.push(townHall);
            
            // Initial peasants
            for (let i = 0; i < 3; i++) {
                const angle = (i / 3) * Math.PI * 2;
                const px = Math.cos(angle) * 3;
                const pz = Math.sin(angle) * 3;
                const peasant = createUnit('peasant', px, pz, true);
                if (peasant) gameState.playerUnits.push(peasant);
            }
            
            showAlert('Kingdom established! Defend against the coming waves.', 'info');
            
            updateUI();
            
            // Start first wave after delay
            setTimeout(() => {
                startWave(1);
            }, 10000);
        }

        function endGame(victory) {
            gameState.running = false;
            
            const screen = document.getElementById('end-screen');
            const title = screen.querySelector('.end-title');
            const stats = screen.querySelector('.end-stats');
            
            title.textContent = victory ? 'Victory!' : 'Defeated';
            title.className = 'end-title ' + (victory ? 'victory' : 'defeat');
            
            stats.innerHTML = `
                Days Survived: ${gameState.time.day}<br>
                Waves Completed: ${gameState.waves.current}/${gameState.waves.maxWaves}<br>
                Enemies Slain: ${gameState.kills}<br>
                Buildings Constructed: ${gameState.buildings.length}
            `;
            
            screen.classList.add('visible');
        }

        function restartGame() {
            // Clear all entities
            [...gameState.playerUnits, ...gameState.enemyUnits, ...gameState.buildings].forEach(obj => {
                scene.remove(obj);
            });
            gameState.projectiles.forEach(p => scene.remove(p));
            gameState.particles.forEach(p => scene.remove(p));
            
            document.getElementById('end-screen').classList.remove('visible');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        // ============ MAIN GAME LOOP ============
        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            delta = clock.getDelta();
            deltaTime = Math.min(delta, 0.1); // Cap delta to prevent jumps
            
            if (gameState.running) {
                updateDayNightCycle(deltaTime);
                updateResources(deltaTime);
                updateUnits(deltaTime);
                updateProjectiles(deltaTime);
                updateParticles(deltaTime);
                
                // Update ability cooldowns
                Object.keys(gameState.heroAbilities).forEach(key => {
                    if (gameState.heroAbilities[key] > 0) {
                        gameState.heroAbilities[key] = Math.max(0, gameState.heroAbilities[key] - deltaTime);
                    }
                });
                if (document.getElementById('ability-bar').classList.contains('visible')) {
                    updateAbilityBar();
                }
                
                // Check wave completion
                if (gameState.waves.attackInProgress && gameState.enemyUnits.length === 0) {
                    gameState.waves.attackInProgress = false;
                    
                    if (gameState.waves.current >= gameState.waves.maxWaves) {
                        endGame(true);
                    } else {
                        showAlert(`Wave ${gameState.waves.current} defeated! Prepare for the next assault.`, 'success');
                    }
                }
                
                updateUI();
                updateMinimap();
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // ============ INITIALIZATION ============
        async function init() {
            clock = new THREE.Clock();
            
            initThree();
            generateTerrain();
            initUI();
            
            // Hide loading
            document.getElementById('loading').style.display = 'none';
            
            // Start render loop
            gameLoop();
        }

        init().catch(console.error);
    </script>
</body>
</html>
